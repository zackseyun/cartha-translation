  source_fidelity: 'Die Übersetzung gibt die Listenstruktur und sämtliche Sinnelemente des Hebräischen zutreffend wieder: die Zugehörigkeit zur Linie Schefatjas, Sebadja als Sohn Michaels, die Begleitung durch achtzig Personen sowie deren ausdrückliche Kennzeichnung als männlich. „Nachkommen“ ist für בְּנֵי in diesem genealogischen Zusammenhang eine sachgerechte, nicht zu enge Wiedergabe.'
  naturalness: Die Formulierung ist modernes Standarddeutsch und für eine genealogische Liste würdevoll. „Männliche Personen“ ist etwas formeller als „Männer“, bewahrt aber angemessen die im Hebräischen ausdrücklich gesetzte Geschlechtsmarkierung, ohne ungesichert ein Erwachsenenalter vorauszusetzen.
  terminology: Die Namensformen Schefatja, Sebadja und Michael sind im Deutschen etablierte biblische Schreibungen. „Sohn Michaels“ gibt die unmittelbare genealogische Verbindung präzise wieder. Es sind keine theologischen Fachbegriffe betroffen.
