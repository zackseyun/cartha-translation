source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֣י שְׁפַטְיָ֔ה זְבַדְיָ֖ה בֶּן מִֽיכָאֵ֑ל וְ/עִמּ֖/וֹ שְׁמֹנִ֥ים הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/008.yaml
  text: 'And from the sons of Shephatiah: Zebadiah son of Michael[a], and with him eighty males.'
translation:
  language: de
  text: 'Und von den Nachkommen Schefatjas: Sebadja, der Sohn Michaels, und mit ihm achtzig männliche Personen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Und von den Nachkommen
  rationale: Wörtlich steht hier »und von den Söhnen«. In dieser Namensliste bezeichnet בְּנֵי jedoch eine größere Abstammungs- oder Sippenlinie; »Nachkommen« gibt den gemeinten Bezug im modernen Deutschen natürlich und präzise wieder.
- source_word: שְׁפַטְיָה
  choice: Schefatja
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition aus dem Hebräischen transkribiert.
- source_word: זְבַדְיָה
  choice: Sebadja
  rationale: Der Personenname wird in einer im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: Bei der unmittelbaren Verbindung zweier Personennamen ist die gewöhnliche Bedeutung »Sohn« am naheliegendsten.
- source_word: מִיכָאֵל
  choice: Michaels
  rationale: Der Personenname wird in seiner geläufigen deutschen Form gebraucht; der Genitiv gibt die hebräische Verbindung mit בֶּן natürlich wieder.
- source_word: וְ/עִמּוֹ
  choice: und mit ihm
  rationale: Die Konjunktion und die Begleitformulierung werden beibehalten, da sie die wiederkehrende Struktur der Liste markieren.
- source_word: שְׁמֹנִים
  choice: achtzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: הַזְּכָרִים
  choice: männliche Personen
  rationale: Das hebräische Wort bezeichnet ausdrücklich Personen männlichen Geschlechts, ohne ihr Alter oder ihren gesellschaftlichen Status festzulegen. »Männliche Personen« ist im Deutschen genauer und weniger missverständlich als »Männer«.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Listensprache. »Nachkommen« vermeidet das im Deutschen leicht missverständliche wörtliche »Söhne«, während »männliche Personen« die geschlechtsspezifische Aussage des Hebräischen bewahrt.
