base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/025.yaml
  text: And I weighed out to them the silver[a], the gold, and the vessels—the contribution for the house of our God that the king, his counselors, his officials, and all Israel who were present had offered.
translation:
  language: de
  text: Dann wog ich ihnen das Silber, das Gold und die Geräte ab – die Gabe[a] für das Haus unseres Gottes, die der König, seine Ratgeber und seine Amtsträger sowie alle anwesenden Israeliten gestiftet hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Beitrag“. Das hebräische Wort bezeichnet eine Gabe, die besonders für einen heiligen Zweck ausgesondert wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֳלָה לָהֶם
  choice: Dann wog ich ihnen … ab
  rationale: שׁקל bezeichnet das Wiegen; mit לָהֶם geht es hier um das Abwiegen und Aushändigen der Kostbarkeiten an die Empfänger. „Abwiegen“ ist im Deutschen natürlich und wahrt den konkreten Vorgang.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: das Silber, das Gold
  rationale: Da beide Begriffe als wertvolle Materialien neben den Geräten genannt werden, ist „Silber“ statt „Geld“ sachlich angemessen.
- source_word: הַכֵּלִים
  choice: die Geräte
  rationale: כֵּלִים ist ein weiter Ausdruck für Gegenstände oder Gerätschaften. „Geräte“ passt zum Tempelkontext, ohne die Art der Gegenstände enger festzulegen.
- source_word: תְּרוּמַת
  choice: die Abgabe
  rationale: תְּרוּמָה bezeichnet hier eine für einen heiligen Zweck ausgesonderte und übergebene Gabe. „Abgabe“ gibt den Charakter einer bereitgestellten Zuwendung wieder; „Gabe“ oder „Beitrag“ bleiben mögliche Alternativen.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: das Haus unseres Gottes
  rationale: Die Wiedergabe bewahrt das hebräische Bild vom „Haus“ Gottes, obwohl sachlich der Tempel gemeint ist.
- source_word: הֵרִימוּ
  choice: gestiftet hatten
  rationale: Das Hifil von רום kann bei einer תְּרוּמָה das Darbringen oder Bereitstellen einer heiligen Gabe bezeichnen. „Gestiftet“ ist in diesem Zusammenhang idiomatisch und lässt die vorangegangene Zuwendung erkennen.
- source_word: יֹעֲצָיו וְשָׂרָיו
  choice: seine Ratgeber und seine Amtsträger
  rationale: יֹעֲצִים sind beratende Personen; שָׂרִים bezeichnet im persischen Verwaltungskontext hochgestellte Funktionsträger, ohne zwingend königliche Abstammung zu meinen.
- source_word: וְכָל יִשְׂרָאֵל הַנִּמְצָאִים
  choice: sowie alle anwesenden Israeliten
  rationale: Die kollektive Wendung „ganz Israel“ wird hier zusammen mit dem pluralischen Partizip auf die tatsächlich anwesenden Angehörigen Israels bezogen. Die deutsche Formulierung ist klar und bewahrt diese Einschränkung.
theological_decisions:
- issue: Kultischer Ausdruck תְּרוּמָה im Zusammenhang mit Tempelgaben
  choice: die Abgabe
  alternative: die Gabe; der Beitrag; das Hebopfer
  rationale: Der Kontext handelt von Silber, Gold und Geräten, die für Gottes Haus bereitgestellt wurden. „Abgabe“ wahrt den Gedanken einer ausgesonderten Zuwendung, ohne eine bestimmte Opferhandlung vorauszusetzen; die mögliche kultische Färbung wird in der Fußnote kenntlich gemacht.
- issue: Wiedergabe von בֵּית אֱלֹהֵינוּ
  choice: das Haus unseres Gottes
  alternative: der Tempel unseres Gottes
  rationale: „Haus unseres Gottes“ folgt dem Bild des Ausgangstextes und lässt dessen theologische Ausdrucksweise stehen. „Tempel“ wäre sachlich zutreffend, aber stärker auslegend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich macht deutlich, dass Silber, Gold und Geräte gemeinsam die Abgabe für Gottes Haus bilden. Die Vorvergangenheit „gestiftet hatten“ bildet ab, dass die Stiftung dem Abwiegen vorausging.
