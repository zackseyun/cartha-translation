  text: וְ/אֶת חֲשַׁבְיָ֔ה וְ/אִתּ֥/וֹ יְשַֽׁעְיָ֖ה מִ/בְּנֵ֣י מְרָרִ֑י אֶחָ֥י/ו וּ/בְנֵי/הֶ֖ם עֶשְׂרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/019.yaml
  text: and Hashabiah[a], and with him Jeshaiah, from the sons of Merari, his brothers and their sons, twenty[b];
translation:
  language: de
  text: und Haschabja und mit ihm Jeschaja von den Nachkommen Meraris, seine Brüder[a] und ihre Söhne, insgesamt zwanzig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüder“ können hier auch männliche Verwandte oder Angehörige derselben Sippe innerhalb der Linie Meraris gemeint sein, nicht nur leibliche Brüder.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֶת חֲשַׁבְיָה
  choice: außerdem Haschabja
  rationale: Die Konjunktion mit dem Akkusativzeichen setzt die Aufzählung der herbeigebrachten Personen aus dem vorherigen Vers fort. „Außerdem“ macht diese Fortsetzung im Deutschen natürlich deutlich; der Personenname wird in üblicher deutscher Form wiedergegeben.
- source_word: וְאִתּוֹ יְשַׁעְיָה
  choice: und mit ihm Jeschaja
  rationale: Die Präposition mit Suffix bezeichnet Begleitung; die hebräische Koordination bleibt erhalten. „Jeschaja“ unterscheidet diesen Namen entsprechend deutscher Bibeltradition von der geläufigen Form „Jesaja“.
- source_word: מִבְּנֵי מְרָרִי
  choice: von den Nachkommen Meraris
  rationale: Wörtlich steht „von den Söhnen Meraris“. Im genealogischen Zusammenhang bezeichnet בנים jedoch die Abstammungslinie; „Nachkommen“ gibt die Bedeutung im heutigen Deutsch klar und ohne biologische Verengung wieder.
- source_word: אֶחָיו
  choice: seine Brüder
  rationale: Das gewöhnliche Wort für „Brüder“ mit maskulinem Singularsuffix wird formal bewahrt. Der Kontext lässt eine weitere Bedeutung als männliche Verwandte oder Sippenangehörige zu, die in der Fußnote erläutert wird.
- source_word: וּבְנֵיהֶם
  choice: und ihre Söhne
  rationale: Die maskuline Pluralform bedeutet hier in der genealogischen Liste am natürlichsten „ihre Söhne“; das Pluralsuffix bezieht sich auf die zuvor genannte Gruppe.
- source_word: עֶשְׂרִים
  choice: zwanzig
  rationale: Die Kardinalzahl wird ausgeschrieben und bezeichnet am natürlichsten die Gesamtzahl der unmittelbar zuvor genannten Brüder und Söhne.
theological_decisions: []
translation_notes:
