  verdict: revise
  source_fidelity: Der Entwurf gibt die Personen, die Zugehörigkeit zur meraritischen Linie sowie die Zahl zutreffend wieder. Die Formulierung „außerdem“ ist jedoch eine unnötig interpretierende Verstärkung der bloßen Fortsetzungskonjunktion. Zudem sollte die Zahl als Gesamtzahl syntaktisch klarer an die genannte Gruppe angeschlossen werden.
  naturalness: „Seine Brüder und ihre Söhne, zwanzig“ ist im modernen Deutschen als Listenfortsetzung zwar verständlich, aber holprig. „… insgesamt zwanzig“ bewahrt den knappen Listenstil und macht den Zahlenbezug deutlich.
  terminology: „Haschabja“, „Jeschaja“ und „Merari“ sind im Deutschen gebräuchliche und passende Namensformen. „Nachkommen Meraris“ ist als idiomatische Wiedergabe von „Söhnen Meraris“ angemessen. Die Fußnote zu „Brüder“ bewahrt die im Kontext mögliche weitere Verwandtschaftsbedeutung, ohne sie in den Text hineinzulesen.
  issues:
