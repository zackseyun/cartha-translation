  - severity: medium
    issue: Der Bezug von „zwanzig“ ist im deutschen Satzbau nicht klar genug.
    rationale: Die Zahl bezeichnet offenbar die unmittelbar genannte Personengruppe. „Insgesamt zwanzig“ stellt diesen Gesamtbezug klar, ohne den hebräischen Text weitergehend zu bestimmen.
  revised_text: und Haschabja und mit ihm Jeschaja von den Nachkommen Meraris, seine Brüder[a] und ihre Söhne, insgesamt zwanzig.
