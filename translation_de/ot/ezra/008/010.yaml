  yaml_path: translation/ot/ezra/008/010.yaml
  text: And from the sons of Shelomith[a], the son of Josiphiah, and with him 160 males.
translation:
  language: de
  text: 'Und von den Söhnen Schelomits[a], des Sohnes Josifjas, und mit ihm: 160 männliche Personen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Nachkommen Schelomits«; wörtlich: »den Söhnen Schelomits«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: und von den Söhnen
  rationale: Die Verbindung aus Konjunktion, Präposition und בנים wird wörtlich und zugleich listengerecht wiedergegeben; »Söhne« kann hier eine Nachkommenschaft oder Sippe bezeichnen.
- source_word: שְׁלוֹמִית
  choice: Schelomit
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, hebräisch nahen Form transliteriert.
- source_word: בֶּן
  choice: des Sohnes
  rationale: Die Apposition bestimmt Schelomit als Sohn Josifjas näher; der Genitiv fügt sich natürlich in den deutschen Satz ein.
- source_word: יוֹסִפְיָה
  choice: Josifja
  rationale: Der hebräische Personenname wird lautnah und nach gängiger deutscher Bibelnamenbildung wiedergegeben.
- source_word: וְ/עִמּוֹ
  choice: und mit ihm
  rationale: Die Formulierung bewahrt die Verknüpfung mit der fortlaufenden Liste und bezeichnet die Begleiter des genannten Anführers.
- source_word: מֵאָה וְ/שִׁשִּׁים
  choice: '160'
  rationale: Die Ziffernschreibung ist in einer modernen Aufzählung klar und bedeutungsgleich.
- source_word: הַ/זְּכָרִים
  choice: männliche Personen
  rationale: Das hebräische Wort bezeichnet ausdrücklich männliche Personen, ohne zwingend nur erwachsene Männer zu meinen; diese Wiedergabe ist im Deutschen präziser und natürlicher als das substantivierte »Männliche«.
