lexical_decisions:
- source_word: וַנָּבוֹא
  choice: So kamen wir
  rationale: Das Wayyiqtol von בוא führt die Erzählung mit dem nächsten Ereignis fort. „Kamen“ gibt das grundlegende Bewegungsverb wieder; „So“ markiert den natürlichen Fortgang des Reiseberichts.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Die im Deutschen etablierte Form des Ortsnamens.
- source_word: וַנֵּשֶׁב
  choice: und blieben
  rationale: ישב kann unter anderem „sitzen“, „wohnen“, „bleiben“ oder „sich aufhalten“ bedeuten. Nach der Ankunft bezeichnet „blieben“ hier am natürlichsten einen zeitlich begrenzten Aufenthalt.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf Jerusalem zurück; „dort“ ist die natürliche deutsche Entsprechung.
- source_word: יָמִים שְׁלֹשָׁה
  choice: drei Tage
  rationale: Die Wendung bezeichnet die Dauer des Aufenthalts. Im Deutschen genügt bei „blieben“ die adverbiale Zeitangabe ohne zusätzliche Präposition.
