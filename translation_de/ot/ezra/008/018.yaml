base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/018.yaml
  text: And by the good hand of our God upon us[a], they brought to us a man of insight from the sons of Mahli son of Levi, son of Israel—namely Sherebiah, and his sons and his brothers, eighteen.
translation:
  language: de
  text: 'Durch die gute Hand unseres Gottes, die über uns war,[a] brachten sie uns einen verständigen Mann aus den Nachkommen Machlis, des Sohnes Levis, des Sohnes Israels: Scherebja mit seinen Söhnen und Brüdern, insgesamt achtzehn.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie die gute Hand unseres Gottes über uns war«; auch: »gemäß der guten Hand unseres Gottes über uns«. Die hebräische Wendung beschreibt Gottes gnädiges, förderndes Wirken.'
    reason: Gibt die möglichen Funktionen von כְּ wieder und erläutert das hebräische Idiom, ohne dessen Bildsprache im Haupttext aufzulösen.
  - marker: b
    text: 'Wörtlich steht im Hebräischen: »und Scherebja«. Wahrscheinlich benennt der Name den zuvor genannten verständigen Mann; formal ist auch möglich, Scherebja als weitere Person aufzufassen.'
    reason: Bewahrt die auffällige syntaktische und referenzielle Mehrdeutigkeit der hebräischen Verbindung.
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: brachten sie uns
  rationale: Der Hifil von בוא bedeutet hier »bringen«; die deutsche Wortstellung folgt dem vorangestellten Begründungssatz.
- source_word: כְּיַד אֱלֹהֵינוּ הַטּוֹבָה עָלֵינוּ
  choice: da die gute Hand unseres Gottes über uns war
  rationale: Die Formulierung bewahrt das hebräische Bild von Gottes Hand und gibt כְּ im Kontext natürlich kausal wieder. Gemeint ist Gottes gnädiges, förderndes Wirken, ohne die Metapher aufzulösen.
- source_word: אִישׁ שֶׂכֶל
  choice: einen verständigen Mann
  rationale: שׂכל bezeichnet hier Einsicht, Urteilsvermögen und verständiges Handeln; »verständig« ist idiomatisch und enger am Sinn als eine rein technische Bedeutung wie »geschickt«.
- source_word: מִבְּנֵי מַחְלִי
  choice: aus den Nachkommen Machlis
  rationale: בני kann in genealogischem Zusammenhang über unmittelbare Söhne hinaus die Nachkommenschaft bezeichnen. »Nachkommen« ist im modernen Deutsch eindeutig und natürlich.
- source_word: בֶּן לֵוִי בֶּן יִשְׂרָאֵל
  choice: des Sohnes Levis, des Sohnes Israels
  rationale: Die wiederholte genealogische Formel בן wird formal bewahrt; die Genitivkonstruktion ist im Deutschen gut lesbar.
- source_word: וְשֵׁרֵבְיָה
  choice: Scherebja
  rationale: Der Name wird als nähere Bestimmung des zuvor genannten verständigen Mannes verstanden. Da das hebräische וְ formal auch einfach »und« heißen kann und die Syntax auffällig ist, wird dies in einer Fußnote kenntlich gemacht.
- source_word: וּבָנָיו וְאֶחָיו
  choice: seine Söhne und seine Brüder
  rationale: Die familiären Beziehungen zu Scherebja werden unmittelbar und ohne zusätzliche Deutung wiedergegeben.
- source_word: שְׁמֹנָה עָשָׂר
  choice: achtzehn insgesamt
  rationale: Die Zahl steht im Hebräischen ohne wiederholtes Substantiv und bezeichnet am natürlichsten die Gesamtzahl der genannten Gruppe. »insgesamt« macht diesen syntaktischen Bezug im Deutschen verständlich.
theological_decisions:
- issue: Bild von der guten Hand Gottes
  choice: da die gute Hand unseres Gottes über uns war
  alternative: durch die gute Hand unseres Gottes über uns / gemäß der guten Hand unseres Gottes über uns
  rationale: Die Übersetzung erhält die personale Metapher für Gottes günstiges, fürsorgliches Wirken, ohne sie durch einen abstrakten theologischen Begriff zu ersetzen. Zugleich lässt sie offen, auf welche konkrete Weise Gott die erfolgreiche Suche lenkte.
- issue: Beziehung Scherebjas zu »einem verständigen Mann«
  choice: 'appositionale Identifizierung: »Scherebja«'
  alternative: 'koordinierend: »und Scherebja« als zusätzliche Person'
  rationale: Der Erzählzusammenhang und die abschließende Gruppenangabe sprechen dafür, Scherebja als den zuvor beschriebenen Mann zu identifizieren. Die formale Mehrdeutigkeit des hebräischen וְ wird jedoch nicht verschwiegen, sondern in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das traditionelle biblische Bild von Gottes »guter Hand« bleibt erhalten. Genealogische Angaben werden klar, aber nicht umgangssprachlich formuliert; die auffällige hebräische Verbindung vor Scherebja wird im Haupttext lesbar und in der Fußnote transparent wiedergegeben.
