  text: וּ/מִ/בְּנֵ֣י עָדִ֔ין עֶ֖בֶד בֶּן יוֹנָתָ֑ן וְ/עִמּ֖/וֹ חֲמִשִּׁ֥ים הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/006.yaml
  text: 'And from the sons of Adin: Ebed son of Jonathan[a], and with him fifty males.'
translation:
  language: de
  text: 'und von den Nachkommen Adins: Ebed, der Sohn Jonatans, und mit ihm fünfzig männliche Personen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fünfzig Männer“. Das Hebräische bezeichnet sie ausdrücklich als Personen männlichen Geschlechts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: und von den Nachkommen
  rationale: בני bezeichnet in dieser Heimkehrerliste die Angehörigen einer Sippe beziehungsweise die Nachkommen eines Stammvaters. „Nachkommen“ ist im heutigen Deutsch natürlicher und sachlich treffender als das wörtliche „Söhne“.
- source_word: עָדִין
  choice: Adin
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: עֶבֶד
  choice: Ebed
  rationale: Hier liegt ein Personenname vor, nicht das gleichlautende gewöhnliche Substantiv für „Diener“ oder „Sklave“; daher wird der Name transliteriert.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die genealogische Zuordnung wird im Deutschen idiomatisch mit „der Sohn“ ausgedrückt.
- source_word: יוֹנָתָן
  choice: Jonatan
  rationale: Der Personenname wird in der modernen deutschen biblischen Schreibweise ohne h wiedergegeben.
- source_word: וְ/עִמּוֹ
  choice: und mit ihm
  rationale: Die Wiedergabe erhält sowohl die Konjunktion als auch die Zuordnung der folgenden Zahl zum genannten Anführer.
- source_word: חֲמִשִּׁים
  choice: fünfzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: הַזְּכָרִים
  choice: männliche Personen
  rationale: Das hebräische Wort bezeichnet ausdrücklich Angehörige männlichen Geschlechts. „Männliche Personen“ bewahrt diese Spezifizierung und klingt in einer Aufzählung natürlicher als das substantivierte „Männliche“.
