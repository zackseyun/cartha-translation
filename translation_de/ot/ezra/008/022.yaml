source:
  edition: WLC
  text: כִּ֣י בֹ֗שְׁתִּי לִ/שְׁא֤וֹל מִן הַ/מֶּ֨לֶךְ֙ חַ֣יִל וּ/פָרָשִׁ֔ים לְ/עָזְרֵ֥/נוּ מֵ/אוֹיֵ֖ב בַּ/דָּ֑רֶךְ כִּֽי אָמַ֨רְנוּ לַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר יַד אֱלֹהֵ֤י/נוּ עַל כָּל מְבַקְשָׁי/ו֙ לְ/טוֹבָ֔ה וְ/עֻזּ֣/וֹ וְ/אַפּ֔/וֹ עַ֖ל כָּל עֹזְבָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/022.yaml
  text: For I was ashamed to ask the king for troops and horsemen to help us against the enemy on the way[a], because we had said to the king, “The hand of our God is for good on all who seek him[b], but his strength and his anger are against all who forsake him.”
translation:
  language: de
  text: 'Denn ich schämte mich, den König um Truppen und Reiter zu bitten, die uns auf der Reise vor dem Feind schützen sollten,[a] weil wir zum König gesagt hatten: »Die Hand unseres Gottes liegt zum Guten auf allen, die ihn suchen;[b] aber seine Macht und sein Zorn sind gegen alle, die ihn verlassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die uns vor dem Feind auf der Reise helfen sollten«. Gemeint ist militärischer Schutz auf der Reise.'
    reason: lexical_alternative
  - marker: b
    text: Die »Hand unseres Gottes« ist ein hebräisches Bild für sein wirksames Handeln, hier besonders für seine helfende Gunst.
    reason: cultural_note
lexical_decisions:
- source_word: בֹשְׁתִּי
  choice: ich schämte mich
  rationale: Das Verb bezeichnet Scham beziehungsweise Schande, nicht nur leichte Verlegenheit. Die reflexive deutsche Wendung ist natürlich und bewahrt das Gewicht des Ausdrucks.
- source_word: חַיִל וּפָרָשִׁים
  choice: Truppen und Reiter
  rationale: חַיִל bezeichnet hier eine bewaffnete Streitmacht, ohne zwingend das gesamte Heer zu meinen; פָרָשִׁים bezeichnet berittene Kämpfer. Die konkrete Paarung bleibt erhalten.
- source_word: לְעָזְרֵנוּ מֵאוֹיֵב בַּדָּרֶךְ
  choice: die uns unterwegs gegen den Feind helfen sollten
  rationale: Die Zweckangabe wird in natürlichem Deutsch wiedergegeben. מִן kann wörtlicher mit »vor« beziehungsweise »von« wiedergegeben werden; im Zusammenhang einer militärischen Schutztruppe ist »gegen den Feind« sachgerecht.
- source_word: יַד אֱלֹהֵינוּ
  choice: Die Hand unseres Gottes
  rationale: Die hebräische Metapher für Gottes wirksames Handeln und seine Gunst wird beibehalten, statt sie auf einen abstrakten Begriff zu reduzieren.
- source_word: עַל כָּל מְבַקְשָׁיו לְטוֹבָה
  choice: liegt zum Guten auf allen, die ihn suchen
  rationale: Die Formulierung bewahrt sowohl das Bild der auf jemandem liegenden Hand als auch den ausdrücklich wohltätigen Sinn von לְטוֹבָה.
- source_word: וְעֻזּוֹ וְאַפּוֹ
  choice: doch seine Macht und sein Zorn
  rationale: Die zwei koordinierten Substantive bleiben als unterschiedliche Aspekte erhalten. »Macht« bezeichnet wirksame Stärke, »Zorn« gibt das idiomatische אַף verständlich wieder.
- source_word: עַל כָּל עֹזְבָיו
  choice: richten sich gegen alle, die ihn verlassen
  rationale: עזב bezeichnet hier die Abwendung von Gott. »Verlassen« ist in modernem Deutsch klar und bewahrt den relationalen Ernst, ohne altertümlich zu wirken.
theological_decisions:
- issue: Anthropomorphe Wendung יַד אֱלֹהֵינוּ
  choice: Die Metapher »Die Hand unseres Gottes« wird beibehalten.
  alternative: »Die Macht unseres Gottes« oder »die Gunst unseres Gottes«
  rationale: Das körperhafte Bild umfasst sowohl wirksame Macht als auch günstiges Handeln und sollte nicht stillschweigend auf nur eine dieser Bedeutungen verengt werden.
- issue: Göttliche Gegnerschaft in וְעֻזּוֹ וְאַפּוֹ
  choice: Macht und Zorn werden als zwei koordinierte Größen wiedergegeben.
  alternative: »sein mächtiger Zorn«
  rationale: Der hebräische Text nennt zwei Substantive. Ihre Trennung bewahrt die Spannung zwischen Gottes machtvollem Handeln und seinem Zorn.
- issue: Bedeutung von עֹזְבָיו
  choice: »alle, die ihn verlassen«
  alternative: »alle, die von ihm abfallen« oder »ihn im Stich lassen«
  rationale: »Verlassen« wahrt die relationale und möglicherweise bundestheologische Tragweite, ohne eine spezifisch konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Hand-Metapher und die Gegenüberstellung von Gottes Güte gegenüber den Suchenden und seiner Macht und seinem Zorn gegenüber den ihn Verlassenden bleiben erhalten. Die Satzstruktur wurde leicht geglättet, ohne die kausale Argumentation zu verändern.
