  text: וּ/בַ/יּ֣וֹם הָ/רְבִיעִ֡י נִשְׁקַ֣ל הַ/כֶּסֶף֩ וְ/הַ/זָּהָ֨ב וְ/הַ/כֵּלִ֜ים בְּ/בֵ֣ית אֱלֹהֵ֗י/נוּ עַ֠ל יַד מְרֵמ֤וֹת בֶּן אֽוּרִיָּה֙ הַ/כֹּהֵ֔ן וְ/עִמּ֖/וֹ אֶלְעָזָ֣ר בֶּן פִּֽינְחָ֑ס וְ/עִמָּ/הֶ֞ם יוֹזָבָ֧ד בֶּן יֵשׁ֛וּעַ וְ/נֽוֹעַדְיָ֥ה בֶן בִּנּ֖וּי הַ/לְוִיִּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/033.yaml
  text: And on the fourth day[a], the silver and the gold and the vessels were weighed out in the house of our God into the hand of Meremoth son of Uriah the priest, and with him was Eleazar son of Phinehas, and with them were Jozabad son of Jeshua and Noadiah son of Binnui[b], the Levites.
translation:
  language: de
  text: Am vierten Tag wurden das Silber, das Gold und die Geräte im Haus unseres Gottes abgewogen und dem Priester Meremot, dem Sohn Urias, übergeben.[a] Bei ihm war Eleasar, der Sohn des Pinhas; bei ihnen waren außerdem Josabad, der Sohn Jeschuas, und Noadja, der Sohn Binnuis, die Leviten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Hand des Priesters Meremot, des Sohnes Urias“. Gemeint ist die Übergabe in seine Obhut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: Am vierten Tag
  rationale: Die Zeitangabe führt die Erzählung fort. Im Deutschen ist der Anschluss auch ohne ein vorangestelltes „Und“ natürlich und vollständig gewahrt.
- source_word: נִשְׁקַל
  choice: wurden ... abgewogen
  rationale: Das Nifal bezeichnet den passiven Vorgang des Wiegens. Trotz der formal singularischen Verbform verlangt die mehrteilige Aufzählung im natürlichen Deutschen den Plural.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: das Silber, das Gold und die Geräte
  rationale: „Geräte“ gibt כֵּלִים im Zusammenhang eines Tempelinventars konkret und verständlich wieder, ohne die Gegenstände enger als Behälter oder Gefäße festzulegen.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: im Haus unseres Gottes
  rationale: Die Wiedergabe bewahrt die hebräische Ausdrucksweise und ihren gemeinschaftlich-bekenntnishaften Ton; gemeint ist der Tempel.
- source_word: עַל יַד
  choice: dem ... übergeben
  rationale: Die hebräische Wendung bedeutet hier, etwas in die verantwortliche Obhut einer Person zu geben. „Übergeben“ vermittelt diese administrative Übergabe im modernen Deutschen klar; die wörtliche Bildsprache wird in der Fußnote genannt.
- source_word: מְרֵמוֹת בֶּן אֽוּרִיָּה הַכֹּהֵן
  choice: dem Priester Meremot, dem Sohn Urias
  rationale: Der Titel „Priester“ bezieht sich im Kontext am natürlichsten auf Meremot. Die Apposition macht die Beziehung der Namen eindeutig und gut lesbar.
- source_word: וְעִמּוֹ ... וְעִמָּהֶם
  choice: Bei ihm war ...; bei ihnen waren außerdem
  rationale: 'Die Formulierung bewahrt den abgestuften Aufbau: Eleasar begleitet Meremot, die beiden Leviten sind bei ihnen. „Außerdem“ verdeutlicht lediglich die additive Verknüpfung.'
- source_word: יוֹזָבָד בֶּן יֵשׁוּעַ וְנֽוֹעַדְיָה בֶן בִּנּוּי הַלְוִיִּם
  choice: Josabad, der Sohn Jeschuas, und Noadja, der Sohn Binnuis, die Leviten
  rationale: Das abschließende pluralische „die Leviten“ bezeichnet die letzten beiden genannten Männer gemeinsam. Die deutschen Namensformen folgen einer geläufigen bibeldeutschen Transliteration.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Tempelbezeichnung „Haus unseres Gottes“ bleibt erhalten; die idiomatische Wendung עַל יַד wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich dokumentiert.
