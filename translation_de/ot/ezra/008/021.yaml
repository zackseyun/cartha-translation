  text: וָ/אֶקְרָ֨א שָׁ֥ם צוֹם֙ עַל הַ/נָּהָ֣ר אַהֲוָ֔א לְ/הִתְעַנּ֖וֹת לִ/פְנֵ֣י אֱלֹהֵ֑י/נוּ לְ/בַקֵּ֤שׁ מִמֶּ֨/נּוּ֙ דֶּ֣רֶךְ יְשָׁרָ֔ה לָ֥/נוּ וּ/לְ/טַפֵּ֖/נוּ וּ/לְ/כָל רְכוּשֵֽׁ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/021.yaml
  text: Then I proclaimed a fast there[a], at the Ahava River, that we might humble ourselves before our God, to seek from him a straight path for us, for our little ones[b], and for all our possessions.
translation:
  language: de
  text: Dann rief ich dort am Fluss Ahawa ein Fasten aus, um uns vor unserem Gott zu demütigen[a] und von ihm einen geraden Weg[b] für uns, unsere Kinder und unseren gesamten Besitz zu erbitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „uns vor unserem Gott selbst zu erniedrigen“. Die hebräische Wendung bezeichnet Selbstverleugnung oder Selbsterniedrigung, besonders im Zusammenhang mit Fasten.'
    reason: lexical_alternative
  - marker: b
    text: Auch im Sinn von „einen rechten Weg“ oder „eine sichere Reise“. Wörtlich steht im Hebräischen „einen geraden Weg“.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: Dann rief ich … aus
  rationale: קרא bezeichnet hier das öffentliche Ausrufen oder Anordnen eines Fastens. „Dann“ gibt das narrative ו in natürlichem Deutsch wieder.
- source_word: צוֹם
  choice: ein Fasten
  rationale: Das Substantiv bezeichnet die gemeinschaftlich angesetzte Fastenzeit beziehungsweise Fastenhandlung.
- source_word: עַל הַנָּהָר אַהֲוָא
  choice: dort am Fluss Ahawa
  rationale: עַל kann bei einem Gewässer den Standort an oder bei ihm bezeichnen; Ahawa wird als Ortsname transkribiert.
- source_word: לְהִתְעַנּוֹת
  choice: damit wir uns … demütigten
  rationale: Das Hitpael von ענה bezeichnet im Zusammenhang mit Fasten Selbsterniedrigung beziehungsweise Selbstverleugnung vor Gott. „Uns demütigten“ vermittelt die religiöse Haltung, ohne körperliche Selbstschädigung nahezulegen.
- source_word: לִפְנֵי אֱלֹהֵינוּ
  choice: vor unserem Gott
  rationale: Die feste Wendung beschreibt die Haltung und das Handeln in Gottes Gegenwart.
- source_word: לְבַקֵּשׁ מִמֶּנּוּ
  choice: von ihm … erbäten
  rationale: בקש kann „suchen“, „erbitten“ oder „ersuchen“ bedeuten. Im Gebetszusammenhang ist „erbitten“ im Deutschen idiomatisch und bewahrt die Abhängigkeit von Gott.
- source_word: דֶּרֶךְ יְשָׁרָה
  choice: einen geraden Weg
  rationale: Die wörtliche Metapher bleibt erhalten und lässt sowohl richtige Führung als auch eine sichere Reise anklingen.
- source_word: לָנוּ וּלְטַפֵּנוּ וּלְכָל רְכוּשֵׁנוּ
  choice: für uns, unsere Kleinen und all unseren Besitz
  rationale: טף bezeichnet besonders die kleinen Kinder beziehungsweise schutzbedürftigen Angehörigen einer Gruppe; „unsere Kleinen“ bewahrt diese Nuance. רְכוּשׁ bezeichnet den mitgeführten Besitz.
theological_decisions:
- issue: Wiedergabe der Fastenwendung לְהִתְעַנּוֹת
  choice: damit wir uns vor unserem Gott demütigten
  alternative: damit wir uns vor unserem Gott kasteiten / bedrückten
  rationale: Die hebräische Wendung kann wörtlicher mit „sich bedrücken/kasteien“ wiedergegeben werden, bezeichnet hier aber die mit dem Fasten verbundene Selbsterniedrigung. Die gewählte Fassung vermeidet die irreführende Vorstellung körperlicher Selbstverletzung.
- issue: Wiedergabe von דֶּרֶךְ יְשָׁרָה
  choice: einen geraden Weg
  alternative: einen rechten Weg / eine sichere Reise
  rationale: Der Zusammenhang betrifft die Reise, doch die hebräische Formulierung kann zugleich rechte Führung ausdrücken. Die bildhafte Übersetzung legt die Bedeutung nicht einseitig auf Reisesicherheit fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt den Zweck des Fastens und den parallelen Bezug auf Selbsterniedrigung und Bitte. „Unsere Kleinen“ hält die konkrete, fürsorgebetonte Bedeutung von טף fest, ohne sie unnötig auf eine eng definierte Altersgruppe zu beschränken.
