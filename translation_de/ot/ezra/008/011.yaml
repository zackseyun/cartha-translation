  yaml_path: translation/ot/ezra/008/011.yaml
  text: 'And from the sons of Bebai: Zechariah son of Bebai[a], and with him twenty-eight males.'
translation:
  language: de
  text: 'Und von den Söhnen Bebais[a]: Sacharja, der Sohn Bebais, und mit ihm achtundzwanzig männliche Personen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Söhne Bebais“ kann im Hebräischen weiter gefasst sein und Nachkommen oder Angehörige der Sippe Bebais bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Und von den Söhnen
  rationale: Die Wiedergabe bewahrt die hebräische Form. Im Kontext der Namensliste kann „Söhne“ auch Nachkommen oder Angehörige einer Sippe bezeichnen; diese Bedeutungsbreite wird in der Fußnote erläutert.
- source_word: בֵבַי
  choice: Bebai
  rationale: Der Eigenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: זְכַרְיָה
  choice: Secharja
  rationale: Der Personenname wird in einer etablierten deutschen Bibelschreibweise wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: In der unmittelbaren patronymischen Verbindung ist „Sohn“ die natürliche und genaue Wiedergabe.
- source_word: וְעִמּוֹ
  choice: und mit ihm
  rationale: Die Konjunktion und die Begleitangabe werden entsprechend der Listenstruktur ausdrücklich beibehalten.
- source_word: עֶשְׂרִים וּשְׁמֹנָה
  choice: '28'
  rationale: Die Kardinalzahl wird in einer übersichtlichen deutschen Schreibweise wiedergegeben.
- source_word: הַזְּכָרִים
  choice: männliche Personen
  rationale: Das Hebräische bezeichnet ausdrücklich das männliche Geschlecht, nicht zwingend erwachsene Männer. „Männliche Personen“ gibt dies im Kontext einer Aufzählung präzise wieder.
theological_decisions: []
