  text: וּ/מִ/בְּנֵ֣י עֵילָ֔ם יְשַֽׁעְיָ֖ה בֶּן עֲתַלְיָ֑ה וְ/עִמּ֖/וֹ שִׁבְעִ֥ים הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/007.yaml
  text: 'And from the sons of Elam: Jeshaiah son of Athaliah[a], and with him seventy males.'
translation:
  language: de
  text: 'Und von den Nachkommen Elams: Jeschaja, der Sohn Ataljas, und mit ihm siebzig Männer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „siebzig männliche Personen“; das Hebräische verwendet ausdrücklich die Bezeichnung für die männlichen Angehörigen der Gruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Und von den Nachkommen
  rationale: בְּנֵי bedeutet wörtlich „Söhne“, bezeichnet in dieser genealogischen Liste jedoch die Angehörigen beziehungsweise Nachkommen einer Sippe. „Nachkommen“ gibt die Funktion im Kontext natürlich und genau wieder; וּ und מִן werden mit „Und von“ abgebildet.
- source_word: עֵילָם
  choice: Elam
  rationale: Der Eigenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: יְשַׁעְיָה
  choice: Jeschaja
  rationale: Der hebräische Eigenname wird nach gebräuchlicher deutscher Bibelnamenschreibung transliteriert.
- source_word: בֶּן עֲתַלְיָה
  choice: der Sohn Ataljas
  rationale: Die unmittelbare patronymische Verbindung wird formal und im Deutschen idiomatisch wiedergegeben.
- source_word: וְעִמּוֹ
  choice: und mit ihm
  rationale: Die Konjunktion und die Angabe der Begleitung bleiben erhalten und bewahren den listenartigen Satzrhythmus.
- source_word: שִׁבְעִים
  choice: siebzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: הַזְּכָרִים
  choice: Männer
  rationale: Das geschlechtsspezifische hebräische Substantiv bezeichnet hier die männlichen Personen der registrierten Gruppe. „Männer“ ist im Deutschen natürlich; die wörtlichere Ausdrucksweise wird in der Fußnote kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Listenstil. „Nachkommen“ verdeutlicht, dass בְּנֵי hier nicht nur unmittelbare Söhne meint. Die deutschen Namensformen Jeschaja und Atalja folgen gebräuchlicher biblicher Transkription.
