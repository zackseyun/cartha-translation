source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה אֲלֵ/הֶ֗ם אַתֶּ֥ם קֹ֨דֶשׁ֙ לַ/יהוָ֔ה וְ/הַ/כֵּלִ֖ים קֹ֑דֶשׁ וְ/הַ/כֶּ֤סֶף וְ/הַ/זָּהָב֙ נְדָבָ֔ה לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/028.yaml
  text: And I said to them, “You are holy to Yahweh, and the vessels are holy; and the silver and the gold are a freewill offering to Yahweh, the God of your fathers.”
translation:
  language: de
  text: 'Und ich sagte zu ihnen: »Ihr seid Jahwe heilig, und auch die Geräte sind heilig. Das Silber und das Gold sind eine freiwillige Gabe für Jahwe, den Gott eurer Väter.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Und ich sagte
  rationale: Das Wayyiqtol von אמר führt Esras direkte Rede in der fortlaufenden Erzählung ein; „Und ich sagte“ bewahrt diese Verknüpfung, ohne sie stärker kausal oder zeitlich auszudeuten.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Jahwe heilig
  rationale: Die prädikative Wendung bezeichnet Zugehörigkeit und kultische Aussonderung für Jahwe. Die deutsche Fügung „jemandem heilig sein“ erhält sowohl die Heiligkeitsaussage als auch den Bezug auf Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַכֵּלִים
  choice: die Geräte
  rationale: Im Tempelkontext bezeichnet כֵּלִים die für den Kult bestimmten Gegenstände beziehungsweise Gerätschaften. „Geräte“ ist im modernen Deutschen verständlich und vermeidet die mögliche Verengung von „Gefäße“.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: Das Silber und das Gold
  rationale: Die bestimmten Artikel beider hebräischen Substantive werden bewahrt; die Formulierung bleibt im Deutschen natürlich.
- source_word: נְדָבָה
  choice: eine freiwillige Gabe
  rationale: נְדָבָה bezeichnet eine aus freiem Entschluss dargebrachte Gabe. „Freiwillige Gabe“ gibt diesen Sinn natürlich wieder, ohne eine speziellere Opferkategorie zu erzwingen.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: den Gott eurer Väter
  rationale: Die traditionelle Bundesformel und die ausdrücklich maskuline Pluralform des Ausgangstextes bleiben erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den Eigennamen; „Jahwe“ erhält ihn, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bedeutung von קֹדֶשׁ לַיהוָה
  choice: Jahwe heilig
  alternative: für Jahwe ausgesondert
  rationale: „Heilig“ bewahrt die theologisch und kultisch gewichtige Wortwahl des Ausgangstextes; der Dativ drückt Zugehörigkeit beziehungsweise Weihe aus, ohne die Aussage auf eine einzige Erklärung zu reduzieren.
- issue: Wiedergabe von אֲבֹתֵיכֶם
  choice: eurer Väter
  alternative: eurer Vorfahren
  rationale: „Väter“ entspricht der maskulinen Form und bewahrt die überlieferte Bundesformel; „Vorfahren“ wäre möglich, würde die konkrete Ausdrucksweise jedoch neutralisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; „auch“ macht die im Hebräischen koordinierte parallele Heiligkeitsaussage idiomatisch verständlich, ohne zusätzliche Sachinformation einzuführen. Keine Fußnoten erforderlich.
