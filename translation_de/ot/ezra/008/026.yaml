  text: וָ/אֶשְׁקֲלָ֨/ה עַל יָדָ֜/ם כֶּ֗סֶף כִּכָּרִים֙ שֵֽׁשׁ מֵא֣וֹת וַ/חֲמִשִּׁ֔ים וּ/כְלֵי כֶ֥סֶף מֵאָ֖ה לְ/כִכָּרִ֑ים זָהָ֖ב מֵאָ֥ה כִכָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/026.yaml
  text: And I weighed out into their hands six hundred and fifty talents of silver[a], and one hundred talents worth of silver vessels, and one hundred talents of gold.
translation:
  language: de
  text: Und ich wog ihnen 650 Talente Silber ab, dazu silberne Gefäße im Wert von 100 Talenten[a] und 100 Talente Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dazu 100 silberne Gefäße im Wert von 100 Talenten“. Der hebräische Wortlaut ist an dieser Stelle verkürzt; die Zahl 100 kann sich auch auf die Gefäße beziehen. Gemeint ist, dass die silbernen Gefäße insgesamt auf 100 Talente veranschlagt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֲלָה
  choice: ich wog … ab
  rationale: שׁקל bezeichnet hier das Abwiegen von Edelmetall zur Übergabe; „abwägen“ ist im Deutschen idiomatisch und bewahrt den Gewichtsvorgang.
- source_word: עַל יָדָם
  choice: ihnen
  rationale: Die Wendung bedeutet hier, dass die genannten Werte den Beauftragten übergeben beziehungsweise anvertraut wurden. Das natürliche deutsche Dativpronomen gibt dies knapp wieder.
- source_word: כֶּסֶף כִּכָּרִים שֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 650 Talente Silber
  rationale: כֶּסֶף ist in diesem Zusammenhang gewogenes Silber, und כִּכָּר bezeichnet die große Gewichtseinheit „Talent“.
- source_word: וּכְלֵי כֶסֶף מֵאָה לְכִכָּרִים
  choice: dazu silberne Gefäße im Wert von 100 Talenten
  rationale: כְּלִי ist hier passend mit „Gefäße“ wiedergegeben. Die elliptische Verbindung wird als Gewichts- beziehungsweise Wertangabe verstanden, ohne eine Anzahl von hundert Gefäßen zu behaupten.
- source_word: זָהָב מֵאָה כִכָּר
  choice: 100 Talente Gold
  rationale: Die Wortgruppe nennt unmittelbar Menge, Gewichtseinheit und Material.
