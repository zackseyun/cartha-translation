  text: וַֽ/יִּתְּנ֣וּ אֶת דָּתֵ֣י הַ/מֶּ֗לֶךְ לַ/אֲחַשְׁדַּרְפְּנֵי֙ הַ/מֶּ֔לֶךְ וּ/פַחֲו֖וֹת עֵ֣בֶר הַ/נָּהָ֑ר וְ/נִשְּׂא֥וּ אֶת הָ/עָ֖ם וְ/אֶת בֵּֽית הָ/אֱלֹהִֽים׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/036.yaml
  text: And they delivered the king’s decrees to the king’s satraps and the governors Beyond the River[c][b][a], and they supported the people and the house of God.
translation:
  language: de
  text: Sie übergaben die Erlasse des Königs den Satrapen des Königs und den Statthaltern jenseits des Stromes[a]. Diese unterstützten das Volk und das Haus Gottes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jenseits des Stromes“ war die persische Verwaltungsbezeichnung für das Gebiet westlich des Euphrat.
    reason: cultural_note
  - marker: b
    text: 'Oder: „den Tempel Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: sie übergaben
  rationale: נתן bedeutet grundsätzlich „geben“; bei amtlichen Schriftstücken gibt „übergeben“ die förmliche Aushändigung natürlich und präzise wieder.
- source_word: דָּתֵי הַמֶּלֶךְ
  choice: die Erlasse des Königs
  rationale: דָּת bezeichnet im perserzeitlichen Verwaltungskontext amtliche rechtliche Anordnungen; „Erlasse“ vermeidet die weitergehende Vorstellung eines vollständigen Gesetzeskorpus.
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ
  choice: den Satrapen des Königs
  rationale: „Satrapen“ ist die historisch präzise und im Deutschen etablierte Bezeichnung für persische Provinzherrscher; die Zugehörigkeitsangabe „des Königs“ wird bewahrt.
- source_word: פַחֲוֹת
  choice: den Statthaltern
  rationale: פֶּחָה bezeichnet regionale Gouverneure oder Verwaltungsleiter; „Statthalter“ passt zum historischen persischen Verwaltungsrahmen.
- source_word: עֵבֶר הַנָּהָר
  choice: jenseits des Stromes
  rationale: Die Wendung ist eine persische Verwaltungsbezeichnung für das Gebiet westlich des Euphrat. Die wörtlich-nahe Form bleibt verständlich und wird durch eine Fußnote erläutert.
- source_word: וְנִשְּׂאוּ
  choice: diese unterstützten
  rationale: נשא bedeutet wörtlich „heben, tragen“, bezeichnet hier jedoch idiomatisch praktische Förderung oder Hilfe. Das Demonstrativpronomen verdeutlicht im Deutschen den naheliegenden Subjektwechsel zu den zuvor genannten Amtsträgern.
- source_word: הָעָם
  choice: das Volk
  rationale: Der hebräische Text sagt schlicht „das Volk“; eine nähere Bestimmung wird nicht hinzugefügt.
- source_word: בֵּית הָאֱלֹהִים
  choice: das Haus Gottes
  rationale: Die wörtliche und im biblischen Deutsch verständliche Wendung bewahrt das hebräische Bild; gemeint ist der Tempel.
