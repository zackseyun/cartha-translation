  text: וּ/מִ/בְּנֵ֥י בִגְוַ֖י עוּתַ֣י ו/זבוד וְ/עִמּ֖/וֹ שִׁבְעִ֥ים הַ/זְּכָרִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/014.yaml
  text: 'And from the sons of Bigvai: Uthai and Zabbud[b][a], and with them seventy males.'
translation:
  language: de
  text: 'Und von den Söhnen Bigwais: Utai und Sabbud[a]; mit ihm waren siebzig männliche Personen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Textüberlieferungen und alte Übersetzungen bezeugen hier einen anderen zweiten Namen; im masoretischen Text steht »Sabbud«.
    reason: textual_variant
  - marker: b
    text: Wörtlich steht im Hebräischen »mit ihm« im Singular, obwohl zuvor zwei Namen genannt werden. Manche Übersetzungen gleichen deshalb zu »mit ihnen« an.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי בִגְוַי
  choice: Und von den Söhnen Bigwais
  rationale: Die direkte Wiedergabe bewahrt die genealogische Listenform; »Söhne« kann hier auch Nachkommen beziehungsweise Angehörige der Sippe bezeichnen.
- source_word: עוּתַי
  choice: Utai
  rationale: Transliteration des hebräischen Eigennamens in einer im Deutschen natürlichen Form.
- source_word: ו/זבוד
  choice: und Sabbud
  rationale: Der masoretische Text bietet זבוד; die Schreibung mit »S« folgt der üblichen deutschen Wiedergabe des anlautenden Zajin.
- source_word: וְ/עִמּ/וֹ
  choice: mit ihm waren
  rationale: Das hebräische Suffix steht ausdrücklich im Singular. Die Formulierung hält diese auffällige Numerusform fest, ohne ihren Bezug vorschnell zu bestimmen.
- source_word: שִׁבְעִים הַ/זְּכָרִים
  choice: siebzig männliche Personen
  rationale: זְכָרִים bezeichnet spezifisch Personen männlichen Geschlechts. »Männliche Personen« ist im Deutschen präziser und natürlicher als das substantivierte »Männliche«.
