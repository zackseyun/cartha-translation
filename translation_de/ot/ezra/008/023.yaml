base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/023.yaml
  text: So we fasted and sought our God concerning this[a], and he answered our plea.
translation:
  language: de
  text: So fasteten wir und baten unseren Gott darum, und er erhörte uns.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנָּצוּמָה
  choice: So fasteten wir
  rationale: Die Kohortativform von צום berichtet hier im Zusammenhang die gemeinsame Handlung. „Wir fasteten“ gibt den Sinn unmittelbar wieder, ohne zusätzlich ein ausgerufenes Fasten anzunehmen.
- source_word: וַנְּבַקְשָׁה מֵאֱלֹהֵינוּ
  choice: und baten unseren Gott
  rationale: בקשׁ mit מן bezeichnet hier im Gebetszusammenhang eine an Gott gerichtete Bitte. Im Deutschen ist „unseren Gott bitten“ natürlicher als das formal nähere, aber missverständliche „von unserem Gott suchen“.
- source_word: עַל זֹאת
  choice: darum
  rationale: Die Wendung verweist auf die zuvor genannte Angelegenheit. „Darum“ ist knapp, idiomatisch und erhält diesen Rückbezug.
- source_word: וַיֵּעָתֵר לָנוּ
  choice: und er erhörte uns
  rationale: Der Niphal von עתר bezeichnet hier Gottes günstige Reaktion auf die Bitte. „Er erhörte uns“ ist im Deutschen verständlich und bewahrt den Gebetsbezug, ohne über den Text hinauszugehen.
theological_decisions:
- issue: Wiedergabe von Gottes Reaktion in וַיֵּעָתֵר לָנוּ
  choice: und er erhörte uns
  alternative: und er ließ sich von uns erbitten / und er antwortete auf unser Flehen
  rationale: Die hebräische Form kann formal-passiv wiedergegeben werden, meint im Kontext aber eine günstige Antwort auf Gebet und Fasten. „Er erhörte uns“ drückt dies natürlich aus, ohne Art oder Zeitpunkt der Antwort näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und folgt dem hebräischen Handlungsablauf; unnötig kirchensprachliche oder schwer verständliche Passivformulierungen werden vermieden.
