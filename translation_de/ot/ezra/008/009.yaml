  yaml_path: translation/ot/ezra/008/009.yaml
  text: 'From the sons of Joab: Obadiah son of Jehiel[a], and with him 218 males.'
translation:
  language: de
  text: 'Von den Söhnen Joabs: Obadja, der Sohn Jehiëls, und mit ihm 218 männliche Personen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Von den Nachkommen
  rationale: Die Wendung leitet innerhalb der Rückkehrerliste eine Gruppe aus der Sippe Joabs ein. „Nachkommen“ vermeidet die unnötige Festlegung auf unmittelbare Söhne.
- source_word: יוֹאָב
  choice: Joab
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: עֹבַדְיָה
  choice: Obadja
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: בֶּן יְחִיאֵל
  choice: der Sohn Jehiëls
  rationale: בֶּן bezeichnet hier die unmittelbare Abstammungsbeziehung; die Genitivform ist im Deutschen natürlich und eindeutig.
- source_word: וְעִמּוֹ
  choice: und mit ihm
  rationale: Bewahrt sowohl die hebräische Verknüpfung als auch die wiederkehrende Listenformel für die Begleiter des genannten Anführers.
- source_word: מָאתַיִם וּשְׁמֹנָה עָשָׂר
  choice: '218'
  rationale: Die Zahl bedeutet „zweihundertachtzehn“ und wird in diesem listenartigen Zusammenhang der Übersichtlichkeit halber mit Ziffern geschrieben.
- source_word: הַזְּכָרִים
  choice: männliche Personen
  rationale: Das hebräische Wort bezeichnet ausdrücklich Personen männlichen Geschlechts, ohne sie zwingend als erwachsene Männer auszuweisen.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Listendeutsch. Die Eigennamen folgen geläufigen deutschen Bibelformen; „männliche Personen“ wahrt die geschlechtsspezifische Aussage des Hebräischen, ohne ein Erwachsenenalter vorauszusetzen. Die sachlich unpassende Fußnote der englischen Konsultationsfassung wurde nicht übernommen.
