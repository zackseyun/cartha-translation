base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/013.yaml
  text: 'And from the sons of Adonikam[a], the last ones, and these were their names: Eliphelet, Jeiel, and Shemaiah, and with them sixty males.'
translation:
  language: de
  text: 'Und von den Nachkommen Adonikams, den Letzten[a]: Elifelet, Jëiël und Schemaja; mit ihnen sechzig Männer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Späteren“ beziehungsweise „den Nachfolgenden“. Gemeint ist wahrscheinlich die letzte Gruppe aus Adonikams Nachkommenschaft, möglicherweise im Unterschied zu einer früher aufgeführten Gruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Und von den Nachkommen
  rationale: בְּנֵי bedeutet wörtlich „Söhne“, bezeichnet in genealogischen Listen jedoch häufig Nachkommen beziehungsweise Angehörige einer Abstammungslinie. „Nachkommen“ gibt den gemeinten Umfang im heutigen Deutsch natürlich wieder.
- source_word: אֲדֹנִיקָם
  choice: Adonikam
  rationale: Der Personenname wird nach deutscher Bibeltradition transliteriert.
- source_word: אַחֲרֹנִים
  choice: den letzten
  rationale: Das Adjektiv kann „die letzten“, „die späteren“ oder „die nachfolgenden“ bedeuten. „Den letzten“ bewahrt die wahrscheinliche Aussage, dass dies die letzte Gruppe aus Adonikams Linie war, ohne den Bezug ausdrücklich festzulegen.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: und dies waren ihre Namen
  rationale: Die im Hebräischen verblosen Namensformel wird im deutschen Erzählzusammenhang idiomatisch mit „waren“ wiedergegeben.
- source_word: אֱלִיפֶלֶט
  choice: Elifelet
  rationale: Transliteration des Personennamens in geläufiger deutscher Form.
- source_word: יְעִיאֵל
  choice: Jëiël
  rationale: Transliteration des Personennamens; Tremazeichen helfen, die aufeinanderfolgenden Vokale als getrennte Silben zu lesen.
- source_word: וּשְׁמַעְיָה
  choice: und Schemaja
  rationale: Der Personenname wird in geläufiger deutscher Form transliteriert; die hebräische Konjunktion bleibt erhalten.
- source_word: וְעִמָּהֶם
  choice: mit ihnen waren
  rationale: עִם mit Suffix bezeichnet Begleitung. Das ergänzte Verb ergibt einen natürlichen deutschen Satz; das einleitende hebräische ו wird durch die Gliederung mit Semikolon nicht eigens wiedergegeben.
- source_word: שִׁשִּׁים
  choice: sechzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: הַזְּכָרִים
  choice: männliche Personen
  rationale: זְכָרִים bezeichnet ausdrücklich Personen männlichen Geschlechts. „Männliche Personen“ ist präziser als „Männer“, das ein bestimmtes Alter nahelegen könnte, und im Deutschen natürlicher als die substantivierte Bezeichnung „Männliche“.
