base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/003.yaml
  text: 'From the sons of Shecaniah[a], from the sons of Parosh: Zechariah, and with him were enrolled by genealogy 150 males.'
translation:
  language: de
  text: 'Von den Nachkommen Schechanjas, von den Nachkommen des Parosch: Secharja;[a] mit ihm waren 150 männliche Personen genealogisch erfasst.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text reiht die Angaben „von den Nachkommen Schechanjas“ und „von den Nachkommen des Parosch“ knapp aneinander; wie beide genealogisch zueinander stehen, bleibt offen.
    reason: textual_ambiguity
  - marker: b
    text: 'Auch möglich: „mit ihm wurden 150 männliche Personen genealogisch registriert“. Das hebräische Verb bezeichnet die formelle Erfassung oder Zuordnung in einem Geschlechtsregister.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Von den Nachkommen
  rationale: Die wiederholte Verbindung aus מִן und בְּנֵי führt jeweils eine Gruppe innerhalb der Rückkehrerliste ein. „Nachkommen“ gibt den genealogischen Sinn im Deutschen natürlicher wieder als das wörtliche „Söhne“.
- source_word: שְׁכַנְיָה
  choice: Schechanja
  rationale: Gebräuchliche deutsche Umschrift des hebräischen Personennamens.
- source_word: פַרְעֹשׁ
  choice: Parosch
  rationale: Gebräuchliche deutsche Umschrift des Familiennamens in Esra.
- source_word: זְכַרְיָה
  choice: Secharja
  rationale: Gebräuchliche deutsche Bibelnamensform, die den hebräischen Namen erkennbar wiedergibt.
- source_word: וְעִמּוֹ
  choice: mit ihm
  rationale: Die knappe Wendung bezeichnet die Personen, die Secharja zugeordnet waren beziehungsweise ihn begleiteten.
- source_word: הִתְיַחֵשׂ
  choice: waren … nach ihren Geschlechtsregistern eingetragen
  rationale: Das Hitpael von יחס bezeichnet die genealogische Erfassung oder Eintragung. Die Formulierung macht den amtlichen Registercharakter deutlich.
- source_word: לִזְכָרִים
  choice: männliche Personen
  rationale: Der hebräische Ausdruck bezeichnet ausdrücklich das männliche Geschlecht, ohne notwendig nur erwachsene Männer zu meinen.
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: '150'
  rationale: Die Ziffer entspricht dem genauen Zahlenwert und ist in einer listenartigen Zählung gut lesbar.
theological_decisions:
- issue: Verhältnis zwischen Schechanja, Parosch und Secharja
  choice: Die beiden Herkunftsangaben werden in ihrer knappen Reihung beibehalten.
  alternative: '„Von den Nachkommen Schechanjas, der zu den Nachkommen des Parosch gehörte: Secharja“'
  rationale: Der masoretische Text nennt beide Gruppen mit derselben Formel, ohne ihr Verhältnis ausdrücklich zu bestimmen. Eine hierarchische Zuordnung würde die syntaktische Mehrdeutigkeit auflösen, statt sie zu bewahren.
translation_notes:
  register: Moderne, würdevolle Listensprache. Die Doppelung „von den Nachkommen“ bewahrt die auffällige, mehrdeutige Struktur des hebräischen Textes; der Doppelpunkt und das Semikolon machen die Aufzählung lesbar, ohne eine nicht ausdrücklich genannte Verwandtschaftsbeziehung einzuführen.
