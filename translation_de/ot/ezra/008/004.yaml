  text: מִ/בְּנֵי֙ פַּחַ֣ת מוֹאָ֔ב אֶלְיְהֽוֹעֵינַ֖י בֶּן זְרַֽחְיָ֑ה וְ/עִמּ֖/וֹ מָאתַ֥יִם הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/004.yaml
  text: 'From the sons of Pahath-moab: Eliehoenai son of Zerahiah[a], and with him two hundred males.'
translation:
  language: de
  text: 'Von den Söhnen Pahat-Moabs: Eljehoënai, der Sohn Serachjas, und mit ihm zweihundert männliche Personen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Männlichen“; gemeint sind männliche Personen beziehungsweise Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Von den Söhnen
  rationale: Gibt die Präposition מִן und die in Listen übliche Geschlechts- bzw. Sippenbezeichnung בְּנֵי formal wieder.
- source_word: פַּחַת מוֹאָב
  choice: Pahat-Moabs
  rationale: Behandelt die hebräische Namensverbindung als Sippenname; der deutsche Genitiv fügt sich natürlich in die Wendung „Söhne Pahat-Moabs“ ein.
- source_word: אֶלְיְהוֹעֵינַי
  choice: Eljehoënai
  rationale: Transliteriert den hebräischen Personennamen in einer deutsch lesbaren Form; das Trema zeigt, dass o und e getrennt gesprochen werden.
- source_word: בֶּן זְרַחְיָה
  choice: der Sohn Serachjas
  rationale: Gibt das ausdrücklich genannte Abstammungsverhältnis in natürlichem Deutsch wieder.
- source_word: וְעִמּוֹ
  choice: und mit ihm
  rationale: Bewahrt sowohl die hebräische Verknüpfung als auch die Zuordnung der folgenden Zahl zum genannten Anführer.
- source_word: מָאתַיִם
  choice: zweihundert
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: הַזְּכָרִים
  choice: männliche Personen
  rationale: Bewahrt die ausdrückliche Geschlechtsangabe von זָכָר, klingt im Deutschen jedoch natürlicher und weniger biologisch-technisch als das substantivierte „Männliche“.
theological_decisions: []
