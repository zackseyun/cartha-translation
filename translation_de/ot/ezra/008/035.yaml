source:
  edition: WLC
  text: הַ֠/בָּאִים מֵֽ/הַ/שְּׁבִ֨י בְנֵֽי הַ/גּוֹלָ֜ה הִקְרִ֥יבוּ עֹל֣וֹת לֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל פָּרִ֨ים שְׁנֵים עָשָׂ֤ר עַל כָּל יִשְׂרָאֵל֙ אֵילִ֣ים תִּשְׁעִ֣ים וְ/שִׁשָּׁ֗ה כְּבָשִׂים֙ שִׁבְעִ֣ים וְ/שִׁבְעָ֔ה צְפִירֵ֥י חַטָּ֖את שְׁנֵ֣ים עָשָׂ֑ר הַ/כֹּ֖ל עוֹלָ֥ה לַ/יהוָֽה־׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/035.yaml
  text: 'Those who had come from the captivity[a], the sons of the exile, offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering[c][b]. All of it was a burnt offering to Yahweh.'
translation:
  language: de
  text: 'Diejenigen, die aus der Gefangenschaft gekommen waren, die Angehörigen der Exilsgemeinschaft,[a] brachten dem Gott Israels Brandopfer dar: zwölf Stiere für ganz Israel,[b] sechsundneunzig Widder, siebenundsiebzig Lämmer und zwölf Ziegenböcke als Sündopfer. Das alles war ein Brandopfer für Jahwe.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne des Exils“; gemeint sind die aus dem Exil zurückgekehrten Angehörigen der Gemeinschaft.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „stellvertretend für ganz Israel“.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Text sagt: „Das alles war ein Brandopfer für Jahwe“, obwohl unmittelbar zuvor Ziegenböcke als Sündopfer genannt werden.'
    reason: textual_tension
lexical_decisions:
- source_word: הַבָּאִים מֵהַשְּׁבִי
  choice: die aus der Gefangenschaft Heimgekehrten
  rationale: Das substantivierte Partizip bezeichnet im Erzählzusammenhang die bereits angekommenen Rückkehrer; „Heimgekehrten“ gibt dies natürlich wieder, während „aus der Gefangenschaft“ den konkreten Sinn von שְׁבִי bewahrt.
- source_word: בְנֵי הַגּוֹלָה
  choice: die Angehörigen der Exilsgemeinschaft
  rationale: Die hebräische relationale Wendung „Söhne des Exils“ bezeichnet die durch das Exil geprägte Gemeinschaft. Die idiomatische deutsche Wiedergabe vermeidet das missverständliche wörtliche „Söhne“, ohne die Identitätsbezeichnung aufzugeben.
- source_word: הִקְרִיבוּ עֹלוֹת
  choice: brachten … Brandopfer dar
  rationale: „Darbringen“ ist im Deutschen die natürliche kultische Entsprechung zu הקריב; „Brandopfer“ ist der etablierte Ausdruck für עֹלָה.
- source_word: פָּרִים שְׁנֵים עָשָׂר עַל כָּל יִשְׂרָאֵל
  choice: zwölf Stiere für ganz Israel
  rationale: „Für“ lässt die mögliche repräsentative Bedeutung von עַל offen; eine Fußnote nennt die präzisierende Alternative „stellvertretend für“.
- source_word: צְפִירֵי חַטָּאת
  choice: Ziegenböcke als Sündopfer
  rationale: צְפִירֵי bezeichnet männliche Ziegen, und חַטָּאת benennt hier die Opferart.
- source_word: הַכֹּל עוֹלָה לַיהוָה
  choice: Das alles war ein Brandopfer für Jahwe
  rationale: Die summarische Aussage des Hebräischen wird trotz der unmittelbar zuvor genannten Sündopfer unverändert bewahrt. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im Haupttext als „Jahwe“ wiedergegeben, sodass sein Charakter als offenbarter Bundesname sichtbar bleibt.
- issue: Spannung zwischen den Ziegenböcken als Sündopfer und der Schlussaussage, alles sei ein Brandopfer
  choice: Die Spannung des hebräischen Textes unverändert bewahren
  alternative: Die Schlussaussage nur auf die zuvor genannten Brandopfertiere beziehen oder glättend umformulieren
  rationale: Der masoretische Text nennt sowohl das Sündopfer als auch die umfassende Schlussformel. Die Übersetzung löst diese sachliche Spannung nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe „Brandopfer“ und „Sündopfer“ bleiben erhalten. Zahlen werden ausgeschrieben. Die appositionale Identitätsbezeichnung wird verständlich formuliert und in einer Fußnote wörtlich erläutert.
