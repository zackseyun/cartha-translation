base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/008.yaml
  text: Let it be known to the king that we went to the province of Judah[a], to the house of the great God. It is being built with great stones, and timber is being laid in the walls[b]. This work is being done diligently and is prospering in their hands.
translation:
  language: de
  text: Dem König sei bekannt, dass wir in die Provinz Juda, zum Haus des großen Gottes, gegangen sind. Es wird aus großen Steinen[a] gebaut, und Holz wird in die Wände eingefügt. Diese Arbeit wird eifrig[b] ausgeführt und gelingt ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die aramäische Wendung kann auch mit »aus massiven Steinen« wiedergegeben werden; wahrscheinlich sind besonders große Bausteine gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sorgfältig« beziehungsweise möglicherweise »rasch«. Die genaue Bedeutung des aramäischen Adverbs ist umstritten; es beschreibt jedenfalls, dass die Arbeit wirksam voranschreitet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: Dem König sei bekannt
  rationale: Bewahrt die förmliche aramäische Verwaltungsformel und klingt zugleich in einem amtlichen Bericht natürlich und würdig.
- source_word: אֲזַלְנָא לִיהוּד מְדִינְתָּא
  choice: wir in die Provinz Juda gegangen sind
  rationale: אֲזַל bedeutet „gehen“; מְדִינָה bezeichnet hier die persische Verwaltungseinheit einer Provinz.
- source_word: לְבֵית אֱלָהָא רַבָּא
  choice: zum Haus des großen Gottes
  rationale: Die wörtliche Wiedergabe „Haus“ erhält die Ausdrucksweise und den ehrerbietigen Ton der Vorlage; gemeint ist der Tempel.
- source_word: אֶבֶן גְּלָל
  choice: aus mächtigen Steinen
  rationale: Die Wendung bezeichnet große, schwere Bausteine; „mächtig“ vermittelt ihre außergewöhnliche Größe, ohne die umstrittene Herleitung als „gerollt“ in den Haupttext zu übernehmen.
- source_word: וְאָע מִתְּשָׂם בְּכֻתְלַיָּא
  choice: und Holz wird in die Wände eingefügt
  rationale: אָע bezeichnet Holz beziehungsweise Bauholz. Das passive Verb beschreibt dessen Einsetzen in die Wandkonstruktion.
- source_word: אָסְפַּרְנָא
  choice: mit Nachdruck
  rationale: Das seltene Adverb beschreibt eine wirksame, energische oder möglicherweise rasche Ausführung. „Mit Nachdruck“ lässt die genaue Nuance hinreichend offen.
- source_word: וּמַצְלַח בְּיֶדְהֹם
  choice: geht unter ihren Händen gut voran
  rationale: Die idiomatische Formulierung bewahrt sowohl den Erfolg beziehungsweise Fortschritt des Werkes als auch das aramäische Bild „in/unter ihren Händen“.
