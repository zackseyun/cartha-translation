  text: וּ/כְנֵ֥מָא פִתְגָמָ֖/א הֲתִיב֣וּ/נָא לְ/מֵמַ֑ר אֲנַ֣חְנָא הִמּ֡וֹ עַבְדוֹ/הִי֩ דִֽי אֱלָ֨הּ שְׁמַיָּ֜/א וְ/אַרְעָ֗/א וּ/בָנַ֤יִן בַּיְתָ/א֙ דִּֽי הֲוָ֨א בְנֵ֜ה מִ/קַּדְמַ֤ת דְּנָה֙ שְׁנִ֣ין שַׂגִּיאָ֔ן וּ/מֶ֤לֶךְ לְ/יִשְׂרָאֵל֙ רַ֔ב בְּנָ֖/הִי וְ/שַׁכְלְלֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/011.yaml
  text: 'And this is the answer they returned to us[a], saying: We are the servants of the God of heaven and earth, and we are rebuilding the house that was built many years ago[b], which a great king of Israel built and completed.'
translation:
  language: de
  text: 'Und so lautete die Antwort, die sie uns gaben[a]: »Wir sind Diener des Gottes des Himmels und der Erde. Wir bauen das Haus wieder auf[b], das vor vielen Jahren errichtet worden war und das ein großer König Israels gebaut und vollendet hatte.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und folgendermaßen lautete die Botschaft, die sie uns übermittelten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wir bauen das Haus«; das aramäische Partizip bezeichnet eine andauernde Handlung. »Wieder aufbauen« verdeutlicht, dass dieses Haus bereits zuvor bestanden hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא
  choice: Und so lautete die Antwort, die sie uns gaben
  rationale: Die aramäische Wendung führt den Inhalt der Erwiderung ein. פִתְגָם kann »Wort«, »Botschaft« oder »Antwort« bedeuten; im Zusammenhang ist »Antwort« sachgerecht, während »gaben« die idiomatische Bedeutung von הֲתִיבוּנָא natürlich wiedergibt.
- source_word: עַבְדוֹהִי
  choice: Diener
  rationale: Das Wort bezeichnet hier die Gott zugehörigen und ihm ergebenen Menschen; »Diener« bewahrt diesen Sinn, ohne unnötig den sozialen Status von Sklaven hervorzuheben.
- source_word: אֱלָהּ שְׁמַיָּא וְאַרְעָא
  choice: des Gottes des Himmels und der Erde
  rationale: Der Titel bringt Gottes umfassende Herrschaft zum Ausdruck. Die deutsche Singularform »Himmel« ist in dieser festen Verbindung natürlich.
- source_word: וּבָנַיִן
  choice: Wir bauen ... wieder auf
  rationale: Das Partizip bezeichnet eine fortdauernde Bautätigkeit. »Wieder aufbauen« macht den aus dem folgenden Relativsatz hervorgehenden Wiederaufbau eines früher vorhandenen Hauses ausdrücklich, ohne die wörtliche Alternative zu verschweigen.
- source_word: בַּיְתָא
  choice: das Haus
  rationale: Die wörtliche Wiedergabe »Haus« bleibt erhalten; aus dem Zusammenhang ist klar, dass der Tempel gemeint ist.
- source_word: דִּי הֲוָא בְנֵה מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן
  choice: das vor vielen Jahren errichtet worden war
  rationale: Die Wendung bedeutet wörtlich ungefähr »das vor diesem viele Jahre gebaut worden war«. Die gewählte Form ist natürliches Deutsch und wahrt den Rückblick auf den früheren Bau.
- source_word: וּמֶלֶךְ לְיִשְׂרָאֵל רַב
  choice: Ein großer König Israels
  rationale: רַב bezeichnet hier Größe beziehungsweise Bedeutung. Der König, wohl Salomo, wird im Ausgangstext nicht namentlich genannt und bleibt daher auch in der Übersetzung unbenannt.
- source_word: בְּנָהִי וְשַׁכְלְלֵהּ
  choice: hatte es gebaut und vollendet
  rationale: Die beiden Verben unterscheiden das Errichten vom Zu-Ende-Führen des Baus; das Plusquamperfekt ordnet beides klar vor dem gegenwärtigen Wiederaufbau ein.
theological_decisions:
- issue: Gottesbezeichnung im amtlichen Bericht
  choice: der Gott des Himmels und der Erde
  alternative: der Gott der Himmel und der Erde
  rationale: Die Wendung wird als umfassender Hoheitstitel wiedergegeben und nicht auf eine örtliche Gottheit eingeengt. Der idiomatische deutsche Singular »Himmel« verändert diesen Anspruch nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die amtliche Berichtssituation bleibt hörbar, ohne steife Kanzleisprache. Die direkte Rede ist klar gegliedert; »Haus« bewahrt das Bild des Ausgangstextes, während die Fußnoten echte lexikalische Alternativen dokumentieren.
