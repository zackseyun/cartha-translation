  text: פַּרְשֶׁ֣גֶן אִ֠גַּרְתָּ/א דִּֽי שְׁלַ֞ח תַּתְּנַ֣י פַּחַ֣ת עֲבַֽר נַהֲרָ֗/ה וּ/שְׁתַ֤ר בּוֹזְנַי֙ וּ/כְנָ֣וָתֵ֔/הּ אֲפַ֨רְסְכָיֵ֔/א דִּ֖י בַּ/עֲבַ֣ר נַהֲרָ֑/ה עַל דָּרְיָ֖וֶשׁ מַלְכָּֽ/א־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/006.yaml
  text: This is a copy of the letter that Tattenai[a], the governor of Beyond the River, and Shethar-bozenai and his associates, the officials who were in Beyond the River, sent to King Darius.
translation:
  language: de
  text: Dies ist eine Abschrift des Briefes, den Tattenai, der Statthalter von Jenseits des Stromes, Schetar-Bosnai und seine Mitarbeiter, die Beamten[a] in Jenseits des Stromes, an König Darius sandten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Afarsachiter«, falls der Ausdruck als Name einer Volks- oder Verwaltungsgruppe und nicht als Amtsbezeichnung zu verstehen ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּרְשֶׁגֶן
  choice: Abschrift
  rationale: Das Substantiv bezeichnet die schriftliche Kopie beziehungsweise Wiedergabe eines Dokuments; »Abschrift« passt zum amtlichen Zusammenhang.
- source_word: אִגַּרְתָּא
  choice: Brief
  rationale: Gemeint ist eine amtliche schriftliche Mitteilung; »Brief« ist im modernen Deutschen klar und natürlich.
- source_word: שְׁלַח
  choice: sandten
  rationale: Das Verb bezeichnet hier schlicht das Absenden des Briefes; der Plural entspricht dem zusammengesetzten Subjekt.
- source_word: פַּחַת
  choice: Statthalter
  rationale: Der Titel bezeichnet im achämenidischen Verwaltungswesen einen Provinzstatthalter; »Statthalter« ist präzise und allgemein verständlich.
- source_word: עֲבַר נַהֲרָה
  choice: Jenseits des Stromes
  rationale: Die Wendung ist eine persische Verwaltungsbezeichnung für das Gebiet westlich des Euphrat. Die Großschreibung kennzeichnet sie als Gebietsname, ohne das im Ausgangstext nicht ausdrücklich stehende Wort »Provinz« einzufügen.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: Schetar-Bosnai
  rationale: Der Personenname wird in einer dem Deutschen angepassten Form wiedergegeben.
- source_word: וּכְנָוָתֵהּ
  choice: und seine Amtskollegen
  rationale: Das Wort bezeichnet die mit ihm verbundenen Personen. »Amtskollegen« entspricht dem administrativen Zusammenhang; das singularische Suffix wird mit »seine« bewahrt.
- source_word: אֲפַרְסְכָיֵא
  choice: die Beamten
  rationale: Der schwierige Ausdruck kann eine Gruppe von Amtsträgern oder den Namen einer ethnischen beziehungsweise administrativen Gruppe bezeichnen. Die funktionale Wiedergabe passt zum amtlichen Kontext, während die alternative Deutung in der Fußnote erhalten bleibt.
- source_word: עַל
  choice: an
  rationale: In Verbindung mit »senden« bezeichnet die Präposition den Empfänger und wird im Deutschen idiomatisch mit »an« wiedergegeben.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: König Darius
  rationale: Diese Wortstellung ist im heutigen Deutschen natürlich und bewahrt den Königstitel.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer amtlicher Diktion. Die dokumentarische Einleitung bleibt erkennbar; die Unsicherheit bei אֲפַרְסְכָיֵא wird nicht im Haupttext überladen, sondern durch eine unmittelbar zugeordnete Fußnote offengehalten.
