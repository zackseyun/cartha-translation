    issue: „aus dem Haus Gottes“ statt „des Hauses Gottes“
    rationale: Die aramäische Konstruktverbindung מָאנַיָּא דִּי בֵית אֱלָהָא bestimmt die Gefäße als zum Haus Gottes gehörig. „Aus“ kann im Deutschen eher Herkunft bzw. Entnahme nahelegen und verwischt diese Zuordnung.
  - severity: low
    issue: Namensformen „Kyrus“ und „Scheschbazzar“
    rationale: Für modernes deutsches Bibeldeutsch sind „Kyros“ und „Scheschbazar“ die geläufigeren Formen. „Nebukadnezzar“ entspricht ebenfalls dem verbreiteten deutschen Bibelgebrauch.
  - severity: low
    issue: Fußnotenanker am Satzende
    rationale: Die Fußnote erläutert die Namensformel שְׁמֵהּ und sollte daher an „Scheschbazar“ stehen, nicht erst nach dem gesamten Satz.
  revised_text: Auch die goldenen und silbernen Gefäße des Hauses Gottes, die Nebukadnezzar aus dem Tempel in Jerusalem weggenommen und in den Tempel in Babylon gebracht hatte, nahm König Kyros aus dem Tempel in Babylon und gab sie einem Mann namens Scheschbazar[a], den er zum Statthalter eingesetzt hatte.
