source:
  edition: WLC
  text: וְ֠/אַף מָאנַיָּ֣/א דִֽי בֵית אֱלָהָ/א֮ דִּ֣י דַהֲבָ֣/ה וְ/כַסְפָּ/א֒ דִּ֣י נְבוּכַדְנֶצַּ֗ר הַנְפֵּק֙ מִן הֵֽיכְלָ/א֙ דִּ֣י בִֽ/ירוּשְׁלֶ֔ם וְ/הֵיבֵ֣ל הִמּ֔וֹ לְ/הֵיכְלָ֖/א דִּ֣י בָבֶ֑ל הַנְפֵּ֨ק הִמּ֜וֹ כּ֣וֹרֶשׁ מַלְכָּ֗/א מִן הֵֽיכְלָ/א֙ דִּ֣י בָבֶ֔ל וִ/יהִ֨יבוּ֙ לְ/שֵׁשְׁבַּצַּ֣ר שְׁמֵ֔/הּ דִּ֥י פֶחָ֖ה שָׂמֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/014.yaml
  text: Also[a], the gold and silver vessels of the house of God, which Nebuchadnezzar had taken out from the temple that was in Jerusalem and brought them to the temple of Babylon—Cyrus the king took them out from the temple of Babylon and gave them to one named Sheshbazzar, whom he had appointed governor.
translation:
  language: de
  text: Auch die goldenen und silbernen Gefäße des Hauses Gottes, die Nebukadnezzar aus dem Tempel in Jerusalem weggenommen und in den Tempel in Babylon gebracht hatte, nahm König Kyros aus dem Tempel in Babylon und gab sie einem Mann namens Scheschbazar[a], den er zum Statthalter eingesetzt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und gab sie Scheschbazar – so war sein Name –, den er zum Statthalter gemacht hatte“.'
    reason: Die Fußnote bewahrt die auffällige aramäische Namensformel und die formalere Wiedergabe von שָׂמֵהּ.
lexical_decisions:
- source_word: וְאַף
  choice: Auch
  rationale: Die aramäische Verbindung hat additive Kraft und führt einen weiteren Punkt des Berichts ein; „Auch“ ist knapp und natürlich.
- source_word: מָאנַיָּא דִי בֵית אֱלָהָא
  choice: die ... Gefäße aus dem Haus Gottes
  rationale: „Gefäße“ bezeichnet hier die Tempelgeräte. „Haus Gottes“ bewahrt die vom späteren הֵיכְלָא („Tempel“) unterschiedene Ausdrucksweise; „aus“ gibt die Zugehörigkeit im Deutschen natürlich wieder.
- source_word: דִי דַהֲבָה וְכַסְפָּא
  choice: die goldenen und silbernen
  rationale: Die Materialangaben werden im Deutschen idiomatisch als Adjektive wiedergegeben.
- source_word: הַנְפֵּק ... וְהֵיבֵל הִמּוֹ
  choice: weggenommen und ... gebracht hatte
  rationale: Das Plusquamperfekt verdeutlicht, dass Nebukadnezars Handlungen der späteren Handlung des Kyrus vorausgingen; das Objekt bleibt durch den Relativsatz eindeutig.
- source_word: הֵיכְלָא
  choice: Tempel
  rationale: Im Zusammenhang sind sowohl das Heiligtum in Jerusalem als auch der Tempel in Babel gemeint; „Tempel“ ist hier die klare kultische Bezeichnung.
- source_word: כּוֹרֶשׁ מַלְכָּא
  choice: König Kyrus
  rationale: Natürliche deutsche Wiedergabe des Titels bei Wahrung der Identität und Funktion.
- source_word: וִיהִיבוּ לְשֵׁשְׁבַּצַּר שְׁמֵהּ
  choice: gab sie einem Mann namens Scheschbazzar
  rationale: Die aramäische Namensformel „Scheschbazzar – sein Name“ wird verständlich und ohne Bedeutungsverlust wiedergegeben.
- source_word: פֶחָה
  choice: Statthalter
  rationale: Übliche und verständliche deutsche Bezeichnung für das persische Verwaltungsamt.
- source_word: שָׂמֵהּ
  choice: eingesetzt hatte
  rationale: Das Verb bezeichnet hier die Einsetzung in ein Amt; das Plusquamperfekt stellt sie als vorausliegend dar.
