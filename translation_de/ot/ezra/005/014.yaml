revisions:
- from: Auch die goldenen und silbernen Gefäße aus dem Haus Gottes, die Nebukadnezar aus dem Tempel in Jerusalem weggenommen und in den Tempel von Babel gebracht hatte, nahm König Kyrus aus dem Tempel von Babel und gab sie einem Mann namens Scheschbazzar, den er zum Statthalter eingesetzt hatte.[a]
  to: Auch die goldenen und silbernen Gefäße des Hauses Gottes, die Nebukadnezzar aus dem Tempel in Jerusalem weggenommen und in den Tempel in Babylon gebracht hatte, nahm König Kyros aus dem Tempel in Babylon und gab sie einem Mann namens Scheschbazar[a], den er zum Statthalter eingesetzt hatte.
  rationale: Die Revision stellt die possessive Beziehung der Gefäße zum „Haus Gottes“ klar, verwendet für den Ortsnamen die heutige eindeutige Form „Babylon“, vereinheitlicht die Namen mit dem üblichen deutschen Bibelgebrauch und verankert die erläuternde Fußnote an der tatsächlich erläuterten Namensformel. Bedeutung und zeitliche Abfolge des Ausgangstextes bleiben unverändert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T16:19:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Satz gibt die Abfolge und die zentralen aramäischen Ausdrücke insgesamt zutreffend wieder: die goldenen und silbernen Kultgefäße, ihre Wegnahme aus Jerusalem, ihre Überführung nach Babylon sowie ihre Übergabe an den eingesetzten Statthalter. Eine Präzisierung ist dennoch angezeigt: Die Gefäße sind im Aramäischen ausdrücklich „des Hauses Gottes“, nicht primär „aus dem Haus Gottes“. Zudem bezeichnet בָּבֶל hier den Ort Babylon.'
  naturalness: Der lange Satz ist im modernen Standarddeutsch gut verständlich. „Gefäße des Hauses Gottes“ ist zugleich idiomatisch und quellennäher. „Tempel in Babylon“ vermeidet die im heutigen Deutsch weniger eindeutige Ortsbezeichnung „Tempel von Babel“.
  terminology: „Haus Gottes“ gegenüber „Tempel“ erhält die Differenz zwischen בֵּית אֱלָהָא und הֵיכְלָא. „Statthalter“ ist für פֶּחָה passend. Die im deutschen Bibelgebrauch üblichen Namensformen „Nebukadnezzar“, „Kyros“ und „Scheschbazar“ sind vorzuziehen. Der Fußnotenanker wird unmittelbar bei der Namensformel gesetzt.
  issues:
