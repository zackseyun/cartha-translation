translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haus Gottes“ und „Tempel“ bleiben entsprechend den zwei verschiedenen aramäischen Ausdrücken unterschieden. Der lange Satzbau des Originals wird beibehalten, aber durch natürliche deutsche Wortstellung lesbar gemacht.
