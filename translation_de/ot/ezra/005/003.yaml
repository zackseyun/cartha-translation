base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/003.yaml
  text: 'At that time Tattenai[a], the governor of Beyond the River[c][b], and Shethar-bozenai and their associates came to them and spoke thus to them: “Who gave you a decree to build this house and to complete this structure?”'
translation:
  language: de
  text: 'Zu jener Zeit kamen Tattenai, der Statthalter des Gebiets jenseits des Stroms[a], Schetar-Bosnai und ihre Begleiter zu ihnen und sagten zu ihnen: »Wer hat euch den Befehl erteilt, dieses Haus zu bauen und dieses Bauwerk[b] zu vollenden?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jenseits des Stroms“ war die persische Verwaltungsbezeichnung für das Gebiet westlich des Euphrat.
    reason: cultural_note
  - marker: b
    text: Das aramäische Wort ist selten und in seiner genauen Bedeutung unsicher. Gemeint sein kann das Bauwerk oder die Bauanlage; manche verstehen es spezieller als Mauer oder Konstruktion.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: Zu jener Zeit
  rationale: Die aramäische Zeitangabe wird als natürliche, erzählerisch gehobene deutsche Wendung wiedergegeben.
- source_word: אֲתָא עֲלֵיהוֹן
  choice: kamen … zu ihnen
  rationale: Die Verbindung bezeichnet das Herantreten an die judäischen Bauleute; die deutsche Formulierung ist klar und wahrt die Bewegungsrichtung.
- source_word: תַּתְּנַי
  choice: Tattenai
  rationale: Der Personenname wird in einer im Deutschen etablierten Transliteration wiedergegeben.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: der Statthalter des Gebiets jenseits des Stroms
  rationale: פַּחַת bezeichnet einen Statthalter; עֲבַר נַהֲרָה ist die persische Verwaltungsbezeichnung für das Gebiet westlich des Euphrat. Der Zusatz „des Gebiets“ macht die Funktion der Bezeichnung im Deutschen verständlich.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: Schetar-Bosnai
  rationale: Der Eigenname wird nach geläufiger deutscher Bibelnamenform transliteriert.
- source_word: וּכְנָוָתְהוֹן
  choice: und ihre Amtsgenossen
  rationale: Im Kontext einer amtlichen Untersuchung sind damit die ihnen zugeordneten Kollegen beziehungsweise Begleiter gemeint; „Amtsgenossen“ bildet diesen Zusammenhang präzise und knapp ab.
- source_word: וְכֵן אָמְרִין לְהֹם
  choice: und fragten sie
  rationale: Wörtlich wird die folgende Rede mit „und so sagten sie zu ihnen“ eingeführt. Da die direkte Rede eine Frage ist, gibt „fragten sie“ die kommunikative Funktion natürlich wieder.
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: Wer hat euch den Befehl erteilt
  rationale: טְעֵם bezeichnet hier eine autoritative Anordnung oder Verfügung. „Den Befehl erteilt“ ist im Deutschen idiomatisch und lässt den amtlichen Charakter erkennen.
- source_word: בַּיְתָא דְנָה לִבְנֵא
  choice: dieses Haus zu bauen
  rationale: „Haus“ bewahrt die Ausdrucksweise des Ausgangstextes; aus dem Kontext ergibt sich, dass der Tempel gemeint ist. Das Verb wird ohne interpretierende Erweiterung als „bauen“ wiedergegeben.
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: dieses Bauwerk
  rationale: Das seltene und in seiner genauen Bedeutung unsichere Substantiv bezeichnet vermutlich die bauliche Anlage, Konstruktion oder Arbeit. „Bauwerk“ wahrt diese semantische Breite.
- source_word: לְשַׁכְלָלָה
  choice: zu vollenden
  rationale: Das Verb bezeichnet das Fertigstellen beziehungsweise Zur-Vollendung-Bringen und passt zum formellen Ton der amtlichen Anfrage.
