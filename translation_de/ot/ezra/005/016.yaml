base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/016.yaml
  text: Then this Sheshbazzar came and laid the foundations of the house of God that is in Jerusalem[a]; and from then until now it has been being built[b], but it is not finished.
translation:
  language: de
  text: Da kam dieser Scheschbazzar und legte die Fundamente[a] des Hauses Gottes in Jerusalem. Von jener Zeit an bis heute wird daran gebaut[b], doch es ist nicht fertig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gab Fundamente“; idiomatisch: „legte die Fundamente“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird es gebaut“. Das aramäische Verb bezeichnet hier einen fortdauernden passiven Bauvorgang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Da
  rationale: Markiert in der aramäischen Erzählung die zeitliche Abfolge; „Da“ ist im Deutschen natürlich und prägnant.
- source_word: שֵׁשְׁבַּצַּר דֵּךְ
  choice: dieser Scheschbazzar
  rationale: Der Name wird nach geläufiger deutscher Form wiedergegeben; „dieser“ bewahrt den rückverweisenden Demonstrativcharakter.
- source_word: אֲתָא
  choice: kam
  rationale: Direkte Wiedergabe des einfachen narrativen Verbs.
- source_word: יְהַב אֻשַּׁיָּא
  choice: legte die Fundamente
  rationale: Die aramäische Wendung lautet wörtlich „gab/setzte Fundamente“; „Fundamente legen“ ist die natürliche deutsche Bauformulierung.
- source_word: בֵית אֱלָהָא
  choice: des Hauses Gottes
  rationale: Bewahrt die konkrete Quellformulierung; „Tempel“ wäre eine sachlich naheliegende, aber interpretierende Konkretisierung.
- source_word: דִּי בִירוּשְׁלֶם
  choice: in Jerusalem
  rationale: Die attributive Ortsangabe lässt sich im Deutschen ohne schwerfälligen Relativsatz unmittelbar an „Haus Gottes“ anschließen.
- source_word: וּמִן אֱדַיִן וְעַד כְּעַן
  choice: Seit jener Zeit bis heute
  rationale: Gibt die vom damaligen Zeitpunkt bis zur Gegenwart der Sprecher reichende Zeitspanne idiomatisch wieder.
- source_word: מִתְבְּנֵא
  choice: wird daran gebaut
  rationale: Bewahrt den passiven, fortdauernden Bauvorgang. „Daran“ bezieht sich natürlich auf das Haus und vermeidet die missverständliche Aussage, das Haus sei ununterbrochen im Bau gewesen.
- source_word: וְלָא שְׁלִם
  choice: doch es ist noch nicht fertig
  rationale: Drückt den zum Sprechzeitpunkt bestehenden Zustand der Nichtvollendung in klarem modernem Deutsch aus; „doch“ gibt den adversativen Sinn im Zusammenhang wieder.
