source:
  edition: WLC
  text: אֱדַ֥יִן כְּנֵ֖מָא אֲמַ֣רְנָא לְּ/הֹ֑ם מַן אִנּוּן֙ שְׁמָהָ֣ת גֻּבְרַיָּ֔/א דִּֽי דְנָ֥ה בִנְיָנָ֖/א בָּנַֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/004.yaml
  text: 'Then we told them this: “What are the names of the men who are building this building?”[a]'
translation:
  language: de
  text: 'Dann sagten wir zu ihnen: „Wie heißen die Männer, die dieses Gebäude bauen?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Dann sagten wir so zu ihnen: Was sind die Namen der Männer, die dieses Gebäude bauen?“'
    reason: Die Fußnote dokumentiert die formellere Struktur des Aramäischen, besonders כְּנֵמָא („so/folgendermaßen“) und die wörtliche Frage nach den Namen.
lexical_decisions:
- source_word: אֱדַיִן
  choice: Dann
  rationale: Das temporale beziehungsweise fortführende Adverb leitet den nächsten Erzählvorgang ein; „Dann“ gibt den Ablauf natürlich und präzise wieder.
- source_word: כְּנֵמָא אֲמַרְנָא לְּהֹם
  choice: sagten wir zu ihnen
  rationale: כְּנֵמָא bedeutet „so/folgendermaßen“, während אֲמַרְנָא das Verb „sagen“ ist. Im Deutschen kann die anschließende direkte Rede die Bedeutung von „folgendermaßen“ tragen, ohne dass das Adverb eigens wiedergegeben werden muss.
- source_word: מַן אִנּוּן שְׁמָהָת
  choice: Wie heißen
  rationale: Wörtlich steht eine Frage nach den Namen. Die idiomatische deutsche Wendung „Wie heißen …?“ bewahrt genau diesen Sinn.
- source_word: גֻּבְרַיָּא
  choice: die Männer
  rationale: Das aramäische Substantiv ist ausdrücklich maskulin und bezeichnet Männer; daher wird es nicht geschlechtsneutral verallgemeinert.
- source_word: דִּי
  choice: die
  rationale: Die Relativpartikel verbindet „die Männer“ mit der folgenden partizipialen Handlung; das deutsche Relativpronomen „die“ ist hier angemessen.
- source_word: דְנָה בִנְיָנָא
  choice: dieses Gebäude
  rationale: Die Verbindung bezeichnet das konkrete Bauwerk. „Gebäude“ ist im Deutschen natürlicher als die lexikalisch mögliche, aber kontextuell abstraktere Wiedergabe „Bau“ oder „Bauwerk“.
- source_word: בָּנַיִן
  choice: bauen
  rationale: Das Partizip beschreibt eine andauernde Tätigkeit. Das deutsche Präsens gibt diesen Verlauf in diesem Relativsatz natürlich wieder; „wiederaufbauen“ wäre eine nicht im Wort selbst ausgedrückte Kontextdeutung.
theological_decisions:
- issue: Sprecherwechsel gegenüber dem vorangehenden Bericht
  choice: Die erste Person Plural „wir“ wird unverändert bewahrt.
  alternative: Konjekturale oder harmonisierende Wiedergabe in der dritten Person
  rationale: Der überlieferte aramäische Text hat אֲמַרְנָא („wir sagten“). Die auffällige Perspektive wird nicht stillschweigend geglättet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Hauptfassung ist idiomatisch, bleibt aber durch die Fußnote transparent gegenüber der aramäischen Satzgestalt. Die im WLC bezeugte erste Person Plural wird trotz ihrer erzählerischen Auffälligkeit erhalten.
