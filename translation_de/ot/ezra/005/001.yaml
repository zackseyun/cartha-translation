  terminology: „Haggai“, „Sacharja“, „Iddo“, „Prophet(en)“, „weissagten“, „Juden“, „Juda“ und „Gott Israels“ sind angemessen und konsistent. „Der Sohn Iddos“ gibt die aramäische Filiationsform korrekt wieder.
