source:
  edition: WLC
  text: וְ/הִתְנַבִּ֞י חַגַּ֣י נביא/ה וּ/זְכַרְיָ֤ה בַר עִדּוֹא֙ נביאי/א עַל יְה֣וּדָיֵ֔/א דִּ֥י בִ/יה֖וּד וּ/בִ/ירוּשְׁלֶ֑ם בְּ/שֻׁ֛ם אֱלָ֥הּ יִשְׂרָאֵ֖ל עֲלֵי/הֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/001.yaml
  text: Haggai the prophet and Zechariah son of Iddo[a], the prophets, prophesied to the Jews who were in Judah and in Jerusalem[b], in the name of the God of Israel who was over them.
translation:
  language: de
  text: Und Haggai, der Prophet, und Sacharja, der Sohn Iddos, die Propheten, weissagten den Juden, die in Juda und Jerusalem waren, im Namen des Gottes Israels, der über ihnen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְנַבִּי
  choice: Und … weissagten
  rationale: Das Peal-Perfekt bezeichnet die einsetzende Erzählhandlung. Das vorangestellte וְ wird schlicht mit „Und“ wiedergegeben; wegen des zusammengesetzten Subjekts steht das Verb im Deutschen im Plural.
- source_word: חַגַּי נביאה
  choice: Haggai, der Prophet
  rationale: Der Personenname folgt der üblichen deutschen Form; die determinierte Apposition wird ausdrücklich bewahrt.
- source_word: וּזְכַרְיָה בַר עִדּוֹא
  choice: und Sacharja, der Sohn Iddos
  rationale: בַר bezeichnet das Sohnverhältnis. „Sacharja“ und „Iddo“ entsprechen den geläufigen deutschen Namensformen.
- source_word: נביאיא
  choice: die Propheten
  rationale: Die pluralische Apposition fasst Haggai und Sacharja zusammen. Sie bleibt trotz ihrer scheinbaren Redundanz erhalten.
- source_word: עַל יְהוּדָיֵא
  choice: den Juden
  rationale: עַל kennzeichnet hier die Adressaten der prophetischen Rede. יְהוּדָיֵא kann „Juden“ oder geografisch „Judäer“ bedeuten; im Kontext ist „Juden“ natürlich und sachgerecht.
- source_word: דִּי בִיהוּד וּבִירוּשְׁלֶם
  choice: die in Juda und Jerusalem lebten
  rationale: דִּי leitet den Relativsatz ein. „lebten“ gibt den örtlichen Aufenthalt in idiomatischem Deutsch wieder, ohne eine dauerhafte Ansässigkeit besonders zu betonen.
- source_word: בְּשֻׁם
  choice: im Namen
  rationale: Die feste Wendung bezeichnet das Reden im Namen und unter der Autorität eines anderen.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: des Gottes Israels
  rationale: Die aramäische Genitivverbindung wird unmittelbar wiedergegeben.
- source_word: עֲלֵיהוֹן
  choice: der über ihnen war
  rationale: Die Schlusswendung wird am wahrscheinlichsten auf den Gott Israels bezogen und drückt seine Hoheit beziehungsweise schützende Aufsicht über die Juden aus. Die Fußnote bewahrt die mögliche syntaktische Alternative.
theological_decisions:
- issue: Bezug und Aussage von עֲלֵיהוֹן
  choice: „der über ihnen war“ bezieht die Wendung auf den Gott Israels und wahrt die Aussage seiner Hoheit über die Juden.
  alternative: Die Wendung kann enger mit dem Weissagen verbunden und im Sinn von „an sie“ verstanden werden.
  rationale: Die Stellung nach „Gott Israels“ legt den Bezug auf Gott nahe. Da die knappe aramäische Konstruktion jedoch syntaktisch mehrdeutig bleibt, wird die andere Deutung in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „weissagten“ erhält den prophetischen Fachbegriff; die doppelte Apposition „der Prophet … die Propheten“ bewahrt bewusst die Struktur des aramäischen Textes.
