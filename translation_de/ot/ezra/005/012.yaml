  source_fidelity: 'Eine sichere Korrektur ist bei לָהֵן nötig: Das Wort ist hier folgernd („darum/deshalb“), nicht adversativ („doch“). Die übrigen zentralen Elemente – Ursache des Gerichts, Auslieferung „in die Hand“, Nebukadnezar als Chaldäer, „dieses Haus“ und die Wegführung nach Babylon – werden sachgerecht wiedergegeben.'
  naturalness: „Doch weil“ stellt im Deutschen einen Gegensatz her, den der aramäische Diskursmarker nicht ausdrückt. Die überarbeitete Satzfolge mit „Darum gab er sie …, weil …“ ist modernes, klares Standarddeutsch. „Er“ im zweiten Satz hat nach der vollständigen Nennung Nebukadnezars einen eindeutigen Bezug.
  terminology: „Gott des Himmels“, „in die Hand geben“, „Chaldäer“ und „dieses Haus“ sind angemessen und quellennah. Bei עַמָּה ist die possessivische Nuance im Deutschen ohne einen potenziell irreführenden Bezug von „sein“ auf Nebukadnezar besser als „das Volk“ wiederzugeben; die Fußnote vermerkt die Form des Aramäischen und wahrt die Kontextnuance.
