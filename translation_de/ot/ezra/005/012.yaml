source:
  edition: WLC
  text: לָהֵ֗ן מִן דִּ֨י הַרְגִּ֤זוּ אֲבָהֳתַ֨/נָא֙ לֶ/אֱלָ֣הּ שְׁמַיָּ֔/א יְהַ֣ב הִמּ֔וֹ בְּ/יַ֛ד נְבוּכַדְנֶצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל כסדי/א וּ/בַיְתָ֤/ה דְנָה֙ סַתְרֵ֔/הּ וְ/עַמָּ֖/ה הַגְלִ֥י לְ/בָבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/012.yaml
  text: Therefore[a], because our fathers provoked the God of heaven to wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean[c][b], and he destroyed this house and carried the people away to Babylon.
translation:
  language: de
  text: Darum gab er sie in die Hand Nebukadnezars, des Königs von Babylon, des Chaldäers, weil unsere Vorfahren den Gott des Himmels zum Zorn reizten. Er zerstörte dieses Haus[a] und führte das Volk[b] nach Babylon in die Verbannung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „diesem Haus“ ist der Tempel gemeint.
    reason: cultural_note
  - marker: b
    text: Das Aramäische hat hier wörtlich „sein Volk“; gemeint ist im Zusammenhang das weggeführte Volk.
    reason: textual_clarification
lexical_decisions:
- source_word: לָהֵן מִן דִּי
  choice: Doch weil
  rationale: לָהֵן setzt hier einen Gegensatz zur zuvor geschilderten früheren Herrlichkeit des Tempels, während מִן דִּי den Grund angibt. „Doch weil“ gibt beide Funktionen in natürlichem Deutsch wieder.
- source_word: הַרְגִּזוּ
  choice: zum Zorn reizten
  rationale: Die Kausativform von רגז bezeichnet das Hervorrufen von Zorn oder Erregung. Die gewählte Formulierung bewahrt sowohl die Verursachung als auch den feierlichen Ton.
- source_word: אֲבָהֳתַנָא
  choice: unsere Vorfahren
  rationale: Wörtlich steht „unsere Väter“; im heutigen Deutsch bezeichnet „Vorfahren“ eindeutig die früheren Generationen und vermeidet eine unnötige Beschränkung auf männliche Elternteile.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: den Gott des Himmels
  rationale: Die bestimmte aramäische Gottesbezeichnung wird unmittelbar und idiomatisch wiedergegeben.
- source_word: יְהַב הִמּוֹ בְּיַד
  choice: gab er sie in die Hand
  rationale: Die Wendung bezeichnet die Auslieferung in die Gewalt eines anderen. Das biblische Bild der „Hand“ bleibt erhalten und ist im Deutschen verständlich.
- source_word: נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל כסדיא
  choice: Nebukadnezars, des Königs von Babylon, des Chaldäers
  rationale: Die singularische Volksbezeichnung steht als Apposition zu Nebukadnezar. „Chaldäer“ übersetzt sie, ohne sie deutend durch „Babylonier“ zu ersetzen.
- source_word: וּבַיְתָה דְנָה סַתְרֵהּ
  choice: Dieser zerstörte dieses Haus
  rationale: „Haus“ entspricht dem Ausgangstext; im Zusammenhang ist der Tempel gemeint. Das demonstrative „Dieser“ macht im Deutschen den Wechsel vom göttlichen zum menschlichen Handlungsträger klar, der durch den unmittelbar vorausgehenden Nebukadnezar angezeigt ist.
- source_word: וְעַמָּה הַגְלִי לְבָבֶל
  choice: und verschleppte sein Volk nach Babylon
  rationale: Die Kausativform von גלה bedeutet, jemanden ins Exil zu führen. „Verschleppte“ macht Zwang und Ortsverlagerung deutlich; das Possessivsuffix an „Volk“ bleibt als „sein“ sichtbar.
theological_decisions:
- issue: Unmittelbare Zuschreibung des Gerichts an Gott
  choice: gab er sie in die Hand Nebukadnezars
  alternative: ließ er sie in Nebukadnezars Hand fallen
  rationale: Der Text sagt ausdrücklich, dass Gott die Vorfahren auslieferte; eine bloße Zulassung würde diese Aussage abschwächen.
- issue: Bezeichnung des Tempels
  choice: dieses Haus
  alternative: diesen Tempel
  rationale: Obwohl eindeutig der Tempel gemeint ist, verwendet der aramäische Text „Haus“. Die Übersetzung erhält diese theologisch bedeutsame Ausdrucksweise und erläutert den Bezug in einer Fußnote.
- issue: Bezug des Possessivsuffixes bei „Volk“
  choice: sein Volk
  alternative: das Volk
  rationale: Das aramäische Wort trägt ein Possessivsuffix. Die Übersetzung lässt dessen Bezug in derselben knappen Form stehen, statt die Zugehörigkeit im Haupttext näher auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt übersichtlich, bewahrt aber zentrale aramäische Bilder wie „in die Hand geben“ und „dieses Haus“. „Vorfahren“ ist heute natürlicher als das wörtliche „Väter“. Die Apposition „des Chaldäers“ erhält die historische Bezeichnung des Ausgangstextes.
