    issue: „Doch“ für לָהֵן
    rationale: לָהֵן ist ein inferierender bzw. folgernder Anschluss („darum/deshalb“). Der vorangehende Kontext begründet keinen adversativen Anschluss; „Doch“ verändert daher die Diskursrelation.
  - severity: low
