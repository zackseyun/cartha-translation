  rationale: Die Revision ersetzt den nicht gedeckten Gegensatzmarker „Doch“ durch die folgernde Beziehung von לָהֵן. Sie lässt die direkte göttliche Auslieferung, die historische Bezeichnung „der Chaldäer“ und die wörtliche Tempelbezeichnung „dieses Haus“ stehen. „Das Volk“ vermeidet im modernen Deutschen den missverständlichen Eindruck, Nebukadnezar habe sein eigenes Volk deportiert, während die Fußnote die possessivische aramäische Form transparent macht.
