    rationale: Die Aussage geht über die knappe aramäische Form hinaus und ist als Erklärung des Possessivsuffixes nicht präzise. Der Bezug ist kontextuell das weggeführte Volk; eine Fußnote sollte dies nicht mit einer zusätzlichen Zugehörigkeitsdefinition festlegen.
