base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/007.yaml
  text: 'They sent a report to him[b][a], and this was what was written in it: “To Darius the king: all peace.”'
translation:
  language: de
  text: 'Sie sandten ihm einen Bericht[a], und darin stand Folgendes: »Dem König Darius: vollen Frieden.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine amtliche Mitteilung« beziehungsweise »ein Schriftstück«. Das aramäische Wort kann verschiedene Formen offizieller Kommunikation bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Vollen Frieden« ist eine förmliche Briefgrußformel und wünscht umfassenden Frieden und Wohlergehen.
    reason: cultural_note
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: Bericht
  rationale: Das reichsaramäische Wort kann eine amtliche Mitteilung, einen Bericht oder ein Schriftstück bezeichnen. »Bericht« passt zum Verwaltungskontext, ohne die Form des Dokuments zu eng festzulegen.
- source_word: שְׁלַחוּ
  choice: sie sandten
  rationale: Direkte Wiedergabe des Peal Perfekt 3. Person Plural; »sandten« entspricht dem würdigen Erzählregister.
- source_word: עֲלוֹהִי
  choice: ihm
  rationale: In Verbindung mit »senden« bezeichnet die Präposition hier idiomatisch den Empfänger.
- source_word: וְכִדְנָה כְּתִיב בְּגַוֵּהּ
  choice: und darin stand Folgendes
  rationale: Die idiomatische deutsche Formulierung führt den genauen Wortlaut des Schriftstücks ein und gibt sowohl den deiktischen Ausdruck »so/dies« als auch »war darin geschrieben« natürlich wieder.
- source_word: לְדָרְיָוֶשׁ מַלְכָּא
  choice: An Darius, den König
  rationale: Die Präposition kennzeichnet den Adressaten; »den König« bleibt als Apposition zum Namen erhalten.
- source_word: שְׁלָמָא כֹלָּא
  choice: vollen Frieden
  rationale: Die Wendung ist ein förmlicher Briefgruß. »Vollen Frieden« bewahrt das Grundwort »Frieden« und gibt die intensivierende Bedeutung von כֹלָּא verständlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verwaltungs- und Briefform bleibt erkennbar; »darin stand Folgendes« vermeidet eine unnötig schwerfällige Passivkonstruktion. Die ungewöhnliche Grußformel wird quellennah bewahrt und in der Fußnote erläutert.
