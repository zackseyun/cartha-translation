  text: וַ/אֲמַר לֵ֓/הּ אלה מָֽאנַיָּ֔/א שֵׂ֚א אֵֽזֶל אֲחֵ֣ת הִמּ֔וֹ בְּ/הֵיכְלָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וּ/בֵ֥ית אֱלָהָ֖/א יִתְבְּנֵ֥א עַל אַתְרֵֽ/הּ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/015.yaml
  text: And he said to him[a], ‘Take these vessels, go and put them in the temple that is in Jerusalem, and let the house of God be rebuilt on its site.’
translation:
  language: de
  text: 'Und er sagte zu ihm: »Nimm diese Geräte, geh und stelle sie in den Tempel in Jerusalem; das Haus Gottes soll an seiner Stätte wieder aufgebaut werden.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »gebaut werden«. Im Zusammenhang ist der Wiederaufbau des zerstörten Hauses Gottes an seinem bisherigen Standort gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר לֵהּ
  choice: Und er sagte zu ihm
  rationale: Die aramäische Erzählform und das männliche Singularsuffix werden klar und natürlich wiedergegeben.
- source_word: אֵלֶּה מָאנַיָּא
  choice: diese Geräte
  rationale: מָאנַיָּא bezeichnet hier die für den Tempeldienst bestimmten Gegenstände; »Geräte« ist im Deutschen natürlicher und weiter gefasst als »Gefäße«.
- source_word: שֵׂא אֵזֶל אֲחֵת הִמּוֹ
  choice: Nimm …, geh und stelle sie
  rationale: Die Folge der Imperative wird in flüssigem modernem Deutsch bewahrt. »Stelle sie« gibt das Platzieren der Gegenstände wieder, ohne eine unnötig technische Nuance einzutragen.
- source_word: בְּהֵיכְלָא דִּי בִירוּשְׁלֶם
  choice: in den Tempel in Jerusalem
  rationale: הֵיכְלָא meint im Kontext eindeutig den Tempel. Die verkürzte deutsche Fassung gibt den aramäischen Relativanschluss natürlich wieder.
- source_word: וּבֵית אֱלָהָא יִתְבְּנֵא
  choice: Das Haus Gottes soll … wieder aufgebaut werden
  rationale: Die passive Verbform bedeutet wörtlich »gebaut werden«; angesichts des zuvor zerstörten Tempels bringt »wieder aufgebaut« den kontextuell gemeinten Wiederaufbau zum Ausdruck.
- source_word: עַל אַתְרֵהּ
  choice: an seiner Stätte
  rationale: Die Formulierung wahrt den Ortsbezug und den würdigen Ton; das Suffix bezieht sich auf das Haus Gottes.
theological_decisions: []
