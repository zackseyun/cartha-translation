  text: בֵּ/אדַ֡יִן קָ֠מוּ זְרֻבָּבֶ֤ל בַּר שְׁאַלְתִּיאֵל֙ וְ/יֵשׁ֣וּעַ בַּר יֽוֹצָדָ֔ק וְ/שָׁרִ֣יו לְ/מִבְנֵ֔א בֵּ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירֽוּשְׁלֶ֑ם וְ/עִמְּ/ה֛וֹן נביאי/א דִֽי אֱלָהָ֖/א מְסָעֲדִ֥ין לְ/הֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/002.yaml
  text: Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak arose and began to build the house of God that is in Jerusalem[a], and with them were the prophets of God[c][b], supporting them.
translation:
  language: de
  text: Da machten sich Serubbabel, der Sohn Schealtiels, und Jeschua, der Sohn Jozadaks, auf und begannen, das Haus Gottes in Jerusalem[a] zu bauen. Die Propheten Gottes waren bei ihnen und unterstützten sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Tempel Gottes«. Wörtlich: »das Haus Gottes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Da
  rationale: Der aramäische Erzählmarker führt das unmittelbar folgende Geschehen ein; »Da« gibt den Fortgang knapp und natürlich wieder.
- source_word: קָמוּ
  choice: machten sich … auf
  rationale: Das Verb bedeutet wörtlich »standen auf«; in Verbindung mit dem begonnenen Bau bezeichnet es idiomatisch den entschlossenen Beginn des Handelns.
- source_word: זְרֻבָּבֶל
  choice: Serubbabel
  rationale: Im Deutschen etablierte Form des Personennamens.
- source_word: בַּר שְׁאַלְתִּיאֵל
  choice: der Sohn Schealtiëls
  rationale: בַּר ist die aramäische Bezeichnung für »Sohn«; die deutsche Namensform folgt dem üblichen biblischen Gebrauch.
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Die Wiedergabe bewahrt die hier vorliegende kürzere Namensform und unterscheidet sie von der verwandten Form »Josua«.
- source_word: בַּר יוֹצָדָק
  choice: der Sohn Jozadaks
  rationale: Direkte Wiedergabe des aramäischen Patronymikons mit der im Kontext passenden Namensform.
- source_word: וְשָׁרִיו לְמִבְנֵא
  choice: und begannen … zu bauen
  rationale: Das finite Verb mit Infinitiv bezeichnet den Beginn des Bauens; die deutsche Wortstellung ist idiomatisch.
- source_word: בֵּית אֱלָהָא
  choice: das Haus Gottes
  rationale: Die Formulierung gibt den aramäischen Ausdruck wörtlich wieder, ohne die kontextuell zutreffende Deutung als Tempel in den Haupttext einzusetzen.
- source_word: דִּי בִירוּשְׁלֶם
  choice: in Jerusalem
  rationale: Der Relativsatz bezeichnet den Standort des Hauses Gottes; im Deutschen genügt hier die knappe Ortsangabe.
- source_word: מְסָעֲדִין לְהוֹן
  choice: unterstützten sie
  rationale: Das Partizip beschreibt fortdauernde aktive Hilfe oder Unterstützung beim Werk.
theological_decisions:
- issue: Bezeichnung des Heiligtums
  choice: Haus Gottes
  alternative: Tempel Gottes
  rationale: Der Haupttext bewahrt die wörtliche aramäische Bezeichnung und lässt zugleich durch eine Fußnote erkennen, dass damit der Tempel gemeint ist.
translation_notes:
  register: Moderne, würdige Standardsprache. »Machten sich auf« verbindet den wörtlichen Gedanken des Aufstehens mit dem entschlossenen Handlungsbeginn. Die zwei Hauptsätze vermeiden eine schwerfällige Nachbildung der aramäischen Satzfügung.
