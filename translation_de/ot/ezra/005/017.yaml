  text: וּ/כְעַ֞ן הֵ֧ן עַל מַלְכָּ֣/א טָ֗ב יִ֠תְבַּקַּר בְּ/בֵ֨ית גִּנְזַיָּ֜/א דִּי מַלְכָּ֣/א תַמָּה֮ דִּ֣י בְּ/בָבֶל֒ הֵ֣ן אִיתַ֗י דִּֽי מִן כּ֤וֹרֶשׁ מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/מִבְנֵ֛א בֵּית אֱלָהָ֥/א דֵ֖ךְ בִּ/ירוּשְׁלֶ֑ם וּ/רְע֥וּת מַלְכָּ֛/א עַל דְּנָ֖ה יִשְׁלַ֥ח עֲלֶֽי/נָא־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/017.yaml
  text: And now[a], if it seems good to the king, let a search be made in the royal treasury there in Babylon, whether it is so that a decree was issued by King Cyrus to rebuild this house of God in Jerusalem[b]; and let the king send to us his pleasure concerning this matter.
translation:
  language: de
  text: 'Und nun: Wenn es dem König gut erscheint, möge man im königlichen Schatzhaus dort in Babylon nachforschen, ob von König Kyrus ein Erlass ergangen ist, dieses Haus Gottes in Jerusalem zu bauen[a]. Und möge der König uns seine Entscheidung in dieser Sache mitteilen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wieder aufzubauen«. Das aramäische Verb bedeutet zunächst »bauen«; der Zusammenhang beschreibt die Wiederherstellung des zerstörten Gotteshauses.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »seinen Willen«; auch: »sein Wohlgefallen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעַן
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende als auch die folgernde Funktion der aramäischen Wendung und klingt in einem amtlichen Schreiben natürlich.
- source_word: הֵן עַל מַלְכָּא טָב
  choice: Wenn es dem König gut erscheint
  rationale: Gibt die ehrerbietige höfische Formel förmlich, aber in verständlichem modernem Deutsch wieder.
- source_word: יִתְבַּקַּר
  choice: soll man … nachforschen
  rationale: Vermittelt den unpersönlichen Aufforderungssinn und passt zur angeordneten Suche in königlichen Beständen.
- source_word: בְּבֵית גִּנְזַיָּא
  choice: im königlichen Schatzhaus
  rationale: Das wörtliche »Haus der Schätze« bezeichnet den königlichen Aufbewahrungsort, an dem auch amtliche Schriftstücke verwahrt wurden; »Schatzhaus« wahrt diese Bildlichkeit besser als das rein deutende »Archiv«.
- source_word: הֵן אִיתַי דִּי
  choice: ob … tatsächlich
  rationale: Bringt den prüfenden und bestätigenden Sinn der Konstruktion in idiomatischem Deutsch zum Ausdruck.
- source_word: מִן כּוֹרֶשׁ מַלְכָּא שִׂים טְעֵם
  choice: König Kyrus … den Befehl erlassen hat
  rationale: טְעֵם bezeichnet hier eine amtliche Anordnung; die aktive deutsche Form ist klar und bewahrt Kyrus als Urheber.
- source_word: לְמִבְנֵא
  choice: zu bauen
  rationale: Entspricht unmittelbar dem aramäischen Verb. Der Wiederaufbau ist durch den historischen Zusammenhang erkennbar und wird in der Fußnote als mögliche kontextuelle Wiedergabe genannt.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: dieses Haus Gottes
  rationale: Bewahrt die konkrete Bezeichnung »Haus Gottes« und den Demonstrativausdruck, ohne deutend zu »Tempel« zu wechseln.
- source_word: וּרְעוּת מַלְכָּא
  choice: seine Entscheidung
  rationale: Im Kontext des amtlichen Ersuchens bezeichnet die königliche Willensäußerung die erbetene Entscheidung; die Alternative »Wille« bleibt in der Fußnote sichtbar.
- source_word: יִשְׁלַח עֲלֵינָא
  choice: uns … mitteilen
  rationale: Gibt das wörtliche »zu uns senden« im Deutschen idiomatisch als Übermittlung der königlichen Entscheidung wieder.
