  to: Doch das Auge ihres Gottes ruhte auf den Ältesten der Juden[a], und sie hinderten sie nicht, bis eine Entscheidung zu Darius gelangen würde; danach würden sie ein Schreiben über diese Angelegenheit zurücksenden[c][b].
  rationale: 'Die Revision erhält die Metapher und die administrative Mehrdeutigkeit von טַעְמָא. Sie stellt die im Aramäischen angelegte Abfolge klar dar: Die Ältesten werden nicht gehindert, bis eine Entscheidung zu Darius gelangen würde; anschließend würden die betreffenden Personen ein Schreiben zu dieser Angelegenheit zurücksenden. Die Fußnoten bewahren die sachlich möglichen Alternativen, ohne den Haupttext zu überladen.'
