  text: וְ/עֵ֣ין אֱלָהֲ/הֹ֗ם הֲוָת֙ עַל שָׂבֵ֣י יְהוּדָיֵ֔/א וְ/לָא בַטִּ֣לוּ הִמּ֔וֹ עַד טַעְמָ֖/א לְ/דָרְיָ֣וֶשׁ יְהָ֑ךְ וֶ/אֱדַ֛יִן יְתִיב֥וּן נִשְׁתְּוָנָ֖/א עַל דְּנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/005.yaml
  text: But the eye of their God was on the elders of the Jews[a], and they did not make them stop until a decree should go to Darius[c][b]; then they would send back a letter concerning this matter.
translation:
  language: de
  text: Doch das Auge ihres Gottes ruhte auf den Ältesten der Juden[a], und sie hinderten sie nicht, bis eine Entscheidung zu Darius gelangen würde; danach würden sie ein Schreiben über diese Angelegenheit zurücksenden[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wachte über die Ältesten der Juden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bis eine Anordnung zu Darius gelangen würde“; das aramäische Wort kann eine amtliche Entscheidung oder Anordnung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „danach würden sie in dieser Sache schriftlich Antwort geben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵין אֱלָהֲהֹם
  choice: Doch das Auge ihres Gottes
  rationale: Bewahrt das konkrete Bild und den ausdrücklichen pronominalen Bezug „ihres Gottes“. „Doch“ gibt den Gegensatz zum Vorgehen der Beamten im vorherigen Zusammenhang natürlich wieder.
- source_word: הֲוָת עַל
  choice: ruhte auf
  rationale: Gibt die räumliche Wendung idiomatisch wieder, ohne das Bild durch eine rein deutende Formulierung wie „wachte über“ zu ersetzen.
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: den Ältesten der Juden
  rationale: שָׂבֵי bezeichnet die Ältesten; die Genitivverbindung bleibt erhalten.
- source_word: וְלָא בַטִּלוּ הִמּוֹ
  choice: und man zwang sie nicht, die Arbeit einzustellen
  rationale: Das Pael bezeichnet das Veranlassen einer Unterbrechung. Das unpersönliche „man“ gibt das nicht ausdrücklich genannte Subjekt natürlich wieder; „die Arbeit“ wird aus dem unmittelbaren Baukontext erschlossen.
- source_word: עַד טַעְמָא לְדָרְיָוֶשׁ יְהָךְ
  choice: bis eine Entscheidung an Darius gelangt wäre
  rationale: טַעְמָא kann im persischen Verwaltungskontext eine amtliche Entscheidung oder Anordnung bezeichnen. Die Bewegungsrichtung zu Darius und der noch ausstehende Vorgang werden gewahrt.
- source_word: וֶאֱדַיִן
  choice: und daraufhin
  rationale: Kennzeichnet den anschließenden Verwaltungsschritt in der zeitlichen Folge.
- source_word: יְתִיבוּן נִשְׁתְּוָנָא
  choice: ein schriftlicher Bescheid zurückkäme
  rationale: יְתִיבוּן trägt den Gedanken des Zurückkehrens beziehungsweise Zurücksendens; נִשְׁתְּוָנָא bezeichnet ein offizielles Schriftstück. Die Formulierung bildet zusammen eine natürliche deutsche Verwaltungswendung.
- source_word: עַל דְּנָה
  choice: in dieser Sache
  rationale: Gibt den demonstrativen Rückverweis im Zusammenhang idiomatisch wieder.
theological_decisions:
- issue: Anthropomorphe Darstellung der göttlichen Fürsorge
  choice: Das Bild „das Auge ihres Gottes ruhte auf“ bleibt im Haupttext erhalten.
  alternative: „Ihr Gott wachte über die Ältesten der Juden.“
  rationale: Die konkrete Bildsprache drückt Gottes schützende Aufmerksamkeit aus, ohne sie in eine dogmatisch stärker festgelegte Aussage umzudeuten.
- issue: Verhältnis von göttlichem Schutz und amtlichem Verfahren
  choice: 'Der Vers stellt beide Aussagen nebeneinander: Gottes Auge ruht auf den Ältesten, während das persische Verfahren noch aussteht.'
  alternative: Eine ausdrückliche kausale Verbindung wie „deshalb durften sie weiterarbeiten“ wäre möglich, steht aber nicht ausdrücklich im aramäischen Satz.
  rationale: Die Übersetzung vermeidet es, die theologische Aussage über Gottes Aufsicht stärker kausal auszulegen, als es die Satzverknüpfung verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Metapher vom Auge Gottes wird bewusst bewahrt. Die etwas schwer fassbare persische Verwaltungssprache wird lesbar wiedergegeben, während Alternativen zu טַעְמָא und zur schriftlichen Rückantwort in den Fußnoten offengehalten werden.
