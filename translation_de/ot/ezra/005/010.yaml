  text: וְ/אַ֧ף שְׁמָהָתְ/הֹ֛ם שְׁאֵ֥לְנָא לְּ/הֹ֖ם לְ/הוֹדָעוּתָ֑/ךְ דִּ֛י נִכְתֻּ֥ב שֻׁם גֻּבְרַיָּ֖/א דִּ֥י בְ/רָאשֵׁי/הֹֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/010.yaml
  text: We also asked them their names[a], to make them known to you[b], that we might write down the names of the men who were at their head.
translation:
  language: de
  text: Auch fragten wir sie nach ihren Namen, um dir ihre Namen mitzuteilen, damit wir die Namen der Männer aufschreiben konnten, die an ihrer Spitze standen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַף
  choice: Auch
  rationale: Die Verbindung fügt dem Bericht einen weiteren Punkt hinzu; „Auch“ gibt diese additive Funktion im Deutschen knapp und natürlich wieder.
- source_word: שְׁמָהָתְהֹם
  choice: nach ihren Namen
  rationale: Das aramäische Substantiv steht im Plural mit einem Suffix der 3. Person Plural. Zusammen mit dem Verb „fragen“ ist im Deutschen die Konstruktion „nach ihren Namen fragen“ idiomatisch.
- source_word: שְׁאֵלְנָא לְּהֹם
  choice: fragten wir sie
  rationale: Die Verbform bezeichnet das Fragen oder Erkundigen. „Wir fragten sie“ ist eine klare, gegenwartssprachliche Wiedergabe.
- source_word: לְהוֹדָעוּתָךְ
  choice: um sie dir mitzuteilen
  rationale: 'Der kausative Infinitiv von ידע mit dem Suffix der 2. Person Singular drückt den Zweck aus: Die Namen sollen dem Adressaten bekannt gemacht werden. „Sie dir mitzuteilen“ nimmt „ihre Namen“ als natürlich erschließbares Objekt auf.'
- source_word: דִּי נִכְתֻּב
  choice: damit wir … aufschreiben könnten
  rationale: דִּי leitet hier einen Zweck- oder Folgesatz ein; „damit“ wahrt diesen Zusammenhang. „Aufschreiben“ bringt den dokumentarischen Kontext des Verbs כתב natürlich zum Ausdruck, und der Konjunktiv entspricht der abhängigen Zweckangabe.
- source_word: שֻׁם גֻּבְרַיָּא
  choice: die Namen der Männer
  rationale: שֻׁם steht formal im Singular, kann hier jedoch kollektiv gebraucht sein. Der vorausgehende Plural „ihre Namen“ und das pluralische „Männer“ sprechen im Deutschen für „die Namen der Männer“.
- source_word: דִּי בְרָאשֵׁיהֹם
  choice: die an ihrer Spitze standen
  rationale: Die Wendung bedeutet wörtlich, dass diese Männer „an ihrem Kopf/ihren Köpfen“ waren, und bezeichnet die führenden Männer. „An ihrer Spitze standen“ bewahrt das Bild und ist zugleich verständliches modernes Deutsch.
theological_decisions: []
translation_notes:
