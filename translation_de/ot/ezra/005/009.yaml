  text: אֱדַ֗יִן שְׁאֵ֨לְנָא֙ לְ/שָׂבַיָּ֣/א אִלֵּ֔ךְ כְּנֵ֖מָא אֲמַ֣רְנָא לְּ/הֹ֑ם מַן שָׂ֨ם לְ/כֹ֜ם טְעֵ֗ם בַּיְתָ֤/א דְנָה֙ לְ/מִבְנְיָ֔ה וְ/אֻשַּׁרְנָ֥/א דְנָ֖ה לְ/שַׁכְלָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/009.yaml
  text: 'Then we asked those elders and said to them as follows: “Who gave you a decree to build this house and to complete this structure?”[a][b]'
translation:
  language: de
  text: 'Darauf fragten wir jene Ältesten und sagten zu ihnen: „Wer hat euch die Anordnung erteilt, dieses Haus zu bauen und dieses Bauwerk fertigzustellen?“[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dieses Haus und dieses Bauwerk“; mit dem „Haus“ ist der Tempel gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „Bauwerk“ wiedergegebene aramäische Wort kann genauer die Bausubstanz, das Gefüge oder die zugehörige Konstruktion bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Darauf
  rationale: Das aramäische Adverb kennzeichnet die zeitliche Folge im Bericht; „Darauf“ gibt diesen Erzählfortschritt in natürlichem Deutsch wieder.
- source_word: שְׁאֵלְנָא
  choice: fragten wir
  rationale: Schlichte und idiomatische Wiedergabe der berichteten Befragung.
- source_word: לְשָׂבַיָּא אִלֵּךְ
  choice: jene Ältesten
  rationale: „Jene“ bewahrt den rückverweisenden deiktischen Sinn aus der Perspektive des Berichtenden.
- source_word: כְּנֵמָא אֲמַרְנָא לְּהֹם
  choice: und sagten zu ihnen
  rationale: Die Konstruktion leitet den Inhalt der anschließenden direkten Rede ein; im Deutschen ist keine zusätzliche Wiedergabe von כְּנֵמָא nötig.
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: Wer hat euch die Anordnung gegeben
  rationale: טְעֵם bezeichnet hier eine amtliche Entscheidung, Weisung oder Anordnung. „Die Anordnung gegeben“ bewahrt den konkreten Verwaltungston, ohne die Art der Vollmacht näher festzulegen.
- source_word: בַּיְתָא דְנָה
  choice: dieses Haus
  rationale: Die wörtliche Bezeichnung „Haus“ bleibt erhalten; im Kontext ist damit der Tempel gemeint.
- source_word: לְמִבְנְיָה
  choice: zu bauen
  rationale: Der Infinitiv bezeichnet das Bauen. „Wiederaufzubauen“ wäre kontextuell möglich, fügte aber eine im Verb selbst nicht ausdrücklich enthaltene Nuance hinzu.
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: und dieses Bauwerk
  rationale: Das seltene Substantiv kann die bauliche Substanz, das Gefüge oder die zugehörige Konstruktion bezeichnen. „Bauwerk“ wahrt diese Unbestimmtheit.
- source_word: לְשַׁכְלָלָה
  choice: fertigzustellen
  rationale: Das Verb bezeichnet das Vollenden beziehungsweise Zu-Ende-Bringen der Bauarbeit; „fertigzustellen“ ist im deutschen Baukontext präzise und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem und leicht administrativem Ton. Die Satzstruktur folgt dem aramäischen Bericht, vermeidet aber die im Deutschen schwerfällige doppelte Redeeinleitung „fragten … und sagten … folgendermaßen“.
