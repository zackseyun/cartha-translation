  text: בְּרַם֙ בִּ/שְׁנַ֣ת חֲדָ֔ה לְ/כ֥וֹרֶשׁ מַלְכָּ֖/א דִּ֣י בָבֶ֑ל כּ֤וֹרֶשׁ מַלְכָּ/א֙ שָׂ֣ם טְעֵ֔ם בֵּית אֱלָהָ֥/א דְנָ֖ה לִ/בְּנֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/013.yaml
  text: However[a], in the first year of Cyrus king of Babylon, Cyrus the king issued a decree to rebuild this house of God.
translation:
  language: de
  text: Doch im ersten Jahr des Kyrus, des Königs von Babylon, erließ König Kyrus den Befehl, dieses Haus Gottes wieder aufzubauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieses Haus Gottes aufzubauen“. Das aramäische Verb bedeutet an sich „bauen“; „wieder aufbauen“ ergibt sich aus dem Zusammenhang der Wiederherstellung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: Doch
  rationale: Die aramäische adversative Partikel markiert einen deutlichen Gegensatz zum Vorangehenden; „Doch“ ist im Deutschen natürlich und würdig.
- source_word: בִּשְׁנַת חֲדָה
  choice: im ersten Jahr
  rationale: Die Wendung bezeichnet idiomatisch das erste Regierungsjahr.
- source_word: לְכוֹרֶשׁ מַלְכָּא דִּי בָבֶל
  choice: des Kyrus, des Königs von Babylon
  rationale: Das Präfix לְ kennzeichnet hier in einer Datierungsformel den Herrscher, nach dessen Regierungsjahr datiert wird; die Apposition wird im Deutschen durch Kommas kenntlich gemacht.
- source_word: שָׂם טְעֵם
  choice: erließ ... den Befehl
  rationale: Wörtlich „setzte/legte einen Befehl fest“; im königlichen Verwaltungskontext bezeichnet die Verbindung das Erlassen einer amtlichen Anordnung.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: dieses Haus Gottes
  rationale: Die Wiedergabe bewahrt das konkrete Bild und die Wortwahl des aramäischen Textes, obwohl sachlich der Tempel gemeint ist.
- source_word: לִבְנֵא
  choice: wieder aufzubauen
  rationale: Das Verb bedeutet an sich „bauen“; „wieder aufbauen“ macht den durch die Zerstörung des Tempels gegebenen Wiederherstellungskontext deutlich. Die wörtlichere Alternative wird in der Fußnote bewahrt.
