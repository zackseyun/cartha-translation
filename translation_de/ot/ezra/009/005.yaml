base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/005.yaml
  text: At the evening offering I rose from my fasting[a], with my garment and my robe torn, and I fell on my knees and spread out my hands to Yahweh my God.
translation:
  language: de
  text: Zur Zeit des Abendopfers erhob ich mich von meinem Fasten[a], mit zerrissenem Gewand und Mantel. Ich kniete nieder und breitete meine Hände zu Jahwe, meinem Gott, hin aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, genauer: „zur Zeit des Abendspeisopfers“. Das hebräische Wort kann ein Speisopfer bezeichnen, steht hier aber möglicherweise auch allgemein für die Zeit des regelmäßigen Abendopfers. „Von meinem Fasten“ kann zugleich die damit verbundene Selbstdemütigung andeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמִנְחַת הָעֶרֶב
  choice: Zur Zeit des Abendopfers
  rationale: מִנְחָה kann eine Gabe und insbesondere ein Speisopfer bezeichnen. Zusammen mit „Abend“ verweist der Ausdruck hier wahrscheinlich auf die Zeit des regelmäßigen Abendopfers; die gewählte Formulierung gibt sowohl den zeitlichen als auch den kultischen Bezug natürlich wieder.
- source_word: קַמְתִּי מִתַּעֲנִיתִי
  choice: stand ich von meinem Fasten auf
  rationale: קום bezeichnet das Aufstehen; תַּעֲנִית bezeichnet hier am ehesten das Fasten als Ausdruck der Selbsterniedrigung und Trauer. Die Formulierung lässt offen, ob primär die Fastenhandlung oder die damit verbundene gebeugte Haltung gemeint ist.
- source_word: וּבְקָרְעִי בִגְדִי וּמְעִילִי
  choice: Mein Gewand und mein Mantel waren zerrissen
  rationale: בֶּגֶד und מְעִיל werden als zwei Kleidungsstücke unterschieden. Der hebräische Begleitumstand wird im Deutschen durch einen eigenen Satz klar und natürlich ausgedrückt.
- source_word: וָאֶכְרְעָה עַל בִּרְכַּי
  choice: Dann fiel ich auf die Knie
  rationale: כרע bedeutet sich niederbeugen oder niederknien. „auf die Knie fallen“ ist eine natürliche deutsche Wendung und vermittelt die eindringliche Gebetshaltung.
- source_word: וָאֶפְרְשָׂה כַפַּי
  choice: breitete meine Hände … aus
  rationale: פרשׂ mit כף beschreibt das Öffnen und Ausbreiten der Hände als Gebetsgeste. „die Hände ausbreiten“ bewahrt dieses konkrete Bild.
- source_word: אֶל יְהוָה אֱלֹהָי
  choice: zu Jahwe, meinem Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; אֶל bezeichnet hier die Ausrichtung der Gebetsgeste auf Gott.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, um den im hebräischen Text ausdrücklich verwendeten Bundesnamen sichtbar zu erhalten.
- issue: Bedeutung von תַּעֲנִית
  choice: Fasten
  alternative: Selbsterniedrigung / Kasteiung
  rationale: Im Zusammenhang von Esras Trauer bezeichnet das Wort wahrscheinlich das konkrete Fasten, trägt aber zugleich den Gedanken der Selbsterniedrigung. Die Übersetzung nennt die konkrete Handlung, ohne die weitere Bedeutungsnuance dogmatisch auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Sätze machen die Abfolge der Handlungen verständlich, ohne die ernste Gebetsszene abzuschwächen. „Abendopfer“ ist im Haupttext bewusst allgemein gehalten; der Ausdruck kann das Speisopfer selbst oder die feststehende abendliche Opferzeit bezeichnen.
