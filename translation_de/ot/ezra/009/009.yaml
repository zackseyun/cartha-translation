base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/009.yaml
  text: For we are servants[a]; yet in our slavery our God has not forsaken us, but has extended covenant faithfulness to us before the kings of Persia, to give us reviving, to raise up the house of our God, to set up its ruins[b], and to give us a wall in Judah and in Jerusalem.
translation:
  language: de
  text: Denn wir sind Sklaven; doch in unserer Knechtschaft hat unser Gott uns nicht verlassen. Er hat uns vor den Königen Persiens seine treue Liebe[a] zugewandt, um uns neues Leben zu schenken, das Haus unseres Gottes wieder aufzurichten, seine Trümmer wiederherzustellen und uns in Juda und Jerusalem eine Mauer[b] zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Bundestreue“, „seine beständige Liebe“, „seine Güte“ oder „seine Gunst“. Das hebräische Wort חֶסֶד bezeichnet gnädige, verlässliche und loyale Zuwendung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen Schutzwall“ beziehungsweise „eine schützende Einfriedung“. Das Bild kann allgemein Schutz und Sicherheit in Juda und Jerusalem bezeichnen, nicht nur eine buchstäbliche Mauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים / עַבְדֻתֵנוּ
  choice: Sklaven / Knechtschaft
  rationale: Die Wörter bezeichnen hier Unterworfenheit beziehungsweise den Zustand des Dienstes unter fremder Herrschaft. „Sklaven“ wahrt die Schärfe der Aussage; „Knechtschaft“ stellt die sprachliche Verbindung im Deutschen würdig und idiomatisch her.
- source_word: עֲזָבָנוּ
  choice: hat uns nicht verlassen
  rationale: „Verlassen“ gibt das hebräische Verb in natürlichem deutschem Gebetsstil wieder und kann sowohl Preisgabe als auch Abwendung bezeichnen.
- source_word: וַיַּט עָלֵינוּ חֶסֶד
  choice: hat uns … seine treue Liebe zugewandt
  rationale: „Zugewandt“ nimmt die Bewegungsrichtung des Verbs נטה auf; „treue Liebe“ bewahrt bei חֶסֶד sowohl Güte als auch verlässliche Loyalität, ohne die Bundeskategorie im Haupttext ausdrücklich festzulegen.
- source_word: לִפְנֵי מַלְכֵי פָרַס
  choice: vor den Königen Persiens
  rationale: Die Präposition bezeichnet hier die Gegenwart beziehungsweise das Angesicht der persischen Könige; „vor“ ist knapp und idiomatisch.
- source_word: מִחְיָה
  choice: neues Leben
  rationale: Das Substantiv kann Erhaltung, Wiederbelebung oder erneuertes Leben meinen. Im nachexilischen Zusammenhang vermittelt „neues Leben“ verständlich sowohl Fortbestand als auch Erneuerung.
- source_word: לְרוֹמֵם אֶת בֵּית אֱלֹהֵינוּ
  choice: das Haus unseres Gottes wieder aufzurichten
  rationale: „Haus unseres Gottes“ bewahrt die hebräische Bezeichnung für den Tempel; „wieder aufzurichten“ gibt das Erhöhen beziehungsweise Wiederherstellen im Baukontext natürlich wieder.
- source_word: וּלְהַעֲמִיד אֶת חָרְבֹתָיו
  choice: seine Trümmer wiederherzustellen
  rationale: Wörtlich geht es darum, das Verwüstete wieder zum Stehen zu bringen. Die gewählte Formulierung macht den Wiederaufbau im Deutschen klar, ohne den Bezug auf die zerstörten Teile des Gotteshauses aufzugeben.
- source_word: גָדֵר
  choice: eine Mauer
  rationale: Das Wort bezeichnet eine Mauer, einen Zaun oder eine Einfriedung. Das konkrete Bild bleibt im Haupttext erhalten; die mögliche Bedeutung von Schutz und Sicherheit wird in der Fußnote offengehalten.
- source_word: בִּיהוּדָה וּבִירוּשָׁלִָם
  choice: in Juda und Jerusalem
  rationale: Die Präposition ist lokal zu verstehen. Die Wiedergabe vermeidet die unbelegte Festlegung, die Mauer umschließe das ganze Gebiet.
theological_decisions:
- issue: Bedeutung von חֶסֶד
  choice: treue Liebe
  alternative: Bundestreue; beständige Liebe; Güte; Gunst
  rationale: חֶסֶד verbindet gnädige Zuwendung mit verlässlicher Loyalität. „Treue Liebe“ hält beide Aspekte zusammen, ohne den im Wort möglichen Bundesbezug im Haupttext stärker festzulegen, als der Ausdruck allein verlangt.
- issue: Bildhafte oder konkrete Bedeutung von גָדֵר
  choice: eine Mauer
  alternative: ein Schutzwall; eine schützende Einfriedung; Schutz und Sicherheit
  rationale: Das konkrete Bild wird bewahrt, während die Fußnote offenlässt, dass es angesichts der persischen Oberherrschaft umfassender für gewährten Schutz und gesicherte Existenz stehen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert. Die wiederholten Zweckangaben bleiben als zusammengehörige Reihe erhalten; konkrete Bilder und semantische Spannungen werden nicht konfessionell vereindeutigt.
