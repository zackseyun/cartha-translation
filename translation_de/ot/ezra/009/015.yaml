  source_fidelity: Der Entwurf gibt Anrede, Gottesnamen, Gottes Gerechtigkeit, das Übrigbleiben eines geretteten Restes und die unpersönliche Schlussaussage im Wesentlichen treffend wieder. „All dessen“ erweitert jedoch das singuläre זֹאת („dies / dies hier“) unnötig und sollte nicht pluralisch verallgemeinert werden.
  naturalness: „Als Entronnene übrig geblieben“ ist verständlich, aber im modernen Standarddeutsch weniger glatt als „als ein Rest übrig geblieben“. „Hier stehen wir“ ist als präsentierende Wendung natürlich und bewahrt den Gebetscharakter.
  terminology: „Jahwe“, „gerecht“, „Schuld“ und „vor dir bestehen“ sind angemessen. „Ein Rest“ gibt פְלֵיטָה als kollektive Bezeichnung der Entkommenen idiomatisch wieder, ohne die Überlebensbedeutung zu verlieren.
