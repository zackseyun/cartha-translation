source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ צַדִּ֣יק אַ֔תָּה כִּֽי נִשְׁאַ֥רְנוּ פְלֵיטָ֖ה כְּ/הַ/יּ֣וֹם הַ/זֶּ֑ה הִנְ/נ֤וּ לְ/פָנֶ֨י/ךָ֙ בְּ/אַשְׁמָתֵ֔י/נוּ כִּ֣י אֵ֥ין לַ/עֲמ֛וֹד לְ/פָנֶ֖י/ךָ עַל זֹֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/015.yaml
  text: O Yahweh[a], God of Israel, you are righteous, for we have been left as a remnant, as it is this day. Here we are before you in our guilt[c][b], for no one can stand before you because of this.
translation:
  language: de
  text: Jahwe, Gott Israels, du bist gerecht; denn wir sind als ein Rest übrig geblieben, wie es heute der Fall ist.[a] Hier stehen wir vor dir in unserer Schuld; denn deswegen kann niemand vor dir bestehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie an diesem Tag“.'
    reason: Die hebräische Wendung bezeichnet den bis heute sichtbaren gegenwärtigen Zustand.
  - marker: b
    text: 'Wörtlich: „Denn es gibt deswegen kein Stehen vor dir.“ Gemeint ist, dass niemand unter dieser Schuld in Gottes Gegenwart standhalten kann.'
    reason: Erläutert die unpersönliche hebräische Konstruktion und das Idiom „vor dir stehen“.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich gebrauchten Gottesnamen in seiner im Deutschen üblichen Form wieder.
- source_word: צַדִּיק
  choice: gerecht
  rationale: Bewahrt die moralische und richterliche Weite des hebräischen Begriffs, ohne ihn allein auf strafende Gerechtigkeit einzuengen.
- source_word: נִשְׁאַרְנוּ פְלֵיטָה
  choice: wir sind als Entronnene übrig geblieben
  rationale: Das Passiv von נִשְׁאַרְנוּ wird durch „übrig geblieben“ gewahrt; פְלֵיטָה bezeichnet hier die dem Gericht Entkommenen beziehungsweise den geretteten Rest.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: wie es heute der Fall ist
  rationale: Gibt die hebräische Gegenwartsformel in natürlichem modernem Deutsch wieder.
- source_word: הִנְנוּ לְפָנֶיךָ
  choice: Sieh, wir stehen … vor dir
  rationale: „Sieh“ bewahrt die präsentierende Funktion von הִנְנוּ; die Satzstellung ist für das Deutsche angepasst.
- source_word: בְּאַשְׁמָתֵינוּ
  choice: in unserer Schuld
  rationale: Bezeichnet den schuldhaften Zustand des Volkes vor Gott, nicht lediglich ein subjektives Schuldgefühl.
- source_word: כִּי אֵין לַעֲמוֹד לְפָנֶיךָ עַל זֹאת
  choice: Denn wegen all dessen kann niemand vor dir bestehen
  rationale: כִּי bleibt kausal als „denn“ erhalten. Die unpersönliche hebräische Konstruktion wird mit „niemand“ wiedergegeben; „bestehen“ vermittelt die Unfähigkeit, unter dieser Schuld in Gottes Gegenwart standzuhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im Ausgangstext. „Jahwe“ macht ihn sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Gottes Gerechtigkeit angesichts des überlebenden Restes
  choice: du bist gerecht
  alternative: du bist im Recht
  rationale: Die Formulierung lässt offen, wie Gottes Gericht und die Bewahrung der Entronnenen zueinander stehen, und bewahrt so die theologische Spannung des Verses.
- issue: Verknüpfung des letzten כִּי-Satzes
  choice: Denn
  alternative: obwohl
  rationale: Die kausale Grundbedeutung von כִּי wird beibehalten. Die Spannung, dass das Volk vor Gott steht und zugleich wegen seiner Schuld nicht vor ihm bestehen kann, wird nicht durch eine konzessive Umdeutung aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze erhalten den feierlichen Charakter des Gebets. „Entronnene“ ist bewusst gehoben, aber allgemein verständlich; „bestehen“ wahrt die gerichtliche und relationale Bedeutung des hebräischen Ausdrucks.
