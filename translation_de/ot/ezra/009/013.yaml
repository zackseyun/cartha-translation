  text: וְ/אַֽחֲרֵי֙ כָּל הַ/בָּ֣א עָלֵ֔י/נוּ בְּ/מַעֲשֵׂ֨י/נוּ֙ הָ/רָעִ֔ים וּ/בְ/אַשְׁמָתֵ֖/נוּ הַ/גְּדֹלָ֑ה כִּ֣י אַתָּ֣ה אֱלֹהֵ֗י/נוּ חָשַׂ֤כְתָּֽ לְ/מַ֨טָּה֙ מֵֽ/עֲוֺנֵ֔/נוּ וְ/נָתַ֥תָּה לָּ֛/נוּ פְּלֵיטָ֖ה כָּ/זֹֽאת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/013.yaml
  text: And after all that has come upon us because of our evil deeds and our great guilt—though you, our God, have punished us less than our iniquities deserve and have given us such a remnant as this—
translation:
  language: de
  text: Und nach allem, was wegen unserer bösen Taten und unserer großen Schuld über uns gekommen ist – obwohl du, unser Gott, uns weniger bestraft hast, als unsere Vergehen es verdient hätten, und uns einen solchen Rest[a] gegeben hast –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „solche Überlebende“; auch: „eine solche Rettung“. Das hebräische Wort kann das Entrinnen beziehungsweise die durch das Gericht hindurch bewahrten Überlebenden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי
  choice: Und nach
  rationale: Bewahrt den Anschluss an den vorhergehenden Gebetszusammenhang und gibt die hebräische Konjunktion natürlich wieder.
- source_word: כָּל הַבָּא עָלֵינוּ
  choice: allem, was … über uns gekommen ist
  rationale: Gibt die hebräische Wendung eng und zugleich idiomatisch auf Deutsch wieder.
- source_word: בְּמַעֲשֵׂינוּ הָרָעִים וּבְאַשְׁמָתֵנוּ הַגְּדֹלָה
  choice: wegen unserer bösen Taten und unserer großen Schuld
  rationale: Versteht בְּ hier kausal; „Schuld“ bezeichnet objektive Schuld und nicht bloß ein Schuldgefühl.
- source_word: כִּי
  choice: obwohl
  rationale: Im Zusammenhang führt כִּי den Gegensatz zwischen verdientem Gericht und Gottes schonendem Handeln ein.
- source_word: חָשַׂכְתָּ לְמַטָּה מֵעֲוֺנֵנוּ
  choice: uns geringer bestraft hast, als unsere Vergehen es verdient hätten
  rationale: 'Macht den Sinn der schwierigen hebräischen Wendung verständlich: Gott ließ das Gericht hinter dem durch die Schuld verwirkten Maß zurückbleiben.'
- source_word: עָוֺן
  choice: Vergehen
  rationale: Bezeichnet schuldhaftes Unrecht; „Vergehen“ vermeidet hier die unschöne unmittelbare Wiederholung von „Schuld“.
- source_word: פְּלֵיטָה כָּזֹאת
  choice: eine solche Schar Entronnener
  rationale: פְּלֵיטָה kann das Entrinnen oder die dem Gericht entronnenen Menschen bezeichnen. Die Formulierung wahrt diesen Überlebendenbezug, ohne den stärker deutenden Begriff „Rest“ in den Haupttext zu setzen.
theological_decisions:
- issue: Gottes Schonung im Verhältnis zum verdienten Gericht
  choice: uns geringer bestraft hast, als unsere Vergehen es verdient hätten
  alternative: mehr von uns verschont hast, als unsere Vergehen erwarten ließen
  rationale: Die Hauptfassung bringt das gemeinte untermaßige Gericht klar zum Ausdruck, während die Alternative die Grundbedeutung „zurückhalten/verschonen“ des Verbs stärker hervorhebt.
- issue: Bedeutung von פְּלֵיטָה im nachexilischen Zusammenhang
  choice: eine solche Schar Entronnener
  alternative: einen solchen Rest / eine solche Rettung
  rationale: Die gewählte Fassung bleibt nahe am möglichen Personenbezug des Nomens. Die Fußnote bewahrt sowohl die kollektiv-theologische Deutung „Rest“ als auch die abstrakte Deutung „Rettung“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als abhängiger, zum folgenden Vers hin offener Gebetssatz mit Gedankenstrich stehen. Die schwierige Gerichtswendung wird im Haupttext verständlich wiedergegeben; die Mehrdeutigkeit von פְּלֵיטָה bleibt durch die Fußnote sichtbar.
