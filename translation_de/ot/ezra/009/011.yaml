base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/011.yaml
  text: which you commanded by the hand of your servants the prophets[a], saying, ‘The land that you are entering to possess is a land of impurity because of the impurity of the peoples of the lands[b], because of their abominations with which they have filled it from end to end with their uncleanness.’
translation:
  language: de
  text: 'das du durch deine Diener, die Propheten, geboten hast[a]. Du hast gesagt: »Das Land, in das ihr kommt, um es in Besitz zu nehmen, ist ein Land der Unreinheit – wegen der Unreinheit der Völker dieser Länder und wegen ihrer abscheulichen Taten. Damit haben sie es von einem Ende bis zum anderen mit ihrer Unreinheit erfüllt[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch die Hand deiner Diener, der Propheten«; die hebräische Wendung bezeichnet Vermittlung.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier die hebräische Wendung »von Mund zu Mund«; gemeint ist das ganze Land, von einem Ende bis zum anderen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: durch
  rationale: Die hebräische Wendung bedeutet hier vermittelnde Urheberschaft. Das natürliche deutsche »durch« gibt die prophetische Vermittlung klar wieder; die wörtliche Form »durch die Hand« wäre im heutigen Deutsch unnötig sperrig.
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: deine Diener, die Propheten
  rationale: »Diener« wahrt den ehrenden Sinn für Gottes Beauftragte; die Apposition kennzeichnet sie als Propheten.
- source_word: לְרִשְׁתָּהּ
  choice: um es in Besitz zu nehmen
  rationale: Die Formulierung gibt den finalen Sinn und die Landnahmebedeutung von ירשׁ wieder, ohne sie auf bloßes Erben zu verengen.
- source_word: אֶרֶץ נִדָּה
  choice: ein Land der Unreinheit
  rationale: »Unreinheit« bewahrt die kultischen und moralischen Bedeutungsanklänge von נִדָּה, ohne sie vorschnell auf eine Kategorie festzulegen.
- source_word: בְּנִדַּת עַמֵּי הָאֲרָצוֹת
  choice: wegen der Unreinheit der Völker dieser Länder
  rationale: Das ב wird im Zusammenhang kausal verstanden. Der Plural »Länder« bleibt erhalten; »dieser Länder« ist im Deutschen verständlicher als das missverständliche »der Länder der Völker«.
- source_word: בְּתוֹעֲבֹתֵיהֶם
  choice: wegen ihrer abscheulichen Taten
  rationale: תּוֹעֵבָה bezeichnet hier verabscheuungswürdige Praktiken. »Abscheuliche Taten« ist kräftig, verständlich und weniger kirchensprachlich als »Gräuel«.
- source_word: מִפֶּה אֶל־פֶּה
  choice: von einem Ende bis zum anderen
  rationale: Die wörtliche Wendung »von Mund zu Mund« ist ein räumliches Idiom für vollständige Ausdehnung; die deutsche Wiedergabe vermittelt den gemeinten Sinn.
- source_word: בְּטֻמְאָתָם
  choice: mit ihrer Unreinheit
  rationale: Die Wiederaufnahme von »Unreinheit« erhält das Leitmotiv der Verunreinigung und wahrt sowohl kultische als auch moralische Konnotationen.
theological_decisions:
- issue: Art der Verunreinigung des Landes
  choice: Die Begriffe werden mit »Unreinheit« und »abscheulichen Taten« wiedergegeben, ohne die Aussage ausschließlich kultisch oder ausschließlich moralisch zu deuten.
  alternative: Die Sprache vollständig als rituelle Unreinheit oder ausschließlich als moralische Verderbtheit wiederzugeben.
  rationale: נִדָּה, טֻמְאָה und תּוֹעֵבָה verbinden kultische, moralische und bundesbezogene Vorstellungen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde zur besseren Verständlichkeit leicht gegliedert. »Unreinheit« erhält die bewusst mehrdeutige Verunreinigungssprache; »abscheuliche Taten« vermittelt die Stärke von תּוֹעֵבָה ohne unnötig altertümlichen Ausdruck.
