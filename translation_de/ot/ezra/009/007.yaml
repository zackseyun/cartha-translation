source:
  edition: WLC
  text: מִ/ימֵ֣י אֲבֹתֵ֗י/נוּ אֲנַ֨חְנוּ֙ בְּ/אַשְׁמָ֣ה גְדֹלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בַ/עֲוֺנֹתֵ֡י/נוּ נִתַּ֡נּוּ אֲנַחְנוּ֩ מְלָכֵ֨י/נוּ כֹהֲנֵ֜י/נוּ בְּ/יַ֣ד מַלְכֵ֣י הָ/אֲרָצ֗וֹת בַּ/חֶ֜רֶב בַּ/שְּׁבִ֧י וּ/בַ/בִּזָּ֛ה וּ/בְ/בֹ֥שֶׁת פָּנִ֖ים כְּ/הַ/יּ֥וֹם הַ/זֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/007.yaml
  text: From the days of our fathers until this day[a], we have been in great guilt. Because of our iniquities, we, our kings, and our priests have been given into the hand of the kings of the lands, to the sword, to captivity, to plunder, and to shame of face, as it is this day.
translation:
  language: de
  text: Seit den Tagen unserer Vorfahren bis auf den heutigen Tag sind wir schwer schuldig. Wegen unserer Vergehen sind wir, unsere Könige und unsere Priester in die Hand der Könige der Länder ausgeliefert worden – dem Schwert, der Gefangenschaft, der Plünderung und der öffentlichen Schande[a] –, wie es heute der Fall ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Schande des Angesichts“; auch: „offene Schande“ oder „Demütigung“.'
    reason: Die Fußnote bewahrt das konkrete hebräische Bild und nennt mögliche sinngemäße Wiedergaben.
lexical_decisions:
- source_word: מִימֵי אֲבֹתֵינוּ
  choice: Seit den Tagen unserer Vorfahren
  rationale: מִן mit יָמִים bezeichnet den zeitlichen Ausgangspunkt. „Seit“ gibt zusammen mit „bis auf den heutigen Tag“ die fortdauernde Zeitspanne natürlich wieder; „Vorfahren“ ist im heutigen Deutsch inklusiver und kontextuell passender als das mögliche „Väter“.
- source_word: אֲנַחְנוּ בְּאַשְׁמָה גְדֹלָה
  choice: stehen wir in großer Schuld
  rationale: אַשְׁמָה bezeichnet objektive Schuld beziehungsweise Schuldhaftigkeit, nicht bloß ein Schamgefühl. „In großer Schuld stehen“ bewahrt den rechtlich-moralischen Sinn und passt zur zeitlichen Fortdauer.
- source_word: וּבַעֲוֺנֹתֵינוּ
  choice: Wegen unserer Vergehen
  rationale: Die Präposition ב ist hier kausal zu verstehen. עָוֹן umfasst schuldhaftes Unrecht und kann auch dessen Folgen berühren; „Vergehen“ unterscheidet den Ausdruck von אַשְׁמָה, ohne eine zusätzliche dogmatische Präzisierung einzutragen.
- source_word: נִתַּנּוּ
  choice: sind ... gegeben worden
  rationale: Der Nifal von נָתַן ist passiv. Das deutsche Perfekt beschreibt das historische Ausgeliefertwerden mit bis in die Gegenwart reichendem Ergebnis.
- source_word: בְּיַד מַלְכֵי הָאֲרָצוֹת
  choice: in die Hand der Könige der Länder
  rationale: Die konkrete hebräische Wendung für das Ausliefern in fremde Gewalt bleibt erhalten. אֲרָצוֹת meint hier verschiedene Länder beziehungsweise Reiche, nicht die gesamte Erde.
- source_word: בַּחֶרֶב בַּשְּׁבִי וּבַבִּזָּה
  choice: dem Schwert, der Gefangenschaft, der Plünderung
  rationale: Die dreifache Gerichtsformel wird knapp und parallel wiedergegeben. „Gefangenschaft“ ist weiter als „Exil“, und „Plünderung“ bezeichnet verständlich das gewaltsame Erbeuten.
- source_word: וּבְבֹשֶׁת פָּנִים
  choice: und öffentlicher Schande
  rationale: Wörtlich steht „Schande des Angesichts“. Gemeint ist sichtbare, öffentliche Erniedrigung; die natürliche deutsche Wiedergabe wird durch eine Fußnote mit dem Bild des Ausgangstextes ergänzt.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: so wie es heute der Fall ist
  rationale: Die Wendung verweist auf die gegenwärtig erkennbare Lage. Diese Formulierung ist modern und würdig, ohne den Vergleich mit der Gegenwart abzuschwächen.
theological_decisions:
- issue: Unterscheidung der moralischen Begriffe אַשְׁמָה und עָוֹן
  choice: אַשְׁמָה als „Schuld“, עָוֹן als „Vergehen“ wiedergeben
  alternative: Beide Begriffe unterschiedslos mit „Sünde“ übersetzen oder עָוֹן mit „Missetaten“ wiedergeben
  rationale: Die Unterscheidung wahrt die sprachliche Schichtung zwischen dem Schuldzustand und den schuldhaften Taten, ohne eine konfessionelle Systematik einzutragen.
- issue: Gemeinschaftliche Solidarität im Schuldbekenntnis
  choice: „wir, unsere Könige und unsere Priester“ gemeinsam unter dem Ausgeliefertwerden nennen
  alternative: Den Satz so umstellen, dass nur die früheren Führungspersonen als verantwortlich erscheinen
  rationale: Der hebräische Text schließt die Gemeinschaft ausdrücklich zusammen mit ihren politischen und priesterlichen Leitern ein. Diese Spannung zwischen persönlicher und gemeinschaftlicher Schuld darf nicht abgeschwächt werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Die hebräische Übergabeformel „in die Hand“ bleibt erhalten; schwer verständliche Wörtlichkeit wird nur bei „Schande des Angesichts“ in die Fußnote verlegt. Der Marker [a] steht unmittelbar bei der erläuterten Formulierung.
