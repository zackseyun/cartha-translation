base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/014.yaml
  text: Shall we again break your commandments and intermarry with the peoples of these abominations? Would you not be angry with us until you had consumed us[b][a], leaving no remnant or survivor?
translation:
  language: de
  text: Wollen wir nun wieder deine Gebote brechen und Heiratsverbindungen mit den Völkern eingehen, die diese Abscheulichkeiten verüben?[a] Würdest du nicht über uns zürnen, bis du uns völlig vernichtet hättest, sodass kein Rest und kein Entkommener mehr da wäre?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „mit den Völkern dieser Abscheulichkeiten“. Gemeint sind wahrscheinlich Völker, die durch solche abscheulichen Praktiken gekennzeichnet sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bis zur vollständigen Vernichtung, sodass kein Rest und kein Entronnener mehr da wäre“. Das hebräische Wort kann das Entrinnen selbst oder einen Entkommenen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָשׁוּב
  choice: Sollten wir da wieder
  rationale: שׁוב bedeutet wörtlich „zurückkehren“, bezeichnet hier aber idiomatisch die erneute Aufnahme des früheren Ungehorsams. „Da wieder“ bindet die rhetorische Frage natürlich an den vorausgehenden Zusammenhang an.
- source_word: לְהָפֵר מִצְוֺתֶיךָ
  choice: deine Gebote brechen
  rationale: הפר bezeichnet im rechtlich-bundestheologischen Zusammenhang das Brechen oder Übertreten; die geläufige deutsche Wendung bewahrt diesen Nachdruck.
- source_word: וּלְהִתְחַתֵּן
  choice: und uns … verheiraten
  rationale: Der Hitpael von חתן bezeichnet das Eingehen wechselseitiger Heiratsbeziehungen zwischen Gruppen. Die reflexive Formulierung ist im Deutschen natürlich und erfasst den gruppenbezogenen Sinn.
- source_word: בְּעַמֵּי הַתֹּעֵבוֹת הָאֵלֶּה
  choice: mit den Völkern …, die diese abscheulichen Dinge tun
  rationale: Wörtlich steht die gedrängte Konstruktion „mit den Völkern dieser Abscheulichkeiten“. Die Wiedergabe bezieht die negative Wertung nachvollziehbar auf die Praktiken, ohne sie als Wesensaussage über die ethnischen Gruppen zu formulieren; die wörtlichere Möglichkeit wird in einer Fußnote erhalten.
- source_word: הֲלוֹא תֶאֱנַף בָּנוּ
  choice: Würdest du dann nicht so zornig auf uns werden
  rationale: אנף bezeichnet heftigen Zorn. Die rhetorische Frage erwartet Zustimmung; „so … dass“ verbindet den Zorn idiomatisch mit seinem im Folgenden genannten Ausmaß.
- source_word: עַד כַּלֵּה
  choice: dass du uns vollständig vernichtest
  rationale: כלה bezeichnet hier das vollständige Zu-Ende-Bringen beziehungsweise Vernichten. Die resultative Konstruktion gibt die Tragweite in natürlichem Deutsch wieder.
- source_word: לְאֵין שְׁאֵרִית וּפְלֵיטָה
  choice: und weder Rest noch Entkommener übrig bleibt
  rationale: שְׁאֵרִית bezeichnet das Verbliebene, פְלֵיטָה kann abstrakt „Entrinnen“ oder konkret einen Entkommenen bezeichnen. Die Formulierung bewahrt die Parallelität und den Wechsel zwischen kollektivem Rest und entkommener Person.
theological_decisions:
- issue: Charakterisierung der fremden Völker durch תּוֹעֵבוֹת
  choice: Die Wertung im Haupttext auf ihre abscheulichen Praktiken beziehen.
  alternative: „mit den Völkern dieser Abscheulichkeiten“
  rationale: Die hebräische Genitivverbindung ist mehrdeutig und sehr gedrängt. Der Kontext betrifft religiös-moralische Praktiken und verbotene Heiratsverbindungen; daher vermeidet der Haupttext eine unbegründete Wesensaussage über ethnische Zugehörigkeit, während die Fußnote die formnähere Lesart offenhält.
- issue: Bedeutung von פְלֵיטָה neben שְׁאֵרִית
  choice: Konkret als „Entkommener“ wiedergeben.
  alternative: Abstrakt „Entrinnen“ oder kollektiv „Überlebende“
  rationale: 'Neben dem kollektiven „Rest“ ergibt die konkrete Bedeutung eine prägnante Steigerung: Weder bleibt eine Restgruppe noch eine einzelne entkommene Person. Die lexikalische Mehrdeutigkeit wird in der Fußnote genannt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in direkter Gebetsrede. Die beiden rhetorischen Fragen bleiben erhalten. „Abscheuliche Dinge“ ist allgemein verständlich; die stärker traditionelle Bezeichnung „Gräuel“ wurde vermieden. Die Syntax wurde gegenüber der hebräischen Verdichtung behutsam entfaltet, ohne die Warnung vor vollständigem Gericht abzuschwächen.
