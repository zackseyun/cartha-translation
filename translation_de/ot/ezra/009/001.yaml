  to: 'Als dies abgeschlossen war, traten die führenden Amtsträger an mich heran und sagten: »Das Volk Israel, die Priester und die Leviten haben sich nicht von den Völkern der Länder abgesondert, entsprechend ihren Gräueln[a], nämlich denen der Kanaaniter, Hetiter, Perisiter, Jebusiter, Ammoniter, Moabiter, Ägypter und Amoriter.«'
