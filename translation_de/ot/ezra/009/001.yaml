  text: וּ/כְ/כַלּ֣וֹת אֵ֗לֶּה נִגְּשׁ֨וּ אֵלַ֤/י הַ/שָּׂרִים֙ לֵ/אמֹ֔ר לֹֽא נִבְדְּל֞וּ הָ/עָ֤ם יִשְׂרָאֵל֙ וְ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת כְּ֠/תוֹעֲבֹֽתֵי/הֶם לַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הַ/פְּרִזִּ֣י הַ/יְבוּסִ֗י הָֽ/עַמֹּנִי֙ הַ/מֹּ֣אָבִ֔י הַ/מִּצְרִ֖י וְ/הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/001.yaml
  text: When these things were finished[a], the officials approached me, saying, “The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, according to their abominations—the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.”
translation:
  language: de
  text: 'Als dies abgeschlossen war, traten die führenden Amtsträger an mich heran und sagten: »Das Volk Israel, die Priester und die Leviten haben sich nicht von den Völkern der Länder abgesondert, entsprechend ihren Gräueln[a], nämlich denen der Kanaaniter, Hetiter, Perisiter, Jebusiter, Ammoniter, Moabiter, Ägypter und Amoriter.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihren Gräueln“. Das Hebräische kann Vergleich oder Übereinstimmung ausdrücken. Mit „Gräueln“ sind abscheuliche, besonders religiös anstößige oder götzendienerische Praktiken gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹת אֵלֶּה
  choice: Als dies abgeschlossen war
  rationale: Die Verbindung aus Konjunktion, כְּ und dem Infinitiv von כלה bildet einen temporalen Nebensatz. „Als dies abgeschlossen war“ gibt den resultativen Sinn natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: נִגְּשׁוּ אֵלַי
  choice: traten … an mich heran
  rationale: Das Nifal von נגשׁ bezeichnet hier das Herantreten an Esra. Die deutsche Wendung ist gegenwärtig, würdig und bewahrt die gerichtete Bewegung.
- source_word: הַשָּׂרִים
  choice: die führenden Männer
  rationale: שׂרים bezeichnet leitende Amtsträger. „Führende Männer“ ist im erzählerischen Kontext verständlich und vermeidet die für die persische Zeit irreführende Wiedergabe „Fürsten“.
- source_word: לֹא נִבְדְּלוּ
  choice: haben sich nicht … abgesondert
  rationale: Das Nifal von בדל hat hier reflexiv-separativen Sinn. „Sich absondern“ bewahrt die soziale und kultisch-ethische Tragweite, ohne den Beweggrund näher festzulegen.
- source_word: הָעָם יִשְׂרָאֵל וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: Das Volk Israel, die Priester und die Leviten
  rationale: Alle drei Gruppen sind syntaktisch demselben Vorwurf zugeordnet; die deutsche Reihung wahrt diesen Umfang.
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: von den Völkern der Länder
  rationale: Die beiden hebräischen Plurale werden beibehalten. Die bewusst allgemeine Formulierung wird nicht durch „umliegenden“ geografisch eingeengt.
- source_word: כְּתוֹעֲבֹתֵיהֶם
  choice: und ihren Gräueln
  rationale: תועבות ist ein starker moralisch-religiöser Ausdruck. Die koordinierende deutsche Formulierung gibt im Satz den Gedanken der Verstrickung mit den Völkern und ihren verwerflichen Praktiken natürlich wieder; die mögliche engere Wiedergabe der כְּ-Konstruktion wird in der Fußnote genannt.
- source_word: לַכְּנַעֲנִי … וְהָאֱמֹרִי
  choice: von den Kanaanitern … und Amoritern
  rationale: Die determinierten singularischen Volksbezeichnungen werden nach deutschem Sprachgebrauch als Bezeichnungen ganzer Volksgruppen im Plural wiedergegeben. Das wiederholte „von den“ nach dem Doppelpunkt verdeutlicht die Anbindung der Liste an מֵעַמֵּי.
theological_decisions:
- issue: Stärke und religiöse Färbung von תועבות
  choice: Gräuel
  alternative: abscheuliche Bräuche / verwerfliche Praktiken
  rationale: „Gräuel“ erhält die starke moralische und kultisch-religiöse Wertung des hebräischen Ausdrucks. Die Übersetzung schwächt den erhobenen Vorwurf nicht zu bloßer kultureller Verschiedenheit ab.
- issue: Umfang des Vorwurfs
  choice: Volk Israel, Priester und Leviten stehen gemeinsam unter derselben Aussage
  alternative: Der Vorwurf betrifft hauptsächlich das Volk; Priester und Leviten werden nur nachgeordnet erwähnt
  rationale: Die hebräische Koordination ordnet alle drei Gruppen dem Verb לֹא נִבְדְּלוּ zu. Die Übersetzung engt die Aussage daher nicht auf die Laien ein.
- issue: Bezug von כְּתוֹעֲבֹתֵיהֶם
  choice: Die fehlende Absonderung betrifft die Völker samt ihren Gräueln
  alternative: Die fehlende Absonderung geschah „entsprechend ihren Gräueln“
  rationale: Die כְּ-Konstruktion lässt sich als Übereinstimmung beziehungsweise Bezug auf die Gräuel verstehen. Die Hauptfassung ist im Deutschen natürlich, während die formnähere Möglichkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt klar strukturiert; der Doppelpunkt kennzeichnet die folgende Völkerliste als nähere Bestimmung. Der Fußnotenmarker steht unmittelbar bei der tatsächlich erläuterten Wendung.
