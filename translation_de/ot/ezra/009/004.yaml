  terminology: „Der Gott Israels“, „treulos gehandelt“ und „Abendopfer“ sind sachgerecht. Die Erläuterung zu minḥā vermeidet es, den Ausdruck im Haupttext unnötig auf ein Speisopfer zu verengen, weist diese häufige Bedeutung aber korrekt aus.
