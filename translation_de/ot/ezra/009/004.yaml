  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des Hebräischen zuverlässig wieder: das Zusammenkommen zu Esra, die vom Gotteswort bestimmte erschrockene Reaktion, den Treuebruch der גּוֹלָה sowie Esras anhaltendes entsetztes Sitzen bis zur Abend-minḥā. „Gemeinschaft der Verbannten“ ist als kollektive Wiedergabe von הַגּוֹלָה vertretbar; die Fußnote bewahrt die nähere lexikalische Alternative. Die kausale Einordnung mit „weil“ ist im Kontext plausibel und entspricht auch dem englischen Audit-Trail.'
