id: EZR.9.4
reference: Ezra 9:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵלַ֣/י יֵאָסְפ֗וּ כֹּ֤ל חָרֵד֙ בְּ/דִבְרֵ֣י אֱלֹהֵֽי יִשְׂרָאֵ֔ל עַ֖ל מַ֣עַל הַ/גּוֹלָ֑ה וַ/אֲנִי֙ יֹשֵׁ֣ב מְשׁוֹמֵ֔ם עַ֖ד לְ/מִנְחַ֥ת הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/004.yaml
  text: Then everyone who trembled at the words of the God of Israel because of the unfaithfulness of the exiles gathered to me[b][a], while I sat appalled until the evening offering.
translation:
  language: de
  text: Da versammelten sich bei mir alle, die vor den Worten des Gottes Israels zitterten, weil die Gemeinschaft der Verbannten treulos gehandelt hatte.[a] Ich aber saß bis zum Abendopfer wie erstarrt da.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »wegen des Treuebruchs der Gemeinschaft der Verbannten«.'
    reason: lexical_alternative
  - marker: b
    text: Das mit »Abendopfer« wiedergegebene hebräische Wort minḥā bezeichnet häufig besonders ein Speisopfer; hier dient es zugleich als Zeitangabe für die regelmäßige abendliche Opferhandlung im Tempel.
    reason: cultural_note
lexical_decisions:
- source_word: יֵאָסְפוּ
  choice: versammelten sich
  rationale: Das Nifal beschreibt hier das Zusammenkommen bei Esra. Die reflexive deutsche Form ist natürlich und lässt die im Hebräischen mögliche mittlere bzw. passive Nuance offen.
- source_word: כֹּל חָרֵד
  choice: alle, die … zitterten
  rationale: Der Singular nach כֹּל ist kollektiv gebraucht. Die Formulierung bewahrt das persönliche Erschrecken und die ehrfürchtige Reaktion.
- source_word: בְּדִבְרֵי אֱלֹהֵי יִשְׂרָאֵל
  choice: vor den Worten des Gottes Israels
  rationale: Die Präposition bezeichnet bei חרד den Gegenstand bzw. Anlass des Zitterns. Der Plural »Worte« wird entsprechend dem Hebräischen erhalten.
- source_word: עַל מַעַל הַגּוֹלָה
  choice: weil die Gemeinschaft der Verbannten treulos gehandelt hatte
  rationale: מַעַל bezeichnet einen Treuebruch, besonders gegenüber Gott. הַגּוֹלָה meint hier die aus der Verbannung hervorgegangene Gemeinschaft; die verbale Wiedergabe klingt im modernen Deutsch natürlicher.
- source_word: יֹשֵׁב מְשׁוֹמֵם
  choice: saß … wie erstarrt da
  rationale: Die Wendung verbindet Esras anhaltende Sitzhaltung mit fassungslosem Entsetzen. »Wie erstarrt« ist verständlich und gibt den Schock wieder, ohne bloße Verwüstung anzudeuten.
- source_word: עַד לְמִנְחַת הָעָרֶב
  choice: bis zum Abendopfer
  rationale: מִנְחָה kann speziell ein Speisopfer bezeichnen, dient hier aber zugleich als Zeitangabe für die regelmäßige abendliche Opferhandlung. »Abendopfer« ist knapp und kultisch passend; die genauere Nuance wird in der Fußnote erläutert.
theological_decisions:
- issue: Bedeutung von מַעַל im Zusammenhang des Bundesbruchs
  choice: treulos gehandelt
  alternative: sich vergangen / einen Treuebruch begangen
  rationale: Die Wiedergabe bringt den religiösen Treuebruch gegenüber Gott zum Ausdruck, ohne eine spätere dogmatische Kategorie einzutragen.
- issue: Bezug von הַגּוֹלָה
  choice: die Gemeinschaft der Verbannten
  alternative: die Verbannten / die aus der Verbannung Zurückgekehrten
  rationale: Der Ausdruck kann kollektiv die Exilsgemeinschaft bezeichnen, einschließlich der inzwischen Zurückgekehrten. »Gemeinschaft der Verbannten« bewahrt diesen kollektiven Sinn, ohne die Rückkehr ausdrücklich in den Text einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wahrt den Übergang von der versammelten Gruppe zu Esras anhaltender Erstarrung. Die Fußnotenmarker stehen jeweils unmittelbar bei der erklärten Aussage.
