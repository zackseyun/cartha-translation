  text: וְ/עַתָּ֡ה כִּ/מְעַט רֶגַע֩ הָיְתָ֨ה תְחִנָּ֜ה מֵ/אֵ֣ת יְהוָ֣ה אֱלֹהֵ֗י/נוּ לְ/הַשְׁאִ֥יר לָ֨/נוּ֙ פְּלֵיטָ֔ה וְ/לָ/תֶת לָ֥/נוּ יָתֵ֖ד בִּ/מְק֣וֹם קָדְשׁ֑/וֹ לְ/הָאִ֤יר עֵינֵ֨י/נוּ֙ אֱלֹהֵ֔י/נוּ וּ/לְ/תִתֵּ֛/נוּ מִֽחְיָ֥ה מְעַ֖ט בְּ/עַבְדֻתֵֽ/נוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/008.yaml
  text: But now[a], for a brief moment, favor has come from Yahweh our God, to leave us a remnant that has escaped and to give us a peg in his holy place[c][b], so that our God may brighten our eyes and give us a little reviving in our slavery.
translation:
  language: de
  text: 'Doch jetzt ist uns für einen kurzen Augenblick Gunst von Jahwe, unserem Gott, erwiesen worden: Er hat uns einen Rest von Entkommenen übrig gelassen und uns einen Pflock an seiner heiligen Stätte gegeben[a], um unsere Augen zu erleuchten[b] und uns in unserer Knechtschaft ein wenig Leben zu schenken[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der „Pflock“ ist ein Bild für einen festen, sicheren Halt oder Platz.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „unsere Augen hell machen“; die Wendung bezeichnet neue Lebenskraft und Hoffnung.'
    reason: idiom_explanation
  - marker: c
    text: 'Oder: „uns in unserer Knechtschaft ein wenig aufleben zu lassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחִנָּה
  choice: Gunst
  rationale: In der Verbindung הָיְתָה ... מֵאֵת bezeichnet das Wort hier nicht das Flehen Israels, sondern die von Jahwe erwiesene Gunst.
- source_word: פְּלֵיטָה
  choice: einen Rest von Entkommenen
  rationale: Die Wiedergabe bewahrt sowohl den Gedanken des Entrinnens als auch den eines übrig gebliebenen Restes.
- source_word: יָתֵד
  choice: einen Pflock
  rationale: Das konkrete Bild eines fest eingeschlagenen Pflocks bleibt erhalten; seine übertragene Bedeutung wird in einer Fußnote erläutert.
- source_word: בִּמְקוֹם קָדְשׁוֹ
  choice: an seiner heiligen Stätte
  rationale: Die Formulierung folgt dem Hebräischen und lässt den tempelbezogenen Sinn erkennen, ohne ihn unnötig einzuengen.
- source_word: לְהָאִיר עֵינֵינוּ
  choice: unsere Augen aufleuchten lassen
  rationale: Die deutsche Wendung erhält das Bild und vermittelt neue Lebenskraft und Hoffnung.
- source_word: מִחְיָה
  choice: neues Leben
  rationale: Das Substantiv bezeichnet Erhaltung oder Wiederbelebung des Lebens; im Kontext ist „neues Leben“ natürlich und anschaulich.
- source_word: בְּעַבְדֻתֵנוּ
  choice: in unserer Knechtschaft
  rationale: „Knechtschaft“ bewahrt die starke Bedeutung politischer Unterworfenheit, ohne moderne Eigentumssklaverei zwingend vorauszusetzen.
- source_word: כִּמְעַט רֶגַע
  choice: für einen kurzen Augenblick
  rationale: Die Wendung gibt die Kürze und Begrenztheit der gewährten Atempause idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen; „Jahwe“ bewahrt diese Eigenname-Funktion.
- issue: Bedeutung des Pflocks an der heiligen Stätte
  choice: Das konkrete Bild bleibt im Haupttext offen
  alternative: einen sicheren Halt beziehungsweise festen Platz
  rationale: Der Vers deutet Schutz und Beständigkeit an, legt die genaue Referenz des Bildes aber nicht vollständig fest.
- issue: Zweck- oder Folgesinn der abschließenden Infinitive
  choice: „So will unser Gott …“
  alternative: „damit unser Gott …“
  rationale: Die Infinitivkonstruktionen drücken den Zweck beziehungsweise das gnädige Ergebnis des göttlichen Handelns aus; die deutsche Fassung wahrt diesen Zusammenhang, ohne eine scharfe Trennung zu erzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit gegliedert; die konkreten hebräischen Bilder und die starke Bezeichnung der fortdauernden Unterworfenheit bleiben erhalten.
