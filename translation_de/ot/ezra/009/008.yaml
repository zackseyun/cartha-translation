  to: 'Doch jetzt ist uns für einen kurzen Augenblick Gunst von Jahwe, unserem Gott, erwiesen worden: Er hat uns einen Rest von Entkommenen übrig gelassen und uns einen Pflock an seiner heiligen Stätte gegeben[a], um unsere Augen zu erleuchten[b] und uns in unserer Knechtschaft ein wenig Leben zu schenken[c].'
