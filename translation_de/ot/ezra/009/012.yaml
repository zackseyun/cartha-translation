  text: וְ֠/עַתָּה בְּֽנוֹתֵי/כֶ֞ם אַל תִּתְּנ֣וּ לִ/בְנֵי/הֶ֗ם וּ/בְנֹֽתֵי/הֶם֙ אַל תִּשְׂא֣וּ לִ/בְנֵי/כֶ֔ם וְ/לֹֽא תִדְרְשׁ֧וּ שְׁלֹמָ֛/ם וְ/טוֹבָתָ֖/ם עַד עוֹלָ֑ם לְמַ֣עַן תֶּחֶזְק֗וּ וַ/אֲכַלְתֶּם֙ אֶת ט֣וּב הָ/אָ֔רֶץ וְ/הוֹרַשְׁתֶּ֥ם לִ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/012.yaml
  text: So now[a], do not give your daughters to their sons, and do not take their daughters for your sons. Never seek their peace or their prosperity[b], so that you may be strong and eat the good of the land and leave it as an inheritance to your sons forever.
translation:
  language: de
  text: 'Und nun: Gebt eure Töchter nicht ihren Söhnen, und nehmt ihre Töchter nicht für eure Söhne. Bemüht euch niemals um ihren Frieden und ihr Wohlergehen[a], damit ihr stark werdet, das Gute des Landes esst und es euren Söhnen für immer als Erbe hinterlasst[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sucht niemals ihren Frieden und ihr Gutes.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und es euren Söhnen für immer zum Erbbesitz gebt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוֹתֵיכֶם ... לִבְנֵיהֶם
  choice: Gebt eure Töchter nicht ihren Söhnen
  rationale: Die knappe hebräische Wendung wird strukturell bewahrt; im Parallelismus mit dem folgenden Satz ist der Bezug auf die Eheschließung klar.
- source_word: וּבְנֹתֵיהֶם אַל תִּשְׂאוּ לִבְנֵיכֶם
  choice: nehmt ihre Töchter nicht für eure Söhne
  rationale: נשא bezeichnet hier das Nehmen zur Frau. Die Formulierung erhält den Parallelismus und gibt die Präpositionalphrase לִבְנֵיכֶם ausdrücklich wieder.
- source_word: וְלֹא תִדְרְשׁוּ שְׁלֹמָם וְטוֹבָתָם עַד עוֹלָם
  choice: Bemüht euch niemals um ihren Frieden und ihr Wohlergehen
  rationale: דרש bedeutet grundsätzlich „suchen“, bezeichnet hier aber aktives Streben nach dem Wohl anderer. „Sich bemühen um“ ist im Deutschen natürlich; „Frieden“ wahrt שָׁלוֹם, während „Wohlergehen“ die weiter gefasste Bedeutung von טוֹבָה wiedergibt. „Niemals“ vermittelt die absolute Dauer des Verbots.
- source_word: לְמַעַן תֶּחֶזְקוּ
  choice: damit ihr stark werdet
  rationale: Die Zweck- beziehungsweise Ergebnisangabe mit לְמַעַן bleibt erhalten; חזק wird als ein Eintreten oder Zunehmen von Stärke wiedergegeben.
- source_word: וַאֲכַלְתֶּם אֶת טוּב הָאָרֶץ
  choice: das Gute des Landes esst
  rationale: Die konkrete Bildsprache des hebräischen Ausdrucks bleibt erhalten, statt sie lediglich mit „genießt“ zu umschreiben.
- source_word: וְהוֹרַשְׁתֶּם לִבְנֵיכֶם עַד עוֹלָם
  choice: und es euren Söhnen für immer als Erbe hinterlasst
  rationale: 'Der Hifil von ירש hat hier einen verursachenden Sinn: Etwas wird den Nachkommen zum Erbe gegeben. Das Pronomen „es“ nimmt im Deutschen naheliegend „das Land“ auf, wobei der hebräische Zusammenhang zwischen dem Land und seinem Gut nicht unnötig aufgelöst wird.'
theological_decisions:
- issue: Abgrenzungsgebot im nachexilischen Bundeszusammenhang
  choice: Das Verbot von Mischehen und vom aktiven Streben nach Frieden und Wohlergehen der betreffenden Völker wird ohne Abschwächung wiedergegeben.
  alternative: Die Aussage zu einer allgemeinen Warnung vor geistlich schädlichen Verbindungen umzuformulieren oder als zeitloses Gebot über alle Beziehungen zu Außenstehenden auszuweiten.
  rationale: Der Vers steht in Esras konkretem nachexilischem und bundeshistorischem Zusammenhang. Die Übersetzung soll die Härte und Spannung der Aussage bewahren, ohne eine weitergehende dogmatische Anwendung in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt weitgehend dem hebräischen Parallelismus, wird aber idiomatisch geglättet. „Söhne“ bleibt entsprechend dem ausdrücklich maskulinen Plural im Ausgangstext erhalten.
