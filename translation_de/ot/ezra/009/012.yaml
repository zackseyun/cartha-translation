  naturalness: Der Haupttext ist modernes, würdiges Standarddeutsch und syntaktisch klar. „Gebt eure Töchter nicht ihren Söhnen“ und „nehmt ihre Töchter nicht für eure Söhne“ bewahren bewusst die knappe Quellsprache; der Ehezusammenhang ergibt sich aus dem Parallelismus. Die Fußnote a ist hingegen in ihrer bisherigen Wortstellung missverständlich, weil „nicht für immer“ im Deutschen eine begrenzte statt eine dauerhafte Verneinung nahelegen kann.
  terminology: „Frieden und Wohlergehen“ ist eine treffende, nicht überinterpretierende Wiedergabe von שָׁלוֹם und טוֹבָה. „Söhne“ bildet den maskulinen Plural genau ab. „Erbe“ ist für den kausativen Erb-/Besitzgedanken angemessen; das Pronomen vermeidet eine nicht im Text ausdrücklich vorgenommene Festlegung.
