base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/002.yaml
  text: For they have taken some of their daughters for themselves and for their sons[a], and the holy seed has mixed itself with the peoples of the lands[c][b]. And the hand of the officials and the deputies has been foremost in this unfaithfulness.
translation:
  language: de
  text: Denn sie haben sich und ihren Söhnen einige ihrer Töchter zur Frau genommen[a], und der heilige Same[b] hat sich mit den Völkern der Länder vermischt. Und die führenden Beamten und die Stellvertreter gingen bei diesem Treuebruch voran[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einige ihrer Töchter geheiratet“. Wörtlich heißt es im Hebräischen: „von ihren Töchtern genommen“.'
    reason: lexical_alternative
  - marker: b
    text: „Der heilige Same“ kann auch mit „die heilige Nachkommenschaft“ wiedergegeben werden. Das Hebräische bewahrt hier die Sprache bundesgeschichtlicher Abstammung.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Und die Hand der führenden Beamten und der Stellvertreter war bei diesem Treuebruch die erste.“ Gemeint ist ihre maßgebliche Beteiligung und besondere Verantwortung.'
    reason: idiom_explanation
lexical_decisions:
- source_word: נָשְׂאוּ מִבְּנֹתֵיהֶם
  choice: einige von deren Töchtern genommen
  rationale: נשׂא bedeutet wörtlich „nehmen/tragen“, bezeichnet hier im Zusammenhang mit Töchtern jedoch die Eheschließung. Die Formulierung bewahrt das hebräische Bild; „einige von“ gibt das partitive מִן wieder.
- source_word: לָהֶם וְלִבְנֵיהֶם
  choice: für sich und ihre Söhne
  rationale: Die Präposition לְ bezeichnet hier die Zuordnung beziehungsweise den Begünstigten; gemeint sind Ehen sowohl der Männer selbst als auch ihrer Söhne.
- source_word: וְהִתְעָרְבוּ
  choice: hat sich … vermischt
  rationale: Der Hitpael drückt ein Sichvermischen aus. Das Verb steht im Hebräischen im Plural, doch das kollektive Subjekt זֶרַע wird im Deutschen natürlich als Singular behandelt.
- source_word: זֶרַע הַקֹּדֶשׁ
  choice: der heilige Same
  rationale: Die formal nahe Wiedergabe bewahrt die starke bundesgeschichtliche und genealogische Ausdrucksweise. „Nachkommenschaft“ wäre verständlicher, würde aber das Bild abschwächen.
- source_word: בְּעַמֵּי הָאֲרָצוֹת
  choice: mit den Völkern der Länder
  rationale: „Mit“ entspricht dem Gedanken der Vermischung; der Plural „Länder“ bleibt erhalten und verweist auf die Völker der umliegenden Gebiete.
- source_word: הַשָּׂרִים וְהַסְּגָנִים
  choice: die führenden Männer und Statthalter
  rationale: Die beiden Bezeichnungen meinen Personen in politischer beziehungsweise administrativer Leitungsverantwortung. Die Wiedergabe vermeidet das heute missverständliche „Fürsten“.
- source_word: מַעַל
  choice: Treuebruch
  rationale: מעל bezeichnet besonders einen schuldhaften Bruch geschuldeter Treue und trägt hier eine bundesbezogene Bedeutung, die „Vergehen“ nicht vollständig ausdrücken würde.
- source_word: וְיַד … רִאשׁוֹנָה
  choice: waren … an vorderster Stelle beteiligt
  rationale: Die hebräische Wendung „die Hand … war die erste“ bezeichnet maßgebliche Beteiligung und führende Verantwortung. Die deutsche Formulierung gibt den idiomatischen Sinn natürlich wieder.
theological_decisions:
- issue: Bedeutung von „der heilige Same“ im Zusammenhang mit Mischehen
  choice: Die bundesgeschichtliche Wendung „der heilige Same“ wird ohne deutende Erweiterung beibehalten.
  alternative: „die heilige Nachkommenschaft“ oder eine Deutung als ethnische Reinheitslehre
  rationale: Der Text beschreibt die abgesonderte Bundesgemeinschaft in ihrer Beziehung zu den Völkern ringsum. Die Übersetzung soll weder die starke Sprache des Textes abschwächen noch moderne rassische Kategorien hineintragen.
- issue: Verantwortung der Leitungspersonen
  choice: Die Amtsträger werden als maßgeblich und an vorderster Stelle beteiligt dargestellt.
  alternative: Eine rein zeitliche Aussage, wonach sie lediglich als Erste handelten
  rationale: Die Verbindung von „Hand“ und „erste“ betont aktive Beteiligung und vorrangige Schuld, ohne sicher festzulegen, dass ausschließlich eine zeitliche Reihenfolge gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Haupttext gibt die Ehethematik verständlich wieder, bewahrt aber durch „genommen“ und „heiliger Same“ markante hebräische Ausdrucksweisen; die Fußnoten erläutern die möglichen natürlicheren beziehungsweise wörtlicheren Lesarten.
