id: EZR.9.10
reference: Ezra 9:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֛ה מַה נֹּאמַ֥ר אֱלֹהֵ֖י/נוּ אַֽחֲרֵי זֹ֑את כִּ֥י עָזַ֖בְנוּ מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/010.yaml
  text: And now[a], what shall we say, our God, after this? For we have forsaken your commandments.
translation:
  language: de
  text: 'Und nun: Was sollen wir sagen, unser Gott, nach all dem? Denn wir haben deine Gebote verlassen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die Verknüpfung durch וְ als auch den zeitlich-diskursiven Übergang durch עַתָּה, ohne das Verhältnis zum Vorhergehenden stärker auszudeuten.
- source_word: מַה נֹּאמַר
  choice: Was sollen wir sagen
  rationale: Das Imperfekt der 1. Person Plural hat hier deliberative Kraft. Die Formulierung ist im Deutschen natürlich und gibt die ratlose, rhetorische Selbstbefragung wieder.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Gibt die Possessivform und die direkte Anrede schlicht und würdig wieder.
- source_word: אַחֲרֵי זֹאת
  choice: nach all dem
  rationale: Die idiomatische Wendung verweist auf die zuvor geschilderte Schuld und ihre Folgen; „nach all dem“ stellt diesen Rückbezug im Deutschen natürlich her.
- source_word: כִּי
  choice: Denn
  rationale: Kennzeichnet den folgenden Satz als Begründung für Esras Sprachlosigkeit.
- source_word: עָזַבְנוּ
  choice: haben ... verlassen
  rationale: Bewahrt das Grundbild des Abwendens beziehungsweise Verlassens und trägt im Zusammenhang das Gewicht schuldhafter Missachtung.
- source_word: מִצְוֺתֶיךָ
  choice: deine Gebote
  rationale: „Gebote“ ist die etablierte, inhaltlich gewichtige deutsche Entsprechung für göttliche Weisungen in diesem Bundeszusammenhang.
theological_decisions:
- issue: Ton von Esras Bekenntnis
  choice: Rhetorisches Schuldbekenntnis und Ausdruck der Sprachlosigkeit vor Gott
  alternative: Sachliche Frage danach, was als Nächstes gesagt werden soll
  rationale: Die anschließende Begründung mit dem Verlassen der Gebote zeigt, dass die Frage aus Buße und Beschämung entsteht. Die Übersetzung macht diesen Ton hörbar, ohne ihn erklärend auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach „Und nun“ markiert den Gebetsübergang und vermeidet eine schwerfällige Kommastruktur; die direkte Anrede bleibt ohne altertümliches „o“.
