  source_fidelity: 'Der Text gibt die hebräische Handlungsfolge präzise wieder: das Hören von der berichteten Angelegenheit, das Zerreißen von Gewand und Mantel, das partitive Ausreißen von Haaren und das anschließende entsetzte Sichsetzen. „Davon“ ist im Kontext eine natürliche Wiedergabe von הַדָּבָר הַזֶּה, ohne dessen Bedeutung unzulässig einzuengen. „Haare“ bewahrt sinnvoll die durch מִן nahegelegte partitive Nuance.'
