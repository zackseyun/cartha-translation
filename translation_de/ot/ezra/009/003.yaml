  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die knappe Abfolge der körperlichen Reaktionen wird bewahrt; die emotionale Stärke von מְשׁוֹמֵם wird wiedergegeben, ohne eine zusätzliche theologische Deutung einzutragen.
