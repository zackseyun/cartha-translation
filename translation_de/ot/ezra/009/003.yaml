source:
  edition: WLC
  text: וּ/כְ/שָׁמְעִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה קָרַ֥עְתִּי אֶת בִּגְדִ֖/י וּ/מְעִילִ֑/י וָ/אֶמְרְטָ֞/ה מִ/שְּׂעַ֤ר רֹאשִׁ/י֙ וּ/זְקָנִ֔/י וָ/אֵשְׁבָ֖/ה מְשׁוֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/003.yaml
  text: As soon as I heard this matter[a], I tore my garment and my robe, pulled out some of the hair of my head and my beard[b], and sat appalled.
translation:
  language: de
  text: Als ich davon hörte[a], zerriss ich mein Gewand und meinen Mantel, riss mir Haare vom Kopf und aus dem Bart[b] und setzte mich entsetzt hin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als ich von dieser Sache hörte“; auch „Als ich diese Nachricht hörte“ ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: Das Zerreißen der Kleidung und das Ausreißen von Haaren waren Ausdruck tiefer Trauer und Bestürzung.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְשָׁמְעִי אֶת הַדָּבָר הַזֶּה
  choice: Als ich davon hörte
  rationale: Die Wendung leitet einen temporalen Nebensatz ein. „Davon“ gibt הַדָּבָר הַזֶּה im Deutschen natürlich wieder und bezieht sich auf den zuvor gemeldeten Sachverhalt, ohne festzulegen, ob das Wort selbst oder sein Inhalt im Vordergrund steht.
- source_word: קָרַעְתִּי אֶת בִּגְדִי וּמְעִילִי
  choice: zerriss ich mein Gewand und meinen Mantel
  rationale: „Gewand“ bewahrt den allgemeinen Charakter von בֶּגֶד, während „Mantel“ מְעִיל als äußeres Kleidungsstück davon unterscheidet. „Zerreißen“ ist die übliche würdevolle Bezeichnung dieser Trauerhandlung.
- source_word: וָאֶמְרְטָה מִשְּׂעַר רֹאשִׁי וּזְקָנִי
  choice: riss mir Haare vom Kopf und aus dem Bart
  rationale: Das Verb bezeichnet gewaltsames Ausreißen. Die Präposition מִן legt eine partitive Bedeutung nahe, weshalb nicht behauptet wird, Esra habe sämtliche Haare entfernt. Die unterschiedlichen deutschen Präpositionen ergeben eine natürliche Formulierung.
- source_word: וָאֵשְׁבָה מְשׁוֹמֵם
  choice: und setzte mich entsetzt hin
  rationale: Die finite Verbform bezeichnet das Sichsetzen; das Partizip מְשׁוֹמֵם beschreibt einen Zustand tiefer Bestürzung oder Verwüstung. „Entsetzt“ vermittelt hier den Schock stärker und natürlicher als das neutralere „erstaunt“.
theological_decisions: []
