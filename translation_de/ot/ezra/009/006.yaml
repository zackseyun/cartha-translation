review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die doppelte Schambekundung, das Erheben des Gesichts, die wiederholte Anrede »mein Gott« sowie die beiden Höhenbilder insgesamt zutreffend wieder. Die idiomatische Wendung »über den Kopf gewachsen« deutet jedoch stärker als der hebräische Text auf Unbewältigbarkeit; dieser spricht ausdrücklich davon, dass die Verfehlungen zahlreich geworden sind und sich über die Köpfe erheben.
  naturalness: Modernes, würdiges Deutsch. »Haben sich über unseren Köpfen gehäuft« ist im Deutschen klar und bewahrt das räumliche Bild unmittelbarer als die gewählte feste Redewendung.
  terminology: »Verfehlungen« für עֲוֹנוֹת und »Schuld« für אַשְׁמָה unterscheiden die beiden hebräischen Begriffe angemessen. »Bis zum Himmel angewachsen« gibt גדלה עד לשמים präziser wieder als das statischere »reicht bis an den Himmel«.
  issues:
  - severity: medium
    issue: Die Wendung »uns über den Kopf gewachsen« ist eine deutsche feste Redewendung.
    rationale: Sie legt nahe, dass die Verfehlungen unbeherrschbar geworden sind. Das hebräische רָבוּ bezeichnet zunächst Zunahme bzw. zahlreich Werden; die vertikale Bildsprache sollte deshalb direkter wiedergegeben werden.
  - severity: low
    issue: Die Fußnote bezeichnet »sind bis über den Kopf angewachsen« als wörtliche Wiedergabe.
    rationale: Dies ist keine besonders genaue Abbildung der hebräischen Aussage. Der Text sagt, dass die Verfehlungen zahlreich geworden sind, »über dem Kopf«; die Fußnote sollte dies transparent und ohne eine irreführende deutsche Pseudowörtlichkeit erläutern.
  - severity: low
    issue: »Unsere Schuld reicht bis an den Himmel« gibt die Wachstumsmetaphorik nur abgeschwächt wieder.
    rationale: גדלה bedeutet hier »ist groß geworden/angewachsen«. Eine Formulierung mit »angewachsen« bewahrt den parallelen Anstieg der Schuld bis zum Himmel.
  revised_text: 'Und ich sagte: »Mein Gott, ich schäme mich und bin tief beschämt, mein Gesicht zu dir zu erheben, mein Gott; denn unsere Verfehlungen haben sich über unseren Köpfen gehäuft, und unsere Schuld ist bis zum Himmel angewachsen.«'
  revised_footnotes:
  - marker: a
    text: 'Wörtlich: »über dem Kopf«. Im Hebräischen steht »Kopf« im Singular; in diesem gemeinschaftlichen Bild bezieht er sich auf die gesamte Gruppe.'
    reason: Die Anmerkung erläutert den hebräischen kollektiven Singular und die räumliche Metapher, ohne die Aussage als eine ungenaue deutsche Wörtlichkeitsform auszugeben.
  revision_rationale: Die Revision vermeidet die zusätzliche Deutung der festen Redewendung »über den Kopf wachsen«, erhält aber die Bildsprache von anwachsenden Verfehlungen über den Köpfen. Zugleich wird die im hebräischen Parallelismus angelegte Wachstumsmetaphorik für die Schuld bis zum Himmel wiedergegeben und die Fußnote quellentreuer formuliert.
