revisions:
- from: 'Und ich sagte: »Mein Gott, ich schäme mich und bin tief beschämt, mein Gesicht zu dir zu erheben, mein Gott; denn unsere Verfehlungen sind uns über den Kopf[a] gewachsen, und unsere Schuld reicht bis an den Himmel.«'
  to: 'Und ich sagte: »Mein Gott, ich schäme mich und bin tief beschämt, mein Gesicht zu dir zu erheben, mein Gott; denn unsere Verfehlungen haben sich über unseren Köpfen gehäuft, und unsere Schuld ist bis zum Himmel angewachsen.«'
  rationale: Die Revision vermeidet die zusätzliche Deutung der festen Redewendung »über den Kopf wachsen«, erhält aber die Bildsprache von anwachsenden Verfehlungen über den Köpfen. Zugleich wird die im hebräischen Parallelismus angelegte Wachstumsmetaphorik für die Schuld bis zum Himmel wiedergegeben und die Fußnote quellentreuer formuliert.
