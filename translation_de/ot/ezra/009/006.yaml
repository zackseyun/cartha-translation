base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/006.yaml
  text: And I said[a], “My God, I am ashamed and humiliated to lift up my face to you, my God, because our iniquities have multiplied above our heads, and our guilt has grown as high as the heavens.”
translation:
  language: de
  text: 'Und ich sagte: »Mein Gott, ich schäme mich und bin tief beschämt, mein Gesicht zu dir zu erheben, mein Gott; denn unsere Verfehlungen haben sich über unseren Köpfen gehäuft, und unsere Schuld ist bis zum Himmel angewachsen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּשְׁתִּי
  choice: ich schäme mich
  rationale: Das deutsche Präsens gibt den im Kontext fortbestehenden Zustand der Scham natürlich wieder, obwohl im Hebräischen formal eine Perfektform steht.
- source_word: וְנִכְלַמְתִּי
  choice: und bin tief beschämt
  rationale: Die Formulierung bewahrt die verstärkende Wiederholung des Hebräischen, ohne auf das heute missverständliche „gedemütigt“ auszuweichen.
- source_word: לְהָרִים ... פָּנַי אֵלֶיךָ
  choice: mein Gesicht zu dir zu erheben
  rationale: Die Wendung erhält das ausdrücklich genannte Gesicht und das Bild, sich Gott offen zuzuwenden.
- source_word: עֲוֺנֹתֵינוּ
  choice: unsere Verfehlungen
  rationale: „Verfehlungen“ bezeichnet konkrete moralische Vergehen und bleibt von der anschließend genannten Schuld unterscheidbar.
- source_word: רָבוּ לְמַעְלָה רֹאשׁ
  choice: sind uns über den Kopf gewachsen
  rationale: Die geläufige deutsche Wendung vermittelt sowohl das Anwachsen als auch das hebräische Höhenbild; „Kopf“ bleibt entsprechend dem hebräischen Singular erhalten.
- source_word: אַשְׁמָתֵנוּ
  choice: unsere Schuld
  rationale: Hier bezeichnet das Substantiv die Schuld beziehungsweise Strafwürdigkeit, nicht ein Schuldopfer.
- source_word: גָדְלָה עַד לַשָּׁמַיִם
  choice: reicht bis an den Himmel
  rationale: Die natürliche deutsche Formulierung bewahrt das hyperbolische Bild einer bis zum Himmel angewachsenen Schuld.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die zweimalige direkte Anrede wird wie im Hebräischen wiederholt und ohne einen altertümlichen Vokativ wiedergegeben.
- source_word: וָאֹמְרָה
  choice: Und ich sagte
  rationale: Die Formulierung gibt die schlichte narrative Fortführung durch das Waw-Consecutivum wieder.
