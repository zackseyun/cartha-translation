  text: וְ/כֹל֩ אֲשֶׁ֨ר לֹֽא יָב֜וֹא לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים כַּ/עֲצַ֤ת הַ/שָּׂרִים֙ וְ/הַ/זְּקֵנִ֔ים יָחֳרַ֖ם כָּל רְכוּשׁ֑/וֹ וְ/ה֥וּא יִבָּדֵ֖ל מִ/קְּהַ֥ל הַ/גּוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/008.yaml
  text: And everyone who does not come within three days[a], according to the counsel of the officials and the elders, all his property shall be forfeited, and he himself shall be separated from the assembly of the exiles.
translation:
  language: de
  text: Wer nicht innerhalb von drei Tagen kommt, dessen gesamter Besitz soll gemäß dem Beschluss der Amtsträger und der Ältesten dem Bann verfallen[a], und er selbst soll aus der Versammlung der Exilsgemeinschaft ausgeschlossen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eingezogen werden“; wörtlicher auch: „der Vernichtung geweiht werden“. Das hebräische Verb bezeichnet die Verhängung des Banns, der je nach Zusammenhang Vernichtung oder Einziehung einschließen kann.'
    reason: Die konkrete Vollzugsform von חרם in Bezug auf den Besitz bleibt im Text offen; die Anmerkung erläutert den technischen Bannbegriff und wahrt die möglichen Bedeutungsnuancen.
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר לֹא יָבוֹא
  choice: Wer aber nicht ... kommt
  rationale: Die distributive Bedingung wird im Deutschen natürlich mit „wer“ wiedergegeben; „kommt“ bezeichnet hier das Erscheinen aufgrund der Einberufung.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: innerhalb von drei Tagen
  rationale: Die Wendung setzt eine Frist und wird so im modernen Deutschen eindeutig wiedergegeben.
- source_word: כַּעֲצַת
  choice: nach dem Beschluss
  rationale: עֵצָה kann Rat, Beratung oder Beschluss bedeuten; im rechtlich-amtlichen Zusammenhang bezeichnet es hier am ehesten die verbindliche Entscheidung.
- source_word: הַשָּׂרִים וְהַזְּקֵנִים
  choice: der führenden Männer und der Ältesten
  rationale: שׂרים bezeichnet hier die politisch-administrativen Führungspersonen, ohne dass das missverständliche oder altertümliche „Fürsten“ nötig ist; זקנים wird traditionsgemäß und sachgerecht mit „Älteste“ wiedergegeben.
- source_word: יָחֳרַם
  choice: soll ... dem Bann verfallen
  rationale: Die Wiedergabe bewahrt den technischen Gehalt von חרם als Bann bzw. unwiderrufliche Aussonderung, ohne eindeutig festzulegen, ob der Besitz vernichtet oder eingezogen wird.
- source_word: כָּל רְכוּשׁוֹ
  choice: sein gesamter Besitz
  rationale: רְכוּשׁ bezeichnet Besitz oder Habe; „gesamter Besitz“ passt zum rechtlichen Strafzusammenhang.
- source_word: וְהוּא יִבָּדֵל
  choice: und er selbst soll ... ausgeschlossen werden
  rationale: Das ausdrückliche Pronomen wird durch „er selbst“ bewahrt. Im Kontext meint das passive בדל die Trennung bzw. den Ausschluss aus der Gemeinschaft.
- source_word: מִקְּהַל הַגּוֹלָה
  choice: aus der Versammlung der Weggeführten
  rationale: קהל ist hier die versammelte Gemeinschaft; הגולה bezeichnet die durch die Wegführung geprägte Exilsgemeinschaft. „Weggeführte“ bewahrt diesen historischen Bezug.
theological_decisions:
- issue: Bedeutung der Bannstrafe für den Besitz
  choice: dem Bann verfallen
  alternative: eingezogen werden; der Vernichtung geweiht werden
  rationale: חרם trägt einen technischen und theologischen Sinn, der über eine gewöhnliche Beschlagnahmung hinausgehen kann. Die Hauptübersetzung bewahrt diesen Gehalt und lässt offen, welche konkrete Vollzugsform hier gemeint ist; die Fußnote nennt die kontextuell möglichen Folgen.
- issue: Art der Trennung von der Gemeinschaft
  choice: aus der Versammlung ... ausgeschlossen werden
  alternative: von der Versammlung ... abgesondert werden
  rationale: Der Kontext zeigt einen tatsächlichen Gemeinschaftsausschluss, legt aber keine spätere kirchenrechtliche Kategorie fest. Daher wird weder „exkommuniziert“ noch eine andere konfessionell geprägte Bezeichnung verwendet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtliche Schärfe des Erlasses bleibt erhalten; altertümliche Amtsbezeichnungen und spätere kirchenrechtliche Fachbegriffe werden vermieden.
