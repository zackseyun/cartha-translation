  terminology: „Einen Bund schließen“, „fortschicken“, „Gebot“ und „Gesetz“ sind kontextgerecht. „Vor dem Gebot … erbeben“ bewahrt die Intensität von הַחֲרֵדִים, ohne sie zu einer bloßen Gehorsamsformel abzuschwächen. „Diese Frauen“ stellt lediglich den im Kontext gegebenen Bezug her und fügt keine sachliche Bestimmung wie „fremd“ in den Vers ein.
