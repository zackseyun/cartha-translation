source:
  edition: WLC
  text: וְ/עַתָּ֣ה נִֽכְרָת בְּרִ֣ית לֵ֠/אלֹהֵי/נוּ לְ/הוֹצִ֨יא כָל נָשִׁ֜ים וְ/הַ/נּוֹלָ֤ד מֵ/הֶם֙ בַּ/עֲצַ֣ת אֲדֹנָ֔/י וְ/הַ/חֲרֵדִ֖ים בְּ/מִצְוַ֣ת אֱלֹהֵ֑י/נוּ וְ/כַ/תּוֹרָ֖ה יֵעָשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/003.yaml
  text: So now let us make a covenant with our God to send away all the women and what has been born from them, according to the counsel of my lord and of those who tremble at the commandment of our God; and let it be done according to the law.
translation:
  language: de
  text: 'So lasst uns nun mit unserem Gott einen Bund schließen: Wir wollen alle diese Frauen und die von ihnen Geborenen fortschicken, nach dem Rat meines Herrn und derer, die vor dem Gebot unseres Gottes erbeben. Es soll nach dem Gesetz gehandelt werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְרָת בְּרִית
  choice: einen Bund schließen
  rationale: Die hebräische Wendung bedeutet wörtlich „einen Bund schneiden“, wird im Deutschen aber idiomatisch und präzise mit „einen Bund schließen“ wiedergegeben.
- source_word: לְהוֹצִיא
  choice: fortschicken
  rationale: Im Kontext bezeichnet das Verb die Entfernung beziehungsweise Entlassung der Frauen; „fortschicken“ bewahrt die konkrete Härte, ohne zusätzliche rechtliche Einzelheiten einzutragen.
- source_word: וְהַנּוֹלָד מֵהֶם
  choice: und die von ihnen Geborenen
  rationale: Die ungewöhnlich substantivierte Einzahlform mit kollektivem Sinn wird möglichst quellennah wiedergegeben; gemeint sind die aus diesen Frauen hervorgegangenen Kinder, ohne dass der hebräische Text hier ausdrücklich „Kinder“ sagt.
- source_word: אֲדֹנָי
  choice: meines Herrn
  rationale: Das Wort trägt hier ein Personalsuffix der ersten Person Singular und ist daher „mein Herr“, nicht der Gottesname; der unmittelbare Kontext legt Esra als angeredete Autorität nahe.
- source_word: הַחֲרֵדִים בְּמִצְוַת
  choice: die vor dem Gebot … erbeben
  rationale: Die Formulierung bewahrt das starke Bild ehrfürchtigen Erbebens und glättet es nicht zu bloßem Gehorsam.
- source_word: כַתּוֹרָה
  choice: nach dem Gesetz
  rationale: תּוֹרָה bezeichnet hier die maßgebliche göttliche Weisung; „Gesetz“ ist im Kontext natürlich und traditionell verständlich.
theological_decisions:
- issue: Bezug von אֲדֹנָי
  choice: „meines Herrn“ als menschliche Anrede
  alternative: „des Herrn“ als Gottesbezeichnung
  rationale: Die masoretische Form enthält das Suffix „mein“ und steht nicht als der gewöhnliche Ersatz für den Gottesnamen; außerdem unterscheidet der Satz den Rat „meines Herrn“ von den Gottesfürchtigen.
- issue: Bewertung der vorgeschlagenen Trennung
  choice: Die Rede wird ohne zustimmenden oder verurteilenden Kommentar übersetzt
  alternative: Die Handlung durch erklärende Zusätze ausdrücklich rechtfertigen oder kritisieren
  rationale: Der Vers berichtet Schechanjas Vorschlag. Die Übersetzung soll die ethische und theologische Spannung des Textes bewahren, statt sie konfessionell oder harmonisierend aufzulösen.
- issue: Identität der Frauen
  choice: „diese Frauen“ im Rückbezug auf den Kontext
  alternative: „fremde Frauen“ ausdrücklich im Vers ergänzen
  rationale: Der vorliegende hebräische Vers sagt nur „alle Frauen“; das demonstrative „diese“ stellt im Deutschen den nötigen Kontextbezug her, ohne das im Vers nicht wiederholte Adjektiv einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem argumentativen Aufbau des Hebräischen nahe, wird aber durch Doppelpunkt und Hauptsätze für heutige Leser klar gegliedert. Keine Fußnoten erforderlich.
