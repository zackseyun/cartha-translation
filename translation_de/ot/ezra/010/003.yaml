  source_fidelity: 'Die Übersetzung gibt den Satzbau und die Sinnrelationen des Hebräischen zuverlässig wieder: Bundesschluss mit dem Zweck der Wegsendung, Bezug auf den Rat „meines Herrn“ und der Gottesfürchtigen sowie die abschließende Forderung nach Handeln gemäß der Tora. „Meines Herrn“ entspricht אֲדֹנָי mit Suffix der ersten Person und vermeidet zu Recht die nicht gesicherte Gleichsetzung mit einer Gottesbezeichnung.'
