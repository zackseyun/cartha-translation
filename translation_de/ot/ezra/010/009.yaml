  text: וַ/יִּקָּבְצ֣וּ כָל אַנְשֵֽׁי יְהוּדָה֩ וּ/בִנְיָמִ֨ן יְרוּשָׁלִַ֜ם לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים ה֛וּא חֹ֥דֶשׁ הַ/תְּשִׁיעִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ וַ/יֵּשְׁב֣וּ כָל הָ/עָ֗ם בִּ/רְחוֹב֙ בֵּ֣ית הָ/אֱלֹהִ֔ים מַרְעִידִ֥ים עַל הַ/דָּבָ֖ר וּ/מֵ/הַ/גְּשָׁמִֽים־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/009.yaml
  text: So all the men of Judah and Benjamin gathered in Jerusalem within the three days[a]. It was the ninth month, on the twentieth day of the month. And all the people sat in the open square of the house of God[c][b], trembling because of this matter and because of the heavy rain.
translation:
  language: de
  text: Da versammelten sich alle Männer von Juda und Benjamin innerhalb von drei Tagen[a] in Jerusalem. Es war der zwanzigste Tag des neunten Monats. Das ganze Volk saß auf dem offenen Platz beim Haus Gottes[b] und zitterte wegen dieser Angelegenheit und wegen des starken Regens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis zum Ablauf der drei Tage«.'
    reason: Die hebräische Fristangabe kann die Einhaltung der zuvor gesetzten Dreitagesfrist hervorheben.
  - marker: b
    text: 'Oder: »auf dem offenen Platz vor dem Haus Gottes«. Gemeint ist ein breiter offener Platz, nicht notwendigerweise ein innerer Tempelhof.'
    reason: Die räumliche Beziehung der hebräischen Genitivverbindung ist nicht näher bestimmt.
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: versammelten sich
  rationale: Das Niphal von קבץ bezeichnet hier das Zusammenkommen zu einer Versammlung; die reflexive deutsche Form gibt dies natürlich und genau wieder.
- source_word: כָל אַנְשֵׁי יְהוּדָה וּבִנְיָמִן
  choice: alle Männer von Juda und Benjamin
  rationale: אַנְשֵׁי ist grammatisch maskulin und bedeutet wörtlich »Männer von«; im Zusammenhang sind die vorgeladenen männlichen Mitglieder beziehungsweise Vertreter gemeint.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: innerhalb der drei Tage
  rationale: Die Wendung verweist auf die zuvor gesetzte Frist von drei Tagen und wahrt deren zeitliche Begrenzung.
- source_word: הוּא חֹדֶשׁ הַתְּשִׁיעִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: Es war der zwanzigste Tag des neunten Monats
  rationale: Die zusammengezogene deutsche Datumsform ist klar und gibt beide hebräischen Zeitangaben vollständig wieder.
- source_word: וַיֵּשְׁבוּ
  choice: saß
  rationale: ישׁב bedeutet hier »sitzen«; wegen des kollektiven Singulars »das ganze Volk« steht das deutsche Verb im Singular.
- source_word: בִּרְחוֹב בֵּית הָאֱלֹהִים
  choice: auf dem freien Platz beim Haus Gottes
  rationale: רְחוֹב bezeichnet einen breiten offenen Platz, nicht zwingend einen inneren Tempelhof. »Beim« wahrt die räumliche Unbestimmtheit der Genitivverbindung besser als eine architektonisch engere Festlegung.
- source_word: מַרְעִידִים
  choice: zitterte
  rationale: Das Partizip von רעד bezeichnet körperliches Zittern, das im Satz auf zwei Ursachen zurückgeführt wird.
- source_word: עַל הַדָּבָר
  choice: wegen dieser Angelegenheit
  rationale: הַדָּבָר verweist im Kontext auf die konkrete, bereits behandelte Krise; »diese Angelegenheit« macht diesen Rückbezug natürlich deutlich.
- source_word: וּמֵהַגְּשָׁמִים
  choice: und wegen des starken Regens
  rationale: מִן bezeichnet nach dem Verb des Zitterns die Ursache. Der Plural גְּשָׁמִים kann die anhaltenden beziehungsweise heftigen saisonalen Regenfälle bezeichnen; »starker Regen« ist dafür idiomatisches Deutsch.
