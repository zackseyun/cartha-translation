translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. »Haus Gottes« bewahrt die biblische Tempelbezeichnung; »freier Platz« vermeidet eine unbelegte architektonische Präzisierung. Sämtliche Fußnotenmarker stehen im Haupttext.
