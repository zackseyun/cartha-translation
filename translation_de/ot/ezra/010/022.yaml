  text: וּ/מִ/בְּנֵ֖י פַּשְׁח֑וּר אֶלְיוֹעֵינַ֤י מַֽעֲשֵׂיָה֙ יִשְׁמָעֵ֣אל נְתַנְאֵ֔ל יוֹזָבָ֖ד וְ/אֶלְעָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/022.yaml
  text: 'And from the sons of Pashhur: Elioenai, Maaseiah, Ishmael, Nethanel, Jozabad, and Elasah.'
translation:
  language: de
  text: 'Und von den Söhnen Paschhurs: Eljoënai, Maaseja, Ismael, Netanel, Josabad und Elasa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Und von den Söhnen
  rationale: Die Verbindung aus Konjunktion, Präposition und Konstruktplural leitet eine weitere Teilgruppe der Aufzählung ein. Die Wiedergabe bewahrt sowohl den Anschluss als auch den partitiven Sinn.
- source_word: פַּשְׁחוּר
  choice: Paschhur
  rationale: Der Personen- beziehungsweise Familienname wird in einer im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אֶלְיוֹעֵינַי
  choice: Eljoënai
  rationale: Der Eigenname wird in einer gebräuchlichen deutschen Bibelschreibung transliteriert; das Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: מַעֲשֵׂיָה
  choice: Maaseja
  rationale: Der Eigenname wird entsprechend der üblichen deutschen biblischen Namensform wiedergegeben.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Verwendet wird die im Deutschen geläufige biblische Namensform.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Der hebräische Eigenname wird in einer natürlichen und im Deutschen gebräuchlichen Transliteration wiedergegeben.
- source_word: יוֹזָבָד
  choice: Josabad
  rationale: Verwendet wird die etablierte deutsche biblische Namensform.
- source_word: וְאֶלְעָשָׂה
  choice: und Elasa
  rationale: Die vorangestellte Konjunktion wird ausdrücklich mit „und“ wiedergegeben; der Eigenname folgt einer gebräuchlichen deutschen Bibelschreibung.
