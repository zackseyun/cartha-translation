- from: Die aus der Verbannung Zurückgekehrten[a] taten es so. Und der Priester Esra sonderte[b] Männer aus, die Oberhäupter der Sippen[c], geordnet nach ihren Sippen und alle namentlich bestimmt. Am ersten Tag des zehnten Monats traten sie zusammen, um die Angelegenheit zu untersuchen.
  to: Die aus der Verbannung Zurückgekehrten[a] taten es so. Da wurden der Priester Esra und Männer, Oberhäupter der Vaterhäuser[c], nach ihren Vaterhäusern und einzeln mit Namen ausgesondert[b]. Am ersten Tag des zehnten Monats traten sie zusammen, um die Angelegenheit zu untersuchen.
  rationale: Die Revision behebt den deutschen Grammatikfehler und bildet zugleich die pluralische Niphalform des hebräischen Textes im Haupttext ab. Die mögliche kontextuelle Auffassung, Esra habe Vertreter bestimmt, bleibt ausdrücklich in der Fußnote erhalten, statt als einzig mögliche Lesart festgeschrieben zu werden. Alle Fußnotenanker sind im vollständigen revidierten Text vorhanden.
