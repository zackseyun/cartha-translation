  naturalness: „Männer, die Oberhäupter der Sippen“ ist unvollständig und daher im Deutschen nicht satzgerecht. Die revidierte Fassung ist modernes Standarddeutsch und lässt die gruppierende Angabe „nach ihren Vaterhäusern“ verständlich stehen.
  terminology: „Vaterhäuser“ erhält die wiederholte hebräische Sozialterminologie und wird durch die Fußnote erläutert. „Ausgesondert“ bildet בדל ab, ohne die umstrittene Konstruktion einseitig als aktives Auswählen durch Esra festzulegen. Esra wird ausschließlich als Priester bezeichnet.
