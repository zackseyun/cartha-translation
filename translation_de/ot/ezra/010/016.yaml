  text: וַ/יַּֽעֲשׂוּ כֵן֮ בְּנֵ֣י הַ/גּוֹלָה֒ וַ/יִּבָּדְלוּ֩ עֶזְרָ֨א הַ/כֹּהֵ֜ן אֲנָשִׁ֨ים רָאשֵׁ֧י הָ/אָב֛וֹת לְ/בֵ֥ית אֲבֹתָ֖/ם וְ/כֻלָּ֣/ם בְּ/שֵׁמ֑וֹת וַ/יֵּשְׁב֗וּ בְּ/י֤וֹם אֶחָד֙ לַ/חֹ֣דֶשׁ הָ/עֲשִׂירִ֔י לְ/דַרְי֖וֹשׁ הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/016.yaml
  text: So the sons of the exile did so. And Ezra the priest set apart men, heads of fathers’ houses according to their fathers’ houses, all of them by name; and they sat down on the first day of the tenth month to investigate the matter.
translation:
  language: de
  text: Die aus der Verbannung Zurückgekehrten[a] taten es so. Da wurden der Priester Esra und Männer, Oberhäupter der Vaterhäuser[c], nach ihren Vaterhäusern und einzeln mit Namen ausgesondert[b]. Am ersten Tag des zehnten Monats traten sie zusammen, um die Angelegenheit zu untersuchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne der Verbannung“; eine Bezeichnung für die aus dem Exil zurückgekehrte Gemeinschaft.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Verbform ist Plural und bedeutet grundsätzlich „wurden ausgesondert“ oder „trennten sich“. Im Zusammenhang kann der Satz auch so verstanden werden, dass Esra Männer für die Untersuchung bestimmte.
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „Oberhäupter der Vaterhäuser“; gemeint sind Leiter größerer Familien- oder Sippenverbände.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי הַגּוֹלָה
  choice: die aus der Verbannung Zurückgekehrten
  rationale: Die wörtliche Wendung „Söhne der Verbannung“ bezeichnet korporativ die zurückgekehrte Exilsgemeinschaft. Die gewählte Fassung gibt den hebräischen Bezug verständlich und idiomatisch wieder, ohne die Gruppe bloß allgemein als „Volk“ zu bezeichnen.
- source_word: וַיִּבָּדְלוּ
  choice: sonderte Männer aus
  rationale: Der Niphal von בדל bezeichnet Trennung oder Aussonderung. Wegen des nachfolgenden Akkusativs und des administrativen Zusammenhangs wird Esra als handelndes Subjekt verstanden; „sonderte … aus“ bewahrt das Grundbild besser als das stärker deutende „wählte aus“.
- source_word: עֶזְרָא הַכֹּהֵן
  choice: der Priester Esra
  rationale: Der hebräische Text nennt Esra hier ausschließlich als Priester; „Schriftgelehrter“ wird nicht aus dem weiteren Kontext ergänzt.
- source_word: אֲנָשִׁים רָאשֵׁי הָאָבוֹת
  choice: Männer, die Oberhäupter der Sippen
  rationale: אֲנָשִׁים wird ausdrücklich wiedergegeben. רָאשֵׁי הָאָבוֹת bezeichnet führende Vertreter väterlicher Großfamilien beziehungsweise Sippen.
- source_word: לְבֵית אֲבֹתָם
  choice: geordnet nach ihren Sippen
  rationale: Die Wendung klassifiziert die Männer nach ihren väterlichen Familienverbänden. „Sippen“ ist im Deutschen verständlicher als die formale Lehnprägung „Vaterhäuser“ und hält zugleich die soziale Einheit von einer bloßen Kernfamilie unterschieden.
- source_word: וְכֻלָּם בְּשֵׁמוֹת
  choice: alle namentlich bestimmt
  rationale: Die Formulierung zeigt, dass sämtliche Vertreter einzeln mit Namen festgelegt beziehungsweise verzeichnet waren.
- source_word: וַיֵּשְׁבוּ
  choice: traten sie zusammen
  rationale: ישב bedeutet wörtlich „sitzen“ oder „sich setzen“, kann in einem administrativen Zusammenhang jedoch das Zusammentreten zu Beratungen oder Untersuchungen bezeichnen. Die natürliche deutsche Fassung gibt diese Funktion wieder.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הָעֲשִׂירִי
  choice: am ersten Tag des zehnten Monats
  rationale: Die hebräische Datumsformel „am Tag eins“ wird im Deutschen idiomatisch als „am ersten Tag“ wiedergegeben.
- source_word: לְדַרְיוֹשׁ הַדָּבָר
  choice: um die Angelegenheit zu untersuchen
  rationale: דרש bezeichnet hier das eingehende Erforschen oder Prüfen eines Sachverhalts im Rahmen der angeordneten Untersuchung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sippen“ bildet die altisraelitische Großfamilienstruktur verständlicher ab als „Vaterhäuser“. Die schwierige Syntax bei וַיִּבָּדְלוּ wird im Haupttext kontextgerecht gefasst und in der Fußnote als echte Alternative offengehalten.
