base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/002.yaml
  text: Then Shecaniah son of Jehiel[a], from the sons of Elam, answered and said to Ezra, “We have acted unfaithfully against our God and have married foreign women from the peoples of the land[c][b]. Yet now there is hope for Israel concerning this.
translation:
  language: de
  text: 'Da antwortete Schechanja, der Sohn Jehiëls, aus der Sippe Elams, Esra: »Wir sind unserem Gott untreu geworden und haben ausländische Frauen aus den Völkern des Landes geheiratet.[a] Doch nun gibt es in dieser Sache Hoffnung für Israel.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben ausländische Frauen aus den Völkern des Landes zu Frauen genommen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung kann auch bedeuten: „hinsichtlich dessen gibt es Hoffnung für Israel“.'
    reason: ambiguity
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר לְעֶזְרָא
  choice: Da antwortete ... Esra
  rationale: Die beiden hebräischen Redeeinleitungen werden in natürlichem Deutsch zu einer knappen Einleitung zusammengezogen; der Antwortcharakter bleibt erhalten.
- source_word: שְׁכַנְיָה בֶן־יְחִיאֵל
  choice: Schechanja, der Sohn Jehiëls
  rationale: Die Eigennamen werden in einer im Deutschen gut lesbaren, am Hebräischen orientierten Form wiedergegeben; die Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: מִבְּנֵי עֵילָם
  choice: aus der Sippe Elams
  rationale: בְּנֵי bezeichnet hier eine Familien- oder Sippengruppe. „Sippe“ vermittelt diese Zugehörigkeit im Deutschen klarer als das wörtliche „Söhne“.
- source_word: מָעַלְנוּ בֵאלֹהֵינוּ
  choice: Wir sind unserem Gott untreu geworden
  rationale: מעל bezeichnet einen Treuebruch, besonders gegenüber Gott. Die Dativkonstruktion ist im Deutschen idiomatisch und bewahrt den relationalen Charakter des Vergehens.
- source_word: וַנֹּשֶׁב נָשִׁים נָכְרִיּוֹת
  choice: und haben ausländische Frauen ... geheiratet
  rationale: Die Verbform bezeichnet in diesem Zusammenhang das Nehmen beziehungsweise Ansiedeln von Frauen als Ehefrauen. „Geheiratet“ macht den gemeinten ehelichen Zusammenhang in modernem Deutsch deutlich.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: aus den Völkern des Landes
  rationale: Der Plural „Völker“ wird bewahrt; „des Landes“ gibt den Singular von הָאָרֶץ ohne vorschnelle geografische Präzisierung wieder.
- source_word: וְעַתָּה יֵשׁ מִקְוֶה לְיִשְׂרָאֵל עַל־זֹאת
  choice: Doch nun gibt es in dieser Sache Hoffnung für Israel
  rationale: „Doch nun“ markiert den Übergang vom Eingeständnis zur Hoffnung. „In dieser Sache“ gibt die offene Beziehung von עַל־זֹאת wieder, ohne sie eindeutig als Gegensatz oder als Grundlage der Hoffnung festzulegen.
theological_decisions:
- issue: Treuebruch gegenüber Gott in מָעַלְנוּ
  choice: unserem Gott untreu geworden
  alternative: gegen unseren Gott treulos gehandelt / uns an unserem Gott versündigt
  rationale: Die gewählte Formulierung bewahrt die bundesbezogene Vorstellung eines Treuebruchs, ohne den Ausdruck auf den allgemeineren Begriff „sündigen“ zu verflachen.
- issue: Bezeichnung der Frauen als נָשִׁים נָכְרִיּוֹת
  choice: ausländische Frauen
  alternative: fremde Frauen / ausländische Ehefrauen
  rationale: „Ausländische Frauen“ gibt die ethnisch-soziale Bezeichnung wieder. Der eheliche Bezug wird vom Verb „geheiratet“ getragen, sodass das Substantiv nicht unnötig präzisiert wird.
- issue: Bezug von עַל־זֹאת
  choice: in dieser Sache
  alternative: trotzdem / hinsichtlich dessen
  rationale: Die hebräische Präposition lässt den genauen logischen Bezug offen. Die Hauptfassung wahrt diese Offenheit; die Fußnote nennt die wesentlichen Deutungsmöglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte hebräische Redeformel ist idiomatisch gestrafft. „Sippe“ erläutert die genealogische Gruppenzugehörigkeit, während die Mehrdeutigkeit des abschließenden עַל־זֹאת im Text und in der Fußnote bewusst offengehalten wird.
