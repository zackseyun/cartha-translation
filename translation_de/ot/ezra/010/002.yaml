  - severity: low
    issue: Fußnote a bezeichnet die Alternative „zu Frauen genommen“ als „wörtlicher auch“.
    rationale: Die Formulierung ist eine plausible idiomatische Alternative zu „geheiratet“, aber keine schlicht wörtlichere Übersetzung der hebräischen Verbverbindung. „Oder“ ist sachlicher und genauer.
