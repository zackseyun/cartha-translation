  source_fidelity: 'Der deutsche Haupttext gibt den hebräischen Sinn zuverlässig wieder: Schechanjas Abstammung aus der Gruppe Elams, der Treuebruch gegenüber Gott, die Eheschließungen mit Frauen aus den Völkern des Landes sowie die anschließende Hoffnung für Israel bleiben erhalten. Die Straffung von „antwortete und sagte zu Esra“ zu „antwortete ... Esra“ ist im Deutschen idiomatisch und ohne Bedeutungsverlust. „In dieser Sache“ wahrt beim abschließenden עַל־זֹאת die offenere Bezugsrelation angemessen.'
  naturalness: Modernes, würdiges Standarddeutsch. „Da antwortete Schechanja ... Esra“ ist grammatisch korrekt; der Text liest sich flüssig. „Aus der Sippe Elams“ vermittelt die genealogische Gruppenzugehörigkeit verständlich.
  terminology: „Unserem Gott untreu geworden“ trifft den mit מעל bezeichneten Treuebruch gut. „Ausländische Frauen“ ist eine sachliche, moderne Wiedergabe von נָשִׁים נָכְרִיּוֹת, während „geheiratet“ den ehelichen Sinn der idiomatischen Verbverbindung trägt. Die Namensformen Schechanja, Jehiël, Elam und Esra sind im Deutschen passend.
  issues:
