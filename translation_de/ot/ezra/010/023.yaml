base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/023.yaml
  text: 'And from the Levites: Jozabad[a], Shimei, Keliah (that is, Kelita), Pethahiah, Judah, and Eliezer.'
translation:
  language: de
  text: 'Und von den Leviten: Josabad, Schimi, Kelaja (das ist Kelita[a]), Petachja, Juda und Elieser.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Kelaja, er ist Kelita.“ Kelita ist offenbar eine andere Namensform oder ein weiterer Name derselben Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: Und von den Leviten
  rationale: Die Formulierung bewahrt den partitiven Sinn von מִן und führt natürlich die entsprechende Gruppe innerhalb der Liste ein.
- source_word: יוֹזָבָד
  choice: Josabad
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: וְשִׁמְעִי
  choice: Schimi
  rationale: Deutsche Transliteration des hebräischen Personennamens.
- source_word: וְקֵלָיָה הוּא קְלִיטָא
  choice: Kelaja – das ist Kelita –
  rationale: הוּא verbindet die beiden Namensformen identifizierend. „Das ist“ gibt diese erklärende Apposition wieder, ohne genauer festzulegen, ob Kelita ein Beiname, eine alternative Namensform oder eine Textvariante ist.
- source_word: פְּתַחְיָה
  choice: Petachja
  rationale: Deutsche Transliteration des Personennamens unter Wiedergabe des theophoren Namenselements.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Die geläufige deutsche Namensform; im Kontext bezeichnet das Wort eine einzelne Person.
- source_word: וֶאֱלִיעֶזֶר
  choice: und Eliëser
  rationale: Die deutsche Form gibt den vokalisierten Namen Elieser/Eliëser wieder und unterscheidet ihn von Eleasar; das Trema verdeutlicht die getrennte Aussprache.
theological_decisions: []
