  text: יַֽעֲמְדוּ נָ֣א שָׂ֠רֵי/נוּ לְֽ/כָל הַ/קָּהָ֞ל וְ/כֹ֣ל אֲשֶׁ֣ר בֶּ/עָרֵ֗י/נוּ הַ/הֹשִׁ֞יב נָשִׁ֤ים נָכְרִיּוֹת֙ יָבֹא֙ לְ/עִתִּ֣ים מְזֻמָּנִ֔ים וְ/עִמָּ/הֶ֛ם זִקְנֵי עִ֥יר וָ/עִ֖יר וְ/שֹׁפְטֶ֑י/הָ עַ֠ד לְ/הָשִׁ֞יב חֲר֤וֹן אַף אֱלֹהֵ֨י/נוּ֙ מִמֶּ֔/נּוּ עַ֖ד לַ/דָּבָ֥ר הַ/זֶּֽה־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/014.yaml
  text: Please let our leaders stand for the whole assembly[a], and let everyone in our cities who has taken foreign wives come at appointed times, with them the elders of each city and its judges[b], until the burning anger of our God is turned back from us in this matter.
translation:
  language: de
  text: Unsere Oberen sollen doch die ganze Versammlung vertreten, und jeder in unseren Städten, der ausländische Frauen geheiratet hat,[a] soll zu festgesetzten Zeiten kommen, zusammen mit den Ältesten jeder Stadt und ihren Richtern, bis der glühende Zorn unseres Gottes in dieser Sache von uns abgewendet ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der ausländische Frauen hat wohnen lassen“; gemeint ist ihre Aufnahme in den eigenen Haushalt als Ehefrauen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bis der glühende Zorn unseres Gottes wegen dieser Sache von uns abgewendet ist“. Die hebräische Schlussfügung ist syntaktisch schwierig.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲמְדוּ נָא
  choice: sollen bitte … eintreten
  rationale: Der Jussiv mit נָא formuliert einen höflichen Vorschlag. „Eintreten“ bewahrt das Bild des Sich-Hinstellens und bezeichnet hier zugleich die repräsentative Aufgabe.
- source_word: שָׂרֵינוּ
  choice: unsere führenden Männer
  rationale: שָׂרִים bezeichnet die leitenden Amtsträger der Gemeinschaft. Die Formulierung ist modern, verständlich und macht den im Hebräischen vorausgesetzten männlichen Bezug sichtbar.
- source_word: לְכָל הַקָּהָל
  choice: für die ganze Versammlung
  rationale: Die Präposition bezeichnet hier die repräsentative Funktion der Führenden gegenüber der gesamten versammelten Gemeinschaft.
- source_word: הַהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: die ausländische Frauen geheiratet haben
  rationale: Wörtlich geht es darum, ausländische Frauen im eigenen Haus wohnen zu lassen; im Kontext bezeichnet die Wendung ihre Aufnahme als Ehefrauen. Natürliches Deutsch gibt dies mit „geheiratet haben“ wieder.
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: zu festgesetzten Zeiten
  rationale: Die Wendung bezeichnet offiziell bestimmte Termine für die Behandlung der einzelnen Fälle.
- source_word: וְעִמָּהֶם זִקְנֵי עִיר וָעִיר וְשֹׁפְטֶיהָ
  choice: zusammen mit den Ältesten der jeweiligen Stadt und ihren Richtern
  rationale: 'עִיר וָעִיר ist distributiv: Jede betroffene Stadt wird durch ihre Ältesten und Richter vertreten.'
- source_word: חֲרוֹן אַף אֱלֹהֵינוּ
  choice: der glühende Zorn unseres Gottes
  rationale: Die Wiedergabe erhält die konkrete Intensität der hebräischen Zornesmetapher, ohne sie zu verharmlosen oder dogmatisch auszudeuten.
- source_word: עַד לְהָשִׁיב … מִמֶּנּוּ עַד לַדָּבָר הַזֶּה
  choice: bis … wegen dieser Sache von uns abgewendet ist
  rationale: „Abgewendet“ gibt die Bewegung von שוב idiomatisch wieder; „wegen dieser Sache“ versteht die abschließende Wendung als Angabe des Anlasses.
theological_decisions:
- issue: Aussage über Gottes Zorn
  choice: der glühende Zorn unseres Gottes
  alternative: der heftige Zorn unseres Gottes; der Grimm unseres Gottes
  rationale: Der hebräische Text spricht ausdrücklich von intensivem göttlichem Zorn. Die Übersetzung bewahrt diese theologische Spannung, ohne sie abzuschwächen oder über den Text hinaus zu systematisieren.
- issue: Bezug der Schlusswendung עַד לַדָּבָר הַזֶּה
  choice: wegen dieser Sache
  alternative: in dieser Sache; bis diese Sache erledigt ist
  rationale: Die syntaktisch schwierige Schlusswendung kann auf den Anlass des Zorns oder auf die Erledigung der Angelegenheit bezogen werden. Der Haupttext wählt den wahrscheinlichen kausalen Bezug; die Fußnote wahrt die andere Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Verwaltungsbegriffe wie „Älteste“ und „Richter“ bleiben erhalten; die Intensität der Aussage über Gottes Zorn wird nicht abgeschwächt.
