revisions:
- from: Unsere führenden Männer sollen bitte für die ganze Versammlung eintreten. Alle in unseren Städten, die ausländische Frauen geheiratet haben,[a] sollen zu festgesetzten Zeiten kommen, zusammen mit den Ältesten der jeweiligen Stadt und ihren Richtern, bis der glühende Zorn unseres Gottes wegen dieser Sache von uns abgewendet ist.[b]
  to: Unsere Oberen sollen doch die ganze Versammlung vertreten, und jeder in unseren Städten, der ausländische Frauen geheiratet hat,[a] soll zu festgesetzten Zeiten kommen, zusammen mit den Ältesten jeder Stadt und ihren Richtern, bis der glühende Zorn unseres Gottes in dieser Sache von uns abgewendet ist.[b]
  rationale: Die Hauptaussage wird präziser und idiomatischer formuliert, ohne den administrativen und repräsentativen Sinn des Hebräischen zu verändern. Die problematische Fußnote b wird durch eine tatsächlich vom hebräischen Wortlaut gedeckte alternative Zuordnung der Schlussfügung ersetzt.
