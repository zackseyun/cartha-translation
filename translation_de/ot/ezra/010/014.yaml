    issue: Fußnote b bietet eine nicht ausreichend textgestützte Alternativübersetzung.
    rationale: Die Formulierung „und diese Sache erledigt ist“ fügt einen eigenständigen zweiten Sachverhalt hinzu. Die schwierige Schlussfügung kann den Zorn auf „diese Sache“ beziehen; sie besagt jedoch nicht ausdrücklich, dass die Sache erledigt sei.
  - severity: low
    issue: „für die ganze Versammlung eintreten“ kann im modernen Deutsch vor allem als Fürsprache verstanden werden.
    rationale: Im Kontext sind die שָׂרִים als Vertreter beziehungsweise zuständige Amtsträger der gesamten Versammlung vorgesehen. „Die ganze Versammlung vertreten“ macht diese Funktion unmittelbarer deutlich.
