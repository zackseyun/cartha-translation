  text: וּ/מִ/בְּנֵ֣י אִמֵּ֔ר חֲנָ֖נִי וּ/זְבַדְיָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/020.yaml
  text: 'And from the sons of Immer: Hanani and Zebadiah.'
translation:
  language: de
  text: 'Und von den Söhnen Immers: Hanani und Sebadja.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Und von den Söhnen
  rationale: Die Verbindung aus ו, מִן und dem Konstrukt בְּנֵי führt in der Aufzählung eine weitere Familiengruppe ein. „Von den Söhnen“ bewahrt sowohl die Listenstruktur als auch die genealogische Ausdrucksweise, ohne sie zum allgemeineren „Nachkommen“ auszuweiten.
- source_word: אִמֵּר
  choice: Immer
  rationale: Name einer priesterlichen Familie; die im Deutschen gebräuchliche biblische Namensform wird beibehalten.
- source_word: חֲנָנִי
  choice: Hanani
  rationale: Personenname in der gebräuchlichen deutschen biblischen Namensform.
- source_word: וּ/זְבַדְיָה
  choice: und Sebadja
  rationale: Das vorangestellte ו verbindet den letzten Namen mit dem vorhergehenden. „Sebadja“ ist eine etablierte deutsche Wiedergabe des hebräischen Namens.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Standarddeutsch entsprechend dem Charakter einer fortlaufenden Namensliste. Der Doppelpunkt macht die im Hebräischen unmarkierte Zuordnung der genannten Männer zur Familie Immers transparent.
