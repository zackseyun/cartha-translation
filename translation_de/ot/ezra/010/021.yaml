  text: וּ/מִ/בְּנֵ֖י חָרִ֑ם מַעֲשֵׂיָ֤ה וְ/אֵֽלִיָּה֙ וּֽ/שְׁמַֽעְיָ֔ה וִ/יחִיאֵ֖ל וְ/עֻזִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/021.yaml
  text: 'And from the sons of Harim: Maaseiah[a], Elijah, Shemaiah, Jehiel, and Uzziah.'
translation:
  language: de
  text: 'Und von den Nachkommen Harims: Maaseja[a], Elija, Schemaja, Jehiël und Usija.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und von den Söhnen Harims“. Die hebräische Formulierung kennzeichnet eine weitere Familiengruppe innerhalb der Liste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Und von den Nachkommen
  rationale: Die Verbindung aus ו, מִן und בְּנֵי führt eine weitere Familiengruppe innerhalb der Liste ein. „Und von den Nachkommen“ gibt sowohl den Anschluss als auch den partitiven Sinn in natürlichem Deutsch wieder.
- source_word: חָרִם
  choice: Harim
  rationale: Personen- beziehungsweise Familienname; nach gebräuchlicher deutscher Bibeltradition wiedergegeben.
- source_word: מַעֲשֵׂיָה
  choice: Maaseja
  rationale: Der Eigenname wird in einer im Deutschen gebräuchlichen, am Hebräischen orientierten Form wiedergegeben.
- source_word: וְ/אֵלִיָּה
  choice: Elija
  rationale: Gebräuchliche moderne deutsche Form des Eigennamens; die Konjunktion wird durch die deutsche Aufzählungsstruktur ausgedrückt.
- source_word: וּֽ/שְׁמַֽעְיָה
  choice: Schemaja
  rationale: Im Deutschen etablierte, am hebräischen Namen orientierte Schreibung.
- source_word: וִ/יחִיאֵל
  choice: Jehiël
  rationale: Die Schreibung folgt einer gebräuchlichen deutschen Transliteration; das Trema macht die getrennte Aussprache der Vokale kenntlich.
- source_word: וְ/עֻזִיָּה
  choice: Usija
  rationale: Gebräuchliche deutsche Form des hebräischen Eigennamens; das abschließende וְ wird in der Aufzählung mit „und“ wiedergegeben.
theological_decisions: []
