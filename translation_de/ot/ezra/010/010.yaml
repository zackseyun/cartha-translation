base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/010.yaml
  text: Then Ezra the priest stood up and said to them[a], “You have acted unfaithfully and have taken foreign women as wives, adding to the guilt of Israel.”
translation:
  language: de
  text: 'Da stand der Priester Esra auf und sagte zu ihnen: „Ihr habt treulos gehandelt und ausländische Frauen zu Ehefrauen genommen[a] und so die Schuld Israels vergrößert.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ausländische Frauen wohnen lassen“. Die hebräische Formulierung kann in diesem Zusammenhang die Aufnahme von Frauen als Ehefrauen in den Haushalt bezeichnen.'
    reason: lexikalische Alternative und Erklärung des hebräischen Idioms
lexical_decisions:
- source_word: וַיָּקָם
  choice: stand ... auf
  rationale: Das Verb קום bezeichnet hier Esras öffentliches Aufstehen in der Versammlung; „stand ... auf“ ist natürlich und wahrt den körperlichen Handlungssinn.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die appositionelle Amtsbezeichnung wird direkt wiedergegeben.
- source_word: מְעַלְתֶּם
  choice: habt treulos gehandelt
  rationale: מעל bezeichnet einen Treuebruch, häufig mit bundesbezogenem Gewicht. „Treulos gehandelt“ bewahrt diesen moralischen und gemeinschaftsbezogenen Sinn.
- source_word: וַתֹּשִׁיבוּ
  choice: habt ... zu Ehefrauen genommen
  rationale: Der Hifil von ישב bedeutet wörtlich „wohnen lassen“; zusammen mit „ausländischen Frauen“ bezeichnet er hier deren Aufnahme in den Haushalt als Ehefrauen. Die Formulierung macht den ehelichen Kontext deutlich, ohne das Verb schlicht mit „heiraten“ gleichzusetzen.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: ausländische Frauen
  rationale: Die hebräische Wendung bedeutet wörtlich „ausländische/fremde Frauen“. „Ausländische“ bezeichnet hier ihre Zugehörigkeit zu anderen Völkern; der eheliche Status wird durch „zu Ehefrauen genommen“ ausgedrückt.
- source_word: לְהוֹסִיף
  choice: und so ... vergrößert
  rationale: Der Infinitiv bezeichnet hier die Folge beziehungsweise Wirkung der vorausgehenden Handlung. „Und so“ stellt diesen Zusammenhang in natürlichem Deutsch her.
- source_word: אַשְׁמַת
  choice: die Schuld
  rationale: אַשְׁמָה bezeichnet hier Schuld beziehungsweise Strafwürdigkeit, nicht ein Schuldopfer.
- source_word: יִשְׂרָאֵל
  choice: Israels
  rationale: Der Name bezeichnet das Bundesvolk als Gemeinschaft und wird im Genitiv natürlich wiedergegeben.
theological_decisions:
- issue: Gemeinschaftliche bundesbezogene Schuld
  choice: die Schuld Israels vergrößert
  alternative: Israels Schuld vermehrt
  rationale: Die Formulierung bewahrt, dass das Verhalten nicht nur als privates Fehlverhalten gilt, sondern die Schuld der ganzen Gemeinschaft erhöht, ohne den hebräischen Wortlaut theologisch auszubauen.
- issue: Art des Treuebruchs
  choice: treulos gehandelt
  alternative: einen Treuebruch begangen
  rationale: Die gewählte Fassung erhält den Gedanken des Treuebruchs, bleibt aber für heutige Leser unmittelbar verständlich und legt nicht ausdrücklich fest, gegenüber wem die Treue gebrochen wurde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der Vorwurfscharakter bleiben knapp und deutlich; die ungewöhnliche Kausativform wird im Haupttext verständlich wiedergegeben und in der Fußnote transparent gemacht.
