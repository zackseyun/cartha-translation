  text: ק֛וּם כִּֽי עָלֶ֥י/ךָ הַ/דָּבָ֖ר וַ/אֲנַ֣חְנוּ עִמָּ֑/ךְ חֲזַ֖ק וַ/עֲשֵֽׂה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/004.yaml
  text: Rise up[a], for this matter is on you, and we are with you. Be strong and do it.
translation:
  language: de
  text: Steh auf! Denn diese Sache liegt in deiner Verantwortung[a], und wir stehen dir zur Seite. Sei stark und handle!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Denn die Sache liegt auf dir.« Gemeint ist, dass Esra für ihre Regelung zuständig ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֛וּם
  choice: Steh auf!
  rationale: Der Imperativ von קום fordert zum unverzüglichen Handeln auf. „Steh auf“ ist im modernen Deutsch direkt und bewahrt das konkrete Bild des hebräischen Ausdrucks.
- source_word: כִּֽי
  choice: Denn
  rationale: כִּי leitet hier die Begründung für die vorausgehende Aufforderung ein.
- source_word: עָלֶ֥יךָ הַדָּבָ֖ר
  choice: diese Sache liegt in deiner Verantwortung
  rationale: Die Wendung mit על bezeichnet eine Aufgabe oder Verantwortung, die jemandem obliegt. Die gewählte Formulierung gibt den idiomatischen Sinn natürlich wieder; die zugrunde liegende räumliche Metapher wird in der Fußnote kenntlich gemacht.
- source_word: וַאֲנַ֣חְנוּ עִמָּ֑ךְ
  choice: und wir stehen dir zur Seite
  rationale: עִמָּךְ drückt hier Beistand und Solidarität aus. „Wir stehen dir zur Seite“ ist im Deutschen natürlicher und in diesem Zusammenhang deutlicher als das ebenfalls mögliche „wir sind mit dir“.
- source_word: חֲזַ֖ק
  choice: Sei stark
  rationale: Der Imperativ von חזק ist eine knappe Aufforderung zu Stärke und Entschlossenheit. „Sei stark“ bewahrt die direkte Form und das Wortfeld des Hebräischen.
- source_word: וַעֲשֵֽׂה
  choice: und handle!
  rationale: Der Imperativ von עשה fordert zur konkreten Ausführung der genannten Aufgabe auf. „Handle“ klingt im Deutschen natürlicher als ein objektloses „tu“ und vermeidet zugleich die stärkere Ergänzung „tu es“.
