source:
  edition: WLC
  text: מִ/בְּנֵ֖י חָשֻׁ֑ם מַתְּנַ֤י מַתַּתָּה֙ זָבָ֣ד אֱלִיפֶ֔לֶט יְרֵמַ֥י מְנַשֶּׁ֖ה שִׁמְעִֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/033.yaml
  text: 'From the sons of Hashum: Mattenai[a], Mattattah, Zabad, Eliphelet, Jeremai, Manasseh, and Shimei.'
translation:
  language: de
  text: 'Von den Söhnen Haschums: Mattenai, Mattatta, Sabad, Elifelet, Jeremai, Manasse und Schimi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Von den Nachkommen
  rationale: Die Verbindung aus מִן und בְּנֵי führt in diesem Listenzusammenhang Angehörige einer Familiengruppe an. „Nachkommen“ gibt die genealogische Bedeutung im heutigen Deutsch natürlicher wieder als das wörtliche „Söhne“.
- source_word: חָשֻׁם
  choice: Haschum
  rationale: Der Personen- beziehungsweise Familienname wird nach geläufigen deutschen Transkriptionskonventionen wiedergegeben.
- source_word: מַתְּנַי
  choice: Mattenai
  rationale: Direkte deutsche Transkription des Eigennamens.
- source_word: מַתַּתָּה
  choice: Mattatta
  rationale: Die Form bildet die Konsonanten und die Verdopplung des Tav in einer für deutsche Leser klaren Transkription ab.
- source_word: זָבָד
  choice: Sabad
  rationale: Das hebräische Zajin wird nach üblicher deutscher Bibelnamenkonvention mit „S“ wiedergegeben.
- source_word: אֱלִיפֶלֶט
  choice: Elifelet
  rationale: Das hebräische Pe ohne Dagesch wird als „f“ transkribiert; der Name bleibt unübersetzt.
- source_word: יְרֵמַי
  choice: Jeremai
  rationale: Direkte, im Deutschen gut lesbare Transkription des Eigennamens.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Verwendet die im Deutschen etablierte Form des biblischen Namens.
- source_word: שִׁמְעִי
  choice: Schimi
  rationale: Gibt שׁ mit deutschem „Sch“ wieder und bewahrt die hebräische Namensform.
