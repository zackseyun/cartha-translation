base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/013.yaml
  text: But the people are many[a], and it is the rainy season, and there is no strength to stand outside. And the work is not for one day or for two[c][b], for we have greatly transgressed in this matter.
translation:
  language: de
  text: Doch das Volk ist zahlreich, und es ist Regenzeit[a]; wir haben keine Kraft, draußen stehen zu bleiben. Die Aufgabe lässt sich nicht in einem oder zwei Tagen bewältigen[b], denn wir haben in dieser Sache schwer gesündigt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Es ist die Zeit der Regengüsse.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Die Aufgabe ist nicht für einen Tag und nicht für zwei.“'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „denn wir haben in dieser Sache schwer gefrevelt“ beziehungsweise „schwer treulos gehandelt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Doch
  rationale: Kennzeichnet den Einwand gegenüber dem Vorschlag des vorigen Verses in natürlichem, gehobenem Standarddeutsch.
- source_word: הָעָם רָב
  choice: das Volk ist zahlreich
  rationale: Bewahrt die prädikative Aussage von רָב und gibt die große Zahl der versammelten Menschen klar wieder.
- source_word: וְהָעֵת גְּשָׁמִים
  choice: und es ist Regenzeit
  rationale: Gibt die hebräische Wendung „Zeit der Regengüsse“ idiomatisch wieder, ohne die Stärke oder Dauer des Regens über den Text hinaus festzulegen.
- source_word: וְאֵין כֹּחַ לַעֲמֹד בַּחוּץ
  choice: wir haben keine Kraft, draußen stehen zu bleiben
  rationale: Die unpersönliche hebräische Aussage wird im Zusammenhang auf die versammelte Gemeinschaft bezogen. „Stehen zu bleiben“ macht deutlich, dass es um längeres Ausharren im Freien geht.
- source_word: וְהַמְּלָאכָה
  choice: die Aufgabe
  rationale: Bezeichnet hier das anstehende Verfahren beziehungsweise Vorhaben, nicht speziell körperliche Arbeit.
- source_word: לֹא לְיוֹם אֶחָד וְלֹא לִשְׁנַיִם
  choice: lässt sich nicht in einem oder zwei Tagen bewältigen
  rationale: Gibt den gemeinten Zeitaufwand in natürlichem Deutsch wieder; die nähere hebräische Formulierung bleibt in einer Fußnote erhalten.
- source_word: כִּי הִרְבִּינוּ לִפְשֹׁעַ
  choice: denn wir haben uns ... schwer vergangen
  rationale: הִרְבִּינוּ mit dem Infinitiv verstärkt das Ausmaß des Vergehens. „Sich schwer vergehen“ bewahrt den Ernst von פשׁע, ohne dessen mögliche Nuancen vorschnell auf eine einzige theologische Kategorie festzulegen.
- source_word: בַּדָּבָר הַזֶּה
  choice: in dieser Sache
  rationale: Eine natürliche Wiedergabe, die auf den im Zusammenhang behandelten Verstoß verweist.
theological_decisions:
- issue: Art des mit לִפְשֹׁעַ bezeichneten Vergehens
  choice: uns schwer vergangen
  alternative: schwer gesündigt; schwer treulos oder rebellisch gehandelt
  rationale: פשׁע bezeichnet einen ernsten Verstoß und kann die Nuance von Auflehnung oder Treuebruch tragen. Die Hauptübersetzung wahrt das Gewicht der Aussage, ohne eine enger gefasste dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierungen sind für ein breites Publikum verständlich; zugleich werden die hebräische Satzbewegung, der praktische Zeitbezug und die ernste, jedoch nicht überbestimmte Sprache des Vergehens bewahrt.
