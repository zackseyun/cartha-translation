  text: מִ/בְּנֵ֖י נְב֑וֹ יְעִיאֵ֤ל מַתִּתְיָה֙ זָבָ֣ד זְבִינָ֔א ידו וְ/יוֹאֵ֖ל בְּנָיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/043.yaml
  text: 'From the sons of Nebo: Jeiel[a], Mattithiah, Zabad, Zebina, Jaddai, Joel, and Benaiah.'
translation:
  language: de
  text: 'Von den Nachkommen Nebos: Jeïël, Mattitja, Sabad, Sebina, Jaddai[a], Joël und Benaja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Lesung des hebräischen Namens ist unsicher; möglich sind auch Iddo oder Jedo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Von den Nachkommen
  rationale: Die Verbindung aus מִן und בְּנֵי führt eine Teilgruppe innerhalb der Liste ein. „Von den Nachkommen“ gibt die genealogische beziehungsweise gruppenbezogene Funktion in natürlichem Deutsch wieder.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Der Eigenname wird in seiner im Deutschen geläufigen Form wiedergegeben.
- source_word: יְעִיאֵל
  choice: Jeïël
  rationale: Transliteration des hebräischen Personennamens; das Trema macht die getrennte Aussprache der Vokale sichtbar.
- source_word: מַתִּתְיָה
  choice: Mattitja
  rationale: Eine natürliche deutsche Transliteration des hebräischen Personennamens.
- source_word: זָבָד
  choice: Sabad
  rationale: Direkte, deutschsprachige Transliteration des Eigennamens.
- source_word: זְבִינָא
  choice: Sebina
  rationale: Direkte, deutschsprachige Transliteration des Eigennamens.
- source_word: ידו
  choice: Jaddai
  rationale: Die unpunktierte Namensform ist schwierig und wird unterschiedlich gedeutet. „Jaddai“ steht im Haupttext, während die Unsicherheit in einer Fußnote kenntlich gemacht wird.
- source_word: וְ/יוֹאֵל
  choice: Joël
  rationale: Der Personenname wird deutsch transliteriert; die hebräische Konjunktion wird im natürlichen deutschen Listenbau beim letzten Glied wiedergegeben.
- source_word: בְּנָיָה
  choice: Benaja
  rationale: Geläufige deutsche Form des hebräischen Personennamens.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Listendeutsch. Die Namensformen folgen einer modernen deutschen Bibeltransliteration; die echte textliche Unsicherheit bei ידו bleibt durch die Fußnote sichtbar. Der Fußnotenmarker steht beim tatsächlich unsicheren Namen Jaddai.
