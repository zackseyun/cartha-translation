id: EZR.10.11
reference: Ezra 10:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנ֥וּ תוֹדָ֛ה לַ/יהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם וַ/עֲשׂ֣וּ רְצוֹנ֑/וֹ וְ/הִבָּֽדְלוּ֙ מֵ/עַמֵּ֣י הָ/אָ֔רֶץ וּ/מִן הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/011.yaml
  text: So now give praise to Yahweh[a], the God of your fathers, and do his will[b]. Separate yourselves from the peoples of the land and from the foreign women.
translation:
  language: de
  text: Nun gebt dem HERRN[a], dem Gott eurer Väter, Lob[b] und tut, was er will. Sondert euch von den Völkern des Landes und von den ausländischen Frauen[c] ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier der Gottesname Jahwe.
    reason: divine_name
  - marker: b
    text: 'Oder: Legt vor dem HERRN ein Bekenntnis ab. Die hebräische Wendung kann Lob oder Dank, in diesem Zusammenhang aber auch ein Bekenntnis bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: ausländischen Ehefrauen. Im weiteren Zusammenhang geht es um Ehen; hier steht im Hebräischen jedoch „Frauen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun
  rationale: Gibt die folgernde zeitliche Wendung knapp und natürlich wieder.
- source_word: תְּנוּ תוֹדָה
  choice: gebt … Lob
  rationale: Die Wendung kann Lob beziehungsweise Dank, im Zusammenhang aber auch ein Bekenntnis bezeichnen. „Lob geben“ bewahrt die Grundbedeutung, während die kontextuell plausible Alternative in einer Fußnote steht.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens mit „HERR“ ist würdig und allgemein verständlich; eine Fußnote nennt den Namen Jahwe.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: dem Gott eurer Väter
  rationale: Bewahrt die konkrete Bundes- und Abstammungssprache des Hebräischen.
- source_word: וַעֲשׂוּ רְצוֹנוֹ
  choice: und tut, was er will
  rationale: Natürliches modernes Deutsch für die wörtliche Wendung „tut seinen Willen“, ohne deren verpflichtenden Sinn abzuschwächen.
- source_word: וְהִבָּדְלוּ
  choice: Sondert euch … ab
  rationale: Gibt den reflexiven beziehungsweise medialen Sinn des Niphal-Imperativs und die geforderte aktive Trennung wieder.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: von den Völkern des Landes
  rationale: Bewahrt sowohl den Plural „Völker“ als auch die nicht näher bestimmte Wendung „des Landes“.
- source_word: וּמִן הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: und von den ausländischen Frauen
  rationale: Der Vers selbst sagt „Frauen“, nicht ausdrücklich „Ehefrauen“; der eheliche Zusammenhang wird als Alternative in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Bedeutung von תְּנוּ תוֹדָה
  choice: gebt … Lob
  alternative: legt vor dem HERRN ein Bekenntnis ab / bekennt dem HERRN eure Schuld
  rationale: Die hebräische Wendung lässt Lob oder Dank zu, kann in diesem Bußzusammenhang jedoch auf ein Bekenntnis zielen. Der Haupttext entscheidet sich nicht stillschweigend für die stärker kontextualisierte Deutung, sondern dokumentiert sie in der Fußnote.
- issue: Bezug von הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: ausländische Frauen
  alternative: ausländische Ehefrauen
  rationale: Der weitere Zusammenhang handelt von Ehen, doch das Substantiv im vorliegenden Vers bedeutet formal „Frauen“. Die alternative Kontextdeutung bleibt sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Imperative bleiben direkt und gemeinschaftsbezogen. „Väter“ wahrt die konkrete Sprache des Ausgangstextes; „ausländisch“ ist im heutigen Deutsch verständlicher und weniger wertend als „fremdländisch“.
