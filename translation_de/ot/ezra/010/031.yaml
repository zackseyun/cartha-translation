  text: וּ/בְנֵ֖י חָרִ֑ם אֱלִיעֶ֧זֶר יִשִּׁיָּ֛ה מַלְכִּיָּ֖ה שְׁמַֽעְיָ֥ה שִׁמְעֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/031.yaml
  text: 'And from the sons of Harim: Eliezer[a], Isshijah, Malkijah, Shemaiah[c][b], and Shimeon.'
translation:
  language: de
  text: 'Und von den Söhnen Harims[a]: Eliëser, Jischija, Malkija, Schemaja und Schimon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die Söhne Harims: Eliëser, Jischija, Malkija, Schemaja und Schimon.“ Dann wird die Wendung lediglich als Überschrift der Liste verstanden, ohne ein ergänztes „von“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Und von den Söhnen
  rationale: Die Verbindung aus וּ und בְנֵי leitet die nächste Familiengruppe innerhalb der Liste ein. „Von den Söhnen“ macht deutlich, dass anschließend einzelne Angehörige des Geschlechts genannt werden; die formal mögliche Wiedergabe ohne „von“ bleibt in der Fußnote erhalten.
- source_word: חָרִם
  choice: Harim
  rationale: Der Personen- beziehungsweise Sippenname wird in der im Deutschen geläufigen Form wiedergegeben.
- source_word: אֱלִיעֶזֶר
  choice: Eliëser
  rationale: Diese deutsche Namensform bildet die hebräische Lautgestalt ab; das Trema verdeutlicht, dass i und e getrennt gesprochen werden.
- source_word: יִשִּׁיָּה
  choice: Jischija
  rationale: Die lautnahe deutsche Umschrift gibt den Anfangskonsonanten und die Namensendung verständlich wieder.
- source_word: מַלְכִּיָּה
  choice: Malkija
  rationale: Die Form folgt einer lautnahen, im modernen Deutschen gut lesbaren Umschrift.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Die etablierte deutsche Form gibt שׁ als „sch“ und die Namensendung angemessen wieder.
- source_word: שִׁמְעוֹן
  choice: Schimon
  rationale: „Schimon“ spiegelt die hebräische Aussprache genauer als die traditionelle deutsche Form „Simeon“.
