base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/027.yaml
  text: 'And from the sons of Zattu: Elioenai, Eliashib, Mattaniah, Jeremoth, Zabad, and Aziza.'
translation:
  language: de
  text: 'Und von den Söhnen Zattus: Eljoënai, Eljaschib, Mattanja, Jeremot, Sabad und Asisa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Und von den Nachkommen
  rationale: Die Verbindung aus Konjunktion, Präposition und בְּנֵי setzt die fortlaufende Liste fort. In diesem Sippenverzeichnis bezeichnet „Nachkommen“ den genealogischen beziehungsweise familiären Zusammenhang im Deutschen natürlicher und weniger missverständlich als das engere „Söhne“.
- source_word: זַתּוּא
  choice: Zattu
  rationale: Der Personen- beziehungsweise Sippenname wird nach geläufiger deutscher Bibelnamentradition wiedergegeben.
- source_word: אֶלְיוֹעֵנַי
  choice: Eljoënai
  rationale: Der Eigenname wird in einer im Deutschen lesbaren Form transliteriert; das Trema macht kenntlich, dass o und ë getrennt gesprochen werden.
- source_word: אֶלְיָשִׁיב
  choice: Eljaschib
  rationale: Deutsche Transliteration des Eigennamens; שׁ wird konventionell mit „sch“ wiedergegeben.
- source_word: מַתַּנְיָה
  choice: Mattanja
  rationale: Geläufige deutsche Wiedergabe des Eigennamens, wobei die Verdopplung des ט und die Namensendung angemessen erkennbar bleiben.
- source_word: וִֽ/ירֵמוֹת
  choice: Jeremot
  rationale: Der Eigenname wird in deutscher Form transliteriert; die vorangestellte Konjunktion wird entsprechend natürlichem deutschen Listenstil nicht bei jedem Namen wiederholt.
- source_word: וְ/זָבָד
  choice: Sabad
  rationale: Deutsche Transliteration des Eigennamens; das hebräische ז wird hier der etablierten deutschen Aussprache entsprechend mit „S“ wiedergegeben.
- source_word: וַ/עֲזִיזָא
  choice: Asisa
  rationale: Deutsche Transliteration des Eigennamens. Die Konjunktion wird als „und“ vor dem letzten Glied der deutschen Aufzählung ausgedrückt.
