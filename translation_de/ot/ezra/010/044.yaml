  text: All these had married foreign women, and some of them had wives by whom they had children.
translation:
  language: de
  text: Alle diese hatten ausländische Frauen geheiratet; einige von ihnen hatten Frauen, mit denen sie Kinder hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut am Versende ist knapp und schwierig. Wörtlich ungefähr: „Und es gab unter ihnen Frauen, und sie setzten Söhne.“ Die Übersetzung gibt den im Zusammenhang naheliegenden Sinn wieder. Das hebräische Wort lautet wörtlich „Söhne“, kann hier aber allgemein Nachkommen bzw. Kinder meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נשא/י נָשִׁים נָכְרִיּוֹת
  choice: hatten ausländische Frauen geheiratet
  rationale: Die Lesart נשאי wird im Zusammenhang als Form von נשׂא in der Verbindung „Frauen nehmen/heiraten“ verstanden. „Geheiratet“ gibt den ehelichen Sinn im heutigen Deutsch klar wieder; נָכְרִיּוֹת bezeichnet Frauen fremder Herkunft bzw. außerhalb der Gemeinschaft.
- source_word: וְיֵשׁ מֵהֶם נָשִׁים
  choice: Einige von diesen Frauen
  rationale: Die knappe Existenzkonstruktion ist syntaktisch schwierig. Diese Wiedergabe bezieht מֵהֶם kontextgemäß auf die zuvor genannten Frauen und führt im Deutschen natürlich zum folgenden Hinweis auf deren Kinder.
- source_word: וַיָּשִׂימוּ בָּנִים
  choice: hatten Kinder geboren
  rationale: Der masoretische Wortlaut lautet wörtlich etwa „und sie setzten Söhne“ und ist an dieser Stelle ungewöhnlich bzw. schwierig. Im Zusammenhang liegt die Aussage nahe, dass aus einigen Ehen Kinder hervorgegangen waren; „hatten Kinder geboren“ wahrt den Bezug auf die Frauen und ergibt verständliches Deutsch.
- source_word: בָּנִים
  choice: Kinder
  rationale: Das Wort bedeutet formal „Söhne“, kann im Zusammenhang jedoch Nachkommen bzw. Kinder bezeichnen. Da es hier um vorhandene Nachkommenschaft aus den Ehen geht, ist „Kinder“ angemessen; die wörtlichere Möglichkeit wird in der Fußnote genannt.
