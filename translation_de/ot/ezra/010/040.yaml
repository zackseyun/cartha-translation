- source_word: מַכְנַדְבַי
  choice: Machnadbai
  rationale: Hebräische Personenbezeichnung; nach den im Deutschen üblichen Transkriptionskonventionen als Eigenname wiedergegeben. Die Folge כְנ wird durch „chn“ abgebildet; die unbetonte Vokalfolge ergibt die geläufige Form „Machnadbai“.
- source_word: שָׁשַׁי
  choice: Schaschai
  rationale: Personenname, nicht übersetzt, sondern deutsch transkribiert. Hebräisches שׁ wird mit „sch“ und die Schlussfolge שַׁי mit „schai“ wiedergegeben.
- source_word: שָׁרָי
  choice: Scharai
  rationale: Personenname, deutsch transkribiert. Hebräisches שׁ wird mit „sch“, die Schlussfolge רָי mit „rai“ wiedergegeben.
