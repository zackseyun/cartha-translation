  text: וּ/מִֽ/יִּשְׂרָאֵ֑ל מִ/בְּנֵ֣י פַרְעֹ֡שׁ רַ֠מְיָה וְ/יִזִּיָּ֤ה וּ/מַלְכִּיָּה֙ וּ/מִיָּמִ֣ן וְ/אֶלְעָזָ֔ר וּ/מַלְכִּיָּ֖ה וּ/בְנָיָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/025.yaml
  text: 'And from Israel[a], from the sons of Parosh: Ramiah, Izziah, Malkijah, Mijamin, Eleazar, Malkijah, and Benaiah.'
translation:
  language: de
  text: 'Und von Israel, von den Nachkommen des Parosch: Ramja, Jissija, Malkija, Mijamin, Eleasar, Malkija[a] und Benaja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im hebräischen Text steht der Name Malkija in dieser Liste zweimal; vermutlich sind zwei verschiedene Männer gleichen Namens gemeint.
    reason: Die auffällige Namenswiederholung des Ausgangstextes wird bewahrt und erläutert.
lexical_decisions:
- source_word: וּמִֽיִּשְׂרָאֵל
  choice: Und von Israel
  rationale: Die Konjunktion und die Präposition werden direkt wiedergegeben; „Und“ wahrt den Anschluss an den vorhergehenden Vers.
- source_word: מִבְּנֵי
  choice: von den Nachkommen des
  rationale: בְּנֵי bedeutet wörtlich „Söhne“, bezeichnet in Listen jedoch häufig die Angehörigen einer Familie oder Sippe. „Nachkommen“ ist im heutigen Deutsch natürlich und sachlich passend.
- source_word: פַרְעֹשׁ
  choice: Parosch
  rationale: Der Personen- beziehungsweise Familienname wird nach geläufiger deutscher Umschrift wiedergegeben.
- source_word: רַמְיָה
  choice: Ramja
  rationale: Der Eigenname wird in einer für deutsche Leser transparenten Umschrift wiedergegeben.
- source_word: יִזִּיָּה
  choice: Jissija
  rationale: Die Umschrift bildet den anlautenden J-Laut, die Konsonantenverdopplung und die Endung angemessen ab.
- source_word: מַלְכִּיָּה
  choice: Malkija
  rationale: Beide Vorkommen desselben hebräischen Namens werden identisch und in üblicher deutscher Form wiedergegeben.
- source_word: מִיָּמִן
  choice: Mijamin
  rationale: Der Eigenname wird möglichst nah an der masoretischen Lautung umschrieben.
- source_word: אֶלְעָזָר
  choice: Eleasar
  rationale: Verwendet wird die im Deutschen etablierte Form des Namens.
- source_word: בְנָיָה
  choice: Benaja
  rationale: Der Eigenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
