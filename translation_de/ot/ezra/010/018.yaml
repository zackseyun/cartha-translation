base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/018.yaml
  text: 'And among the sons of the priests who had taken foreign wives[a], there were found from the sons of Jeshua son of Jozadak and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah.'
translation:
  language: de
  text: 'Unter den Söhnen der Priester, die ausländische Frauen geheiratet hatten[a], fanden sich unter den Söhnen Jeschuas, des Sohnes Jozadaks, und seiner Brüder: Maaseja, Eliëser, Jarib und Gedalja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sich ausländische Frauen genommen hatten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא
  choice: fanden sich
  rationale: Das morphologisch singularische Verb führt eine Mehrzahl namentlich genannter Männer ein. Die deutsche existentiale Wendung im Plural gibt diesen kollektiven Sinn natürlich wieder.
- source_word: מִבְּנֵי הַכֹּהֲנִים
  choice: unter den Söhnen der Priester
  rationale: Die Formulierung bewahrt die genealogische Sprache von בְּנֵי und gibt die durch מִן bezeichnete Zugehörigkeit zur Gruppe idiomatisch wieder.
- source_word: אֲשֶׁר הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  choice: die ausländische Frauen geheiratet hatten
  rationale: Im Zusammenhang von Esra 10 bezeichnet die Wendung eheliche Verbindungen mit nichtisraelitischen Frauen. Die Übersetzung ist im heutigen Deutsch klar und natürlich; die wörtlichere Ausdrucksweise steht in der Fußnote.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: ausländische Frauen
  rationale: נָכְרִיּוֹת kennzeichnet die Frauen als nicht zum eigenen Volk gehörig. „Ausländische Frauen“ wahrt diese Aussage, ohne eine zusätzliche ethnische oder religiöse Präzisierung einzutragen.
- source_word: מִבְּנֵי יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: von den Söhnen Jeschuas, des Sohnes Jozadaks
  rationale: Die wiederholte genealogische Wendung wird transparent mit „Söhne“ wiedergegeben; der Apposition wird mit dem deutschen Genitiv entsprochen.
- source_word: וְאֶחָיו
  choice: und seinen Brüdern
  rationale: Das Suffix bezieht sich auf Jeschua. „Brüder“ ist die unmittelbare lexikalische Entsprechung und vermeidet die unbegründete Erweiterung zu „Verwandten“.
- source_word: מַעֲשֵׂיָה וֶאֱלִיעֶזֶר וְיָרִיב וּגְדַלְיָה
  choice: Maaseja, Eliëser, Jarib und Gedalja
  rationale: Die Personennamen werden in gebräuchlicher deutscher Bibelnamensform wiedergegeben und nicht übersetzt.
