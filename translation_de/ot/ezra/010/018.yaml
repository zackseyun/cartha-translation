  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: Es geht um Angehörige der Priesterschaft, die eheliche Verbindungen mit ausländischen Frauen eingegangen waren, und um die anschließende Namensliste. Die deutsche Fassung sollte jedoch die zweite Gruppenangabe klarer an die Namen anbinden. Das Hebräische meint die Söhne bzw. Nachkommen Jeschuas und seiner Brüder; die vorliegende Koordination „von den Söhnen Jeschuas ... und seinen Brüdern“ ist im Deutschen syntaktisch missverständlich.'
  naturalness: „Fanden sich“ und „ausländische Frauen geheiratet hatten“ sind modernes, würdiges Standarddeutsch. „Unter den Söhnen der Priester“ bewahrt die genealogische Sprache angemessen. Die Wiederholung von „unter“ schafft eine klare, natürliche Satzstruktur.
