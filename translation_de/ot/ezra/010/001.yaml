  terminology: „Haus Gottes“ bewahrt die hebräische Bezeichnung angemessen. „Versammlung“ ist für קָהָל hier gegenüber „Gemeinde“ vorzuziehen, da es die konkrete Menschenmenge ohne spätere ekklesiale Konnotation bezeichnet. „Seine Schuld bekannte“ ist als natürliche deutsche Explizierung des kontextuell penitentialen Bekennens vertretbar, muss aber in der Anmerkung präziser erklärt werden.
