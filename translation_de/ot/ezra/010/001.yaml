base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/001.yaml
  text: While Ezra was praying and making confession[a], weeping and falling down before the house of God, a very large assembly from Israel gathered to him—men, women, and children—for the people wept bitterly.
translation:
  language: de
  text: 'Während Esra betete und seine Schuld bekannte[a], weinte und sich vor dem Haus Gottes niederwarf, versammelte sich bei ihm eine sehr große Versammlung aus Israel: Männer, Frauen und Kinder. Denn das Volk weinte sehr.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht kein ausdrückliches Objekt: Das Verb bezeichnet hier ein Schuldbekenntnis.'
    reason: Die deutsche Ergänzung „seine Schuld“ macht den im Kontext gemeinten Gegenstand des Bekennens idiomatisch deutlich, ohne eine bestimmte Zahl oder Art von Verfehlungen festzulegen.
lexical_decisions:
- source_word: וּכְהִתְפַּלֵּל עֶזְרָא
  choice: Während Esra betete
  rationale: Die Verbindung וּכְ mit dem Infinitiv bezeichnet eine gleichzeitige Begleithandlung. „Während“ gibt dies im Deutschen natürlich wieder.
- source_word: וּכְהִתְוַדֹּתוֹ
  choice: und seine Schuld bekannte
  rationale: Das Hitpael von ידה bezeichnet hier das Bekennen im Bußgebet. Das ergänzte „Schuld“ macht den im Deutschen erforderlichen Gegenstandsbezug deutlich, ohne einzelne Sünden zu spezifizieren.
- source_word: בֹּכֶה וּמִתְנַפֵּל
  choice: weinte und sich … niederwarf
  rationale: Die Partizipien schildern Esras anhaltendes Weinen und sein demütiges Sich-Niederwerfen; „niederwarf“ bewahrt die reflexive Intensität, ohne eine bestimmte Körperhaltung näher festzulegen.
- source_word: לִפְנֵי בֵּית הָאֱלֹהִים
  choice: vor dem Haus Gottes
  rationale: Die Wiedergabe bewahrt die konkrete hebräische Bezeichnung, statt sie erklärend durch „Tempel“ zu ersetzen.
- source_word: נִקְבְּצוּ אֵלָיו
  choice: versammelte sich … um ihn
  rationale: Das Nifal bezeichnet das Zusammenkommen. „Um ihn“ ist im Deutschen bei einer sich zu einer Person versammelnden Menge idiomatischer als „zu ihm“.
- source_word: מִיִּשְׂרָאֵל קָהָל רַב מְאֹד
  choice: eine überaus große Gemeinde aus Israel
  rationale: קָהָל bezeichnet die versammelte Gemeinschaft; „Gemeinde“ ist hier allgemein, nicht konfessionell, gemeint. רַב מְאֹד wird als starke Größenangabe mit „überaus groß“ wiedergegeben.
- source_word: אֲנָשִׁים וְנָשִׁים וִילָדִים
  choice: Männer, Frauen und Kinder
  rationale: Die ausdrücklich genannte dreifache Zusammensetzung der Versammlung bleibt vollständig erhalten.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet hier eine begründende beziehungsweise erklärende Aussage ein.
- source_word: הַרְבֵּה בֶכֶה
  choice: weinte heftig
  rationale: Die hebräische Verbindung intensiviert das Weinen. „Heftig“ gibt die Stärke wieder, ohne die zusätzliche emotionale Deutung „bitterlich“ zwingend einzutragen; die wörtlichere Form steht in der Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde am Ende geteilt, um die lange hebräische Periode gut lesbar wiederzugeben. „Haus Gottes“ bewahrt das Bild des Ausgangstextes; „Gemeinde“ bezeichnet hier die versammelte Menge Israels und keine spätere kirchliche Institution.
