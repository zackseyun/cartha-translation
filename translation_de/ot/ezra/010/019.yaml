source:
  edition: WLC
  text: וַ/יִּתְּנ֥וּ יָדָ֖/ם לְ/הוֹצִ֣יא נְשֵׁי/הֶ֑ם וַ/אֲשֵׁמִ֥ים אֵֽיל צֹ֖אן עַל אַשְׁמָתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/019.yaml
  text: They pledged themselves to send away their wives[a], and being guilty[b], they offered a ram from the flock for their guilt.
translation:
  language: de
  text: Sie verpflichteten sich, ihre Frauen fortzuschicken[a], und als Schuldige brachten sie für ihre Schuld einen Widder aus der Herde dar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie gaben ihre Hand“; eine hebräische Wendung für ein feierliches Versprechen oder eine bindende Verpflichtung.'
    reason: lexical_alternative
  - marker: b
    text: 'Ausdrücklicher könnte man übersetzen: „Sie brachten einen Widder aus der Herde als Schuldopfer für ihre Schuld dar.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנוּ יָדָם
  choice: Sie verpflichteten sich
  rationale: Die Wendung bedeutet wörtlich „sie gaben ihre Hand“, dient hier aber als hebräische Verpflichtungsformel. Die idiomatische Wiedergabe vermittelt den Sinn in natürlichem Deutsch.
- source_word: לְהוֹצִיא
  choice: fortzuschicken
  rationale: Der Hifil-Infinitiv von יצא bedeutet hier, jemanden hinausgehen zu lassen. Im Zusammenhang bezeichnet er die Trennung von den Frauen, ohne einen über den Wortlaut hinausgehenden rechtlichen Fachbegriff einzuführen.
- source_word: נְשֵׁיהֶם
  choice: ihre Frauen
  rationale: Im ehelichen Zusammenhang bezeichnet נָשִׁים die Ehefrauen. „Ihre Frauen“ ist im modernen Deutschen natürlich und eindeutig.
- source_word: וַאֲשֵׁמִים
  choice: und als Schuldige
  rationale: Das Adjektiv beschreibt ihren Zustand der Schuld. Die substantivische Wiedergabe bewahrt die knappe hebräische Konstruktion und verbindet sie mit der folgenden Sühnehandlung.
- source_word: אֵיל צֹאן
  choice: einen Widder aus der Herde
  rationale: Die Wortgruppe bezeichnet einen Widder als Opfertier. „Aus der Herde“ gibt die konkrete Herkunft natürlich wieder.
- source_word: עַל אַשְׁמָתָם
  choice: für ihre Schuld
  rationale: Die Präposition mit dem Substantiv bezeichnet den Anlass beziehungsweise Bezug des Opfers. Die knappe Formulierung bewahrt zugleich die Wortverbindung zwischen ihrem Schuldigsein und ihrer Schuld.
theological_decisions:
- issue: Ob das Opfer im Haupttext ausdrücklich als „Schuldopfer“ bezeichnet werden soll
  choice: Die Handlung wird als Darbringung eines Widders für ihre Schuld formuliert, ohne den technischen Ausdruck „Schuldopfer“ in den Haupttext einzufügen.
  alternative: „Sie brachten einen Widder aus der Herde als Schuldopfer für ihre Schuld dar.“
  rationale: Der hebräische Satz nennt ausdrücklich den Widder und ihre Schuld, enthält hier aber kein eigenes Substantiv für „Opfer“. „Darbringen“ ergänzt die im Hebräischen elliptisch vorausgesetzte Opferhandlung, während die technische Bezeichnung in der Fußnote als mögliche Verdeutlichung erscheint.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die hebräische Verpflichtungsformel wird idiomatisch wiedergegeben; die knappe Opferaussage bleibt in ihrer theologischen Spannung erhalten und wird nicht unnötig terminologisch festgelegt.
