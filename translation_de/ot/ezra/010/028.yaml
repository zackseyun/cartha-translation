  text: 'And from the sons of Bebai: Jehohanan[a], Hananiah, Zabbai[b], Athlai.'
translation:
  language: de
  text: 'Und von den Söhnen Bebais[a]: Jehohanan[b], Hananja, Sabbai, Atlai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Söhne“ kann hier weiter gefasst Angehörige oder Nachkommen der Familie Bebais bezeichnen.
