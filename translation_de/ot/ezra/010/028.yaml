lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Und von den Söhnen
  rationale: Gibt Konjunktion, Präposition und den Konstruktplural formal nah wieder. In dieser Namensliste kann „Söhne“ zugleich Angehörige oder Nachkommen einer Familienlinie bezeichnen.
- source_word: בֵּבָי
  choice: Bebais
  rationale: Der Eigen- beziehungsweise Familienname wird nach deutscher Namenskonvention transliteriert und zur natürlichen Wiedergabe der hebräischen Genitivverbindung flektiert.
- source_word: יְהוֹחָנָן
  choice: Jehohanan
  rationale: Die Transliteration bewahrt die volle hebräische Namensform einschließlich des theophoren Elements; die kürzere Form „Johanan“ ist ebenfalls gebräuchlich.
- source_word: חֲנַנְיָה
  choice: Hananja
  rationale: Gebräuchliche deutsche Transliteration des hebräischen Eigennamens.
- source_word: זַבַּי
  choice: Sabbai
  rationale: Deutsche Transliteration des Eigennamens; Zajin wird mit „S“ und der verdoppelte Konsonant mit „bb“ wiedergegeben.
- source_word: עַתְלָי
  choice: Atlai
  rationale: Natürliche deutsche Transliteration; das hebräische Taw ohne Dagesch wird hier nicht als englisch geprägtes „th“ wiedergegeben.
