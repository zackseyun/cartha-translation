lexical_decisions:
- source_word: וּ/בָנִי
  choice: und Bani
  rationale: Die vorangestellte Konjunktion וּ wird in der Namensliste mit „und“ wiedergegeben; der Personenname בָנִי erscheint in der im Deutschen üblichen biblischen Form „Bani“.
- source_word: וּ/בִנּוּי
  choice: und Binnui
  rationale: Die Konjunktion וּ wird als „und“ wiedergegeben; בִנּוּי wird als Personenname in der etablierten deutschen Form „Binnui“ transliteriert.
- source_word: שִׁמְעִי
  choice: Schimi
  rationale: Der Personenname שִׁמְעִי wird entsprechend deutschen Bibelkonventionen als „Schimi“ wiedergegeben. Da im Hebräischen keine Konjunktion davor steht, wird keine ergänzt.
