base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/007.yaml
  text: And they made a proclamation throughout Judah and Jerusalem to all the sons of the exile[a], that they should gather in Jerusalem.
translation:
  language: de
  text: Und man ließ in ganz Juda und Jerusalem allen Angehörigen der Exilsgemeinschaft[a] bekannt machen, dass sie sich in Jerusalem versammeln sollten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „allen Söhnen des Exils“; gemeint sind Angehörige der Exilsgemeinschaft, möglicherweise besonders die aus dem Exil Zurückgekehrten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: ließ man … bekannt machen
  rationale: Die Verbindung des Hifil von עבר mit קוֹל bezeichnet idiomatisch das Verbreiten einer öffentlichen Bekanntmachung. Die unpersönliche deutsche Form gibt das nicht näher bestimmte pluralische Subjekt natürlich wieder.
- source_word: בִּיהוּדָה וִירוּשָׁלִַם
  choice: in ganz Juda und Jerusalem
  rationale: Die Präposition bezeichnet hier das Gebiet, in dem die Bekanntmachung verbreitet wurde; „in ganz“ bringt diesen flächendeckenden Sinn idiomatisch zum Ausdruck.
- source_word: לְכֹל בְּנֵי הַגּוֹלָה
  choice: allen Angehörigen der Exilsgemeinschaft
  rationale: Wörtlich steht „allen Söhnen des Exils“. Gemeint ist die vom Exil geprägte beziehungsweise aus ihm zurückgekehrte Gemeinschaft; „Angehörige der Exilsgemeinschaft“ ist im Deutschen verständlich, präzise und schließt die angesprochene Gemeinschaft insgesamt ein.
- source_word: לְהִקָּבֵץ
  choice: dass sie sich … versammeln sollten
  rationale: Der Infinitiv mit לְ gibt den Inhalt beziehungsweise Zweck der Bekanntmachung an. Die reflexive Form entspricht dem passivisch-reflexiven Niphal und klingt im Deutschen natürlich.
- source_word: יְרוּשָׁלִָם
  choice: in Jerusalem
  rationale: Beim Verb „sich versammeln“ bezeichnet der Ortsname natürlich den Ort der Zusammenkunft.
