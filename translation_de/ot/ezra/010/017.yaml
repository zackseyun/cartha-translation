  text: And they finished with all the men who had taken foreign wives by the first day of the first month[a].
translation:
  language: de
  text: Und sie schlossen die Untersuchung aller Männer, die ausländische Frauen geheiratet hatten, bis zum ersten Tag des ersten Monats ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… am ersten Tag des ersten Monats ab.“ Der hebräische Zeitausdruck bezeichnet den Endpunkt und kann entweder mit „bis zum“ oder als Angabe des Termins verstanden werden, zu dem das Verfahren abgeschlossen war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ בַכֹּל אֲנָשִׁים
  choice: hatten sie die Untersuchung aller Männer abgeschlossen
  rationale: Das Verb כלה bezeichnet den Abschluss des zuvor beschriebenen Verfahrens. בַכֹּל אֲנָשִׁים ist im Zusammenhang auf die Gesamtheit der behandelten Männer beziehungsweise Fälle bezogen. Die Ergänzung „die Untersuchung“ macht den aus dem Kontext erschließbaren Gegenstand des Abschlusses in natürlichem Deutsch deutlich.
- source_word: הַהֹשִׁיבוּ
  choice: die … geheiratet hatten
  rationale: Die Hifil-Form bedeutet wörtlich etwa „wohnen ließen/ins Haus aufgenommen hatten“. Im Zusammenhang von Esra 10 bezeichnet sie die Aufnahme der Frauen als Ehefrauen; „geheiratet hatten“ gibt diesen idiomatischen Sinn verständlich wieder.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: ausländische Frauen
  rationale: נָכְרִיּוֹת bezeichnet Frauen fremder Herkunft beziehungsweise außerhalb der eigenen Gemeinschaft. „Ausländische Frauen“ ist im modernen Deutsch natürlich und vermeidet das missverständliche „fremde Frauen“.
- source_word: עַד יוֹם אֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: bis zum ersten Tag des ersten Monats
  rationale: עַד markiert den zeitlichen Endpunkt. „Bis zum“ bildet die hebräische Form eng ab; aufgrund des abgeschlossenen Verbs kann der Ausdruck im Deutschen auch als Fristangabe „spätestens am“ verstanden werden.
