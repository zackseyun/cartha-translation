translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt den Abschlusszeitpunkt klar heraus. Der im Kontext vorausgesetzte Verfahrensbezug wird mit „die Untersuchung“ ausdrücklich gemacht; die Fußnote bewahrt die zeitliche Nuance des Hebräischen.
