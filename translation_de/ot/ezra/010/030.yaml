  text: וּ/מִ/בְּנֵ֛י פַּחַ֥ת מוֹאָ֖ב עַדְנָ֣א וּ/כְלָ֑ל בְּנָיָ֤ה מַעֲשֵׂיָה֙ מַתַּנְיָ֣ה בְצַלְאֵ֔ל וּ/בִנּ֖וּי וּ/מְנַשֶּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/030.yaml
  text: 'And from the sons of Pahath-moab: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh.'
translation:
  language: de
  text: 'Und von den Nachkommen Pahat-Moabs: Adna, Kelal, Benaja, Maaseja, Mattanja, Bezalel, Binnui und Manasse.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Und von den Nachkommen
  rationale: Die Präposition מִן und die verbindende Konjunktion werden ausdrücklich wiedergegeben. In einer Sippenliste bezeichnet בְּנֵי nicht zwingend unmittelbare Söhne; „Nachkommen“ ist daher im modernen Deutsch natürlich und sachlich präzise.
- source_word: פַּחַת מוֹאָב
  choice: Pahat-Moab
  rationale: Der Sippenname wird nach den hebräischen Konsonanten ins Deutsche transliteriert; der Bindestrich macht die zusammengehörige Namensform sichtbar.
- source_word: עַדְנָא
  choice: Adna
  rationale: Direkte, im Deutschen gut lesbare Transliteration des Personennamens.
- source_word: וּ/כְלָל
  choice: Kelal
  rationale: כ wird im modernen deutschen Bibeldeutsch als k wiedergegeben; die vorangestellte Konjunktion braucht innerhalb der deutschen Aufzählung nicht einzeln wiederholt zu werden.
- source_word: בְּנָיָה
  choice: Benaja
  rationale: Eingebürgerte deutsche Form des hebräischen Namens, wobei das theophore Namensende יָה als „ja“ erscheint.
- source_word: מַעֲשֵׂיָה
  choice: Maaseja
  rationale: Deutsche Transliteration, die die Namensglieder erkennbar hält und das Ende יָה mit „ja“ wiedergibt.
- source_word: מַתַּנְיָה
  choice: Mattanja
  rationale: Deutsche Transliteration mit Verdopplung des durch Dagesch verstärkten t und Wiedergabe des theophoren Endes als „ja“.
- source_word: בְצַלְאֵל
  choice: Bezalel
  rationale: Im Deutschen gebräuchliche Transliteration des Personennamens.
- source_word: וּ/בִנּוּי
  choice: Binnui
  rationale: Die Transliteration bewahrt die Konsonantenverdopplung der masoretischen Punktierung; die Konjunktion wird durch die deutsche Aufzählungsstruktur abgedeckt.
- source_word: וּ/מְנַשֶּׁה
  choice: und Manasse
  rationale: Der Name wird in seiner geläufigen deutschen Form wiedergegeben; וּ erscheint passend als „und“ vor dem letzten Glied der Liste.
theological_decisions: []
translation_notes:
