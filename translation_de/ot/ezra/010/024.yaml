  language: de
  text: 'Und von den Sängern: Eljaschib; und von den Torhütern: Schallum, Telem und Uri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: und von
  rationale: Die Verbindung aus Konjunktion und Präposition führt jeweils eine weitere Gruppe in der fortlaufenden Liste ein; beim ersten Auftreten wird das einleitende „und“ im Deutschen zugunsten eines natürlichen Listenbeginns nicht eigens wiedergegeben.
- source_word: הַמְשֹׁרְרִים
  choice: den Sängern
  rationale: Das substantivierte Partizip von שׁיר bezeichnet hier die Sänger im Tempeldienst; „Sänger“ ist präzise und im Deutschen natürlich.
- source_word: אֶלְיָשִׁיב
  choice: Eljaschib
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transkribiert.
- source_word: הַשֹּׁעֲרִים
  choice: den Torhütern
  rationale: Der Ausdruck bezeichnet im Tempelkontext die mit der Bewachung beziehungsweise Betreuung der Tore Beauftragten; „Torhüter“ ist die etablierte und klare deutsche Bezeichnung.
- source_word: שַׁלֻּם
  choice: Schallum
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transkribiert.
- source_word: טֶלֶם
  choice: Telem
  rationale: Der Personenname wird in einer dem Hebräischen nahen, im Deutschen verständlichen Form wiedergegeben.
- source_word: אוּרִי
  choice: Uri
  rationale: Der Personenname wird in der üblichen deutschen Form wiedergegeben.
