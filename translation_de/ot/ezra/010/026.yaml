source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֖י עֵילָ֑ם מַתַּנְיָ֤ה זְכַרְיָה֙ וִ/יחִיאֵ֣ל וְ/עַבְדִּ֔י וִ/ירֵמ֖וֹת וְ/אֵלִיָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/026.yaml
  text: 'And from the sons of Elam: Mattaniah, Zechariah, Jehiel, Abdi, Jeremoth, and Elijah.'
translation:
  language: de
  text: 'Und von den Söhnen Elams: Mattanja, Secharja, Jehiël, Abdi, Jeremot und Elija.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Und von den Söhnen
  rationale: Die Verbindung aus Konjunktion, Präposition und Constructus Plural von בֵּן wird in dieser Namensliste transparent wiedergegeben. »Söhne« bewahrt die hebräische Listenformel und kann hier die Zugehörigkeit zur Sippe bezeichnen.
- source_word: עֵילָם
  choice: Elam
  rationale: Der Eigenname des Ahnherrn beziehungsweise der Sippe wird nach üblicher deutscher biblischer Namensform transliteriert.
- source_word: מַתַּנְיָה
  choice: Mattanja
  rationale: Gebräuchliche deutsche biblische Wiedergabe des hebräischen Personennamens.
- source_word: זְכַרְיָה
  choice: Secharja
  rationale: Gebräuchliche deutsche biblische Namensform, die den hebräischen Personennamen erkennbar wiedergibt.
- source_word: וִ/יחִיאֵל
  choice: Jehiël
  rationale: Deutsche Transliteration des Personennamens; das Trema macht deutlich, dass i und e getrennt gesprochen werden. Die vorangestellte Konjunktion wird durch die deutsche Listenstruktur wiedergegeben.
- source_word: וְ/עַבְדִּי
  choice: Abdi
  rationale: Der Ausdruck ist aufgrund von Morphologie und Listenstruktur als Personenname zu verstehen, nicht als die Wendung »mein Knecht«.
- source_word: וִ/ירֵמוֹת
  choice: Jeremot
  rationale: Die Form gibt den hebräischen Personennamen in einer gebräuchlichen deutschen Transliteration wieder.
- source_word: וְ/אֵלִיָּה
  choice: Elija
  rationale: Gebräuchliche deutsche biblische Form des hebräischen Personennamens; die Konjunktion erscheint als abschließendes »und«.
theological_decisions: []
translation_notes:
  register: Knappe, würdevolle Listenform in modernem Standarddeutsch. Die traditionelle genealogische Wendung »Söhne Elams« bleibt erhalten, ohne ausdrücklich festzulegen, ob unmittelbare Söhne oder Angehörige der Sippe gemeint sind. Keine Fußnoten erforderlich.
