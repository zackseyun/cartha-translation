  text: וַ/יַּֽעְנ֧וּ כָֽל הַ/קָּהָ֛ל וַ/יֹּאמְר֖וּ ק֣וֹל גָּד֑וֹל כֵּ֛ן כ/דברי/ך עָלֵ֖י/נוּ לַ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/012.yaml
  text: Then all the assembly answered and said with a loud voice[a], “Yes, according to your words, so it is upon us to do.”
translation:
  language: de
  text: 'Da antwortete die ganze Versammlung und sagte mit lauter Stimme: „Ja, wie du gesagt hast, so müssen wir es tun.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: antwortete
  rationale: ענה leitet hier die gemeinsame Erwiderung auf Esras Aufforderung ein; „antwortete“ ist im Deutschen die natürliche narrative Wiedergabe.
- source_word: כָל הַקָּהָל
  choice: die ganze Versammlung
  rationale: קָהָל bezeichnet die versammelte Gemeinschaft. „Die ganze Versammlung“ gibt sowohl den korporativen Sinn als auch כָל klar wieder.
- source_word: וַיֹּאמְרוּ קוֹל גָּדוֹל
  choice: mit lauter Stimme
  rationale: Wörtlich steht „sie sagten mit großer Stimme“. Im Deutschen bündelt „antwortete … mit lauter Stimme“ die koordinierte Redeeinleitung idiomatisch, ohne den Inhalt auszulassen.
- source_word: כֵּן
  choice: Ja … so
  rationale: כֵּן bekräftigt die Zustimmung und kann zugleich rückverweisend „so“ bedeuten. Die Formulierung bewahrt beide Nuancen.
- source_word: כִדְבָרֶיךָ
  choice: wie du gesagt hast
  rationale: Die wörtliche Form „nach deinen Worten“ wäre möglich, doch „wie du gesagt hast“ gibt den Bezug auf Esras vorangehende Aufforderung in natürlichem Deutsch wieder.
- source_word: עָלֵינוּ לַעֲשׂוֹת
  choice: müssen wir handeln
  rationale: Die Wendung bezeichnet eine auf den Sprechern liegende Verpflichtung. „Müssen wir handeln“ überträgt diese Verpflichtung klar und idiomatisch; „handeln“ verweist auf die geforderte Umsetzung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kollektive Singular „antwortete“ stimmt mit „die ganze Versammlung“ überein. Die etwas formelhafte Doppelung „Ja … so“ erhält die emphatische Struktur des Hebräischen, während „müssen wir handeln“ die Verpflichtung natürlich ausdrückt.
