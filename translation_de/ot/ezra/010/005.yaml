source:
  edition: WLC
  text: וַ/יָּ֣קָם עֶזְרָ֡א וַ/יַּשְׁבַּ֣ע אֶת שָׂרֵי֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם וְ/כָל יִשְׂרָאֵ֗ל לַ/עֲשׂ֛וֹת כַּ/דָּבָ֥ר הַ/זֶּ֖ה וַ/יִּשָּׁבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/005.yaml
  text: So Ezra arose and made the chief priests[a], the Levites, and all Israel swear to do according to this word, and they swore.
translation:
  language: de
  text: Da erhob sich Esra und ließ die führenden Priester, die Leviten und ganz Israel schwören, diesem Wort[a] gemäß zu handeln; und sie schworen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieser Angelegenheit“ beziehungsweise „diesem Vorschlag“. Das hebräische Wort kann sowohl eine Äußerung als auch die besprochene Sache bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Da erhob sich
  rationale: Die Form führt die Erzählung fort und bezeichnet Esras entschlossenes Aufstehen zum Handeln. „Erhob sich“ ist würdevoll, verständlich und weniger umgangssprachlich als „stand auf“.
- source_word: וַיַּשְׁבַּע
  choice: ließ ... schwören
  rationale: 'Der Hifil von שׁבע hat verursachende Bedeutung: Esra veranlasste beziehungsweise verpflichtete die Genannten zu einem Eid. Die Wendung wahrt diese Kausativität und zugleich die Wiederholung mit dem abschließenden „sie schworen“.'
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: die führenden Priester
  rationale: שָׂרֵי bezeichnet hier die maßgeblichen oder leitenden Männer unter den Priestern. „Führende Priester“ gibt ihre Stellung wieder, ohne sie mit dem später technisch geprägten Ausdruck „Hohepriester“ zu verwechseln.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Übliche und sachlich genaue deutsche Bezeichnung für die genannte kultische Gruppe.
- source_word: וְכָל יִשְׂרָאֵל
  choice: und ganz Israel
  rationale: Bewahrt den kollektiven Ausdruck Israels als Gesamtheit, statt ihn in „alle Israeliten“ aufzulösen.
- source_word: לַעֲשׂוֹת
  choice: zu handeln
  rationale: עשה bedeutet grundsätzlich „tun“. In Verbindung mit „diesem Wort gemäß“ ist „handeln“ im Deutschen natürlicher und drückt die geforderte Umsetzung aus.
- source_word: כַּדָּבָר הַזֶּה
  choice: diesem Wort gemäß
  rationale: Die Formulierung bleibt eng am hebräischen דָּבָר und lässt dessen Bezug auf die vorausgegangene Äußerung erkennen. Eine Fußnote bewahrt die ebenfalls möglichen Bedeutungen „Angelegenheit“ und „Vorschlag“.
- source_word: וַיִּשָּׁבֵעוּ
  choice: und sie schworen
  rationale: Der Nifal bezeichnet die tatsächliche Eidesleistung. Die knappe Wiederholung entspricht dem Hebräischen und erhält den feierlichen Nachdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzbewegung. Das wiederholte „schwören“ wurde bewusst beibehalten. Der Fußnotenmarker steht bei „Wort“, da sich die erläuterte Mehrdeutigkeit auf דָּבָר bezieht.
