source:
  edition: WLC
  text: וַ/יָּ֣קָם עֶזְרָ֗א מִ/לִּ/פְנֵי֙ בֵּ֣ית הָֽ/אֱלֹהִ֔ים וַ/יֵּ֕לֶךְ אֶל לִשְׁכַּ֖ת יְהוֹחָנָ֣ן בֶּן אֶלְיָשִׁ֑יב וַ/יֵּ֣לֶךְ שָׁ֗ם לֶ֤חֶם לֹֽא אָכַל֙ וּ/מַ֣יִם לֹֽא שָׁתָ֔ה כִּ֥י מִתְאַבֵּ֖ל עַל מַ֥עַל הַ/גּוֹלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/006.yaml
  text: Then Ezra rose from before the house of God and went to the chamber of Jehohanan son of Eliashib[a]. He went there and ate no bread and drank no water[c][b], because he was mourning over the unfaithfulness of the exiles.
translation:
  language: de
  text: Da erhob sich Esra von seinem Platz vor dem Haus Gottes und ging in die Kammer Jehohanans[a], des Sohnes Eljaschibs. Er ging dorthin und aß kein Brot und trank kein Wasser, denn er trauerte über die Untreue der Exilgemeinde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Johanan“.'
    reason: lexical_alternative
  - marker: b
    text: Die „Exilgemeinde“ bezeichnet hier die Gemeinschaft der aus der Verbannung Zurückgekehrten.
    reason: cultural_note
lexical_decisions:
- source_word: מִלִּפְנֵי בֵּית הָאֱלֹהִים
  choice: vor dem Haus Gottes
  rationale: Die räumliche Wendung wird nah am Hebräischen wiedergegeben. „Haus Gottes“ bewahrt die konkrete Quellformulierung und ist im Zusammenhang als Tempel verständlich.
- source_word: לִשְׁכַּת
  choice: Kammer
  rationale: Das Wort bezeichnet einen Raum in einem Tempel- oder Amtskomplex; „Kammer“ passt zum architektonischen Zusammenhang und wahrt den feierlichen Erzählton.
- source_word: יְהוֹחָנָן בֶּן אֶלְיָשִׁיב
  choice: Jehohanan, des Sohnes Eljaschibs
  rationale: „Jehohanan“ bildet die längere hebräische Namensform ab; die deutsche Genitiv-Apposition gibt die Abstammungsangabe natürlich wieder.
- source_word: וַיֵּלֶךְ שָׁם
  choice: Er ging dorthin
  rationale: Die auffällige Wiederholung des Verbs „gehen“ bleibt erhalten, ohne sie deutend als „blieb“ oder „trat ein“ aufzulösen.
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  choice: aß kein Brot und trank kein Wasser
  rationale: Die konkreten Objekte „Brot“ und „Wasser“ werden beibehalten und vermitteln zusammen den vollständigen Verzicht auf Nahrung und Trank.
- source_word: מִתְאַבֵּל
  choice: trauerte
  rationale: Das Verb bezeichnet ein anhaltendes Trauern, das hier sichtbar mit Fasten verbunden ist.
- source_word: מַעַל
  choice: Untreue
  rationale: „Untreue“ erfasst den Treuebruch mit seiner moralischen und gemeinschaftlich-religiösen Schwere, ohne ihn auf eine bloß juristische Kategorie zu verengen.
- source_word: הַגּוֹלָה
  choice: die aus der Verbannung Zurückgekehrten
  rationale: Im Esrabuch bezeichnet der Ausdruck die Gemeinschaft der früher Verbannten nach ihrer Rückkehr. Die explizite Wiedergabe verhindert das Missverständnis, sie befänden sich noch im Exil.
theological_decisions:
- issue: Wiedergabe von מַעַל als Bezeichnung eines schweren Treuebruchs
  choice: Untreue
  alternative: Treuebruch; Verfehlung
  rationale: „Untreue“ bewahrt das Gewicht eines gemeinschaftlichen und auf Gott bezogenen Treuebruchs, ohne eine bestimmte systematisch-theologische Deutung festzuschreiben.
- issue: Wiedergabe von בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  alternative: Tempel Gottes
  rationale: Die quellennahe Formulierung bleibt verständlich und lässt die konkrete hebräische Bezeichnung stehen, statt sie durch die funktionale Benennung „Tempel“ zu ersetzen.
- issue: Referenz von הַגּוֹלָה
  choice: die aus der Verbannung Zurückgekehrten
  alternative: die Exilsgemeinschaft; die Verbannten
  rationale: Gemeint ist im Kontext die nachexilische Rückkehrergemeinschaft. Diese Wiedergabe macht den historischen Bezug klar, ohne die Schuld einzelnen Personen zuzuschreiben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Wiederholung von „gehen“ sowie die konkreten Ausdrücke „Haus Gottes“, „Brot“ und „Wasser“ bleiben bewusst erhalten. Alle Fußnotenmarker stehen unmittelbar an der jeweils erläuterten Textstelle.
