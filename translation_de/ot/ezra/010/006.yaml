review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Handlung, Fasten und Grund des Trauerns grundsätzlich zuverlässig wieder. „Stand Esra vor dem Haus Gottes auf“ ist jedoch im Deutschen syntaktisch missverständlich und lässt das in מִלִּפְנֵי ausgedrückte Weggehen von der Position vor dem Gotteshaus weniger klar erkennen. Die Bezeichnung הַגּוֹלָה meint kollektiv die Exil- bzw. Rückkehrergemeinschaft; „Exilgemeinde“ ist quellenäher als eine rein partizipiale Umschreibung und bleibt kontextuell verständlich.
  naturalness: Die Überarbeitung verwendet modernes Standarddeutsch mit würdig-narrativem Register. „Erhob sich von seinem Platz vor dem Haus Gottes“ ist idiomatisch und macht die räumliche Ausgangsposition klar. „Kammer Jehohanans“ bleibt für einen Raum innerhalb eines Tempel- oder Amtskomplexes angemessen.
  terminology: „Haus Gottes“, „Kammer“, „Brot“, „Wasser“ und „Untreue“ bewahren die konkreten bzw. gewichtigen Ausdrücke des Hebräischen. „Exilgemeinde“ gibt הַגּוֹלָה als Kollektiv wieder, ohne fälschlich nur noch im Exil befindliche Einzelpersonen zu bezeichnen. Die Namensform „Jehohanan“ ist als nahe Umschrift vertretbar; „Johanan“ wird als Alternative erläutert.
  issues:
  - severity: medium
    issue: Die Formulierung „stand Esra vor dem Haus Gottes auf“ ist mehrdeutig.
    rationale: Sie kann bloß besagen, dass Esra sich, während er vor dem Haus stand, erhob. Der hebräische Ausdruck bezeichnet das Aufstehen bzw. Weggehen von der Position vor dem Haus Gottes. Eine idiomatische Ergänzung von „von seinem Platz“ verdeutlicht dies ohne inhaltliche Erweiterung.
  - severity: low
    issue: Die Fußnote bezeichnet הַגּוֹלָה als wörtlich „der Weggeführten“.
    rationale: Das Wort fungiert hier als kollektive Bezeichnung der Exil-/Rückkehrergemeinschaft, nicht einfach als transparente Pluralform. Die Fußnote sollte diese kollektive Funktion direkt erklären.
