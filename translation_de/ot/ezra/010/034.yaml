  text: מִ/בְּנֵ֣י בָנִ֔י מַעֲדַ֥י עַמְרָ֖ם וְ/אוּאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/034.yaml
  text: 'From the sons of Bani: Maadai, Amram, and Uel.'
translation:
  language: de
  text: 'Von den Söhnen Banis: Maadai, Amram und Uël.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Von den Nachkommen
  rationale: Die Verbindung aus מִן und בְּנֵי bezeichnet hier Angehörige einer Familiengruppe. „Von den Nachkommen“ gibt den partitiven Sinn in einer deutschen Namensliste natürlich wieder.
- source_word: בָנִי
  choice: Banis
  rationale: Der Personenname wird in der im Deutschen üblichen Form „Bani“ wiedergegeben; der Genitiv wird durch die Endung -s markiert.
- source_word: מַעֲדַי
  choice: Maadai
  rationale: Der hebräische Personenname wird möglichst lautnah und ohne Übersetzung wiedergegeben.
- source_word: עַמְרָם
  choice: Amram
  rationale: Für den Personenname wird die etablierte deutsche Schreibweise verwendet.
- source_word: וְאוּאֵל
  choice: und Uël
  rationale: וְ wird mit „und“ wiedergegeben. Die Trema-Schreibung „Uël“ macht deutlich, dass u und e getrennt gesprochen werden, und bildet den hebräischen Namen verständlich ab.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Listendeutsch. „Nachkommen“ ist im modernen Deutschen natürlicher und sachlich treffender als das hier missverständliche „Söhne“, da בְּנֵי eine Familienzugehörigkeit bezeichnen kann.
