base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/029.yaml
  text: 'And from the sons of Bani: Meshullam[a], Malluk, Adaiah, Jashub, Sheal[b], and Jeremoth.'
translation:
  language: de
  text: 'Und von den Söhnen Banis: Meschullam, Malluch[a], Adaja, Jaschub, Scheal und Jeremot.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name wird auch Malluk geschrieben.
    reason: lexical_alternative
  - marker: b
    text: Die Konsonantenschreibung des Namens ist hier nicht vokalisiert und kann auch als Ramot wiedergegeben werden.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי בָּנִי
  choice: Und von den Söhnen Banis
  rationale: Die Verbindung aus Konjunktion, Präposition und Constructus-Plural wird in der Listenform formal und zugleich natürlich wiedergegeben. „Söhne“ bewahrt die genealogische Ausdrucksweise; der deutsche Genitiv „Banis“ vermeidet eine schwerfällige Konstruktion.
- source_word: מְשֻׁלָּם
  choice: Meschullam
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: מַלּוּךְ
  choice: Malluch
  rationale: Die Schreibung gibt den auslautenden hebräischen Reibelaut in einer im Deutschen vertrauten Form wieder; „Malluk“ ist als engere Umschrift ebenfalls möglich.
- source_word: וַ/עֲדָיָה
  choice: Adaja
  rationale: Gebräuchliche deutsche Namensform; die vorangestellte Konjunktion wird der natürlichen deutschen Aufzählung entsprechend nicht eigens vor diesem Namen wiederholt.
- source_word: יָשׁוּב
  choice: Jaschub
  rationale: Die deutsche Umschrift bildet die masoretische Vokalisierung und den sch-Laut verständlich ab.
- source_word: וּ/שְׁאָל
  choice: Scheal
  rationale: Die Namensform folgt der masoretischen Vokalisierung; die Konjunktion wird in der deutschen Aufzählung erst vor dem letzten Glied gesetzt.
- source_word: ירמות
  choice: Jeremot
  rationale: Die Konsonantenfolge wird im Zusammenhang dieser Namensliste traditionell als Jeremot verstanden. Da die vorgelegte WLC-Form hier keine Vokalzeichen zeigt, bleibt eine gewisse Unsicherheit der Namensform bestehen und wird in einer Fußnote kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Listendeutsch. Die Eigennamen folgen geläufigen deutschen Umschriftkonventionen. Die wiederholten hebräischen Konjunktionen werden zu einer natürlichen deutschen Aufzählung zusammengezogen, ohne ein Listenglied auszulassen.
