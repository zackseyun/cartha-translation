base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/015.yaml
  text: Only Jonathan son of Asahel and Jahzeiah son of Tikvah stood against this[b][a], and Meshullam and Shabbethai the Levite supported them.
translation:
  language: de
  text: Nur Jonatan, der Sohn Asaëls, und Jachseja[a], der Sohn Tikwas, stellten sich dieser Sache entgegen[b]; Meschullam und der Levit Schabbethai unterstützten sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Jahasja«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »waren mit dieser Angelegenheit befasst«.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אַךְ
  choice: Nur
  rationale: Die Partikel schränkt die zuvor genannte Zustimmung ein und führt die Ausnahmen an.
- source_word: יוֹנָתָן בֶּן עֲשָׂהאֵל
  choice: Jonatan, der Sohn Asaëls
  rationale: Die Namen folgen geläufigen deutschen Bibelschreibungen; die Abstammungsangabe wird in natürlichem Deutsch wiedergegeben.
- source_word: יַחְזְיָה בֶן תִּקְוָה
  choice: Jachseja, der Sohn Tikwas
  rationale: Die Form gibt die masoretische Vokalisierung des Namens angemessen wieder; eine traditionelle alternative Namensform wird in der Fußnote genannt.
- source_word: עָמְדוּ עַל זֹאת
  choice: stellten sich dagegen
  rationale: Im Zusammenhang bezeichnet die Wendung am ehesten eine ablehnende Haltung gegenüber dem zuvor beschlossenen Vorgehen. Die bildhafte Bedeutung von עמד, »sich hinstellen«, bleibt dabei erhalten; die mögliche alternative Deutung wird in einer Fußnote offengehalten.
- source_word: וּמְשֻׁלָּם וְשַׁבְּתַי הַלֵּוִי
  choice: Meschullam und der Levit Schabbethai
  rationale: Die hebräische Wortstellung legt nahe, dass die Bezeichnung »der Levit« allein Schabbethai näher bestimmt.
- source_word: עֲזָרֻם
  choice: unterstützten sie
  rationale: Das Verb עזר mit dem Suffix der 3. Person Plural bedeutet »ihnen helfen«; im Zusammenhang ist die Unterstützung ihrer Haltung gemeint.
theological_decisions:
- issue: Rolle der genannten Männer
  choice: Sie widersetzten sich dem beschlossenen Vorgehen, und zwei weitere Männer unterstützten sie.
  alternative: Sie waren für die Durchführung der Sache zuständig, und zwei weitere Männer halfen ihnen.
  rationale: Die Verbindung עמד על kann je nach Kontext Widerstand oder das Befasstsein mit einer Angelegenheit ausdrücken. Der unmittelbare Zusammenhang und das folgende עזרם sprechen eher für gemeinsamen Widerstand, doch die andere Deutung bleibt sprachlich möglich und wird deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe hebräische Aussage wird klar gegliedert, ohne die mögliche alternative Deutung der umstrittenen Wendung עמדו על זאת zu verschweigen.
