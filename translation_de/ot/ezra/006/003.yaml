base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/003.yaml
  text: 'In the first year of King Cyrus[a], Cyrus the king issued a decree: Concerning the house of God in Jerusalem, let the house be rebuilt, the place where they offer sacrifices, and let its foundations be laid. Its height shall be sixty cubits, and its width sixty cubits,'
translation:
  language: de
  text: 'Im ersten Regierungsjahr von König Kyrus erließ König Kyrus folgenden Erlass: Das Haus Gottes in Jerusalem, der Ort, an dem man Opfer darbringt, soll gebaut und seine Fundamente sollen gelegt werden.[a] Es soll sechzig Ellen hoch und sechzig Ellen breit sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „seine Fundamente sollen erhalten bleiben“ beziehungsweise „hochgeführt werden“. Die aramäische Wendung ist schwer zu deuten; die Übersetzungen gehen auseinander.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת חֲדָה לְכוֹרֶשׁ מַלְכָּא
  choice: Im ersten Regierungsjahr von König Kyrus
  rationale: „Regierungsjahr“ verdeutlicht den in der aramäischen Datierungsformel gemeinten Herrschaftszeitraum, ohne zusätzliche historische Angaben einzutragen.
- source_word: שָׂם טְעֵם
  choice: erließ … folgende Anordnung
  rationale: Die aramäische Verwaltungsformel bezeichnet das Erlassen einer amtlichen Verfügung. „Anordnung“ gibt den offiziellen Charakter in natürlichem modernem Deutsch wieder.
- source_word: בֵּית אֱלָהָא
  choice: das Haus Gottes
  rationale: Die wörtliche Wiedergabe bewahrt die Wiederholung von „Haus“ im Ausgangstext; gemeint ist der Tempel.
- source_word: יִתְבְּנֵא
  choice: soll wieder aufgebaut werden
  rationale: Die Verbform hat im Erlass verpflichtenden Sinn. Das Verb bedeutet an sich „gebaut werden“; „wieder“ ergibt sich aus dem geschichtlichen Zusammenhang des zerstörten Tempels.
- source_word: אֲתַר דִּי דָבְחִין דִּבְחִין
  choice: der Ort, an dem man Opfer darbringt
  rationale: Die aramäische Verbindung aus stammverwandtem Verb und Substantiv wird idiomatisch wiedergegeben, wobei die Bestimmung des Hauses als Opferstätte erhalten bleibt.
- source_word: וְאֻשּׁוֹהִי מְסוֹבְלִין
  choice: seine Fundamente sollen gelegt werden
  rationale: Die schwierige Wendung wird entsprechend dem Bauzusammenhang verstanden. Die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: רוּמֵהּ … פְּתָיֵהּ
  choice: sechzig Ellen hoch und sechzig Ellen breit
  rationale: Die beiden Maßangaben werden in natürlicher deutscher Architektursprache wiedergegeben; die historische Maßeinheit „Elle“ bleibt erhalten.
