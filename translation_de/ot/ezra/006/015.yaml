  text: And this house was finished by the third day of the month Adar[b][a], which was the sixth year of the reign of King Darius.
translation:
  language: de
  text: Und dieses Haus[a] wurde bis zum dritten Tag des Monats Adar[b] fertiggestellt, im sechsten Regierungsjahr des Königs Darius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieser Tempel“. Im Aramäischen steht wörtlich „dieses Haus“, eine in Esra häufige Bezeichnung für den Tempel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am dritten Tag des Monats Adar“. Die Wendung kann als genaues Datum der Fertigstellung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁיצִיא
  choice: wurde … fertiggestellt
  rationale: Die aramäische Verbform bezeichnet hier den Abschluss des Bauwerks. Die passive Wiedergabe erhält den Fokus auf dem Tempel und entspricht natürlichem modernem Deutsch.
- source_word: בַּיְתָה דְנָה
  choice: dieses Haus
  rationale: Wörtlich steht „dieses Haus“. In Esra bezeichnet „Haus“ häufig den Tempel; die Wiedergabe bewahrt die Ausdrucksweise des Ausgangstextes.
- source_word: עַד יוֹם תְּלָתָה
  choice: bis zum dritten Tag
  rationale: עַד bezeichnet zunächst den zeitlichen Endpunkt, bis zu dem der Bau zum Abschluss kam. Die mögliche punktuelle Datumsangabe „am dritten Tag“ bleibt in einer Fußnote erhalten.
- source_word: לִירַח אֲדָר
  choice: des Monats Adar
  rationale: Dies gibt die aramäische Datumsformel direkt und idiomatisch wieder.
- source_word: דִּי הִיא שְׁנַת שֵׁת
  choice: das war im sechsten … Jahr
  rationale: Die Relativkonstruktion ordnet das genannte Datum dem sechsten Regierungsjahr zu; die deutsche Fassung ist klar und natürlich.
- source_word: לְמַלְכוּת
  choice: Regierungsjahr
  rationale: In der chronologischen Formel bezeichnet das Wort die Herrschaft beziehungsweise Regierungszeit eines Königs.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: des Königs Darius
  rationale: Die Formulierung bewahrt den ausdrücklich genannten Königstitel und entspricht natürlichem deutschen Sprachgebrauch.
