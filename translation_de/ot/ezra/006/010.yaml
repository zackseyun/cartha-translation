base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/010.yaml
  text: so that they may offer pleasing aromas to the God of heaven and pray for the life of the king and his sons[a][b].
translation:
  language: de
  text: damit sie dem Gott des Himmels wohlgefällige Opferdüfte[a] darbringen und für das Leben des Königs und seiner Söhne[b] beten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »liebliche Düfte« oder »beruhigende Düfte«. Der aramäische Ausdruck meint den angenehmen Duft von Opfern, die wohlgefällig angenommen werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß auch: »für das Wohlergehen des Königs und seiner Söhne«. Wörtlich: »für das Leben des Königs und seiner Söhne«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי
  choice: damit
  rationale: Die aramäische Partikel leitet hier den Zweck der zuvor angeordneten königlichen Versorgung ein.
- source_word: לֶהֱוֺן מְהַקְרְבִין
  choice: sie … darbringen
  rationale: Die Verbindung aus Verbform und Partizip hat im Zwecksatz modalen Sinn; „darbringen“ gibt den kultischen Gebrauch von קרב natürlich wieder.
- source_word: נִיחוֹחִין
  choice: wohlgefällige Opferdüfte
  rationale: Der Ausdruck bezeichnet den angenehmen beziehungsweise beruhigenden Duft angenommener Opfer. „Opferdüfte“ wahrt das kultische Bild und macht dessen Bezug im Deutschen deutlich.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: dem Gott des Himmels
  rationale: Der Dativ ist bei „darbringen“ idiomatisch und bewahrt den in Esra gebräuchlichen Gottesnamen.
- source_word: וּמְצַלַּיִן
  choice: und … beten
  rationale: Die koordinierte Partizipialform bezeichnet das Beten als weiteren Zweck.
- source_word: לְחַיֵּי
  choice: für das Leben
  rationale: Dies entspricht der wörtlichen Bedeutung und lässt zugleich den möglichen Sinn von Wohlergehen oder Erhaltung offen.
- source_word: מַלְכָּא
  choice: des Königs
  rationale: „König“ entspricht dem gewöhnlichen aramäischen Titel, auch wenn hier der persische Großkönig gemeint ist.
- source_word: וּבְנוֹהִי
  choice: und seiner Söhne
  rationale: Der aramäische Ausdruck bezeichnet ausdrücklich die Söhne und wird nicht zu „Kinder“ verallgemeinert.
theological_decisions:
- issue: Kultischer Ausdruck נִיחוֹחִין im königlich-persischen Erlass
  choice: wohlgefällige Opferdüfte
  alternative: liebliche Düfte; beruhigende Düfte; wohlgefällige Opfer
  rationale: Die Wiedergabe erhält das Bild des Opferdufts, ohne den Ausdruck auf „Opfer“ zu verkürzen oder eine spätere theologische Deutung einzutragen.
- issue: Bitte für חַיֵּי des Königs und seiner Söhne
  choice: für das Leben
  alternative: für das Wohlergehen
  rationale: Die wörtliche Wiedergabe bewahrt die Spannung zwischen Lebensbewahrung und allgemeinem Wohlergehen; die idiomatische Alternative wird in der Fußnote genannt.
- issue: Geschlechtsspezifische Bezeichnung der königlichen Nachkommen
  choice: seiner Söhne
  alternative: seiner Kinder
  rationale: Die maskuline Pluralform wird quellengenau wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz behält den Charakter eines Zwecksatzes im königlichen Erlass. „Wohlgefällige Opferdüfte“ ist verständlicher als das isolierte „Düfte“ und wahrt zugleich die konkrete kultische Bildsprache.
