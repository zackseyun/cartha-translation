  source_fidelity: 'Die Grundstruktur ist zutreffend: Der Pluralimperativ untersagt Eingriffe in die Bauarbeiten, und anschließend werden Statthalter und Älteste zum Bau des Gotteshauses autorisiert. »an seiner ursprünglichen Stätte« fügt jedoch gegenüber עַל אַתְרֵהּ („an seiner Stelle/Stätte“) die zeitliche Bestimmung „ursprünglich“ hinzu. Die Fußnote enthält zudem einen Numerusfehler: Als Alternative zu »der Juden« muss es »der Judäer« heißen.'
  naturalness: Die Fassung ist insgesamt gut verständlich und angemessen. »Lasst die Arbeiten … ungestört weitergehen« ist idiomatisch, aber »weitergehen« expliziert den Fortgang stärker als der aramäische Text. »in Ruhe« gibt die Aufforderung zum Nichteingreifen knapp und natürlich wieder.
  terminology: »Haus Gottes«, »Statthalter« und »Älteste« sind sachgerecht. »Juden« ist als moderne Standardbezeichnung möglich; die Fußnote soll die ethnisch-regionale Alternative korrekt im Plural nennen. »wieder aufbauen« ist im Wiederherstellungskontext vertretbar, obwohl das Verb selbst allgemein „bauen“ lautet.
