- from: Lasst die Arbeiten an diesem Haus Gottes ungestört weitergehen.[a] Der Statthalter der Juden und die Ältesten der Juden sollen dieses Haus Gottes an seiner ursprünglichen Stätte wieder aufbauen.
  to: Lasst die Arbeiten an diesem Haus Gottes in Ruhe.[a] Der Statthalter der Juden und die Ältesten der Juden sollen dieses Haus Gottes an seiner Stätte wieder aufbauen.
  rationale: Die Revision entfernt die nicht ausdrücklich belegte zeitliche Präzisierung »ursprünglichen«, gibt den Imperativ als Aufforderung zum Nichteingreifen unmittelbarer wieder und berichtigt den Plural in der lexikalischen Fußnote. Die historischen Amts- und Gemeinschaftsbezeichnungen sowie der Wiederaufbaukontext bleiben erhalten.
