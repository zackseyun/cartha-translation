base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/007.yaml
  text: Leave the work on this house of God alone[a]; let the governor of the Jews and the elders of the Jews rebuild this house of God on its site.
translation:
  language: de
  text: Lasst die Arbeiten an diesem Haus Gottes in Ruhe.[a] Der Statthalter der Juden und die Ältesten der Juden sollen dieses Haus Gottes an seiner Stätte wieder aufbauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Judäer« statt »der Juden«. Der aramäische Ausdruck kann die Bevölkerung Judas sowohl ethnisch als auch regional bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻקוּ לַעֲבִידַת
  choice: Lasst die Arbeiten … ungestört weitergehen
  rationale: Der pluralische Imperativ von שבק fordert hier dazu auf, von jeder Einmischung abzusehen. Die deutsche Formulierung gibt diese untersagende beziehungsweise gewährende Kraft natürlich wieder.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: dieses Haus Gottes
  rationale: דֵךְ verweist auf das konkret behandelte Heiligtum; »dieses Haus Gottes« wahrt den deiktischen Bezug.
- source_word: פַּחַת
  choice: Statthalter
  rationale: פַּחַת bezeichnet einen persischen Provinzbeamten beziehungsweise Gouverneur. »Statthalter« ist im historischen Kontext präzise und allgemein verständlich.
- source_word: יְהוּדָיֵא
  choice: Juden
  rationale: Der aramäische Ausdruck kann die Juden beziehungsweise Judäer ethnisch oder regional bezeichnen. »Juden« ist im Deutschen geläufig; die mögliche Alternative wird in der Fußnote offengelegt.
- source_word: וּלְשָׂבֵי יְהוּדָיֵא
  choice: und die Ältesten der Juden
  rationale: שָׂבֵי bezeichnet die Ältesten als gemeinschaftliche Führungspersonen.
- source_word: יִבְנוֹן
  choice: sollen … wieder aufbauen
  rationale: Das Imperfekt hat im Erlass auffordernden beziehungsweise anordnenden Sinn. »Wieder aufbauen« verdeutlicht sachgerecht die Wiederherstellung des Tempels.
- source_word: עַל אַתְרֵהּ
  choice: an seiner ursprünglichen Stätte
  rationale: אַתַר bedeutet Ort oder Stätte. Der possessive Rückbezug und der Wiederaufbaukontext weisen auf den bisherigen beziehungsweise ursprünglichen Standort.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Ungestört weitergehen lassen« vermittelt das angeordnete Nichteingreifen idiomatisch; »Statthalter« und »Älteste« bewahren den historischen Verwaltungsrahmen.
