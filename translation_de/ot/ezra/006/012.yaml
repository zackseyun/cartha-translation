  to: Und der Gott, der seinen Namen dort wohnen ließ,[a] stürze alle Könige und Völker, die ihre Hand ausstrecken, um eine Änderung vorzunehmen[b] und dieses Haus Gottes in Jerusalem zu zerstören. Ich, Darius, habe diesen Befehl erlassen. Er soll unverzüglich ausgeführt werden.[c]
