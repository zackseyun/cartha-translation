  text: וֵֽ/אלָהָ֞/א דִּ֣י שַׁכִּ֧ן שְׁמֵ֣/הּ תַּמָּ֗ה יְמַגַּ֞ר כָּל מֶ֤לֶךְ וְ/עַם֙ דִּ֣י יִשְׁלַ֣ח יְדֵ֗/הּ לְ/הַשְׁנָיָ֛ה לְ/חַבָּלָ֛ה בֵּית אֱלָהָ֥/א דֵ֖ךְ דִּ֣י בִ/ירוּשְׁלֶ֑ם אֲנָ֤ה דָרְיָ֨וֶשׁ֙ שָׂ֣מֶת טְעֵ֔ם אָסְפַּ֖רְנָא יִתְעֲבִֽד־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/012.yaml
  text: And may the God who has caused his name to dwell there overthrow any king or people who stretches out his hand to alter this[a], to destroy this house of God that is in Jerusalem. I, Darius, have issued a decree[b]; let it be done with all diligence.
translation:
  language: de
  text: Und der Gott, der seinen Namen dort wohnen ließ,[a] stürze alle Könige und Völker, die ihre Hand ausstrecken, um eine Änderung vorzunehmen[b] und dieses Haus Gottes in Jerusalem zu zerstören. Ich, Darius, habe diesen Befehl erlassen. Er soll unverzüglich ausgeführt werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das biblische Idiom bezeichnet den Tempel als den Ort, den Gott mit seinem Namen verbunden hat.
    reason: lexical_alternative
  - marker: b
    text: Das Bezugsobjekt von „eine Änderung vorzunehmen“ wird im Aramäischen nicht näher bezeichnet; gemeint sein kann die getroffene Anordnung oder das Haus Gottes.
    reason: source_ambiguity
  - marker: c
    text: 'Oder: „mit aller Sorgfalt“. Das aramäische Adverb kann sowohl die unverzügliche als auch die gewissenhafte Ausführung betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁכִּן שְׁמֵהּ תַּמָּה
  choice: der seinen Namen dort wohnen ließ
  rationale: Die Formulierung bewahrt das aramäische Tempelidiom, nach dem Gott seinen Namen an einem Ort wohnen lässt, ohne daraus eine räumliche Begrenzung Gottes abzuleiten.
- source_word: יְמַגַּר
  choice: stürze
  rationale: Das Verb bezeichnet hier das Niederwerfen oder Stürzen im Rahmen einer königlichen Fluchformel.
- source_word: כָּל מֶלֶךְ וְעַם
  choice: alle Könige und Völker
  rationale: 'Der Plural ist im Deutschen die natürlichste Form, um den distributiven Sinn auszudrücken: Jeder König und jedes Volk, die so handeln, sind gemeint.'
- source_word: יִשְׁלַח יְדֵהּ
  choice: ihre Hand ausstrecken
  rationale: Die semitische Metapher für ein feindliches Eingreifen bleibt erhalten und ist im Deutschen verständlich.
- source_word: לְהַשְׁנָיָה
  choice: daran etwas zu ändern
  rationale: Das Verb bedeutet ändern oder abändern; das nicht ausdrücklich genannte Bezugsobjekt wird mit dem offenen Pronomen „daran“ wiedergegeben.
- source_word: לְחַבָּלָה בֵּית אֱלָהָא דֵךְ
  choice: dieses Haus Gottes … zu zerstören
  rationale: Die Formulierung gibt die schwere Schädigung bis hin zur Zerstörung des konkret bezeichneten Tempels wieder.
- source_word: שָׂמֶת טְעֵם
  choice: habe diesen Befehl erlassen
  rationale: Die Wendung ist eine amtliche Formel für den Erlass eines verbindlichen königlichen Befehls.
- source_word: אָסְפַּרְנָא יִתְעֲבִד
  choice: Er soll unverzüglich ausgeführt werden
  rationale: Die passive Befehlsform und der Nachdruck auf rascher, gewissenhafter Ausführung werden in idiomatischem Verwaltungsdeutsch wiedergegeben.
theological_decisions:
- issue: Die Namenstheologie des Tempels
  choice: Das Bild, dass Gott seinen Namen dort wohnen ließ, wird beibehalten.
  alternative: „der dort wohnt“ oder „der den Tempel zu seinem Eigentum gemacht hat“
  rationale: Der Text identifiziert den Tempel als den mit Gottes Namen verbundenen Ort, ohne schlicht zu behaupten, Gott selbst sei räumlich auf ihn beschränkt.
- issue: Bezugsobjekt von לְהַשְׁנָיָה („ändern“)
  choice: Die offene Formulierung „daran etwas zu ändern“ wird verwendet und die Mehrdeutigkeit in einer Fußnote benannt.
  alternative: Eindeutige Festlegung auf eine Änderung des Erlasses oder einen Umbau des Tempels
  rationale: Das aramäische Verb nennt sein Objekt nicht ausdrücklich; eine dogmatische oder sachliche Festlegung wäre stärker als der Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die amtliche Schlussformel bleibt knapp und verbindlich; die alte Fluchformel wird verständlich wiedergegeben, ohne ihre Bildsprache unnötig zu glätten.
