revisions:
- from: Die Ältesten der Juden bauten weiter, und ihre Arbeit ging gut voran[a] durch die prophetische Botschaft des Propheten Haggai und Sacharjas, des Sohnes Iddos. So bauten sie weiter und vollendeten den Bau aufgrund des Erlasses[b] des Gottes Israels und aufgrund des Erlasses von Kyrus, Darius und Artaxerxes, dem König von Persien.[c]
  to: Die Ältesten der Juden bauten, und ihre Arbeit ging gut voran[a] durch die prophetische Botschaft des Propheten Haggai und Sacharjas, des Sohnes Iddos. Sie bauten und vollendeten ihn auf Befehl[b] des Gottes Israels und auf Befehl von Kyrus, Darius und Artaxerxes, dem König von Persien.[c]
  rationale: Die Fassung entfernt nicht markierte Zusätze, wahrt die fortlaufende Bautätigkeit sowie die anschließende Vollendung und gibt die doppelte, Gottes Befehl zuerst nennende Autorisierung ohne weitergehende theologische Deutung wieder. Das Pronomen „ihn“ bezieht sich kontextuell auf den Tempelbau und ermöglicht im Deutschen eine vollständige, natürliche Wiedergabe von „vollendeten“.
