source:
  edition: WLC
  text: וְ/שָׂבֵ֤י יְהוּדָיֵ/א֙ בָּנַ֣יִן וּ/מַצְלְחִ֔ין בִּ/נְבוּאַת֙ חַגַּ֣י נביא/ה וּ/זְכַרְיָ֖ה בַּר עִדּ֑וֹא וּ/בְנ֣וֹ וְ/שַׁכְלִ֗לוּ מִן טַ֨עַם֙ אֱלָ֣הּ יִשְׂרָאֵ֔ל וּ/מִ/טְּעֵם֙ כּ֣וֹרֶשׁ וְ/דָרְיָ֔וֶשׁ וְ/אַרְתַּחְשַׁ֖שְׂתְּא מֶ֥לֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/014.yaml
  text: And the elders of the Jews were building and prospering through the prophecy of Haggai the prophet and Zechariah son of Iddo[c][b][a]. They finished building by the decree of the God of Israel and by the decree of Cyrus and Darius and Artaxerxes king of Persia.
translation:
  language: de
  text: Die Ältesten der Juden bauten, und ihre Arbeit ging gut voran[a] durch die prophetische Botschaft des Propheten Haggai und Sacharjas, des Sohnes Iddos. Sie bauten und vollendeten ihn auf Befehl[b] des Gottes Israels und auf Befehl von Kyrus, Darius und Artaxerxes, dem König von Persien.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und sie hatten Erfolg«; auch möglich: »und sie kamen gut voran«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »aufgrund des Erlasses« beziehungsweise »nach der Anordnung«.'
    reason: lexical_alternative
  - marker: c
    text: Der Vers führt die Vollendung sowohl auf den Befehl Gottes als auch auf die Befehle persischer Herrscher zurück und nennt Gottes Befehl zuerst.
    reason: theological_tension
lexical_decisions:
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: die Ältesten der Juden
  rationale: Bezeichnet die führenden Männer beziehungsweise Gemeindeleiter der jüdischen Gemeinschaft und bewahrt sowohl ihre gesellschaftliche Rolle als auch die ethnische Bezeichnung.
- source_word: בָּנַיִן
  choice: bauten weiter
  rationale: Das Partizip drückt eine fortdauernde Handlung aus. „Weiter“ ergibt sich natürlich aus dem Zusammenhang, ohne das Verb ausdrücklich als „wiederaufbauen“ festzulegen.
- source_word: וּמַצְלְחִין
  choice: ihre Arbeit ging gut voran
  rationale: Die Form bezeichnet Erfolg beziehungsweise gutes Vorankommen. Die deutsche Wendung ist natürlich und passt unmittelbar zur Bautätigkeit, ohne eine rein wirtschaftliche Bedeutung von „gedeihen“ nahezulegen.
- source_word: בִּנְבוּאַת
  choice: durch die prophetische Botschaft
  rationale: Die Präposition bezeichnet hier das Mittel; gemeint ist die prophetische Tätigkeit beziehungsweise Botschaft, durch die das Vorankommen gefördert wurde.
- source_word: חַגַּי נביאה
  choice: des Propheten Haggai
  rationale: Natürliche deutsche Wiedergabe der Apposition aus Name und Titel.
- source_word: וּזְכַרְיָה בַּר עִדּוֹא
  choice: und Sacharjas, des Sohnes Iddos
  rationale: „bar“ ist die übliche aramäische Bezeichnung für die Sohnschaft; der Genitiv fügt sich in die von „Botschaft“ abhängige Konstruktion ein.
- source_word: וּבְנוֹ וְשַׁכְלִלוּ
  choice: So bauten sie weiter und vollendeten den Bau
  rationale: 'Beide Verben werden sichtbar wiedergegeben: Das erste bezeichnet das Bauen, das zweite das Vollenden. Dadurch bleibt die koordinierte Struktur des Aramäischen erhalten.'
- source_word: מִן טַעַם
  choice: aufgrund des Erlasses
  rationale: Der Ausdruck bezeichnet eine verbindliche Anordnung, einen Befehl oder Erlass. „Aufgrund des Erlasses“ funktioniert sowohl für Gott als auch für die persischen Könige und bewahrt die wiederholte Formulierung.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: des Gottes Israels
  rationale: Direkte und geläufige Wiedergabe der Genitivverbindung.
- source_word: כּוֹרֶשׁ וְדָרְיָוֶשׁ וְאַרְתַּחְשַׁשְׂתְּא
  choice: Kyrus, Darius und Artaxerxes
  rationale: Übliche deutsche Namensformen der genannten persischen Herrscher.
- source_word: מֶלֶךְ פָּרָס
  choice: dem König von Persien
  rationale: Der singularische Titel steht syntaktisch am ehesten als Apposition zum zuletzt genannten Artaxerxes; die deutsche Formulierung bewahrt diese formale Zuordnung.
theological_decisions:
- issue: Verhältnis zwischen göttlicher und königlicher Autorisierung
  choice: Die Vollendung wird sowohl auf den Erlass des Gottes Israels als auch auf den Erlass der persischen Herrscher zurückgeführt; Gottes Erlass wird zuerst genannt.
  alternative: Die königlichen Erlasse ausdrücklich als untergeordnete Ausführungen des göttlichen Erlasses deuten.
  rationale: Der Vers nennt beide Ebenen ausdrücklich, erklärt aber ihr genaues Verhältnis nicht. Die Übersetzung bewahrt diese Spannung, ohne eine zusätzliche theologische Folgerung in den Text einzutragen.
- issue: Bezug des singularischen Titels „König von Persien“
  choice: Der Titel wird formal auf Artaxerxes bezogen.
  alternative: Den Titel sinngemäß auf alle drei genannten Herrscher beziehen und „die Könige von Persien“ übersetzen.
  rationale: Im aramäischen Text steht der Titel im Singular unmittelbar nach Artaxerxes. Eine pluralische Wiedergabe wäre sachlich plausibel, würde aber die grammatische Form glätten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fortlaufende Bautätigkeit und die beiden aramäischen Verben für Bauen und Vollenden bleiben erkennbar. „Prophetische Botschaft“ ist für heutige Leser verständlicher als das möglicherweise missverständliche „Prophezeiung“. Alle Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
