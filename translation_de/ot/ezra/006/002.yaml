  source_fidelity: 'Die passive Fundmeldung, die Schriftrolle und die einleitende Archivformel sind zutreffend wiedergegeben. Die Orts- und Bauwerksangabe sollte jedoch syntaktisch klarer gefasst werden: Der Entwurf kann durch die Apposition den Eindruck erwecken, Achmeta sei selbst die Zitadelle. Der aramäische Text unterscheidet den Ort Achmetha und die dort befindliche Zitadelle; die relative Ortsbestimmung ist ausdrücklich vorhanden.'
  naturalness: Der Entwurf ist überwiegend modernes, verständliches Standarddeutsch. „In Achmeta, der Zitadelle …“ ist jedoch mehrdeutig und weniger idiomatisch als eine klare Präpositional- und Relativkonstruktion. „Darin stand folgende Aufzeichnung“ ist möglich, aber „war … festgehalten“ bildet die dokumentarische Einleitungsformel präziser ab.
  terminology: „Ekbatana“ ist im heutigen Deutschen die geläufige historische Ortsform und entspricht der englischen POB-Entscheidung; „Achmeta“ kann als näher am aramäischen Namen liegende Alternative in der Fußnote stehen. „Zitadelle“, „Schriftrolle“ und „Aufzeichnung“ sind sachgerecht. Die Fußnote zu דכרונה sollte den dokumentarischen Sinn als Vermerk/Archivnotiz erläutern, nicht als „schriftliche Erinnerung“.
