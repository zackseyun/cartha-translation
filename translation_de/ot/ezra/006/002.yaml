  - severity: low
    issue: Ortsname und Fußnotenalternative
    rationale: Für modernes Standarddeutsch ist „Ekbatana“ die etabliertere historische Namensform. „Achmeta“ bleibt als quellennahe Alternative sinnvoll.
  - severity: low
    issue: Erläuterung zu „Aufzeichnung“
    rationale: „Schriftliche Erinnerung“ ist im Deutschen für einen amtlichen Archivtext missverständlich; „amtlicher Vermerk“ oder „Archivnotiz“ trifft den Kontext besser.
