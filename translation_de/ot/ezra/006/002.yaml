  yaml_path: translation/ot/ezra/006/002.yaml
  text: 'And in Ecbatana[a], the fortress that is in the province of Media, a scroll was found[c][b], and this was written in it as a record:'
translation:
  language: de
  text: 'In Ekbatana[a], in der Zitadelle[b], die in der Provinz Medien liegt, wurde eine Schriftrolle gefunden. Darin war Folgendes als Aufzeichnung[c] festgehalten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Achmeta«, eine näher am aramäischen Namen liegende Form.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Festung«. Das aramäische Wort bezeichnet einen befestigten königlichen oder administrativen Komplex.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Denkschrift« oder »Aktenvermerk«. Gemeint ist ein amtlicher Vermerk oder eine Archivnotiz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁתְּכַח
  choice: wurde … gefunden
  rationale: Die passive Bedeutung des aramäischen Verbs wird im deutschen Archivkontext direkt und natürlich wiedergegeben.
- source_word: אַחְמְתָא
  choice: Achmeta
  rationale: Die im Deutschen bibelsprachlich geläufige Namensform bleibt nahe an der aramäischen Ortsbezeichnung; die historisch übliche Form Ekbatana wird in der Fußnote genannt.
- source_word: בִּירְתָא
  choice: Zitadelle
  rationale: Das Wort bezeichnet hier einen befestigten königlichen oder administrativen Komplex; »Zitadelle« trifft diese Bedeutung präzise.
- source_word: דִּי בְּמָדַי מְדִינְתָּה
  choice: in der Provinz Medien
  rationale: Die knappe deutsche Apposition gibt Ortsangabe und Verwaltungsbezeichnung vollständig wieder, ohne einen schwerfälligen Relativsatz.
- source_word: מְגִלָּה חֲדָה
  choice: eine Schriftrolle
  rationale: חֲדָה fungiert hier idiomatisch als unbestimmte Bezeichnung; eine Betonung als »eine einzige« ist nicht erforderlich.
- source_word: וְכֵן כְּתִיב
  choice: Darin stand folgende
  rationale: Die Formulierung leitet den nachfolgenden Wortlaut natürlich ein und bewahrt die hinweisende Funktion des aramäischen Ausdrucks.
- source_word: בְּגַוַּהּ
  choice: Darin
  rationale: Das Pronomen verweist eindeutig und idiomatisch auf die Schriftrolle.
- source_word: דִּכְרוֹנָה
  choice: Aufzeichnung
  rationale: Im Verwaltungskontext bezeichnet das Substantiv eine schriftliche Gedächtnisnotiz beziehungsweise einen amtlichen Archivvermerk; »Aufzeichnung« ist verständlich und neutral.
