source:
  edition: WLC
  text: כְּעַ֡ן תַּ֠תְּנַי פַּחַ֨ת עֲבַֽר נַהֲרָ֜/ה שְׁתַ֤ר בּוֹזְנַי֙ וּ/כְנָוָ֣תְ/ה֔וֹן אֲפַרְסְכָיֵ֔/א דִּ֖י בַּ/עֲבַ֣ר נַהֲרָ֑/ה רַחִיקִ֥ין הֲו֖וֹ מִן תַּמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/006.yaml
  text: Now Tattenai[a], governor of the province Beyond the River, Shethar-bozenai, and your associates, the officials of Persia who are in Beyond the River[c][b], keep far away from there.
translation:
  language: de
  text: 'Nun gilt: Tattenai, Statthalter jenseits des Stromes, Schetar-Bosnai und ihre Amtsgenossen, die Afarsachäer[a], die jenseits des Stromes sind[b] – haltet euch von dort fern![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bedeutung von „Afarsachäer“ ist unsicher; möglicherweise sind damit persische Beamte oder eine bestimmte Amtsgruppe gemeint.
    reason: alternative_reading
  - marker: b
    text: „Jenseits des Stromes“ war aus persischer Sicht die Bezeichnung für das Gebiet westlich des Euphrat und konnte auch als Name einer Verwaltungsregion dienen.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „Seid fern von dort.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Nun gilt
  rationale: Die aramäische Übergangsformel leitet die königliche Anordnung ein. „Nun gilt“ klingt im Deutschen als Beginn eines Erlasses natürlich, ohne einen zwingenden Folgeschluss auszudrücken.
- source_word: תַּתְּנַי
  choice: Tattenai
  rationale: Der Personenname wird nach der aramäischen Form transliteriert.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: Statthalter jenseits des Stromes
  rationale: פַּחַת bezeichnet einen imperialen Statthalter. עֲבַר נַהֲרָה ist aus persischer Blickrichtung zugleich eine Ortsangabe und eine Verwaltungsbezeichnung; die knappe Wiedergabe bewahrt diese Mehrdeutigkeit.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Schetar-Bosnai
  rationale: Der Eigenname wird in einer für heutige deutsche Leser gut aussprechbaren Form wiedergegeben.
- source_word: וּכְנָוָתְהוֹן
  choice: und eure Amtsgenossen
  rationale: Das Substantiv bezeichnet Gefährten oder Kollegen; der Suffix ist in der vorliegenden Lesung zweite Person Plural. „Amtsgenossen“ passt zum behördlichen Zusammenhang, ohne ein besonderes Amt hinzuzufügen.
- source_word: אֲפַרְסְכָיֵא
  choice: die Afarsachäer
  rationale: Da Bedeutung und genaue administrative oder ethnische Zuordnung des Ausdrucks unsicher sind, wird er transliteriert statt als „persische Beamte“ vereindeutigt.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: jenseits des Stromes
  rationale: Die Wendung lokalisiert die Angesprochenen im Gebiet westlich des Euphrat aus Sicht der persischen Reichsmitte.
- source_word: רַחִיקִין הֲוֹו מִן תַּמָּה
  choice: haltet euch von dort fern
  rationale: Die wörtlich zustandsbezogene Form „seid fern von dort“ hat im Erlass klare auffordernde Kraft; die deutsche Formulierung gibt diese idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erlassstil. Die schwer deutbare Amts- oder Gruppenbezeichnung אֲפַרְסְכָיֵא wird nicht spekulativ aufgelöst; die historische Doppelfunktion von „jenseits des Stromes“ als Orts- und Verwaltungsbezeichnung bleibt erhalten.
