  text: בֵּ/אדַ֛יִן דָּרְיָ֥וֶשׁ מַלְכָּ֖/א שָׂ֣ם טְעֵ֑ם וּ/בַקַּ֣רוּ בְּ/בֵ֣ית סִפְרַיָּ֗/א דִּ֧י גִנְזַיָּ֛/א מְהַחֲתִ֥ין תַּמָּ֖ה בְּ/בָבֶֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/001.yaml
  text: Then King Darius issued a decree[a], and they searched in the house of the archives, where the treasures were stored[c][b], there in Babylon.
translation:
  language: de
  text: Daraufhin erließ König Darius einen Befehl[a], und man durchsuchte das Urkundenarchiv[b], in dem die Schätze[c] verwahrt wurden, dort in Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „König Darius setzte einen Befehl fest, und sie suchten im Urkundenarchiv.“ Das aramäische Verb steht in der 3. Person Plural und kann unpersönlich gebraucht sein.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich „Haus der Bücher/Schriftstücke“; gemeint ist ein amtlicher Aufbewahrungsort für Urkunden und Akten.
    reason: lexical_alternative
  - marker: c
    text: „Schätze“ kann hier auch allgemeiner verwahrte Wertgegenstände oder eingelagerte Bestände bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Daraufhin
  rationale: Der aramäische Diskursmarker führt das nächste Ereignis der Erzählung ein; „Daraufhin“ gibt die zeitliche und folgerichtige Abfolge natürlich wieder.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: König Darius
  rationale: Die im Deutschen übliche Wortstellung bewahrt Titel und Namen vollständig.
- source_word: שָׂם טְעֵם
  choice: erließ einen Befehl
  rationale: Wörtlich etwa „setzte einen Befehl/Erlass fest“; „erließ einen Befehl“ ist eine natürliche Wiedergabe des königlichen Verwaltungshandelns, ohne enger als der aramäische Ausdruck auf „Dekret“ festzulegen.
- source_word: וּבַקַּרוּ
  choice: man durchsuchte
  rationale: Das Aramäische hat ein aktives Verb in der 3. Person Plural mit ungenanntem Subjekt. Das deutsche unpersönliche „man“ bewahrt diese Unbestimmtheit natürlicher als ein unbegründet konkretes „sie“.
- source_word: בְּבֵית סִפְרַיָּא
  choice: das Urkundenarchiv
  rationale: Wörtlich „Haus der Bücher/Schriftstücke“; im amtlichen Zusammenhang ist ein Aufbewahrungsort für Urkunden und Akten gemeint. „Urkundenarchiv“ ist verständlich und sachlich präzise.
- source_word: דִּי
  choice: in dem
  rationale: Die Relativpartikel verbindet den Aufbewahrungsort mit dem folgenden Lokalsatz; „in dem“ gibt den räumlichen Bezug klar wieder.
- source_word: גִנְזַיָּא
  choice: die Schätze
  rationale: Der Ausdruck bezeichnet aufbewahrte Schätze, Wertgegenstände oder Bestände. „Schätze“ wahrt die naheliegende Grundbedeutung; die mögliche weitere Bedeutung wird in einer Fußnote genannt.
- source_word: מְהַחֲתִין
  choice: verwahrt wurden
  rationale: Das passive beziehungsweise resultative Partizip beschreibt Dinge, die dort niedergelegt und aufbewahrt waren; „verwahrt wurden“ passt zum Archiv- und Schatzhauskontext.
- source_word: תַּמָּה
  choice: dort
  rationale: Das ausdrücklich gesetzte Lokaladverb bleibt trotz einer gewissen Wiederholung erhalten.
- source_word: בְּבָבֶל
  choice: in Babylon
  rationale: Übliche deutsche Wiedergabe des Ortsnamens mit der Präposition.
