  text: אֱ֠דַיִן תַּתְּנַ֞י פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן לָ/קֳבֵ֗ל דִּֽי שְׁלַ֞ח דָּרְיָ֧וֶשׁ מַלְכָּ֛/א כְּנֵ֖מָא אָסְפַּ֥רְנָא עֲבַֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/013.yaml
  text: Then Tattenai[a], the governor of Beyond the River, Shethar-bozenai, and their associates did exactly so[b], in accordance with what King Darius had sent.
translation:
  language: de
  text: Daraufhin führten Tattenai, der Statthalter der Provinz Jenseits des Stromes[a], Schetar-Bosnai und ihre Mitarbeiter genau und sorgfältig nach dem aus, was König Darius gesandt hatte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jenseits des Stromes“ war die persische Verwaltungsbezeichnung für das Gebiet westlich des Euphrat.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „entsprechend dem, was König Darius gesandt hatte“. Das aramäische Verb bedeutet „senden“; gemeint ist im Zusammenhang die übersandte königliche Verfügung. Die anschließende Wendung betont eine genaue und sorgfältige Ausführung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Daraufhin
  rationale: Der aramäische Erzählmarker leitet das nächste Ereignis in der zeitlichen und sachlichen Folge ein.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: der Statthalter der Provinz jenseits des Stromes
  rationale: פַּחַת bezeichnet einen Provinzstatthalter; עֲבַר נַהֲרָה ist die persische Verwaltungsbezeichnung für das Gebiet westlich des Euphrat, aus mesopotamisch-persischer Perspektive.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Schetar-Bosnai
  rationale: Der Personenname wird in einer dem Deutschen angepassten Transliteration wiedergegeben.
- source_word: וּכְנָוָתְהוֹן
  choice: und ihre Amtsgenossen
  rationale: Das Wort bezeichnet die mit ihnen verbundenen Personen; im amtlichen Zusammenhang ist „Amtsgenossen“ präziser als das allgemeinere „Gefährten“.
- source_word: לָקֳבֵל דִּי
  choice: was … angeordnet hatte
  rationale: Die Wendung bezeichnet die Übereinstimmung des Handelns mit der königlichen Weisung; im Deutschen lässt sich dies natürlich durch den Relativsatz zusammen mit „genau“ ausdrücken.
- source_word: שְׁלַח
  choice: angeordnet hatte
  rationale: Wörtlich bedeutet das Verb „gesandt hatte“. Im Kontext ist das Übersandte die königliche Verfügung; „angeordnet hatte“ gibt den gemeinten amtlichen Vorgang idiomatisch wieder, während eine Fußnote die wörtliche Form wahrt.
- source_word: כְּנֵמָא אָסְפַּרְנָא
  choice: genau
  rationale: Die verstärkende adverbiale Verbindung betont die gewissenhafte und exakte Befolgung der königlichen Weisung.
- source_word: עֲבַדוּ
  choice: führten … aus
  rationale: Das allgemeine Verb „tun/machen“ meint hier die Ausführung einer Weisung; „führten … aus“ ist im Deutschen natürlich und kontextgerecht.
