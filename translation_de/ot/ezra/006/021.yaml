source:
  edition: WLC
  text: וַ/יֹּאכְל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל הַ/שָּׁבִים֙ מֵֽ/הַ/גּוֹלָ֔ה וְ/כֹ֗ל הַ/נִּבְדָּ֛ל מִ/טֻּמְאַ֥ת גּוֹיֵֽ הָ/אָ֖רֶץ אֲלֵ/הֶ֑ם לִ/דְרֹ֕שׁ לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/021.yaml
  text: The sons of Israel who had returned from the exile ate, together with everyone who had separated himself from the uncleanness of the peoples of the land to join them, to seek Yahweh, the God of Israel.
translation:
  language: de
  text: Die Israeliten[a], die aus dem Exil zurückgekehrt waren, aßen, zusammen mit allen, die sich von der Unreinheit[b] der Völker des Landes abgesondert und ihnen[c] angeschlossen hatten, um Jahwe, den Gott Israels, zu suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von der Befleckung der Völker des Landes“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „zu ihnen“; gemeint ist die Gemeinschaft der aus dem Exil Zurückgekehrten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: aßen
  rationale: Das Verb bedeutet schlicht „essen“. Der Gegenstand des Essens ergibt sich aus dem unmittelbaren Zusammenhang und wird nicht ausdrücklich ergänzt.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische deutsche Bezeichnung gibt die hebräische Wendung „Söhne Israels“ natürlich wieder, ohne die Teilnahme unnötig auf Männer zu beschränken; die wörtliche Form steht in Fußnote [a].
- source_word: הַשָּׁבִים מֵהַגּוֹלָה
  choice: die aus dem Exil zurückgekehrt waren
  rationale: Die partizipiale Wendung bezeichnet die aus dem Exil heimgekehrte Gemeinschaft. „Exil“ ist im modernen Deutschen sachlich und geläufig.
- source_word: וְכֹל הַנִּבְדָּל
  choice: zusammen mit allen, die sich … abgesondert … hatten
  rationale: Der substantivierte Singular mit כֹל hat kollektiven Sinn. „Abgesondert“ bewahrt die bewusste Distanzierung, während „zusammen mit“ die gemeinsame Teilnahme verdeutlicht.
- source_word: מִטֻּמְאַת גּוֹיֵי הָאָרֶץ
  choice: von der Unreinheit der Völker des Landes
  rationale: „Unreinheit“ bewahrt die kultische und moralische Bedeutungsbreite von טֻמְאָה. Der Plural „Völker“ entspricht גּוֹיֵי und vermeidet die Verengung auf eine einzelne Nation.
- source_word: אֲלֵהֶם
  choice: ihnen angeschlossen
  rationale: Wörtlich steht „zu ihnen“. Im Zusammenhang bezeichnet die Wendung die Hinwendung beziehungsweise den Anschluss an die zurückgekehrte Gemeinschaft; die formale Lesart wird in Fußnote [c] offengelegt.
- source_word: לִדְרֹשׁ
  choice: zu suchen
  rationale: „Suchen“ bewahrt die breite Bedeutung einer hingebungsvollen Hinwendung zu Gott, ohne sie auf Gottesdienst oder Befragung zu verengen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Eigenname gibt das Tetragramm als Gottes persönlichen Namen wieder und entspricht der konsultierten POB-Fassung.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Dies ist die natürliche Wiedergabe der hebräischen Genitivverbindung und bewahrt die Bundeszuordnung.
theological_decisions:
- issue: Identität der zusätzlich am Mahl Teilnehmenden
  choice: Die Gruppe wird nur durch ihre Absonderung von der Unreinheit der Völker des Landes und ihren Anschluss an die Heimgekehrten beschrieben.
  alternative: Sie ausdrücklich als Proselyten aus den umliegenden Völkern oder ausschließlich als im Land verbliebene Israeliten zu bezeichnen.
  rationale: Der hebräische Text legt ihre ethnische oder rechtliche Identität nicht eindeutig fest. Die Übersetzung bewahrt diese Offenheit und fügt keine engere Gruppenbezeichnung ein.
- issue: Bezug von אֲלֵהֶם
  choice: Die Wendung wird als Anschluss an die zurückgekehrte Gemeinschaft verstanden und zugleich durch eine Fußnote als wörtlich „zu ihnen“ ausgewiesen.
  alternative: Die Wendung unverbunden als „zu ihnen“ wiederzugeben oder ganz auszulassen.
  rationale: Die gewählte Form ergibt im Deutschen einen verständlichen Satz, ohne den im Hebräischen vorhandenen Bezug zu tilgen; die Fußnote schützt die formale Mehrdeutigkeit.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Der Satzbau folgt dem hebräischen Gedankengang, wird aber durch „zusammen mit“ und die koordinierte Verbform für deutsche Leser geklärt. Kultisch geprägte Begriffe wie „Unreinheit“ und „abgesondert“ bleiben erhalten.
