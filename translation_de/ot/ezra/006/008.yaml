source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ לְ/מָ֣א דִֽי תַֽעַבְד֗וּן עִם שָׂבֵ֤י יְהוּדָיֵ/א֙ אִלֵּ֔ךְ לְ/מִבְנֵ֖א בֵּית אֱלָהָ֣/א דֵ֑ךְ וּ/מִ/נִּכְסֵ֣י מַלְכָּ֗/א דִּ֚י מִדַּת֙ עֲבַ֣ר נַהֲרָ֔/ה אָסְפַּ֗רְנָא נִפְקְתָ֛/א תֶּהֱוֵ֧א מִֽתְיַהֲבָ֛א לְ/גֻבְרַיָּ֥/א אִלֵּ֖ךְ דִּי לָ֥א לְ/בַטָּלָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/008.yaml
  text: 'Moreover, I issue a decree concerning what you are to do for these Jewish elders as they rebuild this house of God: Their expenses are to be paid promptly from the royal revenues—the tribute collected in Beyond the River[a]—so that the work is not interrupted.'
translation:
  language: de
  text: 'Außerdem erlasse ich eine Anordnung darüber, was ihr für diese Ältesten der Juden tun sollt, während sie dieses Haus Gottes wieder aufbauen: Ihre Ausgaben sollen unverzüglich aus den königlichen Einkünften – den Abgaben aus dem Gebiet jenseits des Stromes[a] – bezahlt werden, damit die Arbeit nicht unterbrochen wird.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jenseits des Stromes“ war die persische Verwaltungsbezeichnung für die Gebiete westlich des Euphrat.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: Außerdem erlasse ich eine Anordnung
  rationale: Die aramäische Verwaltungsformel bezeichnet eine offiziell erlassene Entscheidung. Die aktive Form wahrt den königlichen Sprecher und klingt im Deutschen natürlich.
- source_word: שָׂבֵי יְהוּדָיֵא אִלֵּךְ
  choice: diese Ältesten der Juden
  rationale: Die Wendung bezeichnet die leitenden Männer der jüdischen Gemeinschaft; diese Formulierung ist präzise und vermeidet eine unnötige moderne Bedeutungsverengung von „jüdische Älteste“.
- source_word: לְמִבְנֵא בֵּית אֱלָהָא דֵךְ
  choice: während sie dieses Haus Gottes wieder aufbauen
  rationale: דֵךְ ist das Demonstrativpronomen „dieses“, kein Possessivpronomen. Der Kontext verlangt Wiederaufbau; die temporale Fassung verbindet die Tätigkeit natürlich mit der angeordneten Unterstützung.
- source_word: מִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה
  choice: aus den königlichen Einkünften – den Abgaben aus dem Gebiet jenseits des Stromes
  rationale: מִדַּת bezeichnet Abgabe oder Steuer, nicht eine Provinz. Die Apposition macht deutlich, dass diese Abgaben die Quelle der königlichen Mittel sind.
- source_word: אָסְפַּרְנָא
  choice: unverzüglich
  rationale: Das administrative Lehnwort fordert eine zügige und gewissenhafte Ausführung; im Zusammenhang der Auszahlung gibt „unverzüglich“ den Schwerpunkt angemessen wieder.
- source_word: נִפְקְתָא תֶּהֱוֵא מִתְיַהֲבָא לְגֻבְרַיָּא אִלֵּךְ
  choice: Ihre Ausgaben sollen ... bezahlt werden
  rationale: Die passive Konstruktion ordnet an, den genannten Männern die Kosten des Bauvorhabens zu erstatten beziehungsweise bereitzustellen. Das Pronomen vermeidet eine schwerfällige Wiederholung.
- source_word: דִּי לָא לְבַטָּלָא
  choice: damit die Arbeit nicht unterbrochen wird
  rationale: Der Zwecksatz soll einen Stillstand verhindern. „Die Arbeit“ ergänzt das im Zusammenhang eindeutige, im Aramäischen aber nicht ausdrücklich genannte Bezugswort.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klar erkennbarem Verwaltungston. „Haus Gottes“ bewahrt die Ausdrucksweise des Ausgangstextes; „dieses“ gibt das Demonstrativpronomen ausdrücklich wieder. Der Gedankenstrich kennzeichnet die Abgaben als nähere Bestimmung der königlichen Einkünfte.
