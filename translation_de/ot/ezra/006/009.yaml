base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/009.yaml
  text: And whatever is needed—young bulls[a], rams, and lambs for burnt offerings to the God of heaven, wheat, salt, wine, and oil, according to the word of the priests who are in Jerusalem—let it be given to them day by day without fail[b],
translation:
  language: de
  text: Und was benötigt wird – junge Stiere, Widder und Lämmer als Brandopfer für den Gott des Himmels, Weizen, Salz, Wein und Öl –, soll ihnen nach der Anweisung der Priester in Jerusalem[a] Tag für Tag gegeben werden, ohne dass etwas ausbleibt[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach dem Wort der Priester in Jerusalem“. Gemeint ist ihre maßgebliche Angabe oder Anweisung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ohne Unterlass“ oder „ohne dass es an etwas fehlt“. Die aramäische Schlussformel betont, dass die tägliche Versorgung nicht ausbleiben darf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה חַשְׁחָן
  choice: Und was benötigt wird
  rationale: Die Verbindung bezeichnet offen alles Erforderliche; die verbale deutsche Fassung ist natürlich und bewahrt den Verwaltungston.
- source_word: בְנֵי תוֹרִין
  choice: junge Stiere
  rationale: Die wörtliche Wendung „Söhne von Rindern“ bezeichnet junge männliche Rinder für das Opfer.
- source_word: דִכְרִין וְאִמְּרִין
  choice: Widder und Lämmer
  rationale: Präzise und im Opferkontext idiomatische Bezeichnungen.
- source_word: לַעֲלָוָן
  choice: als Brandopfer
  rationale: Bezeichnet vollständig verbrannte Opfer; „als“ fügt die Tiere natürlich in die deutsche Satzstruktur ein.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: für den Gott des Himmels
  rationale: Bewahrt den charakteristischen aramäischen Gottesnamen; „für“ ist im deutschen Opferkontext natürlicher als „zu“.
- source_word: חִנְטִין מְלַח חֲמַר וּמְשַׁח
  choice: Weizen, Salz, Wein und Öl
  rationale: Direkte, sachlich genaue Wiedergabe der Versorgungsgüter; die Quelle spezifiziert beim Öl nicht ausdrücklich Olivenöl.
- source_word: כְּמֵאמַר כָּהֲנַיָּא
  choice: nach der Anweisung der Priester
  rationale: מֵאמַר bedeutet wörtlich „Wort/Ausspruch“, bezeichnet hier aber die maßgebliche Angabe oder Anweisung der Priester.
- source_word: יוֹם בְּיוֹם
  choice: Tag für Tag
  rationale: Idiomaticher deutscher Ausdruck für die fortlaufende tägliche Bereitstellung.
- source_word: דִי לָא שָׁלוּ
  choice: zuverlässig
  rationale: Die Schlussformel verlangt, dass die tägliche Versorgung nicht ausbleibt; die Fußnote bewahrt die wörtlichere Deutungsbreite.
