  text: וַ/יַּֽעֲשׂ֧וּ חַג מַצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֑ה כִּ֣י שִׂמְּחָ֣/ם יְהוָ֗ה וְֽ/הֵסֵ֞ב לֵ֤ב מֶֽלֶךְ אַשּׁוּר֙ עֲלֵי/הֶ֔ם לְ/חַזֵּ֣ק יְדֵי/הֶ֔ם בִּ/מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִ֖ים אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/022.yaml
  text: And they kept the Feast of Unleavened Bread for seven days with joy[a], because Yahweh had made them joyful and had turned the heart of the king of Assyria toward them, to strengthen their hands in the work of the house of God[c][b], the God of Israel.
translation:
  language: de
  text: Sie feierten sieben Tage lang mit Freude das Fest der ungesäuerten Brote, denn Jahwe hatte ihnen Freude geschenkt und das Herz des Königs von Assyrien ihnen zugewandt[a], um ihnen bei der Arbeit am Haus Gottes, des Gottes Israels, die Hände zu stärken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text nennt ihn den »König von Assyrien«. Im persischen Zeitalter kann diese ältere Herrscherbezeichnung das Reich beziehungsweise Gebiet einschließen, das zuvor zu Assyrien gehört hatte.
    reason: Historische Bezeichnung erläutern, ohne den Ausgangstext zu harmonisieren.
  - marker: b
    text: Die Wendung »die Hände stärken« bedeutet, jemandem Kraft und Unterstützung für eine Aufgabe zu geben.
    reason: Das hebräische Körperbild und seine idiomatische Bedeutung transparent machen.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ חַג מַצּוֹת
  choice: sie feierten das Fest der ungesäuerten Brote
  rationale: עשה mit einem Fest als Objekt bedeutet idiomatisch »feiern/begehen«. »Feierten« ist im modernen Deutschen natürlich und bewahrt den festlichen Sinn.
- source_word: שִׁבְעַת יָמִים בְּשִׂמְחָה
  choice: sieben Tage lang mit Freude
  rationale: Die Dauer wird idiomatisch mit »lang« wiedergegeben; »mit Freude« bewahrt die nominale Ausdrucksweise des Hebräischen.
- source_word: שִׂמְּחָם
  choice: hatte ihnen Freude geschenkt
  rationale: Die Piel-Form drückt aus, dass Jahwe ihre Freude bewirkte. Die Formulierung ist natürlich und hält die Verbindung zu בְּשִׂמְחָה aufrecht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְהֵסֵב לֵב ... עֲלֵיהֶם
  choice: hatte ihnen das Herz ... zugewandt
  rationale: Die Wendung beschreibt eine von Gott bewirkte Änderung beziehungsweise Hinwendung der inneren Einstellung. »Zugewandt« erhält das Bild vom Herzen und die Richtung auf sie hin.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: König von Assyrien
  rationale: Die ausdrückliche historische Bezeichnung des hebräischen Textes bleibt erhalten, auch wenn im persischen Kontext ein persischer Herrscher gemeint ist.
- source_word: לְחַזֵּק יְדֵיהֶם
  choice: sodass er sie ... unterstützte
  rationale: Wörtlich heißt die hebräische Redewendung »ihre Hände stärken«; idiomatisch bezeichnet sie wirksame Hilfe oder Unterstützung. Die Fußnote bewahrt das Bild.
- source_word: בִּמְלֶאכֶת בֵּית הָאֱלֹהִים
  choice: bei der Arbeit am Haus Gottes
  rationale: Die Formulierung bezeichnet die Tätigkeit am Tempel und gibt die Präposition sowie die Genitivverbindung natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. Die Transliteration bewahrt dessen Charakter als Eigenname.
- issue: Bezeichnung eines persischen Herrschers als »König von Assyrien«
  choice: König von Assyrien im Haupttext beibehalten
  alternative: persischer König
  rationale: Der hebräische Wortlaut darf nicht stillschweigend historisch harmonisiert werden. Eine kurze Sachanmerkung erläutert die Spannung.
- issue: Bezug des Infinitivs לְחַזֵּק
  choice: 'final-konsekutiv auf die königliche Hinwendung bezogen: »sodass er sie ... unterstützte«'
  alternative: 'wörtlicher: »um ihre Hände zu stärken«'
  rationale: Der Sinn ist, dass die von Gott bewirkte Haltung des Königs den Arbeitenden Unterstützung verschaffte. Die idiomatische Wiedergabe verdeutlicht dies, ohne die göttliche Verursachung aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzfluss ist gegenüber der hebräischen Reihung leicht geglättet; historische und bildhafte Besonderheiten bleiben durch Haupttext und Fußnoten sichtbar.
