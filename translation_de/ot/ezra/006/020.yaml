  verdict: revise
  source_fidelity: 'Die Wiedergabe von טהר durch „gereinigt/rein“ und von הַפֶּסַח im Zusammenhang mit „schlachten“ durch „Passahlamm“ ist sachgerecht. „Allesamt“ gibt jedoch כְּאֶחָד nicht angemessen wieder: Es bezeichnet vor allem die Gesamtheit, während der Ausdruck die gemeinsame bzw. einmütige Handlung hervorhebt; die folgende Wendung כֻּלָּם deckt bereits „alle“ ab. „… die aus der Verbannung zurückgekehrt waren“ verengt בְּנֵי הַגּוֹלָה unzulässig auf tatsächlich zurückgekehrte Personen und kann Angehörige der Exilgemeinschaft einschließen, die nicht selbst zurückkehrten.'
  naturalness: Die Revision bleibt modernes, würdiges Standarddeutsch. „gemeinsam“ ist hier idiomatisch und vermeidet sowohl ein künstliches „wie einer“ als auch die doppelte Häufung „allesamt … alle“.
  terminology: „Passahlamm“, „Priester“, „Leviten“ sowie „gereinigt/rein“ sind passend. „Angehörige der Exilgemeinschaft“ wahrt den Exilbezug der festen Bezeichnung בְּנֵי הַגּוֹלָה, ohne eine biographische Aussage über jede einzelne Person hinzuzufügen.
  issues:
  - severity: medium
    issue: כְּאֶחָד ist mit „allesamt“ wiedergegeben.
    rationale: „Allesamt“ entspricht inhaltlich eher dem nachfolgenden כֻּלָּם („alle“). Der Aspekt des gemeinsamen bzw. einmütigen Sich-Reinigens bleibt dadurch unterbestimmt und wird zudem redundant wiederholt.
  - severity: medium
    issue: בְּנֵי הַגּוֹלָה wird als Personen umschrieben, „die aus der Verbannung zurückgekehrt waren“.
    rationale: Die hebräische Gruppenbezeichnung meint die Exil- bzw. Rückkehrergemeinschaft. Die Umschreibung legt zusätzlich fest, dass jedes Mitglied selbst zurückgekehrt sei, was der Ausdruck nicht verlangt.
  revised_text: Denn die Priester und die Leviten hatten sich gemeinsam gereinigt; sie alle waren rein. So schlachteten sie das Passahlamm für alle Angehörigen der Exilgemeinschaft, für ihre Brüder, die Priester, und für sich selbst.
