base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/020.yaml
  text: For the priests and the Levites had purified themselves as one; all of them were clean. And they slaughtered the Passover lamb for all the sons of the exile, and for their brothers the priests, and for themselves.
translation:
  language: de
  text: Denn die Priester und die Leviten hatten sich gemeinsam gereinigt; sie alle waren rein. So schlachteten sie das Passahlamm für alle Angehörigen der Exilgemeinschaft, für ihre Brüder, die Priester, und für sich selbst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְאֶחָד
  choice: allesamt
  rationale: Die Wendung bezeichnet hier die geschlossene Gesamtheit der Priester und Leviten. „Allesamt“ gibt den Einheits- und Vollständigkeitsaspekt natürlich wieder, ohne ein unidiomatisches „wie einer“ zu erzwingen.
- source_word: בְּנֵי הַגּוֹלָה
  choice: alle, die aus der Verbannung zurückgekehrt waren
  rationale: Wörtlich „Söhne der Verbannung“. Im Kontext bezeichnet die feste Wendung die Gemeinschaft der Rückkehrer; die explizite Wiedergabe ist im modernen Deutsch verständlich und erhält den Exilbezug.
- source_word: הַפֶּסַח
  choice: das Passahlamm
  rationale: Das Verb „schlachten“ zeigt, dass hier das Passahopfer beziehungsweise Passahlamm gemeint ist, nicht das Fest als Ganzes.
- source_word: אֲחֵיהֶם
  choice: ihre Brüder
  rationale: Die konkrete Verwandtschafts- und Gemeinschaftsbezeichnung des Hebräischen bleibt erhalten; die nachfolgende Apposition identifiziert sie als Priester.
theological_decisions:
- issue: Rituelle Reinigung und Reinheit
  choice: „hatten sich … gereinigt; sie waren alle rein“
  alternative: „hatten sich geheiligt; sie waren alle rein“
  rationale: Die Wurzel טהר bezeichnet kultische Reinigung beziehungsweise Reinheit. „Gereinigt“ und „rein“ bewahren diesen sachlichen Zusammenhang, ohne ihn als innere Sündlosigkeit umzudeuten.
- issue: Einheit von Priestern und Leviten
  choice: „allesamt“
  alternative: „wie ein Mann“ / „als einer“
  rationale: כְאֶחָד kann die gemeinsame, ausnahmslose Reinigung hervorheben. Die gewählte Form bewahrt den kollektiven Sinn, ohne eine weitergehende geistliche Einheit in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der hebräischen Begründung und Abfolge, wird aber für flüssige deutsche Lesbarkeit leicht geglättet. „Passahlamm“ und die Umschreibung der Exilsgemeinschaft machen die kontextuell gemeinten Referenten transparent.
