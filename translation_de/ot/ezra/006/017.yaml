  text: וְ/הַקְרִ֗בוּ לַ/חֲנֻכַּת֮ בֵּית אֱלָהָ֣/א דְנָה֒ תּוֹרִ֣ין מְאָ֔ה דִּכְרִ֣ין מָאתַ֔יִן אִמְּרִ֖ין אַרְבַּ֣ע מְאָ֑ה וּ/צְפִירֵ֨י עִזִּ֜ין ל/חטיא עַל כָּל יִשְׂרָאֵל֙ תְּרֵֽי עֲשַׂ֔ר לְ/מִנְיָ֖ן שִׁבְטֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/017.yaml
  text: And they offered for the dedication of this house of God one hundred bulls[a], two hundred rams, four hundred lambs, and twelve male goats as a sin offering for all Israel[b], according to the number of the tribes of Israel.
translation:
  language: de
  text: Zur Einweihung dieses Hauses Gottes opferten sie hundert Stiere, zweihundert Widder, vierhundert Lämmer und zwölf Ziegenböcke als Sündopfer für ganz Israel[a], entsprechend der Zahl der Stämme Israels.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zugunsten von ganz Israel“.'
    reason: lexical_alternative
  - marker: b
    text: Die zwölf Ziegenböcke entsprechen den zwölf Stämmen Israels und bringen so den gesamtisraelitischen Umfang des Opfers zum Ausdruck.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַקְרִבוּ
  choice: opferten sie
  rationale: Die Kausativform von קרב bezeichnet im kultischen Zusammenhang das Darbringen von Opfertieren. „Opferten“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: לַחֲנֻכַּת
  choice: Zur Einweihung
  rationale: חֲנֻכָּה bezeichnet die feierliche Einweihung beziehungsweise Inauguration. Die Präposition ל markiert hier Anlass oder Zweck.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: dieses Hauses Gottes
  rationale: Die Wiedergabe bewahrt das aramäische Bild vom „Haus Gottes“, statt es interpretierend durch „Tempel“ zu ersetzen.
- source_word: תּוֹרִין
  choice: Stiere
  rationale: Das Wort bezeichnet männliche Rinder; in der Opferliste ist „Stiere“ die klare und übliche deutsche Bezeichnung.
- source_word: דִּכְרִין
  choice: Widder
  rationale: Der aramäische Ausdruck bezeichnet männliche Schafe und wird im Opferkontext treffend mit „Widder“ wiedergegeben.
- source_word: אִמְּרִין
  choice: Lämmer
  rationale: Das Wort bezeichnet Lämmer beziehungsweise junge Schafe; „Lämmer“ ist hier die natürliche deutsche Wiedergabe.
- source_word: וּצְפִירֵי עִזִּין
  choice: zwölf Ziegenböcke
  rationale: Die Verbindung bezeichnet männliche Ziegen. „Ziegenböcke“ ist eindeutig und in modernem Deutsch geläufig.
- source_word: לחטיא
  choice: als Sündopfer
  rationale: Der Ausdruck ist ein kultischer Fachbegriff für ein Opfer im Zusammenhang mit Sünde beziehungsweise Reinigung. „Sündopfer“ bewahrt die traditionelle und kontextuell passende Bezeichnung.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: für ganz Israel
  rationale: עַל drückt hier Bezug, Nutzen oder stellvertretende Ausrichtung aus. „Für ganz Israel“ wahrt diese Bedeutungsbreite und den ausdrücklich umfassenden Wortlaut.
- source_word: לְמִנְיָן שִׁבְטֵי יִשְׂרָאֵל
  choice: entsprechend der Zahl der Stämme Israels
  rationale: Die Wendung erklärt die Zahl zwölf. „Entsprechend der Zahl“ gibt den Bezug idiomatisch und präzise wieder.
theological_decisions:
- issue: Umfang von „ganz Israel“ in nachexilischer Zeit
  choice: „für ganz Israel“ ohne Beschränkung auf die Heimgekehrten
  alternative: „für alle zurückgekehrten Israeliten“ oder eine ausdrücklich symbolische Deutung
  rationale: Der aramäische Text sagt ausdrücklich „ganz Israel“ und verbindet die zwölf Böcke mit der Zahl der Stämme. Die Übersetzung bewahrt diesen gesamtisraelitischen Anspruch, ohne seine historische oder theologische Reichweite enger festzulegen.
- issue: Bedeutung des als Sündopfer bezeichneten Opfers
  choice: „Sündopfer“ im Haupttext
  alternative: „Reinigungsopfer“
  rationale: Der zugrunde liegende Opferbegriff kann sowohl den Bezug auf Sünde als auch die reinigende Funktion hervorheben. „Sündopfer“ ist im Deutschen etabliert; die mögliche Funktionsnuance wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt natürlichem deutschen Sprachgebrauch, während „Haus Gottes“, die Opferarten und der ausdrückliche Bezug auf ganz Israel eng am aramäischen Text bleiben.
