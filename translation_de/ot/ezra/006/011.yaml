id: EZR.6.11
reference: Ezra 6:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל אֱנָ֗שׁ דִּ֤י יְהַשְׁנֵא֙ פִּתְגָמָ֣/א דְנָ֔ה יִתְנְסַ֥ח אָע֙ מִן בַּיְתֵ֔/הּ וּ/זְקִ֖יף יִתְמְחֵ֣א עֲלֹ֑/הִי וּ/בַיְתֵ֛/הּ נְוָל֥וּ יִתְעֲבֵ֖ד עַל דְּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/011.yaml
  text: 'And from me a decree is issued: if any man alters this edict[a], a beam shall be pulled out from his house, and he shall be impaled on it[c][b]; and his house shall be made a refuse heap because of this.'
translation:
  language: de
  text: 'Und von mir ergeht folgender Befehl: Jeder, der diesen Erlass abändert, aus dessen Haus soll ein Balken herausgerissen werden; er soll daran aufgespießt[a] und sein Haus deswegen zu einem Unratshaufen[b] gemacht werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: daran aufgehängt.'
    reason: alternative_reading
  - marker: b
    text: 'Traditionell: zu einem Misthaufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם
  choice: ergeht folgender Befehl
  rationale: Die aramäische Verwaltungsformel bezeichnet das verbindliche Erlassen einer königlichen Anordnung. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt den amtlichen Charakter.
- source_word: יְהַשְׁנֵא
  choice: abändert
  rationale: Das Verb meint hier nicht bloß Ungehorsam, sondern das Verändern oder Verfälschen des amtlichen Erlasses.
- source_word: פִּתְגָמָא
  choice: Erlass
  rationale: Der Ausdruck bezeichnet im imperialen Verwaltungskontext eine offizielle Anordnung und nicht nur ein gesprochenes Wort.
- source_word: יִתְנְסַח אָע מִן בַּיְתֵהּ
  choice: aus dessen Haus soll ein Balken herausgerissen werden
  rationale: Die Wendung beschreibt das Entfernen eines Bauholzes aus dem Haus des Schuldigen; „Balken“ ist konkret und im Deutschen gut verständlich.
- source_word: וּזְקִיף יִתְמְחֵא עֲלֹהִי
  choice: er soll daran aufgespießt werden
  rationale: Die Formulierung beschreibt eine Hinrichtung beziehungsweise öffentliche Befestigung am herausgerissenen Holz. „Aufgespießt“ gibt die wahrscheinlich gemeinte antike Strafpraxis wieder; die mögliche Wiedergabe „aufgehängt“ bleibt in der Fußnote erhalten.
- source_word: נְוָלוּ
  choice: Unratshaufen
  rationale: Das Wort bezeichnet einen entehrenden Ort von Schmutz, Abfall oder Verfall. „Unratshaufen“ bewahrt diesen Sinn in verständlichem, gegenwärtigem Deutsch.
- source_word: כָל אֱנָשׁ
  choice: Jeder, der
  rationale: Die natürliche deutsche Konstruktion gibt die allgemeine Geltung der singularischen Personenbezeichnung wieder, ohne den Rechtssatz unnötig schwerfällig zu formulieren.
theological_decisions:
- issue: Art der in der imperialen Strafandrohung bezeichneten Hinrichtung
  choice: Im Haupttext „daran aufgespießt“
  alternative: „daran aufgehängt“
  rationale: Der aramäische Wortlaut beschreibt das Erhöhen beziehungsweise Befestigen am Holz, legt die genaue Vollzugsart aber nicht völlig eindeutig fest. „Aufgespießt“ passt am besten zur altorientalischen Strafpraxis; „aufgehängt“ wird als echte Übersetzungsmöglichkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem königlich-administrativem Ton. Die drastische Strafandrohung wird weder abgeschwächt noch unnötig ausgeschmückt; die Unsicherheit über die genaue Hinrichtungsart bleibt durch die Fußnote sichtbar.
