  text: נִדְבָּכִ֞ין דִּי אֶ֤בֶן גְּלָל֙ תְּלָתָ֔א וְ/נִדְבָּ֖ךְ דִּי אָ֣ע חֲדַ֑ת וְ/נִ֨פְקְתָ֔/א מִן בֵּ֥ית מַלְכָּ֖/א תִּתְיְהִֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/004.yaml
  text: with three layers of dressed stone and one layer of new timber[b][a], and let the cost be given from the king’s house.
translation:
  language: de
  text: mit drei Lagen aus behauenen Steinen[a] und einer Lage aus neuem Bauholz; und die Kosten sollen aus dem Haus des Königs[b] bestritten werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „drei Reihen aus behauenen Steinen“.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus des Königs“ ist hier wahrscheinlich die königliche Schatzkammer beziehungsweise der königliche Haushalt gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: נִדְבָּכִין / נִדְבָּךְ
  choice: Lagen / Lage
  rationale: Der aramäische Baubegriff bezeichnet übereinander angeordnete Schichten oder Reihen. „Lagen“ ist im heutigen Deutsch verständlich und passt sowohl zu Stein als auch zu Holz.
- source_word: אֶבֶן גְּלָל
  choice: behauene Steine
  rationale: Im Bauzusammenhang sind zugerichtete Mauersteine gemeint. Die Wiedergabe vermeidet die missverständliche wörtliche Form „Rollsteine“; die fachsprachliche Alternative „Steinreihen“ wird in der Fußnote berücksichtigt.
- source_word: תְּלָתָא
  choice: drei
  rationale: Die Kardinalzahl bestimmt die vorausgehenden Baulagen.
- source_word: אָע חֲדַת
  choice: neues Bauholz
  rationale: „Bauholz“ gibt die Funktion des Holzes im vorliegenden Baubeschluss natürlicher wieder als das allgemeinere „Holz“; „neu“ entspricht חֲדַת.
- source_word: נִפְקְתָא
  choice: die Kosten
  rationale: Das Wort bezeichnet die für das Bauvorhaben anfallenden Ausgaben.
- source_word: מִן בֵּית מַלְכָּא
  choice: aus dem Haus des Königs
  rationale: Die konkrete aramäische Ausdrucksweise bleibt im Haupttext erhalten; der wahrscheinlich gemeinte königliche Schatz beziehungsweise die königlichen Mittel werden in einer Fußnote erklärt.
- source_word: תִּתְיְהִב
  choice: sollen … bestritten werden
  rationale: 'Die Formulierung gibt die verwaltungsrechtliche Anordnung idiomatisch wieder: Die Kosten sind aus der genannten Quelle bereitzustellen.'
