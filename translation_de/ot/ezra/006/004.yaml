  verdict: approve
  source_fidelity: 'Die Wiedergabe folgt dem aramäischen Baubeschluss genau: drei Lagen/Kurse aus zugerichteten Steinen, eine Lage aus neuem Holz sowie die Anordnung, die Ausgaben aus dem „Haus des Königs“ bereitzustellen. „Behauene Steine“ ist im Baukontext eine tragfähige Wiedergabe von אֶבֶן גְּלָל; die wörtlich naheliegende, aber im Deutschen irreführende Deutung als Rollsteine wird zu Recht vermieden.'
  naturalness: Der Text ist idiomatisches modernes Standarddeutsch und wahrt den formell-verwaltungssprachlichen Duktus eines königlichen Erlasses. „Die Kosten sollen ... bestritten werden“ gibt die administrative Anordnung natürlich wieder.
  terminology: „Lagen“, „behauene Steine“, „neues Bauholz“ und „Haus des Königs“ sind konsistent und sachgerecht. Die Fußnote zu „Haus des Königs“ erläutert die wahrscheinliche finanzielle Bedeutung, ohne die wörtliche Formulierung im Text zu ersetzen. Der Anker [a] steht unmittelbar bei der auslegungsbedürftigen Bauformulierung, [b] bei „Haus des Königs“.
