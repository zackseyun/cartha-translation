  text: And the sons of the exile kept the Passover on the fourteenth day of the first month[a].
translation:
  language: de
  text: Die Exilierten feierten am vierzehnten Tag des ersten Monats das Passafest.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: feierten
  rationale: Wörtlich bedeutet das Verb »tun/machen«; mit הַפֶּסַח als Objekt bezeichnet es idiomatisch das Begehen oder Feiern des Passafestes.
- source_word: בְנֵי הַגּוֹלָה
  choice: die aus der Verbannung Heimgekehrten
  rationale: Die hebräische Wendung lautet wörtlich »Söhne der Verbannung« und bezeichnet kollektiv die Gemeinschaft der ehemals Verbannten. Die natürliche deutsche Wiedergabe macht im erzählerischen Zusammenhang ihre Rückkehr deutlich, ohne sie auf Männer zu beschränken.
- source_word: הַפָּסַח
  choice: das Passafest
  rationale: Der Ausdruck kann das Passaopfer, das Passamahl oder die gesamte Feier bezeichnen. »Passafest« lässt den umfassenden rituellen Bezug im Deutschen offen.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: am vierzehnten Tag des ersten Monats
  rationale: Die deutsche Datumsformel ergänzt entsprechend dem hebräischen Sinn »Tag« und gibt die Monatsangabe eng am Ausgangstext wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektive hebräische Herkunftsbezeichnung wird verständlich und geschlechtsübergreifend wiedergegeben; die knappe Datumsformel bleibt erhalten.
