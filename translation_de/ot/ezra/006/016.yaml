id: EZR.6.16
reference: Ezra 6:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/עֲבַ֣דוּ בְנֵֽי יִ֠שְׂרָאֵל כָּהֲנַיָּ֨/א וְ/לֵוָיֵ֜/א וּ/שְׁאָ֣ר בְּנֵי גָלוּתָ֗/א חֲנֻכַּ֛ת בֵּית אֱלָהָ֥/א דְנָ֖ה בְּ/חֶדְוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/016.yaml
  text: And the sons of Israel[a], the priests, the Levites, and the rest of the sons of the exile celebrated the dedication of this house of God with joy.
translation:
  language: de
  text: Und die Israeliten, die Priester, die Leviten und die übrigen Angehörigen der Exilsgemeinschaft[a] feierten voller Freude die Einweihung dieses Hauses Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die übrigen Söhne der Verbannung«; gemeint sind die übrigen Angehörigen der aus dem Exil stammenden Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדוּ
  choice: feierten
  rationale: Das aramäische Verb bezeichnet hier die Durchführung einer feierlichen Handlung. In Verbindung mit »Einweihung« gibt »feierten« den Sinn im Deutschen idiomatisch wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die geläufige deutsche Wiedergabe von wörtlich »Söhne Israels« ist natürlich und bezeichnet hier das Volk beziehungsweise die Gemeinschaft Israels.
- source_word: כָּהֲנַיָּא
  choice: die Priester
  rationale: Die übliche und sachlich genaue Bezeichnung der priesterlichen Gruppe.
- source_word: וְלֵוָיֵא
  choice: die Leviten
  rationale: Die übliche Bezeichnung für die Angehörigen der levitischen Gruppe.
- source_word: וּשְׁאָר בְּנֵי גָלוּתָא
  choice: und die übrigen Angehörigen der Exilsgemeinschaft
  rationale: Die Formulierung macht den kollektiven Sinn von wörtlich »die übrigen Söhne des Exils/der Verbannung« in modernem Deutsch verständlich, ohne die im Ausgangstext nicht ausdrücklich genannte Rückkehr einzutragen.
- source_word: חֲנֻכַּת
  choice: die Einweihung
  rationale: Das Substantiv bezeichnet die feierliche Widmung beziehungsweise Einweihung eines Hauses oder Altars; »Einweihung« ist hier die direkte und natürliche deutsche Entsprechung.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: dieses Hauses Gottes
  rationale: Bewahrt die Ausgangsmetapher »Haus Gottes«; »Tempel« wäre zwar sachlich zutreffend, aber stärker deutend.
- source_word: בְּחֶדְוָה
  choice: voller Freude
  rationale: Gibt die Präposition mit dem Substantiv idiomatisch und zugleich ausdrucksstark wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Aufzählungsstruktur und die Bezeichnung »Haus Gottes« bleiben erhalten; semitisch beziehungsweise aramäisch geprägte Wendungen werden dort geglättet, wo eine wörtliche Wiedergabe im Deutschen unnatürlich wäre.
