  verdict: revise
  source_fidelity: Die Grundbedeutung der Einsetzung von Priestern und Leviten in gegliederte Dienstordnungen wird getroffen. Die Zweckkonstruktion „damit sie … verrichteten“ macht jedoch aus der Zuordnung zur Aufgabe unnötig einen expliziten Zweck- bzw. Folgesatz. Die knappe Zuordnung „für den Dienst Gottes in Jerusalem“ entspricht dem aramäischen עַל עֲבִידַת אֱלָהָא genauer.
  naturalness: „Sie ordneten … ihren Abteilungen zu“ ist modernes, klares Standarddeutsch. „Buch Mose“ ist im Deutschen die übliche biblische Bezeichnung; „Buch Moses“ wirkt weniger idiomatisch.
  terminology: „Priester“, „Leviten“, „Abteilungen“ und „Dienst Gottes“ sind sachgerecht. Für die beiden eng verwandten Organisationsbegriffe ist die einheitliche Wiedergabe „Abteilungen“ vertretbar; der Text verlangt keine künstliche Differenzierung. Die Ortsangabe bleibt beim Dienst Gottes, wie im Ausgangstext.
