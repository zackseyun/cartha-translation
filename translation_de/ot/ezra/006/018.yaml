  text: וַ/הֲקִ֨ימוּ כָהֲנַיָּ֜/א בִּ/פְלֻגָּתְ/ה֗וֹן וְ/לֵוָיֵ/א֙ בְּ/מַחְלְקָ֣תְ/ה֔וֹן עַל עֲבִידַ֥ת אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם כִּ/כְתָ֖ב סְפַ֥ר מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/018.yaml
  text: And they set up the priests in their divisions and the Levites in their divisions for the service of God that is in Jerusalem[b][a], as it is written in the Book of Moses.
translation:
  language: de
  text: Und sie ordneten die Priester ihren Abteilungen und die Leviten ihren Abteilungen für den Dienst Gottes in Jerusalem zu, wie es im Buch Mose geschrieben steht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִימוּ
  choice: sie teilten … zu
  rationale: Die Kausativform von קום bedeutet hier, Personen an ihren vorgesehenen Platz zu stellen beziehungsweise einzusetzen. „Zuteilen“ gibt die organisatorische Einsetzung im Deutschen natürlich wieder.
- source_word: כָהֲנַיָּא
  choice: die Priester
  rationale: Die bestimmte aramäische Form bezeichnet die bekannte Priesterschaft des Tempels.
- source_word: בִּפְלֻגָּתְהוֹן
  choice: ihren Abteilungen
  rationale: Das Substantiv bezeichnet geordnete Abteilungen oder Dienstordnungen. „Abteilungen“ ist modern und wahrt den organisatorischen Sinn.
- source_word: וְלֵוָיֵא
  choice: und die Leviten
  rationale: Direkte Wiedergabe der levitischen Tempeldiener.
- source_word: בְּמַחְלְקָתְהוֹן
  choice: ihren Dienstgruppen
  rationale: Der Ausdruck bezeichnet eingeteilte Gruppen. „Dienstgruppen“ macht im Kontext ihre organisatorische Funktion deutlich und unterscheidet das eng verwandte Wort angemessen vom vorherigen Ausdruck.
- source_word: עַל עֲבִידַת אֱלָהָא
  choice: damit sie den Dienst Gottes … verrichteten
  rationale: עַל kann hier die Zuweisung zu einer Aufgabe ausdrücken. Die finite deutsche Formulierung gibt den Zweck der Einteilung verständlich wieder, ohne den kultischen Dienst näher zu bestimmen.
- source_word: דִּי בִירוּשְׁלֶם
  choice: in Jerusalem
  rationale: Der Relativanschluss ordnet den Dienst Gottes dem Ort Jerusalem zu; im Deutschen ist die knappe Ortsangabe natürlicher als ein wörtliches „der in Jerusalem ist“.
- source_word: כִּכְתָב
  choice: wie es … geschrieben steht
  rationale: Die Wendung bezeichnet die Übereinstimmung mit einer schriftlichen Vorgabe.
- source_word: סְפַר מֹשֶׁה
  choice: im Buch Moses
  rationale: סְפַר kann Buch, Schriftstück oder Rolle bedeuten. „Buch Moses“ ist hier die verständliche, etablierte Bezeichnung, ohne den Umfang der Schrift näher festzulegen.
theological_decisions:
- issue: Verhältnis der Diensteinteilung zur schriftlichen Weisung des Mose
  choice: Die Einteilung wird ausdrücklich als Übereinstimmung mit dem im Buch Moses Geschriebenen dargestellt.
  alternative: Die Schlusswendung könnte lediglich allgemein auf mosaische Tradition oder übliche Praxis bezogen werden.
  rationale: כִּכְתָב סְפַר מֹשֶׁה verweist ausdrücklich auf eine schriftliche Norm. Die Übersetzung bewahrt diesen Bezug, ohne weitergehende Aussagen über Kanon, Verfasserschaft oder spätere Ämterlehren einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden eng verwandten Organisationsbegriffe werden mit „Abteilungen“ und „Dienstgruppen“ wiedergegeben; dadurch bleiben sowohl ihre semantische Nähe als auch ihre lexikalische Verschiedenheit erkennbar.
