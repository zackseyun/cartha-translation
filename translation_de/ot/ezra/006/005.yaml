base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/005.yaml
  text: And also let the gold and silver vessels of the house of God[a], which Nebuchadnezzar took out of the temple that was in Jerusalem and brought to Babylon, be returned and brought to the temple that is in Jerusalem, each to its place; and you shall put them in the house of God.
translation:
  language: de
  text: Auch sollen die goldenen und silbernen Gefäße des Hauses Gottes, die Nebukadnezar aus dem Tempel in Jerusalem weggenommen und nach Babel gebracht hat, zurückgegeben und zum Tempel in Jerusalem gebracht werden, jedes an seinen Platz.[a] Und du sollst sie im Haus Gottes aufstellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie sollen zurückgegeben werden und zum Tempel in Jerusalem gelangen, jedes an seinen Platz.“ Der aramäische Wortlaut in diesem Satzteil ist schwierig; gemeint ist jedenfalls, dass die Tempelgefäße an ihre jeweiligen Plätze in Jerusalem zurückkehren sollen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף
  choice: Auch
  rationale: Die additive Partikel leitet einen weiteren Punkt des königlichen Erlasses ein; „Auch“ ist im Deutschen klar und natürlich.
- source_word: מָאנֵי
  choice: Gefäße
  rationale: Das Wort bezeichnet hier Gegenstände des Tempels. „Gefäße“ ist die geläufige, hinreichend weit gefasste Wiedergabe in diesem kultischen Zusammenhang.
- source_word: בֵית אֱלָהָא
  choice: Haus Gottes
  rationale: Die wörtliche Wiedergabe bewahrt den Unterschied zu הֵיכְלָא („Tempel“) im selben Vers.
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: goldenen und silbernen
  rationale: Die Genitive bezeichnen das Material der Gefäße; die adjektivische Form ist natürliches Deutsch.
- source_word: הַנְפֵּק
  choice: weggenommen
  rationale: Der Kausativ bezeichnet das Herausbringen beziehungsweise Entfernen aus dem Tempel. „Weggenommen“ passt zur Verschleppung der Tempelgefäße.
- source_word: הֵיכְלָא
  choice: Tempel
  rationale: Im Zusammenhang ist eindeutig der Jerusalemer Tempel gemeint; zugleich bleibt die lexikalische Unterscheidung zu „Haus Gottes“ erhalten.
- source_word: וְהֵיבֵל
  choice: gebracht
  rationale: Das Verb beschreibt die Beförderung der Gefäße nach Babel schlicht und idiomatisch.
- source_word: יַהֲתִיבוּן
  choice: zurückgegeben werden
  rationale: Die passive Befehlsform fordert die Rückgabe beziehungsweise Wiederherstellung der verschleppten Gegenstände.
- source_word: וִיהָךְ
  choice: zum Tempel in Jerusalem gebracht werden
  rationale: Die Form und ihr syntaktischer Anschluss sind schwierig. Im Kontext setzt sie den Befehl zur Rückführung der Gefäße nach Jerusalem fort, ohne die Unsicherheit durch eine zu enge Deutung zu verdecken.
- source_word: לְאַתְרֵהּ
  choice: jedes an seinen Platz
  rationale: Das singularische Suffix wird distributiv auf die einzelnen Gefäße bezogen und bezeichnet ihren jeweiligen Ort im Tempel.
- source_word: וְתַחֵת
  choice: Und du sollst sie … aufstellen
  rationale: Die zweite Person Singular wird als direkte Anweisung an den angesprochenen Amtsträger bewahrt; „aufstellen“ gibt das Platzieren der Gegenstände im Gotteshaus natürlich wieder.
