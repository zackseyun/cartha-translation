  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִ/בְּנֵי֙ הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/061.yaml
  text: 'And from among the sons of the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: de
  text: 'Und von den Söhnen der Priester: die Söhne Hobajas, die Söhne des Hakkoz und die Söhne Barsillais. Dieser hatte eine von den Töchtern des Gileaditers Barsillai zur Frau genommen und wurde nach ihrem Namen genannt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „und nahm ihren Namen an“. Wörtlich heißt es im Hebräischen: „und wurde nach ihrem Namen genannt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: Und von den Söhnen der Priester
  rationale: Die Verbindung von וּ und dem partitiven מִן wird mit „und von“ wiedergegeben. „Söhne“ bewahrt den genealogischen Ausdruck des Hebräischen.
- source_word: בְּנֵי חֳבַיָּה ... בְּנֵי הַקּוֹץ ... בְּנֵי בַרְזִלַּי
  choice: die Söhne Hobajas, die Söhne des Hakkoz und die Söhne Barsillais
  rationale: Das wiederholte בְּנֵי wird entsprechend der Listenform jeweils als „die Söhne“ wiedergegeben. Die Eigennamen folgen gebräuchlichen deutschen Bibeltransliterationen.
- source_word: אֲשֶׁר לָקַח
  choice: Dieser hatte ... genommen
  rationale: Das Relativpronomen bezieht sich hier auf Barsillai, den Ahnherrn der zuletzt genannten Gruppe. Das Plusquamperfekt macht die zeitliche Vorordnung gegenüber der anschließenden Namensannahme deutlich.
- source_word: מִבְּנוֹת ... אִשָּׁה
  choice: eine von den Töchtern ... zur Frau genommen
  rationale: Die Formulierung gibt sowohl das partitive מִן als auch die hebräische Wendung „eine Frau nehmen“ natürlich und präzise wieder.
- source_word: בַּרְזִלַּי הַגִּלְעָדִי
  choice: des Gileaditers Barsillai
  rationale: Das Gentilizium הַגִּלְעָדִי wird knapp und idiomatisch als „der Gileaditer“ wiedergegeben.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: und wurde nach ihrem Namen genannt
  rationale: Die passive Form des hebräischen Verbs und der Bezug auf den Namen bleiben erhalten. Das pluralische Suffix wird mit „ihrem“ wiedergegeben, ohne den sozialen Vorgang hinter der Namensführung näher festzulegen.
theological_decisions: []
