lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: Der Konstruktplural von בֵּן bezeichnet in dieser Rückkehrerliste eine Familien- oder Sippenzugehörigkeit. „Nachkommen“ gibt diese Funktion im modernen Deutschen natürlicher wieder als das wörtliche „Söhne“.
- source_word: יוֹרָה
  choice: Joras
  rationale: Der Name wird nach der masoretischen Form in Esra 2,18 als „Jora“ wiedergegeben; der Genitiv markiert die Zugehörigkeit der Nachkommen. Die abweichende Namensform der Parallelstelle wird in der Fußnote dokumentiert.
- source_word: מֵאָה וּשְׁנֵים עָשָׂר
  choice: '112'
  rationale: Die Zahl wird in der knappen, listenartigen Form moderner deutscher Bibelausgaben als Ziffer wiedergegeben; ihr Wert entspricht genau dem hebräischen Zahlenausdruck.
