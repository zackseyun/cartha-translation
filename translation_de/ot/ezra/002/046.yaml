- source_word: חָגָב
  choice: Hagab
  rationale: Der Personen- beziehungsweise Sippenname wird in einer dem Hebräischen nahen, im Deutschen gut lesbaren Form wiedergegeben.
- source_word: שמלי
  choice: Schamlai
  rationale: Der Eigenname wird nach der vorliegenden Konsonantenfolge transliteriert. Da auch die Lesung „Schalmai“ überliefert beziehungsweise in Übersetzungen vertreten ist, wird sie in einer Fußnote genannt.
- source_word: חָנָן
  choice: Hanan
  rationale: Der Personen- beziehungsweise Sippenname wird direkt und in der im Deutschen geläufigen Form transliteriert.
