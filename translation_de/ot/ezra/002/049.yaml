  text: בְּנֵי עֻזָּ֥א בְנֵי פָסֵ֖חַ בְּנֵ֥י בֵסָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/049.yaml
  text: the sons of Uzza[a], the sons of Paseah, the sons of Besai.
translation:
  language: de
  text: die Söhne Ussas[a], die Söhne Paseachs, die Söhne Besais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Söhne“ kann im Hebräischen auch eine weitere Familienlinie oder Nachkommenschaft bezeichnen, nicht nur unmittelbare Söhne.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status-constructus-Plural von בֵּן wird entsprechend der dreifach wiederholten hebräischen Listenform knapp und formal mit „die Söhne“ wiedergegeben; in diesem Zusammenhang kann der Ausdruck auch eine weitere Nachkommenschaft oder Familienlinie bezeichnen.
- source_word: עֻזָּא
  choice: Ussa
  rationale: Der Personenname wird in einer im Deutschen etablierten biblischen Form wiedergegeben; das hebräische Zajin wird dabei als „s/ss“ repräsentiert.
- source_word: פָסֵחַ
  choice: Paseach
  rationale: Der Personenname wird quellennah transliteriert; „ch“ gibt den abschließenden hebräischen Rachenlaut wieder.
- source_word: בֵסָי
  choice: Besai
  rationale: Der Personenname wird transliteriert; „-ai“ bildet die Schlusssilbe samt Jod angemessen ab.
theological_decisions: []
