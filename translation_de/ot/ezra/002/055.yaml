  text: 'the sons of Solomon’s servants: the sons of Sotai[a], the sons of Hassophereth, the sons of Peruda.'
translation:
  language: de
  text: 'Die Nachkommen der Diener Salomos: die Nachkommen Sotais, die Nachkommen Hassoferets, die Nachkommen Perudas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im hebräischen Text von Esra steht »Peruda«; die Parallelliste in Nehemia 7,57 hat »Perida«.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: In dieser genealogischen Liste bezeichnet der Ausdruck Familien- oder Sippenzugehörigkeit, nicht nur unmittelbare Söhne. »Nachkommen« gibt den gemeinten Umfang in natürlichem modernem Deutsch wieder; die Wiederholung bewahrt den Listenrhythmus des Hebräischen.
- source_word: עַבְדֵי
  choice: Diener
  rationale: עֶבֶד kann sowohl »Diener« als auch »Sklave« bedeuten. Hier handelt es sich um die feste Gruppenbezeichnung »Diener Salomos« in einer Rückkehrerliste, ohne dass der rechtliche Status näher hervorgehoben wird.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: סֹטַי
  choice: Sotai
  rationale: Der Eigenname wird eng am hebräischen Konsonanten- und Vokalbestand transliteriert.
- source_word: הַסֹּפֶרֶת
  choice: Hassoferet
  rationale: Die Wiedergabe bildet den hebräischen Namen einschließlich des vorangestellten Artikelelements הַ und der Konsonantenverdopplung ab, ohne ihn als Gattungsbezeichnung zu deuten.
- source_word: פְרוּדָא
  choice: Peruda
  rationale: Der masoretische Text von Esra liest פְרוּדָא. Die abweichende Namensform der Parallelliste in Nehemia wird in einer Fußnote dokumentiert.
