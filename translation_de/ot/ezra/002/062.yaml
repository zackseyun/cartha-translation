  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑אוּ וַֽ/יְגֹאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/062.yaml
  text: These sought their record among those enrolled by genealogy[a], but they were not found, and they were excluded from the priesthood.
translation:
  language: de
  text: Diese suchten nach ihrem Eintrag im Geschlechtsregister, doch sie waren darin nicht zu finden. Deshalb wurden sie vom Priestertum ausgeschlossen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Ausdruck kann auch bedeuten: „Sie wurden für das Priestertum als unrein erklärt“ oder „sie wurden vom Priestertum disqualifiziert“.'
    reason: Lexikalische Alternative bei וַיְגֹאֲלוּ; die Hauptfassung gibt die im Zusammenhang hervortretende praktische Folge wieder.
lexical_decisions:
- source_word: אֵלֶּה
  choice: Diese
  rationale: Der Demonstrativ im Plural verweist auf die zuvor genannten Anwärter auf das Priesteramt; „Diese“ gibt ihn knapp und natürlich wieder.
- source_word: בִּקְשׁוּ
  choice: suchten
  rationale: בקשׁ bezeichnet hier die gezielte Suche nach einem schriftlichen Nachweis.
- source_word: כְתָבָם
  choice: ihre Urkunde
  rationale: כְּתָב meint ein Schriftstück oder Dokument; „Urkunde“ bringt in diesem administrativ-genealogischen Zusammenhang den Charakter eines schriftlichen Nachweises zum Ausdruck.
- source_word: הַמִּתְיַחְשִׂים
  choice: im Geschlechtsregister
  rationale: Die substantivierte Partizipialform von יחס bezeichnet die genealogisch Erfassten. Idiomatisches Deutsch gibt den Ort der Suche als „im Geschlechtsregister“ wieder.
- source_word: וְלֹא נִמְצָאוּ
  choice: doch sie wurde nicht gefunden
  rationale: Der masoretische Konsonantentext hat formal ein maskulines Pluralverb („sie wurden nicht gefunden“), doch das feminine Singular-Ketiv נִמְצָאָה legt den nicht aufgefundenen schriftlichen Nachweis als Sinn nahe. Die deutsche Fassung folgt diesem kontextuell klaren Bezug und bewahrt den Textbefund in einer Fußnote.
- source_word: וַיְגֹאֲלוּ
  choice: wurden sie … ausgeschlossen
  rationale: Die seltene Verbform bezeichnet hier, dass die Betroffenen wegen des fehlenden Abstammungsnachweises als für den Priesterdienst ungeeignet beziehungsweise verunreinigt galten. „Ausgeschlossen“ benennt die praktische Folge, ohne die lexikalische Färbung zu verschweigen; diese wird in der Fußnote erläutert.
- source_word: מִן הַכְּהֻנָּה
  choice: vom Priestertum
  rationale: כְּהֻנָּה bezeichnet das Priestertum beziehungsweise den priesterlichen Dienst; „vom Priestertum“ ist direkt und idiomatisch.
theological_decisions:
- issue: Bedeutung von וַיְגֹאֲלוּ für den priesterlichen Status
  choice: vom Priestertum ausgeschlossen
  alternative: für das Priestertum als unrein erklärt; vom Priestertum ausgeschlossen beziehungsweise dafür disqualifiziert
  rationale: 'Der Ausdruck kann Verunreinigung oder Disqualifikation bezeichnen. Im Zusammenhang steht die konkrete Folge im Vordergrund: Ohne bestätigte Abstammung durften die Betroffenen nicht als Priester gelten beziehungsweise dienen. Die Hauptfassung nennt diese Folge; die Fußnote erhält die stärkere lexikalische Nuance.'
- issue: Bezugswort von וְלֹא נִמְצָאוּ / Ketiv נִמְצָאָה
  choice: Die Urkunde wurde nicht gefunden
  alternative: Sie wurden im Register nicht gefunden
  rationale: 'Die Überlieferung weist eine Numerusabweichung auf: Das Ketiv ist feminin Singular und passt zu einer als feminin verstandenen Urkunde beziehungsweise Aufzeichnung; die vokalisierte Lesung ist maskulin Plural und bezieht sich auf die Personen. Beide ergeben im Kontext denselben Sachverhalt, werden aber nicht stillschweigend gleichgesetzt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Urkunde“ und „Geschlechtsregister“ vermitteln den amtlich-genealogischen Zusammenhang verständlich. Die Folgebeziehung wird mit „Deshalb“ ausdrücklich gemacht, da sie im hebräischen Erzählzusammenhang klar impliziert ist.
