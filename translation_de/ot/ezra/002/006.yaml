lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen von
  rationale: In der Rückkehrerliste bezeichnet בְּנֵי eine Familien- oder Sippenzugehörigkeit. „Nachkommen“ gibt diese Bedeutung im heutigen Deutsch natürlicher und eindeutiger wieder als das wörtliche „Söhne“.
- source_word: פַחַת מוֹאָב
  choice: Pahat-Moab
  rationale: Der Eigenname wird nach gängiger deutscher Bibeltradition transliteriert; der Bindestrich macht den zusammengesetzten Namen kenntlich.
- source_word: לִבְנֵי
  choice: und zwar die Nachkommen von
  rationale: Das präfigierte ל ordnet die genannte Gruppe näher den Linien Jeschuas und Joabs zu. „Und zwar“ bildet diese spezifizierende Beziehung verständlich ab, ohne sie übermäßig festzulegen.
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Die kürzere nachexilische Namensform wird als „Jeschua“ wiedergegeben und so von der im Deutschen meist „Josua“ genannten Form unterschieden.
- source_word: יוֹאָב
  choice: Joab
  rationale: Dies ist die etablierte deutsche Wiedergabe des Personennamens.
- source_word: אַלְפַּיִם שְׁמֹנֶה מֵאוֹת וּשְׁנֵים עָשָׂר
  choice: '2.812'
  rationale: Die Zahl bedeutet eindeutig 2.812. Ziffern sind in einer Namens- und Zählliste übersichtlich; der Punkt entspricht der deutschen Schreibweise für Tausendergruppen.
