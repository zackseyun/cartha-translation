lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: In der nachexilischen Heimkehrerliste bezeichnet בְּנֵי eine Familien- oder Sippengruppe. „Die Söhne“ gibt die hebräische Form direkt und im Deutschen verständlich wieder; „Nachkommen“ wäre erklärender, ist hier aber nicht zwingend.
- source_word: אִמֵּר
  choice: Immers
  rationale: Der Eigenname wird als „Immer“ transkribiert. Der deutsche Genitiv auf -s stellt die Zugehörigkeit der genannten Söhne beziehungsweise Familiengruppe natürlich dar.
- source_word: אֶלֶף חֲמִשִּׁים וּשְׁנָיִם
  choice: '1.052'
  rationale: Die hebräische Zahlenfolge lautet wörtlich „tausend, fünfzig und zwei“. In einer Zähl- und Namensliste ist die Wiedergabe mit deutschen Ziffern und Tausenderpunkt klar und sachgerecht.
