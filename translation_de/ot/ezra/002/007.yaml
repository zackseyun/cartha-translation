lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status-constructus-Plural von בֵּן bezeichnet hier in der Rückkehrerliste eine genealogisch bestimmte Familien- oder Sippengruppe. „Die Söhne“ gibt die formale Listenstruktur unmittelbar wieder; „die Nachkommen“ wäre erklärender, aber weniger quellennah.
- source_word: עֵילָם
  choice: Elams
  rationale: Der Eigenname wird als „Elam“ transliteriert und wegen der deutschen Konstruktion „Söhne Elams“ in den Genitiv gesetzt.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: '1.254'
  rationale: Die hebräische Zahlenfolge ergibt 1.254. Ziffern entsprechen dem Charakter eines Registers und sind im Deutschen gut lesbar; der Punkt folgt der deutschen Schreibweise für Tausendergruppen.
