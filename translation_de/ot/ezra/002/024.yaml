lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: Der Konstruktplural von בֵּן bezeichnet in genealogischen Listen häufig Angehörige einer Sippe oder Familienlinie, nicht nur unmittelbare Söhne. „Nachkommen“ gibt diese Bedeutung im heutigen Deutsch natürlich wieder.
- source_word: עַזְמָוֶת
  choice: Asmawet
  rationale: Der Eigenname wird nach gängigen deutschen Transliterationskonventionen wiedergegeben. Im Zusammenhang kann er das Stammhaus oder möglicherweise den zugehörigen Ort bezeichnen.
- source_word: אַרְבָּעִים וּשְׁנָיִם
  choice: zweiundvierzig
  rationale: Die hebräische Kardinalzahl wird in natürlichem modernem Deutsch wiedergegeben.
