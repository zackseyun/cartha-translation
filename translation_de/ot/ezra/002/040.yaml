  yaml_path: translation/ot/ezra/002/040.yaml
  text: 'The Levites: the sons of Jeshua and Kadmiel[a], of the sons of Hodaviah, seventy-four.'
translation:
  language: de
  text: 'Die Leviten: die Nachkommen Jeschuas und Kadmiëls aus der Familie Hodawjas[a]: 74.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier »Hodawja«; die Parallelliste in Nehemia 7,43 hat »Hodewa«.
