lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Die Leviten
  rationale: Der bestimmte Artikel und die Gruppenbezeichnung führen eine neue Kategorie der Rückkehrerliste ein; die knappe Überschrift entspricht der hebräischen Form.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die formale Wiedergabe bewahrt den genealogischen Ausdruck, der hier zugleich eine Familien- oder Clanzugehörigkeit bezeichnen kann.
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Der nachexilische Personenname wird in einer im Deutschen gebräuchlichen, quellenahen Form wiedergegeben.
- source_word: וְקַדְמִיאֵל
  choice: und Kadmiël
  rationale: Die Konjunktion wird direkt wiedergegeben; die Trema-Schreibung macht die getrennte Aussprache der Vokale deutlich.
- source_word: לִבְנֵי הוֹדַוְיָה
  choice: aus der Nachkommenschaft Hodawjas
  rationale: Das präfigierte ל bezeichnet hier am ehesten die genealogische beziehungsweise klassifikatorische Zuordnung. Die Formulierung ist im modernen Deutschen natürlich und vermeidet die schwerfällige Folge „Söhne … von den Söhnen“.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: '74'
  rationale: In einer Zählliste ist die Ziffer eine klare und natürliche moderne Wiedergabe von „siebzig und vier“.
