source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הָֽ/עֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדָּ֖ן אִמֵּ֑ר וְ/לֹ֣א יָֽכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/059.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addan, and Immer, but they were not able to declare their fathers’ house and their offspring, whether they were from Israel.
translation:
  language: de
  text: Und dies waren diejenigen, die aus Tel-Melach, Tel-Harscha, Kerub, Addan und Immer heraufzogen; sie konnten jedoch ihr Vaterhaus und ihre Abstammung[a] nicht angeben, ob sie aus Israel stammten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihr Vaterhaus und ihren Samen“. Gemeint sind die väterliche Großfamilie und die genealogische Herkunft.'
    reason: 'Der hebräische Ausdruck verbindet einen technischen Begriff für die väterliche Abstammungsgruppe mit זֶרַע („Same“, hier: Herkunftslinie). Die Fußnote bewahrt das Quellbild und erklärt die Bedeutung.'
lexical_decisions:
- source_word: הָעֹלִים
  choice: waren … heraufgezogen
  rationale: Das Verb עלה bezeichnet hier das Hinaufziehen beziehungsweise die Rückkehr in das Land. „Heraufgezogen“ bewahrt die räumliche Ausdrucksweise des Hebräischen, ohne sie vorschnell als „zurückgekehrt“ auszudeuten.
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדָּן אִמֵּר
  choice: aus Tel-Melach, Tel-Harscha, Kerub, Addan und Immer
  rationale: Die Orts- oder Sippennamen werden nach deutscher Laut- und Schreibkonvention transliteriert. Bindestriche machen die mit תל gebildeten zusammengesetzten Ortsnamen erkennbar.
- source_word: לֹא יָכְלוּ לְהַגִּיד
  choice: konnten … nicht angeben
  rationale: נגד bedeutet in diesem verwaltungsmäßig-genealogischen Zusammenhang, eine Angabe zu machen oder etwas bekanntzugeben. „Angeben“ ist im Deutschen für eine amtliche Herkunftsangabe natürlicher als „verkünden“ und setzt nicht ausdrücklich voraus, dass Dokumente vorgelegt werden mussten.
- source_word: בֵּית אֲבוֹתָם
  choice: ihr Vaterhaus
  rationale: „Vaterhaus“ bewahrt den technischen genealogischen Ausdruck für die väterliche Großfamilie beziehungsweise Abstammungsgruppe. Die Fußnote erläutert den heute weniger geläufigen Begriff.
- source_word: וְזַרְעָם
  choice: und ihre Abstammung
  rationale: זֶרַע bedeutet wörtlich „Same“, bezeichnet hier aber die genealogische Herkunft beziehungsweise Linie. Da die genannten Personen ihre eigene Zugehörigkeit nachweisen sollen, gibt „Abstammung“ den kontextuellen Sinn klarer wieder als „Nachkommen“.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: ob sie aus Israel stammten
  rationale: Die Wendung betrifft ihre israelitische Herkunft und Zugehörigkeit. „Aus Israel stammten“ macht den Abstammungsbezug im Deutschen deutlich, ohne eine weitergehende theologische Bestimmung von „Israel“ vorzunehmen.
theological_decisions:
- issue: Bedeutung von „Israel“ in der abschließenden Herkunftsfrage
  choice: „ob sie aus Israel stammten“
  alternative: „ob sie zu Israel gehörten“
  rationale: Der unmittelbare Zusammenhang handelt von genealogischer Herkunft. „Stammten“ gibt diesen Bezug wieder, während „gehörten“ stärker eine rechtliche oder religiöse Zugehörigkeit nahelegen könnte. Welche weitergehenden Folgen die ungeklärte Abstammung hatte, wird im Vers nicht ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung bleibt knapp wie in einem genealogischen Verzeichnis. „Vaterhaus“ erhält die historische Sozialstruktur des Ausgangstextes; die Fußnote sichert die Verständlichkeit. Der Doppelpunkt markiert den Übergang von der Herkunftsliste zur Einschränkung, ohne zusätzliche inhaltliche Verknüpfungen einzutragen.
