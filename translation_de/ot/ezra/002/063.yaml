base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/063.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b][c].
translation:
  language: de
  text: Und der Statthalter sagte zu ihnen, sie dürften nichts von den hochheiligen Gaben[a][b] essen, bis ein Priester für Urim und Tummim[c] auftritt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Tirschata«; ein persischer Verwaltungstitel.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die priesterlichen Speiseanteile der Opfer, die als besonders heilig galten, nicht das Allerheiligste im Tempel.
    reason: cultural_note
  - marker: c
    text: Urim und Tummim dienten der priesterlichen Befragung Gottes; ihre genaue Gestalt und die Art ihrer Verwendung sind unbekannt.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: der Statthalter
  rationale: Der Ausdruck ist ein persischer Verwaltungstitel. „Statthalter“ gibt seine Funktion für heutige Leser verständlich wieder; die traditionelle Umschrift „Tirschata“ wird in einer Fußnote bewahrt.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: sie dürften nichts … essen
  rationale: Die Formulierung gibt den Inhalt einer behördlichen Anordnung in indirekter Rede natürlich und verbindlich wieder.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: von den hochheiligen Gaben
  rationale: Im Zusammenhang sind essbare, den Priestern zustehende Anteile besonders heiliger Opfer gemeint, nicht das Allerheiligste als Raum. „Hochheilig“ bewahrt die verstärkende Bedeutung der hebräischen Fügung.
- source_word: עַד עֲמֹד כֹּהֵן
  choice: bis ein Priester … auftrete
  rationale: עַד mit dem Infinitiv bezeichnet den künftigen Zeitpunkt, bis zu dem das Verbot gilt. Der Konjunktiv entspricht der indirekten Rede und „auftreten“ bezeichnet hier das Vorhandensein eines entsprechend befähigten Priesters, ohne ein bloß körperliches Aufstehen nahezulegen.
- source_word: לְאוּרִים וּלְתֻמִּים
  choice: mit Urim und Tummim
  rationale: Die kultischen Fachbegriffe werden umschrieben bzw. transliteriert statt spekulativ gedeutet. Das לְ wird idiomatisch mit „mit“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von קֹדֶשׁ הַקֳּדָשִׁים in diesem Zusammenhang
  choice: Die Wendung bezeichnet die hochheiligen Opfergaben beziehungsweise die davon stammenden priesterlichen Speiseanteile.
  alternative: Sie bezeichnet das Allerheiligste als Raum.
  rationale: Der unmittelbare Zusammenhang betrifft die umstrittene priesterliche Abstammung und das Essen heiliger Speise. Daher ist hier kein Zutritt zum innersten Heiligtum gemeint.
- issue: Wiedergabe von Urim und Tummim
  choice: Die überlieferten Fachbegriffe bleiben erhalten.
  alternative: Eine deutende Übersetzung wie „Lichter und Vollkommenheiten“.
  rationale: Gestalt und genaue Verwendungsweise dieser Mittel priesterlicher Befragung sind unsicher. Eine etymologisierende Übersetzung würde eine nicht gesicherte Deutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Verwaltungston. „Hochheilige Gaben“ vermeidet die räumliche Fehlassoziation von „Allerheiligstes“, während „sie dürften“ und „auftrete“ die indirekte behördliche Anordnung klar markieren.
