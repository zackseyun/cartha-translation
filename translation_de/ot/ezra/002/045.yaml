  text: the sons of Lebanah[a], the sons of Hagabah, the sons of Akkub.
translation:
  language: de
  text: Die Söhne Lebanas[a], die Söhne Hagabas, die Söhne Akkubs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für »Söhne« kann hier eine Nachkommenschaft oder eine Sippengruppe bezeichnen, nicht nur unmittelbare männliche Kinder.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die wörtliche Wiedergabe bewahrt die dreifache, formelhafte Struktur des hebräischen Registers. In diesem Zusammenhang kann der Ausdruck zugleich Nachkommen oder Angehörige einer Sippe bezeichnen; darauf weist die Fußnote hin.
- source_word: לְבָנָה
  choice: Lebana
  rationale: Der Eigenname wird nach der masoretischen Vokalisierung in einer für das Deutsche natürlichen Form transliteriert; das auslautende ה bezeichnet hier den Endvokal a und wird nicht als eigener h-Laut wiedergegeben.
- source_word: חֲגָבָה
  choice: Hagaba
  rationale: Der Eigenname wird in deutscher Transkription wiedergegeben; das auslautende ה markiert den Endvokal a und erscheint daher nicht als zusätzliches h.
- source_word: עַקּוּב
  choice: Akkub
  rationale: Die etablierte deutsche Namensform gibt den verdoppelten Konsonanten und den u-Vokal angemessen wieder.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Listendeutsch mit bewahrter dreifacher Wiederholung. Die Genitivformen der Namen sind im Deutschen ohne Apostroph oder zusätzliche Endung gebildet.
