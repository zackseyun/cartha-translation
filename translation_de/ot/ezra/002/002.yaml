id: EZR.2.2
reference: Ezra 2:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲשֶׁר בָּ֣אוּ עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְ֠חֶמְיָה שְׂרָיָ֨ה רְֽעֵלָיָ֜ה מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפָּ֥ר בִּגְוַ֖י רְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/002.yaml
  text: 'who came with Zerubbabel: Jeshua[a], Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, and Baanah[d][c][b]. The number of the men of the people of Israel:'
translation:
  language: de
  text: 'die mit Serubbabel kamen: Jeschua, Nehemia, Seraja, Reelaja[a], Mordechai, Bilschan, Mispar[b], Bigwai, Rehum[c] und Baana. Die Zahl der Männer des Volkes Israel:[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der parallelen Liste in Nehemia 7,7 steht für „Reelaja“ die Namensform „Raamja“.
    reason: alternative_reading
  - marker: b
    text: In der parallelen Liste in Nehemia 7,7 steht für „Mispar“ die Namensform „Misperet“.
    reason: alternative_reading
  - marker: c
    text: In der parallelen Liste in Nehemia 7,7 steht für „Rehum“ die Namensform „Nehum“.
    reason: alternative_reading
  - marker: d
    text: Diese Formulierung leitet die Zählung ein, deren erste Einzelangabe im folgenden Vers steht.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר בָּאוּ
  choice: die … kamen
  rationale: Das Relativpronomen setzt die Satzkonstruktion aus Vers 1 fort. בוא bedeutet hier schlicht „kommen“; „zurückkehren“ wäre zwar kontextuell verständlich, läge aber nicht ausdrücklich im Verb.
- source_word: עִם
  choice: mit
  rationale: Die Präposition bezeichnet die Begleitung Serubbabels.
- source_word: זְרֻבָּבֶל
  choice: Serubbabel
  rationale: Im Deutschen gebräuchliche Form des Personennamens.
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Die Namensform gibt das hebräische יֵשׁוּעַ wieder und entspricht dem üblichen deutschen Gebrauch für diese nachexilische Gestalt.
- source_word: שְׂרָיָה
  choice: Seraja
  rationale: Der masoretische Text liest Seraja; abweichende Namen in anderen Überlieferungszusammenhängen werden nicht in den Haupttext eingetragen.
- source_word: רְעֵלָיָה
  choice: Reelaja
  rationale: Transliteration der Namensform im masoretischen Text; die abweichende Form in Nehemia 7,7 wird in einer Fußnote genannt.
- source_word: מִסְפָּר
  choice: Mispar
  rationale: An dieser Stelle ist מִסְפָּר ein Personenname, nicht das gleichlautende gewöhnliche Substantiv „Zahl“.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: Die Zahl der Männer des Volkes Israel
  rationale: Die Nominalfügung dient als Überschrift für die anschließend aufgeführten Zahlen und bleibt als solche offen zum folgenden Vers.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionellen deutschen Formen der biblischen Personennamen werden verwendet. Der Versanfang bleibt als Relativsatz an Vers 1 angeschlossen; der Schluss wird als Überschrift mit Doppelpunkt gestaltet, weil die nachfolgenden Verse die Zahlenangaben liefern.
