- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die wiederkehrende Listenformel wird formal nah wiedergegeben. Im Zusammenhang bezeichnet sie eine Sippe oder eine mit einem Ort verbundene Gruppe; „Söhne“ bewahrt diese mögliche Mehrdeutigkeit.
- source_word: נְבוֹ
  choice: Nebos
  rationale: Der Eigenname wird als „Nebo“ transkribiert und wegen der deutschen Fügung „Söhne Nebos“ in den Genitiv gesetzt. Ob hier ein Ort oder eine Sippe gemeint ist, bleibt offen.
- source_word: חֲמִשִּׁים וּשְׁנָיִם
  choice: '52'
  rationale: Die hebräische Zahl „fünfzig und zwei“ wird in der heute üblichen deutschen Zahlenform wiedergegeben.
