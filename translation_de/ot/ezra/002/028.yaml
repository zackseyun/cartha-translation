lexical_decisions:
- source_word: אַנְשֵׁי
  choice: Die Männer aus
  rationale: Der Status constructus im Plural bezeichnet hier in einer Rückkehrerliste die männlichen Angehörigen beziehungsweise Vertreter der genannten Orte. „Die Männer aus“ ist im Deutschen natürlich und gibt die örtliche Zuordnung klar wieder.
- source_word: בֵית אֵל
  choice: Bethel
  rationale: Der etablierte deutsche Name des Ortes wird entsprechend der üblichen biblischen Namensform transliteriert.
- source_word: וְהָעָי
  choice: und Ai
  rationale: Der hebräische Artikel beim Ortsnamen wird im Deutschen nicht eigens wiedergegeben; die geläufige Namensform lautet „Ai“.
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: zweihundertdreiundzwanzig
  rationale: Die Kardinalzahl wird nach moderner deutscher Rechtschreibung als zusammengeschriebenes Zahlwort wiedergegeben.
