lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen von
  rationale: In dieser genealogischen Rückkehrerliste bezeichnet der Ausdruck die Angehörigen beziehungsweise Nachkommen einer Familienlinie, nicht zwingend unmittelbare Söhne. „Nachkommen von“ gibt die gemeinte Beziehung im modernen Deutsch klar und natürlich wieder.
- source_word: קֵרֹס
  choice: Keros
  rationale: Der Eigenname wird entsprechend der hebräischen Lautung transliteriert.
- source_word: סִיעֲהָא
  choice: Siaha
  rationale: Der masoretische Text bietet diesen Eigennamen in der längeren Form; „Siaha“ bildet sie im Deutschen angemessen ab.
- source_word: פָדוֹן
  choice: Padon
  rationale: Der Eigenname wird entsprechend der masoretischen Vokalisierung transliteriert.
