lexical_decisions:
- source_word: בְּנֵי
  choice: Die Söhne
  rationale: Die formnahe Wiedergabe bewahrt die Ausdrucksweise des Hebräischen. In dieser Rückkehrerliste kann der Ausdruck jedoch eine größere Familien-, Sippen- oder Ortsgemeinschaft bezeichnen und ist nicht auf unmittelbare männliche Kinder beschränkt; darauf weist die Fußnote hin.
- source_word: לֹד
  choice: Lod
  rationale: Der hebräische Ortsname wird direkt transkribiert; die später gebräuchliche Namensform Lydda wird in einer Fußnote genannt.
- source_word: חָדִיד
  choice: Hadid
  rationale: Der Ortsname wird aus dem Hebräischen transkribiert.
- source_word: וְאוֹנוֹ
  choice: und Ono
  rationale: Das verbindende Waw wird mit „und“ wiedergegeben, der Ortsname wird transkribiert.
- source_word: שְׁבַע מֵאוֹת עֶשְׂרִים וַחֲמִשָּׁה
  choice: '725'
  rationale: Die hebräische Zahlwortfolge bezeichnet exakt die Zahl 725; die Ziffernschreibweise ist in einer Auflistung im modernen Deutschen klar und natürlich.
