lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der Status-constructus-Plural von בֵּן bezeichnet in dieser Rückkehrerliste eine Familie oder Sippe. »Die Söhne« bewahrt die hebräische Listenformel; je nach Zusammenhang kann sie auch Nachkommen meinen.
- source_word: רְצִין
  choice: Rezin
  rationale: Der Eigenname wird entsprechend seiner hebräischen Lautgestalt transliteriert.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Der Eigenname wird nach der masoretischen Vokalisierung als »Nekoda« wiedergegeben.
- source_word: גַזָּם
  choice: Gazzam
  rationale: Der Eigenname wird transliteriert; »zz« gibt die durch den Dagesch angezeigte Konsonantenverdopplung wieder.
