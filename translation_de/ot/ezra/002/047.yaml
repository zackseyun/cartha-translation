- source_word: בְּנֵי
  choice: die Söhne …
  rationale: Der Status constructus Plural von בֵּן bezeichnet in dieser genealogischen Rückkehrerliste die Angehörigen beziehungsweise Nachkommen einer Familie. „Die Söhne …“ gibt die wiederholte hebräische Formulierung knapp und formal genau wieder.
- source_word: גִדֵּל
  choice: Giddel
  rationale: Der Personen- beziehungsweise Sippenname wird nach üblicher deutscher Bibelnamenschreibung transkribiert.
- source_word: גַחַר
  choice: Gahar
  rationale: Der Eigenname wird transkribiert und nicht übersetzt.
- source_word: רְאָיָה
  choice: Reaja
  rationale: Der Eigenname wird in einer im Deutschen natürlichen, dem hebräischen רְאָיָה entsprechenden Form wiedergegeben.
