  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: die Sänger
  rationale: Das substantivierte Partizip von שׁיר bezeichnet Menschen, die singen. Im Zusammenhang dieser Liste ist „die Sänger“ direkt, natürlich und genauer als das weiter gefasste „die Musiker“; „die Tempelsänger“ würde eine im Vers selbst nicht ausdrücklich genannte Bestimmung ergänzen.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: בְּנֵי bezeichnet in genealogischen und gruppenbezogenen Listen die Angehörigen einer Abstammungs- oder Traditionslinie. „Die Söhne“ bewahrt die hebräische Formulierung und lässt ihre mögliche kollektive Bedeutung offen.
- source_word: אָסָף
  choice: Asaf
  rationale: Der Personenname wird in der im modernen Deutschen etablierten biblischen Form „Asaf“ wiedergegeben.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: '128'
  rationale: Die hebräische Zahlenfolge bedeutet eindeutig 100 + 20 + 8. Die Ziffernschreibung ist in einer Aufzählungs- und Zensusliste knapp und gut lesbar.
theological_decisions: []
translation_notes:
  register: Knapper, würdiger Listenstil in modernem Standarddeutsch. Der Doppelpunkt bildet die nominale Gliederung des Hebräischen natürlich ab; ein Verb wird nicht ergänzt.
