base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/070.yaml
  text: So the priests[a], the Levites, some of the people, the singers, the gatekeepers, and the temple servants lived in their cities, and all Israel lived in their cities.
translation:
  language: de
  text: So wohnten die Priester, die Leviten, einige aus dem Volk, die Sänger, die Torhüter und die Tempeldiener[a] in ihren Städten; und ganz Israel wohnte in seinen Städten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „die Netinim“, eine besondere Gruppe, die zum Dienst am Tempel bestimmt war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: So wohnten
  rationale: ישׁב bezeichnet hier das Wohnen beziehungsweise die Wohnsitznahme. „Wohnten“ ist im Deutschen natürlich und bewahrt die schlichte Aussage des hebräischen Textes; das einleitende וַ wird im Erzählzusammenhang mit „So“ wiedergegeben.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Übliche und sachlich genaue Wiedergabe für die priesterliche Gruppe im nachexilischen Zusammenhang.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Die geläufige Bezeichnung für die von den Priestern unterschiedene levitische Gruppe.
- source_word: וּמִן הָעָם
  choice: einige aus dem Volk
  rationale: 'Die Präposition מִן ist hier partitiv: Gemeint ist ein Teil des Volkes neben den eigens genannten Gruppen. „Einige aus dem Volk“ gibt diese Bedeutung in natürlichem Deutsch wieder.'
- source_word: הַמְשֹׁרְרִים
  choice: die Sänger
  rationale: Die Form bezeichnet die für den Gesang, besonders im Tempeldienst, zuständigen Personen.
- source_word: הַשּׁוֹעֲרִים
  choice: die Torhüter
  rationale: Gemeint sind die für die Tore zuständigen Wächter oder Hüter; „Torhüter“ ist die klare, übliche deutsche Entsprechung.
- source_word: הַנְּתִינִים
  choice: die Tempeldiener
  rationale: נְתִינִים ist eine technische Bezeichnung für eine dem Tempeldienst zugeordnete Gruppe. „Tempeldiener“ vermittelt ihre Funktion; die traditionelle Umschrift wird in der Fußnote genannt.
- source_word: בְּעָרֵיהֶם
  choice: in ihren Städten / in seinen Städten
  rationale: עִיר kann Stadt oder Ortschaft bezeichnen. „Städte“ wahrt die geläufige biblische Ausdrucksweise. Beim kollektiven Singular „ganz Israel“ wird das hebräische pluralische Suffix idiomatisch mit „seinen“ wiedergegeben.
- source_word: וְכָל יִשְׂרָאֵל
  choice: auch ganz Israel
  rationale: „Ganz Israel“ bewahrt den kollektiven biblischen Ausdruck. Das verbindende וְ wird hier passend als „auch“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe der technischen Bezeichnung הַנְּתִינִים
  choice: die Tempeldiener
  alternative: die Netinim
  rationale: Die Funktionsbezeichnung ist für heutige Leser verständlicher als eine bloße Umschrift, ohne eine besondere konfessionelle Deutung einzutragen. Die traditionelle Bezeichnung bleibt durch die Fußnote zugänglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung und die Wiederholung des Wohnens werden klar bewahrt; der im Hebräischen im zweiten Satzteil nur mitgedachte verbale Sinn wird für natürliches Deutsch ausdrücklich wiederholt.
