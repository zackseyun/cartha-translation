lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Die Priester
  rationale: Der bestimmte Plural bezeichnet unmittelbar die Priester und leitet in diesem Verzeichnis ihre Gruppe ein.
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: Wörtlich »Söhne«; in genealogischen Listen bezeichnet der Ausdruck häufig die Angehörigen einer Familienlinie. »Nachkommen« gibt diesen Sinn im heutigen Deutsch natürlich wieder.
- source_word: יְדַעְיָה
  choice: Jedaja
  rationale: Übliche deutsche Umschrift des hebräischen Personennamens.
- source_word: לְבֵית
  choice: aus dem Haus
  rationale: Die Präposition mit »Haus« kennzeichnet hier die Zugehörigkeit zu einer Sippe beziehungsweise Familienlinie.
- source_word: יֵשׁוּעַ
  choice: Jeschua
  rationale: Die Form gibt den nachexilischen Personennamen יֵשׁוּעַ genauer wieder als die verwandte Namensform »Josua«.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: '973'
  rationale: Die hebräische Zahlenfolge ergibt 973; Ziffern erhöhen in einer Zählliste die Übersichtlichkeit.
