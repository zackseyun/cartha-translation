id: EZR.2.1
reference: Ezra 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָֽ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֥ר הֶגְלָ֛ה נבוכדנצור מֶֽלֶךְ בָּבֶ֖ל לְ/בָבֶ֑ל וַ/יָּשׁ֛וּבוּ לִ/ירוּשָׁלִַ֥ם וִֽ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/001.yaml
  text: These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon, and they returned to Jerusalem and Judah[c][b], each to his own city.
translation:
  language: de
  text: Dies sind die Angehörigen der Provinz[a], die aus der Gefangenschaft der Verbannten[b] heraufzogen, die Nebukadnezar[c], der König von Babylon, nach Babylon verschleppt hatte. Sie kehrten nach Jerusalem und Juda zurück, jeder in seine Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne der Provinz«; gemeint sind die Menschen, die zu dieser Provinz gehörten.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck lautet wörtlich etwa »aus der Gefangenschaft der Verbannten«; möglich ist auch die kürzere Wiedergabe »aus der Verbannung« oder »aus der Gefangenschaft«.
    reason: lexical_alternative
  - marker: c
    text: Der Name wird auch »Nebukadrezzar« geschrieben.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: die Angehörigen der Provinz
  rationale: Wörtlich steht hier »die Söhne der Provinz«. בְּנֵי bezeichnet idiomatisch die zu einer Gruppe oder einem Gebiet gehörenden Menschen. »Angehörige der Provinz« gibt diesen Sinn in natürlichem Deutsch wieder, während die Fußnote die hebräische Bildform bewahrt.
- source_word: הָעֹלִים
  choice: die … heraufzogen
  rationale: Das Partizip von עלה bezeichnet ein Hinaufziehen. Im Zusammenhang ist die Rückkehr nach Juda und Jerusalem gemeint; »heraufzogen« bewahrt jedoch die räumliche Ausdrucksweise und nimmt וַיָּשׁוּבוּ nicht vorweg.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: aus der Gefangenschaft der Verbannten
  rationale: 'Die Wiedergabe bildet beide Bestandteile des verdichteten hebräischen Ausdrucks ab: שְׁבִי als »Gefangenschaft« und גּוֹלָה kollektiv als die Gemeinschaft der Verbannten. Die ungewöhnliche Fülle der Formulierung wird nicht zu bloß »aus dem Exil« eingeebnet.'
- source_word: הֶגְלָה
  choice: verschleppt hatte
  rationale: Der Hifil von גלה bezeichnet die erzwungene Wegführung in die Verbannung. »Verschleppt hatte« ist verständlich, historisch passend und drückt den Zwang deutlich aus.
- source_word: נבוכדנצור
  choice: Nebukadnezar
  rationale: »Nebukadnezar« ist die im Deutschen weithin geläufige Namensform. Eine abweichende, dem Hebräischen teilweise näher folgende Schreibweise wird in der Fußnote genannt.
- source_word: וַיָּשׁוּבוּ
  choice: Sie kehrten … zurück
  rationale: שׁוב bezeichnet hier ausdrücklich die Rückkehr. Ein neuer deutscher Satz schafft Klarheit, ohne den inhaltlichen Zusammenhang zu verändern.
- source_word: לִירוּשָׁלַם וִיהוּדָה
  choice: nach Jerusalem und Juda
  rationale: Die beiden Zielangaben werden unmittelbar wiedergegeben. Das einmalige »nach« ist im Deutschen natürlich und gilt eindeutig für beide Namen.
- source_word: אִישׁ לְעִירוֹ
  choice: jeder in seine Stadt
  rationale: 'אִישׁ ist hier distributiv: Jede einzelne Person kehrte in die ihr zugehörige Stadt zurück. »Jeder in seine Stadt« bewahrt die singularische, maskuline Form und bleibt knapp und verständlich.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verwaltungseinheit wird historisch sachgerecht als »Provinz« bezeichnet. Die hebräische Aufstiegsmetapher und die ungewöhnlich volle Wendung für die Gefangenschaft im Exil bleiben erkennbar; der lange hebräische Satz wird zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert.
