translation:
  language: de
  text: Ihre Sklaven und Sklavinnen[a] nicht mitgerechnet, waren es 7.337; außerdem hatten sie 200 Sänger und Sängerinnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diener und Dienerinnen«. Die hebräischen Wörter können allgemein Hausbedienstete bezeichnen; in dieser Zählliste macht »Sklaven und Sklavinnen« ihren abhängigen, unfreien Status deutlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: Dazu kamen
  rationale: Die Präposition kennzeichnet Personen, die zusätzlich zu der zuvor genannten Gesamtzahl gezählt werden; die Formulierung ist im Deutschen natürlich und stellt den additiven Sinn klar heraus.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: ihre Sklaven und Sklavinnen
  rationale: Die beiden Begriffe bezeichnen männliche und weibliche abhängige Hausangehörige und können je nach Kontext auch mit »Diener« und »Dienerinnen« wiedergegeben werden. In dieser Aufstellung bildet »Sklaven und Sklavinnen« ihren rechtlich und sozial unfreien Status am deutlichsten ab.
- source_word: אֵלֶּה שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: insgesamt 7.337
  rationale: Die knappe deutsche Zusammenfassung gibt die genaue Zahl der unmittelbar zuvor genannten Personen idiomatisch wieder. Ziffern erleichtern die Lesbarkeit innerhalb der Zählliste.
- source_word: וְלָהֶם
  choice: außerdem hatten sie
  rationale: Die hebräische Besitzkonstruktion wird natürlich deutsch wiedergegeben; »außerdem« verdeutlicht den weiteren Zusatz zur Aufstellung.
- source_word: מְשֹׁרְרִים וּמְשֹׁרְרוֹת
  choice: Sänger und Sängerinnen
  rationale: Die ausdrücklich männliche und weibliche Form des Hebräischen wird im Deutschen bewahrt.
- source_word: מָאתָיִם
  choice: '200'
  rationale: Die Zahl wird exakt wiedergegeben; Ziffern entsprechen dem übersichtlichen Stil einer Zählliste.
