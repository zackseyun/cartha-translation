base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/042.yaml
  text: 'The sons of the gatekeepers: the sons of Shallum, the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, all together one hundred thirty-nine.'
translation:
  language: de
  text: 'Die Nachkommen der Torwächter: die Nachkommen Schallums, die Nachkommen Aters, die Nachkommen Talmons, die Nachkommen Akkubs, die Nachkommen Hatitas und die Nachkommen Schobais – insgesamt 139.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: In dieser Rückkehrer- und Sippenliste bezeichnet בְּנֵי die zu einem Ahnherrn gehörenden Nachkommen beziehungsweise Familienverbände. „Nachkommen“ gibt die gemeinte Zugehörigkeit im heutigen Deutsch natürlicher und weniger missverständlich wieder als das wörtliche „Söhne“.
- source_word: הַשֹּׁעֲרִים
  choice: der Torwächter
  rationale: Das Wort bezeichnet die für Bewachung und Dienst an den Toren, hier im kultischen Zusammenhang, zuständigen Personen. „Torwächter“ ist die klare, gegenwärtige deutsche Bezeichnung.
- source_word: שַׁלּוּם
  choice: Schallum
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamenschreibung wiedergegeben.
- source_word: אָטֵר
  choice: Ater
  rationale: Der Personenname wird transliteriert.
- source_word: טַלְמוֹן
  choice: Talmon
  rationale: Der Personenname wird transliteriert.
- source_word: עַקּוּב
  choice: Akkub
  rationale: Die Schreibung gibt die Verdopplung des Konsonanten in einer im Deutschen gut lesbaren Form wieder.
- source_word: חֲטִיטָא
  choice: Hatita
  rationale: Der Personenname wird entsprechend der masoretischen Vokalisierung transliteriert.
- source_word: שֹׁבָי
  choice: Schobai
  rationale: Der Personenname wird entsprechend der masoretischen Vokalisierung und deutscher Lautkonvention wiedergegeben.
- source_word: הַכֹּל
  choice: insgesamt
  rationale: In der Zählliste leitet der Ausdruck die Gesamtsumme der zuvor genannten Gruppen ein; „insgesamt“ ist dafür die natürliche deutsche Formulierung.
- source_word: מֵאָה שְׁלֹשִׁים וְתִשְׁעָה
  choice: '139'
  rationale: Die Zahl wird in der Listenangabe übersichtlich mit Ziffern wiedergegeben.
