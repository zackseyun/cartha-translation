lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: In dieser Rückkehrerliste bezeichnet die wiederholte Formel meist Angehörige einer Familien- oder Sippenlinie und nicht nur unmittelbare Söhne. „Nachkommen“ gibt diese Funktion im heutigen Deutsch natürlich und präzise wieder.
- source_word: בַצְלוּת
  choice: Bazlut
  rationale: Der Personen- beziehungsweise Sippenname wird nach seiner hebräischen Lautgestalt ins Deutsche übertragen; das abschließende ת wird als „t“ wiedergegeben.
- source_word: מְחִידָא
  choice: Mehida
  rationale: Der unübersetzte Eigenname wird in einer lesbaren deutschen Umschrift wiedergegeben; ח erscheint hier vereinfacht als „h“.
- source_word: חַרְשָׁא
  choice: Harscha
  rationale: Der Eigenname wird deutsch lesbar transkribiert; שׁ wird mit „sch“ wiedergegeben, der abschließende Alef nicht eigens markiert.
