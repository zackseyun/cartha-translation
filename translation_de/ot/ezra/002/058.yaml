  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: de
  text: Die Gesamtzahl der Tempeldiener[a] und der Nachkommen der Diener Salomos betrug 392.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch נְתִינִים (Netinim), eine Fachbezeichnung für eine dem Tempeldienst zugeordnete Gruppe.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: insgesamt
  rationale: Der Quantor bezeichnet hier die Gesamtsumme der beiden zuvor genannten Gruppen. Im Deutschen gibt die abschließende Formulierung mit Doppelpunkt den Sinn natürlich und eindeutig wieder.
- source_word: הַנְּתִינִים
  choice: Tempeldiener
  rationale: נְתִינִים ist eine nachexilische Fachbezeichnung für eine dem Tempeldienst zugeordnete Gruppe. „Tempeldiener“ vermittelt ihre Funktion verständlich; die Fußnote bewahrt den technischen Charakter des hebräischen Ausdrucks.
- source_word: וּבְנֵי
  choice: und die Nachkommen
  rationale: בְּנֵי bedeutet wörtlich „Söhne von“, bezeichnet hier jedoch eine über Generationen bestehende Herkunftsgruppe. „Nachkommen“ ist im modernen Deutschen sachlich genauer und schließt die genealogische Gruppe natürlich ein.
- source_word: עַבְדֵי
  choice: der Diener
  rationale: עֶבֶד kann je nach Zusammenhang „Diener“ oder „Sklave“ bedeuten. In dieser administrativen Gruppenbezeichnung ist der genaue soziale Status nicht näher bestimmt; „Diener“ bewahrt diese Offenheit besser als „Sklaven“.
- source_word: שְׁלֹמֹה
  choice: Salomos
  rationale: „Salomo“ ist die etablierte deutsche Namensform; der Genitiv bildet die hebräische Constructusverbindung natürlich ab.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: '392'
  rationale: Die Ziffernschreibung ist in einer zahlenreichen Liste übersichtlich und gibt die Kardinalzahl „dreihundertzweiundneunzig“ exakt wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Listenform wird durch einen Doppelpunkt und „insgesamt“ natürlich wiedergegeben. „Nachkommen“ vermeidet das im heutigen Deutschen leicht missverständliche rein männliche „Söhne“, während die traditionelle Gruppenbezeichnung sachlich erhalten bleibt.
