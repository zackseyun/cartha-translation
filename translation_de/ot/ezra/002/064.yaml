lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: die ganze Versammlung
  rationale: כָּל mit dem bestimmten Substantiv bezeichnet die Gesamtheit; »die ganze Versammlung« gibt die umfassende Bedeutung natürlich und ohne kirchliche Nebenbedeutung wieder.
- source_word: כְּאֶחָד
  choice: zusammen
  rationale: Die Wendung bedeutet wörtlich »wie einer« und bezeichnet hier die gemeinsame Gesamtzahl. »Zusammen« ist im Deutschen idiomatisch; die wörtliche Form bleibt in der Fußnote erhalten.
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת שִׁשִּׁים
  choice: 42.360 Menschen
  rationale: Die Zahl lautet wörtlich vier Zehntausende, zweitausend, dreihundert und sechzig, insgesamt 42.360. »Menschen« verdeutlicht natürlich, dass Personen gezählt werden, ohne die Zahl zu verändern.
