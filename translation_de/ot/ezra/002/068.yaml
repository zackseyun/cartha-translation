base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/068.yaml
  text: And some of the heads of the fathers’ houses[a], when they came to the house of Yahweh that is in Jerusalem, gave freewill offerings for the house of God[c][b], to set it up on its foundation.
translation:
  language: de
  text: Und einige von den Oberhäuptern der Sippen[a] spendeten, als sie zum Haus Jahwes in Jerusalem kamen, freiwillig für das Haus Gottes[b], um es an seiner Stätte aufzurichten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von den Häuptern der Vaterhäuser“; gemeint sind Leiter abstammungsbezogener Familienverbände oder Sippen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „brachten freiwillige Gaben für das Haus Gottes dar“. Das Verb hebt die Freiwilligkeit hervor.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „um es auf seinem Fundament aufzurichten“ beziehungsweise „um es an seinem Standort zu errichten“. Das hebräische Wort kann die feste Stätte oder das Fundament bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: Und einige von den Oberhäuptern der Sippen
  rationale: 'Das מִן ist partitativ: Gemeint sind einige, nicht alle. „Oberhäupter der Sippen“ gibt die leitenden Vertreter der israelitischen Abstammungsverbände verständlich und kulturgeschichtlich angemessen wieder.'
- source_word: בְּבוֹאָם
  choice: als sie … kamen
  rationale: בְּ mit Infinitivus constructus und Suffix bezeichnet hier den Zeitpunkt; die finite deutsche Formulierung ist natürlich und genau.
- source_word: לְבֵית יְהוָה
  choice: zum Haus Jahwes
  rationale: „Haus“ bewahrt die konkrete Bildsprache von בַּיִת; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: in Jerusalem
  rationale: Die knappe deutsche Ortsangabe gibt den identifizierenden Relativsatz idiomatisch wieder, ohne seine Aussage zu verändern.
- source_word: הִתְנַדְּבוּ
  choice: gaben … freiwillig
  rationale: Der Hitpael von נדב betont die Freiwilligkeit der Beiträge. Im Zusammenhang ist das Geben von Gaben gemeint, ohne dass das Nomen „Opfer“ ausdrücklich im Hebräischen steht.
- source_word: לְבֵית הָאֱלֹהִים
  choice: für das Haus Gottes
  rationale: Die Präposition לְ bezeichnet Ziel beziehungsweise Zweck der freiwilligen Gaben; „Haus Gottes“ wahrt die Parallelität zu „Haus Jahwes“.
- source_word: לְהַעֲמִידוֹ
  choice: um es … wieder aufzurichten
  rationale: Der Hifil von עמד bedeutet „hinstellen, aufrichten, errichten“. „Wieder“ ist durch den Wiederaufbauzusammenhang nahegelegt, während „aufrichten“ die konkrete Ausdrucksweise erhält.
- source_word: עַל מְכוֹנוֹ
  choice: an seiner festen Stätte
  rationale: מָכוֹן kann die feste Stelle, den Standort oder das Fundament bezeichnen. Die Hauptfassung wahrt die räumliche Bedeutung, ohne die mögliche Bedeutung „Fundament“ auszuschließen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht den Bundesnamen im Haupttext sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Sozialstruktur in רָאשֵׁי הָאָבוֹת
  choice: Oberhäupter der Sippen
  alternative: Häupter der Vaterhäuser
  rationale: Die Wendung bezeichnet männliche Leiter abstammungsbezogener Großfamilien oder Sippen. Die Hauptfassung ist im modernen Deutsch verständlich; die formnähere Bezeichnung wird in der Fußnote bewahrt.
- issue: Bedeutung von מְכוֹנוֹ beim Wiederaufbau des Tempels
  choice: an seiner festen Stätte
  alternative: auf seinem Fundament
  rationale: Der Ausdruck kann entweder den festgelegten Standort oder die tragende Grundlage meinen. Die Übersetzung vermeidet eine dogmatische oder architektonische Festlegung, die der hebräische Ausdruck nicht erzwingt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haus“ bewahrt die hebräische Wiederholung und Bildsprache; „Sippe“ macht die antike Verwandtschaftsstruktur verständlich. Die Stellung von [b] und [c] folgt jeweils unmittelbar der betreffenden Formulierung.
