lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: In dieser Rückkehrerliste bezeichnet בְּנֵי eine nach einem Vorfahren benannte Familien- oder Sippengruppe. „Die Söhne“ wahrt die formale Bildlichkeit des Hebräischen und ist in diesem listenartigen Zusammenhang verständlich.
- source_word: אָרַח
  choice: Arachs
  rationale: Der Personen- beziehungsweise Sippenname wird nach geläufiger deutscher Bibeltradition als „Arach“ wiedergegeben; der Genitiv macht die Zugehörigkeit natürlich verständlich.
- source_word: שְׁבַע מֵאוֹת חֲמִשָּׁה וְשִׁבְעִים
  choice: siebenhundertfünfundsiebzig
  rationale: Die hebräische Zahlenfolge ergibt 700 + 5 + 70 = 775. Das ausgeschriebene Zahlwort bewahrt den literarischen Charakter der Liste.
