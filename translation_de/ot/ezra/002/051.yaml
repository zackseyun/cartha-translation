lexical_decisions:
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Der konstruktische Plural von בֵּן wird formal wiedergegeben. In dieser genealogischen Liste kann die Wendung jedoch auch Angehörige einer Familienlinie oder Sippe bezeichnen, nicht nur unmittelbare Söhne.
- source_word: בַקְבּוּק
  choice: Bakbuk
  rationale: Der Eigenname wird nach der hebräischen Lautgestalt ins Deutsche transliteriert.
- source_word: חֲקוּפָא
  choice: Hakufa
  rationale: Der Eigenname wird in einer für heutige deutsche Leser gut lesbaren Transliteration wiedergegeben; פ ohne Dagesch wird als f dargestellt.
- source_word: חַרְחוּר
  choice: Harhur
  rationale: Der Eigenname wird nach der hebräischen Lautgestalt ins Deutsche transliteriert.
