base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/069.yaml
  text: 'According to their ability they gave to the treasury for the work: 61,000 gold darics[a], 5,000 minas of silver[b], and 100 priests’ tunics.'
translation:
  language: de
  text: 'Nach ihrem Vermögen gaben sie an die Schatzkammer für die Bauarbeiten: 61.000 Golddariken[a], 5.000 Minen Silber[b] und 100 Tuniken der Priester.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Goldmünzen“; der hebräische Ausdruck bezeichnet wahrscheinlich persische Dariken.'
    reason: lexical_alternative
  - marker: b
    text: Eine Mine war eine antike Gewichts- und Geldeinheit.
    reason: cultural_note
lexical_decisions:
- source_word: כְּכֹחָם
  choice: Nach ihrem Vermögen
  rationale: Die Wendung bezeichnet das Maß ihrer verfügbaren Mittel. „Nach ihrem Vermögen“ ist im Deutschen natürlich und bewahrt den proportionalen Sinn.
- source_word: נָתְנוּ
  choice: gaben sie
  rationale: Die einfache Wiedergabe entspricht dem gewöhnlichen Sinn von נתן und fügt keine weitere Deutung hinzu.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: für die Schatzkammer des Bauvorhabens
  rationale: אוֹצָר bezeichnet eine Schatzkammer oder einen Vorrat; מְלָאכָה meint hier das Wiederaufbauvorhaben. Die Formulierung bewahrt die Genitivbeziehung und macht den Projektbezug verständlich.
- source_word: דַּרְכְּמוֹנִים
  choice: Golddariken
  rationale: Das persische Lehnwort bezeichnet wahrscheinlich die persische Goldmünze Darike. Die historisch konkrete Bezeichnung ist genauer als das allgemeinere „Goldmünzen“.
- source_word: שֵׁשׁ רִבּוֹאות וָאֶלֶף
  choice: '61.000'
  rationale: Die wörtliche Zahl „sechs Zehntausende und eintausend“ ergibt 61.000; die Ziffernschreibung ist in der Aufzählung übersichtlich.
- source_word: מָנִים
  choice: Minen
  rationale: מָנֶה ist eine antike Gewichts- und Geldeinheit. „Mine“ ist die etablierte deutsche Fachbezeichnung und vermeidet eine ungenaue Umrechnung in moderne Maße.
- source_word: חֲמֵשֶׁת אֲלָפִים
  choice: '5.000'
  rationale: Die Zahl wird in moderner deutscher Schreibweise wiedergegeben und entspricht stilistisch den übrigen Mengenangaben.
- source_word: כָתְנֹת כֹּהֲנִים
  choice: Priestergewänder
  rationale: כֻּתֹּנֶת bezeichnet ein langes Unter- beziehungsweise Leibgewand. „Priestergewänder“ ist verständlich und lässt offen, ob Besitz oder Bestimmung im Vordergrund steht.
- source_word: מֵאָה
  choice: '100'
  rationale: Die Ziffernschreibung sorgt innerhalb der Spendenliste für Konsistenz und gute Lesbarkeit.
