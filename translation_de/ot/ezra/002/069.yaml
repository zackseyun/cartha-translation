  terminology: „Golddariken“ und „Minen“ bewahren die historischen Bezeichnungen angemessen; die Fußnoten erläutern sie ausreichend. „Tuniken“ gibt כָּתְנֹת präziser wieder als das allgemeinere „Priestergewänder“.
