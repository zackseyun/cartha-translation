base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/043.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[c][b], the sons of Tabbaoth.'
translation:
  language: de
  text: 'Die Tempeldiener: die Nachkommen Zihas, die Nachkommen Hasufas, die Nachkommen Tabbaots.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: die Tempeldiener
  rationale: Die traditionelle Bezeichnung »Netinim« wäre für heutige Leser weitgehend undurchsichtig. »Tempeldiener« gibt die Funktion dieser dem Heiligtumsdienst zugeordneten Gruppe natürlich und sachgerecht wieder.
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: In dieser nachexilischen Namensliste bezeichnet בְּנֵי eher die Angehörigen einer Familienlinie als ausschließlich unmittelbare Söhne. »Nachkommen« bewahrt den genealogischen Sinn und ist im modernen Deutsch eindeutig.
- source_word: צִיחָא
  choice: Ziha
  rationale: Der Eigenname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: חֲשׂוּפָא
  choice: Hasufa
  rationale: Der Eigenname wird in einer dem Deutschen angemessenen Form transliteriert; שׂ wird als s wiedergegeben.
- source_word: טַבָּעוֹת
  choice: Tabbaot
  rationale: In der Liste fungiert die Form als Personen- oder Sippenname und wird daher transliteriert statt nach ihrer möglichen gemeinsprachlichen Bedeutung übersetzt.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Listenregister. Die dreifache Wiederholung von בְּנֵי wird entsprechend der hebräischen Struktur beibehalten; »Nachkommen« vermeidet dabei das im Deutschen mögliche Missverständnis unmittelbarer Sohnschaft.
