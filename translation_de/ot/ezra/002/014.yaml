lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: In der Heimkehrerliste bezeichnet der Ausdruck eine Familien- oder Sippengruppe. „Nachkommen“ gibt diesen Sinn im heutigen Deutsch klarer wieder als das formal engere „Söhne“.
- source_word: בִגְוָי
  choice: Bigwai
  rationale: Der hebräische Personen- beziehungsweise Sippenname wird nach seiner hebräischen Lautgestalt transkribiert.
- source_word: אַלְפַּיִם
  choice: '2.000'
  rationale: Die Zahl bedeutet „zweitausend“ und wird im Listenstil als Ziffer wiedergegeben.
- source_word: חֲמִשִּׁים
  choice: '50'
  rationale: Die Kardinalzahl „fünfzig“ ist additiver Bestandteil der Gesamtzahl.
- source_word: וְשִׁשָּׁה
  choice: '6'
  rationale: Die Verbindung aus Konjunktion und Kardinalzahl bedeutet „und sechs“; zusammen mit den vorausgehenden Zahlen wird sie idiomatisch als Gesamtzahl 2.056 wiedergegeben.
