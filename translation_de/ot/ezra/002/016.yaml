  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: die Nachkommen
  rationale: In der Heimkehrerliste bezeichnet der Konstruktplural von בֵּן nicht nur unmittelbare Söhne, sondern Angehörige einer Familie beziehungsweise Sippe. „Nachkommen“ gibt diesen genealogischen Sinn im heutigen Deutsch natürlich wieder.
- source_word: אָטֵר
  choice: Aters
  rationale: Der Personen- beziehungsweise Familienname wird als „Ater“ transliteriert und wegen der deutschen Satzfügung in den Genitiv gesetzt.
- source_word: לִיחִזְקִיָּה
  choice: aus der Linie Hiskias
  rationale: Das vorangestellte ל kennzeichnet hier wahrscheinlich die Zugehörigkeit zu einem Unterzweig der Familie Aters. „Aus der Linie Hiskias“ macht diese Untergliederung knapp und verständlich sichtbar, ohne Hiskia mit Ater gleichzusetzen.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: '98'
  rationale: Die hebräische Kardinalzahl wird in einer zahlenreichen Namensliste übersichtlich mit Ziffern wiedergegeben.
