lexical_decisions:
- source_word: אַנְשֵׁי
  choice: die Männer von
  rationale: Die Konstruktform im Rahmen dieser Rückkehrerliste bezeichnet die männlichen Angehörigen beziehungsweise Haushaltsvertreter eines Ortes. „Die Männer von“ gibt die maskuline Form direkt und im Deutschen idiomatisch wieder.
- source_word: נְטֹפָה
  choice: Netofa
  rationale: Der Ortsname wird nach gängiger deutscher Bibeltradition und hebräischer Lautgestalt als „Netofa“ transliteriert.
- source_word: חֲמִשִּׁים וְשִׁשָּׁה
  choice: '56'
  rationale: Die hebräische Zahlverbindung bedeutet 56. Die Ziffernschreibung ist in einer Aufzählung natürlich und übersichtlich; die wörtliche Verbindung „fünfzig und sechs“ bleibt in der Fußnote erhalten.
