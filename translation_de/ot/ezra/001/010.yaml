  text: כְּפוֹרֵ֤י זָהָב֙ שְׁלֹשִׁ֔ים כְּפ֤וֹרֵי כֶ֨סֶף֙ מִשְׁנִ֔ים אַרְבַּ֥ע מֵא֖וֹת וַ/עֲשָׂרָ֑ה כֵּלִ֥ים אֲחֵרִ֖ים אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/010.yaml
  text: 30 gold bowls[a], 410 silver bowls of a second kind, and 1,000 other vessels.
translation:
  language: de
  text: 30 goldene Schalen, 410 silberne Schalen einer zweiten Art[a] und 1.000 andere Gefäße.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »silberne Schalen, doppelt: 410«. Der hier verwendete hebräische Ausdruck ist in diesem Inventarzusammenhang unsicher; er kann eine zweite Klasse, Doppelstücke oder eine doppelte Ausführung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפוֹרֵי
  choice: Schalen
  rationale: Das Substantiv bezeichnet eine Gefäßart. »Schalen« ist im Zusammenhang eines Tempelinventars verständlich und legt die genaue Form nicht unnötig fest.
- source_word: זָהָב
  choice: goldene
  rationale: Der übliche Materialbegriff wird hier attributiv auf die Gefäße bezogen.
- source_word: שְׁלֹשִׁים
  choice: '30'
  rationale: Die Zahl wird für die übersichtliche Darstellung des Inventars als Ziffer wiedergegeben.
- source_word: כְּפוֹרֵי כֶסֶף
  choice: silberne Schalen
  rationale: Derselbe Gefäßbegriff wie im ersten Satzglied wird einheitlich übersetzt; כֶסֶף bezeichnet hier das Material Silber.
- source_word: מִשְׁנִים
  choice: einer zweiten Art
  rationale: Die Bedeutung des Ausdrucks ist in diesem Inventarzusammenhang unsicher. Die Formulierung kennzeichnet vorsichtig eine zweite Gruppe oder Klasse, ohne eine mathematische Verdoppelung zu behaupten.
- source_word: אַרְבַּע מֵאוֹת וַעֲשָׂרָה
  choice: '410'
  rationale: Die zusammengesetzte Zahl wird passend zur Inventarliste als Ziffer wiedergegeben.
- source_word: כֵּלִים
  choice: Gefäße
  rationale: Der weite Begriff bezeichnet Gegenstände oder Geräte; im Zusammenhang der zuvor genannten Schalen ist »Gefäße« eine natürliche und hinreichend breite Wiedergabe.
- source_word: אֲחֵרִים
  choice: andere
  rationale: Das Adjektiv grenzt diese Gegenstände unmittelbar von den zuvor aufgeführten Gruppen ab.
- source_word: אָלֶף
  choice: '1.000'
  rationale: Die Zahl wird in deutscher Schreibweise als Ziffer wiedergegeben, einheitlich mit den übrigen Mengenangaben.
