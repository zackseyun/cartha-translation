source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה מִ/פִּ֣י יִרְמְיָ֑ה הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כֹּ֣רֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/001.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh from the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he sent a proclamation throughout all his kingdom, and also in writing[c][b], saying:'
translation:
  language: de
  text: Im ersten Jahr des Kyros, des Königs von Persien, regte Jahwe den Geist des Kyros, des Königs von Persien, an, um das Wort Jahwes zu erfüllen, das durch Jeremia ergangen war.[a][b] Kyros ließ in seinem ganzen Königreich eine Bekanntmachung ergehen, und zwar auch schriftlich:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Wort Jahwes aus dem Mund Jeremias“. Die Wendung bezeichnet Jeremia als den menschlichen Vermittler, durch den Jahwes Wort erging.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „um das Wort Jahwes zu vollenden“. Im Zusammenhang ist die Erfüllung beziehungsweise das Eintreffen des prophetischen Wortes gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „er ließ eine Stimme durch sein ganzes Königreich gehen“. Die hebräische Wendung bezeichnet die öffentliche Verbreitung einer amtlichen Bekanntmachung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Im ersten Jahr des Kyros, des Königs von Persien
  rationale: Die deutsche Datierungsformel gibt den hebräischen Temporalsatz natürlich wieder. Das anknüpfende וְ muss am Versanfang nicht eigens mit „und“ übersetzt werden. „Kyros“ ist die im Deutschen übliche Namensform.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: sollte sich das Wort Jahwes … erfüllen
  rationale: Das Verb bezeichnet hier das vollständige Eintreffen des prophetischen Wortes. „Sich erfüllen“ gibt diesen Zusammenhang idiomatisch wieder, während die Fußnote die wörtlichere Vorstellung des Vollendens bewahrt.
- source_word: מִפִּי יִרְמְיָה
  choice: aus dem Mund Jeremias
  rationale: Die Formulierung bewahrt das konkrete hebräische Bild und lässt zugleich erkennen, dass Jeremia das Wort ausgesprochen hat.
- source_word: הֵעִיר יְהוָה אֶת רוּחַ כֹּרֶשׁ
  choice: weckte Jahwe den Geist des Kyros
  rationale: „Weckte“ entspricht dem Kausativ von עור, und „Geist“ wahrt die Bedeutungsbreite von רוּחַ zwischen innerer Haltung, Antrieb und Geist.
- source_word: וַיַּעֲבֶר קוֹל בְּכָל מַלְכוּתוֹ
  choice: Dieser ließ in seinem ganzen Königreich einen Aufruf ergehen
  rationale: Die deutsche Wendung „einen Aufruf ergehen lassen“ gibt das öffentliche Verbreiten einer amtlichen Bekanntmachung wieder. „Dieser“ kennzeichnet Kyros als den Handelnden, ohne den Namen unnötig zu wiederholen.
- source_word: וְגַם בְּמִכְתָּב
  choice: und ihn auch schriftlich verbreiten
  rationale: Das Hebräische betont, dass die Bekanntmachung zusätzlich schriftlich erging. Das Pronomen bindet die Angabe im Deutschen klar an den Aufruf.
- source_word: לֵאמֹר
  choice: 'Er lautete:'
  rationale: Vor dem folgenden Erlasstext ist „Er lautete:“ im Deutschen natürlicher als das formale „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ ist dessen geläufige deutsche Wiedergabe und ersetzt ihn nicht durch einen Titel.
- issue: Verhältnis von prophetischem Wort und geschichtlichem Geschehen
  choice: sollte sich das Wort Jahwes … erfüllen
  alternative: um das Wort Jahwes … zu vollenden
  rationale: Die Formulierung beschreibt den Erlass des Kyros als Eintreffen des durch Jeremia vermittelten Gotteswortes, ohne näher festzulegen, wie göttliche Absicht und menschliches Handeln zusammenwirken.
- issue: Bedeutung von רוּחַ bei Kyros
  choice: Geist des Kyros
  alternative: Sinn des Kyros
  rationale: „Geist“ bewahrt die Mehrdeutigkeit zwischen innerer Haltung, Willensantrieb und geistiger Dimension, statt die Aussage psychologisch einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange hebräische Satz wurde zur besseren Verständlichkeit gegliedert, ohne seine Kausal- und Zweckbeziehungen aufzulösen. Die Wiederholung des Königstitels bleibt erhalten; konkrete hebräische Bilder werden im Haupttext oder in den Fußnoten bewahrt.
