source:
  edition: WLC
  text: וְ/כָל סְבִיבֹֽתֵי/הֶם֙ חִזְּק֣וּ בִֽ/ידֵי/הֶ֔ם בִּ/כְלֵי כֶ֧סֶף בַּ/זָּהָ֛ב בָּ/רְכ֥וּשׁ וּ/בַ/בְּהֵמָ֖ה וּ/בַ/מִּגְדָּנ֑וֹת לְ/בַ֖ד עַל כָּל הִתְנַדֵּֽב־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/006.yaml
  text: And all those around them strengthened their hands with vessels of silver[a], with gold, with goods, with livestock, and with precious things[b], besides all that was freely offered.
translation:
  language: de
  text: Und alle, die rings um sie wohnten, unterstützten sie mit silbernen Gefäßen, mit Gold, mit Gütern, mit Vieh und mit Kostbarkeiten – zusätzlich zu allem, was freiwillig gegeben wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zusätzlich zu jeder freiwilligen Gabe«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתֵיהֶם
  choice: alle, die rings um sie wohnten
  rationale: Die Wendung bezeichnet die Menschen in ihrer Umgebung, ohne sie enger als unmittelbare Nachbarn festzulegen.
- source_word: חִזְּקוּ בִידֵיהֶם
  choice: unterstützten sie
  rationale: Das hebräische Idiom bedeutet wörtlich »stärkten ihre Hände«, bezeichnet hier aber konkrete materielle Hilfe. Die sinngemäße Wiedergabe ist im modernen Deutschen klar und natürlich.
- source_word: בִּכְלֵי כֶסֶף
  choice: mit silbernen Gefäßen
  rationale: כְּלִי kann Gefäß, Gerät oder Gegenstand bedeuten. Im Zusammenhang der aufgezählten Wertgaben ist »Gefäße« eine sachlich passende, formal nahe Wiedergabe.
- source_word: בַּזָּהָב
  choice: mit Gold
  rationale: Der bloße Stoffname setzt die Liste der bereitgestellten Gaben fort; eine Ergänzung wie »Gegenständen aus« ist im Hebräischen nicht ausdrücklich vorhanden.
- source_word: בָּרְכוּשׁ
  choice: mit Gütern
  rationale: רְכוּשׁ bezeichnet Besitz beziehungsweise bewegliche Habe. »Güter« passt zur Aufzählung materieller Unterstützung, ohne Grundbesitz nahezulegen.
- source_word: וּבַבְּהֵמָה
  choice: mit Vieh
  rationale: בְּהֵמָה ist hier kollektiv für Nutz- und Haustiere als Besitz gebraucht; »Vieh« gibt diesen wirtschaftlichen Sinn knapp wieder.
- source_word: וּבַמִּגְדָּנוֹת
  choice: mit Kostbarkeiten
  rationale: מִגְדָּנוֹת kann wertvolle oder erlesene Dinge, teils auch Delikatessen, bezeichnen. »Kostbarkeiten« bewahrt hier die notwendige semantische Breite.
- source_word: לְבַד עַל כָּל הִתְנַדֵּב
  choice: zusätzlich zu allem, was freiwillig gegeben wurde
  rationale: Die komprimierte hebräische Formulierung bezeichnet freiwilliges Geben, ohne den Geber ausdrücklich zu nennen. Die passive Wiedergabe wahrt diese Unbestimmtheit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das schwer verständliche hebräische Hand-Idiom wird sinngemäß wiedergegeben; die sachliche Breite von מִגְדָּנוֹת und die unbestimmte Formulierung des freiwilligen Gebens bleiben erhalten.
