source:
  edition: WLC
  text: וַ/יּֽוֹצִיאֵ֗/ם כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס עַל יַ֖ד מִתְרְדָ֣ת הַ/גִּזְבָּ֑ר וַֽ/יִּסְפְּרֵ/ם֙ לְ/שֵׁשְׁבַּצַּ֔ר הַ/נָּשִׂ֖יא לִ/יהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/008.yaml
  text: King Cyrus of Persia brought them out by the hand of Mithredath the treasurer[a], and counted them out to Sheshbazzar[b], the prince of Judah.
translation:
  language: de
  text: Kyrus, der König von Persien, ließ sie durch den Schatzmeister Mitredat[a] herausbringen und zählte sie Scheschbazzar, dem Fürsten von Juda[b], vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand des Schatzmeisters Mitredat“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Anführer von Juda“; auch „dem Statthalter von Juda“ ist möglich. Das hebräische Wort bezeichnet allgemein einen Obersten oder Herrscher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: ließ sie ... herausbringen
  rationale: Der Hifil von יצא ist kausativ. Im Zusammenhang sind die zuvor genannten Tempelgeräte gemeint; Kyrus veranlasste, dass sie aus der Verwahrung herausgebracht wurden.
- source_word: עַל יַד
  choice: durch
  rationale: Die hebräische Wendung bedeutet wörtlich „durch die Hand von“ und bezeichnet hier die vermittelnde Person beziehungsweise den Beauftragten. „Durch“ gibt dies im modernen Deutschen natürlich wieder.
- source_word: מִתְרְדָת
  choice: Mitredat
  rationale: Transliteration des persischen Personennamens in einer im Deutschen gebräuchlichen biblischen Form.
- source_word: הַגִּזְבָּר
  choice: der Schatzmeister
  rationale: Das Wort bezeichnet einen mit dem Schatz beziehungsweise der Schatzkammer betrauten Beamten; „Schatzmeister“ ist präzise und verständlich.
- source_word: וַיִּסְפְּרֵם
  choice: zählte sie ... zu
  rationale: ספר bedeutet hier zählen oder einzeln erfassen. Die Formulierung verbindet das Zählen mit der Übergabe an Scheschbazzar, ohne mehr als den Kontext auszudrücken.
- source_word: לְשֵׁשְׁבַּצַּר
  choice: Scheschbazzar
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: הַנָּשִׂיא
  choice: der Fürst
  rationale: נָשִׂיא bezeichnet allgemein einen hervorgehobenen Obersten, Anführer oder Fürsten. „Fürst“ wahrt die traditionelle Würdebezeichnung, ohne den spezielleren persischen Verwaltungstitel „Statthalter“ einzutragen.
- source_word: לִיהוּדָה
  choice: von Juda
  rationale: Die Präposition kennzeichnet hier Scheschbazzars Beziehung zu Juda. Zusammen mit „Fürst“ ist „von Juda“ die natürliche deutsche Wiedergabe.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Kyrus, der König von Persien
  rationale: Die Apposition gibt Namen, Herrschertitel und Reich vollständig und in natürlicher deutscher Wortstellung wieder.
theological_decisions:
- issue: Amtsbezeichnung Scheschbazzars
  choice: Fürst von Juda
  alternative: Anführer beziehungsweise Statthalter von Juda
  rationale: Der hebräische Ausdruck נָשִׂיא ist breiter als ein bestimmter persischer Verwaltungstitel. Die Übersetzung bewahrt diese Offenheit und erklärt die Alternativen in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung macht Kyrus als veranlassendes Subjekt deutlich und wahrt zugleich Mitredats vermittelnde Rolle. Die Pronomen beziehen sich im Kontext auf die Tempelgeräte des vorherigen Verses.
