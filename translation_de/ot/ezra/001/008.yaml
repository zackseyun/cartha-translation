  rationale: Die Revision ersetzt ausschließlich das missverständliche „zählte … zu“ durch „zählte … vor“. Dies wahrt die Aussage, dass die zuvor genannten Geräte für bzw. gegenüber Scheschbazzar gezählt wurden, ohne eine über den Text hinausgehende administrative Übergabeform zu behaupten. Fußnotenanker und Fußnoten bleiben korrekt zugeordnet.
