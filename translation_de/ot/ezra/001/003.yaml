  text: מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהִ֤י אֱלֹהָי/ו֙ עִמּ֔/וֹ וְ/יַ֕עַל לִ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/יהוּדָ֑ה וְ/יִ֗בֶן אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל ה֥וּא הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/003.yaml
  text: Whoever among all his people is among you[a], may his God be with him, and let him go up to Jerusalem, which is in Judah, and rebuild the house of Yahweh[b], the God of Israel—he is the God who is in Jerusalem.
translation:
  language: de
  text: Wer auch immer unter euch zu seinem Volk gehört – sein Gott sei mit ihm –, der soll nach Jerusalem, das in Juda liegt, hinaufziehen und das Haus Jahwes, des Gottes Israels, wieder aufbauen[a]. Er ist der Gott, der in Jerusalem ist[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bauen“. Das hebräische Verb bedeutet grundsätzlich „bauen“; „wieder aufbauen“ verdeutlicht den Zusammenhang der Wiederherstellung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder knapper: „Er ist Gott, der in Jerusalem ist.“ Der bestimmte Artikel im Hebräischen spricht jedoch für „der Gott“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Wer unter euch zu seinem ganzen Volk gehört
  rationale: מִי leitet hier im Zusammenhang des königlichen Aufrufs eine offene Einladung ein. Die Formulierung bewahrt sowohl „unter euch“ als auch den Bezug auf „sein ganzes Volk“, ohne das Bezugswort des Suffixes erläuternd in den Text einzutragen.
- source_word: יְהִי אֱלֹהָיו עִמּוֹ
  choice: sein Gott sei mit ihm
  rationale: Der Jussiv יְהִי wird als Segenswunsch wiedergegeben. Der deutsche Konjunktiv „sei“ wahrt den feierlichen und zugleich natürlichen Ton.
- source_word: וְיַעַל
  choice: Er soll … hinaufziehen
  rationale: עלה ist die übliche Wendung für den Weg hinauf nach Jerusalem. „Hinaufziehen“ erhält sowohl die geografische als auch die kultische Färbung.
- source_word: לִירוּשָׁלַם אֲשֶׁר בִּיהוּדָה
  choice: nach Jerusalem, das in Juda liegt
  rationale: Der Relativsatz identifiziert Jerusalem geografisch. Diese Wiedergabe bleibt nahe an der hebräischen Satzgestalt und klingt im modernen Deutschen verständlich.
- source_word: וְיִבֶן
  choice: wieder aufbauen
  rationale: בנה bedeutet grundsätzlich „bauen“. Im Zusammenhang der Rückkehr aus dem Exil und des zerstörten Tempels macht „wieder aufbauen“ die situationsbedingte Bedeutung deutlich; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ bewahrt die hebräische Ausdrucksweise, bleibt aber als Bezeichnung des Tempels verständlich. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: des Gottes Israels
  rationale: Die Genitivverbindung gibt die hebräische Constructusverbindung unmittelbar und idiomatisch wieder.
- source_word: הוּא הָאֱלֹהִים
  choice: Er ist der Gott
  rationale: Der bestimmte Artikel bei אֱלֹהִים spricht für „der Gott“. Das vorangestellte Pronomen wird durch „Er“ ausdrücklich bewahrt.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: der in Jerusalem ist
  rationale: Der Relativsatz wird entsprechend dem masoretischen Wortlaut auf „der Gott“ bezogen. Die örtliche Aussage bleibt ohne harmonisierende Abschwächung erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen erkennbar wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Ortsbezogene Aussage über Gott
  choice: Er ist der Gott, der in Jerusalem ist
  alternative: Er ist Gott, der in Jerusalem ist; abschwächende Umschreibung des Ortsbezugs
  rationale: Die Formulierung wird als Bestandteil des historischen Erlasses des Kyrus in ihrer Spannung bewahrt. Die Übersetzung fügt keine spätere theologische Präzisierung ein und schwächt die Verbindung mit Jerusalem nicht ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Segenswunsch wird mit dem natürlichen Konjunktiv „sei“ wiedergegeben; „hinaufziehen“ und „Haus Jahwes“ erhalten die biblische Bildsprache, ohne altertümliche Satzformen zu erzwingen.
