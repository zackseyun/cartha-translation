    rationale: „Gemeint ist das Heiligtum“ ist erklärend und nicht als notwendige Textinformation ausgewiesen; „in den Tempel“ übernimmt zudem die im Entwurf problematische Zielrichtung. Eine reine lexikalische Alternative ist ausreichender.
