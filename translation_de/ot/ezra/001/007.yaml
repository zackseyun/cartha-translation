    rationale: Das hebräische הוֹצִיא ist hier ein aktiv transitives „brachte ... heraus“. Die deutsche Umschreibung mit „ließ“ legt zusätzlich eine bloße Veranlassung durch Kyrus nahe, die der Text nicht ausdrücklich markiert.
  - severity: medium
    issue: „in das Haus seines Gottes gestellt hatte“
    rationale: Die Präposition בְּ bezeichnet hier den Ort der Aufbewahrung. Deutsch sollte daher „im Haus seines Gottes“ lauten; eine Formulierung wie „untergebracht“ gibt die durch נתן ausgedrückte Deponierung wieder, ohne eine bestimmte Art des Aufstellens zu behaupten.
  - severity: low
