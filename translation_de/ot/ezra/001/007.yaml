  text: וְ/הַ/מֶּ֣לֶךְ כּ֔וֹרֶשׁ הוֹצִ֖יא אֶת כְּלֵ֣י בֵית יְהוָ֑ה אֲשֶׁ֨ר הוֹצִ֤יא נְבֽוּכַדְנֶצַּר֙ מִ/יר֣וּשָׁלִַ֔ם וַֽ/יִּתְּנֵ֖/ם בְּ/בֵ֥ית אֱלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/007.yaml
  text: And King Cyrus brought out the vessels of the house of Yahweh[b][a], which Nebuchadnezzar had brought out from Jerusalem and had put in the house of his god.
translation:
  language: de
  text: Und König Kyrus brachte die Geräte aus dem Haus Jahwes[a] heraus, die Nebukadnezar aus Jerusalem herausgebracht und im Haus seines Gottes[b] untergebracht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Tempel Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Tempel seines Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ
  choice: König Kyrus
  rationale: Die im Deutschen übliche Stellung des Königstitels vor dem Eigennamen gibt die hebräische Wortgruppe natürlich wieder.
- source_word: הוֹצִיא
  choice: ließ ... herausholen
  rationale: Der Hifil von יצא bezeichnet ein Veranlassen des Herausgehens. Bei einem König ist die kausative Formulierung idiomatisch und lässt offen, wer die Gegenstände tatsächlich holte.
- source_word: כְּלֵי
  choice: Geräte
  rationale: Im Tempelzusammenhang bezeichnet כְּלִים kultische Gegenstände beziehungsweise Gerätschaften, ohne ihre genaue Art festzulegen.
- source_word: בֵית יְהוָה
  choice: Haus Jahwes
  rationale: Die Wiedergabe bewahrt das hebräische Bild vom 'Haus' und ist im Kontext als Heiligtum verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname wird transliteriert und nicht durch einen Titel ersetzt; 'Jahwe' ist die etablierte moderne deutsche Form.
- source_word: הוֹצִיא ... מִירוּשָׁלִַם
  choice: aus Jerusalem weggebracht
  rationale: Beim zweiten Vorkommen bezeichnet das Verb das frühere Entfernen aus Jerusalem. 'Weggebracht' ist im Deutschen natürlich und erhält den Bezug zur Bewegung aus einem Ort.
- source_word: וַיִּתְּנֵם
  choice: gestellt hatte
  rationale: נתן hat hier mit der Ortsangabe den Sinn 'hinstellen/unterbringen'. Das Plusquamperfekt ordnet beide Handlungen Nebukadnezars zeitlich vor der Handlung des Kyrus ein.
- source_word: בְּבֵית אֱלֹהָיו
  choice: in das Haus seines Gottes
  rationale: Die Form ist singular und besitzt ein Suffix der 3. Person maskulin Singular. 'Haus' erhält die bewusste lexikalische Parallele zum Haus Jahwes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen. Seine Transliteration bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung der Gottheit Nebukadnezars
  choice: seines Gottes
  alternative: seiner Götter
  rationale: אֱלֹהָיו ist hier grammatisch singularisch zu verstehen; die Übersetzung vermeidet eine aus dem geschichtlichen Umfeld eingetragene Mehrzahl.
- issue: Lexikalische Parallele der beiden Heiligtümer
  choice: Haus Jahwes ... Haus seines Gottes
  alternative: Tempel Jahwes ... Tempel seines Gottes
  rationale: Die Wiederholung von בֵית wird erhalten und damit auch der im Vers angelegte Kontrast, ohne eine weitergehende theologische Gleichsetzung zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, wird aber durch das deutsche Plusquamperfekt zeitlich klar gegliedert. Die Formulierung vermeidet konfessionell geprägte Zusätze.
