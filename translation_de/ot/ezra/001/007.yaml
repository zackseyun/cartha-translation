revisions:
- from: Und König Kyrus ließ die Geräte aus dem Haus Jahwes[a] herausholen, die Nebukadnezar aus Jerusalem weggebracht und in das Haus seines Gottes[b] gestellt hatte.
  to: Und König Kyrus brachte die Geräte aus dem Haus Jahwes[a] heraus, die Nebukadnezar aus Jerusalem herausgebracht und im Haus seines Gottes[b] untergebracht hatte.
  rationale: Die Revision ersetzt die überstarke kausative Umschreibung durch die direkte transitive Wiedergabe von הוֹצִיא und korrigiert die Ortsrelation bei בְּבֵית zu „im Haus“. Die zeitliche Vorordnung der Handlungen Nebukadnezars bleibt durch das Plusquamperfekt erhalten. Beide Fußnoten bieten nun ausschließlich tragfähige lexikalische Alternativen.
