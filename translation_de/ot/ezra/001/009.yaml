source:
  edition: WLC
  text: וְ/אֵ֖לֶּה מִסְפָּרָ֑/ם אֲגַרְטְלֵ֨י זָהָ֜ב שְׁלֹשִׁ֗ים אֲגַרְטְלֵי כֶ֨סֶף֙ אָ֔לֶף מַחֲלָפִ֖ים תִּשְׁעָ֥ה וְ/עֶשְׂרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/009.yaml
  text: 'And this was their number: 30 gold basins[a], 1,000 silver basins, and 29 knives.'
translation:
  language: de
  text: 'Und dies war ihre Anzahl: 30 goldene Schalen, 1.000 silberne Schalen und 29 Messer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder möglicherweise „29 andere Gefäße“, „29 gleichartige Gefäße“ oder „29 Ersatzgefäße“; die Bedeutung des hebräischen Ausdrucks ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה מִסְפָּרָם
  choice: Und dies war ihre Anzahl
  rationale: Die hebräische Einleitungsformel lautet wörtlich etwa „Und diese – ihre Anzahl“. Die gewählte Form gibt sie als natürlichen deutschen Inventarsatz wieder.
- source_word: אֲגַרְטְלֵי
  choice: Schalen
  rationale: Das seltene Wort bezeichnet hier Gefäße im Tempelinventar. „Schalen“ ist verständlich und wahrt die allgemeine Gefäßbezeichnung; auch „Becken“ ist möglich.
- source_word: זָהָב / כֶסֶף
  choice: goldene / silberne
  rationale: Die Stoffangaben werden im Deutschen idiomatisch als Adjektive zu den Gefäßen wiedergegeben.
- source_word: שְׁלֹשִׁים / אָלֶף / תִּשְׁעָה וְעֶשְׂרִים
  choice: 30 / 1.000 / 29
  rationale: Arabische Ziffern passen zur übersichtlichen Darstellung einer Inventarliste; die deutsche Tausendergliederung wird verwendet.
- source_word: מַחֲלָפִים
  choice: Messer
  rationale: „Messer“ ist eine traditionsreiche und im Zusammenhang mit Tempelgeräten plausible Deutung. Da Bedeutung und möglicherweise auch Textüberlieferung unsicher sind, werden andere Deutungen in einer Fußnote genannt.
theological_decisions: []
