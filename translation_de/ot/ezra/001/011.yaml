  text: כָּל כֵּלִים֙ לַ/זָּהָ֣ב וְ/לַ/כֶּ֔סֶף חֲמֵ֥שֶׁת אֲלָפִ֖ים וְ/אַרְבַּ֣ע מֵא֑וֹת הַ/כֹּ֞ל הֶעֱלָ֣ה שֵׁשְׁבַּצַּ֗ר עִ֚ם הֵעָל֣וֹת הַ/גּוֹלָ֔ה מִ/בָּבֶ֖ל לִ/ירוּשָׁלִָֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/011.yaml
  text: All the articles of gold and silver were five thousand four hundred in all[c][b][a]. Sheshbazzar brought them up with the exiles when they were brought up from Babylon to Jerusalem.
translation:
  language: de
  text: Alle Geräte aus Gold und Silber waren insgesamt fünftausendvierhundert.[a] Scheschbazzar brachte sie hinauf, als die Exilsgemeinschaft[b] aus Babel nach Jerusalem hinaufgeführt wurde.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Geräte“ kann hier auch mit „Gefäße“ oder allgemeiner mit „Gegenstände“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Verbannten“ oder „die Deportierten“.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen steht in diesem Vers zweimal „hinauf“; dies entspricht der üblichen Ausdrucksweise für den Weg nach Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל כֵּלִים
  choice: Alle Geräte
  rationale: כְּלִי ist ein weiter Sachbegriff für Gerät, Gefäß oder sonstigen Gegenstand. Im Zusammenhang des Tempelschatzes ist „Geräte“ im Deutschen natürlich und hinreichend umfassend.
- source_word: לַזָּהָב וְלַכֶּסֶף
  choice: aus Gold und Silber
  rationale: Die mit ל gebildeten Ausdrücke ordnen die Gegenstände hier ihrem Material zu; „aus Gold und Silber“ gibt dies idiomatisch wieder.
- source_word: חֲמֵשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת הַכֹּל
  choice: waren insgesamt fünftausendvierhundert
  rationale: הַכֹּל bezeichnet die Gesamtsumme. Die Formulierung bewahrt die Zahl des hebräischen Textes und liest sich als deutsche Mengenangabe natürlich.
- source_word: הֶעֱלָה
  choice: brachte … hinauf
  rationale: Der Hifil von עלה bedeutet „hinaufbringen“. „Hinauf“ bewahrt die im Hebräischen übliche Aufstiegsrichtung nach Jerusalem.
- source_word: שֵׁשְׁבַּצַּר
  choice: Scheschbazzar
  rationale: Der Personenname wird in einer im Deutschen geläufigen, lautnahen Form wiedergegeben.
- source_word: הֵעָלוֹת הַגּוֹלָה
  choice: als die Weggeführten … hinaufgeführt wurden
  rationale: Der Hifil-Infinitiv bezeichnet den begleitenden zeitlichen Umstand und hat kausativ-passiven Sinn. Die temporale Nebensatzform ist klares Deutsch und bewahrt diese Verbform.
- source_word: הַגּוֹלָה
  choice: die Weggeführten
  rationale: Das Nomen kann Exil, Exilsgemeinschaft oder Deportierte bezeichnen. Hier sind die aus Babel zurückkehrenden Menschen gemeint; „Weggeführte“ hält zugleich den Bezug zur Deportation fest.
- source_word: מִבָּבֶל לִירוּשָׁלִָם
  choice: aus Babel nach Jerusalem
  rationale: Direkte Wiedergabe von Ausgangspunkt und Ziel; „Babel“ entspricht der traditionellen deutschen Namensform des biblischen Ortsnamens.
theological_decisions:
- issue: Aufstiegssprache für den Weg nach Jerusalem
  choice: Das zweimalige עלה wird mit „hinaufbrachte/hinaufgeführt“ bewahrt.
  alternative: Nur „brachte/geführt“ oder „zog“ ohne Richtungsangabe.
  rationale: Die Wiederholung gehört zur geographischen und literarischen Ausdrucksweise des Textes. Ihre Beibehaltung fügt keine besondere Lehrdeutung hinzu.
- issue: Bedeutung von הַגּוֹלָה
  choice: 'Personenbezug: „die Weggeführten“'
  alternative: 'Abstrakter Zustandsbezug: „das Exil“ oder kollektiv „die Exilsgemeinschaft“'
  rationale: Im Satz wird eine Gruppe aus Babel nach Jerusalem gebracht; deshalb liegt der Personenbezug nahe. Die mögliche kollektive Nuance wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „hinauf“ ist bewusst quellennah; die etwas markierte Passivform bewahrt den Hifil des zweiten Verbs. Zahlwort ausgeschrieben für flüssige biblische Prosa.
