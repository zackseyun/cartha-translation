  to: Alle Geräte aus Gold und Silber waren insgesamt fünftausendvierhundert.[a] Scheschbazzar brachte sie hinauf, als die Exilsgemeinschaft[b] aus Babel nach Jerusalem hinaufgeführt wurde.[c]
  rationale: Die Änderung ersetzt die individualisierende und stärker deportationsbezogene Formulierung „die Weggeführten“ durch die kollektiv präzisere „Exilsgemeinschaft“. Die übrige Formulierung bleibt erhalten, einschließlich der zweimaligen Aufstiegsrichtung und der passivisch-kausativen Wiedergabe des zweiten hebräischen Hifil.
