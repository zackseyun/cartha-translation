  terminology: „Geräte aus Gold und Silber“ ist für כֵּלִים im Tempelinventar angemessen; die Fußnote wahrt die weiteren lexikalischen Möglichkeiten. „Scheschbazzar“, „Babel“ und „Jerusalem“ sind konsistent und im modernen deutschen Bibelregister passend. Die Fußnote zur Aufstiegssprache ist sachlich korrekt.
