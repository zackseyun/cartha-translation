  text: וְ/כָל הַ/נִּשְׁאָ֗ר מִֽ/כָּל הַ/מְּקֹמוֹת֮ אֲשֶׁ֣ר ה֣וּא גָֽר שָׁם֒ יְנַשְּׂא֨וּ/הוּ֙ אַנְשֵׁ֣י מְקֹמ֔/וֹ בְּ/כֶ֥סֶף וּ/בְ/זָהָ֖ב וּ/בִ/רְכ֣וּשׁ וּ/בִ/בְהֵמָ֑ה עִם הַ֨/נְּדָבָ֔ה לְ/בֵ֥ית הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/004.yaml
  text: And everyone who remains[a], in any place where he is living, let the men of his place support him with silver and gold, with goods and with livestock[c][b], together with the freewill offering for the house of God that is in Jerusalem.
translation:
  language: de
  text: Und jeder, der übrig bleibt, wo immer er wohnt[a], den sollen die Männer seines Ortes[b] mit Silber und Gold, mit Gütern und Vieh unterstützen[c], zusammen mit der freiwilligen Gabe für das Haus Gottes in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wo immer er als Fremder lebt“ beziehungsweise „wo immer er sich als Fremder aufhält“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Männer seines Ortes“; gemeint sein können allgemeiner die örtlichen Einwohner oder Nachbarn.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ihm helfen“. Das hebräische Verb bedeutet wörtlich „heben/tragen“ und bezeichnet hier praktische Unterstützung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָר
  choice: jeder, der übrig bleibt
  rationale: Das Nifal-Partizip von שׁאר bezeichnet jemanden, der zurück- beziehungsweise übrig bleibt; die Formulierung wahrt den Bezug auf diejenigen, die nicht selbst aufbrechen.
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר הוּא גָר שָׁם
  choice: wo immer er sich als Fremder aufhält
  rationale: גּוּר bezeichnet häufig das Wohnen als Fremder oder Beisasse. Die Wiedergabe erhält diesen diasporischen Unterton, ohne nur einen kurzen Aufenthalt zu behaupten.
- source_word: יְנַשְּׂאֻהוּ
  choice: sollen ... ihn ... unterstützen
  rationale: נשׂא bedeutet wörtlich „heben/tragen“, bezeichnet hier angesichts der aufgezählten Mittel jedoch praktische materielle Hilfe.
- source_word: אַנְשֵׁי מְקֹמוֹ
  choice: die Männer seines Ortes
  rationale: Die ausdrücklich maskuline Constructusverbindung wird formal bewahrt; möglicherweise sind damit allgemeiner die örtlichen Einwohner oder Nachbarn gemeint.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: mit Silber und Gold
  rationale: Die traditionellen Bezeichnungen der Edelmetalle bleiben erhalten, ohne sie auf Münzgeld einzuengen.
- source_word: וּבִרְכוּשׁ
  choice: mit Gütern
  rationale: רְכוּשׁ bezeichnet Besitz beziehungsweise bewegliche Habe; „Güter“ passt knapp in die Aufzählung.
- source_word: וּבִבְהֵמָה
  choice: Vieh
  rationale: בְּהֵמָה steht kollektiv für domestizierte Tiere und wird daher natürlich als „Vieh“ wiedergegeben.
- source_word: עִם הַנְּדָבָה
  choice: zusätzlich zu der freiwilligen Gabe
  rationale: נְדָבָה ist eine aus freiem Willen gegebene Gabe. עִם verbindet sie mit der persönlichen Unterstützung; „zusätzlich zu“ macht deutlich, dass die Gabe für Gottes Haus hinzukommt.
- source_word: לְבֵית הָאֱלֹהִים אֲשֶׁר בִּירוּשָׁלָם
  choice: für das Haus Gottes in Jerusalem
  rationale: „Haus Gottes“ bewahrt die hebräische Bezeichnung, während die knappe Ortsangabe im Deutschen natürlich klingt.
theological_decisions:
- issue: Reichweite von אַנְשֵׁי מְקֹמוֹ
  choice: die Männer seines Ortes
  alternative: die Einwohner seines Ortes / seine Nachbarn
  rationale: Der hebräische Wortlaut ist grammatisch maskulin. Die Übersetzung bewahrt dies im Haupttext, während eine Fußnote die mögliche breitere soziale Referenz offenhält.
- issue: Kontextuelle Bedeutung von יְנַשְּׂאֻהוּ
  choice: unterstützen
  alternative: tragen / ihm helfen
  rationale: Ein rein wörtliches „tragen“ wäre im Deutschen wahrscheinlich körperlich verstanden. Die genannten Edelmetalle, Güter und Tiere zeigen, dass materielle Unterstützung gemeint ist.
- issue: Verhältnis der freiwilligen Gabe zur persönlichen Unterstützung
  choice: zusätzlich zu der freiwilligen Gabe
  alternative: zusammen mit der freiwilligen Gabe
  rationale: עִם kann schlicht „mit“ bedeuten. Im Kontext ist die freiwillige Gabe für Gottes Haus von den Mitteln zur Unterstützung des Rückkehrers unterschieden; „zusätzlich zu“ drückt diese naheliegende Beziehung aus, ohne die Freiwilligkeit auf die gesamte Hilfe auszudehnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem hebräischen Erlasscharakter, bleibt aber gut verständlich. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Formulierung.
