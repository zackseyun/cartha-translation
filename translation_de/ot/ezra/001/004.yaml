  naturalness: Der Satz ist grundsätzlich idiomatisches, würdiges modernes Standarddeutsch. „wo immer er wohnt“ ist im Haupttext unmittelbarer und natürlicher; die Nuance des Fremdseins kann in der Fußnote stehen.
  terminology: „Männer seines Ortes“, „Silber und Gold“, „Güter und Vieh“, „freiwillige Gabe“ und „Haus Gottes“ sind sachgerecht. „Zusammen mit“ bewahrt die offene Verbindung der freiwilligen Gabe mit den übrigen Zuwendungen, ohne deren genaue organisatorische Zuordnung zu interpretieren.
