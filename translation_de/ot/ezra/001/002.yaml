source:
  edition: WLC
  text: כֹּ֣ה אָמַ֗ר כֹּ֚רֶשׁ מֶ֣לֶךְ פָּרַ֔ס כֹּ֚ל מַמְלְכ֣וֹת הָ/אָ֔רֶץ נָ֣תַן לִ֔/י יְהוָ֖ה אֱלֹהֵ֣י הַ/שָּׁמָ֑יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֥ר בִּֽ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/002.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has appointed me to build a house for him in Jerusalem[b], which is in Judah.'
translation:
  language: de
  text: 'So spricht Kyros, der König von Persien: »Jahwe, der Gott des Himmels, hat mir alle Königreiche der Erde gegeben, und er hat mir aufgetragen[a], ihm in Jerusalem, das in Juda liegt, ein Haus[b] zu bauen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mich beauftragt.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Tempel in Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche Verkündigungs- und Erlassformel bewahrt den feierlichen Charakter des hebräischen Ausdrucks, ohne unnötig altertümlich zu wirken.
- source_word: כֹּרֶשׁ מֶלֶךְ פָּרַס
  choice: Kyrus, der König von Persien
  rationale: Der Eigenname folgt der üblichen deutschen Form; die Apposition gibt Amt und Herrschaftsgebiet ausdrücklich wieder.
- source_word: כֹּל מַמְלְכוֹת הָאָרֶץ
  choice: alle Königreiche der Erde
  rationale: Der Plural מַמְלְכוֹת wird beibehalten; הָאָרֶץ bezeichnet im Rahmen des imperialen Erlasses umfassend die Erde beziehungsweise Welt, nicht nur ein einzelnes Land.
- source_word: נָתַן לִי
  choice: hat mir … gegeben
  rationale: 'Das deutsche Perfekt bezeichnet eine vollzogene Gabe mit gegenwärtigem Ergebnis: Kyrus verfügt nun über diese Herrschaft.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen gebräuchliche Wiedergabe des Gottesnamens erhält den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: der Gott des Himmels
  rationale: Dies ist die natürliche deutsche Wiedergabe des in Esra wiederkehrenden hebräischen Gottesprädikats.
- source_word: וְהוּא
  choice: und er
  rationale: Das ausdrücklich gesetzte Pronomen und die verbindende Konjunktion werden erhalten; dadurch bleibt die Hervorhebung Jahwes als des Handelnden erkennbar.
- source_word: פָקַד עָלַי
  choice: hat mir aufgetragen
  rationale: Der Ausdruck bezeichnet hier die Übertragung eines Auftrags oder einer Verantwortung. „Aufgetragen“ verbindet diesen Sinn natürlich mit dem folgenden Infinitiv.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: ihm … ein Haus zu bauen
  rationale: „Haus“ bewahrt den unmittelbaren Wortlaut von בַיִת; dass damit der Tempel gemeint ist, wird in einer Fußnote erläutert.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: in Jerusalem, das in Juda liegt
  rationale: Der Relativsatz und damit die ausdrückliche geografische Einordnung Jerusalems werden beibehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergäbe.
- issue: Bedeutung von בַיִת im Tempelkontext
  choice: Haus
  alternative: Tempel
  rationale: Der Haupttext erhält die konkrete lexikalische Bedeutung „Haus“. Der Zusammenhang zeigt, dass das Heiligtum beziehungsweise der Tempel gemeint ist; diese sachliche Klärung steht in der Fußnote, ohne die Bild- und Wortwahl des Hebräischen zu ersetzen.
- issue: Nuance von פָקַד עָלַי
  choice: mir aufgetragen
  alternative: mich beauftragt
  rationale: Beide Wiedergaben drücken eine göttliche Beauftragung aus. „Mir aufgetragen“ lässt die Verpflichtung anklingen, ohne über den hebräischen Ausdruck hinaus einen genau bestimmten Amtsstatus zu behaupten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem Erlasston. Die direkte Rede wird typografisch markiert. Satzbau und Wortwahl bleiben nah am Hebräischen, sind aber idiomatisch deutsch; weder konfessionelle Sonderbegriffe noch unnötig archaische Formen werden verwendet.
