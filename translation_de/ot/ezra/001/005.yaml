source:
  edition: WLC
  text: וַ/יָּק֜וּמוּ רָאשֵׁ֣י הָ/אָב֗וֹת לִֽ/יהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/כֹ֨ל הֵעִ֤יר הָ/אֱלֹהִים֙ אֶת רוּח֔/וֹ לַ/עֲל֣וֹת לִ/בְנ֔וֹת אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/005.yaml
  text: Then the heads of the fathers’ houses of Judah and Benjamin[a], and the priests and the Levites[b], arose—everyone whose spirit God had stirred—to go up to build the house of Yahweh that is in Jerusalem.
translation:
  language: de
  text: Da erhoben sich die Oberhäupter der Vaterhäuser Judas und Benjamins, die Priester und die Leviten – alle, deren Geist Gott erweckt hatte[a] –, um hinaufzuziehen und das Haus Jahwes[b], das in Jerusalem ist, zu bauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „deren Geist Gott wachgerufen hatte“ oder „die Gott in ihrem Geist bewegt hatte“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Haus Jahwes“; gemeint ist der Tempel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֜וּמוּ
  choice: Da erhoben sich
  rationale: Das Qal-Wayyiqtol von קום eröffnet die Reaktion der Genannten. „Erhoben sich“ bewahrt die erzählerische Bewegung, ohne bereits die Abreise auszudrücken.
- source_word: רָאשֵׁ֣י הָאָבוֹת
  choice: die Oberhäupter der Vaterhäuser
  rationale: Die Wendung bezeichnet die führenden Männer der erweiterten, nach Abstammung gegliederten Familienverbände. „Vaterhäuser“ erhält die soziale und genealogische Struktur des Hebräischen.
- source_word: לִֽיהוּדָה֙ וּבִנְיָמִ֔ן
  choice: Judas und Benjamins
  rationale: Das Präfix ל kennzeichnet hier die Zugehörigkeit. Der deutsche Genitiv gibt die Zuordnung zu Juda und Benjamin natürlich wieder.
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: die Priester und die Leviten
  rationale: Dies sind die üblichen und sachlich genauen deutschen Bezeichnungen für die kultischen Gruppen.
- source_word: לְכֹל הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  choice: alle, deren Geist Gott erweckt hatte
  rationale: Die distributive Konstruktion bezieht sich auf jeden Einzelnen aus den zuvor genannten Gruppen. „Erweckt“ gibt Gottes vorausgehenden inneren Anstoß wieder, ohne dessen Wirkweise weiter auszudeuten.
- source_word: רוּחַ
  choice: Geist
  rationale: רוּחַ bezeichnet hier die innere Haltung oder Antriebskraft. „Geist“ erhält die hebräische Bildwelt und ihre theologische Offenheit besser als „Herz“ oder „Inneres“.
- source_word: לַעֲלוֹת
  choice: um hinaufzuziehen
  rationale: עלה ist die herkömmliche Bezeichnung für den Weg hinauf nach Jerusalem und bewahrt sowohl den geografischen als auch den traditionsgeprägten Sinn.
- source_word: לִבְנוֹת
  choice: zu bauen
  rationale: Das Verb bedeutet ausdrücklich „bauen“. Obwohl der Zusammenhang einen Wiederaufbau voraussetzt, wird das im Verb nicht eigens ausgedrückt.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Bildrede „Haus Jahwes“ bleibt erhalten; dass damit der Tempel gemeint ist, wird in einer Fußnote erläutert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: das in Jerusalem ist
  rationale: Der Relativsatz bestimmt den Ort des Hauses. Das Präsens folgt der nicht ausdrücklich vergangen markierten hebräischen Ortsangabe und vermeidet eine unnötige Festlegung hinsichtlich des zerstörten Zustands des Tempels.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ macht den Bundesnamen sichtbar, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Stärke der göttlichen Einwirkung in הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  choice: deren Geist Gott erweckt hatte
  alternative: die Gott innerlich angetrieben hatte
  rationale: Der Text schreibt den inneren Anstoß ausdrücklich Gott zu, erklärt aber nicht näher, wie dieser wirkte. Die gewählte Fassung wahrt diese Spannung zwischen göttlichem Handeln und menschlicher Reaktion.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vaterhäuser“ ist bewusst als biblisch-genealogischer Fachausdruck beibehalten; Satzbau und Gedankenstriche verdeutlichen, dass „alle, deren Geist Gott erweckt hatte“ die zuvor genannten Gruppen näher bestimmt.
