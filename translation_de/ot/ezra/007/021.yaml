base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/021.yaml
  text: 'And from me, I, King Artaxerxes, issue a decree to all the treasurers in Beyond the River: whatever Ezra the priest, the scribe of the law of the God of heaven, asks of you, let it be done diligently.'
translation:
  language: de
  text: Und von mir, König Artaxerxes, ergeht ein Erlass an alle Schatzmeister im Gebiet jenseits des Stromes:[a] Alles, worum euch Esra, der Priester und Schriftgelehrte im Gesetz des Gottes des Himmels, bittet, soll sorgfältig ausgeführt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jenseits des Stromes“ war die persische Verwaltungsbezeichnung für das Gebiet westlich des Euphrat.
    reason: cultural_note
  - marker: b
    text: 'Oder: „soll genau“ oder „soll unverzüglich ausgeführt werden“. Das aramäische Adverb fordert sorgfältige und vollständige Befolgung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי אֲנָה
  choice: Und von mir
  rationale: Bewahrt die betonte persönliche Autorisierung durch den König, ohne im Deutschen das unnatürliche doppelte „von mir, ich“ nachzuahmen.
- source_word: אַרְתַּחְשַׁסְתְּא מַלְכָּא
  choice: König Artaxerxes
  rationale: Natürliche deutsche Stellung von Titel und Name.
- source_word: שִׂים טְעֵם
  choice: ergeht der Erlass
  rationale: Gibt die aramäische Verwaltungsformel als förmliche königliche Anordnung wieder und fügt sich syntaktisch in „von mir ... ergeht“.
- source_word: לְכֹל גִּזַּבְרַיָּא
  choice: an alle Schatzmeister
  rationale: Bezeichnet knapp und verständlich die zuständigen Beamten der Schatzverwaltung.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: im Gebiet jenseits des Stromes
  rationale: Gibt die persische Verwaltungsbezeichnung verständlich wieder; „der Strom“ bezeichnet hier den Euphrat.
- source_word: כָל דִּי יִשְׁאֲלֶנְכוֹן
  choice: Alles, worum euch ... bittet
  rationale: Bewahrt den umfassenden Geltungsbereich und gibt das Verb als Bitte beziehungsweise Ersuchen wieder, ohne es zu „fordern“ zu verschärfen.
- source_word: עֶזְרָא כָהֲנָה סָפַר דָּתָא
  choice: Esra, der Priester und Schriftgelehrte im Gesetz
  rationale: „Schriftgelehrter“ wahrt die amtlich-gelehrte Funktion von סָפַר; „im Gesetz“ ist natürliches Deutsch und lässt den Bezug zum folgenden Gottesprädikat klar erkennen.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: des Gottes des Himmels
  rationale: Bewahrt den charakteristischen Gottes-Titel der persischen Zeit.
- source_word: אָסְפַּרְנָא יִתְעֲבִד
  choice: soll gewissenhaft ausgeführt werden
  rationale: Das Adverb kann sorgfältige, genaue oder zügige Ausführung bezeichnen. „Gewissenhaft“ betont die vollständige und sorgfältige Befolgung, ohne die Bedeutung einseitig auf Schnelligkeit festzulegen.
