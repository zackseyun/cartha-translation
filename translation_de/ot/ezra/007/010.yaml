  text: כִּ֤י עֶזְרָא֙ הֵכִ֣ין לְבָב֔/וֹ לִ/דְר֛וֹשׁ אֶת תּוֹרַ֥ת יְהוָ֖ה וְ/לַ/עֲשֹׂ֑ת וּ/לְ/לַמֵּ֥ד בְּ/יִשְׂרָאֵ֖ל חֹ֥ק וּ/מִשְׁפָּֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/010.yaml
  text: For Ezra had set his heart to seek the Law of Yahweh[a], and to do it[d][c][b], and to teach statutes and judgments in Israel.
translation:
  language: de
  text: Denn Esra hatte sein Herz darauf ausgerichtet, die Weisung Jahwes[a] zu erforschen[b], sie zu befolgen und in Israel Satzung und Recht zu lehren[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch יהוה (JHWH), der Gottesname; traditionell auch mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „zu suchen“, „zu befragen“ oder „zu studieren“. Das hebräische Wort kann sowohl ernsthaftes Suchen als auch gründliches Erforschen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder kollektiv: „Satzungen und Rechtsbestimmungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet den zuvor geschilderten Erfolg und die Gunst, die Esra erfuhr.
- source_word: הֵכִין לְבָבוֹ
  choice: hatte sein Herz darauf ausgerichtet
  rationale: Die hebräische Wendung bezeichnet einen bewussten, inneren Entschluss. Die deutsche Formulierung bewahrt das Bild des Herzens und klingt zugleich natürlich.
- source_word: לִדְרוֹשׁ
  choice: zu erforschen
  rationale: דרש umfasst Suchen, Nachforschen und Befragen. Im Zusammenhang mit der Tora gibt „erforschen“ die intensive, zielgerichtete Beschäftigung wieder, ohne sie auf rein akademisches Studium zu beschränken.
- source_word: תּוֹרַת יְהוָה
  choice: die Weisung Jahwes
  rationale: תּוֹרָה bezeichnet göttliche Weisung und in diesem Zusammenhang besonders die verbindliche Tora. „Weisung“ bewahrt die größere Bedeutungsbreite gegenüber dem enger klingenden deutschen Wort „Gesetz“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der Eigenname im Ausgangstext sichtbar bleibt.
- source_word: וְלַעֲשֹׂת
  choice: sie zu befolgen
  rationale: Wörtlich steht „sie zu tun“; gemeint ist die zuvor genannte Weisung. „Befolgen“ drückt diesen Vollzug in natürlichem Deutsch aus.
- source_word: וּלְלַמֵּד
  choice: zu lehren
  rationale: Das Piel von למד bezeichnet das Lehren oder Unterweisen.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Präpositionalphrase bezeichnet den Bereich, in dem Esra lehrte.
- source_word: חֹק וּמִשְׁפָּט
  choice: Satzung und Recht
  rationale: Die beiden singularischen Rechtsbegriffe werden formal bewahrt. Sie können kollektiv die göttlichen Satzungen und Rechtsbestimmungen bezeichnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ macht diesen sichtbar, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz / Tora
  rationale: Im Kontext Esras ist die verbindliche göttliche Tora gemeint. „Weisung“ hält sowohl ihren lehrenden als auch ihren rechtlich bindenden Charakter offen; „Gesetz“ wäre enger, „Tora“ stärker fachsprachlich.
- issue: Numerus von חֹק וּמִשְׁפָּט
  choice: Satzung und Recht
  alternative: Satzungen und Rechtsbestimmungen
  rationale: Der Singular des Hebräischen bleibt erhalten, ohne auszuschließen, dass beide Begriffe kollektiv gebraucht sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Dreierfolge „erforschen – befolgen – lehren“ bildet Esras innere Ausrichtung, praktische Umsetzung und öffentliche Unterweisung klar ab. Das Herzbild sowie die singularischen Rechtsbegriffe des Hebräischen bleiben erhalten.
