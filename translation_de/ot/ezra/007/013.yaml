revisions:
- from: 'Hiermit erlasse ich die Anordnung: Jeder in meinem Königreich, der zum Volk Israel, zu dessen Priestern[b] oder zu den Leviten gehört und sich freiwillig dazu bereit erklärt[a], mit dir nach Jerusalem zu gehen, darf gehen.'
  to: 'Hiermit erlasse ich die Anordnung: Jeder in meinem Königreich aus dem Volk Israel – einschließlich seiner Priester[b] und Leviten –, der freiwillig bereit ist, mit dir nach Jerusalem zu gehen, darf gehen.'
  rationale: Die Fassung stellt Israel, seine Priester und die Leviten als den im Erlass erfassten Personenkreis dar, statt die Gruppen durch eine missverständliche Zugehörigkeitskonstruktion gegeneinanderzustellen. Zugleich wird die freiwillige Bereitschaft ohne Zusatz einer formalen Erklärung wiedergegeben. Die Fußnoten und ihre Anker bleiben vollständig erhalten.
  reviewer_model: gpt-5.6-terra
