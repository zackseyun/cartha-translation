source:
  edition: WLC
  text: מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל מִתְנַדַּ֣ב בְּ/מַלְכוּתִ/י֩ מִן עַמָּ֨/ה יִשְׂרָאֵ֜ל וְ/כָהֲנ֣וֹ/הִי וְ/לֵוָיֵ֗/א לִ/מְהָ֧ךְ לִֽ/ירוּשְׁלֶ֛ם עִמָּ֖/ךְ יְהָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/013.yaml
  text: A decree is issued by me that anyone in my kingdom from the people of Israel[a], and their priests and Levites, who freely offers himself to go to Jerusalem with you[b], may go.
translation:
  language: de
  text: 'Hiermit erlasse ich die Anordnung: Jeder in meinem Königreich aus dem Volk Israel – einschließlich seiner Priester[b] und Leviten –, der freiwillig bereit ist, mit dir nach Jerusalem zu gehen, darf gehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Wörtlich: „seine Priester“. Das Suffix kann grammatisch auch auf den König bezogen werden; im Zusammenhang liegt jedoch der Bezug auf Israel nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִנִּי שִׂים טְעֵם
  choice: Hiermit erlasse ich die Anordnung
  rationale: Die aramäische Verwaltungsformel bezeichnet eine vom König ausgehende verbindliche Anordnung. Die aktive deutsche Rechtsformel ist natürlich und bewahrt den königlichen Ursprung des Erlasses.
- source_word: כָל מִתְנַדַּב
  choice: Jeder …, der sich freiwillig dazu bereit erklärt
  rationale: Das Hitpael-Partizip hebt die freiwillige, aus eigenem Entschluss erfolgende Bereitschaft hervor.
- source_word: בְּמַלְכוּתִי
  choice: in meinem Königreich
  rationale: Gemeint ist der Herrschaftsbereich des Königs; „Königreich“ ist im Deutschen klar und geläufig.
- source_word: מִן עַמָּה יִשְׂרָאֵל
  choice: zum Volk Israel … gehört
  rationale: Die Zugehörigkeitskonstruktion gibt idiomatisch wieder, aus welcher Bevölkerungsgruppe die Freiwilligen stammen.
- source_word: וְכָהֲנוֹהִי
  choice: zu dessen Priestern
  rationale: Das Suffix wird im Zusammenhang am ehesten auf Israel beziehungsweise das Volk Israel bezogen. „Dessen“ macht diesen Bezug im Deutschen deutlich, ohne die alternative grammatische Deutung zu verschweigen.
- source_word: וְלֵוָיֵא
  choice: zu den Leviten
  rationale: Dies ist die übliche deutsche Bezeichnung der genannten Tempeldienergruppe.
- source_word: לִמְהָךְ לִירוּשְׁלֶם עִמָּךְ
  choice: mit dir nach Jerusalem zu gehen
  rationale: Die Wendung bezeichnet die Reise nach Jerusalem in Begleitung Esras.
- source_word: יְהָךְ
  choice: darf gehen
  rationale: Im Kontext eines königlichen Erlasses drückt die Form gewährte Erlaubnis aus, nicht bloß eine Zukunftsaussage.
theological_decisions:
- issue: Bezugswort des Suffixes bei כָהֲנוֹהִי
  choice: dessen Priester, bezogen auf das Volk Israel
  alternative: seine Priester, bezogen auf den König
  rationale: Der unmittelbare Zusammenhang mit dem Volk Israel und den Leviten spricht für Israels Priester; die grammatisch mögliche andere Beziehung wird in einer Fußnote erhalten.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil mit einer verständlichen amtlichen Einleitungsformel. Die lange aramäische Satzstruktur wurde maßvoll gegliedert. Das deutsche „oder“ kennzeichnet die aufgeführten Zugehörigkeitsgruppen als Alternativen innerhalb des Geltungsbereichs, ohne den Sinn der aramäischen Reihung zu verändern.
