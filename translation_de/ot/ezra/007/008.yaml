base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/008.yaml
  text: And he came to Jerusalem in the fifth month[a], which was the seventh year of the king.
translation:
  language: de
  text: Und er kam im fünften Monat nach Jerusalem; es war das siebte Jahr des Königs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Und er kam
  rationale: Das Waw-Consecutiv führt die Erzählung fort; בוא wird schlicht und ohne zusätzliche Bedeutungsnuance mit „kam“ wiedergegeben.
- source_word: יְרוּשָׁלִַם
  choice: nach Jerusalem
  rationale: Bei einer Bewegung zu einer Stadt ist im Deutschen „nach Jerusalem kommen“ die natürliche Ausdrucksweise.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: im fünften Monat
  rationale: Die Präposition ב bezeichnet hier den Zeitpunkt; „im fünften Monat“ bewahrt die kalendarische Angabe klar und knapp.
- source_word: הִיא
  choice: es war
  rationale: Das feminine Pronomen greift die vorausgehende Zeitangabe auf und leitet die Bestimmung des Regierungsjahres ein. Ein eigener Hauptsatz bildet diese Funktion im Deutschen natürlich ab.
- source_word: שְׁנַת הַשְּׁבִיעִית
  choice: das siebte Jahr
  rationale: Die Status-constructus-Verbindung mit Ordinalzahl bezeichnet das siebte Regierungsjahr.
- source_word: לַמֶּלֶךְ
  choice: des Königs
  rationale: Das ל kennzeichnet in dieser Datierungsformel die Zuordnung zum König und wird idiomatisch mit dem Genitiv wiedergegeben; der Name Artaxerxes wird nicht aus dem Kontext ergänzt.
