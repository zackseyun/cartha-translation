source:
  edition: WLC
  text: כָּ/ל קֳבֵ֗ל דִּי֩ מִן קֳדָ֨ם מַלְכָּ֜/א וְ/שִׁבְעַ֤ת יָעֲטֹ֨/הִי֙ שְׁלִ֔יחַ לְ/בַקָּרָ֥א עַל יְה֖וּד וְ/לִֽ/ירוּשְׁלֶ֑ם בְּ/דָ֥ת אֱלָהָ֖/ךְ דִּ֥י בִ/ידָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/014.yaml
  text: because you are sent from before the king and his seven counselors to inquire concerning Judah and Jerusalem according to the law of your God that is in your hand[a][b].
translation:
  language: de
  text: Denn du bist vom König und seinen sieben Ratgebern beauftragt, Juda und Jerusalem nach dem Gesetz deines Gottes, das in deiner Hand ist, zu untersuchen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von vor dem König und seinen sieben Ratgebern“. Die aramäische Hofwendung betont, dass der Auftrag aus der Gegenwart des Königs kommt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das sich in deinem Besitz befindet“ beziehungsweise „das dir anvertraut ist“. Wörtlich: „das in deiner Hand ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: Denn
  rationale: Die aramäische Wendung leitet die Begründung des Erlasses ein; „Denn“ gibt den kausalen Zusammenhang im Deutschen natürlich wieder.
- source_word: מִן קֳדָם מַלְכָּא
  choice: vom König
  rationale: Wörtlich steht „von vor dem König“, eine aramäische Hofwendung für einen Auftrag aus der Gegenwart und mit der Autorität des Königs. Im modernen Deutschen vermittelt „vom König“ den amtlichen Ursprung klar; die wörtlichere Nuance wird in Fußnote [a] bewahrt.
- source_word: וְשִׁבְעַת יָעֲטֹהִי
  choice: und seinen sieben Ratgebern
  rationale: Das Substantiv bezeichnet die königlichen Berater; „Ratgeber“ ist verständlich und dem höfischen Zusammenhang angemessen.
- source_word: שְׁלִיחַ
  choice: du bist … beauftragt
  rationale: Das passive Partizip bezeichnet Esras offiziell übertragene Sendung. „Beauftragt“ bringt diesen administrativen Charakter im Deutschen natürlicher zum Ausdruck als das bloße „gesandt“.
- source_word: לְבַקָּרָא
  choice: zu untersuchen
  rationale: Das Verb umfasst Nachforschen, Prüfen und Untersuchen. Im amtlichen Kontext bezeichnet „untersuchen“ den Zweck des königlichen Auftrags präzise.
- source_word: עַל יְהוּד וְלִירוּשְׁלֶם
  choice: Juda und Jerusalem
  rationale: Nach „untersuchen“ wird das Objekt im Deutschen ohne eine zusätzliche Präposition wiedergegeben; gemeint ist eine Untersuchung hinsichtlich Juda und Jerusalems.
- source_word: בְּדָת אֱלָהָךְ
  choice: nach dem Gesetz deines Gottes
  rationale: Die Präposition bezeichnet hier wahrscheinlich das Gesetz als Maßstab der Untersuchung. „Nach“ ist die natürliche deutsche Entsprechung für „gemäß“.
- source_word: דִּי בִידָךְ
  choice: das in deiner Hand ist
  rationale: Die wörtliche Formulierung bewahrt die mögliche Bedeutungsspanne zwischen Besitz, Verwahrung und anvertrauter Autorität; Fußnote [b] erläutert diese.
theological_decisions:
- issue: Funktion des Gesetzes Gottes bei der Untersuchung
  choice: „nach dem Gesetz deines Gottes“ als Maßstab der Untersuchung
  alternative: „hinsichtlich des Gesetzes deines Gottes“ als Gegenstand der Untersuchung
  rationale: Die Präposition בְּ kann mehrere Beziehungen ausdrücken. Der Zusammenhang und die amtliche Aufgabe Esras sprechen dafür, das Gesetz als normativen Maßstab zu verstehen, ohne eine weitergehende konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit amtlichem Ton. Die höfische Wendung wird im Haupttext idiomatisch wiedergegeben, ihre konkrete Bildsprache jedoch in einer Fußnote erhalten. Die Hand-Formulierung bleibt bewusst wörtlich, um Besitz, Verwahrung und Autorität nicht vorschnell auf eine einzige Bedeutung festzulegen.
