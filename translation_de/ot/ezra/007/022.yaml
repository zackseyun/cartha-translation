source:
  edition: WLC
  text: עַד כְּסַף֮ כַּכְּרִ֣ין מְאָה֒ וְ/עַד חִנְטִין֙ כֹּרִ֣ין מְאָ֔ה וְ/עַד חֲמַר֙ בַּתִּ֣ין מְאָ֔ה וְ/עַד בַּתִּ֥ין מְשַׁ֖ח מְאָ֑ה וּ/מְלַ֖ח דִּי לָ֥א כְתָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/022.yaml
  text: up to one hundred talents of silver[a], and up to one hundred cors of wheat, and up to one hundred baths of wine, and up to one hundred baths of oil, and salt without limit.
translation:
  language: de
  text: bis zu hundert Talente Silber, bis zu hundert Kor Weizen, bis zu hundert Bat Wein, bis zu hundert Bat Öl und Salz ohne festgelegte Menge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Salz, für das nichts aufgeschrieben ist«; das heißt, ohne Angabe einer bestimmten Menge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: bis zu
  rationale: In der Verwaltungssprache bezeichnet עַד hier die jeweilige Höchstmenge.
- source_word: כְּסַף
  choice: Silber
  rationale: Das Wort bezeichnet wörtlich Silber; die Angabe in Talenten weist hier auf das nach Gewicht bemessene Metall.
- source_word: כַּכְּרִין
  choice: Talente
  rationale: Die alte Gewichtseinheit wird beibehalten, da eine Umrechnung in moderne Maße unsicher wäre.
- source_word: מְאָה
  choice: hundert
  rationale: Die Zahl wird bei jeder begrenzten Zuteilung entsprechend der aufzählenden Verwaltungssprache des Ausgangstextes wiedergegeben.
- source_word: חִנְטִין
  choice: Weizen
  rationale: Der aramäische Ausdruck bezeichnet spezifisch Weizen und nicht nur Getreide im Allgemeinen.
- source_word: כֹּרִין
  choice: Kor
  rationale: Die alte Trockenmaßeinheit wird als im Deutschen unveränderte Maßbezeichnung beibehalten.
- source_word: חֲמַר
  choice: Wein
  rationale: Der Ausdruck bezeichnet in dieser Liste von Tempelvorräten Wein.
- source_word: בַּתִּין
  choice: Bat
  rationale: Die alte Flüssigmaßeinheit wird bewahrt; nach Zahlwörtern bleibt die Maßbezeichnung im Deutschen idiomatisch ungebeugt.
- source_word: מְשַׁח
  choice: Öl
  rationale: Der Text nennt Öl, ohne ausdrücklich Olivenöl zu spezifizieren.
- source_word: מְלַח
  choice: Salz
  rationale: Direkte Wiedergabe der zuletzt genannten Ware.
- source_word: דִּי לָא כְתָב
  choice: ohne festgelegte Menge
  rationale: Wörtlich ist die Menge des Salzes „nicht aufgeschrieben“; im administrativen Zusammenhang bedeutet dies, dass dafür keine bestimmte Menge festgesetzt ist. Die wörtlichere Fassung steht in der Fußnote.
