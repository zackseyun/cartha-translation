translation_notes:
  register: Sachlicher, würdiger Verwaltungsstil mit klarer Reihung. Die antiken Maßeinheiten Talente, Kor und Bat bleiben unkonvertiert, um Scheingenauigkeit zu vermeiden. Der Fußnotenmarker steht bei der Wendung, auf die sich die Anmerkung tatsächlich bezieht.
