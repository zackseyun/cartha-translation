  text: וְ/כֹל֙ כְּסַ֣ף וּ/דְהַ֔ב דִּ֣י תְהַשְׁכַּ֔ח בְּ/כֹ֖ל מְדִינַ֣ת בָּבֶ֑ל עִם֩ הִתְנַדָּב֨וּת עַמָּ֤/א וְ/כָֽהֲנַיָּ/א֙ מִֽתְנַדְּבִ֔ין לְ/בֵ֥ית אֱלָהֲ/הֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/016.yaml
  text: and all the silver and gold that you find in all the province of Babylon[a], together with the freewill offering of the people and the priests[b], who are freely offering for the house of their God that is in Jerusalem.
translation:
  language: de
  text: und alles Silber und Gold, das du in der ganzen Provinz Babylon findest, zusammen mit der freiwilligen Gabe[a] des Volkes und der Priester, die freiwillig für das Haus ihres Gottes[b] in Jerusalem spenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »freiwillige Spende«. Der aramäische Ausdruck bezeichnet eine Gabe, die aus freiem Willen gegeben wird, besonders im Zusammenhang mit dem Tempel.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem »Haus ihres Gottes« ist der Tempel in Jerusalem gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וְכֹל
  choice: und alles
  rationale: Verbindet die Bestimmung mit dem vorhergehenden Satz und bewahrt den umfassenden Sinn von כֹל.
- source_word: כְּסַף וּדְהַב
  choice: Silber und Gold
  rationale: Die übliche und natürliche Wiedergabe des aramäischen Wortpaars.
- source_word: דִּי תְהַשְׁכַּח
  choice: das du … findest
  rationale: Gibt Relativpartikel und Verb direkt wieder, ohne durch »auftreiben« oder »beschaffen« eine zusätzliche Bedeutung einzutragen.
- source_word: בְּכֹל מְדִינַת בָּבֶל
  choice: in der ganzen Provinz Babylon
  rationale: מְדִינָה bezeichnet hier eine Verwaltungseinheit; »ganze« bewahrt die umfassende Aussage.
- source_word: עִם
  choice: zusammen mit
  rationale: Kennzeichnet klar eine weitere Quelle der für Jerusalem bestimmten Mittel.
- source_word: הִתְנַדָּבוּת
  choice: die freiwillige Gabe
  rationale: Bezeichnet eine aus eigenem Entschluss gegebene Gabe, besonders im kultischen Zusammenhang; die Formulierung ist verständlich und wahrt diesen Bezug.
- source_word: עַמָּא וְכָהֲנַיָּא
  choice: des Volkes und der Priester
  rationale: Bewahrt beide ausdrücklich genannten Gebergruppen in natürlichem Deutsch.
- source_word: מִתְנַדְּבִין
  choice: die freiwillig … spenden
  rationale: Das Partizip beschreibt die freiwillige Handlung von Volk und Priestern und erhält die Wortverbindung zum vorausgehenden Substantiv.
- source_word: לְבֵית אֱלָהֲהֹם
  choice: für das Haus ihres Gottes
  rationale: Bewahrt die wörtliche Tempelbezeichnung »Haus«; »für« drückt die Bestimmung der Gabe idiomatisch aus.
- source_word: דִּי בִירוּשְׁלֶם
  choice: in Jerusalem
  rationale: Gibt die Ortsbestimmung knapp und natürlich wieder; sie bezieht sich auf das Haus Gottes.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Tempelmetapher »Haus ihres Gottes« bleibt im Haupttext erhalten und wird in der Fußnote erläutert. Die Stellung des Relativsatzes lässt wie im Aramäischen erkennen, dass sowohl das Volk als auch die Priester freiwillig geben.
