base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/009.yaml
  text: For on the first day of the first month he began the journey up from Babylon, and on the first day of the fifth month he came to Jerusalem, according to the good hand of his God upon him.
translation:
  language: de
  text: Denn am ersten Tag des ersten Monats brach er von Babylon auf, und am ersten Tag des fünften Monats kam er nach Jerusalem, weil die gute Hand seines Gottes über ihm war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: gemäß der guten Hand seines Gottes über ihm.'
    reason: Die Fußnote macht die formale Bedeutung der Präposition kenntlich, da der Haupttext ihren im Zusammenhang naheliegenden kausalen Sinn wiedergibt.
lexical_decisions:
- source_word: יְסֻד הַמַּעֲלָה
  choice: begann er den Aufbruch
  rationale: Die ungewöhnliche Verbindung bezeichnet hier im Zusammenhang den Beginn der Reise beziehungsweise des Hinaufzugs aus Babylon. „Aufbruch“ gibt sowohl den Reisebeginn als auch die Bewegung nach Jerusalem natürlich wieder, ohne das wörtliche Bild „Grund legen“ irreführend zu vergegenständlichen.
- source_word: כְּיַד אֱלֹהָיו הַטּוֹבָה עָלָיו
  choice: weil die gute Hand seines Gottes über ihm war
  rationale: „Die gute Hand ... über ihm“ bewahrt das hebräische Bild für Gottes wohlwollende Führung und Hilfe. Das כ wird hier seinem kausalen Sinn im Kontext entsprechend mit „weil“ wiedergegeben.
theological_decisions:
- issue: Art und Ursache des erfolgreichen Reiseverlaufs
  choice: weil die gute Hand seines Gottes über ihm war
  alternative: entsprechend der guten Hand seines Gottes über ihm
  rationale: Die Formulierung schreibt den Erfolg ausdrücklich Gottes gütiger Führung zu. Die kausale Wiedergabe ist idiomatisch und entspricht der Verwendung derselben Wendung in Esra 7,6; zugleich bleibt das biblische Hand-Bild erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aufbruch von Babylon“ ist natürlicher als eine wörtliche Wiedergabe mit „Grundlegung“; „gute Hand seines Gottes“ bleibt als prägnantes biblisches Bild erhalten.
