    issue: Unidiomatische Formulierung „begann er den Aufbruch“
    rationale: Das Hebräische bezeichnet den Beginn des Hinaufzugs bzw. der Reise. Deutsch gibt „brach er von Babylon auf“ diesen Sinn knapper und natürlicher wieder.
  - severity: low
    issue: „kam er in Jerusalem an“ statt „kam er nach Jerusalem“
    rationale: Die vorhandene Formulierung ist möglich, aber „nach Jerusalem“ entspricht der Zielpräposition אֶל genauer und verbindet sich natürlich mit „kam“.
  revised_text: Denn am ersten Tag des ersten Monats brach er von Babylon auf, und am ersten Tag des fünften Monats kam er nach Jerusalem, weil die gute Hand seines Gottes über ihm war.[a]
