- from: Denn am ersten Tag des ersten Monats begann er den Aufbruch von Babylon, und am ersten Tag des fünften Monats kam er in Jerusalem an, weil die gute Hand seines Gottes über ihm war.[a]
  to: Denn am ersten Tag des ersten Monats brach er von Babylon auf, und am ersten Tag des fünften Monats kam er nach Jerusalem, weil die gute Hand seines Gottes über ihm war.[a]
