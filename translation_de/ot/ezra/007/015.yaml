  text: וּ/לְ/הֵיבָלָ֖ה כְּסַ֣ף וּ/דְהַ֑ב דִּֽי מַלְכָּ֣/א וְ/יָעֲט֗וֹ/הִי הִתְנַדַּ֨בוּ֙ לֶ/אֱלָ֣הּ יִשְׂרָאֵ֔ל דִּ֥י בִֽ/ירוּשְׁלֶ֖ם מִשְׁכְּנֵֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/015.yaml
  text: and to bring the silver and gold that the king and his counselors have freely offered to the God of Israel[a], whose dwelling is in Jerusalem,
translation:
  language: de
  text: und das Silber und Gold mitzunehmen, das der König und seine Ratgeber dem Gott Israels freiwillig gespendet haben, dessen Wohnstätte in Jerusalem ist[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der in Jerusalem wohnt“. Wörtlicher: „dessen Wohnstätte in Jerusalem ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהֵיבָלָה
  choice: und … mitzunehmen
  rationale: Der aramäische Infinitiv mit Konjunktion und Präposition bezeichnet im königlichen Auftrag den Zweck. „Mitzunehmen“ ist im Deutschen natürlich und passt dazu, dass Esra die Gaben nach Jerusalem bringen soll.
- source_word: כְּסַף וּדְהַב
  choice: das Silber und Gold
  rationale: Der nachfolgende Relativsatz bestimmt näher, um welches Silber und Gold es sich handelt; daher ist der bestimmte Artikel im Deutschen angemessen.
- source_word: מַלְכָּא וְיָעֲטוֹהִי
  choice: der König und seine Ratgeber
  rationale: „Ratgeber“ gibt die Bezeichnung für die königlichen Berater verständlich wieder und bewahrt den höfischen Zusammenhang.
- source_word: הִתְנַדַּבוּ
  choice: freiwillig gespendet haben
  rationale: Die Verbform bezeichnet eine willige, aus eigenem Entschluss gegebene Gabe. „Freiwillig gespendet“ bringt sowohl den Charakter der Gabe als auch die abgeschlossene Handlung zum Ausdruck.
- source_word: לֶאֱלָהּ יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Der Dativ ist nach „spenden“ idiomatisches Deutsch und bezeichnet Gott als Empfänger der Gabe.
- source_word: דִּי בִירוּשְׁלֶם מִשְׁכְּנֵהּ
  choice: dessen Wohnstätte in Jerusalem ist
  rationale: Die nominale Ausdrucksweise des Aramäischen bleibt erhalten. „Wohnstätte“ ist würdevoll und vermeidet die zu spezifische Wiedergabe „Stiftshütte“.
theological_decisions:
- issue: Gottes Beziehung zu Jerusalem in מִשְׁכְּנֵהּ
  choice: dessen Wohnstätte in Jerusalem ist
  alternative: der in Jerusalem wohnt
  rationale: Die Übersetzung bewahrt die nominale Form des aramäischen Textes und dessen tempelbezogene Aussage, ohne die Spannung durch eine erklärende Aussage über Gottes räumliche Gegenwart aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzform bleibt als Teil des fortlaufenden königlichen Auftrags bewusst offen und endet mit einem Komma.
