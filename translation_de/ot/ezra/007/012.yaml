base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/012.yaml
  text: 'Artaxerxes[a], king of kings, to Ezra the priest, the scribe of the law of the God of heaven: complete peace[b]. And now—'
translation:
  language: de
  text: 'Artaxerxes, der König der Könige, an Esra, den Priester, den Schreiber des Gesetzes[a] des Gottes des Himmels: vollkommener Friede.[b] Und nun –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schreiber des Erlasses des Gottes des Himmels“. Das aramäische Wort kann sowohl ein Gesetz als auch einen Erlass bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Aramäische nennt wörtlich nur „vollkommen“ oder „vollständig“. Die verkürzte, formelhafte Grußwendung setzt „Friede“ voraus; möglich sind auch „vollständiger Friede“ oder sinngemäß „Grüße“.
    reason: textual_ellipsis_and_lexical_alternative
lexical_decisions:
- source_word: אַ֨רְתַּחְשַׁ֔סְתְּא
  choice: Artaxerxes
  rationale: Der persische Königsname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: מֶ֖לֶךְ מַלְכַיָּא
  choice: der König der Könige
  rationale: Die aramäische Titelverbindung wird formal und im Deutschen idiomatisch als königlicher Hoheitstitel wiedergegeben.
- source_word: לְעֶזְרָ֣א
  choice: an Esra
  rationale: Die Präposition לְ kennzeichnet in der Briefüberschrift den Adressaten.
- source_word: כָהֲנָא
  choice: den Priester
  rationale: Die determinierte aramäische Form steht als Apposition zu Esra; der deutsche Akkusativ folgt auf „an“.
- source_word: סָפַר דָּתָא
  choice: Schreiber des Gesetzes
  rationale: סָפַר bezeichnet einen Schreiber; דָּתָא meint hier im Zusammenhang mit Esra und dem Gott des Himmels am ehesten das göttliche Gesetz. Die mögliche Bedeutung „Erlass“ bleibt in einer Fußnote erhalten.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: des Gottes des Himmels
  rationale: Die Genitivbeziehung und der feste biblische Gottesbeiname werden unmittelbar wiedergegeben.
- source_word: גְּמִיר
  choice: vollkommenes Wohlergehen
  rationale: גְּמִיר bedeutet „vollständig/vollkommen“. In der knappen amtlichen Grußformel ist ein Ausdruck wie „Wohlergehen“ sinngemäß zu ergänzen; die Ellipse wird in der Fußnote erläutert.
- source_word: וּכְעֶנֶת
  choice: Und nun –
  rationale: Die Formel leitet vom Briefgruß zum Inhalt des Erlasses über. Der Gedankenstrich zeigt an, dass der Satz im folgenden Vers weitergeführt wird.
theological_decisions:
- issue: Bedeutung von דָּתָא in der Amtsbezeichnung Esras
  choice: Gesetz
  alternative: Erlass
  rationale: Da Esra als Priester und Schreiber in Beziehung zum Gott des Himmels bezeichnet wird, ist das göttliche Gesetz gemeint. Die weitere verwaltungssprachliche Bedeutung des Wortes wird jedoch nicht ausgeschlossen, sondern als Übersetzungsalternative vermerkt.
- issue: Deutung der verkürzten Briefformel גְּמִיר וּכְעֶנֶת
  choice: vollkommenes Wohlergehen! Und nun –
  alternative: vollkommener Friede! Und nun –; Grüße! Und nun –
  rationale: Die Wiedergabe wahrt den formelhaften Gruß und den anschließenden Übergang, ohne aus ihm eine theologische Friedensaussage zu machen. Zugleich wird die im Aramäischen stark verkürzte Form für heutige Leser verständlich.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die amtliche Briefüberschrift bleibt knapp und formal. „Schreiber“ bewahrt die konkrete Amts- und Tätigkeitsbezeichnung des aramäischen סָפַר; der Gedankenstrich am Ende markiert den Übergang, der in Vers 13 fortgesetzt wird.
