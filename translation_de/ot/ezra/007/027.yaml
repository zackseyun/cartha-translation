id: EZR.7.27
reference: Ezra 7:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵ֑י/נוּ אֲשֶׁ֨ר נָתַ֤ן כָּ/זֹאת֙ בְּ/לֵ֣ב הַ/מֶּ֔לֶךְ לְ/פָאֵ֕ר אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/027.yaml
  text: Blessed be Yahweh[a], the God of our fathers, who put this into the king’s heart, to beautify the house of Yahweh that is in Jerusalem,
translation:
  language: de
  text: 'Gepriesen sei Jahwe, der Gott unserer Väter, der dem König dies ins Herz gegeben hat: das Haus Jahwes in Jerusalem herrlich auszugestalten[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu schmücken“ oder „zu verherrlichen“.'
    reason: Das hebräische Verb kann sowohl die prächtige äußere Gestaltung als auch die Verherrlichung beziehungsweise Ehrung des Hauses bezeichnen.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die doxologische Segensformel wird im Deutschen natürlich als Lobpreis wiedergegeben; „Gepriesen sei“ bewahrt dabei den prädikativen und feierlichen Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: der Gott unserer Väter
  rationale: Die traditionelle Bundesformel bleibt eng am hebräischen Wortlaut; „Väter“ bezeichnet hier die Vorfahren Israels.
- source_word: אֲשֶׁר נָתַן כָּזֹאת בְּלֵב הַמֶּלֶךְ
  choice: der dem König dies ins Herz gegeben hat
  rationale: Die deutsche Wendung „jemandem etwas ins Herz geben“ gibt das Bild einer inneren Eingebung oder Absicht wieder und bewahrt כָּזֹאת als rückverweisendes „dies“.
- source_word: לְפָאֵר
  choice: herrlich auszugestalten
  rationale: Das Piel bezeichnet hier, das Heiligtum prächtig, schön oder ehrenvoll zu gestalten. Die Formulierung wahrt sowohl den konkreten als auch den ehrenden Bedeutungsanteil.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ entspricht dem hebräischen Ausdruck und bewahrt dessen religiöse Resonanz, obwohl sachlich der Tempel gemeint ist.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die knappe Ortsangabe ist im Deutschen natürlich; der Bezug auf das Haus Jahwes bleibt eindeutig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration bewahrt ihn als Namen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung von לְפָאֵר in Bezug auf den Tempel
  choice: herrlich auszugestalten
  alternative: zu schmücken / zu verherrlichen
  rationale: Der Kontext lässt eine konkrete Verschönerung und zugleich eine Steigerung der Würde des Tempels anklingen. Die Hauptfassung hält beide Aspekte offen, statt den Ausdruck ausschließlich baulich oder abstrakt-theologisch zu verstehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht den Zielgedanken des Infinitivs klar, ohne die Aussage auszudeuten. Das abschließende Komma bleibt stehen, da der Vers syntaktisch in Esra 7,28 weitergeführt wird.
