  source_fidelity: 'Die Übersetzung gibt die hebräische Doxologie und ihre Satzglieder zuverlässig wieder: „Gepriesen sei“ entspricht בָּרוּךְ, „Jahwe“ gibt den Gottesnamen wieder, „der Gott unserer Väter“ die Bundesformel. „dem König dies ins Herz gegeben hat“ trifft die Wendung נָתַן ... בְּלֵב. „das Haus Jahwes in Jerusalem“ bewahrt den Ausdruck בֵּית יְהוָה und dessen Ortsbestimmung. Das abschließende Komma ist korrekt, da die Rede in V. 28 weiterläuft.'
