  terminology: „Jahwe“ ist konsistent als Eigenname wiedergegeben. „Haus Jahwes“ bewahrt die hebräische Tempelbezeichnung, ohne den Sinn zu verdunkeln. „Herrlich auszugestalten“ ist eine tragfähige Wiedergabe von לְפָאֵר; die Fußnote nennt angemessene lexikalische Alternativen.
