source:
  edition: WLC
  text: וּ/לְ/כֹ֣ם מְהוֹדְעִ֗ין דִּ֣י כָל כָּהֲנַיָּ֣/א וְ֠/לֵוָיֵ/א זַמָּ֨רַיָּ֤/א תָרָֽעַיָּ/א֙ נְתִ֣ינַיָּ֔/א וּ/פָ֣לְחֵ֔י בֵּ֖ית אֱלָהָ֣/א דְנָ֑ה מִנְדָּ֤ה בְלוֹ֙ וַ/הֲלָ֔ךְ לָ֥א שַׁלִּ֖יט לְ/מִרְמֵ֥א עֲלֵי/הֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/024.yaml
  text: And we make known to you that it is not permitted to impose tribute[a], tax, or toll on any of the priests, Levites, singers, gatekeepers, temple servants[b], or servants of this house of God.
translation:
  language: de
  text: 'Wir geben euch bekannt: Keinem von den Priestern, Leviten, Sängern, Torwächtern, Tempeldienern[a] oder Dienern dieses Hauses Gottes dürfen Abgaben, Steuern oder Zölle[b] auferlegt werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch „Netinim“, eine Umschrift des aramäischen נְתִינַיָּא.
    reason: lexical_alternative
  - marker: b
    text: 'Die drei Verwaltungsbegriffe bezeichnen wahrscheinlich unterschiedliche Arten staatlicher Erhebungen; auch möglich: „Tribut, Steuer und Wegegeld“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוֹדְעִין
  choice: euch wird hiermit bekannt gegeben
  rationale: Die aramäische Partizipialform dient als amtliche Bekanntgabeformel. Die deutsche Passivform wahrt den administrativen Ton, ohne das im Kontext vorausgesetzte, aber im Vers nicht eigens genannte Subjekt überzubetonen.
- source_word: כָל
  choice: keinem der
  rationale: In Verbindung mit dem rechtlichen Verbot und der Aufzählung bezeichnet כָל sämtliche Angehörigen der genannten Gruppen. Die negative deutsche Formulierung gibt dies natürlich und eindeutig wieder.
- source_word: כָּהֲנַיָּא
  choice: Priester
  rationale: Die übliche und direkte Bezeichnung der priesterlichen Gruppe.
- source_word: לֵוָיֵא
  choice: Leviten
  rationale: Die etablierte deutsche Wiedergabe der levitischen Gruppe.
- source_word: זַמָּרַיָּא
  choice: Sänger
  rationale: Das Wort bezeichnet die für den musikalischen Lobpreis zuständige Gruppe; „Sänger“ ist direkt und entspricht der Tempeldienstliste.
- source_word: תָרָעַיָּא
  choice: Torwächter
  rationale: Gemeint sind die an den Toren eingesetzten Wächter oder Aufseher; „Torwächter“ ist im Deutschen klar und geläufig.
- source_word: נְתִינַיָּא
  choice: Tempeldiener
  rationale: Die funktionsbezogene Übersetzung ist verständlicher als die traditionelle, aber weithin undurchsichtige Umschrift „Netinim“.
- source_word: פָלְחֵי בֵּית אֱלָהָא דְנָה
  choice: sonstige Diener dieses Hauses Gottes
  rationale: פָלְחֵי bezeichnet Menschen, die in diesem Gotteshaus dienen. „Sonstige“ macht im Deutschen deutlich, dass diese umfassende Gruppe nach den bereits genannten Tempeldienern eine weitere Kategorie der Aufzählung bildet, ohne eine besondere Amtsklasse festzulegen.
- source_word: מִנְדָּה
  choice: Abgaben
  rationale: Der Begriff bezeichnet im persischen Verwaltungswortschatz eine auferlegte Leistung beziehungsweise einen Tribut. „Abgaben“ hält ihn von den beiden folgenden Fiskalbegriffen unterscheidbar.
- source_word: בְלוֹ
  choice: Steuern
  rationale: Ein allgemeiner fiskalischer Begriff, der hier als mittleres Glied der dreiteiligen Verwaltungsformel wiedergegeben wird.
- source_word: וַהֲלָךְ
  choice: Zölle
  rationale: Der Ausdruck wird häufig auf Wege-, Durchgangs- oder Zollgebühren bezogen. „Zölle“ ist knapp und unterscheidet diese Erhebung von den übrigen Abgaben.
- source_word: לָא שַׁלִּיט לְמִרְמֵא עֲלֵיהֹם
  choice: dürfen ... nicht auferlegt werden
  rationale: Die Wendung spricht von fehlender rechtlicher Befugnis. Die deutsche Formulierung gibt das amtliche Verbot natürlich und präzise wieder.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil mit amtlichem Ton. Die Satzstellung wurde für natürliche deutsche Rechtssprache angepasst. Die drei Fiskalbegriffe bleiben als unterscheidbare, in ihrer genauen Abgrenzung jedoch unsichere Größen erhalten.
