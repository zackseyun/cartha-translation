source:
  edition: WLC
  text: כָּל דִּ֗י מִן טַ֨עַם֙ אֱלָ֣הּ שְׁמַיָּ֔/א יִתְעֲבֵד֙ אַדְרַזְדָּ֔א לְ/בֵ֖ית אֱלָ֣הּ שְׁמַיָּ֑/א דִּֽי לְ/מָ֤ה לֶֽהֱוֵא֙ קְצַ֔ף עַל מַלְכ֥וּת מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/023.yaml
  text: Whatever is commanded by the God of heaven[a], let it be done diligently for the house of the God of heaven[b], lest wrath come upon the kingdom of the king and his sons.
translation:
  language: de
  text: Alles, was der Gott des Himmels anordnet, soll mit aller Sorgfalt für das Haus des Gottes des Himmels[a] ausgeführt werden, damit kein Zorn über das Reich des Königs und seine Söhne kommt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus des Gottes des Himmels“ ist der Tempel gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder formnäher: „Denn warum sollte Zorn über das Reich des Königs und seine Söhne kommen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דִּי
  choice: Alles, was
  rationale: Die Verbindung leitet einen umfassenden Relativsatz ein. „Alles, was“ ist im Deutschen natürlich und bewahrt die totalisierende Bedeutung.
- source_word: מִן טַעַם
  choice: anordnet
  rationale: Das aramäische טְעֵם kann einen Befehl, Erlass oder eine Entscheidung bezeichnen; מִן kennzeichnet den Ursprung. „Was der Gott des Himmels anordnet“ gibt den administrativen Sinn klar wieder.
- source_word: אֱלָהּ שְׁמַיָּא
  choice: der Gott des Himmels
  rationale: Dies ist ein fester Gottesname im aramäischen Teil des Esrabuches; die bestimmte Form wird im Deutschen mit dem Artikel wiedergegeben.
- source_word: יִתְעֲבֵד
  choice: soll … ausgeführt werden
  rationale: Die passive Imperfektform hat im Zusammenhang auffordernden beziehungsweise anordnenden Sinn. „Soll … ausgeführt werden“ entspricht zugleich dem Verwaltungskontext.
- source_word: אַדְרַזְדָּא
  choice: mit aller Sorgfalt
  rationale: Das seltene Adverb bezeichnet sorgfältige, gewissenhafte beziehungsweise genaue Ausführung. Die Wendung wahrt den nachdrücklichen Ton, ohne eine nicht eindeutig belegte Nuance wie Schnelligkeit festzulegen.
- source_word: לְבֵית
  choice: für das Haus
  rationale: Das Grundwort bedeutet „Haus“ und bezeichnet hier den Tempel. Die bildhafte Ausgangsform bleibt im Haupttext erhalten.
- source_word: דִּי לְמָה
  choice: damit kein
  rationale: Die Wendung lässt sich als warnender Zweck-/Folgesatz oder wörtlicher als rhetorische Frage verstehen. Im Haupttext wird ihre Warnfunktion natürlich wiedergegeben; die formnähere Möglichkeit steht in der Fußnote.
- source_word: לֶהֱוֵא קְצַף
  choice: Zorn … kommt
  rationale: Die Verbindung bedeutet wörtlich, dass Zorn entsteht oder da ist. „Zorn … kommt“ bewahrt die Vorstellung drohenden Zorns.
- source_word: עַל מַלְכוּת מַלְכָּא
  choice: über das Reich des Königs
  rationale: מַלְכוּת bezeichnet hier das Herrschaftsgebiet beziehungsweise Reich. Die Formulierung bleibt nah an der aramäischen Genitivverbindung.
- source_word: וּבְנוֹהִי
  choice: und seine Söhne
  rationale: Das Substantiv bezeichnet unmittelbar die Söhne des Königs. Eine mögliche dynastische Reichweite wird nicht durch „Nachkommen“ in den Text hineingedeutet.
theological_decisions:
- issue: Bezeichnung des Tempels als בֵית אֱלָהּ שְׁמַיָּא
  choice: für das Haus des Gottes des Himmels
  alternative: für den Tempel des Gottes des Himmels
  rationale: „Haus“ wahrt das Bild und die Ausdrucksweise des aramäischen Textes; eine Fußnote erklärt den sachlichen Bezug, ohne ihn im Haupttext vorwegzunehmen.
- issue: Warnsatz דִּי לְמָה לֶהֱוֵא קְצַף
  choice: damit kein Zorn … kommt
  alternative: Denn warum sollte Zorn … kommen?
  rationale: Die Hauptfassung gibt die Warn- und Zweckfunktion idiomatisch wieder. Da die aramäische Form auch als rhetorische Frage verstanden werden kann, wird diese echte sprachliche Spannung in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einem dem königlichen Erlass angemessenen Verwaltungston. „Mit aller Sorgfalt“ ist verständlich und nachdrücklich; die Wiederholung „Gott des Himmels“ sowie „Reich des Königs“ bleibt bewusst erhalten.
