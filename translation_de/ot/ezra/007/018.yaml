source:
  edition: WLC
  text: וּ/מָ֣ה דִי֩ עלי/ך וְ/עַל אחי/ך יֵיטַ֗ב בִּ/שְׁאָ֛ר כַּסְפָּ֥/א וְ/דַהֲבָ֖/ה לְ/מֶעְבַּ֑ד כִּ/רְע֥וּת אֱלָהֲ/כֹ֖ם תַּעַבְדֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/018.yaml
  text: And whatever seems good to you and your brothers to do with the rest of the silver and the gold[b][a], do according to the will of your God.
translation:
  language: de
  text: Und was immer dir und deinen Brüdern gut erscheint[a], mit dem übrigen Silber und Gold zu tun, das tut nach dem Willen[b] eures Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was dir und deinen Brüdern gut ist“ beziehungsweise „gefällt“. Die aramäische Wendung kann formaler mit „gut ist“ oder sinngemäßer mit „gut erscheint“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach dem Wunsch eures Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה דִי
  choice: Und was immer
  rationale: Die aramäische Verbindung leitet einen unbestimmten Relativsatz ein. „Was immer“ gibt die offene Bedeutung natürlich und zugleich quellennah wieder.
- source_word: עֲלָיִךְ וְעַל אַחַיִךְ יֵיטַב
  choice: dir und deinen Brüdern gut erscheint
  rationale: Die Wendung mit יטב und על bezeichnet, was jemandem gut oder angemessen erscheint. „Gut erscheint“ bewahrt den abwägenden Sinn der königlichen Ermächtigung.
- source_word: אַחַיִךְ
  choice: deinen Brüdern
  rationale: Das Wort bedeutet wörtlich „deine Brüder“. Im Zusammenhang kann es Esras jüdische Gefährten oder Mitarbeiter bezeichnen; die Übersetzung erhält jedoch bewusst den Verwandtschaftsausdruck.
- source_word: בִּשְׁאָר כַּסְפָּא וְדַהֲבָה
  choice: mit dem übrigen Silber und Gold
  rationale: שְׁאָר bezeichnet das, was übrig bleibt. Die Formulierung verweist klar auf die bereits genannten Geldmittel.
- source_word: לְמֶעְבַּד
  choice: zu tun
  rationale: Der Infinitiv von עבד bezeichnet hier allgemein ein Handeln oder Verfahren mit den Mitteln. „Zu tun“ lässt die Aussage ebenso offen wie der Ausgangstext.
- source_word: כִּרְעוּת
  choice: nach dem Willen
  rationale: Das Substantiv kann Wille, Wunsch oder Wohlgefallen bedeuten. „Nach dem Willen“ passt zum formellen Ton des Erlasses, ohne die mögliche Nuance „Wunsch“ zu verdecken; diese wird in einer Fußnote genannt.
- source_word: אֱלָהֲכֹם
  choice: eures Gottes
  rationale: Das Suffix ist in der zweiten Person Plural formuliert und bezieht sich auf Esra und seine Brüder. „Gott“ wird großgeschrieben, weil der Gott Israels als bestimmter Referent gemeint ist.
- source_word: תַּעַבְדוּן
  choice: das tut
  rationale: Die Pluralform richtet sich an Esra und seine Brüder und hat im Erlass anweisend-ermächtigenden Sinn. Die deutsche Aufforderung „das tut“ bildet dies knapp und natürlich ab.
theological_decisions:
- issue: Wiedergabe des bestimmten Gottesbezugs אֱלָהֲכֹם
  choice: eures Gottes
  alternative: eures Gotteswesens / eures Gottes (mit generischem Verständnis)
  rationale: Gemeint ist konkret der von Esra und seinen Gefährten verehrte Gott. Die übliche Großschreibung kennzeichnet den bestimmten Referenten, ohne eine zusätzliche konfessionelle Aussage einzutragen.
- issue: Bedeutungsumfang von כִּרְעוּת
  choice: nach dem Willen
  alternative: nach dem Wunsch / Verlangen
  rationale: „Wille“ wahrt den formellen Charakter des königlichen Schreibens. Da das aramäische Wort auch Wunsch oder Wohlgefallen ausdrücken kann, bleibt diese echte lexikalische Spannweite in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt dem komplexen aramäischen Bedingungs- und Handlungsgedanken, bleibt aber durch das aufnehmende „das tut“ verständlich. „Brüder“ wird als quellennaher Verwandtschaftsausdruck beibehalten; „eures“ und „tut“ geben den Wechsel von der singularischen Anrede Esras zur pluralischen Anrede der Gruppe wieder.
