source:
  edition: WLC
  text: וְ/זֶ֣ה פַּרְשֶׁ֣גֶן הַֽ/נִּשְׁתְּוָ֗ן אֲשֶׁ֤ר נָתַן֙ הַ/מֶּ֣לֶךְ אַרְתַּחְשַׁ֔סְתְּא לְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סֹּפֵ֑ר סֹפֵ֞ר דִּבְרֵ֧י מִצְוֺת יְהוָ֛ה וְ/חֻקָּ֖י/ו עַל יִשְׂרָאֵֽל׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/011.yaml
  text: 'This is the copy of the document that King Artaxerxes gave to Ezra the priest[a], the scribe[b], a scribe of the words of the commandments of Yahweh and of his statutes for Israel:'
translation:
  language: de
  text: 'Dies ist die Abschrift des Schriftstücks[a], das König Artaxerxes dem Priester Esra, dem Schreiber, gab – einem Schreiber der Worte der Gebote Jahwes und seiner Satzungen für Israel[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wortlaut des Schreibens“ beziehungsweise „Abschrift des amtlichen Dokuments“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Bezug auf Israel“ beziehungsweise „über Israel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְשֶׁגֶן הַנִּשְׁתְּוָן
  choice: Abschrift des Schriftstücks
  rationale: פַּרְשֶׁגֶן bezeichnet eine Abschrift beziehungsweise Wiedergabe, הַנִּשְׁתְּוָן ein amtliches Schriftstück. Die Formulierung bleibt bewusst allgemein, weil der Text nicht eindeutig zwischen Brief, Erlass und anderem offiziellen Dokument unterscheidet.
- source_word: וְזֶה
  choice: Dies ist
  rationale: Das einleitende וְ markiert hier den Fortgang des Berichts. Im natürlichen Deutschen ist kein zusätzliches „Und“ oder „Nun“ nötig.
- source_word: נָתַן
  choice: gab
  rationale: Die Grundbedeutung des Verbs wird beibehalten; „erließ“ oder „stellte aus“ würde die Art des königlichen Handelns stärker festlegen.
- source_word: הַמֶּלֶךְ אַרְתַּחְשַׁסְתְּא
  choice: König Artaxerxes
  rationale: Der Titel wird übersetzt und der Personenname in seiner geläufigen deutschen Form wiedergegeben.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: dem Priester Esra, dem Schreiber
  rationale: Beide Amts- beziehungsweise Rollenbezeichnungen werden als Appositionen zu Esra bewahrt. „Schreiber“ erhält sowohl die administrative als auch die textbezogene Bedeutung von סֹפֵר besser als das stärker deutende „Gelehrter“.
- source_word: סֹפֵר דִּבְרֵי מִצְוֺת יְהוָה
  choice: einem Schreiber der Worte der Gebote Jahwes
  rationale: Die ungewöhnliche appositionelle Konstruktion des Hebräischen bleibt erkennbar, ohne סֹפֵר ein nicht ausdrücklich vorhandenes Prädikat wie „kundig“ oder „gelehrt“ beizulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְחֻקָּיו
  choice: und seiner Satzungen
  rationale: „Satzungen“ gibt den rechtlich-instruktiven Sinn von חֻקִּים wieder; der Genitiv führt die mit „Worte“ begonnene Zuordnung fort.
- source_word: עַל יִשְׂרָאֵל
  choice: für Israel
  rationale: Die Präposition עַל kann hier Zielbezug, Gegenstandsbezug oder Geltungsbereich bezeichnen. „Für Israel“ ist im Deutschen natürlich und lässt die Satzungen als an Israel gerichtet beziehungsweise für Israel geltend verstehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Im hebräischen Text steht der Gottesname selbst. „Jahwe“ wahrt seinen Charakter als Eigenname, ohne ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bezug von עַל יִשְׂרָאֵל
  choice: für Israel
  alternative: über Israel; in Bezug auf Israel
  rationale: Der knappe hebräische Ausdruck lässt offen, ob vor allem Geltung, Gegenstand oder Autorität bezeichnet wird. Die Hauptübersetzung wählt den wahrscheinlichen Ziel- und Geltungsbezug; die Fußnote bewahrt die übrigen Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Bezeichnung „Schreiber“ spiegelt bewusst die Wiederholung von סֹפֵר im Hebräischen. Der Gedankenstrich macht die zweite Apposition verständlich, ohne sie in einen eigenständigen erklärenden Satz umzudeuten.
