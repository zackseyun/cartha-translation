  text: ה֤וּא עֶזְרָא֙ עָלָ֣ה מִ/בָּבֶ֔ל וְ/הֽוּא סֹפֵ֤ר מָהִיר֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר נָתַ֥ן יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּתֶּן ל֣/וֹ הַ/מֶּ֗לֶךְ כְּ/יַד יְהוָ֤ה אֱלֹהָי/ו֙ עָלָ֔י/ו כֹּ֖ל בַּקָּשָׁתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/006.yaml
  text: This Ezra went up from Babylon[a], and he was a skilled scribe in the Law of Moses, which Yahweh, the God of Israel, had given. And the king granted him all his request, according to the hand of Yahweh his God upon him.
translation:
  language: de
  text: Dieser Esra zog aus Babylon hinauf. Er war ein kundiger Schriftgelehrter im Gesetz des Mose, das Jahwe, der Gott Israels, gegeben hatte. Der König gewährte ihm alles, worum er gebeten hatte, gemäß der Hand Jahwes, seines Gottes, über ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gemäß der Hand Jahwes, seines Gottes, über ihm“. Die „Hand“ ist ein Bild für Gottes Gunst, Macht oder fürsorgliche Führung.'
    reason: Die Fußnote erläutert die im Deutschen bewusst bildhaft beibehaltene hebräische Konstruktion und wahrt die Bedeutungsbreite der Metapher.
lexical_decisions:
- source_word: עָלָה מִבָּבֶל
  choice: zog aus Babylon hinauf
  rationale: „Hinaufziehen“ bewahrt die räumliche und Jerusalem-orientierte Perspektive des hebräischen Verbs עָלָה mit מִן.
- source_word: סֹפֵר מָהִיר
  choice: kundiger Schriftgelehrter
  rationale: סֹפֵר bezeichnet hier einen schrift- und gesetzeskundigen Fachmann; מָהִיר meint in diesem Zusammenhang eher Gewandtheit oder Sachkunde als körperliche Schnelligkeit. „Schriftgelehrter“ gibt die textbezogene und rechtlich-religiöse Funktion im Deutschen verständlich wieder.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: im Gesetz des Mose
  rationale: תּוֹרָה kann allgemein „Weisung“ bedeuten, bezeichnet hier aber im nachexilischen Zusammenhang die Mose zugeschriebene verbindliche Weisung; „Gesetz“ ist für gewöhnliche Leser klar und kontextgerecht.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: das Jahwe, der Gott Israels, gegeben hatte
  rationale: Der Relativsatz bezieht sich auf das Gesetz. Das Plusquamperfekt verdeutlicht die gegenüber Esras Wirken vorausliegende Gabe, ohne den Sinn zu erweitern.
- source_word: וַיִּתֵּן לוֹ הַמֶּלֶךְ כֹּל בַּקָּשָׁתוֹ
  choice: Der König gewährte ihm alles, worum er gebeten hatte
  rationale: Bei einer Bitte ist „gewähren“ die natürliche deutsche Entsprechung zu נָתַן. Die idiomatische Formulierung gibt den gesamten Inhalt seiner Bitte wieder.
- source_word: כְּיַד יְהוָה אֱלֹהָיו עָלָיו
  choice: denn die Hand Jahwes, seines Gottes, war über ihm
  rationale: Die konkrete Hand-Metapher bleibt erhalten. „Denn“ gibt den Zusammenhang im Deutschen natürlich wieder, während die Fußnote darauf hinweist, dass כְּ wörtlicher „gemäß/entsprechend“ lautet und das Bild mehrere Nuancen zulässt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Standarddeutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen. Die Wiedergabe als „Jahwe“ bewahrt seinen Charakter als Eigenname statt ihn durch einen Titel zu ersetzen.
- issue: Deutung der Hand Gottes über Esra
  choice: Das Bild von der Hand Gottes bleibt im Haupttext erhalten
  alternative: weil Jahwe ihm seine Gunst erwies / weil Jahwe ihm machtvoll half
  rationale: Die Wendung kann Gunst, Macht und fürsorgliche Führung bezeichnen. Eine eindeutige Auflösung würde die Bedeutungsbreite des Bildes unnötig einschränken.
- issue: Verhältnis zwischen der Hand Gottes und der Bewilligung des Königs
  choice: kausaler Zusammenhang mit „denn“, bei Beibehaltung der Metapher
  alternative: 'wörtlicher: „gemäß der Hand Jahwes, seines Gottes, über ihm“'
  rationale: Die hebräische Konstruktion beschreibt die Bewilligung entsprechend dem Wirken der göttlichen Hand. „Denn“ ist verständliches Deutsch, ohne festzulegen, ob besonders Gunst, Macht oder Vorsehung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schriftgelehrter“ ist allgemein verständlich und trägt den fachlichen wie religiös-rechtlichen Sinn. Kurze Hauptsätze halten den Vers klar; die Gotteshand-Metapher bleibt bewusst unaufgelöst.
