  text: וּ/מָֽאנַיָּ/א֙ דִּֽי מִתְיַהֲבִ֣ין לָ֔/ךְ לְ/פָלְחָ֖ן בֵּ֣ית אֱלָהָ֑/ךְ הַשְׁלֵ֕ם קֳדָ֖ם אֱלָ֥הּ יְרוּשְׁלֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/019.yaml
  text: And the vessels that are given to you for the service of the house of your God[b][a], deliver in full before the God of Jerusalem.
translation:
  language: de
  text: Und die Geräte, die dir für den Dienst im Haus deines Gottes[a] übergeben werden, übergib vollständig[b] vor dem Gott Jerusalems.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Verehrung im Haus deines Gottes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „händige sie vollständig aus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָאנַיָּא
  choice: Und die Geräte
  rationale: Der aramäische Ausdruck bezeichnet Geräte, Gefäße oder andere Gebrauchsgegenstände. Im Tempelzusammenhang ist „Geräte“ im Deutschen natürlich und hinreichend weit.
- source_word: דִּי
  choice: die
  rationale: Das Relativpronomen leitet den Satz ein, der die Geräte näher bestimmt.
- source_word: מִתְיַהֲבִין לָךְ
  choice: die dir … übergeben werden
  rationale: Die passive Partizipialform wird als gegenwärtige beziehungsweise bevorstehende Übergabe wiedergegeben; „übergeben“ passt bei anvertrauten Tempelgeräten besser als das allgemeinere „gegeben“.
- source_word: לְפָלְחָן
  choice: für den Dienst
  rationale: Das Wort bezeichnet Dienst, hier kultischen Tempeldienst. „Dienst“ bewahrt die Bedeutungsbreite, ohne den Ausdruck ausdrücklich auf „Gottesdienst“ oder „Verehrung“ zu verengen.
- source_word: בֵּית אֱלָהָךְ
  choice: im Haus deines Gottes
  rationale: „Haus“ bezeichnet hier den Tempel. Die Verbindung mit „im“ ergibt im Deutschen die natürliche Wendung „Dienst im Haus deines Gottes“, ohne die Zugehörigkeit des Hauses zu Gott abzuschwächen.
- source_word: הַשְׁלֵם
  choice: übergib vollständig
  rationale: Der Imperativ kann das vollständige Abliefern oder Aushändigen bezeichnen. „Übergib vollständig“ bringt sowohl die Übergabe als auch die Vollständigkeit zum Ausdruck.
- source_word: קֳדָם
  choice: vor
  rationale: Die Präposition bedeutet „vor“ beziehungsweise „in der Gegenwart von“; die knappe Wiedergabe „vor“ erhält die Ausgangsformulierung.
- source_word: אֱלָהּ יְרוּשְׁלֶם
  choice: dem Gott Jerusalems
  rationale: Die Formulierung verbindet Gott in persisch-aramäischer Verwaltungssprache mit Jerusalem. „Gott Jerusalems“ gibt diese Beziehung direkt wieder, statt sie zu „Gott in Jerusalem“ umzudeuten.
theological_decisions:
- issue: Tempelbezogene Bedeutung von לְפָלְחָן
  choice: für den Dienst im Haus deines Gottes
  alternative: für die Verehrung im Haus deines Gottes
  rationale: Der Zusammenhang ist kultisch, doch das aramäische Substantiv ist weiter als „Verehrung“. „Dienst“ wahrt diese Bedeutungsbreite und vermeidet eine konfessionell geprägte Engführung.
- issue: Bezeichnung „Gott Jerusalems“
  choice: vor dem Gott Jerusalems
  alternative: vor Gott in Jerusalem
  rationale: Die attributive Beziehung zu Jerusalem wird formal bewahrt. Die Übersetzung macht daraus weder eine Aussage über einen bloß örtlich begrenzten Gott noch ersetzt sie die im Erlass verwendete Bezeichnung durch eine theologisch geglättete Form.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit dem sachlich-feierlichen Ton eines königlichen Erlasses. „Geräte“ und „Dienst“ sind verständlich, ohne den Tempelkontext unnötig zu technisieren; die leicht fremdartige Wendung „Gott Jerusalems“ bleibt als Merkmal der aramäischen Verwaltungssprache erhalten.
