  to: Und du, Esra, sollst nach der Weisheit deines Gottes, die in deiner Hand ist,[a] Gerichtsbeamte und Richter einsetzen. Sie sollen über das ganze Volk jenseits des Stromes[b] Recht sprechen, über alle, die die Gesetze deines Gottes kennen. Und wer sie nicht kennt, den sollt ihr unterweisen.
