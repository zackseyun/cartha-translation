  text: וְ/אַ֣נְתְּ עֶזְרָ֗א כְּ/חָכְמַ֨ת אֱלָהָ֤/ךְ דִּֽי בִ/ידָ/ךְ֙ מֶ֣נִּי שָׁפְטִ֞ין וְ/דַיָּנִ֗ין דִּי לֶהֱוֺ֤ן דאנין לְ/כָל עַמָּ/ה֙ דִּ֚י בַּ/עֲבַ֣ר נַהֲרָ֔/ה לְ/כָל יָדְעֵ֖י דָּתֵ֣י אֱלָהָ֑/ךְ וְ/דִ֧י לָ֦א יָדַ֖ע תְּהוֹדְעֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/025.yaml
  text: And you[a], Ezra, according to the wisdom of your God that is in your hand, appoint magistrates and judges who may judge all the people who are beyond the River—all who know the laws of your God; and those who do not know them[b], you shall teach.
translation:
  language: de
  text: Und du, Esra, sollst nach der Weisheit deines Gottes, die in deiner Hand ist,[a] Gerichtsbeamte und Richter einsetzen. Sie sollen über das ganze Volk jenseits des Stromes[b] Recht sprechen, über alle, die die Gesetze deines Gottes kennen. Und wer sie nicht kennt, den sollt ihr unterweisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die du besitzt“. Die aramäische Wendung kann Besitz oder anvertraute Vollmacht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Jenseits des Stromes“ war die persische Verwaltungsbezeichnung für das Gebiet westlich des Euphrat.
    reason: cultural_note
lexical_decisions:
- source_word: כְּחָכְמַת אֱלָהָךְ
  choice: nach der Weisheit deines Gottes
  rationale: כְּ bezeichnet hier die Übereinstimmung mit einem Maßstab. „Nach“ gibt dieses Verhältnis im Deutschen knapp und natürlich wieder.
- source_word: דִּי בִידָךְ
  choice: die in deiner Hand ist
  rationale: Die aramäische Wendung wird bildhaft bewahrt; sie kann Besitz, Verfügbarkeit oder anvertraute Vollmacht bezeichnen, ohne dass der Text eine dieser Nuancen eindeutig festlegt.
- source_word: מֶנִּי
  choice: einsetzen
  rationale: Im administrativen Zusammenhang bezeichnet das Verb die amtliche Bestellung von Funktionsträgern.
- source_word: שָׁפְטִין וְדַיָּנִין
  choice: Verwaltungsrichter und Richter
  rationale: Die Wiedergabe unterscheidet die beiden aramäischen Amtsbezeichnungen, ohne sie zu einer einzigen Gruppe zusammenzuziehen. „Verwaltungsrichter“ markiert beim ersten Begriff die amtlich-administrative Funktion.
- source_word: דִּי לֶהֱוֺן דאנין
  choice: Sie sollen … Recht sprechen
  rationale: Die Formulierung gibt die vorgesehene Aufgabe der eingesetzten Amtsträger idiomatisch und mit dem verpflichtenden Charakter des königlichen Auftrags wieder.
- source_word: לְכָל עַמָּה
  choice: über das ganze Volk
  rationale: Der kollektive Singular mit כָּל wird im Deutschen als umfassende Kollektivbezeichnung wiedergegeben.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: jenseits des Stromes
  rationale: Die traditionelle persische Verwaltungsbezeichnung bleibt erkennbar; mit „Strom“ ist hier der Euphrat gemeint.
- source_word: לְכָל יָדְעֵי דָּתֵי אֱלָהָךְ
  choice: nämlich über alle, die die Gesetze deines Gottes kennen
  rationale: Die Apposition erläutert den Umfang der zuvor genannten Bevölkerung. Der Plural דָּתֵי wird als „Gesetze“ bewahrt.
- source_word: וְדִי לָא יָדַע
  choice: Und wer sie nicht kennt
  rationale: Das ergänzte Pronomen „sie“ verweist eindeutig auf die unmittelbar zuvor genannten Gesetze.
- source_word: תְּהוֹדְעוּן
  choice: den sollt ihr unterweisen
  rationale: Der Kausativ von ידע bedeutet „wissen lassen/bekannt machen“. Im Zusammenhang mit Gottes Gesetzen ist „unterweisen“ natürlich; die Pluralform des Verbs wird durch „ihr“ bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die amtliche Sprache des Erlasses bleibt erkennbar. Der Wechsel vom Singular „du“ zum Plural „ihr“ im letzten Satz folgt den aramäischen Verbformen und wird nicht stillschweigend vereinheitlicht.
