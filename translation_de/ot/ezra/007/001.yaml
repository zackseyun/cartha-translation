source:
  edition: WLC
  text: וְ/אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/מַלְכ֖וּת אַרְתַּחְשַׁ֣סְתְּא מֶֽלֶךְ פָּרָ֑ס עֶזְרָא֙ בֶּן שְׂרָיָ֔ה בֶּן עֲזַרְיָ֖ה בֶּן חִלְקִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/001.yaml
  text: After these things[a], in the reign of Artaxerxes king of Persia, Ezra son of Seraiah, son of Azariah, son of Hilkiah—
translation:
  language: de
  text: 'Nach diesen Ereignissen, während der Herrschaft des Artaxerxes, des Königs von Persien: Esra, Sohn[a] Serajas, Sohn Asarjas, Sohn Hilkijas –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Sohn“ kann in Geschlechtsregistern auch einen entfernteren Nachkommen bezeichnen, nicht nur den unmittelbaren Sohn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: Nach
  rationale: Die Verbindung aus וְ und אַחַר knüpft an den vorherigen Erzählabschnitt an und leitet zugleich einen späteren Abschnitt ein. Im Deutschen gibt „Nach“ den zeitlichen Übergang natürlich wieder; ein zusätzliches „Und“ wäre hier schwerfällig.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diesen Ereignissen
  rationale: דְּבָרִים bezeichnet in diesem Erzählzusammenhang die zuvor berichteten Geschehnisse. „Ereignisse“ ist im modernen Deutsch klarer und natürlicher als das wörtlichere „Dinge“.
- source_word: בְּ/מַלְכוּת
  choice: während der Herrschaft
  rationale: Gemeint ist die Regierungszeit des Königs, nicht sein Herrschaftsgebiet. „Während der Herrschaft“ gibt diese zeitliche Bedeutung idiomatisch wieder.
- source_word: אַרְתַּחְשַׁסְתְּא
  choice: Artaxerxes
  rationale: Verwendet wird die im Deutschen etablierte Form des persischen Königsnamens.
- source_word: מֶלֶךְ פָּרָס
  choice: des Königs von Persien
  rationale: Die Apposition wird im Deutschen durch den Genitiv natürlich an „Artaxerxes“ angeschlossen.
- source_word: עֶזְרָא
  choice: Esra
  rationale: Verwendet wird die etablierte deutsche Namensform.
- source_word: בֶּן
  choice: Sohn
  rationale: „Sohn“ bewahrt die genealogische Formel des Hebräischen. Da בֶּן in Geschlechtsregistern auch einen entfernteren Nachkommen bezeichnen kann, wird diese Bedeutungsbreite in einer Fußnote erläutert.
- source_word: שְׂרָיָה
  choice: Seraja
  rationale: Verwendet wird die geläufige deutsche biblische Namensform.
- source_word: עֲזַרְיָה
  choice: Asarja
  rationale: Verwendet wird die geläufige deutsche biblische Namensform.
- source_word: חִלְקִיָּה
  choice: Hilkija
  rationale: Verwendet wird die geläufige deutsche biblische Namensform.
