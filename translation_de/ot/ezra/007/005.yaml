id: EZR.7.5
reference: Ezra 7:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֶּן אֲבִישׁ֗וּעַ בֶּן פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן הָ/רֹֽאשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/005.yaml
  text: son of Abishua[a], son of Phinehas, son of Eleazar[b], son of Aaron the chief priest.
translation:
  language: de
  text: Sohn Abischuas[a], Sohn des Pinhas, Sohn Eleasars, Sohn Aarons, des obersten Priesters.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Geschlechtsregistern kann »Sohn« auch »Nachkomme« bedeuten, da Zwischengenerationen ausgelassen werden können.
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: »Hoher Priester«. Wörtlich steht im Hebräischen »der Priester, der Oberste«; dies ist nicht die üblichere hebräische Bezeichnung für den Hohen Priester.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן
  choice: Sohn
  rationale: Die wiederholte genealogische Formel wird unmittelbar mit »Sohn« wiedergegeben. Da hebräische Geschlechtsregister Generationen auslassen können, kann das Wort im weiteren Sinn auch einen Nachkommen bezeichnen; diese Möglichkeit wird in einer Fußnote offengehalten.
- source_word: אֲבִישׁוּעַ
  choice: Abischua
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: פִּינְחָס
  choice: Pinhas
  rationale: Im modernen deutschen Bibelgebrauch geläufige Transliteration des Personennamens.
- source_word: אֶלְעָזָר
  choice: Eleasar
  rationale: Eingebürgerte deutsche Form des biblischen Personennamens.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Eingebürgerte deutsche Form des biblischen Personennamens.
- source_word: הַכֹּהֵן
  choice: Priester
  rationale: Das Substantiv bezeichnet Aaron als Priester und bildet zusammen mit הָרֹאשׁ eine Amts- oder Rangbezeichnung.
- source_word: הָרֹאשׁ
  choice: obersten
  rationale: רֹאשׁ bedeutet grundlegend »Kopf, Haupt« und bezeichnet hier Vorrang. »Oberster« ergibt im Deutschen eine natürliche Rangbezeichnung, ohne den abweichenden hebräischen Wortlaut mit der üblichen Bezeichnung für »Hoher Priester« gleichzusetzen.
theological_decisions:
- issue: Wiedergabe von Aarons Priestertitel
  choice: oberster Priester
  alternative: Hoher Priester; der Priester, das Oberhaupt
  rationale: Die Formulierung הַכֹּהֵן הָרֹאשׁ lautet wörtlich etwa »der Priester, der Oberste/das Haupt« und verwendet nicht die üblichere Bezeichnung הַכֹּהֵן הַגָּדוֹל für den Hohen Priester. »Oberster Priester« bewahrt den Ranggedanken und bleibt zugleich natürliches Deutsch; die traditionelle Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Knappes, würdiges Standarddeutsch, das die fortlaufende genealogische Satzstruktur des Zusammenhangs erhält. Die Namen folgen geläufigen modernen deutschen Bibelformen; der Priestertitel wird quellennah und ohne konfessionelle Zuspitzung wiedergegeben.
