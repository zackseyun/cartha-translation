  text: וַ/יַּֽעֲל֣וּ מִ/בְּנֵֽי יִ֠שְׂרָאֵל וּ/מִן הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֜ם וְ/הַ/מְשֹׁרְרִ֧ים וְ/הַ/שֹּׁעֲרִ֛ים וְ/הַ/נְּתִינִ֖ים אֶל יְרוּשָׁלִָ֑ם בִּ/שְׁנַת שֶׁ֖בַע לְ/אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/007.yaml
  text: And some of the sons of Israel[a], and some of the priests, and the Levites, and the singers, and the gatekeepers[b], and the temple servants went up to Jerusalem in the seventh year of King Artaxerxes.
translation:
  language: de
  text: Einige Israeliten[a], Priester, Leviten, Sänger, Torwächter und Tempeldiener[b] zogen im siebten Regierungsjahr des Königs Artaxerxes nach Jerusalem hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einige von den Söhnen Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „die Netinim“, eine besondere Gruppe von Dienern am Tempel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: zogen … hinauf
  rationale: Bewahrt die für Reisen nach Jerusalem typische räumliche und kultische Vorstellung des Hinaufziehens und klingt im Deutschen natürlich.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: einige Israeliten
  rationale: Das partitive מִן wird mit „einige“ wiedergegeben; „Israeliten“ ist die natürliche moderne Entsprechung für das wörtliche „Söhne Israels“.
- source_word: הַכֹּהֲנִים
  choice: Priester
  rationale: Übliche und genaue Bezeichnung dieser kultischen Amtsträger.
- source_word: הַלְוִיִּם
  choice: Leviten
  rationale: Übliche Wiedergabe der Bezeichnung dieser erblich bestimmten Gruppe im Tempeldienst.
- source_word: הַמְשֹׁרְרִים
  choice: Sänger
  rationale: Bezeichnet hier speziell die Sänger im Tempeldienst und ist präziser als das allgemeinere „Musiker“.
- source_word: הַשֹּׁעֲרִים
  choice: Torwächter
  rationale: Natürliche deutsche Bezeichnung für das Tempelpersonal, das für die Tore zuständig war.
- source_word: הַנְּתִינִים
  choice: Tempeldiener
  rationale: Eine funktionale Wiedergabe macht die Aufgabe dieser besonderen Dienstgruppe verständlich, ohne den modernen Leser mit einer bloßen Transliteration allein zu lassen.
- source_word: אֶל יְרוּשָׁלִָם
  choice: nach Jerusalem
  rationale: Idiomatiche deutsche Richtungsangabe bei Städtenamen.
- source_word: בִּשְׁנַת שֶׁבַע
  choice: im siebten Regierungsjahr
  rationale: Der Zusatz „Regierungs-“ verdeutlicht natürlich, dass die Jahreszählung auf die Herrschaft des Königs bezogen ist.
- source_word: לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: des Königs Artaxerxes
  rationale: Natürliche deutsche Wortstellung unter Wahrung des Königstitels.
theological_decisions:
- issue: Reichweite der partitiven Angabe
  choice: „Einige“ wird auf die gesamte Aufzählung bezogen.
  alternative: Nur bei den Israeliten und Priestern ausdrücklich „einige“ setzen und die übrigen Gruppen mit bestimmten Artikeln aufführen.
  rationale: Das erste מִן und das vor „Priestern“ wiederholte מִן kennzeichnen eine Auswahl aus den genannten Gruppen; bei den folgenden koordinierten Gliedern kann die partitive Konstruktion elliptisch fortwirken. Die gewählte Fassung vermeidet zudem den sachlich unwahrscheinlichen Eindruck, sämtliche Leviten, Sänger, Torwächter und Tempeldiener seien hinaufgezogen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kompakte Aufzählung vermeidet schwerfällige Artikelwiederholungen; „nach Jerusalem hinaufziehen“ erhält die räumliche und kultische Färbung des hebräischen Verbs.
