lexical_decisions:
- source_word: בֶּן
  choice: Sohn
  rationale: Das hebräische Konstrukt בֶּן wird in der Stammbaumformel am natürlichsten mit »Sohn« wiedergegeben. Auch wenn biblische Geschlechtsregister gelegentlich Generationen überspringen, bewahrt diese Wiedergabe die Form und mögliche Spannung des Ausgangstextes.
- source_word: זְרַחְיָה
  choice: Serachja
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition und in einer dem Hebräischen angenäherten Form als »Serachja« wiedergegeben.
- source_word: עֻזִּי
  choice: Usi
  rationale: Der Personenname wird in der etablierten deutschen Form »Usi« wiedergegeben; die hebräische Konsonantenverdopplung wird in der üblichen deutschen Namensform nicht eigens markiert.
- source_word: בֻּקִּי
  choice: Bukki
  rationale: Der Personenname wird als »Bukki« transliteriert; die Schreibung bewahrt die im Hebräischen markierte Konsonantenverdopplung.
