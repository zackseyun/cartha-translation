    issue: Der Zweckinfinitiv לַעֲלוֹת עִמִּי wird durch einen Finalsatz mit neu eingeführtem Subjekt wiedergegeben.
    rationale: „Damit sie mit mir hinaufzogen“ ist inhaltlich nahe, doch der hebräische Text sagt wörtlicher und syntaktisch unmittelbarer, dass Esra Führungspersonen „versammelte, um mit mir hinaufzuziehen“.
  - severity: low
    issue: „vor dem König“ ist im Deutschen für die gewährte Gunst weniger idiomatisch.
    rationale: לִפְנֵי kann zwar „vor“ heißen, bezeichnet hier aber die Gunst bzw. Stellung bei den genannten Hofpersonen. „bei dem König“ erhält den Sinn ohne unnötig räumliche Assoziation.
  - severity: low
    issue: Fußnote b beginnt mit „Da“, obwohl der hebräische Alternativausdruck keine solche zeitliche Einordnung verlangt.
    rationale: Eine neutral formulierte wörtlichere Alternative bewahrt die syntaktische Offenheit von כְּיַד besser.
