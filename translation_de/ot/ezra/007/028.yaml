  text: וְ/עָלַ֣/י הִטָּה חֶ֗סֶד לִ/פְנֵ֤י הַ/מֶּ֨לֶךְ֙ וְ/יֽוֹעֲצָ֔י/ו וּ/לְ/כָל שָׂרֵ֥י הַ/מֶּ֖לֶךְ הַ/גִּבֹּרִ֑ים וַ/אֲנִ֣י הִתְחַזַּ֗קְתִּי כְּ/יַד יְהוָ֤ה אֱלֹהַ/י֙ עָלַ֔/י וָ/אֶקְבְּצָ֧/ה מִ/יִּשְׂרָאֵ֛ל רָאשִׁ֖ים לַ/עֲל֥וֹת עִמִּֽ/י־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/028.yaml
  text: and who extended steadfast love to me before the king and his counselors and all the king’s mighty officials[a]. And I took courage, because the hand of Yahweh my God was upon me[c][b], and I gathered leading men from Israel to go up with me.
translation:
  language: de
  text: und der mir bei dem König, seinen Ratgebern und allen mächtigen Würdenträgern des Königs Güte erwiesen hat.[a] So fasste ich Mut, weil die Hand Jahwes, meines Gottes, über mir war,[b] und ich versammelte führende Männer[c] aus Israel, um mit mir hinaufzuziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mir Gunst erwiesen hat“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Ich stärkte mich entsprechend der Hand Jahwes, meines Gottes, über mir.“'
    reason: lexical_alternative
  - marker: c
    text: Hebräisch „Häupter“, das heißt führende Männer oder Oberhäupter.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִטָּה חֶסֶד
  choice: Güte erwiesen
  rationale: Die Wendung bezeichnet die Zuwendung von חֶסֶד. „Güte erwiesen“ ist im Deutschen natürlich, bewahrt das theologische Gewicht des Nomens und passt dazu, dass Gottes Güte in der Gunst des persischen Hofes sichtbar wird.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier den königlichen Hof beziehungsweise dessen Gegenwart; „vor“ gibt sie knapp und unmittelbar wieder.
- source_word: יֹעֲצָיו
  choice: seinen Ratgebern
  rationale: „Ratgeber“ ist eine natürliche und dem höfischen Zusammenhang angemessene Wiedergabe.
- source_word: שָׂרֵי הַמֶּלֶךְ הַגִּבֹּרִים
  choice: allen mächtigen Würdenträgern des Königs
  rationale: שׂרים sind hochgestellte Amtsträger; „Würdenträger“ passt zum persischen Hof, während „mächtig“ das attributive הַגִּבֹּרִים erhält.
- source_word: הִתְחַזַּקְתִּי
  choice: fasste ich Mut
  rationale: Das Hitpael bezeichnet hier, dass Esra gestärkt oder ermutigt wurde. „Mut fassen“ gibt den Sinn idiomatisch wieder, ohne die folgende göttliche Befähigung auszublenden.
- source_word: כְּיַד יְהוָה אֱלֹהַי עָלַי
  choice: weil die Hand Jahwes, meines Gottes, über mir war
  rationale: Die Wiedergabe bewahrt das biblische Bild von Gottes Hand und bringt zugleich den im Zusammenhang naheliegenden Grund für Esras Mut zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וָאֶקְבְּצָה
  choice: ich versammelte
  rationale: „Versammeln“ gibt das gezielte Zusammenbringen der Männer klar und erzählerisch passend wieder.
- source_word: רָאשִׁים
  choice: führende Männer
  rationale: Wörtlich „Häupter“; gemeint sind anerkannte männliche Führungspersonen aus Israel.
- source_word: לַעֲלוֹת עִמִּי
  choice: damit sie mit mir hinaufzogen
  rationale: „Hinaufziehen“ bewahrt die übliche biblische Richtungsangabe für die Reise nach Jerusalem; der Finalsatz ist im Deutschen natürlicher als eine substantivische oder infinitivische Konstruktion.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text gebraucht das Tetragramm als persönlichen Gottesnamen. „Jahwe“ erhält diesen Namenscharakter, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Esras Mut zu Gottes Hand
  choice: 'kausale Wiedergabe: „weil die Hand Jahwes … über mir war“'
  alternative: 'formal: „entsprechend der Hand Jahwes … über mir stärkte ich mich“'
  rationale: כְּ kann formal „gemäß/entsprechend“ bedeuten; im Zusammenhang erklärt die Hand Gottes jedoch, wodurch Esra Mut fasste. Die Hauptfassung macht diese naheliegende Beziehung deutlich, während die Fußnote die formalere Möglichkeit bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Versanfang bleibt als Fortsetzung des vorangehenden Lobpreises mit „und der“ syntaktisch angebunden. Das Bild von Gottes Hand sowie das traditionelle „hinaufziehen“ nach Jerusalem werden bewahrt; verwaltungssprachlich verengende oder konfessionell geprägte Formulierungen werden vermieden.
