source:
  edition: WLC
  text: כָּ/ל קֳבֵ֣ל דְּנָה֩ אָסְפַּ֨רְנָא תִקְנֵ֜א בְּ/כַסְפָּ֣/א דְנָ֗ה תּוֹרִ֤ין דִּכְרִין֙ אִמְּרִ֔ין וּ/מִנְחָתְ/ה֖וֹן וְ/נִסְכֵּי/ה֑וֹן וּ/תְקָרֵ֣ב הִמּ֔וֹ עַֽל מַדְבְּחָ֔/ה דִּ֛י בֵּ֥ית אֱלָהֲ/כֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/017.yaml
  text: Therefore you shall diligently buy with this silver bulls[a], rams, lambs, along with their grain offerings and their drink offerings[c][b], and you shall offer them on the altar of the house of your God that is in Jerusalem.
translation:
  language: de
  text: Darum sollst du mit diesem Silber[a] sorgfältig[b] Stiere, Widder und Lämmer samt den dazugehörigen Speiseopfern und Trankopfern kaufen und sie auf dem Altar des Hauses eures Gottes[c] in Jerusalem darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Silber“ kann hier als Bezeichnung für Geldmittel verstanden werden; wörtlich steht „Silber“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „genau“ beziehungsweise „gewissenhaft“. Das aramäische Adverb hebt die sorgfältige Ausführung des Auftrags hervor.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist der Tempel eures Gottes; wörtlich steht „das Haus eures Gottes“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: Darum
  rationale: Die aramäische Wendung drückt eine Folgerung aus; „Darum“ gibt sie knapp und natürlich wieder.
- source_word: אָסְפַּרְנָא
  choice: sorgfältig
  rationale: Das Adverb betont die gewissenhafte beziehungsweise genaue Ausführung des Auftrags.
- source_word: תִקְנֵא
  choice: sollst du … kaufen
  rationale: Das Verb bezeichnet den Kauf oder Erwerb; die Konstruktion mit „sollst“ bewahrt den verbindlichen Charakter der königlichen Anweisung.
- source_word: בְּכַסְפָּא דְנָה
  choice: mit diesem Silber
  rationale: „Silber“ entspricht dem konkreten Wortlaut und bezeichnet im Verwaltungskontext zugleich die bereitgestellten Geldmittel.
- source_word: תּוֹרִין דִּכְרִין אִמְּרִין
  choice: Stiere, Widder und Lämmer
  rationale: Diese geläufigen deutschen Opferbegriffe geben die drei Tierbezeichnungen präzise und verständlich wieder.
- source_word: מִנְחָתְהוֹן
  choice: die dazugehörigen Speiseopfer
  rationale: Im Opferkontext bezeichnet מִנְחָה das begleitende, aus pflanzlichen Erzeugnissen bestehende Opfer; „Speiseopfer“ ist der etablierte und verständliche deutsche Ausdruck.
- source_word: נִסְכֵּיהוֹן
  choice: Trankopfer
  rationale: Der kultische Fachbegriff bezeichnet ausgegossene Flüssigkeitsopfer; „Trankopfer“ ist transparenter als „Libationen“.
- source_word: וּתְקָרֵב הִמּוֹ
  choice: und sie … darbringen
  rationale: Das Verb bedeutet im Opferzusammenhang „heranbringen/darbringen“; „darbringen“ vermittelt die kultische Handlung natürlich.
- source_word: עַל מַדְבְּחָה
  choice: auf dem Altar
  rationale: Dies ist die direkte und idiomatische Wiedergabe der Ortsangabe.
- source_word: בֵּית אֱלָהֲכֹם
  choice: des Hauses eures Gottes
  rationale: „Haus“ bewahrt die konkrete aramäische Ausdrucksweise; das pluralische Possessivsuffix wird mit „eures“ erhalten, obwohl der angesprochene Handlungsträger im Singular steht.
theological_decisions:
- issue: Wechsel zwischen singularischer Anrede und pluralischem Possessivpronomen
  choice: „sollst du“ und „eures Gottes“
  alternative: „sollt ihr“ oder „deines Gottes“
  rationale: Der aramäische Text hat beim Auftrag eine singularische Verbform, aber bei „Gott“ ein pluralisches Possessivsuffix. Die Übersetzung bewahrt diesen auffälligen Wechsel, statt ihn stillschweigend anzugleichen.
- issue: Bezeichnung des Heiligtums
  choice: „Haus“
  alternative: „Tempel“
  rationale: „Tempel“ bezeichnet sachlich denselben Ort, doch „Haus“ erhält das Bild und den genauen Ausdruck des Ausgangstextes, ohne eine zusätzliche Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die kultischen Begriffe „Speiseopfer“, „Trankopfer“, „Altar“ und „darbringen“ bleiben wegen ihrer sachlichen Präzision erhalten. Der Wechsel von singularischer Anrede zu pluralischem „eures“ folgt bewusst dem aramäischen Text.
