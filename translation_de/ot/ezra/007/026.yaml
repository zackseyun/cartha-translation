base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/026.yaml
  text: And anyone who will not obey the law of your God and the law of the king[a], let judgment be executed on him promptly, whether for death, or for banishment, or for confiscation of goods, or for imprisonment.
translation:
  language: de
  text: Und jeder, der das Gesetz deines Gottes und das Gesetz des Königs nicht befolgt, an dem soll unverzüglich das Urteil vollstreckt werden, sei es Tod, Verbannung[a], Einziehung seines Vermögens oder Haft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ausweisung«; wörtlicher: »Entwurzelung«. Das seltene aramäische Wort bezeichnet möglicherweise die Verbannung aus dem eigenen Ort oder der Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל דִּי
  choice: Und jeder, der
  rationale: Leitet einen indefiniten Relativsatz ein und bewahrt den auf jede einzelne Person bezogenen Sinn in natürlichem Deutsch.
- source_word: לָא לֶהֱוֵא עָבֵד
  choice: nicht befolgt
  rationale: Wörtlich steht eine Form von »nicht tun«; in Verbindung mit »Gesetz« bezeichnet sie rechtlichen Gehorsam beziehungsweise die Befolgung.
- source_word: דָּתָא
  choice: Gesetz
  rationale: Das reichsaramäische Wort kann Gesetz, Erlass oder Rechtsvorschrift bedeuten. »Gesetz« wahrt hier die Parallelität zwischen dem Gesetz Gottes und dem des Königs.
- source_word: אֱלָהָךְ
  choice: deines Gottes
  rationale: Gibt die Anrede an Esra mit Possessivsuffix der zweiten Person Singular direkt wieder.
- source_word: וְדָתָא דִּי מַלְכָּא
  choice: und das Gesetz des Königs
  rationale: Bewahrt die koordinierte und parallele Formulierung der beiden Rechtsordnungen.
- source_word: אָסְפַּרְנָא
  choice: unverzüglich
  rationale: Das Adverb bezeichnet hier eine rasche beziehungsweise gewissenhafte Vollstreckung; »unverzüglich« passt zum amtlich-rechtlichen Zusammenhang.
- source_word: דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ
  choice: an dem soll das Urteil vollstreckt werden
  rationale: Bewahrt die passive Rechtsformulierung und macht deutlich, dass eine gerichtliche Sanktion gegen den Betreffenden vollzogen wird.
- source_word: הֵן ... הֵן ... הֵן ... וְ
  choice: sei es ... oder ... oder ... oder
  rationale: Kennzeichnet die folgenden Strafen als alternative gerichtliche Sanktionen.
- source_word: לְמוֹת
  choice: Tod
  rationale: Gibt die erste Sanktion knapp und parallel zu den weiteren Substantiven wieder, ohne sie durch einen modernen Fachbegriff auszudeuten.
- source_word: לשרשו
  choice: Verbannung
  rationale: Der seltene Ausdruck hängt wahrscheinlich mit »entwurzeln« zusammen und bezeichnet im Rechtskontext vermutlich die Entfernung aus Ort oder Gemeinschaft; die Unsicherheit wird in einer Fußnote ausgewiesen.
- source_word: לַעֲנָשׁ נִכְסִין
  choice: Einziehung seines Vermögens
  rationale: Die Wendung bezeichnet eine Strafe am Besitz. »Einziehung seines Vermögens« gibt eine staatlich verhängte Vermögenssanktion verständlich wieder, ohne ihren möglichen Umfang sicherer festzulegen als der Kontext.
- source_word: וְלֶאֱסוּרִין
  choice: Gefängnis
  rationale: Der Ausdruck kann wörtlich Fesseln oder Haft bezeichnen; in der Reihe gerichtlicher Sanktionen ist »Gefängnis« die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Verhältnis zwischen dem Gesetz Gottes und dem Gesetz des Königs
  choice: Beide werden gleichgeordnet als »das Gesetz deines Gottes und das Gesetz des Königs« wiedergegeben.
  alternative: Das königliche Gesetz dem Gesetz Gottes unterordnen oder lediglich als dessen Durchsetzung erklären.
  rationale: Der aramäische Wortlaut nennt beide Rechtsgrößen koordiniert. Die Übersetzung bewahrt diese Spannung, ohne eine nicht ausdrücklich genannte theologische Rangordnung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sachlich-rechtlichem Ton. Die Satzstruktur bleibt gut verständlich, während die Parallelität der beiden Gesetze und die Reihe der Sanktionen erhalten werden.
