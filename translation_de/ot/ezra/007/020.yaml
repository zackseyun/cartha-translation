  text: וּ/שְׁאָ֗ר חַשְׁחוּת֙ בֵּ֣ית אֱלָהָ֔/ךְ דִּ֥י יִפֶּל לָ֖/ךְ לְ/מִנְתַּ֑ן תִּנְתֵּ֕ן מִן בֵּ֖ית גִּנְזֵ֥י מַלְכָּֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/020.yaml
  text: And whatever other need of the house of your God falls to you to provide[a], you shall provide it from the house of the king’s treasuries.
translation:
  language: de
  text: Und was sonst noch für das Haus deines Gottes benötigt wird und dir zu beschaffen obliegt, das sollst du aus dem königlichen Schatzhaus bereitstellen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁאָר חַשְׁחוּת
  choice: Und was sonst noch … benötigt wird
  rationale: Die Verbindung bezeichnet weiteren, noch nicht näher bestimmten Bedarf. Die deutsche Formulierung gibt dies natürlich wieder, ohne den Begriff auf bloße Ausgaben zu verengen.
- source_word: בֵּית אֱלָהָךְ
  choice: das Haus deines Gottes
  rationale: Bewahrt die aramäische Tempelbezeichnung formal transparent; „Tempel“ wäre sachlich möglich, aber stärker deutend.
- source_word: יִפֶּל לָךְ לְמִנְתַּן
  choice: dir zu beschaffen obliegt
  rationale: Die Wendung bezeichnet etwas, dessen Bereitstellung Esras Aufgabe wird. „Obliegt“ erhält den Gedanken der ihm zufallenden Verpflichtung; „beschaffen“ passt zum administrativen Versorgungskontext.
- source_word: תִּנְתֵּן
  choice: das sollst du … bereitstellen
  rationale: Gibt den verpflichtenden Sinn der Verbform wieder und nimmt den zuvor genannten Bedarf als Objekt auf.
- source_word: מִן בֵּית גִּנְזֵי מַלְכָּא
  choice: aus dem königlichen Schatzhaus
  rationale: Die idiomatische deutsche Wiedergabe bezeichnet die königliche Schatzkammer beziehungsweise Finanzverwaltung, ohne die schwerfällige aramäische Konstruktionsfolge nachzubilden.
