  text: וָ/אֱהִ֥י לָ/הֶ֖ם כְּמוֹ שָׁ֑חַל כְּ/נָמֵ֖ר עַל דֶּ֥רֶךְ אָשֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/007.yaml
  text: So I became to them like a lion[a]; like a leopard I lurked by the way.
translation:
  language: de
  text: Da wurde ich für sie wie ein Löwe; wie ein Leopard lauerte ich am Weg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das letzte hebräische Wort ist schwierig. Möglich sind auch: »wie ein Leopard beobachtete ich am Weg« oder »wie ein Leopard lag ich am Weg auf der Lauer«. Der Konsonantentext kann außerdem als »Assur« verstanden werden, etwa: »wie ein Leopard am Weg nach Assur«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: So wurde ich
  rationale: Das Qal-Wayyiqtol der 1. Person Singular von היה bezeichnet hier im Zusammenhang der Gerichtsaussage ein Eintreten in einen Zustand. »So« gibt die folgernde Kraft des ו wieder.
- source_word: לָהֶם
  choice: für sie
  rationale: Die Präposition ל mit Suffix bezeichnet die Beziehung zu Israel. In Verbindung mit »wurde ich … wie« ist »für sie« im Deutschen natürlich, ohne die bedrohliche Aussage abzuschwächen.
- source_word: כְּמוֹ שָׁחַל
  choice: wie ein Löwe
  rationale: כְּמוֹ leitet den Vergleich ein; שָׁחַל bezeichnet einen Löwen, möglicherweise mit besonderem Nachdruck auf seiner Wildheit. Eine Altersangabe wie »junger Löwe« ist hier nicht zwingend.
- source_word: כְּנָמֵר
  choice: wie ein Leopard
  rationale: נָמֵר bezeichnet die gefleckte Raubkatze und wird im heutigen Standarddeutsch am klarsten mit »Leopard« wiedergegeben.
- source_word: עַל דֶּרֶךְ
  choice: am Weg
  rationale: Die Wendung bezeichnet den Ort entlang eines Reisewegs und passt zum Bild eines Raubtiers, das dort auf Beute lauert.
- source_word: אָשׁוּר
  choice: lauerte ich
  rationale: Im Raubtierbild lässt sich die schwierige Form als Verb der 1. Person Singular im Sinn von Beobachten oder Auflauern verstehen. »Lauerte ich« gibt die im Zusammenhang naheliegende Hinterhaltsszene prägnant wieder; die Unsicherheit wird in der Fußnote offengelegt.
theological_decisions:
- issue: Anthropomorphe Darstellung Gottes als Raubtier im Gericht
  choice: Die direkten Vergleiche mit Löwe und Leopard sowie das Lauern bleiben unverändert scharf erhalten.
  alternative: Das Bild durch eine mildere Formulierung wie »beobachtete ich den Weg« abzuschwächen.
  rationale: Der hebräische Text schildert JHWH mit bewusst erschreckender Gerichtsmetaphorik. Diese theologische Spannung darf nicht zugunsten eines milderen Gottesbildes aufgelöst werden.
- issue: Deutung des schwierigen Schlussworts אָשׁוּר
  choice: 'Als Verb der 1. Person Singular: »lauerte ich«.'
  alternative: 'Als Ortsname »Assur«: etwa »wie ein Leopard am Weg nach Assur«; oder verbal schwächer: »beobachtete ich«.'
  rationale: Der Parallelismus der beiden Raubtierbilder und die Stellung am Weg sprechen für eine verbale Deutung als Auflauern. Da der Konsonantentext auch an den Namen Assur denken lässt und die Verbform schwierig ist, bleibt die Alternative ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, bildstarker Satzführung. Die drastische Raubtiermetaphorik wird nicht geglättet. Das Semikolon macht die parallelen Vergleiche deutlich; die Fußnote wahrt die echte lexikalische und textliche Mehrdeutigkeit des Schlussworts.
