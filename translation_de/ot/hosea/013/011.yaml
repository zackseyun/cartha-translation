source:
  edition: WLC
  text: אֶֽתֶּן לְ/ךָ֥ מֶ֨לֶךְ֙ בְּ/אַפִּ֔/י וְ/אֶקַּ֖ח בְּ/עֶבְרָתִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/011.yaml
  text: I gave you a king in my anger[b][a], and I took him away in my wrath.
translation:
  language: de
  text: Ich gab dir einen König in meinem Zorn[a] und nahm ihn in meinem Grimm weg.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formaler: „Ich gebe dir einen König in meinem Zorn und nehme ihn in meinem Grimm weg.“ Die hebräischen Verbformen können als Gegenwart oder Zukunft wiedergegeben werden; der Zusammenhang erlaubt jedoch einen rückblickenden Sinn.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „und nahm“. Das Objekt „ihn“ – den König – ist im Hebräischen nur mitgemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתֶּן
  choice: Ich gab
  rationale: Der Qal-Imperfekt der 1. Person Singular kann formal gegenwärtig oder zukünftig verstanden werden. Im Zusammenhang blickt die Aussage jedoch plausibel auf Gottes Gewährung des Königtums zurück; deshalb steht im Haupttext die Vergangenheit.
- source_word: לְךָ
  choice: dir
  rationale: Die Präposition ל mit Suffix der 2. Person maskulin Singular bezeichnet den Empfänger. Der Singular bewahrt die kollektive Anrede Israels.
- source_word: מֶלֶךְ
  choice: einen König
  rationale: Das artikellose Substantiv bezeichnet hier natürlich einen König beziehungsweise das gewährte Königtum, ohne eine bestimmte Person ausdrücklich zu nennen.
- source_word: בְּאַפִּי
  choice: in meinem Zorn
  rationale: אַף bezeichnet in dieser Wendung Zorn; die Formulierung bewahrt die emotionale und zugleich umstandsbezogene Kraft des hebräischen Ausdrucks.
- source_word: וְאֶקַּח
  choice: und nahm ihn weg
  rationale: לקח bedeutet grundsätzlich „nehmen“. Das Pronomen „ihn“ nimmt den zuvor genannten König als im Hebräischen ausgelassenes Objekt auf; „wegnehmen“ gibt im Deutschen den kontextuellen Sinn der Entfernung wieder.
- source_word: בְּעֶבְרָתִי
  choice: in meinem Grimm
  rationale: עֶבְרָה bezeichnet heftigen, überströmenden Zorn. „Grimm“ ist würdig und verständlich und erhält zugleich die lexikalische Abstufung gegenüber אַף („Zorn“).
theological_decisions:
- issue: Zeit- und Aspektwert der beiden Imperfektformen
  choice: 'Rückblickende Vergangenheit: „Ich gab … und nahm … weg“'
  alternative: 'Gegenwart oder Zukunft: „Ich gebe … und nehme/werde … wegnehmen“'
  rationale: Obwohl beide hebräischen Formen morphologisch Imperfekte sind, legt der Zusammenhang einen Rückblick auf Gottes Gewährung und Entziehung von Königen nahe. Die alternative, formalere Wiedergabe wird in einer Fußnote bewahrt.
- issue: Unausgesprochenes Objekt von וְאֶקַּח
  choice: Der König wird als Objekt durch „ihn“ ausdrücklich aufgenommen.
  alternative: 'Das Objekt unausgesprochen lassen: „und nahm weg“'
  rationale: Das Hebräische nennt kein Objekt, doch „König“ aus dem ersten Satzglied ist der natürliche Bezug. Im Deutschen sorgt das Pronomen für eine klare, idiomatische Aussage, ohne einen neuen Referenten einzuführen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Zorn“ und „Grimm“ erhalten die Unterscheidung der beiden hebräischen Zornbegriffe. Die knappe Parallelstruktur des Ausgangstextes bleibt gewahrt.
