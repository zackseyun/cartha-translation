  text: I knew you in the wilderness[b][a], in a land of severe drought.
translation:
  language: de
  text: Ich kannte dich[a] in der Wüste, in einem Land großer Dürre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich sorgte für dich“ oder „Ich erkannte dich an“. Das hebräische Verb kann über bloßes Wissen hinaus eine persönliche oder bundesbezogene Beziehung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in einem Land glühender Hitze“, „in einem Land des Durstes“ oder „in einem ausgedörrten Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַעְתִּיךָ
  choice: Ich kannte dich
  rationale: ידע bedeutet zunächst „kennen/wissen“. Hier kann das Verb zugleich eine persönliche, fürsorgliche oder bundeshafte Beziehung ausdrücken; die Wiedergabe mit „kannte“ bewahrt den lexikalischen Kern, ohne diese Nuance im Haupttext festzulegen.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet Wüste oder Wildnis. „Wüste“ ist im modernen Deutschen natürlich und lässt den Anklang an Israels Wüstenzeit deutlich hervortreten.
- source_word: בְּאֶרֶץ
  choice: in einem Land
  rationale: Die unbestimmte hebräische Fügung wird im Deutschen idiomatisch mit „in einem Land“ wiedergegeben.
- source_word: תַּלְאֻבוֹת
  choice: sengender Dürre
  rationale: Das seltene Wort bezeichnet extreme Trockenheit, Durst oder versengende Hitze. „Sengende Dürre“ bringt sowohl die Trockenheit als auch die darin anklingende Hitze prägnant zum Ausdruck.
theological_decisions:
- issue: Bedeutungsweite des göttlichen „Kennens“ Israels
  choice: Die relationale beziehungsweise bundeshafte Bedeutung bleibt in „Ich kannte dich“ unausgesprochen, aber offen.
  alternative: „Ich sorgte für dich“ oder „Ich erkannte dich an“
  rationale: Der Zusammenhang erinnert wahrscheinlich an Gottes fürsorgliche Bundesbeziehung zu Israel während der Wüstenzeit. Da das hebräische Verb jedoch ausdrücklich „kennen“ lautet, wird diese Deutung nicht in den Haupttext eingetragen, sondern als mögliche Nuance in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; „sengende Dürre“ macht das seltene Schlusswort verständlich, ohne seine Bildkraft einzuebnen.
