  text: וְ/אָנֹכִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם וֵ/אלֹהִ֤ים זֽוּלָתִ/י֙ לֹ֣א תֵדָ֔ע וּ/מוֹשִׁ֥יעַ אַ֖יִן בִּלְתִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/004.yaml
  text: But I am Yahweh your God from the land of Egypt[a]; you know no God besides me[b], and there is no savior except me.
translation:
  language: de
  text: Doch ich bin Jahwe, dein Gott, seit der Befreiung aus dem Land Ägypten.[a] Einen Gott außer mir sollst du nicht kennen,[b] und es gibt keinen Retter außer mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „seit der Zeit in Ägypten“ oder, näher am Wortlaut, „aus dem Land Ägypten“. Die hebräische Wendung kann entweder Jahwes Beziehung zu Israel seit dem Exodus oder sein rettendes Handeln beim Herausführen betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Einen Gott außer mir kennst du nicht.“ Die hebräische Verbform kann sowohl als bundesbezogenes Verbot beziehungsweise Gebot als auch als Feststellung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Doch ich
  rationale: Die Konjunktion mit dem betonten Personalpronomen hebt im Zusammenhang den Gegensatz hervor; „Doch ich“ gibt dies im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Mit dem Suffix der zweiten Person maskulin Singular und in Verbindung mit Jahwe bezeichnet אֱלֹהִים hier den einen Gott Israels in seiner Bundesbeziehung.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: vom Land Ägypten her
  rationale: Diese Wiedergabe wahrt die räumlich-zeitliche Offenheit der Präposition מִן und lässt sowohl den Bezug auf den Auszug als auch auf die seitdem bestehende Beziehung anklingen.
- source_word: וֵאלֹהִים זוּלָתִי
  choice: Einen Gott außer mir
  rationale: אֱלֹהִים ist hier trotz seiner Form im verneinten Ausschließlichkeitssatz sinnvoll als indefiniter Singular zu verstehen; זוּלָתִי schließt jeden anderen aus.
- source_word: לֹא תֵדָע
  choice: sollst du nicht kennen
  rationale: Das Modalverb bringt die mögliche bundesrechtlich-prohibitive Kraft des hebräischen Imperfekts zur Geltung; die alternative deklarative Lesart wird in einer Fußnote bewahrt.
- source_word: וּמוֹשִׁיעַ
  choice: und es gibt keinen Retter
  rationale: Das Partizip bezeichnet einen rettenden oder befreienden Akteur; mit אַיִן ergibt sich eine klare Existenzverneinung.
- source_word: אַיִן בִּלְתִּי
  choice: es gibt keinen … außer mir
  rationale: Die Konstruktion drückt uneingeschränkte Ausschließlichkeit aus und wird in natürlichem modernem Deutsch entsprechend wiedergegeben.
theological_decisions:
- issue: Ausschließliche göttliche Identität und Rettung
  choice: Jahwe erklärt, dass Israel keinen anderen Gott kennen soll und dass es keinen Retter außer ihm gibt.
  alternative: 'Der mittlere Satz kann als Feststellung verstanden werden: „Einen Gott außer mir kennst du nicht.“'
  rationale: Der hebräische Text verbindet die durch den Exodus geprägte Bundesbeziehung mit Jahwes ausschließlichem Anspruch und seiner alleinigen Rettermacht. Die Übersetzung formuliert keine späteren dogmatischen Folgerungen aus, die der Vers selbst nicht ausdrücklich nennt.
- issue: Bezug der Wendung מֵאֶרֶץ מִצְרָיִם
  choice: „vom Land Ägypten her“ lässt Ursprung, Exodusbezug und zeitliche Erstreckung offen.
  alternative: „seit dem Land Ägypten“ oder „aus dem Land Ägypten“ würde jeweils die zeitliche beziehungsweise räumlich-rettende Nuance stärker festlegen.
  rationale: Die Präposition und der knappe Ausdruck erlauben mehrere eng verwandte Akzentsetzungen; die Hauptfassung soll diese Spannung nicht vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jahwe“ bewahrt den Gottesnamen; „Retter“ ist allgemein verständlich und gibt die personale Partizipialform knapp wieder. Die Satzstellung betont wie der hebräische Text den ausschließlichen Anspruch.
