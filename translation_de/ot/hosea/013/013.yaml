base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/013.yaml
  text: The labor pains of a woman giving birth come upon him[a]; he is an unwise son[b], for at the proper time he does not present himself at the opening of the womb.
translation:
  language: de
  text: Die Wehen einer Gebärenden kommen über ihn[a]. Er ist ein unkluger Sohn; denn zur rechten Zeit tritt er nicht an der Öffnung des Mutterleibs hervor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geburtsschmerzen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „am Durchbruchsort der Kinder“; gemeint ist der Ort, an dem das Kind bei der Geburt hervortritt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי יֹלֵדָה
  choice: die Wehen einer Gebärenden
  rationale: חֶבְלֵי bezeichnet im Zusammenhang mit יֹלֵדָה die Geburts- beziehungsweise Wehenschmerzen. „Wehen einer Gebärenden“ ist präzise, natürlich und bewahrt das konkrete Geburtsbild.
- source_word: יָבֹאוּ לוֹ
  choice: kommen über ihn
  rationale: Die Wendung beschreibt, dass die Wehen ihn erreichen beziehungsweise über ihn kommen. Diese Formulierung wahrt die Bildsprache, ohne den Vorgang zusätzlich als Strafe auszudeuten.
- source_word: בֵן לֹא חָכָם
  choice: ein unverständiger Sohn
  rationale: Die wörtliche Verneinung von „weise“ wird idiomatisch wiedergegeben. „Unverständig“ bewahrt den Bezug auf mangelnde Einsicht, ohne die Aussage gegenüber dem Hebräischen unnötig zu verschärfen.
- source_word: כִּי עֵת
  choice: denn zur rechten Zeit
  rationale: עֵת bezeichnet hier den entscheidenden Zeitpunkt der Geburt. „Zur rechten Zeit“ macht diesen situationsgebundenen Sinn im Deutschen verständlich.
- source_word: לֹא יַעֲמֹד
  choice: stellt er sich nicht
  rationale: Das Verb bedeutet grundsätzlich „stehen“. Im Geburtsbild geht es darum, dass der Sohn am entscheidenden Ort nicht zum Hervorkommen bereitsteht; „stellt er sich nicht“ bleibt dem Grundbild näher als eine vollständig erklärende Umschreibung.
- source_word: בְּמִשְׁבַּר בָּנִים
  choice: an die Geburtsöffnung
  rationale: Die schwierige Wendung bezeichnet den Ort des Durchbruchs beziehungsweise Hervorkommens der Kinder. „Geburtsöffnung“ vermittelt das konkrete Bild verständlich; die wörtlichere Struktur wird in der Fußnote offengelegt.
theological_decisions:
- issue: Bezugsperson des Geburtsbildes
  choice: Der männliche Singular und das Sohnbild bleiben ohne ausdrückliche Nennung Ephraims oder Israels stehen.
  alternative: „Ephraim ist ein unverständiger Sohn“ oder „Israel ist wie ein unverständiger Sohn“.
  rationale: Der weitere Zusammenhang legt den Bezug nahe, doch der hebräische Vers nennt die Bezugsperson hier nicht ausdrücklich. Die Übersetzung soll die metaphorische Spannung nicht durch eine erklärende Ergänzung auflösen.
- issue: Deutung des ausbleibenden Hervorkommens
  choice: Das Bild wird als Nichtantreten an der Geburtsöffnung wiedergegeben, ohne seine geistliche oder politische Bedeutung im Haupttext auszudeuten.
  alternative: Eine ausdeutende Wiedergabe wie „er verpasst die Stunde seiner Rettung“ oder „er weigert sich, geboren zu werden“.
  rationale: Solche Fassungen legen die Anwendung der Metapher fest, während der hebräische Text das paradoxe Geburtsbild selbst sprechen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, eindringliche Geburtsmetaphorik bleibt erhalten; die schwierige Wendung am Versende wird im Haupttext verständlich und in der Fußnote formnäher wiedergegeben.
