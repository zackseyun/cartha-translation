  terminology: „Wehen“, „Sohn“ und die nicht näher bestimmte männliche Bezugsperson bewahren die hebräische Bildsprache. „Öffnung des Mutterleibs“ erläutert die schwierige Wendung בְּמִשְׁבַּר בָּנִים in einer im Deutschen verständlichen Weise; die Fußnote kennzeichnet die formnähere und semantisch schwierige Ausdrucksweise.
