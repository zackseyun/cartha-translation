  yaml_path: translation/ot/hosea/013/006.yaml
  text: As their pasture[a], they were satisfied; they were satisfied, and their heart was lifted up[b]; therefore they forgot me.
translation:
  language: de
  text: Als sie Weide hatten[a], wurden sie satt; als sie satt waren, erhob sich ihr Herz[b]. Darum vergaßen sie mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Entsprechend ihrer Weide“ oder „Als sie geweidet wurden“. Die hebräische Wendung ist knapp und kann die Umstände ihres Überflusses bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihr Herz erhob sich“; gemeint ist, dass sie stolz wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַרְעִיתָם
  choice: Als sie Weide hatten
  rationale: Die mit כְּ eingeleitete knappe Wendung wird im Zusammenhang am besten temporal bzw. umstandsbezogen verstanden. „Weide“ bewahrt das konkrete Bild von מַרְעִית, während die Fußnote die grammatische Mehrdeutigkeit offenhält.
- source_word: וַיִּשְׂבָּעוּ … שָׂבְעוּ
  choice: wurden sie satt; sie wurden satt
  rationale: Die Wiederholung der Wurzel שבע wird beibehalten, da sie den Zusammenhang zwischen Versorgung, Sättigung und der folgenden Selbstüberhebung rhetorisch hervorhebt.
- source_word: וַיָּרָם לִבָּם
  choice: ihr Herz erhob sich
  rationale: Die hebräische Metapher bleibt erhalten und wird nicht unmittelbar als „sie wurden stolz“ aufgelöst.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die kurze Folgerungspartikel wird in natürlichem, gewichtigem Deutsch wiedergegeben.
- source_word: שְׁכֵחוּנִי
  choice: vergaßen sie mich
  rationale: Die direkte Aussage von שכח mit Gott als Objekt bleibt unverändert stark; „vernachlässigten“ wäre stärker deutend.
theological_decisions:
- issue: Selbstüberhebung des Herzens nach erfahrener Sättigung
  choice: Die Metapher „ihr Herz erhob sich“ wird bewahrt.
  alternative: „Sie wurden stolz“ oder „ihr Herz wurde hochmütig“
  rationale: 'Die bildhafte Form wahrt die theologische Spannung des Textes: Überfluss führt zur Erhebung des Herzens und schließlich zum Vergessen Gottes, ohne die Metapher durch eine eindeutige Auslegung zu ersetzen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Aussage „wurden sie satt“ bildet die auffällige hebräische Wiederholung nach; das konkrete Weidebild und die Metapher vom sich erhebenden Herzen bleiben erhalten.
