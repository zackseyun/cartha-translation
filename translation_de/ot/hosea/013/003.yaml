source:
  edition: WLC
  text: לָ/כֵ֗ן יִֽהְיוּ֙ כַּ/עֲנַן בֹּ֔קֶר וְ/כַ/טַּ֖ל מַשְׁכִּ֣ים הֹלֵ֑ךְ כְּ/מֹץ֙ יְסֹעֵ֣ר מִ/גֹּ֔רֶן וּ/כְ/עָשָׁ֖ן מֵ/אֲרֻבָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/003.yaml
  text: Therefore they will be like the morning cloud[a], and like the dew that goes away early, like chaff whirled from the threshing floor, and like smoke from a window.
translation:
  language: de
  text: 'Darum werden sie sein wie eine Morgenwolke,

    wie der Tau, der früh vergeht,

    wie Spreu, die von der Tenne fortgewirbelt wird,

    und wie Rauch aus einem Fenster[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus einer Gitteröffnung“. Das hebräische Wort kann eine Fensteröffnung oder eine vergitterte Öffnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die angekündigte Folge des vorausgehenden Gerichts und gibt den schlussfolgernden Sinn im heutigen Deutsch natürlich wieder.
- source_word: יִהְיוּ
  choice: werden sie sein
  rationale: Gibt die einfache Zukunftsform von היה wieder und bewahrt die Form einer prophetischen Folgenankündigung.
- source_word: כַּעֲנַן בֹּקֶר
  choice: wie eine Morgenwolke
  rationale: Bewahrt das Bild einer flüchtigen, rasch verschwindenden Wolke; der unbestimmte Artikel ist im Deutschen idiomatisch.
- source_word: וְכַטַּל מַשְׁכִּים הֹלֵךְ
  choice: wie der Tau, der früh vergeht
  rationale: מַשְׁכִּים bezeichnet das frühe Geschehen; הֹלֵךְ wird hier idiomatisch als Vergehen beziehungsweise Verschwinden verstanden. Die Formulierung hält das Bild knapp und verständlich.
- source_word: כְּמֹץ
  choice: wie Spreu
  rationale: מוֹץ bezeichnet die leichte Spreu, die beim Worfeln fortgeblasen wird.
- source_word: יְסֹעֵר
  choice: fortgewirbelt wird
  rationale: Die Verbform vermittelt stürmische, wirbelnde Bewegung. Die passive deutsche Wendung entspricht dem Zusammenhang und erhält die Lebendigkeit des Bildes.
- source_word: מִגֹּרֶן
  choice: von der Tenne
  rationale: Bewahrt den landwirtschaftlichen Schauplatz des Dreschens und Worfelns sowie die Ausgangsbedeutung der Präposition.
- source_word: וּכְעָשָׁן
  choice: und wie Rauch
  rationale: Erhält die parallele Reihe von Vergleichen und das Bild schnellen Verfliegens.
- source_word: מֵאֲרֻבָּה
  choice: aus einem Fenster
  rationale: אֲרֻבָּה kann eine Fensteröffnung oder eine vergitterte beziehungsweise gitterartige Öffnung bezeichnen. „Fenster“ ist im Haupttext am unmittelbarsten verständlich; die Alternative wird in der Fußnote genannt.
