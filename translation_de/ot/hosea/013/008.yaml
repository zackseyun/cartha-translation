  to: Ich werde sie angreifen wie eine Bärin, der man die Jungen geraubt hat, und die Umhüllung ihres Herzens aufreißen[a]. Dort werde ich sie verschlingen wie ein Löwe[b]; ein wildes Tier des Feldes wird sie auseinanderreißen.
