  text: אֶפְגְּשֵׁ/ם֙ כְּ/דֹ֣ב שַׁכּ֔וּל וְ/אֶקְרַ֖ע סְג֣וֹר לִבָּ֑/ם וְ/אֹכְלֵ֥/ם שָׁם֙ כְּ/לָבִ֔יא חַיַּ֥ת הַ/שָּׂדֶ֖ה תְּבַקְּעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/008.yaml
  text: I will attack them like a bear robbed of her cubs[a], and I will tear open the enclosure of their heart; there I will devour them like a lioness[b]; a wild beast of the field will rip them apart.
translation:
  language: de
  text: Ich werde sie angreifen wie eine Bärin, der man die Jungen geraubt hat, und die Umhüllung ihres Herzens aufreißen[a]. Dort werde ich sie verschlingen wie ein Löwe[b]; ein wildes Tier des Feldes wird sie auseinanderreißen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Verschluss ihres Herzens“; möglicherweise ist damit ihre Brust oder ihr Brustkorb gemeint. Die hebräische Wendung ist selten und schwer zu deuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder möglicherweise: „wie eine Löwin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְגְּשֵׁם
  choice: Ich werde sie angreifen
  rationale: פגשׁ bedeutet zunächst „begegnen/auf jemanden treffen“, hat hier im Zusammenhang der Raubtierbilder jedoch eindeutig feindliche Stoßrichtung. „angreifen“ gibt diese kontextuelle Gewalt natürlich wieder.
- source_word: כְּדֹב שַׁכּוּל
  choice: wie eine Bärin, der man die Jungen geraubt hat
  rationale: שַׁכּוּל bezeichnet den Verlust von Kindern oder Jungen. Die deutsche Formulierung bewahrt sowohl das Muttertier als auch die daraus entstehende Wildheit.
- source_word: וְאֶקְרַע
  choice: und … aufreißen
  rationale: קרע bedeutet „zerreißen, aufreißen“. „aufreißen“ passt zur folgenden körperlichen Vorstellung.
- source_word: סְגוֹר לִבָּם
  choice: die Umhüllung ihres Herzens
  rationale: סְגוֹר bezeichnet etwas Verschlossenes beziehungsweise Umschließendes. Die seltene und schwierige Wendung wird nicht vorschnell zum deutenden „Brustkorb“ vereindeutigt.
- source_word: וְאֹכְלֵם שָׁם
  choice: Dort werde ich sie verschlingen
  rationale: אכל erhält im Raubtierbild treffend die Bedeutung „verschlingen“; שָׁם wird ausdrücklich mit „dort“ wiedergegeben.
- source_word: כְּלָבִיא
  choice: wie eine Löwin
  rationale: לָבִיא kann einen kräftigen ausgewachsenen Löwen bezeichnen, ohne das Geschlecht zwingend festzulegen. „Löwin“ ist im Zusammenhang mit der zuvor genannten Bärin plausibel; die Alternative „Löwe“ bleibt in der Fußnote erhalten.
- source_word: חַיַּת הַשָּׂדֶה
  choice: ein wildes Tier des Feldes
  rationale: Die singularische Form und das singularische Verb werden bewahrt. „Tier des Feldes“ erhält zugleich die biblische Bildsprache.
- source_word: תְּבַקְּעֵם
  choice: wird sie aufspalten
  rationale: בקע bedeutet „spalten, aufbrechen“. „aufspalten“ bewahrt die konkrete, gewaltsame Bedeutung deutlicher als das allgemeinere „zerreißen“.
theological_decisions:
- issue: Göttliche Selbstbeschreibung durch Raubtierbilder
  choice: Die göttliche Ich-Rede und ihre gewaltsamen Tierbilder bleiben ungemildert erhalten.
  alternative: Die Bilder zu einer allgemeineren Aussage über Gericht abschwächen.
  rationale: Der hebräische Text stellt Gott unmittelbar als Handelnden des Bundesgerichts dar. Eine beschönigende Wiedergabe würde die theologische Spannung des Textes auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drastische Raubtiersprache und die schwierige anatomische Wendung werden bewusst bewahrt; seltene oder mehrdeutige Ausdrücke werden durch knappe Fußnoten erschlossen.
