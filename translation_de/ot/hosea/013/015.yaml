  naturalness: Modernes, würdevolles Standarddeutsch. „Auch wenn“, „gedeiht“, „Ostwind“ und „aus der Wüste heraufzieht“ sind idiomatisch und dem prophetischen Register angemessen. Die kleine Satzzeichenanpassung unterstützt die parallele Struktur.
