id: HOS.13.15
reference: Hosea 13:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י ה֔וּא בֵּ֥ן אַחִ֖ים יַפְרִ֑יא יָב֣וֹא קָדִים֩ ר֨וּחַ יְהוָ֜ה מִ/מִּדְבָּ֣ר עֹלֶ֗ה וְ/יֵב֤וֹשׁ מְקוֹר/וֹ֙ וְ/יֶחֱרַ֣ב מַעְיָנ֔/וֹ ה֣וּא יִשְׁסֶ֔ה אוֹצַ֖ר כָּל כְּלִ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/015.yaml
  text: Though he may flourish among his brothers[a], an east wind will come—the wind of Yahweh, rising from the wilderness—and his spring will dry up, and his fountain will be dried out[c][b]; it will plunder the storehouse of every precious vessel.
translation:
  language: de
  text: Auch wenn er unter seinen Brüdern gedeiht,[a] wird ein Ostwind kommen – ein Wind Jahwes,[b] der aus der Wüste heraufzieht. Seine Quelle wird versiegen, und sein Brunnen wird austrocknen. Er[c] wird den Schatz aller kostbaren Gegenstände plündern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn er ist fruchtbar unter Brüdern.“ Das Hebräische lässt eine kausale und formalere Wiedergabe zu; im Zusammenhang liegt jedoch der Sinn nahe: Trotz Ephraims Gedeihen kommt das Gericht.'
    reason: lexical_alternative
  - marker: b
    text: „Wind Jahwes“ kann auch mit „Atem Jahwes“ wiedergegeben werden. Hier sprechen „Ostwind“ und das Heraufziehen aus der Wüste für „Wind“.
    reason: alternative_reading
  - marker: c
    text: 'Das Subjekt kann der Ostwind sein oder ein durch ihn dargestellter Angreifer. Entsprechend ist auch möglich: „Dieser wird die Schatzkammer mit allen kostbaren Gegenständen plündern.“'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Auch wenn
  rationale: 'Im Zusammenhang leitet כִּי am ehesten einen konzessiven Satz ein: Trotz Ephraims Gedeihen folgt das Gericht. Die grundsätzlich mögliche kausale Wiedergabe bleibt in der Fußnote sichtbar.'
- source_word: בֵּן אַחִים
  choice: unter seinen Brüdern
  rationale: Die wörtliche Wendung „Sohn von Brüdern“ bezeichnet hier wahrscheinlich Ephraims Stellung im Kreis verwandter Stämme. Die idiomatische Wiedergabe bewahrt das Familienbild.
- source_word: יַפְרִיא
  choice: gedeiht
  rationale: Das Hifil von פרה bezeichnet Fruchtbarkeit beziehungsweise Gedeihen und spielt vermutlich zugleich auf den Namen Ephraim an.
- source_word: קָדִים
  choice: Ostwind
  rationale: Bezeichnet den heißen, zerstörerischen Wind aus der Wüste und wird durch den folgenden Ausdruck näher bestimmt.
- source_word: רוּחַ יְהוָה
  choice: ein Wind Jahwes
  rationale: רוּחַ kann Wind, Atem oder Geist bedeuten. Die Verbindung mit dem Ostwind und seinem Aufsteigen aus der Wüste spricht hier für die meteorologische Bedeutung „Wind“.
- source_word: מִמִּדְבָּר עֹלֶה
  choice: der aus der Wüste heraufzieht
  rationale: Gibt das Partizip anschaulich wieder und erhält die Herkunft des zerstörerischen Windes aus der Wüste.
- source_word: מְקוֹרוֹ ... מַעְיָנוֹ
  choice: seine Quelle ... sein Brunnen
  rationale: Die beiden parallelen Ausdrücke für Wasservorkommen werden im Deutschen unterschieden, ohne das Bild aufzulösen.
- source_word: וְיֵבֹשׁ ... וְיֶחֱרַב
  choice: wird versiegen ... austrocknen
  rationale: Die Verben beschreiben im Zusammenhang das vollständige Trockenfallen der beiden Wasservorkommen.
- source_word: יִשְׁסֶה
  choice: wird ... plündern
  rationale: Das Verb bezeichnet das gewaltsame Ausrauben oder Erbeuten. Das maskuline Subjekt kann sich unmittelbar auf den ebenfalls maskulinen Ostwind beziehen.
- source_word: אוֹצַר כָּל כְּלִי חֶמְדָּה
  choice: den Schatz all seiner kostbaren Dinge
  rationale: אוֹצָר kann Schatz, Vorrat oder Schatzkammer bedeuten; כְּלִי bezeichnet hier allgemein Gegenstände oder Dinge. Die Formulierung wahrt die kompakte Sammelbezeichnung.
theological_decisions:
- issue: Urheberschaft des zerstörerischen Windes
  choice: Der Ostwind wird als „Wind Jahwes“ bezeichnet und damit als Mittel göttlichen Gerichts dargestellt.
  alternative: „Atem Jahwes“ oder „Geist Jahwes“ als stärker personale göttliche Wirksamkeit.
  rationale: Der konkrete Ostwind, der aus der Wüste heraufzieht und Wasserquellen austrocknet, legt die Bedeutung „Wind“ nahe. So bleibt die göttliche Veranlassung gewahrt, ohne eine besondere pneumatologische Aussage einzutragen.
- issue: Bezug des plündernden Subjekts
  choice: „Er“ bezieht sich am ehesten auf den Ostwind.
  alternative: Das Subjekt könnte als ein durch den Wind versinnbildlichter Angreifer verstanden werden.
  rationale: Das hebräische Pronomen ist maskulin und kann grammatisch auf קָדִים („Ostwind“) zurückweisen. Der Wechsel von Naturbild zu historischer Invasion bleibt jedoch bewusst offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze, bildkräftige Sätze bewahren die prophetische Dynamik. „Jahwe“ gibt den Gottesnamen wieder; „gedeiht“ erhält sowohl die Vorstellung von Fruchtbarkeit als auch Wohlstand, ohne das mögliche Wortspiel mit Ephraim künstlich nachzubilden.
