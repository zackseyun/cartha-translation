  text: שִֽׁחֶתְ/ךָ֥ יִשְׂרָאֵ֖ל כִּֽי בִ֥/י בְ/עֶזְרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/009.yaml
  text: You have destroyed yourself[a], Israel, because your help is in me.
translation:
  language: de
  text: Er hat dich zugrunde gerichtet, Israel,[a] denn bei mir ist deine Hilfe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist schwierig. Möglich ist auch: »Du hast dich selbst zugrunde gerichtet, Israel, denn bei mir ist deine Hilfe.« Noch wörtlicher wird der Anfang mitunter als »Dein Verderben, Israel …« verstanden. Andere deuten den zweiten Satzteil: »weil du gegen mich, gegen deine Hilfe, bist.«'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁחֶתְךָ
  choice: Er hat dich zugrunde gerichtet
  rationale: 'Die masoretische Punktierung lässt sich am unmittelbarsten als Piel-Perfekt mit einem Objektssuffix der 2. Person Singular verstehen: »Er hat dich zugrunde gerichtet«. Da das Subjekt unausgesprochen bleibt, wird im Deutschen »Er« ergänzt. Die schwierigere reflexive und die nominale Deutung werden in der Fußnote bewahrt.'
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben und als Anrede verstanden.
- source_word: כִּי
  choice: denn
  rationale: »Denn« gibt die mögliche begründende beziehungsweise erläuternde Funktion von כִּי wieder, ohne die syntaktische Spannung durch eine stärkere Umformulierung aufzulösen.
- source_word: בִי
  choice: bei mir
  rationale: Im Zusammenhang mit »deine Hilfe« bezeichnet בִי Gott als den Ort beziehungsweise die Quelle der Hilfe. »Bei mir« klingt im Deutschen natürlicher als das wörtlichere »in mir«.
- source_word: בְעֶזְרֶךָ
  choice: deine Hilfe
  rationale: עֵזֶר bezeichnet Hilfe oder Beistand. Die nominale Form bleibt erhalten; die gedrängte hebräische Präpositionalfügung wird zu natürlichem Deutsch entfaltet.
theological_decisions:
- issue: Deutung des syntaktisch schwierigen ersten Satzteils
  choice: Er hat dich zugrunde gerichtet, Israel
  alternative: 'Du hast dich selbst zugrunde gerichtet, Israel; oder: Dein Verderben, Israel'
  rationale: Die Hauptfassung folgt möglichst eng der masoretischen Punktierung, ohne ein im Text nicht ausdrücklich vorhandenes Reflexivpronomen einzufügen. Da der hebräische Satz stark verdichtet und umstritten ist, stehen die wichtigen Alternativen in der Fußnote.
- issue: Verhältnis von Israels Untergang zu Gottes Hilfe
  choice: denn bei mir ist deine Hilfe
  alternative: weil du gegen mich, gegen deinen Helfer, bist
  rationale: Die Hauptfassung versteht בִי im gewöhnlichen lokalen beziehungsweise relationalen Sinn und bewahrt damit die Spannung zwischen Israels Untergang und Gott als Quelle seiner Hilfe. Die adversative Deutung ist möglich, aber weniger unmittelbar, und wird deshalb als Alternative genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zugrunde gerichtet« vermittelt den starken Sinn von שׁחת idiomatisch, ohne unnötig archaisch zu wirken. Die ungewöhnliche gedankliche Spannung des hebräischen Verses wird nicht geglättet, sondern durch eine knappe Hauptfassung und eine erklärende Fußnote bewahrt.
