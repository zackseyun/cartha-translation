  text: כְּ/דַבֵּ֤ר אֶפְרַ֨יִם֙ רְתֵ֔ת נָשָׂ֥א ה֖וּא בְּ/יִשְׂרָאֵ֑ל וַ/יֶּאְשַׁ֥ם בַּ/בַּ֖עַל וַ/יָּמֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/001.yaml
  text: When Ephraim spoke[a], there was trembling; he was exalted in Israel[b]. But he became guilty through Baal and died.
translation:
  language: de
  text: Wenn Ephraim sprach, zitterte man; er erhob sich in Israel.[a] Doch er machte sich durch Baal[b] schuldig und starb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „er war in Israel hoch erhoben“ oder „er gewann in Israel hohes Ansehen“. Die hebräische Wendung ist sehr knapp und kann Ephraims erhöhte Stellung unterschiedlich beschreiben.'
    reason: alternative_reading
  - marker: b
    text: „Durch Baal“ kann auch im Sinn von „durch die Verehrung Baals“ oder „in Verbindung mit Baal“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר
  choice: Wenn … sprach
  rationale: Die Präposition כ mit dem Infinitivus constructus von דבר hat hier zeitliche Bedeutung. Die Wiedergabe ist im Deutschen natürlich und bewahrt den temporalen Zusammenhang.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der Eigenname bleibt erhalten. Im Kontext Hoseas kann Ephraim stellvertretend für das Nordreich stehen, doch diese Deutung wird nicht in den Haupttext eingetragen.
- source_word: רְתֵת
  choice: herrschte Zittern
  rationale: Das Substantiv bezeichnet Zittern oder Beben. Da der hebräische Satz kein ausdrückliches Verb und keine ausdrücklich genannte zitternde Personengruppe enthält, gibt die unpersönliche Formulierung die knappe Aussage wieder, ohne Angst, Ehrfurcht oder politische Furcht festzulegen.
- source_word: נָשָׂא הוּא בְּיִשְׂרָאֵל
  choice: er war hoch erhoben in Israel
  rationale: Die knappe hebräische Wendung beschreibt Ephraims erhöhte Stellung, lässt aber ihre genaue syntaktische Ausgestaltung offen. „Hoch erhoben“ bewahrt das Bild des Erhebens und vermeidet die stärkere Festlegung von „er erhob sich selbst“.
- source_word: וַיֶּאְשַׁם
  choice: wurde er schuldig
  rationale: אשם bezeichnet das Schuldigwerden beziehungsweise das Auf-sich-Laden von Schuld. Die Formulierung bewahrt den moralischen und bundesbezogenen Ernst.
- source_word: בַּבַּעַל
  choice: durch den Baal
  rationale: ב kann hier instrumental oder als Bezeichnung der Verbindung mit Baal verstanden werden. Der bestimmte Artikel des Hebräischen wird mit „dem Baal“ wiedergegeben; eine Ergänzung wie „Baalverehrung“ bleibt der Fußnote vorbehalten.
- source_word: וַיָּמֹת
  choice: und starb
  rationale: Die schlichte und scharfe Folgeaussage bleibt erhalten. Ob der Tod hier individuell, geistlich oder korporativ-politisch zu verstehen ist, entscheidet die Übersetzung nicht.
theological_decisions:
- issue: Art von Ephraims Erhöhung
  choice: „er war hoch erhoben in Israel“
  alternative: „er erhob sich in Israel“ oder „er gewann in Israel hohes Ansehen“
  rationale: Der hebräische Satz ist ungewöhnlich knapp. Der Haupttext beschreibt Ephraims herausgehobene Stellung, ohne eindeutig zu entscheiden, ob sie ihm verliehen wurde oder ob er sich selbst erhob.
- issue: Bedeutung von Ephraims Tod
  choice: „und starb“ ohne erklärende Erweiterung
  alternative: Deutung als korporativ-politischer, geistlicher oder unmittelbar leiblicher Tod
  rationale: Die prophetische Gerichtsaussage wird wörtlich bewahrt; ihre genaue Bezugsebene soll aus dem Kontext erschlossen und nicht konfessionell vorentschieden werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Bewegung von Ansehen über Schuld zum Tod bleibt erhalten. „Doch“ markiert den scharfen Gegensatz, ohne zusätzliche Deutung einzuführen.
