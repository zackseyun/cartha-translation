  text: Ephraim’s iniquity is bound up[a]; his sin is stored up.
translation:
  language: de
  text: Ephraims Schuld ist gebunden; seine Sünde ist aufbewahrt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verborgen“. Das hebräische Wort kann sowohl „verborgen“ als auch „aufbewahrt“ bedeuten; hier ist wahrscheinlich gemeint, dass Ephraims Sünde für eine spätere Abrechnung aufbewahrt bleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוּר
  choice: ist verschnürt
  rationale: Das passive Partizip von צרר bezeichnet etwas Zusammengebundenes oder Verschnürtes. „Verschnürt“ bewahrt das konkrete Bild davon, dass Ephraims Schuld gesichert und nicht beseitigt ist.
- source_word: עֲוֺן
  choice: Schuld
  rationale: עָוֹן kann Vergehen, Schuld oder die daraus folgende Strafe bezeichnen. Im Parallelismus mit „Sünde“ verbindet „Schuld“ die moralische Verfehlung mit ihrer fortbestehenden Belastung, ohne bereits „Strafe“ auszudrücken.
- source_word: אֶפְרָיִם
  choice: Ephraims
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben; die Zuordnung wird natürlich durch den Genitiv ausgedrückt.
- source_word: צְפוּנָה
  choice: ist verwahrt
  rationale: Das passive Partizip von צפן kann „verborgen“ oder „aufbewahrt“ bedeuten. „Verwahrt“ erhält diese Mehrdeutigkeit teilweise und deutet im Gerichtszusammenhang an, dass die Sünde für eine spätere Abrechnung aufbehalten bleibt.
- source_word: חַטָּאתוֹ
  choice: seine Sünde
  rationale: חַטָּאת bezeichnet hier die Sünde, nicht ein Sündopfer. Das Suffix der dritten Person Singular wird als „seine“ wiedergegeben und bezieht sich auf Ephraim als kollektive Einzelgestalt.
theological_decisions:
- issue: Bildhafte Aussage über Ephraims Schuld
  choice: Die Schuld wird als verschnürt und die Sünde als verwahrt dargestellt, also als nicht beseitigt und für eine künftige Abrechnung aufbehalten.
  alternative: צְפוּנָה könnte schwächer lediglich bedeuten, dass die Sünde verborgen ist.
  rationale: Die parallelen passiven Partizipien und der Gerichtskontext sprechen dafür, dass die Schuld sicher aufbewahrt bleibt. Der Haupttext bewahrt jedoch die prophetischen Bilder und benennt weder Zeitpunkt noch genaue Form des Gerichts.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; „verschnürt“ und „verwahrt“ bewahren die beiden verwandten, aber nicht identischen Bilder.
