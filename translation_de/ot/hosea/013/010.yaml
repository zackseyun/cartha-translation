  text: אֱהִ֤י מַלְכְּ/ךָ֙ אֵפ֔וֹא וְ/יוֹשִֽׁיעֲ/ךָ֖ בְּ/כָל עָרֶ֑י/ךָ וְ/שֹׁ֣פְטֶ֔י/ךָ אֲשֶׁ֣ר אָמַ֔רְתָּ תְּנָ/ה לִּ֖/י מֶ֥לֶךְ וְ/שָׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/010.yaml
  text: Where now is your king[a], that he may save you in all your cities, and your judges, of whom you said[b], “Give me a king and princes”?
translation:
  language: de
  text: 'Wo ist nun dein König[a], dass er dich in all deinen Städten rettet? Und wo sind deine Richter, von denen du gesagt hast: »Gib mir einen König und Fürsten[b]«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, weniger wahrscheinlich: »Ich wäre dein König; wo wäre dann jemand, der dich in all deinen Städten retten könnte …?« Der hebräische Versanfang ist schwer zu deuten.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Amtsträger« oder »Herrscher«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱהִי ... אֵפוֹא
  choice: Wo ist nun
  rationale: Der schwierige Versanfang wird im Zusammenhang als spöttisch-rhetorische Frage verstanden. אֵפוֹא verstärkt sie mit dem zeitlich-rhetorischen »nun«.
- source_word: מַלְכְּךָ
  choice: dein König
  rationale: Die singularische Besitzverbindung wird direkt wiedergegeben und greift Israels Forderung nach einem Königtum auf.
- source_word: וְיוֹשִׁיעֲךָ
  choice: dass er dich ... rettet
  rationale: Der Hifil von ישׁע bedeutet »retten/befreien«. Der deutsche Zwecksatz gibt die herausfordernde rhetorische Funktion natürlich wieder.
- source_word: בְּכָל עָרֶיךָ
  choice: in all deinen Städten
  rationale: Die Präposition wird örtlich verstanden; die umfassende Aussage von כָּל bleibt erhalten.
- source_word: וְשֹׁפְטֶיךָ
  choice: Und wo sind deine Richter
  rationale: »Richter« wahrt die lexikalische Grundbedeutung. Das wiederholte »wo sind« macht die elliptische Parallelfrage im Deutschen klar.
- source_word: אֲשֶׁר אָמַרְתָּ
  choice: von denen du gesagt hast
  rationale: Die Relativkonstruktion verweist auf die zuvor genannten politischen Amtsträger zurück.
- source_word: תְּנָה לִּי
  choice: Gib mir
  rationale: Der Imperativ von נתן mit לִי wird unmittelbar und idiomatisch übersetzt.
- source_word: מֶלֶךְ וְשָׂרִים
  choice: einen König und führende Männer
  rationale: מֶלֶךְ heißt »König«; שָׂרִים bezeichnet ranghohe politische oder militärische Führungspersonen. »Führende Männer« ist im heutigen Deutsch verständlicher als »Fürsten«, ohne die Bedeutung auf moderne Beamte zu verengen.
theological_decisions:
- issue: Deutung des schwierigen Versanfangs אֱהִי
  choice: 'Rhetorische Frage: »Wo ist nun dein König?«'
  alternative: »Ich wäre dein König; wo ist dann jemand, der dich retten könnte …?«
  rationale: Der Zusammenhang stellt Israels Vertrauen auf menschliche Könige bloß und spricht vom Geben und Wegnehmen des Königs. Die Frageform erhält diese Ironie, während die abweichende mögliche Analyse in einer Fußnote offengelegt wird.
- issue: Bezug der Rettungsaussage
  choice: Der menschliche König wird ironisch als möglicher Retter angesprochen.
  alternative: Gott erklärt sich selbst zum König und Retter.
  rationale: Die gewählte Syntax folgt der kontextuell wahrscheinlicheren Frageanalyse, ohne die alternative Aussage über Gottes Königtum stillschweigend auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Zuspitzung wird durch zwei parallele Wo-Fragen hörbar gemacht. »Führende Männer« vermeidet den heute leicht erblich-adligen Beiklang von »Fürsten«; die wörtlichere Möglichkeit steht in der Fußnote.
