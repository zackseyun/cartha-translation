  text: מִ/יַּ֤ד שְׁאוֹל֙ אֶפְדֵּ֔/ם מִ/מָּ֖וֶת אֶגְאָלֵ֑/ם אֱהִ֨י דְבָרֶי/ךָ֜ מָ֗וֶת אֱהִ֤י קָֽטָבְ/ךָ֙ שְׁא֔וֹל נֹ֖חַם יִסָּתֵ֥ר מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/014.yaml
  text: From the hand of Sheol I will ransom them[a]; from death I will redeem them. O Death, where are your plagues? O Sheol[c][b], where is your destruction? Compassion will be hidden from my eyes.
translation:
  language: de
  text: Aus der Hand des Totenreichs werde ich sie loskaufen[a], vom Tod werde ich sie erlösen. Wo sind deine Seuchen, Tod? Wo ist dein Verderben, Totenreich[b][c]? Mitleid wird meinen Augen verborgen bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als rhetorische Fragen des Gerichts: „Sollte ich sie aus der Hand des Totenreichs loskaufen? Sollte ich sie vom Tod erlösen?“'
    reason: alternative_reading
  - marker: b
    text: 'Das hebräische אֱהִי kann auch als „ich werde sein“ oder „ich will sein“ verstanden werden: „Ich werde deine Seuchen sein, Tod; ich werde dein Verderben sein, Totenreich.“'
    reason: alternative_reading
  - marker: c
    text: 'Die traditionelle Wiedergabe unter dem Einfluss der griechischen Überlieferung lautet: „Wo, Tod, ist dein Stachel? Wo, Totenreich, ist dein Sieg/Stachel?“ Vergleiche 1. Korinther 15,55.'
    reason: cross_reference
lexical_decisions:
- source_word: מִיַּד שְׁאוֹל
  choice: aus der Hand des Totenreichs
  rationale: Die konkrete hebräische Metapher „aus der Hand“ bleibt erhalten; שְׁאוֹל bezeichnet umfassender das Reich der Toten und nicht nur ein einzelnes Grab.
- source_word: אֶפְדֵּם
  choice: werde ich sie loskaufen
  rationale: פדה bezeichnet das Freikaufen aus einer Macht oder Gefahr. „Loskaufen“ wahrt zugleich den Unterschied zum folgenden גאל.
- source_word: מִמָּוֶת
  choice: vom Tod
  rationale: Die knappe und natürliche Wiedergabe erhält den Parallelismus zum Totenreich.
- source_word: אֶגְאָלֵם
  choice: werde ich sie erlösen
  rationale: גאל wird mit „erlösen“ wiedergegeben; mögliche verwandtschaftliche und bundesbezogene Anklänge bleiben offen, ohne sie erklärend in den Text einzutragen.
- source_word: אֱהִי
  choice: wo sind
  rationale: Die Form ist umstritten. Als Fragewort ergibt sie eine spöttische Anrede an Tod und Totenreich; die mögliche futurische oder voluntative Deutung wird in einer Fußnote bewahrt.
- source_word: דְבָרֶיךָ
  choice: deine Seuchen
  rationale: Im Zusammenhang bezeichnet das Wort am ehesten todbringende Plagen oder Seuchen, nicht gewöhnliche „Worte“.
- source_word: קָטָבְךָ
  choice: dein Verderben
  rationale: קטב bezeichnet vernichtendes Unheil beziehungsweise Zerstörung. „Verderben“ ist poetisch, verständlich und lässt die Wirkungsrichtung der Genitivverbindung ebenso offen wie das Hebräische.
- source_word: נֹחַם
  choice: Mitleid
  rationale: נֹחַם kann Mitleid, Reue oder ein Einlenken bezeichnen. „Mitleid“ passt zur Rede von etwas, das Gottes Blick entzogen bleibt, ohne die semantische Spannung völlig aufzulösen.
- source_word: יִסָּתֵר מֵעֵינָי
  choice: wird vor meinen Augen verborgen sein
  rationale: Die passive Zukunftsform und das hebräische Bild werden möglichst direkt bewahrt.
theological_decisions:
- issue: Sind die ersten beiden Versglieder Heilszusagen oder rhetorische Fragen des Gerichts?
  choice: 'Aussagen der Befreiung: „werde ich sie loskaufen … werde ich sie erlösen“'
  alternative: 'Rhetorische Fragen, die eine Rettung verweigern: „Sollte ich sie … loskaufen? Sollte ich sie … erlösen?“'
  rationale: Die unmarkierten Imperfektformen lassen sich natürlich als Aussagen lesen, doch Kontext und Satzfolge ermöglichen auch rhetorische Fragen. Da das Hebräische keine eindeutigen Fragepartikeln bietet, wird die Gegenlesart ausdrücklich in Fußnote [a] erhalten.
- issue: Funktion von אֱהִי in der Anrede an Tod und Totenreich
  choice: 'interrogativ: „Wo sind …?“'
  alternative: 'futurisch oder voluntativ: „Ich werde … sein“ beziehungsweise „Ich will … sein“'
  rationale: Die interrogative Lesart ergibt einen Triumph- oder Spottvers über Tod und Totenreich und steht in der Wirkungsgeschichte des Verses. Die hebräische Form kann jedoch anders analysiert werden; diese gerichtliche Alternative bleibt in Fußnote [b] sichtbar.
- issue: Verhältnis zur Wiedergabe in 1. Korinther 15,55
  choice: Der hebräische Wortlaut wird im Haupttext unabhängig und direkt übersetzt.
  alternative: Die traditionelle, von der griechischen Überlieferung und dem Pauluswort geprägte Fassung mit „Stachel“ und „Sieg“ wird in den Haupttext übernommen.
  rationale: Die neutestamentliche Rezeption ist theologisch bedeutsam, soll aber die lexikalischen Werte des masoretischen Textes nicht verdecken. Sie wird deshalb in Fußnote [c] genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Parallelismus. „Totenreich“ ist für gewöhnliche Leser verständlicher als die Transliteration „Scheol“ und reicht semantisch weiter als „Grab“. Die Satzstellung bleibt bewusst nah an der hebräischen Dichtung; alle wesentlichen textlichen und theologischen Mehrdeutigkeiten werden in den Fußnoten offengehalten.
