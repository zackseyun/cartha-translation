source:
  edition: WLC
  text: וְ/עַתָּ֣ה יוֹסִ֣פוּ לַ/חֲטֹ֗א וַ/יַּעְשׂ֣וּ לָ/הֶם֩ מַסֵּכָ֨ה מִ/כַּסְפָּ֤/ם כִּ/תְבוּנָ/ם֙ עֲצַבִּ֔ים מַעֲשֵׂ֥ה חָרָשִׁ֖ים כֻּלֹּ֑/ה לָ/הֶם֙ הֵ֣ם אֹמְרִ֔ים זֹבְחֵ֣י אָדָ֔ם עֲגָלִ֖ים יִשָּׁקֽוּ/ן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/002.yaml
  text: 'And now they keep on sinning: they make cast images for themselves from their silver, idols made according to their own skill—all of it the work of craftsmen. Of them they say[a], “Those who sacrifice human beings kiss calves[b][c].”'
translation:
  language: de
  text: 'Und nun sündigen sie immer weiter: Aus ihrem Silber machen sie sich Gussbilder, Götzen nach ihrem eigenen Können – das alles ist das Werk von Kunsthandwerkern. Von ihnen sagt man[a]: »Wer Menschen opfert, küsst Kälber[b][c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Zu ihnen sagen sie«. Wie »zu ihnen« mit den folgenden Worten zusammenhängt, ist im Hebräischen syntaktisch schwer zu bestimmen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Wer opfert, soll Kälber küssen.« Bei dieser Deutung wird »Mensch« allgemein verstanden und das letzte Verb auffordernd aufgefasst; die masoretische Form ist jedoch natürlicher als Aussage zu lesen: »küsst«.'
    reason: alternative_reading
  - marker: c
    text: Gemeint sind Kälberbilder, die als Götzen verehrt wurden.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl den zeitlichen als auch den fortführenden Charakter der hebräischen Wendung.
- source_word: יוֹסִפוּ לַחֲטֹא
  choice: sündigen sie immer weiter
  rationale: Die Konstruktion bezeichnet fortgesetztes beziehungsweise wiederholtes Sündigen; die Formulierung ist gegenwärtig und eindringlich.
- source_word: וַיַּעְשׂוּ לָהֶם מַסֵּכָה
  choice: machen sie sich Gussbilder
  rationale: Der Singular מַסֵּכָה kann hier kollektiv verstanden werden; der Plural passt zu den folgenden עֲצַבִּים und ergibt natürliches Deutsch.
- source_word: מִכַּסְפָּם
  choice: Aus ihrem Silber
  rationale: 'מִן bezeichnet den Stoff beziehungsweise Ursprung: Die Bilder werden aus ihrem eigenen Silber gefertigt.'
- source_word: כִּתְבוּנָם
  choice: nach ihrem eigenen Können
  rationale: Im unmittelbaren Zusammenhang der Herstellung und des Handwerkerwerks bezeichnet תְּבוּנָה hier am ehesten menschliches Können oder Geschick; »eigenen« erhält den polemischen Unterton.
- source_word: עֲצַבִּים
  choice: Götzen
  rationale: Bezeichnet die hergestellten Kultbilder und wird im modernen Deutschen klar und würdig wiedergegeben.
- source_word: מַעֲשֵׂה חָרָשִׁים כֻּלֹּה
  choice: das alles ist das Werk von Kunsthandwerkern
  rationale: Hebt hervor, dass sämtliche Götzen bloß menschliche Erzeugnisse sind; »Kunsthandwerker« erfasst die fachkundige Herstellung.
- source_word: לָהֶם הֵם אֹמְרִים
  choice: Von ihnen sagt man
  rationale: Stellt die Aussage verständlich auf die Götzen beziehungsweise ihren Kultzusammenhang ein, ohne die schwierige wörtliche Syntax im Haupttext nachzuahmen; diese wird in der Fußnote dokumentiert.
- source_word: זֹבְחֵי אָדָם
  choice: Wer Menschen opfert
  rationale: 'Nimmt אָדָם als kollektives Objekt des Partizips: Menschen werden geopfert. Die Formulierung vermeidet eine Beschränkung auf männliche Opfer.'
- source_word: עֲגָלִים יִשָּׁקוּן
  choice: küsst Kälber
  rationale: Die masoretische Verbform ist am natürlichsten indikativisch; »Kälber« bewahrt Hoseas zugespitztes Bild.
theological_decisions:
- issue: Deutung von זֹבְחֵי אָדָם עֲגָלִים יִשָּׁקוּן
  choice: »Wer Menschen opfert, küsst Kälber.«
  alternative: »Wer opfert, soll Kälber küssen.«
  rationale: Die knappe hebräische Wortfolge ist syntaktisch mehrdeutig. Der Haupttext folgt der naheliegenden masoretischen Lesart, nach der אָדָם Objekt von »opfern« und das Schlussverb indikativisch ist. Die plausible generische beziehungsweise auffordernde Deutung wird ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Schärfe. Der Doppelpunkt und der Gedankenstrich gliedern die dichte hebräische Aussage, ohne ihren polemischen Nachdruck abzuschwächen. Echte syntaktische Mehrdeutigkeit wird nicht im Haupttext geglättet und verschwiegen, sondern durch Fußnoten offengelegt.
