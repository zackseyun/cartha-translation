source:
  edition: WLC
  text: כִּֽי הֵ֨מָּה֙ עָל֣וּ אַשּׁ֔וּר פֶּ֖רֶא בּוֹדֵ֣ד ל֑/וֹ אֶפְרַ֖יִם הִתְנ֥וּ אֲהָבִֽים־
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/009.yaml
  text: For they have gone up to Assyria[a], like a wild donkey wandering alone[b]; Ephraim has hired lovers.
translation:
  language: de
  text: Denn sie sind nach Assyrien hinaufgezogen, wie ein Wildesel, der ganz für sich allein ist.[a] Ephraim hat sich Liebhaber erkauft.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »ein Wildesel, der für sich allein ist«. Im Hebräischen steht kein ausdrückliches Wort für »wie«; die knappe Formulierung kann auch als selbstständige Bildzeile verstanden werden.'
    reason: textual_ambiguity
  - marker: b
    text: Mit den »Liebhabern« sind im politischen Zusammenhang ausländische Bündnispartner gemeint. Das Wort bewahrt Hoseas Bild für Israels Untreue gegenüber Gott.
    reason: metaphor_clarification
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung beziehungsweise Erläuterung zum vorausgehenden Vorwurf ein und wahrt den Zusammenhang in natürlichem Deutsch.
- source_word: הֵמָּה
  choice: sie
  rationale: Gibt das ausdrücklich gesetzte Personalpronomen wieder; eine zusätzliche Verstärkung durch »sie selbst« wäre im Deutschen hier unnötig.
- source_word: עָלוּ אַשּׁוּר
  choice: sind nach Assyrien hinaufgezogen
  rationale: Bewahrt die konkrete Bewegungsrichtung des Verbs עלה und verwendet für den Ländernamen die übliche deutsche Form.
- source_word: פֶּרֶא
  choice: Wildesel
  rationale: Bezeichnet den ungezähmten Esel; »Wildesel« ist die klare und gegenwärtige deutsche Tierbezeichnung.
- source_word: בּוֹדֵד לוֹ
  choice: der allein umherstreift
  rationale: Gibt die betonte Abgesondertheit idiomatisch wieder. »Umherstreift« entfaltet das Tierbild natürlich, ohne seine wesentliche Aussage – das Alleinsein – zu verändern.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Verwendet die im Deutschen etablierte Form des Stammes- und Volksnamens.
- source_word: הִתְנוּ אֲהָבִים
  choice: hat sich Liebhaber erkauft
  rationale: Das Verb bezeichnet das Gewinnen gegen Bezahlung; »erkauft« erhält diesen Aspekt, während »Liebhaber« die ehelich-sexuelle Metaphorik Hoseas bewahrt. Der grammatische Plural beim kollektiven Ephraim wird im Deutschen sinngemäß als Singular wiedergegeben.
theological_decisions:
- issue: Bildhafte Beschreibung ausländischer Bündnisse
  choice: Die ehelich-sexuelle Metapher wird mit »hat sich Liebhaber erkauft« ausdrücklich beibehalten.
  alternative: Ephraim hat Verbündete angeworben.
  rationale: Hosea schildert Israels Bundesuntreue wiederholt mit Bildern von Ehebruch und käuflicher Liebe. Eine direkte Wiedergabe als »Verbündete« würde den politischen Bezug erklären, aber die prophetische und theologische Spannung einebnen.
- issue: Bezug des Wildeselbildes
  choice: Das Bild wird durch »wie« auf das Hinaufziehen nach Assyrien bezogen.
  alternative: Denn sie sind nach Assyrien hinaufgezogen – ein Wildesel, der für sich allein bleibt; Ephraim hat sich Liebhaber erkauft.
  rationale: Der knappe hebräische Nominalsatz enthält kein ausdrückliches Vergleichswort und lässt sowohl einen Vergleich als auch eine appositionelle beziehungsweise selbstständige Bildzeile zu. Die Hauptfassung macht den wahrscheinlich gemeinten Vergleich in verständlichem Deutsch sichtbar; die Fußnote bewahrt die syntaktische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt knapp und prophetisch; »hinaufgezogen«, »Wildesel« und »Liebhaber erkauft« erhalten die konkreten Bilder des Hebräischen, während die Fußnoten die syntaktische Mehrdeutigkeit und den politischen Bezug erläutern.
