  text: הֵ֤ם הִמְלִיכוּ֙ וְ/לֹ֣א מִמֶּ֔/נִּי הֵשִׂ֖ירוּ וְ/לֹ֣א יָדָ֑עְתִּי כַּסְפָּ֣/ם וּ/זְהָבָ֗/ם עָשׂ֤וּ לָ/הֶם֙ עֲצַבִּ֔ים לְמַ֖עַן יִכָּרֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/004.yaml
  text: They made kings, but not from me; they appointed princes, but I did not know it. With their silver and their gold they made idols for themselves, so that they might be cut off.
translation:
  language: de
  text: Sie setzten Könige ein, aber nicht von mir; sie bestimmten Fürsten, doch ich wusste nichts davon.[a] Aus ihrem Silber und ihrem Gold machten sie sich Götzen, damit es vernichtet werde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doch ich erkannte es nicht an“; gemeint ist, dass diese Einsetzungen nicht Gottes Zustimmung hatten.'
    reason: Die hebräische Wendung „ich wusste nicht“ kann hier relational bzw. im Sinn von Anerkennung und Billigung verstanden werden.
  - marker: b
    text: 'Oder: „damit es abgeschnitten werde“. Das hebräische Verb steht in der Einzahl; worauf es sich genau bezieht, bleibt offen.'
    reason: Bewahrt die grammatische und referenzielle Mehrdeutigkeit des Schlusssatzes.
lexical_decisions:
- source_word: הִמְלִיכוּ
  choice: setzten Könige ein
  rationale: Das Hifil von מלך bedeutet hier, jemanden zum König zu machen bzw. als König einzusetzen.
- source_word: וְלֹא מִמֶּנִּי
  choice: aber nicht von mir
  rationale: Die knappe Ausgangsformulierung bleibt erhalten und kann sowohl fehlenden göttlichen Ursprung als auch fehlende göttliche Beauftragung ausdrücken.
- source_word: הֵשִׂירוּ
  choice: sie bestimmten Fürsten
  rationale: Das Verb bezeichnet hier die Einsetzung von Amtsträgern bzw. Fürsten; „bestimmten“ ist natürliches modernes Deutsch.
- source_word: וְלֹא יָדָעְתִּי
  choice: doch ich wusste nichts davon
  rationale: Gibt die idiomatische Bedeutung im Zusammenhang wieder, ohne Gottes Allwissenheit durch eine unnötig wörtliche Lesart zum eigentlichen Thema zu machen.
- source_word: עֲצַבִּים
  choice: Götzen
  rationale: Im prophetischen Kontext bezeichnet das Wort hergestellte Kultbilder bzw. Götzen.
- source_word: יִכָּרֵת
  choice: es vernichtet werde
  rationale: Das maskuline Singularverb lässt als nächsten grammatischen Bezug besonders das Silber und Gold bzw. das daraus gefertigte Götzenmaterial zu; die unpersönliche deutsche Form bewahrt diese Offenheit.
theological_decisions:
- issue: Gottes Nichtwissen bei der Einsetzung der Fürsten
  choice: „ich wusste nichts davon“ mit Fußnote zur Bedeutung fehlender Anerkennung
  alternative: „ich erkannte sie nicht an“
  rationale: Der Haupttext wahrt die hebräische Redeweise, während die Fußnote verdeutlicht, dass sie im Kontext fehlende Billigung oder Anerkennung ausdrücken kann.
- issue: Subjekt dessen, was vernichtet wird
  choice: neutrales „es“
  alternative: „damit sie vernichtet würden“
  rationale: Das hebräische Verb steht im maskulinen Singular und bezieht sich nicht eindeutig auf das pluralische Volk; eine personenbezogene Pluralübersetzung würde die grammatische Spannung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelstruktur der beiden eigenmächtigen politischen Einsetzungen bleibt erhalten; der Schlusssatz wird bewusst nicht auf eine Vernichtung des Volkes festgelegt.
