base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/014.yaml
  text: For Israel has forgotten his Maker and built palaces[a], and Judah has multiplied fortified cities; so I will send fire into his cities, and it will consume her citadels.
translation:
  language: de
  text: Denn Israel hat seinen Schöpfer vergessen und Paläste gebaut[a]; Juda hat zahlreiche befestigte Städte errichtet. Darum werde ich Feuer in seine Städte schicken, und es wird ihre Paläste[b] verzehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Tempel«. Das hebräische Wort kann Paläste oder Tempelbauten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Suffix ist feminin. Es kann sich auf Juda oder auf die Städte beziehen.
    reason: ambiguous_referent
lexical_decisions:
- source_word: עֹשֵׂהוּ
  choice: seinen Schöpfer
  rationale: Das substantivierte Partizip von עשה mit Suffix bezeichnet den, der Israel gemacht hat. »Schöpfer« ist im Deutschen prägnant, natürlich und bewahrt die theologische und bundesbezogene Aussage.
- source_word: הֵיכָלוֹת
  choice: Paläste
  rationale: היכל kann einen Palast oder einen Tempel bezeichnen. Im Zusammenhang mit Judas befestigten Städten und den nachfolgenden Zitadellen passt »Paläste« gut zur Kritik an politischer und militärischer Selbstsicherung; die kultische Möglichkeit bleibt in der Fußnote erhalten.
- source_word: הִרְבָּה
  choice: hat immer mehr … errichtet
  rationale: Der Hifil von רבה bezeichnet hier eine zahlenmäßige Vermehrung. Die Formulierung gibt die fortgesetzte Ausweitung der Befestigungen in natürlichem Deutsch wieder.
- source_word: עָרִים בְּצֻרוֹת
  choice: befestigte Städte
  rationale: Dies ist die klare und übliche deutsche Wiedergabe der Verbindung und bezeichnet militärisch gesicherte Städte.
- source_word: וְשִׁלַּחְתִּי אֵשׁ
  choice: Darum werde ich Feuer … senden
  rationale: Das einleitende ו verbindet die menschliche Selbstsicherung mit dem angekündigten Gericht. »Darum« macht diesen Folgezusammenhang verständlich, ohne den Inhalt auszubauen.
- source_word: בְּעָרָיו
  choice: in seine Städte
  rationale: Bei gesandtem Feuer gibt ב idiomatisch das Eindringen in den betroffenen Bereich an. Das maskuline Suffix bezieht sich am ehesten auf das unmittelbar zuvor genannte Juda.
- source_word: אַרְמְנֹתֶיהָ
  choice: deren Zitadellen
  rationale: ארמון kann Palast oder befestigter Herrschaftssitz bedeuten. Im militärischen Kontext gibt »Zitadellen« den Aspekt befestigter, hervorgehobener Anlagen wieder; »deren« bindet das feminine Suffix transparent an die Städte zurück.
theological_decisions:
- issue: Wechsel der Bezugswörter in den Suffixen zwischen Israel, Juda und den Städten
  choice: »seine Städte« bezieht sich auf Juda; »deren Zitadellen« auf die Städte.
  alternative: Der Schlusssatz könnte insgesamt wieder auf Israel bezogen oder der Suffixwechsel in der Übersetzung geglättet werden.
  rationale: Juda ist das nächste maskuline Bezugswort für »seine Städte«. Das feminine Suffix bei »Zitadellen« lässt sich auf die Städte als Bezugsgröße beziehen. Die Wiedergabe bewahrt den auffälligen Wechsel des Hebräischen, statt ihn stillschweigend einzuebnen.
- issue: Bedeutung von הֵיכָלוֹת
  choice: Im Haupttext steht »Paläste«; »Tempel« wird als mögliche Lesart in der Fußnote genannt.
  alternative: Tempel
  rationale: Das hebräische Wort umfasst sowohl königliche als auch kultische Prachtbauten. Der Kontext menschlicher politischer und militärischer Absicherung spricht eher für »Paläste«, doch die kultische Deutung bleibt sachlich möglich und wird deshalb ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und prophetisch; »Darum« verdeutlicht den Zusammenhang von Selbstsicherung und Gericht. Der ungewöhnliche Wechsel der Bezüge im letzten Satz wird durch »seine« und »deren« sichtbar gehalten.
