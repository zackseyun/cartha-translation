  text: Because Ephraim has multiplied altars for sinning[a], they have become altars for sinning to him.
translation:
  language: de
  text: Denn Ephraim hat Altäre zum Sündigen vermehrt[a]; sie sind ihm zu Altären zum Sündigen geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bei abweichender Vokalisierung, an beiden Stellen: „für Sündopfer“. Die überlieferte Vokalisierung bedeutet „zum Sündigen“; im Zusammenhang werden die Altäre als Anlässe zum Sündigen angeklagt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für das angekündigte Gericht ein und entspricht einem würdevollen, natürlichen deutschen Satzanschluss.
- source_word: הִרְבָּה
  choice: hat viele … errichtet
  rationale: Der Hifil von רבה bezeichnet eine Vermehrung. In Verbindung mit Altären gibt diese idiomatische Formulierung den Vorgang im Deutschen natürlicher wieder als „hat Altäre vermehrt“.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der Eigenname bleibt erhalten; obwohl er bei Hosea häufig für das Nordreich steht, wird die im Text vorhandene Bezeichnung nicht erläuternd ersetzt.
- source_word: מִזְבְּחֹת
  choice: Altäre
  rationale: Standardentsprechung für מזבח; der Plural bewahrt den Vorwurf der Vielzahl von Kultstätten.
- source_word: לַחֲטֹא
  choice: um zu sündigen / zum Sündigen
  rationale: Der Infinitiv von חטא wird im Kontext primär verbal verstanden. Die zwei idiomatisch unterschiedlichen deutschen Wendungen bewahren denselben Sinn sowie die Wiederholung des hebräischen Ausdrucks.
- source_word: הָיוּ לוֹ
  choice: sind sie ihm geworden
  rationale: „Geworden“ bringt den resultativen Sinn zum Ausdruck; „ihm“ bewahrt das Dativpronomen לוֹ und die pointierte Aussage darüber, was die Altäre für Ephraim geworden sind.
theological_decisions:
- issue: Bedeutung von לַחֲטֹא an beiden Stellen
  choice: 'verbal: „um zu sündigen“ / „zum Sündigen“'
  alternative: 'kultisch: „für Sündopfer“'
  rationale: חטא kann kultisch mit dem Sündopfer zusammenhängen, doch der unmittelbare polemische Kontext spricht eher von Altären als Anlässen oder Mitteln zur Sünde. Die Fußnote hält die echte lexikalische Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Altäre“ und der Wurzel „sündigen“ bewahrt die anklagende Ironie des Hebräischen; die leicht markierte Wortfolge „sind sie ihm geworden“ hält zugleich den Dativ und den prophetischen Ton fest.
