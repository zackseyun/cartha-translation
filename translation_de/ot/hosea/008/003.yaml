  text: זָנַ֥ח יִשְׂרָאֵ֖ל ט֑וֹב אוֹיֵ֖ב יִרְדְּֽפ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/003.yaml
  text: Israel has rejected the good[a]; an enemy will pursue him.
translation:
  language: de
  text: Israel hat das Gute[a] verworfen; ein Feind wird Israel verfolgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Israel hat verworfen, was gut ist.«'
    reason: Lexikalisch-syntaktische Alternative für das substantivisch gebrauchte טוֹב.
lexical_decisions:
- source_word: זָנַח
  choice: hat verworfen
  rationale: Das Verb bezeichnet ein entschiedenes Zurückweisen oder Verstoßen. »Hat verworfen« ist im Deutschen klar, würdevoll und bewahrt die Kraft der bewussten Abkehr.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier das als Einheit angesprochene Volk.
- source_word: טוֹב
  choice: das Gute
  rationale: Das Adjektiv wird substantivisch gebraucht. »Das Gute« gibt die knappe und allgemein gehaltene hebräische Form unmittelbar wieder, ohne sie auf ein bestimmtes Gut einzuengen.
- source_word: אוֹיֵב
  choice: ein Feind
  rationale: Das artikellose Singularwort ist allgemein gehalten. »Ein Feind« vermeidet eine unbegründete Festlegung auf einen bereits bestimmten Gegner.
- source_word: יִרְדְּפוֹ
  choice: wird es verfolgen
  rationale: Der Imperfekt bezeichnet im prophetischen Zusammenhang die bevorstehende Folge. Das singularische Pronomen bezieht sich auf Israel; im Deutschen verlangt der Name in diesem Gebrauch das Neutrum »es«.
theological_decisions:
- issue: Bezug und Numerus des pronominalen Suffixes in יִרְדְּפוֹ
  choice: Singularisch mit »wird es verfolgen«, wobei Israel als einheitliches Volk personifiziert bleibt.
  alternative: »wird sie verfolgen«, mit Bezug auf die Israeliten als Mehrzahl
  rationale: Das hebräische Suffix steht in der 3. Person Maskulinum Singular. Das deutsche »es« folgt dem grammatischen Geschlecht von »Israel« und bewahrt den Singular, statt ihn zum kollektiven Plural zu glätten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper prophetischer Satzform. »Verworfen« wahrt den ernsten, würdevollen Ton; das Semikolon stellt den engen Zusammenhang zwischen Israels Abkehr und der folgenden Verfolgung heraus.
