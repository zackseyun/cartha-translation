  source_fidelity: Der Entwurf gibt die Satzglieder und die bewusst im Haupttext gewählte Deutung des anfänglichen Verbs als Gottes implizites Handeln zuverlässig wieder. Die Wiedergabe von נִקָּיוֹן mit „Reinheit“ erhält dessen moralische wie kultische Offenheit. Die Schlussformulierung „zur Reinheit unfähig sein“ bildet jedoch die hebräische Aussage über die Unfähigkeit, Reinheit/Unschuld zu erlangen, nicht idiomatisch genug ab.
  naturalness: „Er hat dein Kalb verworfen, Samaria“ ist klar und angemessen prophetisch. „Mein Zorn ist gegen sie entbrannt“ gibt das hebräische Zornsbild natürlich und mit der passenden resultativen Nuance wieder. „Wie lange noch werden sie keine Reinheit erlangen können?“ ist modernes Standarddeutsch und bewahrt die rhetorische Frage.
  terminology: „Kalb“, „verworfen“, „Zorn“ und „Reinheit“ sind sachgerecht. Die Fußnote zu „Reinheit“ wahrt die lexikalischen Alternativen „Unschuld“ und „Schuldlosigkeit“, ohne die moralisch-kultische Mehrdeutigkeit im Haupttext einzuengen. Der Fußnotenanker a sollte unmittelbar bei „Kalb“ stehen, auf das sich die alternative Subjektlesart bezieht.
