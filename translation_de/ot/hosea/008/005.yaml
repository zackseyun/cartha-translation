source:
  edition: WLC
  text: זָנַח֙ עֶגְלֵ֣/ךְ שֹֽׁמְר֔וֹן חָרָ֥ה אַפִּ֖/י בָּ֑/ם עַד מָתַ֕י לֹ֥א יוּכְל֖וּ נִקָּיֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/005.yaml
  text: He has rejected your calf[a], O Samaria; my anger burns against them[b]. How long will they be incapable of innocence?
translation:
  language: de
  text: Er hat dein Kalb[a] verworfen, Samaria; mein Zorn ist gegen sie entbrannt. Wie lange noch werden sie keine Reinheit[b] erlangen können?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dein Kalb hat dich verworfen, Samaria.“ Die hebräische Satzstruktur lässt zu, „dein Kalb“ als Subjekt des Verbs zu verstehen; im Haupttext wird dagegen Gott als unausgesprochenes Subjekt aufgefasst.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Unschuld“ beziehungsweise „Schuldlosigkeit“. Das hebräische Wort kann sowohl moralische als auch kultische Reinheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנַח
  choice: hat verworfen
  rationale: Das Verb bezeichnet entschiedenes Ablehnen oder Verstoßen. „Verworfen“ ist im prophetischen Zusammenhang prägnant und lässt Gott als das aus dem Kontext erschlossene Subjekt erkennen.
- source_word: עֶגְלֵךְ
  choice: dein Kalb
  rationale: Die wörtliche Bezeichnung bleibt erhalten; dass damit ein kultisches Kalbsbild gemeint ist, ergibt sich aus dem Zusammenhang und wird nicht erläuternd in den Haupttext eingefügt.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Der Name steht als direkte Anrede; im Deutschen macht die Stellung nach dem Satzgegenstand den Vokativ auch ohne das heute altertümlich wirkende „o“ deutlich.
- source_word: חָרָה אַפִּי
  choice: mein Zorn entbrennt
  rationale: Die hebräische Wendung beschreibt bildhaft das Brennen des Zorns. „Entbrennt“ bewahrt dieses Bild in natürlichem, würdevollem Deutsch.
- source_word: בָּם
  choice: gegen sie
  rationale: In Verbindung mit dem Zorn gibt die Präposition dessen Zielrichtung an. Der Plural verweist wahrscheinlich auf die Menschen, die dem Götzendienst anhängen.
- source_word: עַד מָתַי
  choice: Wie lange noch
  rationale: Dies ist die natürliche deutsche Form der zeitlichen, vorwurfsvollen Frage.
- source_word: לֹא יוּכְלוּ
  choice: werden sie … unfähig sein
  rationale: Die Form bezeichnet hier eine fortdauernde Unfähigkeit; die Zukunftsform erhält die zeitliche Spannung der Frage.
- source_word: נִקָּיוֹן
  choice: Reinheit
  rationale: Das Substantiv kann Schuldlosigkeit, Reinheit oder kultische Unbeflecktheit bezeichnen. „Reinheit“ hält die moralische und kultische Dimension zugleich offen.
theological_decisions:
- issue: Subjekt des eröffnenden Verbs זָנַח
  choice: 'Gott ist das unausgesprochene Subjekt: „Er hat dein Kalb verworfen“'
  alternative: „Dein Kalb hat dich verworfen, Samaria“
  rationale: Die hebräische Wortfolge lässt eine Lesart zu, in der „dein Kalb“ Subjekt ist und das Objekt sinngemäß ergänzt wird. Der unmittelbare Zusammenhang göttlicher Rede und der folgende Satz „mein Zorn entbrennt“ sprechen jedoch eher für Gott als unausgesprochenes Subjekt.
- issue: Bedeutungsumfang von נִקָּיוֹן
  choice: Reinheit
  alternative: Unschuld oder Schuldlosigkeit
  rationale: Der Zusammenhang verbindet sittliche Schuld mit kultischer Verunreinigung. „Reinheit“ vermeidet es, die Aussage ausschließlich auf eine dieser Dimensionen festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Anrede und das Bild des entbrennenden Zorns bleiben erhalten; „o Samaria“ wird vermieden, da es im heutigen Deutsch unnötig altertümlich klingt.
