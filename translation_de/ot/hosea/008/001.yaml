id: HOS.8.1
reference: Hosea 8:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֶל חִכְּ/ךָ֣ שֹׁפָ֔ר כַּ/נֶּ֖שֶׁר עַל בֵּ֣ית יְהוָ֑ה יַ֚עַן עָבְר֣וּ בְרִיתִ֔/י וְ/עַל תּוֹרָתִ֖/י פָּשָֽׁעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/001.yaml
  text: Put the trumpet to your mouth! Like an eagle over the house of Yahweh[c][b][a], because they have transgressed my covenant and rebelled against my law.
translation:
  language: de
  text: Das Horn an deinen Mund! Wie ein Adler[a] über dem Haus Jahwes! Denn sie haben meinen Bund übertreten[b] und sich gegen meine Weisung aufgelehnt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Geier“. Das hebräische Wort נֶשֶׁר kann allgemein einen großen Greifvogel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meinen Bund gebrochen“. Wörtlich liegt dem Ausdruck das Überschreiten oder Übertreten des Bundes zugrunde.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „gegen mein Gesetz“ beziehungsweise „gegen meine Lehre“. Das hebräische תּוֹרָה kann Weisung, Lehre oder Gesetz bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל חִכְּךָ שֹׁפָר
  choice: Das Horn an deinen Mund!
  rationale: Die verblos-abrupt formulierte Alarmaufforderung wird im Deutschen ebenso knapp wiedergegeben. „Mund“ ist natürlicher als das anatomisch genaue „Gaumen“; „Horn“ bezeichnet das Signalinstrument verständlich, ohne das Bild durch eine freie Umschreibung aufzulösen.
- source_word: כַּנֶּשֶׁר
  choice: wie ein Adler
  rationale: נֶשֶׁר bezeichnet einen großen Greifvogel und wird traditionell oft mit „Adler“ wiedergegeben. Die mögliche Bedeutung „Geier“ bleibt in einer Fußnote erhalten.
- source_word: עַל בֵּית יְהוָה
  choice: über dem Haus Jahwes
  rationale: „Über“ bewahrt das räumliche Bild des drohenden Greifvogels; der feindliche Sinn wird durch den Zusammenhang deutlich. „Haus“ lässt offen, ob Heiligtum, Land oder Bundesvolk gemeint ist.
- source_word: יַעַן
  choice: denn
  rationale: Die Konjunktion führt den Grund für die angekündigte Bedrohung ein. „Denn“ verbindet die abrupten Ausrufe natürlich mit der Begründung.
- source_word: עָבְרוּ בְרִיתִי
  choice: sie haben meinen Bund übertreten
  rationale: עָבַר bedeutet wörtlich „hinübergehen/überschreiten“ und bezeichnet hier idiomatisch eine Bundesverletzung. „Den Bund übertreten“ erhält etwas von der Ausgangsmetapher und ist im Deutschen verständlich.
- source_word: תּוֹרָתִי
  choice: meine Weisung
  rationale: תּוֹרָה umfasst Gesetz, Unterweisung und Lehre. „Weisung“ bewahrt diese Breite, während die rechtliche Bedeutung im Bundeszusammenhang weiterhin mitschwingt.
- source_word: פָּשָׁעוּ
  choice: sich gegen … aufgelehnt
  rationale: פָּשַׁע bezeichnet bewusste Auflehnung oder Rebellion, nicht bloß ein Versehen. Die reflexive Wendung gibt diese trotzige Haltung in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen geläufige Form der wissenschaftlich üblichen Wiedergabe des Tetragramms.
theological_decisions:
- issue: Bezug von „Haus Jahwes“
  choice: Die wörtliche Wendung bleibt stehen, ohne ihren Bezug festzulegen.
  alternative: Tempel Jahwes; Hausgemeinschaft beziehungsweise Volk Jahwes
  rationale: Im prophetischen Gerichtszusammenhang kann die Formulierung das Heiligtum, das Land oder das Bundesvolk bezeichnen. Eine engere Festlegung würde die Mehrdeutigkeit des Hebräischen unnötig auflösen.
- issue: Wiedergabe von תּוֹרָה
  choice: Weisung
  alternative: Gesetz; Lehre
  rationale: „Weisung“ hält die lehrende und die rechtlich bindende Dimension zusammen und vermeidet eine konfessionell verengte Deutung.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als Eigenname wahrt diese Form, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Knappes, alarmierendes Prophetenwort in modernem, würdigem Standarddeutsch. Die ersten beiden verblosen Ausrufe spiegeln die abrupte Form und Dringlichkeit des Hebräischen. Lexikalische und referenzielle Mehrdeutigkeiten werden im Haupttext nicht unnötig aufgelöst und in den Fußnoten kenntlich gemacht.
