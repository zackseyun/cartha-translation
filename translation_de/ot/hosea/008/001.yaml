  terminology: „Jahwe“ ist die im Deutschen etablierte Wiedergabe des Gottesnamens. „Weisung“ ist für תּוֹרָה tragfähig und bewahrt gegenüber „Gesetz“ die semantische Breite. Die Fußnoten dokumentieren die relevante zoologische, lexikalische und semantische Offenheit angemessen; ihre Anker stehen bei den jeweiligen Bezugswörtern.
