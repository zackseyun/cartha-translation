source:
  edition: WLC
  text: כִּ֛י ר֥וּחַ יִזְרָ֖עוּ וְ/סוּפָ֣תָ/ה יִקְצֹ֑רוּ קָמָ֣ה אֵֽין ל֗/וֹ צֶ֚מַח בְּלִ֣י יַֽעֲשֶׂה קֶּ֔מַח אוּלַ֣י יַֽעֲשֶׂ֔ה זָרִ֖ים יִבְלָעֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/007.yaml
  text: For they sow the wind[a], and they will reap the whirlwind. The standing grain has no head; it will yield no flour. Even if it should yield[c][b], strangers will swallow it up.
translation:
  language: de
  text: Denn sie säen Wind und werden einen Wirbelsturm[a] ernten. Das Getreide auf dem Halm hat keine Ähre[b]; es bringt kein Mehl hervor. Selbst wenn es welches hervorbrächte,[c] würden Fremde es verschlingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sturm“ beziehungsweise „Unwetter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Das stehende Getreide hat keinen צֶמַח“; das hebräische Substantiv kann „Spross“, „Trieb“ oder „Wuchs“ bedeuten, meint hier aber wahrscheinlich die Ähre, die den Ertrag für das Mehl liefert.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Vielleicht bringt es doch etwas hervor; Fremde werden es verschlingen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ר֥וּחַ
  choice: Wind
  rationale: Im Bild von Aussaat und Ernte ist die konkrete Bedeutung „Wind“ gemeint; „Geist“ oder „Atem“ wäre hier kontextfremd.
- source_word: וְ/סוּפָ֣תָ/ה
  choice: einen Wirbelsturm
  rationale: סוּפָה bezeichnet einen heftigen Sturm. „Wirbelsturm“ bewahrt die anschauliche Steigerung vom gesäten Wind zur zerstörerischen Ernte.
- source_word: יִקְצֹ֑רוּ
  choice: werden … ernten
  rationale: Das Imperfekt bezeichnet hier die künftige Folge ihres Handelns innerhalb eines sprichwortartigen Gerichtswortes.
- source_word: קָמָ֣ה
  choice: das Getreide auf dem Halm
  rationale: קָמָה bezeichnet das auf dem Feld stehende Getreide. Die Formulierung ist im modernen Deutschen verständlich und erhält das landwirtschaftliche Bild.
- source_word: צֶ֚מַח
  choice: Ähre
  rationale: Das Wort kann allgemein „Spross“, „Trieb“ oder „Wuchs“ bedeuten. Im Zusammenhang mit Getreide und Mehl bezeichnet es wahrscheinlich den ertragbringenden Teil, also die Ähre; die allgemeinere Bedeutung wird in einer Fußnote erhalten.
- source_word: בְּלִ֣י יַֽעֲשֶׂה קֶּ֔מַח
  choice: es bringt kein Mehl hervor
  rationale: Die Wendung beschreibt die Nutzlosigkeit der misslungenen Ernte. Diese natürliche deutsche Formulierung bewahrt den Zusammenhang zwischen Getreide und Mehl.
- source_word: אוּלַ֣י
  choice: selbst wenn
  rationale: 'אוּלַי bedeutet häufig „vielleicht“, kann hier aber eine eingeräumte Möglichkeit einleiten: Auch ein möglicher Ertrag käme Israel nicht zugute. Die alternative Satzauffassung wird in einer Fußnote genannt.'
- source_word: זָרִ֖ים
  choice: Fremde
  rationale: Das Wort bezeichnet Außenstehende oder Ausländer. „Fremde“ lässt offen, wer genau gemeint ist, und betont, dass andere den Ertrag an sich nehmen.
- source_word: יִבְלָעֻֽ/הוּ
  choice: würden … es verschlingen
  rationale: בלע bedeutet wörtlich „verschlingen“. Das starke Bild vollständigen Verzehrs beziehungsweise Verlusts bleibt damit erhalten.
- source_word: כִּ֛י
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert das vorangehende Gerichtswort und fügt sich so in den prophetischen Gedankengang ein.
theological_decisions:
- issue: Deutung des landwirtschaftlichen Bildes
  choice: Das Bild unmittelbar als sprichwortartige Aussage über Tun und Gericht wiedergeben.
  alternative: „Wind“ und „Wirbelsturm“ deutend als Nichtigkeit und Unheil umschreiben.
  rationale: Der Vers entfaltet selbst ein konkretes Bild von Aussaat, Ernte und Verlust. Die direkte Wiedergabe lässt die Gerichtsaussage aus dem Bild hervorgehen, ohne eine zusätzliche allegorische Erklärung in den Text einzutragen.
- issue: Bedeutung von אוּלַי im letzten Satz
  choice: 'Konzessiv: „Selbst wenn …“'
  alternative: 'Modal und als eigener Satz: „Vielleicht bringt es doch etwas hervor; Fremde werden es verschlingen.“'
  rationale: 'Der Zusammenhang legt eine Steigerung nahe: Es gibt keinen Ertrag; und selbst ein denkbarer Ertrag würde Fremden zufallen. Da אוּלַי jedoch gewöhnlich „vielleicht“ heißen kann, wird diese echte syntaktische Möglichkeit in der Fußnote bewahrt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das knappe prophetische Bild und seine Steigerung bleiben erhalten. „Getreide auf dem Halm“ vermeidet eine unnatürliche wörtliche Wiedergabe, während die Fußnote die lexikalische Offenheit von צֶמַח dokumentiert.
