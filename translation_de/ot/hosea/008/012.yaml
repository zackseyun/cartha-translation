  text: אכתוב ל֔/וֹ רבו תּֽוֹרָתִ֑/י כְּמוֹ זָ֖ר נֶחְשָֽׁבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/012.yaml
  text: Though I wrote for him the many things of my law[a], they were regarded as something foreign.
translation:
  language: de
  text: Wenn ich ihm noch so viele Weisungen meiner Tora aufschriebe[a], würden sie als etwas Fremdes gelten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Obwohl ich ihm die vielen Weisungen meiner Tora aufschrieb, galten sie als etwas Fremdes.« Das hebräische Anfangsverb kann rückblickend, unabgeschlossen oder hypothetisch verstanden werden. Die Mengenangabe kann auch mit »Zehntausende« oder »Myriaden« wiedergegeben werden; »Tora« kann hier auch »Weisung« oder »Gesetz« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אכתוב
  choice: obwohl ich … aufschrieb
  rationale: Das Qal-Imperfekt der 1. Person Singular kann hier rückblickend beziehungsweise rhetorisch verstanden werden. Die konzessive Formulierung macht den Gegensatz zur ablehnenden Reaktion Israels natürlich deutlich, ohne die in der Fußnote bewahrte alternative Deutung auszuschließen.
- source_word: לוֹ
  choice: ihm
  rationale: Die Präposition mit Suffix bezeichnet Israel beziehungsweise Ephraim als kollektiven Singular. Das deutsche »ihm« bewahrt Numerus und Bezug des Hebräischen.
- source_word: רבו
  choice: vielen
  rationale: Der Ausdruck bezeichnet eine große Menge. »Vielen« gibt den Sinn in natürlichem Deutsch wieder; die stärker zahlenbezogene Wiedergabe »Zehntausende« wird in der Fußnote genannt.
- source_word: תּוֹרָתִי
  choice: meine … Weisungen
  rationale: תורה bezeichnet hier Gottes verbindliche Unterweisung. »Weisungen« ist im modernen Deutsch verständlich und bewahrt den lehrenden Sinn; »Tora« bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: כְּמוֹ זָר
  choice: als etwas Fremdes
  rationale: Die Vergleichspartikel und זר beschreiben Gottes Weisungen als etwas, das Israel wie nicht zu ihm gehörig behandelte. Die Formulierung ist idiomatisch und erhält diesen Kontrast.
- source_word: נֶחְשָׁבוּ
  choice: galten
  rationale: Das Nifal von חשב bezeichnet hier eine passive Einschätzung oder Behandlung. »Galten« gibt diese wertende Wahrnehmung knapp und natürlich wieder.
theological_decisions:
- issue: Bezug des singularischen Pronomens לוֹ
  choice: »ihm« als kollektiver Singular für Israel beziehungsweise Ephraim
  alternative: individualisierendes »ihm« ohne ausdrücklich kollektiven Bezug
  rationale: Hosea spricht das Volk häufig im Singular an. Die Übersetzung bewahrt die hebräische Form und legt keine einzelne Person als Referenten fest.
- issue: Zeit- und Modalwert von אכתוב und נֶחְשָׁבוּ
  choice: 'rückblickende Aussage: »aufschrieb … galten«'
  alternative: 'hypothetisch beziehungsweise modal: »Schriebe ich … würden sie gelten«'
  rationale: Der Kontext erlaubt, die bereits gegebene göttliche Weisung und Israels tatsächliche Ablehnung hervorzuheben. Da die hebräische Verbform auch eine unabgeschlossene oder hypothetische Deutung zulässt, wird diese in der Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Weisungen« ist allgemein verständlich und vermittelt den unterweisenden sowie verbindlichen Charakter von תורה. Der kollektive Singular und die in den Verbformen liegende Deutungsspannung bleiben erhalten.
