  text: כִּ֤י מִ/יִּשְׂרָאֵל֙ וְ/ה֔וּא חָרָ֣שׁ עָשָׂ֔/הוּ וְ/לֹ֥א אֱלֹהִ֖ים ה֑וּא כִּֽי שְׁבָבִ֣ים יִֽהְיֶ֔ה עֵ֖גֶל שֹׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/006.yaml
  text: For it is from Israel[a]; a craftsman made it, and it is not God. Indeed[b], the calf of Samaria will become splinters.
translation:
  language: de
  text: Denn es stammt aus Israel; ein Handwerker hat es gemacht, und es ist kein Gott.[a] Denn das Kalb von Samaria wird zu Splittern werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und es ist nicht Gott“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird in Stücke zerbrochen werden“ beziehungsweise „wird zu Bruchstücken werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Das erste כִּי leitet die Begründung für die vorherige Anklage ein; „Denn“ gibt diese kausale Funktion natürlich wieder.
- source_word: מִיִּשְׂרָאֵל
  choice: aus Israel
  rationale: 'מִן bezeichnet hier Herkunft oder Ursprung: Das Götzenbild stammt aus Israel selbst.'
- source_word: וְהוּא
  choice: es
  rationale: Das Pronomen nimmt das zuvor genannte Kalb beziehungsweise Götzenbild wieder auf. Im Deutschen ist „es“ natürlich; die hebräische Konjunktion muss hier nicht eigens wiedergegeben werden.
- source_word: חָרָשׁ
  choice: ein Handwerker
  rationale: חָרָשׁ bezeichnet einen fachkundigen Hersteller, ohne das bearbeitete Material eindeutig festzulegen. „Handwerker“ bewahrt diese Offenheit.
- source_word: עָשָׂהוּ
  choice: hat es gemacht
  rationale: Die schlichte Formulierung gibt das Verb עשה samt Objektsuffix klar wieder und betont den menschlichen Ursprung des Bildes.
- source_word: וְלֹא אֱלֹהִים הוּא
  choice: und es ist nicht Gott
  rationale: Die direkte Negation des Hebräischen wird bewahrt. Sie bestreitet dem menschengemachten Kalb wahre Göttlichkeit.
- source_word: כִּי
  choice: Ja
  rationale: Das zweite כִּי bekräftigt die folgende Gerichtsankündigung. „Ja“ gibt diesen nachdrücklichen Übergang knapp und idiomatisch wieder.
- source_word: שְׁבָבִים
  choice: Splitter
  rationale: Das seltene Substantiv bezeichnet kleine Bruchstücke oder Splitter und zeichnet die vollständige Zerstörung des Götzenbildes anschaulich nach.
- source_word: יִהְיֶה
  choice: wird zu … werden
  rationale: Mit dem prädikativen Substantiv bezeichnet היה hier das Ergebnis einer Veränderung; „zu … werden“ bringt dies im Deutschen deutlich zum Ausdruck.
- source_word: עֵגֶל שֹׁמְרוֹן
  choice: das Kalb von Samaria
  rationale: Die Status-constructus-Verbindung ordnet das Kalb Samaria zu. Die Formulierung bleibt transparent und legt nicht enger fest, ob Stadt, Hauptstadt oder Reich im Vordergrund steht.
theological_decisions:
- issue: Art der Verneinung in „es ist nicht Gott“
  choice: Die direkte Aussage „es ist nicht Gott“ wird im Haupttext beibehalten.
  alternative: „Es ist kein Gott“
  rationale: Das Hebräische verneint unmittelbar, dass das Kalb אֱלֹהִים ist. Die gewählte Fassung bewahrt die pointierte Gegenüberstellung von menschlicher Herstellung und wahrer Göttlichkeit, ohne sie durch eine stärker idiomatische Formulierung abzuschwächen oder dogmatisch auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die elliptische hebräische Anfangsklausel wird idiomatisch als „es stammt aus Israel“ ausgedrückt; die scharfe theologische Verneinung und das konkrete Zerstörungsbild bleiben erhalten.
