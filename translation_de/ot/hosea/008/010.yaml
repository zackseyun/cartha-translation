source:
  edition: WLC
  text: גַּ֛ם כִּֽי יִתְנ֥וּ בַ/גּוֹיִ֖ם עַתָּ֣ה אֲקַבְּצֵ֑/ם וַ/יָּחֵ֣לּוּ מְּעָ֔ט מִ/מַּשָּׂ֖א מֶ֥לֶךְ שָׂרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/010.yaml
  text: Even though they hire among the nations[a], now I will gather them[c][b]; and they will begin to diminish under the burden of the king of princes.
translation:
  language: de
  text: Auch wenn sie sich unter den Völkern Verbündete erkaufen[a], werde ich sie jetzt sammeln. Und sie werden beginnen, unter der Last des Königs der Fürsten[c] weniger zu werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch wenn sie unter den Völkern Gaben geben“. Das hebräische Verb bedeutet gewöhnlich „geben“; im Zusammenhang ist wahrscheinlich gemeint, dass Israel fremde Verbündete bezahlt oder gegen Entgelt gewinnt.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut ist schwierig. Möglich sind auch: „sie werden sich ein wenig winden“ oder „sie werden wegen der Last beziehungsweise des Tributs nur noch wenige sein“.'
    reason: alternative_reading
  - marker: c
    text: Mit der „Last des Königs der Fürsten“ kann der drückende Tribut gemeint sein, den ein imperialer Oberherr auferlegte.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם כִּי יִתְנוּ בַגּוֹיִם
  choice: Auch wenn sie sich unter den Völkern Verbündete erkaufen
  rationale: נתן bedeutet gewöhnlich „geben“. Im Zusammenhang mit Israels politischem Werben um fremde Mächte und den dafür geleisteten Zahlungen liegt jedoch die Bedeutung nahe, Verbündete gegen Bezahlung zu gewinnen. Die ergänzten „Verbündeten“ machen diesen Sinn im Deutschen verständlich; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: עַתָּה אֲקַבְּצֵם
  choice: werde ich sie jetzt sammeln
  rationale: עַתָּה ist das gewöhnliche Zeitadverb „jetzt“, und קבץ bedeutet „sammeln“. Die Übersetzung lässt offen, zu welchem Zweck Gott sie sammelt; der Gerichtszusammenhang wird nicht in das Verb hineingetragen.
- source_word: וַיָּחֵלּוּ מְּעָט
  choice: Dann werden sie anfangen, … weniger zu werden
  rationale: Die schwierige Form וַיָּחֵלּוּ wird als „sie werden anfangen“ verstanden, מְעָט im Sinn einer zahlenmäßigen oder machtpolitischen Abnahme. Wegen der sprachlichen Unsicherheit werden andere Deutungen in einer Fußnote genannt.
- source_word: מִמַּשָּׂא
  choice: unter der Last
  rationale: מַשָּׂא bezeichnet eine Last und kann hier konkret auf Tribut oder andere drückende Leistungen unter imperialer Herrschaft zielen. „Unter der Last“ bewahrt das Bild, ohne es auf Tribut allein festzulegen.
- source_word: מֶלֶךְ שָׂרִים
  choice: des Königs der Fürsten
  rationale: Die knappe hebräische Genitivverbindung wird formal als „König der Fürsten“ wiedergegeben. So bleibt die mögliche Bezeichnung eines Oberherrschers über nachgeordnete Machthaber erhalten.
theological_decisions:
- issue: Ob Gottes Sammeln Wiederherstellung oder Gericht bezeichnet
  choice: 'Das Verb bleibt neutral: „werde ich sie … sammeln“; im Kontext ist ein Sammeln zum Gericht wahrscheinlich.'
  alternative: Eine verheißene Sammlung zur Wiederherstellung.
  rationale: Hosea 8 spricht unmittelbar von Israels verfehlten Bündnissen und den Folgen fremder Herrschaft. Dennoch bezeichnet אֲקַבְּצֵם für sich nur das Sammeln; deshalb wird der Gerichtszweck nicht ausdrücklich in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „König der Fürsten“ bleibt wegen der knappen und mehrdeutigen hebräischen Konstruktion erhalten. Der Haupttext ist verständlich formuliert, während die erheblichen lexikalischen Unsicherheiten in den Fußnoten offengelegt werden.
