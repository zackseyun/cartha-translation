base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/002.yaml
  text: To me they cry[a], ‘My God[b], we—Israel—know you!’
translation:
  language: de
  text: 'Zu mir schreien sie[a]: »Mein Gott, wir – Israel – kennen dich[b]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »rufen sie laut«. Das hebräische Verb kann einen dringlichen Hilferuf bezeichnen.'
