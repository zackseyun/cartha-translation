lexical_decisions:
- source_word: לִי
  choice: Zu mir
  rationale: 'Die Präposition ל mit dem Suffix der 1. Person Singular bezeichnet hier am natürlichsten die Richtung des Rufens: Israel richtet seinen Hilferuf an Gott.'
- source_word: יִזְעָקוּ
  choice: schreien sie
  rationale: זעק bezeichnet häufig ein lautes, dringliches Rufen, besonders in Bedrängnis. »Schreien« bewahrt diese Intensität knapp und idiomatisch.
- source_word: אֱלֹהַי
  choice: Mein Gott
  rationale: Das Substantiv mit dem Suffix der 1. Person Singular bildet einen direkten, anrufungsartigen Appell. »Mein Gott« gibt ihn ohne einen zusätzlichen interpretierenden Ausruf wieder.
- source_word: יְדַעֲנוּךָ
  choice: wir kennen dich
  rationale: ידע bedeutet im Qal grundlegend »kennen« und kann zugleich Beziehung und Bundesverbundenheit anklingen lassen. Die einfache Wiedergabe wahrt sowohl den unmittelbaren Sinn als auch seine mögliche Tiefendimension.
- source_word: יִשְׂרָאֵל
  choice: wir – Israel –
  rationale: »Israel« bestimmt die Sprecher nachträglich und betont ihre Selbstbezeichnung. Die Einschaltung mit Gedankenstrichen erhält die abrupte, nachdrückliche Apposition des Hebräischen.
theological_decisions:
- issue: Bedeutungsumfang von »kennen« im Bundeszusammenhang
  choice: Die schlichte Beziehungsbehauptung »wir kennen dich« bleibt im Haupttext erhalten.
  alternative: »Wir erkennen dich an« oder »wir stehen mit dir im Bund«
  rationale: Bei Hosea trägt »kennen« häufig bundestheologische und ethische Obertöne. Eine ausdrückliche Erweiterung würde jedoch Israels Behauptung vorschnell auslegen und die im Zusammenhang erkennbare Spannung zwischen Anspruch und Wirklichkeit abschwächen.
- issue: Zuordnung von »Israel« in der direkten Rede
  choice: '»Israel« wird als nachdrückliche Selbstbezeichnung der Sprechenden wiedergegeben: »wir – Israel –«.'
  alternative: »Israel« als Anrede oder als vom Zitat gelöster Satzteil
  rationale: Die Wortfolge lässt sich am besten als direkte Rede an Gott verstehen, wobei »Israel« appositionell zum in »wir kennen« enthaltenen Subjekt steht. So bleibt die rhetorische Schroffheit gewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Wendung »Zu mir« und die eingeschobene Selbstbezeichnung bewahren die markante hebräische Wortstellung und den Nachdruck, ohne unnatürlich altertümlich zu klingen.
