source:
  edition: WLC
  text: זִבְחֵ֣י הַבְהָבַ֗/י יִזְבְּח֤וּ בָשָׂר֙ וַ/יֹּאכֵ֔לוּ יְהוָ֖ה לֹ֣א רָצָ֑/ם עַתָּ֞ה יִזְכֹּ֤ר עֲוֺנָ/ם֙ וְ/יִפְקֹ֣ד חַטֹּאותָ֔/ם הֵ֖מָּה מִצְרַ֥יִם יָשֽׁוּבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/013.yaml
  text: As for the sacrifices of my offerings[a], they sacrifice flesh and eat it, but Yahweh does not accept them. Now he will remember their iniquity and punish their sins[c][b]; they will return to Egypt.
translation:
  language: de
  text: 'Was die Opfer meiner Gaben[a] betrifft: Sie opfern Fleisch und essen es, doch Jahwe nimmt sie nicht an.[b] Nun wird er sich an ihre Schuld erinnern und ihre Sünden ahnden. Sie werden nach Ägypten zurückkehren.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht eine ungewöhnliche Wendung, wörtlich etwa „die Opfer meiner Gaben“. Möglich ist auch „meine Opfergaben“, weniger wahrscheinlich „meine geliebten Opfer“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jahwe hat kein Gefallen an ihnen“ beziehungsweise „Jahwe freut sich nicht über sie“.'
    reason: lexical_alternative
  - marker: c
    text: Die „Rückkehr nach Ägypten“ kann eine tatsächliche Rückkehr bezeichnen oder allgemeiner eine erneute Knechtschaft und Verbannung unter dem Bild Ägyptens.
    reason: alternative_reading
lexical_decisions:
- source_word: זִבְחֵי הַבְהָבַי
  choice: die Opfer meiner Gaben
  rationale: Die schwierige hebräische Fügung wird entsprechend ihrer Konstruktverbindung transparent wiedergegeben, ohne sie durch eine Konjektur zu glätten. Die ungewöhnliche Ausdrucksweise und mögliche Alternativen werden in einer Fußnote bewahrt.
- source_word: יִזְבְּחוּ בָשָׂר וַיֹּאכֵלוּ
  choice: sie opfern Fleisch und essen es
  rationale: זבח bezeichnet das Darbringen eines Schlachtopfers; בשר benennt konkret das Fleisch. Das ergänzte Pronomen „es“ ergibt im Deutschen einen natürlichen Satz.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֹא רָצָם
  choice: nimmt sie nicht an
  rationale: רצה bezeichnet im Opferkontext die wohlwollende Annahme. Die Formulierung wahrt den Bezug auf die Opfer; die allgemeinere Nuance des Nichtgefallens steht in der Fußnote.
- source_word: יִזְכֹּר עֲוֺנָם
  choice: wird er sich an ihre Schuld erinnern
  rationale: „Sich erinnern“ bewahrt das Bild des hebräischen זכר mit seiner gerichtlichen Tragweite. עוון wird hier als „Schuld“ natürlich und prägnant wiedergegeben.
- source_word: וְיִפְקֹד חַטֹּאותָם
  choice: und ihre Sünden ahnden
  rationale: פקד hat hier einen gerichtlichen, strafenden Sinn. „Ahnden“ gibt diesen Sinn idiomatisch wieder, ohne den Parallelismus unnötig auszudeuten.
- source_word: הֵמָּה מִצְרַיִם יָשׁוּבוּ
  choice: Sie werden nach Ägypten zurückkehren
  rationale: Der ausdrücklich genannte Ort Ägypten bleibt erhalten. Ob eine tatsächliche Rückkehr, erneute Knechtschaft oder beides gemeint ist, wird im Haupttext nicht entschieden.
theological_decisions:
- issue: Bedeutung der Rückkehr nach Ägypten
  choice: Sie werden nach Ägypten zurückkehren
  alternative: Sie werden wieder in eine Knechtschaft wie in Ägypten geraten
  rationale: Der hebräische Text nennt Ägypten unmittelbar. Die Übersetzung bewahrt daher sowohl die mögliche geografische Aussage als auch das Bild einer Umkehrung des Exodus; die Spannung wird in einer Fußnote erläutert, nicht aufgelöst.
- issue: Gottes Reaktion auf die Opfer
  choice: Jahwe nimmt sie nicht an
  alternative: Jahwe hat kein Gefallen an ihnen
  rationale: Im Opferzusammenhang ist die Annahme die naheliegende konkrete Bedeutung. Die mögliche breitere Bedeutung des Nichtgefallens bleibt als Alternative erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwer verständliche Opferformel bleibt im Haupttext erkennbar, wird aber durch die Einleitung syntaktisch lesbar gemacht. Gerichtssprache und prophetische Spannung werden knapp und ohne konfessionelle Ausdeutung bewahrt.
