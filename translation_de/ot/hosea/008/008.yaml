  text: נִבְלַ֖ע יִשְׂרָאֵ֑ל עַתָּה֙ הָי֣וּ בַ/גּוֹיִ֔ם כִּ/כְלִ֖י אֵֽין חֵ֥פֶץ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/008.yaml
  text: Israel is swallowed up[a]; now they are among the nations like a vessel in which there is no delight.
translation:
  language: de
  text: Israel ist verschlungen. Nun sind sie unter den Völkern wie ein Gefäß, an dem niemand Gefallen hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִבְלַע
  choice: ist verschlungen
  rationale: Das Nifal von בלע bezeichnet passiv das Verschlungen- oder Aufgenommenwerden. Das deutsche Perfekt gibt den im Hebräischen als vollzogen dargestellten Zustand natürlich und anschaulich wieder.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier kollektiv das Nordreich beziehungsweise sein Volk.
- source_word: עַתָּה
  choice: nun
  rationale: Das Zeitadverb markiert die jetzt eingetretene Folge des Gerichts; „nun“ passt zum würdevollen prophetischen Ton.
- source_word: הָיוּ בַגּוֹיִם
  choice: sind sie unter den Völkern
  rationale: Die Verbform ist formal Perfekt 3. Person Plural und nimmt Israel als Vielheit des Volkes auf. Im Zusammenhang mit עַתָּה bezeichnet sie den gegenwärtigen resultierenden Zustand. „Unter den Völkern“ ist idiomatisches Deutsch.
- source_word: כִּכְלִי
  choice: wie ein Gefäß
  rationale: כְּלִי kann Gefäß, Gerät oder Gegenstand bedeuten. „Gefäß“ bewahrt das konkrete Bild und den biblisch-würdigen Ton.
- source_word: אֵין חֵפֶץ בּוֹ
  choice: an dem niemand Gefallen hat
  rationale: Die Wendung drückt aus, dass an dem Gefäß kein Gefallen beziehungsweise Verlangen besteht. Die unpersönliche hebräische Negation wird im Deutschen natürlich mit „niemand“ wiedergegeben, ohne den Sinn auf bloße Nützlichkeit zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller prophetischer Sprache. Der Wechsel vom kollektiven Singular „Israel“ zum Plural „sie“ bleibt erhalten. Die beiden Aussagen werden als kurze, eng verbundene Gerichtsaussagen wiedergegeben.
