source:
  edition: WLC
  text: חַטַּ֥את עַמִּ֖/י יֹאכֵ֑לוּ וְ/אֶל עֲוֺנָ֖/ם יִשְׂא֥וּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/008.yaml
  text: They feed on the sin of my people[b][a], and they set their appetite on their iniquity.
translation:
  language: de
  text: Sie nähren sich von der Sünde[a] meines Volkes und richten ihr Verlangen auf dessen Schuld[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie essen das Sündopfer meines Volkes.« Das hebräische Wort kann sowohl »Sünde« als auch »Sündopfer« bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »Zu ihrer Schuld hin erheben sie seine Seele.« Die hebräische Wendung bezeichnet ein Begehren oder Verlangen; auffällig ist, dass das Verb im Plural, »seine Seele« aber im Singular steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: Sünde
  rationale: Das Substantiv kann sowohl »Sünde« als auch »Sündopfer« bedeuten. Der Parallelismus mit »Schuld« stützt im Haupttext den moralischen Sinn; die kultische Bedeutung bleibt in einer Fußnote erhalten.
- source_word: יֹאכֵלוּ
  choice: nähren sich von
  rationale: Das Verb bedeutet wörtlich »essen«. »Sich nähren von« bewahrt das Bild des Verzehrens und bringt zugleich die ausbeuterische Bedeutung in natürlichem Deutsch zum Ausdruck.
- source_word: עַמִּי
  choice: meines Volkes
  rationale: Die Verbindung mit dem Suffix der ersten Person Singular wird unmittelbar wiedergegeben.
- source_word: עֲוֺנָם
  choice: dessen Schuld
  rationale: עָוֹן kann Vergehen, Schuld oder die daraus folgende Strafe bezeichnen. »Schuld« wahrt hier das ethische Gewicht und passt zum Parallelismus; »dessen« bezieht sich eindeutig auf das Volk.
- source_word: יִשְׂאוּ נַפְשׁוֹ
  choice: richten ihr Verlangen auf
  rationale: Die Verbindung von נשׂא und נפשׁ bezeichnet ein gerichtetes Begehren. Die idiomatische Wiedergabe vermittelt diesen Sinn, ohne die im Hebräischen schwierige Numerusfolge im Haupttext künstlich nachzubilden.
- source_word: נַפְשׁוֹ
  choice: ihr Verlangen
  rationale: Die überlieferte Form lautet wörtlich »seine Seele«, obwohl das Verb im Plural steht. Im Zusammenhang ist ein kollektives beziehungsweise distributives Verständnis wahrscheinlich; die formale Schwierigkeit wird in der Fußnote offengelegt.
theological_decisions:
- issue: Bedeutung von חַטַּאת im Zusammenhang der Anklage gegen die Priester
  choice: Im Haupttext »Sünde«, mit »Sündopfer« als Alternative in der Fußnote.
  alternative: »Sie essen das Sündopfer meines Volkes.«
  rationale: Die Priester könnten sowohl von den Opfergaben leben als auch von der fortdauernden Sünde des Volkes profitieren. Der Parallelismus mit עֲוֺנָם spricht für die moralische Lesart im Haupttext, doch die mögliche kultische Doppeldeutigkeit darf nicht aufgelöst werden.
- issue: Numerusproblem in יִשְׂאוּ נַפְשׁוֹ
  choice: 'Im Haupttext sinngemäß pluralisch: »richten ihr Verlangen auf«.'
  alternative: 'Wörtlich: »und auf ihre Schuld erheben sie seine Seele«.'
  rationale: Das pluralische Verb und das singularische Suffix stehen grammatisch in Spannung. Eine idiomatische Wiedergabe macht den wahrscheinlichen Sinn verständlich, während die Fußnote die Form des masoretischen Textes bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sich nähren von« erhält die Verzehrmetapher, ohne unnatürlich zu klingen. Die pronominale Form »dessen« verhindert eine mögliche falsche Zuordnung von »ihrer Schuld« zu den Priestern. Beide sachlich wichtigen Mehrdeutigkeiten des Hebräischen werden durch markierte Fußnoten bewahrt.
