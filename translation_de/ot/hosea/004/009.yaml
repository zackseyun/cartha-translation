  text: וְ/הָיָ֥ה כָ/עָ֖ם כַּ/כֹּהֵ֑ן וּ/פָקַדְתִּ֤י עָלָי/ו֙ דְּרָכָ֔י/ו וּ/מַעֲלָלָ֖י/ו אָשִׁ֥יב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/009.yaml
  text: 'And it will be: like people[a], like priest. And I will punish him for his ways[b], and repay him for his deeds.'
translation:
  language: de
  text: 'Und es wird geschehen: Wie das Volk, so der Priester.[a] Und ich werde ihn für sein Verhalten bestrafen und ihm seine Taten vergelten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die knappe hebräische Vergleichsformel lautet: „Wie das Volk, wie Priester.“ Sie besagt, dass Volk und Priester demselben Gericht unterliegen.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen die Pronomen im Singular („ihn“, „sein“, „ihm“). Sie können sich verteilend auf die ganze genannte Gruppe beziehen oder den Blick auf den Priester verengen.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Die Form von היה mit vorangestelltem ו leitet den eintretenden Zustand ein. Die Wendung ist im Deutschen würdevoll und verständlich, ohne einen zusätzlichen Folgeschluss einzutragen.
- source_word: כָעָם כַּכֹּהֵן
  choice: Wie das Volk, so der Priester
  rationale: Die knappe sprichwortartige Vergleichsformel stellt Volk und Priester hinsichtlich des Gerichts gleich. Die deutsche Wie-so-Konstruktion gibt diesen Sinn natürlich und prägnant wieder.
- source_word: וּפָקַדְתִּי עָלָיו
  choice: ich werde ihn … bestrafen
  rationale: פקד mit על bezeichnet hier im Gerichtszusammenhang das strafende Zur-Rechenschaft-Ziehen. Das Singularpronomen bleibt entsprechend dem Hebräischen erhalten.
- source_word: דְּרָכָיו
  choice: für sein Verhalten
  rationale: דֶּרֶךְ bezeichnet im moralischen Zusammenhang die Lebensführung. „Verhalten“ vermittelt diesen Sinn im heutigen Deutsch natürlicher als das wörtliche „Wege“.
- source_word: וּמַעֲלָלָיו אָשִׁיב לוֹ
  choice: und ihm seine Taten vergelten
  rationale: מַעֲלָלִים sind moralisch bewertete Taten; die Hifil-Form von שוב mit ל bezeichnet hier die entsprechende Vergeltung. „Ihm seine Taten vergelten“ bewahrt Bild und Gerichtscharakter.
theological_decisions:
- issue: Bezug und Numerus der Singularpronomen im Gerichtssatz
  choice: Die Singularformen „ihn“, „sein“ und „ihm“ werden wie im Hebräischen beibehalten.
  alternative: Pluralformen („sie“, „ihr“, „ihnen“) verwenden oder den Singular ausschließlich auf den Priester beziehen.
  rationale: Nach dem kollektiven Vergleich von Volk und Priester kann der Singular distributiv beziehungsweise korporativ gebraucht sein, aber auch den Blick auf den Priester verengen. Die Übersetzung entscheidet diese Spannung nicht vorzeitig.
translation_notes:
  register: Modernes Standarddeutsch in würdevoll-prophetischem Ton. Die sprichwortartige Kürze des Vergleichs bleibt erhalten; unnatürliche Wörtlichkeit wird bei דְּרָכָיו zugunsten von „Verhalten“ vermieden.
