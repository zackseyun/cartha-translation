source:
  edition: WLC
  text: לֹֽא אֶפְק֨וֹד עַל בְּנוֹתֵי/כֶ֜ם כִּ֣י תִזְנֶ֗ינָה וְ/עַל כַּלּֽוֹתֵי/כֶם֙ כִּ֣י תְנָאַ֔פְנָה כִּי הֵם֙ עִם הַ/זֹּנ֣וֹת יְפָרֵ֔דוּ וְ/עִם הַ/קְּדֵשׁ֖וֹת יְזַבֵּ֑חוּ וְ/עָ֥ם לֹֽא יָבִ֖ין יִלָּבֵֽט־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/014.yaml
  text: I will not punish your daughters when they prostitute themselves[a], nor your daughters-in-law when they commit adultery; for the men themselves go apart with prostitutes and sacrifice with cult prostitutes[c][b], and a people without understanding comes to ruin.
translation:
  language: de
  text: Ich werde eure Töchter nicht bestrafen, wenn sie sich prostituieren, und eure Schwiegertöchter nicht, wenn sie Ehebruch begehen; denn die Männer selbst ziehen sich mit Prostituierten zurück[a] und bringen mit geweihten Frauen[b] Schlachtopfer dar. Ein Volk ohne Einsicht geht zugrunde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sondern sich mit Prostituierten ab“ oder „gehen mit Prostituierten abseits“. Das hebräische Verb bedeutet „sich trennen“ bzw. „sich absondern“ und ist hier wahrscheinlich euphemistisch gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, traditionell: „Kultprostituierten“ bzw. „Tempelprostituierten“. Das hebräische Wort bedeutet wörtlich „geweihte Frauen“; ihre genaue Funktion und ein möglicher Bezug zu kultischer Sexualität sind umstritten.'
    reason: lexical_alternative
  - marker: c
    text: Das seltene hebräische Verb kann auch „zu Fall kommen“, „niedergeworfen werden“ oder „verwirrt werden“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְקוֹד
  choice: werde … nicht bestrafen
  rationale: פקד mit עַל bezeichnet im Gerichtszusammenhang das Ahnden oder Zur-Rechenschaft-Ziehen; „bestrafen“ gibt diesen Sinn in klarem modernem Deutsch wieder.
- source_word: תִזְנֶינָה
  choice: sich prostituieren
  rationale: זנה bezeichnet hier unerlaubtes sexuelles Verhalten mit konkreter Prostitutionsmetaphorik; die Wiedergabe bleibt deutlich, ohne archaisch zu klingen.
- source_word: כַלּוֹתֵיכֶם
  choice: eure Schwiegertöchter
  rationale: כַּלָּה bezeichnet in dieser familiären Beziehung die Frauen der Söhne, nicht nur Bräute am Hochzeitstag.
- source_word: תְנָאַפְנָה
  choice: Ehebruch begehen
  rationale: נאף bezeichnet spezifisch Ehebruch und wird daher von זנה unterschieden.
- source_word: יְפָרֵדוּ
  choice: sondern sich … ab
  rationale: פרד bedeutet wörtlich „sich trennen/absondern“. Die Formulierung bewahrt das möglicherweise euphemistische Bild des Rückzugs mit Prostituierten.
- source_word: הַזֹּנוֹת
  choice: Prostituierte
  rationale: Klare und gegenwärtige Wiedergabe der femininen Form von זנה.
- source_word: הַקְּדֵשׁוֹת
  choice: Kultprostituierte
  rationale: Der Ausdruck bezeichnet Frauen in einem unerlaubten kultisch-sexuellen Zusammenhang; „Kultprostituierte“ wahrt den Kultbezug, ohne einen Tempel als konkreten Ort vorauszusetzen.
- source_word: יְזַבֵּחוּ
  choice: bringen … Schlachtopfer dar
  rationale: זבח bezeichnet das Darbringen von Schlachtopfern; diese Wiedergabe ist im kultischen Zusammenhang präziser als das im Deutschen mehrdeutige „opfern“.
- source_word: וְעָם לֹא יָבִין
  choice: Ein Volk aber, das keine Einsicht hat
  rationale: Die Formulierung gibt den unbestimmten kollektiven Ausdruck idiomatisch wieder; „aber“ markiert den abschließenden Folgesatz, ohne zusätzliche Kausalität einzutragen.
- source_word: יִלָּבֵט
  choice: geht zugrunde
  rationale: Das seltene Verb bezeichnet wahrscheinlich ein Niederstürzen, Scheitern oder Verderben. „Geht zugrunde“ vermittelt das Ergebnis verständlich, während die Unsicherheit in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Ob Gott die sexuelle Verfehlung der Frauen entschuldigt
  choice: Die Frauen werden nicht gesondert bestraft, während die Männer selbst an derselben sexuellen und kultischen Verderbnis beteiligt sind.
  alternative: Der Satz könnte als uneingeschränkte Weigerung verstanden werden, die Frauen zu bestrafen.
  rationale: Der mit כִּי eingeleitete Begründungssatz belastet ausdrücklich die Männer. Die Übersetzung bewahrt diese Spannung, ohne zu behaupten, Gott erkläre das Verhalten der Frauen für schuldlos.
- issue: Bedeutung von קְדֵשׁוֹת
  choice: Kultprostituierte
  alternative: Tempelprostituierte; geweihte Frauen
  rationale: „Kultprostituierte“ erhält sowohl den kultischen als auch den sexuellen Zusammenhang, legt aber keine bestimmte institutionelle Tempelpraxis fest, die der Ausdruck allein nicht sicher beweist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur unterscheidet Prostitution und Ehebruch. „Die Männer selbst“ macht den durch das maskuline Pronomen und den Kontrast angezeigten Bezug verständlich. Der seltene Schlussausdruck wird im Haupttext idiomatisch und in der Fußnote mit seiner lexikalischen Unsicherheit wiedergegeben.
