base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/019.yaml
  text: The wind has wrapped her in its wings[a], and they will be put to shame because of their sacrifices.
translation:
  language: de
  text: Der Wind hat sie in seine Flügel gehüllt[a], und wegen ihrer Schlachtopfer werden sie beschämt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Geist hat sie in seinen Flügeln gebunden.“ Das hebräische Wort רוּחַ kann „Wind“, „Atem“ oder „Geist“ bedeuten; das Verb kann „binden“, „umschließen“ oder „einhüllen“ heißen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַר
  choice: hat … gehüllt
  rationale: Das Verb bezeichnet ein Binden, Umschließen oder Einwickeln. Zusammen mit dem Bild der Flügel gibt „in seine Flügel gehüllt“ die poetische Metapher im Deutschen natürlich wieder; das Perfekt bildet die abgeschlossene Handlung mit fortwirkender Folge ab.
- source_word: רוּחַ
  choice: der Wind
  rationale: רוּחַ kann „Wind“, „Atem“ oder „Geist“ bedeuten. Das Bild von Flügeln und drohendem Gericht spricht hier am ehesten für „Wind“, ohne dessen konkrete Bedeutung als Exil, Unheil oder Gericht festzulegen.
- source_word: אוֹתָהּ
  choice: sie
  rationale: Das feminine Singularobjekt verweist auf die im Zusammenhang weiblich personifizierte Gemeinschaft Israel beziehungsweise Ephraim.
- source_word: בִּכְנָפֶיהָ
  choice: in seine Flügel
  rationale: Die Präposition wird räumlich mit „in“ wiedergegeben und bewahrt so das Bild des vom Wind Eingehülltseins. Das feminine hebräische Suffix bezieht sich grammatisch auf רוּחַ; wegen des maskulinen deutschen Wortes „Wind“ steht idiomatisch „seine“.
- source_word: וְיֵבֹשׁוּ
  choice: und … werden sie zuschanden
  rationale: בוש bezeichnet Scham, Beschämung oder Entehrung. „Zuschanden werden“ erhält den Gerichtston und die resultative Bedeutung.
- source_word: מִזִּבְחוֹתָם
  choice: wegen ihrer Schlachtopfer
  rationale: Die Präposition מִן wird hier kausal verstanden. „Schlachtopfer“ gibt זֶבַח präziser wieder als das allgemeinere „Opfer“ und lässt im Kontext den Bezug auf den untreuen Kult erkennen, ohne ihn im Vers ausdrücklich zu ergänzen.
theological_decisions:
- issue: Bezug und Bild des Gerichts
  choice: Israel beziehungsweise Ephraim wird als weiblich personifizierte Gemeinschaft von einem zerstörerischen Wind erfasst und wegen der dargebrachten Schlachtopfer beschämt.
  alternative: Der Wind kann allgemeiner für Exil oder Unheil stehen; רוּחַ kann außerdem als „Geist“ verstanden werden.
  rationale: Der unmittelbare Zusammenhang handelt von kultischer Untreue und der daraus folgenden Schande. Die Übersetzung bewahrt das poetische Bild und legt nicht fest, ob der Wind im Einzelnen Exil, göttliches Gericht oder sonstiges Unheil bezeichnet.
- issue: Wechsel von Singular zu Plural
  choice: Das feminine Singularpronomen „sie“ und das anschließende plurale „sie“ bleiben erhalten.
  alternative: Beide Formen könnten zur sprachlichen Glättung vereinheitlicht werden.
  rationale: Der Wechsel im Hebräischen lässt die personifizierte Gemeinschaft und ihre Glieder zugleich hervortreten. Eine Vereinheitlichung würde diese echte Spannung verdecken.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst poetischem Bild. „Zuschanden werden“ ist leicht gehoben, aber allgemein verständlich und dem Gerichtston angemessen. Der unvermittelte Wechsel vom femininen Singular zur Mehrzahl folgt dem hebräischen Text.
