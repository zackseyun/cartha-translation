  text: אַ֥ךְ אִ֛ישׁ אַל יָרֵ֖ב וְ/אַל יוֹכַ֣ח אִ֑ישׁ וְ/עַמְּ/ךָ֖ כִּ/מְרִיבֵ֥י כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/004.yaml
  text: Yet let no man contend[a], and let no man reprove[b], for your people are like those who contend with a priest.
translation:
  language: de
  text: Doch niemand soll streiten, und niemand soll zurechtweisen[a]; denn dein Volk ist wie Menschen, die mit einem Priester streiten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tadeln“ beziehungsweise „zur Rechenschaft ziehen“; das hebräische Verb kann Zurechtweisung, Tadel oder eine argumentative Auseinandersetzung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der Vergleich kann daran erinnern, wie schwer es nach dem Gesetz wog, sich dem Urteil eines Priesters zu widersetzen; vergleiche 5. Mose 17,12.
    reason: cross_reference
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel markiert hier einen scharfen adversativen beziehungsweise einschränkenden Übergang; „Doch“ gibt diesen Wechsel im modernen Deutschen knapp und natürlich wieder.
- source_word: אִישׁ ... אִישׁ
  choice: niemand ... niemand
  rationale: Das generisch gebrauchte singularische אִישׁ steht jeweils unter der Verneinung אַל. „Niemand“ bildet diese allgemeine Aussage idiomatisch ab, ohne sie auf männliche Personen einzuschränken.
- source_word: אַל יָרֵב
  choice: niemand soll streiten
  rationale: ריב kann persönliches Streiten, Anfechten oder einen Rechtsstreit bezeichnen. „Streiten“ bewahrt die breite Bedeutung und lässt den möglichen rechtlichen Unterton offen.
- source_word: וְאַל יוֹכַח אִישׁ
  choice: und niemand soll einen anderen zurechtweisen
  rationale: יכח im Hifil kann zurechtweisen, tadeln oder argumentativ zur Verantwortung ziehen bedeuten. Das ergänzte „einen anderen“ macht den im Hebräischen nicht ausgedrückten Gegenstand im Deutschen idiomatisch verständlich, ohne ihn näher festzulegen.
- source_word: וְעַמְּךָ
  choice: denn dein Volk
  rationale: 'Das וְ wird im Zusammenhang am besten erklärend verstanden: Die folgende Aussage begründet, weshalb niemand mit dem Volk streiten oder es zurechtweisen soll.'
- source_word: כִּמְרִיבֵי כֹהֵן
  choice: ist wie Menschen, die mit einem Priester streiten
  rationale: Die Formulierung erhält den ausdrücklichen Vergleich und wiederholt „streiten“, sodass die Wortverbindung zu ריב im ersten Satzteil sichtbar bleibt. „Ein Priester“ gibt den wahrscheinlich generischen Singular wieder.
theological_decisions:
- issue: Bedeutung des Vergleichs mit Menschen, die mit einem Priester streiten
  choice: Der Haupttext lässt den Vergleich als Bild hartnäckiger Auflehnung gegen Zurechtweisung stehen.
  alternative: Die Aussage kann gezielt auf den Widerstand gegen priesterliche Rechtsprechung nach 5. Mose 17,12 anspielen.
  rationale: Der hebräische Wortlaut enthält eindeutig einen Vergleich, bestimmt aber nicht ausdrücklich, ob eine konkrete deuteronomische Rechtsvorschrift vorausgesetzt ist. Daher wird die mögliche Anspielung nur in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzform und die Wiederholung von „streiten“ spiegeln die hebräische Struktur; der rechtliche Beiklang bleibt möglich, wird aber nicht in den Haupttext hineingedeutet.
