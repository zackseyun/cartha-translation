id: HOS.4.1
reference: Hosea 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם יוֹשְׁבֵ֣י הָ/אָ֔רֶץ כִּ֠י אֵין אֱמֶ֧ת וְֽ/אֵין חֶ֛סֶד וְ/אֵֽין דַּ֥עַת אֱלֹהִ֖ים בָּ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/001.yaml
  text: Hear the word of Yahweh[a], sons of Israel, for Yahweh has a case against the inhabitants of the land, because there is no truth, no faithfulness[d][c][b], and no knowledge of God in the land.
translation:
  language: de
  text: 'Hört das Wort Jahwes, ihr Söhne Israels[a]! Denn Jahwe führt einen Rechtsstreit[b] mit den Bewohnern des Landes[c]: Es gibt keine Treue, keine Güte[d] und keine Erkenntnis Gottes im Land.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Kinder Israels“. Wörtlich: „Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Jahwe hat eine Rechtssache gegen die Bewohner“ oder „Jahwe liegt im Streit mit den Bewohnern“.'
    reason: lexical_alternative
  - marker: c
    text: „Land“ meint hier wahrscheinlich das Land Israel; das hebräische Wort kann auch „Erde“ bedeuten.
    reason: lexical_alternative
  - marker: d
    text: Das hebräische Wort kann auch „beständige Liebe“, „Loyalität“, „Bundestreue“ oder „Barmherzigkeit“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Pluralimperativ wird als feierlicher prophetischer Aufruf knapp und unmittelbar wiedergegeben.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Formel bleibt formal erkennbar; der Gottesname wird als Jahwe wiedergegeben.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ihr Söhne Israels
  rationale: Die wörtliche nationale Anrede bleibt im Haupttext erhalten; eine geläufigere Alternative steht in der Fußnote.
- source_word: רִיב
  choice: führt einen Rechtsstreit
  rationale: Das Wort bezeichnet hier eine rechtliche beziehungsweise anklagende Auseinandersetzung; die Verbfügung klingt im Deutschen natürlicher als eine nominale Besitzkonstruktion.
- source_word: עִם יוֹשְׁבֵי הָאָרֶץ
  choice: mit den Bewohnern des Landes
  rationale: Mit „Rechtsstreit führen mit“ lässt sich עִם formal und idiomatisch wiedergeben; die gegnerische Beziehung ergibt sich aus dem Rechtskontext.
- source_word: אֱמֶת
  choice: Treue
  rationale: אֱמֶת kann Wahrheit, Verlässlichkeit und Treue bezeichnen. Im ethischen Anklagekontext bezeichnet „Treue“ plausibel verlässliches Verhalten, ohne die Bedeutungsbreite zu leugnen.
- source_word: חֶסֶד
  choice: Güte
  rationale: „Güte“ ist knapp, natürlich und lässt die Bedeutungsbreite von loyaler Liebe, Verbundenheit und Barmherzigkeit offen; die Alternativen werden in einer Fußnote genannt.
- source_word: דַּעַת אֱלֹהִים
  choice: Erkenntnis Gottes
  rationale: „Erkenntnis“ wahrt den relationalen und ethischen Gehalt des hebräischen Ausdrucks besser als bloßes Faktenwissen.
- source_word: הָאָרֶץ / בָּאָרֶץ
  choice: das Land / im Land
  rationale: Im Kontext Hoseas ist wahrscheinlich das Land Israel gemeint; „Land“ bewahrt jedoch die im Ausdruck selbst vorhandene Kürze.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
- issue: Bedeutung von חֶסֶד
  choice: Güte
  alternative: Bundestreue; beständige Liebe; Loyalität; Barmherzigkeit
  rationale: Der Kontext kann Bundesloyalität nahelegen, doch das hebräische Wort benennt diesen Aspekt nicht ausschließlich. Die Haupttextfassung vermeidet deshalb eine interpretierende Einengung.
- issue: Bedeutung von אֱמֶת
  choice: Treue
  alternative: Wahrheit; Verlässlichkeit
  rationale: In der Reihe fehlender sozialer und religiöser Haltungen ist „Treue“ idiomatisch und kontextuell stark; die lexikalische Mehrdeutigkeit wird in der Fußnote bewahrt.
- issue: Reichweite von הָאָרֶץ
  choice: Land
  alternative: Erde
  rationale: Die Anrede Israels und der Bundesanklage-Kontext sprechen für das Land Israel, während die allgemeinere lexikalische Möglichkeit als Fußnote erhalten bleibt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit prophetischem Nachdruck. Der Rechtscharakter der Anklage wird deutlich gemacht, während die semantische Spannung bei אֱמֶת und חֶסֶד durch Haupttext und Fußnoten bewahrt bleibt.
