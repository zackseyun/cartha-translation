  verdict: approve
  source_fidelity: Die Übersetzung gibt die schwierige Eröffnung סָר סָבְאָם angemessen als Ende eines Trinkgelages wieder und dokumentiert die wichtigen lexikalischen Alternativen. Die Intensivierung in הַזְנֵה הִזְנוּ wird mit „ganz“ sinnvoll abgebildet. „Ihre Schilde“ bewahrt die Metapher von מָגִנֶּיהָ, ohne deren wahrscheinlich politischen Bezug im Haupttext festzulegen. Die schwierige Schlussfügung wird nicht übermäßig sicher behandelt.
  naturalness: „Ist ihr Trinkgelage vorbei, geben sie sich ganz der Prostitution hin“ ist modernes, verständliches und dem prophetischen Register angemessenes Deutsch. Auch „ihre Schilde lieben die Schande innig“ ist trotz der absichtlich befremdlichen Metapher grammatisch und stilistisch tragfähig.
  terminology: „Prostitution“ erhält die konkrete sexuelle Bildsprache Hoseas, ohne sie zu einer bloß abstrakten Untreue aufzulösen. „Schilde“ ist als quellennahe Metapher korrekt beibehalten; die Fußnote erläutert die mögliche Bedeutung als Herrscher oder Beschützer. Die Fußnoten zu den beiden textlich besonders unsicheren Stellen sind sachlich und ausreichend vorsichtig formuliert.
