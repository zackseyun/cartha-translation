source:
  edition: WLC
  text: סָ֖ר סָבְאָ֑/ם הַזְנֵ֣ה הִזְנ֔וּ אָהֲב֥וּ הֵב֛וּ קָל֖וֹן מָגִנֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/018.yaml
  text: When their drink is gone[a], they give themselves to prostitution[c][b]; her shields dearly love shame.
translation:
  language: de
  text: Ist ihr Trinkgelage vorbei[a], geben sie sich ganz der Prostitution hin; ihre Schilde[b] lieben die Schande innig[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ist ihr Getränk sauer geworden“ beziehungsweise „Ist ihr Rausch vorüber“. Der hebräische Anfang ist schwierig und kann sich auf das Ende eines Trinkgelages oder auf verdorbenes Getränk beziehen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „ihre Schilde“; wahrscheinlich ein Bild für ihre Herrscher oder Beschützer.
    reason: lexical_alternative
  - marker: c
    text: 'Die hebräische Wortfolge ist schwierig. Möglich ist auch die wörtlichere Auffassung: „Sie lieben: ‚Gebt Schande!‘“'
    reason: alternative_reading
lexical_decisions:
- source_word: סָר סָבְאָם
  choice: Ist ihr Trinkgelage vorbei
  rationale: סור bedeutet wörtlich „weichen, sich entfernen“; סָבְאָם bezeichnet ihr Trinken beziehungsweise ihren Rausch. Die Wiedergabe beschreibt natürlich das Ende eines Trinkgelages, ohne die schwierige Wendung endgültig festzulegen.
- source_word: הַזְנֵה הִזְנוּ
  choice: geben sie sich ganz der Prostitution hin
  rationale: Der absolute Infinitiv mit dem finiten Verb verstärkt die Aussage. „Ganz“ gibt diese Intensivierung wieder; „Prostitution“ bewahrt Hoseas bewusst konkrete Bildsprache für sexuelle und zugleich bundbrüchige Untreue.
- source_word: אָהֲבוּ הֵבוּ קָלוֹן
  choice: lieben die Schande innig
  rationale: אָהֲבוּ bedeutet „sie lieben“, קָלוֹן „Schande“. Das schwierige הֵבוּ wird hier als verstärkendes Element verstanden; die abweichende, formal naheliegende Deutung „Gebt!“ steht in der Fußnote.
- source_word: מָגִנֶּיהָ
  choice: ihre Schilde
  rationale: Die wörtliche Metapher bleibt im Haupttext erhalten. Gemeint sind wahrscheinlich die Herrscher oder Beschützer des Landes beziehungsweise Israels.
theological_decisions:
- issue: Soll Hoseas Prostitutionsbild zu einer abstrakten Aussage über Untreue abgeschwächt werden?
  choice: Die konkrete Sprache der Prostitution bleibt erhalten.
  alternative: „Sie sind völlig untreu.“
  rationale: Hosea verbindet bewusst sexuelle Untreue und Israels Bundesbruch. Eine abstrakte Wiedergabe würde die prophetische Bildkraft und ihre theologische Spannung vorzeitig auflösen.
- issue: Soll מָגִנֶּיהָ im Haupttext als „Herrscher“ gedeutet werden?
  choice: Die wörtliche Metapher „ihre Schilde“ bleibt stehen.
  alternative: „ihre Herrscher“ oder „ihre Beschützer“
  rationale: Das Bild kann Herrscher, führende Männer oder Beschützer bezeichnen. Die wörtliche Übersetzung mit erklärender Fußnote bewahrt die Mehrdeutigkeit.
- issue: Wie ist das schwierige הֵבוּ in der Schlusszeile zu verstehen?
  choice: 'Als Verstärkung von „lieben“: „innig“.'
  alternative: 'Als Aufforderung: „Sie lieben: ‚Gebt Schande!‘“'
  rationale: Der hebräische Wortlaut ist unsicher und in seiner überlieferten Form schwer verständlich. Die Hauptfassung folgt einer idiomatischen Deutung, während die formal mögliche Aufforderung ausdrücklich dokumentiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Trinkgelage“ und „Prostitution“ sind allgemein verständlich und bewahren die scharfe prophetische Bildsprache. Die ungewöhnliche Metapher „ihre Schilde“ bleibt aus Gründen der Quellennähe stehen und wird erläutert.
