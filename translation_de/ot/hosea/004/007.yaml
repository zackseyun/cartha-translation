  text: כְּ/רֻבָּ֖/ם כֵּ֣ן חָֽטְאוּ לִ֑/י כְּבוֹדָ֖/ם בְּ/קָל֥וֹן אָמִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/007.yaml
  text: The more they increased[a], the more they sinned against me[b]; I will change their glory into disgrace.
translation:
  language: de
  text: Je zahlreicher sie wurden[a], desto mehr sündigten sie gegen mich. Ihre Ehre werde ich in Schande verwandeln.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Als sie sich vermehrten, sündigten sie entsprechend gegen mich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Ihre Ehre werde ich gegen Schande eintauschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֻבָּם ... כֵּן
  choice: Je zahlreicher sie wurden ... desto mehr
  rationale: Die korrelative Konstruktion wird mit der natürlichen deutschen Entsprechung „je ... desto ...“ wiedergegeben. Sie drückt aus, dass ihre Sünde in dem Maß zunahm, in dem ihre Zahl beziehungsweise Größe zunahm.
- source_word: חָטְאוּ לִי
  choice: sündigten sie gegen mich
  rationale: חטא mit ל bezeichnet hier eine gegen Gott gerichtete Sünde. „Gegen mich sündigen“ ist im Deutschen klar und idiomatisch.
- source_word: כְּבוֹדָם
  choice: ihre Ehre
  rationale: כָּבוֹד kann Herrlichkeit, Ehre oder Ansehen bezeichnen. „Ehre“ erhält die bewusste Gegenüberstellung zur Schande, ohne den nicht ausdrücklich genannten Bezug näher festzulegen.
- source_word: בְּקָלוֹן
  choice: in Schande
  rationale: קָלוֹן bezeichnet Schande oder Entehrung. Mit „verwandeln“ gibt „in Schande“ den Übergang in den gegenteiligen Zustand natürlich wieder.
- source_word: אָמִיר
  choice: werde ich ... verwandeln
  rationale: Die Form bedeutet hier „ändern, eintauschen, verwandeln“. „Verwandeln“ drückt den Umschlag von Ehre in Schande in natürlichem Deutsch aus; die alternative Auffassung als Austausch bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Bezug von „ihre Ehre“
  choice: Die mehrdeutige Formulierung „ihre Ehre“ bleibt ohne Ausdeutung stehen.
  alternative: Ihre priesterliche Würde, ihr Wohlstand beziehungsweise Ansehen oder Gott selbst als ihre Herrlichkeit.
  rationale: Der hebräische Text bestimmt den Bezug nicht eindeutig. Eine nähere Festlegung würde eine mögliche Auslegung in den Haupttext eintragen.
- issue: Nuance von אָמִיר
  choice: Als Verwandlung ihrer Ehre in Schande wiedergegeben.
  alternative: „Ihre Ehre werde ich gegen Schande eintauschen.“
  rationale: Beide Nuancen sind lexikalisch möglich. Der Haupttext verwendet die im Deutschen flüssigere Wendung, während die Austausch-Nuance in einer Fußnote bewahrt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die korrelative Satzform bildet den hebräischen Zusammenhang knapp und verständlich ab. „Ehre“ und „Schande“ bewahren den pointierten Gegensatz; die nicht näher bestimmte Bedeutung von „ihre Ehre“ bleibt offen.
