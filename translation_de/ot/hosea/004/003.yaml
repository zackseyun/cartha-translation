source:
  edition: WLC
  text: עַל כֵּ֣ן תֶּאֱבַ֣ל הָ/אָ֗רֶץ וְ/אֻמְלַל֙ כָּל יוֹשֵׁ֣ב בָּ֔/הּ בְּ/חַיַּ֥ת הַ/שָּׂדֶ֖ה וּ/בְ/ע֣וֹף הַ/שָּׁמָ֑יִם וְ/גַם דְּגֵ֥י הַ/יָּ֖ם יֵאָסֵֽפוּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/003.yaml
  text: Therefore the land mourns[a], and everyone who dwells in it languishes, along with the beasts of the field and the birds of the heavens[b]; even the fish of the sea are taken away.
translation:
  language: de
  text: Darum trauert das Land[a], und alle, die darin wohnen, verkümmern, zusammen mit den Tieren des Feldes und den Vögeln des Himmels; selbst die Fische des Meeres werden weggenommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Erde“. Das hebräische Wort kann sowohl das Land als auch die Erde bezeichnen; im unmittelbaren Zusammenhang ist wahrscheinlich das Land Israel gemeint.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „werden gesammelt“; auch: „werden weggenommen“ oder „werden weggerafft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱבַל
  choice: trauert
  rationale: Das Verb bezeichnet gewöhnlich Trauer oder Klage. Mit dem Land als Subjekt bleibt die beabsichtigte Personifikation erhalten.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im unmittelbaren Zusammenhang des Gerichtsworts gegen Israel ist das Land Israel am wahrscheinlichsten; „die Erde“ bleibt lexikalisch möglich und wird in der Fußnote genannt.
- source_word: וְאֻמְלַל
  choice: welken dahin
  rationale: Das Verb beschreibt Schwachwerden, Hinschwinden oder Welken. Die Formulierung ist im Deutschen verständlich und bewahrt das Bild des fortschreitenden Verfalls.
- source_word: כָּל יוֹשֵׁב בָּהּ
  choice: alle, die darin wohnen
  rationale: Der singularische Partizipialausdruck mit כָּל hat kollektiven Sinn; die deutsche Wiedergabe drückt die umfassende Bedeutung natürlich aus.
- source_word: בְּחַיַּת הַשָּׂדֶה
  choice: samt den Tieren des Feldes
  rationale: Die Präposition verbindet das Schicksal der Bewohner mit dem der Tiere. „Tiere des Feldes“ ist quellennah, würdig und verständlich.
- source_word: וּבְעוֹף הַשָּׁמָיִם
  choice: und den Vögeln des Himmels
  rationale: Die Wiedergabe erhält die traditionelle räumliche Dreiteilung von Feld, Himmel und Meer sowie den gehobenen Ton.
- source_word: וְגַם
  choice: selbst
  rationale: Die Partikel steigert die Aussage; „selbst“ bringt den überraschenden, klimaktischen Einschluss der Fische zum Ausdruck.
- source_word: דְּגֵי הַיָּם
  choice: die Fische im Meer
  rationale: Dies gibt den einfachen lexikalischen Sinn idiomatisch wieder und vervollständigt die Aufzählung von Landtieren, Vögeln und Fischen.
- source_word: יֵאָסֵפוּ
  choice: werden weggerafft
  rationale: Der Nifal von אסף kann „gesammelt“ beziehungsweise „weggenommen“ bedeuten. Im Gerichtskontext bezeichnet er die Beseitigung oder das Verschwinden; „weggerafft“ vermittelt dies natürlich, ohne eine konkrete Ursache festzulegen.
theological_decisions:
- issue: Reichweite von הָאָרֶץ
  choice: das Land
  alternative: die Erde
  rationale: Das Wort steht in einem Gerichtswort gegen Israel, weshalb der Bezug auf dessen Land näherliegt. Da das Hebräische auch „Erde“ bedeuten kann, bleibt diese echte Mehrdeutigkeit in einer Fußnote sichtbar.
- issue: Art der Wegnahme der Fische
  choice: werden weggerafft
  alternative: werden gesammelt / werden weggenommen
  rationale: Der Gerichtskontext legt eine verhängnisvolle Beseitigung nahe, ohne ihren Mechanismus ausdrücklich zu benennen. Die Übersetzung wahrt diese Unbestimmtheit und vermeidet die Festlegung auf eine besondere Form des Sterbens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Bildsprache. Die Personifikation des trauernden Landes und die Steigerung bis zu den Fischen bleiben erhalten; altertümliche oder konfessionell geprägte Formulierungen werden vermieden.
