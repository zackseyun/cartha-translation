id: HOS.4.15
reference: Hosea 4:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם זֹנֶ֤ה אַתָּה֙ יִשְׂרָאֵ֔ל אַל יֶאְשַׁ֖ם יְהוּדָ֑ה וְ/אַל תָּבֹ֣אוּ הַ/גִּלְגָּ֗ל וְ/אַֽל תַּעֲלוּ֙ בֵּ֣ית אָ֔וֶן וְ/אַל תִּשָּׁבְע֖וּ חַי יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/015.yaml
  text: Though you prostitute yourself[a], Israel, let not Judah become guilty. And do not go to Gilgal, and do not go up to Beth-aven, and do not swear, ‘As Yahweh lives.’
translation:
  language: de
  text: 'Auch wenn du dich prostituierst, Israel, soll Juda nicht schuldig werden. Geht nicht nach Gilgal, zieht nicht hinauf nach Bet-Awen[a] und schwört nicht: »So wahr Jahwe lebt!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-Awen bedeutet etwa »Haus des Unrechts« oder »Haus des Frevels« und ist wahrscheinlich ein polemischer Name für Bethel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Auch wenn
  rationale: אִם kann eine Bedingung oder, wie hier im Zusammenhang naheliegend, eine Einräumung einleiten. »Auch wenn« gibt den konzessiven Sinn natürlich wieder, ohne Israels Verhalten als bloß hypothetisch erscheinen zu lassen.
- source_word: זֹנֶה
  choice: dich prostituierst
  rationale: Das Partizip von זנה bezeichnet im prophetischen Sprachgebrauch Israels Untreue mit einer bewusst anstößigen sexuellen Metapher. Die direkte Wiedergabe bewahrt diese rhetorische Schärfe.
- source_word: אַל יֶאְשַׁם
  choice: soll ... nicht schuldig werden
  rationale: אשם im Qal kann das Schuldigwerden beziehungsweise das Auf-sich-Laden von Schuld bezeichnen. Die Formulierung gibt den warnenden Jussiv wieder.
- source_word: תָּבֹאוּ הַגִּלְגָּל
  choice: Geht nicht nach Gilgal
  rationale: בוא bezeichnet hier die Bewegung zu einem Ort; »nach Gilgal gehen« ist im Deutschen idiomatisch.
- source_word: תַּעֲלוּ
  choice: zieht nicht hinauf
  rationale: עלה bedeutet wörtlich »hinaufgehen/hinaufziehen«. »Hinaufziehen« bewahrt die räumliche und möglicherweise kultische Färbung.
- source_word: בֵּית אָוֶן
  choice: Bet-Awen
  rationale: Der polemische Ortsname wird transliteriert, statt stillschweigend durch Bethel ersetzt zu werden. Seine Bedeutung wird in der Fußnote erläutert.
- source_word: תִּשָּׁבְעוּ
  choice: schwört nicht
  rationale: Der Niphal von שבע bezeichnet hier das Ablegen eines Eides. »Schwören« ist knapp und idiomatisch.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt!
  rationale: Dies ist eine feste hebräische Schwurformel. Die deutsche Wendung gibt ihre Funktion natürlich wieder und erhält den Gottesnamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Sexuelle Metapher für Israels Bundesuntreue
  choice: »dich prostituierst«
  alternative: »untreu wirst« / »Hurerei treibst«
  rationale: Die ausdrückliche sexuelle Metapher gehört zur prophetischen Anklage und soll nicht zu einer allgemeinen Aussage über Untreue abgeschwächt oder durch eine zusätzliche theologische Deutung ersetzt werden.
- issue: Bedingter oder einräumender Sinn von אִם
  choice: »Auch wenn«
  alternative: »Wenn«
  rationale: Im Zusammenhang wird Israels Abfall als bestehende Wirklichkeit vorausgesetzt; deshalb ist die einräumende Lesart wahrscheinlich. Die im Hebräischen grundsätzlich mögliche bedingte Nuance bleibt als Übersetzungsalternative bestehen.
- issue: Polemischer Name בֵּית אָוֶן
  choice: »Bet-Awen« mit Erläuterung
  alternative: »Haus des Unrechts« / »Bethel«
  rationale: Die Umschreibung Bethels als Bet-Awen ist Teil der prophetischen Polemik. Die Transliteration bewahrt den Ortsnamen, während die Fußnote seine wertende Bedeutung sichtbar macht.
- issue: Gottesname in der Schwurformel
  choice: »Jahwe«
  alternative: »der HERR«
  rationale: Der hebräische Text enthält den Eigennamen יהוה. Seine Wiedergabe als »Jahwe« erhält den persönlichen Bundesnamen in der Eidesformel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel von der singularischen Anrede Israels zu den pluralischen Verboten an Juda wird grammatisch sichtbar gehalten. Die drastische prophetische Metapher bleibt ausdrücklich stehen; der Schwur wird in geläufiger deutscher Form wiedergegeben.
