reference: Hosea 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נִדְמ֥וּ עַמִּ֖/י מִ/בְּלִ֣י הַ/דָּ֑עַת כִּֽי אַתָּ֞ה הַ/דַּ֣עַת מָאַ֗סְתָּ וְ/אֶמְאָֽסְא/ךָ֙ מִ/כַּהֵ֣ן לִ֔/י וַ/תִּשְׁכַּח֙ תּוֹרַ֣ת אֱלֹהֶ֔י/ךָ אֶשְׁכַּ֥ח בָּנֶ֖י/ךָ גַּם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/006.yaml
  text: My people are destroyed for lack of knowledge[a]. Because you have rejected knowledge, I also reject you from being priest to me. Since you have forgotten the law of your God[c][b], I also will forget your children.
translation:
  language: de
  text: Mein Volk geht zugrunde, weil es an Erkenntnis fehlt.[a] Weil du die Erkenntnis verworfen hast, verwerfe auch ich dich, sodass du mir nicht mehr als Priester dienst. Du hast die Weisung deines Gottes vergessen;[b] so werde auch ich deine Kinder vergessen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird vernichtet“, „verstummt“ oder „wird abgeschnitten“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort Tora kann auch mit „Gesetz“ oder „Unterweisung“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: 'Oder enger: „deine Söhne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְמוּ
  choice: geht zugrunde
  rationale: Das Nifal von דמה bezeichnet hier im Gerichtszusammenhang Untergang bzw. Vernichtung. Die präsentische Wiedergabe gibt den resultativen Charakter der prophetischen Feststellung natürlich wieder.
- source_word: מִבְּלִי הַדָּעַת
  choice: weil es an Erkenntnis fehlt
  rationale: Die Wendung bezeichnet einen Mangel. Diese deutsche Formulierung ist klar und bewahrt den ursächlichen Zusammenhang.
- source_word: הַדָּעַת / הַדַּעַת
  choice: Erkenntnis / die Erkenntnis
  rationale: „Erkenntnis“ wahrt den kognitiven wie auch den beziehungs- und bundesorientierten Bedeutungsumfang, ohne ausdrücklich „Gotteserkenntnis“ in den Text einzutragen.
- source_word: מָאַסְתָּ
  choice: du ... verworfen hast
  rationale: מאס drückt entschiedene Zurückweisung aus; „verwerfen“ bewahrt die Stärke und ermöglicht die rhetorische Entsprechung im folgenden Gotteswort.
- source_word: וְאֶמְאָסְאֲךָ
  choice: verwerfe auch ich dich
  rationale: 'Die Wiedergabe erhält die spiegelbildliche Gerichtsformel: Der Angeredete verwirft die Erkenntnis, deshalb verwirft Gott ihn.'
- source_word: מִכַּהֵן לִי
  choice: sodass du mir nicht mehr als Priester dienst
  rationale: Die Konstruktion mit מן und כהן bezeichnet den Ausschluss vom Priesterdienst. Die Formulierung ist im modernen Deutsch natürlicher als „davon, mir Priester zu sein“.
- source_word: וַתִּשְׁכַּח
  choice: du hast ... vergessen
  rationale: Das Perfekt stellt die vergangene Handlung mit fortdauernder Schuld fest. „Vergessen“ wahrt zudem die Wortentsprechung zur angekündigten Reaktion Gottes.
- source_word: תּוֹרַת אֱלֹהֶיךָ
  choice: die Weisung deines Gottes
  rationale: תורה umfasst göttliche Unterweisung und nicht nur gesetzliche Vorschriften. „Weisung“ gibt diesen weiteren Sinn im Deutschen treffend wieder.
- source_word: אֶשְׁכַּח
  choice: werde auch ich ... vergessen
  rationale: Die futurische Gerichtsankündigung und die rhetorische Spiegelung des menschlichen Vergessens bleiben erhalten.
- source_word: בָּנֶיךָ
  choice: deine Kinder
  rationale: Der maskuline Plural kann Nachkommen beider Geschlechter bezeichnen. „Kinder“ gibt den wahrscheinlich generischen Umfang wieder; „Söhne“ bleibt als engere Möglichkeit in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von „Erkenntnis“ in Hoseas Bundesanklage
  choice: Im Haupttext steht nur „Erkenntnis“.
  alternative: „Erkenntnis Gottes“
  rationale: Der Kontext verleiht dem Begriff eine religiöse und bundesorientierte Dimension, doch der unmittelbare hebräische Wortlaut ergänzt „Gottes“ nicht.
- issue: Bezug der Anrede in der zweiten Person Singular
  choice: Die singularische Anrede bleibt erhalten und wird durch den Priesterdienst konkretisiert.
  alternative: Ausdrückliche Deutung als kollektive Anrede an ganz Israel oder an die gesamte Priesterschaft
  rationale: מִכַּהֵן לִי weist deutlich auf einen priesterlichen Adressaten oder Repräsentanten, legt dessen genaue Identität jedoch nicht abschließend fest.
- issue: Wiedergabe von בָּנֶיךָ
  choice: „deine Kinder“
  alternative: „deine Söhne“
  rationale: Der hebräische maskuline Plural kann generisch für Nachkommen stehen. Die Übersetzung wahrt den wahrscheinlichen Umfang, während die engere Lesart in einer Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholungen „Erkenntnis“, „verwerfen“ und „vergessen“ bewahren die rhetorischen Entsprechungen des Hebräischen. Die Anrede bleibt im Singular; die genaue Identität des priesterlichen Adressaten wird nicht über den Wortlaut hinaus festgelegt.
