id: HOS.4.17
reference: Hosea 4:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חֲב֧וּר עֲצַבִּ֛ים אֶפְרָ֖יִם הַֽנַּֽח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/017.yaml
  text: Ephraim is joined to idols[a]; leave him alone.
translation:
  language: de
  text: Ephraim ist mit Götzen verbunden[a]; lass ihn in Ruhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ephraim ist an Götzen gebunden; lass ihn gewähren.“ Das Hebräische ist knapp; die abschließende Aufforderung kann bedeuten, Ephraim seinem selbst gewählten Götzendienst zu überlassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבוּר
  choice: ist ... verbunden
  rationale: Das passive Partizip von חבר bezeichnet ein Verbundensein oder Gebundensein. „Ist mit … verbunden“ wahrt den Beziehungssinn und lässt die genaue Art dieser Bindung offen.
- source_word: עֲצַבִּים
  choice: Götzen
  rationale: Das Substantiv kann Bildwerke bezeichnen, meint in der prophetischen Polemik jedoch häufig Götzen als Gegenstände falscher Verehrung.
- source_word: אֶפְרָיִם
  choice: Ephraim
  rationale: Der Eigenname wird beibehalten. Obwohl Ephraim hier wahrscheinlich stellvertretend für das Nordreich steht, wird diese Deutung nicht in den Haupttext eingetragen.
- source_word: הַנַּח
  choice: lass ... in Ruhe
  rationale: Der Imperativ bedeutet hier, jemanden sein zu lassen beziehungsweise nicht weiter auf ihn einzuwirken. Die Formulierung ist im modernen Deutschen natürlich und gibt die abrupte Aufforderung wieder.
- source_word: לוֹ
  choice: ihn
  rationale: Das Suffix ist maskulin Singular und verweist am naheliegendsten auf das personifizierte Ephraim.
theological_decisions:
- issue: Bezug von Ephraim
  choice: Ephraim bleibt als ausdrücklich genanntes und personifiziertes Subjekt stehen.
  alternative: Ephraim als Bezeichnung für das Nordreich beziehungsweise Israel auszuschreiben.
  rationale: Der Eigenname erhält die prophetische Rhetorik und vermeidet, die wahrscheinliche metonymische Bedeutung zur einzigen ausdrücklichen Lesart zu machen.
- issue: Aussagekraft des abschließenden Imperativs
  choice: 'Die Aufforderung richtet sich an einen nicht genannten Adressaten: Er soll Ephraim in Ruhe lassen.'
  alternative: „Lass ihn gewähren“ oder eine Aufforderung, sich von Ephraim fernzuhalten.
  rationale: Die knappe hebräische Syntax lässt den Adressaten unausgesprochen. Die gewählte Fassung gibt die naheliegende Aufforderung zur Nicht-Einmischung wieder, während die mögliche Preisgabe an den selbst gewählten Götzendienst in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Zweigliedrigkeit und der abrupte Imperativ des Hebräischen bleiben erhalten; die Fußnote bewahrt die lexikalische und pragmatische Mehrdeutigkeit.
