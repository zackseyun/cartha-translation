review_pass:
  verdict: approve
  source_fidelity: „Ephraim ist mit Götzen verbunden; lass ihn in Ruhe“ gibt die elliptische hebräische Aussage sachgerecht wieder. חֲבוּר bezeichnet das Verbunden- bzw. Gebundensein, עֲצַבִּים sind im Kontext treffend als „Götzen“ wiedergegeben, und der abschließende Imperativ הַנַּח־לוֹ wird idiomatisch als Aufforderung zur Nicht-Einmischung übertragen.
  naturalness: Die Formulierung ist klares, modernes Standarddeutsch und bewahrt die knappe, scharf abgesetzte Zweiteilung des hebräischen Satzes. „Lass ihn in Ruhe“ ist natürlich und für den abrupten Imperativ angemessen.
  terminology: „Ephraim“ ist korrekt als Eigenname beibehalten; „Götzen“ trifft die prophetisch-polemische Bedeutung von עֲצַבִּים. Die Fußnote dokumentiert angemessen die mögliche Nuance von „gebunden“ sowie die pragmatische Deutung des Schlussimperativs, ohne die Mehrdeutigkeit im Haupttext unzulässig aufzulösen.
