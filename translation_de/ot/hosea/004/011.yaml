  text: זְנ֛וּת וְ/יַ֥יִן וְ/תִיר֖וֹשׁ יִֽקַּֽח לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/011.yaml
  text: Sexual immorality[a], wine, and new wine take away the heart.
translation:
  language: de
  text: Unzucht, Wein und neuer Wein rauben den Verstand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nehmen das Herz“; „Herz“ kann im Hebräischen auch Einsicht und Urteilsvermögen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְנוּת
  choice: Unzucht
  rationale: Der Begriff bezeichnet unerlaubtes sexuelles Verhalten und kann bei Hosea zugleich an Prostitution und Bundestreuebruch anklingen. „Unzucht“ ist knapp, würdevoll und lässt diese breitere moralische Bedeutung offen.
- source_word: יַיִן
  choice: Wein
  rationale: Die übliche Entsprechung für Wein; der Kontext erfordert keine abweichende Wiedergabe.
- source_word: תִירוֹשׁ
  choice: neuer Wein
  rationale: Bewahrt die hebräische Unterscheidung gegenüber יַיִן und bezeichnet frischen beziehungsweise neuen Wein.
- source_word: יִקַּח
  choice: rauben
  rationale: Das Verb bedeutet grundsätzlich „nehmen“. In Verbindung mit לֵב beschreibt es hier den Entzug der inneren Einsichts- und Urteilsfähigkeit; „rauben“ gibt diese Wirkung natürlich und prägnant wieder.
- source_word: לֵב
  choice: Verstand
  rationale: לֵב („Herz“) umfasst im biblischen Hebräisch auch Denken, Einsicht und Urteilsvermögen. Im deutschen Ausdruck „den Verstand rauben“ wird die idiomatische Aussage verständlich wiedergegeben; die wörtliche Bildsprache bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Ob לֵב konkret als „Herz“ oder sinngemäß als Einsichts- und Urteilsvermögen wiederzugeben ist
  choice: Im Haupttext steht idiomatisch „den Verstand rauben“.
  alternative: 'Wörtlich: „das Herz wegnehmen“ beziehungsweise „das Herz nehmen“.'
  rationale: Modernes Deutsch versteht „Herz“ meist vor allem emotional, während das hebräische לֵב hier die innere Einsichts- und Urteilsfähigkeit einschließt. Die sinngemäße Wiedergabe vermittelt die Aussage klar, ohne eine technische anthropologische oder konfessionelle Festlegung vorzunehmen; die konkrete hebräische Formulierung wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die Aufzählung und der warnende Spruchcharakter des Hebräischen bleiben erhalten. Der Singular des hebräischen Verbs nach der mehrgliedrigen Aufzählung wird im Deutschen regelgerecht durch den Plural „rauben“ wiedergegeben.
