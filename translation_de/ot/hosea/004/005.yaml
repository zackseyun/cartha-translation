- from: Du wirst am Tag straucheln, und auch der Prophet[a] wird in der Nacht mit dir straucheln. Ich werde deine Mutter[b] vernichten.[c]
  to: Du wirst bei Tag straucheln, und auch der Prophet[a] wird bei Nacht mit dir straucheln; ich werde deine Mutter[b] vernichten[c].
  rationale: Die Revision verbessert die idiomatische Parallelität von Tages- und Nachtangabe und bewahrt zugleich die hebräische Verknüpfung der Gerichtsaussagen. Die Wiederholung von „straucheln“, die singularische Anrede, die unbestimmte Alternative zu „der Prophet“ und die absichtlich nicht aufgelöste Muttermetapher bleiben erhalten. Die Fußnoten sind unmittelbar an ihren Bezugswörtern verankert.
