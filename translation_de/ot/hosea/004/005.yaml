  text: וְ/כָשַׁלְתָּ֣ הַ/יּ֔וֹם וְ/כָשַׁ֧ל גַּם נָבִ֛יא עִמְּ/ךָ֖ לָ֑יְלָה וְ/דָמִ֖יתִי אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/005.yaml
  text: You will stumble by day[a], and the prophet also will stumble with you by night[c][b]; and I will destroy your mother.
translation:
  language: de
  text: Du wirst bei Tag straucheln, und auch der Prophet[a] wird bei Nacht mit dir straucheln; ich werde deine Mutter[b] vernichten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auch ein Prophet«.'
    reason: lexical_alternative
  - marker: b
    text: Mit »deine Mutter« ist wahrscheinlich bildlich das Volk, die Nation oder die Bundesgemeinschaft gemeint.
    reason: cultural_note
  - marker: c
    text: 'Oder: »zum Schweigen bringen« oder »abschneiden«; das hebräische Verb kann in einem Gerichtszusammenhang verwandte Bedeutungen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשַׁלְתָּ
  choice: Du wirst straucheln
  rationale: Das Qal Perfekt 2. Person Maskulin Singular steht hier in einer prophetischen Gerichtsankündigung und wird daher zukunftsbezogen wiedergegeben. »Straucheln« bewahrt das Bild, ohne es vorschnell als endgültigen Untergang auszulegen.
- source_word: הַיּוֹם
  choice: am Tag
  rationale: Der Gegensatz zu לָיְלָה zeigt, dass die Tageszeit und nicht »heute« gemeint ist.
- source_word: וְכָשַׁל
  choice: wird straucheln
  rationale: Dasselbe Verb wie im ersten Satzteil wird zur Wahrung der Wiederholung gleich übersetzt und ebenfalls zukunftsbezogen verstanden.
- source_word: גַּם נָבִיא
  choice: auch der Prophet
  rationale: גַּם fügt den Propheten ausdrücklich hinzu. Obwohl נָבִיא keinen Artikel trägt, kann die bestimmte Form im Deutschen einen bekannten oder repräsentativen Propheten bezeichnen; die unbestimmte Wiedergabe bleibt in einer Fußnote erhalten.
- source_word: עִמְּךָ
  choice: mit dir
  rationale: Direkte Wiedergabe der Präposition עם mit maskulinem Singularsuffix; die singularische Anrede bleibt erhalten.
- source_word: לָיְלָה
  choice: in der Nacht
  rationale: Natürliche deutsche Wiedergabe des zeitlichen Gegenstücks zu »am Tag«.
- source_word: וְדָמִיתִי
  choice: Ich werde vernichten
  rationale: Das Verb דמה bezeichnet im Gerichtszusammenhang wahrscheinlich das Zugrunderichten. Die verwandten möglichen Bedeutungen »zum Schweigen bringen« und »abschneiden« werden in einer Fußnote genannt.
- source_word: אִמֶּךָ
  choice: deine Mutter
  rationale: Die wörtliche familiäre Metapher bleibt erhalten, statt sie im Haupttext ausdrücklich auf Israel, das Volk oder die Bundesgemeinschaft festzulegen.
theological_decisions:
- issue: Bezug von »deine Mutter«
  choice: Die Metapher wird im Haupttext unverändert als »deine Mutter« wiedergegeben.
  alternative: Ausdrückliche Deutung als Israel, das Volk, die Nation, das Land oder die Mutterstadt.
  rationale: Hoseas familiäre Bildsprache soll samt ihrer Mehrdeutigkeit und theologischen Spannung bewahrt werden; eine wahrscheinliche Deutung wird nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die Wiederholung von »straucheln« bildet die hebräische Wiederholung ab; die Tag-Nacht-Gegenüberstellung und die Muttermetapher bleiben sichtbar.
