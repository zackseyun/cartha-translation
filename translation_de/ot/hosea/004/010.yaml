  source_fidelity: Die Übersetzung gibt die prophetisch-folgernde Aussage angemessen futurisch wieder. „nicht satt werden“ entspricht יִשְׂבָּעוּ; „Hurerei treiben“ wahrt bei הִזְנוּ sowohl den konkreten sexuellen als auch den bei Hosea mitschwingenden bundesmetaphorischen Gehalt. „sich nicht vermehren“ ist für יִפְרֹצוּ im Kontext der ausbleibenden Nachkommenschaft beziehungsweise Bevölkerungszunahme gut begründet. Das schwierige Schlussglied עָזְבוּ ... לִשְׁמֹר wird mit „sie haben aufgehört, auf Jahwe zu achten“ als mögliche, idiomatische Auslegung der elliptischen Konstruktion wiedergegeben, ohne ein ausdrücklich fehlendes Objekt wie „Gesetz“ einzutragen.
