source:
  edition: WLC
  text: וְ/אָֽכְלוּ֙ וְ/לֹ֣א יִשְׂבָּ֔עוּ הִזְנ֖וּ וְ/לֹ֣א יִפְרֹ֑צוּ כִּֽי אֶת יְהוָ֥ה עָזְב֖וּ לִ/שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/010.yaml
  text: They will eat[a], but not be satisfied; they will commit sexual immorality, but not increase, because they have abandoned Yahweh[c][b], to cherish prostitution.
translation:
  language: de
  text: Sie werden essen, aber nicht satt werden; sie werden Hurerei treiben[a], sich aber nicht vermehren[b]. Denn sie haben aufgehört, auf Jahwe zu achten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann konkrete Prostitution oder allgemeiner unerlaubte Sexualität bezeichnen. Bei Hosea klingt häufig auch die Untreue gegenüber dem Bund mit.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „nicht hervorbrechen“ oder „sich nicht ausbreiten“; gemeint ist hier wahrscheinlich, dass sie durch Nachkommen nicht zahlreicher werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Satz ist sehr knapp. Möglich ist auch die wörtlichere Wiedergabe: „Denn Jahwe haben sie verlassen – zu bewahren.“ Manche beziehen „bewahren“ auf das Beachten Jahwes oder seiner Weisung; andere verbinden die Wendung mit dem folgenden Vers.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: Sie werden essen
  rationale: Das Qal-Perfekt mit vorangestelltem ו steht im Zusammenhang einer prophetischen Gerichtsankündigung und wird daher als angekündigte Folge futurisch wiedergegeben.
- source_word: וְלֹא יִשְׂבָּעוּ
  choice: aber nicht satt werden
  rationale: שׂבע bezeichnet das Sattwerden nach dem Essen; die Formulierung ist natürlich und bewahrt das Motiv unerfüllten Verlangens.
- source_word: הִזְנוּ
  choice: sie werden Hurerei treiben
  rationale: זנה kann konkrete Prostitution beziehungsweise unerlaubte Sexualität bezeichnen und trägt bei Hosea zugleich häufig den Beiklang der Untreue gegenüber dem Bund. „Hurerei treiben“ lässt beide Ebenen offen.
- source_word: וְלֹא יִפְרֹצוּ
  choice: sich aber nicht vermehren
  rationale: פרץ bedeutet wörtlich „hervorbrechen“ oder „sich ausbreiten“; nach der vorangehenden sexuellen Aussage liegt hier eine Zunahme durch Nachkommen oder Bevölkerungswachstum nahe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: עָזְבוּ לִשְׁמֹר
  choice: sie haben aufgehört, ... zu achten
  rationale: עָזַב mit folgendem Infinitiv kann das Aufgeben beziehungsweise Unterlassen einer Handlung ausdrücken. Diese Wiedergabe ergibt aus der knappen hebräischen Konstruktion einen natürlichen deutschen Satz, ohne ein nicht genanntes Objekt wie „sein Gesetz“ einzufügen.
- source_word: אֶת יְהוָה ... לִשְׁמֹר
  choice: auf Jahwe zu achten
  rationale: שׁמר umfasst achtsames Beachten, Bewahren und Befolgen. „Auf Jahwe achten“ bewahrt die persönliche Ausrichtung, ohne den Sinn auf ein ausdrücklich nicht genanntes Gesetz oder Gebot zu verengen.
theological_decisions:
- issue: Bedeutung von זנה in Hoseas Anklage
  choice: „Hurerei treiben“ mit offenbleibendem wörtlichem und bundesmetaphorischem Sinn
  alternative: „sexuelle Unmoral begehen“ oder ausdrücklich „Götzendienst treiben“
  rationale: Der Zusammenhang mit ausbleibender Vermehrung stützt einen konkreten sexuellen Sinn; Hoseas Sprachgebrauch lässt zugleich die theologische Ebene der Bundesuntreue mitschwingen. Die Übersetzung entscheidet nicht unnötig zwischen beiden Ebenen.
- issue: Bezug und Funktion von לִשְׁמֹר
  choice: עָזְבוּ לִשְׁמֹר als „sie haben aufgehört, auf Jahwe zu achten“ verstanden
  alternative: „sie haben Jahwe verlassen, um zu bewahren“ oder Verbindung mit „Hurerei“ aus dem folgenden Vers
  rationale: Der masoretische Vers schließt mit לִשְׁמֹר und ist syntaktisch knapp. Die gewählte Lesart folgt einer möglichen Konstruktion von עזב mit Infinitiv im Sinn von „aufhören, etwas zu tun“ und vermeidet sowohl eine Konjektur als auch die Vorwegnahme eines Substantivs aus Vers 11.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. „Hurerei“ ist bewusst bildkräftiger als „sexuelle Unmoral“, damit Hoseas konkrete und metaphorische Sprache nicht eingeebnet wird. Die Satzstruktur bleibt knapp, wird im schwierigen Schlussglied aber für heutige Leser idiomatisch entfaltet.
