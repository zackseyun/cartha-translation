  terminology: „Jahwe“ gibt den Gottesnamen konsistent als Eigenname wieder. „Hurerei treiben“ ist als theologisch und semantisch offene Wiedergabe von זנה geeignet; die Fußnote erläutert die mögliche konkrete und metaphorische Dimension ohne sie dogmatisch festzulegen. Die Fußnotenanker stehen jeweils unmittelbar an der erläuterten Aussage.
