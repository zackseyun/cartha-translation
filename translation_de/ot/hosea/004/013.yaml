  terminology: „Gipfeln der Berge“, „Schlachtopfer“, „Terebinthe“, „Schwiegertöchter“ und „Ehebruch“ sind terminologisch angemessen. Die Fußnoten erläutern die lexikalische Bandbreite von קטר, die unsichere botanische Zuordnung und die zugleich konkrete und bei Hosea bildhaft anschlussfähige sexuelle Sprache, ohne eine theologische Deutung aufzuzwingen. Die Fußnotenanker stehen jeweils bei den betreffenden Textelementen.
