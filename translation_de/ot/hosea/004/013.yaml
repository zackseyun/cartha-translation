source:
  edition: WLC
  text: עַל רָאשֵׁ֨י הֶ/הָרִ֜ים יְזַבֵּ֗חוּ וְ/עַל הַ/גְּבָעוֹת֙ יְקַטֵּ֔רוּ תַּ֣חַת אַלּ֧וֹן וְ/לִבְנֶ֛ה וְ/אֵלָ֖ה כִּ֣י ט֣וֹב צִלָּ֑/הּ עַל כֵּ֗ן תִּזְנֶ֨ינָה֙ בְּנ֣וֹתֵי/כֶ֔ם וְ/כַלּוֹתֵי/כֶ֖ם תְּנָאַֽפְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/013.yaml
  text: On the tops of the mountains they sacrifice[a], and on the hills they burn incense, under oak and poplar and terebinth, because their shade is good. Therefore your daughters prostitute themselves[c][b], and your daughters-in-law commit adultery.
translation:
  language: de
  text: Auf den Gipfeln der Berge bringen sie Schlachtopfer dar, und auf den Hügeln lassen sie Opfer in Rauch aufgehen[a], unter Eiche, Pappel und Terebinthe[b], denn ihr Schatten ist angenehm. Darum treiben eure Töchter Hurerei[c], und eure Schwiegertöchter begehen Ehebruch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verbrennen sie Räucherwerk“. Das hebräische Verb kann speziell das Verbrennen von Räucherwerk oder allgemeiner das In-Rauch-Aufgehenlassen von Opfergaben bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Baumnamen werden traditionell als Eiche, Pappel und Terebinthe bestimmt; ihre genauen botanischen Entsprechungen sind nicht völlig sicher.
    reason: cultural_note
  - marker: c
    text: Hosea gebraucht sexuelle Untreue häufig auch als Bild für die Untreue gegenüber dem Bund; hier bezeichnet der Wortlaut zugleich konkrete sexuelle Verfehlung.
    reason: cross_reference
lexical_decisions:
- source_word: רָאשֵׁי הֶהָרִים
  choice: auf den Gipfeln der Berge
  rationale: Das wörtliche „Köpfe der Berge“ bezeichnet idiomatisch ihre Gipfel; die erhöhte Lage der Kultstätten bleibt deutlich.
- source_word: יְזַבֵּחוּ
  choice: bringen sie Schlachtopfer dar
  rationale: Das Piel von זבח bezeichnet das Schlachten beziehungsweise Darbringen von Opfern. „Schlachtopfer darbringen“ macht den kultischen Sinn präzise deutlich.
- source_word: יְקַטֵּרוּ
  choice: lassen sie Opfer in Rauch aufgehen
  rationale: Das Verb kann das Verbrennen von Räucherwerk oder allgemeiner das In-Rauch-Aufgehenlassen von Opfergaben bezeichnen. Die Formulierung bewahrt diese Bedeutungsbreite.
- source_word: תַּחַת אַלּוֹן וְלִבְנֶה וְאֵלָה
  choice: unter Eiche, Pappel und Terebinthe
  rationale: Die singularischen Baumnamen werden generisch wiedergegeben. Die traditionellen Bestimmungen sind verständlich, ohne ihre botanische Unsicherheit zu verschweigen.
- source_word: כִּי טוֹב צִלָּהּ
  choice: denn ihr Schatten ist angenehm
  rationale: טוֹב beschreibt hier die günstige, einladende Qualität des Schattens. Das feminine Singularsuffix kann sich kollektiv auf den Baumbestand oder auf den zuletzt genannten Baum beziehen; „ihr“ lässt den Bezug offen.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die knappe Folgerungsformel erhält den im Hebräischen gesetzten Zusammenhang zwischen dem Kultgeschehen und dem folgenden Verhalten.
- source_word: תִּזְנֶינָה
  choice: treiben ... Hurerei
  rationale: זנה bezeichnet sexuelle Untreue beziehungsweise Prostitution und kann bei Hosea zugleich bildhaft auf Bundesuntreue weisen. „Hurerei treiben“ bewahrt die Schärfe und die mögliche Bilddimension, ohne ausschließlich kommerzielle Prostitution zu behaupten.
- source_word: בְּנוֹתֵיכֶם
  choice: eure Töchter
  rationale: Direkte und natürliche Wiedergabe des Verwandtschaftsbegriffs.
- source_word: וְכַלּוֹתֵיכֶם
  choice: eure Schwiegertöchter
  rationale: כַּלָּה kann „Braut“ oder „Schwiegertochter“ bedeuten; parallel zu „eure Töchter“ bezeichnet es hier am natürlichsten die Schwiegertöchter.
- source_word: תְּנָאַפְנָה
  choice: begehen Ehebruch
  rationale: נאף bezeichnet spezifisch Ehebruch und wird daher vom breiteren זנה im vorhergehenden Satzglied unterschieden.
theological_decisions:
- issue: Wörtliche sexuelle Verfehlung oder Bild für geistliche Untreue
  choice: Die Hauptübersetzung benennt konkrete sexuelle Verfehlungen; eine Fußnote weist zugleich auf Hoseas Bildsprache für Bundesuntreue hin.
  alternative: Die Aussagen ausschließlich metaphorisch als Götzendienst beziehungsweise geistliche Prostitution wiederzugeben.
  rationale: Töchter und Schwiegertöchter sowie die beiden konkreten Sexualverben legen in diesem Vers einen wörtlichen sozialen und moralischen Bezug nahe. Hoseas weitergehende Bildsprache bleibt dennoch wirksam und darf nicht ausgeschlossen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Satzführung. „Schlachtopfer darbringen“ und „in Rauch aufgehen lassen“ sind kultisch präzise, aber verständlich. „Hurerei treiben“ ist bewusst kräftig und etwas bibelsprachlich, ohne archaische Formen zu verwenden; es erhält die Spannung zwischen konkreter sexueller Verfehlung und prophetischer Bildsprache.
