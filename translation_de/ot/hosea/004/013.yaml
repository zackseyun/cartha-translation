  verdict: approve
  source_fidelity: 'Die Übersetzung bildet die hebräische Syntax und die wesentlichen lexikalischen Unterscheidungen zuverlässig ab: Opfer schlachten/darbringen (זבח), Opfer in Rauch aufgehen lassen (קטר), die Höhen und Hügel, die drei Baumbezeichnungen sowie die Folgerung עַל־כֵּן. „lassen sie Opfer in Rauch aufgehen“ bewahrt bei יְקַטֵּרוּ sachgerecht die im Kontext bestehende Offenheit zwischen Räucherwerk und dem Verbrennen von Opfergaben. Die Unterscheidung zwischen זנה und נאף bleibt mit „Hurerei treiben“ bzw. „Ehebruch begehen“ erkennbar. Die feminine Singularform in „ihr Schatten“ kann, wie im Hebräischen, auf den genannten Baumbestand kollektiv oder auf einen repräsentativen Einzelbaum bezogen werden.'
