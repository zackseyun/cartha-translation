source:
  edition: WLC
  text: כִּ֚י כְּ/פָרָ֣ה סֹֽרֵרָ֔ה סָרַ֖ר יִשְׂרָאֵ֑ל עַתָּה֙ יִרְעֵ֣/ם יְהוָ֔ה כְּ/כֶ֖בֶשׂ בַּ/מֶּרְחָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/016.yaml
  text: For Israel is as stubborn as a stubborn heifer[a]; now Yahweh will pasture them like a lamb in a broad place.
translation:
  language: de
  text: Denn Israel ist widerspenstig wie eine widerspenstige Kuh. Nun wird Jahwe sie wie ein Lamm auf weitem Raum weiden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild kann eine freie, weite Weide meinen, aber auch die schutzlose Ausgesetztheit eines Lammes in offenem Gelände. Der hebräische Wortlaut lässt diese Spannung bestehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung zum vorausgehenden Vorwurf und Gerichtswort ein.
- source_word: כְּפָרָה סֹרֵרָה סָרַר
  choice: wie eine widerspenstige Kuh hat sich … widersetzt
  rationale: Die Formulierung erhält das eindrückliche Viehbild und bildet die Wiederholung der hebräischen Wurzel סרר durch die verwandten deutschen Ausdrücke „widerspenstig“ und „sich widersetzen“ nach. פָרָה bezeichnet eine Kuh; ein bestimmtes junges Alter ist hier nicht ausdrücklich markiert.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Übliche deutsche Form des Eigennamens.
- source_word: עַתָּה
  choice: Nun
  rationale: Kennzeichnet den anschließenden Zustand beziehungsweise die Folge; „nun“ ist im würdevollen deutschen Erzählstil natürlich.
- source_word: יִרְעֵם
  choice: wird … sie … weiden
  rationale: רעה bedeutet weiden, hüten oder Nahrung geben. „Weiden“ hält das Vieh- und Weidebild aufrecht, ohne die mögliche Ironie vorschnell als fürsorgliche Führung aufzulösen. Das plurale Objektsuffix wird mit „sie“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְּכֶבֶשׂ
  choice: wie ein Lamm
  rationale: כֶּבֶשׂ bezeichnet ein Schaf, häufig ein junges Schaf; „Lamm“ bewahrt das Bild eines einzelnen, möglicherweise schutzlosen Tieres.
- source_word: בַּמֶּרְחָב
  choice: auf weitem Raum
  rationale: מֶרְחָב bezeichnet einen weiten oder geräumigen Ort. Die Formulierung lässt offen, ob eine freie Weidefläche oder eine schutzlose Weite gemeint ist.
theological_decisions:
- issue: Ton des letzten Satzes
  choice: Als Aussage formuliert, deren Bild sowohl Versorgung als auch ironische oder gerichtliche Preisgabe zulässt
  alternative: 'Jahwe weidet Israel fürsorglich auf freier Weide; oder: Israel wird wie ein schutzloses Lamm der Weite preisgegeben'
  rationale: Der hebräische Wortlaut nennt das Weiden und den weiten Raum, bestimmt aber nicht ausdrücklich, ob das Bild positiv oder ironisch-gerichtlich verstanden werden soll. Die Übersetzung und die Fußnote bewahren diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von סרר wird durch „widerspenstig“ und „sich widersetzen“ hörbar gemacht; die knappe Bildsprache und ihre Deutungsoffenheit bleiben erhalten.
