  text: אָלֹ֣ה וְ/כַחֵ֔שׁ וְ/רָצֹ֥חַ וְ/גָנֹ֖ב וְ/נָאֹ֑ף פָּרָ֕צוּ וְ/דָמִ֥ים בְּ/דָמִ֖ים נָגָֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/002.yaml
  text: Cursing[a], lying, murder, theft, and adultery break out[b]; bloodshed follows bloodshed.
translation:
  language: de
  text: Fluchen[a], Lügen, Morden, Stehlen und Ehebrechen greifen um sich; eine Bluttat folgt auf die andere.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Fluchen“ kann in diesem Zusammenhang auch Eidbruch oder falsches Schwören bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Bluttaten berühren Bluttaten“; das heißt, eine Bluttat reiht sich unmittelbar an die nächste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלֹה
  choice: Fluchen
  rationale: Die Form bezeichnet hier das Aussprechen eines Fluchs beziehungsweise möglicherweise falsches Schwören. „Fluchen“ ist in der knappen Lasterreihe natürlich; die im Kontext mögliche Bedeutung des Eidbruchs wird in der Fußnote bewahrt.
- source_word: כַחֵשׁ
  choice: Lügen
  rationale: Das Verb bedeutet lügen oder sich treulos beziehungsweise falsch verhalten. „Lügen“ passt prägnant zur Reihung substantivierter Infinitive.
- source_word: רָצֹחַ
  choice: Morden
  rationale: רצח bezeichnet gewöhnlich unrechtmäßiges Töten. „Morden“ erhält diese moralische Bestimmtheit und die verbale Parallelität der Reihe.
- source_word: גָנֹב
  choice: Stehlen
  rationale: Die substantivierte Infinitivform wird mit „Stehlen“ wiedergegeben, um die parallele Gestalt der Lasterreihe im Deutschen zu erhalten.
- source_word: נָאֹף
  choice: Ehebrechen
  rationale: Das Verb bezeichnet ausdrücklich Ehebruch. „Ehebrechen“ ist kompakt, verständlich und parallel zu den übrigen substantivierten Verben.
- source_word: פָּרָצוּ
  choice: greifen um sich
  rationale: Das Verb vermittelt ein Durchbrechen oder Hervorbrechen. Im Zusammenhang beschreibt es, dass die aufgezählten Vergehen sich ungehindert ausbreiten; „greifen um sich“ ist natürliches modernes Deutsch, ohne das im Hebräischen nicht genannte Objekt „alle Grenzen“ hinzuzufügen.
- source_word: דָמִים
  choice: Bluttat
  rationale: Der Plural „Blut“ bezeichnet hier konkrete Akte des Blutvergießens. „Bluttat“ gibt die gewaltsamen Einzelereignisse wieder und ermöglicht die idiomatische Folgeformulierung.
- source_word: דָמִים בְּדָמִים נָגָעוּ
  choice: eine Bluttat folgt auf die andere
  rationale: Wörtlich berühren „Bluttaten“ einander. Gemeint ist eine lückenlose Folge blutiger Gewalttaten; die deutsche Wendung macht diesen Sinn klar, während die wörtliche Bildsprache in der Fußnote dokumentiert wird.
theological_decisions:
- issue: Bedeutungsumfang von אָלֹה im Kontext der Bundesanklage
  choice: Fluchen
  alternative: Eidbruch / falsches Schwören
  rationale: Der Ausdruck kann Fluchen oder eine Verfehlung im Bereich des Schwörens bezeichnen. Der Haupttext wahrt die knappe Lasterreihe, während die Fußnote die bundestheologisch relevante Alternative offenhält, ohne sie festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fünf Vergehen stehen als parallele substantivierte Infinitive. „Greifen um sich“ vermittelt das Bild des ungehinderten Hervorbrechens; die Schlusswendung ist idiomatisch, während die markante hebräische Formulierung in der Fußnote erhalten bleibt.
