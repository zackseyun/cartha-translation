  text: עַמִּ/י֙ בְּ/עֵצ֣/וֹ יִשְׁאָ֔ל וּ/מַקְל֖/וֹ יַגִּ֣יד ל֑/וֹ כִּ֣י ר֤וּחַ זְנוּנִים֙ הִתְעָ֔ה וַ/יִּזְנ֖וּ מִ/תַּ֥חַת אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/012.yaml
  text: My people consult their piece of wood[a], and their staff tells them; for a spirit of whoredom has led them astray, and they have played the whore[c][b], departing from under their God.
translation:
  language: de
  text: Mein Volk befragt sein Holzstück[a], und sein Stab gibt ihm Auskunft; denn ein Geist der Hurerei[b] hat sie in die Irre geführt, und sie haben Hurerei getrieben und sich von ihrem Gott abgewandt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Holz“. Gemeint ist wahrscheinlich ein hölzerner Kultgegenstand, der zur Wahrsagung befragt wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Geist der Prostitution“ beziehungsweise, weniger bildhaft, „ein Geist der Untreue“. Das Hebräische verwendet ausdrücklich die Metapher der Hurerei.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „von unter ihrem Gott“. Die Wendung beschreibt, dass sie die Zugehörigkeit und Unterordnung unter ihren Gott verließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּי
  choice: Mein Volk
  rationale: עַם bezeichnet hier Israel als das Volk, zu dem Gott in einer Bundesbeziehung steht; das Suffix der 1. Person Singular wird mit „mein“ wiedergegeben.
- source_word: בְּעֵצוֹ
  choice: befragt sein Holzstück
  rationale: Das Hebräische lautet wörtlich „bei/an seinem Holz fragen“ und meint im Zusammenhang einen hölzernen Kultgegenstand zur Wahrsagung. „Holzstück“ bewahrt die konkrete und wohl spöttische Wirkung, ohne „Götzenbild“ interpretierend in den Haupttext einzutragen.
- source_word: יִשְׁאַל
  choice: befragt
  rationale: שׁאל bedeutet „fragen, sich erkundigen“; „befragen“ gibt im Deutschen den Vorgang der Orakelbefragung knapp und natürlich wieder.
- source_word: וּמַקְלוֹ
  choice: und sein Stab
  rationale: מַקֵּל kann „Stab“ oder „Stock“ bedeuten. „Stab“ passt zum kultischen beziehungsweise divinatorischen Zusammenhang und wahrt den Singular des hebräischen Kollektivbezugs.
- source_word: יַגִּיד לוֹ
  choice: gibt ihm Auskunft
  rationale: Die Hifil-Form von נגד bedeutet „mitteilen, kundtun“. Die Formulierung stellt natürlich und zugleich bewusst absurd dar, dass der Stab dem Volk Antwort erteilt.
- source_word: רוּחַ זְנוּנִים
  choice: ein Geist der Hurerei
  rationale: Die Wendung hält die ausdrücklich sexuelle Metapher für Israels religiöse Untreue fest. „Untreue“ allein wäre zu stark abschwächend, „Prostitution“ klänge im Deutschen enger nach gewerbsmäßiger Sexualität.
- source_word: הִתְעָה
  choice: hat es in die Irre geführt
  rationale: Das Hifil von תעה bezeichnet das Veranlassen zum Irren oder Umhergehen. Die gewählte Formulierung umfasst Verführung und Abweichen.
- source_word: וַיִּזְנוּ
  choice: sie haben sich hurend … abgewandt
  rationale: זנה greift die sexuelle Metapher des Verses als Verb erneut auf. Das Partizip „hurend“ wahrt diese Wiederholung, während „abgewandt“ zusammen mit der folgenden Präpositionalwendung die Richtung des Abfalls verständlich macht.
- source_word: מִתַּחַת אֱלֹהֵיהֶם
  choice: von ihrem Gott abgewandt
  rationale: Wörtlich steht „von unter ihrem Gott“. Gemeint ist das Verlassen der Zugehörigkeit beziehungsweise Herrschaft Gottes. Die Haupttextfassung ist natürliches Deutsch; die konkrete hebräische Wendung bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Sexuelle Metapher für Götzendienst und Bundesbruch
  choice: Die Sprache von „Hurerei“ und „hurend“ bleibt im Haupttext ausdrücklich erhalten.
  alternative: Die Metapher durch „Untreue“, „Abfall“ oder „Götzendienst“ ersetzen.
  rationale: Hosea beschreibt Israels Abkehr absichtlich mit sexuell zugespitzter Sprache. Eine bloß abstrakte Wiedergabe würde die prophetische Härte und die innere Wortverbindung von זְנוּנִים und זנה abschwächen.
- issue: Wechsel zwischen kollektivem Singular und Plural
  choice: Der grammatische Wechsel wird als „mein Volk … sein … ihm … es“ und anschließend „sie … ihrem“ nachvollzogen.
  alternative: Alle Bezüge einheitlich in den Plural setzen.
  rationale: Der hebräische Text behandelt עַמִּי zunächst als Kollektiv im Singular, wechselt bei וַיִּזְנוּ und אֱלֹהֵיהֶם jedoch in den Plural. Der im Deutschen mögliche Wechsel bewahrt dieses Merkmal, ohne einen anderen Referenten anzudeuten.
- issue: Bedeutung von מִתַּחַת אֱלֹהֵיהֶם
  choice: Im Haupttext als Abwendung von Gott wiedergeben und den Wortlaut „von unter ihrem Gott“ in einer Fußnote nennen.
  alternative: Im Haupttext streng wörtlich „von unter ihrem Gott“ schreiben.
  rationale: Die wörtliche Fassung wäre im heutigen Deutsch schwer verständlich. „Abgewandt“ vermittelt den Bruch mit Gottes Zugehörigkeit und Autorität, während die Fußnote die räumlich-hierarchische Bildsprache offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Schärfe. „Holzstück“ lässt den spöttisch-konkreten Ton erkennen; „gibt ihm Auskunft“ ist klarer als ein hölzernes „verkündet ihm“. Der Wechsel vom kollektiven Singular zum Plural folgt dem Hebräischen.
