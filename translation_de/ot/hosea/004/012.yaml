  naturalness: „Sie haben sich hurend … abgewandt“ ist im modernen Standarddeutsch deutlich weniger idiomatisch und syntaktisch unnötig schwer. „Sie haben Hurerei getrieben und sich von ihrem Gott abgewandt“ bewahrt die explizite Metapher in natürlicher, würdiger Sprache.
  terminology: „Holzstück“, „Stab“, „Geist der Hurerei“ und „in die Irre geführt“ sind geeignete Wiedergaben. Die Fußnote zu c soll den hebräischen Wortlaut präzise als „von unter ihrem Gott“ anführen, ohne den gesamten Satz fälschlich als bloßes wörtliches Zitat zu präsentieren.
