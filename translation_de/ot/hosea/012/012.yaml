source:
  edition: WLC
  text: אִם גִּלְעָ֥ד אָ֨וֶן֙ אַךְ שָׁ֣וְא הָי֔וּ בַּ/גִּלְגָּ֖ל שְׁוָרִ֣ים זִבֵּ֑חוּ גַּ֤ם מִזְבְּחוֹתָ/ם֙ כְּ/גַלִּ֔ים עַ֖ל תַּלְמֵ֥י שָׂדָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/012.yaml
  text: If Gilead is iniquity[a], they have surely become nothing; in Gilgal they sacrifice bulls; indeed[c][b], their altars are like stone heaps on the furrows of the field.
translation:
  language: de
  text: Wenn Gilead Frevel ist[a], sind sie gewiss zu Nichtigkeit geworden[b]. In Gilgal opfern sie Stiere; ja, ihre Altäre sind wie Steinhaufen auf den Furchen der Felder[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gewiss, Gilead ist Frevel.“ Die hebräische Partikel kann hier bekräftigend statt konditional verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann auch „Wertlosigkeit“, „Leere“ oder „Trug“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Das Bild kann die vielen Altäre mit Steinhaufen vergleichen, die auf den Furchen gepflügter Felder liegen.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die Partikel kann konditional oder bekräftigend gebraucht sein. „Wenn“ bewahrt zunächst die gedrängte konditionale Form; die emphatische Möglichkeit wird in Fußnote [a] genannt.
- source_word: אָוֶן
  choice: Frevel
  rationale: Das Wort bezeichnet schuldhaftes Unrecht und kann im prophetischen Zusammenhang auch götzendienerische Verfehlung anklingen lassen. „Frevel“ erhält die moralisch-religiöse Schärfe, ohne den Sinn auf Götzendienst einzuengen.
- source_word: אַךְ
  choice: gewiss
  rationale: Hier verstärkt die Partikel das folgende Urteil. „Gewiss“ gibt diese bekräftigende Funktion in würdigem, natürlichem Deutsch wieder.
- source_word: שָׁוְא
  choice: Nichtigkeit
  rationale: Das Substantiv umfasst Leere, Wertlosigkeit und bisweilen Falschheit. „Nichtigkeit“ bewahrt die abstrakte, vernichtende Aussage; weitere Nuancen stehen in Fußnote [b].
- source_word: הָיוּ
  choice: sind … geworden
  rationale: Die Kopula verbindet das Subjekt mit „Nichtigkeit“ und kann den eingetretenen Zustand bezeichnen. Das Perfekt ist im modernen Deutsch idiomatisch.
- source_word: שְׁוָרִים זִבֵּחוּ
  choice: opfern sie Stiere
  rationale: „Stiere“ passt zum kultischen Kontext; das Präsens stellt die wiederholte Opferpraxis anschaulich dar.
- source_word: גַּם
  choice: ja
  rationale: Die Partikel führt hier eine steigernde beziehungsweise bestätigende Aussage über die Altäre ein.
- source_word: כְּגַלִּים
  choice: wie Steinhaufen
  rationale: גַּל bezeichnet einen Haufen, häufig einen Steinhaufen. Die Konkretisierung macht das landwirtschaftliche Bild verständlich, ohne seine Aussage auszudeuten.
- source_word: עַל תַּלְמֵי שָׂדָי
  choice: an den Furchen des Feldes
  rationale: Die Präposition עַל kann räumlich „auf/an/entlang“ ausdrücken. „An den Furchen“ ergibt im Deutschen ein klares Bild von aufgelesenen Steinen, die am gepflügten Acker aufgehäuft liegen.
theological_decisions:
- issue: Deutung der Anfangswendung אִם גִּלְעָד אָוֶן
  choice: 'Als rhetorische Bedingung: „Wenn Gilead Frevel ist“'
  alternative: „Gewiss, Gilead ist Frevel“
  rationale: אִם kann in prophetischer Dichtung konditional oder bekräftigend verstanden werden. Der Haupttext erhält die formale Bedingung, während Fußnote [a] die bekräftigende Lesart offenhält.
- issue: Sinn von שָׁוְא als Urteil über „sie“
  choice: „zu Nichtigkeit geworden“
  alternative: „zu Trug / Wertlosigkeit geworden“
  rationale: Die Formulierung bewahrt die Spannung zwischen Leere, Wertlosigkeit und Falschheit, ohne das prophetische Urteil auf nur eine dieser Bedeutungsnuancen festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper prophetischer Syntax. Die Ortsnamen werden in ihren geläufigen deutschen Formen wiedergegeben. Die Mehrdeutigkeit der beiden Eröffnungssätze bleibt durch Haupttext und Fußnoten erhalten.
