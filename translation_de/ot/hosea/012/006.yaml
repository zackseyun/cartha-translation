  source_fidelity: 'Die Übersetzung gibt die Abfolge und Syntax des Hebräischen sachgerecht wieder: die fortführende Konjunktion, den Gottesnamen, den Titel „Gott der Heerscharen“ und die abschließende Namens-/Erinnerungsformel. „Gedenkname“ ist eine vertretbare explizierende Wiedergabe von זִכְרוֹ und wahrt den knappen, traditionssprachlichen Charakter der Formulierung.'
