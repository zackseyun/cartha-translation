source:
  edition: WLC
  text: וַֽ/יהוָ֖ה אֱלֹהֵ֣י הַ/צְּבָא֑וֹת יְהוָ֖ה זִכְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/006.yaml
  text: And Yahweh[b][a], the God of hosts—Yahweh is his memorial name.
translation:
  language: de
  text: Und Jahwe, der Gott der Heerscharen – Jahwe ist sein Gedenkname.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Jahwe ist sein Gedenken“; gemeint ist der Name, durch den er in Erinnerung bleibt oder angerufen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Und Jahwe
  rationale: Das Präfix וַ wird in Fortführung des Zusammenhangs mit „Und“ wiedergegeben. Das Tetragramm erscheint als persönlicher Name „Jahwe“.
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: der Gott der Heerscharen
  rationale: Die Apposition wird im Deutschen mit Artikel natürlich wiedergegeben. „Heerscharen“ bewahrt die Breite des etablierten göttlichen Titels besser als das engere „Heere“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der unmittelbar wiederholte Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: זִכְרוֹ
  choice: sein Gedenkname
  rationale: Das Nomen bezeichnet hier das, wodurch Gott in Erinnerung gehalten beziehungsweise angerufen wird. „Gedenkname“ macht den im Hebräischen knappen Bezug auf den Namen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt zweimal das Tetragramm. Die Transliteration wahrt den Charakter als persönlichen Gottesnamen.
- issue: Bedeutung von זִכְרוֹ
  choice: sein Gedenkname
  alternative: sein Gedenken
  rationale: Im Zusammenhang identifiziert die Wendung „Jahwe“ als den Namen, durch den Gott erinnert und angerufen wird. Die Ergänzung „-name“ verdeutlicht die hebräische Ausdrucksweise, ohne ihre theologische Spannung aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Heerscharen“ bleibt wegen seiner semantischen Breite und der festen Verbindung im Gottestitel erhalten; „Gedenkname“ ist verständlicher als das im Deutschen unnatürliche „sein Gedenken“.
