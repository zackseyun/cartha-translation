base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/010.yaml
  text: Yet I am Yahweh your God from the land of Egypt; I will again make you dwell in tents[a], as in the days of the appointed feast.
translation:
  language: de
  text: Doch ich bin Jahwe, dein Gott seit der Zeit in Ägypten. Ich werde dich wieder in Zelten wohnen lassen wie in den Tagen des Festes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie in den Tagen der festgesetzten Zeit“ beziehungsweise „des Festes“. Die Wendung kann auf das Laubhüttenfest anspielen, bei dem Israel in vorübergehenden Hütten wohnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Doch ich
  rationale: Das betonte Personalpronomen bleibt ausdrücklich wiedergegeben; „doch“ bringt den im Zusammenhang naheliegenden Gegensatz zur vorangehenden Zurechtweisung zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Direkte Wiedergabe der Bundesbezeichnung mit Suffix der zweiten Person Singular.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: vom Land Ägypten her
  rationale: Die Formulierung bewahrt den Bezug auf Ägypten und den Exodus, ohne die Präposition ausschließlich räumlich oder zeitlich festzulegen.
- source_word: עֹד
  choice: wieder
  rationale: In Verbindung mit dem folgenden Zukunftsverb bezeichnet עֹד am natürlichsten eine erneute Handlung.
- source_word: אוֹשִׁיבְךָ
  choice: ich werde dich … wohnen lassen
  rationale: Die kausative Hifil-Form von ישׁב wird im Deutschen natürlich und zugleich genau mit „wohnen lassen“ wiedergegeben.
- source_word: בָאֳהָלִים
  choice: in Zelten
  rationale: אֹהֶל bezeichnet Zelte; die Wiedergabe vermeidet es, die mögliche Festanspielung bereits durch einen traditionellen Fachausdruck festzulegen.
- source_word: כִּימֵי
  choice: wie in den Tagen
  rationale: Die Vergleichsformel wird idiomatisch und ausdrücklich wiedergegeben.
- source_word: מוֹעֵד
  choice: des Festes
  rationale: מוֹעֵד kann eine festgesetzte Zeit oder ein Fest bezeichnen. Der Zusammenhang mit dem Wohnen in Zelten macht hier die kultische Bedeutung wahrscheinlich, ohne dass im Haupttext ein bestimmtes Fest benannt wird.
theological_decisions:
- issue: Ob das erneute Wohnen in Zelten Verheißung, Drohung oder ironische Umkehrung ist
  choice: Die Aussage wird ohne wertende Zusätze wiedergegeben.
  alternative: Sie ausdrücklich als Verheißung erneuerter Exodusgemeinschaft, als Androhung von Exil und Entbehrung oder als eindeutigen Hinweis auf das Laubhüttenfest zu formulieren.
  rationale: Der hebräische Text bewertet die angekündigte Handlung nicht ausdrücklich. Die offene Spannung zwischen Wiederherstellung, Gericht und Erinnerung an Wüstenzeit beziehungsweise Fest soll bestehen bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt klar und nah am hebräischen Text; „wohnen lassen“ erhält dessen kausative Aussage. Die mögliche kultische Anspielung wird im Haupttext nicht überpräzisiert.
