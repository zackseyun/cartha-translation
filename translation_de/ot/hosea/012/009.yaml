base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/009.yaml
  text: And Ephraim said[a], “Surely I have become rich; I have found wealth for myself[c][b]. In all my labor they will not find in me iniquity that is sin.”
translation:
  language: de
  text: 'Und Efraim sagte: »Gewiss, ich bin reich geworden; ich habe mir Vermögen erworben.[a] Bei all meiner Mühe wird man bei mir kein Unrecht finden, das Sünde wäre.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ich habe für mich Vermögen gefunden«; das hebräische Wort kann auch »Kraft« oder »Stärke« bedeuten, bezeichnet hier aber wahrscheinlich materiellen Besitz.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Satz ist stark verdichtet. Auch möglich: »In all meinem Erwerb wird man bei mir keine Schuld finden, die Sünde wäre.«'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Gewiss
  rationale: Die Partikel unterstreicht Efraims selbstsichere Behauptung, ohne die ausschließende Bedeutung von »nur« einzutragen.
- source_word: עָשַׁרְתִּי
  choice: ich bin reich geworden
  rationale: Das Perfekt bezeichnet den erreichten Zustand und wird im Deutschen natürlich resultativ wiedergegeben.
- source_word: מָצָאתִי אוֹן לִי
  choice: ich habe mir Vermögen erworben
  rationale: Wörtlich steht »ich habe für mich Vermögen gefunden«. Im Handelskontext bezeichnet אוֹן wahrscheinlich materiellen Besitz; »erworben« gibt die idiomatische Bedeutung natürlich wieder.
- source_word: כָּל יְגִיעַי
  choice: bei all meiner Mühe
  rationale: יְגִיעַ kann sowohl die Mühe als auch deren Ertrag bezeichnen. Die kollektive Formulierung bewahrt den Bezug auf Efraims wirtschaftliche Tätigkeit, ohne eindeutig nur Arbeit oder Gewinn festzulegen.
- source_word: יִמְצְאוּ לִי
  choice: wird man bei mir ... finden
  rationale: Das unbestimmte Subjekt der hebräischen Pluralform wird idiomatisch mit »man« wiedergegeben; »bei mir« lässt den prüfenden beziehungsweise forensischen Unterton bestehen.
- source_word: עָוֺן אֲשֶׁר חֵטְא
  choice: Unrecht, das Sünde wäre
  rationale: Die knappe, schwierige Wortfolge wird bewusst nicht vollständig geglättet. Sie bewahrt Efraims Behauptung, bei ihm finde sich kein schuldhaftes Unrecht.
theological_decisions:
- issue: Efraims Selbstdarstellung und die prophetische Ironie
  choice: Die Aussage erscheint unverändert als selbstsichere Rechtfertigung Efraims.
  alternative: Die Rede im Haupttext ausdrücklich als Täuschung, Ausflucht oder Ironie kennzeichnen.
  rationale: Der hebräische Text zitiert Efraim direkt. Ob und wie seine Behauptung widerlegt wird, ergibt sich aus dem Zusammenhang und wird nicht erklärend in den Vers eingetragen.
- issue: Verhältnis von עָוֺן und חֵטְא
  choice: »Unrecht, das Sünde wäre« erhält die ungewöhnliche Qualifizierung.
  alternative: »Schuld, die strafbar wäre« oder »Unrecht, das als Sünde gilt«.
  rationale: Der Text lässt offen, ob Efraim zwischen Unrecht und anrechenbarer Sünde unterscheidet oder die Begriffe appositionell verbindet. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt selbstsicher und knapp; die ungewöhnliche Schlussformulierung wird wegen der Mehrdeutigkeit des Hebräischen nicht paraphrastisch aufgelöst.
