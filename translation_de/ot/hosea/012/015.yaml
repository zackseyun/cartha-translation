source:
  edition: WLC
  text: הִכְעִ֥יס אֶפְרַ֖יִם תַּמְרוּרִ֑ים וְ/דָמָי/ו֙ עָלָ֣י/ו יִטּ֔וֹשׁ וְ/חֶ֨רְפָּת֔/וֹ יָשִׁ֥יב ל֖/וֹ אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/015.yaml
  text: Ephraim has provoked bitter anger[a]; his bloodguilt will be left on him[b], and his Lord will repay him for his disgrace.
translation:
  language: de
  text: Ephraim hat bitteren Zorn hervorgerufen; seine Blutschuld wird auf ihm bleiben[a], und sein Herr wird ihm seine Schmach vergelten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Sein Blut“ oder „sein Blutvergießen wird auf ihm bleiben.“ Der hebräische Plural „Blut(taten)“ bezeichnet in rechtlichen Zusammenhängen oft Blutschuld.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Sein Herr wird ihm seine Schmach zurückgeben.“ „Herr“ kann auch „Gebieter“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִכְעִיס
  choice: hat … Zorn hervorgerufen
  rationale: Das Hifil von כעס bedeutet gewöhnlich, jemanden zum Zorn zu reizen. Die Wendung ist im Deutschen natürlich und lässt תַּמְרוּרִים die Intensität bestimmen.
- source_word: תַּמְרוּרִים
  choice: bitteren Zorn
  rationale: Der Plural bezeichnet intensive Bitterkeit und steht hier nach הִכְעִיס als Angabe der Wirkung oder Intensität. „Bitteren Zorn“ bewahrt die emotionale Schärfe.
- source_word: וְדָמָיו
  choice: seine Blutschuld
  rationale: Der wörtliche Plural „seine Blut(taten)“ bezeichnet in prophetisch-rechtlichem Zusammenhang häufig die durch Blutvergießen entstandene Schuld.
- source_word: עָלָיו יִטּוֹשׁ
  choice: wird auf ihm bleiben
  rationale: נטש beschreibt hier, dass die Blutschuld auf Ephraim belassen und nicht weggenommen wird. Die deutsche Formulierung gibt die fortdauernde Haftung wieder, ohne ein nicht ausdrücklich genanntes Subjekt festzulegen.
- source_word: וְחֶרְפָּתוֹ
  choice: seine Schmach
  rationale: חרפה umfasst Schmach, Schande und entehrenden Hohn. „Schmach“ passt zum gehobenen prophetischen Register und zur folgenden Vergeltung.
- source_word: יָשִׁיב לוֹ
  choice: wird ihm … vergelten
  rationale: Das Hifil von שוב mit ל bezeichnet hier das Zurückgeben beziehungsweise retributive Vergelten.
- source_word: אֲדֹנָיו
  choice: sein Herr
  rationale: Die morphologisch plurale Form fungiert hier als singularischer Titel. „Sein Herr“ wahrt den wahrscheinlichen Gottesbezug, ohne den im Hebräischen nicht stehenden Gottesnamen einzusetzen.
theological_decisions:
- issue: Bezug von אֲדֹנָיו
  choice: 'Göttlicher Titel mit wahrscheinlichem Bezug auf Gott: „sein Herr“'
  alternative: „sein Gebieter“ oder „sein Herr“ im nicht ausdrücklich göttlichen Sinn
  rationale: Im prophetischen Zusammenhang ist Gott derjenige, der Ephraims Schuld bestehen lässt und ihm seine Schmach vergilt. Die Übersetzung wahrt zugleich die lexikalische Offenheit des Titels und ersetzt ihn nicht durch „der HERR“.
- issue: Implizites Subjekt von יִטּוֹשׁ
  choice: 'Unpersönlich/passivnah wiedergegeben: „wird auf ihm bleiben“'
  alternative: „Er wird sie auf ihm belassen“, mit Gott als ausdrücklich ergänztem Subjekt
  rationale: Das hebräische Verb ist aktiv und hat ein implizites Subjekt, doch dessen ausdrückliche Identifizierung würde die knappe Konstruktion stärker festlegen. Die gewählte Form bewahrt den Sinn der fortbestehenden Blutschuld.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetisch-rechtlichem Ton. Die Satzstruktur bleibt knapp; ein kausales „darum“ wird nicht ergänzt. Sämtliche Fußnotenmarker stehen im Haupttext.
