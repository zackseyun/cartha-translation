  terminology: „Ephraim“, „Blutschuld“, „Schmach“ und „sein Herr“ sind terminologisch tragfähig. Insbesondere wird אֲדֹנָיו nicht unzulässig mit dem Gottesnamen ersetzt; zugleich bleibt der im Kontext naheliegende Gottesbezug erkennbar. Die Fußnoten sind an sinnvollen Stellen verankert und benennen echte lexikalische beziehungsweise titelbezogene Alternativen.
