id: HOS.12.2
reference: Hosea 12:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֶפְרַ֜יִם רֹעֶ֥ה ר֨וּחַ֙ וְ/רֹדֵ֣ף קָדִ֔ים כָּל הַ/יּ֕וֹם כָּזָ֥ב וָ/שֹׁ֖ד יַרְבֶּ֑ה וּ/בְרִית֙ עִם אַשּׁ֣וּר יִכְרֹ֔תוּ וְ/שֶׁ֖מֶן לְ/מִצְרַ֥יִם יוּבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/002.yaml
  text: Ephraim feeds on wind and pursues the east wind all day long[a]; he multiplies lies and destruction. They make a covenant with Assyria[e][d][c][b], and oil is carried to Egypt.
translation:
  language: de
  text: Ephraim nährt sich vom Wind[a] und jagt den ganzen Tag dem Ostwind nach[b]; Lüge und Verwüstung mehrt er[c]. Mit Assyrien schließen sie einen Bund[d], und Öl wird nach Ägypten gebracht[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Ephraim weidet den Wind“; das hebräische Verb kann „weiden“, „hüten“ oder „sich nähren“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Der heiße Ostwind war für seine versengende und zerstörerische Wirkung bekannt; das Bild kann sowohl Vergeblichkeit als auch drohenden Schaden ausdrücken.
    reason: cultural_note
  - marker: c
    text: Das hebräische Wort für „Verwüstung“ kann auch „Zerstörung“, „Gewalt“ oder „Raub“ bedeuten.
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „Sie schneiden einen Bund“; dies ist die übliche hebräische Wendung für das Schließen eines Bundes oder Vertrags.'
    reason: lexical_alternative
  - marker: e
    text: Das Öl wurde wahrscheinlich als Tribut oder diplomatische Zahlung nach Ägypten gesandt.
    reason: cultural_note
lexical_decisions:
- source_word: רֹעֶה רוּחַ
  choice: nährt sich vom Wind
  rationale: רעה bezeichnet das Weiden, Hüten oder Sich-Nähren. Die Formulierung bewahrt das Bild einer ebenso vergeblichen wie unergiebigen Nahrung und klingt im modernen Deutschen natürlich; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: וְרֹדֵף קָדִים
  choice: und jagt … dem Ostwind nach
  rationale: רדף bedeutet „verfolgen, nachjagen“, קדים den heißen, oft zerstörerischen Ostwind. Das konkrete prophetische Bild bleibt erhalten.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die geläufige deutsche Wendung gibt die fortdauernde Handlung klar wieder.
- source_word: כָּזָב וָשֹׁד
  choice: Lüge und Verwüstung
  rationale: כזב bezeichnet Lüge oder Falschheit; שׁד kann Verwüstung, Zerstörung, Gewalt oder Raub bezeichnen. „Verwüstung“ hält hier die zerstörerische Wirkung im Vordergrund, ohne den Ausdruck unnötig einzuengen.
- source_word: יַרְבֶּה
  choice: mehrt er
  rationale: Die Hifil-Form bedeutet „vermehren, zahlreich machen“. Das maskuline Singularpronomen nimmt das kollektiv gebrauchte „Ephraim“ auf.
- source_word: וּבְרִית עִם אַשּׁוּר יִכְרֹתוּ
  choice: Mit Assyrien schließen sie einen Bund
  rationale: כרת ברית ist die feste hebräische Wendung für das Schließen eines Bundes oder Vertrags. Der Plural „sie“ bildet den Numeruswechsel des hebräischen Textes ab.
- source_word: וְשֶׁמֶן לְמִצְרַיִם יוּבָל
  choice: und Öl wird nach Ägypten gebracht
  rationale: שמן ist Öl, wahrscheinlich Olivenöl; die passive Form von יבל wird mit „wird … gebracht“ wiedergegeben, ohne den Zweck der Sendung im Haupttext festzulegen.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der Eigenname bleibt erhalten, auch wenn er bei Hosea häufig stellvertretend für das Nordreich Israel steht.
theological_decisions:
- issue: Metaphorische Anklage gegen Ephraims Politik
  choice: Die Bilder vom Wind und Ostwind bleiben im Haupttext erhalten.
  alternative: Ephraim jagt Nichtigem und Verderblichem nach.
  rationale: Der hebräische Text deutet Ephraims vergebliche und schädliche Politik durch poetische Bilder an. Eine erklärende Paraphrase würde die Mehrdeutigkeit und prophetische Kraft vorschnell auflösen.
- issue: Wechsel vom Singular zum Plural
  choice: Zunächst steht „er“ für Ephraim, danach „sie“ beim Bundesschluss.
  alternative: Den gesamten Vers einheitlich im Singular oder im Plural formulieren.
  rationale: Der Wechsel entspricht dem hebräischen Text und kann den Übergang vom kollektiv verstandenen Ephraim zu dessen Volk oder Führung erkennen lassen, ohne ihn ausdrücklich auszudeuten.
- issue: Zweck der Ölsendung nach Ägypten
  choice: Der Haupttext nennt nur den Transport des Öls.
  alternative: Das Öl ausdrücklich als Tribut oder diplomatisches Geschenk bezeichnen.
  rationale: Ein politischer Tribut oder eine diplomatische Zahlung ist im Zusammenhang wahrscheinlich, wird vom hebräischen Satz jedoch nicht ausdrücklich bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. Die leicht markierte Wortstellung „Lüge und Verwüstung mehrt er“ hält den Anschluss an den hebräischen Satzbau und betont die beiden Anklagepunkte. Alle erklärungsbedürftigen lexikalischen und kulturellen Aspekte stehen in knappen Fußnoten.
