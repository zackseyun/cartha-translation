  text: וְ/דִבַּ֨רְתִּי֙ עַל הַ/נְּבִיאִ֔ים וְ/אָנֹכִ֖י חָז֣וֹן הִרְבֵּ֑יתִי וּ/בְ/יַ֥ד הַ/נְּבִיאִ֖ים אֲדַמֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/011.yaml
  text: I spoke through the prophets[a]; I myself multiplied visions[c][b], and through the hand of the prophets I gave parables.
translation:
  language: de
  text: Ich redete zu den Propheten[a]; ich selbst gab viele Visionen, und durch die Propheten[b] sprach ich in Gleichnissen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich redete durch die Propheten.“ Die hebräische Präposition ist hier mehrdeutig. Die spätere Wendung „durch die Hand der Propheten“ kann eine vermittelte Rede nahelegen, doch „zu den Propheten“ ist ebenfalls eine naheliegende Deutung.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „durch die Hand der Propheten“; eine hebräische Ausdrucksweise für Vermittlung oder Beauftragung.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „gebrauchte ich Vergleiche“ oder „stellte ich es in Bildern dar“. Das hebräische Verb ist an dieser Stelle schwierig und bezeichnet wahrscheinlich bildhaftes oder vergleichendes Reden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתִּי עַל הַנְּבִיאִים
  choice: Ich redete durch die Propheten
  rationale: עַל kann hier eine Anrede an die Propheten oder eine Vermittlung durch sie bezeichnen. Der Parallelismus mit וּבְיַד הַנְּבִיאִים spricht eher für die instrumentale Bedeutung, ohne die syntaktische Mehrdeutigkeit aufzuheben.
- source_word: וְאָנֹכִי
  choice: ich selbst
  rationale: Das selbstständige Pronomen אָנֹכִי hebt das bereits in den Verben enthaltene Subjekt hervor; „ich selbst“ gibt diese Betonung natürlich wieder.
- source_word: חָזוֹן הִרְבֵּיתִי
  choice: gab viele Visionen
  rationale: Der Hifil von רבה bedeutet „zahlreich machen, vermehren“. Die idiomatische deutsche Wiedergabe bewahrt Visionen als konkrete Form göttlicher Offenbarung, ohne das schwerfällige „vermehrte Visionen“ zu verwenden.
- source_word: וּבְיַד הַנְּבִיאִים
  choice: durch die Propheten
  rationale: Die hebräische Wendung „durch die Hand von“ bezeichnet häufig die handelnde oder vermittelnde Instanz. Im Haupttext wird sie natürlich deutsch wiedergegeben; die Bildsprache bleibt in einer Fußnote sichtbar.
- source_word: אֲדַמֶּה
  choice: sprach ich in Gleichnissen
  rationale: Die schwierige Piʿel-Form von דמה bezeichnet hier wahrscheinlich ein Reden oder Darstellen mittels Vergleichen beziehungsweise bildhaften Entsprechungen. „In Gleichnissen sprechen“ ist verständlich und wahrt den figurativen Charakter, ohne eine bestimmte Art von Parabel vorauszusetzen.
theological_decisions:
- issue: Art der prophetischen Offenbarung
  choice: 'Gott redet durch die Propheten in verschiedenen Formen: durch Worte, Visionen und Gleichnisse.'
  alternative: Gott redet zu den Propheten und verwendet durch sie bildhafte Darstellungen.
  rationale: Die Parallelstruktur legt prophetische Vermittlung nahe, doch die Präposition עַל lässt auch die Deutung „zu den Propheten“ zu. Diese Offenheit wird in der Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Visionen“ ist im heutigen religiösen Sprachgebrauch geläufig. Die Wiederholung von „durch die Propheten“ bildet den hebräischen Parallelismus ab; die ungewöhnlichere Wendung „durch die Hand“ wird zugunsten natürlicher Lesbarkeit in die Fußnote gesetzt.
