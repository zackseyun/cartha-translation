  text: כְּנַ֗עַן בְּ/יָד֛/וֹ מֹאזְנֵ֥י מִרְמָ֖ה לַ/עֲשֹׁ֥ק אָהֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/008.yaml
  text: A merchant—with deceptive scales in his hand—loves to oppress[a].
translation:
  language: de
  text: Ein Händler[a] hat eine falsche Waage in der Hand; er liebt es, Menschen auszubeuten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Kanaan“. Das Wort kann auch „Kanaaniter“ oder, davon abgeleitet, „Händler“ bedeuten. Wegen der falschen Waage liegt hier der Sinn „Händler“ nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַעַן
  choice: Ein Händler
  rationale: Die Form lautet wörtlich „Kanaan“, kann hier aber appellativ „Händler“ bedeuten. Die unmittelbar folgende betrügerische Waage stützt den kaufmännischen Sinn; die Mehrdeutigkeit bleibt in der Fußnote erhalten.
- source_word: בְּיָדוֹ
  choice: in der Hand
  rationale: Die konkrete Wendung wird direkt wiedergegeben und bewahrt das Bild des Händlers, der die falsche Waage bei sich hält.
- source_word: מֹאזְנֵי מִרְמָה
  choice: eine betrügerische Waage
  rationale: Der hebräische Plural bezeichnet eine Waage beziehungsweise ein Waagepaar; „betrügerisch“ gibt das substantivische „Trug/Täuschung“ natürlich und prägnant wieder.
- source_word: לַעֲשֹׁק
  choice: Menschen auszubeuten
  rationale: Das Verb umfasst unterdrücken, ausbeuten und betrügen. Im Handelskontext ist „ausbeuten“ natürlich, wahrt aber gegenüber „betrügen“ die breitere soziale und moralische Tragweite.
- source_word: אָהֵב
  choice: er liebt es
  rationale: Die Form bezeichnet eine charakteristische Neigung oder Freude am Unrecht. „Er liebt es“ erhält die starke Aussage des Hebräischen.
theological_decisions:
- issue: Ist כְּנַעַן als Eigenname oder als Bezeichnung für einen Händler zu verstehen?
  choice: 'Appellativ: „Händler“'
  alternative: Eigenname beziehungsweise Personifikation „Kanaan“ oder ethnische Bezeichnung „Kanaaniter“
  rationale: Die betrügerische Waage macht den Handelssinn im unmittelbaren Zusammenhang wahrscheinlich. Zugleich kann „Kanaan“ Ephraim rhetorisch mit Kanaan identifizieren; diese echte Mehrdeutigkeit wird deshalb in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstruktur bleibt knapp; „Menschen“ verdeutlicht das im deutschen Infinitiv sonst ungenannte Objekt, ohne die Art der Betroffenen einzuengen.
