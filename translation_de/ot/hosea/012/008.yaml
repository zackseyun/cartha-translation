  terminology: „Händler“, „Waage“ und „ausbeuten“ passen zum prophetischen Handels- und Unrechtsvokabular. Die Fußnote bewahrt die wichtige Mehrdeutigkeit von כְּנַעַן, ohne die kontextuell naheliegende Hauptlesart zu verdrängen.
