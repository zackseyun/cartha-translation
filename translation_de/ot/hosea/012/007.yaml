base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/007.yaml
  text: So you[a], by your God, return; keep steadfast love and justice[b], and wait continually for your God.
translation:
  language: de
  text: Du aber, kehre zu deinem Gott zurück[a]; halte an treuer Liebe und Recht fest und hoffe[b] stets auf deinen Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen die ungewöhnliche Wendung „durch/mit deinem Gott kehre zurück“. Die Präposition kann Mittel, Beziehung oder dem Sinn nach auch Richtung ausdrücken; daher auch: „Kehre mit deinem Gott zurück.“'
    reason: lexical_alternative
  - marker: b
    text: 'Kann auch wiedergegeben werden mit: „warte“ oder „blicke erwartungsvoll aus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהֶיךָ
  choice: durch deinen Gott
  rationale: Die Präposition ב kann hier Mittel, Beziehung oder Bereich bezeichnen. „Durch deinen Gott“ bewahrt die ungewöhnliche Konstruktion und deutet die Umkehr als von Gott ermöglicht oder in ihm begründet, ohne die mögliche Richtung „zu deinem Gott“ im Haupttext festzuschreiben.
- source_word: תָשׁוּב
  choice: kehre … zurück
  rationale: שׁוב bezeichnet grundlegend das Zurückkehren oder Umkehren. „Kehre zurück“ wahrt sowohl den konkreten als auch den bundestheologischen Sinn, ohne bereits ausdrücklich „bereue“ oder „bekehre dich“ zu sagen.
- source_word: חֶסֶד
  choice: treue Liebe
  rationale: חֶסֶד verbindet Liebe und Güte mit Verlässlichkeit und Bundestreue. „Treue Liebe“ ist verständlich und erhält diese relationale Weite besser als das engere „Barmherzigkeit“.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Im ethischen Aufruf bezeichnet מִשְׁפָּט rechtes, gerechtes Handeln, auch im sozialen und rechtlichen Bereich. „Recht“ bildet dies knapp und idiomatisch ab.
- source_word: שְׁמֹר
  choice: halte … fest
  rationale: שׁמר bedeutet bewahren, beachten oder einhalten. Bei den abstrakten Größen Liebe und Recht gibt „halte … fest“ den beharrlichen Vollzug in natürlichem Deutsch wieder.
- source_word: וְקַוֵּה
  choice: hoffe
  rationale: קוה bezeichnet erwartungsvolles Warten und Hoffen. „Hoffe“ bringt die vertrauensvolle Erwartung im heutigen Deutsch natürlicher zum Ausdruck als das bloße „warte“.
- source_word: אֶל אֱלֹהֶיךָ
  choice: auf deinen Gott
  rationale: Nach „hoffen“ ist „auf“ die natürliche deutsche Verbindung. Sie gibt die mit אֶל ausgedrückte Ausrichtung auf Gott idiomatisch wieder.
- source_word: תָּמִיד
  choice: allezeit
  rationale: תמיד bezeichnet ununterbrochene beziehungsweise fortdauernde Ausrichtung. „Allezeit“ ist würdig, verständlich und passt zu der mahnenden Aussage.
theological_decisions:
- issue: Ob der Aufruf ausdrücklich als Buße oder Bekehrung wiederzugeben ist
  choice: kehre … zurück
  alternative: bekehre dich / kehre um
  rationale: Der Zusammenhang enthält einen bundestheologischen Ruf zur Umkehr, doch das Verb שׁוב ist weiter als eine ausdrücklich formulierte Bußterminologie. „Kehre zurück“ erhält den theologischen Ernst, ohne die Aussage konfessionell oder begrifflich zu verengen.
- issue: Beziehung der Umkehr zu Gott in בֵּאלֹהֶיךָ
  choice: durch deinen Gott
  alternative: zu deinem Gott / mit deinem Gott
  rationale: Die hebräische Präposition lässt Mittel, Beziehung oder Richtung anklingen und die Konstruktion ist ungewöhnlich. Der Haupttext bewahrt mit „durch“ den möglichen instrumentalen Sinn; die Fußnote hält die anderen Deutungen offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Präpositionalkonstruktion wird im Haupttext nicht völlig geglättet; eine Fußnote dokumentiert die echte Mehrdeutigkeit. „Treue Liebe“ hält die relationale und bundesorientierte Färbung von חֶסֶד fest, während „halte … fest“ die Mahnung natürlich formuliert.
