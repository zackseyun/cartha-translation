id: HOS.12.5
reference: Hosea 12:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָ/יָּ֤שַׂר אֶל מַלְאָךְ֙ וַ/יֻּכָ֔ל בָּכָ֖ה וַ/יִּתְחַנֶּן ל֑/וֹ בֵּֽית אֵל֙ יִמְצָאֶ֔/נּוּ וְ/שָׁ֖ם יְדַבֵּ֥ר עִמָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/005.yaml
  text: He strove with the angel and prevailed[a]; he wept and sought his favor. At Bethel he found him[b], and there he spoke with us—
translation:
  language: de
  text: Er rang mit dem Engel und setzte sich durch; er weinte und flehte ihn um Gunst an.[a] In Bet-El fand er ihn, und dort redete er mit uns.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bat ihn flehentlich um Erbarmen“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht „mit uns“. Manche verstehen oder ändern den ungewöhnlichen Personenwechsel zu „mit ihm“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: rang
  rationale: Das Verb שׂרה bezeichnet im Rückbezug auf Jakobs nächtlichen Kampf (1. Mose 32) ein Ringen oder Kämpfen. „Rang“ bewahrt diese erzählerische Anspielung.
- source_word: מַלְאָךְ
  choice: mit dem Engel
  rationale: Obwohl מַלְאָךְ grundsätzlich auch „Bote“ heißen kann, bezeichnet es hier das übernatürliche Gegenüber aus der Jakobserzählung. Die kontextuell bestimmte Gestalt wird im Deutschen mit dem bestimmten Artikel wiedergegeben.
- source_word: וַיֻּכָל
  choice: setzte sich durch
  rationale: יכל bedeutet hier im Zusammenhang des Ringens, dass Jakob sich behauptete beziehungsweise die Oberhand behielt. „Setzte sich durch“ ist gegenwärtiges, verständliches Deutsch und vermeidet den möglichen Eindruck eines endgültigen Sieges.
- source_word: בָּכָה
  choice: weinte
  rationale: Die schlichte Vergangenheitsform gibt die erzählte Handlung präzise und natürlich wieder.
- source_word: וַיִּתְחַנֶּן לוֹ
  choice: flehte ihn um Gunst an
  rationale: Der Hitpael von חנן bezeichnet eindringliches Bitten um Gunst, Erbarmen oder gnädige Zuwendung. Die Formulierung erhält sowohl das Flehen als auch den Bedeutungsbezug zur Gunst.
- source_word: בֵּית אֵל
  choice: Bet-El
  rationale: Der eingebürgerte deutsche Ortsname wird mit Bindestrich geschrieben und wahrt zugleich die erkennbare Namensform.
- source_word: יִמְצָאֶנּוּ
  choice: fand er ihn
  rationale: 'Die Form wird im unmittelbaren Rückblick am ehesten als „er fand ihn“ verstanden: Jakob begegnete Gott in Bet-El. Das hebräische Imperfekt kann in diesem erinnernden beziehungsweise vergegenwärtigenden Zusammenhang als Vergangenheit wiedergegeben werden.'
- source_word: וְשָׁם יְדַבֵּר עִמָּנוּ
  choice: und dort redete er mit uns
  rationale: Der masoretische Text hat ausdrücklich die erste Person Plural „mit uns“. Der auffällige Wechsel von Jakob zu „uns“ wird beibehalten; das Imperfekt wird passend zum erzählenden Rückblick als Vergangenheit wiedergegeben.
theological_decisions:
- issue: Wechsel zur ersten Person Plural im letzten Satzteil
  choice: „mit uns“ im Haupttext beibehalten
  alternative: „mit ihm“
  rationale: Die masoretische Lesart verbindet Jakobs Begegnung mit Hoseas Gemeinschaft beziehungsweise Israel. Eine Glättung zu „mit ihm“ würde diese theologisch bedeutsame Spannung beseitigen.
- issue: Identität des מַלְאָךְ
  choice: „Engel“ ohne weitergehende dogmatische Identifizierung
  alternative: „Bote“ oder eine ausdrückliche Gleichsetzung mit Gott
  rationale: Der Zusammenhang weist auf ein übernatürliches Gegenüber, doch der Vers hält die Spannung zwischen Engel und göttlicher Begegnung offen. Die Übersetzung soll sie nicht durch eine konfessionelle Deutung festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Rang“ bewahrt die Anspielung auf Jakobs Kampf; „flehte ihn um Gunst an“ ist verständlich, ohne den Gnadenbezug des hebräischen Verbs zu verlieren. Der ungewöhnliche Wechsel zu „mit uns“ bleibt bewusst sichtbar.
