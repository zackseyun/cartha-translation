  terminology: „Engel“ ist kontextgerecht für מַלְאָךְ und vermeidet eine unangebrachte weitergehende Identifikation. „Gunst“ bewahrt bei חנן den Bezug auf gewährte Gnade bzw. Zuwendung, ohne den Ausdruck konfessionell zu überbestimmen. Die Fußnote zu „mit uns“ erläutert den Personenwechsel, ohne ihn im Haupttext zu glätten.
