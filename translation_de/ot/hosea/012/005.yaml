  source_fidelity: 'Der Text gibt die Abfolge und die Bezüge des Hebräischen zuverlässig wieder: Jakob rang mit dem Engel, war ihm überlegen, weinte und flehte ihn an. „In Bet-El fand er ihn“ bewahrt die im Hebräischen vorliegende personale Begegnung, ohne die Identität des Referenten dogmatisch festzulegen. Die auffällige masoretische Verschiebung zu „mit uns“ bleibt erhalten. Die Vergangenheitswiedergabe der Imperfektformen ist im erinnernden, narrativen Zusammenhang gut vertretbar.'
