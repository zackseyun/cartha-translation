reference: Hosea 12:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: סְבָבֻ֤/נִי בְ/כַ֨חַשׁ֙ אֶפְרַ֔יִם וּ/בְ/מִרְמָ֖ה בֵּ֣ית יִשְׂרָאֵ֑ל וִֽ/יהוּדָ֗ה עֹ֥ד רָד֙ עִם אֵ֔ל וְ/עִם קְדוֹשִׁ֖ים נֶאֱמָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/001.yaml
  text: Ephraim has surrounded me with lies[a], and the house of Israel with deceit[b]; but Judah still roams with God and is faithful with the Holy One.
translation:
  language: de
  text: Efraim hat mich mit Lügen umringt, das Haus Israel mit Täuschung. Doch Juda geht noch mit Gott und ist dem Heiligen treu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Juda ist weiterhin widerspenstig gegen Gott, gegen den Heiligen, der treu ist.“ Der hebräische Satz ist schwierig; besonders die Bedeutung des mit „geht“ wiedergegebenen Verbs und der Bezug von „treu“ sind unsicher.'
    reason: alternative_reading
  - marker: b
    text: Hebräisch „bei/mit den Heiligen“. Der Ausdruck kann sich auf Gott als „den Heiligen“ oder auf himmlische Wesen beziehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבָבֻנִי
  choice: hat mich … umringt
  rationale: Das Qal Perfekt mit Objektsuffix bedeutet wörtlich „sie haben mich umringt“. „Umringt“ bewahrt das Bild, dass Gott von der Falschheit Israels gleichsam eingeschlossen wird.
- source_word: בְכַחַשׁ
  choice: mit Lügen
  rationale: כחש bezeichnet hier Falschheit beziehungsweise Lüge. Der Plural „Lügen“ ist im Deutschen natürlich und gibt die konkrete, fortgesetzte Unwahrhaftigkeit wieder.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Der Eigenname bleibt erhalten; seine metonymische Bedeutung für das Nordreich wird nicht in den Text hineinerklärt.
- source_word: וּבְמִרְמָה
  choice: mit Täuschung
  rationale: מרמה bezeichnet Täuschung, Trug oder Hinterlist. „Täuschung“ unterscheidet sich sprachlich von „Lügen“, ohne den Ausdruck unnötig zu verschärfen.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die formelhafte hebräische Bezeichnung wird in ihrer prophetischen Gestalt bewahrt.
- source_word: וִיהוּדָה
  choice: Doch Juda
  rationale: Das Waw wird angesichts des in der gewählten Hauptlesart vorliegenden Gegensatzes adversativ wiedergegeben.
- source_word: עֹד
  choice: noch
  rationale: עֹד bezeichnet hier das Fortdauern eines Zustands oder Verhaltens.
- source_word: רָד עִם אֵל
  choice: geht noch mit Gott
  rationale: Das seltene und schwierige Verb רָד lässt mehrere Deutungen zu. „Geht … mit Gott“ wahrt in der Hauptlesart die Vorstellung fortdauernder Gemeinschaft, ohne eine präzisere Bewegungsart vorzutäuschen; die negative Alternative wird in der Fußnote genannt.
- source_word: אֵל
  choice: Gott
  rationale: אֵל fungiert im Zusammenhang als Gottesbezeichnung und wird daher mit „Gott“ wiedergegeben.
- source_word: וְעִם קְדוֹשִׁים
  choice: dem Heiligen
  rationale: Obwohl קְדוֹשִׁים formal im Plural steht, kann der Ausdruck hier auf Gott bezogen verstanden werden. Die wörtliche Pluralmöglichkeit „den Heiligen“ wird in einer Fußnote erhalten.
- source_word: נֶאֱמָן
  choice: ist … treu
  rationale: Das Nifal-Partizip bezeichnet Zuverlässigkeit oder Treue. Die deutsche Konstruktion „jemandem treu sein“ gibt den Sinn idiomatisch wieder.
theological_decisions:
- issue: Deutung des schwierigen Juda-Satzes
  choice: 'Positive Kontrastlesart: Juda geht noch mit Gott und ist dem Heiligen treu.'
  alternative: 'Negative Lesart: Juda ist weiterhin widerspenstig gegen Gott, gegen den Heiligen, der treu ist.'
  rationale: רָד, die Funktion von עִם und der Bezug von נֶאֱמָן sind umstritten. Die positive Lesart ergibt einen Gegensatz zur Falschheit Efraims und lässt נֶאֱמָן Juda als Treue zuschreiben. Weil der hebräische Wortlaut auch eine negative Deutung zulässt, wird diese nicht verschwiegen, sondern in der Fußnote dokumentiert.
- issue: Singularische oder pluralische Deutung von קְדוֹשִׁים
  choice: „dem Heiligen“ als Bezeichnung Gottes
  alternative: „den Heiligen“ als Hinweis auf himmlische Wesen
  rationale: Die Form ist morphologisch pluralisch, kann im poetisch-prophetischen Sprachgebrauch jedoch auf Gott bezogen werden. Die Hauptlesart folgt dem unmittelbaren Parallelismus mit אֵל; die formale Pluraldeutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Begriffe „Lügen“ und „Täuschung“ bleiben unterschieden. Der schwer verständliche Juda-Satz wird im Haupttext lesbar formuliert, während seine echte sprachliche und theologische Mehrdeutigkeit durch zwei unmittelbar gesetzte Fußnoten bewahrt wird.
