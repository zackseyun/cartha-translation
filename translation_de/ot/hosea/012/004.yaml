  text: בַּ/בֶּ֖טֶן עָקַ֣ב אֶת אָחִ֑י/ו וּ/בְ/אוֹנ֖/וֹ שָׂרָ֥ה אֶת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/004.yaml
  text: In the womb he grasped his brother’s heel[b][a], and in his strength he contended with God.
translation:
  language: de
  text: Im Mutterleib packte er seinen Bruder an der Ferse[a], und in seiner Kraft rang er mit Gott[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nahm seinen Bruder bei der Ferse“. Das hebräische Verb erinnert an Jakobs Geburt und kann im übertragenen Sinn auch „verdrängen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „rang mit einem göttlichen Wesen“. Im folgenden Vers wird die Gestalt als „der Engel“ bezeichnet; Hoseas unterschiedliche Bezeichnungen werden hier nicht einander angeglichen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּבֶּטֶן
  choice: Im Mutterleib
  rationale: בטן bezeichnet Bauch beziehungsweise Mutterleib. Da auf Jakob vor und bei seiner Geburt angespielt wird, ist „Mutterleib“ hier die natürliche und genaue Wiedergabe.
- source_word: עָקַב
  choice: packte … an der Ferse
  rationale: Das Verb greift die Erzählung von Jakobs Geburt in Genesis 25,26 und das Wortfeld „Ferse“ auf. Die konkrete Wendung bewahrt diese Anspielung, ohne die übertragene Bedeutung „verdrängen“ in den Haupttext einzutragen.
- source_word: אָחִיו
  choice: seinen Bruder
  rationale: Das mit der Objektmarkierung verbundene Substantiv wird als direktes Objekt des Verbs wiedergegeben; die Ferse wird im Deutschen idiomatisch durch „an der Ferse“ ergänzt.
- source_word: וּבְאוֹנוֹ
  choice: und in seiner Kraft
  rationale: און kann Kraft, Stärke oder Manneskraft bezeichnen. „In seiner Kraft“ bleibt nah am Hebräischen und legt weder Lebensalter noch sexuelle Potenz fest.
- source_word: שָׂרָה
  choice: rang
  rationale: Das Verb bezeichnet kämpferisches Ringen oder Streiten und erinnert zugleich an Jakobs Kampf und den Namen Israel. „Rang“ bewahrt das konkrete Geschehen, ohne einen Sieg ausdrücklich zu behaupten.
- source_word: אֶת אֱלֹהִים
  choice: mit Gott
  rationale: Obwohl אֶת formal als Objektmarkierung erscheint, verlangt das deutsche Verb „ringen“ hier idiomatisch „mit“. אֱלֹהִים wird im Haupttext als „Gott“ wiedergegeben; die mögliche allgemeinere Deutung bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bezug von אֱלֹהִים in Jakobs Ringen
  choice: Gott
  alternative: 'ein göttliches Wesen; im Licht des folgenden Verses: der Engel'
  rationale: Der hebräische Text dieses Verses nennt אֱלֹהִים, während der folgende Vers die Gestalt als „den Engel“ bezeichnet. Der Haupttext bewahrt daher „Gott“, und die Fußnote hält die Spannung zur angelischen Beschreibung offen, statt beide Aussagen stillschweigend anzugleichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Im Mutterleib“ und „an der Ferse packen“ sind allgemein verständlich; „rang“ bewahrt die erzählerische Bildkraft und den Bezug auf Jakobs Kampf.
