id: HOS.12.3
reference: Hosea 12:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/רִ֥יב לַֽ/יהוָ֖ה עִם יְהוּדָ֑ה וְ/לִ/פְקֹ֤ד עַֽל יַעֲקֹב֙ כִּ/דְרָכָ֔י/ו כְּ/מַעֲלָלָ֖י/ו יָשִׁ֥יב לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/003.yaml
  text: Yahweh has a charge against Judah[a], and he will punish Jacob according to his ways[b]; according to his deeds he will repay him.
translation:
  language: de
  text: Jahwe führt einen Rechtsstreit gegen Juda[a] und wird Jakob für seine Wege zur Rechenschaft ziehen[b]; nach seinen Taten wird er ihm vergelten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Jahwe hat einen Rechtsstreit mit Juda“ oder „Jahwe hat eine Rechtssache gegen Juda“. Das Hebräische verwendet die Sprache eines Gerichtsverfahrens.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „wird Jakob bestrafen“. Die hebräische Wendung bedeutet wörtlich „Jakob heimsuchen“ und bezeichnet hier ein zur Rechenschaft ziehendes, richtendes Eingreifen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: führt einen Rechtsstreit
  rationale: Das Substantiv bezeichnet hier im prophetischen Kontext einen rechtlichen Streitfall. „Rechtsstreit“ bewahrt die forensische Bildwelt und ist im modernen Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עִם יְהוּדָה
  choice: gegen Juda
  rationale: עִם bezeichnet nach רִיב die Gegenpartei in einem Rechtsstreit; daher ist „gegen“ hier idiomatisch angemessen.
- source_word: לִפְקֹד עַל
  choice: zur Rechenschaft ziehen
  rationale: Die Wendung bezeichnet in diesem Gerichtszusammenhang ein prüfendes und strafendes Einschreiten. „Zur Rechenschaft ziehen“ erhält den forensischen Zusammenhang und vermeidet eine unnötige Verengung auf bloße Bestrafung.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der im Hebräischen stehende Name bleibt erhalten, einschließlich seiner möglichen doppelten Beziehung auf den Erzvater und das von ihm abstammende Volk.
- source_word: כִּדְרָכָיו
  choice: für seine Wege
  rationale: „Wege“ bewahrt die geläufige hebräische Metapher für Lebensführung und Verhalten. Die Präposition „für“ fügt sich natürlich in die deutsche Wendung „zur Rechenschaft ziehen“ ein.
- source_word: כְּמַעֲלָלָיו
  choice: nach seinen Taten
  rationale: מַעֲלָלִים bezeichnet moralisch bewertete Handlungen; „Taten“ ist knapp, würdig und kontextgemäß.
- source_word: יָשִׁיב לוֹ
  choice: wird er ihm vergelten
  rationale: Die Hifil-Form von שוב mit ל drückt hier entsprechende Rückerstattung beziehungsweise Vergeltung aus. „Vergelten“ erhält den Gedanken einer den Taten angemessenen Antwort.
theological_decisions:
- issue: Verhältnis von Juda und Jakob im angekündigten Gericht
  choice: 'Beide Namen werden unverändert wiedergegeben: Juda ist Gegenpartei in Jahwes Rechtsstreit, Jakob wird zur Rechenschaft gezogen und empfängt Vergeltung.'
  alternative: „Jakob“ ausdrücklich als Gesamtisrael einschließlich Juda erklären oder durch „Israel“ ersetzen.
  rationale: Der Vers nennt Juda und Jakob nebeneinander. Die Übersetzung bewahrt diese Spannung und lässt offen, welchen genauen Umfang „Jakob“ hier hat.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die juristische Bildsprache des hebräischen Textes bleibt erhalten; zugleich werden schwer verständliche wörtliche Hebraismen vermieden. Der Parallelismus von „Wege“ und „Taten“ sowie die Unterscheidung zwischen Juda und Jakob werden bewahrt.
