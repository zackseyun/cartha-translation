source:
  edition: WLC
  text: וַ/יִּבְרַ֥ח יַעֲקֹ֖ב שְׂדֵ֣ה אֲרָ֑ם וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ בְּ/אִשָּׁ֔ה וּ/בְ/אִשָּׁ֖ה שָׁמָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/013.yaml
  text: Jacob fled to the field of Aram[a]; Israel served for a wife[b], and for a wife he kept watch.
translation:
  language: de
  text: Jakob floh in das Gebiet Arams[a]; Israel diente um eine Frau, und um eine Frau hütete er[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in das Feld Arams“; gemeint sein kann auch „in das Land Arams“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bewachte er“ beziehungsweise „hielt er Wache“. Das Verb kann sich hier auf das Hüten oder Bewachen von Herden beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: floh
  rationale: ברח bezeichnet Fliehen oder Davonlaufen. „Floh“ ist knapp, natürlich und legt Jakobs Beweggrund nicht näher fest.
- source_word: שְׂדֵה אֲרָם
  choice: in das Gebiet Arams
  rationale: שׂדה bedeutet wörtlich „Feld“ beziehungsweise „offenes Land“, bezeichnet hier aber idiomatisch das Land oder Gebiet Arams. Die natürliche deutsche Wiedergabe steht im Haupttext; die wörtliche Bildsprache bleibt in der Fußnote sichtbar.
- source_word: וַיַּעֲבֹד
  choice: diente
  rationale: עבד kann „dienen“ oder „arbeiten“ bedeuten. „Diente“ bewahrt den Bezug zu Jakobs Dienst bei Laban.
- source_word: בְּאִשָּׁה / וּבְאִשָּׁה
  choice: um eine Frau / und um eine Frau
  rationale: ב ist hier im Zusammenhang am besten als Angabe des Zwecks oder Gegenwerts zu verstehen. Die Wiederholung wird entsprechend dem Hebräischen beibehalten.
- source_word: שָׁמָר
  choice: hütete er
  rationale: שׁמר bedeutet „bewahren, hüten, bewachen“. Im Zusammenhang der Jakob-Laban-Erzählung liegt das Hüten von Herden nahe; „hütete“ ist im Deutschen knapp und lässt das nicht ausdrücklich genannte Objekt offen.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: Jakob / Israel
  rationale: Der bewusste Wechsel der Namen wird erhalten, damit die poetische und theologische Verbindung zwischen dem Erzvater und dem Volk nicht eingeebnet wird.
theological_decisions:
- issue: Wechsel zwischen Jakob und Israel
  choice: Beide Namen im Haupttext getrennt beibehalten
  alternative: Aus stilistischen Gründen durchgehend nur „Jakob“ oder nur „Israel“ verwenden
  rationale: Der hebräische Text wechselt bewusst zwischen den Namen und kann damit zugleich den Erzvater und das aus ihm hervorgegangene Volk anklingen lassen.
- issue: Nicht genanntes Objekt von שָׁמָר
  choice: Das Verb ohne ergänztes Objekt mit „hütete er“ wiedergeben
  alternative: „hütete er die Herden“ oder „bewachte er“
  rationale: Die Jakobserzählung legt Herden als Objekt nahe, doch der Vers nennt sie nicht ausdrücklich. Die Übersetzung vermeidet deshalb eine interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Parallelstruktur, die Wiederholung „um eine Frau“ und der Namenswechsel Jakob/Israel bleiben erhalten. „Gebiet Arams“ vermeidet die im Deutschen missverständliche wörtliche Form „Feld Arams“; diese ist in der Fußnote dokumentiert.
