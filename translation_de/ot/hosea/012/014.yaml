id: HOS.12.14
reference: Hosea 12:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְ/נָבִ֕יא הֶעֱלָ֧ה יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וּ/בְ/נָבִ֖יא נִשְׁמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/014.yaml
  text: By a prophet Yahweh brought Israel up from Egypt[b][a], and by a prophet he was guarded.
translation:
  language: de
  text: Durch einen Propheten führte Jahwe Israel aus Ägypten herauf[a], und durch einen Propheten wurde es behütet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem Propheten ist im Zusammenhang des Auszugs aus Ägypten wahrscheinlich Mose gemeint.
    reason: cross_reference
  - marker: b
    text: 'Oder: „wurde es bewahrt“ beziehungsweise „wurde es beschützt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנָבִיא
  choice: durch einen Propheten
  rationale: Die Präposition בְּ bezeichnet hier Mittel bzw. Vermittlung. „Durch einen Propheten“ ist im Deutschen natürlich und bewahrt die Wiederholung in beiden Satzhälften.
- source_word: הֶעֱלָה
  choice: führte ... herauf
  rationale: Der Hifil von עלה bedeutet „heraufführen/heraufbringen“. „Führte ... aus Ägypten herauf“ bewahrt die hebräische Exodus-Wendung und klingt im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Im Deutschen ist bei einer Bewegung aus einem Land „aus Ägypten“ die idiomatische Entsprechung.
- source_word: נִשְׁמָר
  choice: wurde es behütet
  rationale: 'Der Nifal von שׁמר ist hier passiv: Israel wurde bewahrt, beschützt oder behütet. „Behütet“ verbindet Schutz und fürsorgliche Bewahrung, ohne den Ausdruck unnötig zu spezifizieren.'
theological_decisions:
- issue: Nicht ausdrückliche Identität des Propheten
  choice: „einen Propheten“ bleibt unbestimmt; eine Fußnote weist auf Mose als wahrscheinlichen Bezug hin.
  alternative: „den Propheten“ oder ausdrücklich „Mose“
  rationale: Im Hebräischen steht kein Artikel. Die unbestimmte Wiedergabe bewahrt den Wortlaut und den Akzent auf prophetischer Vermittlung, während der Exodus-Kontext die Identifikation mit Mose nahelegt.
- issue: Bezug des unausgesprochenen Subjekts von נִשְׁמָר
  choice: Das Pronomen „es“ bezieht sich grammatisch auf Israel.
  alternative: „er wurde behütet“, mit möglichem Bezug auf Jakob oder Mose
  rationale: Der unmittelbar zuvor genannte Singular „Israel“ ist der nächstliegende Bezug. Das deutsche Neutrum macht diesen Rückbezug deutlich, ohne eine zusätzliche Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur „Durch einen Propheten ... und durch einen Propheten ...“ wird erhalten. „Jahwe“ gibt den Gottesnamen wieder; „herauf“ bewahrt die räumlich-theologische Exodus-Wendung.
