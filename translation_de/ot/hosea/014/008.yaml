  text: יָשֻׁ֨בוּ֙ יֹשְׁבֵ֣י בְ/צִלּ֔/וֹ יְחַיּ֥וּ דָגָ֖ן וְ/יִפְרְח֣וּ כַ/גָּ֑פֶן זִכְר֖/וֹ כְּ/יֵ֥ין לְבָנֽוֹן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/008.yaml
  text: Those who dwell in his shade will return[a]; they will revive like grain and blossom like the vine[b]; his renown will be like the wine of Lebanon.
translation:
  language: de
  text: Die, die in seinem Schatten wohnen, werden zurückkehren. Sie werden aufleben wie Getreide[a] und blühen wie der Weinstock. Sein Ruhm[b] wird wie der Wein des Libanon sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie werden Getreide anbauen“ oder „sie werden durch Getreide neu belebt“. Die hebräische Wendung ist stark verdichtet und kann sowohl das Aufleben des Getreides als auch reichen Getreideertrag anklingen lassen.'
    reason: lexical_alternative
  - marker: b
    text: „Sein Ruhm“ kann auch mit „sein Andenken“ oder „die Erinnerung an ihn“ wiedergegeben werden; im Zusammenhang weniger wahrscheinlich ist „dessen Ruhm“.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֻׁבוּ
  choice: werden zurückkehren
  rationale: Das Qal-Imperfekt von שׁוב bedeutet gewöhnlich „zurückkehren“ oder „umkehren“. Im Zusammenhang bezeichnet es am ehesten die Wiederherstellung der Menschen, die unter seinem Schutz wohnen.
- source_word: יֹשְׁבֵי בְצִלּוֹ
  choice: Die in seinem Schatten wohnen
  rationale: Das substantivisch gebrauchte Partizip bezeichnet die dort Wohnenden. „Schatten“ bewahrt das poetische Bild von Schutz und Wohlergehen.
- source_word: יְחַיּוּ דָגָן
  choice: Sie werden aufleben wie das Getreide
  rationale: Die poetisch verdichtete Wendung verbindet das Piel von חיה („lebendig machen, neu beleben“) mit „Getreide“. Aus dem Parallelismus mit dem Blühen des Weinstocks wird der Vergleich verständlich; das ergänzte „wie“ macht ihn im Deutschen lesbar, ohne die andere mögliche syntaktische Deutung zu verschweigen.
- source_word: וְיִפְרְחוּ כַגָּפֶן
  choice: und blühen wie der Weinstock
  rationale: פרח bezeichnet das Blühen oder Gedeihen; der ausdrücklich markierte Vergleich mit dem Weinstock bleibt erhalten.
- source_word: זִכְרוֹ
  choice: sein Ruhm
  rationale: Das Substantiv kann „Erinnerung“, „Andenken“ oder „Ruhm“ bedeuten. Im Vergleich mit dem geschätzten Wein des Libanon passt „Ruhm“ als sich verbreitender guter Ruf am besten, während die Mehrdeutigkeit in einer Fußnote erhalten bleibt.
- source_word: כְּיֵין לְבָנוֹן
  choice: wie der Wein des Libanon
  rationale: Die direkte Wiedergabe erhält den regionalen Vergleich und seine Assoziation mit besonderer Güte.
theological_decisions:
- issue: Bezugswort der maskulinen Singularsuffixe in „seinem Schatten“ und „sein Ruhm“
  choice: Die maskulinen Singularpronomen werden beibehalten, ohne ihren Bezug ausdrücklich festzulegen.
  alternative: Die Pronomen könnten auslegend auf das personifizierte Israel, auf Ephraim oder auf das wiederhergestellte Gottesvolk als Kollektiv bezogen werden.
  rationale: Der hebräische Text lässt den poetischen Bezug in dieser Form stehen. Eine ausdrückliche Ersetzung durch „ihren“ oder durch einen Namen würde die grammatische und theologische Spannung vorschnell auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrten Naturbildern. Die verdichtete Getreidezeile wird im Haupttext durch den poetischen Parallelismus verständlich gemacht; ihre syntaktischen Alternativen werden in der Fußnote offengehalten.
