  text: אֶפְרַ֕יִם מַה לִּ֥/י ע֖וֹד לָֽ/עֲצַבִּ֑ים אֲנִ֧י עָנִ֣יתִי וַ/אֲשׁוּרֶ֗/נּוּ אֲנִי֙ כִּ/בְר֣וֹשׁ רַֽעֲנָ֔ן מִמֶּ֖/נִּי פֶּרְיְ/ךָ֥ נִמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/009.yaml
  text: Ephraim—what have I to do anymore with idols? I have answered him and will look after him[a]. I am like a flourishing cypress[c][b]; from me your fruit is found.
translation:
  language: de
  text: Efraim – was habe ich noch mit den Götzen zu tun?[a] Ich habe ihm geantwortet und sehe nach ihm.[b] Ich bin wie eine üppig grüne Zypresse; von mir kommt deine Frucht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Bekenntnis Efraims: »Efraim: Was habe ich noch mit den Götzen zu tun?« Im Hebräischen ist nicht eindeutig, wer die Frage spricht.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: »Ich sehe ihn an«, »ich achte auf ihn« oder »ich sorge für ihn«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Von mir wird deine Frucht gefunden.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי עוֹד לָעֲצַבִּים
  choice: was habe ich noch mit den Götzen zu tun?
  rationale: Die idiomatische Wendung מַה לִּי drückt Abgrenzung aus; עוֹד bedeutet hier „noch/weiterhin“. Die Formulierung ist natürlich und bewahrt zugleich die mögliche Zuordnung der Worte zu Gott oder zu Efraim.
- source_word: עָנִיתִי
  choice: Ich habe ihm geantwortet
  rationale: Das Qal-Perfekt von ענה wird in seinem üblichen Sinn „antworten“ wiedergegeben. Das im Deutschen erforderliche Objekt „ihm“ nimmt den folgenden maskulinen Bezug auf Efraim auf.
- source_word: וַאֲשׁוּרֶנּוּ
  choice: und sehe nach ihm
  rationale: Das seltene Verb bezeichnet ein aufmerksames Sehen oder Beachten. „Nach ihm sehen“ hält die Bedeutungen „ihn ansehen“, „auf ihn achten“ und „für ihn sorgen“ offen, ohne Fürsorge stärker festzulegen als der hebräische Ausdruck.
- source_word: כִּבְרוֹשׁ רַעֲנָן
  choice: wie eine immergrüne Zypresse
  rationale: בְּרוֹשׁ bezeichnet einen Nadelbaum, traditionell häufig die Zypresse; רַעֲנָן hebt frische, üppig grüne Lebenskraft hervor. „Immergrün“ bildet das Bild in verständlichem Deutsch ab.
- source_word: מִמֶּנִּי פֶּרְיְךָ נִמְצָא
  choice: bei mir findet sich deine Frucht
  rationale: Die Wiedergabe bewahrt das Nifal „findet sich“ und den Ausgangspunkt מִמֶּנִּי. „Bei mir“ klingt auf Deutsch natürlicher als „von mir“, ohne die Aussage über den Ursprung der Frucht aufzugeben.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Die im modernen deutschen Bibelgebrauch geläufige Namensform; hier als Anrede und Bezeichnung des personifizierten Nordreichs.
- source_word: עֲצַבִּים
  choice: Götzen
  rationale: Im prophetischen Kontext bezeichnet das Wort kultisch verehrte Götterbilder; „Götzen“ gibt die polemische Färbung klar wieder.
theological_decisions:
- issue: Sprecher der einleitenden Frage
  choice: Die Hauptfassung verbindet die Frage mit der anschließenden Gottesrede.
  alternative: 'Efraim spricht ein Bekenntnis: „Was habe ich noch mit den Götzen zu tun?“'
  rationale: Im Hebräischen fehlt eine ausdrückliche Redeeinleitung. Die unmittelbar folgenden Verben in der ersten Person sprechen für eine fortlaufende Gottesrede, doch Efraims Bekenntnis bleibt syntaktisch möglich und wird deshalb in der Fußnote erhalten.
- issue: Art der göttlichen Zuwendung in וַאֲשׁוּרֶנּוּ
  choice: „sehe nach ihm“
  alternative: „sehe ihn an“, „achte auf ihn“ oder „sorge für ihn“
  rationale: Der seltene Ausdruck erlaubt sowohl das bloße bzw. aufmerksame Ansehen als auch eine fürsorgliche Nuance. Die Hauptfassung vermeidet es, diese Spannung einseitig aufzulösen.
- issue: Quelle von Efraims Frucht
  choice: „bei mir findet sich deine Frucht“
  alternative: „von mir kommt deine Frucht“
  rationale: Die Hauptfassung folgt der grammatischen Gestalt des Nifal und lässt zugleich erkennen, dass Efraims Frucht allein bei Gott zu finden ist; die dynamischere Ursprungsformulierung steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich kennzeichnet die nachdrückliche Anrede Efraims. Die Formulierungen bleiben nah an der hebräischen Bildsprache, während die Fußnoten echte syntaktische und lexikalische Mehrdeutigkeiten sichtbar halten.
