source:
  edition: WLC
  text: אֶרְפָּא֙ מְשׁ֣וּבָתָ֔/ם אֹהֲבֵ֖/ם נְדָבָ֑ה כִּ֛י שָׁ֥ב אַפִּ֖/י מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/005.yaml
  text: I will heal their apostasy; I will love them freely[a], for my anger has turned away from them.
translation:
  language: de
  text: Ich werde ihren Abfall heilen; ich werde sie aus freien Stücken lieben, denn mein Zorn hat sich von ihm[a] abgewandt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem Hebräischen: „von ihm“; manche Übersetzungen gleichen den Numerus an und geben „von ihnen“ wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְפָּא
  choice: Ich werde heilen
  rationale: Das Qal von רפא bedeutet gewöhnlich „heilen“. Die Wiedergabe bewahrt das Bild einer Heilung des gestörten Verhältnisses zu Gott.
- source_word: מְשׁוּבָתָם
  choice: ihren Abfall
  rationale: מְשׁוּבָה bezeichnet Abkehr, Untreue oder Abfall. „Abfall“ ist im Deutschen verständlich, prägnant und wahrt den bundesbezogenen Ernst des Ausdrucks.
- source_word: אֹהֲבֵם
  choice: ich werde sie lieben
  rationale: אהב bedeutet hier schlicht „lieben“; das Suffix bezeichnet ein männliches Objekt im Plural.
- source_word: נְדָבָה
  choice: aus freien Stücken
  rationale: Das adverbial gebrauchte נְדָבָה bezeichnet Freiwilligkeit und Uneigennützigkeit. „Aus freien Stücken“ bringt den ungenötigten Charakter der Liebe natürlich zum Ausdruck.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier die Begründung der vorangehenden Zusage ein.
- source_word: שָׁב
  choice: hat sich abgewandt
  rationale: שׁוב beschreibt hier die Abkehr beziehungsweise das Zurückweichen des göttlichen Zorns. Die reflexive Form ist im Deutschen idiomatisch.
- source_word: אַפִּי
  choice: mein Zorn
  rationale: אַף bedeutet wörtlich „Nase“, bezeichnet idiomatisch jedoch Zorn. „Zorn“ entspricht dem würdevollen prophetischen Sprachgebrauch.
- source_word: מִמֶּנּוּ
  choice: von ihm
  rationale: Die masoretische Form trägt ein Suffix der 3. Person Maskulin Singular. Die Wiedergabe wahrt den auffälligen Wechsel vom Plural zum Singular.
theological_decisions:
- issue: Numeruswechsel beim abschließenden Pronomen
  choice: Den hebräischen Singular mit „von ihm“ bewahren
  alternative: „von ihnen“ als Angleichung an die vorhergehenden Pluralformen
  rationale: Der hebräische Text wechselt nach „ihren“ und „sie“ zu מִמֶּנּוּ im Singular. Dieser echte Spannungsmoment wird im Haupttext nicht stillschweigend harmonisiert; eine Fußnote nennt die geglättete Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Heilungsbild und der auffällige Numeruswechsel des hebräischen Textes bleiben erhalten; die Satzstruktur ist knapp und prophetisch.
