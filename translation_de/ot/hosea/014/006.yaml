  text: אֶהְיֶ֤ה כַ/טַּל֙ לְ/יִשְׂרָאֵ֔ל יִפְרַ֖ח כַּ/שּֽׁוֹשַׁנָּ֑ה וְ/יַ֥ךְ שָׁרָשָׁ֖י/ו כַּ/לְּבָנֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/006.yaml
  text: I will be like the dew to Israel[a]; he will blossom like the lily[b], and he will strike his roots like Lebanon.
translation:
  language: de
  text: Ich werde für Israel[a] wie der Tau sein; er wird blühen wie die Lilie und Wurzeln schlagen wie der Libanon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Israel wird im Hebräischen als ein Kollektiv im Singular dargestellt; daher folgt „er“.
    reason: lexical_alternative
  - marker: b
    text: Der Libanon steht für Festigkeit und Größe, wohl auch wegen seiner berühmten, fest verwurzelten Bäume. „Zedern“ werden im Hebräischen jedoch nicht ausdrücklich genannt.
    reason: cultural_note
lexical_decisions:
- source_word: אֶהְיֶה
  choice: Ich werde … sein
  rationale: Das Qal-Imperfekt der 1. Person Singular bezeichnet im Zusammenhang dieser Verheißung natürlich die Zukunft.
- source_word: כַטַּל
  choice: wie der Tau
  rationale: Die Vergleichspartikel כ wird mit „wie“ wiedergegeben; „Tau“ bewahrt das Bild lebensspendender Feuchtigkeit.
- source_word: לְיִשְׂרָאֵל
  choice: für Israel
  rationale: Die Präposition ל bezeichnet hier die Israel zugutekommende Beziehung; „für Israel“ ist im Deutschen natürlich und wahrt diesen Sinn.
- source_word: יִפְרַח
  choice: er wird blühen
  rationale: Die maskuline Singularform bezieht sich auf Israel als singularisches Kollektiv. „Blühen“ greift das folgende Blumenbild präzise auf.
- source_word: כַשּׁוֹשַׁנָּה
  choice: wie die Lilie
  rationale: שׁוֹשַׁנָּה bezeichnet herkömmlich eine Lilie beziehungsweise eine lilienartige Blume; der bestimmte Artikel wird mit „die“ bewahrt.
- source_word: וְיַךְ שָׁרָשָׁיו
  choice: und seine Wurzeln schlagen
  rationale: Die Wendung wird mit dem natürlichen deutschen Ausdruck „Wurzeln schlagen“ wiedergegeben; „seine“ bewahrt das maskuline Singularsuffix.
- source_word: כַלְּבָנוֹן
  choice: wie der Libanon
  rationale: Der hebräische Text nennt den Libanon selbst und nicht ausdrücklich seine Zedern; deshalb bleibt das geographische Bild unaufgelöst.
theological_decisions:
- issue: Bezug und Genus der Singularformen für Israel
  choice: Israel wird als singularisches Kollektiv mit „er“ und „seine“ aufgenommen.
  alternative: Neutral mit „es/seine“ oder sinngemäß pluralisch mit „sie/ihre“ übersetzen.
  rationale: Die hebräischen Verb- und Pronominalformen stehen im maskulinen Singular. Die Übersetzung bewahrt diese personale, kollektive Darstellung, ohne sie zu neutralisieren oder in einen Plural umzudeuten.
- issue: Bild des Libanon
  choice: Der Vergleich bleibt „wie der Libanon“.
  alternative: Deutend „wie die Zedern des Libanon“ übersetzen.
  rationale: Im Ausgangstext steht nur „Libanon“. Seine berühmten Bäume können beim Bild mitschwingen, werden aber nicht ausdrücklich genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. Der Semikolon gliedert Gottes Zusage und die daraus folgende Entfaltung Israels; die singularische Personifikation bleibt erhalten.
