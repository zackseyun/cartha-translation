  text: מִ֤י חָכָם֙ וְ/יָ֣בֵֽן אֵ֔לֶּה נָב֖וֹן וְ/יֵֽדָעֵ֑/ם כִּֽי יְשָׁרִ֞ים דַּרְכֵ֣י יְהוָ֗ה וְ/צַדִּקִים֙ יֵ֣לְכוּ בָ֔/ם וּ/פֹשְׁעִ֖ים יִכָּ֥שְׁלוּ בָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/010.yaml
  text: Who is wise? Let him understand these things[a]. Who is discerning? Let him know them. For the ways of Yahweh are straight, and the righteous walk in them[b], but transgressors stumble in them.
translation:
  language: de
  text: Wer ist weise? Er verstehe diese Dinge[a]. Wer ist verständig? Er erkenne sie. Denn die Wege Jahwes sind gerade[b]; die Gerechten gehen auf ihnen, die Übertreter aber straucheln auf ihnen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräischen Verbformen können auch indikativisch verstanden werden: „Wer ist weise und versteht diese Dinge? Wer ist verständig und erkennt sie?“'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Auch möglich: „richtig“; die Bezeichnung verbindet moralische Geradheit mit dem Bild des Weges.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Abtrünnige“, „Treulose“ oder „Aufrührer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי חָכָם וְיָבֵן אֵלֶּה
  choice: Wer ist weise und versteht dies?
  rationale: Die rhetorische Frage und die koordinierte hebräische Verbform bleiben erhalten. Das Präsens bewahrt zudem die mögliche indikativische Nuance, ohne die Form einseitig als Aufforderung festzulegen.
- source_word: נָבוֹן וְיֵדָעֵם
  choice: Wer ist einsichtig und erkennt es?
  rationale: „Einsichtig“ unterscheidet נבון von „weise“; „erkennt“ gibt ידע in diesem Weisheitskontext natürlicher wieder als das bloße „weiß“. Das singularische „es“ fasst das zuvor genannte Gesamtzeugnis zusammen.
- source_word: יְשָׁרִים
  choice: gerade
  rationale: „Gerade“ bewahrt zugleich die Wegmetaphorik und die moralische Bedeutung von richtig beziehungsweise rechtschaffen.
- source_word: דַּרְכֵי יְהוָה
  choice: die Wege Jahwes
  rationale: Die Konstruktion wird direkt wiedergegeben; der Gottesname erscheint als „Jahwe“, der im modernen deutschen Bibelsprachgebrauch geläufigen Form.
- source_word: וְצַדִּקִים יֵלְכוּ בָם
  choice: Die Gerechten gehen auf ihnen
  rationale: Das substantivierte Adjektiv wird knapp als „die Gerechten“ wiedergegeben. „Auf ihnen gehen“ erhält das Bild von Wegen im natürlichen Deutschen.
- source_word: וּפֹשְׁעִים יִכָּשְׁלוּ בָם
  choice: doch die Abtrünnigen straucheln auf ihnen
  rationale: פֹשְׁעִים bezeichnet Menschen, die sich schuldhaft auflehnen oder abwenden; „Abtrünnige“ bewahrt diesen stärkeren Sinn. „Straucheln“ entspricht dem Wegbild und lässt offen, ob ein Fall folgt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Der Eigenname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen etablierte wissenschaftliche und bibelsprachliche Form; die Vokalisierung bleibt historisch nicht völlig sicher.
- issue: Modus der Formen וְיָבֵן und וְיֵדָעֵם
  choice: 'indikativisch: „versteht … erkennt“'
  alternative: 'jussivisch-exhortativ: „der verstehe … der erkenne“'
  rationale: Die Präfixformen können im weisheitlichen Aufruf auffordernd verstanden werden, lassen sich aber auch als rhetorische Bestimmung des wahrhaft Weisen lesen. Der Haupttext bewahrt die enge Frageform; die Alternative wird in einer Fußnote genannt.
- issue: Wirkung derselben Wege auf Gerechte und Abtrünnige
  choice: 'Beide bewegen sich in Bezug auf dieselben Wege: Die einen gehen, die anderen straucheln darauf.'
  alternative: Die Abtrünnigen scheitern an ihnen.
  rationale: Das wiederholte בָם bindet beide Gruppen an „die Wege Jahwes“. Die Übersetzung bewahrt die theologische Spannung, statt zu erklären, ob das Straucheln durch Ablehnung, Begegnung oder Missbrauch dieser Wege geschieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Wegmetaphorik. „Jahwe“ statt eines ersetzenden Titels; „gerade“, „gehen“ und „straucheln“ bilden das Bildfeld des hebräischen Schlussworts ab. Alle Fußnotenmarker stehen im Haupttext.
