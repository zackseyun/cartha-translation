source:
  edition: WLC
  text: אַשּׁ֣וּר לֹ֣א יוֹשִׁיעֵ֗/נוּ עַל סוּס֙ לֹ֣א נִרְכָּ֔ב וְ/לֹא נֹ֥אמַר ע֛וֹד אֱלֹהֵ֖י/נוּ לְ/מַעֲשֵׂ֣ה יָדֵ֑י/נוּ אֲשֶׁר בְּ/ךָ֖ יְרֻחַ֥ם יָתֽוֹם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/004.yaml
  text: Assyria will not save us[a]; we will not ride on horses, and we will no longer say, ‘Our God,’ to the work of our hands[b]. In you the fatherless finds mercy.
translation:
  language: de
  text: 'Assyrien wird uns nicht retten; auf Pferden werden wir nicht reiten. Und zum Werk unserer Hände werden wir nicht mehr sagen: »Unser Gott!« In dir findet der Vaterlose[a] Erbarmen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Waise«. Das hebräische Wort bezeichnet wörtlich jemanden ohne Vater und kann allgemeiner einen schutzlosen Menschen meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte Satz kann auch ausdrücklich begründend verstanden werden: »Denn in dir findet der Vaterlose Erbarmen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשּׁוּר
  choice: Assyrien
  rationale: Der übliche deutsche Ländername bezeichnet die imperiale Großmacht, auf deren politische Hilfe Israel nicht mehr vertrauen will.
- source_word: יוֹשִׁיעֵנוּ
  choice: wird uns nicht retten
  rationale: Das Hifil von ישׁע bedeutet »retten, befreien«. »Retten« ist natürlich und bewahrt zugleich den theologischen Nachklang des hebräischen Verbs.
- source_word: עַל סוּס לֹא נִרְכָּב
  choice: auf Pferden werden wir nicht reiten
  rationale: Die konkrete Aussage bleibt erhalten und verweist im Zusammenhang auf den Verzicht auf militärische Macht und Selbstsicherung.
- source_word: וְלֹא נֹאמַר עוֹד
  choice: Und ... werden wir nicht mehr sagen
  rationale: עוֹד mit Verneinung bezeichnet das Ende eines bisherigen Verhaltens; »nicht mehr« gibt dies im heutigen Deutsch klar wieder.
- source_word: אֱלֹהֵינוּ
  choice: Unser Gott!
  rationale: Die Form kann morphologisch plural erscheinen, fungiert hier aber als Anrede an ein vermeintliches Gottesbild. Der Singular entspricht dem unmittelbaren Zusammenhang, ohne die Ironie der Aussage auszudeuten.
- source_word: לְמַעֲשֵׂה יָדֵינוּ
  choice: zum Werk unserer Hände
  rationale: Die bildhafte hebräische Wendung für selbst angefertigte Götzen wird eng am Ausgangstext und dennoch verständlich wiedergegeben.
- source_word: יְרֻחַם
  choice: findet ... Erbarmen
  rationale: Das Pual von רחם bezeichnet empfangenes Erbarmen. Die deutsche Wendung »Erbarmen finden« gibt den passiven Sinn natürlich wieder.
- source_word: יָתוֹם
  choice: der Vaterlose
  rationale: יתום bezeichnet wörtlich einen Menschen ohne Vater und kann allgemein einen schutzlosen Menschen meinen. »Der Vaterlose« erhält diese konkrete und zugleich übertragbare Bedeutung.
theological_decisions:
- issue: Funktion von אֲשֶׁר בְּךָ am Anfang des Schlussglieds
  choice: 'Als eigener Satz ohne ausdrücklich kausale Konjunktion: »In dir findet der Vaterlose Erbarmen.«'
  alternative: »Denn in dir findet der Vaterlose Erbarmen.«
  rationale: אֲשֶׁר kann hier erläuternd oder begründend wirken. Die eigenständige Aussage lässt den Zusammenhang erkennen, legt die syntaktische Funktion aber nicht eindeutiger fest als der hebräische Text.
- issue: Bezug von יָתוֹם
  choice: Die konkrete Bezeichnung »der Vaterlose« bleibt ohne interpretierende Ergänzung stehen.
  alternative: »die Waise« oder eine ausdrückliche Identifikation mit dem reuigen Israel
  rationale: Das Bild kann sowohl tatsächlich Schutzlose als auch Israels hilflosen Zustand vor Gott anklingen lassen. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetisch-konfessionellem Klang. Der Parallelismus bleibt durch die aufeinanderfolgenden Verzichtserklärungen erkennbar; das leicht gehobene »Werk unserer Hände« und »Erbarmen finden« bewahrt die Bildsprache, ohne altertümliche Formen zu verwenden.
