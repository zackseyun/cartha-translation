  source_fidelity: Der deutsche Text gibt die drei Verzichtserklärungen und das abschließende Bekenntnis zuverlässig wieder. »Assyrien wird uns nicht retten« trifft יוֹשִׁיעֵנוּ, und »auf Pferden werden wir nicht reiten« bewahrt die konkrete, im Kontext militärisch konnotierte Aussage, ohne sie ausdeutend zu paraphrasieren. »Zum Werk unserer Hände« entspricht לְמַעֲשֵׂה יָדֵינוּ eng. Der Schluss »In dir findet der Vaterlose Erbarmen« gibt die passive Bedeutung von יְרֻחַם idiomatisch wieder und lässt die mögliche erläuternd-begründende Funktion von אֲשֶׁר offen.
