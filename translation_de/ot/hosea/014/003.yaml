base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/003.yaml
  text: Take words with you and return to Yahweh[a]. Say to him, “Take away all iniquity and receive what is good[b], and we will repay with the fruit of our lips.”
translation:
  language: de
  text: 'Nehmt Worte mit euch und kehrt zu Jahwe zurück. Sagt zu ihm: »Nimm alle Schuld hinweg[a] und nimm das Gute an. Und wir wollen dir die Stiere unserer Lippen darbringen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vergib alle Schuld.« Die hebräische Wendung spricht wörtlich vom Tragen beziehungsweise Wegtragen der Schuld.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich nach dem masoretischen Text: »die Stiere unserer Lippen« – ein Bild für gesprochenes Lob, Bekenntnis oder Gelübde als Opfergabe. Einige alte Textzeugen und Ausleger verstehen die Wendung als »die Frucht unserer Lippen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: קְחוּ עִמָּכֶם דְּבָרִים
  choice: Nehmt Worte mit euch
  rationale: Die konkrete Aufforderung, Worte mitzunehmen, bleibt erhalten; der Zusammenhang zeigt, dass damit Worte der Umkehr und des Gebets gemeint sind, ohne dies in den Text einzutragen.
- source_word: וְשׁוּבוּ אֶל־יְהוָה
  choice: und kehrt zu Jahwe zurück
  rationale: „Zurückkehren“ bewahrt sowohl das Bewegungsbild als auch den Sinn der Umkehr. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: כָּל־תִּשָּׂא עָוֹן
  choice: Nimm alle Schuld hinweg
  rationale: Die Wendung נשׂא עון bezeichnet das Wegtragen beziehungsweise Vergeben von Schuld. „Hinwegnehmen“ bewahrt das hebräische Bild und klingt im Deutschen als Bitte natürlich.
- source_word: וְקַח־טוֹב
  choice: und nimm das Gute an
  rationale: Die knappe, in ihrer Ergänzung offene Formulierung wird möglichst wenig ausgedeutet. „Annehmen“ passt zum Gebets- und Opferzusammenhang, während „das Gute“ die Mehrdeutigkeit von טוֹב wahrt.
- source_word: וּנְשַׁלְּמָה פָרִים שְׂפָתֵינוּ
  choice: Dann wollen wir dir die Stiere unserer Lippen darbringen
  rationale: Der volitive Sinn wird mit „wollen wir“ ausgedrückt; „darbringen“ gibt den Opfer- und Gelübdezusammenhang von שׁלם wieder. Das ungewöhnliche masoretische Bild „Stiere unserer Lippen“ bleibt im Haupttext erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bundesbezogene Umkehr in שׁוב
  choice: kehrt … zurück
  alternative: kehrt um
  rationale: „Zurückkehren“ wahrt sowohl die räumliche Metapher als auch den theologischen Ruf zur Umkehr.
- issue: Opfermetapher פָרִים שְׂפָתֵינוּ
  choice: die Stiere unserer Lippen
  alternative: die Frucht unserer Lippen
  rationale: Der masoretische Text spricht von „Stieren“ und verbindet das gesprochene Bekenntnis beziehungsweise Lob mit Opferdarbringung. Die geläufigere alternative Deutung wird in der Fußnote genannt, nicht stillschweigend in den Text übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Gebetssprache. Die auffällige Opfermetapher des Hebräischen bleibt bewusst stehen und wird durch eine Fußnote erschlossen.
