source:
  edition: WLC
  text: יֵֽלְכוּ֙ יֹֽנְקוֹתָ֔י/ו וִ/יהִ֥י כַ/זַּ֖יִת הוֹד֑/וֹ וְ/רֵ֥יחַֽ ל֖/וֹ כַּ/לְּבָנֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/007.yaml
  text: Its shoots will spread out[a], and its splendor will be like the olive tree[b], and its fragrance like Lebanon.
translation:
  language: de
  text: Seine Triebe breiten sich aus[a]. Seine Pracht wird der des Ölbaums gleichen[b] und sein Duft dem des Libanon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Seine Triebe gehen“; gemeint sein kann auch: „Seine Zweige wachsen hinaus“ oder „Seine jungen Triebe breiten sich aus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Seine Schönheit“ beziehungsweise „seine Majestät“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: breiten sich aus
  rationale: Das Verb bedeutet wörtlich „gehen“, beschreibt bei Pflanzentrieben hier aber idiomatisch deren Ausgreifen und Wachstum nach außen.
- source_word: יֹנְקוֹתָיו
  choice: seine Triebe
  rationale: Das Substantiv bezeichnet junge, Nahrung ziehende Sprosse oder Triebe. „Triebe“ ist im Deutschen natürlich und bewahrt das Pflanzenbild.
- source_word: וִיהִי
  choice: wird ... gleichen
  rationale: Die Form führt die zukünftige Beschreibung der Wiederherstellung fort. Zusammen mit der Vergleichspartikel ergibt „wird ... gleichen“ eine natürliche deutsche Wiedergabe.
- source_word: כַזַּיִת
  choice: der des Ölbaums
  rationale: Der bestimmte Ölbaum bleibt als Vergleichsbild erhalten; wegen „gleichen“ wird der Vergleich im Deutschen idiomatisch mit dem Dativ ausgedrückt.
- source_word: הוֹדוֹ
  choice: seine Pracht
  rationale: Das Wort kann Pracht, Schönheit oder Majestät bezeichnen. „Pracht“ wahrt den gehobenen Ton und passt zum sichtbaren Gedeihen des Ölbaums.
- source_word: וְרֵיחַ לוֹ
  choice: und sein Duft
  rationale: Wörtlich steht „und Duft für ihn“. Im Kontext bezeichnet das Pronomen das als Pflanze dargestellte wiederhergestellte Israel; ein Possessivausdruck ist im Deutschen natürlich.
- source_word: כַלְּבָנוֹן
  choice: dem des Libanon
  rationale: Der Libanon ruft den Duft seiner berühmten Wälder und Pflanzenwelt auf. Die knappe Vergleichsform bleibt erhalten.
theological_decisions:
- issue: Bezug der Suffixe in der dritten Person Singular
  choice: Mit „seine/sein“ auf das im Pflanzenbild dargestellte Israel beziehungsweise Ephraim beziehen.
  alternative: Die Suffixe ausdrücklich auf eine einzelne männliche Person beziehen oder durch sächliche Pronomen wiedergeben.
  rationale: Die hebräischen Suffixe sind maskulin Singular und beziehen sich im Zusammenhang auf Israel/Ephraim als kollektive Größe im fortlaufenden Pflanzenbild. Das deutsche „sein“ bewahrt sowohl das grammatische Genus des Bezugsworts als auch die Bildsprache, ohne einen einzelnen Mann vorauszusetzen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die Parallelität der beiden Vergleiche wird durch „der des Ölbaums“ und „dem des Libanon“ knapp und natürlich wiedergegeben; alle Fußnotenmarker stehen im Haupttext.
