  text: שׁ֚וּבָ/ה יִשְׂרָאֵ֔ל עַ֖ד יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּ֥י כָשַׁ֖לְתָּ בַּ/עֲוֺנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/002.yaml
  text: Return[a], O Israel, to Yahweh your God, for you have stumbled in your iniquity.
translation:
  language: de
  text: Kehre um, Israel, zu Jahwe, deinem Gott; denn durch deine Schuld bist du gestrauchelt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in deiner Schuld“. Die hebräische Präposition kann sowohl die Ursache als auch den Bereich oder Umstand bezeichnen, in dem Israel gestrauchelt ist.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: שׁוּבָה
  choice: Kehre um
  rationale: Der Imperativ von שׁוב bezeichnet ein Umkehren oder Zurückkehren. „Kehre um“ bewahrt das Richtungsbild und lässt die im Zusammenhang enthaltene Aufforderung zur Reue erkennen, ohne sie auf den Fachbegriff „Bereue“ zu verengen.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: עַד
  choice: zu
  rationale: Nach einem Verb des Umkehrens bezeichnet עַד hier das Ziel der Bewegung. „Zu“ ist im Deutschen knapp und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֶיךָ
  choice: deinem Gott
  rationale: Die Form enthält ein Suffix der zweiten Person Singular und bringt Israels Bundesbeziehung zu Jahwe unmittelbar zum Ausdruck.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für den Aufruf zur Umkehr ein.
- source_word: כָשַׁלְתָּ
  choice: du bist … gestrauchelt
  rationale: כשל bezeichnet Straucheln oder Stolpern. „Gestrauchelt“ erhält das Bild moralischen Versagens, ohne einen endgültigen Sturz ausdrücklich festzulegen.
- source_word: בַּעֲוֺנֶךָ
  choice: an deiner Schuld
  rationale: עָוֹן kann Schuld beziehungsweise schuldhaftes Vergehen bezeichnen. Die Präposition ב kann Ursache, Mittel oder den Bereich des Strauchelns ausdrücken. „An deiner Schuld“ ist natürliches Deutsch und bewahrt etwas von dieser Bedeutungsbreite.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Namen und entspricht der geläufigen deutschen Umschrift.
- issue: Bedeutung von שׁוב im prophetischen Umkehrruf
  choice: Kehre um
  alternative: Kehre zurück; Bereue
  rationale: Das Verb trägt sowohl die räumliche Vorstellung des Sich-Zuwendens als auch die ethische Aufforderung zur Umkehr. „Kehre um“ hält beides offen und vermeidet eine dogmatisch verengende Wiedergabe.
- issue: Verhältnis von Israels Straucheln zu seiner Schuld
  choice: an deiner Schuld
  alternative: wegen deiner Schuld; in deiner Schuld
  rationale: Die hebräische Präposition lässt eine kausale Deutung und eine Deutung als Bereich beziehungsweise Umstand zu. Der Haupttext wahrt diese Spannung soweit im Deutschen möglich; die eindeutig kausale Lesart steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und das Bild des Strauchelns bleiben erhalten; das Semikolon macht den begründenden Zusammenhang klar.
