  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תֶּאְשַׁם֙ שֹֽׁמְר֔וֹן כִּ֥י מָרְתָ֖ה בֵּֽ/אלֹהֶ֑י/הָ בַּ/חֶ֣רֶב יִפֹּ֔לוּ עֹלְלֵי/הֶ֣ם יְרֻטָּ֔שׁוּ וְ/הָרִיּוֹתָ֖י/ו יְבֻקָּֽעוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/001.yaml
  text: Samaria shall bear her guilt[a], because she has rebelled against her God. They shall fall by the sword; their little children shall be dashed to pieces[b], and their pregnant women ripped open.
translation:
  language: de
  text: Samaria wird ihre Schuld tragen[a], denn sie hat sich gegen ihren Gott aufgelehnt. Sie werden durch das Schwert fallen; ihre kleinen Kinder werden zerschmettert[b] und ihre schwangeren Frauen aufgeschlitzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Samaria wird für schuldig befunden werden« oder »Samaria wird für ihre Schuld büßen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihre Säuglinge werden zerschmettert«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאְשַׁם
  choice: wird ihre Schuld tragen
  rationale: Das Verb אשם kann sowohl das Schuldigwerden beziehungsweise Schuldigsein als auch das Tragen der daraus folgenden Haftung oder Strafe bezeichnen. »Ihre Schuld tragen« bewahrt im Gerichtskontext beide Aspekte.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Die im Deutschen übliche Namensform; die Stadt beziehungsweise ihre Bevölkerung wird im Hebräischen als weibliche Größe personifiziert.
- source_word: מָרְתָה בֵּאלֹהֶיהָ
  choice: hat sich gegen ihren Gott aufgelehnt
  rationale: מרה bezeichnet hier offenen Widerstand gegen Gottes Autorität. Die reflexive Formulierung ist natürliches modernes Deutsch und erhält den Gedanken der Auflehnung.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: werden durch das Schwert fallen
  rationale: Die Wendung bewahrt das hebräische Bild des Fallens und bezeichnet im Zusammenhang den gewaltsamen Tod.
- source_word: עֹלְלֵיהֶם
  choice: ihre kleinen Kinder
  rationale: עולל bezeichnet sehr junge Kinder. »Kleine Kinder« ist verständlich, ohne den Ausdruck unnötig auf Neugeborene einzuengen.
- source_word: יְרֻטָּשׁוּ
  choice: werden zerschmettert
  rationale: Das passive Verb bezeichnet ein gewaltsames Zerschlagen. Die deutliche Formulierung gibt die bewusst brutale Gerichtssprache ohne Beschönigung wieder.
- source_word: וְהָרִיּוֹתָיו
  choice: ihre schwangeren Frauen
  rationale: Der masoretische Text hat einen formal singularischen Suffixbezug (»seine«), doch der kollektive Bezug auf Samaria und seine Bevölkerung sowie der vorangehende Plural legen im Deutschen den pluralischen Anschluss »ihre« nahe.
- source_word: יְבֻקָּעוּ
  choice: aufgeschlitzt
  rationale: בקע im Passiv beschreibt hier das gewaltsame Aufreißen schwangerer Frauen im Krieg. »Aufgeschlitzt« ist drastisch, aber dem Ausgangstext angemessen und im Deutschen unmittelbar verständlich.
theological_decisions:
- issue: Personifikation Samarias und Wechsel zum Plural
  choice: Samaria zunächst als weiblich personifizierte Stadt wiedergeben und anschließend mit dem Plural auf ihre Einwohner beziehen.
  alternative: Alle Bezüge grammatisch singularisch an Samaria binden oder die Personifikation einebnen.
  rationale: Der hebräische Text verbindet die feminine Personifikation Samarias mit pluralischen Verben und Opfern aus ihrer Bevölkerung. Der Wechsel wahrt sowohl das Bild als auch den natürlichen Referenzbezug.
- issue: Explizite Gewalt im Gerichtsorakel
  choice: Die drastische Gewalt ohne Euphemismus im Haupttext wiedergeben.
  alternative: Die Bilder durch allgemeinere Wendungen wie »getötet werden« abschwächen.
  rationale: Die Härte ist ein beabsichtigter Bestandteil des hebräischen Gerichtsorakels. Eine Beschönigung würde Aussage und Wirkung des Textes verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die Gerichtssprache bleibt bewusst drastisch. »Wird … tragen« und »werden … fallen« geben das hebräische Zukunftsgericht natürlich wieder; die Fußnoten erhalten echte lexikalische Alternativen.
