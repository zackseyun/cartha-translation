  text: וְ/אָנֹכִ֤י תִרְגַּ֨לְתִּי֙ לְ/אֶפְרַ֔יִם קָחָ֖/ם עַל זְרֽוֹעֹתָ֑י/ו וְ/לֹ֥א יָדְע֖וּ כִּ֥י רְפָאתִֽי/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/003.yaml
  text: Yet it was I who taught Ephraim to walk[a], taking them in my arms, but they did not know that I healed them.
translation:
  language: de
  text: Ich selbst lehrte Efraim laufen und nahm sie in meine Arme.[a] Doch sie erkannten nicht, dass ich sie heilte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der masoretische Text hat hier schwierige Formen der dritten Person: „er nahm sie auf seine Arme“. Viele verstehen den Sinn im Zusammenhang als Fortsetzung der Ich-Rede des HERRN: „Ich nahm sie in meine Arme.“'
    reason: textual_variant
lexical_decisions:
- source_word: תִרְגַּלְתִּי
  choice: brachte … das Laufen bei
  rationale: Das Verb bezeichnet hier bildhaft, wie ein Elternteil einem Kind das Laufen beibringt. Die konkrete elterliche Fürsorge bleibt so natürlich und klar erhalten.
- source_word: לְאֶפְרַיִם
  choice: Efraim
  rationale: Die Präposition ל wird im Deutschen idiomatisch in die Konstruktion „jemandem das Laufen beibringen“ aufgenommen.
- source_word: קָחָם עַל זְרוֹעֹתָיו
  choice: nahm sie auf meine Arme
  rationale: Der Zusammenhang ist durchgehend Gottes Rede in der ersten Person. Die deutsche Hauptfassung führt diese Rede verständlich fort; die schwierigen Formen der dritten Person im masoretischen Text werden in der Fußnote ausdrücklich dokumentiert.
- source_word: וְלֹא יָדְעוּ
  choice: Doch sie erkannten nicht
  rationale: „Doch“ gibt den Gegensatz zwischen Gottes fürsorglichem Handeln und Efraims fehlender Einsicht wieder. „Erkannten“ bezeichnet hier das bewusste Wahrnehmen und Anerkennen dieser Fürsorge.
- source_word: רְפָאתִים
  choice: ich sie heilte
  rationale: „Heilen“ bewahrt sowohl das konkrete Bild als auch die bei Hosea mögliche weitergehende Bedeutung von Wiederherstellung, ohne diese im Haupttext festzulegen.
theological_decisions:
- issue: Elterliche Bildsprache für Gottes Fürsorge
  choice: Das Bild vom Laufenlernen und Auf-die-Arme-Nehmen bleibt unverändert konkret.
  alternative: Die Aussage als allgemeine Führung oder Fürsorge wiederzugeben.
  rationale: Der hebräische Text schildert Gottes innige Fürsorge in elterlichen Bildern; eine Verallgemeinerung würde diese Aussage abschwächen.
- issue: Personenwechsel in der mittleren Satzhälfte des masoretischen Textes
  choice: Die Hauptfassung führt Gottes Ich-Rede fort und weist in einer Fußnote auf die schwierige dritte Person hin.
  alternative: Wörtlich mit einem unvermittelten „er nahm sie auf seine Arme“ zu übersetzen.
  rationale: Der Kontext spricht klar in der ersten Person, während קָחָם und זְרוֹעֹתָיו formal die dritte Person aufweisen. Die lesbare Kontextdeutung wird deshalb nicht als textlich eindeutig ausgegeben, sondern transparent erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dabei war doch ich es“ betont entsprechend וְאָנֹכִי Gottes eigenes Handeln; kurze Hauptsätze bewahren die Wärme und Eindringlichkeit der elterlichen Bildsprache.
