base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/008.yaml
  text: How can I give you up[a], Ephraim? How can I hand you over, Israel? How can I make you like Admah? How can I set you like Zeboiim? My heart is turned over within me[c][b]; all my compassions are stirred.
translation:
  language: de
  text: Wie könnte ich dich preisgeben, Efraim? Wie könnte ich dich ausliefern, Israel? Wie könnte ich dich zu Adma machen? Wie könnte ich dich Zebojim gleichmachen?[a] Mein Herz wendet sich in mir um;[b] mein ganzes Erbarmen ist zugleich entbrannt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Adma und Zebojim gehörten zu den Städten, deren Untergang zusammen mit dem von Sodom und Gomorra genannt wird; der Vergleich verweist auf völlige Vernichtung (siehe 5. Mose 29,22).
    reason: cross_reference
  - marker: b
    text: 'Oder: „Mein Herz hat sich in mir gewandelt.“ Das Hebräische spricht wörtlich von einem Umkehren oder Umstürzen des Herzens und drückt starke innere Erschütterung aus.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „mein ganzes Erbarmen regt sich“ beziehungsweise „wird warm“. Das hebräische Verb bezeichnet eine heftige, möglicherweise als Wärme vorgestellte innere Bewegung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie könnte ich
  rationale: Die wiederholte Frage drückt Bestürzung und inneres Widerstreben aus, nicht nur eine Frage nach der Art und Weise.
- source_word: אֶתֶּנְךָ
  choice: dich preisgeben
  rationale: נתן bedeutet wörtlich „geben“; im Gerichtskontext bringt „preisgeben“ das Überlassen an das Verderben zum Ausdruck und bewahrt zugleich den schmerzlichen Ton.
- source_word: אֲמַגֶּנְךָ
  choice: dich ausliefern
  rationale: Die Piel-Form von מגן bezeichnet hier das Übergeben oder Ausliefern. Die abweichende Wortwahl erhält den synonymen Parallelismus.
- source_word: כְאַדְמָה
  choice: wie Adma
  rationale: Der Ortsname bleibt erhalten; Adma steht als zerstörte Stadt für vernichtendes Gericht.
- source_word: אֲשִׂימְךָ כִּצְבֹאיִם
  choice: dich Zeboim gleichmachen
  rationale: שים heißt grundsätzlich „setzen, stellen“; in der Vergleichskonstruktion gibt „gleichmachen“ idiomatisch wieder, dass Israel dasselbe Schicksal wie Zeboim treffen würde.
- source_word: נֶהְפַּךְ עָלַי לִבִּי
  choice: Mein Herz kehrt sich in mir um
  rationale: Die Form von הפך bezeichnet ein Umkehren oder Umstürzen. Die Formulierung wahrt das starke körperlich-räumliche Bild innerer Erschütterung; עָלַי wird kontextgemäß mit „in mir“ wiedergegeben.
- source_word: יַחַד
  choice: zugleich … all
  rationale: יַחַד kann „zusammen, zugleich, allesamt“ bedeuten. Die Wiedergabe verbindet den zeitlichen Zusammenklang mit der Gesamtheit des Erbarmens.
- source_word: נִכְמְרוּ נִחוּמָי
  choice: regt sich all mein Erbarmen
  rationale: נכמר bezeichnet ein Erwärmen oder heftiges inneres Bewegtwerden; ניחומים meint hier erbarmende Regungen. Die Formulierung ist natürlich und hält die genaue Bildnuance in einer Fußnote offen.
theological_decisions:
- issue: Anthropopathische Rede von Gottes innerer Bewegung
  choice: Das lebhafte Bild vom sich umkehrenden Herzen und sich regenden Erbarmen bleibt stehen.
  alternative: 'Abstrakt formulieren: „Ich ändere meinen Entschluss.“'
  rationale: Der hebräische Text stellt Gottes Erbarmen bewusst als intensive innere Bewegung dar. Eine abstrakte Paraphrase würde die relationale Spannung zwischen Gericht und Erbarmen vorschnell auflösen.
- issue: Adma und Zeboim als Gerichtsvergleich
  choice: Die Ortsnamen stehen im Haupttext und werden in einer Fußnote erklärt.
  alternative: Die Namen durch „die Städte, die ich vernichtet habe“ ersetzen.
  rationale: Der Ausgangstext nennt die Orte ausdrücklich. Ihre geschichtliche Bedeutung lässt sich erklären, ohne die konkrete Anspielung im Text zu beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vier rhetorischen Fragen und ihre parallele Struktur bleiben erhalten. „Preisgeben“ und „ausliefern“ sind geläufig, ohne den Gerichtston abzuschwächen; die ungewöhnliche Herzensmetapher wird bewusst nicht zu einer bloßen Meinungsänderung verflacht.
