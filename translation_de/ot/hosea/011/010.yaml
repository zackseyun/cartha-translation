source:
  edition: WLC
  text: אַחֲרֵ֧י יְהוָ֛ה יֵלְכ֖וּ כְּ/אַרְיֵ֣ה יִשְׁאָ֑ג כִּֽי ה֣וּא יִשְׁאַ֔ג וְ/יֶחֶרְד֥וּ בָנִ֖ים מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/010.yaml
  text: They will walk after Yahweh[a]; he will roar like a lion. For he himself will roar[b], and sons will come trembling from the west.
translation:
  language: de
  text: Sie werden Jahwe folgen; er wird brüllen wie ein Löwe. Denn er selbst wird brüllen, und Söhne[b] werden zitternd aus dem Westen[a] kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Meer“. Gemeint ist hier wahrscheinlich der Westen als geografische Richtung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Kinder“; im Hebräischen steht wörtlich die maskuline Pluralform „Söhne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה יֵלְכוּ
  choice: Sie werden Jahwe folgen
  rationale: Die Verbindung aus אַחֲרֵי und הלך bezeichnet idiomatisch das Gehen hinter jemandem her und damit das Folgen. „Jahwe folgen“ gibt diesen Sinn in natürlichem modernem Deutsch wieder; der offenbarte Eigenname wird als „Jahwe“ wiedergegeben.
- source_word: כְּאַרְיֵה יִשְׁאָג
  choice: er wird brüllen wie ein Löwe
  rationale: שאג ist das typische Verb für das Brüllen eines Löwen. Der Vergleich und das konkrete Bild bleiben vollständig erhalten.
- source_word: כִּי הוּא יִשְׁאַג
  choice: Denn er selbst wird brüllen
  rationale: כִּי wird erklärend mit „denn“ wiedergegeben. Das ausdrücklich gesetzte Pronomen הוּא erhält durch „er selbst“ sein emphatisches Gewicht; die Wiederholung von „brüllen“ bewahrt die rhetorische Kraft des Hebräischen.
- source_word: וְיֶחֶרְדוּ
  choice: werden zitternd ... kommen
  rationale: חרד bezeichnet angst- oder ehrfurchtsvolles Zittern. Die von מִן markierte Herkunft und der Wiederherstellungskontext legen eine Bewegung nahe; „zitternd ... kommen“ drückt sie aus, ohne ein im Hebräischen ungenanntes Ziel hinzuzufügen.
- source_word: בָנִים
  choice: Söhne
  rationale: Das hebräische Substantiv ist maskulin Plural und bedeutet wörtlich „Söhne“. Die mögliche kollektive Bedeutung „Kinder“ wird in einer Fußnote genannt.
- source_word: מִיָּם
  choice: aus dem Westen
  rationale: Wörtlich steht „vom Meer“. Aus der Perspektive des Landes Israel dient „das Meer“ häufig als geografische Bezeichnung für den Westen; der Kontext der Rückkehr aus verschiedenen Richtungen in Hosea 11,11 stützt diese Lesart. Die wörtliche Form bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Rückkehr als Antwort auf Jahwes löwengleiches Brüllen
  choice: Die Söhne kommen zitternd aus dem Westen.
  alternative: Die Söhne zittern lediglich, ohne dass eine Rückkehrbewegung ausdrücklich gemacht wird.
  rationale: Der Wiederherstellungskontext von Hosea 11,8–11 und die Herkunftsangabe mit מִן sprechen für eine Rückkehrbewegung. Ein Ziel wie „zu ihm“ wird jedoch nicht ergänzt, da es im hebräischen Text nicht ausdrücklich steht.
- issue: Emphase des ausdrücklichen Pronomens הוּא
  choice: „er selbst“
  alternative: Nur „er“ ohne besondere Hervorhebung.
  rationale: Die Übersetzung wahrt die mögliche Hervorhebung des im Hebräischen ausdrücklich gesetzten Subjektpronomens, ohne sie weiter theologisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt klar und mündlich verständlich; die doppelte Verwendung von „brüllen“ bewahrt bewusst die eindringliche Wiederholung des Ausgangstextes. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wörtern.
