  source_fidelity: 'Die Grundstruktur ist zutreffend: die unbestimmten pluralischen Bezüge, die korrelative Aussage, die Baale im Plural und das wiederholte kultische Handeln werden bewahrt. „Vor den Götzenbildern“ verschiebt jedoch die hebräische Präposition לְ, die hier wie bei den Baalen den Empfänger/Adressaten des Kults markiert, zu einer bloß räumlichen Angabe. Zudem kann „zurufen“ eine laute Anrede aus der Entfernung nahelegen, während קרא ל hier neutraler „rufen“/„jemanden rufen“ ausdrückt.'
  naturalness: Der Satz ist insgesamt idiomatisch und gut lesbar. „Je mehr sie ihnen riefen“ ist im Deutschen in diesem knappen, poetisch-prophetischen Kontext natürlicher und semantisch weniger eingeengt als „zuriefen“. Die Satzstellung der kultischen Verben bleibt würdevoll und klar.
  terminology: „Baale“, „Schlachtopfer darbringen“, „Götzenbilder“ und „Räucherwerk verbrennen“ sind sachgerecht. Die Dativkonstruktion „den Götzenbildern verbrannten sie Räucherwerk“ bildet die parallele hebräische Konstruktion zu „den Baalen … Schlachtopfer dar“ angemessen ab. Die Fußnote soll keine mögliche Referenzgruppe wie „Gottes Boten“ hervorheben, da dies trotz Einschränkung unnötig interpretierend wirkt.
