  text: קָרְא֖וּ לָ/הֶ֑ם כֵּ֚ן הָלְכ֣וּ מִ/פְּנֵי/הֶ֔ם לַ/בְּעָלִ֣ים יְזַבֵּ֔חוּ וְ/לַ/פְּסִלִ֖ים יְקַטֵּרֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/002.yaml
  text: The more they called to them[a], the more they went away from them[b]; they kept sacrificing to the Baals and burning incense to idols.
translation:
  language: de
  text: Je mehr sie ihnen riefen[a], desto mehr entfernten sie sich von ihnen; den Baalen brachten sie immer wieder Schlachtopfer dar, und den Götzenbildern[b] verbrannten sie Räucherwerk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie sie ihnen riefen, so gingen sie von ihnen weg.“ Im Hebräischen bleibt ungenannt, wer rief; auch die Bezüge der Pronomen sind im knappen Wortlaut nicht ausdrücklich benannt.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „geschnitzten Bildern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ לָהֶם
  choice: sie ihnen zuriefen
  rationale: Die aktive Verbform im Plural bleibt erhalten, ohne die im Hebräischen nicht genannten Rufenden ausdrücklich mit Gott oder den Propheten gleichzusetzen. „Zurufen“ gibt קרא mit ל im Deutschen natürlich wieder.
- source_word: כֵּן
  choice: je mehr … desto mehr
  rationale: Die deutsche Korrelativkonstruktion gibt den proportionalen Zusammenhang der beiden Vershälften verständlich und idiomatisch wieder.
- source_word: הָלְכוּ מִפְּנֵיהֶם
  choice: entfernten sie sich von ihnen
  rationale: הלך mit מן־פנים bezeichnet hier das Weggehen aus der Gegenwart beziehungsweise die Abwendung; „sich entfernen“ wahrt den räumlichen und relationalen Sinn.
- source_word: לַבְּעָלִים
  choice: den Baalen
  rationale: Der Plural bezeichnet die verschiedenen örtlichen Erscheinungsformen beziehungsweise Kulte des Baal und wird daher als echter Plural wiedergegeben.
- source_word: יְזַבֵּחוּ
  choice: brachten sie immer wieder Schlachtopfer dar
  rationale: Der Imperfekt bezeichnet in diesem Zusammenhang wiederholtes, gewohnheitsmäßiges Handeln. „Schlachtopfer darbringen“ gibt den kultischen Sinn von זבח präzise wieder.
- source_word: לַפְּסִלִים
  choice: vor den Götzenbildern
  rationale: פסילים sind geschnitzte kultische Bildwerke. „Götzenbilder“ ist im modernen Deutschen verständlich und bewahrt gegenüber dem allgemeineren „Götzen“ den Bildcharakter.
- source_word: יְקַטֵּרוּן
  choice: verbrannten sie Räucherwerk
  rationale: Das Piel von קטר bezeichnet im kultischen Zusammenhang das Verbrennen von Räucherwerk beziehungsweise das Erzeugen von Opferrauch; die gewählte Formulierung ist klar und natürlich.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von קָרְאוּ
  choice: Das plurale Subjekt bleibt durch „sie“ unbestimmt.
  alternative: „Gott rief ihnen zu“, „die Propheten riefen ihnen zu“ oder eine unpersönliche Passivform
  rationale: Der hebräische Text nennt die Rufenden nicht. Weder Gott noch die Propheten sollen durch die Übersetzung ausdrücklich eingesetzt werden; zugleich bleibt die aktive Pluralform des Ausgangstextes sichtbar.
- issue: Mehrdeutige pronominale Bezüge
  choice: Die wiederholten Pronomen „sie/ihnen“ bleiben im Haupttext erhalten und werden in der Fußnote erläutert.
  alternative: Die Bezugsgruppen ausdrücklich als Israel und die Propheten benennen
  rationale: Der knappe hebräische Wortlaut lässt die Bezüge formal unausgesprochen. Eine eindeutige Benennung würde eine plausible Deutung in den Text selbst eintragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst knapper prophetischer Satzführung. Die schwer aufzulösenden Pronomen des Hebräischen werden nicht durch ergänzte Personennamen vereindeutigt; die Fußnote macht die echte syntaktische Offenheit zugänglich.
