reference: Hosea 11:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹ֤א יָשׁוּב֙ אֶל אֶ֣רֶץ מִצְרַ֔יִם וְ/אַשּׁ֖וּר ה֣וּא מַלְכּ֑/וֹ כִּ֥י מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/005.yaml
  text: He will not return to the land of Egypt[a], but Assyria will be his king[b], because they have refused to return.
translation:
  language: de
  text: Er wird nicht ins Land Ägypten zurückkehren[a], sondern Assyrien wird sein König sein, denn sie haben sich geweigert, zurückzukehren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Er wird nicht ins Land Ägypten zurückkehren, sondern Assyrien – es wird sein König sein.“ Der knappe hebräische Satzbau kann die Wiederaufnahme Assyriens durch ein Pronomen stärker hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: „Zurückkehren“ kann hier zugleich „umkehren“ im Sinn einer erneuten Hinwendung zu Gott bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָשׁוּב
  choice: Er wird nicht … zurückkehren
  rationale: Das negierte Qal-Imperfekt wird im prophetischen Zusammenhang futurisch wiedergegeben. „Zurückkehren“ wahrt zudem die Wortverbindung zum abschließenden לָשׁוּב.
- source_word: אֶל אֶרֶץ מִצְרַיִם
  choice: ins Land Ägypten
  rationale: Die Wiedergabe erhält das ausdrücklich genannte „Land“ und damit den möglichen Anklang an Israels frühere Knechtschaft und den Auszug.
- source_word: וְאַשּׁוּר
  choice: sondern Assyrien
  rationale: Die Konjunktion wird wegen des Gegensatzes „nicht Ägypten, sondern Assyrien“ adversativ wiedergegeben.
- source_word: הוּא מַלְכּוֹ
  choice: wird sein König sein
  rationale: Die Nominalklausel wird passend zum prophetischen Kontext futurisch verstanden. Das Königsbild bleibt erhalten und wird nicht zu „über ihn herrschen“ geglättet.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für das angekündigte Gericht ein.
- source_word: מֵאֲנוּ
  choice: sie haben sich geweigert
  rationale: Das Perfekt in der 3. Person Plural bezeichnet die gefestigte Weigerung des kollektiv gedachten Volkes, ohne den im Hebräischen unausgesprochenen Bezug ausdrücklich zu ergänzen.
- source_word: לָשׁוּב
  choice: zurückzukehren
  rationale: Die Wiederholung desselben deutschen Verbs erhält die lexikalische Verbindung zum ersten Satzteil sowie die mögliche räumliche und geistliche Bedeutung.
theological_decisions:
- issue: Bedeutung von שוב an beiden Stellen
  choice: An beiden Stellen mit „zurückkehren“ wiedergeben.
  alternative: Im ersten Satzteil „zurückkehren“, im letzten dagegen eindeutig „umkehren“ oder „Buße tun“ schreiben.
  rationale: Hosea nutzt שוב sowohl für räumliche Rückkehr als auch für die Hinwendung zu Gott. Die einheitliche Wiedergabe bewahrt diese rhetorische und theologische Spannung.
- issue: Bezugswort der Pluralform מֵאֲנוּ
  choice: Das im Hebräischen unausgesprochene Subjekt nur mit „sie“ wiedergeben.
  alternative: „Mein Volk hat sich geweigert“ ergänzen.
  rationale: Die Verbform steht im Plural, nennt in diesem Satz aber kein Subjekt. Eine ausdrückliche Ergänzung aus dem Kontext würde über den Wortlaut hinausgehen.
- issue: Fremdherrschaft durch Assyrien
  choice: Das Bild „Assyrien wird sein König sein“ formal bewahren.
  alternative: Deutend mit „Assyrien wird über ihn herrschen“ wiedergeben.
  rationale: Die konkrete Königsmetapher des hebräischen Textes soll stehen bleiben, ohne ihre politische und theologische Aussage auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „zurückkehren“ ist bewusst beibehalten, obwohl eine stilistische Variation möglich wäre. Der Wechsel vom Singular „er/sein“ zum Plural „sie“ folgt dem hebräischen Wechsel zwischen kollektiv gedachtem Israel und den Angehörigen des Volkes.
