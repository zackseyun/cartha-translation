base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/011.yaml
  text: They will come trembling like a bird from Egypt[a], and like a dove from the land of Assyria; and I will settle them in their homes, declares Yahweh.
translation:
  language: de
  text: Sie werden zitternd kommen wie ein Vogel aus Ägypten[a] und wie eine Taube aus dem Land Assur; ich werde sie in ihren Häusern wohnen lassen – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie werden zittern wie ein Vogel aus Ägypten … und wie eine Taube aus dem Land Assur.“ Das hebräische Verb hebt zunächst das Zittern hervor; im Zusammenhang ist wahrscheinlich zugleich ihr zitterndes Herankommen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֶרְדוּ
  choice: Sie werden zitternd kommen
  rationale: חרד bezeichnet Zittern, Beben oder angstvolle Bewegung. Die Herkunftsangaben aus Ägypten und Assur sowie der Zusammenhang der Rückkehr legen nahe, dass hier eine Bewegung mitgedacht ist; „zitternd kommen“ gibt beides wieder. Die wörtlich knappere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: כְצִפּוֹר
  choice: wie ein Vogel
  rationale: צִפּוֹר ist eine allgemeine Bezeichnung für einen meist kleinen Vogel; eine Festlegung auf „Sperling“ wäre unnötig eng.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Die geografische Herkunftsangabe wird direkt und idiomatisch wiedergegeben.
- source_word: וּכְיוֹנָה
  choice: und wie eine Taube
  rationale: יוֹנָה bezeichnet gewöhnlich eine Taube und bewahrt das Vogelbild des hebräischen Textes.
- source_word: מֵאֶרֶץ אַשּׁוּר
  choice: aus dem Land Assur
  rationale: Die ausdrückliche Wendung „Land Assur“ wird beibehalten. „Assur“ ist im deutschsprachigen Bibelregister die geläufige Wiedergabe des alten Reichsnamens.
- source_word: וְהוֹשַׁבְתִּים
  choice: Dann werde ich sie … wohnen lassen
  rationale: 'Der Hifil von ישׁב ist kausativ: jemanden wohnen lassen bzw. ansiedeln. Die Wiedergabe wahrt diese Kausativität; „Dann“ markiert natürlich die folgende Handlung, ohne einen zusätzlichen inhaltlichen Gegensatz einzuführen.'
- source_word: עַל בָּתֵּיהֶם
  choice: in ihren Häusern
  rationale: עַל kann in Verbindung mit dem Wohnen idiomatisch den Ort der Ansiedlung bezeichnen. „In ihren Häusern“ ist im Deutschen natürlich und bleibt näher am konkreten „Häuser“ als „Heimat“ oder „Zuhause“.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: נְאֻם ist eine feierliche prophetische Aussageformel. „Ausspruch“ bewahrt ihren formelhaften Charakter; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Charakter der verheißenen Wiederansiedlung
  choice: ich werde sie in ihren Häusern wohnen lassen
  alternative: ich werde sie in ihre Häuser zurückbringen
  rationale: Der Kausativ von ישׁב bezeichnet das Wohnenlassen bzw. Ansiedeln. Der Kontext legt Wiederherstellung nahe, doch das Verb sagt nicht ausdrücklich „zurückbringen“; diese zusätzliche Bewegungsnuance wird daher nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache bleibt konkret, die prophetische Schlussformel feierlich. Der Haupttext gibt die kontextuell naheliegende Bewegungsnuance wieder, während die genuine lexikalische Mehrdeutigkeit von יֶחֶרְדוּ in der Fußnote erhalten bleibt.
