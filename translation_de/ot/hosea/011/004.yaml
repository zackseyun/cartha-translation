source:
  edition: WLC
  text: בְּ/חַבְלֵ֨י אָדָ֤ם אֶמְשְׁכֵ/ם֙ בַּ/עֲבֹת֣וֹת אַהֲבָ֔ה וָ/אֶהְיֶ֥ה לָ/הֶ֛ם כִּ/מְרִ֥ימֵי עֹ֖ל עַ֣ל לְחֵי/הֶ֑ם וְ/אַ֥ט אֵלָ֖י/ו אוֹכִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/004.yaml
  text: I drew them with cords of a man[a], with ropes of love; and I was to them like those who lift a yoke from their jaws[b], and I bent down to him and fed him.
translation:
  language: de
  text: Mit menschlichen Seilen zog ich sie, mit Stricken der Liebe; ich war für sie wie solche, die das Joch von ihren Kinnbacken heben, und sanft gab ich ihm zu essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text wechselt hier vom Plural („sie“, „ihren“) zum Singular („ihm“). Das Wort vor „ihm“ kann „sanft“ bedeuten; die genaue Konstruktion der Schlusszeile ist unsicher. Manche Übersetzungen glätten den Numeruswechsel und geben sinngemäß wieder: „… und gab ihnen zu essen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַבְלֵי אָדָם
  choice: mit menschlichen Seilen
  rationale: חַבְלֵי bezeichnet Seile oder Stricke; אָדָם kann hier attributiv die menschliche, menschenfreundliche Art des Führens im Gegensatz zur Behandlung eines Tieres ausdrücken. Die deutsche Wendung bewahrt die Bildlichkeit und bleibt verständlich.
- source_word: אֶמְשְׁכֵם
  choice: zog ich sie
  rationale: משך bedeutet ziehen. Die konkrete Bedeutung passt zu den folgenden Seilen und lässt zugleich die übertragene Anziehung anklingen.
- source_word: בַּעֲבֹתוֹת אַהֲבָה
  choice: mit Stricken der Liebe
  rationale: עֲבֹתוֹת sind stärkere Stricke oder Seile. Der Wechsel von „Seilen“ zu „Stricken“ bildet die lexikalische Variation des Hebräischen ab; „der Liebe“ bewahrt die ungewöhnliche Metapher.
- source_word: וָאֶהְיֶה לָהֶם
  choice: Ich war für sie
  rationale: Die knappe Kopula leitet den Vergleich ein. „Für sie“ klingt im Deutschen natürlich und wahrt den fürsorglichen Bezug.
- source_word: כִּמְרִימֵי עֹל
  choice: wie solche, die das Joch ... heben
  rationale: Die pluralische Partizipform wird bewusst beibehalten, ohne sie zu einem Singular zu glätten.
- source_word: עַל לְחֵיהֶם
  choice: von ihren Kinnbacken
  rationale: לְחִי kann Wange oder Kinnbacken bedeuten. Im Bild eines angeschirrten Tieres bezeichnet „Kinnbacken“ den körperlichen Bereich konkreter als „Wangen“.
- source_word: וְאַט
  choice: Behutsam beugte ich mich ... hinab
  rationale: Die schwierige Form wird im Sinn eines sanften Neigens oder Herablassens verstanden. „Behutsam“ nimmt den Aspekt der Schonung auf, ohne das Bild aufzulösen.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Der masoretische Text wechselt vom Plural zum Singular. Dieser Wechsel wird als mögliche kollektive Rede von Israel beibehalten.
- source_word: אוֹכִיל
  choice: gab ihm zu essen
  rationale: Der Hifil von אכל bedeutet „essen lassen, zu essen geben“. Die Formulierung ist natürlich und erhält den kausativen Sinn.
theological_decisions:
- issue: Anthropomorphe und fürsorgliche Bildsprache für Gottes Handeln
  choice: Die konkreten Bilder des Ziehens, Jochhebens, Hinabbeugens und Fütterns bleiben erhalten.
  alternative: Das Bild abstrakt als freundliche Führung und Versorgung Israels wiederzugeben.
  rationale: Der hebräische Text verbindet zärtliche Fürsorge mit der Autorität dessen, der ein Tier führt. Eine Abstraktion würde diese Spannung abschwächen.
- issue: Wechsel vom pluralischen Bezug zum Singular אֵלָיו
  choice: „zu ihm“ und „ihm“ im Haupttext beibehalten.
  alternative: Zur Übereinstimmung mit dem Kontext „zu ihnen“ und „ihnen“ schreiben.
  rationale: Der Singular steht im masoretischen Text und kann Israel als eine kollektive Person oder als Sohn auffassen. Er sollte nicht stillschweigend normalisiert werden.
- issue: Deutung der schwierigen Schlusskonstruktion
  choice: וְאַט als behutsames Hinabbeugen und אוֹכִיל als Speisung verstehen.
  alternative: 'Die Konstruktion auf das Joch beziehen: „Ich neigte ihm Nahrung zu“ oder sinngemäß „ich fütterte sie sanft“.'
  rationale: Die Syntax und einzelne Formen sind schwierig. Die gewählte Lesart ist quellennah und ergibt ein geschlossenes Bild fürsorglichen Handelns, ohne die textliche Unsicherheit zu verschweigen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst konkreter poetischer Bildlichkeit. „Kinnbacken“ ist leicht gehoben, aber im Zusammenhang mit Joch und Tierhaltung präzise. Der auffällige Numeruswechsel und die Unsicherheit der Schlusszeile werden nicht stillschweigend geglättet.
