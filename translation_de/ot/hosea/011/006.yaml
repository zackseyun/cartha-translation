source:
  edition: WLC
  text: וְ/חָלָ֥ה חֶ֨רֶב֙ בְּ/עָרָ֔י/ו וְ/כִלְּתָ֥ה בַדָּ֖י/ו וְ/אָכָ֑לָה מִֽ/מֹּעֲצ֖וֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/006.yaml
  text: A sword will whirl through his cities[a], and will consume his bars[b], and devour them because of their counsels.
translation:
  language: de
  text: Ein Schwert wird in seinen Städten wüten[a], seine Riegel[b] vernichten und sie verschlingen wegen ihrer Pläne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird in seinen Städten kreisen“ oder „wird über seine Städte kommen“. Das hebräische Verb ist schwierig und kann eine kreisende, hereinbrechende oder tobende Bewegung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Torriegel“. Manche verstehen das hebräische Wort als „seine Herrscher“; im Zusammenhang angegriffener Städte liegt jedoch die Bedeutung „Riegel“ näher.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחָלָה
  choice: wird … wüten
  rationale: Die schwierige Verbform bezeichnet hier wahrscheinlich eine heftige, zerstörerische Bewegung oder Wirkung des Schwertes. „Wüten“ ist im Deutschen natürlich, bewahrt die poetische Kraft und legt die genaue Bewegungsart nicht unnötig fest.
- source_word: חֶרֶב
  choice: ein Schwert
  rationale: Das konkrete Substantiv steht im Singular und kann zugleich stellvertretend für Krieg und Gewalteinwirkung stehen.
- source_word: בְּעָרָיו
  choice: in seinen Städten
  rationale: Die Präposition ב wird ihrem gewöhnlichen Sinn entsprechend mit „in“ wiedergegeben; der singularische Possessivbezug bleibt erhalten.
- source_word: וְכִלְּתָה
  choice: vernichten
  rationale: כלה bezeichnet das vollständige Aufbrauchen oder Zu-Ende-Bringen. Im Zusammenhang mit den Verteidigungsanlagen ist „vernichten“ klar und idiomatisch.
- source_word: בַדָּיו
  choice: seine Riegel
  rationale: בדים kann Stangen oder Riegel bezeichnen. Im Bild angegriffener Städte sind deren Tor- oder Sperrriegel naheliegend; die mögliche Deutung als Machthaber wird in der Fußnote genannt.
- source_word: וְאָכָלָה
  choice: und sie verschlingen
  rationale: אכל bedeutet wörtlich „essen“ und in diesem Zerstörungsbild „verschlingen“. Das Pronomen „sie“ ergänzt im Deutschen das für das transitive Verb erforderliche Objekt und bezieht sich am nächsten liegend auf die zuvor genannten Riegel.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: wegen ihrer Pläne
  rationale: 'Die Präposition מן wird kausal verstanden: Das Gericht erfolgt aufgrund ihrer eigenen Beratungen beziehungsweise Pläne. „Pläne“ ist heutiges, verständliches Deutsch und wahrt den negativen Zusammenhang, ohne durch „Ränke“ mehr einzutragen als der Ausdruck selbst sagt.'
theological_decisions:
- issue: Wechsel der pronominalen Suffixe zwischen Singular und Plural
  choice: „seinen Städten“, „seine Riegel“, aber „ihre Pläne“
  alternative: 'Alle Bezüge zur Glättung in den Plural setzen: „ihren Städten … ihre Riegel … ihre Pläne“'
  rationale: 'Der hebräische Text wechselt bewusst oder zumindest tatsächlich von singularischen Suffixen zu einem pluralischen. Die Übersetzung bewahrt diese Spannung: Israel beziehungsweise Ephraim kann als eine kollektive Person erscheinen, während der Plural auf die Menschen und ihre Pläne weist.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Bildsprache. Die Satzstruktur bleibt parallel, ohne steif zu wirken. Der Wechsel zwischen singularischem und pluralischem Possessivbezug wird nicht harmonisiert.
