source:
  edition: WLC
  text: וְ/עַמִּ֥/י תְלוּאִ֖ים לִ/מְשֽׁוּבָתִ֑/י וְ/אֶל עַל֙ יִקְרָאֻ֔/הוּ יַ֖חַד לֹ֥א יְרוֹמֵם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/007.yaml
  text: My people are bent on turning away from me[a]; though they call to the Most High[b], together he does not lift them up.
translation:
  language: de
  text: Mein Volk ist darauf aus, sich von mir abzuwenden.[a] Obwohl sie zum Höchsten rufen, richtet er sie allesamt nicht auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch mit „Untreue“, „Abtrünnigkeit“ oder „Abfall“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gemeinsam erhöhen sie ihn nicht“; möglicherweise auch: „Keiner erhöht ihn.“ Der hebräische Schluss des Verses ist schwer zu deuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: Mein Volk
  rationale: עַם bezeichnet hier das Bundesvolk und nicht primär eine politische Nation; das Suffix der 1. Person Singular wird mit „mein“ wiedergegeben.
- source_word: תְלוּאִים
  choice: ist darauf aus
  rationale: Das schwierige Partizip beschreibt in Verbindung mit לִמְשׁוּבָתִי eine feste, hartnäckige Ausrichtung. „Ist darauf aus“ gibt diese Neigung in natürlichem Deutsch wieder, ohne das Bild eines wörtlichen Hängens aufzuzwingen.
- source_word: לִמְשׁוּבָתִי
  choice: sich von mir abzuwenden
  rationale: מְשׁוּבָה kann Abkehr, Untreue oder Abfall bezeichnen. Die Form mit dem Suffix der 1. Person Singular ist syntaktisch schwierig; im Zusammenhang ist die Abkehr des Volkes von Gott gemeint. Die relationale Wiedergabe vermeidet zugleich das heute weniger geläufige „Abtrünnigkeit“.
- source_word: וְאֶל־עַל
  choice: Obwohl sie zum Höchsten rufen
  rationale: 'אֶל־עַל wird als Ausrichtung „zum Höchsten“ verstanden. Das einleitende וְ erhält wegen des Gegensatzes zur ausbleibenden Aufrichtung einen konzessiven Sinn: „obwohl“.'
- source_word: יִקְרָאֻהוּ
  choice: sie … rufen
  rationale: Die Verbform ist 3. Person Plural. In Verbindung mit אֶל־עַל gibt „zum Höchsten rufen“ den beabsichtigten Anruf idiomatisch wieder; das maskuline Objektsuffix wird in dieser deutschen Fügung nicht eigens ausgedrückt.
- source_word: יַחַד
  choice: allesamt
  rationale: יַחַד betont die Gesamtheit beziehungsweise das gemeinsame Geschick. „Allesamt“ passt hier natürlicher zur negierten Aussage als ein örtlich klingendes „zusammen“.
- source_word: לֹא יְרוֹמֵם
  choice: richtet er sie … nicht auf
  rationale: רוּם kann erhöhen, emporheben oder aufrichten bedeuten. Bei der gewählten Deutung ist der Höchste das Subjekt und die ausbleibende Hilfe für das Volk gemeint. Das im Hebräischen nicht ausdrücklich genannte Objekt wird zum verständlichen deutschen Satz ergänzt; die abweichende Deutung steht in der Fußnote.
theological_decisions:
- issue: Deutung des schwierigen Schlussglieds יַחַד לֹא יְרוֹמֵם
  choice: 'Der Höchste ist das Subjekt: Trotz ihres Rufens richtet er das Volk nicht auf.'
  alternative: „Gemeinsam erhöhen sie ihn nicht“ oder „Keiner erhöht ihn.“
  rationale: Der hebräische Satz ist stark verdichtet und lässt sowohl eine ausbleibende göttliche Hilfe als auch Israels Weigerung, Gott zu erhöhen, zu. Der Gegensatz zwischen dem Rufen zum Höchsten und dem Nicht-Aufrichten spricht für die erste Deutung; die andere wird wegen der echten syntaktischen Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. „Ist darauf aus“ bringt die beharrliche Ausrichtung idiomatisch zum Ausdruck; „allesamt“ wahrt den kollektiven Akzent. Die schwierige Syntax des letzten Satzglieds wird im Haupttext lesbar entschieden, während die echte Mehrdeutigkeit in der Fußnote erhalten bleibt.
