source:
  edition: WLC
  text: לֹ֤א אֶֽעֱשֶׂה֙ חֲר֣וֹן אַפִּ֔/י לֹ֥א אָשׁ֖וּב לְ/שַׁחֵ֣ת אֶפְרָ֑יִם כִּ֣י אֵ֤ל אָֽנֹכִי֙ וְ/לֹא אִ֔ישׁ בְּ/קִרְבְּ/ךָ֣ קָד֔וֹשׁ וְ/לֹ֥א אָב֖וֹא בְּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/009.yaml
  text: I will not carry out the fierceness of my anger[a]; I will not again destroy Ephraim. For I am God and not a man, the Holy One in your midst[c][b], and I will not come into the city.
translation:
  language: de
  text: Ich werde nicht in der Glut meines Zorns handeln; ich werde Ephraim nicht noch einmal vernichten. Denn ich bin Gott und kein Mensch, der Heilige in deiner Mitte. Ich werde nicht in die Stadt kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Schlusswendung ist schwierig. Andere verstehen sie sinngemäß: „Ich werde nicht im Zorn kommen“ oder „Ich werde nicht zum Angriff kommen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶעֱשֶׂה חֲרוֹן אַפִּי
  choice: die Glut meines Zorns ausführen
  rationale: עָשָׂה bezeichnet hier zusammen mit der Zorneswendung das Vollstrecken bzw. Ausführen des angedrohten Gerichts; „ausführen“ bleibt nah am Ausdruck, ohne bloß „tun“ zu sagen.
- source_word: חֲרוֹן אַפִּי
  choice: die Glut meines Zorns
  rationale: חָרוֹן bezeichnet die brennende Heftigkeit des Zorns. „Glut meines Zorns“ bewahrt das hebräische Bild und klingt im Deutschen würdevoll und verständlich.
- source_word: אָשׁוּב לְשַׁחֵת
  choice: nicht noch einmal vernichten
  rationale: שׁוּב mit Infinitiv kann die Wiederholung einer Handlung ausdrücken. „noch einmal“ gibt dies natürlich wieder; die räumliche Grundbedeutung „zurückkehren“ ist hier weniger wahrscheinlich.
- source_word: לְשַׁחֵת
  choice: vernichten
  rationale: Das Piel von שׁחת bezeichnet hier zerstörerisches Verderben im Gericht; „vernichten“ gibt die starke Aussage unmittelbar wieder.
- source_word: אֵל אָנֹכִי וְלֹא־אִישׁ
  choice: ich bin Gott und kein Mensch
  rationale: Die klare Gegenüberstellung von Gott und Mensch wird ohne philosophische Ergänzung bewahrt.
- source_word: בְּקִרְבְּךָ קָדוֹשׁ
  choice: der Heilige in deiner Mitte
  rationale: קָדוֹשׁ wird substantivisch als Selbstbezeichnung verstanden. „in deiner Mitte“ wahrt die an das angesprochene Ephraim gerichtete zweite Person Singular und den Gedanken göttlicher Gegenwart.
- source_word: וְלֹא אָבוֹא בְּעִיר
  choice: Ich werde nicht in die Stadt kommen
  rationale: בְּעִיר lässt sich in der masoretischen Gestalt am unmittelbarsten als „in die Stadt“ verstehen. Da die Schlussklausel schwierig ist, wird diese formnahe Wiedergabe im Haupttext nicht durch eine eindeutige Deutung als Zorn oder Angriff ersetzt.
theological_decisions:
- issue: Gottes Absehen vom vernichtenden Gericht und seine Heiligkeit
  choice: Die Weigerung, den Zorn vollständig auszuführen und Ephraim erneut zu vernichten, wird unmittelbar mit Gottes Gottsein, seinem Nicht-Menschsein und seiner heiligen Gegenwart verbunden.
  alternative: Die Aussage als bloßen emotionalen Umschwung oder als ausdrückliche Lehre über metaphysische Unveränderlichkeit erklären.
  rationale: Der hebräische Text hält Gericht, Erbarmen, göttliche Andersartigkeit und Heiligkeit zusammen, ohne ihr Verhältnis systematisch aufzulösen. Die Übersetzung bewahrt diese Spannung.
- issue: Deutung von וְלֹא אָבוֹא בְּעִיר
  choice: „Ich werde nicht in die Stadt kommen“ im Haupttext
  alternative: „Ich werde nicht im Zorn kommen“ bzw. „Ich werde nicht zum Angriff kommen“
  rationale: Die masoretische Vokalisierung weist formal auf „Stadt“, doch der Zusammenhang legt für manche eine feindliche oder zornige Ankunft nahe. Die Übersetzung folgt der formnahen Lesart und dokumentiert die kontextuelle Alternative in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit formnaher Wiedergabe der schwierigen Schlussklausel. Das Semikolon verbindet die beiden parallelen Verzichtsaussagen; ein neuer Satz hebt ihre theologische Begründung hervor. Der einzige Fußnotenmarker [a] steht unmittelbar an der betreffenden Klausel.
