  text: כִּ֛י נַ֥עַר יִשְׂרָאֵ֖ל וָ/אֹהֲבֵ֑/הוּ וּ/מִ/מִּצְרַ֖יִם קָרָ֥אתִי לִ/בְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/001.yaml
  text: When Israel was a child[a], I loved him, and out of Egypt I called my son.
translation:
  language: de
  text: Als Israel noch ein Kind war,[a] liebte ich ihn, und aus Ägypten rief ich meinen Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn Israel war noch ein Kind, und ich liebte ihn.“ Das hebräische כִּי kann hier zeitlich („als“) oder begründend („denn/weil“) verstanden werden. „Als“ passt gut zum rückblickenden Zusammenhang. Der letzte Satzteil wird später in Matthäus 2,15 angeführt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Als
  rationale: כִּי wird hier am natürlichsten als Einleitung eines zeitlich-umständlichen Rückblicks verstanden. „Als“ gibt diesen Sinn im Deutschen idiomatisch wieder; die mögliche kausale Lesart bleibt in der Fußnote erhalten.
- source_word: נַעַר
  choice: noch jung
  rationale: נַעַר bezeichnet je nach Kontext einen Jungen, Jugendlichen oder jungen Menschen. Bei dem personifizierten Volk Israel gibt „noch jung“ dessen frühe Lebensphase wieder, ohne das Bild durch das deutsche „Kind“ stärker festzulegen als nötig.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier das als einzelne Person dargestellte Volk.
- source_word: וָאֹהֲבֵהוּ
  choice: liebte ich ihn
  rationale: Die erste Person Singular und das maskuline Objektsuffix bleiben erhalten. Die deutsche Präteritalform passt zum erzählenden Rückblick.
- source_word: וּמִמִּצְרַיִם
  choice: und aus Ägypten
  rationale: מִן bezeichnet den Ausgangspunkt. „Aus Ägypten“ bewahrt den deutlichen Bezug zum Exodus.
- source_word: קָרָאתִי
  choice: rief ich
  rationale: קרא kann „rufen“ oder „herbeirufen“ bedeuten. „Rief ich“ ist knapp, natürlich und lässt offen, ob der Akzent auf Anrede oder Berufung liegt.
- source_word: לִבְנִי
  choice: meinen Sohn
  rationale: Die Konstruktion mit קרא bezeichnet hier den Gerufenen. „Meinen Sohn“ bewahrt das auf Israel als Volk bezogene Sohnesbild.
theological_decisions:
- issue: Israel als kollektiver „Sohn“ und die spätere Aufnahme in Matthäus 2,15
  choice: Der Haupttext bezeichnet im unmittelbaren Zusammenhang Hoseas das personifizierte Volk Israel; die Formulierung bleibt zugleich für die spätere neutestamentliche Aufnahme offen.
  alternative: Den Vers bereits in der Übersetzung als ausschließlich direkte messianische Vorhersage formulieren.
  rationale: Hosea blickt auf Israels Auszug aus Ägypten zurück. Die spätere christologische Anwendung darf weder in den hebräischen Ausgangstext hineinformuliert noch durch eine unnötig einschränkende Wiedergabe ausgeschlossen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Noch jung“ klingt bei dem personifizierten Volk natürlicher als „ein Junge“ und erhält die mit נַעַר verbundene Altersunschärfe; die wörtlichere Alternative steht in der Fußnote.
