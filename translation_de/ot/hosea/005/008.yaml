  source_fidelity: Der Entwurf gibt die Abfolge der drei pluralischen Alarmrufe, die Unterscheidung von שׁוֹפָר und חֲצֹצְרָה sowie die knappe, elliptische Schlusswarnung zutreffend wieder. „Hinter dir, Benjamin!“ bewahrt sinnvoll, dass ein Feind im Hebräischen nicht ausdrücklich genannt wird.
