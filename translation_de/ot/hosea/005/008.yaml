source:
  edition: WLC
  text: תִּקְע֤וּ שׁוֹפָר֙ בַּ/גִּבְעָ֔ה חֲצֹצְרָ֖ה בָּ/רָמָ֑ה הָרִ֨יעוּ֙ בֵּ֣ית אָ֔וֶן אַחֲרֶ֖י/ךָ בִּנְיָמִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/008.yaml
  text: 'Blow the horn in Gibeah[a], the trumpet in Ramah; raise the battle cry at Beth-aven: “Behind you[b], Benjamin!”'
translation:
  language: de
  text: 'Blast in Gibea das Horn, in Rama die Trompete! Schlagt in Bet-Awen[a] Alarm: »Hinter dir, Benjamin![b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-Awen ist wahrscheinlich eine polemische Bezeichnung für Bet-El; der Name klingt nach „Haus des Unheils“ oder „Haus der Nichtigkeit“.
    reason: cultural_note
  - marker: b
    text: 'Oder sinngemäß: „Schlagt in Bet-Awen Alarm: Der Feind ist hinter dir, Benjamin!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Stoßt … ins Horn
  rationale: Der Qal-Imperativ Plural von תקע bezeichnet hier das Blasen eines Signalinstruments. Die deutsche Wendung „ins Horn stoßen“ ist natürlich und bewahrt den dringlichen Befehlscharakter.
- source_word: שׁוֹפָר
  choice: Horn
  rationale: שׁוֹפָר bezeichnet ein Horninstrument und wird von der folgenden חֲצֹצְרָה unterschieden. „Horn“ erhält diese lexikalische Unterscheidung, ohne eine unnötige Transliteration einzuführen.
- source_word: בַּגִּבְעָה
  choice: in Gibea
  rationale: Der Ortsname mit Präposition wird idiomatisch als Ort des Alarms wiedergegeben.
- source_word: חֲצֹצְרָה
  choice: Trompete
  rationale: Das Wort bezeichnet ein anderes, gewöhnlich metallenes Blasinstrument als שׁוֹפָר. Im parallelen, elliptischen Satzglied wird das Verb sinngemäß aus dem ersten Satzglied ergänzt.
- source_word: בָּרָמָה
  choice: in Rama
  rationale: Der Ortsname mit Präposition wird parallel zu „in Gibea“ wiedergegeben.
- source_word: הָרִיעוּ
  choice: Schlagt … Alarm
  rationale: Der Hifil-Imperativ Plural von ריע/רוע kann einen lauten Ruf oder ein Kriegssignal bezeichnen. Im Zusammenhang einer herannahenden Gefahr gibt „Alarm schlagen“ die Warnfunktion natürlich wieder.
- source_word: בֵּית אָוֶן
  choice: Bet-Awen
  rationale: Der im hebräischen Text stehende Ortsname wird transliteriert. Seine wahrscheinlich polemische Anspielung auf Bet-El wird in einer Fußnote erläutert, statt im Haupttext aufgelöst zu werden.
- source_word: אַחֲרֶיךָ
  choice: Hinter dir
  rationale: Die Präposition mit maskulinem Singularsuffix steht abrupt und ausrufartig. „Hinter dir“ bewahrt die knappe Warnung, ohne den im Hebräischen nicht ausdrücklich genannten Feind in den Haupttext einzufügen.
- source_word: בִּנְיָמִין
  choice: Benjamin
  rationale: Der Name bezeichnet hier wahrscheinlich den Stamm beziehungsweise sein Gebiet und wird in der direkten Anrede beibehalten.
theological_decisions:
- issue: Deutung von בֵּית אָוֶן als polemische Bezeichnung für Bet-El
  choice: Der Haupttext behält „Bet-Awen“ bei; die wahrscheinliche polemische Bedeutung wird in einer Fußnote genannt.
  alternative: Interpretierend „Haus des Unheils/Nichtigen“ übersetzen oder unmittelbar „Bet-El“ einsetzen.
  rationale: בֵּית אָוֶן steht als Name im überlieferten hebräischen Text. Hoseas Wortwahl dürfte Bet-El polemisch umbenennen, doch eine Ersetzung im Haupttext würde die sprachliche Spannung vorschnell auflösen.
- issue: Ergänzung eines ausdrücklich genannten Feindes bei אַחֲרֶיךָ
  choice: Die knappe Formulierung „Hinter dir, Benjamin!“ bleibt im Haupttext erhalten.
  alternative: „Der Feind ist hinter dir, Benjamin!“
  rationale: Der Warnruf legt einen Feind nahe, nennt ihn aber nicht ausdrücklich. Die Übersetzung bewahrt deshalb die Ellipse und erläutert die mögliche Ergänzung nur in der Fußnote.
translation_notes:
  register: Dignliches, gegenwärtiges Standarddeutsch mit kurzen, alarmierenden Imperativen. Die Instrumente „Horn“ und „Trompete“ bleiben unterschieden. Die abrupte Schlusswarnung und die Mehrdeutigkeit des hebräischen Ausdrucks werden bewahrt.
