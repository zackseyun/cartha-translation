  text: וְ/עָנָ֥ה גְאֽוֹן יִשְׂרָאֵ֖ל בְּ/פָנָ֑י/ו וְ/יִשְׂרָאֵ֣ל וְ/אֶפְרַ֗יִם יִכָּֽשְׁלוּ֙ בַּ/עֲוֺנָ֔/ם כָּשַׁ֥ל גַּם יְהוּדָ֖ה עִמָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/005.yaml
  text: The pride of Israel testifies against him[a], and Israel and Ephraim will stumble in their guilt[c][b]; Judah also will stumble with them.
translation:
  language: de
  text: Der Stolz Israels legt gegen Israel Zeugnis ab[a]. Israel und Ephraim werden in ihrer Schuld straucheln[b]; auch Juda ist mit ihnen gestrauchelt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Hoheit Israels zeugt ihm ins Angesicht“ beziehungsweise „vor ihm“. Die hebräische Wendung lautet wörtlicher „in seinem Angesicht“; hier ist wahrscheinlich gemeint, dass Israels Stolz als belastender Zeuge gegen Israel auftritt.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort kann auch „Verfehlung“ oder die aus ihr erwachsende Schuldfolge bezeichnen. Die Wendung kann je nach Zusammenhang auch kausal verstanden werden: „aufgrund ihrer Schuld“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Auch Juda wird mit ihnen straucheln“ beziehungsweise „strauchelt mit ihnen“. Die hebräische Verbform unterscheidet sich von derjenigen im vorhergehenden Satzteil und lässt mehr als eine zeitlich-aspektuelle Wiedergabe zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנָה
  choice: legt Zeugnis ab
  rationale: 'Das Verb wird hier im forensischen Sinn verstanden: Israels Stolz tritt als belastender Zeuge auf. Die Wendung ist im Deutschen natürlich und bewahrt den Anklang an eine gerichtliche Anklage.'
- source_word: גְאוֹן
  choice: Stolz
  rationale: Im Zusammenhang von Anklage, Schuld und Fall bezeichnet das Wort am ehesten den moralisch negativen Stolz, auch wenn grundsätzlich „Hoheit“ möglich ist.
- source_word: בְּפָנָיו
  choice: gegen es selbst
  rationale: Die Präposition mit „Gesicht“ ist wörtlich räumlich, hat hier aber wahrscheinlich belastenden Sinn. Das singularische Pronomen bezieht sich auf Israel als Kollektiv; das deutsche Neutrum vermeidet eine unbegründete Personifizierung.
- source_word: יִכָּשְׁלוּ
  choice: werden zu Fall kommen
  rationale: Die Form bezeichnet ein künftiges Straucheln oder Scheitern. „Zu Fall kommen“ bewahrt das Bild und klingt in diesem Gerichtszusammenhang natürlich.
- source_word: בַּעֲוֹנָם
  choice: durch ihre Schuld
  rationale: עָוֹן kann Verfehlung, Schuld oder deren Folgen bezeichnen. „Durch ihre Schuld“ gibt den wahrscheinlichen kausalen Zusammenhang wieder, ohne die moralische Verantwortlichkeit abzuschwächen.
- source_word: כָּשַׁל
  choice: ist zu Fall gekommen
  rationale: Der Wechsel vom Imperfekt zur qatal-Form wird als Perfekt wiedergegeben. So bleibt die im Hebräischen erkennbare aspektuelle Spannung zwischen Israel/Ephraim und Juda erhalten.
- source_word: עִמָּם
  choice: mit ihnen
  rationale: Juda wird in denselben Fall beziehungsweise dasselbe Gericht wie Israel und Ephraim einbezogen.
theological_decisions:
- issue: Bedeutung von Israels גְאוֹן
  choice: Der moralische Stolz Israels sagt gegen Israel aus.
  alternative: Israels Hoheit oder Majestät legt ihm ins Angesicht beziehungsweise vor ihm Zeugnis ab.
  rationale: Der unmittelbare Kontext handelt von Schuld und Fall unter dem Gericht. Dennoch wird die mögliche Bedeutung „Hoheit“ in der Fußnote offengehalten.
- issue: Zeit- und Aspektwert des Verbs bei Juda
  choice: „Juda ist … zu Fall gekommen“
  alternative: „Juda wird … zu Fall kommen“ oder „Juda kommt … zu Fall“
  rationale: Die qatal-Form unterscheidet sich von den vorangehenden Imperfektformen. Das deutsche Perfekt bildet diesen Wechsel ab, ohne daraus ein starres zeitliches System abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die forensische Bildsprache des ersten Satzes und die Metapher des Strauchelns beziehungsweise Fallens bleiben erhalten. Das kollektive Israel wird grammatisch als Neutrum aufgenommen; die aspektuelle Differenz beim Verb Judas wird im Haupttext sichtbar gemacht.
