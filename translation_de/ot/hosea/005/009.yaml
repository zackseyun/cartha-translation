source:
  edition: WLC
  text: אֶפְרַ֨יִם֙ לְ/שַׁמָּ֣ה תִֽהְיֶ֔ה בְּ/י֖וֹם תּֽוֹכֵחָ֑ה בְּ/שִׁבְטֵי֙ יִשְׂרָאֵ֔ל הוֹדַ֖עְתִּי נֶאֱמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/009.yaml
  text: Ephraim will become a desolation in the day of rebuke[c][b][a]; among the tribes of Israel I have made known what is sure.
translation:
  language: de
  text: Ephraim wird am Tag der Zurechtweisung zur Einöde werden.[a][b] Unter den Stämmen Israels habe ich bekannt gemacht, was gewiss ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Entsetzen“. Das hebräische Wort kann eine Verwüstung bezeichnen, die Schauder oder Bestürzung hervorruft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am Tag der Bestrafung“ beziehungsweise „am Tag des Gerichts“. „Zurechtweisung“ gibt die Grundbedeutung wieder; im Zusammenhang hat das Wort strafende Kraft.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Zuverlässiges habe ich bekannt gemacht.“ Der Schluss hebt hervor, dass die angekündigte Gerichtsentscheidung feststeht und verlässlich ist.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der Eigenname bleibt entsprechend dem Hebräischen erhalten. Dass Ephraim hier für das Nordreich stehen kann, ergibt sich aus dem Zusammenhang und wird nicht in den Haupttext hineingedeutet.
- source_word: לְשַׁמָּה
  choice: zur Verwüstung
  rationale: שַׁמָּה bezeichnet Verwüstung oder einen verwüsteten, Entsetzen erregenden Zustand. Die Verbindung mit werden gibt die hebräische Konstruktion היה mit לְ natürlich wieder.
- source_word: תִהְיֶה
  choice: wird … werden
  rationale: Die Konstruktion kann den Eintritt in einen Zustand ausdrücken; daher ist werden treffender als das statischere sein.
- source_word: בְּיוֹם תּוֹכֵחָה
  choice: am Tag der Zurechtweisung
  rationale: תּוֹכֵחָה bedeutet zunächst Zurechtweisung oder Rüge, besitzt hier aber im Gerichtskontext eine strafende Färbung. Die Übersetzung bewahrt diese Spannung.
- source_word: בְּשִׁבְטֵי יִשְׂרָאֵל
  choice: unter den Stämmen Israels
  rationale: Die Präposition ב wird räumlich beziehungsweise auf den Wirkungsbereich bezogen verstanden. Unter ist im Deutschen idiomatisch und wahrt die mögliche Bedeutung innerhalb beziehungsweise inmitten.
- source_word: הוֹדַעְתִּי
  choice: habe ich bekannt gemacht
  rationale: Der Hifil von ידע bedeutet bekannt machen oder kundtun. Das deutsche Perfekt gibt die vollzogene Bekanntgabe mit fortdauernder Geltung natürlich wieder.
- source_word: נֶאֱמָנָה
  choice: was gewiss ist
  rationale: Das Wort aus der Wurzel אמן bezeichnet Festigkeit, Verlässlichkeit und Gewissheit. Die substantivische Wiedergabe passt als Inhalt der göttlichen Bekanntgabe.
theological_decisions:
- issue: Ob Ephraim ausdrücklich als Nordreich erklärt werden soll
  choice: Ephraim ohne erläuternde Erweiterung
  alternative: das Nordreich Israel
  rationale: Der hebräische Text nennt Ephraim. Die metonymische Bedeutung ist möglich, soll aber nicht interpretierend in den Haupttext eingefügt werden.
- issue: Wie stark תּוֹכֵחָה im Gerichtszusammenhang wiederzugeben ist
  choice: Zurechtweisung
  alternative: Bestrafung oder Gericht
  rationale: Zurechtweisung bleibt näher an der lexikalischen Grundbedeutung, während der Zusammenhang die strafende und gerichtliche Schärfe erkennen lässt.
- issue: Bezug und Funktion von נֶאֱמָנָה
  choice: 'Inhalt der Bekanntgabe: „was gewiss ist“'
  alternative: 'adverbial: „Zuverlässiges habe ich bekannt gemacht“ oder „ich habe es zuverlässig kundgetan“'
  rationale: Die substantivische Auffassung ist syntaktisch gut möglich und betont die Gewissheit des angekündigten Gerichts, ohne die grammatische Mehrdeutigkeit zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der prophetische Gerichtston bleibt knapp und eindringlich. „Zurechtweisung“ ist allgemein verständlich, wahrt aber im Unterschied zu „Bestrafung“ die lexikalische Spannung des Hebräischen.
