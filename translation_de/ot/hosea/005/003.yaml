  text: אֲנִי֙ יָדַ֣עְתִּי אֶפְרַ֔יִם וְ/יִשְׂרָאֵ֖ל לֹֽא נִכְחַ֣ד מִמֶּ֑/נִּי כִּ֤י עַתָּה֙ הִזְנֵ֣יתָ אֶפְרַ֔יִם נִטְמָ֖א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/003.yaml
  text: I know Ephraim[a], and Israel is not hidden from me; for now, Ephraim, you have played the prostitute[b]; Israel is defiled.
translation:
  language: de
  text: Ich kenne Ephraim, und Israel ist mir nicht verborgen. Denn jetzt hast du dich prostituiert[a], Ephraim; Israel ist unrein geworden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild der Prostitution steht bei Hosea für die Untreue gegenüber Gott.
    reason: metaphorical_clarification
  - marker: b
    text: 'Oder: „Israel ist befleckt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Ich kenne
  rationale: Das hebräische Perfekt bezeichnet hier Gottes feststehende, gegenwärtige Kenntnis. Das deutsche Präsens gibt dies im Zusammenhang natürlich wieder.
- source_word: לֹא נִכְחַד מִמֶּנִּי
  choice: ist mir nicht verborgen
  rationale: Die passive Form und der Gedanke, dass Israel sich Gottes Kenntnis nicht entziehen kann, bleiben ohne zusätzliche Modalität erhalten.
- source_word: כִּי עַתָּה
  choice: Denn jetzt
  rationale: כִּי begründet die vorausgehende Aussage, während עַתָּה die gegenwärtige Lage hervorhebt.
- source_word: הִזְנֵיתָ
  choice: hast du dich prostituiert
  rationale: Die Form spricht Ephraim direkt an und bewahrt Hoseas bewusst anstößiges Bild sexueller Untreue. Die Wendung ist im heutigen Deutsch verständlich und weniger altertümlich als „Hurerei treiben“.
- source_word: נִטְמָא
  choice: ist unrein geworden
  rationale: Die Form bezeichnet das Eintreten eines Zustands der Unreinheit. „Unrein geworden“ wahrt sowohl den resultativen Aspekt als auch die moralisch-kultische Färbung.
- source_word: אֶפְרַיִם / יִשְׂרָאֵל
  choice: Ephraim / Israel
  rationale: Beide Eigennamen werden beibehalten, damit der poetische Parallelismus und die enge, aber nicht ausdrücklich gleichgesetzte Beziehung der Bezeichnungen erhalten bleiben.
theological_decisions:
- issue: Sexuelles Bild für die Untreue gegenüber Gott
  choice: Das Bild der Prostitution ausdrücklich im Haupttext bewahren
  alternative: allgemein mit „du bist untreu geworden“ wiedergeben
  rationale: Hosea drückt die Bundesuntreue absichtlich durch ein drastisches sexuelles Bild aus. Eine Verallgemeinerung würde die prophetische Schärfe abschwächen.
- issue: Zeitbezug von Gottes Wissen
  choice: 'Präsens: „Ich kenne“'
  alternative: 'Vergangenheit: „Ich kannte“ oder „Ich habe gekannt“'
  rationale: Im Zusammenhang geht es um Gottes gegenwärtige und uneingeschränkte Kenntnis Ephraims; das deutsche Präsens vermittelt diesen Sinn, ohne die hebräische Verbform zu leugnen.
- issue: Verhältnis von Ephraim und Israel
  choice: Beide Bezeichnungen unverändert nebeneinander stehen lassen
  alternative: Ephraim ausdrücklich als Bezeichnung für das Nordreich beziehungsweise Israel erklären
  rationale: Der Haupttext soll die poetische Spannung und den Sprachgebrauch Hoseas bewahren, statt die Begriffe interpretierend gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Das drastische Bild des hebräischen Textes wird nicht beschönigt; „unrein geworden“ wahrt zugleich die moralische und kultische Bedeutungsweite.
