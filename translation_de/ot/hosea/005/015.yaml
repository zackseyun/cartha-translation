base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/015.yaml
  text: I will go[a], I will return to my place until they acknowledge their guilt and seek my face[b]; in their distress they will seek me earnestly.
translation:
  language: de
  text: Ich werde fortgehen und an meinen Ort zurückkehren, bis sie ihre Schuld erkennen[a] und mein Angesicht suchen. In ihrer Not werden sie mich inständig suchen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis sie ihre Schuld tragen“ oder „bis sie ihre Schuld eingestehen“. Das hebräische Verb kann sowohl das Schuldigsein beziehungsweise Schuldtragen als auch das Eingeständnis der Schuld bezeichnen; das anschließende Suchen des HERRN spricht hier für „ihre Schuld erkennen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden sie mich früh suchen“. Die hebräische Wendung bezeichnet wahrscheinlich ein eifriges oder inständiges Suchen und nicht nur das Suchen zu früher Stunde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֵךְ אָשׁוּבָה
  choice: Ich werde fortgehen, an meinen Ort zurückkehren
  rationale: Die beiden Bewegungsverben werden in ihrer Abfolge bewahrt. „Fortgehen“ verdeutlicht im Deutschen den Rückzug, ohne über die räumlich-relationale Bildsprache hinauszugehen; שׁוב wird sachgemäß mit „zurückkehren“ wiedergegeben.
- source_word: מְקוֹמִי
  choice: mein Ort
  rationale: Die wörtliche und bewusst unbestimmte räumliche Metapher bleibt erhalten; „Wohnort“ oder „Heim“ würde den Ausdruck stärker festlegen als der hebräische Text.
- source_word: עַד אֲשֶׁר
  choice: bis
  rationale: Die einfache temporale Grenze des göttlichen Rückzugs wird natürlich und genau wiedergegeben.
- source_word: יֶאְשְׁמוּ
  choice: sie ihre Schuld erkennen
  rationale: אשם kann das Schuldigwerden, das Tragen von Schuld oder deren Anerkennung bezeichnen. Das anschließende Suchen von Gottes Angesicht legt hier das bewusste Erkennen der eigenen Schuld nahe, ohne die lexikalischen Alternativen zu verschweigen.
- source_word: וּבִקְשׁוּ פָנַי
  choice: und mein Angesicht suchen
  rationale: Die biblische Wendung wird bewahrt. Sie bezeichnet das Suchen nach Gottes Gegenwart oder Zuwendung, bleibt aber auch im modernen Deutschen verständlich.
- source_word: בַּצַּר לָהֶם
  choice: In ihrer Not
  rationale: Dies ist die natürliche deutsche Wiedergabe der idiomatischen Angabe des Umstands, in dem sie sich befinden.
- source_word: יְשַׁחֲרֻנְנִי
  choice: werden sie mich inständig suchen
  rationale: Das Piel von שׁחר kann wörtlich mit frühem Suchen verbunden sein, drückt hier aber wahrscheinlich eifriges, dringliches Suchen aus. „Inständig“ gibt diese Intensität im heutigen Deutsch natürlich wieder.
theological_decisions:
- issue: Art des göttlichen Rückzugs
  choice: Gott zieht sich im Bild des Fortgehens und Zurückkehrens an seinen Ort zurück, bis das Volk seine Schuld erkennt und ihn sucht.
  alternative: Eine Aussage völliger metaphysischer Abwesenheit oder lediglich veränderter menschlicher Wahrnehmung.
  rationale: Der Text beschreibt einen relationalen und gerichtlichen Rückzug, erklärt dessen metaphysische Tragweite jedoch nicht. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutung von יֶאְשְׁמוּ
  choice: Schuld erkennen
  alternative: schuldig werden; ihre Schuld tragen; für schuldig befunden werden
  rationale: Der Kontext des anschließenden Suchens nach Gottes Angesicht spricht für ein Eingeständnis beziehungsweise Erkennen der Schuld; die mögliche objektive Bedeutung des Verbs bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und theologisch prägnante Wendung „mein Angesicht suchen“ bleibt erhalten; „inständig suchen“ vermittelt die idiomatische Intensität des Schlussverbs. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
