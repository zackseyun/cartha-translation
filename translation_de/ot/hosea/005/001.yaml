source:
  edition: WLC
  text: שִׁמְעוּ זֹ֨את הַ/כֹּהֲנִ֜ים וְ/הַקְשִׁ֣יבוּ בֵּ֣ית יִשְׂרָאֵ֗ל וּ/בֵ֤ית הַ/מֶּ֨לֶךְ֙ הַאֲזִ֔ינוּ כִּ֥י לָ/כֶ֖ם הַ/מִּשְׁפָּ֑ט כִּֽי פַח֙ הֱיִיתֶ֣ם לְ/מִצְפָּ֔ה וְ/רֶ֖שֶׁת פְּרוּשָׂ֥ה עַל תָּבֽוֹר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/001.yaml
  text: Hear this[a], O priests; pay attention, house of Israel; and give ear, house of the king. For the judgment is for you[b], because you have been a trap at Mizpah and a net spread out upon Tabor.
translation:
  language: de
  text: 'Hört dies, ihr Priester! Gebt acht, Haus Israel! Horcht auf, Haus des Königs! Denn euch gilt das Gericht[a]: Ihr seid bei Mizpa zur Falle geworden und zu einem auf dem Tabor ausgespannten Netz.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn gegen euch richtet sich das Gericht.“ Die knappe hebräische Formulierung kann bedeuten, dass das Gericht sie betrifft oder sich ausdrücklich gegen sie richtet.'
    reason: alternative_reading
  - marker: b
    text: Mizpa und Tabor sind Ortsnamen. Wahrscheinlich werden hier bekannte Stätten in Israel mit dem Bild des Fangens verbunden.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Imperativ gibt den prophetischen Höraufruf knapp und würdig wieder; die folgenden Hörverben werden zur Wahrung der rhetorischen Steigerung anders formuliert.
- source_word: הַקְשִׁיבוּ
  choice: Gebt acht
  rationale: Die Wendung bezeichnet aufmerksames Hinhören und ist im heutigen Standarddeutsch natürlich.
- source_word: הַאֲזִינוּ
  choice: Horcht auf
  rationale: Die eigenständige Formulierung bewahrt die dreifache, gesteigerte Aufforderung des Hebräischen.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die traditionelle kollektive Bezeichnung bleibt erhalten, ohne sie vereinfachend nur mit „Israel“ wiederzugeben.
- source_word: בֵּית הַמֶּלֶךְ
  choice: Haus des Königs
  rationale: Die formale Entsprechung wahrt den Parallelismus zu „Haus Israel“ und lässt offen, ob Hof, Dynastie oder königliche Führung im Vordergrund steht.
- source_word: כִּי לָכֶם הַמִּשְׁפָּט
  choice: Denn euch gilt das Gericht
  rationale: Die knappe deutsche Wendung bewahrt, dass das Gericht die Angeredeten betrifft, ohne die im Hebräischen mögliche Nuance „gegen euch“ vollständig auszuschreiben.
- source_word: פַח
  choice: Falle
  rationale: Das Wort bezeichnet eine Fangvorrichtung; „Falle“ ist klar, gegenwärtig und passt zur parallelen Netzmetapher.
- source_word: לְמִצְפָּה
  choice: bei Mizpa
  rationale: Die Präposition wird mit dem Ortsnamen lokal verstanden; der Eigenname wird transliteriert.
- source_word: רֶשֶׁת פְּרוּשָׂה
  choice: ein ausgespanntes Netz
  rationale: Die bildhafte Konstruktion des Hebräischen wird prägnant und anschaulich bewahrt.
- source_word: עַל תָּבוֹר
  choice: über dem Tabor
  rationale: „Über“ gibt die räumliche Ausbreitung des Netzes wieder, ohne die topografische Bildlichkeit einzuebnen.
theological_decisions:
- issue: Bezug und Richtung des Gerichts
  choice: Die Priester, Israel und das Königshaus werden als vom göttlichen Gericht Betroffene angeredet.
  alternative: 'Die Aussage kann allgemeiner bedeuten, dass der Rechtsfall sie betrifft, oder ausdrücklich: „Das Gericht richtet sich gegen euch.“'
  rationale: Der folgende Vorwurf mit Falle und Netz zeigt Schuld und drohendes Gericht an. „Euch gilt das Gericht“ erhält zugleich die knappe Mehrdeutigkeit der hebräischen Formulierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Direktheit. Die drei Hörimperative sind bewusst verschieden wiedergegeben; Parallelismus, Gerichtsansage und Fangbilder bleiben erhalten.
