id: HOS.5.7
reference: Hosea 5:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/יהוָ֣ה בָּגָ֔דוּ כִּֽי בָנִ֥ים זָרִ֖ים יָלָ֑דוּ עַתָּ֛ה יֹאכְלֵ֥/ם חֹ֖דֶשׁ אֶת חֶלְקֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/007.yaml
  text: They have dealt faithlessly with Yahweh[a], for they have borne foreign children[b]. Now the new moon will devour them with their portions.
translation:
  language: de
  text: Sie sind dem HERRN untreu geworden, denn sie haben fremde Kinder hervorgebracht.[a] Nun wird der Neumond sie samt ihren Anteilen verzehren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Fremde Kinder“ kann Kinder aus bundeswidrigen Verbindungen bezeichnen oder allgemeiner eine Generation, die dem HERRN entfremdet ist.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Nun wird ein Monat sie samt ihren Anteilen verzehren.“ Das hebräische Wort חֹדֶשׁ kann sowohl „Neumond“ als auch „Monat“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיהוָה בָּגָדוּ
  choice: Sie sind dem HERRN untreu geworden
  rationale: בגד bezeichnet treuloses oder verräterisches Handeln, besonders in einer Bundesbeziehung. Die Präposition ב markiert den, dem gegenüber die Untreue geschieht. „Dem HERRN untreu geworden“ gibt dies in natürlichem, würdigem Deutsch wieder.
- source_word: בָנִים זָרִים
  choice: fremde Kinder
  rationale: זָרִים kann „fremd“ oder „andersartig“ bedeuten. Die wörtlich nahe Formulierung bewahrt die Offenheit zwischen Kindern aus unerlaubten Verbindungen und einer dem HERRN entfremdeten Generation.
- source_word: יָלָדוּ
  choice: hervorgebracht
  rationale: Das Verb kann das Gebären oder Hervorbringen von Nachkommen bezeichnen. „Hervorgebracht“ vermeidet eine unnötige Festlegung auf die mütterliche oder väterliche Perspektive.
- source_word: חֹדֶשׁ
  choice: der Neumond
  rationale: חֹדֶשׁ kann sowohl „Neumond“ als auch „Monat“ heißen. „Neumond“ bewahrt hier den möglichen kultischen Bezug; die zeitliche Lesart wird in der Fußnote genannt.
- source_word: יֹאכְלֵם
  choice: wird sie … verzehren
  rationale: אכל bedeutet wörtlich „essen“, wird im Gerichtsbild jedoch treffend mit „verzehren“ wiedergegeben.
- source_word: חֶלְקֵיהֶם
  choice: ihren Anteilen
  rationale: חֵלֶק kann Anteil, zugeteilten Besitz oder Landbesitz bezeichnen. „Anteile“ wahrt diese semantische Breite.
theological_decisions:
- issue: Bedeutung von „fremde Kinder“
  choice: Die hebräische Metapher bleibt im Haupttext erhalten.
  alternative: Kinder aus Verbindungen mit Fremden oder bildlich eine dem HERRN entfremdete Generation
  rationale: Der Ausdruck hat im prophetischen Kontext eine bundesbezogene Bedeutung und darf weder auf ethnische Herkunft noch ausschließlich auf geistliche Entfremdung verengt werden.
- issue: Bedeutung von חֹדֶשׁ im Gerichtswort
  choice: „der Neumond“ als möglicher Hinweis auf den Fest- und Kultkalender
  alternative: „ein Monat“ als Aussage über das baldige Eintreten des Gerichts
  rationale: Beide Bedeutungen sind sprachlich möglich. Der Haupttext erhält den kultischen Anklang, während die Fußnote die zeitliche Lesart dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. „HERR“ folgt der üblichen Wiedergabe des Gottesnamens JHWH. Die knappe Gerichtssprache und die Mehrdeutigkeit der Schlüsselbegriffe bleiben erhalten.
