revisions:
- from: Die Abtrünnigen haben sich tief ins Schlachten verstrickt[a]; doch ich bin Zurechtweisung für sie alle.[b]
  to: Die Abtrünnigen haben das Schlachten weit getrieben[a]; doch ich bin Zurechtweisung[b] für sie alle.
  rationale: Die Revision entfernt die nicht ausdrücklich belegte reflexive Bedeutung von „sich verstricken“ und gibt die mit עמק ausgedrückte Steigerung idiomatisch durch „weit getrieben“ wieder. Der Anker zu „Zurechtweisung“ wird an die Stelle der erläuterten Vokabel gesetzt. Die möglichen Bedeutungen von מוּסָר bleiben in der Fußnote offen.
