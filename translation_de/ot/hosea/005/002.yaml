  text: וְ/שַׁחֲטָ֥ה שֵׂטִ֖ים הֶעְמִ֑יקוּ וַ/אֲנִ֖י מוּסָ֥ר לְ/כֻלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/002.yaml
  text: The rebels have gone deep into slaughter[b][a], but I am a rebuke to all of them.
translation:
  language: de
  text: Die Abtrünnigen haben das Schlachten weit getrieben[a]; doch ich bin Zurechtweisung[b] für sie alle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Abtrünnigen sind tief ins Schlachten versunken.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „doch ich bin Zucht für sie alle“ beziehungsweise „Unterweisung für sie alle“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטָה
  choice: ins Schlachten
  rationale: שַׁחֲטָה bezeichnet Schlachten oder Töten. Zusammen mit הֶעְמִיקוּ gibt „sich tief ins Schlachten verstrickt“ die Bewegung in immer schwerere Blutschuld natürlich wieder, ohne einen im Hebräischen nicht genannten Gegenstand wie „Grube“ einzuführen.
- source_word: שֵׂטִים
  choice: die Abtrünnigen
  rationale: Das Wort bezeichnet Menschen, die abweichen oder sich abwenden. „Abtrünnige“ bewahrt den religiös-moralischen Vorwurf und ist im Deutschen weniger politisch verengt als „Rebellen“.
- source_word: הֶעְמִיקוּ
  choice: haben sich tief … verstrickt
  rationale: Der Hifil-Perfekt von עמק bedeutet wörtlich etwa „sie machten tief“ und bezeichnet hier ein tiefes Hineingeraten beziehungsweise eine Steigerung des bösen Handelns. Die deutsche Wendung bewahrt das Tiefenbild in verständlicher Form.
- source_word: וַאֲנִי
  choice: doch ich
  rationale: 'Das Waw wird im Zusammenhang adversativ wiedergegeben: Dem tiefen Fehlverhalten steht das zurechtweisende Handeln des Sprechers gegenüber.'
- source_word: מוּסָר
  choice: Zurechtweisung
  rationale: מוּסָר umfasst Zucht, Korrektur, Mahnung und Unterweisung. „Zurechtweisung“ wahrt hier sowohl die strafende als auch die korrigierende Nuance, ohne ausschließlich körperliche Strafe oder bloße Belehrung festzulegen.
- source_word: לְכֻלָּם
  choice: für sie alle
  rationale: Die Präposition ל wird passend zum nominalen Satz mit „für“ wiedergegeben; „sie alle“ bewahrt den umfassenden Geltungsbereich.
theological_decisions:
- issue: Sprecheridentität und Charakter der göttlichen Reaktion
  choice: Der HERR spricht als Zurechtweisung für sie alle.
  alternative: „Ich bin Zucht/Unterweisung für sie alle“ oder sinngemäß „Ich werde sie alle züchtigen“.
  rationale: Der Gerichtskontext legt korrigierende, auch strafende Zurechtweisung nahe. Die nominale Formulierung „ich bin“ bleibt jedoch erhalten, und die Bandbreite von מוּסָר wird nicht auf reine Bestrafung oder reine Belehrung verengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das ungewöhnliche Tiefenbild und der nominale Satz des Hebräischen bleiben erkennbar; zugleich wird die Formulierung idiomatisch gehalten. Die Fußnoten stehen an den jeweils einschlägigen Ausdrücken.
