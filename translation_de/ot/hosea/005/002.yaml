  timestamp: '2026-07-17T02:31:12Z'
review_pass:
  verdict: revise
  source_fidelity: Die hebräische Wortfolge stellt „Schlachten/Töten“ voran und verbindet es mit dem Hifil von עמק („tief/weit treiben, vertiefen“). „Sich ... verstricken“ bezeichnet eher ein Verwickeltwerden und fügt eine reflexive Nuance hinzu, die nicht im Text liegt. „Das Schlachten weit treiben“ gibt die intensivierende Aussage idiomatisch wieder. מוּסָר bezeichnet hier Zurechtweisung bzw. Disziplin; die nominale Aussage bleibt erhalten.
  naturalness: „Die Abtrünnigen haben das Schlachten weit getrieben“ ist modernes, verständliches Standarddeutsch und wahrt die harte prophetische Sprache. „Zurechtweisung für sie alle“ ist natürlich; die Fußnotenmarkierung wird direkt bei dem erläuterten Ausdruck gesetzt.
  terminology: „Abtrünnige“ ist für שֵׂטִים als religiös-moralische Abweichler vertretbar. „Zurechtweisung“ bewahrt bei מוּסָר die Korrektur- und Gerichtsnähe, ohne die Bedeutung auf körperliche Züchtigung festzulegen. Die Alternativen „Zucht“ und „Unterweisung“ machen die lexikalische Spannweite transparent.
  issues:
  - severity: medium
    issue: „haben sich tief ins Schlachten verstrickt“
    rationale: Die reflexive Wendung ist eine zusätzliche Deutung und schwächt die Aussage, dass die Abtrünnigen das Schlachten intensiv betrieben bzw. weit getrieben haben.
  - severity: low
    issue: Fußnotenanker b steht nach dem ganzen Satz.
    rationale: Die Anmerkung erläutert spezifisch מוּסָר/Zurechtweisung und sollte unmittelbar an „Zurechtweisung“ stehen.
  revised_text: Die Abtrünnigen haben das Schlachten weit getrieben[a]; doch ich bin Zurechtweisung[b] für sie alle.
