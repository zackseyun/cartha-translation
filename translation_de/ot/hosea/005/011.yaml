base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/011.yaml
  text: Ephraim is oppressed, crushed in judgment, because he was determined to walk after filth.
translation:
  language: de
  text: Ephraim ist unterdrückt, im Gericht zerschlagen; denn er war entschlossen, einem Gebot[a] zu folgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bedeutet gewöhnlich „Gebot“ oder „Anordnung“, ist hier jedoch ungewöhnlich. Alte Übersetzungen und manche textkritischen Deutungen setzen oder verstehen stattdessen etwa „Nichtigem“, „Götzen“ oder „Unrat“.
    reason: Die Bedeutung beziehungsweise Textgestalt von צָו ist an dieser Stelle umstritten. Die Anmerkung macht die abweichenden Überlieferungs- und Deutungslinien transparent, während der Haupttext die vokalisierte masoretische Lesung wiedergibt.
lexical_decisions:
- source_word: עָשׁוּק
  choice: unterdrückt
  rationale: Das passive Partizip bezeichnet Ephraim als jemanden, der bedrängt beziehungsweise unterdrückt wird.
- source_word: רְצוּץ מִשְׁפָּט
  choice: vom Gericht zerschlagen
  rationale: Die knappe hebräische Verbindung wird so wiedergegeben, dass מִשְׁפָּט als Ursache oder Vollzug des Zerschlagens verstanden wird; die harte Gerichtsmetaphorik bleibt erhalten.
- source_word: הוֹאִיל הָלַךְ
  choice: war entschlossen, … zu folgen
  rationale: הוֹאִיל bezeichnet hier die willentliche Bereitschaft beziehungsweise den festen Entschluss; הָלַךְ אַחֲרֵי ist idiomatisch mit „folgen“ wiedergegeben.
- source_word: צָו
  choice: Gebot
  rationale: Die vokalisierte masoretische Form bedeutet am ehesten „Gebot“ oder „Anordnung“. Wegen der ungewöhnlichen Verwendung und abweichender alter Überlieferung wird die Unsicherheit in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Gegenstand von Ephraims schuldhaftem Folgen
  choice: einem Gebot
  alternative: Unrat/Götzen beziehungsweise menschlicher Satzung
  rationale: Der WLC bietet צָו, wörtlich „Gebot/Anordnung“. Die im englischen Konsultationstext gewählte Wiedergabe „filth“ beruht nicht unmittelbar auf der masoretischen Vokalisierung und würde eine textkritische Deutung ohne Kennzeichnung in den Haupttext übernehmen. Die Fußnote bewahrt die echte textliche und semantische Unsicherheit.
- issue: Bezug von מִשְׁפָּט
  choice: Ephraim wird durch das Gericht zerschlagen
  alternative: Ephraims Recht wird zerschlagen beziehungsweise Ephraim ist hinsichtlich des Rechts zermalmt
  rationale: Die gewählte Fassung folgt der naheliegenden syntaktischen Verbindung, ohne das Gericht ausdrücklich als menschlich oder göttlich festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Das grammatische Neutrum „es“ nimmt den als Stammes- und Gebietsnamen gebrauchten Namen Ephraim auf. Der Parallelismus und die scharfe Gerichtssprache des Hebräischen bleiben knapp erhalten.
