  text: וַ/יַּ֨רְא אֶפְרַ֜יִם אֶת חָלְי֗/וֹ וִֽ/יהוּדָה֙ אֶת מְזֹר֔/וֹ וַ/יֵּ֤לֶךְ אֶפְרַ֨יִם֙ אֶל אַשּׁ֔וּר וַ/יִּשְׁלַ֖ח אֶל מֶ֣לֶךְ יָרֵ֑ב וְ/ה֗וּא לֹ֤א יוּכַל֙ לִ/רְפֹּ֣א לָ/כֶ֔ם וְ/לֹֽא יִגְהֶ֥ה מִ/כֶּ֖ם מָזֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/013.yaml
  text: When Ephraim saw his sickness[a], and Judah his wound, then Ephraim went to Assyria and sent to King Jareb; but he cannot heal you, nor can he cure your wound.
translation:
  language: de
  text: Als Ephraim seine Krankheit sah und Juda seine Wunde, ging Ephraim nach Assyrien und sandte zum König Jareb[a]. Doch er kann euch nicht heilen und die Wunde nicht von euch nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „zum streitenden König“, „zum rächenden König“ oder „zum Großkönig“. Das hebräische „Jareb“ kann statt als Eigenname auch als Titel verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָלְיוֹ
  choice: seine Krankheit
  rationale: חֳלִי bezeichnet eine Krankheit oder ein Leiden und wird hier bildhaft für Ephraims nationalen Zustand gebraucht. „Krankheit“ bewahrt das medizinische Bild in allgemein verständlicher Sprache.
- source_word: מְזֹרוֹ / מָזוֹר
  choice: seine Wunde / die Wunde
  rationale: מָזוֹר kann eine Wunde oder ein Geschwür bezeichnen. „Wunde“ ist natürlich, wahrt das Körperbild und legt die genaue Art der Verletzung nicht unnötig fest.
- source_word: אַשּׁוּר
  choice: Assyrien
  rationale: Im Zusammenhang ist das politische Großreich gemeint; „Assyrien“ ist die übliche deutsche Namensform.
- source_word: מֶלֶךְ יָרֵב
  choice: König Jareb
  rationale: Die mehrdeutige Bezeichnung wird im Haupttext als Name beziehungsweise namensähnlicher Titel wiedergegeben. Mögliche beschreibende Deutungen werden in der Fußnote bewahrt.
- source_word: וַיִּשְׁלַח
  choice: sandte zum
  rationale: Das Objekt des Sendens bleibt im Hebräischen unausgesprochen. „Sandte zum“ erhält diese Kürze, ohne ausdrücklich Boten hinzuzufügen.
- source_word: לָכֶם
  choice: euch
  rationale: Die Verbindung von ל mit רפא lässt sich im Deutschen idiomatisch mit dem direkten Objekt „euch heilen“ wiedergeben.
- source_word: יִגְהֶה מִכֶּם
  choice: die Wunde nicht von euch nehmen
  rationale: Das seltene Verb steht im Zusammenhang mit Heilung; die Formulierung wahrt sowohl den Gedanken des Beseitigens als auch die Präposition מִן („von“) und vermeidet eine zu enge medizinische Festlegung.
- source_word: וְהוּא
  choice: Doch er
  rationale: Das formal verbindende ו leitet hier einen deutlichen Gegensatz zur erhofften Hilfe Assyriens ein; „Doch“ macht diesen Zusammenhang natürlich sichtbar.
theological_decisions:
- issue: Bezug des Singularpronomens in „Doch er kann euch nicht heilen“
  choice: Das Pronomen bezieht sich unmittelbar auf König Jareb, den assyrischen Herrscher.
  alternative: Das Pronomen kann weiter gefasst auf Assyrien als politische Macht bezogen werden.
  rationale: Der nächste singularische Bezug ist „König Jareb“. Zugleich richtet sich die Aussage insgesamt gegen das Vertrauen auf Assyrien; die Übersetzung schließt diese weitere rhetorische Ebene nicht aus.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau folgt der prophetischen Gegenüberstellung, bleibt aber flüssig. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Bezeichnung „König Jareb“.
