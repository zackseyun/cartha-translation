base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/014.yaml
  text: For I am like a lion to Ephraim[a], and like a young lion to the house of Judah; I, I myself, will tear and go away; I will carry off[b], and there is no one to rescue.
translation:
  language: de
  text: 'Denn für Ephraim bin ich wie ein Löwe[a]

    und für das Haus Juda wie ein Junglöwe.

    Ich, ich, werde zerreißen und weggehen;

    ich werde wegtragen, und es gibt keinen Retter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch die Kraft oder Wildheit des Löwen hervorheben.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַּׁחַל
  choice: Löwe
  rationale: Das Wort bezeichnet einen Löwen und kann dessen Kraft oder Wildheit mitschwingen lassen. „Löwe“ ist die natürliche deutsche Entsprechung; eine ausdrückliche Verstärkung würde die Bedeutung unnötig festlegen.
- source_word: כְּפִיר
  choice: Junglöwe
  rationale: כפיר bezeichnet gewöhnlich einen jungen Löwen. „Junglöwe“ bewahrt das poetische Gegenstück zu שׁחל, ohne das Bild durch „Löwenjunges“ abzuschwächen.
- source_word: לְאֶפְרַיִם
  choice: für Ephraim
  rationale: Das ל bezeichnet hier die Beziehung zu dem vom Gericht betroffenen Ephraim. Die Voranstellung „für Ephraim bin ich wie …“ ist im Deutschen natürlich und lässt die bedrohliche Beziehung aus dem Löwenbild hervorgehen.
- source_word: לְבֵית יְהוּדָה
  choice: für das Haus Juda
  rationale: „Haus Juda“ bewahrt die hebräische Bezeichnung für das judäische Gemeinwesen beziehungsweise Volk und den Parallelismus mit Ephraim.
- source_word: אֲנִי אֲנִי
  choice: Ich, ja ich
  rationale: Die Formulierung gibt die emphatische Wiederholung des Personalpronomens in würdigem, gegenwärtigem Deutsch wieder.
- source_word: אֶטְרֹף
  choice: werde zerreißen
  rationale: טרף bezeichnet im Raubtierbild das Zerreißen oder Reißen von Beute. „Zerreißen“ erhält die Härte des angekündigten Gerichts.
- source_word: וְאֵלֵךְ
  choice: und weggehen
  rationale: Nach dem Angriff geht das Raubtier mit seiner Beute fort. „Weggehen“ gibt die Bewegungsrichtung schlicht und verständlich wieder.
- source_word: אֶשָּׂא
  choice: werde die Beute fortschleppen
  rationale: נשא bedeutet „heben, tragen, wegtragen“. Im Löwenbild ist das Fortschleppen der Beute gemeint; „die Beute“ macht den im Hebräischen unausgesprochenen, aus dem Bild klaren Gegenstand im Deutschen verständlich.
- source_word: וְאֵין מַצִּיל
  choice: und niemand rettet
  rationale: Die hebräische Wendung verneint das Vorhandensein eines Retters. Die knappe deutsche Form bewahrt sowohl die Absolutheit als auch die unmittelbare Bildsprache.
theological_decisions:
- issue: Gottes Selbstbeschreibung als Raubtier im Gericht
  choice: Das Löwenbild und die Verben des Zerreißens und Fortschleppens werden ungemildert als Bild für Gottes Gericht über Ephraim und Juda wiedergegeben.
  alternative: Das Bild zu einer allgemeinen Ankündigung von Strafe abzuschwächen.
  rationale: Der hebräische Text entfaltet ausdrücklich und eindringlich das Bild eines angreifenden Löwen. Eine Verallgemeinerung würde die Härte und theologische Spannung des Gerichtswortes vermindern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Parallelismus. „Haus Juda“ erhält die biblische Kollektivbezeichnung; „Ich, ja ich“ bildet die emphatische Wiederholung ohne Archaismus nach.
