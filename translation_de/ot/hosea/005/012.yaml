  text: וַ/אֲנִ֥י כָ/עָ֖שׁ לְ/אֶפְרָ֑יִם וְ/כָ/רָקָ֖ב לְ/בֵ֥ית יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/012.yaml
  text: So I am like a moth to Ephraim[a], and like rot to the house of Judah.
translation:
  language: de
  text: So bin ich wie eine Motte für Efraim und wie Fäulnis für das Haus Juda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Verfall“ oder „wie Vermoderung“. Das hebräische Bild bezeichnet innere Zersetzung und allmähliches Dahinschwinden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: So bin ich
  rationale: Die Konjunktion führt im Zusammenhang die Folge des zuvor angekündigten Gerichts weiter; das selbstständige Pronomen betont zugleich das göttliche Ich.
- source_word: כָעָשׁ
  choice: wie eine Motte
  rationale: עָשׁ bezeichnet gewöhnlich die Motte und vermittelt hier das Bild eines allmählichen, verzehrenden Schadens.
- source_word: לְאֶפְרָיִם
  choice: für Efraim
  rationale: Die Präposition kennzeichnet Efraim als den Betroffenen der bildhaften Selbstbeschreibung. „Für Efraim“ ist im Deutschen natürlich und bewahrt den konkreten Namen des Nordreichs.
- source_word: וְכָרָקָב
  choice: und … wie Fäulnis
  rationale: רָקָב kann Fäulnis, Verfall oder Vermoderung bezeichnen. „Fäulnis“ bewahrt das anschauliche Bild innerer Zersetzung.
- source_word: לְבֵית יְהוּדָה
  choice: für das Haus Juda
  rationale: „Haus Juda“ erhält den korporativen Ausdruck des Hebräischen für das südliche Königreich beziehungsweise sein Volk.
theological_decisions:
- issue: Gottes Selbstbeschreibung durch zerstörerische Bilder
  choice: Gott vergleicht sich unmittelbar mit einer Motte und mit Fäulnis.
  alternative: 'Explizierende Wiedergabe wie: „Ich werde Efraim wie eine Motte zerfressen und Juda verfallen lassen.“'
  rationale: Der hebräische Text bietet nominale Vergleiche und erklärt ihre Wirkung nicht durch zusätzliche Verben. Die direkte Bildsprache wahrt die Spannung des prophetischen Gerichtswortes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die knappen, eindringlichen Gerichtsbilder des Hebräischen bleiben erhalten.
