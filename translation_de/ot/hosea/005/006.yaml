source:
  edition: WLC
  text: בְּ/צֹאנָ֣/ם וּ/בִ/בְקָרָ֗/ם יֵֽלְכ֛וּ לְ/בַקֵּ֥שׁ אֶת יְהוָ֖ה וְ/לֹ֣א יִמְצָ֑אוּ חָלַ֖ץ מֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/006.yaml
  text: With their flocks and with their herds they will go to seek Yahweh[a], but they will not find him[b]; he has withdrawn from them.
translation:
  language: de
  text: Mit ihren Kleinviehherden und ihren Rinderherden werden sie gehen, um Jahwe zu suchen; doch sie werden ihn nicht finden. Er hat sich von ihnen zurückgezogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er ist von ihnen fortgegangen“ oder „Er hat sich von ihnen entfernt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֹאנָם
  choice: mit ihren Schafherden
  rationale: צֹאן bezeichnet Kleinvieh, besonders Schafe und Ziegen. „Schafherden“ ist im Deutschen eine natürliche kollektive Wiedergabe; die Präposition בְּ drückt hier Begleitung aus.
- source_word: וּבִבְקָרָם
  choice: und mit ihren Rinderherden
  rationale: בָּקָר bezeichnet Rinder beziehungsweise Großvieh. „Rinderherden“ bewahrt den Gegensatz zum Kleinvieh und klingt im Deutschen verständlich.
- source_word: יֵלְכוּ
  choice: werden sie losziehen
  rationale: Das Qal-Imperfekt steht im prophetischen Zusammenhang zukunftsbezogen. „Losziehen“ gibt das zielgerichtete Gehen natürlich wieder, ohne dem Verb eine zusätzliche kultische Bedeutung aufzuzwingen.
- source_word: לְבַקֵּשׁ
  choice: um … zu suchen
  rationale: בקש bedeutet „suchen“ und trägt bei Gott als Ziel auch den religiösen Sinn des Aufsuchens und der Hinwendung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: וְלֹא יִמְצָאוּ
  choice: doch sie werden ihn nicht finden
  rationale: Das nicht ausdrücklich wiederholte Objekt ist Jahwe. „Doch“ macht den im Zusammenhang klaren Gegensatz zwischen ihrem Suchen und dem erfolglosen Ausgang sichtbar.
- source_word: חָלַץ מֵהֶם
  choice: Er hat sich von ihnen zurückgezogen
  rationale: חלץ bezeichnet hier das Sichentziehen beziehungsweise Sichentfernen. Das Perfekt wird als abgeschlossene Handlung mit fortdauernder Folge wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht ausdrücklich das Tetragramm יְהוָה. Die Wiedergabe als Eigenname bewahrt diese Form des Ausgangstextes.
- issue: Art des Suchens
  choice: Der mögliche Opferkontext bleibt im Haupttext unausgesprochen und wird in einer Fußnote erläutert.
  alternative: Ausdrücklich ergänzen, dass sie mit Opfertieren kommen.
  rationale: Schaf- und Rinderherden legen Opfergaben nahe, doch der Vers bezeichnet die Tiere nicht ausdrücklich als Opfer. Die Fußnote wahrt diese begründete, aber nicht eindeutige Folgerung.
- issue: Bedeutung von חָלַץ
  choice: sich zurückziehen
  alternative: fortgehen / sich entfernen
  rationale: Die Formulierung bringt zum Ausdruck, dass Jahwe ihrem Suchen nicht mehr zugänglich ist, ohne über den Wortlaut hinaus den Grund oder die Dauer dieses Entzugs festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Losziehen“ ist natürlicher als das wörtliche „gehen werden“, während Satzbau und Bildfolge eng am Hebräischen bleiben. Die Fußnotenmarker stehen jeweils unmittelbar bei der Textstelle, auf die sie sich beziehen.
