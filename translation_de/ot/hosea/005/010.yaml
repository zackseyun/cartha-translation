id: HOS.5.10
reference: Hosea 5:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָיוּ֙ שָׂרֵ֣י יְהוּדָ֔ה כְּ/מַסִּיגֵ֖י גְּב֑וּל עֲלֵי/הֶ֕ם אֶשְׁפּ֥וֹךְ כַּ/מַּ֖יִם עֶבְרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/010.yaml
  text: The princes of Judah have become like those who move a boundary marker[a]; on them I will pour out my wrath like water.
translation:
  language: de
  text: Die führenden Männer Judas sind wie solche geworden, die Grenzsteine verrücken.[a] Über sie werde ich meinen Zorn ausgießen wie Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die eine Grenze verschieben“. Das Bild kann sich wörtlich auf das Verrücken von Grundstücksgrenzen beziehen oder übertragen auf die Missachtung von Grenzen, die Gott gesetzt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיוּ
  choice: sind ... geworden
  rationale: Das Qatal von היה bezeichnet hier plausibel einen eingetretenen Zustand; die Wiedergabe wahrt den anklagenden, resultativen Sinn.
- source_word: שָׂרֵי יְהוּדָה
  choice: die führenden Männer Judas
  rationale: שָׂרִים bezeichnet politische Machthaber, Fürsten oder Amtsträger. „Führende Männer“ ist im modernen Deutsch verständlich, ohne eine erbliche Fürstenwürde vorauszusetzen.
- source_word: כְּמַסִּיגֵי גְּבוּל
  choice: wie solche, die Grenzsteine verrücken
  rationale: Die Wendung ruft das unerlaubte Verschieben von Grundstücksgrenzen auf. „Grenzsteine verrücken“ bewahrt das konkrete Rechts- und Landbild idiomatisch.
- source_word: עֲלֵיהֶם
  choice: über sie
  rationale: Die Präposition mit Pronomen bezeichnet die Betroffenen des angekündigten Gerichtshandelns und verbindet sich natürlich mit „ausgießen“.
- source_word: אֶשְׁפּוֹךְ
  choice: werde ich ... ausgießen
  rationale: Das Verb שׁפך wird konkret als „ausgießen“ wiedergegeben und bewahrt die Bildsprache des folgenden Wasservergleichs.
- source_word: כַּמַּיִם
  choice: wie Wasser
  rationale: Der hebräische Text nennt Wasser, nicht ausdrücklich eine Flut; die schlichte Wiedergabe vermeidet eine interpretierende Verstärkung.
- source_word: עֶבְרָתִי
  choice: meinen Zorn
  rationale: עֶבְרָה bezeichnet heftigen Zorn beziehungsweise Grimm. „Zorn“ ist würdig, verständlich und im prophetischen Gerichtswort angemessen.
theological_decisions:
- issue: Art der Anklage gegen Judas Führung
  choice: Das konkrete Bild des Verrückens von Grenzsteinen bleibt erhalten, ohne seine übertragene Bedeutung festzulegen.
  alternative: Die Aussage ausschließlich als wörtlichen Landraub, als politische Grenzverletzung oder als allgemeine Übertretung göttlicher Grenzen zu deuten.
  rationale: Die Wendung erinnert an das verbotene Verschieben von Besitzgrenzen, kann bei Hosea jedoch zugleich eine umfassendere Verletzung der von Gott gesetzten Ordnung bezeichnen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Führende Männer“ vermeidet das heute leicht dynastisch verstandene „Fürsten“, während „Grenzsteine verrücken“ das konkrete und rechtlich geprägte Bild natürlich wiedergibt.
