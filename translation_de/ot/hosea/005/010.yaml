  source_fidelity: 'Die Übersetzung gibt die hebräische Aussage vollständig und ohne sachliche Zusätze wieder: הָיוּ wird angemessen resultativ mit „sind ... geworden“ wiedergegeben; שָׂרֵי יְהוּדָה als „führende Männer Judas“ trifft den politischen Leitungssinn; das konkrete Rechtsbild von כְּמַסִּיגֵי גְּבוּל bleibt mit „Grenzsteine verrücken“ erhalten. Die Ankündigung des göttlichen Zorns und der Vergleich „wie Wasser“ entsprechen dem hebräischen Wortlaut.'
