  terminology: „Zorn“ ist für עֶבְרָתִי treffend und registergerecht. „Führende Männer“ ist eine vertretbare moderne Wiedergabe von שָׂרִים, ohne eine spezifische erbliche Titulatur vorauszusetzen. Die Fußnote kennzeichnet die alternative, weniger konkrete Wiedergabe und wahrt die im Bild angelegte wörtliche wie übertragene Offenheit.
