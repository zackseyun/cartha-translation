id: HOS.5.4
reference: Hosea 5:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹ֤א יִתְּנוּ֙ מַ֣עַלְלֵי/הֶ֔ם לָ/שׁ֖וּב אֶל אֱלֹֽהֵי/הֶ֑ם כִּ֣י ר֤וּחַ זְנוּנִים֙ בְּ/קִרְבָּ֔/ם וְ/אֶת יְהוָ֖ה לֹ֥א יָדָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/004.yaml
  text: Their deeds do not allow them to return to their God[a], for a spirit of whoredom is within them, and they do not know Yahweh.
translation:
  language: de
  text: Ihre Taten lassen es nicht zu, dass sie zu ihrem Gott zurückkehren. Denn ein Geist der Hurerei[a] ist in ihrem Innern, und Yahweh kennen sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ein Geist der Prostitution“ oder „ein Geist der Unzucht“. Das Hebräische gebraucht das Bild sexueller Untreue für Untreue gegenüber dem Bund und für Götzendienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּנוּ ... לָשׁוּב
  choice: lassen es nicht zu, dass sie ... zurückkehren
  rationale: Die Konstruktion mit נתן und Infinitiv bedeutet hier idiomatisch, dass ihre Taten eine Rückkehr nicht zulassen. Die Formulierung gibt den Sinn natürlich wieder, ohne die Aussage zu einer bloßen Unfähigkeit umzudeuten.
- source_word: מַעַלְלֵיהֶם
  choice: ihre Taten
  rationale: „Taten“ bezeichnet ihre Handlungen und bewahrt den moralischen Ernst der prophetischen Anklage.
- source_word: לָשׁוּב
  choice: zurückkehren
  rationale: שׁוב umfasst die Vorstellung von Umkehr und erneuter Hinwendung. „Zurückkehren“ bewahrt diese Bildlichkeit, ohne sie ausschließlich als „Buße tun“ auszulegen.
- source_word: אֶל אֱלֹהֵיהֶם
  choice: zu ihrem Gott
  rationale: Im Zusammenhang der Bundesanklage ist Israels eigener Gott gemeint; daher ist die singularische Wiedergabe angemessen.
- source_word: רוּחַ זְנוּנִים
  choice: ein Geist der Hurerei
  rationale: Die kräftige Formulierung bewahrt Hoseas Bild sexueller Untreue für Götzendienst und Bundesbruch. Eine Fußnote erläutert die metaphorische Bedeutung.
- source_word: בְּקִרְבָּם
  choice: ist in ihrem Innern
  rationale: Die Wendung kann „in ihrer Mitte“ oder „in ihrem Innern“ bedeuten. Hier hebt sie die tief sitzende innere Prägung des Volkes hervor.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֹא יָדָעוּ
  choice: kennen sie nicht
  rationale: „Kennen“ bewahrt sowohl die unmittelbare Bedeutung als auch den relationalen und bundesbezogenen Gehalt des hebräischen Verbs.
theological_decisions:
- issue: Bild sexueller Untreue
  choice: „Geist der Hurerei“
  alternative: „Geist der Prostitution“ oder „Geist der Unzucht“
  rationale: Die gewählte Fassung erhält die scharfe prophetische Metapher für Götzendienst und Bundesuntreue; die Fußnote macht ihre Funktion deutlich.
- issue: Bundesbezogener Sinn von ידע
  choice: „Yahweh kennen sie nicht“
  alternative: „Yahweh erkennen sie nicht“ oder „sie erkennen Yahweh nicht an“
  rationale: „Kennen“ lässt den relationalen Bundessinn bestehen, ohne ihn auf Anerkennung, Erkenntnis oder Gehorsam zu verengen.
- issue: Numerus von אֱלֹהֵיהֶם
  choice: „ihrem Gott“
  alternative: „ihren Göttern“
  rationale: Der Kontext beschreibt die verhinderte Rückkehr zu Israels Bundesgott; die singularische Lesart entspricht der Anklage des Abschnitts.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt klar und nahe am Hebräischen. „Hurerei“ ist bewusst kräftig und durch die Fußnote erklärt; „kennen“ bewahrt die theologische Mehrdeutigkeit.
