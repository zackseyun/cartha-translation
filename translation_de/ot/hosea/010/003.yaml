language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י עַתָּה֙ יֹֽאמְר֔וּ אֵ֥ין מֶ֖לֶךְ לָ֑/נוּ כִּ֣י לֹ֤א יָרֵ֨אנוּ֙ אֶת יְהֹוָ֔ה וְ/הַ/מֶּ֖לֶךְ מַה יַּֽעֲשֶׂה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/003.yaml
  text: For now they will say[a], “We have no king, because we did not fear Yahweh[b]; and the king—what can he do for us?”
translation:
  language: de
  text: 'Denn jetzt werden sie sagen: „Wir haben keinen König, weil wir Jahwe nicht gefürchtet haben[a]. Und der König – was kann er für uns tun[b]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil wir Jahwe nicht fürchten“ beziehungsweise „weil wir Jahwe nicht gefürchtet haben“. Das hebräische Perfekt kann sowohl ihren feststehenden Zustand als auch ihr schuldhaftes Versagen in der Vergangenheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „was wird er für uns tun?“ Die hebräische Verbform bezeichnet formal Zukünftiges; der Haupttext gibt den rhetorischen Sinn seiner Unfähigkeit wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַתָּה
  choice: Denn jetzt
  rationale: כִּי leitet hier eine Begründung beziehungsweise Erklärung ein; zusammen mit עַתָּה ergibt „Denn jetzt“ eine natürliche und zugleich quellennah bleibende Wiedergabe.
- source_word: יֹאמְרוּ
  choice: werden sie sagen
  rationale: Das Imperfekt 3. Person Plural wird im prophetischen Zusammenhang am besten als vorausschauende Aussage verstanden.
- source_word: אֵין מֶלֶךְ לָנוּ
  choice: Wir haben keinen König
  rationale: Diese idiomatische deutsche Formulierung bewahrt den existenziellen Sinn von אֵין und den Bezug durch לָנוּ.
- source_word: כִּי לֹא יָרֵאנוּ אֶת יְהוָה
  choice: weil wir Jahwe nicht gefürchtet haben
  rationale: Das Perfekt יָרֵאנוּ wird als schuldhaftes, bis zur gegenwärtigen Lage führendes Versagen wiedergegeben. „Fürchten“ bewahrt die Bedeutungsbreite von Ehrfurcht, Gehorsam und Furcht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְהַמֶּלֶךְ
  choice: Und der König –
  rationale: Die wörtliche Anknüpfung mit „Und“ bleibt erhalten; der Gedankenstrich bildet die abrupte rhetorische Wendung natürlich ab.
- source_word: מַה יַּעֲשֶׂה לָּנוּ
  choice: was kann er für uns tun?
  rationale: Obwohl das Imperfekt formal auch „was wird er ... tun?“ zulässt, vermittelt die Modalform im Deutschen den rhetorischen Sinn der Wirkungslosigkeit des Königs.
theological_decisions:
- issue: Bedeutung von ירא in Bezug auf Jahwe
  choice: „Jahwe ... gefürchtet“
  alternative: „Jahwe ... verehrt“
  rationale: „Fürchten“ bewahrt die theologische Spannung zwischen Furcht, Ehrfurcht und gehorsamer Unterordnung, ohne den Ausdruck auf bloße Verehrung zu verengen.
- issue: Zeitbezug von לֹא יָרֵאנוּ
  choice: „nicht gefürchtet haben“
  alternative: „nicht fürchten“
  rationale: Das hebräische Perfekt kann entweder ein schuldhaftes früheres Versagen oder einen daraus hervorgegangenen festen Zustand bezeichnen. Der Haupttext gibt den vollendeten Aspekt wieder; die Alternative wird in der Fußnote bewahrt.
- issue: Rhetorische Funktion von מַה יַּעֲשֶׂה
  choice: „was kann er ... tun?“
  alternative: „was wird er ... tun?“
  rationale: Der Haupttext bringt die im Zusammenhang naheliegende Aussage von der Unfähigkeit beziehungsweise Wirkungslosigkeit des Königs zum Ausdruck, während die formale Zukunftsbedeutung in der Fußnote offengehalten wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gottesname erscheint als „Jahwe“. Die direkte Rede ist klar und mündlich verständlich; der Gedankenstrich bewahrt die abrupte rhetorische Zuspitzung des Hebräischen.
