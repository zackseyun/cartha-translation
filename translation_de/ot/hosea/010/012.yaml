base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/012.yaml
  text: Sow for yourselves for righteousness[a]; reap according to steadfast love. Break up for yourselves unplowed ground, for it is time to seek Yahweh[b], until he comes and rains righteousness on you.
translation:
  language: de
  text: Sät für euch Gerechtigkeit; erntet entsprechend treuer Liebe. Brecht euch unbestelltes Land um[a], denn es ist Zeit, Jahwe zu suchen, bis er kommt und Gerechtigkeit auf euch regnen lässt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Brachland.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: bis er kommt und euch Gerechtigkeit lehrt. Das hebräische Verb kann „lehren“ bedeuten; das landwirtschaftliche Bild des Verses spricht im Haupttext für „regnen lassen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: זִרְעוּ לָכֶם לִצְדָקָה
  choice: Sät für euch Gerechtigkeit
  rationale: Der Imperativ bewahrt das landwirtschaftliche Bild; „für euch“ gibt die benefaktive Kraft von לָכֶם wieder. „Gerechtigkeit“ erhält den ethisch-bundestheologischen Sinn von צדקה und entspricht dem verwandten צֶדֶק am Versende.
- source_word: קִצְרוּ לְפִי חֶסֶד
  choice: erntet entsprechend treuer Liebe
  rationale: „Erntet“ setzt das Bild des Säens fort. לְפִי bezeichnet Maß oder Entsprechung; „treue Liebe“ gibt die Verbindung von Zuwendung, Beständigkeit und Loyalität in חֶסֶד natürlich wieder.
- source_word: נִירוּ לָכֶם נִיר
  choice: Brecht euch unbestelltes Land um
  rationale: Die Formulierung bildet den Nachdruck der hebräischen Wortverbindung nach und bezeichnet Boden, der erst aufgebrochen beziehungsweise neu bestellt werden muss. „Unbestelltes Land“ ist im heutigen Deutsch verständlicher als das traditionelle „Brachland“.
- source_word: וְעֵת לִדְרוֹשׁ אֶת יְהוָה
  choice: denn es ist Zeit, Jahwe zu suchen
  rationale: Die mit וְ eingeleitete Nominalkonstruktion begründet hier die dringende Aufforderung. „Suchen“ bewahrt den religiösen Sinn von דרש; „Jahwe“ gibt den im Ausgangstext ausdrücklich stehenden Gottesnamen wieder.
- source_word: עַד יָבוֹא וְיֹרֶה צֶדֶק לָכֶם
  choice: bis er kommt und Gerechtigkeit auf euch regnen lässt
  rationale: Das Subjekt ist Jahwe. Die Regenbedeutung von ירה führt das durch Säen, Ernten und Bodenbearbeitung bestimmte Bild weiter; „Gerechtigkeit“ wahrt zugleich die Verbindung zum ersten Satzglied.
theological_decisions:
- issue: Bedeutung von וְיֹרֶה צֶדֶק
  choice: Jahwe lässt Gerechtigkeit auf das Volk regnen.
  alternative: Jahwe lehrt das Volk Gerechtigkeit.
  rationale: Das durchgehende landwirtschaftliche Bild spricht im Haupttext für Regen. Da ירה jedoch auch „lehren/unterweisen“ bedeuten kann, wird diese theologisch bedeutsame Mehrdeutigkeit in einer Fußnote ausdrücklich bewahrt.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im hebräischen Text ausdrücklich verwendet. „Jahwe“ macht dies für heutige Leser sichtbar; die traditionelle Ersatzlesung „der HERR“ bleibt eine mögliche Übersetzungskonvention, ist hier aber keine lexikalische Bedeutung des Namens.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klar erkennbarer landwirtschaftlicher Bildfolge. Der parallele Imperativstil und die Wiederholung von „Gerechtigkeit“ bleiben erhalten; die echte Mehrdeutigkeit des Schlussverbs wird nicht stillschweigend aufgelöst.
