  text: חָלַ֥ק לִבָּ֖/ם עַתָּ֣ה יֶאְשָׁ֑מוּ ה֚וּא יַעֲרֹ֣ף מִזְבְּחוֹתָ֔/ם יְשֹׁדֵ֖ד מַצֵּבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/002.yaml
  text: Their heart is divided[a]; now they will bear guilt. He himself will tear down their altars[c][b]; he will devastate their sacred pillars.
translation:
  language: de
  text: Ihr Herz ist unaufrichtig[a]; nun werden sie die Schuld tragen[b]. Er selbst wird ihre Altäre niederreißen; ihre Kultsteine wird er verwüsten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr Herz ist geteilt.“ Das hebräische Wort bedeutet wörtlich „glatt“ und kann bildlich Unaufrichtigkeit oder Täuschung bezeichnen; möglich ist auch die Vorstellung gespaltener Loyalität.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nun werden sie schuldig befunden“ oder „nun müssen sie büßen“. Das hebräische Verb kann Schuld, Schuldfeststellung und die Folgen der Schuld umfassen.'
    reason: lexical_alternative
  - marker: c
    text: „Kultsteine“ sind aufgerichtete Steine, die religiösen Zwecken dienten.
    reason: cultural_note
lexical_decisions:
- source_word: חָלַק לִבָּם
  choice: Ihr Herz ist falsch
  rationale: חלק kann im Qal „glatt sein“ und übertragen Unaufrichtigkeit oder Falschheit bezeichnen. Bei „Herz“ ergibt dies eine natürliche prophetische Anklage; die ebenfalls verbreitete Deutung „geteilt“ bleibt in der Fußnote erhalten.
- source_word: יֶאְשָׁמוּ
  choice: werden sie schuldig
  rationale: אשם kann das Schuldigsein, das Schuldigwerden oder das Tragen der Schuld samt ihren Folgen ausdrücken. Die knappe Formulierung bewahrt diese Offenheit besser als eine ausdrückliche Festlegung auf Strafe.
- source_word: הוּא
  choice: Er selbst
  rationale: Das selbstständige Pronomen ist emphatisch. Die Großschreibung folgt der im Kontext wahrscheinlichen Beziehung auf Gott, ohne den Gottesnamen in den Text einzufügen.
- source_word: יַעֲרֹף
  choice: wird … niederreißen
  rationale: Das Verb bezeichnet ein gewaltsames Brechen beziehungsweise Abschlagen. Bei Altären gibt „niederreißen“ die entschiedene Zerstörung idiomatisch wieder.
- source_word: מִזְבְּחוֹתָם
  choice: ihre Altäre
  rationale: „Altäre“ ist die direkte und übliche Wiedergabe von מִזְבְּחוֹת.
- source_word: יְשֹׁדֵד
  choice: wird … verwüsten
  rationale: Das Verb bezeichnet verheerende, zerstörerische Einwirkung; „verwüsten“ bewahrt die Intensität und passt zum Parallelismus.
- source_word: מַצֵּבוֹתָם
  choice: ihre Kultsteine
  rationale: מַצֵּבוֹת sind aufgerichtete Steine mit kultischer Funktion. „Kultsteine“ ist für heutige Leser knapp und verständlich.
theological_decisions:
- issue: Bedeutung von חָלַק beim Herzen
  choice: falsch/unaufrichtig
  alternative: geteilt, also in seiner Loyalität gespalten
  rationale: Die Grundvorstellung „glatt“ kann metaphorisch Falschheit und Unaufrichtigkeit bezeichnen. Da beide Deutungen sprachlich vertreten werden, nennt die Fußnote die wichtige Alternative.
- issue: Bezug des betonten הוּא
  choice: Gott ist wahrscheinlich der Handelnde; wiedergegeben als „Er selbst“
  alternative: ein nicht näher genannter menschlicher Vollstrecker des Gerichts
  rationale: Der Zusammenhang kündigt Gottes Gericht an, nennt den Handelnden hier jedoch nicht ausdrücklich beim Namen. Deshalb wird nur das Pronomen übersetzt und kein Gottesname ergänzt.
- issue: Reichweite von יֶאְשָׁמוּ
  choice: „werden sie schuldig“ bewahrt Schuldstatus und drohende Haftung
  alternative: „werden sie ihre Schuld tragen“ oder „werden sie büßen“
  rationale: Das hebräische Verb kann sowohl Schuld als auch deren Folgen einschließen. Die Übersetzung vermeidet eine einseitige Festlegung auf bloße Verurteilung oder Bestrafung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. Der Singular „Herz“ bleibt als hebräisches Kollektivbild erhalten. Die Wortstellung im letzten Satzteil hebt „ihre Kultsteine“ hervor und bildet den Parallelismus nach.
