  edition: WLC
  text: דִּבְּר֣וּ דְבָרִ֔ים אָל֥וֹת שָׁ֖וְא כָּרֹ֣ת בְּרִ֑ית וּ/פָרַ֤ח כָּ/רֹאשׁ֙ מִשְׁפָּ֔ט עַ֖ל תַּלְמֵ֥י שָׂדָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/004.yaml
  text: They speak mere words[a], swearing false oaths, making covenants[d][c][b]; so judgment springs up like poison weed on the furrows of the field.
translation:
  language: de
  text: Sie reden bloße Worte, schwören falsche Eide und schließen Bündnisse[a]. So sprosst das Recht[b] wie Giftkraut[c] in den Furchen des Feldes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »schneiden Bündnisse«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das Gericht« beziehungsweise »das Urteil«; möglicherweise ist »das Recht« bitter-ironisch gemeint.'
    reason: alternative_reading
  - marker: c
    text: Das hebräische Wort bezeichnet hier eine giftige oder bittere Pflanze; die genaue Art ist unbekannt. Manche übersetzen mit »Schierling« oder »Galle«.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְּרוּ דְבָרִים
  choice: Sie machen leere Versprechungen
  rationale: Die figura etymologica bedeutet wörtlich »sie reden Worte«. Im Zusammenhang mit falschen Eiden und Bündnissen gibt »leere Versprechungen« den Vorwurf bloßen, unverlässlichen Redens in natürlichem Deutsch wieder.
- source_word: אָלֹות שָׁוְא
  choice: schwören falsche Eide
  rationale: אָלָה bezeichnet einen Eid, gegebenenfalls mit Fluchcharakter; שָׁוְא kennzeichnet ihn als falsch, nichtig oder trügerisch. Die Wiedergabe wahrt sowohl den Eidakt als auch dessen Unwahrhaftigkeit.
- source_word: כָּרֹת בְּרִית
  choice: schließen Bündnisse
  rationale: Die hebräische Wendung lautet wörtlich »einen Bund schneiden«. »Bündnisse schließen« ist die entsprechende natürliche deutsche Redewendung; der fehlende Artikel lässt hier eine allgemeine beziehungsweise wiederholte Handlung zu.
- source_word: וּפָרַח
  choice: So sprosst
  rationale: Das Verb bezeichnet das Sprossen, Austreiben oder Blühen. »Sprosst« erhält das landwirtschaftliche Bild und vermeidet eine positive Nebenbedeutung.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: 'מִשְׁפָּט bezeichnet Recht, Rechtsprechung oder Gericht. »Das Recht« bewahrt die provozierende Spannung des Bildes: Was Recht sein sollte, wächst infolge des falschen Handelns giftig empor.'
- source_word: כָּרֹאשׁ
  choice: wie Giftkraut
  rationale: רֹאשׁ bezeichnet hier eine giftige oder bittere Pflanze, deren genaue botanische Art unsicher ist. »Giftkraut« vermittelt das Bild, ohne eine ungesicherte Pflanzenart festzulegen.
- source_word: עַל תַּלְמֵי שָׂדָי
  choice: in den Furchen des Feldes
  rationale: תֶּלֶם bezeichnet eine beim Pflügen entstehende Furche oder Ackerfurche. Im Deutschen wächst eine Pflanze idiomatisch »in« den Furchen; das Sachbild bleibt unverändert.
theological_decisions:
- issue: Bedeutung von מִשְׁפָּט im Bild des Giftkrauts
  choice: das Recht
  alternative: das Gericht / das Urteil
  rationale: 'Der hebräische Ausdruck kann Recht, Rechtsprechung oder Gericht bedeuten. »Das Recht« erhält die mögliche bittere Ironie: Die Rechtspflege selbst ist durch falsches Reden und treulose Abmachungen zu giftigem Wachstum geworden. »Gericht« wäre ebenfalls möglich, würde die Spannung jedoch stärker in Richtung eines strafenden Urteils auflösen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Dreierfolge der Anklage und das landwirtschaftliche Bild bleiben erhalten. Die Übersetzung vermeidet eine botanische Überbestimmung und lässt die theologische Spannung von מִשְׁפָּט im Haupttext stehen.
