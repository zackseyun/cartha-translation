source:
  edition: WLC
  text: מִ/ימֵי֙ הַ/גִּבְעָ֔ה חָטָ֖אתָ יִשְׂרָאֵ֑ל שָׁ֣ם עָמָ֔דוּ לֹֽא תַשִּׂיגֵ֧/ם בַּ/גִּבְעָ֛ה מִלְחָמָ֖ה עַל בְּנֵ֥י עַֽלְוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/009.yaml
  text: From the days of Gibeah you have sinned[a], O Israel; there they have remained[b]. Will not war against the children of iniquity overtake them in Gibeah?
translation:
  language: de
  text: Seit den Tagen von Gibea[b] hast du gesündigt, Israel; dort sind sie geblieben. Wird sie in Gibea nicht der Krieg gegen die Söhne des Unrechts einholen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Krieg gegen die Söhne des Unrechts in Gibea hat sie nicht eingeholt“; möglicherweise auch: „… wird sie nicht einholen.“ Der hebräische Wortlaut dieses Satzteils ist schwierig.'
    reason: alternative_reading
  - marker: b
    text: Gibea erinnert an die Schandtat und den Bürgerkrieg in Richter 19–21. Hosea macht dieses Geschehen zum Sinnbild für Israels tief verwurzelte Verderbtheit.
    reason: cross_reference
lexical_decisions:
- source_word: מִימֵי
  choice: Seit den Tagen von
  rationale: Die Präposition מִן bezeichnet hier den zeitlichen Ausgangspunkt. „Seit den Tagen von“ gibt den bis in die Gegenwart reichenden Vorwurf natürlich wieder.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Der Ortsname wird in seiner im Deutschen gebräuchlichen biblischen Form wiedergegeben; der hebräische Artikel wird bei einem Eigennamen nicht eigens übersetzt.
- source_word: חָטָאתָ
  choice: hast du gesündigt
  rationale: Das Qal-Perfekt in der 2. Person Singular richtet sich an Israel als kollektive Einheit und bezeichnet ein Geschehen mit fortdauernder Bedeutung.
- source_word: שָׁם עָמָדוּ
  choice: dort sind sie geblieben
  rationale: עמד bedeutet wörtlich „stehen“, kann hier aber das Verbleiben oder Verharren in dem mit Gibea verbundenen Zustand ausdrücken. Die Wiedergabe bewahrt zugleich den auffälligen Wechsel vom Singular zum Plural.
- source_word: לֹא תַשִּׂיגֵם
  choice: Wird sie nicht … einholen?
  rationale: Die Hifil-Form von נשׂג bedeutet „erreichen, einholen“. Als rhetorische Frage gelesen, kündigt die Wendung an, dass das Gericht sie tatsächlich erreichen wird.
- source_word: מִלְחָמָה
  choice: der Krieg
  rationale: Das Substantiv kann Krieg oder Schlacht bezeichnen; „Krieg“ passt zur umfassenderen geschichtlichen Anspielung auf Richter 19–21.
- source_word: בְּנֵי עַלְוָה
  choice: die Söhne des Unrechts
  rationale: Die formale Wiedergabe erhält die hebräische Bezeichnung für Menschen, die durch Verkehrtheit und Unrecht geprägt sind, ohne sie auf eine einzelne Tat einzuengen.
theological_decisions:
- issue: Deutung der schwierigen Schlussklausel לֹא תַשִּׂיגֵם בַּגִּבְעָה מִלְחָמָה עַל בְּנֵי עַלְוָה
  choice: 'Rhetorische Frage: „Wird sie in Gibea nicht der Krieg gegen die Söhne des Unrechts einholen?“'
  alternative: 'Aussage über Vergangenheit oder Zukunft: „Der Krieg gegen die Söhne des Unrechts in Gibea holte/holt sie nicht ein.“'
  rationale: Syntax und zeitliche Einordnung der Klausel sind unsicher. Die rhetorische Frage passt zum prophetischen Gerichtszusammenhang, während die Fußnote die tatsächlich vorhandenen Alternativen offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Anrede. Der Wechsel von „du“ zu „sie“ sowie die Mehrdeutigkeit der Schlussklausel bleiben erhalten; die ungewöhnliche Formulierung „Söhne des Unrechts“ bewahrt das hebräische Bild.
