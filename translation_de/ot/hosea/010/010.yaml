  terminology: »Völker« für עמים und »gebunden werden« für אסר sind passend. Für יסר ist »züchtigen« im Zusammenhang von Hoseas Gerichtssprache präziser als »zurechtweisen«, ohne die mögliche korrigierende Dimension auszuschließen. Die Fußnote zur umstrittenen Form benennt die bevorzugte schuldbezogene Deutung und die Lesung »ihre beiden Augen«, ohne die beiden Verfehlungen inhaltlich zu identifizieren.
