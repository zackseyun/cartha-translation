  source_fidelity: 'Die Grundstruktur gibt den hebräischen Text zutreffend wieder: Gottes Wille als Auslöser, die Züchtigung Israels, das Versammeln von Völkern gegen sie sowie das Gebundenwerden in Verbindung mit der schwierigen Schlusswendung. »Zurechtweisen« ist für יסר jedoch zu eng, da es im heutigen Deutsch vor allem einen verbalen Tadel bezeichnet, während der Kontext eine wirksame strafende Züchtigung einschließt. »Züchtigen« gibt dies genauer wieder. »Für ihre beiden Verfehlungen« bildet die Funktion von ל genauer ab als das stärker kausale »wegen« und bewahrt zugleich die textliche Unklarheit der Schlusswendung.'
