  text: בְּ/אַוָּתִ֖/י וְ/אֶסֳּרֵ֑/ם וְ/אֻסְּפ֤וּ עֲלֵי/הֶם֙ עַמִּ֔ים בְּ/אָסְרָ֖/ם לִ/שְׁתֵּ֥י עינת/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/010.yaml
  text: When I desire[a], I will discipline them[b], and peoples will be gathered against them when they are bound for their two transgressions.
translation:
  language: de
  text: Wenn ich es will, werde ich sie züchtigen[a], und Völker werden gegen sie versammelt, wenn sie für ihre beiden Verfehlungen gebunden werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zurechtweisen« oder »in Zucht nehmen«. Das hebräische Verb kann sowohl korrigierende Disziplin als auch strafende Züchtigung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die schwer zu deutende hebräische Form wird meist im Sinn von »ihre beiden Verfehlungen« verstanden; möglich ist auch »ihre doppelte Schuld«. Eine andere Lesung ergibt: »ihre beiden Augen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאַוָּתִי
  choice: Wenn ich es will
  rationale: Die Verbindung von ב mit dem Substantiv für Begehren bzw. Willen und dem Suffix der 1. Person Singular bezeichnet hier Gottes Willen als Umstand oder Zeitpunkt seines Handelns. Die Formulierung ist natürliches Deutsch und bewahrt den volitionalen Sinn.
- source_word: וְאֶסֳּרֵם
  choice: werde ich sie zurechtweisen
  rationale: Die Form wird sachlich am besten von יסר, »zurechtweisen, züchtigen, erziehen«, her verstanden, nicht von אסר, »binden«. »Zurechtweisen« lässt sowohl korrigierende Disziplin als auch strafendes Einschreiten zu.
- source_word: וְאֻסְּפוּ עֲלֵיהֶם עַמִּים
  choice: und Völker werden gegen sie versammelt
  rationale: Die passive Form wird beibehalten; עֲלֵיהֶם hat im Gerichts- und Konfliktzusammenhang feindliche Bedeutung. »Völker« gibt den kollektiven Plural עַמִּים wieder.
- source_word: בְּאָסְרָם
  choice: wenn sie … gebunden werden
  rationale: Der Infinitiv von אסר, »binden«, mit ב wird temporal wiedergegeben. Die passive deutsche Form lässt die im knappen Hebräisch nicht ausdrücklich bezeichnete handelnde Instanz offen.
- source_word: לִשְׁתֵּי עינתם
  choice: wegen ihrer beiden Verfehlungen
  rationale: Im Gerichtskontext ist die schwierige Konsonantenform am ehesten auf Schuld bzw. Verfehlung zu beziehen. »Beiden« erhält das ausdrücklich genannte Zahlwort, ohne festzulegen, welche zwei Verfehlungen gemeint sind.
theological_decisions:
- issue: Bedeutung der Schlusswendung לִשְׁתֵּי עינתם
  choice: wegen ihrer beiden Verfehlungen
  alternative: für ihre doppelte Schuld; an ihre beiden Verfehlungen; für ihre beiden Augen
  rationale: Der Zusammenhang spricht deutlich für eine auf Schuld bezogene Deutung, doch die ungewöhnliche Textform und der Bezug der Zahl zwei bleiben erklärungsbedürftig. Daher wird weder eine bestimmte Identifikation der beiden Verfehlungen noch eine konfessionelle Auslegung in den Text aufgenommen.
- issue: Charakter des göttlichen Handelns in וְאֶסֳּרֵם
  choice: zurechtweisen
  alternative: züchtigen; in Zucht nehmen
  rationale: Die Übersetzung bewahrt die Spannung zwischen korrigierender Disziplin und strafendem Gericht, statt das Verb ausschließlich pädagogisch oder ausschließlich vergeltend auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zurechtweisen« ist allgemein verständlich und weniger altertümlich als »züchtigen«, während die Fußnote dessen stärkere Gerichtsbedeutung sichtbar hält. Die sperrige Schlusswendung wird maßvoll geglättet; ihre textliche und inhaltliche Unsicherheit wird in der Fußnote offengelegt.
