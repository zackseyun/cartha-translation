source:
  edition: WLC
  text: וְ/אֶפְרַ֜יִם עֶגְלָ֤ה מְלֻמָּדָה֙ אֹהַ֣בְתִּי לָ/ד֔וּשׁ וַ/אֲנִ֣י עָבַ֔רְתִּי עַל ט֖וּב צַוָּארָ֑/הּ אַרְכִּ֤יב אֶפְרַ֨יִם֙ יַחֲר֣וֹשׁ יְהוּדָ֔ה יְשַׂדֶּד ל֖/וֹ יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/011.yaml
  text: Ephraim was a trained heifer that loved to thresh[a], but I spared her fair neck. I will put Ephraim to the yoke; Judah will plow[c][b]; Jacob will harrow for him.
translation:
  language: de
  text: Ephraim war eine abgerichtete junge Kuh, die gern drosch[a]. Doch ich schonte ihren schönen Hals[d]. Nun werde ich Ephraim ins Joch spannen[b]; Juda wird pflügen, Jakob wird für ihn eggen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Dreschen war für Rinder eine vergleichsweise leichte und angenehme Arbeit, bei der sie vom Ertrag fressen durften.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich etwa: „Ich werde Ephraim reiten lassen.“ Gemeint ist wahrscheinlich, Ephraim anzuschirren oder ins Joch zu spannen.'
    reason: lexical_alternative
  - marker: c
    text: „Eggen“ bedeutet, nach dem Pflügen die Erdschollen zu zerkleinern und den Boden einzuebnen. Das mit „für ihn“ wiedergegebene Pronomen bezieht sich wahrscheinlich auf Juda, doch der Bezug ist nicht völlig sicher.
    reason: cultural_and_syntactic_note
  - marker: d
    text: 'Der hebräische Ausdruck ist schwierig. Auch möglich ist etwa: „Ich ging über ihren schönen Hals hinweg.“ Die Hauptübersetzung versteht die Wendung im Zusammenhang des folgenden Jochs als bisherige Schonung Ephraims.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶגְלָה מְלֻמָּדָה
  choice: eine abgerichtete junge Kuh
  rationale: Die Wendung bezeichnet ein an Arbeit gewöhntes weibliches Jungrind. „Abgerichtet“ bewahrt den Gedanken gezielter Gewöhnung, während „junge Kuh“ im heutigen Deutsch verständlicher ist als das fachsprachlichere „Färse“.
- source_word: אֹהַבְתִּי לָדוּשׁ
  choice: die gern drosch
  rationale: Die Form beschreibt Ephraims gewohnheitsmäßige Vorliebe für das Dreschen. „Gern drosch“ klingt natürlich und bewahrt sowohl den affektiven als auch den wiederholten Aspekt.
- source_word: וַאֲנִי עָבַרְתִּי עַל טוּב צַוָּארָהּ
  choice: Doch ich schonte ihren schönen Hals
  rationale: Die schwierige idiomatische Wendung wird im landwirtschaftlichen Zusammenhang als bisherige Verschonung vor der schwereren Last verstanden. „Doch“ macht den sachlichen Gegensatz zwischen angenehmer Drescharbeit und auferlegtem Joch deutlich, ohne die hebräische Unsicherheit zu verschweigen.
- source_word: אַרְכִּיב אֶפְרַיִם
  choice: Nun werde ich Ephraim ins Joch spannen
  rationale: Das Hifil von רכב bedeutet wörtlich etwa „reiten lassen/aufsetzen“, bezeichnet hier aber wahrscheinlich das Anschirren zur Feldarbeit. „Ins Joch spannen“ macht die im Bild vorausgesetzte Belastung idiomatisch deutlich.
- source_word: יַחֲרֹשׁ
  choice: wird pflügen
  rationale: Dies ist die gewöhnliche landwirtschaftliche Bedeutung des Verbs und passt zur angekündigten Feldarbeit.
- source_word: יְשַׂדֵּד
  choice: wird eggen
  rationale: Das Verb bezeichnet die Bodenbearbeitung nach dem Pflügen, insbesondere das Zerkleinern und Einebnen der Schollen. „Eggen“ ist dafür die präzise deutsche Entsprechung.
- source_word: לּוֹ יַעֲקֹב
  choice: Jakob wird für ihn eggen
  rationale: „Für ihn“ bewahrt das männliche Pronominalsuffix und lässt dessen Bezug wahrscheinlich auf Juda offen, ohne die syntaktische Beziehung zu glätten.
theological_decisions:
- issue: Landwirtschaftliches Bild für Ephraim, Juda und Jakob
  choice: Der Vers zeigt Gott, der Ephraim von der bevorzugten Drescharbeit zur auferlegten schweren Feldarbeit führt; auch Juda und Jakob werden zur Arbeit eingesetzt.
  alternative: Das Bild könnte weniger strafend als bloße Zuweisung verschiedener landwirtschaftlicher Aufgaben verstanden werden.
  rationale: Der Gerichtszusammenhang in Hosea 10 legt eine disziplinierende Belastung nahe. Die Übersetzung erhält diese Spannung, ohne eine spätere konfessionelle Deutung einzutragen.
- issue: Deutung von וַאֲנִי עָבַרְתִּי עַל טוּב צַוָּארָהּ
  choice: „Doch ich schonte ihren schönen Hals“
  alternative: „Und ich ging über ihren schönen Hals hinweg“ beziehungsweise „ich legte Hand an ihren schönen Hals“
  rationale: Der hebräische Ausdruck ist unsicher. Die Hauptfassung folgt dem im Kontext plausiblen Gedanken bisheriger Schonung; die stärker formale Alternative wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher bäuerlicher Bildsprache. Der seltenere Ausdruck „eggen“ bleibt wegen seiner Genauigkeit stehen und wird erläutert. Die schwierige Hals-Klausel wird lesbar wiedergegeben; ihre Unsicherheit wird durch die dokumentierte Alternativdeutung bewahrt.
