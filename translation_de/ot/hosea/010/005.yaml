base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/005.yaml
  text: The inhabitants of Samaria tremble for the calves of Beth-aven, because its people mourn over it, and its idolatrous priests wail over it, over its glory, because it has departed from it.
translation:
  language: de
  text: Die Bewohner Samarias werden um die Kälber von Bet-Awen zittern. Denn sein Volk wird um es trauern, und seine Götzenpriester werden seinetwegen[a] jubeln – wegen seiner Herrlichkeit; denn sie ist von ihm gewichen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „über ihm“. Das Wort steht überraschend neben der Trauer des Volkes; manche verstehen oder korrigieren es deshalb im Sinn von „klagen“.'
    reason: Die ungewöhnliche kontextuelle Spannung sowie die verbreitete alternative Deutung werden transparent gemacht, ohne die masoretische Lesung im Text zu ändern.
  - marker: b
    text: 'Der hebräische Text spricht zunächst von „Kälbern“, verwendet danach aber Einzahlformen: „sein Volk“, „um es“, „seine Priester“, „seine Herrlichkeit“ und „von ihm“. Gemeint sein kann das Kultbild als Einheit oder insbesondere das zentrale Kalb.'
    reason: Der Numeruswechsel im Ausgangstext wird bewahrt und erläutert, ohne seinen Bezug einseitig festzulegen.
lexical_decisions:
- source_word: יָג֖וּרוּ
  choice: zittern um
  rationale: Das Verb bezeichnet hier angstvolles Bangen; die Präposition לְ markiert, worum die Bewohner fürchten.
- source_word: עֶגְלוֹת֙ בֵּ֣ית אָ֔וֶן
  choice: die Kälber von Bet-Awen
  rationale: Der masoretische Text hat den Plural „Kälber“. Der Ortsname wird transliteriert, damit sein polemischer Charakter nicht durch eine vorschnelle Deutung eingeengt wird.
- source_word: כְמָרָי/ו֙
  choice: seine Götzenpriester
  rationale: כמרים ist eine abwertende Bezeichnung für Priester eines fremden Kultes; „Götzenpriester“ gibt diese kultische und polemische Färbung verständlich wieder.
- source_word: יָגִ֔ילוּ
  choice: jubeln
  rationale: Das Verb bedeutet gewöhnlich „jubeln, frohlocken“. Obwohl im Verlustkontext „klagen“ naheläge und die englische Konsultationsfassung „wail“ bietet, wird die belegte hebräische Lesart nicht stillschweigend umgedeutet.
- source_word: גָלָ֥ה מִמֶּֽ/נּוּ
  choice: sie ist von ihm gewichen
  rationale: Das feminine Verbsubjekt bezieht sich am natürlichsten auf „Herrlichkeit“; „gewichen“ vermittelt deren Verlust beziehungsweise Wegführung, ohne die genaue Art des Fortgangs festzulegen.
theological_decisions:
- issue: Spannung zwischen Trauer und Jubel der Götzenpriester
  choice: Die Spannung wird mit „trauert“ und „jubeln“ bewahrt.
  alternative: „Die Götzenpriester klagen/heulen“
  rationale: Der Konsonantentext und die masoretische Vokalisierung stützen „jubeln“. Eine kontextuell motivierte Umdeutung würde die echte textliche Spannung auflösen.
- issue: Bezug der singularischen Pronomen bei pluralischem „Kälber“
  choice: Die singularischen Bezüge werden im Deutschen beibehalten und in einer Fußnote erläutert.
  alternative: Alle Pronomen auf den Plural angleichen
  rationale: Der hebräische Text wechselt vom pluralischen „Kälber“ zu singularischen Suffixen. Dies kann das Kultbild kollektiv oder ein einzelnes Hauptbild im Blick haben; die Übersetzung entscheidet diese Frage nicht endgültig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bet-Awen“ folgt einer geläufigen deutschen Transliteration. Die Syntax bleibt klar und lesbar, während die auffällige Spannung des hebräischen Textes durch Fußnoten offengelegt wird.
