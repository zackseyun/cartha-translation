source:
  edition: WLC
  text: גַּם אוֹת/וֹ֙ לְ/אַשּׁ֣וּר יוּבָ֔ל מִנְחָ֖ה לְ/מֶ֣לֶךְ יָרֵ֑ב בָּשְׁנָה֙ אֶפְרַ֣יִם יִקָּ֔ח וְ/יֵב֥וֹשׁ יִשְׂרָאֵ֖ל מֵ/עֲצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/006.yaml
  text: Even it will be carried to Assyria as tribute for King Yareb[a]; Ephraim will receive shame[b], and Israel will be ashamed of its counsel.
translation:
  language: de
  text: Auch dieses wird nach Assyrien gebracht, als Tribut für König Jareb[a]. Efraim wird Schande erleiden, und Israel wird sich wegen seines Plans[b] schämen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „König Jareb“. Die Bezeichnung kann auch als Titel verstanden werden, etwa „der rächende König“ oder „der streitende König“.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wegen seines Ratschlags“ oder „wegen seiner Politik“. Das Hebräische kann sich auf den eigenen Plan beziehungsweise die politische Strategie Israels oder Efraims beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אוֹתוֹ
  choice: Auch es
  rationale: גַּם hebt hervor, dass selbst das zuvor genannte Kalb beziehungsweise Götzenbild betroffen ist. Das deutsche Neutrum „es“ nimmt natürlich auf „Kalb“ Bezug.
- source_word: לְאַשּׁוּר יוּבָל
  choice: wird nach Assyrien gebracht
  rationale: Der Hofal von יבל bezeichnet das passive Gebrachtwerden; לְ markiert hier das Ziel. „Gebracht“ ist im Deutschen bei einem Kultbild natürlicher als „geführt“.
- source_word: מִנְחָה
  choice: als Tribut
  rationale: Im politischen Zusammenhang mit Assyrien und einem König bezeichnet מִנְחָה am ehesten eine Abgabe an einen übergeordneten Herrscher, nicht ein kultisches Opfer.
- source_word: לְמֶלֶךְ יָרֵב
  choice: für König Jareb
  rationale: יָרֵב wird im Haupttext als namensähnliche königliche Bezeichnung transliteriert. Die mögliche Deutung als beschreibender Titel bleibt in der Fußnote erhalten.
- source_word: בָּשְׁנָה יִקָּח
  choice: wird Schande davontragen
  rationale: Wörtlich nimmt beziehungsweise empfängt Efraim „Schande“. „Schande davontragen“ gibt das Ergebnis idiomatisch wieder, ohne einen zusätzlichen Handelnden einzuführen.
- source_word: וְיֵבוֹשׁ
  choice: wird sich schämen
  rationale: Das Qal von בוש kann sowohl das Empfinden von Scham als auch das Zuschandenwerden ausdrücken. Die reflexive Wiedergabe bewahrt hier den unmittelbaren verbalen Sinn.
- source_word: מֵעֲצָתוֹ
  choice: wegen seines Plans
  rationale: מִן kann nach בוש den Grund bezeichnen. עֵצָה meint Rat, Beschluss, Plan oder politische Strategie; „Plan“ ist im Zusammenhang mit Israels verfehlter Politik natürlich und lässt den Bezug des maskulinen Suffixes auf Israel beziehungsweise Efraim offen.
theological_decisions:
- issue: Bedeutung von יָרֵב
  choice: Als königliche Bezeichnung „König Jareb“ transliterieren
  alternative: „der rächende König“ oder „der streitende König“
  rationale: Die Form kann als Name beziehungsweise fester Herrschertitel oder als beschreibendes Epitheton verstanden werden. Die Transliteration im Haupttext vermeidet eine spekulative Festlegung; die Bedeutungsvarianten werden in der Fußnote genannt.
- issue: Bezug von עֲצָתוֹ
  choice: „seines Plans“ mit Erläuterung der möglichen korporativen Beziehung
  alternative: „wegen seiner Politik“, „wegen seines Ratschlags“ oder mit ausdrücklichem Bezug auf Israel beziehungsweise Efraim
  rationale: Das maskuline Singularsuffix kann korporativ auf Israel oder Efraim bezogen werden. Der Haupttext sollte diese im Hebräischen nicht vollständig aufgelöste Beziehung nicht unnötig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am prophetischen Hebräisch, während „Schande davontragen“ und „wegen seines Plans“ für heutige Leser natürlich formuliert sind.
