  text: גֶּ֤פֶן בּוֹקֵק֙ יִשְׂרָאֵ֔ל פְּרִ֖י יְשַׁוֶּה לּ֑/וֹ כְּ/רֹ֣ב לְ/פִרְי֗/וֹ הִרְבָּה֙ לַֽ/מִּזְבְּח֔וֹת כְּ/ט֣וֹב לְ/אַרְצ֔/וֹ הֵיטִ֖יבוּ מַצֵּבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/001.yaml
  text: Israel is a luxuriant vine that yields fruit for himself[a]. The more his fruit increased, the more he multiplied altars; the better his land became[c][b], the better they made the sacred pillars.
translation:
  language: de
  text: Israel ist ein üppig rankender Weinstock, der für sich Frucht trägt.[a] Je mehr seine Frucht zunahm, desto mehr Altäre errichtete er; je besser es seinem Land ging, desto schöner gestalteten sie die Kultsteine.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Israel ist ein sich entleerender Weinstock« oder »ein sich ausbreitender Weinstock«. Das hebräische Wort ist schwer zu deuten; der Haupttext folgt dem Zusammenhang von reicher Frucht und gedeihendem Land.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: »Standsteine« oder »Kultsäulen«. Gemeint sind aufgerichtete Steine, die kultischen Zwecken dienten und hier zum verurteilten Götzendienst gehören.'
    reason: cultural_note
lexical_decisions:
- source_word: גֶּפֶן בּוֹקֵק
  choice: ein üppig rankender Weinstock
  rationale: גֶּפֶן bezeichnet den Weinstock. בּוֹקֵק ist schwierig; angesichts der zunehmenden Frucht und des gedeihenden Landes liegt hier ein üppig wachsender beziehungsweise sich ausbreitender Weinstock näher als ein »leerer« Weinstock.
- source_word: פְּרִי יְשַׁוֶּה לּוֹ
  choice: der für sich Frucht trägt
  rationale: Die schwierige Wendung wird im Bild des Weinstocks als Fruchtbringen verstanden. »Für sich« gibt לּוֹ wieder und bewahrt den möglichen reflexiven beziehungsweise eigennützigen Beiklang.
- source_word: כְּרֹב לְפִרְיוֹ
  choice: Je mehr seine Frucht zunahm
  rationale: Die proportionale Konstruktion wird im Deutschen natürlich mit »je mehr … desto mehr« ausgedrückt.
- source_word: הִרְבָּה לַמִּזְבְּחוֹת
  choice: desto mehr Altäre errichtete er
  rationale: הִרְבָּה bezeichnet das Vermehren. Bei Altären ist »errichten« idiomatischer als das wörtlichere »vermehren« und lässt den kultischen Zusammenhang deutlich werden.
- source_word: כְּטוֹב לְאַרְצוֹ
  choice: je besser es seinem Land ging
  rationale: טוֹב bezeichnet hier das gute Gedeihen beziehungsweise den Wohlstand des Landes, nicht dessen moralische Güte.
- source_word: הֵיטִיבוּ מַצֵּבוֹת
  choice: desto prächtiger machten sie die Kultsteine
  rationale: הֵיטִיבוּ bedeutet hier, die Objekte besser oder schöner auszugestalten. מַצֵּבוֹת sind aufgerichtete Steine mit kultischer Funktion; »Kultsteine« ist verständlich und im verurteilten religiösen Kontext nicht positiv wertend.
theological_decisions:
- issue: Verhältnis von Wohlstand und Götzendienst
  choice: Der Vers schildert Israel als fruchtbar und wohlhabend, doch der Zuwachs wird für immer mehr Altäre und prächtigere Kultsteine eingesetzt.
  alternative: Der Anfang kann als »Israel ist ein leerer/entleerender Weinstock« verstanden werden.
  rationale: Die anschließenden Aussagen über zunehmende Frucht und das Wohlergehen des Landes stützen die ironische Darstellung von Wachstum und Wohlstand, die in unerlaubten Kult münden. Die lexikalische Unsicherheit des Anfangs bleibt in der Fußnote sichtbar.
- issue: Wechsel zwischen Singular und Plural
  choice: Israel wird zunächst kollektiv im Singular als »er« aufgenommen; beim letzten Verb bleibt der hebräische Wechsel zum Plural als »sie« erhalten.
  alternative: Alle Verbformen könnten zur Glättung einheitlich im Singular oder Plural wiedergegeben werden.
  rationale: Der Numeruswechsel ist im Hebräischen vorhanden und kann den Übergang vom Kollektiv Israel zu seinen Angehörigen beziehungsweise Handelnden markieren. Eine Vereinheitlichung würde diese Spannung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Je-desto-Struktur bildet die hebräischen Proportionalsätze klar ab. »Üppig rankend« erhält das Weinbergsbild; »Kultsteine« erklärt die religiöse Funktion knapp. Der auffällige Wechsel vom kollektiven Singular »er« zum Plural »sie« wurde nicht geglättet.
