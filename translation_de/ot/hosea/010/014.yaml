base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/014.yaml
  text: The tumult will arise among your people[a], and all your fortresses will be devastated, as Shalman devastated Beth-arbel on the day of battle[b]; mothers were dashed to pieces with their children.
translation:
  language: de
  text: Kriegslärm wird sich unter deinem Volk erheben, und alle deine Festungen werden verwüstet, wie Schalman Bet-Arbel am Tag der Schlacht verwüstete[a]; eine Mutter wurde samt ihren Kindern zerschmettert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Schalman könnte einen der assyrischen Könige namens Salmanassar bezeichnen; die genaue historische Identifizierung ist jedoch unsicher.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „Eine Mutter wurde auf Kindern zerschmettert.“ Die hebräische Wendung ist knapp und drastisch; möglicherweise ist „Mutter“ hier kollektiv gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָאם שָׁאוֹן
  choice: Dann wird sich Kriegslärm erheben
  rationale: Das prophetisch gebrauchte Perfekt kündigt ein kommendes Geschehen an. שָׁאוֹן bezeichnet laute, zerstörerische Unruhe und erhält im militärischen Zusammenhang mit „Kriegslärm“ eine natürliche und präzise deutsche Wiedergabe.
- source_word: בְּעַמֶּךָ
  choice: unter deinem Volk
  rationale: Die Präposition ב bezeichnet hier den Bereich, in dem der Lärm ausbricht; „unter“ ist im Deutschen idiomatisch.
- source_word: מִבְצָרֶיךָ
  choice: deine Festungen
  rationale: Das Wort bezeichnet befestigte Verteidigungsorte; „Festungen“ bewahrt den militärischen Sinn knapp und verständlich.
- source_word: יוּשַּׁד
  choice: werden verwüstet werden
  rationale: Die passive Form von שׁדד umfasst gewaltsame Plünderung und Zerstörung. „verwüstet“ gibt beides angemessen wieder.
- source_word: שַׁלְמַן
  choice: Schalman
  rationale: Der hebräische Name wird transliteriert, ohne die unsichere historische Gleichsetzung mit einem bestimmten Salmanassar vorwegzunehmen.
- source_word: בֵּית אַרְבֵאל
  choice: Bet-Arbel
  rationale: Der Ortsname wird nach seiner hebräischen Form transliteriert; der Bindestrich macht die Namenseinheit gut lesbar.
- source_word: בְּיוֹם מִלְחָמָה
  choice: am Tag der Schlacht
  rationale: Die Wendung verweist auf ein bestimmtes Kampfereignis; „Schlacht“ ist hier präziser als das allgemeinere „Krieg“.
- source_word: אֵם עַל בָּנִים רֻטָּשָׁה
  choice: eine Mutter wurde samt ihren Kindern zerschmettert
  rationale: Der morphologische Singular „Mutter“ bleibt erhalten. „samt ihren Kindern“ gibt die knappe und schwer eindeutig aufzulösende Verbindung mit עַל idiomatisch wieder, während „zerschmettert“ die brutale Gewalt von רטש ausdrückt.
theological_decisions:
- issue: Identität Schalmans
  choice: Der Name wird als „Schalman“ wiedergegeben.
  alternative: Identifizierung mit Salmanassar III. oder Salmanassar V.
  rationale: Der hebräische Text nennt שַׁלְמַן, erlaubt aber keine sichere historische Identifizierung. Die Übersetzung bewahrt diese Offenheit.
- issue: Bedeutung der abschließenden Gräuelszene
  choice: „eine Mutter wurde samt ihren Kindern zerschmettert“
  alternative: 'Wörtlicher: „Eine Mutter wurde auf Kindern zerschmettert“; kollektiv: „Mütter wurden mit ihren Kindern zerschmettert“.'
  rationale: Die hebräische Formulierung ist knapp und drastisch. Die gewählte Fassung erhält den Singular und die Gewalt, ohne den genauen Ablauf über den Text hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Bildsprache und die Härte der Schlusszeile bleiben erhalten; unsichere historische und syntaktische Einzelheiten werden nicht stillschweigend aufgelöst.
