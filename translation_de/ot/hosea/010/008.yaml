source:
  edition: WLC
  text: וְ/נִשְׁמְד֞וּ בָּמ֣וֹת אָ֗וֶן חַטַּאת֙ יִשְׂרָאֵ֔ל ק֣וֹץ וְ/דַרְדַּ֔ר יַעֲלֶ֖ה עַל מִזְבְּחוֹתָ֑/ם וְ/אָמְר֤וּ לֶֽ/הָרִים֙ כַּסּ֔וּ/נוּ וְ/לַ/גְּבָע֖וֹת נִפְל֥וּ עָלֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/008.yaml
  text: The high places of Aven[a], the sin of Israel, will be destroyed. Thorn and thistle will grow up on their altars, and they will say to the mountains, “Cover us!” and to the hills, “Fall on us!”
translation:
  language: de
  text: 'Die Kulthöhen von Awen[a], Israels Sünde, werden vernichtet. Dornen und Disteln werden auf ihren Altären wachsen. Dann werden sie zu den Bergen sagen: »Bedeckt uns!«, und zu den Hügeln: »Fallt auf uns!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Kulthöhen des Unheils« beziehungsweise »des Frevels«. Das hebräische Wort Awen kann als Ortsname dienen und zugleich »Unheil«, »Frevel« oder »Nichtigkeit« bedeuten; wahrscheinlich liegt hier ein Wortspiel vor.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּמוֹת
  choice: Kulthöhen
  rationale: Bezeichnet erhöhte oder als »Höhen« bezeichnete Kultstätten. »Kulthöhen« bewahrt den religiösen Sinn und ist im modernen Deutsch verständlicher als das bloße »Höhen«.
- source_word: אָוֶן
  choice: Awen
  rationale: Die Form kann hier als Ortsname verstanden werden, trägt aber zugleich die Bedeutung »Unheil« oder »Frevel«. Der Haupttext wahrt den möglichen Ortsbezug; die Fußnote erhält das Wortspiel.
- source_word: חַטַּאת יִשְׂרָאֵל
  choice: Israels Sünde
  rationale: Die Wendung steht appositionell zu den Kulthöhen und bezeichnet sie als Israels Sünde. Die Bedeutung »Sündopfer« passt nicht zum Zusammenhang.
- source_word: נִשְׁמְדוּ
  choice: werden vernichtet
  rationale: Das Nifal von שׁמד bezeichnet vollständige Zerstörung. »Vernichtet« gibt die Stärke des prophetischen Gerichtswortes knapp wieder.
- source_word: קוֹץ וְדַרְדַּר
  choice: Dornen und Disteln
  rationale: Die geläufige deutsche Paarformel vermittelt Verwilderung, Verlassenheit und Anklänge an Fluchmotive.
- source_word: יַעֲלֶה עַל מִזְבְּחוֹתָם
  choice: werden auf ihren Altären wachsen
  rationale: עלה beschreibt bei Pflanzen das Aufwachsen. Der deutsche Plural richtet sich natürlich nach »Dornen und Disteln«, während das hebräische Verb formal im Singular steht.
- source_word: כַּסּוּנוּ
  choice: Bedeckt uns
  rationale: Der Imperativ wird direkt wiedergegeben und bewahrt das eindringliche Bild des Verbergens unter den Bergen.
- source_word: נִפְלוּ עָלֵינוּ
  choice: Fallt auf uns
  rationale: Die unmittelbare Aufforderung erhält die verzweifelte Bitte, vom Gericht begraben oder verborgen zu werden.
theological_decisions:
- issue: Ob אָוֶן als Ortsname oder als Gattungsbegriff zu verstehen ist
  choice: Im Haupttext als Ortsname »Awen« beibehalten
  alternative: »die Kulthöhen des Unheils« oder »die Kulthöhen des Frevels«
  rationale: Die Syntax lässt sowohl einen Ortsbezug als auch eine abwertende Bezeichnung zu; Hosea gebraucht zudem andernorts Wortspiele mit Bet-Awen. Haupttext und Fußnote bewahren gemeinsam diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Kulthöhen« macht den kultischen Bezug ausdrücklich, ohne eine bestimmte konfessionelle Deutung einzutragen. Die kurzen Imperative bleiben wegen ihrer rhetorischen Wucht wörtlich erhalten.
