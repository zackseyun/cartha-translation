source:
  edition: WLC
  text: חֲרַשְׁתֶּם רֶ֛שַׁע עַוְלָ֥תָ/ה קְצַרְתֶּ֖ם אֲכַלְתֶּ֣ם פְּרִי כָ֑חַשׁ כִּֽי בָטַ֥חְתָּ בְ/דַרְכְּ/ךָ֖ בְּ/רֹ֥ב גִּבּוֹרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/013.yaml
  text: You have plowed wickedness[a]; you have reaped injustice; you have eaten the fruit of deceit, because you trusted in your way[c][b], in the multitude of your warriors.
translation:
  language: de
  text: Ihr habt Bosheit gepflügt, Unrecht geerntet und die Frucht der Täuschung[a] gegessen. Denn du hast auf deinen Weg vertraut[b], auf die große Zahl deiner Krieger[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Falschheit“ oder „des Trugs“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen wechselt die Anrede hier vom Plural („ihr habt gepflügt, geerntet und gegessen“) zum Singular („du hast vertraut … dein Weg … deine Krieger“). Israel wird dabei offenbar als Einheit angesprochen.
    reason: cultural_note
  - marker: c
    text: 'Oder: „deiner starken Männer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרַשְׁתֶּם
  choice: ihr habt … gepflügt
  rationale: Die wörtliche landwirtschaftliche Bildsprache wird beibehalten und mit „geerntet“ und „gegessen“ als zusammenhängende Folge wiedergegeben.
- source_word: רֶשַׁע
  choice: Bosheit
  rationale: „Bosheit“ bezeichnet hier deutlich moralisch verwerfliches Handeln und eignet sich als metaphorischer Gegenstand des Pflügens.
- source_word: עַוְלָתָה
  choice: Unrecht
  rationale: Das Wort kann Unrecht, Ungerechtigkeit oder Verkehrtheit bezeichnen. „Unrecht“ ist prägnant, natürlich und bewahrt sowohl die moralische als auch die soziale Dimension.
- source_word: קְצַרְתֶּם
  choice: ihr habt … geerntet
  rationale: Die wörtliche Erntesprache setzt die mit „gepflügt“ begonnene Metapher fort.
- source_word: אֲכַלְתֶּם
  choice: ihr habt … gegessen
  rationale: Die direkte Wiedergabe vollendet die Bildfolge vom Pflügen über das Ernten bis zum Essen.
- source_word: פְּרִי כָחַשׁ
  choice: die Frucht der Täuschung
  rationale: Die Konstruktverbindung wird natürlich wiedergegeben. „Täuschung“ erfasst den Sinn von Irreführung beziehungsweise Falschheit, ohne ihn auf bloße unwahre Aussagen zu beschränken.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt hier die Begründung für die vorausgehende Anklage ein.
- source_word: בָטַחְתָּ
  choice: du hast … vertraut
  rationale: „Vertrauen“ gibt den Grundsinn des Sich-Verlassens wieder. Der Singular der hebräischen Form bleibt im Deutschen sichtbar.
- source_word: בְדַרְכְּךָ
  choice: auf deinen Weg
  rationale: „Weg“ bewahrt das hebräische Bild, das sowohl den eingeschlagenen Kurs als auch das Verhalten bezeichnen kann. Die Präposition „auf“ entspricht der üblichen deutschen Verbindung mit „vertrauen“.
- source_word: בְּרֹב
  choice: auf die große Zahl
  rationale: Im Zusammenhang militärischen Vertrauens bezeichnet רֹב die zahlenmäßige Stärke; „die große Zahl“ ist im heutigen Deutsch natürlicher als „die Menge“.
- source_word: גִּבּוֹרֶיךָ
  choice: deiner Krieger
  rationale: Obwohl das Wort allgemein starke oder mächtige Männer bezeichnen kann, legt der Zusammenhang militärischer Selbstsicherheit „Krieger“ nahe.
theological_decisions:
- issue: Wechsel von der zweiten Person Plural zur zweiten Person Singular
  choice: Den Numeruswechsel als „ihr habt …“ und anschließend „du hast …“ sichtbar bewahren.
  alternative: Den gesamten Vers einheitlich im Plural formulieren oder den kollektiven Adressaten ausdrücklich als Israel benennen.
  rationale: Der hebräische Text wechselt ohne ausdrückliche Erklärung vom Plural zum Singular. Wahrscheinlich wird Israel zunächst kollektiv im Plural und dann als eine Einheit angesprochen. Die Übersetzung bewahrt diese prophetische Spannung, statt sie stillschweigend zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klar erhaltener landwirtschaftlicher Metapher. Das Perfekt klingt in gegenwärtiger deutscher Anklagerede natürlich. Der auffällige Wechsel von Plural zu Singular wird nicht geglättet; die Fußnotenmarker stehen jeweils unmittelbar an der betreffenden Stelle.
