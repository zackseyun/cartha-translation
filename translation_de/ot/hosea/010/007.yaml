source:
  edition: WLC
  text: נִדְמֶ֥ה שֹׁמְר֖וֹן מַלְכָּ֑/הּ כְּ/קֶ֖צֶף עַל פְּנֵי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/007.yaml
  text: Samaria is cut off[b][a], her king like foam on the surface of the waters.
translation:
  language: de
  text: Samaria ist vernichtet[a] – sein König wie Schaum[b] auf der Wasseroberfläche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Samaria ist zugrunde gegangen“ beziehungsweise „zum Schweigen gebracht“. Das hebräische Verb kann ausdrücken, dass jemand oder etwas ein Ende findet, vernichtet oder zum Schweigen gebracht wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ein Holzspan auf der Wasseroberfläche“. Manche verstehen das Bild als ein kleines Stück Holz oder Treibgut, das hilflos dahintreibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְמֶה
  choice: ist vernichtet
  rationale: Das Nifal von דמה bezeichnet hier am ehesten das Zugrundegehen bzw. die Beseitigung Samarias. „Ist vernichtet“ ist im Deutschen klar und lässt die politische Katastrophe erkennen, ohne das Bild des folgenden Satzteils auszudeuten.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Übliche deutsche Namensform für die Hauptstadt, die hier zugleich für das Nordreich stehen kann.
- source_word: מַלְכָּהּ
  choice: sein König
  rationale: Das hebräische Suffix ist feminin Singular und bezieht sich auf die als weiblich gedachte Stadt. Im Deutschen ist „Samaria“ grammatisch sächlich; „sein König“ entspricht daher dem natürlichen deutschen Genusgebrauch.
- source_word: כְּקֶצֶף
  choice: wie Schaum
  rationale: קֶצֶף kann Schaum oder Gischt bezeichnen und vermittelt Vergänglichkeit und hilfloses Forttreiben. Die mögliche Deutung als Holzspan oder Treibgut wird in einer Fußnote bewahrt.
- source_word: עַל פְּנֵי מָיִם
  choice: auf der Wasseroberfläche
  rationale: Die Wendung bedeutet wörtlich „auf dem Angesicht des Wassers/der Wasser“. „Auf der Wasseroberfläche“ gibt das Bild in natürlichem modernem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich erhält die knappe hebräische Gegenüberstellung; im zweiten Satzteil wird kein im Hebräischen fehlendes Verb ergänzt. Die Mehrdeutigkeit der beiden zentralen Wörter wird durch Fußnoten offengehalten.
