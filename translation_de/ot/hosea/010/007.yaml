  source_fidelity: Die Übersetzung gibt נִדְמֶה zutreffend als endgültigen Untergang wieder und bewahrt die knappe, verblose Vergleichskonstruktion des Hebräischen im zweiten Satzteil. „Schaum auf der Wasseroberfläche“ entspricht der naheliegenden Bedeutung von כְּקֶצֶף עַל־פְּנֵי מָיִם; die in der Forschung vertretene Deutung als Span/Treibgut ist angemessen in der Fußnote vermerkt.
  naturalness: „Samaria ist vernichtet – sein König wie Schaum auf der Wasseroberfläche“ ist knapp, würdevoll und in modernem Standarddeutsch als poetisch-prophetische Aussage gut verständlich. Der Gedankenstrich markiert die hebräische Parataxe sinnvoll.
  terminology: „Samaria“ ist die übliche deutsche Namensform. „Sein König“ ist trotz des femininen hebräischen Suffixes korrektes natürliches Deutsch, da „Samaria“ im Deutschen sächlich gebraucht wird. Die Fußnoten zu „vernichtet“ und „Schaum“ bilden die relevanten lexikalischen Spielräume ohne Überinterpretation ab.
