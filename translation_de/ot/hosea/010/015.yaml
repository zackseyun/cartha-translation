  text: כָּ֗כָה עָשָׂ֤ה לָ/כֶם֙ בֵּֽית אֵ֔ל מִ/פְּנֵ֖י רָעַ֣ת רָֽעַתְ/כֶ֑ם בַּ/שַּׁ֕חַר נִדְמֹ֥ה נִדְמָ֖ה מֶ֥לֶךְ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/015.yaml
  text: Thus Bethel has done to you because of your great evil[b][a]. At dawn the king of Israel will be utterly cut off.
translation:
  language: de
  text: So hat Bethel euch behandelt wegen eurer großen Bosheit[a]. Bei Tagesanbruch wird Israels König völlig vernichtet werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wegen der Bosheit eurer Bosheit“. Die Wiederholung verstärkt die Aussage.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wird völlig beseitigt werden“ oder „wird ganz zum Schweigen gebracht werden“. Die hebräische Verbindung eines absoluten Infinitivs mit der Verbform verstärkt die Aussage.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּכָה
  choice: So
  rationale: Das deiktische Adverb bezeichnet hier die Art beziehungsweise das Ergebnis des angekündigten Gerichts und knüpft knapp an den vorausgehenden Zusammenhang an.
- source_word: עָשָׂה לָכֶם
  choice: hat es euch angetan
  rationale: Die Wendung gibt das Perfekt mit indirektem Objekt in natürlichem Deutsch wieder. Das Pronomen „es“ nimmt das zuvor geschilderte Unheil auf, ohne dessen Art zusätzlich festzulegen.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Im Kontext liegt der Ortsname vor. Die Transliteration bewahrt den historischen Bezug und lässt eine mögliche metonymische Verwendung offen.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Grund des Gerichts.
- source_word: רָעַת רָעַתְכֶם
  choice: eurer großen Bosheit
  rationale: Die Wiederholung von רָעָה wirkt verstärkend. „Große Bosheit“ vermittelt diese Intensivierung in verständlichem, natürlichem Deutsch.
- source_word: בַּשַּׁחַר
  choice: Bei Tagesanbruch
  rationale: Die Zeitangabe bezeichnet den frühen Morgen und vermittelt zugleich die Plötzlichkeit des eintretenden Gerichts.
- source_word: נִדְמֹה נִדְמָה
  choice: wird ... völlig vernichtet werden
  rationale: Der absolute Infinitiv neben der finiten Verbform verstärkt die Aussage. „Völlig“ bildet diese Emphase ab; „vernichtet werden“ passt zum gerichtlichen Zusammenhang, während die mögliche Bedeutung „zum Schweigen gebracht werden“ in der Fußnote erhalten bleibt.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Israels König
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung knapp und eindeutig wieder.
theological_decisions:
- issue: Bezug von „Bethel“
  choice: Der Ortsname „Bethel“ bleibt im Haupttext stehen und kann metonymisch für das dortige Kultzentrum samt seinem schuldhaften Handeln stehen.
  alternative: Bethel ausdrücklich als das Kalbsbild oder als Bezeichnung des gesamten götzendienerischen Systems auslegen.
  rationale: Der hebräische Text nennt unmittelbar den Ort. Eine genauere Identifizierung im Haupttext würde die mögliche Metonymie stärker festlegen, als es die Formulierung erlaubt.
- issue: Kraft der Wiederholung רָעַת רָעַתְכֶם
  choice: Die Wiederholung wird als Intensivierung verstanden und mit „eurer großen Bosheit“ wiedergegeben.
  alternative: Wörtlicher „wegen der Bosheit eurer Bosheit“ oder stärker deutend „wegen eurer abgrundtiefen Bosheit“.
  rationale: Die gewählte Form bewahrt die Schwere des Vorwurfs, bleibt aber idiomatisches modernes Deutsch.
- issue: Bedeutung von נִדְמֹה נִדְמָה
  choice: Die Aussage bezeichnet die sichere, vollständige Vernichtung des Königs.
  alternative: „wird völlig abgeschnitten“ oder „wird ganz zum Schweigen gebracht“.
  rationale: Das Verb kann in diesem Zusammenhang Vernichtung beziehungsweise Beseitigung, möglicherweise auch Verstummen, bezeichnen. Die Hauptfassung entspricht dem Gerichtskontext, während die Fußnote die lexikalische Mehrdeutigkeit offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. „Bei Tagesanbruch“ wahrt die Bildhaftigkeit, während die beiden Fußnoten ungewöhnliche hebräische Verstärkungsformen und echte Bedeutungsalternativen transparent machen.
