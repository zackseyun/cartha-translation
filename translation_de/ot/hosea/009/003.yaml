id: HOS.9.3
reference: Hosea 9:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹ֥א יֵשְׁב֖וּ בְּ/אֶ֣רֶץ יְהוָ֑ה וְ/שָׁ֤ב אֶפְרַ֨יִם֙ מִצְרַ֔יִם וּ/בְ/אַשּׁ֖וּר טָמֵ֥א יֹאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/003.yaml
  text: They will not remain in the land of Yahweh[a]; Ephraim will return to Egypt[c][b], and in Assyria they will eat unclean food.
translation:
  language: de
  text: Sie werden nicht im Land Jahwes bleiben[a]. Ephraim wird nach Ägypten zurückkehren[b], und in Assyrien werden sie Unreines essen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wohnen“.'
    reason: lexical_alternative
  - marker: b
    text: „Ägypten“ kann wörtlich gemeint sein oder als Bild für erneute Knechtschaft und Verbannung; neben der Erwähnung Assyriens lässt der hebräische Text diese Spannung bestehen.
    reason: alternative_reading
  - marker: c
    text: 'Das heißt: kultisch unreine Speisen.'
    reason: clarification
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: bleiben
  rationale: יָשַׁב kann „wohnen“ oder „sich aufhalten“ bedeuten. Im negierten Gerichtswort hebt „bleiben“ hervor, dass ihr Aufenthalt im Land endet, ohne die Grundbedeutung „wohnen“ auszuschließen.
- source_word: בְּאֶרֶץ יְהוָה
  choice: im Land Jahwes
  rationale: Die Formulierung bewahrt die Aussage, dass das Land Jahwe gehört, und gibt den Gottesnamen als „Jahwe“ wieder.
- source_word: וְשָׁב
  choice: wird … zurückkehren
  rationale: Das Verb שׁוּב bezeichnet hier im prophetischen Zusammenhang eine künftige Rückkehr; die deutsche Futurform macht diesen Zeitbezug klar.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der ausdrücklich genannte Name bleibt erhalten, auch wenn er stellvertretend für das Nordreich stehen kann.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Der Ortsname wird unverändert wiedergegeben, sodass offenbleibt, ob er wörtlich, typologisch oder mit beiden Bezügen gemeint ist.
- source_word: וּבְאַשּׁוּר
  choice: und in Assyrien
  rationale: Das einfache ו wird koordinierend mit „und“ wiedergegeben; dadurch werden Ägypten und Assyrien weder harmonisiert noch gegeneinander ausgespielt.
- source_word: טָמֵא יֹאכֵלוּ
  choice: werden sie Unreines essen
  rationale: Das substantivisch gebrauchte Adjektiv wird als „Unreines“ wiedergegeben. So bleibt der kultisch-rituelle Sinn erhalten, ohne das im Hebräischen nicht ausdrücklich stehende Wort „Speisen“ in den Haupttext einzufügen.
theological_decisions:
- issue: Ist „Ägypten“ ein wörtliches Ziel oder ein Bild erneuter Knechtschaft und Verbannung?
  choice: Der Ortsname „Ägypten“ bleibt im Haupttext stehen, ohne seine Funktion festzulegen.
  alternative: Ägypten ausschließlich als Sinnbild des Exils verstehen oder Assyrien als einziges tatsächliches Ziel auffassen.
  rationale: Der hebräische Text nennt ausdrücklich sowohl Ägypten als auch Assyrien. Hoseas Sprachgebrauch erlaubt eine typologische Anspielung auf frühere Knechtschaft, doch die Übersetzung soll diese Spannung bewahren.
- issue: Bedeutung von טָמֵא im Exil
  choice: „Unreines“ mit kultisch-ritueller Bedeutung
  alternative: Allgemein „verdorbene“ oder bloß hygienisch ungeeignete Nahrung
  rationale: Im Zusammenhang mit der Entfernung aus Jahwes Land bezeichnet der Ausdruck kultische Unreinheit; er sollte nicht auf Hygiene reduziert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Satzstruktur bleibt erhalten. Der Wechsel vom Kollektivnamen „Ephraim“ zum Plural „sie“ folgt dem hebräischen Numeruswechsel und verdeutlicht zugleich, dass Ephraim für das Volk steht.
