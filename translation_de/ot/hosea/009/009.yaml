  text: הֶעְמִֽיקוּ שִׁחֵ֖תוּ כִּ/ימֵ֣י הַ/גִּבְעָ֑ה יִזְכּ֣וֹר עֲוֺנָ֔/ם יִפְק֖וֹד חַטֹּאותָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/009.yaml
  text: They have gone deep into corruption[a], as in the days of Gibeah; he will remember their iniquity[b]; he will punish their sins.
translation:
  language: de
  text: Sie haben sich tief ins Verderben gestürzt[b], wie in den Tagen von Gibea[a]. Er wird an ihre Schuld denken; er wird ihre Sünden ahnden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gibea erinnert an das berüchtigte Verbrechen von Gibea und seine Folgen in Richter 19–21; diese Ereignisse dienen hier als Vergleich für Israels Verderbtheit.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich etwa: „Sie haben tief verderbt gehandelt.“ Die hebräische Wortverbindung ist knapp und idiomatisch; sie beschreibt tiefgreifende Verderbtheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיקוּ שִׁחֵתוּ
  choice: sie haben sich tief ins Verderben gestürzt
  rationale: Die knappe hebräische Verbindung bezeichnet ein tiefes Hineingeraten in Verderbtheit. Die Wiedergabe bewahrt das Bild der Tiefe und gibt שׁחת als moralisches Verderben wieder, ohne die Wendung in unnatürliches Deutsch zu zerlegen.
- source_word: כִּימֵי הַגִּבְעָה
  choice: wie in den Tagen von Gibea
  rationale: כְּ kennzeichnet den Vergleich; die Formulierung verweist auf die Ereignisse von Gibea in Richter 19–21.
- source_word: יִזְכּוֹר עֲוֺנָם
  choice: er wird an ihre Schuld denken
  rationale: זכר wird mit „an … denken“ idiomatisch wiedergegeben. „Schuld“ bewahrt bei עָוֹן die mögliche Spannung zwischen schuldhaftem Unrecht und daraus erwachsener Schuld.
- source_word: יִפְקֹד חַטֹּאותָם
  choice: er wird ihre Sünden ahnden
  rationale: פקד bezeichnet hier im Gerichtszusammenhang ein strafendes Einschreiten. „Ahnden“ gibt diesen gerichtlichen Sinn prägnant wieder; חַטָּאת bezeichnet parallel zu עָוֹן die Sünden, nicht Sündopfer.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt der Gerichtsverben
  choice: Das maskuline Singularpronomen „Er“ bleibt stehen und verweist im Kontext auf Gott.
  alternative: Gott ausdrücklich als Subjekt nennen oder die Aussage unpersönlich formulieren.
  rationale: Der hebräische Text nennt das Subjekt nicht ausdrücklich, doch der Zusammenhang weist auf Gott. Das Pronomen bewahrt diese kontextuelle Klarheit, ohne den Gottesnamen in den Wortlaut einzufügen.
- issue: Bedeutungsumfang von עָוֹן
  choice: Schuld
  alternative: Unrecht; Vergehen; Missetat
  rationale: „Schuld“ lässt sowohl die moralische Verfehlung als auch den Zustand des Schuldigseins anklingen und löst die lexikalische Spannung nicht unnötig auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ins Verderben gestürzt“ macht die gedrängte Bildsprache verständlich; „ahnden“ hält den gerichtlichen Ton. Das satzinitiale „Er“ ist grammatisch großgeschrieben und keine besondere reverenzielle Schreibung.
