base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/011.yaml
  text: Ephraim—their glory will fly away like a bird—from birth[a], from the womb[b], and from conception.
translation:
  language: de
  text: 'Ephraim – ihre Herrlichkeit[a] wird wie ein Vogel davonfliegen: von Geburt, Mutterleib und Empfängnis[b] weg.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „ihre Ehre“ oder „ihren Glanz“. Im Zusammenhang ist mit Ephraims „Herrlichkeit“ wohl besonders seine Nachkommenschaft und Fruchtbarkeit gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen: „von der Geburt und vom Mutterleib und von der Empfängnis/Schwangerschaft“. Die dreifache Wendung beschreibt den Verlust von Kindern in jedem Stadium; die Stadien werden rückwärts genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der Eigenname bezeichnet hier das personifiziert angesprochene Nordreich beziehungsweise den Stamm Ephraim.
- source_word: כָּעוֹף
  choice: wie ein Vogel
  rationale: Die Vergleichspartikel כְּ und das konkrete Bild von עוֹף werden in natürlichem Deutsch als Vergleich mit einem Vogel wiedergegeben.
- source_word: יִתְעוֹפֵף
  choice: wird … davonfliegen
  rationale: Das Verb beschreibt das Wegfliegen und damit bildhaft das Verschwinden; „davonfliegen“ bewahrt Bewegung und Verlust.
- source_word: כְּבוֹדָם
  choice: ihre Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt die Mehrdeutigkeit von כָּבוֹד zwischen Herrlichkeit, Ehre und Glanz. Der Zusammenhang legt Nachkommenschaft und Fruchtbarkeit nahe, ohne dass der Vers die Metapher ausdrücklich auflöst.
- source_word: מִלֵּדָה
  choice: fort von der Geburt
  rationale: מִן bezeichnet hier den Bereich, aus dem Ephraims Herrlichkeit schwindet. „Fort von“ verbindet die Präpositionalfolge mit „davonfliegen“, ohne eine ausdrückliche Negation in den Text einzutragen.
- source_word: וּמִבֶּטֶן
  choice: vom Mutterleib
  rationale: בֶּטֶן meint in diesem Fortpflanzungszusammenhang den Mutterleib und die Phase des Heranwachsens vor der Geburt.
- source_word: וּמֵהֵרָיוֹן
  choice: von der Empfängnis
  rationale: הֵרָיוֹן kann Empfängnis oder Schwangerschaft bezeichnen. „Empfängnis“ erhält die rückwärts verlaufende Folge von Geburt über Mutterleib bis zum Anfang des Lebens.
theological_decisions:
- issue: Bezug von „ihre Herrlichkeit“
  choice: Die Metapher bleibt im Haupttext offen; der Zusammenhang weist besonders auf Nachkommenschaft, Fruchtbarkeit und die daraus erwachsende Lebenskraft Ephraims.
  alternative: Die Metapher ausdrücklich als Kinder, Fruchtbarkeit, Wohlstand oder nationale Ehre auflösen.
  rationale: Der hebräische Vers nennt den Bezug nicht ausdrücklich. Die offene Wiedergabe bewahrt das Bild und vermeidet eine übermäßige Festlegung.
- issue: Bedeutung der drei Präpositionalgruppen
  choice: Die drei Wendungen bleiben in ihrer hebräischen Reihenfolge Geburt – Mutterleib – Empfängnis erhalten und bezeichnen den Verlust in allen Stadien.
  alternative: Die Stadien chronologisch als Empfängnis – Schwangerschaft – Geburt ordnen oder paraphrasierend eine dreifache Kinderlosigkeit formulieren.
  rationale: Die rückläufige Reihenfolge ist rhetorisch bedeutsam und sollte nicht eingeebnet werden; zugleich erklärt die Fußnote ihre Funktion.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich markiert die hervorgehobene Anrede „Ephraim“, der Doppelpunkt führt die ungewöhnliche dreifache Herkunfts- beziehungsweise Verlustformel ein. „Fort von“ ist bewusst bildhaft gewählt, damit die hebräischen מִן-Gruppen an „davonfliegen“ anschließen, ohne die Aussage durch eine ergänzte Negation zu erklären.
