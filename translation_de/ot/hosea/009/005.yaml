  text: מַֽה תַּעֲשׂ֖וּ לְ/י֣וֹם מוֹעֵ֑ד וּ/לְ/י֖וֹם חַג יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/005.yaml
  text: What will you do on the day of appointed assembly[a], and on the day of the feast of Yahweh?
translation:
  language: de
  text: Was werdet ihr am Tag der Festversammlung[a] tun und am Tag des Festes Jahwes?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Tag der festgesetzten Zeit« oder »am Tag des Festes«. Das hebräische Wort מוֹעֵד kann allgemein eine festgesetzte Zeit oder insbesondere eine heilige Zusammenkunft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Was
  rationale: Das Fragepronomen leitet eine rhetorische Frage ein; »Was« gibt den unmittelbaren Sinn im Deutschen natürlich wieder.
- source_word: תַּעֲשׂוּ
  choice: werdet ihr tun
  rationale: Das Qal-Imperfekt, 2. Person Plural, blickt hier auf die künftige Lage des Volkes; das deutsche Futur bewahrt diesen Bezug.
- source_word: לְיוֹם
  choice: am Tag der
  rationale: Die Präposition לְ wird hier temporal gebraucht. »Am Tag der« ist im Deutschen idiomatisch.
- source_word: מוֹעֵד
  choice: Festversammlung
  rationale: Das Wort kann eine festgesetzte Zeit, eine heilige Zusammenkunft oder ein Fest bezeichnen. Im Parallelismus mit חַג liegt eine kultische Gelegenheit nahe; »Festversammlung« wahrt zugleich die Unterscheidung der beiden Begriffe.
- source_word: וּלְיוֹם
  choice: und am Tag des
  rationale: Die wiederholte temporale Wendung bildet den hebräischen Parallelismus im natürlichen Deutschen ab.
- source_word: חַג
  choice: Fest
  rationale: חַג bezeichnet ein Fest, häufig ein Wallfahrtsfest. »Fest« ist knapp, verständlich und lässt die speziellere kultische Einordnung offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen gebräuchlichen Form »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen. »Jahwe« bewahrt ihn und entspricht der geläufigen deutschen Umschrift.
- issue: Verhältnis von מוֹעֵד und חַג
  choice: die Begriffe als »Festversammlung« und »Fest« unterscheiden
  alternative: beide mit allgemeiner Festsprache wiedergeben
  rationale: Die verwandten, aber nicht identischen kultischen Begriffe sollen im Parallelismus nicht eingeebnet werden. Die Fußnote wahrt zugleich den Bedeutungsumfang von מוֹעֵד.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der parallele Satzbau des Hebräischen bleiben erhalten; kultische Fachsprache wird verständlich, aber nicht konfessionell eingeengt wiedergegeben.
