  text: אַל תִּשְׂמַ֨ח יִשְׂרָאֵ֤ל אֶל גִּיל֙ כָּֽ/עַמִּ֔ים כִּ֥י זָנִ֖יתָ מֵ/עַ֣ל אֱלֹהֶ֑י/ךָ אָהַ֣בְתָּ אֶתְנָ֔ן עַ֖ל כָּל גָּרְנ֥וֹת דָּגָֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/001.yaml
  text: Do not rejoice[a], Israel, with exultation like the peoples, for you have played the prostitute away from your God[b]; you have loved a prostitute’s payment on every threshing floor of grain.
translation:
  language: de
  text: Freue dich nicht, Israel, und juble nicht wie die Völker![a] Denn du hast dich von deinem Gott abgewandt und dich prostituiert; du hast den Lohn einer Prostituierten auf jedem Dreschplatz für Getreide geliebt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Freue dich nicht, Israel, bis hin zum Jubel wie die Völker.“ Die hebräische Wendung ist knapp und lässt sich im Deutschen unterschiedlich gliedern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׂמַח
  choice: Freue dich nicht
  rationale: אַל mit dem Imperfekt formuliert ein Verbot. „Sich freuen“ gibt שׂמח in einem natürlichen, zugleich würdigen Deutsch wieder.
- source_word: אֶל גִּיל כָּעַמִּים
  choice: und juble nicht wie die Völker
  rationale: Die hebräische Wendung ist stark verdichtet. Die koordinierte deutsche Formulierung macht den wahrscheinlichen adverbialen Sinn verständlich, ohne die Vergleichsgröße „die Völker“ abzuschwächen; die formnähere Alternative wird in der Fußnote genannt.
- source_word: זָנִיתָ מֵעַל אֱלֹהֶיךָ
  choice: du hast dich von deinem Gott abgewandt und prostituiert
  rationale: זנה bewahrt das bewusst anstößige Prostitutionsbild für Israels Abfall. מֵעַל bezeichnet dabei die Bewegung weg von der Bindung an Gott; die deutsche Koordination ist idiomatischer als „von deinem Gott weg prostituiert“.
- source_word: אֶתְנָן
  choice: Dirnenlohn
  rationale: אֶתְנָן ist die Bezahlung einer Prostituierten. „Dirnenlohn“ ist knapp, verständlich und erhält das konkrete Bild; eine Fußnote erläutert seine metaphorische Funktion.
- source_word: עַל כָּל גָּרְנוֹת דָּגָן
  choice: auf jedem Dreschplatz für Getreide
  rationale: „Dreschplatz“ gibt גֹּרֶן anschaulich und verständlich wieder; „für Getreide“ bildet דגן ausdrücklich ab. Der Singular nach „jedem“ entspricht idiomatischem Deutsch.
theological_decisions:
- issue: Sexuelles Bild für Abfall und Götzendienst
  choice: Das Bild des Sich-Prostituierens bleibt im Haupttext ausdrücklich erhalten.
  alternative: 'Abstrakter: „du bist deinem Gott untreu geworden“.'
  rationale: Hoseas Anklage verbindet den Bruch der Gottesbeziehung gezielt mit sexueller Untreue. Eine abstrakte Wiedergabe würde die Schärfe und theologische Spannung des Bildes mindern.
- issue: Verhältnis von Prostitution und Abwendung von Gott
  choice: „abgewandt und prostituiert“ stellt beide Aspekte in enger Koordination dar.
  alternative: „von deinem Gott weg prostituiert“ oder nur „deinem Gott untreu geworden“.
  rationale: Die gewählte Form wahrt sowohl das konkrete Bild von זנה als auch die durch מֵעַל bezeichnete Abkehr, ohne die im Deutschen schwer verständliche hebräische Konstruktion mechanisch nachzubilden.
translation_notes:
  register: Modernes Standarddeutsch mit würdig-prophetischem Ton. „Prostituiert“ erhält die drastische Metapher, während „Dirnenlohn“ die konkrete antike Vorstellung knapp wiedergibt. „Dreschplatz“ ist anschaulicher als das heute weniger geläufige „Tenne“.
