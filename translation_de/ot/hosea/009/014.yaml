source:
  edition: WLC
  text: תֵּן לָ/הֶ֥ם יְהוָ֖ה מַה תִּתֵּ֑ן תֵּן לָ/הֶם֙ רֶ֣חֶם מַשְׁכִּ֔יל וְ/שָׁדַ֖יִם צֹמְקִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/014.yaml
  text: Give them[a], O Yahweh—what will you give? Give them a miscarrying womb and dry breasts.
translation:
  language: de
  text: Gib ihnen, Jahwe – was wirst du geben? Gib ihnen einen Mutterleib, der Fehlgeburten verursacht[a], und vertrocknete Brüste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Mutterleib, der der Kinder beraubt“. Das hebräische Partizip kann allgemein einen Mutterleib bezeichnen, der den Verlust von Kindern bewirkt; im Zusammenhang kann dies insbesondere Fehlgeburten einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן
  choice: Gib
  rationale: Der Imperativ von נתן ist als unmittelbare, eindringliche Bitte an Gott formuliert; „Gib“ gibt diese Schlichtheit und Kraft natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift des Gottesnamens bewahrt den Eigennamen, statt ihn durch den Titel „HERR“ zu ersetzen.
- source_word: מַה תִּתֵּן
  choice: was wirst du geben?
  rationale: Das Fragewort mit dem Imperfekt bildet hier eine rhetorische Frage und bewahrt das spannungsvolle Innehalten des Sprechers vor der folgenden Bitte.
- source_word: רֶחֶם
  choice: Mutterleib
  rationale: „Mutterleib“ ist im Deutschen eine natürliche, würdevolle Wiedergabe und erhält das konkrete Bild der Fruchtbarkeit.
- source_word: מַשְׁכִּיל
  choice: der Fehlgeburten hervorbringt
  rationale: Das kausative Partizip von שכל bezeichnet einen Mutterleib, der den Verlust von Kindern bewirkt. Die Relativkonstruktion ist im heutigen Deutsch natürlicher und klarer als „fehlgebärend“.
- source_word: שָׁדַיִם
  choice: Brüste
  rationale: Der konkrete Körperbegriff wird beibehalten, damit die Härte des Bildes nicht abgeschwächt wird.
- source_word: צֹמְקִים
  choice: vertrocknete
  rationale: Das Partizip bezeichnet eingeschrumpfte beziehungsweise ausgetrocknete Brüste. „Vertrocknete“ vermittelt hier anschaulich das Ausbleiben nährender Milch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ ist die gebräuchliche deutsche Umschrift und bewahrt den Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bitte um reproduktives Gericht
  choice: Die erschütternde Bitte wird ohne Abschwächung als an Jahwe gerichtete Aufforderung wiedergegeben.
  alternative: Die Aussage als bloße Vorhersage oder als Wunsch des Propheten umdeuten.
  rationale: Die Imperative תֵּן verlangen eine direkte Bitte. Die Übersetzung erhält die theologische Spannung, dass der Sprecher Gott um dieses Gericht bittet, und löst sie nicht erklärend auf.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller, zugleich schonungslos konkreter Bildsprache. Der Gedankenstrich bildet das abrupte, qualvolle Innehalten des hebräischen Satzes nach.
