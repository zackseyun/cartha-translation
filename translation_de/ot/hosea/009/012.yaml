id: HOS.9.12
reference: Hosea 9:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י אִם יְגַדְּלוּ֙ אֶת בְּנֵי/הֶ֔ם וְ/שִׁכַּלְתִּ֖י/ם מֵֽ/אָדָ֑ם כִּֽי גַם א֥וֹי לָ/הֶ֖ם בְּ/שׂוּרִ֥/י מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/012.yaml
  text: Even if they raise their children[a], I will bereave them so that not a man remains; for indeed[b], woe to them when I depart from them.
translation:
  language: de
  text: Selbst wenn sie ihre Kinder[a] großziehen, werde ich sie ihrer Kinder berauben, sodass kein Mensch mehr übrig bleibt. Ja, wehe ihnen, wenn ich mich von ihnen abwende![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Söhne“. Das hebräische Wort kann speziell Söhne, häufig aber auch allgemein Kinder beziehungsweise Nachkommen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wenn ich von ihnen fortgehe“. Gemeint ist Gottes Rückzug beziehungsweise die Abwendung seiner Gunst und Gegenwart im Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Selbst wenn
  rationale: Die Wortverbindung leitet hier eine konzessive Bedingung ein; „selbst wenn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: יְגַדְּלוּ
  choice: großziehen
  rationale: Das Piel von גדל bezeichnet im Zusammenhang mit Kindern deren Aufziehen; „großziehen“ ist präzise und gegenwartssprachlich.
- source_word: בְּנֵיהֶם
  choice: ihre Kinder
  rationale: בנים kann zwar speziell „Söhne“ bedeuten, bezeichnet aber häufig allgemein die Nachkommen; die Mehrdeutigkeit wird in einer Fußnote ausgewiesen.
- source_word: וְשִׁכַּלְתִּים
  choice: werde ich sie ihrer Kinder berauben
  rationale: שׁכל bezeichnet den Verlust besonders von Kindern. Die Formulierung bewahrt die tragische und aktive Kraft des angekündigten Gerichts.
- source_word: מֵאָדָם
  choice: sodass kein Mensch mehr übrig bleibt
  rationale: Die schwierige Wendung wird im Kontext als Steigerung der Kinderlosigkeit bis zum Fehlen jedes menschlichen Überlebenden verstanden; die deutsche Formulierung ist verständlich, ohne die Aussage abzuschwächen.
- source_word: כִּי גַם
  choice: Ja
  rationale: Die Verbindung verstärkt hier den folgenden Wehruf. Das emphatische „Ja“ vermeidet im Deutschen eine schwerfällige kausale Verknüpfung.
- source_word: אוֹי לָהֶם
  choice: wehe ihnen
  rationale: Dies ist die geläufige, würdevolle Wiedergabe der prophetischen Klage- und Gerichtsformel.
- source_word: בְּשׂוּרִי מֵהֶם
  choice: wenn ich mich von ihnen abwende
  rationale: Die Konstruktion bezeichnet den Zeitpunkt beziehungsweise Umstand von Gottes Weggehen oder Abwendung. „Sich abwenden“ ist natürliches Deutsch und lässt den Entzug von Nähe und Gunst anklingen.
theological_decisions:
- issue: Bedeutung des göttlichen Rückzugs im Schlusssatz
  choice: Gott wendet sich im Gericht von dem Volk ab.
  alternative: Gott geht von ihnen fort.
  rationale: Das Suffix der ersten Person in בְּשׂוּרִי spricht dafür, dass Gott selbst das Subjekt des Weggehens beziehungsweise der Abwendung ist. Die Übersetzung wahrt die Spannung des angekündigten Entzugs seiner Gegenwart, ohne diesen dogmatisch auszudeuten.
- issue: Reichweite von בְּנֵיהֶם
  choice: Kinder als allgemeine Bezeichnung der Nachkommen
  alternative: Söhne als geschlechtsspezifische Wiedergabe
  rationale: Der hebräische Ausdruck kann beide Bedeutungen tragen. Im Kontext ist die allgemeinere Wiedergabe wahrscheinlich, doch die engere lexikalische Möglichkeit wird in der Fußnote erhalten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Ton. Die Satzführung bleibt klar und mündlich verständlich; traditionelle Formelsprache wird nur dort bewahrt, wo sie im Deutschen weiterhin geläufig ist („wehe ihnen“).
