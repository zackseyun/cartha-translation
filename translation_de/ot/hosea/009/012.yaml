  source_fidelity: Die Übersetzung gibt die konzessive Eröffnung, das Aufziehen der Kinder, die Ankündigung des Beraubens und die schwer zu fassende Steigerung mit מֵאָדָם sachgerecht wieder. „sodass kein Mensch mehr übrig bleibt“ ist eine verständliche kontextuelle Wiedergabe, ohne eine unvertretbar enge Deutung festzuschreiben. Der Schlusssatz wahrt zutreffend Gott als Subjekt seines Rückzugs; „sich von ihnen abwenden“ ist eine idiomatische, im Kontext gedeckte Auslegung von בְּשׂוּרִי מֵהֶם.
  naturalness: Modernes, klares Standarddeutsch mit angemessen ernstem prophetischem Ton. „Selbst wenn“, „großziehen“, „wehe ihnen“ und die Satzgliederung sind natürlich und gut lesbar. Das emphatische „Ja“ vor dem Wehruf funktioniert im Deutschen.
  terminology: „Kinder“ ist als allgemeine Wiedergabe von בָּנִים gut vertretbar; die mögliche engere Bedeutung „Söhne“ ist korrekt in der Fußnote vermerkt. Die Fußnote zum göttlichen Rückzug stellt die alternative, nähere Wiedergabe „fortgehe“ bereit und erläutert den Kontext ohne konfessionelle Überbestimmung.
