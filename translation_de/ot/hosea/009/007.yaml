id: HOS.9.7
reference: Hosea 9:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּ֣אוּ יְמֵ֣י הַ/פְּקֻדָּ֗ה בָּ֚אוּ יְמֵ֣י הַ/שִׁלֻּ֔ם יֵדְע֖וּ יִשְׂרָאֵ֑ל אֱוִ֣יל הַ/נָּבִ֗יא מְשֻׁגָּע֙ אִ֣ישׁ הָ/ר֔וּחַ עַ֚ל רֹ֣ב עֲוֺנְ/ךָ֔ וְ/רַבָּ֖ה מַשְׂטֵמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/007.yaml
  text: The days of punishment have come[a]; the days of repayment have come; Israel will know it. The prophet is a fool; the man of the spirit is mad[c][b], because of the greatness of your iniquity and your great hostility.
translation:
  language: de
  text: Die Tage der Heimsuchung sind gekommen; die Tage der Vergeltung sind gekommen. Israel wird es erkennen. Der Prophet ist ein Narr, der Mann des Geistes ist wahnsinnig[a] – wegen deiner großen Schuld und deiner großen Feindseligkeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Prophet ist töricht, der inspirierte Mann ist wahnsinnig.“ Manche verstehen diese Worte als spöttische Äußerung des Volkes über den wahren Propheten. Im Hebräischen sind sie jedoch nicht ausdrücklich als Zitat gekennzeichnet.'
    reason: lexikalische und syntaktische Alternativdeutung
  - marker: b
    text: Der letzte Ausdruck kann auch mit „wegen der Fülle deiner Schuld und der großen Feindschaft“ wiedergegeben werden. Auf wen oder was sich die Feindschaft richtet, bleibt unausgesprochen.
    reason: lexikalische und referenzielle Mehrdeutigkeit
lexical_decisions:
- source_word: פְּקֻדָּה
  choice: Heimsuchung
  rationale: Das Substantiv bezeichnet hier im prophetischen Gerichtskontext Gottes strafendes Eingreifen beziehungsweise die Zeit der Rechenschaft. „Heimsuchung“ bewahrt sowohl den gerichtlichen als auch den ereignishaften Charakter.
- source_word: שִׁלֻּם
  choice: Vergeltung
  rationale: Der Ausdruck bezeichnet Rückerstattung oder Vergeltung. „Vergeltung“ bildet eine natürliche Parallele zu „Heimsuchung“ und gibt den Gedanken entsprechender Folgen wieder.
- source_word: יֵדְעוּ יִשְׂרָאֵל
  choice: Israel wird es erkennen
  rationale: 'Das Imperfekt wird prädiktiv verstanden: Israel wird beim Eintreffen des Gerichts dessen Wirklichkeit erkennen. Das ergänzte „es“ ist im Deutschen idiomatisch.'
- source_word: אֱוִיל
  choice: ein Narr
  rationale: Die prädikative Nominalform erhält den scharfen, abwertenden Ton des Hebräischen und klingt zugleich würdig und verständlich.
- source_word: מְשֻׁגָּע
  choice: wahnsinnig
  rationale: Das Wort bezeichnet einen als verrückt oder außer sich geltenden Menschen. „Wahnsinnig“ gibt die Schärfe wieder, ohne umgangssprachlich zu wirken.
- source_word: אִישׁ הָרוּחַ
  choice: der Mann des Geistes
  rationale: Die formnahe Wiedergabe bewahrt die Mehrdeutigkeit zwischen einem geistbegabten Menschen und jemandem, der Inspiration beansprucht. Die Kleinschreibung von „Geist“ vermeidet eine nicht ausdrücklich geforderte Festlegung auf den Heiligen Geist.
- source_word: עַל רֹב עֲוֺנְךָ
  choice: wegen deiner großen Schuld
  rationale: עַל führt den Grund ein; רֹב bezeichnet Größe oder Fülle. „Schuld“ bewahrt sowohl die moralische Verfehlung als auch die daraus erwachsende Verantwortlichkeit.
- source_word: וְרַבָּה מַשְׂטֵמָה
  choice: und deiner großen Feindseligkeit
  rationale: מַשְׂטֵמָה bezeichnet Feindschaft, Hass oder Anfeindung. Die deutsche Formulierung folgt der naheliegenden elliptischen Zuordnung zur angesprochenen Person, während die Fußnote die grammatische und sachliche Offenheit festhält.
theological_decisions:
- issue: Bezug der Aussage „Der Prophet ist ein Narr, der Mann des Geistes ist wahnsinnig“
  choice: Unmarkierte Aussage über prophetische beziehungsweise inspirierte Gestalten, die im Gericht entlarvt werden
  alternative: Spöttisches Zitat des Volkes über den wahren Propheten oder ausschließliche Bezeichnung falscher Propheten
  rationale: Der hebräische Text enthält kein ausdrückliches Zitatzeichen und lässt den Sprecherbezug offen. Daher stehen im Haupttext keine Anführungszeichen; die alternative Deutung wird in einer Fußnote bewahrt.
- issue: Bedeutung von „Geist“ in אִישׁ הָרוּחַ
  choice: Formnahe, theologisch nicht festgelegte Wiedergabe mit kleingeschriebenem „Geist“
  alternative: „der vom Geist inspirierte Mann“ mit ausdrücklichem Bezug auf Gottes Geist
  rationale: Der Kontext und die Parallelität zu „Prophet“ können Inspiration oder einen Anspruch darauf bezeichnen, nennen aber nicht ausdrücklich den Heiligen Geist. Eine dogmatische Präzisierung wäre daher unbegründet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Satzfolge und die scharfen Prädikate bleiben erhalten. Archaisierend wirkt lediglich das im biblisch-prophetischen Sprachgebrauch weiterhin verständliche „Heimsuchung“, das die Bedeutungsbreite von strafendem Eingreifen und Rechenschaft besser wahrt als das engere „Bestrafung“.
