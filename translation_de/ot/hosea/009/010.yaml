  text: כַּ/עֲנָבִ֣ים בַּ/מִּדְבָּ֗ר מָצָ֨אתִי֙ יִשְׂרָאֵ֔ל כְּ/בִכּוּרָ֤ה בִ/תְאֵנָה֙ בְּ/רֵ֣אשִׁיתָ֔/הּ רָאִ֖יתִי אֲבֽוֹתֵי/כֶ֑ם הֵ֜מָּה בָּ֣אוּ בַֽעַל פְּע֗וֹר וַ/יִּנָּֽזְרוּ֙ לַ/בֹּ֔שֶׁת וַ/יִּהְי֥וּ שִׁקּוּצִ֖ים כְּ/אָהֳבָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/010.yaml
  text: Like grapes in the wilderness I found Israel[a]; like the first-ripe fruit on the fig tree in its first season I saw your fathers. They came to Baal-peor and consecrated themselves to shame[d][c][b], and they became detestable like the thing they loved.
translation:
  language: de
  text: Wie Trauben in der Wüste fand ich Israel; wie die erste reife Feige am Feigenbaum zu Beginn seiner Fruchtzeit[a] sah ich eure Väter.[b] Sie kamen zum Baal-Peor[c] und weihten sich der Schande;[d] sie wurden abscheulich wie das, was sie liebten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an seinem Anfang“. Gemeint ist die früheste, besonders geschätzte Feige der Fruchtzeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eure Vorfahren“. Hebräisch: „eure Väter“.'
    reason: lexical_alternative
  - marker: c
    text: Vergleiche 4. Mose 25,1–5, wo Israel sich dem Baal-Peor anschloss.
    reason: cross_reference
  - marker: d
    text: „Schande“ bezeichnet hier wahrscheinlich in verächtlicher Weise den mit Baal-Peor verbundenen Götzen.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּעֲנָבִים בַּמִּדְבָּר
  choice: Wie Trauben in der Wüste
  rationale: Die Vergleichspartikel כְּ wird mit „wie“ wiedergegeben. „Wüste“ bezeichnet hier einen unfruchtbaren, menschenarmen Raum und bewahrt das Bild eines überraschenden, erfreulichen Fundes.
- source_word: מָצָאתִי יִשְׂרָאֵל
  choice: fand ich Israel
  rationale: Die einfache und anschauliche Wiedergabe entspricht dem Qal Perfekt von מצא und erhält Israel als Kollektivbezeichnung.
- source_word: כְּבִכּוּרָה בִתְאֵנָה בְּרֵאשִׁיתָהּ
  choice: wie die erste reife Feige am Feigenbaum zu Beginn seiner Fruchtzeit
  rationale: בִּכּוּרָה bezeichnet die besonders geschätzte frühe beziehungsweise zuerst reife Frucht. „Zu Beginn seiner Fruchtzeit“ verdeutlicht den zeitlichen Bezug von בְּרֵאשִׁיתָהּ, ohne die Bildsprache aufzugeben.
- source_word: רָאִיתִי אֲבוֹתֵיכֶם
  choice: sah ich eure Väter
  rationale: „Sah ich“ wahrt die Parallele zu „fand ich“. „Eure Väter“ bildet den ausdrücklich maskulinen Plural ab; gemeint sind die Vorfahren der Angesprochenen.
- source_word: הֵמָּה בָּאוּ בַעַל פְּעוֹר
  choice: Sie kamen zum Baal-Peor
  rationale: Das selbstständige Pronomen hebt die zuvor genannten Väter hervor. Ein ausdrückliches „aber“ wird nicht ergänzt, da im Hebräischen keine adversative Konjunktion steht. Der Kultname bleibt transliteriert.
- source_word: וַיִּנָּזְרוּ לַבֹּשֶׁת
  choice: und weihten sich der Schande
  rationale: Der Niphal von נזר kann die religiös gefärbte Selbstabsonderung beziehungsweise Hingabe bezeichnen. „Weihten sich“ bewahrt die polemische Ironie; „Schande“ lässt offen, ob die Eigenschaft oder verächtlich das Götzenbild gemeint ist.
- source_word: וַיִּהְיוּ שִׁקּוּצִים
  choice: sie wurden abscheulich
  rationale: Da Menschen das Subjekt sind, gibt das prädikative Adjektiv den Sinn des substantivischen Plurals שִׁקּוּצִים in natürlichem Deutsch wieder und erhält die starke kultisch-moralische Abwertung.
- source_word: כְּאָהֳבָם
  choice: wie das, was sie liebten
  rationale: Die knappe hebräische Formulierung kann auf den Gegenstand ihrer Liebe beziehungsweise Verehrung zielen. Die Wiedergabe erhält den Vergleich, ohne den unausgesprochenen Gegenstand ausdrücklich als Götzen zu bestimmen.
theological_decisions:
- issue: Bedeutung von לַבֹּשֶׁת im Zusammenhang des Götzendienstes
  choice: der Schande
  alternative: dem Schandbild; der Schändlichkeit
  rationale: Das Hebräische verwendet den polemischen Ausdruck „Schande“, der wahrscheinlich verächtlich auf den verehrten Götzen verweist. Die Haupttextfassung wahrt sowohl diese Anspielung als auch die wörtliche moralische Bedeutung.
- issue: Wiedergabe von אֲבוֹתֵיכֶם
  choice: eure Väter
  alternative: eure Vorfahren
  rationale: Die Form ist ausdrücklich maskulin und entspricht „eure Väter“. Eine Fußnote erklärt die im Kontext gemeinte Funktion als Bezeichnung der Vorfahren.
- issue: Verhältnis des positiven Anfangs zum Abfall am Baal-Peor
  choice: Kein ausdrückliches adversatives Bindewort
  alternative: Doch sie kamen zum Baal-Peor
  rationale: Der inhaltliche Gegensatz ist deutlich, wird im Hebräischen an dieser Stelle aber nicht durch eine adversative Konjunktion markiert. Die Übersetzung vermeidet daher eine stillschweigende Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Bildsprache. Der Parallelismus des Versanfangs bleibt erhalten; kultische Ironie und Mehrdeutigkeit werden nicht konfessionell aufgelöst.
