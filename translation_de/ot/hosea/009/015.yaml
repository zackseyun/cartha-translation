reference: Hosea 9:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל רָעָתָ֤/ם בַּ/גִּלְגָּל֙ כִּֽי שָׁ֣ם שְׂנֵאתִ֔י/ם עַ֚ל רֹ֣עַ מַֽעַלְלֵי/הֶ֔ם מִ/בֵּיתִ֖/י אֲגָרְשֵׁ֑/ם לֹ֤א אוֹסֵף֙ אַהֲבָתָ֔/ם כָּל שָׂרֵי/הֶ֖ם סֹרְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/015.yaml
  text: All their evil is at Gilgal[a]; indeed, there I hated them because of the evil of their deeds. I will drive them out of my house; I will no longer love them[c][b]. All their princes are rebels.
translation:
  language: de
  text: Ihre ganze Bosheit ist in Gilgal[a]; ja, dort hasste ich sie wegen der Bosheit ihrer Taten. Aus meinem Haus[b] werde ich sie vertreiben; ich werde sie nicht länger lieben. Alle ihre Fürsten sind rebellisch.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn dort hasste ich sie.“ Die hebräische Konjunktion kann begründend („denn/weil“) oder bekräftigend („ja“) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: „Mein Haus“ kann hier genauer das Land des HERRN, sein Heiligtum oder seine Bundesgemeinschaft bezeichnen; das Hebräische lässt das Bild knapp und mehrdeutig.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Alle ihre Fürsten sind widerspenstig.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רָעָתָם
  choice: All ihre Bosheit
  rationale: כָּל mit dem abstrakten Singular רָעָה bezeichnet hier zusammenfassend die Gesamtheit ihrer Bosheit. Die Formulierung ist knapp, natürlich und bewahrt den moralischen Nachdruck.
- source_word: בַּגִּלְגָּל
  choice: in Gilgal
  rationale: Die Präposition בְּ ist lokativ. Bei einem Ortsnamen ist „in Gilgal“ im Deutschen die natürliche Wiedergabe.
- source_word: כִּי שָׁם
  choice: ja, dort
  rationale: כִּי kann kausal oder bekräftigend verstanden werden. „Ja, dort“ gibt die mögliche emphatische Funktion wieder; die kausale Alternative wird in der Fußnote bewahrt.
- source_word: שְׂנֵאתִים
  choice: hasste ich sie
  rationale: Das Verb שׂנא bezeichnet unverhüllt Hass beziehungsweise entschiedene Ablehnung. Die direkte Aussage wird nicht abgeschwächt.
- source_word: עַל רֹעַ מַעַלְלֵיהֶם
  choice: wegen der Bosheit ihrer Taten
  rationale: עַל bezeichnet hier den Grund; רֹעַ benennt die Bosheit und מַעַלְלִים die Taten oder Handlungen. Die deutsche Formulierung erhält Struktur und moralisches Gewicht.
- source_word: מִבֵּיתִי אֲגָרְשֵׁם
  choice: Aus meinem Haus werde ich sie vertreiben
  rationale: גָּרַשׁ mit מִן drückt die gewaltsame Entfernung aus einem Bereich aus. Die Voranstellung von „Aus meinem Haus“ folgt dem hebräischen Nachdruck und bewahrt das Bild.
- source_word: לֹא אוֹסֵף אַהֲבָתָם
  choice: ich werde sie nicht länger lieben
  rationale: אָסַף hat in dieser Verbindung den idiomatischen Sinn „weiterhin/noch einmal tun“. Gemeint ist das Ende des Liebens; „nicht länger“ ist dafür klares modernes Deutsch.
- source_word: כָּל שָׂרֵיהֶם
  choice: Alle ihre Fürsten
  rationale: שָׂרִים bezeichnet führende politische Amtsträger. „Fürsten“ wahrt den gehobenen prophetischen Ton, ohne zwingend Königssöhne zu meinen.
- source_word: סֹרְרִים
  choice: sind Aufrührer
  rationale: Das Partizip von סרר beschreibt hartnäckige, dauerhafte Auflehnung. „Aufrührer“ gibt die substantivische Prädikation und die Schärfe des Ausdrucks wieder.
theological_decisions:
- issue: Göttliche Hassrede
  choice: „dort hasste ich sie“ unverändert direkt wiedergeben
  alternative: „dort verwarf ich sie“ oder „dort wandte ich mich gegen sie“
  rationale: שׂנא ist eine starke Aussage von Hass beziehungsweise Ablehnung. Eine abschwächende Umschreibung würde die Spannung der Gerichtsaussage eigenmächtig auflösen.
- issue: Bedeutung von „mein Haus“
  choice: Das Bild „mein Haus“ im Haupttext bewahren
  alternative: „mein Land“, „mein Heiligtum“ oder „meine Hausgemeinschaft“
  rationale: Der kompakte hebräische Ausdruck kann auf Gottes Land, Heiligtum oder Bundeshaushalt zielen. Da der genaue Bezug offenbleibt, wird er nicht im Haupttext festgelegt.
- issue: Funktion von כִּי
  choice: Bekräftigend als „ja“ im Haupttext
  alternative: Kausal als „denn“ oder „weil“
  rationale: Der Zusammenhang erlaubt sowohl eine begründende als auch eine emphatische Lesart. Die Hauptfassung hebt den Ort rhetorisch hervor; die echte Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Schärfe. Die direkte Rede vom göttlichen Hass und das mehrdeutige Bild „mein Haus“ werden nicht geglättet. Die Satzstellung setzt wie im Hebräischen „Aus meinem Haus“ hervor.
