revisions:
- from: All ihre Bosheit ist in Gilgal[a]; ja, dort hasste ich sie wegen der Bosheit ihrer Taten. Aus meinem Haus[b] werde ich sie vertreiben; ich werde sie nicht länger lieben. Alle ihre Fürsten sind Aufrührer.[c]
  to: Ihre ganze Bosheit ist in Gilgal[a]; ja, dort hasste ich sie wegen der Bosheit ihrer Taten. Aus meinem Haus[b] werde ich sie vertreiben; ich werde sie nicht länger lieben. Alle ihre Fürsten sind rebellisch.[c]
  rationale: Die Revision beschränkt sich auf zwei sichere sprachliche und semantische Verbesserungen. „Ihre ganze Bosheit“ ist natürlicher, während „rebel­lisch“ die Bedeutung von סֹרְרִים ohne die zusätzliche, im Hebräischen nicht festgelegte Vorstellung eines politischen Aufruhrs wiedergibt. Die Ambiguität von כִּי und die Metapher „mein Haus“ bleiben samt den vorhandenen Fußnoten erhalten.
