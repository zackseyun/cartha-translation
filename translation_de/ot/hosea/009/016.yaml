  text: הֻכָּ֣ה אֶפְרַ֔יִם שָׁרְשָׁ֥/ם יָבֵ֖שׁ פְּרִ֣י בלי יַעֲשׂ֑וּ/ן גַּ֚ם כִּ֣י יֵֽלֵד֔וּ/ן וְ/הֵמַתִּ֖י מַחֲמַדֵּ֥י בִטְנָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/016.yaml
  text: Ephraim is stricken[a]; their root is dried up; they will bear no fruit. Even if they give birth[b], I will put to death the cherished ones of their womb.
translation:
  language: de
  text: Efraim ist geschlagen; ihre Wurzel[a] ist verdorrt; sie werden keine Frucht bringen. Selbst wenn sie Kinder gebären, werde ich die geliebten Kinder aus ihrem Mutterleib[b] töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „seine Wurzel“. Im Hebräischen steht ein Pluralsuffix („ihre Wurzel“), obwohl „Efraim“ ein singularischer Kollektivbegriff ist.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Auch möglich: „die Kostbaren aus ihrem Mutterleib“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻכָּה
  choice: ist geschlagen
  rationale: Das passive Verb bezeichnet den durch einen Gerichtsschlag herbeigeführten Zustand Efraims. „Ist geschlagen“ bewahrt sowohl die göttliche Gerichtssprache als auch die resultative Nuance.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Der Eigenname wird in der im Deutschen üblichen biblischen Form wiedergegeben. Im Zusammenhang steht Efraim als Kollektivbezeichnung für das Nordreich.
- source_word: שָׁרְשָׁם
  choice: ihre Wurzel
  rationale: Der hebräische Suffix ist pluralisch, obwohl „Efraim“ grammatisch als singularischer Kollektivname erscheint. „Ihre“ bildet die Personenmehrheit des Volkes und zugleich die Form des Hebräischen ab.
- source_word: יָבֵשׁ
  choice: ist verdorrt
  rationale: „Verdorrt“ ist im Deutschen für eine abgestorbene Pflanzenwurzel natürlich und bringt den resultativen Zustand prägnant zum Ausdruck.
- source_word: פְּרִי בלי יַעֲשׂוּן
  choice: sie werden keine Frucht bringen
  rationale: Die Formulierung bewahrt zunächst das Pflanzenbild und lässt den folgenden Satz den Übergang zu menschlicher Nachkommenschaft vollziehen.
- source_word: גַּם כִּי
  choice: selbst wenn
  rationale: 'Die konzessive Wendung steigert die Aussage: Auch eine tatsächlich eintretende Geburt würde das angekündigte Gericht nicht abwenden.'
- source_word: יֵלֵדוּן
  choice: sie Kinder gebären
  rationale: „Gebären“ markiert klar den Übergang vom Pflanzenbild zur menschlichen Fortpflanzung. Das ergänzte „Kinder“ ist im Deutschen zur natürlichen und eindeutigen Wiedergabe des intransitiven Gebrauchs sinnvoll.
- source_word: וְהֵמַתִּי
  choice: werde ich … töten
  rationale: Der Hifil von מות mit Sprecher in der ersten Person schreibt den Tod ausdrücklich dem göttlichen Gerichtshandeln zu. „Töten“ gibt dies knapp und ungeschwächt wieder.
- source_word: מַחֲמַדֵּי בִטְנָם
  choice: die geliebten Kinder ihres Mutterleibs
  rationale: מַחֲמַדֵּי bezeichnet hier die kostbaren oder geliebten Menschen, die aus dem Mutterleib hervorgegangen sind. Die Wiedergabe ist in modernem Deutsch verständlich, erhält aber mit „ihres Mutterleibs“ das hebräische Bild.
theological_decisions:
- issue: Göttliche Urheberschaft des angekündigten Todes
  choice: 'Die erste Person bleibt ausdrücklich erhalten: „werde ich … töten“.'
  alternative: Eine unpersönliche Formulierung wie „sie werden sterben“.
  rationale: Das Hebräische verwendet ausdrücklich die erste Person Singular im Hifil und stellt den Tod als Gottes Gerichtshandeln dar. Diese theologische Härte darf nicht abgeschwächt werden.
- issue: Verhältnis von Pflanzenbild und menschlicher Nachkommenschaft
  choice: Zunächst bleibt „Frucht“ als Pflanzenmetapher stehen; erst der Folgesatz spricht ausdrücklich von Kindern.
  alternative: „Frucht“ schon im ersten Satz als „Nachkommen“ wiederzugeben.
  rationale: Der Ausgangstext entfaltet die Spannung vom verdorrten Wurzelstock über ausbleibende Frucht bis zur Geburt und zum Verlust der Kinder. Eine vorzeitige Auflösung würde die Bildentwicklung verflachen.
translation_notes:
  register: Moderne, würdige prophetische Sprache mit knappen Hauptsätzen. Die Härte des Gerichtswortes und die Bildfolge von Wurzel, Frucht, Geburt und Kindern bleiben erhalten; archaische oder konfessionell geprägte Ausdrücke werden vermieden.
