  text: צֹפֶ֥ה אֶפְרַ֖יִם עִם אֱלֹהָ֑/י נָבִ֞יא פַּ֤ח יָקוֹשׁ֙ עַל כָּל דְּרָכָ֔י/ו מַשְׂטֵמָ֖ה בְּ/בֵ֥ית אֱלֹהָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/008.yaml
  text: Ephraim’s watchman is with my God[a]; the prophet is a fowler’s snare on all his ways[b], and hostility is in the house of his God.
translation:
  language: de
  text: Ephraim ist ein Wächter bei meinem Gott[a]; der Prophet ist auf allen seinen Wegen eine Falle eines Vogelfängers, und Feindschaft[b] ist im Haus seines Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Wächter Ephraims ist bei meinem Gott; der Prophet ist auf allen seinen Wegen eine Falle eines Vogelfängers.“ Die hebräische Satzfügung ist schwierig; manche verstehen den ersten Satzteil positiv, bevor die Anklage einsetzt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Feindseligkeit“ beziehungsweise „Hass“. Das hebräische Wort bezeichnet feindselige Gegnerschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹפֶה
  choice: Wächter
  rationale: Das Partizip von צפה bezeichnet jemanden, der Ausschau hält oder Wache hält. „Wächter“ bewahrt die prophetische Wächtermetaphorik und ist im Deutschen klar und würdevoll.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Die geläufige deutsche Form des Stammes- und Volksnamens.
- source_word: עִם אֱלֹהָי
  choice: bei meinem Gott
  rationale: עִם bezeichnet Gemeinschaft oder Nähe. „Bei meinem Gott“ gibt die Präposition natürlich wieder und bewahrt ausdrücklich das Suffix der ersten Person Singular.
- source_word: נָבִיא
  choice: der Prophet
  rationale: Der bestimmte Ausdruck versteht den Singular als den in Ephraims Zusammenhang stehenden prophetischen Repräsentanten. Wegen der schwierigen Syntax wird eine andere Zuordnung in der Fußnote offengehalten.
- source_word: פַּח יָקוֹשׁ
  choice: eine Schlinge des Vogelfängers
  rationale: Die Verbindung zweier Wörter aus dem Bereich des Fangens bezeichnet eine zum Vogelfang gelegte Falle. Die Formulierung erhält das konkrete Bild, ohne es erklärend aufzulösen.
- source_word: עַל כָּל דְּרָכָיו
  choice: auf all seinen Wegen
  rationale: Die Formulierung folgt eng der hebräischen Präpositionalphrase und wahrt die mögliche bildliche Bedeutung von „Wegen“ als Verhalten oder Lebensführung.
- source_word: מַשְׂטֵמָה
  choice: Feindschaft
  rationale: Das Substantiv bezeichnet Hass, Feindseligkeit oder tätige Gegnerschaft. „Feindschaft“ ist prägnant und lässt die genaue Ausprägung offen.
- source_word: בְּבֵית אֱלֹהָיו
  choice: im Haus seines Gottes
  rationale: Die Übersetzung bewahrt sowohl „Haus“ als auch das männliche Suffix der dritten Person Singular und vermeidet die interpretierende Festlegung auf „Tempel“.
theological_decisions:
- issue: Wechsel zwischen „meinem Gott“ und „seinem Gott“
  choice: 'Der Pronomenwechsel wird beibehalten: „bei meinem Gott“ … „im Haus seines Gottes“.'
  alternative: Beide Wendungen perspektivisch angleichen, etwa zu „bei Gott“ und „im Haus Gottes“.
  rationale: Der masoretische Text bietet den auffälligen Perspektivwechsel ausdrücklich. Ihn zu erhalten wahrt die Spannung und vermeidet eine harmonisierende Deutung.
- issue: Zuordnung und Bewertung des Propheten
  choice: „Der Prophet“ wird im unmittelbaren Gerichtszusammenhang als Teil der Anklage verstanden.
  alternative: Den ersten Satz positiv auf Hosea oder Ephraim als Wächter bei Gott beziehen und erst danach zu einer Anklage gegen andere Propheten übergehen.
  rationale: Der Kontext legt eine negative Aussage nahe, doch die knappe hebräische Syntax erlaubt mehr als eine Gliederung. Daher wird die alternative positive Auffassung der ersten Teilaussage in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Stil. Die knappe, spannungsreiche Satzstruktur und der Wechsel der Gottespronomina bleiben erhalten; erklärende Glättungen wurden vermieden.
