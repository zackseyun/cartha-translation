  text: גֹּ֥רֶן וָ/יֶ֖קֶב לֹ֣א יִרְעֵ֑/ם וְ/תִיר֖וֹשׁ יְכַ֥חֶשׁ בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/002.yaml
  text: Threshing floor and winepress will not feed them[a], and new wine will fail her.
translation:
  language: de
  text: Tenne und Kelter werden sie nicht ernähren, und der Neuwein wird sie[a] enttäuschen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier ein weibliches Singularpronomen, wahrscheinlich für Israel beziehungsweise Ephraim als personifizierte Frau; möglich ist auch ein Bezug auf das Land.
    reason: referential_ambiguity
  - marker: b
    text: 'Oder: „im Stich lassen“, „versagen“ oder „sich ihr gegenüber als trügerisch erweisen“. Das hebräische Verb bezeichnet hier, dass etwas die daran geknüpfte Erwartung nicht erfüllt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: Tenne
  rationale: Das Wort bezeichnet den Dreschplatz und steht hier zugleich für den dort gewonnenen Ertrag. „Tenne“ bewahrt das konkrete landwirtschaftliche Bild.
- source_word: יֶקֶב
  choice: Kelter
  rationale: Der Begriff bezeichnet die Anlage zum Pressen der Trauben beziehungsweise den Kelterbereich. „Kelter“ bildet mit „Tenne“ ein natürliches, bildkräftiges Paar.
- source_word: יִרְעֵם
  choice: werden sie nicht ernähren
  rationale: Das Verb רעה bedeutet grundsätzlich „weiden, nähren“. Da Tenne und Kelter die Subjekte sind, gibt „ernähren“ den Gedanken ausbleibender Versorgung idiomatisch wieder.
- source_word: תִירוֹשׁ
  choice: der junge Wein
  rationale: תירוש bezeichnet den frischen beziehungsweise neuen Wein als Erzeugnis der Ernte. „Junger Wein“ ist im Deutschen verständlich und bewahrt den landwirtschaftlichen Bezug.
- source_word: יְכַחֶשׁ
  choice: wird … enttäuschen
  rationale: כחש kann hier ausdrücken, dass etwas die gehegte Erwartung nicht erfüllt, sich als unzuverlässig erweist oder versagt. „Enttäuschen“ bewahrt diesen Sinn, ohne das Bild unnötig zu erklären.
- source_word: בָּהּ
  choice: sie
  rationale: Das hebräische Suffix steht in der dritten Person Femininum Singular. Das deutsche „sie“ kann die personifizierte Gemeinschaft wiedergeben, lässt in der laufenden Form aber die gleiche Form wie beim pluralischen Bezug des ersten Satzteils erkennen; die Fußnote klärt die grammatische Form.
theological_decisions:
- issue: Bezug des femininen Singularsuffixes בָּהּ
  choice: Bezug auf Israel beziehungsweise Ephraim als weiblich personifizierte Gemeinschaft
  alternative: Kollektiver Bezug auf die Menschen („sie“ im Plural) oder Bezug auf das Land
  rationale: Die feminine Singularform wird nicht in einen eindeutigen Plural umgedeutet. Hosea personifiziert das Volk häufig als Frau; der mögliche Bezug wird in der Fußnote erläutert, ohne die weniger wahrscheinliche Deutung auf das Land völlig auszuschließen.
- issue: Bedeutungsbreite von יְכַחֶשׁ
  choice: „enttäuschen“ im Sinn nicht erfüllter Erwartung
  alternative: „versagen“, „im Stich lassen“ oder „sich als trügerisch erweisen“
  rationale: Die Formulierung hält die Spannung zwischen sachlichem Ausbleiben des Ertrags und der personifizierenden Vorstellung von Täuschung beziehungsweise Untreue aufrecht.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper prophetischer Bildhaftigkeit. Die konkreten Agrarbegriffe „Tenne“ und „Kelter“ bleiben erhalten; die ungewöhnliche Personifizierung des jungen Weins wird nicht geglättet.
