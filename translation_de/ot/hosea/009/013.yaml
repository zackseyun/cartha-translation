source:
  edition: WLC
  text: אֶפְרַ֛יִם כַּ/אֲשֶׁר רָאִ֥יתִי לְ/צ֖וֹר שְׁתוּלָ֣ה בְ/נָוֶ֑ה וְ/אֶפְרַ֕יִם לְ/הוֹצִ֥יא אֶל הֹרֵ֖ג בָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/013.yaml
  text: Ephraim[a], as I have seen, is planted in a pleasant pasture like Tyre[c][b]; but Ephraim must bring out his children to the killer.
translation:
  language: de
  text: Ephraim ist, wie ich sah, wie Tyrus auf einer lieblichen Weide gepflanzt[a]; doch Ephraim muss seine Kinder[b] zu dem hinausführen, der tötet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wie ich sah, war Ephraim wie Tyrus an einem lieblichen Ort gepflanzt.“ Die hebräische Vergleichskonstruktion ist stark verkürzt; נָוֶה kann „Weide“, allgemeiner einen angenehmen Ort oder eine Wohnstätte bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „seine Söhne“; gemeint sein können seine Nachkommen insgesamt.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „zu einem Tötenden“; auch „zum Schlächter“ oder sinngemäß „zur Tötung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der Eigenname des Stammes beziehungsweise des Nordreichs wird in seiner gebräuchlichen deutschen Form wiedergegeben.
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: wie ich sah
  rationale: Die erste Person und der rückblickende Charakter der hebräischen Perfektform bleiben ausdrücklich erhalten.
- source_word: לְצוֹר
  choice: wie Tyrus
  rationale: Das Präfix ל wird im Zusammenhang vergleichend verstanden; wegen der gedrängten Syntax wird die mögliche andere Zuordnung in der Fußnote offengehalten.
- source_word: שְׁתוּלָה
  choice: gepflanzt
  rationale: Bewahrt das passive Partizip und das pflanzliche Bild des Ausgangstextes.
- source_word: בְנָוֶה
  choice: auf einer lieblichen Weide
  rationale: נָוֶה kann eine Weide, einen angenehmen Aufenthaltsort oder eine Wohnstätte bezeichnen. „Liebliche Weide“ erhält sowohl den günstigen Ort als auch die ländliche Bildwelt.
- source_word: וְאֶפְרַיִם
  choice: doch Ephraim
  rationale: Das Waw leitet hier einen scharfen Gegensatz zwischen sicherem Gedeihen und kommendem Tod ein.
- source_word: לְהוֹצִיא
  choice: muss … hinausführen
  rationale: Der ל-Infinitiv bezeichnet hier eine bevorstehende beziehungsweise unausweichliche Handlung. „Hinausführen“ bildet den Hifil von יצא genauer ab als nur „bringen“.
- source_word: בָּנָיו
  choice: seine Kinder
  rationale: Wörtlich steht „seine Söhne“; im Kontext kann die Form die Nachkommen insgesamt bezeichnen.
- source_word: אֶל הֹרֵג
  choice: zum Mörder
  rationale: Das aktive Partizip bezeichnet persönlich den Tötenden. „Mörder“ erhält diesen persönlichen Urheber, statt abstrakt „Schlachtung“ zu sagen.
theological_decisions:
- issue: Das Bild von Ephraims früherer günstiger Lage
  choice: Das Bild des Gepflanztseins auf einer lieblichen Weide wird bewahrt.
  alternative: Ephraim habe wie Tyrus „geblüht“ oder sei allgemein wohlhabend gewesen.
  rationale: Die Bildsprache des hebräischen Textes trägt den Gegensatz zum folgenden Verlust der Kinder und sollte nicht in eine deutende Zusammenfassung aufgelöst werden.
- issue: Bedeutungsumfang von בָּנָיו
  choice: Kinder
  alternative: Söhne
  rationale: „Söhne“ ist die formale Entsprechung; „Kinder“ gibt hier wahrscheinlich den kollektiven Sinn „Nachkommen“ wieder. Die wörtliche Möglichkeit wird in der Fußnote genannt.
- issue: Ziel des Hinausführens
  choice: zum Mörder
  alternative: zur Schlachtung
  rationale: Der hebräische Text nennt mit einem aktiven Partizip einen Tötenden. Die persönliche Form wird nicht zu einem abstrakten Geschehen umgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Gegenüberstellung von sicherem Gepflanztsein und dem Hinausführen der Kinder in den Tod bleibt spürbar. Die Satzstellung wurde lesbar gestaltet, ohne die Unsicherheit der gedrängten hebräischen Vergleichskonstruktion zu verdecken.
