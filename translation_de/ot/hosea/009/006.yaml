source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה הָֽלְכוּ֙ מִ/שֹּׁ֔ד מִצְרַ֥יִם תְּקַבְּצֵ֖/ם מֹ֣ף תְּקַבְּרֵ֑/ם מַחְמַ֣ד לְ/כַסְפָּ֗/ם קִמּוֹשׂ֙ יִֽירָשֵׁ֔/ם ח֖וֹחַ בְּ/אָהֳלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/006.yaml
  text: For behold[a], they have gone away from destruction; Egypt will gather them, Memphis will bury them. Nettles will possess the precious things of their silver; thorns will be in their tents.
translation:
  language: de
  text: 'Denn siehe: Sie sind vor der Verwüstung geflohen. Ägypten wird sie sammeln, Memphis wird sie begraben. Brennnesseln[a] werden ihre kostbaren Silberschätze in Besitz nehmen; Dornen werden in ihren Zelten sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unkraut“. Die genaue Art der mit dem seltenen hebräischen Pflanzenwort bezeichneten überwuchernden Pflanze ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשֹּׁד
  choice: vor der Verwüstung
  rationale: שֹׁד bezeichnet gewaltsame Verwüstung oder Zerstörung. Mit הלך und מִן drückt die Wendung hier eine Flucht vor der Verwüstung aus, ohne eine gelungene Rettung zu behaupten.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Die übliche deutsche Form des Ländernamens.
- source_word: תְּקַבְּצֵם
  choice: wird sie sammeln
  rationale: קבץ im Piel bedeutet sammeln oder zusammenbringen. Die personifizierende und möglicherweise ironische Bildsprache des Hebräischen bleibt erhalten.
- source_word: מֹף
  choice: Memphis
  rationale: מֹף bezeichnet die ägyptische Stadt Memphis; die gebräuchliche Namensform ist für heutige Leser verständlich.
- source_word: תְּקַבְּרֵם
  choice: wird sie begraben
  rationale: קבר bedeutet eindeutig begraben. Der Parallelismus führt vom Sammeln der Flüchtlinge zum Tod in der Fremde.
- source_word: מַחְמַד לְכַסְפָּם
  choice: ihre kostbaren Silberschätze
  rationale: מַחְמַד bezeichnet etwas Begehrenswertes oder Kostbares; die Verbindung mit כֶּסֶף verweist hier auf wertvollen Silberbesitz. Die Formulierung ist knapp und natürlich.
- source_word: קִמּוֹשׂ
  choice: Brennnesseln
  rationale: Das seltene Pflanzenwort bezeichnet schädlichen Wildwuchs in verlassenen Stätten. „Brennnesseln“ folgt einer verbreiteten, aber botanisch nicht völlig sicheren Bestimmung; die Unsicherheit wird in der Fußnote kenntlich gemacht.
- source_word: יִירָשֵׁם
  choice: werden … in Besitz nehmen
  rationale: ירשׁ kann erben, besitzen oder verdrängend in Besitz nehmen bedeuten. Hier übernehmen Brennnesseln bildhaft den verlassenen Besitz; die Wendung bewahrt diese ironische Umkehrung.
- source_word: חוֹחַ
  choice: Dornen
  rationale: חוֹחַ bezeichnet allgemein dornigen Bewuchs; „Dornen“ ist die klare und bildnahe deutsche Entsprechung.
- source_word: בְּאָהֳלֵיהֶם
  choice: in ihren Zelten
  rationale: אֹהֶל bedeutet wörtlich Zelt. Die konkrete Bildsprache verlassener Behausungen und der poetische Parallelismus bleiben erhalten.
theological_decisions:
- issue: Deutung von הָלְכוּ מִשֹּׁד
  choice: Sie sind vor der Verwüstung geflohen.
  alternative: Sie sind wegen der Verwüstung fortgezogen; sie sind der Verwüstung entkommen.
  rationale: Der Zusammenhang handelt von Gericht, Fremde und Tod. Die Wendung beschreibt daher am ehesten eine Flucht vor der Verwüstung, nicht eine erfolgreiche Rettung aus dem Gericht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Bildsprache. „Denn sieh“ gibt die aufmerksamkeitslenkende Partikel wieder; der bewusst schroffe Nominalsatz am Ende („Dornen werden … sein“) hält sich eng an das Hebräische und vermeidet die Ergänzung eines nicht ausdrücklich vorhandenen Verbs wie „wachsen“.
