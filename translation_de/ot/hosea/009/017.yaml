source:
  edition: WLC
  text: יִמְאָסֵ֣/ם אֱלֹהַ֔/י כִּ֛י לֹ֥א שָׁמְע֖וּ ל֑/וֹ וְ/יִהְי֥וּ נֹדְדִ֖ים בַּ/גּוֹיִֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/017.yaml
  text: My God will reject them because they have not listened to him[a], and they will be wanderers among the nations.
translation:
  language: de
  text: Mein Gott wird sie verwerfen, weil sie nicht auf ihn gehört haben[a], und sie werden als Heimatlose unter den Völkern umherirren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil sie ihm nicht gehorcht haben“. Der hebräische Ausdruck spricht wörtlich davon, nicht auf ihn zu hören; im Zusammenhang ist Gehorsam mitgemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְאָסֵם
  choice: wird sie verwerfen
  rationale: מָאַס bezeichnet Ablehnung oder Zurückweisung. „Verwerfen“ bewahrt hier die gewichtige gerichtliche und bundesbezogene Aussage, ohne bloße emotionale Verachtung auszudrücken.
- source_word: אֱלֹהַי
  choice: Mein Gott
  rationale: Das Suffix der ersten Person Singular ist ausdrücklich zu erhalten und bewahrt Hoseas persönliche prophetische Stimme.
- source_word: כִּי
  choice: weil
  rationale: כִּי leitet hier den Grund für Gottes Verwerfung ein; „weil“ ist im modernen Deutsch die natürliche kausale Entsprechung.
- source_word: לֹא שָׁמְעוּ לוֹ
  choice: sie nicht auf ihn gehört haben
  rationale: שׁמע mit ל kann sowohl das Hören als auch den darin liegenden Gehorsam bezeichnen. „Auf ihn gehört“ erhält das Hörmotiv und lässt zugleich die gemeinte Missachtung erkennen.
- source_word: וְיִהְיוּ
  choice: sie werden zu
  rationale: היה kann sowohl „sein“ als auch „werden“ bedeuten. Mit „werden zu“ wird der Übergang in den folgenden Zustand als Folge des Gerichts natürlich ausgedrückt.
- source_word: נֹדְדִים
  choice: Heimatlosen
  rationale: Das Partizip von נדד bezeichnet Menschen, die unstet umherziehen und keinen festen Ort haben. „Heimatlose“ gibt im Exilskontext diesen Zustand würdig und idiomatisch wieder, ohne sie enger als „Flüchtlinge“ zu bestimmen.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם meint hier die fremden Völker, unter die Israel zerstreut wird. „Unter den Völkern“ ist idiomatisch und vermeidet die neutestamentlich geprägte Wiedergabe „Heiden“.
theological_decisions:
- issue: Prophetischer Ausdruck „Mein Gott“
  choice: Die erste Person wird als „Mein Gott“ beibehalten.
  alternative: Nur „Gott“ schreiben.
  rationale: Der hebräische Possessivsuffix gehört zur Aussage und bewahrt die persönliche sowie bundesbezogene Dimension von Hoseas prophetischem Wort.
- issue: Bedeutung von שׁמע
  choice: Im Haupttext steht „auf ihn gehört“.
  alternative: „ihm gehorcht“
  rationale: Der Ausdruck schließt Gehorsam ein, spricht aber wörtlich vom Hören. Die gewählte Form bewahrt beides, ohne die im Hebräischen vorhandene Bildlichkeit aufzulösen.
- issue: Zustand oder Übergang bei וְיִהְיוּ
  choice: „sie werden zu Heimatlosen“
  alternative: „sie werden Heimatlose sein“
  rationale: Beides ist grammatisch möglich. Die gewählte Fassung macht den durch Gottes Verwerfung eintretenden Exilszustand deutlich, ohne zusätzliche Ursache oder Dauer einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und prophetisch. „Heimatlose“ vermittelt die Exilsfolge natürlicher als das im Deutschen leicht ziellos oder freiwillig klingende „Wanderer“; die Ambiguität von Hören und Gehorchen wird im Haupttext und in der Fußnote bewahrt.
