  text: לֹא יִסְּכ֨וּ לַ/יהוָ֥ה יַיִן֮ וְ/לֹ֣א יֶֽעֶרְבוּ ל/וֹ֒ זִבְחֵי/הֶ֗ם כְּ/לֶ֤חֶם אוֹנִים֙ לָ/הֶ֔ם כָּל אֹכְלָ֖י/ו יִטַמָּ֑אוּ כִּֽי לַחְמָ֣/ם לְ/נַפְשָׁ֔/ם לֹ֥א יָב֖וֹא בֵּ֥ית יְהוָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/004.yaml
  text: They will not pour out wine offerings to Yahweh[a], and their sacrifices will not please him. They will be like mourners’ bread to them; all who eat it will become unclean. For their bread will be for themselves alone[b]; it will not enter the house of Yahweh.
translation:
  language: de
  text: Sie werden Jahwe keine Weinspenden ausgießen, und ihre Schlachtopfer werden ihm nicht gefallen. Ihre Schlachtopfer werden für sie wie das Brot von Trauernden sein[a]; alle, die davon essen, werden unrein. Denn ihr Brot ist nur für sie selbst[b]; es wird nicht in das Haus Jahwes kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie Brot von Trauernden“. Gemeint ist wahrscheinlich Nahrung im Zusammenhang mit Totenklage, die als rituell unrein galt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für ihren Appetit“. Das hebräische Wort kann „Selbst“, „Leben“ oder „Appetit“ bedeuten; gemeint ist Nahrung für den eigenen Verzehr, nicht für das Haus Jahwes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְּכוּ ... יַיִן
  choice: Weinspenden ausgießen
  rationale: נסך bezeichnet im Opferkontext das Ausgießen einer Trankspende; zusammen mit יין wird der kultische Sinn in natürlichem Deutsch ausdrücklich wiedergegeben.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet Jahwe als Empfänger der Weinspenden; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: יֶעֶרְבוּ לוֹ
  choice: ihm nicht gefallen
  rationale: ערב bezeichnet hier, dass die Opfer für Gott angenehm beziehungsweise annehmbar sind. „Gefallen“ bewahrt die personale Formulierung des Hebräischen.
- source_word: זִבְחֵיהֶם
  choice: ihre Schlachtopfer
  rationale: זבח bezeichnet insbesondere ein geschlachtetes Opfer. „Schlachtopfer“ wahrt diese kultische Präzision besser als das allgemeinere „Opfer“.
- source_word: כְּלֶחֶם אוֹנִים
  choice: wie das Brot von Trauernden
  rationale: Die Wendung bezeichnet Brot im Zusammenhang mit Totenklage und der dadurch vermittelten kultischen Unreinheit. Die offene hebräische Bildsprache bleibt erhalten.
- source_word: יִטַמָּאוּ
  choice: werden unrein
  rationale: טמא hat hier im Zusammenhang mit Opferdienst und Heiligtum einen rituell-kultischen Sinn; „unrein“ vermeidet eine vorschnelle Moralisierung.
- source_word: לַחְמָם
  choice: ihr Brot
  rationale: לחם bedeutet wörtlich „Brot“ und kann zugleich Nahrung bezeichnen. Das konkrete Bild des Ausgangstextes wird beibehalten.
- source_word: לְנַפְשָׁם
  choice: nur für sie selbst
  rationale: נפש kann hier „Selbst“, „Leben“ oder „Appetit“ bezeichnen. Im Kontext geht es um Nahrung zum eigenen Verzehr, die nicht für das Heiligtum bestimmt ist.
- source_word: לֹא יָבוֹא בֵּית יְהוָה
  choice: es wird nicht in das Haus Jahwes kommen
  rationale: Die Formulierung folgt der Bewegungsangabe des Hebräischen und bringt zum Ausdruck, dass dieses Brot keinen Zugang zum Heiligtum erhält.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der Unreinheit beim Brot von Trauernden
  choice: rituell-kultische Unreinheit im Zusammenhang mit Tod und Trauer
  alternative: bloße Traurigkeit oder moralische Verderbtheit
  rationale: Opfer, Essen und der Zugang zum Haus Jahwes bilden einen kultischen Zusammenhang; daher bezeichnet טמא hier rituelle Unreinheit.
- issue: Bezug von „wie das Brot von Trauernden“
  choice: Die Schlachtopfer werden für die Opfernden wie unreines Trauerbrot sein
  alternative: 'eigenständige Aussage: „Ihr Brot ist wie das Brot von Trauernden“'
  rationale: Die masoretische Satzfolge verbindet זבחיהם mit dem folgenden Vergleich, lässt aber in der knappen poetischen Syntax einen gewissen Übergang von den Opfern zum Brot erkennen. Die Übersetzung folgt der nächstliegenden grammatischen Verbindung, ohne die Bildspannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachbegriffe wie „Weinspenden“, „Schlachtopfer“ und „unrein“ erhalten die sachliche und theologische Prägung des hebräischen Textes; die knappe Bildsprache bleibt weitgehend formal gewahrt.
