base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/006.yaml
  text: Then she conceived again and gave birth to a daughter[a]. And he said to him, “Call her name Lo-ruhamah, for I will no longer again show compassion to the house of Israel[b], that I should surely forgive them.”
translation:
  language: de
  text: 'Dann wurde sie wieder schwanger und brachte eine Tochter zur Welt. Und er sagte zu ihm: »Gib ihr den Namen Lo-Ruhama[a], denn ich werde dem Haus Israel kein Erbarmen mehr erweisen und ihnen gewiss nicht vergeben.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lo-Ruhama bedeutet etwa »Kein Erbarmen« oder »Diejenige, der kein Erbarmen erwiesen wird«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder möglicherweise: »denn ich werde sie gewiss wegnehmen.« Der hebräische Schlusssatz ist schwierig und kann unterschiedlich verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Dann wurde sie wieder schwanger
  rationale: Die Wegyiqtol-Erzählfolge wird mit »Dann« aufgenommen; עוֹד bezeichnet die erneute Schwangerschaft.
- source_word: וַתֵּלֶד בַּת
  choice: und brachte eine Tochter zur Welt
  rationale: Die heutige deutsche Wendung gibt ילד mit בַּת klar und natürlich wieder.
- source_word: וַיֹּאמֶר לוֹ
  choice: Und er sagte zu ihm
  rationale: Die beiden männlichen Pronomen des Hebräischen bleiben erhalten; weder der Sprecher noch der Angesprochene wird in diesem Vers ausdrücklich benannt.
- source_word: קְרָא שְׁמָהּ
  choice: Gib ihr den Namen
  rationale: Die deutsche Namensformel ist natürlich und bewahrt den feierlichen Charakter der prophetischen Benennung.
- source_word: לֹא רֻחָמָה
  choice: Lo-Ruhama
  rationale: Der Personenname wird transliteriert; seine auf רחם beruhende Bedeutung wird durch »Erbarmen« im Folgesatz und durch die Fußnote erschlossen.
- source_word: לֹא אוֹסִיף עוֹד אֲרַחֵם
  choice: ich werde … kein Erbarmen mehr erweisen
  rationale: Die Kombination von יסף, עוֹד und רחם bezeichnet das Ende des Erbarmens. »Erbarmen erweisen« erhält die Wortverbindung zum Namen Lo-Ruhama.
- source_word: בֵּית יִשְׂרָאֵל
  choice: dem Haus Israel
  rationale: Die ausdrückliche Bundes- und Volksbezeichnung »Haus Israel« bleibt erhalten.
- source_word: כִּי נָשֹׂא אֶשָּׂא לָהֶם
  choice: und ihnen keinesfalls vergeben
  rationale: נשׂא wird hier im Sinn des Wegtragens von Schuld beziehungsweise des Vergebens verstanden. Die Verbindung von Infinitivus absolutus und finitem Verb wird emphatisch mit »keinesfalls« wiedergegeben; die vorausgehende Verneinung wird sinngemäß auf die koordinierte Aussage bezogen.
theological_decisions:
- issue: Wiedergabe des symbolischen Namens der Tochter
  choice: Der Name wird als »Lo-Ruhama« transliteriert; seine Bedeutung wird durch die Wortwahl »Erbarmen« und eine Fußnote sichtbar gemacht.
  alternative: Den Namen im Haupttext als »Kein Erbarmen« oder »Nicht begnadigt« übersetzen.
  rationale: Die Transliteration behandelt Lo-Ruhama als Eigennamen, ohne die theologische Aussage des Zeichennamens zu verdecken.
- issue: Deutung der schwierigen Schlussklausel כִּי נָשֹׂא אֶשָּׂא לָהֶם
  choice: 'Die Klausel wird als emphatische Verweigerung der Vergebung verstanden: »und ihnen keinesfalls vergeben«.'
  alternative: 'Die Klausel als Gerichtsaussage verstehen: »sondern sie gewiss wegnehmen/fortschaffen«.'
  rationale: נשׂא kann das Wegtragen von Schuld und damit Vergebung bezeichnen; die Negation des vorausgehenden Satzes bestimmt dann auch diese Aussage. Da Syntax und Bedeutung umstritten sind, wird die alternative Gerichtsaussage ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählung bleibt knapp; die ausdrücklich gesetzten, aber nicht näher bestimmten Pronomen »er« und »ihm« werden nicht erläuternd ersetzt. Der Wortstamm רחם wird durch »Erbarmen« in Name, Kontext und Fußnote nachvollziehbar gehalten.
