base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/008.yaml
  text: After she had weaned Lo-ruhamah[a], she conceived and gave birth to a son.
translation:
  language: de
  text: Nachdem sie Lo-Ruhama[a] entwöhnt hatte, wurde sie schwanger und brachte einen Sohn zur Welt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lo-Ruhama bedeutet „Kein Erbarmen“ oder „die kein Erbarmen erfahren hat“. Die Bedeutung des Namens ist im Zusammenhang wichtig; im Haupttext wird der Name jedoch transliteriert wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְמֹל
  choice: Nachdem sie … entwöhnt hatte
  rationale: גמל bezeichnet hier im Qal das Entwöhnen eines Kindes. Die temporale Nebensatzkonstruktion gibt die erzählerische Abfolge im Deutschen natürlich wieder.
- source_word: אֶת
  choice: '[Akkusativ durch Wortstellung ausgedrückt]'
  rationale: Der hebräische Marker kennzeichnet das bestimmte direkte Objekt und wird im Deutschen nicht eigens übersetzt.
- source_word: לֹא רֻחָמָה
  choice: Lo-Ruhama
  rationale: Der Personenname wird transliteriert; die Fußnote erläutert seine im Zusammenhang wichtige Bedeutung.
- source_word: וַתַּהַר
  choice: wurde sie wieder schwanger
  rationale: הרה bezeichnet das Schwangerwerden. „Wieder“ ist als idiomatische Verdeutlichung der erneuten Schwangerschaft aus der fortlaufenden Geburtsgeschichte erschlossen, ohne den Inhalt zu verändern.
- source_word: וַתֵּלֶד
  choice: brachte … zur Welt
  rationale: Dies ist eine klare, natürliche und würdige moderne Wiedergabe der hebräischen Geburtsformel.
- source_word: בֵּן
  choice: einen Sohn
  rationale: בֵּן bedeutet „Sohn“; der unbestimmte Artikel entspricht der Neueinführung des Kindes im Bericht.
