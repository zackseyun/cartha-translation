base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/005.yaml
  text: And on that day I will break the bow of Israel in the Valley of Jezreel[a].
translation:
  language: de
  text: An jenem Tag werde ich Israels Bogen im Tal Jesreel zerbrechen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Israels Bogen zerschmettern“; der Bogen steht hier für Israels militärische Stärke.'
