lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die hebräische Zukunftsformel wird in natürlichem Deutsch als prophetische Zeitangabe wiedergegeben; die Zukunft wird durch „werde ich … zerbrechen“ deutlich.
- source_word: וְשָׁבַרְתִּי
  choice: werde ich … zerbrechen
  rationale: שׁבר bezeichnet das Brechen oder Zerschmettern. „Zerbrechen“ ist hier direkt und idiomatisch und bewahrt das Bild des unbrauchbar gemachten Bogens.
- source_word: קֶשֶׁת יִשְׂרָאֵל
  choice: Israels Bogen
  rationale: Das konkrete Bild bleibt erhalten, statt es im Haupttext als militärische Stärke auszudeuten.
- source_word: בְּעֵמֶק יִזְרְעֶאל
  choice: im Tal Jesreel
  rationale: עֵמֶק bedeutet „Tal“; Jesreel ist die im Deutschen geläufige biblische Namensform.
theological_decisions:
- issue: Ob „Bogen“ wörtlich oder als militärische Macht wiederzugeben ist
  choice: Das Bild „Israels Bogen“ bleibt im Haupttext erhalten.
  alternative: Israels militärische Macht / Israels Stärke
  rationale: Der Bogen steht sinnbildlich für Israels militärische Stärke, doch die prophetische Bildsprache sollte nicht durch eine Deutung ersetzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Gerichtsankündigung und ihre konkrete militärische Bildsprache bleiben erhalten.
