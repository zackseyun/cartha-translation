source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל הוֹשֵׁ֨עַ֙ בֶּן בְּאֵרִ֔י בִּ/ימֵ֨י עֻזִּיָּ֥ה יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖ה מַלְכֵ֣י יְהוּדָ֑ה וּ/בִ/ימֵ֛י יָרָבְעָ֥ם בֶּן יוֹאָ֖שׁ מֶ֥לֶךְ יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/001.yaml
  text: The word of Yahweh that came to Hosea son of Beeri in the days of Uzziah[a], Jotham, Ahaz, and Hezekiah, kings of Judah, and in the days of Jeroboam son of Joash, king of Israel.
translation:
  language: de
  text: Das Wort Jahwes[a], das an Hosea, den Sohn Beeris, erging, zur Zeit Usijas, Jotams, Ahas und Hiskijas, der Könige von Juda, und zur Zeit Jerobeams, des Sohnes Joaschs, des Königs von Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH. Traditionell mit »der HERR« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: Das Wort Jahwes
  rationale: Die für prophetische Überschriften typische Formel wird formal bewahrt; »Wort« gibt דָּבָר hier weniger deutend wieder als »Botschaft«.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: das an … erging
  rationale: היה אל bezeichnet in prophetischen Einleitungen idiomatisch das Ergehen göttlicher Offenbarung an einen Propheten. Die Formulierung ist im Deutschen natürlich und würdevoll.
- source_word: הוֹשֵׁעַ בֶּן בְּאֵרִי
  choice: Hosea, den Sohn Beeris
  rationale: Die Namen folgen den etablierten deutschen Bibelformen; der Patronymzusatz wird als Apposition wiedergegeben.
- source_word: בִּימֵי
  choice: zur Zeit
  rationale: Die hebräische Zeitangabe wird idiomatisch wiedergegeben, ohne sie enger als ausdrücklichen Hinweis auf Regierungszeiten auszulegen.
- source_word: עֻזִּיָּה יוֹתָם אָחָז יְחִזְקִיָּה
  choice: Usijas, Jotams, des Ahas und Hiskijas
  rationale: Verwendet die üblichen deutschen Namensformen und passt die Kasusformen an die Konstruktion »zur Zeit« an.
- source_word: מַלְכֵי יְהוּדָה
  choice: der Könige von Juda
  rationale: Die Apposition bezieht sich gemeinsam auf die vier zuvor genannten Herrscher.
- source_word: וּבִימֵי יָרָבְעָם בֶּן יוֹאָשׁ
  choice: und zur Zeit Jerobeams, des Sohnes Joaschs
  rationale: Die Wiederholung der hebräischen Zeitformel und der Patronymzusatz bleiben sichtbar.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: des Königs von Israel
  rationale: Die singularische Apposition bezeichnet Jerobeam und wird im Deutschen an die Genitivkonstruktion angepasst.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Konsonantentext enthält den persönlichen Gottesnamen JHWH. »Jahwe« gibt ihn als Namen wieder; die traditionelle Ersatzlesung »der HERR« wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Moderne, würdige Standardsprache mit dem formelhaften Charakter einer prophetischen Buchüberschrift. Die Satzstruktur bleibt quellennah, während »zur Zeit« und »erging« ein natürliches Deutsch gewährleisten.
