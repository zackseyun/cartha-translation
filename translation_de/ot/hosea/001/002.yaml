base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/002.yaml
  text: The beginning of the word of Yahweh through Hosea[a]. And Yahweh said to Hosea, “Go, take for yourself a wife of whoredom and children of whoredom[c][b], for the land utterly commits whoredom by turning away from Yahweh.”
translation:
  language: de
  text: 'Der Beginn des Redens Jahwes durch Hosea.[a] Jahwe sagte zu Hosea: »Geh, nimm dir eine Frau der Hurerei und Kinder der Hurerei,[b] denn das Land treibt unablässig Hurerei, indem es sich von Jahwe abwendet.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Als Jahwe zum ersten Mal durch Hosea redete«. Der hebräische Anfang kann als Überschrift oder als temporaler Nebensatz verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: »eine Frau der Prostitution und Kinder der Prostitution«. Das hebräische Wort kann allgemein sexuelle Untreue oder enger Prostitution bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: »Denn das Land hurt, ja, es hurt, weg von Jahwe.« Die hebräische Verbindung zweier Formen desselben Verbs verstärkt die Aussage und beschreibt hier äußerste Untreue gegenüber Jahwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִלַּת דִּבֶּר יְהוָה בְּהוֹשֵׁעַ
  choice: Der Anfang dessen, was Jahwe durch Hosea redete
  rationale: Die Formulierung bewahrt die mögliche Überschriftsfunktion des hebräischen Ausdrucks und gibt בְּ instrumentell mit »durch« wieder. Die unmittelbar folgende Wendung אֶל הוֹשֵׁעַ bezeichnet dagegen ausdrücklich das Reden »zu Hosea«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in seiner im Deutschen üblichen wissenschaftlichen Umschrift wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֵךְ קַח לְךָ
  choice: Geh, nimm dir
  rationale: Beide Imperative und das rückbezügliche לְךָ bleiben erhalten. »Heirate« wäre im Zusammenhang möglich, wäre jedoch stärker deutend als das hebräische קַח.
- source_word: אֵשֶׁת זְנוּנִים
  choice: eine Frau der Hurerei
  rationale: Die bewusst schroffe Konstruktion und ihre sexuelle wie bundestheologische Bildkraft bleiben erhalten. »Prostitution« wäre enger, »Untreue« schwächer und stärker auslegend.
- source_word: וְיַלְדֵי זְנוּנִים
  choice: und Kinder der Hurerei
  rationale: Die parallele Formulierung des Hebräischen wird bewahrt, ohne festzulegen, in welchem genauen Sinn die Kinder durch »Hurerei« gekennzeichnet sind.
- source_word: כִּי זָנֹה תִזְנֶה
  choice: denn das Land treibt hemmungslos Hurerei
  rationale: Der Infinitivus absolutus mit dem finiten Verb verstärkt die Aussage. »Hemmungslos« vermittelt diese emphatische Kraft in natürlichem Deutsch, ohne die Wiederholung mechanisch nachzubilden.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: »Land« wahrt sowohl den räumlichen Bezug auf Israel als auch die mögliche metonymische Einbeziehung seiner Bevölkerung.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: indem es sich von Jahwe abwendet
  rationale: Die hebräische Wendung bedeutet wörtlich ein Weggehen »hinter Jahwe her« beziehungsweise vom Folgen Jahwes. Die deutsche Fassung macht den Abfall verständlich und erhält den Bezug zur vorherigen Hurerei.
theological_decisions:
- issue: Stärke der sexuellen Bildsprache
  choice: Hurerei
  alternative: Unzucht; Prostitution; Untreue
  rationale: Die anstößige prophetische Bildsprache darf nicht abgeschwächt werden. »Hurerei« ist weiter als kommerzielle Prostitution und hält zugleich die Übertragung auf Israels Abkehr von Jahwe offen.
- issue: Bedeutung von בְהוֹשֵׁעַ in der Eröffnung
  choice: durch Hosea
  alternative: zu Hosea; mit Hosea
  rationale: Das folgende אֶל הוֹשֵׁעַ bezeichnet eindeutig das Reden zu Hosea. »Durch Hosea« lässt den Unterschied der Präpositionen erkennen und versteht Hosea hier als Vermittler der Botschaft.
- issue: Bezug von »Kinder der Hurerei«
  choice: Die mehrdeutige Genitivverbindung wird unverändert offengehalten
  alternative: uneheliche Kinder; Kinder einer Prostituierten
  rationale: Der hebräische Ausdruck kann Herkunft, Prägung oder Zugehörigkeit anzeigen. Eine Festlegung auf biologische Unehelichkeit oder gewerbsmäßige Prostitution ginge über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener prophetischer Schärfe. »Hurerei« ist markiert, aber verständlich und entspricht der drastischen Bildsprache. Die ungewöhnliche Eröffnung bleibt wegen ihrer syntaktischen Mehrdeutigkeit relativ formnah; eine natürlichere temporale Deutung steht in der Fußnote.
