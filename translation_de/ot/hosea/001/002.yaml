  source_fidelity: Die Übersetzung gibt die Imperative, die instrumentale Bedeutung von בְּהוֹשֵׁעַ („durch Hosea“), die parallelen Genitivverbindungen und die Abkehr von Jahwe insgesamt zuverlässig wieder. Die Eröffnung „Der Anfang dessen, was Jahwe durch Hosea redete“ ist jedoch im Deutschen unnötig umständlich und durch das Präteritum weniger nah an der nominalen hebräischen Konstruktion.
  naturalness: „Der Beginn des Redens Jahwes durch Hosea“ ist ein natürlicherer, zugleich formnaher deutscher Incipit und bewahrt die im Hebräischen bestehende Möglichkeit einer Überschrift. Für den Infinitivus absolutus ist „unablässig“ treffender als „hemmungslos“, da Letzteres eine zusätzliche psychologische Nuance einträgt.
  terminology: „Jahwe“, „Hurerei“, „Frau der Hurerei“ und „Kinder der Hurerei“ sind für die scharfe, bewusst nicht auf Prostitution verengte prophetische Bildsprache geeignet. Die Fußnoten bewahren die maßgeblichen syntaktischen und lexikalischen Alternativen.
