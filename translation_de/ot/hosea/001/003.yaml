base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/003.yaml
  text: So he went and took Gomer daughter of Diblaim[a], and she conceived and bore him a son.
translation:
  language: de
  text: Da ging er hin und nahm[a] Gomer, die Tochter Diblaims. Sie wurde schwanger und gebar ihm einen Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heiratete Gomer“ beziehungsweise „nahm Gomer zur Frau“. Wörtlich steht im Hebräischen „nahm“; der eheliche Sinn ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da ging er hin
  rationale: Das Wayyiqtol von הלך führt die Erzählung fort. „Da ging er hin“ gibt die zeitlich-folgernde Bewegung in natürlichem, gehobenem Deutsch wieder.
- source_word: וַיִּקַּח
  choice: nahm
  rationale: לקח bedeutet wörtlich „nehmen“ und kann im Zusammenhang einer Eheschließung das Zur-Frau-Nehmen bezeichnen. „Nahm“ bewahrt die Ausdrucksweise des Hebräischen; der eheliche Sinn ergibt sich aus dem vorausgehenden Auftrag.
- source_word: אֶת גֹּמֶר
  choice: Gomer
  rationale: Die Akkusativpartikel אֶת bleibt unübersetzt; der Personenname wird in geläufiger deutscher Form wiedergegeben.
- source_word: בַּת דִּבְלָיִם
  choice: die Tochter Diblajims
  rationale: בַּת mit einem Eigennamen ist eine patronymische Angabe. Der Genitiv ist im Deutschen natürlich und präzise.
- source_word: וַתַּהַר
  choice: Sie wurde schwanger
  rationale: הרה bezeichnet das Empfangen beziehungsweise Schwangerwerden. Die gewählte Formulierung ist in modernem Deutsch klar und natürlich.
- source_word: וַתֵּלֶד
  choice: und gebar
  rationale: ילד bezeichnet in dieser Form das Gebären. „Gebar“ ist knapp, würdevoll und entspricht der hebräischen Geburtsformel.
- source_word: לוֹ
  choice: ihm
  rationale: Die Präposition ל mit Suffix bezeichnet hier die Beziehung des geborenen Kindes zu Hosea; „gebar ihm“ erhält diese ausdrücklich im Text vorhandene Zuordnung.
- source_word: בֵּן
  choice: einen Sohn
  rationale: בֵּן bezeichnet ein männliches Kind. Der unbestimmte Akkusativ ist im Deutschen bei der erstmaligen Einführung des Kindes idiomatisch.
theological_decisions:
- issue: Ob der eheliche Sinn von וַיִּקַּח ausdrücklich gemacht werden soll
  choice: Die wörtlichere Wiedergabe „nahm“ bleibt im Haupttext erhalten.
  alternative: „heiratete“ oder „nahm zur Frau“
  rationale: Der Zusammenhang verleiht dem Verb ehelichen Sinn, doch der Vers selbst ergänzt nicht ausdrücklich „zur Frau“. Die wörtlichere Form wahrt die sprachliche Offenheit und verweist die eindeutige kontextuelle Deutung in die Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Erzählungsformen werden flüssig wiedergegeben, ohne die knappe Aussage auszuweiten. Der Punkt nach der Abstammungsangabe vermeidet eine schwerfällige Satzkette und erhält dennoch die klare Abfolge der Ereignisse.
