source:
  edition: WLC
  text: וְ/אֶת בֵּ֤ית יְהוּדָה֙ אֲרַחֵ֔ם וְ/הֽוֹשַׁעְתִּ֖י/ם בַּ/יהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וְ/לֹ֣א אֽוֹשִׁיעֵ֗/ם בְּ/קֶ֤שֶׁת וּ/בְ/חֶ֨רֶב֙ וּ/בְ/מִלְחָמָ֔ה בְּ/סוּסִ֖ים וּ/בְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/007.yaml
  text: But I will have compassion on the house of Judah[a], and I will save them by Yahweh their God; I will not save them by bow, or by sword, or by war, by horses, or by horsemen.
translation:
  language: de
  text: Doch werde ich mich über das Haus Juda erbarmen und sie durch Jahwe, ihren Gott, retten[a]. Ich werde sie nicht durch Bogen, Schwert oder Krieg, durch Pferde oder Reiter retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Jahwe, ihrem Gott“. Die hebräische Präposition kann hier das Mittel oder eine vermittelnde Zuordnung ausdrücken. „Durch“ hebt den Gegensatz zu den anschließend genannten militärischen Mitteln hervor.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶת
  choice: Doch
  rationale: Das einleitende וְ steht hier im Gegensatz zum zuvor angekündigten Gericht über Israel. „Doch“ macht diesen adversativen Zusammenhang im Deutschen natürlich deutlich; אֶת ist der nicht zu übersetzende Akkusativmarker.
- source_word: בֵּית יְהוּדָה
  choice: das Haus Juda
  rationale: Die feste prophetische Bezeichnung meint das Volk beziehungsweise Reich Juda. „Haus Juda“ bewahrt die hebräische Ausdrucksweise und den würdevollen prophetischen Ton.
- source_word: אֲרַחֵם
  choice: werde ich Erbarmen haben
  rationale: Das Verb רחם bezeichnet mitfühlendes Erbarmen. Diese Wiedergabe erhält sowohl den affektiven Gehalt als auch den Bezug zum Namen Lo-Ruhama aus dem Kontext.
- source_word: וְהוֹשַׁעְתִּים
  choice: und ich werde sie ... retten
  rationale: Der Hifil von ישׁע bedeutet retten oder befreien. „Retten“ ist im militärisch-politischen Kontext verständlich und bewahrt zugleich die weitere theologische Bedeutung.
- source_word: בַּיהוָה אֱלֹהֵיהֶם
  choice: durch Jahwe, ihren Gott
  rationale: Die Präposition בְּ kann Mittel oder vermittelnde Urheberschaft bezeichnen. „Durch“ ist natürliches Deutsch und stellt Jahwe den anschließend ausgeschlossenen militärischen Mitteln gegenüber, ohne die ungewöhnliche Aussage zu glätten, dass Gott durch Jahwe rettet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְלֹא אֽוֹשִׁיעֵם
  choice: Ich werde sie nicht ... retten
  rationale: Die Wiederholung desselben Verbstamms wie zuvor wird beibehalten und unterstreicht den Gegensatz zwischen göttlicher Rettung und militärischen Mitteln.
- source_word: בְּקֶשֶׁת וּבְחֶרֶב וּבְמִלְחָמָה
  choice: durch Bogen, Schwert oder Krieg
  rationale: Die konkrete Aufzählung militärischer Mittel bleibt erhalten. Im Deutschen verbindet „oder“ die verneinte Reihe klar und idiomatisch.
- source_word: בְּסוּסִים וּבְפָרָשִׁים
  choice: durch Pferde oder Reiter
  rationale: Die wörtlichen militärischen Bilder bleiben verständlich erhalten; פָרָשִׁים bezeichnet hier berittene Kämpfer beziehungsweise Reiter.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen יהוה. „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von בַּיהוָה אֱלֹהֵיהֶם
  choice: 'instrumental beziehungsweise vermittelnd: „durch Jahwe, ihren Gott“'
  alternative: „in Jahwe, ihrem Gott“ oder „von Jahwe, ihrem Gott“
  rationale: Der folgende Gegensatz zu Bogen, Schwert, Krieg, Pferden und Reitern spricht für eine instrumentale Lesart. Die Wiedergabe lässt dennoch die auffällige Sprecherkonstellation des hebräischen Textes stehen und löst sie nicht christologisch oder anderweitig auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Bildsprache. Die Satzteilung und die wiederholte Verneinung machen die Aufzählung im Deutschen klar, ohne ihren Inhalt zu erweitern.
