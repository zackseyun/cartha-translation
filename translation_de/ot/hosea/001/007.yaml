  verdict: revise
  source_fidelity: Die Übersetzung gibt den adversativen Anschluss, das Erbarmen über Juda, die Rettung durch Jahwe sowie die vollständige Negation militärischer Rettungsmittel zuverlässig wieder. Die Wiederholung von „retten“ entspricht der Wiederholung des hebräischen Verbs ישׁע.
  naturalness: „Mit dem Haus Juda werde ich Erbarmen haben“ ist verständlich, aber weniger idiomatisch als „mich über das Haus Juda erbarmen“. Die Satzfügung kann daher ohne Bedeutungsverschiebung geglättet werden.
  terminology: '„Jahwe“, „Haus Juda“, „Erbarmen“, „retten“ sowie „Pferde“ und „Reiter“ sind angemessen. Die Fußnotenalternative „von Jahwe“ ist in dieser aktiven deutschen Konstruktion jedoch missverständlich: „jemanden von Jahwe retten“ bedeutet gewöhnlich, ihn vor Jahwe zu retten, nicht Rettung durch Jahwe.'
