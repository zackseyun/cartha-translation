  rationale: Der Schlusssatz wurde behutsam zu »ich werde nicht euer sein« geändert. Dadurch bleibt die im Hebräischen ausgesparte Ergänzung erhalten, während eine im Deutschen missverständliche Wendung vermieden wird. Die wörtlichere, aber weniger idiomatische Möglichkeit sowie die verbreitete bundesformelhafte Auslegung sind in der Fußnote dokumentiert.
