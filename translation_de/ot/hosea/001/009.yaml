review_pass:
  verdict: revise
  source_fidelity: 'Der Vers wird insgesamt präzise wiedergegeben: Die Namensgebung, die kausale Begründung und die Umkehrung von »mein Volk« entsprechen dem Hebräischen. Im Schlusssatz wahrt das Futur »werde« zutreffend die Form אֶהְיֶה. »Nicht für euch sein« ist zwar formal nah an לָכֶם, ist im Deutschen aber semantisch zu offen und klingt, als gehe es um Unterstützung oder Verfügbarkeit. »Nicht euer sein« gibt die elliptische Bundesformel idiomatischer wieder, ohne »Gott« in den Text einzutragen.'
  naturalness: »Nenne ihn«, »denn ihr seid nicht mein Volk« und die Zeichensetzung sind modernes, würdiges Standarddeutsch. Die Formulierung »ich werde nicht euer sein« ist in diesem feierlich-prophetischen Register klarer und natürlicher als »ich werde nicht für euch sein«.
  terminology: »Nicht-mein-Volk« bewahrt die Funktion als symbolischer Eigenname und spiegelt die anschließende Formel »nicht mein Volk«. Die explizite Ergänzung »euer Gott« gehört wegen ihrer Abwesenheit im Hebräischen nur in die Fußnote.
  issues:
