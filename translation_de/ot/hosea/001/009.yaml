source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר קְרָ֥א שְׁמ֖/וֹ לֹ֣א עַמִּ֑י כִּ֤י אַתֶּם֙ לֹ֣א עַמִּ֔/י וְ/אָנֹכִ֖י לֹֽא אֶהְיֶ֥ה לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/009.yaml
  text: And he said[a], “Call his name Not-My-People, for you are not my people, and I am not yours.”
translation:
  language: de
  text: 'Und er sagte: »Nenne ihn Nicht-mein-Volk; denn ihr seid nicht mein Volk, und ich werde nicht euer sein.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und ich werde nicht für euch sein«; im Sinn der Bundesformel verstehen viele: »und ich werde nicht euer Gott sein«.'
    reason: alternative_reading
lexical_decisions:
- source_word: קְרָא שְׁמוֹ
  choice: Nenne ihn
  rationale: Die hebräische Wendung lautet wörtlich »Rufe seinen Namen«. Die natürliche deutsche Namensformel »Nenne ihn« gibt ihre Funktion im prophetischen Geburtszeichen klar und knapp wieder.
- source_word: לֹא עַמִּי
  choice: Nicht-mein-Volk
  rationale: Der symbolische Name wird nach seiner Bedeutung übersetzt, damit die anschließende Begründung unmittelbar verständlich bleibt. Die Bindestriche kennzeichnen die ganze Wendung als Namen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für den symbolischen Namen ein; »denn« bewahrt den kausalen Zusammenhang in würdigem, natürlichem Deutsch.
- source_word: אַתֶּם לֹא עַמִּי
  choice: ihr seid nicht mein Volk
  rationale: Die direkte Formulierung bewahrt die Umkehrung der Bundesformel und den deutlichen Anklang an den zuvor vergebenen Namen.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה לָכֶם
  choice: und ich werde nicht für euch sein
  rationale: Die bewusst knappe hebräische Wendung enthält weder »Gott« noch ein ausdrückliches »euer«. Die Wiedergabe wahrt das Futur von אֶהְיֶה, den Bezug mit לָכֶם und die Ellipse, auch wenn sie im Deutschen ungewöhnlich klingt.
theological_decisions:
- issue: Umkehrung der Bundesformel im letzten Satzteil
  choice: Die Ellipse ohne Ergänzung von »Gott« oder »euer« wiedergeben
  alternative: »und ich werde nicht euer sein« oder »und ich werde nicht euer Gott sein«
  rationale: Der hebräische Text spielt auf die Bundesformel an, nennt »Gott« jedoch nicht ausdrücklich. Die Hauptübersetzung lässt diese theologisch gewichtige Leerstelle bestehen; geläufige Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst etwas ungewohnte Schlussformulierung spiegelt die Kürze und Mehrdeutigkeit des Hebräischen, statt die Bundesformel stillschweigend zu vervollständigen.
