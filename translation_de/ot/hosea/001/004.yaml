source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלָ֔י/ו קְרָ֥א שְׁמ֖/וֹ יִזְרְעֶ֑אל כִּי ע֣וֹד מְעַ֗ט וּ/פָ֨קַדְתִּ֜י אֶת דְּמֵ֤י יִזְרְעֶאל֙ עַל בֵּ֣ית יֵה֔וּא וְ/הִ֨שְׁבַּתִּ֔י מַמְלְכ֖וּת בֵּ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/004.yaml
  text: Then Yahweh said to him[a], “Call his name Jezreel, for in a little while I will punish the house of Jehu for the bloodshed of Jezreel[b], and I will put an end to the kingdom of the house of Israel.”
translation:
  language: de
  text: 'Da sagte Jahwe zu ihm: „Gib ihm den Namen Jesreel, denn nur noch kurze Zeit, dann werde ich das Haus Jehu für das Blutvergießen von Jesreel[a][b] zur Rechenschaft ziehen und dem Königreich des Hauses Israel ein Ende machen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „für das Blut von Jesreel“ oder „für die Blutschuld von Jesreel“. Wörtlich steht im Hebräischen „die Blute Jesreels“.'
    reason: lexical_alternative
  - marker: b
    text: Jesreel ist sowohl der symbolische Name des Kindes als auch der Name des Ortes, der mit Jehus Gewalttaten verbunden ist.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: קְרָא שְׁמוֹ
  choice: Gib ihm den Namen
  rationale: Diese natürliche deutsche Wendung gibt den hebräischen Benennungsauftrag wieder, ohne unidiomatisch am Wortlaut „Rufe seinen Namen“ festzuhalten.
- source_word: יִזְרְעֶאל
  choice: Jesreel
  rationale: Der Eigenname wird in der etablierten deutschen Form wiedergegeben. So bleibt auch der beabsichtigte Gleichklang zwischen dem Namen des Kindes und dem Ortsnamen erhalten.
- source_word: כִּי עוֹד מְעַט
  choice: denn nur noch kurze Zeit, dann
  rationale: Die Formulierung bewahrt sowohl die begründende Funktion von כִּי als auch die zeitliche Nähe der angekündigten Handlung.
- source_word: וּפָקַדְתִּי ... עַל
  choice: werde ... zur Rechenschaft ziehen
  rationale: פקד bezeichnet hier im Gerichtszusammenhang ein strafendes Einschreiten. „Zur Rechenschaft ziehen“ ist verständlich und wahrt etwas von der Verantwortungsdimension des Verbs.
- source_word: דְּמֵי יִזְרְעֶאל
  choice: das Blutvergießen von Jesreel
  rationale: Der hebräische Plural „Blute“ ist eine feste Ausdrucksweise für Blutvergießen beziehungsweise Blutschuld. Die Formulierung lässt offen, ob vor allem die in Jesreel verübten Gewalttaten oder die daraus erwachsene Blutschuld gemeint sind.
- source_word: בֵּית יֵהוּא
  choice: das Haus Jehu
  rationale: „Haus“ bewahrt den dynastischen Sinn des hebräischen Ausdrucks.
- source_word: וְהִשְׁבַּתִּי
  choice: ein Ende machen
  rationale: Die Hifil-Form bedeutet, etwas aufhören oder zu Ende gehen zu lassen; die gewählte Wendung ist im Deutschen natürlich und dem Gerichtsorakel angemessen.
- source_word: מַמְלְכוּת בֵּית יִשְׂרָאֵל
  choice: das Königtum des Hauses Israel
  rationale: „Königtum“ gibt מַמְלְכוּת präzise wieder und bewahrt zusammen mit „Haus Israel“ die vollständige hebräische Verbindung.
theological_decisions:
- issue: Wesen des Gerichts über Jehus Haus
  choice: Der Vers kündigt an, dass Jahwe Jehus Haus wegen des mit Jesreel verbundenen Blutvergießens zur Rechenschaft ziehen wird.
  alternative: Den Vers ausdrücklich entweder als Verurteilung sämtlicher Taten Jehus oder nur als Gericht über die spätere Fortsetzung von Gewalt und Götzendienst durch seine Dynastie deuten.
  rationale: Der hebräische Text spricht eindeutig von kommender Ahndung, erklärt hier aber nicht, wie dieses Urteil zu Jehus Auftrag in 2. Könige 9–10 ins Verhältnis zu setzen ist. Die Übersetzung lässt diese theologische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt dem Aufbau des hebräischen Gerichtsorakels, vermeidet jedoch unnatürliche Hebraismen. Die Wiederholung von „Jesreel“ und „Haus“ bleibt wegen ihrer literarischen und theologischen Bedeutung erhalten.
