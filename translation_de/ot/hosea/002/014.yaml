  text: וַ/הֲשִׁמֹּתִ֗י גַּפְנָ/הּ֙ וּ/תְאֵ֣נָתָ֔/הּ אֲשֶׁ֣ר אָמְרָ֗ה אֶתְנָ֥ה הֵ֨מָּה֙ לִ֔/י אֲשֶׁ֥ר נָֽתְנוּ לִ֖/י מְאַֽהֲבָ֑/י וְ/שַׂמְתִּ֣י/ם לְ/יַ֔עַר וַ/אֲכָלָ֖תַ/ם חַיַּ֥ת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/014.yaml
  text: And I will lay waste her vine and her fig tree[a], of which she said, ‘These are my wages that my lovers gave me.’ I will make them a forest, and the wild animals of the field will devour them.
translation:
  language: de
  text: 'Und ich werde ihren Weinstock und ihren Feigenbaum verwüsten, von denen sie sagte: »Sie sind mein Lohn[a], den meine Liebhaber mir gegeben haben.« Ich werde sie zu einem Wald machen, und die wilden Tiere des Feldes werden sie fressen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hurenlohn“. Das hebräische Wort kann im Bild ehelicher Untreue bei Hosea den Lohn einer Prostituierten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: ich werde … verwüsten
  rationale: Der Hifil von שׁמם bezeichnet das Verursachen von Verwüstung oder Verödung. „Verwüsten“ gibt das Gerichtshandeln kräftig und in natürlichem modernem Deutsch wieder.
- source_word: גַּפְנָהּ וּתְאֵנָתָהּ
  choice: ihren Weinstock und ihren Feigenbaum
  rationale: Die beiden Singularformen und die konkreten landwirtschaftlichen Bilder des Hebräischen werden bewahrt; גֶּפֶן bezeichnet den Weinstock, תְּאֵנָה den Feigenbaum.
- source_word: אֶתְנָה
  choice: Lohn[a]
  rationale: „Lohn“ erhält den wirtschaftlich-transaktionalen Sinn, ohne die im Kontext mitschwingende Bedeutung „Hurenlohn“ erklärend in den Haupttext einzutragen. Die Fußnote macht diese Nuance sichtbar.
- source_word: מְאַהֲבַי
  choice: meine Liebhaber
  rationale: „Liebhaber“ bezeichnet im Deutschen klar die unerlaubten Partner innerhalb des Untreuebildes und bleibt zugleich nahe an der hebräischen Bezeichnung.
- source_word: וְשַׂמְתִּים לְיַעַר
  choice: Ich werde sie zu einem Wald machen
  rationale: Die Formulierung wahrt das Bild, dass kultiviertes Land in wilden Bewuchs übergeht, und folgt der ausdrücklichen Wald-Metapher des Hebräischen.
- source_word: וַאֲכָלָתַם חַיַּת הַשָּׂדֶה
  choice: die wilden Tiere des Feldes werden sie fressen
  rationale: „Fressen“ ist bei Tieren die natürliche deutsche Entsprechung von אכל. „Die wilden Tiere des Feldes“ bewahrt die geläufige biblische Wendung ohne das altertümliche „Getier“.
theological_decisions:
- issue: Sexuell aufgeladene Bedeutung von אֶתְנָה
  choice: Im Haupttext „Lohn“, mit einer Fußnote zur möglichen Bedeutung „Hurenlohn“.
  alternative: „Hurenlohn“ unmittelbar im Haupttext.
  rationale: Der Untreue- und Prostitutionsvergleich des Zusammenhangs verleiht dem Wort eine deutliche sexuelle Konnotation. Da das Substantiv hier aber nicht ausdrücklich die Frau bezeichnet, wahrt „Lohn“ im Haupttext die sprachliche Zurückhaltung und die Fußnote die theologische Schärfe.
- issue: Identität der „Liebhaber“
  choice: Die bildhafte Bezeichnung bleibt ohne ausdrückliche Deutung stehen.
  alternative: Die Liebhaber im Text als Baale, fremde Götter oder politische Verbündete identifizieren.
  rationale: Der Vers selbst benennt die Referenten nicht ausdrücklich. Eine Konkretisierung würde die im prophetischen Bild vorhandene Mehrschichtigkeit unnötig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Konkrete Bilder und Wiederaufnahmen des Hebräischen bleiben erhalten; erklärende Deutungen werden nicht in den Haupttext verlagert.
