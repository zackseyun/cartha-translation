  text: וּ/פָקַדְתִּ֣י עָלֶ֗י/הָ אֶת יְמֵ֤י הַ/בְּעָלִים֙ אֲשֶׁ֣ר תַּקְטִ֣יר לָ/הֶ֔ם וַ/תַּ֤עַד נִזְמָ/הּ֙ וְ/חֶלְיָתָ֔/הּ וַ/תֵּ֖לֶךְ אַחֲרֵ֣י מְאַהֲבֶ֑י/הָ וְ/אֹתִ֥/י שָׁכְחָ֖ה נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/015.yaml
  text: And I will punish her for the days of the Baals[a], when she burned incense to them and adorned herself with her ring and her jewelry, and went after her lovers, but forgot me, declares Yahweh.
translation:
  language: de
  text: Und ich werde sie wegen der Tage der Baale bestrafen, an denen sie ihnen Räucheropfer darbrachte. Sie schmückte sich mit ihrem Ring[a] und ihrem Schmuck und ging ihren Liebhabern nach; mich aber vergaß sie – Spruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihrem Nasenring; möglicherweise auch: ihrem Ohrring. Das hebräische Wort bezeichnet einen Ring, häufig einen Nasen- oder Ohrring.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עָלֶיהָ
  choice: ich werde sie ... zur Rechenschaft ziehen
  rationale: פקד mit על bezeichnet in diesem Gerichtszusammenhang ein zur Verantwortung Ziehen bzw. Ahnden. Die Formulierung bewahrt den richterlichen Ernst und ist weniger verengend als ausschließlich »bestrafen«.
- source_word: יְמֵי הַבְּעָלִים
  choice: die Tage der Baale
  rationale: Der Plural bezeichnet verschiedene Erscheinungsformen oder Kultbilder des Baal. »Tage« bleibt bewusst erhalten, da sowohl Kultanlässe als auch Zeiten der Verehrung gemeint sein können.
- source_word: אֲשֶׁר תַּקְטִיר לָהֶם
  choice: an denen sie ihnen Räucheropfer darbrachte
  rationale: Das Hifil von קטר bezeichnet das Aufsteigenlassen von Opferrauch. »Räucheropfer darbringen« ist im Deutschen idiomatisch, ohne den Vorgang auf bloßes Räucherwerk zu reduzieren.
- source_word: וַתַּעַד
  choice: sie schmückte sich
  rationale: עדה bezeichnet hier das Anlegen von Schmuck; der reflexive Sinn ergibt sich natürlich aus der deutschen Formulierung.
- source_word: נִזְמָהּ
  choice: ihrem Ring
  rationale: נזם kann einen Nasenring oder Ohrring bezeichnen. Der Oberbegriff »Ring« lässt die im Kontext nicht eindeutig bestimmte Art offen; die Fußnote nennt die konkreteren Möglichkeiten.
- source_word: וְחֶלְיָתָהּ
  choice: ihrem Geschmeide
  rationale: חליה bezeichnet Schmuck oder Zierat. »Geschmeide« ist würdevoll, verständlich und vermeidet die sachliche Wiederholung von »Schmuck« nach »schmückte«.
- source_word: מְאַהֲבֶיהָ
  choice: ihren Liebhabern
  rationale: Die Bezeichnung wahrt Hoseas Ehemetapher und ihre Anspielung auf fremde Götter und möglicherweise politische Bindungen.
- source_word: וְאֹתִי שָׁכְחָה
  choice: mich aber vergaß sie
  rationale: Das adversative »aber« macht den Kontrast zwischen dem Nachlaufen hinter den Liebhabern und dem Vergessen Jahwes deutlich, ohne die Aussage inhaltlich zu erweitern.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: נאם ist eine feierliche prophetische Spruchformel. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen im modernen Standarddeutsch direkt wieder.
- issue: Referenz der »Liebhaber«
  choice: Bildsprache unverändert als »Liebhaber« bewahren
  alternative: explizit als fremde Götter oder politische Verbündete deuten
  rationale: Im Kontext steht die Frau für Israel und die Liebhaber verweisen mindestens auf abgöttische Bindungen; die Metapher kann jedoch mehrere miteinander verbundene Formen der Untreue umfassen. Eine erklärende Festlegung im Haupttext würde die Spannung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem poetisch-prophetischen Duktus, bleibt aber gut verständlich. »Baale« erhält den markanten hebräischen Plural; »Geschmeide« setzt einen leicht gehobenen, im Kontext passenden Akzent.
