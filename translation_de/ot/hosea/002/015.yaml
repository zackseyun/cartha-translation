revisions:
- from: Und ich werde sie für die Tage der Baale zur Rechenschaft ziehen, an denen sie ihnen Räucheropfer darbrachte. Sie schmückte sich mit ihrem Ring[a] und ihrem Geschmeide und lief ihren Liebhabern nach; mich aber vergaß sie – Spruch Jahwes.
  to: Und ich werde sie wegen der Tage der Baale bestrafen, an denen sie ihnen Räucheropfer darbrachte. Sie schmückte sich mit ihrem Ring[a] und ihrem Schmuck und ging ihren Liebhabern nach; mich aber vergaß sie – Spruch Jahwes.
  rationale: Die Revision verdeutlicht die gerichtliche Beziehung von »die Tage der Baale« zum Strafhandeln, modernisiert die Bezeichnung für den Schmuck und vermeidet bei »ging ... nach« eine stärkere Bewegungsnuance als im Hebräischen. Die metaphorische und theologische Offenheit von »Liebhabern« bleibt bestehen; der Gottesname und der Fußnotenanker werden beibehalten.
