source:
  edition: WLC
  text: וְ/כָרַתִּ֨י לָ/הֶ֤ם בְּרִית֙ בַּ/יּ֣וֹם הַ/ה֔וּא עִם חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/עִם ע֣וֹף הַ/שָּׁמַ֔יִם וְ/רֶ֖מֶשׂ הָֽ/אֲדָמָ֑ה וְ/קֶ֨שֶׁת וְ/חֶ֤רֶב וּ/מִלְחָמָה֙ אֶשְׁבּ֣וֹר מִן הָ/אָ֔רֶץ וְ/הִשְׁכַּבְתִּ֖י/ם לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/020.yaml
  text: And on that day I will make for them a covenant with the wild animals of the field[a], with the birds of the heavens, and with the creeping things of the ground; and I will break bow and sword and war from the land[c][b], and I will make them lie down in safety.
translation:
  language: de
  text: Und an jenem Tag werde ich für sie einen Bund schließen[a] mit den wilden Tieren des Feldes, mit den Vögeln des Himmels[b] und mit den Kriechtieren des Erdbodens. Bogen, Schwert und Krieg werde ich im Land[c] zerbrechen und ihnen sichere Ruhe geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Bund schneiden“; dies ist die übliche hebräische Wendung für das Schließen eines Bundes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit den Vögeln der Luft“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „auf der Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָרַתִּי ... בְּרִית
  choice: werde ich ... einen Bund schließen
  rationale: כרת ברית bedeutet wörtlich „einen Bund schneiden“, ist aber die feste hebräische Wendung für das Schließen eines Bundes. „Einen Bund schließen“ ist die entsprechende natürliche deutsche Wendung.
- source_word: לָהֶם
  choice: für sie
  rationale: Das ל bezeichnet hier die Begünstigten. Die anschließenden Tiergruppen werden dagegen jeweils mit עִם („mit“) eingeführt; diese syntaktische Unterscheidung bleibt erhalten.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die Formulierung gibt die prophetische Zeitangabe in natürlichem, gehobenem Deutsch wieder.
- source_word: חַיַּת הַשָּׂדֶה
  choice: die wilden Tiere des Feldes
  rationale: חַיָּה bezeichnet hier die nicht domestizierten Landtiere; „wilde Tiere“ ist gegenwärtig und verständlich, während „des Feldes“ die Bildsprache bewahrt.
- source_word: עוֹף הַשָּׁמַיִם
  choice: die Vögel des Himmels
  rationale: עוֹף bezeichnet fliegende Tiere, in diesem Zusammenhang Vögel. „Himmel“ wahrt die traditionelle räumliche Bildsprache; „Luft“ wäre ebenfalls möglich.
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: die Kriechtiere des Erdbodens
  rationale: רֶמֶשׂ umfasst kriechende oder sich am Boden bewegende Tiere. „Erdboden“ gibt אֲדָמָה wieder und unterscheidet es von אֶרֶץ später im Vers.
- source_word: וְקֶשֶׁת וְחֶרֶב וּמִלְחָמָה
  choice: Bogen, Schwert und Krieg
  rationale: Die drei Begriffe bleiben unverkürzt erhalten, sodass die poetische Steigerung von einzelnen Waffen zum Krieg als Ganzem sichtbar bleibt.
- source_word: אֶשְׁבּוֹר מִן הָאָרֶץ
  choice: werde ich aus dem Land verbannen
  rationale: שׁבר bedeutet grundsätzlich „zerbrechen“. Da neben Bogen und Schwert auch der Krieg Objekt ist und מִן die Entfernung aus dem Land ausdrückt, gibt „verbannen“ die Wirkung des Bildes in natürlichem Deutsch wieder, ohne die drei Objekte zusammenzufassen.
- source_word: וְהִשְׁכַּבְתִּים לָבֶטַח
  choice: und ich werde sie sicher ruhen lassen
  rationale: Die Hifil-Form von שׁכב ist kausativ. „Ruhen lassen“ bewahrt das Bild des sicheren Niederlegens, während „sicher“ לָבֶטַח knapp und idiomatisch wiedergibt.
theological_decisions:
- issue: Verhältnis der Begünstigten zu den Bundespartnern
  choice: Gott schließt für das Volk einen Bund mit der Tierwelt.
  alternative: Gott schließt gemeinsam mit dem Volk und den Tieren einen Bund.
  rationale: Der hebräische Text unterscheidet לָהֶם („für sie“) von dem wiederholten עִם („mit“) vor den Tiergruppen. Die Übersetzung wahrt diese Unterscheidung, ohne die genaue Bundesstruktur über den Wortlaut hinaus festzulegen.
- issue: Räumlicher Umfang von אֶרֶץ
  choice: Land
  alternative: Erde
  rationale: Im unmittelbaren Kontext stehen Wiederherstellung, Frieden und Sicherheit des Volkes in seinem Land im Vordergrund. Die mögliche umfassendere Bedeutung „Erde“ wird in einer Fußnote offengehalten.
- issue: Referent des Pronomens in וְהִשְׁכַּבְתִּים
  choice: Das Pronomen „sie“ bleibt ohne ausdrückliche Auflösung stehen.
  alternative: Explizite Auflösung als „mein Volk“ oder als „die Tiere“
  rationale: Die Form ist grammatisch maskulin plural und ihr Bezug kann aus dem weiteren Zusammenhang auf die Begünstigten bezogen werden; eine ausdrückliche Ergänzung würde die im Hebräischen vorhandene Offenheit unnötig verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der hebräischen Aufzählung, bleibt aber flüssig. „Bund schließen“ und „sicher ruhen lassen“ sind natürliche deutsche Entsprechungen; die wiederholten „mit“-Glieder und die Dreierfolge „Bogen, Schwert und Krieg“ bewahren Rhythmus und Nachdruck des Ausgangstextes.
