    issue: „verbannen“ für אֶשְׁבּוֹר
    rationale: „Verbannen“ bezeichnet primär eine Ausweisung und ersetzt das hebräische Bild des Zerbrechens von Bogen und Schwert. Da „Krieg“ als drittes Objekt die Wirkung auf die gesamte Kriegsgewalt ausweitet, ist eine Formulierung mit „zerbrechen“ und einer erklärenden natürlichen Satzfügung vorzuziehen.
  - severity: low
    issue: „sie sicher ruhen lassen“ für וְהִשְׁכַּבְתִּים לָבֶטַח
    rationale: Die Formulierung ist möglich, bildet aber das kausative Sicherheitsversprechen und das Niederlegungs-/Ruhebild weniger deutlich ab. „Ihnen sichere Ruhe geben“ ist idiomatischer und wahrt den nicht näher bestimmten Bezug des hebräischen Suffixes.
