revisions:
- from: Und an jenem Tag werde ich für sie einen Bund schließen[a] mit den wilden Tieren des Feldes, mit den Vögeln des Himmels[b] und mit den Kriechtieren des Erdbodens. Bogen, Schwert und Krieg werde ich aus dem Land[c] verbannen, und ich werde sie sicher ruhen lassen.
  to: Und an jenem Tag werde ich für sie einen Bund schließen[a] mit den wilden Tieren des Feldes, mit den Vögeln des Himmels[b] und mit den Kriechtieren des Erdbodens. Bogen, Schwert und Krieg werde ich im Land[c] zerbrechen und ihnen sichere Ruhe geben.
  rationale: Die Revision ersetzt die zu freie Wiedergabe „verbannen“ durch „zerbrechen“, das die Bildsprache von שׁבר für Waffen und Krieg wahrt. Die Ortsfügung „im Land“ ist im Deutschen bei „zerbrechen“ idiomatisch und gibt den kontextuellen Bereich der Beseitigung wieder; die mögliche weitere Lesart von אֶרֶץ bleibt in der Fußnote offen. Der Schluss wird als „ihnen sichere Ruhe geben“ formuliert, um die bewirkte Sicherheit natürlich auszudrücken, ohne den im Hebräischen offenen Referenten ausdrücklich zu identifizieren.
  reviewer_model: gpt-5.6-terra
