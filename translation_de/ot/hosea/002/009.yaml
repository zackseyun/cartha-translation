language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/רִדְּפָ֤ה אֶת מְאַהֲבֶ֨י/הָ֙ וְ/לֹֽא תַשִּׂ֣יג אֹתָ֔/ם וּ/בִקְשָׁ֖תַ/ם וְ/לֹ֣א תִמְצָ֑א וְ/אָמְרָ֗ה אֵלְכָ֤ה וְ/אָשׁ֨וּבָה֙ אֶל אִישִׁ֣/י הָֽ/רִאשׁ֔וֹן כִּ֣י ט֥וֹב לִ֛/י אָ֖ז מֵ/עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/009.yaml
  text: She will pursue her lovers[a], but she will not overtake them; she will seek them, but she will not find them. Then she will say, ‘I will go and return to my first husband, for it was better for me then than now.’
translation:
  language: de
  text: 'Sie wird ihren Liebhabern nachjagen, aber sie nicht einholen; sie wird sie suchen, aber nicht finden. Dann wird sie sagen: »Ich will gehen und zu meinem ersten Mann[a] zurückkehren; denn damals ging es mir besser als jetzt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu meinem Mann, dem ersten“; auch möglich: „zu meinem früheren Mann“.'
    reason: Die hebräische Formulierung bezeichnet den Mann im Ehebild als den „ersten“ und kann im Zusammenhang zugleich auf den früheren Mann weisen.
lexical_decisions:
- source_word: וְרִדְּפָה
  choice: Sie wird … nachjagen
  rationale: Das Qal-Perfekt mit וְ steht im prophetischen Zusammenhang für ein zukünftiges Geschehen. „Nachjagen“ bewahrt das Bild einer entschlossenen, aber erfolglosen Verfolgung.
- source_word: מְאַהֲבֶיהָ
  choice: ihren Liebhabern
  rationale: Im durchgehenden Ehebild Hoseas sind unerlaubte Liebespartner gemeint. „Liebhaber“ gibt die sexuelle und relationale Bildsprache direkt wieder, ohne sie vorschnell als Götter oder politische Verbündete auszudeuten.
- source_word: תַשִּׂיג אֹתָם
  choice: sie nicht einholen
  rationale: Das Hifil von נשׂג bezeichnet hier das Einholen der Verfolgten und führt das Jagd- beziehungsweise Verfolgungsbild natürlich fort.
- source_word: וּבִקְשָׁתַם
  choice: sie wird sie suchen
  rationale: בקש bezeichnet gezieltes Suchen. Die schlichte Wiedergabe erhält den Parallelismus mit „finden“.
- source_word: וְלֹא תִמְצָא
  choice: aber nicht finden
  rationale: מצא bedeutet im Kontext, die Gesuchten zu finden. Das ausgelassene Subjekt und Objekt sind im Deutschen aus dem parallelen Satz eindeutig und vermeiden unnötige Wiederholung.
- source_word: וְאָמְרָה
  choice: Dann wird sie sagen
  rationale: „Dann“ macht die zeitliche und folgerichtige Abfolge nach der erfolglosen Suche deutlich, ohne eine stärkere Kausalität in den Text einzutragen.
- source_word: אֵלְכָה וְאָשׁוּבָה
  choice: Ich will gehen und … zurückkehren
  rationale: Die Formen drücken einen Entschluss aus. Die Übersetzung bewahrt beide Verben; die deutsche Satzstellung verbindet sie natürlich.
- source_word: אֶל אִישִׁי הָרִאשׁוֹן
  choice: zu meinem ersten Mann
  rationale: אִישִׁי bezeichnet im Ehekontext „meinen Mann“. „Mein erster Mann“ bleibt nahe an הָרִאשׁוֹן und klingt im modernen Deutschen natürlicher als „mein erster Ehemann“.
- source_word: כִּי טוֹב לִי אָז מֵעָתָּה
  choice: denn damals ging es mir besser als jetzt
  rationale: Diese idiomatische Formulierung erhält den ausdrücklichen zeitlichen Vergleich zwischen damals und jetzt.
theological_decisions:
- issue: Ehebild für Israels Untreue
  choice: Die Bezeichnungen „Liebhaber“ und „Mann“ bleiben im Haupttext erhalten.
  alternative: Die Bildsprache durch Deutungen wie „Verbündete“, „Versorger“ oder „fremde Götter“ ersetzen.
  rationale: Der hebräische Text spricht innerhalb von Hoseas Ehemetaphorik. Die möglichen religiösen und politischen Bezüge sollen nicht an die Stelle des eigentlichen Bildes treten.
- issue: Beweggrund für die Rückkehr
  choice: Die Rückkehr wird als Reaktion auf die bessere frühere Lage wiedergegeben.
  alternative: Eine ausdrückliche geistliche Umkehr oder Reue formulieren.
  rationale: Die Sprecherin sagt lediglich, dass es ihr damals besser ging. Der Vers selbst benennt weder Reue noch eine erneuerte Bundestreue; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Rhythmus. Der parallele Aufbau von Verfolgen/Nicht-Einholen und Suchen/Nicht-Finden bleibt sichtbar; die Ehemetaphorik wird weder abgeschwächt noch ausgedeutet.
