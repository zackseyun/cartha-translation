  yaml_path: translation/ot/hosea/002/008.yaml
  text: Therefore[a], behold, I am hedging up your way with thorns[c][b], and I will wall in her wall so that she will not find her paths.
translation:
  language: de
  text: Darum – sieh, ich versperre deinen Weg mit Dornen[a] und ziehe eine Mauer um sie[b], sodass sie ihre Pfade nicht findet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Dornengestrüpp“ beziehungsweise „mit Dornenhecken“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich ahmt die hebräische Wortverwandtschaft etwa nach: „Ich werde ihre Mauer mauern.“ Die knappe Wendung kann bedeuten, dass Gott eine Mauer als Hindernis um sie errichtet.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen wechselt die Rede von „deinen Weg“ zu „sie“ und „ihre Pfade“. Dieser rhetorische Wechsel wird beibehalten.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Anklage- und Gerichtszusammenhang in natürlichem, würdigem Deutsch.
- source_word: הִנְנִי
  choice: sieh, ich
  rationale: Bewahrt den nachdrücklichen, Aufmerksamkeit weckenden Charakter der hebräischen Ankündigungsformel, ohne unnötig altertümlich zu klingen.
- source_word: שָׂךְ
  choice: versperre
  rationale: Das Partizip bezeichnet die unmittelbar einsetzende Handlung des Einhegens oder Blockierens. In Verbindung mit Dornen gibt „versperre“ das Bild idiomatisch wieder.
- source_word: דַּרְכֵּךְ
  choice: deinen Weg
  rationale: Bewahrt Singular und Anrede in der zweiten Person Femininum sowie die mögliche wörtliche und übertragene Bedeutung von „Weg“.
- source_word: בַּסִּירִים
  choice: mit Dornen
  rationale: Bezeichnet dorniges Gewächs, das als Hindernis dient; „Dornen“ ist anschaulich und im Deutschen natürlich.
- source_word: וְגָדַרְתִּי אֶת גְּדֵרָהּ
  choice: und ummauere sie
  rationale: Die Verbindung aus dem Verb „eine Mauer errichten/einzäunen“ und dem verwandten Substantiv ist eine knappe figura etymologica. „Ummauere sie“ gibt die beabsichtigte Einschließung natürlich wieder; die formale Besonderheit wird in einer Fußnote ausgewiesen.
- source_word: וּנְתִיבוֹתֶיהָ
  choice: ihre Pfade
  rationale: Bewahrt Plural und dritte Person Femininum; „Pfade“ hält das Wegbild aufrecht.
- source_word: לֹא תִמְצָא
  choice: sodass sie … nicht findet
  rationale: Gibt die Ergebnisbeziehung der durch Gott errichteten Hindernisse in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wechsel der grammatischen Person
  choice: Den Wechsel von „deinen Weg“ zur dritten Person „sie/ihre Pfade“ bewahren.
  alternative: Alle Formen an die zweite Person („dich/deine Pfade“) oder an die dritte Person („ihren Weg“) angleichen.
  rationale: Der masoretische Text wechselt von direkter Anrede zur Rede über die Frau. Die Wiedergabe erhält diese prophetische rhetorische Bewegung, ohne sie interpretierend zu glätten.
- issue: Bild der göttlichen Behinderung
  choice: Die Bildsprache als konkretes Versperren und Ummauern wiedergeben.
  alternative: Abstrakt mit „ich werde sie hindern“ übersetzen.
  rationale: Dornen, Weg, Mauer und Pfade bilden ein zusammenhängendes räumliches Bild, das zugleich metaphorisch offen bleibt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. „Sieh“ wahrt den Nachdruck von הִנְנִי; „Darum“ und „sodass“ sorgen für einen natürlichen Satzfluss. Die ungewöhnliche hebräische figura etymologica wird im Haupttext verständlich und in der Fußnote transparent wiedergegeben.
