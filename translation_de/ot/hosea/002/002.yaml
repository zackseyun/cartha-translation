source:
  edition: WLC
  text: וְ֠/נִקְבְּצוּ בְּנֵֽי יְהוּדָ֤ה וּ/בְנֵֽי יִשְׂרָאֵל֙ יַחְדָּ֔ו וְ/שָׂמ֥וּ לָ/הֶ֛ם רֹ֥אשׁ אֶחָ֖ד וְ/עָל֣וּ מִן הָ/אָ֑רֶץ כִּ֥י גָד֖וֹל י֥וֹם יִזְרְעֶֽאל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/002.yaml
  text: Then the sons of Judah and the sons of Israel will be gathered together[a], and they will appoint for themselves one head, and they will go up from the land[c][b], for great will be the day of Jezreel.
translation:
  language: de
  text: Dann werden sich die Söhne Judas und die Söhne Israels miteinander versammeln, ein einziges Oberhaupt[a] über sich einsetzen und aus dem Land hinaufziehen[b]; denn groß ist der Tag Jesreels[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »ein Haupt«; gemeint sein kann ein gemeinsamer Anführer. Der Text sagt nicht, wer dieses Haupt ist.
    reason: lexical_alternative
  - marker: b
    text: »Aus dem Land hinaufziehen« kann auf die Rückkehr aus der Verbannung oder auf ein gemeinsames Hinaufziehen im Zuge der Wiederherstellung anspielen; die genaue Bedeutung bleibt im Hebräischen offen.
    reason: alternative_reading
  - marker: c
    text: Jesreel ist ein Ortsname und zugleich ein in Hosea bedeutungsvoller Name, der an Säen und Zerstreuen anklingt.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִקְבְּצוּ
  choice: werden sich … versammeln
  rationale: Das Nifal von קבץ kann ein Zusammenkommen beziehungsweise Gesammeltwerden ausdrücken. Die reflexive deutsche Form ist natürlich und lässt die gemeinschaftliche Sammlung erkennen.
- source_word: בְּנֵי יְהוּדָה וּבְנֵי יִשְׂרָאֵל
  choice: die Söhne Judas und die Söhne Israels
  rationale: Die wörtliche Wiedergabe bewahrt die parallele hebräische Bezeichnung beider Gruppen und ihre Symmetrie.
- source_word: יַחְדָּו
  choice: miteinander
  rationale: Das Adverb bezeichnet ihr vereintes Zusammenkommen; »miteinander« vermeidet im Deutschen die schwerfällige Folge »zusammen versammeln«.
- source_word: וְשָׂמוּ לָהֶם רֹאשׁ אֶחָד
  choice: Sie werden sich ein einziges Haupt einsetzen
  rationale: שׂים mit ל bezeichnet hier das Einsetzen beziehungsweise Bestimmen; רֹאשׁ wird als Metapher »Haupt« bewahrt, ohne die Gestalt näher als König oder messianischen Herrscher festzulegen.
- source_word: וְעָלוּ מִן הָאָרֶץ
  choice: und aus dem Land hinaufziehen
  rationale: עלה bewahrt die gerichtete Bewegung nach oben; אֶרֶץ wird kontextgemäß als »Land« wiedergegeben. Die Formulierung lässt Ziel und geschichtliche Situation offen.
- source_word: כִּי גָדוֹל יוֹם יִזְרְעֶאל
  choice: denn groß ist der Tag Jesreels
  rationale: »Denn« gibt die begründende Funktion von כִּי wieder. Die Voranstellung von »groß« erhält die emphatische, prophetische Wortstellung.
- source_word: יִזְרְעֶאל
  choice: Jesreel
  rationale: Der Eigenname bleibt erhalten; seine Anklänge an Säen und Zerstreuen werden nicht interpretierend in den Haupttext eingebaut.
theological_decisions:
- issue: Bedeutung des »einen Hauptes« bei der Vereinigung Judas und Israels
  choice: Die Metapher »ein einziges Haupt« bleibt stehen, ohne die Person zu identifizieren.
  alternative: ein König; ein Anführer; ausdrücklich ein messianischer Herrscher
  rationale: Der hebräische Vers spricht von geeinter Führung, benennt aber weder Amt noch Identität dieses Hauptes. Die offene Form wahrt die theologische Spannung.
- issue: Sinn von »aus dem Land hinaufziehen«
  choice: Die räumliche Aussage wird ohne Angabe von Ausgangsland, Ziel oder Ereignis übersetzt.
  alternative: aus dem Exil heraufziehen; in das verheißene Land hinaufziehen; zum Kampf ausrücken
  rationale: Die Wendung kann eine Wiederherstellung nach dem Exil, einen neuen Exodus oder anderes gemeinsames Hinaufziehen anklingen lassen. Der Vers selbst legt die genaue Nuance nicht eindeutig fest.
- issue: Bedeutungsgehalt des Namens Jesreel
  choice: Der Eigenname steht unverändert im Haupttext; seine Wortspiel- und Erinnerungsebenen werden in einer Fußnote genannt.
  alternative: Den Namen im Haupttext deutend mit »Gott sät« wiedergeben.
  rationale: Jesreel bezeichnet einen Ort und ist zugleich ein theologisch aufgeladener Name. Eine Übersetzung im Haupttext würde den Eigennamen und seine Mehrdeutigkeit verengen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst bewahrten hebräischen Bildern. »Söhne Judas/Israels« und »Haupt« sind formal nahe am Ausgangstext; Satzbau und Verbwahl bleiben zugleich gut verständlich. Die Fußnotenmarker stehen in der sachlich passenden Reihenfolge direkt bei »Haupt«, »Land« und »Jesreel«.
