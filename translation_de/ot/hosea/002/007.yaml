  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י זָֽנְתָה֙ אִמָּ֔/ם הֹבִ֖ישָׁה הֽוֹרָתָ֑/ם כִּ֣י אָמְרָ֗ה אֵלְכָ֞ה אַחֲרֵ֤י מְאַהֲבַ/י֙ נֹתְנֵ֤י לַחְמִ/י֙ וּ/מֵימַ֔/י צַמְרִ֣/י וּ/פִשְׁתִּ֔/י שַׁמְנִ֖/י וְ/שִׁקּוּיָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/007.yaml
  text: For their mother has prostituted herself[a]; she who conceived them has acted shamefully. For she said, ‘I will go after my lovers, those who give me my bread and my water, my wool and my flax[d][c][b], my oil and my drink.’
translation:
  language: de
  text: 'Denn ihre Mutter hat sich prostituiert[a]; die mit ihnen schwanger wurde, hat schändlich gehandelt[b]. Denn sie sagte: »Ich will meinen Liebhabern nachlaufen, die mir mein Brot und mein Wasser geben, meine Wolle und meinen Flachs, mein Öl und meine Getränke[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und drastisch auch: »hat gehurt«; das Hebräische verwendet ausdrücklich sexuelle Bildsprache für den Bundesbruch.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »hat ihnen Schande bereitet«; möglicherweise: »hat sie beschämt«.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Oder: »meinen Trank« beziehungsweise »meinen Getränkevorrat«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנְתָה
  choice: hat sich prostituiert
  rationale: Bewahrt die ausdrückliche sexuelle Bildsprache des hebräischen Verbs und damit die prophetische Metapher für den Bundesbruch; »war untreu« wäre abschwächend.
- source_word: אִמָּם
  choice: ihre Mutter
  rationale: Gibt die Constructusverbindung mit dem Suffix der 3. Person Plural unmittelbar wieder.
- source_word: הֹבִישָׁה
  choice: hat schändlich gehandelt
  rationale: Der Hifil kann verursachte Schande oder schändliches Handeln bezeichnen; im Parallelismus mit den femininen Aussagen über die Mutter liegt ihr eigenes schändliches Verhalten nahe.
- source_word: הוֹרָתָם
  choice: die sie empfangen hat
  rationale: Bewahrt den verbalen Sinn von הרה und den poetischen Parallelismus zu »ihre Mutter«, ohne beide Ausdrücke gleichzumachen.
- source_word: אֵלְכָה אַחֲרֵי
  choice: ich will … nachlaufen
  rationale: Natürliches, bildkräftiges Deutsch für das entschlossene Hinterhergehen hinter den Liebhabern.
- source_word: מְאַהֲבַי
  choice: meine Liebhaber
  rationale: Bezeichnet im Ehebild die außerehelichen Partner und erhält die sexuelle und bundestheologische Spannung.
- source_word: נֹתְנֵי
  choice: die mir … geben
  rationale: Gibt das substantivisch gebrauchte Partizip als natürlichen deutschen Relativsatz wieder.
- source_word: לַחְמִי וּמֵימַי
  choice: mein Brot und mein Wasser
  rationale: Erhält die konkreten Grundnahrungsmittel des Ausgangstextes.
- source_word: צַמְרִי וּפִשְׁתִּי
  choice: meine Wolle und meinen Flachs
  rationale: »Flachs« bezeichnet wie das Hebräische den Rohstoff und ist weniger deutend als »Leinen«.
- source_word: שַׁמְנִי
  choice: mein Öl
  rationale: Entspricht dem unbestimmten hebräischen Ausdruck, ohne »Oliven-« ergänzend einzutragen.
- source_word: שִׁקּוּיָי
  choice: meine Getränke
  rationale: Die Form kann Trank, Getränke oder Getränkevorrat bezeichnen; der Plural passt zur hebräischen Suffixform und klingt in der Aufzählung natürlich.
theological_decisions:
- issue: Prophetisches Ehebild und Bundesuntreue
  choice: Die sexualisierte Metapher wird mit »hat sich prostituiert« und »Liebhabern« ausdrücklich beibehalten.
  alternative: 'Abschwächend: »ist untreu geworden« und »denen, die sie liebt«.'
  rationale: Hoseas Ehe- und Sexualbild stellt Israels Abwendung von Gott als ehelichen Bundesbruch dar. Eine ausdrückliche Wiedergabe wahrt die theologische Schärfe, ohne die Metapher durch eine Erklärung zu ersetzen.
- issue: Mehrdeutigkeit von הֹבִישָׁה
  choice: Das Verb beschreibt das schändliche Handeln der Mutter.
  alternative: 'Das Verb kann auch kausativ verstanden werden: »sie hat sie beschämt/ihnen Schande bereitet«.'
  rationale: Die feminine Singularform steht parallel zu den anderen Aussagen über die Mutter; dennoch bleibt die kausative Möglichkeit echt und wird deshalb in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete und anstößige Bildsprache des Hebräischen bleibt erhalten. »Empfangen« wird im heute noch verständlichen Sinn von »schwanger werden mit« verwendet und bewahrt den poetischen Parallelismus; die Güterliste folgt eng der hebräischen Reihenfolge.
