  source_fidelity: 'Die Wiedergabe folgt dem Hebräischen eng: Die Mutter handelt sexuell schändlich, die zweite Bezeichnung bleibt im Parallelismus erhalten, und die Liebhaber werden als Geber der aufgezählten Güter beschrieben. Die Formulierung „die sie empfangen hat“ ist im gegenwärtigen Deutsch jedoch mehrdeutig, da „empfangen“ überwiegend „willkommen heißen/erhalten“ bedeutet und nicht klar das Schwangerwerden bzw. Empfangen eines Kindes bezeichnet.'
  naturalness: „Hat sich prostituiert“, „meinen Liebhabern nachlaufen“ und die Güterliste sind modernes, verständliches Standarddeutsch. „Die mit ihnen schwanger wurde“ ist für die zweite poetische Bezeichnung klarer und idiomatischer als „die sie empfangen hat“.
  terminology: Die drastische Bildsprache von זנה und der Ausdruck „Liebhaber“ sind angemessen beibehalten. „Flachs“, „Öl“ und „Getränke“ geben die konkreten Versorgungsmittel sachgerecht wieder. Die Fußnotenalternative zu הובישה sollte als vollständiger deutscher Satz formuliert werden.
