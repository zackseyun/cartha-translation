  to: 'Denn ihre Mutter hat sich prostituiert[a]; die mit ihnen schwanger wurde, hat schändlich gehandelt[b]. Denn sie sagte: »Ich will meinen Liebhabern nachlaufen, die mir mein Brot und mein Wasser geben, meine Wolle und meinen Flachs, mein Öl und meine Getränke[c].«'
  rationale: 'Die Revision beseitigt ausschließlich eine im modernen Deutsch erhebliche Mehrdeutigkeit: „die mit ihnen schwanger wurde“ macht den Sinn von הרתם klar, ohne den poetischen Parallelismus zu „ihre Mutter“ einzuebnen. Die alternative Wiedergabe von הובישה wird grammatisch vervollständigt. Die übrige Wortwahl bleibt erhalten, da sie die Bildsprache, Syntax und Güterliste des hebräischen Textes zuverlässig wiedergibt.'
