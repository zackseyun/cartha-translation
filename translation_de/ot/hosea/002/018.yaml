id: HOS.2.18
reference: Hosea 2:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה תִּקְרְאִ֖י אִישִׁ֑/י וְ/לֹֽא תִקְרְאִי לִ֥/י ע֖וֹד בַּעְלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/018.yaml
  text: And in that day[a], declares Yahweh, you will call me ‘My husband,’ and you will no longer call me ‘My Baal.’
translation:
  language: de
  text: Und an jenem Tag – Ausspruch Jahwes – wirst du mich »mein Mann« nennen und mich nicht mehr »mein Baal«[a] nennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische baʿli kann »mein Herr«, »mein Gebieter« oder auch »mein Mann« bedeuten. Hier steht »mein Baal«, um das Wortspiel und die wahrscheinliche Anspielung auf den Baalskult zu bewahren.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: Und an jenem Tag
  rationale: Die hebräische Zukunftsformel leitet einen kommenden Zeitpunkt ein. Im Deutschen gibt »Und an jenem Tag« die prophetische Wendung natürlich wieder; das formelhafte וְהָיָה muss nicht eigens mit »es wird geschehen« ausgedrückt werden.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird in feierlichem, aber verständlichem Deutsch wiedergegeben. »Ausspruch« bewahrt stärker als ein schlichtes »spricht« den Charakter einer autoritativen Gottesrede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch den Titel »der HERR« ersetzt.
- source_word: תִּקְרְאִי
  choice: wirst du … nennen
  rationale: קרא bezeichnet hier das Anreden mit einer Bezeichnung. Die feminine Singularform richtet sich im Kontext an die als Frau dargestellte Gemeinschaft.
- source_word: אִישִׁי
  choice: mein Mann
  rationale: אִישׁ kann »Mann« bedeuten und bezeichnet mit dem Suffix im ehelichen Bild »mein Mann«. Diese Formulierung ist im Deutschen natürlicher als »mein Ehemann« und erhält zugleich die knappe Wortwahl.
- source_word: וְלֹא תִקְרְאִי לִי עוֹד
  choice: und mich nicht mehr … nennen
  rationale: Die deutsche Wortstellung gibt die Verneinung mit עוֹד idiomatisch als »nicht mehr« wieder und bewahrt den entschiedenen Abbruch der bisherigen Anrede.
- source_word: בַּעְלִי
  choice: mein Baal
  rationale: בַּעְלִי kann »mein Herr«, »mein Gebieter« oder im ehelichen Zusammenhang auch »mein Mann« heißen. »Mein Baal« erhält hier das Wortspiel und die wahrscheinliche Anspielung auf den Baalskult.
theological_decisions:
- issue: Ob בַּעְלִי nach seiner allgemeinen Bedeutung oder als Anspielung auf Baal wiederzugeben ist
  choice: mein Baal
  alternative: mein Herr / mein Gebieter / mein Mann
  rationale: Der Zusammenhang in Hosea verbindet das Ehebild mit der Abkehr vom Baalskult. »Mein Baal« bewahrt diese Spannung und das hebräische Wortspiel, während die Fußnote die tatsächlich möglichen Bedeutungen offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche markieren die eingeschobene prophetische Formel; die Anführungszeichen verdeutlichen die beiden gegensätzlichen Anreden.
