  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְֽ֠/הָיָה מִסְפַּ֤ר בְּנֵֽי יִשְׂרָאֵל֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹֽא יִמַּ֖ד וְ/לֹ֣א יִסָּפֵ֑ר וְֽ֠/הָיָה בִּ/מְק֞וֹם אֲשֶׁר יֵאָמֵ֤ר לָ/הֶם֙ לֹֽא עַמִּ֣/י אַתֶּ֔ם יֵאָמֵ֥ר לָ/הֶ֖ם בְּנֵ֥י אֵֽל חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/001.yaml
  text: Yet the number of the sons of Israel will be like the sand of the sea[a], which cannot be measured or counted; and in the place where it is said to them, “You are not my people,” it will be said to them, “Sons of the living God.”
translation:
  language: de
  text: 'Doch die Zahl der Söhne Israels[a] wird wie der Sand am Meer sein, der sich weder messen noch zählen lässt. Und an dem Ort, an dem zu ihnen gesagt wird: »Ihr seid nicht mein Volk«, wird zu ihnen gesagt werden: »Söhne des lebendigen Gottes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Kinder Israels« und »Kinder des lebendigen Gottes«. Im Hebräischen steht in beiden Wendungen »Söhne«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Doch ... wird ... sein
  rationale: Das einleitende Waw markiert im Zusammenhang die scharfe Wende vom Gericht zur Wiederherstellung; »Doch« gibt diesen Gegensatz wieder, während das Futur den Verheißungscharakter wahrt.
- source_word: מִסְפַּר
  choice: die Zahl
  rationale: Die schlichte nominale Bedeutung bleibt erhalten und verbindet sich unmittelbar mit dem folgenden Bild der Unermesslichkeit.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: »Söhne« bildet das maskuline בְּנֵי genau ab und bewahrt die sprachliche Entsprechung zu בְּנֵי אֵל חָי am Versende.
- source_word: כְּחוֹל הַיָּם
  choice: wie der Sand am Meer
  rationale: Die geläufige deutsche Wendung gibt das hebräische Bild der unzählbaren Menge natürlich wieder und lässt den Anklang an die Verheißungssprache bestehen.
- source_word: אֲשֶׁר לֹא יִמַּד וְלֹא יִסָּפֵר
  choice: der sich weder messen noch zählen lässt
  rationale: Die beiden passiven Verbformen bezeichnen hier praktische Unmöglichkeit. Die deutsche Konstruktion bewahrt beide Verben und klingt idiomatisch.
- source_word: בִּמְקוֹם
  choice: an dem Ort
  rationale: Die konkrete Ortsangabe wird beibehalten und nicht zu einem bloßen »wo« verkürzt.
- source_word: יֵאָמֵר ... יֵאָמֵר
  choice: gesagt wird ... gesagt werden
  rationale: Die unpersönlichen Passivformen des Hebräischen bleiben erhalten, sodass kein bestimmter Sprecher ergänzt wird.
- source_word: לֹא עַמִּי אַתֶּם
  choice: Ihr seid nicht mein Volk
  rationale: Diese natürliche deutsche Formulierung bewahrt die Bundesformel und die Bedeutung von עַם als »Volk«.
- source_word: בְּנֵי אֵל חָי
  choice: Söhne des lebendigen Gottes
  rationale: »Söhne« erhält die maskuline Form und den Parallelismus zu »Söhne Israels«; »lebendiger Gott« ist die sachgemäße und etablierte Wiedergabe von אֵל חָי.
theological_decisions:
- issue: Geschlechtsspezifische Sohnessprache in der Wiederherstellungszusage
  choice: »Söhne« sowohl in »Söhne Israels« als auch in »Söhne des lebendigen Gottes«
  alternative: »Kinder Israels« und »Kinder des lebendigen Gottes«
  rationale: Das Hebräische verwendet an beiden Stellen das maskuline Pluralwort בְּנֵי. Die gewählte Fassung bewahrt sowohl die Form als auch den inneren Parallelismus, ohne die mögliche inklusive Reichweite zu leugnen; diese wird in der Fußnote kenntlich gemacht.
- issue: Diskursfunktion des einleitenden Waw
  choice: »Doch«
  alternative: »Und« oder »Nun«
  rationale: Der unmittelbare Zusammenhang wechselt vom Gerichtswort »Nicht mein Volk« zur Verheißung von Vermehrung und erneuerter Zugehörigkeit. »Doch« macht diese rhetorische Umkehr sichtbar, ohne zusätzliche theologische Aussagen einzutragen.
- issue: Unbestimmter Sprecher der beiden Zusagen
  choice: Passiv ohne Benennung des Sprechers
  alternative: »man sagt ... man wird sagen« oder ausdrückliche Benennung Gottes
  rationale: Die hebräischen Formen nennen keinen Sprecher. Das Passiv wahrt diese Offenheit und vermeidet eine interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Parallelismus, wird aber durch idiomatische Wendungen wie »Sand am Meer« und »sich weder messen noch zählen lässt« flüssig lesbar. Die direkte Rede ist mit deutschen Anführungszeichen gesetzt.
