  source_fidelity: 'Die Übersetzung gibt die hebräische Syntax und Bildsprache zuverlässig wieder: Die adversative Wende durch »Doch«, die Zahlformulierung, der Vergleich mit dem unzählbaren Sand, beide unterschiedlichen Verben »messen« und »zählen«, die Ortsangabe sowie die unpersönlichen Passivformen sind sachgerecht abgebildet. »Söhne« bewahrt die zweimalige Form בְּנֵי und den Parallelismus. Die zeitliche Differenzierung »gesagt wird« / »gesagt werden« folgt vertretbar der im englischen Audit belegten kontextuellen Lesart und ergänzt keinen Sprecher.'
