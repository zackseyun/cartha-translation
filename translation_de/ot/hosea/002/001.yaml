  terminology: Die Bundesformel »Ihr seid nicht mein Volk« ist präzise. »Söhne Israels« sowie »Söhne des lebendigen Gottes« sind quellentreu und terminologisch konsequent. Die Fußnote bietet die mögliche deutsche Alternative »Kinder« transparent an, ohne den Haupttext zu neutralisieren.
