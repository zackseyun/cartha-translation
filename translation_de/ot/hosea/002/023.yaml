  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא אֶֽעֱנֶה֙ נְאֻם יְהוָ֔ה אֶעֱנֶ֖ה אֶת הַ/שָּׁמָ֑יִם וְ/הֵ֖ם יַעֲנ֥וּ אֶת הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/023.yaml
  text: And it shall happen in that day[a], declares Yahweh, that I will answer the heavens, and they shall answer the earth.
translation:
  language: de
  text: 'Und es wird geschehen an jenem Tag, spricht Jahwe: Ich werde den Himmeln antworten, und sie werden der Erde[a] antworten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Land“. Das hebräische Wort אֶרֶץ kann sowohl „Erde“ als auch „Land“ bedeuten; „Erde“ bewahrt hier die poetische Gegenüberstellung mit den Himmeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … wird es geschehen
  rationale: Die Form leitet eine zukünftige prophetische Szene ein. „Wird es geschehen“ ist im modernen Deutsch verständlich und bewahrt zugleich den feierlichen Formelcharakter.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Dies gibt die geläufige prophetische Zeitangabe natürlich und würdevoll wieder.
- source_word: אֶעֱנֶה / יַעֲנוּ
  choice: werde … antworten / werden … antworten
  rationale: Die Wiederholung von „antworten“ erhält die bewusste Wortwiederholung, die Personifikation und die Kette der Reaktionen, ohne das Bild vorschnell als Regen oder Fruchtbarkeit auszudeuten.
- source_word: נְאֻם יְהוָה
  choice: so lautet der Ausspruch Jahwes
  rationale: „Ausspruch“ entspricht der prophetischen Botenformel und trägt deren Gewicht; die vollständige Wendung fügt sich zugleich natürlich in den deutschen Satz ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת הַשָּׁמַיִם
  choice: den Himmeln
  rationale: Der Plural bewahrt die Form und die erhabene kosmische Bildsprache des Hebräischen besser als das singularische „dem Himmel“.
- source_word: וְהֵם יַעֲנוּ
  choice: und sie werden … antworten
  rationale: Das Pronomen greift den Plural „Himmel“ auf und erhält Parallelismus sowie Personifikation.
- source_word: אֶת הָאָרֶץ
  choice: der Erde
  rationale: „Erde“ wahrt die poetische Gegenüberstellung von Himmel und Erde. „Land“ bleibt aufgrund des Bedeutungsumfangs von אֶרֶץ eine mögliche Lesart und wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung der wiederholten Antwort-Bildsprache
  choice: Die dreifache Sprache des Antwortens als poetische Reaktionskette bewahren
  alternative: Ausdeutend mit „Regen senden“ oder „Fruchtbarkeit schenken“ wiedergeben
  rationale: Das Hebräische wiederholt ענה rhetorisch. Eine ausdeutende Übersetzung würde die landwirtschaftliche Folge erklären, aber die offene Metapher und ihre theologische Spannung voreilig festlegen.
- issue: Bedeutung von אֶרֶץ
  choice: Erde
  alternative: Land
  rationale: Die unmittelbare Verbindung mit den Himmeln legt die kosmisch-poetische Paarung „Himmel und Erde“ nahe; im weiteren landwirtschaftlichen Zusammenhang ist „Land“ jedoch ebenfalls möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Klang. Der Plural „Himmel“ ist bewusst beibehalten; die wiederholte Formulierung „antworten“ wahrt Parallelismus und Mehrdeutigkeit des Bildes.
