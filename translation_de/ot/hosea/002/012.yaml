source:
  edition: WLC
  text: וְ/עַתָּ֛ה אֲגַלֶּ֥ה אֶת נַבְלֻתָ֖/הּ לְ/עֵינֵ֣י מְאַהֲבֶ֑י/הָ וְ/אִ֖ישׁ לֹֽא יַצִּילֶ֥/נָּה מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/012.yaml
  text: And now I will uncover her nakedness before the eyes of her lovers, and no man will rescue her from my hand.
translation:
  language: de
  text: Und nun werde ich ihre Blöße vor den Augen ihrer Liebhaber aufdecken, und kein Mann wird sie aus meiner Hand retten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַבְלֻתָהּ
  choice: ihre Blöße
  rationale: Das seltene Substantiv bezeichnet hier im Bild der untreuen Frau ihre schändlich entblößte Nacktheit. „Blöße“ bewahrt sowohl den körperlichen als auch den beschämenden Aspekt.
- source_word: מְאַהֲבֶיהָ
  choice: ihre Liebhaber
  rationale: Das Wort bezeichnet ihre männlichen Geliebten und passt zur durchgehenden Ehebruchsmetaphorik des Abschnitts.
- source_word: וְאִישׁ לֹא
  choice: und kein Mann
  rationale: Die Wiedergabe folgt der ausdrücklichen maskulinen Personenbezeichnung אִישׁ und hält zugleich den Bezug zu den genannten Liebhabern hörbar.
- source_word: יַצִּילֶנָּה מִיָּדִי
  choice: wird sie aus meiner Hand retten
  rationale: Die feste Wendung mit נצל und מיד bezeichnet die Rettung aus der Gewalt oder Verfügungsgewalt eines anderen; die deutsche Formulierung bildet das Hand-Motiv unmittelbar ab.
theological_decisions:
- issue: Gericht als öffentliche Entblößung
  choice: Die drastische Bildsprache wird unverhüllt beibehalten.
  alternative: 'Abschwächend: „ihre Schande offenbar machen“'
  rationale: Der hebräische Text verbindet körperliche Entblößung und öffentliche Beschämung. Eine rein abstrakte Wiedergabe würde die Härte des prophetischen Gerichtsbildes mindern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Direktheit. Die Satzstruktur folgt dem hebräischen Parallelismus, ohne im Deutschen unnatürlich zu wirken.
