source:
  edition: WLC
  text: וְ/אֵרַשְׂתִּ֥י/ךְ לִ֖/י לְ/עוֹלָ֑ם וְ/אֵרַשְׂתִּ֥י/ךְ לִ/י֙ בְּ/צֶ֣דֶק וּ/בְ/מִשְׁפָּ֔ט וּ/בְ/חֶ֖סֶד וּֽ/בְ/רַחֲמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/021.yaml
  text: And I will betroth you to myself forever; yes[a], I will betroth you to myself in righteousness and in justice, and in steadfast love and in compassion.
translation:
  language: de
  text: Und ich werde mich für immer mit dir verloben; ich werde mich mit dir verloben in Gerechtigkeit und Recht, in treuer Liebe[a] und Erbarmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Güte, bundestreue Liebe. Das hebräische Wort חֶסֶד bezeichnet eine verlässliche, loyale Liebe, die auch Güte und Erbarmen einschließt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵרַשְׂתִּיךְ
  choice: ich werde mich mit dir verloben
  rationale: Das Verb ארשׂ bezeichnet ausdrücklich die Verlobung. Die idiomatische deutsche Formulierung bewahrt das eheliche Bundesbild und gibt zugleich Gottes handelnde Initiative wieder.
- source_word: לִי
  choice: mit dir
  rationale: Wörtlich steht „mir/zu mir“. Zusammen mit „sich verloben“ verlangt modernes Deutsch die Konstruktion „sich mit jemandem verloben“; die persönliche Zuordnung bleibt erhalten.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die geläufige moderne Wiedergabe drückt die bleibende Dauer der angekündigten Verbindung aus.
- source_word: בְּצֶדֶק
  choice: in Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt den moralischen und gemeinschaftsbezogenen Gehalt von צֶדֶק sowie die präpositionale Reihung des Hebräischen.
- source_word: וּבְמִשְׁפָּט
  choice: und Recht
  rationale: מִשְׁפָּט bezeichnet hier Recht beziehungsweise gerechte Ordnung, nicht vorrangig ein Strafgericht. „Gerechtigkeit und Recht“ gibt das hebräische Begriffspaar knapp wieder.
- source_word: וּבְחֶסֶד
  choice: in treuer Liebe
  rationale: חֶסֶד verbindet liebevolle Zuwendung mit Verlässlichkeit und Loyalität. „Treue Liebe“ ist verständlich, natürlich und lässt den Bundeskontext erkennen, ohne ihn ausdrücklich in den Text einzutragen.
- source_word: וּבְרַחֲמִים
  choice: und Erbarmen
  rationale: Das formal pluralische רַחֲמִים wird häufig als Abstraktum gebraucht. „Erbarmen“ gibt die mitfühlende Zuwendung in würdigem, gegenwärtigem Deutsch wieder.
theological_decisions:
- issue: Eheliches Bild der Wiederherstellung
  choice: Die Verlobungssprache wird ausdrücklich beibehalten.
  alternative: „Ich werde dich heiraten“ oder „Ich werde dich zu meinem Eigentum machen“
  rationale: Das prophetische Bild beruht auf dem spezifischen Vorgang der Verlobung. Eine Verallgemeinerung zur Ehe oder Zugehörigkeit würde die Bildschärfe und die darin liegende Bundesbeziehung abschwächen.
- issue: Wiedergabe von חֶסֶד
  choice: „treue Liebe“ im Haupttext
  alternative: „Bundesliebe“, „Güte“ oder „Gnade“
  rationale: Der Ausdruck umfasst Liebe, Loyalität, Güte und Erbarmen. „Treue Liebe“ bewahrt diese Bedeutungsbreite besser als eine konfessionell oder fachsprachlich enger wirkende Festlegung; die Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Verlobungsformel und die Reihung „in Gerechtigkeit und Recht, in treuer Liebe und Erbarmen“ bewahren bewusst Struktur und feierlichen Rhythmus des Hebräischen. Das im Englischen ergänzte „yes“ hat im hebräischen Text keine Entsprechung und wurde daher nicht übernommen.
