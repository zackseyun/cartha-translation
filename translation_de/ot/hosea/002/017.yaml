id: HOS.2.17
reference: Hosea 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָתַ֨תִּי לָ֤/הּ אֶת כְּרָמֶ֨י/הָ֙ מִ/שָּׁ֔ם וְ/אֶת עֵ֥מֶק עָכ֖וֹר לְ/פֶ֣תַח תִּקְוָ֑ה וְ/עָ֤נְתָה שָּׁ֨מָּ/ה֙ כִּ/ימֵ֣י נְעוּרֶ֔י/הָ וִּ/כְ/י֖וֹם עֲלֹתָ֥/הּ מֵ/אֶֽרֶץ מִצְרָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/017.yaml
  text: And from there I will give her her vineyards[a], and the Valley of Achor as a door of hope. There she will answer as in the days of her youth[b], as on the day when she came up from the land of Egypt.
translation:
  language: de
  text: Und von dort aus werde ich ihr ihre Weinberge geben und das Tal Achor[b] als Tor der Hoffnung. Dort wird sie antworten[a] wie in den Tagen ihrer Jugend, wie an dem Tag, als sie aus dem Land Ägypten heraufzog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie wird dort singen“. Das hebräische Verb kann eine Antwort oder Erwiderung bezeichnen und im Zusammenhang auch ein Singen anklingen lassen.'
    reason: lexical_alternative
  - marker: b
    text: Das Tal Achor erinnert an den Ort, der mit Achans Gericht verbunden ist (Josua 7,24–26). So wird ein Ort des Unheils zu einem Tor der Hoffnung.
    reason: cross_reference
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und … werde ich … geben
  rationale: Das Qal-Perfekt mit וְ hat im prophetischen Verheißungszusammenhang futurische Bedeutung; „geben“ entspricht der Grundbedeutung von נתן.
- source_word: כְּרָמֶיהָ
  choice: ihre Weinberge
  rationale: כֶּרֶם bezeichnet gewöhnlich einen Weinberg; der Plural mit Suffix der 3. Person Singular feminin bezieht sich auf die als Frau dargestellte Israel.
- source_word: מִשָּׁם
  choice: von dort aus
  rationale: Die räumliche Rückbindung an den vorangehenden Wüsten- und Wiederherstellungskontext bleibt ausdrücklich erhalten.
- source_word: עֵמֶק עָכוֹר
  choice: das Tal Achor
  rationale: Der Ortsname wird transliteriert und die Anspielung auf Josua 7 bewahrt.
- source_word: לְפֶתַח תִּקְוָה
  choice: als Tor der Hoffnung
  rationale: פֶּתַח bedeutet Öffnung, Eingang oder Tor; „Tor der Hoffnung“ gibt die Metapher knapp und idiomatisch wieder. לְ bezeichnet hier Funktion beziehungsweise Bestimmung.
- source_word: וְעָנְתָה
  choice: sie wird antworten
  rationale: Die Grundbedeutung des Qal ist „antworten, erwidern“. Ein Singen kann im Kontext mitschwingen, wird aber vom Verb nicht eindeutig verlangt.
- source_word: שָׁמָּה
  choice: Dort
  rationale: Das Ortsadverb markiert ausdrücklich den Ort der erneuerten Reaktion.
- source_word: כִּימֵי נְעוּרֶיהָ
  choice: wie in den Tagen ihrer Jugend
  rationale: Die vergleichende Wendung bleibt nah am Hebräischen und ist im Deutschen natürlich.
- source_word: וּכְיוֹם עֲלֹתָהּ מֵאֶרֶץ מִצְרָיִם
  choice: wie an dem Tag, als sie aus dem Land Ägypten heraufzog
  rationale: עלה mit מן bezeichnet das Heraufziehen aus Ägypten; die hebräische Exodus-Bildsprache bleibt erhalten.
theological_decisions:
- issue: Bedeutung von וְעָנְתָה im Wiederherstellungskontext
  choice: im Haupttext mit „sie wird antworten“ wiedergegeben
  alternative: „sie wird singen“ beziehungsweise „sie wird im Wechselgesang antworten“
  rationale: „Antworten/Erwidern“ bewahrt die lexikalische Grundbedeutung. Der Zusammenhang kann freudiges oder responsorisches Singen nahelegen, legt diese engere Deutung jedoch nicht zwingend fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Bildsprache für Israel und die räumlichen Bezüge des Hebräischen bleiben erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken; ihre Position wurde nach ihrem tatsächlichen Inhalt ausgerichtet.
