  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן הִנֵּ֤ה אָֽנֹכִי֙ מְפַתֶּ֔י/הָ וְ/הֹֽלַכְתִּ֖י/הָ הַ/מִּדְבָּ֑ר וְ/דִבַּרְתִּ֖י עַל לִבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/016.yaml
  text: Therefore[a], behold, I am going to allure her, and I will lead her into the wilderness and speak to her heart.
translation:
  language: de
  text: 'Darum, siehe: Ich werde sie locken und sie in die Wüste führen und zu ihrem Herzen reden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu ihrem Herzen reden“; gemeint sein kann auch: „freundlich“ oder „tröstend zu ihr reden“.'
    reason: Die hebräische Wendung bezeichnet ein persönliches, gewinnendes oder tröstendes Reden, ohne den Ton auf nur eine Nuance festzulegen.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die folgernde, zugleich überraschende Wende vom vorausgehenden Gericht zur Wiederherstellung. „Darum“ bewahrt diese rhetorische Kraft in natürlichem Deutsch.
- source_word: הִנֵּה
  choice: siehe
  rationale: Bewahrt den aufmerksamkeitslenkenden und prophetisch hervorgehobenen Charakter des hebräischen Ausdrucks.
- source_word: אָנֹכִי
  choice: Ich
  rationale: Das selbstständige Personalpronomen hebt den göttlichen Sprecher hervor. Die deutsche Satzstellung nach „siehe“ trägt die Betonung, ohne das möglicherweise überbetonte „ich selbst“ zu erfordern.
- source_word: מְפַתֶּיהָ
  choice: werde sie locken
  rationale: פתה bezeichnet hier im Bild der wiederhergestellten Ehe ein gewinnendes, werbendes Heranziehen. „Locken“ erhält die persuasive und emotionale Spannung, ohne sie eindeutig als Täuschung oder Verführung festzulegen. Die Konstruktion הִנֵּה אָנֹכִי mit Partizip wird als bevorstehendes, entschlossenes Handeln wiedergegeben.
- source_word: וְהֹלַכְתִּיהָ
  choice: und sie in die Wüste führen
  rationale: Die Kausativform von הלך bedeutet „gehen lassen/führen“. „Führen“ bringt die absichtsvolle Leitung zum Ausdruck und passt zum Motiv der Wüste.
- source_word: הַמִּדְבָּר
  choice: die Wüste
  rationale: „Wüste“ ist die geläufige deutsche Bezeichnung für den biblischen Ort der früheren Gottesbegegnung Israels und bewahrt sowohl die geografische als auch die theologische Resonanz.
- source_word: וְדִבַּרְתִּי עַל לִבָּהּ
  choice: und zu ihrem Herzen reden
  rationale: Die bewusst nahe Wiedergabe erhält das hebräische Herzbild und lässt offen, ob vor allem tröstendes, liebevolles oder eindringlich gewinnendes Reden gemeint ist.
theological_decisions:
- issue: Beziehungston von פתה im Bild der ehelichen Wiederherstellung
  choice: sie locken
  alternative: sie überreden / sie umwerben / sie verführen
  rationale: Der Zusammenhang beschreibt nach dem Gericht eine erneute, gnädige Hinwendung. „Locken“ bewahrt den werbenden und gewinnenden Sinn, ohne Zwang, sittlich negative Verführung oder eine zu eng romantische Deutung einzutragen.
- issue: Bedeutungsumfang von עַל לִבָּהּ
  choice: zu ihrem Herzen reden
  alternative: freundlich / tröstend zu ihr reden
  rationale: Die wörtlichere Form bewahrt die Metapher und ihre Mehrdeutigkeit. Eine ausschließlich zärtliche oder tröstende Wiedergabe würde den möglichen Sinn eindringlichen Zuspruchs vorschnell festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener prophetischer Signalformel „siehe“. Die dreifache Handlungsfolge bleibt klar und flüssig; die Herzmetapher wird zur Wahrung der poetischen und theologischen Offenheit erhalten.
