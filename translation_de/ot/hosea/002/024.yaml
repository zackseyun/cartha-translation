source:
  edition: WLC
  text: וְ/הָ/אָ֣רֶץ תַּעֲנֶ֔ה אֶת הַ/דָּגָ֖ן וְ/אֶת הַ/תִּיר֣וֹשׁ וְ/אֶת הַ/יִּצְהָ֑ר וְ/הֵ֖ם יַעֲנ֥וּ אֶֽת יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/024.yaml
  text: and the earth will answer the grain[a], the new wine, and the oil, and they will answer Jezreel.
translation:
  language: de
  text: Und die Erde wird dem Getreide, dem jungen Wein und dem Öl antworten, und sie werden Jesreel[a] antworten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Jesreel bedeutet im Hebräischen „Gott sät“ und dient bei Hosea sowohl als Orts- beziehungsweise Personenname als auch als symbolischer Name.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: und die Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Die Abfolge Himmel → Erde → Erzeugnisse spricht hier für „Erde“ und bewahrt die poetische Kette.
- source_word: תַּעֲנֶה / יַעֲנוּ
  choice: wird antworten / werden antworten
  rationale: Die Wiederholung von ענה gestaltet eine personifizierte Antwortkette. „Antworten“ erhält dieses Leitwort, auch wenn die Formulierung bewusst poetisch bleibt.
- source_word: הַדָּגָן
  choice: dem Getreide
  rationale: דָּגָן bezeichnet Getreide beziehungsweise Körnerfrucht allgemein; „Getreide“ ist die natürliche moderne deutsche Entsprechung.
- source_word: הַתִּירוֹשׁ
  choice: dem jungen Wein
  rationale: תִּירוֹשׁ bezeichnet meist jungen beziehungsweise neuen Wein als landwirtschaftliches Erzeugnis. „Junger Wein“ ist im heutigen Deutsch klar und idiomatisch.
- source_word: הַיִּצְהָר
  choice: dem Öl
  rationale: יִצְהָר bezeichnet Öl als landwirtschaftliches Erzeugnis, gewöhnlich Olivenöl. „Öl“ vermeidet eine im Ausgangstext nicht ausdrücklich formulierte Präzisierung.
- source_word: וְהֵם
  choice: und sie
  rationale: Das Pronomen nimmt die drei zuvor genannten Erzeugnisse gemeinsam auf und setzt ihre Personifizierung fort.
- source_word: יִזְרְעֶאל
  choice: Jesreel
  rationale: Der Eigenname wird in seiner etablierten deutschen Form wiedergegeben; sein in Hosea bedeutsames Wortspiel wird in einer Fußnote erklärt.
theological_decisions:
- issue: Die wiederholte personifizierte Antwortsprache bewahren oder als bloße Versorgung umschreiben
  choice: Die Wiederholung von „antworten“ bewahren
  alternative: Die Erde bringt Getreide, jungen Wein und Öl hervor, und sie versorgen Jesreel
  rationale: Der Zusammenhang entfaltet eine absichtliche Antwortkette von Gott über Himmel und Erde bis zu den Erzeugnissen und Jesreel. Eine kausale Umschreibung würde diese poetische und theologische Spannung einebnen.
- issue: Den Symbolgehalt des Namens Jesreel im Haupttext ausdrücken
  choice: Jesreel als Namen beibehalten und die Bedeutung in einer Fußnote erläutern
  alternative: Gott sät
  rationale: Der hebräische Text verwendet den Eigennamen und lässt zugleich seine symbolische Bedeutung anklingen. Beides bleibt erhalten, wenn der Name im Text steht und das Wortspiel erläutert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Verbindung mit „antworten“ bleibt bewusst erhalten, weil sie die poetische Kette des hebräischen Zusammenhangs trägt. Die Dativkonstruktion bildet אֶת bei diesem Verb im Deutschen idiomatisch ab.
