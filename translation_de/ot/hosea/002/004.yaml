  text: רִ֤יבוּ בְ/אִמְּ/כֶם֙ רִ֔יבוּ כִּֽי הִיא֙ לֹ֣א אִשְׁתִּ֔/י וְ/אָנֹכִ֖י לֹ֣א אִישָׁ֑/הּ וְ/תָסֵ֤ר זְנוּנֶ֨י/הָ֙ מִ/פָּנֶ֔י/ה וְ/נַאֲפוּפֶ֖י/הָ מִ/בֵּ֥ין שָׁדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/004.yaml
  text: Contend with your mother[a], contend, for she is not my wife, and I am not her husband[b]; let her remove her prostitutions from her face and her adulteries from between her breasts.
translation:
  language: de
  text: Streitet mit eurer Mutter[a], streitet! Denn sie ist nicht meine Frau, und ich bin nicht ihr Mann. Sie soll ihre Hurereien von ihrem Gesicht und ihre Ehebrüche zwischen ihren Brüsten entfernen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Führt einen Rechtsstreit gegen eure Mutter“ beziehungsweise „Klagt eure Mutter an“. Das hebräische Verb ריב kann einen Streit oder eine rechtliche Auseinandersetzung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Hurereien“ und „Ehebrüche“ bezeichnen im Bild der Ehe sexuelle Untreue; bei Hosea stehen solche Ausdrücke zugleich für Israels Untreue gegenüber Gott durch Götzendienst.
    reason: cultural_note
lexical_decisions:
- source_word: רִיבוּ בְאִמְּכֶם
  choice: Streitet mit eurer Mutter
  rationale: Das wiederholte pluralische Imperativ רִיבוּ bezeichnet einen Streit und kann zugleich den Nachdruck einer rechtlichen Auseinandersetzung tragen. „Streitet mit“ bleibt nah an der Konstruktion mit בְּ und klingt im Deutschen natürlich; die mögliche Prozessbedeutung wird in der Fußnote genannt.
- source_word: כִּי הִיא לֹא אִשְׁתִּי וְאָנֹכִי לֹא אִישָׁהּ
  choice: Denn sie ist nicht meine Frau, und ich bin nicht ihr Mann
  rationale: אִשָּׁה und אִישׁ bezeichnen hier die eheliche Beziehung. Die geläufigen deutschen Begriffe bewahren das Ehe- und Bundesbild ohne interpretierende Ausweitung.
- source_word: וְתָסֵר
  choice: Sie soll ... entfernen ... und ... wegnehmen
  rationale: Die Form trägt hier auffordernden beziehungsweise jussivischen Sinn. „Sie soll“ gibt diesen Sinn idiomatisch wieder; die beiden deutschen Verben vermeiden eine schwerfällige Wiederholung, obwohl im Hebräischen ein Verb beide Objekte regiert.
- source_word: זְנוּנֶיהָ
  choice: ihre Hurerei
  rationale: זְנוּנִים ist eine intensive Bezeichnung für sexuelle Untreue und dient bei Hosea zugleich als Bild für den Bundesbruch durch Götzendienst. „Hurerei“ bewahrt die Härte und den metaphorischen Spielraum des Ausdrucks.
- source_word: מִפָּנֶיהָ
  choice: aus ihrem Gesicht
  rationale: Die konkrete Körperbildlichkeit von פָּנִים bleibt erhalten. Die Präposition מִן wird bei „entfernen“ im Deutschen natürlich mit „aus“ wiedergegeben.
- source_word: וְנַאֲפוּפֶיהָ
  choice: ihren Ehebruch
  rationale: Das seltene Intensivpluralwort bezeichnet ehebrecherische Handlungen. Der deutsche Kollektivsingular „Ehebruch“ ist natürlicher als „Ehebrüche“, ohne den Sinn abzuschwächen.
- source_word: מִבֵּין שָׁדֶיהָ
  choice: zwischen ihren Brüsten wegnehmen
  rationale: Die direkte körperliche Bildsprache wird bewahrt. „Brüste“ gibt שָׁדַיִם präzise und ohne Beschönigung wieder.
theological_decisions:
- issue: Ehemetapher für den Bundesbruch
  choice: Die wörtliche Sprache von Frau und Mann bleibt im Haupttext stehen.
  alternative: Die Aussage ausdrücklich als Israels Untreue gegenüber Gott paraphrasieren.
  rationale: Der hebräische Text entfaltet seine theologische Aussage durch das Ehebild. Eine ausdrückliche Deutung im Haupttext würde die Metapher vorzeitig auflösen.
- issue: Sexuell aufgeladene Untreuesprache
  choice: Die starken Begriffe „Hurerei“ und „Ehebruch“ werden beibehalten.
  alternative: Mit allgemeineren Begriffen wie „Untreue“ oder „Unmoral“ übersetzen.
  rationale: Hoseas Wortwahl verbindet reale sexuelle Untreue und götzendienerischen Bundesbruch. Eine Abschwächung würde die prophetische Schärfe und die gewollte Mehrdeutigkeit mindern.
- issue: Status der Ehebeziehung
  choice: „Sie ist nicht meine Frau, und ich bin nicht ihr Mann“ wird als zugespitzte Erklärung des Beziehungsbruchs wiedergegeben.
  alternative: Die Aussage ausdrücklich als endgültige Scheidung oder als bloße Drohung erklären.
  rationale: Der Vers benennt den Bruch, legt aber dessen rechtlichen und endgültigen Status nicht vollständig aus. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst harter prophetischer Wortwahl. Die Wiederholung „streitet“ erhält den Nachdruck des Hebräischen; die konkreten Körperbilder werden nicht geglättet. Alle Fußnotenmarker stehen im Haupttext.
