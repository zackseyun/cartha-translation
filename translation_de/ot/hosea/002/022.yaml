  source_fidelity: 'Der Entwurf gibt die beiden hebräischen Aussagen sachgerecht wieder: ארשׂ bezeichnet das Eingehen eines Verlöbnisses, בֶּאֱמוּנָה dessen Rahmen der Treue/Verlässlichkeit, und ידע bleibt ohne interpretierende Ausweitung als »erkennen« erhalten. »Jahwe« gibt יהוה angemessen wieder. Die Umstellung auf die im heutigen Deutschen übliche reflexive Konstruktion wahrt die Richtung der Verheißung (Gott verbindet sich mit Israel), ohne die Aussage zu verändern.'
  naturalness: »Dich mir verloben« ist biblisch-traditionell verständlich, wirkt im modernen Standarddeutsch jedoch deutlich archaisch und ist syntaktisch weniger idiomatisch. »Mich mit dir verloben« ist die natürliche deutsche Ausdrucksweise für denselben Verlöbnisvorgang.
  terminology: »Treue« ist für אֱמוּנָה im ehelich-bildhaften Kontext treffend. »Erkennen« bewahrt die im Hebräischen mögliche relationale Tiefe, ohne sie auf »anerkennen« oder eine intimierende Paraphrase festzulegen. Der Fußnotenhinweis erhält die lexikalische Spannweite; »im Glauben« wird ausdrücklich nur als formalere Möglichkeit gekennzeichnet.
