base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/022.yaml
  text: And I will betroth you to myself in faithfulness[a], and you shall know Yahweh.
translation:
  language: de
  text: Und ich werde mich mit dir in Treue[a] verloben, und du wirst Jahwe erkennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Verlässlichkeit«; formaler auch: »im Glauben«. Das hebräische Wort bezeichnet Verlässlichkeit und Treue, besonders innerhalb einer Bundesbeziehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵרַשְׂתִּיךְ
  choice: Und ich werde dich mir verloben
  rationale: Das Verb ארשׂ bezeichnet ausdrücklich die Verlobung. Die deutsche Wendung bewahrt das ehelich-bundhafte Bild und entspricht zusammen mit לִי natürlich dem Sinn »dich mit mir verloben«.
- source_word: לִי
  choice: mir
  rationale: Die Präposition mit Suffix bedeutet wörtlich »mir/für mich«. In der Verbindung »dich mir verloben« ist »mir« prägnant und idiomatisch.
- source_word: בֶּאֱמוּנָה
  choice: in Treue
  rationale: אֱמוּנָה bezeichnet hier im ehelich-bundhaften Zusammenhang Verlässlichkeit und Treue. »Treue« gibt diesen Beziehungsaspekt im modernen Deutschen klar wieder, ohne den Ausdruck auf subjektiven Glauben zu verengen.
- source_word: וְיָדַעַתְּ
  choice: und du wirst erkennen
  rationale: ידע bedeutet »kennen/erkennen« und besitzt hier eine relationale, bundhafte Tiefe. »Erkennen« wahrt diese Bedeutungsweite und die Zukunftsaussage, ohne sie erklärend auszuweiten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
theological_decisions:
- issue: Relationale Bedeutung von ידע im ehelich-bundhaften Zusammenhang
  choice: »erkennen« im Haupttext beibehalten
  alternative: »innig kennen« oder »anerkennen«
  rationale: Der Kontext verleiht dem Verb bereits relationale und bundhafte Tiefe. Eine Erweiterung würde die theologische Bedeutungsfülle stärker festlegen, als es der hebräische Wortlaut tut.
- issue: Träger der Treue in בֶּאֱמוּנָה
  choice: Die knappe Formulierung »in Treue« bewahren
  alternative: »in meiner Treue«
  rationale: Im Hebräischen steht kein ausdrückliches Possessivpronomen. Der Zusammenhang kann Gottes Treue nahelegen, doch der Haupttext soll die grammatische Offenheit nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zukunftsform wahrt die feierliche Verheißung; »Jahwe« gibt den Gottesnamen unmittelbar wieder. Der Fußnotenmarker [a] steht unmittelbar beim erläuterten Ausdruck.
