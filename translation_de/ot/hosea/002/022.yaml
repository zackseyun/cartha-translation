    rationale: Deutsch verwendet für die eigene Verlobung gewöhnlich die reflexive Verbindung »sich mit jemandem verloben«. Die Änderung erhöht die Natürlichkeit, ohne die Verlöbnis- und Beziehungsmetaphorik des Hebräischen zu verallgemeinern.
