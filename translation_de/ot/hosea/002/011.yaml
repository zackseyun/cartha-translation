  terminology: „Getreide“, „neuer Wein“, „Wolle“ und „Flachs“ sind treffend. „Nacktheit“ ist für den konkreten Ausdruck עֶרְוָה die transparentere Standardentsprechung; die mögliche Bedeutungskomponente der Schande wird in einer Fußnote erläutert, ohne den Bildgehalt umzudeuten.
