source:
  edition: WLC
  text: לָ/כֵ֣ן אָשׁ֔וּב וְ/לָקַחְתִּ֤י דְגָנִ/י֙ בְּ/עִתּ֔/וֹ וְ/תִירוֹשִׁ֖/י בְּ/מֽוֹעֲד֑/וֹ וְ/הִצַּלְתִּי֙ צַמְרִ֣/י וּ/פִשְׁתִּ֔/י לְ/כַסּ֖וֹת אֶת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/011.yaml
  text: Therefore I will return and take back my grain in its time[a], and my new wine in its season; and I will take away my wool and my flax[b], which were to cover her nakedness.
translation:
  language: de
  text: Deshalb werde ich zurückkehren und mein Getreide zu seiner Zeit zurücknehmen, ebenso meinen neuen Wein zu seiner festgesetzten Zeit. Ich werde meine Wolle und meinen Flachs wegnehmen[a], um ihre Nacktheit[b] zu bedecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entreißen“. Das hebräische Verb kann hier ein plötzliches oder gewaltsames Wegnehmen hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann mit der Entblößung zugleich deren Schande bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet knapp und natürlich die Folgerung aus der vorangehenden Anklage und Gerichtsankündigung.
- source_word: אָשׁוּב
  choice: ich werde zurückkehren
  rationale: Gibt die Grundbedeutung von שוב wieder und lässt die erneute, nun zum Gericht führende Handlung ausdrücklich hervortreten.
- source_word: וְלָקַחְתִּי
  choice: und … zurücknehmen
  rationale: לקח bedeutet grundsätzlich „nehmen“; im Zusammenhang nimmt JHWH zuvor gewährte Gaben wieder an sich. „Zurücknehmen“ macht diese im Kontext angelegte Umkehrung deutlich.
- source_word: דְגָנִי
  choice: mein Getreide
  rationale: דגן bezeichnet Getreide beziehungsweise Getreideertrag allgemein; „Getreide“ ist im modernen Deutsch präzise und geläufig.
- source_word: בְּעִתּוֹ
  choice: zu seiner Zeit
  rationale: Bewahrt den Bezug des Suffixes auf das Getreide und die zeitliche Angabe ohne unnötige Präzisierung.
- source_word: וְתִירוֹשִׁי
  choice: meinen neuen Wein
  rationale: תירוש bezeichnet frischen beziehungsweise neuen Wein. „Neuer Wein“ bewahrt den landwirtschaftlichen Sinn und ist allgemein verständlich.
- source_word: בְּמוֹעֲדוֹ
  choice: zu seiner festgesetzten Zeit
  rationale: מועד bezeichnet eine bestimmte oder festgesetzte Zeit. Die Wiedergabe wahrt die leichte Steigerung gegenüber עת und vermeidet die zusätzliche Festlegung auf „Erntezeit“.
- source_word: וְהִצַּלְתִּי
  choice: Ich werde … entreißen
  rationale: Der Hifil von נצל kann „entreißen“ oder „wegnehmen“ bedeuten. „Entreißen“ erhält hier die Kraft und mögliche Plötzlichkeit der angekündigten Wegnahme.
- source_word: צַמְרִי וּפִשְׁתִּי
  choice: meine Wolle und meinen Flachs
  rationale: Die possessiven Formen werden genau erhalten; פשתה bezeichnet den Rohstoff Flachs, nicht schon das daraus gefertigte Leinen.
- source_word: לְכַסּוֹת
  choice: die … bedecken sollten
  rationale: Die Relativkonstruktion gibt den Zweck des Infinitivs in natürlichem Deutsch wieder und bezieht ihn klar auf Wolle und Flachs.
- source_word: עֶרְוָתָהּ
  choice: ihre Blöße
  rationale: „Blöße“ bewahrt sowohl die konkrete Nacktheit als auch den Beiklang beschämender Entblößung.
theological_decisions:
- issue: Ob ausdrücklich werden soll, dass Gott zuvor gewährte Gaben wieder an sich nimmt
  choice: לקח mit „zurücknehmen“ wiedergeben
  alternative: Nur „nehmen“ schreiben und den Gedanken der Rücknahme unausgesprochen lassen
  rationale: Der Zusammenhang stellt Getreide, Wein, Wolle und Flachs als Gottes Gaben dar, die Israel anderen Mächten zuschrieb. „Zurücknehmen“ bildet diese kontextuelle Umkehrung ab, ohne eine zusätzliche Lehrbehauptung einzuführen.
- issue: Ob die Bildsprache von Entblößung und Scham abgeschwächt werden soll
  choice: עֶרְוָתָהּ konkret mit „ihre Blöße“ wiedergeben
  alternative: Abstrakter „ihre Schande“ übersetzen
  rationale: Das prophetische Bild lebt von der konkreten Entblößung und ihrem Schamaspekt. „Blöße“ erhält beides, ohne die Spannung auf einen bloß abstrakten Sinn festzulegen.
- issue: Wie die semantische Spannung in נצל auszudrücken ist
  choice: Im Haupttext „entreißen“ verwenden und die neutralere Möglichkeit in einer Fußnote nennen
  alternative: Im Haupttext neutral „wegnehmen“ verwenden
  rationale: Im Kontext geht es nicht um Rettung, sondern um den kraftvollen Entzug der Materialien. „Entreißen“ wahrt die Intensität, während die Fußnote die weniger markierte Wiedergabe offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Diktion. Die parallelen Zeitangaben werden unterschieden, ohne sie durch „Erntezeit“ stärker festzulegen als der hebräische Text. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
