base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/019.yaml
  text: And I will remove the names of the Baals from her mouth[a], and they will no longer be remembered by name.
translation:
  language: de
  text: Und ich werde die Namen der Baale aus ihrem Mund wegnehmen, und man wird sie nicht mehr bei ihrem Namen nennen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und man wird sich ihrer nicht mehr erinnern.“ Das hebräische Verb kann sowohl „sich erinnern“ als auch „erwähnen“ oder „nennen“ bedeuten; im Zusammenhang weisen beide Bedeutungen auf das Ende der Baalsverehrung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: Und ich werde … wegnehmen
  rationale: Der Hifil von סור bezeichnet hier das Veranlassen eines Entfernens. „Wegnehmen“ gibt die kausative Bedeutung in natürlichem, allgemein verständlichem Deutsch wieder.
- source_word: שְׁמוֹת הַבְּעָלִים
  choice: die Namen der Baale
  rationale: שְׁמוֹת ist der Plural von „Name“; הַבְּעָלִים bezeichnet im Kontext die als Baal verehrten kanaanäischen Gottheiten. „Baale“ bewahrt den kultischen Eigennamen und vermeidet die irreführende Wiedergabe „Herren“.
- source_word: מִפִּיהָ
  choice: aus ihrem Mund
  rationale: Die konkrete hebräische Metapher für das Aussprechen beziehungsweise Anrufen dieser Namen bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: וְלֹא יִזָּכְרוּ עוֹד
  choice: und sie werden nicht mehr … genannt werden
  rationale: Das Nifal von זכר kann sowohl „erinnert werden“ als auch „erwähnt/genannt werden“ bedeuten. Im Zusammenhang mit dem Entfernen der Namen aus ihrem Mund ist „genannt werden“ besonders natürlich; die echte lexikalische Alternative wird in der Fußnote bewahrt.
- source_word: בִּשְׁמָם
  choice: mit Namen
  rationale: Die wörtlich singularische hebräische Wendung „mit/bei ihrem Namen“ hat idiomatische Bedeutung. „Mit Namen“ ist im Deutschen knapp und natürlich, ohne den Ausdruck unnötig zu glätten.
theological_decisions:
- issue: Bezug von הַבְּעָלִים
  choice: Die „Baale“ sind die heidnischen Baal-Gottheiten, deren kultische Anrufung enden soll.
  alternative: Das Wort בעל kann außerhalb dieses Zusammenhangs allgemein „Herren“ oder „Besitzer“ bedeuten.
  rationale: Hoseas Polemik gegen den Baalskult und der Plural weisen hier auf die fremden Gottheiten. Die Transliteration „Baale“ wahrt diesen Bezug, ohne zusätzliche konfessionelle Deutung einzutragen.
- issue: Bedeutung von זכר im Nifal
  choice: Im Haupttext steht „genannt werden“.
  alternative: „in Erinnerung bleiben“ beziehungsweise „ihrer wird gedacht werden“.
  rationale: Beide Bedeutungsrichtungen sind sprachlich möglich. Der unmittelbare Bezug auf Mund und Namen stützt die Bedeutung „nennen/erwähnen“, während die Fußnote die Erinnerungskomponente offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Rede vom „Mund“ und die kultische Bezeichnung „Baale“ bleiben erhalten; „mit Namen genannt werden“ gibt die hebräische Wendung idiomatisch wieder.
