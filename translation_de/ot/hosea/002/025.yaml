source:
  edition: WLC
  text: וּ/זְרַעְתִּ֤י/הָ לִּ/י֙ בָּ/אָ֔רֶץ וְ/רִֽחַמְתִּ֖י אֶת לֹ֣א רֻחָ֑מָה וְ/אָמַרְתִּ֤י לְ/לֹֽא עַמִּי֙ עַמִּ/י אַ֔תָּה וְ/ה֖וּא יֹאמַ֥ר אֱלֹהָֽ/י־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/025.yaml
  text: And I will sow her for myself in the land[a], and I will have mercy on No Mercy, and I will say to Not My People, ‘You are my people,’ and he will say[c][b], ‘My God.’
translation:
  language: de
  text: 'Und ich werde sie für mich im Land[b] aussäen. Ich werde mich über »Kein Erbarmen«[a] erbarmen, und zu »Nicht mein Volk« werde ich sagen: »Du bist mein Volk!« Und er wird sagen[c]: »Mein Gott!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die symbolischen Namen werden traditionell als Lo-Ruhamah und Lo-Ammi transliteriert. Hier sind sie als »Kein Erbarmen« und »Nicht mein Volk« übersetzt, damit die Umkehrung des Gerichts in Wiederherstellung erkennbar bleibt.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »auf der Erde«. Das hebräische Wort kann sowohl »Land« als auch »Erde« bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Und er wird sagen.« Die maskuline Singularform stellt das wiederhergestellte Volk wahrscheinlich als einen einzelnen Antwortenden dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתִּיהָ
  choice: ich werde sie … aussäen
  rationale: Das landwirtschaftliche Bild von זרע und der Anklang an den Namen Jesreel bleiben erhalten. Das feminine Suffix wird mit »sie« wiedergegeben.
- source_word: לִּי
  choice: für mich
  rationale: Die Wendung bringt die Zugehörigkeit beziehungsweise das Handeln zugunsten Gottes zum Ausdruck, ohne den Sinn enger festzulegen.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ kann »Land« oder »Erde« bedeuten. Im Zusammenhang der Wiederherstellung Israels ist »Land« naheliegend; die weitere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: וְרִחַמְתִּי
  choice: ich werde mich … erbarmen
  rationale: »Sich erbarmen« gibt רחם würdig und natürlich wieder und macht im Deutschen die Umkehrung des Namens לֹא רֻחָמָה unmittelbar hörbar.
- source_word: לֹא רֻחָמָה
  choice: Kein Erbarmen
  rationale: Der symbolische Name wird übersetzt, damit das Wortspiel zwischen Gericht und Erbarmen sichtbar bleibt.
- source_word: לְלֹא עַמִּי
  choice: zu »Nicht mein Volk«
  rationale: Auch dieser symbolische Name wird übersetzt, damit seine ausdrückliche Umkehrung in »Du bist mein Volk« verständlich bleibt.
- source_word: עַמִּי אַתָּה
  choice: Du bist mein Volk
  rationale: Die singularische Anrede und die Bundesformel des Hebräischen werden direkt bewahrt.
- source_word: וְהוּא יֹאמַר
  choice: Und er wird sagen
  rationale: Pronomen und Verb stehen im Hebräischen maskulin Singular. Die Form personifiziert offenbar das wiederhergestellte Volk als einen Antwortenden.
- source_word: אֱלֹהָי
  choice: Mein Gott
  rationale: Die knappe Bundesantwort wird ohne Ergänzung wiedergegeben.
theological_decisions:
- issue: Wiedergabe der symbolischen Namen
  choice: Die Namen werden als »Kein Erbarmen« und »Nicht mein Volk« übersetzt.
  alternative: Lo-Ruhama und Lo-Ammi
  rationale: Die Aussage des Verses beruht auf der hörbaren Umkehrung der zuvor gegebenen Gerichtsnamen. Eine bloße Umschrift würde diese zentrale Verbindung für viele Leser verdecken.
- issue: Singularische, maskuline Antwort des Volkes
  choice: »Und er wird sagen«
  alternative: »Und sie werden sagen« oder »Und es wird sagen«
  rationale: Die hebräische Form ist ausdrücklich maskulin und singularisch. Die Übersetzung erhält diese Personifizierung, statt sie als kollektiven Plural zu glätten.
- issue: Räumlicher Bezug von אֶרֶץ
  choice: »im Land«
  alternative: »auf der Erde«
  rationale: Der Kontext legt das Land der Wiederherstellung nahe, doch die weitere lexikalische Bedeutung bleibt in der Fußnote ausdrücklich offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Sätze und die übersetzten Namen lassen den prophetischen Namens- und Umkehrungswortlaut hervortreten. Die singularische Personifizierung sowie die Mehrdeutigkeit von »Land/Erde« werden nicht eingeebnet.
