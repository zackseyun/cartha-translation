base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/010.yaml
  text: But she did not know that it was I who gave her the grain[a], the new wine, and the oil, and who multiplied silver for her and gold[b], which they made into Baal.
translation:
  language: de
  text: Doch sie wusste nicht, dass ich es war, der ihr das Getreide, den jungen Wein und das Öl[a] gab und ihr reichlich Silber und Gold schenkte, aus denen sie für den Baal etwas machten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich ein Ausdruck für frisches Öl, gewöhnlich Olivenöl als landwirtschaftliches Erzeugnis.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus denen sie ein Baalsbild machten“. Das Hebräische ist knapp und kann entweder die Anfertigung eines Baalsbildes aus Silber und Gold oder allgemeiner die Herstellung von Gegenständen für den Baalskult bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִיא לֹא יָדְעָה
  choice: Doch sie wusste nicht
  rationale: Das einleitende וְ ist im Zusammenhang gegensätzlich; das ausdrücklich genannte feminine Subjekt bleibt erhalten. ידע wird in seiner direkten Bedeutung „wissen“ wiedergegeben, ohne die mögliche Nuance des Nichtanerkennens festzuschreiben.
- source_word: כִּי אָנֹכִי
  choice: dass ich es war
  rationale: Die Formulierung erhält den Nachdruck des selbstständigen Pronomens אָנֹכִי.
- source_word: הַדָּגָן
  choice: das Getreide
  rationale: דגן bezeichnet Getreide beziehungsweise Getreideertrag allgemein.
- source_word: הַתִּירוֹשׁ
  choice: den jungen Wein
  rationale: תירוש bezeichnet neuen beziehungsweise jungen Wein als landwirtschaftliches Erzeugnis.
- source_word: הַיִּצְהָר
  choice: das Öl
  rationale: יצהר meint hier Öl, gewöhnlich Olivenöl, innerhalb der üblichen Dreiergruppe landwirtschaftlicher Erzeugnisse; „Öl“ ist im Deutschen natürlich und ausreichend genau.
- source_word: וְכֶסֶף הִרְבֵּיתִי לָהּ וְזָהָב
  choice: und ihr Silber in Fülle und Gold gab
  rationale: Die Hifilform von רבה drückt Vermehrung beziehungsweise reichliche Zuteilung aus. Die deutsche Formulierung macht zugleich die Ellipse verständlich, nach der auch Gold zum von Gott gewährten Reichtum gehört.
- source_word: עָשׂוּ לַבָּעַל
  choice: das sie für den Baal verwendeten
  rationale: Die knappe hebräische Wendung kann das Anfertigen eines Baalsbildes oder allgemeiner die Verwendung der Gaben für den Baalskult meinen. Die Hauptfassung bewahrt diese Weite; eine Fußnote nennt die engere Möglichkeit.
theological_decisions:
- issue: Bedeutung von לַבָּעַל im Götzendienstkontext
  choice: für den Baal
  alternative: zu einem Baalsbild
  rationale: בעל bezeichnet hier die kanaanäische Gottheit. Der bestimmte Artikel des Hebräischen wird mit „der Baal“ sichtbar gemacht, ohne den Namen als bloßen allgemeinen Titel „Herr“ wiederzugeben.
- issue: Bezug und Sinn von עָשׂוּ לַבָּעַל
  choice: für den Baal verwendeten
  alternative: zu einem Baalsbild machten
  rationale: Der hebräische Ausdruck ist elliptisch und lässt offen, ob das Metall zu einem Bild verarbeitet oder allgemeiner im Baalskult eingesetzt wurde. Die Übersetzung entscheidet diese Spannung nicht stillschweigend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „gab“ schafft einen verständlichen deutschen Satz und verdeutlicht die im Hebräischen knappe Zuordnung von Silber und Gold, ohne den theologischen Kontrast zwischen Gottes Gabe und ihrer Verwendung für den Baal abzuschwächen.
