source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּי֙ כָּל מְשׂוֹשָׂ֔/הּ חַגָּ֖/הּ חָדְשָׁ֣/הּ וְ/שַׁבַּתָּ֑/הּ וְ/כֹ֖ל מוֹעֲדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/013.yaml
  text: And I will put an end to all her rejoicing—her feasts[a], her new moons, her Sabbaths[b], and all her appointed times.
translation:
  language: de
  text: Und ich werde all ihrer Freude ein Ende machen – ihren Festen, ihren Neumondstagen, ihren Sabbaten und all ihren festgesetzten Zeiten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all ihren Festzeiten“. Das hebräische Wort kann sowohl festgesetzte Zeiten als auch die zu diesen Zeiten begangenen religiösen Feste bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: Und ich werde … ein Ende machen
  rationale: 'Die Hifil-Form von שׁבת ist kausativ: Gott lässt die Freude aufhören. Die deutsche Wendung ist natürlich und bewahrt die starke Aussage des angekündigten Gerichts.'
- source_word: כָּל מְשׂוֹשָׂהּ
  choice: all ihrer Freude
  rationale: מְשׂוֹשׂ bezeichnet Freude, Jubel oder Fröhlichkeit. „Freude“ ist würdig und allgemein verständlich; „all“ erhält den umfassenden Charakter der Aussage.
- source_word: חַגָּהּ
  choice: ihren Festen
  rationale: חַג bezeichnet ein religiöses Fest, häufig ein Wallfahrtsfest. Der hebräische Singular mit Suffix wird hier im Zusammenhang der wiederkehrenden Festordnung kollektiv durch den deutschen Plural wiedergegeben.
- source_word: חָדְשָׁהּ
  choice: ihren Neumondstagen
  rationale: חֹדֶשׁ meint in diesem kultischen Zusammenhang die am Neumond begangene Feier, nicht lediglich einen Kalendermonat. „Neumondstage“ macht den Bezug auf die wiederkehrenden Beobachtungstage verständlich.
- source_word: וְשַׁבַּתָּהּ
  choice: ihren Sabbaten
  rationale: Der kollektive Bezug auf die wiederkehrenden Sabbattage wird im Deutschen sachgerecht im Plural ausgedrückt.
- source_word: וְכֹל מוֹעֲדָהּ
  choice: und all ihren festgesetzten Zeiten
  rationale: מוֹעֵד kann eine festgesetzte Zeit oder ein zu dieser Zeit begangenes Fest bezeichnen. Die Wiedergabe „festgesetzte Zeiten“ bewahrt diese Bedeutungsbreite und vermeidet eine unnötige Wiederholung von „Feste“.
theological_decisions:
- issue: Art der genannten Zeiten und Feiern
  choice: Die Aufzählung bezeichnet vor allem Israels religiöse Fest- und Ruhetage, deren Freude im Gericht beendet wird.
  alternative: Die Überschrift „all ihrer Freude“ kann über die formellen gottesdienstlichen Feiern hinaus auch die gesamte gesellschaftliche Festfreude einschließen.
  rationale: Feste, Neumondstage, Sabbate und festgesetzte Zeiten sind Sprache des religiösen Kalenders. Die übergeordnete Formulierung bleibt jedoch bewusst weit und wird nicht auf rein kultische Handlungen verengt.
- issue: Bedeutung von מוֹעֵד
  choice: Die zeitliche Grundbedeutung wird mit „festgesetzten Zeiten“ im Haupttext bewahrt.
  alternative: „Festzeiten“ oder „festgesetzte Feste“ würde den kultischen Bezug ausdrücklicher machen.
  rationale: Der unmittelbare Kontext legt religiöse Termine nahe, doch das Wort selbst kann sowohl den festgesetzten Zeitpunkt als auch die dazugehörige Versammlung oder Feier bezeichnen. Die Übersetzung löst diese Spannung nicht unnötig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich kennzeichnet die folgende Aufzählung als nähere Entfaltung von „all ihrer Freude“. Die wiederkehrenden kultischen Tage werden idiomatisch im Plural wiedergegeben, während die Mehrdeutigkeit des abschließenden מוֹעֵד erhalten bleibt.
