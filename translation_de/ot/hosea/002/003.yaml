lexical_decisions:
- source_word: אִמְרוּ
  choice: Sagt
  rationale: Der Imperativ Plural von אמר wird direkt und natürlich wiedergegeben.
- source_word: לַאֲחֵיכֶם
  choice: zu euren Brüdern
  rationale: Das hebräische maskuline Pluralnomen bezeichnet ausdrücklich die Brüder; der parallele Ausdruck für die Schwestern folgt unmittelbar.
- source_word: עַמִּי
  choice: Mein Volk
  rationale: Die Bedeutung des symbolischen Namens wird im Haupttext wiedergegeben, damit die prophetische Aussage unmittelbar verständlich bleibt.
- source_word: וְלַאֲחוֹתֵיכֶם
  choice: und zu euren Schwestern
  rationale: Der ausdrücklich feminine Plural wird entsprechend wiedergegeben.
- source_word: רֻחָמָה
  choice: Begnadigt
  rationale: Die passive Form von רחם bezeichnet eine Person, der Erbarmen erwiesen worden ist. »Begnadigt« ist knapp, würdevoll und kann wie im Hebräischen als symbolischer Name beziehungsweise Benennung stehen.
theological_decisions:
- issue: Wiedergabe der symbolischen Namen עַמִּי und רֻחָמָה
  choice: Die Bedeutungen im Haupttext übersetzen und die hebräischen Namensformen in Fußnoten nennen
  alternative: Im Haupttext »Ammi« und »Ruhama« transliterieren
  rationale: Die Bedeutungen der Namen tragen die prophetische Umkehrung und Wiederherstellung. Ihre Übersetzung macht diese Aussage sichtbar, während die Fußnoten den Zusammenhang mit den symbolischen Namen bewahren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die parallele Satzstruktur und die ausdrücklich männlichen und weiblichen Gruppen des Hebräischen bleiben erhalten.
