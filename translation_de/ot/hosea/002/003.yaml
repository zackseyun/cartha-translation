translation:
  language: de
  text: 'Sagt zu euren Brüdern[a]: »Mein Volk«, und zu euren Schwestern[b]: »Erbarmen gefunden«.


    [a] Hebräisch: »Ammi«, ein symbolischer Name mit der Bedeutung »Mein Volk«.

    [b] Hebräisch: »Ruhama«, ein symbolischer Name mit der Bedeutung »Erbarmen gefunden« oder »der Erbarmen erwiesen wurde«.'
  philosophy: optimal-equivalence
