  source_fidelity: 'Der Text gibt die Syntax und den Sinn des Hebräischen zuverlässig wieder: Das vorangestellte Objekt „ihren Kindern“ entspricht וְאֶת־בָּנֶיהָ, die Zukunftsaussage לֹא אֲרַחֵם wird treffend als Verweigerung von Erbarmen wiedergegeben, und כִּי begründet diese Verweigerung. „Kinder der Hurerei“ bewahrt die scharfe, absichtlich anstößige Bildsprache von בְּנֵי זְנוּנִים, ohne die Metapher dogmatisch einzuengen.'
