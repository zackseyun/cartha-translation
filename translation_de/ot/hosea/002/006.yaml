id: HOS.2.6
reference: Hosea 2:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת בָּנֶ֖י/הָ לֹ֣א אֲרַחֵ֑ם כִּֽי בְנֵ֥י זְנוּנִ֖ים הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/006.yaml
  text: And I will not show compassion to her children[a], for they are children of whoredom.
translation:
  language: de
  text: Und ihren Kindern werde ich kein Erbarmen zeigen, denn sie sind Kinder der Hurerei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kinder der Prostitution“; sinngemäß auch: „Kinder der Untreue“. Das Hebräische bewahrt die drastische Bildsprache sexueller Untreue, die hier zugleich für Untreue im Bundesverhältnis steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בָּנֶיהָ
  choice: Und ihren Kindern
  rationale: Die Konjunktion wird mit „Und“ wiedergegeben; אֶת kennzeichnet lediglich das direkte Objekt. בָּנִים bezeichnet hier allgemein die Nachkommen, daher „Kinder“ statt des engeren „Söhne“.
- source_word: לֹא אֲרַחֵם
  choice: werde ich kein Erbarmen zeigen
  rationale: Das Piel von רחם bedeutet, jemandem Erbarmen oder Mitgefühl zu erweisen. „Kein Erbarmen zeigen“ ist gegenwärtiges, würdevolles Deutsch und bewahrt sowohl die emotionale als auch die relationale Tragweite.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die angekündigte Verweigerung des Erbarmens ein. „Denn“ erhält den knappen prophetischen Stil.
- source_word: בְנֵי זְנוּנִים
  choice: Kinder der Hurerei
  rationale: Die Genitivverbindung bewahrt die scharfe sexuelle Bildsprache des hebräischen Textes. „Hurerei“ klingt bewusst hart und bezeichnet im Kontext zugleich die im Ehebild dargestellte Untreue, ohne diese Spannung auf eine rein abstrakte Bedeutung zu reduzieren.
- source_word: הֵמָּה
  choice: sie sind
  rationale: Das selbstständige Pronomen hebt die Feststellung hervor. Die ausdrückliche Formulierung „sie sind“ gibt dies im Deutschen ausreichend und natürlich wieder.
theological_decisions:
- issue: Die Anklage בְנֵי זְנוּנִים innerhalb von Hoseas Ehe- und Bundesmetaphorik
  choice: Kinder der Hurerei
  alternative: Kinder der Prostitution; Kinder der Untreue
  rationale: Die Übersetzung erhält die anstößige sexuelle Bildsprache, mit der Hosea die Untreue im Bundesverhältnis darstellt. Sie legt jedoch nicht fest, ob damit ausschließlich eine Aussage über die buchstäbliche Abstammung der Kinder oder ausschließlich eine geistliche Deutung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener prophetischer Härte. „Hurerei“ ist markiert, aber hier wegen der drastischen Metaphorik sachlich angemessen; die Fußnote bietet verständlichere Alternativen, ohne das Bild im Haupttext abzuschwächen.
