  text: פֶּן אַפְשִׁיטֶ֣/נָּה עֲרֻמָּ֔ה וְ/הִ֨צַּגְתִּ֔י/הָ כְּ/י֖וֹם הִוָּֽלְדָ֑/הּ וְ/שַׂמְתִּ֣י/הָ כַ/מִּדְבָּ֗ר וְ/שַׁתִּ֨/הָ֙ כְּ/אֶ֣רֶץ צִיָּ֔ה וַ/הֲמִתִּ֖י/הָ בַּ/צָּמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/005.yaml
  text: or else I will strip her naked and expose her as on the day she was born[a], and make her like the wilderness, and make her like a parched land[b], and let her die of thirst.
translation:
  language: de
  text: Sonst ziehe ich sie nackt aus und stelle sie hin wie am Tag ihrer Geburt[a], mache sie wie die Wüste, mache sie wie ausgedörrtes Land und lasse sie verdursten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch formeller: „damit ich sie nicht nackt ausziehe“. Die hebräische Partikel leitet hier eine angedrohte Folge ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „sie durch Durst sterben lasse“ oder „sie durch Durst töte“. Das hebräische Verb ist kausativ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: sonst
  rationale: Die Partikel leitet hier die angedrohte Folge ein. „Sonst“ gibt diesen Warnungscharakter in natürlichem modernem Deutsch wieder; das formalere „damit nicht“ wäre im Zusammenhang schwerfälliger.
- source_word: אַפְשִׁיטֶנָּה עֲרֻמָּה
  choice: ziehe ich sie nackt aus
  rationale: Die Verbindung bezeichnet das Entkleiden bis zur Nacktheit. Die direkte Formulierung bewahrt das drastische Bild von Bloßstellung und Gericht.
- source_word: וְהִצַּגְתִּיהָ
  choice: und stelle sie bloß
  rationale: Das Verb bedeutet, jemanden hinzustellen bzw. sichtbar darzustellen. Im Zusammenhang mit der Nacktheit bringt „bloßstellen“ sowohl das öffentliche Ausgesetztsein als auch die Schande zum Ausdruck, ohne das Bild auf eine abstrakte Demütigung zu reduzieren.
- source_word: כְּיוֹם הִוָּלְדָהּ
  choice: wie am Tag ihrer Geburt
  rationale: Die knappe Wendung erhält den Vergleich mit dem hilflosen, unbekleideten Zustand bei der Geburt.
- source_word: וְשַׂמְתִּיהָ כַמִּדְבָּר
  choice: Ich mache sie wie die Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes, dürres Wildnis- oder Wüstenland. „Wüste“ ist hier anschaulich und im Deutschen idiomatisch.
- source_word: וְשַׁתִּהָ כְּאֶרֶץ צִיָּה
  choice: mache sie wie ausgedörrtes Land
  rationale: צִיָּה hebt extreme Trockenheit hervor. „Ausgedörrtes Land“ wahrt die Steigerung gegenüber „Wüste“ und klingt gegenwärtig und bildhaft.
- source_word: וַהֲמִתִּיהָ בַּצָּמָא
  choice: und lasse sie verdursten
  rationale: Die Hifil-Form ist kausativ und bezeichnet das Herbeiführen des Todes durch Durst. „Verdursten lassen“ ist natürliches Deutsch, während die Fußnote die noch ausdrücklichere kausative Wiedergabe nennt.
theological_decisions:
- issue: Gerichtsmetaphorik gegen die untreue Frau beziehungsweise Israel
  choice: Die konkreten Bilder von Nacktheit, öffentlicher Bloßstellung, Verwüstung und Tod durch Durst bleiben erhalten.
  alternative: Die Bilder als allgemeine Demütigung, Entbehrung oder Strafe paraphrasieren.
  rationale: Die Härte und theologische Spannung des prophetischen Gerichtsbildes gehören zum Wortlaut. Eine abstrahierende Wiedergabe würde die Metaphorik abschwächen und ihre Deutung vorwegnehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst drastischer, ungemilderter Gerichtsbildsprache. Die Wiederholung „mache sie“ bildet den parallelen hebräischen Satzbau ab; der Wechsel zu „ausgedörrtes Land“ verdeutlicht die Steigerung der Trockenheit.
