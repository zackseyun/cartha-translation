base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/010.yaml
  text: 'In the house of Israel I have seen a horrible thing: there is prostitution in Ephraim[c][b][a]; Israel has defiled itself.'
translation:
  language: de
  text: Im Haus Israel habe ich etwas Entsetzliches gesehen:[a] Dort ist Efraims Hurerei;[b] Israel hat sich verunreinigt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »etwas Abscheuliches«. Das hebräische Wort bezeichnet etwas Schockierendes oder Grauenhaftes.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung ist knapp und mehrdeutig. Auch möglich: »Dort ist Hurerei in Efraim« oder »Dort gehört die Hurerei zu Efraim«.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »Israel ist unrein geworden« beziehungsweise »Israel ist verunreinigt«.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּבֵית יִשְׂרָאֵל
  choice: Im Haus Israel
  rationale: Bewahrt das Bild Israels als Haus beziehungsweise Großfamilie und gibt בְּ räumlich-metaphorisch wieder.
- source_word: רָאִיתִי
  choice: habe ich ... gesehen
  rationale: Das deutsche Perfekt gibt die abgeschlossene Wahrnehmung mit ihrer gegenwärtigen Relevanz im prophetischen Ausspruch natürlich wieder.
- source_word: שעריריה
  choice: etwas Entsetzliches
  rationale: Der seltene Ausdruck bezeichnet etwas Erschreckendes oder Abscheuliches; die substantivierte Form klingt im modernen Deutsch natürlich und würdevoll.
- source_word: שָׁם
  choice: Dort
  rationale: Der Ortsverweis auf das zuvor genannte Haus Israel bleibt ausdrücklich erhalten.
- source_word: זְנוּת
  choice: Hurerei
  rationale: Bewahrt die drastische sexuelle Bildsprache und lässt sowohl buchstäbliche sexuelle Verfehlung als auch den bei Hosea prägenden Sinn der Bundestreueverletzung offen.
- source_word: לְאֶפְרַיִם
  choice: Efraims
  rationale: Der Genitiv bildet die knappe und mehrdeutige Zuordnung durch לְ ab, ohne sie eindeutig als Ort oder Besitz festzulegen.
- source_word: נִטְמָא
  choice: hat sich unrein gemacht
  rationale: Gibt den resultativen beziehungsweise reflexiven Sinn des Nifal wieder und bewahrt zugleich die kultisch-moralische Kategorie der Unreinheit.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bleibt erhalten, sodass die rhetorische Folge Haus Israel, Efraim und Israel sichtbar bleibt.
theological_decisions:
- issue: Ob זְנוּת vorrangig buchstäbliche sexuelle Sünde oder bildlich Götzendienst bezeichnet
  choice: Hurerei
  alternative: Prostitution; sexuelle Untreue
  rationale: Die konkrete, anstößige Bildsprache Hoseas bleibt bestehen, ohne die Aussage ausschließlich auf sexuelle Sünde oder ausschließlich auf Götzendienst einzuengen.
- issue: Wie die knappe Verbindung זְנוּת לְאֶפְרַיִם zu verstehen ist
  choice: Dort ist Efraims Hurerei
  alternative: Dort ist Hurerei in Efraim; dort gehört die Hurerei zu Efraim
  rationale: Der Genitiv erhält die Zuordnung zu Efraim, während eine Fußnote die möglichen lokalen und attributiven Deutungen nennt.
- issue: Ob נִטְמָא einen Zustand, ein Zustandswerden oder selbstverschuldete Verunreinigung ausdrückt
  choice: Israel hat sich unrein gemacht
  alternative: Israel ist unrein geworden; Israel ist verunreinigt
  rationale: Die gewählte Form bringt Israels Beteiligung an der Verunreinigung zum Ausdruck; die grammatisch möglichen weniger reflexiven Wiedergaben bleiben in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Haus Israel« wahrt die biblische Familien- und Bundesmetaphorik. »Hurerei« ist bewusst kräftig, aber verständlich; die Satzstellung setzt den göttlichen Sprecher und den erschütternden Befund klar in Szene.
