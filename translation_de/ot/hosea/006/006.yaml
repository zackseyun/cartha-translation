source:
  edition: WLC
  text: כִּ֛י חֶ֥סֶד חָפַ֖צְתִּי וְ/לֹא זָ֑בַח וְ/דַ֥עַת אֱלֹהִ֖ים מֵ/עֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/006.yaml
  text: For I desire steadfast love and not sacrifice[b][a], and the knowledge of God rather than burnt offerings.
translation:
  language: de
  text: Denn an treuer Liebe[a] habe ich Gefallen, nicht am Schlachtopfer, und an der Erkenntnis Gottes mehr als an Brandopfern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Barmherzigkeit“, „Güte“ oder „Bundestreue“. Das hebräische חֶסֶד kann sowohl erbarmende Liebe als auch beständige Treue innerhalb einer verbindlichen Beziehung bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Präposition kann wörtlich „von“ bedeuten; in diesem Zusammenhang drückt die Konstruktion einen Vorrang aus: „mehr als Brandopfer“ oder „eher als Brandopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Zusammenhang ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: חֶסֶד
  choice: treue Liebe
  rationale: Die Wendung bewahrt sowohl den Aspekt der Liebe und Barmherzigkeit als auch den der beständigen, gemeinschaftsbezogenen Treue.
- source_word: חָפַצְתִּי
  choice: habe ich Gefallen
  rationale: Gibt das Verlangen beziehungsweise Wohlgefallen Gottes idiomatisch wieder und passt zum kultischen Kontrast.
- source_word: זָבַח
  choice: Schlachtopfer
  rationale: Bewahrt den kultischen Sinn des allgemeinen Opferbegriffs und unterscheidet ihn vom spezielleren Brandopfer im zweiten Satzglied.
- source_word: דַעַת אֱלֹהִים
  choice: die Erkenntnis Gottes
  rationale: Erhält die nominale Form und lässt sowohl verstehende als auch beziehungsbezogene Gotteserkenntnis anklingen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das hebräische Wort ist hier die allgemeine Gottesbezeichnung, nicht der Gottesname JHWH.
- source_word: מֵעֹלוֹת
  choice: mehr als an Brandopfern
  rationale: Das präfigierte מ drückt hier einen Vergleich beziehungsweise Vorrang aus; „mehr als“ wahrt diesen, ohne eine uneingeschränkte Abschaffung aller Opfer zu behaupten.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: Bezeichnet Opfer, die vollständig auf dem Altar verbrannt wurden; „Brandopfer“ ist die geläufige und präzise deutsche Wiedergabe.
theological_decisions:
- issue: Ob der Vers Opfer schlechthin verwirft oder treue Liebe und Gotteserkenntnis gegenüber bloßem Ritual bevorzugt
  choice: Der Wortlaut stellt treue Liebe und Gotteserkenntnis über Opferhandlungen.
  alternative: Absolute Verwerfung des gesamten Opferwesens
  rationale: Die Verneinung im ersten Satzglied und der Vergleich mit מ im zweiten schaffen eine prophetische Gegenüberstellung. Die Übersetzung erhält deren Schärfe, legt sie aber nicht als uneingeschränkte Aufhebung jedes Opfers aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bewahrt den poetischen Parallelismus und den scharfen Gegensatz zwischen gelebter Bundestreue beziehungsweise Gotteserkenntnis und kultischem Vollzug.
