id: HOS.6.1
reference: Hosea 6:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְכוּ֙ וְ/נָשׁ֣וּבָה אֶל יְהוָ֔ה כִּ֛י ה֥וּא טָרָ֖ף וְ/יִרְפָּאֵ֑/נוּ יַ֖ךְ וְ/יַחְבְּשֵֽׁ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/001.yaml
  text: Come[a], let us return to Yahweh, for he has torn us, but he will heal us; he has struck us[b], but he will bind us up.
translation:
  language: de
  text: Kommt, lasst uns zu Jahwe zurückkehren! Denn er hat uns zerrissen[a], doch[b] er wird uns heilen; er hat uns geschlagen, doch er wird unsere Wunden verbinden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild ist das eines Raubtiers, das seine Beute zerreißt.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich steht hier und ebenso vor „er wird unsere Wunden verbinden“: „und“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Kommt
  rationale: Der pluralische Imperativ von הלך dient hier idiomatisch als auffordernde Einleitung. „Kommt“ gibt im Deutschen die hortative Wendung „Kommt, lasst uns …“ natürlich wieder; das formal mögliche „Geht“ wäre in diesem Zusammenhang missverständlich.
- source_word: וְנָשׁוּבָה
  choice: lasst uns … zurückkehren
  rationale: Die Kohortativform der 1. Person Plural drückt einen gemeinsamen Entschluss aus. „Zurückkehren“ bewahrt sowohl die Bewegungsrichtung zu Jahwe als auch den bei Hosea mitschwingenden Gedanken der Umkehr, ohne diesen auf den Fachbegriff „Buße tun“ zu verengen.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: אֶל bezeichnet die Richtung auf ein Ziel hin. Der Gottesname יהוה wird in seiner im Deutschen geläufigen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für die vorausgehende Aufforderung ein. „Denn“ bildet diesen Zusammenhang knapp und in einem würdigen modernen Register ab.
- source_word: טָרָף
  choice: hat uns zerrissen
  rationale: Das Verb bezeichnet häufig das Zerreißen von Beute durch ein Raubtier. Das im Hebräischen nicht ausdrücklich genannte Objekt „uns“ ergibt sich aus dem Parallelismus und den folgenden Suffixen.
- source_word: וְיִרְפָּאֵנוּ
  choice: doch er wird uns heilen
  rationale: Die Yiqtolform bezeichnet hier die erwartete künftige Wiederherstellung. Das hebräische וְ ist formal „und“; „doch“ macht im Deutschen den Gegensatz zwischen Verletzen und Heilen deutlich.
- source_word: יַךְ
  choice: hat uns geschlagen
  rationale: Im poetischen Parallelismus steht die Form parallel zum vorausgehenden Perfekt und wird daher als bereits vollzogene Gerichtshandlung verstanden. „Geschlagen“ ist gegenwärtiges Standarddeutsch und wahrt die Härte der Aussage.
- source_word: וְיַחְבְּשֵׁנוּ
  choice: doch er wird unsere Wunden verbinden
  rationale: חבש bezeichnet hier das Verbinden einer Verletzung. Die deutsche Wendung „unsere Wunden verbinden“ gibt das Bild natürlich und eindeutig wieder; ein wörtliches „uns verbinden“ könnte im heutigen Deutsch als Zusammenfügen von Personen missverstanden werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und entspricht der üblichen deutschen Umschrift, ohne ihn durch einen Titel zu ersetzen.
- issue: Zeitlicher Bezug von Gericht und Wiederherstellung
  choice: Vergangene Verletzung und erwartete künftige Heilung
  alternative: Alle Verbformen zukünftig wiedergeben
  rationale: Der poetische Parallelismus legt nahe, טָרָף und יַךְ als bereits erfahrenes Gericht und die jeweils folgenden Yiqtolformen als erhoffte Wiederherstellung zu verstehen. So bleibt die Spannung bestehen, dass derselbe Gott verwundet hat und heilen wird.
- issue: Verhältnis der Satzglieder mit וְ
  choice: adversativ mit „doch“
  alternative: formal koordinierend mit „und“
  rationale: Die hebräische Konjunktion ist an beiden Stellen schlicht וְ. Der sachliche Gegensatz von Gericht und Heilung erlaubt im Deutschen „doch“, während die Fußnote die formal koordinierende Alternative offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Aufforderung ist bewusst gemeinschaftlich und unmittelbar formuliert. Die Raubtier- und Wundmetaphorik bleibt erhalten; archaische Wörter wie „schlagen“ im Sinne von „verwunden“ werden nicht durch konfessionell geprägte Ausdrücke erweitert.
