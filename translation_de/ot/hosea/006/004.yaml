  text: מָ֤ה אֶֽעֱשֶׂה לְּ/ךָ֙ אֶפְרַ֔יִם מָ֥ה אֶעֱשֶׂה לְּ/ךָ֖ יְהוּדָ֑ה וְ/חַסְדְּ/כֶם֙ כַּֽ/עֲנַן בֹּ֔קֶר וְ/כַ/טַּ֖ל מַשְׁכִּ֥ים הֹלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/004.yaml
  text: What shall I do with you[a], Ephraim? What shall I do with you, Judah? Your loyalty is like a morning cloud, and like dew that goes away early.
translation:
  language: de
  text: Was soll ich mit dir tun, Ephraim? Was soll ich mit dir tun, Juda? Eure Treue[a] ist wie eine Wolke am Morgen, wie der Tau, der früh vergeht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure beständige Liebe“, „eure loyale Liebe“ oder „eure Bundestreue“. Das hebräische Wort חֶסֶד bezeichnet eine verlässliche, loyale Liebe und Treue innerhalb einer festen Beziehung, besonders der Bundesbeziehung zu Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לְךָ
  choice: Was soll ich mit dir tun?
  rationale: Die rhetorische Frage drückt ratlose Entrüstung aus. Die deutsche Wendung ist natürlich und bewahrt diese Wirkung, ohne die Frage auf eine konkrete Strafhandlung festzulegen.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der Eigenname bleibt erhalten; im Zusammenhang steht er zugleich für das Nordreich.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Die im Deutschen übliche biblische Form des Eigennamens bleibt erhalten; hier bezeichnet sie zugleich das Südreich.
- source_word: חַסְדְּכֶם
  choice: eure Treue
  rationale: חֶסֶד umfasst hier verlässliche, loyale Zuwendung in der Beziehung zu Gott. „Treue“ gibt den Vorwurf der Unbeständigkeit knapp und verständlich wieder; die weitergehenden Bedeutungsnuancen werden in der Fußnote bewahrt.
- source_word: כַּעֲנַן בֹּקֶר
  choice: wie eine Wolke am Morgen
  rationale: עָנָן bezeichnet eine Wolke. Die Formulierung erhält das konkrete Bild und deutet es nicht vorschnell als Nebel um.
- source_word: וְכַטַּל
  choice: wie der Tau
  rationale: Das parallele Vergänglichkeitsbild wird schlicht und idiomatisch wiedergegeben.
- source_word: מַשְׁכִּים הֹלֵךְ
  choice: der früh vergeht
  rationale: מַשְׁכִּים bezeichnet das frühe Geschehen, während הֹלֵךְ hier das Fortgehen beziehungsweise Verschwinden ausdrückt. „Früh vergeht“ bewahrt beides knapp.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im prophetischen Bundeskontext
  choice: Treue
  alternative: Bundestreue; beständige Liebe; loyale Liebe
  rationale: Der Vers tadelt nicht das völlige Fehlen, sondern die Flüchtigkeit der Israel und Juda zugeschriebenen Haltung. „Treue“ wahrt den relationalen und verpflichtenden Sinn, ohne den im Einzelwort nur mitgemeinten Bund ausdrücklich in den Haupttext einzutragen. Die semantische Breite bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die beiden parallelen Vergänglichkeitsbilder bleiben erhalten; die Metapher „Wolke“ wird nicht zu „Nebel“ umgedeutet.
