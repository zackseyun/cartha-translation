id: HOS.6.7
reference: Hosea 6:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֵ֕מָּה כְּ/אָדָ֖ם עָבְר֣וּ בְרִ֑ית שָׁ֖ם בָּ֥גְדוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/007.yaml
  text: But they[a], like Adam, transgressed the covenant; there they dealt faithlessly with me.
translation:
  language: de
  text: Doch sie[a] haben wie Adam den Bund übertreten; dort sind sie mir untreu geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Mensch“ oder „wie die Menschen“. Das hebräische Wort אָדָם kann Adam als Person oder den Menschen beziehungsweise die Menschheit im Allgemeinen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Doch sie
  rationale: Das betonte Pronomen wird ausdrücklich wiedergegeben; „doch“ bringt den Gegensatz zur vorausgehenden positiven Aussage natürlich zum Ausdruck.
- source_word: כְּאָדָם
  choice: wie Adam
  rationale: אָדָם kann sowohl den Eigennamen Adam als auch den Menschen beziehungsweise die Menschheit bezeichnen. Im Haupttext wird die plausible Anspielung auf Adam bewahrt; die echte Mehrdeutigkeit steht in der Fußnote.
- source_word: עָבְרוּ
  choice: haben … übertreten
  rationale: In Verbindung mit בְרִית bezeichnet das Verb die Überschreitung und Verletzung der Bundesordnung. „Den Bund übertreten“ bewahrt diese Bildlichkeit und das theologische Gewicht.
- source_word: בְרִית
  choice: den Bund
  rationale: Obwohl im Hebräischen formal kein Artikel steht, legt der Zusammenhang eine bestimmte Bundesbeziehung nahe; im Deutschen ist daher „den Bund“ idiomatisch und sachgerecht.
- source_word: שָׁם
  choice: dort
  rationale: Die gewöhnliche lokale Bedeutung des Adverbs wird beibehalten, ohne seinen im Kontext nicht ausdrücklich genannten Bezug zu ergänzen.
- source_word: בָּגְדוּ
  choice: sind … untreu geworden
  rationale: Das Verb bezeichnet treuloses beziehungsweise verräterisches Handeln, besonders innerhalb einer Bundesbeziehung. Die gewählte Formulierung ist natürlich, verständlich und wahrt den Beziehungsaspekt.
- source_word: בִי
  choice: mir
  rationale: Beim deutschen Ausdruck „jemandem untreu werden“ wird das hebräische Präpositionalobjekt idiomatisch durch den Dativ wiedergegeben.
theological_decisions:
- issue: Deutung von כְּאָדָם im Zusammenhang mit dem Bund
  choice: wie Adam
  alternative: wie ein Mensch; wie die Menschen/Menschheit
  rationale: Der Eigenname Adam ist eine plausible Lesart und kann auf den ersten menschlichen Treuebruch anspielen. Da אָדָם jedoch ebenso generisch verstanden werden kann, wird diese nicht auflösbare Mehrdeutigkeit ausdrücklich in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Den Bund übertreten“ erhält die markante Bundessprache des Hebräischen; „mir untreu geworden“ klingt gegenwärtig und gibt den persönlichen Treuebruch klar wieder.
