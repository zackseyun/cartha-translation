  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Hebräischen sachgerecht wieder: das adversative וְ, das betonte Subjekt, die umstrittene Wendung כְּאָדָם, den Bundesbruch, das lokative שָׁם sowie den persönlichen Treuebruch gegen Gott. „Dort“ bewahrt die im Text nicht näher bestimmte Ortsreferenz.'
