  terminology: „Bund“ und „übertreten“ bewahren die bundesrechtliche Terminologie. „Adam“ als Hauptlesart ist vertretbar; die Fußnote erhält angemessen die lexikalisch reale Alternative einer generischen Bedeutung von אָדָם. „Mir untreu geworden“ gibt בָּגְדוּ בִי natürlich und persönlich wieder, ohne zusätzliche theologische Festlegung.
