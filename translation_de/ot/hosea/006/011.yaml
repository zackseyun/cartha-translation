base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/011.yaml
  text: Also for you[a], Judah, a harvest is appointed[b], when I restore the fortunes of my people.
translation:
  language: de
  text: Auch für dich, Juda, ist eine Ernte bestimmt,[a] wenn ich das Geschick meines Volkes wende.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist eine Ernte festgesetzt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wenn ich die Gefangenschaft meines Volkes wende“. Die hebräische Wendung kann auch bedeuten, dass Gott das Geschick seines Volkes wiederherstellt.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Bewahrt die additive Kraft und bezieht Juda in die vorausgehende Aussage ein.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Übliche deutsche Form des Namens für das Südreich beziehungsweise dessen Volk.
- source_word: שָׁת
  choice: ist … bestimmt
  rationale: Das Verb bedeutet „setzen, hinstellen, festsetzen“. Die passive deutsche Form gibt den Sinn idiomatisch wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes Subjekt einzuführen.
- source_word: קָצִיר
  choice: eine Ernte
  rationale: Gibt die Grundbedeutung wieder und lässt offen, ob die Metapher Gericht oder Segen bezeichnet.
- source_word: לָךְ
  choice: für dich
  rationale: Die feminine Singularform bezieht sich auf Juda als personifizierte Größe; „für dich“ ist im Deutschen natürlich.
- source_word: בְּשׁוּבִי
  choice: wenn ich … wende
  rationale: Die Infinitivkonstruktion mit Suffix der ersten Person bezeichnet hier den Zeitpunkt des göttlichen Eingreifens und gehört zur festen Wendung mit שְׁבוּת.
- source_word: שְׁבוּת
  choice: das Geschick
  rationale: In der prophetischen Formel bezeichnet das Wort häufig die Wiederherstellung beziehungsweise Wendung einer Notlage; „das Geschick wenden“ bewahrt den idiomatischen Sinn. Die formal mögliche Wiedergabe mit „Gefangenschaft“ steht in der Fußnote.
- source_word: עַמִּי
  choice: meines Volkes
  rationale: Direkte Wiedergabe der geläufigen Bundesbezeichnung „mein Volk“ im deutschen Genitiv nach „Geschick“.
theological_decisions:
- issue: Ob „Ernte“ im Haupttext als Gericht oder als Segen auszulegen ist
  choice: 'Die Metapher bleibt unbestimmt: „eine Ernte“.'
  alternative: „eine Ernte des Gerichts“ oder „eine Ernte des Segens“.
  rationale: Der nähere Kontext legt Gericht nahe, während der folgende Satz von der Wiederherstellung des Volkes spricht. Die Übersetzung bewahrt diese Spannung und fügt keine eindeutige Deutung hinzu.
- issue: Wie die Wiederherstellungsformel בְּשׁוּבִי שְׁבוּת עַמִּי zu verstehen ist
  choice: „wenn ich das Geschick meines Volkes wende“
  alternative: „wenn ich die Gefangenschaft meines Volkes zurückführe“
  rationale: Die Formel kann eine umfassende Wendung der Notlage bezeichnen und muss nicht ausschließlich eine buchstäbliche Gefangenschaft meinen. Die alternative formale Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Wendung „Auch für dich“ folgt der hebräischen Hervorhebung. „Das Geschick wenden“ ist idiomatisch und zugleich gehoben genug für einen prophetischen Text.
