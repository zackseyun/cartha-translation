source:
  edition: WLC
  text: וְ/נֵדְעָ֣ה נִרְדְּפָ֗ה לָ/דַ֨עַת֙ אֶת יְהוָ֔ה כְּ/שַׁ֖חַר נָכ֣וֹן מֽוֹצָא֑/וֹ וְ/יָב֤וֹא כַ/גֶּ֨שֶׁם֙ לָ֔/נוּ כְּ/מַלְק֖וֹשׁ י֥וֹרֶה אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/003.yaml
  text: So let us know[a]; let us press on to know Yahweh. His going forth is as sure as the dawn, and he will come to us like the rain[d][c][b], like the spring rain that waters the earth.
translation:
  language: de
  text: So lasst uns erkennen; lasst uns danach streben, Yahweh zu erkennen.[a] Sein Hervortreten[b] ist so gewiss wie die Morgenröte, und er wird zu uns kommen[c] wie der Regen, wie der Frühlingsregen[d], der die Erde tränkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb kann auch mit „verfolgen“ oder „nachjagen“ wiedergegeben werden; gemeint ist, beharrlich danach zu streben, Yahweh zu erkennen.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „sein Hervorgehen“; möglicherweise ist sein Erscheinen gemeint.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Möge er zu uns kommen.“ Die hebräische Verbform kann als Wunsch verstanden werden; der Zusammenhang erlaubt ebenso die zuversichtliche Zukunftsaussage „er wird kommen“.'
    reason: alternative_reading
  - marker: d
    text: Der „Frühlingsregen“ ist der späte jahreszeitliche Regen, der für das Reifen der Feldfrüchte wichtig war; traditionell wird er „Spätregen“ genannt.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֵדְעָה
  choice: So lasst uns erkennen
  rationale: Der Kohortativ lädt gemeinsam zum Erkennen ein. „So“ gibt im Zusammenhang die folgernde Fortsetzung des vorangehenden Aufrufs natürlich wieder.
- source_word: נִרְדְּפָה לָדַעַת
  choice: lasst uns danach streben, … zu erkennen
  rationale: רדף bedeutet wörtlich „verfolgen, nachjagen“ und bezeichnet hier das beharrliche Bemühen, Yahweh zu erkennen. „Danach streben“ bewahrt die Zielstrebigkeit in natürlichem Deutsch.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְּשַׁחַר נָכוֹן מוֹצָאוֹ
  choice: Sein Hervortreten ist so gewiss wie die Morgenröte
  rationale: נכון drückt Festigkeit beziehungsweise Gewissheit aus; מוצא bezeichnet ein Hervorgehen oder Hervortreten. Die Formulierung bewahrt Bild und Aussage der hebräischen Wendung.
- source_word: וְיָבוֹא
  choice: und er wird … kommen
  rationale: Der Imperfekt wird im Zusammenhang mit der Gewissheit der Morgenröte als zuversichtliche Zukunftsaussage verstanden; die mögliche Wunschbedeutung bleibt in einer Fußnote erhalten.
- source_word: כַגֶּשֶׁם
  choice: wie der Regen
  rationale: גשם ist die allgemeine Bezeichnung für Regen und eröffnet das Bild der lebensspendenden Ankunft Yahwehs.
- source_word: כְּמַלְקוֹשׁ
  choice: wie der Frühlingsregen
  rationale: מלקוש bezeichnet den späten jahreszeitlichen Regen, der im Frühjahr für das Reifen der Feldfrüchte wichtig ist. „Frühlingsregen“ ist für heutige Leser verständlicher als „Spätregen“.
- source_word: יוֹרֶה אָרֶץ
  choice: der die Erde tränkt
  rationale: Die Verbform beschreibt hier das Regnen auf das Land beziehungsweise dessen Bewässerung. „Die Erde tränkt“ gibt das lebensspendende Bild knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR / Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Umschrift „Yahweh“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Aussageweise von וְיָבוֹא
  choice: 'zuversichtliche Zukunftsaussage: „er wird kommen“'
  alternative: 'Wunsch: „möge er kommen“'
  rationale: Der Vergleich mit der zuverlässig wiederkehrenden Morgenröte stützt eine Aussage fester Erwartung. Da die Verbform jedoch auch als Wunsch verstanden werden kann, wird diese Spannung in der Fußnote offengehalten.
- issue: Bedeutungsweite von ידע
  choice: erkennen
  alternative: anerkennen
  rationale: „Erkennen“ bewahrt sowohl den kognitiven als auch den persönlichen und bundeshaften Sinn, ohne die Bedeutung auf bloße Kenntnis oder Anerkennung einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer hortativer Bewegung. Das semikolongetrennte Doppelglied bildet den hebräischen Parallelismus ab. „Hervortreten“ erhält das ungewöhnliche Ausgangsbild, während die Fußnote die mögliche Bedeutung „Erscheinen“ erklärt.
