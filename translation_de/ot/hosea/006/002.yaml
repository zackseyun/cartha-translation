source:
  edition: WLC
  text: יְחַיֵּ֖/נוּ מִ/יֹּמָ֑יִם בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י יְקִמֵ֖/נוּ וְ/נִחְיֶ֥ה לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/002.yaml
  text: He will revive us after two days[a]; on the third day he will raise us up[d][c][b], that we may live before him.
translation:
  language: de
  text: Nach zwei Tagen[a] wird er uns wieder lebendig machen; am dritten Tag[c] wird er uns aufrichten[b], und wir werden vor ihm[d] leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In zwei Tagen“. Die hebräische Zeitangabe kann einen kurzen Zeitraum bezeichnen, der in den dritten Tag mündet.'
    reason: lexical_alternative
  - marker: b
    text: „Aufrichten“ kann hier auch allgemeiner „wiederherstellen“ oder „auf die Füße stellen“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Viele Christen sehen in der Formulierung „am dritten Tag“ einen typologischen Vorausblick auf die Auferstehung des Messias; unmittelbar spricht der Vers jedoch von der Wiederherstellung des Volkes.
    reason: cross_reference
  - marker: d
    text: 'Oder: „in seiner Gegenwart“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֵּנוּ
  choice: wird er uns wieder lebendig machen
  rationale: Das Piel von חיה bezeichnet hier kausativ das Wiederbeleben. Die Formulierung bewahrt die Lebenskraft des Verbs und passt zum Bild der Wiederherstellung nach einem todähnlichen Zustand.
- source_word: מִיֹּמָיִם
  choice: nach zwei Tagen
  rationale: Die Präposition מִן bei der Zeitangabe wird hier idiomatisch als „nach“ verstanden. Möglich ist auch „in zwei Tagen“, da die Wendung einen kurzen Zeitraum bis zum dritten Tag bezeichnen kann.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: am dritten Tag
  rationale: Dies ist die natürliche deutsche Wiedergabe der gewöhnlichen hebräischen Zeitangabe und erhält die Abfolge der beiden Zeitbestimmungen.
- source_word: יְקִימֵנוּ
  choice: wird er uns aufrichten
  rationale: Das Hifil von קום kann ein Aufrichten, Aufstehenlassen oder Wiederherstellen bezeichnen. „Aufrichten“ hält sowohl die konkrete Bildsprache als auch den weiteren Sinn der Wiederherstellung offen.
- source_word: וְנִחְיֶה
  choice: und wir werden leben
  rationale: Das וְ wird als Fortführung beziehungsweise Folge wiedergegeben. Anders als eine ausdrückliche Zweckformulierung bewahrt dies die grammatische Offenheit der hebräischen Satzverbindung.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Die unmittelbare Entsprechung von לְפָנָיו ist im Deutschen idiomatisch und kann zugleich das Leben in Gottes Gegenwart ausdrücken.
theological_decisions:
- issue: Direkte messianische Auferstehungsprophetie oder Aussage über die gemeinschaftliche Wiederherstellung
  choice: Der Haupttext bewahrt die erste Person Plural und spricht unmittelbar von der Wiederbelebung und Aufrichtung des Volkes.
  alternative: Die Wendung „am dritten Tag“ wird von vielen Christen typologisch auf die Auferstehung des Messias bezogen.
  rationale: Der hebräische Wortlaut handelt direkt von „uns“. Eine christologische Typologie ist möglich, soll aber nicht als alleinige unmittelbare Bedeutung in den Übersetzungstext eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wieder lebendig machen“ gibt den kausativen Sinn verständlich wieder; „aufrichten“ wahrt die bildhafte und theologisch offene Sprache. Die Marker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
