  text: וּ/כְ/חַכֵּ֨י אִ֜ישׁ גְּדוּדִ֗ים חֶ֚בֶר כֹּֽהֲנִ֔ים דֶּ֖רֶךְ יְרַצְּחוּ שֶׁ֑כְמָ/ה כִּ֥י זִמָּ֖ה עָשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/009.yaml
  text: And like men lying in wait[a], a band of priests murders on the way to Shechem; indeed[b], they have committed wickedness.
translation:
  language: de
  text: Und wie Männer, die auflauern[a], so mordet eine Schar von Priestern auf dem Weg nach Sichem; ja, sie haben eine Schandtat[b] begangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist schwierig; auch möglich: „Wie Räuber einem Mann auflauern, so mordet eine Schar von Priestern auf dem Weg nach Sichem.“'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Frevel“, „Bosheit“. Das hebräische Wort bezeichnet eine abscheuliche oder empörende Tat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְחַכֵּי אִישׁ גְּדוּדִים
  choice: Und wie Räuber einem Mann auflauern
  rationale: Die schwierige, gedrängte Wendung wird als Vergleich mit räuberischen Wegelagerern verstanden. Die Fassung bildet die möglichen Rollen von אִישׁ und גְּדוּדִים transparent ab, ohne die Gewaltmetaphorik abzuschwächen.
- source_word: חֶבֶר כֹּהֲנִים
  choice: eine Schar von Priestern
  rationale: חֶבֶר bezeichnet hier eine verbundene Gruppe; „Schar“ ist natürlich und trägt im Kontext den bedrohlichen Klang.
- source_word: דֶּרֶךְ
  choice: auf dem Weg nach
  rationale: Die Ortsangabe wird im Deutschen idiomatisch wiedergegeben und bleibt nahe bei der Grundbedeutung „Weg“.
- source_word: יְרַצְּחוּ
  choice: mordet
  rationale: רצח bezeichnet schuldhaftes Töten beziehungsweise Mord, nicht lediglich neutrales Töten.
- source_word: שֶׁכְמָה
  choice: nach Sichem
  rationale: Der Ortsname trägt die Richtungsendung -ה; „nach Sichem“ gibt diese Bewegungsrichtung wieder.
- source_word: כִּי
  choice: ja
  rationale: כִּי wird hier als bekräftigende beziehungsweise erläuternde Partikel verstanden; „ja“ passt zum prophetischen Anklageton.
- source_word: זִמָּה
  choice: Schandtat
  rationale: Das Wort bezeichnet eine abscheuliche, empörende Tat. „Schandtat“ wahrt die moralische Schwere, ohne die Bedeutung unnötig auf sexuelle Verfehlung einzuengen.
- source_word: עָשׂוּ
  choice: sie haben … begangen
  rationale: Das Perfekt stellt die Tat als vollzogen dar; „eine Schandtat begehen“ ist eine natürliche deutsche Verbindung.
theological_decisions:
- issue: Deutung der schwierigen Anfangswendung וּכְחַכֵּי אִישׁ גְּדוּדִים
  choice: Die Priesterschar wird mit Räubern verglichen, die einem Mann auflauern.
  alternative: '„Wie Männer im Hinterhalt“ beziehungsweise: „Wie Räuber einem Mann auflauern, so …“; der hebräische Text kann auch elliptisch oder textlich unsicher verstanden werden.'
  rationale: Der hebräische Satzbau ist ungewöhnlich und mehrdeutig. Der Haupttext bewahrt das Bild eines räuberischen Hinterhalts; die Fußnote weist auf die sprachliche Schwierigkeit und eine weniger spezifische Wiedergabe hin, statt die Unsicherheit zu verschweigen.
- issue: Bedeutungsumfang von זִמָּה
  choice: Schandtat
  alternative: Frevel; Bosheit; abscheuliche Tat
  rationale: Im Zusammenhang ist eine schwere, empörende Tat gemeint. Eine sexuelle Eingrenzung, die das Wort andernorts haben kann, wird hier nicht vorausgesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sichem“ folgt der etablierten deutschen Form des Ortsnamens. Der Vergleich wird mit „so“ syntaktisch verdeutlicht; die echte Unsicherheit des hebräischen Anfangs bleibt durch Fußnote [a] sichtbar.
