source:
  edition: WLC
  text: עַל כֵּ֗ן חָצַ֨בְתִּי֙ בַּ/נְּבִיאִ֔ים הֲרַגְתִּ֖י/ם בְּ/אִמְרֵי פִ֑/י וּ/מִשְׁפָּטֶ֖י/ךָ א֥וֹר יֵצֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/005.yaml
  text: Therefore I have hewn them by the prophets; I have slain them by the words of my mouth[a], and my judgments go forth like light.
translation:
  language: de
  text: Darum habe ich sie durch die Propheten behauen; ich habe sie durch die Worte meines Mundes getötet, und deine Urteile treten als Licht hervor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, als kontextuelle Deutung: »und mein Gericht tritt als Licht hervor.« Der vokalisierte hebräische Text lautet jedoch: »deine Urteile«; manche verstehen aufgrund des Zusammenhangs Gottes Gericht oder Recht als gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Kennzeichnet knapp und natürlich die Folgerung aus der vorausgehenden Anklage.
- source_word: חָצַבְתִּי
  choice: habe ich sie … behauen
  rationale: Bewahrt das kräftige Bild des Behauens von Stein oder Holz, ohne es vorschnell als bloßes Strafen oder Formen auszudeuten.
- source_word: בַּנְּבִיאִים
  choice: durch die Propheten
  rationale: 'Gibt die instrumentale Funktion der Präposition wieder: Die Propheten sind das Mittel des göttlichen Handelns.'
- source_word: הֲרַגְתִּים
  choice: ich habe sie … getötet
  rationale: Entspricht der Härte des hebräischen Verbs in klarem, gegenwärtigem Standarddeutsch.
- source_word: בְּאִמְרֵי פִי
  choice: durch die Worte meines Mundes
  rationale: Erhält das konkrete Bild des göttlichen Redens und die Parallelität zu »durch die Propheten«.
- source_word: וּמִשְׁפָּטֶיךָ
  choice: und deine Urteile
  rationale: Folgt der Vokalisierung des vorliegenden masoretischen Textes mit dem Suffix der zweiten Person Singular. »Urteile« ist im heutigen Deutsch eindeutiger als »Gerichte«, das auch Institutionen bezeichnen kann.
- source_word: אוֹר
  choice: wie das Licht
  rationale: Die Vergleichspartikel ist im Hebräischen nicht ausgedrückt, doch die prädikative Bildaussage wird im Deutschen so natürlich und verständlich wiedergegeben.
- source_word: יֵצֵא
  choice: treten hervor
  rationale: Gibt das Hervorkommen beziehungsweise öffentliche Sichtbarwerden in einem würdigen poetischen Ausdruck wieder.
theological_decisions:
- issue: Bezug und Personalsuffix in וּמִשְׁפָּטֶיךָ
  choice: und deine Urteile treten hervor wie das Licht
  alternative: und mein Gericht tritt hervor wie das Licht
  rationale: Der vokalisierte masoretische Text bietet die zweite Person Singular und wird daher im Haupttext beibehalten, auch wenn die Aussage schwierig bleibt. Die kontextuell naheliegende Deutung auf Gottes eigenes Gericht wird in der Fußnote genannt, ohne die Spannung im Text stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Bildkraft. »Behauen« erhält die harte Metapher; »Urteile« vermeidet die im heutigen Deutsch naheliegende institutionelle Bedeutung von »Gerichte«.
