  terminology: „Fürsten“, „trügerischer Bogen“ und „durch das Schwert fallen“ sind angemessen. „Trügerischer Bogen“ lässt die Bedeutung eines unzuverlässigen bzw. schlaffen Bogens offen; die Erläuterung gehört in die zugehörige Fußnote. Die mögliche elliptische Deutung von לֹא עָל als Bezug auf den Höchsten darf nur als Alternative in der Fußnote erscheinen.
