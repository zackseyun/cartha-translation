source:
  edition: WLC
  text: יָשׁ֣וּבוּ לֹ֣א עָ֗ל הָיוּ֙ כְּ/קֶ֣שֶׁת רְמִיָּ֔ה יִפְּל֥וּ בַ/חֶ֛רֶב שָׂרֵי/הֶ֖ם מִ/זַּ֣עַם לְשׁוֹנָ֑/ם ז֥וֹ לַעְגָּ֖/ם בְּ/אֶ֥רֶץ מִצְרָֽיִם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/016.yaml
  text: They turn[a], but not upward; they are like a deceitful bow. Their princes will fall by the sword because of the insolence of their tongue[b]. This will be their mockery in the land of Egypt.
translation:
  language: de
  text: Sie kehren um, aber nicht nach oben[a]; sie sind wie ein trügerischer Bogen[b]. Ihre Fürsten werden durch das Schwert fallen wegen des Zorns ihrer Zunge. Das wird ihnen im Land Ägypten zum Spott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aber nicht zum Höchsten“. Diese Deutung versteht „nach oben“ als verkürzten Bezug auf Gott, beeinflusst durch die Bezeichnung „der Höchste“ im vorigen Vers.'
    reason: alternative_reading
  - marker: b
    text: „Ein trügerischer Bogen“ kann auch einen schlaffen, treulosen oder fehlerhaften Bogen bezeichnen – einen Bogen, auf den kein Verlass ist und der nicht treffsicher schießt.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: sie wenden sich
  rationale: שׁוב kann „umkehren“, „zurückkehren“ oder „sich wenden“ bedeuten. Im Zusammenhang geht es um eine religiöse und politische Wendung; „sich wenden“ bewahrt diese Offenheit.
- source_word: לֹא עָל
  choice: doch nicht nach oben
  rationale: Der schwierige hebräische Ausdruck lautet wörtlich etwa „nicht nach oben“. Die Übersetzung lässt die ungewöhnliche Richtungsangabe stehen, statt die mögliche Gottesbezeichnung ausdrücklich in den Haupttext einzutragen.
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: wie ein trügerischer Bogen
  rationale: רְמִיָּה bezeichnet Trug, Treulosigkeit oder Unzuverlässigkeit. Beim Bogen ist ein Gerät gemeint, auf das kein Verlass ist und das sein Ziel verfehlt.
- source_word: יִפְּלוּ בַחֶרֶב
  choice: werden durch das Schwert fallen
  rationale: Die geläufige Gerichtssprache bezeichnet den gewaltsamen Tod durch das Schwert.
- source_word: שָׂרֵיהֶם
  choice: ihre Fürsten
  rationale: שַׂר kann einen Fürsten, Machthaber oder hohen Amtsträger bezeichnen. „Fürsten“ erhält den gehobenen politischen Klang.
- source_word: מִזַּעַם לְשׁוֹנָם
  choice: weil ihre Zunge wütet
  rationale: זַעַם bezeichnet Zorn, Grimm oder Wüten. Die verbale Fassung ist im Deutschen verständlicher als „wegen des Zorns ihrer Zunge“ und bewahrt zugleich das Bild der Zunge.
- source_word: זֹו לַעְגָּם
  choice: Das wird ihnen zum Spott
  rationale: 'Die Formulierung gibt die resultative Bedeutung natürlich wieder: Das angekündigte Geschick macht sie zum Gegenstand des Spotts.'
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die volle Ortsbezeichnung wahrt den prophetischen Sprachklang des Hebräischen.
theological_decisions:
- issue: Deutung von לֹא עָל
  choice: „doch nicht nach oben“ im Haupttext
  alternative: „doch nicht zum Höchsten“
  rationale: Der Vers nennt den „Höchsten“ nicht ausdrücklich, obwohl der vorherige Vers diese Gottesbezeichnung enthält und sie als elliptisch mitzudenken sein kann. Die wörtlichere Richtungsangabe im Haupttext bewahrt die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwierige Wendung „nicht nach oben“ bleibt bewusst ungewöhnlich, um die Unbestimmtheit des hebräischen Textes nicht aufzulösen. Das Körperbild der wütenden Zunge und die traditionelle Gerichtssprache vom Fallen durch das Schwert werden erhalten.
