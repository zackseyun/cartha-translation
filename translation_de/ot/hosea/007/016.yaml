  to: Sie kehren um, aber nicht nach oben[a]; sie sind wie ein trügerischer Bogen[b]. Ihre Fürsten werden durch das Schwert fallen wegen des Zorns ihrer Zunge. Das wird ihnen im Land Ägypten zum Spott.
  rationale: Die Revision bewahrt die Mehrdeutigkeit von לֹא עָל im Haupttext und verlegt die erläuternde Alternative an den richtigen Anker. Sie stellt zugleich die nominale Bildsprache von מִזַּעַם לְשׁוֹנָם wieder her. Die Schlusswendung wird mit „zum Spott“ als natürliche resultative Wiedergabe von לַעְגָּם formuliert, ohne festzulegen, ob der Spott als Reaktion oder als zugeschriebene Schmach im Vordergrund steht.
