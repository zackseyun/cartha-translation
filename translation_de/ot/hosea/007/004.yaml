  text: כֻּלָּ/ם֙ מְנָ֣אֲפִ֔ים כְּמ֣וֹ תַנּ֔וּר בֹּעֵ֖רָה מֵֽ/אֹפֶ֑ה יִשְׁבּ֣וֹת מֵעִ֔יר מִ/לּ֥וּשׁ בָּצֵ֖ק עַד חֻמְצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/004.yaml
  text: All of them are adulterers[a], like an oven heated by a baker[c][b], who stops stirring from the kneading of the dough until its leavening.
translation:
  language: de
  text: Sie alle sind Ehebrecher, wie ein vom Bäcker angeheizter Ofen.[a] Der Bäcker hört auf, ihn zu schüren,[b] vom Kneten des Teigs an bis zu seiner Durchsäuerung.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie ein brennender Ofen«. Das hebräische Partizip kann stärker den brennenden Zustand beziehungsweise die aktive Hitze des Ofens hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit dem Anfachen aufhört« beziehungsweise »aufhört, darin zu rühren«. Das hebräische Verb ist an dieser Stelle schwierig und kann das Unterhalten des Ofenfeuers bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »bis der Teig aufgegangen ist«. Das hebräische Wort bezeichnet wahrscheinlich den Vorgang der Gärung oder Durchsäuerung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Sie alle
  rationale: Die Wendung bezeichnet die gesamte angeklagte Gruppe und bewahrt in natürlichem Deutsch den umfassenden, nachdrücklichen Sinn.
- source_word: מְנָאֲפִים
  choice: Ehebrecher
  rationale: Das Partizip wird substantivisch im Plural gebraucht. »Ehebrecher« erhält die konkrete moralische Anklage, ohne die in Hosea mögliche übertragene Bedeutung der Bundestreue ausdrücklich einzutragen.
- source_word: כְּמוֹ תַנּוּר
  choice: wie ein Ofen
  rationale: Die Vergleichspartikel und das Bild eines zum Backen bestimmten Ofens werden direkt und idiomatisch wiedergegeben.
- source_word: בֹּעֵרָה
  choice: angeheizt wird
  rationale: Das feminine Partizip beschreibt den heißen beziehungsweise brennenden Zustand des Ofens. »Angeheizt« passt zum Bäckerbild; die aktivere Wiedergabe »brennt« bleibt als Alternative in der Fußnote erhalten.
- source_word: מֵאֹפֶה
  choice: vom Bäcker
  rationale: Die Präposition wird im Zusammenhang des Vergleichs als Angabe des Urhebers verstanden. So ergibt sich im Deutschen ein klares und natürliches Bild.
- source_word: יִשְׁבּוֹת
  choice: Er hört auf
  rationale: Das Verb bedeutet »aufhören« oder »ruhen«. Das männliche Subjekt wird im Kontext am plausibelsten auf den Bäcker bezogen.
- source_word: מֵעִיר
  choice: ihn zu schüren
  rationale: Die schwierige Form hat den Grundsinn des Erweckens beziehungsweise Anfachens. Im Ofenbild bezeichnet »schüren« wahrscheinlich das Unterhalten oder Anfachen des Feuers, ohne die Unsicherheit zu verschweigen.
- source_word: מִלּוּשׁ בָּצֵק
  choice: nachdem er den Teig geknetet hat
  rationale: Die hebräische Wendung markiert den Beginn der Zeitspanne beim Kneten des Teigs. Die temporale Nebensatzform ist im modernen Deutsch klarer als das formale »vom Kneten an«.
- source_word: עַד חֻמְצָתוֹ
  choice: bis dieser durchsäuert ist
  rationale: Die Form bezeichnet den Vorgang beziehungsweise erreichten Zustand der Gärung oder Durchsäuerung. »Durchsäuert« bleibt nahe am hebräischen Wortfeld; »aufgegangen« ist eine mögliche kontextuelle Wiedergabe.
theological_decisions:
- issue: Soll »Ehebrecher« ausdrücklich als geistlicher oder bundesbezogener Ehebruch erklärt werden?
  choice: Die konkrete Bezeichnung »Ehebrecher« bleibt ohne erläuternde Erweiterung im Haupttext.
  alternative: »bundesuntreue Menschen« oder »Ehebrecher«, ausdrücklich auf Untreue gegenüber Gott bezogen
  rationale: Hosea verwendet Ehebruch häufig als Bild für die Verletzung des Bundes. Der Vers selbst gebraucht jedoch die konkrete Bezeichnung. Die unveränderte Wiedergabe bewahrt die mögliche wörtliche und metaphorische Spannung.
- issue: Wer hört auf und welche Tätigkeit wird unterbrochen?
  choice: Der Bäcker hört auf, den Ofen zu schüren.
  alternative: Unpersönliche oder anders bezogene Wiedergabe; der Bäcker hört mit dem Rühren beziehungsweise Anfachen auf.
  rationale: Das maskuline Verb lässt sich am natürlichsten auf den zuvor genannten Bäcker beziehen. Da das Objekt und die genaue Tätigkeit nicht ausdrücklich genannt sind, wird die verbleibende Unsicherheit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlichem Bäckerbild. Der Satzbau wurde für natürliche Lesbarkeit leicht gegliedert. Fachsprachliches »fermentiert« wurde im Haupttext vermieden; echte lexikalische und syntaktische Unsicherheiten werden in den Fußnoten bewahrt.
