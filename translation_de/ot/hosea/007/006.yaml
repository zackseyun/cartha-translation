source:
  edition: WLC
  text: כִּֽי קֵרְב֧וּ כַ/תַּנּ֛וּר לִבָּ֖/ם בְּ/אָרְבָּ֑/ם כָּל הַ/לַּ֨יְלָה֙ יָשֵׁ֣ן אֹֽפֵ/הֶ֔ם בֹּ֕קֶר ה֥וּא בֹעֵ֖ר כְּ/אֵ֥שׁ לֶהָבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/006.yaml
  text: For they draw near with their hearts like an oven in their lying in wait[a]; all night their baker sleeps[b], but in the morning it burns like a flaming fire.
translation:
  language: de
  text: Denn sie kommen näher mit Herzen, die wie Öfen glühen, während sie auf der Lauer liegen[a]. Die ganze Nacht schläft ihr Bäcker[b]; am Morgen brennt er wie ein loderndes Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „bei ihrem Hinterhalt“ oder „während sie im Hinterhalt lauern“. Der hebräische Ausdruck bezeichnet das lauernde Planen eines Angriffs.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihr Bäcker“. Im fortgeführten Ofenbild bezeichnet dies wahrscheinlich bildlich denjenigen, der ihre erhitzte Leidenschaft oder ihren Anschlag anfacht.'
    reason: cultural_note
lexical_decisions:
- source_word: קֵרְבוּ
  choice: sie kommen näher
  rationale: Das qal Perfekt 3. Person Plural von קרב bezeichnet eine Annäherung. Die Wiedergabe bewahrt das Bewegungsbild, ohne ein im Hebräischen nicht ausdrücklich genanntes Ziel einzusetzen.
- source_word: כַתַּנּוּר לִבָּם
  choice: mit Herzen wie ein Ofen
  rationale: Die ausdrückliche Vergleichspartikel כ wird mit „wie“ wiedergegeben. Der Plural „Herzen“ entspricht im Deutschen natürlich dem pluralischen Subjekt, obwohl das Hebräische das kollektiv gebrauchte לֵב im Singular hat.
- source_word: בְּאָרְבָּם
  choice: während sie auf der Lauer liegen
  rationale: Die Form von ארב bezeichnet das Lauern beziehungsweise Warten im Hinterhalt. Die verbale Wiedergabe ist im Deutschen idiomatisch und erhält den Gedanken eines geplanten Angriffs.
- source_word: יָשֵׁן
  choice: schläft
  rationale: Die knappe finite Wiedergabe entspricht dem prädikativen Gebrauch und klingt im Deutschen natürlich.
- source_word: אֹפֵהֶם
  choice: ihr Bäcker
  rationale: Die wörtliche Bezeichnung wird beibehalten, damit das fortgeführte Ofenbild sichtbar bleibt und die bildliche Rolle nicht vorschnell festgelegt wird.
- source_word: בֹעֵר
  choice: brennt
  rationale: Das aktive Partizip von בער wird schlicht mit „brennt“ wiedergegeben; die folgende Feuerwendung steigert das Bild.
- source_word: כְאֵשׁ לֶהָבָה
  choice: wie ein loderndes Feuer
  rationale: „Loderndes Feuer“ gibt die verstärkende Verbindung von Feuer und Flamme in natürlichem, bildkräftigem Deutsch wieder.
theological_decisions:
- issue: Subjekt und Handlungsträger im Ofenbild
  choice: Die Herzen der Verschwörer werden mit einem Ofen verglichen; „ihr Bäcker“ bleibt als Bestandteil des Bildes stehen.
  alternative: Man kann die schwierige Syntax auch so verstehen, dass die Verschwörer sich mit ofenheißen Herzen einem nicht genannten Ziel, etwa dem König oder ihrer Intrige, nähern.
  rationale: Der hebräische Satz ist stark verdichtet und lässt Ziel und genaue Zuordnung des Bildes offen. Die Übersetzung bewahrt diese Spannung und legt weder die Identität des „Bäckers“ noch das Ziel der Annäherung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, verdichtete Bildsprache des Hebräischen bleibt erkennbar; die Zeichensetzung unterstützt die Lesbarkeit, ohne die syntaktische Mehrdeutigkeit stärker als nötig aufzulösen.
