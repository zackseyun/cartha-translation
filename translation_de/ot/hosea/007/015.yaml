  text: וַ/אֲנִ֣י יִסַּ֔רְתִּי חִזַּ֖קְתִּי זְרֽוֹעֹתָ֑/ם וְ/אֵלַ֖/י יְחַשְּׁבוּ רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/015.yaml
  text: Though I trained and strengthened their arms[a], yet they devise evil against me.
translation:
  language: de
  text: Ich aber habe sie ausgebildet[a] und ihre Arme gestärkt, doch sie planen Böses gegen mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unterwiesen«, »diszipliniert« oder »gezüchtigt«; das hebräische Verb kann sowohl formende Unterweisung als auch korrigierende Zucht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסַּרְתִּי
  choice: ich sie trainiert habe
  rationale: יסר kann erziehen, unterweisen, disziplinieren oder züchtigen bedeuten. Zusammen mit dem Stärken der Arme liegt hier eine formende, zurüstende Handlung nahe. „Trainiert“ bewahrt zugleich den körperlich-militärischen Anklang, ohne die korrigierende Bedeutungsmöglichkeit zu verschweigen; diese wird in der Fußnote genannt.
- source_word: חִזַּקְתִּי
  choice: gestärkt
  rationale: Das Piel von חזק bezeichnet hier unmittelbar das Starkmachen oder Stärken.
- source_word: זְרוֹעֹתָם
  choice: ihre Arme
  rationale: Die konkrete Körpermetapher des Hebräischen bleibt erhalten; eine Verallgemeinerung zu „ihre Kraft“ ist nicht nötig.
- source_word: וְאֵלַי
  choice: gegen mich
  rationale: Wörtlich steht „zu/auf mich hin“. In Verbindung mit dem Planen von Bösem drückt die Wendung eine gegen Gott gerichtete Absicht aus.
- source_word: יְחַשְּׁבוּ רָע
  choice: planen sie Böses
  rationale: חשב mit רע meint hier nicht bloß einen bösen Gedanken, sondern das Ausdenken oder Planen von Bösem. „Böses planen“ ist gegenwärtiges, klares Deutsch.
- source_word: וַאֲנִי
  choice: Obwohl ich
  rationale: Die Verbindung hebt den Gegensatz zwischen Gottes stärkendem Handeln und Israels feindlicher Antwort hervor. Die konzessive Wiedergabe macht diesen Zusammenhang im Deutschen natürlich verständlich.
theological_decisions:
- issue: Art von Gottes Handeln in יִסַּרְתִּי
  choice: formende und zurüstende Handlung („trainiert“) im Haupttext
  alternative: „diszipliniert“, „zurechtgewiesen“ oder „gezüchtigt“
  rationale: Der Parallelismus mit „ihre Arme gestärkt“ begünstigt eine positive, zurüstende Bedeutung. Da das Verb auch korrigierende oder strafende Zucht bezeichnen kann, wird diese echte Mehrdeutigkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Trainiert“ ist bewusst konkret gewählt und passt zum Bild der gestärkten Arme; die mögliche korrigierende beziehungsweise strafende Nuance wird nicht in den Haupttext eingetragen, aber in der Fußnote ausdrücklich erhalten.
