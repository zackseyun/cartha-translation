source:
  edition: WLC
  text: וּ/בַל יֹֽאמְרוּ֙ לִ/לְבָבָ֔/ם כָּל רָעָתָ֖/ם זָכָ֑רְתִּי עַתָּה֙ סְבָב֣וּ/ם מַֽעַלְלֵי/הֶ֔ם נֶ֥גֶד פָּנַ֖/י הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/002.yaml
  text: And they do not say in their heart that I remember all their evil[a]. Now their deeds surround them[c][b]; they are before my face.
translation:
  language: de
  text: Und sie sagen sich nicht[a], dass ich mich an all ihre Bosheit[b] erinnere. Nun umringen ihre Taten sie; sie stehen mir vor Augen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu ihrem Herzen sagen“; gemeint ist das innere Sprechen oder Überlegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „all ihr Böses“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „vor meinem Angesicht“; die Wendung bezeichnet, dass ihre Taten Gottes unmittelbarer Wahrnehmung und Prüfung ausgesetzt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַל
  choice: Und sie … nicht
  rationale: Die Verbindung führt die fortlaufende Anklage weiter. „Und“ bewahrt den hebräischen Gedankenfluss, ohne einen nicht zwingend ausgedrückten Gegensatz einzutragen.
- source_word: יֹאמְרוּ לִלְבָבָם
  choice: sie sagen sich
  rationale: Die Wendung lautet wörtlich „zu ihrem Herzen sagen“ und bezeichnet das innere Sprechen beziehungsweise Überlegen. „Sich sagen“ gibt das Idiom in natürlichem Deutsch wieder; die konkrete hebräische Bildsprache wird in einer Fußnote erläutert.
- source_word: כָּל רָעָתָם
  choice: all ihre Bosheit
  rationale: רָעָה bezeichnet hier die Gesamtheit ihres moralisch Bösen. „Bosheit“ ist im Deutschen gewichtig und kann sowohl ihre böse Haltung als auch deren Äußerungen umfassen.
- source_word: זָכָרְתִּי
  choice: ich mich … erinnere
  rationale: Das Perfekt beschreibt hier Gottes gegenwärtig wirksames Erinnern. Das deutsche Präsens drückt diese fortdauernde Wirklichkeit natürlich aus, ohne das im Quelltext verwendete Motiv des Erinnerns abzuschwächen.
- source_word: עַתָּה
  choice: Nun
  rationale: „Nun“ markiert knapp die gegenwärtige Folge davon, dass sie Gottes Erinnern nicht bedenken.
- source_word: סְבָבוּם
  choice: umringen … sie
  rationale: Das Verb bezeichnet ein Umgeben oder Einkreisen. „Umringen“ erhält das Bild, dass ihre eigenen Taten sie einschließen.
- source_word: מַעַלְלֵיהֶם
  choice: ihre Taten
  rationale: מַעֲלָל bezeichnet Taten oder Handlungen, im prophetischen Zusammenhang häufig mit negativer moralischer Färbung. „Taten“ ist klar und würdevoll.
- source_word: נֶגֶד פָּנַי
  choice: mir vor Augen
  rationale: Die Wendung bedeutet wörtlich „vor meinem Angesicht“. Das deutsche Idiom „mir vor Augen“ bewahrt sowohl die Bildlichkeit als auch den Sinn unmittelbarer Wahrnehmung und Prüfung.
- source_word: הָיוּ
  choice: sie stehen
  rationale: Das formale Perfekt bezeichnet im Zusammenhang den gegenwärtigen Zustand ihrer Taten vor Gott. „Stehen“ macht diesen Zustand idiomatisch sichtbar.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Wahrnehmung und Gericht
  choice: sie stehen mir vor Augen
  alternative: sie sind vor meinem Angesicht
  rationale: Die Übersetzung erhält das körperbezogene Bild unmittelbarer göttlicher Wahrnehmung, ohne durch eine hölzerne Formulierung Körperlichkeit über die Aussageabsicht des Textes hinaus nahezulegen.
- issue: Gottes Erinnern an Israels Bosheit
  choice: dass ich mich an all ihre Bosheit erinnere
  alternative: dass ich all ihre Bosheit im Gedächtnis behalte
  rationale: „Sich erinnern“ hält sich eng an זכר und bewahrt die mögliche Spannung zwischen Erinnern als Wissen und Erinnern mit Blick auf Rechenschaft beziehungsweise Gericht, ohne diese ausdrücklich aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Satzhälfte gibt das hebräische Idiom natürlich wieder, während die Fußnote dessen konkrete Form bewahrt. „Umringen“ erhält die eindringliche Metapher; „mir vor Augen“ ist ein geläufiges deutsches Bild für die unmittelbare Gegenwart und Wahrnehmung.
