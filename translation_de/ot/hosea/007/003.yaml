  text: בְּ/רָעָתָ֖/ם יְשַׂמְּחוּ מֶ֑לֶךְ וּ/בְ/כַחֲשֵׁי/הֶ֖ם שָׂרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/003.yaml
  text: By their evil they make the king glad[a], and by their lies the princes.
translation:
  language: de
  text: Durch ihre Bosheit erfreuen sie den König und durch ihre Lügen die Fürsten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die hohen Beamten.'
    reason: שָׂרִים kann hochrangige höfische oder politische Amtsträger bezeichnen; „Fürsten“ bewahrt den königlich-höfischen Rang im Haupttext.
lexical_decisions:
- source_word: בְּרָעָתָם
  choice: Durch ihre Bosheit
  rationale: Die Präposition ב bezeichnet hier am ehesten das Mittel. „Bosheit“ gibt רָעָה knapp und natürlich wieder und bewahrt den kollektiven Singular.
- source_word: יְשַׂמְּחוּ
  choice: erfreuen sie
  rationale: 'Der Piel von שׂמח hat kausative Bedeutung: Sie bewirken, dass der König sich freut. „Erfreuen“ gibt dies im Deutschen knapp und idiomatisch wieder.'
- source_word: מֶלֶךְ
  choice: den König
  rationale: Obwohl das hebräische Substantiv keinen Artikel trägt, ist im Zusammenhang ein bestimmter israelitischer König gemeint; im Deutschen ist daher der bestimmte Artikel angebracht.
- source_word: וּבְכַחֲשֵׁיהֶם
  choice: und durch ihre Lügen
  rationale: כחשׁ kann Lüge, Falschheit oder Täuschung bezeichnen. „Lügen“ ist hier direkt, verständlich und bildet eine klare Parallele zu „Bosheit“.
- source_word: שָׂרִים
  choice: die führenden Männer
  rationale: שׂרים bezeichnet hochrangige politische oder höfische Amtsträger. „Führende Männer“ ist im modernen Deutsch verständlich und vermeidet die mögliche Fehlvorstellung, es müsse sich um Königssöhne handeln; die traditionelle Alternative „Fürsten“ wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Knappes, parallel gebautes modernes Standarddeutsch. Die Wiederholung von „durch“ erhält die instrumentale Struktur beider Vershälften; „führende Männer“ ist allgemein verständlich und entspricht dem höfisch-politischen Zusammenhang.
