source:
  edition: WLC
  text: אֶפְרַ֕יִם בָּ/עַמִּ֖ים ה֣וּא יִתְבּוֹלָ֑ל אֶפְרַ֛יִם הָיָ֥ה עֻגָ֖ה בְּלִ֥י הֲפוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/008.yaml
  text: Ephraim mixes himself among the peoples[b][a]; Ephraim has become a cake not turned.
translation:
  language: de
  text: Ephraim mischt sich unter die Völker.[a] Ephraim ist zu einem Fladenbrot geworden, das nicht gewendet wurde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ephraim vermischt sich mit den Völkern.“'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist ein Brot, das beim Backen nicht gewendet wurde und deshalb auf einer Seite verbrannt, auf der anderen aber noch nicht durchgebacken ist.
    reason: cultural_note
lexical_decisions:
- source_word: יִתְבּוֹלָל
  choice: mischt sich unter
  rationale: Die reflexive Form beschreibt Ephraims eigenes Sichvermischen beziehungsweise Sichverflechten mit anderen Völkern. „Mischt sich unter“ ist im modernen Deutschen natürlich und bewahrt die aktive Beteiligung Ephraims.
- source_word: בָּעַמִּים
  choice: unter die Völker
  rationale: עַמִּים bezeichnet mehrere Völker. In Verbindung mit „mischt sich unter“ gibt „unter die Völker“ die Einordnung unter fremde Volksgruppen idiomatisch wieder, ohne den Ausdruck unnötig geopolitisch einzuengen.
- source_word: עֻגָה
  choice: Fladenbrot
  rationale: Das Wort bezeichnet hier ein rundes Brot beziehungsweise einen Brotfladen, der auf heißer Unterlage gebacken und gewendet werden musste. „Fladenbrot“ vermittelt das Bild im heutigen Deutschen genauer als „Kuchen“.
- source_word: בְּלִי הֲפוּכָה
  choice: das nicht gewendet wurde
  rationale: 'Die Formulierung bewahrt das konkrete Backbild: Das Brot wurde beim Backen nicht umgedreht. Sie vermeidet es, die daraus folgende einseitige Verbrennung und unvollständige Garung bereits in den Haupttext hineinzudeuten.'
- source_word: הָיָה
  choice: ist ... geworden
  rationale: Das Perfekt bezeichnet im Zusammenhang einen eingetretenen Zustand. „Ist ... geworden“ bringt sowohl den Übergang als auch das gegenwärtige Ergebnis zum Ausdruck.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der Eigenname wird beibehalten. Im Buch Hosea steht Ephraim häufig stellvertretend für das Nordreich Israel, doch die Übersetzung ersetzt den ausdrücklichen Namen nicht durch diese Deutung.
theological_decisions:
- issue: Bezug von „Ephraim“
  choice: Der Name Ephraim bleibt im Haupttext stehen und kann zugleich das Nordreich Israel repräsentieren.
  alternative: Israel; das Nordreich
  rationale: Der hebräische Text nennt ausdrücklich Ephraim. Eine Ersetzung durch „Israel“ oder „das Nordreich“ würde die im prophetischen Sprachgebrauch liegende repräsentative Bedeutung festlegen, statt die Form des Ausgangstextes zu bewahren.
- issue: Art von Ephraims Verbindung mit den Völkern
  choice: Die reflexive und aktive Beteiligung wird mit „mischt sich unter“ wiedergegeben.
  alternative: ist unter die Völker gemischt; ist mit den Völkern vermischt
  rationale: Die Verbform legt Ephraims eigene Beteiligung nahe. Die Übersetzung vermeidet zugleich, genauer festzulegen, ob vor allem politische Bündnisse, religiöse Anpassung oder kulturelle Vermischung gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mischt sich unter“ ist idiomatisch und bewahrt den reflexiven Zug; „Fladenbrot“ macht das antike Backbild für heutige Leser verständlich. Die beiden parallelen Nennungen Ephraims und die knappe prophetische Bildsprache bleiben erhalten.
