source:
  edition: WLC
  text: אָכְל֤וּ זָרִים֙ כֹּח֔/וֹ וְ/ה֖וּא לֹ֣א יָדָ֑ע גַּם שֵׂיבָה֙ זָ֣רְקָה בּ֔/וֹ וְ/ה֖וּא לֹ֥א יָדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/009.yaml
  text: Strangers have devoured his strength[a], but he does not know it; even gray hair is sprinkled on him[b], but he does not know it.
translation:
  language: de
  text: Fremde haben seine Kraft aufgezehrt[a], doch er merkt es nicht. Sogar graues Haar ist über ihn gestreut[b], doch er merkt es nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ausländer haben seine Stärke verbraucht.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Graues Haar ist auf ihn gestreut.“ Das Bild weist auf Alterung und Verfall hin.'
    reason: cultural_note
lexical_decisions:
- source_word: אָכְלוּ
  choice: haben … aufgezehrt
  rationale: Das Qal Perfekt von אכל bezeichnet wörtlich „essen“, hier bildlich das fortschreitende Verbrauchen seiner Kräfte. „Aufgezehrt“ bewahrt das kräftige Bild und klingt im Deutschen natürlich.
- source_word: זָרִים
  choice: Fremde
  rationale: Das Wort bezeichnet hier Außenstehende beziehungsweise fremde Mächte. „Fremde“ erhält die knappe, mehrdeutige Bezeichnung des Hebräischen; „Ausländer“ wäre enger und könnte modern missverstanden werden.
- source_word: כֹּחוֹ
  choice: seine Kraft
  rationale: כֹּחַ kann Kraft, Stärke, Macht oder Leistungsfähigkeit bezeichnen. „Kraft“ lässt offen, ob politische, wirtschaftliche oder militärische Stärke gemeint ist.
- source_word: וְהוּא לֹא יָדָע
  choice: doch er merkt es nicht
  rationale: Die zweimal wiederholte Wendung betont Efraims fehlende Wahrnehmung seines Zustands. „Merkt“ gibt ידע hier idiomatisch als Erkennen beziehungsweise Wahrnehmen wieder; „doch“ verdeutlicht den im Zusammenhang liegenden Gegensatz.
- source_word: גַּם
  choice: Sogar
  rationale: 'גַּם steigert hier das zweite Bild: Zusätzlich zum Kräfteverlust sind bereits Zeichen des Alterns und Verfalls sichtbar.'
- source_word: שֵׂיבָה
  choice: graues Haar
  rationale: Das Substantiv bezeichnet graues Haar beziehungsweise das Grauwerden als Zeichen des Alters. Die konkrete Bildsprache wird gegenüber dem abstrakteren „Alter“ bewahrt.
- source_word: זָרְקָה
  choice: hat sich … ausgebreitet
  rationale: זרק bedeutet werfen, verstreuen oder sprengen. Da „graues Haar“ Subjekt des femininen Verbs ist, beschreibt die Form bildhaft dessen verstreutes Auftreten. Die deutsche Wiedergabe ist natürlich, während die Fußnote das ungewöhnlichere hebräische Bild sichtbar macht.
- source_word: בּוֹ
  choice: auf ihm
  rationale: Die Präposition ב kann „an“, „auf“ oder „in“ bezeichnen. Im Bild des sichtbar werdenden grauen Haars ist „auf ihm“ eine naheliegende und zugleich formnahe Wiedergabe.
theological_decisions:
- issue: Bezug des männlichen Singularpronomens
  choice: Das Pronomen bleibt als „er/ihm“ stehen.
  alternative: Den im Kontext gemeinten Efraim oder Israel ausdrücklich nennen.
  rationale: Der Vers selbst nennt den Bezugsträger nicht erneut. Die pronominale Form bewahrt den Textzusammenhang und vermeidet eine im Vers nicht ausdrücklich vorgenommene Identifizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. Die Wiederholung „doch er merkt es nicht“ wird entsprechend dem Hebräischen vollständig erhalten.
