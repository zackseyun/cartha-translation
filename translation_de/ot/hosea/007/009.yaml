    issue: Die Wiedergabe von זָרְקָה als „hat sich auf ihm ausgebreitet“ ist semantisch zu frei.
    rationale: Das hebräische Verb bezeichnet Werfen, Sprengen oder Verstreuen. Das Bild sind verstreute beziehungsweise aufgestreute graue Haare, nicht primär ein Sich-Ausbreiten.
  - severity: low
    issue: Die Fußnote deutet „schleichenden Verfall“ an.
    rationale: Alterung und Verfall sind als Bildfunktion plausibel, aber „schleichend“ fügt eine nicht ausdrücklich markierte Nuance hinzu.
  revised_text: Fremde haben seine Kraft aufgezehrt[a], doch er merkt es nicht. Sogar graues Haar ist über ihn gestreut[b], doch er merkt es nicht.
