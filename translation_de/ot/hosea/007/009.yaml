  source_fidelity: Die erste Satzhälfte gibt אָכְלוּ זָרִים כֹּחוֹ treffend wieder. Auch die zweimalige Betonung seiner fehlenden Erkenntnis ist erhalten. In der zweiten Bildhälfte schwächt „hat sich auf ihm ausgebreitet“ jedoch die konkrete Bildlichkeit von זָרְקָה („streuen/verstreuen“) ab und ersetzt sie durch einen anderen Vorgang.
  naturalness: „Fremde haben seine Kraft aufgezehrt“ und „doch er merkt es nicht“ sind natürliches, würdiges modernes Standarddeutsch. „Sogar graues Haar ist über ihn gestreut“ ist bewusst bildhaft, aber im prophetischen Register verständlich und näher am hebräischen Ausdruck als „hat sich ... ausgebreitet“.
  terminology: „Fremde“ bewahrt die Offenheit von זָרִים, ohne die Referenz auf auswärtige Mächte unnötig einzuengen. „Kraft“ gibt כֹּחוֹ angemessen weit wieder. „Graues Haar“ erhält das konkrete Altersbild von שֵׂיבָה. Die Fußnote sollte den Hinweis auf einen „schleichenden“ Verfall vermeiden, da diese zeitliche Nuance nicht ausdrücklich im Vers liegt.
  issues:
