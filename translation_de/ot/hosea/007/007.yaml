  source_fidelity: 'Die Übersetzung gibt alle Satzglieder des Hebräischen zuverlässig wieder: die Totalisierung (כֻּלָּם; כָּל), das nicht näher bestimmte Hitze-/Ofenbild, das gewaltsame Bild von אכל, die politische Abfolge und die abschließende Verneinung des Rufens zu Gott. „Sind gefallen“ lässt wie נָפָלוּ Tod oder Sturz offen.'
