source:
  edition: WLC
  text: כֻּלָּ֤/ם יֵחַ֨מּוּ֙ כַּ/תַּנּ֔וּר וְ/אָכְל֖וּ אֶת שֹֽׁפְטֵי/הֶ֑ם כָּל מַלְכֵי/הֶ֣ם נָפָ֔לוּ אֵין קֹרֵ֥א בָ/הֶ֖ם אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/007.yaml
  text: All of them are hot like an oven[a], and they devour their judges; all their kings have fallen. None among them calls to me.
translation:
  language: de
  text: Sie alle glühen wie ein Ofen und verzehren ihre Richter[a]. Alle ihre Könige sind gefallen; keiner von ihnen ruft zu mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Herrscher«. Das hebräische Wort kann allgemein regierende Amtsträger bezeichnen, nicht nur Personen mit richterlichen Aufgaben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Sie alle
  rationale: Bewahrt die ausdrückliche Gesamtaussage und klingt im Deutschen natürlich.
- source_word: יֵחַמּוּ כַּתַּנּוּר
  choice: glühen wie ein Ofen
  rationale: Gibt das Bild starker Hitze prägnant wieder, ohne festzulegen, ob damit Begierde, Zorn oder politische Verschwörung gemeint ist.
- source_word: וְאָכְלוּ
  choice: und verzehren
  rationale: Bewahrt die gewaltsame Bildsprache des hebräischen Verbs; im Zusammenhang beschreibt die Form anschaulich das zerstörerische Handeln.
- source_word: אֶת שֹׁפְטֵיהֶם
  choice: ihre Richter
  rationale: Entspricht der unmittelbaren Wortbedeutung; die mögliche weitere Bedeutung „Herrscher“ wird in einer Fußnote erhalten.
- source_word: כָּל מַלְכֵיהֶם נָפָלוּ
  choice: Alle ihre Könige sind gefallen
  rationale: Bewahrt die erneute Gesamtaussage und lässt offen, ob Tod, Sturz oder beides gemeint ist.
- source_word: אֵין קֹרֵא בָהֶם אֵלָי
  choice: keiner von ihnen ruft zu mir
  rationale: Gibt die hebräische Existenzverneinung knapp und natürlich wieder und wahrt die Ausrichtung des Rufens auf Gott.
theological_decisions:
- issue: Deutung der Ofenmetapher
  choice: Das Bild bleibt ohne nähere moralische Festlegung stehen.
  alternative: Die Hitze ausdrücklich als Begierde, Zorn oder Verschwörungsdrang bezeichnen.
  rationale: Der nähere Zusammenhang legt leidenschaftliche und zerstörerische Regungen nahe, doch der Vers selbst benennt sie nicht eindeutig.
- issue: Bedeutungsumfang von שֹׁפְטֵיהֶם
  choice: Im Haupttext steht „Richter“, mit „Herrscher“ als Fußnotenalternative.
  alternative: Im Haupttext „Herrscher“ verwenden.
  rationale: „Richter“ ist die direkte lexikalische Entsprechung, während das Wort im politischen Zusammenhang auch allgemein regierende Amtsträger bezeichnen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Anklage und die wiederholten Gesamtaussagen bleiben erhalten; die Bildsprache wird nicht interpretierend verengt.
