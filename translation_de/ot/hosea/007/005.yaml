  text: י֣וֹם מַלְכֵּ֔/נוּ הֶחֱל֥וּ שָׂרִ֖ים חֲמַ֣ת מִ/יָּ֑יִן מָשַׁ֥ךְ יָד֖/וֹ אֶת לֹצְצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/005.yaml
  text: On the day of our king[a], the princes made themselves sick with the heat of wine[c][b]; he stretched out his hand with mockers.
translation:
  language: de
  text: Am Tag unseres Königs[a] machten sich die Fürsten krank an der Glut des Weines[b]; er reichte Spöttern[c] die Hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Am Königstag«. Manche verstehen darunter einen königlichen Festtag; ausdrücklich genannt wird ein Fest jedoch nicht.'
    reason: lexical_alternative
  - marker: b
    text: Die »Glut des Weines« kann auch als das »Brennen des Weines« oder, weniger wahrscheinlich, als das »Gift des Weines« verstanden werden.
    reason: lexical_alternative
  - marker: c
    text: Das Handreichen drückt hier wahrscheinlich aus, dass er sich mit den Spöttern einließ oder sich ihnen anschloss. Das hebräische Verb steht im Singular; mit »er« ist am ehesten der König gemeint, doch das Subjekt wird nicht ausdrücklich wiederholt.
    reason: cultural_note
lexical_decisions:
- source_word: י֣וֹם מַלְכֵּ֔נוּ
  choice: Am Tag unseres Königs
  rationale: Die Konstruktverbindung bedeutet wörtlich »Tag unseres Königs«. Die Präposition »am« ist im Deutschen für die zeitliche Angabe erforderlich; ein ausdrücklicher Festtag ist im Hebräischen nicht genannt.
- source_word: הֶחֱל֥וּ
  choice: machten sich … krank
  rationale: 'Die Hifil-Form von חלה wird hier im Zusammenhang des maßlosen Weingenusses kausativ-reflexiv verstanden: Die Fürsten machten sich selbst krank. Die mögliche Ableitung im Sinn von »beginnen« passt weniger gut zum unmittelbaren Bild.'
- source_word: שָׂרִ֖ים
  choice: die Fürsten
  rationale: שׂרים bezeichnet Fürsten, Herrscher oder hohe Amtsträger. »Fürsten« bewahrt den höfischen und königlichen Zusammenhang.
- source_word: חֲמַ֣ת מִיָּ֑יִן
  choice: an der Glut des Weines
  rationale: חמה kann Hitze, Glut, Zorn oder Gift bezeichnen. »Glut des Weines« erhält das starke, mehrdeutige Bild im Zusammenhang der Trunkenheit; »an« verbindet es im Deutschen natürlich mit dem Krankwerden.
- source_word: מָשַׁ֥ךְ יָד֖וֹ
  choice: er reichte … die Hand
  rationale: Wörtlich ist vom Ausstrecken oder Hinziehen der Hand die Rede. »Die Hand reichen« bewahrt das körperliche Bild und lässt zugleich die im Kontext wahrscheinliche Verbindung mit den Spöttern erkennen.
- source_word: אֶת לֹצְצִֽים
  choice: Spöttern
  rationale: לֹצְצִים sind Spötter oder Hohnredner. In Verbindung mit der Handbewegung bezeichnet אֶת hier wahrscheinlich diejenigen, denen er sich anschließt; der deutsche Dativ ergibt sich aus der Wendung »die Hand reichen«.
theological_decisions:
- issue: Subjekt von »er reichte Spöttern die Hand«
  choice: Das grammatisch singularische Subjekt bleibt als »er« stehen und verweist am ehesten auf den König.
  alternative: Die Handlung kann aus dem höfischen Zusammenhang allgemeiner verstanden oder sinngemäß auf die Fürsten bezogen werden.
  rationale: Das hebräische Verb steht im Singular. Der König ist der nächstliegende Bezug, wird jedoch nicht ausdrücklich erneut als Subjekt genannt; daher wird er nicht erläuternd in den Haupttext eingesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache von der »Glut des Weines« und der ausgestreckten beziehungsweise gereichten Hand bleibt erhalten; zugleich ist der Satz für heutige Leser verständlich. Die nicht ausdrücklich aufgelöste Identität des singularischen Subjekts wird gewahrt.
