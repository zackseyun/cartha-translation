  terminology: „Schuld“, „böse Taten“, „Betrug“, „Ephraim“ und „Samaria“ sind sachgerecht. Die Eigennamen bleiben erhalten, und keine metonymische oder theologische Auslegung wird in den Haupttext eingetragen.
