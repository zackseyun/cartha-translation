id: HOS.7.1
reference: Hosea 7:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כְּ/רָפְאִ֣/י לְ/יִשְׂרָאֵ֗ל וְ/נִגְלָ֞ה עֲוֺ֤ן אֶפְרַ֨יִם֙ וְ/רָע֣וֹת שֹֽׁמְר֔וֹן כִּ֥י פָעֲל֖וּ שָׁ֑קֶר וְ/גַנָּ֣ב יָב֔וֹא פָּשַׁ֥ט גְּד֖וּד בַּ/חֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/001.yaml
  text: When I would heal Israel[a], the iniquity of Ephraim is uncovered, and the evil deeds of Samaria; for they practice falsehood. A thief comes in[c][b]; a raiding band strips outside.
translation:
  language: de
  text: Wenn ich Israel heilen will[a], wird die Schuld Ephraims aufgedeckt und werden die bösen Taten Samarias sichtbar; denn sie üben Betrug[b]. Ein Dieb dringt ein; draußen plündert eine Räuberbande[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Als ich Israel heilte“ oder „Während ich Israel heilte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Sie handeln trügerisch“; wörtlicher: „Sie wirken Falschheit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Draußen fällt eine Streifschar ein“ oder „Draußen raubt eine Bande alles aus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָפְאִי
  choice: Wenn ich … heilen will
  rationale: Die mit כְּ eingeleitete Form bezeichnet den zeitlichen Umstand des göttlichen Heilens. „Heilen will“ gibt im Zusammenhang den ansetzenden oder beabsichtigten Vorgang wieder, ohne die ebenfalls möglichen zeitlichen Lesarten zu verschweigen.
- source_word: לְיִשְׂרָאֵל
  choice: Israel
  rationale: Israel ist der Gegenstand beziehungsweise Empfänger des Heilens; der Eigenname bleibt erhalten.
- source_word: וְנִגְלָה
  choice: wird … aufgedeckt / werden … sichtbar
  rationale: Das Nifal von גלה bezeichnet das Offenbar- oder Bloßgelegtwerden. Die variierte deutsche Wiedergabe vermeidet eine schwerfällige Wiederholung, während das Bild verborgener, nun hervortretender Schuld erhalten bleibt.
- source_word: עֲוֺן
  choice: Schuld
  rationale: עון kann Verfehlung, Schuld oder deren Folge bezeichnen. „Schuld“ wahrt hier sowohl die moralische Schwere als auch die Möglichkeit eines belastenden Schuldzustands.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der Eigenname wird beibehalten; seine mögliche metonymische Beziehung zum Nordreich wird nicht in den Text hineinerklärt.
- source_word: וְרָעוֹת שֹׁמְרוֹן
  choice: die bösen Taten Samarias
  rationale: Der Plural von רעה bezeichnet hier im Kontext moralisch böse Handlungen. „Böse Taten“ macht diesen Handlungssinn in natürlichem Deutsch deutlich.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung dafür ein, dass die Schuld und die bösen Taten offenbar werden.
- source_word: פָעֲלוּ שָׁקֶר
  choice: sie üben Betrug
  rationale: Die Verbindung von פעל mit שקר beschreibt das Hervorbringen beziehungsweise Praktizieren von Täuschung. „Betrug üben“ bewahrt den habituellen Handlungssinn.
- source_word: וְגַנָּב יָבֹוא
  choice: Ein Dieb dringt ein
  rationale: Der Singular ist generisch. בוא bedeutet grundsätzlich „kommen/eintreten“; „dringt ein“ gibt im Diebstahlskontext die naheliegende Bewegung nach innen idiomatisch wieder.
- source_word: פָּשַׁט גְּדוּד בַּחוּץ
  choice: draußen plündert eine Räuberbande
  rationale: פשט kann Entkleiden, Ausbreiten oder einen plündernden Überfall bezeichnen; mit גדוד liegt der Sinn einer marodierenden Schar nahe. Die Formulierung erhält den Gegensatz zwischen heimlichem Eindringen und offener Gewalt.
theological_decisions:
- issue: Zeitliche Einordnung des göttlichen Heilens und der aufgedeckten Schuld
  choice: Gottes ansetzendes oder beabsichtigtes Heilen Israels bildet den Zeitpunkt, an dem Ephraims Schuld offenbar wird.
  alternative: 'Die Aussage kann auch heißen: „Als ich Israel heilte“ oder „Während ich Israel heilte“, also auf ein vergangenes beziehungsweise andauerndes Heilen bezogen sein.'
  rationale: Die hebräische Konstruktion lässt mehrere zeitliche Nuancen zu. Der Haupttext folgt der kontextuell gut passenden Lesart eines beabsichtigten Heilens; die Fußnote bewahrt die echte grammatische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau wird lesbar entfaltet; Semikolon und Ortsvoranstellung heben den Kontrast zwischen dem Dieb im Inneren und der plündernden Bande draußen hervor. Die Eigennamen und die prophetische Schärfe bleiben erhalten.
