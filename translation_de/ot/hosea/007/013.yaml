review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und der Gerichtston sind zutreffend wiedergegeben. „Verderben kommt über sie“ gibt שֹׁד לָהֶם idiomatisch und inhaltlich angemessen wieder; „haben sich gegen mich aufgelehnt“ trifft die starke Bedeutung von פשע. Beim abschließenden Ausdruck sollte die gegen Gott gerichtete Aussage von עָלַי deutlicher als „gegen mich“ erscheinen. Das Imperfekt אֶפְדֵּם bleibt in der Hauptfassung sinnvoll nichtvergangen und volitiv; die Fußnote bewahrt die relevante Alternative einer Vergangenheitsdeutung.
  naturalness: „Fortgeirrt“ ist im heutigen Standarddeutsch ungebräuchlich und wirkt morphologisch sperrig. „Von mir abgeirrt“ ist natürlich, prägnant und bewahrt sowohl die Bewegung der Entfremdung als auch die übertragene Bundesdimension. „Lügen gegen mich reden“ ist im prophetischen Register verständlich und näher am hebräischen Bezug als „Lügen über mich reden“.
  terminology: „Wehe“, „Verderben“, „sich auflehnen“ und „erlösen“ sind für den prophetischen Kontext angemessen. Die Fußnote wird sprachlich geglättet und stellt die adversative nichtvergangene Alternative sowie die mögliche Vergangenheitsauffassung klar dar, ohne eine davon dogmatisch festzulegen.
  issues:
  - severity: medium
    issue: Unnatürliche Formulierung „sie sind von mir fortgeirrt“
    rationale: „Fortgeirrt“ ist kein idiomatischer Ausdruck des modernen Standarddeutschen. „Von mir abgeirrt“ ist idiomatisch und gibt נדד im Kontext einer Abkehr bzw. Entfremdung angemessen wieder.
  - severity: low
    issue: „Lügen über mich“ schwächt die gegnerische Richtung von עָלַי ab
    rationale: „Über mich“ kann bloß Aussagen über Gott bezeichnen; עָלַי meint hier feindselig gegen ihn gerichtete falsche Rede. „Lügen gegen mich“ macht dies deutlicher.
  - severity: low
    issue: Fußnotenformulierung „Dabei würde ich sie erlösen“ ist im Deutschen semantisch unklar
    rationale: „Dabei“ kann zeitlich oder begleitend verstanden werden. „Doch ich würde sie erlösen“ gibt die in Betracht gezogene adversative Lesart klarer wieder.
