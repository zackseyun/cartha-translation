  text: א֤וֹי לָ/הֶם֙ כִּֽי נָדְד֣וּ מִמֶּ֔/נִּי שֹׁ֥ד לָ/הֶ֖ם כִּֽי פָ֣שְׁעוּ בִ֑/י וְ/אָנֹכִ֣י אֶפְדֵּ֔/ם וְ/הֵ֕מָּה דִּבְּר֥וּ עָלַ֖/י כְּזָבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/013.yaml
  text: Woe to them[a], for they have wandered away from me! Destruction is theirs, for they have rebelled against me. Though I would redeem them, they speak lies against me.
translation:
  language: de
  text: Wehe ihnen, denn sie sind von mir abgeirrt! Verderben kommt über sie, denn sie haben sich gegen mich aufgelehnt! Ich aber will sie erlösen[a], doch sie reden Lügen gegen mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch ich würde sie erlösen.“ Manche verstehen das Verb als Vergangenheit: „Ich aber habe sie erlöst.“'
    reason: Alternative Deutungen des hebräischen Imperfekts von פדה.
lexical_decisions:
- source_word: א֤וֹי
  choice: Wehe
  rationale: „Wehe“ bewahrt sowohl den Klage- als auch den Gerichtscharakter des prophetischen Ausrufs.
- source_word: נָדְדוּ מִמֶּנִּי
  choice: sie sind von mir fortgeirrt
  rationale: נדד bezeichnet ein Fortziehen, Umherirren oder Fliehen. „Fortgeirrt“ bringt sowohl die Bewegung weg von Gott als auch die Entfremdung zum Ausdruck, ohne bewusste Flucht zwingend vorauszusetzen.
- source_word: שֹׁד לָהֶם
  choice: Verderben kommt über sie
  rationale: שֹׁד bezeichnet Verwüstung, Ruin oder gewaltsames Verderben. Die Formulierung gibt den knappen Gerichtsruf in natürlichem Deutsch wieder.
- source_word: פָשְׁעוּ בִי
  choice: sie haben sich gegen mich aufgelehnt
  rationale: פשע meint nicht nur eine einzelne Verfehlung, sondern Auflehnung und Treuebruch. „Sich auflehnen“ bewahrt diese Stärke.
- source_word: וְאָנֹכִי אֶפְדֵּם
  choice: Ich aber will sie erlösen
  rationale: Der Imperfekt von פדה kann Gottes gegenwärtige Bereitschaft oder Absicht zur Erlösung ausdrücken. „Ich aber will“ erhält die emphatische Gegenüberstellung, ohne die mögliche Vergangenheitsdeutung zu verschweigen.
- source_word: דִּבְּרוּ עָלַי כְּזָבִים
  choice: doch sie reden Lügen über mich
  rationale: Die Wendung bezeichnet falsche Aussagen über beziehungsweise gegen Gott. Das Präsens gibt das fortbestehende Verhalten im rhetorischen Zusammenhang natürlich wieder.
theological_decisions:
- issue: Zeit- und Aussagewert von וְאָנֹכִי אֶפְדֵּם
  choice: Ich aber will sie erlösen
  alternative: 'Dabei würde ich sie erlösen; oder vergangen: Ich aber habe sie erlöst'
  rationale: Das hebräische Imperfekt legt eine nicht vergangene, volitive oder dispositionale Aussage nahe, lässt im Kontext aber auch andere zeitliche beziehungsweise modale Deutungen zu. Die Hauptfassung bewahrt die Spannung zwischen Gottes Erlösungswillen und Israels lügnerischer Reaktion; die Fußnote nennt die ernsthaft vertretenen Alternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Prägnanz. Die Parallelstruktur und der scharfe Gegensatz zwischen Israels Auflehnung und Gottes Erlösungswillen bleiben erhalten.
