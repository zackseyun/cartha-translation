id: HOS.7.11
reference: Hosea 7:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֣י אֶפְרַ֔יִם כְּ/יוֹנָ֥ה פוֹתָ֖ה אֵ֣ין לֵ֑ב מִצְרַ֥יִם קָרָ֖אוּ אַשּׁ֥וּר הָלָֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/011.yaml
  text: Ephraim has become like a silly dove[a], without sense; they call to Egypt, they go to Assyria.
translation:
  language: de
  text: 'Ephraim ist wie eine leichtgläubige Taube geworden, ohne Verstand[a]: Nach Ägypten rufen sie, nach Assyrien gehen sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ohne Herz“. Das „Herz“ bezeichnet hier das Denk- und Urteilsvermögen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ist … geworden
  rationale: Die Form mit היה beschreibt hier einen eingetretenen Zustand mit gegenwärtiger Relevanz; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Der Eigenname wird beibehalten. Im Kontext steht Ephraim für das Nordreich, doch diese Metonymie wird nicht in den Haupttext eingetragen.
- source_word: כְּיוֹנָה
  choice: wie eine … Taube
  rationale: „Taube“ ist die übliche und bildlich passende Wiedergabe von יוֹנָה.
- source_word: פוֹתָה
  choice: leichtgläubige
  rationale: Das Wort bezeichnet unerfahrene, leicht zu verführende oder zu täuschende Einfalt. „Leichtgläubig“ ist im heutigen Deutsch klar und wahrt den vorwurfsvollen Ton.
- source_word: אֵין לֵב
  choice: ohne Verstand
  rationale: Wörtlich fehlt das „Herz“; לֵב bezeichnet hier das Denk- und Urteilsvermögen. „Ohne Verstand“ gibt die idiomatische Bedeutung prägnant wieder.
- source_word: מִצְרַיִם קָרָאוּ
  choice: Nach Ägypten rufen sie
  rationale: קרא bezeichnet hier den Hilferuf beziehungsweise die politische Hinwendung zu Ägypten. Die vorangestellte Richtungsangabe bewahrt den markanten Parallelismus.
- source_word: אַשּׁוּר הָלָכוּ
  choice: nach Assyrien gehen sie
  rationale: הלך bezeichnet die Bewegung beziehungsweise politische Hinwendung nach Assyrien. Das Präsens entspricht der lebendigen Darstellung des fortgesetzten Verhaltens.
theological_decisions:
- issue: Bezug von Ephraim
  choice: Der Name „Ephraim“ bleibt stehen und kann im Kontext das Nordreich repräsentieren.
  alternative: „Israel“ oder „das Nordreich“
  rationale: Der hebräische Text nennt ausdrücklich Ephraim. Eine Ersetzung würde die prophetische Ausdrucksweise interpretierend vereinheitlichen.
- issue: Politische Hilfesuche bei Ägypten und Assyrien
  choice: Die Verben werden als Rufen nach Ägypten und Gehen nach Assyrien wiedergegeben, ohne das Ziel ausdrücklich als Bündnis oder Hilfegesuch auszudeuten.
  alternative: „Sie bitten Ägypten um Hilfe; sie suchen ein Bündnis mit Assyrien.“
  rationale: Der Kontext legt politische Hilfesuche nahe, aber der Vers selbst verwendet knappe Bewegungs- und Rufverben. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau der beiden letzten Teilsätze wird durch „Nach Ägypten …, nach Assyrien …“ hörbar gehalten; das etwas markierte „gehen sie“ spiegelt die hebräische Wortstellung, ohne unverständlich zu wirken.
