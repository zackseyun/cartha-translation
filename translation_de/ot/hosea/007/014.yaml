  text: וְ/לֹֽא זָעֲק֤וּ אֵלַ/י֙ בְּ/לִבָּ֔/ם כִּ֥י יְיֵלִ֖ילוּ עַל מִשְׁכְּבוֹתָ֑/ם עַל דָּגָ֧ן וְ/תִיר֛וֹשׁ יִתְגּוֹרָ֖רוּ יָס֥וּרוּ בִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/014.yaml
  text: They do not cry out to me from their heart[a], but they wail on their beds; for grain and new wine they gather themselves; they turn away from me.
translation:
  language: de
  text: Sie schreien nicht von Herzen zu mir, sondern jammern auf ihren Betten. Um Korn und Neuwein scharen sie sich zusammen[a]; von mir wenden sie sich ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wegen Korn und Neuwein ritzen sie sich.“ Das hebräische Verb ist schwer zu deuten und kann entweder ein Sichversammeln oder ein Sichritzen im Rahmen ritueller Klage bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: זָעֲקוּ אֵלַי בְּלִבָּם
  choice: sie schreien nicht von Herzen zu mir
  rationale: „Schreien“ bewahrt die Intensität von זעק, während „von Herzen“ die innere Aufrichtigkeit bezeichnet und im Deutschen natürlich klingt.
- source_word: כִּי יְיֵלִילוּ
  choice: sondern jammern sie
  rationale: כִּי führt hier im Zusammenhang einen Gegensatz zum aufrichtigen Rufen ein. „Jammern“ gibt das laute Klagen von ילל idiomatisch wieder, ohne die stärker tierische Konnotation von „heulen“ aufzudrängen.
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: auf ihren Lagern
  rationale: Die örtliche Bedeutung wird direkt wiedergegeben; „Lager“ ist würdevoll und bezeichnet hier den Ort, an dem sie liegen.
- source_word: דָּגָן וְתִירוֹשׁ
  choice: Korn und jungen Wein
  rationale: דָּגָן bezeichnet Getreide beziehungsweise Korn; תִּירוֹשׁ meint den Ertrag der Weinlese, oft als jungen Wein verstanden. Die Formulierung erhält den landwirtschaftlichen Zusammenhang.
- source_word: יִתְגּוֹרָרוּ
  choice: scharen sie sich zusammen
  rationale: Die schwierige Form wird entsprechend der masoretischen Lesung als Sichversammeln verstanden. Da auch eine Deutung als rituelles Sichritzen möglich ist, wird diese im Fußnotenapparat bewahrt.
- source_word: יָסוּרוּ בִי
  choice: von mir wenden sie sich ab
  rationale: Die Wendung beschreibt Abkehr von Gott. Diese Übersetzung erhält das Bild des Sichabwendens, ohne die stärkere Deutung „sie lehnen sich gegen mich auf“ in den Haupttext einzutragen.
theological_decisions:
- issue: Deutung von יִתְגּוֹרָרוּ
  choice: Sie scharen sich um Korn und jungen Wein zusammen.
  alternative: Sie ritzen sich wegen Korn und jungen Weins.
  rationale: Die hebräische Verbform ist schwierig. Die Hauptübersetzung folgt der möglichen Bedeutung des Sichversammelns; die durch alte Überlieferung und den Kontext religiöser Klage gestützte Deutung als Selbstverletzung bleibt in der Fußnote sichtbar.
- issue: Beziehung der Klage zu Gott
  choice: Äußerliches Jammern wird dem aufrichtigen Rufen zu Gott gegenübergestellt.
  alternative: כִּי könnte rein begründend mit „denn“ wiedergegeben werden.
  rationale: Der Satzbau und der inhaltliche Gegensatz sprechen im Deutschen für „sondern“, ohne zu behaupten, dass die Menschen überhaupt nicht klagen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt knapp und parallel; die textlich und lexikalisch unsichere Verbform wird nicht stillschweigend vereindeutigt.
