revisions:
- from: Der Stolz Israels legt gegen ihn Zeugnis ab[a]. Dennoch sind sie nicht zu Jahwe, ihrem Gott, umgekehrt und haben ihn trotz alledem[b] nicht gesucht.
  to: Der Stolz Israels legt gegen ihn Zeugnis ab[a]. Doch sie kehren nicht zu Jahwe, ihrem Gott, zurück, und bei all dem suchen sie ihn nicht[b].
  rationale: Die Revision bewahrt die forensische Deutung von עָנָה und das singularische Suffix in »gegen ihn«. Sie ersetzt die im Haupttext festgelegte konzessive Auslegung von בְּכָל־זֹאת durch die quellennahe, im Deutschen natürliche Formulierung »bei all dem« und führt die konzessive Deutung als Fußnotenalternative. Dadurch bleibt die semantische Offenheit des Hebräischen erhalten.
