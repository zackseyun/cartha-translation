    rationale: Der Entwurf hat die stärker interpretierende Formulierung »trotz alledem« im Haupttext und die nähere umstandsbezogene Wiedergabe nur als Alternative. Dies wird umgekehrt, damit Fußnote und Haupttext die Quellenlage angemessen abbilden.
