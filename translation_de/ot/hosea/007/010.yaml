  text: וְ/עָנָ֥ה גְאֽוֹן יִשְׂרָאֵ֖ל בְּ/פָנָ֑י/ו וְ/לֹֽא שָׁ֨בוּ֙ אֶל יְהוָ֣ה אֱלֹֽהֵי/הֶ֔ם וְ/לֹ֥א בִקְשֻׁ֖/הוּ בְּ/כָל זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/010.yaml
  text: The pride of Israel testifies against him[a], yet they do not return to Yahweh their God[b], nor do they seek him in all this.
translation:
  language: de
  text: Der Stolz Israels legt gegen ihn Zeugnis ab[a]. Doch sie kehren nicht zu Jahwe, ihrem Gott, zurück, und bei all dem suchen sie ihn nicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor seinem Angesicht« beziehungsweise »ihm ins Angesicht«; wörtlich: »vor seinem Angesicht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »trotz alledem«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנָה
  choice: legt Zeugnis ab
  rationale: In Verbindung mit גאון ישראל und בפניו hat das Verb hier am ehesten einen bezeugenden, anklagenden Sinn. Die Wendung ist im Deutschen natürlich und wahrt den forensischen Klang.
- source_word: גְאוֹן יִשְׂרָאֵל
  choice: der Stolz Israels
  rationale: גאון kann Stolz, Erhabenheit oder Hoheit bezeichnen; im tadelnden Zusammenhang ist die negative Bedeutung »Stolz« am wahrscheinlichsten.
- source_word: בְּפָנָיו
  choice: gegen ihn
  rationale: Wörtlich steht »in/an seinem Angesicht«. Zusammen mit dem Zeugnisverb gibt »gegen ihn« den anklagenden Sinn idiomatisch wieder, während die Einzahl des Suffixes erhalten bleibt.
- source_word: שָׁבוּ אֶל
  choice: sind … umgekehrt zu
  rationale: שוב אל bezeichnet hier die Rückkehr zu Gott und schließt den Gedanken der Umkehr ein. »Zu … umkehren« ist im Deutschen sachgerecht und verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיהֶם
  choice: ihrem Gott
  rationale: Die possessive Bundesbezeichnung wird bewahrt; dadurch tritt der Gegensatz zwischen ihrer Zugehörigkeit und ihrer verweigerten Umkehr hervor.
- source_word: בִּקְשֻׁהוּ
  choice: haben ihn … nicht gesucht
  rationale: בקש bezeichnet hier das Suchen Gottes in Hinwendung, Bitte oder Beziehung. »Ihn suchen« wahrt diese Bedeutungsbreite.
- source_word: בְּכָל זֹאת
  choice: trotz alledem
  rationale: Die Präposition mit »all diesem« kann die Gesamtheit der geschilderten Umstände bezeichnen; im Kontext liegt eine konzessive Bedeutung nahe. Die formal nähere Wiedergabe wird in der Fußnote erhalten.
theological_decisions:
- issue: Bezug des singularischen Suffixes in בְּפָנָיו
  choice: Die Einzahl »ihn« wird beibehalten und auf das kollektiv-singularische Israel bezogen.
  alternative: »vor ihm« oder eine sinngemäße Pluralisierung zu »gegen sie«
  rationale: Das Hebräische hat ein Suffix der dritten Person Singular. Die Beibehaltung wahrt den auffälligen Numeruswechsel zwischen »Israel/ihn« und dem anschließenden »sie«, ohne ihn stillschweigend auszugleichen.
- issue: Konzessiver oder umstandsbezogener Sinn von בְּכָל זֹאת
  choice: »trotz alledem« im Haupttext
  alternative: »bei all dem«
  rationale: Der Zusammenhang betont, dass Israel selbst unter diesen Umständen nicht umkehrt. Da die hebräische Form allein den konzessiven Sinn nicht ausdrücklich festlegt, bleibt die nähere Alternative in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Gegensatz. »Jahwe« gibt den Gottesnamen wieder; der Wechsel vom kollektiv-singularischen »Israel/ihn« zum Plural »sie« bleibt erhalten.
