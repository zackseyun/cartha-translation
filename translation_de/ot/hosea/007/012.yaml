base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/012.yaml
  text: As they go[a], I will spread my net over them; like the birds of the heavens I will bring them down[b]. I will chasten them according to the report to their assembly.
translation:
  language: de
  text: Wenn sie fortziehen, breite ich mein Netz über sie aus; wie die Vögel des Himmels hole ich sie herunter. Ich weise sie zurecht[a] gemäß der Botschaft an ihre Versammlung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich züchtige sie“ oder „Ich bestrafe sie“. Das hebräische Verb kann sowohl korrigierende Zurechtweisung als auch strafende Ahndung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Schlusswendung ist schwer zu deuten. Wörtlicher etwa: „entsprechend der Kunde an ihre Versammlung“. Möglich ist auch: „entsprechend dem, was in ihrer Versammlung gehört wurde“ oder „wie es ihrer Versammlung verkündet wurde“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר יֵלֵכוּ
  choice: Wenn sie fortziehen
  rationale: כַּאֲשֶׁר leitet hier einen temporalen Nebensatz ein; הלך bezeichnet ihr Weggehen bzw. ihre Bewegung, im Kontext wohl ihr Ausgreifen nach fremder Hilfe.
- source_word: אֶפְרוֹשׂ עֲלֵיהֶם רִשְׁתִּי
  choice: breite ich mein Netz über ihnen aus
  rationale: Die Verbindung von פרשׂ und רשת bewahrt das Bild eines über der Beute ausgebreiteten Fangnetzes.
- source_word: כְּעוֹף הַשָּׁמַיִם
  choice: wie die Vögel des Himmels
  rationale: עוֹף ist kollektiv gebraucht; die natürliche deutsche Mehrzahl erhält das Himmelsbild.
- source_word: אוֹרִידֵם
  choice: hole ich sie herunter
  rationale: Der Hifil von ירד bedeutet, jemanden zum Herabkommen zu bringen; „herunterholen“ passt zum Vogelfangbild.
- source_word: אַיְסִרֵם
  choice: Ich weise sie zurecht
  rationale: Der Hifil von יסר kann erziehende Zucht ebenso wie strafende Ahndung bezeichnen. „Zurechtweisen“ hält den korrektiven Sinn offen, ohne den gerichtlichen Ernst auszuschließen.
- source_word: כְּשֵׁמַע לַעֲדָתָם
  choice: wie es ihrer Versammlung angekündigt wurde
  rationale: Die schwierige Wendung wird als Bezug auf eine der Gemeinschaft zugegangene Ankündigung verstanden; eine formnähere Alternative wird in der Fußnote erhalten.
theological_decisions:
- issue: Art des göttlichen Handelns in אַיְסִרֵם
  choice: Ich weise sie zurecht
  alternative: Ich bestrafe sie / Ich züchtige sie
  rationale: יסר umfasst korrigierende Unterweisung und strafende Zucht. Die gewählte Formulierung bewahrt diese Spannung, statt das Handeln ausschließlich als Vergeltungsstrafe festzulegen.
- issue: Deutung von כְּשֵׁמַע לַעֲדָתָם
  choice: wie es ihrer Versammlung angekündigt wurde
  alternative: entsprechend der Nachricht an ihre Versammlung / wie ihre Gemeinschaft gehört hat
  rationale: Syntax und genauer Bezug der Schlusswendung sind unsicher. Der Haupttext bietet eine verständliche mögliche Deutung; die Fußnote macht die verbleibende Mehrdeutigkeit sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Vogelfangmetapher bleibt konkret; „Versammlung“ vermeidet eine unnötig kirchliche Färbung. Beide Fußnotenmarker stehen an den jeweils erklärten Textstellen.
