base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/002.yaml
  text: So I bought her for myself for fifteen shekels of silver and a homer and a lethech of barley[a][b].
translation:
  language: de
  text: Da kaufte ich sie mir für fünfzehn Schekel Silber[a] sowie einen Homer und einen Letek Gerste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für fünfzehn Silberstücke“. Wörtlich heißt es im Hebräischen „für fünfzehn Silber“; die Einheit ist aus dem Zusammenhang zu ergänzen.'
    reason: lexical_alternative
  - marker: b
    text: Ein Letek war wahrscheinlich ein Trockenmaß, das einem halben Homer entsprach.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶכְּרֶהָ
  choice: Da kaufte ich sie
  rationale: Das Verb כרה bezeichnet in diesem Zusammenhang den Erwerb gegen Bezahlung. „Kaufte“ gibt dies im modernen Deutsch natürlich und konkret wieder, ohne über die im Text nicht erläuterte Art des Geschäfts hinauszugehen.
- source_word: לִּי
  choice: mir
  rationale: Der Dativ bezeichnet das persönliche Interesse beziehungsweise den Erwerb für die eigene Person. Das idiomatische „ich kaufte sie mir“ bewahrt diesen reflexiven Sinn.
- source_word: בַּחֲמִשָּׁה עָשָׂר כָּסֶף
  choice: für fünfzehn Schekel Silber
  rationale: Wörtlich steht im Hebräischen „für fünfzehn Silber“; die Gewichtungs- beziehungsweise Währungseinheit ist aus dem Zusammenhang zu ergänzen. „Schekel Silber“ macht sie für heutige Leser verständlich, während eine Fußnote die Ellipse offenlegt.
- source_word: חֹמֶר
  choice: einen Homer
  rationale: Homer ist die Bezeichnung eines antiken Trockenmaßes. Die Transliteration vermeidet eine unsichere und scheinbar exakte Umrechnung in moderne Volumeneinheiten.
- source_word: שְׂעֹרִים
  choice: Gerste
  rationale: Dies ist die direkte und eindeutige deutsche Bezeichnung des genannten Getreides. Die Stellung am Ende lässt „Gerste“ natürlich auf beide vorangehenden Maßeinheiten bezogen sein.
- source_word: לֵתֶךְ
  choice: einen Letech
  rationale: Letech ist ein bestimmtes antikes Trockenmaß, wahrscheinlich ein halber Homer. Die Transliteration bewahrt die Quelleneinheit; die wahrscheinliche Größe wird in einer Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da“ führt die Handlung als Fortsetzung des vorangehenden göttlichen Auftrags ein. Die antiken Maßeinheiten bleiben erhalten; notwendige Erläuterungen stehen in den Fußnoten.
