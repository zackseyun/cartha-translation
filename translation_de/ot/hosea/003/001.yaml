source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ע֚וֹד לֵ֣ךְ אֱֽהַב אִשָּׁ֔ה אֲהֻ֥בַת רֵ֖עַ וּ/מְנָאָ֑פֶת כְּ/אַהֲבַ֤ת יְהוָה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הֵ֗ם פֹּנִים֙ אֶל אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/אֹהֲבֵ֖י אֲשִׁישֵׁ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/001.yaml
  text: And Yahweh said to me again[a], “Go, love a woman loved by another and committing adultery, just as Yahweh loves the children of Israel[b], though they turn to other gods and love raisin cakes.”
translation:
  language: de
  text: 'Und Jahwe sagte noch einmal zu mir: „Geh und liebe eine Frau, die von einem anderen geliebt wird und Ehebruch begeht[a] – so wie Jahwe die Israeliten liebt, obwohl sie sich anderen Göttern zuwenden und Rosinenkuchen lieben[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Ehefrau, die von ihrem Gefährten geliebt wird und Ehebruch begeht“. Das hebräische Wort für „Frau“ kann auch „Ehefrau“ bedeuten; das mit „einem anderen“ wiedergegebene Wort kann einen Gefährten, Mitmenschen oder hier möglicherweise den Ehemann bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind vermutlich gepresste Kuchen aus Rosinen, die möglicherweise bei Festen oder im Götzendienst verwendet wurden.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den hebräischen Gottesnamen in der im Deutschen geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עוֹד
  choice: noch einmal
  rationale: Bezeichnet hier am natürlichsten eine erneute Anweisung im Erzählverlauf.
- source_word: לֵךְ אֱהַב
  choice: Geh und liebe
  rationale: Bewahrt beide Imperative und zugleich die Wiederholung des Verbs „lieben“ im Vergleich mit Jahwes Liebe.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: Das Wort kann „Frau“ oder „Ehefrau“ bedeuten. Die allgemeinere Wiedergabe vermeidet es, ihre Identität oder ihren ehelichen Status über den hebräischen Wortlaut hinaus festzulegen.
- source_word: אֲהֻבַת רֵעַ
  choice: die von einem anderen geliebt wird
  rationale: Bewahrt die passive Form und die Unbestimmtheit von רֵעַ, das einen Gefährten, Mitmenschen oder hier möglicherweise den Ehemann bezeichnen kann.
- source_word: וּמְנָאָפֶת
  choice: und Ehebruch begeht
  rationale: Gibt das aktive Partizip als fortdauerndes beziehungsweise kennzeichnendes Verhalten wieder.
- source_word: כְּאַהֲבַת יְהוָה אֶת בְּנֵי יִשְׂרָאֵל
  choice: so wie Jahwe die Israeliten liebt
  rationale: Drückt den Vergleich natürlich aus und erhält die lexikalische Verbindung durch „liebt“.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Ist im modernen Standarddeutsch die natürliche Bezeichnung für das Volk Israel und gibt die Referenz präzise wieder.
- source_word: וְהֵם פֹּנִים אֶל אֱלֹהִים אֲחֵרִים
  choice: obwohl sie sich anderen Göttern zuwenden
  rationale: Das konzessive „obwohl“ macht den im Zusammenhang klaren Gegensatz zwischen Jahwes Liebe und Israels Abwendung verständlich.
- source_word: וְאֹהֲבֵי אֲשִׁישֵׁי עֲנָבִים
  choice: und Rosinenkuchen lieben
  rationale: Bewahrt die erneute Verwendung des Liebeswortfeldes und gibt die Speisebezeichnung idiomatisch wieder.
theological_decisions:
- issue: Identität der Frau in Hoseas Zeichenhandlung
  choice: Die Frau wird nicht ausdrücklich mit Gomer identifiziert und als „eine Frau“ bezeichnet.
  alternative: „deine Frau“ oder eine Formulierung, die eine Rückkehr zu Gomer voraussetzt
  rationale: Der Vers nennt Gomer nicht und enthält kein Possessivpronomen. Die Übersetzung lässt daher offen, ob dieselbe oder eine andere Frau gemeint ist.
- issue: Beziehung der Frau zu רֵעַ
  choice: „von einem anderen geliebt“
  alternative: „von ihrem Mann geliebt“ oder „die einen Liebhaber hat“
  rationale: רֵעַ legt die genaue Beziehung nicht eindeutig fest. Die gewählte Formulierung bewahrt diese Mehrdeutigkeit, statt Ehemann oder Liebhaber ausdrücklich einzusetzen.
- issue: Gegensatz zwischen Jahwes Liebe und Israels Abwendung
  choice: Konzessive Wiedergabe mit „obwohl“
  alternative: Koordinierende Wiedergabe mit „und“
  rationale: Der Vergleich stellt Jahwes fortdauernde Liebe der Hinwendung Israels zu anderen Göttern gegenüber; „obwohl“ macht diesen impliziten Gegensatz im Deutschen natürlich sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Syntax. „Jahwe“ bewahrt den Gottesnamen; „Israeliten“ ist natürlicher als das im Deutschen schwerfällige „Kinder Israels“. Die Fußnoten sichern echte lexikalische und kulturelle Unsicherheiten, ohne den Haupttext zu überladen.
