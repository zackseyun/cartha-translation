source:
  edition: WLC
  text: כִּ֣י יָמִ֣ים רַבִּ֗ים יֵֽשְׁבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֥ין מֶ֨לֶךְ֙ וְ/אֵ֣ין שָׂ֔ר וְ/אֵ֥ין זֶ֖בַח וְ/אֵ֣ין מַצֵּבָ֑ה וְ/אֵ֥ין אֵפ֖וֹד וּ/תְרָפִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/004.yaml
  text: For many days the sons of Israel will dwell without king or prince[a], without sacrifice or pillar[c][b], and without ephod or household idols.
translation:
  language: de
  text: Denn viele Tage lang werden die Israeliten ohne König und ohne Fürst bleiben, ohne Schlachtopfer und ohne Kultstein[a], ohne Efod[b] und ohne Terafim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufgerichteter Stein“ beziehungsweise „Kultsäule“; das hebräische Wort bezeichnet ein steinernes Kultmal.'
    reason: lexical_alternative
  - marker: b
    text: „Efod“ ist ein hebräischer Kultbegriff. Er kann ein priesterliches Gewand oder einen damit verbundenen rituellen Gegenstand bezeichnen.
    reason: cultural_note
  - marker: c
    text: „Terafim“ waren häusliche Kultgegenstände oder Götzenbilder.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Erklärung des vorausgehenden Zeichenhandelns ein und bewahrt den begründend-erklärenden Zusammenhang.
- source_word: יָמִים רַבִּים
  choice: viele Tage lang
  rationale: Bewahrt das hebräische Bild einer langen, aber nicht näher bestimmten Zeitspanne und klingt im Deutschen natürlich.
- source_word: יֵשְׁבוּ
  choice: werden … bleiben
  rationale: ישׁב kann sitzen, wohnen oder in einem Zustand verbleiben bedeuten; hier steht die über längere Zeit andauernde Lage Israels im Vordergrund.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Gibt die kollektiv gemeinte Wendung im heutigen Standarddeutsch klar und idiomatisch wieder.
- source_word: אֵין מֶלֶךְ
  choice: ohne König
  rationale: Die Präposition „ohne“ bildet die wiederholte hebräische Negativkonstruktion knapp und deutlich ab.
- source_word: שָׂר
  choice: Fürsten
  rationale: Bezeichnet einen hochrangigen Herrscher oder Amtsträger; „Fürst“ passt zur politischen Paarung mit „König“, ohne den Rang genauer festzulegen.
- source_word: זֶבַח
  choice: Schlachtopfer
  rationale: Bezeichnet hier ein durch Schlachtung dargebrachtes Opfer und ist präziser als das allgemeinere „Opfer“.
- source_word: מַצֵּבָה
  choice: Kultstein
  rationale: Bezeichnet einen aufgerichteten Stein mit kultischer Funktion. „Kultstein“ vermittelt diese Bedeutung knapper und genauer als das unspezifische „Säule“.
- source_word: אֵפוֹד
  choice: Efod
  rationale: Die Umschrift bewahrt den mehrdeutigen hebräischen Kultbegriff, der je nach Zusammenhang ein priesterliches Gewand oder einen damit verbundenen Kultgegenstand bezeichnen kann.
- source_word: תְרָפִים
  choice: Terafim
  rationale: Die Umschrift vermeidet eine vorschnelle Festlegung auf „Hausgötter“ oder „Götzenbilder“; eine Fußnote erklärt die wahrscheinliche Funktion als häusliche Kultobjekte.
theological_decisions:
- issue: Ob die Aufzählung sowohl anerkannte als auch verurteilte Kulteinrichtungen umfasst
  choice: Die einzelnen Begriffe werden ohne harmonisierende Wertung wiedergegeben; Israel bleibt ohne politische Führung und ohne die genannten kultischen Einrichtungen.
  alternative: Die gesamte Kultliste ausschließlich als rechtmäßige oder ausschließlich als unrechtmäßige Gottesverehrung deuten.
  rationale: Schlachtopfer und Efod können mit anerkannter Gottesverehrung verbunden sein, Kultstein und Terafim andernorts mit verurteilter Kultpraxis. Der Text stellt sie nebeneinander, ohne die Spannung hier aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur hält die politischen und kultischen Entbehrungen parallel. Fachbegriffe werden nur dort transliteriert, wo eine eindeutige deutsche Entsprechung die Mehrdeutigkeit des Ausgangstextes verengen würde.
