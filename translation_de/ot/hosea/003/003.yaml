  text: וָ/אֹמַ֣ר אֵלֶ֗י/הָ יָמִ֤ים רַבִּים֙ תֵּ֣שְׁבִי לִ֔/י לֹ֣א תִזְנִ֔י וְ/לֹ֥א תִֽהְיִ֖י לְ/אִ֑ישׁ וְ/גַם אֲנִ֖י אֵלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/003.yaml
  text: And I said to her, “You must remain for me many days; you must not prostitute yourself, and you must not belong to a man; and I also will be toward you.”
translation:
  language: de
  text: 'Und ich sagte zu ihr: »Viele Tage sollst du bei mir bleiben. Du sollst keine Unzucht treiben und keinem Mann gehören; und auch ich werde mich dir gegenüber so verhalten.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der letzte Satz ist im Hebräischen verkürzt, wörtlich etwa: »und auch ich zu dir«. Gemeint ist wahrscheinlich ein entsprechendes Verhalten Hoseas ihr gegenüber.'
    reason: Die hebräische Ellipse ist in natürlichem Deutsch nicht unmittelbar nachzubilden; die Fußnote macht die Ergänzung und die verbleibende Mehrdeutigkeit transparent.
lexical_decisions:
- source_word: תֵּשְׁבִי לִי
  choice: sollst du bei mir bleiben
  rationale: Das Verb ישׁב bezeichnet hier ein längeres Bleiben oder Verweilen; לִי drückt die auf Hosea bezogene Bindung aus. »Bei mir bleiben« ist natürliches Deutsch und wahrt diesen Beziehungsbezug.
- source_word: לֹא תִזְנִי
  choice: Du sollst keine Unzucht treiben
  rationale: זנה bezeichnet sexuelle Untreue beziehungsweise Prostitution. »Unzucht treiben« erhält die ethisch-sexuelle Bedeutung, ohne enger als der hebräische Ausdruck ausschließlich gewerbsmäßige Prostitution festzulegen.
- source_word: וְלֹא תִהְיִי לְאִישׁ
  choice: und keinem Mann gehören
  rationale: Wörtlich steht »und du sollst nicht einem Mann sein«. »Keinem Mann gehören« gibt die relationale Zugehörigkeit idiomatisch wieder und lässt offen, ob vor allem Ehe, sexuelle Verbindung oder beides gemeint ist.
- source_word: וְגַם אֲנִי אֵלָיִךְ
  choice: und auch ich werde mich dir gegenüber so verhalten
  rationale: Der elliptische Satz enthält kein ausdrückliches Verb; אֵלָיִךְ bedeutet »zu/gegenüber dir«. Die Wiedergabe bewahrt die Gegenseitigkeit und ergänzt nur das im Deutschen notwendige Prädikat, ohne eine spezifischere Beziehungshandlung festzulegen.
theological_decisions:
- issue: Bedeutung der abschließenden Ellipse וְגַם אֲנִי אֵלָיִךְ
  choice: und auch ich werde mich dir gegenüber so verhalten
  alternative: und auch ich werde dir gehören / mich dir enthalten
  rationale: Der hebräische Text lässt die genaue Verpflichtung Hoseas unausgesprochen. Die gewählte Formulierung bezieht sie spiegelbildlich auf die zuvor auferlegte Enthaltsamkeit, ohne den mehrdeutigen Ausdruck zu einer eindeutigen Zusage von Zugehörigkeit oder sexueller Abstinenz zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede folgt dem verpflichtenden Ton der hebräischen Imperfektformen im Kontext. Die altertümliche oder missverständliche Formulierung »für mich sitzen« wird vermieden; die Ellipse am Versende wird behutsam verdeutlicht und in einer Fußnote offengelegt.
