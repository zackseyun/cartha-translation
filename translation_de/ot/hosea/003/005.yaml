  text: אַחַ֗ר יָשֻׁ֨בוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בִקְשׁוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וְ/אֵ֖ת דָּוִ֣ד מַלְכָּ֑/ם וּ/פָחֲד֧וּ אֶל יְהוָ֛ה וְ/אֶל טוּב֖/וֹ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/005.yaml
  text: Afterward the children of Israel will return and seek Yahweh their God and David their king[c][b][a], and they will come in fear to Yahweh and to his goodness in the latter days.
translation:
  language: de
  text: Danach werden die Israeliten umkehren und Jahwe, ihren Gott, und David, ihren König, suchen.[a] Voll Ehrfurcht[b] werden sie zu Jahwe und zu seiner Güte kommen – in den letzten Tagen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „David, ihren König“ kann David als königliche Repräsentationsfigur oder einen künftigen Herrscher aus dem Haus Davids bezeichnen; der hebräische Wortlaut legt dies nicht näher fest.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Zitternd werden sie zu Jahwe und zu seiner Güte kommen“; auch möglich: „Sie werden Jahwe und seine Güte fürchten.“'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „am Ende der Tage“; auch: „in späteren Tagen“ oder „in künftigen Tagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר
  choice: Danach
  rationale: Markiert die zeitliche Folge nach der in den vorhergehenden Versen beschriebenen Entbehrung.
- source_word: יָשֻׁבוּ
  choice: werden ... umkehren
  rationale: Gibt שׁוב als Rückkehr beziehungsweise Umkehr wieder und lässt die räumliche wie die bundestheologische Bedeutung offen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Natürliche moderne deutsche Bezeichnung für das hebräische Ethnonym, ohne es unnötig auf Männer zu beschränken.
- source_word: וּבִקְשׁוּ
  choice: und ... suchen
  rationale: Bewahrt den Sinn eines ernsthaften Suchens; der Zukunftsbezug wird durch das finite Verb der deutschen Reihung getragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵיהֶם
  choice: ihren Gott
  rationale: Bewahrt die durch das Suffix ausgedrückte Bundesbeziehung.
- source_word: וְאֵת דָּוִד מַלְכָּם
  choice: und David, ihren König
  rationale: Behält die ausdrückliche Nennung Davids bei und löst nicht auf, ob der historische David oder ein künftiger davidischer Herrscher gemeint ist.
- source_word: וּפָחֲדוּ אֶל
  choice: Voll Ehrfurcht werden sie ... kommen
  rationale: Die Verbindung von פחד mit אֶל beschreibt wahrscheinlich ein ehrfürchtiges, von Zittern begleitetes Hinzukommen; die Formulierung wahrt Furcht und Bewegung, ohne Gottes Güte als bloße Bedrohung erscheinen zu lassen.
- source_word: וְאֶל טוּבוֹ
  choice: und zu seiner Güte
  rationale: Bewahrt das abstrakte טוּב und lässt sowohl Gottes gütiges Wesen als auch seine Wohltaten anklingen.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: in der letzten Zeit
  rationale: Natürliche prophetische Wendung im Deutschen, die eine kommende End- beziehungsweise Spätzeit bezeichnet, ohne ein bestimmtes Endzeitschema festzulegen.
theological_decisions:
- issue: Identität von „David, ihrem König“
  choice: Die Wendung bleibt unverändert und unerklärt im Haupttext stehen.
  alternative: Ein künftiger davidischer beziehungsweise messianischer König.
  rationale: Der hebräische Text nennt David unmittelbar, bestimmt aber nicht ausdrücklich, wie diese Gestalt zeitlich oder typologisch zu verstehen ist.
- issue: Bedeutung von פחדו אל יהוה ואל טובו
  choice: Als ehrfürchtiges Kommen zu Jahwe und seiner Güte wiedergegeben.
  alternative: „Sie werden Jahwe und seine Güte fürchten.“
  rationale: אֶל legt eine Bewegung hin zu Jahwe nahe; zugleich muss die im Verb enthaltene Furcht beziehungsweise das Zittern erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Israeliten“ ist allgemein verständlich; „Jahwe“ erhält den Gottesnamen. Die Satzstellung vermeidet altertümliche Härte, während die prophetische Spannung und die Mehrdeutigkeit der Schlüsselwendungen durch Fußnoten gewahrt bleiben.
