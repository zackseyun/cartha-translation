base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/003.yaml
  text: The pride of your heart has deceived you[a], you who dwell in the clefts of the rock, whose dwelling is on high, who say in your heart[c][b], “Who will bring me down to the ground?”
translation:
  language: de
  text: 'Der Hochmut deines Herzens hat dich getäuscht[a] — du, der du in den Felsklüften wohnst[b], hoch oben deinen Wohnsitz hast und in deinem Herzen sagst: »Wer wird mich zur Erde hinabbringen[c]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Übermut“ beziehungsweise „Die Vermessenheit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher könnte der Satz unter Wahrung des Personenwechsels lauten: „der in den Felsklüften wohnt, dessen Wohnsitz hoch ist, der in seinem Herzen sagt“. Die Felsklüfte erinnern an schwer zugängliche, gut zu verteidigende Wohn- und Zufluchtsorte.'
    reason: textual_and_cultural_note
  - marker: c
    text: 'Oder: „zu Boden hinabbringen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְדוֹן
  choice: Übermut
  rationale: Das Substantiv bezeichnet stolze, vermessene Selbstüberhebung. „Übermut“ verbindet Hochmut mit der hier mitschwingenden anmaßenden Selbstsicherheit.
- source_word: לִבְּךָ
  choice: deines Herzens
  rationale: „Herz“ bleibt als hebräisches Bild für das innere Denken, Wollen und Selbstverständnis erhalten.
- source_word: הִשִּׁיאֶךָ
  choice: hat dich getäuscht
  rationale: Der Hifil von נשׁא bezeichnet hier das Irreführen oder Täuschen; die Form stellt die Täuschung als eingetreten dar.
- source_word: שֹׁכְנִי
  choice: du, der du ... wohnst
  rationale: Das Partizip beschreibt den direkt angeredeten kollektiven Adressaten und wird im Deutschen natürlich als appositioneller Relativsatz wiedergegeben.
- source_word: בְחַגְוֵי סֶּלַע
  choice: in den Felsklüften
  rationale: חגוי bezeichnet Spalten, Klüfte oder verborgene Rückzugsorte im Fels. „Felsklüfte“ ist anschaulich und lässt die befestigte, schwer zugängliche Lage erkennen.
- source_word: מְרוֹם שִׁבְתּוֹ
  choice: hoch oben deinen Wohnsitz hast
  rationale: Die Wendung bezeichnet die große Höhe des Wohnortes. Die Übersetzung bewahrt den räumlichen Gegensatz zum Hinabbringen zur Erde.
- source_word: אֹמֵר בְּלִבּוֹ
  choice: in deinem Herzen sagst
  rationale: Obwohl der masoretische Text hier formal in die dritte Person wechselt, wird die fortlaufende direkte Anrede an Edom im Deutschen beibehalten.
- source_word: מִי יוֹרִדֵנִי
  choice: Wer wird mich ... hinabbringen?
  rationale: Der Hifil von ירד bedeutet „hinabbringen“. Die Frage bringt die trotzige Sicherheit des hoch gelegenen Bewohners zum Ausdruck.
- source_word: אָרֶץ
  choice: zur Erde
  rationale: „Erde“ gibt אֶרֶץ formal wieder und bildet einen deutlichen vertikalen Gegensatz zum hoch gelegenen Wohnsitz; kontextuell ist auch „zu Boden“ möglich.
theological_decisions:
- issue: Wechsel zwischen direkter Anrede in der zweiten Person und Formen der dritten Person
  choice: 'Die beschreibenden Satzteile werden als fortgesetzte direkte Anrede an Edom formuliert: „du, der du ... deinen ... deinem“.'
  alternative: 'Den formalen Personenwechsel abbilden: „der in den Felsklüften wohnt, dessen Wohnsitz hoch ist, der in seinem Herzen sagt“'
  rationale: Der Vers beginnt mit Suffixen der zweiten Person, während שֹׁכְנִי wahrscheinlich eine alte bzw. ungewöhnliche Form oder textlich schwierige Lesart darstellt und die folgenden Formen die dritte Person zeigen. Der Zusammenhang behandelt Edom als kollektives Gegenüber. Die direkte Anrede ergibt einen verständlichen deutschen Satz, während eine Fußnote die echte grammatische Spannung offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetisch-prophetische Anrede und das Körperbild „Herz“ bleiben erhalten. „Übermut“ ist geläufig und trägt sowohl Stolz als auch vermessene Selbstsicherheit. Der Gedankenstrich gliedert die Anklage von der Beschreibung des Adressaten; die grammatische Spannung des hebräischen Personenwechsels wird nicht verschwiegen, sondern in Fußnote [b] dokumentiert.
