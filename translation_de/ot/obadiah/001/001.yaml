  verdict: revise
  source_fidelity: Die Übersetzung gibt die Überschrift, die Botenformel, den Gegenstand der Botschaft, den unbestimmten Plural »wir«, die Herkunft der Kunde, die Sendung des Boten und den Aufruf zum Krieg insgesamt quellentreu wieder. Das feminine Suffix in עָלֶיהָ wird mit »sie« angemessener abgebildet als mit dem deutschen Neutrum »es«; die Fußnote erläutert dies weiterhin.
  naturalness: »Lasst uns gegen es zum Kampf aufstehen« ist im modernen Deutschen unnötig schwerfällig und wegen der Wiederholung von »aufstehen« unidiomatisch. »Lasst uns gegen sie zum Kampf aufbrechen« ist ein natürlicher, nachdrücklicher militärischer Aufruf, ohne den Sinn zu verändern.
  terminology: »Vision«, »Obadja«, »So spricht«, »über Edom«, »Kunde«, »Bote« und »Völker« sind sachgerecht. »der Herr Yahweh« folgt der im Entwurf gewählten transparenten Wiedergabe von אֲדֹנָי יְהוִה; sie ist zwar markiert, aber verständlich und terminologisch konsistent mit der Wiedergabe des Gottesnamens im weiteren Vers.
