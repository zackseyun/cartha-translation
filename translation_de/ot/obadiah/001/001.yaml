  to: 'Die Vision Obadjas. So spricht der Herr Yahweh über Edom: Wir[a] haben eine Kunde von Yahweh gehört, und ein Bote[b] ist unter die Völker gesandt worden: »Steht auf! Lasst uns gegen sie[c] zum Kampf aufbrechen.«'
