id: OBA.1.1
reference: Obadiah 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חֲז֖וֹן עֹֽבַדְיָ֑ה כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לֶ/אֱד֗וֹם שְׁמוּעָ֨ה שָׁמַ֜עְנוּ מֵ/אֵ֤ת יְהוָה֙ וְ/צִיר֙ בַּ/גּוֹיִ֣ם שֻׁלָּ֔ח ק֛וּמוּ וְ/נָק֥וּמָה עָלֶי/הָ לַ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/001.yaml
  text: 'The vision of Obadiah[a]. Thus says the Lord GOD concerning Edom: We have heard a report from Yahweh, and a messenger has been sent among the nations: “Rise up[c][b], and let us rise against her for battle.”'
translation:
  language: de
  text: 'Die Vision Obadjas. So spricht der Herr Yahweh über Edom: Wir[a] haben eine Kunde von Yahweh gehört, und ein Bote[b] ist unter die Völker gesandt worden: »Steht auf! Lasst uns gegen sie[c] zum Kampf aufbrechen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wer mit »wir« und »lasst uns« gemeint ist, wird im Hebräischen nicht ausdrücklich gesagt und kann unterschiedlich verstanden werden.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »ein Gesandter« beziehungsweise »ein Abgesandter«.'
    reason: lexical_alternative
  - marker: c
    text: Das Hebräische hat »gegen sie«; das feminine Pronomen bezieht sich auf Edom als Nation.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזוֹן
  choice: Vision
  rationale: Das Substantiv bezeichnet gewöhnlich eine prophetische Schau oder Offenbarung. »Vision« gibt die Überschrift direkt wieder, ohne die Art der Offenbarung näher festzulegen.
- source_word: עֹבַדְיָה
  choice: Obadja
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Dies ist die geläufige, würdevolle deutsche Wiedergabe der prophetischen Botenformel.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Yahweh
  rationale: Die Verbindung aus אֲדֹנָי und dem Gottesnamen wird transparent als Titel plus Eigenname wiedergegeben und vermeidet die unnatürliche Doppelung »Herr HERR«.
- source_word: לֶאֱדוֹם
  choice: über Edom
  rationale: Die Präposition führt hier den Gegenstand der Botschaft ein; Edom wird nicht unmittelbar angeredet.
- source_word: שְׁמוּעָה
  choice: Nachricht
  rationale: Das Wort bezeichnet etwas Gehörtes, also eine Nachricht oder Kunde. »Nachricht« ist im modernen Deutsch klar und unterstellt anders als »Gerücht« keine Unsicherheit.
- source_word: שָׁמַעְנוּ
  choice: wir haben ... gehört
  rationale: Das Perfekt bezeichnet das empfangene Gehörte mit gegenwärtiger Relevanz; die nicht näher bestimmte erste Person Plural bleibt erhalten.
- source_word: מֵאֵת יְהוָה
  choice: von Yahweh
  rationale: Die Herkunft der Nachricht wird ausdrücklich mit dem Gottesnamen angegeben.
- source_word: וְצִיר
  choice: und ein Bote
  rationale: צִיר kann einen Boten, Gesandten oder Abgesandten bezeichnen. »Bote« ist breit genug und passt zum Überbringen des Aufrufs.
- source_word: בַּגּוֹיִם
  choice: unter die Völker
  rationale: Mit dem passiven Verb des Sendens bezeichnet בְּ hier den Bereich beziehungsweise die Adressatengruppe, in die der Bote gesandt wird.
- source_word: שֻׁלָּח
  choice: ist ... gesandt worden
  rationale: Die passive Perfektform wird als abgeschlossene Sendung mit fortwirkender Bedeutung wiedergegeben.
- source_word: קוּמוּ
  choice: Steht auf!
  rationale: Der männliche Pluralimperativ bildet einen kräftigen militärischen Aufruf, ohne im Deutschen altertümlich zu wirken.
- source_word: וְנָקוּמָה עָלֶיהָ לַמִּלְחָמָה
  choice: Lasst uns gegen es zum Kampf aufstehen
  rationale: Der Kohortativ und die Kampfwendung werden eng am Hebräischen wiedergegeben. Das Pronomen bezieht sich auf Edom; sein grammatisches Geschlecht lässt sich im Deutschen nicht unverändert abbilden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname bleibt als Eigenname sichtbar. In der Verbindung אֲדֹנָי יְהוִה ergibt sich dadurch die klare Form »der Herr Yahweh«.
- issue: Sprecherbezug der ersten Person Plural
  choice: Die Formen »wir« und »lasst uns« bleiben unbestimmt
  alternative: Festlegung auf den Propheten, einen himmlischen Rat oder die versammelten Völker
  rationale: Der hebräische Text nennt die Sprecher nicht eindeutig. Eine ausdrückliche Zuordnung würde eine echte literarische und theologische Mehrdeutigkeit auflösen.
- issue: Personifizierung Edoms in עָלֶיהָ
  choice: Neutrales deutsches Pronomen »es« mit Fußnote zur femininen hebräischen Form
  alternative: »gegen sie« als Personifizierung Edoms
  rationale: Edom ist im Deutschen grammatisch sächlich. Die Übersetzung wahrt einen natürlichen deutschen Bezug, während die Fußnote die feminine Form und damit die mögliche Vorstellung Edoms als Nation kenntlich macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Diktion. Die Botenformel bleibt feierlich, ohne archaische Verbformen zu verwenden. Hebräische Mehrdeutigkeiten werden nicht stillschweigend aufgelöst.
