source:
  edition: WLC
  text: וְ/עָל֤וּ מֽוֹשִׁעִים֙ בְּ/הַ֣ר צִיּ֔וֹן לִ/שְׁפֹּ֖ט אֶת הַ֣ר עֵשָׂ֑ו וְ/הָיְתָ֥ה לַֽ/יהוָ֖ה הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/021.yaml
  text: Deliverers will go up on Mount Zion to judge the hill country of Esau[c][b][a], and the kingdom will belong to Yahweh.
translation:
  language: de
  text: Retter[a] werden auf den Berg Zion hinaufziehen, um über das Bergland Esaus[b] zu richten. Und die Königsherrschaft[c] wird dem HERRN gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Befreier“ oder „Heilbringer“. Das hebräische Wort bezeichnet hier mehrere Personen, die Rettung herbeiführen; die letzte Aussage des Verses schreibt die Königsherrschaft dem HERRN zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „den Berg Esaus“. Gemeint ist wahrscheinlich das gebirgige Gebiet Edoms.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „das Königtum“ oder „die Herrschaft“. Das hebräische Wort kann die Königswürde, die Ausübung königlicher Herrschaft oder den Herrschaftsbereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלוּ
  choice: werden ... hinaufziehen
  rationale: Das Qal-Perfekt mit vorangestelltem ו setzt die prophetische Abfolge fort und wird im Deutschen natürlich futurisch wiedergegeben. „Hinaufziehen“ bewahrt sowohl die konkrete Aufwärtsbewegung als auch den Bezug zum Berg Zion.
- source_word: מוֹשִׁעִים
  choice: Retter
  rationale: Das pluralische Partizip bezeichnet Personen, die Rettung oder Befreiung herbeiführen. „Retter“ ist knapp, verständlich und bewahrt die personale, menschliche Mittlerrolle, ohne die abschließende Aussage über die Herrschaft des HERRN abzuschwächen.
- source_word: בְּהַר צִיּוֹן
  choice: auf den Berg Zion
  rationale: Die Präposition bezeichnet hier das Ziel der Aufwärtsbewegung. „Auf den Berg Zion“ ist im Deutschen idiomatisch und erhält den topografischen Sinn.
- source_word: לִשְׁפֹּט
  choice: um ... zu richten
  rationale: שׁפט bedeutet im Kern „richten“; je nach Zusammenhang kann auch regierendes oder herrschendes Handeln eingeschlossen sein. Die Übersetzung bewahrt den unmittelbaren lexikalischen Sinn.
- source_word: אֶת הַר עֵשָׂו
  choice: über das Bergland Esaus
  rationale: הַר kann neben einem einzelnen Berg auch eine gebirgige Region bezeichnen. Da Esau hier für Edom und dessen Gebiet steht, gibt „Bergland Esaus“ den wahrscheinlichen territorialen Sinn natürlich wieder. Das deutsche „über“ gehört zur Konstruktion „über jemanden oder etwas richten“ und entspricht funktional dem hebräischen Objektmarker אֶת.
- source_word: וְהָיְתָה לַיהוָה
  choice: Und ... wird dem HERRN gehören
  rationale: Die Konstruktion היה mit ל und einem Besitzer wird im Deutschen idiomatisch mit „gehören“ wiedergegeben. Dadurch bleibt der Besitz- beziehungsweise Zuordnungscharakter der hebräischen Aussage erhalten.
- source_word: הַמְּלוּכָה
  choice: die Königsherrschaft
  rationale: Das Substantiv kann Königtum, königliche Herrschaft oder Herrschaftsbereich bezeichnen. „Königsherrschaft“ hebt die Ausübung souveräner Herrschaft hervor, ohne die mögliche institutionelle oder territoriale Nuance auszuschließen.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Der Gottesname יהוה wird gemäß der deutschen Bibelkonvention mit „der HERR“ wiedergegeben; der Dativ bildet die Präposition ל innerhalb der Besitzkonstruktion ab.
theological_decisions:
- issue: Pluralische menschliche Retter in Verbindung mit der alleinigen Königsherrschaft Gottes
  choice: Retter
  alternative: Befreier; Heilbringer
  rationale: Der Text nennt mehrere menschliche Akteure, die Rettung bewirken, und schließt zugleich mit der Königsherrschaft des HERRN. „Retter“ erhält diese Spannung und macht die menschlichen Akteure weder zu Rivalen Gottes noch zu bloß unpersönlichen Werkzeugen.
- issue: Bedeutungsumfang von הַמְּלוּכָה
  choice: die Königsherrschaft wird dem HERRN gehören
  alternative: das Königtum wird dem HERRN gehören; die Herrschaft wird dem HERRN gehören
  rationale: Das Hebräische kann sowohl das Königtum als auch die Ausübung königlicher Herrschaft bezeichnen. „Königsherrschaft“ bewahrt beide Komponenten möglichst deutlich; die Fußnote hält die genuine Bedeutungsbreite offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hinaufziehen“, „richten“ und „Königsherrschaft“ bewahren die prophetische und königliche Bildsprache, ohne archaische Formen wie „Heilande“ oder unnötig konfessionell geprägte Begriffe zu verwenden. Der abschließende hebräische Satz wird als eigener deutscher Satz gestaltet, um seinen klimaktischen Nachdruck hörbar zu machen.
