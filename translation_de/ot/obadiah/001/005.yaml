source:
  edition: WLC
  text: אִם גַּנָּבִ֤ים בָּאֽוּ לְ/ךָ֙ אִם שׁ֣וֹדְדֵי לַ֔יְלָה אֵ֣יךְ נִדְמֵ֔יתָה הֲ/ל֥וֹא יִגְנְב֖וּ דַּיָּ֑/ם אִם בֹּֽצְרִים֙ בָּ֣אוּ לָ֔/ךְ הֲ/ל֖וֹא יַשְׁאִ֥ירוּ עֹלֵלֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/005.yaml
  text: If thieves came to you[a], if robbers by night—how you have been destroyed!—would they not steal only enough for themselves? If grape gatherers came to you[b], would they not leave gleanings?
translation:
  language: de
  text: Wenn Diebe zu dir gekommen wären, wenn Räuber in der Nacht gekommen wären – wie bist du vernichtet worden! –, hätten sie nicht nur so viel gestohlen, wie sie brauchten?[a] Wenn Traubenleser zu dir gekommen wären, hätten sie nicht Nachlesetrauben zurückgelassen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Hätten sie nicht ihre Genüge gestohlen?“, also nur so viel, wie ihnen genügte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּנָּבִים
  choice: Diebe
  rationale: Die übliche und natürliche deutsche Entsprechung für Menschen, die stehlen.
- source_word: שֹׁדְדֵי לַיְלָה
  choice: Räuber in der Nacht
  rationale: Gibt sowohl den gewaltsamen Beutezug als auch die Zeitangabe wieder, ohne die Formulierung unnötig zu spezifizieren.
- source_word: אֵיךְ נִדְמֵיתָה
  choice: wie bist du vernichtet worden!
  rationale: Der Niphal von דמה bezeichnet hier im Zusammenhang die Vernichtung beziehungsweise völlige Verwüstung; אֵיךְ leitet einen klagenden Ausruf ein.
- source_word: הֲלוֹא יִגְנְבוּ דַּיָּם
  choice: hätten sie nicht nur so viel gestohlen, wie sie brauchten?
  rationale: דַּיָּם bedeutet wörtlich ihre Genüge beziehungsweise das für sie ausreichende Maß. Die idiomatische Wiedergabe macht deutlich, dass gewöhnliche Diebe nicht alles fortnehmen.
- source_word: בֹּצְרִים
  choice: Traubenleser
  rationale: Bezeichnet spezifisch Menschen bei der Weinlese und bewahrt das landwirtschaftliche Bild.
- source_word: יַשְׁאִירוּ עֹלֵלוֹת
  choice: hätten sie nicht eine Nachlese übrig gelassen?
  rationale: עֹלֵלוֹת sind die nach der hauptsächlichen Weinlese verbliebenen Trauben; „Nachlese“ bewahrt das Bild und den Gedanken, dass nicht alles restlos entfernt wird.
- source_word: לְךָ / לָךְ
  choice: zu dir
  rationale: Entspricht der Präposition ל bei einem Verb des Kommens; die feindliche Absicht ergibt sich aus dem Zusammenhang.
theological_decisions:
- issue: Zeitliche Einordnung der irrealen Vergleiche
  choice: 'Konjunktiv II der Vergangenheit: „gekommen wären … hätten sie“'
  alternative: 'Indikativ: „Wenn Diebe zu dir kamen …“'
  rationale: Die rhetorischen Vergleichssätze beschreiben, was gewöhnliche Diebe oder Traubenleser getan hätten, im Gegensatz zu Edoms vollständiger Verwüstung. Der deutsche Konjunktiv macht diese hypothetische Funktion klar, ohne eine theologische Deutung hinzuzufügen.
- issue: Bedeutung von אֵיךְ נִדְמֵיתָה
  choice: „wie bist du vernichtet worden!“
  alternative: „wie bist du abgeschnitten worden!“ / „wie bist du zugrunde gerichtet worden!“
  rationale: Die Wiedergabe hält den klagenden Ausruf und die Aussage umfassender Verwüstung fest, ohne deren Urheber ausdrücklich zu benennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bewahrt den abrupt eingeschobenen Klageruf und die beiden anschaulichen Vergleiche. „Nachlese“ ist ein geläufiger, präziser Begriff für zurückgelassene Trauben. Der Fußnotenmarker [a] steht unmittelbar bei der idiomatischen Wiedergabe.
