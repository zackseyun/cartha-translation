review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur ist richtig wiedergegeben: Die Ankündigung des Tages Jahwes betrifft alle Völker, während die zweite Vershälfte Edom direkt im Singular anspricht. Allerdings ist גְּמֻלְךָ im Kontext nicht neutral „dein Tun“, sondern die einem Täter zukommende Vergeltung bzw. Rückzahlung. Die vorliegende Wiedergabe verschiebt daher die Referenz des Nomens. Außerdem ist „nahe über alle Völker“ im modernen Deutschen keine tragfähige Verbindung für die hebräische Wendung.'
  naturalness: „Denn der Tag Jahwes ist nahe über alle Völker“ klingt im modernen Standarddeutsch unidiomatisch. Die Formulierung „nahe, über alle Völker zu kommen“ erhält den gerichteten Sinn von עַל und ist zugleich verständlich. Die knappe Entsprechungsformel „Wie du getan hast, so wird dir getan werden“ ist als prophetische Sprache natürlich.
  terminology: „Tag Jahwes“ und „Völker“ sind angemessen. „Vergeltung“ gibt גְּמֻלְךָ hier besser wieder als „Tun“, ohne ein bestimmtes theologisches Deutungsmodell hinzuzufügen. Die Fußnote muss die irreführende Behauptung entfernen, das Wort bezeichne hier gleichermaßen das eigene Handeln.
  issues:
  - severity: medium
    issue: גְּמֻלְךָ ist als „dein Tun“ übersetzt.
    rationale: Im Vergeltungskontext und mit „wird auf deinen Kopf zurückkehren/zurückfallen“ bezeichnet das Wort die dem Angeredeten zukommende Rückzahlung bzw. Vergeltung, nicht primär seine vorausgehende Tat.
  - severity: medium
    issue: „ist nahe über alle Völker“ ist unnatürliches modernes Deutsch.
    rationale: Die Präpositionalverbindung kann im Deutschen weder die zeitliche Nähe noch die gerichtete Wirkung von עַל idiomatisch ausdrücken. Eine geringfügig entfaltete Formulierung stellt beides klar.
  - severity: low
    issue: Fußnote b beschreibt die Bedeutungsbreite im gegebenen Kontext zu weit.
    rationale: Die Aussage, das Wort könne hier sowohl das eigene Tun als auch die darauf folgende Erfahrung bezeichnen, stützt die unpassende Haupttextlesart und verwischt die retributive Bedeutung.
  revised_text: Denn der Tag Jahwes ist nahe, über alle Völker zu kommen[a]. Wie du getan hast, so wird dir getan werden; deine Vergeltung wird auf deinen Kopf zurückfallen.
