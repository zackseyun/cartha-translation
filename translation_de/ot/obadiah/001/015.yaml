source:
  edition: WLC
  text: כִּֽי קָר֥וֹב יוֹם יְהוָ֖ה עַל כָּל הַ/גּוֹיִ֑ם כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ יֵעָ֣שֶׂה לָּ֔/ךְ גְּמֻלְ/ךָ֖ יָשׁ֥וּב בְּ/רֹאשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/015.yaml
  text: For the day of Yahweh is near upon all the nations[a]. As you have done, it will be done to you[b]; your recompense will return on your own head.
translation:
  language: de
  text: Denn der Tag Jahwes ist nahe, über alle Völker zu kommen[a]. Wie du getan hast, so wird dir getan werden; deine Vergeltung wird auf deinen Kopf zurückfallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen alle Völker«. Die Präposition kann hier ein gegen die Völker gerichtetes Gericht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Warnung ein und gibt den erklärend-kausalen Zusammenhang natürlich wieder.
- source_word: קָרוֹב
  choice: ist nahe
  rationale: Gibt das prädikative Adjektiv und die angekündigte zeitliche Nähe direkt wieder.
- source_word: יוֹם יְהוָה
  choice: der Tag Jahwes
  rationale: Bewahrt die feste prophetische Wendung und gibt das Tetragramm als persönlichen Gottesnamen »Jahwe« wieder.
- source_word: עַל כָּל הַגּוֹיִם
  choice: über alle Völker
  rationale: Bewahrt die räumlich-gerichtete Weite von עַל, ohne seine mögliche feindliche Bedeutung im Haupttext festzuschreiben.
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: Wie du getan hast
  rationale: Erhält die knappe Vergleichsformel, die das Prinzip entsprechender Vergeltung einführt.
- source_word: יֵעָשֶׂה לָּךְ
  choice: so wird dir getan werden
  rationale: Gibt den passiven Sinn des Nifal wieder und spiegelt bewusst die vorhergehende Aussage.
- source_word: גְּמֻלְךָ
  choice: dein Tun
  rationale: Das Nomen kann die eigene Handlungsweise oder das darauf antwortende Entgelt bezeichnen. »Dein Tun« passt zum Rückkehrmotiv und bleibt in modernem Deutsch verständlich; die Vergeltungsbedeutung wird in einer Fußnote offengehalten.
- source_word: יָשׁוּב בְּרֹאשֶׁךָ
  choice: wird auf deinen eigenen Kopf zurückfallen
  rationale: Gibt das Zurückkehren der Folgen idiomatisch wieder; »auf den eigenen Kopf« bezeichnet die persönliche Verantwortlichkeit.
theological_decisions:
- issue: Reichweite des Tages Jahwes
  choice: Ein naher Gerichtstag Jahwes über alle Völker, während Edom weiterhin direkt angeredet wird
  alternative: Ein ausschließlich auf Edom begrenztes Gericht
  rationale: »Über alle Völker« erweitert ausdrücklich den Horizont, ohne den unmittelbaren Bezug auf Edom in der zweiten Vershälfte aufzuheben.
- issue: Art der Vergeltung
  choice: Edoms Tun kehrt im Zusammenhang mit dem Tag Jahwes als entsprechendes Gericht auf Edom zurück
  alternative: Ein unpersönlicher, gleichsam karmischer Ursache-Wirkungs-Zusammenhang
  rationale: Der Zusammenhang mit dem Tag Jahwes kennzeichnet die Vergeltung als göttliches Gericht. Der Haupttext fügt das handelnde Subjekt dennoch nicht ausdrücklich ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Satzführung. Die Wiederholung von »getan«/»getan werden« bildet die Vergeltungsformel des Hebräischen ab; »zurückfallen« ist im Deutschen idiomatischer als ein wörtliches »zurückkehren« auf den Kopf.
