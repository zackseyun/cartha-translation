revisions:
- from: Denn der Tag Jahwes ist nahe über alle Völker[a]. Wie du getan hast, so wird dir getan werden; dein Tun[b] wird auf deinen eigenen Kopf zurückfallen.
  to: Denn der Tag Jahwes ist nahe, über alle Völker zu kommen[a]. Wie du getan hast, so wird dir getan werden; deine Vergeltung wird auf deinen Kopf zurückfallen.
  rationale: Die Revision ersetzt die unidiomatische Verbindung „nahe über“ durch eine im modernen Deutsch verständliche, den gerichteten Bezug wahrende Konstruktion. Sie gibt גְּמֻלְךָ kontextgerecht als „deine Vergeltung“ wieder und passt die zugehörige Fußnote an. Der Passivsatz und die direkte Anrede bleiben erhalten; die Übersetzung ergänzt kein ausdrückliches handelndes Subjekt.
