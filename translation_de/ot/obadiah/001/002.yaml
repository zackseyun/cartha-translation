lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel leitet die göttliche Erklärung nachdrücklich ein. „Siehe“ bewahrt diese hinweisende, rhetorische Funktion in einem würdigen deutschen Register.
- source_word: קָטֹן
  choice: klein
  rationale: Das Adjektiv bezeichnet hier geringe Größe beziehungsweise niedrigen Rang. „Klein“ gibt den Ausdruck direkt wieder und lässt die mögliche Bedeutung „unbedeutend“ offen.
- source_word: נְתַתִּיךָ
  choice: ich habe dich … gemacht
  rationale: Das Verb bedeutet wörtlich „ich habe dich gegeben/gesetzt“, hat mit dem prädikativen Adjektiv „klein“ hier aber resultative beziehungsweise faktitive Bedeutung. „Ich habe dich klein gemacht“ ist dafür natürliches Deutsch.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם bezeichnet hier allgemein die Völker beziehungsweise Nationen. „Unter den Völkern“ ist im Deutschen idiomatisch und vermeidet die spätere religiöse Engführung von „Heiden“.
- source_word: בָּזוּי
  choice: verachtet
  rationale: Das passive Partizip bezeichnet jemanden, der als verächtlich gilt beziehungsweise mit Verachtung behandelt wird. „Verachtet“ ist knapp und sachlich genau.
- source_word: מְאֹד
  choice: sehr
  rationale: Das Intensitätsadverb verstärkt „verachtet“. „Sehr“ ist die direkte und natürliche deutsche Entsprechung.
theological_decisions:
- issue: Prophetisches Perfekt beziehungsweise Aspekt der göttlichen Gerichtsaussage
  choice: „ich habe dich … gemacht“
  alternative: „ich werde dich … klein machen“ oder „ich mache dich … klein“
  rationale: Die hebräische Perfektform kann im prophetischen Zusammenhang eine feststehende göttliche Handlung oder Verfügung ausdrücken. Das deutsche Perfekt bewahrt den vollzogenen beziehungsweise beschlossenen Charakter mit gegenwärtiger Relevanz, ohne die Aussage ausdrücklich in die Zukunft zu verlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ erhält den prophetischen Nachdruck; die übrige Syntax bleibt klar und für heutige Leser verständlich.
