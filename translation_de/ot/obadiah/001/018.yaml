id: OBA.1.18
reference: Obadiah 1:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָה֩ בֵית יַעֲקֹ֨ב אֵ֜שׁ וּ/בֵ֧ית יוֹסֵ֣ף לֶהָבָ֗ה וּ/בֵ֤ית עֵשָׂו֙ לְ/קַ֔שׁ וְ/דָלְק֥וּ בָ/הֶ֖ם וַ/אֲכָל֑וּ/ם וְ/לֹֽא יִֽהְיֶ֤ה שָׂרִיד֙ לְ/בֵ֣ית עֵשָׂ֔ו כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/018.yaml
  text: The house of Jacob will be a fire[a], and the house of Joseph a flame, and the house of Esau stubble. They will burn them and consume them, and there will be no survivor for the house of Esau[b], for Yahweh has spoken.
translation:
  language: de
  text: Das Haus Jakobs wird ein Feuer sein und das Haus Josefs eine Flamme, das Haus Esaus aber Stoppeln. Sie werden unter ihnen brennen und sie verzehren[a]. Vom Haus Esaus wird kein Überlebender übrig bleiben[b], denn Jahwe hat gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie werden sie in Brand setzen und verzehren.“ Die knappe hebräische Wendung lautet wörtlich etwa: „Sie werden unter ihnen brennen und sie verzehren.“ Die Präposition kann ein Brennen inmitten des Hauses Esaus oder ein feindliches Brennen gegen es bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Vom Haus Esaus wird kein Rest übrig bleiben.“ Das hebräische Wort שָׂרִיד kann sowohl einen Überlebenden als auch einen Rest bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית יַעֲקֹב
  choice: das Haus Jakobs
  rationale: Bewahrt die prophetische Redeweise für die von Jakob abstammende Gemeinschaft; der Genitiv klingt im modernen Deutschen natürlicher als „Haus Jakob“.
- source_word: בֵית יוֹסֵף
  choice: das Haus Josefs
  rationale: Hält die formale Parallele zu „Haus Jakobs“ aufrecht und bezeichnet kollektiv die mit Josef verbundenen israelitischen Gruppen.
- source_word: אֵשׁ / לֶהָבָה
  choice: ein Feuer / eine Flamme
  rationale: Bewahrt das parallele, sich steigernde Bild des hebräischen Textes.
- source_word: בֵית עֵשָׂו לְקַשׁ
  choice: das Haus Esaus aber Stroh
  rationale: „Stroh“ gibt den leicht brennbaren Ernterückstand קַשׁ allgemeinverständlich wieder; „aber“ macht den poetischen Gegensatz deutlich, ohne einen neuen Sachgehalt einzuführen.
- source_word: וְדָלְקוּ בָהֶם וַאֲכָלוּם
  choice: Sie werden es in Brand setzen und verzehren
  rationale: Gibt innerhalb des Feuerbildes den feindlichen Brand und die vollständige Vernichtung natürlich wieder. Das singularische „es“ nimmt das kollektiv verstandene Haus Esaus auf; die kompakte Präpositionalkonstruktion bleibt in einer Fußnote sichtbar.
- source_word: שָׂרִיד
  choice: Überlebender
  rationale: Der Ausdruck kann einen Überlebenden oder Rest bezeichnen. „Überlebender“ entspricht hier der angekündigten vollständigen Vernichtung und vermeidet positive Nebenbedeutungen von „Rest“.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: denn Jahwe hat gesprochen
  rationale: Bewahrt die begründende Funktion von כִּי, den Gottesnamen und die autoritative prophetische Schlussformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ gibt den Eigennamen im Deutschen direkt wieder und entspricht der im konsultierten Projekttext bezeugten Entscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von „Haus Jakobs“, „Haus Josefs“ und „Haus Esaus“
  choice: kollektive, von den Patriarchen her benannte Völkergruppen
  alternative: nur einzelne Haushalte oder Dynastien
  rationale: Parallelismus und Kontext sprechen für korporative Größen. Die Übersetzung bewahrt die offene prophetische Haus-Metaphorik, statt sie durch konkrete Volksnamen zu ersetzen.
- issue: Umfang des Gerichts über das Haus Esaus
  choice: kein Überlebender bleibt übrig
  alternative: kein Rest bleibt übrig
  rationale: Die Aussage wird in ihrer uneingeschränkten Schärfe wiedergegeben, ohne aus dem Wort שָׂרִיד eine weitergehende systematisch-theologische Folgerung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer prophetischer Bildsprache. Die wiederholte Formel „Haus …“ bleibt erhalten. „Stroh“ ist gewöhnlicher und verständlicher als das fachsprachlichere „Stoppeln“; die knappe Satzführung wahrt den poetischen Parallelismus.
