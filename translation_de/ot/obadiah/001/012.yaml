source:
  edition: WLC
  text: וְ/אַל תֵּ֤רֶא בְ/יוֹם אָחִ֨י/ךָ֙ בְּ/י֣וֹם נָכְר֔/וֹ וְ/אַל תִּשְׂמַ֥ח לִ/בְנֵֽי יְהוּדָ֖ה בְּ/י֣וֹם אָבְדָ֑/ם וְ/אַל תַּגְדֵּ֥ל פִּ֖י/ךָ בְּ/י֥וֹם צָרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/012.yaml
  text: Do not look on your brother in the day of his misfortune[a], and do not rejoice over the sons of Judah in the day of their destruction[c][b]; and do not make your mouth great in the day of distress.
translation:
  language: de
  text: Schau nicht schadenfroh auf deinen Bruder am Tag seines Unglücks[a]. Freue dich nicht über die Söhne Judas am Tag ihres Untergangs, und rede nicht großspurig am Tag der Not.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Tag, als er zum Fremden wurde“ beziehungsweise „am Tag seiner Entfremdung“. Das zugrunde liegende hebräische Wort ist mehrdeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Mache deinen Mund nicht groß“, das heißt: Rede nicht prahlerisch oder überheblich.'
    reason: idiom_explanation
lexical_decisions:
- source_word: תֵּרֶא
  choice: schau nicht schadenfroh auf
  rationale: Das Verb bedeutet wörtlich „sehen/schauen“. Im Zusammenhang mit den parallelen Verboten, sich zu freuen und überheblich zu reden, bezeichnet es jedoch ein schadenfrohes Zuschauen. Die Wiedergabe hält das Bild des Hinschauens fest und macht den kontextuellen Sinn deutlich.
- source_word: אָחִיךָ
  choice: deinen Bruder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten. Sie unterstreicht angesichts der Abstammung Edoms und Judas von Esau und Jakob die besondere Verwerflichkeit des Verrats.
- source_word: נָכְרוֹ
  choice: seines Unglücks
  rationale: Die Form kann Fremdheit oder Entfremdung bezeichnen und im Kontext auf den Tag bezogen sein, an dem der Bruder zum Fremden beziehungsweise der Gewalt Fremder ausgeliefert wurde. „Unglück“ passt zur Parallelität mit Untergang und Not, ohne die schwierige Form zu überdeuten.
- source_word: תִּשְׂמַח
  choice: freue dich nicht
  rationale: Natürliche und genaue Wiedergabe des Verbs שמח im deutschen Verbotssatz.
- source_word: לִבְנֵי יְהוּדָה
  choice: über die Söhne Judas
  rationale: Die ausdrücklich familiär-nationale Wendung „Söhne Judas“ wird bewahrt und nicht zur allgemeineren Form „Volk von Juda“ eingeebnet.
- source_word: אָבְדָם
  choice: ihres Untergangs
  rationale: אבד bezeichnet hier das Zugrundegehen beziehungsweise den nationalen Ruin. „Untergang“ trifft den prophetischen Zusammenhang prägnant.
- source_word: תַּגְדֵּל פִּיךָ
  choice: rede nicht großspurig
  rationale: Die hebräische Wendung lautet wörtlich „mache deinen Mund groß“ und meint überhebliches, prahlerisches Reden. Die natürliche deutsche Entsprechung steht im Haupttext; das Sprachbild wird in der Fußnote dokumentiert.
- source_word: צָרָה
  choice: Not
  rationale: „Not“ gibt צָרָה knapp und würdig wieder und bildet eine natürliche feste Verbindung mit „am Tag der Not“.
theological_decisions:
- issue: Familiäre Bezeichnung für das Verhältnis Edoms zu Juda
  choice: deinen Bruder
  alternative: deinen Verwandten
  rationale: '„Bruder“ bewahrt die rhetorische und moralische Spannung des Ausgangstextes: Edom verhält sich feindselig gegenüber einem Brudervolk. Die allgemeinere Alternative würde diese Wirkung abschwächen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Mahnrede. Die Wiederholung „am Tag“ und die familiäre Bezeichnung „Bruder“ beziehungsweise „Söhne Judas“ bleiben erhalten. Schwierige hebräische Mehrdeutigkeit wird nicht im Haupttext ausgebreitet, aber in einer Fußnote transparent gemacht.
