id: OBA.1.19
reference: Obadiah 1:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יָרְשׁ֨וּ הַ/נֶּ֜גֶב אֶת הַ֣ר עֵשָׂ֗ו וְ/הַ/שְּׁפֵלָה֙ אֶת פְּלִשְׁתִּ֔ים וְ/יָרְשׁוּ֙ אֶת שְׂדֵ֣ה אֶפְרַ֔יִם וְ/אֵ֖ת שְׂדֵ֣ה שֹׁמְר֑וֹן וּ/בִנְיָמִ֖ן אֶת הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/019.yaml
  text: Those of the Negev will possess the hill country of Esau[a], and those of the Shephelah the land of the Philistines; they will also possess the territory of Ephraim and the territory of Samaria[b], and Benjamin will possess Gilead.
translation:
  language: de
  text: Die Bewohner des Negev werden das Bergland Esaus in Besitz nehmen[a] und die Bewohner der Schefela das Land der Philister[b]. Sie werden auch das Gebiet Ephraims und das Gebiet Samarias in Besitz nehmen, und Benjamin wird Gilead in Besitz nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erben“. Das hebräische Verb kann sowohl das Erben als auch das Inbesitznehmen von Land bezeichnen; ebenso bei den weiteren Vorkommen in diesem Vers.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Philister“; gemeint ist hier ihr Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: werden … in Besitz nehmen
  rationale: Das Verb ירשׁ kann das Erben ebenso wie das Erlangen oder Inbesitznehmen von Land bezeichnen. „In Besitz nehmen“ passt zum territorialen Zusammenhang, ohne die Art des Besitzerwerbs unnötig festzulegen.
- source_word: הַנֶּגֶב
  choice: die Bewohner des Negev
  rationale: Die Regionsbezeichnung steht hier metonymisch für die dort lebenden Menschen, die als Subjekt des Verbs fungieren. Der etablierte geografische Name „Negev“ bleibt erhalten.
- source_word: הַר עֵשָׂו
  choice: das Bergland Esaus
  rationale: הַר bezeichnet in diesem territorialen Ausdruck eher eine gebirgige Region als einen einzelnen Berg. „Bergland Esaus“ gibt den Bezug auf das edomitische Gebirgsgebiet natürlich wieder.
- source_word: הַשְּׁפֵלָה
  choice: die Bewohner der Schefela
  rationale: Wie beim Negev bezeichnet der Regionsname metonymisch seine Bewohner. „Schefela“ bewahrt den geografischen Eigennamen für das judäische Hügelland.
- source_word: פְּלִשְׁתִּים
  choice: das Land der Philister
  rationale: Im Hebräischen steht wörtlich das Ethnonym „Philister“. Da hier Land in Besitz genommen wird, macht die Übersetzung den territorialen Sinn ausdrücklich, ohne einen weniger verständlichen Regionsnamen einzuführen.
- source_word: שְׂדֵה אֶפְרַיִם
  choice: das Gebiet Ephraims
  rationale: שָׂדֶה bedeutet wörtlich „Feld“, kann in territorialen Wendungen aber das offene Land oder eine Region bezeichnen. „Gebiet“ vermittelt hier den geografisch-politischen Sinn.
- source_word: שְׂדֵה שֹׁמְרוֹן
  choice: das Gebiet Samarias
  rationale: Parallel zu „Gebiet Ephraims“ ist eine Region gemeint, nicht ein einzelnes Feld.
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Der Stammesname steht kollektiv für den Stamm beziehungsweise dessen Angehörige. Diese Metonymie ist auch im Deutschen verständlich und bleibt daher erhalten.
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Der hebräische Artikel muss beim im Deutschen etablierten geografischen Eigennamen nicht wiedergegeben werden.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die metonymisch als handelnde Subjekte gebrauchten Regionsnamen Negev und Schefela werden zur Verständlichkeit als deren „Bewohner“ wiedergegeben. Die parallele, territoriale Struktur des hebräischen Verses bleibt erhalten.
