  text: וְ/גָלֻ֣ת הַֽ/חֵל הַ֠/זֶּה לִ/בְנֵ֨י יִשְׂרָאֵ֤ל אֲשֶֽׁר כְּנַעֲנִים֙ עַד צָ֣רְפַ֔ת וְ/גָלֻ֥ת יְרוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/סְפָרַ֑ד יִֽרְשׁ֕וּ אֵ֖ת עָרֵ֥י הַ/נֶּֽגֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/020.yaml
  text: And the exiles of this host of the sons of Israel, who are among the Canaanites as far as Zarephath, and the exiles of Jerusalem who are in Sepharad, will possess the cities of the Negev.
translation:
  language: de
  text: Die Verbannten dieser Schar von Israeliten, die sich bei den Kanaanitern bis Sarepta befinden,[a] und die Verbannten Jerusalems, die sich in Sefarad befinden, werden die Städte des Negev in Besitz nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Wortlaut dieses Satzteils ist knapp und syntaktisch nicht eindeutig. Möglich ist auch, dass „bei den Kanaanitern bis Sarepta“ das Gebiet bezeichnet, das die erste Gruppe in Besitz nehmen wird.
    reason: Die Wortfolge אֲשֶׁר כְּנַעֲנִים עַד צָרְפַת enthält kein ausdrücklich ausgedrücktes Verb beziehungsweise keine eindeutige syntaktische Verbindung. Die Fußnote wahrt daher die konkurrierende Deutung, ohne sie im Haupttext zu bevorzugen.
lexical_decisions:
- source_word: גָלֻת
  choice: die Verbannten
  rationale: Das kollektive Substantiv bezeichnet hier die aus ihrer Heimat weggeführte Bevölkerungsgruppe; die personenbezogene Wiedergabe passt zum pluralischen Verb יִרְשׁוּ.
- source_word: הַחֵל
  choice: dieses Heeres
  rationale: חֵיל kann Heer, Streitmacht oder Schar bezeichnen. „Heer“ bewahrt den militärisch-kollektiven Sinn, ohne die Gruppe enger als „Armee“ zu bestimmen.
- source_word: יִרְשׁוּ
  choice: werden … in Besitz nehmen
  rationale: Das Verb ירשׁ bezeichnet hier die künftige Besitzergreifung der Städte und nicht bloß ein abstraktes Erben.
- source_word: הַנֶּגֶב
  choice: des Negev
  rationale: Der Ausdruck bezeichnet die geografische Südregion Judas; der etablierte deutsche Gebietsname ist hier präziser als das allgemeine „Südland“.
theological_decisions:
- issue: Bezug und Ergänzung des knappen Ausdrucks אֲשֶׁר כְּנַעֲנִים עַד צָרְפַת
  choice: „die bei den Kanaanitern bis nach Sarepta leben“
  alternative: „die das Gebiet der Kanaaniter bis nach Sarepta besitzen“ oder „die Kanaaniter bis nach Sarepta“
  rationale: Der hebräische Text ist syntaktisch knapp und offenbar elliptisch. Die gewählte Fassung versteht die Wendung als Angabe zum Aufenthaltsort der israelitischen Verbannten, markiert die Unsicherheit jedoch in einer Fußnote, statt eine umstrittene Ergänzung als eindeutig auszugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verbannten“ ist allgemein verständlich und gibt die betroffenen Menschen natürlicher wieder als das abstrakte „Exil“. Die Ortsnamen Sarepta, Sefarad und Negev bleiben als Eigennamen erhalten.
