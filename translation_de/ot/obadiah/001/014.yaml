source:
  edition: WLC
  text: וְ/אַֽל תַּעֲמֹד֙ עַל הַ/פֶּ֔רֶק לְ/הַכְרִ֖ית אֶת פְּלִיטָ֑י/ו וְ/אַל תַּסְגֵּ֥ר שְׂרִידָ֖י/ו בְּ/י֥וֹם צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/014.yaml
  text: Do not stand at the crossroads to cut off his fugitives[c][b][a], and do not hand over his survivors in the day of distress.
translation:
  language: de
  text: Stell dich nicht an die Weggabelung[a], um seine Flüchtlinge auszurotten, und liefere seine Überlebenden[c] am Tag der Not nicht aus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an die Wegscheide“ oder „an den Gebirgspass“. Das seltene hebräische Wort bezeichnet hier offenbar einen Ort, an dem Flüchtende abgefangen werden konnten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „übergib … nicht“. Das hebräische Verb bedeutet wörtlich „verschließen“ oder „einschließen“, hier im Sinn des Auslieferns an einen Feind.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die von ihm Übriggebliebenen“ beziehungsweise „seinen Rest“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲמֹד
  choice: stell dich
  rationale: עמד bezeichnet hier das bewusste Positionieren an einem Ort, um Fliehende abzufangen. Der deutsche Imperativ „stell dich“ gibt diese konkrete Handlung natürlicher wieder als das statische „steh“.
- source_word: הַפֶּרֶק
  choice: die Weggabelung
  rationale: Das seltene Substantiv bezeichnet hier wahrscheinlich eine Wegscheide beziehungsweise einen Eng- oder Übergangsort, an dem Flüchtende abgefangen werden konnten. „Weggabelung“ ist klar und gegenwärtig, ohne eine bestimmte Topografie festzulegen.
- source_word: לְהַכְרִית
  choice: um … auszurotten
  rationale: כרת im Hifil kann das Abschneiden beziehungsweise Vernichten von Menschen bezeichnen. „Ausrotten“ wahrt hier die tödliche Zielrichtung; bloßes „Abschneiden“ könnte im Deutschen nur als Versperren des Fluchtwegs verstanden werden.
- source_word: פְּלִיטָיו
  choice: seine Flüchtlinge
  rationale: פליט bezeichnet Entkommene oder Fliehende. „Flüchtlinge“ ist im Zusammenhang verständlich und gibt die akute Fluchtsituation knapp wieder.
- source_word: תַּסְגֵּר
  choice: liefere … aus
  rationale: סגר bedeutet wörtlich „verschließen/einschließen“, hat hier aber idiomatisch den Sinn, Menschen der Gewalt eines Feindes zu übergeben. „Ausliefern“ trifft diese Bedeutung im modernen Deutsch.
- source_word: שְׂרִידָיו
  choice: seine Überlebenden
  rationale: שרד bezeichnet die nach einer Katastrophe Übriggebliebenen. „Überlebende“ ist kontextuell klar und vermeidet eine nicht zwingende technische Deutung als theologischer „Rest“.
- source_word: בְּיוֹם צָרָה
  choice: am Tag der Not
  rationale: Die Wendung bezeichnet die Zeit schwerer Bedrängnis. „Am Tag der Not“ ist knapp, würdig und im Deutschen idiomatisch.
theological_decisions:
- issue: Mögliche theologische Nebenbedeutung von שְׂרִידָיו
  choice: „seine Überlebenden“
  alternative: „seinen Rest“ oder „die von ihm Übriggebliebenen“
  rationale: „Rest“ kann in prophetischen Texten ein besonderes theologisches Motiv anklingen lassen. Hier richtet sich der Vorwurf unmittelbar gegen die Auslieferung überlebender Judäer; „Überlebende“ gibt diesen Sinn wieder, ohne eine zusätzliche Lehrbedeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verbote und die konkrete Szene des Auflauerns bleiben erhalten. Seltene oder mehrdeutige hebräische Ausdrücke werden im Haupttext klar wiedergegeben und in den Fußnoten offengehalten.
