  text: וְ/חַתּ֥וּ גִבּוֹרֶ֖י/ךָ תֵּימָ֑ן לְמַ֧עַן יִכָּֽרֶת אִ֛ישׁ מֵ/הַ֥ר עֵשָׂ֖ו מִ/קָּֽטֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/009.yaml
  text: And your mighty men[a], Teman, will be shattered[c][b], so that every man from the mountain of Esau may be cut off by slaughter.
translation:
  language: de
  text: Und deine Krieger werden den Mut verlieren[a], Teman[b], sodass jeder Mann vom Berg Esaus durch das Gemetzel ausgerottet wird.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden bestürzt sein“, „werden erschrecken“ oder „werden zusammenbrechen“. Das hebräische Verb kann sowohl lähmende Angst als auch den daraus folgenden Zusammenbruch bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Teman war eine Stadt oder Landschaft in Edom; der Name ist mit dem Wort für „Süden“ verwandt.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „damit jeder Mann vom Berg Esaus im Gemetzel ausgerottet wird“. Die Verbindung kann Zweck oder Folge ausdrücken; auch die letzte Wendung lässt sich leicht unterschiedlich zuordnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחַתּוּ
  choice: werden den Mut verlieren
  rationale: Das Nifal von חתת bezeichnet hier das Erschrecken, Verzagen oder Zusammenbrechen der edomitischen Krieger. „Den Mut verlieren“ verbindet die innere Bestürzung mit dem militärischen Versagen, ohne eine rein körperliche Zerschlagung festzulegen.
- source_word: גִבּוֹרֶיךָ
  choice: deine Krieger
  rationale: גִּבּוֹר bezeichnet in diesem militärischen Zusammenhang kampfstarke Männer; „Krieger“ ist im heutigen Deutsch natürlicher und präziser als „Helden“ oder „starke Männer“.
- source_word: תֵּימָן
  choice: Teman
  rationale: Das Wort ist hier als Eigenname einer Stadt oder Landschaft Edoms zu verstehen. Die Stellung nach „deine Krieger“ lässt sich im Deutschen als direkte Anrede wiedergeben, ohne ein im Hebräischen nicht vorhandenes „o“ einzufügen.
- source_word: לְמַעַן יִכָּרֶת
  choice: sodass … ausgerottet wird
  rationale: לְמַעַן mit Imperfekt kann Zweck oder Folge ausdrücken. „Sodass“ bewahrt diese Offenheit im Deutschen besser als eine ausschließlich finale Formulierung wie „damit“.
- source_word: אִישׁ
  choice: jeder Mann
  rationale: Der maskuline Singular hat distributive Bedeutung. „Jeder Mann“ erhält sowohl die grammatische Form als auch den Kontext der vollständigen Vernichtung der männlichen Kämpfer.
- source_word: מֵהַר עֵשָׂו
  choice: vom Gebirge Esaus
  rationale: הַר kann neben einem einzelnen Berg auch Bergland oder Gebirge bezeichnen. Hier ist das edomitische Bergland gemeint; die Genitivfügung „Esaus“ bewahrt die Form des Hebräischen.
- source_word: מִקָּטֶל
  choice: durch das Gemetzel
  rationale: Die Präposition מִן bezeichnet wahrscheinlich Mittel oder Ursache. „Durch das Gemetzel“ gibt die gewaltsame Tötung deutlich wieder, ohne die syntaktische Beziehung enger festzulegen als der hebräische Text.
theological_decisions:
- issue: Zweck oder Folge bei לְמַעַן mit יִכָּרֶת
  choice: sodass jeder Mann … ausgerottet wird
  alternative: damit jeder Mann … ausgerottet werde
  rationale: Die Konstruktion kann sowohl eine beabsichtigte Folge als auch das tatsächliche Ergebnis ankündigen. „Sodass“ lässt diese Spannung bestehen und passt zu einer prophetischen Gerichtsankündigung.
- issue: Umfang und Geschlecht von אִישׁ
  choice: jeder Mann
  alternative: jeder / alle
  rationale: Die ausdrücklich maskuline Einzahl wird nicht neutralisiert. Im Zusammenhang richtet sich das Gericht besonders gegen die Krieger Edoms, während die distributive Wendung die Vollständigkeit betont.
- issue: Bedeutung von חתת
  choice: den Mut verlieren
  alternative: zerschmettert werden / erschrecken
  rationale: Das Verb kann psychische Bestürzung und daraus folgenden Zusammenbruch bezeichnen. Die Übersetzung vermeidet es, nur eine materielle Vernichtung oder nur ein Gefühl auszudrücken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Krieger“ ist unmittelbar verständlich und militärisch präzise; „Gebirge Esaus“ wahrt den territorialen Sinn. Die direkte Anrede „Teman“ bleibt ohne altertümliches „o“. Alle Mehrdeutigkeiten mit wesentlicher Auswirkung werden in den Fußnoten offengelegt.
