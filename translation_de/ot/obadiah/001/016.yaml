  text: כִּ֗י כַּֽ/אֲשֶׁ֤ר שְׁתִיתֶם֙ עַל הַ֣ר קָדְשִׁ֔/י יִשְׁתּ֥וּ כָֽל הַ/גּוֹיִ֖ם תָּמִ֑יד וְ/שָׁת֣וּ וְ/לָע֔וּ וְ/הָי֖וּ כְּ/ל֥וֹא הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/016.yaml
  text: For just as you drank on my holy mountain[a], all the nations will drink continually; they will drink and swallow[b], and they will be as though they had never been.
translation:
  language: de
  text: Denn wie ihr auf meinem heiligen Berg getrunken habt, so werden alle Völker unablässig trinken; sie werden trinken und schlucken[a], und sie werden sein, als wären sie nie gewesen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verschlingen“; das hebräische Verb kann das vollständige Schlucken des Getränks betonen.'
    reason: lexical_alternative
  - marker: b
    text: Das Trinken ist wahrscheinlich ein Bild für das Erleiden göttlichen Gerichts, wie es auch sonst bei den Propheten begegnet.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung des vorausgehenden Gerichtswortes ein und entspricht dem Zusammenhang natürlich.
- source_word: כַּאֲשֶׁר
  choice: wie … so
  rationale: Die deutsche Korrelativkonstruktion gibt den Vergleich zwischen Edoms Handeln und dem kommenden Ergehen der Völker klar und idiomatisch wieder; „so“ ist dabei sinngemäß ergänzt.
- source_word: שְׁתִיתֶם
  choice: ihr … getrunken habt
  rationale: Das Qal Perfekt 2. Person Plural wird als abgeschlossenes vergangenes Handeln der angesprochenen Gruppe wiedergegeben.
- source_word: עַל הַר קָדְשִׁי
  choice: auf meinem heiligen Berg
  rationale: Bewahrt die konkrete Ortsangabe und die Zugehörigkeitsbezeichnung des heiligen Berges in natürlichem modernem Deutsch.
- source_word: יִשְׁתּוּ
  choice: werden … trinken
  rationale: Das Imperfekt bezeichnet im prophetischen Zusammenhang die kommende Folge für die Völker.
- source_word: כָל הַגּוֹיִם
  choice: alle Völker
  rationale: „Völker“ gibt גּוֹיִם im prophetischen Gerichtskontext wieder, ohne eine spätere religiöse Gegenüberstellung durch „Heiden“ einzutragen.
- source_word: תָּמִיד
  choice: unablässig
  rationale: Bezeichnet hier das fortgesetzte, nicht nachlassende Trinken und bewahrt die intensive Wirkung des Bildes.
- source_word: וְשָׁתוּ
  choice: sie werden trinken
  rationale: Die Wiederholung des Verbs wird erhalten, da sie die Aussage rhetorisch verstärkt.
- source_word: וְלָעוּ
  choice: und hinunterschlucken
  rationale: Gibt den wahrscheinlichen Grundsinn des vollständigen Schluckens anschaulich, aber würdig wieder; abweichende Deutungen wie „taumeln“ bleiben möglich.
- source_word: וְהָיוּ כְּלוֹא הָיוּ
  choice: und sein, als wären sie nie gewesen
  rationale: Bewahrt die hebräische Vergleichsform und ihre Aussage völliger Beseitigung, ohne sie erklärend zu erweitern.
theological_decisions:
- issue: Bedeutung des Trinkens
  choice: Das Bildwort „trinken“ bleibt im Haupttext unverändert und kann das Erleiden göttlichen Gerichts bezeichnen.
  alternative: Wörtliches Trinken und anschließende Vernichtung oder ein allgemeineres Bild gewaltsamen Verzehrens.
  rationale: Der unmittelbare Gerichtskontext und prophetische Parallelen sprechen für Gerichtsmetaphorik; die Übersetzung legt diese Deutung jedoch nicht ausdrücklich in den Haupttext hinein.
- issue: Bezug der zweiten Person Plural
  choice: Die Anrede gilt im Kontext Edom, das sich über Jerusalems Unglück erhoben hat.
  alternative: Die Völker insgesamt oder Jerusalem/Juda als ironisch Angeredete.
  rationale: Der vorausgehende Abschnitt richtet seine Vorwürfe unmittelbar an Edom; der Haupttext bewahrt dennoch lediglich das vom Hebräischen vorgegebene Pronomen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „trinken“ und die knappe Schlusswendung bleiben erhalten. Die Gerichtsmetaphorik wird nicht in den Haupttext ausgedeutet; die seltene und unsichere Verbform וְלָעוּ wird in einer Fußnote transparent gemacht.
