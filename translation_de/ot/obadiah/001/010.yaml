  text: מֵ/חֲמַ֛ס אָחִ֥י/ךָ יַעֲקֹ֖ב תְּכַסְּ/ךָ֣ בוּשָׁ֑ה וְ/נִכְרַ֖תָּ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/010.yaml
  text: Because of the violence done to your brother Jacob[a], shame will cover you, and you will be cut off forever.
translation:
  language: de
  text: Wegen der Gewalt gegen deinen Bruder Jakob[a] wird Schande dich bedecken, und du wirst für immer abgeschnitten werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Wegen der Gewalttat an deinem Bruder Jakob.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵחֲמַס
  choice: Wegen der Gewalt gegen
  rationale: חָמָס bezeichnet Gewalt, Unrecht oder gewaltsames Unrecht; die Präposition מִן hat hier kausale Bedeutung. Die Formulierung gibt Ursache und Zielrichtung knapp und natürlich wieder.
- source_word: אָחִיךָ
  choice: deinen Bruder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bewahrt die familiäre und moralische Schärfe der Anklage gegen Edom.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der hebräische Text nennt ausdrücklich Jakob. Der Name bleibt erhalten und steht im Kontext zugleich für dessen Nachkommen.
- source_word: תְּכַסְּךָ
  choice: wird ... dich bedecken
  rationale: כסה bedeutet bedecken oder verhüllen. Mit Schande als Subjekt ist „dich bedecken“ eine direkte und im Deutschen verständliche Wiedergabe des Bildes.
- source_word: בוּשָׁה
  choice: Schande
  rationale: בּוּשָׁה umfasst Scham und öffentliche Entehrung. „Schande“ passt hier besonders gut zur angekündigten öffentlichen Erniedrigung.
- source_word: וְנִכְרַתָּ
  choice: und du wirst ausgerottet werden
  rationale: Das Nifal von כרת bedeutet wörtlich „abgeschnitten werden“ und bezeichnet in Gerichtsaussagen häufig Beseitigung oder Vernichtung. „Ausgerottet werden“ ist im Deutschen idiomatischer als „abgeschnitten werden“, ohne die Gerichtsschärfe abzuschwächen.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: עוֹלָם bezeichnet hier eine unbegrenzte, dauerhafte Zeitspanne; „für immer“ ist die natürliche moderne Wiedergabe.
theological_decisions:
- issue: Bezug von „Jakob“ und Bedeutung der Brudersprache
  choice: „Jakob“ bleibt als Bruder Edoms genannt und repräsentiert im Zusammenhang zugleich das aus Jakob hervorgegangene Volk.
  alternative: Im Haupttext „Israel“ einsetzen, um den nationalen Bezug unmittelbar zu verdeutlichen.
  rationale: Der Ausgangstext sagt ausdrücklich „dein Bruder Jakob“. Die Beibehaltung des Namens bewahrt die familiäre Anklage und vermeidet, eine kontextuelle Deutung an die Stelle des Wortlauts zu setzen.
- issue: Tragweite von וְנִכְרַתָּ
  choice: „du wirst ausgerottet werden“ als Ankündigung dauerhafter Beseitigung
  alternative: „du wirst abgeschnitten werden“, um das hebräische Idiom formal abzubilden
  rationale: Die deutsche Wendung „ausgerottet werden“ vermittelt in diesem Gerichtskontext die starke Wirkung des Verbs, ohne festzulegen, auf welche konkrete historische Art das Gericht vollzogen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Gerichtssprache und das Bild der bedeckenden Schande bleiben erhalten; der Patriarchenname wird nicht durch eine erklärende Volksbezeichnung ersetzt.
