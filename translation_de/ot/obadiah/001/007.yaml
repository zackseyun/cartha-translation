source:
  edition: WLC
  text: עַֽד הַ/גְּב֣וּל שִׁלְּח֗וּ/ךָ כֹּ֚ל אַנְשֵׁ֣י בְרִיתֶ֔/ךָ הִשִּׁיא֛וּ/ךָ יָכְל֥וּ לְ/ךָ֖ אַנְשֵׁ֣י שְׁלֹמֶ֑/ךָ לַחְמְ/ךָ֗ יָשִׂ֤ימוּ מָזוֹר֙ תַּחְתֶּ֔י/ךָ אֵ֥ין תְּבוּנָ֖ה בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/007.yaml
  text: All the men of your covenant have sent you to the border[a]; the men at peace with you have deceived you and prevailed against you[c][b]. Those who eat your bread have set a trap under you—there is no understanding in him.
translation:
  language: de
  text: Alle Männer deines Bundes haben dich bis an die Grenze geschickt[a]. Die Männer, die mit dir Frieden hielten, haben dich getäuscht und die Oberhand über dich gewonnen. Die dein Brot essen, haben dir eine Falle gestellt[b] – in ihm ist keine Einsicht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »haben dich bis an die Grenze hinausgetrieben« oder »haben dich bis an die Grenze begleitet«. Das hebräische Verb kann hier neutral oder feindlich verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »haben dir eine Schlinge gelegt«. Das mit »Falle« wiedergegebene hebräische Wort ist selten; seine genaue Bedeutung ist unsicher.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »in ihm ist kein Verstand«. Gemeint sein könnte Edom; wegen des unklaren Bezugs verstehen manche die Wendung auch im Sinn von »darin ist keine Einsicht« oder gliedern den Satz anders.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד הַגְּבוּל
  choice: bis an die Grenze
  rationale: Gibt das räumliche Ziel konkret wieder, ohne bereits zu entscheiden, ob eine Vertreibung oder ein Geleit gemeint ist.
- source_word: שִׁלְּחוּךָ
  choice: haben dich … geschickt
  rationale: Bewahrt die Bedeutungsbreite des Piel von שלח; ein feindliches Fortschicken ist im Zusammenhang möglich, aber nicht ausdrücklich festgelegt.
- source_word: אַנְשֵׁי בְרִיתֶךָ
  choice: Männer deines Bundes
  rationale: Erhält die Bundes- beziehungsweise Vertragssprache des Hebräischen, statt sie lediglich mit „Verbündete“ wiederzugeben.
- source_word: הִשִּׁיאוּךָ
  choice: haben dich getäuscht
  rationale: Drückt in diesem politischen Verratszusammenhang klar aus, dass Edom irregeführt wurde.
- source_word: יָכְלוּ לְךָ
  choice: haben die Oberhand über dich gewonnen
  rationale: Gibt das adversative Idiom natürlich wieder und bleibt nahe bei der Bedeutung „gegen jemanden die Oberhand behalten“.
- source_word: אַנְשֵׁי שְׁלֹמֶךָ
  choice: die Männer, die mit dir in Frieden lebten
  rationale: Bewahrt die Vorstellung bestehender friedlicher Beziehungen, ohne sie auf persönliche Freundschaft zu verengen.
- source_word: לַחְמְךָ
  choice: die dein Brot essen
  rationale: Erhält das Bild der Tischgemeinschaft und Loyalität. Das Essen ist im knappen hebräischen Satz elliptisch erschlossen.
- source_word: יָשִׂימוּ מָזוֹר תַּחְתֶּיךָ
  choice: haben dir heimlich eine Falle gestellt
  rationale: „Falle“ passt zum Verratskontext; „heimlich“ vermittelt idiomatisch das Bild von etwas, das unter jemanden gelegt wird, ohne die unsichere seltene Vokabel übermäßig zu präzisieren.
- source_word: אֵין תְּבוּנָה בּוֹ
  choice: in ihm ist keine Einsicht
  rationale: Folgt dem maskulinen Singularsuffix und bewahrt zugleich die knappe, mehrdeutige Ausdrucksweise sowie den unklaren Bezug.
theological_decisions:
- issue: Bezug des maskulinen Suffixes in בּוֹ
  choice: „in ihm“ bleibt ohne ausdrückliche Identifizierung stehen
  alternative: „Edom hat keine Einsicht“ oder „darin ist keine Einsicht“
  rationale: Der hebräische Bezug ist nicht eindeutig. Eine ausdrückliche Gleichsetzung mit Edom würde eine plausible Deutung in den Haupttext eintragen, statt die Spannung zu erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Bildsprache. Die wiederholte Anrede in der zweiten Person sowie die Motive Bund, Frieden, Brot und Falle bleiben erhalten. Ungewöhnliche hebräische Wendungen werden nur so weit geglättet, wie es für verständliches Deutsch nötig ist.
