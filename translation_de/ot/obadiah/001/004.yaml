source:
  edition: WLC
  text: אִם תַּגְבִּ֣יהַּ כַּ/נֶּ֔שֶׁר וְ/אִם בֵּ֥ין כּֽוֹכָבִ֖ים שִׂ֣ים קִנֶּ֑/ךָ מִ/שָּׁ֥ם אוֹרִֽידְ/ךָ֖ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/004.yaml
  text: Though you soar high like the eagle[a], and though you set your nest among the stars, from there I will bring you down, declares Yahweh.
translation:
  language: de
  text: 'Selbst wenn du dich hoch erhebst wie der Adler[a] und selbst wenn du dein Nest zwischen die Sterne setzt: Von dort werde ich dich herunterholen, spricht Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn du dich hoch erhebst wie ein Adler … wenn du dein Nest zwischen die Sterne setzt.“ Das hebräische Wort kann schlicht „wenn“ bedeuten; hier hat es wahrscheinlich einräumenden Sinn: Selbst die größte denkbare Höhe wird Edom nicht vor Jahwes Zugriff schützen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: Selbst wenn ... und selbst wenn
  rationale: 'Die Bedingungspartikeln haben hier im prophetisch-poetischen Zusammenhang eine konzessive Kraft: Auch die größtmögliche Höhe schützt Edom nicht. Zugleich bleibt die sprachliche Form als Bedingungssatz erkennbar.'
- source_word: תַּגְבִּיהַּ
  choice: du dich hoch erhebst
  rationale: Das Hifil von גבה bezeichnet das Hochmachen beziehungsweise Sich-Erheben. Die Formulierung bewahrt sowohl das räumliche Bild als auch den Beiklang der Selbstüberhebung.
- source_word: כַּנֶּשֶׁר
  choice: wie der Adler
  rationale: כְּ markiert den Vergleich; der bestimmte Artikel im Hebräischen wird mit „der Adler“ wiedergegeben. Der Ausdruck dient zugleich als anschauliches Klassenbild.
- source_word: בֵּין כּוֹכָבִים
  choice: zwischen die Sterne
  rationale: בֵּין bedeutet grundsätzlich „zwischen“ und bezeichnet hier den unerreichbar hoch gedachten Ort des Nestes. Das Deutsche verwendet bei einer Zielangabe idiomatisch den Akkusativ.
- source_word: שִׂים קִנֶּךָ
  choice: du dein Nest ... setzt
  rationale: שׂים bedeutet „setzen, stellen, legen“; „das Nest setzen“ hält das Bild knapp und verständlich fest.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Die wörtliche Ortsangabe betont, dass selbst der vermeintlich höchste Zufluchtsort Gottes Zugriff nicht entzogen ist.
- source_word: אוֹרִידְךָ
  choice: werde ich dich herunterholen
  rationale: 'Das Hifil von ירד ist kausativ: jemanden hinabbringen. „Herunterholen“ gibt die angekündigte Umkehrung der Selbsterhöhung in natürlichem Deutsch wieder, ohne die stärkere Bedeutung „hinabstürzen“ einzutragen.'
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Botenformel wird würdig und geläufig wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedingung oder Einräumung bei אִם
  choice: Selbst wenn
  alternative: Wenn
  rationale: Die Aussage setzt nicht voraus, dass Edoms Höhe tatsächlich grenzenlos ist, sondern erklärt, dass selbst der äußerste gedachte Fall Jahwes Gericht nicht vereiteln könnte. „Selbst wenn“ bewahrt die konditionale Form und macht ihre konzessive Funktion deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dichterischer Parallelität. Der Doppelansatz „selbst wenn“ bildet die hebräische Struktur ab; der Doppelpunkt markiert pointiert die göttliche Antwort. „Herunterholen“ ist gegenwärtig und anschaulich, ohne zusätzliche Gewaltsemantik.
