source:
  edition: WLC
  text: הֲ/ל֛וֹא בַּ/יּ֥וֹם הַ/ה֖וּא נְאֻם יְהוָ֑ה וְ/הַאֲבַדְתִּ֤י חֲכָמִים֙ מֵֽ/אֱד֔וֹם וּ/תְבוּנָ֖ה מֵ/הַ֥ר עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/008.yaml
  text: Will I not[a], on that day, declares Yahweh, destroy the wise men from Edom, and understanding from the mountain of Esau?
translation:
  language: de
  text: Werde ich nicht an jenem Tag – Ausspruch Jahwes – die Weisen aus Edom vernichten und die Einsicht vom Berg Esaus[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Berg Esaus“; gemeint sein kann auch das Bergland Esaus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: Werde ich nicht
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet, statt sie in eine bloße Bekräftigung umzuwandeln.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Gibt die hebräische Zeitangabe in natürlichem, gehobenem Standarddeutsch wieder.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Bewahrt den gewichtigen Charakter der prophetischen Botenformel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: וְהַאֲבַדְתִּי
  choice: vernichten
  rationale: Das Hifil von אבד bezeichnet hier Jahwes aktives Beseitigen der weisen Männer Edoms; „vernichten“ ist kräftig und kontextgerecht.
- source_word: חֲכָמִים
  choice: die Weisen
  rationale: Die substantivierte Form ist im Deutschen natürlich und kann die als Weise anerkannten Männer Edoms bezeichnen, ohne die Aussage unnötig auf eine amtliche Klasse festzulegen.
- source_word: מֵאֱדוֹם
  choice: aus Edom
  rationale: Die Präposition bezeichnet den Bereich, aus dem die Weisen entfernt werden.
- source_word: וּתְבוּנָה
  choice: die Einsicht
  rationale: Bewahrt das abstrakte Substantiv und bezeichnet verständiges Urteilsvermögen beziehungsweise Unterscheidungsfähigkeit.
- source_word: מֵהַר עֵשָׂו
  choice: vom Gebirge Esaus
  rationale: „Gebirge“ wahrt das Bergmotiv und gibt zugleich den möglichen regionalen Sinn des Ausdrucks im natürlichen Deutschen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ ist die im Deutschen geläufige Form des Eigennamens und ersetzt ihn nicht durch einen Titel.
- issue: Personenbezeichnung חֲכָמִים
  choice: die Weisen
  alternative: die weisen Männer
  rationale: Das hebräische Maskulinum Plural bezeichnet weise Personen und kann hier insbesondere Edoms anerkannte männliche Ratgeber meinen. Das deutsche substantivierte „die Weisen“ bewahrt die personale und traditionelle Aussage, ohne einen im Text nicht ausdrücklich genannten Amtsstand einzuführen.
- issue: Bedeutung von הַר עֵשָׂו
  choice: Gebirge Esaus
  alternative: Berg Esaus
  rationale: Der Ausdruck kann sowohl das wörtliche Bergmotiv als auch das Bergland beziehungsweise Gebiet Edoms bezeichnen. „Gebirge Esaus“ wahrt diese Spannung; die wörtlichere Einzahl steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die eingeschobene Formel „Ausspruch Jahwes“ erhält den prophetischen Ton und lässt den Satzfluss der rhetorischen Frage erkennen.
