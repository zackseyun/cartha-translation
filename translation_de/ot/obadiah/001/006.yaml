base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/006.yaml
  text: How Esau has been searched out! His hidden treasures have been sought out![a][b]
translation:
  language: de
  text: Wie gründlich ist Esau durchsucht worden![a] Wie sind seine verborgenen Schätze aufgespürt worden![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esau bezeichnet hier zusammenfassend das Volk oder Land Edom, also die Nachkommen Esaus.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Wie ist Esau geplündert worden! Wie sind seine geheimen Vorräte bloßgelegt worden!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie
  rationale: Leitet einen erstaunten, ausrufenden Satz ein, keine Informationsfrage. Das deutsche „Wie“ bewahrt die prophetische Exklamation.
- source_word: נֶחְפְּשׂוּ
  choice: durch und durch durchsucht worden
  rationale: Das Nifal Perfekt bezeichnet gründliches Durchsuchen. Die Form ist im Hebräischen pluralisch, weil Esau kollektiv aufgefasst wird; im Deutschen richtet sich das Prädikat grammatisch nach dem Singularnamen.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Der Personenname des hebräischen Textes bleibt erhalten; hier bezeichnet er metonymisch Esaus Nachkommen beziehungsweise Edom.
- source_word: נִבְעוּ
  choice: aufgespürt worden
  rationale: Das Nifal Perfekt drückt aus, dass Verborgenes gesucht und entdeckt wurde. „Aufgespürt“ unterscheidet das zweite Verb vom vorherigen „durchsucht“, ohne die Parallelität aufzugeben.
- source_word: מַצְפֻּנָיו
  choice: seine verborgenen Schätze
  rationale: Das Wort bezeichnet verborgene oder verwahrte Dinge mit einem Suffix der 3. Person Singular. Im Zusammenhang sind am ehesten versteckte Wertgegenstände oder Vorräte gemeint.
