source:
  edition: WLC
  text: אַל תָּב֤וֹא בְ/שַֽׁעַר עַמִּ/י֙ בְּ/י֣וֹם אֵידָ֔/ם אַל תֵּ֧רֶא גַם אַתָּ֛ה בְּ/רָעָת֖/וֹ בְּ/י֣וֹם אֵיד֑/וֹ וְ/אַל תִּשְׁלַ֥חְנָה בְ/חֵיל֖/וֹ בְּ/י֥וֹם אֵידֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/013.yaml
  text: Do not enter the gate of my people in the day of their disaster[a]; do not look on his calamity, even you, in the day of his disaster[b]; and do not lay hands on his wealth in the day of his disaster.
translation:
  language: de
  text: Betritt nicht das Tor meines Volkes am Tag ihres Unheils; sieh auch du sein Unglück[a] nicht an am Tag seines Unheils, und greif nicht nach seinem Besitz[b] am Tag seines Unheils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet wörtlich „sehen“ oder „ansehen“; im Zusammenhang kann ein schadenfrohes Betrachten gemeint sein.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: seine Streitmacht, seine Stärke oder seine Mittel. Das hebräische Wort kann sowohl militärische Macht als auch Besitz oder Ressourcen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא בְשַׁעַר עַמִּי
  choice: Betritt nicht das Tor meines Volkes
  rationale: Die konkrete Bildsprache des Stadttores bleibt erhalten. „Betritt“ gibt das Hineingehen in den durch das Tor bezeichneten Stadtbereich natürlich und knapp wieder.
- source_word: בְּיוֹם אֵידָם / בְּיוֹם אֵידוֹ
  choice: am Tag ihres/seines Unheils
  rationale: אֵיד bezeichnet schweres Unheil oder Verderben. Die dreifache Wiederholung und der Wechsel vom Plural zum Singular werden bewahrt.
- source_word: תֵּרֶא
  choice: sieh … nicht auf
  rationale: ראה bedeutet zunächst „sehen/blicken“. Die relativ formnahe Wiedergabe lässt offen, ob hier bloßes Zuschauen oder ein schadenfroher Blick gemeint ist; der feindselige Kontext legt Letzteres nahe und wird in der Fußnote erläutert.
- source_word: גַם אַתָּה
  choice: auch du
  rationale: Die Wendung hebt Edom ausdrücklich und vorwurfsvoll hervor, ohne zusätzliche Deutung einzutragen.
- source_word: בְרָעָתוֹ
  choice: auf sein Unglück
  rationale: רָעָה bezeichnet hier erlittenes Unglück, nicht moralische Bosheit. Der Singular bildet die Personifizierung des Volkes beziehungsweise Jakob ab.
- source_word: וְאַל תִּשְׁלַחְנָה בְחֵילוֹ
  choice: und greif nicht nach seinem Besitz
  rationale: שׁלח mit ב bezeichnet hier ein feindliches Ausstrecken beziehungsweise Zugreifen. „Nach … greifen“ ist im Deutschen idiomatisch; „Besitz“ passt zum Zusammenhang der Plünderung, während die Bedeutungsbreite von חַיִל in der Fußnote offengelegt wird.
theological_decisions:
- issue: Wechsel zwischen pluralischen und singularischen Pronominalsuffixen
  choice: Zuerst „ihres Unheils“, danach „sein Unglück/seines Unheils/seinem Besitz“
  alternative: Alle Bezüge einheitlich im Plural oder einheitlich im Singular wiedergeben
  rationale: Der hebräische Text wechselt bewusst vom kollektiv pluralisch verstandenen Volk zur singularisch personifizierten Größe. Eine Harmonisierung würde diese rhetorische Spannung beseitigen.
- issue: Bedeutung von ראה im feindseligen Zusammenhang
  choice: Im Haupttext relativ offen mit „sieh … auf“ wiedergeben und die mögliche Schadenfreude in einer Fußnote benennen
  alternative: Explizit „freue dich nicht schadenfroh“ oder „weide dich nicht“ übersetzen
  rationale: Der Kontext spricht für gehässiges Zuschauen, doch das Verb selbst bedeutet zunächst „sehen“. Die Übersetzung soll die naheliegende pragmatische Bedeutung nicht als lexikalisch eindeutig ausgeben.
- issue: Bedeutung von חַיִל
  choice: „Besitz“ im Haupttext, alternative Bedeutungen in der Fußnote
  alternative: „Heer“, „Stärke“ oder „Mittel“
  rationale: Der Zusammenhang mit dem Eindringen nach einer Katastrophe legt Plünderung und damit materiellen Besitz nahe. Da חַיִל mehrere Bedeutungen zulässt, bleibt die Alternative sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Mahnrede. Die dreifache Formel „am Tag … Unheils“ bleibt als rhetorischer Refrain erhalten; ebenso bleibt der auffällige Wechsel von „ihres“ zu „sein/seines/seinem“ sichtbar.
