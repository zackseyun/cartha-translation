source:
  edition: WLC
  text: וּ/בְ/הַ֥ר צִיּ֛וֹן תִּהְיֶ֥ה פְלֵיטָ֖ה וְ/הָ֣יָה קֹ֑דֶשׁ וְ/יָֽרְשׁוּ֙ בֵּ֣ית יַֽעֲקֹ֔ב אֵ֖ת מוֹרָֽשֵׁי/הֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/017.yaml
  text: But on Mount Zion there will be deliverance[a], and it will be holy[c][b], and the house of Jacob will possess their possessions.
translation:
  language: de
  text: Doch auf dem Berg Zion wird es Rettung geben[a], und er wird heilig sein; und das Haus Jakob wird seinen Besitz wiedererlangen[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird es Entkommene geben“; das hebräische Substantiv kann sowohl Rettung beziehungsweise Entkommen als auch die Entkommenen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird seinen Erbbesitz erben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Möglicherweise: „Das Haus Jakob wird diejenigen enteignen, die es enteignet haben“, wenn der Schlussausdruck im Sinn handelnder Personen verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְהַר צִיּוֹן
  choice: Doch auf dem Berg Zion
  rationale: Das einleitende ו kann schlicht mit „und“ wiedergegeben werden, markiert hier im Gegensatz zum Gericht über Edom jedoch einen deutlichen Kontrast. „Doch“ bildet diesen Zusammenhang im Deutschen natürlich ab.
- source_word: תִּהְיֶה פְלֵיטָה
  choice: wird es Rettung geben
  rationale: פְלֵיטָה kann Rettung beziehungsweise Entkommen oder die Entkommenen bezeichnen. „Rettung“ bewahrt die Aussage als Verheißung, ohne sie ausschließlich auf die Handlung oder auf die Überlebenden festzulegen.
- source_word: וְהָיָה קֹדֶשׁ
  choice: und er wird heilig sein
  rationale: Das maskuline Singularpronomen „er“ bezieht sich am natürlichsten auf den Berg Zion. Die prädikative Wiedergabe „heilig sein“ entspricht dem gegenwärtigen deutschen Sprachgebrauch und bewahrt den Gedanken seiner Heiligkeit beziehungsweise Weihe.
- source_word: וְיָרְשׁוּ
  choice: wird … in Besitz nehmen
  rationale: ירשׁ kann „besitzen“, „erben“ oder „enteignen/vertreiben“ bedeuten. „In Besitz nehmen“ passt zum direkten Objekt und zur angekündigten Wiederherstellung, ohne die Aussage auf einen rein erbrechtlichen Vorgang zu verengen.
- source_word: בֵּית יַעֲקֹב
  choice: das Haus Jakob
  rationale: Die traditionelle prophetische Bezeichnung meint die Nachkommen Jakobs beziehungsweise Israel. „Das Haus Jakob“ ist würdevoll, verständlich und näher am hebräischen Ausdruck als eine freie Umschreibung.
- source_word: אֵת מוֹרָשֵׁיהֶם
  choice: seinen Besitz
  rationale: מוֹרָשָׁה bezeichnet gewöhnlich Besitz oder Erbbesitz. Das kollektive „Haus Jakob“ wird im Deutschen mit dem singularischen Possessivpronomen aufgenommen. Eine agentivische Deutung ist möglich und wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Art der auf Zion verheißenen Wiederherstellung
  choice: Der Vers verheißt auf dem Berg Zion Rettung, Heiligkeit und die Wiedergewinnung von Besitz, ohne festzulegen, ob bei פְלֵיטָה vor allem der Rettungsvorgang oder die Entkommenen im Blick stehen.
  alternative: Die Aussage könnte vorrangig eine Schar von Entkommenen beziehungsweise Überlebenden auf Zion bezeichnen.
  rationale: Die Bedeutungsbreite des hebräischen Nomens lässt beide Akzente zu. Der Haupttext wahrt diese prophetische Spannung; die konkrete personale Lesart wird in der Fußnote genannt.
- issue: Deutung des Schlussausdrucks מוֹרָשֵׁיהֶם
  choice: Das Haus Jakob nimmt seinen Besitz wieder in Besitz.
  alternative: Das Haus Jakob enteignet diejenigen, die es enteignet haben.
  rationale: Die nominale Bedeutung „Besitz/Erbbesitz“ ist morphologisch und im Wiederherstellungskontext gut begründet. Da eine agentivische Deutung den Sinn merklich verändert, bleibt sie ausdrücklich als Alternative erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Klang. Der Semikolon trennt Zions Heiligkeit klar von der anschließenden Handlung des Hauses Jakob. Alle Alternativen, die wesentliche lexikalische oder theologische Mehrdeutigkeit bewahren, sind durch Fußnoten im Haupttext markiert.
