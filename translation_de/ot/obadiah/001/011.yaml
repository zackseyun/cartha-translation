revisions:
- from: An dem Tag, als du abseits standest[a], als Fremde sein Vermögen wegführten[b], Ausländer in sein Tor eindrangen[c] und über Jerusalem das Los warfen, da warst auch du wie einer von ihnen.
  to: An dem Tag, als du abseits standest[a], an dem Tag, als Fremde sein Vermögen wegführten[b], Ausländer durch seine Tore zogen[c] und über Jerusalem das Los warfen, da warst auch du wie einer von ihnen.
  rationale: Die Revision folgt dem masoretischen Qere bei שְׁעָרָיו mit „seine Tore“ und vermeidet mit „durch seine Tore zogen“ eine nicht ausdrücklich im Verb enthaltene Verschärfung. Die abweichende Konsonantenschreibung wird transparent in der Fußnote festgehalten. Alle übrigen Entscheidungen bleiben erhalten, einschließlich der Mehrdeutigkeit von חֵילוֹ und der räumlich-moralischen Spannung von מִנֶּגֶד.
  reviewer_model: gpt-5.6-terra
