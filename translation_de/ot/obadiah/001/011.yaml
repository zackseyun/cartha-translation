source:
  edition: WLC
  text: בְּ/יוֹם֙ עֲמָֽדְ/ךָ֣ מִ/נֶּ֔גֶד בְּ/י֛וֹם שְׁב֥וֹת זָרִ֖ים חֵיל֑/וֹ וְ/נָכְרִ֞ים בָּ֣אוּ שער/ו וְ/עַל יְרוּשָׁלִַ֨ם֙ יַדּ֣וּ גוֹרָ֔ל גַּם אַתָּ֖ה כְּ/אַחַ֥ד מֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/011.yaml
  text: On the day when you stood aloof[a], on the day strangers carried off his wealth, and foreigners entered his gates and cast lots over Jerusalem[c][b], you too were like one of them.
translation:
  language: de
  text: An dem Tag, als du abseits standest[a], an dem Tag, als Fremde sein Vermögen wegführten[b], Ausländer durch seine Tore zogen[c] und über Jerusalem das Los warfen, da warst auch du wie einer von ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einiger Entfernung standest“ beziehungsweise „untätig dastandest“. Der hebräische Ausdruck bezeichnet wörtlich ein Gegenüber- oder Abseitsstehen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „seine Streitmacht“ oder „seine Stärke“ bedeuten; hier ist im Zusammenhang der Plünderung wahrscheinlich sein Besitz oder Vermögen gemeint.
    reason: lexical_alternative
  - marker: c
    text: 'Der masoretische Lesetext lautet: „seine Tore“. Die Konsonantenschreibung lautet „sein Tor“. Gemeint sind wohl die Tore des personifiziert dargestellten Jerusalem oder Juda.'
    reason: textual_note
lexical_decisions:
- source_word: עֲמָדְךָ מִנֶּגֶד
  choice: du abseits standest
  rationale: מִנֶּגֶד bezeichnet ein Gegenüber- bzw. Abseitsstehen aus einiger Entfernung. „Abseits stehen“ bewahrt sowohl die räumliche Vorstellung als auch im Kontext den Vorwurf untätiger Distanz, ohne ihn übermäßig auszudeuten.
- source_word: שְׁבוֹת
  choice: wegführten
  rationale: שׁבה bedeutet gewöhnlich „gefangen nehmen/wegführen“. Da חֵילוֹ das Objekt ist, gibt „wegführten“ hier die gewaltsame Wegnahme von Besitz oder Ressourcen natürlich wieder.
- source_word: זָרִים
  choice: Fremde
  rationale: זָרִים bezeichnet Außenstehende oder Fremde. „Fremde“ wahrt zugleich die Variation gegenüber נָכְרִים.
- source_word: חֵילוֹ
  choice: sein Vermögen
  rationale: חַיִל kann Streitmacht, Kraft oder Besitz/Vermögen bedeuten. Im Zusammenhang mit Eroberung und Plünderung ist „Vermögen“ wahrscheinlich, während die Bedeutungsbreite in einer Fußnote erhalten bleibt.
- source_word: נָכְרִים
  choice: Ausländer
  rationale: נָכְרִים bezeichnet als fremd erkannte Menschen anderer Herkunft. „Ausländer“ unterscheidet den Ausdruck von זָרִים („Fremde“) und erhält den hebräischen Parallelismus.
- source_word: בָּאוּ שַׁעֲרוֹ
  choice: in sein Tor eindrangen
  rationale: 'Der überlieferte Text hat den Singular mit maskulinem Suffix: „sein Tor“. Das Suffix bezieht sich im Kontext wohl auf das personifizierte Jerusalem oder Juda. „Eindrangen“ entspricht dem feindlichen Zusammenhang natürlicher als das neutrale „kamen“.'
- source_word: יַדּוּ גוֹרָל
  choice: das Los warfen
  rationale: Die feste Wendung bezeichnet eine Entscheidung oder Verteilung durch Los. „Das Los werfen“ ist im Deutschen klar und hält den hebräischen Singular fest.
- source_word: גַּם אַתָּה כְּאַחַד מֵהֶם
  choice: da warst auch du wie einer von ihnen
  rationale: Die Formulierung schließt Edom in die Schuld der Angreifer ein, bewahrt aber mit „wie“ ausdrücklich die vergleichende Aussage.
theological_decisions:
- issue: Bedeutung von Edoms Haltung in עמד מנגד
  choice: Edom steht schuldhaft abseits und wird dadurch den Angreifern moralisch gleichgestellt.
  alternative: Die Aussage beschreibt lediglich Edoms räumliche Position in einiger Entfernung.
  rationale: Der Schlusssatz „auch du wie einer von ihnen“ macht das Abseitsstehen im Kontext zum Gegenstand der Anklage. „Abseits standest“ lässt die räumliche Grundbedeutung und die moralische Wirkung zugleich erkennen, ohne aktive Angriffsbeteiligung zu behaupten.
- issue: Referenz der maskulinen Suffixe in חֵילוֹ und שַׁעֲרוֹ
  choice: Die maskulinen Singularformen werden formal als „sein Vermögen“ und „sein Tor“ bewahrt; ihr Bezug ist im Kontext wohl das personifizierte Jerusalem oder Juda.
  alternative: Idiomatich auf „Jerusalems Vermögen“ beziehungsweise „seine Tore“ verdeutlichen.
  rationale: Der hebräische Text nennt den Referenten nicht ausdrücklich und hat bei „Tor“ den Singular. Die Übersetzung bewahrt diese genuine Unbestimmtheit; eine Fußnote erläutert sie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Syntax und Bildsprache des Hebräischen. Die wiederholte Zeitangabe „an dem Tag … als“ und der abschließende Anklagesatz bleiben hervorgehoben. „Abseits stehen“ ist geläufig und trägt die räumliche wie moralische Spannung; die mehrdeutigen Ausdrücke חַיִל und מִנֶּגֶד sowie der Singular „sein Tor“ werden durch Fußnoten offengehalten.
