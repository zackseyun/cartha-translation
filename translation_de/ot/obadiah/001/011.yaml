  source_fidelity: Die Übersetzung gibt die Abfolge und den Anklagecharakter des hebräischen Textes im Wesentlichen zuverlässig wieder. Das Qere zu שערו ist jedoch שְׁעָרָיו („seine Tore“); daher ist „sein Tor“ im Haupttext nicht die passende Wiedergabe des masoretischen Lesetextes. „In sein Tor eindrangen“ verstärkt בָּאוּ („kamen/gingen hinein“) zudem unnötig zu einem gewaltsamen Eindringen.
  naturalness: Der Satz ist insgesamt gut lesbar und würdig. „In seine Tore kamen“ wäre im Deutschen zu wörtlich; „durch seine Tore zogen“ ist natürlich, ohne den Vorgang stärker auszumalen als der Text. Die Zeitstruktur mit „An dem Tag, als …, als …“ ist möglich, aber die Wiederholung von „an dem Tag“ entspricht dem Hebräischen klarer.
  terminology: „Abseits standest“, „Fremde“, „Ausländer“, „sein Vermögen“ und „das Los warfen“ sind sachgerecht. Die Fußnote zu den Toren muss den Qere-Plural und nicht einen vermeintlichen hebräischen Singular als maßgebliche Textform erklären.
