base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/002.yaml
  text: I will rise now and go about the city[a], in the marketplaces and in the streets; I will seek the one my soul loves. I sought him, but I did not find him.
translation:
  language: de
  text: Ich will nun aufstehen und in der Stadt umherziehen, auf den Marktplätzen und in den Straßen; ich will den suchen, den meine Seele liebt. Ich suchte ihn, aber ich fand ihn nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָקוּמָה נָּא
  choice: Ich will jetzt aufstehen
  rationale: Der Kohortativ drückt den entschlossenen Vorsatz der Sprecherin aus; נָא verleiht ihm hier Dringlichkeit beziehungsweise Unmittelbarkeit.
- source_word: וַאֲסוֹבְבָה בָעִיר
  choice: und durch die Stadt ziehen
  rationale: סבב bezeichnet hier das Umherziehen bei der Suche. Die Formulierung ist im Deutschen natürlich und bewahrt die Bewegung durch das Stadtgebiet.
- source_word: בַּשְּׁוָקִים
  choice: über die Plätze
  rationale: שׁוּק kann breite öffentliche Gassen oder Marktbereiche bezeichnen. Im Parallelismus mit רְחֹבוֹת passt »Plätze« als Bezeichnung öffentlicher städtischer Räume.
- source_word: וּבָרְחֹבוֹת
  choice: und durch die Straßen
  rationale: רְחֹבוֹת bezeichnet breite öffentliche Wege oder Straßen; »Straßen« ist hier die geläufigste moderne Wiedergabe.
- source_word: אֲבַקְשָׁה
  choice: Ich will den suchen
  rationale: Der Kohortativ setzt den entschlossenen Vorsatz fort; »suchen« gibt בקשׁ klar und natürlich wieder.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: den meine Seele liebt
  rationale: Die Wiedergabe erhält sowohl den relativen Ausdruck als auch נֶפֶשׁ als »Seele« und vermeidet eine erklärende Verengung auf Herz oder Gefühl.
- source_word: בִּקַּשְׁתִּיו וְלֹא מְצָאתִיו
  choice: Ich suchte ihn, aber ich fand ihn nicht
  rationale: Die Wiederholung von »suchen« bewahrt die poetische Verknüpfung; »aber« macht den im Zusammenhang adversativen Sinn des Waw idiomatisch deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Rhythmus. Die wiederkehrende Wendung »den meine Seele liebt« bleibt quellennah; die Satzfolge wahrt Vorsatz, Suche und enttäuschtes Ergebnis.
