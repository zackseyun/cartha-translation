base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/003.yaml
  text: 'The watchmen who go about the city found me: “Have you seen the one whom my soul loves?”[a][b]'
translation:
  language: de
  text: Die Wächter, die in der Stadt umhergingen, fanden mich.[a] »Habt ihr den gesehen, den meine Seele liebt?«[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Wächter, die in der Stadt ihre Runde machten, fanden mich.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »den, den meine Seele liebt«; ein wiederkehrender poetischer Ausdruck im Hohelied.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצָאוּנִי
  choice: fanden mich
  rationale: Das Qal Perfekt mit Suffix der 1. Person Singular bedeutet unmittelbar »sie fanden mich«; die Formulierung ist im erzählenden Zusammenhang natürlich und präzise.
- source_word: הַשֹּׁמְרִים
  choice: die Wächter
  rationale: Das substantivierte Partizip bezeichnet Männer, die Wache halten. »Wächter« passt zum nächtlichen städtischen Umfeld und wahrt den poetischen Ton.
- source_word: הַסֹּבְבִים בָּעִיר
  choice: die in der Stadt umhergingen
  rationale: Das Partizip von סבב beschreibt das Umhergehen beziehungsweise Rundengehen. Die deutsche Wiedergabe bewahrt den beschreibenden Sinn, ohne ein modernes Polizeikonzept einzutragen.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: den, den meine Seele liebt
  rationale: Die Formulierung erhält den wiederkehrenden poetischen Ausdruck des Liedes und gibt נֶפֶשׁ ausdrücklich mit »Seele« wieder, statt ihn zu »Herz« zu verflachen.
- source_word: רְאִיתֶם
  choice: Habt ihr ... gesehen?
  rationale: Das Perfekt der 2. Person maskulin Plural steht hier als unmittelbare Frage. Das deutsche Perfekt entspricht der Suche in der gegenwärtigen Situation natürlich.
