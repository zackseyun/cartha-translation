  text: King Solomon made for himself a palanquin from the trees of Lebanon[a].
translation:
  language: de
  text: König Salomo machte sich eine Sänfte aus den Bäumen des Libanon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Tragsessel“, „Tragbahre“ oder „Wagen“; das hebräische Wort ist selten, und was genau damit bezeichnet wird, ist unsicher. Gemeint ist jedenfalls ein prächtiges Beförderungsmittel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַפִּרְיוֹן
  choice: Sänfte
  rationale: Das seltene, vermutlich entlehnte hebräische Wort bezeichnet offenbar ein prächtiges Beförderungsmittel, doch seine genaue Bauart ist unsicher. „Sänfte“ gibt den wahrscheinlichen Sinn verständlich wieder, ohne die Einzelheiten zu stark festzulegen.
- source_word: עָשָׂה
  choice: machte
  rationale: Das häufige Verb bedeutet allgemein „machen“ oder „anfertigen“. „Machte“ wahrt diese Bedeutungsbreite und fügt keine im Ausgangstext nicht ausdrücklich genannte Veranlassung hinzu.
- source_word: לּוֹ
  choice: sich
  rationale: Die Präposition mit Pronominalsuffix kann „für ihn“ heißen; in Verbindung mit dem unmittelbar folgenden Subjekt Salomo liegt im Deutschen die reflexive Wiedergabe „sich“ nahe.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: König Salomo
  rationale: Dies ist die natürliche deutsche Wiedergabe von Titel und Eigenname.
- source_word: מֵעֲצֵי
  choice: aus den Bäumen
  rationale: Die Form bedeutet wörtlich „von/aus den Bäumen“. Die Wiedergabe bewahrt das Bild der Bäume des Libanon; „aus dem Holz“ wäre möglich, aber stärker deutend.
- source_word: הַלְּבָנוֹן
  choice: Libanon
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
