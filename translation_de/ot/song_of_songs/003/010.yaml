translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer, poetischer Satzstruktur. Die dreifache Parallelität der Materialien bleibt erhalten. Die ungewöhnliche Aussage „mit Liebe ausgelegt“ wird nicht rationalisiert; Unsicherheiten bei den Bauteilen und bei der Präposition werden in den Fußnoten offengelegt.
