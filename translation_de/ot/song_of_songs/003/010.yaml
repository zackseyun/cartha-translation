  text: עַמּוּדָי/ו֙ עָ֣שָׂה כֶ֔סֶף רְפִידָת֣/וֹ זָהָ֔ב מֶרְכָּב֖/וֹ אַרְגָּמָ֑ן תּוֹכ/וֹ֙ רָצ֣וּף אַהֲבָ֔ה מִ/בְּנ֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/010.yaml
  text: He made its pillars of silver[a], its back of gold, its seat of purple[c][b]; its interior was inlaid with love by the daughters of Jerusalem.
translation:
  language: de
  text: Ihre Säulen machte er aus Silber, ihre Lehne aus Gold[a], ihren Sitz aus Purpur[b]; ihr Inneres war von den Töchtern Jerusalems mit Liebe ausgelegt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Unterlage“ beziehungsweise „ihre Stütze aus Gold“. Das hebräische Wort ist selten und seine genaue Bedeutung unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihren Fahr- oder Sitzplatz“ beziehungsweise „ihren Wagen aus Purpur“. Das hebräische Wort kann allgemeiner das Fahrzeug oder den Platz zum Fahren bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher auch: „ihr Inneres war mit Liebe gepflastert“. Die hebräische Wendung ist ungewöhnlich und zeichnet in poetischer Sprache eine kostbare Ausstattung; „von den Töchtern Jerusalems“ kann auch die Herkunft statt der Urheberschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: ihre Säulen
  rationale: Das Substantiv bezeichnet gewöhnlich Säulen oder Pfeiler. „Säulen“ bewahrt das architektonische Bild der königlichen Sänfte; das feminine Pronomen richtet sich im Deutschen nach dem Gegenstand im Zusammenhang.
- source_word: עָשָׂה
  choice: machte er
  rationale: Direkte Wiedergabe des häufigen Verbs „machen, anfertigen“; das maskuline Subjekt ist aus dem Zusammenhang zu erschließen.
- source_word: כֶסֶף
  choice: Silber
  rationale: Die übliche Bezeichnung des Metalls.
- source_word: רְפִידָתוֹ
  choice: ihre Lehne
  rationale: Das seltene Wort bezeichnet hier wahrscheinlich eine Auflage, Stütze oder einen tragenden beziehungsweise zum Ruhen bestimmten Teil. „Lehne“ ist im Zusammenhang einer Sänfte anschaulich, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: זָהָב
  choice: Gold
  rationale: Die übliche Bezeichnung des Metalls.
- source_word: מֶרְכָּבוֹ
  choice: ihren Sitz
  rationale: Das Wort gehört zum Bedeutungsfeld des Fahrens und kann ein Fahrzeug oder den Platz zum Fahren bezeichnen. Bei den Bestandteilen einer Sänfte gibt „Sitz“ den wahrscheinlichen konkreten Sinn natürlich wieder.
- source_word: אַרְגָּמָן
  choice: Purpur
  rationale: Bezeichnet kostbaren purpurfarbenen Stoff beziehungsweise Purpur als Luxusmaterial; „aus Purpur“ ist im Deutschen idiomatisch.
- source_word: תּוֹכוֹ
  choice: ihr Inneres
  rationale: Bezeichnet den Innenraum der Sänfte; „Inneres“ ist präzise und stilistisch angemessen.
- source_word: רָצוּף
  choice: war … ausgelegt
  rationale: Das Partizip bezeichnet etwas, das belegt, überzogen oder dicht eingefügt ist. „Ausgelegt“ passt zur kunstvollen Ausstattung und lässt die ungewöhnliche Verbindung mit „Liebe“ stehen.
- source_word: אַהֲבָה
  choice: mit Liebe
  rationale: Die masoretische Lesart bedeutet eindeutig „Liebe“. Die poetisch ungewöhnliche Formulierung wird bewahrt und nicht durch eine vermutete materielle Ausstattung ersetzt.
- source_word: מִבְּנוֹת יְרוּשָׁלִָם
  choice: von den Töchtern Jerusalems
  rationale: Die Präposition מִן kann Herkunft oder Urheberschaft ausdrücken. Im deutschen Passiv kann „von“ die Töchter Jerusalems als Handelnde bezeichnen, während die zugrunde liegende Beziehung nicht übererklärt wird.
