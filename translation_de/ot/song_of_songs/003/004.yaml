base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/004.yaml
  text: I had scarcely passed by them when I found the one my soul loves[a]. I held on to him and would not let him go until I had brought him into my mother's house[b], into the chamber of the one who conceived me.
translation:
  language: de
  text: Kaum war ich an ihnen vorübergegangen, da fand ich den, den meine Seele liebt.[a] Ich hielt ihn fest und ließ ihn nicht los, bis ich ihn in das Haus meiner Mutter gebracht hatte, in das Gemach derer, die mich empfing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „den, den meine Seele liebt“. „Seele“ bezeichnet hier das innere Selbst beziehungsweise die ganze Person.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „in das Gemach derer, die mich empfing“; eine poetische Parallele zu „in das Haus meiner Mutter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט שֶׁעָבַרְתִּי מֵהֶם עַד שֶׁמָּצָאתִי
  choice: Kaum war ich an ihnen vorübergegangen, da fand ich
  rationale: Die Konstruktion bezeichnet, dass das Finden fast unmittelbar nach dem Vorübergehen geschah. „Kaum …, da …“ gibt diesen zeitlichen Zusammenhang im Deutschen natürlich wieder.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: den, den meine Seele liebt
  rationale: Die wiederkehrende poetische Wendung wird verständlich wiedergegeben, ohne נַפְשִׁי zu einem bloßen „ich“ einzuebnen.
- source_word: אֲחַזְתִּיו
  choice: Ich hielt ihn fest
  rationale: אחז bezeichnet hier ein festes Ergreifen oder Festhalten; die Formulierung wahrt die Intensität, ohne unnötig Gewalt anzudeuten.
- source_word: וְלֹא אַרְפֶּנּוּ
  choice: und ließ ihn nicht los
  rationale: Die Hifilform von רפה bedeutet hier, jemanden loszulassen; dies ist die idiomatische deutsche Entsprechung.
- source_word: עַד שֶׁהֲבֵיאתִיו אֶל בֵּית אִמִּי
  choice: bis ich ihn in das Haus meiner Mutter gebracht hatte
  rationale: „In das Haus“ gibt die Bewegung in einen Innenraum wieder; das Plusquamperfekt fügt sich natürlich in den deutschen Satzverlauf.
- source_word: וְאֶל חֶדֶר הוֹרָתִי
  choice: in das Gemach derer, die mich empfangen hat
  rationale: הוֹרָתִי bezeichnet diejenige, die die Sprecherin empfangen beziehungsweise gezeugt hat. „Empfangen“ bewahrt den Bezug zur Empfängnis und den poetischen Parallelismus.
