  naturalness: Der Stil ist insgesamt natürliches, poetisch-würdiges Standarddeutsch. „Den, den meine Seele liebt“ ist bewusst formal, aber als Haupttext etwas schwerfällig. „Den meine Seele liebt“ ist idiomatischer und bewahrt die poetische Formel; die formale Doppelung kann sinnvoll in der Anmerkung stehen.
  terminology: „Seele“, „Haus meiner Mutter“ und „Gemach“ passen zum poetischen Register. „Die mich empfing“ ist als poetische, im Kontext eindeutig auf die Empfängnis bezogene Formulierung vorzuziehen. Die erste Anmerkung wird so angepasst, dass sie tatsächlich eine formellere Alternative zum Haupttext bietet.
