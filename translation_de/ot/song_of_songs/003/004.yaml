- from: Kaum war ich an ihnen vorübergegangen, da fand ich den, den meine Seele liebt.[a] Ich hielt ihn fest und ließ ihn nicht los, bis ich ihn in das Haus meiner Mutter gebracht hatte, in das Gemach derer, die mich empfangen hat.[b]
  to: Kaum war ich an ihnen vorübergegangen, da fand ich den, den meine Seele liebt.[a] Ich hielt ihn fest und ließ ihn nicht los, bis ich ihn in das Haus meiner Mutter gebracht hatte, in das Gemach derer, die mich empfing.[b]
  rationale: Die Anmerkung a wird dadurch funktional, dass der Haupttext die natürlichere Form „den meine Seele liebt“ verwendet. Die Schlusswendung wird von dem missverständlichen „die mich empfangen hat“ zu „die mich empfing“ korrigiert; diese poetische Form gibt die Mutter als die bei der Empfängnis Handelnde wieder, ohne den Parallelismus zur Mutter zu nivellieren.
