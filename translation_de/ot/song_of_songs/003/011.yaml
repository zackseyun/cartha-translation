base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/011.yaml
  text: Go out and look[a], O daughters of Zion, at King Solomon, with the crown with which his mother crowned him on the day of his wedding, on the day of the joy of his heart.
translation:
  language: de
  text: Geht hinaus und seht, ihr Töchter Zions, König Salomo mit der Krone[a], mit der ihn seine Mutter krönte am Tag seiner Hochzeit, am Tag der Freude seines Herzens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem Kranz“ beziehungsweise „mit dem Festkranz“; das hebräische Wort עֲטָרָה kann eine Krone oder einen festlichen Kranz bezeichnen, was zum Zusammenhang einer Hochzeit passt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְאֶינָה
  choice: Geht hinaus
  rationale: Der feminine Pluralimperativ von יצא fordert die Töchter Zions auf, ihren Ort zu verlassen. „Geht hinaus“ gibt die Bewegung nach draußen in natürlichem modernem Deutsch wieder.
- source_word: וּרְאֶינָה
  choice: und seht
  rationale: Der feminine Pluralimperativ von ראה bezeichnet hier die bewusste Betrachtung. „Seht“ passt zur direkten poetischen Aufforderung und verbindet sich natürlich mit dem folgenden Objekt.
- source_word: בְּנוֹת צִיּוֹן
  choice: ihr Töchter Zions
  rationale: Die Wendung ist eine direkte Anrede an die Frauen Zions beziehungsweise Jerusalems. Das vorangestellte „ihr“ kennzeichnet den Vokativ klar, ohne ein altertümliches „o“ zu benötigen.
- source_word: בַּמֶּלֶךְ שְׁלֹמֹה
  choice: König Salomo
  rationale: Nach dem Verb des Sehens bezeichnet ב das betrachtete Objekt. Im Deutschen genügt der Akkusativ ohne Wiedergabe der Präposition.
- source_word: בָּעֲטָרָה
  choice: mit der Krone
  rationale: 'Die Präposition ב beschreibt hier den Umstand, unter dem Salomo gesehen wird: Er trägt die Krone. „Mit der Krone“ bleibt nahe an der hebräischen Formulierung.'
- source_word: עֲטָרָה
  choice: Krone
  rationale: עֲטָרָה kann eine Krone oder einen festlichen Kranz bezeichnen. „Krone“ ist die allgemeinste Wiedergabe und bewahrt zugleich die sprachliche Verbindung zum folgenden Verb „krönte“; die mögliche Bedeutung „Kranz“ wird in einer Fußnote genannt.
- source_word: שֶׁעִטְּרָה לוֹ אִמּוֹ
  choice: mit der ihn seine Mutter krönte
  rationale: Die Wiedergabe mit „Krone“ und „krönte“ erhält die im Hebräischen vorhandene Verbindung zwischen dem Substantiv עֲטָרָה und dem verwandten Verb עטר.
- source_word: בְּיוֹם חֲתֻנָּתוֹ
  choice: am Tag seiner Hochzeit
  rationale: חֲתֻנָּה bezeichnet Hochzeit beziehungsweise Vermählung. „Hochzeit“ ist heute klar und natürlich und bewahrt die zeitliche Konstruktion des Hebräischen.
- source_word: וּבְיוֹם שִׂמְחַת לִבּוֹ
  choice: am Tag der Freude seines Herzens
  rationale: Die Formulierung wahrt die parallele Zeitangabe und die poetische Genitivverbindung des Hebräischen, ohne sie als bloßen Gefühlszustand zu paraphrasieren.
