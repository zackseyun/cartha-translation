source:
  edition: WLC
  text: כֻּלָּ/ם֙ אֲחֻ֣זֵי חֶ֔רֶב מְלֻמְּדֵ֖י מִלְחָמָ֑ה אִ֤ישׁ חַרְבּ/וֹ֙ עַל יְרֵכ֔/וֹ מִ/פַּ֖חַד בַּ/לֵּילּֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/008.yaml
  text: All of them are holding swords[a], trained in warfare; each man has his sword at his thigh because of terror in the nights.
translation:
  language: de
  text: Sie alle tragen Schwerter und sind für den Kampf geschult; jeder hat sein Schwert an der Hüfte – wegen des Schreckens in den Nächten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der Nacht« beziehungsweise »nachts«. Im Hebräischen steht wörtlich der Plural »in den Nächten«; er kann die Gefahr der Nacht poetisch verstärken oder allgemein nächtliche Gefahr bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Die Form bezeichnet ausdrücklich die Gesamtheit der zuvor genannten Männer; »sie alle« gibt dies im Deutschen natürlich wieder.
- source_word: אֲחֻזֵי חֶרֶב
  choice: tragen Schwerter
  rationale: Die Konstruktion mit אחז beschreibt hier Männer, die mit Schwertern versehen sind beziehungsweise sie griffbereit tragen. Der distributive Plural ist im Deutschen idiomatisch.
- source_word: מְלֻמְּדֵי מִלְחָמָה
  choice: für den Kampf geschult
  rationale: Das Partizip bezeichnet ausgebildete oder eingeübte Kämpfer; »für den Kampf geschult« bewahrt den militärischen Sinn und klingt gegenwärtig.
- source_word: אִישׁ
  choice: jeder
  rationale: Der Singular wird nach der Kollektivaussage distributiv gebraucht. »Jeder« gibt diesen Sinn knapp wieder; aus dem Zusammenhang ist klar, dass die bewaffneten Männer gemeint sind.
- source_word: חַרְבּוֹ עַל יְרֵכוֹ
  choice: hat sein Schwert an der Hüfte
  rationale: Die Wendung schildert das an Hüfte beziehungsweise Oberschenkel getragene und griffbereite Schwert. »An der Hüfte« ist im Deutschen anschaulich und idiomatisch.
- source_word: מִפַּחַד
  choice: wegen des Schreckens
  rationale: Die Präposition מִן wird kausal verstanden. »Schrecken« wahrt die Intensität von פַּחַד, ohne genauer festzulegen, worin die nächtliche Gefahr besteht.
- source_word: בַּלֵּילוֹת
  choice: in den Nächten
  rationale: Die Wiedergabe erhält den poetischen Plural des Hebräischen. Da dieser auch allgemein nächtliche Gefahr bezeichnen kann, nennt die Fußnote idiomatischere Alternativen.
