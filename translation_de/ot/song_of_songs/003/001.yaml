source:
  edition: WLC
  text: עַל מִשְׁכָּבִ/י֙ בַּ/לֵּיל֔וֹת בִּקַּ֕שְׁתִּי אֵ֥ת שֶׁ/אָהֲבָ֖ה נַפְשִׁ֑/י בִּקַּשְׁתִּ֖י/ו וְ/לֹ֥א מְצָאתִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/001.yaml
  text: On my bed in the nights I sought the one my soul loves; I sought him[a], but I did not find him.
translation:
  language: de
  text: Auf meinem Bett suchte ich in den Nächten[a] nach dem, den meine Seele liebt; ich suchte ihn, doch fand ich ihn nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „Nächte“ im Plural. Gemeint sein können wiederholte Nächte oder nächtliche Zeitabschnitte; viele Übersetzungen geben die Wendung vereinfacht mit „in der Nacht“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מִשְׁכָּבִי
  choice: Auf meinem Bett
  rationale: מִשְׁכָּב bezeichnet hier den Ort des Liegens. „Auf meinem Bett“ bewahrt das konkrete Bild und klingt im modernen Deutschen natürlich.
- source_word: בַּלֵּילוֹת
  choice: in den Nächten
  rationale: Die hebräische Form steht im Plural. Die Wiedergabe bewahrt diese auffällige Form und lässt sowohl wiederholte Nächte als auch nächtliche Zeitabschnitte zu.
- source_word: בִּקַּשְׁתִּי
  choice: suchte ich … nach
  rationale: בקשׁ bedeutet „suchen“ beziehungsweise „nach jemandem suchen“. Die deutsche Konstruktion mit „nach“ gibt das gezielte Suchen idiomatisch wieder.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: nach dem, den meine Seele liebt
  rationale: Die Formulierung erhält das persönliche Objekt und bewahrt mit „meine Seele“ die poetische Sprache für das innerste Selbst, ohne sie auf ein bloßes „ich“ zu reduzieren.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann Seele, Leben, Person oder Selbst bezeichnen. Im Liebesgedicht trägt „meine Seele“ die emotionale und poetische Tiefe des Ausdrucks angemessen.
- source_word: בִּקַּשְׁתִּיו
  choice: ich suchte ihn
  rationale: Die Wiederholung des Verbs und das ausdrückliche pronominale Suffix werden beibehalten; so bleiben Parallelismus und Nachdruck des Hebräischen hörbar.
- source_word: וְלֹא מְצָאתִיו
  choice: doch fand ich ihn nicht
  rationale: „Doch“ gibt den gegensätzlichen, enttäuschenden Ausgang natürlich wieder. „Fand ich ihn nicht“ entspricht knapp dem hebräischen מצא mit Verneinung und Objektssuffix.
theological_decisions: []
