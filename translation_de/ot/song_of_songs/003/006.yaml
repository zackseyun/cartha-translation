base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/006.yaml
  text: Who is this coming up from the wilderness like columns of smoke[a], perfumed with myrrh and frankincense[c][b], from every fragrant powder of the merchant?
translation:
  language: de
  text: Wer ist sie, die aus der Wüste[a] heraufzieht wie Rauchsäulen[b], mit Myrrhe und Weihrauch durchduftet, mit allerlei Duftpulver eines Händlers?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Steppe“ beziehungsweise „aus der Wildnis“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie Säulen von Rauch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֹאת
  choice: Wer ist sie
  rationale: Das feminine Demonstrativpronomen weist auf eine weibliche Bezugsgröße. „Wer ist sie?“ gibt dies im Deutschen natürlich und ausdrücklich wieder, ohne die Identität näher festzulegen.
- source_word: עֹלָה
  choice: heraufzieht
  rationale: Das Partizip bezeichnet eine fortdauernde Aufwärtsbewegung. „Heraufzieht“ passt sowohl zu einer Person beziehungsweise Prozession als auch zum anschließenden Rauchbild.
- source_word: מִן הַמִּדְבָּר
  choice: aus der Wüste
  rationale: מִדְבָּר kann Wüste, Steppe oder unbewohntes Land bezeichnen. „Wüste“ ist hier verständlich und bewahrt die traditionelle räumliche Bildwelt; die weitere Bedeutung wird in einer Fußnote genannt.
- source_word: כְּתִימֲרוֹת עָשָׁן
  choice: wie Rauchsäulen
  rationale: תִּימֲרוֹת bezeichnet hoch aufsteigende, säulenartige Rauchgebilde. „Rauchsäulen“ bewahrt das vertikale Bild und die Mehrzahl des Hebräischen.
- source_word: מְקֻטֶּרֶת
  choice: durchduftet
  rationale: Das passive Partizip von קטר beschreibt hier das Beduften beziehungsweise Beräuchern mit aromatischen Stoffen. „Durchduftet“ vermittelt poetisch das Ergebnis, ohne die im heutigen Deutsch missverständliche Formulierung „inzensiert“ zu verwenden.
- source_word: מוֹר וּלְבוֹנָה
  choice: Myrrhe und Weihrauch
  rationale: Dies sind die etablierten deutschen Bezeichnungen für die beiden aromatischen Harze.
- source_word: מִכֹּל אַבְקַת רוֹכֵל
  choice: von allerlei Würzpulver des Händlers
  rationale: אַבְקָה bezeichnet Pulver oder feinen Staub, im Zusammenhang ein aromatisches Gewürz- beziehungsweise Duftpulver; רֹכֵל ist ein umherziehender Händler. „Allerlei“ gibt כֹּל idiomatisch wieder, während „von“ die hebräische Präposition wahrt.
theological_decisions:
- issue: Identität der heraufziehenden weiblichen Gestalt
  choice: Die Gestalt bleibt unbestimmt und wird lediglich grammatisch als weiblich gekennzeichnet.
  alternative: Explizite Identifikation als Braut, Sulamitin oder allegorische Gestalt.
  rationale: Der Vers fragt offen „Wer ist sie?“; eine nähere Identifikation würde eine Auslegung in den Text eintragen.
translation_notes:
  register: Moderne, poetisch-gehobene Standardsprache. Die feminine Bezugsgröße, die aufsteigende Bewegung, das mehrzahlige Rauchbild und die offene Frage des hebräischen Textes bleiben erhalten. „Durchduftet“ ist bewusst poetisch gewählt; „Würzpulver“ hält den konkreten Pulversinn fest.
