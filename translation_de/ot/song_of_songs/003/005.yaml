source:
  edition: WLC
  text: הִשְׁבַּ֨עְתִּי אֶתְ/כֶ֜ם בְּנ֤וֹת יְרוּשָׁלִַ֨ם֙ בִּ/צְבָא֔וֹת א֖וֹ בְּ/אַיְל֣וֹת הַ/שָּׂדֶ֑ה אִם תָּעִ֧ירוּ וְֽ/אִם תְּעֽוֹרְר֛וּ אֶת הָ/אַהֲבָ֖ה עַ֥ד שֶׁ/תֶּחְפָּֽץ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/005.yaml
  text: I adjure you[a], daughters of Jerusalem, by the gazelles or by the does of the field[b], that you not stir up or awaken love until it desires.
translation:
  language: de
  text: 'Ich beschwöre euch, ihr Töchter Jerusalems, bei den Gazellen oder bei den Hirschkühen des Feldes[b]: Weckt die Liebe nicht und facht sie nicht an, bis sie es will.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „bis es ihr gefällt“. Das hebräische Verb steht in der femininen Einzahl und stimmt grammatisch mit „Liebe“ überein. Die Zeile kann jedoch auch stärker personal verstanden werden, ohne dass der Text eindeutig eine Frau oder einen Mann als Bezug festlegt.'
    reason: alternative_reading
  - marker: b
    text: Gemeint sind wahrscheinlich wörtlich Gazellen und Hirschkühe. Der hebräische Ausdruck für „Gazellen“ kann zugleich an das ähnlich klingende Wort für „Heerscharen“ erinnern; möglicherweise liegt in der Schwurformel ein poetisches Wortspiel vor.
    reason: cultural_note
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: Ich beschwöre euch
  rationale: Der Hifil von שׁבע bezeichnet hier das feierliche Unter-Eid-Stellen beziehungsweise Beschwören. „Ich beschwöre euch“ bewahrt den ernsten Charakter der poetischen Schwurformel und klingt zugleich in heutigem Deutsch verständlich.
- source_word: בְּנוֹת יְרוּשָׁלִַם
  choice: ihr Töchter Jerusalems
  rationale: Die wörtliche poetische Anrede bleibt erhalten. Das eingeschobene „ihr“ macht die deutsche Anrede natürlich, ohne den kollektiven Ausdruck zu verflachen.
- source_word: בִּצְבָאוֹת אוֹ בְּאַיְלוֹת הַשָּׂדֶה
  choice: bei den Gazellen oder bei den Hirschkühen des Feldes
  rationale: Beide Ausdrücke werden als weibliche Wildtiere verstanden. „Gazellen“ und „Hirschkühe“ geben den Parallelismus klar und gegenwärtig wieder; „des Feldes“ bewahrt die poetische Landschaftsangabe.
- source_word: אִם ... וְאִם
  choice: Weckt … nicht und facht … nicht an
  rationale: In einer hebräischen Schwurformel leitet אִם eine nachdrückliche Untersagung ein. Der deutsche Imperativ mit „nicht“ vermittelt diese Funktion natürlicher als ein wörtliches „wenn“.
- source_word: תָּעִירוּ וְתְעוֹרְרוּ
  choice: Weckt … nicht und facht … nicht an
  rationale: Die beiden eng verwandten Verben bilden eine verstärkende poetische Doppelung. Zwei deutsche, sinnverwandte Wendungen vermeiden eine schwerfällige Wiederholung und bewahren den Gedanken, Liebe weder zu wecken noch aktiv anzuregen.
- source_word: הָאַהֲבָה
  choice: die Liebe
  rationale: Der gewöhnliche Ausdruck für Liebe lässt offen, ob die Liebe als Erfahrung, Begehren oder poetisch personifizierte Größe gemeint ist.
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: bis sie es will
  rationale: Das feminine Singularverb stimmt grammatisch mit dem femininen Substantiv „Liebe“ überein. Das deutsche „sie“ erhält diese Verbindung, während „es will“ die Willensbedeutung von חפץ idiomatisch ausdrückt, ohne einen bestimmten menschlichen Bezug festzulegen.
theological_decisions:
- issue: Bezug der femininen Verbform im Schlusssatz
  choice: '„die Liebe“ bleibt das Subjekt: „bis sie es will“'
  alternative: „bis es ihr gefällt“, „bis sie will“ oder eine personale Deutung als Geliebte beziehungsweise Geliebter
  rationale: Die feminine Singularform kann unmittelbar auf das feminine Substantiv „Liebe“ bezogen werden. Eine eindeutige Identifikation mit einer Frau oder einem Mann wäre interpretierend und wird deshalb nicht in den Haupttext aufgenommen.
translation_notes:
  register: Moderne, gehobene und gut verständliche poetische Sprache. Die feierliche Schwurformel bleibt erhalten; veraltete Wörter wie „Hinden“ werden vermieden. Der Doppelpunkt kennzeichnet im Deutschen klar den Übergang von der Beschwörung zum Inhalt der Mahnung.
