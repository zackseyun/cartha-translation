lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh, da ist
  rationale: Die Wendung lenkt die Aufmerksamkeit unmittelbar auf die Szene. „Sieh, da ist“ gibt die deiktische Kraft in natürlichem, modernem Deutsch wieder.
- source_word: מִטָּתוֹ
  choice: Salomos Lager
  rationale: מִטָּה kann Bett, Ruhestätte oder Liegelager bezeichnen. „Lager“ bewahrt die Unbestimmtheit besser als „Sänfte“, die erst der Kontext nahelegt, und klingt hier würdevoll und natürlich.
- source_word: שֶׁלִּשְׁלֹמֹה
  choice: Salomos
  rationale: Die Besitzangabe wird im Deutschen am natürlichsten durch den vorangestellten Genitiv ausgedrückt.
- source_word: שִׁשִּׁים
  choice: sechzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: גִּבֹּרִים
  choice: Krieger / Helden
  rationale: Das Wort bezeichnet starke, kampferprobte oder tapfere Männer. „Krieger“ ist beim ersten Vorkommen kontextuell klar; „Helden“ in der zweiten Wendung erhält deren anerkennenden Charakter, ohne mit einer schwerfälligen Wiederholung zu übersetzen.
- source_word: סָבִיב לָהּ
  choice: stehen rings darum
  rationale: „Rings darum“ gibt die umgebende Stellung idiomatisch wieder. „Stehen“ ist aus der dargestellten Wachszene erschlossen und macht im Deutschen einen vollständigen, natürlichen Satz möglich.
- source_word: מִגִּבֹּרֵי יִשְׂרָאֵל
  choice: ausgewählt aus Israels Helden
  rationale: Die Präposition מִן bezeichnet hier die Auswahl aus einer Gruppe. „Ausgewählt aus“ macht deutlich, dass die Sechzig zu Israels Helden gehören und aus ihrer Mitte stammen.
