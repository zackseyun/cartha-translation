base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/011.yaml
  text: I went down to the walnut grove to look at the shoots in the valley[a], to see whether the vine had budded[c][b], whether the pomegranates had blossomed.
translation:
  language: de
  text: 'Zum Walnusshain stieg ich hinab,


    um nach den jungen Trieben im Tal zu sehen[a],


    um zu sehen, ob der Weinstock Knospen getrieben hatte[b],


    ob die Granatapfelbäume blühten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Wadi“ oder „im Bachbett“. Das hebräische Wort kann ein Tal mit Wasserlauf, ein zeitweise trockenes Flussbett oder dessen Umgebung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ob der Weinstock blühte“. Das hebräische Verb kann das Knospen, Sprießen oder Blühen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּנַּת אֱגוֹז
  choice: Walnusshain
  rationale: גִּנָּה bezeichnet einen Garten oder Hain, אֱגוֹז wahrscheinlich den Walnuss- bzw. Nussbaum. „Walnusshain“ ist im Deutschen natürlich und bewahrt die Vorstellung einer kultivierten Baumpflanzung.
- source_word: יָרַדְתִּי
  choice: stieg ich hinab
  rationale: ירד bezeichnet eine Abwärtsbewegung. „stieg ich hinab“ erhält diese Richtung und passt zum würdevollen poetischen Register.
- source_word: לִרְאוֹת
  choice: um … zu sehen
  rationale: Der Infinitiv erscheint zweimal und bezeichnet jeweils den Zweck des Hinabsteigens. Die Wiederholung wird zur Wahrung der poetischen Struktur beibehalten.
- source_word: בְּאִבֵּי הַנָּחַל
  choice: nach den jungen Trieben im Bachtal
  rationale: אִבִּים meint frischen Pflanzenwuchs bzw. junge Triebe; נַחַל kann ein Bachtal, Wadi oder Bachbett bezeichnen. „Bachtal“ hält Wasserlauf und Talraum zusammen, ohne die Stelle auf ein trockenes Wadi festzulegen.
- source_word: הֲפָרְחָה הַגֶּפֶן
  choice: ob der Weinstock Knospen getrieben hatte
  rationale: פרח kann das Knospen, Sprießen oder Blühen bezeichnen. „Knospen getrieben“ bewahrt die mögliche frühe Wachstumsphase und unterscheidet das Verb vom anschließenden Blühen der Granatapfelbäume.
- source_word: הֵנֵצוּ הָרִמֹּנִים
  choice: ob die Granatapfelbäume blühten
  rationale: נוץ bezeichnet hier das Hervorbringen von Blüten. Im Deutschen benennt „Granatapfelbäume“ die Pflanzen natürlicher und eindeutig, während das Hebräische metonymisch „die Granatäpfel“ sagen kann.
