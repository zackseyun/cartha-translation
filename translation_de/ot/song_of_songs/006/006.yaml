base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/006.yaml
  text: Your teeth are like a flock of ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
translation:
  language: de
  text: 'Deine Zähne sind wie eine Herde Mutterschafe,


    die vom Waschen heraufkommen.


    Sie alle haben Zwillinge[a],


    und keines von ihnen hat ein Junges verloren.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie alle sind gepaart“. Das Bild deutet wahrscheinlich darauf hin, dass jeder Zahn sein Gegenstück hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und keine unter ihnen ist eines Jungen beraubt“; das heißt, keine hat ein Junges verloren. Im Vergleich mit den Zähnen wird damit ausgedrückt, dass keiner fehlt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁנַּיִךְ
  choice: deine Zähne
  rationale: Die direkte Anrede in der 2. Person Singular feminin und der Plural werden im Deutschen natürlich und genau wiedergegeben.
- source_word: כְּעֵדֶר הָרְחֵלִים
  choice: wie eine Herde Mutterschafe
  rationale: רְחֵלִים bezeichnet weibliche Schafe. „Mutterschafe“ bewahrt diese Präzision und passt zu den folgenden Hinweisen auf Zwillinge und verlorene Junge.
- source_word: שֶׁעָלוּ מִן הָרַחְצָה
  choice: die vom Waschen heraufkommen
  rationale: Die Formulierung hält sowohl die Bewegung des Heraufkommens als auch das Bild frisch gewaschener, heller Schafe fest, ohne den nicht ausdrücklich genannten Ort näher zu bestimmen.
- source_word: שֶׁכֻּלָּם מַתְאִימוֹת
  choice: sie alle tragen Zwillinge
  rationale: Die im Schafbild naheliegende Bedeutung ist, dass alle Zwillinge haben bzw. hervorbringen. „Tragen“ erhält das poetische Bild und lässt zugleich die angedeutete paarweise Vollständigkeit der Zähne erkennen.
- source_word: וְשַׁכֻּלָה אֵין בָּהֶם
  choice: und keines von ihnen hat sein Junges verloren
  rationale: שַׁכֻּלָה bezeichnet wörtlich ein Tier oder eine Person, die eines Jungen bzw. Kindes beraubt ist. Die Übersetzung bewahrt das Herdenbild; die übertragene Aussage, dass kein Zahn fehlt, bleibt als Implikation erhalten.
theological_decisions: []
translation_notes:
