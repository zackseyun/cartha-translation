base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/001.yaml
  text: Where has your beloved gone[a], most beautiful among women? Where has your beloved turned, that we may seek him with you?
translation:
  language: de
  text: Wohin ist dein Geliebter gegangen, du Schönste unter den Frauen? Wohin hat sich dein Geliebter gewandt,[a] damit wir ihn mit dir suchen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wohin hat sich dein Geliebter abgewandt?“ Das Verb kann eine Richtungsänderung oder ein Sich-Abwenden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה
  choice: Wohin
  rationale: Das Frageadverb fragt nach dem Ziel oder der Richtung; „Wohin“ ist im Deutschen präzise und idiomatisch.
- source_word: הָלַךְ
  choice: ist … gegangen
  rationale: Das Qal Perfekt bezeichnet hier ein Weggehen, dessen Ergebnis für den gegenwärtigen Aufenthaltsort entscheidend ist.
- source_word: דּוֹדֵךְ
  choice: dein Geliebter
  rationale: דּוֹד bezeichnet im Hohelied den romantisch geliebten Mann; „Geliebter“ bewahrt den poetischen und würdevollen Ton.
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: du Schönste unter den Frauen
  rationale: Die hebräische Vergleichsformel hat superlativischen Sinn. Die deutsche Anrede gibt diesen natürlich wieder.
- source_word: פָּנָה
  choice: hat sich … gewandt
  rationale: Das Verb bezeichnet ein Wenden oder Einschlagen einer Richtung. Die Formulierung erhält das Richtungsbild und die Parallele zur ersten Frage.
- source_word: וּנְבַקְשֶׁנּוּ
  choice: damit wir ihn … suchen
  rationale: Die Kohortativform drückt hier die beabsichtigte Folge der erfragten Auskunft aus; „suchen“ entspricht dem poetischen Kontext.
- source_word: עִמָּךְ
  choice: mit dir
  rationale: Die Präposition mit femininem Singularsuffix bezeichnet die Begleitung bei der Suche.
