  text: Your cheeks are like a slice of pomegranate behind your veil[a].
translation:
  language: de
  text: Wie ein Stück vom Granatapfel ist deine Schläfe hinter deinem Schleier.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hinter deinen Haarsträhnen“ beziehungsweise „durch dein Haar“, falls צַמָּתֵךְ hier das Haar und nicht einen Schleier bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפֶלַח
  choice: wie ein Stück
  rationale: Das Präfix כְּ kennzeichnet den Vergleich. פֶלַח bezeichnet ein abgetrenntes Stück oder Segment; „Stück“ ist im Deutschen natürlich und legt die genaue Form nicht unnötig fest.
- source_word: הָרִמּוֹן
  choice: vom Granatapfel
  rationale: Das Substantiv bezeichnet den Granatapfel. In Verbindung mit „Stück“ gibt „vom Granatapfel“ die hebräische Genitivbeziehung idiomatisch wieder und bewahrt das sinnlich-poetische Fruchtbild.
- source_word: רַקָּתֵךְ
  choice: deine Schläfe
  rationale: רַקָּה bezeichnet die Schläfe beziehungsweise die seitliche Gesichtspartie. Der hebräische Ausdruck steht im Singular mit Suffix der 2. Person feminin Singular; „deine Schläfe“ wahrt diese Form genauer als der kontextuell mögliche Plural „deine Wangen“.
- source_word: מִבַּעַד
  choice: hinter
  rationale: Die Präposition bezeichnet eine Lage hinter beziehungsweise die Wahrnehmung durch etwas Verdeckendes. Mit „Schleier“ ist „hinter“ knapp und idiomatisch.
- source_word: לְצַמָּתֵךְ
  choice: deinem Schleier
  rationale: צַמָּה wird an dieser Stelle häufig als Schleier oder Bedeckung verstanden. Da auch Haar beziehungsweise Haarsträhnen möglich sind, wird die lexikalische Unsicherheit in einer Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige und knappe Liebeslyrik. Die ungewöhnliche Bildsprache des Hebräischen bleibt erhalten; der Vers folgt eng der Singularform „Schläfe“, ohne die mögliche Deutung als seitliche Gesichtspartie auszuschließen.
