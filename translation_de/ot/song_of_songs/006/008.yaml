  register: Moderne, würdige und knapp poetische Standardsprache. Die parallele Zahlenfolge bleibt erhalten; „ohne Zahl“ wahrt den gehobenen Ton. Der Fußnotenmarker steht bei „junge Frauen“, da sich die lexikalische Alternative auf עֲלָמוֹת bezieht.
