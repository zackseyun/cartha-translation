base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/008.yaml
  text: There are sixty queens and eighty concubines[a], and young women without number.
translation:
  language: de
  text: Sechzig Königinnen gibt es und achtzig Nebenfrauen, dazu junge Frauen[a] ohne Zahl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Mädchen“; möglicherweise „Jungfrauen“. Das hebräische Wort עֲלָמוֹת bezeichnet allgemein junge Frauen und setzt nicht von sich aus die speziellere Bedeutung „Jungfrauen“ voraus.
    reason: lexikalische Alternative
lexical_decisions:
- source_word: שִׁשִּׁים הֵמָּה מְּלָכוֹת
  choice: Sechzig Königinnen gibt es
  rationale: Die Existenzkonstruktion gibt die hervorgehobene Aufzählung im Deutschen natürlich wieder; מְּלָכוֹת bezeichnet in diesem höfischen Zusammenhang Königinnen.
- source_word: וּשְׁמֹנִים פִּילַגְשִׁים
  choice: und achtzig Nebenfrauen
  rationale: „Nebenfrauen“ bezeichnet Frauen mit anerkannter, gegenüber den Hauptfrauen jedoch nachgeordneter Stellung und ist im Deutschen verständlicher und weniger missverständlich als „Konkubinen“.
- source_word: וַעֲלָמוֹת
  choice: dazu junge Frauen[a]
  rationale: עֲלָמוֹת bezeichnet junge Frauen im heiratsfähigen Alter, ohne für sich allein Jungfräulichkeit ausdrücklich festzulegen. „Dazu“ verbindet die dritte Gruppe idiomatisch mit der Aufzählung.
- source_word: אֵין מִסְפָּר
  choice: ohne Zahl
  rationale: Die knappe poetische Wendung bewahrt das Bild einer unübersehbaren Menge und entspricht der hebräischen Formulierung eng.
theological_decisions: []
