base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/010.yaml
  text: Who is this who looks forth like the dawn[a], beautiful as the moon, bright as the sun[c][b], awe-inspiring as bannered armies?
translation:
  language: de
  text: Wer ist sie, die hervorblickt wie die Morgenröte, schön wie der Mond, strahlend wie die Sonne[a], Ehrfurcht gebietend wie Heere mit Feldzeichen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rein wie die Sonne“ beziehungsweise „klar wie die Sonne“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie Scharen mit Bannern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֹאת
  choice: Wer ist sie
  rationale: Das Hebräische verbindet das Fragewort mit einem femininen Demonstrativpronomen. Im Deutschen benennt „sie“ den durch Form und Kontext klar weiblichen Bezug natürlich; „Wer ist diese?“ wäre formnäher, aber weniger idiomatisch.
- source_word: הַנִּשְׁקָפָה
  choice: die hervorblickt
  rationale: Das Partizip von שׁקף bezeichnet ein Hervor- oder Herabblicken von einem erhöhten beziehungsweise abgegrenzten Ort. „hervorblickt“ bewahrt das anschauliche Moment, ohne eine Blickrichtung festzulegen.
- source_word: כְּמוֹ שָׁחַר
  choice: wie die Morgenröte
  rationale: שַׁחַר bezeichnet Morgengrauen beziehungsweise Tagesanbruch. „Morgenröte“ ist im Deutschen ein natürliches poetisches Bild und passt zum folgenden Lichtvergleich.
- source_word: יָפָה כַלְּבָנָה
  choice: schön wie der Mond
  rationale: Die einfache Vergleichsstruktur und die Bedeutung von יָפָה als „schön“ werden unmittelbar wiedergegeben.
- source_word: בָּרָה כַּחַמָּה
  choice: strahlend wie die Sonne
  rationale: בָּרָה kann „rein“, „klar“ oder im Lichtkontext „hell/strahlend“ bedeuten. Neben Mond und Sonne gibt „strahlend“ die naheliegende visuelle Bedeutung natürlich wieder.
- source_word: אֲיֻמָּה
  choice: Ehrfurcht gebietend
  rationale: Das Wort bezeichnet eine Eindrucksmacht, die Furcht oder ehrfürchtiges Staunen hervorruft. Die Wendung bewahrt diese Spannung, ohne eine moralisch negative Bedeutung einzutragen.
- source_word: כַּנִּדְגָּלוֹת
  choice: wie Heere unter Bannern
  rationale: Die Form hängt mit דגל, „Banner/Feldzeichen“, zusammen und evoziert geordnete, durch Banner kenntliche Scharen. „Heere unter Bannern“ macht das militärische Bild im modernen Deutsch verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, gehobenes und zugleich verständliches poetisches Deutsch. Die parallelen Himmelsbilder und der überraschende Übergang zum militärischen Bannerbild bleiben erhalten; die Mehrdeutigkeit von בָּרָה und כַּנִּדְגָּלוֹת wird in Fußnoten kenntlich gemacht.
