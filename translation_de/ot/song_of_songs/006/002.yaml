base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/002.yaml
  text: My beloved has gone down to his garden[a], to the beds of spices[b], to graze in the gardens and to gather lilies.
translation:
  language: de
  text: Mein Geliebter ist in seinen Garten hinabgegangen, zu den Beeten der Duftgewächse, um in den Gärten zu weiden[a] und Lilien zu pflücken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu hüten“ oder „zu nähren“. Das hebräische Verb kann weiden, hüten oder nähren bedeuten und lässt hier offen, wer oder was geweidet beziehungsweise versorgt wird.'
    reason: lexical_alternative
  - marker: b
    text: Welche Blume mit dem hebräischen Wort genau gemeint ist, ist unsicher; traditionell wird es mit „Lilien“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: Mein Geliebter
  rationale: Im Hohelied bezeichnet דּוֹד den geliebten Mann. „Mein Geliebter“ ist im Deutschen natürlich, würdevoll und vermeidet die heute oft engeren sexuellen Konnotationen von „mein Liebhaber“.
- source_word: יָרַד
  choice: ist hinabgegangen
  rationale: Das Qatal beschreibt eine vollzogene Bewegung nach unten. Das Perfekt ist im modernen Deutschen idiomatisch und bewahrt durch „hinab“ die Richtungsangabe.
- source_word: לְגַנּוֹ
  choice: in seinen Garten
  rationale: ל bezeichnet hier das Ziel der Bewegung. Nach „hinabgehen“ gibt „in seinen Garten“ den Eintritt in den Garten im Deutschen natürlich wieder.
- source_word: לַעֲרוּגוֹת הַבֹּשֶׂם
  choice: zu den Beeten der Duftgewächse
  rationale: עֲרוּגוֹת sind angelegte Beete oder Pflanzreihen; בֹּשֶׂם bezeichnet wohl aromatische Pflanzen oder Duftstoffe. „Duftgewächse“ erhält das gärtnerische und aromatische Bild, ohne die Pflanzenart unnötig festzulegen.
- source_word: לִרְעוֹת
  choice: um … zu weiden
  rationale: רעה kann „weiden“, „abweiden“ oder „hüten“ bedeuten. „Weiden“ hält die pastorale Mehrdeutigkeit offen, statt ausdrücklich den Geliebten, eine Herde oder eine übertragene Bedeutung zum Objekt zu machen.
- source_word: בַּגַּנִּים
  choice: in den Gärten
  rationale: Der Plural des hebräischen Textes bleibt erhalten und wird nicht an den zuvor genannten einzelnen Garten angeglichen.
- source_word: וְלִלְקֹט
  choice: und … zu pflücken
  rationale: לקט bedeutet sammeln oder auflesen. Bei Blumen ist „pflücken“ die natürliche deutsche Entsprechung.
- source_word: שׁוֹשַׁנִּים
  choice: Lilien
  rationale: „Lilien“ ist die traditionelle und im Hohelied konsistente Wiedergabe; die genaue botanische Art bleibt jedoch unsicher und wird deshalb in einer Fußnote erläutert.
