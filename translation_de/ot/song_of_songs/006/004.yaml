  text: יָפָ֨ה אַ֤תְּ רַעְיָתִ/י֙ כְּ/תִרְצָ֔ה נָאוָ֖ה כִּ/ירוּשָׁלִָ֑ם אֲיֻמָּ֖ה כַּ/נִּדְגָּלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/004.yaml
  text: You are beautiful[a], my love, like Tirzah, lovely like Jerusalem, awe-inspiring as bannered armies.
translation:
  language: de
  text: Schön bist du, meine Liebste, wie Tirza, anmutig wie Jerusalem, furchtgebietend wie Heerscharen mit Feldzeichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Scharen mit Feldzeichen“. Das hebräische Wort bezeichnet wahrscheinlich durch Feldzeichen kenntliche, geordnete Scharen und ruft ein eindrucksvolles, furchtgebietendes Bild hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפָה
  choice: schön
  rationale: Das prädikative Adjektiv bezeichnet unmittelbar die Schönheit der Frau; „schön“ ist im heutigen Deutsch klar, natürlich und poetisch angemessen.
- source_word: רַעְיָתִי
  choice: meine Liebste
  rationale: Die wiederkehrende vertraute Anrede bezeichnet die geliebte Frau. „Meine Liebste“ gibt die innige Beziehung im Kontext natürlicher wieder als das heute leicht platonisch wirkende „meine Freundin“.
- source_word: כְּתִרְצָה
  choice: wie Tirza
  rationale: Das Präfix כְּ markiert einen Vergleich. Der Ortsname wird in seiner üblichen deutschen Form wiedergegeben, ohne die mit der Stadt verbundenen Vorstellungen im Haupttext auszudeuten.
- source_word: נָאוָה
  choice: anmutig
  rationale: Das Adjektiv steht parallel zu יָפָה, hat aber einen eigenen poetischen Klang. „Anmutig“ bewahrt diese Variation und bezeichnet eine erfreuliche, reizvolle Erscheinung.
- source_word: כִּירוּשָׁלִָם
  choice: wie Jerusalem
  rationale: Die Vergleichsform und der konventionelle deutsche Ortsname werden unmittelbar wiedergegeben.
- source_word: אֲיֻמָּה
  choice: furchtgebietend
  rationale: Das Adjektiv bezeichnet eine beeindruckende, Ehrfurcht oder Furcht auslösende Erscheinung. „Furchtgebietend“ bewahrt diese Spannung, ohne sie zu bloßer Schönheit oder moralischer Bedrohlichkeit abzuschwächen.
- source_word: כַּנִּדְגָּלוֹת
  choice: wie Heerscharen unter Feldzeichen
  rationale: Die feminine Pluralform verweist wahrscheinlich auf geordnete, durch Feldzeichen kenntliche Scharen. Die Ergänzung „Heerscharen“ macht das im Hebräischen knapp vorausgesetzte militärische Bild im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles poetisches Deutsch mit klarer Parallelstruktur. Die Folge „schön – anmutig – furchtgebietend“ erhält die Steigerung und die überraschende Spannung des hebräischen Bildes; das militärische Motiv wird nicht verharmlost.
