base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/005.yaml
  text: Turn your eyes away from me[a], for they overwhelm me[b]. Your hair is like a flock of goats streaming down from Gilead.
translation:
  language: de
  text: Wende deine Augen von mir ab, denn sie überwältigen mich.[a] Dein Haar ist wie eine Ziegenherde, die von Gilead herabzieht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn sie bringen mich aus der Fassung“. Das hebräische Verb ist selten; seine genaue Bedeutung ist umstritten und kann auch ein Überwältigtsein ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die von Gilead herabsteigt“ oder „die an den Hängen Gileads hinabzieht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵבִּי
  choice: Wende ... ab
  rationale: Der feminine Singularimperativ fordert die Frau unmittelbar auf, ihren Blick abzuwenden. Die deutsche Wendung ist natürlich und bewahrt die direkte Aufforderung.
- source_word: עֵינַיִךְ מִנֶּגְדִּי
  choice: deine Augen von mir
  rationale: מִנֶּגְדִּי bezeichnet hier die Bewegung weg von der dem Sprecher zugewandten Position; „von mir ab“ gibt dies idiomatisch wieder.
- source_word: שֶׁהֵם הִרְהִיבֻנִי
  choice: denn sie überwältigen mich
  rationale: Das seltene Verb רהב ist hier in seiner Nuance umstritten. Im Kontext der Liebesdichtung bezeichnet es wahrscheinlich, dass ihr Blick den Sprecher emotional überwältigt oder aus der Fassung bringt.
- source_word: שַׂעְרֵךְ
  choice: Dein Haar
  rationale: Direkte und natürliche Wiedergabe des Nomens mit Suffix der zweiten Person feminin Singular.
- source_word: כְּעֵדֶר הָעִזִּים
  choice: wie eine Herde Ziegen
  rationale: עֵדֶר bezeichnet eine Herde beziehungsweise einen Verband von Weidetieren. „Herde Ziegen“ erhält das pastorale Vergleichsbild.
- source_word: שֶׁגָּלְשׁוּ
  choice: die ... herabziehen
  rationale: גלשׁ beschreibt eine Abwärtsbewegung. „herabziehen“ passt sowohl zur Bewegung der Ziegen als auch zum Bild des fallenden Haars und wahrt den Plural des hebräischen Verbs durch den Bezug auf „Ziegen“.
- source_word: מִן הַגִּלְעָד
  choice: vom Gilead
  rationale: Die Übersetzung bewahrt die knappe Ortsangabe des Hebräischen, ohne ausdrücklich einen Berg oder dessen Hänge einzufügen.
