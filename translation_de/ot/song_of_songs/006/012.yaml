  text: לֹ֣א יָדַ֔עְתִּי נַפְשִׁ֣/י שָׂמַ֔תְ/נִי מַרְכְּב֖וֹת עַמִּ/י נָדִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/012.yaml
  text: Before I knew it[b][a], my soul set me among the chariots of my noble people.
translation:
  language: de
  text: Ehe ich mich versah, brachte mich meine Seele[a] mitten unter die Streitwagen meines edlen Volkes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für »Seele« kann hier auch »ich selbst«, »mein Herz« oder »mein Verlangen« bedeuten. Der hebräische Satzbau ist insgesamt schwierig.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Streitwagen Ammi-Nadibs«; die letzten beiden hebräischen Wörter können statt als »meines edlen Volkes« auch als Eigenname verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדַעְתִּי
  choice: Ehe ich mich versah
  rationale: Wörtlich »Ich wusste nicht«. Die deutsche Wendung gibt die im Zusammenhang naheliegende Plötzlichkeit und das fehlende Bewusstsein für den Vorgang natürlich wieder.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ bezeichnet hier das eigene innere Wesen, kann aber auch als »ich selbst«, »mein Herz« oder »mein Verlangen« verstanden werden. »Meine Seele« bewahrt die poetische Offenheit des Hebräischen.
- source_word: שָׂמַתְנִי
  choice: brachte mich mitten unter
  rationale: Das Verb bedeutet grundsätzlich »setzen, stellen, versetzen«. Zusammen mit den Streitwagen ergibt die gewählte Formulierung im Deutschen ein verständliches räumliches Bild, ohne die schwierige Syntax übermäßig festzulegen.
- source_word: מַרְכְּבוֹת
  choice: die Streitwagen
  rationale: מַרְכָּבוֹת bezeichnet Wagen beziehungsweise Streitwagen. »Streitwagen« macht das im poetischen Kontext naheliegende herrschaftliche Fahrzeugbild deutlich.
- source_word: עַמִּי
  choice: meines Volkes
  rationale: עַם mit dem Suffix der ersten Person Singular bedeutet unmittelbar »mein Volk«.
- source_word: נָדִיב
  choice: edlen
  rationale: נָדִיב kann »edel«, »fürstlich«, »freigebig« oder »bereitwillig« bedeuten. Hier ist »edel« als nähere Bestimmung des Volkes knapp und sprachlich natürlich; die insgesamt unsichere Wortverbindung wird in der Fußnote kenntlich gemacht.
