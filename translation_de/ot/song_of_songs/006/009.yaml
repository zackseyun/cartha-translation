  to: Meine Taube, meine Makellose[a], sie ist die Einzige; die Einzige ihrer Mutter, die Reine[b] für die, die sie geboren hat. Töchter[c] sahen sie und nannten sie glücklich; Königinnen und Konkubinen priesen sie.
