  verdict: revise
  source_fidelity: Der Entwurf gibt die wesentlichen Bilder und die Wiederholung von אַחַת הִיא grundsätzlich wieder. Allerdings bezeichnet „für ihre Mutter“ im Deutschen eher eine besondere Bedeutung für die Mutter, während der hebräische Ausdruck ihre einzigartige Stellung als Kind ihrer Mutter ausdrückt. Auch „priesen sie glücklich“ ist keine natürliche deutsche Wiedergabe von וַיְאַשְּׁרוּהָ, das ein Glücklich-/Gesegnet-Nennen ausdrückt.
  naturalness: Die Umstellung zu Beginn ist möglich, schwächt aber die unmittelbare Anredefolge des Hebräischen. „Meine Taube, meine Makellose“ ist flüssiger und quellennäher. „Nannten sie glücklich“ ist idiomatisches modernes Deutsch. „Konkubinen“ ist für den historischen Sozialstatus präziser und geläufiger als „Nebenfrauen“.
  terminology: „Taube“, „Makellose“, „Töchter“ und „Königinnen“ sind passend. „Die Einzige ihrer Mutter“ vermittelt die exklusive familiäre Beziehung ohne die irreführende Nuance von „für ihre Mutter“. Die Fußnote zu בָּרָה sollte die lexikalische Bandbreite als Reinheit bzw. besondere Vorzüglichkeit beschreiben, ohne „Erwähltheit“ einzutragen.
