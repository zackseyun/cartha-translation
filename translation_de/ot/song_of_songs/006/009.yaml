source:
  edition: WLC
  text: אַחַ֥ת הִיא֙ יוֹנָתִ֣/י תַמָּתִ֔/י אַחַ֥ת הִיא֙ לְ/אִמָּ֔/הּ בָּרָ֥ה הִ֖יא לְ/יֽוֹלַדְתָּ֑/הּ רָא֤וּ/הָ בָנוֹת֙ וַֽ/יְאַשְּׁר֔וּ/הָ מְלָכ֥וֹת וּ/פִֽילַגְשִׁ֖ים וַֽ/יְהַלְלֽוּ/הָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/009.yaml
  text: My dove[a], my flawless one, is the only one; she is the only one of her mother, pure to the one who bore her. Daughters saw her and called her blessed[c][b]; queens and concubines also praised her.
translation:
  language: de
  text: Meine Taube, meine Makellose[a], sie ist die Einzige; die Einzige ihrer Mutter, die Reine[b] für die, die sie geboren hat. Töchter[c] sahen sie und nannten sie glücklich; Königinnen und Konkubinen priesen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Vollkommene“. Das hebräische Wort kann Ganzheit, Vollkommenheit oder Untadeligkeit ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Auserlesene“ beziehungsweise „die Strahlende“. Das hebräische Adjektiv kann Reinheit, Klarheit oder besondere Vorzüglichkeit bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: „Töchter“ kann in der Bildsprache des Gedichts allgemeiner junge Frauen oder Mädchen bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹנָתִי
  choice: meine Taube
  rationale: Die wörtliche Vogelmetapher bleibt als poetischer Kosename erhalten und wird nicht zu einer allgemeinen Anrede verflacht.
- source_word: תַמָּתִי
  choice: meine Makellose
  rationale: Das Wort bezeichnet Ganzheit, Vollkommenheit oder Untadeligkeit. „Makellose“ passt zum poetischen Lob der Geliebten, ohne die Aussage unnötig zu moralisieren.
- source_word: אַחַת הִיא
  choice: Einzig ist sie / die Einzige ist sie
  rationale: Die Wiederholung hebt ihre Einzigartigkeit und Ausschließlichkeit hervor; die wiederholte Formulierung des Hebräischen bleibt sichtbar.
- source_word: לְאִמָּהּ
  choice: für ihre Mutter
  rationale: Das ל bezeichnet hier die Beziehung zur Mutter. „Für ihre Mutter“ bewahrt diese Perspektive natürlicher als eine rein besitzanzeigende Formulierung.
- source_word: בָּרָה
  choice: die Reine
  rationale: Das Adjektiv kann Reinheit, Klarheit oder besondere Erwähltheit bezeichnen. „Die Reine“ ist knapp, poetisch und lässt die mögliche Qualitätsaussage bestehen.
- source_word: לְיוֹלַדְתָּהּ
  choice: für die, die sie geboren hat
  rationale: Die substantivierte Partizipialform wird relational und ohne unnötige Wiederholung von „Mutter“ wiedergegeben.
- source_word: בָנוֹת
  choice: Töchter
  rationale: Die wörtliche Bezeichnung bewahrt die poetische Ausdrucksweise des Hohelieds; der mögliche weitere Sinn wird in einer Fußnote erläutert.
- source_word: וַיְאַשְּׁרוּהָ
  choice: priesen sie glücklich
  rationale: Der Piel-Stamm von אשר bedeutet, jemanden glücklich beziehungsweise gesegnet zu nennen. Die gewählte Wendung bewahrt den deklarativen Lobcharakter.
- source_word: מְלָכוֹת
  choice: Königinnen
  rationale: Direkte und eindeutige Wiedergabe des hebräischen Plurals.
- source_word: וּפִילַגְשִׁים
  choice: und Nebenfrauen
  rationale: „Nebenfrauen“ ist im modernen Deutsch verständlich und gibt den sozialen Status wieder, ohne unnötig altertümlich zu klingen.
- source_word: וַיְהַלְלוּהָ
  choice: rühmten sie
  rationale: Das Verb הלל bezeichnet ausdrückliches Lob. „Rühmten“ vermeidet eine unmittelbare Wiederholung von „priesen“ und erhält den gehobenen poetischen Ton.
