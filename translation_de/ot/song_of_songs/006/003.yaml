  text: אֲנִ֤י לְ/דוֹדִ/י֙ וְ/דוֹדִ֣/י לִ֔/י הָ/רֹעֶ֖ה בַּ/שׁוֹשַׁנִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/003.yaml
  text: I am my beloved's[a], and my beloved is mine, who grazes among the lilies.
translation:
  language: de
  text: Ich gehöre meinem Geliebten, und mein Geliebter gehört mir – er weidet zwischen den Lilien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „er hütet zwischen den Lilien“. Das hebräische Partizip kann weiden, grasen oder als Hirte hüten bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי לְדוֹדִי
  choice: Ich gehöre meinem Geliebten
  rationale: Die hebräische Zugehörigkeitsformel mit ל wird im Deutschen natürlich durch „gehören“ wiedergegeben. „Geliebter“ bewahrt den liebevollen, poetischen Ton.
- source_word: וְדוֹדִי לִי
  choice: und mein Geliebter gehört mir
  rationale: Die parallele Wiedergabe erhält die Gegenseitigkeit und den poetischen Gleichklang der beiden nominalen Aussagen.
- source_word: הָרֹעֶה
  choice: er weidet
  rationale: Das Qal-Partizip von רעה kann „weiden“, „grasen“ oder „als Hirte hüten“ bedeuten. „Er weidet“ lässt im Deutschen offen, ob der Geliebte eine Herde weidet oder selbst in der pastoralen Szenerie weidet, und ergänzt kein im Hebräischen genanntes Objekt.
- source_word: בַּשׁוֹשַׁנִּים
  choice: zwischen den Lilien
  rationale: „Lilien“ erhält das wiederkehrende Blumenmotiv des Hohelieds; „zwischen“ gibt die örtliche Bedeutung der Präposition idiomatisch wieder.
theological_decisions:
- issue: Beziehungssprache im Hohelied
  choice: Die gegenseitige Zugehörigkeit der Liebenden wird ohne allegorische Ausdeutung wiedergegeben.
  alternative: Den Geliebten in der Übersetzung ausdrücklich als Gott oder den Messias deuten.
  rationale: Der hebräische Text spricht unmittelbar in poetischer Liebessprache. Spätere allegorische oder dogmatische Deutungen sollen nicht in den Wortlaut der Übersetzung eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. Der Gedankenstrich bindet die partizipiale Schlusswendung natürlich an den Geliebten zurück; die lexikalische Mehrdeutigkeit von רעה wird in der Fußnote bewahrt.
