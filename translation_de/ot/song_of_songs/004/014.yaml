translation:
  language: de
  text: Narde und Safran, Kalmus und Zimt, dazu alle Weihrauchbäume, Myrrhe und Adlerholz[a], dazu alle erlesenen Gewürze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Agarholz«. Traditionell wird das hebräische Wort auch mit »Aloe« wiedergegeben; gemeint ist hier jedoch ein wohlriechendes Holz, nicht Aloe vera.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵרְדְּ
  choice: Narde
  rationale: Die gebräuchliche deutsche Bezeichnung für die aromatische Pflanze beziehungsweise ihren Duftstoff; sie entspricht der traditionellen Identifizierung.
- source_word: כַרְכֹּם
  choice: Safran
  rationale: Standardbezeichnung für das kostbare Gewürz und Duftmittel.
- source_word: קָנֶה
  choice: Kalmus
  rationale: Im Zusammenhang der Duftstoffe ist aromatischer Kalmus gemeint, nicht allgemein ein Rohr.
- source_word: קִנָּמוֹן
  choice: Zimt
  rationale: Die natürliche deutsche Standardentsprechung für das genannte Gewürz.
- source_word: עִם כָּל עֲצֵי לְבוֹנָה
  choice: dazu alle Weihrauchbäume
  rationale: Bewahrt das konkrete Baumbild und die umfassende Aussage des Hebräischen; „dazu“ verbindet die Elemente der poetischen Aufzählung natürlich.
- source_word: מֹר
  choice: Myrrhe
  rationale: Etablierte deutsche Wiedergabe des aromatischen Harzes.
- source_word: אֲהָלוֹת
  choice: Adlerholz
  rationale: Bezeichnet hier wahrscheinlich das wohlriechende Agar- beziehungsweise Adlerholz, nicht Aloe vera; die präzisere moderne Pflanzenbezeichnung vermeidet ein naheliegendes Missverständnis.
- source_word: רָאשֵׁי בְשָׂמִים
  choice: alle erlesensten Gewürze
  rationale: Das wörtliche Bild von den „Häuptern“ der Duftstoffe bezeichnet idiomatisch die vorzüglichsten beziehungsweise kostbarsten Gewürze.
theological_decisions: []
translation_notes:
  register: Moderne, gehobene und zugleich verständliche poetische Sprache. Die parataktische Gewürzliste und das Bild der Weihrauchbäume bleiben erhalten; „dazu“ gibt עִם im Deutschen flüssig wieder.
