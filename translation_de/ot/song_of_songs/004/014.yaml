  source_fidelity: Die Aufzählung gibt die hebräischen Duft- und Gewürzstoffe sowie die beiden mit עִם eingeleiteten Zusätze sachgerecht wieder. »Kalmus«, »Weihrauchbäume« und »Adlerholz« sind im Kontext treffende Wiedergaben. רָאשֵׁי בְשָׂמִים bezeichnet jedoch idiomatisch die vorzüglichsten/erlesenen Gewürze; die vorliegende Superlativform ist im Deutschen nicht idiomatisch.
