base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/003.yaml
  text: Your lips are like a scarlet thread[a], and your mouth is lovely[c][b]. Your temples are like a slice of pomegranate behind your veil.
translation:
  language: de
  text: Deine Lippen sind wie ein scharlachroter Faden, und dein Mund ist lieblich[a]. Wie ein Stück Granatapfel ist deine Schläfe hinter deinem Schleier[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Reden ist lieblich“. Das hebräische Wort kann das Reden oder die Sprechweise bezeichnen; in der Abfolge der beschriebenen Gesichtszüge kann hier jedoch der Mund gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch deinen Schleier“. Der hebräische Ausdruck kann etwas bezeichnen, das durch eine Bedeckung hindurch oder von dahinter sichtbar ist.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „hinter deinen Locken“ beziehungsweise „hinter deinem Haar“. Die Bedeutung des hebräischen Wortes ist an dieser Stelle umstritten.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּחוּט הַשָּׁנִי
  choice: wie ein scharlachroter Faden
  rationale: חוּט bezeichnet einen Faden, eine Schnur oder einen Strang; „Faden“ gibt das feine poetische Bild natürlich wieder. שָׁנִי bezeichnet Scharlach beziehungsweise einen scharlachroten Farbstoff.
- source_word: שִׂפְתֹתַיִךְ
  choice: deine Lippen
  rationale: Die Dualform von „Lippe“ wird im Deutschen natürlich mit dem Plural wiedergegeben.
- source_word: וּמִדְבָּרֵיךְ
  choice: und dein Mund
  rationale: Das Wort bezeichnet eigentlich das Reden beziehungsweise die Sprechweise, kann hier im Zusammenhang der beschriebenen Gesichtszüge jedoch metonymisch auf den sprechenden Mund weisen. Die Fußnote bewahrt die wörtlichere Alternative.
- source_word: נָאוֶה
  choice: lieblich
  rationale: Das Adjektiv bedeutet „lieblich“, „schön“ oder „anmutig“. „Lieblich“ wahrt den intimen poetischen Ton, ohne altertümlich zu wirken.
- source_word: כְּפֶלַח הָרִמּוֹן
  choice: wie ein Stück Granatapfel
  rationale: פֶּלַח bezeichnet ein Stück, einen Abschnitt oder eine Scheibe. „Stück“ ist im Deutschen bei einem Granatapfel anschaulicher und natürlicher als „Scheibe“, ohne die Form genauer festzulegen, als es der hebräische Ausdruck tut.
- source_word: רַקָּתֵךְ
  choice: deine Schläfe
  rationale: רַקָּה bezeichnet gewöhnlich die Schläfe, also die seitliche Gesichtspartie. Der hebräische Singular bleibt erhalten; „Wange“ wäre möglich, ist aber lexikalisch weniger genau.
- source_word: מִבַּעַד
  choice: hinter
  rationale: Die Präposition beschreibt etwas, das hinter einer Bedeckung oder durch sie hindurch wahrgenommen wird. „Hinter“ ist im Haupttext knapp und idiomatisch; „durch“ wird als Alternative vermerkt.
- source_word: לְצַמָּתֵךְ
  choice: deinem Schleier
  rationale: צַמָּה wird im Hohelied traditionell als Schleier oder Bedeckung verstanden. Da die genaue Bedeutung umstritten ist und auch Haar beziehungsweise Locken gemeint sein könnten, bleibt diese Alternative in einer Fußnote sichtbar.
