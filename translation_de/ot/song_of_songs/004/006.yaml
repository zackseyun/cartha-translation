source:
  edition: WLC
  text: עַ֤ד שֶׁ/יָּפ֨וּחַ֙ הַ/יּ֔וֹם וְ/נָ֖סוּ הַ/צְּלָלִ֑ים אֵ֤לֶךְ לִ/י֙ אֶל הַ֣ר הַ/מּ֔וֹר וְ/אֶל גִּבְעַ֖ת הַ/לְּבוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/006.yaml
  text: Until the day breathes and the shadows flee[b][a], I will go to the mountain of myrrh and to the hill of frankincense.
translation:
  language: de
  text: Bis der Tag atmet[a] und die Schatten fliehen, will ich zum Myrrhenberg und zum Weihrauchhügel gehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Bis der Tag weht/kühl wird und die Schatten fliehen.« Das hebräische Verb bedeutet wörtlich »atmen« oder »wehen« und kann an die Abendbrise oder an den anbrechenden Morgen denken lassen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht beim Verb »gehen« zusätzlich »mir/für mich«. Dieses sogenannte ethische Dativpronomen kann die Aussage lediglich betonen; daher wird es im Haupttext nicht eigens wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד שֶׁיָּפוּחַ הַיּוֹם
  choice: Bis der Tag atmet
  rationale: Die Wendung gibt die zeitliche Grenze mit »bis« wieder und bewahrt die poetische Personifikation des hebräischen Verbs פוח, »atmen, wehen«. Eine Festlegung auf Abendkühle oder Tagesanbruch wird vermieden.
- source_word: וְנָסוּ הַצְּלָלִים
  choice: und die Schatten fliehen
  rationale: »Fliehen« erhält das lebendige Bild des Verbs נוס; »Schatten« ist die direkte und natürliche Wiedergabe von צְלָלִים.
- source_word: אֵלֶךְ לִי
  choice: will ich … gehen
  rationale: Die erste Person von הלך wird als beabsichtigte zukünftige Handlung wiedergegeben. Das ethische לִי klingt im Deutschen bei einer wörtlichen Wiedergabe unnatürlich und wird deshalb im Haupttext nicht eigens ausgedrückt, aber in einer Fußnote kenntlich gemacht.
- source_word: הַר הַמּוֹר
  choice: Myrrhenberg
  rationale: Das deutsche Kompositum gibt die hebräische Genitivverbindung knapp, bildhaft und natürlich wieder; מֹר bezeichnet Myrrhe.
- source_word: גִּבְעַת הַלְּבוֹנָה
  choice: Weihrauchhügel
  rationale: לְבוֹנָה bezeichnet spezifisch Weihrauch, und »Hügel« unterscheidet גִּבְעָה sachgerecht vom zuvor genannten Berg.
theological_decisions:
- issue: Wörtliche Bildsprache oder allegorische beziehungsweise körperbezogene Ausdeutung
  choice: Die konkrete poetische Bildsprache bleibt im Haupttext stehen.
  alternative: Die Bilder ausdrücklich auf den Körper der Geliebten, einen Rückzugsort oder einen kultischen beziehungsweise geistlichen Sinn beziehen.
  rationale: Der hebräische Text benennt den Bezug der Bilder nicht ausdrücklich. Die Übersetzung bewahrt daher die Mehrdeutigkeit und trägt keine allegorische oder konfessionelle Deutung in den Wortlaut ein.
translation_notes:
  register: Moderne, verständliche und zugleich poetisch-würdevolle Standardsprache. Die ungewöhnliche Personifikation »der Tag atmet« ist bewusst erhalten; die beiden Duftstoffbilder werden weder erklärt noch allegorisiert.
