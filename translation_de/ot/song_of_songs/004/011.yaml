  register: Moderne, gut verständliche Standardsprache mit einem würdigen, poetischen Klang. Die sinnliche Bildsprache und die Wiederholung von „Duft“ bleiben erhalten; die Wortfolge „Honig und Milch“ folgt bewusst dem Hebräischen.
