source:
  edition: WLC
  text: נֹ֛פֶת תִּטֹּ֥פְנָה שִׂפְתוֹתַ֖יִ/ךְ כַּלָּ֑ה דְּבַ֤שׁ וְ/חָלָב֙ תַּ֣חַת לְשׁוֹנֵ֔/ךְ וְ/רֵ֥יחַ שַׂלְמֹתַ֖יִ/ךְ כְּ/רֵ֥יחַ לְבָנֽוֹן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/011.yaml
  text: Your lips drip honeycomb[a], bride; honey and milk are under your tongue[b], and the fragrance of your garments is like the fragrance of Lebanon.
translation:
  language: de
  text: Deine Lippen träufeln Wabenhonig[a], Braut; Honig und Milch[b] sind unter deiner Zunge, und der Duft deiner Kleider ist wie der Duft des Libanon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Honigseim“. Das hebräische Wort נֹפֶת bezeichnet genauer den aus den Waben fließenden Honig als das allgemeinere Wort für „Honig“ im folgenden Satz.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht: „Honig und Milch“, nicht die geläufigere Wendung „Milch und Honig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹפֶת
  choice: Wabenhonig
  rationale: Das Wort bezeichnet hier genauer den aus den Waben fließenden Honig und wird so von dem allgemeineren דְּבַשׁ im nächsten Satz unterschieden.
- source_word: תִּטֹּפְנָה
  choice: träufeln
  rationale: Das Verb נטף beschreibt ein Tropfen oder Fließen in Tropfen. „Träufeln“ bewahrt das sinnliche poetische Bild und verbindet sich im Deutschen natürlich mit „Wabenhonig“.
- source_word: שִׂפְתוֹתַיִךְ
  choice: deine Lippen
  rationale: Die Pluralform mit Suffix der zweiten Person Singular feminin wird direkt und idiomatisch wiedergegeben.
- source_word: כַּלָּה
  choice: meine Braut
  rationale: Das Substantiv wird im Hohelied als bräutliche Anrede für die Geliebte gebraucht. Das im Deutschen bei einer direkten Anrede natürliche „meine“ ist kontextuell ergänzt, ohne den Bildgehalt zu verändern.
- source_word: דְּבַשׁ וְחָלָב
  choice: Honig und Milch
  rationale: Die hebräische Wortfolge wird bewahrt und nicht an die geläufigere Wendung „Milch und Honig“ angeglichen.
- source_word: תַּחַת לְשׁוֹנֵךְ
  choice: unter deiner Zunge
  rationale: Die konkrete, sinnliche Bildsprache wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: רֵיחַ
  choice: Duft
  rationale: Im eindeutig positiven poetischen Zusammenhang bezeichnet „Duft“ einen angenehmen Geruch und ist zugleich modern und gehoben.
- source_word: שַׂלְמֹתַיִךְ
  choice: deine Kleider
  rationale: Das Wort bezeichnet Kleidung beziehungsweise Gewänder. „Kleider“ ist verständlich, poetisch passend und weniger altertümlich als „Gewänder“.
- source_word: כְּרֵיחַ לְבָנוֹן
  choice: wie der Duft des Libanon
  rationale: Der geografische Vergleich bleibt unverändert erhalten; eine Deutung auf Zedern oder Bergluft wird nicht in den Haupttext eingefügt.
theological_decisions: []
