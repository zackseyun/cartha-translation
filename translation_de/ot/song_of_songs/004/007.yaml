  yaml_path: translation/ot/song_of_songs/004/007.yaml
  text: You are altogether beautiful[a], my beloved[c][b], and there is no blemish in you.
translation:
  language: de
  text: Du bist ganz und gar schön, meine Geliebte, und kein Makel ist an dir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֻּלָּךְ
  choice: ganz und gar
  rationale: Die Form mit dem Suffix der 2. Person Singular feminin bezeichnet die Frau umfassend als ganze Person. „Ganz und gar“ gibt diese Gesamtbedeutung natürlich und nachdrücklich wieder.
- source_word: יָפָה
  choice: schön
  rationale: „Schön“ ist die direkte, gegenwärtige und poetisch angemessene Entsprechung des Adjektivs.
- source_word: רַעְיָתִי
  choice: meine Geliebte
  rationale: Im Hohelied ist das Wort eine innige Anrede an die geliebte Frau. „Meine Geliebte“ bewahrt sowohl die Zuneigung als auch den substantivischen Charakter der Anrede.
- source_word: וּמוּם
  choice: und kein Makel
  rationale: מוּם bezeichnet einen körperlichen Fehler oder Makel. „Makel“ passt zur poetischen Aussage vollkommener Schönheit, ohne die Bedeutung unnötig auf einen Fleck zu verengen.
- source_word: אֵין בָּךְ
  choice: ist an dir
  rationale: Die hebräische Existenzverneinung mit בְּ wird im Deutschen idiomatisch als „kein Makel ist an dir“ wiedergegeben und bleibt dabei nahe an der Struktur und Bildsprache des Ausgangstextes.
