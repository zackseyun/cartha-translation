  yaml_path: translation/ot/song_of_songs/004/015.yaml
  text: A spring of gardens[a], a well of living water[c][b], and streams flowing from Lebanon.
translation:
  language: de
  text: Eine Quelle der Gärten[a], ein Brunnen mit lebendigem Wasser[b] und Wasserläufe, die vom Libanon herabfließen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Quelle der Gärten“. Das hebräische Wort מַעְיָן kann eine Quelle oder ein Quellgebiet bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Lebendiges Wasser“ ist eine hebräische Bezeichnung für frisches, fließendes Wasser im Gegensatz zu stehendem Wasser.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „und vom Libanon fließendes Wasser“. Das hebräische Partizip hebt die Bewegung des Wassers hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעְיַן
  choice: Quelle
  rationale: Bezeichnet eine natürliche Quelle bzw. einen Quellort; „Quelle“ ist im Deutschen idiomatisch und passt zum Wasserbild.
- source_word: גַּנִּים
  choice: Gärten
  rationale: Der ausdrückliche Plural des Hebräischen wird bewahrt.
- source_word: בְּאֵר
  choice: Brunnen
  rationale: Das Substantiv bezeichnet gewöhnlich einen Brunnen; „Zisterne“ würde eher gespeichertes, stehendes Wasser nahelegen.
- source_word: מַיִם חַיִּים
  choice: lebendiges Wasser
  rationale: Die hebräische Wendung bezeichnet frisches, fließendes Wasser. Die wörtliche Bildsprache und ihre literarische Resonanz bleiben erhalten.
- source_word: וְנֹזְלִים
  choice: und Wasserläufe, die herabfließen
  rationale: Das substantivierte Partizip bezeichnet Fließendes bzw. herabrinnendes Wasser. „Wasserläufe“ ergänzt im Deutschen ein natürliches Bezugswort und wahrt den Plural sowie die Bewegung.
- source_word: מִן לְבָנוֹן
  choice: vom Libanon
  rationale: Gibt die geografische Herkunftsangabe knapp und unmittelbar wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe nominale Bildfolge des Hebräischen wird bewahrt; „Wasserläufe“ macht das substantivierte Partizip im Deutschen natürlich verständlich. „Herabfließen“ entspricht dem möglichen Bewegungsaspekt, ohne eine zusätzliche theologische Deutung einzutragen.
