    rationale: Das Wort meint nicht schlicht kinderlos, sondern der Kinder/Jungen beraubt bzw. verwaist/bereut. Die Hauptübersetzung „hat seine Jungen verloren“ trifft den Bildsinn besser als die bisherige Fußnotenglossierung.
