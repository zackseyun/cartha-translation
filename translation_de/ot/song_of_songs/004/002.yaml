  source_fidelity: Die Grundstruktur der Schafmetapher ist getroffen. „Frisch“ ist jedoch im Hebräischen nicht ausgedrückt, und „Schwemme“ bezeichnet im heutigen Deutsch vor allem eine Tränke bzw. Wasserstelle, nicht eindeutig das Waschen. Die Wendung שַׁכֻּלָה bezeichnet eine der Jungen beraubte bzw. bereute Mutter, nicht eine kinderlose.
  naturalness: „Vom Waschen heraufkommen“ ist modernes, verständliches Deutsch und bewahrt die Bewegungsrichtung. Die koordinierte Bildfolge mit Semikolon ist natürlicher als ein Doppelpunkt.
  terminology: „Mutterschafe“, „Zwillinge“ und „Jungen verloren“ erhalten das weibliche Schafbild und lösen die Metapher nicht vorschnell zu „kein Zahn fehlt“ auf. Die Anmerkung kann die implizierte Aussage vorsichtig erläutern.
