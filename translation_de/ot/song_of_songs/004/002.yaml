- from: Deine Zähne sind wie eine Herde frisch geschorener Mutterschafe, die aus der Schwemme heraufkommen:[a] Sie alle haben Zwillinge,[b] und keines von ihnen hat seine Jungen verloren.[c]
  to: Deine Zähne sind wie eine Herde geschorener Mutterschafe, die vom Waschen heraufkommen; sie alle tragen Zwillinge,[a] und keines von ihnen hat seine Jungen verloren.[b]
  rationale: Die Revision entfernt die nicht belegte Ergänzung „frisch“, ersetzt das missverständliche „Schwemme“ durch die genaue und idiomatische Angabe „vom Waschen“ und korrigiert die Erklärung von שַׁכֻּלָה. Die Metapher bleibt im Haupttext vollständig erhalten; die auf die Zähne bezogene Folgerung erscheint nur erläuternd in der Fußnote.
