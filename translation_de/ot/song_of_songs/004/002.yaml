base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/002.yaml
  text: Your teeth are like a flock of shorn ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
translation:
  language: de
  text: Deine Zähne sind wie eine Herde geschorener Mutterschafe, die vom Waschen heraufkommen; sie alle tragen Zwillinge,[a] und keines von ihnen hat seine Jungen verloren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild der Zwillinge deutet auf ein vollständiges, gleichmäßig gepaartes Gebiss.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „und keine der Jungen Beraubte ist unter ihnen“. Das Schafbild spielt darauf an, dass kein Zahn fehlt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁנַּיִךְ
  choice: deine Zähne
  rationale: Die unmittelbare, ungeschmückte Wiedergabe; der hebräische Text fügt keinen Vergleich mit Elfenbein hinzu.
- source_word: כְּעֵדֶר
  choice: wie eine Herde
  rationale: עֵדֶר bezeichnet eine Herde beziehungsweise Herdenverband, häufig von Kleinvieh; im Deutschen ist „Herde“ für Schafe die natürliche Bezeichnung.
- source_word: הַקְּצוּבוֹת
  choice: frisch geschorener Mutterschafe
  rationale: Das feminine Partizip bezeichnet hier wahrscheinlich geschorene Tiere. „Mutterschafe“ macht die durch die folgenden femininen Formen und die Erwähnung von Zwillingen fortgeführte Bildwelt verständlich.
- source_word: שֶׁעָלוּ מִן הָרַחְצָה
  choice: die aus der Schwemme heraufkommen
  rationale: „Schwemme“ bezeichnet im Deutschen einen Ort beziehungsweise Vorgang, an dem Tiere gewaschen werden, und bewahrt das konkrete pastorale Bild sowie die Bewegung des Heraufkommens.
- source_word: שֶׁכֻּלָּם מַתְאִימוֹת
  choice: Sie alle haben Zwillinge
  rationale: מַתְאִימוֹת bezeichnet paarweises beziehungsweise zwillingsweises Auftreten. Die Formulierung wahrt das Schafbild und lässt zugleich die regelmäßig gepaarten Zahnreihen erkennen.
- source_word: וְשַׁכֻּלָה אֵין בָּהֶם
  choice: und keines von ihnen hat seine Jungen verloren
  rationale: שַׁכֻּלָה bedeutet „der Jungen beziehungsweise Kinder beraubt, verwaist“. Die Übersetzung hält am Bild der Mutterschafe fest, statt die Aussage direkt als „kein Zahn fehlt“ aufzulösen.
