base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/004.yaml
  text: Your neck is like the tower of David[a], built in rows of stone; a thousand shields hang on it[b], all the small shields of the warriors.
translation:
  language: de
  text: Dein Hals gleicht dem Turm Davids, in Steinlagen erbaut[a]. Tausend Schilde hängen daran, all die Schilde der Krieger[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für Waffenkammern erbaut“, „mit Zinnen erbaut“ oder „in Schichten erbaut“. Das seltene hebräische Wort תַּלְפִּיּוֹת ist in seiner genauen Bedeutung unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische verwendet hier zwei verschiedene Wörter: מָגֵן („Schild“) und שֶׁלֶט (häufig ebenfalls „Schild“). Worin genau sich die bezeichneten Gegenstände unterschieden, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמִגְדַּל דָּוִיד
  choice: gleicht dem Turm Davids
  rationale: Das Präfix כ markiert einen Vergleich; die deutsche Formulierung bewahrt das architektonische Bild und gibt die Konstruktion mit dem Eigennamen bestimmt wieder.
- source_word: צַוָּארֵךְ
  choice: dein Hals
  rationale: Direkte, natürliche Wiedergabe des Körperbildes im Liebesgedicht.
- source_word: בָּנוּי לְתַלְפִּיּוֹת
  choice: in Steinlagen erbaut
  rationale: בָּנוּי bezeichnet das Erbautsein. Das seltene לְתַלְפִּיּוֹת ist unsicher; „in Steinlagen“ passt zum Turmbild, ohne die ebenfalls vorgeschlagene militärische Deutung als Zeughaus zur Gewissheit zu erheben.
- source_word: אֶלֶף הַמָּגֵן
  choice: tausend Schilde
  rationale: Der Singular mit der Zahl wird im Deutschen idiomatisch als pluralische Mengenangabe wiedergegeben.
- source_word: תָּלוּי עָלָיו
  choice: hängen daran
  rationale: Das Partizip zeichnet einen gegenwärtigen sichtbaren Zustand. „Daran“ lässt den Bezug innerhalb des zusammengehörigen Bildes natürlich offen.
- source_word: כֹּל שִׁלְטֵי הַגִּבּוֹרִים
  choice: all die Kampfschilde der Krieger
  rationale: „Kampfschilde“ unterscheidet שִׁלְטֵי sprachlich von מָגֵן, ohne eine im Hebräischen nicht ausdrücklich angegebene Größe festzulegen. גִּבּוֹרִים bezeichnet hier kampfstarke Männer und wird zeitgemäß mit „Krieger“ wiedergegeben.
