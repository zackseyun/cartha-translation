  text: מַה יָּפ֥וּ דֹדַ֖יִ/ךְ אֲחֹתִ֣/י כַלָּ֑ה מַה טֹּ֤בוּ דֹדַ֨יִ/ךְ֙ מִ/יַּ֔יִן וְ/רֵ֥יחַ שְׁמָנַ֖יִ/ךְ מִ/כָּל בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/010.yaml
  text: How beautiful your love is[a], my sister, my bride! How much better your love is than wine[b], and the fragrance of your oils than all spices!
translation:
  language: de
  text: Wie schön ist deine Liebe[a], meine Schwester, meine Braut! Wie viel besser sind deine Liebe als Wein und der Duft deiner Öle[b] als alle Gewürze!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Liebkosungen“; das hebräische Wort kann Liebe bezeichnen, die sich in körperlicher Zuneigung ausdrückt.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind wahrscheinlich parfümierte Öle oder wohlriechende Salben.
    reason: cultural_note
lexical_decisions:
- source_word: מַה יָּפוּ
  choice: Wie schön ist
  rationale: Das ausrufende מַה drückt hier Bewunderung aus; zusammen mit der formal pluralischen Wendung wird es im Deutschen natürlich mit dem singularischen Sammelbegriff „Liebe“ konstruiert.
- source_word: דֹדַיִךְ
  choice: deine Liebe
  rationale: דּוֹדִים kann im Hohelied Liebe sowie ihre körperlichen Ausdrucksformen oder Liebkosungen bezeichnen. „Liebe“ wahrt die poetische Weite; die Alternative wird in einer Fußnote genannt.
- source_word: אֲחֹתִי כַלָּה
  choice: meine Schwester, meine Braut
  rationale: Beide Anreden bleiben ausdrücklich erhalten. „Schwester“ ist hier eine poetische Anrede der Geliebten und wird nicht zu einem Kompositum verschmolzen.
- source_word: מַה טֹּבוּ ... מִיַּיִן
  choice: Wie viel besser ist ... als Wein
  rationale: מַה ist erneut ausrufend, während מִן den Vergleich bezeichnet. „Wie viel besser ... als“ gibt beides idiomatisch wieder.
- source_word: וְרֵיחַ
  choice: und der Duft
  rationale: רֵיחַ bezeichnet Geruch oder Duft; der positive poetische Kontext spricht für „Duft“.
- source_word: שְׁמָנַיִךְ
  choice: deiner Öle
  rationale: Die konkrete Bildsprache des Hebräischen bleibt erhalten; gemeint sind im Kontext wahrscheinlich wohlriechende, parfümierte Öle oder Salben.
- source_word: מִכָּל בְּשָׂמִים
  choice: als alle Gewürze
  rationale: בְּשָׂמִים bezeichnet aromatische Stoffe beziehungsweise Gewürze. Der Vergleich mit מִן wird durch „als“ ausgedrückt.
