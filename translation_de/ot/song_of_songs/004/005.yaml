translation:
  language: de
  text: Deine beiden Brüste sind wie zwei junge Gazellen, Zwillinge einer Gazelle[a], die zwischen den Lilien weiden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer Hirschkuh“. Das hebräische Wort kann allgemein ein weibliches hirschartiges Tier bezeichnen; „Gazelle“ bewahrt die wiederkehrende Bildsprache des Hohelieds.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי שָׁדַיִךְ
  choice: deine beiden Brüste
  rationale: Die ausdrückliche Zweizahl wird beibehalten; „beiden“ klingt im Deutschen natürlich und bereitet den Vergleich mit den zwei Kitzen vor.
- source_word: כִּשְׁנֵי
  choice: sind wie zwei
  rationale: Die Vergleichspartikel כ wird mit „wie“ wiedergegeben; in dem hebräischen Nominalsatz wird das im Deutschen erforderliche „sind“ ergänzt.
- source_word: עֳפָרִים
  choice: Kitze
  rationale: Das Wort bezeichnet Jungtiere hirsch- beziehungsweise gazellenartiger Tiere. „Kitze“ ist knapp, idiomatisch und bewahrt das zarte Bild.
- source_word: תְּאוֹמֵי
  choice: die Zwillinge
  rationale: Die Konstruktform bezeichnet Zwillinge und unterstreicht die Gleichheit des Tierpaares. Der bestimmte Artikel bindet die Apposition im Deutschen natürlich an „zwei Kitze“ an.
- source_word: צְבִיָּה
  choice: einer Gazelle
  rationale: Das feminine Substantiv bezeichnet hier plausibel eine weibliche Gazelle; „Gazelle“ entspricht zudem der wiederkehrenden Bildwelt des Hohelieds.
- source_word: הָרוֹעִים
  choice: die … weiden
  rationale: Das Partizip von רעה beschreibt fressende beziehungsweise weidende Tiere. Der Relativsatz gibt den Bezug auf die Kitze im Deutschen klar und bildhaft wieder.
- source_word: בַּשּׁוֹשַׁנִּים
  choice: zwischen den Lilien
  rationale: שׁוֹשַׁנִּים wird traditionsgemäß und im Kontext plausibel mit „Lilien“ wiedergegeben; „zwischen“ bezeichnet natürlich den Ort, an dem die Tiere weiden.
