base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/008.yaml
  text: Come with me from Lebanon[a], my bride; with me from Lebanon, come. Look from the summit of Amanah, from the summit of Senir and Hermon, from lions’ dens[b], from mountains of leopards.
translation:
  language: de
  text: 'Komm mit mir vom Libanon, meine Braut,

    komm mit mir vom Libanon!

    Blicke[a] vom Gipfel des Amana,

    vom Gipfel des Senir[b] und des Hermon,

    von den Höhlen der Löwen,

    von den Bergen der Leoparden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Steig herab“. Das seltene hebräische Verb ist schwer zu deuten. Es kann den Blick von den Höhen bezeichnen; im Zusammenhang kann aber auch eine Bewegung von dort herab gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: Senir ist ein alter Name für einen Teil des Hermongebirges.
    reason: cultural_note
lexical_decisions:
- source_word: אִתִּי מִלְּבָנוֹן
  choice: mit mir vom Libanon
  rationale: אִתִּי bedeutet „mit mir“, während מִן in מִלְּבָנוֹן den Ausgangspunkt bezeichnet. Die Wiederholung bleibt erhalten und prägt den einladenden, poetischen Ruf.
- source_word: כַּלָּה
  choice: meine Braut
  rationale: Das Substantiv bezeichnet hier die Geliebte als Braut. Im deutschen Vokativ gibt „meine Braut“ die relationale Anrede natürlich wieder.
- source_word: תָּבוֹאִי
  choice: Komm
  rationale: Die Verbform kann im Kontext als Aufforderung verstanden werden. Der Imperativ gibt den einladenden Ruf idiomatisch wieder, ohne eine bloße Zukunftsaussage nahezulegen.
- source_word: תָּשׁוּרִי
  choice: Blicke herab
  rationale: Das seltene Verb wird am ehesten als Aufforderung zum Schauen von einer Höhe verstanden. „Blicke herab“ verbindet diese Bedeutung mit den folgenden Herkunftsangaben; die mögliche Bewegungsbedeutung wird in einer Fußnote bewahrt.
- source_word: מֵרֹאשׁ
  choice: vom Gipfel
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“, bezeichnet bei einem Berg jedoch idiomatisch dessen Gipfel.
- source_word: אֲמָנָה
  choice: Amana
  rationale: Der geografische Eigenname wird transliteriert.
- source_word: שְׂנִיר
  choice: Senir
  rationale: Der historische geografische Eigenname wird transliteriert.
- source_word: חֶרְמוֹן
  choice: Hermon
  rationale: Der geografische Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: מִמְּעֹנוֹת אֲרָיוֹת
  choice: von den Höhlen der Löwen
  rationale: מְעוֹנוֹת bezeichnet Wohnstätten oder Schlupfwinkel. „Höhlen der Löwen“ ist verständlich, poetisch und bewahrt das Bild eines gefährlichen Aufenthaltsorts.
- source_word: מֵהַרְרֵי נְמֵרִים
  choice: von den Bergen der Leoparden
  rationale: Die Genitivfügung bildet die hebräische Konstruktverbindung natürlich ab und bewahrt die Parallele zu den Löwen.
theological_decisions:
- issue: Bewegung oder Blick in תָּשׁוּרִי
  choice: Das Verb wird im Haupttext als Aufforderung zum Herabblicken wiedergegeben.
  alternative: „Steig herab“ oder „Komm herab“ als Aufforderung, die gefährliche Bergregion zu verlassen.
  rationale: Die lexikalisch naheliegende Bedeutung des seltenen Verbs betrifft das Schauen; zugleich kann der Kontext eine Bewegung von den Bergen weg nahelegen. Die Übersetzung entscheidet diese Spannung nicht stillschweigend, sondern nennt die Alternative in der Fußnote.
translation_notes:
  register: Moderne, gehobene Standardsprache mit knappen poetischen Zeilen. Die anaphorische Wiederholung von „komm mit mir vom Libanon“ und die parallelen Orts- und Tierbilder bleiben erhalten. Eigennamen werden in geläufiger deutscher Form beziehungsweise transparent transliteriert.
