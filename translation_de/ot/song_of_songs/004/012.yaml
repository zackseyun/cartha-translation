id: SNG.4.12
reference: Song of Songs 4:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גַּ֥ן נָע֖וּל אֲחֹתִ֣/י כַלָּ֑ה גַּ֥ל נָע֖וּל מַעְיָ֥ן חָתֽוּם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/012.yaml
  text: A locked garden is my sister[a], my bride; a locked spring[b], a sealed fountain.
translation:
  language: de
  text: Ein verschlossener[a] Garten ist meine Schwester, meine Braut; ein verschlossener Quell[b], eine versiegelte Quelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »verriegelt«; so auch beim zweiten Vorkommen von »verschlossen«.
    reason: lexical_alternative
  - marker: b
    text: Das hier mit »Quell« wiedergegebene hebräische Wort kann andernorts »Haufen« oder »Welle« bedeuten; die Parallele zu »Quelle« spricht hier für die Bedeutung einer Wasserquelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּן
  choice: Garten
  rationale: Die Grundbedeutung ist »Garten«. Das folgende Partizip נָעוּל bringt den Gedanken des Verschlossenseins zum Ausdruck, sodass dieser nicht schon in das Substantiv aufgenommen werden muss.
- source_word: נָעוּל
  choice: verschlossen
  rationale: Das passive Partizip bezeichnet etwas, das geschlossen oder verschlossen ist. »Verschlossen« passt im Deutschen sowohl zum Garten als auch zum Quell und gibt die hebräische Wiederholung wieder.
- source_word: אֲחֹתִי
  choice: meine Schwester
  rationale: Im Hohelied ist dies eine vertraute, innige Anrede. Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten, ohne sie deutend zu umschreiben.
- source_word: כַלָּה
  choice: meine Braut
  rationale: Das Substantiv bedeutet »Braut«. Das ergänzte Possessivpronomen ergibt zusammen mit »meine Schwester« eine natürliche deutsche Anreihung von Anreden.
- source_word: גַּל
  choice: Quell
  rationale: Obwohl das Wort andernorts »Haufen« oder »Welle« bedeuten kann, spricht die Parallele zu מַעְיָן hier deutlich für eine Wasserquelle. »Quell« bewahrt die poetische Bildsprache und unterscheidet sich sprachlich von der folgenden »Quelle«.
- source_word: מַעְיָן
  choice: Quelle
  rationale: Das Wort bezeichnet den Ursprung oder Austritt von Wasser. »Quelle« ist die direkte, natürliche deutsche Wiedergabe und steht in poetischer Parallele zu »Quell«.
- source_word: חָתוּם
  choice: versiegelt
  rationale: Das passive Partizip bedeutet »versiegelt« und bewahrt neben »verschlossen« das eigene Bild einer gesicherten, unzugänglichen Wasserquelle.
theological_decisions: []
translation_notes:
  register: Moderne, gehobene poetische Standardsprache. Die knappe hebräische Bildfolge und die Wiederholung von »verschlossen« bleiben erhalten; »Quell« ist bewusst poetisch, aber weiterhin allgemein verständlich.
