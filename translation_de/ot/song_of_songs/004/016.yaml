base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/016.yaml
  text: Awake[a], north wind, and come, south wind! Blow on my garden, so that its spices may flow[c][b]. Let my beloved come into his garden and eat its choice fruits.
translation:
  language: de
  text: Wach auf, Nordwind, und komm, Südwind! Durchwehe meinen Garten, damit seine Düfte ausströmen.[a] Mein Geliebter komme in seinen Garten und esse seine köstlichen Früchte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit seine Gewürze fließen“ bzw. „damit sein Wohlgeruch ausströmt“. Das hebräische Wort kann aromatische Stoffe oder ihren Duft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der Wechsel von „meinen Garten“ zu „seinen Garten“ steht so im hebräischen Text und unterstreicht in der Liebesdichtung die gegenseitige Zugehörigkeit.
    reason: cross_reference
lexical_decisions:
- source_word: ע֤וּרִי צָפוֹן֙
  choice: Wach auf, Nordwind
  rationale: Der feminine Singularimperativ personifiziert den Norden; „Nordwind“ macht die im Kontext gemeinte Naturkraft im Deutschen ausdrücklich.
- source_word: וּב֣וֹאִי תֵימָ֔ן
  choice: und komm, Südwind
  rationale: Bewahrt den einfachen Imperativ „komm“ und die parallele poetische Anrede des Südens als Wind.
- source_word: הָפִ֥יחִי גַנִּ֖י
  choice: Durchwehe meinen Garten
  rationale: Gibt das Blasen des Windes über bzw. durch den Garten natürlich und knapp wieder, ohne die Bildsprache zu erklären.
- source_word: יִזְּל֣וּ בְשָׂמָ֑יו
  choice: damit seine Düfte ausströmen
  rationale: Das Verb bezeichnet Fließen oder Träufeln; bei aromatischen Stoffen ist „ausströmen“ im Deutschen idiomatisch. בְּשָׂמִים kann die Duftstoffe oder den von ihnen ausgehenden Wohlgeruch bezeichnen.
- source_word: יָבֹ֤א דוֹדִי֙ לְגַנּ֔וֹ
  choice: Mein Geliebter komme in seinen Garten
  rationale: Der deutsche Konjunktiv I bewahrt den Wunschcharakter. Der Wechsel von „meinen“ zu „seinen Garten“ bleibt entsprechend dem Hebräischen erhalten.
- source_word: וְיֹאכַ֖ל פְּרִ֥י מְגָדָֽיו
  choice: und esse von seinen köstlichen Früchten
  rationale: „Essen“ erhält das konkrete sinnliche Bild. „Köstlich“ gibt die begehrenswerten, erlesenen Früchte wieder, ohne einen Superlativ einzuführen.
theological_decisions:
- issue: Erotische Gartenmetaphorik und Wechsel der Besitzanzeige
  choice: Die sinnliche Bildsprache sowie der Wechsel von „meinen Garten“ zu „seinen Garten“ werden bewahrt.
  alternative: Die Gartenbilder ausdrücklich allegorisch deuten oder den Besitzwechsel stilistisch einebnen.
  rationale: Der hebräische Text spricht in intimer poetischer Bildsprache, ohne selbst eine bestimmte Allegorie auszuformulieren. Die Übersetzung sollte diese Spannung weder abschwächen noch konfessionell festlegen.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die direkte Anrede der Winde und die sinnliche Gartenmetaphorik bleiben lebendig; der Konjunktiv „komme“/„esse“ bildet den Wunschcharakter knapp ab.
