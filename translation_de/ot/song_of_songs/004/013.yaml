  text: Deine Schösslinge sind ein Granatapfelgarten mit erlesenen Früchten, Henna mit Narden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלָחַיִךְ
  choice: Was dir entsprießt
  rationale: Das seltene Bild bezeichnet das, was von der Geliebten ausgeht oder an ihr wächst. Die offene Formulierung bewahrt die poetische und möglicherweise körperliche Mehrdeutigkeit besser als das im Deutschen unnatürliche „deine Schösslinge“.
- source_word: פַּרְדֵּס
  choice: Garten
  rationale: Das persische Lehnwort bezeichnet eine eingefriedete Park- oder Gartenanlage. „Garten“ ist hier natürlich und vermeidet die im Deutschen stärker jenseitig geprägte Nebenbedeutung von „Paradies“.
- source_word: רִמּוֹנִים
  choice: Granatapfelbäume
  rationale: Der Plural kann die Früchte oder die Pflanzen bezeichnen; im Gartenbild ist die Wiedergabe als Bäume im Deutschen anschaulich und sachgerecht.
- source_word: פְּרִי מְגָדִים
  choice: köstlichen Früchten
  rationale: מְגָדִים bezeichnet Kostbarkeiten beziehungsweise erlesene, begehrenswerte Erzeugnisse. „Köstlich“ verbindet Wert und sinnliche Anziehung.
- source_word: כְּפָרִים
  choice: Hennablüten
  rationale: Der Plural bezeichnet Hennapflanzen beziehungsweise ihre duftenden Blütentrauben. „Hennablüten“ passt zum Duft- und Gartenkontext.
- source_word: נְרָדִים
  choice: Narden
  rationale: Der ungewöhnliche Plural wird als mehrere Narden beziehungsweise Nardenpflanzen bewahrt; die Pluralform entspricht dem hebräischen Text.
theological_decisions:
- issue: Sinnliche Bildsprache der Geliebten
  choice: Die Garten- und Pflanzenmetaphorik bleibt poetisch offen.
  alternative: Die einzelnen Bilder ausdrücklich anatomisch oder ausschließlich botanisch deuten.
  rationale: Der hebräische Vers verbindet Körper, Fruchtbarkeit, Duft und Garten, ohne die Entsprechungen vollständig festzulegen. Eine eindeutige Ausdeutung würde die genuine Mehrdeutigkeit beseitigen.
translation_notes:
  register: Moderne, würdige Liebeslyrik mit fließendem Satzbau. Die Formulierung wahrt die sinnliche Mehrdeutigkeit des Hebräischen, ohne anatomische Deutungen in den Haupttext einzutragen.
