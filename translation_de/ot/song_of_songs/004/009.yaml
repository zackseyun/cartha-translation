base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/009.yaml
  text: You have captured my heart[a], my sister, my bride; you have captured my heart with one glance of your eyes[c][b], with one jewel of your necklace.
translation:
  language: de
  text: Du hast mir das Herz geraubt[a], meine Schwester, meine Braut; du hast mir das Herz geraubt mit einem einzigen Blick aus deinen Augen[b], mit einem einzigen Schmuckstück deines Halsschmucks[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Du hast mein Herz überwältigt“ oder traditionell „Du hast mein Herz entzückt“. Das seltene hebräische Verb beschreibt, dass die Geliebte das Herz des Sprechers machtvoll bewegt oder überwältigt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „mit einem von deinen Augen“. Gemeint ist wahrscheinlich ein einziger Blick.'
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Formulierung ist ungewöhnlich und kann auch als „mit einer Kette an deinem Hals“, „mit einem Glied deiner Halskette“ oder „mit einem deiner Halsgeschmeide“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבַּבְתִּנִי
  choice: du hast mir das Herz geraubt
  rationale: Das seltene Verb לבב bezeichnet hier offenbar eine starke Wirkung der Geliebten auf das Herz des Sprechers. Die deutsche Wendung ist natürlich und poetisch, ohne die Intensität abzuschwächen; die Wiederholung des hebräischen Satzteils bleibt erhalten.
- source_word: אֲחֹתִי
  choice: meine Schwester
  rationale: Die wörtliche Wiedergabe bewahrt die für das Hohelied charakteristische vertrauliche Anrede. Im poetischen Zusammenhang ist sie eine intime Bezeichnung und muss nicht als Aussage über biologische Verwandtschaft erklärt werden.
- source_word: כַלָּה
  choice: meine Braut
  rationale: Die direkte Anrede und der Brautbezug werden knapp und wörtlich wiedergegeben.
- source_word: בְאֶחָד מֵעֵינַיִךְ
  choice: mit einem einzigen Blick deiner Augen
  rationale: Formal steht etwa „mit einem von deinen Augen“. Gemeint ist im Zusammenhang am ehesten ein einzelner Blick; diese Wiedergabe vermeidet im Deutschen den missverständlichen Eindruck, nur eines der beiden Augen sei gemeint.
- source_word: בְּאַחַד עֲנָק מִצַּוְּרֹנָיִךְ
  choice: mit einem einzigen Schmuckstück an deinem Hals
  rationale: עֲנָק bezeichnet Hals- oder Kettenschmuck; die ungewöhnliche Verbindung mit מִצַּוְּרֹנָיִךְ lässt offen, ob ein einzelnes Schmuckstück, ein Kettenglied oder eine Halskette gemeint ist. Die Hauptfassung gibt das Bild natürlich wieder, ohne eine bestimmte Schmuckform festzulegen.
