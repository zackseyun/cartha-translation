base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/001.yaml
  text: Look[a], you are beautiful, my darling; look, you are beautiful. Your eyes are doves behind your veil[b]. Your hair is like a flock of goats streaming down from Mount Gilead.
translation:
  language: de
  text: Sieh nur, du bist schön, meine Geliebte, sieh nur, du bist schön! Deine Augen sind Tauben hinter deinem Schleier.[a] Dein Haar gleicht einer Herde Ziegen, die vom Berg Gilead herabströmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch deinen Schleier“. Das mit „Schleier“ übersetzte hebräische Wort kann auch „Locken“ oder „Zopf“ bedeuten; im Zusammenhang wird es häufig als eine Bedeckung verstanden, hinter der die Augen nur teilweise sichtbar sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: Sieh nur, du bist
  rationale: Die deiktisch-ausrufende Partikel wird in lebendigem, heutigem Deutsch wiedergegeben; „siehe“ wäre unnötig altertümlich.
- source_word: יָפָה
  choice: schön
  rationale: Die direkte und natürliche deutsche Entsprechung bewahrt den schlichten Lobpreis ihrer Schönheit.
- source_word: רַעְיָתִי
  choice: meine Geliebte
  rationale: Die feminine vertrauliche Anrede bezeichnet die geliebte Frau; „Geliebte“ verbindet Zuneigung mit poetischer Würde.
- source_word: עֵינַיִךְ יוֹנִים
  choice: Deine Augen sind Tauben
  rationale: Die verblos-appositionale hebräische Wendung setzt Augen und Tauben unmittelbar gleich. Die direkte Metapher wird nicht durch ein ergänztes „wie“ abgeschwächt.
- source_word: מִבַּעַד לְצַמָּתֵךְ
  choice: hinter deinem Schleier
  rationale: Die Präposition bezeichnet den Blick hinter oder durch eine teilweise verhüllende Bedeckung. „Hinter“ ergibt mit „Schleier“ eine natürliche Formulierung; die lexikalische Unsicherheit des Nomens wird in der Fußnote bewahrt.
- source_word: שַׂעְרֵךְ
  choice: Dein Haar
  rationale: Schlichte, idiomatische Wiedergabe des hebräischen Nomens mit Possessivsuffix.
- source_word: כְּעֵדֶר הָעִזִּים
  choice: gleicht einer Herde Ziegen
  rationale: „Herde“ ist im Deutschen für Ziegen idiomatisch und bewahrt das pastorale Vergleichsbild.
- source_word: שֶׁגָּלְשׁוּ
  choice: die ... herabströmt
  rationale: Das Verb beschreibt eine gleitende beziehungsweise fließende Abwärtsbewegung. „Herabströmt“ lässt zugleich die Ziegenherde und das herabfallende Haar anschaulich werden.
- source_word: מֵהַר גִּלְעָד
  choice: vom Berg Gilead
  rationale: Die Formulierung wahrt die singularische geografische Bezeichnung, ohne die genaue Topografie näher festzulegen.
