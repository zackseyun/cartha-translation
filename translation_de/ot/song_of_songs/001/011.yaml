  text: תּוֹרֵ֤י זָהָב֙ נַעֲשֶׂה לָּ֔/ךְ עִ֖ם נְקֻדּ֥וֹת הַ/כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/011.yaml
  text: We will make for you ornaments of gold[b][a], with studs of silver.
translation:
  language: de
  text: Wir werden dir goldenen Schmuck[a] mit silbernen Zierpunkten[b] anfertigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „goldene Ketten“, „goldene Reihen“ oder „goldene Reife“; welche Art von Schmuck das hebräische Wort genau bezeichnet, ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Silberperlen“, „Silberplättchen“ oder „silberne Verzierungen“; gemeint sind kleine dekorative Elemente aus Silber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרֵי
  choice: Schmuck
  rationale: Der Ausdruck bezeichnet hier offenbar goldene Schmuckelemente, doch ihre genaue Form ist unsicher. Die allgemeine Wiedergabe „Schmuck“ vermeidet eine unbelegte Festlegung auf Ketten, Reihen oder Reife.
- source_word: זָהָב
  choice: goldenen
  rationale: Die übliche Bezeichnung des Materials wird im Deutschen attributiv wiedergegeben.
- source_word: נַעֲשֶׂה
  choice: wir werden … anfertigen
  rationale: Das Qal-Imperfekt der 1. Person Plural wird im Zusammenhang als Zusage verstanden. „Anfertigen“ passt zum Herstellen von Schmuck und ist präziser als das allgemeinere „machen“.
- source_word: לָּךְ
  choice: dir
  rationale: Die Präposition mit Suffix der 2. Person Singular feminin bezeichnet die Empfängerin, für die der Schmuck angefertigt wird.
- source_word: עִם
  choice: mit
  rationale: Die Präposition verbindet den goldenen Schmuck mit seinen silbernen Schmuckelementen.
- source_word: נְקֻדּוֹת
  choice: Zierpunkten
  rationale: Das Wort bezeichnet kleine punkt- oder fleckenartige Elemente. „Zierpunkte“ bewahrt dieses Bild und passt zugleich zum Schmuckkontext, ohne ihre genaue technische Ausführung festzulegen.
- source_word: הַכָּסֶף
  choice: silbernen
  rationale: Die übliche Materialbezeichnung wird im Deutschen attributiv auf die Zierpunkte bezogen.
