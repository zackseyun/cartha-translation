  text: Your cheeks are lovely with ornaments[b][a], your neck with strings of jewels.
translation:
  language: de
  text: Deine Wangen sind schön mit Schmuckreihen[a], dein Hals mit Schmuckketten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Reihen“; das hebräische Wort meint wahrscheinlich Reihen oder Anordnungen von Schmuck. Möglich ist auch die Bezeichnung einer bestimmten Schmuckform.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit aufgefädeltem Schmuck“, „mit Perlen“ oder „mit Halsketten“; das hebräische Wort bezeichnet aneinandergereihte Schmuckstücke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאווּ
  choice: sind schön
  rationale: Das Verb bezeichnet Schönheit oder ansprechende Wirkung. „Sind schön“ ist im modernen Deutschen natürlich und bewahrt die prädikative Form des Hebräischen.
- source_word: לְחָיַיִךְ
  choice: deine Wangen
  rationale: לְחָיַיִךְ bezeichnet hier im poetischen Lob am natürlichsten die Wangen, auch wenn das Wort grundsätzlich den Wangen- oder Kieferbereich meinen kann.
- source_word: בַּתֹּרִים
  choice: mit Schmuckreihen
  rationale: Im Parallelismus mit dem Halsschmuck bezeichnet der Ausdruck wahrscheinlich reihenförmig angeordneten Schmuck. „Schmuckreihen“ gibt sowohl die Anordnung als auch den im Kontext erschlossenen Gegenstand wieder, ohne eine bestimmte Schmuckform festzulegen.
- source_word: צַוָּארֵךְ
  choice: dein Hals
  rationale: Direkte und natürliche Entsprechung des anatomischen Begriffs.
- source_word: בַּחֲרוּזִים
  choice: mit Perlenketten
  rationale: Das Wort bezeichnet aufgefädelte Schmuckstücke, wahrscheinlich Perlen oder vergleichbare Zierelemente. „Perlenketten“ ist anschaulich und idiomatisch; die genauere materielle Beschaffenheit bleibt in der Fußnote offen.
