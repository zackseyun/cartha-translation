base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/007.yaml
  text: Tell me[a], you whom my soul loves, where you pasture your flock, where you make it lie down at noon; for why should I be like one who veils herself beside the flocks of your companions?
translation:
  language: de
  text: 'Sag mir, du, den meine Seele liebt: Wo weidest du deine Herde, wo lässt du sie am Mittag lagern? Warum sollte ich denn wie eine Verschleierte[a] bei den Herden deiner Gefährten sein?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie eine Umherwandernde“. Der hebräische Ausdruck kann eine Frau bezeichnen, die sich verhüllt, oder im Zusammenhang als eine Frau gedeutet werden, die auf der Suche nach ihrem Geliebten umherzieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: Sag mir
  rationale: Der Imperativ von נגד mit indirektem Objekt der 1. Person Singular wird direkt und natürlich wiedergegeben.
- source_word: שֶׁאָהֲבָה נַפְשִׁי
  choice: du, den meine Seele liebt
  rationale: Die hebräische Rede von der נֶפֶשׁ als Seele, Selbst oder Leben bleibt als poetisch intensive Wendung erhalten; das maskuline Bezugswort ergibt sich aus den folgenden maskulinen Formen.
- source_word: אֵיכָה
  choice: wo
  rationale: Im Zusammenhang mit Weiden und Lagern fragt das Wort nach dem Ort; „wo“ gibt dies im Deutschen knapp und idiomatisch wieder.
- source_word: תִרְעֶה
  choice: du deine Herde weidest
  rationale: רעה bezeichnet das Weiden oder Hüten. Die im Hebräischen nicht ausdrücklich genannte Herde wird für verständliches Deutsch aus dem Hirtenbild ergänzt.
- source_word: תַּרְבִּיץ
  choice: du sie lagern lässt
  rationale: 'Der Hifil von רבץ hat kausative Bedeutung: jemanden oder etwas sich lagern beziehungsweise ruhen lassen. „Sie“ nimmt die ergänzte kollektive „Herde“ auf.'
- source_word: בַּצָּהֳרָיִם
  choice: am Mittag
  rationale: Dies ist die natürliche deutsche Wiedergabe der Zeitangabe.
- source_word: שַׁלָּמָה אֶהְיֶה
  choice: Denn warum sollte ich … sein?
  rationale: Die rhetorische Frage begründet die vorausgehende Bitte; „denn“ wahrt diesen Zusammenhang.
- source_word: כְּעֹטְיָה
  choice: wie eine Verschleierte
  rationale: Die Form wird am naheliegendsten von עטה, „sich bedecken, sich verhüllen“, hergeleitet. Das substantivierte deutsche Partizip wahrt die feminine Form und die Bildsprache.
- source_word: עַל עֶדְרֵי חֲבֵרֶיךָ
  choice: bei den Herden deiner Gefährten
  rationale: עַל bezeichnet hier räumliche Nähe. „Gefährten“ gibt חֲבֵרִים relational wieder, ohne die Art ihrer Verbindung näher festzulegen.
theological_decisions: []
translation_notes:
  register: Moderne, poetisch-würdevolle Standardsprache. Die Parallelität der beiden Ortsfragen und die körperlich-seelische Liebessprache des Hebräischen bleiben erhalten. Ergänzungen, die für natürliches Deutsch nötig sind, beschränken sich auf „deine Herde“ und das darauf rückverweisende „sie“.
