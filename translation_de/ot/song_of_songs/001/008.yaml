base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/008.yaml
  text: If you do not know[a], most beautiful among women, go out for yourself in the tracks of the flock[b], and pasture your young goats beside the shepherds’ tents.
translation:
  language: de
  text: Wenn du es nicht weißt, Schönste unter den Frauen, dann geh hinaus, den Spuren der Herde nach[a], und weide deine Zicklein bei den Zelten der Hirten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in den Spuren der Herde“; möglich ist auch: „hinter der Herde her“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא תֵדְעִי
  choice: Wenn du es nicht weißt
  rationale: Die reale Bedingung mit אִם und לֹא sowie die feminine Verbform werden direkt und im Deutschen idiomatisch wiedergegeben. ידע bedeutet hier, den Weg oder das richtige Vorgehen zu kennen.
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: Schönste unter den Frauen
  rationale: Adjektiv plus בְּ innerhalb einer Vergleichsgruppe hat hier superlativischen Sinn. Die Formulierung bewahrt zugleich die direkte Anrede.
- source_word: צְאִי לָךְ
  choice: dann geh hinaus
  rationale: צְאִי ist ein femininer Imperativ mit der Bedeutung „geh hinaus“. Das ethische beziehungsweise reflexive לָךְ verstärkt die persönliche Beteiligung, lässt sich im Deutschen hier jedoch nicht natürlich wörtlich wiedergeben; das ausdrücklich gesetzte „du“ im vorausgehenden Satz und der Imperativ tragen den persönlichen Bezug.
- source_word: בְּעִקְבֵי הַצֹּאן
  choice: den Spuren der Herde nach
  rationale: עִקְבֵי bezeichnet Fersen, Fußspuren oder eine Spur. Die Wendung erhält das konkrete Hirtenbild und klingt zugleich natürlich deutsch.
- source_word: וּרְעִי
  choice: und weide
  rationale: רעה im Qal bezeichnet hier das Hüten beziehungsweise Weidenlassen von Tieren. „Weide“ ist im pastoralen Zusammenhang präzise und knapp.
- source_word: גְּדִיֹּתַיִךְ
  choice: deine Zicklein
  rationale: Das feminine Pluralnomen bezeichnet junge Ziegen; „Zicklein“ ist im modernen Deutschen eindeutig und erhält die Verkleinerungs- beziehungsweise Jungtierbedeutung.
- source_word: עַל מִשְׁכְּנוֹת הָרֹעִים
  choice: bei den Zelten der Hirten
  rationale: מִשְׁכְּנוֹת sind Wohnstätten und im Hirtenmilieu naheliegend Zelte. עַל bezeichnet hier räumliche Nähe und wird idiomatisch mit „bei“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit poetisch-würdigem Ton. Die Anrede bleibt knapp und bildhaft; die pastoralen Einzelheiten werden konkret wiedergegeben. Die Identität der sprechenden Person oder Gruppe wird nicht ergänzt, da der hebräische Vers sie nicht ausdrücklich nennt.
