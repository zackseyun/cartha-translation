base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/016.yaml
  text: Look[a], you are beautiful, my beloved—indeed, pleasant! Indeed, our couch is luxuriant.
translation:
  language: de
  text: Sieh, du bist schön, mein Geliebter, ja, lieblich! Ja, unser Lager ist üppig grün.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unser Bett ist frisch und grün.“ Das hebräische Adjektiv bezeichnet wörtlich Frische oder kräftiges Grün und lässt wahrscheinlich an einen üppig bewachsenen Ort im Freien denken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְּךָ
  choice: Sieh, du bist
  rationale: Die deiktisch-ausrufende Partikel mit maskulinem Suffix lenkt die Aufmerksamkeit lebhaft auf den Angesprochenen. „Sieh“ bewahrt diese Wirkung in gegenwärtigem Deutsch.
- source_word: יָפֶה
  choice: schön
  rationale: Das Adjektiv bezeichnet Schönheit und Anziehungskraft. „Schön“ ist natürlich, poetisch und kann sich im Deutschen auch auf einen Mann beziehen.
- source_word: דוֹדִי
  choice: mein Geliebter
  rationale: Im Hohelied bezeichnet דוֹד den männlichen Geliebten. Die maskuline Form macht das Geschlecht des Angesprochenen sichtbar und wahrt den poetischen Ton.
- source_word: אַף
  choice: ja
  rationale: Die zweimalige Partikel wirkt hier bestätigend und verstärkend. Das wiederholte „ja“ bildet diese Emphase knapp und idiomatisch ab.
- source_word: נָעִים
  choice: lieblich
  rationale: Das Wort bezeichnet etwas Angenehmes, Anmutiges oder Entzückendes. „Lieblich“ passt zum poetischen Register und bleibt von „schön“ unterscheidbar.
- source_word: עַרְשֵׂנוּ
  choice: unser Lager
  rationale: עֶרֶשׂ kann Bett, Lager oder Ruhestatt bezeichnen. „Lager“ erhält die Bildweite und legt den möglichen erotischen Unterton nicht stärker fest als der hebräische Ausdruck.
- source_word: רַעֲנָנָה
  choice: üppig grün
  rationale: Das Adjektiv beschreibt Frische, Grün und gedeihende Vegetation. „Üppig grün“ lässt die wahrscheinlich natürliche, bewachsene Umgebung anklingen, ohne die ungewöhnliche Aussage über das Lager zu glätten.
