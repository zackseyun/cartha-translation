base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/006.yaml
  text: Do not stare at me because I am dark[a], because the sun has scorched me. My mother’s sons were angry with me; they made me keeper of the vineyards[d][c][b], but my own vineyard I have not kept.
translation:
  language: de
  text: Starrt mich nicht an, weil ich so dunkel bin[a], weil die Sonne mich versengt hat[b]. Die Söhne meiner Mutter[c] waren zornig auf mich; sie machten mich zur Hüterin der Weinberge. Doch meinen eigenen Weinberg[d] habe ich nicht gehütet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „weil ich schwarz bin“. Das hebräische Adjektiv ist selten und intensiv formuliert; im Zusammenhang verweist es auf die von der Sonne verdunkelte Haut.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „weil die Sonne mich angesehen“ oder „angeblickt“ hat. Die Wendung wird im Zusammenhang meist als Hinweis auf die bräunende oder versengende Wirkung der Sonne verstanden.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint sind ihre Brüder. Die wörtliche Formulierung „Söhne meiner Mutter“ kann eine gewisse Distanz zu ihnen erkennen lassen.
    reason: cultural_note
  - marker: d
    text: „Mein eigener Weinberg“ ist wahrscheinlich bildhaft gemeint; worauf das Bild genau verweist, lässt der hebräische Text offen.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּרְאוּנִי
  choice: Starrt mich nicht an
  rationale: Wörtlich steht hier „Seht mich nicht an“. Im Zusammenhang geht es jedoch um einen prüfenden Blick auf ihr Äußeres; „anstarren“ gibt diesen sozial markierten Sinn im heutigen Deutsch natürlich wieder.
- source_word: שְׁחַרְחֹרֶת
  choice: so dunkel
  rationale: Das seltene, intensiv gebildete Adjektiv bezeichnet ihre dunkle beziehungsweise von der Sonne verdunkelte Haut. „So dunkel“ klingt natürlich, bewahrt die Intensität und vermeidet eine vorschnelle ethnische Festlegung.
- source_word: שֶׁשֱּׁזָפַתְנִי הַשָּׁמֶשׁ
  choice: weil die Sonne mich versengt hat
  rationale: Im Kontext bezeichnet das Verb die sichtbare Wirkung starker Sonneneinstrahlung. „Versengt“ ist anschaulich und lässt die Härte ihrer Arbeit im Freien erkennen; die überlieferte Alternative „angesehen“ wird in einer Fußnote erhalten.
- source_word: בְּנֵי אִמִּי
  choice: Die Söhne meiner Mutter
  rationale: Die konkrete hebräische Formulierung wird beibehalten. Sie meint ihre Brüder, kann aber zugleich eine gewisse Distanz zu ihnen ausdrücken.
- source_word: נִחֲרוּ בִי
  choice: waren zornig auf mich
  rationale: Das Verb beschreibt entbrannten Zorn. Die gewählte Formulierung ist klares, modernes Deutsch, ohne das Bild des Brennens unnötig zu erzwingen.
- source_word: שָׂמֻנִי נֹטֵרָה אֶת־הַכְּרָמִים
  choice: sie machten mich zur Hüterin der Weinberge
  rationale: Die feminine Partizipialform bezeichnet eine Frau, die Weinberge bewacht oder hütet. „Hüterin“ ist knapp, würdig und ermöglicht die Wiederaufnahme desselben Verbs am Versende.
- source_word: כַּרְמִי שֶׁלִּי
  choice: meinen eigenen Weinberg
  rationale: Die doppelte Besitzanzeige im Hebräischen betont, dass es ihr eigener Weinberg ist. „Meinen eigenen“ bildet diese Hervorhebung idiomatisch ab.
- source_word: לֹא נָטָרְתִּי
  choice: habe ich nicht gehütet
  rationale: „Gehütet“ hält die lexikalische Verbindung zur vorherigen „Hüterin“ aufrecht und lässt die bildhafte Bedeutung offen.
theological_decisions:
- issue: Bildhafte Bedeutung von „meinem eigenen Weinberg“
  choice: Das Weinbergbild bleibt im Haupttext unerklärt stehen.
  alternative: Den Weinberg ausdrücklich als ihren Körper, ihr Aussehen, ihre Sexualität oder ihr eigenes Leben deuten.
  rationale: Der Ausdruck ist wahrscheinlich metaphorisch, doch sein genauer Bezug wird im Hebräischen nicht genannt. Die Übersetzung bewahrt deshalb die poetische und mögliche theologische Mehrdeutigkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit poetischer Würde. Die Wiederholung von „Hüterin“ und „gehütet“ bildet das hebräische Wortspiel ab; konkrete Familien- und Weinbergbilder sowie ihre Mehrdeutigkeit bleiben erhalten.
