  text: Die Balken unseres Hauses[a] sind Zedern, unsere Sparren[b] sind Zypressen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unserer Häuser“. Die hebräische Form steht im Plural, kann aber kollektiv „unser Haus“ oder „unser Zuhause“ meinen.'
