lexical_decisions:
- source_word: קֹרוֹת
  choice: Balken
  rationale: Das Wort bezeichnet tragende Bauhölzer, besonders Dachbalken; „Balken“ ist im Deutschen natürlich und bildet einen passenden Parallelismus zum zweiten Satzglied.
- source_word: בָּתֵּינוּ
  choice: unseres Hauses
  rationale: Die hebräische Form ist morphologisch pluralisch, kann hier jedoch kollektiv das gemeinsame Haus oder Zuhause bezeichnen. Der Singular ergibt im poetischen Zusammenhang ein natürliches deutsches Bild; die formale Mehrzahl bleibt in einer Fußnote erhalten.
- source_word: אֲרָזִים
  choice: Zedern
  rationale: Der Plural bezeichnet Zedern beziehungsweise Zedernholz. „Zedern“ gibt die Bildsprache unmittelbar wieder.
- source_word: רַחִיטֵנוּ
  choice: unser Dachgebälk
  rationale: Die Bedeutung des seltenen Ausdrucks ist unsicher. Im architektonischen Zusammenhang und parallel zu „Balken“ bezeichnet er wahrscheinlich Teile der Dachkonstruktion; „Dachgebälk“ bewahrt zugleich den kollektiven Charakter des Singulars.
- source_word: בְּרוֹתִים
  choice: Zypressen
  rationale: Die genaue Baumart ist umstritten. „Zypressen“ ist eine verbreitete, kontextuell passende Wiedergabe; andere Möglichkeiten werden in der Fußnote genannt.
