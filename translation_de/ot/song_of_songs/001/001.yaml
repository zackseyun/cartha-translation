  text: Das Lied der Lieder[b], das Salomo gehört[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Salomo“, „für Salomo“ oder „über Salomo“. Die hebräische Präposition kann verschiedene Arten der Zuordnung ausdrücken.'
