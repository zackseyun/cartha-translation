  - marker: b
    text: 'Wörtlich: „Lied der Lieder“; eine hebräische Steigerungsform für ein herausragendes oder das größte Lied.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Lied
  rationale: Das Substantiv bezeichnet ein Lied; hier eröffnet es zugleich den Titel des Buches.
- source_word: הַשִּׁירִים
  choice: der Lieder
  rationale: Die hebräische Verbindung שִׁיר הַשִּׁירִים ist eine Steigerungsform. „Lied der Lieder“ bewahrt ihre konkrete Form und lässt die Bedeutung „herausragendes/größtes Lied“ erkennen.
- source_word: אֲשֶׁר
  choice: das
  rationale: Das Relativpronomen verbindet den Titel natürlich mit der anschließenden Zuordnung zu Salomo.
- source_word: לִשְׁלֹמֹה
  choice: Salomo gehört
  rationale: Die Formulierung gibt die weite Zuordnung durch ל verständlich wieder, ohne eindeutig Autorschaft, Widmung oder Thema festzulegen.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Verwendet die im Deutschen etablierte Namensform.
theological_decisions:
- issue: Beziehung des Liedes zu Salomo in לִשְׁלֹמֹה
  choice: 'breite Zugehörigkeit: „das Salomo gehört“'
  alternative: „von Salomo“, „für Salomo“ oder „über Salomo“
  rationale: Die hebräische Präposition legt nicht eindeutig fest, ob Salomo als Verfasser, Empfänger, Besitzer oder Gegenstand gemeint ist. Die Übersetzung wahrt diese Offenheit, während die Fußnote die möglichen engeren Deutungen nennt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Titelklang. Die traditionelle Struktur „Lied der Lieder“ bleibt erhalten; „gehört“ vermeidet eine nicht gesicherte Festlegung auf salomonische Autorschaft.
