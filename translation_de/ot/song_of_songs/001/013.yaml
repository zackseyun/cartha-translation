  yaml_path: translation/ot/song_of_songs/001/013.yaml
  text: My beloved is to me a sachet of myrrh[c][b][a]; he lies between my breasts.
translation:
  language: de
  text: Mein Geliebter ist mir ein Beutel mit Myrrhe[a]; zwischen meinen Brüsten verbringt er die Nacht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Bündel Myrrhe“ beziehungsweise „ein Myrrhensäckchen“. Das hebräische Wort bezeichnet ein kleines verschnürtes Bündel oder Behältnis.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „übernachtet er“ oder „liegt er die Nacht über“. Das hebräische Verb bezeichnet das Übernachten beziehungsweise Verbringen der Nacht und verstärkt das intime Bild.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְרוֹר
  choice: Beutel
  rationale: Das Substantiv bezeichnet ein kleines verschnürtes Bündel oder Behältnis. „Beutel“ vermittelt im Zusammenhang mit dem Duftstoff natürlich die Vorstellung eines am Körper getragenen Duftbeutels, ohne die Form genauer festzulegen, als es der hebräische Ausdruck tut.
- source_word: הַמֹּר
  choice: Myrrhe
  rationale: „Myrrhe“ ist die übliche und sachlich genaue Bezeichnung für das wohlriechende Harz, das die Duftmetaphorik des Verses bestimmt.
- source_word: דּוֹדִי
  choice: mein Geliebter
  rationale: Im Hohelied bezeichnet דּוֹד den geliebten Mann in einer innigen, erotischen Beziehung. „Mein Geliebter“ bewahrt den poetischen und liebevollen Ton.
- source_word: לִי
  choice: mir
  rationale: 'Der Dativ gibt die persönliche Beziehung und Bedeutung idiomatisch wieder: Der Geliebte ist für die Sprecherin wie der Myrrhenbeutel.'
- source_word: בֵּין
  choice: zwischen
  rationale: Die konkrete räumliche Bedeutung wird unverändert beibehalten.
- source_word: שָׁדַי
  choice: meinen Brüsten
  rationale: Das Hebräische nennt ausdrücklich die Brüste der Sprecherin. Die Übersetzung wahrt die konkrete körperliche Bildsprache und vermeidet eine euphemistische Abschwächung wie „an meinem Busen“.
- source_word: יָלִין
  choice: verbringt er die Nacht
  rationale: Das Verb לין bezeichnet das Übernachten beziehungsweise Verbringen der Nacht. Die Formulierung bewahrt den nächtlichen Aspekt und die intime Bildsprache; das Pronomen „er“ kann sich im Deutschen wie im Hebräischen grammatisch sowohl auf den Geliebten als auch auf den Beutel beziehen.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches und zugleich poetisch-würdevolles Deutsch. Die sinnliche Körperlichkeit des hebräischen Textes wird ohne Euphemismus wiedergegeben. „Beutel mit Myrrhe“ klingt natürlicher als das kompakte „Myrrhenbeutel“ und vermeidet zugleich das fremdsprachlich wirkende „Sachet“.
