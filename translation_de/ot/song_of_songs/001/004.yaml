  text: מָשְׁכֵ֖/נִי אַחֲרֶ֣י/ךָ נָּר֑וּצָה הֱבִיאַ֨/נִי הַ/מֶּ֜לֶךְ חֲדָרָ֗י/ו נָגִ֤ילָה וְ/נִשְׂמְחָה֙ בָּ֔/ךְ נַזְכִּ֤ירָה דֹדֶ֨י/ךָ֙ מִ/יַּ֔יִן מֵישָׁרִ֖ים אֲהֵבֽוּ/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/004.yaml
  text: Draw me after you[a]; let us run. The king has brought me into his chambers. We will rejoice and be glad in you; we will extol your love more than wine[b]. Rightly do they love you.
translation:
  language: de
  text: Zieh mich hinter dir her – lass uns laufen! Der König hat mich in seine Gemächer gebracht. Wir wollen über dich jubeln und uns freuen; deine Liebe wollen wir mehr als Wein rühmen.[a] Mit Recht lieben sie dich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deiner Liebe wollen wir gedenken“, „von deiner Liebe wollen wir erzählen“ oder „deine Liebe wollen wir feiern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Die Aufrichtigen lieben dich.“ Das hebräische מֵישָׁרִים kann adverbial („mit Recht“) oder substantivisch („die Aufrichtigen“) verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָשְׁכֵנִי אַחֲרֶיךָ
  choice: Zieh mich hinter dir her
  rationale: „Ziehen“ gibt die Grundbedeutung von משׁך wieder; „hinter dir her“ drückt die durch אַחֲרֶיךָ bezeichnete Richtung in natürlichem Deutsch aus.
- source_word: נָּרוּצָה
  choice: lass uns laufen
  rationale: Die erste Person Plural und der auffordernde, kohortative Ton bleiben erhalten; der Wechsel vom Singular „mich“ zum Plural „uns“ wird nicht eingeebnet.
- source_word: הֱבִיאַנִי הַמֶּלֶךְ חֲדָרָיו
  choice: Der König hat mich in seine Gemächer gebracht
  rationale: Die Verbform wird als vollendete Handlung verstanden. „Gemächer“ bewahrt den poetischen und intimen Sinn der inneren Räume, ohne den König allegorisch zu identifizieren.
- source_word: נָגִילָה וְנִשְׂמְחָה בָּךְ
  choice: Wir wollen über dich jubeln und uns freuen
  rationale: „Wir wollen“ bildet den volitiven Ton der Kohortative ab. „Über dich“ ist für die Freude an einer Person im Deutschen natürlicher als das formal mögliche „in dir“.
- source_word: נַזְכִּירָה דֹדֶיךָ מִיַּיִן
  choice: deine Liebe wollen wir mehr als Wein rühmen
  rationale: זכר im Hifil bedeutet grundsätzlich „erwähnen/in Erinnerung rufen“, kann hier aber das feiernde Rühmen der Liebe bezeichnen. „Liebe“ gibt den poetischen Plural דֹדֶיךָ kollektiv und idiomatisch wieder; die lexikalische Spannweite wird in der Fußnote erhalten.
- source_word: מֵישָׁרִים אֲהֵבוּךָ
  choice: Mit Recht lieben sie dich
  rationale: מֵישָׁרִים wird adverbial als „mit Recht“ verstanden; das pluralische Verb wird mit „sie“ bewahrt. Die substantivische Lesart bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Identität des Königs
  choice: „Der König“ bleibt eine nicht näher bestimmte Gestalt innerhalb des Gedichts.
  alternative: Ausdrückliche Identifizierung mit Gott oder dem Messias/Christus.
  rationale: Der hebräische Vers selbst verlangt keine solche allegorische oder christologische Festlegung.
- issue: Sprecher- und Gruppenwechsel
  choice: Der Wechsel von „mich“ zu „uns/wir“ und „sie“ wird im Text bewahrt.
  alternative: Vereinheitlichung auf eine einzige Sprecherin oder Sprechergruppe.
  rationale: Die wechselnden Numeri gehören zur poetischen Mehrstimmigkeit des hebräischen Textes und sollten nicht interpretierend beseitigt werden.
translation_notes:
  register: Modernes, würdevolles poetisches Deutsch. Der Gedankenstrich und das Ausrufezeichen geben den drängenden, auffordernden Beginn wieder. „Gemächer“ ist bewusst gehoben, aber allgemein verständlich. Die Fußnotenmarker stehen jeweils unmittelbar bei der Wendung, auf die sie sich beziehen.
