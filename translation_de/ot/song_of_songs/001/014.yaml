  source_fidelity: 'Der hebräische Vergleich אֶשְׁכֹּל הַכֹּפֶר wird im Kern zutreffend als Bündel/Traube von Henna(blüten) verstanden. Die Ortsangabe und die relationale Wendung לִי sind korrekt wiedergegeben. Die Fußnote führt jedoch mit „Zyperblüten“ eine sachlich falsche Alternative ein: כֹּפֶר wird traditionell als „Campher“/„Campherstrauch“ (engl. camphire) wiedergegeben, nicht als Zypresse.'
