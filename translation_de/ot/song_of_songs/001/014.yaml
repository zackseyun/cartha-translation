  yaml_path: translation/ot/song_of_songs/001/014.yaml
  text: My beloved is to me a cluster of henna blossoms in the vineyards of En-gedi[a].
translation:
  language: de
  text: Mein Geliebter ist für mich ein Blütenbüschel Henna in den Weinbergen von En-Gedi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Blütenbüschel Campher“. Das hebräische Wort כֹּפֶר wird traditionell so wiedergegeben; wahrscheinlich ist jedoch die Hennapflanze mit ihren duftenden Blüten gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁכֹּל
  choice: ein Büschel
  rationale: Das Substantiv bezeichnet eine Traube beziehungsweise ein Bündel oder Büschel. Da es hier die Hennapflanze näher bestimmt, gibt „Büschel“ die gebündelte Blütenform natürlich wieder, ohne Weintrauben anzunehmen.
- source_word: הַכֹּפֶר
  choice: Hennablüten
  rationale: כֹּפֶר bezeichnet hier sehr wahrscheinlich die Hennapflanze (Lawsonia inermis), die wegen ihrer duftenden Blüten geschätzt wurde. „Hennablüten“ verdeutlicht das im poetischen Zusammenhang naheliegende Blütenbild.
- source_word: דּוֹדִי
  choice: mein Geliebter
  rationale: Im Hohelied bezeichnet דּוֹד den geliebten männlichen Partner. „Mein Geliebter“ ist präzise, würdevoll und poetisch, ohne altertümlich zu wirken.
- source_word: לִי
  choice: für mich
  rationale: Die Präposition drückt die persönliche Zuordnung oder Wahrnehmung aus. Die deutsche Wendung „ist für mich“ gibt dieses Verhältnis natürlich wieder.
- source_word: בְּכַרְמֵי
  choice: in den Weinbergen
  rationale: בְּ mit dem Konstruktplural von כֶּרֶם bezeichnet hier am einfachsten den Ort. „In den Weinbergen“ bewahrt die räumliche Bildsprache, ohne sie näher festzulegen.
- source_word: עֵין גֶּדִי
  choice: En-Gedi
  rationale: Der Ortsname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche und zugleich poetisch-würdevolle Standardsprache. Die knappe Vergleichsstruktur des Hebräischen bleibt erhalten; „Büschel Hennablüten“ vermeidet eine sachlich unpassende Festlegung auf eine Weintraube.
