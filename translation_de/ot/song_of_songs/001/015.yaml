base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/015.yaml
  text: Look[a], you are beautiful, my beloved; look, you are beautiful—your eyes are doves.
translation:
  language: de
  text: Sieh doch, du bist schön, meine Geliebte! Sieh doch, du bist schön – deine Augen sind Tauben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Augen sind wie Tauben“. Das Hebräische formuliert das Bild knapp: „deine Augen sind Tauben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: Sieh doch, du bist
  rationale: Die deiktisch-ausrufende Partikel הִנֵּה mit Suffix der 2. Person Singular feminin lenkt nachdrücklich die Aufmerksamkeit auf die Angesprochene. „Sieh doch“ klingt im heutigen Deutsch lebendig und natürlich; das ergänzte „doch“ trägt den bewundernden Nachdruck mit.
- source_word: יָפָה
  choice: schön
  rationale: Das Adjektiv bezeichnet Schönheit beziehungsweise Anmut. „Schön“ ist die klare, gegenwärtige und poetisch angemessene Entsprechung.
- source_word: רַעְיָתִי
  choice: meine Geliebte
  rationale: Im Hohelied dient das Wort als innige Anrede der weiblichen Geliebten. „Meine Geliebte“ bewahrt sowohl den substantivischen Charakter als auch den liebevollen Ton.
- source_word: הִנָּךְ יָפָה
  choice: Sieh doch, du bist schön
  rationale: Die vollständige Wiederholung wird beibehalten, weil sie ein prägendes poetisches Mittel ist und die Bewunderung verstärkt.
- source_word: עֵינַיִךְ
  choice: deine Augen
  rationale: Direkte Wiedergabe des Dualnomens mit Suffix der 2. Person Singular feminin.
- source_word: יוֹנִים
  choice: Tauben
  rationale: 'Das Hebräische verwendet ein knappes nominales Prädikat: wörtlich „deine Augen [sind] Tauben“. Die direkte Metapher bleibt im Haupttext erhalten; die mögliche simileartige Deutung wird in der Fußnote genannt.'
