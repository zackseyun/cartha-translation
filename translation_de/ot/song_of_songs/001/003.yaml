  text: לְ/רֵ֨יחַ֙ שְׁמָנֶ֣י/ךָ טוֹבִ֔ים שֶׁ֖מֶן תּוּרַ֣ק שְׁמֶ֑/ךָ עַל כֵּ֖ן עֲלָמ֥וֹת אֲהֵבֽוּ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/003.yaml
  text: The fragrance of your oils is pleasing[a]; your name is oil poured out[b]; therefore young women love you.
translation:
  language: de
  text: 'Der Duft deiner Öle ist köstlich[a];

    ausgegossenes Öl ist dein Name[b].

    Darum lieben dich die jungen Frauen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Denn deine Öle duften herrlich.“ Die hebräische Satzfügung ist knapp und poetisch verdichtet.'
    reason: alternative_reading
  - marker: b
    text: Im Hebräischen entsteht ein Wortklang zwischen „Name“ (schem) und „Öl“ (schemen), der sich im Deutschen nicht nachbilden lässt.
    reason: wordplay
  - marker: c
    text: Das hebräische Wort kann auch mit „junge Mädchen“ wiedergegeben werden; „Jungfrauen“ legt eine Bedeutung fest, die das Wort hier nicht zwingend ausdrückt.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרֵיחַ שְׁמָנֶיךָ טוֹבִים
  choice: Der Duft deiner Öle ist köstlich
  rationale: Die hebräische Wendung ist stark verdichtet. רֵיחַ bezeichnet Duft oder Geruch, שֶׁמֶן hier im Plural wohl duftende Öle beziehungsweise Salböle. „Köstlich“ gibt die positive Wertung von טוֹבִים in natürlichem, poetischem Deutsch wieder.
- source_word: שֶׁמֶן תּוּרַק שְׁמֶךָ
  choice: ausgegossenes Öl ist dein Name
  rationale: Die konkrete Ölmetapher und die passive Bedeutung der Hophal-Form תּוּרַק bleiben erhalten. Die ungewöhnliche Wortstellung klingt poetisch und vermeidet ein erklärendes „wie“, das im Hebräischen nicht ausdrücklich steht.
- source_word: עַל־כֵּן
  choice: Darum
  rationale: Die Wendung bezeichnet eine Folgerung oder Begründungsfolge; „Darum“ verbindet die Bilder knapp und idiomatisch.
- source_word: עֲלָמוֹת
  choice: junge Frauen
  rationale: Das Wort bezeichnet junge Frauen im heiratsfähigen Alter, ohne in diesem Zusammenhang zwingend Jungfräulichkeit festzulegen. „Junge Frauen“ ist präzise und gegenwärtig.
- source_word: אֲהֵבוּךָ
  choice: lieben dich
  rationale: Das Perfekt beschreibt hier am natürlichsten einen gegenwärtig geltenden Sachverhalt. „Lieben dich“ bewahrt die unmittelbare Aussage des Verbs אָהַב.
