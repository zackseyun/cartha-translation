  text: שְׁחוֹרָ֤ה אֲנִי֙ וְֽ/נָאוָ֔ה בְּנ֖וֹת יְרוּשָׁלִָ֑ם כְּ/אָהֳלֵ֣י קֵדָ֔ר כִּ/ירִיע֖וֹת שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/005.yaml
  text: I am dark[a], yet lovely, daughters of Jerusalem, like the tents of Kedar, like the curtains of Solomon.
translation:
  language: de
  text: Dunkel bin ich und doch schön, ihr Töchter Jerusalems, wie die Zelte Kedars, wie die Vorhänge Salomos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dunkel bin ich und schön.“ Das hebräische Bindewort bedeutet gewöhnlich „und“; „und doch“ bringt den im Zusammenhang wahrscheinlich gemeinten Gegensatz zum Ausdruck.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁחוֹרָה
  choice: dunkel
  rationale: Das Adjektiv bezeichnet eine dunkle Färbung. „Dunkel“ bewahrt die Selbstbeschreibung der Sprecherin, ohne eine ethnische Deutung einzutragen oder mit „schwarz“ eine stärker absolute Formulierung zu wählen.
- source_word: וְנָאוָה
  choice: und doch schön
  rationale: Das ו bedeutet formal „und“, kann im Zusammenhang aber einen Gegensatz tragen. „Und doch schön“ gibt den wahrscheinlich gemeinten Kontrast in natürlichem Deutsch wieder, ohne das verbindende „und“ ganz aufzugeben.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: ihr Töchter Jerusalems
  rationale: Die wörtliche poetische Anrede bleibt erhalten; „ihr“ macht den Vokativ im Deutschen natürlich und eindeutig.
- source_word: כְּאָהֳלֵי קֵדָר
  choice: wie die Zelte Kedars
  rationale: Die direkte Wiedergabe bewahrt das Gleichnis und den Eigennamen. Die vermutlich dunklen Nomadenzelte erklären das Bild, ohne dass diese Deutung in den Haupttext eingefügt wird.
- source_word: כִּירִיעוֹת שְׁלֹמֹה
  choice: wie die Zeltbahnen Salomos
  rationale: יְרִיעוֹת bezeichnet Stoffbahnen beziehungsweise Zeltdecken. „Zeltbahnen“ ist im Deutschen anschaulich, verbindet das zweite Bild mit den Zelten und vermeidet die moderne häusliche Assoziation von „Vorhängen“.
theological_decisions:
- issue: Bedeutung der Konjunktion ו vor נָאוָה
  choice: konzessiv-adversative Wiedergabe „und doch schön“
  alternative: einfache Beiordnung „und schön“
  rationale: Das Hebräische markiert den Gegensatz nicht ausdrücklich, doch der Zusammenhang legt nahe, dass die Sprecherin einer möglichen Abwertung ihrer dunklen Erscheinung entgegentritt. Die Hauptfassung gibt diesen wahrscheinlichen Sinn idiomatisch wieder; die formal mögliche einfache Beiordnung bleibt in der Fußnote erhalten.
- issue: Beziehung der beiden Vergleiche zur Selbstbeschreibung
  choice: Beide Vergleiche ohne erklärende Zuordnung nebeneinanderstellen
  alternative: Die Zelte Kedars ausdrücklich mit „dunkel“ und die Zeltbahnen Salomos ausdrücklich mit „schön“ verbinden
  rationale: Die poetische Parallelität legt eine solche Zuordnung nahe, formuliert sie aber nicht ausdrücklich. Der Text soll die Bildbeziehungen offenlassen und nicht durch Zusätze festlegen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die Umstellung „Dunkel bin ich“ erhält die Hervorhebung des einleitenden hebräischen Adjektivs. „Schön“ ist klar und natürlich; „Zeltbahnen“ bewahrt die konkrete Bildwelt des Verses.
