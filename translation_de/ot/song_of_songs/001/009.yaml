base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/009.yaml
  text: I compare you[a], my beloved, to my mare among Pharaoh’s chariots.
translation:
  language: de
  text: Mit meiner Stute bei den Streitwagen des Pharaos[a] vergleiche ich dich, meine Geliebte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Streitwagen des Pharaos“. Die hebräische Präposition kann sowohl die Einordnung in eine Gruppe als auch eine räumliche Zuordnung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְסֻסָתִי
  choice: mit meiner Stute
  rationale: סוּסָה bezeichnet ausdrücklich ein weibliches Pferd; das Suffix der 1. Person Singular wird mit „meiner“ wiedergegeben. Nach „vergleichen“ ist „mit“ im Deutschen die natürliche Entsprechung der hebräischen Vergleichskonstruktion mit לְ.
- source_word: בְּרִכְבֵי פַרְעֹה
  choice: unter den Streitwagen des Pharaos
  rationale: Das בְּ kann räumliche Zugehörigkeit oder Einordnung ausdrücken. „Unter“ vermittelt das Bild einer Stute inmitten der königlichen Wagen beziehungsweise Wagenverbände; „Streitwagen“ macht den militärisch-königlichen Sachbezug klar.
- source_word: דִּמִּיתִיךְ
  choice: vergleiche ich dich
  rationale: Das Piel von דמה bedeutet hier „vergleichen, gleichsetzen“. Das deutsche Präsens entspricht dem lebendigen poetischen Ausspruch gut, obwohl im Hebräischen formal eine Perfektform steht.
- source_word: רַעְיָתִי
  choice: meine Geliebte
  rationale: Die feminine Anrede bezeichnet im Hohelied die geliebte Frau. „Geliebte“ bewahrt den innigen, gehobenen Ton und klingt im modernen Deutsch natürlich.
