  text: Let him kiss me with the kisses of his mouth[a], for your love is better than wine.
translation:
  language: de
  text: Er küsse mich mit den Küssen seines Mundes! Denn deine Liebkosungen sind köstlicher als Wein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn deine Liebe ist köstlicher als Wein.“ Das hebräische Wort steht im Plural und kann sowohl die Liebe als auch konkrete Liebeserweisungen oder Liebkosungen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁקֵנִי
  choice: Er küsse mich
  rationale: Der Qal-Imperfekt der 3. Person Maskulin Singular mit Suffix der 1. Person Singular drückt hier einen Wunsch aus. Der deutsche Konjunktiv I gibt diesen gehobenen, poetischen Wunsch natürlich wieder.
- source_word: מִנְּשִׁיקוֹת
  choice: mit den Küssen
  rationale: Die Präposition מִן wird in dieser Verbindung instrumental beziehungsweise partitiv verstanden. „Mit den Küssen“ ist im Deutschen idiomatisch und bewahrt das konkrete Bild.
- source_word: פִּיהוּ
  choice: seines Mundes
  rationale: Die konkrete Wendung wird ohne Abschwächung wiedergegeben und wahrt die sinnliche Bildsprache des Gedichts.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung des vorangehenden Wunsches ein.
- source_word: טוֹבִים
  choice: sind köstlicher
  rationale: Das Adjektiv steht im Plural und bezeichnet hier im Vergleich mit Wein die höhere Annehmlichkeit oder Güte. „Köstlicher“ passt zum sinnlichen Vergleich und stimmt mit dem pluralischen Subjekt überein.
- source_word: דֹּדֶיךָ
  choice: deine Liebkosungen
  rationale: Der maskuline Plural kann Liebeserweisungen, Zärtlichkeiten oder Liebkosungen bezeichnen. „Liebkosungen“ bewahrt hier sowohl die Pluralform als auch den konkreten, sinnlichen Zusammenhang.
- source_word: מִיָּיִן
  choice: als Wein
  rationale: מִן steht nach טוֹבִים vergleichend und wird im Deutschen idiomatisch mit „als“ wiedergegeben.
