  text: While the king was at his table[b][a], my nard gave its fragrance.
translation:
  language: de
  text: Während[a] der König an seiner Tafel[b] war, verströmte meine Narde ihren Duft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Bis der König …“ oder „Solange der König …“. Der hebräische Ausdruck kann sowohl eine zeitliche Grenze als auch einen andauernden Zeitraum bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „bei seinem Gelage“, „auf seiner Liege“ oder „in seiner Runde“. Das hebräische Wort kann eine Tafel, eine Festgesellschaft oder den Platz bei einem liegenden Mahl bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד שֶׁ
  choice: Während
  rationale: Die Verbindung bezeichnet hier am ehesten den Zeitraum, in dem das folgende Geschehen stattfindet. „Während“ ist im Deutschen natürlich; die ebenfalls mögliche Grenzbedeutung „bis“ bleibt in einer Fußnote sichtbar.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Ausdruck wird als literarische Bezeichnung des männlichen Geliebten wiedergegeben. Die normale Großschreibung des deutschen Substantivs trägt keine zusätzliche messianische Deutung ein.
- source_word: בִּמְסִבּוֹ
  choice: an seiner Tafel saß
  rationale: מְסִבָּה kann eine Tafel, ein Gelage oder eine liegende Tischgesellschaft bezeichnen. „An seiner Tafel saß“ ergibt ein klares, natürliches deutsches Bild; „saß“ ist eine idiomatische Ergänzung und legt die antike Liegehaltung nicht als zwingend fest.
- source_word: נִרְדִּי
  choice: meine Narde
  rationale: נֵרְדּ bezeichnet die aromatische Narde beziehungsweise den daraus gewonnenen Duftstoff. Das Possessivsuffix wird mit „meine“ bewahrt.
- source_word: נָתַן רֵיחוֹ
  choice: verströmte ihren Duft
  rationale: Wörtlich steht „gab ihren Duft“. „Verströmte ihren Duft“ gibt diese hebräische Wendung in natürlichem, poetischem Deutsch wieder; das Suffix bezieht sich auf die Narde.
theological_decisions:
- issue: Ob „der König“ als messianischer oder theologischer Titel zu kennzeichnen ist
  choice: literarische Bezeichnung innerhalb des Liebesgedichts ohne besondere Hervorhebung
  alternative: eine typologische oder messianische Lesart durch besondere Kennzeichnung nahelegen
  rationale: Der hebräische Wortlaut verlangt an dieser Stelle keine messianische oder allegorische Deutung. Die Übersetzung lässt weiterführende Auslegungen offen, trägt sie aber nicht in den Text ein.
translation_notes:
  register: Modernes, würdevolles und sinnliches Standarddeutsch. Die Formulierung bleibt poetisch, aber für heutige Leser unmittelbar verständlich; die knappe Bildsprache und die zeitliche sowie räumliche Mehrdeutigkeit des Hebräischen werden nicht dogmatisch aufgelöst.
