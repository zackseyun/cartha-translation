source:
  edition: WLC
  text: אֲנִ֥י יְשֵׁנָ֖ה וְ/לִבִּ֣/י עֵ֑ר ק֣וֹל דּוֹדִ֣/י דוֹפֵ֗ק פִּתְחִי לִ֞/י אֲחֹתִ֤/י רַעְיָתִ/י֙ יוֹנָתִ֣/י תַמָּתִ֔/י שֶׁ/רֹּאשִׁ/י֙ נִמְלָא טָ֔ל קְוֻּצּוֹתַ֖/י רְסִ֥יסֵי לָֽיְלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/002.yaml
  text: 'I was asleep[a], but my heart was awake. The sound of my beloved knocking: “Open to me, my sister, my darling, my dove, my blameless one, for my head is drenched with dew[b], my locks with the drops of the night.”'
translation:
  language: de
  text: 'Ich schlief, doch mein Herz war wach. Da ist die Stimme[a] meines Geliebten! Er klopft: »Öffne mir, meine Schwester, meine Liebste, meine Taube, meine Makellose[b]! Denn mein Kopf ist voller Tau, meine Locken voller Tropfen der Nacht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Geräusch meines Geliebten«. Das hebräische Wort kann sowohl »Stimme« als auch »Geräusch, Laut« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »meine Vollkommene« beziehungsweise »meine Unversehrte«. Das hebräische Wort kann Ganzheit, Lauterkeit oder Unversehrtheit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֵׁנָה
  choice: ich schlief
  rationale: Das feminine prädikative Adjektiv beschreibt den Zustand der Sprecherin. Die Vergangenheitsform ist im erzählenden Zusammenhang natürlich und wahrt den Gegensatz zu »mein Herz war wach«.
- source_word: לִבִּי עֵר
  choice: mein Herz war wach
  rationale: »Herz« bewahrt das hebräische Bild für das innere Selbst; »wach« bildet den unmittelbaren poetischen Gegensatz zu »schlief«.
- source_word: קוֹל דּוֹדִי
  choice: die Stimme meines Geliebten
  rationale: קוֹל kann Stimme oder Geräusch bezeichnen. Da unmittelbar die Worte des Geliebten folgen, ist »Stimme« im Deutschen gut begründet; die weitere Möglichkeit bleibt in einer Fußnote erhalten.
- source_word: דוֹפֵק
  choice: er klopft
  rationale: Das Partizip stellt die Handlung lebendig und andauernd vor Augen. Ein selbstständiger deutscher Satz gibt die abrupte Wahrnehmung natürlich wieder.
- source_word: פִּתְחִי לִי
  choice: öffne mir
  rationale: Die knappe Verbindung von Imperativ und לִי lässt sich idiomatisch mit »öffne mir« wiedergeben; die gemeinte Tür muss nicht ergänzt werden.
- source_word: אֲחֹתִי
  choice: meine Schwester
  rationale: Die wörtliche Wiedergabe bewahrt diese für das Hohelied charakteristische vertraute Anrede.
- source_word: רַעְיָתִי
  choice: meine Liebste
  rationale: Die Bezeichnung meint die geliebte Partnerin. »Liebste« ist im modernen Deutschen innig, würdig und in der Reihe der Kosenamen natürlich.
- source_word: יוֹנָתִי
  choice: meine Taube
  rationale: Die transparente poetische Metapher wird unverändert bewahrt.
- source_word: תַמָּתִי
  choice: meine Makellose
  rationale: Das Wort bezeichnet Ganzheit, Lauterkeit oder Unversehrtheit. »Makellose« ist als poetische Anrede verständlich, ohne die Bedeutungsbreite vollständig auf abstrakte Vollkommenheit festzulegen.
- source_word: שֶׁרֹּאשִׁי נִמְלָא טָל
  choice: denn mein Kopf ist voller Tau
  rationale: »Denn« gibt die Begründung der Bitte wieder. »Voller Tau« bleibt nahe an נִמְלָא und klingt im Deutschen natürlich.
- source_word: קְוּצּוֹתַי
  choice: meine Locken
  rationale: Das Wort bezeichnet Haarlocken; die konkrete und poetische Bildsprache bleibt erhalten.
- source_word: רְסִיסֵי לָיְלָה
  choice: Tropfen der Nacht
  rationale: Die relativ formale Wiedergabe wahrt den offenen poetischen Parallelismus zum Tau, statt die Tropfen eindeutig als Nebel oder weiteren Tau zu erklären.
