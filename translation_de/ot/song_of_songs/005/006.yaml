  text: פָּתַ֤חְתִּֽי אֲנִי֙ לְ/דוֹדִ֔/י וְ/דוֹדִ֖/י חָמַ֣ק עָבָ֑ר נַפְשִׁ/י֙ יָֽצְאָ֣ה בְ/דַבְּר֔/וֹ בִּקַּשְׁתִּ֨י/הוּ֙ וְ/לֹ֣א מְצָאתִ֔י/הוּ קְרָאתִ֖י/ו וְ/לֹ֥א עָנָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/006.yaml
  text: I opened to my beloved[a], but my beloved had turned away and gone. My soul went out when he spoke; I sought him, but I did not find him. I called him[b], but he did not answer me.
translation:
  language: de
  text: Ich öffnete meinem Geliebten[a], doch mein Geliebter war entwischt und weitergegangen. Meine Seele entfloh, als er sprach[b]. Ich suchte ihn, aber ich fand ihn nicht; ich rief nach ihm, aber er antwortete mir nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich selbst öffnete meinem Geliebten.“'
    reason: Das hebräische selbstständige Pronomen betont die Sprecherin leicht.
  - marker: b
    text: 'Oder: „Meine Seele entfloh bei seinem Reden“; auch im Sinn von: „Ich war außer mir, als er sprach.“ Die hebräische Wendung ist bildhaft und lässt sowohl den Zeitpunkt als auch die durch seine Worte ausgelöste Erschütterung anklingen.'
    reason: Die Verbindung נַפְשִׁי יָצְאָה בְדַבְּרוֹ ist mehrdeutig und lässt sich im Deutschen nicht mit einer einzigen Formulierung vollständig abbilden.
lexical_decisions:
- source_word: פָּתַחְתִּי אֲנִי לְדוֹדִי
  choice: Ich öffnete meinem Geliebten
  rationale: Das selbstständige Pronomen אֲנִי hebt die Sprecherin leicht hervor; im Deutschen genügt hier das ausdrücklich gesetzte „Ich“. לְ bei פתח bezeichnet die Person, der geöffnet wird.
- source_word: וְדוֹדִי חָמַק עָבָר
  choice: doch mein Geliebter war entschlüpft und fort
  rationale: „Doch“ gibt den kontextuellen Gegensatz wieder. Die beiden Verben bezeichnen ein unbemerktes Entkommen und anschließendes Fortsein; beide Bewegungsaspekte bleiben erkennbar.
- source_word: נַפְשִׁי יָצְאָה
  choice: Meine Seele entwich
  rationale: Die bildhafte hebräische Wendung bleibt erhalten, ohne sie auf ein bestimmtes Gefühl festzulegen. „Entwich“ vermittelt das Herausgehen und die starke innere Erschütterung.
- source_word: בְדַבְּרוֹ
  choice: als er gesprochen hatte
  rationale: בְ mit dem Infinitiv kann zeitlich verstanden werden. Das Plusquamperfekt bringt im Zusammenhang zum Ausdruck, dass sie sich an sein zuvor gesprochenes Wort erinnert; andere zeitliche oder kausale Nuancen bleiben in der Fußnote sichtbar.
- source_word: בִּקַּשְׁתִּיהוּ וְלֹא מְצָאתִיהוּ
  choice: Ich suchte ihn, aber ich fand ihn nicht
  rationale: Die einfachen Verben und ihre Negation werden direkt und natürlich wiedergegeben, ohne eine nicht ausdrücklich genannte Unfähigkeit hinzuzufügen.
- source_word: קְרָאתִיו וְלֹא עָנָנִי
  choice: ich rief nach ihm, aber er antwortete mir nicht
  rationale: „Nach ihm rufen“ ist im Deutschen bei einer abwesenden Person idiomatisch; „antwortete mir nicht“ bewahrt die persönliche, schmerzliche Wirkung seines Schweigens.
