translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Klang. Die markante Körper-Seele-Bildsprache des Hebräischen wird bewahrt; zugleich bleibt der Satz für heutige Leser verständlich. Die beiden Abgangsverben werden nicht zu einem einzigen Verb eingeebnet.
