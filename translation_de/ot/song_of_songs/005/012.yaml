  text: עֵינָ֕י/ו כְּ/יוֹנִ֖ים עַל אֲפִ֣יקֵי מָ֑יִם רֹֽחֲצוֹת֙ בֶּֽ/חָלָ֔ב יֹשְׁב֖וֹת עַל מִלֵּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/012.yaml
  text: His eyes are like doves beside streams of water[a], bathed in milk, sitting by fullness.
translation:
  language: de
  text: Seine Augen sind wie Tauben an Wasserläufen, die sich in Milch baden und bei der Fülle sitzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die letzte hebräische Wendung ist schwer zu deuten. Sie kann etwa „bei der Fülle“ bedeuten; möglich sind auch „an einem vollen Becken“ oder „gut eingesetzt“, bezogen auf die Augen.
    reason: alternative_reading
lexical_decisions:
- source_word: עֵינָיו
  choice: Seine Augen
  rationale: עַיִן bedeutet hier aufgrund des Possessivsuffixes, des Körperporträts und des Taubenvergleichs eindeutig „Auge“, nicht „Quelle“.
- source_word: כְּיוֹנִים
  choice: wie Tauben
  rationale: Die Vergleichspartikel כְּ wird mit dem im Deutschen natürlichen „wie“ wiedergegeben; das konkrete poetische Bild bleibt erhalten.
- source_word: עַל אֲפִיקֵי מָיִם
  choice: an Wasserbächen
  rationale: אֲפִיקֵי bezeichnet Wasserläufe oder Bachrinnen. „An Wasserbächen“ ist anschaulich und gibt עַל in diesem räumlichen Zusammenhang idiomatisch wieder.
- source_word: רֹחֲצוֹת בֶּחָלָב
  choice: in Milch gebadet
  rationale: Das feminine Partizip kann die Tauben als badend beziehungsweise gebadet beschreiben. Die Formulierung bewahrt das auffällige Bild und entspricht natürlichem poetischem Deutsch.
- source_word: יֹשְׁבוֹת
  choice: sitzend
  rationale: Das Partizip von ישׁב wird konkret wiedergegeben und setzt grammatisch den Vergleich mit den Tauben fort.
- source_word: עַל מִלֵּאת
  choice: am vollen Becken
  rationale: Die schwierige Wendung bezeichnet wahrscheinlich etwas Gefülltes oder eine Einfassung. „Am vollen Becken“ bewahrt das Wasserbild und ist im Deutschen verständlich, ohne die Unsicherheit zu verschweigen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die weiblichen Partizipien werden auf die Tauben im Vergleich bezogen. Wegen der schwer verständlichen Schlusswendung steht die wahrscheinlichste bildhafte Deutung im Text und eine auf die Augen bezogene Alternative in der Fußnote.
