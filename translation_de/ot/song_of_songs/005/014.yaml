  text: His hands are rods of gold[a], set with beryl; his body is polished ivory[c][b], covered with sapphires.
translation:
  language: de
  text: Seine Hände sind goldene Stäbe[a], mit Beryll besetzt[b]; sein Leib[c] ist poliertes Elfenbein, mit Saphiren bedeckt[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „goldene Ringe“ beziehungsweise „goldene Walzen“. Das hebräische Wort bezeichnet gerundete Formen und lässt die genaue Gestalt offen.'
    reason: lexical_alternative
  - marker: b
    text: Auch mit „Topas“ oder „Chrysolith“ übersetzt. Welcher Edelstein mit dem hebräischen Wort תַּרְשִׁישׁ gemeint ist, lässt sich nicht sicher bestimmen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „sein Bauch“ oder „seine inneren Teile“. Im Zusammenhang ist wahrscheinlich der sichtbare Bereich des Rumpfes gemeint.'
    reason: lexical_alternative
  - marker: d
    text: Der in der Antike so bezeichnete blaue Schmuckstein war möglicherweise Lapislazuli und nicht der heute Saphir genannte Edelstein.
    reason: historical_linguistic_clarification
lexical_decisions:
- source_word: יָדָיו
  choice: seine Hände
  rationale: יָד bezeichnet gewöhnlich die Hand, kann aber auch den Arm einschließen. „Hände“ gibt das konkrete Körperbild unmittelbar wieder, ohne den möglichen weiteren Bezug im Hebräischen auszuschließen.
- source_word: גְּלִילֵי זָהָב
  choice: goldene Stäbe
  rationale: גְּלִילִים bezeichnet gerundete oder zylindrische Formen. „Stäbe“ bewahrt das längliche Bild in natürlichem Deutsch; die ebenfalls mögliche Deutung als Ringe wird in der Fußnote genannt.
- source_word: מְמֻלָּאִים בַּתַּרְשִׁישׁ
  choice: mit Beryll besetzt
  rationale: Das passive Partizip bedeutet wörtlich „gefüllt“, bezeichnet hier im Bild kunstvoller Goldarbeit aber wahrscheinlich das Einsetzen von Edelsteinen. תַּרְשִׁישׁ ist ein nicht sicher identifizierter Schmuckstein; „Beryll“ ist eine verbreitete, aber nicht endgültige Zuordnung.
- source_word: מֵעָיו
  choice: sein Leib
  rationale: מֵעֶה kann Bauch, innere Körperteile oder den Bereich des Rumpfes bezeichnen. Im körperlichen Preisgedicht ist eine konkrete anatomische Bedeutung wahrscheinlich; „Leib“ ist würdig und lässt den genauen Umfang offen.
- source_word: עֶשֶׁת שֵׁן
  choice: glattes Elfenbein
  rationale: Die Wendung bezeichnet offenbar ein bearbeitetes oder geglättetes Stück Elfenbein. „Glattes Elfenbein“ vermittelt die verfeinerte, glänzende Oberfläche und fügt sich natürlich in den poetischen Vergleich.
- source_word: מְעֻלֶּפֶת סַפִּירִים
  choice: mit Saphiren bedeckt
  rationale: Das Partizip beschreibt etwas Verhülltes, Überzogenes oder Bedecktes. „Bedeckt“ erhält das intensive visuelle Bild; die genaue Identität von סַפִּיר wird in einer Fußnote offengehalten.
