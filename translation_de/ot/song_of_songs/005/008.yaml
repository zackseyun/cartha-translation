base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/008.yaml
  text: 'I adjure you[a], daughters of Jerusalem: if you find my beloved, what will you tell him? That I am sick with love.'
translation:
  language: de
  text: 'Ich beschwöre euch, ihr Töchter Jerusalems: Wenn ihr meinen Geliebten findet, was sollt ihr ihm sagen? Dass ich krank vor Liebe bin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dass ich liebeskrank bin.“ Wörtlich: „Dass ich krank vor Liebe bin.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: Ich beschwöre euch
  rationale: Der Hifil von שׁבע bezeichnet hier das feierliche Verpflichten beziehungsweise Beschwören. Die Formulierung wahrt Dringlichkeit und gehobenen poetischen Ton.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: ihr Töchter Jerusalems
  rationale: Die direkte, im Hohelied herkömmliche Anrede bleibt erhalten; „ihr“ macht den deutschen Vokativ natürlich kenntlich.
- source_word: אִם תִּמְצְאוּ
  choice: Wenn ihr ... findet
  rationale: אִם kennzeichnet eine Bedingung. Deutsches „wenn“ kann diese offene Bedingung idiomatisch ausdrücken, ohne sie als sicher eintretend festzulegen.
- source_word: דּוֹדִי
  choice: meinen Geliebten
  rationale: דּוֹד bezeichnet im Hohelied den geliebten männlichen Partner. „Geliebter“ ist würdevoll, poetisch und weniger verengend als „Liebhaber“.
- source_word: מַה תַּגִּידוּ לוֹ
  choice: was sollt ihr ihm sagen?
  rationale: Die Frage zielt auf die zu übermittelnde Botschaft; „sollt“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: שֶׁחוֹלַת אַהֲבָה אָנִי
  choice: Dass ich krank vor Liebe bin
  rationale: Die transparente Krankheitsmetapher des Hebräischen bleibt gewahrt. „Krank vor Liebe“ ist im modernen Deutsch verständlich und poetisch.
- source_word: אַהֲבָה
  choice: Liebe
  rationale: Die übliche und kontextgemäße Entsprechung erhält die zentrale Liebesthematik des Gedichts.
