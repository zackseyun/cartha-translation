  text: My beloved is radiant and ruddy[a], distinguished among ten thousand.
translation:
  language: de
  text: Mein Geliebter ist strahlend und rötlich, herausragend unter Zehntausenden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auffallend unter Zehntausenden“; möglicherweise wörtlicher: „mit einem Banner gekennzeichnet unter Zehntausenden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: mein Geliebter
  rationale: Im Hohelied bezeichnet דּוֹד wiederholt den geliebten Mann der Sprecherin. „Mein Geliebter“ ist natürlich, würdevoll und bewahrt den romantischen Beziehungsbezug.
- source_word: צַח
  choice: strahlend
  rationale: Das Adjektiv bezeichnet eine helle, klare oder leuchtende Erscheinung. „Strahlend“ gibt diese sichtbare Leuchtkraft in modernem Deutsch wieder.
- source_word: וְאָדוֹם
  choice: und von rötlicher Farbe
  rationale: אָדוֹם bezeichnet eine rote beziehungsweise rötliche Färbung. Die Formulierung bleibt nah am Bild und vermeidet das im heutigen Deutsch bei Personen leicht missverständliche schlichte „rot“.
- source_word: דָּגוּל
  choice: herausragend
  rationale: Die Form bezeichnet wahrscheinlich jemanden, der aus einer Menge sichtbar hervorsticht oder ausgezeichnet ist. „Herausragend“ ist verständlich, ohne das Bild auf eine bestimmte Deutung festzulegen.
- source_word: מֵרְבָבָה
  choice: unter Zehntausenden
  rationale: מִן kennzeichnet hier das Hervortreten aus beziehungsweise den Vergleich innerhalb einer sehr großen Menge. Der deutsche Plural gibt den idiomatischen Sinn einer unübersehbaren Vielzahl natürlich wieder.
