base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/013.yaml
  text: His cheeks are like beds of spice[a], mounds of perfumes; his lips are lilies, dripping flowing myrrh.
translation:
  language: de
  text: Seine Wangen sind wie ein Beet voller Gewürzpflanzen, wie Türme aus Duftmischungen[a]; seine Lippen sind Lilien, die von fließender Myrrhe träufeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwierig. Auch möglich: „Erhebungen“, „Hügel“ oder „erhöhte Beete aus Duftmischungen“; sie kann aufgehäufte oder angepflanzte aromatische Pflanzen meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחָיָו
  choice: seine Wangen
  rationale: Die Pluralform mit Suffix bezeichnet hier die Seiten des Gesichts; „Wangen“ ist im poetischen Körperlob natürlich und präzise.
- source_word: כַּעֲרוּגַת הַבֹּשֶׂם
  choice: wie ein Beet voll Balsam
  rationale: עֲרוּגָה bezeichnet ein Gartenbeet, בֹּשֶׂם aromatische Pflanzen oder Balsam. Die Wiedergabe bewahrt das gärtnerische Duftbild.
- source_word: מִגְדְּלוֹת מֶרְקָחִים
  choice: wie Hügel aus Duftmischungen
  rationale: Die schwierige Wendung verbindet ein Wort, das nach der masoretischen Punktierung „Türme“ bzw. Erhebungen nahelegt, mit zusammengesetzten Duftstoffen. „Hügel“ ergibt im Zusammenhang mit Beeten ein verständliches Höhenbild; die wörtlichere und eine gärtnerische Deutung werden in der Fußnote offengehalten.
- source_word: שִׂפְתוֹתָיו
  choice: seine Lippen
  rationale: Direkte Entsprechung der Pluralform mit Suffix.
- source_word: שׁוֹשַׁנִּים
  choice: Lilien
  rationale: Die genaue botanische Art ist unsicher; „Lilien“ ist die traditionelle, verständliche Bezeichnung und wahrt das bekannte poetische Bild.
- source_word: נֹטְפוֹת
  choice: träufelnd
  rationale: Das Partizip beschreibt sanftes Tropfen oder Fließen; „träufelnd“ passt zum dichterischen Register und zur kostbaren Myrrhe.
- source_word: מוֹר עֹבֵר
  choice: fließende Myrrhe
  rationale: מוֹר bezeichnet Myrrhe; עֹבֵר charakterisiert sie wahrscheinlich als frei fließend beziehungsweise flüssig. „Fließende Myrrhe“ erhält das sinnliche Bild, ohne das mehrdeutige Partizip übermäßig auszudeuten.
