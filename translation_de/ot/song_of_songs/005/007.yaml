  source_fidelity: 'Die Übersetzung gibt die hebräische Abfolge und Syntax sinngemäß präzise wieder: Die in der Stadt umhergehenden Wächter finden die Frau, schlagen und verwunden sie; die Wächter der Mauern nehmen ihr den äußeren Überwurf weg. Die Wiedergabe wahrt die Unterscheidung zwischen »schlugen« und »verwundeten« sowie die mögliche Identität bzw. Nähe der beiden Wächterbezeichnungen, ohne sie auszudeuten.'
  naturalness: Modernes, klares Standarddeutsch. »in der Stadt ihre Runden machten« ist idiomatisch und gibt das partizipiale »umhergehen/kreisen« angemessen wieder. Die knappe Satzfolge und das Semikolon tragen den literarisch-ernsten Ton des Verses.
  terminology: »Wächter« ist für beide hebräischen Formen konsistent und natürlich. »Überwurf« ist für רְדִיד eine vorsichtige, verständliche Wahl, die weder einen Gesichtsschleier noch eine bestimmte Art von Kleidungsstück unnötig festlegt. Die Fußnote sichert die wesentlichen lexikalischen Alternativen ab.
