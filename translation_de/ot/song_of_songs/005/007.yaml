  text: מְצָאֻ֧/נִי הַ/שֹּׁמְרִ֛ים הַ/סֹּבְבִ֥ים בָּ/עִ֖יר הִכּ֣וּ/נִי פְצָע֑וּ/נִי נָשְׂא֤וּ אֶת רְדִידִ/י֙ מֵֽ/עָלַ֔/י שֹׁמְרֵ֖י הַ/חֹמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/007.yaml
  text: The watchmen who go about the city found me[a]; they struck me, they wounded me[b]; the keepers of the walls took my cloak from me.
translation:
  language: de
  text: Die Wächter, die in der Stadt ihre Runden machten, fanden mich. Sie schlugen mich, sie verwundeten mich; die Wächter der Mauern nahmen mir meinen Überwurf ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meinen Schleier« beziehungsweise »mein Umschlagtuch«. Das hebräische Wort bezeichnet ein äußeres Tuch oder bedeckendes Kleidungsstück; seine genaue Form ist ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצָאֻנִי
  choice: fanden mich
  rationale: Die Grundbedeutung von מצא ist »finden«. Im Zusammenhang mit der nächtlichen Suche der Frau ist dies die direkte und natürliche Wiedergabe.
- source_word: הַשֹּׁמְרִים
  choice: die Wächter
  rationale: Das substantivierte Partizip von שמר bezeichnet Menschen, die Wache halten; »Wächter« passt zum städtischen Kontext.
- source_word: הַסֹּבְבִים בָּעִיר
  choice: die in der Stadt ihre Runden machten
  rationale: סבב bedeutet »herumgehen, umkreisen«. Die Formulierung gibt die fortlaufende Tätigkeit idiomatisch wieder, ohne eine moderne Polizeiorganisation vorauszusetzen.
- source_word: הִכּוּנִי
  choice: sie schlugen mich
  rationale: נכה bezeichnet das Schlagen; die schlichte Wiedergabe bewahrt die Steigerung zum folgenden »verwundeten«.
- source_word: פְצָעוּנִי
  choice: sie verwundeten mich
  rationale: פצע bedeutet »verwunden, verletzen« und bezeichnet eine deutliche körperliche Schädigung.
- source_word: נָשְׂאוּ אֶת רְדִידִי מֵעָלַי
  choice: nahmen mir meinen Überwurf ab
  rationale: נשא in Verbindung mit מֵעָלַי beschreibt hier das Entfernen des Kleidungsstücks von ihrem Körper. »Überwurf« gibt רְדִיד als äußeres, bedeckendes Kleidungsstück wieder, ohne es vorschnell als Gesichtsschleier festzulegen.
- source_word: שֹׁמְרֵי הַחֹמוֹת
  choice: die Wächter der Mauern
  rationale: Die Konstruktion bezeichnet die Männer als Wächter der Stadtmauern und bewahrt die lexikalische Verbindung zu den zuvor genannten Wächtern.
