  text: My beloved put his hand through the opening[b][a], and my inward parts trembled for him.
translation:
  language: de
  text: Mein Geliebter streckte seine Hand durch die Öffnung[a], und mein Innerstes geriet seinetwegen in Aufruhr.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das Loch“. Wörtlich steht im Hebräischen „von dem Loch her“; wahrscheinlich ist eine Öffnung in der Tür gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und mein Innerstes wurde seinetwegen bewegt“ oder „und mein Innerstes wallte ihm entgegen“. Das Hebräische beschreibt tiefe Gefühle als eine körperliche Bewegung im Innern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: mein Geliebter
  rationale: Bezeichnet im Hohelied den geliebten Mann der Sprecherin. „Mein Geliebter“ ist poetisch, würdevoll und bewahrt den Beziehungssinn, ohne die mögliche erotische Färbung auszuschließen.
- source_word: שָׁלַח יָדוֹ
  choice: streckte seine Hand
  rationale: שׁלח bedeutet häufig „senden“, bezeichnet mit „Hand“ hier aber das Ausstrecken oder Hineinreichen der Hand. Die deutsche Wendung gibt die konkrete Bewegung natürlich wieder.
- source_word: מִן הַחֹר
  choice: durch die Öffnung
  rationale: חֹר bezeichnet ein Loch oder eine Öffnung, hier wahrscheinlich an der Tür. Obwohl die Präposition wörtlich „von/aus“ lautet, verlangt die dargestellte Bewegung im Deutschen idiomatisch „durch“.
- source_word: וּמֵעַי
  choice: mein Innerstes
  rationale: מֵעִים bezeichnet zunächst die inneren Organe und dann den Sitz tiefer Empfindungen. „Mein Innerstes“ erhält die körperlich-emotionale Bildsprache, ohne im Deutschen grob oder medizinisch zu wirken.
- source_word: הָמוּ
  choice: geriet in Unruhe
  rationale: Das Verb bezeichnet ein Aufwallen, Erregtsein oder inneres Rumoren. Die Formulierung wahrt die intensive innere Bewegung, ohne sie eindeutig als Zittern, Sehnsucht oder Mitleid festzulegen.
- source_word: עָלָיו
  choice: seinetwegen
  rationale: Die Präposition kann hier den Anlass oder die Ausrichtung der Empfindung bezeichnen. „Seinetwegen“ ist natürlich und lässt offen, ob die Regung vor allem durch ihn verursacht oder auf ihn gerichtet ist.
