base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/009.yaml
  text: What is your beloved more than another beloved[a], most beautiful among women? What is your beloved more than another beloved[b], that you have made us swear thus?
translation:
  language: de
  text: Was hat dein Geliebter einem anderen Geliebten voraus,[a] du Schönste unter den Frauen? Was hat dein Geliebter einem anderen Geliebten voraus, dass du uns so hast schwören lassen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder durchgehend: „dein Liebhaber“. Das hebräische Wort kann einen Geliebten oder Liebhaber in einem romantischen Sinn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dass du uns so beschworen“ oder „uns so feierlich verpflichtet hast“. Das hebräische Verb bedeutet wörtlich, jemanden schwören zu lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה ... מִדּוֹד
  choice: Was hat ... anderen Geliebten voraus
  rationale: Die Konstruktion mit מַה und dem vergleichenden מִן fragt, wodurch sich ihr Geliebter gegenüber anderen Geliebten auszeichnet. Diese deutsche Wendung gibt den Vergleich natürlich und direkt wieder.
- source_word: דּוֹדֵךְ
  choice: dein Geliebter
  rationale: דּוֹד bezeichnet im Hohelied den romantisch geliebten Mann. „Geliebter“ bewahrt den poetischen und relationalen Ton; „Liebhaber“ wäre ebenfalls möglich, klingt aber stärker sexuell beziehungsweise nach einer Affäre.
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: du Schönste unter den Frauen
  rationale: Die Verbindung von Adjektiv und בְּ mit einer Mehrzahl hat hier superlativischen Sinn. Die Anrede ist im Deutschen natürlich und poetisch.
- source_word: שֶׁכָּכָה
  choice: so
  rationale: Das Adverb bezeichnet Art oder Ausmaß und bezieht sich auf die eindringliche Beschwörung. „So“ ist knapp, modern und wahrt die offene Nuance.
- source_word: הִשְׁבַּעְתָּנוּ
  choice: du uns ... beschworen hast
  rationale: Der Hifil von שבע kann bedeuten, jemanden schwören zu lassen beziehungsweise feierlich zu verpflichten. „Beschworen“ ist hier idiomatisch und lässt den Ernst der Aufforderung erkennen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges poetisches Deutsch. Die Wiederholung der Frage und des Wortes „Geliebter“ bildet den hebräischen Parallelismus ab. „Beschworen“ vermeidet das im Deutschen missverständliche „uns schwören lassen“, während die Fußnote die kausative Grundbedeutung ausdrücklich festhält.
