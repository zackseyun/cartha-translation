base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/015.yaml
  text: His legs are pillars of marble[a], set on bases of fine gold. His appearance is like Lebanon[b], choice as the cedars.
translation:
  language: de
  text: Seine Beine sind Säulen aus Marmor[a], fest gegründet auf Sockeln aus Feingold. Seine Erscheinung ist wie der Libanon[b], erlesen wie die Zedern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Säulen aus Alabaster“. Das hebräische Wort kann einen kostbaren weißen Stein bezeichnen; die genaue Steinart ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Seine Erscheinung ist wie der Libanon, ausgezeichnet wie die Zedern.“ Das mit „erlesen“ wiedergegebene hebräische Wort bezeichnet hier wahrscheinlich herausragende, ausgewählte Qualität; andernorts kann es auch „junger Mann“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹקָיו
  choice: seine Beine
  rationale: שׁוֹק kann den Bereich von Bein oder Oberschenkel bezeichnen. Im poetischen Vergleich mit Säulen ist „Beine“ im modernen Deutschen natürlich und wahrt die bildhafte Weite des Ausdrucks.
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: Säulen aus Marmor
  rationale: עַמּוּדֵי bezeichnet Säulen; שֵׁשׁ meint hier einen kostbaren hellen Stein, traditionell Marmor. Da die genaue Steinart unsicher ist, wird die Alternative in einer Fußnote genannt.
- source_word: מְיֻסָּדִים עַל אַדְנֵי פָז
  choice: gegründet auf Sockeln aus Feingold
  rationale: Das passive Partizip von יסד bezeichnet ein festes Gründen oder Aufstellen. אַדְנֵי sind architektonische Sockel bzw. Fußstücke, und פָז bezeichnet hochwertiges, geläutertes Gold.
- source_word: מַרְאֵהוּ
  choice: seine Erscheinung
  rationale: מַרְאֶה bezeichnet das sichtbare Aussehen bzw. die Gesamterscheinung. „Erscheinung“ passt zum umfassenden, majestätischen Vergleich mit dem Libanon.
- source_word: כַּלְּבָנוֹן
  choice: wie der Libanon
  rationale: Der Libanon steht im Bild für Größe, Schönheit und Majestät. Im Deutschen wird der geografische Name regulär mit Artikel gebraucht.
- source_word: בָּחוּר כָּאֲרָזִים
  choice: erlesen wie die Zedern
  rationale: בָּחוּר bezeichnet hier wahrscheinlich ausgewählte, hervorragende Qualität und nicht einen jungen Mann. „Erlesen“ erhält die knappe poetische Wertung; die Bedeutungsnuance wird in einer Fußnote offengehalten.
