lexical_decisions:
- source_word: פָּשַׁטְתִּי
  choice: habe … ausgezogen
  rationale: Das Verb bezeichnet hier das Ablegen eines Kleidungsstücks. „Ausgezogen“ ist im Deutschen natürlich und gibt den konkreten häuslichen Vorgang wieder.
- source_word: כֻּתָּנְתִּי
  choice: mein Untergewand
  rationale: כֻּתֹּנֶת bezeichnet ein am Körper getragenes Grundgewand. „Untergewand“ ist genauer als das allgemeinere „Gewand“ und im Deutschen verständlicher und weniger missverständlich als „Tunika“.
- source_word: אֵיכָכָה
  choice: wie sollte ich
  rationale: Die Frage drückt hier weniger Unfähigkeit als widerstrebenden Einwand aus. „Wie sollte ich“ bewahrt diesen rhetorischen Ton in natürlichem Deutsch.
- source_word: אֶלְבָּשֶׁנָּה
  choice: es wieder anziehen
  rationale: Das Verb bedeutet „anziehen“; das feminine Suffix verweist auf כֻּתָּנְתִּי. „Wieder“ verdeutlicht im Deutschen die im Zusammenhang vorausgesetzte Umkehrung des Ausziehens.
- source_word: רָחַצְתִּי
  choice: Ich habe … gewaschen
  rationale: Das Perfekt bezeichnet eine abgeschlossene Handlung mit gegenwärtigem Ergebnis. Das deutsche Perfekt passt zu der unmittelbar geltend gemachten Begründung.
- source_word: רַגְלַי
  choice: meine Füße
  rationale: Die Form bezeichnet beide Füße und wird im Deutschen idiomatisch mit dem Plural wiedergegeben.
- source_word: אֲטַנְּפֵם
  choice: sie beschmutzen
  rationale: Das Verb bedeutet konkret „schmutzig machen, beschmutzen“. „Beschmutzen“ bewahrt das körperlich-konkrete Bild, ohne die geistlich-kultischen Nebenbedeutungen von „verunreinigen“ einzutragen.
theological_decisions:
- issue: Deutung der Worte der Frau
  choice: Die Aussage wird als konkreter häuslicher Einwand übersetzt.
  alternative: Die Kleidung und die Füße bereits in der Übersetzung vorrangig als erotische Metaphern wiedergeben.
  rationale: Der unmittelbare Wortlaut beschreibt konkrete Handlungen. Mögliche erotische oder symbolische Bedeutungsebenen des Hohelieds bleiben offen, werden aber nicht durch deutende Zusätze in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem rhetorischem Ton. Der parallele Satzbau und die konkreten häuslichen Bilder des Hebräischen bleiben erhalten.
