translation:
  language: de
  text: Ich habe mein Gewand ausgezogen[a] – wie könnte ich es wieder anziehen? Ich habe meine Füße gewaschen – wie könnte ich sie beschmutzen?
  philosophy: optimal-equivalence
  footnotes:
