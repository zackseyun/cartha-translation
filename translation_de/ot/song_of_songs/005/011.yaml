  text: רֹאשׁ֖/וֹ כֶּ֣תֶם פָּ֑ז קְוּצּוֹתָי/ו֙ תַּלְתַּלִּ֔ים שְׁחֹר֖וֹת כָּ/עוֹרֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/011.yaml
  text: His head is finest gold[a]; his locks are wavy[b], black as a raven.
translation:
  language: de
  text: Sein Haupt ist reinstes Gold[a]; seine Locken sind gewellt[b], schwarz wie ein Rabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „feinstes Gold“. Im Hebräischen stehen zwei Goldbezeichnungen zusammen und verstärken das Bild.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „lockig“ beziehungsweise „in Wellen fallend“. Der hebräische Ausdruck ist selten und poetisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁוֹ
  choice: Sein Haupt
  rationale: רֹאשׁ bezeichnet konkret den Kopf. „Haupt“ wahrt hier den gehobenen poetischen Ton der körperlichen Beschreibung, ohne den Sinn zu verändern.
- source_word: כֶּתֶם פָּז
  choice: reinstes Gold
  rationale: Die Verbindung zweier Ausdrücke für kostbares Gold verstärkt das Bild besonders hochwertigen, reinen Goldes. „Reinstes Gold“ gibt diese Intensivierung natürlich und poetisch wieder.
- source_word: קְוּצּוֹתָיו
  choice: seine Locken
  rationale: Das Wort bezeichnet Haarlocken beziehungsweise herabhängende Haarsträhnen. „Locken“ passt idiomatisch zur folgenden Formbeschreibung.
- source_word: תַּלְתַּלִּים
  choice: gewellt
  rationale: Der seltene poetische Ausdruck beschreibt vermutlich welliges oder lockiges Haar. „Gewellt“ bewahrt die lexikalische Unschärfe besser als eine eindeutigere Festlegung auf stark gelocktes Haar.
- source_word: שְׁחֹרוֹת
  choice: schwarz
  rationale: Das Adjektiv bezeichnet unmittelbar die schwarze Farbe.
- source_word: כָּעוֹרֵב
  choice: wie ein Rabe
  rationale: Die mit כ gebildete Vergleichsphrase verweist auf das tiefe, möglicherweise glänzende Schwarz eines Raben; die direkte deutsche Entsprechung lautet „wie ein Rabe“.
