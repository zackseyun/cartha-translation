base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/005.yaml
  text: I arose to open to my beloved[a], and my hands dripped with myrrh, my fingers with flowing myrrh[b], on the handles of the bolt.
translation:
  language: de
  text: Ich stand auf, um meinem Geliebten die Tür zu öffnen. Meine Hände tropften von Myrrhe, meine Finger von fließender Myrrhe[a] auf die Griffe des Riegels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „flüssiger Myrrhe“ oder „rinnender Myrrhe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf die Griffe des Schlosses“ oder „auf den Türriegel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַמְתִּי אֲנִי
  choice: Ich stand auf
  rationale: Das Qal Perfekt der 1. Person Singular mit ausdrücklich gesetztem Pronomen betont die Sprecherin. „Ich stand auf“ ist im modernen Deutsch natürlich und bewahrt den Vorgang des Sich-Erhebens.
- source_word: לִפְתֹּחַ לְדוֹדִי
  choice: um meinem Geliebten zu öffnen
  rationale: Der Infinitiv von פתח bezeichnet das Öffnen der Tür; דּוֹדִי meint im Kontext des Hohelieds den Geliebten. Die deutsche Dativkonstruktion gibt die Wendung natürlich wieder.
- source_word: יָדַי נָטְפוּ מוֹר
  choice: Meine Hände troffen von Myrrhe
  rationale: נטף bezeichnet ein Tropfen oder Triefen. „troffen von“ erhält das sinnliche Bild und passt zum gehobenen poetischen Register, ohne altertümlich unverständlich zu sein.
- source_word: אֶצְבְּעֹתַי
  choice: meine Finger
  rationale: Direkte und im Deutschen übliche Entsprechung des hebräischen Plurals.
- source_word: מוֹר עֹבֵר
  choice: fließende Myrrhe
  rationale: עֹבֵר bedeutet wörtlich „vorübergehend/weitergehend“ und kann hier Myrrhe beschreiben, die fließt oder rinnt. „fließende Myrrhe“ bewahrt die dynamische Bildsprache, ohne die Substanz genauer festzulegen.
- source_word: עַל כַּפּוֹת הַמַּנְעוּל
  choice: auf die Griffe des Riegels
  rationale: עַל bezeichnet hier die Oberfläche bzw. Richtung des Tropfens. כַּפּוֹת meint im Zusammenhang mit dem Türverschluss die greifbaren Teile oder Griffe; מַנְעוּל bezeichnet eine Sperrvorrichtung, hier passend als „Riegel“ wiedergegeben.
