translation_notes:
  register: Moderne, verständliche und zugleich poetisch-würdevolle Standardsprache. Die Wiederholung von „Myrrhe“ und die körperlich-sinnliche Bildsprache des Hebräischen bleiben erhalten; die ungewöhnliche syntaktische Verbindung des Tropfens mit den Griffen wird nicht erklärend aufgelöst.
