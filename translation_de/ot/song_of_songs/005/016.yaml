base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/016.yaml
  text: His mouth is sweetness itself[a], and all of him is desirable. This is my beloved, and this is my friend[b], O daughters of Jerusalem.
translation:
  language: de
  text: Sein Mund ist lauter Süße[a], und alles an ihm ist begehrenswert[b]. Das ist mein Geliebter, und das ist mein Freund, ihr Töchter Jerusalems.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Sein Gaumen ist Süße“; das hebräische Wort bezeichnet den Gaumen und kann hier metonymisch für den Mund stehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „sein Ganzes ist Begehrenswertes“; der hebräische Plural drückt wahrscheinlich gesteigerte Begehrenswürdigkeit oder Lieblichkeit aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִכּוֹ
  choice: sein Mund
  rationale: Das hebräische Wort bezeichnet wörtlich den Gaumen, steht hier im poetischen Zusammenhang aber metonymisch für den Mund und möglicherweise für seine Küsse oder Worte. „Mund“ bewahrt das körperliche Bild und klingt im Deutschen natürlicher als „Gaumen“.
- source_word: מַמְתַקִּים
  choice: lauter Süße
  rationale: Der Plural hat hier wahrscheinlich steigernde oder abstrahierende Kraft. „Lauter Süße“ gibt die poetische Intensität wieder, ohne den Ausdruck auf das bloße Adjektiv „süß“ zu reduzieren.
- source_word: וְכֻלּוֹ
  choice: und alles an ihm
  rationale: Die Wendung bedeutet wörtlich „und sein Ganzes“ beziehungsweise „und alles von ihm“. „Alles an ihm“ ist im Deutschen natürlich und wahrt den umfassenden persönlichen Bezug.
- source_word: מַחֲמַדִּים
  choice: begehrenswert
  rationale: Das Substantiv bezeichnet Begehrenswertes, Kostbares oder Liebliches; der Plural wirkt wahrscheinlich intensiv beziehungsweise abstrahierend. Das prädikative „begehrenswert“ vermittelt den Sinn idiomatisch und bleibt im unmittelbaren Kontext des Liebesliedes.
- source_word: דּוֹדִי
  choice: mein Geliebter
  rationale: Das Wort ist im Hohelied eine vertraute Bezeichnung für den geliebten Mann. „Mein Geliebter“ wahrt Intimität und poetische Würde.
- source_word: רֵעִי
  choice: mein Freund
  rationale: Das Substantiv kann Freund, Gefährte oder Vertrauter bedeuten. „Mein Freund“ ist direkt und lässt neben „mein Geliebter“ die Beziehungsbreite des Hebräischen stehen.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: ihr Töchter Jerusalems
  rationale: Die traditionelle Bildform wird als direkte Anrede bewahrt. „Ihr“ macht den Vokativ in modernem Deutsch deutlich, ohne ihn altertümlich mit „o“ wiederzugeben.
theological_decisions:
- issue: Mögliche messianische oder devotional-theologische Überdeutung von מַחֲמַדִּים
  choice: Das Wort wird im unmittelbaren poetischen Sinn als „begehrenswert“ auf den von der Frau gepriesenen Geliebten bezogen.
  alternative: Eine traditionelle Formulierung wie „ganz und gar lieblich“ könnte spätere devotional-messianische Assoziationen begünstigen; ebenso wäre eine titelartige Deutung möglich.
  rationale: Der hebräische Wortlaut verlangt hier keine christologische oder titelartige Lesart. Die Übersetzung gibt daher den Sinn innerhalb des Liebesgedichts wieder, ohne spätere theologische Bezüge auszuschließen oder in den Text hineinzutragen.
translation_notes:
  register: Modernes, poetisch-würdevolles Standarddeutsch. Die Wiederholung „Das ist …, das ist …“ bewahrt die emphatische Parallelstruktur des Hebräischen. Das altertümliche Anredepartikel „o“ wird vermieden; „ihr Töchter Jerusalems“ bleibt dennoch feierlich und verständlich.
