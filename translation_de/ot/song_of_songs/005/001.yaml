  text: בָּ֣אתִי לְ/גַנִּ/י֮ אֲחֹתִ֣/י כַלָּה֒ אָרִ֤יתִי מוֹרִ/י֙ עִם בְּשָׂמִ֔/י אָכַ֤לְתִּי יַעְרִ/י֙ עִם דִּבְשִׁ֔/י שָׁתִ֥יתִי יֵינִ֖/י עִם חֲלָבִ֑/י אִכְל֣וּ רֵעִ֔ים שְׁת֥וּ וְ/שִׁכְר֖וּ דּוֹדִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/001.yaml
  text: I have come into my garden[a], my sister, my bride; I have gathered my myrrh with my spice. I have eaten my honeycomb with my honey; I have drunk my wine with my milk. Eat, friends; drink, and be drunk, beloved ones.
translation:
  language: de
  text: Ich bin in meinen Garten gekommen, meine Schwester, meine Braut; ich habe meine Myrrhe samt meinem Balsam eingesammelt, meine Wabe samt meinem Honig gegessen, meinen Wein samt meiner Milch getrunken. Esst, Freunde! Trinkt und berauscht euch, ihr Liebenden![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wenn das hebräische Wort nicht als Anrede verstanden wird: „Trinkt und berauscht euch an Liebe!“ Das Wort kann Liebende, Liebe oder Liebkosungen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּאתִי לְגַנִּי
  choice: Ich bin in meinen Garten gekommen
  rationale: Das Qal-Perfekt bezeichnet das vollzogene Kommen; das deutsche Perfekt klingt in gegenwärtiger poetischer Rede natürlich. לְ bezeichnet hier das Ziel der Bewegung und wird idiomatisch mit „in“ wiedergegeben.
- source_word: אֲחֹתִי כַלָּה
  choice: meine Schwester, meine Braut
  rationale: Die beiden Anreden bleiben getrennt erhalten und bewahren so die eigentümliche, zärtliche Bildsprache des Hohelieds.
- source_word: אָרִיתִי מוֹרִי עִם בְּשָׂמִי
  choice: Ich habe meine Myrrhe samt meinem Balsam gepflückt
  rationale: אָרָה bezeichnet das Einsammeln oder Pflücken. בֹּשֶׂם meint einen wohlriechenden Stoff; „Balsam“ wahrt hier die konkrete Duftvorstellung besser als das im Deutschen missverständliche singularische „Gewürz“.
- source_word: אָכַלְתִּי יַעְרִי עִם דִּבְשִׁי
  choice: meine Wabe samt meinem Honig gegessen
  rationale: יַעַר bezeichnet hier aufgrund der Verbindung mit Honig die Honigwabe beziehungsweise den Wabenhonig. „Wabe“ erhält die knappe Parallelstruktur.
- source_word: שָׁתִיתִי יֵינִי עִם חֲלָבִי
  choice: meinen Wein samt meiner Milch getrunken
  rationale: Die Gegenstände und ihre Possessivformen werden wörtlich bewahrt; „samt“ gibt עִם in der dreifachen poetischen Reihung natürlich wieder.
- source_word: אִכְלוּ רֵעִים
  choice: Esst, Freunde!
  rationale: רֵעִים ist als direkte Anrede an Gefährten oder Freunde verständlich; der Imperativ Plural wird unmittelbar wiedergegeben.
- source_word: שְׁתוּ וְשִׁכְרוּ דּוֹדִים
  choice: Trinkt und berauscht euch, ihr Liebenden!
  rationale: שׁכר bedeutet im Qal „berauscht werden/sich berauschen“. דּוֹדִים kann als Vokativ „Liebende“ oder als Bezeichnung der Liebe beziehungsweise Liebkosungen verstanden werden; der Haupttext folgt der syntaktisch unmittelbaren vokativischen Lesart.
theological_decisions:
- issue: Bedeutung von דּוֹדִים in der Schlussaufforderung
  choice: 'vokativisch: „ihr Liebenden“'
  alternative: 'substantivisch: „berauscht euch an der Liebe“ beziehungsweise „werdet trunken von Liebe“'
  rationale: Der unmarkierte Vokativ passt parallel zu רֵעִים („Freunde“) und fügt kein im Hebräischen ausdrücklich vorhandenes „mit/von“ ein. Da דּוֹדִים im Hohelied jedoch auch Liebe oder Liebkosungen bezeichnen kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, gehobene und sinnlich-konkrete Sprache. Die wiederholten Possessivformen und die dreigliedrige Abfolge von Pflücken, Essen und Trinken bleiben erhalten; kurze Ausrufe geben der abschließenden Einladung Nachdruck.
