base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/013.yaml
  text: You who dwell in the gardens[a], companions are listening for your voice; let me hear it.
translation:
  language: de
  text: 'Du, die du in den Gärten wohnst: Gefährten lauschen deiner Stimme. Lass mich deine Stimme hören![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Lass mich hören“; die hebräische Kausativform kann auch „Veranlasse mich zu hören“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹשֶׁבֶת
  choice: Du, die du … wohnst
  rationale: Das substantivierte feminine Singularpartizip wird als direkte Anrede an die Frau wiedergegeben. „Wohnst“ drückt den fortdauernden Aufenthalt natürlich und poetisch aus.
- source_word: בַּגַּנִּים
  choice: in den Gärten
  rationale: Die Präposition und der bestimmte Plural werden unmittelbar und idiomatisch wiedergegeben; der Plural bleibt erhalten.
- source_word: חֲבֵרִים
  choice: die Gefährten
  rationale: „Gefährten“ wahrt den relationalen und poetischen Ton, ohne die Art oder Tiefe der Beziehung genauer festzulegen, als es das Hebräische tut.
- source_word: מַקְשִׁיבִים לְקוֹלֵךְ
  choice: lauschen deiner Stimme
  rationale: „Lauschen“ bezeichnet aufmerksames, erwartungsvolles Hören und bildet die Verbindung mit לְ idiomatisch ab, ohne zwischen „zuhören“ und „auf etwas warten“ unnötig festzulegen.
- source_word: הַשְׁמִיעִינִי
  choice: lass mich deine Stimme hören
  rationale: Der feminine Hifil-Imperativ mit Suffix der ersten Person Singular bedeutet formal „veranlasse mich zu hören“. Die gewählte Form ist natürliches Deutsch; die Wiederholung von „deine Stimme“ macht den im Hebräischen aus dem Zusammenhang erschlossenen Bezug eindeutig.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Der Gedankenstrich fasst die Aussage über die Gefährten als eingeschobene Beobachtung, während Anrede und Bitte eng verbunden bleiben. Das feminine Gegenüber ist durch „die du“ erkennbar; eine über den Text hinausgehende allegorische oder konfessionelle Deutung wird vermieden.
