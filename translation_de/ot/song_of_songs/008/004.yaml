base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/004.yaml
  text: 'I adjure you[b][a], daughters of Jerusalem: why should you awaken or stir up love until it desires?'
translation:
  language: de
  text: 'Ich beschwöre euch, ihr Töchter Jerusalems: Warum solltet ihr die Liebe wecken oder aufrütteln, bis sie selbst es will?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ich beschwöre euch …: Weckt die Liebe nicht und rüttelt sie nicht auf, bis sie selbst es will.“ Die hebräische Form ist eine Frage, wirkt in diesem feierlichen Zusammenhang aber zugleich wie eine eindringliche Mahnung. Das feminine Verb bezieht sich auf „die Liebe“ und personifiziert sie als etwas, das nicht erzwungen werden soll.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי
  choice: Ich beschwöre euch
  rationale: Der Hifil von שׁבע bezeichnet hier eine feierliche Verpflichtung beziehungsweise Beschwörung. „Ich beschwöre euch“ bewahrt den ernsten, gehobenen Ton und die erste Person Singular.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: ihr Töchter Jerusalems
  rationale: Die wörtliche poetische Anrede wird beibehalten; das eingefügte „ihr“ kennzeichnet im Deutschen natürlich den Vokativ.
- source_word: מַה
  choice: Warum wollt ihr
  rationale: מַה wird als Frage mit prohibitiver beziehungsweise mahnender Wirkung wiedergegeben, ohne die im Hebräischen vorhandene Frageform stillschweigend in einen ausdrücklichen Imperativ umzuwandeln.
- source_word: תָּעִירוּ
  choice: wecken
  rationale: Das Hifil von עור bedeutet „wecken“. Die Formulierung erhält das Bild der personifizierten Liebe.
- source_word: תְּעֹרְרוּ
  choice: aufrütteln
  rationale: Das zweite, verwandte Verb wird durch einen anderen, aber semantisch nahen Ausdruck wiedergegeben, sodass die poetische Doppelung hörbar bleibt.
- source_word: הָאַהֲבָה
  choice: die Liebe
  rationale: „Liebe“ lässt offen, ob die Erfahrung, Leidenschaft oder Macht der Liebe gemeint ist, und übernimmt die Personifizierung des hebräischen Textes.
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: bevor sie selbst es will
  rationale: חפץ drückt Wollen, Verlangen oder Gefallen aus. Das feminine Verb bezieht sich grammatisch auf die feminine „Liebe“. „Sie selbst“ macht diese Personifizierung in natürlichem Deutsch sichtbar, ohne ein bestimmtes Objekt des Wollens zu ergänzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Klang. Die Frageform des Hebräischen und die Personifizierung der Liebe bleiben erhalten; „bevor sie selbst es will“ ist idiomatischer als das im Deutschen missverständliche „bis sie will“.
