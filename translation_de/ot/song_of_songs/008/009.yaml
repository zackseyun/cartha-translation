  text: אִם חוֹמָ֣ה הִ֔יא נִבְנֶ֥ה עָלֶ֖י/הָ טִ֣ירַת כָּ֑סֶף וְ/אִם דֶּ֣לֶת הִ֔יא נָצ֥וּר עָלֶ֖י/הָ ל֥וּחַ אָֽרֶז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/009.yaml
  text: If she is a wall[a], we will build on her a battlement of silver; but if she is a door[b], we will enclose her with a board of cedar.
translation:
  language: de
  text: Ist sie eine Mauer, bauen wir auf ihr eine Zinne aus Silber[a]; ist sie aber eine Tür, verschließen wir sie mit einem Zedernbrett[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen silbernen Turmaufsatz“. Das hebräische Wort kann ein turmartiges oder befestigtes Bauelement bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „umgeben/verbarrikadieren wir sie mit einer Zedernplanke“. Das hebräische Verb kann „umschließen“, „einschließen“, „belagern“ oder „bewachen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: Mauer
  rationale: Das Substantiv bezeichnet eine Mauer. Die konkrete Metapher bleibt erhalten, ohne ihre mögliche Bedeutung als Bild für Standhaftigkeit oder sexuelle Unzugänglichkeit auszudeuten.
- source_word: נִבְנֶה
  choice: bauen wir
  rationale: Der Qal-Imperfekt der 1. Person Plural bezeichnet hier im Bedingungssatz die beabsichtigte künftige Handlung. Die deutsche Präsensform ist in dieser Konstruktion natürlich und zukunftsbezogen.
- source_word: טִירַת כָּסֶף
  choice: silberne Zinnen
  rationale: טִירָה bezeichnet hier wahrscheinlich ein befestigtes oder turmartiges Bauelement. „Silberne Zinnen“ passt zum Bild der Mauer und vermittelt sowohl Verstärkung als auch Schmuck, ohne die unsichere architektonische Einzelheit zu stark festzulegen.
- source_word: דֶּלֶת
  choice: Tür
  rationale: „Tür“ ist die gewöhnliche Bedeutung und bewahrt den Gegensatz zur Mauer. Eine Übertragung wie „Tor“ ist möglich, aber weniger unmittelbar.
- source_word: נָצוּר
  choice: versperren wir
  rationale: Das Verb kann das Umschließen, Einschließen, Verbarrikadieren oder Bewachen ausdrücken. Zusammen mit einem Zedernbrett gibt „versperren“ das konkrete Bild natürlich wieder; die Bedeutungsbreite wird in der Fußnote offengehalten.
- source_word: לוּחַ אָרֶז
  choice: Zedernbrett
  rationale: לוּחַ bezeichnet ein Brett, eine Planke oder Tafel. Das Kompositum „Zedernbrett“ ist knapp, konkret und idiomatisch.
- source_word: עָלֶיהָ
  choice: auf ihr / sie mit
  rationale: Im ersten Halbvers wird עַל räumlich als „auf ihr“ wiedergegeben. Im zweiten verlangt die natürliche deutsche Verbindung mit „versperren“ die Konstruktion „sie mit“; der zugrunde liegende Gedanke des Anbringens oder Umschließens bleibt gewahrt.
- source_word: וְאִם
  choice: ist sie aber
  rationale: Das formale „und wenn“ leitet eine kontrastierende zweite Möglichkeit ein. „Aber“ macht diesen Gegensatz im Deutschen klar und natürlich.
theological_decisions:
- issue: Deutung der Bilder „Mauer“ und „Tür“
  choice: Die architektonischen Bilder werden ohne ausdrückliche moralische oder sexuelle Erklärung wiedergegeben.
  alternative: Die Mauer als Keuschheit und die Tür als sexuelle Zugänglichkeit ausdrücklich deuten.
  rationale: Der Vers selbst entfaltet die Bedeutung der Bilder nicht ausdrücklich. Eine deutende Übersetzung würde die poetische Offenheit und die Spannung des Zusammenhangs vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Die konkreten Bilder und der Gegensatz zwischen Mauer und Tür bleiben erhalten; unsichere architektonische und verbale Nuancen werden in Fußnoten ausgewiesen.
