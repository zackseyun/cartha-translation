base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/005.yaml
  text: Who is this coming up from the wilderness[a], leaning on her beloved? Under the apple tree I awakened you; there your mother was in labor with you[c][b]; there she who bore you was in labor.
translation:
  language: de
  text: Wer ist sie, die aus der Wildnis heraufkommt und sich an ihren Geliebten lehnt? Unter dem Apfelbaum[a] habe ich dich geweckt[b][c]. Dort lag deine Mutter mit dir in den Wehen; dort lag sie, die dich gebar, in den Wehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Aprikosenbaum“. Welche Baumart das hebräische Wort genau bezeichnet, ist unsicher; „Apfelbaum“ ist die traditionelle Wiedergabe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „habe ich dich erregt“. Das hebräische Verb kann im Zusammenhang dieser Liebesdichtung mehr als bloßes Aufwecken anklingen lassen.'
    reason: alternative_reading
  - marker: c
    text: In der Mitte des Verses wechselt die Rede wahrscheinlich von einer beobachtenden Stimme zur direkten Anrede. Wer hier spricht, sagt der hebräische Text nicht ausdrücklich.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹלָה
  choice: heraufkommt
  rationale: Das Partizip bezeichnet ein Hinaufgehen oder Heraufkommen; „heraufkommt“ gibt die Bewegung natürlich und anschaulich wieder.
- source_word: הַמִּדְבָּר
  choice: die Wildnis
  rationale: מִדְבָּר kann Wüste oder unbebautes Wildnisgebiet bezeichnen. „Wildnis“ bewahrt den weiteren Bedeutungsumfang.
- source_word: מִתְרַפֶּקֶת עַל
  choice: sich an … lehnt
  rationale: Die seltene reflexive Form beschreibt enge körperliche Anlehnung oder Verbundenheit; die Formulierung passt zur Präposition עַל und zur Liebesszene.
- source_word: דּוֹדָהּ
  choice: ihren Geliebten
  rationale: דּוֹד bezeichnet im Hohelied den männlichen Geliebten; „Geliebter“ ist präzise, würdig und im Deutschen natürlich.
- source_word: תַּחַת הַתַּפּוּחַ
  choice: Unter dem Apfelbaum
  rationale: Die traditionelle Wiedergabe ist „Apfelbaum“, obwohl die genaue Baumart unsicher ist; diese Unsicherheit wird in einer Fußnote bewahrt.
- source_word: עוֹרַרְתִּיךָ
  choice: habe ich dich geweckt
  rationale: עור kann „wecken“ oder „erregen“ bedeuten. „Geweckt“ wahrt die Grundbedeutung, ohne einen möglichen erotischen Nebensinn auszuschließen oder festzuschreiben.
- source_word: חִבְּלַתְךָ
  choice: lag deine Mutter mit dir in den Wehen
  rationale: Das Verb bezeichnet hier am ehesten die Wehen bei der Geburt. Die deutsche Wendung ist klar und erhält den Bezug auf das Kind.
- source_word: יְלָדַתְךָ
  choice: sie, die dich gebar
  rationale: ילד bezeichnet das Gebären. „Die dich gebar“ ist knapp, würdig und bildet die hebräische Parallelzeile eng nach.
- source_word: שָׁמָּה ... שָׁמָּה
  choice: Dort ... dort
  rationale: Die Wiederholung wird beibehalten, um Nachdruck und poetischen Parallelismus des Hebräischen zu bewahren.
theological_decisions:
- issue: Sprecher- und Adressatenwechsel in der zweiten Vershälfte
  choice: 'Die erste Hälfte erscheint als beschreibende Frage, danach folgt unvermittelt die direkte Anrede: „habe ich dich geweckt … deine Mutter“; die Sprecheridentität bleibt offen.'
  alternative: Den ganzen Vers den Töchtern Jerusalems zuschreiben oder die zweite Hälfte ausdrücklich als Rede der Frau an den Mann kennzeichnen.
  rationale: Das Hebräische wechselt von der dritten Person („ihren Geliebten“) zur zweiten Person. Die Übersetzung bewahrt diesen literarischen Wechsel, ohne eine nicht ausdrücklich genannte Sprecheridentität festzulegen.
- issue: Möglicher erotischer Sinn von עוֹרַרְתִּיךָ
  choice: Im Haupttext „geweckt“, mit „erregt“ als Fußnotenalternative.
  alternative: Im Haupttext „erregt“.
  rationale: Im Kontext der Liebesdichtung ist ein erotischer Anklang möglich, doch das Verb verlangt ihn nicht eindeutig. Die offene Spannung wird nicht zugunsten einer eindeutigen Deutung aufgelöst.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer poetischer Satzführung. Die Wiederholung „dort … dort“ und der abrupte Personenwechsel bleiben erhalten. Archaische Formen werden vermieden; „gebar“ wird wegen seiner knappen, poetischen Funktion gezielt verwendet.
