base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/014.yaml
  text: Flee[a], my beloved[c][b], and be like a gazelle or a young stag on the mountains of spices.
translation:
  language: de
  text: Flieh[a], mein Geliebter[b], und sei wie eine Gazelle oder ein junger Hirsch[c] auf den Bergen der Gewürze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann auch mit „Lauf davon“ wiedergegeben werden. Im Bild dieses Liebesgedichts bezeichnet es wahrscheinlich eine schnelle Bewegung und nicht unbedingt eine Flucht aus Angst.
    reason: lexical_alternative
  - marker: b
    text: Vgl. Hohelied 2,17, wo ein ähnliches Bild vom Geliebten als Gazelle oder jungem Hirsch erscheint.
    reason: cross_reference
  - marker: c
    text: 'Wörtlicher: „ein Jungtier der Hirsche“; möglich ist auch „ein junger Hirsch“ beziehungsweise allgemeiner „ein junges Tier aus der Hirschfamilie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַח
  choice: Flieh
  rationale: Der Imperativ bedeutet zunächst „flieh“ oder „lauf davon“. „Flieh“ bewahrt die Dringlichkeit und die kräftige Bewegungsbildlichkeit des Hebräischen; der Zusammenhang muss dabei keine Flucht aus Angst bezeichnen.
- source_word: דּוֹדִי
  choice: mein Geliebter
  rationale: דּוֹד bezeichnet im Hohelied den männlichen Geliebten. „Mein Geliebter“ ist im modernen Standarddeutsch klar, würdevoll und relational eindeutig.
- source_word: וּדְמֵה לְךָ
  choice: und sei wie
  rationale: Die Wendung fordert den Geliebten auf, einer Gazelle beziehungsweise einem jungen Hirsch zu gleichen. „Sei wie“ gibt dies knapp und idiomatisch wieder, ohne das im Deutschen schwerfällige „mach dich gleich“.
- source_word: לִצְבִי
  choice: eine Gazelle
  rationale: צְבִי bezeichnet eine Gazelle beziehungsweise ein ähnlich anmutiges Wildtier. „Gazelle“ ist die klare und geläufige moderne Entsprechung.
- source_word: אֹו לְעֹפֶר הָאַיָּלִים
  choice: oder ein junger Hirsch
  rationale: עֹפֶר bezeichnet ein Jungtier, während אַיָּלִים Hirsche beziehungsweise männliches Rotwild meint. „Junger Hirsch“ erhält den Bezug auf den männlichen Geliebten; „junges Reh“ wäre ungenauer.
- source_word: עַל הָרֵי בְשָׂמִים
  choice: auf den Bergen der Gewürze
  rationale: עַל bezeichnet hier den Ort beziehungsweise Bewegungsraum „auf“ den Bergen. בְשָׂמִים sind wohlriechende Gewürze, Duftstoffe oder Balsame; „Berge der Gewürze“ wahrt das offene, sinnliche Bild, ohne einen bestimmten Stoff festzulegen.
