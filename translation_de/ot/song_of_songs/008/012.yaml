  register: Modernes, allgemein verständliches und zugleich poetisch-würdevolles Standarddeutsch. Die knappe Satzform und die Bildsprache des Hebräischen bleiben erhalten; unausgesprochene Währungsangaben und die mögliche metaphorische Bedeutung des Weinbergs werden nicht in den Haupttext hineingedeutet.
