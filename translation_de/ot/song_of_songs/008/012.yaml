  text: כָּרְמִ֥/י שֶׁ/לִּ֖/י לְ/פָנָ֑/י הָ/אֶ֤לֶף לְ/ךָ֙ שְׁלֹמֹ֔ה וּ/מָאתַ֖יִם לְ/נֹטְרִ֥ים אֶת פִּרְיֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/012.yaml
  text: My vineyard[a], my very own, is before me. The thousand is for you, Solomon[b], and two hundred for those who keep its fruit.
translation:
  language: de
  text: Mein eigener Weinberg liegt vor mir.[a] Die Tausend sind für dich, Salomo,[b] und zweihundert für die, die seine Frucht hüten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '»Liegt vor mir« kann auch bedeuten: »ist in meiner Obhut« oder »steht unter meiner Verfügung«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Tausend Silberstücke sind für dich, Salomo.« Im vorherigen Vers werden tausend Silberstücke erwähnt; hier steht jedoch nur »die Tausend«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרְמִי שֶׁלִּי
  choice: Mein eigener Weinberg
  rationale: כֶּרֶם bedeutet gewöhnlich »Weinberg« und bleibt als poetisches Bild erhalten. Das nachgestellte שֶׁלִּי betont, dass er der Sprecherin selbst gehört; »mein eigener« gibt diese Verstärkung in natürlichem Deutsch wieder.
- source_word: לְפָנָי
  choice: liegt vor mir
  rationale: Die Wendung bedeutet wörtlich »vor mir«. »Liegt vor mir« bewahrt sowohl die räumliche Vorstellung als auch die mögliche Bedeutung, dass der Weinberg in ihrer Verfügung oder Obhut steht.
- source_word: הָאֶלֶף
  choice: Die Tausend
  rationale: Im Hebräischen steht hier nur die bestimmte Zahl »die Tausend«; eine Währungsangabe wird in diesem Vers nicht wiederholt. Der Rückbezug auf die tausend Silberstücke im vorherigen Vers bleibt dennoch erkennbar.
- source_word: לְךָ שְׁלֹמֹה
  choice: sind für dich, Salomo
  rationale: Die Präposition לְ bezeichnet hier Zuweisung oder Zugehörigkeit. »Sind für dich« gibt dies natürlich wieder und wahrt die direkte Anrede.
- source_word: וּמָאתַיִם
  choice: und zweihundert
  rationale: Die Zahl wird ohne ergänzte Währungsbezeichnung wiedergegeben, wie im hebräischen Vers.
- source_word: לְנֹטְרִים אֶת־פִּרְיוֹ
  choice: für die, die seine Frucht hüten
  rationale: נטר kann »hüten«, »bewachen« oder »in Obhut halten« bedeuten. »Hüten« passt zum Weinberg und lässt offen, ob Bewachung oder Bewirtschaftung gemeint ist; der Singular »Frucht« entspricht פִּרְיוֹ.
theological_decisions: []
