base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/010.yaml
  text: I am a wall[a], and my breasts are like towers; then I was in his eyes like one who finds peace.
translation:
  language: de
  text: 'Ich bin eine Mauer,

    und meine Brüste sind wie Türme.

    Da war ich in seinen Augen

    wie eine, die Frieden findet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie eine, die Wohlergehen erlangt“. Der hebräische Ausdruck kann auch das Finden von Ganzheit, Wohlergehen oder Gunst bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: Mauer
  rationale: Das Substantiv bezeichnet eine Mauer, wahrscheinlich eine Stadt- oder Schutzmauer. „Mauer“ bewahrt das klare, feste Bild, ohne es militärisch zu überpräzisieren.
- source_word: שָׁדַי
  choice: meine Brüste
  rationale: Die hebräische Form bezeichnet ausdrücklich die Brüste der Sprecherin. Die direkte Wiedergabe erhält die körperliche Bildsprache des Gedichts.
- source_word: כַּמִּגְדָּלוֹת
  choice: wie Türme
  rationale: Der Vergleich ist architektonisch und steht im Plural. „Wie Türme“ greift das Bild der Mauer natürlich auf.
- source_word: אָז
  choice: da
  rationale: Das Adverb bezeichnet einen zeitlichen oder folgernden Übergang. „Da“ ist knapp und lässt beide Nuancen offen.
- source_word: הָיִיתִי
  choice: war ich
  rationale: Die Qal-Perfektform von היה kann je nach Zusammenhang „war“ oder „wurde“ bedeuten. „War ich“ gibt die Zustandsaussage wieder, ohne ausdrücklich einen Zustandswechsel einzutragen.
- source_word: בְּעֵינָיו
  choice: in seinen Augen
  rationale: Die hebräische Wendung bezeichnet die Wahrnehmung oder Einschätzung einer Person. Die bildgetreue deutsche Formulierung ist geläufig und verständlich.
- source_word: כְּמוֹצְאֵת
  choice: wie eine, die … findet
  rationale: Das feminine Partizip von מצא bedeutet hier am natürlichsten „findend“ beziehungsweise „eine, die findet/erlangt“. Die Formulierung bewahrt das feminine Singular und legt die genaue Nuance nicht weiter fest.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen, Ganzheit und gegebenenfalls Gunst. „Frieden“ ist die knappste und vertrauteste Entsprechung; die größere Bedeutungsbreite wird in der Fußnote kenntlich gemacht.
