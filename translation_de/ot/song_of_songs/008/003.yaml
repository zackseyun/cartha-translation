  text: His left hand is under my head[a], and his right hand embraces me.
translation:
  language: de
  text: Seine Linke liegt unter meinem Kopf[a], und seine Rechte umarmt mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Seine Linke unter meinem Kopf“; das Verb „liegt“ ist im Hebräischen nicht ausdrücklich vorhanden.'
