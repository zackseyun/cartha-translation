lexical_decisions:
- source_word: שְׂמֹאלוֹ
  choice: seine Linke
  rationale: Das Substantiv bezeichnet die linke Seite beziehungsweise Hand. Im Deutschen ist die substantivierte Form „seine Linke“ natürlich und bewahrt die knappe Ausdrucksweise des Hebräischen, ohne ausdrücklich „Hand“ oder „Arm“ festzulegen.
- source_word: תַּחַת
  choice: unter
  rationale: Die Präposition bedeutet direkt „unter“ oder „unterhalb“; „unter“ ist hier die natürliche moderne Entsprechung.
- source_word: רֹאשִׁי
  choice: meinem Kopf
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der ersten Person Singular; der Dativ wird von „unter“ in der Ortsangabe verlangt.
- source_word: וִימִינוֹ
  choice: und seine Rechte
  rationale: Die koordinierte substantivierte Richtungsbezeichnung entspricht der parallelen Form „seine Linke“ und lässt wie das Hebräische offen, ob konkret Hand oder Arm gemeint ist.
- source_word: תְּחַבְּקֵנִי
  choice: umarmt mich
  rationale: חבק bedeutet „umarmen“. Das Imperfekt kann in dieser poetischen Szenenschilderung natürlich als Gegenwart wiedergegeben werden.
theological_decisions: []
