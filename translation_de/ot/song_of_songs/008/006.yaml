  text: שִׂימֵ֨/נִי כַֽ/חוֹתָ֜ם עַל לִבֶּ֗/ךָ כַּֽ/חוֹתָם֙ עַל זְרוֹעֶ֔/ךָ כִּֽי עַזָּ֤ה כַ/מָּ֨וֶת֙ אַהֲבָ֔ה קָשָׁ֥ה כִ/שְׁא֖וֹל קִנְאָ֑ה רְשָׁפֶ֕י/הָ רִשְׁפֵּ֕י אֵ֖שׁ שַׁלְהֶ֥בֶתְ יָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/006.yaml
  text: Set me as a seal upon your heart[a], as a seal upon your arm; for love is as strong as death, jealousy as relentless as Sheol. Its flashes are flashes of fire[c][b], a flame of Yah.
translation:
  language: de
  text: Lege mich wie ein Siegel auf dein Herz, wie ein Siegel auf deinen Arm; denn stark wie der Tod ist die Liebe, unerbittlich wie der Scheol die Eifersucht.[a] Ihre Funken sind Feuerfunken,[b] eine Flamme Jahs.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hart wie das Totenreich die Eifersucht“; Scheol bezeichnet den Bereich der Toten und kann in manchen Zusammenhängen auch mit „Grab“ wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Ihre Flammen sind Feuerflammen.“'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht hier die Kurzform des Gottesnamens: „eine Flamme Jahs“. Möglich ist auch ein verstärkender Sinn: „eine mächtige Flamme“ oder „eine lodernde Flamme“.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂימֵנִי
  choice: Lege mich
  rationale: Der Imperativ mit dem Suffix der ersten Person Singular formuliert eine unmittelbare, innige Bitte. „Lege mich“ ist im Deutschen natürlich und lässt das Bild des Siegels unverändert.
- source_word: כַחוֹתָם
  choice: wie ein Siegel
  rationale: חוֹתָם bezeichnet ein Siegel oder einen Siegelring als Zeichen von Zugehörigkeit, Identität oder Beglaubigung. „Siegel“ ist allgemein verständlich und trägt die Metapher an beiden Stellen.
- source_word: עַל לִבֶּךָ
  choice: an dein Herz
  rationale: „An dein Herz“ ist im Deutschen die natürliche räumliche Formulierung und bewahrt die poetische Nähe, ohne die Metapher auszudeuten.
- source_word: עַל זְרוֹעֶךָ
  choice: an deinen Arm
  rationale: זְרוֹעַ bedeutet „Arm“. Die wörtliche Wiedergabe erhält die Parallelität mit dem Herzen sowie das sichtbare, körperliche Bild.
- source_word: כִּי עַזָּה כַמָּוֶת אַהֲבָה
  choice: denn stark wie der Tod ist die Liebe
  rationale: עַזָּה kann „stark“, „mächtig“ oder „heftig“ bedeuten. Die vorangestellte Vergleichsgruppe und die Schlussstellung von „Liebe“ bewahren die markante poetische Struktur.
- source_word: קָשָׁה כִשְׁאוֹל קִנְאָה
  choice: unerbittlich wie der Scheol die Eifersucht
  rationale: קָשָׁה beschreibt hier Härte und Unnachgiebigkeit; „unerbittlich“ passt zur unausweichlichen Macht des Scheols. קִנְאָה wird als „Eifersucht“ wiedergegeben, damit die exklusive und spannungsreiche Seite der Liebe nicht zu bloßer Leidenschaft abgeschwächt wird.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Der hebräische Begriff wird als „Scheol“ beibehalten, weil er mehr als ein einzelnes Grab bezeichnen kann. Eine Fußnote erklärt die möglichen deutschen Verständnishilfen.
- source_word: רְשָׁפֶיהָ
  choice: Ihre Funken
  rationale: רֶשֶׁף kann einen Funken, eine Flamme oder einen feurigen Strahl bezeichnen. „Funken“ ist bildkräftig und im heutigen Deutsch gut verständlich; das feminine Suffix wird durch „ihre“ bewahrt.
- source_word: רִשְׁפֵּי אֵשׁ
  choice: sind Feuerfunken
  rationale: Die Wiederholung von רֶשֶׁף wird durch „Funken/Feuerfunken“ nachvollzogen. So bleibt die poetische Steigerung erhalten, ohne unnötig altertümlich zu klingen.
- source_word: שַׁלְהֶבֶתְ יָה
  choice: eine Flamme Jahs
  rationale: יָה ist die Kurzform des Gottesnamens. „Jah“ erhält dieses ausdrücklich vorhandene Element; der deutsche Genitiv „Jahs“ gibt die knappe hebräische Verbindung wieder. Die mögliche superlativische Deutung wird in einer Fußnote genannt.
theological_decisions:
- issue: Ob שַׁלְהֶבֶתְ יָה ausdrücklich auf den Gottesnamen verweist oder nur eine Steigerung ausdrückt
  choice: Das Element des Gottesnamens wird mit „eine Flamme Jahs“ ausdrücklich bewahrt.
  alternative: „eine mächtige Flamme“ oder „eine lodernde Flamme“
  rationale: Im hebräischen Text steht יָה, die Kurzform des Gottesnamens. Seine Beibehaltung wahrt eine mögliche theologische Bedeutung, während die umstrittene superlativische Deutung in der Fußnote offenbleibt.
- issue: Ob קִנְאָה im Liebesgedicht zu „Leidenschaft“ oder „Liebesglut“ abgemildert werden soll
  choice: „Eifersucht“
  alternative: „Leidenschaft“, „Liebesglut“ oder „Eifer“
  rationale: Das Substantiv bezeichnet häufig Eifersucht oder Eifer und bringt den Anspruch exklusiver Bindung zum Ausdruck. „Eifersucht“ bewahrt diese Spannung, statt sie durch eine ausschließlich positive Deutung aufzulösen.
- issue: Wie שְׁאוֹל wiederzugeben ist
  choice: „Scheol“ im Haupttext
  alternative: „Totenreich“ oder „Grab“
  rationale: „Scheol“ bewahrt die Eigenart und Bedeutungsbreite des hebräischen Begriffs. Die Fußnote ermöglicht ein unmittelbares Verständnis, ohne ihn auf eine bloße Grabstätte festzulegen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die parallele Satzstellung und die wiederholte Siegel- und Feuerbildsprache bleiben erhalten. „Scheol“ und „Jah“ bewahren wichtige hebräische Eigenheiten; Fußnoten erklären sie, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
