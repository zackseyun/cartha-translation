  text: אָח֥וֹת לָ֨/נוּ֙ קְטַנָּ֔ה וְ/שָׁדַ֖יִם אֵ֣ין לָ֑/הּ מַֽה נַּעֲשֶׂה֙ לַ/אֲחֹתֵ֔/נוּ בַּ/יּ֖וֹם שֶׁ/יְּדֻבַּר בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/008.yaml
  text: We have a little sister[a], and she has no breasts. What shall we do for our sister on the day when she is spoken for?
translation:
  language: de
  text: Wir haben eine kleine Schwester, und sie hat keine Brüste. Was sollen wir für unsere Schwester tun an dem Tag, an dem man um sie anhält[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an dem Tag, an dem über sie gesprochen wird“. Das Hebräische kann allgemein Gespräche über sie bezeichnen; im Zusammenhang sind wahrscheinlich Verhandlungen über eine Heirat gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָחוֹת לָנוּ
  choice: Wir haben eine … Schwester
  rationale: Die hebräische Besitzkonstruktion bedeutet wörtlich, dass uns eine Schwester gehört beziehungsweise dass wir eine Schwester haben. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt diesen Sinn.
- source_word: קְטַנָּה
  choice: kleine
  rationale: Das Adjektiv kann körperliche Kleinheit, Jugend oder einen geringen familiären Status bezeichnen. „Kleine“ erhält diese Bedeutungsbreite, ohne ein genaues Alter festzulegen.
- source_word: וְשָׁדַיִם אֵין לָהּ
  choice: und sie hat keine Brüste
  rationale: 'Das Hebräische ist konkret und lautet sinngemäß: „Brüste sind ihr nicht“. Die direkte Wiedergabe vermeidet es, die Deutung „noch nicht entwickelt“ ausdrücklich in den Text einzutragen.'
- source_word: מַה נַּעֲשֶׂה
  choice: Was sollen wir … tun
  rationale: Die Verbform drückt hier gemeinsames Überlegen aus. „Was sollen wir tun“ gibt diesen beratenden Ton idiomatisch wieder.
- source_word: לַאֲחֹתֵנוּ
  choice: für unsere Schwester
  rationale: Die Präposition ל bezeichnet hier am ehesten ein Handeln zugunsten der Schwester.
- source_word: בַּיּוֹם
  choice: an dem Tag
  rationale: Die zeitliche Wendung des Hebräischen wird ausdrücklich beibehalten und bleibt in modernem Deutsch verständlich.
- source_word: שֶׁיְדֻבַּר בָּהּ
  choice: an dem man um sie anhält
  rationale: Im Zusammenhang bezeichnet die passive Wendung wahrscheinlich Gespräche über eine Eheschließung oder einen Heiratsantrag. „Um sie anhalten“ gibt diesen wahrscheinlichen Sinn natürlich wieder; die allgemeinere Bedeutung wird in der Fußnote bewahrt.
