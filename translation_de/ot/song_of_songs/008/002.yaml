base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/002.yaml
  text: I would lead you and bring you into my mother’s house[a], where she taught me; I would give you spiced wine to drink[b], from the juice of my pomegranate.
translation:
  language: de
  text: Ich würde dich führen und dich in das Haus meiner Mutter bringen[a], die mich unterweisen würde. Ich würde dir Gewürzwein zu trinken geben[b], vom Saft meines Granatapfels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dort würdest du mich unterweisen.“ Die hebräische Verbform kann sowohl als 3. Person feminin Singular mit Bezug auf „meine Mutter“ als auch als 2. Person maskulin Singular mit Bezug auf den angesprochenen Geliebten verstanden werden. Wegen der knappen poetischen Satzfügung ist die Zuordnung umstritten.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „vom süßen Wein meines Granatapfels“. Das hebräische Wort kann frischen Saft, Most oder süßen Wein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶנְהָגֲךָ
  choice: Ich würde dich führen
  rationale: Das Qal-Imperfekt der 1. Person Singular mit Suffix der 2. Person maskulin Singular hat hier im poetischen Wunschbild am ehesten modalen Sinn. „Führen“ bewahrt die konkrete Bewegungsbedeutung.
- source_word: אֲבִיאֲךָ
  choice: und dich ... bringen
  rationale: Das Hifil-Imperfekt von בוא bezeichnet das Hineinbringen; zusammen mit אֶל und dem Haus ist die deutsche Konstruktion „in das Haus ... bringen“ natürlich.
- source_word: בֵּית אִמִּי
  choice: in das Haus meiner Mutter
  rationale: Die Status-constructus-Verbindung wird nach אֶל richtungsbezogen wiedergegeben. Die etwas feierlichere Form „das Haus meiner Mutter“ passt zum poetischen Register.
- source_word: תְּלַמְּדֵנִי
  choice: die mich unterwiesen hat
  rationale: Die Form ist Piel, 3. Person feminin Singular, mit Objektssuffix der 1. Person Singular und verweist grammatisch am natürlichsten auf die Mutter. Das deutsche Perfekt gibt den naheliegenden Rückblick idiomatisch wieder; die knappe hebräische Syntax bleibt in einer Fußnote als mehrdeutig ausgewiesen.
- source_word: אַשְׁקְךָ
  choice: Ich würde dir ... zu trinken geben
  rationale: Das Hifil von שקה bedeutet „tränken, zu trinken geben“. Diese Formulierung wahrt den kausativen Sinn, ohne im Deutschen Zwang anzudeuten.
- source_word: מִיַּיִן הָרֶקַח
  choice: Gewürzwein
  rationale: Die Wendung bezeichnet mit Gewürzen oder Duftstoffen zubereiteten Wein. „Gewürzwein“ ist knapp, verständlich und erhält die sinnliche Bildsprache.
- source_word: מֵעֲסִיס רִמֹּנִי
  choice: vom Saft meines Granatapfels
  rationale: עָסִיס kann Saft, Most oder süßen jungen Wein bezeichnen. „Saft“ wahrt die Fruchtvorstellung, ohne einen bestimmten Gärungsgrad festzulegen; der Singular und das Possessivsuffix werden beibehalten.
theological_decisions:
- issue: Bezug von תְּלַמְּדֵנִי
  choice: 'Das feminine Verb wird im Haupttext auf die Mutter bezogen: „die mich unterwiesen hat“.'
  alternative: „Dort würdest du mich unterweisen.“
  rationale: Die feminine Singularform weist grammatisch am ehesten auf אִמִּי („meine Mutter“). Wegen der äußerst knappen poetischen Syntax wird die abweichende Verknüpfung nicht ausgeschlossen, sondern in Fußnote [a] dokumentiert.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdig-poetischem Ton. Der Konditional „würde“ gibt den Wunsch- bzw. Vorstellungshorizont der Imperfektformen wieder. Die Wiederholung „Ich würde“ erhält die Parallelstruktur. Echte lexikalische und syntaktische Mehrdeutigkeit wird durch die Fußnoten offengehalten.
