  text: מַ֣יִם רַבִּ֗ים לֹ֤א יֽוּכְלוּ֙ לְ/כַבּ֣וֹת אֶת הָֽ/אַהֲבָ֔ה וּ/נְהָר֖וֹת לֹ֣א יִשְׁטְפ֑וּ/הָ אִם יִתֵּ֨ן אִ֜ישׁ אֶת כָּל ה֤וֹן בֵּית/וֹ֙ בָּ/אַהֲבָ֔ה בּ֖וֹז יָב֥וּזוּ לֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/007.yaml
  text: Many waters cannot quench love[a], nor can rivers sweep it away. If a man were to give all the wealth of his house for love, he would be utterly despised.
translation:
  language: de
  text: Viele Wasser können die Liebe nicht löschen, und Ströme können sie nicht fortschwemmen. Wenn ein Mann den ganzen Reichtum seines Hauses für die Liebe gäbe, würde man ihn zutiefst verachten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Man würde ihn ganz gewiss verachten.“ Das Hebräische verstärkt das Verb „verachten“ durch die Verbindung eines absoluten Infinitivs mit einer finiten Verbform.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם רַבִּים
  choice: Viele Wasser
  rationale: Die wörtliche, poetische Bildsprache bleibt erhalten; die Wendung bezeichnet gewaltige Wassermengen, ohne sie vorschnell als Flut zu deuten.
- source_word: לֹא יוּכְלוּ לְכַבּוֹת
  choice: können … nicht löschen
  rationale: כבה bezeichnet das Löschen eines Feuers. „Löschen“ bewahrt den poetischen Gegensatz zwischen Wasser und der in Vers 6 als Flamme beschriebenen Liebe.
- source_word: הָאַהֲבָה
  choice: die Liebe
  rationale: Das Substantiv bezeichnet hier Liebe; der bestimmte Artikel lässt sich im Deutschen natürlich und quellennah wiedergeben.
- source_word: וּנְהָרוֹת
  choice: und Ströme
  rationale: „Ströme“ gibt נהרות als stark fließende Gewässer wieder und bewahrt die Steigerung innerhalb des Parallelismus.
- source_word: לֹא יִשְׁטְפוּהָ
  choice: können sie nicht fortschwemmen
  rationale: שטף bezeichnet das Überfluten oder Wegschwemmen. „Fortschwemmen“ bringt die zerstörerische Kraft der Ströme und das feminine Objekt „die Liebe“ klar zum Ausdruck.
- source_word: אִם יִתֵּן אִישׁ
  choice: Wenn ein Mann … gäbe
  rationale: Der Konjunktiv kennzeichnet den vorgestellten Bedingungsfall; „ein Mann“ entspricht אִישׁ.
- source_word: כָּל הוֹן בֵּיתוֹ
  choice: den ganzen Reichtum seines Hauses
  rationale: הוֹן bezeichnet Reichtum oder Vermögen; „seines Hauses“ bewahrt die hebräische Struktur und kann den gesamten Hausstand beziehungsweise Besitz einschließen.
- source_word: בָּאַהֲבָה
  choice: für die Liebe
  rationale: Die Präposition ב hat hier einen knappen, möglicherweise transaktionalen Sinn. „Für die Liebe“ erhält diese Aussage, ohne sie ausdrücklich als Kaufgeschäft festzulegen.
- source_word: בּוֹז יָבֻזוּ לוֹ
  choice: würde man ihn zutiefst verachten
  rationale: Das unbestimmte „man“ gibt das nicht näher bestimmte pluralische Subjekt idiomatisch wieder; „zutiefst“ vermittelt die Verstärkung durch den absoluten Infinitiv mit finitem Verb.
theological_decisions:
- issue: Käuflichkeit der Liebe
  choice: „für die Liebe“ bleibt ohne erklärenden Zusatz stehen
  alternative: „um Liebe zu kaufen“ oder „im Tausch gegen Liebe“
  rationale: Der Kontext legt einen Tauschgedanken nahe, doch der knappe hebräische Ausdruck benennt weder ausdrücklich einen Kauf noch dessen genaue Art. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter poetischer Parallelstruktur. „Viele Wasser“ ist leicht gehoben, bleibt aber verständlich und hält das konkrete hebräische Bild fest.
