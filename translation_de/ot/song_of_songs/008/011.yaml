base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/011.yaml
  text: Solomon had a vineyard at Baal-hamon[a]; he gave the vineyard to keepers[c][b]. Each man was to bring a thousand pieces of silver for its fruit.
translation:
  language: de
  text: Salomo hatte einen Weinberg in Baal-Hamon. Er gab den Weinberg den Hütern[a]. Jeder sollte für seine Frucht tausend Silberstücke[b] bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Er übergab den Weinberg den Hütern.“ Das hebräische Verb bedeutet allgemein „geben“; im Zusammenhang kann es eine Überlassung zur Bewachung oder Bewirtschaftung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „tausend Silber“; eine bestimmte Gewichts- oder Münzeinheit wird im Hebräischen nicht genannt. „Für seine Frucht“ kann auch „mit seiner Frucht“ oder „aus seiner Frucht“ bedeuten. Das Possessivsuffix kann sich auf den Weinberg oder verteilt auf jeden Hüter beziehen.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: כֶּרֶם
  choice: Weinberg
  rationale: Das Substantiv bezeichnet einen kultivierten Weinberg, nicht einen einzelnen Weinstock.
- source_word: הָיָה לִשְׁלֹמֹה
  choice: Salomo hatte
  rationale: Die hebräische Besitzkonstruktion lautet wörtlich „war für Salomo“ und wird im Deutschen natürlich mit „Salomo hatte“ wiedergegeben.
- source_word: בְּבַעַל הָמוֹן
  choice: in Baal-Hamon
  rationale: Die Wortfolge wird am besten als Ortsname verstanden und entsprechend transkribiert.
- source_word: נָתַן אֶת הַכֶּרֶם לַנֹּטְרִים
  choice: Er übergab den Weinberg den Hütern
  rationale: נתן bedeutet allgemein „geben“; „übergab“ bewahrt diese Grundbedeutung und lässt im Zusammenhang die Beauftragung mit Bewachung oder Bewirtschaftung erkennen, ohne ein bestimmtes Pachtverhältnis vorauszusetzen.
- source_word: לַנֹּטְרִים
  choice: den Hütern
  rationale: Das von נטר abgeleitete Wort bezeichnet Menschen, die etwas hüten oder bewahren. „Hüter“ erhält diese Bedeutungsbreite.
- source_word: אִישׁ יָבִא
  choice: Jeder sollte … einbringen
  rationale: Der distributive Singular wird mit „jeder“ wiedergegeben; das Imperfekt bezeichnet hier die erwartete oder vereinbarte Leistung.
- source_word: בְּפִרְיוֹ
  choice: für seinen Ertrag
  rationale: פְּרִי kann im wirtschaftlichen Zusammenhang den Ertrag bezeichnen. Das maskuline Suffix kann sich grammatisch auf jeden Hüter beziehen; der Bezug auf den Weinberg beziehungsweise dessen Ertrag bleibt als Alternative möglich.
- source_word: אֶלֶף כָּסֶף
  choice: tausend Silberstücke
  rationale: Wörtlich steht „tausend Silber“; da keine Gewichtseinheit oder Münzbezeichnung genannt ist, vermeidet „Silberstücke“ die Ergänzung von „Schekel“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe wirtschaftliche Darstellung des Hebräischen bleibt erhalten. „Hüter“ ist bewusst weiter als „Pächter“, und die Fußnote bewahrt die Mehrdeutigkeit des Pronominalbezugs und der Präposition in בְּפִרְיוֹ.
