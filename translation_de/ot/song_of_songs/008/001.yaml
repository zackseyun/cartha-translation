base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/001.yaml
  text: Oh[a], that you were like a brother to me, who nursed at my mother’s breasts! If I found you outside, I would kiss you[c][b], and no one would despise me.
translation:
  language: de
  text: Ach[a], wärst du mir doch wie ein Bruder, der an der Brust meiner Mutter gestillt wurde! Fände ich dich draußen, würde ich dich küssen[b], und niemand würde mich verachten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn du mir doch wie ein Bruder wärst!« Die hebräische Wendung am Anfang drückt einen Wunsch aus.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist ein Bruder, der an derselben mütterlichen Brust gestillt wurde; ihm durfte sie in der Öffentlichkeit Zuneigung zeigen, ohne Anstoß zu erregen.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: »Auch sie würden mich nicht verachten.« Der unbestimmte Plural bezeichnet die allgemeine Reaktion der Leute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֶּנְךָ
  choice: Ach, wärst du mir doch
  rationale: Die hebräische Wendung מִי יִתֵּן drückt hier einen Wunsch aus, keine wörtliche Frage nach einem Geber. Die deutsche Wunschform mit »doch« gibt den optativischen Ton natürlich wieder.
- source_word: כְּאָח לִי
  choice: wie ein Bruder
  rationale: כְּ kennzeichnet einen Vergleich, keine tatsächliche Verwandtschaft. Zusammen mit dem vorangestellten »mir« bleibt auch die persönliche Beziehung des לִי erhalten.
- source_word: יוֹנֵק שְׁדֵי אִמִּי
  choice: der an der Brust meiner Mutter gestillt wurde
  rationale: Das Partizip יוֹנֵק bezeichnet einen Säugenden beziehungsweise Gestillten. Die Formulierung bewahrt das konkrete Bild, klingt im modernen Deutschen jedoch natürlicher als eine wörtliche Wiedergabe mit »saugen«.
- source_word: אֶמְצָאֲךָ בַחוּץ
  choice: Fände ich dich draußen
  rationale: Der Kontext legt eine gedachte, wunschhafte Situation nahe. »Draußen« wahrt die Breite von בַחוּץ und macht zugleich den öffentlichen Raum kenntlich, ohne ihn auf eine Straße einzuengen.
- source_word: אֶשָׁקְךָ
  choice: würde ich dich küssen
  rationale: Der Konjunktiv führt die gedachte Situation aus dem vorherigen Satzglied im natürlichen Deutschen fort.
- source_word: גַּם לֹא יָבֻזוּ לִי
  choice: und niemand würde mich verachten
  rationale: 'Die dritte Person Plural kann unbestimmt gebraucht sein: »man« beziehungsweise »die Leute«. »Niemand« gibt die allgemeine gesellschaftliche Missbilligung idiomatisch wieder.'
theological_decisions:
- issue: Geschwistervergleich in einem erotischen Gedicht
  choice: Den Geliebten vergleichend als Bruder bezeichnen und das Stillbild beibehalten
  alternative: Die Geschwistervorstellung abschwächen, umschreiben oder als tatsächliche Verwandtschaft verstehen
  rationale: Der Text äußert keine tatsächliche verwandtschaftliche Identität, sondern den Wunsch nach der gesellschaftlichen Freiheit, einem Bruder in der Öffentlichkeit Zuneigung zeigen zu dürfen. Die Übersetzung bewahrt die auffällige Bildsprache, ohne zusätzliche moralische oder allegorische Deutungen einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit poetisch-würdevollem Ton. »Ach … doch« trägt den sehnsüchtigen Wunsch; »an der Brust … gestillt« erhält das körperlich-konkrete Bild ohne unnötig altertümliche Ausdrucksweise. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Aussagen.
