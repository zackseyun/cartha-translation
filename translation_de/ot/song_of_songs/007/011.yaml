  text: I am my beloved's[a], and his desire is for me.
translation:
  language: de
  text: Ich gehöre meinem Geliebten[a], und sein Verlangen richtet sich auf mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ich bin für meinen Geliebten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Ich
  rationale: Das ausdrücklich gesetzte Personalpronomen der 1. Person Singular wird beibehalten und trägt die poetische Betonung.
- source_word: לְדוֹדִי
  choice: gehöre meinem Geliebten
  rationale: Die präpositionshaltige Nominalklausel bezeichnet im Zusammenhang des wiederkehrenden Kehrverses die Zugehörigkeit zum Geliebten. „Gehören“ gibt dies in natürlichem modernem Deutsch wieder; die formal nähere Alternative wird in der Fußnote bewahrt.
- source_word: וְעָלַי
  choice: und … auf mich
  rationale: עַל bezeichnet zusammen mit תְּשׁוּקָה die Richtung beziehungsweise das Ziel des Verlangens. Die Formulierung „richtet sich auf mich“ ist im Deutschen idiomatisch und bewahrt diese Ausrichtung.
- source_word: תְּשׁוּקָתוֹ
  choice: sein Verlangen
  rationale: תְּשׁוּקָה bezeichnet starkes Verlangen oder Begehren. „Verlangen“ ist direkt, poetisch angemessen und vermeidet eine Abschwächung zu bloßer Zuneigung; das Suffix der 3. Person maskulin Singular wird mit „sein“ wiedergegeben.
theological_decisions:
- issue: Sinn der relationalen Nominalklausel
  choice: „Ich gehöre meinem Geliebten“ als Ausdruck gegenseitiger liebender Zugehörigkeit
  alternative: „Ich bin für meinen Geliebten“
  rationale: Die hebräische Klausel enthält kein ausdrückliches Verb und lässt formal „für/zu meinem Geliebten“ erkennen. Im wiederkehrenden Motiv des Hohelieds steht jedoch relationale Zugehörigkeit im Vordergrund. Die Übersetzung gibt diesen unmittelbaren poetischen Sinn wieder, ohne eine spätere allegorische oder konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, verständliches und zugleich poetisch-würdevolles Standarddeutsch. „Geliebter“ bewahrt den romantischen Kontext; „Verlangen“ lässt die sinnliche Intensität des hebräischen Ausdrucks stehen.
