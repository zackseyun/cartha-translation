  text: לְכָ֤/ה דוֹדִ/י֙ נֵצֵ֣א הַ/שָּׂדֶ֔ה נָלִ֖ינָה בַּ/כְּפָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/012.yaml
  text: Come[a], my beloved, let us go out to the countryside[b]; let us spend the night among the villages.
translation:
  language: de
  text: Komm[a], mein Geliebter, lass uns hinaus aufs Land gehen; lass uns in den Dörfern[b] übernachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Geh“; hier als einladende Aufforderung gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: Andere verstehen das hebräische Wort als „bei den Hennablüten“ und verbinden es mit der in Hohelied 1,14 genannten Pflanze. Der unmittelbare Zusammenhang spricht eher für „in den Dörfern“.
    reason: alternative_reading
lexical_decisions:
- source_word: לְכָה
  choice: Komm
  rationale: Der Imperativ von הלך bedeutet wörtlich „geh“, wird hier aber idiomatisch als einladende Aufforderung gebraucht. Im Deutschen gibt „Komm“ die direkte Einladung an den Geliebten natürlich wieder.
- source_word: דוֹדִי
  choice: mein Geliebter
  rationale: Die im Hohelied häufige Anrede bezeichnet den männlichen Geliebten und bewahrt hier sowohl die persönliche als auch die poetische Färbung.
- source_word: נֵצֵא
  choice: lass uns hinaus … gehen
  rationale: Die Kohortativform drückt eine gemeinsam beabsichtigte Handlung aus. „Hinausgehen“ erhält den Gedanken des Verlassens des gegenwärtigen Ortes.
- source_word: הַשָּׂדֶה
  choice: aufs Land
  rationale: Das Singularwort „Feld“ bezeichnet im Zusammenhang den offenen ländlichen Raum. „Aufs Land“ ist im modernen Deutschen natürlich und passt zum folgenden Aufenthalt in den Dörfern.
- source_word: נָלִינָה
  choice: lass uns … übernachten
  rationale: Die Kohortativform von לון/לין meint, die Nacht an einem Ort zu verbringen. „Übernachten“ ist knapp, gegenwärtig und präzise.
- source_word: בַּכְּפָרִים
  choice: in den Dörfern
  rationale: כְּפָרִים bedeutet gewöhnlich „Dörfer“ und fügt sich gut in die Bewegung aufs Land und das dortige Übernachten. Eine mögliche Verbindung mit der Hennapflanze bleibt in einer Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche und zugleich poetisch-würdevolle Sprache. Die beiden Kohortative werden parallel mit „lass uns“ wiedergegeben; „aufs Land“ vermeidet das im Deutschen zu enge Bild eines einzelnen Feldes.
