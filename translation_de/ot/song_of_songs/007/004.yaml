  text: Your two breasts are like two fawns[b][a], twins of a gazelle.
translation:
  language: de
  text: Deine beiden Brüste sind wie zwei Kitze, Zwillinge einer Gazelle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zwillinge einer Hirschkuh“. Das hebräische Wort kann eine Gazelle oder ein weibliches hirschartiges Tier bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי שָׁדַיִךְ
  choice: deine beiden Brüste
  rationale: שְׁנֵי bezeichnet die Zweizahl, שָׁדַיִךְ mit Suffix der 2. Person Singular feminin die direkt angesprochene Frau. „Brüste“ gibt das konkrete erotische Bild ohne Euphemismus wieder; „beiden“ klingt im Deutschen bei einem natürlichen Paar idiomatisch.
- source_word: כִּשְׁנֵי
  choice: wie zwei
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich; „wie zwei“ ist eine natürliche und genaue deutsche Wiedergabe.
- source_word: עֳפָרִים
  choice: Kitze
  rationale: Das Wort bezeichnet Jungtiere von Gazellen oder anderem Wild. „Kitze“ bewahrt das Bild von Jugend und Zartheit und vermeidet die unnatürliche Wiederholung „Gazellenjunge … einer Gazelle“.
- source_word: תָּאֳמֵי
  choice: Zwillinge
  rationale: Der Konstruktplural bezeichnet die beiden Jungtiere als Zwillingspaar. Die deutsche Apposition gibt die knappe hebräische Form natürlich wieder.
- source_word: צְבִיָּה
  choice: einer Gazelle
  rationale: Die feminine Singularform bezeichnet eine weibliche Gazelle beziehungsweise ein weibliches Tier dieser Art. „Gazelle“ entspricht dem charakteristischen Tierbild des Hohelieds; die feminine Bedeutung ist im Deutschen durch „einer“ erkennbar.
