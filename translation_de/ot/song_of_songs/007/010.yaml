base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/010.yaml
  text: And your mouth is like the best wine[a], going down smoothly for my beloved[b], gliding over the lips of sleepers.
translation:
  language: de
  text: Und dein Gaumen[a] ist wie der beste Wein, der meinem Geliebten sanft hinabgleitet und die Lippen der Schlafenden bewegt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „dein Mund“. Das hebräische Wort bezeichnet genauer den Gaumen, kann im Zusammenhang aber weiter gefasst den Mund meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und die Lippen der Schlafenden zum Reden bringt“. Das seltene hebräische Verb kann eine Bewegung der Lippen oder eine Wirkung des Weins bezeichnen, die sie zum Sprechen bringt.'
    reason: alternative_reading
lexical_decisions:
- source_word: חִכֵּךְ
  choice: dein Gaumen
  rationale: Das hebräische Substantiv bezeichnet konkret den Gaumen beziehungsweise das Innere des Mundes. „Gaumen“ bewahrt das körperlich-sinnliche Bild und ist im Deutschen auch in poetischer Sprache verständlich.
- source_word: כְּיֵין הַטּוֹב
  choice: wie der beste Wein
  rationale: Die Wendung bezeichnet Wein von vorzüglicher Qualität; „der beste Wein“ gibt die kontextuelle Steigerung natürlich wieder.
- source_word: הוֹלֵךְ
  choice: hinabgleitet
  rationale: Das Partizip bedeutet wörtlich „gehend“. Auf Wein bezogen verbindet „hinabgleitet“ die Bewegungsrichtung mit dem Bild eines angenehm zu trinkenden Weins.
- source_word: לְדוֹדִי
  choice: meinem Geliebten
  rationale: Die Präposition kann Richtung oder Zuordnung ausdrücken. Im Zusammenhang der Bewegung des Weins ist der Dativ nach „hinabgleitet“ eine natürliche deutsche Wiedergabe, ohne die Beziehung näher festzulegen.
- source_word: לְמֵישָׁרִים
  choice: sanft
  rationale: Wörtlich bezeichnet die Form Geradheit oder Ebenheit; bei Wein ist ein glatter, angenehmer Fluss gemeint. „Sanft“ klingt in gegenwärtigem Deutsch poetisch und idiomatisch.
- source_word: דּוֹבֵב
  choice: über … fließt
  rationale: Das seltene Partizip ist unsicher. Die Hauptfassung folgt der im Kontext von Wein naheliegenden Bewegungsbedeutung; die mögliche kausative Bedeutung „zum Reden bringen“ wird in der Fußnote bewahrt.
- source_word: שִׂפְתֵי יְשֵׁנִים
  choice: die Lippen der Schlafenden
  rationale: Die relativ formale Wiedergabe erhält das ungewöhnliche und mehrdeutige poetische Bild des Hebräischen.
theological_decisions:
- issue: Mehrdeutigkeit des seltenen Verbs דּוֹבֵב
  choice: als sanfte Bewegung des Weins über die Lippen wiedergegeben
  alternative: „die Lippen der Schlafenden zum Reden bringt“
  rationale: Beide Deutungen sind sprachlich vertreten. Die Bewegungsdeutung fügt sich unmittelbar in das Bild des fließenden Weins ein; die alternative Wirkungsdeutung wird ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Moderne, verständliche und zugleich poetisch-würdevolle Sprache. Die sinnliche Bildsprache bleibt konkret; die seltene Verbform am Versende wird nicht vorschnell vereindeutigt.
