  text: This stature of yours is like a palm tree[a], and your breasts are like clusters of fruit.
translation:
  language: de
  text: Deine Gestalt gleicht einer Palme, und deine Brüste gleichen Fruchttrauben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Trauben“, möglicherweise „Weintrauben“. Das hebräische Wort bezeichnet Fruchttrauben und wird häufig für Weintrauben gebraucht; die Fruchtart wird hier nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת קוֹמָתֵךְ
  choice: Deine Gestalt
  rationale: קוֹמָה bezeichnet hier die aufrechte Körpergestalt beziehungsweise Statur der Frau. Im Deutschen gibt „Gestalt“ das poetische Gesamtbild natürlicher wieder als das stärker auf Körpergröße bezogene „Statur“. Das demonstrative זֹאת wird in der idiomatischen deutschen Formulierung nicht eigens wiedergegeben, ohne den Sinn der unmittelbar betrachteten Gestalt zu verlieren.
- source_word: דָּמְתָה לְתָמָר
  choice: gleicht einer Palme
  rationale: דמה mit ל bezeichnet das Ähnlichsein. „Gleicht“ wahrt die knappe poetische Vergleichsform; תָּמָר ist die Palme beziehungsweise Dattelpalme, wobei der allgemeinere Ausdruck „Palme“ die Bildsprache ohne unnötige Spezifizierung erhält.
- source_word: וְשָׁדַיִךְ
  choice: und deine Brüste
  rationale: שָׁדַיִם bezeichnet ausdrücklich die Brüste. Die direkte anatomische Bezeichnung entspricht der unverhüllten erotischen Poesie des Textes und sollte nicht abgeschwächt werden.
- source_word: לְאַשְׁכֹּלוֹת
  choice: gleichen Fruchttrauben
  rationale: אֶשְׁכּוֹל bezeichnet eine Traube beziehungsweise einen Fruchtstand, häufig eine Weintraube; die Fruchtart wird hier jedoch nicht ausdrücklich genannt. „Fruchttrauben“ macht das Bild im Deutschen verständlich, ohne Weintrauben zwingend in den Haupttext einzutragen.
