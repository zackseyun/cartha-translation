base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/007.yaml
  text: How beautiful and how delightful you are[a], O love[b], with your pleasures!
translation:
  language: de
  text: Wie schön und wie lieblich bist du, o Liebe[a], inmitten von Wonnen[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Liebe“ oder „Geliebte“. Das hebräische Wort bedeutet wörtlich „Liebe“ und wird hier als Anrede gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „in Wonnen“ oder „mit Wonnen“. Die knappe hebräische Wendung kann den Bereich oder die Begleitung von Wonnen bezeichnen und möglicherweise auch die von Wonnen geprägte Art der Angeredeten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּפִית
  choice: Wie schön ... bist du
  rationale: Das ausrufende מַה wird im Deutschen natürlich mit „wie“ wiedergegeben; die feminine Anrede bleibt durch die zweite Person Singular erhalten.
- source_word: וּמַה נָּעַמְתְּ
  choice: und wie lieblich
  rationale: נעם bezeichnet angenehme, anziehende Lieblichkeit. „Lieblich“ wahrt den poetischen Ton und die parallele Ausrufstruktur.
- source_word: אַהֲבָה
  choice: du Liebe
  rationale: Das abstrakte Substantiv „Liebe“ dient als direkte Anrede. „Du Liebe“ bewahrt dieses ungewöhnliche poetische Bild, ohne ein im Hebräischen nicht ausdrückliches Possessivpronomen hinzuzufügen.
- source_word: בַּתַּעֲנוּגִים
  choice: voller Wonnen
  rationale: Die knappe Präpositionalphrase kann einen Bereich, eine Begleitung oder eine kennzeichnende Fülle von Wonnen bezeichnen. „Voller Wonnen“ ist im Deutschen verständlich und poetisch, ohne die Wonnen ausdrücklich als Besitz der Angeredeten festzulegen.
theological_decisions: []
