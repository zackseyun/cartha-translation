  - severity: low
    issue: „du Liebe“ ist im modernen Deutschen als Anrede wenig idiomatisch.
    rationale: Die vokativische Form „o Liebe“ erhält die ungewöhnliche poetische Anrede des Hebräischen besser lesbar.
