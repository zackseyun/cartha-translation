  register: Moderne, würdevolle Liebeslyrik mit bewusst bewahrter Bildsprache. Die ungewöhnliche Anrede „du Liebe“ und die Mehrdeutigkeit der Schlusswendung werden nicht stillschweigend aufgelöst.
