base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/006.yaml
  text: Your head upon you is like Carmel[a], and the flowing hair of your head like purple[c][b]; a king is held captive in the tresses.
translation:
  language: de
  text: Dein Haupt gleicht dem Karmel[a], und das herabwallende Haar deines Hauptes ist wie Purpur[b]. Ein König ist in den Locken gefangen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem Karmel ist wahrscheinlich der Berg Karmel gemeint; das Bild erinnert an seine stattliche Höhe und Schönheit.
    reason: cultural_note
  - marker: b
    text: 'Oder: »die Locken deines Hauptes«. Das hebräische Wort ist selten und kann herabhängendes oder wallendes Haar bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Ein König ist in den Galerien gebunden.« Das letzte hebräische Wort ist schwierig und wurde auch als »Rinnen« verstanden. Der Haupttext folgt dem Haarbild der umgebenden Zeilen.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאשֵׁךְ עָלַיִךְ
  choice: Dein Haupt erhebt sich
  rationale: רֹאשֵׁךְ bezeichnet das »Haupt« bzw. den Kopf; עָלַיִךְ ist räumlich »auf/über dir«. Die idiomatische poetische Formulierung »erhebt sich« gibt die Vorstellung des hoch getragenen Hauptes wieder, ohne das im Deutschen befremdliche »dein Haupt auf dir« zu erzwingen.
- source_word: כַּכַּרְמֶל
  choice: wie der Karmel
  rationale: Die Vergleichspartikel כ wird mit »wie« wiedergegeben. כַּרְמֶל ist hier sehr wahrscheinlich der Berg Karmel, dessen Höhe und stattliche Schönheit das Bild prägen; die knappe Namensform entspricht der hebräischen Poesie.
- source_word: דַלַּת רֹאשֵׁךְ
  choice: das herabwallende Haar deines Hauptes
  rationale: דַלָּה ist selten und bezeichnet hier wahrscheinlich herabhängendes oder wallendes Haar. »Herabwallendes Haar« macht das Bild verständlich und bewahrt zugleich den poetischen Charakter; die lexikalische Unsicherheit wird in einer Fußnote genannt.
- source_word: כָּאַרְגָּמָן
  choice: wie Purpur
  rationale: אַרְגָּמָן bezeichnet kostbaren Purpurfarbstoff oder Purpurstoff. Das knappe »Purpur« erhält sowohl den Farbwert als auch die Assoziation von Kostbarkeit, ohne den Stoff unnötig festzulegen.
- source_word: מֶלֶךְ
  choice: ein König
  rationale: Das Substantiv steht ohne Artikel; »ein König« ist daher die naheliegende Wiedergabe und lässt die Aussage allgemein bzw. hyperbolisch wirken.
- source_word: אָסוּר
  choice: ist … gefangen
  rationale: 'Das Partizip von אסר bedeutet »gebunden«. Im Liebesgedicht ist das Bild metaphorisch: Selbst ein König wird vom Haar gefesselt. »Gefangen« bewahrt diese Metapher in natürlichem Deutsch.'
- source_word: בָּרְהָטִים
  choice: in den Locken
  rationale: Das seltene Wort ist in seiner Bedeutung umstritten. Im unmittelbaren Zusammenhang mit dem Haar passt »Locken« gut zum Bild und zum Parallelismus; andere Deutungen wie »Galerien« oder »Rinnen« bleiben in der Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Moderne, gehobene und zugleich allgemein verständliche poetische Sprache. »Haupt« wurde statt »Kopf« gewählt, weil es im Deutschen die Würde des Liebesliedes und den Vergleich mit dem Karmel besser trägt. Die ungewöhnlichen Bilder von purpurfarbenem Haar und einem darin gefangenen König werden nicht rationalisiert; die echte lexikalische Unsicherheit der beiden seltenen Wörter wird durch Fußnoten offengehalten.
