  register: Moderne, würdige poetische Sprache mit kurzen, rhythmischen Zeilen. Die vierfache Wiederholung des Zurufs bleibt erhalten; altertümliche Wörter werden vermieden, abgesehen vom poetisch passenden und allgemein verständlichen »Reigen«.
