  variant: modern standard German
source:
  edition: WLC
  text: שׁ֤וּבִי שׁ֨וּבִי֙ הַ/שּׁ֣וּלַמִּ֔ית שׁ֥וּבִי שׁ֖וּבִי וְ/נֶחֱזֶה בָּ֑/ךְ מַֽה תֶּחֱזוּ֙ בַּ/שּׁ֣וּלַמִּ֔ית כִּ/מְחֹלַ֖ת הַֽ/מַּחֲנָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/001.yaml
  text: Return[a], return, O Shulammite; return, return, that we may look at you[b]. Why do you look at the Shulammite as at the dance of Mahanaim?
translation:
  language: de
  text: 'Kehr um, kehr um, Schulammitin!

    Kehr um, kehr um, damit wir dich ansehen!

    Warum schaut ihr die Schulammitin an[a]

    wie den Reigen von Mahanajim?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was seht ihr an der Schulammitin? – Etwas wie den Reigen von Mahanajim.« Der hebräische Satz ist schwer zu deuten; מַה kann hier mit »warum« oder mit »was« wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: Mahanajim ist wahrscheinlich ein Ortsname; der Name kann »zwei Lager« bedeuten.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוּבִי
  choice: Kehr um
  rationale: Der feminine Singularimperativ von שוב wird in seiner vierfachen Wiederholung bewahrt. »Kehr um« lässt offen, ob eine körperliche Wendung oder eine Rückkehr gemeint ist, und klingt in einem poetischen Zuruf natürlich.
- source_word: הַשּׁוּלַמִּית
  choice: Schulammitin
  rationale: Die Bezeichnung wird nach gebräuchlicher deutscher Namensform transliteriert. So bleibt offen, ob es sich um eine Herkunftsbezeichnung, einen Titel oder eine poetische Benennung handelt.
- source_word: וְנֶחֱזֶה בָּךְ
  choice: damit wir dich ansehen
  rationale: Die Form der ersten Person Plural bezeichnet hier nach den Imperativen naheliegend den Zweck. »Ansehen« gibt den visuellen Sinn schlicht wieder, ohne die Intensität von »anstarren« oder »bestaunen« einzutragen.
- source_word: מַה
  choice: Warum
  rationale: מַה bedeutet gewöhnlich »was«, kann in dieser schwierigen Frage aber erklärend-rhetorische Kraft haben. »Warum« ergibt zusammen mit dem folgenden Vergleich einen verständlichen deutschen Haupttext; die mögliche Konstruktion mit »was« wird in der Fußnote erhalten.
- source_word: תֶּחֱזוּ
  choice: schaut ihr … an
  rationale: Die zweite Person maskulin Plural markiert einen Sprecherwechsel. »Anschauen« bewahrt die lexikalische Verbindung zum vorausgehenden חזה und ist modernes, natürliches Deutsch.
- source_word: כִּמְחֹלַת
  choice: wie den Reigen von
  rationale: Das Präfix כ wird als Vergleich wiedergegeben. »Reigen« bezeichnet passend einen Tanz beziehungsweise eine Tanzformation und wahrt den poetischen Ton.
- source_word: הַמַּחֲנָיִם
  choice: Mahanajim
  rationale: Die Form wird wahrscheinlich als Ortsname verstanden und in der im Deutschen geläufigen Gestalt transliteriert. Die mögliche Namensbedeutung »zwei Lager« wird in der Fußnote erläutert.
theological_decisions: []
