  text: נַשְׁכִּ֨ימָה֙ לַ/כְּרָמִ֔ים נִרְאֶ֞ה אִם פָּֽרְחָ֤ה הַ/גֶּ֨פֶן֙ פִּתַּ֣ח הַ/סְּמָדַ֔ר הֵנֵ֖צוּ הָ/רִמּוֹנִ֑ים שָׁ֛ם אֶתֵּ֥ן אֶת דֹּדַ֖/י לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/013.yaml
  text: Let us rise early for the vineyards[a]; let us see whether the vine has budded, whether the blossom has opened, whether the pomegranates are in bloom[c][b]. There I will give you my love.
translation:
  language: de
  text: Lass uns früh zu den Weinbergen aufbrechen und sehen, ob der Weinstock ausgetrieben hat,[a] ob sich die Weinblüte geöffnet hat und ob die Granatapfelbäume blühen. Dort will ich dir meine Liebe schenken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ob der Weinstock blüht“. Das hebräische Verb kann sowohl das Austreiben als auch das Aufblühen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht „meine Lieben“ in der Mehrzahl, wahrscheinlich als Sammel- oder Verstärkungsform; möglich ist auch „meine Liebkosungen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְׁכִּימָה
  choice: Lass uns früh … aufbrechen
  rationale: Der Hifil-Kohortativ der 1. Person Plural von שׁכם bezeichnet frühes Aufstehen oder frühes Aufbrechen. Im Zusammenhang mit dem Ziel der Bewegung gibt „früh … aufbrechen“ die zeitliche Nuance und die gemeinsame Einladung natürlich wieder.
- source_word: לַכְּרָמִים
  choice: zu den Weinbergen
  rationale: Die Präposition ל bezeichnet hier die Richtung beziehungsweise das Ziel. „Zu den Weinbergen“ ist im Deutschen eindeutig und idiomatisch.
- source_word: נִרְאֶה
  choice: und sehen
  rationale: Der Kohortativ von ראה setzt die gemeinsame Aufforderung fort. Nach „Lass uns“ ist der koordinierte Infinitiv im Deutschen natürlich.
- source_word: פָּרְחָה הַגֶּפֶן
  choice: der Weinstock ausgetrieben hat
  rationale: פרח kann sowohl das Austreiben als auch das Aufblühen bezeichnen. „Ausgetrieben“ wahrt die mögliche Entwicklungsfolge vor dem anschließenden Öffnen der Weinblüte.
- source_word: פִּתַּח הַסְּמָדַר
  choice: sich die Weinblüte geöffnet hat
  rationale: סמדר bezeichnet die Blüte beziehungsweise den frühen Blütenstand des Weinstocks. Die spezifische Wiedergabe „Weinblüte“ vermeidet eine unklare allgemeine Blüte.
- source_word: הֵנֵצוּ הָרִמּוֹנִים
  choice: die Granatapfelbäume blühen
  rationale: נוץ bezeichnet hier das Hervorbringen von Blüten. Da nicht die Früchte selbst blühen, macht „Granatapfelbäume“ den im Hebräischen kontextuell gemeinten Pflanzenträger im Deutschen deutlich.
- source_word: שָׁם
  choice: Dort
  rationale: Das Adverb bezeichnet den Ort und verbindet die Liebeszusage mit der Umgebung der Weinberge.
- source_word: אֶתֵּן אֶת דֹּדַי לָךְ
  choice: will ich dir meine Liebe schenken
  rationale: נתן wird mit „schenken“ idiomatisch wiedergegeben. Der Plural דֹּדַי kann Liebe, Liebkosungen oder Liebeserweise bezeichnen; „meine Liebe“ erhält die Weite des Ausdrucks, ohne die Intimität unnötig festzulegen.
theological_decisions:
- issue: Bedeutungsumfang des pluralischen דֹּדַי
  choice: meine Liebe
  alternative: meine Liebkosungen / meine Liebeserweise
  rationale: Der poetische Plural kann kollektiv oder intensiv gebraucht sein und sowohl Liebe als auch konkrete Zärtlichkeit bezeichnen. Der Haupttext wahrt diese Offenheit; die Fußnote nennt die körperlich-konkreteren Möglichkeiten.
translation_notes:
  register: Moderne, poetisch-würdige Standardsprache. „Lass uns“ entspricht der persönlichen Anrede zwischen den Liebenden; die Gartenbilder bleiben konkret und gut verständlich. Die Satzfolge ist fließend gestaltet, ohne die botanische Entwicklungsfolge oder die intime Mehrdeutigkeit des Schlusses einzuebnen.
