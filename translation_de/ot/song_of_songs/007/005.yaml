  register: Moderne, gehobene Standardsprache mit knappen poetischen Zeilen. Die körperlichen Bilder und die hebräische Nominalmetapher bleiben bewusst deutlich erhalten; erklärungsbedürftige Mehrdeutigkeiten stehen in den Fußnoten.
