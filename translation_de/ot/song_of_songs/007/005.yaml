source:
  edition: WLC
  text: צַוָּארֵ֖/ךְ כְּ/מִגְדַּ֣ל הַ/שֵּׁ֑ן עֵינַ֜יִ/ךְ בְּרֵכ֣וֹת בְּ/חֶשְׁבּ֗וֹן עַל שַׁ֨עַר֙ בַּת רַבִּ֔ים אַפֵּ/ךְ֙ כְּ/מִגְדַּ֣ל הַ/לְּבָנ֔וֹן צוֹפֶ֖ה פְּנֵ֥י דַמָּֽשֶׂק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/005.yaml
  text: Your neck is like a tower of ivory[a]; your eyes are pools in Heshbon, by the gate of Bath-rabbim. Your nose is like the tower of Lebanon[c][b], looking toward Damascus.
translation:
  language: de
  text: 'Dein Hals ist wie ein Turm aus Elfenbein;

    deine Augen sind Teiche in Heschbon

    am Tor von Bat-Rabbim.[a]


    Deine Nase[b] ist wie ein Turm des Libanon,

    der nach Damaskus schaut.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Tor der volkreichen Stadt« oder »am Tor der Vielen«. Der hebräische Ausdruck »Bat-Rabbim« kann ein Ortsname sein oder beschreibend verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort bedeutet »Nase«. Das Bild rühmt vermutlich das würdevolle Profil der Geliebten, statt ein Körperteil im heutigen, möglicherweise befremdlich wirkenden Sinn isoliert zu betrachten.
    reason: cultural_note
  - marker: c
    text: 'Oder: »der Damaskus überblickt« beziehungsweise »der Damaskus zugewandt ist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוָּארֵךְ
  choice: dein Hals
  rationale: Das Substantiv bezeichnet den Hals- beziehungsweise Nackenbereich. »Hals« ist in diesem poetischen Zusammenhang die natürliche und genaue Wiedergabe.
- source_word: כְּמִגְדַּל הַשֵּׁן
  choice: wie ein Turm aus Elfenbein
  rationale: כְּ gibt den Vergleich an; שֵׁן bezeichnet hier idiomatisch Elfenbein. »Aus Elfenbein« drückt im Deutschen die Materialangabe natürlich aus.
- source_word: עֵינַיִךְ בְּרֵכוֹת
  choice: deine Augen sind Teiche
  rationale: Die knappe hebräische Nominalmetapher wird beibehalten. בְּרֵכוֹת bezeichnet Wasserbecken, Teiche oder Reservoirs; »Teiche« bewahrt das Bild stillen, spiegelnden Wassers.
- source_word: בְּחֶשְׁבּוֹן
  choice: in Heschbon
  rationale: Der Ortsname wird in geläufiger deutscher Form wiedergegeben.
- source_word: עַל שַׁעַר בַּת רַבִּים
  choice: am Tor von Bat-Rabbim
  rationale: Die Wendung lässt sich am ehesten als Orts- oder Torname verstehen. Wegen der unsicheren Bedeutung wird Bat-Rabbim im Haupttext transkribiert; עַל ist hier idiomatisch mit »am« wiedergegeben.
- source_word: אַפֵּךְ
  choice: deine Nase
  rationale: Das Wort bedeutet hier konkret »Nase«. Die spezifische Körpermetapher wird nicht zum allgemeineren »Gesicht« abgeschwächt.
- source_word: כְּמִגְדַּל הַלְּבָנוֹן
  choice: wie der Libanonturm
  rationale: Die Konstruktion bezeichnet wörtlich den »Turm des Libanon«. Das Kompositum »Libanonturm« ist im Deutschen knapp und poetisch und lässt offen, ob ein bestimmter oder idealisierter Turm gemeint ist.
- source_word: צוֹפֶה פְּנֵי דַמָּשֶׂק
  choice: der nach Damaskus schaut
  rationale: Das Partizip bezeichnet das Ausschauen beziehungsweise die Ausrichtung eines Wachturms. Die Präpositionalkonstruktion mit פְּנֵי bedeutet idiomatisch »nach Damaskus hin«.
theological_decisions: []
