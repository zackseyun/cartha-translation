  register: Moderne, würdevolle Standardsprache mit offen bewahrter erotischer Bildsprache. Der poetische Wunschton wird durch „sollen doch“ wiedergegeben; seltene beziehungsweise mehrdeutige Körper- und Pflanzenbegriffe werden nicht stillschweigend vereindeutigt.
