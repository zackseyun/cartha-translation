base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/009.yaml
  text: I said[a], “I will climb the palm tree; I will take hold of its branches. May your breasts be like clusters of the vine[b], and the fragrance of your breath like apples.”
translation:
  language: de
  text: 'Ich sagte: »Ich will auf die Palme steigen und ihre Zweige[a] ergreifen. Mögen deine Brüste wie Trauben am Weinstock sein und der Duft deiner Nase[b] wie Äpfel.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Äste“, „ihre Fruchttriebe“ oder „ihre Fruchtstände“. Das seltene hebräische Wort bezeichnet Zweige oder fruchttragende Triebe der Palme.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „deiner Nase“. Das Bild kann den Duft ihres Atems oder den Duft im Bereich ihres Gesichts meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמָר
  choice: Palme
  rationale: Das Substantiv bezeichnet eine Palme, wahrscheinlich eine Dattelpalme. „Palme“ bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: אֶעֱלֶה
  choice: ich will auf … steigen
  rationale: עלה bedeutet wörtlich „hinaufgehen“; bei einem Baum ist „hinaufsteigen“ idiomatisch. „Ich will“ gibt hier den entschlossenen, volitiven Sinn wieder.
- source_word: אֹחֲזָה
  choice: ergreifen
  rationale: אחז bezeichnet festes Fassen oder Ergreifen. Die Wahl bleibt anschaulich, ohne die erotische Bildsprache unnötig zu verschärfen.
- source_word: סַנְסִנָּיו
  choice: ihre Zweige
  rationale: Das seltene Wort kann Zweige oder fruchttragende Triebe beziehungsweise Fruchtstände der Palme bezeichnen. Die allgemein verständliche Wiedergabe steht im Text; die genaueren Möglichkeiten werden in der Fußnote bewahrt.
- source_word: וְיִהְיוּ נָא
  choice: sollen doch … sein
  rationale: Die Jussivform mit נָא drückt einen Wunsch oder ein Begehren aus. „Sollen doch“ wahrt diesen optativen Ton in natürlichem Deutsch.
- source_word: שָׁדַיִךְ
  choice: deine Brüste
  rationale: Das hebräische Wort bezeichnet eindeutig die Brüste; eine beschönigende Umschreibung würde die offene erotische Bildsprache des Gedichts abschwächen.
- source_word: אֶשְׁכְּלֹת הַגֶּפֶן
  choice: Trauben am Weinstock
  rationale: Wörtlich steht „Trauben/Fruchtbüschel des Weinstocks“. Die deutsche Formulierung erhält das Weinrebenbild und ist zugleich flüssig verständlich.
- source_word: רֵיחַ
  choice: Duft
  rationale: „Duft“ entspricht dem positiv-sinnlichen Zusammenhang besser als das neutrale „Geruch“.
- source_word: אַפֵּךְ
  choice: deines Atems
  rationale: Wörtlich bedeutet die Form „deiner Nase“. In Verbindung mit einem angenehmen Duft zielt das Bild wahrscheinlich auf den Atem oder den Duft im Bereich des Gesichts. Die wörtliche Lesart bleibt in der Fußnote sichtbar.
- source_word: כַּתַּפּוּחִים
  choice: wie Äpfel
  rationale: תפוחים wird traditionell als „Äpfel“ verstanden. Die genaue botanische Bestimmung ist zwar umstritten, doch „Äpfel“ ist die transparente und etablierte Wiedergabe.
