base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/014.yaml
  text: The mandrakes give off fragrance[a], and at our doorways are all choice fruits, new as well as old, which I have stored up for you[b], my beloved.
translation:
  language: de
  text: Die Alraunen verströmen ihren Duft[a], und an unseren Türen liegen allerlei Köstlichkeiten[b], neue wie alte; für dich, mein Geliebter, habe ich sie aufbewahrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Liebesäpfel“; diese Bezeichnung knüpft an die traditionelle Verbindung der Pflanze mit Liebe und Fruchtbarkeit an.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „allerlei erlesene Früchte“, „allerlei Kostbarkeiten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוּדָאִים
  choice: die Alraunen
  rationale: דּוּדָאִים bezeichnet Alraunen, die im biblischen und altorientalischen Umfeld mit Duft, Liebe und Fruchtbarkeit verbunden wurden. „Alraunen“ ist die direkte, verständliche Pflanzenbezeichnung.
- source_word: נָתְנוּ רֵיחַ
  choice: verströmen ihren Duft
  rationale: Die Wendung bedeutet wörtlich „geben Duft“. Das deutsche Präsens und „verströmen“ geben die gegenwärtige poetische Szenerie natürlich wieder.
- source_word: וְעַל פְּתָחֵינוּ
  choice: und an unseren Türen
  rationale: פֶּתַח bezeichnet Öffnung, Eingang oder Tür. עַל kann hier räumlich mit „an“ wiedergegeben werden; die Formulierung bleibt anschaulich und natürlich.
- source_word: כָּל מְגָדִים
  choice: allerlei Köstlichkeiten
  rationale: מְגָדִים kann erlesene Erzeugnisse, Früchte, Kostbarkeiten oder Köstlichkeiten bezeichnen. „Köstlichkeiten“ wahrt die Mehrdeutigkeit besser als eine Festlegung ausschließlich auf Früchte.
- source_word: חֲדָשִׁים גַּם יְשָׁנִים
  choice: neue wie alte
  rationale: Die knappe Formulierung erhält den Gegensatz und die einschließende Kraft von גַּם in natürlichem Deutsch.
- source_word: דּוֹדִי
  choice: mein Geliebter
  rationale: דּוֹדִי ist im Hohelied die vertraute Anrede für den männlichen Geliebten; „mein Geliebter“ ist klar, innig und würdevoll.
- source_word: צָפַנְתִּי לָךְ
  choice: Für dich ... habe ich sie aufbewahrt
  rationale: צפן bedeutet verbergen, verwahren oder aufbewahren. Die deutsche Wortstellung hebt wie der hebräische Schluss hervor, dass alles dem Geliebten vorbehalten ist.
