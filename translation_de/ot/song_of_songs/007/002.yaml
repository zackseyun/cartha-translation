base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/002.yaml
  text: How beautiful are your feet in sandals[a], O noble daughter! The curves of your thighs are like jewels[b], the work of the hands of a master craftsman.
translation:
  language: de
  text: Wie schön sind deine Füße in Sandalen, du Tochter aus edlem Geschlecht! Die Rundungen deiner Hüften[a] sind wie Schmuckstücke[b], das Werk der Hände eines Kunsthandwerkers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Oberschenkel“. Das hebräische Wort kann den Hüft- und Oberschenkelbereich bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Juwelen“ oder „Halsketten“. Gemeint ist wahrscheinlich kostbarer, kunstvoll gefertigter Schmuck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּפוּ
  choice: Wie schön
  rationale: Das ausrufende מַה leitet hier bewunderndes Lob ein; „Wie schön“ gibt dies natürlich und würdig wieder.
- source_word: פְעָמַיִךְ
  choice: deine Füße
  rationale: פעם kann „Fuß“ oder „Schritt“ bezeichnen. Zusammen mit den Sandalen ist die konkrete Bedeutung „Füße“ am wahrscheinlichsten.
- source_word: בַּנְּעָלִים
  choice: in Sandalen
  rationale: Die Formulierung bewahrt das hebräische Bild und ist im modernen Deutschen idiomatisch.
- source_word: בַּת נָדִיב
  choice: du Tochter aus edlem Geschlecht
  rationale: נָדִיב kann Vornehmheit, hohen Rang oder edle Gesinnung ausdrücken. Die Wiedergabe wahrt die mögliche soziale Bedeutung, ohne einen bestimmten Vater ausdrücklich vorauszusetzen.
- source_word: חַמּוּקֵי יְרֵכַיִךְ
  choice: die Rundungen deiner Hüften
  rationale: חַמּוּקִים bezeichnet gerundete Formen oder Windungen; יָרֵךְ umfasst den Hüft-/Oberschenkelbereich. „Rundungen deiner Hüften“ ergibt im poetischen Körperlob ein natürliches Gesamtbild, während die anatomische Unschärfe in der Fußnote erhalten bleibt.
- source_word: חֲלָאִים
  choice: Schmuckstücke
  rationale: Das seltene Wort bezeichnet wahrscheinlich kunstvoll gefertigten Schmuck. „Schmuckstücke“ wahrt diese allgemeine Bedeutung, ohne sich unsicher auf Juwelen oder Halsketten festzulegen.
- source_word: מַעֲשֵׂה יְדֵי אָמָּן
  choice: geschaffen von Meisterhand
  rationale: Die idiomatische Wendung bewahrt sowohl die handwerkliche Herstellung als auch die besondere Kunstfertigkeit des אָמָּן.
