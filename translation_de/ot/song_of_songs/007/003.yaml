base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/003.yaml
  text: Your navel is a rounded bowl[a]; may it never lack mixed wine. Your belly is a heap of wheat[c][b], encircled with lilies.
translation:
  language: de
  text: Dein Nabel ist eine runde Schale[a], der nie gemischter Wein[b] fehlen möge. Dein Bauch[c] ist ein Haufen Weizen, von Lilien umgeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Deine Vulva ist eine runde Schale.“ Das hebräische Wort wird traditionell mit „Nabel“ wiedergegeben; seine genaue Bedeutung ist in diesem erotischen poetischen Zusammenhang jedoch umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Würzwein“. Gemeint ist Wein, der vermutlich mit Wasser oder Gewürzen gemischt wurde.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Dein Mutterleib ist ein Haufen Weizen“, falls das Wort einen inneren Körperbereich bezeichnet; im Zusammenhang ist „Bauch“ jedoch wahrscheinlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְרֵךְ
  choice: dein Nabel
  rationale: Die traditionelle und lexikalisch gut belegte Wiedergabe passt zur Abfolge der beschriebenen Körperteile. Eine stärker erotische Bedeutung ist möglich, aber nicht eindeutig und wird daher in einer Fußnote bewahrt.
- source_word: אַגַּן הַסַּהַר
  choice: eine runde Schale
  rationale: אַגַּן bezeichnet eine Schale oder ein Becken; הַסַּהַר beschreibt wahrscheinlich die runde Form. Die Formulierung gibt das Bild natürlich wieder, ohne eine unsichere Deutung als mondförmig festzuschreiben.
- source_word: אַל יֶחְסַר
  choice: nie soll ihr … fehlen
  rationale: Die Jussivform wird als poetischer Wunsch wiedergegeben und nicht zu einer bloßen Feststellung abgeflacht.
- source_word: הַמָּזֶג
  choice: der Mischwein
  rationale: Das Wort bezeichnet gemischten, möglicherweise auch gewürzten Wein. „Mischwein“ bleibt eng am Hebräischen und klingt im poetischen Kontext würdig.
- source_word: בִּטְנֵךְ
  choice: dein Bauch
  rationale: בֶּטֶן bedeutet gewöhnlich Bauch oder Leib und kann kontextabhängig auch den Mutterleib bezeichnen. In der äußeren Körperbeschreibung ist „Bauch“ am wahrscheinlichsten.
- source_word: עֲרֵמַת חִטִּים
  choice: ein Weizenhaufen
  rationale: Die direkte Wiedergabe bewahrt das überraschende landwirtschaftliche Bild des hebräischen Gedichts.
- source_word: סוּגָה בַּשּׁוֹשַׁנִּים
  choice: von Lilien umgeben
  rationale: סוּגָה bezeichnet ein Umschlossensein oder Umhegtsein. Die deutsche Formulierung ist natürlich und erhält das Blumenbild.
