base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/017.yaml
  text: Until the day breathes and the shadows flee[a], turn[b], my beloved—be like a gazelle or a young stag on the mountains of Bether.
translation:
  language: de
  text: Bis der Tag atmet und die Schatten fliehen[a], wende dich um, mein Geliebter, und sei wie eine Gazelle oder ein junger Hirsch auf den Bergen von Bether.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bis der Tag kühl wird und die Schatten fliehen.“ Wörtlich ist davon die Rede, dass der Tag „atmet“ oder „weht“. Das poetische Bild kann auf die Abendbrise oder auf das frische Anbrechen des Morgens bezogen werden.'
    reason: lexical_alternative
  - marker: b
    text: '„Bether“ kann ein Ortsname sein. Möglich ist auch: „auf den Bergen der Trennung“; weniger wahrscheinlich: „auf den zerklüfteten Bergen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד שֶׁיָּפוּחַ הַיּוֹם
  choice: Bis der Tag aufatmet
  rationale: פוח bezeichnet ein Blasen oder Atmen. „Der Tag atmet auf“ bewahrt die poetische Belebung des Tages und klingt im Deutschen natürlich, ohne die mögliche Deutung als Abendbrise oder Morgendämmerung im Haupttext festzulegen.
- source_word: וְנָסוּ הַצְּלָלִים
  choice: und die Schatten fliehen
  rationale: נוס bedeutet gewöhnlich „fliehen“. Die Wiedergabe erhält die kraftvolle poetische Bewegung, statt sie deutend zu „verschwinden“ abzuschwächen.
- source_word: סֹב
  choice: wende dich
  rationale: Der Imperativ von סבב bedeutet „sich wenden/umkehren“. „Wende dich“ gibt den Grundsinn wieder, ohne das stärker deutende „kehre zurück“ vorauszusetzen.
- source_word: דְּמֵה לְךָ
  choice: Sei wie
  rationale: Die Wendung fordert den Geliebten zum Vergleich mit einem schnellen Wildtier auf. „Sei wie“ ist knapp, idiomatisch und erhält die Bildsprache.
- source_word: דּוֹדִי
  choice: mein Geliebter
  rationale: דוד ist im Hohelied eine intime Bezeichnung für den männlichen Geliebten. „Mein Geliebter“ ist würdevoll, klar und geschlechtsspezifisch.
- source_word: לִצְבִי
  choice: wie eine Gazelle
  rationale: צבי bezeichnet hier die Gazelle; die Präposition ל markiert nach דמה den Vergleich.
- source_word: לְעֹפֶר הָאַיָּלִים
  choice: oder ein junger Hirsch
  rationale: עפר bezeichnet ein Jungtier, und אַיָּלִים verweist auf Hirsche. „Junger Hirsch“ bewahrt das männliche Tierbild und ist im modernen Deutsch verständlich.
- source_word: עַל הָרֵי בָתֶר
  choice: auf den Bergen von Bether
  rationale: בתר kann ein Ortsname oder eine beschreibende Bezeichnung sein. Die Transliteration „Bether“ lässt die Unsicherheit im Haupttext bestehen; mögliche Bedeutungen werden in der Fußnote genannt.
