base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/015.yaml
  text: Catch the foxes for us[a], the little foxes that ruin the vineyards[c][b], for our vineyards are in blossom.
translation:
  language: de
  text: Fangt uns die Füchse[a], die kleinen Füchse, die die Weinberge verwüsten[b]; denn unsere Weinberge stehen in Blüte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann in manchen Zusammenhängen auch „Schakale“ bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die die Weinberge verderben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „denn unsere Weinberge blühen“; weniger wahrscheinlich: „denn unsere Weinberge tragen junge Trauben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶֽחֱזוּ
  choice: Fangt
  rationale: Der Imperativ Plural von אחז fordert zum Ergreifen auf. Bei Tieren ist „fangen“ im Deutschen idiomatisch und bewahrt die Aufforderung.
- source_word: לָנוּ
  choice: uns
  rationale: Die Präposition mit Suffix der 1. Person Plural bedeutet „für uns“ bzw. „uns zuliebe“. In Verbindung mit „fangen“ gibt der Dativ „uns“ dies natürlich wieder.
- source_word: שׁוּעָלִים
  choice: Füchse
  rationale: „Füchse“ ist hier die übliche und im Weinbergbild naheliegende Wiedergabe; die mögliche Bedeutung „Schakale“ wird in einer Fußnote bewahrt.
- source_word: שׁוּעָלִים קְטַנִּים
  choice: die kleinen Füchse
  rationale: Die Wiederholung des Substantivs mit dem Adjektiv wird ausdrücklich beibehalten und hebt die kleinen Tiere hervor.
- source_word: מְחַבְּלִים
  choice: die … verwüsten
  rationale: Das Partizip bezeichnet fortdauerndes schädigendes Handeln. „Verwüsten“ gibt den kräftigen Sinn von חבל im Kontext von Weinbergen natürlich wieder, ohne zwingend völlige Vernichtung zu behaupten.
- source_word: כְּרָמִים
  choice: die Weinberge
  rationale: Das Substantiv bezeichnet gewöhnlich Weinberge, nicht einzelne Weinstöcke. Der bestimmte Artikel ist im Deutschen bei der generischen, im Bild bereits eingeführten Größe natürlich.
- source_word: וּכְרָמֵינוּ
  choice: denn unsere Weinberge
  rationale: Das Waw kann hier den begründenden Zusammenhang zur Aufforderung ausdrücken. „Denn“ macht diese naheliegende Beziehung im Deutschen klar, während die Grundbedeutung des Nomens und das Pluralsuffix erhalten bleiben.
- source_word: סְמָדַר
  choice: stehen in Blüte
  rationale: סמדר bezeichnet wahrscheinlich die Blüte beziehungsweise frühe Blühphase der Rebe. „In Blüte stehen“ ist eine natürliche, bildhafte deutsche Formulierung; die weniger wahrscheinliche Deutung als junge Trauben wird vermerkt.
