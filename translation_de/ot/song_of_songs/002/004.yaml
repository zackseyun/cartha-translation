lexical_decisions:
- source_word: הֱבִיאַנִי
  choice: Er brachte mich
  rationale: Das Hifil-Perfekt der Wurzel בוא mit Objektssuffix der 1. Person Singular bezeichnet kausativ das Hineinbringen beziehungsweise Hinführen. Das deutsche Präteritum gibt den poetischen Erzählton natürlich wieder.
- source_word: אֶל
  choice: ins
  rationale: Bei einem Bewegungsverb und einer Ortsangabe drückt אֶל das Ziel aus; „ins“ macht den Eintritt in das Haus idiomatisch deutlich.
- source_word: בֵּית הַיָּיִן
  choice: Haus des Weines
  rationale: Die Constructus-Verbindung bedeutet wörtlich „Haus des Weines“. Diese Wiedergabe bewahrt das konkrete poetische Bild, ohne es vorschnell als Fest- oder Bankettsaal auszulegen.
- source_word: וְדִגְלוֹ
  choice: und sein Banner
  rationale: דֶּגֶל bezeichnet ein Banner oder Feldzeichen. „Banner“ ist im Deutschen poetisch verständlich und bewahrt das Bild eines sichtbaren Zeichens.
- source_word: עָלַי
  choice: über mir
  rationale: עַל wird innerhalb des räumlichen Bannerbildes natürlich mit „über mir“ wiedergegeben.
- source_word: אַהֲבָה
  choice: Liebe
  rationale: Das artikellose Substantiv steht prädikativ beziehungsweise appositionell. „Liebe“ bewahrt die knappe Aussage und ergänzt nicht deutend „seine Liebe“.
