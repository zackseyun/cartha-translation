  text: He brought me into the house of wine[a], and his banner over me was love.
translation:
  language: de
  text: Er brachte mich ins Haus des Weines[a], und sein Banner über mir war Liebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ins Festhaus“. Wörtlich steht im Hebräischen: „ins Haus des Weines“.'
