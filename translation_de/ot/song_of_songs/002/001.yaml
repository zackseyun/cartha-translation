  yaml_path: translation/ot/song_of_songs/002/001.yaml
  text: I am a crocus of Sharon[a], a lily of the valleys.
translation:
  language: de
  text: Ich bin eine Krokusblüte von Scharon[a], eine Lilie der Täler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Rose von Scharon“. Das hebräische Wort חֲבַצֶּלֶת bezeichnet eine Blume, deren genaue Art unsicher ist. „Krokus“ gilt als wahrscheinlichere Bestimmung; die traditionelle Wiedergabe „Rose“ bleibt als Alternative erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Ich bin
  rationale: Das selbstständige Pronomen hebt die Selbstbezeichnung hervor; im Deutschen wird die im Hebräischen fehlende Kopula natürlich mit „bin“ ergänzt.
- source_word: חֲבַצֶּלֶת
  choice: Krokusblüte
  rationale: Die genaue Pflanzenart ist unsicher. „Krokus“ ist eine plausible moderne Annäherung; „-blüte“ macht das Blumenbild im Deutschen natürlich, ohne botanische Gewissheit vorzutäuschen.
- source_word: הַשָּׁרוֹן
  choice: in Scharon
  rationale: Scharon ist ein geografischer Eigenname. Die örtliche Zuordnung wird im Deutschen idiomatisch mit „in“ wiedergegeben; gemeint ist die Scharonebene.
- source_word: שׁוֹשַׁנַּת
  choice: Lilie
  rationale: Obwohl die genaue botanische Bestimmung nicht völlig sicher ist, ist „Lilie“ die gebräuchliche und sachlich gut vertretbare Wiedergabe des hebräischen Blumennamens.
- source_word: הָעֲמָקִים
  choice: der Täler
  rationale: Der Plural bezeichnet Täler oder tiefer gelegene Gebiete. „der Täler“ ist klar, poetisch und bewahrt den Parallelismus.
theological_decisions: []
