base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/014.yaml
  text: My dove[a], in the clefts of the rock, in the hiding place of the cliff, let me see your appearance; let me hear your voice, for your voice is sweet[b], and your appearance is lovely.
translation:
  language: de
  text: Meine Taube, in den Spalten des Felsens, im Versteck der Felswand[a], zeig dich mir[b], lass mich deine Stimme hören! Denn deine Stimme ist lieblich, und dein Anblick ist schön.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Schutz des steilen Felsens“ beziehungsweise „im Versteck am Felsabsatz“. Das hebräische Wort ist selten und kann einen steilen Aufstieg, einen Felsabsatz oder eine Felswand bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Lass mich dein Aussehen sehen“; auch möglich: „Zeig mir dein Gesicht.“ Das hebräische Wort bezeichnet das sichtbare Erscheinungsbild oder den Anblick und kann sich im Zusammenhang auch auf das Gesicht beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנָתִי
  choice: Meine Taube
  rationale: Die wörtliche und im Deutschen natürliche poetische Anrede bewahrt das Bild und den liebevollen Ton.
- source_word: בְּחַגְוֵי הַסֶּלַע
  choice: in den Spalten des Felsens
  rationale: חגוי bezeichnet Spalten oder Klüfte; „Spalten des Felsens“ gibt das konkrete Bild klar und idiomatisch wieder.
- source_word: בְּסֵתֶר הַמַּדְרֵגָה
  choice: im Versteck der Felswand
  rationale: סתר bezeichnet einen verborgenen oder geschützten Ort. Das seltene מדרגה weist hier wahrscheinlich auf eine steile Felsformation, einen Absatz oder Aufstieg hin; die Fußnote erhält diese Unsicherheit.
- source_word: הַרְאִינִי אֶת־מַרְאַיִךְ
  choice: zeig dich mir
  rationale: Die Wendung gibt die auffordernde Bitte natürlich wieder, ohne מראה unnötig auf das Gesicht oder die Körpergestalt einzuengen.
- source_word: הַשְׁמִיעִינִי אֶת־קוֹלֵךְ
  choice: lass mich deine Stimme hören
  rationale: Die Hifil-Aufforderung bedeutet wörtlich „lass mich hören“ und wird im Deutschen so natürlich und genau wiedergegeben.
- source_word: עָרֵב
  choice: lieblich
  rationale: Das Adjektiv bezeichnet etwas Angenehmes oder Süßes; „lieblich“ passt im Deutschen idiomatisch zu einer Stimme und wahrt den poetischen Ton.
- source_word: מַרְאֵיךְ
  choice: dein Anblick
  rationale: מראה bezeichnet die sichtbare Erscheinung beziehungsweise den Anblick. „Anblick“ ist im abschließenden Urteil natürlich und bleibt weiter gefasst als „Gesicht“.
- source_word: נָאוֶה
  choice: schön
  rationale: Das Wort bedeutet schön oder lieblich; „schön“ ist modernes, würdevolles Deutsch und vermeidet eine unnötig altertümliche Formulierung.
