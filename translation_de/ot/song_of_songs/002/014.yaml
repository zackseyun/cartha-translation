translation_notes:
  register: Modernes, poetisch-würdevolles Standarddeutsch. Die beiden parallelen Bitten werden mit „zeig dich mir“ und „lass mich … hören“ natürlich wiedergegeben. Die seltene topografische Bezeichnung bleibt durch eine Fußnote offen; die mögliche engere Bedeutung von מראה als Gesicht wird ebenfalls nicht stillschweigend festgelegt.
