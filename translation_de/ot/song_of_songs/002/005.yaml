  - marker: b
    text: 'Wörtlicher kann die Bitte heißen: »Polstert mich mit Äpfeln« oder »Bettet mich auf Äpfel.« Das hebräische Verb bezeichnet gewöhnlich das Ausbreiten oder Unterlegen als Polster beziehungsweise Lager.'
    reason: lexical_alternative
  - marker: c
    text: Das traditionell mit »Äpfel« übersetzte hebräische Wort kann allgemeiner eine wohlriechende Frucht bezeichnen; die genaue Fruchtart ist unsicher.
    reason: cultural_note
  - marker: d
    text: 'Oder: »liebeskrank« beziehungsweise »krank aus Liebe«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַמְּכוּנִי
  choice: Stützt mich
  rationale: Der Pluralimperativ von סמך bezeichnet das Stützen oder Aufrechterhalten. »Stützt mich« gibt das konkrete Bild und die angesprochene körperliche oder emotionale Schwäche knapp wieder.
- source_word: בָּאֲשִׁישׁוֹת
  choice: mit Rosinenkuchen
  rationale: אֲשִׁישׁוֹת bezeichnet gepresste Kuchen oder Fladen, wahrscheinlich aus Rosinen beziehungsweise Trauben. »Rosinenkuchen« ist verständlich und vermeidet eine unnötig genaue Beschreibung der Zubereitung.
- source_word: רַפְּדוּנִי
  choice: erfrischt mich
  rationale: רפד bezeichnet eigentlich das Ausbreiten oder Unterlegen, besonders zum Polstern oder Betten. Im Parallelismus mit der Bitte um stärkende Speise vermittelt »erfrischt mich« die beabsichtigte belebende Fürsorge; das konkrete Bild bleibt in einer Fußnote erhalten.
- source_word: בַּתַּפּוּחִים
  choice: mit Äpfeln
  rationale: תַּפּוּחַ wird traditionell als »Apfel« wiedergegeben, obwohl die genaue botanische Bestimmung unsicher ist. Die geläufige Wiedergabe steht im Haupttext, die Unsicherheit in einer Fußnote.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung der beiden Bitten ein. »Denn« passt natürlich zum gehobenen poetischen Ton.
- source_word: חוֹלַת אַהֲבָה
  choice: krank vor Liebe
  rationale: Die Wendung bezeichnet einen durch Liebe verursachten Zustand von Krankheit oder Schwäche. »Krank vor Liebe« bewahrt sowohl das starke körperliche Bild als auch die kausale Beziehung.
- source_word: אָנִי
  choice: ich bin
  rationale: Das selbstständige Pronomen hebt die Sprecherin ausdrücklich hervor und wird in der natürlichen deutschen Satzbildung durch »ich bin« wiedergegeben.
