translation:
  language: de
  text: Stützt mich mit Rosinenkuchen[a], erfrischt mich mit Äpfeln[b][c], denn ich bin krank vor Liebe[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Rosinenfladen« beziehungsweise »mit gepressten Traubenkuchen«.'
