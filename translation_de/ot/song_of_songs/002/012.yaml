source:
  edition: WLC
  text: הַ/נִּצָּנִים֙ נִרְא֣וּ בָ/אָ֔רֶץ עֵ֥ת הַ/זָּמִ֖יר הִגִּ֑יעַ וְ/ק֥וֹל הַ/תּ֖וֹר נִשְׁמַ֥ע בְּ/אַרְצֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/012.yaml
  text: The blossoms appear in the land; the time of singing has come[a], and the voice of the turtledove is heard in our land.
translation:
  language: de
  text: Die Blüten zeigen sich im Land; die Zeit des Singens ist gekommen[a], und die Stimme der Turteltaube ist in unserem Land zu hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Zeit des Beschneidens ist gekommen.“ Das hebräische Wort זָמִיר kann sowohl „Singen/Gesang“ als auch „Beschneiden“ bezeichnen. „Singen“ ist hier vorzuziehen, weil danach die Stimme der Turteltaube erwähnt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּנִים
  choice: die Blüten
  rationale: Das Wort bezeichnet die im Frühling sichtbar werdenden Blüten beziehungsweise Blumen. „Blüten“ ist anschaulich und legt sich nicht auf noch ungeöffnete Knospen fest.
- source_word: נִרְאוּ
  choice: zeigen sich
  rationale: Der Nifal bezeichnet hier das Sichtbarwerden. „Zeigen sich“ gibt den intransitiven Sinn natürlich und poetisch wieder.
- source_word: בָאָרֶץ
  choice: im Land
  rationale: אֶרֶץ bezeichnet hier innerhalb der örtlichen Frühlingsszene das Land, nicht die Erde als Ganzes.
- source_word: עֵת הַזָּמִיר
  choice: die Zeit des Singens
  rationale: עֵת bedeutet „Zeit“ oder „Jahreszeit“; זָמִיר kann „Singen/Gesang“ oder „Beschneiden“ bedeuten. „Singen“ passt zum folgenden Ruf der Turteltaube, ohne die andere Möglichkeit zu verschweigen.
- source_word: הִגִּיעַ
  choice: ist gekommen
  rationale: Das Verb bedeutet in dieser Wendung, dass eine Zeit eingetroffen beziehungsweise gekommen ist.
- source_word: וְקוֹל
  choice: und die Stimme
  rationale: קוֹל kann „Stimme“ oder „Laut/Klang“ bedeuten. „Stimme“ bewahrt die lyrische Personifizierung des Hebräischen.
- source_word: הַתּוֹר
  choice: der Turteltaube
  rationale: תּוֹר bezeichnet spezifisch die Turteltaube; die genaue Vogelbezeichnung trägt zum Frühlingsbild bei.
- source_word: נִשְׁמַע
  choice: ist … zu hören
  rationale: Der Nifal von שמע bedeutet „wird/ist gehört“. Die deutsche Wendung ist idiomatisch und fügt keine besondere Art des Rufens hinzu.
- source_word: בְּאַרְצֵנוּ
  choice: in unserem Land
  rationale: Die Endung der ersten Person Plural schafft einen gemeinsamen, vertrauten Schauplatz; „unserem Land“ bewahrt diesen Bezug.
