base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/007.yaml
  text: 'I adjure you[a], daughters of Jerusalem[c][b], by the gazelles or by the does of the field: do not stir up or awaken love until it pleases.'
translation:
  language: de
  text: 'Ich beschwöre euch[a], ihr Töchter Jerusalems, bei den Gazellen oder den Hirschkühen des Feldes[b]: Entfacht die Liebe nicht und weckt sie nicht auf, bis sie selbst es will.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ich stelle euch unter Eid.“'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung „bei den Gazellen oder bei den Hirschkühen des Feldes“ ist eine poetische Eidesformel. Manche vermuten darin zusätzlich ein Wortspiel mit Gottesbezeichnungen; im unmittelbaren Zusammenhang liegt jedoch die Tierbildsprache am nächsten.
    reason: cultural_note
  - marker: c
    text: 'Das hebräische Verb ist feminin und kann sich auf „die Liebe“ beziehen. Auch möglich: „bis es ihr gefällt“; gemeint ist jedenfalls, dass Liebe nicht vorzeitig erzwungen werden soll.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: Ich beschwöre euch
  rationale: Die Hifil-Form von שׁבע bezeichnet hier das feierliche Verpflichten durch einen Eid. „Ich beschwöre euch“ bewahrt den ernsten, formelhaften Ton und ist im Deutschen verständlicher als eine rein wörtliche Wiedergabe.
- source_word: בְּנוֹת יְרוּשָׁלִַם
  choice: ihr Töchter Jerusalems
  rationale: Die direkte, poetische Anrede wird beibehalten; „ihr“ macht die Anrede im Deutschen natürlich, ohne das kollektive Bild zu verflachen.
- source_word: בִּצְבָאוֹת
  choice: bei den Gazellen
  rationale: צְבָאוֹת bezeichnet in diesem Parallelismus Gazellen, nicht Heerscharen. Das Tierbild entspricht dem unmittelbaren Kontext des Hohelieds.
- source_word: אוֹ
  choice: oder
  rationale: Die gewöhnliche Bedeutung der Konjunktion wird bewahrt; sie verbindet die beiden parallelen Elemente der poetischen Eidesformel.
- source_word: בְּאַיְלוֹת הַשָּׂדֶה
  choice: bei den Hirschkühen des Feldes
  rationale: אַיְלוֹת bezeichnet weibliches Rot- oder Damwild beziehungsweise Hirschkühe. Die formale Wendung „des Feldes“ bewahrt die poetische Bildsprache.
- source_word: אִם תָּעִירוּ וְאִם תְּעוֹרְרוּ
  choice: Weckt … nicht auf und facht … nicht an
  rationale: Nach der Beschwörung haben die mit אִם eingeleiteten Sätze die Kraft eines nachdrücklichen Verbots. Beide nahezu synonymen Verben werden wiedergegeben, um die hebräische Verstärkung zu erhalten.
- source_word: הָאַהֲבָה
  choice: die Liebe
  rationale: Der bestimmte Artikel und der feminine abstrakte Begriff lassen sich im Deutschen natürlich mit „die Liebe“ wiedergeben.
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: bis sie selbst es will
  rationale: Das feminine Verb kann sich grammatisch auf „die Liebe“ beziehen. Das feminine Pronomen ist im Deutschen zugleich grammatisch natürlich und bewahrt die mögliche Personifikation; „selbst“ verdeutlicht, dass Liebe nicht erzwungen werden soll, ohne einen bestimmten Zeitpunkt in den Text einzutragen.
theological_decisions:
- issue: Bezug und Personifikation der Liebe im Schlusssatz
  choice: '„die Liebe“ als Bezugswort des femininen Verbs: „bis sie selbst es will“'
  alternative: 'Unpersönlich: „bis die rechte Zeit dafür gekommen ist“ oder „bis es ihr gefällt“'
  rationale: Die hebräische Grammatik legt „die Liebe“ als feminines Subjekt nahe, lässt die Stärke der Personifikation jedoch offen. Die gewählte Form bewahrt diese poetische Spannung und vermeidet die interpretierende Ergänzung einer ausdrücklich „rechten Zeit“.
- issue: Charakter der Tierformel
  choice: Wörtliche Wiedergabe als Schwur bei Gazellen und Hirschkühen
  alternative: Deutung als verhüllte Anspielung auf Gottesnamen
  rationale: Der Parallelismus bietet unmittelbar verständliche Tierbilder. Eine mögliche lautliche Anspielung ist unsicher und wird daher nicht in den Haupttext eingetragen, sondern nur in der Fußnote erwähnt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischem Rhythmus. Die traditionelle Anrede „Töchter Jerusalems“ und die Naturbilder bleiben erhalten; seltene oder missverständliche Einzelheiten werden in Fußnoten erläutert.
