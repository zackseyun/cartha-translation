  text: דּוֹמֶ֤ה דוֹדִ/י֙ לִ/צְבִ֔י א֖וֹ לְ/עֹ֣פֶר הָֽ/אַיָּלִ֑ים הִנֵּה זֶ֤ה עוֹמֵד֙ אַחַ֣ר כָּתְלֵ֔/נוּ מַשְׁגִּ֨יחַ֙ מִן הַֽ/חֲלֹּנ֔וֹת מֵצִ֖יץ מִן הַֽ/חֲרַכִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/009.yaml
  text: My beloved is like a gazelle or a young stag[a]. Look—there he stands behind our wall, gazing through the windows[b], peering through the lattice.
translation:
  language: de
  text: Mein Geliebter gleicht einer Gazelle oder einem jungen Hirsch[a]. Sieh, da steht er hinter unserer Mauer! Er schaut durch die Fenster, späht durch das Gitter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „einem Jungen der Hirsche“. Die hebräische Wendung bezeichnet ein Jungtier aus der Hirschfamilie; „junger Hirsch“ bewahrt den männlichen Bezug auf den Geliebten.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist ein Gitterwerk oder eine Reihe schmaler Öffnungen in der Wand beziehungsweise im Fensterbereich, nicht unbedingt ein eigenständiges modernes Fenstergitter.
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹמֶה דוֹדִי
  choice: Mein Geliebter gleicht
  rationale: Das Partizip bezeichnet einen Vergleich; „gleicht“ gibt ihn knapp und poetisch wieder. „Mein Geliebter“ ist im Hohelied eine natürliche, würdevolle Wiedergabe der Beziehungsbezeichnung דּוֹדִי.
- source_word: לִצְבִי
  choice: einer Gazelle
  rationale: צְבִי bezeichnet hier die Gazelle als Bild für Anmut und Beweglichkeit; der moderne deutsche Tiername ist klar und präzise.
- source_word: לְעֹפֶר הָאַיָּלִים
  choice: einem jungen Hirsch
  rationale: עֹפֶר bezeichnet ein Jungtier und אַיָּלִים Tiere der Hirschfamilie. „Junger Hirsch“ wahrt die männliche Bildsprache für den Geliebten, ohne die hebräische Wendung unnatürlich nachzubilden.
- source_word: הִנֵּה זֶה
  choice: Sieh, da
  rationale: Die deiktische Wendung lenkt lebhaft die Aufmerksamkeit auf den plötzlich wahrgenommenen Geliebten. „Sieh, da“ ist gegenwärtig verständlich und behält den poetischen Ausruf bei.
- source_word: עוֹמֵד אַחַר כָּתְלֵנוּ
  choice: steht er hinter unserer Mauer
  rationale: Das Partizip schildert die Szene unmittelbar. כֹּתֶל steht im Singular und meint eine Mauer beziehungsweise massive Wand; „unsere Mauer“ bewahrt diese Form und lässt den genauen baulichen Bezug offen.
- source_word: מַשְׁגִּיחַ מִן הַחֲלֹּנוֹת
  choice: Er schaut durch die Fenster
  rationale: מַשְׁגִּיחַ bezeichnet hier aufmerksames Hinschauen. Im Deutschen gibt „durch“ bei Fenstern die Blickrichtung idiomatisch wieder, obwohl die hebräische Präposition wörtlich auch „von“ bedeuten kann.
- source_word: מֵצִיץ מִן הַחֲרַכִּים
  choice: späht durch das Gitter
  rationale: מֵצִיץ beschreibt ein Hinein- oder Hindurchblicken, besonders durch schmale Öffnungen. חֲרַכִּים kann Öffnungen oder Gitterwerk bezeichnen; „Gitter“ erhält das anschauliche architektonische Bild.
theological_decisions: []
translation_notes:
  register: Moderne, poetische Standardsprache mit kurzen, lebhaften Sätzen. Der Ausruf „Sieh, da“ bewahrt die unmittelbare Wahrnehmung der Sprecherin; „schaut“ und „späht“ bilden die beiden hebräischen Partizipien unterscheidbar ab. Sämtliche Fußnotenmarker stehen im Haupttext.
