  language: en
  yaml_path: translation/ot/song_of_songs/002/010.yaml
  text: My beloved answered and said to me, “Rise up, my love, my beautiful one, and come away.”
translation:
  language: de
  text: 'Mein Geliebter antwortete mir: „Steh auf, meine Liebste, meine Schöne, und komm mit!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנָה
  choice: begann
  rationale: Das Verb bedeutet gewöhnlich „antworten“, kann aber auch den Beginn einer Äußerung bezeichnen. Da im unmittelbaren Zusammenhang keine vorausgehende Frage oder Rede vorliegt, gibt „begann“ den idiomatischen Sinn natürlich wieder.
- source_word: דּוֹדִי
  choice: mein Geliebter
  rationale: Im Hohelied bezeichnet דּוֹד den männlichen Geliebten; „mein Geliebter“ ist präzise, geläufig und dem poetischen Register angemessen.
- source_word: רַעְיָתִי
  choice: meine Freundin
  rationale: Die Anrede bezeichnet die geliebte Gefährtin. „Meine Freundin“ bewahrt die relationale Bedeutung, ohne eine Ehebeziehung ausdrücklich vorauszusetzen.
- source_word: יָפָתִי
  choice: meine Schöne
  rationale: Die substantivierte Anrede gibt die Schönheit der Frau knapp und poetisch wieder.
- source_word: קוּמִי לָךְ ... וּלְכִי לָךְ
  choice: Steh auf ... und komm!
  rationale: Die femininen Imperative fordern zum Aufstehen und Mitkommen auf. Das idiomatische לָךְ verstärkt bzw. belebt die Aufforderung; im Deutschen wird dies natürlich durch die direkten Imperative ausgedrückt.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle und leicht verständliche poetische Sprache. Die wörtliche Antwortformel wird nicht mechanisch als „antwortete“ wiedergegeben, weil kein ausdrücklich vorangehender Redebeitrag vorliegt; die Szene bleibt dennoch unverändert.
