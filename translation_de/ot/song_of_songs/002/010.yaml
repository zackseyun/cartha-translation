  source_fidelity: Das einleitende עָנָה ... וְאָמַר bezeichnet eine Antwort-/Erwiderungsformel. Die Wiedergabe „begann und sagte“ ist hierfür ohne tragfähigen Anlass zu frei und klingt im Deutschen zudem unvollständig. „antwortete mir“ gibt die Funktion der Formel idiomatisch wieder. Die femininen Imperative sowie die liebevollen Anreden werden bewahrt; „komm mit“ gibt die auf Mitgehen zielende Aufforderung natürlich wieder.
  naturalness: „Mein Geliebter begann und sagte zu mir“ ist im modernen Standarddeutsch holprig, weil „beginnen“ hier keinen klaren Ergänzungsbezug hat. Die revidierte Fassung ist flüssig, poetisch und verständlich.
  terminology: „Mein Geliebter“ entspricht דּוֹדִי. Für רַעְיָתִי ist „meine Liebste“ im gegenwärtigen Deutsch als Anrede eindeutiger und poetisch passender als das potenziell unverbindliche „meine Freundin“, ohne einen Ehestatus zu behaupten. „Meine Schöne“ gibt יָפָתִי angemessen wieder.
