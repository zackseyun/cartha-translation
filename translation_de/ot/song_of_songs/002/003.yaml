base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/003.yaml
  text: Like an apple tree among the trees of the forest[a], so is my beloved among the sons. In his shade I delighted to sit[b], and his fruit was sweet to my taste.
translation:
  language: de
  text: Wie ein Apfelbaum[a] unter den Bäumen des Waldes, so ist mein Geliebter unter den jungen Männern[b]. Nach seinem Schatten verlangte ich und setzte mich nieder, und seine Frucht war meinem Gaumen süß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Welche Baumart das hebräische Wort תַּפּוּחַ genau bezeichnet, ist unsicher; traditionell wird es mit „Apfelbaum“ wiedergegeben.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „unter den Söhnen“. Gemeint sind hier junge Männer beziehungsweise männliche Altersgenossen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַפּוּחַ
  choice: Apfelbaum
  rationale: Die traditionelle und im Deutschen unmittelbar verständliche Wiedergabe bewahrt das Bild eines begehrenswerten Fruchtbaums; die genaue botanische Art bleibt unsicher und wird in einer Fußnote kenntlich gemacht.
- source_word: בַּעֲצֵי הַיַּעַר
  choice: unter den Bäumen des Waldes
  rationale: Die Formulierung gibt den Vergleich eines einzelnen, herausragenden Fruchtbaums mit den übrigen Waldbäumen natürlich und bildhaft wieder.
- source_word: דּוֹדִי
  choice: mein Geliebter
  rationale: Im Hohelied bezeichnet דּוֹד den geliebten Mann in erotisch-romantischem Zusammenhang. „Mein Geliebter“ ist präzise, würdevoll und poetisch.
- source_word: בֵּין הַבָּנִים
  choice: unter den jungen Männern
  rationale: Wörtlich steht „unter den Söhnen“, doch im Kontext bezeichnet בָּנִים die männlichen Altersgenossen beziehungsweise jungen Männer. Die idiomatische Bedeutung steht im Haupttext, die hebräische Form in der Fußnote.
- source_word: בְּצִלּוֹ
  choice: in seinem Schatten
  rationale: Das maskuline Suffix führt die Metapher vom Baum auf den Geliebten weiter; „seinem“ bewahrt diese Personalisierung.
- source_word: חִמַּדְתִּי וְיָשַׁבְתִּי
  choice: wollte ich so gern sitzen; dort setzte ich mich nieder
  rationale: Die Wiedergabe hält sowohl das Verlangen beziehungsweise Gefallen als auch das anschließende tatsächliche Sichsetzen fest. Die leicht entfaltete Form ist im modernen Deutschen natürlicher als eine starre Nachbildung der hebräischen Verbfolge.
- source_word: וּפִרְיוֹ
  choice: und seine Frucht
  rationale: Das männliche Pronomen setzt die ineinander übergehenden Bilder von Baum und Geliebtem fort.
- source_word: מָתוֹק לְחִכִּי
  choice: war meinem Gaumen süß
  rationale: „Gaumen“ gibt חֵךְ konkret wieder und erhält die sinnliche Bildsprache; die Präteritumform entspricht der erzählten Erfahrung.
theological_decisions: []
translation_notes:
  register: Modernes, poetisch-würdevolles Standarddeutsch. Die sinnliche Bildsprache des Liebesgedichts bleibt erhalten, ohne sie allegorisch oder konfessionell auszudeuten. Die leichte Wiederholung bei „sitzen“ und „setzte“ bildet sowohl Wunsch als auch Handlung des Hebräischen transparent ab.
