base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/011.yaml
  text: For look[a], the winter has passed; the rain is over and gone.
translation:
  language: de
  text: 'Denn sieh: Der Winter[a] ist vorüber; der Regen ist vorbei und fort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Regenzeit«.'
    reason: Das hebräische Wort kann den Winter genauer als die von Regen geprägte Jahreszeit bezeichnen.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Einladung und wahrt den Anschluss an den Kontext.
- source_word: הִנֵּה
  choice: sieh
  rationale: Die Aufmerksamkeitspartikel wird mit einer gegenwärtigen, würdevollen und zugleich natürlichen Aufforderung wiedergegeben.
- source_word: הַסְּתָו
  choice: der Winter
  rationale: Das Substantiv bezeichnet den Winter beziehungsweise die Regenzeit. »Winter« ist im Deutschen poetisch und idiomatisch; die engere Bedeutung wird in der Fußnote bewahrt.
- source_word: עָבָר
  choice: ist vorüber
  rationale: Das Qal-Perfekt beschreibt den abgeschlossenen Übergang der Jahreszeit; »ist vorüber« klingt im Deutschen natürlich.
- source_word: הַגֶּשֶׁם
  choice: der Regen
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: חָלַף
  choice: ist vorbei
  rationale: Die Form bezeichnet etwas, das vorübergezogen beziehungsweise verschwunden ist. Die Wortwahl erhält den Parallelismus, ohne das vorausgehende Verb genau zu wiederholen.
- source_word: הָלַךְ לוֹ
  choice: und fort
  rationale: 'Die hebräische Wendung verstärkt die Aussage: Der Regen ist nicht nur vorbei, sondern fortgegangen. Die knappe Form wahrt die poetische Steigerung.'
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Der Doppelpunkt nach »sieh« macht die hinweisende Funktion deutlich; das Semikolon bewahrt die parallele Versstruktur.
