lexical_decisions:
- source_word: כְּ/שׁוֹשַׁנָּה
  choice: Wie eine Lilie
  rationale: שׁוֹשַׁנָּה bezeichnet eine lilienartige Blume, deren genaue botanische Bestimmung unsicher ist. „Lilie“ bewahrt das traditionelle, verständliche poetische Bild; כְּ wird als ausdrücklicher Vergleich mit „wie“ wiedergegeben.
- source_word: בֵּין
  choice: unter
  rationale: Bei einer Mehrzahl bezeichnet בֵּין hier die Stellung innerhalb einer Gruppe. Das deutsche „unter“ ist in beiden Vershälften natürlich und wahrt den Parallelismus.
- source_word: הַחוֹחִים
  choice: Dornen
  rationale: חוֹחִים bezeichnet dornige Pflanzen beziehungsweise Dornengestrüpp. „Dornen“ gibt das kontrastreiche Bild knapp und idiomatisch wieder.
- source_word: כֵּן
  choice: so ist
  rationale: כֵּן leitet die Entsprechung zum vorangehenden Vergleich ein. „So ist“ vervollständigt den deutschen Vergleich klar und poetisch.
- source_word: רַעְיָתִי
  choice: meine Geliebte
  rationale: רַעְיָה bezeichnet im Hohelied die geliebte Frau beziehungsweise Gefährtin des Sprechers. „Meine Geliebte“ drückt die intime Beziehung würdig und im Deutschen eindeutig aus.
- source_word: הַבָּנוֹת
  choice: den jungen Frauen
  rationale: Wörtlich bedeutet בָּנוֹת „die Töchter“, kann im Kontext des Hohelieds jedoch idiomatisch die jungen Frauen einer Gruppe bezeichnen. „Junge Frauen“ ist im modernen Deutschen unmittelbar verständlich und vermeidet den missverständlichen Eindruck, es seien die leiblichen Töchter des Sprechers gemeint.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Der parallele Aufbau „Wie …, so …“ und die zweimalige Wiedergabe von בֵּין mit „unter“ bewahren die Form und den Kontrast des hebräischen Bildes. Die Fußnote macht die wörtliche hebräische Ausdrucksweise transparent, ohne sie im Haupttext unnatürlich wirken zu lassen.
