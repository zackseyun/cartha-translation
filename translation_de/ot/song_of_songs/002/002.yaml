  text: Like a lily among thorns[b][a], so is my beloved among the daughters.
translation:
  language: de
  text: Wie eine Lilie unter Dornen, so ist meine Geliebte unter den jungen Frauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: den Töchtern.'
