translation:
  language: de
  text: Mein Geliebter ist mein[a], und ich bin sein – er weidet[b] unter den Lilien[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Liebster“ statt „mein Geliebter“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Partizip kann je nach Zusammenhang sowohl „weiden“ als auch „hüten“ bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Welche Blume genau gemeint ist, ist unsicher; das Wort kann allgemeiner eine auffällige Blüte bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹדִי
  choice: mein Geliebter
  rationale: דּוֹד bezeichnet im Hohelied den geliebten Mann in einer innigen, romantischen Beziehung. „Mein Geliebter“ ist im Deutschen natürlich, würdevoll und bewahrt den Beziehungscharakter des Ausdrucks.
- source_word: לִי
  choice: ist mein
  rationale: Die Präposition mit Suffix drückt hier Zugehörigkeit beziehungsweise eine enge Beziehung aus. „Ist mein“ gibt die knappe hebräische Aussage wieder und bildet mit dem folgenden „ich bin sein“ eine klare poetische Entsprechung.
- source_word: וַאֲנִי לוֹ
  choice: und ich bin sein
  rationale: Die Formulierung wahrt die Kürze und die wechselseitige Zugehörigkeit des Hebräischen, ohne das Verhältnis durch eine ausführlichere Umschreibung näher festzulegen.
- source_word: הָרֹעֶה
  choice: er weidet
  rationale: Das Qal-Partizip von רעה kann „weiden“, „hüten“ oder „Nahrung suchen“ bedeuten. Das deutsche „weidet“ bewahrt die Bildsprache und lässt offen, ob der Geliebte selbst zwischen den Blumen weidet oder dort als Hirt tätig ist.
- source_word: בַּשּׁוֹשַׁנִּים
  choice: zwischen den Lilien
  rationale: Die traditionelle Wiedergabe „Lilien“ ist verständlich und poetisch, obwohl die genaue Pflanzenart unsicher ist. „Zwischen“ gibt den räumlichen Sinn der Präposition in diesem Zusammenhang natürlich wieder.
