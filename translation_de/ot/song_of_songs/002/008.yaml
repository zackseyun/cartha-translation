  text: The sound of my beloved! Look[a], here he comes, leaping over the mountains, bounding over the hills.
translation:
  language: de
  text: Die Stimme meines Geliebten![a] Sieh, da kommt er, springt über die Berge, hüpft über die Hügel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Geräusch meines Geliebten!“ Das hebräische Wort qōl kann sowohl „Stimme“ als auch „Laut, Geräusch“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל
  choice: Horch
  rationale: Das exklamative קוֹל kündigt etwas akustisch Wahrnehmbares an. „Horch“ gibt den natürlichen deutschen Ausruf wieder, ohne im Haupttext festzulegen, ob die Stimme des Geliebten oder das Geräusch seines Kommens gemeint ist.
- source_word: דּוֹדִי
  choice: mein Geliebter
  rationale: Im Hohelied bezeichnet דּוֹד den geliebten Mann. „Mein Geliebter“ ist poetisch, würdevoll und im modernen Deutschen verständlich.
- source_word: הִנֵּה זֶה
  choice: Sieh, da
  rationale: Die Verbindung lenkt lebhaft die Aufmerksamkeit auf den sich nähernden Geliebten. „Sieh, da“ bewahrt den deiktischen und ausrufenden Charakter in natürlichem Deutsch.
- source_word: בָּא
  choice: kommt er
  rationale: Die Form beschreibt hier anschaulich das gegenwärtig wahrgenommene Herankommen; das deutsche Präsens erhält diese Unmittelbarkeit.
- source_word: מְדַלֵּג
  choice: springt
  rationale: Das Partizip schildert eine kraftvolle, agile Bewegung. „Springt“ ist klar und fügt sich natürlich in die poetische Szene.
- source_word: עַל הֶהָרִים
  choice: über die Berge
  rationale: עַל bezeichnet bei dieser Bewegung das Hinweg- beziehungsweise Darübergehen; „über die Berge“ ist die natürliche deutsche Wiedergabe.
- source_word: מְקַפֵּץ
  choice: hüpft
  rationale: Das Verb variiert das vorherige Bewegungsverb und bezeichnet lebhafte, wiederholte Sprünge. „Hüpft“ erhält den Parallelismus und die spielerisch-agile Bildsprache.
- source_word: עַל הַגְּבָעוֹת
  choice: über die Hügel
  rationale: Die Formulierung entspricht dem parallelen „über die Berge“ und gibt גְּבָעוֹת als „Hügel“ wieder.
