base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/006.yaml
  text: His left hand is under my head[a], and his right hand embraces me.
translation:
  language: de
  text: Seine Linke liegt unter meinem Kopf[a], und seine Rechte umarmt mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sein linker Arm liegt unter meinem Kopf, und sein rechter Arm umarmt mich.“ Die hebräischen Wörter für „links“ und „rechts“ können in diesem Zusammenhang auch die jeweilige Hand oder den Arm bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאלוֹ
  choice: seine Linke
  rationale: Das hebräische Substantiv bezeichnet die linke Seite beziehungsweise die linke Hand oder den linken Arm. „Seine Linke“ bewahrt diese Offenheit und klingt im poetischen deutschen Kontext natürlich.
- source_word: תַּחַת
  choice: unter
  rationale: Die Präposition bezeichnet hier klar die Lage unterhalb von etwas; „unter“ ist die unmittelbare und idiomatische Wiedergabe.
- source_word: לְרֹאשִׁי
  choice: meinem Kopf
  rationale: רֹאשׁ bedeutet „Kopf“. Zusammen mit תַּחַת ergibt sich „unter meinem Kopf“, ohne dass eine erläuternde Erweiterung nötig ist.
- source_word: וִימִינוֹ
  choice: und seine Rechte
  rationale: Parallel zu שְׂמֹאלוֹ bezeichnet das Wort die rechte Seite beziehungsweise Hand oder den Arm. „Seine Rechte“ erhält die knappe poetische Parallelstruktur und die lexikalische Offenheit.
- source_word: תְּחַבְּקֵנִי
  choice: umarmt mich
  rationale: Das Verb חבק bedeutet „umarmen“. Das Imperfekt wird in dieser anschaulich geschilderten Szene passend als deutsches Präsens wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die substantivierten Richtungsangaben „seine Linke“ und „seine Rechte“ bewahren die knappe Parallelität sowie die im Hebräischen nicht ausdrücklich auf Hand oder Arm festgelegte Körperbezeichnung.
