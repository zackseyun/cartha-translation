base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/013.yaml
  text: The fig tree has ripened its early figs[a], and the vines in blossom give off fragrance. Arise, my love, my beautiful one[c][b], and come away.
translation:
  language: de
  text: Der Feigenbaum setzt seine jungen Feigen an[a], und die blühenden Weinstöcke verströmen ihren Duft[b]. Steh auf, meine Liebste, meine Schöne, und komm doch![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Der Feigenbaum lässt seine Frühfeigen reifen“ oder „hat seine grünen Feigen hervorgebracht“. Das Hebräische kann das frühe Entwicklungsstadium der Frucht bezeichnen, nicht unbedingt ihre volle Reife.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Die Weinstöcke mit ihren Blüten verströmen Duft“ oder „die Weinstöcke mit jungen Trauben verströmen Duft“. Das hebräische Wort kann die Rebblüte oder die allererste Entwicklung der Trauben bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „und geh für dich“ bzw. „geh doch“. Im Zusammenhang ist es eine nachdrückliche Einladung aufzubrechen; daher „komm doch!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנְטָה פַגֶּיהָ
  choice: setzt seine jungen Feigen an
  rationale: Die Verbindung bezeichnet, dass die ersten beziehungsweise noch unreifen Feigen sichtbar werden und sich entwickeln. „Setzt … an“ bewahrt dieses frühe Entwicklungsstadium besser als „lässt … reifen“.
- source_word: סְמָדַר
  choice: die blühenden Weinstöcke
  rationale: Das Wort bezeichnet die Blüte oder ein sehr frühes Entwicklungsstadium der Trauben. Im Zusammenhang mit dem Duft ist „blühend“ die naheliegende, gut verständliche Wiedergabe.
- source_word: נָתְנוּ רֵיחַ
  choice: verströmen ihren Duft
  rationale: Das hebräische Bild „geben Duft“ wird in natürlichem, poetischem Deutsch wiedergegeben, ohne die Sinneswahrnehmung abzuschwächen.
- source_word: קוּמִי
  choice: Steh auf
  rationale: Der Imperativ ist eine liebevolle Aufforderung. „Steh auf“ klingt im modernen Deutschen natürlicher als „Erhebe dich“ und behält dennoch poetische Würde.
- source_word: רַעְיָתִי
  choice: meine Freundin
  rationale: Das Substantiv ist die im Hohelied wiederkehrende vertraute Anrede an die Geliebte. „Meine Freundin“ bewahrt den relationalen Grundsinn, während der Liebeskontext die Intimität deutlich macht.
- source_word: יָפָתִי
  choice: meine Schöne
  rationale: Die substantivierte Wiedergabe ist knapp, zärtlich und poetisch und bezeichnet eindeutig ihre Schönheit.
- source_word: וּלְכִי לָךְ
  choice: und komm mit mir
  rationale: Wörtlich steht eine Aufforderung zum Gehen mit einer idiomatischen, die Angesprochene betreffenden Ergänzung. Im Einladungskontext drückt „komm mit mir“ die Bewegungsrichtung aus Sicht des Rufenden natürlich aus, ohne das Hebräische mechanisch nachzubilden.
