source:
  edition: WLC
  text: אֶעֶרְכָ֣ה לְ/פָנָ֣י/ו מִשְׁפָּ֑ט וּ֝/פִ֗/י אֲמַלֵּ֥א תוֹכָחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/004.yaml
  text: I would lay out my case before him[b][a], and fill my mouth with arguments.
translation:
  language: de
  text: Ich würde meinen Rechtsfall vor ihm darlegen[a] und meinen Mund mit Argumenten füllen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Rechtssache vor ihm geordnet vorlegen“. Das hebräische Wort מִשְׁפָּט hat hier einen gerichtlichen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Für „Argumente“ auch: „Beweise“, „Einwände“, „Entgegnungen“ oder „Zurechtweisungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֶרְכָה
  choice: ich würde … darlegen
  rationale: Das Verb ערך bezeichnet ein geordnetes Anordnen oder Vorlegen. Im gerichtlichen Zusammenhang gibt „darlegen“ die sorgfältige Präsentation natürlich wieder.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Entspricht der Wendung „vor seinem Angesicht/in seiner Gegenwart“ und bewahrt zugleich die persönliche und gerichtliche Szene.
- source_word: מִשְׁפָּט
  choice: meinen Rechtsfall
  rationale: מִשְׁפָּט kann Gericht, Recht oder Rechtssache bedeuten. Hier bezeichnet es das Anliegen, das Hiob vor Gott vortragen möchte. Das Possessivpronomen ist kontextuell ergänzt.
- source_word: וּפִי
  choice: und meinen Mund
  rationale: Die konkrete hebräische Metapher bleibt erhalten und verbindet sich im Deutschen verständlich mit „füllen“.
- source_word: אֲמַלֵּא
  choice: würde … füllen
  rationale: Der Imperfekt setzt den hypothetischen Sinn des ersten Satzglieds fort und bewahrt das Bild des Füllens.
- source_word: תוֹכָחוֹת
  choice: Argumenten
  rationale: Das Wort kann Zurechtweisungen, Beweise, Einwände oder Streitgründe bezeichnen. Im forensischen Kontext sind „Argumente“ verständlich, ohne die rechtliche Auseinandersetzung abzuschwächen.
theological_decisions:
- issue: Gerichtliche Bildsprache in Hiobs Rede zu Gott
  choice: Die Aussage wird ausdrücklich in rechtlich-gerichtlicher Sprache wiedergegeben.
  alternative: 'Allgemeiner: „meine Sache vortragen“ oder „meine Klagen aussprechen“.'
  rationale: Die Verbindung von ערך, מִשְׁפָּט und תוֹכָחוֹת zeichnet eine Gerichtsszene. Hiobs kühner Wunsch, seinen Fall vor Gott zu vertreten, bleibt bestehen, ohne ihn zu verschärfen oder abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rechtsfall“ hält die forensische Bildwelt deutlich fest; die wörtliche Metapher „meinen Mund … füllen“ bewahrt die Ausdruckskraft des Hebräischen.
