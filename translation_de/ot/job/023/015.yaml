base_translation:
  language: en
  yaml_path: translation/ot/job/023/015.yaml
  text: Therefore I am terrified before him[a]; when I consider[b], I am afraid of him.
translation:
  language: de
  text: Darum erschaudere ich vor ihm[a]; wenn ich darüber nachdenke[b], fürchte ich mich vor ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von seinem Angesicht“ bzw. „von seiner Gegenwart“; auch möglich: „wegen ihm“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wenn ich nachsinne“ oder „wenn ich es bedenke“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung zieht eine Folgerung aus dem vorher Gesagten; „Darum“ gibt diese Schlussfolgerung knapp und natürlich wieder.
- source_word: מִפָּנָיו
  choice: vor ihm
  rationale: Die Verbindung von מִן mit פָּנִים bezeichnet hier Hiobs erschrockene Reaktion angesichts Gottes. „Vor ihm“ ist idiomatisch und bewahrt den Bezug zu seiner Gegenwart, ohne ihn auf eine bloße Ursache zu reduzieren.
- source_word: אֶבָּהֵל
  choice: erschrecke ich
  rationale: Das Nifal von בהל bezeichnet starkes Erschrecken oder Bestürztsein. „Erschrecke ich“ vermittelt die Intensität in natürlichem Deutsch.
- source_word: אֶתְבּוֹנֵן
  choice: denke ich darüber nach
  rationale: Die Form von בין bezeichnet ein aufmerksames Bedenken oder Nachsinnen. Die deutsche Wendung gibt den reflektierenden Vorgang klar wieder, lässt aber das unausgesprochene Objekt aus dem Kontext hervorgehen.
- source_word: וְאֶפְחַד
  choice: fürchte ich mich
  rationale: פחד bezeichnet konkrete Furcht. Die reflexive deutsche Form ist idiomatisch und bewahrt die deutliche Angstreaktion.
- source_word: מִמֶּנּוּ
  choice: vor ihm
  rationale: Mit „sich fürchten“ wird die hebräische Präposition im Deutschen natürlich durch „vor“ wiedergegeben.
theological_decisions:
- issue: Bezug der männlichen Pronominalsuffixe
  choice: Die Pronomen werden als „ihm“ wiedergegeben und beziehen sich im Kontext auf Gott.
  alternative: Den Gottesbezug durch „Gott“ ausdrücklich einsetzen.
  rationale: Der hebräische Text verwendet nur Pronominalsuffixe. Die Pronomen bewahren den Gesprächsfluss und vermeiden einen nicht ausdrücklich vorhandenen Gottesnamen oder Titel.
- issue: Stärke von Hiobs Reaktion auf Gott
  choice: Die starke Sprache des Erschreckens und der Furcht bleibt erhalten.
  alternative: Abschwächende Wiedergaben wie „bin beunruhigt“ oder „empfinde Ehrfurcht“.
  rationale: Der Vers beschreibt wirkliche Angst und Bestürzung. Diese theologische Spannung darf nicht zu bloßer Ehrfurcht geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung spiegelt die Folgerung und die anschließende innere Reflexion. Das zweimalige „vor ihm“ bewahrt den Parallelismus und die unverhüllte Furcht Hiobs.
