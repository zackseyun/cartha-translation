  text: שָׁ֗ם יָ֭שָׁר נוֹכָ֣ח עִמּ֑/וֹ וַ/אֲפַלְּטָ֥ה לָ֝/נֶ֗צַח מִ/שֹּׁפְטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/007.yaml
  text: There an upright man could reason with him[b][a], and I would be delivered forever from my judge.
translation:
  language: de
  text: Dort könnte ein Aufrichtiger mit ihm seinen Rechtsstreit führen[a], und ich würde meinem Richter für immer entkommen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit ihm rechten“ oder „ihm seinen Fall darlegen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und ich würde für immer von dem befreit, der mich richtet“.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Dort
  rationale: Das Ortsadverb verweist auf den im Zusammenhang vorgestellten Ort der Begegnung mit Gott; „Dort“ ist natürlich und präzise.
- source_word: יָשָׁר
  choice: ein Aufrichtiger
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet einen Menschen von moralischer Geradheit und bewahrt den ethischen Anspruch Hiobs.
- source_word: נוֹכָח
  choice: könnte … seinen Rechtsstreit führen
  rationale: Der Ausdruck hat hier im gerichtlichen Kontext einen forensischen Sinn. Die Formulierung gibt das argumentative Auftreten gegenüber Gott wieder, ohne schon einen bestimmten Ausgang vorauszusetzen.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: Die Präposition bedeutet unmittelbar „mit ihm“. Das Pronomen bleibt erhalten, statt den im Kontext naheliegenden Bezug auf Gott ausdrücklich einzusetzen.
- source_word: וַאֲפַלְּטָה
  choice: und ich würde … entkommen
  rationale: פלט bezeichnet Entrinnen oder Entkommen. Die aktive deutsche Form ist idiomatisch und wahrt die Möglichkeit einer Befreiung, ohne den technisch engeren Begriff „freigesprochen“ einzutragen.
- source_word: לָנֶצַח
  choice: für immer
  rationale: Die Wendung bezeichnet eine dauerhafte oder endgültige Folge; „für immer“ erhält ihre starke zeitliche Aussage.
- source_word: מִשֹּׁפְטִי
  choice: meinem Richter
  rationale: Die Form kann „mein Richter“ oder „der mich richtet“ bedeuten. „Meinem Richter“ hält das Gerichtsbild knapp aufrecht und legt die Rolle nicht als die eines Anklägers aus.
theological_decisions:
- issue: Bezug und rechtliche Bedeutung von מִשֹּׁפְטִי
  choice: „meinem Richter“ ohne ausdrückliche Festlegung, ob damit Gott als Richter oder allgemeiner derjenige gemeint ist, der Hiob richtet
  alternative: „dem, der mich richtet“; „meinem Ankläger“
  rationale: Der hebräische Wortlaut trägt die Gerichtssprache, bestimmt die Rolle aber nicht als Ankläger. Die gewählte Form bewahrt diese Spannung und vermeidet eine konfessionelle oder dogmatische Auflösung.
- issue: Art der Auseinandersetzung in נוֹכָח
  choice: „seinen Rechtsstreit führen“
  alternative: „mit ihm rechten“; „ihm seinen Fall darlegen“; „mit ihm argumentieren“
  rationale: Der Kontext ist forensisch. Die Übersetzung macht den Rechtscharakter deutlich, ohne Hiobs Rede zu einem bloß intellektuellen Gespräch oder zu einer unangemessen aggressiven Auseinandersetzung zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klar erkennbarer Gerichtssprache. „Rechtsstreit führen“ ist heutigen Lesern verständlicher als das gehobene „rechten“; die Alternative wird in der Fußnote bewahrt. Sämtliche Fußnotenmarker stehen im Haupttext.
