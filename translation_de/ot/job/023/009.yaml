id: JOB.23.9
reference: Job 23:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שְׂמֹ֣אול בַּ/עֲשֹׂת֣/וֹ וְ/לֹא אָ֑חַז יַעְטֹ֥ף יָ֝מִ֗ין וְ/לֹ֣א אֶרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/009.yaml
  text: On the left[a], when he is at work, I do not perceive him; he turns to the right[b], and I do not see him.
translation:
  language: de
  text: Zur Linken[a], wenn er wirkt, erfasse ich ihn nicht; verhüllt er sich zur Rechten[b], sehe ich ihn nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Links« und »rechts« können im Hebräischen auch »Norden« und »Süden« bezeichnen.
    reason: cultural_note
  - marker: b
    text: 'Oder: »wendet er sich zur Rechten«. Das hebräische Verb kann hier das Einhüllen oder Verbergen ausdrücken; die genaue Bildvorstellung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאול
  choice: zur Linken
  rationale: Das Wort bezeichnet zunächst die linke Seite und kann davon abgeleitet den Norden meinen. Zusammen mit יָמִין wird der poetische Gegensatz »links – rechts« bewahrt.
- source_word: בַּעֲשֹׂתוֹ
  choice: wenn er wirkt
  rationale: Die Präposition ב mit dem Infinitiv von עשה und dem Suffix der 3. Person Singular wird temporal verstanden. »Wirken« bezeichnet Gottes Tätigkeit natürlich und würdevoll, ohne sie näher festzulegen.
- source_word: אָחַז
  choice: erfasse ich ihn nicht
  rationale: אחז bedeutet grundsätzlich »ergreifen, festhalten«. »Erfassen« erhält sowohl die konkrete Vorstellung des Ergreifens als auch den kontextuellen Sinn des Wahrnehmens oder Begreifens.
- source_word: יַעְטֹף
  choice: verhüllt er sich
  rationale: עטף bezeichnet gewöhnlich ein Einhüllen oder Verhüllen. Die Wiedergabe folgt diesem lexikalischen Kern und lässt offen, ob zugleich ein Sichwenden zur rechten Seite gemeint ist.
- source_word: יָמִין
  choice: zur Rechten
  rationale: Das Wort bedeutet zunächst »rechte Seite« und kann davon abgeleitet den Süden bezeichnen. Die körperbezogene Raumangabe erhält den Parallelismus mit »zur Linken«.
- source_word: אֶרְאֶה
  choice: sehe ich ihn nicht
  rationale: ראה bedeutet unmittelbar »sehen«. Das im Deutschen erforderliche Objekt »ihn« ergibt sich aus dem Zusammenhang.
theological_decisions:
- issue: Bezug der Verben und Pronomen der dritten Person
  choice: Sie beziehen sich auf Gott, den Hiob im unmittelbaren Zusammenhang sucht.
  alternative: Ein nicht näher bestimmter männlicher Bezugsträger
  rationale: Gott wird in diesem einzelnen Vers nicht ausdrücklich genannt, doch Hiob 23,8–10 macht ihn eindeutig zum Gesuchten. Die Übersetzung nennt den Namen nicht zusätzlich, sondern wahrt die pronominale Ausdrucksweise.
- issue: Art der Verborgenheit Gottes
  choice: Das Verhüllen wird als Aussage von Hiobs begrenzter Wahrnehmung wiedergegeben, ohne einen Grund dafür zu nennen.
  alternative: Das Verb lediglich als räumliches Sichwenden verstehen
  rationale: Der hebräische Ausdruck erlaubt eine bildhafte Aussage des Verhüllens. Die Übersetzung vermeidet es, daraus eine weitergehende Lehre über Gottes Absicht oder Abwesenheit abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zur Linken … zur Rechten« erhält den knappen poetischen Raumkontrast; »erfassen« bewahrt bewusst die Spannung zwischen körperlichem Ergreifen und geistigem Wahrnehmen.
