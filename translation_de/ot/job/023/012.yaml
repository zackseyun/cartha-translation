source:
  edition: WLC
  text: מִצְוַ֣ת שְׂ֭פָתָי/ו וְ/לֹ֣א אָמִ֑ישׁ מֵ֝/חֻקִּ֗/י צָפַ֥נְתִּי אִמְרֵי פִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/012.yaml
  text: I have not turned aside from the command of his lips[a]; I have treasured the words of his mouth more than my allotted portion.
translation:
  language: de
  text: Vom Gebot seiner Lippen bin ich nicht abgewichen; die Worte seines Mundes habe ich mehr geschätzt als den mir zugemessenen Anteil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach traditioneller Deutung der schwierigen hebräischen Wendung: „Die Worte seines Mundes habe ich mehr geschätzt als meine notwendige Nahrung.“'
    reason: alternative_reading
lexical_decisions:
- source_word: מִצְוַת
  choice: Gebot
  rationale: Der Singular im Status constructus wird knapp und natürlich wiedergegeben; „Gebot“ bewahrt den verpflichtenden Sinn.
- source_word: שְׂפָתָיו
  choice: seiner Lippen
  rationale: Die konkrete poetische Bildsprache und die Parallele zu „seines Mundes“ bleiben erhalten. Das Suffix der 3. Person Singular bezieht sich im Kontext auf Gott.
- source_word: לֹא אָמִישׁ
  choice: bin ich nicht abgewichen
  rationale: Die Hifil-Form von מוש bezeichnet hier das Nichtweichen beziehungsweise Nichtabgehen von einem Gebot. Das Perfekt passt zu Ijobs rückblickender Beteuerung.
- source_word: מֵחֻקִּי
  choice: mehr als den mir zugemessenen Anteil
  rationale: Die schwierige Form wird komparativ verstanden und als Ijobs ihm zugemessener Anteil wiedergegeben. Diese Fassung bleibt nahe am überlieferten Text, ohne „Nahrung“ ausdrücklich in den Haupttext einzutragen.
- source_word: צָפַנְתִּי
  choice: habe ich mehr geschätzt
  rationale: Das Verb bedeutet wörtlich „bergen, aufbewahren“ und kann im Weisheitskontext das innere Bewahren als etwas Kostbares ausdrücken. „Geschätzt“ ergibt zusammen mit dem Vergleich eine natürliche deutsche Aussage.
- source_word: אִמְרֵי
  choice: die Worte
  rationale: Eine klare, natürliche Wiedergabe des pluralischen Constructus.
- source_word: פִיו
  choice: seines Mundes
  rationale: Die wörtliche Form wahrt die poetische Parallele zu „seiner Lippen“.
theological_decisions:
- issue: Bezug der Suffixe in „seiner Lippen“ und „seines Mundes“
  choice: Die Suffixe beziehen sich auf Gott.
  alternative: Bezug auf einen nicht näher bezeichneten Sprecher
  rationale: Ijob spricht im Zusammenhang von seiner Treue vor Gott; daher ist Gott der naheliegende Bezug, ohne dass sein Name ergänzend in den Text eingesetzt werden muss.
- issue: Deutung von מֵחֻקִּי
  choice: 'Komparativ: „mehr als den mir zugemessenen Anteil“'
  alternative: „von meiner Satzung“ beziehungsweise nach traditioneller Deutung „mehr als meine notwendige Nahrung“
  rationale: Die hebräische Wendung ist schwierig. Die Hauptfassung wahrt die Form mit dem Suffix der 1. Person Singular und ergibt im Kontext einen sinnvollen Vergleich. Die bekannte Deutung als notwendige Nahrung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Parallelität. Die schwierige Vergleichsformel wird verständlich wiedergegeben, während die traditionelle Deutung in der Fußnote erhalten bleibt.
