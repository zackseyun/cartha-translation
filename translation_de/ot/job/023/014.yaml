base_translation:
  language: en
  yaml_path: translation/ot/job/023/014.yaml
  text: For he will complete what is appointed for me[a], and many such things are with him.
translation:
  language: de
  text: Denn er wird vollenden, was mir bestimmt ist[a], und viele solche Dinge sind bei ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Festsetzung“, „mein festgesetztes Los“ oder „was für mich beschlossen ist“. Das hebräische Wort kann etwas bezeichnen, das für Hiob vorgeschrieben oder festgelegt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet bzw. erläutert die vorherige Aussage; „Denn“ bewahrt diesen Zusammenhang im Deutschen.
- source_word: יַשְׁלִים
  choice: wird vollenden
  rationale: Die Hifil-Form von שׁלם bezeichnet hier das Zu-Ende-Bringen oder vollständige Ausführen; „wird vollenden“ wahrt diese Bedeutung und den Zukunftsbezug.
- source_word: חֻקִּי
  choice: was mir bestimmt ist
  rationale: חֹק kann eine Satzung, Festsetzung oder einen zugewiesenen Anteil bezeichnen. Im Kontext geht es um das von Gott für Hiob Festgelegte; die Formulierung ist verständlich, ohne die lexikalische Spannweite unnötig zu verengen.
- source_word: וְכָהֵנָּה רַבּוֹת
  choice: und vieles dergleichen
  rationale: Die Wendung verweist auf viele vergleichbare Dinge oder Vorhaben. „Vieles dergleichen“ gibt dies idiomatisch und knapp wieder.
- source_word: עִמּוֹ
  choice: ist bei ihm
  rationale: Die räumlich-besitzanzeigende Wendung bleibt bewusst offen und kann Gottes Ratschluss, Verfügungsgewalt oder Vorrat an ähnlichen Vorhaben einschließen.
theological_decisions:
- issue: Ob חֻקִּי juristisch als „meine Satzung/mein Beschluss“ oder als Hiobs von Gott bestimmtes Geschick zu verstehen ist
  choice: was mir bestimmt ist
  alternative: meine Satzung; mein festgesetztes Los; was für mich beschlossen ist
  rationale: Der Zusammenhang handelt von Gottes unabänderlichem Handeln an Hiob, nicht von einer von Hiob erlassenen Vorschrift. Die gewählte Fassung bringt die göttliche Festsetzung zum Ausdruck, ohne deren genaue Art festzulegen.
- issue: Wie עִמּוֹ theologisch zu konkretisieren ist
  choice: bei ihm
  alternative: in seinem Ratschluss; in seiner Hand; in seiner Macht
  rationale: Der hebräische Ausdruck benennt nicht ausdrücklich Ratschluss, Besitz oder Macht. Die wörtlich-nahe Fassung bewahrt diese Offenheit und die Spannung, dass Gott noch viele vergleichbare Dinge bei sich hat.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der knappen hebräischen Aussage; „vieles dergleichen“ ist idiomatisch, während „bei ihm“ die Mehrdeutigkeit des Ausgangstextes bewahrt.
