lexical_decisions:
- source_word: כִּי
  choice: Doch
  rationale: Im Zusammenhang steht Gottes Wissen im Gegensatz dazu, dass Hiob ihn nicht finden kann. „Doch“ gibt diese adversative Wendung natürlich wieder, ohne die auch mögliche begründende Bedeutung zu verschweigen.
- source_word: יָדַע
  choice: er kennt
  rationale: Das Verb bezeichnet hier Gottes gegenwärtige und umfassende Kenntnis; das deutsche Präsens entspricht dem Zusammenhang.
- source_word: דֶּרֶךְ עִמָּדִי
  choice: den Weg, der bei mir ist
  rationale: Diese bewusst etwas ungewohnte Formulierung bleibt nahe am hebräischen „Weg bei/mit mir“ und bewahrt dessen Mehrdeutigkeit. Die geläufigere Deutung „meinen Weg“ wird in der Fußnote genannt.
- source_word: בְּחָנַנִי
  choice: wenn er mich geprüft hat
  rationale: בחן bedeutet prüfen oder erproben und passt zur anschließenden Goldmetapher. Die Konstruktion lässt mehrere zeitliche beziehungsweise konditionale Nuancen zu.
- source_word: כַּזָּהָב
  choice: wie Gold
  rationale: Die Vergleichspartikel wird idiomatisch mit „wie“ wiedergegeben; das Bild kann Bewährung, Läuterung oder erwiesene Echtheit andeuten.
- source_word: אֵצֵא
  choice: werde ich ... hervorgehen
  rationale: „Hervorgehen“ gibt יצא im Bild einer Prüfung beziehungsweise Läuterung würdig und verständlich wieder, ohne den Ausgang genauer festzulegen.
theological_decisions:
- issue: Verhältnis von Gottes Prüfung zu Hiobs Rechtfertigung beziehungsweise Läuterung
  choice: Das Bild der Prüfung und des Hervorgehens wie Gold bleibt offen.
  alternative: Den Satz ausschließlich als moralische Läuterung oder ausschließlich als gerichtliche Bestätigung von Hiobs Unschuld verstehen.
  rationale: Der hebräische Text kann sowohl Bewährung und bestätigte Echtheit als auch Läuterung anklingen lassen. Die Übersetzung legt sich nicht auf eine weitergehende Lehrdeutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche hebräische Wendung עִמָּדִי wird im Haupttext möglichst transparent bewahrt und durch eine Fußnote erschlossen; die Goldmetapher bleibt theologisch offen.
