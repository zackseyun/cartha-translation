review_pass:
  verdict: revise
  source_fidelity: 'Die Kernaussage wird getroffen: Gottes Kenntnis von Hiobs Weg, die Prüfung und das Hervorgehen wie Gold. Die Wiedergabe „der Weg, der bei mir ist“ stellt jedoch keine tragfähige deutsche Entsprechung zu דֶּרֶךְ עִמָּדִי dar und klingt, als sei der Weg räumlich bei Hiob vorhanden. Im Deutschen ist „meinen Weg“ die sachgerechte idiomatische Wiedergabe; die ungewöhnliche hebräische Präpositionalfügung kann in der Fußnote dokumentiert werden. „Doch“ ist im Kontext als adversative Einleitung vertretbar. „Wenn er mich geprüft hat“ bewahrt eine mögliche zeitliche Lesart, ohne die Bildsprache theologisch einzuengen.'
  naturalness: „Er kennt meinen Weg“ ist modernes, klares Standarddeutsch. „Werde ich wie Gold hervorgehen“ ist würdig und verständlich, wenn auch leicht gehoben; es passt zum poetischen Register Hiobs. Die bisherige Relativkonstruktion „der Weg, der bei mir ist“ ist dagegen unidiomatisch und semantisch irreführend.
  terminology: „prüfen“ und „wie Gold“ geben בחן und כַּזָּהָב treffend wieder. „hervorgehen“ hält den offenen Charakter von אֵצֵא und vermeidet eine Festlegung auf Läuterung statt Bewährung oder umgekehrt. Die Fußnoten sollen sowohl die mögliche begründende Nuance von כִּי als auch die wörtlich ungewöhnliche Form von עִמָּדִי und die zeitlich-konditionale Offenheit von בְּחָנַנִי ausweisen.
