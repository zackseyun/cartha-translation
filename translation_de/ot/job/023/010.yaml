  text: Doch er kennt meinen Weg[a]; wenn er mich geprüft hat[b], werde ich wie Gold hervorgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn er kennt meinen Weg.“ Wörtlich lautet die ungewöhnliche hebräische Wendung: „Er kennt den Weg bei/mit mir.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „falls er mich prüft“ beziehungsweise „nachdem er mich geprüft hat“. Die hebräische Formulierung lässt mehrere zeitliche oder bedingende Nuancen zu.'
