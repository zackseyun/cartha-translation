id: JOB.23.6
reference: Job 23:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/בְּ/רָב כֹּ֭חַ יָרִ֣יב עִמָּדִ֑/י לֹ֥א אַךְ ה֝֗וּא יָשִׂ֥ם בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/006.yaml
  text: Would he contend with me in the greatness of his power? No[a]; surely he would pay attention to me.
translation:
  language: de
  text: Würde er mit seiner gewaltigen Kraft gegen mich streiten? Nein; vielmehr würde er auf mich achten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Herz auf mich richten“; möglicherweise auch: „mir Kraft verleihen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְּ/רָב כֹּחַ
  choice: mit seiner gewaltigen Kraft
  rationale: Die Formulierung gibt רָב כֹּחַ als große beziehungsweise überwältigende Kraft wieder und verbindet sie natürlich mit der durch הֲ eingeleiteten Frage.
- source_word: יָרִיב עִמָּדִי
  choice: würde er … gegen mich streiten
  rationale: ריב hat in diesem Zusammenhang einen rechtlichen Beiklang. „Gegen mich streiten“ bewahrt den Gedanken einer Auseinandersetzung, ohne unnötig juristisch-technisch zu klingen.
- source_word: לֹא אַךְ
  choice: Nein; vielmehr
  rationale: Die Wiedergabe markiert zuerst die entschiedene Verneinung und danach die nachdrückliche Wendung zu dem, was Gott stattdessen tun würde.
- source_word: יָשִׂם בִּי
  choice: würde er auf mich achten
  rationale: שׂים mit ב kann bedeuten, die Aufmerksamkeit auf jemanden zu richten. Im gerichtlichen Kontext erwartet Hiob, dass Gott ihm Gehör schenkt; zugleich bleibt die mögliche Deutung als Stärkung in der Fußnote erhalten.
theological_decisions:
- issue: Sinn von Gottes Handeln im zweiten Halbvers
  choice: Hiob ist zuversichtlich, dass Gott ihn nicht mit bloßer Übermacht niederstreiten, sondern auf ihn achten und ihm damit Gehör schenken würde.
  alternative: Gott würde Hiob Kraft verleihen; oder Gott würde seine Aufmerksamkeit in einem allgemeineren Sinn auf Hiob richten.
  rationale: Der unmittelbare Zusammenhang ist eine erhoffte gerichtliche Begegnung, in der Hiob seinen Fall vor Gott darlegen will (23,3–7). Daher passt „auf mich achten“ gut, ohne die echte lexikalische Mehrdeutigkeit von יָשִׂם בִּי zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der rechtliche Beiklang bleiben erhalten; die Mehrdeutigkeit des zweiten Halbverses wird durch die Fußnote offengelegt.
