  yaml_path: translation/ot/job/023/005.yaml
  text: I would know the words with which he would answer me, and understand what he would say to me.
translation:
  language: de
  text: Ich wüsste, mit welchen Worten er mir antworten würde, und verstünde, was er mir sagen würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵדְעָה
  choice: Ich würde … erfahren
  rationale: Die Kohortativform von ידע drückt im hypothetischen Zusammenhang Hiobs erhofftes Ergebnis aus. „Ich würde … erfahren“ gibt diese bedingte, auf eine mögliche Begegnung mit Gott bezogene Bedeutung natürlich wieder.
- source_word: מִלִּים
  choice: die Worte
  rationale: מִלִּים bezeichnet schlicht „Worte“. Der bestimmte Artikel ist im Deutschen wegen des folgenden Relativsatzes idiomatisch; „Argumente“ würde den forensischen Kontext stärker auslegen, als der Wortlaut verlangt.
- source_word: יַעֲנֵנִי
  choice: mit denen er mir antworten würde
  rationale: ענה bedeutet hier „antworten“. Die Konstruktion mit „mit denen“ verdeutlicht natürlich, dass die genannten Worte den Inhalt beziehungsweise die Form seiner Antwort bilden; der Konjunktiv II bewahrt den hypothetischen Zusammenhang.
- source_word: וְאָבִינָה
  choice: und verstehen
  rationale: בין bezeichnet hier das Verstehen beziehungsweise Erfassen. Der koordinierte Infinitiv „verstehen“ hängt im Deutschen natürlich von „Ich würde“ ab und entspricht der Parallelität zum ersten Satzglied.
- source_word: מַה
  choice: was
  rationale: Das Fragepronomen leitet den Inhalt dessen ein, was Gott zu Hiob sagen würde.
- source_word: יֹאמַר לִי
  choice: er mir sagen würde
  rationale: אמר ist das gewöhnliche Verb für „sagen“. „Mir sagen“ bewahrt die direkte Formulierung ohne zusätzliche Deutung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der doppelte Konjunktiv II erhält den hypothetischen und sehnsuchtsvollen Charakter des Verses; die parallelen Verben „erfahren“ und „verstehen“ bleiben klar unterschieden.
