source:
  edition: WLC
  text: וְ֭/אֵל הֵרַ֣ךְ לִבִּ֑/י וְ֝/שַׁדַּ֗י הִבְהִילָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/016.yaml
  text: But God has made my heart faint[a], and the Almighty has terrified me.
translation:
  language: de
  text: Doch Gott hat mir den Mut genommen[a], und der Allmächtige hat mich in Schrecken versetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Gott hat mein Herz weich gemacht.« Gemeint ist wahrscheinlich, dass Hiobs Mut und innere Kraft geschwunden sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵל
  choice: Doch Gott
  rationale: אֵל bezeichnet hier Gott. Das Präfix וְ kann schlicht »und« heißen; im Zusammenhang klingt im Deutschen jedoch »doch« natürlich und gibt den spannungsvollen Gedankenfortgang wieder.
- source_word: הֵרַךְ
  choice: hat … den Mut genommen
  rationale: Das Verb bedeutet wörtlich »weich/zart machen«. In Verbindung mit dem Herzen bezeichnet es hier wahrscheinlich das Schwinden von innerer Kraft und Mut. Die idiomatische Wiedergabe vermeidet die im Deutschen missverständliche Vorstellung, Gott habe Hiobs Herz mitfühlend gemacht.
- source_word: לִבִּי
  choice: mir den Mut
  rationale: לֵב bezeichnet das Herz als Sitz des inneren Menschen und hier besonders des Mutes. Die deutsche Wendung »jemandem den Mut nehmen« gibt den Sinn des Gesamtbildes natürlich wieder; die wörtlichere Form bleibt in der Fußnote erhalten.
- source_word: וְשַׁדַּי
  choice: und der Allmächtige
  rationale: שַׁדַּי ist hier ein Gottestitel. »Der Allmächtige« ist die etablierte, verständliche deutsche Wiedergabe.
- source_word: הִבְהִילָנִי
  choice: hat mich in Schrecken versetzt
  rationale: Der Hifil-Stamm von בהל bezeichnet das Versetzen in Bestürzung, Angst oder Schrecken. Diese Formulierung bewahrt die starke Aussage und klingt würdevoll und natürlich.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnungen אֵל und שַׁדַּי
  choice: Gott … der Allmächtige
  alternative: Gott … Schaddai
  rationale: Die parallelen Gottesbezeichnungen werden ihrem Bedeutungsgehalt entsprechend übersetzt. שַׁדַּי wird als Titel verstanden; die Übersetzung legt keine weitergehende konfessionelle Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptzeile gibt das hebräische Bild idiomatisch wieder; die Fußnote bewahrt die wörtliche Form und die darin liegende Bedeutungsbreite.
