  text: בַּ֭/אֲשֻׁר/וֹ אָחֲזָ֣ה רַגְלִ֑/י דַּרְכּ֖/וֹ שָׁמַ֣רְתִּי וְ/לֹא אָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/011.yaml
  text: My foot has held fast to his steps[a]; I have kept his way and have not turned aside.
translation:
  language: de
  text: Mein Fuß hielt sich fest an seiner Spur[a]; seinen Weg hielt ich ein und wich nicht davon ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an seinem Schritt“. Das hebräische Bild beschreibt, wie Hiobs Fuß sich eng an Gottes Fußtritt hält.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֻׁרוֹ
  choice: an seine Spur
  rationale: אֲשׁוּר bezeichnet einen Schritt bzw. Fußtritt. Im Deutschen bewahrt „Spur“ zusammen mit dem Verb des Festhaltens das konkrete Bild, dass Hiob Gottes Fußspur eng folgt.
- source_word: אָחֲזָה
  choice: hielt sich fest
  rationale: אחז bedeutet „ergreifen, festhalten“. Mit „mein Fuß“ als Subjekt drückt die reflexive Form im Deutschen natürliche und beharrliche Bindung an die Spur aus.
- source_word: רַגְלִי
  choice: Mein Fuß
  rationale: Der hebräische Singular bleibt erhalten und bewahrt das anschauliche Bild des Fußes in der Spur.
- source_word: דַּרְכּוֹ
  choice: seinen Weg
  rationale: דֶּרֶךְ bedeutet „Weg, Pfad“ und kann zugleich die Lebensführung bezeichnen. „Weg“ erhält diese konkrete wie ethische Bedeutungsweite.
- source_word: שָׁמַרְתִּי
  choice: habe ich eingehalten
  rationale: שׁמר umfasst „bewahren, beachten, einhalten“. Bei „Weg“ vermittelt „einhalten“ treue Befolgung und führt zugleich die Wegmetapher natürlich fort.
- source_word: וְלֹא אָט
  choice: und bin nicht davon abgewichen
  rationale: Die Form אָט wird im Kontext als Abweichen bzw. Sich-Abwenden vom Weg verstanden. „Davon abgewichen“ ist idiomatisch und macht den Bezug auf Gottes Weg deutlich, ohne das Bild aufzugeben.
theological_decisions:
- issue: Bezugswort der Suffixe der 3. Person Singular („seine Spur“, „seinen Weg“)
  choice: Die Suffixe beziehen sich auf Gott.
  alternative: Bezug auf einen nicht näher bestimmten gerechten Weg oder eine andere männliche Bezugsperson.
  rationale: Im unmittelbaren Zusammenhang spricht Hiob von Gott und von seiner eigenen Lauterkeit vor ihm (Ijob 23,10–12). Die Pronomen bleiben im Vers stehen, sodass der kontextuelle Gottesbezug gewahrt wird, ohne den Gottesnamen ergänzend einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der hebräische Singular „mein Fuß“ und die Weg- bzw. Fußspurbildlichkeit bleiben erhalten. Die Satzstellung betont im zweiten Halbvers „seinen Weg“ und spiegelt so die poetische Parallelität.
