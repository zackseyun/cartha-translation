base_translation:
  language: en
  yaml_path: translation/ot/job/023/008.yaml
  text: Look[a], I go east, but he is not there; and west, but I do not perceive him.
translation:
  language: de
  text: Siehe, ich gehe nach Osten[a], doch er ist nicht da; nach Westen gehe ich, doch ich nehme ihn nicht wahr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach vorn … nach hinten«. Die hebräischen Richtungsbezeichnungen können sowohl geographisch als Osten und Westen als auch orientierend als vorn und hinten verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel leitet Hiobs Aussage nachdrücklich ein. »Siehe« ist im Deutschen würdevoll und verständlich, ohne die Aussage zu einer Gewissheitsbehauptung wie »gewiss« umzudeuten.
- source_word: קֶדֶם
  choice: nach Osten
  rationale: Im poetischen Gegensatz zu אָחוֹר bezeichnet das Wort hier am ehesten eine Suchrichtung. »Nach Osten« macht die räumliche Gegenüberstellung deutlich; die ebenfalls mögliche Orientierung »nach vorn« bleibt in der Fußnote erhalten.
- source_word: אֶהֱלֹךְ
  choice: gehe ich
  rationale: Die Qal-Form von הלך bezeichnet Hiobs Bewegung bei der Suche. »Gehe ich« gibt dies schlicht und natürlich wieder, ohne die Art der Bewegung näher festzulegen.
- source_word: וְאֵינֶנּוּ
  choice: ist er nicht da
  rationale: Das maskuline Suffix bezieht sich im Zusammenhang auf Gott. Das ergänzte »da« entspricht natürlichem Deutsch bei einer räumlichen Suche und macht keine weitergehende Aussage über Gottes Existenz.
- source_word: אָחוֹר
  choice: nach Westen
  rationale: Als Gegenstück zu קֶדֶם ist die entgegengesetzte Himmelsrichtung im Kontext naheliegend. Die wörtlich-orientierende Alternative »nach hinten« wird in der Fußnote bewahrt.
- source_word: לֹא אָבִין לוֹ
  choice: nehme ich ihn nicht wahr
  rationale: בין kann »verstehen«, »unterscheiden« oder »wahrnehmen« bedeuten. Im Zusammenhang der vergeblichen Suche bezeichnet die Form am ehesten das fehlende Erkennen beziehungsweise Wahrnehmen Gottes.
theological_decisions:
- issue: Bezug der maskulinen Pronomen
  choice: Die Pronomen werden mit »er« und »ihn« wiedergegeben und auf Gott bezogen.
  alternative: Ein nicht ausdrücklich bestimmter männlicher Bezug könnte formal unausgesprochen bleiben.
  rationale: Der unmittelbare Zusammenhang handelt von Hiobs Suche nach Gott. Die deutsche Wiedergabe macht diesen grammatisch und kontextuell naheliegenden Bezug sichtbar, ohne zusätzliche theologische Deutung einzutragen.
- issue: Bedeutung von »ist er nicht da«
  choice: Die Wendung beschreibt Hiobs erfolglose Suche in der genannten Richtung.
  alternative: Sie könnte als uneingeschränkte Aussage über Gottes Abwesenheit missverstanden werden.
  rationale: Die räumliche Satzstruktur bindet die Aussage an Hiobs Wahrnehmung und Suche. Die Übersetzung vermeidet deshalb eine erklärende Auflösung, bewahrt aber die Spannung von Gottes Verborgenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die wiederholte Formulierung »gehe ich« verdeutlicht den im zweiten Halbvers ausgelassenen, aber sinngemäß fortgeltenden Bewegungsvorgang. Das Semikolon bildet den hebräischen Parallelismus ab.
