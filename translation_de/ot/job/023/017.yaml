  text: כִּֽי לֹ֣א נִ֭צְמַתִּי מִ/פְּנֵי חֹ֑שֶׁךְ וּ֝/מִ/פָּנַ֗/י כִּסָּה אֹֽפֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/017.yaml
  text: For I was not silenced because of the darkness[a], nor because deep gloom covered my face.
translation:
  language: de
  text: Denn ich wurde nicht wegen der Finsternis zum Schweigen gebracht[a], auch nicht wegen des tiefen Dunkels, das mein Gesicht bedeckte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn ich wurde nicht wegen der Finsternis abgeschnitten, auch nicht wegen des dichten Dunkels, das mein Gesicht bedeckte.« Der hebräische Wortlaut dieses Verses ist schwierig. Das mit »zum Schweigen gebracht« übersetzte Verb kann auch »abgeschnitten« oder »vernichtet« bedeuten. Auch im zweiten Satzteil ist umstritten, ob das tiefe Dunkel Hiobs Gesicht bedeckte oder ob sich die Aussage auf das bezieht, was vor ihm lag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet hier eine Begründung oder Erläuterung zum vorausgehenden Gedanken ein; »Denn« gibt diesen Zusammenhang natürlich wieder.
- source_word: נִצְמַתִּי
  choice: ich wurde nicht … zum Schweigen gebracht
  rationale: Der Nifal von צמת kann »zum Schweigen gebracht«, »abgeschnitten« oder »vernichtet« bedeuten. Im Zusammenhang mit Hiobs fortgesetzter Klage gibt die gewählte passive Form eine naheliegende Bedeutung wieder, ohne die schwierige Stelle in der Fußnote zu verschweigen.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: wegen der Finsternis
  rationale: מִפְּנֵי wird hier kausal verstanden. »Finsternis« wahrt den poetisch-ernsten Ton und unterscheidet חֹשֶׁךְ vom stärkeren אֹפֶל im zweiten Satzteil.
- source_word: וּמִפָּנַי
  choice: mein Gesicht
  rationale: Der Suffix der ersten Person Singular an פָּנִים erlaubt die konkrete Wiedergabe »mein Gesicht«. Die ebenfalls mögliche adverbiale Auffassung »vor mir« wird in der Fußnote genannt.
- source_word: כִּסָּה
  choice: bedeckte
  rationale: Das Verb bezeichnet gewöhnlich ein Bedecken oder Verhüllen. Das Präteritum entspricht dem hebräischen Perfekt im vorliegenden Rückblick.
- source_word: אֹפֶל
  choice: tiefes Dunkel
  rationale: אֹפֶל bezeichnet eine besonders dichte, tiefe Dunkelheit. »Tiefes Dunkel« erhält zugleich den lexikalischen Unterschied zu חֹשֶׁךְ (»Finsternis«).
theological_decisions:
- issue: Bedeutung von Hiobs Nicht-Verstummen
  choice: Die Aussage wird als Fortdauer seiner Stimme trotz der Finsternis wiedergegeben.
  alternative: Das Verb kann bedeuten, dass Hiob nicht abgeschnitten oder vernichtet wurde.
  rationale: Der unmittelbare Zusammenhang handelt von Hiobs Angst, Klage und Gottes verborgener Gegenwart. Da der hebräische Ausdruck jedoch mehrdeutig ist, wird die Alternative ausdrücklich offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Klang. Die Parallelität der beiden kausalen Satzteile bleibt erhalten; die genuine syntaktische und lexikalische Mehrdeutigkeit wird in der Fußnote dokumentiert.
