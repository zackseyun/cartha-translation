base_translation:
  language: en
  yaml_path: translation/ot/job/023/013.yaml
  text: But he is one[a], and who can turn him back? What his soul desires[b], that he does.
translation:
  language: de
  text: Doch er ist entschlossen[a] – wer kann ihn umstimmen? Wonach seine Seele verlangt[b], das tut er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Doch er ist in/mit einem“. Die ungewöhnliche hebräische Wendung meint wahrscheinlich, dass er bei einem Entschluss bleibt bzw. in seinem Vorhaben nicht umzustimmen ist.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Was er selbst begehrt“. „Seine Seele“ bezeichnet im Hebräischen hier sein eigenes Verlangen oder seinen Willen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Doch er
  rationale: Die Konjunktion eröffnet im Zusammenhang einen Gegensatz; „Doch“ gibt diese adversative Funktion natürlich wieder, während das ausdrückliche Pronomen erhalten bleibt.
- source_word: בְאֶחָד
  choice: ist einer
  rationale: Die bewusst nahe Wiedergabe bewahrt die ungewöhnliche und mehrdeutige hebräische Formulierung, statt sie im Haupttext eindeutig als Unveränderlichkeit oder feste Entschlossenheit auszulegen.
- source_word: וּמִי יְשִׁיבֶנּוּ
  choice: wer kann ihn umstimmen?
  rationale: Der Hifil von שׁוב bezeichnet hier, jemanden zur Umkehr oder Änderung seines Vorhabens zu bewegen. „Umstimmen“ vermittelt dies im Deutschen natürlich, ohne eine räumliche Rückkehr nahezulegen.
- source_word: וְנַפְשׁוֹ אִוְּתָה
  choice: Wonach seine Seele verlangt
  rationale: „Seele“ bewahrt die konkrete hebräische Ausdrucksweise von נֶפֶשׁ; „verlangt“ gibt den Wunsch- und Willensaspekt des Verbs wieder.
- source_word: וַיָּעַשׂ
  choice: das tut er
  rationale: Die schlichte Wiedergabe entspricht dem gewöhnlichen Verb עשה und bildet die knappe hebräische Satzstruktur nach, ohne den stärkeren Gedanken „vollbringen“ hinzuzufügen.
theological_decisions:
- issue: Aussage über Gottes einheitlichen oder unabänderlichen Willen
  choice: Doch er ist einer
  alternative: Doch er bleibt bei seinem Entschluss / Doch er ist unveränderlich
  rationale: בְאֶחָד ist wörtlich ungewöhnlich und kann im Zusammenhang die Einheitlichkeit beziehungsweise Unabänderlichkeit von Gottes Vorhaben ausdrücken. Die Hauptübersetzung bewahrt die Form und damit die Spannung; die Fußnote erläutert den wahrscheinlich gemeinten Sinn, ohne eine umfassende metaphysische Aussage in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich verbindet die Aussage über Gottes festes Vorhaben eng mit der rhetorischen Frage. Die ungewöhnliche Wendung „ist einer“ bleibt wegen der echten Mehrdeutigkeit des Hebräischen stehen und wird durch die Fußnote erschlossen.
