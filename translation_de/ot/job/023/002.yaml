source:
  edition: WLC
  text: גַּם הַ֭/יּוֹם מְרִ֣י שִׂחִ֑/י יָ֝דִ֗/י כָּבְדָ֥ה עַל אַנְחָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/002.yaml
  text: Even today my complaint is rebellious[b][a]; my hand is heavy because of my groaning.
translation:
  language: de
  text: Selbst heute ist meine Klage noch aufsässig[a]; meine Hand liegt schwer auf meinem Stöhnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Meine Klage ist bitter.« Das hebräische Wort bezeichnet gewöhnlich Auflehnung oder Trotz, wird hier aber von manchen dem Zusammenhang entsprechend abgeschwächt verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Meine Hand ist schwer auf meinem Stöhnen.« Die Bedeutung des Bildes ist unsicher. Manche verstehen die »Hand« als Ausdruck einer gehemmten oder belasteten Äußerung; andere ändern den Text zu »seine Hand«.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם הַיּוֹם
  choice: Selbst heute … noch
  rationale: Die Verbindung betont, dass Hiobs Zustand bis in die Gegenwart anhält; die deutsche Formulierung gibt diese zeitliche Zuspitzung natürlich wieder.
- source_word: מְרִי
  choice: aufsässig
  rationale: Das Substantiv bezeichnet gewöhnlich Auflehnung oder Trotz. Prädikativ auf die Klage bezogen bewahrt „aufsässig“ die scharfe Aussage, ohne sie kontextuell zu „bitter“ abzuschwächen.
- source_word: שִׂיחִי
  choice: meine Klage
  rationale: Das Wort kann Nachsinnen, Rede oder Klage bezeichnen. Im Zusammenhang mit Hiobs Stöhnen ist „Klage“ am treffendsten.
- source_word: יָדִי
  choice: meine Hand
  rationale: Der masoretische Text hat eindeutig das Suffix der ersten Person Singular. Diese Lesart bleibt im Haupttext erhalten, obwohl eine idiomatische Deutung schwierig ist und manche zu „seine Hand“ ändern.
- source_word: כָּבְדָה עַל
  choice: liegt schwer auf
  rationale: Die Wiedergabe erhält sowohl das Bild der Schwere als auch die räumlich-relationale Offenheit der Präposition עַל, statt vorschnell eine eindeutige Kausalbeziehung festzulegen.
- source_word: אַנְחָתִי
  choice: meinem Stöhnen
  rationale: Das Substantiv bezeichnet klagendes Seufzen oder Stöhnen; „Stöhnen“ entspricht der Intensität des Kontexts.
theological_decisions:
- issue: Ob Hiobs Beschreibung seiner Klage abgeschwächt werden soll, damit sie nicht als Auflehnung erscheint
  choice: Die stärkere Bedeutung „aufsässig“ steht im Haupttext.
  alternative: „bitter“ beziehungsweise „meine Klage ist bitter“
  rationale: Der hebräische Ausdruck lässt die Klage als auflehnend oder trotzig erscheinen. Diese Spannung in Hiobs Rede wird bewahrt und nicht aus theologischen Gründen geglättet.
- issue: Wie die schwierige Aussage über die Hand zu verstehen ist
  choice: Die masoretische Lesart „meine Hand“ und das Bild „liegt schwer auf“ bleiben im Haupttext erhalten.
  alternative: „Seine Hand liegt schwer auf meinem Stöhnen“ oder eine idiomatische Deutung als gehemmte beziehungsweise belastete Äußerung
  rationale: Der überlieferte Konsonantentext und die Vokalisierung sprechen für „meine Hand“. Da die genaue Bildaussage unsicher ist, wird sie nicht stillschweigend durch eine Konjektur oder eine eindeutige Auslegung ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aufsässig“ bewahrt die ungewöhnliche Schärfe des Hebräischen; die zweite Vershälfte bleibt bewusst bildhaft, weil ihre genaue Bedeutung unsicher ist.
