  source_fidelity: Die Übersetzung gibt גַּם הַיּוֹם mit „Selbst heute … noch“ als anhaltende Gegenwartsbetonung wieder. „Meine Klage“ entspricht שִׂיחִי im Klagekontext. „Aufsässig“ bewahrt für מְרִי die starke Bedeutung von Auflehnung bzw. Trotz und glättet sie nicht zu „bitter“. Die schwierige masoretische Lesart יָדִי („meine Hand“) sowie die offene Bildrelation von כָּבְדָה עַל werden ohne unbelegte Emendation beibehalten.
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. Die Formulierung „meine Hand liegt schwer auf meinem Stöhnen“ ist absichtlich ungewohnt, aber als bildnahe Wiedergabe der syntaktisch und semantisch schwierigen hebräischen Aussage vertretbar; die Anmerkung erläutert dies angemessen.
  terminology: „Klage“, „aufsässig“ und „Stöhnen“ sind kontextgerecht. „Aufsässig“ ist hier die markierte, aber sachlich passende Wahl, um die im Hebräischen vorhandene Spannung von Hiobs Rede zu bewahren.
