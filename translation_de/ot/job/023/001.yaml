  rationale: Der Personenname wird gemäß der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: וַיֹּאמַר
  choice: sagte
  rationale: אמר ist das gewöhnliche Verb für „sagen“. „Sagte“ bewahrt zusammen mit „antwortete“ die formelhafte hebräische Wendung.
- source_word: וַ...וַ...
  choice: Da ... und ...
  rationale: Die Folge der Waw-Konsekutivformen führt die Erzählung weiter. „Da“ klingt im modernen Deutschen natürlich und markiert den Anschluss; das zweite Waw wird mit „und“ wiedergegeben.
