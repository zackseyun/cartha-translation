  text: מִֽי יִתֵּ֣ן יָ֭דַעְתִּי וְ/אֶמְצָאֵ֑/הוּ אָ֝ב֗וֹא עַד תְּכוּנָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/003.yaml
  text: Oh[a], that I knew where I might find him, that I might come to his dwelling place.
translation:
  language: de
  text: Wenn ich doch wüsste, wo ich ihn finden kann! Dann könnte ich bis zu seiner Stätte[a] gelangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seinem festen Ort. Das hebräische Wort kann einen festen oder bestimmten Ort bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Wenn ich doch
  rationale: Die feste Wendung drückt einen inständigen Wunsch aus, nicht die wörtliche Frage „Wer wird geben?“. „Wenn ich doch“ gibt diesen Wunsch im heutigen Deutsch natürlich wieder.
- source_word: יָדַעְתִּי וְאֶמְצָאֵהוּ
  choice: wüsste, wie ich ihn finden kann
  rationale: Das formale „ich wüsste und fände ihn“ wäre im Deutschen missverständlich. Der Kontext und die verbundene Wunschform legen das Wissen darum nahe, wie beziehungsweise wo Gott zu finden ist; „wie“ bewahrt dabei mehr Offenheit als die ausdrückliche Ergänzung „wo“.
- source_word: אָבוֹא עַד
  choice: Ich würde bis zu … kommen
  rationale: Der Imperfekt setzt den Wunsch fort. „Bis zu“ bildet die durch עַד bezeichnete Bewegung bis an ein Ziel genauer ab als ein schlichtes „zu“.
- source_word: תְּכוּנָתוֹ
  choice: seiner Stätte
  rationale: Das Substantiv bezeichnet einen festen oder eingerichteten Ort. „Stätte“ ist knapp, würdig und lässt offen, ob Wohnort, Sitz oder festgelegter Ort gemeint ist.
theological_decisions:
- issue: Bezug der maskulinen Singularsuffixe
  choice: Die Pronomen beziehen sich im Kontext auf Gott, ohne ihn im Vers ausdrücklich zu nennen.
  alternative: Gott im Haupttext ausdrücklich nennen.
  rationale: Hiobs Wunsch, seinen Rechtsfall vor Gott zu bringen, bestimmt den Zusammenhang. Die pronominale Ausdrucksweise des Hebräischen wird jedoch bewahrt, damit keine ausdrückliche Benennung hinzugefügt wird.
- issue: Deutung von תְּכוּנָתוֹ
  choice: Die räumliche, aber nicht näher bestimmte Bedeutung „seine Stätte“ bleibt erhalten.
  alternative: „seine Wohnstätte“ oder im gerichtlichen Sinn „sein Sitz“.
  rationale: Der Vers zielt auf den Ort, an dem Gott zu finden ist; ob dieser als Wohnort oder Gerichtssitz vorgestellt wird, lässt der Ausdruck offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wunschform ist idiomatisch wiedergegeben; „Stätte“ erhält die räumliche und theologische Offenheit des seltenen hebräischen Ausdrucks.
