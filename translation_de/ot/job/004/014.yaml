base_translation:
  language: en
  yaml_path: translation/ot/job/004/014.yaml
  text: Fear came upon me[a], and trembling, and it made all my bones shake.
translation:
  language: de
  text: Furcht überkam mich und Zittern, und die Menge meiner Gebeine versetzte mich in Schrecken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und die Menge meiner Gebeine erschreckte mich“; das Hebräische lässt das Objekt des Verbs unausgedrückt. Sinngemäß kann die Wendung auch die heftige körperliche Erschütterung bezeichnen: „ließ meine Gebeine erbeben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחַד
  choice: Angst
  rationale: Das Substantiv bezeichnet Angst oder Furcht; „Angst“ gibt hier das unmittelbar erfahrene Erschrecken natürlich wieder.
- source_word: קְרָאַנִי
  choice: überfielen mich
  rationale: קרא kann hier „begegnen, widerfahren“ bedeuten. Zusammen mit Angst und Zittern vermittelt „überfielen mich“ den plötzlichen Eintritt des Erlebnisses.
- source_word: וּרְעָדָה
  choice: und Zittern
  rationale: Das Substantiv bezeichnet die körperliche Reaktion auf die Angst und steht poetisch neben פַּחַד.
- source_word: וְרֹב עַצְמוֹתַי
  choice: alle meine Gebeine
  rationale: Wörtlich steht „die Menge meiner Gebeine“. Gemeint ist eine umfassende körperliche Reaktion; „alle meine Gebeine“ ist im Deutschen verständlich und bewahrt das konkrete Körperbild.
- source_word: הִפְחִיד
  choice: versetzten … in Schrecken
  rationale: Der Hifil von פחד ist kausativ und bedeutet, jemanden oder etwas in Furcht zu versetzen. Die Formulierung wahrt diese Kausativität, ohne sie bloß als Zittern wiederzugeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. „Gebeine“ bewahrt das konkrete hebräische Bild und passt zum gehobenen Ton der Dichtung; die ungewöhnliche Verbindung mit „in Schrecken versetzen“ erhält die bildhafte und kausative Aussage.
