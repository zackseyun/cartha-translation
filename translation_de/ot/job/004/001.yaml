  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: הַתֵּימָנִי
  choice: der Temaniter
  rationale: Das Gentiliz bezeichnet einen Mann aus Teman. „Temaniter“ bewahrt die knappe appositionelle Kennzeichnung des Hebräischen.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die Wiedergabe erhält die übliche hebräische Formel zur Einleitung direkter Rede und ihre Koordination mit dem vorangehenden Verb.
