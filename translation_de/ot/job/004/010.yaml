base_translation:
  language: en
  yaml_path: translation/ot/job/004/010.yaml
  text: The lion’s roar[a], and the voice of the fierce lion, and the teeth of the young lions are broken.
translation:
  language: de
  text: Das Brüllen des Löwen und die Stimme des mächtigen Löwen – die Zähne der jungen Löwen sind zerbrochen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sind herausgerissen“ oder „sind herausgebrochen“. Das hebräische Verb kann gewaltsames Herauslösen oder Zerbrechen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲגַת
  choice: Brüllen
  rationale: Das Substantiv bezeichnet den brüllenden Ruf eines Löwen. „Brüllen“ ist im Deutschen natürlich und bewahrt das kräftige poetische Bild.
- source_word: אַרְיֵה
  choice: Löwe
  rationale: Das übliche hebräische Wort für „Löwe“ wird direkt wiedergegeben.
- source_word: קוֹל
  choice: Stimme
  rationale: „Stimme“ erhält die Parallelität zu „Brüllen“ und gibt קוֹל hier treffend wieder, ohne beide Ausdrücke gleichzusetzen.
- source_word: שָׁחַל
  choice: mächtiger Löwe
  rationale: Der poetische Ausdruck bezeichnet einen Löwen und hebt wahrscheinlich dessen Kraft oder Gefährlichkeit hervor. „Mächtiger Löwe“ unterscheidet ihn vom zuvor genannten אַרְיֵה, ohne die unsichere Deutung „schwarzer Löwe“ zu übernehmen.
- source_word: שִׁנֵּי
  choice: die Zähne der
  rationale: Die Konstruktform des Plurals wird entsprechend ihrer Verbindung mit „junge Löwen“ wiedergegeben.
- source_word: כְפִירִים
  choice: junge Löwen
  rationale: כְּפִיר bezeichnet junge, bereits kräftige Löwen und nicht notwendig hilflose Löwenjunge.
- source_word: נִתָּעוּ
  choice: sind herausgebrochen
  rationale: Die passive Perfektform beschreibt die gewaltsame Entfernung oder Zerstörung der Zähne. „Sind herausgebrochen“ bewahrt sowohl den resultativen Aspekt als auch die körperliche Gewalt des Bildes.
theological_decisions:
- issue: Bezug des abschließenden Verbs
  choice: Das Verb wird ausdrücklich nur auf „die Zähne der jungen Löwen“ bezogen; der Gedankenbruch wird durch einen Gedankenstrich sichtbar gemacht.
  alternative: Für „Brüllen“ und „Stimme“ ein nicht ausgedrücktes Verb wie „verstummen“ ergänzen oder das letzte Verb auf alle Satzglieder beziehen.
  rationale: Im Hebräischen steht nur bei den Zähnen ein ausdrücklich formuliertes Prädikat. Die Übersetzung ergänzt daher keine theologisch oder bildlich deutende Aussage, sondern erhält die knappe poetische Spannung.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der Gedankenstrich bildet die knappe, elliptische Struktur des hebräischen Verses ab. Die mehrfachen Löwenbezeichnungen werden soweit möglich unterschieden, ohne auf altertümliche deutsche Wörter wie „Leu“ zurückzugreifen.
