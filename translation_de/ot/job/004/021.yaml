  text: הֲ/לֹא נִסַּ֣ע יִתְרָ֣/ם בָּ֑/ם יָ֝מ֗וּתוּ וְ/לֹ֣א בְ/חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/021.yaml
  text: Is not their tent-cord pulled up within them? They die[b][a], and not in wisdom.
translation:
  language: de
  text: Wird nicht ihre Zeltleine[a] aus ihnen herausgezogen? Sie sterben – und nicht in Weisheit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Leine wird ihnen entrissen“; traditionell auch: „ihr Vorzug wird von ihnen weggenommen“. Das Hebräische ruft wahrscheinlich das Bild eines Zeltes auf, dessen Lebens- oder Zeltleine herausgezogen wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „ohne Weisheit“ oder „bevor sie Weisheit erlangen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Wird nicht
  rationale: Gibt die rhetorische Frage wieder, die Zustimmung erwartet, ohne sie zu einer ausdrücklichen Behauptung umzuformen.
- source_word: נִסַּע
  choice: herausgezogen
  rationale: Das passive Verb bezeichnet ein Herausziehen beziehungsweise Entfernen und lässt im Zusammenhang das Bild vom Abbrechen eines Zeltes anklingen.
- source_word: יִתְרָם
  choice: ihr Zeltstrick
  rationale: יֶתֶר kann einen Strick, besonders einen Zeltstrick, bezeichnen. Diese konkrete Bedeutung passt zum Bild der gebrechlichen, zeltartigen menschlichen Behausung im vorhergehenden Vers.
- source_word: בָּם
  choice: in ihnen
  rationale: Bewahrt die ungewöhnliche Präposition des Hebräischen und die Vorstellung, dass der Lebens- oder Zeltstrick im Menschen entfernt wird, statt die räumliche Beziehung stillschweigend zu glätten.
- source_word: יָמוּתוּ
  choice: Sie sterben
  rationale: מות ist das gewöhnliche Verb für sterben; die schlichte Wiedergabe fügt keine zusätzliche Wertung hinzu.
- source_word: וְלֹא בְחָכְמָה
  choice: und nicht in Weisheit
  rationale: Die bewusst knappe Formulierung erhält die Mehrdeutigkeit, ob die Menschen ohne Weisheit, unweise oder vor dem Erlangen von Weisheit sterben.
theological_decisions:
- issue: Bedeutung von וְלֹא בְחָכְמָה beim Tod
  choice: Die mehrdeutige Formulierung „und nicht in Weisheit“ bleibt im Haupttext stehen.
  alternative: „ohne Weisheit erlangt zu haben“ oder „nicht weise“
  rationale: Der hebräische Ausdruck legt nicht eindeutig fest, ob fehlende Weisheit, unweises Sterben oder der Tod vor dem Erlangen von Weisheit gemeint ist; keine dieser Deutungen soll zur alleinigen Aussage erhoben werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Bildsprache und die knappe Schlusswendung werden bewusst nicht geglättet; der Gedankenstrich macht den abrupten hebräischen Nachsatz im Deutschen lesbar.
