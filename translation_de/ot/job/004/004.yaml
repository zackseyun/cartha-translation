  text: כּ֭וֹשֵׁל יְקִימ֣וּ/ן מִלֶּ֑י/ךָ וּ/בִרְכַּ֖יִם כֹּרְע֣וֹת תְּאַמֵּֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/004.yaml
  text: Your words have raised up the one who stumbles[b][a], and you have strengthened knees that were giving way.
translation:
  language: de
  text: Deine Worte haben den Strauchelnden aufgerichtet[a], und nachgebende Knie hast du gestärkt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gestützt; wörtlich auch: zum Stehen gebracht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: sich beugende Knie; gemeint sind Knie, die aus Schwäche einknicken oder nachgeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹשֵׁל
  choice: den Strauchelnden
  rationale: Das Partizip von כשל bezeichnet einen Menschen, der strauchelt oder ins Wanken gerät. Die substantivierte Form bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: יְקִימוּן
  choice: haben … aufgerichtet
  rationale: Der Hifil von קום bedeutet hier jemanden aufrichten, zum Stehen bringen oder stützen. „Aufgerichtet“ passt zum Bild des Strauchelns und zur parallelen Stärkung der Knie.
- source_word: מִלֶּיךָ
  choice: Deine Worte
  rationale: Der Plural von מִלָּה bezeichnet Worte oder Rede. „Deine Worte“ ist direkt und idiomatisch.
- source_word: בִרְכַּיִם
  choice: Knie
  rationale: Der konkrete Körperbegriff wird beibehalten, da das poetische Bild auch im Deutschen verständlich ist.
- source_word: כֹּרְעוֹת
  choice: nachgebende
  rationale: Das Partizip von כרע beschreibt Knie, die sich beugen, einknicken oder unter Schwäche nachgeben. „Nachgebende Knie“ vermittelt das Bild knapp und natürlich.
- source_word: תְּאַמֵּץ
  choice: hast du gestärkt
  rationale: Der Piel von אמץ bedeutet stärken oder fest machen. „Gestärkt“ erhält sowohl die körperliche Metapher als auch den Parallelismus.
theological_decisions: []
