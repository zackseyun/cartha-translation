base_translation:
  language: en
  yaml_path: translation/ot/job/004/020.yaml
  text: From morning to evening they are crushed; without anyone taking notice[a], they perish forever.
translation:
  language: de
  text: Vom Morgen bis zum Abend werden sie zerschmettert; ohne dass jemand darauf achtet[a], gehen sie für immer zugrunde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne dass jemand es beachtet“; wörtlich wohl: „ohne dass jemand es sich zu Herzen nimmt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֹּקֶר לָעֶרֶב
  choice: Vom Morgen bis zum Abend
  rationale: Die Zeitangabe umfasst den Verlauf eines Tages und unterstreicht die Kürze und Zerbrechlichkeit menschlichen Lebens. Die Formulierung bewahrt das hebräische Bild und klingt im Deutschen natürlich.
- source_word: יֻכַּתּוּ
  choice: werden sie zerschmettert
  rationale: Die Hophal-Form bezeichnet ein passives Zerschlagen oder Zermalmen. „Zerschmettert“ erhält die starke Bildsprache, ohne die Ursache näher festzulegen.
- source_word: מִבְּלִי מֵשִׂים
  choice: ohne dass jemand darauf achtet
  rationale: Die elliptische Wendung mit „setzen/legen“ meint wahrscheinlich, etwas innerlich zu beachten oder zu Herzen zu nehmen. Die gewählte Formulierung gibt diesen Sinn verständlich wieder, ohne die Ellipse im Haupttext künstlich nachzubilden.
- source_word: לָנֶצַח
  choice: für immer
  rationale: Der Ausdruck betont hier die bleibende, nicht rückgängig zu machende Endgültigkeit ihres Untergangs. „Für immer“ bewahrt zugleich die mögliche semantische und theologische Spannung.
- source_word: יֹאבֵדוּ
  choice: gehen sie zugrunde
  rationale: Das Qal von אבד bezeichnet zugrunde gehen, umkommen oder verloren gehen. „Zugrunde gehen“ ist im Deutschen idiomatisch und legt keine engere eschatologische Bedeutung fest.
theological_decisions:
- issue: Endgültigkeit menschlicher Sterblichkeit in Elifas’ Rede
  choice: Die Aussage wird als Beschreibung menschlicher Vergänglichkeit und eines unbeachteten, unwiderruflichen Untergangs wiedergegeben.
  alternative: „Für immer“ ausdrücklich als endgültige eschatologische Verdammnis deuten.
  rationale: Im Zusammenhang spricht Elifas von der Zerbrechlichkeit der Sterblichen vor Gott. Die Übersetzung bewahrt „für immer“, erweitert die Aussage jedoch nicht zu einer ausgearbeiteten Lehre vom Endgericht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die starke Bildsprache bleiben erhalten; die idiomatische Ellipse wird im Haupttext verständlich wiedergegeben und in der Fußnote transparent gemacht.
