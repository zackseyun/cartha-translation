  source_fidelity: 'Die Wiedergabe trifft die wesentlichen Elemente des Hebräischen: שְׂעִפִּים sind beunruhigende bzw. unruhige Gedanken, מִן bezeichnet den Ursprung bzw. Anlass in den nächtlichen Visionen, und die zweite Vershälfte gibt den temporalen Infinitivsatz sowie תַּרְדֵּמָה zutreffend wieder. „Menschen“ ist für אֲנָשִׁים im generischen Kontext angemessen.'
