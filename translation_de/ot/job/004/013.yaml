  text: בִּ֭/שְׂעִפִּים מֵ/חֶזְיֹנ֣וֹת לָ֑יְלָה בִּ/נְפֹ֥ל תַּ֝רְדֵּמָ֗ה עַל אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/013.yaml
  text: Amid disquieting thoughts from visions of the night[a], when deep sleep falls on men[b],
translation:
  language: de
  text: Inmitten beunruhigender Gedanken, die aus nächtlichen Visionen[a] erwachsen, wenn tiefer Schlaf auf Menschen fällt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Inmitten unruhiger Gedanken aufgrund von Visionen der Nacht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשְׂעִפִּים
  choice: In beunruhigenden Gedanken
  rationale: Das seltene שְׂעִפִּים bezeichnet hier geteilte, unruhige oder beängstigende Gedanken. „Beunruhigende Gedanken“ gibt die innere Verstörung natürlich und ohne Überdeutung wieder.
- source_word: מֵחֶזְיֹנוֹת לָיְלָה
  choice: aus nächtlichen Visionen
  rationale: חֶזְיֹנוֹת sind Visionen; מִן bezeichnet ihre Quelle oder Veranlassung. „Nächtliche Visionen“ ist im Deutschen natürlicher als „Visionen der Nacht“.
- source_word: בִּנְפֹל
  choice: wenn … fällt
  rationale: Der Infinitivus constructus mit בְּ leitet einen temporalen Nebensatz ein.
- source_word: תַּרְדֵּמָה
  choice: tiefer Schlaf
  rationale: Das Wort bezeichnet einen schweren, tiefen Schlaf und nicht bloß gewöhnlichen Schlaf.
- source_word: עַל אֲנָשִׁים
  choice: auf Menschen
  rationale: אֲנָשִׁים hat hier generische Bedeutung. „Menschen“ bewahrt diese Bedeutung im modernen Deutschen, ohne eine ausschließlich männliche Referenz nahezulegen.
theological_decisions:
- issue: Generische Bedeutung von אֲנָשִׁים
  choice: Menschen
  alternative: Männer
  rationale: Obwohl die hebräische Form maskulin ist, bezeichnet sie in diesem allgemeinen Ausspruch Menschen insgesamt. Die deutsche Wiedergabe „Menschen“ bildet den gemeinten Umfang genauer ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als syntaktisch offene Fortsetzung mit Komma stehen. Die Verbindung von Gedanken und Visionen sowie die Quell- oder Anlassbedeutung von מִן werden nicht enger festgelegt als nötig.
