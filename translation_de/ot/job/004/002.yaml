  text: הֲ/נִסָּ֬ה דָבָ֣ר אֵלֶ֣י/ךָ תִּלְאֶ֑ה וַ/עְצֹ֥ר בְּ֝/מִלִּ֗ין מִ֣י יוּכָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/002.yaml
  text: If one tries a word with you[a], will you be weary? But who can hold back words?
translation:
  language: de
  text: Wagt jemand, ein Wort an dich zu richten[a] – wirst du müde? Doch wer kann Worte zurückhalten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wagt jemand, dir eine Sache vorzubringen?“'
    reason: דבר kann neben „Wort“ auch „Sache“ oder „Angelegenheit“ bedeuten; נסה kann entsprechend als „versuchen“ oder „wagen“ verstanden werden.
lexical_decisions:
- source_word: הֲנִסָּה
  choice: Wagt jemand
  rationale: Das Piel von נסה bezeichnet hier am ehesten den vorsichtigen Versuch, zu reden. „Wagt“ gibt diese zögernde Gesprächseröffnung natürlicher wieder als „prüft“.
- source_word: דָבָר
  choice: ein Wort
  rationale: דבר kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten. Der folgende Plural „Worte“ stellt hier den Redeaspekt in den Vordergrund; die sachbezogene Lesart bleibt in der Fußnote erhalten.
- source_word: אֵלֶיךָ
  choice: an dich
  rationale: Die Präposition bezeichnet die Ausrichtung der Rede auf Hiob. „Ein Wort an dich“ ist im Deutschen knapp und verständlich.
- source_word: תִּלְאֶה
  choice: wirst du müde
  rationale: לאה bedeutet grundlegend „müde werden“ oder „ermatten“. Die direkte Wiedergabe bewahrt offen, ob körperliche Ermüdung, Überdruss oder Gereiztheit gemeint ist.
- source_word: וַעְצֹר
  choice: Doch … zurückhalten
  rationale: עצר bedeutet „zurückhalten“ oder „zurückhalten können“. „Doch“ gibt den kontextuell gegensätzlichen Anschluss der waw-Klausel wieder.
- source_word: בְּמִלִּין
  choice: Worte
  rationale: Die aramaisierende Pluralform bezeichnet gesprochene Worte und greift das vorherige דבר hörbar auf.
- source_word: מִי יוּכָל
  choice: wer kann
  rationale: Die knappe rhetorische Frage wird im Deutschen ebenso knapp und idiomatisch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht ungewöhnliche Wendung „ein Wort an dich wagen“ bewahrt die vorsichtige, tastende Gesprächseröffnung und die Wiederaufnahme von „Wort“ durch „Worte“.
