    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: Denk doch daran
  rationale: Der Imperativ זְכָר fordert zum Erinnern oder Bedenken auf; נָא mildert bzw. unterstreicht die Aufforderung. „Denk doch daran“ gibt diese Gesprächsnuance in natürlichem modernem Deutsch wieder.
- source_word: מִי הוּא
  choice: Wer ist je
  rationale: Die Verbindung aus Fragewort und Pronomen verstärkt die rhetorische Frage. Zusammen mit dem Aussagegehalt des Satzes bringt „Wer ist je …?“ die gemeinte Herausforderung idiomatisch zum Ausdruck.
- source_word: נָקִי
  choice: unschuldig
  rationale: נָקִי bezeichnet hier jemanden, der frei von Schuld ist. „Unschuldig“ ist die klare, kontextgerechte Wiedergabe; „schuldlos“ bleibt als mögliche Alternative erhalten.
- source_word: אָבָד
  choice: umgekommen
  rationale: Das Qal-Perfekt von אבד bezeichnet Zugrundegehen oder Untergang. „Umgekommen“ wahrt den Ernst der Aussage, ohne ausdrücklich einen handelnden Vernichter vorauszusetzen.
- source_word: וְאֵיפֹה
  choice: Und wo
  rationale: Die Konjunktion mit dem Frageadverb leitet die parallele zweite rhetorische Frage ein. Das schlichte „Und wo“ bildet die hebräische Verknüpfung unmittelbar und natürlich ab.
- source_word: יְשָׁרִים
  choice: Aufrichtige
  rationale: Das substantivierte Adjektiv bezeichnet moralisch integre Menschen. „Aufrichtige“ ist im Deutschen knapp und würdevoll.
- source_word: נִכְחָדוּ
  choice: ausgelöscht
  rationale: Das Niphal von כחד kann verborgen, getilgt oder vernichtet werden bedeuten. Parallel zu אָבָד bezeichnet es hier den völligen Untergang; „ausgelöscht“ bewahrt die passive, resultative Aussage.
theological_decisions:
- issue: Elifas’ rhetorische Behauptung über das Schicksal Unschuldiger und Aufrichtiger
  choice: Die Behauptung wird ohne abschwächenden oder bestätigenden Zusatz direkt als rhetorische Frage wiedergegeben.
  alternative: Durch eine interpretierende Formulierung bereits andeuten, dass die Aussage im Gesamtbuch bestritten wird.
  rationale: Der Vers gibt Elifas’ Sicht wieder. Die Übersetzung soll ihre Schärfe bewahren, ohne sie als abschließende Lehre des Buches zu bestätigen oder durch spätere Entwicklungen vorweg zu relativieren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die beiden parallelen rhetorischen Fragen und Elifas’ zugespitzte Aussage bleiben erhalten; „doch“ gibt die Gesprächsfunktion von נָא ohne altertümliches „bitte“ oder „nun“ wieder.
