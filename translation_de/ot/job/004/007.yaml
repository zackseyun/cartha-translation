  text: 'Please remember: who that was innocent ever perished? Or where were the upright cut off?[a][b]'
translation:
  language: de
  text: 'Denk doch daran: Wer ist je unschuldig umgekommen? Und wo wurden Aufrichtige ausgelöscht?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schuldlos“ statt „unschuldig“.'
