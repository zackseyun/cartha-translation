translation:
  language: de
  text: Der Löwe kommt um, weil es ihm an Beute fehlt, und die Jungen des Löwen[a] werden zerstreut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Löwin“. Das hebräische Wort לָבִיא kann einen Löwen oder eine Löwin bezeichnen. Wörtlich lautet die Verbindung: „die Söhne des Löwen/der Löwin“. Das mit „werden zerstreut“ wiedergegebene Verb kann auch „sich zerstreuen“ oder „auseinandergehen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  choice: der Löwe
  rationale: Das Wort bezeichnet einen Löwen, möglicherweise mit dem Beiklang von Stärke oder Reife. Die schlichte Wiedergabe „Löwe“ wahrt die Bildsprache, ohne die mögliche Nuance zu stark festzulegen.
- source_word: אֹבֵד
  choice: kommt um
  rationale: Das Partizip von אבד bezeichnet Untergang oder Verderben. „Kommt um“ klingt im modernen Deutschen natürlich und erhält den zugespitzten sprichwörtlichen Ton.
- source_word: מִבְּלִי
  choice: wenn ihm … fehlt
  rationale: Die Verbindung drückt Mangel beziehungsweise Fehlen aus. Die konditional-kausale Formulierung gibt den Zusammenhang im Deutschen klar und idiomatisch wieder.
- source_word: טָרֶף
  choice: Beute
  rationale: Das Wort meint die Beute eines Raubtiers und nicht bloß Nahrung; „Beute“ bewahrt daher das Löwenbild.
- source_word: בְנֵי
  choice: die Jungen des
  rationale: Wörtlich steht „Söhne von“. Bei Tieren ist „Jungen“ im Deutschen die natürliche, sachlich entsprechende Wiedergabe und lässt das Geschlecht der Nachkommen offen.
- source_word: לָבִיא
  choice: Löwen
  rationale: לָבִיא bezeichnet einen Löwen und kann je nach Kontext auch als Löwin verstanden werden. Der Haupttext bleibt mit „Löwen“ geschlechtsneutraler; die mögliche Wiedergabe „Löwin“ wird in der Fußnote erhalten.
- source_word: יִתְפָּרָדוּ
  choice: werden zerstreut
  rationale: Der Hitpael bezeichnet ein Auseinandergehen oder Sich-Zerstreuen. „Werden zerstreut“ gibt das Ergebnis des Zerfalls der Gruppe prägnant wieder, während die Fußnote die reflexive Nuance nennt.
