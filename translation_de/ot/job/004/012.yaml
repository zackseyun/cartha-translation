  yaml_path: translation/ot/job/004/012.yaml
  text: A word was secretly brought to me[a], and my ear caught a whisper of it.
translation:
  language: de
  text: Ein Wort wurde mir heimlich zugetragen, und mein Ohr fing davon ein Flüstern auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Mein Ohr fing nur einen leisen Laut davon auf“ oder „nahm eine Spur davon wahr“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַי
  choice: mir
  rationale: Die Präposition mit Suffix bezeichnet ausdrücklich die Richtung „zu mir“. Das einleitende וְ wird durch die natürliche Satzverknüpfung getragen, ohne ein zeitliches „nun“ einzuführen.
- source_word: דָּבָר
  choice: ein Wort
  rationale: „Wort“ bewahrt die knappe, geheimnisvolle Ausdrucksweise und legt den Inhalt nicht vorschnell als ausführliche Botschaft fest.
- source_word: יְגֻנָּב
  choice: wurde heimlich zugetragen
  rationale: Die Passivform der Wurzel גנב („stehlen“) beschreibt hier bildlich ein verstohlenes oder geheimes Gelangen. „Heimlich zugetragen“ gibt diesen Sinn verständlich wieder, ohne einen tatsächlichen Diebstahl anzunehmen.
- source_word: וַתִּקַּח
  choice: fing ... auf
  rationale: Das Verb bedeutet wörtlich „nahm“; mit „mein Ohr“ als Subjekt gibt „fing ... auf“ das anschauliche Bild in natürlichem Deutsch wieder.
- source_word: אָזְנִי
  choice: mein Ohr
  rationale: Der Singular und die konkrete Körpermetapher des Hebräischen bleiben erhalten.
- source_word: שֵׁמֶץ
  choice: ein Flüstern
  rationale: Das Wort bezeichnet eine geringe Spur, einen kleinen Anteil oder einen kaum hörbaren Laut. Im akustischen Zusammenhang trifft „Flüstern“ die gedämpfte, geheimnisvolle Wahrnehmung.
- source_word: מֶנְהוּ
  choice: davon
  rationale: Die Präposition mit Pronomen bedeutet „von/aus ihm“ und bezieht sich grammatisch auf „Wort“; idiomatisches Deutsch verlangt hier „davon“.
