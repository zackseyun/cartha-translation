id: JOB.4.18
reference: Job 4:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵ֣ן בַּ֭/עֲבָדָי/ו לֹ֣א יַאֲמִ֑ין וּ֝/בְ/מַלְאָכָ֗י/ו יָשִׂ֥ים תָּהֳלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/018.yaml
  text: Look[a], he puts no trust in his servants[b], and he charges his messengers with error.
translation:
  language: de
  text: Sieh, seinen Dienern vertraut er nicht, und seinen Boten[a] legt er Irrtum[b] zur Last.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Engeln“. Das hebräische Wort kann menschliche oder himmlische Boten bezeichnen; hier weist der Zusammenhang wahrscheinlich auf himmlische Wesen.
    reason: alternative_reading
  - marker: b
    text: Oder „Torheit“, „Fehler“ oder „Unvollkommenheit“.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Partikel eröffnet eine nachdrückliche, Aufmerksamkeit weckende Aussage. „Sieh“ bewahrt diese Wirkung in knapper, heutiger Sprache.
- source_word: בַּעֲבָדָיו
  choice: seinen Dienern
  rationale: Die Präposition ב bezeichnet beim Hifil von אמן den Gegenstand des Vertrauens. „Diener“ gibt die untergeordnete Stellung wieder, ohne unnötig den sozialen Status von Sklaven hervorzuheben.
- source_word: לֹא יַאֲמִין
  choice: vertraut er nicht
  rationale: Das Hifil von אמן bezeichnet hier Vertrauen oder Zuversicht, nicht bloß das Fürwahrhalten einer Aussage.
- source_word: וּבְמַלְאָכָיו
  choice: seinen Boten
  rationale: מַלְאָך kann einen menschlichen oder himmlischen Boten bezeichnen. „Boten“ wahrt die lexikalische Offenheit; der Zusammenhang weist wahrscheinlich auf Engel.
- source_word: יָשִׂים
  choice: legt er … zur Last
  rationale: שׂים mit einem abstrakten Substantiv bedeutet hier, jemandem etwas zuzuschreiben oder anzulasten. Die deutsche Wendung gibt diesen idiomatischen Sinn natürlich wieder.
- source_word: תָּהֳלָה
  choice: Irrtum
  rationale: Das seltene Substantiv kann einen Irrtum, Fehler, eine Torheit oder einen Mangel bezeichnen. „Irrtum“ ist knapp und lässt die genaue Art der beanstandeten Unvollkommenheit offen.
theological_decisions:
- issue: Ob מַלְאָכָיו ausdrücklich mit „Engeln“ oder allgemeiner mit „Boten“ wiederzugeben ist
  choice: Boten
  alternative: Engel
  rationale: Der hebräische Ausdruck bezeichnet grundsätzlich Boten und kann speziell himmlische Boten meinen. Die allgemeinere Wiedergabe bewahrt die sprachliche Mehrdeutigkeit, während die Fußnote den im Kontext wahrscheinlichen Bezug auf Engel nennt.
- issue: Wie die seltene Bezeichnung תָּהֳלָה zu verstehen ist
  choice: Irrtum
  alternative: Torheit, Fehler oder Unvollkommenheit
  rationale: Die genaue Bedeutungsnuance des seltenen Wortes ist unsicher. „Irrtum“ wahrt die Aussage, dass selbst Gottes himmlische Diener vor ihm nicht uneingeschränkt verlässlich sind, ohne die Art ihres Mangels dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Parallelität zwischen „Dienern“ und „Boten“ bleibt erhalten; die seltene und mehrdeutige Schlussvokabel wird nicht überpräzisiert.
