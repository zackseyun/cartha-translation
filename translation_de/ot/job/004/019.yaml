  text: אַ֤ף שֹׁכְנֵ֬י בָֽתֵּי חֹ֗מֶר אֲשֶׁר בֶּ/עָפָ֥ר יְסוֹדָ֑/ם יְ֝דַכְּא֗וּ/ם לִ/פְנֵי עָֽשׁ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/019.yaml
  text: how much more those who dwell in houses of clay[a], whose foundation is in the dust[b], who are crushed before the moth!
translation:
  language: de
  text: Um wie viel mehr die Bewohner von Lehmhäusern, deren Fundament im Staub liegt – sie werden schneller als eine Motte zermalmt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף
  choice: wie viel mehr
  rationale: 'Im Anschluss an Vers 18 hat die Partikel wahrscheinlich steigernd-schlussfolgernde Kraft: Wenn Gott schon seinen himmlischen Dienern nicht vertraut, wie viel weniger beziehungsweise wie viel mehr gilt die Aussage für vergängliche Menschen.'
- source_word: שֹׁכְנֵי בָתֵּי חֹמֶר
  choice: die, die in Häusern aus Lehm wohnen
  rationale: Das Partizip bezeichnet dauerhaftes Wohnen. „Häuser aus Lehm“ bewahrt das konkrete Bild und zugleich seine metaphorische Aussage über die Gebrechlichkeit des menschlichen Leibes.
- source_word: אֲשֶׁר בֶּעָפָר יְסוֹדָם
  choice: deren Fundament im Staub liegt
  rationale: Die Formulierung erhält das Bild eines im Staub gegründeten Hauses und den Anklang an die Herkunft und Vergänglichkeit des Menschen.
- source_word: יְדַכְּאוּם
  choice: sie werden … zermalmt
  rationale: Das Piel von דכא bezeichnet ein heftiges Zermalmen oder Zerschlagen. Die passive deutsche Form vermeidet es, ein im Hebräischen nicht ausdrücklich genanntes Subjekt einzuführen.
- source_word: לִפְנֵי עָשׁ
  choice: vor einer Motte
  rationale: Die wörtliche räumliche Formulierung bewahrt die ungewöhnliche und mehrdeutige poetische Wendung; möglich sind auch vergleichende Deutungen im Sinn von schneller oder leichter als eine Motte.
theological_decisions:
- issue: Metaphorischer Bezug der „Häuser aus Lehm“
  choice: Das Bild bleibt offen und bezeichnet im Zusammenhang wahrscheinlich die gebrechliche, sterbliche menschliche Existenz beziehungsweise den menschlichen Leib.
  alternative: Wörtliche Behausungen aus Lehm als Bild für die allgemeine Verwundbarkeit ihrer Bewohner.
  rationale: Der Gegensatz zu Gottes himmlischen Dienern in Vers 18 spricht für menschliche Sterblichkeit; eine erklärende Auflösung im Haupttext würde die Bildsprache unnötig einengen.
- issue: Bedeutung von „vor einer Motte“
  choice: Die wörtliche, mehrdeutige Wendung bleibt im Haupttext erhalten.
  alternative: „schneller als eine Motte“ oder „leichter als eine Motte“ beziehungsweise „von einer Motte“.
  rationale: Die hebräische Präposition לִפְנֵי bedeutet grundsätzlich „vor“, doch die Wendung kann vergleichende Schnelligkeit oder Leichtigkeit des Untergangs ausdrücken. Eine eindeutige Festlegung wäre textlich unsicher.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter poetischer Bildlichkeit. „Lehm“ ist im Deutschen für Baumaterial natürlicher als „Ton“, während „Fundament im Staub“ die anthropologische Resonanz erhält. Der Gedankenstrich bildet den Übergang von der Relativbeschreibung zur Aussage über die Bewohner ab.
