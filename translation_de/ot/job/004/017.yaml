  text: הַֽ֭/אֱנוֹשׁ מֵ/אֱל֣וֹהַ יִצְדָּ֑ק אִ֥ם מֵ֝/עֹשֵׂ֗/הוּ יִטְהַר גָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/017.yaml
  text: Can mortal man be in the right before God? Can a man be pure before his Maker?[a]
translation:
  language: de
  text: Kann ein sterblicher Mensch vor Gott im Recht sein? Kann ein Mann vor seinem Schöpfer rein sein?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formeller: „Kann ein sterblicher Mensch gerechter sein als Gott? Kann ein Mann reiner sein als sein Schöpfer?“'
    reason: Alternative vergleichende Deutung der hebräischen Präposition מִן in beiden Vershälften.
lexical_decisions:
- source_word: הַאֱנוֹשׁ
  choice: ein sterblicher Mensch
  rationale: אֱנוֹשׁ bezeichnet den Menschen häufig mit dem Beiklang seiner Schwäche und Sterblichkeit. „Ein sterblicher Mensch“ bewahrt diesen Kontrast zu Gott in natürlichem Deutsch.
- source_word: מֵאֱלוֹהַ
  choice: vor Gott
  rationale: Die Präposition מִן kann hier vergleichend („gerechter als Gott“) oder relational verstanden werden. Zusammen mit צדק gibt „vor Gott im Recht sein“ die kontextuell naheliegende relationale Bedeutung idiomatisch wieder; die formell vergleichende Lesart bleibt in der Fußnote erhalten.
- source_word: יִצְדָּק
  choice: im Recht sein
  rationale: צדק bezeichnet hier das Recht- oder Gerechtsein in Beziehung zu Gott. „Im Recht sein“ wahrt den forensisch-relationalen Sinn und ist zugleich allgemein verständlich.
- source_word: אִם
  choice: Kann
  rationale: אִם leitet im poetischen Parallelismus die zweite Frage ein. Die Wiederholung von „Kann“ bildet die rhetorische Parallelstruktur im Deutschen klar ab.
- source_word: מֵעֹשֵׂהוּ
  choice: vor seinem Schöpfer
  rationale: עֹשֵׂהוּ bedeutet „der ihn gemacht hat / sein Schöpfer“. „Sein Schöpfer“ ist knapp und würdevoll; „vor“ entspricht der relationalen Deutung von מִן, während die vergleichende Möglichkeit in der Fußnote dokumentiert wird.
- source_word: יִטְהַר
  choice: rein sein
  rationale: טהר bezeichnet Reinheit beziehungsweise Reinsein. „Rein sein“ passt zum moralisch-religiösen Gewicht des Parallelismus mit צדק, ohne den Sinn näher dogmatisch festzulegen.
- source_word: גָּבֶר
  choice: ein Mann
  rationale: גָּבֶר ist eine maskuline Singularbezeichnung für einen Mann und steht poetisch parallel zu אֱנוֹשׁ. „Ein Mann“ wahrt die konkrete Form, ohne die mögliche Nebenbedeutung von Stärke unangebracht hervorzuheben.
theological_decisions:
- issue: Die Stellung des Menschen gegenüber Gott
  choice: Der Vers fragt rhetorisch, ob ein sterblicher Mensch vor Gott im Recht und vor seinem Schöpfer rein sein kann.
  alternative: Der Vers kann formell vergleichend fragen, ob ein Mensch gerechter als Gott oder reiner als sein Schöpfer sein kann.
  rationale: Die Konstruktion mit מִן lässt sowohl eine vergleichende als auch eine relationale Auffassung zu. Der Haupttext verwendet die im Zusammenhang natürliche relationale Wiedergabe, ohne eine spätere dogmatische Formel einzutragen; die echte sprachliche Mehrdeutigkeit wird durch die Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelstruktur. „Sterblicher Mensch“ macht die im ersten hebräischen Menschenwort anklingende Gebrechlichkeit sichtbar; „Mann“ erhält den Wechsel zum zweiten maskulinen Ausdruck. Die Formulierung vermeidet konfessionelle Zusatzdeutungen.
