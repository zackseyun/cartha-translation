source:
  edition: WLC
  text: יַעֲמֹ֤ד וְֽ/לֹא אַכִּ֬יר מַרְאֵ֗/הוּ תְּ֭מוּנָה לְ/נֶ֣גֶד עֵינָ֑/י דְּמָמָ֖ה וָ/ק֣וֹל אֶשְׁמָֽע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/016.yaml
  text: 'It stood still[a], but I could not recognize its appearance; a form was before my eyes; there was silence[b], and I heard a voice:'
translation:
  language: de
  text: 'Es blieb stehen, doch ich konnte seine Erscheinung nicht erkennen. Eine Gestalt war vor meinen Augen; Stille[a] — dann hörte ich eine Stimme:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schweigen“ oder „lautlose Ruhe“. Das hebräische Wort kann sowohl völlige Stille als auch eine ruhige, gedämpfte Lautlosigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: blieb stehen
  rationale: עמד bezeichnet das Stehen beziehungsweise Verharren. „Blieb stehen“ gibt im visionären Zusammenhang das unbewegte Verweilen der Erscheinung natürlich wieder.
- source_word: וְלֹא אַכִּיר
  choice: doch ich konnte ... nicht erkennen
  rationale: נכר im Hifil bedeutet „erkennen“ oder „identifizieren“. „Doch“ bringt den Gegensatz zwischen der wahrgenommenen Gegenwart und ihrer Unerkennbarkeit zum Ausdruck.
- source_word: מַרְאֵהוּ
  choice: seine Erscheinung
  rationale: מַרְאֶה bezeichnet das sichtbare Aussehen beziehungsweise die Erscheinung. Das maskuline Singularsuffix wird mit „seine“ formal bewahrt, ohne den unbekannten Träger näher zu bestimmen.
- source_word: תְּמוּנָה
  choice: eine Gestalt
  rationale: תמונה kann eine Gestalt, Form oder sichtbare Erscheinung bezeichnen. „Gestalt“ passt zu dem undeutlichen visuellen Eindruck und klingt im Deutschen natürlich und würdig.
- source_word: לְנֶגֶד עֵינָי
  choice: war vor meinen Augen
  rationale: Die Wendung bedeutet wörtlich „vor meinen Augen“ und wird unter Ergänzung des im Hebräischen vorausgesetzten Verbs idiomatisch wiedergegeben.
- source_word: דְּמָמָה
  choice: Stille
  rationale: דממה bezeichnet Stille, Schweigen oder lautlose Ruhe. Die knappe Nominalwendung wahrt die markante Spannung des Hebräischen.
- source_word: וָקוֹל אֶשְׁמָע
  choice: dann hörte ich eine Stimme
  rationale: קוֹל kann „Stimme“ oder „Laut“ bedeuten; wegen der folgenden Rede ist „Stimme“ kontextuell angemessen. „Dann“ macht die Abfolge im Deutschen klar, ohne den Sinn zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, spannungsvoller Satzführung. Die fragmentarische Wirkung von דְּמָמָה bleibt durch „Stille —“ erhalten. Das grammatisch maskuline Suffix in מַרְאֵהוּ wird formal mit „seine“ wiedergegeben, ohne die nicht näher identifizierte Erscheinung theologisch festzulegen.
