id: JOB.4.6
reference: Job 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/לֹ֣א יִ֭רְאָתְ/ךָ כִּסְלָתֶ֑/ךָ תִּ֝קְוָתְ/ךָ֗ וְ/תֹ֣ם דְּרָכֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/006.yaml
  text: Is not your fear of God your confidence[c][b][a], and the integrity of your ways your hope?
translation:
  language: de
  text: Ist nicht deine Gottesfurcht[a] deine Zuversicht[b] und die Lauterkeit[c] deiner Wege deine Hoffnung?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich nur „deine Furcht“; das Hebräische nennt das Objekt nicht ausdrücklich. In der Weisheitsliteratur ist damit häufig die Furcht vor Gott gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dein Vertrauen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Untadeligkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Ist nicht
  rationale: Gibt die rhetorische Frage wieder, die Zustimmung erwartet, ohne sie zu einer ausdrücklichen Behauptung wie „Gewiss“ umzudeuten.
- source_word: יִרְאָתְךָ
  choice: deine Gottesfurcht
  rationale: Im Hebräischen steht wörtlich „deine Furcht“ ohne genanntes Objekt. Im Kontext der Weisheitsliteratur ist sehr wahrscheinlich die Furcht vor Gott gemeint; „Gottesfurcht“ ist im Deutschen dafür die natürliche und knappe Bezeichnung.
- source_word: כִּסְלָתֶךָ
  choice: deine Zuversicht
  rationale: Das Substantiv bezeichnet hier dem Parallelismus und Zusammenhang nach Zuversicht oder Vertrauen, nicht die andernorts mit derselben Wurzel verbundene Torheit.
- source_word: תִּקְוָתְךָ
  choice: deine Hoffnung
  rationale: „Hoffnung“ gibt die erwartungsvolle Bedeutung von תִּקְוָה in diesem Weisheitskontext idiomatisch wieder.
- source_word: וְתֹם
  choice: und die Lauterkeit
  rationale: תֹּם bezeichnet Ganzheit, Rechtschaffenheit oder Untadeligkeit. „Lauterkeit“ bewahrt den ethischen Sinn, ohne absolute Sündlosigkeit nahezulegen.
- source_word: דְּרָכֶיךָ
  choice: deiner Wege
  rationale: Bewahrt das in der Weisheitsliteratur geläufige hebräische Bild der „Wege“ für Lebensführung und Verhalten.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Objekt der Furcht
  choice: „Gottesfurcht“ im Haupttext
  alternative: „deine Furcht“ oder „deine Ehrfurcht“
  rationale: Obwohl Gott im hebräischen Ausdruck nicht ausdrücklich als Objekt genannt wird, weist der weisheitliche Sprachgebrauch wahrscheinlich auf die Furcht vor Gott. Die Fußnote hält die formale Mehrdeutigkeit sichtbar.
- issue: Verhältnis der Nominalgruppen
  choice: 'Zwei parallele Aussagen: Gottesfurcht als Zuversicht und Lauterkeit der Wege als Hoffnung'
  alternative: Die vier Nominalgruppen als lockere Aufzählung oder „deine Hoffnung“ als vorangestelltes Prädikat zur Lauterkeit lesen
  rationale: Die paarweise Wiedergabe ergibt einen ausgewogenen poetischen Parallelismus und entspricht der wahrscheinlichsten syntaktischen Deutung, ohne die Spannung der knappen hebräischen Nominalsätze völlig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe rhetorische Frage und der poetische Parallelismus bleiben erhalten; „Wege“ bewahrt die Bildsprache des hebräischen Weisheitsstils.
