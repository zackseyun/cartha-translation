source:
  edition: WLC
  text: כִּ֤י עַתָּ֨ה תָּב֣וֹא אֵלֶ֣י/ךָ וַ/תֵּ֑לֶא תִּגַּ֥ע עָ֝דֶ֗י/ךָ וַ/תִּבָּהֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/005.yaml
  text: But now it comes to you[a], and you are weary; it touches you[b], and you are dismayed.
translation:
  language: de
  text: Doch[a] jetzt kommt es zu dir[b], und du wirst müde; es trifft dich, und du erschrickst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn jetzt“. Die hebräische Konjunktion כִּי kann hier unterschiedlich verstanden werden; „Doch“ hebt den Gegensatz zum vorangehenden Verhalten Ijobs hervor.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräischen Verben für „kommt“ und „trifft“ stehen in der weiblichen Einzahl. Gemeint ist vermutlich unausgesprochen die Not oder das Unheil, das Ijob erreicht.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Doch
  rationale: Die adversative Wiedergabe stellt den im Zusammenhang hervorgehobenen Gegensatz zwischen Ijobs früherer Stärkung anderer und seiner jetzigen Reaktion heraus; die kausale Bedeutung „Denn“ bleibt als echte Alternative in der Fußnote erhalten.
- source_word: עַתָּה
  choice: jetzt
  rationale: Das Temporaladverb bezeichnet Ijobs gegenwärtige Lage im Gegensatz zu seinem früheren Verhalten.
- source_word: תָּבוֹא אֵלֶיךָ
  choice: es kommt zu dir
  rationale: Die Form תָּבוֹא ist feminin Singular und hat kein ausdrücklich genanntes Subjekt. Das deutsche „es“ gibt den impliziten Bezug auf Not oder Unheil natürlich wieder, ohne ein Substantiv in den Text einzufügen.
- source_word: וַתֵּלֶא
  choice: und du wirst müde
  rationale: לאה bezeichnet das Ermüden oder Ermatten. Die Wiedergabe bewahrt den Gedanken nachlassender Kraft, ohne ihn als moralische Ungeduld auszulegen.
- source_word: תִּגַּע עָדֶיךָ
  choice: es trifft dich
  rationale: נגע kann „berühren“, „erreichen“ oder „treffen“ bedeuten. Im Zusammenhang persönlichen Leids ist „trifft dich“ natürlich und gibt das tatsächliche Erreichen Ijobs wieder, ohne die Stärke unnötig bis zu „schlägt“ zu steigern.
- source_word: וַתִּבָּהֵל
  choice: und du erschrickst
  rationale: בהל bezeichnet Erschrecken, Bestürzung oder innere Aufregung. „Du erschrickst“ ist gegenwärtiges, verständliches Deutsch und überzeichnet die Aussage nicht als blankes Entsetzen.
theological_decisions:
- issue: Nicht genanntes Subjekt der femininen Verbformen
  choice: Mit dem neutralen Pronomen „es“ wiedergegeben und in einer Fußnote erklärt
  alternative: Ein bestimmtes Substantiv wie „das Unheil“ oder „die Not“ in den Haupttext einsetzen
  rationale: Der hebräische Text lässt das Subjekt unausgesprochen. Die gewählte Fassung wahrt diese Offenheit und vermeidet eine theologische oder literarische Festlegung, die der Vers selbst nicht ausdrücklich trifft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. „Es trifft dich“ ist im Deutschen für widerfahrendes Leid natürlicher als das potenziell zu sanfte „es berührt dich“. Die Wiederholung von „es“ bewahrt die Parallelität und das ungenannte Subjekt.
