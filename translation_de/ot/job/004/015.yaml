source:
  edition: WLC
  text: וְ֭/רוּחַ עַל פָּנַ֣/י יַחֲלֹ֑ף תְּ֝סַמֵּ֗ר שַֽׂעֲרַ֥ת בְּשָׂרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/015.yaml
  text: Then a spirit passed before my face[a]; the hair of my flesh bristled.
translation:
  language: de
  text: Da strich ein Geist an meinem Gesicht vorbei[a]; die Haare auf meinem Leib sträubten sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Wind« oder »ein Atemhauch« strich an meinem Gesicht vorbei. Das hebräische Wort רוּחַ kann »Geist«, »Wind« oder »Atem« bedeuten; hier spricht der Zusammenhang eher für »Geist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: ein Geist
  rationale: רוּחַ kann »Geist«, »Wind« oder »Atem« bedeuten. Im Zusammenhang der unheimlichen nächtlichen Erscheinung ist »Geist« am wahrscheinlichsten; die Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: עַל פָּנַי
  choice: an meinem Gesicht vorbei
  rationale: Wörtlich steht »über/auf meinem Gesicht«; zusammen mit חלף bezeichnet die Wendung eine Bewegung unmittelbar vor dem Gesicht des Sprechers. Die deutsche Formulierung ist anschaulich und idiomatisch.
- source_word: יַחֲלֹף
  choice: strich … vorbei
  rationale: חלף bedeutet hier »vorübergehen/vorbeiziehen«. »Strich … vorbei« gibt die leise, unheimliche Bewegung natürlich wieder, ohne ein gleitendes Wesen ausdrücklich vorauszusetzen.
- source_word: תְּסַמֵּר
  choice: sträubten sich
  rationale: Das Verb bezeichnet das Starr- oder Aufrechtwerden. Bei Haaren ist »sich sträuben« die treffende und geläufige deutsche Entsprechung.
- source_word: שַׂעֲרַת בְּשָׂרִי
  choice: die Haare auf meinem Leib
  rationale: Die hebräische Wendung lautet wörtlich »das Haar meines Fleisches«. »Auf meinem Leib« bewahrt das körperliche Bild und den würdigen Ton, klingt aber im heutigen Deutsch natürlicher.
theological_decisions:
- issue: Identität von רוּחַ
  choice: ein Geist
  alternative: ein Wind / ein Atemhauch
  rationale: Der visionäre Zusammenhang legt eine geistige Erscheinung nahe, doch das Hebräische legt die Bedeutung nicht eindeutig fest. Deshalb bleibt die lexikalische Spannung in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Leib« erhält die feierliche Körperlichkeit des hebräischen Ausdrucks, während »strich … vorbei« und »sträubten sich« die Szene anschaulich und allgemein verständlich wiedergeben.
