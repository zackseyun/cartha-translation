base_translation:
  language: en
  yaml_path: translation/ot/job/004/009.yaml
  text: By the breath of God they perish[c][b][a], and by the blast of his anger they come to an end.
translation:
  language: de
  text: Durch den Atem Gottes kommen sie um[a], und durch den Hauch seines Zorns vergehen sie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vom Atem Gottes kommen sie um.“ Die hebräische Präposition kann sowohl die Quelle als auch die Ursache beziehungsweise das Mittel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Hauch“ übersetzt das hebräische Wort, das auch „Wind“, „Atem“ oder „Geist“ bedeuten kann. „Vergehen sie“ kann auch mit „werden sie aufgerieben“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: durch den Atem
  rationale: נְשָׁמָה bezeichnet Atem oder Lebenshauch. Die Präposition מִן kann Quelle oder Ursache/Mittel angeben; „durch“ gibt hier im poetischen Zusammenhang die ursächliche beziehungsweise instrumentale Bedeutung natürlich wieder.
- source_word: אֱלוֹהַ
  choice: Gottes
  rationale: אֱלוֹהַ ist die besonders im Buch Hiob häufige poetische Singularform für „Gott“. Eine Erweiterung wie „der Allmächtige“ wäre im Hebräischen nicht ausgedrückt.
- source_word: יֹאבֵדוּ
  choice: kommen sie um
  rationale: אבד bedeutet hier „umkommen, zugrunde gehen“. „Kommen sie um“ wahrt die intransitive Aussage und klingt in modernem Deutsch natürlich.
- source_word: וּמֵרוּחַ
  choice: und durch den Hauch
  rationale: רוּחַ kann Wind, Atem, Hauch oder Geist bedeuten. Im Parallelismus mit נְשָׁמָה und in Verbindung mit Gottes Zorn bezeichnet es hier einen machtvollen, vernichtenden Hauch. „Hauch“ erhält das Bild, ohne die theologisch missverständliche Wiedergabe „Geist“ zu wählen.
- source_word: אַפּוֹ
  choice: seines Zorns
  rationale: אַף bedeutet wörtlich „Nase/Nasenloch“ und idiomatisch „Zorn“. Im vorliegenden Ausdruck vermittelt „Zorn“ den gemeinten Sinn klar; das körperhafte Bild des Ausatmens bleibt durch „Hauch“ erhalten.
- source_word: יִכְלוּ
  choice: nehmen sie ein Ende
  rationale: כלה im Qal kann „zu Ende gehen, aufhören, vergehen“ und je nach Kontext „aufgerieben werden“ bedeuten. „Nehmen sie ein Ende“ bewahrt die resultative Bedeutung und den poetischen Parallelismus.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Zorn
  choice: אַפּוֹ idiomatisch mit „seines Zorns“ wiedergeben und das Atembild durch „Hauch“ erhalten.
  alternative: „seiner Nase/seiner Nasenlöcher“ oder „seines Grimms“
  rationale: Die konkrete Vorstellung von Nase beziehungsweise schnaubendem Atem steht für Zorn. Eine rein wörtliche Wiedergabe würde den Sinn im Deutschen verdunkeln; „Zorn“ macht ihn verständlich, ohne über den hebräischen Text hinauszugehen.
- issue: Mehrdeutigkeit der Präposition מִן
  choice: Ursächlich beziehungsweise instrumental mit „durch“ übersetzen.
  alternative: „vom Atem Gottes … vom Hauch seines Zorns“
  rationale: מִן kann sowohl Quelle als auch Ursache oder Mittel bezeichnen. Der Kontext legt die verursachende Kraft nahe, schließt die Quellvorstellung aber nicht vollständig aus; diese bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper poetischer Parallelstruktur. „Atem“ und „Hauch“ unterscheiden die parallelen hebräischen Begriffe, während „Zorn“ das Idiom verständlich wiedergibt.
