  yaml_path: translation/ot/job/004/008.yaml
  text: As I have seen[b][a], those who plow iniquity and sow trouble reap it.
translation:
  language: de
  text: 'Wie ich gesehen habe: Wer Unrecht[a] pflügt und Unheil[b] sät, erntet es.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Bosheit“; das hebräische Wort kann moralisches Böses und in manchen Zusammenhängen auch das daraus erwachsende Unheil bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder „Mühsal“, „Elend“ oder „Leid“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Wie
  rationale: Leitet Elifas’ Berufung auf die eigene Beobachtung ein; „Wie ich gesehen habe“ bewahrt den vergleichenden beziehungsweise erfahrungsbezogenen Sinn.
- source_word: רָאִיתִי
  choice: ich gesehen habe
  rationale: Das Perfekt der ersten Person bezeichnet eine aus Erfahrung gewonnene Beobachtung; das deutsche Perfekt klingt hier natürlich und passt zum sprichwortartigen Zusammenhang.
- source_word: חֹרְשֵׁי
  choice: Wer … pflügt
  rationale: Das substantivisch gebrauchte Partizip wird als allgemeiner Relativsatz wiedergegeben und erhält das landwirtschaftliche Bild.
- source_word: אָוֶן
  choice: Unheil
  rationale: Das Wort kann moralisch verwerfliches Tun sowie das daraus entstehende Unheil bezeichnen. „Unheil“ bewahrt diese gewollte Bedeutungsweite, ohne den ethischen Bezug auszuschließen.
- source_word: וְזֹרְעֵי
  choice: und … sät
  rationale: Die koordinierte Partizipialkonstruktion setzt das Bild von Saat und Ernte fort; die Einzahl folgt der natürlichen deutschen Form mit dem allgemeinen „Wer“.
- source_word: עָמָל
  choice: Mühsal
  rationale: Das Wort bezeichnet Mühe, Elend oder leidbringende Not. „Mühsal“ unterscheidet es von אָוֶן und bewahrt zugleich seine negative Wirkung.
- source_word: יִקְצְרֻהוּ
  choice: erntet sie
  rationale: Das Verb mit maskulinem Singularsuffix greift das Gesäte beziehungsweise die zusammengehörige Unheilswirklichkeit auf. Das deutsche Pronomen „sie“ bezieht sich grammatisch auf „Mühsal“ und bewahrt das Saat-Ernte-Bild.
theological_decisions:
- issue: Moralischer Zusammenhang von Tun und Ergehen in Elifas’ Rede
  choice: Die Aussage wird ohne abschwächenden Zusatz als Elifas’ aus Erfahrung abgeleitete Regel wiedergegeben.
  alternative: Sie als absolute göttliche Vergeltungslehre zu verstärken oder ausdrücklich als bloße Tendenz abzuschwächen.
  rationale: Der Vers gehört zu Elifas’ Argumentation. Die Übersetzung soll deren Nachdruck erhalten, ohne sie vorweg zum abschließenden theologischen Urteil des Buches zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Wer-Konstruktion gibt den sprichwortartigen Charakter wieder; „pflügt – sät – erntet“ erhält die landwirtschaftliche Metapher und den Parallelismus.
