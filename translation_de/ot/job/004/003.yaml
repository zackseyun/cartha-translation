lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Der Aufmerksamkeitsmarker hebt die folgende Aussage hervor. „Sieh“ bewahrt die eindringliche, poetische Wirkung und klingt im modernen Deutschen natürlicher als „Siehe“.
- source_word: יִסַּרְתָּ
  choice: hast zurechtgewiesen
  rationale: Das Verb יסר umfasst Zucht, Korrektur und Unterweisung durch Korrektur. „Zurechtgewiesen“ hält diesen korrigierenden Grundton fest, ohne eine körperliche Bestrafung nahezulegen.
- source_word: רַבִּים
  choice: viele
  rationale: Die schlichte Mengenangabe wird im Deutschen unmittelbar und idiomatisch mit „viele“ wiedergegeben.
- source_word: יָדַיִם רָפוֹת
  choice: erschlaffte Hände
  rationale: Die körperliche Metapher für Kraftlosigkeit oder Mutlosigkeit bleibt erhalten. „Erschlaffte“ gibt רָפוֹת präziser wieder als das allgemeinere „schwache“.
- source_word: תְּחַזֵּק
  choice: gestärkt
  rationale: Das Piel von חזק bedeutet „stärken, stark machen“. Im Parallelismus mit dem vorangehenden Perfekt bezeichnet die Form rückblickend Jobs wiederholtes früheres Handeln; das deutsche Perfekt gibt dies natürlich wieder.
