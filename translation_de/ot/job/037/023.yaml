revisions:
- from: Den Allmächtigen können wir nicht ergründen[a]. Er ist groß an Kraft; Recht[b] und Gerechtigkeit in Fülle beugt er nicht[c].
  to: Den Allmächtigen können wir nicht ergründen[a]. Er ist groß an Kraft; Recht[b] und Gerechtigkeit in Fülle verletzt er nicht[c].
  rationale: Die Änderung ersetzt die im modernen Deutschen problematische Verbindung „Gerechtigkeit ... beugen“ durch „Recht und Gerechtigkeit ... verletzt“. Sie bewahrt die wahrscheinlichste syntaktische Möglichkeit, wonach die vorangestellten Begriffe die Objekte des Schlussverbs sind, und glättet weder die textliche Spannung noch die alternative absolute Auffassung. Die Fußnotenmarker bleiben unmittelbar an den jeweiligen Bezugseinheiten.
