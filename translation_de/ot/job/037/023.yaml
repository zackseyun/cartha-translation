  text: שַׁדַּ֣י לֹֽא מְ֭צָאנֻ/הוּ שַׂגִּיא כֹ֑חַ וּ/מִשְׁפָּ֥ט וְ/רֹב צְ֝דָקָ֗ה לֹ֣א יְעַנֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/023.yaml
  text: The Almighty—we cannot find him out—great in power[c][b][a]; and justice and abundant righteousness he does not afflict.
translation:
  language: de
  text: Den Allmächtigen können wir nicht ergründen[a]. Er ist groß an Kraft; Recht[b] und Gerechtigkeit in Fülle verletzt er nicht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „können wir nicht finden“ beziehungsweise „können wir nicht erreichen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gericht“.'
    reason: lexical_alternative
  - marker: c
    text: 'Das Verb bedeutet nach der masoretischen Vokalisierung „bedrücken“ oder „demütigen“; „verletzt“ gibt es hier mit „Recht und Gerechtigkeit“ als Bezug wieder. Auch eine absolute Wiedergabe ist möglich: „Er bedrückt nicht.“ Manche verstehen das Verb als „er antwortet nicht“.'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Die geläufige deutsche Wiedergabe des Gottesnamens bzw. Titels vermittelt seine Bedeutung verständlicher als eine bloße Umschrift „Schaddai“.
- source_word: לֹא מְצָאנֻהוּ
  choice: können wir nicht ergründen
  rationale: מצא bedeutet wörtlich „finden“; im Zusammenhang mit Gottes Unzugänglichkeit bezeichnet die Wendung das Nicht-Erreichen bzw. Nicht-Ergründen. „Ergründen“ ist im Deutschen natürlich und bewahrt diesen Sinn.
- source_word: שַׂגִּיא כֹחַ
  choice: groß an Kraft
  rationale: Die knappe Formulierung bildet die hebräische Verbindung von Größe und Kraft eng und verständlich ab.
- source_word: וּמִשְׁפָּט
  choice: Recht
  rationale: מִשְׁפָּט kann „Recht“, „Gerechtigkeit“ oder „Gericht“ bezeichnen. Neben צְדָקָה vermeidet „Recht“ eine unnötige Doppelung und bewahrt die rechtliche Dimension.
- source_word: וְרֹב צְדָקָה
  choice: Gerechtigkeit in Fülle
  rationale: רֹב bezeichnet Fülle oder große Menge; die Formulierung erhält sowohl die substantivische Aussage als auch ihre Intensivierung.
- source_word: לֹא יְעַנֶּה
  choice: beugt er nicht
  rationale: Die masoretische Vokalisierung weist auf das Piel von ענה („bedrücken, demütigen“) und nicht auf „antworten“. Auf „Recht und Gerechtigkeit“ bezogen gibt „beugen“ den Gedanken wieder, dass Gott sie nicht bedrückt bzw. verletzt, ohne die syntaktische Mehrdeutigkeit völlig zu verdecken.
theological_decisions:
- issue: Bezug und Bedeutung des Schlussglieds לֹא יְעַנֶּה
  choice: „Recht und Gerechtigkeit in Fülle beugt er nicht“
  alternative: „Er bedrückt nicht“ bzw. nach anderer Ableitung „er antwortet nicht“
  rationale: Die masoretische Piel-Form stützt „bedrücken/demütigen“. Die vorangestellten Begriffe „Recht“ und „Gerechtigkeit“ können als Objekte verstanden werden; daher bewahrt „beugt er nicht“ die auffällige hebräische Wortfolge und vermeidet die Ergänzung eines nicht ausdrücklich genannten menschlichen Objekts. Die alternative Deutung wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz schafft natürliche deutsche Syntax; der zweite bewahrt durch die Voranstellung von „Recht und Gerechtigkeit“ die markierte Struktur und Spannung des Hebräischen. Sämtliche Fußnotenmarker stehen unmittelbar bei der betreffenden Wendung.
