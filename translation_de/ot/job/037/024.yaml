  yaml_path: translation/ot/job/037/024.yaml
  text: Therefore men fear him[a]; he does not regard any who are wise of heart.
translation:
  language: de
  text: Darum fürchten ihn die Menschen; er beachtet[a] keinen, der weisen Herzens ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich in hebräischer Wortstellung: »Er sieht alle Weisen des Herzens nicht.« Das Verb kann »sehen« oder im übertragenen Sinn »ansehen, beachten« bedeuten. Die Verbindung von Verneinung und »alle« wird gewöhnlich im Sinn von »keinen« verstanden, kann aber formal auch die Frage nach dem Umfang der Verneinung offenlassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Schlussfolgerung aus der vorausgehenden Darstellung von Gottes Größe und wirkt im Deutschen zugleich natürlich und würdig.
- source_word: יְרֵאוּהוּ
  choice: fürchten ihn
  rationale: Gibt die Grundbedeutung von ירא direkt wieder und bewahrt das Bedeutungsspektrum von Furcht, Ehrfurcht und Scheu vor Gottes Majestät.
- source_word: אֲנָשִׁים
  choice: die Menschen
  rationale: Die Pluralform bezeichnet hier Menschen allgemein; der bestimmte Artikel ist im generischen deutschen Ausdruck idiomatisch, ohne den Personenkreis einzuschränken.
- source_word: לֹא יִרְאֶה
  choice: er achtet keinen
  rationale: ראה bedeutet wörtlich „sehen“, kann im Zusammenhang aber auch „ansehen, beachten, achten“ ausdrücken. „Er achtet keinen“ vermittelt den naheliegenden Sinn, ohne die wörtliche Alternative zu verschweigen.
- source_word: כָּל
  choice: keinen
  rationale: Unter der Verneinung wird כָּל mit der folgenden Personenbezeichnung im Deutschen idiomatisch distributiv als „keinen“ wiedergegeben.
- source_word: חַכְמֵי לֵב
  choice: der weisen Herzens ist
  rationale: Bewahrt das hebräische Herz-Motiv und vermeidet den nicht ausdrücklich vorhandenen Zusatz „in den eigenen Augen“; die leicht gehobene Form passt zum poetischen Register.
theological_decisions:
- issue: Gottes Nichtbeachtung der Weisen des Herzens
  choice: Gott achtet keinen, der weisen Herzens ist.
  alternative: Er sieht nicht alle, die weisen Herzens sind.
  rationale: Das implizite Subjekt ist im Zusammenhang am natürlichsten Gott. Die Wiedergabe „achtet“ nimmt den möglichen idiomatischen Sinn von ראה auf, während die Fußnote die wörtlichere Lesart und damit die Spannung gegenüber menschlicher Weisheit offenhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. „Weisen Herzens“ erhält bewusst die hebräische Metapher; die Satzstellung bleibt klar und lesbar.
