  text: At this also my heart trembles and leaps from its place[a][b].
translation:
  language: de
  text: Auch darüber erbebt mein Herz und springt von seiner Stelle auf[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zittert“; das hebräische Verb kann ein Beben aus Angst, Ehrfurcht oder Erregung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „springt aus seiner Stelle“; das hebräische Bild stellt das Herz so dar, als werde es plötzlich von seinem Platz gerissen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לְזֹאת
  choice: Auch darüber
  rationale: אַף verstärkt beziehungsweise verbindet die Aussage, während לְזֹאת auf das zuvor geschilderte Geschehen verweist. „Auch darüber“ gibt diesen Rückbezug in natürlichem Deutsch wieder, ohne ihn enger als nötig kausal festzulegen.
- source_word: יֶחֱרַד
  choice: erbebt
  rationale: חרד bezeichnet ein Beben oder Zittern aus Furcht, Ehrfurcht oder innerer Erregung. „Erbebt“ bewahrt die Intensität, ohne ausschließlich Angst zu unterstellen.
- source_word: לִבִּי
  choice: mein Herz
  rationale: Die konkrete Körper- und Innenmetapher des Hebräischen bleibt erhalten; eine Auflösung zu „ich“ oder „mein Inneres“ wäre weniger bildhaft.
- source_word: וְיִתַּר
  choice: und springt … auf
  rationale: Die schwierige Verbform schildert hier offenbar eine heftige, plötzliche Bewegung. „Springt … auf“ bewahrt das lebendige Bild und verbindet sich im Deutschen natürlich mit „von seiner Stelle“.
- source_word: מִמְּקוֹמוֹ
  choice: von seiner Stelle
  rationale: Das Suffix bezieht sich auf das Herz. „Von seiner Stelle“ bildet die räumliche Metapher eng und idiomatisch ab.
