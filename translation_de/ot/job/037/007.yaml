  text: בְּ/יַד כָּל אָדָ֥ם יַחְתּ֑וֹם לָ֝/דַ֗עַת כָּל אַנְשֵׁ֥י מַעֲשֵֽׂ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/007.yaml
  text: He seals the hand of every man[b][a], so that all men may know his work.
translation:
  language: de
  text: Er versiegelt die Hand jedes Menschen[a], damit alle Menschen sein Werk erkennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er verschließt die Hand jedes Menschen.“ Gemeint ist wahrscheinlich, dass Gott die gewöhnliche menschliche Arbeit zum Stillstand bringt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: die Hand
  rationale: Die Verbindung mit חתם wird im Deutschen idiomatisch als direktes Objekt wiedergegeben. Die ungewöhnliche Metapher bleibt erhalten.
- source_word: כָּל אָדָם
  choice: jedes Menschen
  rationale: אָדָם ist hier generisch gebraucht. „Jedes Menschen“ gibt den umfassenden Bezug natürlich und geschlechtsübergreifend wieder.
- source_word: יַחְתּוֹם
  choice: er versiegelt
  rationale: Das Qal von חתם bedeutet „versiegeln“. Die knappe Wiedergabe bewahrt das Bild, ohne dessen genaue Wirkung vorschnell auszudeuten.
- source_word: לָדַעַת
  choice: damit ... erkennen
  rationale: Der Infinitiv mit ל bezeichnet hier Zweck oder Folge. „Damit“ drückt diese Beziehung natürlich aus; „erkennen“ passt zum Wahrnehmen von Gottes Wirken.
- source_word: כָּל אַנְשֵׁי
  choice: alle Menschen
  rationale: Die maskuline Pluralform ist generisch; „alle Menschen“ gibt den umfassenden Sinn im modernen Deutschen angemessen wieder.
- source_word: מַעֲשֵׂהוּ
  choice: sein Werk
  rationale: Der Singular mit Suffix wird eng am Hebräischen wiedergegeben. Im Kontext bezeichnet er Gottes Wirken, ohne es auf eine einzelne Tat festzulegen.
theological_decisions:
- issue: Bezugswort der dritten Person Singular in „er versiegelt“ und „sein Werk“
  choice: Subjekt und Possessivpronomen beziehen sich auf Gott.
  alternative: Ein unpersönliches Subjekt oder das winterliche Unwetter als handelnde Größe.
  rationale: Im Zusammenhang von Elihus Rede über Gottes Herrschaft über Wetter und Schöpfung ist Gott der nächstliegende und kohärenteste Bezug.
- issue: Sinn des Versiegelns der Hand
  choice: Die Metapher bleibt im Haupttext unaufgelöst.
  alternative: Explizit formulieren, dass Gott die menschliche Arbeit zum Stillstand bringt.
  rationale: Der Kontext legt das Einstellen gewöhnlicher Arbeit nahe, doch die hebräische Wendung ist bildhaft und schwierig. Die Fußnote erklärt die wahrscheinliche Bedeutung, ohne sie in den Text hineinzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwierige hebräische Metapher wird formal bewahrt und durch eine knappe Fußnote erschlossen; generische Personenbezeichnungen werden inklusiv als „Mensch/Menschen“ wiedergegeben.
