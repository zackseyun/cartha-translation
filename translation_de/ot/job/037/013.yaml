  text: אִם לְ/שֵׁ֥בֶט אִם לְ/אַרְצ֑/וֹ אִם לְ֝/חֶ֗סֶד יַמְצִאֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/013.yaml
  text: Whether for correction[a], or for his land, or for steadfast love[c][b], he causes it to happen.
translation:
  language: de
  text: Sei es zur Zurechtweisung[a], sei es für sein Land, sei es, um Güte zu erweisen[b] – er lässt es kommen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „für eine Rute“; gemeint kann Strafe oder erziehende Züchtigung sein.
    reason: lexical_alternative
  - marker: b
    text: Oder „um beständige Liebe zu erweisen“, „aus Erbarmen“ oder „aus Freundlichkeit“.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb kann auch mit „er führt es herbei“ oder „er bewirkt es“ wiedergegeben werden. Das „es“ bezieht sich auf die Wettererscheinung im Zusammenhang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: sei es
  rationale: Das dreimalige אִם führt hier keine gewöhnlichen Bedingungssätze ein, sondern nennt alternative Zwecke beziehungsweise Wirkungen. Die wiederholte Wendung „sei es“ bildet diese Struktur im Deutschen natürlich ab.
- source_word: לְשֵׁבֶט
  choice: zur Zurechtweisung
  rationale: שֵׁבֶט bezeichnet wörtlich einen Stock oder eine Rute und steht hier metonymisch für strafende beziehungsweise erziehende Züchtigung. „Zurechtweisung“ wahrt diese Spannweite, ohne ausschließlich harte Bestrafung auszudrücken.
- source_word: לְאַרְצוֹ
  choice: für sein Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Mit dem Suffix der 3. Person Singular passt „sein Land“ hier am besten zum Kontext von Gottes Herrschaft über die Wettererscheinungen.
- source_word: לְחֶסֶד
  choice: zur Güte
  rationale: חֶסֶד umfasst Güte, Erbarmen und beständige, loyale Zuwendung. „Güte“ ist in diesem nicht ausdrücklich bundestheologischen Zusammenhang verständlich und lässt die breitere Bedeutung offen.
- source_word: יַמְצִאֵהוּ
  choice: er lässt es eintreffen
  rationale: 'Die Hifil-Form von מצא hat hier kausativen Sinn: Gott bewirkt, dass die zuvor genannte Wettererscheinung eintrifft beziehungsweise ihr Ziel erreicht. Das unbestimmte „es“ bewahrt den nur aus dem Kontext erschließbaren Bezug des hebräischen Objektsuffixes.'
theological_decisions:
- issue: Gottes Absicht in den drei mit אִם eingeleiteten Wendungen
  choice: 'Der Vers nennt alternative Zwecke oder Wirkungen des von Gott gelenkten Wettergeschehens: Zurechtweisung, Versorgung seines Landes oder Güte.'
  alternative: Die Wendungen könnten primär Ziele beziehungsweise Bestimmungsorte bezeichnen; שֵׁבֶט könnte enger als Strafgericht verstanden werden.
  rationale: Der Zusammenhang beschreibt Gottes Lenkung der Wolken. Die dreifache Konstruktion mit לְ lässt Zweck beziehungsweise Wirkung erkennen, ohne die erste Möglichkeit auf reines Strafgericht oder die letzte auf eine bestimmte dogmatische Kategorie zu verengen.
- issue: Bedeutung von חֶסֶד
  choice: „Güte“ bewahrt Gottes wohlwollendes Handeln, ohne den Begriff ausschließlich auf einen ausdrücklich genannten Bund zu beziehen.
  alternative: „Beständige Liebe“, „Erbarmen“ oder „Bundestreue“.
  rationale: חֶסֶד ist theologisch gehaltvoll, doch der unmittelbare Zusammenhang nennt keinen Bund. Die Übersetzung soll die positive göttliche Zuwendung ausdrücken und zugleich eine konfessionelle Überbestimmung vermeiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Alternativstruktur des Hebräischen wird durch „sei es … sei es … oder“ hörbar gemacht. Der Gedankenstrich trennt die aufgezählten Zwecke von der abschließenden göttlichen Handlung. Die Pronomenreferenz bleibt entsprechend dem Hebräischen kontextabhängig.
