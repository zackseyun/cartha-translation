  yaml_path: translation/ot/job/037/003.yaml
  text: Under all the heavens he sends it out[b][a], and his lightning to the ends of the earth.
translation:
  language: de
  text: Unter dem ganzen Himmel lässt er ihn erschallen und sein Licht bis an die Enden der Erde reichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und sein Licht über den Flügeln der Erde“. Im Zusammenhang ist mit dem Licht wahrscheinlich der Blitz gemeint; die „Flügel der Erde“ bezeichnen ihre äußersten Ränder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: unter dem ganzen Himmel
  rationale: Bewahrt die räumliche Bildsprache von תַּחַת und gibt den hebräischen Sammelplural שָׁמַיִם im natürlichen deutschen Singular wieder.
- source_word: יִשְׁרֵהוּ
  choice: lässt er es los
  rationale: Die seltene Verbform bezeichnet hier wahrscheinlich das Aussenden oder Loslassen; das pronominale Objekt bleibt wie im Hebräischen unbestimmt.
- source_word: וְאוֹרוֹ
  choice: und sein Licht
  rationale: אוֹר bedeutet wörtlich „Licht“ und meint im Sturmzusammenhang wahrscheinlich den Blitz. Die Übersetzung bewahrt die lexikalische Offenheit, ohne den Bezug stillschweigend festzulegen.
- source_word: עַל כַּנְפוֹת הָאָרֶץ
  choice: reicht bis zu den Enden der Erde
  rationale: כַּנְפוֹת heißt wörtlich „Flügel“ und bezeichnet hier bildhaft die äußersten Ränder der Erde; „Enden“ vermittelt den idiomatischen Sinn in verständlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch. „Sein Licht“ erhält die Bildsprache und Mehrdeutigkeit des Hebräischen; die Fußnote erläutert sowohl den wahrscheinlichen Blitzbezug als auch das wörtliche Bild der „Flügel der Erde“.
