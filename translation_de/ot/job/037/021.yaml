revisions:
- from: Und nun sehen sie das Licht nicht[a], obwohl es hell in den Himmelsweiten strahlt[b]; doch ein Wind zieht vorüber und klärt sie auf.
  to: Und nun sehen sie das Licht nicht[a], obwohl es hell in den Himmelsweiten ist[b]; doch ein Wind zieht vorüber und reinigt sie.
  rationale: Die Revision ersetzt die im Deutschen missverständliche und inhaltlich falsche Wendung „klärt sie auf“ durch „reinigt sie“, eine poetisch angemessene Wiedergabe von טהר („rein machen, klären“). Zugleich wird die zusätzliche Aussage „strahlt“ entfernt. Die Ambiguität der knappen hebräischen Verknüpfung und des pluralischen Objektbezugs bleibt in den Fußnoten erhalten.
