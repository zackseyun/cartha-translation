  text: וְ/עַתָּ֤ה לֹ֘א רָ֤אוּ א֗וֹר בָּהִ֣יר ה֭וּא בַּ/שְּׁחָקִ֑ים וְ/ר֥וּחַ עָ֝בְרָ֗ה וַֽ/תְּטַהֲרֵֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/021.yaml
  text: And now they do not see the light[a], bright though it is in the skies[b]; but a wind passes by and clears them.
translation:
  language: de
  text: Und nun sehen sie das Licht nicht[a], obwohl es hell in den Himmelsweiten ist[b]; doch ein Wind zieht vorüber und reinigt sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und nun haben sie das Licht nicht gesehen; hell ist es in den Himmelsweiten.« Die knappe hebräische Satzfolge muss nicht konzessiv verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Das Objekt in »reinigt sie« steht im Hebräischen im Plural und bezieht sich wahrscheinlich auf die Himmelsweiten oder Wolken. Sinngemäß kann auch gemeint sein: »klärt den Himmel auf«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Funktion von וְ als auch den zeitlich-diskursiven Hinweis עַתָּה in natürlichem, gehobenem Deutsch.
- source_word: לֹא רָאוּ
  choice: sehen sie … nicht
  rationale: Das Perfekt der 3. Person Plural kann hier eine gegenwärtige bzw. allgemein beobachtete Lage ausdrücken. Die Pluralform bleibt erhalten, ohne ein ausdrückliches Subjekt wie »die Menschen« einzuführen.
- source_word: אוֹר
  choice: das Licht
  rationale: Das allgemeine Wort »Licht« entspricht dem Hebräischen genauer als die deutendere Wiedergabe »Sonnenlicht«.
- source_word: בָּהִיר הוּא
  choice: obwohl es hell … strahlt
  rationale: Gibt die Helligkeit des vorhandenen, aber nicht sichtbaren Lichts in natürlichem Deutsch wieder. Die konzessive Verknüpfung ist kontextuell plausibel, wird wegen der knappen hebräischen Satzfolge jedoch in einer Fußnote als nicht zwingend ausgewiesen.
- source_word: בַּשְּׁחָקִים
  choice: in den Himmelsweiten
  rationale: שְׁחָקִים kann die Höhen des Himmels beziehungsweise die Wolkenregion bezeichnen. »Himmelsweiten« wahrt den poetischen Ton und zugleich den Plural, der als Bezug des späteren Suffixes infrage kommt.
- source_word: וְרוּחַ
  choice: doch ein Wind
  rationale: רוּחַ bezeichnet hier meteorologischen Wind. Der unbestimmte Artikel vermeidet eine im Hebräischen nicht ausdrücklich markierte Bestimmtheit; »doch« verdeutlicht den Umschwung der Wetterlage.
- source_word: עָבְרָה
  choice: zieht vorüber
  rationale: Gibt die Bewegung des Windes anschaulich und im gegenwärtigen Beobachtungsrahmen wieder.
- source_word: וַתְּטַהֲרֵם
  choice: und klärt sie auf
  rationale: טהר bedeutet hier, klar oder rein zu machen. Das pluralische Objektsuffix wird mit »sie« bewahrt und kann auf die Himmelsweiten beziehungsweise Wolken bezogen werden.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdig-poetischem Ton. Die ungewöhnliche Mehrzahl »Himmelsweiten« dient zugleich dazu, den Numerus des hebräischen Bezugsworts und des pluralischen Objektsuffixes sichtbar zu halten.
