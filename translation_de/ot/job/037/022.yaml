  text: מִ֭/צָּפוֹן זָהָ֣ב יֶֽאֱתֶ֑ה עַל אֱ֝ל֗וֹהַּ נ֣וֹרָא הֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/022.yaml
  text: From the north comes golden splendor; around God is awesome majesty.
translation:
  language: de
  text: Aus dem Norden kommt goldener Glanz[a]; über Gott ist Ehrfurcht gebietende Majestät.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Gold.'
    reason: Bewahrt die lexikalische Konkretheit und die Bildmehrdeutigkeit von זָהָב, während der Haupttext den im Kontext möglichen goldenen Lichtglanz ausdrückt.
lexical_decisions:
- source_word: זָהָב (zahav)
  choice: goldener Glanz
  rationale: Das Substantiv bedeutet wörtlich „Gold“, bezeichnet hier im Zusammenhang mit dem herannahenden Wetterphänomen aber wahrscheinlich einen goldartigen Lichtglanz. Die Fußnote bewahrt die konkrete hebräische Formulierung.
- source_word: יֶאֱתֶה (yeʾeteh)
  choice: kommt
  rationale: Gibt die einfache Bewegungsbedeutung des Verbs natürlich und unmittelbar wieder.
- source_word: נוֹרָא (noraʾ)
  choice: Ehrfurcht gebietende
  rationale: Bewahrt den Sinn von etwas Furcht- und Ehrfurchterregendem, ohne die Wendung auf bloßen Schrecken zu verengen.
- source_word: הוֹד (hod)
  choice: Majestät
  rationale: Trifft die Bedeutung von Hoheit, Pracht und majestätischer Herrlichkeit in diesem Gottesprädikat.
- source_word: עַל (ʿal)
  choice: umgibt
  rationale: Die Grundbedeutung ist „auf/über“, doch räumlich bei Gott und seiner Majestät ergibt „umgibt“ im Deutschen einen natürlichen und kontextuell plausiblen Sinn, ohne eine materielle Auflage über Gott anzudeuten.
theological_decisions:
- issue: Räumliches Verhältnis der Ehrfurcht gebietenden Majestät zu Gott
  choice: Gott umgibt Ehrfurcht gebietende Majestät
  alternative: Über Gott liegt Ehrfurcht gebietende Majestät
  rationale: Die gewählte Fassung versteht עַל räumlich im Sinn von „um/bei“ und wahrt, dass Majestät Gottes Erscheinung kennzeichnet. Die formalere Alternative ist im Deutschen missverständlich und könnte den Eindruck erwecken, die Majestät stehe als etwas Äußeres über Gott.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Zweiteilung des hebräischen Verses bleibt erhalten; „Ehrfurcht gebietend“ vermittelt sowohl Furcht als auch ehrfürchtiges Staunen.
