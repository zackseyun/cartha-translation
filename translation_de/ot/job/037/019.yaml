  text: ה֭וֹדִיעֵ/נוּ מַה נֹּ֣אמַר ל֑/וֹ לֹ֥א נַ֝עֲרֹ֗ךְ מִ/פְּנֵי חֹֽשֶׁךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/019.yaml
  text: Teach us what we should say to him[b][a]; we cannot arrange our words because of darkness.
translation:
  language: de
  text: Lehre uns, was wir ihm sagen sollen; wir können wegen der Dunkelheit unsere Worte nicht ordnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir können unsere Rede nicht zurechtlegen“ oder „unseren Fall nicht geordnet darlegen“. „Dunkelheit“ kann bildlich menschliche Unwissenheit oder Unfähigkeit bezeichnen; auch ein wörtlicher Sinn ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנוּ
  choice: Lehre uns
  rationale: Der Hifil-Imperativ von ידע bedeutet „lass uns wissen“ bzw. „mach uns bekannt“. Im Zusammenhang ist „Lehre uns“ natürlich und bewahrt den Sinn einer erbetenen Unterweisung.
- source_word: מַה נֹּאמַר לוֹ
  choice: was wir ihm sagen sollen
  rationale: Die Formulierung gibt die deliberative Frage idiomatisch wieder, ohne festzulegen, ob Möglichkeit, Pflicht oder bevorstehendes Sprechen im Vordergrund steht.
- source_word: לֹא נַעֲרֹךְ
  choice: wir können … unsere Worte nicht ordnen
  rationale: ערך bedeutet grundlegend „ordnen, in eine Reihe bringen, zurechtlegen“. „Unsere Worte ordnen“ macht den im Hebräischen nicht ausdrücklich genannten, aber kontextuell naheliegenden Gegenstand kenntlich und vermeidet die stärker juristische Festlegung „unseren Fall darlegen“.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: wegen der Dunkelheit
  rationale: מִפְּנֵי bezeichnet hier plausibel den Grund. „Dunkelheit“ bewahrt die knappe Bildsprache und lässt offen, ob wörtliche Finsternis, Unwissenheit oder menschliches Unvermögen gemeint ist.
theological_decisions:
- issue: Bedeutung der „Dunkelheit“ im Schlusssatz
  choice: Das breite Bild „Dunkelheit“ bleibt unaufgelöst.
  alternative: „wegen unserer Unwissenheit“ oder „weil es dunkel ist“
  rationale: Der hebräische Text bestimmt nicht ausdrücklich, ob die Dunkelheit wörtlich oder bildlich zu verstehen ist. Eine erklärende Übersetzung würde die echte Mehrdeutigkeit und die mögliche Aussage über menschliches Unvermögen gegenüber Gott einengen.
- issue: Gerichtliche Bedeutung von ערך
  choice: „unsere Worte ordnen“
  alternative: „unseren Fall darlegen“
  rationale: Eine gerichtliche Färbung ist im Kontext möglich, aber im Verb selbst nicht zwingend. Die gewählte Formulierung hält sowohl geordnetes Reden als auch das Zurechtlegen eines Anliegens offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und poetisch. Das ergänzte „unsere Worte“ verdeutlicht den im Kontext vorausgesetzten Gegenstand des Verbs, während die Fußnote die wörtlichere und die mögliche gerichtliche Lesart dokumentiert.
