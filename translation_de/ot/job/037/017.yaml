  text: you whose garments are hot when the earth is still because of the south wind?[a]
translation:
  language: de
  text: Du, dessen Kleider heiß sind, wenn die Erde vom Süden her still wird?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn die Erde wegen des Südwinds still wird«. Wörtlich steht im Hebräischen »vom Süden«; dies kann allgemein die südliche Himmelsrichtung bezeichnen. »Südwind« macht den meteorologischen Zusammenhang ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: du, dessen
  rationale: Die Relativpartikel führt im Zusammenhang Elihus direkte Anrede an Hiob fort. „du, dessen“ gibt diese Beziehung im Deutschen natürlich wieder.
- source_word: בְּגָדֶיךָ
  choice: deine Kleider
  rationale: בגד bezeichnet Kleidung beziehungsweise ein Kleidungsstück. „Kleider“ ist verständlich und wahrt den poetisch-gehobenen Ton.
- source_word: חַמִּים
  choice: heiß werden
  rationale: Das Adjektiv bedeutet „heiß/warm“. Im Deutschen drückt „heiß werden“ idiomatisch aus, dass die Kleidung unter diesen Wetterbedingungen heiß wird.
- source_word: בְּהַשְׁקִט
  choice: wenn ... still daliegt
  rationale: Die Konstruktion mit ב ist temporal; שקט bezeichnet Ruhe oder Ungestörtheit. „still daliegt“ passt natürlich zur windstill wirkenden Erde beziehungsweise Landschaft.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Der weitere meteorologische Zusammenhang lässt die umfassendere Wiedergabe „Erde“ zu.
- source_word: מִדָּרוֹם
  choice: wegen des Südwinds
  rationale: דָּרוֹם bezeichnet den Süden beziehungsweise die südliche Himmelsrichtung. Im meteorologischen Zusammenhang macht „Südwind“ den wahrscheinlich gemeinten heißen Wind ausdrücklich; מן wird dabei kausal verstanden. Die wörtlichere Alternative bleibt in der Fußnote erhalten.
