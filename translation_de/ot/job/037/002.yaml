  text: Listen carefully[a] to the trembling of his voice[b], and the rumbling that comes out from his mouth.
translation:
  language: de
  text: Hört aufmerksam[a] dem Beben seiner Stimme[b] zu und dem Grollen[c], das aus seinem Mund kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Hört, ja hört“. Die hebräische Ausdrucksweise verstärkt die Aufforderung.'
    reason: lexical_alternative
  - marker: b
    text: Für „Beben“ sind auch „Erregung“ oder „Toben“ möglich.
    reason: lexical_alternative
  - marker: c
    text: „Grollen“ kann auch „Murmeln“ oder allgemeiner „Laut“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Hört aufmerksam
  rationale: Die Verbindung aus Imperativ und Infinitivus absolutus verstärkt die Aufforderung. „Hört aufmerksam“ gibt diese Nachdrücklichkeit in natürlichem modernem Deutsch wieder.
- source_word: בְּרֹגֶז
  choice: auf das Beben
  rationale: רֹגֶז kann Beben, Erregung oder Toben bezeichnen. Im Zusammenhang des Gewitters bewahrt „Beben“ die erschütternde Klangwirkung, ohne den Ausdruck eindeutig als Zorn zu deuten.
- source_word: קֹלוֹ
  choice: seiner Stimme
  rationale: קוֹל bedeutet „Stimme“ oder „Schall“. Wegen der anschließenden Rede von Gottes Mund bleibt mit „Stimme“ das personifizierende poetische Bild erhalten.
- source_word: וְהֶגֶה
  choice: das Grollen
  rationale: הֶגֶה bezeichnet einen tiefen Laut, ein Murmeln oder Dröhnen. „Grollen“ passt zum Klang des Donners und wahrt zugleich den Unterschied zu „Stimme“.
- source_word: מִפִּיו יֵצֵא
  choice: das aus seinem Mund kommt
  rationale: Die konkrete Wendung wird natürlich und quellennah wiedergegeben; die anthropomorphe Bildsprache bleibt erhalten.
theological_decisions:
- issue: Anthropomorphe Rede von Gott im Gewitterbild
  choice: „seiner Stimme“ und „aus seinem Mund“ beibehalten
  alternative: Die Ausdrücke als „dessen Schall“ oder ausdrücklich als „Donner“ entpersonalisieren
  rationale: Der hebräische Vers stellt den Gewitterlaut poetisch als Gottes eigene Äußerung dar. Die Beibehaltung wahrt die literarische und theologische Spannung des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Aufforderung wird idiomatisch wiedergegeben; die konkrete und anthropomorphe Gewitterbildsprache bleibt erhalten.
