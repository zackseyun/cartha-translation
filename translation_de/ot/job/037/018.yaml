source:
  edition: WLC
  text: תַּרְקִ֣יעַ עִ֭מּ/וֹ לִ/שְׁחָקִ֑ים חֲ֝זָקִ֗ים כִּ/רְאִ֥י מוּצָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/018.yaml
  text: Can you[a], with him, spread out the skies[c][b], hard as a cast metal mirror?
translation:
  language: de
  text: Kannst du mit ihm die Himmelsweiten[a] ausbreiten[b], so fest wie ein gegossener Metallspiegel[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „den Himmel“ beziehungsweise „die Wolken“. Das poetische hebräische Wort kann den Himmel, die Himmelsräume und in manchen Zusammenhängen auch Wolken bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder „aushämmern“ beziehungsweise „ausspannen“. Das hebräische Verb kann sowohl das Ausbreiten als auch das flache Hämmern von Metall bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „wie ein gegossener Spiegel“. Spiegel bestanden damals aus gegossenem und poliertem Metall; der Vergleich stellt den Himmel als fest und glänzend dar.'
    reason: cultural_note
lexical_decisions:
- source_word: תַּרְקִיעַ
  choice: ausbreiten
  rationale: Das Hifil von רקע bezeichnet das Ausbreiten oder flache Aushämmern, besonders von Metall. „Ausbreiten“ ist im Deutschen natürlich und lässt durch den Vergleich mit dem Metallspiegel zugleich das handwerkliche Bild anklingen.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: Der hebräische Text verwendet ein Pronomen. Obwohl im Zusammenhang Gott gemeint ist, wird die Formulierung nicht erklärend zu „mit Gott“ erweitert.
- source_word: לִשְׁחָקִים
  choice: die Himmelsweiten
  rationale: שׁחקים ist eine poetische Pluralbezeichnung für Himmel beziehungsweise Himmelsräume und kann je nach Zusammenhang auch Wolken meinen. „Himmelsweiten“ bewahrt den poetischen Plural und passt zum Bild der ausgespannten sichtbaren Himmelsfläche.
- source_word: חֲזָקִים
  choice: fest
  rationale: חזק beschreibt hier die Festigkeit oder Härte der Himmelsweiten. „Fest“ klingt im Deutschen natürlicher als „stark“ und bewahrt die Vorstellung von massiver Metallarbeit.
- source_word: כִּרְאִי
  choice: wie einen … Spiegel
  rationale: רְאִי bezeichnet einen Spiegel; die Präposition כ־ führt den Vergleich ein.
- source_word: מוּצָק
  choice: gegossenen Metallspiegel
  rationale: מוּצָק bezeichnet etwas Gegossenes, besonders gegossenes Metall. „Metallspiegel“ macht das antike Bild verständlich, ohne das Material ungesichert als Bronze zu bestimmen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Bildkraft. „Himmelsweiten“ wahrt den hebräischen Plural, während die Fußnote die Bedeutungsbreite offenhält. Die Frageform und das Pronomen „ihm“ bleiben entsprechend dem Ausgangstext bestehen.
