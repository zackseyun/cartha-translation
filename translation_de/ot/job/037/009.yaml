  text: מִן הַ֭/חֶדֶר תָּב֣וֹא סוּפָ֑ה וּֽ/מִ/מְּזָרִ֥ים קָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/009.yaml
  text: From its chamber comes the storm[b][a], and from the scattering winds comes cold.
translation:
  language: de
  text: Aus der Kammer kommt der Sturm[a], und von den zerstreuenden Winden kommt die Kälte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus dem Süden kommt der Sturm.“ Wörtlich steht im Hebräischen „aus der Kammer“; dies kann poetisch eine südliche Himmelsgegend oder einen verborgenen Vorratsraum bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „und aus dem Norden kommt die Kälte“. Das hebräische Wort ist selten und seine genaue Bedeutung unsicher; es kann sich auf zerstreuende Winde beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַחֶדֶר
  choice: Aus der Kammer
  rationale: חֶדֶר bedeutet wörtlich „Zimmer, Kammer, innerer Raum“. Im poetischen Zusammenhang kann damit der verborgene Ursprungsort oder eine Himmelsgegend des Sturms gemeint sein. Die wörtliche Bildsprache bleibt im Haupttext erhalten; die mögliche Deutung als Süden steht in der Fußnote.
- source_word: תָּבוֹא
  choice: kommt
  rationale: בוא bedeutet gewöhnlich „kommen, eintreten, ankommen“. „Kommt“ gibt die unmittelbare Bewegung des poetischen Bildes natürlich wieder.
- source_word: סוּפָה
  choice: der Sturm
  rationale: סוּפָה bezeichnet einen heftigen Sturm, Wirbelsturm oder Unwettersturm. „Sturm“ ist im Deutschen natürlich und legt die genaue Art des Wetterereignisses nicht unnötig fest.
- source_word: וּמִמְּזָרִים
  choice: und von den zerstreuenden Winden
  rationale: מְזָרִים ist ein seltenes und in seiner Bedeutung umstrittenes Wort. Die Wiedergabe knüpft an die mögliche Bedeutung „zerstreuen“ an, ohne die kontextuell erschlossene Himmelsrichtung „Norden“ in den Haupttext einzutragen. Die Unsicherheit und die Richtungsdeutung werden in der Fußnote offengelegt.
- source_word: קָרָה
  choice: die Kälte
  rationale: קָרָה bezeichnet Kälte, Frost oder winterliche Kälte. „Die Kälte“ ist knapp, verständlich und weniger spezifisch als „Frost“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter hebräischer Wettermetaphorik. Der Parallelismus wird durch das zweimalige „kommt“ klar und natürlich wiedergegeben; die seltene Bezeichnung מְזָרִים bleibt bewusst nicht auf eine einzige Deutung festgelegt.
