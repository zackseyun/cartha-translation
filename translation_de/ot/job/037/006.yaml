source:
  edition: WLC
  text: כִּ֤י לַ/שֶּׁ֨לַג יֹאמַ֗ר הֱוֵ֫א אָ֥רֶץ וְ/גֶ֥שֶׁם מָטָ֑ר וְ֝/גֶ֗שֶׁם מִטְר֥וֹת עֻזּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/006.yaml
  text: For he says to the snow[a], ‘Fall to the earth,’ and to the rain, ‘Become a shower,’ and to the rains[b], ‘Become a downpour of his might.’
translation:
  language: de
  text: 'Denn er sagt zum Schnee[a]: »Fall auf die Erde!«, und zum Regen: »Werde zum Regenguss!«, und zu den Regengüssen[b] seiner Macht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Sei auf der Erde!«; der Schnee wird aufgefordert, auf der Erde zu erscheinen oder dort zu liegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Schlusswendung ist im Hebräischen stark verdichtet und kann als elliptische Fortsetzung der Anrede verstanden werden, etwa: »Werdet zu gewaltigen Regengüssen seiner Macht!« Möglich ist auch: »und zum Regenguss, zu den gewaltigen Regengüssen seiner Macht«. Das Fürwort kann sich auf Gott beziehen; auch ein Bezug auf den Niederschlag ist möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung von Gottes Herrschaft über das Wetter ein und knüpft natürlich an den vorausgehenden Zusammenhang an.
- source_word: לַשֶּׁלַג
  choice: zum Schnee
  rationale: Die Präposition ל bei אמר bezeichnet den Adressaten; die personifizierende Anrede bleibt erhalten.
- source_word: יֹאמַר
  choice: er sagt
  rationale: Das Imperfekt beschreibt hier in lebendiger poetischer Rede Gottes gegenwärtig beziehungsweise regelmäßig ausgeübtes Handeln. Der Befehlscharakter liegt in den folgenden Imperativen.
- source_word: הֱוֵא אָרֶץ
  choice: Fall auf die Erde!
  rationale: Wörtlich steht eine Aufforderung zum Sein beziehungsweise Erscheinen auf der Erde. Im Zusammenhang mit Schnee gibt „Fall auf die Erde“ den natürlichen Vorgang verständlich wieder, ohne die wörtlichere Möglichkeit zu verschweigen.
- source_word: וְגֶשֶׁם מָטָר
  choice: 'und zum Regen: »Werde zum Regenguss!«'
  rationale: Die beiden nah verwandten Regenwörter werden unterschieden und als poetisch verdichtete Aufforderung wiedergegeben; dadurch bleibt die Steigerung gegenüber dem Schnee erkennbar.
- source_word: וְגֶשֶׁם מִטְרוֹת עֻזּוֹ
  choice: 'und zu den Regengüssen: »Werdet zum Wolkenbruch seiner Macht!«'
  rationale: Der Plural מִטְרוֹת und עֻזּוֹ drücken gesteigerte, kraftvolle Niederschläge aus. „Wolkenbruch“ vermittelt die Intensität idiomatisch; die komprimierte hebräische Konstruktion wird in der Fußnote kenntlich gemacht.
- source_word: עֻזּוֹ
  choice: seiner Macht
  rationale: Das maskuline Suffix bezieht sich im Kontext am ehesten auf Gott, der spricht und die Wettererscheinungen lenkt.
theological_decisions:
- issue: Bezug des Pronominalsuffixes in עֻזּוֹ
  choice: 'Das Suffix bezieht sich auf Gott: „seiner Macht“.'
  alternative: 'Es kann auf den Niederschlag bezogen werden: „mit seiner Wucht“ beziehungsweise „mit ihrer Wucht“.'
  rationale: Gott ist im unmittelbaren Zusammenhang der Sprechende und Handelnde; der Gottesbezug passt daher am besten zum Gedankengang. Da der hebräische Bezug grammatisch nicht völlig eindeutig ist, wird die Alternative in einer Fußnote genannt.
- issue: Syntaktische Ergänzung im zweiten und dritten Regenausdruck
  choice: Die knappe hebräische Reihung wird als fortgesetzte direkte Anrede mit ergänzten Aufforderungen wiedergegeben.
  alternative: 'Man kann die Ausdrücke elliptisch an den ersten Befehl anschließen: „ebenso zum Regenguss und zu den Regengüssen seiner Macht“.'
  rationale: Die gewählte Fassung macht den poetischen Parallelismus auf Deutsch verständlich, ohne die verdichtete und mehrdeutige Form des Hebräischen zu verschweigen.
translation_notes:
  register: Moderne, verständliche und zugleich würdevolle poetische Sprache. Die personifizierende direkte Anrede bleibt erhalten. „Regenguss“ und „Wolkenbruch“ bilden die Intensivierung des Hebräischen natürlich ab; die Fußnoten sichern die wörtlichere und syntaktisch knappere Lesart.
