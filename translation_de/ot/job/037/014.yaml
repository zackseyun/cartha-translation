  yaml_path: translation/ot/job/037/014.yaml
  text: Listen to this[a], Job[c][b]; stand still and consider the wonders of God.
translation:
  language: de
  text: Hör das an, Hiob; steh still und betrachte Gottes Wunder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Hör
  rationale: Der Imperativ von אזן fordert zu aufmerksamem Hören auf. „Hör“ ist im modernen Deutsch klar, unmittelbar und dem hebräischen Imperativ angemessen.
- source_word: זֹּאת
  choice: darauf
  rationale: Das feminine Demonstrativpronomen bezeichnet das, worauf Hiob achten soll. „Hör darauf“ gibt die Verbindung im Deutschen idiomatisch wieder, ohne den möglichen Rückbezug oder Vorausbezug festzulegen.
- source_word: אִיּוֹב
  choice: Hiob
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: עֲמֹד
  choice: bleib stehen
  rationale: Der Imperativ von עמד bedeutet wörtlich „steh“. Im Zusammenhang mit dem anschließenden Nachdenken bezeichnet er ein Innehalten; „bleib stehen“ drückt dies natürlich aus, ohne darüber hinaus eine besondere Körperhaltung einzulesen.
- source_word: וְהִתְבּוֹנֵן
  choice: und betrachte
  rationale: Der Hitpolel-Imperativ von בין fordert zu aufmerksamer, einsichtiger Betrachtung auf. „Betrachte“ bewahrt sowohl die geistige Aufmerksamkeit als auch den würdevollen Ton.
- source_word: נִפְלְאוֹת
  choice: Wunder
  rationale: Das Substantiv im Plural bezeichnet außergewöhnliche, staunenswerte Dinge oder Taten. „Wunder“ ist knapp und lässt offen, ob vor allem Werke, Taten oder Erscheinungen gemeint sind.
- source_word: אֵל
  choice: Gottes
  rationale: אֵל bezeichnet hier Gott. Der deutsche Genitiv „Gottes“ gibt die hebräische Status-constructus-Verbindung natürlich und ohne zusätzliche Ausdeutung wieder.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung אֵל
  choice: Gott
  alternative: der Mächtige
  rationale: Im vorliegenden Zusammenhang ist „Gott“ die sachlich naheliegende Wiedergabe. „Der Mächtige“ würde eine mögliche etymologische oder titelartige Nuance stärker hervorheben, als es der Text verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappen Imperativen. Die Formulierung wahrt den poetisch-mahnenden Ton und vermeidet Archaismen. Keine Fußnote ist nötig, da die wesentlichen Bedeutungsnuancen im Haupttext angemessen erhalten bleiben.
