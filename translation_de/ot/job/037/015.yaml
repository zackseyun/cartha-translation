base_translation:
  language: en
  yaml_path: translation/ot/job/037/015.yaml
  text: Do you know how God lays these upon them[b][a], and causes the light of his cloud to shine?
translation:
  language: de
  text: Weißt du, wie Gott etwas auf sie legt[a] und das Licht seiner Wolke leuchten lässt[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wenn Gott etwas auf sie legt“ oder „wie Gott etwas über ihnen anordnet“. Der hebräische Ausdruck ist knapp; sowohl das Objekt als auch der Bezug von „sie“ bleiben unausgesprochen und müssen aus dem Zusammenhang erschlossen werden.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „und den Glanz seiner Wolke hervorblitzen lässt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Weißt du
  rationale: ידע im Qal Imperfekt, 2. Person Singular, leitet eine rhetorische Frage an Hiob ein. „Weißt du“ gibt dies direkt und natürlich wieder.
- source_word: בְּשׂוּם
  choice: wie … auferlegt
  rationale: Die Präposition ב mit dem Infinitiv von שׂום kann einen zeitlichen oder modalen Umstand bezeichnen. Im Anschluss an „Weißt du“ ist „wie … auferlegt“ idiomatisch; das neutrale „es“ vertritt lediglich das im Hebräischen unausgesprochene Objekt, ohne es inhaltlich festzulegen.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: אֱלוֹהַּ ist die in Hiob häufige poetische Singularform für Gott; eine Erweiterung wie „der Allmächtige“ wäre hier nicht lexikalisch begründet.
- source_word: עֲלֵיהֶם
  choice: ihnen
  rationale: על mit dem Suffix der 3. Person maskulin Plural bezeichnet hier, wem oder worauf etwas gelegt wird. Der Bezug des Pronomens bleibt wie im Hebräischen aus dem Zusammenhang zu erschließen.
- source_word: וְהוֹפִיעַ
  choice: und … aufleuchten lässt
  rationale: Der Hifil von יפע bezeichnet das Hervortretenlassen von Licht oder Glanz. „Aufleuchten lässt“ bewahrt sowohl die kausative Form als auch die mögliche Vorstellung eines Lichtblitzes.
- source_word: אוֹר
  choice: das Licht
  rationale: אוֹר bedeutet „Licht“ oder „Helligkeit“. „Das Licht“ ist im Deutschen in der Verbindung mit „seiner Wolke“ natürlich.
- source_word: עֲנָנוֹ
  choice: seiner Wolke
  rationale: Das Substantiv steht im Singular mit einem Suffix der 3. Person maskulin Singular. Die Übersetzung bewahrt diesen Singular und vermeidet die interpretierende Erweiterung „Gewitterwolke“.
theological_decisions:
- issue: Unausgesprochenes Objekt von שׂום und Bezug von „ihnen“
  choice: Die Offenheit wird mit „es ihnen auferlegt“ bewahrt.
  alternative: „den Wolken gebietet“, „seinen Befehl auf sie legt“ oder „diese Dinge über ihnen anordnet“
  rationale: Der hebräische Text nennt nach שׂום kein ausdrückliches Objekt, und der Bezug des pluralischen Suffixes ergibt sich nur mittelbar aus dem Kontext. Eine Festlegung auf Wolken, Blitze oder einen göttlichen Befehl würde mehr bestimmen, als der Vers selbst ausdrücklich sagt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt direkt; die ungewöhnliche Offenheit des hebräischen Satzes wird nicht durch eine bestimmte meteorologische Deutung aufgelöst.
