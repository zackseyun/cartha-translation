revisions:
- from: Weißt du, wie Gott es ihnen auferlegt[a] und das Licht seiner Wolke aufleuchten lässt[b]?
  to: Weißt du, wie Gott etwas auf sie legt[a] und das Licht seiner Wolke leuchten lässt[b]?
  rationale: Die Revision ersetzt die im Deutschen semantisch zu bestimmte Wendung „es ihnen auferlegt“ durch „etwas auf sie legt“. Damit bleiben das nicht genannte Objekt und der kontextabhängige Bezug des Plurals wie im Hebräischen offen. Zugleich wird die räumliche Bedeutung von עֲלֵיהֶם erkennbar. Die zweite Satzhälfte wird geringfügig neutraler formuliert, ohne die mögliche Nuance eines Aufblitzens zu verlieren; diese steht weiterhin in der Fußnote.
