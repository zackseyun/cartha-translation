    issue: „es ihnen auferlegt“
    rationale: Die Formulierung legt eine Pflicht, Last oder Anordnung als Objekt nahe und verschiebt die räumliche Präposition „auf sie“ zu einem indirekten Objekt. Das Hebräische lässt sowohl das Objekt als auch den Referenten des Plurals offen.
  - severity: low
    issue: „aufleuchten lässt“
    rationale: Die Wiedergabe ist möglich, kann aber ein plötzliches Aufblitzen stärker nahelegen. Das Grundbild von Licht, das sichtbar wird bzw. scheint, wird mit „leuchten lässt“ neutraler bewahrt.
