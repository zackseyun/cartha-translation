  text: מִ/נִּשְׁמַת אֵ֥ל יִתֶּן קָ֑רַח וְ/רֹ֖חַב מַ֣יִם בְּ/מוּצָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/010.yaml
  text: From the breath of God ice is given[b][a], and the broad expanse of waters is frozen solid.
translation:
  language: de
  text: Vom Atem Gottes entsteht Eis,[a] und die weite Wasserfläche wird fest.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Durch den Atem Gottes entsteht Eis.“ Die hebräische Präposition kann sowohl den Ursprung („von“) als auch das Mittel („durch“) bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „die Breite des Wassers wird fest“ oder „die weite Oberfläche des Wassers gefriert“. Der hebräische Ausdruck ist poetisch und bezeichnet möglicherweise, dass die weit ausgebreitete Wasserfläche fest wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: Vom Atem
  rationale: נְשָׁמָה bezeichnet konkret den Atem; die Präposition מִן kann hier Ursprung oder Mittel ausdrücken. „Vom“ bewahrt die Bildsprache und lässt die Ursprungsbedeutung erkennen.
- source_word: אֵל
  choice: Gottes
  rationale: אֵל ist hier die gewöhnliche Gottesbezeichnung; eine Erweiterung wie „des Allmächtigen“ wäre nicht erforderlich.
- source_word: יִתֶּן
  choice: entsteht
  rationale: Das wörtliche „wird gegeben“ wäre im heutigen Deutschen unnatürlich. „Entsteht“ gibt die Aussage idiomatisch wieder, ohne die durch „vom Atem Gottes“ bezeichnete göttliche Verursachung zu verdecken.
- source_word: קָרַח
  choice: Eis
  rationale: קָרַח bezeichnet Eis und passt zum parallelen Erstarren der Wasser besser als „Reif“.
- source_word: וְרֹחַב מַיִם
  choice: und die Weite der Wasser
  rationale: רֹחַב meint Breite oder weite Ausdehnung. Die relativ formale Wiedergabe erhält die poetische Mehrdeutigkeit zwischen der Ausdehnung und der weiten Oberfläche des Wassers.
- source_word: בְּמוּצָק
  choice: erstarrt
  rationale: מוּצָק bezeichnet etwas Festes beziehungsweise wie gegossen Verfestigtes. Im Zusammenhang mit Eis gibt „erstarrt“ die meteorologische Bedeutung klar und knapp wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die konkrete Atem-Metapher und die offene Bedeutung von רֹחַב bleiben erhalten; unnatürliches deutsches „Eis wird gegeben“ wird zugunsten von „Eis entsteht“ vermieden.
