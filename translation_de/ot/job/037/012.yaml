  text: It turns around and around by his guidance[c][b][a], to accomplish all that he commands them over the face of the inhabited world on the earth.
translation:
  language: de
  text: Es dreht sich nach seiner Lenkung in Kreisen, damit sie alles tun, was er ihnen befiehlt, über der ganzen bewohnten Erde.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach seiner Steuerung“ oder „nach seiner Führung“; das hebräische Wort bezeichnet planvolle Lenkung oder Leitung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „über dem Antlitz der bewohnten Welt, erdwärts/landwärts“. Die hebräischen Suffixe in „damit sie ... ihnen“ sind Plural; ihr genauer Bezug auf Wettererscheinungen wird nicht näher bestimmt.'
    reason: textual_and_lexical_ambiguity
lexical_decisions:
- source_word: וְהוּא
  choice: Es
  rationale: Das maskuline Singularpronomen verweist im Zusammenhang wahrscheinlich auf das Wettergebilde beziehungsweise die Wolke; im Deutschen ist dafür das sachliche Pronomen natürlich, ohne den Bezug enger festzulegen.
- source_word: מְסִבּוֹת מִתְהַפֵּךְ
  choice: wendet sich kreisend hin und her
  rationale: Die Verbindung bezeichnet kreisende Bewegungen und wechselnde Richtungen. Die Formulierung bewahrt beide Aspekte, ohne eine bestimmte meteorologische Bewegung zu behaupten.
- source_word: בְּתַחְבּוּלֹתוֹ
  choice: nach seiner Lenkung
  rationale: Das Wort bezeichnet hier planvolle Steuerung oder Führung; „Lenkung“ gibt Gottes bestimmende Kontrolle knapp und sachgerecht wieder.
- source_word: לְפָעֳלָם
  choice: um ... auszuführen
  rationale: Die Präposition bezeichnet den Zweck; der Suffixbezug ist textlich schwierig. Die deutsche Zweckkonstruktion verbindet die Bewegung mit der Ausführung des göttlichen Befehls.
- source_word: כֹּל אֲשֶׁר יְצַוֵּם
  choice: alles, was er ihm befiehlt
  rationale: Der masoretische Text hat bei יְצַוֵּם einen Suffix, der formal mehrdeutig sein kann. Im Satzzusammenhang wird er auf das zuvor singularisch bezeichnete Wettergebilde bezogen; die Ambiguität wird in einer Fußnote offengehalten.
- source_word: עַל־פְּנֵי תֵבֵל
  choice: über dem Erdkreis
  rationale: תֵּבֵל bezeichnet die bewohnte beziehungsweise geordnete Welt; „Erdkreis“ ist eine würdige, verständliche Wiedergabe, die den räumlichen Umfang ausdrückt.
- source_word: אָרְצָה
  choice: dem Land zugewandt
  rationale: Die Direktivendung -ָה bezeichnet eine Bewegung oder Ausrichtung zur Erde beziehungsweise zum Land hin. Die Formulierung wahrt diese auffällige, an תֵבֵל anschließende Nuance.
theological_decisions:
- issue: Bezug des singularischen Pronomens und der Wetterbeschreibung
  choice: Ein nicht näher bestimmtes Wettergebilde unter Gottes Lenkung
  alternative: Eine einzelne Wolke, ein Wolkenkomplex oder das Sturmsystem allgemein
  rationale: Der unmittelbare Kontext spricht von Wolken, Blitz und Sturm, legt den konkreten Referenten hier aber nicht eindeutig fest. Die Übersetzung vermeidet eine moderne meteorologische Präzisierung.
- issue: Numerus des Objekts von „befehlen“
  choice: Singularisch „ihm“ mit Fußnote zur möglichen Mehrzahl
  alternative: Pluralisch „ihnen“ auf die Wetterkräfte oder Wolken bezogen
  rationale: Die Konsonantenform lässt unterschiedliche morphologische Deutungen zu, während וְהוּא einen singularischen Ausgangspunkt bietet. Die Hauptfassung folgt diesem Bezug, ohne die pluralische Möglichkeit zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche räumliche Schichtung des Hebräischen wird nicht eingeebnet; „Erdkreis“ bleibt allgemein verständlich und vermeidet eine wissenschaftlich-geografische Überdeutung.
