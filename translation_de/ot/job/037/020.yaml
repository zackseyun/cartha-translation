  text: הַֽ/יְסֻפַּר ל֭/וֹ כִּ֣י אֲדַבֵּ֑ר אִֽם אָ֥מַר אִ֝֗ישׁ כִּ֣י יְבֻלָּֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/020.yaml
  text: Should it be told to him that I would speak? If a man speaks[c][b][a], surely he would be swallowed up.
translation:
  language: de
  text: Soll es ihm[a] berichtet werden, dass ich reden will? Wenn ein Mann[b] spricht,[c] wird er gewiss verschlungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Pronomen „ihm“ bezieht sich hier auf Gott.
    reason: referent_clarification
  - marker: b
    text: 'Hebräisch: „ein Mann“; hier möglicherweise allgemein im Sinn von „jemand“ oder „ein Mensch“.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Satzbau dieses Verses ist schwierig. Möglich ist auch: „Soll ihm berichtet werden, dass ich rede? Oder sollte ein Mann sagen, dass er verschlungen würde?“'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיְסֻפַּר
  choice: Soll es berichtet werden
  rationale: Die Fragepartikel הֲ und die Passivform von ספר ergeben eine unpersönliche rhetorische Frage. „Soll es berichtet werden“ ist im Deutschen zugleich quellennah und natürlich.
- source_word: לוֹ
  choice: ihm
  rationale: Das Pronomen bezieht sich im Zusammenhang auf Gott. Das Deutsche kennzeichnet diesen Bezug nicht durch eine besondere Großschreibung.
- source_word: כִּי אֲדַבֵּר
  choice: dass ich reden will
  rationale: כִּי leitet hier den Inhalt der Mitteilung ein; die Imperfektform kann in der rhetorischen Situation eine beabsichtigte beziehungsweise erwogene Handlung ausdrücken.
- source_word: אִם אָמַר אִישׁ
  choice: Wenn ein Mann redet
  rationale: „Wenn“ bewahrt die konditionale Form von אִם, und „ein Mann“ gibt אִישׁ formal wieder. אָמַר wird ohne ein im Hebräischen nicht ausdrücklich vorhandenes Objekt als „redet“ wiedergegeben.
- source_word: כִּי יְבֻלָּע
  choice: wird er gewiss verschlungen
  rationale: Die Passivform von בלע wird mit dem anschaulichen Bild „verschlungen“ wiedergegeben. In dieser syntaktischen Deutung trägt כִּי bekräftigende Kraft; wegen der schwierigen Satzfügung wird eine andere Zuordnung in der Fußnote festgehalten.
theological_decisions:
- issue: Bezug des Pronomens לוֹ
  choice: „ihm“ mit dem aus dem Kontext erkennbaren Bezug auf Gott
  alternative: „Ihm“ als ehrerbietige Großschreibung
  rationale: Das Hebräische markiert keine ehrerbietige Großschreibung. Die normale deutsche Pronomenschreibung vermeidet eine nachträglich eingetragene Stilkonvention, ohne den Gottesbezug zu verdunkeln.
- issue: Generischer Gebrauch von אִישׁ
  choice: „ein Mann“
  alternative: „jemand“ oder „ein Mensch“
  rationale: Die Hauptübersetzung bewahrt die maskuline Singularform des Ausgangstextes. Dass sie hier wahrscheinlich allgemein gebraucht ist, wird in einer Fußnote kenntlich gemacht.
- issue: Schwierige Syntax des zweiten Satzes
  choice: 'Bedingung und Folgerung: „Wenn ein Mann redet, wird er gewiss verschlungen“'
  alternative: 'Inhaltssatz nach אָמַר: „Oder sollte ein Mann sagen, dass er verschlungen würde?“'
  rationale: Der hebräische Wortlaut ist stark verdichtet und lässt die syntaktische Funktion von אִם und כִּי unterschiedlich bestimmen. Die Hauptfassung folgt einer möglichen geradlinigen Lesart, ohne die ernsthaft mögliche Alternative zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Schärfe und das Bild des Verschlungenwerdens bleiben erhalten; die unsichere Syntax wird nicht durch eine glättende Paraphrase verdeckt.
