  variant: modern standard German
source:
  edition: WLC
  text: אַף בְּ֭/רִי יַטְרִ֣יחַ עָ֑ב יָ֝פִ֗יץ עֲנַ֣ן אוֹרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/011.yaml
  text: Indeed[a], he loads the thick cloud with moisture[b]; he scatters his cloud of light.
translation:
  language: de
  text: Ja, er belädt die dichte Wolke mit Feuchtigkeit[a]; er zerstreut die Wolke seines Lichts[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Regen/Wasser“. Das hebräische Wort ist selten und in seiner Bedeutung unsicher; auch eine Herleitung im Sinn von „Helligkeit/Klarheit“ wurde vorgeschlagen.'
    reason: lexical_alternative
  - marker: b
    text: 'Möglicherweise: „seine Blitzwolke“. Im Zusammenhang des Gewitters kann „Licht“ den Blitz bezeichnen; wörtlich steht „die Wolke seines Lichts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Ja
  rationale: Die Partikel hebt einen weiteren Punkt in Elihus Wetterbeschreibung nachdrücklich hervor. „Ja“ gibt diese bekräftigende und zugleich anknüpfende Funktion im Deutschen knapp wieder.
- source_word: בְּרִי
  choice: mit Feuchtigkeit
  rationale: Das seltene und unsichere Wort wird im Zusammenhang mit der beladenen Wolke am ehesten meteorologisch als Feuchtigkeit beziehungsweise Wasser verstanden. Die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: יַטְרִיחַ
  choice: belädt
  rationale: Der Hifil von טרח bezeichnet hier das Auferlegen einer Last. „Belädt“ bewahrt das konkrete Bild der mit Wasser beschwerten Wolke.
- source_word: עָב
  choice: die dichte Wolke
  rationale: עָב bezeichnet eine schwere oder dichte Wolke; die Wiedergabe erhält das anschauliche Wetterbild.
- source_word: יָפִיץ
  choice: er zerstreut
  rationale: Der Hifil von פוץ drückt ein Zerstreuen oder Auseinandertreiben aus. „Zerstreut“ folgt der Grundbedeutung, ohne die Art der Bewegung näher festzulegen.
- source_word: עֲנַן אוֹרוֹ
  choice: die Wolke seines Lichts
  rationale: Die Genitivverbindung wird möglichst unmittelbar wiedergegeben. Im Gewitterzusammenhang kann „Licht“ auf Blitzlicht zielen, doch die Übersetzung legt diese Deutung nicht stillschweigend fest.
theological_decisions: []
