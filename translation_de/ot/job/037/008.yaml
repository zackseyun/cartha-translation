  text: Then the wild animal enters its lair[a], and remains in its dens.
translation:
  language: de
  text: Dann geht das Wildtier in sein Versteck und bleibt in seinen Behausungen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann kommt das Wildtier in seinen Schlupfort und wohnt in seinen Wohnstätten.“'
    reason: Lexikalische Alternativen für אָרֶב, מְעוֹנוֹת und שכן. Die hebräischen Ausdrücke können einen verborgenen Ort, Wohnstätten und dauerhaftes Wohnen bzw. Sichaufhalten bezeichnen.
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Dann zieht sich … zurück
  rationale: Das Qal-Wayyiqtol von בוא führt die poetische Schilderung weiter. Zusammen mit dem Zielort gibt „zieht sich … zurück“ den Gang des Tieres in einen geschützten Rückzugsort im natürlichen modernen Deutsch wieder.
- source_word: חַיָּה
  choice: das Wildtier
  rationale: חַיָּה bezeichnet hier generisch ein wild lebendes Tier, nicht eine bestimmte Tierart. „Wildtier“ ist knapp, geläufig und vermeidet den altertümlichen Klang von „wildes Tier“ oder „Bestie“.
- source_word: בְמוֹ אָרֶב
  choice: in sein Versteck
  rationale: אָרֶב bezeichnet einen verborgenen Ort des Lauerns beziehungsweise einen Schlupf- oder Rückzugsort. „Versteck“ bewahrt diese Bedeutung, ohne den Ausdruck vorschnell mit dem folgenden Wort für Wohnstätten gleichzusetzen.
- source_word: וּבִמְעוֹנֹתֶיהָ
  choice: in seinen Schlupfwinkeln
  rationale: מְעוֹנוֹת bezeichnet Wohn- oder Aufenthaltsorte; der Plural bleibt erhalten. Im Tierkontext gibt „Schlupfwinkel“ geschützte Aufenthaltsorte idiomatisch wieder. Das feminine Suffix bezieht sich auf das grammatisch feminine Kollektivum חַיָּה und wird im Deutschen entsprechend dem Neutrum „Wildtier“ mit „seinen“ wiedergegeben.
- source_word: תִשְׁכֹּן
  choice: bleibt
  rationale: שכן bedeutet wohnen, sich aufhalten oder bleiben. Nach dem Rückzug vor dem Wetter hebt „bleibt“ das fortdauernde Verweilen im Schutz hervor und passt natürlich in den Zusammenhang.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher Tier- und Wettersprache. Der poetische Parallelismus sowie der Wechsel von einem einzelnen generischen Tier zu mehreren geschützten Aufenthaltsorten bleiben erkennbar.
