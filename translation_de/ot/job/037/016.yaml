base_translation:
  language: en
  yaml_path: translation/ot/job/037/016.yaml
  text: Do you know about the balancing of the clouds[a], the wonders of one perfect in knowledge?
translation:
  language: de
  text: Weißt du um das Schweben der Wolken[a], um die Wunder dessen, der vollkommenes Wissen hat?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Ausbreiten der Wolken“; auch: „das Ausbalanciertsein der Wolken“. Das hebräische Wort ist selten, und seine genaue Bedeutung ist unsicher. Es bezeichnet wahrscheinlich, wie die Wolken am Himmel ausgebreitet sind, schweben oder im Gleichgewicht sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Weißt du
  rationale: Die Fragepartikel mit ידע im Qal Imperfekt 2. Person Singular eröffnet eine rhetorische Frage an Hiob. „Weißt du“ gibt die direkte Herausforderung natürlich wieder.
- source_word: עַל
  choice: wie
  rationale: Im Deutschen lässt sich der Wissensgegenstand hier idiomatisch durch einen indirekten Fragesatz ausdrücken. So wird die sachliche Beziehung gewahrt, ohne ein schwerfälliges „über“ zu verwenden.
- source_word: מִפְלְשֵׂי עָב
  choice: wie die Wolken schweben
  rationale: Das seltene מִפְלְשֵׂי ist in seiner genauen Bedeutung unsicher und bezeichnet wahrscheinlich das Ausbreiten, Austarieren oder schwebende Aufgehängtsein der Wolken. „wie die Wolken schweben“ ist verständlich und bildet das Naturphänomen ab; die Unsicherheit bleibt in der Fußnote sichtbar.
- source_word: מִפְלְאוֹת
  choice: die Wunder
  rationale: „Wunder“ ist eine knappe, natürliche Wiedergabe für außergewöhnliche Werke oder Erscheinungen.
- source_word: תְּמִים
  choice: vollkommen
  rationale: In dieser Beschreibung bezeichnet תְּמִים Ganzheit oder Vollkommenheit, nicht lediglich moralische Untadeligkeit.
- source_word: דֵּעִים
  choice: an Wissen
  rationale: Der Plural kann Fülle oder umfassendes Wissen ausdrücken. Die deutsche abstrakte Einzahl ist idiomatisch und bewahrt diesen Sinn in der Wendung „vollkommen an Wissen“.
theological_decisions:
- issue: Bezug von „dessen, der vollkommen an Wissen ist“
  choice: Der Bezug bleibt im Wortlaut unausgesprochen; im Kontext ist Gott gemeint.
  alternative: „Gottes Wunder“ ausdrücklich einsetzen oder die Wendung auf einen weisen Menschen beziehungsweise Elihu beziehen.
  rationale: Der Zusammenhang von Elihus Rede über die göttliche Herrschaft über Wetter und Schöpfung weist auf Gott. Da der hebräische Text den Namen jedoch nicht einsetzt, wird der Bezug nicht ausdrücklich ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der indirekte Fragesatz klingt natürlich; der Gedankenstrich verbindet das beobachtbare Wolkenphänomen mit den Wundern des vollkommen Wissenden. Der implizite Gottesbezug und die lexikalische Unsicherheit werden bewahrt.
