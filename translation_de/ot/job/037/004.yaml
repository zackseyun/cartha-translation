  text: After it[a], a voice roars; he thunders with his majestic voice[c][b], and he does not hold them back when his voice is heard.
translation:
  language: de
  text: Danach[a] brüllt eine Stimme; er donnert mit seiner majestätischen Stimme. Er hält sie nicht zurück[b], wenn[c] seine Stimme zu hören ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Nach ihm brüllt eine Stimme.“ Das Hebräische kann allgemein zeitlich verstanden werden; wahrscheinlich verweist das Pronomen jedoch auf das Licht beziehungsweise die Lichterscheinung im vorhergehenden Vers.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Er verzögert sie nicht.“ Mit „sie“ sind wahrscheinlich die Blitze, Donnerschläge oder sonstigen Auswirkungen des Sturms gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „weil seine Stimme zu hören ist“ oder „denn seine Stimme zu hören ist“. Die hebräische Konjunktion kann sowohl zeitlich als auch begründend verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Ihm nach
  rationale: Die Wendung bewahrt den Rückbezug des maskulinen Suffixes, wahrscheinlich auf die Lichterscheinung beziehungsweise den Blitz im vorhergehenden Vers, ohne den Bezug im Haupttext ausdrücklich festzulegen.
- source_word: יִשְׁאַג קוֹל
  choice: brüllt eine Stimme
  rationale: שׁאג bezeichnet häufig das Brüllen eines Löwen und zeichnet hier den Donner als machtvolles Brüllen. Der unbestimmte Ausdruck „eine Stimme“ entspricht dem Hebräischen, das den Possessivbezug erst später ausdrückt.
- source_word: יַרְעֵם
  choice: er donnert
  rationale: Die Hifil-Form bezeichnet hier Gottes Hervorbringen des Donners. „Er donnert“ ist im Deutschen knapp, idiomatisch und wahrt die persönliche göttliche Urheberschaft.
- source_word: בְּקוֹל גְּאוֹנוֹ
  choice: mit seiner majestätischen Stimme
  rationale: גָּאוֹן bezeichnet Hoheit, Erhabenheit oder Majestät. Die gewählte Formulierung klingt natürlich und würdig und erhält die Aussage von Gottes Größe.
- source_word: וְלֹא יְעַקְּבֵם
  choice: Er hält sie nicht zurück
  rationale: עקב im Piel kann „zurückhalten“, „hindern“ oder „verzögern“ bedeuten. Das maskuline Pluralsuffix bleibt wie im Hebräischen ohne ausdrücklich genanntes Bezugswort; wahrscheinlich sind Blitze, Donnerschläge oder andere Sturmwirkungen gemeint.
- source_word: כִּי יִשָּׁמַע קוֹלוֹ
  choice: wenn seine Stimme zu hören ist
  rationale: כִּי lässt hier sowohl eine zeitliche als auch eine begründende Deutung zu. „Wenn“ fügt sich gut in die Abfolge von Blitz und Donner; die kausale Möglichkeit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wer brüllt beziehungsweise donnert?
  choice: Das maskuline Singularpronomen bezeichnet Gott, dessen Stimme sich im Donner äußert.
  alternative: Die Aussage könnte zunächst unpersönlicher auf die Stimme oder das Sturmgeschehen bezogen werden.
  rationale: Der Zusammenhang beschreibt Gottes Wirken im Gewitter, und „seiner majestätischen Stimme“ stützt den persönlichen göttlichen Bezug. Der Text nennt Gott dennoch nicht erklärend beim Namen, sondern wahrt die Ausdrucksweise des Hebräischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kräftige Bildsprache des hebräischen „Brüllens“ bleibt erhalten. Die unbestimmten Bezüge von „ihm“ und „sie“ sowie die zeitlich-kausale Mehrdeutigkeit werden nicht stillschweigend aufgelöst, sondern durch Fußnoten kenntlich gemacht.
