  variant: modern standard German
source:
  edition: WLC
  text: יַרְעֵ֤ם אֵ֣ל בְּ֭/קוֹל/וֹ נִפְלָא֑וֹת עֹשֶׂ֥ה גְ֝דֹל֗וֹת וְ/לֹ֣א נֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/005.yaml
  text: God thunders wondrously with his voice[b][a]; he does great things that we do not know.
translation:
  language: de
  text: Gott donnert mit seiner Stimme auf wunderbare Weise[a]; er tut Großes, das wir nicht erkennen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Gott donnert Wunderbares mit seiner Stimme.“'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Großes, das über unser Wissen hinausgeht“ oder „Großes, das wir nicht begreifen können“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְעֵם
  choice: donnert
  rationale: Der Hifil von רעם bezeichnet hier im Zusammenhang von Gottes Stimme und dem Unwetter das Hervorbringen von Donner. Das deutsche „donnert“ gibt dies knapp und natürlich wieder.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier die allgemeine Gottesbezeichnung; eine Erweiterung wie „der mächtige Gott“ ist nicht erforderlich.
- source_word: בְּקוֹלוֹ
  choice: mit seiner Stimme
  rationale: Die Präposition ב kann instrumental verstanden werden. „Mit seiner Stimme“ bewahrt Gott als handelndes Subjekt und bezeichnet seine Stimme als Mittel des Donnerns.
- source_word: נִפְלָאוֹת
  choice: auf wunderbare Weise
  rationale: Die formal pluralische Form („Wunder“, „Wunderbares“) kann hier adverbial zum Verb gebraucht sein. Die gewählte Formulierung ist im Deutschen natürlich; die wörtlichere syntaktische Möglichkeit bleibt in Fußnote [a] erhalten.
- source_word: עֹשֶׂה גְדֹלוֹת
  choice: er tut Großes
  rationale: עשה ist das allgemeine Verb „tun/machen“, während גְדֹלוֹת substantivisch gebraucht wird. „Er tut Großes“ ist würdig, knapp und semantisch breit.
- source_word: וְלֹא נֵדָע
  choice: das wir nicht erkennen
  rationale: ידע bedeutet „wissen, kennen, erkennen“. In Bezug auf Gottes große Taten ist „das wir nicht erkennen“ idiomatischer als „das wir nicht wissen“, ohne die Aussage ausdrücklich zu völliger Unbegreiflichkeit zu steigern.
theological_decisions:
- issue: Umfang der menschlichen Unkenntnis im Schlusssatz
  choice: Gottes großes Handeln wird als etwas bezeichnet, das wir nicht erkennen.
  alternative: Gott tut Großes, das wir nicht begreifen können.
  rationale: Der hebräische Text sagt mit ידע zunächst „wissen/kennen/erkennen“ und enthält kein ausdrückliches Modalverb für Unmöglichkeit. Daher wird die menschliche Begrenztheit ausgesagt, ohne sie übersetzerisch zu einer absoluten Unbegreiflichkeit zu verstärken.
- issue: Syntaktische Funktion von נִפְלָאוֹת
  choice: 'Adverbiale Wiedergabe: „auf wunderbare Weise“.'
  alternative: 'Objektische Wiedergabe: „Gott donnert Wunderbares mit seiner Stimme“.'
  rationale: Beide Deutungen sind sprachlich möglich. Die adverbiale Auffassung ergibt einen natürlichen deutschen Satz und passt zum Bild des wunderbaren Donnerns; die formal wörtlichere Alternative wird wegen der echten Mehrdeutigkeit in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. Der Parallelismus der beiden Aussagen bleibt erhalten; ungebräuchliche oder konfessionell geprägte Formulierungen werden vermieden.
