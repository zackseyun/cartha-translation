  text: אוּלָם֙ שְֽׁלַֽח נָ֣א יָֽדְ/ךָ֔ וְ/גַ֥ע אֶל עַצְמ֖/וֹ וְ/אֶל בְּשָׂר֑/וֹ אִם לֹ֥א אֶל פָּנֶ֖י/ךָ יְבָרֲכֶֽ/ךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/005.yaml
  text: But stretch out your hand[a], please, and touch his bone and his flesh, and he will surely curse you to your face.
translation:
  language: de
  text: Doch streck bitte deine Hand aus und rühre sein Gebein und sein Fleisch an; er wird dir ganz gewiss ins Gesicht fluchen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen »segnen«. Hier ist das Verb als verhüllender Ausdruck für »fluchen« gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: Doch
  rationale: Die adversative Partikel leitet Satans Einwand und Gegenvorschlag ein; »Doch« gibt den Gegensatz knapp und natürlich wieder.
- source_word: שְׁלַח נָא יָדְךָ
  choice: streck nur deine Hand aus
  rationale: Die Wendung bezeichnet ein handelndes Ausstrecken der Hand gegen jemanden. »nur« gibt die auffordernde Partikel נָא in diesem herausfordernden Zusammenhang idiomatisch wieder.
- source_word: וְגַע
  choice: und rühre … an
  rationale: נגע bedeutet zunächst »berühren«; der schädigende Sinn ergibt sich hier aus dem Zusammenhang, ohne durch »schlagen« oder »plagen« vorweggenommen zu werden.
- source_word: אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ
  choice: seine Knochen und sein Fleisch
  rationale: Die konkrete körperliche Ausdrucksweise bleibt erhalten. Der hebräische Singular עֶצֶם ist kollektiv; im modernen Deutschen klingt der Plural »Knochen« natürlicher.
- source_word: אִם לֹא
  choice: ganz gewiss
  rationale: Die Verbindung dient hier nicht als gewöhnlicher Bedingungssatz, sondern als formelhafte, nachdrückliche Behauptung.
- source_word: אֶל פָּנֶיךָ
  choice: dir … ins Gesicht
  rationale: Die deutsche Wendung vermittelt die offene, unmittelbare Konfrontation der hebräischen Formulierung.
- source_word: יְבָרֲכֶךָּ
  choice: dir … fluchen
  rationale: Obwohl ברך gewöhnlich »segnen« bedeutet, ist es hier im Zusammenhang als verhüllender Ausdruck für »fluchen« zu verstehen. Die Fußnote macht die wörtliche Form transparent.
theological_decisions:
- issue: Verhüllender Gebrauch von ברך in der Prüfung Hiobs
  choice: Im Haupttext mit »fluchen« wiedergeben
  alternative: Wörtlich »segnen« übersetzen und den gemeinten Sinn nur erläutern
  rationale: Satans Behauptung zielt darauf, dass Hiob sich unter Leiden offen gegen Gott wenden werde. »Segnen« wäre für heutige Leser im Haupttext irreführend; die wörtliche hebräische Form bleibt deshalb in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die konkrete Körperrede bleibt erhalten; zugleich werden hebräische Idiome natürlich deutsch formuliert.
