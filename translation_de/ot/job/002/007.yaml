  text: וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/אֵ֖ת פְּנֵ֣י יְהוָ֑ה וַ/יַּ֤ךְ אֶת אִיּוֹב֙ בִּ/שְׁחִ֣ין רָ֔ע מִ/כַּ֥ף רַגְל֖/וֹ עד קָדְקֳדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/007.yaml
  text: So the Adversary went out from the presence of Yahweh and struck Job with painful sores from the sole of his foot to the crown of his head[a][b].
translation:
  language: de
  text: Da ging der Widersacher[a] aus der Gegenwart Jahwes hinaus und schlug Hiob mit schweren Geschwüren[b] von der Fußsohle bis zum Scheitel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »der Satan«; traditionell mit »Satan« wiedergegeben. Der Ausdruck steht hier mit Artikel und kann als Titel oder Funktionsbezeichnung im Sinn von »der Widersacher« verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »mit schmerzhaften Geschwüren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: der Widersacher
  rationale: Der hebräische Ausdruck steht mit Artikel und bezeichnet im Prolog des Hiobbuches wahrscheinlich eine Rolle oder einen Titel. „Der Widersacher“ gibt diese Funktion wieder, ohne den Ausdruck vorschnell als festen Eigennamen zu deuten.
- source_word: מֵאֵת פְּנֵי יְהוָה
  choice: aus der Gegenwart Jahwes
  rationale: Die Wendung mit פָּנִים bezeichnet hier idiomatisch die Gegenwart einer Person; יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: וַיַּךְ
  choice: schlug
  rationale: Das Verb נכה bedeutet gewöhnlich „schlagen“; die direkte Formulierung bewahrt die Kraft des hebräischen Ausdrucks.
- source_word: בִּשְׁחִין רָע
  choice: mit schlimmen Geschwüren
  rationale: שְׁחִין bezeichnet eine entzündliche Hauterkrankung beziehungsweise Geschwüre; רָע beschreibt hier deren schwere, leidvolle Beschaffenheit und nicht moralische Bosheit.
- source_word: מִכַּף רַגְלוֹ
  choice: von der Fußsohle
  rationale: כַּף bezeichnet in Verbindung mit dem Fuß dessen Sohle.
- source_word: עַד קָדְקֳדוֹ
  choice: bis zum Scheitel
  rationale: קָדְקֹד bezeichnet den Scheitel beziehungsweise den obersten Teil des Kopfes; die Formulierung unterstreicht, dass der ganze Körper betroffen war.
theological_decisions:
- issue: Wiedergabe von הַשָּׂטָן im Prolog des Hiobbuches
  choice: der Widersacher
  alternative: der Satan; Satan
  rationale: Der Artikel spricht in diesem Zusammenhang dafür, dass eine Funktion oder Amtsbezeichnung gemeint ist. Die gewählte Wiedergabe bewahrt diese Offenheit; die traditionelle Benennung wird in der Fußnote genannt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als Name wiedergegeben, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am knappen hebräischen Erzählstil; „Geschwüre“ ist verständlich und lässt die genaue medizinische Diagnose offen.
