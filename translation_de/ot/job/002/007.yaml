  source_fidelity: 'Die Übersetzung gibt die hebräische Satzfolge und die wesentlichen Bedeutungen zuverlässig wieder: הַשָּׂטָן als titelhaftes „der Widersacher“, das Verlassen von Jahwes Gegenwart, das Schlagen Hiobs sowie die Ausdehnung der Erkrankung von der Fußsohle bis zum Scheitel. „Geschwüre“ wahrt die medizinische Unbestimmtheit von שְׁחִין. Für רָע ist „schwer“ jedoch im heutigen Deutschen präziser und idiomatischer als „schlimm“; gemeint ist die schwere bzw. leidvolle Beschaffenheit der Erkrankung, nicht deren moralische Bewertung.'
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. „Aus der Gegenwart Jahwes hinaus“ ist trotz der Doppelmarkierung der Wegbewegung als bewusste, natürliche Wiedergabe von „ging hinaus von/vor dem Angesicht Jahwes“ möglich. „Schwere Geschwüre“ klingt in diesem Register klarer und fachlich weniger umgangssprachlich als „schlimme Geschwüre“.
  terminology: „Jahwe“ gibt das Tetragramm als Namen wieder. „Der Widersacher“ bewahrt die Artikelform und die mögliche Rollenbezeichnung von הַשָּׂטָן, ohne eine spätere feste Eigennamendeutung aufzuzwingen. Die Fußnote zu Geschwüren soll die lexikalischen Alternativen ohne die im Deutschen missverständliche moralische Nuance von „bösen Geschwüren“ formulieren.
