    rationale: „Böse“ kann im modernen Deutschen eine moralische oder eine spezifisch klinische („bösartig“) Assoziation nahelegen. Die hebräische Formulierung bezeichnet hier die Schwere der Hauterkrankung; „schmerzhaft“ ist eine geeignete alternative Nuance.
