source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן אֵ֥י מִ/זֶּ֖ה תָּבֹ֑א וַ/יַּ֨עַן הַ/שָּׂטָ֤ן אֶת יְהוָה֙ וַ/יֹּאמַ֔ר מִ/שֻּׁ֣ט בָּ/אָ֔רֶץ וּ/מֵ/הִתְהַלֵּ֖ךְ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/002.yaml
  text: And Yahweh said to the Accuser[a], “From where have you come?” And the Accuser answered Yahweh and said, “From roaming about on the earth and from walking around on it.”
translation:
  language: de
  text: 'Und Jahwe sagte zu dem Ankläger[a]: »Woher kommst du?« Der Ankläger antwortete Jahwe und sagte: »Ich bin auf der Erde umhergestreift und auf ihr umhergegangen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »der Satan«; hier wahrscheinlich eine Bezeichnung mit der Bedeutung »der Ankläger« oder »der Widersacher«, nicht notwendigerweise ein Eigenname.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, statt ihn durch den Titel »HERR« zu ersetzen.
- source_word: הַשָּׂטָן
  choice: der Ankläger
  rationale: Der bestimmte Artikel kennzeichnet hier wahrscheinlich eine Rolle oder Amtsbezeichnung. »Der Ankläger« gibt die anklagende beziehungsweise gegnerische Funktion im himmlischen Hofstaat verständlich wieder.
- source_word: אֵי מִזֶּה תָּבֹא
  choice: Woher kommst du?
  rationale: Die geläufige deutsche Frage bewahrt die Bedeutung nach Herkunft beziehungsweise Ausgangspunkt, ohne den hebräischen Ausdruck unnötig wörtlich nachzubilden.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: antwortete ... und sagte
  rationale: Beide hebräischen Verben bleiben erhalten; die Wiederholung entspricht dem erzählerischen Stil und ist im Deutschen noch verständlich.
- source_word: מִשֻּׁט
  choice: Ich bin ... umhergestreift
  rationale: Das Verb bezeichnet ein Hin-und-her-Ziehen oder Umherstreifen. Die finite deutsche Form gibt die elliptische hebräische Antwort natürlich wieder.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ bezeichnet in diesem Zusammenhang am ehesten die Erde beziehungsweise bewohnte Welt, nicht ein bestimmtes Land.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: und auf ihr umhergegangen
  rationale: Die reflexiv-intensive Verbform beschreibt wiederholte Bewegung. »Umhergegangen« bewahrt diese Bedeutung, ohne die speziellere Vorstellung eines Patrouillierens einzutragen.
theological_decisions:
- issue: Ist הַשָּׂטָן ein Eigenname oder eine Rollenbezeichnung?
  choice: der Ankläger
  alternative: der Satan; Satan; der Widersacher
  rationale: Der hebräische Ausdruck trägt den bestimmten Artikel und erscheint in dieser Szene als Rollenbezeichnung im himmlischen Hofstaat. Die Übersetzung vermeidet daher, die spätere Verwendung als Eigenname stillschweigend in den Text einzutragen, ohne eine mögliche Verbindung grundsätzlich auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die erzählerische Doppelung »antwortete … und sagte« wurde zur Nähe zum hebräischen Text beibehalten; die elliptische Antwort wurde für natürliches Deutsch als vollständiger Satz formuliert.
