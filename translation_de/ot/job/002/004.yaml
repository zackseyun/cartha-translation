source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר ע֣וֹר בְּעַד ע֗וֹר וְ/כֹל֙ אֲשֶׁ֣ר לָ/אִ֔ישׁ יִתֵּ֖ן בְּעַ֥ד נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/004.yaml
  text: Then the Adversary answered Yahweh and said[a], “Skin for skin! Indeed[c][b], all that a man has he will give for his life.”
translation:
  language: de
  text: 'Da antwortete der Widersacher[a] dem HERRN und sagte: »Haut für Haut![b] Alles, was ein Mensch hat, gibt er für sein Leben.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Satan« beziehungsweise »der Ankläger«. Im Hebräischen steht eine titelartige Bezeichnung mit Artikel: »der Widersacher/Ankläger«.'
    reason: alternative_reading
  - marker: b
    text: »Haut für Haut« ist eine knappe sprichwortartige Wendung, deren genaue Bedeutung unsicher ist. Wahrscheinlich besagt sie, dass ein Mensch etwas hingibt, um sein eigenes Leben zu schützen.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich auch: »für seine Seele« oder »für sich selbst«; hier ist das bedrohte Leben gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: der Widersacher
  rationale: Der Artikel kennzeichnet die Bezeichnung hier eher als Rolle oder Titel denn als Eigennamen. »Der Widersacher« bewahrt diese Funktion und bleibt im Deutschen verständlich.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens durch »HERR« in Kapitälchen wahrt seine besondere Funktion und ist für eine moderne Bibelausgabe geläufig.
- source_word: עוֹר בְּעַד עוֹר
  choice: Haut für Haut
  rationale: Die knappe, sprichwortartige Formulierung des Hebräischen wird bewusst beibehalten, ohne ihre nicht völlig sichere Bedeutung im Haupttext auszudeuten.
- source_word: בְּעַד
  choice: für
  rationale: »Für« kann in beiden Vorkommen den Gedanken des Tausches beziehungsweise Einsatzes ausdrücken und erhält zugleich die prägnante Form des Spruchs.
- source_word: אִישׁ
  choice: ein Mensch
  rationale: Das maskuline Singularwort bezeichnet hier in einem allgemeinen Spruch einen Menschen; »ein Mensch« gibt diese generische Bedeutung im heutigen Deutsch natürlich wieder.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נפש bezeichnet hier das bedrohte eigene Leben beziehungsweise die eigene Person, nicht spezifisch eine unsterbliche Seele. Der Zusammenhang verlangt am ehesten »Leben«.
- source_word: וְכֹל אֲשֶׁר לָאִישׁ
  choice: Alles, was ein Mensch hat
  rationale: Diese idiomatische deutsche Form gibt die hebräische Besitzkonstruktion knapp und vollständig wieder.
- source_word: יִתֵּן
  choice: gibt er
  rationale: Der Imperfekt formuliert hier eine allgemeine, sprichwortartige Aussage. Das deutsche Präsens bringt diese gnomische Bedeutung natürlicher zum Ausdruck als ein bloßes Futur.
theological_decisions:
- issue: Wiedergabe von הַשָּׂטָן im Prolog des Hiobbuchs
  choice: der Widersacher
  alternative: Satan; der Ankläger
  rationale: Der hebräische Ausdruck steht mit Artikel und bezeichnet die Gestalt rollenhaft. Die Übersetzung vermeidet es, die spätere Verwendung als Eigenname unbesehen in diesen Text einzutragen, ohne eine weitergehende kanonische Identifikation auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der narrative Auftakt folgt eng der hebräischen Form, während der allgemeine Spruch im natürlichen deutschen Präsens steht. Die rätselhafte Wendung »Haut für Haut« bleibt im Haupttext erhalten und wird nur in der Fußnote vorsichtig erläutert.
