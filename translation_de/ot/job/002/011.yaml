source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֞וּ שְׁלֹ֣שֶׁת רֵעֵ֣י אִיּ֗וֹב אֵ֣ת כָּל הָ/רָעָ֣ה הַ/זֹּאת֮ הַ/בָּ֣אָה עָלָי/ו֒ וַ/יָּבֹ֨אוּ֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ אֱלִיפַ֤ז הַ/תֵּימָנִי֙ וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֔י וְ/צוֹפַ֖ר הַ/נַּֽעֲמָתִ֑י וַ/יִּוָּעֲד֣וּ יַחְדָּ֔ו לָ/ב֥וֹא לָ/נֽוּד ל֖/וֹ וּֽ/לְ/נַחֲמֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/011.yaml
  text: 'When Job’s three friends heard about all this trouble that had come upon him[a], they came each from his own place: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite[d][c][b]. They agreed together to come to sympathize with him and to comfort him.'
translation:
  language: de
  text: 'Als die drei Freunde Hiobs von all diesem Unglück hörten, das über ihn gekommen war[a], kamen sie, jeder von seinem Ort: Elifas, der Temaniter, Bildad, der Schuchiter, und Zofar, der Naamatiter. Sie verabredeten sich, gemeinsam zu ihm zu kommen, um ihm ihr Mitgefühl zu zeigen[b] und ihn zu trösten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von all diesem Unheil«, »das ihn getroffen hatte«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um mit ihm zu trauern«. Das hebräische Verb kann eine sichtbare Bekundung von Mitgefühl oder Beileid bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Als ... hörten
  rationale: Die narrative Verbform führt die Handlung fort; im Deutschen gibt ein temporaler Nebensatz den Zusammenhang natürlich und ohne ein unbelegtes »Nun« wieder.
- source_word: שְׁלֹשֶׁת רֵעֵי אִיּוֹב
  choice: die drei Freunde Hiobs
  rationale: Die hebräische Status-constructus-Verbindung wird idiomatisch und zugleich knapp wiedergegeben.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: all diesem Unglück
  rationale: רָעָה bezeichnet hier das über Hiob hereingebrochene Unheil, nicht eine von ihm begangene moralische Bosheit. »Unglück« ist verständlich und wahrt die konkrete wie kollektive Bedeutung.
- source_word: הַבָּאָה עָלָיו
  choice: das über ihn gekommen war
  rationale: Die Formulierung bewahrt das hebräische Bild eines über jemanden kommenden Unheils und entspricht der Vorzeitigkeit im Erzählzusammenhang.
- source_word: וַיָּבֹאוּ אִישׁ מִמְּקֹמוֹ
  choice: kamen sie, jeder aus seinem Heimatort
  rationale: אִישׁ ist distributiv, also »jeder«. »Heimatort« gibt מְקוֹם in diesem Reise-Kontext natürlich wieder, ohne einen bestimmten Ort zu ergänzen.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: der Temaniter / der Schuchiter / der Naamatiter
  rationale: Die Herkunftsbezeichnungen werden in geläufigen deutschen Namensformen transliteriert.
- source_word: וַיִּוָּעֲדוּ יַחְדָּו
  choice: Sie verabredeten sich, gemeinsam
  rationale: Die Niphalform von יעד bezeichnet eine bewusste Absprache beziehungsweise Verabredung; יַחְדָּו wird mit »gemeinsam« ausdrücklich erhalten.
- source_word: לָבוֹא
  choice: zu ihm zu kommen
  rationale: Der Infinitiv bezeichnet den Zweck ihrer Verabredung. Das im Hebräischen implizite Ziel wird im Deutschen mit »zu ihm« aus dem Zusammenhang natürlich ausgedrückt.
- source_word: לָנוּד לוֹ
  choice: ihm ihr Mitgefühl zu zeigen
  rationale: נוּד bezeichnet hier eine sichtbare Bekundung von Anteilnahme oder Beileid und wird vom folgenden »trösten« unterschieden.
- source_word: וּלְנַחֲמוֹ
  choice: und ihn zu trösten
  rationale: נחם bedeutet in diesem Stamm und Kontext »trösten« beziehungsweise »Trost zusprechen«.
theological_decisions:
- issue: Bedeutung von רָעָה
  choice: Unglück
  alternative: Böses
  rationale: Der Kontext spricht von Hiobs erlittenem Unheil. Die Wiedergabe darf nicht nahelegen, hier werde ihm moralische Schuld zugeschrieben.
- issue: Verhältnis von נוד und נחם
  choice: Mitgefühl zeigen und trösten
  alternative: mit ihm trauern und ihn trösten
  rationale: Die zwei verschiedenen hebräischen Verben bleiben erkennbar. »Mitgefühl zeigen« lässt offen, welche konkrete Trauer- oder Beileidsgeste gemeint ist, während »trösten« den zweiten Zweck benennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namen folgen geläufigen deutschen Bibelformen. Der Satzbau bleibt erzählerisch klar; die beiden Absichten der Freunde werden lexikalisch voneinander unterschieden.
