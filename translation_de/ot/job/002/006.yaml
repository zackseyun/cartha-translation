source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן הִנּ֣/וֹ בְ/יָדֶ֑/ךָ אַ֖ךְ אֶת נַפְשׁ֥/וֹ שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/006.yaml
  text: And the LORD said to the Accuser, “Look, he is in your hand; only spare his life.”
translation:
  language: de
  text: 'Da sagte der HERR zum Ankläger: »Sieh, er ist in deiner Hand. Nur sein Leben verschone!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens mit HERR in Kapitälchen entspricht dem vorgegebenen Publikationsstil und kennzeichnet den Eigennamen.
- source_word: הַשָּׂטָן
  choice: der Ankläger
  rationale: Mit Artikel bezeichnet der Ausdruck hier die Rolle des himmlischen Anklägers; die Funktionsbezeichnung bewahrt diesen Sinn, ohne vorschnell einen Eigennamen daraus zu machen.
- source_word: הִנּוֹ
  choice: Sieh
  rationale: Gibt die aufmerksamkeitslenkende Partikel knapp und würdig wieder.
- source_word: בְיָדֶךָ
  choice: in deiner Hand
  rationale: Bewahrt das hebräische Bild für übertragene Gewalt beziehungsweise Verfügungsgewalt.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נפש bezeichnet hier im Zusammenhang mit dem Verbot, ihn zu töten, sein Leben, nicht eine vom Körper getrennte Seele.
- source_word: שְׁמֹר
  choice: verschone
  rationale: Das Verb bedeutet wörtlich bewahren oder schützen; im imperativischen Zusammenhang ist »verschone« eine natürliche Wiedergabe des Gebots, sein Leben nicht anzutasten.
theological_decisions:
- issue: Reichweite der dem Ankläger erteilten Gewalt
  choice: »er ist in deiner Hand« mit der ausdrücklichen Grenze »Nur sein Leben verschone!«
  alternative: Eine Auslegung, nach der der Ankläger uneingeschränkte Gewalt erhält
  rationale: Der Text überträgt Verfügungsgewalt, setzt ihr jedoch ausdrücklich eine tödliche Grenze; beides wird ohne zusätzliche Systematisierung wiedergegeben.
- issue: Identität von הַשָּׂטָן
  choice: rollenbezogen »der Ankläger«
  alternative: der Eigenname »Satan«
  rationale: Der bestimmte Artikel und der literarische Kontext stützen zunächst eine Amts- beziehungsweise Rollenbezeichnung; damit wird eine spätere Identifikation weder behauptet noch ausgeschlossen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die knappe Satzstruktur und das Bild »in deiner Hand« bleiben erhalten; die direkte Rede ist natürlich formuliert.
