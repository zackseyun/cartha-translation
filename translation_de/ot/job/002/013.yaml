  text: And they sat with him on the ground seven days and seven nights[a], and no one spoke a word to him, because they saw that his pain was very great.
translation:
  language: de
  text: Und sie saßen mit ihm sieben Tage und sieben Nächte auf dem Boden, und keiner sprach ein Wort zu ihm; denn sie sahen, dass sein Schmerz sehr groß war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass sein Leiden sehr groß war“ oder „dass sein Kummer sehr groß war“. Das hebräische Wort kann Schmerz im weiteren Sinn bezeichnen, einschließlich körperlichen Leidens und seelischer Qual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ אִתּוֹ לָאָרֶץ
  choice: sie saßen … bei ihm auf der Erde
  rationale: ישׁב bezeichnet hier das konkrete Sitzen; אִתּוֹ drückt die Gemeinschaft mit Hiob aus, und לָאָרֶץ beschreibt im Trauerzusammenhang die Haltung auf der Erde.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת לֵילוֹת
  choice: sieben Tage und sieben Nächte
  rationale: Die wörtliche Zeitangabe ist im Deutschen natürlich und bewahrt den Eindruck einer vollständigen, langen Trauerzeit.
- source_word: וְאֵין דֹּבֵר אֵלָיו דָּבָר
  choice: und keiner sprach ein Wort zu ihm
  rationale: Die deutsche Wendung gibt die nachdrückliche vollständige Stille der hebräischen Konstruktion wieder.
- source_word: כִּי רָאוּ
  choice: denn sie sahen
  rationale: כִּי nennt hier den Grund für das Schweigen; „denn“ verbindet die Aussage in einem würdigen, natürlichen Erzählstil.
- source_word: כִּי גָדַל הַכְּאֵב מְאֹד
  choice: dass sein Schmerz sehr groß war
  rationale: כְּאֵב kann körperlichen Schmerz, Leiden oder seelische Qual bezeichnen. „Schmerz“ wahrt diese Breite weitgehend und passt zum unmittelbaren Zusammenhang; „sein“ macht den Bezug auf Hiob im Deutschen deutlich. מְאֹד wird natürlich mit „sehr“ wiedergegeben.
