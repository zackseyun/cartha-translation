  text: And he took a potsherd to scrape himself with while he was sitting among the ashes[a][b].
translation:
  language: de
  text: Da nahm er sich eine Tonscherbe[a], um sich damit zu schaben[b], während er mitten in der Asche saß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine Scherbe eines Tongefäßes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: zu kratzen. Das hebräische Verb kann auch Kratzen bezeichnen; „schaben“ passt jedoch besonders zum Gebrauch einer Tonscherbe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahm er
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da nahm er“ gibt diese zeitlich-fortschreitende Erzählbewegung im Deutschen natürlich wieder, ohne eine stärkere Folgerung auszudrücken.
- source_word: לוֹ
  choice: sich
  rationale: Der Dativ des Pronomens wird durch das idiomatische deutsche „nahm er sich“ ausdrücklich und natürlich wiedergegeben.
- source_word: חֶרֶשׂ
  choice: eine Tonscherbe
  rationale: Das Substantiv bezeichnet hier eine Scherbe aus gebranntem Ton beziehungsweise den Bruchteil eines Tongefäßes. „Tonscherbe“ ist präzise und allgemein verständlich.
- source_word: לְהִתְגָּרֵד
  choice: um sich … zu schaben
  rationale: Der Hitpael-Infinitiv bezeichnet eine am eigenen Körper vollzogene Handlung. „Schaben“ passt zum Gebrauch einer Tonscherbe und bewahrt die Härte des Bildes; „kratzen“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: בּוֹ
  choice: damit
  rationale: Die Präposition mit Pronomen bezeichnet die Tonscherbe als Werkzeug. „Damit“ stellt diesen instrumentalen Bezug im Deutschen eindeutig her.
- source_word: וְהוּא יֹשֵׁב
  choice: während er … saß
  rationale: Die Konstruktion beschreibt den gleichzeitig andauernden Zustand beziehungsweise die Haltung Ijobs. Der Nebensatz mit „während“ gibt diesen Begleitumstand natürlich wieder.
- source_word: בְּתוֹךְ הָאֵפֶר
  choice: mitten in der Asche
  rationale: בְּתוֹךְ bedeutet „inmitten“ oder „mitten in“. Der Singular „Asche“ entspricht dem hebräischen Kollektivbegriff und bewahrt das konkrete Bild.
