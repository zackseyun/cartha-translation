id: JOB.2.9
reference: Job 2:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר ל/וֹ֙ אִשְׁתּ֔/וֹ עֹדְ/ךָ֖ מַחֲזִ֣יק בְּ/תֻמָּתֶ֑/ךָ בָּרֵ֥ךְ אֱלֹהִ֖ים וָ/מֻֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/009.yaml
  text: Then his wife said to him[a], “Are you still holding fast to your integrity? Bless God and die.”
translation:
  language: de
  text: 'Da sagte seine Frau zu ihm: „Hältst du immer noch an deiner Integrität fest? Segne Gott und stirb!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „Segne Gott und stirb“. Viele verstehen „segnen“ hier als ehrfürchtigen Euphemismus für „verfluchen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: אִשְׁתּוֹ
  choice: seine Frau
  rationale: Direkte Wiedergabe der Nominalform mit Possessivsuffix.
- source_word: עֹדְךָ
  choice: immer noch
  rationale: Das Adverb mit Suffix bezeichnet das fortdauernde Verhalten Hiobs und wird im Deutschen idiomatisch mit „immer noch“ wiedergegeben.
- source_word: מַחֲזִיק בְּתֻמָּתֶךָ
  choice: Hältst du … an deiner Integrität fest
  rationale: חזק mit ב bezeichnet ein beharrliches Festhalten. תֻּמָּה meint Unbescholtenheit, Lauterkeit oder Integrität; „Integrität“ bewahrt den moralischen Sinn, ohne völlige Sündlosigkeit zu behaupten.
- source_word: בָּרֵךְ
  choice: Segne
  rationale: Die überlieferte hebräische Form bedeutet wörtlich „segnen“. Im Zusammenhang wird sie vielfach als ehrfürchtiger Euphemismus für „verfluchen“ verstanden; die Hauptübersetzung wahrt die Ausdrucksform des Ausgangstextes, die Fußnote nennt die wahrscheinliche Sinnalternative.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים ist hier die Gottesbezeichnung „Gott“, nicht der Bundesname JHWH.
- source_word: וָמֻת
  choice: und stirb
  rationale: Die knappe Verbindung zweier Imperative wird direkt und in ihrer Schärfe bewahrt.
theological_decisions:
- issue: Euphemistischer Gebrauch von „segnen“ gegenüber Gott
  choice: „Segne Gott und stirb“ im Haupttext, mit Erläuterung der wahrscheinlichen Bedeutung „Verfluche Gott und stirb“ in einer Fußnote.
  alternative: „Verfluche Gott und stirb“ unmittelbar im Haupttext.
  rationale: Der masoretische Text hat ausdrücklich ברך („segnen“), doch der Kontext legt für viele Ausleger einen ehrfürchtigen Euphemismus mit gegenteiliger Bedeutung nahe. Die wörtliche Form im Haupttext und die Sinnalternative in der Fußnote erhalten die echte sprachliche Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Integrität“ ist verständlich und bildet den wiederkehrenden Begriff aus Hiob 2,3 angemessen ab. Die schroffe Kürze der beiden Imperative bleibt erhalten.
