source:
  edition: WLC
  text: וַ/יִּשְׂא֨וּ אֶת עֵינֵי/הֶ֤ם מֵ/רָחוֹק֙ וְ/לֹ֣א הִכִּירֻ֔/הוּ וַ/יִּשְׂא֥וּ קוֹלָ֖/ם וַ/יִּבְכּ֑וּ וַֽ/יִּקְרְעוּ֙ אִ֣ישׁ מְעִל֔/וֹ וַ/יִּזְרְק֥וּ עָפָ֛ר עַל רָאשֵׁי/הֶ֖ם הַ/שָּׁמָֽיְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/012.yaml
  text: And when they lifted up their eyes from a distance[a], they did not recognize him. Then they raised their voices and wept[b], and each man tore his robe and threw dust over his head toward the heavens.
translation:
  language: de
  text: Als sie aus der Ferne[a] ihre Augen erhoben, erkannten sie ihn nicht. Da erhoben sie ihre Stimmen und weinten. Jeder zerriss sein Obergewand, und sie warfen Staub über ihre Köpfe zum Himmel hin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Weitem“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zum Himmel hin“; der Staub wurde als Zeichen der Trauer nach oben geworfen, sodass er auf ihre Köpfe fiel.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת־עֵינֵיהֶם
  choice: sie ihre Augen erhoben
  rationale: Bewahrt die anschauliche hebräische Wendung, ohne sie zum bloßen „sie blickten auf“ zu verflachen.
- source_word: מֵרָחוֹק
  choice: aus der Ferne
  rationale: Gibt die räumliche Entfernung in natürlichem, gehobenem Standarddeutsch wieder.
- source_word: וְלֹא הִכִּירֻהוּ
  choice: erkannten sie ihn nicht
  rationale: הכיר bezeichnet hier das Wiedererkennen einer Person, deren Erscheinung stark verändert ist.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: sie erhoben ihre Stimmen
  rationale: Bewahrt das hebräische Bild des lauten Klagerufs; der deutsche Plural entspricht dem mehrzahligen Subjekt natürlich.
- source_word: וַיִּבְכּוּ
  choice: weinten
  rationale: Bezeichnet hier das Weinen als Ausdruck von Trauer und Erschütterung.
- source_word: וַיִּקְרְעוּ אִישׁ מְעִלוֹ
  choice: Jeder zerriss sein Obergewand
  rationale: איש ist distributiv gebraucht; מעיל bezeichnet ein äußeres Gewand und wird mit „Obergewand“ präzise und verständlich wiedergegeben.
- source_word: וַיִּזְרְקוּ עָפָר עַל־רָאשֵׁיהֶם
  choice: sie warfen Staub über ihre Köpfe
  rationale: Gibt die gemeinsame Trauerhandlung und den hebräischen Plural wieder; „über“ passt zum anschließenden Aufwärtswerfen.
- source_word: הַשָּׁמָיְמָה
  choice: zum Himmel hin
  rationale: Die Richtungsendung wird ausdrücklich als aufwärts gerichtete Bewegung wiedergegeben, ohne das Ziel überzuinterpretieren.
