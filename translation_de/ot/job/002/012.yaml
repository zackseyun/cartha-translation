  source_fidelity: 'Die Übersetzung gibt die Abfolge und alle wesentlichen Elemente des Hebräischen zuverlässig wieder: das Aufheben der Augen aus der Ferne, das Nichtwiedererkennen, lautes Weinen, das distributive Zerreißen des Obergewands sowie das Werfen von Staub auf die Köpfe in himmelwärtiger Richtung. Der Wechsel von „Jeder“ zu „sie“ entspricht dem hebräischen distributiven Singular bei zugleich pluralischer Gruppenhandlung.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. „Aus der Ferne ihre Augen erhoben“ bewahrt die hebräische Bildsprache und bleibt idiomatisch. Die Formulierung „über ihre Köpfe zum Himmel hin“ ist leicht bildhaft, aber im Kontext der Trauergeste verständlich und durch die Anmerkung sinnvoll erläutert.
  terminology: „Obergewand“ ist für מְעִיל präzise und angemessen. „Erkannten sie ihn nicht“, „erhoben sie ihre Stimmen“ und „weinten“ treffen Sinn und Register. „Zum Himmel hin“ gibt die Richtungsnuance von הַשָּׁמַיְמָה ohne unnötige theologische Deutung wieder.
