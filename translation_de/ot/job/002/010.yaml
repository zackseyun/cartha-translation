base_translation:
  language: en
  yaml_path: translation/ot/job/002/010.yaml
  text: But he said to her[a], “You speak as one of the foolish women speaks. Shall we receive the good from God, and shall we not receive the bad?” In all this Job did not sin with his lips.
translation:
  language: de
  text: 'Doch er sagte zu ihr: „Du redest, wie eine der törichten Frauen redet. Sollten wir das Gute von Gott annehmen und das Schlechte[a] nicht auch annehmen?“ Bei alledem sündigte Hiob nicht mit seinen Lippen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „das Unglück“; traditionell „das Böse“. Das hebräische Wort bezeichnet hier im Gegensatz zum Guten schädliche oder widrige Lebensumstände.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר אַחַת הַנְּבָלוֹת תְּדַבֵּרִי
  choice: Du redest, wie eine der törichten Frauen redet
  rationale: נְבָלוֹת bezeichnet hier nicht bloß mangelnde Intelligenz, sondern Torheit mit moralisch-religiösem Gewicht. „Töricht“ bewahrt diesen Sinn in würdigem, verständlichem Deutsch; „Frauen“ ergibt sich aus der femininen Pluralform und dem Zusammenhang.
- source_word: גַּם אֶת הַטּוֹב נְקַבֵּל מֵאֵת הָאֱלֹהִים
  choice: Sollten wir das Gute von Gott annehmen
  rationale: Der Imperfekt steht zusammen mit dem folgenden verneinten Satzteil in einer rhetorischen Frage. „Das Gute“ bewahrt den Artikel und die umfassende Bezeichnung günstiger Gaben oder Lebensumstände.
- source_word: וְאֶת הָרָע לֹא נְקַבֵּל
  choice: und das Schlechte nicht annehmen
  rationale: רָע bezeichnet im Kontext das Widerwärtige oder Unheilvolle im Gegensatz zum Guten. „Das Schlechte“ erhält die sprachliche Gegenüberstellung, ohne vorschnell moralisch Böses als von Gott bewirkt zu bezeichnen. Die möglichen Wiedergaben „Unglück“ und traditionell „das Böse“ werden in der Fußnote genannt.
- source_word: בְּכָל־זֹאת
  choice: Bei alledem
  rationale: Die idiomatische Wendung leitet die zusammenfassende Bewertung des Erzählers ein und entspricht dem Umfang des hebräischen Ausdrucks.
- source_word: לֹא חָטָא אִיּוֹב בִּשְׂפָתָיו
  choice: sündigte Hiob nicht mit seinen Lippen
  rationale: Die konkrete Körpermetapher des Hebräischen bleibt erhalten und lässt die erzählerische Nuance bestehen, dass ausdrücklich Hiobs gesprochene Worte beurteilt werden.
theological_decisions:
- issue: Bedeutung von הָרָע in Beziehung zu Gott
  choice: das Schlechte
  alternative: 'Unglück; traditionell: das Böse'
  rationale: Im unmittelbaren Zusammenhang steht הָרָע für leidvolle, schädliche Lebensumstände im Gegensatz zum Guten. „Das Schlechte“ wahrt die breite lexikalische Spannung und vermeidet zugleich die eindeutige Behauptung, Gott sei Urheber moralischen Bösen. Die Fußnote hält die kontextuell präzisere und die traditionelle Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage ist als ein zusammenhängender Gegensatz formuliert; die Wiederholung von „annehmen“ bewahrt die Parallelität. „Mit seinen Lippen“ bleibt bewusst wörtlich statt durch „mit seinen Worten“ geglättet.
