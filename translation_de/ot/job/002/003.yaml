reference: Job 2:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הֲ/שַׂ֣מְתָּ לִבְּ/ךָ֮ אֶל עַבְדִּ֣/י אִיּוֹב֒ כִּי֩ אֵ֨ין כָּמֹ֜/הוּ בָּ/אָ֗רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֣ר מֵ/רָ֑ע וְ/עֹדֶ֨/נּוּ֙ מַחֲזִ֣יק בְּ/תֻמָּת֔/וֹ וַ/תְּסִיתֵ֥/נִי ב֖/וֹ לְ/בַלְּע֥/וֹ חִנָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/003.yaml
  text: Then Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil. He still holds fast his integrity[d][c][b], though you incited me against him to destroy him for nothing.”
translation:
  language: de
  text: 'Da sagte Jahwe zum Ankläger[a]: »Hast du auf meinen Diener Ijob geachtet? Denn niemand auf der Erde ist wie er: ein untadeliger und aufrechter Mann, der Gott fürchtet und sich vom Bösen abwendet. Noch immer hält er an seiner Integrität fest, obwohl du mich gegen ihn aufgestachelt hast, ihn ohne Grund zu vernichten[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch »der Ankläger«; traditionell »Satan«. Der bestimmte Artikel weist hier auf eine Rolle oder Funktionsbezeichnung hin.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »ihn zu verschlingen«. »Ohne Grund« kann auch »umsonst« bedeuten und greift wahrscheinlich die Frage des Anklägers in Ijob 1,9 auf, ob Ijob Gott »umsonst« fürchtet.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den offenbarten Gottesnamen im Deutschen in seiner etablierten modernen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הַשָּׂטָן
  choice: der Ankläger
  rationale: Der Artikel kennzeichnet hier am ehesten eine Rolle oder Amtsbezeichnung; »Ankläger« bewahrt die gegnerische und forensische Funktion, ohne vorschnell einen Eigennamen anzunehmen.
- source_word: הֲשַׂמְתָּ לִבְּךָ אֶל
  choice: Hast du dein Herz auf … gerichtet?
  rationale: Bewahrt das hebräische Bild vom Ausrichten des Herzens. Die Fußnote nennt die natürlichere sinngemäße Wiedergabe.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: Bezeichnet Ijobs Zugehörigkeit zu Gott und seinen Dienst, ohne hier unnötig die mögliche Bedeutung »Sklave« in den Vordergrund zu rücken.
- source_word: אֵין כָּמֹהוּ בָּאָרֶץ
  choice: niemand auf der Erde ist wie er
  rationale: »Erde« passt zum umfassenden Schauplatz der Erzählung besser als das ebenfalls mögliche »Land«.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: ein untadeliger und aufrechter Mann
  rationale: »Untadelig« bezeichnet charakterliche Ganzheit und Integrität, nicht absolute Sündlosigkeit; »aufrecht« gibt יָשָׁר unmittelbar wieder.
- source_word: יְרֵא אֱלֹהִים וְסָר מֵרָע
  choice: der Gott fürchtet und sich vom Bösen abwendet
  rationale: Bewahrt sowohl die ehrfürchtige Gottesfurcht als auch die aktive Abkehr vom Bösen.
- source_word: וְעֹדֶנּוּ מַחֲזִיק בְּתֻמָּתוֹ
  choice: Noch immer hält er an seiner Rechtschaffenheit fest
  rationale: »Hält … fest« gibt die Beharrlichkeit wieder; »Rechtschaffenheit« bezeichnet die Ganzheit des Charakters und greift inhaltlich תָּם auf.
- source_word: וַתְּסִיתֵנִי בוֹ
  choice: obwohl du mich gegen ihn aufgereizt hast
  rationale: Das verbindende ו wird dem Kontext entsprechend konzessiv wiedergegeben. Die direkte Aussage über Jahwes Beteiligung wird nicht abgeschwächt.
- source_word: לְבַלְּעוֹ
  choice: ihn … zu vernichten
  rationale: Das Verb bedeutet wörtlich »verschlingen«, bezeichnet hier jedoch bildlich die Vernichtung; die Fußnote erhält das konkrete hebräische Bild.
- source_word: חִנָּם
  choice: ohne Grund
  rationale: Passt hier idiomatisch zur fehlenden Ursache oder Schuld. Die Fußnote weist auf die alternative Bedeutung »umsonst« und den literarischen Rückbezug auf Ijob 1,9 hin.
theological_decisions:
- issue: Göttliche Beteiligung an Ijobs Leiden
  choice: »du mich gegen ihn aufgereizt hast« bleibt direkt stehen
  alternative: »du mich dazu gebracht hast, Leid gegen ihn zuzulassen«
  rationale: Der hebräische Text schreibt Jahwe unmittelbar eine Reaktion auf die Aufreizung des Anklägers zu. Eine Abschwächung würde die theologische Spannung des Textes vorschnell auflösen.
- issue: Identität von הַשָּׂטָן
  choice: der Ankläger
  alternative: Satan
  rationale: Der bestimmte Artikel legt in dieser Szene eine Funktionsbezeichnung nahe. Die Übersetzung vermeidet damit, die spätere Identifikation als Eigenname in den Text einzutragen.
- issue: Bedeutung von חִנָּם
  choice: ohne Grund
  alternative: umsonst
  rationale: Im unmittelbaren Satz bezeichnet der Ausdruck plausibel das Fehlen eines Grundes für Ijobs Vernichtung; zugleich bleibt durch die Fußnote das Wortspiel mit Ijob 1,9 sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Wendung »das Herz auf jemanden richten« wird wegen ihrer Bedeutung im hebräischen Menschenbild im Haupttext bewahrt; weniger geläufige oder mehrdeutige Ausdrücke werden knapp erläutert. Die Schreibung »Ijob« folgt der im heutigen deutschen Bibelgebrauch verbreiteten Form.
