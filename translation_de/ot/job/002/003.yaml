  to: 'Da sagte Jahwe zum Ankläger[a]: »Hast du auf meinen Diener Ijob geachtet? Denn niemand auf der Erde ist wie er: ein untadeliger und aufrechter Mann, der Gott fürchtet und sich vom Bösen abwendet. Noch immer hält er an seiner Integrität fest, obwohl du mich gegen ihn aufgestachelt hast, ihn ohne Grund zu vernichten[b].«'
