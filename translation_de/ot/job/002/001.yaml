base_translation:
  language: en
  yaml_path: translation/ot/job/002/001.yaml
  text: Again there was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them to present himself before Yahweh.
translation:
  language: de
  text: Wieder einmal geschah es eines Tages, dass die Söhne Gottes[a] kamen, um vor Jahwe zu treten. Auch der Widersacher[b] kam unter ihnen, um vor Jahwe zu treten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Gottes“. Gemeint sein können himmlische Wesen oder Mitglieder des göttlichen Rates.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Satan“ beziehungsweise „der Ankläger“. Im Hebräischen steht der bestimmte Artikel: „der Satan“; wahrscheinlich bezeichnet der Ausdruck hier eine Rolle als Widersacher oder Ankläger.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Wieder kam der Tag
  rationale: Die Formel nimmt die Szene aus Hiob 1,6 erneut auf. „Wieder“ macht diese Wiederholung sichtbar, während „kam der Tag“ die hebräische Erzählformel in natürlichem Deutsch wiedergibt.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: die Söhne Gottes
  rationale: Die wörtlich transparente Wiedergabe bewahrt das Bild und seine Deutungsoffenheit; eine Festlegung auf „Himmelswesen“ würde bereits interpretieren.
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: sich vor Jahwe einfinden
  rationale: Das Hitpael von יצב bezeichnet hier das förmliche Erscheinen beziehungsweise Antreten vor einem Höhergestellten. „Sich einfinden“ klingt im Deutschen natürlich und bewahrt den höfisch-gerichtlichen Rahmen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: הַשָּׂטָן
  choice: der Widersacher
  rationale: Der bestimmte Artikel spricht hier für eine Rollen- oder Amtsbezeichnung. „Der Widersacher“ gibt die Grundbedeutung wieder, ohne den Ausdruck vorschnell als festen Eigennamen zu behandeln.
- source_word: בְּתוֹכָם
  choice: in ihrer Mitte
  rationale: Die Formulierung gibt die Zugehörigkeit zur versammelten Gruppe anschaulich und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von בְּנֵי הָאֱלֹהִים
  choice: Söhne Gottes
  alternative: Himmelswesen; Mitglieder des göttlichen Rates
  rationale: Die bildhafte hebräische Bezeichnung bleibt im Haupttext erhalten; mögliche sachliche Deutungen werden in der Fußnote genannt, ohne die Spannung aufzulösen.
- issue: Titel oder Eigenname bei הַשָּׂטָן
  choice: der Widersacher
  alternative: Satan; der Ankläger
  rationale: Wegen des bestimmten Artikels liegt in diesem Zusammenhang eine Funktionsbezeichnung nahe. Die Übersetzung wahrt dies, während die geläufige Alternative in der Fußnote sichtbar bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz wird zur besseren Lesbarkeit gegliedert, ohne die Wiederaufnahme der Szene aus Hiob 1,6 zu verdecken. Die parallele Wendung für das förmliche Erscheinen vor Jahwe bleibt in beiden Satzteilen erhalten.
