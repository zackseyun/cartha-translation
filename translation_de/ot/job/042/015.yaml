source:
  edition: WLC
  text: וְ/לֹ֨א נִמְצָ֜א נָשִׁ֥ים יָפ֛וֹת כִּ/בְנ֥וֹת אִיּ֖וֹב בְּ/כָל הָ/אָ֑רֶץ וַ/יִּתֵּ֨ן לָ/הֶ֧ם אֲבִי/הֶ֛ם נַחֲלָ֖ה בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/015.yaml
  text: And nowhere in all the land were women found as beautiful as Job’s daughters[a], and their father gave them an inheritance among their brothers.
translation:
  language: de
  text: Nirgendwo im ganzen Land fand man Frauen, die so schön waren wie Hiobs Töchter[a]. Ihr Vater gab ihnen ein Erbteil unter ihren Brüdern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der ganzen Erde“.'
    reason: 'Lexikalische Alternative: הָאָרֶץ kann sowohl „Land“ als auch „Erde“ bedeuten.'
lexical_decisions:
- source_word: נִמְצָא
  choice: fand man
  rationale: Das hebräische Passiv bezeichnet hier das Vorfinden beziehungsweise Vorhandensein. Die unpersönliche deutsche Wendung „fand man“ gibt dies natürlich wieder.
- source_word: נָשִׁים יָפוֹת
  choice: Frauen, die so schön waren
  rationale: נָשִׁים bezeichnet Frauen, nicht speziell Ehefrauen; יָפוֹת bedeutet „schön“. Zusammen mit der Vergleichspartikel ergibt sich im Deutschen natürlich „so schön … wie“.
- source_word: כִּבְנוֹת אִיּוֹב
  choice: wie Hiobs Töchter
  rationale: Die Präposition כ markiert einen Vergleich; „wie Hiobs Töchter“ ist die entsprechende natürliche deutsche Form.
- source_word: בְּכָל הָאָרֶץ
  choice: im ganzen Land
  rationale: הָאָרֶץ kann „Land“ oder „Erde“ bedeuten. Im erzählerischen Zusammenhang ist „Land“ wahrscheinlich, ohne den umfassenden rhetorischen Sinn abzuschwächen.
- source_word: וַיִּתֵּן לָהֶם
  choice: gab ihnen
  rationale: Direkte und natürliche Wiedergabe von נתן mit dem pronominalen indirekten Objekt.
- source_word: נַחֲלָה
  choice: ein Erbteil
  rationale: נַחֲלָה bezeichnet Erbbesitz oder einen Anteil am Erbe. „Erbteil“ ist hier prägnant und idiomatisch.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: unter ihren Brüdern
  rationale: בְּתוֹךְ bedeutet „inmitten von/unter“, und אֲחֵיהֶם bezeichnet ausdrücklich ihre Brüder. Die Formulierung bewahrt die auffällige Angabe, dass auch die Töchter Erbbesitz erhielten.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung
  choice: unter ihren Brüdern
  alternative: unter ihren Geschwistern
  rationale: Der hebräische Text verwendet ausdrücklich die maskuline Pluralform „Brüder“. Diese wird nicht geschlechtsneutral verallgemeinert.
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: im ganzen Land
  alternative: auf der ganzen Erde
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Land“ passt besser zum erzählerischen Horizont; die Alternative wird wegen der echten Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vergleichende Aussage wird idiomatisch mit „so schön … wie“ formuliert; „Erbteil“ und „Brüder“ bewahren die sachliche und sozialgeschichtliche Präzision des Hebräischen.
