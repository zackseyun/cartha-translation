  to: Und nun nehmt euch sieben Stiere und sieben Widder, geht zu meinem Diener Ijob und bringt für euch ein Brandopfer dar. Mein Diener Ijob wird für euch beten; denn nur ihn werde ich annehmen[a], damit ich nicht eine schändliche Tat an euch begehe[b]. Denn ihr habt nicht richtig zu mir geredet[c], wie mein Diener Ijob es getan hat.
