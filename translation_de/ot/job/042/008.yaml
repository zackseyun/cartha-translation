source:
  edition: WLC
  text: וְ/עַתָּ֡ה קְחֽוּ לָ/כֶ֣ם שִׁבְעָֽה פָרִים֩ וְ/שִׁבְעָ֨ה אֵילִ֜ים וּ/לְכ֣וּ אֶל עַבְדִּ֣/י אִיּ֗וֹב וְ/הַעֲלִיתֶ֤ם עוֹלָה֙ בַּֽעַדְ/כֶ֔ם וְ/אִיּ֣וֹב עַבְדִּ֔/י יִתְפַּלֵּ֖ל עֲלֵי/כֶ֑ם כִּ֧י אִם פָּנָ֣י/ו אֶשָּׂ֗א לְ/בִלְתִּ֞י עֲשׂ֤וֹת עִמָּ/כֶם֙ נְבָלָ֔ה כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/008.yaml
  text: Take for yourselves seven bulls and seven rams[a], and go to my servant Job, and offer up a burnt offering for yourselves. And my servant Job will pray for you, for I will accept him, so that I may not deal with you disgracefully. For you have not spoken rightly about me[c][b], as my servant Job has.
translation:
  language: de
  text: Und nun nehmt euch sieben Stiere und sieben Widder, geht zu meinem Diener Ijob und bringt für euch ein Brandopfer dar. Mein Diener Ijob wird für euch beten; denn nur ihn werde ich annehmen[a], damit ich nicht eine schändliche Tat an euch begehe[b]. Denn ihr habt nicht richtig zu mir geredet[c], wie mein Diener Ijob es getan hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „denn nur sein Angesicht werde ich erheben“ – eine hebräische Wendung für Annahme oder Gunst.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit ich mit euch entsprechend eurer Torheit verfahre“. Das hebräische Wort kann Torheit, schändliches Verhalten oder eine empörende Tat bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder dem Sinn nach: „ihr habt nicht richtig über mich geredet“. Das Hebräische lautet formal „zu mir“, kann im Zusammenhang aber auf das Reden über Gott bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die hebräische Verbindung enthält ausdrücklich עַתָּה („nun, jetzt“). „Und nun“ wahrt sowohl den Anschluss an das Vorangehende als auch den Übergang zum göttlichen Auftrag.
- source_word: קְחוּ לָכֶם
  choice: nehmt euch
  rationale: Der Imperativ mit לָכֶם bezeichnet hier die Beschaffung für den eigenen Opfergang; „nehmt euch“ gibt diese Nuance knapp und natürlich wieder.
- source_word: שִׁבְעָה פָרִים וְשִׁבְעָה אֵילִים
  choice: sieben Stiere und sieben Widder
  rationale: פָּר bezeichnet hier männliche Rinder, אַיִל männliche Schafe. Das Alter der Stiere wird im Text nicht eigens bestimmt.
- source_word: עַבְדִּי אִיּוֹב
  choice: mein Diener Ijob
  rationale: עֶבֶד ist hier eine ehrende Bezeichnung für einen Gott treu Dienenden; „Diener“ ist im Deutschen angemessener als „Sklave“.
- source_word: וְהַעֲלִיתֶם עוֹלָה
  choice: bringt … ein Brandopfer dar
  rationale: Die Verbindung ist eine feste kultische Wendung für die Darbringung eines Ganzbrandopfers. „Ein Brandopfer darbringen“ ist im Deutschen idiomatisch und sachlich genau.
- source_word: בַּעַדְכֶם
  choice: für euch
  rationale: Die Präposition bezeichnet im Opferkontext die begünstigte beziehungsweise stellvertretend betroffene Personengruppe.
- source_word: יִתְפַּלֵּל עֲלֵיכֶם
  choice: soll für euch beten
  rationale: Die Form bezeichnet Gebet mit fürbittender Funktion. Nach dem vorausgehenden Auftrag gibt „soll“ den erwarteten Vollzug natürlich wieder, ohne Job einen neuen direkten Imperativ in den Mund zu legen.
- source_word: כִּי אִם פָּנָיו אֶשָּׂא
  choice: denn nur ihn werde ich annehmen
  rationale: „Das Gesicht erheben“ ist ein hebräisches Idiom für Annahme oder Gunst. כִּי אִם hebt Job als denjenigen hervor, dessen Fürbitte Gott annimmt.
- source_word: לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה
  choice: damit ich nicht eurer Torheit entsprechend mit euch verfahre
  rationale: נְבָלָה kann Torheit, schändliches Verhalten oder eine empörende Tat bezeichnen. Die Formulierung gibt den gerichtlichen Zusammenhang wieder, ohne die Mehrdeutigkeit als moralisch schändliches Handeln Gottes festzuschreiben.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: ihr habt nicht richtig zu mir geredet
  rationale: אֵלַי bedeutet formal „zu mir“. Diese Lesart bleibt im Haupttext erhalten; die kontextuell mögliche Wiedergabe „über mich“ wird in einer Fußnote genannt.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: wie mein Diener Ijob
  rationale: Der hebräische Vergleich ist elliptisch; im Deutschen lässt sich die ausgelassene verbale Aussage aus dem unmittelbar vorausgehenden Satz ohne Ergänzung verstehen.
theological_decisions:
- issue: Hiobs Rolle bei der Abwendung des Gerichts
  choice: Gott nimmt Hiob beziehungsweise seine Fürbitte an; Hiobs Gebet steht im Text als Mittel, durch das das Gericht über die Freunde abgewendet wird.
  alternative: Die Wendung bezeichnet lediglich persönliche Gunst gegenüber Hiob, ohne seine Mittlerrolle hervorzuheben.
  rationale: Die Abfolge von Opferauftrag, Hiobs Gebet und Gottes Zusage, sein Gesicht zu erheben, verbindet die Annahme unmittelbar mit Hiobs Fürbitte. Weitergehende priesterliche oder sühnetheologische Kategorien werden nicht in den Text eingetragen.
- issue: Bedeutung von נְבָלָה im angekündigten göttlichen Handeln
  choice: Gott verfährt nicht mit den Freunden entsprechend der Torheit, die in ihrem Reden zutage trat.
  alternative: Gott tut ihnen eine schändliche oder empörende Sache an.
  rationale: Das Substantiv hat beide Bedeutungsbereiche. Die Hauptfassung entspricht dem gerichtlichen Zusammenhang und vermeidet die missverständliche Aussage, Gott selbst handle moralisch schändlich; die wörtlichere Alternative bleibt in der Fußnote sichtbar.
- issue: Bezug des Redens mit אֵלַי
  choice: „zu mir“ wird als formale syntaktische Lesart im Haupttext bewahrt.
  alternative: „über mich“ als kontextuelle Deutung des Inhalts ihrer Gottesrede.
  rationale: Die Präposition אֶל weist zunächst auf Gott als Adressaten hin, während der größere Zusammenhang auch ein Reden über Gott nahelegt. Die Übersetzung wahrt diese Spannung durch Haupttext und Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Ijob“ folgt der in aktuellen deutschen Bibelausgaben verbreiteten Namensform. Der ausdrücklich vorhandene hebräische Übergang וְעַתָּה wird mit „Und nun“ wiedergegeben. Kultische Fachsprache wird auf das geläufige „Brandopfer“ beschränkt; echte lexikalische und syntaktische Mehrdeutigkeiten werden durch Fußnoten offengehalten.
