  source_fidelity: 'Die Übersetzung gibt die Satzfolge und die wesentlichen Bedeutungen des Hebräischen zuverlässig wieder: die Angehörigen und früheren Bekannten kommen zu Hiob, essen mit ihm in seinem Haus, bekunden Anteilnahme und trösten ihn wegen des von Jahwe über ihn gebrachten Unheils. Die kausative Zuschreibung an Jahwe wird weder abgeschwächt noch theologisch ausgelegt. Die distributive Wendung אִישׁ wird zutreffend durch „Jeder von ihnen“ wiedergegeben.'
  naturalness: Modernes, gut verständliches und würdiges Standarddeutsch. „Sie aßen mit ihm in seinem Haus Brot“ ist zwar leicht bibelnah in der Wortstellung, aber idiomatisch und für den angestrebten Registerton passend.
  terminology: „Jahwe“ bildet den Gottesnamen konsistent als Eigenname ab. „Unheil“ trifft רָעָה im Kontext von erlittenem Unglück. „Kesita“ wahrt die Unsicherheit des seltenen Wertbegriffs; „goldener Ring“ erhält die bei נֶזֶם bestehende Unbestimmtheit hinsichtlich Nasen- oder Ohrschmuck.
