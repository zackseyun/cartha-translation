source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ אֵ֠לָי/ו כָּל אֶחָ֨י/ו וְ/כָל אחיתי/ו וְ/כָל יֹדְעָ֣י/ו לְ/פָנִ֗ים וַ/יֹּאכְל֨וּ עִמּ֣/וֹ לֶחֶם֮ בְּ/בֵית/וֹ֒ וַ/יָּנֻ֤דוּ ל/וֹ֙ וַ/יְנַחֲמ֣וּ אֹת֔/וֹ עַ֚ל כָּל הָ֣/רָעָ֔ה אֲשֶׁר הֵבִ֥יא יְהוָ֖ה עָלָ֑י/ו וַ/יִּתְּנוּ ל֗/וֹ אִ֚ישׁ קְשִׂיטָ֣ה אֶחָ֔ת וְ/אִ֕ישׁ נֶ֥זֶם זָהָ֖ב אֶחָֽד־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/011.yaml
  text: Then all his brothers[a], all his sisters, and all who had known him before came to him, and they ate bread with him in his house. They showed him sympathy and comforted him for all the calamity that Yahweh had brought upon him[d][c][b]. And each one gave him one qesitah and one gold ring.
translation:
  language: de
  text: Dann kamen alle seine Brüder, alle seine Schwestern und alle, die ihn früher gekannt hatten,[a] zu ihm. Sie aßen mit ihm in seinem Haus Brot.[b] Sie bekundeten ihm ihr Mitgefühl und trösteten ihn über all das Unheil, das Jahwe über ihn gebracht hatte. Jeder von ihnen gab ihm eine Kesita[c] und einen goldenen Ring.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle seine früheren Bekannten«.'
    reason: lexical_alternative
  - marker: b
    text: »Brot essen« ist eine hebräische Ausdrucksweise für das gemeinsame Einnehmen einer Mahlzeit.
    reason: cultural_note
  - marker: c
    text: Die Kesita war eine alte Wertgröße oder ein Wertgegenstand; ihr genauer Gegenwert ist unbekannt.
    reason: cultural_note
  - marker: d
    text: Das hebräische Wort kann einen Ring bezeichnen, der an der Nase oder am Ohr getragen wurde.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֵלָיו
  choice: kamen … zu ihm
  rationale: Gibt die gewöhnliche narrative Form von בוא samt Richtungsangabe unmittelbar und natürlich wieder.
- source_word: כָּל אֶחָיו וְכָל אֲחִיתָיו
  choice: alle seine Brüder, alle seine Schwestern
  rationale: Bewahrt die wiederholte All-Aussage und die getrennte Nennung beider Gruppen.
- source_word: וְכָל יֹדְעָיו לְפָנִים
  choice: und alle, die ihn früher gekannt hatten
  rationale: יֹדְעָיו bezeichnet Personen, die ihn kannten; לְפָנִים setzt dieses Kennen in die frühere Zeit. Die Formulierung lässt offen, wie eng diese Beziehungen waren.
- source_word: וַיֹּאכְלוּ עִמּוֹ לֶחֶם בְּבֵיתוֹ
  choice: Sie aßen mit ihm in seinem Haus Brot
  rationale: Erhält das konkrete hebräische Bild des Brotessens, das hier für eine gemeinsam eingenommene Mahlzeit steht.
- source_word: וַיָּנֻדוּ לוֹ
  choice: Sie bekundeten ihm ihr Mitgefühl
  rationale: נוד bezeichnet hier eine Anteilnahme ausdrückende Reaktion auf sein Leid; die Wiedergabe ist im heutigen Deutsch verständlich, ohne eine bestimmte körperliche Geste festzulegen.
- source_word: וַיְנַחֲמוּ אֹתוֹ
  choice: trösteten ihn
  rationale: Entspricht der üblichen Bedeutung von נחם im Zusammenhang mit einem Leidenden.
- source_word: עַל כָּל הָרָעָה
  choice: über all das Unheil
  rationale: רָעָה bezeichnet hier erfahrenes Unglück beziehungsweise Unheil, nicht notwendig moralische Bosheit.
- source_word: אֲשֶׁר הֵבִיא יְהוָה עָלָיו
  choice: das Jahwe über ihn gebracht hatte
  rationale: Bewahrt die ausdrückliche Zuschreibung des Geschehens an Jahwe und gibt הביא על als verursachendes Herbeiführen wieder.
- source_word: וַיִּתְּנוּ לוֹ אִישׁ קְשִׂיטָה אֶחָת
  choice: Jeder von ihnen gab ihm eine Kesita
  rationale: אִישׁ hat hier verteilenden Sinn. קְשִׂיטָה wird transliteriert, weil Art und genauer Wert dieser alten Wertgröße ungewiss sind.
- source_word: וְאִישׁ נֶזֶם זָהָב אֶחָד
  choice: und einen goldenen Ring
  rationale: נֶזֶם bezeichnet einen Schmuckring, kann aber je nach Kontext einen Nasen- oder Ohrring meinen; die Haupttextfassung bewahrt diese Unbestimmtheit.
theological_decisions:
- issue: Göttliches Handeln bei Hiobs Leiden
  choice: das Jahwe über ihn gebracht hatte
  alternative: das Jahwe über ihn hatte kommen lassen
  rationale: Der hebräische Kausativ הֵבִיא schreibt Jahwe das Herbeiführen des Unheils ausdrücklich zu. Die Übersetzung mildert dies nicht zu einem bloßen Zulassen ab und erhält so die theologische Spannung des Verses.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname macht sichtbar, dass im hebräischen Text das Tetragramm steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem hebräischen Erzählgang, bleibt aber flüssig. Das konkrete Bild »Brot essen« und die unbekannte Wertbezeichnung »Kesita« bleiben erhalten und werden durch Fußnoten erläutert. Die ausdrückliche göttliche Verursachung wird nicht abgeschwächt.
