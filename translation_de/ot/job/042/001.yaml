base_translation:
  language: en
  yaml_path: translation/ot/job/042/001.yaml
  text: Then Job answered Yahweh and said:[a]
translation:
  language: de
  text: Da antwortete Ijob Jahwe und sagte:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben. Eine andere Wiedergabe ist „Jehova“.'
    reason: Alternative Wiedergaben des Gottesnamens transparent machen.
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: ענה bezeichnet in dieser Erzählformel das Antworten oder Erwidern. „Antwortete“ bewahrt die Dialogstruktur, auch wenn unmittelbar zuvor keine ausdrückliche Frage steht.
- source_word: אִיּוֹב
  choice: Ijob
  rationale: „Ijob“ ist die im modernen deutschen Bibelgebrauch etablierte Form des hebräischen Personennamens.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: אֶת kennzeichnet im Hebräischen das bestimmte direkte Objekt und hat im Deutschen keine eigenständige Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird mit der im Deutschen geläufigen wissenschaftlichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die übliche hebräische Fortsetzungsformel wird transparent und natürlich mit „und sagte“ wiedergegeben.
- source_word: וַ
  choice: Da
  rationale: Das einleitende וַ führt die Erzählung weiter. „Da“ drückt die zeitlich-logische Folge in natürlichem, würdigem Deutsch aus; „Und“ wäre ebenfalls möglich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen in einer im Deutschen etablierten Form; die traditionelle Ersetzung durch „der HERR“ und die Form „Jehova“ werden in der Fußnote genannt.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die traditionelle Erzählformel bleibt erkennbar, ohne den hebräischen Satzbau unnötig nachzuahmen.
