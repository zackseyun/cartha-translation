  text: לְ/שֵֽׁמַע אֹ֥זֶן שְׁמַעְתִּ֑י/ךָ וְ֝/עַתָּ֗ה עֵינִ֥/י רָאָֽתְ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/005.yaml
  text: I had heard of you by the hearing of the ear[a], but now my eye has seen you.
translation:
  language: de
  text: Vom Hörensagen hatte ich von dir gehört[a], doch nun hat mein Auge dich gesehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch das Hören des Ohres«; auch: »durch das, was das Ohr hört«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: vom Hörensagen
  rationale: Die hebräische Wendung verbindet »Hören« und »Ohr« und bezeichnet hier eine mittelbare Kenntnis durch Gehörtes. »Vom Hörensagen« gibt den idiomatischen Sinn natürlich wieder; die wörtliche Bildsprache wird in der Fußnote bewahrt.
- source_word: שְׁמַעְתִּיךָ
  choice: hatte ich von dir gehört
  rationale: Wörtlich steht »hatte ich dich gehört«. Im Zusammenhang bezeichnet die Form jedoch das bisherige Wissen über Gott aufgrund eines Berichts; »von dir gehört« drückt dies im Deutschen idiomatisch aus. Das Plusquamperfekt verdeutlicht den Gegensatz zu »nun«.
- source_word: וְעַתָּה
  choice: doch nun
  rationale: Das einfache Bindewort erhält hier durch den Gegensatz zwischen früherem Hören und gegenwärtigem Sehen adversative Kraft. »Doch nun« gibt diesen Kontrast in natürlichem Deutsch wieder.
- source_word: עֵינִי
  choice: mein Auge
  rationale: Der hebräische Text verwendet den Singular. Seine Beibehaltung wahrt die poetische Ausdrucksweise und die unmittelbare persönliche Aussage.
- source_word: רָאָתְךָ
  choice: hat dich gesehen
  rationale: Das Perfekt beschreibt ein vollzogenes Sehen mit gegenwärtiger Bedeutung. Das deutsche Perfekt ist hier natürlich und erhält die direkte Aussage des Verbs.
theological_decisions:
- issue: Art von Hiobs »Sehen« Gottes
  choice: »hat mein Auge dich gesehen« ohne erläuternde Einschränkung
  alternative: »hat mein Auge dich erkannt« oder »bin ich dir unmittelbar begegnet«
  rationale: Das hebräische Verb bedeutet schlicht »sehen«. Die Übersetzung bewahrt den Gegensatz von mittelbarem Hören und unmittelbarem Sehen, ohne festzulegen, ob dieses Sehen körperlich, visionär oder metaphorisch zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Vom Hörensagen hatte ich von dir gehört« nimmt die bewusste Wiederholung des hebräischen Wortfelds »hören« auf, während »mein Auge« den poetischen Singular bewahrt.
