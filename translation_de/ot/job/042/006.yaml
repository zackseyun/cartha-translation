  text: עַל כֵּ֭ן אֶמְאַ֣ס וְ/נִחַ֑מְתִּי עַל עָפָ֥ר וָ/אֵֽפֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/042/006.yaml
  text: Therefore I despise myself[a], and I repent in dust and ashes.
translation:
  language: de
  text: Darum verachte ich mich selbst[a] und bereue in Staub und Asche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Darum widerrufe ich und ändere meine Haltung in Bezug auf Staub und Asche.“ Das Hebräische ist knapp und umstritten: Bei „verachte“ ist kein Objekt ausdrücklich genannt; das folgende Verb kann je nach Zusammenhang auch „widerrufen“, „nachgeben“ oder „getröstet werden“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung kennzeichnet Hiobs Schlussfolgerung aus der Gottesbegegnung und schließt im modernen Deutsch natürlich an Vers 5 an.
- source_word: אֶמְאַס
  choice: verwerfe ich mich selbst
  rationale: מאס bedeutet gewöhnlich „verwerfen, verschmähen“. Da im Hebräischen kein Objekt genannt ist, wird „mich selbst“ kontextgemäß ergänzt; die Ellipse und die mögliche Bedeutung „ich widerrufe“ werden in der Fußnote kenntlich gemacht.
- source_word: וְנִחַמְתִּי
  choice: und bereue
  rationale: Das Nifal von נחם kann je nach Zusammenhang bereuen, sich anders besinnen, nachgeben oder getröstet werden bedeuten. Hier ist „bereue“ im Zusammenhang eine knappe, natürliche Wiedergabe, ohne die anderen Möglichkeiten zu verschweigen.
- source_word: עַל
  choice: in
  rationale: Obwohl die Präposition wörtlich unter anderem „auf, über, hinsichtlich“ bedeuten kann, gibt „in“ die idiomatische Verbindung mit „Staub und Asche“ als Zustand beziehungsweise Haltung im Deutschen gut wieder.
- source_word: עָפָר וָאֵפֶר
  choice: Staub und Asche
  rationale: Die feste Wortverbindung bezeichnet Sterblichkeit, Erniedrigung und Trauer und ist auch im modernen Deutschen verständlich und würdevoll.
theological_decisions:
- issue: 'Hiobs abschließende Reaktion: Selbsterniedrigung und Reue oder Widerruf seiner bisherigen Worte beziehungsweise Klage'
  choice: Hiob verwirft sich selbst und bereut in Staub und Asche.
  alternative: Hiob widerruft und besinnt sich anders hinsichtlich Staub und Asche; möglich ist auch, dass er seine frühere Klage verwirft, ohne sich selbst ausdrücklich zum Objekt zu machen.
  rationale: 'Der hebräische Satz ist äußerst knapp: Das Objekt von אֶמְאַס bleibt unausgesprochen, und וְנִחַמְתִּי sowie עַל lassen mehrere Deutungen zu. Vers 5 stützt eine demütige, reuevolle Reaktion, doch die textlich möglichen Alternativen werden in der Fußnote bewahrt.'
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die traditionelle Wendung „Staub und Asche“ bleibt erhalten. Die Hauptfassung ist bewusst knapp; die echte sprachliche und theologische Mehrdeutigkeit wird durch die Fußnote offengehalten.
