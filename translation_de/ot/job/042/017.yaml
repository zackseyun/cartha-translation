  text: And Job died[a], old and full of days.
translation:
  language: de
  text: Und Hiob starb, alt und lebenssatt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „satt an Tagen“; gemeint ist, dass Hiob ein langes, erfülltes Leben gehabt hatte.'
