lexical_decisions:
- source_word: וַיָּמָת
  choice: Und … starb
  rationale: Das Wayyiqtol von מות führt das nächste Ereignis der Erzählfolge ein. „Und … starb“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: אִיּוֹב
  choice: Hiob
  rationale: Der Eigenname wird gemäß der etablierten deutschen Bibeltradition als „Hiob“ wiedergegeben.
- source_word: זָקֵן
  choice: alt
  rationale: Das Adjektiv bezeichnet ein hohes Alter; „alt“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: וּשְׂבַע יָמִים
  choice: und lebenssatt
  rationale: Die hebräische Wendung bedeutet wörtlich etwa „der Tage satt“ und bezeichnet in Todesnotizen ein erfülltes, voll ausgeschöpftes Leben. „Lebenssatt“ bewahrt das Bild der Sättigung in einer würdigen, geläufigen deutschen Form.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles modernes Standarddeutsch. „Lebenssatt“ erhält die hebräische Bildsprache, während die Fußnote den wörtlichen Ausdruck und seine idiomatische Bedeutung erklärt.
