  text: וַ/יְהִ֗י אַחַ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל אִיּ֑וֹב וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל אֱלִיפַ֣ז הַ/תֵּֽימָנִ֗י חָרָ֨ה אַפִּ֤/י בְ/ךָ֙ וּ/בִ/שְׁנֵ֣י רֵעֶ֔י/ךָ כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/007.yaml
  text: And it happened[a], after Yahweh had spoken these words to Job, that Yahweh said to Eliphaz the Temanite, “My anger burns against you and against your two friends, because you have not spoken rightly of me, as my servant Job has.”
translation:
  language: de
  text: 'Nachdem Jahwe diese Worte zu Ijob gesprochen hatte, sagte Jahwe zu Elifas, dem Temaniter: »Mein Zorn ist gegen dich und deine beiden Freunde entbrannt, denn ihr habt nicht richtig über mich gesprochen[a], wie mein Diener Ijob.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr habt nicht in rechter Weise zu mir gesprochen, wie mein Diener Ijob.« Die hebräische Präposition bedeutet wörtlich »zu mir«, kann hier im Zusammenhang aber auch »über mich« oder »in Bezug auf mich« meinen.'
    reason: Bewahrt die lexikalische und syntaktische Mehrdeutigkeit von אֵלַי, ohne die adverbiale Funktion von נְכוֹנָה zu verändern.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen in der im Deutschen geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיְהִי אַחַר
  choice: Nachdem
  rationale: Die hebräische Erzählungsformel leitet hier einen zeitlichen Folgesatz ein; die knappe deutsche Wiedergabe ist natürlich und bewahrt die Abfolge.
- source_word: דִּבֶּר ... אֶת־הַדְּבָרִים הָאֵלֶּה אֶל אִיּוֹב
  choice: diese Worte zu Ijob gesprochen hatte
  rationale: Das Plusquamperfekt verdeutlicht die Vorzeitigkeit; אֶל bezeichnet Ijob als Adressaten.
- source_word: אֱלִיפַז הַתֵּימָנִי
  choice: Elifas, dem Temaniter
  rationale: Verwendet die im Deutschen üblichen biblischen Namensformen und gibt das Herkunftsadjektiv substantivisch wieder.
- source_word: חָרָה אַפִּי
  choice: Mein Zorn ist ... entbrannt
  rationale: Bewahrt das lebendige hebräische Bild des entflammten Zorns in idiomatischem, würdigem Deutsch.
- source_word: בְךָ וּבִשְׁנֵי רֵעֶיךָ
  choice: gegen dich und deine beiden Freunde
  rationale: Die Präposition bezeichnet bei dieser Zornesformel die Personen, gegen die sich der Zorn richtet.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: ihr habt nicht richtig über mich gesprochen
  rationale: נְכוֹנָה wird bewusst weit als »richtig« wiedergegeben; אֵלַי ist kontextuell auf den Inhalt ihrer Aussagen über Gott bezogen, wobei die wörtlichere Alternative in der Fußnote erhalten bleibt.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: wie mein Diener Ijob
  rationale: Bewahrt sowohl den Vergleich mit Ijob als auch die bedeutsame Bezeichnung »mein Diener«.
theological_decisions:
- issue: 'Bezug von אֵלַי: »über mich« oder »zu mir«'
  choice: über mich
  alternative: zu mir
  rationale: Im Zusammenhang beurteilt Gott den Inhalt der Reden über ihn. Da die Präposition wörtlich »zu mir« lautet und auch eine direkte Anrede Gottes denkbar bleibt, wird diese echte Mehrdeutigkeit in einer Fußnote offengelegt.
- issue: Bedeutungsumfang von נְכוֹנָה
  choice: richtig
  alternative: das Rechte / zutreffend
  rationale: »Richtig« lässt offen, ob besonders sachliche Wahrheit, angemessene Rede oder theologische Redlichkeit gemeint ist, und verengt Gottes Urteil nicht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die traditionelle deutsche Schreibweise »Ijob« wird verwendet; die Bildsprache der Zornesformel bleibt erhalten.
