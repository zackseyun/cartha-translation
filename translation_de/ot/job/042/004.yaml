  text: שְֽׁמַֽע נָ֭א וְ/אָנֹכִ֣י אֲדַבֵּ֑ר אֶ֝שְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/004.yaml
  text: Hear[a], please, and I will speak; I will ask you[b], and you declare to me.
translation:
  language: de
  text: Hör[a] doch, und ich will reden; ich will dich fragen[b], und du lass es mich wissen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hiob greift hier nahezu wörtlich die früheren Worte des HERRN aus Hiob 38,3 und 40,7 auf.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich kausativ: „und mach, dass ich erkenne/weiß“; auch: „und teile es mir mit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Hör
  rationale: Der Imperativ gibt die direkte Aufforderung wieder und bewahrt den feierlichen Ton sowie den Anklang an die früheren Worte des HERRN.
- source_word: נָא
  choice: doch
  rationale: Die Partikel mildert die Aufforderung als Bitte; „doch“ ist hier idiomatisches, modernes Deutsch, ohne ein zeitliches „nun“ einzutragen.
- source_word: וְאָנֹכִי אֲדַבֵּר
  choice: und ich will reden
  rationale: Bewahrt die einfache Satzfolge und hebt durch „ich“ entsprechend dem selbstständigen Pronomen אָנֹכִי den Sprecher hervor.
- source_word: אֶשְׁאָלְךָ
  choice: ich will dich fragen
  rationale: Gibt שאל mit dem Suffix der zweiten Person Singular unmittelbar und ohne die stärkere Deutung „verhören“ oder „befragen“ wieder.
- source_word: וְהוֹדִיעֵנִי
  choice: und du lass es mich wissen
  rationale: 'Gibt den kausativen Hifil-Imperativ von ידע möglichst transparent wieder: Der Angesprochene soll bewirken, dass Hiob Erkenntnis erhält.'
theological_decisions:
- issue: Beziehung zu Hiob 38,3 und 40,7
  choice: Die Worte werden ohne ergänzendes „Du hast gesagt“ unmittelbar wiedergegeben; der Rückverweis steht in einer Fußnote.
  alternative: 'Explizite Kennzeichnung als Zitat, etwa: „Du hast gesagt: …“'
  rationale: Der hebräische Text enthält keine Zitateinleitung. So bleibt offen, ob die Zeile formal als Zitat oder als bewusste Wiederaufnahme verstanden wird, während der deutliche Anklang kenntlich gemacht wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hör doch“ wahrt die bittende Partikel ohne altertümliches „ich bitte dich“; „ich will reden“ erhält den formellen biblischen Ton. Die markierten Fußnoten [a] und [b] stehen unmittelbar bei den jeweils erläuterten Wendungen.
