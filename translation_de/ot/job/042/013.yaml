- source_word: וַיְהִי ... לוֹ
  choice: Er hatte auch
  rationale: Die hebräische Existenz- und Besitzkonstruktion wörtlich »und es war ihm« wird im natürlichen modernen Deutsch mit »er hatte« wiedergegeben. »Auch« markiert den erzählerischen Anschluss an die zuvor geschilderte Wiederherstellung.
- source_word: שִׁבְעָנָה בָנִים
  choice: sieben Söhne
  rationale: Die Kardinalzahl und die ausdrücklich männliche Verwandtschaftsbezeichnung werden genau und idiomatisch wiedergegeben.
- source_word: וְשָׁלֹשׁ בָּנוֹת
  choice: und drei Töchter
  rationale: Die Konjunktion, die Kardinalzahl und die ausdrücklich weibliche Verwandtschaftsbezeichnung werden direkt und natürlich übersetzt.
