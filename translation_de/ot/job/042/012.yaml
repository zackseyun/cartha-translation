language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה בֵּרַ֛ךְ אֶת אַחֲרִ֥ית אִיּ֖וֹב מֵ/רֵאשִׁת֑/וֹ וַֽ/יְהִי ל֡/וֹ אַרְבָּעָה֩ עָשָׂ֨ר אֶ֜לֶף צֹ֗אן וְ/שֵׁ֤שֶׁת אֲלָפִים֙ גְּמַלִּ֔ים וְ/אֶֽלֶף צֶ֥מֶד בָּקָ֖ר וְ/אֶ֥לֶף אֲתוֹנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/012.yaml
  text: And Yahweh blessed the latter part of Job more than his beginning[a]. And he had fourteen thousand sheep, six thousand camels, a thousand yoke of oxen[b], and a thousand female donkeys.
translation:
  language: de
  text: Und Jahwe segnete Hiobs spätere Lebenszeit in höherem Maß als seine frühere[a]. Er besaß vierzehntausend Stück Kleinvieh, sechstausend Kamele, tausend Rindergespanne[b] und tausend Eselinnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Hiobs Ende mehr als seinen Anfang“. Gemeint ist der spätere Abschnitt seines Lebens im Vergleich zu seinem früheren Zustand.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „tausend Paar Rinder“; wörtlich: „tausend Joch Rinder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Und Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben; das וַ־ führt die Erzählung mit „Und“ fort.
- source_word: בֵּרַךְ
  choice: segnete
  rationale: „Segnete“ bewahrt sowohl das konkrete Wohlergehen als auch Gott als dessen Urheber, ohne den Ausdruck auf materiellen Wohlstand zu verengen.
- source_word: אַחֲרִית אִיּוֹב מֵרֵאשִׁתוֹ
  choice: Hiobs spätere Lebenszeit mehr als seine frühere
  rationale: אַחֲרִית bezeichnet hier Hiobs spätere Zeit beziehungsweise sein späteres Ergehen im Gegensatz zu seinem Anfang. „Lebenszeit“ macht diesen zeitlichen Bezug im Deutschen verständlich, ohne den Ausdruck auf seine allerletzten Tage zu beschränken.
- source_word: וַיְהִי לוֹ
  choice: Er besaß
  rationale: Die hebräische Existenzkonstruktion bedeutet wörtlich „es war ihm“; „er besaß“ ist im Deutschen die natürliche Formulierung für den folgenden Viehbestand.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף צֹאן
  choice: vierzehntausend Stück Kleinvieh
  rationale: צֹאן ist eine Sammelbezeichnung für Schafe und Ziegen. „Kleinvieh“ bewahrt diese begriffliche Breite besser als die Verengung auf „Schafe“.
- source_word: שֵׁשֶׁת אֲלָפִים גְּמַלִּים
  choice: sechstausend Kamele
  rationale: Direkte und idiomatische Wiedergabe der Zahl und Tierbezeichnung.
- source_word: אֶלֶף צֶמֶד בָּקָר
  choice: tausend Rindergespanne
  rationale: צֶמֶד bezeichnet ein Paar beziehungsweise Joch von Arbeitstieren. „Rindergespanne“ vermittelt knapp, dass tausend zusammen eingesetzte Paare gemeint sind.
- source_word: אֶלֶף אֲתוֹנוֹת
  choice: tausend Eselinnen
  rationale: אֲתוֹנוֹת bezeichnet ausdrücklich weibliche Esel; „Eselinnen“ erhält diese Spezifizierung in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ wahrt dessen Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
- issue: Art des Segens in Hiobs späterer Lebenszeit
  choice: segnete
  alternative: ließ es ihm gut gehen
  rationale: Die Formulierung lässt die theologische Aussage des Verbs ברך bestehen und reduziert den Segen nicht auf die anschließend genannten materiellen Güter.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der zweite Satz beginnt ohne ein zusätzliches „Und“, da der hebräische Erzählanschluss im Deutschen auch durch die bloße Satzfolge natürlich wiedergegeben wird. „Kleinvieh“ wahrt die Breite des hebräischen Sammelbegriffs; „Rindergespanne“ vermittelt den landwirtschaftlichen Sinn von paarweise eingesetzten Tieren.
