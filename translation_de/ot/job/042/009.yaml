base_translation:
  language: en
  yaml_path: translation/ot/job/042/009.yaml
  text: So Eliphaz the Temanite[a], Bildad the Shuhite, and Zophar the Naamathite went and did as Yahweh had spoken to them, and Yahweh accepted Job.
translation:
  language: de
  text: Da gingen Elifas, der Temaniter, Bildad, der Schuchiter, und Zofar, der Naamatiter, hin und taten, was Jahwe ihnen gesagt hatte. Und Jahwe zeigte sich Hiob gegenüber wohlwollend.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jahwe erhob das Angesicht Hiobs“; eine hebräische Redewendung dafür, jemandem Wohlwollen oder Gunst zu erweisen.'
    reason: Die Fußnote bewahrt das wörtliche Bild und erläutert den idiomatischen Sinn der Übersetzung.
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Da gingen ... hin
  rationale: Das Wayyiqtol führt die Erzählung fort. „Da gingen … hin“ ist im Deutschen natürlich und gibt den Fortgang der Handlung wieder, ohne ein Ziel hinzuzufügen.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: der Temaniter / der Schuchiter / der Naamatiter
  rationale: Die Gentilicia bezeichnen Herkunft oder Zugehörigkeit. Die im Deutschen üblichen substantivischen Formen bewahren den Eigennamencharakter.
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם
  choice: und taten, was Jahwe ihnen gesagt hatte
  rationale: Die Wendung bezeichnet die Ausführung der zuvor erteilten Anweisung. Das Plusquamperfekt „gesagt hatte“ macht die zeitliche Vorordnung im Deutschen klar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: וַיִּשָּׂא יְהוָה אֶת פְּנֵי אִיּוֹב
  choice: Und Jahwe nahm Hiob gnädig an
  rationale: Die hebräische Wendung „das Angesicht von jemandem erheben/annehmen“ bezeichnet eine wohlwollende Annahme. „gnädig annehmen“ vermittelt den idiomatischen Sinn und lässt zugleich erkennen, dass es um göttliche Gunst geht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Transliteration „Jahwe“ bewahrt ihn als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Gottes Reaktion auf Hiob in der Wendung נשׂא פנים
  choice: Jahwe nahm Hiob gnädig an
  alternative: Jahwe erhörte Hiob / Jahwe wandte sich Hiob wohlwollend zu
  rationale: Der Kontext betrifft zwar Hiobs Fürbitte, doch das Verb sagt nicht ausdrücklich „erhören“. Die gewählte Fassung bewahrt die breitere Bedeutung wohlwollender Annahme und vermeidet eine unnötige dogmatische Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namensformen folgen geläufiger deutscher Bibelschreibung; der Satzbau bleibt erzählerisch und gut verständlich. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Aussage.
