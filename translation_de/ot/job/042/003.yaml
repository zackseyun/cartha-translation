source:
  edition: WLC
  text: מִ֤י זֶ֨ה מַעְלִ֥ים עֵצָ֗ה בְּֽלִ֫י דָ֥עַת לָ/כֵ֣ן הִ֭גַּדְתִּי וְ/לֹ֣א אָבִ֑ין נִפְלָא֥וֹת מִ֝מֶּ֗/נִּי וְ/לֹ֣א אֵדָֽע׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/003.yaml
  text: ‘Who is this who hides counsel without knowledge?’ Therefore I have spoken, but I did not understand—things too wonderful for me[b][a], which I did not know.
translation:
  language: de
  text: »Wer ist es, der den Ratschluss ohne Erkenntnis verhüllt?«[a] Darum habe ich geredet, doch ich verstand nicht – Dinge, die zu wunderbar für mich sind[b] und die ich nicht kannte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditioneller: »den Ratschluss ohne Erkenntnis verdunkelt«. Ijobs Wortlaut unterscheidet sich hier im Hebräischen von Ijob 38,2.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Dinge, die über mich hinausgehen« beziehungsweise »Wunder, die mein Begreifen übersteigen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Wer ist es
  rationale: Bewahrt die direkte Frageform und klingt im modernen Standarddeutsch natürlich.
- source_word: מַעְלִים
  choice: verhüllt
  rationale: Das Hifil von עלם bezeichnet hier ein Verbergen oder Verhüllen. So bleibt der Wortlaut von 42,3 von dem abweichenden Verb in 38,2 unterschieden.
- source_word: עֵצָה
  choice: Ratschluss
  rationale: Gibt den Gedanken göttlicher Beratung, Weisheit und Absicht würdig wieder, ohne ihn auf einen bloßen Einzelplan zu verengen.
- source_word: בְּלִי דָעַת
  choice: ohne Erkenntnis
  rationale: Nahe Wiedergabe der hebräischen Wendung; zugleich bleibt der Bezug auf Ijobs mangelnde Einsicht erhalten.
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet in natürlichem Deutsch die Folgerung aus der angeführten Frage.
- source_word: הִגַּדְתִּי
  choice: habe ich geredet
  rationale: Bezeichnet im Zusammenhang Ijobs vorausgegangenes Reden und vermeidet die zu feierliche oder zu starke Nuance von »verkündet«.
- source_word: וְלֹא אָבִין
  choice: doch ich verstand nicht
  rationale: Das adversative »doch« macht den im Zusammenhang liegenden Gegensatz zwischen Reden und fehlendem Verstehen deutlich; die Vergangenheitsform passt zu Ijobs Rückblick.
- source_word: נִפְלָאוֹת מִמֶּנִּי
  choice: Dinge, die zu wunderbar für mich sind
  rationale: Gibt sowohl den substantivischen Plural als auch den idiomatischen Sinn von Dingen wieder, die Ijobs Fassungsvermögen übersteigen.
- source_word: וְלֹא אֵדָע
  choice: und die ich nicht kannte
  rationale: Die Relativverbindung ist eine behutsame deutsche Glättung; »kannte« gibt hier Ijobs fehlende Kenntnis dieser Dinge natürlich wieder.
theological_decisions:
- issue: Verhältnis von Ijob 42,3 zur Gottesrede in Ijob 38,2
  choice: Den in 42,3 tatsächlich belegten Ausdruck mit »den Ratschluss verhüllt« wiedergeben.
  alternative: »den Ratschluss verdunkelt«
  rationale: Ijob greift die frühere Zurechtweisung auf, verwendet hier im Hebräischen jedoch עלם und nicht das Verb חשך aus 38,2. Die Übersetzung wahrt diesen lexikalischen Unterschied und harmonisiert die Stellen nicht.
- issue: Verhältnis von Ijobs Reden zu seinem mangelnden Verstehen
  choice: »habe ich geredet, doch ich verstand nicht«
  alternative: »habe ich über Dinge geredet, die ich nicht verstand«
  rationale: Die gewählte Fassung bewahrt die formale Nebenordnung des Hebräischen und die Spannung zwischen Ijobs Reden und seiner fehlenden Einsicht, ohne die zweite Aussage stillschweigend in einen Relativsatz umzuwandeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Frage wird als Zitat kenntlich gemacht. »Ratschluss« wahrt den weisheitlichen und theologischen Gehalt, während »verhüllt« dem konkreten hebräischen Verb von 42,3 folgt. Der Gedankenstrich markiert die nachgestellte Erläuterung, ohne die syntaktische Spannung des Ausgangstextes aufzulösen.
