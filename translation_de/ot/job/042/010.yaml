base_translation:
  language: en
  yaml_path: translation/ot/job/042/010.yaml
  text: And Yahweh restored Job’s fortunes when he prayed for his friends[c][b][a], and Yahweh gave Job twice as much as he had before.
translation:
  language: de
  text: Und Jahwe stellte Hiobs Geschick wieder her[a], als er für seine Freunde[b] betete. Und Jahwe gab Hiob doppelt so viel, wie er vorher besessen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »wandte Hiobs Gefangenschaft«. Die hebräische Redewendung meint hier die Wiederherstellung beziehungsweise Wendung seiner Lage, nicht unbedingt die Befreiung aus tatsächlicher Gefangenschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zugunsten seiner Freunde«; »für seine Freunde« bezeichnet hier die Fürbitte für sie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen in seiner im Deutschen üblichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: שָׁב אֶת שבית
  choice: wendete Hiobs Geschick
  rationale: Die hebräische Wendung bezeichnet hier die Wiederherstellung beziehungsweise Umkehr von Hiobs Lage und nicht notwendig die Befreiung aus buchstäblicher Gefangenschaft.
- source_word: בְּהִתְפַּלְלוֹ
  choice: als er … betete
  rationale: Die Präposition mit dem Infinitiv bezeichnet den zeitlichen Begleitumstand; die Wiedergabe bewahrt den Zusammenhang, ohne ausdrücklich eine Ursache zu behaupten.
- source_word: בְּעַד רֵעֵהוּ
  choice: für seine Freunde
  rationale: בְּעַד drückt stellvertretendes Eintreten aus; רֵעֵהוּ bezieht sich im Kontext kollektiv auf Hiobs Freunde.
- source_word: וַיֹּסֶף
  choice: gab
  rationale: Das Verb bedeutet hinzufügen oder vermehren. Zusammen mit לְמִשְׁנֶה ergibt sich im Deutschen natürlich, dass Jahwe Hiobs früheren Besitz verdoppelt wiedergab.
- source_word: אֶת כָּל אֲשֶׁר לְאִיּוֹב לְמִשְׁנֶה
  choice: gab Hiob doppelt so viel, wie er vorher besessen hatte
  rationale: Die Formulierung gibt den gesamten früheren Besitz Hiobs und dessen Verdoppelung klar und idiomatisch wieder.
theological_decisions:
- issue: Verhältnis zwischen Hiobs Fürbitte und der Wiederherstellung seines Geschicks
  choice: 'Zeitliche Verknüpfung: „als er … betete“'
  alternative: 'Kausale Wiedergabe: „weil er … betete“'
  rationale: Die hebräische Konstruktion kann Zeit oder Begleitumstand ausdrücken. Sie verbindet die Fürbitte mit der Wiederherstellung, begründet aber nicht eindeutig einen mechanischen Ursache-Wirkungs-Zusammenhang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Geschick wenden“ bewahrt den bildhaften Charakter des hebräischen Idioms, während der zweite Satz die Verdoppelung des früheren Besitzes natürlich und klar ausdrückt.
