  source_fidelity: '„Ich weiß, dass du alles vermagst“ gibt ידעתי כי כל תוכל idiomatisch und umfassend wieder. Die zweite Aussage „dass kein Vorhaben von dir vereitelt werden kann“ trifft im Kontext die etablierte und semantisch tragfähige Deutung von ולא יבצר ממך מזמה: Kein göttlicher Vorsatz wird vereitelt. Die mit מן mögliche Nuance des Unzugänglich- bzw. Verwehrtseins wird in der Fußnote angemessen kenntlich gemacht.'
