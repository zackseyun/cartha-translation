  yaml_path: translation/ot/job/042/002.yaml
  text: I know that you can do all things[a], and no purpose of yours can be thwarted.
translation:
  language: de
  text: Ich weiß, dass du alles vermagst und dass kein Vorhaben von dir vereitelt werden kann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und kein Plan kann dir verwehrt werden.“ Das hebräische Substantiv kann „Vorhaben“, „Plan“ oder „Absicht“ bedeuten; das Verb kann ausdrücken, dass etwas zurückgehalten, verhindert oder vereitelt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: Ich weiß
  rationale: Das Qal-Perfekt 2. Person Maskulin Singular ist an Gott gerichtet. Im gegenwärtigen Bekenntnis Hiobs gibt das deutsche Präsens den zuständlichen Sinn natürlich wieder.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt von Hiobs Bekenntnis ein.
- source_word: כֹל תּוּכָל
  choice: du alles vermagst
  rationale: יכל bezeichnet Fähigkeit oder Macht. „Alles vermögen“ wahrt die umfassende Aussage und klingt würdig, ohne eine bestimmte Handlung zu ergänzen.
- source_word: וְלֹא יִבָּצֵר
  choice: und dass … nicht vereitelt werden kann
  rationale: Das Nifal von בצר mit מן bezeichnet hier, dass etwas nicht zurückgehalten, verhindert oder unerreichbar gemacht werden kann. In Verbindung mit מְזִמָּה gibt „vereitelt werden“ den Sinn idiomatisch wieder.
- source_word: מִמְּךָ
  choice: von dir
  rationale: Die Wendung bezeichnet das Vorhaben als von Gott ausgehend beziehungsweise ihm zugehörig; „von dir“ bleibt nahe an der hebräischen Präposition und ist im Deutschen natürlich.
- source_word: מְזִמָּה
  choice: Vorhaben
  rationale: Das Substantiv kann „Plan“, „Vorhaben“, „Absicht“ oder kontextabhängig „Anschlag“ bedeuten. „Vorhaben“ bewahrt die intentionale Bedeutung ohne negative Nebenbedeutung.
theological_decisions:
- issue: Aussage über Gottes Macht und die Unverhinderbarkeit seines Vorhabens
  choice: du alles vermagst und dass kein Vorhaben von dir vereitelt werden kann
  alternative: du alles tun kannst und kein Plan von dir verhindert werden kann
  rationale: Die Übersetzung bekräftigt Gottes umfassende Fähigkeit und die Unverhinderbarkeit seines Vorhabens, ohne die Aussage zu einem weitergehenden dogmatischen Lehrsatz auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vermagst“ ist leicht gehoben, aber allgemein verständlich und für das feierliche Bekenntnis passend; die echte lexikalische Spannweite der zweiten Vershälfte wird in der Fußnote erhalten.
