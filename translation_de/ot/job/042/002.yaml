  terminology: „Vorhaben“ ist für מזמה sachlich und vermeidet die im Deutschen möglichen negativen Konnotationen von „Anschlag“ oder „Machenschaft“. „Vereitelt werden“ gibt die kontextuelle Wirkung des Nifal idiomatisch wieder. Die Fußnote bietet mit „Plan“ und „Absicht“ sinnvolle lexikalische Alternativen, ohne eine dogmatische Auslegung hinzuzufügen.
