  yaml_path: translation/ot/job/042/016.yaml
  text: After this[a], Job lived one hundred and forty years, and saw his sons and his grandsons, four generations.
translation:
  language: de
  text: Danach lebte Hiob hundertvierzig Jahre und sah seine Söhne und die Söhne seiner Söhne bis in die vierte Generation.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: lebte … noch
  rationale: Die Erzählform von חיה bezeichnet hier Hiobs weiteres Leben nach den vorangegangenen Ereignissen; „lebte … noch“ gibt diesen Fortbestand im Deutschen natürlich wieder.
- source_word: אַחֲרֵי זֹאת
  choice: Danach
  rationale: Die Wendung markiert die zeitliche Folge nach dem zuvor Berichteten. „Danach“ ist knapp, idiomatisch und inhaltlich genau.
- source_word: מֵאָה וְאַרְבָּעִים שָׁנָה
  choice: hundertvierzig Jahre
  rationale: Dies entspricht der hebräischen Zahlenangabe unmittelbar und ist im modernen Deutschen die übliche Form.
- source_word: וַיַּרְא
  choice: sah
  rationale: ראה bedeutet unmittelbar „sehen“. Die Übersetzung bewahrt die schlichte Aussage, statt sie im Haupttext zu „erlebte noch“ auszudeuten.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Der hebräische Text verwendet ausdrücklich den maskulinen Plural „Söhne“, nicht einen allgemeinen Ausdruck für Kinder.
- source_word: בְּנֵי בָנָיו
  choice: die Söhne seiner Söhne
  rationale: Die Wiedergabe erhält die konkrete hebräische Formulierung und ihre männliche Bezugnahme; „Enkel“ wäre idiomatischer, aber weniger formal genau.
- source_word: אַרְבָּעָה דֹּרוֹת
  choice: vier Generationen
  rationale: Die knappe Apposition entspricht der Struktur des Hebräischen und lässt offen, wie genau Hiobs eigene Generation bei der Zählung einbezogen ist.
