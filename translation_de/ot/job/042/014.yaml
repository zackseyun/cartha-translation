base_translation:
  language: en
  yaml_path: translation/ot/job/042/014.yaml
  text: He named the first Jemimah[a], the second Keziah, and the third Keren-happuch.
translation:
  language: de
  text: Er nannte die erste Jemima, die zweite Kezia und die dritte Keren-Happuch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Keren-Happuch bedeutet wahrscheinlich „Horn des Antimons“ oder „Horn der Augenschminke“. Gemeint sein kann ein Behälter für Augenschminke oder das Kosmetikmittel selbst.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם
  choice: Er nannte
  rationale: Die hebräische Verbindung bedeutet wörtlich etwa „er rief den Namen“, bezeichnet hier aber die Namensgebung. „Er nannte“ gibt dies in natürlichem, modernem Deutsch wieder; das männliche Subjekt ist aus dem Zusammenhang als Hiob zu erkennen.
- source_word: הָאַחַת ... הַשֵּׁנִית ... הַשְּׁלִישִׁית
  choice: die erste ... die zweite ... die dritte
  rationale: In der aufzählenden Namensfolge entsprechen die deutschen Ordnungszahlen dem Sinn und bewahren die klare Struktur des Hebräischen.
- source_word: יְמִימָה
  choice: Jemima
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben, nicht nach einer möglichen Namensbedeutung übersetzt.
- source_word: קְצִיעָה
  choice: Kezia
  rationale: Der Personenname wird in der gebräuchlichen deutschen Form transliteriert. Eine strengere Umschrift wie „Qezia“ wäre möglich, ist für allgemeine Leser jedoch weniger vertraut.
- source_word: קֶרֶן הַפּוּךְ
  choice: Keren-Happuch
  rationale: Die etablierte deutsche Namensform bewahrt durch den Bindestrich den zusammengesetzten Charakter des hebräischen Namens. Seine wahrscheinlich durchsichtige Bedeutung wird in einer Fußnote erläutert, ohne den Namen im Haupttext zu übersetzen.
