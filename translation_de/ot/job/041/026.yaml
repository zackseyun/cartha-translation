source:
  edition: WLC
  text: אֵֽת כָּל גָּבֹ֥הַּ יִרְאֶ֑ה ה֝֗וּא מֶ֣לֶךְ עַל כָּל בְּנֵי שָֽׁחַץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/041/026.yaml
  text: He looks on everything that is high[a]; he is king over all the sons of pride.
translation:
  language: de
  text: Alles Hohe sieht er; er ist König über alle Söhne des Hochmuts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über alle Hochmütigen“. Wörtlich: „über alle Söhne des Hochmuts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל גָּבֹהַּ
  choice: alles Hohe
  rationale: Die Objektmarkierung אֵת bleibt unübersetzt; כָּל mit dem substantivierten Singular גָּבֹהַּ wird im Deutschen natürlich und umfassend mit „alles Hohe“ wiedergegeben. Dies bewahrt sowohl die konkrete Vorstellung von Höhe als auch die mögliche Bedeutung von Erhabenheit oder Hochmut.
- source_word: יִרְאֶה
  choice: sieht
  rationale: Das Verb ראה bedeutet grundlegend „sehen“. Die knappe Wiedergabe passt zum poetischen Stil und lässt offen, ob ein bloßes Sehen oder ein furchtloses Herabblicken gemeint ist.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen hebt das Subjekt hervor. Im Deutschen trägt der ausdrückliche Neubeginn „er ist“ diese Hervorhebung hinreichend.
- source_word: מֶלֶךְ
  choice: König
  rationale: „König“ bewahrt die unmittelbare Herrschaftsmetapher und die Aussage seiner Überlegenheit.
- source_word: עַל
  choice: über
  rationale: Bei königlicher Herrschaft bezeichnet „über“ im Deutschen idiomatisch den Bereich der Überordnung.
- source_word: כָּל בְּנֵי שָׁחַץ
  choice: alle Söhne des Hochmuts
  rationale: Die wörtliche poetische Klassenbezeichnung „Söhne des Hochmuts“ bleibt erhalten. „Hochmut“ gibt שָׁחַץ als stolze, überhebliche Haltung wieder, ohne die bezeichneten Wesen näher festzulegen.
theological_decisions:
- issue: Deutung von „alle Söhne des Hochmuts“
  choice: Die metaphorische Bezeichnung bleibt als „alle Söhne des Hochmuts“ stehen und kann stolze oder hochmütige Wesen verschiedener Art umfassen.
  alternative: Die Wendung ausdrücklich als wilde Tiere, stolze Menschen oder kosmische Mächte bestimmen.
  rationale: Der hebräische Text legt keine einzelne Gruppe eindeutig fest. Die wörtlich-poetische Wiedergabe wahrt diese theologische und bildhafte Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. „Alles Hohe“ und „Söhne des Hochmuts“ bewahren die Bildsprache und echte Mehrdeutigkeit des Hebräischen.
