lexical_decisions:
- source_word: אֵין
  choice: gibt es nichts
  rationale: Die Existenzverneinung wird im Deutschen natürlich wiedergegeben und bezieht sich hier auf kein vergleichbares Wesen.
- source_word: עַל עָפָר
  choice: auf der Erde
  rationale: Wörtlich steht »auf Staub/Erde«; im Kontext ist der irdische Bereich gemeint.
- source_word: מָשְׁלוֹ
  choice: das ihm gleicht
  rationale: Die Form bezeichnet hier etwas Vergleichbares beziehungsweise Ebenbürtiges; die Übersetzung bewahrt den Vergleich, ohne ihn enger festzulegen.
- source_word: הֶעָשׂוּ
  choice: geschaffen
  rationale: Die passive Form von עשה beschreibt das Wesen als gemacht oder geschaffen; »geschaffen« ist in diesem Geschöpfkontext natürlich.
- source_word: לִבְלִי
  choice: ohne
  rationale: Die Verbindung drückt das Fehlen einer Eigenschaft aus.
- source_word: חָת
  choice: Furcht
  rationale: Das Wort bezeichnet Furcht, Schrecken oder Entsetzen; »Furcht« ist verständlich und lässt die Bedeutungsbreite weitgehend offen.
