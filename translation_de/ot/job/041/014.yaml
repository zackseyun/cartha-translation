  text: In his neck strength lodges[a], and before him dismay leaps.
translation:
  language: de
  text: 'In seinem Nacken wohnt Kraft,

    und vor ihm her springt Bestürzung.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und vor ihm her springt Entsetzen«. Das seltene hebräische Substantiv דְּאָבָה kann in diesem poetischen Zusammenhang Bestürzung, Niedergeschlagenheit oder Entsetzen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצַוָּארוֹ
  choice: In seinem Nacken
  rationale: Die Präposition ב mit צַוָּאר und Suffix ist hier am natürlichsten örtlich zu verstehen. Die Formulierung bewahrt das Bild, dass die Kraft im Nacken ihren Sitz hat.
- source_word: יָלִין
  choice: wohnt
  rationale: Das Verb לין bedeutet wörtlich »übernachten« oder »Herberge nehmen« und bezeichnet hier bildhaft eine bleibende Gegenwart. »Wohnt« klingt im Deutschen natürlich und erhält die Personifikation.
- source_word: עֹז
  choice: Kraft
  rationale: עֹז bezeichnet Kraft oder Stärke. »Kraft« ist in Verbindung mit dem im Nacken wohnenden Vermögen prägnant und idiomatisch.
- source_word: וּלְפָנָיו
  choice: und vor ihm
  rationale: Die Wendung mit פָּנִים bedeutet gewöhnlich »vor« oder »vor jemandem her«. Die knappe deutsche Wiedergabe bewahrt die räumliche Vorstellung.
- source_word: תָּדוּץ
  choice: springt auf
  rationale: Das seltene Verb דוץ bezeichnet vermutlich ein Springen oder Hüpfen. »Springt auf« bewahrt die lebhafte Personifikation, ohne den im Deutschen eher heiteren Beiklang von »tanzt« einzuführen.
- source_word: דְּאָבָה
  choice: Bestürzung
  rationale: Das seltene Substantiv kann Niedergeschlagenheit, Verzagtheit oder Schrecken bezeichnen. »Bestürzung« wahrt die emotionale Mehrdeutigkeit besser als das stärker festlegende »Entsetzen«.
