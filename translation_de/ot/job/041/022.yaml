    issue: Fußnote b formuliert die alternative Lesart unnötig konkret als Wirkung „durch seine Unterseite“ und nennt eine „raue Fläche“.
    rationale: Das Hebräische benennt hier weder ausdrücklich eine Unterseite noch deren raue Beschaffenheit. Die alternative syntaktische Deutung kann knapp als Umformung des Schlamms in bzw. zu einem Dreschschlitten dokumentiert werden; weitergehende körperliche Erklärung ist interpretative Ausmalung.
  - severity: low
    issue: Die Präposition „über den Schlamm“ schwächt im Deutschen den Kontakt mit dem Schlamm ab.
    rationale: עלי טיט lässt die Lage auf dem Schlamm zu; „auf dem Schlamm“ vermittelt das Bild des Dreschschlittens und des scharfkantigen Unterteils natürlicher.
