  source_fidelity: 'Die Hauptübersetzung gibt die beiden Bildhälften des Hebräischen insgesamt treffend wieder: תַּחְתָּיו bezeichnet den Bereich bzw. die Unterseite unter dem Ungeheuer, חַדּוּדֵי חָרֶשׂ scharfe Scherben/Spitzen aus Töpferware, und die zweite Hälfte verwendet das Bild eines Dreschschlittens auf Schlamm. Die Vergleichsauffassung („wie ein Dreschschlitten“) ist eine gut begründete Auslegung, sollte aber nicht als einzig mögliche hebräische Satzanalyse erscheinen.'
  naturalness: „Unter ihm sind scharfe Tonscherben“ ist verständlich, aber die Stellung „wie ein Dreschschlitten breitet er sich“ ist weniger unmittelbar als die im Deutschen übliche Nachstellung des Vergleichs. „auf dem Schlamm“ ist bei diesem körperlich aufliegenden bzw. darübergleitenden Bild idiomatischer und konkreter als „über den Schlamm“.
  terminology: „Tonscherben“ und „Dreschschlitten“ sind sachgerecht und für modernes Standarddeutsch verständlich. Die Fußnote sollte die alternative Konstruktion neutral benennen, ohne die nicht ausdrücklich im Text bezeichnete „Unterseite“ und deren „raue Fläche“ weiter auszumalen.
  issues:
