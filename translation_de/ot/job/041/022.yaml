  text: Under him are sharp shards of pottery[b][a]; he spreads himself like a threshing sledge over the mud.
translation:
  language: de
  text: Unter ihm sind scharfe Tonscherben[a]; er breitet sich wie ein Dreschschlitten auf dem Schlamm aus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „scharfe Scherben aus Ton“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er macht den Schlamm zu einem Dreschschlitten.“ Die hebräische Satzfügung kann auch als direkte Objektkonstruktion verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחְתָּיו
  choice: Unter ihm
  rationale: Die Präposition mit Suffix bezeichnet den Raum unter dem Leviatan; „unter ihm“ ist im modernen Deutsch klar und natürlich.
- source_word: חַדּוּדֵי
  choice: scharfe
  rationale: Die Konstruktusform bezeichnet scharfe oder zugespitzte Dinge; als Adjektiv zu „Tonscherben“ wird der Sinn knapp und anschaulich wiedergegeben.
- source_word: חָרֶשׂ
  choice: Tonscherben
  rationale: Das Wort bezeichnet Töpferware beziehungsweise in diesem Zusammenhang deren Bruchstücke. „Tonscherben“ ist geläufiger und knapper als „Scherben von Töpferware“.
- source_word: יִרְפַּד
  choice: breitet er sich … aus
  rationale: Das Verb kann „ausbreiten“, „hinlegen“ oder „eine Unterlage bereiten“ bedeuten. Die reflexive Wiedergabe macht das Bild im Deutschen verständlich, ohne die Bewegung mit einem im Hebräischen nicht ausdrücklich genannten Verb wie „ziehen“ festzulegen.
- source_word: חָרוּץ
  choice: Dreschschlitten
  rationale: Gemeint ist hier wahrscheinlich ein scharfes landwirtschaftliches Dreschgerät. „Dreschschlitten“ bezeichnet das konkrete Gerät präziser als „Egge“.
- source_word: עֲלֵי
  choice: über
  rationale: Die Präposition bezeichnet eine Lage oder Bewegung auf beziehungsweise über dem Schlamm; „über“ fügt sich natürlich in die deutsche Formulierung ein.
- source_word: טִיט
  choice: den Schlamm
  rationale: Das Substantiv bezeichnet Schlamm, Lehm oder Morast. „Schlamm“ bewahrt das konkrete Bild und ist allgemein verständlich.
