  text: כְּ֭/קַשׁ נֶחְשְׁב֣וּ תוֹתָ֑ח וְ֝/יִשְׂחַ֗ק לְ/רַ֣עַשׁ כִּידֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/021.yaml
  text: A club is regarded as straw[b][a], and he laughs at the rattling of the javelin.
translation:
  language: de
  text: Die Keule[a] gilt ihm wie Stroh[b], und über das Rasseln des Wurfspießes lacht er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geschoss“. Das seltene hebräische Wort תוֹתָח ist in seiner genauen Bedeutung unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Stoppeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקַשׁ
  choice: wie Stroh
  rationale: קַשׁ bezeichnet Stroh oder Stoppeln. „Stroh“ ist im heutigen Deutsch natürlich und bewahrt das Bild von etwas Leichtem und Ungefährlichem.
- source_word: נֶחְשְׁבוּ
  choice: gilt ihm
  rationale: Die passive Form von חשׁב bedeutet „gerechnet/angesehen werden“. „Gilt ihm“ gibt die Einschätzung aus der Perspektive des Leviatans idiomatisch wieder.
- source_word: תוֹתָח
  choice: die Keule
  rationale: Das seltene Wort bezeichnet in diesem kriegerischen Zusammenhang wohl eine Waffe oder ein Geschoss; seine genaue Bedeutung ist unsicher. „Keule“ ergibt einen klaren Parallelismus zum Wurfspieß, ohne die Unsicherheit in der Fußnote zu verschweigen.
- source_word: וְיִשְׂחַק
  choice: und … lacht er
  rationale: שׂחק bedeutet hier „lachen“. Subjekt ist der im Zusammenhang beschriebene Leviatan.
- source_word: לְרַעַשׁ
  choice: über das Rasseln
  rationale: רַעַשׁ kann Lärm, Erschütterung oder Rasseln bezeichnen. Bei einer bewegten Waffe gibt „Rasseln“ die hörbare Bedrohung anschaulich wieder.
- source_word: כִּידוֹן
  choice: des Wurfspießes
  rationale: כִּידוֹן bezeichnet eine speerartige Waffe, häufig einen Wurfspieß. Diese Wiedergabe unterscheidet sie verständlich von anderen Waffenbezeichnungen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die Voranstellung „Wie Stroh“ bewahrt die Bildfolge des Hebräischen; „gilt ihm“ macht die Perspektive des Leviatans im Deutschen natürlich deutlich. Die beiden Unsicherheiten des seltenen Waffenwortes und von קַשׁ werden durch unmittelbar gesetzte Fußnotenmarker offengehalten.
