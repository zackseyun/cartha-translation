  text: לִ֭בּ/וֹ יָצ֣וּק כְּמוֹ אָ֑בֶן וְ֝/יָצ֗וּק כְּ/פֶ֣לַח תַּחְתִּֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/016.yaml
  text: His heart is hard like a stone[a], hard like the lower millstone.
translation:
  language: de
  text: Sein Herz ist hart wie Stein[a], hart wie der untere Mühlstein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fest wie Stein“; das hebräische Verb bedeutet wörtlich „gegossen“ und bezeichnet hier etwas Starres oder Festes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבּוֹ
  choice: sein Herz
  rationale: לֵב bezeichnet hier das innere Zentrum des Wesens. „Herz“ bewahrt das konkrete Bild und ist im Deutschen die natürliche Entsprechung.
- source_word: יָצוּק
  choice: ist hart
  rationale: Das Verb יצק bedeutet wörtlich „gießen“; in diesem passivisch-adjektivischen Gebrauch beschreibt es etwas Gegossenes und daher Starres oder Festes. „Ist hart“ gibt den Sinn im Vergleich mit Stein idiomatisch wieder.
- source_word: כְּמוֹ אָבֶן
  choice: wie Stein
  rationale: Die knappe Form wahrt den direkten poetischen Vergleich und klingt im Deutschen natürlicher als „wie ein Stein“.
- source_word: וְיָצוּק
  choice: hart
  rationale: Die Wiederholung desselben Prädikats verstärkt die Aussage und erhält den poetischen Parallelismus.
- source_word: כְּפֶלַח תַּחְתִּית
  choice: wie der untere Mühlstein
  rationale: פֶלַח kann ein Stück oder eine Scheibe bezeichnen; zusammen mit תַּחְתִּית ist hier der untere Stein einer Handmühle gemeint, ein vertrautes Bild außergewöhnlicher Härte und Festigkeit.
theological_decisions: []
translation_notes:
  register: Knappe, bildhafte und würdige poetische Sprache. Die Wiederholung von „hart“ bildet den Parallelismus des Hebräischen nach; „der untere Mühlstein“ bezeichnet den festliegenden unteren Stein einer Mühle.
