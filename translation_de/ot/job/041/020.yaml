  text: לֹֽא יַבְרִיחֶ֥/נּוּ בֶן קָ֑שֶׁת לְ֝/קַ֗שׁ נֶהְפְּכוּ ל֥/וֹ אַבְנֵי קָֽלַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/020.yaml
  text: The son of the bow cannot make him flee[a]; slingstones become like stubble to him.
translation:
  language: de
  text: Der »Sohn des Bogens«[a] schlägt ihn nicht in die Flucht; Schleudersteine werden ihm zu Stoppeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sohn des Bogens«; gemeint ist ein Bogenschütze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַבְרִיחֶנּוּ
  choice: schlägt ihn nicht in die Flucht
  rationale: Das Hifil von ברח mit Suffix der 3. Person maskulin Singular bezeichnet hier das Veranlassen zur Flucht. „In die Flucht schlagen“ gibt die kausative Bedeutung im Zusammenhang wirkungsloser Waffen natürlich wieder.
- source_word: בֶן קָשֶׁת
  choice: der »Sohn des Bogens«
  rationale: Die wörtliche Wiedergabe bewahrt das markante hebräische Bild. Gemeint ist idiomatisch ein Bogenschütze; dies wird in der Fußnote erläutert.
- source_word: לְקַשׁ
  choice: zu Stoppeln
  rationale: קַשׁ bezeichnet trockene Pflanzenreste, besonders Stoppeln oder strohartiges Material. „Stoppeln“ bewahrt das Bild von etwas Leichtem und Unbedeutendem.
- source_word: נֶהְפְּכוּ לוֹ
  choice: werden ihm zu
  rationale: Das Nifal von הפך beschreibt einen Zustands- oder Bedeutungswandel. Die deutsche Wendung „werden ihm zu“ hält die relationale Nuance von לוֹ fest, ohne sie als bloß subjektive Einschätzung aufzulösen.
- source_word: אַבְנֵי קָלַע
  choice: Schleudersteine
  rationale: Die Status-constructus-Verbindung bezeichnet Steine, die als Geschosse einer Schleuder dienen. „Schleudersteine“ ist präzise und im Deutschen gut verständlich.
theological_decisions: []
translation_notes:
  register: Poetisch-gehobene, aber verständliche Standardsprache. Das ungewöhnliche hebräische Bild „Sohn des Bogens“ bleibt bewusst erhalten und wird durch die Fußnote erschlossen; der Parallelismus der beiden wirkungslosen Waffenbilder wird knapp wiedergegeben.
