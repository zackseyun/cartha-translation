  text: לֹֽא אַ֭כְזָר כִּ֣י יְעוּרֶ֑/נּוּ וּ/מִ֥י ה֝֗וּא לְ/פָנַ֥/י יִתְיַצָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/002.yaml
  text: No one is so fierce that he dares to stir him up[a]. Who then is he who can stand before me?
translation:
  language: de
  text: Niemand ist so kühn, dass er ihn aufreizt[a]. Wer ist es dann, der vor mir bestehen kann?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass er ihn aufweckt«. Das hebräische Verb bedeutet »wecken« oder »aufrütteln«; hier geht es darum, den Leviatan zu provozieren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אַכְזָר
  choice: Niemand ist so wild
  rationale: Die Verneinung und das Adjektiv bilden sinngemäß die Aussage, dass kein Mensch genügend Wildheit oder erbarmungslose Kühnheit besitzt. »Wild« bewahrt den unmittelbaren Bezug zur Furcht einflößenden Begegnung, ohne das Wort ausschließlich moralisch als »grausam« zu deuten.
- source_word: כִּי יְעוּרֶנּוּ
  choice: dass er ihn aufreizt
  rationale: כִּי führt hier passend einen Folgesatz ein. Das Verb עור bedeutet »wecken, aufrütteln« und bezeichnet im Zusammenhang das provozierende Aufscheuchen des Leviatans; »aufreizen« gibt diese kontextuelle Wirkung natürlich wieder.
- source_word: וּמִי הוּא
  choice: Wer ist es dann
  rationale: Die Verbindung aus Konjunktion, Fragewort und betontem Pronomen führt die Folgerung weiter. »Dann« macht den Schluss vom Leviatan auf Gott sichtbar, ohne ihn zusätzlich auszudeuten.
- source_word: לְפָנַי יִתְיַצָּב
  choice: der vor mir bestehen kann
  rationale: לְפָנַי heißt wörtlich »vor mir«, während der Hitpael von יצב das Sich-Hinstellen oder Standhalten bezeichnet. In der rhetorischen Frage drückt »bestehen kann« verständlich die Unfähigkeit aus, Gott standzuhalten.
theological_decisions:
- issue: Bezug der zweiten Vershälfte
  choice: »vor mir« bezeichnet Gott; die Aussage geht vom Leviatan zu seinem Schöpfer über.
  alternative: Beide Vershälften beziehen sich ausschließlich auf den Leviatan.
  rationale: Das Suffix der ersten Person in לְפָנַי steht innerhalb der Gottesrede und markiert den Sprecher als Bezugspunkt. Die rhetorische Bewegung ist ein Schluss vom furchterregenden Geschöpf auf Gott, ohne das Verhältnis im Haupttext erklärend auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe rhetorische Struktur und der Wechsel vom Leviatan zu Gott bleiben erhalten; das ergänzte Modalverb »kann« macht die deutsche Frage idiomatisch.
