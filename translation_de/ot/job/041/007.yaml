  text: Its proud rows of shields are shut up, sealed tightly.
translation:
  language: de
  text: Sein Stolz sind die Reihen seiner Schilde, fest verschlossen wie mit einem Siegel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Seine stolzen Schildreihen sind dicht versiegelt.'
    reason: Die knappe hebräische Wortfolge lässt offen, ob „Stolz/Hoheit“ prädikativ zu verstehen ist oder die Schildreihen näher beschreibt; auch die genaue Syntax von „Siegel“ und „eng/fest“ ist mehrdeutig.
lexical_decisions:
- source_word: גַּאֲוָה
  choice: Sein Stolz
  rationale: Das Substantiv bezeichnet „Stolz“ oder „Hoheit“. Die prädikative Wiedergabe bewahrt die markante hebräische Aussage, dass die Schildreihen den Stolz des Tieres ausmachen.
- source_word: אֲפִיקֵי מָגִנִּים
  choice: die Reihen seiner Schilde
  rationale: אֲפִיקִים bezeichnet hier wahrscheinlich geordnete Reihen bzw. Furchen; „Schilde“ ist ein bildhafter Ausdruck für die robusten Schuppen oder Panzerplatten.
- source_word: סָגוּר
  choice: fest verschlossen
  rationale: Das passive Partizip beschreibt den lückenlos geschlossenen Zustand der Schildreihen.
- source_word: חוֹתָם צָר
  choice: wie mit einem Siegel
  rationale: Wörtlich etwa „ein enges/festes Siegel“. Der Vergleich bringt zum Ausdruck, dass die Reihen dicht und sicher versiegelt wirken; „fest“ ist bereits bei „verschlossen“ wiedergegeben.
