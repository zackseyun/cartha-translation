source:
  edition: WLC
  text: הֵן תֹּחַלְתּ֥/וֹ נִכְזָ֑בָה הֲ/גַ֖ם אֶל מַרְאָ֣י/ו יֻטָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/001.yaml
  text: Behold[a], his hope proves false[b]; is one not cast down even at the sight of him?
translation:
  language: de
  text: Sieh, seine Hoffnung erweist sich als trügerisch[a]; wird man nicht schon bei seinem Anblick zu Boden geworfen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seine Erwartung wird enttäuscht“ oder „Seine Zuversicht versagt“. Das hebräische Verb kann hervorheben, dass sich die Hoffnung als trügerisch oder unbegründet herausstellt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wird man nicht schon bei seinem bloßen Anblick niedergestreckt?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Partikel leitet eine nachdrückliche, aufmerksamkeitslenkende Aussage ein. „Sieh“ bewahrt diese Kraft in gehobener, zugleich verständlicher Sprache.
- source_word: תֹּחַלְתּוֹ
  choice: seine Hoffnung
  rationale: Das Substantiv bezeichnet Hoffnung oder Erwartung. „Hoffnung“ ist direkt und lässt den Erwartungsaspekt offen.
- source_word: נִכְזָבָה
  choice: erweist sich als trügerisch
  rationale: Die Form von כזב bezeichnet hier ein enttäuschendes oder als falsch erwiesenes Hoffen. Die gewählte resultative Wendung bewahrt den Gedanken, dass sich die Hoffnung als unbegründet herausstellt.
- source_word: הֲגַם
  choice: nicht schon
  rationale: Die Verbindung aus Fragepartikel und verstärkendem גַּם bildet eine rhetorische Frage. „Nicht schon“ gibt die erwartete Bejahung und die Steigerung natürlich wieder.
- source_word: אֶל מַרְאָיו
  choice: bei seinem Anblick
  rationale: Die Präposition mit מַרְאֶה bezeichnet hier die Reaktion angesichts seiner Erscheinung. „Bei seinem Anblick“ ist im Deutschen idiomatisch, ohne mehr als das Sehen selbst vorauszusetzen.
- source_word: יֻטָל
  choice: wird … zu Boden geworfen
  rationale: Die passive Kausativform bezeichnet, dass jemand hingeworfen oder niedergeworfen wird. „Zu Boden geworfen“ erhält das kräftige Bild und die Passivform.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die rhetorische Frage und das kräftige Passivbild des Hebräischen bleiben erhalten; „schon“ vermittelt die steigernde Wirkung von גַּם.
