  text: אִישׁ בְּ/אָחִ֥י/הוּ יְדֻבָּ֑קוּ יִ֝תְלַכְּד֗וּ וְ/לֹ֣א יִתְפָּרָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/009.yaml
  text: Each one sticks to its fellow[a]; they are clasped together and cannot be separated.
translation:
  language: de
  text: Eine haftet an der anderen[a]; sie greifen ineinander und lassen sich nicht trennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Eine haftet an ihrem Bruder.« Das hebräische Wort »Bruder« bezeichnet hier bildhaft die jeweils benachbarte Schuppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Eine
  rationale: אִישׁ wird hier distributiv gebraucht und bezeichnet jeweils eine der im Zusammenhang beschriebenen Schuppen, nicht einen Mann.
- source_word: בְּאָחִיהוּ
  choice: an der anderen
  rationale: Wörtlich steht »an/bei ihrem Bruder«. Im Bild benachbarter Schuppen gibt »an der anderen« die Beziehung natürlich und sachlich wieder; die formale Bildsprache wird in der Fußnote bewahrt.
- source_word: יְדֻבָּקוּ
  choice: haftet
  rationale: דבק bezeichnet enges Anhaften. Der Singular entspricht im Deutschen der distributiven Aussage »eine … an der anderen«.
- source_word: יִתְלַכְּדוּ
  choice: sie greifen ineinander
  rationale: Das Verb beschreibt ein Erfasst-, Verbunden- oder festes Zusammengefügtsein. »Ineinandergreifen« veranschaulicht bei Schuppen die enge Verbindung, ohne ein technisches Detail hinzuzufügen.
- source_word: וְלֹא יִתְפָּרָדוּ
  choice: und lassen sich nicht trennen
  rationale: Die verneinte Verbform beschreibt, dass die eng verbundenen Schuppen nicht voneinander gelöst werden; die deutsche Formulierung gibt diese praktische Untrennbarkeit idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige und anschauliche Standardsprache. Das feminine »eine … der anderen« nimmt die im Kontext beschriebenen Schuppen auf; der Parallelismus und die enge, unlösbare Verbindung bleiben erhalten.
