  text: אֶחָ֣ד בְּ/אֶחָ֣ד יִגַּ֑שׁוּ וְ֝/ר֗וּחַ לֹא יָב֥וֹא בֵֽינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/008.yaml
  text: They press close[a], one to another, and no air can come between them.
translation:
  language: de
  text: Eines drängt sich dicht an das andere, und keine Luft dringt zwischen sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und kein Wind dringt zwischen sie“. Das hebräische Wort רוּחַ kann „Luft“, „Wind“ oder „Atem“ bedeuten; hier ist der physische Sinn gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד בְּאֶחָד
  choice: Eines ... am anderen
  rationale: Die distributive Wendung bezeichnet die wechselseitige, paarweise Nachbarschaft der Schuppen. Die deutsche Formulierung gibt diesen Sinn natürlich wieder.
- source_word: יִגַּשׁוּ
  choice: liegt dicht
  rationale: Das Verb נגשׁ bedeutet grundsätzlich „sich nähern/herantreten“; im Zusammenhang der eng aneinanderliegenden Schuppen bezeichnet es unmittelbare Nähe. „Liegt dicht“ bildet den statisch-beschreibenden Kontext idiomatisch ab, ohne ein Zusammenfügen ausdrücklich in das Verb hineinzulesen.
- source_word: וְרוּחַ
  choice: und keine Luft
  rationale: רוּחַ kann „Luft“, „Wind“, „Atem“ oder „Geist“ bedeuten. In der körperlichen Beschreibung ist bewegte Luft gemeint; „Luft“ passt am besten zu dem fehlenden Zwischenraum.
- source_word: לֹא יָבוֹא
  choice: dringt ... nicht
  rationale: Der negierte Imperfekt beschreibt, dass keine Luft in den Zwischenraum gelangt. „Dringt ... nicht“ ist im Deutschen anschaulich und wahrt die Aussageform des Hebräischen, ohne sie ausdrücklich zu einem „kann nicht“ zu verstärken.
- source_word: בֵינֵיהֶם
  choice: zwischen sie
  rationale: בין mit dem Suffix der 3. Person Plural bezeichnet hier den räumlichen Bereich zwischen den einzelnen Schuppen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des hebräischen Verses bleibt erhalten. Das sächliche „Eines“ nimmt die im unmittelbaren Kontext beschriebenen Schilde beziehungsweise Schuppen einzeln auf.
