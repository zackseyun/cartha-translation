base_translation:
  language: en
  yaml_path: translation/ot/job/041/019.yaml
  text: He regards iron as straw[a], and bronze as rotten wood.
translation:
  language: de
  text: Eisen hält er für Stroh und Bronze für morsches Holz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kupfer“ statt „Bronze“ (נְחוּשָׁה).'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְשֹׁב
  choice: hält … für
  rationale: Das Verb חשׁב bezeichnet hier eine Einschätzung oder Wertung. Die deutsche Wendung „für … halten“ gibt diese Bedeutung natürlich wieder.
- source_word: לְתֶבֶן
  choice: für Stroh
  rationale: תֶּבֶן bezeichnet gewöhnlich Stroh beziehungsweise Häcksel; die Präposition לְ kennzeichnet hier, wofür das Eisen gehalten wird.
- source_word: בַּרְזֶל
  choice: Eisen
  rationale: Dies ist die übliche und kontextuell eindeutige Wiedergabe des Metalls.
- source_word: לְעֵץ רִקָּבוֹן
  choice: für morsches Holz
  rationale: Wörtlich steht „für Holz der Fäulnis/des Verfalls“. „Morsches Holz“ ist eine natürliche deutsche Formulierung und bewahrt das Bild mangelnder Widerstandskraft.
- source_word: נְחוּשָׁה
  choice: Bronze
  rationale: Das Wort kann Kupfer oder Bronze bezeichnen. In einem Zusammenhang mit widerstandsfähigen Metallwaffen ist „Bronze“ die herkömmliche und wahrscheinliche Wiedergabe; die echte lexikalische Alternative wird in der Fußnote erhalten.
