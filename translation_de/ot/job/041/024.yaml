  text: אַ֭חֲרָי/ו יָאִ֣יר נָתִ֑יב יַחְשֹׁ֖ב תְּה֣וֹם לְ/שֵׂיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/024.yaml
  text: Behind him a path shines[b][a]; one would think the deep to be gray-haired.
translation:
  language: de
  text: Hinter ihm[a] leuchtet ein Pfad; man könnte meinen, die Tiefe sei grauhaarig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nach ihm leuchtet ein Pfad.“ Das Hebräische kann zeitlich („nach ihm“) oder räumlich („hinter ihm“) verstanden werden; der Zusammenhang einer Wasserspur spricht für „hinter ihm“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „man hält die Tiefe für grauhaarig“. Gemeint ist das Bild des vom Schaum weiß erscheinenden Wassers, als wäre die Tiefe grauhaarig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Hinter ihm
  rationale: Die Form kann räumliche oder zeitliche Folge bezeichnen. Im Bild des im Wasser zurückbleibenden Kielwassers passt die räumliche Bedeutung am besten; die zeitliche Alternative wird in der Fußnote bewahrt.
- source_word: יָאִיר
  choice: leuchtet
  rationale: Das Hifil von אור bedeutet hier „Licht geben, leuchten“ und beschreibt die helle, schäumende Spur im Wasser.
- source_word: נָתִיב
  choice: ein Pfad
  rationale: Das Substantiv bezeichnet einen Pfad oder eine Bahn und wird hier poetisch für die Wasserspur des Leviatans gebraucht.
- source_word: יַחְשֹׁב
  choice: man könnte meinen
  rationale: Die formal männliche Singularform lässt sich in diesem allgemeinen Wahrnehmungssatz unpersönlich verstehen. Die Formulierung gibt den Eindruck eines Betrachters natürlich wieder.
- source_word: תְּהוֹם
  choice: die Tiefe
  rationale: Der Ausdruck bezeichnet die tiefen Wasser. „Die Tiefe“ erhält die knappe poetische Bildsprache, ohne vorschnell „Meer“ oder „Abgrund“ festzulegen.
- source_word: לְשֵׂיבָה
  choice: sei grauhaarig
  rationale: שֵׂיבָה kann graues Haar, Grauhaarigkeit oder hohes Alter bezeichnen. Hier lässt der weiße Schaum die Tiefe wie grauhaarig erscheinen.
theological_decisions: []
