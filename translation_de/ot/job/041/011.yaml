lexical_decisions:
- source_word: מִפִּיו
  choice: Aus seinem Maul
  rationale: מִן mit פֶּה und dem Suffix der 3. Person Singular bezeichnet den Ausgangspunkt. „Maul“ ist bei dem beschriebenen Tier im Deutschen natürlich und bewahrt die eindringliche Körperlichkeit des Bildes.
- source_word: לַפִּידִים
  choice: Fackeln
  rationale: לַפִּידִים bezeichnet gewöhnlich Fackeln oder brennende Scheite. „Fackeln“ erhält das konkrete, poetische Feuerbild.
- source_word: יַהֲלֹכוּ
  choice: fahren … hervor
  rationale: Das Verb הלך bedeutet grundsätzlich „gehen“; zusammen mit „aus seinem Maul“ beschreibt es hier das Hervorkommen. „fahren hervor“ klingt im Deutschen lebendig und passt zu den feurigen Erscheinungen.
- source_word: כִּידוֹדֵי אֵשׁ
  choice: feurige Funken
  rationale: כִּידוֹדֵי ist selten und in seiner genauen Bedeutung unsicher. Im Parallelismus liegt etwas Glühendes beziehungsweise wie ein feuriges Geschoss Hervorschießendes nahe. „feurige Funken“ ist verständlich, ohne die umstrittene Form zu stark festzulegen.
- source_word: יִתְמַלָּטוּ
  choice: schießen heraus
  rationale: מלט hat als Grundbedeutung „entkommen, sich retten“. In diesem poetischen Bild bezeichnet die reflexive Form das plötzliche Hervordringen; „schießen heraus“ gibt Dynamik und Richtung natürlich wieder.
