  text: From his mouth torches go out[a]; sparks of fire leap forth.
translation:
  language: de
  text: Aus seinem Maul fahren Fackeln hervor; feurige Funken[a] schießen heraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feuerbrände“ beziehungsweise „brennende Geschosse“. Das hebräische Wort ist selten und in seiner genauen Bedeutung unsicher.'
