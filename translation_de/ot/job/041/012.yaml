  yaml_path: translation/ot/job/041/012.yaml
  text: Smoke goes out from his nostrils[b][a], like a boiling pot and burning rushes.
translation:
  language: de
  text: Aus seinen Nüstern steigt Rauch auf wie aus einem angefachten Kessel und Schilf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet die knappe Bildfolge: „wie ein angefachter Kessel und Schilf“. Mit dem Schilf sind wahrscheinlich Binsen oder Schilf als rauchendes Brennmaterial gemeint.'
    reason: lexical_and_imagery_note
lexical_decisions:
- source_word: מִנְּחִירָיו
  choice: aus seinen Nüstern
  rationale: נְחִירַיִם bezeichnet die Nüstern bzw. die Nase; „Nüstern“ bewahrt hier das anschauliche körperliche Bild.
- source_word: יֵצֵא עָשָׁן
  choice: steigt Rauch auf
  rationale: יצא beschreibt das Hervorkommen des Rauchs. Im Deutschen gibt „Rauch steigt auf“ die charakteristische Bewegung natürlich und bildkräftig wieder.
- source_word: כְּדוּד
  choice: wie aus einem Kessel
  rationale: דּוּד kann einen Kochtopf oder ein größeres, kesselartiges Gefäß bezeichnen. „Kessel“ passt zur starken Erhitzung und ist im Deutschen gut verständlich.
- source_word: נָפוּחַ
  choice: angefacht
  rationale: Das Partizip bezeichnet etwas, das durch Blasen angefacht wird. „Angefacht“ bewahrt diesen Vorgang genauer als eine bloße Ergebnisangabe wie „heiß“ oder „kochend“.
- source_word: וְאַגְמֹן
  choice: und aus brennendem Schilf
  rationale: אַגְמוֹן bezeichnet Schilf oder Binsen. Im Bildzusammenhang ist solches Pflanzenmaterial wahrscheinlich als rauchender Brennstoff gemeint; „brennend“ macht die im knappen Hebräisch vorausgesetzte Bildbeziehung verständlich.
