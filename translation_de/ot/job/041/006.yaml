    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְתֵי
  choice: Tore
  rationale: Der Plural im Konstrukt bezeichnet wörtlich Türflügel bzw. Türen. »Tore« bewahrt im Deutschen das kraftvolle poetische Bild für die sich öffnenden Teile des Mauls, ohne es vorschnell als »Kiefer« aufzulösen.
- source_word: פָנָיו
  choice: seines Gesichts
  rationale: פנים bedeutet gewöhnlich »Gesicht«, »Vorderseite« oder »Oberfläche«. Die wörtliche Wiedergabe erhält die ungewöhnliche hebräische Metapher; im Kontext sind Maul oder Kiefer gemeint.
- source_word: מִי
  choice: Wer
  rationale: Das gewöhnliche Fragepronomen leitet hier eine rhetorische Frage ein.
- source_word: פִתֵּחַ
  choice: hat … geöffnet
  rationale: Das Verb פתח bedeutet »öffnen«. Die deutsche Perfektform gibt die rhetorisch gebrauchte hebräische Verbform direkt wieder; »kann öffnen« wäre eine plausible, aber stärker deutende Wiedergabe.
- source_word: סְבִיבוֹת
  choice: Rings um
  rationale: Der Ausdruck bezeichnet die Umgebung bzw. das, was ringsherum ist. »Rings um« klingt in der poetischen Beschreibung natürlich und würdig.
- source_word: שִׁנָּיו
  choice: seine Zähne
  rationale: Die Grundbedeutung ist »Zähne«. »Fänge« würde das Bild über den Wortlaut hinaus verschärfen.
- source_word: אֵימָה
  choice: Schrecken
  rationale: Das Substantiv bezeichnet Schrecken oder Grauen. »Schrecken« ist knapp, stark und passt zur nominalen Schlussaussage.
