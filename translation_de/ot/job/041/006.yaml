translation:
  language: de
  text: Wer hat die Türen seines Gesichts geöffnet? Rings um seine Zähne ist Schrecken.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wer kann die Türen seines Mauls öffnen?« Wörtlich lautet der hebräische Ausdruck »die Türen seines Gesichts«; er bezeichnet hier dichterisch das Maul oder die Kiefer.'
    reason: lexical_alternative
