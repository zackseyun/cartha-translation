  text: מַפְּלֵ֣י בְשָׂר֣/וֹ דָבֵ֑קוּ יָצ֥וּק עָ֝לָ֗י/ו בַּל יִמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/015.yaml
  text: The folds of his flesh cling together[a]; they are cast firm upon him and cannot be moved.
translation:
  language: de
  text: Die Falten seines Fleisches haften fest zusammen; sie liegen wie festgegossen an ihm und sind unbeweglich[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: fest an ihm angebracht. Das Hebräische gebraucht das Bild von etwas, das gegossen wird und dadurch fest wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפְּלֵי
  choice: Falten
  rationale: Das Substantiv bezeichnet herabhängende oder gefaltete Körperpartien. „Falten“ gibt das konkrete Körperbild natürlich wieder.
- source_word: בְשָׂרוֹ
  choice: seines Fleisches
  rationale: בשר bedeutet grundlegend „Fleisch“; diese Wiedergabe bleibt näher am Hebräischen als „Körper“ oder „Haut“.
- source_word: דָבֵקוּ
  choice: haften fest zusammen
  rationale: דבק bezeichnet enges Aneinanderhaften. „Haften fest zusammen“ gibt sowohl die Verbindung als auch ihre Festigkeit idiomatisch wieder.
- source_word: יָצוּק
  choice: fest … gegossen
  rationale: Das Wort weckt das Bild von etwas Gegossenem, das dadurch fest und unbeweglich geworden ist. Die Formulierung bewahrt dieses Bild, ohne lediglich die Folgerung „befestigt“ wiederzugeben.
- source_word: עָלָיו
  choice: an ihn
  rationale: Die Präposition mit Suffix bezeichnet hier die feste Anlagerung an das Tier; im Deutschen ist „an ihn gegossen“ natürlicher als „auf ihn gegossen“.
- source_word: בַּל יִמּוֹט
  choice: lassen sich nicht bewegen
  rationale: Die poetische Verneinung בַּל und das Nifal von מוט drücken aus, dass kein Wanken oder Verrücken möglich ist.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Prosa. Die Satzstruktur wahrt die zwei Aussagen des Hebräischen; das Gussbild bleibt erhalten, während die deutschen Pronomen zur besseren Verständlichkeit auf die Falten bezogen werden.
