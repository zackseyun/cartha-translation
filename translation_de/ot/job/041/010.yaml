  text: His sneezings flash forth light[b][a], and his eyes are like the eyelids of dawn.
translation:
  language: de
  text: Sein Niesen lässt Licht aufleuchten[a], und seine Augen sind wie die Lider der Morgenröte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sein Niesen strahlt Licht aus.“ Das hebräische Verb hat hier kausative Bedeutung: Es lässt Licht aufleuchten. Die Formulierung ist stark poetisch.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie die Lider der Morgenröte“ – ein hebräisches poetisches Bild für das erste sich öffnende Licht des Tages.'
    reason: cultural_note
lexical_decisions:
- source_word: עֲטִישֹׁתָיו
  choice: sein Niesen
  rationale: Das Substantiv bezeichnet das Niesen. Der deutsche Kollektivausdruck „sein Niesen“ wirkt natürlicher und würdevoller als „seine Nieser“, ohne den konkreten Sinn abzuschwächen.
- source_word: תָּהֶל אוֹר
  choice: lässt Licht aufleuchten
  rationale: Die Hifil-Form drückt hier aus, dass Licht zum Leuchten gebracht wird. Die Wiedergabe bewahrt den kausativen Sinn und die lebhafte poetische Bildsprache.
- source_word: וְעֵינָיו
  choice: und seine Augen
  rationale: Direkte Wiedergabe der Konjunktion und des Nomens mit Suffix der dritten Person maskulin Singular.
- source_word: כְּעַפְעַפֵּי שָׁחַר
  choice: wie die Lider der Morgenröte
  rationale: „Lider“ erhält das ungewöhnliche hebräische Bild; „Morgenröte“ gibt שׁחר poetisch und im heutigen Standarddeutsch verständlich wieder.
