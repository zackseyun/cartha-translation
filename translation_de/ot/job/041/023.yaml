  yaml_path: translation/ot/job/041/023.yaml
  text: He makes the deep boil like a pot[a]; he makes the sea like a pot of ointment.
translation:
  language: de
  text: Er lässt die Tiefe brodeln wie einen Topf; er lässt das Meer wie eine Salbenmischung brodeln[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie eine Duftmischung“ oder „wie eine Salbe“. Das hebräische Wort bezeichnet eine zubereitete Mischung, oft aus dem Bereich von Salben oder Duftstoffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְתִּיחַ
  choice: lässt … brodeln
  rationale: Die Hifil-Form von רתח bezeichnet das Verursachen von Kochen oder heftigem Wallen. „Lässt … brodeln“ gibt die kausative Bedeutung und das anschauliche Wasserbild natürlich wieder.
- source_word: כַּסִּיר
  choice: wie einen Topf
  rationale: סִיר bezeichnet ein Kochgefäß oder einen Topf. „Topf“ ist im heutigen Deutsch klar und bewahrt den direkten Vergleich.
- source_word: מְצוּלָה
  choice: die Tiefe
  rationale: מְצוּלָה bezeichnet die Meerestiefe beziehungsweise tiefe Wasser. Der Singular „die Tiefe“ bewahrt die poetische Parallele zu „das Meer“.
- source_word: יָם
  choice: das Meer
  rationale: יָם bedeutet gewöhnlich „Meer“; die konkrete Bezeichnung erhält das Bild und den Parallelismus.
- source_word: יָשִׂים
  choice: macht er zu
  rationale: שׂים bedeutet grundsätzlich „setzen, machen“. Die deutsche Wendung „macht … zu“ gibt in diesem Vergleich die bewirkende Bedeutung idiomatisch wieder, auch wenn sie das hebräische Vergleichswort freier ausdrückt.
- source_word: כַּמֶּרְקָחָה
  choice: zu einem Salbengemisch
  rationale: מֶרְקָחָה bezeichnet eine zubereitete Mischung, häufig im Zusammenhang mit Salbe oder Duftstoff. „Salbengemisch“ wahrt den Charakter einer zusammengesetzten Substanz, ohne einen im Hebräischen nicht ausdrücklich genannten zweiten Topf einzufügen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Sprache. „Brodeln“ vermittelt die kräftige Bewegung des Wassers. Die zweite Vershälfte bleibt wegen der seltenen und bildhaften Bezeichnung bewusst leicht offen; die Fußnote nennt die wichtigsten lexikalischen Möglichkeiten.
