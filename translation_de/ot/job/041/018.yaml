  text: מַשִּׂיגֵ֣/הוּ חֶ֭רֶב בְּלִ֣י תָק֑וּם חֲנִ֖ית מַסָּ֣ע וְ/שִׁרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/018.yaml
  text: The sword that reaches him cannot stand[a]; nor can spear, dart[b], or javelin.
translation:
  language: de
  text: Ein Schwert, das ihn erreicht, hält nicht stand[a]; ebenso wenig ein Speer, Wurfgeschoss[b] oder Spieß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Schwert, das ihn einholt, vermag nichts gegen ihn.« Wörtlich heißt es im Hebräischen, das Schwert »steht nicht«.'
    reason: lexical_alternative
  - marker: b
    text: Die hier mit »Wurfgeschoss« und »Spieß« wiedergegebenen hebräischen Wörter sind selten und in ihrer Bedeutung unsicher. Für das erste kommen auch »Geschoss« oder »Schaft« infrage, für das zweite auch »Panzer« oder »Rüstung«.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשִּׂיגֵהוּ
  choice: das ihn erreicht
  rationale: Die Form von נשׂג/השיג bedeutet »erreichen, einholen«. Die Wiedergabe bewahrt die verbale Aussage, ohne bereits ein Verwunden vorauszusetzen.
- source_word: חֶרֶב
  choice: ein Schwert
  rationale: Das Substantiv bezeichnet gewöhnlich ein Schwert; da im Hebräischen kein Artikel steht, ist der unbestimmte Artikel im Deutschen natürlich.
- source_word: בְּלִי תָקוּם
  choice: hält nicht stand
  rationale: Wörtlich steht hier, dass es »nicht steht«. »Hält nicht stand« bewahrt das Bild und drückt idiomatisch aus, dass die Waffe gegen ihn nichts vermag.
- source_word: חֲנִית
  choice: Speer
  rationale: Die übliche und allgemein verständliche deutsche Bezeichnung für diese Stoßwaffe.
- source_word: מַסָּע
  choice: Wurfgeschoss
  rationale: Das seltene und unsichere Wort bezeichnet im Zusammenhang wahrscheinlich eine geschleuderte Waffe oder einen Schaft. »Wurfgeschoss« lässt die genaue Waffenart angemessen offen.
- source_word: וְשִׁרְיָה
  choice: oder Spieß
  rationale: Das seltene Wort wird im Zusammenhang der Waffenreihe als spitze Waffe verstanden. »Spieß« ist eine natürliche deutsche Entsprechung; die mögliche Bedeutung »Panzer/Rüstung« bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper poetischer Waffenreihe. Die ungewöhnliche Formulierung »hält nicht stand« wahrt das konkrete hebräische Bild; die Unsicherheit der beiden seltenen Waffenbegriffe wird nicht im Haupttext überladen, sondern transparent in der Fußnote ausgewiesen.
