translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei rhetorischen Fragen und das konkrete Gewand- und Zaumzeugbild bleiben erhalten; die schwer deutbare zweite Wendung wird im Haupttext lesbar formuliert und in der Fußnote als unsicher ausgewiesen.
