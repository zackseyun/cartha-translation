  naturalness: „Außenseite seines Gewandes“ ist im Deutschen für die sichtbare Oberfläche idiomatischer und semantisch näher an פני als „Vorderseite“. „In die Doppelung seines Zaums eindringen“ ist bewusst poetisch und ungewohnt, aber verständlich; es bewahrt die Schwierigkeit des Bildes, ohne eine anatomische Deutung in den Text einzutragen.
  terminology: „Zaum“ ist die natürliche knappe deutsche Entsprechung zu רסן. „Leviatan“ in der Fußnote ist korrekt. Die mögliche Deutung auf Maul, Kiefer oder doppelte Zahnreihe gehört als Möglichkeit ausschließlich in die Fußnote.
