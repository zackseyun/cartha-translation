translation:
  language: de
  text: Wer hat die Außenseite seines Gewandes entblößt? Wer kann in die Doppelung seines Zaums eindringen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wer kann in die Falte seines Zaums eindringen?« Der hebräische Ausdruck ist schwierig; er kann bildlich das Maul, die Kiefer oder eine doppelte Zahnreihe des Leviatan bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִלָּה
  choice: aufgedeckt
  rationale: Das Verb bedeutet grundlegend »aufdecken, entblößen«. »Aufgedeckt« bewahrt diese Bedeutung, ohne eine vollständige Entfernung des Gewandes stärker zu behaupten, als der hebräische Text erkennen lässt.
- source_word: פְּנֵי לְבוּשׁוֹ
  choice: die Vorderseite seines Gewandes
  rationale: Die konkrete Verbindung aus »Vorderseite/Angesicht« und »Gewand« bleibt erhalten und wird nicht vorschnell als Haut, Schuppenpanzer oder äußere Hülle gedeutet.
- source_word: בְּכֶפֶל
  choice: zwischen die doppelte Reihe
  rationale: כפל bezeichnet etwas Doppeltes oder Gefaltetes. Die Formulierung lässt die wahrscheinlich auf Maul, Kiefer oder Zahnreihen bezogene Doppelung erkennen, ohne deren genaue anatomische Zuordnung festzulegen.
- source_word: רִסְנוֹ
  choice: seines Zaumzeugs
  rationale: רסן bezeichnet gewöhnlich Zaumzeug, Zügelung oder Maulkorb. »Zaumzeug« wahrt das konkrete Bild und erlaubt hier einen metaphorischen Bezug auf den Maul- und Kieferbereich.
- source_word: מִי יָבוֹא
  choice: Wer dringt … vor?
  rationale: Die rhetorische Frage drückt Unmöglichkeit oder äußerste Gefahr aus. »Vordringen« gibt das Eintreten in einen schwer zugänglichen Bereich im Deutschen natürlich wieder.
