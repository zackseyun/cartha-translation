  text: מִ֭/שֵּׂת/וֹ יָג֣וּרוּ אֵלִ֑ים מִ֝/שְּׁבָרִ֗ים יִתְחַטָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/017.yaml
  text: At his rising the mighty are afraid; at the crashing they are beside themselves.
translation:
  language: de
  text: Bei seinem Aufrichten fürchten sich selbst die Mächtigen; vor dem Krachen geraten sie außer sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשֵּׂתוֹ
  choice: Wenn es sich erhebt
  rationale: Die Form ist schwierig; im Kontext bezeichnet sie am ehesten das Sich-Erheben des Leviatans. Die konditionale Formulierung gibt das zeitlich-kausale Verhältnis natürlich wieder.
- source_word: אֵלִים
  choice: selbst die Mächtigen
  rationale: Hier sind starke beziehungsweise mächtige Wesen oder Menschen gemeint. „Die Mächtigen“ bewahrt die Aussage, ohne die mehrdeutige Form vorschnell als „Götter“ zu bestimmen.
- source_word: מִשְּׁבָרִים
  choice: vor dem Krachen
  rationale: Das Substantiv kann Brechen, Zusammenbruch, Brandung oder krachende Schläge bezeichnen. „Krachen“ passt zum bedrohlichen Auftreten des Wesens und bewahrt die akustisch-gewaltsame Bildsprache.
- source_word: יִתְחַטָּאוּ
  choice: geraten sie außer sich
  rationale: Die seltene Form ist hier wahrscheinlich als Verlust der Fassung beziehungsweise Orientierung zu verstehen; die Wiedergabe folgt dem Kontext, ohne eine kultische Bedeutung wie „sich entsündigen“ einzutragen.
theological_decisions:
- issue: Referent von אֵלִים
  choice: die Mächtigen
  alternative: die Götter / die Starken
  rationale: Der Vers betont die Furcht selbst besonders starker Akteure. „Die Mächtigen“ lässt offen, ob übermenschliche Wesen oder menschliche Helden im Blick sind, und vermeidet eine unnötige dogmatische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus bleibt erhalten; „selbst“ macht die emphatische Wirkung der mächtigen Akteure idiomatisch sichtbar. Keine Fußnote ist nötig, da die verbleibende lexikalische Unsicherheit in einer offenen, kontextgerechten Formulierung bewahrt wird.
