  yaml_path: translation/ot/job/041/013.yaml
  text: His breath kindles coals[a], and a flame comes out from his mouth.
translation:
  language: de
  text: Sein Atem entfacht Kohlen[a], und eine Flamme kommt aus seinem Maul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Seine Seele« oder »seine Kehle«. Das hebräische Wort נֶפֶשׁ kann »Seele«, »Leben« oder »Kehle« bedeuten und hier dem Zusammenhang nach auch den Atem bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: sein Atem
  rationale: נֶפֶשׁ kann »Seele«, »Leben« oder physiologisch »Kehle« bezeichnen. Im Parallelismus mit »aus seinem Maul« und im Bild des Feuers gibt »Atem« den kontextuellen Sinn im Deutschen am natürlichsten wieder, ohne die lexikalische Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: גֶּחָלִים
  choice: glühende Kohlen
  rationale: Das Substantiv bezeichnet Kohlen oder Glutstücke. »Glühende Kohlen« ist im modernen Deutschen anschaulich und verbindet sich natürlich mit »entfacht«.
- source_word: תְּלַהֵט
  choice: entfacht
  rationale: Die Piel-Form von להט drückt aus, dass etwas zum Lodern oder Brennen gebracht wird. »Entfacht« bewahrt diese kausative Bedeutung.
- source_word: וְלַהַב
  choice: und eine Flamme
  rationale: לַהַב bezeichnet im Singular eine Flamme oder Lohe. Der unbestimmte Artikel ist im Deutschen syntaktisch natürlich.
- source_word: מִפִּיו
  choice: aus seinem Maul
  rationale: Die Präposition מִן bezeichnet hier die Herkunftsrichtung. Bei dem beschriebenen Tierwesen ist »Maul« idiomatischer als »Mund« und wahrt das konkrete Bild.
- source_word: יֵצֵא
  choice: fährt … aus
  rationale: יצא bedeutet »hinausgehen, herauskommen«. In Verbindung mit einer Flamme gibt »fährt aus« die kräftige Bewegung poetisch und natürlich wieder.
theological_decisions: []
