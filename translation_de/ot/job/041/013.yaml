  register: Modernes, würdiges Standarddeutsch mit anschaulicher poetischer Sprache. »Maul« entspricht dem tierischen Referenten; die echte Mehrdeutigkeit von נֶפֶשׁ bleibt durch die Fußnote sichtbar.
