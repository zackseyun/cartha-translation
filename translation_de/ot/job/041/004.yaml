  text: לא אַחֲרִ֥ישׁ בַּדָּ֑י/ו וּ/דְבַר גְּ֝בוּר֗וֹת וְ/חִ֣ין עֶרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/004.yaml
  text: I will not keep silent about his limbs[a], or the account of his mighty strength and the grace of his proportions.
translation:
  language: de
  text: Ich will nicht schweigen von seinen Gliedern[a], von seiner gewaltigen Kraft und von der Anmut seines Körperbaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich will nicht schweigen von seinen Teilen, von der Beschaffenheit seiner Kräfte und von der Schönheit seines Gefüges.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִישׁ
  choice: Ich will nicht schweigen
  rationale: Das Hifil von חרשׁ bezeichnet hier das Unterlassen des Redens. Die Formulierung wahrt den Entschluss in der ersten Person und klingt im Deutschen natürlich und würdig.
- source_word: בַּדָּיו
  choice: von seinen Gliedern
  rationale: בַּד kann Körperteile oder Glieder bezeichnen. Im Zusammenhang der körperlichen Beschreibung des Leviatans ist „Glieder“ konkret und sachgerecht.
- source_word: דְבַר
  choice: von
  rationale: Das Konstrukt leitet hier den Gegenstand ein, über den gesprochen werden soll. Im Deutschen gibt die wiederholte Präposition „von“ diesen Bezug natürlicher wieder als eine substantivische Wendung wie „die Darstellung von“.
- source_word: גְּבוּרוֹת
  choice: seiner gewaltigen Kraft
  rationale: Der Plural kann Machterweise, Kräfte oder Stärke bezeichnen. In der Beschreibung des Leviatans steht seine eindrucksvolle körperliche Kraft im Vordergrund; „gewaltige Kraft“ bewahrt Intensität und Kontextbezug.
- source_word: חִין
  choice: der Anmut
  rationale: חֵן bezeichnet Anmut, Liebreiz oder einen angenehmen Eindruck. „Anmut“ bewahrt den ästhetischen Gehalt, ohne die ungewöhnliche positive Würdigung der Gestalt abzuschwächen.
- source_word: עֶרְכּוֹ
  choice: seines Körperbaus
  rationale: Das von ערך abgeleitete Wort bezeichnet Anordnung oder Gefüge. Im anatomischen Kontext vermittelt „Körperbau“ die geordnete Gestalt idiomatisch; die Idee wohlgefügter Proportionen wird zusammen mit „Anmut“ ausgedrückt.
