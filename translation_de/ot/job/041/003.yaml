base_translation:
  language: en
  yaml_path: translation/ot/job/041/003.yaml
  text: Who has first given to me[a], that I should repay him? Whatever is under all the heavens is mine.
translation:
  language: de
  text: Wer hat mir zuerst etwas gegeben, sodass ich es ihm zurückgeben müsste?[a] Was unter dem ganzen Himmel ist, gehört mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formeller: „Wer ist mir zuvorgekommen, sodass ich es ihm vergelten müsste?“ Das hebräische Verb kann „zuvorkommen“ oder „zuerst handeln“ bedeuten; zusammen mit „zurückgeben“ bezeichnet es hier wahrscheinlich eine vorausgehende Gabe oder Leistung, die eine Verpflichtung begründen würde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Fragewort eröffnet eine rhetorische Frage; das schlichte „Wer“ bewahrt ihre unmittelbare Kraft.
- source_word: הִקְדִּימַנִי
  choice: ist mir zuvorgekommen
  rationale: Das Hifil von קדם kann bedeuten, jemandem zuvorzukommen oder ihm gegenüber zuerst zu handeln. „Mir zuvorgekommen“ bewahrt die lexikalische Mehrdeutigkeit; der Zusammenhang mit dem Vergelten lässt dabei eine vorausgehende Gabe oder Leistung erkennen.
- source_word: וַאֲשַׁלֵּם
  choice: sodass ich es ihm vergelten müsste
  rationale: 'Im Zusammenhang bezeichnet die Verbform die gedachte Folge: Jemand hätte zuerst etwas für Gott getan, sodass Gott zur Gegenleistung verpflichtet wäre. Der Konjunktiv „müsste“ macht den rhetorisch verneinten Verpflichtungscharakter deutlich, ohne eine zukünftige Vergeltungszusage daraus zu machen.'
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: unter dem ganzen Himmel
  rationale: Die hebräische Wendung bezeichnet die Gesamtheit dessen, was sich unter dem Himmel befindet. Der kollektive Singular ist im modernen Deutschen natürlicher als „unter allen Himmeln“.
- source_word: לִי הוּא
  choice: gehört mir
  rationale: Die vorangestellte Besitzangabe wird idiomatisch und nachdrücklich als „gehört mir“ wiedergegeben.
theological_decisions:
- issue: Göttliche Verpflichtung und Eigentum
  choice: Die rhetorische Frage bestreitet, dass jemand Gott durch eine vorausgehende Leistung zur Vergeltung verpflichten könne; anschließend wird Gottes Besitzanspruch auf alles unter dem Himmel ausgesprochen.
  alternative: Die erste Aussage könnte rein zeitlich als „Wer ist vor mir gewesen?“ verstanden werden.
  rationale: Die Verbindung von הִקְדִּימַנִי mit וַאֲשַׁלֵּם weist über bloße zeitliche Priorität hinaus auf ein vorausgehendes Handeln, das eine Gegenleistung erwarten ließe. Die Übersetzung bewahrt mit „zuvorgekommen“ dennoch die Breite des Verbs.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Zuvorgekommen“ erhält die Bild- und Bedeutungsbreite des Hebräischen; die Fußnote erläutert den im Kontext wahrscheinlichen Sinn. Der zweite Satz ist bewusst knapp und umfassend formuliert.
