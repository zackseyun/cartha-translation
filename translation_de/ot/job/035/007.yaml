  variant: modern standard German
source:
  edition: WLC
  text: אִם צָ֭דַקְתָּ מַה תִּתֶּן ל֑/וֹ א֥וֹ מַה מִ/יָּדְ/ךָ֥ יִקָּֽח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/007.yaml
  text: If you are righteous[b][a], what do you give to him? Or what does he take from your hand?
translation:
  language: de
  text: Wenn du gerecht bist, was gibst du ihm[a]? Oder was nimmt[b] er aus deiner Hand?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist Gott. Elihus Aussage im Zusammenhang lautet, dass menschliche Gerechtigkeit Gott keinen Gewinn bringt.
    reason: cross_reference
  - marker: b
    text: 'Oder: empfängt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet unmittelbar und idiomatisch den Bedingungssatz ein.
- source_word: צָדַקְתָּ
  choice: du gerecht bist
  rationale: Das Verb צדק bezeichnet hier das Gerechtsein beziehungsweise moralische Im-Recht-Sein. Die deutsche Gegenwartsform gibt die allgemeine Bedingung natürlich wieder.
- source_word: מַה תִּתֶּן לוֹ
  choice: was gibst du ihm
  rationale: Die rhetorische Frage wird ohne zusätzliche modale Bedeutung wiedergegeben; „ihm“ bewahrt den pronominalen Wortlaut des Hebräischen.
- source_word: אוֹ
  choice: Oder
  rationale: Verbindet die beiden parallelen rhetorischen Fragen schlicht und direkt.
- source_word: מִיָּדְךָ
  choice: aus deiner Hand
  rationale: Bewahrt das konkrete hebräische Bild der Hand als Quelle dessen, was jemand gibt oder ein anderer empfängt.
- source_word: יִקָּח
  choice: nimmt
  rationale: לקח bedeutet „nehmen“ und kann in diesem Zusammenhang auch den Sinn „empfangen“ haben. „Nimmt“ ist die direkte Wiedergabe; die Alternative wird in einer Fußnote genannt.
theological_decisions:
- issue: Bezug der Pronomen לוֹ und יִקָּח
  choice: Die Pronomen werden als „ihm/er“ wiedergegeben und im Kontext auf Gott bezogen.
  alternative: Ein nicht näher bestimmter Mensch könnte grammatisch als Bezug verstanden werden.
  rationale: In Elihus Gedankengang in Hiob 35,6–8 geht es darum, dass menschliche Sünde oder Gerechtigkeit Gott keinen Verlust beziehungsweise Gewinn bringt. Der Haupttext ersetzt die Pronomen dennoch nicht durch „Gott“, damit die Ausdrucksweise des Hebräischen und ihre formale Offenheit erhalten bleiben.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die beiden parallelen rhetorischen Fragen und das konkrete Bild „aus deiner Hand“ bleiben erhalten.
