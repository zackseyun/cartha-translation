source:
  edition: WLC
  text: הֲ֭/זֹאת חָשַׁ֣בְתָּ לְ/מִשְׁפָּ֑ט אָ֝מַ֗רְתָּ צִדְקִ֥/י מֵ/אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/002.yaml
  text: 'Do you think this is just: you say[a], ‘My righteousness is greater than God’s’?'
translation:
  language: de
  text: 'Hältst du das für gerecht? Du sagst[a]: »Meine Gerechtigkeit ist größer als Gottes Gerechtigkeit.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Gerechtigkeit gilt vor Gott“, oder: „Mein Recht kommt von Gott.“ Das Hebräische ist knapp formuliert; wie „meine Gerechtigkeit“ zu „Gott“ in Beziehung steht, ist umstritten.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲזֹאת חָשַׁבְתָּ
  choice: Hältst du das
  rationale: Die Fragepartikel mit dem Demonstrativpronomen und חָשַׁב bildet eine rhetorische Frage. „Hältst du das …?“ ist im Deutschen natürlich und gibt „denken, erachten“ treffend wieder.
- source_word: לְמִשְׁפָּט
  choice: für gerecht
  rationale: מִשְׁפָּט bezeichnet Recht, Gerechtigkeit oder ein gerechtes Urteil. Die Wendung „für gerecht halten“ bewahrt hier den wertenden, rechtlichen Sinn.
- source_word: אָמַרְתָּ
  choice: Du sagst
  rationale: Obwohl die hebräische Form formal perfektiv ist, führt sie hier eine weiterhin relevante Äußerung Hiobs ein. Das Präsens entspricht der unmittelbaren Anklage Elihus.
- source_word: צִדְקִי
  choice: Meine Gerechtigkeit
  rationale: צֶדֶק bezeichnet hier Hiobs beanspruchte Gerechtigkeit beziehungsweise sein Rechtsein. „Gerechtigkeit“ wahrt die moralische und rechtliche Bedeutungsbreite.
- source_word: מֵאֵל
  choice: ist größer als Gottes
  rationale: מִן kann einen Vergleich ausdrücken. In Elihus polemischer Zusammenfassung ist die Aussage, Hiobs Gerechtigkeit sei größer als Gottes, kontextuell gut möglich; der im Hebräischen elliptische Vergleich wird im Deutschen ergänzt.
theological_decisions:
- issue: Sinn von Hiobs angeblicher Aussage in Elihus Vorwurf
  choice: 'Vergleichend: „Meine Gerechtigkeit ist größer als Gottes“'
  alternative: „Ich bin vor Gott gerecht“ oder „Mein Recht kommt von Gott“
  rationale: Die knappe Verbindung צִדְקִי מֵאֵל ist mehrdeutig. Der vergleichende Sinn passt zu Elihus Vorwurf im Kontext, darf aber wegen der sprachlichen Verdichtung nicht als einzig mögliche Deutung ausgegeben werden; deshalb stehen die Alternativen in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage ist idiomatisch formuliert; die theologisch bedeutsame Mehrdeutigkeit der komprimierten hebräischen Aussage wird durch die Fußnote offengehalten.
