  text: כִּֽי תֹ֭אמַר מַה יִּסְכָּן לָ֑/ךְ מָֽה אֹ֝עִ֗יל מֵֽ/חַטָּאתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/003.yaml
  text: For you say[a], ‘What advantage is it to you? What profit do I have from my sin?’
translation:
  language: de
  text: 'Denn du sagst[a]: »Was bringt es dir? Welchen Gewinn habe ich von meiner Sünde?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Welchen Vorteil hast du? Welchen Gewinn habe ich mehr als von meiner Sünde?« Das Hebräische ist knapp und kann einen Vergleich zwischen gerechtem Handeln und Sündigen andeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt Elihus Begründung beziehungsweise seine Wiedergabe von Hiobs Aussage ein; „Denn“ bewahrt den argumentativen Anschluss.
- source_word: תֹאמַר
  choice: du sagst
  rationale: Das Qal Imperfekt der 2. Person Singular wird im Kontext als gegenwärtige, Hiob zugeschriebene Aussage wiedergegeben.
- source_word: מַה יִּסְכָּן לָךְ
  choice: Was bringt es dir?
  rationale: סכן bezeichnet hier Nutzen oder Vorteil. Die idiomatische Formulierung bleibt knapp und lässt den Bezug von „es“ entsprechend der elliptischen hebräischen Aussage offen.
- source_word: מָה אֹעִיל
  choice: Welchen Gewinn habe ich
  rationale: Das Hifil von יעל bezeichnet Nutzen oder Gewinn; die deutsche Wendung gibt die Ich-Form natürlich wieder und erhält die Parallele zur ersten Frage.
- source_word: מֵחַטָּאתִי
  choice: von meiner Sünde
  rationale: מִן kann Herkunft beziehungsweise Quelle, aber auch einen Vergleich ausdrücken. Der Haupttext gibt die unmittelbar lesbare Herkunftsbeziehung wieder; die mögliche komparative Bedeutung wird in der Fußnote offengelegt.
theological_decisions:
- issue: Aussageabsicht des Elihu-Zitats
  choice: Elihu gibt Hiob als jemanden wieder, der nach dem persönlichen Nutzen fragt und dabei seine Sünde erwähnt.
  alternative: Elihu lässt Hiob fragen, welchen größeren Gewinn er gegenüber dem Sündigen habe beziehungsweise welchen Nutzen Gerechtigkeit bringe.
  rationale: Der hebräische Satz ist knapp und elliptisch. Der Haupttext ergänzt weder ausdrücklich „Gerechtigkeit“ noch „mehr als“, während die Fußnote den im Kontext möglichen Vergleich sichtbar macht.
- issue: Bezug von לָךְ
  choice: Das Pronomen wird formal mit „dir“ wiedergegeben, ohne seinen Bezug näher festzulegen.
  alternative: Das Satzglied könnte sinngemäß auf Hiobs im vorigen Vers erwähnte Gerechtigkeit bezogen oder als Teil einer freien Wiedergabe seiner Behauptung verstanden werden.
  rationale: Die ungewöhnliche Form und der knappe Zusammenhang erlauben keine sichere Ausdeutung; eine präzisierende Ergänzung würde die vorhandene Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Fragesatz. „Was bringt es dir?“ ist idiomatisch, ohne die Mehrdeutigkeit des unausgesprochenen Bezugs aufzulösen.
