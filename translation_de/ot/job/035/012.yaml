  text: שָׁ֣ם יִ֭צְעֲקוּ וְ/לֹ֣א יַעֲנֶ֑ה מִ֝/פְּנֵ֗י גְּא֣וֹן רָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/012.yaml
  text: There they cry out[a], but he does not answer[b], because of the pride of evil men.
translation:
  language: de
  text: Dort schreien sie, doch er antwortet nicht[a] wegen des Hochmuts böser Männer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische nennt das Subjekt von »antwortet nicht« nicht ausdrücklich; dem Zusammenhang nach ist Gott gemeint.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »wegen der Überheblichkeit böser Männer«. Die Wendung kann sich auf den Grund ihres Schreiens oder auf den Grund für das Ausbleiben der Antwort beziehen.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Dort
  rationale: Das Adverb ist in erster Linie örtlich und verweist auf die zuvor beschriebene Lage.
- source_word: יִצְעֲקוּ
  choice: schreien sie
  rationale: צעק bezeichnet häufig einen dringlichen Schrei aus Bedrängnis; „schreien“ ist hier natürlich und bewahrt die Dringlichkeit.
- source_word: וְלֹא
  choice: doch ... nicht
  rationale: Das Waw kann schlicht verbinden, doch „doch“ gibt den Gegensatz zwischen dem Schreien und dem Ausbleiben einer Antwort idiomatisch wieder.
- source_word: יַעֲנֶה
  choice: er antwortet nicht
  rationale: Die Verbform ist 3. Person Maskulin Singular, ohne dass das Subjekt ausdrücklich genannt wird. Das Pronomen bewahrt diese Zurückhaltung; der Präsens ist als allgemeine Aussage passend.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition drückt hier einen Grund beziehungsweise Anlass aus.
- source_word: גְּאוֹן
  choice: Hochmut
  rationale: Im Zusammenhang mit bösen Menschen hat גאון die negative Bedeutung Hochmut oder Überheblichkeit.
- source_word: רָעִים
  choice: böser Männer
  rationale: Das substantivisch gebrauchte Adjektiv steht im maskulinen Plural und bezeichnet böse beziehungsweise gottlose Männer.
theological_decisions:
- issue: Unausgesprochenes Subjekt von „antwortet nicht“
  choice: „er antwortet nicht“; Gott wird nicht ausdrücklich eingesetzt.
  alternative: „Gott antwortet ihnen nicht“
  rationale: Der Zusammenhang legt Gott als Handelnden nahe, doch der hebräische Vers nennt das Subjekt nicht ausdrücklich. Das Pronomen wahrt diese Spannung.
- issue: Bezug von „wegen des Hochmuts böser Männer“
  choice: Die deutsche Wortstellung lässt den im Hebräischen vorhandenen Bezugsspielraum bestehen.
  alternative: Ausdrückliche Festlegung, dass Gott wegen ihres eigenen Hochmuts nicht antwortet oder dass die Unterdrückten wegen des Hochmuts ihrer Unterdrücker schreien
  rationale: Die Schlussphrase kann syntaktisch beziehungsweise gedanklich unterschiedlich angebunden werden. Eine eindeutige Auflösung würde mehr festlegen als der hebräische Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dort“ bewahrt den örtlichen Bezug; „Hochmut“ ist geläufig und trägt die negative Wertung des Kontextes. Die männliche Personenbezeichnung folgt der maskulinen Pluralform des Ausgangstextes.
