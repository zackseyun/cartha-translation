  - severity: low
    issue: „macht er viele Worte“ ist im Deutschen weniger idiomatisch und schwächt die Vermehrungsnuance von יַכְבִּר.
    rationale: „Worte anhäufen“ gibt sowohl die Häufung als auch den knappen, vorwurfsvollen Ton des Verses besser wieder.
