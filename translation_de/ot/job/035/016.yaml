  yaml_path: translation/ot/job/035/016.yaml
  text: So Job opens his mouth in vain[a]; without knowledge he multiplies words.
translation:
  language: de
  text: So öffnet Hiob seinen Mund vergeblich[a]; ohne Erkenntnis häuft er Worte an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Leere“ oder „mit Nichtigkeit“. Das hebräische Wort kann Hauch, Leere, Nichtigkeit oder Vergeblichkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִיּוֹב
  choice: So … Hiob
  rationale: Das וְ knüpft an Elihus vorangehendes Urteil an und hat hier folgernden Sinn; „so“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: הֶבֶל
  choice: zu leerem Gerede
  rationale: הֶבֶל bezeichnet Hauch, Leere oder Nichtigkeit und charakterisiert hier Hiobs Reden als inhaltsleer oder vergeblich. „Zu leerem Gerede“ bewahrt das Bild der Leere und bildet mit „den Mund öffnen“ einen natürlichen deutschen Satz.
- source_word: יִפְצֶה פִּיהוּ
  choice: öffnet … seinen Mund
  rationale: Die feste Wendung פצה פה bedeutet, den Mund zu öffnen, besonders um zu sprechen. Die direkte Wiedergabe ist auch im Deutschen verständlich und idiomatisch.
- source_word: בִּבְלִי דַעַת
  choice: ohne Erkenntnis
  rationale: בִּבְלִי bezeichnet das Fehlen von etwas, דַעַת Erkenntnis oder Wissen. „Ohne Erkenntnis“ folgt dem Hebräischen eng und passt zum würdevollen Register.
- source_word: מִלִּין יַכְבִּר
  choice: macht er viele Worte
  rationale: מִלִּין bedeutet „Worte“, und das Hifil יַכְבִּר bezeichnet das Vielmachen bzw. Vermehren. Die deutsche Wendung „viele Worte machen“ gibt den Sinn klar und natürlich wieder.
