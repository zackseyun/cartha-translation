  text: מֵ֭/רֹב עֲשׁוּקִ֣ים יַזְעִ֑יקוּ יְשַׁוְּע֖וּ מִ/זְּר֣וֹעַ רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/009.yaml
  text: Because of the multitude of oppressions they cry out[b][a]; they call for help because of the arm of the mighty.
translation:
  language: de
  text: Wegen der vielen Unterdrückungen schreien sie auf; sie rufen um Hilfe wegen der Macht der Mächtigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vom Arm der Mächtigen«. Der Arm steht bildlich für Kraft und Macht. Die hebräische Präposition kann hier, wie im Haupttext, ursächlich als »wegen« verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹב עֲשׁוּקִים
  choice: Wegen der vielen Unterdrückungen
  rationale: מִן mit רֹב bezeichnet hier den Grund beziehungsweise Ursprung des Aufschreis. עֲשׁוּקִים wird im Zusammenhang am besten als Mehrzahl von Unterdrückungshandlungen verstanden.
- source_word: יַזְעִיקוּ
  choice: schreien sie auf
  rationale: Das Hifil von זעק bezeichnet hier einen lauten Aufschrei aus Bedrängnis.
- source_word: יְשַׁוְּעוּ
  choice: sie rufen um Hilfe
  rationale: שוע bezeichnet den Hilferuf; die Wiedergabe unterscheidet ihn passend vom vorhergehenden allgemeinen Aufschrei.
- source_word: מִזְּרֹעַ רַבִּים
  choice: wegen der Macht der Mächtigen
  rationale: זְרוֹעַ bedeutet wörtlich »Arm«, ist hier jedoch ein Bild für Kraft beziehungsweise Macht. רַבִּים bezeichnet in diesem Zusammenhang gesellschaftlich Mächtige, nicht bloß eine große Anzahl.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verben werden mit »aufschreien« und »um Hilfe rufen« unterschieden. Das hebräische Bild vom Arm wird im Haupttext zugunsten unmittelbarer Verständlichkeit als »Macht« wiedergegeben und in der Fußnote bewahrt.
