  text: But no one says[a], ‘Where is God my Maker, who gives songs in the night?’
translation:
  language: de
  text: 'Doch niemand sagt: »Wo ist Gott, mein Schöpfer[a], der in der Nacht Lieder schenkt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch wörtlich »meine Schöpfer«; die Pluralform bezeichnet hier den einen Gott.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Doch niemand
  rationale: Die Verbindung aus Konjunktion und Verneinung setzt einen Gegensatz zum vorausgehenden Zusammenhang. Das im Hebräischen nicht ausdrücklich genannte allgemeine Subjekt wird im Deutschen idiomatisch mit »niemand« wiedergegeben.
- source_word: אָמַר
  choice: fragt
  rationale: Wörtlich steht »sagt«, doch zusammen mit der direkten Frage אַיֵּה gibt »fragt« die kommunikative Funktion im Deutschen natürlich wieder. Die Perfektform bezeichnet im Zusammenhang eine allgemeine, wiederkehrende Beobachtung und wird daher präsentisch übersetzt.
- source_word: אַיֵּה
  choice: Wo ist
  rationale: Das Fragewort erkundigt sich nach Ort beziehungsweise Gegenwart und wird direkt mit »Wo ist« wiedergegeben.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Der in Hiob gebräuchliche singularische Gottesname wird mit dem klaren deutschen Standardwort »Gott« übersetzt.
- source_word: עֹשָׂי
  choice: mein Schöpfer
  rationale: Die Form ist grammatisch pluralisch und trägt ein Suffix der ersten Person Singular, bezieht sich hier jedoch auf den einen Gott. »Mein Schöpfer« gibt den gemeinten Referenten idiomatisch wieder; die Form »meine Schöpfer« bleibt in der Fußnote sichtbar.
- source_word: נֹתֵן
  choice: der … schenkt
  rationale: Das Partizip beschreibt Gottes charakteristisches Handeln. »Schenkt« bringt den Gedanken des Gebens in diesem poetischen Zusammenhang natürlich zum Ausdruck, ohne den Inhalt der Lieder näher festzulegen.
- source_word: זְמִרוֹת
  choice: Lieder
  rationale: Das Substantiv bezeichnet Lieder und kann Lobgesänge einschließen. »Lieder« wahrt die lexikalische Weite, ohne eine ausdrücklich kultische Bedeutung einzutragen.
- source_word: בַּלָּיְלָה
  choice: in der Nacht
  rationale: Die Formulierung bewahrt den poetischen Klang und entspricht der räumlich-zeitlichen hebräischen Wendung.
theological_decisions:
- issue: Numerus von עֹשָׂי in Bezug auf Gott
  choice: 'singularischer Sinn: »mein Schöpfer«'
  alternative: 'formaler Plural: »meine Schöpfer«'
  rationale: Obwohl die hebräische Form formal im Plural steht, bezeichnet sie hier den einen Gott. Der Singular verhindert im Haupttext ein irreführendes polytheistisches Verständnis; die grammatische Spannung wird durch die Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Schlichtheit. Die direkte Rede bleibt knapp; »in der Nacht Lieder schenkt« bewahrt das Bild und vermeidet eine nicht ausdrücklich geforderte Festlegung auf Lobgesänge.
