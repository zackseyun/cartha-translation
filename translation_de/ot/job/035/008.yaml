  text: לְ/אִישׁ כָּמ֥וֹ/ךָ רִשְׁעֶ֑/ךָ וּ/לְ/בֶן אָ֝דָ֗ם צִדְקָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/008.yaml
  text: Your wickedness affects a man like yourself[a], and your righteousness a son of man.
translation:
  language: de
  text: Deine Bosheit trifft einen Menschen wie dich, und deine Gerechtigkeit einen Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch ben-ʾadam, eine poetische Bezeichnung für einen sterblichen Menschen; kein messianischer Titel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִישׁ
  choice: trifft einen Menschen
  rationale: Die Präposition לְ bezeichnet im elliptischen Satz die Person, auf die sich die Wirkung des Handelns erstreckt. Das aus dem Zusammenhang ergänzte „trifft“ gibt diesen Sinn im Deutschen knapp und natürlich wieder.
- source_word: כָּמוֹךָ
  choice: wie dich
  rationale: Die ausdrückliche Vergleichsform bezeichnet einen Menschen, der dem Angeredeten gleich ist.
- source_word: רִשְׁעֶךָ
  choice: deine Bosheit
  rationale: רֶשַׁע bezeichnet hier moralische Bosheit beziehungsweise schuldhaftes Handeln und steht als Gegenbegriff zu „Gerechtigkeit“.
- source_word: וּלְבֶן אָדָם
  choice: und … einen Menschensohn
  rationale: בֶּן־אָדָם ist hier eine poetische Bezeichnung für einen sterblichen Menschen und bildet die Parallele zu אִישׁ. „Menschensohn“ bewahrt das hebräische Bild; eine Fußnote verhindert eine messianische Überdeutung.
- source_word: צִדְקָתֶךָ
  choice: deine Gerechtigkeit
  rationale: צְדָקָה bezeichnet hier gerechtes beziehungsweise richtiges Handeln und steht parallel zu „Bosheit“.
theological_decisions:
- issue: Bedeutung von בֶּן־אָדָם im Kontext
  choice: allgemeiner sterblicher Mensch, im Haupttext bildnah als „Menschensohn“ wiedergegeben
  alternative: '„ein Mensch“; nicht: der messianische Titel „der Menschensohn“'
  rationale: Im Hiobbuch ist der Ausdruck eine gewöhnliche poetische Bezeichnung für einen Menschen. Der unbestimmte Artikel und die Fußnote wahren das Bild, ohne einen christologischen Titel in den Vers hineinzulesen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Ellipse des Hebräischen wird nur durch das einmal gesetzte Verb „trifft“ ergänzt; im zweiten Satzglied bleibt sie durch die deutsche Parallelkonstruktion erkennbar.
