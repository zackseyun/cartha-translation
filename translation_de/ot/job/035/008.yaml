  source_fidelity: Die elliptische Aussage wird sachgerecht durch ein ergänztes Verb wiedergegeben. „Bosheit“ und „Gerechtigkeit“ entsprechen רִשְׁעֶךָ und צִדְקָתֶךָ; die beiden menschlichen Bezugspersonen bleiben parallel. Die Wiedergabe von בֶן־אָדָם als „Menschensohn“ ist im Deutschen jedoch missverständlich, weil das Wort gewöhnlich als christologischer Titel verstanden wird, obwohl es hier ein generischer poetischer Ausdruck ist.
  naturalness: „Deine Bosheit trifft einen Menschen wie dich, und deine Gerechtigkeit einen Menschensohn“ ist syntaktisch möglich, aber „einen Menschensohn“ ist im modernen Standarddeutsch außerhalb eines Titels unnatürlich und semantisch irreführend. „Einen Menschen“ ist idiomatisch und wahrt den generischen Sinn.
  terminology: „Bosheit“ und „Gerechtigkeit“ sind angemessen. Für בֶן־אָדָם sollte der Haupttext nicht „Menschensohn“ verwenden; die poetisch-generische hebräische Form kann in einer Anmerkung erläutert werden, ohne eine messianische Lesart nahezulegen.
