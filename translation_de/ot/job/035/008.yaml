  to: Deine Bosheit trifft einen Menschen wie dich, und deine Gerechtigkeit einen Menschen.[a]
  rationale: Die Übersetzung ersetzt allein den im Deutschen missverständlichen und unidiomatischen Ausdruck „einen Menschensohn“ durch „einen Menschen“. Die Fußnote dokumentiert die hebräische poetische Form und grenzt die hier unzutreffende Titellesart ab. Die elliptische Parallelstruktur sowie die Aussage, dass menschliches Handeln andere Menschen betrifft, bleiben erhalten.
