  rationale: Der Personenname wird nach der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: וַיֹּאמַר
  choice: ':'
  rationale: Das anschließende וַיֹּאמַר leitet den Wortlaut der Rede ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlich; „antwortete und sagte“ wäre zwar formnäher, klänge aber unnötig redundant.
