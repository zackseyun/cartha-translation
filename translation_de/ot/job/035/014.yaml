  text: אַ֣ף כִּֽי תֹ֭אמַר לֹ֣א תְשׁוּרֶ֑/נּוּ דִּ֥ין לְ֝/פָנָ֗י/ו וּ/תְח֥וֹלֵֽל לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/014.yaml
  text: How much less when you say[a], ‘You do not see him’; the case is before him, and you must wait for him.
translation:
  language: de
  text: 'Um wie viel weniger, wenn du sagst: »Du siehst ihn nicht.« Die Rechtssache liegt vor ihm; warte auf ihn[a]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bei einer möglichen konkreteren Deutung des hebräischen Verbs: »und winde dich vor ihm«. Das Verb ist hier schwer zu deuten; häufig wird es als erwartungsvolles Warten verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: Wie viel weniger, wenn
  rationale: Die Wendung führt das steigernde beziehungsweise folgernde Argument aus dem Zusammenhang fort. Die knappe, im Hebräischen elliptische Form bleibt erhalten, ohne einen nicht ausdrücklich genannten Hauptsatz einzufügen.
- source_word: תֹאמַר
  choice: du sagst
  rationale: Die einfache Verbform bezeichnet eine Äußerung und richtet sich im Singular an Hiob; eine Erweiterung wie „zu dir selbst“ ist nicht erforderlich.
- source_word: לֹא תְשׁוּרֶנּוּ
  choice: Du siehst ihn nicht
  rationale: שׁור bedeutet hier „sehen, wahrnehmen“. Subjekt ist das angesprochene „du“, das Suffix verweist auf Gott. So bleibt Hiobs Klage über Gottes Verborgenheit gewahrt.
- source_word: דִּין
  choice: der Rechtsfall
  rationale: דִּין bezeichnet in diesem forensischen Zusammenhang die zur Entscheidung vorliegende Streitsache, nicht lediglich den abstrakten Begriff „Gerechtigkeit“.
- source_word: לְפָנָיו
  choice: liegt ihm vor
  rationale: Die deutsche Wendung gibt idiomatisch wieder, dass die Sache vor Gott zur Beurteilung steht, und bewahrt das Rechtsbild.
- source_word: וּתְחוֹלֵל לוֹ
  choice: warte auf ihn
  rationale: Das schwierige Verb wird im Zusammenhang am ehesten als erwartungsvolles Warten auf Gottes Handeln verstanden. Die alternative Ableitung im Sinn von „sich winden“ wird in der Fußnote offengehalten.
theological_decisions:
- issue: Gottes Verborgenheit und der vor ihm liegende Rechtsfall
  choice: Hiob sagt, dass er Gott nicht sieht; dennoch liegt sein Rechtsfall Gott vor.
  alternative: Gott sieht den Rechtsfall nicht.
  rationale: Grammatik und Zusammenhang stützen „du siehst ihn nicht“. Damit behauptet der Vers nicht Gottes Unwissenheit, sondern hält die Spannung zwischen Gottes gegenwärtiger Verborgenheit und seiner richterlichen Zuständigkeit fest.
- issue: Bedeutung der abschließenden Aufforderung
  choice: warte auf ihn
  alternative: winde dich vor ihm / seinetwegen
  rationale: Die Bedeutung des seltenen Verbs ist umstritten. Das erwartungsvolle Warten passt zum Rechtsbild, darf aber nicht als lexikalisch alternativlos dargestellt werden; deshalb wird die konkretere mögliche Bedeutung in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die elliptische Eröffnung des hebräischen Satzes bleibt bewusst bestehen. „Rechtsfall“ hält das forensische Bild fest; „warte“ ist gegenwärtiger und allgemein verständlicher als „harre“.
