  text: אַךְ שָׁ֭וְא לֹא יִשְׁמַ֥ע אֵ֑ל וְ֝/שַׁדַּ֗י לֹ֣א יְשׁוּרֶֽ/נָּה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/013.yaml
  text: Surely God does not hear emptiness[a], and the Almighty does not regard it.
translation:
  language: de
  text: Gewiss hört Gott Nichtiges nicht, und der Allmächtige beachtet es nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vergebliches“, „Wertloses“ oder „Falsches“. Das hebräische Wort kann etwas Leeres, Nutzloses oder Trügerisches bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel setzt hier eine nachdrückliche, im Zusammenhang zugleich adversative Schlussfolgerung. „Doch“ gibt diesen Übergang im Deutschen natürlich wieder.
- source_word: שָׁוְא
  choice: Nichtiges
  rationale: Das Wort bezeichnet Leeres, Vergebliches, Wertloses oder Trügerisches. Die substantivierte Form „Nichtiges“ bewahrt die Abstraktheit und legt den Ausdruck nicht vorschnell auf einen „leeren Hilferuf“ oder auf „Lüge“ fest.
- source_word: לֹא יִשְׁמַע
  choice: hört … nicht
  rationale: Das Imperfekt formuliert im Zusammenhang eine allgemeine Aussage. „Hören“ wahrt die direkte Bedeutung, ohne bereits deutend „erhören“ einzusetzen.
- source_word: אֵל
  choice: Gott
  rationale: „Gott“ ist hier die natürliche deutsche Wiedergabe des üblichen Gottestitels אֵל.
- source_word: וְשַׁדַּי
  choice: und der Allmächtige
  rationale: Der traditionelle und sachgerechte deutsche Titel „der Allmächtige“ gibt שַׁדַּי wieder und passt zum Sprachgebrauch des Hiobbuches.
- source_word: לֹא יְשׁוּרֶנָּה
  choice: beachtet es nicht
  rationale: שׁור bedeutet „anschauen, ansehen, beachten“. „Beachten“ bildet den Parallelismus zu „hören“ idiomatisch ab; das Pronomen nimmt שָׁוְא auf.
theological_decisions:
- issue: Bedeutung und Bezug von שָׁוְא in Elihus Aussage
  choice: Die abstrakte und mehrdeutige Bezeichnung „Nichtiges“ bleibt erhalten.
  alternative: Den Ausdruck als „leeres Gebet“, „Lüge“ oder „stolzes Reden“ konkretisieren.
  rationale: Der hebräische Wortlaut lässt offen, ob besonders Vergebliches, Wertloses oder Trügerisches gemeint ist. Die Übersetzung vermeidet daher sowohl eine Aussage über mangelnde göttliche Wahrnehmung als auch eine zu enge Bestimmung der Art des Rufens.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des Hebräischen bleibt erhalten. „Hört“ statt „erhört“ und „Nichtiges“ statt einer konkretisierenden Umschreibung bewahren die Mehrdeutigkeit des Ausgangstextes.
