base_translation:
  language: en
  yaml_path: translation/ot/job/035/015.yaml
  text: And now[a], because his anger has not punished, and he does not greatly heed transgression[b],
translation:
  language: de
  text: Und nun, weil sein Zorn nicht strafend eingegriffen hat[a] und er Vergehen nicht besonders beachtet[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht in seinem Zorn heimgesucht hat“. Das hebräische Verb kann „aufsuchen“, „sich kümmern um“ oder „strafend heimsuchen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit „Vergehen“ wiedergegebene hebräische Wort ist unsicher; möglich sind auch „Auflehnung“, „Anmaßung“ oder „schweres Unrecht“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch den zeitlich-diskursiven Übergang, ohne das Verhältnis zum Kontext stärker festzulegen.
- source_word: כִּי
  choice: weil
  rationale: Gibt die hier naheliegende begründende Funktion wieder; eine inhaltseinleitende Wiedergabe mit „dass“ bleibt grammatisch möglich.
- source_word: אַיִן פָּקַד אַפּוֹ
  choice: sein Zorn nicht strafend eingegriffen hat
  rationale: Die Konstruktion ist schwierig. פקד kann „aufsuchen“, „sich kümmern um“ oder im Gerichtszusammenhang „strafend heimsuchen/eingreifen“ bedeuten. Die Formulierung hält den Zorn als handelnde Größe fest und drückt die Strafbedeutung natürlich aus.
- source_word: וְלֹא יָדַע
  choice: und er … nicht beachtet
  rationale: ידע bezeichnet hier wahrscheinlich nicht fehlendes Wissen, sondern fehlende Wahrnehmung oder Beachtung.
- source_word: בַּפַּשׁ מְאֹד
  choice: das schwere Vergehen
  rationale: Das seltene und unsichere פשׁ wird im gerichtlichen Kontext als Vergehen verstanden; מְאֹד wird attributiv als „schwer“ wiedergegeben. Die Unsicherheit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Aussage über Gottes Zorn und seine Beachtung menschlichen Vergehens
  choice: Die Zeile wird als Teil von Elihus Äußerung wiedergegeben, wonach Gottes Zorn bislang nicht strafend eingegriffen und er das schwere Vergehen nicht beachtet habe.
  alternative: Man kann die zweite Hälfte auch auf große Anmaßung oder Auflehnung beziehen und פקד neutraler mit „heimgesucht“ oder „sich gekümmert“ wiedergeben.
  rationale: Die schwierige Formulierung darf nicht zu einer allgemeinen Lehraussage über göttliche Unwissenheit oder Gleichgültigkeit geglättet werden. Die Übersetzung bewahrt den Aussagecharakter im Redekontext und kennzeichnet die lexikalischen Unsicherheiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Satzfügung bleibt erkennbar, wird aber idiomatisch formuliert. Der Vers endet entsprechend dem überlieferten Zusammenhang als unabgeschlossener Begründungssatz mit Komma.
