  text: who teaches us more than the beasts of the earth and makes us wiser than the birds of the heavens[a].
translation:
  language: de
  text: der uns mehr lehrt als die Tiere der Erde und uns weiser macht als die Vögel des Himmels[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der uns durch die Tiere der Erde lehrt und uns durch die Vögel des Himmels weise macht.“ Die hebräische Präposition kann statt eines Vergleichs auch die Quelle oder das Mittel bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַ֭לְּפֵנוּ
  choice: der uns mehr lehrt
  rationale: Das Piel-Partizip von למד mit Suffix der 1. Person Plural bezeichnet aktives Lehren. „Mehr“ verdeutlicht zusammen mit dem folgenden מִן die im Kontext wahrscheinliche Vergleichsbedeutung.
- source_word: מִבַּהֲמוֹת אָרֶץ
  choice: als die Tiere der Erde
  rationale: מִן wird hier am wahrscheinlichsten vergleichend gebraucht. „Tiere“ ist im heutigen Deutsch natürlich und gibt בְּהֵמוֹת ohne unnötige Einschränkung wieder; „der Erde“ bewahrt das poetische Bild.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: als die Vögel des Himmels
  rationale: Die Präposition wird parallel zum ersten Halbvers vergleichend verstanden. „Vögel des Himmels“ wahrt die hebräische Ausdrucksweise und den gehobenen poetischen Ton.
- source_word: יְחַכְּמֵנוּ
  choice: uns weiser macht
  rationale: Das Piel-Imperfekt von חכם mit Suffix der 1. Person Plural hat kausativen Sinn. Der Komparativ „weiser“ bringt die wahrscheinlich vergleichende Konstruktion idiomatisch zum Ausdruck.
theological_decisions:
- issue: Bedeutung der Präposition מִן in beiden Vershälften
  choice: 'vergleichend: Gott lehrt die Menschen mehr als die Tiere und macht sie weiser als die Vögel'
  alternative: 'Herkunft beziehungsweise Quelle: Gott lehrt uns von den Tieren der Erde her und macht uns durch die Vögel des Himmels weise'
  rationale: Der poetische Parallelismus und der Zusammenhang sprechen eher für einen Vergleich der dem Menschen verliehenen Einsicht mit der Tierwelt. Da מִן jedoch auch die Quelle bezeichnen kann, bleibt diese echte Mehrdeutigkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, leicht poetischem Klang. Der Relativsatz bleibt entsprechend dem hebräischen Versfragment und seinem Kontext kleingeschrieben; die Bildsprache „Tiere der Erde“ und „Vögel des Himmels“ wird bewahrt.
