  - severity: low
    issue: Die Fußnote bezeichnet „Was bewirkst du an ihm?“ als wörtlicher.
    rationale: Die deutsche Wendung „an ihm“ ist keine verlässlich wörtlichere Abbildung von פעל בו. Eine Fußnote sollte die lexikalische Spannweite („tun“/„bewirken“) erläutern, ohne eine irreführende Scheinlinearität zu behaupten.
