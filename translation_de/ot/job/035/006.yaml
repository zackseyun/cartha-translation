source:
  edition: WLC
  text: אִם חָ֭טָאתָ מַה תִּפְעָל בּ֑/וֹ וְ/רַבּ֥וּ פְ֝שָׁעֶ֗י/ךָ מַה תַּעֲשֶׂה לּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/006.yaml
  text: If you sin[a], what do you accomplish against him? And if your transgressions are many, what do you do to him?
translation:
  language: de
  text: Wenn du sündigst, was richtest du gegen ihn aus?[a] Und wenn deine Übertretungen zahlreich sind, was tust du ihm an?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder mit dem allgemeineren Sinn des hebräischen Verbs: „Was tust oder bewirkst du ihm gegenüber?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתָ
  choice: Wenn du sündigst
  rationale: אִם leitet eine Bedingung ein; das deutsche Präsens gibt den allgemeinen, hypothetischen Sinn des hebräischen Perfekts in diesem rhetorischen Zusammenhang natürlich wieder.
- source_word: מַה תִּפְעָל בּוֹ
  choice: was richtest du gegen ihn aus?
  rationale: פעל bezeichnet ein Tun oder Bewirken. Die idiomatische Wendung „gegen ihn ausrichten“ gibt zusammen mit בּוֹ die auf Gott gerichtete, jedoch wirkungslose Handlung wieder, ohne zu behaupten, Sünde sei Gott moralisch gleichgültig.
- source_word: וְרַבּוּ פְשָׁעֶיךָ
  choice: Und wenn deine Vergehen zahlreich sind
  rationale: Das im parallelen zweiten Satzglied nur sinngemäß vorhandene „wenn“ wird im Deutschen ergänzt. פשע bezeichnet schwere, oft bewusst rebellische Übertretungen; „Vergehen“ ist verständlich und bewahrt den moralischen Ernst.
- source_word: מַה תַּעֲשֶׂה לּוֹ
  choice: was tust du ihm an?
  rationale: עשה mit ל fragt danach, was jemand einem anderen tut. „Jemandem etwas antun“ ist im Deutschen natürlich und trägt in diesem Kontext die rhetorische Frage nach einer schädigenden Wirkung.
theological_decisions:
- issue: Ob die rhetorischen Fragen besagen, menschliche Sünde sei für Gott überhaupt ohne Bedeutung, oder enger, sie könne ihn nicht schädigen oder mindern.
  choice: Die Formulierung betont, dass der Mensch mit seiner Sünde gegen Gott nichts ausrichten und ihm keinen Schaden zufügen kann.
  alternative: 'Neutraler und wörtlicher wäre: „Was tust du an ihm?“ beziehungsweise „Was tust du ihm?“'
  rationale: Im Zusammenhang hebt Elihu Gottes Erhabenheit und Unabhängigkeit hervor. Die Übersetzung vermeidet die weitergehende Aussage, Sünde sei Gott moralisch gleichgültig, und beschränkt sich auf ihre fehlende Macht, ihn zu beeinträchtigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden rhetorischen Fragen und ihr Parallelismus bleiben erhalten; die erste Hälfte ist idiomatisch wiedergegeben, während die Fußnote die wörtlichere Möglichkeit dokumentiert.
