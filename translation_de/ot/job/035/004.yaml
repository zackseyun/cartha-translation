base_translation:
  language: en
  yaml_path: translation/ot/job/035/004.yaml
  text: I will answer you with words[a], and your friends with you.
translation:
  language: de
  text: Ich werde dir mit Worten antworten[a] und auch deinen Freunden zusammen mit dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich werde dir antworten und deinen Freunden zusammen mit dir.« Das hebräische Verb kann »antworten« oder »erwidern« bedeuten. Die Schlussfügung kann so verstanden werden, dass Elihu Job und dessen Freunde gemeinsam anspricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Ich
  rationale: Das ausdrücklich gesetzte Personalpronomen hebt den Sprecher hervor und wird deshalb beibehalten.
- source_word: אֲשִׁיבְךָ
  choice: werde dir … antworten
  rationale: Der Hifil von שוב kann hier idiomatisch »antworten, erwidern« bedeuten; das Suffix bezeichnet den Angeredeten.
- source_word: מִלִּין
  choice: mit Worten
  rationale: Die aramaisierende Pluralform bedeutet »Worte« bzw. »Rede«; die instrumentale Wiedergabe bewahrt die konkrete Ausdrucksweise des Hebräischen.
- source_word: וְאֶת
  choice: und
  rationale: Die Konjunktion verbindet einen weiteren Gegenstand der Antwort; der hebräische Objektmarker wird im Deutschen nicht eigens wiedergegeben.
- source_word: רֵעֶיךָ
  choice: deinen Freunden
  rationale: רֵעַ bezeichnet Freunde oder Gefährten; im Kontext sind Jobs Gesprächspartner gemeint.
- source_word: עִמָּךְ
  choice: mit dir
  rationale: Die Präposition bezeichnet Begleitung oder Zuordnung und wird direkt wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markante Wendung »mit Worten antworten« bewahrt die konkrete hebräische Formulierung; der Gedankenstrich macht kenntlich, dass Job und seine Freunde gemeinsam als Adressaten verstanden werden können.
