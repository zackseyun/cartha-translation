  yaml_path: translation/ot/job/035/005.yaml
  text: Look at the heavens and see; gaze at the clouds—they are higher than you.
translation:
  language: de
  text: 'Blicke zum Himmel und sieh hin; betrachte die Wolken: Sie sind höher als du.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֵּט
  choice: Blicke
  rationale: Der Hifil-Imperativ fordert dazu auf, den Blick bewusst nach oben zu richten; „Blicke“ ist würdig und im modernen Standarddeutsch verständlich.
- source_word: שָׁמַיִם
  choice: zum Himmel
  rationale: Im Deutschen ist „zum Himmel blicken“ die natürliche Entsprechung; der hebräische Formplural bezeichnet hier den Himmel beziehungsweise die Himmelsräume.
- source_word: וּרְאֵה
  choice: und sieh hin
  rationale: Bewahrt den zweiten Wahrnehmungsimperativ und vermeidet, ihn trotz der engen Parallelität ganz auszulassen.
- source_word: וְשׁוּר
  choice: betrachte
  rationale: Gibt die Aufforderung zu aufmerksamem, anhaltendem Schauen wieder und unterscheidet sie sprachlich von ראה.
- source_word: שְׁחָקִים
  choice: die Wolken
  rationale: Das Wort kann hohe Wolken beziehungsweise den Wolkenhimmel bezeichnen; im Kontext ihrer sichtbaren Höhe ist „Wolken“ natürlich und sachgerecht.
- source_word: גָּבְהוּ מִמֶּךָּ
  choice: Sie sind höher als du
  rationale: Gibt den perfektischen Zustandsbefund idiomatisch wieder und erhält den direkten Vergleich mit dem Angeredeten.
