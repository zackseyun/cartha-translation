  text: וְ֭/הוּא לִ/קְבָר֣וֹת יוּבָ֑ל וְֽ/עַל גָּדִ֥ישׁ יִשְׁקֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/032.yaml
  text: Yet he is carried to the grave[c][b][a], and over the mound one keeps watch.
translation:
  language: de
  text: Doch er wird zu den Gräbern gebracht[a], und über dem Grabhügel[b] hält man Wache[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „zu den Gräbern“; der Plural kann den Gräberbereich oder die Begräbnisstätte insgesamt bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet einen Haufen oder eine aufgeschichtete Masse; hier ist wahrscheinlich der aufgeworfene Erdhügel über einem Grab gemeint.
    reason: cultural_note
  - marker: c
    text: 'Oder: „und er hält über dem Grabhügel Wache“, wenn der Begrabene als Subjekt verstanden wird; im Hebräischen ist das Subjekt nicht ausdrücklich genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: Doch er
  rationale: Das waw kann schlicht mit „und“ wiedergegeben werden; im Zusammenhang hebt es jedoch den Gegensatz zwischen dem Leben des Frevlers und seinem ehrenvollen Begräbnis hervor. „Doch“ macht diesen Kontrast knapp sichtbar.
- source_word: לִקְבָרוֹת
  choice: zu den Gräbern
  rationale: Das hebräische Substantiv steht im Plural. Die Wiedergabe bewahrt diese Form und kann den Gräberbereich beziehungsweise die Begräbnisstätte kollektiv bezeichnen.
- source_word: יוּבָל
  choice: wird … gebracht
  rationale: Der Hofal des Verbs יבל bezeichnet ein Geführt- oder Gebrachtwerden. Im Bestattungskontext ist damit das Geleit zum Grab gemeint; „gebracht“ ist natürlich und legt nicht unnötig fest, ob der Tote getragen wird.
- source_word: גָּדִישׁ
  choice: Grabhügel
  rationale: גָּדִישׁ bezeichnet einen Haufen oder eine aufgeschichtete Masse. Im Bestattungskontext ist wahrscheinlich die über dem Grab aufgeworfene Erde gemeint; „Grabhügel“ verdeutlicht dies, ohne den Ausdruck mit „Grab“ gleichzusetzen.
- source_word: יִשְׁקֹד
  choice: hält man Wache
  rationale: שׁקד bedeutet wachsam sein, wachen oder Wache halten. Da das hebräische Verb kein ausdrücklich genanntes Subjekt hat, bewahrt die unpersönliche Formulierung „man“ diese Offenheit und gibt zugleich die aktive Verbform natürlich wieder.
theological_decisions:
- issue: Nicht genanntes Subjekt von יִשְׁקֹד
  choice: 'unpersönlich: „hält man Wache“'
  alternative: „hält er Wache“
  rationale: Der hebräische Text nennt das Subjekt nicht ausdrücklich. Es könnte derselbe Mann sein, doch diese Deutung soll nicht stillschweigend festgelegt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der hebräische Plural „Gräber“ und die Unbestimmtheit des Subjekts im zweiten Halbvers bleiben erhalten; „Grabhügel“ vermittelt das konkrete Bild verständlich.
