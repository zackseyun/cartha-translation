base_translation:
  language: en
  yaml_path: translation/ot/job/021/029.yaml
  text: Have you not asked those who travel the road[b][a], and do you not recognize their signs?
translation:
  language: de
  text: Habt ihr nicht Reisende befragt? Und erkennt ihr ihre Zeichen[a] nicht?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Merkmale«, »ihre Hinweise« oder »ihre Belege«. Gemeint sind wahrscheinlich Anzeichen oder Erkenntnisse, die Reisenden aus ihrer Erfahrung bekannt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Habt ihr nicht
  rationale: Bewahrt die rhetorische Frage, die Zustimmung erwartet, und zugleich Hiobs vorwurfsvollen Ton.
- source_word: שְׁאֶלְתֶּם
  choice: gefragt
  rationale: Gibt die Grundbedeutung natürlich und unmittelbar im modernen Deutschen wieder.
- source_word: עֹבְרֵי דָרֶךְ
  choice: die auf dem Weg unterwegs sind
  rationale: Gibt die wörtliche Vorstellung der auf dem Weg Vorüberziehenden verständlich wieder; gemeint sind Reisende mit weitreichender Erfahrung.
- source_word: וְאֹתֹתָם
  choice: ihre Zeichen
  rationale: Bewahrt die übliche Bedeutung von אוֹת und lässt offen, ob konkrete Merkmale, Hinweise oder Belege aus den Reiseerfahrungen gemeint sind.
- source_word: לֹא תְנַכֵּרוּ
  choice: erkennt ihr … nicht
  rationale: Das Piel von נכר kann hier „erkennen“ oder „anerkennen“ bedeuten; „erkennen“ passt unmittelbar zu „Zeichen“, ohne die mögliche Nuance des Anerkennens auszuschließen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweigliedrige rhetorische Frage bleibt erhalten. Die Mehrdeutigkeit von אֹתֹתָם wird im Haupttext nicht auf „Zeugnis“ verengt, sondern in der Fußnote erläutert.
