source:
  edition: WLC
  text: מַה שַׁדַּ֥י כִּֽי נַֽעַבְדֶ֑/נּוּ וּ/מַה נּ֝וֹעִ֗יל כִּ֣י נִפְגַּע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/015.yaml
  text: What is the Almighty[a], that we should serve him? And what would we gain if we entreat him?
translation:
  language: de
  text: Was ist der Allmächtige, dass wir ihm dienen sollten? Und was hätten wir davon, wenn wir ihn anflehten?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה שַׁדַּי
  choice: Was ist der Allmächtige
  rationale: מַה eröffnet eine geringschätzige rhetorische Frage nach Bedeutung oder Wert. „Was ist“ bewahrt diese auffällige und bewusst abweisende Formulierung; שַׁדַּי wird als verständlicher Gottes­titel übersetzt.
- source_word: נַעַבְדֶנּוּ
  choice: dass wir ihm dienen sollten
  rationale: עבד bezeichnet hier den Dienst an Gott im umfassenden Sinn von religiöser Hingabe und Gefolgschaft, nicht nur gottesdienstliche Anbetung.
- source_word: וּמַה נּוֹעִיל
  choice: Und was hätten wir davon
  rationale: Die Wendung gibt die Frage nach Nutzen oder Gewinn in natürlichem modernem Deutsch wieder und erhält die eigennützige Perspektive der zitierten Frevler.
- source_word: כִּי נִפְגַּע בּוֹ
  choice: wenn wir ihn anflehten
  rationale: פגע mit ב bezeichnet hier das inständige Bitten oder Anrufen einer Person. Der Konditionalsatz mit „wenn“ bildet die Funktion von כִּי idiomatisch ab.
theological_decisions:
- issue: Wiedergabe des Gottestitels שַׁדַּי
  choice: der Allmächtige
  alternative: Schaddai
  rationale: Der Titel wird übersetzt, damit seine Bedeutung für heutige Leser unmittelbar erkennbar bleibt; eine Transliteration würde den Sinn weniger deutlich vermitteln.
- issue: Bewahrung der abwertenden rhetorischen Frage
  choice: Was ist der Allmächtige
  alternative: Wer ist der Allmächtige
  rationale: „Was“ bewahrt die sachlich-abwertende Frage nach Gottes Wert für die Sprecher. „Wer“ klänge eher nach einer neutralen Frage nach Identität und würde die theologische Spannung abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Form „Was ist der Allmächtige“ bleibt bewusst erhalten, weil sie die geringschätzige Haltung der in diesem Kontext zitierten Gottlosen ausdrückt; „was hätten wir davon“ macht ihren Nutzenkalkül natürlich verständlich.
