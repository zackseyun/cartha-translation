lexical_decisions:
- source_word: שָׂאוּנִי
  choice: Ertragt mich
  rationale: Das Verb נָשָׂא bedeutet wörtlich „heben, tragen“, fordert hier aber idiomatisch die mehreren Angeredeten auf, Hiob auszuhalten und ihn zu Wort kommen zu lassen. „Ertragt mich“ bewahrt das Bild des Tragens und klingt würdevoll, ohne altertümlich zu sein.
- source_word: וְאָנֹכִי אֲדַבֵּר
  choice: dann will ich reden
  rationale: אָנֹכִי ist das betonte Pronomen „ich“, und אֲדַבֵּר bezeichnet das Reden. Das deutsche „dann“ gibt den natürlichen Zusammenhang zwischen Aufforderung und anschließendem Reden wieder; „will ich reden“ entspricht dem entschlossenen futurischen Sinn.
- source_word: וְאַחַר דַּבְּרִי
  choice: und nachdem ich geredet habe
  rationale: דַּבְּרִי ist formal „mein Reden“. Der temporale Nebensatz ist im modernen Deutsch natürlicher und hält den Bezug auf die abgeschlossene Redehandlung fest.
- source_word: תַלְעִיג
  choice: magst du spotten
  rationale: Die Hifil-Form von לעג bedeutet „spotten, verhöhnen“. Die Verbform ist Singular und wird deshalb mit „du“ wiedergegeben. „Magst du“ wahrt die mögliche erlaubende oder einräumende Nuance, ohne sie als einzig mögliche Deutung auszugeben.
theological_decisions:
- issue: Numeruswechsel bei den Angeredeten
  choice: Plural „Ertragt“ und Singular „magst du“ beibehalten
  alternative: Den Singular sinngemäß als Plural wiedergeben
  rationale: Der hebräische Text wechselt ausdrücklich vom pluralischen Imperativ שָׂאוּ zum singularischen תַלְעִיג. Die Übersetzung bewahrt diese auffällige Spannung, statt sie stillschweigend zu glätten.
- issue: Modalität von תַלְעִיג
  choice: 'permissiv bzw. konzessiv: „magst du spotten“'
  alternative: 'einfaches Futur: „wirst du spotten“'
  rationale: Im Kontext bittet Hiob zunächst um Gehör und räumt dem Gegenüber anschließend das Spotten ein. Da die hebräische Form zugleich schlicht futurisch verstanden werden kann, wird diese Alternative in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der markante Wechsel von pluralischer Anrede zu singularischer Anrede bleibt erhalten. Die Formulierung „Ertragt mich“ bewahrt sowohl das hebräische Tragbild als auch den idiomatischen Sinn des geduldigen Anhörens.
