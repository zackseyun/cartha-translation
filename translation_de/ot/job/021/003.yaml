  text: Habt Geduld mit mir[a], und ich will reden; danach magst du spotten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Tragt mich“; gemeint ist: „Haltet mich aus“ oder „Lasst mich gewähren“, während ich rede.'
