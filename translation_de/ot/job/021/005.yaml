  text: פְּנוּ אֵלַ֥/י וְ/הָשַׁ֑מּוּ וְ/שִׂ֖ימוּ יָ֣ד עַל פֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/005.yaml
  text: Turn to me and be appalled[a], and put your hand over your mouth.
translation:
  language: de
  text: Wendet euch mir zu und seid entsetzt[a], und legt die Hand auf den Mund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seid fassungslos“ oder „seid erstaunt“. Das hebräische Verb bezeichnet hier eine erschütterte, schockierte Reaktion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: Wendet euch mir zu
  rationale: Der pluralische Imperativ von פנה mit אֶל bezeichnet eine Hinwendung zum Sprecher. „Wendet euch mir zu“ bewahrt die Richtung und den dringlichen Aufruf und klingt im modernen Deutschen natürlicher als „Kehrt euch zu mir“.
- source_word: וְהָשַׁמּוּ
  choice: und erschreckt
  rationale: Die Hifil-Form von שׁמם kann eine bestürzte, entsetzte oder fassungslose Reaktion ausdrücken. „Erschreckt“ gibt die Schockwirkung knapp wieder, ohne sie einseitig als bloßes Staunen festzulegen.
- source_word: וְשִׂימוּ
  choice: und legt
  rationale: שׂים bedeutet „setzen, legen, tun“. Im Deutschen ist „die Hand auf den Mund legen“ die natürliche Wendung für die folgende Geste.
- source_word: יָד עַל פֶּה
  choice: die Hand auf den Mund
  rationale: Obwohl im Hebräischen keine Possessivsuffixe stehen, ist aufgrund des pluralischen Imperativs jeweils die eigene Hand und der eigene Mund gemeint. Der bestimmte Artikel bewahrt die knappe hebräische Ausdrucksweise und ist im Deutschen idiomatisch.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallelen Imperative und die knappe Geste des Verstummens bleiben erhalten; die Mehrdeutigkeit der emotionalen Reaktion wird durch eine Fußnote offengelegt.
