  yaml_path: translation/ot/job/021/028.yaml
  text: For you say[a], ‘Where is the house of the noble man, and where is the tent[b], the dwelling place of the wicked?’
translation:
  language: de
  text: 'Denn ihr sagt: »Wo ist das Haus eines vornehmen Mannes, und wo ist das Zelt, die Wohnstätten der Frevler?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Aussage der Angeredeten als Begründung bzw. Erläuterung im Zusammenhang ein.
- source_word: תֹאמְרוּ
  choice: ihr sagt
  rationale: Das Imperfekt bezeichnet hier am natürlichsten eine gegenwärtige bzw. typische Äußerung der Angeredeten.
- source_word: בֵית
  choice: Haus
  rationale: Die Grundbedeutung bleibt erhalten; gemeint sein kann zugleich der Wohnsitz oder Besitz eines gesellschaftlich hochgestellten Mannes.
- source_word: נָדִיב
  choice: Vornehmen
  rationale: Das Wort bezeichnet hier wahrscheinlich einen gesellschaftlich hochgestellten oder fürstlichen Mann, nicht vorrangig einen freigebigen Menschen.
- source_word: אֹהֶל
  choice: Zelt
  rationale: Die konkrete Bildsprache des hebräischen Ausdrucks wird bewahrt, auch wenn damit allgemein eine Behausung gemeint sein kann.
- source_word: מִשְׁכְּנוֹת רְשָׁעִים
  choice: die Wohnstätte der Frevler
  rationale: Die komprimierte hebräische Fügung wird als Apposition zu „Zelt“ verständlich wiedergegeben. Der hebräische Plural ist kollektiv gefasst, ohne die syntaktische Mehrdeutigkeit zu verschweigen.
- source_word: רְשָׁעִים
  choice: Frevler
  rationale: „Frevler“ bezeichnet Menschen, die moralisch schuldig und gottlos handeln, und entspricht dem substantivierten hebräischen Plural in würdigem, verständlichem Deutsch.
