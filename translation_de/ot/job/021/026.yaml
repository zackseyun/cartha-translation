  text: Together they lie down in the dust[a], and worms cover them.
translation:
  language: de
  text: Gemeinsam liegen sie im Staub, und Würmer[a] bedecken sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Maden“. Das hebräische Wort רִמָּה kann im Zusammenhang körperlicher Verwesung Würmer oder Maden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Gemeinsam
  rationale: Das Adverb betont das gemeinsame Schicksal der beiden zuvor gegenübergestellten Menschen. „Gemeinsam“ ist natürlich und lässt offen, ob zeitliche Gleichzeitigkeit gemeint ist.
- source_word: עַל עָפָר
  choice: im Staub
  rationale: Wörtlich steht „auf dem Staub“; im Zusammenhang von Tod und Grab gibt „im Staub“ die hebräische Vorstellung im Deutschen idiomatisch wieder, ohne „Grab“ ausdrücklich hinzuzufügen.
- source_word: יִשְׁכָּבוּ
  choice: liegen sie
  rationale: Die konkrete Bildsprache des Liegens im Tod bleibt erhalten. Das deutsche Präsens eignet sich für die hier ausgesagte allgemeine Folge.
- source_word: רִמָּה
  choice: Würmer
  rationale: Das hebräische Kollektivwort bezeichnet Würmer beziehungsweise Maden im Zusammenhang körperlicher Verwesung. Der deutsche Plural „Würmer“ ist breit verständlich und entspricht der traditionellen Bildsprache.
- source_word: תְּכַסֶּה עֲלֵיהֶם
  choice: bedecken sie
  rationale: Die räumliche Präposition wird im Deutschen natürlich in das Verb „bedecken“ aufgenommen. Wegen des idiomatischen pluralischen Subjekts „Würmer“ steht auch das Verb im Plural.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die konkrete Todessprache des Hebräischen wird bewahrt; weder „Grab“ noch „Verwesung“ wird in den Haupttext erklärend eingefügt.
