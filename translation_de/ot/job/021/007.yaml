    rationale: חַיִל kann Vermögen/Besitz, Kraft oder Macht bezeichnen; zusammen mit גָּבְרוּ ist auch „an Macht gewinnen“ naheliegend. Die textlich nicht eindeutig entscheidbare Nuance soll nicht allein im Haupttext festgelegt werden.
