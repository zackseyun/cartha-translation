source:
  edition: WLC
  text: מַדּ֣וּעַ רְשָׁעִ֣ים יִחְי֑וּ עָ֝תְק֗וּ גַּם גָּ֥בְרוּ חָֽיִל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/007.yaml
  text: Why do the wicked live on[a], grow old, and even become mighty in wealth?
translation:
  language: de
  text: Warum leben die Bösen weiter, werden alt und gewinnen sogar an Macht[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gewinnen an Vermögen/Besitz« oder »an Kraft«; das hebräische Wort kann Vermögen, Besitz, Kraft oder Macht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Das Frageadverb eröffnet Hiobs zugespitzte Klage unmittelbar, ohne erklärende Zusätze.
- source_word: רְשָׁעִים
  choice: die Bösen
  rationale: Bezeichnet hier Menschen, die moralisch verwerflich handeln; die allgemein verständliche Formulierung vermeidet eine Verengung auf bloße rechtliche Schuld.
- source_word: יִחְיוּ
  choice: bleiben ... am Leben
  rationale: Der Imperfekt beschreibt ein fortdauerndes Leben entgegen der Erwartung baldigen Gerichts. Die deutsche Wendung gibt diesen anhaltenden Zustand natürlich wieder.
- source_word: עָתְקוּ
  choice: werden alt
  rationale: Im Zusammenhang mit langem Leben und wachsendem Wohlergehen bezeichnet das Verb wahrscheinlich das Fortschreiten bis ins Alter.
- source_word: גַּם
  choice: sogar
  rationale: 'Das Wort steigert Hiobs Feststellung: Die Bösen leben nicht nur lange, sondern gewinnen darüber hinaus noch an Vermögen oder Macht.'
- source_word: גָּבְרוּ חָיִל
  choice: werden ... immer vermögender
  rationale: Die idiomatische deutsche Wiedergabe verbindet das Zunehmen bzw. Erstarken mit חָיִל im Sinn von Vermögen oder Besitz. Die mögliche Bedeutung Macht oder Stärke bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Das fortdauernde Wohlergehen der Bösen
  choice: Die Frage bleibt als ungelöster Protest Hiobs stehen.
  alternative: Die Aussage durch einen Hinweis auf ein späteres Gericht oder eine verborgene göttliche Absicht erklären.
  rationale: Der hebräische Vers formuliert bewusst die Spannung zwischen der beobachteten Wirklichkeit und der Erwartung gerechter Vergeltung; eine Auflösung wäre ein Zusatz zum Text.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Frageton. »Immer vermögender« ist idiomatischer als eine formnahe Verbindung wie »mächtig an Vermögen«, während die Fußnote die Bedeutungsbreite des Hebräischen offenhält.
