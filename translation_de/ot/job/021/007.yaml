  verdict: revise
  source_fidelity: 'Die Abfolge der hebräischen Frage wird grundsätzlich richtig wiedergegeben: Die Frevler leben fort, erreichen ein hohes Alter und nehmen darüber hinaus an חַיִל zu. Die Formulierung „immer vermögender“ legt jedoch die Deutung „Vermögen“ zu stark als alleinigen Sinn fest und fügt mit „immer“ eine nicht ausdrücklich markierte fortlaufende Steigerung hinzu. Die Wendung גָּבְרוּ חָיִל lässt sowohl Macht/Stärke als auch Wohlstand bzw. Besitz zu.'
  naturalness: „Warum leben die Bösen weiter, werden alt und gewinnen sogar an Macht?“ ist modernes, flüssiges Standarddeutsch und wahrt den knappen, protestierenden Ton der Frage.
