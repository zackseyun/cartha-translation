  text: זַרְעָ֤/ם נָכ֣וֹן לִ/פְנֵי/הֶ֣ם עִמָּ֑/ם וְ֝/צֶאֱצָאֵי/הֶ֗ם לְ/עֵינֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/008.yaml
  text: Their offspring are established before them[a], with them, and their descendants before their eyes.
translation:
  language: de
  text: Ihre Nachkommen stehen fest vor ihnen, bei ihnen, und ihre Sprösslinge vor ihren Augen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Stehen fest“ kann auch im Sinn von „sind sicher“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעָם
  choice: ihre Nachkommen
  rationale: זֶרַע bezeichnet kollektiv die Nachkommenschaft. „Nachkommen“ ist im Deutschen natürlich und lässt offen, ob unmittelbar Kinder oder die weitere Nachkommenschaft gemeint sind.
- source_word: נָכוֹן
  choice: stehen gefestigt
  rationale: Die Form beschreibt einen festen, beständigen oder gesicherten Zustand. „stehen gefestigt“ bewahrt sowohl den stativen Sinn als auch die mögliche Vorstellung des festen Bestehens.
- source_word: לִפְנֵיהֶם
  choice: vor ihnen
  rationale: Die wörtliche räumliche Wendung bleibt erhalten und kann zugleich die Bedeutung „in ihrer Gegenwart“ tragen.
- source_word: עִמָּם
  choice: bei ihnen
  rationale: עִם bedeutet „mit“. Im Deutschen gibt „bei ihnen“ hier die fortdauernde Gegenwart der Nachkommen idiomatisch wieder und vermeidet die schwerfällige Folge „vor ihnen, mit ihnen“.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: und ihre Sprösslinge
  rationale: צֶאֱצָאִים bezeichnet die aus jemandem Hervorgegangenen. „Sprösslinge“ unterscheidet den Ausdruck vom ersten Sammelbegriff und erhält die familiäre Bildlichkeit.
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die Wendung wird bildhaft und nahezu wörtlich wiedergegeben; sie betont, dass sie ihre Nachkommenschaft selbst sehen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Aufbau und die Wiederholung von „vor“ bilden die hebräische Ausdrucksweise ab; die etwas markierte Folge „vor ihnen, bei ihnen“ bewahrt beide Präpositionalangaben.
