  text: הֵ֣ן יָ֭דַעְתִּי מַחְשְׁבֽוֹתֵי/כֶ֑ם וּ֝/מְזִמּ֗וֹת עָלַ֥/י תַּחְמֹֽסוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/027.yaml
  text: Look[a], I know your thoughts, and the schemes with which you would wrong me.
translation:
  language: de
  text: Ja, ich kenne eure Gedanken und die Pläne, mit denen ihr mir Unrecht antun wollt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Anschläge, die ihr gegen mich plant“ oder „und die gewaltsamen Pläne, die ihr gegen mich schmiedet“. Das hebräische Verb kann bedeuten, Gewalt auszuüben, zu unterdrücken oder Unrecht zu tun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Ja
  rationale: Die Partikel leitet eine nachdrückliche Feststellung ein. „Ja“ bewahrt den bekräftigenden Ton in natürlichem modernem Deutsch, ohne das altertümliche „Siehe“ zu verwenden.
- source_word: יָדַעְתִּי
  choice: ich kenne
  rationale: Das Qal Perfekt 1. Person Singular bezeichnet hier gegenwärtiges Wissen; bei „Gedanken“ ist „kennen“ im Deutschen idiomatischer als „wissen“.
- source_word: מַחְשְׁבוֹתֵיכֶם
  choice: eure Gedanken
  rationale: Der Ausdruck kann Gedanken, Absichten oder Pläne bezeichnen. „Gedanken“ bleibt der Grundbedeutung nahe und lässt die feindselige Absicht durch die folgende Parallele hervortreten.
- source_word: וּמְזִמּוֹת
  choice: und die Pläne
  rationale: Das Substantiv bezeichnet hier überlegte, gegen Hiob gerichtete Vorhaben. „Pläne“ ist verständlich und würdevoll; der negative Sinn ergibt sich aus dem folgenden Satzteil.
- source_word: עָלַי
  choice: mir
  rationale: In Verbindung mit dem folgenden Verb wird die gegen Hiob gerichtete Handlung idiomatisch durch den Dativ „mir“ ausgedrückt.
- source_word: תַּחְמֹסוּ
  choice: Unrecht tun wollt
  rationale: Das Verb חמס kann gewaltsames Handeln, Unterdrücken oder rechtswidriges Schädigen bezeichnen. „Unrecht tun“ erfasst die feindselige Schädigung, ohne sie unnötig auf körperliche Gewalt festzulegen; „wollt“ gibt hier den auf Hiob gerichteten Plan wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit nachdrücklichem, aber nicht altertümlichem Ton. Die feindselige Bedeutung der letzten Wendung wird bewahrt, während die mögliche Bandbreite von Unrecht bis Gewalt in der Fußnote offengelegt wird.
