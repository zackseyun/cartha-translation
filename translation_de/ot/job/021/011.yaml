  text: They send out their little ones like a flock[c][b][a], and their children dance.
translation:
  language: de
  text: Sie lassen ihre Kleinen wie eine Herde hinauslaufen[a][b], und ihre Kinder hüpfen umher[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Schafe“. Das hebräische Wort kann kollektiv Schafe oder allgemein Kleinvieh bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre ganz kleinen Kinder“ beziehungsweise „ihre Säuglinge“. Das hebräische Wort bezeichnet sehr junge Kinder.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „tanzen“ oder „springen“. Das hebräische Verb bezeichnet eine lebhafte, freudige Bewegung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּחוּ
  choice: sie lassen … hinausziehen
  rationale: Der Piel von שלח bedeutet hier „hinausschicken“ bzw. „hinauslassen“. Die gewählte Formulierung klingt im Deutschen bei Kindern natürlich und bewahrt das Bild unbeschwerter Bewegungsfreiheit.
- source_word: כַצֹּאן
  choice: wie eine Herde
  rationale: צֹאן bezeichnet kollektiv Kleinvieh, besonders Schafe und Ziegen. „Wie eine Herde“ gibt den kollektiven Vergleich natürlich wieder, ohne die Tierart enger festzulegen als der hebräische Ausdruck.
- source_word: עֲוִילֵיהֶם
  choice: ihre Kleinen
  rationale: עויל bezeichnet sehr junge Kinder. „Ihre Kleinen“ bewahrt den Bezug auf das geringe Alter, ohne den Ausdruck auf Neugeborene oder Säuglinge zu beschränken.
- source_word: יַלְדֵיהֶם
  choice: ihre Kinder
  rationale: ילד bezeichnet hier allgemein Kinder bzw. Nachkommen. „Ihre Kinder“ ist die natürliche deutsche Wiedergabe und bildet eine passende Parallele zu „ihre Kleinen“.
- source_word: יְרַקֵּדוּן
  choice: hüpfen umher
  rationale: רקד bezeichnet lebhafte Bewegung wie Hüpfen, Springen oder Tanzen. „Hüpfen umher“ erhält das konkrete Bild ausgelassener kindlicher Bewegung, ohne zwingend einen geordneten Tanz anzunehmen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hinausziehen“ verbindet sich idiomatisch mit „wie eine Herde“, während „hüpfen umher“ die lebhafte Bewegung konkret wiedergibt. Die beiden hebräischen Bezeichnungen für junge Menschen werden durch „Kleine“ und „Kinder“ unterschieden.
