source:
  edition: WLC
  text: וְ֭/אֵיךְ תְּנַחֲמ֣וּ/נִי הָ֑בֶל וּ֝/תְשֽׁוּבֹתֵי/כֶ֗ם נִשְׁאַר מָֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/021/034.yaml
  text: How then can you comfort me with emptiness[a], when your answers remain nothing but treachery?
translation:
  language: de
  text: Wie könnt ihr mich da mit Nichtigem trösten, wenn eure Antworten nichts als Treulosigkeit bleiben?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵיךְ
  choice: Wie ... da
  rationale: Das Fragewort leitet eine rhetorische Frage ein; „da“ gibt die anschließende, folgernde Kraft des וְ im Deutschen natürlich wieder.
- source_word: תְּנַחֲמוּנִי
  choice: könnt ihr mich ... trösten
  rationale: Der Piel von נחם mit Suffix der 1. Person Singular bedeutet „mich trösten“. Das Modalverb bringt den rhetorischen Einwand idiomatisch zum Ausdruck.
- source_word: הָבֶל
  choice: mit Nichtigem
  rationale: הבל bezeichnet Leere, Nichtigkeit oder Vergeblichkeit. „Mit Nichtigem“ bewahrt hier den substantivischen Sinn und kennzeichnet den inhaltslosen Trost, statt nur dessen Erfolglosigkeit auszudrücken.
- source_word: וּתְשׁוּבוֹתֵיכֶם
  choice: eure Antworten
  rationale: תשובה bezeichnet eine Antwort oder Erwiderung und bezieht sich hier auf die Reden der Freunde.
- source_word: נִשְׁאַר
  choice: bleiben
  rationale: Der Niphal von שׁאר bedeutet „übrig bleiben, verbleiben“. Der deutsche Plural richtet sich idiomatisch nach „Antworten“.
- source_word: מָעַל
  choice: nichts als Treulosigkeit
  rationale: מעל bezeichnet Treulosigkeit, Vertrauensbruch oder Verrat. „Treulosigkeit“ wahrt die relationale Schärfe des Vorwurfs; „nichts als“ gibt die prädikative Ausschließlichkeit natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe bleibt erhalten; „Nichtigem“ ist verständlich und bewahrt zugleich das konkrete Substantiv הבל. Keine konfessionelle Deutung wurde hinzugefügt.
