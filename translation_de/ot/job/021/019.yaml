  text: אֱל֗וֹהַּ יִצְפֹּן לְ/בָנָ֥י/ו אוֹנ֑/וֹ יְשַׁלֵּ֖ם אֵלָ֣י/ו וְ/יֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/019.yaml
  text: God stores up his iniquity for his sons? Let him repay it to the man himself[c][b][a], so that he may know it.
translation:
  language: de
  text: „Bewahrt Gott das Unrecht des Frevlers für seine Söhne auf?[a] Er soll es ihm selbst vergelten, damit er es erkennt.“[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erste Satzteil kann auch ohne Frageform übersetzt werden: „Gott bewahrt das Unrecht des Frevlers für seine Söhne auf; er soll es ihm vergelten, damit er es erkennt.“ Der Zusammenhang legt jedoch nahe, dass Hiob diese Vorstellung infrage stellt.'
    reason: alternative_reading
  - marker: b
    text: „Söhne“ entspricht dem hebräischen Wortlaut; gemeint sein können im weiteren Sinn auch seine Nachkommen. Das hebräische Wort für „Unrecht“ kann außerdem Schuld, Unheil oder die Folgen des Unrechts bezeichnen. „Erkennt“ gibt wörtlich „weiß/erkennt“ wieder und kann hier erfahrendes Erkennen einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Die in Hiob häufige singularische Gottesbezeichnung wird im Deutschen natürlich mit „Gott“ wiedergegeben.
- source_word: יִצְפֹּן
  choice: bewahrt … auf
  rationale: צפן bezeichnet hier das Aufbewahren oder Zurücklegen für einen späteren Zeitpunkt.
- source_word: לְבָנָיו
  choice: für seine Söhne
  rationale: Der hebräische Text nennt ausdrücklich die männliche Mehrzahl „Söhne“; im Zusammenhang können auch Nachkommen gemeint sein.
- source_word: אוֹנוֹ
  choice: sein Unrecht
  rationale: אָוֶן kann Unrecht, Schuld oder daraus erwachsendes Unheil bezeichnen. „Unrecht“ wahrt die lexikalische Nähe und vermeidet, die Bedeutung vorschnell auf „Strafe“ festzulegen.
- source_word: יְשַׁלֵּם
  choice: Er soll … vergelten
  rationale: Die Piel-Form von שׁלם bedeutet „vergelten/heimzahlen“ und wird im argumentativen Zusammenhang am besten auffordernd beziehungsweise jussivisch verstanden.
- source_word: אֵלָיו
  choice: ihm selbst
  rationale: Das Pronomen verweist auf den Frevler; „selbst“ verdeutlicht knapp den Gegensatz zu seinen Söhnen, ohne einen neuen Referenten einzuführen.
- source_word: וְיֵדָע
  choice: damit er es zu spüren bekommt
  rationale: Wörtlich steht „damit er weiß/erkennt“. Hier ist erfahrendes Erkennen gemeint; die deutsche Wendung gibt diesen Sinn natürlich wieder.
theological_decisions:
- issue: Ist der erste Satzteil Hiobs eigene Aussage oder eine von ihm bestrittene Auffassung?
  choice: Als rhetorische Frage wiedergeben, auf die Hiob mit einer auffordernden Gegenposition antwortet.
  alternative: 'Als durchgehende Feststellung: „Gott bewahrt sein Unrecht für seine Söhne auf; er vergelte es ihm, damit er es erkennt.“'
  rationale: Der Zusammenhang von Hiob 21 spricht dafür, dass Hiob die Vorstellung zurückweist, dem Frevler werde erst durch das Ergehen seiner Kinder vergolten. Die Frageform bewahrt zugleich die grammatische Möglichkeit einer Aussage in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Spannung des Zusammenhangs bleibt erhalten. „Zu spüren bekommt“ verdeutlicht das im hebräischen „erkennen“ liegende Erfahrungswissen, ohne die Vergeltung dogmatisch näher zu bestimmen.
