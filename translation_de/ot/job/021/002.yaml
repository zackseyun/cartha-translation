  text: שִׁמְע֣וּ שָׁ֭מוֹעַ מִלָּתִ֑/י וּ/תְהִי זֹ֝֗את תַּנְח֥וּמֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/002.yaml
  text: Listen carefully to my words[a], and let this be your consolation.
translation:
  language: de
  text: Hört mir aufmerksam zu, und das soll euer Trost sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eure Tröstungen“; der hebräische Ausdruck steht im Plural.'
    reason: Formale Numerusdifferenz und mögliche Nuance des hebräischen Ausdrucks werden transparent gemacht.
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Hört mir aufmerksam zu
  rationale: Der Infinitivus absolutus שָׁמוֹעַ verstärkt den pluralischen Imperativ שִׁמְעוּ. Im natürlichen modernen Deutsch wird dies durch „aufmerksam“ wiedergegeben; „mir zuhören“ schließt den Bezug auf מִלָּתִי idiomatisch ein.
- source_word: מִלָּתִי
  choice: mir … zu
  rationale: Das Substantiv im Singular mit Suffix der 1. Person bezeichnet Jobs Wort bzw. Rede. Deutsch formuliert den Aufruf am natürlichsten als „Hört mir … zu“, ohne den Sinn auf einzelne Wörter einzuengen.
- source_word: וּתְהִי
  choice: und … soll … sein
  rationale: Die Jussivform drückt hier eine Aufforderung beziehungsweise einen Wunsch aus. „Soll … sein“ gibt diesen volitiven Sinn knapp und würdig wieder.
- source_word: זֹאת
  choice: das
  rationale: Das Demonstrativpronomen verweist am ehesten auf das verlangte Zuhören. „Das“ ist im Deutschen der natürliche anaphorische Bezug.
- source_word: תַּנְחֻמוֹתֵיכֶם
  choice: euer Trost
  rationale: 'Der hebräische Ausdruck steht formal im Plural, kann aber kollektiv-abstrakt verstanden werden. Der deutsche Singular „Trost“ ist hier idiomatisch und bewahrt die mögliche ironische Spitze: Ihr Zuhören soll der Trost sein, den die Freunde Job gewähren.'
theological_decisions:
- issue: Mögliche ironische Färbung von „euer Trost“
  choice: Die Formulierung bleibt ohne ausdrückliche Ironiemarkierung stehen.
  alternative: „das soll der Trost sein, den ihr mir gebt“
  rationale: Der Kontext kann Ironie nahelegen, doch der hebräische Vers spricht sie nicht ausdrücklich aus. Die knappe Form bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verstärkung des hebräischen Hör-Aufrufs wird idiomatisch mit „aufmerksam“ ausgedrückt. Der Satz bleibt knapp und erhält die mögliche Spannung beziehungsweise Ironie des Kontexts.
