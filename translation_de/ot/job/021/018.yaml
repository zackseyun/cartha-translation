id: JOB.21.18
reference: Job 21:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִהְי֗וּ כְּ/תֶ֥בֶן לִ/פְנֵי ר֑וּחַ וּ֝/כְ/מֹ֗ץ גְּנָבַ֥תּ/וּ סוּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/018.yaml
  text: May they be like straw before the wind[a], and like chaff that a storm carries away.
translation:
  language: de
  text: Mögen sie wie Stroh vor dem Wind sein und wie Spreu, die ein Sturm fortreißt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wie Spreu, die ein Sturm stiehlt“; auch: „wegreißt“. Das hebräische Verb bedeutet eigentlich „stehlen“ und beschreibt hier poetisch ein plötzliches Fortnehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Mögen sie … sein
  rationale: Der Imperfekt von היה hat hier im rhetorisch-poetischen Zusammenhang einen wunsch- bzw. jussivartigen Klang. „Mögen sie … sein“ bewahrt diese modale Nuance; ein schlichtes „Sie sind“ würde sie einebnen.
- source_word: כְּתֶבֶן
  choice: wie Stroh
  rationale: תבן bezeichnet gewöhnlich trockenes Stroh bzw. ausgedroschene Halme. „Stroh“ gibt das Bild im heutigen Deutsch klarer wieder als „Stoppeln“, die eher auf dem Feld stehen bleiben.
- source_word: לִפְנֵי רוּחַ
  choice: vor dem Wind
  rationale: Die Wendung beschreibt etwas, das der Kraft des Windes ausgesetzt ist und vor ihm hergetrieben wird. „Vor dem Wind“ erhält das hebräische Bild natürlich und knapp.
- source_word: וּכְמֹץ
  choice: und wie Spreu
  rationale: מֹץ ist die leichte Spreu, die beim Worfeln vom Korn getrennt und vom Wind weggetragen wird. „Spreu“ ist dafür die geläufige und präzise deutsche Entsprechung.
- source_word: גְּנָבַתּוּ
  choice: fortreißt
  rationale: Das Verb גנב bedeutet wörtlich „stehlen“, schildert hier aber poetisch das plötzliche Wegnehmen der Spreu durch den Sturm. „Fortreißt“ vermittelt Kraft und unvermitteltes Entfernen natürlich; die wörtlichere Bildgebung wird in der Fußnote bewahrt.
- source_word: סוּפָה
  choice: ein Sturm
  rationale: סוּפָה bezeichnet einen Sturm oder ein Unwetter. „Ein Sturm“ ist verständlich und legt sich nicht unnötig auf den engeren Begriff „Wirbelsturm“ fest.
theological_decisions:
- issue: Modale Aussage über das Schicksal der Frevler
  choice: 'Wunsch- bzw. jussivartige Wiedergabe: „Mögen sie … sein“'
  alternative: 'Indikativisch: „Sie sind/werden …“'
  rationale: Die hebräische Imperfektform lässt im poetisch-rhetorischen Zusammenhang eine modale Lesart zu. Die Übersetzung bewahrt diese Spannung, statt den Satz zu einer bloßen Tatsachenfeststellung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. „Stroh“, „Spreu“ und „Sturm“ bewahren die anschauliche Bildfolge des Hebräischen; die ungewöhnliche wörtliche Bedeutung von גנב wird in der Fußnote offengelegt.
