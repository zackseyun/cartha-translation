  naturalness: „Wo er doch“ ist verständlich, wirkt in dieser knappen rhetorischen Frage jedoch etwas umständlich. „Die Hohen“ ist zwar möglich, im heutigen Standarddeutsch aber ungewohnt und kann missverständlich nach körperlicher Größe klingen. „Die Erhabenen“ ist idiomatischer und bewahrt die Offenheit des hebräischen Ausdrucks.
  terminology: „Gott“, „Erkenntnis“, „lehren“ und „richten“ sind angemessen. Die Substantivierung „die Erhabenen“ gibt רָמִים würdig und ohne dogmatische Einengung wieder.
