  text: הַ/לְ/אֵ֥ל יְלַמֶּד דָּ֑עַת וְ֝/ה֗וּא רָמִ֥ים יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/022.yaml
  text: Can anyone teach God knowledge[a], since he judges those on high?
translation:
  language: de
  text: Kann man Gott Erkenntnis lehren, da er doch die Erhabenen[a] richtet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Hochgestellten«; möglicherweise sind himmlische Wesen gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְאֵל
  choice: Kann man Gott
  rationale: Die Fragepartikel הֲ zusammen mit לְאֵל leitet eine rhetorische Frage ein. Das unbestimmte deutsche „man“ gibt das im Hebräischen nicht ausdrücklich genannte Subjekt natürlich wieder.
- source_word: יְלַמֶּד
  choice: lehren
  rationale: Das Piel von למד bedeutet gewöhnlich „lehren“ oder „unterweisen“. „Lehren“ ist hier direkt und idiomatisch.
- source_word: דָּעַת
  choice: Erkenntnis
  rationale: דעת bezeichnet Wissen beziehungsweise Erkenntnis. „Erkenntnis“ bewahrt das abstrakte Substantiv und passt in die gehobene, aber verständliche Sprache des Verses.
- source_word: וְהוּא
  choice: wo er doch
  rationale: Die Verbindung begründet hier die rhetorische Frage. „Wo er doch“ macht diesen Zusammenhang im Deutschen natürlich sichtbar, ohne den Inhalt auszuweiten.
- source_word: רָמִים
  choice: die Hohen
  rationale: Das substantivierte maskuline Pluraladjektiv bezeichnet Hochstehende oder Erhabene. „Die Hohen“ erhält die Offenheit zwischen irdischen Machthabern und himmlischen Wesen.
- source_word: יִשְׁפּוֹט
  choice: richtet
  rationale: Das Qal von שפט bedeutet „richten“. Die knappe Wiedergabe entspricht Gottes übergeordneter richterlicher Stellung.
theological_decisions:
- issue: Bezug von רָמִים
  choice: die Hohen, bewusst offen für hochgestellte oder überirdische Wesen
  alternative: die Erhabenen; die himmlischen Wesen; die Machthaber
  rationale: Der hebräische Ausdruck legt nicht eindeutig fest, ob irdische Hochgestellte oder himmlische Wesen gemeint sind. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, knappem Stil. Die rhetorische Frage bleibt erhalten; „wo er doch“ verdeutlicht den im Zusammenhang angelegten Begründungscharakter. Der mehrdeutige Bezug von רָמִים wird nicht eingeengt.
