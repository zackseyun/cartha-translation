  source_fidelity: Der Haupttext gibt בָּתֵּיהֶם („ihre Häuser“), שָׁלוֹם מִפָּחַד („in Frieden/sicher, frei von Furcht“) und die Metapher שֵׁבֶט אֱלוֹהַּ („Rute/Stab Gottes“) insgesamt treffend wieder. „Über ihnen“ ist für עֲלֵיהֶם möglich, wirkt im Deutschen jedoch weniger idiomatisch als „auf ihnen“ und schwächt die Vorstellung einer auf ihnen liegenden göttlichen Heimsuchung nicht nötig ab.
  naturalness: „Ihre Häuser sind sicher vor Schrecken“ ist verständlich, aber „Schrecken“ bezeichnet eher das Erschreckende bzw. ein Schreckensereignis als den inneren Zustand פַּחַד. „frei von Angst“ ist modernes, natürliches Deutsch und trifft die Konstruktion präziser. „Die Rute Gottes liegt nicht auf ihnen“ ist idiomatisch und bewahrt das Bild.
  terminology: „Rute Gottes“ bewahrt שֵׁבֶט angemessen und ohne eine bestimmte Deutung wie Strafe, Züchtigung oder Plage festzulegen. Die Fußnote sollte die metaphorische Spannweite nennen, ohne das eher unübliche Substantiv „Gottes Schlagen“ zu verwenden. „Heimsuchung“ ist als erläuternde Möglichkeit passend, solange sie nicht den Haupttext ersetzt.
