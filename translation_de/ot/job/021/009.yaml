  text: Their houses are safe from fear[b][a], and the rod of God is not upon them.
translation:
  language: de
  text: Ihre Häuser sind frei von Angst,[a] und die Rute Gottes liegt nicht auf ihnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihre Hausgemeinschaften sind sicher, frei von Angst.“'
    reason: lexical_alternative
  - marker: b
    text: Die „Rute Gottes“ ist ein Bild für göttliche Heimsuchung, Züchtigung oder Bedrängnis.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּתֵּיהֶם
  choice: ihre Häuser
  rationale: Der Plural von בַּיִת bezeichnet wörtlich ihre Häuser, kann im Zusammenhang aber auch ihre Haushalte beziehungsweise Hausgemeinschaften einschließen. Die konkrete Bildsprache bleibt im Haupttext erhalten.
- source_word: שָׁלוֹם
  choice: sicher
  rationale: שָׁלוֹם beschreibt hier einen Zustand des Wohlergehens und der Unversehrtheit angesichts möglicher Gefahr. „Sicher“ gibt diesen Sinn in Verbindung mit מִפָּחַד idiomatisch wieder.
- source_word: מִפָּחַד
  choice: vor Schrecken
  rationale: מִן bezeichnet hier das Freisein von etwas; פַּחַד kann Angst, Schrecken oder Grauen bedeuten. „Vor Schrecken“ ist im Deutschen zusammen mit „sicher“ natürlich und bewahrt die Intensität des Ausdrucks.
- source_word: שֵׁבֶט
  choice: Rute
  rationale: שֵׁבֶט kann Rute, Stab oder Zepter bedeuten. Hier bezeichnet es bildhaft ein Werkzeug des Schlagens oder Züchtigens. „Rute“ bewahrt die Metapher, ohne sie auf Strafe, Zucht oder Leiden festzulegen.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: אֱלוֹהַּ ist im Buch Hiob eine poetische Singularbezeichnung für Gott; „Gott“ ist die direkte deutsche Entsprechung.
- source_word: עֲלֵיהֶם
  choice: über ihnen
  rationale: עַל bedeutet hier räumlich-bildhaft „auf/über ihnen“. „Über ihnen“ bewahrt das offene Bild, ohne ausdrücklich zu sagen, ob die Rute sie schlägt, bedrückt oder züchtigt.
- source_word: וְלֹא
  choice: und … nicht
  rationale: Die Verbindung aus Konjunktion und Verneinung koordiniert den zweiten Satzteil mit dem ersten. Die Wiedergabe mit „und … nicht“ ist klar und entspricht der hebräischen Struktur.
theological_decisions:
- issue: Art des göttlichen Handelns in der Wendung „Rute Gottes“
  choice: Die Metapher „Rute Gottes“ bleibt erhalten.
  alternative: Gottes Strafe; Gottes Züchtigung; Gottes Plage
  rationale: Das hebräische Bild kann göttliches Schlagen, Züchtigen oder Bedrängen bezeichnen, legt sich aber nicht auf eine einzige Kategorie fest. Eine erklärende Auflösung würde die theologische Spannung des Verses unnötig verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Bildsprache. „Rute Gottes“ und „über ihnen“ sind bewusst bildhaft formuliert; die Fußnoten erläutern mögliche Bedeutungsweiten, ohne den Haupttext interpretierend zu verengen.
