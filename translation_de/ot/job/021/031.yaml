  text: מִֽי יַגִּ֣יד עַל פָּנָ֣י/ו דַּרְכּ֑/וֹ וְ/הֽוּא עָ֝שָׂ֗ה מִ֣י יְשַׁלֶּם לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/031.yaml
  text: Who declares his way to his face? And for what he has done[b][a], who repays him?
translation:
  language: de
  text: Wer sagt ihm seinen Weg ins Gesicht?[a] Und wer vergilt ihm, was er getan hat?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf/gegen sein Angesicht“. Die Wendung bezeichnet eine unmittelbare Konfrontation in seiner Gegenwart.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Text ist knapp: „Und er hat getan – wer vergilt ihm?“ Die Übersetzung macht den elliptischen Sinn deutlich: Vergeltung für das, was er getan hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Fragepronomen leitet jeweils eine rhetorische Frage ein. Die unausgesprochene verneinende Antwort wird nicht in den Haupttext eingetragen.
- source_word: יַגִּיד
  choice: hält … vor
  rationale: Der Hifil von נגד bedeutet „mitteilen, kundtun“. Zusammen mit עַל־פָּנָיו bezeichnet er hier eine offene, direkte Konfrontation; „jemandem etwas ins Gesicht vorhalten“ gibt dies im Deutschen natürlich wieder.
- source_word: עַל־פָּנָיו
  choice: ihm … ins Gesicht
  rationale: Wörtlich „auf/gegen sein Angesicht“; gemeint ist eine Äußerung unmittelbar in seiner Gegenwart und gegen ihn gerichtet.
- source_word: דַּרְכּוֹ
  choice: seinen Weg
  rationale: „Weg“ bewahrt die hebräische Metapher für Lebensführung oder Verhalten, ohne sie vorschnell auf „Vergehen“ zu verengen.
- source_word: וְהוּא עָשָׂה
  choice: was er getan hat
  rationale: 'Die hebräische Wendung ist knapp und elliptisch: „und er hat getan“. Im Zusammenhang benennt sie wahrscheinlich das Getane als Gegenstand beziehungsweise Grund der Vergeltung.'
- source_word: יְשַׁלֶּם לוֹ
  choice: vergilt ihm
  rationale: Der Piel von שלם bezeichnet hier das Zurückzahlen oder Vergelten. „Vergelten“ bewahrt den retributiven Sinn und passt zum gehobenen, aber heutigen Register.
theological_decisions:
- issue: Identität des angesprochenen beziehungsweise beschriebenen Mannes
  choice: Das männliche Pronomen bleibt ohne erklärenden Zusatz stehen.
  alternative: Den Betreffenden ausdrücklich als „Gottlosen“ oder „Mächtigen“ bezeichnen.
  rationale: Der Vers selbst nennt das Bezugswort nicht; eine ausdrückliche Identifikation würde die kontextuelle Deutung in den Text eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden rhetorischen Fragen und die Metapher „Weg“ bleiben erhalten. Die erste Zeile wird idiomatisch als direkte Konfrontation formuliert; die Ellipse der zweiten Zeile wird für die Verständlichkeit behutsam ergänzt.
