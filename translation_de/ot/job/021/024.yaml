  source_fidelity: Der Entwurf gibt die Satzstruktur und die Bildfolge des Hebräischen zutreffend wieder. עֲטִינָיו ist jedoch ein seltenes und umstrittenes Wort; die Wiedergabe „Milchgefäße“ klingt im Deutschen nicht wie ein konkreter Gegenstand oder ein Körperteil und trägt die poetische Aussage daher nur eingeschränkt. „Krüge“ gibt die im englischen Audit gewählte Gefäßdeutung idiomatisch wieder, während die Fußnote die gewichtige Alternative „Euter“ erhält. Das Pual יְשֻׁקֶּה bezeichnet reichliches Befeuchtet- bzw. Getränktsein; „reichlich getränkt“ ist dafür unmittelbar und ohne zusätzliche Deutung angemessen.
