lexical_decisions:
- source_word: עֲטִינָיו
  choice: seine Milchgefäße
  rationale: Das seltene und umstrittene Substantiv bezeichnet hier Gefäße oder Organe, die mit Milchfülle verbunden sind. „Milchgefäße“ wahrt die lexikalische Unbestimmtheit besser als das konkrete „Euter“ und klingt im Deutschen natürlicher als „Eimer“ in einer Beschreibung menschlichen Wohlergehens.
- source_word: מָלְאוּ
  choice: sind voll
  rationale: Das Perfekt beschreibt hier einen anhaltenden Zustand von Fülle und Wohlstand; das deutsche Präsens gibt diesen stativen Sinn natürlich wieder.
- source_word: חָלָב
  choice: Milch
  rationale: Die übliche Bedeutung des Wortes bewahrt zugleich das konkrete Bild von Nahrung, Reichtum und Gedeihen.
- source_word: וּמֹחַ
  choice: und das Mark
  rationale: „Mark“ ist die direkte Bedeutung; der bestimmte Artikel ergibt zusammen mit dem folgenden Genitiv eine natürliche deutsche Fügung.
- source_word: עַצְמוֹתָיו
  choice: seiner Knochen
  rationale: Der Genitiv bildet die hebräische Status-constructus-Verbindung direkt und erhält das körperliche Bild.
- source_word: יְשֻׁקֶּה
  choice: ist gut durchtränkt
  rationale: Die Pual-Form bezeichnet das reichliche Versorgt- oder Befeuchtetsein. „Gut durchtränkt“ vermittelt Vitalität und körperliches Gedeihen, ohne das Bild vorschnell zu erklären.
