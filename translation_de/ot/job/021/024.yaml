  terminology: „Mark seiner Knochen“ entspricht dem hebräischen Konstruktverband. Die Fußnote muss die lexikalische Unsicherheit von עֲטִינָיו ausdrücklich bewahren und darf die Gefäßdeutung nicht als gesichert ausgeben.
