source:
  edition: WLC
  text: כִּ֤י לְ/י֣וֹם אֵ֭יד יֵחָ֣שֶׂךְ רָ֑ע לְ/י֖וֹם עֲבָר֣וֹת יוּבָֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/030.yaml
  text: For the evil man is spared for the day of disaster[b][a]; they are led away for the day of wrath.
translation:
  language: de
  text: Denn der Böse wird für den Tag des Unheils verschont[a]; für den Tag des Zorns werden sie weggeführt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird bis zum Tag des Unheils zurückgehalten« beziehungsweise »aufgespart«. Das hebräische Verb kann »verschont«, »zurückgehalten« oder »aufgespart« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »werden sie für den Tag des Zorns herbeigeführt«. Das letzte Verb kann ein Hinführen oder Herbeibringen zu diesem Tag bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang eine Begründung beziehungsweise Erläuterung der vorherigen Aussage ein.
- source_word: לְיוֹם אֵיד
  choice: für den Tag des Unheils
  rationale: לְ bezeichnet hier am ehesten einen künftigen Zeitpunkt; אֵיד meint Unheil, Unglück oder Verderben.
- source_word: יֵחָשֶׂךְ
  choice: wird verschont
  rationale: Der Nifal von חשׂך kann »verschont«, »zurückgehalten« oder »aufgespart« bedeuten. »Wird verschont« gibt die naheliegende Aussage wieder, ohne die lexikalische Mehrdeutigkeit in der Fußnote zu verdecken.
- source_word: רָע
  choice: der Böse
  rationale: Das substantivisch gebrauchte maskuline Singularadjektiv bezeichnet einen bösen beziehungsweise gottlosen Menschen und behält im Deutschen die Singularform bei.
- source_word: לְיוֹם עֲבָרוֹת
  choice: für den Tag des Zorns
  rationale: Der Plural עֲבָרוֹת hat wahrscheinlich verstärkende Wirkung. »Tag des Zorns« ist idiomatisch und wahrt den Gerichtsklang.
- source_word: יוּבָלוּ
  choice: werden sie weggeführt
  rationale: Der Hofal von יבל bezeichnet ein Geführt-, Gebracht- oder Fortgeführtwerden. Der deutsche Plural bewahrt den auffälligen Wechsel vom Singular zum Plural.
theological_decisions:
- issue: Verhältnis des Bösen zum künftigen Gericht
  choice: Der Böse bleibt zunächst vom Unheil verschont und wird einem künftigen Tag des Zorns entgegengeführt.
  alternative: Der Böse wird vom Tag des Unheils ferngehalten und entgeht ihm ganz; oder er wird an diesem Tag hervorgebracht.
  rationale: Die beiden parallelen Wendungen mit לְיוֹם legen einen zukünftigen Bezug nahe, doch die Verben erlauben mehrere Nuancen. Der Haupttext bietet die kontextuell naheliegende Deutung, während die Fußnoten die echte sprachliche Offenheit erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Unheil« und »Zorn« entsprechen dem poetisch-gerichtlichen Register. Der Wechsel vom Singular »der Böse« zum Plural »sie« bleibt wie im Hebräischen erhalten; die Fußnoten markieren die Mehrdeutigkeit der beiden Passivverben.
