translation:
  language: de
  text: Sein Stier deckt erfolgreich[a]; seine Kuh kalbt und verwirft nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sein Stier deckt und stößt nicht ab“ beziehungsweise „… und macht nicht unfruchtbar“. Das hebräische Verb ist hier schwierig; der Haupttext gibt den durch den Parallelismus nahegelegten Sinn wieder: Das Decken bleibt nicht ohne Erfolg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרוֹ
  choice: sein Stier
  rationale: שׁוֹר bezeichnet ein Rind; im Fortpflanzungszusammenhang ist ausdrücklich das männliche Zuchttier gemeint, daher ist „Stier“ präziser als „Rind“ oder „Ochse“.
- source_word: עִבַּר
  choice: deckt erfolgreich
  rationale: Die Form von עבר bezeichnet hier im Zusammenhang mit der Fortpflanzung das erfolgreiche Decken beziehungsweise Befruchten. Die Ergänzung „erfolgreich“ gibt zusammen mit dem folgenden schwierigen Verb den vom Parallelismus geforderten Sinn natürlich wieder.
- source_word: וְלֹא יַגְעִל
  choice: erfolgreich
  rationale: Das Hifil von געל ist an dieser Stelle lexikalisch schwierig. Im Parallelismus geht es darum, dass das Decken nicht erfolglos bleibt. Statt eine unsichere technische Bedeutung festzuschreiben, wird das Ergebnis idiomatisch mit „deckt erfolgreich“ ausgedrückt; mögliche wörtlichere Deutungen stehen in der Fußnote.
- source_word: תְּפַלֵּט
  choice: kalbt
  rationale: Das Piel von פלט bezeichnet hier das Hervorbringen des Nachwuchses. Bei einer Kuh ist „kalbt“ die präzise und natürliche deutsche Wiedergabe.
- source_word: פָּרָתוֹ
  choice: seine Kuh
  rationale: פָּרָה bedeutet „Kuh“. Eine Einschränkung auf eine junge Kuh ist vom hebräischen Wort nicht gefordert.
- source_word: וְלֹא תְשַׁכֵּל
  choice: und hat keine Fehlgeburt
  rationale: שׁכל bezeichnet im Piel den Verlust beziehungsweise die Beraubung von Nachwuchs. Im Kontext des Kalbens gibt „hat keine Fehlgeburt“ den Sinn klar und idiomatisch wieder.
