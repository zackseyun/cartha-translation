  text: וְ/זֶ֗ה יָ֭מוּת בְּ/נֶ֣פֶשׁ מָרָ֑ה וְ/לֹֽא אָ֝כַ֗ל בַּ/טּוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/025.yaml
  text: while another dies with a bitter soul and has not enjoyed good[a].
translation:
  language: de
  text: Der andere aber stirbt mit bitterer Seele und hat nichts Gutes genossen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und hat nicht vom Guten gegessen“; das Hebräische beschreibt das Erfahren des Guten mit dem Bild des Essens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה
  choice: Der andere aber
  rationale: Wörtlich steht „und dieser“. Im Zusammenhang wird dieser Mensch dem zuvor beschriebenen gegenübergestellt; „der andere aber“ gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: יָמוּת
  choice: stirbt
  rationale: Die Imperfektform beschreibt hier einen allgemeinen, beispielhaften Fall. Das deutsche Präsens entspricht diesem spruchhaften Gebrauch.
- source_word: בְּ/נֶפֶשׁ מָרָה
  choice: mit verbitterter Seele
  rationale: נֶפֶשׁ wird als „Seele“ bewahrt, während מָרָה den bitteren inneren Zustand bezeichnet. „Mit verbitterter Seele“ ist verständlicher als das im Deutschen missverständliche „mit bitterer Seele“.
- source_word: וְ/לֹא אָכַל
  choice: und hat ... nicht genossen
  rationale: אָכַל bedeutet wörtlich „essen“, bezeichnet hier mit „dem Guten“ jedoch bildhaft das Erfahren oder Genießen des Guten. Die idiomatische Wiedergabe steht im Text; die Fußnote bewahrt das Bild.
- source_word: בַּ/טּוֹבָה
  choice: nichts Gutes
  rationale: Das substantivierte „Gute“ bleibt bewusst weit und umfasst Wohlergehen, Glück und Gutes im Leben, ohne es auf materiellen Wohlstand einzuengen.
