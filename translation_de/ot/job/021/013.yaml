source:
  edition: WLC
  text: יבלו בַ/טּ֣וֹב יְמֵי/הֶ֑ם וּ֝/בְ/רֶ֗גַע שְׁא֣וֹל יֵחָֽתּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/013.yaml
  text: They spend their days in prosperity[a], and in a moment they go down to Sheol.
translation:
  language: de
  text: Sie verbringen ihre Tage im Wohlergehen, und in einem Augenblick steigen sie in die Scheol[a] hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Totenreich«, »das Grab« oder »den Tod«. Das hebräische Wort lautet Scheol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַלּוּ
  choice: sie verbringen
  rationale: Das Piel von בלה bezeichnet hier das Verbringen bzw. Aufbrauchen der Lebenszeit. „Sie verbringen ihre Tage“ gibt die zeitliche Aussage im Deutschen natürlich wieder.
- source_word: בַטּוֹב
  choice: im Wohlergehen
  rationale: טוֹב bezeichnet in diesem Zusammenhang einen Zustand des Guten, des Wohlstands und ungestörten Wohlergehens. „Im Wohlergehen“ bewahrt die Breite des Ausdrucks, ohne ihn allein auf materiellen Reichtum zu verengen.
- source_word: יְמֵיהֶם
  choice: ihre Tage
  rationale: Die wörtliche zeitliche Wendung bleibt erhalten und bezeichnet ihre Lebenszeit.
- source_word: וּבְרֶגַע
  choice: und in einem Augenblick
  rationale: רֶגַע bezeichnet einen sehr kurzen Zeitraum. Die nominale Form hebt den Gegensatz zwischen einem ganzen Leben im Wohlergehen und dem plötzlichen Ende hervor.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration bewahrt den eigenständigen althebräischen Begriff und legt ihn nicht vorschnell auf Grab, Tod oder Hölle fest.
- source_word: יֵחָתּוּ
  choice: fahren sie … hinab
  rationale: In Verbindung mit Scheol beschreibt das Verb das Hinabgehen in den Bereich der Toten. „Hinabfahren“ ist im Deutschen idiomatisch und erhält zugleich die räumliche Bildsprache.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Totenreich; Grab; Tod
  rationale: „Scheol“ wahrt die begriffliche und theologische Offenheit des hebräischen Ausdrucks. Insbesondere wird keine spätere Vorstellung von „Hölle“ in den Vers eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Im Wohlergehen“ ist natürlich und inhaltlich breiter als „im Wohlstand“. „Hinabfahren“ bewahrt die traditionelle räumliche Bildsprache, ohne den Scheol näher dogmatisch zu bestimmen.
