- from: Sie verbringen ihre Tage im Wohlergehen, und in einem Augenblick fahren sie in den Scheol[a] hinab.
  to: Sie verbringen ihre Tage im Wohlergehen, und in einem Augenblick steigen sie in die Scheol[a] hinab.
