review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe folgt dem Hebräischen eng und angemessen: יבלו ist idiomatisch als „verbringen“ gefasst, בַּטּוֹב als umfassendes „Wohlergehen“, und der Kontrast zwischen der Dauer ihrer Tage und dem plötzlichen Hinabgehen bleibt erhalten. „Scheol“ bewahrt die Offenheit von שְׁאוֹל. Für יֵחָתּוּ ist „hinabsteigen“ im Kontext der Scheol eine sachgerechte, nicht überinterpretierende Wiedergabe.'
  naturalness: '„In den Scheol“ verwendet ein im Deutschen für „Scheol“ nicht übliches grammatisches Geschlecht. Die etablierte deutsche Form ist feminin: „die Scheol“, daher „in die Scheol“. Zudem ist „hinabsteigen“ im modernen Standarddeutsch natürlicher als „hinabfahren“, ohne die räumliche Bildlichkeit abzuschwächen.'
  terminology: „Scheol“ ist als Transliteration theologisch und begrifflich angemessen. Die Fußnote bietet die wesentlichen kontextuellen Wiedergabemöglichkeiten, ohne den Ausdruck auf eine bestimmte Jenseitsvorstellung festzulegen.
  issues:
  - severity: medium
    issue: Grammatisches Geschlecht von „Scheol“
    rationale: Im Deutschen wird „Scheol“ üblicherweise feminin gebraucht. „in den Scheol“ wirkt daher sprachlich fehlerhaft bzw. unnatürlich; erforderlich ist „in die Scheol“.
  - severity: low
    issue: „hinabfahren“ ist weniger natürlich
    rationale: Die Formulierung ist zwar verständlich und traditionssprachlich möglich, „hinabsteigen“ ist im modernen Standarddeutsch idiomatischer und gibt die Abwärtsbewegung ebenso klar wieder.
  revised_text: Sie verbringen ihre Tage im Wohlergehen, und in einem Augenblick steigen sie in die Scheol[a] hinab.
