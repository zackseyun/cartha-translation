  text: הֵ֤ן לֹ֣א בְ/יָדָ֣/ם טוּבָ֑/ם עֲצַ֥ת רְ֝שָׁעִ֗ים רָ֣חֲקָה מֶֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/016.yaml
  text: Look, is not their prosperity in their own hand? The counsel of the wicked is far from me.
translation:
  language: de
  text: 'Seht doch: Ihr Wohlergehen liegt nicht in ihrer eigenen Hand.[a] Vom Rat der Frevler halte ich mich fern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erste Satz kann auch als Frage verstanden werden: »Liegt ihr Wohlergehen nicht in ihrer eigenen Hand?«'
    reason: Das Hebräische markiert die Satzart nicht eindeutig; sowohl eine verneinte Aussage als auch eine rhetorische Frage ist grammatisch möglich und in der Auslegung belegt.
lexical_decisions:
- source_word: הֵן
  choice: Seht doch
  rationale: Die einleitende Aufmerksamkeitsformel wird natürlich und würdig wiedergegeben; »doch« nimmt zugleich den argumentativen Ton auf.
- source_word: טוּבָם
  choice: ihr Wohlergehen
  rationale: טוּב bezeichnet hier das gute Ergehen beziehungsweise den Wohlstand der Frevler; »Wohlergehen« bewahrt die Bedeutungsbreite.
- source_word: בְיָדָם
  choice: in ihrer eigenen Hand
  rationale: Die hebräische Wendung bezeichnet Verfügungsgewalt oder Kontrolle; das Bild bleibt im Deutschen verständlich.
- source_word: עֲצַת רְשָׁעִים
  choice: der Rat der Frevler
  rationale: עֵצָה kann Rat, Plan oder Denkweise meinen. »Rat« erhält die knappe, bewusst mehrdeutige Formulierung.
- source_word: רָחֲקָה מֶנִּי
  choice: halte ich mich fern
  rationale: Die wörtliche Aussage »ist fern von mir« bezeichnet Hiobs Distanzierung; die idiomatische aktive Fassung macht diese Haltung im Deutschen klar, ohne sie inhaltlich auszubauen.
theological_decisions:
- issue: Deutung der Negation in לֹא בְיָדָם טוּבָם
  choice: 'Aussage: »Ihr Wohlergehen liegt nicht in ihrer eigenen Hand.«'
  alternative: 'Rhetorische Frage: »Liegt ihr Wohlergehen nicht in ihrer eigenen Hand?«'
  rationale: Im unmittelbaren Zusammenhang räumt Hiob ein, dass das Wohlergehen der Frevler letztlich nicht ihrer eigenen Macht entspringt, und distanziert sich dennoch von ihrem Rat. Der hebräische Konsonantentext erlaubt formal auch eine Frage; diese echte syntaktische Möglichkeit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Ton. »Frevler« bewahrt die moralisch-religiöse Schärfe von רְשָׁעִים. Die Fußnote erhält die genuine syntaktische und theologische Spannung des Verses.
