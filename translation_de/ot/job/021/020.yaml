source:
  edition: WLC
  text: יִרְא֣וּ עינ/ו כִּיד֑/וֹ וּ/מֵ/חֲמַ֖ת שַׁדַּ֣י יִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/020.yaml
  text: Let his own eyes see his ruin[b][a], and let him drink from the wrath of the Almighty.
translation:
  language: de
  text: Seine eigenen Augen mögen sein Unheil sehen[a], und vom Zorn des Allmächtigen möge er trinken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Verderben“ oder „seinen Untergang“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräischen Verbformen können auch als Vorhersage verstanden werden: „Seine Augen werden sein Unheil sehen, und er wird vom Zorn des Allmächtigen trinken.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאוּ
  choice: sollen … sehen
  rationale: Der Qal-Imperfekt 3. Person Plural stimmt mit dem pluralischen Subjekt „seine Augen“ überein. Im Zusammenhang lässt er sich als Wunsch verstehen; die deutsche Konstruktion mit „sollen“ gibt diesen jussivischen Sinn natürlich wieder.
- source_word: עינ/ו
  choice: seine eigenen Augen
  rationale: Gemeint sind „seine Augen“ mit Suffix der 3. Person Singular. „eigenen“ hebt idiomatisch hervor, dass der Frevler die Folgen persönlich erleben soll.
- source_word: כִּידוֹ
  choice: sein Verderben
  rationale: כִּיד bezeichnet Unheil, Verderben oder Untergang. „Verderben“ ist würdevoll und lässt offen, ob eine Katastrophe oder der endgültige Untergang gemeint ist.
- source_word: וּמֵחֲמַת
  choice: und vom Zorn
  rationale: חֵמָה kann Zorn, Grimm oder bisweilen Gift bedeuten. In Verbindung mit dem Allmächtigen und dem Bild des Trinkens bezeichnet es hier am ehesten den göttlichen Zorn; die Präposition מִן wird mit „von“ bewahrt.
- source_word: שַׁדַּי
  choice: des Allmächtigen
  rationale: „der Allmächtige“ ist die etablierte deutsche Wiedergabe des in Hiob häufigen Gottestitels שַׁדַּי.
- source_word: יִשְׁתֶּה
  choice: soll er trinken
  rationale: Der Qal-Imperfekt 3. Person Singular steht parallel zu יִרְאוּ und wird als Wunsch wiedergegeben. Das konkrete Bild des Trinkens bleibt erhalten.
theological_decisions:
- issue: Aussageweise der Imperfektformen
  choice: 'Als Wunsch: „sollen … sehen“ und „soll er trinken“'
  alternative: 'Als Vorhersage: „Seine Augen werden sein Verderben sehen, und er wird vom Zorn des Allmächtigen trinken.“'
  rationale: Der Zusammenhang legt nahe, dass Hiob verlangt, der Frevler solle das Gericht selbst erfahren. Da die hebräischen Imperfektformen jedoch auch zukünftig verstanden werden können, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt die persönliche Erfahrung des Frevlers hervor; die Trinkmetapher und der traditionelle Gottestitel bleiben erhalten.
