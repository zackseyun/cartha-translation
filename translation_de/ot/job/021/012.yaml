base_translation:
  language: en
  yaml_path: translation/ot/job/021/012.yaml
  text: They sing to the tambourine and lyre, and rejoice at the sound of the flute.
translation:
  language: de
  text: Sie singen[a] zu Tamburin und Leier und freuen sich am Klang der Flöte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Sie erheben …«; was erhoben wird, bleibt im Hebräischen unausgesprochen. Gemeint ist wahrscheinlich die Stimme oder ein Lied.'
    reason: Bewahrt die grammatische Offenheit des objektlosen Verbs und macht die interpretierende Wiedergabe »singen« transparent.
  - marker: b
    text: Das hebräische Wort bezeichnet wohl ein Rohr- oder Pfeifeninstrument; die genaue Bauart ist unbekannt.
    reason: Kennzeichnet die sachliche Unsicherheit bei der Bestimmung des antiken Musikinstruments.
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: sie singen
  rationale: Das Verb bedeutet grundsätzlich »heben, erheben«; hier ist kein Objekt genannt. Im musikalischen Zusammenhang ist wahrscheinlich das Erheben der Stimme beziehungsweise das Anstimmen eines Liedes gemeint. »Sie singen« gibt diesen Sinn natürlich wieder, ohne ein im Hebräischen ausdrücklich genanntes Substantiv einzuführen.
- source_word: כְּתֹף וְכִנּוֹר
  choice: zu Tamburin und Leier
  rationale: תֹף bezeichnet eine Hand- beziehungsweise Rahmentrommel, כִּנּוֹר ein Saiteninstrument. »Tamburin und Leier« sind geläufige, annähernde deutsche Bezeichnungen; die Präposition כְּ beschreibt hier die musikalische Begleitung.
- source_word: עוּגָב
  choice: Flöte
  rationale: Das Wort bezeichnet ein Blasinstrument, wahrscheinlich ein Rohr- oder Pfeifeninstrument. »Flöte« ist verständlich und passt zum musikalischen Zusammenhang, doch die genaue Instrumentenart bleibt unsicher.
- source_word: וְיִשְׂמְחוּ לְקוֹל
  choice: und freuen sich am Klang
  rationale: Die Wendung beschreibt Freude angesichts beziehungsweise beim Hören des Instrumentenklangs. »Sich am Klang freuen« ist idiomatisches modernes Deutsch und bewahrt den positiven Sinn.
