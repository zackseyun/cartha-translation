source:
  edition: WLC
  text: וְ/אִם זָכַ֥רְתִּי וְ/נִבְהָ֑לְתִּי וְ/אָחַ֥ז בְּ֝שָׂרִ֗/י פַּלָּצֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/006.yaml
  text: When I remember, I am dismayed, and trembling seizes my flesh.
translation:
  language: de
  text: Wenn ich daran denke, bin ich entsetzt, und Schauder erfasst meinen Leib.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Wenn
  rationale: Das hebräische אִם kann konditional »wenn/falls« bedeuten; im Zusammenhang beschreibt es den regelmäßig eintretenden Zustand beim Erinnern. »Wenn« bewahrt die Form und klingt im Deutschen natürlich.
- source_word: זָכַרְתִּי
  choice: ich daran denke
  rationale: Das Verb זכר bezeichnet hier das Erinnern bzw. gedankliche Vergegenwärtigen des zuvor behandelten Gegenstands. Das ergänzte »daran« ist im Deutschen idiomatisch, ohne einen neuen Bezug festzulegen.
- source_word: וְנִבְהָלְתִּי
  choice: bin ich entsetzt
  rationale: נבהל bezeichnet heftiges Erschrecken oder Bestürztsein. »Entsetzt« gibt die starke emotionale Reaktion knapp und würdig wieder.
- source_word: פַּלָּצוּת
  choice: Schauder
  rationale: Das seltene Substantiv bezeichnet Zittern, Schauder oder schreckensbedingtes Beben. »Schauder« verbindet körperliche und emotionale Erschütterung.
- source_word: בְּשָׂרִי
  choice: meinen Leib
  rationale: בשר bedeutet wörtlich »Fleisch«, kann aber den leiblichen Menschen bezeichnen. »Leib« ist im modernen Deutschen natürlich und bewahrt den körperlichen Sinn.
- source_word: אָחַז
  choice: erfasst
  rationale: אחז bedeutet »ergreifen, festhalten«. »Erfasst« erhält das Bild einer überwältigenden körperlichen Reaktion.
theological_decisions:
- issue: Bezug des Erinnerns
  choice: Der Bezug bleibt mit »daran« kontextabhängig und unausgeführt.
  alternative: Explizite Ergänzung wie »wenn ich mich an all das erinnere«
  rationale: Der hebräische Vers nennt kein ausdrückliches Objekt; eine nähere Bestimmung würde die Auslegung unnötig festlegen.
- issue: Konditionaler oder temporaler Sinn von אִם
  choice: »Wenn«
  alternative: »Sobald« oder »Denke ich daran«
  rationale: »Wenn« bewahrt die genuine konditionale Form und kann im Deutschen zugleich eine wiederkehrende zeitliche Beziehung ausdrücken, ohne sie stärker festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelität der beiden Satzhälften bleibt erhalten; »Schauder erfasst meinen Leib« vermittelt die starke leibliche Reaktion ohne altertümliche Ausdrucksweise.
