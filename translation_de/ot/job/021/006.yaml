  source_fidelity: 'Die Übersetzung bildet die hebräische Satzfolge und Aussage treffend ab: וְאִם wird angemessen temporal-konditional mit „Wenn“ wiedergegeben; זָכַרְתִּי bleibt mit „ich daran denke“ kontextoffen. „bin ich entsetzt“ gibt נִבְהָלְתִּי als heftige Bestürzung wieder. „Schauder erfasst meinen Leib“ entspricht dem Bild von פַּלָּצוּת als Subjekt zu אָחַז und bewahrt den leiblichen Bezug von בְּשָׂרִי. Die englische POB-Fassung („When I remember … trembling seizes my flesh“) wird inhaltlich zuverlässig getroffen.'
