  source_fidelity: 'Die Übersetzung gibt die zentralen Bilder zutreffend wieder: Erdschollen, ihre bildliche Annehmlichkeit für den Toten sowie die Menschenmenge hinter und vor ihm. Die Formulierung „vor ihm waren es unzählbar viele“ legt jedoch durch das Präteritum stärker als der hebräische Nominalsatz eine rein zeitliche Vorzeitigkeit fest und verwendet ein bezugsschwaches „es“.'
  naturalness: „Die Erdschollen des Tals sind ihm süß“ ist bewusst bildhaft, aber im würdevollen modernen Bibeldeutsch verständlich. „Die ganze Menschheit zieht hinter ihm her“ ist natürlich und bewahrt die mögliche Prozess- wie Todesmetaphorik. „Vor ihm sind Unzählige“ ist knapper, idiomatisch und weniger interpretierend als die bisherige Schlussformulierung.
  terminology: „Erdschollen“, „Tal“, „süß“ und „Menschheit“ sind angemessene Wiedergaben. Die Fußnote sollte beim Geländeausdruck genauer von einem Wadi beziehungsweise Trockenflussbett sprechen, ohne נחל auf nur eine Geländeform festzulegen.
