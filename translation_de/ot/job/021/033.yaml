  text: The clods of the valley are sweet to him[a]; all mankind follows after him[c][b], and those before him are without number.
translation:
  language: de
  text: Die Erdschollen des Tals sind ihm süß[a]; die ganze Menschheit zieht hinter ihm her[b], und vor ihm sind Unzählige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Erdschollen des Wadis (Trockenflussbetts) sind ihm angenehm.« Das hebräische Wort kann ein Tal, eine Schlucht oder ein Wadi bezeichnen; »süß« ist hier bildlich im Sinn von angenehm.'
    reason: lexical_alternative
