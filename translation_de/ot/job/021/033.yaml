lexical_decisions:
- source_word: מָתְקוּ לּוֹ
  choice: sind ihm süß
  rationale: Die Wendung bewahrt das konkrete hebräische Bild von Süße beziehungsweise Annehmlichkeit, ohne es erklärend auf Ruhe im Grab zu verengen.
- source_word: רִגְבֵי נָחַל
  choice: die Erdschollen des Tales
  rationale: רֶגֶב bezeichnet Erdschollen; נחל kann Tal, Schlucht oder Wadi meinen. »Tal« ist im Deutschen natürlich und lässt die genauere Geländeform offen.
- source_word: כָּל אָדָם
  choice: die ganze Menschheit
  rationale: אָדָם wird hier kollektiv und allgemein gebraucht, nicht ausschließlich für männliche Einzelpersonen.
- source_word: וְאַחֲרָיו ... יִמְשׁוֹךְ
  choice: zieht hinter ihm her
  rationale: Die Wiedergabe hält sich an das Bild des Ziehens beziehungsweise Nachfolgens und kann sowohl einen Leichenzug als auch den allgemeinen Weg in den Tod bezeichnen.
- source_word: וּלְפָנָיו אֵין מִסְפָּר
  choice: vor ihm waren es unzählbar viele
  rationale: »Vor ihm« wahrt die räumliche und zeitliche Offenheit; »unzählbar viele« gibt die hebräische Redewendung idiomatisch wieder und ergänzt nur das im Deutschen notwendige Bezugselement.
theological_decisions:
- issue: Bezug des Bildes auf Bestattung, Trauerzug oder den allgemeinen Weg in den Tod
  choice: Die konkrete Sprache von Erdschollen sowie Menschen hinter und vor ihm bleibt erhalten.
  alternative: Man könnte ausdrücklich von Trauernden in einem Leichenzug oder ausschließlich von allen Menschen auf dem Weg ins Grab sprechen.
  rationale: Der hebräische Text erlaubt sowohl die Vorstellung eines Leichenzugs als auch die umfassendere Aussage, dass zahllose Menschen ihm im Tod vorausgingen und die ganze Menschheit nachfolgt. Die Übersetzung entscheidet diese Spannung nicht einseitig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ungewöhnliche Bild »sind ihm süß« wird bewusst bewahrt; »zieht hinter ihm her« klingt natürlich und erhält zugleich die bildhafte Mehrdeutigkeit.
