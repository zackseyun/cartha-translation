  source_fidelity: Die Übersetzung gibt den generischen Einzelfall von זֶה, das gnomenhafte Imperfekt und die Zustandsbeschreibung zuverlässig wieder. »Auf der Höhe seiner Kraft« vermittelt idiomatisch den Sinn von בְּעֶצֶם תֻּמּוֹ als ungeschmälerte Lebenskraft, ohne die Wendung fälschlich moralisch als »Integrität« zu deuten. »Vollkommen sorglos und ungestört« bildet die verstärkende, parallele Beschreibung כֻּלּוֹ שַׁלְאֲנַן וְשָׁלֵיו angemessen ab.
  naturalness: Modernes, flüssiges und würdiges Standarddeutsch. »Der eine« ist im kontrastierenden Zusammenhang von Hiob 21 natürlich; die knappe Formulierung bewahrt den poetisch-beobachtenden Charakter.
