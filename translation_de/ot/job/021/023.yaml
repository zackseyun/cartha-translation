  text: זֶ֗ה יָ֭מוּת בְּ/עֶ֣צֶם תֻּמּ֑/וֹ כֻּ֝לּ֗/וֹ שַׁלְאֲנַ֥ן וְ/שָׁלֵֽיו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/023.yaml
  text: One dies in the fullness of his vigor[a], wholly at ease and secure.
translation:
  language: de
  text: Der eine stirbt auf der Höhe seiner Kraft[a], vollkommen sorglos und ungestört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der eine stirbt bei ungebrochener Gesundheit, durch und durch sorglos und ruhig.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Der eine
  rationale: Das Demonstrativpronomen führt einen beispielhaften Fall im folgenden Gegensatz ein. »Der eine« ist im Deutschen natürlich und bewahrt den repräsentativen Einzelfall.
- source_word: יָמוּת
  choice: stirbt
  rationale: Das Imperfekt beschreibt hier eine allgemeine Beobachtung; dafür ist im Deutschen das Präsens angemessen.
- source_word: בְּעֶצֶם תֻּמּוֹ
  choice: auf der Höhe seiner Kraft
  rationale: עֶצֶם bezeichnet wörtlich »Knochen«, erweitert aber Substanz oder Stärke; תֻּם meint Ganzheit oder unversehrten Zustand. Zusammen bezeichnet die Wendung hier volle, noch ungebrochene Lebenskraft.
- source_word: כֻּלּוֹ
  choice: vollkommen
  rationale: Das Wort verstärkt die folgende Zustandsbeschreibung. »Vollkommen« gibt die adverbiale Bedeutung natürlich wieder.
- source_word: שַׁלְאֲנַן
  choice: sorglos
  rationale: Das Adjektiv bezeichnet ungestörte Ruhe und ein Leben ohne bedrängende Sorge; »sorglos« passt zum geschilderten Wohlergehen.
- source_word: וְשָׁלֵיו
  choice: und ungestört
  rationale: Das parallele Adjektiv verstärkt die Vorstellung ruhigen Wohlergehens. »Ungestört« hält die Nähe zu »ruhig/sicher«, ohne materielle Sicherheit zu stark festzulegen.
theological_decisions: []
