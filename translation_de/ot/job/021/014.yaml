id: JOB.21.14
reference: Job 21:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ לָ֭/אֵל ס֣וּר מִמֶּ֑/נּוּ וְ/דַ֥עַת דְּ֝רָכֶ֗י/ךָ לֹ֣א חָפָֽצְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/014.yaml
  text: Yet they say to God[a], ‘Depart from us, and we do not desire the knowledge of your ways.’
translation:
  language: de
  text: 'Doch sie sagen zu Gott[a]: »Weiche von uns! Deine Wege wollen wir nicht kennen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wende dich von uns ab!« / »Geh weg von uns!«'
    reason: Lexikalische Alternativen für סוּר מִמֶּנּוּ.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Doch sie sagen
  rationale: Die Rede beschreibt im Zusammenhang die charakteristische Haltung der Gottlosen. »Doch« gibt den kontextuellen Gegensatz zu ihrem Wohlergehen wieder, während das Präsens im Deutschen natürlich klingt.
- source_word: לָאֵל
  choice: zu Gott
  rationale: אֵל bezeichnet hier Gott allgemein und ist nicht als Eigenname »El« wiederzugeben.
- source_word: סוּר מִמֶּנּוּ
  choice: Weiche von uns!
  rationale: Der Imperativ סוּר fordert Gott unverhüllt auf, sich von ihnen zu entfernen. »Weiche von uns« bewahrt Direktheit und Würde; die mögliche Nuance »Geh weg von uns« wird in der Fußnote genannt.
- source_word: וְדַעַת דְּרָכֶיךָ
  choice: Deine Wege … kennen
  rationale: Die deutsche Infinitivkonstruktion gibt idiomatisch den hebräischen Ausdruck »Erkenntnis deiner Wege« wieder, ohne seinen Sinn zu erweitern. Das וְ verbindet die beiden Aussagen; im Deutschen kann die parataktische Folge ohne ausdrückliches »und« natürlich wiedergegeben werden.
- source_word: לֹא חָפָצְנוּ
  choice: wollen wir nicht
  rationale: חפץ bezeichnet Begehren, Gefallen oder Wollen. In Verbindung mit dem Erkennen von Gottes Wegen bringt »wollen wir nicht« die bewusste Ablehnung klar und natürlich zum Ausdruck.
theological_decisions:
- issue: Die Rede der Gottlosen an Gott
  choice: Die direkte Aufforderung »Weiche von uns!« bleibt erhalten.
  alternative: Indirekte oder abschwächende Wiedergabe wie »Lass uns in Ruhe«
  rationale: Der hebräische Text richtet einen schroffen Imperativ unmittelbar an Gott. Die direkte Rede bewahrt die theologische Härte menschlicher Auflehnung.
- issue: Verhältnis der beiden Satzteile
  choice: Parataktische Folge ohne kausale Ergänzung
  alternative: »denn deine Wege wollen wir nicht kennen« oder ausdrücklich »und …«
  rationale: Das hebräische וְ verbindet die Aussagen, bezeichnet aber nicht eindeutig ein kausales Verhältnis. Die deutsche Satzfolge wahrt diese Offenheit und vermeidet eine zusätzliche Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe direkte Rede bewahrt die poetische Schärfe. »Weiche« ist gehoben, aber allgemein verständlich; die alltagssprachlichere Alternative steht in der Fußnote.
