  text: כִּ֤י מַה חֶפְצ֣/וֹ בְּ/בֵית֣/וֹ אַחֲרָ֑י/ו וּ/מִסְפַּ֖ר חֳדָשָׁ֣י/ו חֻצָּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/021.yaml
  text: For what does he care about his house after him[c][b][a], when the number of his months is cut off?
translation:
  language: de
  text: Denn was liegt ihm an seinem Haus nach ihm[a][b], wenn die Zahl seiner Monate abgeschnitten ist?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach ihm«; gemeint sein kann: nachdem er nicht mehr da ist oder gestorben ist.'
    reason: clarity
  - marker: b
    text: »Haus« kann hier auch die Hausgemeinschaft, die Familie oder die Nachkommenschaft meinen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »und die Zahl seiner Monate festgesetzt (oder: zugeteilt) ist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Aussage; »Denn« gibt den argumentativen Zusammenhang natürlich wieder.
- source_word: מַה חֶפְצוֹ
  choice: was liegt ihm an
  rationale: חֵפֶץ kann Gefallen, Wunsch, Interesse oder Anliegen bezeichnen. Die rhetorische Wendung meint hier, dass ihm nichts mehr daran liegt; »was liegt ihm an« bewahrt Frageform und Aussagekraft.
- source_word: בְּבֵיתוֹ
  choice: an seinem Haus
  rationale: בַּיִת bezeichnet zunächst das Haus, kann im Zusammenhang aber auch Hausgemeinschaft, Familie oder Nachkommenschaft einschließen. Der Haupttext bewahrt die konkrete Grundbedeutung.
- source_word: אַחֲרָיו
  choice: für die Zeit nach ihm
  rationale: Wörtlich steht »nach ihm«. Die deutsche Fassung macht den zeitlichen Bezug verständlich, ohne ausdrücklich »nach seinem Tod« einzusetzen und damit die Formulierung stärker festzulegen.
- source_word: וּמִסְפַּר חֳדָשָׁיו
  choice: wenn die Zahl seiner Monate
  rationale: Das verbindende ו wird dem Sinnzusammenhang entsprechend temporal mit »wenn« wiedergegeben. »Monate« bleibt als konkrete Bezeichnung der Lebensspanne erhalten.
- source_word: חֻצָּצוּ
  choice: abgeschnitten ist
  rationale: Die passive Verbform wird hier im Sinn des Abbrechens oder Beendens der Lebensspanne verstanden. Die Einzahl richtet sich im Deutschen nach dem Subjekt »die Zahl«.
theological_decisions:
- issue: Bedeutung von חֻצָּצוּ für die begrenzte Lebensspanne
  choice: abgeschnitten ist
  alternative: festgesetzt / zugeteilt ist
  rationale: Der Kontext spricht vom Ende des Gottlosen und stützt die Bedeutung »abgeschnitten«. Da die Form auch als Festsetzen oder Zuteilen der Lebenszeit verstanden wird, bleibt diese echte lexikalische und theologisch relevante Spannung in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und das konkrete Bild von der »Zahl seiner Monate« bleiben erhalten. Die leicht ungewöhnliche Wendung »für die Zeit nach ihm« wahrt die Mehrdeutigkeit des Hebräischen, während die Fußnoten idiomatische und lexikalische Alternativen erläutern.
