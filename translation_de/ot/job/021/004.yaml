  text: הֶ֭/אָנֹכִי לְ/אָדָ֣ם שִׂיחִ֑/י וְ/אִם מַ֝דּ֗וּעַ לֹא תִקְצַ֥ר רוּחִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/004.yaml
  text: As for me, is my complaint against man? If not, why should my spirit not be impatient?
translation:
  language: de
  text: Richtet sich meine Klage[a] etwa gegen einen Menschen? Und wenn es so wäre,[b] warum sollte mein Geist nicht ungeduldig sein?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: meine Rede; das hebräische Wort kann auch Nachsinnen oder Klage bedeuten.'
    reason: Das Bedeutungsspektrum von שִׂיחִי ist weiter als das deutsche „Klage“.
  - marker: b
    text: 'Der hebräische Wortlaut ist knapp und elliptisch: „und wenn“. Gemeint sein kann: „und wenn es so wäre“, also wenn die Klage einem Menschen gälte.'
    reason: Die Ergänzung macht den wahrscheinlichen rückverweisenden Bezug verständlich, ohne eine im Hebräischen nicht ausgedrückte Negation einzutragen.
lexical_decisions:
- source_word: שִׂיחִי
  choice: meine Klage
  rationale: שִׂיח kann Rede, Nachsinnen oder Klage bezeichnen. Im Zusammenhang von Ijobs leidenschaftlicher Erwiderung trifft „Klage“ den Sinn am besten, ohne den Ausdruck auf eine förmliche Anklage zu verengen.
- source_word: תִקְצַר רוּחִי
  choice: mein Geist … ungeduldig werden
  rationale: Die Wendung bedeutet wörtlich, dass der Geist „kurz wird“, und bezeichnet Ungeduld beziehungsweise das Ende der Geduld. „Mein Geist“ bewahrt das hebräische רוּחִי und die innere Dimension der Aussage.
- source_word: לְאָדָם
  choice: einem Menschen
  rationale: Die Präposition לְ gibt hier das Gegenüber beziehungsweise Ziel der Klage an. Der unbestimmte Singular אָדָם wird allgemein als „einem Menschen“ wiedergegeben.
theological_decisions:
- issue: Bezug und Ziel von Ijobs Klage
  choice: Die Frage bleibt rhetorisch und verneint, dass ein Mensch der eigentliche Adressat beziehungsweise Gegenstand seiner Klage ist.
  alternative: „Klage über einen Menschen“ oder eine ausdrückliche Ergänzung wie „meine Klage richtet sich an Gott“.
  rationale: Der hebräische Text nennt Gott nicht ausdrücklich. Die Übersetzung wahrt diese Spannung und ergänzt keinen theologischen Adressaten.
- issue: Elliptische Verbindung וְאִם
  choice: „Wenn nicht“
  alternative: „Und wenn doch“ oder schlicht „und warum“.
  rationale: Der knappe hebräische Anschluss lautet wörtlich ungefähr „und wenn, warum …“ und ist elliptisch. Im Zusammenhang nimmt „Wenn nicht“ die erwartete negative Antwort auf die erste Frage auf, wie auch die konsultierte englische Fassung, ohne den folgenden Gedankengang umzudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache. „Gilt … einem Menschen?“ gibt die Zielrichtung der Präposition knapp und natürlich wieder; „mein Geist“ bewahrt die Bild- und Begriffswelt des Hebräischen.
