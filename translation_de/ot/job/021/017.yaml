base_translation:
  language: en
  yaml_path: translation/ot/job/021/017.yaml
  text: How often is the lamp of the wicked put out[c][b][a], and does their disaster come upon them? Does he apportion sorrows in his anger?
translation:
  language: de
  text: Wie oft erlischt die Leuchte der Gottlosen[a][b], und wie oft kommt ihr Unheil über sie? Teilt er ihnen in seinem Zorn Leiden zu?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wie viele Male erlischt die Leuchte der Gottlosen …?“ Die hebräische Frage ist rhetorisch und stellt infrage, dass die Gottlosen regelmäßig so gerichtet werden.'
    reason: lexical_alternative
  - marker: b
    text: Die „Leuchte“ ist ein Bild für das Leben, das Wohlergehen oder das fortdauernde Glück eines Menschen.
    reason: cultural_note
  - marker: c
    text: Für „Leiden“ sind auch „Schmerzen“, „Qualen“ oder „Wehen“ möglich; das hebräische Wort hat mehrere verwandte Bedeutungen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Wie oft
  rationale: Das Fragewort betrifft hier die Häufigkeit. Im Zusammenhang ist die Frage rhetorisch und stellt infrage, dass die Gottlosen regelmäßig auf diese Weise gerichtet werden.
- source_word: נֵר
  choice: Leuchte
  rationale: Das konkrete Bild eines brennenden Lichts bleibt erhalten; „Leuchte“ ist im Deutschen würdig und umfasst hier metaphorisch Leben, Wohlergehen oder fortdauerndes Glück.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Die substantivierte Bezeichnung ist in der Weisheitsliteratur gebräuchlich und bezeichnet Menschen, die sich schuldig und gegen Gott gerichtet verhalten.
- source_word: יִדְעָךְ
  choice: erlischt
  rationale: Das Verb דעך bezeichnet das Erlöschen eines Lichts. „Erlischt“ gibt das Bild knapp und natürlich wieder, ohne im Deutschen einen ausdrücklich handelnden Verursacher hinzuzufügen.
- source_word: וְיָבֹא עָלֵימוֹ אֵידָם
  choice: und wie oft kommt ihr Unheil über sie?
  rationale: אֵיד bezeichnet Unheil, Verderben oder Katastrophe. Die Wiederholung von „wie oft“ macht im Deutschen deutlich, dass die einleitende Häufigkeitsfrage auch diesen parallelen Satzteil umfasst.
- source_word: חֲבָלִים
  choice: Leiden
  rationale: Das mehrdeutige Substantiv kann Schmerzen, Qualen oder Wehen bezeichnen. „Leiden“ passt zum Gerichtskontext, ohne die mögliche Bildwelt unnötig festzulegen; Alternativen werden in der Fußnote genannt.
- source_word: יְחַלֵּק
  choice: teilt ... zu
  rationale: Der Piel-Stamm von חלק bedeutet verteilen oder zuteilen. Die deutsche Wendung bewahrt den Gedanken einer zugemessenen Zuweisung.
- source_word: בְּאַפּוֹ
  choice: in seinem Zorn
  rationale: אַף bezeichnet in dieser Wendung Zorn. Das Suffix wird entsprechend dem hebräischen Wortlaut mit „seinem“ wiedergegeben.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts von יְחַלֵּק
  choice: Das Subjekt bleibt als „er“ unausdrücklich benannt.
  alternative: „Gott teilt ihnen in seinem Zorn Leiden zu.“
  rationale: Der Zusammenhang legt Gott als Handelnden nahe, doch der hebräische Satz nennt ihn nicht ausdrücklich. Die Übersetzung bewahrt diese formale Zurückhaltung.
- issue: Rhetorische Wirkung der Frage
  choice: „Wie oft“ wird in den parallelen Teilsätzen wiederholt.
  alternative: Nur einmaliges „Wie oft“ am Versanfang.
  rationale: Die Wiederholung macht die Reichweite der rhetorischen Häufigkeitsfrage im heutigen Deutsch klar, ohne sie als ausdrückliche Aussage wie „wie selten“ aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Das Bild der Leuchte und die rhetorische Spannung bleiben erhalten. Die mehrfach ausgesprochene Wendung „wie oft“ verdeutlicht die syntaktische Reichweite der Frage, ohne ihre implizite Antwort in den Haupttext einzutragen.
