  text: וּ/מַלְּט֥וּ/נִי מִ/יַּד צָ֑ר וּ/מִ/יַּ֖ד עָרִיצִ֣ים תִּפְדּֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/023.yaml
  text: or[b][a], ‘Deliver me from the hand of the adversary,’ and ‘Redeem me from the hand of the ruthless’?”
translation:
  language: de
  text: 'oder: »Rettet mich aus der Hand des Bedrängers und kauft mich aus der Hand der Gewalttätigen frei«?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְּטוּנִי
  choice: Rettet mich
  rationale: Der Hifil-Imperativ von מלט mit Suffix der 1. Person Singular fordert dazu auf, den Sprecher entkommen zu lassen. »Rettet mich« ist im Deutschen natürlich und wahrt den konkreten Sinn der Befreiung aus Gefahr.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die hebräische Wendung bezeichnet die Macht oder Gewalt einer Person. Die konkrete Formulierung »aus der Hand« ist auch im Deutschen verständlich und wird daher beibehalten.
- source_word: צָר
  choice: des Bedrängers
  rationale: צָר bezeichnet hier einen feindlich gesinnten Widersacher. »Bedränger« gibt die Bedrohung wieder, ohne den Ausdruck unnötig auf einen militärischen Feind festzulegen.
- source_word: עָרִיצִים
  choice: der Gewalttätigen
  rationale: Der Plural bezeichnet rücksichtslose, gewalttätige oder tyrannische Menschen. »Gewalttätige« bewahrt den moralischen und gewaltsamen Gehalt, ohne eine besondere politische Herrschaftsform vorauszusetzen.
- source_word: תִּפְדּוּנִי
  choice: kauft mich frei
  rationale: פדה bezeichnet Freikauf oder Befreiung und unterscheidet sich damit von מלט im ersten Halbvers. »Kauft mich frei« erhält diese lexikalische Eigenart und passt zum konkreten Zusammenhang.
theological_decisions:
- issue: Wiedergabe von פדה in einem nichtkultischen, nicht ausdrücklich heilsgeschichtlichen Zusammenhang
  choice: kauft mich frei
  alternative: erlöst mich
  rationale: »Erlöst mich« könnte im heutigen Deutsch vorrangig geistlich-theologische Assoziationen wecken. »Kauft mich frei« bewahrt den möglichen Lösegeld- beziehungsweise Freikaufsinn, ohne eine über den Zusammenhang hinausgehende Heilslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Fortsetzung aus Vers 22 wird durch »oder« aufgenommen. Der parallele Satzbau sowie der Wechsel zwischen מלט und פדה bleiben erkennbar.
