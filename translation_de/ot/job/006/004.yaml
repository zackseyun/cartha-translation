  text: כִּ֤י חִצֵּ֪י שַׁדַּ֡י עִמָּדִ֗/י אֲשֶׁ֣ר חֲ֭מָתָ/ם שֹׁתָ֣ה רוּחִ֑/י בִּעוּתֵ֖י אֱל֣וֹהַּ יַֽעַרְכֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/004.yaml
  text: For the arrows of the Almighty are in me[a]; my spirit drinks their poison[c][b]; the terrors of God array themselves against me.
translation:
  language: de
  text: Denn die Pfeile des Allmächtigen stecken in mir[a]; mein Geist trinkt ihr Gift[b]. Die Schrecken Gottes stellen sich gegen mich auf[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »sind bei mir« oder »sind mit mir«. Im Zusammenhang mit den Pfeilen und ihrem Gift liegt nahe, dass sie Hiob getroffen haben und in ihm stecken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihr Zorn«.'
    reason: lexical_alternative
  - marker: c
    text: 'Das hebräische Verb kann das geordnete Aufstellen zum Kampf bezeichnen: »stellen sich in Schlachtordnung gegen mich auf«.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Hiobs Begründung für seine heftige Klage ein und bewahrt die erklärende beziehungsweise kausale Funktion, ohne sie unnötig zu verengen.
- source_word: חִצֵּי שַׁדַּי
  choice: die Pfeile des Allmächtigen
  rationale: Bewahrt das kriegerische Bild und gibt den in Hiob gebräuchlichen Gottestitel שַׁדַּי mit seiner üblichen deutschen Entsprechung wieder.
- source_word: עִמָּדִי
  choice: stecken in mir
  rationale: Die Präposition bedeutet wörtlicher „bei/mit mir“. Im Zusammenhang mit Pfeilen und ihrem Gift ist jedoch gemeint, dass die Pfeile Hiob getroffen haben und in ihm stecken; die Fußnote hält die formale Alternative offen.
- source_word: חֲמָתָם
  choice: ihr Gift
  rationale: Im unmittelbaren Bildzusammenhang bezeichnet das Wort am ehesten das Gift der Pfeile. Die mögliche Bedeutung „Zorn“ wird in der Fußnote bewahrt.
- source_word: שֹׁתָה רוּחִי
  choice: mein Geist trinkt
  rationale: Die anschauliche Metapher des Trinkens bleibt erhalten; רוּחַ bezeichnet hier am ehesten Hiobs inneres Leben.
- source_word: בִּעוּתֵי אֱלוֹהַּ
  choice: die Schrecken Gottes
  rationale: Gibt die angsteinflößenden Bedrohungen wieder und wahrt mit „Gott“ die vom ersten Halbvers unterschiedene Gottesbezeichnung.
- source_word: יַעַרְכוּנִי
  choice: stellen sich gegen mich auf
  rationale: Natürliches modernes Deutsch, das die feindliche Ausrichtung ausdrückt; die militärische Grundvorstellung des geordneten Aufstellens wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnungen שַׁדַּי und אֱלוֹהַּ
  choice: שַׁדַּי als „der Allmächtige“ und אֱלוֹהַּ als „Gott“ wiedergeben
  alternative: שַׁדַּי als „Schaddai“ transliterieren oder beide Bezeichnungen gleich übersetzen
  rationale: Der hebräische Vers verwendet zwei verschiedene Gottesbezeichnungen. Die gewählte Wiedergabe erhält diese Unterscheidung, ohne die Titel zu vereinheitlichen oder eine besondere konfessionelle Deutung einzutragen.
- issue: Deutung von חֲמָתָם
  choice: konkret als „ihr Gift“ verstehen
  alternative: abstrakt als „ihr Zorn“ beziehungsweise auf Gottes Zorn bezogen verstehen
  rationale: Pfeile und Trinken bilden zusammen ein konkretes Bild vergifteter Geschosse. Da das hebräische Wort zugleich „Zorn“ bedeuten kann, wird diese echte Mehrdeutigkeit in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Bildsprache. Der Satzbau bleibt knapp und parallel; Semikolon und Punkt gliedern die eng verbundenen, aber eigenständigen Bilder. Die sachlich ungewöhnliche Formulierung „mein Geist trinkt“ wurde bewusst beibehalten, um die hebräische Metapher nicht abzuschwächen.
