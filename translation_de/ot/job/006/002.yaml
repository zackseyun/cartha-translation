  - marker: b
    text: 'Wörtlicher: »und sie würden mein Unglück zusammen in Waagschalen heben«. Das hebräische Verb hat ein nicht näher bestimmtes Pluralsubjekt.'
    reason: translation_clarity
lexical_decisions:
- source_word: לוּ
  choice: Ach, würde … doch
  rationale: Die Wunschpartikel leitet einen emotionalen, unerfüllten Wunsch ein. Die deutsche Konstruktion mit »Ach« und »doch« bewahrt den klagenden Ton.
- source_word: שָׁקוֹל יִשָּׁקֵל
  choice: gründlich gewogen
  rationale: Der Infinitivus absolutus zusammen mit dem finiten Verb verstärkt den Vorgang des Wiegens. »Gründlich« gibt diesen Nachdruck natürlich wieder.
- source_word: כַּעְשִׂי
  choice: mein Kummer
  rationale: Das Wort kann innere Qual, Verdruss, Erregung oder Zorn bezeichnen. »Kummer« passt zu Hiobs Klage, ohne die Bedeutung ausschließlich auf Zorn festzulegen; die weitere Spannweite wird in einer Fußnote bewahrt.
- source_word: וְהַוָּתִי
  choice: mein Unglück
  rationale: Der Ausdruck bezeichnet Unheil, Verderben oder eine Katastrophe. »Unglück« ist in diesem Zusammenhang klar, würdig und umfasst Hiobs objektive Notlage.
- source_word: בְּמֹאזְנַיִם
  choice: auf die Waage
  rationale: Der hebräische Dual bezeichnet eine Balkenwaage beziehungsweise deren Waagschalen. »Auf die Waage« ist die natürliche moderne deutsche Wendung.
- source_word: יִשְׂאוּ יָחַד
  choice: zugleich … gelegt
  rationale: Wörtlich ist vom gemeinsamen Hochheben oder Tragen die Rede. Im Zusammenhang des Wiegens bezeichnet die Form idiomatisch das Auflegen auf die Waage; »zugleich« bewahrt den Gedanken des gemeinsamen Wiegens.
