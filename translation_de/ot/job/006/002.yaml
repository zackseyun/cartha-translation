  text: Oh[a], that my vexation were fully weighed[b], and my calamity lifted together in the balances.
translation:
  language: de
  text: Ach, würde mein Kummer[a] doch genau gewogen und mein Unglück zugleich auf die Waage gelegt![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mein Gram«, »mein Verdruss«, »meine Erbitterung« oder »mein Zorn«. Das hebräische Wort kann Kummer, Verärgerung oder Zorn bezeichnen.'
