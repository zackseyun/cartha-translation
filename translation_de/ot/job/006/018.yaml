  text: The paths of their course wind away[a]; they go up into wasteland and perish.
translation:
  language: de
  text: Die Pfade ihres Laufs winden sich fort[a]; sie steigen ins Ödland hinauf und verlieren sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Karawanen biegen ab; sie ziehen hinauf in die Öde und verschwinden.“ Das hebräische Bild ist schwer verständlich. Manche beziehen den Vers nicht auf die Pfade oder Wasserläufe selbst, sondern auf Karawanen.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִלָּפְתוּ
  choice: winden sich fort
  rationale: Das Nifal Imperfekt von לפת kann ein Sichwinden oder Abbiegen bezeichnen. Die intransitive Wiedergabe bewahrt das Bild eines vom erwarteten Verlauf abweichenden Wasserlaufs, ohne die schwierige Bildsprache festzulegen.
- source_word: אָרְחוֹת
  choice: Pfade
  rationale: אָרְחוֹת bezeichnet gewöhnlich Pfade oder Spuren. Die mögliche metonymische Deutung als Karawanen wird wegen des Zusammenhangs in einer Fußnote genannt.
- source_word: דַּרְכָּם
  choice: ihres Laufs
  rationale: דֶּרֶךְ bedeutet Weg oder Verlauf. „Lauf“ vermeidet eine schwerfällige Wiederholung von „Pfad“ und passt zum vorausgehenden Bild versiegender Wasserläufe.
- source_word: יַעֲלוּ
  choice: sie steigen … hinauf
  rationale: Die konkrete Grundbedeutung des Qal von עלה, „hinaufsteigen“, bleibt erhalten; eine stärker deutende Wiedergabe wie „verschwinden“ wird hier vermieden.
- source_word: בַתֹּהוּ
  choice: ins Ödland
  rationale: תֹהוּ bezeichnet Leere, Öde oder verwüstetes Land. „Ödland“ ist im Wüstenbild natürlich und gibt die gerichtete Bewegung der Präposition wieder.
- source_word: וְיֹאבֵדוּ
  choice: und verlieren sich
  rationale: אבד kann „zugrunde gehen“, „verloren gehen“ oder „verschwinden“ bedeuten. Bei Pfaden beziehungsweise Wasserläufen gibt „sich verlieren“ das Verschwinden idiomatisch und bildhaft wieder.
