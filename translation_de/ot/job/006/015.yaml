source:
  edition: WLC
  text: אַ֭חַ/י בָּגְד֣וּ כְמוֹ נָ֑חַל כַּ/אֲפִ֖יק נְחָלִ֣ים יַעֲבֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/015.yaml
  text: My brothers have dealt treacherously like a wadi[a], like the channels of wadis that pass away,
translation:
  language: de
  text: Meine Brüder haben treulos gehandelt wie ein Wadi[a], wie die Rinnen der Wadis, die dahinschwinden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie ein Bach … wie die Rinnen der Bäche«. Das hebräische נחל kann einen Bach, ein Trockental oder einen nur zeitweise Wasser führenden Lauf bezeichnen. »Wadi« bewahrt hier das Bild einer trockenen Landschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: meine Brüder
  rationale: 'Die Grundbedeutung ist familiär: »meine Brüder«. Im Zusammenhang kann der Ausdruck auch enge Gefährten einschließen, doch diese mögliche Erweiterung wird nicht anstelle des hebräischen Bildes in den Haupttext eingetragen.'
- source_word: בָּגְדוּ
  choice: haben treulos gehandelt
  rationale: Das Verb bezeichnet treuloses oder hinterhältiges Handeln. Die Formulierung bewahrt die moralische und relationale Schärfe, ohne einen bestimmten Verratsakt vorauszusetzen.
- source_word: כְמוֹ
  choice: wie
  rationale: Die übliche deutsche Vergleichspartikel gibt das hebräische כְמוֹ natürlich und genau wieder.
- source_word: נָחַל
  choice: ein Wadi
  rationale: Im folgenden Bild geht es um einen zeitweise Wasser führenden Lauf in trockenem Land. »Wadi« bewahrt diesen landschaftlichen Hintergrund genauer als »Bach«.
- source_word: כַאֲפִיק
  choice: wie die Rinnen der
  rationale: אפיק bezeichnet eine Rinne, ein Bett oder einen Lauf, durch den Wasser fließt. »Rinnen« ist im Deutschen anschaulich und passt zum hydrologischen Bild.
- source_word: נְחָלִים
  choice: Wadis
  rationale: Der Plural wird entsprechend dem ersten Vorkommen wiedergegeben, damit das Bild der saisonalen Wasserläufe einheitlich bleibt.
- source_word: יַעֲבֹרוּ
  choice: dahinschwinden
  rationale: Das Verb bedeutet grundsätzlich »vorübergehen« oder »weiterziehen«. Im Zusammenhang der unbeständigen Wasserläufe bezeichnet es ihr Verschwinden; »dahinschwinden« erhält sowohl die Bewegung als auch die Vergänglichkeit des Bildes.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Fremdwort »Wadi« wird wegen seiner landschaftlichen Genauigkeit beibehalten und in der Fußnote erklärt; der Satzbau folgt eng der zweigliedrigen Bildsprache des Hebräischen.
