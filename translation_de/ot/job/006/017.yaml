  text: בְּ֭/עֵת יְזֹרְב֣וּ נִצְמָ֑תוּ בְּ֝/חֻמּ֗/וֹ נִדְעֲכ֥וּ מִ/מְּקוֹמָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/017.yaml
  text: When they are warmed[a], they vanish; when it is hot[c][b], they dry up from their place.
translation:
  language: de
  text: Wenn sie warm werden, verschwinden sie; wenn es heiß wird, versiegen sie an ihrem Ort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus/von ihrem Ort“. Im Zusammenhang kann damit besonders ihr Bachbett oder ihre Rinne gemeint sein. Die beiden hebräischen Verben können auch ein Ausgelöscht- oder Erlöschen-Sein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵת
  choice: Wenn
  rationale: Die Präposition mit dem Zeitnomen leitet einen temporalen Nebensatz ein. „Wenn“ ist im modernen Deutsch natürlich und bewahrt das Verhältnis der Satzteile.
- source_word: יְזֹרְבוּ
  choice: sie von der Wärme erfasst werden
  rationale: Das seltene Verb bezeichnet ein Warm- oder Heißwerden. Die Formulierung gibt den passivischen Zug wieder und passt zu den Wasserläufen im Kontext, ohne die genaue Ursache näher festzulegen.
- source_word: נִצְמָתוּ
  choice: verschwinden sie
  rationale: Das Nifal kann ein Aufhören, Vernichtetwerden oder Verschwinden ausdrücken. Bei saisonalen Wasserläufen gibt „verschwinden“ das Bild anschaulich und kontextgerecht wieder.
- source_word: בְּחֻמּוֹ
  choice: wenn es heiß wird
  rationale: Wörtlich steht „in seiner Hitze“. Die unpersönliche Wiedergabe ist im Deutschen natürlich und bildet zugleich den zeitlichen Parallelismus zum ersten Satzteil ab.
- source_word: נִדְעֲכוּ
  choice: versiegen sie
  rationale: Das Verb kann „erlöschen“ oder „ausgelöscht werden“ bedeuten. Auf Wasserläufe bezogen drückt „versiegen“ das Austrocknen idiomatisch aus, ohne das Bild unnötig mit Feuervokabular zu überlagern.
- source_word: מִמְּקוֹמָם
  choice: an ihrem Ort
  rationale: Die Präposition מִן kann in Verbindung mit einem Verb des Verschwindens die Entfernung vom Ausgangsort markieren. Natürliches Deutsch beschreibt denselben Vorgang hier mit „an ihrem Ort versiegen“; gemeint sein kann im Kontext insbesondere das Bachbett.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche und zugleich poetisch-würdevolle Standardsprache. Der Parallelismus der beiden Halbverse bleibt erhalten; „versiegen“ bietet für saisonale Wasserläufe eine natürliche deutsche Entsprechung.
