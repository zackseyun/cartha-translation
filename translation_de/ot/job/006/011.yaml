lexical_decisions:
- source_word: מַה כֹּחִי
  choice: Welche Kraft habe ich noch
  rationale: Die rhetorische Frage zielt auf Hiobs fehlende Kraft zum weiteren Ausharren. „Noch“ verdeutlicht im Deutschen den Zusammenhang, ohne den Sinn wesentlich zu erweitern.
- source_word: כִּי אֲיַחֵל
  choice: dass ich weiter hoffen sollte
  rationale: יחל kann „warten“ oder „hoffen“ bedeuten. Im Kontext gibt „weiter hoffen“ die fortdauernde Erwartung und Hiobs rhetorischen Zweifel natürlich wieder.
- source_word: וּמַה קִצִּי
  choice: Und welches Ende erwartet mich
  rationale: קֵץ bezeichnet Ende oder Grenze. Die Formulierung wahrt den Bezug auf Hiobs persönliches Ende und macht die im Hebräischen knappe Wendung im Deutschen verständlich.
- source_word: כִּי אַאֲרִיךְ נַפְשִׁי
  choice: dass ich mein Leben verlängern sollte
  rationale: Wörtlich steht hier „meine Seele/mein Leben verlängern“. Gemeint sein kann, das eigene Leben beziehungsweise das Ausharren fortzusetzen; die gewählte Fassung bewahrt das Bild des Verlängerns.
