  text: Welche Kraft habe ich noch, dass ich weiter hoffen sollte? Und was ist mein Ende, dass ich mein Leben verlängern sollte?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ich noch länger ausharren“ oder „geduldig sein sollte“. Wörtlich: „dass ich meine Seele verlängern sollte“; die hebräische Wendung kann das Verlängern des Lebens oder fortgesetztes Ausharren bezeichnen.'
