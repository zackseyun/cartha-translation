  text: ה֭וֹרוּ/נִי וַ/אֲנִ֣י אַחֲרִ֑ישׁ וּ/מַה שָּׁ֝גִ֗יתִי הָבִ֥ינוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/024.yaml
  text: Teach me[a], and I will be silent; make me understand how I have gone astray.
translation:
  language: de
  text: Belehrt mich, und ich werde schweigen; macht mir verständlich, worin ich mich geirrt habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרוּנִי
  choice: Belehrt mich
  rationale: Der Hifil-Imperativ von ירה bedeutet hier „lehren, unterweisen“. „Belehrt mich“ ist eine direkte, würdige Aufforderung an Jobs Freunde und wahrt den Plural.
- source_word: וַאֲנִי אַחֲרִישׁ
  choice: dann will ich schweigen
  rationale: 'Die Konjunktion bezeichnet im Zusammenhang natürlich die Folge: Wenn die Freunde ihn wirklich belehren, wird Job schweigen. „Schweigen“ bewahrt den ernsten Ton von חרשׁ.'
- source_word: וּמַה שָּׁגִיתִי
  choice: worin ich mich geirrt habe
  rationale: מַה kann in dieser Verbindung nach dem Gegenstand oder der Hinsicht des Irrtums fragen. „Worin“ ergibt im Deutschen eine natürliche Formulierung, ohne vorauszusetzen, dass Job tatsächlich vom rechten Weg abgekommen ist.
- source_word: הָבִינוּ לִי
  choice: lasst mich verstehen
  rationale: Der Hifil-Imperativ von בין mit לִי fordert die Angesprochenen auf, Job Einsicht zu vermitteln. „Lasst mich verstehen“ gibt den kausativen Sinn idiomatisch wieder und wahrt den Plural.
theological_decisions:
- issue: Ob Job einen tatsächlichen Irrtum eingesteht
  choice: 'Die Formulierung bleibt konditional beziehungsweise herausfordernd: Die Freunde sollen ihm zeigen, worin er sich geirrt hat.'
  alternative: „wie ich in die Irre gegangen bin“ könnte stärker wie ein bereits eingeräumtes Fehlgehen klingen.
  rationale: Der Vers steht als Aufforderung an die Freunde, Jobs angeblichen Irrtum konkret nachzuweisen; die Übersetzung soll kein Schuldeingeständnis vorwegnehmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Anredeformen stehen im Plural, entsprechend den hebräischen Imperativen an Jobs Freunde.
