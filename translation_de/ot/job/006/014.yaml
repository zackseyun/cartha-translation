id: JOB.6.14
reference: Job 6:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לַ/מָּ֣ס מֵרֵעֵ֣/הוּ חָ֑סֶד וְ/יִרְאַ֖ת שַׁדַּ֣י יַעֲזֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/014.yaml
  text: Kindness from his friend is due to one who is despairing[b][a], even if he forsakes the fear of the Almighty.
translation:
  language: de
  text: Wer verzweifelt, dem gebührt Güte[b] von seinem Freund, selbst wenn er die Furcht vor dem Allmächtigen aufgibt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer einem Verzweifelten Güte vorenthält, gibt die Furcht vor dem Allmächtigen auf.“ Der hebräische Satzbau ist stark verdichtet und kann so verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: „Güte“ übersetzt חֶסֶד; das Wort kann auch loyale Liebe, Barmherzigkeit oder Treue bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּס
  choice: wer verzweifelt
  rationale: מָס bezeichnet wörtlich jemanden, der dahinschmilzt oder innerlich zusammenbricht. Die substantivierte Formulierung „wer verzweifelt“ gibt das Bild im Kontext natürlich und verständlich wieder.
- source_word: מֵרֵעֵהוּ
  choice: von seinem Freund
  rationale: Die Präposition מִן bezeichnet hier die Quelle der erwarteten Güte; das Suffix der 3. Person Singular wird mit „seinem“ bewahrt.
- source_word: חָסֶד
  choice: Güte
  rationale: חֶסֶד umfasst hier mitmenschliche Güte, loyale Liebe, Barmherzigkeit und Treue. „Güte“ eignet sich als knappe, würdevolle Haupttextfassung; die weitere Bedeutungsbreite wird in einer Fußnote genannt.
- source_word: וְיִרְאַת שַׁדַּי
  choice: die Furcht vor dem Allmächtigen
  rationale: Die traditionelle biblische Wendung bewahrt sowohl den Aspekt der Furcht als auch den der Ehrfurcht gegenüber Gott.
- source_word: יַעֲזֹב
  choice: aufgibt
  rationale: עזב bedeutet verlassen, aufgeben oder im Stich lassen. „Aufgibt“ ist in Verbindung mit „Furcht“ natürlich und lässt den religiös-moralischen Ernst der Aussage bestehen.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: „Der Allmächtige“ ist die etablierte deutsche Wiedergabe des in Hiob häufigen Gottestitels שַׁדַּי.
theological_decisions:
- issue: Syntaktische Zuordnung des Schlusssatzes
  choice: Der Verzweifelte soll von seinem Freund Güte erfahren, selbst wenn er die Furcht vor dem Allmächtigen aufgibt.
  alternative: Wer einem Verzweifelten Güte vorenthält, gibt die Furcht vor dem Allmächtigen auf.
  rationale: Der hebräische Satz ist stark verdichtet und lässt beide Zuordnungen zu. Die Hauptfassung versteht die Schlussklausel konzessiv und passt zu Hiobs Klage über die mangelnde Unterstützung seiner Freunde. Die gewichtige alternative Lesart wird ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dem gebührt“ bewahrt den Anspruchscharakter der elliptischen hebräischen Formulierung, ohne unnötig altertümlich zu wirken. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Aussagen.
