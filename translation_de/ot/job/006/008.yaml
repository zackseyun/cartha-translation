  text: מִֽי יִ֭תֵּן תָּב֣וֹא שֶֽׁאֱלָתִ֑/י וְ֝/תִקְוָתִ֗/י יִתֵּ֥ן אֱלֽוֹהַּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/008.yaml
  text: Oh[a], that my request would come, and that God would grant my hope.
translation:
  language: de
  text: Wenn doch meine Bitte erfüllt würde und Gott mir gäbe, was ich erhoffe![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wenn doch meine Bitte käme und Gott meine Hoffnung gäbe!“'
    reason: Die wörtliche Bildsprache lässt die Bitte „kommen“ und bezeichnet das Erhoffte als „meine Hoffnung“; der Haupttext gibt den Sinn in natürlichem Deutsch wieder.
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Wenn doch
  rationale: Die feste Wendung drückt hier keinen wörtlichen Fragesatz, sondern einen dringenden Wunsch aus. „Wenn doch“ ist im modernen Deutschen natürlich und bewahrt den klagenden Ton.
- source_word: תָּבוֹא
  choice: erfüllt würde
  rationale: Wörtlich bedeutet das Verb „kommen“. In Verbindung mit „Bitte“ bezeichnet es hier idiomatisch das Eintreffen beziehungsweise die Erfüllung des Erbetenen; die Fußnote bewahrt die bildhafte Alternative.
- source_word: שֶׁאֱלָתִי
  choice: meine Bitte
  rationale: Das Substantiv bezeichnet eine Bitte oder ein Begehren. „Meine Bitte“ ist klar, knapp und dem würdevollen Register angemessen.
- source_word: וְתִקְוָתִי
  choice: was ich erhoffe
  rationale: תִּקְוָה kann Hoffnung, Erwartung oder das Erhoffte bezeichnen. Die verbale Formulierung ergibt mit „geben“ natürliches Deutsch, ohne den Inhalt der Hoffnung näher festzulegen.
- source_word: יִתֵּן
  choice: gäbe
  rationale: Das Verb bedeutet „geben“. Die direkte Wiedergabe erhält die bewusste Wiederaufnahme von נתן aus der einleitenden Wunschformel und lässt die Ausdrucksweise des Hebräischen erkennen.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: אֱלוֹהַּ ist die in Hiob häufige singularische Bezeichnung für Gott; „Allmächtiger“ wäre hier lexikalisch nicht begründet.
