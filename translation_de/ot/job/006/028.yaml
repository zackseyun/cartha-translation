  - marker: b
    text: 'Wörtlich etwa: „und vor euren Gesichtern – sollte ich lügen?“ Auch möglich: „Lüge ich in eurer Gegenwart?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Doch nun
  rationale: Die Wendung leitet einen unmittelbaren, gegenüber dem Vorangehenden abgesetzten Appell ein; „Doch nun“ gibt sowohl den zeitlichen als auch den kontrastierenden Sinn wieder.
- source_word: הוֹאִילוּ
  choice: bitte
  rationale: Der Imperativ der Willigkeit dient hier idiomatisch als höfliche Aufforderung und wird im Deutschen natürlich mit „bitte“ wiedergegeben.
- source_word: פְנוּ בִי
  choice: wendet euch mir zu
  rationale: פנה mit ב bezeichnet hier das Sich-Zuwenden beziehungsweise das Richten der Aufmerksamkeit auf jemanden. Die Übersetzung bewahrt das Verbbild, ohne bloßes Anschauen festzulegen.
- source_word: וְעַל פְּנֵיכֶם
  choice: euch ins Gesicht
  rationale: Die konkrete Wendung mit „Gesicht“ betont, dass Job offen und unmittelbar vor ihnen spricht. „Euch ins Gesicht“ ist im Deutschen natürlicher als die wörtliche Form „vor euren Gesichtern“.
- source_word: אִם אֲכַזֵּב
  choice: würde ich doch nicht lügen
  rationale: אִם hat im Zusammenhang rhetorische Kraft. כזב im Piel kann lügen beziehungsweise falsch reden bedeuten. Die deutsche rhetorische Aussage mit „doch nicht“ bewahrt Jobs Herausforderung und passt idiomatisch zur vorangehenden Wendung.
