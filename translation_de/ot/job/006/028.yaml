  text: But now[a], please turn to me, and before your faces[c][b], would I lie?
translation:
  language: de
  text: 'Doch nun, bitte, seht mich an[a]: Lüge ich euch etwa ins Gesicht[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wendet euch mir zu“.'
