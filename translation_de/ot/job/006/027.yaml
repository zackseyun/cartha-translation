  text: You would even cast lots over the fatherless[b][a], and bargain over your friend.
translation:
  language: de
  text: Sogar über eine Waise würdet ihr das Los werfen[a] und um euren Freund feilschen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf eine Waise fallen lassen“; wahrscheinlich ist das Werfen eines Loses gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eurem Freund eine Grube graben“. Das hebräische Verb ist hier schwer zu deuten; möglich ist auch der Gedanke, um einen Freund zu handeln oder ihn auszubeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: sogar
  rationale: Die Partikel steigert den Vorwurf; „sogar“ gibt die empörende Zuspitzung natürlich wieder.
- source_word: יָתוֹם
  choice: eine Waise
  rationale: Das Substantiv bezeichnet einen vaterlosen beziehungsweise verwaisten Menschen. „Waise“ ist im modernen Deutschen natürlich und bewahrt dessen soziale Schutzlosigkeit.
- source_word: תַּפִּילוּ
  choice: das Los werfen
  rationale: Der Hifil von נפל mit עַל wird hier wahrscheinlich idiomatisch vom Loswerfen gebraucht. Die Formulierung wahrt das Bild, ohne die Art der beabsichtigten Ausbeutung näher festzulegen.
- source_word: תִכְרוּ
  choice: feilschen
  rationale: Das Verb ist an dieser Stelle schwierig. Im Parallelismus liegt eine wirtschaftliche Behandlung oder Ausbeutung des Freundes nahe; „feilschen“ gibt diese Deutung knapp wieder.
- source_word: רֵיעֲכֶם
  choice: euren Freund
  rationale: רֵעַ kann Freund, Gefährte oder Nächster bedeuten. Im direkten Vorwurf an Jobs Begleiter hebt „euren Freund“ den Verrat besonders hervor.
- source_word: עַל ... עַל
  choice: über ... um
  rationale: Eine mechanisch gleiche Wiedergabe wäre im Deutschen unnatürlich. „über“ passt zum Loswerfen, „um“ zum Feilschen; die parallele Behandlung von Menschen als Verfügungsobjekte bleibt erhalten.
