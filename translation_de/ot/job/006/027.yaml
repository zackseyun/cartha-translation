  terminology: „Waise“ ist für יָתוֹם im Deutschen die natürliche, inklusive Wiedergabe und wahrt die soziale Schutzbedürftigkeit. „Freund“ passt zu רֵעַ im Kontext von Jobs Anklage an seine Gefährten. Die Fußnoten behandeln die textlich und lexikalisch unsicheren Wendungen zurückhaltend, ohne eine dogmatische oder unnötig feste Auslegung vorzuschreiben.
