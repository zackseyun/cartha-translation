  source_fidelity: Der Haupttext gibt אַף als steigerndes „Sogar“ treffend wieder. „Über eine Waise ... das Los werfen“ bildet die wahrscheinliche idiomatische Bedeutung von תַּפִּילוּ עַל ab. Die schwierige zweite Wendung wird mit „um euren Freund feilschen“ als kontextuell plausible Deutung wiedergegeben; die alternative Deutung von כרה als „eine Grube graben“ ist angemessen in der Fußnote dokumentiert.
