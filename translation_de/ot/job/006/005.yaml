    issue: Die Präposition wird mit „über“ räumlich missverständlich wiedergegeben; außerdem fügt „frischem“ eine nicht ausdrücklich markierte Bedeutung hinzu.
    rationale: In diesem parallelen Spruch fragt Hiob, ob Tiere bei vorhandenem Gras bzw. Futter klagen. „Über“ legt im Deutschen eher eine Position oberhalb des Futters oder ein Klagen darüber nahe. „Wenn ... hat“ stellt den rhetorischen Sinn natürlich dar, ohne den Kontrast zu verändern.
  revised_text: Schreit ein Wildesel, wenn er Gras hat, oder muht ein Rind, wenn es sein Mischfutter hat[a]?
