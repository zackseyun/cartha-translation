  text: הֲ/יִֽנְהַק פֶּ֥רֶא עֲלֵי דֶ֑שֶׁא אִ֥ם יִגְעֶה שּׁ֝֗וֹר עַל בְּלִילֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/005.yaml
  text: Does a wild donkey bray over grass[b][a], or does an ox low over its fodder?
translation:
  language: de
  text: Schreit ein Wildesel, wenn er Gras hat, oder muht ein Rind, wenn es sein Mischfutter hat[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet vermischtes oder zubereitetes Viehfutter.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִנְהַק
  choice: Schreit etwa
  rationale: נהק bezeichnet den charakteristischen Ruf eines Esels. „schreien“ ist im Deutschen die natürliche Bezeichnung dafür; „etwa“ kennzeichnet die rhetorische Frage.
- source_word: פֶּרֶא
  choice: Wildesel
  rationale: Das hebräische Wort bezeichnet den Wildesel beziehungsweise Onager. „Wildesel“ ist präzise und allgemein verständlich.
- source_word: עֲלֵי דֶשֶׁא
  choice: über frischem Gras
  rationale: Die Formulierung bewahrt das Bild des hebräischen עַל („über/bei“) und gibt דֶשֶׁא als frisches Grün beziehungsweise Gras wieder.
- source_word: אִם
  choice: oder
  rationale: In der zweiteiligen rhetorischen Frage leitet אִם die parallele Alternative ein.
- source_word: יִגְעֶה
  choice: muht
  rationale: געה bezeichnet den Laut eines Rindes. „muht“ ist im modernen Deutschen genauer und natürlicher als das stärkere „brüllt“.
- source_word: שׁוֹר
  choice: Rind
  rationale: שׁוֹר kann ein einzelnes Tier der Rindergattung bezeichnen. „Rind“ vermeidet die im Kontext nicht gesicherte Festlegung auf einen Ochsen oder Stier.
- source_word: עַל בְּלִילוֹ
  choice: über seinem Mischfutter
  rationale: בְּלִיל bezeichnet vermischtes beziehungsweise zubereitetes Viehfutter; das Possessivsuffix wird mit „seinem“ wiedergegeben. „über“ erhält die Parallelität zu עֲלֵי דֶשֶׁא.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallele Struktur und das konkrete Bild der beiden rhetorischen Fragen bleiben erhalten; „muht“ ist bewusst alltagssprachlich klar, ohne salopp zu wirken.
