base_translation:
  language: en
  yaml_path: translation/ot/job/006/006.yaml
  text: Can tasteless food be eaten without salt[a], or is there any taste in the slime of mallow?
translation:
  language: de
  text: Kann man fades Essen ohne Salz essen, oder gibt es irgendeinen Geschmack im Schleim der Malve?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Begriffe im zweiten Satzteil sind unsicher. »Schleim der Malve« kann auch als »Saft der Malve« verstanden werden; traditionell wird die Wendung teilweise mit »Eiweiß« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יֵאָכֵל
  choice: Kann man … essen
  rationale: Die Fragepartikel mit dem Nifal-Imperfekt von אכל bildet eine rhetorische Frage. Die unpersönliche deutsche Wendung gibt die Möglichkeit und den rhetorischen Sinn natürlich wieder.
- source_word: תָּפֵל
  choice: fade Speise
  rationale: Das Adjektiv bezeichnet etwas Geschmackloses oder Ungewürztes; »Speise« macht den im Zusammenhang vorausgesetzten essbaren Gegenstand deutlich.
- source_word: מִ/בְּלִי מֶלַח
  choice: ohne Salz
  rationale: Die Präpositionalfügung bezeichnet unmittelbar das Fehlen von Salz.
- source_word: אִם יֶשׁ
  choice: oder hat … irgendeinen
  rationale: אִם leitet hier parallel zur ersten Frage eine zweite rhetorische Frage ein; diese Formulierung ist im Deutschen natürlich.
- source_word: טַעַם
  choice: Geschmack
  rationale: Das Substantiv bezeichnet Geschmack und greift den Gedanken der faden Speise auf.
- source_word: בְּ/רִיר
  choice: der Schleim
  rationale: Das seltene und schwierige Wort kann eine schleimige Flüssigkeit oder einen Saft bezeichnen. »Schleim« bewahrt die abwertende Wirkung, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: חַלָּמוּת
  choice: der Malve
  rationale: Der Ausdruck ist eine unsichere Pflanzenbezeichnung. »Malve« ist eine verbreitete Deutung; andere Auffassungen werden in der Fußnote genannt.
