  variant: modern standard German
source:
  edition: WLC
  text: הֲֽ/כִי אָ֭מַרְתִּי הָ֣בוּ לִ֑/י וּ֝/מִ/כֹּחֲ/כֶ֗ם שִׁחֲד֥וּ בַעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/022.yaml
  text: Have I ever said[a], ‘Give to me,’ or, ‘From your strength[b], pay a bribe on my behalf’?”
translation:
  language: de
  text: 'Habe ich etwa gesagt: »Gebt mir etwas!«, oder: »Zahlt aus eurem Vermögen[a] Bestechungsgeld[b] für mich!«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »aus eurer Kraft«. Gemeint sind hier wahrscheinlich die eigenen Mittel oder das Vermögen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb ist mit dem Wort für »Bestechungsgeld« oder »Geschenk« verwandt. Es kann hier auch allgemeiner eine Zahlung oder Zuwendung zugunsten Hiobs bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי אָמַרְתִּי
  choice: Habe ich etwa gesagt
  rationale: Die rhetorische Frage weist nachdrücklich zurück, dass Hiob eine solche Forderung gestellt habe. »Etwa« gibt diese Wirkung im Deutschen natürlich wieder, ohne dem Text ein ausdrückliches »jemals« hinzuzufügen.
- source_word: הָבוּ לִי
  choice: Gebt mir etwas
  rationale: Der Pluralimperativ הָבוּ bedeutet »gebt«; das nicht näher bezeichnete Objekt wird im Deutschen idiomatisch durch »etwas« ausgedrückt.
- source_word: וּמִכֹּחֲכֶם
  choice: aus eurem Vermögen
  rationale: כֹּחַ bezeichnet wörtlich »Kraft/Macht«, kann im Zusammenhang einer Zahlung aber die verfügbaren Mittel beziehungsweise das Vermögen meinen. Diese kontextuelle Bedeutung ergibt im Deutschen einen klaren und natürlichen Satz.
- source_word: שִׁחֲדוּ
  choice: zahlt … Bestechungsgeld
  rationale: Das Verb gehört zu שֹׁחַד, »Bestechungsgeld/Geschenk«. Die Wiedergabe wahrt den anstößigen beziehungsweise erkauften Charakter der verlangten Leistung, lässt durch die Fußnote aber die allgemeinere Zahlungsvorstellung sichtbar.
- source_word: בַעֲדִי
  choice: für mich
  rationale: Die Präposition bedeutet hier »für mich/meinetwegen/zu meinen Gunsten«. »Für mich« ist knapp und lässt offen, wem die Zahlung gelten sollte.
theological_decisions:
- issue: Zweck und Empfänger der erbetenen Zahlung
  choice: Die Formulierung »Bestechungsgeld für mich« lässt den Empfänger unausgesprochen.
  alternative: »Bestecht jemanden zu meinen Gunsten«
  rationale: Im Hebräischen steht kein ausdrückliches Objekt zu שִׁחֲדוּ. Die Übersetzung sollte weder einen bestimmten Empfänger noch ein genaueres Szenario ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede und die rhetorische Frage bleiben deutlich; die wirtschaftliche Bedeutung von כֹּחַ wird im Haupttext idiomatisch wiedergegeben, während die wörtliche Bedeutung in der Fußnote erhalten bleibt.
