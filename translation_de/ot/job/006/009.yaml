translation:
  language: de
  text: Dass Gott doch bereit wäre, mich zu zermalmen,[a] seiner Hand freien Lauf ließe[b] und mir ein Ende machte![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „sich dazu entschlösse, mich zu zermalmen“. Das hebräische Verb drückt Bereitschaft oder Einwilligung aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „seine Hand losließe“. Gemeint ist, dass Gott seine Hand nicht länger zurückhält, sondern sie zum entscheidenden Schlag freigibt.'
    reason: cultural_note
  - marker: c
    text: 'Auch: „mich abschnitte“ oder „mich abtrennte“. Im Zusammenhang mit Hiobs Todeswunsch bezeichnet dies ein entscheidendes Ende.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאֵל
  choice: doch bereit wäre
  rationale: Die Hifil-Form von יאל bezeichnet Bereitschaft oder Einwilligung. Zusammen mit „doch“ gibt die Formulierung Hiobs dringlichen Wunsch natürlich wieder, ohne Gottes Handeln als bloßes Gefallen daran zu deuten.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: אֱלוֹהַּ ist im Hiobbuch eine übliche singularische Bezeichnung für Gott; eine Transliteration ist nicht erforderlich.
- source_word: וִידַכְּאֵנִי
  choice: mich zu zermalmen
  rationale: דכא bezeichnet hier ein gewaltsames Zermalmen oder Zerbrechen. „Zermalmen“ bewahrt die Härte von Hiobs Todeswunsch.
- source_word: יַתֵּר יָדוֹ
  choice: seiner Hand freien Lauf ließe
  rationale: נתר hat den Sinn des Lösens oder Freigebens. Mit „seiner Hand“ bezeichnet die Wendung das Aufgeben bisheriger Zurückhaltung; die deutsche Formulierung bewahrt sowohl das Bild als auch dessen idiomatische Bedeutung.
- source_word: וִיבַצְּעֵנִי
  choice: mich endgültig abschnitte
  rationale: בצע kann „abschneiden“ oder „abtrennen“ bedeuten und bezeichnet im Zusammenhang Hiobs vollständiges, endgültiges Ende. „Endgültig“ macht diese Finalität verständlich, ohne eine bestimmte Todesart festzulegen.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Handeln
  choice: Das konkrete Bild „seiner Hand“ bleibt erhalten.
  alternative: seine Macht einsetzte / sein Gericht vollstreckte
  rationale: Der hebräische Text schildert Gottes Wirken mit körperhafter Bildsprache. Diese darf weder abstrahiert noch als Aussage über Gottes Körperlichkeit missverstanden werden.
- issue: Hiobs Wunsch nach endgültigem Tod
  choice: Der erschütternde Wunsch wird ohne Abschwächung als Bitte um Zermalmung und endgültiges Abschneiden wiedergegeben.
  alternative: mich von meinem Leiden erlöste
  rationale: Eine Umschreibung als Erlösung vom Leiden würde die Härte und theologische Spannung des hebräischen Wortlauts beseitigen.
translation_notes:
  register: Moderne, würdige Standardsprache mit der emotionalen Schärfe einer poetischen Klage. Der einleitende Wunschsatz schließt syntaktisch an Hiob 6,8 an; das Ausrufezeichen verdeutlicht den eigenständigen Wunschcharakter des Verses.
