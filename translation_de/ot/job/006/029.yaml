source:
  edition: WLC
  text: שֻֽׁבוּ נָ֭א אַל תְּהִ֣י עַוְלָ֑ה ו/שבי ע֝וֹד צִדְקִ/י בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/029.yaml
  text: Turn back[a], please; let there be no injustice. Turn back again; my righteousness is still in it.
translation:
  language: de
  text: 'Kehrt doch um[a]; es soll kein Unrecht geschehen! Kehrt noch einmal um: Darin bin ich noch im Recht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Überlegt es euch noch einmal; in dieser Sache bin ich weiterhin im Recht.“'
    reason: Die Wiederholung von שוב kann sinngemäß als Aufforderung zu erneuter Prüfung verstanden werden. Das feminine Suffix in בָהּ bezieht sich wohl auf die nicht ausdrücklich genannte Streitsache; „darin“ erhält die Offenheit des hebräischen Bezugs.
lexical_decisions:
- source_word: שֻׁבוּ
  choice: Kehrt ... um
  rationale: Der Imperativ Plural von שוב fordert die Freunde auf, ihre Beurteilung zurückzunehmen. „Umkehren“ bewahrt das Bild einer Richtungsänderung und klingt im Deutschen natürlich.
- source_word: נָא
  choice: doch
  rationale: Die Partikel mildert und verstärkt zugleich die eindringliche Aufforderung. In diesem Zusammenhang gibt „doch“ den bittenden Ton natürlicher wieder als das ausdrücklichere „bitte“.
- source_word: אַל תְּהִי עַוְלָה
  choice: es soll kein Unrecht geschehen
  rationale: Die unpersönliche Formulierung bewahrt den abstrakten Ausdruck des Hebräischen, macht aber im Deutschen deutlich, dass ungerechtes Handeln beziehungsweise Urteilen unterbleiben soll.
- source_word: עַוְלָה
  choice: Unrecht
  rationale: „Unrecht“ umfasst hier sowohl Ungerechtigkeit als auch ein falsches Urteil und ist in der Streitsituation idiomatischer als „Ungerechtigkeit“.
- source_word: וְשֻׁבוּ
  choice: Kehrt noch einmal um
  rationale: Die Wiederholung des Imperativs wird beibehalten; „noch einmal“ gibt den erneuten, eindringlichen Aufruf wieder.
- source_word: עוֹד
  choice: noch
  rationale: Vor der folgenden Aussage bezeichnet עוד am natürlichsten das Fortbestehen von Hiobs Recht beziehungsweise Rechtschaffenheit.
- source_word: צִדְקִי
  choice: bin ich ... im Recht
  rationale: Das Substantiv mit Suffix bezeichnet in diesem Streit Hiobs Gerechtigkeit, Integrität oder berechtigte Sache. Die idiomatische Wendung „ich bin im Recht“ wahrt den forensischen Sinn, ohne eine Behauptung völliger Sündlosigkeit nahezulegen.
- source_word: בָהּ
  choice: hier
  rationale: Das feminine Suffix verweist auf die nicht ausdrücklich genannte Angelegenheit oder Streitsache. „Hier“ gibt diesen situativen Bezug im Deutschen knapp und natürlich wieder; die formalere Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von Hiobs Behauptung mit צִדְקִי
  choice: Hiob behauptet, in der strittigen Sache weiterhin im Recht zu sein.
  alternative: Hiob erklärt, seine Gerechtigkeit beziehungsweise Rechtschaffenheit bestehe darin weiterhin.
  rationale: Der Zusammenhang betrifft das Urteil seiner Freunde über ihn. Die Formulierung wahrt den moralisch-forensischen Anspruch, ohne ihn als Behauptung absoluter Sündlosigkeit auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Aufforderung des Hebräischen bleibt hörbar; die abstrakte und etwas mehrdeutige Rechtsaussage wird idiomatisch wiedergegeben und durch die Fußnote abgesichert.
