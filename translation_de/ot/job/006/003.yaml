  yaml_path: translation/ot/job/006/003.yaml
  text: For now it would be heavier than the sand of the seas[a]; therefore my words have been rash.
translation:
  language: de
  text: Denn jetzt wäre es schwerer als der Sand der Meere; darum sind meine Worte ungezügelt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »darum sind meine Worte wirr«. Das hebräische Verb ist schwierig und kann eine unkontrollierte oder ungeordnete Rede bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Hiobs Klage im vorangehenden Vers ein.
- source_word: עַתָּה
  choice: jetzt
  rationale: Bewahrt die zeitliche beziehungsweise diskursive Hervorhebung seiner gegenwärtigen Lage.
- source_word: מֵחוֹל יַמִּים
  choice: als der Sand der Meere
  rationale: Gibt den Vergleich und den hebräischen Plural »Meere« natürlich wieder.
- source_word: יִכְבָּד
  choice: wäre es schwerer
  rationale: Gibt כבד als Gewichtsbegriff wieder; das Pronomen verweist elliptisch auf Kummer und Leid aus Vers 2.
- source_word: עַל־כֵּן
  choice: darum
  rationale: Kennzeichnet die Folge aus der überwältigenden Last.
- source_word: דְּבָרַי
  choice: meine Worte
  rationale: Bewahrt den Plural und ist im Deutschen unmittelbar verständlich.
- source_word: לָעוּ
  choice: sind ungezügelt
  rationale: Der schwierige Ausdruck bezeichnet hier am ehesten eine außer Kontrolle geratene oder ungeordnete Rede, ohne ihn vorschnell auf bloße Unbesonnenheit festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ellipse des hebräischen Textes bleibt mit »es« erhalten; der Bezug auf die in Vers 2 genannte Last ergibt sich aus dem Zusammenhang. Die schwierige Schlussformulierung wird im Text verständlich wiedergegeben und in der Fußnote als echte lexikalische Unsicherheit kenntlich gemacht.
