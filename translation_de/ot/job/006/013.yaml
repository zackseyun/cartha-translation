  text: הַ/אִ֬ם אֵ֣ין עֶזְרָתִ֣/י בִ֑/י וְ֝/תֻשִׁיָּ֗ה נִדְּחָ֥ה מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/013.yaml
  text: Is my help not within me[a], and has sound wisdom been driven from me?
translation:
  language: de
  text: Ist denn keine Hilfe in mir, und ist die Umsicht von mir vertrieben worden?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאִם אֵין
  choice: Ist es nicht so, dass keine … ist
  rationale: Die Verbindung leitet eine rhetorische Frage mit verneintem Inhalt ein. Diese Formulierung bewahrt sowohl den Fragecharakter als auch Jobs Aussage, dass ihm innere Hilfe fehlt.
- source_word: עֶזְרָתִי
  choice: Hilfe
  rationale: Die direkte Bedeutung ist „Hilfe“ oder „Beistand“. Im Zusammenhang bezeichnet sie die Hilfe, die Job noch in sich selbst finden könnte.
- source_word: בִי
  choice: in mir
  rationale: Gibt die Präposition ב mit dem Suffix der ersten Person unmittelbar wieder und lässt den Gedanken innerer Hilfsquellen erkennen.
- source_word: וְתֻשִׁיָּה
  choice: Umsicht
  rationale: תושיה kann in der Weisheitsliteratur praktische Einsicht, Tüchtigkeit oder die Fähigkeit zu wirksamem Handeln bezeichnen. „Umsicht“ ist im Deutschen würdig und verständlich, ohne den Ausdruck auf rein theoretische Weisheit einzuengen.
- source_word: נִדְּחָה מִמֶּנִּי
  choice: von mir vertrieben wurde
  rationale: 'Bewahrt das Passiv und die kräftige Bewegung des Verbs נדח: Die Umsicht ist nicht nur verloren, sondern von Job weggedrängt worden.'
theological_decisions: []
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Die einleitende Konstruktion macht deutlich, dass die rhetorische Frage den verneinten Inhalt beider Satzteile umfasst; die bildhafte passive Formulierung „vertrieben wurde“ bleibt erhalten.
