lexical_decisions:
- source_word: הַקֹּדְרִים
  choice: die … dunkel sind
  rationale: Das Partizip von קדר bezeichnet grundlegend ein Dunkel- oder Düstersein. Die Wiedergabe wahrt den visuellen Sinn, ohne die kontextuell mögliche Trübung bereits in den Haupttext einzutragen.
- source_word: מִנִּי
  choice: vom
  rationale: Die Präposition kann Herkunft oder Ursache bezeichnen; hier gibt „vom Eis“ knapp die Ursache der Dunkelheit an.
- source_word: קָרַח
  choice: Eis
  rationale: קָרַח kann Eis beziehungsweise Frost bezeichnen. „Eis“ passt zum winterlichen Bild und zur anschließenden Erwähnung des Schnees.
- source_word: עָלֵימוֹ
  choice: auf denen
  rationale: Die Präposition mit dem Suffix der 3. Person Plural bezeichnet hier eine räumliche Beziehung und verweist auf die zuvor genannten Wasserläufe.
- source_word: יִתְעַלֶּם
  choice: sich … verbirgt
  rationale: Die reflexive Verbform wird natürlich und zugleich formnah wiedergegeben.
- source_word: שָׁלֶג
  choice: der Schnee
  rationale: Der bestimmte Artikel ist im Deutschen in diesem poetischen Zusammenhang idiomatisch und bezeichnet den Schnee allgemein.
