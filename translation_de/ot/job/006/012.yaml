  language: de
  text: Ist meine Kraft die Kraft von Steinen, oder ist mein Fleisch Bronze?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Ist …? / ist …?
  rationale: אִם leitet hier zwei rhetorische Fragen ein, keine Bedingungssätze. Die deutsche Frageform gibt diese Funktion natürlich wieder.
- source_word: כֹּחַ / כֹּחִי
  choice: Kraft / meine Kraft
  rationale: „Kraft“ passt zum körperlichen Zusammenhang und bewahrt die Wiederholung des hebräischen Wortes im ersten Halbvers.
- source_word: אֲבָנִים
  choice: Steinen
  rationale: Der Plural bezeichnet konkret „Steine“; die Formulierung erhält das Bild außergewöhnlicher Härte.
- source_word: בְּשָׂרִי
  choice: mein Fleisch
  rationale: Die wörtliche Wiedergabe bewahrt den anschaulichen Gegensatz zwischen menschlichem Fleisch und hartem Metall.
- source_word: נָחוּשׁ
  choice: Bronze
  rationale: Das Wort kann Kupfer oder Bronze bezeichnen; „Bronze“ vermittelt in diesem poetischen Vergleich besonders klar Härte und Widerstandsfähigkeit.
