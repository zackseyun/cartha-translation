  yaml_path: translation/ot/job/006/020.yaml
  text: They are ashamed because they trusted[b][a]; they came there and were disappointed.
translation:
  language: de
  text: Sie werden beschämt, weil sie vertrauten; sie kamen dorthin[a] und werden zuschanden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie kamen bis zu ihr/ihm hin“; das feminine Suffix bezieht sich auf das zuvor beschriebene Bachbett oder Wadi.'
    reason: cross_reference
  - marker: b
    text: 'Oder: „und wurden beschämt“ oder „und waren enttäuscht“. Im Hebräischen stehen zwei verwandte Verben aus dem Bedeutungsfeld von Scham und Schande; das zweite kann im Zusammenhang auch die enttäuschte Erwartung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּשׁוּ
  choice: werden beschämt
  rationale: Das Qal Perfekt von בוש bezeichnet hier das Zuschandenwerden beziehungsweise die daraus folgende Beschämung. Die präsentische Wiedergabe passt zur anschaulichen Schilderung des Zusammenhangs.
- source_word: כִּי
  choice: weil
  rationale: כִּי leitet am natürlichsten den Grund ihres Beschämtwerdens ein.
- source_word: בָטָח
  choice: sie vertraut haben
  rationale: Die Form ist morphologisch 3. Person Singular maskulin, steht aber im Zusammenhang zwischen pluralischen Verben und bezieht sich sinngemäß kollektiv auf die Reisegruppen. Im Deutschen wird deshalb der Plural fortgeführt.
- source_word: בָּאוּ
  choice: sie kommen
  rationale: Direkte, im Deutschen natürliche Wiedergabe von בוא; das Präsens hält die lebendige Darstellung aufrecht.
- source_word: עָדֶיהָ
  choice: zu ihm
  rationale: Das feminine Suffix verweist auf das zuvor genannte Bachbett beziehungsweise Wadi. Da „Bach“ im Deutschen maskulin ist, verlangt der Rückbezug „ihm“.
- source_word: וַיֶּחְפָּרוּ
  choice: stehen bestürzt da
  rationale: חפר bezeichnet hier Beschämung, Verwirrung oder betroffenes Entsetzen. „Bestürzt“ bewahrt die Reaktion auf die enttäuschte Hoffnung, ohne das zweite Schamverb mit dem ersten gleichzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Parallelität und der Wechsel zwischen Beschämung und Bestürzung bleiben erkennbar; der kollektive Bezug wird im Deutschen durchgehend im Plural ausgedrückt.
