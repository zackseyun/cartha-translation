base_translation:
  language: en
  yaml_path: translation/ot/job/006/030.yaml
  text: Is there injustice on my tongue? Does my palate not discern calamities?[a]
translation:
  language: de
  text: Ist Unrecht auf meiner Zunge? Erkennt mein Gaumen nicht Unheil?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verkehrte Dinge“ bzw. „Verderben“. Das hebräische Wort kann zerstörerisches Unheil oder moralisch Verkehrtes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֵשׁ
  choice: Ist
  rationale: Leitet eine rhetorische Ja-Nein-Frage ein; im Deutschen ist die knappe Verb-Erst-Stellung natürlich.
- source_word: בִּלְשׁוֹנִי
  choice: auf meiner Zunge
  rationale: Bewahrt das konkrete Bild der Zunge als Organ des Sprechens.
- source_word: עַוְלָה
  choice: Unrecht
  rationale: Gibt die moralische Bedeutung prägnant und in würdigem, modernem Deutsch wieder.
- source_word: אִם
  choice: '[durch selbstständige zweite Frage wiedergegeben]'
  rationale: Das Wort leitet hier parallel zur ersten eine zweite rhetorische Frage ein; eine wörtliche Wiedergabe mit „wenn“ wäre im Deutschen missverständlich.
- source_word: חִכִּי
  choice: mein Gaumen
  rationale: Bewahrt die körperliche Metapher des Schmeckens und unterscheidenden Wahrnehmens.
- source_word: לֹא יָבִין
  choice: erkennt … nicht
  rationale: בין bezeichnet verstehendes Unterscheiden; „erkennen“ klingt mit „Gaumen“ natürlicher als das abstraktere „verstehen“.
- source_word: הַוּוֹת
  choice: was Verderben bringt
  rationale: Die Form kann zerstörerisches Unheil, Verderben oder moralisch Verkehrtes bezeichnen. Die Umschreibung hält den zerstörerischen Sinn fest, ohne die Stelle vorschnell nur auf erlittene Katastrophen zu beziehen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen rhetorischen Fragen und die körperlichen Bilder von Zunge und Gaumen bleiben erhalten; die lexikalische Mehrdeutigkeit des Schlusswortes wird in der Fußnote offengelegt.
