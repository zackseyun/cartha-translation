  text: מַה נִּמְרְצ֥וּ אִמְרֵי יֹ֑שֶׁר וּ/מַה יּוֹכִ֖יחַ הוֹכֵ֣חַ מִ/כֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/025.yaml
  text: How forceful are upright words! But what does reproof from you prove?[a]
translation:
  language: de
  text: Wie eindringlich sind aufrichtige Worte! Doch was beweist eure Zurechtweisung?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wie schmerzlich sind ehrliche Worte! Doch was richtet euer Streiten aus?“ Das Hebräische kann im ersten Satz „eindringlich“, „überzeugend“, „kraftvoll“ oder „schmerzlich“ bedeuten. Im zweiten Satz stehen zwei Formen derselben Wortwurzel, die unter anderem „beweisen“, „widerlegen“, „zurechtweisen“ oder „streiten“ bedeuten kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נִּמְרְצוּ
  choice: Wie eindringlich sind
  rationale: Das einleitende מַה bezeichnet hier den Grad und leitet einen Ausruf ein. נמרצו kann Stärke, nachdrückliche Wirkung oder Überzeugungskraft ausdrücken; „eindringlich“ wahrt diese Bedeutungsbreite besser als eine rein logische oder emotionale Festlegung.
- source_word: אִמְרֵי יֹשֶׁר
  choice: aufrichtige Worte
  rationale: אִמְרֵי bezeichnet gesprochene Worte; יֹשֶׁר meint Geradheit beziehungsweise Aufrichtigkeit. Die Formulierung bewahrt sowohl die ethische als auch die sprachliche Nuance.
- source_word: וּמַה
  choice: Doch was
  rationale: 'Die Verbindung ist im Zusammenhang kontrastiv: Der Wirksamkeit aufrichtiger Worte wird die fragliche Wirkung der Zurechtweisung der Freunde gegenübergestellt.'
- source_word: יוֹכִיחַ הוֹכֵחַ
  choice: beweist … Zurechtweisung
  rationale: Die beiden Formen gehören zur Wurzel יכח, deren Bedeutungsspektrum „beweisen“, „zurechtweisen“, „streiten“ und „widerlegen“ umfasst. Die Übersetzung gibt die rhetorische Frage natürlich wieder; eine Fußnote macht die nicht vollständig nachbildbare Wortwiederholung und die Alternativen sichtbar.
- source_word: מִכֶּם
  choice: eure
  rationale: 'Die Präposition מן kennzeichnet den Ursprung: Die Zurechtweisung geht von den Angeredeten aus. Im Deutschen drückt das Possessivpronomen dies natürlicher aus als „von euch“.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Eindringlich“ ist allgemein verständlich und wahrt die Mehrdeutigkeit des seltenen Verbs, während die Fußnote weitere mögliche Nuancen sowie das hebräische Wortspiel offenlegt.
