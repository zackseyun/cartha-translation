  yaml_path: translation/ot/job/006/019.yaml
  text: The caravans of Tema looked[c][b][a]; the travelers of Sheba hoped for them.
translation:
  language: de
  text: Die Karawanen von Tema hielten Ausschau; die Reisenden von Saba hofften[a] auf sie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „warteten auf sie“. Das hebräische Verb kann sowohl Hoffen als auch erwartungsvolles Warten ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Sie“ bezieht sich wahrscheinlich auf die in den vorhergehenden Versen beschriebenen Wasserläufe.
    reason: cross_reference
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: hielten Ausschau
  rationale: Das Verb נבט bezeichnet ein Schauen oder Hinblicken. Im Zusammenhang mit Reisenden, die nach Wasser suchen, gibt „hielten Ausschau“ die zielgerichtete Wahrnehmung natürlich wieder, ohne ein Objekt in den Text einzufügen.
- source_word: אָרְחוֹת
  choice: Karawanen
  rationale: Das Substantiv kann wörtlich „Pfade/Wege“ bedeuten, bezeichnet hier aber metonymisch die auf diesen Routen ziehenden Reisegesellschaften; der Parallelismus mit הֲלִיכֹת stützt diese Deutung.
- source_word: תֵּמָא
  choice: Tema
  rationale: Der Ortsname wird in gebräuchlicher deutscher Transliteration wiedergegeben.
- source_word: הֲלִיכֹת
  choice: Reisenden
  rationale: Das Wort bezeichnet wörtlich „Züge/Gänge“ und bezieht sich hier auf die unterwegs befindlichen Reisegruppen. „Reisenden“ ist im Deutschen klar und bewahrt den poetischen Parallelismus.
- source_word: שְׁבָא
  choice: Saba
  rationale: „Saba“ ist die im Deutschen etablierte Form des Orts- beziehungsweise Volksnamens.
- source_word: קִוּוּ
  choice: hofften
  rationale: קוה kann sowohl „hoffen“ als auch erwartungsvoll „warten“ bedeuten. „Hofften“ bringt hier die dringliche Erwartung der nach Wasser suchenden Reisenden zum Ausdruck.
- source_word: לָמוֹ
  choice: auf sie
  rationale: Das Pronomen verweist wahrscheinlich auf die zuvor genannten Wasserläufe. Die pronominale Form bleibt im Haupttext erhalten, während die Fußnote den Bezug erläutert.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. „Hielten Ausschau“ und „hofften“ bilden die erwartungsvolle Suche der Wüstenreisenden ab; die knappe Parallelstruktur des hebräischen Verses bleibt erhalten.
