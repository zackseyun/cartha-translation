id: JOB.6.10
reference: Job 6:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ֥/תְהִי ע֨וֹד נֶ֘חָ֤מָתִ֗/י וַ/אֲסַלְּדָ֣ה בְ֭/חִילָה לֹ֣א יַחְמ֑וֹל כִּי לֹ֥א כִ֝חַ֗דְתִּי אִמְרֵ֥י קָדֽוֹשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/010.yaml
  text: This would still be my comfort[a], and I would exult in unrelenting pain; for I have not denied the words of the Holy One.
translation:
  language: de
  text: Das wäre noch mein Trost[a], und ich würde in schonungsloser Qual jubeln; denn ich habe die Worte des Heiligen nicht verleugnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formaler: »und ich würde jubeln in der Qual, die er nicht schont«. Der hebräische Wortlaut dieses Satzteils ist schwierig und stark verdichtet.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶחָמָתִי
  choice: mein Trost
  rationale: Das Substantiv bezeichnet Trost oder Tröstung. »Mein Trost« ist im modernen Deutsch natürlich und bewahrt Hiobs Aussage über den ihm verbleibenden inneren Halt.
- source_word: וַאֲסַלְּדָה
  choice: und ich würde jubeln
  rationale: Das seltene Verb סלד ist schwierig zu bestimmen, bezeichnet hier aber wahrscheinlich eine starke, beinahe trotzige Freudenreaktion. »Jubeln« gibt diese Intensität wieder, ohne ein unsicheres körperliches Bild festzulegen.
- source_word: בְחִילָה לֹא יַחְמֹל
  choice: in schonungslosem Schmerz
  rationale: Die hebräische Fügung ist knapp und syntaktisch schwierig. חילה weist auf heftigen Schmerz oder Qual, während לא יחמל wörtlich »er schont nicht« bedeutet. »Schonungsloser Schmerz« verbindet beide Gedanken idiomatisch; die formalere Lesart steht in der Fußnote.
- source_word: כִחַדְתִּי
  choice: ich habe … nicht verleugnet
  rationale: כחד im Piel kann »verbergen«, »verschweigen« oder »verleugnen« bedeuten. In Verbindung mit den Worten Gottes passt »verleugnen« als Aussage, dass Hiob sie nicht zurückgewiesen hat, am besten, ohne die lexikalische Spannung ganz aufzulösen.
- source_word: אִמְרֵי
  choice: die Worte
  rationale: Der Konstruktplural von אמרה bezeichnet gesprochene Worte oder Aussprüche. »Die Worte« ist breit, würdig und im Deutschen natürlich.
- source_word: קָדוֹשׁ
  choice: des Heiligen
  rationale: Das substantivierte Adjektiv bezeichnet hier Gott. »Der Heilige« bewahrt den göttlichen Titel in geläufigem, würdigem Deutsch.
theological_decisions:
- issue: Göttlicher Titel קָדוֹשׁ
  choice: des Heiligen
  alternative: des heiligen Einen
  rationale: Der Kontext spricht für eine Bezeichnung Gottes, nicht für einen beliebigen heiligen Menschen. Die substantivierte und großgeschriebene Form erhält den Titelcharakter, ohne weitere dogmatische Bestimmungen einzutragen.
- issue: Deutung der schwierigen Wendung בְחִילָה לֹא יַחְמֹל
  choice: in schonungslosem Schmerz
  alternative: im Schmerz, den er nicht schont
  rationale: Der hebräische Text ist verdichtet und lässt die syntaktische Zuordnung offen. Die Hauptfassung gibt starken, nicht gelinderten Schmerz verständlich wieder; die Fußnote bewahrt die formalere Lesart mit Gott als unausgesprochenem Subjekt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Der Konjunktiv II bildet den vorausgesetzten Wunschzusammenhang ab; das Semikolon markiert die begründende Schlussaussage. Die schwierige mittlere Wendung wird lesbar wiedergegeben, ohne ihre Unsicherheit zu verschweigen.
