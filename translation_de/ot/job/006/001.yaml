lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: Die Wayyiqtol-Form von ענה leitet Hiobs Erwiderung auf die vorangegangene Rede ein. „antwortete“ ist im Deutschen die natürliche und genaue Wiedergabe.
- source_word: אִיּוֹב
  choice: Hiob
  rationale: Der Personenname wird gemäß der etablierten deutschen Namensform wiedergegeben.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die Wayyiqtol-Form von אמר bildet zusammen mit וַיַּעַן die hebräische Redeformel „antwortete und sagte“. Beide Verben bleiben erhalten, um Stil und Struktur des Ausgangstextes abzubilden.
- source_word: וַ־
  choice: Da
  rationale: Das einleitende Waw mit Wayyiqtol führt die Erzählung fort. „Da“ gibt diesen Fortgang in natürlichem, würdigem Deutsch wieder.
