  yaml_path: translation/ot/job/006/021.yaml
  text: For now you have become nothing[a]; you see terror[b], and you are afraid.
translation:
  language: de
  text: Denn jetzt seid ihr zu nichts geworden[a]; ihr seht den Schrecken[b] und fürchtet euch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet der hebräische Text ungefähr: »Ihr seid nicht geworden.« Viele verstehen den Sinn als »Ihr seid zu nichts geworden« oder »Ihr seid wie sie geworden«, nämlich wie die unzuverlässigen Bäche in den vorhergehenden Versen.'
    reason: textual_variant
  - marker: b
    text: 'Oder: »Ihr seht das Unheil und fürchtet euch.« Das hebräische Wort kann Schrecken, Bestürzung oder ein zerschmetterndes Unglück bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Kennzeichnet den folgenden Satz als Begründung beziehungsweise Folgerung aus dem Vergleich mit den unzuverlässigen Bächen.
- source_word: עַתָּה
  choice: jetzt
  rationale: Bewahrt den zeitlichen Gegensatz zwischen der früheren Erwartung Hiobs und dem gegenwärtigen Versagen seiner Freunde.
- source_word: הֱיִיתֶם
  choice: seid ihr … geworden
  rationale: Gibt das Verb היה als Zustandsveränderung wieder und hält den Bezug auf die zuvor beschriebenen unzuverlässigen Bäche offen.
- source_word: לא
  choice: zu nichts
  rationale: Der überlieferte Konsonantentext lautet wörtlich „nicht“, was nach היה im Deutschen wie im Hebräischen unvollständig wirkt. „Zu nichts“ gibt die im Zusammenhang naheliegende Aussage wieder, dass die Freunde sich als nutzlos erwiesen haben, ohne die Textschwierigkeit in der Fußnote zu verschweigen.
- source_word: תִּרְאוּ
  choice: ihr seht
  rationale: Entspricht der Grundbedeutung von ראה und bezeichnet die Wahrnehmung von Hiobs erschreckendem Zustand beziehungsweise Unglück.
- source_word: חֲתַת
  choice: den Schrecken
  rationale: „Schrecken“ bewahrt sowohl die emotionale Bedeutung als auch den möglichen Bezug auf ein erschütterndes Unheil. Der bestimmte Artikel ist im Deutschen idiomatisch und weist auf das vor Augen stehende Geschehen.
- source_word: וַתִּירָאוּ
  choice: und fürchtet euch
  rationale: Gibt die Reaktion der Freunde knapp und im gegenwärtigen Zusammenhang natürlich wieder.
