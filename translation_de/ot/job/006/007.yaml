id: JOB.6.7
reference: Job 6:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מֵאֲנָ֣ה לִ/נְגּ֣וֹעַ נַפְשִׁ֑/י הֵ֝֗מָּה כִּ/דְוֵ֥י לַחְמִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/007.yaml
  text: My soul refuses to touch them[b][a]; they are like the sickness of my food.
translation:
  language: de
  text: Meine Seele weigert sich, sie anzurühren[a]; sie sind wie die Krankheit meiner Speise[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Mein Appetit weigert sich, sie anzurühren.« Das hebräische Wort nefesch kann »Seele«, »Selbst« oder in manchen Zusammenhängen »Appetit« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: »Sie sind für mich wie widerliche Speise.« Auch möglich: »Sie sind wie die Krankheit meines Brotes/meiner Nahrung.« Der hebräische Ausdruck ist verdichtet und schwer zu deuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֲנָה
  choice: weigert sich
  rationale: Das Verb מאן bezeichnet eine Weigerung oder ein Nichtwilligsein. Das Präsens passt zu Hiobs gegenwärtiger Klage und bewahrt den willentlichen Aspekt.
- source_word: לִנְגּוֹעַ
  choice: anzurühren
  rationale: נגע bedeutet gewöhnlich »berühren«. »Anrühren« drückt hier knapp und natürlich die Abscheu vor jedem Kontakt aus.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נפש kann Seele, Selbst, Leben, Kehle oder Appetit bezeichnen. »Meine Seele« bewahrt die Weite und Bildhaftigkeit des Hebräischen; die kontextuell mögliche Bedeutung »mein Appetit« wird in der Fußnote genannt.
- source_word: הֵמָּה
  choice: sie
  rationale: Das Pronomen verweist auf die zuvor beschriebenen widerwärtigen Dinge zurück. Die deutsche Wiedergabe »sie« erhält diesen Rückbezug.
- source_word: כִּדְוֵי
  choice: wie die Krankheit
  rationale: Die Form gehört zu דוה, »krank sein/Krankheit«. Die ungewöhnliche Konstruktion mit »meiner Speise« bleibt bewusst erhalten, damit die schwierige Metapher nicht vorschnell aufgelöst wird.
- source_word: לַחְמִי
  choice: meiner Speise
  rationale: לחם kann konkret »Brot«, aber auch allgemein »Nahrung/Speise« bedeuten. »Speise« ist im poetischen Register natürlich und lässt die Aussage allgemein.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung »Krankheit meiner Speise« spiegelt bewusst die verdichtete und mehrdeutige hebräische Formulierung; die Fußnote bietet verständlichere Deutungsmöglichkeiten, ohne eine davon zum Haupttext zu machen.
