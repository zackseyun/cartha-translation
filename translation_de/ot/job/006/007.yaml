  source_fidelity: 'Die Übersetzung gibt die hebräische Satzstruktur und die wesentlichen Lexeme angemessen wieder: מֵאֲנָה als gegenwärtige Weigerung, לִנְגּוֹעַ als »anzurühren«, נַפְשִׁי als bewusst weites »meine Seele« und הֵמָּה als rückverweisendes »sie«. Die schwierige Wendung כִּדְוֵי לַחְמִי wird nicht unzulässig harmonisiert, sondern in ihrer befremdlichen Bildlichkeit bewahrt.'
  naturalness: »Meine Seele weigert sich, sie anzurühren« ist in einem würdevoll-poetischen Bibelregister natürlich. »Wie die Krankheit meiner Speise« ist absichtlich ungewöhnlich, aber grammatisch verständlich und für die im Hebräischen verdichtete, umstrittene Konstruktion vertretbar. Die Fußnote bietet eine idiomatischere Deutungsmöglichkeit.
  terminology: »Seele«, »Appetit«, »Speise« und »Nahrung« sind angemessen eingesetzt. Die Fußnoten geben die semantische Spannweite von נפש sowie die Unsicherheit der letzten Wortgruppe sachgerecht wieder, ohne eine Deutung dogmatisch festzulegen. Die Marker sind korrekt gesetzt und stimmen mit den Fußnoten überein.
