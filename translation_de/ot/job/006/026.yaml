  text: הַ/לְ/הוֹכַ֣ח מִלִּ֣ים תַּחְשֹׁ֑בוּ וּ֝/לְ/ר֗וּחַ אִמְרֵ֥י נֹאָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/026.yaml
  text: Do you think to reprove words[a], when the words of a despairing man are for the wind?
translation:
  language: de
  text: Wollt ihr Worte zurechtweisen, während die Worte eines Verzweifelten Wind sind?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wollt ihr Worte zurechtweisen und die Worte eines Verzweifelten wie Wind behandeln?« Der hebräische Satzbau lässt den zweiten Halbvers entweder als Feststellung verstehen (die Worte sind Wind) oder als weiteren Gegenstand der beabsichtigten Zurechtweisung (sie wie Wind behandeln).'
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְהוֹכַח
  choice: zurechtweisen
  rationale: Der Infinitiv von יכח bezeichnet hier ein korrigierendes, tadelndes Entgegentreten. »Zurechtweisen« bewahrt den wertenden und konfrontativen Sinn.
- source_word: מִלִּים
  choice: Worte
  rationale: Die schlichte Wiedergabe wahrt die knappe Formulierung und vermeidet, durch »bloße Worte« eine Geringschätzung ausdrücklich in den Text einzutragen.
- source_word: תַּחְשֹׁבוּ
  choice: wollt ihr
  rationale: חשב kann denken, erwägen oder beabsichtigen bedeuten. Zusammen mit dem Infinitiv gibt »wollt ihr« die auf die Absicht der Freunde zielende rhetorische Frage im Deutschen natürlich wieder.
- source_word: וּלְרוּחַ
  choice: dem Wind gehören
  rationale: Die Formulierung erhält das konkrete Bild des Windes und gibt das ל als Zuordnung wieder, ohne vorschnell zwischen Flüchtigkeit, Leere oder Verwehen zu entscheiden.
- source_word: אִמְרֵי נֹאָשׁ
  choice: die Worte eines Verzweifelten
  rationale: נֹאָשׁ bezeichnet als Partizip einen Menschen, der die Hoffnung verloren hat. Die substantivierte Form »eines Verzweifelten« ist knapp und personbezogen.
theological_decisions:
- issue: Syntaktische Zuordnung des zweiten Halbverses
  choice: 'Der zweite Halbvers wird als Umstand beziehungsweise Feststellung wiedergegeben: Die Worte des Verzweifelten gehören dem Wind.'
  alternative: 'Die ganze Wendung kann als Gegenstand der beabsichtigten Zurechtweisung verstanden werden: »Wollt ihr Worte zurechtweisen und die Worte eines Verzweifelten als Wind behandeln?«'
  rationale: Die hebräische Ellipse und die Funktion von לְ lassen beide Verknüpfungen zu. Der Haupttext bewahrt die traditionelle Feststellungslesart; die Fußnote hält die andere syntaktische Möglichkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe und das Windbild bleiben erhalten; die ungewöhnliche Formulierung »dem Wind gehören« trägt bewusst die Mehrdeutigkeit des Hebräischen.
