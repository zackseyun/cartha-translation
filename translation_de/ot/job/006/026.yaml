    issue: Unidiomatische und missverständliche Formulierung „dem Wind gehören“
    rationale: Die deutsche Wendung gibt die beabsichtigte Windmetapher nicht natürlich wieder und kann fälschlich ausdrücken, die Worte seien Eigentum des Windes. Eine prädikative Wiedergabe ist sprachlich klarer und quellennäher.
