review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von הוכח als „zurechtweisen“, von מילים/אמרי als „Worte“ und von נואש als „eines Verzweifelten“ ist sachgerecht. Die elliptische Zuordnung von וּלְרוּחַ bleibt im Hebräischen umstritten und soll durch die Fußnote weiterhin kenntlich gemacht werden. „Dem Wind gehören“ bildet die Präposition zwar formal nach, vermittelt im Deutschen jedoch nicht zuverlässig das metaphorische Prädikat „Wind sein“ beziehungsweise die alternative Behandlung als Wind.
  naturalness: '„Dem Wind gehören“ ist im modernen Standarddeutsch unidiomatisch und semantisch missverständlich: Es kann Besitzzugehörigkeit statt Flüchtigkeit bzw. Nichtbeachtung nahelegen. „Wind sind“ ist als knappe metaphorische Prädikation verständlich und bewahrt den Duktus des Verses.'
  terminology: „Worte zurechtweisen“ ist für den konfrontativen Kontext angemessen. „Verzweifelter“ gibt das Partizip נואש natürlich wieder, ohne über die Aussage „hoffnungslos“ hinauszugehen.
  issues:
