  text: Did not he who made me in the womb make him[a], and form us in one womb?
translation:
  language: de
  text: Hat nicht der, der mich im Mutterleib gemacht hat, auch ihn gemacht? Hat nicht einer uns im Mutterleib geformt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… und uns in einem Mutterleib geformt?“ Das hebräische אֶחָד („einer/eins“) kann entweder als Subjekt zu „geformt“ oder mit „Mutterleib“ verbunden verstanden werden. Die zweite Deutung beschreibt den gemeinsamen menschlichen Ursprung und besagt nicht notwendigerweise, dass beide dieselbe leibliche Mutter hatten.'
    reason: Syntaktische und lexikalische Alternative bei בָּרֶחֶם אֶחָד.
lexical_decisions:
- source_word: הֲלֹא
  choice: Hat nicht
  rationale: Leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet, und klingt im Deutschen natürlich.
- source_word: בַבֶּטֶן
  choice: im Mutterleib
  rationale: בטן bezeichnet hier den Ort der vorgeburtlichen Bildung; „Mutterleib“ gibt diesen Sinn klar und würdig wieder.
- source_word: עֹשֵׂנִי
  choice: der, der mich … gemacht hat
  rationale: Das Partizip mit Suffix bezeichnet substantivisch denjenigen, der Job gemacht hat; die verbale Formulierung bewahrt den persönlichen Bezug.
- source_word: עָשָׂהוּ
  choice: auch ihn gemacht
  rationale: Das Suffix bezieht sich im unmittelbaren Zusammenhang auf Jobs Knecht beziehungsweise Sklaven. „auch“ verdeutlicht die im Hebräischen angelegte Parallelität, ohne den Referenten auszuschreiben.
- source_word: וַיְכֻנֶנּוּ
  choice: und uns … geformt
  rationale: Die Form bezeichnet hier das gestaltende Hervorbringen im Mutterleib; das Suffix wird kontextgemäß als erste Person Plural verstanden.
- source_word: בָּרֶחֶם אֶחָד
  choice: in einem Mutterleib
  rationale: Die knappe, ungewöhnliche hebräische Wendung wird relativ formal wiedergegeben, damit das Bild des gemeinsamen menschlichen Ursprungs erhalten bleibt; eine alternative syntaktische Deutung wird in der Fußnote genannt.
theological_decisions:
- issue: Bezug von „ihn“ im Zusammenhang sozial Untergeordneter
  choice: „ihn“ bleibt singular und verweist auf den Knecht beziehungsweise Sklaven aus dem unmittelbaren Zusammenhang.
  alternative: Die Aussage kann allgemein auf jeden Mitmenschen bezogen werden.
  rationale: Job 31,13–14 spricht von Jobs männlichem und weiblichem Hauspersonal. Vers 15 begründet ihre gemeinsame Würde in Gottes Schöpfung, ohne diese weiterreichende Folgerung ausdrücklich auszubuchstabieren.
- issue: Deutung von בָּרֶחֶם אֶחָד
  choice: „in einem Mutterleib“ bewahrt die dichterisch verdichtete Aussage vom gemeinsamen Ursprung.
  alternative: „und hat nicht Einer uns im Mutterleib geformt?“
  rationale: אֶחָד kann zur Wendung „in einem Mutterleib“ gehören oder als nachgestelltes „Einer“ auf den einen Schöpfer bezogen werden. Die Hauptfassung folgt der ersten Möglichkeit, während die Fußnote die echte syntaktische Mehrdeutigkeit offenhält. Die Formulierung behauptet nicht, Job und sein Knecht hätten dieselbe leibliche Mutter.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit verständlicher Satzführung. Die rhetorische Frage und die poetische Verdichtung des Hebräischen bleiben erhalten; die ungewöhnliche Wendung wird durch eine Fußnote abgesichert.
