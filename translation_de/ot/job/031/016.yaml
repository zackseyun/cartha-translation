  yaml_path: translation/ot/job/031/016.yaml
  text: If I have withheld the poor from their desire[a], or caused the eyes of the widow to fail[b],
translation:
  language: de
  text: Wenn ich den Armen vorenthalten habe, wonach sie verlangten[a], oder die Augen der Witwe verschmachten ließ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Armen vorenthalten habe, was sie sich wünschten“; dem Zusammenhang nach kann auch gemeint sein: „was sie brauchten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Augen der Witwe schwinden/verschmachten ließ“. Das hebräische Bild bezeichnet langes, enttäuschtes Warten oder hinausgeschobene Hoffnung.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet innerhalb von Hiobs Unschuldsbeteuerung einen Bedingungssatz ein, dessen Folgesatz erst später im Zusammenhang erscheint.
- source_word: אֶמְנַע מֵחֵפֶץ דַּלִּים
  choice: ich den Armen vorenthalten habe, wonach sie verlangten
  rationale: Das Verb מןע bezeichnet das Vorenthalten; חֵפֶץ kann den Wunsch oder das Gewünschte bezeichnen. Die Formulierung gibt die betroffenen Armen als indirektes Objekt natürlich wieder und bewahrt den Sinn des Verlangens, ohne ihn ausdrücklich auf bloße Bedürfnisse einzuengen.
- source_word: דַּלִּים
  choice: den Armen
  rationale: דַּל bezeichnet sozial Schwache, Bedürftige oder Arme; im sozialethischen Zusammenhang ist „die Armen“ die natürliche deutsche Entsprechung.
- source_word: וְ
  choice: oder
  rationale: In der fortlaufenden bedingten Selbstverwünschung verbindet die Konjunktion parallele mögliche Verfehlungen; im Deutschen ist „oder“ in dieser Aufzählung idiomatisch.
- source_word: עֵינֵי אַלְמָנָה אֲכַלֶּה
  choice: die Augen der Witwe vergeblich warten ließ
  rationale: Wörtlich geht es darum, die Augen der Witwe sich verzehren bzw. versagen zu lassen. Das deutsche Idiom macht das enttäuschte, anhaltende Warten verständlich, während die Fußnote das hebräische Bild erhält.
theological_decisions: []
