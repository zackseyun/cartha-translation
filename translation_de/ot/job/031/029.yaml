  text: אִם אֶ֭שְׂמַח בְּ/פִ֣יד מְשַׂנְאִ֑/י וְ֝/הִתְעֹרַ֗רְתִּי כִּֽי מְצָ֥א/וֹ רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/029.yaml
  text: If I rejoiced at the ruin of the one who hates me[d][c][b][a], and exulted when evil found him—
translation:
  language: de
  text: Wenn ich mich über den Untergang dessen freute, der mich hasst,[a] und jubelte, als ihn Unglück traf[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über das Verderben“ oder „über das Unglück dessen, der mich hasst“. Traditionell: „über das Unglück meines Feindes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „als Böses ihn fand“; auch: „als ihn Unheil ereilte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet in Hiobs Unschuldsbeteuerung einen bedingten Satz ein, dessen Folgerung im weiteren Zusammenhang steht.
- source_word: אֶשְׂמַח
  choice: ich mich … freute
  rationale: Gibt שׂמח natürlich wieder und bewahrt das moralische Gewicht der Freude über den Schaden eines anderen.
- source_word: בְּפִיד
  choice: über den Untergang
  rationale: פִיד bezeichnet vernichtendes Unheil, Verderben oder Untergang; „Untergang“ ist hier prägnant und idiomatisch.
- source_word: מְשַׂנְאִי
  choice: dessen …, der mich hasst
  rationale: Bewahrt den verbalen Charakter des Partizips genauer als die verkürzende Wiedergabe „mein Feind“.
- source_word: וְהִתְעֹרַרְתִּי
  choice: und jubelte
  rationale: Die Form von עור beschreibt hier im Parallelismus ein emotionales Sich-Erregen beziehungsweise Frohlocken; „jubelte“ ist verständlich, ohne ausdrücklich das stärkere „schadenfroh sein“ einzutragen.
- source_word: כִּי
  choice: als
  rationale: Kennzeichnet hier am natürlichsten den Zeitpunkt beziehungsweise Umstand des Jubelns.
- source_word: מְצָאוֹ רָע
  choice: ihn Unglück traf
  rationale: מצא kann in diesem Zusammenhang „treffen/ereilen“ bedeuten; רָע bezeichnet hier widerfahrendes Unheil und nicht notwendig moralisch Böses.
theological_decisions:
- issue: Hiobs Haltung gegenüber dem Menschen, der ihn hasst
  choice: Die Freude über dessen Untergang wird verneint, ohne im Haupttext ausdrücklich „Schadenfreude“ zu sagen.
  alternative: „Wenn ich über das Unglück meines Feindes schadenfroh war …“
  rationale: Der Kontext legt verwerfliche Freude am Leid eines Gegners nahe; der hebräische Wortlaut nennt jedoch Freude und emotionales Jubeln, sodass die stärkere Deutung nicht in den Haupttext aufgenommen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt wie im Hebräischen als Bedingungssatz offen und wird durch den folgenden Kontext ergänzt. Die Wiederholung von „Unglück“ wurde im Haupttext vermieden, während die parallele Aussage erhalten bleibt.
