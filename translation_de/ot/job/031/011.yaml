source:
  edition: WLC
  text: כִּי הוא זִמָּ֑ה ו/היא עָוֺ֥ן פְּלִילִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/011.yaml
  text: For that is a disgraceful act[a], and it is an iniquity for the judges.
translation:
  language: de
  text: Denn das wäre eine Schandtat[a], eine Schuld, die vor die Richter gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn das wäre eine Schandtat und eine von Richtern zu ahndende Schuld.«'
    reason: Die hebräische Verbindung עָוֺן פְּלִילִים ist knapp und kann ausdrücklich als gerichtlich zu ahndendes Vergehen verstanden werden.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang von Hiobs Unschuldsbeteuerung die Begründung für die vorherige Aussage ein.
- source_word: הוא
  choice: das wäre
  rationale: Verweist auf den zuvor genannten Ehebruch. Der deutsche Konjunktiv fügt sich natürlich in die vorausgehende bedingte Selbstverwünschung ein.
- source_word: זִמָּה
  choice: eine Schandtat
  rationale: Bezeichnet eine empörende, besonders sexuell verwerfliche Tat; »Schandtat« vermittelt die starke moralische Missbilligung in würdigem, verständlichem Deutsch.
- source_word: ו/היא
  choice: eine
  rationale: Der zweite nominale Satz wird im Deutschen knapp appositionell angeschlossen. Die masoretische Lesetradition וְהִיא setzt die Aussage über die feminine זִמָּה fort.
- source_word: עָוֺן
  choice: Schuld
  rationale: Das Wort kann sowohl schuldhaftes Unrecht als auch die daraus erwachsende Schuld bezeichnen; »Schuld« bewahrt diese ethisch-rechtliche Spannung.
- source_word: פְּלִילִים
  choice: die vor die Richter gehört
  rationale: Die knappe hebräische Rechtsformel bezeichnet eine gerichtlich zu ahndende beziehungsweise zu beurteilende Schuld. Die Wendung ist im modernen Deutsch natürlich, ohne die Art der Sanktion festzulegen.
theological_decisions:
- issue: Rechtlicher Sinn von עָוֺן פְּלִילִים
  choice: eine Schuld, die vor die Richter gehört
  alternative: eine von Richtern zu bestrafende Schuld
  rationale: Die gewählte Fassung erhält den gerichtlichen Bezug, legt aber nicht stärker als der knappe hebräische Ausdruck fest, ob Beurteilung oder konkrete Bestrafung im Vordergrund steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Schandtat« wahrt die starke moralische Wertung; »vor die Richter gehört« gibt den Rechtsbezug idiomatisch wieder. Der Vers bleibt als Begründung mit »Denn« an den vorherigen Kontext gebunden.
