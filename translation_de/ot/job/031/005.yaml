lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet in Hiobs Unschuldsbeteuerung einen bedingten Vordersatz ein, ohne zusätzliche Hervorhebung.
- source_word: הָלַכְתִּי
  choice: meinen Weg gegangen bin
  rationale: Bewahrt das hebräische Bild des Gehens und macht zugleich die idiomatische Bedeutung für die Lebensführung im Deutschen verständlich.
- source_word: עִם
  choice: mit
  rationale: Gibt die Verbindung oder Gemeinschaft mit der Falschheit direkt wieder.
- source_word: שָׁוְא
  choice: Falschheit
  rationale: Das Wort kann Leere, Nichtigkeit oder Falschheit bezeichnen; parallel zu »Betrug« liegt hier der ethische Sinn nahe.
- source_word: וַתַּחַשׁ
  choice: geeilt ist
  rationale: Gibt das Verb »eilen, sich beeilen« wieder und erhält die poetische Personifikation des Fußes.
- source_word: עַל
  choice: zum
  rationale: Bei einer Bewegung kann die Präposition die Richtung auf ein Ziel hin ausdrücken; die Möglichkeit »hinter ... her« bleibt in der Fußnote sichtbar.
- source_word: מִרְמָה
  choice: Betrug
  rationale: Bezeichnet täuschendes oder betrügerisches Handeln und bildet ein passendes Gegenstück zu »Falschheit«.
- source_word: רַגְלִי
  choice: mein Fuß
  rationale: Bewahrt den Singular und das konkrete poetische Bild des hebräischen Textes.
