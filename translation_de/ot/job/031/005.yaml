  text: Wenn ich mit Falschheit einhergegangen bin[a] und mein Fuß zum Betrug geeilt ist[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet wörtlich »gehen«. »Gehen« ist auch ein Bild für die Lebensführung.
    reason: cultural_note
  - marker: b
    text: 'Oder: »und mein Fuß dem Betrug nachgeeilt ist«. Die hebräische Präposition kann hier eine Richtung auf ein Ziel hin ausdrücken.'
