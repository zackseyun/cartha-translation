  yaml_path: translation/ot/job/031/038.yaml
  text: If my land cries out against me[a], and its furrows weep together,
translation:
  language: de
  text: Wenn mein Land gegen mich aufschreit und seine Furchen gemeinsam weinen[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: klagen. Das hebräische Verb ist das gewöhnliche Wort für Weinen oder Klagen und wird hier bildlich von den Furchen gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet im Zusammenhang Hiobs bedingten Unschuldschwur ein und gibt die hebräische Konstruktion schlicht und natürlich wieder.
- source_word: עָלַי
  choice: gegen mich
  rationale: 'Bei זעק hat עַל hier einen gegen den Betroffenen gerichteten, anklagenden Sinn: Das Land tritt gleichsam als Zeuge gegen Hiob auf.'
- source_word: אַדְמָתִי
  choice: mein Land
  rationale: אֲדָמָה bezeichnet hier den landwirtschaftlich genutzten Grund; »mein Land« ist im Deutschen natürlich und bewahrt den Besitzbezug.
- source_word: תִזְעָק
  choice: aufschreit
  rationale: זעק bezeichnet einen eindringlichen Not- oder Protestschrei. »Aufschreit« erhält die starke Personifikation und den anklagenden Ton.
- source_word: וְיַחַד
  choice: und … gemeinsam
  rationale: יַחַד bezeichnet gemeinsames beziehungsweise gleichzeitiges Handeln; »gemeinsam« fügt sich natürlich in den deutschen Satz ein.
- source_word: תְּלָמֶיהָ
  choice: seine Furchen
  rationale: תֶּלֶם ist die beim Pflügen entstehende Furche. Das Possessivpronomen bezieht sich im Deutschen grammatisch auf das maskuline »Land«.
- source_word: יִבְכָּיוּן
  choice: weinen
  rationale: בכה ist das gewöhnliche Verb für »weinen« und setzt die poetische Personifikation des Landes in seinen Furchen fort.
