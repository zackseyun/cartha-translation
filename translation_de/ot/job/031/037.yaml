    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר צְעָדַי
  choice: die Zahl meiner Schritte
  rationale: מִסְפַּר bezeichnet Zahl oder Anzahl; צְעָדַי bedeutet wörtlich „meine Schritte“ und kann zugleich den Lebenswandel anklingen lassen. Die konkrete hebräische Ausdrucksweise bleibt erhalten.
- source_word: אַגִּידֶנּוּ
  choice: würde ich darlegen
  rationale: Der Hifil von נגד bedeutet „mitteilen, kundtun, darlegen“. Das Suffix kann hier am natürlichsten das vorangestellte מִסְפַּר („die Zahl“) wieder aufnehmen; deshalb wird es nicht ausdrücklich als persönliches „ihm“ wiedergegeben.
- source_word: נָגִיד
  choice: Fürst
  rationale: נָגִיד bezeichnet einen führenden, herrschenden oder vornehmen Mann. „Fürst“ bewahrt den gehobenen Rang und den selbstbewussten Ton des Vergleichs, ohne eine bestimmte Amtsform festzulegen.
- source_word: אֲקָרֲבֶנּוּ
  choice: würde ich an ihn herantreten
  rationale: קרב im Piel bezeichnet hier das Sich-Nähern. „An ihn herantreten“ ist natürliches, würdevolles Deutsch und bewahrt das männliche Objektsuffix, ohne dessen Bezug festzulegen.
theological_decisions:
- issue: Bezug des männlichen Suffixes in אֲקָרֲבֶנּוּ
  choice: als „ihn“ wiedergegeben und im Vers nicht näher bestimmt
  alternative: Gott oder Hiobs Ankläger ausdrücklich nennen
  rationale: Im nahen Zusammenhang ist sowohl an Gott als auch an den Ankläger zu denken. Der hebräische Vers nennt den Bezug nicht ausdrücklich; die Übersetzung bewahrt diese Offenheit.
- issue: Funktion des Suffixes in אַגִּידֶנּוּ
  choice: als Wiederaufnahme von „die Zahl meiner Schritte“ verstanden
  alternative: als indirektes persönliches Objekt „ihm“ wiedergeben
  rationale: Das vorangestellte maskuline מִסְפַּר bietet einen unmittelbaren grammatischen Bezug für das Suffix. So wird die hebräische Satzkonstruktion berücksichtigt, ohne den möglichen persönlichen Bezug des zweiten Suffixes auf das erste zu übertragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit forensischem Unterton. Der konkrete Ausdruck „Zahl meiner Schritte“ und die Unbestimmtheit des persönlichen Bezugs bleiben erhalten; „darlegen“ vermeidet zugleich eine unnötig altertümliche Formulierung.
