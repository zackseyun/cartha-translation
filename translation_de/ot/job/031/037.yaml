  text: Die Zahl meiner Schritte würde ich ihm kundtun[a]; wie ein Fürst[c] würde ich an ihn[b] herantreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich würde ihm über meine Schritte vollständig Rechenschaft geben.“'
    reason: lexical_alternative
  - marker: b
    text: „Ihm“ bzw. „ihn“ kann sich im unmittelbaren Zusammenhang auf Gott oder auf Hiobs Ankläger beziehen.
    reason: alternative_reading
  - marker: c
