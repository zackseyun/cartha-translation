  text: Wenn ich meine Hand gegen den Vaterlosen erhoben habe,[a] weil ich sah, dass ich im Tor[b] Unterstützung[c] hatte —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen die Waise“. Das hebräische Wort bezeichnet besonders einen Menschen, der seinen Vater verloren hat und deshalb sozial schutzlos ist.'
    reason: lexical_alternative
  - marker: b
    text: Das „Tor“ ist das Stadttor, an dem die Ältesten Rechtsfälle verhandelten und öffentliche Entscheidungen getroffen wurden.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „meine Hilfe“; gemeint ist hier Unterstützung oder Rückhalt in einem öffentlichen Rechtsverfahren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Leitet die bedingte Selbstverwünschung in Hiob 31 ein; der Nachsatz folgt im nächsten Vers.
- source_word: הֲנִיפוֹתִי עַל ... יָדִי
  choice: meine Hand gegen ... erhoben habe
  rationale: Gibt die feindselige Gebärde natürlich wieder, ohne zwischen Drohung und tatsächlicher Gewalt vorschnell zu entscheiden.
- source_word: יָתוֹם
  choice: der Vaterlose
  rationale: Bezeichnet besonders einen Menschen ohne Vater und betont dessen soziale Schutzlosigkeit; „Waise“ bleibt als geläufige Alternative in der Fußnote.
- source_word: כִּי
  choice: weil
  rationale: Kennzeichnet hier plausibel den Beweggrund des möglichen Unrechts.
- source_word: אֶרְאֶה
  choice: ich sah
  rationale: Bewahrt die Wahrnehmungsaussage des hebräischen Verbs und fügt sich in den Bedingungssatz ein.
- source_word: בַשַּׁעַר
  choice: im Tor
  rationale: Bewahrt das konkrete Bild des Stadttors als Ort öffentlicher Rechtsprechung; der kulturelle Hintergrund wird erläutert.
- source_word: עֶזְרָתִי
  choice: Unterstützung hatte
  rationale: Das wörtliche „meine Hilfe“ meint im Zusammenhang Rückhalt beziehungsweise Beistand im öffentlichen Rechtsverfahren.
