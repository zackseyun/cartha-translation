  text: if my step has turned aside from the way[a], and my heart has gone after my eyes, and any stain has clung to my hands[b],
translation:
  language: de
  text: Wenn mein Schritt vom Weg abgewichen ist, mein Herz meinen Augen gefolgt ist und an meinen Händen irgendein Makel haftet[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „irgendein Fleck“ oder „irgendeine Verunreinigung“. Das hebräische Wort kann einen Fleck, Fehler oder Makel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטֶּה
  choice: abgewichen ist
  rationale: Das Verb נטה bezeichnet hier das Abweichen vom richtigen Weg. Das deutsche Perfekt passt zur bedingten Selbstprüfung im Zusammenhang des Eides.
- source_word: אַשֻּׁרִי
  choice: mein Schritt
  rationale: Das Substantiv bezeichnet Schritt oder Gang. „Mein Schritt“ bewahrt das konkrete Bild für Hiobs Lebensführung.
- source_word: מִנִּי הַדָּרֶךְ
  choice: vom Weg
  rationale: Die knappe Wendung erhält die moralische Wegmetapher des Hebräischen, ohne sie durch eine erklärende Abstraktion aufzulösen.
- source_word: וְאַחַר עֵינַי הָלַךְ לִבִּי
  choice: mein Herz meinen Augen gefolgt ist
  rationale: Die nahe Wiedergabe bewahrt die anschauliche Folge von Sehen und innerem Begehren. Im Deutschen ist „jemandem folgen“ ohne Wiedergabe der hebräischen Präposition natürlich.
- source_word: לִבִּי
  choice: mein Herz
  rationale: „Herz“ bewahrt die biblische Rede vom inneren Zentrum des Wollens und Begehrens und verengt sie nicht auf Verstand oder Gefühl.
- source_word: וּבְכַפַּי דָּבַק
  choice: an meinen Händen … haftet
  rationale: דבק bedeutet „haften, kleben“. „An meinen Händen haften“ gibt das Bild einer Verunreinigung beziehungsweise Schuld an den Taten natürlich wieder; כַּף wird hier idiomatisch mit „Hand“ wiedergegeben.
- source_word: מֻאוּם
  choice: irgendein Makel
  rationale: Das seltene Wort kann einen Fleck, Fehler oder Makel bezeichnen. „Makel“ lässt sowohl die konkrete als auch die ethisch übertragene Bedeutung offen.
theological_decisions:
- issue: Moralische Metapher des Weges
  choice: Die Wendung „vom Weg“ bleibt als konkretes Bild stehen.
  alternative: „vom rechten Verhalten“ oder „vom richtigen Weg“
  rationale: Der hebräische Text qualifiziert den Weg nicht ausdrücklich. Die unverstärkte Metapher bewahrt seine Offenheit und vermeidet eine erklärende Ergänzung.
- issue: Anthropologische Sprache von Herz und Augen
  choice: „Herz“ und „Augen“ werden wörtlich beibehalten.
  alternative: „mein Verlangen dem gefolgt ist, was ich sah“
  rationale: Die hebräische Formulierung schildert anschaulich, wie das innere Wollen dem Sehen folgt. Eine psychologisierende Paraphrase würde die literarische und theologische Spannung abschwächen.
- issue: Bedingung innerhalb der Selbstverwünschung
  choice: Der Vers beginnt mit „Wenn“ und endet offen mit einem Komma.
  alternative: „Sollte …“ als eigenständige hypothetische Formulierung
  rationale: אִם leitet den Bedingungssatz ein, dessen Folgesatz erst im nächsten Vers steht. Die offene Interpunktion macht diesen syntaktischen Zusammenhang sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Wahrung der hebräischen Bildsprache. Die koordinierte Satzstruktur bleibt knapp; das abschließende Komma zeigt an, dass der Bedingungssatz in Vers 8 fortgeführt wird.
