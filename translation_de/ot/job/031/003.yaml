source:
  edition: WLC
  text: הֲ/לֹא אֵ֥יד לְ/עַוָּ֑ל וְ֝/נֵ֗כֶר לְ/פֹ֣עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/003.yaml
  text: Is not disaster for the unrighteous[b][a], and calamity for the workers of iniquity?
translation:
  language: de
  text: Ist nicht Verderben für den Ungerechten[a] und Unheil für die, die Böses tun[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den Unredlichen“ beziehungsweise „für den, der Unrecht tut“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „für die Täter des Unrechts“; das letzte Wort kann auch „Unrecht“, „Bosheit“ oder „Verderbliches“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Ist nicht
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet.
- source_word: אֵיד
  choice: Verderben
  rationale: Bezeichnet zerstörerisches Unheil oder den Untergang; „Verderben“ gibt die Schwere des Ausdrucks in gehobener, verständlicher Sprache wieder.
- source_word: לְעַוָּל
  choice: für den Ungerechten
  rationale: Das substantivierte Wort bezeichnet einen Menschen, der durch Unrecht gekennzeichnet ist; der Singular des Hebräischen bleibt erhalten.
- source_word: וְנֵכֶר
  choice: und Unheil
  rationale: Im Parallelismus bezeichnet das seltene Wort ein verhängnisvolles Geschick. „Unheil“ wahrt die Nähe zu אֵיד, ohne beide Glieder gleichlautend wiederzugeben.
- source_word: לְפֹעֲלֵי
  choice: für die, die … tun
  rationale: Gibt die partizipiale Bezeichnung natürlicher als das im heutigen Deutsch schwerfällige „Täter von“ wieder und kann eine kennzeichnende Praxis ausdrücken.
- source_word: אָוֶן
  choice: Böses
  rationale: Bezeichnet hier moralisch schuldhaftes Unrecht; „Böses tun“ ist klar, idiomatisch und bewahrt das ethische Gewicht.
theological_decisions:
- issue: Moralische Ordnung und Gericht im Weisheitstext
  choice: Die Aussage bleibt als rhetorische Frage über das den Ungerechten bestimmte Verderben formuliert, ohne dessen Ursache näher zu bestimmen.
  alternative: Die Folgen ausdrücklich als unmittelbare Strafe Gottes oder lediglich als natürliche Konsequenzen bezeichnen.
  rationale: Der hebräische Vers stellt Unheil und Übeltäter einander zu, erklärt aber hier nicht ausdrücklich, auf welche Weise das Gericht eintritt. Diese Spannung bleibt gewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Parallelismus. „Verderben“ und „Unheil“ unterscheiden die beiden annähernd synonymen Glieder; der zweite Halbvers wird für heutige Leser idiomatisch als Relativsatz formuliert.
