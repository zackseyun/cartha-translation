base_translation:
  language: en
  yaml_path: translation/ot/job/031/027.yaml
  text: and my heart was secretly enticed[a], and my hand kissed my mouth—
translation:
  language: de
  text: und mein Herz sich heimlich verführen ließ und meine Hand meinem Mund einen Kuss zuwarf[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wahrscheinlich ist eine Huldigungsgeste gemeint: Man küsste die Hand beziehungsweise warf mit ihr einen Kuss zu. Im Zusammenhang bezieht sich dies vermutlich auf die Verehrung der Himmelskörper.'
    reason: Die Fußnote erläutert die kulturell bedingte Hand-Mund-Geste und ihre wahrscheinliche Funktion im Kontext, ohne diese Deutung dem Haupttext hinzuzufügen.
lexical_decisions:
- source_word: וַיִּפְתְּ
  choice: sich verführen ließ
  rationale: Die Form von פתה beschreibt hier, dass das Innere sich locken oder verführen ließ. Die reflexive deutsche Wendung gibt diese innere Verführung natürlich wieder, ohne eine ausdrücklich genannte handelnde Person hinzuzufügen.
- source_word: בַּסֵּתֶר
  choice: heimlich
  rationale: סתר bezeichnet Verborgenheit oder Heimlichkeit. Die adverbiale Wiedergabe ist im Deutschen natürlich und wahrt den verdeckten Charakter des Vorgangs.
- source_word: לִבִּי
  choice: mein Herz
  rationale: Das Herz bezeichnet hier die innere Person, besonders Denken, Wollen und Neigung; die konkrete Bildsprache bleibt erhalten.
- source_word: וַתִּשַּׁק
  choice: küsste
  rationale: נשק bedeutet gewöhnlich „küssen“. Die konkrete Handlung bleibt im Haupttext stehen; ihre wahrscheinlich kultische Bedeutung wird in der Fußnote erläutert.
- source_word: יָדִי
  choice: meine Hand
  rationale: Die Hand wird entsprechend dem hebräischen Wortlaut als Trägerin der Geste genannt.
- source_word: לְפִי
  choice: meinen Mund
  rationale: Wörtlich steht „zu meinem Mund“. Nach „küssen“ verlangt natürliches Deutsch den Akkusativ; die ungewöhnliche Geste wird nicht ausdeutend umformuliert.
theological_decisions:
- issue: Mögliche Geste der Verehrung von Sonne oder Mond
  choice: Die konkrete körperliche Handlung bleibt im Haupttext erhalten, ohne sie ausdrücklich als Götzendienst zu bezeichnen.
  alternative: und ich warf ihnen mit der Hand einen Kuss zu
  rationale: Der Zusammenhang in den Versen 26–28 weist auf eine Huldigungsgeste gegenüber den Himmelskörpern. Der Vers selbst benennt jedoch nur die Geste. Daher wird die kultische Deutung nicht in den Haupttext eingefügt, sondern in einer Fußnote erklärt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Fortsetzung des vorangehenden Bedingungssatzes mit „und“ sowie mit Gedankenstrich am Ende offen. Die leicht fremdartige konkrete Bildsprache der Hand, die den Mund küsst, wird bewusst bewahrt und durch die Fußnote erschlossen.
