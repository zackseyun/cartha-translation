  language: de
  text: Wenn mein Herz sich zu einer Frau hinreißen ließ[a] und ich an der Tür meines Nächsten[b] auf der Lauer lag,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich betören ließ“ oder „sich verführen ließ“. Das hebräische Verb kann Verlockung, Verführung oder Überredung bezeichnen; hier steht es im Zusammenhang sexueller Versuchung.'
    reason: lexical_alternative
  - marker: b
