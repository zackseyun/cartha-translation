lexical_decisions:
- source_word: נִפְתָּה
  choice: hat verführen lassen
  rationale: Das Niphal von פתה kann Verlockung, Verführung oder Überredung ausdrücken. Zusammen mit „mein Herz“ gibt die reflexive Formulierung die innere Versuchung natürlich wieder, ohne die Frau ausdrücklich als handelnde Verführerin festzulegen.
- source_word: לִבִּי
  choice: mein Herz
  rationale: „Herz“ bewahrt das hebräische Bild für das innere Wollen, Begehren und Denken.
- source_word: עַל אִשָּׁה
  choice: zu einer Frau
  rationale: Die Präposition עַל bezeichnet hier die Ausrichtung beziehungsweise den Anlass der Verlockung. „Zu einer Frau“ bewahrt diese Ausrichtung und vermeidet, der Frau eindeutig die aktive Rolle der Verführerin zuzuschreiben.
- source_word: פֶּתַח
  choice: an der Tür
  rationale: „Tür“ ist im Deutschen die knappe, natürliche Entsprechung und bezeichnet hier den Zugang zum Haus.
- source_word: רֵעִי
  choice: meines Nächsten
  rationale: רֵעַ kann einen Nächsten, Freund oder Gefährten bezeichnen. „Nächster“ passt zum sozial-ethischen Zusammenhang und wahrt zugleich die mögliche weitere Bedeutung.
- source_word: אָרָבְתִּי
  choice: auf der Lauer lag
  rationale: ארב bezeichnet heimliches Lauern mit einer unlauteren oder feindlichen Absicht. Die deutsche Wendung erhält den vorsätzlichen und verborgenen Charakter.
theological_decisions:
- issue: Moralische Zuspitzung von Hiobs Eid im Blick auf Ehebruch
  choice: Der Vers beschreibt zuerst die innere Hinwendung des Herzens und danach das heimliche, vorsätzliche Lauern an der Tür des Nächsten.
  alternative: Die Aussage ausdrücklich als versuchten Ehebruch ausformulieren oder lediglich als romantische Zuneigung abschwächen.
  rationale: Der hebräische Text verbindet innere Verlockung mit heimlichem Handeln, nennt den Ehebruch hier aber nicht ausdrücklich. Die Übersetzung bewahrt diese Spannung, ohne sie abzuschwächen oder über den Wortlaut hinaus zu präzisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konditionale Form schließt unmittelbar an den folgenden Selbstverwünschungssatz an. „Auf der Lauer liegen“ gibt die Heimlichkeit und Absichtsstärke des hebräischen Verbs idiomatisch wieder.
