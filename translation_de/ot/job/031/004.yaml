  text: הֲ/לֹא ה֭וּא יִרְאֶ֣ה דְרָכָ֑/י וְֽ/כָל צְעָדַ֥/י יִסְפּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/004.yaml
  text: Does he not see my ways and count all my steps?[a]
translation:
  language: de
  text: Sieht er nicht meine Wege und zählt alle meine Schritte?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beobachtet er nicht meinen Lebenswandel und zählt jeden meiner Schritte?“'
    reason: 'Lexikalische Alternative: „Wege“ kann den Lebenswandel bezeichnen; ראה kann kontextuell „beobachten“ bedeuten.'
lexical_decisions:
- source_word: הֲלֹא
  choice: nicht …?
  rationale: Die Partikel leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet; im Deutschen wird dies natürlich durch die Verneinung im Fragesatz wiedergegeben.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen bezeichnet im Zusammenhang Gott und trägt leichte Betonung; „er“ bewahrt dies, ohne mit „er selbst“ überzubetonen.
- source_word: יִרְאֶה
  choice: sieht
  rationale: ראה bedeutet gewöhnlich „sehen“. Die konkrete Bildsprache göttlicher Wahrnehmung bleibt so ohne abstrakte Ausdeutung erhalten.
- source_word: דְרָכָי
  choice: meine Wege
  rationale: „Wege“ erhält den Plural und die hebräische Metapher, die sowohl den Lebensweg als auch das Verhalten umfassen kann.
- source_word: וְכָל
  choice: und alle
  rationale: Die Verbindung und der umfassende Sinn werden direkt und idiomatisch wiedergegeben.
- source_word: צְעָדַי
  choice: meine Schritte
  rationale: „Schritte“ ist eine natürliche Entsprechung und bewahrt das Bild einzelner Bewegungen beziehungsweise Handlungen.
- source_word: יִסְפּוֹר
  choice: zählt
  rationale: ספר bedeutet hier „zählen/abzählen“. „Zählt“ ist prägnant und erhält die konkrete Bildsprache.
theological_decisions:
- issue: Göttliches Wissen in anthropomorpher Bildsprache
  choice: Die rhetorische Frage bekräftigt, dass Gott Hiobs Wege sieht und alle seine Schritte zählt.
  alternative: Beobachtet er nicht mein Verhalten und führt über alle meine Taten Buch?
  rationale: Der hebräische Text spricht konkret vom Sehen und Zählen. Diese Bilder werden bewahrt, ohne sie zu einer abstrakten Lehraussage über Gottes Allwissenheit auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe rhetorische Frage und die parallele Bildsprache des Hebräischen bleiben erhalten.
