  text: יִשְׁקְלֵ֥/נִי בְ/מֹאזְנֵי צֶ֑דֶק וְ/יֵדַ֥ע אֱ֝ל֗וֹהַּ תֻּמָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/006.yaml
  text: Let him weigh me in righteous scales[b][a], and let God know my integrity.
translation:
  language: de
  text: Man wiege mich auf einer gerechten Waage[a], und Gott erkenne meine Lauterkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit Waagen der Gerechtigkeit“; auch: „mit gerechten Waagen“ oder „auf einer zuverlässigen Waage“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Unbescholtenheit“ oder „meine Unschuld“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁקְלֵנִי
  choice: Er wiege mich
  rationale: Der Qal-Imperfekt mit Suffix der 1. Person Singular hat hier im Zusammenhang auffordernden bzw. jussivischen Sinn. Der deutsche Konjunktiv I bewahrt Hiobs Einladung zur Prüfung und das Bild des Wiegens.
- source_word: בְמֹאזְנֵי צֶדֶק
  choice: auf einer gerechten Waage
  rationale: מֹאזְנַיִם bezeichnet eine Waage beziehungsweise ein Waagepaar; צֶדֶק trägt hier den Gedanken gerechter, zuverlässiger Beurteilung. „Auf einer gerechten Waage“ ist im Deutschen natürlich und erhält zugleich die forensische Metapher.
- source_word: וְיֵדַע
  choice: und … erkenne
  rationale: 'Das mit וְ verbundene Imperfekt kann den jussivischen Sinn des ersten Verbs fortführen. „Erkenne“ gibt außerdem mehr als bloße Kenntnis wieder: Gott soll Hiobs Lauterkeit bei der Prüfung feststellen und anerkennen.'
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Die poetische Singularform bezeichnet Gott; eine Erweiterung wie „der Allmächtige“ ist in diesem Vers nicht begründet.
- source_word: תֻּמָּתִי
  choice: meine Lauterkeit
  rationale: תֻּמָּה bezeichnet Integrität, Unbescholtenheit oder Ganzheit. „Lauterkeit“ bewahrt Hiobs Anspruch auf moralische Redlichkeit, ohne notwendig absolute Sündlosigkeit auszudrücken.
theological_decisions:
- issue: Tragweite von Hiobs Selbstaussage
  choice: meine Lauterkeit
  alternative: meine Unschuld / meine Unbescholtenheit
  rationale: Hiob verlangt eine gerechte göttliche Prüfung. „Lauterkeit“ hält den Anspruch auf Rechtschaffenheit fest, ohne die Spannung vorschnell als Behauptung absoluter Sündlosigkeit aufzulösen.
- issue: Sinn von Gottes „Erkennen“
  choice: Gott erkenne
  alternative: Gott erfahre / dann wird Gott wissen
  rationale: Das Hebräische kann die Aufforderung des ersten Halbverses fortsetzen. „Erkenne“ lässt offen, ob der Schwerpunkt auf Feststellung, Kenntnis oder Anerkennung liegt, statt den Satz ausschließlich als Zukunftsfolge zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konjunktiv I („wiege“, „erkenne“) gibt die jussivische Aufforderung knapp wieder. „Lauterkeit“ ist gehoben, aber allgemein verständlich und passt zum poetisch-forensischen Ton des Buches Hiob.
