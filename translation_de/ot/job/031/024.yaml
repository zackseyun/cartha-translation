id: JOB.31.24
reference: Job 31:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם שַׂ֣מְתִּי זָהָ֣ב כִּסְלִ֑/י וְ֝/לַ/כֶּ֗תֶם אָמַ֥רְתִּי מִבְטַחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/024.yaml
  text: If I have made gold my confidence[a], and said to fine gold[c][b], ‘You are my security,’
translation:
  language: de
  text: 'Wenn ich Gold zu meiner Zuversicht gemacht und zum Feingold gesagt habe: »Du bist meine Sicherheit«[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du bist mein Vertrauen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet im Zusammenhang von Hiobs Unschuldsbeteuerung den Bedingungssatz ein.
- source_word: שַׂמְתִּי
  choice: ich ... zu ... gemacht habe
  rationale: Gibt die resultative Bedeutung von שׂים mit Objekt und Prädikativ im Deutschen natürlich wieder.
- source_word: זָהָב
  choice: Gold
  rationale: Direkte und eindeutige Wiedergabe.
- source_word: כִּסְלִי
  choice: meiner Zuversicht
  rationale: כֶּסֶל kann Zuversicht, Hoffnung oder Vertrauen bezeichnen; »Zuversicht« passt zur hier verneinten Abhängigkeit vom Reichtum und wahrt die Abwechslung gegenüber מִבְטַחִי.
- source_word: וְלַכֶּתֶם
  choice: und zum Feingold
  rationale: כֶּתֶם bezeichnet reines bzw. geläutertes Gold; »Feingold« ist eine natürliche deutsche Entsprechung und unterscheidet den Ausdruck von זָהָב.
- source_word: אָמַרְתִּי
  choice: gesagt habe
  rationale: Das deutsche Perfekt bindet das zweite Verb klar in denselben konditionalen Rückblick ein.
- source_word: מִבְטַחִי
  choice: meine Sicherheit
  rationale: מִבְטָח bezeichnet Sicherheit beziehungsweise das, worauf man vertraut; die Wiedergabe erhält die Bedeutungsnähe, ohne כִּסְלִי und מִבְטַחִי gleichlautend zu übersetzen.
theological_decisions:
- issue: Hiobs Verneinung des Vertrauens auf Reichtum
  choice: 'Als Bedingung innerhalb seiner Unschuldsbeteuerung formuliert: »Wenn ich Gold zu meiner Zuversicht gemacht ... habe«'
  alternative: »Wenn ich meine Hoffnung auf Gold gesetzt habe«
  rationale: Die Formulierung bewahrt die offene Wenn-Struktur des hebräischen Eides und macht deutlich, dass Hiob bestreitet, Reichtum zum Gegenstand seines Vertrauens gemacht zu haben, ohne spätere Lehrbegriffe einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Feingold« erhält die lexikalische Unterscheidung zwischen זָהָב und כֶּתֶם. Nur die für מִבְטַחִי sachlich hilfreiche Alternative wird als Fußnote aufgenommen; »Zuversicht« lässt die Bedeutungsbreite von כִּסְלִי im Haupttext natürlich erkennen.
