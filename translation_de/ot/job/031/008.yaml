    issue: Die Übersetzung „ausgerottet werden“ tilgt das Wurzelbild des hebräischen Verbs.
    rationale: יְשֹׁרָשׁוּ bezeichnet das Ausreißen bzw. Beseitigen mitsamt der Wurzel. Die Bildlichkeit ist hier besonders wichtig, weil sie die agrarische Lesart von צֶאֱצָאַי stützt, ohne die mögliche Anspielung auf Nachkommen auszuschließen.
  - severity: low
    issue: „Was aus mir hervorgeht“ ist eine unnatürlich abstrakte Umschreibung.
    rationale: Die Formulierung erhält zwar die Mehrdeutigkeit, klingt aber nicht idiomatisch und schwächt die konkrete Pflanzenbildlichkeit. „Meine Sprossen“ ist knapper und kontextuell anschaulicher.
