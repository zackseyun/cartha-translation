  text: then let me sow and another eat[a], and let my offspring be uprooted.
translation:
  language: de
  text: Dann soll ich säen, und ein anderer soll davon essen; und meine Sprossen sollen mit der Wurzel ausgerissen werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Nachkommen sollen mit der Wurzel ausgerissen werden“; möglich ist auch: „mein Ertrag soll mit der Wurzel ausgerissen werden“. Das hebräische Wort kann sowohl Nachkommen als auch das Hervorgebrachte, etwa Ertrag oder Sprossen, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְרְעָה
  choice: soll ich säen
  rationale: Der Kohortativ steht im Zusammenhang des selbstauferlegten Fluchs. Die Formulierung mit „soll“ gibt diesen Wunsch- bzw. Fluchcharakter im Deutschen natürlich wieder.
- source_word: וְאַחֵר יֹאכֵל
  choice: und ein anderer davon essen
  rationale: „Ein anderer“ bewahrt den Gegensatz zwischen dem Säenden und dem Nutznießer; „essen“ erhält das konkrete landwirtschaftliche Bild. Das ergänzte „davon“ macht den Bezug zur Aussaat im Deutschen deutlich.
- source_word: וְצֶאֱצָאַי
  choice: und was aus mir hervorgeht
  rationale: צֶאֱצָא bezeichnet etwas Hervorgehendes und kann sowohl Nachkommen als auch Ertrag meinen. Die bewusst offene Formulierung bewahrt diese im Hebräischen vorhandene Mehrdeutigkeit.
- source_word: יְשֹׁרָשׁוּ
  choice: soll ausgerottet werden
  rationale: Das Piel von שׁרשׁ bezeichnet hier das Herausreißen mit der Wurzel. „Ausgerottet werden“ bewahrt das Wurzelbild und lässt sich sowohl auf Nachkommen als auch auf Gewächs bzw. Ertrag beziehen.
theological_decisions:
- issue: Bezug von צֶאֱצָאַי im Selbstfluch
  choice: Die Hauptübersetzung lässt offen, ob Nachkommen oder Ertrag gemeint sind.
  alternative: „meine Nachkommen“ beziehungsweise „mein Ertrag“
  rationale: Die lexikalische und bildhafte Spannung zwischen familiärer und landwirtschaftlicher Vernichtung gehört zum hebräischen Text und sollte nicht zugunsten nur einer Auslegung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Fluchcharakter wird durch zweimaliges „soll“ wiedergegeben; die ungewöhnliche offene Wendung „was aus mir hervorgeht“ dient der Erhaltung der echten hebräischen Mehrdeutigkeit.
