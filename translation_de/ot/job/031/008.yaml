  verdict: revise
  source_fidelity: Der Selbstfluch und die Abfolge von Säen, Genuss durch einen anderen und Verlust dessen, was aus Job hervorgeht, sind getroffen. „Ausgerottet“ gibt jedoch die im Verb יְשֹׁרָשׁוּ ausdrücklich enthaltene Wurzelmetaphorik nicht wieder. Außerdem ist „was aus mir hervorgeht“ zwar als Auslegung der Mehrdeutigkeit verständlich, aber im Vers zu umschreibend.
  naturalness: „Dann soll ich säen und ein anderer davon essen“ ist natürlich. Die Wendung „was aus mir hervorgeht“ wirkt in modernem Deutsch abstrakt und stilistisch schwerfällig. „Sprossen“ ist im landwirtschaftlichen Kontext konkret und kann zugleich die offene Beziehung zu Nachkommenschaft anklingen lassen.
  terminology: „Sprossen“ bewahrt die lexikalische Offenheit von צֶאֱצָאַי besser als die ausschließlich menschliche Deutung „Nachkommen“ und ist mit dem folgenden Bild des Ausreißens mit der Wurzel stimmig. „Mit der Wurzel ausgerissen“ gibt שׁרשׁ präziser wieder als „ausgerottet“.
  issues:
