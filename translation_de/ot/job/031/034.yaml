source:
  edition: WLC
  text: כִּ֤י אֶֽעֱר֨וֹץ הָ֘מ֤וֹן רַבָּ֗ה וּ/בוּז מִשְׁפָּח֥וֹת יְחִתֵּ֑/נִי וָ֝/אֶדֹּ֗ם לֹא אֵ֥צֵא פָֽתַח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/034.yaml
  text: because I feared the great multitude[a], and the contempt of clans terrified me[b], so that I kept silent and did not go out the door—
translation:
  language: de
  text: weil ich mich vor der großen Menge fürchtete[a] und die Verachtung der Sippen mich erschreckte, sodass ich schwieg und nicht vor die Tür ging —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Satz gehört zu Hiobs Unschuldsbeteuerung und ist im Hebräischen elliptisch. Dem Sinn nach beschreibt er den hypothetischen Fall: wenn Job aus Furcht vor der öffentlichen Meinung geschwiegen hätte und im Haus geblieben wäre.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion führt hier im elliptischen Zusammenhang von Hiobs Unschuldsbeteuerung den angenommenen Beweggrund seines Schweigens ein. „Weil“ bewahrt den unmittelbaren Satzanschluss; der bedingte Sinn des größeren Zusammenhangs wird in einer Fußnote erläutert.
- source_word: אֶעֱרוֹץ
  choice: ich mich ... fürchtete
  rationale: ערץ bezeichnet starke Furcht oder Scheu. „Sich fürchten vor“ ist natürliches modernes Deutsch und erhält die emotionale Stärke, ohne sie zu überzeichnen.
- source_word: הָמוֹן רַבָּה
  choice: die große Menge
  rationale: הָמוֹן bezeichnet eine Menschenmenge, רַבָּה deren Größe beziehungsweise Vielzahl. Die Wiedergabe ist zugleich genau, verständlich und würdevoll.
- source_word: וּבוּז מִשְׁפָּחוֹת
  choice: und die Verachtung der Sippen
  rationale: בּוּז bedeutet Verachtung oder Hohn. מִשְׁפָּחוֹת bezeichnet hier eher größere Verwandtschaftsgruppen als moderne Kleinfamilien; „Sippen“ bildet diesen gesellschaftlichen Sinn knapp ab.
- source_word: יְחִתֵּנִי
  choice: mich erschreckte
  rationale: Der Hifil von חתת bezeichnet das Einjagen von Furcht beziehungsweise das Entmutigen. „Erschreckte“ gibt die kausative Wirkung wieder und vermeidet eine unnötige Steigerung gegenüber אֶעֱרוֹץ.
- source_word: וָאֶדֹּם
  choice: sodass ich schwieg
  rationale: 'דמם bedeutet schweigen oder still sein. Das Waw lässt sich im Zusammenhang folgernd verstehen: Der gesellschaftliche Druck hätte zum Schweigen geführt.'
- source_word: לֹא אֵצֵא פָתַח
  choice: und nicht vor die Tür ging
  rationale: Die Wendung beschreibt, dass Job aus Furcht nicht hinausging. „Vor die Tür gehen“ ist im Deutschen idiomatisch und bewahrt das Bild des Zurückbleibens im Haus.
theological_decisions:
- issue: Elliptischer Bedingungs- beziehungsweise Schwurzusammenhang
  choice: Der Haupttext folgt mit „weil“ der unmittelbaren kausalen Formulierung des Verses; eine Fußnote macht deutlich, dass die Aussage innerhalb von Hiobs Unschuldsschwur hypothetisch zu verstehen ist.
  alternative: Den Vers ausdrücklich mit „wenn“ beginnen und damit die Bedingung im Haupttext ergänzen.
  rationale: Das Hebräische ist syntaktisch knapp und steht in einer Reihe von Selbstverwünschungs- und Unschuldsformulierungen. Die gewählte Lösung bewahrt sowohl den lokalen Wortlaut als auch durch die Anmerkung den größeren argumentativen Zusammenhang, ohne die Spannung vorschnell aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller poetischer Färbung. „Sippen“ vermeidet den zu engen modernen Sinn von „Familien“. Der Gedankenstrich bleibt erhalten, weil der Satz in den folgenden Vers beziehungsweise in die fortlaufende Schwurformel hinein offen wirkt.
