  yaml_path: translation/ot/job/031/012.yaml
  text: For it is a fire that consumes to destruction[a], and it would root out all my produce.
translation:
  language: de
  text: Denn sie ist ein Feuer, das bis zur Vernichtung[a] verzehrt und alles, was mir Ertrag bringt, bis auf die Wurzel ausreißen würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis Abaddon«. Das hebräische Wort אֲבַדּוֹן kann »Vernichtung« bedeuten, in manchen Zusammenhängen aber auch den Bereich oder die Personifikation des Verderbens bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Warnung in Hiobs Unschuldsbeteuerung ein.
- source_word: אֵשׁ הִיא
  choice: sie ist ein Feuer
  rationale: Bewahrt das prädikative Bild und gibt das feminine Pronomen, das sich inhaltlich auf die zuvor behandelte Verfehlung bezieht, natürlich wieder.
- source_word: עַד אֲבַדּוֹן
  choice: bis zur Vernichtung
  rationale: Gibt die Reichweite beziehungsweise das äußerste Ziel des verzehrenden Feuers wieder; die mögliche Deutung als Eigenname bleibt in der Fußnote erhalten.
- source_word: תֹּאכֵל
  choice: verzehrt
  rationale: Entspricht dem Verb »essen/verzehren« und passt idiomatisch zum Feuerbild.
- source_word: וּבְכָל תְּבוּאָתִי
  choice: und meinen ganzen Ertrag
  rationale: Gibt die umfassende zerstörerische Wirkung auf Hiobs gesamten Zugewinn beziehungsweise Ertrag wieder, ohne die schwer wörtlich abzubildende Präposition künstlich nachzuahmen.
- source_word: תְשָׁרֵשׁ
  choice: entwurzeln würde
  rationale: Der Piel-Stamm bezeichnet hier das Ausreißen mit der Wurzel; der Konjunktiv wahrt den aus dem Kontext fortwirkenden Bedingungs- beziehungsweise Schwurcharakter.
theological_decisions:
- issue: Bedeutung von אֲבַדּוֹן
  choice: Gattungsbegriff »Vernichtung«
  alternative: Eigenname »Abaddon« beziehungsweise Bezeichnung des Totenreichs
  rationale: Im Zusammenhang bezeichnet der Ausdruck am ehesten das Ausmaß der Vernichtung. Da das hebräische Wort andernorts auch Abaddon als Bereich oder Personifikation des Verderbens bezeichnen kann, wird diese Möglichkeit nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das kräftige Feuer- und Wurzelbild des Hebräischen bleibt erhalten; die Mehrdeutigkeit von אֲבַדּוֹן wird durch eine Fußnote kenntlich gemacht.
