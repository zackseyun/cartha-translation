  text: אִם אֶ֭שְׂמַח כִּי רַ֣ב חֵילִ֑/י וְ/כִֽי כַ֝בִּ֗יר מָצְאָ֥ה יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/025.yaml
  text: if I rejoiced because my wealth was abundant[a], and because my hand had gained much—
translation:
  language: de
  text: wenn ich mich freute, weil mein Vermögen groß war und weil meine Hand viel erworben hatte[a] –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „weil meine Hand Großes gefunden hatte“. Gemeint ist, was jemand durch eigene Kraft oder eigenes Tun erlangt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Leitet im Zusammenhang von Hiobs Unschuldsbeteuerung den Bedingungssatz eines Selbstverwünschungseides ein; im Deutschen ist „wenn“ hier natürlicher als „falls“.
- source_word: אֶשְׂמַח
  choice: ich mich freute
  rationale: Gibt die Freude beziehungsweise das innere Gefallen wieder, das Hiob bestreitet, am Reichtum gehabt zu haben.
- source_word: כִּי
  choice: weil
  rationale: Bezeichnet in beiden parallelen Satzteilen den Grund der Freude.
- source_word: רַב חֵילִי
  choice: mein Vermögen groß war
  rationale: חַיִל bezeichnet hier materiellen Besitz oder Reichtum; „Vermögen“ ist im modernen Deutsch klar und bewahrt mit „groß“ die einfache Größenangabe von רַב.
- source_word: כַבִּיר מָצְאָה יָדִי
  choice: meine Hand viel erlangt hatte
  rationale: Bewahrt das hebräische Bild der eigenen Hand und gibt מָצָא in diesem Zusammenhang idiomatisch als Erlangen beziehungsweise Erwerben wieder; כַבִּיר bezeichnet den großen Umfang dessen, was erlangt wurde.
theological_decisions:
- issue: Ob der Vers Reichtum an sich verurteilt oder die darauf gegründete Freude und das Bewusstsein eigener Leistung
  choice: Hiob bestreitet, sich wegen seines großen Vermögens und wegen dessen gefreut zu haben, was seine eigene Hand erlangt hatte.
  alternative: Eine freiere Wiedergabe könnte so verstanden werden, als sei bereits der Besitz großen Reichtums verwerflich.
  rationale: Der hebräische Text richtet den Akzent durch אֶשְׂמַח und die beiden mit כִּי eingeleiteten Begründungen auf die Freude am Reichtum und an dem von der eigenen Hand Erlangten, nicht auf Besitz als solchen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „weil“ und das Bild der „Hand“ bleiben zur Wahrung der hebräischen Parallelstruktur und der Betonung persönlicher Leistung erhalten. Der Gedankenstrich zeigt an, dass der Bedingungssatz im folgenden Zusammenhang weitergeführt wird.
