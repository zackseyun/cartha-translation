  text: if the men of my tent have not said[b][a], ‘Who is there that has not been filled with his flesh?’
translation:
  language: de
  text: 'Wenn die Männer meines Zeltes[a] nicht gesagt haben: »Wer ist nicht von seinem Fleisch[b] satt geworden?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Männer meines Haushalts«. Das »Zelt« kann für die Hausgemeinschaft oder den häuslichen Kreis stehen.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische sagt »von seinem Fleisch«. Gemeint ist wahrscheinlich die Speise, besonders das Fleisch, das Ijob an seinem Tisch bereitstellte.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: wenn ... nicht
  rationale: Bewahrt die hebräische Form der bedingten Selbstverwünschung; der Nachsatz der Schwurformel bleibt wie im Kontext unausgesprochen.
- source_word: מְתֵי אָהֳלִי
  choice: die Männer meines Zeltes
  rationale: Gibt das konkrete Bild des Hebräischen wieder; gemeint sein können die Männer beziehungsweise Angehörigen von Ijobs Hausgemeinschaft.
- source_word: מִי יִתֵּן
  choice: Wer ist
  rationale: Im Zusammenhang leitet die Wendung eine rhetorische Frage ein; eine wörtlich-optative Wiedergabe wie »Wer gäbe« wäre im Deutschen missverständlich.
- source_word: מִבְּשָׂרוֹ
  choice: von seinem Fleisch
  rationale: Bewahrt die ungewöhnliche hebräische Formulierung und das Pronomen; im Zusammenhang bezeichnet »Fleisch« wahrscheinlich die von Ijob bereitgestellte Speise.
- source_word: לֹא נִשְׂבָּע
  choice: nicht ... satt geworden
  rationale: Gibt das Nifal von שׂבע im Kontext des Essens natürlich und konkret wieder.
theological_decisions:
- issue: Bezug des männlichen Suffixes in מִבְּשָׂרוֹ
  choice: seinem Fleisch
  alternative: meinem Fleisch / dem von mir bereitgestellten Fleisch
  rationale: Das maskuline Suffix wird formal beibehalten, ohne seinen Bezug stillschweigend aufzulösen. Im Kontext ist wahrscheinlich Ijobs Versorgung seiner Hausgemeinschaft gemeint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die elliptische Wenn-Konstruktion wird als Teil der fortlaufenden Schwur- und Selbstverwünschungsformeln in Ijob 31 bewahrt; die ungewöhnliche Rede von »seinem Fleisch« wird nicht vorschnell geglättet.
