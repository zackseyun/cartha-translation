base_translation:
  language: en
  yaml_path: translation/ot/job/031/035.yaml
  text: Oh[a], that I had someone to hear me! Here is my signature; let the Almighty answer me[b], and let my accuser write out the indictment.
translation:
  language: de
  text: Ach, hätte ich doch jemanden, der mich anhört! Hier ist meine Unterschrift[a]; der Allmächtige antworte mir, und mein Gegner soll eine Anklageschrift verfassen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Zeichen“ beziehungsweise „mein Mal“. Gemeint ist wahrscheinlich das Beglaubigungszeichen, das Hiob unter seine Erklärung setzt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher kann der letzte Satzteil auch verstanden werden als: „und ein Schriftstück hat der Mann meines Rechtsstreits geschrieben“. Im Zusammenhang liegt jedoch der Wunsch nahe, dass Hiobs Gegner eine schriftliche Anklage verfasst.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֶּן
  choice: Ach, hätte ich doch
  rationale: Die hebräische Wendung drückt einen inständigen Wunsch aus, keine wörtliche Frage danach, wer etwas geben werde.
- source_word: שֹׁמֵעַ לִי
  choice: jemanden, der mich anhört
  rationale: Das Partizip mit לִי bezeichnet jemanden, der Ijobs Sache anhört; „anhören“ bewahrt zugleich den rechtlichen Unterton.
- source_word: הֶן
  choice: Hier ist
  rationale: Die deiktische Partikel lenkt die Aufmerksamkeit auf das unmittelbar vorgelegte Beglaubigungszeichen.
- source_word: תָּוִי
  choice: meine Unterschrift
  rationale: תָּו bezeichnet ein Zeichen oder eine Marke und fungiert hier wahrscheinlich als Ijobs Beglaubigungszeichen unter seiner Erklärung; „Unterschrift“ vermittelt diese Funktion in heutigem Deutsch.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Dies ist die geläufige und sachlich angemessene Wiedergabe des Gottesnamens beziehungsweise Gottestitels שַׁדַּי im Buch Ijob.
- source_word: יַעֲנֵנִי
  choice: antworte mir
  rationale: Im forensischen Zusammenhang geht es darum, dass Gott auf Ijobs vorgebrachte Sache antwortet.
- source_word: וְסֵפֶר
  choice: und … die Anklageschrift
  rationale: סֵפֶר bezeichnet ein Schriftstück, Buch oder eine Schriftrolle; im rechtlichen Kontext ist seine Funktion die einer schriftlich abgefassten Anklage.
- source_word: כָּתַב
  choice: soll … verfassen
  rationale: Obwohl die Form morphologisch ein Perfekt ist, kann der Satz im Zusammenhang als Fortsetzung von Ijobs Wunsch verstanden werden. „Verfassen“ bezeichnet natürlich das Herstellen eines förmlichen Schriftstücks.
- source_word: אִישׁ רִיבִי
  choice: mein Ankläger
  rationale: Wörtlich ist dies „der Mann meines Rechtsstreits“. Im gerichtlichen Bild bezeichnet die Wendung den Gegner, der gegen Ijob eine Sache beziehungsweise Anklage vorbringt.
theological_decisions:
- issue: Gerichtssprache in Ijobs Aufforderung
  choice: Die rechtliche Bildwelt wird mit „Unterschrift“, „Ankläger“ und „Anklageschrift“ deutlich wiedergegeben.
  alternative: Wörtlichere Formulierungen wie „mein Zeichen“, „der Mann meines Rechtsstreits“ und „ein Schriftstück“ lassen die jeweilige rechtliche Funktion weniger deutlich erkennen.
  rationale: Ijob präsentiert seine Unschuldsbeteuerung als förmliche Rechtssache und verlangt eine Antwort sowie eine schriftliche Gegenklage. Die Übersetzung macht diesen Kontext sichtbar, ohne die Identität des Anklägers näher festzulegen.
- issue: Zeit- und Aussagewert von כָּתַב
  choice: 'Als Wunsch beziehungsweise Aufforderung: „mein Ankläger soll … verfassen“.'
  alternative: 'Als abgeschlossenes Geschehen: „ein Schriftstück, das der Mann meines Rechtsstreits geschrieben hat“.'
  rationale: Die Wunschkonstruktion zu Beginn und der parallele Aufforderungscharakter von „der Allmächtige antworte mir“ stützen die volitive Lesart. Da die hebräische Verbform formal ein Perfekt ist, bleibt die alternative Lesart in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wunschform „Ach, hätte ich doch“ gibt die emotionale Dringlichkeit wieder; „anhört“, „Unterschrift“, „Ankläger“ und „Anklageschrift“ bewahren den durchgehenden gerichtlichen Rahmen. Die gehobene Aufforderungsform „der Allmächtige antworte mir“ passt zu Ijobs feierlicher Herausforderung.
