  source_fidelity: Der erste Satz gibt בְּרִית כָּרַתִּי לְעֵינַי treffend wieder. Die rhetorische Frage und das Verb אֶתְבּוֹנֵן bezeichnen jedoch ein bewusstes, eingehendes Hinsehen; „begehrlich“ ist im Hebräischen nicht ausdrücklich markiert und sollte nicht im Haupttext ergänzt werden. Die alternative Wiedergabe von וּמָה als „Warum ...?“ gehört in eine Fußnote.
