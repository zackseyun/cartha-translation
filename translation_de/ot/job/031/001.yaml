translation:
  language: de
  text: 'Ich habe einen Bund mit meinen Augen geschlossen: Wie sollte ich da meinen Blick auf eine Jungfrau richten?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum sollte ich meinen Blick auf eine Jungfrau richten?“ Das hebräische Verb bezeichnet ein aufmerksames, eingehendes Betrachten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית כָּרַתִּי
  choice: Ich habe einen Bund … geschlossen
  rationale: Die feste hebräische Wendung bedeutet wörtlich »einen Bund schneiden«. »Einen Bund schließen« ist die entsprechende natürliche und gewichtige deutsche Formulierung.
- source_word: לְעֵינָי
  choice: mit meinen Augen
  rationale: Das ל bezeichnet hier die Augen als Gegenüber beziehungsweise Bezugspunkt der Selbstverpflichtung. »Mit meinen Augen« bewahrt das markante Bild und ist im Deutschen verständlich.
- source_word: וּמָה
  choice: Wie sollte ich da
  rationale: Die Verbindung aus Konjunktion und Fragewort leitet eine rhetorische Folgerung aus dem zuvor genannten Bund ein. »Da« gibt diesen Zusammenhang natürlich wieder, ohne die mögliche Nuance »warum« auszuschließen.
- source_word: אֶתְבּוֹנֵן
  choice: begehrlich ansehen
  rationale: Die Verbform bezeichnet ein aufmerksames, bedachtes Betrachten, nicht nur einen flüchtigen Blick. Im Zusammenhang von Ijobs Selbstverpflichtung macht »begehrlich ansehen« die moralisch-sexuelle Stoßrichtung verständlich; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: עַל בְּתוּלָה
  choice: eine Jungfrau
  rationale: בְּתוּלָה bezeichnet gewöhnlich eine Jungfrau beziehungsweise unverheiratete junge Frau; »Jungfrau« erhält die spezifische Bedeutung. עַל wird beim Verb des Sehens im Deutschen direkt mit dem Akkusativ wiedergegeben.
theological_decisions:
- issue: Sexuelle Bedeutung des aufmerksamen Ansehens
  choice: »begehrlich ansehen« im Haupttext
  alternative: »aufmerksam ansehen« oder »meinen Blick auf … richten«
  rationale: Der weitere Zusammenhang von Ijobs Reinheitsbeteuerung legt ein begehrliches Betrachten nahe. Da diese Nuance jedoch nicht ausdrücklich in einem eigenen hebräischen Wort für Begierde steht, bleibt die formnähere Wiedergabe in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle und sachlich präzise Wendung »einen Bund schließen« bleibt erhalten; »begehrlich ansehen« ist allgemein verständlich, während die Fußnote die sprachliche Mehrdeutigkeit offenlegt.
