  text: And what would I do when God rises up? And when he calls me to account[a], what would I answer him?
translation:
  language: de
  text: Und was sollte ich tun, wenn Gott sich erhebt? Und wenn er mich zur Rechenschaft zieht[a], was sollte ich ihm antworten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn er mich prüft“; auch: „wenn er mich aufsucht“. Das hebräische Verb kann aufsuchen, prüfen oder zur Rechenschaft ziehen bedeuten. Hier legt der Zusammenhang eine gerichtliche Bedeutung nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה אֶעֱשֶׂה
  choice: Was sollte ich tun
  rationale: Die Verbindung aus וּמָה und dem Imperfekt formuliert eine rhetorische Frage nach Jobs möglichem Handeln. „Was sollte ich tun“ klingt im Deutschen natürlich und bewahrt den erwägenden, hypothetischen Sinn.
- source_word: כִּי יָקוּם אֵל
  choice: wenn Gott sich erhebt
  rationale: כִּי ist hier am besten temporal zu verstehen. „Sich erheben“ bewahrt das Bild von קום und lässt offen, wie genau Gottes richterliches Handeln einsetzt.
- source_word: וְכִי יִפְקֹד
  choice: Und wenn er mich zur Rechenschaft zieht
  rationale: פקד kann besuchen, prüfen, mustern oder zur Rechenschaft ziehen bedeuten. Der Zusammenhang mit Jobs möglicher Antwort legt hier eine gerichtliche Verantwortung nahe; eine Fußnote wahrt die lexikalische Breite.
- source_word: מָה אֲשִׁיבֶנּוּ
  choice: was sollte ich ihm antworten
  rationale: Der Hifil von שוב bezeichnet hier idiomatisch das Erwidern oder Antworten; das Suffix der 3. Person Singular wird mit „ihm“ wiedergegeben.
theological_decisions:
- issue: Bild göttlichen Gerichts
  choice: Gott erhebt sich und zieht Job zur Rechenschaft, ohne dass dies ausdrücklich auf das Endgericht eingeengt wird.
  alternative: Gott „sucht ihn auf“ oder „prüft ihn“; oder die Aussage wird ausschließlich eschatologisch verstanden.
  rationale: Das Zusammenspiel von פקד und der Frage nach einer Antwort trägt einen gerichtlichen Unterton. Der Vers selbst bestimmt jedoch weder eine ausschließlich allgemeine Heimsuchung noch ausdrücklich das Endgericht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen rhetorischen Fragen und das Bild des sich erhebenden Gottes bleiben erhalten; die Fußnote bewahrt die Bedeutungsbreite von פקד.
