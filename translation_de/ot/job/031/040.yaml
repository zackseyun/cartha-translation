source:
  edition: WLC
  text: תַּ֤חַת חִטָּ֨ה יֵ֥צֵא ח֗וֹחַ וְ/תַֽחַת שְׂעֹרָ֥ה בָאְשָׁ֑ה תַּ֝֗מּוּ דִּבְרֵ֥י אִיּֽוֹב׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/031/040.yaml
  text: Instead of wheat[a], let thorns come up, and instead of barley, stinkweed. The words of Job are ended.
translation:
  language: de
  text: Statt Weizen sollen Dornen aufgehen und statt Gerste stinkendes Unkraut.[a] Hier enden die Worte Hiobs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „übel riechendes Gewächs“ oder „schädliches Unkraut“; welche Pflanze das hebräische Wort genau bezeichnet, ist ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: statt
  rationale: Im landwirtschaftlichen Fluchzusammenhang bezeichnet die Präposition Ersatz beziehungsweise Vertauschung, nicht eine räumliche Lage.
- source_word: חִטָּה
  choice: Weizen
  rationale: Die übliche Bezeichnung der Getreideart und der klare Gegenpol zum schädlichen Bewuchs.
- source_word: יֵצֵא
  choice: sollen ... aufgehen
  rationale: Das Verb bezeichnet bei Pflanzen idiomatisch das Hervorkommen aus dem Boden; die Form gibt den verwünschenden Charakter des Satzes wieder.
- source_word: חוֹחַ
  choice: Dornen
  rationale: Gemeint ist allgemein schädlicher, dorniger Bewuchs; „Dornen“ ist verständlich und bewahrt das Bild.
- source_word: שְׂעֹרָה
  choice: Gerste
  rationale: Die übliche deutsche Bezeichnung der genannten Getreideart.
- source_word: בָאְשָׁה
  choice: stinkendes Unkraut
  rationale: Das seltene Substantiv bezeichnet wahrscheinlich übel riechenden oder schädlichen Pflanzenwuchs. Die Wiedergabe erhält die Verbindung zum Bedeutungsfeld von Gestank, ohne eine botanisch unsichere Pflanzenart festzulegen.
- source_word: תַּמּוּ
  choice: Hier enden
  rationale: Die knappe Schlussformel kennzeichnet das Ende von Hiobs Reden; „Hier enden“ klingt im Deutschen natürlich und würdevoll.
- source_word: דִּבְרֵי אִיּוֹב
  choice: die Worte Hiobs
  rationale: Die formale Genitivverbindung bewahrt den Charakter der abschließenden Notiz.
