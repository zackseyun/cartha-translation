  text: Dann soll meine Frau für einen anderen mahlen, und andere Männer sollen sich über ihr niederknien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »und andere Männer sollen mit ihr schlafen«; »sich über ihr niederknien« ist in diesem Zusammenhang wohl eine sexuelle Umschreibung.'
    reason: Die Anmerkung dokumentiert die wahrscheinliche euphemistische Bedeutung von יִכְרְעוּן, ohne die konkrete hebräische Bildsprache im Haupttext aufzulösen.
lexical_decisions:
- source_word: תִּטְחַן
  choice: mahlen
  rationale: Das Verb טחן bezeichnet konkret das Mahlen von Getreide. Die Übersetzung bewahrt das hebräische Bild niedriger Dienstarbeit und lässt zugleich seine mögliche sexuelle Nebenbedeutung offen.
- source_word: לְאַחֵר
  choice: für einen anderen
  rationale: אַחֵר bedeutet »ein anderer«. Der maskuline substantivische Gebrauch ist im Deutschen mit »einen anderen« natürlich wiedergegeben; aus dem Zusammenhang ist ersichtlich, dass ein anderer Mann gemeint ist.
- source_word: אִשְׁתִּי
  choice: meine Frau
  rationale: אִשָּׁה mit dem Suffix der ersten Person Singular bezeichnet hier Hiobs Ehefrau.
- source_word: וְעָלֶיהָ
  choice: über ihr
  rationale: עַל mit pronominalem Suffix wird räumlich mit »über ihr« wiedergegeben und erhält so das körperliche Bild des Ausgangstextes.
- source_word: יִכְרְעוּן
  choice: sich niederknien
  rationale: כרע bedeutet gewöhnlich »niederknien« oder »sich beugen«. In diesem Zusammenhang liegt wahrscheinlich eine sexuelle Umschreibung vor; der Haupttext bewahrt jedoch die konkrete Ausdrucksweise.
- source_word: אֲחֵרִין
  choice: andere Männer
  rationale: Die maskuline Pluralform bezeichnet im Zusammenhang andere männliche Personen. »Andere Männer« macht den Bezug im Deutschen eindeutig.
theological_decisions:
- issue: Ob die sexuelle Bedeutung der bildhaften Verben im Haupttext ausdrücklich gemacht werden soll
  choice: Die konkreten Bilder »mahlen« und »sich über ihr niederknien« bleiben im Haupttext erhalten; die wahrscheinliche sexuelle Bedeutung wird in einer Fußnote erläutert.
  alternative: Dann soll meine Frau mit einem anderen Mann schlafen, und andere Männer sollen bei ihr liegen.
  rationale: Der hebräische Text verwendet keine ausdrückliche Bezeichnung für Geschlechtsverkehr, legt diese Bedeutung im Fluchzusammenhang und durch den Parallelismus aber nahe. Die gewählte Fassung bewahrt sowohl die Bildsprache als auch die echte Deutungsspannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform folgt der Fluchformel des Hebräischen, ohne die wahrscheinlich sexuelle Bildsprache im Haupttext erklärend aufzulösen.
