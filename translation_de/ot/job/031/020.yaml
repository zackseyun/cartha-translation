  text: wenn mich seine Lenden nicht gesegnet haben[a] und er durch das Vlies meiner Schafe warm geworden ist[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »seine Lenden«. Der Ausdruck steht für den Körper des Bedürftigen, der durch Hiobs Gabe bekleidet und gewärmt wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »durch die geschorene Wolle meiner Schafe«. Das hebräische Wort kann sowohl Vlies als auch geschorene Wolle bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: wenn ... nicht
  rationale: Im Zusammenhang von Hiobs Unschuldsbeteuerung leitet die Wendung die Bedingung einer unausgesprochenen Selbstverfluchung ein. Die konditionale Form bleibt daher erhalten.
- source_word: בֵרֲכוּנִי
  choice: mich ... gesegnet haben
  rationale: Das Piel von ברך bedeutet gewöhnlich „segnen“. Gemeint ist hier die dankbare Reaktion des Bedürftigen; die wörtliche Wendung bewahrt zugleich das Bild und seinen religiösen Klang.
- source_word: חֲלָצָיו
  choice: seine Hüften
  rationale: חלץ bezeichnet den Hüft- beziehungsweise Lendenbereich und steht hier als körperlicher Ausdruck für den bekleideten und gewärmten Bedürftigen. „Hüften“ ist im heutigen Deutsch verständlicher als „Lenden“, ohne das Bild aufzulösen.
- source_word: וּמִגֵּז
  choice: an der Wolle
  rationale: גֵּז kann das Vlies oder die geschorene Wolle bezeichnen. Mit dem Verb „sich wärmen“ ist „an der Wolle“ natürlich und bewahrt die instrumentale beziehungsweise ursächliche Beziehung.
- source_word: כְּבָשַׂי
  choice: meiner Schafe
  rationale: כֶּבֶשׂ kann Schaf oder Lamm bedeuten; im Zusammenhang der Wollgewinnung ist „Schafe“ die natürliche deutsche Wahl.
- source_word: יִתְחַמָּם
  choice: er sich ... gewärmt hat
  rationale: Das Hitpael von חם bezeichnet das Warmwerden beziehungsweise Sichwärmen. Das männliche Singularpronomen nimmt den durch „seine Hüften“ bezeichneten Bedürftigen wieder auf.
