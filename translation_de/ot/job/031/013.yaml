source:
  edition: WLC
  text: אִם אֶמְאַ֗ס מִשְׁפַּ֣ט עַ֭בְדִּ/י וַ/אֲמָתִ֑/י בְּ֝/רִבָ֗/ם עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/013.yaml
  text: If I have rejected the case of my male servant or my female servant when they brought a complaint against me[b][a],
translation:
  language: de
  text: Wenn ich meinem Sklaven oder meiner Sklavin ihr Recht verweigert habe, als sie gegen mich Klage erhoben,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Rechtssache abgewiesen habe“. Das hebräische Wort kann Recht, rechtlichen Anspruch oder Rechtssache bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell auch: „meinem Diener oder meiner Magd“. Die hebräischen Bezeichnungen können Dienende meinen, bezeichnen jedoch häufig Sklaven beziehungsweise unfreie Hausangehörige.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet im Unschuldseid Ijobs einen Bedingungssatz ein; schlichtes „Wenn“ entspricht Syntax und Zusammenhang.
- source_word: אֶמְאַס
  choice: verweigert habe
  rationale: מָאַס bedeutet ablehnen, verwerfen oder verschmähen. Im rechtlichen Zusammenhang bezeichnet es, einen Anspruch nicht gelten zu lassen; „verweigert“ klingt im Deutschen natürlich.
- source_word: מִשְׁפַּט
  choice: ihr Recht
  rationale: מִשְׁפָּט kann Recht, Gerechtigkeit, Urteil oder Rechtssache bezeichnen. Das deutsche „Recht“ bewahrt hier die mögliche Bedeutung eines berechtigten Anspruchs; „Rechtssache“ bleibt als Alternative in der Fußnote.
- source_word: עַבְדִּי וַאֲמָתִי
  choice: meinem Sklaven oder meiner Sklavin
  rationale: Die beiden Wörter bezeichnen ausdrücklich einen männlichen und einen weiblichen Menschen in unfreier beziehungsweise abhängiger Stellung. „Sklave/Sklavin“ macht diesen Status deutlicher als „Diener/Magd“.
- source_word: בְּרִיבָם
  choice: als sie … Klage erhoben
  rationale: רִיב bezeichnet Streit, Rechtsstreit oder Klage. Die verbale Wiedergabe ist verständliches modernes Deutsch und erhält den juristischen Charakter.
- source_word: עִמָּדִי
  choice: gegen mich
  rationale: Wörtlich „mit mir“; im Zusammenhang eines Rechtsstreits bezeichnet die Wendung die Gegenpartei und wird idiomatisch mit „gegen mich“ wiedergegeben.
theological_decisions: []
