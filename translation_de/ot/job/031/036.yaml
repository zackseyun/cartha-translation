lexical_decisions:
- source_word: אִם לֹא
  choice: Ja
  rationale: Im Zusammenhang des feierlichen Eids hat die Wendung bekräftigende, nicht konditionale Kraft. „Ja“ gibt diese nachdrückliche Versicherung im Deutschen natürlich wieder.
- source_word: עַל שִׁכְמִי
  choice: auf meiner Schulter
  rationale: Die räumliche Wendung wird direkt wiedergegeben; der Singular bewahrt das Bild des öffentlichen Tragens.
- source_word: אֶשָּׂאֶנּוּ
  choice: ich würde es … tragen
  rationale: נשׂא bezeichnet hier das Tragen der zuvor genannten Anklageschrift; der deutsche Konjunktiv gibt die Aussage innerhalb der Eidformel passend wieder.
- source_word: אֶעֶנְדֶנּוּ
  choice: ich würde es mir … umbinden
  rationale: ענד bezeichnet das Anlegen oder Befestigen eines Schmuckstücks. „Umbinden“ bewahrt das konkrete Bild, ohne es auf bloßes Sich-Schmücken zu reduzieren.
- source_word: עֲטָרוֹת
  choice: wie eine Krone
  rationale: Die Form ist morphologisch Plural, kann hier aber als intensiver beziehungsweise kollektiv gedachter Ausdruck für kronenartigen Schmuck verstanden werden. Der Singular ist im Deutschen in diesem Vergleich natürlicher; der hebräische Plural wird in der Fußnote offengelegt.
- source_word: לִי
  choice: mir
  rationale: Der Dativ bezeichnet, dass Hiob die Schrift an sich selbst anlegen würde; der deutsche reflexive Dativ gibt dies knapp und idiomatisch wieder.
