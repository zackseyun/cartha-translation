  text: Surely I would carry it on my shoulder[a]; I would bind it on myself like a crown.
translation:
  language: de
  text: Gewiss, ich würde es auf meiner Schulter tragen; ich würde es mir als Krone[a] aufsetzen.
  philosophy: optimal-equivalence
  footnotes:
