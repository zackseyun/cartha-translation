base_translation:
  language: en
  yaml_path: translation/ot/job/031/018.yaml
  text: for from my youth he raised me like a father[b][a], and from my mother’s womb I guided her.
translation:
  language: de
  text: Denn von meiner Jugend an zog er mich groß wie ein Vater[a], und vom Leib meiner Mutter an leitete ich sie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach anderer Auffassung: „Er wuchs bei mir auf wie bei einem Vater“ oder „Ich zog ihn groß wie ein Vater“. Der hebräische Wortlaut ist hier schwierig.'
    reason: alternative_reading
  - marker: b
    text: „Sie“ bezieht sich wahrscheinlich auf die Witwe aus Vers 16.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet im Zusammenhang Hiobs Verneinung aus dem vorhergehenden Vers; „Denn“ gibt diesen argumentativen Anschluss natürlich wieder.
- source_word: מִנְּעוּרַי
  choice: von meiner Jugend an
  rationale: Die Wendung bezeichnet den seit der Jugend andauernden Zeitraum und entspricht idiomatischem modernem Deutsch.
- source_word: גְּדֵלַנִי
  choice: zog er mich groß
  rationale: Die masoretisch überlieferte Form ist ein Qal mit Suffix der 1. Person Singular und bedeutet formal „er ließ mich groß werden / zog mich groß“. Die ungewöhnliche Aussage wird im Haupttext nicht stillschweigend korrigiert.
- source_word: כְאָב
  choice: wie ein Vater
  rationale: Das Präfix כְּ kennzeichnet den Vergleich; „wie ein Vater“ bewahrt das Bild klar und knapp.
- source_word: וּמִבֶּטֶן אִמִּי
  choice: und vom Mutterleib an
  rationale: Die zeitliche Redewendung bezeichnet den frühestmöglichen Lebensanfang. Im Deutschen kann „meiner Mutter“ ohne Bedeutungsverlust entfallen, da der eigene Mutterleib gemeint ist.
- source_word: אַנְחֶנָּה
  choice: leitete ich sie
  rationale: 'Hifil, 1. Person Singular, mit femininem Suffix der 3. Person: „ich führte/leitete sie“. „sie“ lässt den grammatischen Rückbezug auf die Witwe aus Vers 16 sichtbar.'
theological_decisions:
- issue: Ungewöhnlicher Subjekt- und Referenzwechsel im Vers
  choice: Der erste Halbvers wird gemäß der masoretischen Form als „er zog mich groß“ wiedergegeben; der zweite spricht mit femininem Objekt von „sie“, wahrscheinlich der Witwe.
  alternative: 'Den ersten Halbvers sinngemäß auf Hiobs väterliche Fürsorge für den Vaterlosen beziehen: „Er wuchs bei mir auf wie bei einem Vater“ oder nach anderer Lesart „Ich zog ihn groß wie ein Vater“.'
  rationale: Der überlieferte hebräische Text ist grammatisch auffällig und in seiner Aussage schwer verständlich. Die Übersetzung hält sowohl die Form mit „mich“ als auch den Wechsel zum femininen „sie“ fest, statt die Spannung durch eine Konjektur oder erklärende Paraphrase aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die befremdliche Formulierung des ersten Halbverses bleibt bewusst erhalten und wird durch eine knappe textkritisch-übersetzerische Fußnote erläutert.
