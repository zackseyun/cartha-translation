  text: אִם כִּסִּ֣יתִי כְ/אָדָ֣ם פְּשָׁעָ֑/י לִ/טְמ֖וֹן בְּ/חֻבִּ֣/י עֲוֺֽנִ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/033.yaml
  text: if I have covered my transgressions like Adam[a], by hiding my iniquity in my bosom—
translation:
  language: de
  text: wenn ich meine Vergehen wie ein Mensch[a] bedeckt habe, um meine Schuld in meinem Innern zu verbergen —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Adam“. Das hebräische Wort אָדָם kann hier entweder „Mensch“ bedeuten oder als Eigenname „Adam“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Leitet im Zusammenhang von Hiobs Unschuldsbeteuerung den Bedingungssatz ein.
- source_word: כִּסִּיתִי
  choice: ich … zugedeckt habe
  rationale: Bewahrt das konkrete Bild des Verbs כסה („bedecken, verbergen“) und klingt im Deutschen natürlich.
- source_word: כְאָדָם
  choice: wie ein Mensch
  rationale: אָדָם kann hier die Gattungsbezeichnung „Mensch“ oder den Eigennamen „Adam“ bezeichnen. Der Haupttext gibt die allgemeine Lesart wieder; die andere bleibt in der Fußnote erhalten.
- source_word: פְּשָׁעָי
  choice: meine Vergehen
  rationale: Gibt den moralisch-rechtlichen Sinn von פֶּשַׁע klar wieder, ohne die mögliche Bedeutung „Auflehnung“ überzubetonen.
- source_word: לִטְמוֹן
  choice: verborgen
  rationale: Das Verb טמן bezeichnet das Verstecken oder Verbergen. Im koordinierten deutschen Satz wird die modale Beziehung idiomatisch durch das zweite Partizip ausgedrückt.
- source_word: בְּחֻבִּי
  choice: in meinem Innersten
  rationale: Die seltene Form bezeichnet wahrscheinlich den Brust- oder Schoßbereich als verborgenen Ort. „In meinem Innersten“ vermittelt das Bild verständlich, ohne eine im Deutschen missverständliche Körperbezeichnung zu erzwingen.
- source_word: עֲוֺנִי
  choice: meine Schuld
  rationale: עָוֹן kann sowohl Verfehlung als auch daraus erwachsende Schuld bezeichnen. „Schuld“ erhält die moralische Schwere und unterscheidet den Ausdruck von פֶּשַׁע.
theological_decisions:
- issue: Deutung von אָדָם in כְאָדָם
  choice: 'Gattungsbezeichnung: „wie ein Mensch“'
  alternative: 'Eigenname: „wie Adam“'
  rationale: Der unvokalisierte lexikalische Ausdruck erlaubt beide Deutungen. Der Kontext kann allgemein menschliches Verbergen meinen, während die Eigennamenlesart eine Anspielung auf Adam nahelegt. Diese Spannung wird durch Haupttext und Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als unvollständiger Bedingungssatz mit Gedankenstrich stehen, entsprechend der fortlaufenden Schwurform in Hiob 31.
