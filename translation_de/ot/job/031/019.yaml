  text: if I have seen anyone perishing for lack of clothing[b][a], or the needy without covering—
translation:
  language: de
  text: wenn ich jemanden zugrunde gehen sah, weil ihm Kleidung fehlte,[a] oder einen Bedürftigen ohne Bedeckung[b] –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne Kleidung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ohne ein Kleidungsstück“; die Bezeichnung kann je nach Zusammenhang auch eine Decke meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Leitet im Zusammenhang von Hiobs Unschuldsbeteuerung den Bedingungssatz ein.
- source_word: אֶרְאֶה
  choice: ich … sah
  rationale: Das Qal-Imperfekt der 1. Person Singular blickt in diesem Schwurzusammenhang auf Hiobs bisheriges Verhalten zurück; im Deutschen ist das Präteritum natürlich.
- source_word: אֹבֵד
  choice: einen zugrunde gehen
  rationale: Das Partizip von אבד bezeichnet jemanden, der dem Verderben beziehungsweise Untergang ausgesetzt ist; die Verbindung mit „sah“ wird im Deutschen idiomatisch als Akkusativ mit Infinitiv wiedergegeben.
- source_word: מִבְּלִי לְבוּשׁ
  choice: weil ihm Kleidung fehlte
  rationale: Gibt die durch Mangel an Kleidung verursachte Not natürlich wieder, ohne den Ausdruck auf völlige Nacktheit festzulegen.
- source_word: וְאֵין
  choice: oder … ohne
  rationale: Das hebräische ו verbindet den parallelen zweiten Fall; im deutschen Bedingungsgefüge macht „oder“ die alternative beziehungsweise ergänzende Fallaufzählung klar.
- source_word: כְּסוּת
  choice: Decke
  rationale: כְּסוּת kann eine Bedeckung oder ein Kleidungsstück bezeichnen. „Decke“ bewahrt den Unterschied zu לְבוּשׁ und passt zur konkreten Not Schutzloser, ohne die weitere Bedeutung zu verschweigen.
- source_word: לָאֶבְיוֹן
  choice: einen Bedürftigen
  rationale: אֶבְיוֹן bezeichnet einen materiell armen, hilfsbedürftigen Menschen; „Bedürftigen“ ist gegenwärtig, verständlich und nicht überpräzisierend.
