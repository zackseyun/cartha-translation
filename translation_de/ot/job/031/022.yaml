translation:
  language: de
  text: Dann soll meine Schulter aus ihrem Gelenk fallen[a] und mein Arm vom Knochen abbrechen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Schulter“ beziehungsweise „vom Schulterblatt“. Die hebräische Wendung beschreibt wahrscheinlich, dass die Schulter aus ihrer Verbindung gerissen wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vom Gelenk“. Das hier seltene hebräische Wort kann in diesem Zusammenhang die Knochen- oder Gelenkstruktur des Arms bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפִי
  choice: meine Schulter
  rationale: כָּתֵף bezeichnet gewöhnlich die Schulter beziehungsweise den Schulterbereich. „Schulter“ ist im Deutschen die natürliche Entsprechung und bildet den Parallelismus zu „Arm“ ab.
- source_word: מִשִּׁכְמָה
  choice: aus ihrem Gelenk
  rationale: שִׁכְמָה verweist auf den Schulter- oder Rückenbereich. Zusammen mit „fallen“ beschreibt die Wendung wahrscheinlich das Heraustreten der Schulter aus ihrer anatomischen Verbindung; „aus ihrem Gelenk fallen“ gibt dieses Verletzungsbild verständlich wieder, ohne die seltene Form als eindeutig auszugeben.
- source_word: תִפּוֹל
  choice: soll … fallen
  rationale: נפל bedeutet wörtlich „fallen“. Die deutsche Soll-Konstruktion gibt den Wunsch- beziehungsweise Fluchcharakter der Verbform im Zusammenhang wieder.
- source_word: וְאֶזְרֹעִי
  choice: und mein Arm
  rationale: זְרוֹעַ bedeutet regulär „Arm“; der Kontext verlangt keine engere anatomische Festlegung.
- source_word: מִקָּנָה
  choice: am Knochen
  rationale: קָנֶה bedeutet sonst häufig „Rohr“ oder „Stab“, wird hier jedoch in einem anatomischen Verletzungsbild gebraucht und wahrscheinlich auf die Knochen- oder Gelenkstruktur des Arms bezogen. „Am Knochen“ bewahrt das konkrete Bild, während die Unsicherheit in der Fußnote offengelegt wird.
- source_word: תִשָּׁבֵר
  choice: soll … brechen
  rationale: Die Nifal-Form von שׁבר bezeichnet hier das Gebrochenwerden. Das idiomatische deutsche „soll … brechen“ erhält sowohl den passiven Sinn als auch den Charakter der Selbstverwünschung.
theological_decisions:
- issue: Form der Selbstverwünschung
  choice: Wiedergabe mit „Dann soll …“
  alternative: 'Imperativisch: „Dann falle … und breche …“'
  rationale: Der Vers formuliert die Folge einer vorausgehenden Bedingung als feierliche Selbstverwünschung. „Dann soll“ klingt im modernen Deutschen natürlich und legt nicht fest, ob die Aussage als Wunsch, Fluch oder erwartete Vergeltung zu klassifizieren ist.
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallele, knappe Form des hebräischen Selbstfluchs bleibt erhalten; seltene anatomische Ausdrücke werden im Haupttext verständlich und in den Fußnoten mit ihren echten Alternativen wiedergegeben.
