  text: The sojourner did not spend the night outside[a]; I opened my doors to the traveler.
translation:
  language: de
  text: Kein Fremder übernachtete draußen[a]; dem Reisenden öffnete ich meine Türen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der nicht einheimische Fremde übernachtete nicht draußen; dem Wanderer öffnete ich meine Tür.“'
    reason: „Nicht einheimischer Fremder“ macht die bei גֵּר mögliche soziale Nuance sichtbar; „Wanderer“ und der deutsche Singular „Tür“ sind idiomatische Alternativen zu אָרַח und dem hebräischen Plural דְּלָתַי.
lexical_decisions:
- source_word: בַּחוּץ
  choice: draußen
  rationale: Die Wendung bezeichnet den Bereich außerhalb des Hauses beziehungsweise das Freie. „Draußen“ ist im Deutschen unmittelbar und natürlich; „auf der Straße“ wäre kontextuell möglich, aber enger.
- source_word: יָלִין
  choice: musste … übernachten
  rationale: Das Verb לין bezeichnet das Verbringen der Nacht. Zusammen mit der Verneinung gibt „musste … übernachten“ idiomatisch Hiobs Aussage wieder, dass er niemanden ohne Unterkunft ließ, ohne den zeitlichen Sinn abzuschwächen.
- source_word: גֵּר
  choice: Fremder
  rationale: גֵּר bezeichnet einen nicht einheimischen, unter anderen lebenden Menschen und kann soziale Schutzbedürftigkeit einschließen. „Fremder“ ist im modernen Deutsch verständlich und weniger verwaltungssprachlich als „ansässiger Ausländer“.
- source_word: דְּלָתַי
  choice: meine Türen
  rationale: Die hebräische Form ist ein Plural mit Suffix der ersten Person Singular. „Meine Türen“ bewahrt diese Form und vermittelt anschaulich die gewährte Gastfreundschaft.
- source_word: לָאֹרַח
  choice: dem Reisenden
  rationale: אֹרַח bezeichnet hier im Zusammenhang mit Unterkunft einen Reisenden oder Wanderer, nicht den Weg selbst. „Reisender“ ist allgemein verständlich und stilistisch angemessen.
- source_word: אֶפְתָּח
  choice: öffnete ich
  rationale: Das Imperfekt beschreibt in Hiobs Rückblick plausibel sein gewohntes beziehungsweise charakteristisches Handeln. Das deutsche Präteritum gibt dies im Kontext natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die erste Vershälfte ist idiomatisch als Aussage tätiger Gastfreundschaft formuliert; die Fußnote bewahrt eine formal nähere Wiedergabe. Der Parallelismus zwischen dem Fremden draußen und dem aufgenommenen Reisenden bleibt erhalten.
