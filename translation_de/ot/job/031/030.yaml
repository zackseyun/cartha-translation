base_translation:
  language: en
  yaml_path: translation/ot/job/031/030.yaml
  text: I have not allowed my mouth to sin by asking for his life with a curse[a].
translation:
  language: de
  text: Ich habe auch meinem Mund nicht erlaubt zu sündigen, indem ich mit einem Fluch[a] sein Leben forderte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit einem Eid«. Das hebräische Substantiv kann sowohl einen Fluch beziehungsweise eine Verwünschung als auch einen Eid bezeichnen; hier legt der Zusammenhang, in dem Schaden gewünscht wird, »Fluch« näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  choice: habe … nicht erlaubt
  rationale: Die Wendung »nicht geben« mit Infinitiv bezeichnet hier das Nichtzulassen; »nicht erlaubt« gibt diesen willentlichen Verzicht im Deutschen natürlich wieder.
- source_word: לַחֲטֹא
  choice: zu sündigen
  rationale: חטא hat hier den üblichen moralischen Sinn und bezeichnet das Unrecht, das Hiob seinem Mund nicht gestattete.
- source_word: חִכִּי
  choice: meinem Mund
  rationale: Wörtlich bezeichnet חך den Gaumen; poetisch steht er hier metonymisch für das Sprechen. »Mund« ist im Deutschen klar und idiomatisch.
- source_word: לִשְׁאֹל
  choice: indem ich … verlangte
  rationale: Das Verb bezeichnet ein Erbitten oder Verlangen. Die Konstruktion mit »indem« macht deutlich, worin die sündige Äußerung bestanden hätte.
- source_word: בְּאָלָה
  choice: mit einem Fluch
  rationale: אָלָה kann Fluch beziehungsweise Verwünschung, teils auch Eid bedeuten. Im Zusammenhang des Wunsches nach dem Tod eines Feindes ist »Fluch« am wahrscheinlichsten; die Alternative bleibt in der Fußnote erhalten.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נפשׁ bezeichnet hier das Leben beziehungsweise die Person, nicht eine vom Körper getrennte Seele. »Sein Leben« passt zum erbetenen Unheil.
theological_decisions: []
