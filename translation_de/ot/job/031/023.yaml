source:
  edition: WLC
  text: כִּ֤י פַ֣חַד אֵ֭לַ/י אֵ֣יד אֵ֑ל וּ֝/מִ/שְּׂאֵת֗/וֹ לֹ֣א אוּכָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/023.yaml
  text: For calamity from God was a terror to me[b][a], and because of his majesty I could not endure.
translation:
  language: de
  text: Denn das Unheil von Gott war mir ein Schrecken[a], und vor seiner Hoheit konnte ich nicht bestehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn das Unheil Gottes war mir ein Grauen.“ Gemeint ist wahrscheinlich Unheil, das von Gott kommt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und wegen seiner Erhabenheit vermochte ich nichts“ beziehungsweise „konnte ich ihm nicht standhalten“. Das Hebräische nennt kein ausdrückliches Objekt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Hiobs zuvor beschriebenes Verhalten ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: פַחַד
  choice: ein Schrecken
  rationale: Bewahrt die substantivische Form und bezeichnet starken Schrecken beziehungsweise Grauen.
- source_word: אֵלַי
  choice: mir
  rationale: Die Präposition mit Suffix stellt den Schrecken in eine persönliche Beziehung zu Hiob; im Deutschen ist „war mir ein Schrecken“ idiomatisch.
- source_word: אֵיד אֵל
  choice: das Unheil von Gott
  rationale: Die formal nahe Wiedergabe wahrt die mögliche Mehrdeutigkeit zwischen von Gott kommendem Unheil und „Unheil Gottes“; eine Fußnote erläutert die wahrscheinlich gemeinte Herkunft.
- source_word: וּמִשְּׂאֵתוֹ
  choice: und vor seiner Hoheit
  rationale: שְׂאֵת kann Erhebung, Erhabenheit oder Hoheit bezeichnen. „Vor seiner Hoheit“ verbindet Gottes Erhabenheit natürlich mit Hiobs Unvermögen zu bestehen, ohne die Präposition ausschließlich kausal festzulegen.
- source_word: לֹא אוּכָל
  choice: konnte ich nicht bestehen
  rationale: יכל bezeichnet Vermögen oder Fähigkeit; im Zusammenhang drückt „nicht bestehen können“ aus, dass Hiob Gottes Hoheit beziehungsweise Gericht nicht standhalten könnte.
theological_decisions:
- issue: Wiedergabe von אֵל
  choice: Gott
  alternative: der Mächtige; El
  rationale: Hier bezeichnet אֵל Gott im Zusammenhang mit Unheil und Hoheit. „Gott“ ist im modernen Deutschen klar und trägt keine zusätzliche konfessionelle Festlegung ein.
- issue: Hiobs Beweggrund
  choice: Die Furcht vor dem von Gott ausgehenden Unheil und Gottes Hoheit hielt ihn zurück.
  alternative: Hiob fürchtete lediglich Strafe; Hiob sprach nur abstrakt von Gottes Erhabenheit.
  rationale: Der Vers hält drohendes göttliches Unheil und Gottes erhabene Hoheit zusammen. Die Übersetzung wahrt diese Spannung, ohne Hiobs Motivation auf bloße Selbstbewahrung oder abstrakte Ehrfurcht zu reduzieren.
- issue: Bezug von „nicht bestehen können“
  choice: Der Ausdruck bleibt hinsichtlich des genauen Objekts offen.
  alternative: Ich konnte es nicht ertragen; ich konnte ihm nicht widerstehen.
  rationale: Im Hebräischen steht kein ausdrückliches Objekt. Die deutsche Formulierung bewahrt diese Offenheit und kann sowohl Gottes Hoheit als auch dem damit verbundenen Gericht gelten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unheil“, „Schrecken“ und „Hoheit“ sind allgemein verständlich und bewahren die ernste poetische Sprache. Die Wortstellung im zweiten Halbvers bleibt gehoben, aber natürlich.
