lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Leitet innerhalb von Hiobs Unschuldschwur eine Bedingung ein; der Satz wird in den folgenden Versen fortgeführt.
- source_word: אֶרְאֶה
  choice: ich ansah
  rationale: Das Qal-Imperfekt 1. Person Singular bezeichnet hier eine hypothetische vergangene Handlung. „Ansah“ passt zudem zum Kontext einer möglichen bewundernden Hinwendung.
- source_word: אוֹר
  choice: das Licht
  rationale: Bewahrt die wörtliche Bezeichnung. Im Parallelismus mit dem Mond ist wahrscheinlich die Sonne gemeint, doch der hebräische Text nennt sie nicht ausdrücklich.
- source_word: כִּי
  choice: wie
  rationale: Leitet hier den wahrgenommenen Begleitumstand ein. „Wie es strahlte“ ist im Deutschen natürlich und gibt die Beziehung wieder, ohne sie kausal zu deuten.
- source_word: יָהֵל
  choice: es strahlte
  rationale: Gibt die Bedeutung des hellen Leuchtens knapp und idiomatisch wieder.
- source_word: וְיָרֵחַ
  choice: oder den Mond
  rationale: Die Konjunktion verbindet im Bedingungssatz ein zweites, paralleles Himmelsobjekt; „oder“ bringt den disjunktiven Sinn im Deutschen klar zum Ausdruck.
- source_word: יָקָר
  choice: prächtig
  rationale: Das Wort bezeichnet hier den leuchtenden Glanz beziehungsweise die Herrlichkeit des Mondes und wird adverbial auf sein Dahinziehen bezogen.
- source_word: הֹלֵךְ
  choice: dahinzog
  rationale: Das Partizip beschreibt den fortschreitenden Lauf des Mondes am Himmel. „Dahinzog“ verbindet Bewegung und würdevollen Eindruck natürlich.
theological_decisions:
- issue: Möglicher Bezug auf Gestirnsverehrung
  choice: Die konkrete Himmelserscheinung wird wörtlich wiedergegeben, ohne die Verehrung im Vers selbst ausdrücklich zu nennen.
  alternative: „Licht“ direkt als „Sonne“ übersetzen und dadurch den Zusammenhang mit Gestirnsverehrung deutlicher hervorheben.
  rationale: Die Verse 27–28 machen den religiösen Zusammenhang deutlich, aber Vers 26 selbst spricht nur vom „Licht“ und vom Mond. Die Übersetzung bewahrt diese Zurückhaltung und lässt den Kontext die theologische Bedeutung entfalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt als bedingter Nebensatz offen, weil der Gedanke in den folgenden Versen fortgesetzt wird. Die beiden Fußnotenmarker stehen unmittelbar an den jeweils erläuterten Satzteilen.
