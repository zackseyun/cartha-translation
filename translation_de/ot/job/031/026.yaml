  text: wenn ich das Licht ansah, wenn es strahlte,[a] oder den Mond, der prächtig dahinzog,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sonne, wenn sie strahlte“; mit „Licht“ ist im Parallelismus zum Mond wahrscheinlich die Sonne gemeint.'
