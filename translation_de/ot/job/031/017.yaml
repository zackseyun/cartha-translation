lexical_decisions:
- source_word: וְאֹכַל
  choice: wenn ich … gegessen habe
  rationale: Im Zusammenhang von Hiob 31 eröffnet das Waw eine Bedingung innerhalb einer Eidformel. Das deutsche Perfekt gibt den Rückblick natürlich wieder.
- source_word: פִּתִּי
  choice: meinen Bissen
  rationale: Die konkrete Bedeutung eines Stücks beziehungsweise Bissens Nahrung bleibt erhalten, ohne den Ausdruck unnötig auf Brot einzuengen.
- source_word: לְבַדִּי
  choice: allein
  rationale: Gibt die adverbiale Bedeutung knapp und idiomatisch wieder.
- source_word: יָתוֹם
  choice: das vaterlose Kind
  rationale: Der hebräische Ausdruck bezeichnet besonders ein Kind ohne Vater und trägt den sozialen Aspekt der Schutzbedürftigkeit. Die Formulierung ist im heutigen Deutsch verständlicher als das substantivierte „der Vaterlose“.
- source_word: מִמֶּנָּה
  choice: davon
  rationale: Das Suffix verweist auf den Bissen beziehungsweise die Nahrung; „davon“ ist im Deutschen die natürliche Wiedergabe.
