  text: wenn ich meinen Bissen allein gegessen habe und das vaterlose Kind[a] nicht davon gegessen hat –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Waise“. Das hebräische Wort bezeichnet einen Vaterlosen, besonders ein Kind ohne Vater.'
