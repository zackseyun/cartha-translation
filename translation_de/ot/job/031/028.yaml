  text: this too would be an iniquity for the judges[b][a], for I would have denied God above.
translation:
  language: de
  text: Auch das wäre ein gerichtlich zu ahndendes Vergehen[a], denn ich hätte Gott in der Höhe verleugnet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Vergehen, über das Richter zu entscheiden hätten“, „ein gerichtliches Vergehen“ oder „ein Vergehen, das vor Gericht gehört“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn ich wäre Gott in der Höhe untreu geworden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Auch das
  rationale: Die Wendung bezieht die zuvor beschriebene Handlung in die Reihe der von Hiob zurückgewiesenen Vergehen ein und verweist natürlich auf sie zurück.
- source_word: עָוֺן
  choice: Vergehen
  rationale: Das Wort bezeichnet schuldhaftes Unrecht und trägt hier aufgrund des folgenden Rechtsbegriffs sowohl moralisches als auch rechtliches Gewicht.
- source_word: פְּלִילִי
  choice: das vor Gericht gehört
  rationale: Der Ausdruck gehört zum Bereich richterlicher Entscheidung. Die Formulierung ist im heutigen Deutsch verständlich, ohne die genuine Unschärfe zwischen gerichtlicher Zuständigkeit, Strafwürdigkeit und Urteil aufzulösen.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung dafür ein, weshalb die vorausgesetzte Handlung ein gerichtlich zu behandelndes Vergehen wäre.
- source_word: כִחַשְׁתִּי
  choice: ich hätte … verleugnet
  rationale: Im Zusammenhang mit der Hinwendung zu Gestirnen bezeichnet das Verb nicht nur eine falsche Aussage, sondern die Verleugnung beziehungsweise Untreue gegenüber Gott. Der Irrealis ergibt sich aus dem hypothetischen Zusammenhang des Abschnitts.
- source_word: לָאֵל מִמָּעַל
  choice: Gott in der Höhe
  rationale: Die knappe Ortsangabe bleibt erhalten und wahrt den Kontrast zwischen Gott in der Höhe und den zuvor genannten Himmelskörpern, ohne ausdrücklich „Himmel“ hinzuzufügen.
theological_decisions:
- issue: Ob מִמָּעַל als „in der Höhe“ knapp wiederzugeben oder zu „im Himmel“ zu erweitern ist
  choice: Gott in der Höhe
  alternative: Gott im Himmel; Gott droben
  rationale: Der hebräische Text nennt die Höhe, aber nicht ausdrücklich den Himmel. Die gewählte Fassung bewahrt den vertikalen Kontrast und vermeidet eine nicht notwendige theologische Ausdeutung.
- issue: Ob כחשׁ die Verleugnung Gottes oder allgemeiner die Untreue gegenüber Gott bezeichnet
  choice: Gott … verleugnet
  alternative: Gott in der Höhe die Treue gebrochen; Gott gegenüber falsch gehandelt
  rationale: „Verleugnet“ passt zum Kontext eines möglichen Götzendienstes und gibt die Beziehungsrichtung der hebräischen Konstruktion prägnant wieder; die breitere Bedeutung der Untreue wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vor Gericht gehört“ vermittelt den juristischen Charakter verständlich, während die Fußnote die möglichen engeren Deutungen des seltenen Ausdrucks festhält. Die Satzstellung bleibt knapp und folgt dem begründenden Aufbau des Hebräischen.
