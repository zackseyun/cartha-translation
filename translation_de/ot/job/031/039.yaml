  text: if I have eaten its produce without payment[a], or caused its owners to lose heart—
translation:
  language: de
  text: wenn ich seinen Ertrag gegessen habe, ohne dafür zu bezahlen, oder seinen Besitzern die Lebenskraft geraubt habe[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, möglicherweise stärker: »seinen Besitzern das Leben genommen habe«. Wörtlich kann die Wendung etwa bedeuten: »die Lebenskraft seiner Besitzer ausgehaucht habe« oder »seine Besitzer nach Luft schnappen ließ«. Das seltene hebräische Verb ist in seiner genauen Bedeutung unsicher und kann schwere Unterdrückung beziehungsweise Erschöpfung oder möglicherweise den Tod bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּחָהּ
  choice: seinen Ertrag
  rationale: כֹּחַ bedeutet wörtlich »Kraft«, kann hier aber die Ertragskraft des Landes und damit seinen Ertrag bezeichnen. Das feminine Suffix bezieht sich auf das Land aus dem Zusammenhang.
- source_word: אָכַלְתִּי
  choice: ich … verzehrt habe
  rationale: Das gewöhnliche Verb »essen« bezeichnet hier den Verbrauch des Ertrags. »Verzehrt« klingt im Deutschen in diesem Zusammenhang natürlich und bewahrt den konkreten Sinn.
- source_word: בְלִי כָסֶף
  choice: ohne dafür zu bezahlen
  rationale: כֶּסֶף heißt wörtlich »Silber«, bezeichnet aber häufig Geld beziehungsweise Bezahlung. Die Formulierung macht den Vorwurf unrechtmäßiger Aneignung klar.
- source_word: נֶפֶשׁ בְּעָלֶיהָ
  choice: seine Besitzer um ihr Leben
  rationale: נֶפֶשׁ kann »Leben«, »Seele«, »Person« oder »Atem« bedeuten. Mit dem schwierigen Verb הִפָּחְתִּי ist »um ihr Leben gebracht« eine mögliche, sprachlich klare Wiedergabe; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: הִפָּחְתִּי
  choice: gebracht habe
  rationale: Der seltene Hifil von נפח kann hier möglicherweise das Aushauchen des Lebens, das Nach-Luft-Ringen oder schwere Zermürbung ausdrücken. Die Hauptübersetzung gibt die stärkere, traditionelle Deutung wieder, ohne die Alternativen zu verschweigen.
- source_word: בְּעָלֶיהָ
  choice: seine Besitzer
  rationale: Der Plural von בַּעַל mit femininem Suffix bezeichnet diejenigen, denen das Land gehört. Das deutsche Pronomen richtet sich grammatisch nach »Land«.
