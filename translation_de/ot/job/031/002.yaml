  text: And what is the portion from God above[a], and the inheritance from the Almighty from on high?
translation:
  language: de
  text: Und was ist der Anteil von Gott aus der Höhe[a] und das Erbe vom Allmächtigen aus den Höhen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Gott droben … vom Allmächtigen aus den Höhen“. Die erste hebräische Wendung kann auch enger mit „Gott“ verbunden werden; beide Wendungen betonen die Herkunft von oben bzw. aus den Höhen.'
    reason: Lexikalisch-syntaktische Alternative
lexical_decisions:
- source_word: וּמֶה
  choice: Und was wäre
  rationale: Die Konjunktion führt den Gedankengang fort; die rhetorische Frage verlangt im Deutschen idiomatisch den Konjunktiv „wäre“.
- source_word: חֵלֶק
  choice: der Anteil
  rationale: חֵלֶק bezeichnet einen zugeteilten Anteil und steht parallel zu „Erbe“.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Die poetische Singularform wird mit der allgemein verständlichen Gottesbezeichnung wiedergegeben.
- source_word: מִמָּעַל
  choice: droben
  rationale: Das Wort bezeichnet den Bereich oben; „Gott droben“ erhält die mögliche Zuordnung zu Gott, ohne die adverbiale Deutung auszuschließen.
- source_word: וְנַחֲלַת
  choice: und das Erbe
  rationale: נַחֲלָה bezeichnet Erbe beziehungsweise zugeteilten Besitz und bildet den poetischen Parallelbegriff zu „Anteil“.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Der traditionelle, verständliche deutsche Titel gibt שַׁדַּי wieder, ohne ihn als Eigennamen zu transliterieren.
- source_word: מִמְּרֹמִים
  choice: aus den Höhen
  rationale: Die Wiedergabe bewahrt sowohl die Präposition „aus/von“ als auch die Mehrzahl des hebräischen Wortes für Höhen.
theological_decisions:
- issue: Parallele Gottesbezeichnungen in der hebräischen Poesie
  choice: אֱלוֹהַּ als „Gott“ und שַׁדַּי als „der Allmächtige“ übersetzen
  alternative: „Gott … Schaddai“
  rationale: Beide Bezeichnungen werden für heutige Leser verständlich wiedergegeben; ihre poetische Parallelität bleibt bestehen.
- issue: Zuordnung der räumlichen Ausdrücke
  choice: „von Gott droben … vom Allmächtigen aus den Höhen“
  alternative: „von Gott aus der Höhe … vom Allmächtigen aus den Höhen“
  rationale: Der Haupttext lässt מִמָּעַל näher bei „Gott“ stehen, während die Fußnote die ebenfalls mögliche adverbiale Lesart als Angabe der himmlischen Herkunft festhält.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelität. „Droben“ ist leicht gehoben, aber geläufig und bewahrt die räumliche Mehrdeutigkeit des Hebräischen.
