translation:
  language: de
  text: Dann öffnet er den Menschen das Ohr und versiegelt ihre Unterweisung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und versiegelt ihre Warnung“ beziehungsweise „und versiegelt ihre Zurechtweisung“. Das hebräische Wort מוּסָר kann Unterweisung, Zurechtweisung, Erziehung oder Warnung bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das Zeitadverb führt die in den vorhergehenden Versen beschriebene göttliche Mitteilung weiter und markiert ihre Folge.
- source_word: יִגְלֶה אֹזֶן
  choice: öffnet … das Ohr
  rationale: גלה bedeutet grundsätzlich „aufdecken/enthüllen“. In Verbindung mit „Ohr“ liegt eine feste Wendung für das Erschließen des Hörens und Verstehens vor. Die deutsche Formulierung bewahrt das Bild und klingt idiomatisch.
- source_word: אֲנָשִׁים
  choice: den Menschen
  rationale: אֲנָשִׁים bezeichnet hier Menschen allgemein. „Den Menschen“ gibt den kollektiven Bezug in natürlichem modernem Deutsch wieder, ohne die Aussage unnötig auf männliche Personen zu verengen.
- source_word: וּבְמֹסָרָם
  choice: ihre Unterweisung
  rationale: מוּסָר umfasst Unterweisung, Zurechtweisung, Erziehung und Warnung. „Unterweisung“ passt zum Zusammenhang göttlicher Mitteilung, während die Fußnote die möglichen mahnenden und disziplinierenden Nuancen offenhält.
- source_word: יַחְתֹּם
  choice: versiegelt
  rationale: חתם bezeichnet das Versiegeln und kann hier das feste Einprägen oder Bekräftigen der Unterweisung ausdrücken. „Versiegelt“ erhält die konkrete Metapher des hebräischen Textes.
