source:
  edition: WLC
  text: הֶן זֹ֣את לֹא צָדַ֣קְתָּ אֶעֱנֶ֑/ךָּ כִּֽי יִרְבֶּ֥ה אֱ֝ל֗וֹהַ מֵ/אֱנֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/012.yaml
  text: Look[a], in this you are not right; I will answer you, for God is greater than man.
translation:
  language: de
  text: Sieh, darin hast du nicht recht. Ich will dir antworten, denn Gott ist größer als der Mensch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als ein Sterblicher“. Das hebräische אֱנוֹשׁ hebt oft die Schwachheit und Sterblichkeit des Menschen hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel leitet einen nachdrücklichen Einwand ein. „Sieh“ bewahrt diesen Aufforderungscharakter in knapper, würdiger Form.
- source_word: זֹאת לֹא צָדַקְתָּ
  choice: darin hast du nicht recht
  rationale: צדק bezeichnet hier das Rechtbehalten in der vorliegenden Auseinandersetzung, nicht allgemein moralische Gerechtigkeit. „Darin“ bezieht זֹאת natürlich auf Hiobs Aussage.
- source_word: אֶעֱנֶךָּ
  choice: Ich antworte dir
  rationale: Das Imperfekt kann im unmittelbaren Redegang als gegenwärtig einsetzende Antwort wiedergegeben werden. Die deutsche Präsensform ist hier natürlicher als ein ausdrücklich futurisches „ich werde dir antworten“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für Elihus Widerspruch beziehungsweise seine Antwort ein und wird im Deutschen klar kausal wiedergegeben.
- source_word: יִרְבֶּה אֱלוֹהַ
  choice: Gott ist größer
  rationale: רבה steht mit מן vergleichend und bezeichnet hier Gottes Überlegenheit, nicht zahlenmäßige Vermehrung.
- source_word: מֵאֱנוֹשׁ
  choice: als der Mensch
  rationale: Der generische Singular stellt Gott dem schwachen Menschen gegenüber. „Der Mensch“ ist im modernen Standarddeutsch eine natürliche und formgetreue Wiedergabe; die Nuance der Sterblichkeit wird in der Fußnote ausgewiesen.
theological_decisions:
- issue: Wiedergabe von אֱנוֹשׁ als Bezeichnung des Menschen
  choice: der Mensch
  alternative: ein Sterblicher
  rationale: Der hebräische Ausdruck bezeichnet den Menschen häufig unter dem Gesichtspunkt seiner Schwachheit und Sterblichkeit. Im Haupttext bleibt der generische Gegensatz zwischen Gott und Mensch erhalten, ohne die Bedeutung auf eine einzelne Person einzuengen; die stärker deutende Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe direkte Anrede und der argumentative Zusammenhang des hebräischen Satzes bleiben erhalten; die beiden Hauptaussagen werden zur besseren Lesbarkeit in zwei Sätze gegliedert.
