source:
  edition: WLC
  text: בַּ/חֲל֤וֹם חֶזְי֬וֹן לַ֗יְלָה בִּ/נְפֹ֣ל תַּ֭רְדֵּמָה עַל אֲנָשִׁ֑ים בִּ֝/תְנוּמ֗וֹת עֲלֵ֣י מִשְׁכָּֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/015.yaml
  text: In a dream[a], a vision of the night, when deep sleep falls on men, in slumbers on the bed,
translation:
  language: de
  text: im Traum, in einer nächtlichen Vision, wenn tiefer Schlaf auf Menschen[a] fällt, wenn sie auf dem Lager schlummern,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Männer. Das hebräische Wort kann Männer bezeichnen, wird hier jedoch allgemein für Menschen gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: im Traum
  rationale: Die Präposition ב bezeichnet hier den Rahmen bzw. das Mittel der Offenbarung. »Im Traum« ist idiomatisch und wahrt die poetische Parallele zur Vision.
- source_word: חֶזְיוֹן לַיְלָה
  choice: in einer nächtlichen Vision
  rationale: Die Konstruktion bedeutet wörtlich »Vision der Nacht«. Die adjektivische Wiedergabe ist im Deutschen natürlich und bewahrt den nächtlichen Offenbarungsrahmen.
- source_word: בִּנְפֹל
  choice: wenn … fällt
  rationale: Der Infinitiv mit ב leitet eine temporale Bestimmung ein; »wenn« gibt diese Funktion klar und natürlich wieder.
- source_word: תַּרְדֵּמָה
  choice: tiefer Schlaf
  rationale: Das Wort bezeichnet einen schweren, tiefen Schlaf, ohne zwingend einen ekstatischen Zustand auszudrücken.
- source_word: עַל אֲנָשִׁים
  choice: auf Menschen
  rationale: אֲנָשִׁים ist formal maskulin, kann aber allgemein Menschen bezeichnen. Im vorliegenden allgemeinen Satz gibt »Menschen« den generischen Sinn im modernen Deutschen präzise wieder.
- source_word: בִּתְנוּמוֹת
  choice: wenn sie … schlummern
  rationale: Der hebräische poetische Plural bezeichnet Schlummerzustände. Die verbale Wiedergabe vermeidet das unnatürliche deutsche »in Schlummern« und erhält den zeitlichen Parallelismus.
- source_word: עֲלֵי מִשְׁכָּב
  choice: auf dem Lager
  rationale: Die singularische, poetisch-kollektive Form wird beibehalten. »Lager« entspricht dem würdevollen poetischen Register besser als das alltäglichere »Bett«.
theological_decisions:
- issue: Generische Bedeutung von אֲנָשִׁים
  choice: Menschen
  alternative: Männer
  rationale: Der Kontext formuliert allgemein, wie Gott zu Menschen spricht. »Menschen« bewahrt diesen generischen Bezug; die formal mögliche geschlechtsspezifische Wiedergabe wird in der Fußnote genannt, ohne sie in den Haupttext hineinzulesen.
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch verständlich. Der Vers bleibt als syntaktisch weiterführende Zeile mit Schlusskomma stehen. Die zweite temporale Wendung wird aus Gründen natürlicher deutscher Syntax verbal wiedergegeben.
