base_translation:
  language: en
  yaml_path: translation/ot/job/033/018.yaml
  text: He spares his soul from the pit[c][b][a], and his life from passing by the weapon.
translation:
  language: de
  text: Er bewahrt seine Seele vor der Grube[a] und sein Leben vor dem Tod durch eine Waffe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor dem Grab« oder »vor dem Verderben«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann genauer ein Geschoss, einen Wurfspieß oder möglicherweise ein Schwert bezeichnen. Die hebräische Wendung bedeutet hier, vor dem Tod durch eine solche Waffe bewahrt zu werden.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: יַחְשֹׂךְ
  choice: bewahrt … vor
  rationale: Das Hifil von חשׂך bezeichnet hier das Zurückhalten beziehungsweise Verschonen. »Bewahrt … vor« drückt die verhinderte Todesgefahr in natürlichem Deutsch aus.
- source_word: נַפְשׁוֹ
  choice: seine Seele
  rationale: נפש kann Seele, Leben oder die ganze Person bezeichnen. »Seele« bewahrt die Bild- und Ausdrucksweise des ersten Halbverses; der Parallelismus mit »sein Leben« macht den lebensrettenden Sinn deutlich.
- source_word: מִנִּי שָׁחַת
  choice: vor der Grube
  rationale: שׁחת kann die Grube, das Grab oder das Verderben bezeichnen. Die konkrete Wiedergabe »Grube« erhält das poetische Bild für den drohenden Tod.
- source_word: וְחַיָּתוֹ
  choice: sein Leben
  rationale: Das Wort bezeichnet hier das Leben des Menschen und steht parallel zu נַפְשׁוֹ.
- source_word: מֵעֲבֹר בַּשָּׁלַח
  choice: davor, durch eine Waffe umzukommen
  rationale: Die wörtliche Bewegungsformulierung mit עבר ist im Deutschen schwer verständlich. Im Zusammenhang bezeichnet sie das Verhindern eines gewaltsamen Todes; »umzukommen« gibt diesen Sinn idiomatisch wieder, ohne die genaue Waffenart festzulegen.
- source_word: בַּשָּׁלַח
  choice: durch eine Waffe
  rationale: שׁלח kann hier eine Waffe, besonders ein Geschoss oder einen Wurfspieß, bezeichnen. »Waffe« wahrt die lexikalische Unsicherheit; die Fußnote nennt die engeren Möglichkeiten.
theological_decisions:
- issue: Verhältnis von »Seele« und »Leben«
  choice: Die beiden unterschiedlichen deutschen Begriffe werden entsprechend dem hebräischen Parallelismus beibehalten.
  alternative: Beide Glieder ausschließlich mit »Leben« oder mit einer strikten Trennung von Seele und Körper wiederzugeben.
  rationale: Der Vers beschreibt poetisch die Bewahrung der ganzen Person vor dem Tod und begründet keine feste anthropologische Zweiteilung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Parallelität von »Seele« und »Leben« sowie das Bild der Grube bleiben erhalten; die schwierige zweite Wendung wird verständlich wiedergegeben und in der Fußnote transparent gemacht.
