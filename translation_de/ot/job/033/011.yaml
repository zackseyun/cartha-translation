  yaml_path: translation/ot/job/033/011.yaml
  text: He puts my feet in the stocks[a]; he watches all my paths.
translation:
  language: de
  text: Er legt meine Füße in den Fußblock; er beobachtet alle meine Pfade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „er bewacht alle meine Pfade“. Das hebräische Verb kann sowohl „beobachten“ als auch „bewachen“ bedeuten; hier spricht der Zusammenhang eher für kontrollierende Beobachtung als für Schutz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: legt
  rationale: Das häufige Verb שׂים bedeutet „setzen, legen, stellen“. Mit „meine Füße in den Block“ ist „legt“ im Deutschen natürlich.
- source_word: בַּסַּד
  choice: in den Block
  rationale: סַד bezeichnet eine Vorrichtung, in der die Füße zur Fesselung festgehalten werden. „Block“ bewahrt das konkrete Bild und ist im Zusammenhang verständlich.
- source_word: רַגְלָי
  choice: meine Füße
  rationale: Die Form mit dem Suffix der 1. Person Singular bezeichnet die Füße des Sprechers.
- source_word: יִשְׁמֹר
  choice: beobachtet
  rationale: שׁמר kann „bewachen“, „hüten“ oder „beobachten“ bedeuten. Im Kontext von Hiobs Klage über feindselige Behandlung bezeichnet es am ehesten genaue, kontrollierende Beobachtung, ohne den möglichen Sinn „bewachen“ zu verschweigen.
- source_word: כָּל
  choice: alle
  rationale: Die umfassende Mengenangabe passt idiomatisch zum Plural „Pfade“.
- source_word: אָרְחֹתָי
  choice: meine Pfade
  rationale: אֹרַח bezeichnet einen Pfad oder Weg und kann bildlich den Lebenswandel meinen. „Pfade“ erhält die Wegmetapher.
theological_decisions:
- issue: Ob Gottes Handeln im zweiten Halbvers als schützendes Bewahren oder als kontrollierende Beobachtung wiederzugeben ist
  choice: 'kontrollierende Beobachtung: „er beobachtet alle meine Pfade“'
  alternative: 'schützendes oder neutrales Bewachen: „er bewacht alle meine Pfade“'
  rationale: Elihu gibt hier Hiobs Klage wieder, Gott behandle ihn wie einen Gegner und schränke ihn ein. Daher liegt im Kontext eine prüfende beziehungsweise feindselige Beobachtung näher; die lexikalische Mehrdeutigkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der konkrete „Block“ und die Wegmetapher „Pfade“ bleiben erhalten; die knappe Parallelstruktur des Hebräischen wird nachgebildet.
