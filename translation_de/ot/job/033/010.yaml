  variant: modern standard German
source:
  edition: WLC
  text: הֵ֣ן תְּ֭נוּאוֹת עָלַ֣/י יִמְצָ֑א יַחְשְׁבֵ֖/נִי לְ/אוֹיֵ֣ב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/010.yaml
  text: Look[a], he finds grounds for hostility against me; he counts me as his enemy.
translation:
  language: de
  text: Sieh, er findet Gründe zur Feindschaft gegen mich[a]; er hält mich für seinen Feind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Er findet Feindseligkeiten gegen mich“, „er findet Anlässe gegen mich“ oder vielleicht „er findet Beschwerden gegen mich“. Das hebräische Substantiv ist selten und vom Zusammenhang abhängig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Partikel lenkt nachdrücklich die Aufmerksamkeit auf die folgende Aussage. „Sieh“ bewahrt diese Funktion in knapper, würdiger Gegenwartssprache.
- source_word: תְּנוּאוֹת
  choice: Gründe zur Feindschaft
  rationale: Das seltene, kontextabhängige Substantiv kann feindselige Anlässe, Widerstände oder Beschwerden bezeichnen. Die Wendung verbindet den Gedanken gefundener Gründe mit dem feindlichen Verhältnis, ohne ein Erfinden von Anschuldigungen zu behaupten.
- source_word: עָלַי
  choice: gegen mich
  rationale: Im Zusammenhang mit feindseligen Gründen hat עַל hier am ehesten adversative Bedeutung.
- source_word: יִמְצָא
  choice: er findet
  rationale: Die Grundbedeutung von מצא bleibt erhalten. Eine stärkere Wiedergabe wie „erfindet“ würde die Anklage interpretierend verschärfen.
- source_word: יַחְשְׁבֵנִי
  choice: er hält mich
  rationale: חשב bezeichnet hier das Einschätzen oder Ansehen einer Person. „Hält mich für“ ist im modernen Deutschen natürlich und bewahrt den wertenden Sinn.
- source_word: לְאוֹיֵב לוֹ
  choice: für seinen Feind
  rationale: Die Konstruktion bezeichnet die Rolle, in der Gott Hiob nach dessen wiedergegebener Klage betrachtet; „für seinen Feind“ gibt dies idiomatisch wieder.
theological_decisions:
- issue: Sprecherperspektive auf Gottes Behandlung Hiobs
  choice: Elihus Wiedergabe von Hiobs Klage wird mit „er findet Gründe zur Feindschaft gegen mich“ übersetzt.
  alternative: „Er erfindet Anschuldigungen gegen mich“ oder „er findet Anlässe gegen mich“.
  rationale: Der Vers gibt Hiobs Wahrnehmung wieder, ohne sie als theologische Aussage des Erzählers zu bestätigen. „Findet“ erhält die Spannung und vermeidet die zusätzliche Behauptung, Gott fabriziere falsche Vorwürfe.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdiger Rede. Die parallelen Aussagen bleiben eng am hebräischen Satzbau, während „hält mich für“ natürliches deutsches Idiom bietet.
