base_translation:
  language: en
  yaml_path: translation/ot/job/033/026.yaml
  text: He prays to God[a], and he accepts him; he sees his face with a shout of joy[c][b], and he restores to man his righteousness.
translation:
  language: de
  text: Er betet zu Gott[a], und Gott nimmt ihn gnädig an. Unter Jubel sieht er sein Angesicht[b], und Gott gibt dem Menschen seine Gerechtigkeit zurück.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er fleht zu Gott.“ Das hebräische Verb kann das eindringliche Bitten im Gebet hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist wahrscheinlich: Er sieht Gottes Angesicht. Im Hebräischen steht nur „sein Angesicht“; grammatisch ist auch der Bezug auf den Menschen möglich.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „seinen rechten Stand“ beziehungsweise „seine Rehabilitierung“. Das hebräische Wort für „Gerechtigkeit“ kann hier die wiederhergestellte Stellung des Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעְתַּר
  choice: betet
  rationale: Das Verb עתר bezeichnet hier ein ernstliches, an Gott gerichtetes Bitten. „Betet“ ist natürlich und verständlich; die stärkere Nuance des Flehens wird in der Fußnote bewahrt.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: אֱלוֹהַּ ist im Buch Hiob eine poetische Singularbezeichnung für Gott. Ein Zusatz wie „der Allmächtige“ steht hier nicht im hebräischen Text.
- source_word: וַיִּרְצֵהוּ
  choice: und Gott nimmt ihn gnädig an
  rationale: רצה bezeichnet hier Gottes wohlwollende Annahme des Betenden. Das ausdrücklich wiederholte „Gott“ macht den erschlossenen Subjektwechsel im Deutschen verständlich.
- source_word: וַיַּרְא פָּנָיו
  choice: sieht er sein Angesicht
  rationale: Die Formulierung bleibt nahe am knappen Hebräisch und bewahrt das Pronomen. Im Zusammenhang ist Gottes Angesicht wahrscheinlich gemeint, doch die Fußnote weist auf die grammatische Mehrdeutigkeit hin.
- source_word: בִּתְרוּעָה
  choice: unter Jubel
  rationale: תְּרוּעָה bezeichnet einen hörbaren Jubel- oder Freudenruf. „Unter Jubel“ klingt im Deutschen natürlich und erhält den freudigen, laut vernehmbaren Charakter.
- source_word: וַיָּשֶׁב
  choice: gibt … zurück
  rationale: Die Hifil-Form von שוב ist kausativ und bedeutet hier, dass Gott etwas wiederherstellt beziehungsweise zurückgibt.
- source_word: לֶאֱנוֹשׁ
  choice: dem Menschen
  rationale: אֱנוֹשׁ bezeichnet den sterblichen Menschen. „Dem Menschen“ ist im modernen Standarddeutsch allgemein verständlich und lässt die Aussage auf die menschliche Person im Zusammenhang bezogen.
- source_word: צִדְקָתוֹ
  choice: seine Gerechtigkeit
  rationale: צְדָקָה bedeutet zunächst „Gerechtigkeit“, kann hier aber auch den wiederhergestellten rechten Stand oder die Rechtfertigung des Menschen bezeichnen. Die wörtlichere Wiedergabe hält diese Bedeutungsbreite offen.
theological_decisions:
- issue: Bezug der Pronomen in „nimmt ihn an; sieht sein Angesicht“
  choice: Gott nimmt den betenden Menschen an; danach sieht der Mensch Gottes Angesicht.
  alternative: Grammatisch könnte der zweite Satz auch so verstanden werden, dass Gott das Angesicht des Menschen sieht; weniger wahrscheinlich wäre, dass der Mensch Gott annimmt.
  rationale: Der Zusammenhang schildert die Hinwendung des Menschen zu Gott und die Wiederherstellung der Gemeinschaft. Das Sehen von Gottes Angesicht passt als Ausdruck göttlicher Gunst; die im Hebräischen verbleibende Pronomenmehrdeutigkeit wird jedoch nicht verschwiegen.
- issue: Bedeutung von „seine Gerechtigkeit“
  choice: Die dem Menschen zugehörige beziehungsweise wiederhergestellte Gerechtigkeit oder sein rechter Stand.
  alternative: Gemeint sein könnte seine Rechtfertigung beziehungsweise Wiederherstellung; eine speziell zugerechnete Gerechtigkeit Gottes lässt sich aus diesem Vers allein nicht eindeutig ableiten.
  rationale: Das Suffix bezieht sich am natürlichsten auf den Menschen. „Seine Gerechtigkeit“ wahrt den Wortlaut und legt keine spätere dogmatische Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischem Klang. Die Satzfolge wird durch die ausdrückliche Nennung Gottes verständlich gemacht, während die echte Mehrdeutigkeit der Pronomen und der Ausdruck „seine Gerechtigkeit“ in den Fußnoten erhalten bleiben.
