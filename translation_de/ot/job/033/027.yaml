  yaml_path: translation/ot/job/033/027.yaml
  text: He sings before men and says, ‘I have sinned and twisted what was right, and it was not repaid to me.’
translation:
  language: de
  text: 'Er singt vor den Menschen und sagt: »Ich habe gesündigt und das Gerade verdreht, doch mir wurde nicht entsprechend vergolten.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die letzte Wendung ist ungewöhnlich und kann auch heißen: „und es hat mir nichts genützt.“ Das erste Verb des Verses wird teilweise statt „er singt“ als „er blickt“ verstanden.'
    reason: Bewahrt zwei echte lexikalische Unsicherheiten des hebräischen Textes, ohne den Haupttext unnötig schwer verständlich zu machen.
lexical_decisions:
- source_word: יָשֹׁר
  choice: Er singt
  rationale: Die Form wird hier als seltene beziehungsweise abweichende Bildung zu שׁיר („singen“) verstanden; „vor den Menschen“ ergibt dazu einen natürlichen öffentlichen Rahmen. Die ebenfalls vertretene Ableitung von שׁור („blicken“) bleibt in der Fußnote sichtbar.
- source_word: יָשָׁר הֶעֱוֵיתִי
  choice: das Gerade verdreht
  rationale: Bewahrt das konkrete Gegensatzpaar „gerade/richtig“ und „krumm machen/verdrehen“, ohne es auf eine bestimmte Art moralischen Fehlverhaltens einzuengen.
- source_word: וְלֹא שָׁוָה לִי
  choice: doch mir wurde nicht entsprechend vergolten
  rationale: Gibt im Zusammenhang die Aussage wieder, dass die begangene Sünde dem Sprecher nicht in entsprechendem Maß heimgezahlt wurde. Die ungewöhnliche, knappe hebräische Wendung und ihre mögliche Bedeutung „es hat mir nicht genützt“ werden in der Fußnote offengelegt.
theological_decisions:
- issue: Verhältnis von Sündenbekenntnis und ausbleibender Vergeltung
  choice: „mir wurde nicht entsprechend vergolten“ lässt erkennen, dass die Strafe nicht dem Bekenntnis zufolge ausfiel, ohne den Handelnden ausdrücklich zu benennen.
  alternative: „es hat mir nichts genützt“ beziehungsweise „es war mir nicht gleichwertig“
  rationale: Der Kontext von Rettung und Verschonung stützt die Vergeltungsbedeutung, doch die sprachliche Mehrdeutigkeit wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Das Gerade verdreht“ erhält das anschauliche hebräische Wortspiel; die direkte Rede bleibt knapp und bekenntnishaft.
