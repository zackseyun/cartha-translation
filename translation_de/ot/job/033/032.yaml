  variant: modern standard German
source:
  edition: WLC
  text: אִם יֵשׁ מִלִּ֥ין הֲשִׁיבֵ֑/נִי דַּ֝בֵּ֗ר כִּֽי חָפַ֥צְתִּי צַדְּקֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/032.yaml
  text: If you have words[a], answer me; speak, for I desire to justify you.
translation:
  language: de
  text: Wenn du etwas zu sagen hast, antworte mir; sprich, denn ich möchte dir recht geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dich als im Recht erweisen«; auch: »dich rechtfertigen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ מִלִּין
  choice: Wenn du etwas zu sagen hast
  rationale: Die existentielle Wendung bedeutet idiomatisch, dass Job noch Worte beziehungsweise eine Erwiderung hat. Die natürliche deutsche Form bewahrt den Sinn, ohne das unübliche »wenn Worte vorhanden sind« nachzuahmen.
- source_word: הֲשִׁיבֵנִי
  choice: antworte mir
  rationale: Der Hifil-Imperativ von שוב bezeichnet hier im Redekontext das Antworten oder Erwideren.
- source_word: דַּבֵּר
  choice: sprich
  rationale: Der knappe Imperativ führt Elihus unmittelbare Einladung an Job fort.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Elihus Aufforderung ein.
- source_word: חָפַצְתִּי
  choice: ich möchte
  rationale: Die Form drückt Elihus Wunsch beziehungsweise Willen aus; »möchte« klingt im heutigen Deutsch natürlich und gibt die situationsbezogene Absicht wieder.
- source_word: צַדְּקֶךָ
  choice: dir recht geben
  rationale: Die Pielform von צדק bedeutet hier, jemanden als im Recht zu erweisen oder anzuerkennen. »Dir recht geben« ist im Gesprächskontext idiomatisch und vermeidet die im Deutschen leicht dogmatisch verstandene Formulierung »dich rechtfertigen«.
theological_decisions:
- issue: Bedeutung von צַדְּקֶךָ
  choice: dir recht geben
  alternative: dich als im Recht erweisen; dich rechtfertigen
  rationale: Elihu erklärt seine Bereitschaft, Job aufgrund einer überzeugenden Antwort als im Recht anzuerkennen. Der Vers formuliert keine eigenständige Lehre von der Rechtfertigung vor Gott. Die Fußnote bewahrt jedoch die stärkere kausative Nuance, nach der Elihu Job als im Recht erweisen oder rechtfertigen möchte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden kurzen Aufforderungen bewahren Elihus direkten Ton; die idiomatische Wiedergabe vermeidet unnötige Archaismen und unbeabsichtigte konfessionelle Fachsprache.
