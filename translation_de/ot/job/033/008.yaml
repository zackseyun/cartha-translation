base_translation:
  language: en
  yaml_path: translation/ot/job/033/008.yaml
  text: 'Surely you have spoken in my hearing[a], and I have heard the sound of your words:'
translation:
  language: de
  text: 'Gewiss, du hast vor meinen Ohren gesprochen[a], und ich habe den Klang deiner Worte gehört:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in meinen Ohren; und den Klang von Worten höre ich“.'
