lexical_decisions:
- source_word: אַךְ
  choice: Gewiss
  rationale: Die Partikel wirkt hier bekräftigend, nicht einschränkend. „Gewiss“ gibt diesen Nachdruck in würdigem, verständlichem Deutsch wieder.
- source_word: אָמַרְתָּ
  choice: du hast … gesprochen
  rationale: Das Qatal der 2. Person Singular verweist auf Hiobs vorausgegangene Rede. Das Perfekt ist im modernen Deutsch dafür natürlich.
- source_word: בְאָזְנִי
  choice: vor meinen Ohren
  rationale: Die Formulierung bewahrt das konkrete hebräische Hörbild und ist als deutsche Wendung verständlich; das abstraktere „in meiner Gegenwart“ wäre weniger quellennah.
- source_word: וְקוֹל
  choice: und … den Klang
  rationale: קוֹל kann „Stimme“ oder „Klang“ bedeuten. In Verbindung mit „Worten“ ist „Klang“ natürlich und erhält den sinnlichen Akzent.
- source_word: מִלִּין
  choice: deiner Worte
  rationale: Das aramaisierende Pluralwort bedeutet „Worte“. Das Possessivpronomen ist aus dem unmittelbaren Zusammenhang ergänzt und macht den Bezug im Deutschen eindeutig.
- source_word: אֶשְׁמָע
  choice: ich habe … gehört
  rationale: Obwohl die Verbform formal ein Imperfekt ist, berichtet Elihu hier von bereits wahrgenommener Rede. Das deutsche Perfekt verbindet diesen Satzteil natürlich mit dem vorausgehenden Sprechen.
