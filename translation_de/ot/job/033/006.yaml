  text: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
translation:
  language: de
  text: Sieh, vor Gott bin ich, wie du es wünschst[a]; auch ich bin aus Ton geformt worden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „wie dein Mund vor/zu Gott“. Gemeint sein kann: „wie du es wünschst, vor Gott“, „dein Sprecher vor Gott“ oder möglicherweise „dir gleich vor Gott“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „auch ich wurde aus Ton herausgekniffen“. Das hebräische Verb kann das Abkneifen eines Stücks Ton und dessen Formung hervorrufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel hebt die folgende Aussage nachdrücklich hervor. „Sieh“ ist gegenwärtig, würdig und bewahrt die deiktische Kraft.
- source_word: כְפִיךָ לָאֵל
  choice: vor Gott bin ich wie dein Mund
  rationale: Die ungewöhnliche Wendung wird möglichst nah als „wie dein Mund“ wiedergegeben, statt die umstrittene Beziehung vorschnell als „Sprecher“, „Wunsch“ oder „Gleichgestellter“ festzulegen. „Vor Gott“ gibt לָאֵל im Zusammenhang idiomatisch wieder.
- source_word: מֵחֹמֶר
  choice: aus Ton
  rationale: חֹמֶר bezeichnet hier formbares Tonmaterial und trägt das Bild des gemeinsamen menschlichen Ursprungs.
- source_word: קֹרַצְתִּי
  choice: bin ... abgekniffen worden
  rationale: 'Die konkrete Töpferbildlichkeit des Verbs wird erhalten: Ein Stück wird vom Ton abgekniffen beziehungsweise daraus geformt. Die ungewöhnliche Formulierung entspricht der auffälligen Bildsprache des Hebräischen.'
- source_word: גַם אֲנִי
  choice: auch ich
  rationale: Die emphatische Hinzufügung unterstreicht Elihus gemeinsame Geschöpflichkeit mit Hiob.
theological_decisions:
- issue: Elihus Verhältnis zu Hiob und Gott
  choice: Die Hauptzeile bewahrt die wörtliche und mehrdeutige Aussage „wie dein Mund“ und betont durch den zweiten Halbvers Elihus gemeinsame Menschlichkeit mit Hiob.
  alternative: „dein Sprecher vor Gott“, „deinem Wunsch gemäß vor Gott“ oder „dir gleich vor Gott“
  rationale: כְפִיךָ ist komprimiert und umstritten. Eine ausdrücklich vermittelnde oder repräsentative Funktion wäre stärker gedeutet, als der Wortlaut verlangt. Die Fußnote nennt die wesentlichen Möglichkeiten, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wendung „wie dein Mund“ und das handgreifliche Tonbild bleiben bewusst erhalten; die genuine Mehrdeutigkeit wird in der Fußnote erläutert.
