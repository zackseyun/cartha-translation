  text: then he is gracious to him and says[a], ‘Deliver him from going down to the pit[b]; I have found a ransom.’
translation:
  language: de
  text: 'Dann ist er ihm gnädig und sagt: »Erlöse ihn vom Hinabsteigen in die Grube[a]; ich habe ein Lösegeld[b] gefunden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die »Grube« kann hier auch das Grab oder das Verderben bezeichnen, nicht nur eine Vertiefung im Boden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »einen Sühnepreis« beziehungsweise »einen Ausgleich«. Das hebräische Wort kann ein Lösegeld oder eine Ausgleichsleistung bezeichnen, die Befreiung oder Verschonung ermöglicht, und kann in manchen Zusammenhängen Sühneanklänge haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחֻנֶּנּוּ
  choice: Dann ist er ihm gnädig
  rationale: חנן bezeichnet das Erweisen von Gnade, Gunst oder Erbarmen. „Ihm gnädig sein“ bewahrt diese Bedeutungsbreite, ohne den Ausdruck auf bloßes Mitleid zu verengen.
- source_word: וַיֹּאמֶר
  choice: und sagt
  rationale: Das narrative wayyiqtol führt die Handlung fort. Das Präsens passt im Deutschen zu der hier als allgemeiner Fall dargestellten Abfolge und leitet die direkte Rede natürlich ein.
- source_word: פְּדָעֵהוּ
  choice: Erlöse ihn
  rationale: פדה bedeutet befreien, auslösen oder erlösen. „Erlöse“ gibt den Zusammenhang einer durch Lösegeld ermöglichten Befreiung wieder, ohne die Art der Erlösung vollständig festzulegen.
- source_word: מֵרֶדֶת
  choice: davor, ... hinabzusteigen
  rationale: Der Infinitiv von ירד mit מִן drückt aus, dass der Abstieg verhindert wird. Die deutsche Konstruktion ist idiomatisch und bildet diese Funktion genau ab.
- source_word: שָׁחַת
  choice: die Grube
  rationale: שחת bezeichnet hier die Grube als Bild für Grab, Tod oder Verderben. „Grube“ erhält das konkrete Bild und lässt seine weitergehenden Bezüge offen.
- source_word: מָצָאתִי
  choice: ich habe ... gefunden
  rationale: Das Perfekt der ersten Person Singular bezeichnet einen vollzogenen Fund mit gegenwärtiger Bedeutung als Grundlage der Rettung.
- source_word: כֹפֶר
  choice: ein Lösegeld
  rationale: כֹּפֶר kann eine Lösesumme oder Ausgleichsleistung bezeichnen, die Freilassung beziehungsweise Verschonung ermöglicht. „Lösegeld“ ist im unmittelbaren Zusammenhang klar und bewahrt zugleich mögliche Sühneanklänge für die Fußnote.
theological_decisions:
- issue: Bedeutung von כֹּפֶר in Elihus Rede
  choice: Lösegeld
  alternative: Sühnepreis, Ausgleich oder Deckung
  rationale: Der unmittelbare Zusammenhang handelt von der Grundlage, auf der ein Mensch vor dem Hinabsteigen in die Grube bewahrt wird. „Lösegeld“ wahrt den konkreten Gedanken einer die Freilassung ermöglichenden Leistung, ohne spätere dogmatische Kategorien in den Vers hineinzulesen.
- issue: Subjekt von וַיְחֻנֶּנּוּ und וַיֹּאמֶר
  choice: Das im vorangehenden Zusammenhang genannte vermittelnde Wesen
  alternative: Gott als unausgesprochenes Subjekt
  rationale: Die hebräische Verbform nennt das Subjekt nicht ausdrücklich. Der nächstliegende grammatische Bezug ist der Bote beziehungsweise Mittler aus Vers 23; ein Wechsel zu Gott ist kontextuell möglich. Die deutsche Übersetzung bewahrt das Pronomen und entscheidet die Identität nicht ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und bildhaft; „Grube“ und „Lösegeld“ bewahren die konkrete Sprache des Hebräischen. Sämtliche Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
