  yaml_path: translation/ot/job/033/031.yaml
  text: Pay attention[a], Job; listen to me. Be silent[b], and I will speak.
translation:
  language: de
  text: Hör aufmerksam zu, Hiob; hör auf mich. Schweig, und ich werde reden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְשֵׁב
  choice: Hör aufmerksam zu
  rationale: Der Hifil-Imperativ von קשׁב fordert nachdrücklich zu aufmerksamem Zuhören auf. Die Wendung ist im modernen Deutschen natürlich und bewahrt die verstärkte Aufforderung.
- source_word: אִיּוֹב
  choice: Hiob
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: שְׁמַע לִי
  choice: hör auf mich
  rationale: שׁמע mit ל bezeichnet hier ein auf eine Person gerichtetes Hören. „Hör auf mich“ ist idiomatisches modernes Deutsch und unterscheidet sich angemessen von der vorausgehenden Aufforderung zum aufmerksamen Zuhören.
- source_word: הַחֲרֵשׁ
  choice: Schweig
  rationale: Der Imperativ von חרשׁ verlangt in diesem Zusammenhang Stille. „Schweig“ gibt die knappe, direkte Aufforderung würdig und präzise wieder.
- source_word: וְאָנֹכִי
  choice: und ich
  rationale: Die Konjunktion und das ausdrückliche, leicht betonte Personalpronomen werden unmittelbar wiedergegeben.
- source_word: אֲדַבֵּר
  choice: werde reden
  rationale: Das Piel-Imperfekt von דבר bezeichnet hier Elihus anschließende beabsichtigte Rede. „Ich werde reden“ wahrt die zeitliche Folge und klingt natürlich.
