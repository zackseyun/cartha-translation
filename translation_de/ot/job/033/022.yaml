  text: וַ/תִּקְרַ֣ב לַ/שַּׁ֣חַת נַפְשׁ֑/וֹ וְ֝/חַיָּת֗/וֹ לַֽ/מְמִתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/022.yaml
  text: His soul draws near to the pit[b][a], and his life to those who bring death.
translation:
  language: de
  text: Da nähert sich seine Seele der Grube[a] und sein Leben den Todesbringern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Grab“ oder „dem Verderben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Toten“; der hebräische Ausdruck ist schwierig und kann Todesbringer oder den Bereich beziehungsweise die Mächte des Todes bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרַב
  choice: Da nähert sich
  rationale: קרב bedeutet „sich nähern“. Das Präsens passt zur schildernden poetischen Folge; „da“ nimmt die hebräische Verknüpfung auf, ohne zwingend eine abgeschlossene Vergangenheit auszudrücken.
- source_word: לַשַּׁחַת
  choice: der Grube
  rationale: שַׁחַת kann Grube, Grab oder Verderben bezeichnen. „Grube“ bewahrt das konkrete poetische Bild und lässt den Bezug auf den Tod offen.
- source_word: נַפְשׁוֹ
  choice: seine Seele
  rationale: נֶפֶשׁ kann Seele, Leben, Selbst oder Person bedeuten. „Seele“ bewahrt hier die lexikalische Unterscheidung zum parallelen „Leben“, ohne eine bestimmte Lehre über die menschliche Natur festzulegen.
- source_word: וְחַיָּתוֹ
  choice: und sein Leben
  rationale: Das Wort bezeichnet hier das Leben beziehungsweise die lebendige Existenz. „Sein Leben“ ist im Deutschen natürlich und entspricht dem poetischen Parallelismus.
- source_word: לַמְמִתִים
  choice: den Todesbringern
  rationale: Die schwierige Form lässt sich aktiv beziehungsweise kausativ als „die den Tod bringen“ verstehen. „Todesbringer“ erhält diese Kraft, ohne sie vorschnell auf menschliche Henker zu beschränken.
theological_decisions:
- issue: Anthropologische Nuance von נַפְשׁוֹ und וְחַיָּתוֹ im Parallelismus
  choice: „seine Seele“ und „sein Leben“ als poetisch parallele, aber lexikalisch unterschiedene Ausdrücke
  alternative: Beide Ausdrücke stärker angleichen, etwa „sein Leben“ und „sein Dasein“, oder „Seele“ als festen immateriellen Bestandteil deuten
  rationale: Der poetische Parallelismus rechtfertigt keine genaue anthropologische Systematisierung. Die Übersetzung erhält die Unterscheidung, ohne einen strikten Leib-Seele-Dualismus einzutragen.
- issue: Deutung von לַמְמִתִים
  choice: 'aktiv: „den Todesbringern“'
  alternative: „den Toten“ oder Bezug auf Tod beziehungsweise Todesmächte
  rationale: Die Form kann als Bezeichnung für todbringende Akteure verstanden werden, ist jedoch textlich und semantisch schwierig. Die abweichenden Deutungen werden deshalb in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. „Todesbringer“ ist bewusst markant, um die schwierige aktive Form des Hebräischen zu bewahren; die Mehrdeutigkeit wird durch die Fußnote kenntlich gemacht.
