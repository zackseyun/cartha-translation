id: JOB.33.4
reference: Job 33:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רֽוּחַ אֵ֥ל עָשָׂ֑תְ/נִי וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּחַיֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/004.yaml
  text: The Spirit of God has made me[a], and the breath of the Almighty gives me life.
translation:
  language: de
  text: Der Geist Gottes hat mich gemacht[a], und der Atem des Allmächtigen gibt mir Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Atem Gottes hat mich gemacht.« Das hebräische Wort kann auch »Atem« oder »Wind« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: Geist
  rationale: רוּחַ kann »Geist«, »Atem« oder »Wind« bedeuten. In der Verbindung mit Gott und parallel zum lebenspendenden »Atem des Allmächtigen« bezeichnet es hier am ehesten Gottes Geist; die Fußnote bewahrt die echte lexikalische Alternative »Atem«.
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet hier in Parallele zu שַׁדַּי den Gott Israels. »Gott« ist dafür die natürliche deutsche Wiedergabe.
- source_word: עָשָׂתְנִי
  choice: hat mich gemacht
  rationale: עשה bedeutet grundlegend »machen/tun«. Das Perfekt »hat mich gemacht« gibt die abgeschlossene, für den Sprecher weiterhin bedeutsame Handlung wieder, ohne die spezifischere Vorstellung des Formens einzutragen.
- source_word: נִשְׁמַת
  choice: Atem
  rationale: נשמה bezeichnet den Atem, besonders als belebenden Lebensatem. »Atem« erhält sowohl das Schöpfungsmotiv als auch die poetische Parallele zu רוּחַ.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: »Der Allmächtige« ist die geläufige deutsche Wiedergabe des Gottestitels שַׁדַּי und passt zum Sprachgebrauch des Hiobbuches.
- source_word: תְּחַיֵּנִי
  choice: gibt mir Leben
  rationale: Die Kausativbedeutung der Verbform ist »leben lassen/Leben geben«. »Gibt mir Leben« ist klares, gegenwärtiges Deutsch und lässt offen, ob das ursprüngliche Lebensgeben oder die fortdauernde Erhaltung des Lebens im Vordergrund steht.
theological_decisions:
- issue: Ist רוּחַ אֵל als persönlicher »Geist Gottes« oder als unpersönlicher »Atem Gottes« wiederzugeben?
  choice: der Geist Gottes
  alternative: der Atem Gottes
  rationale: Die Wiedergabe »Geist Gottes« unterscheidet רוּחַ im ersten Halbvers von נִשְׁמָה (»Atem«) im zweiten und wahrt so die poetische Parallelität mit ihrer begrifflichen Spannung. Da רוּחַ jedoch auch »Atem« bedeuten kann, wird diese Möglichkeit ausdrücklich in der Fußnote genannt, ohne weitergehende dogmatische Aussagen in den Vers hineinzulesen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die enge poetische Parallelität der beiden Satzhälften bleibt erhalten. »Hat mich gemacht« folgt bewusst dem allgemeinen hebräischen Verb, statt es interpretierend als »geschaffen« oder »geformt« zu präzisieren.
