  text: פָּדָ֣ה נפש/י מֵ/עֲבֹ֣ר בַּ/שָּׁ֑חַת ו/חית/י בָּ/א֥וֹר תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/028.yaml
  text: He has redeemed my soul from passing into the pit[b][a], and my life will look upon the light.
translation:
  language: de
  text: Er hat meine Seele vor dem Gang in die Grube erlöst,[a] und mein Leben wird das Licht sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hat mein Leben davor freigekauft, in die Grube zu geraten.“ Die „Grube“ ist im Hebräischen ein geläufiges Bild für Tod oder Grab.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: פָּדָה
  choice: hat … erlöst
  rationale: Das Verb bezeichnet das Loskaufen oder die rettende Befreiung aus Gefahr. „Erlöst“ wahrt diese Bedeutungsbreite, ohne eine ausdrücklich geleistete Zahlung vorauszusetzen.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder die ganze Person bezeichnen. „Meine Seele“ erhält die poetische Unterscheidung zum folgenden חַיָּתִי („mein Leben“), ohne die Bedeutung auf einen rein immateriellen Teil des Menschen festzulegen.
- source_word: מֵעֲבֹר
  choice: davor … hinabzugehen
  rationale: Die Präposition mit dem Infinitiv bezeichnet das Bewahren vor einer Bewegung in die Grube. Das im Deutschen natürliche „hinabzugehen“ bringt die im Bild vorausgesetzte Abwärtsbewegung zum Todesbereich zum Ausdruck.
- source_word: בַּשַּׁחַת
  choice: in die Grube
  rationale: שַׁחַת bezeichnet eine Grube und kann bildlich für Tod oder Grab stehen. „Grube“ bewahrt das hebräische Bild und lässt dessen Todesbezug bestehen.
- source_word: וְחַיָּתִי
  choice: und mein Leben
  rationale: Das Substantiv bezeichnet das Leben beziehungsweise die lebendige Existenz. Die Wiedergabe hält den poetischen Parallelismus zu „meine Seele“ aufrecht.
- source_word: בָּאוֹר
  choice: das Licht
  rationale: Der hebräische Ausdruck ist bestimmt. Im Gegensatz zur Grube steht das Licht wahrscheinlich für das Leben, doch die Übersetzung bewahrt das konkrete Bild.
- source_word: תִּרְאֶה
  choice: wird … sehen
  rationale: Das Imperfekt lässt sich hier zukunftsbezogen verstehen. „Wird das Licht sehen“ ist im Deutschen natürlich und erhält die Vorstellung, das Licht nach der Rettung zu erleben.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts von פָּדָה
  choice: Er hat meine Seele … erlöst
  alternative: Gott hat meine Seele … erlöst; Er erlöste meine Seele
  rationale: Das Verb steht in der 3. Person Singular Maskulinum, ohne dass in diesem Vers ein Subjekt ausdrücklich genannt wird. Der Kontext legt Gott als Handelnden nahe; „Er“ wahrt jedoch die implizite Formulierung des Hebräischen. Das Perfekt wird als vollendete Rettung mit gegenwärtiger Bedeutung wiedergegeben.
- issue: Anthropologische Bedeutung von נַפְשִׁי
  choice: meine Seele
  alternative: mein Leben; mich
  rationale: Die Wortwahl bewahrt die lexikalische und poetische Spannung zwischen נַפְשִׁי und חַיָּתִי. Sie soll keine bestimmte Lehre über eine Trennung von Seele und Leib festschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. Die Metaphern „Grube“ und „Licht“ bleiben erhalten; „Seele“ und „Leben“ werden unterschieden, ohne eine konfessionell geprägte Anthropologie einzutragen.
