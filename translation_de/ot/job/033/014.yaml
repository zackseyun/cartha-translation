  text: For God speaks in one way[a], and in two, though one does not perceive it.
translation:
  language: de
  text: Denn Gott redet auf eine Weise und auf zwei Weisen, doch man nimmt es nicht wahr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn Gott redet einmal, ja zweimal, doch man beachtet es nicht.« Die hebräischen Zahlwörter können adverbial (»einmal … zweimal«) oder als Hinweis auf verschiedene Weisen des Redens verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Elihus begründende Erklärung ein und bewahrt den kausalen beziehungsweise erläuternden Zusammenhang.
- source_word: בְאַחַת
  choice: auf die eine Weise
  rationale: Die Präposition mit dem Zahlwort kann die Art und Weise bezeichnen; diese Wiedergabe passt zum folgenden parallelen Ausdruck, ohne die mögliche adverbiale Lesart zu verschweigen.
- source_word: יְדַבֶּר
  choice: redet
  rationale: Das Imperfekt bezeichnet hier eine allgemeine beziehungsweise wiederkehrende Handlung; das deutsche Präsens gibt diesen gnomischen Sinn natürlich wieder.
- source_word: אֵל
  choice: Gott
  rationale: Gibt den gebräuchlichen Gottesnamen אֵל im Zusammenhang schlicht wieder, ohne zusätzliche Bedeutungsnuancen einzutragen.
- source_word: וּבִשְׁתַּיִם
  choice: und auf die zweite
  rationale: Bewahrt die zahlenmäßige Parallelität des Hebräischen und ergibt zusammen mit »Weise« aus dem ersten Glied eine natürliche deutsche Ellipse.
- source_word: לֹא
  choice: doch ... nicht
  rationale: Die adversativ-konzessive Verbindung bringt den Gegensatz zwischen Gottes Reden und dem Ausbleiben menschlicher Wahrnehmung klar zum Ausdruck.
- source_word: יְשׁוּרֶנָּה
  choice: man nimmt es nicht wahr
  rationale: שׁור bezeichnet hier das Bemerken oder Wahrnehmen. Das unpersönliche »man« gibt das nicht ausdrücklich genannte generische Subjekt wieder; »es« verweist auf Gottes Reden beziehungsweise dessen Mitteilung.
theological_decisions:
- issue: Nicht ausdrücklich genanntes menschliches Subjekt im letzten Satzglied
  choice: generisches Subjekt »man«
  alternative: »er nimmt es nicht wahr« oder »der Mensch nimmt es nicht wahr«
  rationale: Das Hebräische hat ein unausgedrücktes Subjekt in der 3. Person Maskulin Singular. »Man« bewahrt dessen allgemeinen Sinn, ohne eine bestimmte Person oder eine zusätzliche Geschlechtsaussage einzuführen.
- issue: Deutung der Zahlenangaben
  choice: 'modal: »auf die eine Weise ... auf die zweite«'
  alternative: 'adverbial: »einmal ... zweimal«'
  rationale: Der Kontext nennt anschließend unterschiedliche Formen göttlicher Mitteilung. Da die hebräische Formulierung jedoch auch zeitlich beziehungsweise wiederholend verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht poetische Zahlenparallelität bleibt erhalten; die ausgelassene Wiederholung von »Weise« im zweiten Glied ist im Deutschen natürlich und knapp.
