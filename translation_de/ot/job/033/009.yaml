id: JOB.33.9
reference: Job 33:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זַ֥ךְ אֲנִ֗י בְּֽלִ֫י פָ֥שַׁע חַ֥ף אָנֹכִ֑י וְ/לֹ֖א עָוֺ֣ן לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/009.yaml
  text: ‘I am pure[a], without transgression; I am clean[b], and there is no iniquity in me.’
translation:
  language: de
  text: »Ich bin rein, ohne Vergehen; ich bin unschuldig[a], und keine Schuld ist an mir[b].«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »frei von Schuld«; das hebräische Wort kann sowohl Reinheit als auch Unschuld bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und kein Unrecht ist an mir«; das hebräische Wort kann sowohl Unrecht als auch Schuld bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַךְ
  choice: rein
  rationale: Das prädikative Adjektiv bezeichnet hier moralische Reinheit. »Rein« ist im Deutschen natürlich und gibt die ethische Bedeutung wieder.
- source_word: בְּלִי פָשַׁע
  choice: ohne Vergehen
  rationale: בְּלִי bezeichnet das Fehlen von etwas; פֶּשַׁע kann Vergehen, Übertretung oder Auflehnung meinen. »Ohne Vergehen« wahrt den moralisch-rechtlichen Sinn, ohne den Begriff unnötig auf Rebellion einzuengen.
- source_word: חַף
  choice: unschuldig
  rationale: חַף kann Reinheit beziehungsweise Freiheit von Schuld bezeichnen. »Unschuldig« vermeidet im Deutschen eine schwerfällige Wiederholung von »rein« und bewahrt den forensischen Unterton.
- source_word: עָוֺן
  choice: Schuld
  rationale: עָוֺן kann sowohl schuldhaftes Unrecht als auch die daraus erwachsende Schuld bezeichnen. Mit »Schuld« bleibt die hier mögliche Bedeutung erhalten; »Unrecht« ist als Alternative in der Fußnote genannt.
- source_word: לִי
  choice: an mir
  rationale: Das Hebräische lautet wörtlich »mir/bei mir«. »Keine Schuld ist an mir« gibt die Zuschreibung von Schuld idiomatisch wieder und vermeidet die im Deutschen weniger natürliche Formulierung »keine Schuld ist in mir«.
theological_decisions:
- issue: Tragweite von Hiobs Selbstaussage in Elihus Wiedergabe
  choice: Die Aussage wird unmittelbar und nachdrücklich als Anspruch auf Reinheit und Schuldlosigkeit wiedergegeben.
  alternative: 'Den Anspruch abschwächen (etwa: »Ich halte mich für rein«) oder zu einer ausdrücklichen Lehre absoluter Sündlosigkeit steigern.'
  rationale: Die hebräischen Nominalsätze formulieren die Behauptung direkt. Die Übersetzung bewahrt die Spannung, ohne vorwegzunehmen, ob Elihus Wiedergabe zutrifft oder wie die Aussage theologisch zu beurteilen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele, emphatische Form des hebräischen Verses bleibt erhalten. Die beiden Fußnoten bewahren die Bedeutungsbreite von חַף und עָוֺן; sämtliche Marker stehen im Haupttext.
