  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die höfliche Aufforderung und der hebräische Parallelismus bleiben erkennbar; die zweite Zeile wird für natürliches Deutsch leicht idiomatisch formuliert.
