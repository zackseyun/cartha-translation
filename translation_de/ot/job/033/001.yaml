  text: וְֽ/אוּלָ֗ם שְׁמַֽע נָ֣א אִיּ֣וֹב מִלָּ֑/י וְֽ/כָל דְּבָרַ֥/י הַאֲזִֽינָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/001.yaml
  text: But now[a], Job, please hear my words, and listen to all my speech.
translation:
  language: de
  text: Doch nun, Hiob, höre bitte meine Worte und schenke all meinen Worten Gehör.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und höre all meinen Worten aufmerksam zu“. Im Hebräischen stehen zur Betonung zwei nahezu parallele Ausdrücke („meine Worte“ / „all meine Worte“) und zwei verschiedene Verben des Hörens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Doch nun
  rationale: Kennzeichnet einen deutlichen Übergang in Elihus Rede. „Doch nun“ gibt sowohl die adversative Nuance als auch die hinweisende Diskursfunktion in natürlichem Deutsch wieder.
- source_word: שְׁמַע נָא
  choice: höre bitte
  rationale: Der Imperativ שְׁמַע fordert zum Hören auf; נָא mildert die Aufforderung höflich ab. „Höre bitte“ ist unmittelbar und modern.
- source_word: אִיּוֹב
  choice: Hiob
  rationale: Verwendet die im Deutschen eingebürgerte Namensform.
- source_word: מִלָּי
  choice: meine Worte
  rationale: Gibt den Plural mit Suffix der ersten Person Singular direkt wieder.
- source_word: וְכָל דְּבָרַי
  choice: und allem, was ich sage
  rationale: Bewahrt die umfassende Bedeutung von כָּל und gibt die zweite, nahezu synonyme Wendung idiomatisch wieder, ohne sie vollständig mit „meine Worte“ gleichzusetzen.
- source_word: הַאֲזִינָה
  choice: schenke … Gehör
  rationale: Der Hifil-Imperativ bezeichnet aufmerksames Hinhören. Die deutsche Wendung wahrt die Verstärkung gegenüber dem ersten Hörverb und passt zum würdevollen Register.
theological_decisions: []
