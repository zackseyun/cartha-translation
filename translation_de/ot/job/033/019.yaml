lexical_decisions:
- source_word: וְהוּכַח
  choice: Auch wird er … zurechtgewiesen
  rationale: Der Hofal von יכח bezeichnet ein Zurechtweisen oder Korrigieren. Die passive Form lässt den Handelnden wie im Hebräischen unausgesprochen; „zurechtgewiesen“ bewahrt den korrigierenden Sinn, ohne die Leiden ausdrücklich als Strafe festzulegen. „Auch“ stellt den Zusammenhang mit den zuvor genannten Weisen her, in denen Gott zum Menschen spricht.
- source_word: בְּמַכְאוֹב
  choice: durch Schmerzen
  rationale: מַכְאוֹב bezeichnet Schmerz oder Leiden. Die Präposition ב wird hier instrumental mit „durch“ wiedergegeben; der Plural „Schmerzen“ ist im heutigen Deutsch für körperliches Leiden idiomatisch.
- source_word: עַל מִשְׁכָּבוֹ
  choice: auf seinem Bett
  rationale: Die Wendung bezeichnet unmittelbar den Ort beziehungsweise den Zustand des ans Bett gebundenen Leidenden.
- source_word: וְרִיב
  choice: und durch … Kampf
  rationale: רִיב bedeutet Streit, Auseinandersetzung oder Kampf. In Verbindung mit den Gebeinen ist das Wort bildhaft für heftige innere körperliche Qual. „Kampf“ ist im Deutschen in diesem körperlichen Bild natürlicher als „Streit“, ohne die Metapher aufzulösen. Das instrumentale „durch“ wird aus dem ersten Satzglied sinngemäß ergänzt.
- source_word: עֲצָמָיו
  choice: in seinen Gebeinen
  rationale: Die konkrete Körperbezeichnung bleibt erhalten. „Gebeine“ passt zum dichterischen Register und bezeichnet hier die tiefste körperliche Substanz des Menschen.
- source_word: אֵתָן
  choice: anhaltenden
  rationale: אֵתָן kann dauerhaft, beständig oder stark bedeuten. „Anhaltend“ gibt im Kontext die wahrscheinlich gemeinte fortdauernde Qual wieder; die mögliche Bedeutung „heftig/stark“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Das Leiden als göttliche Zurechtweisung
  choice: Das Leiden erscheint als Mittel der Zurechtweisung, ohne ausdrücklich als Vergeltungsstrafe bezeichnet zu werden.
  alternative: Das Leiden wird entweder als rein strafendes Gericht oder als bloß natürliche Krankheit ohne göttliches Handeln verstanden.
  rationale: Im Zusammenhang von Elihus Rede ist das Leiden eine Weise, in der Gott den Menschen anspricht. Die passive Form und „zurechtgewiesen“ bewahren diese Aussage, ohne eine umfassende Vergeltungslehre in den Vers hineinzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-poetischem Klang. „Gebeine“ bewahrt die Körpermetapher und den gehobenen Ton; die übrige Wortwahl bleibt gegenwärtig und klar.
