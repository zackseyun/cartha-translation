  text: Auch wird er durch Schmerzen auf seinem Bett zurechtgewiesen, und in seinen Gebeinen herrscht ein anhaltender Kampf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In seinen Gebeinen herrscht ein heftiger Kampf.“ Das hebräische Eigenschaftswort kann sowohl „anhaltend/beständig“ als auch „stark/heftig“ bedeuten.'
