  text: to turn a man from his deed[a], and to cover pride from a strong man,
translation:
  language: de
  text: 'um einen Menschen von seinem Tun abzubringen[a]

    und den Hochmut vor einem Mann zu verbergen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „um das Tun eines Menschen zu entfernen; und Hochmut verbirgt er vor einem Mann“. Das Hebräische ist knapp formuliert. Gemeint sein kann entweder, dass der Mensch von seinem Tun abgebracht wird, oder dass ihm das Tun selbst genommen wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְהָסִיר
  choice: abzubringen
  rationale: Der Hifil-Infinitiv von סור bezeichnet hier ein Veranlassen, sich von etwas abzuwenden. „Jemanden von etwas abbringen“ gibt diesen kausativen Sinn im Deutschen natürlich wieder.
- source_word: אָדָם
  choice: einen Menschen
  rationale: „Mensch“ entspricht אָדָם und lässt zugleich die lexikalische Unterscheidung zum folgenden גֶּבֶר als „Mann“ erkennen.
- source_word: מַעֲשֶׂה
  choice: seinem Tun
  rationale: מַעֲשֶׂה kann Tat, Werk oder Tun bedeuten. „Tun“ ist hier weit genug, um die im Hebräischen nicht ausdrücklich bestimmte Handlung nicht vorschnell als einzelne böse Tat festzulegen; der sinngemäße Besitzbezug wird durch „seinem“ ausgedrückt.
- source_word: וְגֵוָה
  choice: und den Hochmut
  rationale: גֵּוָה bezeichnet hier stolze Selbsterhebung. „Hochmut“ bewahrt den negativen moralischen Gehalt präziser als das im Deutschen teils positiv verstandene „Stolz“.
- source_word: מִגֶּבֶר
  choice: vor einem Mann
  rationale: Die Präposition מִן wird mit „vor“ wiedergegeben, wie es das deutsche Verb „verbergen“ verlangt. „Mann“ bewahrt die Unterscheidung von גֶּבֶר gegenüber אָדָם, ohne die mögliche Kraftkomponente durch das unnatürliche „starker Mann“ zu überbetonen.
- source_word: יְכַסֶּה
  choice: zu verbergen
  rationale: Das finite Imperfekt steht in engem inhaltlichem Parallelismus zum vorangehenden Zweckinfinitiv. Die infinitivische Wiedergabe ergibt im Deutschen eine natürliche Zweckangabe; „verbergen“ bewahrt das Bild des Bedeckens, ist hier aber verständlicher als das wörtliche „bedecken“.
theological_decisions:
- issue: Sinn der verkürzten Zweckangabe über Gottes Warnen
  choice: Gott bringt den Menschen von seinem Tun ab und hält Hochmut von ihm fern, ausgedrückt mit dem hebräischen Bild des Verbergens.
  alternative: Gott entfernt das Tun eines Menschen und verbirgt den Hochmut vor einem Mann.
  rationale: Der Zusammenhang in Hiob 33,14–18 spricht von Gottes warnendem Eingreifen, das Menschen vor verderblichem Handeln bewahrt. Die hebräische Syntax bleibt jedoch mehrdeutig; deshalb wird die geläufige kontextuelle Deutung im Text geboten und die wörtlichere Möglichkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zeilenstruktur bildet den hebräischen Parallelismus ab. „Tun“ und „Hochmut“ sind allgemeinverständlich; die ungewöhnliche Wendung „den Hochmut vor einem Mann zu verbergen“ erhält bewusst das konkrete und theologisch spannungsreiche Bild des hebräischen Textes.
