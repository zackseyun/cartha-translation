source:
  edition: WLC
  text: רֻֽטֲפַ֣שׁ בְּשָׂר֣/וֹ מִ/נֹּ֑עַר יָ֝שׁ֗וּב לִ/ימֵ֥י עֲלוּמָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/025.yaml
  text: his flesh becomes fresher than in youth[b][a]; he returns to the days of his youthful vigor.
translation:
  language: de
  text: Sein Fleisch wird frischer als in der Jugend[a]; er kehrt zurück zu den Tagen seiner Jugendkraft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sein Fleisch wird frisch wie das eines Jungen“ oder: „Sein Fleisch wird frischer als das eines jungen Menschen.“ Das hebräische Verb ist selten, und die Verbindung mit „Jugend“ lässt sich unterschiedlich auffassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu den Tagen seiner Jugend“. Das hebräische Wort kann die Jugend selbst oder die mit ihr verbundene Kraft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֻטֲפַשׁ
  choice: wird frischer
  rationale: Das seltene Verb bezeichnet wahrscheinlich ein erneutes Frisch- oder Üppigwerden. „Wird frischer“ bewahrt das konkrete körperliche Bild, ohne es allgemein als Wiederherstellung zu deuten.
- source_word: בְּשָׂרוֹ
  choice: sein Fleisch
  rationale: „Fleisch“ entspricht dem hebräischen Ausdruck unmittelbar und bewahrt den betont körperlichen Charakter der Aussage.
- source_word: מִנֹּעַר
  choice: als in der Jugend
  rationale: 'Die Präposition wird hier am natürlichsten vergleichend verstanden: Das Fleisch wird frischer, als es in der Jugend war. Andere syntaktische Auffassungen bleiben in der Fußnote sichtbar.'
- source_word: יָשׁוּב
  choice: er kehrt zurück
  rationale: Das maskuline Verb bezieht sich am ehesten auf den Menschen selbst und setzt so das Subjekt des Zusammenhangs fort.
- source_word: לִימֵי
  choice: zu den Tagen
  rationale: Die Formulierung gibt die hebräische Wendung direkt und zugleich verständlich wieder.
- source_word: עֲלוּמָיו
  choice: seiner Jugendkraft
  rationale: Das Substantiv kann sowohl die Jugendzeit als auch die mit ihr verbundene Lebenskraft bezeichnen. „Jugendkraft“ bringt den Wiedergewinn körperlicher Vitalität im Zusammenhang prägnant zum Ausdruck.
