  variant: modern standard German
source:
  edition: WLC
  text: אִם יֵ֤שׁ עָלָ֨י/ו מַלְאָ֗ךְ מֵלִ֗יץ אֶחָ֥ד מִנִּי אָ֑לֶף לְ/הַגִּ֖יד לְ/אָדָ֣ם יָשְׁרֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/023.yaml
  text: If there is for him an angel[a], a mediator, one among a thousand, to declare to man his uprightness[b],
translation:
  language: de
  text: Wenn es für ihn einen Engel[a] gibt, einen Mittler, einen von tausend, der dem Menschen kundtut, was für ihn recht ist[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Boten, einen Mittler“; „einen Engel, einen Deuter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Rechtschaffenheit kundtut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ
  choice: Wenn es … gibt
  rationale: Die Verbindung eröffnet einen hypothetischen Bedingungssatz und wird im modernen Deutsch natürlich mit „Wenn es … gibt“ wiedergegeben.
- source_word: עָלָיו
  choice: für ihn
  rationale: Die Präposition bezeichnet hier wahrscheinlich die Beziehung zum Betroffenen beziehungsweise ein Handeln zu seinen Gunsten; „für ihn“ wahrt dies knapp, ohne eine bestimmte Fürsprecherlehre vorauszusetzen.
- source_word: מַלְאָךְ
  choice: Engel
  rationale: Das Wort kann „Bote“ oder „Engel“ bedeuten. Im Kontext der außergewöhnlichen Mittlergestalt ist „Engel“ wahrscheinlich, während die lexikalische Alternative in der Fußnote erhalten bleibt.
- source_word: מֵלִיץ
  choice: Mittler
  rationale: Der Ausdruck kann einen Mittler, Fürsprecher, Dolmetscher oder Deuter bezeichnen. „Mittler“ bildet die vermittelnde Funktion angemessen ab, ohne sie genauer festzulegen.
- source_word: אֶחָד מִנִּי אָלֶף
  choice: einen von tausend
  rationale: Die knappe deutsche Wendung erhält das Bild einer seltenen, außergewöhnlichen Gestalt.
- source_word: לְהַגִּיד
  choice: kundtut
  rationale: Das Verb bezeichnet ein Mitteilen oder Bekanntmachen. „kundtut“ trägt dem gehobenen poetischen Register Rechnung, bleibt aber verständlich.
- source_word: לְאָדָם
  choice: dem Menschen
  rationale: אָדָם bezeichnet hier den einzelnen Menschen in seiner menschlichen Lage. Der bestimmte Ausdruck greift den im Kontext betroffenen Menschen auf, ohne das Wort unnötig auf „Mann“ zu verengen.
- source_word: יָשְׁרוֹ
  choice: was für ihn recht ist
  rationale: Die Form leitet sich von ישר („gerade, recht“) ab. Der Ausdruck kann seine Rechtschaffenheit oder das für ihn Rechte bezeichnen; die idiomatische Hauptfassung vermeidet die im Deutschen mögliche Fehlannahme, seine moralische Rechtschaffenheit stehe bereits fest.
theological_decisions:
- issue: Identität und Funktion von מַלְאָךְ מֵלִיץ
  choice: Allgemein als „einen Engel, einen Mittler“ wiedergegeben
  alternative: Ein menschlicher Bote oder Deuter; ein himmlischer Fürsprecher mit weitergehender theologischer Bedeutung
  rationale: Der Vers bestimmt die Gestalt nicht näher. Die Übersetzung wahrt die Offenheit und identifiziert sie weder christologisch noch innerhalb einer ausgearbeiteten Engellehre.
- issue: Bezug und Bedeutung von יָשְׁרוֹ
  choice: „was für ihn recht ist“
  alternative: „seine Rechtschaffenheit“
  rationale: Sowohl der pronominale Bezug als auch die genaue Bedeutungsnuance sind nicht völlig eindeutig. Die Hauptfassung gibt den wahrscheinlichen idiomatischen Sinn wieder; die formal nähere Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetisch-weisheitlichem Klang. Der Vers bleibt als noch nicht abgeschlossener Bedingungssatz mit Komma stehen. „kundtut“ ist bewusst gehoben, aber gegenwärtig verständlich; zentrale lexikalische und theologische Mehrdeutigkeiten werden durch Fußnoten bewahrt.
