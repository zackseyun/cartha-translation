  yaml_path: translation/ot/job/033/029.yaml
  text: Look[a], God does all these things two or three times with a man,
translation:
  language: de
  text: Sieh, all dies tut Gott zwei- oder dreimal an einem Mann[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einem Menschen“. Das Hebräische hat „an einem Mann“ im repräsentativen Singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel hebt die folgende Aussage hervor. „Sieh“ ist gegenwärtig, würdevoll und bewahrt den deiktischen Nachdruck.
- source_word: כָּל אֵלֶּה
  choice: all dies
  rationale: Die Wendung verweist zusammenfassend auf die zuvor beschriebenen Handlungen Gottes; „all dies“ ist im Deutschen idiomatisch und nah am Hebräischen.
- source_word: יִפְעַל
  choice: tut
  rationale: פעל bezeichnet hier das Ausführen von Handlungen. Zusammen mit „all dies“ ist „tut“ die natürliche deutsche Entsprechung.
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet hier Gott und wird ohne zusätzliche, im Ausgangstext nicht ausdrücklich enthaltene Qualifizierung wiedergegeben.
- source_word: פַּעֲמַיִם שָׁלֹשׁ
  choice: zwei-, ja dreimal
  rationale: Das Hebräische lautet knapp „zweimal, dreimal“ und bezeichnet wiederholtes Handeln. „zwei-, ja dreimal“ bewahrt die Zahlenfolge und gibt die steigernde, asyndetische Form natürlich wieder.
- source_word: עִם
  choice: an
  rationale: Im Deutschen bezeichnet „an einem Mann tun“ Gottes Handeln in Bezug auf ihn idiomatischer als das wörtlichere „mit“, ohne eine Ziel- oder Nutzenaussage hineinzulesen.
- source_word: גָּבֶר
  choice: einem Mann
  rationale: גָּבֶר ist lexikalisch ein männlicher Singular, der hier repräsentativ für einen Menschen steht. Der Haupttext erhält die konkrete Form; die generische Reichweite wird in einer Fußnote erläutert.
theological_decisions:
- issue: Repräsentativ-maskuline Sprache bei גָּבֶר
  choice: einem Mann
  alternative: einem Menschen
  rationale: Der hebräische Text verwendet ausdrücklich ein maskulines Substantiv im Singular, offenbar in repräsentativem Sinn. Die Übersetzung bewahrt diese Form und klärt zugleich per Fußnote, dass der Bezug allgemein auf einen Menschen verstanden werden kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh“ erhält den hervorgehobenen Auftakt; „zwei-, ja dreimal“ bildet die knappe hebräische Steigerung ab. Das abschließende Komma wurde beibehalten, da der Vers syntaktisch in Vers 30 weitergeführt wird.
