  text: לְ/הָשִׁ֣יב נַ֭פְשׁ/וֹ מִנִּי שָׁ֑חַת לֵ֝/א֗וֹר בְּ/א֣וֹר הַֽ/חַיִּים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/030.yaml
  text: to bring back his soul from the pit[c][b][a], that he may be enlightened with the light of life.
translation:
  language: de
  text: um seine Seele[a] aus der Grube[b] zurückzuholen, damit sie vom Licht des Lebens erhellt wird.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sein Leben«. Das hebräische Wort kann Seele, Leben oder die Person selbst bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »aus dem Grab« oder »aus dem Verderben«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »um sie ins Licht zu bringen« oder »damit sie das Licht sieht«. Das Hebräische ist knapp und poetisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָשִׁיב
  choice: zurückzuholen
  rationale: Der Hifil-Infinitiv von שׁוב bezeichnet ein verursachtes Zurückkehren. »Zurückzuholen« bewahrt dieses konkrete Bild und klingt im Deutschen natürlich.
- source_word: נַפְשׁוֹ
  choice: seine Seele
  rationale: נפש kann Seele, Leben oder die Person selbst bezeichnen. »Seele« erhält die anthropologische und poetische Weite des Ausdrucks; die kontextuell ebenfalls mögliche Bedeutung »Leben« wird in einer Fußnote genannt.
- source_word: מִנִּי שָׁחַת
  choice: aus der Grube
  rationale: שׁחת kann in poetischen Texten Grube, Grab oder Verderben bezeichnen. »Grube« bewahrt das konkrete Bild und den Gegensatz zum Licht des Lebens.
- source_word: לֵאוֹר
  choice: damit sie … erhellt wird
  rationale: Die hebräische Wendung ist knapp und elliptisch. Die deutsche Zweckkonstruktion gibt den Übergang von der Rettung zur Erhellung verständlich wieder, ohne die syntaktische Mehrdeutigkeit im Haupttext unnötig nachzuahmen.
- source_word: בְּאוֹר הַחַיִּים
  choice: vom Licht des Lebens
  rationale: Die Formulierung bewahrt das poetische Bild. »Vom« fasst die Präposition ב instrumentell auf; auch eine räumlich-assoziative Wiedergabe mit »im Licht« ist möglich.
