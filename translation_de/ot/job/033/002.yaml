lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: Die Verbindung lenkt nachdrücklich die Aufmerksamkeit auf das Folgende. „Sieh doch“ ist im heutigen Deutsch verständlich und gibt sowohl die hinweisende Kraft von הִנֵּה als auch die verstärkende beziehungsweise bittende Nuance von נָא wieder.
- source_word: פָּתַחְתִּי פִי
  choice: ich habe meinen Mund geöffnet
  rationale: Die konkrete hebräische Redewendung für den Beginn des Sprechens bleibt erhalten; das Perfekt wird hier natürlich mit dem deutschen Perfekt wiedergegeben.
- source_word: דִּבְּרָה
  choice: spricht
  rationale: Die ungewöhnliche Form wird als Verb mit „meine Zunge“ als Subjekt verstanden. Das Präsens passt zur unmittelbar einsetzenden Rede und bewahrt die poetische Parallelität, ohne „hat zu sprechen begonnen“ interpretierend hinzuzufügen.
- source_word: לְשׁוֹנִי
  choice: meine Zunge
  rationale: Die körperliche und zugleich metonymische Bildsprache sowie die Parallele zu „meinen Mund“ werden wörtlich bewahrt.
- source_word: בְחִכִּי
  choice: an meinem Gaumen
  rationale: חֵךְ bezeichnet konkret den Gaumen. „An meinem Gaumen“ gibt die lokale Präposition wieder und erhält die auffällige körperliche Bildsprache; die geläufigere Wiedergabe „in meinem Mund“ wäre weniger genau.
