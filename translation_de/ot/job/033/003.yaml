  text: יֹֽשֶׁר לִבִּ֥/י אֲמָרָ֑/י וְ/דַ֥עַת שְׂ֝פָתַ֗/י בָּר֥וּר מִלֵּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/003.yaml
  text: The uprightness of my heart is in my words[a], and my lips speak knowledge clearly.
translation:
  language: de
  text: Meine Worte bringen die Aufrichtigkeit meines Herzens zum Ausdruck, und meine Lippen sprechen Erkenntnis klar aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Meine Lippen sprechen lautere Erkenntnis aus« beziehungsweise »meine Lippen sprechen offen aus, was sie wissen«. Das mit »klar« wiedergegebene hebräische Wort kann auch Reinheit oder Eindeutigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֶׁר
  choice: Aufrichtigkeit
  rationale: Das Substantiv bezeichnet Geradheit beziehungsweise Rechtschaffenheit im sittlichen Sinn. »Aufrichtigkeit« gibt hier Elihus Anspruch auf eine redliche innere Haltung natürlich wieder, ohne den Begriff stärker als nötig als vollkommene Integrität auszudeuten.
- source_word: לִבִּי
  choice: meines Herzens
  rationale: לֵב bezeichnet den inneren Menschen einschließlich Denken und Wollen. »Herz« bewahrt die hebräische Bildsprache und ist im Deutschen verständlich.
- source_word: אֲמָרַי
  choice: meine Worte
  rationale: Der Plural bezeichnet Elihus Äußerungen. »Meine Worte« ist direkt und bewahrt den poetischen Bezug zur parallelen Wendung »meine Lippen«.
- source_word: וְדַעַת
  choice: Erkenntnis
  rationale: דַּעַת bezeichnet Wissen beziehungsweise Erkenntnis als Inhalt der Rede. »Erkenntnis« klingt im vorliegenden poetisch-weisheitlichen Zusammenhang natürlicher als das stärker sachbezogene »Wissen«.
- source_word: שְׂפָתַי
  choice: meine Lippen
  rationale: Die Lippen stehen metonymisch für das Sprechen. Die wörtliche Wiedergabe erhält die poetische Parallelität mit dem Herzen.
- source_word: בָּרוּר
  choice: klar
  rationale: Das Wort kann Klarheit, Eindeutigkeit oder Reinheit ausdrücken. Adverbiales »klar« ergibt im Zusammenhang verständlicher Rede einen natürlichen Haupttext; die mögliche Bedeutung »lauter/rein« bleibt in der Fußnote erhalten.
- source_word: מִלֵּלוּ
  choice: sprechen … aus
  rationale: Das Verb bedeutet »sprechen« oder »äußern«. Die trennbare Form »aussprechen« ist mit »Erkenntnis« idiomatisches Deutsch und gibt die gegenwärtige Selbstaussage Elihus passend wieder.
