translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Halbzeile wird wegen der im Hebräischen nur knapp bezeichneten Beziehung zwischen »Aufrichtigkeit meines Herzens« und »meine Worte« mit »zum Ausdruck bringen« natürlich entfaltet. Die poetischen Körperbilder »Herz« und »Lippen« bleiben erhalten.
