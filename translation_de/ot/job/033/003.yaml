  source_fidelity: Die Übersetzung gibt die beiden poetischen Halbzeilen sachgerecht wieder. »Meine Worte bringen die Aufrichtigkeit meines Herzens zum Ausdruck« entfaltet die im Hebräischen knapp gesetzte prädikative Beziehung natürlich, ohne einen weitergehenden Inhalt hinzuzufügen. »Meine Lippen sprechen Erkenntnis klar aus« erhält die Metonymie von »Lippen«, die Aussage von דַּעַת und die adverbiale Lesart von בָּרוּר.
