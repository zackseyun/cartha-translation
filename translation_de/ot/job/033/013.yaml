  text: מַ֭דּוּעַ אֵלָ֣י/ו רִיב֑וֹתָ כִּ֥י כָל דְּ֝בָרָ֗י/ו לֹ֣א יַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/013.yaml
  text: Why do you contend against him, because he does not answer for all his words?
translation:
  language: de
  text: Warum streitest du gegen ihn, weil er für alle seine Worte keine Antwort gibt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum streitest du gegen ihn, weil er über keine seiner Angelegenheiten Antwort gibt?“ Das Hebräische Wort kann „Worte“, aber auch „Sachen“, „Angelegenheiten“ oder „Taten“ bedeuten. Auch der Bezug von „seine“ und die genaue Verknüpfung des weil-Satzes werden unterschiedlich verstanden.'
    reason: Die Anmerkung bewahrt die Bedeutungsbreite von דְּבָרָיו sowie die syntaktische und pronominale Mehrdeutigkeit, ohne eine Auslegung als alleinige Bedeutung festzuschreiben.
lexical_decisions:
- source_word: רִיבוֹתָ
  choice: streitest du
  rationale: Die Form bezeichnet das Streiten oder Hadern mit jemandem; „streitest du gegen ihn“ gibt die gerichtliche und persönliche Färbung wieder, ohne sie auf einen förmlichen Rechtsstreit festzulegen.
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion wird entsprechend ihrem naheliegenden begründenden Sinn wiedergegeben und eng an die vorausgehende Frage angeschlossen.
- source_word: כָל דְּבָרָיו
  choice: all seine Worte
  rationale: דבר kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten. Die Hauptfassung bewahrt die konkrete Bedeutung „Worte“ und die pronominale Mehrdeutigkeit des Hebräischen.
- source_word: לֹא יַעֲנֶה
  choice: nicht antwortet
  rationale: ענה bedeutet hier „antworten“. Die deutsche Wortstellung macht „auf all seine Worte“ zum Bezug der ausbleibenden Antwort.
theological_decisions:
- issue: Wessen „Worte“ gemeint sind und worauf Gott nicht antwortet
  choice: Das Pronomen „seine“ bleibt wie im Hebräischen ohne ausdrückliche Auflösung stehen.
  alternative: „weil er dir auf keines deiner Worte antwortet“ oder „denn über all sein Tun gibt er keine Rechenschaft“
  rationale: Der unmittelbare Wortlaut lässt den Bezug des Suffixes unterschiedlich verstehen. Eine Festlegung auf Gottes Taten oder auf Ijobs Worte würde die echte sprachliche und theologische Spannung vorschnell beseitigen.
- issue: Aussage oder Bestandteil der Frage
  choice: Der Weil-Satz wird als Fortsetzung der Frage mit Fragezeichen wiedergegeben.
  alternative: „Denn er antwortet nicht auf all seine Worte.“
  rationale: כִּי kann eine Begründung einleiten; im Zusammenhang lässt sich der Satz entweder als Grund für Ijobs Streit oder als selbstständige Erklärung hören. Die gewählte Interpunktion folgt der vorliegenden englischen Konsultationsfassung, ohne die lexikalische Mehrdeutigkeit zu verdecken.
translation_notes:
  register: Modernes, knappes Standarddeutsch mit würdigem Ton. „Streiten“ ist allgemein verständlich und lässt den möglichen rechtlichen Unterton offen; die ungewöhnliche Spannung des Ausgangstextes wird nicht geglättet.
