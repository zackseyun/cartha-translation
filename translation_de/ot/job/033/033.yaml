  text: If not[a], then listen to me; be silent[b], and I will teach you wisdom.
translation:
  language: de
  text: Wenn nicht, dann hör mir zu; schweig, und ich werde dich Weisheit lehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אַיִן
  choice: Wenn nicht
  rationale: 'Die knappe Wendung führt die gegenteilige Bedingung zur Aufforderung im vorherigen Vers ein: Wenn Hiob nichts zu erwidern hat, soll er zuhören.'
- source_word: שְׁמַע לִי
  choice: hör mir zu
  rationale: שׁמע mit ל bezeichnet hier aufmerksames Hören auf einen Sprecher. „Hör mir zu“ ist im modernen Deutsch natürlich und bewahrt den Imperativ.
- source_word: הַחֲרֵשׁ
  choice: schweig
  rationale: Der Imperativ von חרש fordert hier zum Schweigen auf. „Schweig“ ist direkt, würdig und idiomatisch.
- source_word: וַאֲאַלֶּפְךָ
  choice: und ich werde dich … lehren
  rationale: Das Piel von אלף bedeutet „lehren“ oder „unterweisen“. Nach den Imperativen lässt sich die Form mit Waw und Imperfekt als folgende Zusage wiedergeben.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: חכמה ist der übliche Ausdruck für Weisheit und sollte als Leitwort der Weisheitsliteratur unverkürzt erhalten bleiben.
theological_decisions: []
