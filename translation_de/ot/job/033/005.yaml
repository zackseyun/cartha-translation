  text: If you are able[a], answer me; set your case in order before me; take your stand.
translation:
  language: de
  text: Wenn du kannst, antworte mir; ordne deine Sache vor mir und tritt auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ordne deine Worte vor mir und stell dich hin.“ Das Hebräische nennt bei „ordnen“ kein Objekt; gemeint sein können Hiobs Worte, seine Sache oder seine vorbereitete Antwort. Der letzte Ausdruck bedeutet wörtlich, sich hinzustellen oder sich aufzustellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תּוּכַל
  choice: Wenn du kannst
  rationale: Die Bedingung mit dem Verb יכל formuliert eine direkte Herausforderung und wird im modernen Deutsch knapp und natürlich wiedergegeben.
- source_word: הֲשִׁיבֵנִי
  choice: antworte mir
  rationale: Die Hifilform von שוב bedeutet hier im Gesprächs- beziehungsweise Streitkontext idiomatisch „antworten“.
- source_word: עֶרְכָה
  choice: ordne deine Sache
  rationale: ערך bedeutet „ordnen, in eine Reihe bringen“. Da kein ausdrückliches Objekt genannt ist, hält „deine Sache“ die mögliche forensische Bedeutung fest, ohne sie im Haupttext zu stark auszubauen.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Die gewöhnliche Wendung bezeichnet die Gegenwart beziehungsweise das Gegenüber des Sprechers.
- source_word: הִתְיַצָּבָה
  choice: stell dich zum Streit
  rationale: Der Hitpael-Imperativ von יצב fordert dazu auf, sich aufzustellen und standzuhalten. Die Ergänzung „zum Streit“ macht im Deutschen die argumentative Herausforderung deutlich.
theological_decisions: []
