  yaml_path: translation/ot/job/033/007.yaml
  text: Look[a], my terror will not frighten you, and my hand on you will not be heavy.
translation:
  language: de
  text: Sieh, der Schrecken vor mir wird dich nicht ängstigen, und mein Druck[a] wird nicht schwer auf dir lasten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und meine Hand wird nicht schwer auf dir liegen.“ Das hebräische Wort אַכְפִּי ist schwierig; es kann hier einen auferlegten Druck oder, nach traditioneller Deutung, eine Hand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die hinweisende Partikel lenkt nachdrücklich die Aufmerksamkeit auf Elihus Zusicherung. „Sieh“ bewahrt diese Funktion in würdigem, verständlichem Deutsch.
- source_word: אֵמָתִי
  choice: der Schrecken vor mir
  rationale: Das Substantiv bezeichnet Schrecken oder Furcht. Im Zusammenhang ist der Schrecken gemeint, den Elihu bei Hiob auslösen könnte; „vor mir“ gibt diese sachliche Beziehung im Deutschen natürlich wieder.
- source_word: תְבַעֲתֶךָ
  choice: wird dich nicht ängstigen
  rationale: Die Piel-Form von בעת bezeichnet heftiges Erschrecken oder Ängstigen. Die Wiedergabe bleibt deutlich, ohne die Zusicherung unnötig zu übersteigern.
- source_word: וְאַכְפִּי
  choice: und mein Druck
  rationale: Das seltene und schwierige אַכְפִּי bezeichnet hier wahrscheinlich einen auferlegten Druck oder eine Last. „Druck“ passt zu dem folgenden Verb „schwer sein“ und lässt die Bildlichkeit verständlich werden; die traditionelle Deutung als „Hand“ wird in der Fußnote bewahrt.
- source_word: עָלֶיךָ
  choice: auf dir
  rationale: Die Präposition עַל mit Suffix bezeichnet hier den Druck, der auf Hiob liegt. „Auf dir“ hält sich eng an das hebräische Bild.
- source_word: לֹא יִכְבָּד
  choice: wird nicht schwer lasten
  rationale: כבד bedeutet wörtlich „schwer sein“. Zusammen mit „Druck auf dir“ formuliert „schwer lasten“ die hebräische Aussage natürlich und erhält zugleich das Gewichtsbild.
