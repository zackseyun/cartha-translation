  text: His flesh wastes away from sight[a], and his bones, once unseen, stick out.
translation:
  language: de
  text: Sein Fleisch schwindet dahin, sodass es nicht mehr zu sehen ist,[a] und seine Knochen, die man einst nicht sah, treten hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sein Fleisch wird aufgezehrt, sodass es nicht mehr zu sehen ist, und seine Knochen, die man nicht sah, werden bloßgelegt.“ Der hebräische Wortlaut ist knapp und teilweise schwer zu deuten, besonders das mit „treten hervor“ wiedergegebene Wort.'
