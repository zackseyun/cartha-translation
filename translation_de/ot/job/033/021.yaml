lexical_decisions:
- source_word: יִכֶל
  choice: schwindet dahin
  rationale: Das Qal-Imperfekt von כלה beschreibt hier den fortschreitenden körperlichen Verfall. „Schwindet dahin“ ist natürliches Deutsch und bewahrt den Aspekt des Aufgezehrtwerdens.
- source_word: בְּשָׂרוֹ
  choice: sein Fleisch
  rationale: Die konkrete Körpermetaphorik des hebräischen בשר bleibt erhalten; „Körper“ wäre allgemeiner.
- source_word: מֵרֹאִי
  choice: bis man es nicht mehr sieht
  rationale: Die knappe Verbindung aus מן und רֹאִי bezeichnet das Verschwinden aus der Sichtbarkeit. Die deutsche Formulierung gibt den gemeinten Endpunkt idiomatisch wieder.
- source_word: וְשֻׁפִי
  choice: treten hervor
  rationale: Die schwierige Form wird aus dem Zusammenhang als Sichtbar- beziehungsweise Hervortreten der Knochen verstanden. „Treten hervor“ ist würdig und weniger umgangssprachlich als „stehen heraus“.
- source_word: עַצְמוֹתָיו
  choice: seine Knochen
  rationale: Direkte Wiedergabe des Plurals mit Suffix der 3. Person Singular.
- source_word: לֹא רֻאּוּ
  choice: die man einst nicht sah
  rationale: Das passive ראה mit Verneinung bezeichnet die zuvor nicht sichtbaren Knochen. „Einst“ macht den zeitlichen Gegensatz zum nunmehrigen Hervortreten deutlich, ohne die Aussage unnötig zu erweitern.
