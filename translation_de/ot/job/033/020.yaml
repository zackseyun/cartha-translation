  text: so that his life loathes bread[b][a], and his soul desirable food.
translation:
  language: de
  text: sodass sein Leben[a] Brot verabscheut und seine Seele begehrenswerte Speise[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sein Leben“ kann hier auch „er selbst“ oder, auf das Essen bezogen, „sein Appetit“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „erlesene Speise“; gemeint ist Speise, die normalerweise begehrt oder als ansprechend empfunden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזִהֲמַתּוּ
  choice: Dann verabscheut
  rationale: Das Verb bezeichnet starken Widerwillen oder Ekel. „Verabscheut“ gibt diesen Sinn prägnant wieder; „dann“ bindet die Folge an den vorausgehenden Zusammenhang an.
- source_word: חַיָּתוֹ
  choice: sein Leben
  rationale: Das Substantiv bezeichnet hier im Parallelismus mit נַפְשׁוֹ das Leben beziehungsweise die lebendige Person, nicht ein Tier. Die wörtliche Bildsprache bleibt erhalten.
- source_word: לָחֶם
  choice: das Brot
  rationale: Die konkrete Grundbedeutung „Brot“ wird bewahrt, während der zweite Halbvers allgemeiner von Speise spricht.
- source_word: נַפְשׁוֹ
  choice: seine Seele
  rationale: נפשׁ kann Seele, Leben, Selbst oder Begehren/Appetit bezeichnen. „Seele“ erhält die poetische Anthropologie und den Parallelismus, ohne die Bedeutung auf den Appetit zu verengen.
- source_word: מַאֲכַל
  choice: Speise
  rationale: „Speise“ ist eine natürliche, gehobene und im poetischen Zusammenhang passende Wiedergabe für etwas Essbares beziehungsweise Nahrung.
- source_word: תַּאֲוָה
  choice: begehrenswerte
  rationale: Der Ausdruck bezeichnet etwas, das Begehren weckt oder begehrt wird. „Begehrenswerte Speise“ bleibt näher am hebräischen Begriff als das stärker wertende „köstliche Speise“.
theological_decisions: []
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch verständlich. Der parallele Aufbau mit „sein Leben“ und „seine Seele“ bleibt erhalten; die zweite Verbform ist entsprechend der hebräischen Poesie elliptisch mitzudenken.
