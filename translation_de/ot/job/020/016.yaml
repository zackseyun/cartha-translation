source:
  edition: WLC
  text: רֹאשׁ פְּתָנִ֥ים יִינָ֑ק תַּֽ֝הַרְגֵ֗/הוּ לְשׁ֣וֹן אֶפְעֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/016.yaml
  text: He sucks the venom of cobras[b][a]; the tongue of a viper kills him.
translation:
  language: de
  text: 'Er saugt das Gift der Kobras[a];

    die Zunge einer Viper tötet ihn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Kopf der Kobras«; »Kopf« bezeichnet hier wahrscheinlich das Gift.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: Gift
  rationale: Wörtlich häufig »Kopf«, bezeichnet das Wort in diesem poetischen Zusammenhang idiomatisch das Gift der Schlange. Das allgemein verständliche »Gift« bewahrt den Sinn, ohne eine anatomische Deutung nahezulegen.
- source_word: פְּתָנִים
  choice: Kobras
  rationale: Das Wort bezeichnet giftige Schlangen; »Kobras« ist eine klare moderne Wiedergabe, ohne eine übermäßig genaue zoologische Bestimmung zu beanspruchen.
- source_word: יִינָק
  choice: saugt
  rationale: Die direkte Bedeutung »saugen« erhält das drastische Bild des Hebräischen besser als eine abschwächende Umschreibung wie »trinkt«.
- source_word: תַּהַרְגֵהוּ
  choice: tötet ihn
  rationale: Das feminine Subjekt »Zunge« handelt an »ihm«. Das Präsens gibt die im poetischen Kontext als sicher dargestellte Folge knapp und natürlich wieder.
- source_word: לְשׁוֹן
  choice: Zunge
  rationale: Die konkrete Bildsprache des hebräischen Textes wird bewahrt, statt sie deutend durch »Fangzahn« oder »Biss« zu ersetzen.
- source_word: אֶפְעֶה
  choice: Viper
  rationale: Das Wort bezeichnet eine Giftschlange. »Viper« ist im modernen Deutschen verständlich und wahrt die fehlende zoologische Eindeutigkeit.
theological_decisions: []
