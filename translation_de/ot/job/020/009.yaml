  - severity: medium
    issue: »sein Ort wird ihn nicht mehr schauen« ist für modernes Standarddeutsch unidiomatisch
    rationale: Die Personifikation ist textgetreu und soll bleiben, doch transitives »jemanden schauen« wirkt archaisch. »wird ihn nicht mehr sehen« ist idiomatisch und gibt תְּשׁוּרֶנּוּ zuverlässig wieder.
