  text: עַ֣יִן שְׁ֭זָפַתּ/וּ וְ/לֹ֣א תוֹסִ֑יף וְ/לֹא ע֝֗וֹד תְּשׁוּרֶ֥/נּוּ מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/009.yaml
  text: The eye that saw him will not see him again[a], and his place will no longer see him.
translation:
  language: de
  text: Das Auge, das ihn erblickte, wird ihn nicht wieder sehen[a], und sein Ort wird ihn nicht mehr sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Auge, das ihn ansah, wird ihn nicht wieder sehen.« Im Hebräischen steht »Auge« in poetischer Einzahl; in der zweiten Vershälfte wird »sein Ort« personifiziert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: Das Auge
  rationale: Die wörtliche Einzahl bewahrt das markante poetische Bild; eine Auflösung zu »niemand« würde es einebnen.
- source_word: שְׁזָפַתּוּ
  choice: das ihn erblickte
  rationale: Das Verb bezeichnet das Sehen beziehungsweise aufmerksame Anschauen. »Erblickte« ist natürlich und zugleich poetisch gehoben.
- source_word: וְלֹא תוֹסִיף
  choice: wird es nicht wieder tun
  rationale: יסף mit Verneinung drückt aus, dass sich der zuvor genannte Vorgang nicht wiederholt. Die Formulierung vermeidet, ein im Hebräischen nicht erneut gesetztes Sehverb einzufügen.
- source_word: וְלֹא עוֹד
  choice: nicht mehr
  rationale: Die Wendung bezeichnet das endgültige Aufhören und wird im modernen Deutschen idiomatisch mit »nicht mehr« wiedergegeben.
- source_word: תְּשׁוּרֶנּוּ
  choice: wird ihn … schauen
  rationale: Das Verb שׁור bedeutet »anschauen/erblicken«. »Schauen« wahrt den poetischen Ton und unterscheidet die Wortwahl der beiden Vershälften.
- source_word: מְקוֹמוֹ
  choice: sein Ort
  rationale: Die wörtliche Wiedergabe bewahrt die Personifikation des Ortes; eine Erweiterung zu »Wohnort« ist sprachlich möglich, aber nicht ausdrücklich im Ausgangstext enthalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Die parallelen Aussagen und die Personifikation von Auge und Ort bleiben erhalten; »erblickte« und »schauen« geben die unterschiedlichen hebräischen Sehverben wieder.
