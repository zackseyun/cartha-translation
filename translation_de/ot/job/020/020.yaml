base_translation:
  language: en
  yaml_path: translation/ot/job/020/020.yaml
  text: For he knew no quiet in his belly[a]; with his desirable things he will not escape.
translation:
  language: de
  text: Denn er kannte keine Ruhe in seinem Bauch[a]; mit dem, was er begehrt, wird er nicht entkommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn er kannte kein Behagen in seinem Innern.“'
    reason: שָׁלֵו kann Ruhe oder Behagen bezeichnen; בטן kann bildlich für das Innere stehen.
  - marker: b
    text: 'Oder: „Von dem, was er begehrt, wird er nichts retten.“'
    reason: מלט kann hier auch transitiv verstanden werden; dann bezeichnet בַּחֲמוּדוֹ das, wovon er nichts in Sicherheit bringt.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das zuvor angekündigte Gericht ein und entspricht dem erklärenden Zusammenhang.
- source_word: לֹא יָדַע שָׁלֵו
  choice: er kannte keine Ruhe
  rationale: Gibt die verneinte Zustandsaussage knapp und poetisch wieder; שָׁלֵו bezeichnet Ruhe, Ungestörtheit oder Behagen.
- source_word: בְּבִטְנוֹ
  choice: in seinem Bauch
  rationale: Bewahrt das konkrete, körperliche Bild von בטן, das im Zusammenhang mit unersättlichem Verlangen und Verschlingen besonders passend ist.
- source_word: בַּחֲמוּדוֹ
  choice: mit dem, was er begehrt
  rationale: חמוד bezeichnet etwas Begehrtes, Kostbares oder Erfreuliches. Die Formulierung lässt offen, ob Besitz, Beute oder allgemein Gegenstände seines Verlangens gemeint sind.
- source_word: לֹא יְמַלֵּט
  choice: wird er nicht entkommen
  rationale: Das Piel von מלט kann ‚entrinnen‘ oder ‚retten/in Sicherheit bringen‘ bedeuten. Im Haupttext wird die in diesem Zusammenhang mögliche intransitive Lesart wiedergegeben; die alternative transitive Deutung steht in der Fußnote.
theological_decisions:
- issue: Ob der Frevler mithilfe seines begehrten Besitzes selbst nicht entkommt oder von seinem begehrten Besitz nichts rettet
  choice: Er wird mit dem, was er begehrt, nicht entkommen.
  alternative: Von dem, woran er Freude hat, wird er nichts retten.
  rationale: Die knappe hebräische Verbindung בַּחֲמוּדוֹ לֹא יְמַלֵּט erlaubt unterschiedliche syntaktische Zuordnungen. Der Haupttext folgt der möglichen instrumentalen Lesart, während die Fußnote die transitive Lesart bewahrt, ohne die Spannung aufzulösen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Das körperliche Bild „Bauch“ bleibt erhalten; die zweite Vershälfte wird natürlich formuliert, während eine echte syntaktisch-lexikalische Mehrdeutigkeit in der Fußnote dokumentiert wird.
