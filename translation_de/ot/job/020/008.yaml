  yaml_path: translation/ot/job/020/008.yaml
  text: Like a dream he flies away and is not found[b][a]; he is driven away like a vision of the night.
translation:
  language: de
  text: Wie ein Traum fliegt er davon und wird nicht gefunden[a]; er wird verjagt wie eine nächtliche Vision[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und sie finden ihn nicht«; im Hebräischen steht ein unbestimmtes Verb im Plural mit dem Suffix »ihn«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wie eine Vision der Nacht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Wie ein Traum
  rationale: Das Präfix כ bezeichnet einen Vergleich; die Wiedergabe ist im Deutschen natürlich und bewahrt das Bild.
- source_word: יָעוּף
  choice: fliegt er davon
  rationale: Die Grundbedeutung von עוף ist „fliegen“. Die Formulierung erhält das anschauliche Bild des schnellen Verschwindens.
- source_word: וְלֹא יִמְצָאֻהוּ
  choice: und wird nicht mehr gefunden
  rationale: 'Wörtlich steht ein aktives Verb im unbestimmten Plural mit Objektsuffix: „und sie finden ihn nicht“. Das deutsche Passiv gibt den Sinn idiomatisch wieder und hält den Fokus auf dem Verschwundenen; „mehr“ verdeutlicht im Zusammenhang das Nicht-wieder-Auffinden, ohne eine bestimmte suchende Gruppe einzuführen.'
- source_word: וְיֻדַּד
  choice: er wird verjagt
  rationale: Die passive Form bezeichnet ein Forttreiben oder Verjagen. „Verjagt“ ist knapp, bildhaft und passt zur flüchtigen nächtlichen Erscheinung.
- source_word: כְּחֶזְיוֹן לָיְלָה
  choice: wie eine nächtliche Erscheinung
  rationale: חֶזְיוֹן bezeichnet eine Schau oder Vision; לָיְלָה bestimmt sie als nächtlich. „Nächtliche Erscheinung“ ist verständlich und poetisch, während die Alternative „Vision der Nacht“ die Form des Hebräischen enger abbildet.
