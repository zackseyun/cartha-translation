  text: יְגַלּ֣וּ שָׁמַ֣יִם עֲוֺנ֑/וֹ וְ֝/אֶ֗רֶץ מִתְקוֹמָ֘מָ֥ה לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/027.yaml
  text: The heavens will reveal his iniquity[b][a], and the earth will rise up against him.
translation:
  language: de
  text: Der Himmel wird sein Unrecht[a] aufdecken, und die Erde[b] wird sich gegen ihn erheben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Schuld“. Das hebräische Wort kann sowohl moralisches Unrecht als auch die daraus erwachsende Schuld bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Land“. Im poetischen Parallelismus mit „dem Himmel“ ist jedoch „die Erde“ wahrscheinlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלּוּ
  choice: wird … aufdecken
  rationale: Das Piel-Imperfekt von גלה bezeichnet hier das Offenlegen oder Bekanntmachen. „Aufdecken“ gibt die öffentliche, anklagende Enthüllung natürlich wieder.
- source_word: שָׁמַיִם
  choice: der Himmel
  rationale: Das hebräische Pluralwort wird im Deutschen idiomatisch als „der Himmel“ wiedergegeben; die poetische Personifikation als kosmischer Zeuge bleibt erhalten.
- source_word: עֲוֺנוֹ
  choice: sein Unrecht
  rationale: עָוֹן kann sowohl das moralische Vergehen als auch die daraus erwachsende Schuld bezeichnen. „Unrecht“ betont hier das, was öffentlich aufgedeckt wird, ohne die Schuldkomponente auszuschließen.
- source_word: וְאֶרֶץ
  choice: und die Erde
  rationale: In der Parallelstellung zu „Himmel“ bezeichnet אֶרֶץ am ehesten die Erde als kosmische Größe, nicht ein bestimmtes Land.
- source_word: מִתְקוֹמָמָה
  choice: wird sich … erheben
  rationale: Die reflexive Verbalform von קום schildert ein Aufstehen in feindlicher Absicht. „Sich erheben“ bewahrt die lebendige Personifikation.
- source_word: לוֹ
  choice: gegen ihn
  rationale: ל trägt bei einem feindlichen Sich-Erheben adversative Bedeutung; „gegen ihn“ gibt diese Beziehung idiomatisch wieder.
