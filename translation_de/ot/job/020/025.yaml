  text: He pulls it out[a], and it comes from his body; a flashing point comes from his gall; terrors come upon him.
translation:
  language: de
  text: Er zieht ihn heraus[a], und er kommt aus seinem Körper; ein Blitzglanz fährt aus seiner Galle hervor. Schrecken überfallen ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit Deutung des Blitzglanzes als Waffe: „Er zieht ihn heraus, und eine glänzende Klinge fährt aus seiner Gallenblase hervor.“ Das Hebräische gebraucht drastische körperliche Bildsprache; der „Blitzglanz“ kann sich auf den glänzenden Teil der herauskommenden Waffe beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַף
  choice: Er zieht ihn heraus
  rationale: Das Verb bezeichnet das Herausziehen, häufig einer Waffe. Das im Hebräischen unausgesprochene Objekt wird als Pronomen ergänzt; aus dem Zusammenhang ist die im Körper steckende Waffe gemeint.
- source_word: וַיֵּצֵא
  choice: und er kommt
  rationale: Das Verb bedeutet „hinausgehen/herauskommen“. Das maskuline Pronomen wahrt den möglichen Bezug auf den zuvor vorausgesetzten Waffengegenstand, ohne ihn genauer festzulegen.
- source_word: מִגֵּוָה
  choice: aus seinem Leib
  rationale: גֵּוָה bezeichnet hier Körper oder Rumpf. „Leib“ ist verständlich, würdevoll und erhält die eindringliche Körperlichkeit des Bildes.
- source_word: וּבָרָק
  choice: die blitzende Spitze
  rationale: בָּרָק bedeutet wörtlich „Blitz“ oder „Aufblitzen“ und bezeichnet im Waffenkontext wahrscheinlich metonymisch den glänzenden Teil, besonders die Spitze oder Klinge. „Die blitzende Spitze“ macht das Bild verständlich, ohne die Waffe näher zu bestimmen.
- source_word: מִמְּרֹרָתוֹ
  choice: aus seiner Galle
  rationale: Das Wort kann Galle, Gallenblase oder Bitterkeit bezeichnen. Der anatomische Sinn passt zur beschriebenen Verwundung; „Galle“ bewahrt die drastische Bildsprache und bleibt weniger klinisch als „Gallenblase“.
- source_word: יַהֲלֹךְ עָלָיו
  choice: kommen über ihn
  rationale: הלך mit על kann hier ausdrücken, dass etwas jemanden überkommt. Die deutsche Wendung gibt den einsetzenden Schrecken natürlich wieder.
- source_word: אֵמִים
  choice: Schrecken
  rationale: Der Plural bezeichnet Schrecknisse oder furchterregende Dinge. „Schrecken“ erhält die intensive, mehrzahlige Aussage.
