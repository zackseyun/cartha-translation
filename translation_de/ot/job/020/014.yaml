  text: his food in his belly is turned[a]; it is the venom of cobras within him.
translation:
  language: de
  text: Seine Nahrung verwandelt sich in seinem Bauch; in seinem Innern wird sie zu Kobrengift.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sein Brot verwandelt sich in seinen Eingeweiden; Schlangengalle ist es in seinem Innern.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחְמוֹ
  choice: seine Nahrung
  rationale: לֶחֶם bedeutet häufig wörtlich „Brot“, bezeichnet hier im Zusammenhang der Verdauung aber allgemeiner das Gegessene. „Nahrung“ gibt diesen Sinn im modernen Deutschen natürlich wieder.
- source_word: בְּמֵעָיו
  choice: in seinem Bauch
  rationale: מֵעִים bezeichnet die inneren Organe oder Eingeweide. „Bauch“ ist im modernen Deutschen verständlich und bewahrt das körperliche Verdauungsbild.
- source_word: נֶהְפָּךְ
  choice: verwandelt sich
  rationale: Der Nifal von הפך beschreibt hier eine Zustandsänderung. „Verwandelt sich“ bringt zum Ausdruck, dass die Nahrung in ihm zu etwas anderem wird.
- source_word: מְרוֹרַת
  choice: -gift (in „Kobrengift“)
  rationale: Das Wort kann „Bitterkeit“ oder „Galle“ bedeuten, bezeichnet in Verbindung mit Giftschlangen jedoch deren tödliches Gift. Die Zusammensetzung „Kobrengift“ ist knapp und idiomatisch.
- source_word: פְּתָנִים
  choice: Kobras
  rationale: פֶּתֶן bezeichnet eine giftige Schlange und wird traditionell mit „Otter“ oder „Aspis“ wiedergegeben. „Kobras“ ist eine verständliche moderne Entsprechung, ohne die konkrete Schlangenmetaphorik aufzugeben.
- source_word: בְּקִרְבּוֹ
  choice: in seinem Innern
  rationale: Die Wendung bezeichnet hier das Innere des Menschen. „In seinem Innern“ bewahrt die körperliche Bildsprache und entspricht dem Parallelismus zu „in seinem Bauch“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der parallele Aufbau mit „in seinem Bauch“ und „in seinem Innern“ bewahrt die hebräische Körperbildlichkeit; „Kobrengift“ vermittelt die tödliche Pointe unmittelbar.
