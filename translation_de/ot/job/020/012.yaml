  yaml_path: translation/ot/job/020/012.yaml
  text: Though evil is sweet in his mouth[a], he hides it under his tongue,
translation:
  language: de
  text: Auch wenn ihm das Böse im Mund süß schmeckt[a], verbirgt er es unter seiner Zunge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn ihm das Böse im Mund süß schmeckt.“ Die hebräische Partikel kann konditional („wenn“) oder konzessiv („auch wenn/obwohl“) verstanden werden; der Zusammenhang spricht eher für den konzessiven Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Auch wenn
  rationale: Die Partikel kann eine Bedingung („wenn“) oder eine Einräumung („auch wenn/obwohl“) einleiten. Im Zusammenhang passt der konzessive Sinn gut, ohne die echte Mehrdeutigkeit zu verschweigen.
- source_word: תַּמְתִּיק
  choice: süß schmeckt
  rationale: Der Hifil von מתק kann „süß machen“ bedeuten, hier mit רָעָה als Subjekt aber idiomatisch „süß sein/schmecken“. „Süß schmeckt“ bewahrt das konkrete Mundbild in natürlichem Deutsch.
- source_word: בְּפִיו
  choice: in seinem Mund
  rationale: Die wörtliche Wiedergabe erhält das körperliche Bild und die Parallele zu „unter seiner Zunge“.
- source_word: רָעָה
  choice: das Böse
  rationale: Das Substantiv bezeichnet hier im Weisheitskontext moralisch Böses; „das Böse“ ist breit, natürlich und nicht unnötig ausdeutend.
- source_word: יַכְחִידֶנָּה
  choice: verbirgt er es
  rationale: Der Hifil von כחד bezeichnet das Verbergen oder Zurückhalten. Das feminine Suffix bezieht sich auf רָעָה; im Deutschen wird dies idiomatisch mit „es“ aufgenommen.
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: unter seiner Zunge
  rationale: Die räumliche Wendung wird konkret wiedergegeben und bewahrt das Bild des heimlichen Aufbewahrens beziehungsweise Auskostens.
