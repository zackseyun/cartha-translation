base_translation:
  language: en
  yaml_path: translation/ot/job/020/007.yaml
  text: Like his own dung[a], he will perish forever; those who saw him will say, ‘Where is he?’
translation:
  language: de
  text: 'Wie sein eigener Kot[a] wird er für immer vergehen; die ihn gesehen haben, werden sagen: »Wo ist er?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie seine eigenen Exkremente“ bzw. „Wie sein eigener Unrat“. Das Hebräische verwendet bewusst ein erniedrigendes Bild.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגֶלֲלוֹ
  choice: Wie sein eigener Kot
  rationale: גֶּלֶל bezeichnet Kot bzw. Exkremente. „Kot“ ist im Deutschen direkt und verständlich und bewahrt das bewusst erniedrigende Bild; „sein eigener“ gibt das Possessivsuffix natürlich wieder.
- source_word: לָנֶצַח
  choice: für immer
  rationale: נֶצַח bezeichnet hier eine bleibende, unbegrenzte Dauer. „Für immer“ ist die natürliche deutsche Entsprechung und unterstreicht sein endgültiges Verschwinden.
- source_word: יֹאבֵד
  choice: wird er … vergehen
  rationale: אבד kann „zugrunde gehen, umkommen, vergehen“ bedeuten. „Vergehen“ verbindet sich idiomatisch mit dem Vergleich zu Kot und bewahrt zugleich den Gedanken völligen Untergangs.
- source_word: רֹאָיו
  choice: die ihn gesehen haben
  rationale: Die substantivierte Partizipialform mit Suffix bezeichnet diejenigen, die ihn gesehen bzw. gekannt haben. Das deutsche Perfekt stellt den Rückblick auf seine frühere Gegenwart klar und natürlich dar.
- source_word: יֹאמְרוּ
  choice: werden sagen
  rationale: אמר bedeutet unmittelbar „sagen“. Die anschließende Ortsfrage wird als wörtliche Rede wiedergegeben, ohne das Verb interpretierend in „fragen“ zu ändern.
- source_word: אַיּוֹ
  choice: Wo ist er?
  rationale: Das Ortsfragewort mit pronominalem Suffix bedeutet schlicht „Wo ist er?“. Zusätze wie „jetzt“ oder „hingegangen“ wären interpretierend.
theological_decisions: []
