  yaml_path: translation/ot/job/020/002.yaml
  text: Therefore my thoughts answer me[b][a], because of my inward agitation.
translation:
  language: de
  text: Darum geben mir meine Gedanken Antwort[a], wegen meiner inneren Unruhe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Meine Gedanken drängen mich zu antworten« oder »meine beunruhigenden Gedanken geben mir Antwort«. Die hebräische Wendung ist knapp und kann sowohl bedeuten, dass seine Gedanken ihm innerlich antworten, als auch, dass sie ihn zu einer Antwort drängen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wegen der Eile in mir«. Das hebräische Wort kann Eile oder Drang bezeichnen; im Zusammenhang ist wahrscheinlich innere Unruhe oder erregte Dringlichkeit gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Rede und klingt in moderner deutscher Dichtung natürlich.
- source_word: שְׂעִפַּי
  choice: meine Gedanken
  rationale: Bezeichnet hier innere, beunruhigende oder gespaltene Gedanken. Die schlichte Wiedergabe bewahrt die Bildoffenheit; die Unruhe wird im zweiten Halbvers ausdrücklich benannt.
- source_word: יְשִׁיבוּנִי
  choice: drängen mich zu antworten
  rationale: Die komprimierte Hifil-Form von שוב kann ausdrücken, dass die Gedanken den Sprecher zur Erwiderung bringen. Diese Wiedergabe ist im Deutschen verständlich, ohne die hebräische Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: וּבַעֲבוּר
  choice: weil
  rationale: Gibt den kausalen Zusammenhang idiomatisch und klar wieder.
- source_word: חוּשִׁי
  choice: so unruhig
  rationale: Das Wort kann Eile, Drang oder innere Erregung bezeichnen. Im Zusammenhang beschreibt es am ehesten eine aufgewühlte innere Unruhe.
- source_word: בִי
  choice: in mir
  rationale: Bewahrt ausdrücklich den inneren Ort der Erregung.
