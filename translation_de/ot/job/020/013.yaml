  text: He spares it and does not let it go[a], and holds it in his mouth.
translation:
  language: de
  text: Er schont sie und lässt sie nicht los; er behält sie in seinem Mund.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in seinem Gaumen“.'
