lexical_decisions:
- source_word: יַחְמֹל עָלֶיהָ
  choice: Er schont sie
  rationale: חמל bezeichnet gewöhnlich Schonen oder Verschonen. Im Bildzusammenhang behandelt der Frevler die Bosheit wie einen süßen Bissen, den er nicht aufgeben will. „Schont“ bewahrt die konkrete Ausdrucksweise, ohne die Bedeutung vorschnell als bloßes „Festhalten“ aufzulösen.
- source_word: לֹא יַעַזְבֶנָּה
  choice: lässt sie nicht los
  rationale: עזב kann „verlassen“, „aufgeben“ oder „loslassen“ bedeuten. Hier passt „nicht loslassen“ zum körperlichen Bild des im Mund behaltenen Bissens und zugleich zur Weigerung, von der Bosheit abzulassen.
- source_word: יִמְנָעֶנָּה
  choice: behält sie
  rationale: מנע bedeutet „zurückhalten“, „vorenthalten“ oder „zurückbehalten“. Im Zusammenhang ist gemeint, dass er den süßen Bissen im Mund behält; „behält“ gibt dieses Bild in natürlichem Deutsch wieder.
- source_word: בְּתוֹךְ חִכּוֹ
  choice: in seinem Mund
  rationale: חך bezeichnet wörtlich den Gaumen. „In seinem Mund“ vermittelt das poetische Bild im modernen Deutsch klar; die genauere anatomische Bedeutung wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Das feminine Pronomen „sie“ greift die Bosheit aus Vers 12 auf. Das Semikolon wahrt die Reihung der hebräischen Verben, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes Gegensatzverhältnis einzuführen.
