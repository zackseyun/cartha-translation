  source_fidelity: Die Folgerung „darum“ und „sein Wohlstand wird keinen Bestand haben“ geben עַל־כֵּן und die kontextuell plausible Deutung von לֹא יָחִיל טוּבוֹ treffend wieder. Im ersten Satzteil fügt „das er ... konnte“ jedoch eine im Hebräischen nicht ausgedrückte Möglichkeit hinzu. שָׂרִיד bezeichnet einen Entronnenen bzw. Rest; in diesem Kontext ist die Aussage am besten als restloses Verschlingen zu verstehen.
