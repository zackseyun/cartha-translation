  text: Nothing was left for him to devour[b][a]; therefore his prosperity will not endure.
translation:
  language: de
  text: Nichts entging seinem Verschlingen[a]; darum wird sein Wohlstand keinen Bestand haben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Es gibt keinen Entronnenen für sein Essen.“ Gemeint ist, dass seinem Verzehren nichts entging bzw. nichts davon übrig blieb.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit „Bestand haben“ wiedergegebene Verb ist schwierig. Möglich sind auch „andauern“ oder, weniger wahrscheinlich in diesem Zusammenhang, „gedeihen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין שָׂרִיד
  choice: Nichts blieb übrig
  rationale: Die existenzverneinende Wendung mit שָׂרִיד („Übriggebliebenes, Rest, Entronnenes“) besagt im Zusammenhang, dass von seinem verzehrenden Zugriff nichts verschont blieb beziehungsweise nichts mehr vorhanden war.
- source_word: לְאָכְלוֹ
  choice: das er verschlingen konnte
  rationale: Der Infinitiv von אכל bezeichnet wörtlich sein Essen. „Verschlingen“ bringt hier den kontextuellen Gedanken maßlosen, restlosen Verbrauchens natürlich zum Ausdruck, ohne das Bild des Essens aufzugeben.
- source_word: עַל כֵּן
  choice: darum
  rationale: Die feste Folgerungsformel leitet die Konsequenz aus dem ersten Satzteil ein.
- source_word: יָחִיל
  choice: wird … Bestand haben
  rationale: Die schwierige Verbform wird im Kontext temporal als „andauern, Bestand haben“ verstanden. Diese Wiedergabe passt zu טוּבוֹ, ohne die weniger wahrscheinliche Deutung „gedeihen“ in den Haupttext zu übernehmen.
- source_word: טוּבוֹ
  choice: sein Wohlstand
  rationale: טוּב bezeichnet grundsätzlich das Gute beziehungsweise Wohlergehen; im Gerichtskontext ist damit der materielle und glückliche Zustand des Frevlers gemeint.
theological_decisions:
- issue: Art der Vergeltungsaussage
  choice: 'Die Aussage bleibt eine Folgebehauptung innerhalb von Zofars Rede: Sein Wohlstand hat keinen Bestand.'
  alternative: Eine allgemeingültige göttliche Verheißung formulieren.
  rationale: Der Vers gehört zur Rede einer Figur im Buch Hiob. Die Übersetzung darf Zofars Aussage weder abschwächen noch über ihren literarischen Rahmen hinaus dogmatisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verschlingen“ bewahrt das Bild des Essens und vermittelt zugleich die maßlose Gier des Zusammenhangs. Die beiden echten lexikalischen Unsicherheiten werden in Fußnoten offengelegt.
