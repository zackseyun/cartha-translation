  text: חַ֣יִל בָּ֭לַע וַ/יְקִאֶ֑/נּוּ מִ֝/בִּטְנ֗/וֹ יוֹרִשֶׁ֥/נּוּ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/015.yaml
  text: He swallowed wealth[a], but he will vomit it up[b]; God will drive it out of his belly.
translation:
  language: de
  text: Reichtum[a] hat er verschlungen, doch er wird ihn wieder erbrechen; Gott wird ihn aus seinem Bauch heraustreiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vermögen“ beziehungsweise „Besitz“ (חַיִל).'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: Reichtum
  rationale: חַיִל bezeichnet hier im Zusammenhang mit dem unrecht erworbenen Gewinn materiellen Reichtum oder Besitz. „Reichtum“ ist im modernen Deutsch natürlich und bewahrt den kollektiven Singular des Hebräischen.
- source_word: בָּלַע
  choice: hat er verschlungen
  rationale: Die konkrete Metapher des Schluckens wird beibehalten und durch das anschließende Erbrechen weitergeführt. „Verschlungen“ vermittelt zugleich die gierige Aneignung.
- source_word: וַיְקִאֶנּוּ
  choice: doch er erbricht ihn wieder
  rationale: קיא bedeutet ausdrücklich „erbrechen“. „Doch“ macht die im Zusammenhang erkennbare Umkehr deutlich; „wieder“ bezeichnet die Rückgabe dessen, was zuvor verschlungen wurde, ohne die Bildsprache abzuschwächen.
- source_word: מִבִּטְנוֹ
  choice: aus seinem Bauch
  rationale: בֶּטֶן bezeichnet hier den Bauch als Ort des verschlungenen Reichtums. Die anschauliche, körperliche Bildsprache bleibt dadurch erhalten.
- source_word: יוֹרִשֶׁנּוּ
  choice: treibt ihn heraus
  rationale: Die Hifilform beschreibt hier, dass Gott den verschlungenen Reichtum aus dem Bauch entfernen lässt beziehungsweise gewaltsam hinaustreibt. „Treibt ihn heraus“ gibt diese verursachende Ausstoßung klar wieder.
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet ausdrücklich Gott als handelndes Subjekt; die schlichte Wiedergabe „Gott“ ist sachgerecht.
theological_decisions:
- issue: Göttliche Urheberschaft beim Verlust des verschlungenen Reichtums
  choice: Gott wird ausdrücklich als derjenige genannt, der den Reichtum aus dem Bauch des Frevlers treibt.
  alternative: Der Verlust wird lediglich als unpersönliche Folge seiner Taten beschrieben.
  rationale: Im Hebräischen ist אֵל das ausdrückliche Subjekt von יוֹרִשֶׁנּוּ. Die Übersetzung bewahrt daher Gottes unmittelbare Rolle im Gericht.
- issue: Bezug des maskulinen Objektsuffixes in יוֹרִשֶׁנּוּ
  choice: 'Das Suffix wird auf den zuvor genannten Reichtum bezogen: Gott treibt ihn aus dem Bauch.'
  alternative: Die Form wird im Sinn von „Gott enteignet ihn“ auf den Menschen bezogen.
  rationale: Die Präpositionalgruppe „aus seinem Bauch“ und der Parallelismus mit „er erbricht ihn“ sprechen dafür, dass der verschlungene Reichtum das ausgestoßene Objekt ist. Die mögliche Grundbedeutung des Stammes „in Besitz setzen/enteignen“ wird durch den bildhaften Kontext auf das Heraustreiben zugespitzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst kräftiger körperlicher Bildsprache. Der Satzbau folgt der hebräischen poetischen Abfolge; „erbricht“ vermeidet die mögliche Abschwächung von קיא zu bloßem Ausspucken.
