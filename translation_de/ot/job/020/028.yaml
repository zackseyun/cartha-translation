  text: The produce of his house will be carried away[b][a], flowing away in the day of his anger.
translation:
  language: de
  text: Der Ertrag seines Hauses wird dahinschwinden[a], wird wegströmen am Tag seines Zorns.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird fortgehen“; das Verb kann weggehen, entschwinden oder – je nach Zusammenhang – entfernt werden bedeuten. Mit dem Ertrag des Hauses ist hier dessen Verlust gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist wahrscheinlich Gottes Zorn; im Hebräischen wird der Bezug jedoch nicht ausdrücklich genannt.
    reason: alternative_reading
lexical_decisions:
- source_word: יִגֶל
  choice: wird fortgeschafft
  rationale: Das Qal-Imperfekt von גלה kann ein Fortgehen oder Ins-Exil-Gehen bezeichnen. Mit יְבוּל als Subjekt beschreibt es hier idiomatisch den Verlust beziehungsweise die Entfernung des Ertrags, ohne einen bestimmten Handelnden ausdrücklich zu nennen.
- source_word: יְבוּל
  choice: Ertrag
  rationale: Das Wort bezeichnet Ertrag oder Erzeugnis. „Ertrag“ ist im Deutschen natürlich und kann hier den Zuwachs beziehungsweise Besitz des Hauses umfassen.
- source_word: בֵּיתוֹ
  choice: seines Hauses
  rationale: Die wörtliche Wendung bewahrt das hebräische Bild; „Haus“ kann zugleich Haushalt und Besitzstand einschließen.
- source_word: נִגָּרוֹת
  choice: wegfließend
  rationale: Die feminine Pluralform des Niphal-Partizips von נגר vermittelt das Bild des Abfließens oder Wegströmens. Sie nimmt sinngemäß die zum Haus gehörenden Güter auf und führt das Bild ihres Verlusts weiter.
- source_word: בְּיוֹם
  choice: am Tag
  rationale: „Am Tag“ gibt die temporale Wendung in natürlichem, feierlichem Deutsch wieder.
- source_word: אַפּוֹ
  choice: seines Zorns
  rationale: אַף bezeichnet hier Zorn; das maskuline Suffix bleibt als „seines“ erhalten. Der Kontext legt Gottes Zorn nahe, doch der hebräische Text nennt den Bezug nicht ausdrücklich.
theological_decisions:
- issue: Bezug von „seines Zorns“
  choice: Das Pronomen bleibt im Haupttext ohne ausdrückliche Nennung Gottes stehen.
  alternative: „am Tag des Zorns Gottes“
  rationale: Der Zusammenhang spricht wahrscheinlich von Gottes Gericht. Da das Hebräische den Bezug jedoch nur durch ein Pronomen ausdrückt, bleibt diese knappe Mehrdeutigkeit im Haupttext erhalten und wird in einer Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an Bild und Satzbau des Hebräischen. „Fortgeschafft“ und „wegfließend“ bewahren sowohl die Entfernung als auch das anschließende Strömungsbild; die pronominale Mehrdeutigkeit bleibt bestehen.
