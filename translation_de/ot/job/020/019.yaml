  text: כִּֽי רִ֭צַּץ עָזַ֣ב דַּלִּ֑ים בַּ֥יִת גָּ֝זַ֗ל וְ/לֹ֣א יִבֶנֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/019.yaml
  text: For he has crushed and abandoned the poor[a]; he has seized a house and will not rebuild it.
translation:
  language: de
  text: Denn er hat die Armen zerschlagen und im Stich gelassen; ein Haus hat er geraubt, ohne es gebaut zu haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Haus hat er geraubt, und er wird es nicht aufbauen.« »Haus« kann hier auch einen Hausstand bezeichnen.'
    reason: Die hebräische Imperfektform יִבְנֵהוּ kann im Kontext auf das zuvor geraubte Haus rückblicken („das er nicht gebaut hat“) oder zukunftsbezogen verstanden werden.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet im Zusammenhang die Begründung für das zuvor angekündigte Gericht ein.
- source_word: רִצַּץ
  choice: hat … zerschlagen
  rationale: Die Wiedergabe bewahrt die konkrete, gewaltsame Bildsprache des Verbs, ohne sie auf das allgemeinere »unterdrücken« zu reduzieren.
- source_word: עָזַב
  choice: im Stich gelassen
  rationale: Diese natürliche moderne Formulierung bringt das schuldhafte Verlassen der sozial Schwachen zum Ausdruck.
- source_word: דַּלִּים
  choice: die Armen
  rationale: Das Wort bezeichnet hier am ehesten wirtschaftlich und gesellschaftlich Schwache; »die Armen« ist klar und idiomatisch.
- source_word: בַּיִת
  choice: ein Haus
  rationale: Der konkrete Sinn passt zur gewaltsamen Aneignung und zum anschließenden Verb »bauen«; der weitere Sinn »Hausstand« bleibt jedoch möglich.
- source_word: גָּזַל
  choice: hat … geraubt
  rationale: Das Verb bezeichnet gewaltsames oder unrechtmäßiges Wegnehmen; »geraubt« gibt diesen stärkeren Sinn genauer wieder als bloßes »gestohlen«.
- source_word: וְלֹא יִבֶנֵהוּ
  choice: doch er wird es nicht aufbauen
  rationale: Die Zukunftsform entspricht dem gerichtlichen Zusammenhang; »aufbauen« wahrt das Bild von בנה und kann sowohl die Errichtung als auch die dauerhafte Etablierung des geraubten Hauses bezeichnen.
theological_decisions:
- issue: Zeitbezug und Sinn von וְלֹא יִבֶנֵהוּ
  choice: doch er wird es nicht aufbauen
  alternative: und er hat es nicht gebaut
  rationale: Der hebräische Imperfekt kann hier als zukünftige Folge des Gerichts verstanden werden, während ein rückblickender Sinn möglich bleibt. Die Hauptfassung folgt dem unmittelbaren Gerichtskontext, die Fußnote bewahrt die zeitliche Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die harte Bildsprache von »zerschlagen« bleibt erhalten; »im Stich gelassen« vermeidet archaisches Deutsch. Der Parallelismus des hebräischen Verses wird durch das Semikolon bewahrt.
