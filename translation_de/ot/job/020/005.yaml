source:
  edition: WLC
  text: כִּ֤י רִנְנַ֣ת רְ֭שָׁעִים מִ/קָּר֑וֹב וְ/שִׂמְחַ֖ת חָנֵ֣ף עֲדֵי רָֽגַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/005.yaml
  text: For the rejoicing of the wicked is brief[a], and the joy of the godless lasts only a moment.
translation:
  language: de
  text: Denn der Jubel der Frevler ist nur von kurzer Dauer, und die Freude des Gottlosen[a] währt nur einen Augenblick.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Freude des Heuchlers währt nur einen Augenblick“. Das hebräische Wort חָנֵף kann einen Heuchler bezeichnen, hat im Buch Hiob aber häufig den weiteren Sinn eines gottlosen Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung zur vorausgehenden Aussage ein und bewahrt den kausalen Zusammenhang.
- source_word: רִנְנַת
  choice: Jubel
  rationale: Bezeichnet einen hörbaren Ausdruck der Freude; „Jubel“ ist knapp, natürlich und erhält diese Nuance.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Gibt die substantivierte Mehrzahl für moralisch schuldige Menschen in der Sprache der Weisheitsliteratur prägnant wieder.
- source_word: מִקָּרוֹב
  choice: ist nur von kurzer Dauer
  rationale: Die Wendung ist hier zeitlich zu verstehen und bezeichnet die Kürze beziehungsweise das nahe Ende des Jubels, nicht räumliche Nähe.
- source_word: וְשִׂמְחַת
  choice: und die Freude
  rationale: Entspricht der Konstruktverbindung und bewahrt den poetischen Parallelismus zum ersten Halbvers.
- source_word: חָנֵף
  choice: des Gottlosen
  rationale: Das Wort bezeichnet in Hiob gewöhnlich einen gottlosen oder ruchlosen Menschen und nicht nur jemanden, der Frömmigkeit vortäuscht.
- source_word: עֲדֵי רָגַע
  choice: währt nur einen Augenblick
  rationale: Gibt die zeitliche Begrenzung bis auf einen sehr kurzen Zeitraum idiomatisch und poetisch wieder.
theological_decisions:
- issue: Bedeutungsumfang von חָנֵף
  choice: Gottloser
  alternative: Heuchler
  rationale: „Gottloser“ bewahrt den breiteren religiös-moralischen Sinn des hebräischen Wortes im Buch Hiob und den Parallelismus mit „Frevler“, ohne es auf vorgetäuschte Frömmigkeit zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. „Frevler“ und „Gottloser“ sind bibelsprachlich, aber weiterhin allgemein verständlich; „währt“ erhält den gehobenen poetischen Ton.
