lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: ענה bezeichnet in dieser Erzählformel das Antworten auf die vorangegangene Rede. „Antwortete“ ist im Deutschen natürlich und bewahrt die Dialogfunktion.
- source_word: צֹפַר
  choice: Zofar
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: הַנַּעֲמָתִי
  choice: der Naamatiter
  rationale: Das Gentiliz mit Artikel bezeichnet Zofar nach seiner Herkunft oder Zugehörigkeit. „Naamatiter“ ist eine verständliche deutsche Ableitung von Naama.
- source_word: וַיֹּאמַר
  choice: ':'
  rationale: Das deutsche Redeankündigungszeichen gibt die Funktion von „und sagte“ idiomatisch wieder und vermeidet die im modernen Deutschen schwerfällige Doppelung „antwortete und sagte“.
- source_word: וַ
  choice: Darauf
  rationale: Das eröffnende Waw führt die Erzählung fort und stellt Zofars Rede als Reaktion auf die vorangegangene Rede dar.
