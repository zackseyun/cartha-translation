    issue: Das כְּ in כְּחֵיל bleibt in „am Reichtum seines Tausches“ unberücksichtigt.
    rationale: Die Präposition ist gerade der schwierige Bestandteil der zweiten Vershälfte und sollte nicht in eine bloße Angabe des Gegenstands der Freude eingeebnet werden. Eine vergleichend/proportionale Formulierung erhält die sprachliche Mehrdeutigkeit besser.
  - severity: low
    issue: „wofür er sich abgemüht hat“ ist als Objekt von „gibt zurück“ weniger präzise als eine ergebnisbezogene Formulierung.
    rationale: יָגָע kann hier den Ertrag der Mühe bezeichnen. „Was er erarbeitet hat“ ist idiomatisch und macht den Bezug zum zurückgegebenen Besitz deutlich, ohne den hebräischen Ausdruck unnötig zu konkretisieren.
