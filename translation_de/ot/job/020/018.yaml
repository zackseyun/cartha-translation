  verdict: revise
  source_fidelity: Die erste Vershälfte gibt מֵשִׁיב und die bildhafte Negation von בלע im Wesentlichen treffend wieder. In der zweiten Vershälfte sollte jedoch das vorangestellte כְּ bei כְּחֵיל nicht ganz entfallen. Die Konstruktion ist knapp und schwierig; eine Wiedergabe mit „entsprechend“ wahrt ihren vergleichend-proportionalen Charakter besser, ohne eine weitergehende Deutung festzulegen.
  naturalness: „Wofür er sich abgemüht hat“ ist verständlich, bezeichnet im Deutschen aber primär den Gegenstand bzw. Zweck der Mühe. „Was er erarbeitet hat“ bezeichnet den im Kontext zurückzugebenden Ertrag unmittelbarer und bleibt natürlich. „Entsprechend dem Reichtum seines Tausches“ ist zwar gehoben, aber für den poetischen und syntaktisch dichten Text angemessen.
  terminology: „zurückgeben“, „verschlingen“, „Reichtum“ und „Tausch“ sind sachgerecht. „Tausch“ bewahrt bei תמורה die offene Bedeutung von Austausch, Gegenleistung oder eingetauschtem Erwerb. „freut sich nicht“ ist für יעלס angemessen, auch wenn „jubelt“ die Intensität alternativ stärker hervorhebt.
  issues:
