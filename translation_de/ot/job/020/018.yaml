  yaml_path: translation/ot/job/020/018.yaml
  text: He gives back what he labored for and does not swallow it down; according to the wealth of his exchange[a], he does not rejoice.
translation:
  language: de
  text: Er gibt zurück, was er erarbeitet hat, und verschlingt es nicht; entsprechend dem Reichtum seines Tausches freut er sich nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er gibt den Ertrag seiner Mühe zurück und verzehrt ihn nicht; dem Reichtum seines Tausches entsprechend jubelt er nicht.« Die zweite Vershälfte ist im Hebräischen knapp formuliert; insbesondere die Bedeutung der vorangestellten Präposition lässt mehrere eng verwandte Wiedergaben zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵשִׁיב
  choice: gibt zurück
  rationale: Das Hifil-Partizip von שוב bezeichnet hier das Zurückgeben beziehungsweise Zurückerstatten des Erworbenen.
- source_word: יָגָע
  choice: wofür er sich abgemüht hat
  rationale: Das Wort kann die Mühe selbst oder das durch Mühe Erworbene bezeichnen. Als Objekt von »gibt zurück« ist die ergebnisbezogene Wiedergabe im Deutschen am verständlichsten.
- source_word: וְלֹא יִבְלָע
  choice: und verschlingt es nicht
  rationale: בלע bedeutet konkret »verschlingen«. Das bewahrt das eindringliche Bild dafür, dass er das Erworbene weder verzehren noch behalten kann.
- source_word: כְּחֵיל
  choice: am Reichtum
  rationale: חֵיל bezeichnet hier wahrscheinlich Vermögen oder Reichtum. Die knappe Konstruktion mit כ ist schwierig; zusammen mit dem folgenden Verb ergibt sich sinngemäß der Reichtum als Gegenstand der Freude.
- source_word: תְּמוּרָתוֹ
  choice: seines Tausches
  rationale: תמורה bezeichnet Tausch, Ersatz oder das im Tausch Erlangte. »Seines Tausches« erhält den lexikalischen Kern und die Mehrdeutigkeit.
- source_word: וְלֹא יַעֲלֹס
  choice: freut er sich nicht
  rationale: עלס bezeichnet ausgelassene Freude oder Frohlocken. Die Formulierung ist natürlich und gibt die verneinte Freude am erworbenen Vermögen wieder.
theological_decisions: []
translation_notes:
