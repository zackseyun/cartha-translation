base_translation:
  language: en
  yaml_path: translation/ot/job/020/026.yaml
  text: All darkness is hidden up for his treasures[a]; a fire not blown will consume him[c][b]; it will feed on what remains in his tent.
translation:
  language: de
  text: Alle Finsternis ist für seine verborgenen Vorräte aufbewahrt[a]. Ein Feuer, das nicht angefacht wurde, wird ihn verzehren[b]; es wird dem Rest in seinem Zelt Schaden zufügen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle Finsternis ist für ihn aufbewahrt.“ Die hebräische Wendung ist schwierig und kann entweder das für ihn aufgesparte Unheil oder das in seinen Vorräten Verborgene meinen.'
    reason: alternative_reading
  - marker: b
    text: „Nicht angefacht“ kann bedeuten, dass dieses Feuer weder durch menschlichen Atem entfacht noch geschürt wurde; möglicherweise ist ein von Gott gesandtes oder ohne menschliches Zutun brennendes Feuer gemeint.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Es wird dem Überlebenden in seinem Zelt Schaden zufügen“ beziehungsweise „es wird den Rest in seinem Zelt verzehren“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חֹשֶׁךְ
  choice: Alle Finsternis
  rationale: Bewahrt das umfassende כָּל und das konkrete wie metaphorische Bild von חֹשֶׁךְ, das im Zusammenhang Unheil und Gericht bezeichnet.
- source_word: טָמוּן לִצְפּוּנָיו
  choice: ist für seine verborgenen Schätze aufbewahrt
  rationale: Gibt den passiven Sinn von טָמוּן als verborgen beziehungsweise aufgespart wieder und lässt die schwierige Beziehung zu צְפוּנָיו als seinen verborgenen Vorräten oder Schätzen erkennen.
- source_word: תְּאָכְלֵהוּ אֵשׁ
  choice: Ein Feuer … wird ihn verzehren
  rationale: „Verzehren“ ist bei Feuer natürlich und bewahrt die zerstörerische Kraft des Verbs אָכַל; das Suffix wird personal mit „ihn“ wiedergegeben.
- source_word: לֹא נֻפָּח
  choice: das nicht angefacht wurde
  rationale: Das passive נֻפָּח bezeichnet ein Feuer, das nicht durch Blasen entfacht oder geschürt wurde. „Angefacht“ ist im Deutschen idiomatisch, ohne die mögliche übermenschliche Herkunft ausdrücklich festzulegen.
- source_word: יֵרַע שָׂרִיד
  choice: es wird fressen, was … übrig ist
  rationale: Die schwierige Wendung wird im Bild des Feuers als zerstörerisches Fressen verstanden; שָׂרִיד bleibt unpersönlich als das Übriggebliebene, während die mögliche Bedeutung „Überlebender“ in der Fußnote erhalten bleibt.
- source_word: בְּאָהֳלוֹ
  choice: in seinem Zelt
  rationale: Die wörtliche und poetisch anschauliche Bezeichnung bleibt erhalten; das Zelt kann zugleich für Hausstand und Haushalt stehen.
theological_decisions:
- issue: Ursprung des nicht angefachten Feuers
  choice: Die Übersetzung sagt nur, dass das Feuer nicht angefacht wurde.
  alternative: Ein von Gott gesandtes Feuer beziehungsweise ein Feuer, das kein Mensch entfacht hat.
  rationale: Der Kontext kann göttliches Gericht nahelegen, doch der hebräische Wortlaut benennt den Urheber nicht ausdrücklich; diese Spannung wird nicht dogmatisch aufgelöst.
- issue: Bezug von שָׂרִיד
  choice: 'unpersönlich: „was … übrig ist“'
  alternative: „der Überlebende“ oder „der Rest“ in seinem Zelt
  rationale: Das Wort kann einen Überlebenden oder einen Rest bezeichnen. Die Hauptfassung passt zum Feuerbild und vermeidet eine Festlegung auf eine Person; die Alternative wird vermerkt.
translation_notes:
  register: Moderne, würdige Standardsprache mit erhaltener Bildhaftigkeit. „Finsternis“, „Feuer“ und „Zelt“ bleiben als konkrete poetische Bilder stehen. Die schwer deutbaren Wendungen werden in der Hauptfassung lesbar wiedergegeben, ihre echte lexikalische und syntaktische Mehrdeutigkeit jedoch durch Fußnoten offengehalten.
