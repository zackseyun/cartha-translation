  text: His bones are full of his youthful vigor[a], but it will lie down with him in the dust.
translation:
  language: de
  text: Seine Knochen waren voll von seiner Jugendkraft[a], doch sie wird mit ihm im Staub liegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „voll von seiner Jugend“; das hebräische Wort kann die Jugend selbst oder die mit ihr verbundene Kraft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹתָיו
  choice: seine Knochen
  rationale: עֶצֶם bezeichnet konkret einen Knochen; der Plural mit Suffix der 3. Person maskulin Singular ergibt „seine Knochen“ und bewahrt das hebräische Körperbild.
- source_word: מָלְאוּ
  choice: waren voll
  rationale: Das Qal Perfekt in der 3. Person Plural stimmt mit „Knochen“ überein. Die Vergangenheitsform beschreibt die frühere Lebenskraft des Frevlers.
- source_word: עֲלוּמָיו
  choice: jugendlicher Kraft
  rationale: Der Ausdruck kann die Jugend selbst oder die mit ihr verbundene Kraft und Vitalität bezeichnen. „Jugendliche Kraft“ ergibt im Zusammenhang ein natürliches Bild, ohne die lexikalische Alternative zu verschweigen.
- source_word: וְעִמּוֹ
  choice: mit ihm
  rationale: עִם mit dem Suffix der 3. Person maskulin Singular bezeichnet hier die Begleitung in Tod und Grab.
- source_word: עַל־עָפָר
  choice: in den Staub
  rationale: עַל bedeutet formal „auf/über“. In Verbindung mit שׁכב und dem Todesmotiv gibt „in den Staub“ die Zielrichtung und das Begräbnisbild im Deutschen idiomatisch wieder.
- source_word: תִּשְׁכָּב
  choice: sie legt sich
  rationale: Das Qal Imperfekt in der 3. Person feminin Singular wird auf die im Deutschen feminine „Kraft“ bezogen. „Sich legen“ bewahrt das poetische Bild des Niederlegens im Staub.
theological_decisions:
- issue: Bezug des femininen Singularverbs תִּשְׁכָּב
  choice: Das Pronomen „sie“ bezieht sich auf die jugendliche Kraft.
  alternative: Ein unbestimmtes „es“ oder ein Bezug auf die Jugend.
  rationale: Das Hebräische lässt den Bezug poetisch knapp; die deutsche feminine Form „Kraft“ ermöglicht einen grammatisch klaren Bezug, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkretem Körperbild. „Doch“ markiert den scharfen Gegensatz zwischen früherer Jugendkraft und ihrem Ende im Staub; die personifizierende feminine Fortführung bleibt erhalten.
