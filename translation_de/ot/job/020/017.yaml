base_translation:
  language: en
  yaml_path: translation/ot/job/020/017.yaml
  text: He will not look upon streams[a], rivers flowing with honey and curds.
translation:
  language: de
  text: Er wird keine Wasserläufe sehen[a], keine Flüsse und keine Bäche von Honig und Rahm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, als Wunschform: Möge er keine Wasserläufe sehen.'
    reason: grammatical_alternative
  - marker: b
    text: 'Oder: Kanäle, Flüsse und Wadis von Honig und Dickmilch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יֵרֶא
  choice: Er wird … nicht sehen
  rationale: 'אַל mit dem Imperfekt bezeichnet hier im Zusammenhang poetisch das Geschick des Frevlers: Er wird den geschilderten Überfluss nicht erleben. Die deutsche Zukunftsform bewahrt den Aussagecharakter; eine jussivische Deutung bleibt möglich und wird in der Fußnote genannt.'
- source_word: בִפְלַגּוֹת
  choice: die Wasserläufe
  rationale: פְלַגּוֹת bezeichnet geteilte Wasserläufe oder Kanäle. Die Präposition ב wird in Verbindung mit ראה idiomatisch behandelt, statt unnatürlich mit „in“ wiedergegeben zu werden.
- source_word: נַהֲרֵי
  choice: die Flüsse
  rationale: Der Konstruktplural von נָהָר wird als eigener Begriff wiedergegeben, damit die poetische Häufung von Gewässerbezeichnungen erhalten bleibt.
- source_word: נַחֲלֵי
  choice: Bäche, die … fließen
  rationale: נַחַל kann Bach, Wildbach oder Wadi bezeichnen. „Bäche“ vermittelt das Bild fließender Fülle im modernen Deutschen; „die … fließen“ macht die Konstruktverbindung idiomatisch verständlich.
- source_word: דְּבַשׁ
  choice: Honig
  rationale: Dies ist die übliche und kontextgemäße Wiedergabe von דְּבַשׁ im Bild überreichen Segens.
- source_word: וְחֶמְאָה
  choice: und Rahm
  rationale: חֶמְאָה bezeichnet ein dickes Milchprodukt und kann je nach Zusammenhang als Dickmilch, Rahm oder Butter verstanden werden. „Rahm“ klingt natürlich und vermeidet die Vorstellung industriell hergestellter Butter.
theological_decisions:
- issue: Aussage über das künftige Geschick oder Wunsch-/Sollform
  choice: „Er wird … nicht sehen“ als Feststellung seines Geschicks
  alternative: „Er soll … nicht sehen“ oder „Möge er … nicht sehen“
  rationale: Im Zusammenhang beschreibt Zofar, was dem Frevler widerfahren wird. Zugleich lässt die Verbindung אַל mit dem Imperfekt eine jussivische Nuance zu; diese wird nicht dogmatisch ausgeschlossen, sondern in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei hebräischen Gewässerbegriffe werden getrennt wiedergegeben, ohne ihre Unterschiede zu überzeichnen. „Rahm“ wahrt das pastorale Bild und bleibt allgemein verständlich.
