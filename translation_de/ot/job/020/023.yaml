source:
  edition: WLC
  text: יְהִ֤י לְ/מַלֵּ֬א בִטְנ֗/וֹ יְֽשַׁלַּח בּ֭/וֹ חֲר֣וֹן אַפּ֑/וֹ וְ/יַמְטֵ֥ר עָ֝לֵ֗י/מוֹ בִּ/לְחוּמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/023.yaml
  text: When he is about to fill his belly[a], he will send against him the burning of his anger and rain it upon him as his food.
translation:
  language: de
  text: Wenn er im Begriff ist, seinen Bauch zu füllen, wird er die Glut seines Zorns gegen ihn senden und sie auf ihn herabregnen lassen als seine Speise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie auf ihn herabregnen lassen, während er isst.“ Die hebräische Schlusswendung ist schwierig; sie kann das herabregnende Gericht enger mit seiner Speise oder mit dem Zeitpunkt des Essens verbinden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי לְמַלֵּא
  choice: Wenn er im Begriff ist, … zu füllen
  rationale: 'Die Konstruktion wird im Zusammenhang als zeitliche Umstandsangabe verstanden: Das Gericht trifft den Frevler gerade dann, wenn er sich sättigen will. Die Formulierung wahrt zugleich den Bezug auf das Füllen.'
- source_word: בִטְנוֹ
  choice: seinen Bauch
  rationale: „Bauch“ bewahrt das konkrete körperliche Bild von Essen, Begierde und Sättigung.
- source_word: יְשַׁלַּח בּוֹ
  choice: wird er … gegen ihn senden
  rationale: שלח bedeutet unmittelbar „senden“; ב wird hier als feindlich gerichtete Beziehung wiedergegeben. Das erste „er“ bezeichnet im Kontext Gott, das zweite den Frevler.
- source_word: חֲרוֹן אַפּוֹ
  choice: die Glut seines Zorns
  rationale: Die deutsche Wendung erhält die hebräische Metapher der brennenden, heißen Zornesregung und klingt zugleich natürlich und würdig.
- source_word: וְיַמְטֵר עָלֵימוֹ
  choice: und sie auf ihn herabregnen lassen
  rationale: Der Hifil von מטר bezeichnet das Regnenlassen beziehungsweise Herabregnen. Das poetische עָלֵימוֹ wird kontextgemäß auf den einzelnen Frevler bezogen.
- source_word: בִּלְחוּמוֹ
  choice: als seine Speise
  rationale: 'Die schwierige Schlussformulierung wird eng mit dem Bedeutungsfeld „Speise/Nahrung“ verbunden. „Als seine Speise“ bewahrt die bittere Umkehrung: Anstelle der erhofften Sättigung empfängt er Gericht, ohne die lexikalische Unsicherheit zu verschweigen.'
theological_decisions:
- issue: Unausgesprochenes Subjekt der Gerichtsverben
  choice: Gott bleibt durch das maskuline Singularpronomen „er“ als kontextuelles Subjekt erkennbar.
  alternative: Eine unpersönliche oder passive Wiedergabe, die das Subjekt offenlässt.
  rationale: Der Zusammenhang beschreibt göttliches Gericht, und „sein Zorn“ weist am natürlichsten auf Gott. Ein Eigenname wird jedoch nicht ergänzt, weil er im hebräischen Vers nicht ausdrücklich steht.
- issue: Bezug der herabregnenden Gerichtsgröße
  choice: Das feminine Pronomen „sie“ nimmt die „Glut“ auf.
  alternative: 'Ohne Pronomen: „und auf ihn herabregnen lassen als seine Speise“, oder sinngemäß „seinen Zorn … herabregnen lassen“.'
  rationale: Das Pronomen macht die deutsche Syntax verständlich, ohne eine neue Gerichtsgröße einzuführen; der poetische Bildwechsel bleibt erhalten.
translation_notes:
  register: Modernes Standarddeutsch in würdig-poetischem Register. „Bauch“, „Glut“ und „herabregnen“ erhalten die kräftigen Körper-, Feuer- und Wetterbilder des Hebräischen. Die schwer deutbare Schlusswendung wird im Text knapp und in der Fußnote transparent wiedergegeben.
