  yaml_path: translation/ot/job/020/003.yaml
  text: I hear a rebuke that shames me[b][a], and the spirit of my understanding answers me.
translation:
  language: de
  text: Eine Zurechtweisung, die mich beschämt, höre ich; und ein Geist aus meiner Einsicht antwortet mir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Geist meiner Einsicht antwortet mir“; die Präposition kann die Herkunft des Geistes aus seiner Einsicht besonders hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסַר
  choice: Zurechtweisung
  rationale: Das Wort bezeichnet hier eine tadelnde Korrektur bzw. Mahnung. „Zurechtweisung“ gibt den verbalen Tadel natürlich wieder, ohne den weiteren Sinn von Erziehung oder Unterweisung aufzudrängen.
- source_word: כְּלִמָּתִי
  choice: beschämende
  rationale: Die Form bezeichnet die mit der Zurechtweisung verbundene Schmach oder Beschämung des Sprechers. Das attributive Adjektiv ergibt im Deutschen eine natürliche, knappe Wiedergabe.
- source_word: אֶשְׁמָע
  choice: höre ich
  rationale: Das hebräische Imperfekt beschreibt hier Zofars gegenwärtiges Wahrnehmen der Zurechtweisung.
- source_word: רוּחַ
  choice: der Geist
  rationale: Gemeint ist der innere Antrieb oder die innere Regung des Sprechers. „Geist“ bewahrt das hebräische Bild und legt die Bedeutung nicht vorschnell auf „Verstand“ fest.
- source_word: מִבִּינָתִי
  choice: meiner Einsicht
  rationale: Die Präposition מִן kann Herkunft ausdrücken („aus/von meiner Einsicht“) oder die innere Regung eng mit der Einsicht verbinden. Der Haupttext bleibt idiomatisch; Fußnote [a] bewahrt die Herkunftsnuance.
- source_word: יַעֲנֵנִי
  choice: gibt mir Antwort
  rationale: Das Qal von ענה bedeutet gewöhnlich „antworten“. Mit dem Objektsuffix entsteht hier das Bild, dass der innere Geist dem Sprecher antwortet; die mögliche kausative Sinnnuance wird in Fußnote [b] erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht personifizierende Aussage vom „Geist“, der Antwort gibt, bleibt erhalten; die Mehrdeutigkeit der Präposition und des Schlussverbs wird durch Fußnoten offengehalten.
