revisions:
- from: Eine beschämende Zurechtweisung höre ich; doch der Geist meiner Einsicht gibt mir Antwort.[a][b]
  to: Eine Zurechtweisung, die mich beschämt, höre ich; und ein Geist aus meiner Einsicht antwortet mir.[a]
  rationale: Die Revision klärt, dass die Zurechtweisung Zofar beschämt, gibt die Herkunftsnuance von מִבִּינָתִי im Haupttext wieder und entfernt die sprachlich nicht hinreichend gestützte kausative Fußnote zu יַעֲנֵנִי. Die poetische Personifizierung des Geistes sowie die mögliche engere Zuordnung zu seiner Einsicht bleiben erhalten.
