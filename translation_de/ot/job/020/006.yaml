  variant: modern standard German
source:
  edition: WLC
  text: אִם יַעֲלֶ֣ה לַ/שָּׁמַ֣יִם שִׂיא֑/וֹ וְ֝/רֹאשׁ֗/וֹ לָ/עָ֥ב יַגִּֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/006.yaml
  text: Though his exaltation rises to the heavens[a], and his head reaches to the clouds[b],
translation:
  language: de
  text: Wenn auch[a] seine Höhe[b] bis zum Himmel steigt und sein Haupt bis an die Wolken reicht,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn seine Höhe … steigt“. Das hebräische אִם kann eine einfache Bedingung („wenn“) oder hier eine Einräumung („wenn auch“, „obwohl“) ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Höhe“ kann auch „Erhöhung“ oder „Erhabenheit“ bedeuten; das Bild kann daher außer körperlicher Größe auch hohen Rang oder Stolz bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: wenn auch
  rationale: אִם kann eine einfache Bedingung („wenn“) einleiten; im Zusammenhang eröffnet es jedoch am natürlichsten eine zugestandene Möglichkeit. „Wenn auch“ bewahrt im Deutschen den konditionalen Anklang und gibt zugleich den konzessiven Sinn wieder.
- source_word: יַעֲלֶה
  choice: steigt
  rationale: Das Qal-Imperfekt von עלה bezeichnet eine Aufwärtsbewegung. „Steigt“ ist im Deutschen knapp, natürlich und für das poetische Höhenbild passend.
- source_word: לַשָּׁמַיִם
  choice: bis zum Himmel
  rationale: Die Präposition bezeichnet hier das Ziel beziehungsweise die erreichte Höhe. „Bis zum Himmel“ ist idiomatisches Deutsch und erhält die Größe des Bildes.
- source_word: שִׂיאוֹ
  choice: seine Höhe
  rationale: שִׂיא bezeichnet Höhe, Erhabenheit oder Überhöhung. „Seine Höhe“ hält zunächst das räumliche Bild fest, ohne die mögliche Bedeutung von Rang, Überheblichkeit oder Selbsterhöhung auszuschließen.
- source_word: וְרֹאשׁוֹ
  choice: und sein Haupt
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“, kann im Höhenbild aber auch die Spitze meinen. „Haupt“ wahrt die Personifikation und entspricht dem würdigen poetischen Register.
- source_word: לָעָב
  choice: bis an die Wolken
  rationale: עָב bezeichnet eine Wolke oder dichte Wolkenmasse. Der deutsche Plural „die Wolken“ gibt das gemeinte Himmelsbild natürlich wieder und steht parallel zu „Himmel“.
- source_word: יַגִּיעַ
  choice: reicht
  rationale: Das Hiphil von נגע drückt hier aus, dass etwas bis zu einem Ziel gelangt. „Reicht bis an“ bildet die räumliche Vorstellung idiomatisch ab.
theological_decisions:
- issue: Räumliche Höhe oder übertragene Erhöhung des Frevlers
  choice: „Höhe“ im Haupttext, mit offengehaltener übertragener Bedeutung
  alternative: „Erhöhung“ oder „Erhabenheit“
  rationale: Der Parallelismus mit „Haupt“ und „Wolken“ stützt ein konkretes Höhenbild; der Kontext kann zugleich gesellschaftliche Größe, Stolz oder Selbsterhöhung mitschwingen lassen. Die Übersetzung legt diese Spannung nicht einseitig fest.
translation_notes:
  register: Moderne, würdige poetische Sprache. „Haupt“ erhält die bildhafte Parallelität und wirkt in diesem Weisheitstext angemessen, ohne altertümliche Satzformen zu verwenden. Die abschließende Interpunktion bleibt offen, da der Satz in Vers 7 fortgeführt wird.
