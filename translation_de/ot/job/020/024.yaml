  terminology: „Eiserne Waffe“ gibt נשק ברזל angemessen wieder; „bronzen“ ist für נחושה historisch und terminologisch passend. Die Fußnote wahrt die formalere Alternative „durch ihn hindurchgehen“, ohne den Kontextbefund als zwingend auszugeben.
