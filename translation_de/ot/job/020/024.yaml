lexical_decisions:
- source_word: יִבְרַח
  choice: Er flieht
  rationale: Das Qal-Imperfekt 3. Person maskulin Singular von ברח bezeichnet Fliehen oder Entkommen. Das deutsche Präsens wirkt in der lebhaften poetischen Schilderung natürlich und kann zugleich zukünftiges Geschehen ausdrücken.
- source_word: מִנֵּשֶׁק בַּרְזֶל
  choice: vor einer eisernen Waffe
  rationale: נשק kann Waffen oder Bewaffnung allgemein bezeichnen; zusammen mit בַּרְזֶל ist „eiserne Waffe“ eine knappe, kontextgerechte Wiedergabe.
- source_word: תַּחְלְפֵהוּ
  choice: durchbohrt ihn
  rationale: חלף bedeutet grundlegend „hindurchgehen“ oder „vorübergehen“. Im Zusammenhang eines Bogens und seines Opfers bezeichnet die Form wahrscheinlich das Durchdringen durch ein Geschoss; „durchbohrt ihn“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: ein bronzener Bogen
  rationale: קֶשֶׁת bezeichnet den Bogen; נְחוּשָׁה das Material Bronze beziehungsweise Kupferlegierung. „Bronzener Bogen“ bewahrt das Waffenbild.
