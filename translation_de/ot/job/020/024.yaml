  source_fidelity: 'Der hebräische Parallelismus stellt zwei Imperfektformen nebeneinander: „Er wird vor einer eisernen Waffe fliehen; ein bronzener Bogen wird ihn durchdringen.“ Die Wiedergabe „durchbohren“ trifft den im Kontext naheliegenden Sinn von תחלפהו. Das eingefügte adversative „doch“ ist jedoch nicht ausdrücklich markiert, und das Präsens schwächt die naheliegende Zukunfts-/Folgeperspektive ab.'
