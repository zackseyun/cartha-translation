  text: He will flee from an iron weapon[b][a]; a bronze bow will pierce him through.
translation:
  language: de
  text: Er wird vor einer eisernen Waffe fliehen; ein bronzener Bogen wird ihn durchbohren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
