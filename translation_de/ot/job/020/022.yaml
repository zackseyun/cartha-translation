- from: In der Fülle seines Überflusses gerät er in Bedrängnis[a]; jede Hand eines Elenden kommt über ihn[b].
  to: Wenn sein Überfluss voll ist, wird er in Bedrängnis geraten[a]; jede Hand der Elenden wird über ihn kommen[b].
