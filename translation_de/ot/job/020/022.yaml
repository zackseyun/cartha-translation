base_translation:
  language: en
  yaml_path: translation/ot/job/020/022.yaml
  text: In the fullness of his abundance[a], distress will come upon him[b]; every hand of the miserable will come against him.
translation:
  language: de
  text: Wenn sein Überfluss voll ist, wird er in Bedrängnis geraten[a]; jede Hand der Elenden wird über ihn kommen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn sein Genügen voll ist, wird es ihm eng.“ Der hebräische Satz ist knapp; die Wörter können sowohl Überfluss bzw. Genügen als auch Enge bzw. Bedrängnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Jede Hand der Elenden“ kann auch mit „jede Hand der sich Abmühenden“ oder „jede Hand der Notleidenden“ wiedergegeben werden; „wird über ihn kommen“ kann im Zusammenhang auch „wird gegen ihn kommen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְלֹאות שִׂפְקוֹ
  choice: In der Fülle seines Überflusses
  rationale: Die Verbindung bezeichnet zeitlich-umständlich den Höhepunkt dessen, was ihm genügt bzw. seinen Überfluss. Die bildhafte und kompakte Form des Hebräischen bleibt erhalten.
- source_word: יֵצֶר לוֹ
  choice: gerät er in Bedrängnis
  rationale: Die Wendung drückt Enge oder Bedrängnis aus, die ihn trifft. Die deutsche Formulierung ist natürlich und bewahrt den Zukunftsbezug.
- source_word: כָּל יַד
  choice: jede Hand
  rationale: Die wörtliche Bildsprache bezeichnet die handelnde Macht oder Gewalt und lässt den distributiven Sinn von כָּל erkennen.
- source_word: עָמֵל
  choice: eines Elenden
  rationale: Das Wort kann Mühsal, einen sich Abmühenden oder einen von Elend Betroffenen bezeichnen. Im Zusammenhang ist „Elender“ knapp und wahrt die Verbindung zu Not und Mühsal.
- source_word: תְּבוֹאֶנּוּ
  choice: kommt über ihn
  rationale: בוא mit Objektsuffix bedeutet hier, dass die betreffende Hand ihn erreicht bzw. über ihn kommt. Die Formulierung vermeidet eine stärkere feindliche Explizierung, als der hebräische Wortlaut zwingend verlangt.
