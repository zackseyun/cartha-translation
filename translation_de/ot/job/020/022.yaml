  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: Der Höhepunkt von Zofars Überfluss wird von Bedrängnis abgelöst, und die ‚Hand‘ der von Mühsal bzw. Elend Betroffenen trifft ihn. Die Zukunftsformen der hebräischen Imperfekta sollten im Deutschen jedoch ausdrücklich als Zukunft wiedergegeben werden. Für עָמֵל ist eine kollektiv verstandene Pluralform angemessener als der missverständlich individualisierende Singular „eines Elenden“.'
  naturalness: „In der Fülle seines Überflusses“ ist verständlich, aber im modernen Deutsch etwas schwerfällig; „Wenn sein Überfluss voll ist“ bewahrt die hebräische Wiederholung von Fülle und Genügen/Überfluss und klingt als temporaler Satz natürlicher. „Jede Hand der Elenden“ ist als bewusst bildhafte, gehobene Formulierung verständlich; die Fußnote erläutert sie.
  terminology: „Bedrängnis“ trifft יֵצֶר gut. „Elende“ gibt עָמֵל als Menschen in Mühsal/Elend wieder, ohne es auf bloße Arbeitsleistung oder auf eine bestimmte soziale bzw. theologische Gruppe festzulegen. Die Metonymie „Hand“ bleibt erhalten.
