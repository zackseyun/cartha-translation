  text: בָּ֭נָי/ו יְרַצּ֣וּ דַלִּ֑ים וְ֝/יָדָ֗י/ו תָּשֵׁ֥בְנָה אוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/010.yaml
  text: His sons will seek the favor of the poor[b][a], and his own hands will give back his wealth.
translation:
  language: de
  text: Seine Söhne werden die Armen um Gunst bitten[a], und seine eigenen Hände werden sein Vermögen zurückgeben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werden die Armen beschwichtigen«. Das hebräische Verb kann bedeuten, dass man um die Gunst anderer wirbt oder Menschen zu besänftigen sucht, denen Unrecht widerfahren ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »werden seinen Besitz zurückerstatten«; möglicherweise auch: »seine Kraft«. Das hebräische Wort kann Vermögen, Besitz oder Kraft bezeichnen; im Zusammenhang liegt »Vermögen« am nächsten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das maskuline Pluralwort mit Suffix bezeichnet hier am unmittelbarsten seine Söhne; eine geschlechtsneutrale Wiedergabe wäre weniger formnah.
- source_word: יְרַצּוּ
  choice: werden … um Gunst bitten
  rationale: Das Piel von רצה kann hier das Bemühen um Annahme oder Wohlwollen ausdrücken. Die Formulierung ist im Deutschen natürlich und lässt den Gedanken des Beschwichtigens als Alternative offen.
- source_word: דַלִּים
  choice: die Armen
  rationale: דלים bezeichnet häufig wirtschaftlich Arme oder sozial Schwache; im Zusammenhang ist »die Armen« die direkte und verständliche Wiedergabe.
- source_word: יָדָיו
  choice: seine eigenen Hände
  rationale: Die wörtliche Wendung »seine Hände« wird mit »eigenen« leicht hervorgehoben und bezeichnet seine persönliche Rückerstattung.
- source_word: תָּשֵׁבְנָה
  choice: werden … zurückgeben
  rationale: Der Hiphil von שוב bedeutet, etwas zurückkehren zu lassen, also es zurückzugeben oder wiederzuerstatten.
- source_word: אוֹנוֹ
  choice: sein Vermögen
  rationale: אוֹן kann Vermögen, Besitz, Kraft oder Stärke bezeichnen. Der Zusammenhang mit den Armen und der Rückerstattung spricht hier am ehesten für materielles Vermögen.
