  terminology: „Söhne“, „die Armen“, „Vermögen“ und „zurückgeben“ sind kontextgerecht. Die Fußnoten erfassen die wesentlichen lexikalischen Spielräume von ירצה und און, ohne eine theologische oder konfessionelle Deutung einzutragen.
