  source_fidelity: 'Die Übersetzung gibt die beiden parallelen Aussagen des Hebräischen zuverlässig wieder: בניו als „seine Söhne“, ירצו דלים als Bitten der Armen um Gunst bzw. ihr Beschwichtigen, und תשבנה אונו als Rückgabe seines Vermögens. Die Bildsprache von „seinen Händen“ bleibt erhalten. „Eigenen“ macht den im Parallelismus nahegelegten Kontrast zwischen den Söhnen und ihm selbst verständlich, ohne den Sinn zu verändern.'
