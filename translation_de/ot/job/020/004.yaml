  source_fidelity: Die explizite Negation in „Weißt du das nicht“ steht nicht im Hebräischen. Die rhetorische Erwartung der Frage kann im Deutschen ohne hinzugefügte Negation gewahrt werden. Die Zeitangaben und die passive Platzierung des Menschen auf der Erde sind ansonsten sachgerecht wiedergegeben.
  naturalness: „Weißt du dies seit Urzeiten, seit der Mensch auf die Erde gesetzt wurde?“ ist modernes, würdiges Standarddeutsch. Die Wiederholung von „seit“ bildet die zwei hebräischen Zeitbestimmungen nachvollziehbar ab und bleibt flüssig.
  terminology: „der Mensch“ gibt אָדָם angemessen als generischen Singular wieder. „auf die Erde gesetzt“ entspricht שִׂים עֲלֵי אָרֶץ ohne die stärker deutende Aussage einer Erschaffung oder Ansiedlung.
