  text: הֲ/זֹ֣את יָ֭דַעְתָּ מִנִּי עַ֑ד מִנִּ֤י שִׂ֖ים אָדָ֣ם עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/004.yaml
  text: Have you known this from of old[a], since man was placed on the earth?
translation:
  language: de
  text: 'Weißt du dies seit Urzeiten,

    seit der Mensch auf die Erde gesetzt wurde?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲזֹאת
  choice: das
  rationale: Das Demonstrativpronomen führt den Inhalt der rhetorischen Frage ein; im Deutschen verweist „das“ natürlich auf die folgende, von Zofar vorausgesetzte Wahrheit.
- source_word: יָדַעְתָּ
  choice: weißt du ... nicht
  rationale: Das Qal Perfekt 2. Person maskulin Singular bezeichnet hier in einer rhetorischen Frage ein seit jeher verfügbares Wissen. Die verneinte deutsche Frage gibt die erwartete bejahende Antwort idiomatisch wieder, ohne den Aussagegehalt zu verändern.
- source_word: מִנִּי עַד
  choice: seit alters her
  rationale: Die Wendung verweist auf ferne Vorzeit. „Seit alters her“ ist eine natürliche, gehobene und zeitlich passende deutsche Entsprechung.
- source_word: מִנִּי שִׂים
  choice: seit ... gesetzt wurde
  rationale: 'Die Präposition mit dem Infinitiv bezeichnet den Ausgangspunkt in der Zeit: seit dem Setzen beziehungsweise Ansiedeln des Menschen.'
- source_word: שִׂים
  choice: gesetzt wurde
  rationale: „Setzen“ bewahrt die Grundbedeutung des Verbs und passt zur Ortsangabe „auf die Erde“, ohne stärker deutend „erschaffen“ oder „angesiedelt“ zu übersetzen.
- source_word: אָדָם
  choice: der Mensch
  rationale: Das singularische אָדָם ist hier generisch. „Der Mensch“ bewahrt im Deutschen sowohl Singularform als auch den umfassenden Bezug auf die Menschheit, ohne ausschließlich männlich verstanden werden zu müssen.
- source_word: עֲלֵי אָרֶץ
  choice: auf die Erde
  rationale: Die Wendung ist lokativ. Wegen des Bewegungs- beziehungsweise Setzungsverbs ist im Deutschen der Akkusativ „auf die Erde“ natürlich und präzise.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: der Mensch
  alternative: die Menschheit
  rationale: „Der Mensch“ entspricht der singularischen, repräsentativen Form des Hebräischen und ist im modernen Standarddeutsch zugleich generisch. „Die Menschheit“ würde den kollektiven Sinn ausdrücken, aber die grammatische Bildhaftigkeit des einzelnen repräsentativen Menschen abschwächen.
- issue: Rhetorische Form der Eingangsfrage
  choice: Weißt du das nicht ...?
  alternative: Hast du das gewusst ...?
  rationale: Das Hebräische enthält keine ausdrückliche Negation, erwartet aber rhetorisch Zustimmung. Im Deutschen bringt „Weißt du das nicht?“ diese pragmatische Kraft idiomatisch zum Ausdruck; die Alternative wäre formal näher am Perfekt, klänge jedoch wie eine Frage nach früherem, möglicherweise beendetem Wissen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweizeilige Satzgestaltung spiegelt die beiden parallelen Zeitangaben. Keine Fußnote ist erforderlich, da „der Mensch“ die generische und singularische Bedeutung von אָדָם im Deutschen angemessen erhält.
