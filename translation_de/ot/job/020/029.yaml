  text: זֶ֤ה חֵֽלֶק אָדָ֣ם רָ֭שָׁע מֵ/אֱלֹהִ֑ים וְ/נַחֲלַ֖ת אִמְר֣/וֹ מֵ/אֵֽל׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/020/029.yaml
  text: This is the portion of a wicked man from God[a], the inheritance appointed for him from the Mighty One.
translation:
  language: de
  text: 'Das ist der Anteil eines gottlosen Mannes von Gott,

    das ihm vom Mächtigen zugesprochene Erbe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „das Erbe seines Wortes vom Mächtigen“. Das hebräische Wort kann „sein Wort/seine Äußerung“ bedeuten; das Suffix wird meist auf Gott bezogen, sodass die Wendung das durch sein Wort bestimmte Erbe meinen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Das ist
  rationale: Das Demonstrativpronomen leitet Zofars abschließende Zusammenfassung ein; im Deutschen wird die Kopula natürlich ergänzt.
- source_word: חֵלֶק
  choice: Anteil
  rationale: Bezeichnet den zugewiesenen Teil bzw. das zugemessene Geschick und bewahrt die sachliche Nähe zur Verteilungssprache.
- source_word: אָדָם רָשָׁע
  choice: eines gottlosen Mannes
  rationale: Die generische maskuline Singularform wird formgetreu wiedergegeben; „gottlos“ ist im Weisheitskontext eine natürliche und würdige Entsprechung für רָשָׁע.
- source_word: מֵאֱלֹהִים
  choice: von Gott
  rationale: אֱלֹהִים bezeichnet hier eindeutig Gott als Ursprung des zugemessenen Geschicks.
- source_word: וְנַחֲלַת
  choice: das Erbe
  rationale: Steht parallel zu „Anteil“ und bezeichnet das, was jemandem als Besitz oder Geschick zugeteilt wird.
- source_word: אִמְרוֹ
  choice: ihm ... zugesprochene
  rationale: Die Form bedeutet wörtlich „sein Wort/seine Äußerung“, kann im Zusammenhang aber das über ihn Ausgesprochene bzw. ihm Zugesprochene bezeichnen. Diese Wiedergabe bleibt näher am Sprachmotiv als „bestimmt“, ohne die Deutung als göttliche Zuweisung aufzugeben.
- source_word: מֵאֵל
  choice: vom Mächtigen
  rationale: אֵל ist eine Gottesbezeichnung; „der Mächtige“ bewahrt die poetische Variation gegenüber אֱלֹהִים und gibt zugleich die Kraft des Titels wieder.
theological_decisions:
- issue: Generische Bedeutung von אָדָם in der maskulinen Singularform
  choice: eines gottlosen Mannes
  alternative: eines gottlosen Menschen
  rationale: Die Übersetzung erhält die grammatisch maskuline, repräsentative Form des Hebräischen, ohne ihre allgemeine Geltung einzuschränken.
- issue: Deutung von אִמְרוֹ
  choice: das ihm ... zugesprochene Erbe
  alternative: das Erbe seines Ausspruchs / sein durch Gottes Wort bestimmtes Erbe
  rationale: Der Kontext handelt von dem Gottlosen zugemessenem Gericht. „Zugesprochen“ vermittelt sowohl den Sprechakt als auch die Zuweisung; die ungewöhnliche wörtliche Konstruktion bleibt wegen der echten lexikalischen Mehrdeutigkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. Der Zeilenumbruch bildet die beiden Satzglieder ab; „Anteil“ und „Erbe“ erhalten die Zuweisungsmetaphorik, während „Gott“ und „der Mächtige“ die Variation der Gottesbezeichnungen bewahren.
