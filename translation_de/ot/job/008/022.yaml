source:
  edition: WLC
  text: שֹׂנְאֶ֥י/ךָ יִלְבְּשׁוּ בֹ֑שֶׁת וְ/אֹ֖הֶל רְשָׁעִ֣ים אֵינֶֽ/נּוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/008/022.yaml
  text: Those who hate you will be clothed with shame[a], and the tent of the wicked will be no more.
translation:
  language: de
  text: Die dich hassen, werden sich in Schande kleiden, und das Zelt der Gottlosen wird nicht mehr da sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und das Zelt der Gottlosen ist nicht«; die hebräische Form ist nicht ausdrücklich zukünftig.'
    reason: Die Fußnote dokumentiert die formale, nicht futurische Existenzaussage des Hebräischen, während der Haupttext deren im Kontext naheliegende zukunftsbezogene Wirkung wiedergibt.
lexical_decisions:
- source_word: שֹׂנְאֶיךָ
  choice: die dich hassen
  rationale: Das substantivisch gebrauchte aktive Partizip im Plural mit Suffix der 2. Person Singular wird im Deutschen natürlich als Relativsatz wiedergegeben und bewahrt den persönlichen Bezug auf »dich«.
- source_word: יִלְבְּשׁוּ
  choice: werden sich … bekleiden
  rationale: Das Verb לבשׁ bedeutet »anziehen, tragen, sich bekleiden«. Die reflexive Form bewahrt das konkrete hebräische Kleidungsbild in idiomatischem Deutsch.
- source_word: בֹשֶׁת
  choice: Schande
  rationale: »Schande« erfasst hier besonders die öffentliche Beschämung und verbindet sich natürlich mit dem Bild des Bekleidens; »Scham« wäre ebenfalls möglich, betonte aber stärker das innere Empfinden.
- source_word: וְאֹהֶל
  choice: und das Zelt
  rationale: Die konkrete Bedeutung von אֹהֶל wird beibehalten. Das Wort kann sinnbildlich für Hausstand oder Lebensbereich stehen, doch diese Deutung soll nicht in den Haupttext eingetragen werden.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: Das substantivierte Pluraladjektiv bezeichnet eine Gruppe gottloser beziehungsweise schuldiger Menschen. Der deutsche Genitiv bewahrt Zahl und Klassenbezeichnung.
- source_word: אֵינֶנּוּ
  choice: wird nicht mehr sein
  rationale: 'Formal liegt eine verneinte Existenzaussage mit pronominalem Suffix vor: »es ist nicht«. Im zukunftsbezogenen Zusammenhang von Vers 22 gibt »wird nicht mehr sein« die resultative Aussage natürlich wieder; die formnähere Möglichkeit wird in der Fußnote genannt.'
theological_decisions:
- issue: Zeitbezug des letzten Satzteils
  choice: 'zukunftsbezogen/resultativ: »das Zelt der Gottlosen wird nicht mehr sein«'
  alternative: 'gegenwärtig/formnah: »das Zelt der Gottlosen ist nicht«'
  rationale: Der erste Satzteil enthält eine Zukunftsform, und der Zusammenhang von Hiob 8,20–22 beschreibt erwartete Ausgänge. Dennoch ist אֵינֶנּוּ formal eine gegenwärtige Existenzaussage; diese Spannung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Zelt- und Kleidungsmetaphorik des Hebräischen bleibt erhalten. »Gottlose« ist hier als traditionelle, gut verständliche Wiedergabe einer moralisch-religiösen Gruppenbezeichnung gebraucht, nicht als konfessionelle Festlegung.
