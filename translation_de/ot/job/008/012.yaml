base_translation:
  language: en
  yaml_path: translation/ot/job/008/012.yaml
  text: While it is still in its shoot[a], not cut down[b], it dries up before any other grass.
translation:
  language: de
  text: Noch steht es in voller Frische da und ist nicht abgeschnitten, da verdorrt es schon vor allem anderen Gras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹדֶנּוּ
  choice: Noch steht es
  rationale: Das Adverb mit Suffix bezeichnet den fortdauernden Zustand der Pflanze. „Noch steht es“ leitet den zeitlichen Gegensatz im Deutschen natürlich ein.
- source_word: בְאִבּוֹ
  choice: in frischem Trieb
  rationale: אֵב/אִב bezeichnet frischen Pflanzenwuchs beziehungsweise einen jungen Trieb. Die Wiedergabe bewahrt das konkrete botanische Bild und klingt im Deutschen verständlich.
- source_word: לֹא יִקָּטֵף
  choice: ist nicht abgeschnitten
  rationale: 'Die Nifal-Form von קטף hat hier passiven Sinn: Die Pflanze ist noch nicht abgeschnitten oder abgepflückt worden. „Abgeschnitten“ passt zu der beschriebenen Pflanze, ohne eine Erntehandlung vorauszusetzen.'
- source_word: וְלִפְנֵי
  choice: da ... schon vor
  rationale: Die Verbindung drückt zeitlichen Vorrang aus. „Da ... schon vor“ bildet den überraschenden Gegensatz idiomatisch ab.
- source_word: כָל חָצִיר
  choice: allem anderen Gras
  rationale: Im Vergleich bezeichnet חָצִיר sonstiges Gras. „Anderen“ macht im Deutschen deutlich, dass die zuvor genannte Pflanze mit gewöhnlichem Gras verglichen wird.
- source_word: יִיבָשׁ
  choice: verdorrt es
  rationale: יבש bezeichnet das Trockenwerden oder Verdorren. „Verdorren“ ist im Deutschen das natürliche Verb für eine Pflanze, die mangels Wasser austrocknet.
