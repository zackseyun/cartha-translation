  yaml_path: translation/ot/job/008/021.yaml
  text: He will yet fill your mouth with laughter[a], and your lips with shouting.
translation:
  language: de
  text: Noch[a] wird er deinen Mund mit Lachen erfüllen und deine Lippen mit Jubel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, als elliptische Fortsetzung des vorherigen Verses: „Bis er deinen Mund mit Lachen erfüllt und deine Lippen mit Jubel.“'
    reason: Alternative Deutung von עַד als temporales „bis“ statt als bekräftigendes, zukunftsbezogenes „noch“.
lexical_decisions:
- source_word: עַד
  choice: bis
  rationale: Die gewöhnliche temporale Bedeutung wird bewahrt. Der Vers führt den Gedanken aus Vers 20 elliptisch fort; im Deutschen ist diese poetische Fortsetzung verständlich.
- source_word: יְמַלֵּה
  choice: er erfüllt
  rationale: Piel Imperfekt 3. Person Singular von מלא. Das Präsens nach „bis“ gibt den zukünftigen Zielpunkt natürlich wieder; Gott ist aus Vers 20 als Subjekt erschließbar.
- source_word: שְׂחוֹק
  choice: Lachen
  rationale: Die direkte Bedeutung passt zum Bild der Wiederherstellung und vermeidet sowohl die Verallgemeinerung zu „Freude“ als auch die unbegründete negative Deutung als Spott.
- source_word: פִּיךָ
  choice: deinen Mund
  rationale: Die wörtliche Wiedergabe erhält das anschauliche Bild und den poetischen Parallelismus.
- source_word: וּשְׂפָתֶיךָ
  choice: und deine Lippen
  rationale: Die körperliche Bildsprache und der Parallelismus zu „Mund“ bleiben erhalten.
- source_word: תְרוּעָה
  choice: Jubel
  rationale: Das Wort bezeichnet einen lauten Ruf, häufig der Freude oder des Triumphs. „Jubel“ klingt im Deutschen natürlich und lässt den militärischen oder kultischen Rahmen unbestimmt.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Verbs
  choice: „er“, im unmittelbaren Zusammenhang auf Gott bezogen
  alternative: 'Passivische Wiedergabe: „dein Mund wird mit Lachen erfüllt“'
  rationale: Vers 20 nennt Gott als Handelnden; Vers 21 setzt diesen Gedanken natürlich fort. „Er“ bewahrt die aktive Verbform und macht deutlich, dass die verheißene Wendung von Gott ausgeht.
- issue: Funktion von עַד am Versanfang
  choice: temporales „bis“ in elliptischer Fortsetzung
  alternative: 'modales beziehungsweise bekräftigendes „noch“: „Noch wird er deinen Mund … erfüllen“'
  rationale: עַד bedeutet primär „bis“. Da der hebräische Vers syntaktisch als Fortführung des vorherigen Gedankens gelesen werden kann, bleibt diese genuine Möglichkeit im Haupttext erhalten; die idiomatisch selbstständigere Lesart mit „noch“ steht in der Fußnote.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrtem poetischem Parallelismus. „Jubel“ ist natürlicher als „Jubelgeschrei“, ohne die hörbare Lautstärke des hebräischen Ausdrucks ganz aufzugeben. Die maskulinen Singularformen „deinen/deine“ entsprechen der direkten Anrede Hiobs.
