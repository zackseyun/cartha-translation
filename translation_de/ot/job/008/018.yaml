  text: If he is destroyed from his place[a], then it will deny him, saying[b], “I have not seen you.”
translation:
  language: de
  text: 'Wenn er von seinem Ort verschlungen wird[a], verleugnet ihn dieser[b]: »Ich habe dich nicht gesehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von ihrem Ort«. Das hebräische Suffix kann sich im Pflanzenbild auf die Pflanze beziehen; zugleich wird das Bild auf den Menschen bezogen und personifiziert.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »weist ihn von sich« oder »bestreitet ihn«. Das hebräische Verb kann Bestreiten, Verleugnen oder Lossagen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet einen Bedingungssatz ein. »Wenn« bewahrt im Deutschen sowohl die konditionale Kraft als auch den natürlichen poetischen Ausdruck.
- source_word: יְבַלְּעֶנּוּ
  choice: er … verschlungen wird
  rationale: Die Form ist aktiv und kann wörtlich »er/es verschlingt ihn« bedeuten; wegen des nicht ausdrücklich genannten Subjekts gibt die unpersönlich-passive deutsche Wendung den Sinn des Verschwindens bzw. Beseitigtwerdens wieder, ohne ihn auf »vernichtet« zu verengen.
- source_word: מִמְּקוֹמוֹ
  choice: von seinem Ort
  rationale: Das maskuline Singularsuffix lässt sich auf den im Pflanzenbild dargestellten Menschen beziehen. Zugleich bleibt sachlich die Pflanze als Bildträger im Blick; diese Alternative wird in der Fußnote genannt.
- source_word: וְכִחֶשׁ בּוֹ
  choice: wird dieser ihn verleugnen
  rationale: Das Subjekt ist am natürlichsten »sein Ort«, der personifiziert wird. כחש kann hier bestreiten, verleugnen oder sich von jemandem lossagen ausdrücken.
- source_word: לֹא רְאִיתִיךָ
  choice: Ich habe dich nicht gesehen
  rationale: Die konkrete Bildsprache und die direkte Anrede des Hebräischen bleiben erhalten; eine Deutung als »Ich kenne dich nicht« wird nicht in den Haupttext eingetragen.
theological_decisions:
- issue: Bezug des Bildes auf Pflanze und gottlosen Menschen
  choice: Das maskuline »seinem« und »ihn« erhält die Personifizierung des im Pflanzenbild dargestellten Menschen.
  alternative: 'Durchgehend sachlicher Bezug auf die Pflanze: »ihrem Ort« und »sie«.'
  rationale: Der hebräische Text verschränkt Pflanzenbild und menschlichen Bezug. Die Übersetzung bewahrt diese Spannung, statt sie eindeutig auf nur eine Ebene festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. »Verschlungen wird« hält die auffällige hebräische Bildsprache fest; »dieser« macht den personifizierten Ort als Subjekt verständlich, ohne ein erklärendes »und sagen« hinzuzusetzen.
