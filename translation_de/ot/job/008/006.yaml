base_translation:
  language: en
  yaml_path: translation/ot/job/008/006.yaml
  text: If you are pure and upright[c][b][a], surely even now he will rouse himself for you and restore your righteous dwelling.
translation:
  language: de
  text: Wenn du rein und aufrichtig bist, dann wird er sich gewiss schon jetzt für dich erheben[a] und deine gerechte Wohnstätte[c] wiederherstellen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für dich erwachen“ oder „sich für dich aufmachen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „heil machen“ oder „vergelten“; das hebräische Verb kann Wiederherstellung, Vervollständigung oder Vergeltung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „die Wohnstätte deiner Gerechtigkeit“; die Genitivverbindung kann auch anders verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Die gewöhnliche konditionale Wiedergabe leitet Bildads Bedingung klar und natürlich ein.
- source_word: זַךְ
  choice: rein
  rationale: Bezeichnet hier moralische Reinheit, ohne die stärkere forensische Aussage „unschuldig“ einzutragen.
- source_word: יָשָׁר
  choice: aufrichtig
  rationale: Gibt den weisheitlichen Ausdruck für sittliche Geradheit in natürlichem modernem Deutsch wieder.
- source_word: כִּי עַתָּה
  choice: dann … gewiss schon jetzt
  rationale: Gibt die betonte Folgerung und ihre zeitliche Unmittelbarkeit wieder; כִּי wird hier asseverativ verstanden.
- source_word: יָעִיר עָלֶיךָ
  choice: er wird sich für dich regen
  rationale: Bewahrt das Bild des Erwachens bzw. Sichregens und lässt das im Hebräischen unausgesprochene Subjekt als Pronomen stehen.
- source_word: וְשִׁלַּם
  choice: wiederherstellen
  rationale: Der Piel-Stamm von שׁלם kann vollständig machen, vergelten oder wiederherstellen bedeuten; bei einer Wohnstätte passt „wiederherstellen“ am besten, ohne die Alternativen zu verschweigen.
- source_word: נְוַת צִדְקֶךָ
  choice: deine Wohnstätte der Gerechtigkeit
  rationale: Bewahrt die hebräische Genitivkonstruktion und ihre mögliche Mehrdeutigkeit genauer als eine ausschließlich adjektivische Deutung.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Verben
  choice: „er“, im Zusammenhang auf Gott bezogen
  alternative: Den Namen „Gott“ ausdrücklich ergänzen
  rationale: Die hebräischen Verbformen enthalten kein genanntes Subjekt. Das Pronomen erhält diese formale Zurückhaltung, während der Kontext den Bezug verständlich macht.
- issue: Charakter von Bildads Aussage
  choice: Als nachdrückliche bedingte Behauptung Bildads wiedergeben
  alternative: Die Aussage durch eine distanzierende Paraphrase abschwächen
  rationale: Die Übersetzung gibt Bildads Vergeltungsvorstellung als seine Rede wieder, ohne sie durch den Erzähler bestätigen oder korrigieren zu lassen.
- issue: Deutung von נְוַת צִדְקֶךָ
  choice: „deine Wohnstätte der Gerechtigkeit“
  alternative: „deine gerechte Wohnstätte“
  rationale: Die formnähere Genitivkonstruktion erhält die Spannung, ob die Wohnstätte als gerecht qualifiziert wird oder als der Gerechtigkeit entsprechende Wohn- und Lebensordnung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung macht Bedingung und betonte Folge deutlich. „Wohnstätte“ wahrt den poetischen Ton, bleibt aber allgemein verständlich; die Fußnoten erhalten die wesentlichen lexikalischen und syntaktischen Alternativen.
