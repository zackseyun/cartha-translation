  text: 'Wie lange willst du noch solche Dinge reden?

    Sind die Worte aus deinem Mund ein gewaltiger Wind?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד אָן
  choice: Wie lange
  rationale: Die idiomatische deutsche Frage gibt den ungeduldigen Vorwurf natürlich und genau wieder.
- source_word: תְּמַלֶּל
  choice: willst du noch ... reden
  rationale: Die Form bezeichnet anhaltendes Reden; „noch“ bringt den fortdauernden, vorwurfsvollen Sinn im Deutschen zum Ausdruck.
- source_word: אֵלֶּה
  choice: so
  rationale: Im Deutschen verweist „so reden“ natürlich auf Hiobs vorausgehende Äußerungen, ohne das pluralische Demonstrativpronomen schwerfällig mit „diese Dinge“ wiederzugeben.
- source_word: וְרוּחַ כַּבִּיר
  choice: und ... ein gewaltiger Wind sein
  rationale: „Wind“ bewahrt das anschauliche Bild für heftige, als gehaltlos kritisierte Rede; „gewaltig“ gibt die Stärke von כַּבִּיר wieder.
- source_word: אִמְרֵי פִיךָ
  choice: die Worte aus deinem Mund
  rationale: Die Formulierung erhält die konkrete hebräische Wendung und den poetischen Parallelismus, klingt aber im heutigen Deutsch natürlicher als „Worte deines Mundes“.
