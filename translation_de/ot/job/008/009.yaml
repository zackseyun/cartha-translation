  text: כִּֽי תְמ֣וֹל אֲ֭נַחְנוּ וְ/לֹ֣א נֵדָ֑ע כִּ֤י צֵ֖ל יָמֵ֣י/נוּ עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/009.yaml
  text: For we are only of yesterday and do not know[a], for our days on the earth are a shadow.
translation:
  language: de
  text: Denn wir sind erst seit gestern da und wissen nichts,[a] denn unsere Tage auf der Erde sind ein Schatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und wir wissen nicht«. Die objektlose Formulierung betont die Begrenztheit menschlicher Erkenntnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Bildads vorausgehende Aufforderung ein und gibt die erklärende Funktion natürlich wieder.
- source_word: תְמוֹל אֲנַחְנוּ
  choice: wir sind erst seit gestern da
  rationale: Bewahrt das hebräische Bild der erst kurzen menschlichen Existenz, klingt im modernen Deutschen aber natürlicher als das wörtliche »wir sind von gestern«.
- source_word: וְלֹא נֵדָע
  choice: und wissen nichts
  rationale: Gibt die negierte Form von ידע prägnant wieder. Gemeint ist die Begrenztheit menschlicher Erkenntnis; die Fußnote hält eine weniger zugespitzte Wiedergabe offen.
- source_word: כִּי
  choice: denn
  rationale: 'Bewahrt die wiederholte Begründungsstruktur des Hebräischen: Die Kürze des Lebens erklärt die begrenzte Erkenntnis.'
- source_word: צֵל
  choice: ein Schatten
  rationale: Erhält das poetische Bild für Flüchtigkeit und Vergänglichkeit.
- source_word: יָמֵינוּ
  choice: unsere Tage
  rationale: Direkte Wiedergabe des Nomens mit dem Suffix der ersten Person Plural.
- source_word: עֲלֵי אָרֶץ
  choice: auf der Erde
  rationale: Natürliche und zugleich gehobene Wiedergabe der räumlichen Bestimmung.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Sprache. »Erst seit gestern da« erhält das Bild menschlicher Kürze, ohne die im Deutschen missverständliche Redewendung »von gestern sein« zu verwenden. Das zusätzliche »nur« vor »ein Schatten« macht die im Kontext ausgedrückte Vergänglichkeit natürlich deutlich.
