  variant: modern standard German
source:
  edition: WLC
  text: הַ֭/אֵל יְעַוֵּ֣ת מִשְׁפָּ֑ט וְ/אִם שַׁ֝דַּ֗י יְעַוֵּֽת צֶֽדֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/003.yaml
  text: Does God pervert justice[a], or does the Almighty pervert righteousness?
translation:
  language: de
  text: Beugt Gott das Recht[a], oder beugt der Allmächtige die Gerechtigkeit?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Urteil.'
    reason: 'Lexikalische Alternative: מִשְׁפָּט kann sowohl das Recht als auch einen richterlichen Entscheid beziehungsweise ein Urteil bezeichnen.'
lexical_decisions:
- source_word: הַאֵל
  choice: Beugt Gott
  rationale: Das Fragepräfix הַ leitet eine Ja-nein-Frage ein; אֵל ist hier der allgemeine Gottestitel „Gott“. Die deutsche Verb-Erst-Stellung gibt die Frage natürlich wieder.
- source_word: יְעַוֵּת
  choice: beugt
  rationale: Das Piel von עוה bezeichnet das Verdrehen oder Krümmen. „Das Recht beugen“ ist im Deutschen eine präzise und geläufige Wendung für rechtswidrige Verfälschung und bewahrt das Bild des hebräischen Verbs.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: מִשְׁפָּט bezeichnet hier Recht beziehungsweise gerechtes Urteil im forensischen Sinn. „Das Recht“ klingt im Deutschen natürlich und verbindet sich idiomatisch mit „beugen“.
- source_word: וְאִם
  choice: oder
  rationale: Wörtlich steht „und wenn/ob“, doch innerhalb der parallelen rhetorischen Frage leitet die Verbindung die zweite, alternative Fragehälfte ein. „Oder“ gibt diese Funktion knapp und idiomatisch wieder.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: שַׁדַּי wird als göttlicher Titel verstanden und daher bedeutungsbezogen mit der im Deutschen etablierten Bezeichnung „der Allmächtige“ wiedergegeben.
- source_word: צֶדֶק
  choice: die Gerechtigkeit
  rationale: צֶדֶק bezeichnet das Rechte und Gerechte. „Gerechtigkeit“ erhält gegenüber מִשְׁפָּט („Recht“) die verwandte, aber eigenständige Wortwahl des poetischen Parallelismus.
theological_decisions:
- issue: Wiedergabe der parallelen Gottestitel אֵל und שַׁדַּי
  choice: Gott … der Allmächtige
  alternative: El … Schaddai
  rationale: Im Zusammenhang fungieren beide Ausdrücke als Gottestitel. Ihre Übersetzung vermittelt ihren Sinn unmittelbar, ohne sie als Eigennamen festzulegen.
- issue: Unterscheidung von מִשְׁפָּט und צֶדֶק
  choice: Recht … Gerechtigkeit
  alternative: Gerechtigkeit … Gerechtigkeit; Urteil … Recht
  rationale: Die beiden Begriffe überschneiden sich, sind jedoch nicht identisch. Die gewählte Fassung bewahrt sowohl den juristischen Akzent von מִשְׁפָּט als auch den ethisch-rechtlichen Gehalt von צֶדֶק und glättet den Parallelismus nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „beugt“ bildet den strengen Parallelismus des hebräischen Verses ab; die geläufige Wendung „das Recht beugen“ hält zugleich das starke forensische Bild fest.
