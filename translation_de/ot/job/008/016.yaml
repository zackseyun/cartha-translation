  text: רָטֹ֣ב ה֭וּא לִ/פְנֵי שָׁ֑מֶשׁ וְ/עַ֥ל גַּ֝נָּת֗/וֹ יֹֽנַקְתּ֥/וֹ תֵצֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/016.yaml
  text: He is full of moisture before the sun[b][a], and his shoots spread out over his garden.
translation:
  language: de
  text: Saftig steht er vor der Sonne[a], und über seinen Garten breiten sich seine Triebe aus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vor der Sonne“ kann „im Angesicht der Sonne“ oder „im Sonnenlicht“ bedeuten, nicht unbedingt „vor Sonnenaufgang“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Und über seinem Garten kommt sein Trieb hervor.“ Das hebräische Singularwort für jungen Pflanzenwuchs kann kollektiv verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָטֹב
  choice: saftvoll
  rationale: Das Adjektiv bezeichnet feucht beziehungsweise gut mit Wasser versorgt. „Saftvoll“ bewahrt das konkrete Pflanzenbild und klingt im Deutschen natürlich und poetisch.
- source_word: הוּא
  choice: er
  rationale: Das maskuline Pronomen wird beibehalten, weil der hebräische Text das pflanzenhafte Bild personifizierend fortführt.
- source_word: לִפְנֵי שָׁמֶשׁ
  choice: vor der Sonne
  rationale: Die räumlich offene Formulierung entspricht dem Hebräischen und vermeidet die unbegründete zeitliche Festlegung auf „vor Sonnenaufgang“.
- source_word: וְעַל גַּנָּתוֹ
  choice: und über seinen Garten
  rationale: „Über“ gibt die räumliche Bedeutung von עַל natürlich wieder; „seinen Garten“ bewahrt den maskulinen Possessivsuffix.
- source_word: יֹנַקְתּוֹ
  choice: seine Triebe
  rationale: Das feminine Singularwort bezeichnet einen jungen Trieb oder kann kollektiv junges Triebwerk meinen. Der deutsche Plural ist im Pflanzenbild idiomatisch.
- source_word: תֵצֵא
  choice: breiten sich … aus
  rationale: Das Verb bedeutet wörtlich „geht hervor/hinaus“. Im Zusammenhang mit Trieben über einem Garten gibt „sich ausbreiten“ die räumliche Bewegung natürlich wieder.
