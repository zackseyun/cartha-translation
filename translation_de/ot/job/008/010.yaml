base_translation:
  language: en
  yaml_path: translation/ot/job/008/010.yaml
  text: Will they not teach you and tell you[a], and bring forth words from their heart?
translation:
  language: de
  text: Werden sie dich nicht unterweisen, zu dir sprechen und Worte aus ihrem Herzen hervorbringen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus ihrem Denken« oder »aus ihrem Inneren«. Das hebräische Wort für »Herz« bezeichnet häufig nicht nur das Fühlen, sondern auch das Zentrum des Denkens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Werden ... nicht
  rationale: Die rhetorische Frage erwartet Zustimmung; die deutsche Frageform bewahrt diese Funktion.
- source_word: הֵם
  choice: sie
  rationale: Das Pronomen verweist im Zusammenhang auf die früheren Generationen beziehungsweise Vorfahren.
- source_word: יוֹרוּךָ
  choice: dich belehren
  rationale: Das Hifil von ירה bedeutet hier »lehren, unterweisen«; »belehren« passt zum Weisheitskontext.
- source_word: יֹאמְרוּ לָךְ
  choice: dir sagen
  rationale: Die wörtlich-nahe Formulierung hält das Verb אמר vom vorausgehenden »belehren« unterscheidbar.
- source_word: וּמִלִּבָּם
  choice: aus ihrem Herzen
  rationale: לֵב bezeichnet das innere Zentrum des Menschen und kann Denken wie Empfinden einschließen; »Herz« bewahrt das hebräische Bild.
- source_word: יוֹצִיאוּ
  choice: hervorbringen
  rationale: Das Hifil von יצא beschreibt wörtlich ein Herausgehenlassen; »hervorbringen« erhält das Bild von Worten, die aus dem Inneren kommen.
- source_word: מִלִּים
  choice: Worte
  rationale: Die direkte Wiedergabe ist im Weisheitszusammenhang natürlich und verbindet sich gut mit »hervorbringen«.
