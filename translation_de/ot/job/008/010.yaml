    rationale: Das Wort kann ein herablassendes oder tadelndes Belehren nahelegen, das der hebräische Weisheitsausdruck hier nicht erfordert. „Unterweisen“ ist semantisch neutraler.
  - severity: medium
    issue: „dir sagen“ steht ohne ausgedrückten Inhaltsgegenstand und ist in der Verbfolge holprig.
    rationale: Das Hebräische kann אמר mit Präpositionalobjekt so verwenden; im Deutschen ist „zu dir sprechen“ in dieser elliptischen Aufzählung idiomatischer und erhält die Unterscheidung vom ersten Verb.
