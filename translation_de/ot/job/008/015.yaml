  text: He leans on his house[a], but it does not stand; he grasps hold of it[b], but it does not remain standing.
translation:
  language: de
  text: Er lehnt sich an sein Haus[a], doch es hält nicht stand; er hält sich daran fest[b], doch es bleibt nicht stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er verlässt sich auf sein Haus.“ Das hebräische Verb kann sowohl körperliches Anlehnen als auch das Sichstützen auf etwas bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die parallelen Wendungen „hält nicht stand“ und „bleibt nicht stehen“ geben das wiederholte hebräische Bild wieder: Das, woran er Halt sucht, erweist sich als instabil.'
    reason: cross_reference
lexical_decisions:
- source_word: יִשָּׁעֵן
  choice: lehnt sich an
  rationale: Das Nifal von שׁען bezeichnet, dass man sich auf etwas stützt oder darauf verlässt. Die Formulierung bewahrt das konkrete Bild und lässt zugleich den übertragenen Sinn des Vertrauens anklingen.
- source_word: עַל
  choice: an
  rationale: Bei „sich anlehnen“ ist „an“ im modernen Deutschen die natürliche Präposition für körperlichen Halt.
- source_word: בֵּיתוֹ
  choice: sein Haus
  rationale: בַּיִת bedeutet gewöhnlich „Haus“. Auch wenn es hier bildlich für das stehen kann, worauf jemand vertraut, sollte das konkrete Bild nicht ausgedeutet werden.
- source_word: וְלֹא יַעֲמֹד
  choice: doch es hält nicht stand
  rationale: עמד bedeutet „stehen“ oder „standhalten“. „Doch“ gibt den Gegensatz idiomatisch wieder; das Präsens entspricht dem sprichwortartigen Charakter.
- source_word: יַחֲזִיק
  choice: er klammert sich fest
  rationale: Das Hifil von חזק kann das feste Ergreifen oder Festhalten ausdrücken. „Sich festklammern“ bewahrt die körperliche Dringlichkeit des Bildes.
- source_word: בּוֹ
  choice: daran
  rationale: Die Präposition bezeichnet bei חזק das, woran jemand festhält; „daran“ ist hier idiomatisches Deutsch.
- source_word: וְלֹא יָקוּם
  choice: doch es bleibt nicht stehen
  rationale: קום kann „sich erheben“, „stehen“ oder „Bestand haben“ bedeuten. In der Parallele zu עמד bewahrt „bleibt nicht stehen“ das Bild mangelnder Stabilität, ohne es auf bloßes Fortbestehen zu reduzieren.
