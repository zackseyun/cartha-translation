lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: ענה bezeichnet in dieser erzählerischen Redeeinleitung das Antworten oder Erwideren. „Antwortete“ bewahrt den dialogischen Charakter und entspricht der formelhaften Einführung einer Rede im Buch Hiob.
- source_word: בִּלְדַּד
  choice: Bildad
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: הַשּׁוּחִי
  choice: der Schuchiter
  rationale: Das Gentiliz kennzeichnet Bildads Zugehörigkeit zu einer mit Schuach verbundenen Bevölkerungsgruppe oder Region. „Schuchiter“ ist die geläufige deutsche biblische Form.
- source_word: וַיֹאמַר
  choice: und sagte
  rationale: אמר bedeutet in dieser üblichen Erzählfolge „sagen“. Die Wiedergabe beider Verben als „antwortete … und sagte“ erhält die hebräische Redeformel.
- source_word: וַ
  choice: Da
  rationale: Das eröffnende Waw führt die Erzählung weiter. „Da“ gibt die zeitlich-fortschreitende Verbindung in natürlichem, würdigem Deutsch wieder; das zweite Waw erscheint als „und“.
