id: JOB.8.5
reference: Job 8:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם אַ֭תָּה תְּשַׁחֵ֣ר אֶל אֵ֑ל וְ/אֶל שַׁ֝דַּ֗י תִּתְחַנָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/005.yaml
  text: But if you seek God earnestly[a], and plead for favor from the Almighty[b],
translation:
  language: de
  text: Doch wenn du Gott eifrig suchst[a] und den Allmächtigen[b] um Gnade anflehst,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „früh suchst“ beziehungsweise „ernsthaft suchst“. Das hebräische Verb kann frühes Aufsuchen bezeichnen, hier aber wahrscheinlich eifriges, ernsthaftes Suchen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Schaddai“; traditionell mit „der Allmächtige“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Doch wenn
  rationale: Die Partikel leitet eine Bedingung ein; „doch“ gibt zugleich den Gegensatz zum vorausgehenden Vers natürlich wieder.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Personalpronomen der 2. Person Singular wird direkt wiedergegeben.
- source_word: תְּשַׁחֵר
  choice: mit Nachdruck suchst
  rationale: Das Piel von שׁחר kann frühes, eifriges oder ernstliches Suchen bezeichnen. Im Zusammenhang ist ein nachdrückliches Sich-an-Gott-Wenden wahrscheinlicher als eine bloße Zeitangabe.
- source_word: אֶל אֵל
  choice: Gott … suchst
  rationale: Die auf Gott gerichtete Bewegung wird im Deutschen idiomatisch durch das direkte Objekt bei „suchen“ ausgedrückt.
- source_word: וְ/אֶל
  choice: und … anflehst
  rationale: Die Konjunktion verbindet die parallelen Aussagen; die Präposition wird im Deutschen durch die Konstruktion „jemanden um etwas anflehen“ aufgenommen.
- source_word: שַׁדַּי
  choice: den Allmächtigen
  rationale: Der traditionelle deutsche Titel gibt die übliche Deutung von שַׁדַּי verständlich wieder; die hebräische Form bleibt in der Fußnote erhalten.
- source_word: תִּתְחַנָּן
  choice: um Gnade anflehst
  rationale: Das Hitpael von חנן bezeichnet inständiges Bitten um Gunst oder Gnade. Diese Wiedergabe wahrt sowohl die Intensität als auch den Gnadengedanken.
theological_decisions:
- issue: Wiedergabe des Gottestitels שַׁדַּי
  choice: der Allmächtige
  alternative: Schaddai
  rationale: Der Titel wird bedeutungsorientiert und in seiner im Deutschen eingebürgerten Form übersetzt. Da Etymologie und genaue Bedeutungsnuance nicht völlig sicher sind, nennt die Fußnote die hebräische Form.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als noch nicht abgeschlossener Bedingungssatz mit Komma stehen. „Mit Nachdruck“ ist verständlich und bewahrt die Intensität, ohne die mögliche Lesart „früh“ aus dem Text zu verdrängen; diese wird in der Fußnote dokumentiert.
