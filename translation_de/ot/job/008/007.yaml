  text: וְ/הָיָ֣ה רֵאשִׁיתְ/ךָ֣ מִצְעָ֑ר וְ֝/אַחֲרִיתְ/ךָ֗ יִשְׂגֶּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/007.yaml
  text: Though your beginning was small[a], your latter end will increase greatly.
translation:
  language: de
  text: War dein Anfang auch klein, so wird deine Zukunft doch sehr groß werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und dein Anfang war klein, doch dein späterer Zustand wird sehr groß werden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: War ... auch
  rationale: Das einleitende וְ mit dem Qatal von היה kann schlicht mit „und war“ wiedergegeben werden. Im poetischen Zusammenhang liegt jedoch ein kontrastierender, konzessiver Sinn nahe; „war ... auch“ drückt ihn im Deutschen natürlich aus, ohne zusätzliche Aussage einzutragen.
- source_word: רֵאשִׁיתְךָ
  choice: dein Anfang
  rationale: רֵאשִׁית bezeichnet den Anfang, den ersten Teil oder Ausgangszustand. „Dein Anfang“ ist direkt, verständlich und bewahrt das Bild des hebräischen Textes.
- source_word: מִצְעָר
  choice: klein
  rationale: Das Wort bezeichnet Kleinheit oder Geringfügigkeit. „Klein“ bildet einen klaren und knappen Gegensatz zum späteren Großwerden.
- source_word: אַחֲרִיתְךָ
  choice: deine Zukunft
  rationale: אַחֲרִית kann Ende, Ausgang oder Zukunft bedeuten. „Deine Zukunft“ ist in modernem Deutsch natürlich und bezeichnet hier den späteren Zustand, ohne das mögliche Missverständnis eines Lebensendes nahezulegen.
- source_word: יִשְׂגֶּה
  choice: wird ... groß werden
  rationale: Das Verb שׂגה/שׂגא bedeutet groß werden, zunehmen oder wachsen. Zusammen mit מְאֹד ist „sehr groß werden“ idiomatisch und erhält die Steigerung vom kleinen Anfang zum großen späteren Zustand.
- source_word: מְאֹד
  choice: sehr
  rationale: מְאֹד verstärkt die Aussage deutlich. „Sehr“ gibt diese Intensivierung in Verbindung mit „groß werden“ natürlich wieder.
theological_decisions: []
