lexical_decisions:
- source_word: הֲ/יִגְאֶה
  choice: Wächst ...?
  rationale: Die Fragepartikel leitet eine rhetorische Frage ein; גאה bezeichnet hier im botanischen Zusammenhang das Wachstum der Pflanze.
- source_word: גֹּמֶא
  choice: Papyrus
  rationale: Das Wort bezeichnet wahrscheinlich die in sumpfigen Gebieten wachsende Papyruspflanze; diese spezifische Wiedergabe passt zum Kontext.
- source_word: בְּ/לֹא בִצָּה
  choice: wo kein Sumpf ist
  rationale: Die Formulierung gibt sowohl die Abwesenheit als auch den örtlichen Bezug natürlich und präzise wieder.
- source_word: יִשְׂגֶּה
  choice: Gedeiht ...?
  rationale: Das Verb bezeichnet hier üppiges beziehungsweise kräftiges Wachstum und bildet einen natürlichen Parallelismus zu „wächst“.
- source_word: אָחוּ
  choice: Riedgras
  rationale: Gemeint ist eine Wasser- oder Sumpfpflanze; „Riedgras“ unterscheidet sie vom Papyrus, ohne die botanische Bestimmung übermäßig festzulegen.
- source_word: בְלִי מָיִם
  choice: ohne Wasser
  rationale: Dies ist eine direkte, idiomatische Wiedergabe des Ausdrucks der Abwesenheit.
