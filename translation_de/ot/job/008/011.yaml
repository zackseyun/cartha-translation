  text: Does papyrus grow where there is no marsh? Does reed grass flourish without water?[a]
translation:
  language: de
  text: Wächst Papyrus, wo kein Sumpf ist? Gedeiht Riedgras ohne Wasser?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Binse“ statt „Papyrus“ und „Schilf“ statt „Riedgras“; im Hebräischen stehen parallel zwei Bezeichnungen für Sumpfpflanzen.'
