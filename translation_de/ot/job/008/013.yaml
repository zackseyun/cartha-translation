  text: כֵּ֗ן אָ֭רְחוֹת כָּל שֹׁ֣כְחֵי אֵ֑ל וְ/תִקְוַ֖ת חָנֵ֣ף תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/013.yaml
  text: So are the paths of all who forget God[a], and the hope of the godless will perish.
translation:
  language: de
  text: So sind die Wege aller, die Gott vergessen, und die Hoffnung des Gottlosen geht zugrunde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: So ergeht es
  rationale: כֵּן zieht aus den Bildern der vorangehenden Verse eine vergleichende Folgerung. Die idiomatische Wendung „So ergeht es“ macht diesen Bezug im Deutschen verständlich, ohne den Inhalt näher festzulegen.
- source_word: אָרְחוֹת
  choice: ergeht es
  rationale: Wörtlich bezeichnet der Plural „Pfade“ oder „Wege“. Im Zusammenhang steht er bildhaft für Verlauf und Ausgang des Lebens; „So ergeht es allen“ gibt diese übertragene Bedeutung in natürlichem Deutsch wieder.
- source_word: שֹׁכְחֵי אֵל
  choice: alle, die Gott vergessen
  rationale: Das Partizip wird idiomatisch als Relativsatz wiedergegeben. אֵל ist hier die allgemeine Gottesbezeichnung „Gott“, kein zu transkribierender Eigenname.
- source_word: תִקְוַת
  choice: die Hoffnung
  rationale: Das Substantiv bezeichnet Hoffnung oder Erwartung. „Hoffnung“ ist im Kontext der Weisheitsrede natürlich und bewahrt die existenzielle Aussage.
- source_word: חָנֵף
  choice: des Gottlosen
  rationale: Das Wort bezeichnet hier einen frevelhaften, gottlosen oder ruchlosen Menschen. „Gottloser“ erfasst die religiös-moralische Bedeutung besser als das im modernen Deutschen engere „Heuchler“.
- source_word: תֹּאבֵד
  choice: vergeht
  rationale: Die Form von אבד bezeichnet Zugrundegehen oder Verlorengehen. Bei „Hoffnung“ ist „vergeht“ idiomatisch und bewahrt den endgültigen Charakter der Aussage.
theological_decisions:
- issue: Wiedergabe von חָנֵף im Kontext einer weisheitlichen Gerichtsaussage
  choice: des Gottlosen
  alternative: des Heuchlers; des Frevlers
  rationale: In Hiob bezeichnet חָנֵף nicht bloß persönliche Unaufrichtigkeit, sondern weiter gefasst einen irreligiösen oder frevelhaften Menschen. „Gottloser“ wahrt den moralisch-religiösen Gegensatz zu denen, die Gott vergessen, ohne die Bedeutung auf Heuchelei zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist bewusst knapp und spruchartig. Das konkrete Wegbild von אָרְחוֹת wird zugunsten der im Deutschen natürlicheren Wendung „So ergeht es“ sinngemäß wiedergegeben; die Fußnote bewahrt die lexikalische Spannweite von חָנֵף.
