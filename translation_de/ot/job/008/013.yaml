  naturalness: „So sind die Wege aller, die Gott vergessen“ ist modernes, verständliches und zugleich knapp-spruchhaftes Standarddeutsch. „Die Hoffnung des Gottlosen geht zugrunde“ ist idiomatisch und bewahrt den nachdrücklichen Zukunftscharakter.
  terminology: „Gottloser“ trifft חָנֵף in diesem Kontext besser als das heute enger verstandene „Heuchler“. Die Fußnote soll „Heuchler“ als traditionelle, aber kontextuell engere Alternative nennen.
