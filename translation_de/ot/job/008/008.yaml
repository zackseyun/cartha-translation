  text: כִּֽי שְׁאַל נָ֭א לְ/דֹ֣ר רִישׁ֑וֹן וְ֝/כוֹנֵ֗ן לְ/חֵ֣קֶר אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/008.yaml
  text: For please ask the former generation[b][a], and consider the findings of their fathers.
translation:
  language: de
  text: Denn frage doch die frühere Generation und richte dich auf das Forschen ihrer Väter aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… auf das von ihren Vätern Erforschte.“ Das hebräische Wort kann sowohl das Forschen bzw. die Untersuchung als auch das dadurch Erkannte bezeichnen. „Väter“ kann hier weiter gefasst „Vorfahren“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet hier Bildads begründenden Hinweis ein; „Denn“ bewahrt diesen Zusammenhang natürlich.
- source_word: שְׁאַל נָא
  choice: frage doch
  rationale: Der Imperativ bedeutet „fragen/sich erkundigen“; נָא verleiht der Aufforderung einen bittenden oder nachdrücklichen Ton, den „doch“ im Deutschen idiomatisch wiedergibt.
- source_word: לְדֹר רִישׁוֹן
  choice: die frühere Generation
  rationale: רִאשׁוֹן bezeichnet hier eine vorausgegangene Generation, nicht notwendig die allererste.
- source_word: וְכוֹנֵן
  choice: beachte
  rationale: Die Form fordert dazu auf, sich aufmerksam auf etwas auszurichten. „Beachte“ gibt dies knapp und natürlich wieder, ohne das im Hebräischen nicht ausdrücklich genannte „dein Herz“ zu ergänzen.
- source_word: לְחֵקֶר אֲבוֹתָם
  choice: was ihre Vorfahren erforscht haben
  rationale: חֵקֶר kann sowohl den Vorgang des Forschens als auch dessen Ergebnis bezeichnen. Die verbale Wiedergabe verbindet beides natürlich; אֲבוֹתָם meint die Väter beziehungsweise Vorfahren der früheren Generation.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Frühere Generation“ bewahrt den Bezug auf überlieferte Weisheit; „Vorfahren“ gibt die im Deutschen hier weiter gefasste Bedeutung von „Väter“ verständlich wieder.
