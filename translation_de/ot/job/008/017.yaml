  text: Über einem Steinhaufen verschlingen sich seine Wurzeln; ein Haus aus Steinen sieht er.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „er sieht ein Steinhaus“ oder „er blickt in ein Haus aus Steinen“. Die hebräische Wendung lautet wörtlich „Haus der Steine“ und kann ein Steingebilde oder einen steinigen Ort bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל גַּל
  choice: über einem Steinhaufen
  rationale: עַל bezeichnet hier die Lage beziehungsweise Ausbreitung der Wurzeln, während גַּל im Zusammenhang mit den folgenden Steinen am ehesten einen Steinhaufen bezeichnet.
- source_word: שָׁרָשָׁיו
  choice: seine Wurzeln
  rationale: Der possessive Plural bewahrt das Pflanzenbild und dessen Personifizierung.
- source_word: יְסֻבָּכוּ
  choice: verschlingen sich
  rationale: Die Form beschreibt Wurzeln, die sich ineinander verflechten oder verwickeln; „verschlingen sich“ ist im Deutschen anschaulich und natürlich.
- source_word: בֵּית אֲבָנִים
  choice: ein Haus aus Steinen
  rationale: Die Wendung bedeutet wörtlich „Haus der Steine“ und kann ein aus Steinen bestehendes Gebilde oder einen steinigen Ort bezeichnen. Die konkrete Bildsprache bleibt im Haupttext erhalten.
- source_word: יֶחֱזֶה
  choice: schaut er an
  rationale: Das Verb bedeutet „sehen, schauen“. Die Wiedergabe wahrt die aktive visuelle Aussage und die Singularform der personifizierten Pflanze.
