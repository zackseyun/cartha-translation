  rationale: Die Übersetzung wird nur in der Wiedergabe von יֶחֱזֶה und in der Fußnote korrigiert. Die Haupttextformulierung „sieht er“ entspricht dem einfachen Sinn von חזה. Die unhaltbare Bewegungsbedeutung „dringt ... ein“ wird durch die mögliche, aber vorsichtig als Alternative markierte Blickrichtung „blickt in“ ersetzt. Die Mehrdeutigkeit von בֵּית אֲבָנִים bleibt erhalten.
