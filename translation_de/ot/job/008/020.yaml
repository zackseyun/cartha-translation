  yaml_path: translation/ot/job/008/020.yaml
  text: Behold[a], God does not reject the blameless, nor does he uphold the hand of evildoers.
translation:
  language: de
  text: Siehe, Gott verwirft keinen Untadeligen und hält die Hand von Übeltätern nicht fest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er unterstützt keine Übeltäter“; wörtlicher: „und er hält die Hand von Übeltätern nicht fest“. Auch möglich: „und er stärkt nicht die Hand von Übeltätern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel leitet eine nachdrückliche Aussage ein. „Siehe“ bewahrt den gehobenen poetischen Ton.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier die geläufige poetische Bezeichnung für Gott; ein Zusatz wie „der Allmächtige“ steht nicht im Ausgangstext.
- source_word: יִמְאַס
  choice: verwirft
  rationale: מאס bezeichnet Ablehnung oder Verwerfung. „Verwirft“ gibt den relationalen und wertenden Sinn prägnant wieder, ohne emotionalen Hass auszudrücken.
- source_word: תָּם
  choice: einen Menschen, der untadelig lebt
  rationale: Das substantivierte maskuline Adjektiv bezeichnet einen integeren, untadeligen Menschen. Die Formulierung ist im heutigen Deutsch verständlich und vermeidet die missverständliche Behauptung absoluter Fehlerlosigkeit.
- source_word: יַחֲזִיק בְּיַד
  choice: ergreift … die Hand
  rationale: Die Verbindung bewahrt das konkrete Bild des hebräischen Ausdrucks; im Zusammenhang kann das Ergreifen der Hand Unterstützung bedeuten.
- source_word: מְרֵעִים
  choice: Übeltätern
  rationale: Das Partizip bezeichnet Menschen, die Böses tun. „Übeltäter“ erhält diesen aktiven Sinn.
theological_decisions:
- issue: Sinn von וְלֹא יַחֲזִיק בְּיַד מְרֵעִים
  choice: er ergreift nicht die Hand von Übeltätern
  alternative: er unterstützt keine Übeltäter / er stärkt nicht die Hand von Übeltätern
  rationale: Die Hauptfassung wahrt das konkrete und mehrdeutige Bild. Eine Fußnote nennt den naheliegenden übertragenen Sinn, ohne ihn im Text allein festzulegen.
- issue: Bedeutung von תָּם
  choice: einen Menschen, der untadelig lebt
  alternative: den Untadeligen / einen rechtschaffenen Menschen
  rationale: Die Übersetzung bezeichnet moralische Integrität, ohne absolute Sündlosigkeit in den Vers hineinzulesen.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem poetischem Ton. „Siehe“ erhält den emphatischen Einsatz; die konkrete Hand-Metapher bleibt in der Hauptfassung stehen.
