id: JOB.8.4
reference: Job 8:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם בָּנֶ֥י/ךָ חָֽטְאוּ ל֑/וֹ וַֽ֝/יְשַׁלְּחֵ֗/ם בְּ/יַד פִּשְׁעָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/004.yaml
  text: If your sons sinned against him[a], he gave them over into the hand of their transgression.
translation:
  language: de
  text: Wenn deine Söhne gegen ihn sündigten, gab er sie der Macht ihres Vergehens preis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gab er sie in die Hand ihres Vergehens“.'
    reason: Bewahrt das hebräische Bild hinter der idiomatischen Wiedergabe „der Macht … preisgeben“.
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Bewahrt die normale konditionale Bedeutung der hebräischen Partikel, ohne Bildads Behauptung durch ein kausales „weil“ zu verstärken.
- source_word: בָּנֶיךָ
  choice: deine Söhne
  rationale: Gibt den maskulinen Plural genau wieder; der Text sagt hier ausdrücklich „Söhne“.
- source_word: חָטְאוּ לוֹ
  choice: gegen ihn sündigten
  rationale: Bei חטא bezeichnet ל den Betroffenen; im Deutschen ist „gegen jemanden sündigen“ die natürliche Wendung. Das Pronomen bleibt wie im Hebräischen stehen.
- source_word: וַיְשַׁלְּחֵם
  choice: gab er sie … preis
  rationale: Im Zusammenhang mit „in die Hand von“ bezeichnet שלח ein Ausliefern oder Überlassen. „Preisgeben“ vermittelt die gerichtliche Folge in natürlichem Deutsch.
- source_word: בְּיַד
  choice: der Macht
  rationale: Die wörtliche Wendung „in die Hand“ ist ein hebräisches Idiom für das Ausgeliefertsein an eine Macht. Im Haupttext wird ihre Bedeutung verständlich wiedergegeben; die Fußnote bewahrt das Bild.
- source_word: פִּשְׁעָם
  choice: ihres Vergehens
  rationale: פשע bezeichnet eine schuldhafte Übertretung oder Auflehnung und bleibt damit von dem allgemeineren חטא im ersten Satzteil unterschieden.
theological_decisions:
- issue: Bezug des Pronomens „ihn“
  choice: Das Pronomen bleibt erhalten; im Kontext bezieht es sich am ehesten auf Gott.
  alternative: „gegen Gott sündigten“
  rationale: Der Zusammenhang weist deutlich auf Gott, doch die Übersetzung ersetzt das hebräische Pronomen nicht durch eine ausdrückliche Benennung und bewahrt so die formale Offenheit.
- issue: Verhältnis zwischen göttlichem Handeln und dem Vergehen der Söhne
  choice: „gab er sie der Macht ihres Vergehens preis“
  alternative: „schickte er sie fort wegen ihres Vergehens“
  rationale: Die gewählte Fassung bewahrt sowohl das göttliche Ausliefern als auch die im hebräischen Idiom ausgedrückte Macht ihres eigenen Vergehens, ohne eine weitergehende Vergeltungslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konditionalsatz bleibt bewusst hypothetisch; „sündigten“ und „Vergehen“ unterscheiden die beiden hebräischen Schuldbegriffe. Die Aussage wird als Rede Bildads übersetzt, ohne ihre theologische Bewertung vorwegzunehmen.
