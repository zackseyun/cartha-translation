translation:
  language: de
  text: dessen Zuversicht abgeschnitten wird[a][b] und dessen Vertrauen ein Spinnennetz ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dessen Hoffnung abgeschnitten wird“; das hebräische Substantiv kann hier Zuversicht, Hoffnung oder Sicherheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „abgeschnitten wird“ wiedergegebene hebräische Verb ist selten und umstritten. Möglich sind auch „abgetrennt wird“ oder – hier weniger wahrscheinlich – „verabscheut wird“.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „ein Haus einer Spinne“. Gemeint ist ihr Netz, das als Bild für die Zerbrechlichkeit seines Vertrauens dient.'
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: dessen
  rationale: Das Relativpronomen knüpft an den im Zusammenhang beschriebenen Gottlosen an und bildet im Deutschen einen natürlichen Anschluss an den vorhergehenden Vers.
- source_word: יָקוֹט
  choice: abreißt
  rationale: Das seltene und umstrittene Verb bezeichnet hier am ehesten das jähe Versagen beziehungsweise Abbrechen der Zuversicht. „Abreißt“ bewahrt zudem die bildhafte Nähe zu einem Faden oder Netz, ohne die Unsicherheit des Wortes zu verdecken.
- source_word: כִּסְלוֹ
  choice: seine Zuversicht
  rationale: Im Parallelismus mit מִבְטַחוֹ bezeichnet das Substantiv Zuversicht, Hoffnung oder Sicherheit; „Zuversicht“ ist hier prägnant und vermeidet eine unnötige Gleichsetzung mit dem folgenden „Vertrauen“.
- source_word: וּבֵית עַכָּבִישׁ
  choice: und ... einem Spinnenhaus
  rationale: Die wörtliche Metapher „Haus einer Spinne“ bleibt erhalten. „Spinnenhaus“ ist verständlich, ungewöhnlich genug, um das hebräische Bild zu bewahren, und lässt die mögliche Vorstellung eines Spinnennetzes anklingen.
- source_word: מִבְטַחוֹ
  choice: sein Vertrauen
  rationale: Das Wort bezeichnet das Vertrauen oder dessen Grundlage. „Vertrauen“ wahrt den kompakten Parallelismus mit „Zuversicht“.
