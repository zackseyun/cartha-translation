id: JOB.8.19
reference: Job 8:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֶן ה֭וּא מְשׂ֣וֹשׂ דַּרְכּ֑/וֹ וּ֝/מֵ/עָפָ֗ר אַחֵ֥ר יִצְמָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/019.yaml
  text: Behold[a], this is the joy of his way[b], and out of the dust others will sprout.
translation:
  language: de
  text: Sieh, das ist die Freude seines Weges[a], und aus dem Staub werden andere hervorsprossen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sieh, er ist die Freude seines Weges.“ Das hebräische Pronomen kann persönlicher als „er“ verstanden werden; der Zusammenhang spricht jedoch eher für eine zusammenfassende Aussage über das zuvor beschriebene Geschick der Pflanze.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich wäre beim Adjektiv auch „ein anderer“ möglich; das hebräische Verb steht jedoch im Plural und spricht daher für „andere werden hervorsprossen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sieh
  rationale: Die Diskurspartikel lenkt nachdrücklich die Aufmerksamkeit auf die folgende Beobachtung. „Sieh“ bewahrt diese lebendige Funktion in natürlichem poetischem Deutsch.
- source_word: הוּא
  choice: das
  rationale: Das formal maskuline Pronomen verweist hier wahrscheinlich deiktisch auf das zuvor geschilderte Geschick des Pflanzenbildes. „Das“ gibt diesen Rückbezug im Deutschen idiomatisch wieder, ohne die mögliche persönliche Lesart zu verschweigen.
- source_word: מְשׂוֹשׂ
  choice: die Freude
  rationale: Das Substantiv bezeichnet Freude oder Frohlocken. Die formnahe Wiedergabe erhält zugleich den auffälligen, möglicherweise ironischen Ton der Aussage.
- source_word: דַּרְכּוֹ
  choice: seines Weges
  rationale: דֶּרֶךְ kann Weg, Lebensweg oder Verlauf bezeichnen. „Weg“ bewahrt die konkrete und übertragene Bedeutung des poetischen Bildes.
- source_word: וּמֵעָפָר
  choice: und aus dem Staub
  rationale: Die Präposition מִן bezeichnet Herkunft oder Ausgangspunkt. „Staub“ entspricht dem Bild und bewahrt den biblisch-poetischen Klang von עָפָר.
- source_word: אַחֵר
  choice: andere
  rationale: אַחֵר steht morphologisch im Singular, doch das zugehörige Verb ist pluralisch. „Andere“ folgt der verbalen Kongruenz und vermittelt den Sinn nachwachsender Ersetzungen.
- source_word: יִצְמָחוּ
  choice: werden hervorsprossen
  rationale: צמח bezeichnet das Sprießen oder Aufwachsen von Pflanzen. „Hervorsprossen“ hält das botanische Bild lebendig und gibt die Bewegung aus dem Staub ausdrücklich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Syntax. Die ungewöhnliche Wendung „die Freude seines Weges“ bleibt bewusst erhalten, damit die Mehrdeutigkeit beziehungsweise mögliche Ironie des Hebräischen nicht geglättet wird.
