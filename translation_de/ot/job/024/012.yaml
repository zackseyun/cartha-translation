  text: מֵ֘/עִ֤יר מְתִ֨ים יִנְאָ֗קוּ וְ/נֶֽפֶשׁ חֲלָלִ֥ים תְּשַׁוֵּ֑עַ וֶ֝/אֱל֗וֹהַּ לֹא יָשִׂ֥ים תִּפְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/012.yaml
  text: From the city the dying groan[a], and the soul of the slain cries out for help[b], yet God does not regard it as folly.
translation:
  language: de
  text: Aus der Stadt stöhnen die Sterbenden[a], und die Seele der Erschlagenen schreit um Hilfe; doch Gott rechnet es nicht als Torheit an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In der Stadt stöhnen Menschen.“ Das hebräische מְתִים ist hier schwierig und kann möglicherweise „Menschen“ statt „Sterbende“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „doch Gott achtet nicht darauf“ oder „doch Gott rechnet keine Schuld zu“. Die hebräische Wendung ist schwierig; תִּפְלָה kann „Torheit“, „Anstößigkeit“ oder etwas Verwerfliches bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעִיר
  choice: Aus der Stadt
  rationale: Die Präposition מִן bezeichnet am natürlichsten den Ausgangspunkt des hörbaren Stöhnens. „Aus der Stadt“ bewahrt dieses Bild, ohne eine bloße Ortsangabe auszuschließen.
- source_word: מְתִים
  choice: die Sterbenden
  rationale: Das schwierige Wort kann hier möglicherweise „Menschen“ bedeuten. Die Parallele zu den Erschlagenen spricht jedoch dafür, den Bezug zum Tod hörbar zu machen; „die Sterbenden“ vermeidet zugleich die widersinnige Vorstellung, Tote würden stöhnen.
- source_word: יִנְאָקוּ
  choice: stöhnen
  rationale: Das Verb bezeichnet den hörbaren Ausdruck schweren Leidens. „Stöhnen“ ist gegenwärtiges, klares Deutsch und erhält die körperliche Eindringlichkeit.
- source_word: וְנֶפֶשׁ
  choice: und die Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder Person bezeichnen. „Die Seele der Erschlagenen“ hält sich eng an die Bildsprache und bringt die Tiefe ihres Hilferufs zum Ausdruck.
- source_word: חֲלָלִים
  choice: der Erschlagenen
  rationale: Das Wort bezeichnet gewöhnlich Menschen, die gewaltsam niedergestreckt oder tödlich verwundet wurden. „Erschlagene“ passt zum Zusammenhang gewaltsamen Unrechts.
- source_word: תְּשַׁוֵּעַ
  choice: schreit um Hilfe
  rationale: Die Verbform bezeichnet einen dringenden Hilferuf. Die Ergänzung „um Hilfe“ gibt die im Verb enthaltene Zielrichtung in natürlichem Deutsch wieder.
- source_word: וֶאֱלוֹהַּ
  choice: doch Gott
  rationale: Das Waw hat hier angesichts des Gegensatzes zwischen menschlichem Leiden und Gottes scheinbarer Nichtreaktion adversative Kraft. „Doch“ macht diesen Kontrast deutlich.
- source_word: לֹא יָשִׂים תִּפְלָה
  choice: achtet nicht auf das Unrecht
  rationale: Die Wendung ist schwierig. תִּפְלָה kann Torheit, Ungehörigkeit oder etwas Verwerfliches bezeichnen; im Zusammenhang beklagt Hiob, dass Gott das offenkundige Unrecht scheinbar unbeachtet lässt. Die Fußnote bewahrt die stärker zurechnende Alternative.
theological_decisions:
- issue: Gottes scheinbare Nichtreaktion angesichts des Unrechts
  choice: doch Gott achtet nicht auf das Unrecht
  alternative: doch Gott rechnet es nicht als Torheit an
  rationale: Die Formulierung gibt Hiobs Klage über Gottes scheinbares Nicht-Eingreifen wieder, ohne sie zu einer abschließenden Aussage über Gottes Gerechtigkeit umzudeuten. Die Mehrdeutigkeit der schwierigen hebräischen Wendung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt nahe am poetischen Parallelismus des Hebräischen; das Semikolon hebt den scharfen Gegensatz der Schlusszeile hervor. Schwierige Mehrdeutigkeiten werden nicht im Haupttext überladen, sondern transparent in den Fußnoten bewahrt.
