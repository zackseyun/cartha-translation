id: JOB.24.14
reference: Job 24:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/א֡וֹר יָ֘ק֤וּם רוֹצֵ֗חַ יִֽקְטָל עָנִ֥י וְ/אֶבְי֑וֹן וּ֝/בַ/לַּ֗יְלָה יְהִ֣י כַ/גַּנָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/014.yaml
  text: At dawn the murderer rises[a]; he kills the poor and needy[b], and in the night he is like a thief.
translation:
  language: de
  text: Bei Tagesanbruch[a] erhebt sich der Mörder; er tötet den Armen und Bedürftigen[b], und in der Nacht ist er wie ein Dieb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa »zum Licht« oder »beim Licht«; gemeint ist wahrscheinlich das Anbrechen des Tages.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »er erschlägt den Armen und Bedürftigen«. Das Hebräische verwendet hier ein anderes Verb als bei »Mörder«; »tötet« bewahrt diesen Unterschied.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאוֹר
  choice: Bei Tagesanbruch
  rationale: Die Wendung bedeutet wörtlich etwa »zum Licht« oder »beim Licht« und bezeichnet hier wahrscheinlich das Anbrechen des Tages. »Bei Tagesanbruch« gibt diesen zeitlichen Sinn im Deutschen natürlich wieder.
- source_word: יָקוּם
  choice: erhebt sich
  rationale: Das Qal-Imperfekt von קום bezeichnet hier das Aufstehen beziehungsweise den Beginn des Handelns. »Erhebt sich« bewahrt den knappen, poetischen Ausdruck.
- source_word: רוֹצֵחַ
  choice: der Mörder
  rationale: Das Partizip wird substantivisch gebraucht und bezeichnet typisierend den handelnden Gewalttäter.
- source_word: יִקְטָל
  choice: er tötet
  rationale: Hier steht das allgemeine Verb קטל, nicht erneut רצח. »Tötet« bewahrt den Unterschied zu »Mörder«.
- source_word: עָנִי וְאֶבְיוֹן
  choice: den Armen und Bedürftigen
  rationale: Das geläufige Wortpaar bezeichnet einen sozial schwachen und schutzbedürftigen Menschen. Die singularische Form des Hebräischen bleibt erhalten.
- source_word: וּבַלַּיְלָה
  choice: und in der Nacht
  rationale: Die Zeitangabe bildet den poetischen Gegensatz zum Tagesanbruch ab.
- source_word: יְהִי
  choice: ist er
  rationale: היה mit der Vergleichspartikel כ beschreibt hier Rolle oder Verhalten. Die direkte Wiedergabe »ist er wie« lässt die Bildsprache bestehen.
- source_word: כַגַּנָּב
  choice: wie ein Dieb
  rationale: Die Vergleichspartikel כ wird mit der im modernen Deutschen üblichen Wendung »wie ein Dieb« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzstruktur. Der zeitliche Gegensatz zwischen Tagesanbruch und Nacht sowie die unterschiedliche Wortwahl für »Mörder« und »tötet« bleiben erhalten.
