  terminology: „Mörder“ für רוֹצֵחַ und „tötet“ für יִקְטָל bewahren angemessen den Unterschied zwischen dem Täterbegriff und dem anschließenden allgemeineren Tötungsverb. „Armen und Bedürftigen“ ist für עָנִי וְאֶבְיוֹן treffend und registergerecht.
