  source_fidelity: 'Die Übersetzung gibt die hebräische Abfolge und Bildsprache zuverlässig wieder: לָאוֹר wird idiomatisch als „Bei Tagesanbruch“ gefasst, יָקוּם als „erhebt sich“, und der Kontrast zwischen dem morgendlichen Töten und dem nächtlichen Verhalten eines Diebes bleibt erhalten. „Den Armen und Bedürftigen“ bildet die beiden singularischen, typisierenden hebräischen Ausdrücke angemessen ab.'
