  text: ר֤וֹמּוּ מְּעַ֨ט וְֽ/אֵינֶ֗/נּוּ וְֽ/הֻמְּכ֗וּ כַּ/כֹּ֥ל יִקָּפְצ֑וּ/ן וּ/כְ/רֹ֖אשׁ שִׁבֹּ֣לֶת יִמָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/024.yaml
  text: They are exalted a little while[a], and then they are gone; they are brought low; like all others they are gathered up[c][b], and like the head of a stalk of grain they are cut off.
translation:
  language: de
  text: Für kurze Zeit werden sie erhöht, dann sind sie nicht mehr[a]. Sie werden erniedrigt; wie alle anderen werden sie weggenommen[b]. Wie die Spitze einer Ähre werden sie abgeschnitten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dann sind sie verschwunden“. Die hebräische Wendung bezeichnet, dass jemand nicht mehr da ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zusammengenommen“. Das hier verwendete hebräische Verb ist selten, und seine genaue Bedeutung ist umstritten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „wie der Kopf einer Ähre“.'
    reason: cultural_note
lexical_decisions:
- source_word: רֹמּוּ מְעַט
  choice: Für kurze Zeit werden sie erhöht
  rationale: רום bezeichnet hier das Erhöhtwerden, wahrscheinlich zu Ansehen oder Macht; מְעַט wird im Zusammenhang mit dem anschließenden Verschwinden zeitlich verstanden.
- source_word: וְאֵינֶנּוּ
  choice: dann sind sie nicht mehr
  rationale: Die hebräische Existenzverneinung bezeichnet ihr Verschwinden bzw. ihr Ende. Die formal singularische Form wird im Kontext der pluralischen Verben distributiv verstanden.
- source_word: וְהֻמְכוּ
  choice: Sie werden erniedrigt
  rationale: Die Passivform beschreibt den Sturz aus der zuvor genannten Höhe und bewahrt so den Kontrast.
- source_word: כַכֹּל
  choice: wie alle anderen
  rationale: Die Wendung stellt sie dem allgemeinen menschlichen Geschick gleich; „anderen“ ist im Deutschen zur Verdeutlichung ergänzt.
- source_word: יִקָּפְצוּן
  choice: dahingerafft
  rationale: Das seltene Verb ist in seiner genauen Bedeutung umstritten und kann ein Zusammennehmen oder Wegnehmen bezeichnen. „Dahingerafft“ gibt im Todeskontext das Weggenommenwerden wieder, ohne dessen Art festzulegen.
- source_word: וּכְרֹאשׁ שִׁבֹּלֶת
  choice: wie die Spitze einer Ähre
  rationale: Die Formulierung bezeichnet wörtlich den Kopf bzw. die Spitze einer Getreideähre und bewahrt das Erntebild.
- source_word: יִמָּלוּ
  choice: werden sie abgeschnitten
  rationale: Im Bild der Ähre bezeichnet das Verb wahrscheinlich das Abschneiden; zugleich trägt es die übertragene Bedeutung eines jähen Endes.
theological_decisions:
- issue: Bezug des allgemeinen Geschicks
  choice: „wie alle anderen“ lässt offen, ob besonders der Tod oder umfassender das gemeinsame Ende der Menschen gemeint ist.
  alternative: Eine ausdrückliche Wiedergabe wie „wie alle anderen Menschen sterben sie“
  rationale: Der hebräische Text nennt den Tod nicht ausdrücklich; die Übersetzung soll die Aussage nicht dogmatisch oder interpretierend verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus von Erhöhung, Erniedrigung und endgültigem Abschneiden bleibt deutlich; seltene hebräische Verben werden nicht unnötig präzisiert.
