  text: חֲמ֣וֹר יְתוֹמִ֣ים יִנְהָ֑גוּ יַ֝חְבְּל֗וּ שׁ֣וֹר אַלְמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/003.yaml
  text: They drive away the orphan's donkey[b][a]; they take the widow's ox as a pledge.
translation:
  language: de
  text: Sie treiben den Esel der Waisen fort[a]; den Ochsen der Witwe nehmen sie als Pfand[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Sie treiben die Esel von Waisen fort.« Der hebräische Ausdruck hat »Waisen« im Plural und kann kollektiv oder distributiv verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sie pfänden den Ochsen der Witwe«. Gemeint ist, dass Eigentum als Sicherheit für eine Schuld genommen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹר
  choice: Esel
  rationale: Die übliche, verständliche Bezeichnung für das Haus- und Lasttier; das Hebräische steht im Singular.
- source_word: יְתוֹמִים
  choice: der Waisen
  rationale: Der hebräische Plural wird bewahrt. Die Verbindung kann kollektiv oder distributiv verstanden werden, ohne dass der deutsche Haupttext die Zahl der Esel ausdrücklich festlegt.
- source_word: יִנְהָגוּ
  choice: treiben ... fort
  rationale: נהג bezeichnet das Treiben oder Führen eines Tieres; »fort« gibt im Zusammenhang die Wegnahme wieder, ohne das Verb mit einem technisch-rechtlichen Sinn zu überladen.
- source_word: יַחְבְּלוּ
  choice: nehmen ... als Pfand
  rationale: חבל bezeichnet hier die Pfändung beziehungsweise die Entgegennahme eines Gegenstands als Sicherheit für eine Schuld; dieser rechtlich-wirtschaftliche Sinn bleibt ausdrücklich erhalten.
- source_word: שׁוֹר
  choice: Ochsen
  rationale: Im agrarischen Zusammenhang ist »Ochse« die natürliche Wiedergabe für das einzelne Rind beziehungsweise Arbeitstier.
- source_word: אַלְמָנָה
  choice: der Witwe
  rationale: Die hebräische Konstruktverbindung wird im Deutschen als Besitzverhältnis wiedergegeben.
