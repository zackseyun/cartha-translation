  text: Look[a], like wild donkeys in the wilderness they go out to their work, seeking prey early; the desert is bread for him[b], for the children.
translation:
  language: de
  text: 'Sieh: Wie Wildesel in der Wildnis ziehen sie zu ihrer Arbeit hinaus und suchen schon früh nach Nahrung.[a] Die Steppe ist ihm Brot für die Kinder.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stehen früh auf, um Beute zu suchen“. Das hebräische Partizip kann sowohl das frühe Aufbrechen als auch das eifrige Suchen betonen; „Beute“ bewahrt zudem das Bild der Wildesel stärker.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Die Steppe verschafft seinen Jungen Nahrung.“ Wörtlich steht im Hebräischen der Singular „ihm“; das letzte Wort kann „Kinder“, „Jungen“, „junge Leute“ oder im Bild „Junge“ bedeuten.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Gibt den aufmerksamkeitslenkenden Ausruf knapp und in heutigem Deutsch wieder.
- source_word: פְּרָאִים
  choice: Wildesel
  rationale: Bezeichnet ungezähmte Esel und bewahrt das eindrückliche Vergleichsbild.
- source_word: בַּמִּדְבָּר
  choice: in der Wildnis
  rationale: Bezeichnet hier unbewohntes, unfruchtbares Land und ist weiter gefasst als „Wüste“.
- source_word: יָצְאוּ בְּפָעֳלָם
  choice: ziehen sie an ihre Arbeit hinaus
  rationale: Bewahrt sowohl die Bewegung nach draußen als auch die mühevolle Tätigkeit der Armen.
- source_word: מְשַׁחֲרֵי לַטָּרֶף
  choice: suchen schon früh nach Nahrung
  rationale: Der Partizipialausdruck verbindet eifriges beziehungsweise frühmorgendliches Suchen mit dem Ziel der Nahrung; „Nahrung“ passt zum menschlichen Notkontext, während „Beute“ als mögliche bildhafte Wiedergabe in der Fußnote erhalten bleibt.
- source_word: עֲרָבָה
  choice: die Steppe
  rationale: Gibt das trockene, offene Ödland präziser wieder als das enger verstandene „Wüste“.
- source_word: לוֹ
  choice: für ihn
  rationale: Bewahrt den auffälligen Singular des hebräischen Textes, statt ihn stillschweigend an das vorherige Pluralpronomen anzugleichen.
- source_word: לֶחֶם
  choice: Brot
  rationale: Erhält das konkrete Bild für den lebensnotwendigen Unterhalt.
- source_word: לַנְּעָרִים
  choice: für die Kinder
  rationale: Im Zusammenhang sind am ehesten die abhängigen jungen Familienmitglieder gemeint; „Kinder“ ist natürlich und schließt nicht unnötig nur Jungen ein.
