  text: He preys on the barren woman who does not bear[a], and he does no good to the widow.
translation:
  language: de
  text: Er zehrt von der Unfruchtbaren, die nicht gebiert,[a] und tut der Witwe nichts Gutes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wörtlicher: „Er weidet die Unfruchtbare.“ Das hebräische Verb bedeutet gewöhnlich „weiden, hüten“ oder „sich nähren“; im Zusammenhang kann es ausbeuterischen oder räuberischen Sinn haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה
  choice: weidet
  rationale: Das Partizip von רעה bedeutet gewöhnlich „weiden, hüten, sich nähren“. Die bewusst ungewöhnliche Formulierung bleibt nahe am Hebräischen und bewahrt dessen Mehrdeutigkeit; im feindseligen Zusammenhang kann das Bild ausbeuterisch oder räuberisch verstanden werden.
- source_word: עֲקָרָה
  choice: die Unfruchtbare
  rationale: Die substantivierte feminine Bezeichnung gibt die unfruchtbare Frau knapp und eindeutig wieder.
- source_word: לֹא תֵלֵד
  choice: die nicht gebiert
  rationale: Dies entspricht der wörtlichen Aussage „nicht gebären“, ohne die im Hebräischen nicht ausdrücklich formulierte Fähigkeit oder Unfähigkeit hinzuzufügen.
- source_word: אַלְמָנָה
  choice: Witwe
  rationale: Die übliche und genaue deutsche Bezeichnung für die hier genannte sozial schutzbedürftige Person.
- source_word: לֹא יְיֵטִיב
  choice: tut er nichts Gutes
  rationale: Die Wiedergabe erfasst den Hifil-Sinn von יטב („Gutes tun, wohltun“) und bewahrt die moralische Aussage der Negation.
theological_decisions:
- issue: Bezeichnung des Handelnden
  choice: Das im Verb enthaltene männliche Subjekt wird mit „er“ wiedergegeben.
  alternative: Explizite Bezeichnung als „der Gottlose“
  rationale: Der unmittelbare hebräische Vers nennt das Subjekt nicht nochmals ausdrücklich. „Er“ wahrt den Textanschluss, ohne eine im Vers selbst fehlende Bezeichnung einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Bildsprache des hebräischen Verbs wird im Haupttext formal bewahrt und in der Fußnote erläutert.
