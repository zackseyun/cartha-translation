lexical_decisions:
- source_word: עָרוֹם
  choice: nackt
  rationale: Das Adjektiv bezeichnet fehlende oder unzureichende Bekleidung. „Nackt“ gibt die soziale Notlage direkt und idiomatisch wieder.
- source_word: הִלְּכוּ
  choice: gehen sie umher
  rationale: הלך bezeichnet Gehen oder Umhergehen; die Form schildert hier einen andauernden Zustand beziehungsweise wiederholtes Handeln.
- source_word: בְּלִי לְבוּשׁ
  choice: ohne Kleidung
  rationale: Die Wendung bezeichnet ausdrücklich das Fehlen von Kleidung und bewahrt die eindringliche Wiederholung des ersten Halbverses.
- source_word: רְעֵבִים
  choice: hungrig
  rationale: Die Wiedergabe bleibt beim Grundsinn und verstärkt ihn nicht unnötig zu „verhungernd“ oder „ausgehungert“.
- source_word: נָשְׂאוּ
  choice: tragen sie
  rationale: נשא bedeutet hier im Zusammenhang der Erntearbeit natürlich „tragen“.
- source_word: עֹמֶר
  choice: Garben
  rationale: Das hebräische Substantiv steht grammatisch im Singular, kann hier aber kollektiv gebraucht sein. Der deutsche Plural passt natürlich zu den mehreren hungernden Arbeitern; der formale Singular bleibt in der Fußnote erhalten.
