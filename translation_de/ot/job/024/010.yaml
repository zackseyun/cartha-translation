  language: de
  text: Nackt gehen sie umher, ohne Kleidung; hungrig tragen sie Garben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Garbe“. Das hebräische Substantiv steht im Singular, kann hier aber kollektiv gemeint sein.'
