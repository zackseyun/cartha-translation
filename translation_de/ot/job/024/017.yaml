id: JOB.24.17
reference: Job 24:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י יַחְדָּ֨ו בֹּ֣קֶר לָ֣/מוֹ צַלְמָ֑וֶת כִּֽי יַ֝כִּ֗יר בַּלְה֥וֹת צַלְמָֽוֶת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/017.yaml
  text: For deep darkness is morning to them all[c][b][a], for they are familiar with the terrors of deep darkness.
translation:
  language: de
  text: Denn für sie alle ist der Morgen tiefes Dunkel[a][b]; denn sie kennen die Schrecken des tiefen Dunkels.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Denn der Morgen ist für sie alle wie tiefes Dunkel.“ Der knappe hebräische Nominalsatz lässt diese leicht abweichende Wiedergabe zu.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort צַלְמָוֶת (zalmawet) kann auch mit „Todesschatten“ wiedergegeben werden. Hier bezeichnet es wahrscheinlich tiefes Dunkel oder Finsternis.
    reason: lexical_alternative
  - marker: c
    text: 'Im Hebräischen steht das Verb im Singular: „er kennt/erkennt“. Wahrscheinlich ist damit allgemein jeder aus der beschriebenen Gruppe gemeint; deshalb steht im Text der Plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet jeweils einen erklärenden beziehungsweise begründenden Satz ein und führt die Beschreibung der Frevler fort.
- source_word: יַחְדָּו
  choice: sie alle
  rationale: Das Adverb bedeutet wörtlich „zusammen“, hat hier jedoch eine kollektive beziehungsweise distributive Kraft, die im Deutschen mit „sie alle“ natürlich wiedergegeben wird.
- source_word: בֹּקֶר
  choice: Morgen
  rationale: Die Grundbedeutung bewahrt den scharfen Gegensatz zum tiefen Dunkel.
- source_word: לָמוֹ
  choice: für sie
  rationale: Die pronominale Präpositionalform bezeichnet die Zuordnung; „für sie“ ist in dem nominalen Satz idiomatisches Deutsch.
- source_word: צַלְמָוֶת
  choice: tiefes Dunkel
  rationale: Das Wort bezeichnet hier wahrscheinlich undurchdringliche Finsternis oder düstere Dunkelheit, ohne notwendig ausdrücklich den Tod zu meinen. Die Wiederholung wird in beiden Satzhälften beibehalten.
- source_word: יַכִּיר
  choice: sie kennen
  rationale: Die hebräische Verbform steht im Singular, ist im Zusammenhang aber wahrscheinlich generisch auf die zuvor beschriebene Gruppe bezogen. Der deutsche Plural macht diesen Bezug verständlich; die formale Besonderheit wird in einer Fußnote vermerkt.
- source_word: בַּלְהוֹת
  choice: die Schrecken
  rationale: Der Plural bezeichnet Schrecknisse oder plötzliche Grauen; „die Schrecken des tiefen Dunkels“ gibt die Verbindung natürlich wieder.
theological_decisions: []
