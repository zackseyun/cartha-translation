  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Klang. Die kompakte Struktur und die Wiederholung von צַלְמָוֶת werden bewahrt; ungewohnte hebräische Mehrdeutigkeit und der Numeruswechsel werden nicht stillschweigend aufgelöst, sondern durch Fußnoten kenntlich gemacht.
