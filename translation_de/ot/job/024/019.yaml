  text: צִיָּ֤ה גַם חֹ֗ם יִגְזְל֥וּ מֵֽימֵי שֶׁ֗לֶג שְׁא֣וֹל חָטָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/019.yaml
  text: Drought and heat also snatch away the waters of snow[b][a]; so Sheol takes those who have sinned.
translation:
  language: de
  text: Dürre und Hitze rauben das Wasser des Schnees[a]; so raubt der Scheol[b] die, die gesündigt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Schmelzwasser des Schnees“. Wörtlich: „die Wasser des Schnees“.'
    reason: lexical_alternative
  - marker: b
    text: „Scheol“ ist die hebräische Bezeichnung für den Bereich der Toten; auch übersetzbar mit „Totenreich“ oder „Grab“.
    reason: alternative_reading
lexical_decisions:
- source_word: צִיָּה
  choice: Dürre
  rationale: Das Substantiv bezeichnet Trockenheit beziehungsweise ausgedörrte Verhältnisse. „Dürre“ ist im Zusammenhang mit Hitze idiomatisch und bewahrt das Bild der austrocknenden Naturgewalten.
- source_word: גַם
  choice: und
  rationale: Die additive Partikel verbindet hier in natürlichem Deutsch die beiden Größen „Dürre“ und „Hitze“. Ein ausdrücklich mit „auch“ wiedergegebenes גַם wäre möglich, klänge im deutschen Satz jedoch schwerfällig.
- source_word: חֹם
  choice: Hitze
  rationale: Die direkte und natürliche Entsprechung erhält den Parallelismus mit „Dürre“.
- source_word: יִגְזְלוּ
  choice: rauben
  rationale: גזל bezeichnet gewaltsames Wegnehmen oder Rauben. „Rauben“ erhält die kräftige Personifikation von Dürre und Hitze und lässt sich im zweiten, elliptischen Halbvers wieder aufnehmen.
- source_word: מֵימֵי שֶׁלֶג
  choice: das Wasser des Schnees
  rationale: Die relativ formnahe Wiedergabe bewahrt das poetische Bild und legt die genauere Deutung als Schneeschmelzwasser nicht zwingend fest.
- source_word: שְׁאוֹל
  choice: der Scheol
  rationale: Die Transliteration bewahrt die hebräische Vorstellung vom Bereich der Toten, ohne sie auf das Grab zu verengen oder mit einer späteren Vorstellung von Hölle gleichzusetzen.
- source_word: חָטָאוּ
  choice: die, die gesündigt haben
  rationale: Die Verbform ist Perfekt, 3. Person Plural. Im elliptischen deutschen Vergleich macht die substantivierte Relativkonstruktion die Betroffenen als Objekt des ergänzten Verbs deutlich und wahrt zugleich die verbale Aussage.
theological_decisions:
- issue: Bedeutung von שְׁאוֹל
  choice: „Scheol“ als Bezeichnung für den Bereich der Toten
  alternative: „Totenreich“, „Grab“ oder „Tod“
  rationale: Die Transliteration hält die begriffliche Weite des Hebräischen offen und vermeidet sowohl eine Beschränkung auf ein einzelnes Grab als auch die Eintragung einer Lehre von endgültiger Bestrafung.
- issue: Ellipse im zweiten Halbvers
  choice: Das Verb „rauben“ wird aus dem ersten Halbvers sinngemäß ergänzt.
  alternative: Eine stark formale, im Deutschen jedoch unvollständige Wiedergabe ohne Verb
  rationale: Der hebräische Parallelismus stellt „Scheol“ und „die, die gesündigt haben“ elliptisch neben den ersten Halbvers. Die Ergänzung macht den Vergleich verständlich, ohne eine zusätzliche theologische Behauptung einzuführen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Struktur. Die kräftige Personifikation durch „rauben“ wird in beiden Halbversen bewahrt; die Fußnoten erläutern die beiden für heutige Leser weniger unmittelbaren Bilder.
