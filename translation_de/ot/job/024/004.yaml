lexical_decisions:
- source_word: יַטּוּ
  choice: sie drängen … ab
  rationale: Der Hifil von נטה bezeichnet hier ein Veranlassen zum Abweichen. „Abdrängen“ gibt sowohl den Kausativ als auch den bedrückenden Zusammenhang wieder, ohne die stärkere Vorstellung gewaltsamer Vertreibung ausdrücklich einzutragen.
- source_word: אֶבְיוֹנִים
  choice: die Bedürftigen
  rationale: אֶבְיוֹן bezeichnet sozial verletzliche, mittellose Menschen. „Bedürftige“ wahrt eine leichte begriffliche Unterscheidung zum folgenden עֲנִיִּים.
- source_word: מִדָּרֶךְ
  choice: vom Weg
  rationale: דֶּרֶךְ kann Weg, Straße oder Lebensweg bedeuten. Die knappe Wiedergabe „vom Weg“ bewahrt diese Bildbreite.
- source_word: יַחַד
  choice: allesamt
  rationale: יַחַד drückt hier die gemeinsame, umfassende Lage der Armen aus. „Allesamt“ klingt im Deutschen natürlicher als ein möglicherweise missverständliches „gemeinsam“, das eine bewusst gemeinsame Handlung nahelegen könnte.
- source_word: חֻבְּאוּ
  choice: müssen sich … verstecken
  rationale: Die Pual-Form von חבא beschreibt ein Verborgenwerden beziehungsweise einen Zustand des Verborgenseins. Im Unterdrückungskontext gibt „müssen sich verstecken“ die erzwungene Lage idiomatisch wieder; die passive Lesart bleibt in einer Fußnote erhalten.
- source_word: עֲנִיֵּי אָרֶץ
  choice: die Armen des Landes
  rationale: עָנִי kann arm, elend oder bedrängt bedeuten. „Die Armen des Landes“ bezeichnet hier am natürlichsten die gesellschaftlich Bedrängten innerhalb des Landes, während „Erde“ ebenfalls möglich bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelität zwischen „Bedürftigen“ und „Armen“ bleibt erhalten. „Abdrängen“ und „müssen sich verstecken“ machen die soziale Bedrängung verständlich, während die Fußnoten die lexikalische und grammatische Offenheit des Hebräischen dokumentieren.
