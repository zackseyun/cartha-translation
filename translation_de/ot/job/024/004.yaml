  terminology: „Bedürftige“ für אֶבְיוֹנִים und „Arme“ für עֲנִיֵּי bleiben sinnvoll unterschieden. „Land“ ist hier eine angemessene kontextuelle Wiedergabe von אָרֶץ; „Erde“ gehört als Alternative in die Anmerkung.
