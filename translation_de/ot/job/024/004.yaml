  source_fidelity: Die erste Zeile gibt den Hifil von נטה mit „drängen ... ab“ sachgerecht und im sozialen Zusammenhang treffend wieder. „müssen“ in der zweiten Zeile hat jedoch keine ausdrückliche Entsprechung im Hebräischen. Die Pual-Form חֻבְּאוּ bezeichnet Verborgenwerden bzw. Verborgenheit, ohne eine modal zwingende Aussage zu machen.
