  text: In the dark they break into houses[a]; by day they shut themselves in[c][b]; they do not know the light.
translation:
  language: de
  text: Im Dunkeln bricht er in Häuser ein[a]; am Tag schließen sie sich ein[b]; sie kennen das Licht nicht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb bedeutet wörtlicher „durchgraben“ oder „durchbrechen“ und bezieht sich hier wahrscheinlich auf das Durchbrechen einer Hauswand. Das Hebräische wechselt anschließend vom Singular „er“ zum Plural „sie“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder, näher am Verb: „Am Tag versiegeln“ oder „verschließen sie sich“. Gemeint ist wohl, dass sie sich bei Tageslicht einschließen oder verbergen.'
    reason: lexical_alternative
  - marker: c
    text: „Das Licht“ meint zunächst das Tageslicht, kann im Zusammenhang aber zugleich einen moralischen Unterton haben.
    reason: theological_ambiguity
lexical_decisions:
- source_word: חָתַר
  choice: bricht … ein
  rationale: Das Verb bezeichnet wörtlich ein Durchgraben oder Durchbrechen, besonders einer Wand. Im Zusammenhang mit nächtlichem Diebstahl gibt „einbrechen“ den gemeinten Vorgang in natürlichem Deutsch wieder; die wörtlichere Bildsprache bleibt in der Fußnote erhalten.
- source_word: בַּחֹשֶׁךְ
  choice: im Dunkeln
  rationale: Die Wendung bezeichnet Zeit oder Umgebung der Tat und bewahrt zugleich das Motiv der Verborgenheit.
- source_word: בָּתִּים
  choice: Häuser
  rationale: Die gewöhnliche Bedeutung des Plurals ist „Häuser“; sie passt unmittelbar zur Einbruchsszene.
- source_word: יוֹמָם
  choice: am Tag
  rationale: Die knappe adverbiale Wendung stellt den poetischen Gegensatz zum Dunkel der Nacht her.
- source_word: חִתְּמוּ לָמוֹ
  choice: schließen sie sich ein
  rationale: חָתַם bedeutet „versiegeln, verschließen“. Zusammen mit לָמוֹ liegt hier nahe, dass sie sich tagsüber einschließen beziehungsweise verbergen. Die Übersetzung wahrt zudem den Wechsel vom Singular zum Plural im Hebräischen.
- source_word: לֹא יָדְעוּ אוֹר
  choice: Sie kennen das Licht nicht
  rationale: Die Formulierung bleibt eng am hebräischen Idiom. „Kennen“ kann fehlende Vertrautheit oder Zugehörigkeit ausdrücken; „Licht“ bewahrt sowohl den konkreten Bezug zum Tageslicht als auch einen möglichen moralischen Unterton.
theological_decisions:
- issue: Mögliche moralisch-symbolische Bedeutung von אוֹר („Licht“)
  choice: Die wörtliche Formulierung „das Licht“ bleibt im Haupttext stehen.
  alternative: Deutend mit „das Tageslicht“ oder „das Gute“ übersetzen.
  rationale: Im unmittelbaren Zusammenhang ist Tageslicht gemeint, vor dem sich die Täter verbergen. Zugleich kann „Licht“ in der Weisheitsliteratur moralisch mitschwingen. Die Übersetzung lässt diese Spannung offen.
- issue: Numeruswechsel zwischen חָתַר und חִתְּמוּ
  choice: Den Wechsel von „er“ zu „sie“ im Deutschen bewahren.
  alternative: Beide Verben im Plural wiedergeben, um einen einheitlichen Bezug auf die Tätergruppe herzustellen.
  rationale: Das Hebräische hat zunächst ein Verb im maskulinen Singular und danach Pluralformen. Der Wechsel kann vom typischen einzelnen Täter zur ganzen Gruppe übergehen; eine Angleichung würde eine echte Formauffälligkeit des Ausgangstextes beseitigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller poetischer Satzführung. „Einbrechen“ ist idiomatisch, während die Fußnote das konkrete hebräische Bild des Durchgrabens oder Durchbrechens bewahrt. Der auffällige Wechsel vom Singular zum Plural wird nicht geglättet.
