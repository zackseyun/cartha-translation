base_translation:
  language: en
  yaml_path: translation/ot/job/024/018.yaml
  text: He is swift on the surface of the waters[a]; their portion in the land is cursed[c][b]; he does not turn toward the way of the vineyards.
translation:
  language: de
  text: Leicht ist er auf der Wasseroberfläche[a]; ihr Anteil im Land ist verflucht[b]; er wendet sich nicht dem Weg der Weinberge zu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schnell ist er auf der Wasseroberfläche.« Das Hebräische ist schwierig; »leicht« kann hier auch Schnelligkeit oder Vergänglichkeit ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Text ist schwierig; nach einer anderen Lesart: »Sein Anteil im Land ist verflucht.«'
    reason: textual_variant
  - marker: c
    text: 'Auch möglich: »Er wendet sich nicht dem Weg zu den Weinbergen zu.« Gemeint sein könnte, dass er nicht mehr zu kultiviertem Land oder zu Orten des Wohlstands zurückkehrt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַל
  choice: Leicht treibt er … dahin
  rationale: קַל bedeutet zunächst »leicht« und kann hier zugleich Schnelligkeit oder Flüchtigkeit andeuten. Die Formulierung bewahrt das Bild und vermeidet eine zu eindeutige Festlegung auf bloße Geschwindigkeit.
- source_word: עַל־פְּנֵי מַיִם
  choice: über die Wasserfläche
  rationale: Gibt die hebräische Wendung »auf/über dem Angesicht der Wasser« in natürlichem Deutsch wieder und erhält das Oberflächenbild.
- source_word: תְּקֻלַּל
  choice: ist verflucht
  rationale: Die Pual-Form von קלל wird am naheliegendsten passiv als »verflucht sein« verstanden.
- source_word: חֶלְקָתָם
  choice: ihr Landanteil
  rationale: Folgt dem überlieferten Pluralsuffix »ihr«; »Landanteil« verbindet den Anteil ausdrücklich mit בָּאָרֶץ, ohne ihn vorschnell als Erbbesitz zu deuten.
- source_word: בָּאָרֶץ
  choice: Land-
  rationale: Ist idiomatisch in »Landanteil« aufgenommen; der Zusammenhang spricht eher von Grundbesitz beziehungsweise Land als von der gesamten Erde.
- source_word: לֹא יִפְנֶה
  choice: er wendet sich nicht … zu
  rationale: Bewahrt die Grundbedeutung von פנה und legt nicht fest, ob ein Zurückkehren gemeint ist.
- source_word: דֶּרֶךְ כְּרָמִים
  choice: dem Weg zu den Weinbergen
  rationale: Natürliches Deutsch für die schwierige Konstruktverbindung; möglich bleibt sowohl ein Weg in das Weinberggebiet als auch der Zugang zu kultiviertem, ertragreichem Land.
theological_decisions:
- issue: Bezug und Deutung des schwer verständlichen Verses
  choice: Die wechselnden Numeri und die bildhafte Aussage bleiben stehen, ohne den Vers ausdrücklich auf Frevler, Schiffer oder Tote festzulegen.
  alternative: Die Subjekte vereinheitlichen oder eine bestimmte Deutung in den Haupttext aufnehmen.
  rationale: Der hebräische Text ist syntaktisch und semantisch schwierig; eine eindeutige Identifizierung würde mehr festlegen, als der Wortlaut sicher hergibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Wegen der außergewöhnlichen Dunkelheit des hebräischen Verses wird eine leicht bildhafte, aber quellennah bleibende Formulierung gewählt; die wichtigsten lexikalischen und textlichen Alternativen werden in Fußnoten offengelegt.
