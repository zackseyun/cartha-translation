  text: וְ/עֵ֤ין נֹאֵ֨ף שָׁ֤מְרָֽה נֶ֣שֶׁף לֵ֭/אמֹר לֹא תְשׁוּרֵ֣/נִי עָ֑יִן וְ/סֵ֖תֶר פָּנִ֣ים יָשִֽׂים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/015.yaml
  text: The eye of the adulterer waits for twilight[a], saying, ‘No eye will see me’[b]; and he puts a covering over his face.
translation:
  language: de
  text: 'Das Auge des Ehebrechers wartet auf die Dämmerung[a]; er sagt: »Kein Auge wird mich sehen«; und er verhüllt sein Gesicht[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Abenddämmerung«. Das hebräische Wort bezeichnet das Zwielicht; hier ist wahrscheinlich die einbrechende Dunkelheit am Abend gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »und eine Verhüllung des Gesichts setzt er«. Gemeint ist, dass er sein Gesicht bedeckt oder unkenntlich macht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵין
  choice: Auge
  rationale: Die konkrete Bildsprache des Hebräischen bleibt an beiden Stellen erhalten und ist im Deutschen verständlich.
- source_word: נֹאֵף
  choice: Ehebrecher
  rationale: Das substantivierte Partizip bezeichnet hier einen Mann, der Ehebruch begeht; »Ehebrecher« gibt Genus und Sinn knapp wieder.
- source_word: שָׁמְרָה
  choice: wartet auf
  rationale: Das Verb bedeutet grundsätzlich »hüten, beobachten, bewahren«, bezeichnet mit dem folgenden Zeitbegriff hier aber das erwartungsvolle Warten auf die Dunkelheit.
- source_word: נֶשֶׁף
  choice: Dämmerung
  rationale: Der Ausdruck bezeichnet das Zwielicht und meint im Kontext wahrscheinlich die Abenddämmerung, ohne dass diese Spezifizierung im Haupttext erzwungen wird.
- source_word: לֵאמֹר
  choice: und sagt
  rationale: Die übliche Redeeinleitung lässt offen, ob die Worte ausgesprochen oder innerlich gesagt werden.
- source_word: תְשׁוּרֵנִי
  choice: wird mich sehen
  rationale: Das seltenere Verb שׁור bedeutet »anschauen, erblicken«; »sehen« ist natürlich und bewahrt das Motiv des Beobachtens.
- source_word: וְסֵתֶר פָּנִים יָשִׂים
  choice: und er verhüllt sein Gesicht
  rationale: Die komprimierte Wendung lautet wörtlich etwa »und eine Verhüllung des Gesichts setzt er«; die verbale Wiedergabe ist idiomatisches Deutsch und bewahrt den Sinn der Gesichtsbedeckung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die personifizierende Formulierung »Das Auge des Ehebrechers« und die wiederholte Nennung des Auges bewahren die konkrete hebräische Bildsprache; die ungewöhnliche Schlusswendung wird im Haupttext idiomatisch und in der Fußnote formal transparent wiedergegeben.
