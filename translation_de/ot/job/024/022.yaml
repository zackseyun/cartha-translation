source:
  edition: WLC
  text: וּ/מָשַׁ֣ךְ אַבִּירִ֣ים בְּ/כֹח֑/וֹ יָ֝ק֗וּם וְֽ/לֹא יַאֲמִ֥ין בַּֽ/חַיִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/022.yaml
  text: Yet he drags away the mighty by his power; he rises up[a], but he has no assurance of life.
translation:
  language: de
  text: Doch er reißt die Mächtigen mit seiner Kraft fort. Er erhebt sich, doch er ist seines Lebens nicht sicher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er erhebt sich, vertraut aber nicht auf sein Leben.“ Möglich ist auch: „Wenn er sich erhebt, ist niemand seines Lebens sicher.“ Das Subjekt und der genaue Sinn des letzten Satzteils sind im Hebräischen nicht eindeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁךְ
  choice: reißt … fort
  rationale: משך bedeutet grundlegend „ziehen, fortziehen“; mit den Mächtigen als Objekt und seiner Kraft als Mittel gibt „fortreißen“ den gewaltsamen Sinn natürlich wieder, ohne die weniger naheliegende Deutung „am Leben erhalten“ in den Haupttext aufzunehmen.
- source_word: אַבִּירִים
  choice: die Mächtigen
  rationale: Das Wort bezeichnet Starke beziehungsweise Machtvolle; „die Mächtigen“ bewahrt hier sowohl die körperliche als auch die gesellschaftliche Dimension.
- source_word: בְּכֹחוֹ
  choice: mit seiner Kraft
  rationale: Das instrumentale ב wird mit „mit“ wiedergegeben; כֹּחַ bezeichnet Kraft oder Macht.
- source_word: יָקוּם
  choice: er erhebt sich
  rationale: קום bedeutet „aufstehen, sich erheben“; die Formulierung bewahrt das Bild und legt nicht fest, ob Angriff, Selbstbehauptung oder bloßes Weiterbestehen gemeint ist.
- source_word: וְלֹא יַאֲמִין בַּחַיִּין
  choice: doch er ist seines Lebens nicht sicher
  rationale: Die singularische Verbform legt denselben männlichen Einzelsubjektbezug nahe. „Seines Lebens nicht sicher sein“ gibt den Mangel an Vertrauen beziehungsweise Sicherheit idiomatisch wieder; die mögliche unpersönliche Deutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Mehrdeutiges Subjekt und Sinn der Schlussklausel
  choice: 'Der Gewalttäter bleibt Subjekt: „doch er ist seines Lebens nicht sicher“.'
  alternative: „Wenn er sich erhebt, ist niemand seines Lebens sicher“ beziehungsweise formal „er vertraut nicht auf das Leben“.
  rationale: Die hebräische Verbform ist maskulin Singular und kann unmittelbar auf das bisherige Subjekt zurückweisen. Der knappe Satzbau lässt jedoch auch eine resultative Deutung zu, nach der andere durch sein Auftreten ihres Lebens nicht sicher sind. Der Haupttext folgt der grammatisch naheliegenden Singularlesart, während die Fußnote die echte Ambiguität offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fortreißen“ vermittelt die Gewalt des Verbs; die Schlussklausel bleibt knapp, während die syntaktische und semantische Mehrdeutigkeit in der Fußnote ausdrücklich erhalten wird.
