  yaml_path: translation/ot/job/024/013.yaml
  text: These are among those who rebel against the light[a]; they do not recognize its ways[b], and they do not stay in its paths.
translation:
  language: de
  text: Sie gehören zu denen, die sich gegen das Licht auflehnen[a]. Die Wege des Lichts erkennen sie nicht, und auf den Pfaden des Lichts bleiben sie nicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie gehörten zu denen, die sich gegen das Licht auflehnten. Seine Wege erkannten sie nicht, und auf seinen Pfaden blieben sie nicht.“ Die hebräischen Verbformen können vergangenheitsbezogen verstanden werden; im poetischen Zusammenhang beschreiben sie wahrscheinlich allgemein eine bestimmte Art von Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich stehen im Hebräischen maskuline Singularsuffixe: „seine Wege … seine Pfade“. Sie beziehen sich am ehesten auf „Licht“, das im Hebräischen grammatisch männlich ist. Im Deutschen wird der Bezug durch die Wiederholung von „des Lichts“ verdeutlicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה הָיוּ
  choice: Sie gehören
  rationale: Die Verbindung bezeichnet hier am natürlichsten die Zugehörigkeit zu einer Gruppe. Das Präsens gibt den spruchhaften, fortlaufend beschreibenden Zusammenhang wieder; das formal mögliche Präteritum wird in einer Fußnote genannt.
- source_word: בְּמֹרְדֵי אוֹר
  choice: zu denen, die sich gegen das Licht auflehnen
  rationale: בְּ bezeichnet die Einordnung in eine Gruppe; die partizipiale Form von מרד bleibt durch die verbale Wiedergabe aktiv. „Das Licht“ wahrt sowohl die konkrete als auch die sittliche Bilddimension.
- source_word: לֹא הִכִּירוּ
  choice: erkennen sie nicht
  rationale: הכיר kann „erkennen“, „kennen“ oder „anerkennen“ bedeuten. „Erkennen“ bewahrt die mögliche Spannung zwischen Wahrnehmung und Anerkennung.
- source_word: דְרָכָיו
  choice: seine Wege
  rationale: Das maskuline Singularsuffix bezieht sich am ehesten auf אוֹר, das im Hebräischen maskulin ist. Im Deutschen verlangt „das Licht“ grammatisch eigentlich „seine“ im Genitiv-/Possessivbezug; dadurch entsteht keine notwendige Personifizierung.
- source_word: וְלֹא יָשְׁבוּ
  choice: und ... bleiben sie nicht
  rationale: ישב bedeutet unter anderem „sitzen“, „wohnen“ oder „bleiben“. In Verbindung mit Pfaden bezeichnet „bleiben“ das Verharren auf ihnen idiomatisch und bildgetreu.
- source_word: בִּנְתִיבֹתָיו
  choice: auf seinen Pfaden
  rationale: נתיבות sind Pfade oder Bahnen. Im Deutschen ist „auf Pfaden bleiben“ natürlicher als „in Pfaden bleiben“ und erhält zugleich die poetische Unterscheidung von „Wegen“.
theological_decisions:
- issue: Bezug der Suffixe in „seine Wege“ und „seine Pfade“
  choice: Die Suffixe werden auf „das Licht“ bezogen.
  alternative: Bezug auf einen unausgesprochenen persönlichen Referenten, etwa Gott.
  rationale: אוֹר ist der nächste grammatische Bezugspunkt und im Hebräischen maskulin Singular. Die Übersetzung lässt die sittliche und möglicherweise theologische Resonanz des Lichts bestehen, ohne einen persönlichen Referenten ausdrücklich einzutragen.
- issue: Zeitstufe von הָיוּ und den folgenden Perfektformen
  choice: Präsentische, allgemein beschreibende Wiedergabe.
  alternative: 'Vergangenheitsform: „Sie gehörten ... erkannten ... blieben“.'
  rationale: Obwohl die Formen formal vergangenheitsbezogen gelesen werden können, beschreibt der poetische Zusammenhang eine fortbestehende Art von Menschen. Die alternative Zeitstufe bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich auflehnen“ gibt den aktiven Widerstand von מרד klar wieder; „Wege“ und „Pfade“ erhalten den poetischen Parallelismus. Beide Fußnotenmarker stehen im Haupttext.
