  terminology: „Grenzsteine“ vermittelt den konkreten landrechtlichen Bezug von גְּבֻלוֹת klar. „Rauben“ und „weiden“ treffen die Aussage ohne unnötige Ausdeutung. Die Fußnoten sind zutreffend formuliert und ihre Anker beziehen sich jeweils auf die passende Textstelle.
