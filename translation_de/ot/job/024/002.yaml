  text: גְּבֻל֥וֹת יַשִּׂ֑יגוּ עֵ֥דֶר גָּ֝זְל֗וּ וַ/יִּרְעֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/002.yaml
  text: They move boundary markers[b][a]; they seize a flock and pasture it.
translation:
  language: de
  text: Sie verrücken Grenzsteine[a]; sie rauben eine Herde und weiden sie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie entfernen Grenzsteine.« Das hebräische Verb kann das Verschieben oder Entfernen von Grenzmarkierungen bezeichnen, um sich fremdes Land anzueignen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sie stehlen eine Herde und hüten sie.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבֻלוֹת
  choice: Grenzsteine
  rationale: Der Plural bezeichnet hier Grundstücksgrenzen, wahrscheinlich deren sichtbare Markierungen. »Grenzsteine« gibt den konkreten rechtlich-sozialen Sinn im Deutschen natürlich wieder.
- source_word: יַשִּׂיגוּ
  choice: verrücken
  rationale: Im Zusammenhang mit Grundstücksgrenzen bezeichnet das Verb das unrechtmäßige Verschieben oder Entfernen von Grenzmarkierungen. »Verrücken« ist knapp und bewahrt die räumliche Handlung, ohne ein vollständiges Entfernen festzulegen.
- source_word: עֵדֶר
  choice: eine Herde
  rationale: Das singularische Kollektiv bezeichnet eine Herde, häufig eine Schaf- oder Ziegenherde. Der unbestimmte Artikel entspricht der artikellosen hebräischen Form.
- source_word: גָּזְלוּ
  choice: sie rauben
  rationale: Das Verb bezeichnet gewaltsames oder widerrechtliches Wegnehmen. »Rauben« bewahrt den Nachdruck stärker als das möglicherweise heimliche »stehlen«.
- source_word: וַיִּרְעוּ
  choice: und weiden sie
  rationale: רעה bezeichnet hier das Weiden beziehungsweise Hüten einer Herde. »Weiden« gibt die Tätigkeit prägnant wieder und lässt erkennen, dass die geraubte Herde anschließend offen wie die eigene versorgt wird.
