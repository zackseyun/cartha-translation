  source_fidelity: 'Der deutsche Text gibt die zwei parallelen Aussagen des Hebräischen präzise wieder: גְּבֻלוֹת als konkrete Grenzmarkierungen mit „Grenzsteine“, יַשִּׂיגוּ angemessen offen mit „verrücken“, גָּזְלוּ mit dem starken, rechtswidrigen „rauben“ und וַיִּרְעוּ idiomatisch als „weiden sie“. Die unbestimmte „eine Herde“ ist für עֵדֶר gut vertretbar. Die Alternative in Anmerkung a bewahrt die lexikalische Möglichkeit des Entfernens, ohne sie im Haupttext festzulegen.'
