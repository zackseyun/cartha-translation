source:
  edition: WLC
  text: יִתֶּן ל֣/וֹ לָ֭/בֶטַח וְ/יִשָּׁעֵ֑ן וְ֝/עֵינֵ֗י/הוּ עַל דַּרְכֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/023.yaml
  text: He gives them security[a], and they are supported[b]; his eyes are on their ways.
translation:
  language: de
  text: Er gewährt ihnen Sicherheit[a], und sie finden Halt[b]; seine Augen sind auf ihre Wege gerichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier der Singular „ihm“; auch das folgende Verb ist singularisch. Wegen des abschließenden Ausdrucks „ihre Wege“ wird die Aussage kollektiv mit „ihnen“ und „sie“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Formaler: „Er gewährt ihm Sicherheit, und er findet Halt; seine Augen sind auf ihre Wege gerichtet.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: gewährt
  rationale: Das Qal Imperfekt von נתן bezeichnet hier zusammen mit לָבֶטַח das Gewähren oder Verschaffen von Sicherheit. Das Präsens gibt die poetische Aussage im Deutschen natürlich wieder.
- source_word: לוֹ
  choice: ihnen
  rationale: Die Form ist morphologisch Singular („ihm“), wird jedoch kollektiv wiedergegeben, weil der Vers mit dem Plural דַּרְכֵיהֶם („ihre Wege“) endet und die Frevler als Gruppe im Blick stehen. Der formale Singular bleibt in der Fußnote erhalten.
- source_word: לָבֶטַח
  choice: Sicherheit
  rationale: Das Substantiv bezeichnet Sicherheit oder Geborgenheit. „Sicherheit“ passt idiomatisch zu „gewährt“ und legt den Ausdruck nicht einseitig als inneres Vertrauen aus.
- source_word: וְיִשָּׁעֵן
  choice: und sie finden Halt
  rationale: Das Nifal von שׁען kann „gestützt werden“, „sich anlehnen“ oder „Halt finden“ bedeuten. „Halt finden“ ist natürliches Deutsch und bewahrt das Bild des Gestütztseins, ohne dessen Art näher festzulegen. Der Numerus wird entsprechend dem kollektiven Verständnis pluralisch wiedergegeben.
- source_word: וְעֵינֵיהוּ
  choice: seine Augen
  rationale: Der hebräische Plural mit singularischem Suffix wird idiomatisch als „seine Augen“ wiedergegeben. Der Vers nennt den Besitzer nicht ausdrücklich; im Zusammenhang liegt Gott als der Beobachtende nahe.
- source_word: עַל
  choice: auf … gerichtet
  rationale: Die Präposition bezeichnet hier die auf etwas gerichtete, aufmerksame Wahrnehmung. Die deutsche Wendung „die Augen sind auf … gerichtet“ gibt dies natürlich wieder.
- source_word: דַּרְכֵיהֶם
  choice: ihre Wege
  rationale: דרך kann einen Weg oder bildlich die Lebensführung bezeichnen. „Wege“ erhält die hebräische Metapher und lässt zugleich den ethischen Sinn erkennen.
theological_decisions:
- issue: Wechsel zwischen Singular und Plural sowie Bezug der singularischen Person im Vers
  choice: Die erste Vershälfte wird kollektiv im Plural wiedergegeben („ihnen … sie“), während „seine Augen“ als singularische Form erhalten bleibt.
  alternative: 'Formal: „Er gewährt ihm Sicherheit, und er findet Halt; seine Augen sind auf ihre Wege gerichtet.“ Möglich ist auch, die Augen ausdrücklich auf Gott zu beziehen, doch der Name Gottes steht im Vers nicht.'
  rationale: Der hebräische Text verbindet singularische Formen („ihm“, „er“, „seine“) mit dem pluralischen „ihre Wege“. Die kollektive Wiedergabe der Betroffenen folgt dem abschließenden Plural, ohne die wahrscheinlich auf Gott bezogene, aber nicht ausdrücklich benannte singularische Perspektive in der letzten Aussage aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gewährt“ trägt den poetischen Ton, ohne altertümlich zu wirken; „finden Halt“ ist natürlicher als das wörtlich-passive „werden gestützt“. Die Metapher „Wege“ und der auffällige Numeruswechsel des Hebräischen bleiben erkennbar.
