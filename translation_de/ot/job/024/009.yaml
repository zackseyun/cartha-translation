translation:
  language: de
  text: Sie reißen das Waisenkind von der Brust weg[a] und nehmen dem Armen ein Pfand ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie rauben das Waisenkind von der Brust weg.“ Der hebräische Ausdruck ist schwierig; gemeint ist wohl, dass die Gewalttäter selbst ein noch gestilltes Waisenkind gewaltsam fortnehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְזְלוּ
  choice: sie reißen … weg
  rationale: גזל bezeichnet gewaltsames oder unrechtmäßiges Wegnehmen. Die Formulierung gibt hier die räuberische Gewalt des Handelns natürlich wieder.
- source_word: מִשֹּׁד
  choice: von der Brust
  rationale: Die schwierige hebräische Wendung wird entsprechend der traditionellen Deutung auf die Brust beziehungsweise das Stillen bezogen. Die knappe Wiedergabe bleibt näher am Wortlaut als die ausdrückliche Ergänzung „von der Brust der Mutter“.
- source_word: יָתוֹם
  choice: das Waisenkind
  rationale: יָתוֹם bezeichnet ein elternloses beziehungsweise besonders ein vaterloses Kind. „Waisenkind“ ist im Deutschen natürlich und macht die konkrete Schutzlosigkeit deutlich.
- source_word: וְעַל
  choice: dem
  rationale: In Verbindung mit חבל bezeichnet עַל hier die Person, der ein Pfand abgenommen wird. Der deutsche Dativ gibt dieses Verhältnis idiomatisch wieder.
- source_word: עָנִי
  choice: der Arme
  rationale: Im Zusammenhang mit Schuldpfand und Ausbeutung steht die wirtschaftliche Bedeutung „arm“ im Vordergrund.
- source_word: יַחְבֹּלוּ
  choice: sie nehmen … ein Pfand ab
  rationale: חבל bezeichnet hier das Nehmen eines Pfandes zur Sicherung einer Schuld. „Ein Pfand abnehmen“ ist verständlich und bewahrt den rechtlich-wirtschaftlichen Sinn.
