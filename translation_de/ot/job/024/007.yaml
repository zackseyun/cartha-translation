  text: עָר֣וֹם יָ֭לִינוּ מִ/בְּלִ֣י לְב֑וּשׁ וְ/אֵ֥ין כְּ֝ס֗וּת בַּ/קָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/007.yaml
  text: They spend the night naked[a], without clothing, and have no covering against the cold.
translation:
  language: de
  text: Nackt verbringen sie die Nacht, ohne Kleidung, und sie haben keine Bedeckung gegen die Kälte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָרוֹם
  choice: nackt
  rationale: Das Adjektiv bezeichnet unbekleidet oder nur unzureichend bekleidet zu sein. „Nackt“ gibt die Notlage direkt und anschaulich wieder.
- source_word: יָלִינוּ
  choice: verbringen sie die Nacht
  rationale: Die Form von לין bezeichnet das Übernachten bzw. Verbringen der Nacht. Diese Wiedergabe ist im modernen Deutsch natürlich und bewahrt den zeitlichen Sinn.
- source_word: מִבְּלִי
  choice: ohne
  rationale: Die Verbindung drückt Fehlen oder Entbehrung aus; „ohne“ ist knapp und idiomatisch.
- source_word: לְבוּשׁ
  choice: Kleidung
  rationale: Das Substantiv kann Kleidung allgemein oder ein Kleidungsstück bezeichnen. „Kleidung“ passt zum generischen Sinn und vermeidet unnötige Festlegung.
- source_word: כְּסוּת
  choice: Decke
  rationale: Das Wort bezeichnet eine Bedeckung, häufig ein Kleidungsstück, das auch nachts Schutz bietet. Im Zusammenhang mit dem Übernachten und der Kälte ist „Decke“ natürlich, konkret und funktional passend, ohne zwingend ein Bettzeug im modernen Sinn vorauszusetzen.
- source_word: בַּקָּרָה
  choice: gegen die Kälte
  rationale: Wörtlich steht eine Präpositionalverbindung mit „Kälte“. „Gegen die Kälte“ bringt im Deutschen die Schutzfunktion der fehlenden Bedeckung natürlich zum Ausdruck.
