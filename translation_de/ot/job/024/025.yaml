source:
  edition: WLC
  text: וְ/אִם לֹ֣א אֵ֭פוֹ מִ֣י יַכְזִיבֵ֑/נִי וְ/יָשֵׂ֥ם לְ֝/אַ֗ל מִלָּתִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/024/025.yaml
  text: And if it is not so[a], then who can prove me a liar and make my word into nothing?
translation:
  language: de
  text: Und wenn es nicht so ist – wer kann mich dann als Lügner erweisen und mein Wort zunichtemachen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Und wenn es nicht so ist
  rationale: Leitet eine bedingte Herausforderung ein und bezieht sich auf Hiobs vorausgehende Aussagen. Die Ergänzung „es … ist“ macht den knappen hebräischen Ausdruck im Deutschen natürlich verständlich.
- source_word: אֵפוֹ
  choice: dann
  rationale: Die Diskurspartikel verstärkt die folgernde, herausfordernde Frage; „dann“ gibt diese argumentative Funktion im Deutschen treffend wieder.
- source_word: מִי
  choice: wer
  rationale: Entspricht unmittelbar dem hebräischen Fragepronomen und eröffnet die rhetorische Herausforderung.
- source_word: יַכְזִיבֵנִי
  choice: kann mich … als Lügner erweisen
  rationale: Der Hifil von כזב kann bedeuten, jemanden als falsch beziehungsweise als Lügner zu erweisen. Die Formulierung bewahrt die persönliche und forensische Schärfe; „kann“ entspricht dem Sinn der rhetorischen Frage im natürlichen Deutschen.
- source_word: וְיָשֵׂם
  choice: und … machen
  rationale: Das häufige Verb „setzen, stellen, machen“ bildet hier mit לְאַל eine resultative Wendung; im Deutschen wird sie idiomatisch durch das Verb in „zunichtemachen“ wiedergegeben.
- source_word: לְאַל
  choice: zunichte
  rationale: Bezeichnet hier die Herabsetzung zu nichts beziehungsweise die Widerlegung als nichtig. „Zunichte“ ist knapp, verständlich und rhetorisch kräftig.
- source_word: מִלָּתִי
  choice: mein Wort
  rationale: Bewahrt den Singular sowie die prägnante Bedeutung „Wort, Äußerung, Aussage“ und passt zu Hiobs abschließender Selbstverteidigung.
theological_decisions: []
