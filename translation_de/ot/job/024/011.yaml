  text: Between their rows they press out oil[a]; they tread winepresses[b], yet they go thirsty.
translation:
  language: de
  text: Zwischen ihren Reihen[a] pressen sie Öl aus[b]; sie treten die Keltern und dürsten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwischen ihren Mauern“. Der hebräische Ausdruck kann Reihen oder Mauern bezeichnen; im landwirtschaftlichen Zusammenhang kann er abgegrenzte oder terrassierte Anbauflächen meinen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb ist schwierig und steht in Beziehung zu Öl oder Glanz. Im Zusammenhang ist wohl das Auspressen beziehungsweise Gewinnen von Öl gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: Zwischen
  rationale: Die räumliche Präposition wird direkt und natürlich wiedergegeben.
- source_word: שׁוּרֹתָם
  choice: ihren Reihen
  rationale: Das Substantiv kann Reihen oder Mauern bezeichnen. „Reihen“ wahrt das konkrete Bild und passt zum landwirtschaftlichen Zusammenhang, ohne die mögliche Bedeutung vorschnell auf Terrassen festzulegen.
- source_word: יַצְהִירוּ
  choice: pressen sie Öl aus
  rationale: Die schwierige Verbform hängt mit Öl beziehungsweise Glanz zusammen; im Zusammenhang landwirtschaftlicher Zwangsarbeit ist das Auspressen oder Gewinnen von Öl wahrscheinlich.
- source_word: יְקָבִים
  choice: die Keltern
  rationale: Der Ausdruck bezeichnet Keltern oder Kelterbecken; „Keltern“ ist im Deutschen die prägnante, sachlich passende Bezeichnung.
- source_word: דָּרְכוּ
  choice: sie treten
  rationale: Das Verb bezeichnet das Treten, besonders von Trauben in der Kelter.
- source_word: וַיִּצְמָאוּ
  choice: müssen aber dürsten
  rationale: '„Aber“ bringt den bitteren Gegensatz zum Ausdruck: Die Arbeiter erzeugen Getränke, bleiben selbst jedoch durstig. „Müssen dürsten“ lässt ihre Entbehrung und Ausbeutung erkennen.'
