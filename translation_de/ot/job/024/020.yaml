id: JOB.24.20
reference: Job 24:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִשְׁכָּ֘חֵ֤/הוּ רֶ֨חֶם מְתָ֘ק֤/וֹ רִמָּ֗ה ע֥וֹד לֹֽא יִזָּכֵ֑ר וַ/תִּשָּׁבֵ֖ר כָּ/עֵ֣ץ עַוְלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/020.yaml
  text: The womb forgets him[a]; the worm feeds sweetly on him. He is remembered no more[b], and injustice is broken like a tree.
translation:
  language: de
  text: Der Mutterleib vergisst ihn; der Wurm labt sich an ihm.[a] An ihn wird nicht mehr gedacht, und das Unrecht wird wie ein Baum zerbrochen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Der Wurm findet ihn süß.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Der Ungerechte wird wie ein Baum zerbrochen.“ Das Hebräische hat das abstrakte Substantiv „Unrecht“ beziehungsweise „Bosheit“, das hier für den Übeltäter stehen kann.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁכָּחֵהוּ
  choice: vergisst ihn
  rationale: Das Qal-Imperfekt von שׁכח mit Suffix der 3. Person Singular wird als anschauliche, allgemeingültige Beschreibung seines Geschicks wiedergegeben.
- source_word: רֶחֶם
  choice: der Mutterleib
  rationale: Bewahrt das konkrete und personifizierte Bild des hebräischen רֶחֶם; „Mutterleib“ ist im Deutschen natürlicher und eindeutiger als das isolierte „Leib“.
- source_word: מְתָקוֹ רִמָּה
  choice: der Wurm labt sich an ihm
  rationale: מְתָקוֹ bezeichnet in Verbindung mit רִמָּה, dass der Tote dem Wurm süß beziehungsweise angenehm ist. Die idiomatische Wiedergabe vermittelt das Bild des Verzehrens, ohne die Wurmart näher zu bestimmen; die wörtlichere Fassung steht in der Fußnote.
- source_word: עוֹד לֹא יִזָּכֵר
  choice: An ihn wird nicht mehr gedacht
  rationale: Die unpersönliche Passivkonstruktion gibt das Nifal von זכר und die durch עוֹד לֹא ausgedrückte Beendigung jeder Erinnerung natürlich wieder.
- source_word: וַתִּשָּׁבֵר
  choice: wird zerbrochen
  rationale: Die passive Bedeutung von שׁבר bleibt erhalten. „Zerbrochen“ wahrt das kräftige Bild und passt zur Vergleichsgröße Baum.
- source_word: כָּעֵץ
  choice: wie ein Baum
  rationale: Direkte Wiedergabe des mit כ eingeleiteten Vergleichs; עֵץ bezeichnet hier am naheliegendsten einen Baum.
- source_word: עַוְלָה
  choice: das Unrecht
  rationale: Die abstrakte Form des hebräischen Substantivs bleibt erhalten. „Unrecht“ ist im modernen Deutschen natürlicher als „Ungerechtigkeit“ und lässt sowohl moralische Verkehrtheit als auch begangenes Unrecht anklingen.
theological_decisions:
- issue: Ob עַוְלָה abstrakt („Unrecht“) oder konkret als Bezeichnung für den Übeltäter wiederzugeben ist
  choice: das Unrecht wird wie ein Baum zerbrochen
  alternative: der Ungerechte wird wie ein Baum zerbrochen
  rationale: Der hebräische Text verwendet ein abstraktes Substantiv. Da es jedoch metonymisch für einen ungerechten Menschen stehen kann und der maskuline Bezug der vorangehenden Sätze diese Deutung begünstigt, wird die konkrete Lesart in einer Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzstruktur. Das Präsens beziehungsweise Vorgangspassiv beschreibt anschaulich das typische Geschick des Frevlers. Die ungewöhnliche Personifikation des Mutterleibs und die Spannung der abstrakten Schlussaussage bleiben erhalten.
