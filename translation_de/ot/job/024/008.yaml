  - severity: low
    issue: Die Fußnote a nennt „Vom Unwetter in den Bergen“ als Alternative.
    rationale: Dies verschiebt die Konstruktion von „vom heftigen Regenguss/Sturzbach der Berge“ zu einem allgemeinen Ortssinn und ist als lexikalische Alternative weniger genau. Eine Formulierung mit „heftigem Regenguss der Berge“ oder „Sturzbach der Berge“ bewahrt den Bezug besser.
