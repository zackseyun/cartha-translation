  text: They are drenched by the mountain rains[a]; lacking shelter[b], they embrace the rock.
translation:
  language: de
  text: Vom heftigen Regenguss der Berge werden sie durchnässt[a]; ohne Schutz klammern sie sich an den Felsen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vom Sturzbach der Berge werden sie durchnässt“; auch: „vom Sturmregen der Berge“.'
