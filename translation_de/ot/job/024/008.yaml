  - marker: b
    text: 'Wörtlich: „Sie umarmen den Felsen“; gemeint ist, dass sie sich schutzsuchend eng an ihn drücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרֶם הָרִים
  choice: Vom Bergregen
  rationale: זֶרֶם bezeichnet einen heftigen Regenguss, eine Wasserflut oder einen Sturzbach. Im Zusammenhang der Witterungsexposition gibt „Bergregen“ den meteorologischen Sinn knapp und natürlich wieder; die möglichen Alternativen werden in der Fußnote bewahrt.
- source_word: יִרְטָבוּ
  choice: werden sie durchnässt
  rationale: Das Verb bedeutet „nass werden/sein“. „Durchnässt werden“ vermittelt die Stärke des Unwetters und die schutzlose Lage.
- source_word: וּמִבְּלִי מַחְסֶה
  choice: ohne Zuflucht
  rationale: Die Wendung bezeichnet das Fehlen eines Schutz- oder Zufluchtsortes. „Ohne Zuflucht“ bleibt nahe an der hebräischen Konstruktion und passt zum folgenden Felsenbild.
- source_word: חִבְּקוּ
  choice: klammern sie sich an
  rationale: Wörtlich bedeutet das Verb „umarmen“. Kontextuell beschreibt es, wie die Schutzlosen sich eng an den Felsen drücken; „sich anklammern“ macht diese Handlung im Deutschen unmittelbar verständlich.
- source_word: צוּר
  choice: den Felsen
  rationale: צוּר bezeichnet einen Felsen oder Felsblock. Der bestimmte Ausdruck kann hier generisch verstanden werden; „den Felsen“ bewahrt das konkrete Bild.
