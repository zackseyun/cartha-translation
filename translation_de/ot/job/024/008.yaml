  rationale: Die Revision präzisiert זֶרֶם als heftigen Regenguss, bewahrt „der Berge“ und verwendet mit „ohne Schutz“ eine natürliche, kontextgerechte Wiedergabe von מִבְּלִי מַחְסֶה. Das konkrete Bild des Anklammerns an den Felsen bleibt erhalten; die Fußnote dokumentiert die wörtliche Bildsprache des hebräischen Verbs.
