  text: בַּ֭/שָּׂדֶה בְּלִיל֣/וֹ יקצירו וְ/כֶ֖רֶם רָשָׁ֣ע יְלַקֵּֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/006.yaml
  text: In the field they harvest fodder[c][b][a], and they glean in the vineyard of the wicked.
translation:
  language: de
  text: Auf dem Feld ernten sie sein Viehfutter[a], und im Weinberg eines Gottlosen[b] halten sie Nachlese[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet gemischtes Tierfutter. Das Fürwort „sein“ steht im Hebräischen; worauf es sich bezieht, ist nicht eindeutig.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „eines Gottlosen“; gemeint sein kann allgemein ein gottloser Besitzer.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und den Weinberg eines Gottlosen lesen sie nach“. Im Hebräischen wird die Präposition „auf/in“ nicht ausdrücklich wiederholt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׂדֶה
  choice: Auf dem Feld
  rationale: Die Präposition ב ist lokativ; im natürlichen Deutschen heißt es bei landwirtschaftlicher Arbeit gewöhnlich „auf dem Feld“.
- source_word: בְּלִילוֹ
  choice: sein Viehfutter
  rationale: בְּלִיל bezeichnet gemischtes Tierfutter, nicht gewöhnliches Getreide für Menschen. Das Suffix der 3. Person Singular wird mit „sein“ sichtbar bewahrt, auch wenn sein Bezug im Hebräischen nicht völlig eindeutig ist.
- source_word: יקצירו
  choice: ernten sie
  rationale: קצר bedeutet „ernten, abernten“. „Ernten“ ist gegenwärtiges Standarddeutsch und passt auch zu Viehfutter.
- source_word: וְכֶרֶם רָשָׁע
  choice: und im Weinberg eines Gottlosen
  rationale: Für idiomatisches Deutsch wird die Ortsangabe „im“ ergänzt, obwohl die Präposition im zweiten Satzglied nicht ausdrücklich wiederholt wird. רָשָׁע ist substantiviert und bezeichnet hier wahrscheinlich einen gottlosen Besitzer.
- source_word: יְלַקֵּשׁוּ
  choice: halten sie Nachlese
  rationale: Das Piel von לקשׁ bezeichnet das Sammeln spät verbliebener Früchte beziehungsweise die Nachlese. Die Wendung ist im Deutschen präzise und bildet den landwirtschaftlichen Parallelismus ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Viehfutter“ verhindert die irreführende Deutung als gewöhnliches Getreide; „Nachlese halten“ bewahrt den landwirtschaftlichen Sinn. Die ungewöhnliche Besitzangabe und die fehlende Präposition im zweiten Halbvers werden nicht stillschweigend eingeebnet, sondern in Fußnoten kenntlich gemacht.
