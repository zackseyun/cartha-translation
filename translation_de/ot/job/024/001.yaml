source:
  edition: WLC
  text: מַדּ֗וּעַ מִ֭/שַּׁדַּי לֹא נִצְפְּנ֣וּ עִתִּ֑ים ו/ידע/ו לֹא חָ֥זוּ יָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/001.yaml
  text: Why are times not kept by the Almighty[b][a], and why do those who know him not see his days?
translation:
  language: de
  text: Warum sind dem Allmächtigen keine Zeiten[a] verborgen, und warum sehen die, die ihn kennen, seine Tage[b] nicht?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „festgesetzte Zeiten“. Die erste Zeile kann auch bedeuten: „Warum werden beim Allmächtigen keine festgesetzten Zeiten aufbewahrt?“'
    reason: lexical_alternative
  - marker: b
    text: „Seine Tage“ meint wahrscheinlich die Tage, an denen Gott richtend oder anderweitig eingreift.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Die schlichte Frageform gibt Hiobs Klage natürlich und unmittelbar wieder.
- source_word: מִשַּׁדַּי
  choice: vom Allmächtigen
  rationale: Beim passiven Verb bezeichnet מִן hier am ehesten den Handelnden beziehungsweise die Instanz, bei der die Zeiten verwahrt wären. שַׁדַּי wird in Hiob traditionsgemäß und treffend mit „der Allmächtige“ wiedergegeben.
- source_word: נִצְפְּנוּ
  choice: aufbewahrt
  rationale: צפן kann „verbergen“, „aufbewahren“ oder „zurücklegen“ bedeuten. „Aufbewahrt“ wahrt die Passivform und den Gedanken des Vorbehaltens, ohne ausdrücklich „verborgen“ hinzuzufügen.
- source_word: עִתִּים
  choice: Zeiten
  rationale: Die knappe Wiedergabe erhält die Offenheit zwischen allgemeinen Zeiten und festgesetzten Zeitpunkten.
- source_word: וְיֹדְעָיו
  choice: die, die ihn kennen
  rationale: Die substantivierte Partizipialform bezeichnet Menschen, die Gott kennen; die deutsche Formulierung ist verständlich und bewahrt den relationalen Sinn.
- source_word: חָזוּ
  choice: sehen
  rationale: חזה bedeutet hier „sehen“ oder „wahrnehmen“; „sehen“ erhält die knappe poetische Aussage.
- source_word: יָמָיו
  choice: seine Tage
  rationale: Die wörtliche Wiedergabe bewahrt die poetische Mehrdeutigkeit der Tage, die Gott gehören beziehungsweise an denen er handelt.
theological_decisions:
- issue: Bedeutung von „seine Tage“ in Bezug auf Gott
  choice: Die wörtliche Wendung „seine Tage“ bleibt im Haupttext stehen.
  alternative: „die Tage seines Gerichts“, „die Zeiten, in denen er eingreift“ oder „seine festgesetzten Gerichtstage“
  rationale: Der hebräische Ausdruck ist verdichtet und kann auf Zeiten göttlichen Eingreifens oder Gerichts zielen. Eine ausdrücklichere Wiedergabe würde die theologische Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche poetische Formulierung „seine Tage“ und die Offenheit von „Zeiten“ bleiben bewusst erhalten.
