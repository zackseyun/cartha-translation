  text: who shows no partiality to princes and does not regard the rich above the poor, for all of them are the work of his hands.
translation:
  language: de
  text: der Fürsten nicht bevorzugt und den Reichen nicht höher achtet als den Armen, denn sie alle sind das Werk seiner Hände.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נָשָׂא פְּנֵי שָׂרִים
  choice: der Fürsten gegenüber keine Parteilichkeit zeigt
  rationale: Die idiomatische Wendung נָשָׂא פְנֵי bezeichnet bevorzugende Parteilichkeit; die deutsche Wiedergabe ist natürlich und bewahrt den sozialen Bezug auf Fürsten.
- source_word: וְלֹא נִכַּר שׁוֹעַ לִפְנֵי דָל
  choice: den Reichen nicht höher achtet als den Armen
  rationale: נכר wird hier im Sinn von bevorzugend anerkennen bzw. achten verstanden. לִפְנֵי drückt den Vorrang des Reichen gegenüber dem Armen aus; „höher achtet als“ bewahrt diese Vergleichsrelation.
- source_word: כִּי מַעֲשֵׂה יָדָיו כֻּלָּם
  choice: denn sie alle sind das Werk seiner Hände
  rationale: Die Handwerksmetapher wird formal erhalten; כֻּלָּם bezieht beide genannten gesellschaftlichen Gruppen gleichermaßen ein.
theological_decisions:
- issue: Gottes Unparteilichkeit gegenüber gesellschaftlichem Rang und Besitz
  choice: Keine Bevorzugung von Fürsten oder Reichen ausdrücken
  alternative: Die Aussage allgemeiner als bloße Gleichbehandlung wiedergeben
  rationale: Der hebräische Text nennt konkret politische Stellung und Wohlstand; diese soziale und theologische Spannung soll nicht verallgemeinert oder abgeschwächt werden.
translation_notes:
  register: Moderner, würdevoller Standardsatz als fortgesetzter Relativsatz im Kontext. „Fürsten“, „Reichen“ und „Armen“ sind allgemein verständlich; die Metapher „Werk seiner Hände“ bleibt bewusst erhalten.
