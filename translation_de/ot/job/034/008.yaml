source:
  edition: WLC
  text: וְ/אָרַ֣ח לְ֭/חֶבְרָה עִם פֹּ֣עֲלֵי אָ֑וֶן וְ֝/לָ/לֶ֗כֶת עִם אַנְשֵׁי רֶֽשַׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/008.yaml
  text: and keeps company with workers of wickedness[b][a], and walks with men of evil.
translation:
  language: de
  text: und sich Übeltätern anschließt[a] und mit bösen Männern geht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Gemeinschaft mit Übeltätern zieht“. Das hebräische Verb kann sowohl das Reisen in Gesellschaft als auch das Sichanschließen an andere bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָרַח לְ/חֶבְרָה
  choice: und sich … anschließt
  rationale: Die Verbindung bezeichnet hier nicht nur ein örtliches Reisen, sondern das bewusste Suchen von Gemeinschaft. „Sich anschließen“ gibt diese soziale und moralische Ausrichtung in natürlichem Deutsch wieder.
- source_word: עִם
  choice: mit
  rationale: Die Präposition bezeichnet in beiden Satzteilen Gemeinschaft oder Begleitung und wird unmittelbar mit „mit“ wiedergegeben.
- source_word: פֹּעֲלֵי אָוֶן
  choice: Übeltätern
  rationale: Die Wendung bedeutet wörtlich „Täter von Unheil/Unrecht“. „Übeltäter“ bewahrt sowohl den aktiven Sinn von פֹּעֲלֵי als auch die moralische Bedeutung von אָוֶן, ohne im Deutschen schwerfällig zu wirken.
- source_word: וְ/לָ/לֶכֶת
  choice: und … geht
  rationale: הלך bezeichnet Gehen, kann aber zugleich den Lebenswandel und die gewählte Gemeinschaft ausdrücken. „Geht“ erhält das hebräische Bild und die Parallelität.
- source_word: אַנְשֵׁי רֶשַׁע
  choice: bösen Männern
  rationale: אַנְשֵׁי ist ausdrücklich maskulin und wird mit „Männern“ wiedergegeben; רֶשַׁע bezeichnet moralische Bosheit oder Unrecht. „Böse Männer“ ist natürliches, klares Deutsch.
theological_decisions:
- issue: Geschlechtsspezifische Formulierung in אַנְשֵׁי רֶשַׁע
  choice: bösen Männern
  alternative: bösen Menschen; den Gottlosen
  rationale: Der hebräische Ausdruck nennt ausdrücklich Männer. Die Übersetzung bewahrt diese Form, ohne den Referenzbereich eigenmächtig zu verallgemeinern.
- issue: Art der Verbindung mit den Übeltätern
  choice: sich anschließt
  alternative: in Gemeinschaft zieht
  rationale: Der Ausdruck kann Bewegung in Gesellschaft oder das Eingehen einer Gemeinschaft bezeichnen. Im Zusammenhang steht die moralische Zugehörigkeit im Vordergrund; die mögliche Bewegungsnuance wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Versanfang bleibt als Fortsetzung des vorherigen Zusammenhangs mit „und“ erhalten. Die Wiederholung der Bewegungsvorstellung in „geht“ bewahrt die Parallelstruktur des Hebräischen.
