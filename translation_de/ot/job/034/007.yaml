  text: מִי גֶ֥בֶר כְּ/אִיּ֑וֹב יִֽשְׁתֶּה לַּ֥עַג כַּ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/007.yaml
  text: What man is like Job[a], who drinks mockery like water?
translation:
  language: de
  text: Welcher Mann ist wie Hiob, der Spott wie Wasser trinkt?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Welcher Mann
  rationale: Die Verbindung leitet eine rhetorische Frage ein. „Welcher Mann“ gibt sowohl das Fragewort als auch das ausdrücklich männliche Singularwort גֶבֶר natürlich wieder.
- source_word: כְּאִיּוֹב
  choice: ist wie Hiob
  rationale: Die Präposition כְּ kennzeichnet einen Vergleich; im Deutschen ist „wie Hiob“ die natürliche Form.
- source_word: יִשְׁתֶּה
  choice: trinkt
  rationale: Das Imperfekt beschreibt hier in der rhetorischen Charakterisierung eine kennzeichnende Handlung; das deutsche Präsens entspricht diesem Sinn.
- source_word: לַּעַג
  choice: Spott
  rationale: Das Substantiv bezeichnet spöttische Rede beziehungsweise Verhöhnung. „Spott“ ist knapp, gegenwärtig und bewahrt die Bildhaftigkeit.
- source_word: כַּמָּיִם
  choice: wie Wasser
  rationale: Die gewöhnliche Vergleichsform bewahrt das eindrückliche Bild von etwas, das reichlich und bereitwillig getrunken wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und das ungewöhnliche Bild des Spotttrinkens bleiben eng am Hebräischen erhalten.
