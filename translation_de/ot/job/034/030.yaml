  text: so that a godless man should not reign[a], nor be snares to the people.
translation:
  language: de
  text: 'damit kein gottloser Mensch herrscht[a]

    und das Volk nicht in Fallstricke gerät.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit kein gottloser Mensch herrscht und dem Volk keine Fallstricke gelegt werden“; möglicherweise auch: „… wegen der Fallstricke eines Volkes“. Das Hebräische ist stark verkürzt; die genaue Verbindung von „herrschen“ und „Fallstricken“ ist unsicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמְּלֹךְ
  choice: damit … herrscht
  rationale: Die Präposition מִן mit dem Infinitiv von מלך bezeichnet hier im Anschluss an Vers 29 wahrscheinlich das Verhindern beziehungsweise den Zweck oder das Ergebnis von Gottes Handeln. Die deutsche Zweckkonstruktion gibt dies natürlich wieder.
- source_word: אָדָם
  choice: Mensch
  rationale: Gemeint ist ein einzelner menschlicher Herrscher. „Mensch“ wahrt den generischen Ausdruck des Hebräischen und klingt im Deutschen natürlicher als „Mann“, ohne die Einzahl aufzugeben.
- source_word: חָנֵף
  choice: gottlos
  rationale: Das Wort bezeichnet hier einen Menschen, der sich gegenüber Gott frevelhaft oder ehrfurchtslos verhält; „gottlos“ trifft diesen moralisch-religiösen Sinn besser als „heuchlerisch“.
- source_word: מִמֹּקְשֵׁי
  choice: und dem Volk keine Fallstricke gelegt werden
  rationale: Die stark verdichtete Form enthält מִן und den Plural von מוֹקֵשׁ, „Fangschlinge/Fallstrick“. Die passive deutsche Wendung erhält das Bild und gibt den wahrscheinlich präventiven Sinn verständlich wieder, ohne den gottlosen Herrscher ausdrücklich als Subjekt des Fallstricklegens festzulegen.
- source_word: עָם
  choice: dem Volk
  rationale: Im Zusammenhang von Herrschaft und Unterdrückung bezeichnet עָם die Gemeinschaft, die der Herrschaft untersteht.
theological_decisions:
- issue: Deutung der verdichteten Syntax des Verses
  choice: Gottes Handeln verhindert die Herrschaft eines Gottlosen und Fallstricke für das Volk.
  alternative: „damit kein gottloser Mensch herrscht, wegen der Fallstricke des Volkes“ beziehungsweise „damit kein Gottloser herrscht und das Volk nicht in Fallstricke gerät“
  rationale: Der hebräische Vers ist elliptisch und vom Zusammenhang in Vers 29 abhängig. Die gewählte Fassung gibt die wahrscheinliche Zweck- oder Ergebnisbeziehung wieder, kennzeichnet aber durch die Fußnote, dass die genaue syntaktische Zuordnung der zweiten Zeile offenbleibt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die poetische Zweizeiligkeit und das Bild der Fallstricke bleiben erhalten; die unklare hebräische Syntax wird im Haupttext lesbar wiedergegeben und in der Fußnote kenntlich gemacht.
