id: JOB.34.25
reference: Job 34:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן יַ֭כִּיר מַעְבָּֽדֵי/הֶ֑ם וְ/הָ֥פַךְ לַ֝֗יְלָה וְ/יִדַּכָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/025.yaml
  text: Therefore he recognizes their deeds; he overturns them in the night[a], and they are crushed.
translation:
  language: de
  text: Darum kennt er ihre Taten; er stürzt sie in der Nacht[a], und sie werden zerschmettert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „er stürzt sie bei Nacht“. Im Hebräischen wird das Objekt von „stürzt“ nicht ausdrücklich genannt; der Zusammenhang verweist auf die mächtigen Frevler, die gerichtet werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gedankengang knapp und natürlich.
- source_word: יַכִּיר
  choice: kennt
  rationale: Das Hifil von נכר bezeichnet hier das Erkennen bzw. genaue Wahrnehmen ihrer Taten; „kennt“ ist im Deutschen idiomatisch und lässt Gottes urteilendes Wissen im Kontext erkennen.
- source_word: מַעְבָּדֵיהֶם
  choice: ihre Taten
  rationale: Gibt das von עבד abgeleitete Substantiv prägnant wieder und bewahrt das moralische Gewicht des Zusammenhangs.
- source_word: וְהָפַךְ
  choice: er stürzt sie
  rationale: הפך kann Umkehren, Umstürzen oder Stürzen bezeichnen. Das Objekt bleibt im Hebräischen unausgesprochen; „sie“ wird aus dem Kontext der gerichteten Mächtigen ergänzt.
- source_word: לַיְלָה
  choice: in der Nacht
  rationale: Gibt den adverbialen Zeitbezug wörtlich und in natürlichem Deutsch wieder.
- source_word: וְיִדַּכָּאוּ
  choice: und sie werden zerschmettert
  rationale: Die passive Verbform von דכא drückt gewaltsames Zermalmen oder Zerschlagen aus; „zerschmettert“ bewahrt die Stärke des Bildes.
theological_decisions:
- issue: Unausgesprochenes Subjekt und Objekt im Gerichtsgeschehen
  choice: Gott bleibt das Subjekt; die zuvor genannten Mächtigen sind das aus dem Kontext ergänzte Objekt von „stürzt“.
  alternative: „Er wendet die Nacht“ beziehungsweise eine unpersönliche Deutung der Verben.
  rationale: Hiob 34,24–26 beschreibt Gottes Kenntnis und Gericht über Mächtige. Die Ergänzung „sie“ macht den kontextuell naheliegenden Bezug verständlich, ohne eine zusätzliche Lehrentscheidung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzfolge und die Härte des Gerichtsbildes bleiben erhalten; die im Hebräischen implizite Objektbeziehung wird im Haupttext transparent ergänzt.
