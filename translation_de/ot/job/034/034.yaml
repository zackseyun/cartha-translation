  yaml_path: translation/ot/job/034/034.yaml
  text: Men of understanding will say to me[a], and a wise man who hears me,
translation:
  language: de
  text: 'Männer mit Verstand[a] werden zu mir sagen und ein weiser Mann, der mir zuhört:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch wörtlich »Männer des Herzens«, eine Redewendung für Menschen mit Verstand oder Urteilsvermögen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לֵבָב
  choice: Männer mit Verstand
  rationale: Wörtlich »Männer des Herzens«. Im Hebräischen bezeichnet das Herz hier das Denk- und Urteilsvermögen; »mit Verstand« gibt die idiomatische Bedeutung natürlich wieder und bewahrt die männliche Form des Ausgangstextes.
- source_word: יֹאמְרוּ לִי
  choice: werden zu mir sagen
  rationale: Die Yiqtol-Form lässt hier eine zukunftsbezogene Aussage zu. »Zu mir sagen« gibt die Verbindung mit לִי präzise und idiomatisch wieder.
- source_word: וְגֶבֶר חָכָם
  choice: und ein weiser Mann
  rationale: גֶּבֶר kann die Kraft oder das Mannsein hervorheben, doch im Parallelismus bezeichnet es hier schlicht einen Mann; חָכָם bedeutet »weise«.
- source_word: שֹׁמֵעַ לִי
  choice: der mir zuhört
  rationale: Das Partizip beschreibt den weisen Mann attributiv. »Zuhören« gibt in diesem Zusammenhang die aufmerksame Wahrnehmung natürlicher wieder als bloßes »hören«, ohne den Sinn unnötig zu erweitern.
