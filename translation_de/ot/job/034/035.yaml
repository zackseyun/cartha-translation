  text: אִ֭יּוֹב לֹא בְ/דַ֣עַת יְדַבֵּ֑ר וּ֝/דְבָרָ֗י/ו לֹ֣א בְ/הַשְׂכֵּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/035.yaml
  text: Job speaks without knowledge[a], and his words are without understanding.
translation:
  language: de
  text: Hiob redet ohne Erkenntnis, und seine Worte sind ohne Einsicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Hiob redet nicht mit Erkenntnis, und seine Worte sind nicht mit Einsicht.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְדַעַת
  choice: ohne Erkenntnis
  rationale: Die Verbindung von ב mit dem abstrakten Substantiv דַּעַת bezeichnet hier die Art und Weise des Redens. »Ohne Erkenntnis« ist im Deutschen natürlich und bleibt nah am hebräischen Ausdruck.
- source_word: יְדַבֵּר
  choice: redet
  rationale: Das Imperfekt beschreibt in Elihus Urteil am ehesten gegenwärtiges beziehungsweise charakteristisches Handeln; »redet« gibt dies knapp und natürlich wieder.
- source_word: דְבָרָיו
  choice: seine Worte
  rationale: Die direkte Wiedergabe bewahrt den poetischen Parallelismus mit dem ersten Halbvers.
- source_word: בְהַשְׂכֵּיל
  choice: zeugen nicht von Einsicht
  rationale: שׂכל bezeichnet verständiges, einsichtsvolles Handeln. Die Formulierung gibt die negierte modale Aussage idiomatisch wieder, ohne sie als bloßen Mangel an intellektueller Fähigkeit zu verengen.
- source_word: לֹא
  choice: ohne / nicht
  rationale: Das zweimalige לֹא verneint jeweils eine mit ב bezeichnete Art und Weise. Im ersten Halbvers ist »ohne« idiomatisch; im zweiten ermöglicht »nicht« eine natürliche deutsche Formulierung.
