base_translation:
  language: en
  yaml_path: translation/ot/job/034/013.yaml
  text: Who appointed the earth over him[a], and who set the whole world in place?
translation:
  language: de
  text: Wer hat ihm die Erde anvertraut[a], und wer hat die ganze Welt an ihren Platz gesetzt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wer hat ihn über die Erde eingesetzt?« Das hebräische Verb פקד kann hier das Einsetzen, Beauftragen oder Anvertrauen von Verantwortung bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: פָקַד עָלָיו
  choice: ihm … anvertraut
  rationale: Die Verbindung von פקד mit עַל kann hier die Übertragung von Verantwortung oder Aufsicht bezeichnen. Die rhetorische Frage fragt, ob eine höhere Instanz Gott die Erde anvertraut habe.
- source_word: אָרְצָה
  choice: die Erde
  rationale: Im Parallelismus mit תבל ist der kosmische Sinn »Erde« wahrscheinlicher als das örtlich begrenzte »Land«.
- source_word: שָׂם
  choice: übertragen
  rationale: Wörtlich bedeutet שׂים »setzen, stellen, legen«. Im Zusammenhang mit der im ersten Satzteil angesprochenen Verantwortung gibt »übertragen« den Sinn natürlich wieder, ohne eine höhere Einsetzung Gottes als Aussage statt als rhetorische Frage zu formulieren.
- source_word: תֵּבֵל כֻּלָּהּ
  choice: die ganze Welt
  rationale: תבל bezeichnet die bewohnte beziehungsweise geordnete Welt; כֻּלָּהּ hebt ihre Gesamtheit hervor.
theological_decisions:
- issue: Bezug des Pronominalsuffixes in עָלָיו
  choice: 'Das Suffix bezieht sich auf Gott: »ihm«.'
  alternative: Eine weniger wahrscheinliche Deutung bezieht die Form sachlich auf die Erde beziehungsweise gibt den Satz allgemeiner wieder.
  rationale: Im Zusammenhang von Hiob 34,10–15 bestreitet Elihu mit einer rhetorischen Frage, dass eine übergeordnete Instanz Gott die Verantwortung für die Erde übertragen habe. Das maskuline Singularsuffix spricht im unmittelbaren Kontext am ehesten für Gott als Bezug.
- issue: Verhältnis der beiden Satzhälften
  choice: Beide Satzhälften werden als parallele Fragen nach der Übertragung der Welt an Gott wiedergegeben.
  alternative: 'Die zweite Hälfte kann räumlicher lauten: »Wer hat die ganze Welt hingestellt?«'
  rationale: Die parallele Konstruktion legt einen eng verbundenen Sinn nahe; zugleich wird die wörtlich-räumliche Möglichkeit von שׂים in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Zuspitzung bleibt erhalten; »anvertraut« und »übertragen« machen die Vorstellung einer von höherer Stelle erteilten Verantwortung verständlich, während die Fußnote die formnähere räumliche Wiedergabe dokumentiert.
