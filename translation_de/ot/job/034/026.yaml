  text: תַּֽחַת רְשָׁעִ֥ים סְפָקָ֗/ם בִּ/מְק֥וֹם רֹאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/026.yaml
  text: He strikes them as wicked people in full view[a].
translation:
  language: de
  text: Er schlägt sie als Frevler vor aller Augen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er schlägt sie wegen ihres Frevels vor aller Augen.« Die schwierige Anfangsformulierung kann den Grund ihrer Bestrafung bezeichnen statt den Status, in dem sie geschlagen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת
  choice: als
  rationale: Die schwierige Präposition bezeichnet hier am ehesten den Status, in dem die Betroffenen öffentlich geschlagen werden. Eine kausale Deutung bleibt in der Fußnote erhalten.
- source_word: רְשָׁעִים
  choice: Frevler
  rationale: Das substantivierte Adjektiv bezeichnet schuldige, gottlose Menschen; »Frevler« ist im Deutschen knapp, würdevoll und nicht ausdrücklich auf Männer beschränkt.
- source_word: סְפָקָם
  choice: Er schlägt sie
  rationale: Das Verb bezeichnet ein Schlagen; ein Ergebnis wie »nieder« oder »zu Boden« ist nicht ausdrücklich enthalten.
- source_word: בִּמְקוֹם רֹאִים
  choice: vor aller Augen
  rationale: Die Verbindung aus Ortsausdruck und dem Partizip »Sehende« bezeichnet natürliche Weise die öffentliche Sichtbarkeit des Geschehens, ohne einen zweiten eigenständigen Ort einzuführen.
theological_decisions:
- issue: Grund oder Status der Bestrafung
  choice: »als Frevler« gibt den Status an, in dem sie geschlagen werden.
  alternative: »wegen ihres Frevels« gibt den Grund der Bestrafung an.
  rationale: Die hebräische Anfangsphrase ist syntaktisch schwierig und lässt beide Deutungen zu; die Hauptfassung folgt der Statusdeutung, während die Fußnote die kausale Möglichkeit bewahrt.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. »Vor aller Augen« gibt die öffentliche Sichtbarkeit idiomatisch wieder; »Frevler« bewahrt den ethisch-religiösen Gehalt des hebräischen Ausdrucks.
