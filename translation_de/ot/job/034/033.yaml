id: JOB.34.33
reference: Job 34:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַֽ/מֵ/עִמְּ/ךָ֬ יְשַׁלְמֶ֨/נָּה כִּֽי מָאַ֗סְתָּ כִּי אַתָּ֣ה תִבְחַ֣ר וְ/לֹא אָ֑נִי וּֽ/מַה יָדַ֥עְתָּ דַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/033.yaml
  text: Should he repay according to your judgment because you have rejected it? For you must choose[a], and not I[b]; so declare what you know.
translation:
  language: de
  text: Sollte er es nach deinem Maßstab vergelten[a], weil du es verworfen hast?[b] Denn du musst entscheiden, nicht ich; sag also, was du weißt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Sollte er es von dir aus vergelten?« Der hebräische Anfang ist idiomatisch schwierig; gemeint ist offenbar, ob die Vergeltung sich nach Hiobs Maßstab richten soll.'
    reason: lexical_alternative
  - marker: b
    text: 'Worauf sich »es« bei »verworfen« bezieht, bleibt offen: möglich sind Gottes Urteil, seine Art zu regieren oder die hier angesprochene Vergeltung.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמֵעִמְּךָ
  choice: nach deinem Maßstab
  rationale: Die wörtliche Verbindung »von bei dir« ist idiomatisch schwierig. »Nach deinem Maßstab« gibt im Zusammenhang die Frage wieder, ob Gottes Vergeltung sich nach Hiobs Urteil oder Wunsch richten soll, ohne dies unnötig eng festzulegen.
- source_word: יְשַׁלְמֶנָּה
  choice: sollte er es vergelten
  rationale: Das Piel von שלם bezeichnet hier Vergelten oder Erstatten. Das feminine Suffix wird mit »es« wiedergegeben, obwohl sein Bezug im Hebräischen nicht eindeutig ist.
- source_word: כִּי מָאַסְתָּ
  choice: weil du es verworfen hast
  rationale: מאס bedeutet »verwerfen«, »zurückweisen« oder »verschmähen«. Das im Deutschen nötige Objekt »es« bleibt bewusst unbestimmt.
- source_word: כִּי אַתָּה תִבְחַר וְלֹא אָנִי
  choice: Denn du musst entscheiden, nicht ich
  rationale: בחר heißt grundsätzlich »wählen«. Im rhetorischen Zusammenhang fordert Elihu Hiob auf, selbst Stellung zu beziehen; »entscheiden« ist dafür im Deutschen natürlich, während »musst« die auffordernde Kraft ausdrückt.
- source_word: וּמַה יָדַעְתָּ דַבֵּר
  choice: sag also, was du weißt
  rationale: Die Aufforderung דַבֵּר wird direkt wiedergegeben. »Also« stellt den folgerichtigen Anschluss im Deutschen her.
theological_decisions:
- issue: Bestimmt Hiob Gottes Vergeltung?
  choice: Die rhetorische Frage weist die Vorstellung zurück, Gottes Vergeltung müsse sich nach Hiobs Maßstab richten.
  alternative: Die Wendung könnte enger als »Soll er von dir aus vergelten?« übersetzt werden.
  rationale: Der schwierige hebräische Ausdruck wird kontextgemäß wiedergegeben, ohne eine bestimmte Lehre über Gottes Regierung über den Wortlaut hinaus einzutragen.
- issue: Unbestimmter Gegenstand des Verwerfens
  choice: Das Pronomen »es« bleibt ohne festgelegten Bezug.
  alternative: Es könnte sich auf Gottes Urteil, seine Art zu regieren oder die angesprochene Vergeltung beziehen.
  rationale: Der hebräische Text nennt kein ausdrückliches Objekt; die Mehrdeutigkeit darf daher nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe bleibt erhalten; schwierige Bezüge werden im Vers nicht künstlich präzisiert, sondern in den Fußnoten erläutert.
