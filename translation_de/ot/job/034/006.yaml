    issue: „Mein Pfeil ist unheilbar“ ist im Deutschen semantisch missverständlich.
    rationale: Das Adjektiv „unheilbar“ wird auf eine Wunde oder Krankheit, nicht auf den Gegenstand „Pfeil“, bezogen. Die hebräische Metapher kann transparent in einer Fußnote bewahrt werden, während der Haupttext ihren wahrscheinlichen Bezug ausdrückt.
  - severity: low
    issue: „über mein Recht lügen“ ist weniger präzise als eine juristisch kontextualisierte Formulierung.
    rationale: Der Ausdruck kann klingen, als gehe es um eine Behauptung über abstraktes Recht. „In meiner Rechtssache“ überträgt den persönlichen Rechtsfall bzw. Anspruch natürlicher.
