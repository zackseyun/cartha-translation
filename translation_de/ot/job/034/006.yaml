  text: Should I lie concerning my right? My wound is incurable[b][a], though there is no transgression.
translation:
  language: de
  text: Sollte ich in meiner Rechtssache lügen?[a] Meine Wunde ist unheilbar[b] – ohne dass ich mich vergangen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Aussage: „Gegen meine Rechtssache gelte ich als Lügner.“'
    reason: alternative_reading
