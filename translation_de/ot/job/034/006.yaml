    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מִשְׁפָּטִי
  choice: über mein Recht
  rationale: עַל bezeichnet hier wahrscheinlich den Gegenstand der Aussage, während מִשְׁפָּטִי Hiobs Rechtsanspruch beziehungsweise die Berechtigung seiner Sache ausdrückt.
- source_word: אֲכַזֵּב
  choice: Sollte ich … lügen?
  rationale: Die Piel-Form kann aktives Lügen bezeichnen. Als rhetorische Frage verstanden, gibt die Formulierung Hiobs Weigerung wieder, seinen Rechtsanspruch durch eine falsche Aussage preiszugeben; die mögliche indikativisch-passive Deutung steht in Fußnote [a].
- source_word: אָנ֖וּשׁ
  choice: ist unheilbar
  rationale: Das Adjektiv bezeichnet etwas verzweifelt Schweres beziehungsweise Unheilbares und unterstreicht die äußerste Schwere der Verletzung.
- source_word: חִצִּי
  choice: mein Pfeil
  rationale: Das hebräische Wort bedeutet wörtlich „mein Pfeil“. Die ungewöhnliche Metapher bleibt im Haupttext erhalten, statt sie stillschweigend als „Wunde“ auszulegen; Fußnote [b] erläutert den wahrscheinlichen Sinn.
- source_word: בְלִי פָשַׁע
  choice: ohne dass ich mich vergangen habe
  rationale: בְלִי drückt das Fehlen aus, und פָשַׁע bezeichnet ein schweres moralisches Vergehen oder Aufbegehren. Die verbale deutsche Wendung ist natürlich und lässt den Zusammenhang zwischen Leiden und behaupteter Schuldlosigkeit deutlich werden.
theological_decisions:
- issue: Deutung von Elihus Wiedergabe der Aussage Hiobs
  choice: Der erste Satz wird als rhetorische Frage und der zweite als Klage über schweres Leiden trotz fehlenden Vergehens wiedergegeben.
  alternative: „Gegen mein Recht gelte ich als Lügner.“
  rationale: Der knappe hebräische Satzbau lässt sowohl eine rhetorische Frage mit aktivem Verb als auch eine indikativische, sinngemäß passive Deutung zu. Der Haupttext folgt der plausiblen Frageform, während die Fußnote die echte Mehrdeutigkeit bewahrt.
- issue: Bildsprache von חִצִּי
  choice: Das wörtliche Bild „mein Pfeil“ bleibt im Haupttext stehen.
  alternative: „Meine Wunde ist unheilbar.“
  rationale: „Pfeil“ kann die von Gott zugefügte Verletzung oder Plage bezeichnen. Die Beibehaltung des Bildes vermeidet eine unbelegte Festlegung, während die Fußnote seine wahrscheinliche metaphorische Bedeutung erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die juristische Färbung von מִשְׁפָּטִי bleibt mit „mein Recht“ erhalten. Der Gedankenstrich macht den Gegensatz lesbar, ohne einen im Hebräischen nicht ausdrücklich vorhandenen Konnektor einzuführen.
