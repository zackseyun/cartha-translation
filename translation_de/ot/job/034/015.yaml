  naturalness: „Gemeinsam vergehen“ wirkt im Deutschen leicht so, als handle es sich um ein bewusst gemeinschaftliches Tun. „Zugleich vergehen“ ist idiomatischer und bringt die durch יַחַד betonte Gleichzeitigkeit klarer zum Ausdruck. Die Platzierung des Fußnotenzeichens direkt bei „der Mensch“ macht den Bezug der lexikalischen Alternative eindeutig.
  terminology: „Alles Fleisch“ bewahrt die bildhafte und breite hebräische Wendung. „Der Mensch“ gibt den generischen Singular אָדָם angemessen wieder; die Fußnote sichert die ausdrücklich kollektive Lesart „die Menschheit“, ohne den Haupttext einzuengen.
