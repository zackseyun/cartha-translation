translation:
  language: de
  text: Alles Fleisch würde zugleich vergehen, und der Mensch[a] würde zum Staub zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Menschheit“. Das hebräische Wort אָדָם steht im Singular, kann hier aber die Menschheit als Ganzes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְוַע
  choice: würde vergehen
  rationale: גוע bezeichnet das Verscheiden oder Sterben. „Vergehen“ bewahrt den feierlichen Klang und gibt zusammen mit dem Konjunktiv II die aus Vers 14 fortwirkende Bedingung wieder.
- source_word: כָּל בָּשָׂר
  choice: alles Fleisch
  rationale: Die wörtliche hebräische Wendung umfasst sterbliche Lebewesen und richtet den Blick hier besonders auf die Menschheit; die vertraute deutsche Bibelsprache bewahrt ihre rhetorische Weite.
- source_word: יָחַד
  choice: gemeinsam
  rationale: Das Adverb betont das kollektive Geschehen. „Gemeinsam“ ist in diesem Satz natürlicher als „zusammen“, ohne die Bedeutung einzuengen.
- source_word: אָדָם
  choice: der Mensch
  rationale: Der Singular bezeichnet hier kollektiv den Menschen beziehungsweise die Menschheit. „Der Mensch“ bewahrt im Deutschen sowohl die Singularform als auch den allgemeinen Bezug.
- source_word: עַל עָפָר
  choice: zum Staub
  rationale: עַל bedeutet formal „auf/über“, doch mit שׁוב bezeichnet die Wendung idiomatisch die Rückkehr zum Staub. „Zum Staub“ ist natürlich und bewahrt den konkreten Herkunfts- und Sterblichkeitsbezug.
- source_word: יָשׁוּב
  choice: würde zurückkehren
  rationale: שׁוב bedeutet „zurückkehren“. Der Konjunktiv II trägt die Bedingung aus dem vorhergehenden Vers weiter.
theological_decisions:
- issue: Kollektive Bedeutung von אָדָם
  choice: der Mensch
  alternative: die Menschheit
  rationale: „Der Mensch“ erhält den hebräischen kollektiven Singular und bezeichnet im modernen Deutschen allgemein die Menschheit. Die explizit kollektive Alternative wird in der Fußnote genannt, ohne den Text konfessionell festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. „Alles Fleisch“ erhält die Weite des hebräischen Ausdrucks; der Konjunktiv II macht den vom vorhergehenden Vers abhängigen Bedingungssatz deutlich.
