  text: For he repays a man according to his deed[a], and he makes him find according to a man's way.
translation:
  language: de
  text: Denn er vergilt einem Menschen nach seinem Tun und lässt ihn nach seinem Weg finden, was ihm zukommt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lässt ihn es finden“; das hebräische Verb hat eine kausative Form und kann hier ausdrücken, dass Gott einem Menschen entsprechend seinem Weg etwas widerfahren lässt oder über ihn bringt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Elihus Aussage im Zusammenhang ein und gibt die erklärende Funktion natürlich wieder.
- source_word: פֹעַל אָדָם
  choice: dem Menschen sein Tun
  rationale: פֹעַל bezeichnet hier das Handeln eines Menschen; „Tun“ passt zum moralischen Vergeltungszusammenhang und bewahrt zugleich die generische Einzahl.
- source_word: יְשַׁלֶּם לוֹ
  choice: er vergilt dem Menschen
  rationale: Das Piel von שׁלם bezeichnet hier eine dem Verhalten entsprechende Vergeltung. „Vergelten“ erhält den gerichtlichen Sinn, ohne altertümlich zu wirken.
- source_word: וּכְאֹרַח אִישׁ
  choice: was seinem Weg entspricht
  rationale: אֹרַח ist wörtlich ein Weg und metaphorisch die Lebensführung. Die Formulierung bewahrt das Wegbild in natürlichem Deutsch.
- source_word: יַמְצִאֶנּוּ
  choice: lässt jeden erfahren
  rationale: Das Hiphil von מצא kann bedeuten, jemanden etwas finden oder erfahren zu lassen. Im Kontext geht es darum, dass der Mensch den seinem Weg entsprechenden Ausgang erfährt; die sachlich möglichen stärker kausativen Wiedergaben stehen in der Fußnote.
theological_decisions:
- issue: Göttliche Vergeltung entsprechend menschlichem Handeln
  choice: Der Vers sagt, dass Gott jedem Menschen entsprechend seinem Tun und Lebensweg vergilt.
  alternative: Die Aussage als umfassende Behauptung zu verstehen, jedes Leiden sei eine exakte unmittelbare Strafe für persönliche Sünde.
  rationale: Der Wortlaut formuliert ein allgemeines Prinzip göttlicher Gerechtigkeit. Die Übersetzung bewahrt dieses Prinzip, ohne die Spannung des Hiobbuchs durch eine weitergehende Aussage aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dem Menschen sein Tun“ ist bewusst als vorangestelltes Akkusativobjekt formuliert und nicht umgangssprachlich possessiv gemeint. Die zweite Halbzeile gibt die hebräische Kausativkonstruktion idiomatisch wieder und erhält mit „Weg“ das Bild der Lebensführung.
