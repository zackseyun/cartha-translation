  text: For has anyone said to God[a], ‘I have borne punishment; I will not offend again’?
translation:
  language: de
  text: 'Denn hat jemand zu Gott gesagt: »Ich habe die Strafe getragen; ich werde kein Unrecht tun«?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ich habe getragen; ich werde nicht verkehrt handeln.« Das Hebräische nennt nicht ausdrücklich, was getragen wurde; gemeint sein können Strafe, Züchtigung oder auch Schuld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Bewahrt die begründende beziehungsweise erläuternde Verbindung zum vorangehenden Gedankengang.
- source_word: אֶל אֵל
  choice: zu Gott
  rationale: Die Präposition אֶל bezeichnet hier die Richtung der Rede; אֵל ist in diesem Zusammenhang die Gottesbezeichnung „Gott“.
- source_word: הֶאָמַר
  choice: hat jemand gesagt
  rationale: Die Form ist morphologisch 3. Person Singular maskulin, wird durch das vorangestellte Frageelement jedoch als rhetorische Frage verstanden. „Jemand“ gibt den allgemeinen, nicht näher bestimmten Bezug im Deutschen natürlich wieder.
- source_word: נָשָׂאתִי
  choice: Ich habe die Strafe getragen
  rationale: נשׂא bedeutet grundsätzlich „tragen“. Das Objekt bleibt im Hebräischen unausgesprochen; im Zusammenhang liegt eine ertragene Strafe oder Züchtigung nahe. Die Ergänzung macht den elliptischen Ausdruck verständlich, während die Fußnote die Offenheit des Originals festhält.
- source_word: אֶחְבֹּל
  choice: ich werde nicht mehr Unrecht tun
  rationale: 'חבל hat hier wahrscheinlich ethischen Sinn: verkehrt, schädlich oder verderblich handeln. „Unrecht tun“ ist gegenwärtiges, verständliches Deutsch; „mehr“ bringt den im Vorsatz liegenden Verzicht auf weiteres Fehlverhalten idiomatisch zum Ausdruck.'
theological_decisions:
- issue: Unausgesprochenes Objekt von נָשָׂאתִי
  choice: Im Haupttext wird „die Strafe“ ergänzt.
  alternative: „Ich habe getragen“; möglich sind auch Bezüge auf Züchtigung oder Schuld.
  rationale: Der Kontext einer Rede zu Gott legt das Ertragen einer göttlichen Ahndung nahe, doch das Hebräische legt das Objekt nicht ausdrücklich fest. Die Fußnote bewahrt diese echte Bedeutungsweite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt erhalten; die Ellipse bei „tragen“ wird im Haupttext verständlich aufgelöst und in der Fußnote offengelegt.
