source:
  edition: WLC
  text: אָבִ֗י יִבָּחֵ֣ן אִיּ֣וֹב עַד נֶ֑צַח עַל תְּ֝שֻׁבֹ֗ת בְּ/אַנְשֵׁי אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/036.yaml
  text: My father[a], let Job be tested to the limit[c][b], because of his answers like wicked men.
translation:
  language: de
  text: Mein Vater[a], möge Hiob bis zum Äußersten[b] geprüft werden, weil er Antworten gibt wie frevelhafte Menschen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „mein Vater“, wahrscheinlich als Anrede; die ungewöhnliche hebräische Form wird auch anders verstanden.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „bis in Ewigkeit“ oder „auf Dauer“; hier wahrscheinlich im Sinn einer Prüfung bis zum Äußersten.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zusammen mit frevelhaften Menschen“ beziehungsweise „unter frevelhaften Menschen“; die hebräische Präposition kann Vergleich oder Gemeinschaft ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִי
  choice: Mein Vater
  rationale: Die überlieferte hebräische Form bedeutet wörtlich „mein Vater“ und wird am ehesten als Anrede verstanden. Da Ausdruck und Bezug ungewöhnlich sind, bleibt die Unsicherheit in einer Fußnote sichtbar.
- source_word: יִבָּחֵן
  choice: möge … geprüft werden
  rationale: Der Niphal-Imperfekt von בחן bezeichnet das Geprüft- oder Untersuchtwerden. Im Zusammenhang gibt er einen Wunsch wieder; der deutsche Optativ mit „möge“ bildet diesen Sinn natürlich ab.
- source_word: עַד נֶצַח
  choice: bis zum Äußersten
  rationale: Die Wendung lautet wörtlich „bis in Ewigkeit/auf Dauer“. Im Zusammenhang einer Prüfung liegt wahrscheinlich eine intensive, erschöpfende Prüfung näher als eine zeitlich endlose.
- source_word: עַל
  choice: weil
  rationale: 'Die Präposition führt hier den Grund für den Wunsch ein: Hiobs Antworten geben Anlass zu weiterer Prüfung.'
- source_word: תְּשֻׁבוֹת
  choice: Antworten
  rationale: Das Substantiv bezeichnet Antworten oder Erwiderungen und passt zum Streitgespräch.
- source_word: בְּאַנְשֵׁי אָוֶן
  choice: wie frevelhafte Menschen
  rationale: Die Präposition ב kann hier vergleichend oder als Hinweis auf Gemeinschaft beziehungsweise Zuordnung verstanden werden. Die Hauptfassung gibt den wahrscheinlichen Vergleich idiomatisch wieder; die Alternative wird in der Fußnote bewahrt.
theological_decisions:
- issue: Elihus Wunsch nach einer Prüfung Hiobs
  choice: Elihu wünscht, Hiob solle wegen der Art seiner Antworten gründlich geprüft werden.
  alternative: Hiob solle für immer geprüft werden oder gemeinsam mit frevelhaften Menschen der Prüfung unterzogen werden.
  rationale: Die Wunschform und der anklagende Ton werden wiedergegeben, ohne aus der schwierigen Zeitangabe oder Präposition eine weitergehende theologische Aussage abzuleiten.
- issue: Beziehung von Hiobs Antworten zu frevelhaften Menschen
  choice: Die Antworten werden mit denen frevelhafter Menschen verglichen.
  alternative: Hiob antwortet in Gemeinschaft mit beziehungsweise unter frevelhaften Menschen.
  rationale: Der vergleichende Sinn ergibt im Kontext eine klare Aussage, doch die hebräische Präposition lässt auch eine Zuordnung oder Gemeinschaft anklingen; diese Mehrdeutigkeit wird ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Möge“ bewahrt den Wunschcharakter; „bis zum Äußersten“ ist verständlich und vermeidet die wahrscheinlich irreführende Vorstellung einer endlosen Prüfung. Das ungewöhnliche „Mein Vater“ bleibt aus Texttreue stehen und wird erläutert.
