id: JOB.34.37
reference: Job 34:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֥י יֹ֘סִ֤יף עַֽל חַטָּאת֣/וֹ פֶ֭שַׁע בֵּינֵ֣י/נוּ יִסְפּ֑וֹק וְ/יֶ֖רֶב אֲמָרָ֣י/ו לָ/אֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/034/037.yaml
  text: For he adds rebellion to his sin[a]; among us he claps his hands[b], and he multiplies his words against God.
translation:
  language: de
  text: Denn zu seiner Sünde fügt er Auflehnung hinzu; mitten unter uns schlägt er die Hände zusammen[a] und häuft seine Worte gegen Gott[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »klatscht er in die Hände«. Die Gebärde drückt hier wahrscheinlich Spott, Trotz oder Verachtung aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zu Gott«. Die hebräische Präposition kann neutral die Richtung bezeichnen; der Zusammenhang spricht jedoch eher für »gegen Gott«.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Elihus vorangehendes Urteil ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: יֹסִיף עַל חַטָּאתוֹ
  choice: zu seiner Sünde fügt er … hinzu
  rationale: Bewahrt das Bild, dass zu einer bereits vorhandenen Sünde noch etwas hinzukommt, in natürlichem deutschem Satzbau.
- source_word: פֶשַׁע
  choice: Auflehnung
  rationale: Das Wort bezeichnet häufig einen trotzigen Bruch oder eine rebellische Übertretung; »Auflehnung« erhält diesen verschärfenden Sinn.
- source_word: בֵּינֵינוּ
  choice: mitten unter uns
  rationale: Gibt das wörtliche »zwischen uns« idiomatisch als Geschehen im Kreis der Anwesenden wieder.
- source_word: יִסְפּוֹק
  choice: schlägt er die Hände zusammen
  rationale: Bewahrt die konkrete, wohl spöttische oder herausfordernde Gebärde, ohne ihre genaue Bedeutung im Haupttext festzulegen.
- source_word: וְיֶרֶב אֲמָרָיו
  choice: und häuft seine Worte
  rationale: Gibt die Kausativform von רבה anschaulich wieder und erhält das Bild einer zunehmenden Menge von Worten.
- source_word: לָאֵל
  choice: gegen Gott
  rationale: Die Präposition ל kann eine Ausrichtung auf Gott bezeichnen; im anklagenden Zusammenhang ist die adversative Wiedergabe »gegen Gott« am wahrscheinlichsten.
theological_decisions:
- issue: Ob Hiobs Worte lediglich »an Gott« gerichtet oder »gegen Gott« gerichtet sind
  choice: gegen Gott
  alternative: zu Gott / an Gott
  rationale: Elihus Vorwurf steigert sich von Sünde zu Auflehnung und zu zahlreichen Worten. »Gegen Gott« entspricht diesem Zusammenhang, während die sprachlich mögliche neutralere Lesart in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am hebräischen Gedankengang, während »mitten unter uns« und »häuft seine Worte« natürlich verständlich sind. Die konkrete Handgebärde und die Mehrdeutigkeit der Präposition werden nicht stillschweigend vereindeutigt, sondern durch Fußnoten kenntlich gemacht.
