  text: because they turned aside from following him[b][a], and they did not understand any of his ways.
translation:
  language: de
  text: weil sie sich von ihm abwandten[a] und keinen seiner Wege bedachten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von hinter ihm weg“; eine hebräische Wendung dafür, jemandem nicht länger zu folgen.'
