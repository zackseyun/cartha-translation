lexical_decisions:
- source_word: אֲשֶׁר עַל כֵּן
  choice: weil
  rationale: Die Verbindung leitet hier den Grund für das zuvor genannte Gericht ein; „weil“ gibt diese kausale Funktion im Deutschen natürlich wieder.
- source_word: סָרוּ מֵאַחֲרָיו
  choice: sie wandten sich davon ab, ihm zu folgen
  rationale: סור bezeichnet ein Abweichen oder Sichabwenden; מֵאַחֲרָיו bedeutet wörtlich „von hinter ihm her“ und ist idiomatisch auf das Aufgeben der Nachfolge bezogen.
- source_word: וְכָל דְּרָכָיו
  choice: keinen seiner Wege
  rationale: 'Das wörtliche „alle seine Wege“ erhält durch die folgende Verneinung im natürlichen Deutschen distributiven Sinn: „keinen seiner Wege“. „Wege“ bewahrt die bildhafte Rede von Gottes Handeln und Weisungen.'
- source_word: לֹא הִשְׂכִּילוּ
  choice: bedachten ... nicht
  rationale: Das Hifil von שׂכל kann verstehen, einsichtig betrachten oder beachten bedeuten. Im Zusammenhang bezeichnet „nicht bedenken“ plausibel die fehlende aufmerksame Berücksichtigung, ohne die mögliche Bedeutung „verstehen“ auszuschließen.
theological_decisions:
- issue: Bezugswort der maskulinen Singularsuffixe in מֵאַחֲרָיו und דְּרָכָיו
  choice: Das Pronomen bleibt kleingeschrieben und wird kontextuell auf Gott bezogen.
  alternative: Ein irdischer Herrscher oder Richter könnte als unmittelbares Bezugswort verstanden werden.
  rationale: Elihus Rede handelt im weiteren Zusammenhang von Gottes Wahrnehmen und Richten. Die kleingeschriebenen Pronomen bewahren jedoch die grammatische Offenheit des Hebräischen, statt den Bezug typografisch festzulegen.
- issue: Bedeutung von הִשְׂכִּילוּ
  choice: „bedachten“
  alternative: „verstanden“ oder „handelten einsichtig im Blick auf“
  rationale: Die gewählte Formulierung erfasst die mögliche Bedeutung des aufmerksamen Erwägens und bewahrt durch eine Fußnote die lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als begründender Nebensatz an den vorhergehenden Vers gebunden. Die Formulierung ist nah am Hebräischen, löst dessen Idiom jedoch natürlich auf; die Mehrdeutigkeit von שׂכל wird in der Fußnote erhalten.
