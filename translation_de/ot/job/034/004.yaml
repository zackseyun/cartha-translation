  text: מִשְׁפָּ֥ט נִבְחֲרָה לָּ֑/נוּ נֵדְעָ֖ה בֵינֵ֣י/נוּ מַה טּֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/004.yaml
  text: Let us choose for ourselves what is just[a]; let us know among ourselves what is good.
translation:
  language: de
  text: Lasst uns selbst wählen, was recht ist[a]; lasst uns miteinander erkennen, was gut ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lasst uns selbst das Recht wählen; lasst uns miteinander unterscheiden, was gut ist.“'
    reason: 'Lexikalische Alternative: מִשְׁפָּט kann abstrakt „das Recht/die Gerechtigkeit“ heißen; נֵדְעָה kann im Zusammenhang des Prüfens auch „lasst uns unterscheiden“ wiedergegeben werden.'
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: was recht ist
  rationale: Das Substantiv kann Recht, Gerechtigkeit oder Urteil bezeichnen. Im Zusammenhang der gemeinsamen Prüfung gibt die substantivierte Wendung „was recht ist“ den ethisch-rechtlichen Sinn natürlich wieder, ohne ihn auf ein Gerichtsurteil zu verengen.
- source_word: נִבְחֲרָה
  choice: Lasst uns wählen
  rationale: Der Qal-Imperfekt der 1. Person Plural hat hier kohortative, auffordernde Kraft. „Lasst uns wählen“ bildet diese Voluntativform im Deutschen idiomatisch ab.
- source_word: לָּנוּ
  choice: selbst
  rationale: Die Präposition mit dem Pronomen der 1. Person Plural bezeichnet Vorteil oder Bezug. „selbst“ bringt die Eigenbeteiligung der Beratenden knapp und natürlich zum Ausdruck.
- source_word: נֵדְעָה
  choice: lasst uns erkennen
  rationale: ידע bedeutet grundsätzlich „wissen/kennen“, bezeichnet hier beim Abwägen des Guten jedoch sachgerecht ein Erkennen. Die Wiedergabe bleibt nahe am Hebräischen und klingt im Deutschen verständlich.
- source_word: בֵינֵינוּ
  choice: miteinander
  rationale: Wörtlich „zwischen/unter uns“ beschreibt die wechselseitige Beratung innerhalb der Gruppe. „miteinander“ gibt diese gemeinschaftliche Dimension in modernem Deutsch natürlich wieder.
- source_word: מַה טּוֹב
  choice: was gut ist
  rationale: Die Formulierung bewahrt die semantische Weite von טוֹב als gut, zuträglich oder angemessen und lässt die Parallele zu „was recht ist“ bestehen.
