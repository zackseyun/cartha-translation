  text: כִּֽי אָ֭מַר לֹ֣א יִסְכָּן גָּ֑בֶר בִּ֝/רְצֹת֗/וֹ עִם אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/009.yaml
  text: For he has said[a], ‘A man gains nothing by delighting himself with God.’
translation:
  language: de
  text: 'Denn er hat gesagt[a]: »Ein Mann hat nichts davon, wenn er an Gott Gefallen hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Mann hat nichts davon, wenn Gott Gefallen an ihm hat«, oder: »Ein Mann hat nichts davon, wenn er Gottes Gunst sucht.« Die knappe hebräische Wendung lässt mehrere Deutungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet Elihus vorausgehenden Vorwurf und gibt den argumentativen Zusammenhang natürlich wieder.
- source_word: אָמַר
  choice: er hat gesagt
  rationale: Das Perfekt bezeichnet eine frühere, für Elihus gegenwärtige Argumentation weiterhin bedeutsame Äußerung.
- source_word: לֹא יִסְכָּן
  choice: hat nichts davon
  rationale: Die Verbindung besagt idiomatisch, dass etwas keinen Nutzen oder Gewinn bringt; die Formulierung ist im heutigen Deutsch natürlich.
- source_word: גָּבֶר
  choice: ein Mann
  rationale: Das maskuline Singularwort bezeichnet hier einen Mann mit verallgemeinernder beziehungsweise repräsentativer Aussageabsicht.
- source_word: בִּרְצֹתוֹ
  choice: wenn er … Gefallen hat
  rationale: Der Infinitiv von רצה mit Suffix kann Gefallen, Wohlgefallen oder Gunst ausdrücken. Im Haupttext wird der Mann als Subjekt verstanden, ohne die kompakte Konstruktion in der Fußnote einseitig festzulegen.
- source_word: עִם אֱלֹהִים
  choice: an Gott
  rationale: עִם bedeutet gewöhnlich „mit“, bezeichnet hier jedoch die Beziehung, auf die sich das Gefallen richtet. „An Gott Gefallen haben“ ist natürliches Deutsch und wahrt den relationalen Sinn.
theological_decisions:
- issue: Deutung von בִּרְצֹתוֹ עִם אֱלֹהִים
  choice: Der Mann hat an Gott Gefallen, gewinnt dadurch aber nach der von Elihu wiedergegebenen Aussage nichts.
  alternative: Gott hat an dem Mann Gefallen; oder der Mann sucht Gottes Gunst.
  rationale: Das Suffix lässt sich am unmittelbarsten auf גָּבֶר als handelndes Subjekt beziehen, sodass Elihu Hiob vorwirft, Frömmigkeit für nutzlos zu halten. Da die knappe hebräische Wendung auch anders bezogen werden kann, bleiben die weiteren Deutungen in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und anklagend; die echte syntaktische und theologische Mehrdeutigkeit wird nicht im Haupttext überladen, sondern in der Fußnote offengehalten.
