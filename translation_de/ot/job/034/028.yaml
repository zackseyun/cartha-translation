  text: לְ/הָבִ֣יא עָ֭לָי/ו צַֽעֲקַת דָּ֑ל וְ/צַעֲקַ֖ת עֲנִיִּ֣ים יִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/028.yaml
  text: so as to bring before him the cry of the poor[b][a], and he hears the cry of the afflicted.
translation:
  language: de
  text: um den Schrei des Armen[b] vor ihn zu bringen[a]; und den Schrei der Bedrängten hört er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über ihn“ oder „gegen ihn“. Die hebräische Präposition lässt hier mehrere Deutungen zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „des Schwachen … der Armen“ beziehungsweise „des Armen … der Unterdrückten“. Die beiden hebräischen Bezeichnungen überschneiden sich, sind aber nicht bedeutungsgleich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: um … zu bringen
  rationale: Die Präposition לְ mit dem Hifil-Infinitiv von בוא bezeichnet hier Zweck oder Folge und knüpft den Vers an den vorausgehenden Zusammenhang an.
- source_word: עָלָיו
  choice: vor ihn
  rationale: In Verbindung mit „bringen“ gibt „vor ihn“ natürlich wieder, dass der Schrei Gott erreicht und ihm als Richter vorgelegt wird; andere Deutungen der Präposition bleiben in einer Fußnote erhalten.
- source_word: צַעֲקַת
  choice: den Schrei
  rationale: צעקה bezeichnet einen Not- oder Klageschrei. „Schrei“ ist direkt, verständlich und lässt die genaue Art des Rufes offen.
- source_word: דָּל
  choice: des Armen
  rationale: דָּל kann einen armen, schwachen oder gesellschaftlich machtlosen Menschen bezeichnen. „Armen“ ist im Zusammenhang passend, ohne die soziale Verletzlichkeit auszuschließen.
- source_word: וְצַעֲקַת
  choice: und den Schrei
  rationale: Die Wiederholung des Substantivs wird beibehalten, um den hebräischen Parallelismus hörbar zu machen.
- source_word: עֲנִיִּים
  choice: der Bedrängten
  rationale: עֲנִיִּים kann Arme, Elende, Gebeugte oder Unterdrückte bezeichnen. „Bedrängten“ wahrt den Unterschied zum vorhergehenden דָּל, ohne die Überschneidung beider Begriffe zu leugnen.
- source_word: יִשְׁמָע
  choice: hört er
  rationale: Das Imperfekt kann in diesem poetischen Weisheitstext Gottes charakteristisches Handeln ausdrücken. Die Endstellung des Verbs entspricht zudem der Hervorhebung im Hebräischen.
theological_decisions:
- issue: Bezug von עָלָיו und Subjekt von יִשְׁמָע
  choice: Der Schrei wird vor Gott gebracht, und Gott hört den Schrei der Bedrängten.
  alternative: Der Schrei richtet sich gegen den Gewalttäter; weniger wahrscheinlich könnte der Gewalttäter selbst als Hörender verstanden werden.
  rationale: Im unmittelbaren Zusammenhang geht es um Gottes richterliche Wahrnehmung der Unterdrückung. Daher liegt Gott als Bezugsperson und als Subjekt von „hört“ am nächsten. Die Mehrdeutigkeit der Präposition wird jedoch nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe poetische Parallelismus und die Wiederholung von „Schrei“ bleiben erhalten; der einleitende Infinitiv zeigt bewusst die syntaktische Verbindung zum vorhergehenden Vers.
