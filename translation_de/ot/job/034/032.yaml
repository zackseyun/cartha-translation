  text: בִּלְעֲדֵ֣י אֶ֭חֱזֶה אַתָּ֣ה הֹרֵ֑/נִי אִֽם עָ֥וֶל פָּ֝עַ֗לְתִּי לֹ֣א אֹסִֽיף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/032.yaml
  text: What I do not see[a], you teach me; if I have done wrong[b], I will not do it again.
translation:
  language: de
  text: Lehre mich, was ich nicht sehe[a]; wenn ich Unrecht getan habe, will ich es nicht wieder tun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher bzw. alternativ: „Was ich nicht sehe, zeige mir / lehre mich.“ Das Hebräische ist elliptisch und kann auch verstanden werden als: „Abgesehen von dem, was ich sehe, lehre mich.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Ich werde nicht hinzufügen“, das heißt: „Ich werde nicht damit fortfahren“ oder „Ich werde es nicht wieder tun.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְעֲדֵי אֶחֱזֶה
  choice: Was ich nicht sehe
  rationale: Die hebräische Wendung ist elliptisch. Diese Wiedergabe bewahrt das Bild des Sehens und drückt im Deutschen verständlich aus, was der Sprecher selbst nicht erkennt.
- source_word: אַתָּה הֹרֵנִי
  choice: das lehre du mich
  rationale: Das Hifil von ירה bedeutet gewöhnlich „lehren“ oder „unterweisen“. Das betonte „du“ entspricht dem ausdrücklich gesetzten אַתָּה und hebt die Bitte um Belehrung hervor.
- source_word: אִם
  choice: wenn
  rationale: Die Konjunktion leitet hier am natürlichsten eine Bedingung ein.
- source_word: עָוֶל פָּעַלְתִּי
  choice: ich Unrecht getan habe
  rationale: עָוֶל bezeichnet Unrecht oder verwerfliches Handeln; פעל ist ein allgemeines Verb des Tuns. Die Formulierung ist präzise, natürlich und lässt die Art des Unrechts offen.
- source_word: לֹא אֹסִיף
  choice: will ich es nicht wieder tun
  rationale: Die negierte Form von יסף bezeichnet idiomatisch, etwas nicht weiter oder nochmals zu tun. Das im Deutschen ergänzte „es“ nimmt das zuvor genannte Unrecht auf.
theological_decisions:
- issue: Haltung der Belehrbarkeit und Abkehr vom Unrecht
  choice: Der Vers wird als Bitte um Einsicht und als bedingter Entschluss wiedergegeben, das erkannte Unrecht nicht zu wiederholen.
  alternative: „Abgesehen von dem, was ich sehe, unterweise mich; wenn ich Unrecht begangen habe, werde ich nichts mehr hinzufügen.“
  rationale: Die Übersetzung erhält Demut, Bedingtheit und moralische Entschlossenheit, ohne ein umfassendes Schuldbekenntnis oder eine bestimmte Bußlehre in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Wortstellung „das lehre du mich“ bewahrt die Betonung des hebräischen „du“, ohne altertümlich zu wirken. Die genuine Ellipse der ersten Vershälfte und die idiomatische Aussage der zweiten werden in Fußnoten offengelegt.
