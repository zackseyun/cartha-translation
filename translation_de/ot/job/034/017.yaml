  text: הַ/אַ֬ף שׂוֹנֵ֣א מִשְׁפָּ֣ט יַחֲב֑וֹשׁ וְ/אִם צַדִּ֖יק כַּבִּ֣יר תַּרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/017.yaml
  text: Can one who hates justice govern? And will you condemn the righteous Mighty One?[a][b]
translation:
  language: de
  text: Kann denn jemand, der das Recht hasst, regieren?[a] Und willst du den gerechten Mächtigen verurteilen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „herrschen“, „im Zaum halten“; wörtlicher: „binden“. Das hebräische Verb bezeichnet hier wahrscheinlich die Ausübung von Herrschaft oder ordnender Gewalt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den gerechten Großen“. Gemeint ist hier sehr wahrscheinlich Gott; grammatisch ist auch die allgemeinere Wiedergabe „einen gerechten Mächtigen“ möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַאַף
  choice: Kann denn
  rationale: Die Verbindung aus Fragepartikel und אַף leitet eine nachdrückliche rhetorische Frage ein; „denn“ gibt diese Betonung im Deutschen natürlich wieder.
- source_word: שׂוֹנֵא
  choice: jemand, der … hasst
  rationale: Das substantivisch gebrauchte Partizip bezeichnet jemanden, der durch diese Haltung gekennzeichnet ist.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: Gemeint ist die gerechte Rechtsordnung beziehungsweise das rechtmäßige Urteil; „das Recht“ passt zum Zusammenhang des Herrschens.
- source_word: יַחֲבֹשׁ
  choice: regieren
  rationale: Die Grundbedeutung ist „binden“; im Kontext bezeichnet das Verb wahrscheinlich das Ausüben von Herrschaft oder ordnender Gewalt.
- source_word: וְאִם
  choice: Und
  rationale: Die Konjunktion verbindet die zweite rhetorische Frage eng mit der ersten; das deutsche Frageverb trägt die interrogative Funktion.
- source_word: צַדִּיק
  choice: gerecht
  rationale: Das Adjektiv bezeichnet moralische und richterliche Rechtschaffenheit und bleibt attributiv mehrdeutig.
- source_word: כַּבִּיר
  choice: Mächtigen
  rationale: Das substantivierte Adjektiv kann „mächtig“ oder „groß“ bedeuten. Die Großschreibung des Substantivs ist im Deutschen regulär und legt den göttlichen Bezug nicht allein typografisch fest.
- source_word: תַּרְשִׁיעַ
  choice: willst du … verurteilen
  rationale: Der Hifil von רשע bedeutet, jemanden für schuldig zu erklären beziehungsweise zu verurteilen; „verurteilen“ ist prägnant und idiomatisch.
theological_decisions:
- issue: Bezug von צַדִּיק כַּבִּיר
  choice: „den gerechten Mächtigen“, im Zusammenhang wahrscheinlich Gott
  alternative: „einen gerechten Mächtigen“ oder „den gerechten Großen“ als allgemeinere Bezeichnung eines Herrschers
  rationale: Elihus Argument zielt wahrscheinlich auf die Unangemessenheit, Gott zu verurteilen. Der Haupttext bewahrt jedoch die grammatische Formulierung, während die Fußnote den wahrscheinlichen Bezug und die echte lexikalische Alternative nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden rhetorischen Fragen bleiben knapp und parallel. „Kann denn“ vermittelt den Nachdruck der hebräischen Fragepartikel; die Fußnoten bewahren die lexikalische und referenzielle Mehrdeutigkeit.
