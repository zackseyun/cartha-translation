  text: כִּ֤י לֹ֣א עַל אִ֭ישׁ יָשִׂ֣ים ע֑וֹד לַ/הֲלֹ֥ךְ אֶל אֵ֝֗ל בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/023.yaml
  text: For he does not set a time for a man to go before God in judgment[a].
translation:
  language: de
  text: Denn er setzt für einen Menschen keinen weiteren Zeitpunkt fest, zu dem er vor Gott zum Gericht tritt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn er setzt für einen Menschen keinen weiteren Zeitpunkt fest, zu dem er vor Gott zum Gericht tritt.« Der hebräische Text ist schwierig und stark verdichtet. Wahrscheinlich ist gemeint, dass Gott vor seinem Urteil keine zusätzliche Anhörung oder keinen Aufschub braucht.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorherige Aussage ein und passt zum argumentativen Zusammenhang von Elihus Rede.
- source_word: לֹא
  choice: keine
  rationale: Die hebräische Verneinung wird zusammen mit dem im Deutschen ergänzten Objekt »Zeit« natürlich wiedergegeben.
- source_word: עַל אִישׁ
  choice: einem Menschen
  rationale: Bei שׂים bezeichnet עַל die Person, für die etwas festgesetzt beziehungsweise der etwas auferlegt wird. »Mensch« gibt den generisch gebrauchten maskulinen Singular im heutigen Deutsch natürlich wieder.
- source_word: יָשִׂים
  choice: setzt
  rationale: Das breite Verb bedeutet »setzen, stellen, festlegen«; hier bezeichnet es wahrscheinlich das Ansetzen eines weiteren Termins oder Zeitraums.
- source_word: עוֹד
  choice: weitere Zeit
  rationale: עוֹד bedeutet wörtlich »noch, weiter, nochmals«. Wegen der stark verdichteten Formulierung wird »Zeit« als sinngemäßes Objekt ergänzt, während »weitere« die Bedeutung von עוֹד ausdrücklich wahrt.
- source_word: לַהֲלֹךְ
  choice: damit er … tritt
  rationale: Der Infinitiv von הלך bedeutet »gehen«. Im gerichtlichen Zusammenhang ist »vor Gott ins Gericht treten« eine natürliche deutsche Wiedergabe des Erscheinens vor einem Richter.
- source_word: אֶל אֵל
  choice: vor Gott
  rationale: Wörtlich steht »zu Gott«; im gerichtlichen Zusammenhang gibt »vor Gott« die gemeinte Vorführung beziehungsweise das Erscheinen angemessen wieder.
- source_word: בַּמִּשְׁפָּט
  choice: ins Gericht
  rationale: מִשְׁפָּט kann Gericht, Urteil, Recht oder Rechtsverfahren bezeichnen. »Ins Gericht treten« bewahrt hier den forensischen Sinn und klingt im Deutschen würdig und verständlich.
theological_decisions:
- issue: Deutung der schwierigen, elliptischen Verbindung von עוֹד mit יָשִׂים
  choice: Gott setzt einem Menschen keine weitere Zeit an, um vor ihm zum Gericht zu erscheinen.
  alternative: 'Gott achtet nicht länger auf einen Menschen, bevor dieser mit ihm vor Gericht tritt; oder: Gott setzt keinen Zeitpunkt fest, zu dem ein Mensch vor ihm zum Gericht erscheint.'
  rationale: Der hebräische Satz ist stark verdichtet und lässt das Objekt von »setzen« unausgesprochen. Der Zusammenhang betont Gottes unmittelbare und vollkommene Kenntnis; daher ist wahrscheinlich gemeint, dass er keinen zusätzlichen Termin und keine weitere Anhörung benötigt. Die Fußnote hält die sprachliche Unsicherheit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die gerichtliche Bildsprache bleibt erhalten; die im Hebräischen ausgelassene Zeitangabe wird zur Verständlichkeit ergänzt und durch die Fußnote als Deutung kenntlich gemacht.
