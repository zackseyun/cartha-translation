  yaml_path: translation/ot/job/034/014.yaml
  text: If he should set his heart on himself[a], and gather to himself his spirit and his breath,
translation:
  language: de
  text: Wenn er sein Herz auf sich selbst richtete[a] und seinen Geist und seinen Atem zu sich holte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn er sein Herz darauf richtete und seinen Geist und seinen Atem zu sich holte«. Die hebräische Wendung »sein Herz richten« kann bedeuten, seine Aufmerksamkeit oder Absicht auf etwas zu lenken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָשִׂים
  choice: Wenn er … richtete
  rationale: Die Verbindung leitet einen hypothetischen Bedingungssatz ein. Der deutsche Konjunktiv II gibt die kontingente Aussage natürlich wieder.
- source_word: אֵלָיו לִבּוֹ
  choice: sein Herz auf sich selbst richtete
  rationale: Die Wendung bewahrt das hebräische Bild des Herzens als Sitz von Aufmerksamkeit und Absicht; אֵלָיו wird im Kontext reflexiv verstanden. Die mögliche allgemeinere Deutung wird in der Fußnote offengehalten.
- source_word: רוּחוֹ
  choice: seinen Geist
  rationale: רוּחַ kann Geist, Wind oder Atem bedeuten. »Geist« wahrt hier neben נְשָׁמָה die Unterscheidung der beiden parallelen Begriffe.
- source_word: וְנִשְׁמָתוֹ
  choice: und seinen Atem
  rationale: נְשָׁמָה bezeichnet den Atem beziehungsweise Lebensatem. »Atem« erhält das konkrete hebräische Bild.
- source_word: אֵלָיו יֶאֱסֹף
  choice: zu sich zurückholte
  rationale: אָסַף bedeutet wörtlich sammeln oder zusammenholen; im Zusammenhang ist das Zurücknehmen des von Gott gegebenen Lebens gemeint. »zurückholen« ist im Deutschen natürlich und bewahrt die Richtung »zu sich«.
theological_decisions:
- issue: Bezug der Pronomen
  choice: Die Pronomen der dritten Person Singular beziehen sich auf Gott; das erste אֵלָיו wird reflexiv als »auf sich selbst« wiedergegeben.
  alternative: »Wenn er sein Herz darauf richtete« beziehungsweise »wenn er darauf bedacht wäre«; auch dann bleibt Gott das Subjekt.
  rationale: Der Zusammenhang von Elihus Rede handelt von Gottes Verfügung über den Lebensgeist. Dennoch ist die genaue Funktion des ersten אֵלָיו sprachlich nicht völlig eindeutig, weshalb die alternative Auffassung in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das traditionelle Bild »Herz« bleibt erhalten; »zurückholen« formuliert die in אָסַף liegende Bewegung idiomatisch. Das abschließende Komma zeigt, dass der Bedingungssatz in Vers 15 fortgeführt wird.
