base_translation:
  language: en
  yaml_path: translation/ot/job/034/010.yaml
  text: 'Therefore[a], men of understanding, listen to me: far be it from God to do wickedness[b], and from the Almighty to do wrong.'
translation:
  language: de
  text: 'Darum hört mir zu, ihr verständigen Männer: Fern sei es Gott, Böses zu tun, und dem Allmächtigen, Unrecht zu begehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Fern sei Gott von Bosheit und der Allmächtige von Unrecht.“ Das Hebräische formuliert knapp ohne ein ausdrückliches Verb und erklärt solches Böse in Bezug auf Gott für undenkbar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Der Folgerungsmarker knüpft an Elihus vorausgehende Argumentation an; „Darum“ ist im Deutschen natürlich und bewahrt den logischen Zusammenhang.
- source_word: אַנֲשֵׁי לֵבָב
  choice: verständige Männer
  rationale: Wörtlich „Männer des Herzens“. לֵבָב bezeichnet hier Einsicht und Urteilsvermögen; die Wiedergabe bewahrt sowohl den idiomatischen Sinn als auch die grammatisch maskuline Form.
- source_word: שִׁמְעוּ לִי
  choice: hört mir zu
  rationale: Imperativ mit לִי fordert zum aufmerksamen Zuhören auf; „hört mir zu“ entspricht natürlichem modernem Deutsch.
- source_word: חָלִילָה לָאֵל מֵרֶשַׁע
  choice: Fern sei es von Gott, Böses zu tun
  rationale: חָלִילָה drückt eine entschiedene Zurückweisung aus. Die ergänzte Verbform macht die im Hebräischen knappe Aussage im Deutschen verständlich, ohne ihren Sinn festzulegen über das notwendige Maß hinaus.
- source_word: וְשַׁדַּי
  choice: und vom Allmächtigen
  rationale: שַׁדַּי wird als göttlicher Titel bedeutungsorientiert übersetzt; die parallele Konstruktion setzt die Wendung „fern sei es“ fort.
- source_word: מֵעָוֶל
  choice: Unrecht zu begehen
  rationale: עָוֶל bezeichnet Unrecht bzw. Ungerechtigkeit. „Unrecht begehen“ bildet einen würdigen und klaren Parallelismus zu „Böses tun“.
theological_decisions:
- issue: Wiedergabe des Gottestitels שַׁדַּי
  choice: der Allmächtige
  alternative: Schaddai
  rationale: Der Titel wird übersetzt, damit sein Bedeutungsgehalt für deutschsprachige Leser unmittelbar erkennbar bleibt; eine Transkription wäre ebenfalls möglich, aber weniger transparent.
- issue: Geschlecht der Wendung אַנֲשֵׁי לֵבָב
  choice: verständige Männer
  alternative: ihr Verständigen
  rationale: Die grammatisch maskuline Pluralform des Hebräischen wird beibehalten, während der idiomatische Sinn von „Herz“ als Einsicht ausgedrückt wird.
- issue: Elliptische Aussage mit חָלִילָה
  choice: Böses zu tun … Unrecht zu begehen
  alternative: Fern sei Gott das Böse und dem Allmächtigen das Unrecht
  rationale: Das Hebräische formuliert ohne ausdrückliches Verb und schließt Bosheit und Unrecht nachdrücklich von Gott aus. Die verbale deutsche Fassung verdeutlicht die Handlungsebene; eine nominale Wiedergabe bleibt als Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Formel „Fern sei es“ bewahrt die starke Zurückweisung des Hebräischen; der übrige Satz bleibt unmittelbar und gut verständlich.
