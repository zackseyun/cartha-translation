- source_word: לֶאֱכֹל
  choice: Speise
  rationale: Der substantivisch gebrauchte Infinitiv mit ל bezeichnet das, was zum Essen bestimmt ist; »Speise« bewahrt die knappe sprichwörtliche Form.
