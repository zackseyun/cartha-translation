  source_fidelity: 'Die Übersetzung bildet die beiden Imperative korrekt ab: שִׁמְעוּ als „Hört“ und הַאֲזִינוּ לִי als „schenkt mir Gehör“. „meine Worte“ gibt מִלָּי angemessen konkret wieder. Die Anreden „ihr Weisen“ und „ihr Wissenden“ bewahren die substantivisch-vokativen Pluralformen und die parallele Struktur des Hebräischen.'
