  text: שִׁמְע֣וּ חֲכָמִ֣ים מִלָּ֑/י וְ֝/יֹדְעִ֗ים הַאֲזִ֥ינוּ לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/002.yaml
  text: Hear my words[a], you wise men, and give ear to me, you who know.
translation:
  language: de
  text: Hört meine Worte, ihr Weisen, und schenkt mir Gehör, ihr Wissenden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Qal-Imperativ Plural fordert unmittelbar zum Hören auf und bildet mit dem zweiten Imperativ eine parallele Aussage.
- source_word: חֲכָמִים
  choice: ihr Weisen
  rationale: Das substantivisch gebrauchte maskuline Pluraladjektiv steht als Anrede; „ihr Weisen“ ist im Deutschen natürlich und würdevoll.
- source_word: מִלָּי
  choice: meine Worte
  rationale: Der Plural mit Suffix der ersten Person bezeichnet die einzelnen Worte bzw. Äußerungen des Sprechers und wird konkret wiedergegeben.
- source_word: וְיֹדְעִים
  choice: ihr Wissenden
  rationale: Das substantivisch und anredend gebrauchte Qal-Partizip bleibt als „Wissende“ eng an der offenen Bedeutung „diejenigen, die wissen“; „Verständige“ würde bereits eine Deutung hinzufügen.
- source_word: הַאֲזִינוּ לִי
  choice: schenkt mir Gehör
  rationale: Die deutsche Wendung gibt den vom Wort für „Ohr“ geprägten Imperativ treffend wieder, bezieht לִי ausdrücklich ein und bewahrt den poetischen Parallelismus.
theological_decisions: []
