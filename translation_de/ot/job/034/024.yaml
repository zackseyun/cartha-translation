source:
  edition: WLC
  text: יָרֹ֣עַ כַּבִּירִ֣ים לֹא חֵ֑קֶר וַ/יַּעֲמֵ֖ד אֲחֵרִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/024.yaml
  text: He shatters the mighty without investigation[a], and sets others in their place.
translation:
  language: de
  text: Er zerschmettert die Mächtigen ohne Untersuchung[a] und setzt andere an ihre Stelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne Nachforschung“. Wörtlich steht im Hebräischen knapp „keine Untersuchung/Nachforschung“. Gemeint sein kann, dass keine langwierige Prüfung nötig ist, bevor er die Mächtigen stürzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹעַ
  choice: zerschmettert
  rationale: Das Hifil von רעע bezeichnet hier ein gewaltsames Zerbrechen beziehungsweise Verderben. „Zerschmettert“ gibt den entschiedenen Sturz der Mächtigen wieder.
- source_word: כַּבִּירִים
  choice: die Mächtigen
  rationale: Das Wort bezeichnet einflussreiche, mächtige Personen; „die Mächtigen“ bewahrt die gesellschaftlich-politische Aussage, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: לֹא חֵקֶר
  choice: ohne Untersuchung
  rationale: Die knappe hebräische Verbindung lautet wörtlich etwa „keine Untersuchung/Nachforschung“. Die Wiedergabe erhält die Mehrdeutigkeit, ob keine Untersuchung nötig ist oder keine ausführliche Nachforschung stattfindet.
- source_word: וַיַּעֲמֵד
  choice: setzt
  rationale: Das Hifil von עמד bedeutet „stehen lassen, aufstellen, einsetzen“. Zusammen mit תַּחְתָּם ist „setzt ... an ihre Stelle“ im Deutschen natürlich.
- source_word: אֲחֵרִים
  choice: andere
  rationale: Der unbestimmte Plural bezeichnet andere Personen, die die Gestürzten ersetzen.
- source_word: תַּחְתָּם
  choice: an ihre Stelle
  rationale: 'Obwohl die Grundbedeutung „unter ihnen“ lautet, bezeichnet die Wendung in diesem Zusammenhang den Ersatz: Andere treten an ihre Stelle.'
theological_decisions:
- issue: Unausgesprochenes Subjekt der Verben
  choice: Gott wird durch „Er“ als Subjekt wiedergegeben.
  alternative: Ein unbestimmtes oder unpersönliches Subjekt könnte isoliert erwogen werden.
  rationale: Im Zusammenhang von Elihus Rede ist Gott das fortlaufende Subjekt seines Handelns an Herrschern. Das deutsche Pronomen macht das kontextuell gegebene Subjekt kenntlich, ohne zusätzliche Lehraussagen einzutragen.
- issue: Bedeutung von לֹא חֵקֶר
  choice: „ohne Untersuchung“ bleibt knapp und offen.
  alternative: „ohne lange Nachforschung“ oder „unerforschlich“
  rationale: Der hebräische Ausdruck kann besagen, dass Gott vor dem Sturz keine Untersuchung benötigt; eine Wiedergabe als „unerforschlich“ könnte dagegen Gottes Handeln als für Menschen unergründlich kennzeichnen. Die Hauptfassung vermeidet es, diese Spannung vorschnell aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zerschmettert“ bewahrt die Kraft des Verbs; die knappe Formulierung „ohne Untersuchung“ spiegelt die ungewöhnliche Kürze und mögliche Mehrdeutigkeit des Hebräischen.
