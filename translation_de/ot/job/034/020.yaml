source:
  edition: WLC
  text: רֶ֤גַע יָמֻתוּ֮ וַ/חֲצ֪וֹת לָ֥יְלָה יְגֹעֲשׁ֣וּ עָ֣ם וְ/יַעֲבֹ֑רוּ וְ/יָסִ֥ירוּ אַ֝בִּ֗יר לֹ֣א בְ/יָֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/020.yaml
  text: In a moment they die; at midnight a people are shaken[a], and they pass away; the mighty are removed, not by hand.
translation:
  language: de
  text: In einem Augenblick sterben sie; um Mitternacht wird ein Volk erschüttert und vergeht. Der Mächtige wird beseitigt, ohne Menschenhand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht durch Hand“. Gemeint ist wahrscheinlich: ohne menschliches Zutun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגַע
  choice: in einem Augenblick
  rationale: Das Substantiv bezeichnet einen sehr kurzen Augenblick. Die Wendung gibt die zeitliche Plötzlichkeit natürlich wieder, ohne zusätzlich eine bestimmte Art des Geschehens einzutragen.
- source_word: יָמֻתוּ
  choice: sterben sie
  rationale: מות ist das gewöhnliche Verb für „sterben“ und wird hier direkt wiedergegeben.
- source_word: וַחֲצוֹת לָיְלָה
  choice: um Mitternacht
  rationale: Die hebräische Wendung bedeutet wörtlich „zur Hälfte der Nacht“; „um Mitternacht“ ist die natürliche deutsche Entsprechung.
- source_word: יְגֹעֲשׁוּ
  choice: wird … erschüttert
  rationale: געשׁ bezeichnet heftiges Erschüttern, Beben oder Aufgewühltwerden. Die passive Formulierung passt zum nicht genannten Urheber des Geschehens.
- source_word: עָם
  choice: ein Volk
  rationale: Das kollektive Substantiv im Singular wird als „ein Volk“ wiedergegeben und behält so seine unbestimmte, kollektive Aussage.
- source_word: וְיַעֲבֹרוּ
  choice: und vergeht
  rationale: עבר bedeutet grundsätzlich „vorübergehen“. Im Zusammenhang von Tod und Beseitigung gibt „vergehen“ das Verschwinden des Volkes knapp und idiomatisch wieder.
- source_word: וְיָסִירוּ
  choice: wird beseitigt
  rationale: Der Hifil von סור bedeutet „entfernen, beseitigen“. Obwohl die hebräische Form aktiv und pluralisch ist, lässt sie den Handelnden unbestimmt; die deutsche Passivform bewahrt diese Unbestimmtheit.
- source_word: אַבִּיר
  choice: der Mächtige
  rationale: Das substantivierte Wort bezeichnet einen Starken oder Mächtigen. Der Singular des Hebräischen bleibt im Deutschen erhalten.
- source_word: לֹא בְיָד
  choice: nicht durch eine Hand
  rationale: Die bewusst nahe Wiedergabe erhält das ungewöhnliche hebräische Bild und legt nicht ausdrücklich fest, dass ausschließlich eine menschliche Hand gemeint ist. Die wahrscheinliche Bedeutung wird in der Fußnote erläutert.
theological_decisions:
- issue: Urheberschaft bei „nicht durch eine Hand“
  choice: Die bildhafte Formulierung bleibt im Haupttext weitgehend wörtlich und lässt offen, wer den Mächtigen beseitigt.
  alternative: „ohne Menschenhand“ oder „nicht durch menschliche Hand“
  rationale: Der Kontext legt ein Handeln ohne gewöhnliche menschliche Vermittlung und damit wahrscheinlich Gottes unmittelbares Eingreifen nahe. Der hebräische Wortlaut nennt jedoch weder „menschlich“ noch Gott ausdrücklich; deshalb wird diese Folgerung nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bewahren den eindringlichen Rhythmus. Das ungewöhnliche Bild „nicht durch eine Hand“ bleibt wegen seiner inhaltlichen Offenheit stehen und wird durch die Fußnote verständlich gemacht.
