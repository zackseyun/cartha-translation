lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: ענה in der Wayyiqtol-Form leitet hier die folgende Rede als Reaktion ein. „Antwortete“ gibt die übliche hebräische Redeeinleitung natürlich und präzise wieder.
- source_word: אֱלִיהוּא
  choice: Elihu
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: וַיֹּאמַר
  choice: sagte
  rationale: אמר ist das gewöhnliche Verb für „sagen“. „Sagte“ bewahrt in der Verbindung „antwortete … und sagte“ die formelhafte Struktur des Hebräischen.
- source_word: וַ־
  choice: Darauf
  rationale: Das einleitende Waw mit Wayyiqtol führt die Erzählung zeitlich und folgerichtig weiter. „Darauf“ drückt diesen Anschluss im modernen Deutschen natürlicher aus als ein bloßes „Und“.
