base_translation:
  language: en
  yaml_path: translation/ot/job/034/012.yaml
  text: Indeed[a], God does not act wickedly, and the Almighty does not pervert justice.
translation:
  language: de
  text: Gewiss, Gott tut kein Unrecht[a], und der Allmächtige beugt das Recht nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott spricht nicht zu Unrecht schuldig“ beziehungsweise „Gott erklärt nicht für schuldig“. Das hebräische Verb kann in manchen Zusammenhängen einen gerichtlichen Sinn haben.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אָמְנָם
  choice: Ja, gewiss
  rationale: Die Wortverbindung bekräftigt die Aussage nachdrücklich. „Ja, gewiss“ gibt diese steigernde, versichernde Kraft in natürlichem modernem Deutsch wieder.
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet hier den Gott Israels. „Gott“ ist im Deutschen die natürliche Wiedergabe und steht passend neben dem parallelen Titel „der Allmächtige“.
- source_word: יַרְשִׁיעַ
  choice: handelt nicht gottlos
  rationale: Der Hifil von רשע kann sowohl gottloses beziehungsweise schuldhaftes Handeln als auch im gerichtlichen Sinn das Schuldigsprechen bezeichnen. Im Parallelismus mit der Beugung des Rechts liegt hier die breitere Aussage über Gottes Handeln nahe; die mögliche forensische Bedeutung wird in der Fußnote bewahrt.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: „Der Allmächtige“ ist die geläufige und kontextgerechte deutsche Wiedergabe des Gottestitels שַׁדַּי.
- source_word: יְעַוֵּת
  choice: beugt ... nicht
  rationale: Das Verb bezeichnet ein Verdrehen oder Verformen. „Das Recht beugen“ ist die präzise und idiomatische deutsche Verbindung mit juristischem Klang.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: מִשְׁפָּט meint hier Recht beziehungsweise gerechtes Urteil. „Das Recht“ passt idiomatisch zur Wendung „das Recht beugen“ und erhält den forensischen Ton.
theological_decisions:
- issue: Bedeutung von יַרְשִׁיעַ im Blick auf Gottes Handeln
  choice: Gott handelt nicht gottlos
  alternative: Gott spricht nicht zu Unrecht schuldig / Gott erklärt nicht für schuldig
  rationale: Die Aussage bezeugt Gottes moralische und richterliche Integrität. Der Parallelismus mit „beugt das Recht nicht“ stützt die umfassendere Verneinung gottlosen Handelns, während die echte gerichtliche Bedeutungsnuance des hebräischen Verbs ausdrücklich in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelauftakt „Ja, gewiss“ bewahrt den Nachdruck des Hebräischen; „das Recht beugen“ ist eine natürliche juristische Wendung. Die Fußnote erhält die echte lexikalische Mehrdeutigkeit, ohne den Haupttext unnötig einzuengen.
