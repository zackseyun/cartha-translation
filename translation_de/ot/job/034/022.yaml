source:
  edition: WLC
  text: אֵֽין חֹ֭שֶׁךְ וְ/אֵ֣ין צַלְמָ֑וֶת לְ/הִסָּ֥תֶר שָׁ֝֗ם פֹּ֣עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/022.yaml
  text: There is no darkness[a], and no deep shadow, where workers of wickedness may hide themselves.
translation:
  language: de
  text: Es gibt keine Finsternis und keinen tiefen Schatten[a], wo Übeltäter sich verbergen könnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Todesschatten“; der hebräische Ausdruck kann in poetischen Texten auch tiefste Dunkelheit oder düstere Finsternis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: Es gibt keine / keinen
  rationale: Die hebräische Existenzverneinung wird im Deutschen idiomatisch mit „Es gibt keine/keinen“ wiedergegeben und gilt parallel für beide Substantive.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: Das Wort bezeichnet Dunkelheit beziehungsweise Finsternis. „Finsternis“ wahrt hier den gehobenen poetischen Ton und passt zum Motiv des Verbergens.
- source_word: צַלְמָוֶת
  choice: tiefer Schatten
  rationale: Im poetischen Sprachgebrauch kann der Ausdruck tiefste Dunkelheit oder düsteren Schatten bezeichnen, ohne zwingend auf den Tod zu verweisen. Die Übersetzung erhält das Bild und die Steigerung gegenüber „Finsternis“.
- source_word: לְהִסָּתֶר
  choice: sich verbergen könnten
  rationale: Der Infinitiv mit ל bezeichnet hier die Möglichkeit beziehungsweise den Zweck des Sichverbergens. Der deutsche Relativsatz gibt dies natürlich wieder; „könnten“ bringt die durch die Verneinung ausgeschlossene Möglichkeit zum Ausdruck.
- source_word: שָׁם
  choice: wo
  rationale: Wörtlich bedeutet das Adverb „dort“. Im Deutschen verbindet „wo“ den gedachten Ort der Dunkelheit idiomatisch mit dem folgenden Verbergen.
- source_word: פֹּעֲלֵי אָוֶן
  choice: Übeltäter
  rationale: Die Wendung bezeichnet Menschen, die Böses beziehungsweise Unrecht tun. „Übeltäter“ ist prägnant, verständlich und bewahrt den moralischen Gehalt, auch wenn die substantivische Tätigkeitsform des Hebräischen verdichtet wird.
- source_word: אָוֶן
  choice: Übel
  rationale: Das Substantiv kann Unheil, Unrecht oder Bosheit bezeichnen. Im Ausdruck „Übeltäter“ wird hier seine moralische Bedeutung passend wiedergegeben.
theological_decisions:
- issue: Bedeutung von צַלְמָוֶת im poetischen Zusammenhang
  choice: tiefer Schatten
  alternative: Todesschatten; tiefste Dunkelheit
  rationale: Der Zusammenhang handelt von der Unmöglichkeit, sich vor Gottes Blick zu verbergen, nicht ausdrücklich vom Tod. Deshalb steht im Haupttext eine auf tiefe Dunkelheit bezogene Wiedergabe; die traditionelle Deutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Bildsprache. Der Satz bleibt knapp und parallel gebaut; „Übeltäter“ vermeidet die im heutigen Deutsch schwerfällige Formulierung „Täter des Unrechts“.
