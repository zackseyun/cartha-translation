  text: וְ/אִם בִּ֥ינָה שִׁמְעָ/ה זֹּ֑את הַ֝אֲזִ֗ינָ/ה לְ/ק֣וֹל מִלָּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/016.yaml
  text: If you have understanding[a], hear this; listen to the sound of my words.
translation:
  language: de
  text: Wenn du Einsicht hast, höre dies; horche auf den Klang meiner Worte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „horche auf die Stimme meiner Worte“. Das Hebräische lautet wörtlich „auf den Klang/die Stimme meiner Worte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn
  rationale: Die Verbindung aus Konjunktion und Bedingungspartikel leitet einen bedingten Appell ein. Im modernen Deutschen gibt „Wenn“ dies klar und natürlich wieder; das vorangestellte וְ muss nicht eigens übersetzt werden.
- source_word: בִּינָה
  choice: Einsicht
  rationale: בִּינָה bezeichnet Verständnis, Einsicht oder Urteilsvermögen. „Einsicht“ passt zu Elihus Appell an die Fähigkeit des Hörers, seine Argumentation zu erfassen.
- source_word: שִׁמְעָה
  choice: höre
  rationale: Der Imperativ von שׁמע wird direkt wiedergegeben. „Höre“ bewahrt zudem die Abstufung zum folgenden Verb, das besonders aufmerksames Zuhören bezeichnet.
- source_word: זֹּאת
  choice: dies
  rationale: Das Demonstrativpronomen verweist auf Elihus Aussage. „Dies“ ist knapp, formal nah und idiomatisch, ohne ein erläuterndes Substantiv hinzuzufügen.
- source_word: הַאֲזִינָה
  choice: horche
  rationale: Das Verb fordert zu aufmerksamem Hinhören auf. „Horche auf“ unterscheidet es vom vorausgehenden „höre“ und klingt würdevoll, ohne veraltet zu sein.
- source_word: לְקוֹל
  choice: auf den Klang
  rationale: קוֹל kann „Klang“, „Laut“ oder „Stimme“ bedeuten. In Verbindung mit „meiner Worte“ bewahrt „Klang“ die konkrete hebräische Ausdrucksweise und ihre mögliche Nuance.
- source_word: מִלָּי
  choice: meiner Worte
  rationale: Das Substantiv bezeichnet gesprochene Worte oder Äußerungen. „Meiner Worte“ gibt den konkreten Plural unmittelbar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Aufforderungen „höre“ und „horche auf“ sowie die konkrete Wendung „Klang meiner Worte“ bleiben erhalten.
