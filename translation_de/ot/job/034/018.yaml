  text: הַ/אֲמֹ֣ר לְ/מֶ֣לֶךְ בְּלִיָּ֑עַל רָ֝שָׁ֗ע אֶל נְדִיבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/018.yaml
  text: who says to a king[a], ‘Worthless one!’ and to nobles[b], ‘Wicked ones!’
translation:
  language: de
  text: 'der zu einem König[a] sagt: »Nichtswürdiger![b]«, und zu Vornehmen: »Ihr Frevler![c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als rhetorische Frage: »Darf man zu einem König sagen …?«'
    reason: syntactic_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet hier einen nichtswürdigen oder niederträchtigen Menschen; es ist nicht zwingend als der spätere Eigenname »Belial« zu verstehen.
    reason: lexical_alternative
  - marker: c
    text: Hebräisch steht »Frevler« formal im Singular, obwohl die Anrede den pluralischen »Vornehmen« gilt.
    reason: grammatical_clarification
lexical_decisions:
- source_word: הַאֲמֹר
  choice: der … sagt
  rationale: Die substantivisch verstandene Infinitivform bezeichnet im Zusammenhang denjenigen, der so spricht, und knüpft als Relativsatz an die Beschreibung im vorherigen Vers an. Die mögliche interrogative Auffassung wird in Fußnote [a] offengehalten.
- source_word: לְמֶלֶךְ
  choice: zu einem König
  rationale: לְ kennzeichnet den Angesprochenen; das artikellose מֶלֶךְ wird hier am natürlichsten allgemein mit »einem König« wiedergegeben.
- source_word: בְּלִיָּעַל
  choice: Nichtswürdiger
  rationale: Das Wort ist hier eine verächtliche Bezeichnung für einen wertlosen oder niederträchtigen Menschen, nicht notwendig der spätere Eigenname »Belial«. Die Anrede bleibt entsprechend dem singularischen »König« im Singular.
- source_word: רָשָׁע
  choice: Ihr Frevler
  rationale: רָשָׁע steht formal im Singular, richtet sich im Parallelismus jedoch an die pluralischen נְדִיבִים. Die pluralische Anrede ist im Deutschen verständlich; »Frevler« bewahrt den starken moralisch-rechtlichen Sinn.
- source_word: אֶל
  choice: zu
  rationale: אֶל führt parallel zu לְמֶלֶךְ die Angesprochenen ein und wird idiomatisch mit »zu« wiedergegeben.
- source_word: נְדִיבִים
  choice: Vornehmen
  rationale: Das Wort bezeichnet hochgestellte oder gesellschaftlich angesehene Personen. »Vornehme« passt zum politischen und sozialen Parallelismus mit »König«, ohne sie enger als »Fürsten« festzulegen.
theological_decisions:
- issue: Syntaktischer Bezug von הַאֲמֹר
  choice: 'Relativische Fortführung: »der … sagt«'
  alternative: 'Selbstständige rhetorische Frage: »Darf man zu einem König sagen …?«'
  rationale: Im unmittelbaren Zusammenhang lässt sich die Zeile als weitere Beschreibung Gottes lesen; die hebräische Form erlaubt jedoch auch eine interrogative Deutung. Diese echte syntaktische Mehrdeutigkeit wird in Fußnote [a] ausdrücklich erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede ist knapp und scharf; »Nichtswürdiger« und »Frevler« bewahren den beleidigenden moralischen Nachdruck. Der kleingeschriebene Beginn signalisiert die syntaktische Fortführung aus dem vorherigen Vers.
