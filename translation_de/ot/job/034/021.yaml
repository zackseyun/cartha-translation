source:
  edition: WLC
  text: כִּי עֵ֭ינָי/ו עַל דַּרְכֵי אִ֑ישׁ וְֽ/כָל צְעָדָ֥י/ו יִרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/021.yaml
  text: For his eyes are on the ways of a man[a], and he sees all his steps.
translation:
  language: de
  text: Denn seine Augen sind auf die Wege eines Mannes[a] gerichtet, und alle seine Schritte sieht er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Wege eines Menschen«. Im Hebräischen steht eine maskuline Singularform, die hier allgemein für einen Menschen gebraucht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung zum vorhergehenden Gedanken ein und wahrt den argumentativen Zusammenhang.
- source_word: עֵינָיו עַל
  choice: seine Augen sind auf … gerichtet
  rationale: Gibt die hebräische Wendung mit עַל natürlich wieder und drückt Gottes aufmerksames Beobachten aus, ohne das Bild der Augen aufzugeben.
- source_word: דַּרְכֵי אִישׁ
  choice: die Wege eines Mannes
  rationale: Bewahrt sowohl das Wegbild, das hier auch Lebensführung und Verhalten umfasst, als auch die grammatisch maskuline Singularform von אִישׁ mit allgemeiner Geltung.
- source_word: וְכָל צְעָדָיו
  choice: und alle seine Schritte
  rationale: Übernimmt das konkrete Bild der Schritte und die umfassende Aussage von כָּל; gemeint sind zugleich die einzelnen Handlungen und der Lebensgang.
- source_word: יִרְאֶה
  choice: sieht er
  rationale: Das Qal-Imperfekt bezeichnet hier eine allgemeine, fortdauernde Wirklichkeit; im Deutschen ist dafür das Präsens angemessen.
theological_decisions:
- issue: Allgemeine Geltung des maskulinen Singulars אִישׁ
  choice: eines Mannes
  alternative: eines Menschen
  rationale: Die Übersetzung bewahrt die grammatisch maskuline Form des Hebräischen, während die Fußnote deutlich macht, dass die Aussage allgemein für Menschen gilt.
- issue: Bezug des Pronomens in עֵינָיו und יִרְאֶה
  choice: Pronomen der Vorlage beibehalten
  alternative: Gottes Augen … Gott sieht
  rationale: Der Zusammenhang identifiziert den Bezug auf Gott, doch der Vers selbst verwendet männliche Pronomen. Diese werden nicht durch die ausdrückliche Nennung Gottes ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht bildhafte Formulierung bewahrt die Parallelität von »Wege« und »Schritte« sowie die Pronomenstruktur des hebräischen Textes.
