reference: Job 34:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/ה֤וּא יַשְׁקִ֨ט וּ/מִ֥י יַרְשִׁ֗עַ וְ/יַסְתֵּ֣ר פָּ֭נִים וּ/מִ֣י יְשׁוּרֶ֑/נּוּ וְ/עַל גּ֖וֹי וְ/עַל אָדָ֣ם יָֽחַד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/029.yaml
  text: If he gives quietness[a], who can condemn? If he hides his face[c][b], who can behold him? This is so for a nation and for a man alike.
translation:
  language: de
  text: Wenn er Ruhe schafft, wer kann ihn verurteilen? Wenn er sein Angesicht verbirgt, wer kann ihn sehen? So ist es bei einer Nation und bei einem Menschen gleichermaßen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und über eine Nation und über einen Menschen zusammen“. Gemeint ist wahrscheinlich, dass das zuvor Gesagte für beide gleichermaßen gilt.'
    reason: Die hebräische Präposition עַל und das Adverb יָחַד erlauben eine wörtlichere, räumlich klingende Wiedergabe; die Hauptübersetzung gibt den wahrscheinlichen Geltungssinn wieder.
lexical_decisions:
- source_word: יַשְׁקִט
  choice: Ruhe schafft
  rationale: 'Der Hifil von שׁקט hat kausative Bedeutung: Gott ist nicht nur ruhig, sondern bewirkt Ruhe oder Ungestörtheit. „Ruhe schafft“ gibt diese Kraft natürlich wieder.'
- source_word: יַרְשִׁעַ
  choice: verurteilen
  rationale: Der Hifil von רשע kann forensisch bedeuten, jemanden für schuldig oder böse zu erklären. „Verurteilen“ ist im Deutschen knapp und idiomatisch.
- source_word: יַסְתֵּר פָּנִים
  choice: sein Angesicht verbirgt
  rationale: Die wörtliche Wendung bewahrt das bedeutsame Bild göttlicher Verborgenheit, ohne es auf Entzug von Gunst zu verengen.
- source_word: יְשׁוּרֶנּוּ
  choice: ihn sehen
  rationale: שור bedeutet „anschauen, erblicken“. „Ihn sehen“ ist modernes, klares Deutsch; das maskuline Suffix verweist auf Gott.
- source_word: גּוֹי
  choice: Nation
  rationale: גוי bezeichnet hier ein kollektives politisch-soziales Gebilde. „Nation“ erhält den Gegensatz zum einzelnen Menschen.
- source_word: אָדָם
  choice: Mensch
  rationale: Im Kontrast zur Nation bezeichnet אדם hier den einzelnen Menschen. „Mensch“ ist im modernen Deutschen natürlich und bewahrt den Singular ohne unnötige Geschlechtsfestlegung.
- source_word: יָחַד
  choice: gleichermaßen
  rationale: יחד drückt hier die gemeinsame beziehungsweise gleiche Geltung für Nation und Einzelnen aus, nicht primär räumliches Zusammensein.
- source_word: וְעַל גּוֹי וְעַל אָדָם יָחַד
  choice: So ist es bei einer Nation und bei einem Menschen gleichermaßen
  rationale: Die flexible Präposition על bezeichnet hier am ehesten den Geltungsbereich des zuvor Gesagten. Die Wiedergabe vermeidet eine unbegründete Festlegung auf „gegen“.
theological_decisions:
- issue: Göttliche Verborgenheit
  choice: Das anthropomorphe Bild „sein Angesicht verbirgt“ bleibt erhalten.
  alternative: „sich abwendet“ oder „seine Gunst entzieht“
  rationale: Die wörtliche Bildsprache lässt offen, welche Folgen Gottes Verborgenheit im Einzelnen hat, und bewahrt so die theologische Spannung.
- issue: Bezug von יַרְשִׁעַ
  choice: „wer kann ihn verurteilen?“ – das Objekt ist Gott.
  alternative: „wer kann für schuldig erklären?“ mit einem ungenannten menschlichen Objekt
  rationale: Die parallele zweite Frage hat ein ausdrückliches, auf Gott bezogenes Suffix („ihn“); syntaktisch und rhetorisch liegt derselbe Bezug auch in der ersten Frage nahe, obwohl das Objekt dort nicht ausdrücklich bezeichnet ist.
- issue: Geltungsbereich des Schlusssatzes
  choice: Die Aussage gilt gleichermaßen für eine Nation und einen einzelnen Menschen.
  alternative: „gegen eine Nation und gegen einen Menschen zugleich“
  rationale: Der Schluss weitet den Grundsatz auf kollektive und individuelle menschliche Größen aus. Die Wiedergabe lässt die flexible Bedeutung von על offen, statt eine strafende Ausrichtung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Angesicht“ bleibt wegen der festen biblischen Bildsprache erhalten; sonst werden geläufige gegenwärtige Ausdrücke verwendet. Die beiden rhetorischen Fragen und der Wechsel von der Nation zum einzelnen Menschen bleiben deutlich.
