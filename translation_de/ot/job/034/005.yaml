  source_fidelity: Die Wiedergabe von צָדַקְתִּי mit „Ich bin im Recht“ trifft den forensischen Sinn präzise. Auch „hat mir mein Recht entzogen“ gibt הֵסִיר מִשְׁפָּטִי angemessen wieder. Das hebräische וְ ist jedoch schlicht additiv; „doch“ fügt einen ausdrücklicheren Gegensatz hinzu, den der Ausgangstext nicht markiert.
  naturalness: '„Denn Hiob hat gesagt: »Ich bin im Recht, und Gott hat mir mein Recht entzogen.«“ ist modernes, würdiges und idiomatisches Standarddeutsch.'
  terminology: „Hiob“, „im Recht“ und „mein Recht“ sind terminologisch passend. Die Fußnote sollte die tragfähige Alternative „die mir zustehende Gerechtigkeit“ bieten; „meinen gerechten Entscheid“ ist im Deutschen semantisch enger und legt einen bestimmten gerechten Richterspruch nahe.
