  yaml_path: translation/ot/job/034/005.yaml
  text: For Job has said[a], ‘I am in the right, and God has taken away my justice.’
translation:
  language: de
  text: 'Denn Hiob hat gesagt: »Ich bin im Recht, und Gott hat mir mein Recht entzogen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die mir zustehende Gerechtigkeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Elihus Begründung mit einem Rückverweis auf Hiobs Aussage ein und passt natürlich in den argumentativen Zusammenhang.
- source_word: אָמַר
  choice: hat gesagt
  rationale: Das Qatal berichtet eine frühere, für die gegenwärtige Argumentation weiterhin maßgebliche Aussage.
- source_word: אִיּוֹב
  choice: Hiob
  rationale: Eingebürgerte deutsche Namensform.
- source_word: צָדַקְתִּי
  choice: Ich bin im Recht
  rationale: Gibt den forensischen Sinn von צדק idiomatisch wieder, ohne Hiob eine umfassende Behauptung moralischer Sündlosigkeit zuzuschreiben.
- source_word: וְאֵל
  choice: doch Gott
  rationale: Das Waw verbindet die beiden Aussagen; im Deutschen macht »doch« den inhaltlichen Gegensatz natürlich kenntlich, ohne den Gottesnamen zu erweitern.
- source_word: הֵסִיר
  choice: hat … entzogen
  rationale: Das Hifil von סור bezeichnet das Entfernen oder Wegnehmen; »entzogen« passt zur Vorstellung eines vorenthaltenen Rechts.
- source_word: מִשְׁפָּטִי
  choice: mein Recht
  rationale: מִשְׁפָּט bezeichnet hier das Recht beziehungsweise die gerechte Entscheidung, die Hiob für sich beansprucht. »Mein Recht« ist im Deutschen natürlich und bewahrt den forensischen Bezug.
theological_decisions:
- issue: Forensische Nuance von Hiobs Selbstaussage
  choice: »Ich bin im Recht«
  alternative: »Ich bin gerecht«
  rationale: Die Formulierung bezieht Hiobs Anspruch auf seinen Streitfall vor Gott und vermeidet die weitergehende Behauptung vollkommener moralischer Gerechtigkeit.
- issue: Bedeutungsumfang von מִשְׁפָּטִי
  choice: »mein Recht« im Haupttext
  alternative: »die mir zustehende Gerechtigkeit« oder »meinen gerechten Entscheid«
  rationale: »Mein Recht« ist zugleich verständlich und juristisch offen genug; die Fußnote hält die weiteren Nuancen des hebräischen Begriffs fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist idiomatisch und forensisch gefasst. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Zitat.
