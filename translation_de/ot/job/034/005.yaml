    rationale: Diese Formulierung ist im Deutschen ungewohnt und verengt מִשְׁפָּטִי auf einen konkreten gerechten Entscheid. Die Alternative „die mir zustehende Gerechtigkeit“ wahrt den Sinnbereich besser.
