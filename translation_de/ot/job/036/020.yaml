  yaml_path: translation/ot/job/036/020.yaml
  text: Do not long for the night[a], when peoples are taken away from their place.
translation:
  language: de
  text: Sehne dich nicht nach der Nacht[a], in der Völker von ihrem Ort weggenommen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wörtlicher etwa: „Sehne dich nicht nach der Nacht, zum Hinaufsteigen von Völkern unter ihnen.“ Der hebräische Wortlaut ist schwierig; „von ihrem Ort weggenommen werden“ gibt eine verbreitete Deutung im Zusammenhang wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁאַף
  choice: Sehne dich nicht
  rationale: אַל mit dem Imperfekt drückt ein Verbot aus. שׁאף bezeichnet hier ein starkes Verlangen; „sich sehnen nach“ gibt dies im Deutschen natürlich wieder.
- source_word: הַלָּיְלָה
  choice: nach der Nacht
  rationale: Das bestimmte Substantiv ist das Objekt des Verlangens; die von „sich sehnen“ geforderte Präposition wird im Deutschen ergänzt.
- source_word: לַעֲלוֹת
  choice: in der … weggenommen werden
  rationale: Der Infinitiv von עלה bedeutet wörtlich „hinaufgehen/hinaufsteigen“, ist hier aber schwer verständlich. Die kontextuelle Wiedergabe als zeitliche Entfernung ergibt einen sinnvollen Haupttext, während die Fußnote den ungewöhnlichen Wortlaut offenlegt.
- source_word: עַמִּים
  choice: Völker
  rationale: Der Plural bezeichnet kollektive Menschengruppen; „Völker“ bewahrt den korporativen und pluralischen Sinn.
- source_word: תַּחְתָּם
  choice: von ihrem Ort
  rationale: תחת mit Suffix bedeutet wörtlich „unter ihnen“, kann in diesem schwierigen Zusammenhang jedoch auf ihren Ort oder ihre Stelle weisen. „Von ihrem Ort“ entspricht der wahrscheinlichen kontextuellen Aussage.
