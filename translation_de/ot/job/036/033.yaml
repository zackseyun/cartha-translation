source:
  edition: WLC
  text: יַגִּ֣יד עָלָ֣י/ו רֵע֑/וֹ מִ֝קְנֶ֗ה אַ֣ף עַל עוֹלֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/033.yaml
  text: Its thunder declares concerning him[a]; the cattle also[b], concerning what is rising.
translation:
  language: de
  text: Sein Donner kündet von ihm[a], auch das Vieh von dem, was heraufzieht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text ist schwierig. Statt „sein Donner“ lässt sich die Form wörtlich auch als „sein Freund“ verstehen; im Zusammenhang wird sie häufig auf das Geräusch des Sturms bezogen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Auch das Vieh kündet von dem heraufziehenden Sturm.“ Im Zusammenhang ist wohl ein nahender Sturm gemeint; im Hebräischen steht jedoch nur „was heraufzieht“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַגִּיד
  choice: kündet
  rationale: Das Hifil von נגד bedeutet „mitteilen, verkünden, bekannt machen“. „Kündet“ wahrt den gehobenen poetischen Ton und lässt sich in der zweiten Vershälfte sinnvoll ergänzen.
- source_word: עָלָיו
  choice: von ihm
  rationale: על mit Pronominalsuffix kann hier „über ihn/von ihm“ bedeuten. Die Wiedergabe lässt offen, worauf sich das Pronomen bezieht.
- source_word: רֵעוֹ
  choice: sein Donner
  rationale: Die Form ist in diesem schwierigen Vers umstritten. Im Zusammenhang der Sturmrede liegt eine Bezeichnung für das dröhnende Geräusch beziehungsweise den Donner nahe; die formal naheliegende Lesart „sein Freund“ wird in der Fußnote genannt.
- source_word: מִקְנֶה
  choice: das Vieh
  rationale: Das Substantiv bezeichnet gewöhnlich Vieh oder Viehbestand. Im Wetterkontext passt die Vorstellung, dass Tiere einen heraufziehenden Sturm wahrnehmen.
- source_word: אַף
  choice: auch
  rationale: 'Die Partikel erweitert die Aussage: Nicht nur der Donner, auch das Vieh kündet davon.'
- source_word: עַל
  choice: von
  rationale: Die Präposition wird parallel zur ersten Vershälfte neutral wiedergegeben, ohne ein genaueres Verhältnis festzulegen.
- source_word: עוֹלֶה
  choice: was heraufzieht
  rationale: Das Qal-Partizip von עלה bezeichnet etwas Aufsteigendes oder Heraufziehendes. Da das Bezugswort unausgesprochen bleibt, wird es nicht ausdrücklich als Sturm bezeichnet.
theological_decisions:
- issue: Bezug der Pronomen und Identität des Heraufziehenden
  choice: Die Pronomen und das substantivierte Partizip bleiben in der Übersetzung unbestimmt.
  alternative: Den Vers ausdrücklich auf Gott oder auf einen heraufziehenden Sturm beziehen.
  rationale: Der hebräische Wortlaut ist knapp und mehrdeutig; der Sturmkontext legt Deutungen nahe, entscheidet die Bezüge aber nicht eindeutig.
translation_notes:
  register: Moderne, würdige poetische Sprache. „Kündet“ ist bewusst leicht gehoben, aber verständlich; die knappe Ellipse der zweiten Vershälfte bildet die Dichte des hebräischen Verses nach.
