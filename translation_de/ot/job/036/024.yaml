  text: Remember that you should magnify his work[a], of which men have sung.
translation:
  language: de
  text: Denk daran, sein Werk hoch zu rühmen, das Menschen besungen haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Menschen geschaut haben“ beziehungsweise „das Menschen betrachtet haben“. Das hebräische Verb שֹׁרְרוּ ist schwierig; manche verstehen es hier im Sinn des Sehens statt des Singens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Denk daran
  rationale: Der Imperativ fordert unmittelbar dazu auf, etwas im Gedächtnis zu behalten und entsprechend zu beachten. „Denk daran“ ist im heutigen Deutsch natürlich und wahrt den auffordernden Charakter.
- source_word: כִּי
  choice: daran, … zu
  rationale: כִּי leitet hier den Inhalt dessen ein, woran der Angesprochene denken soll. Die deutsche Infinitivkonstruktion gibt diesen Zusammenhang idiomatisch wieder.
- source_word: תַשְׂגִּיא
  choice: hoch zu rühmen
  rationale: Die Hifil-Form von שׂגא bezeichnet ein Großmachen oder Erheben. Bei Gottes Werk ist „hoch rühmen“ eine natürliche deutsche Wiedergabe, die den auffordernden Sinn bewahrt, ohne nahezulegen, der Mensch mache das Werk selbst größer.
- source_word: פָעֳלוֹ
  choice: sein Werk
  rationale: פֹּעַל kann Werk, Tat oder Wirken bezeichnen. „Sein Werk“ bleibt bewusst weit und bewahrt den pronominalen Bezug des Hebräischen.
- source_word: אֲשֶׁר
  choice: das
  rationale: Das Relativpronomen verbindet „sein Werk“ mit dem folgenden Satz und wird im Deutschen natürlich mit „das“ wiedergegeben.
- source_word: שֹׁרְרוּ
  choice: besungen haben
  rationale: Die schwierige poetische Form wird traditionell im Sinn von Singen oder rühmendem Besingen verstanden. Abweichende Deutungen als Schauen oder Betrachten werden in der Fußnote erhalten.
- source_word: אֲנָשִׁים
  choice: Menschen
  rationale: אֲנָשִׁים bezeichnet hier Menschen allgemein. „Menschen“ gibt den generischen Bezug im modernen Deutsch präzise wieder, ohne die Aussage auf männliche Personen zu beschränken.
theological_decisions:
- issue: Bezugswort des Suffixes der 3. Person Singular in פָעֳלוֹ
  choice: „sein Werk“, im Kontext Gottes Werk
  alternative: „Gottes Werk“ ausdrücklich zu nennen
  rationale: Der Kontext macht Gott zum naheliegenden Bezug, doch die Übersetzung behält wie der hebräische Text das Pronomen bei und vermeidet eine unnötige Explizierung.
- issue: Bedeutung von שֹׁרְרוּ
  choice: „besungen haben“
  alternative: „geschaut haben“ oder „betrachtet haben“
  rationale: Die traditionelle Deutung als Singen passt zum Aufruf, Gottes Werk zu rühmen. Da die hebräische Form lexikalisch schwierig ist und auch mit dem Sehen verbunden wurde, bleibt diese echte Unsicherheit in der Fußnote sichtbar.
- issue: Generischer Personenbezug von אֲנָשִׁים
  choice: „Menschen“
  alternative: „Männer“
  rationale: Im Zusammenhang bezeichnet der maskuline Plural Menschen als allgemeine Gruppe. Das moderne deutsche „Menschen“ vermittelt diese Reichweite ohne eine sachlich nicht verlangte Beschränkung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular wird mit „Denk daran“ wiedergegeben. „Hoch rühmen“ bewahrt den poetischen und ehrfürchtigen Ton, während die schwierige Lesart des Schlussverbs nicht im Haupttext geglättet, sondern in einer Fußnote offengelegt wird.
