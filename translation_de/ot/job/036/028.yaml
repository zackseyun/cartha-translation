  text: אֲשֶֽׁר יִזְּל֥וּ שְׁחָקִ֑ים יִ֝רְעֲפ֗וּ עֲלֵ֤י אָדָ֬ם רָֽב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/028.yaml
  text: which the clouds pour down[a]; they drip abundantly on man.
translation:
  language: de
  text: die die Wolken herabströmen lassen; sie träufeln reichlich[a] auf die Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf viele Menschen“. Das hebräische Wort für „reichlich/viel“ kann entweder die Menge des Regens oder die Zahl der Menschen bezeichnen.'
    reason: syntaktische und lexikalische Alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen führt den Gedanken des vorhergehenden Verses fort und bezieht sich auf die dort genannten Wassertropfen.
- source_word: יִזְּלוּ
  choice: herabströmen lassen
  rationale: נזל bezeichnet fließende Bewegung; mit den Wolken als grammatischem Subjekt gibt die kausative deutsche Wendung zugleich die Abwärtsrichtung des Regens wieder.
- source_word: שְׁחָקִים
  choice: die Wolken
  rationale: Im unmittelbaren Zusammenhang mit der Entstehung und dem Niedergehen des Regens bezeichnet das poetische Wort die Wolken beziehungsweise die wolkigen Höhen.
- source_word: יִרְעֲפוּ
  choice: sie träufeln
  rationale: רָעַף bezeichnet das Herabfallenlassen oder Herabträufeln von Tropfen. „Träufeln“ bewahrt das poetische Bild, ohne die Stärke des Regens unnötig zu steigern.
- source_word: עֲלֵי
  choice: auf
  rationale: Die Präposition beschreibt hier die Bewegung des Regens auf die darunter befindlichen Menschen zu.
- source_word: אָדָם
  choice: die Menschen
  rationale: Der hebräische Singular אָדָם ist hier kollektiv und bezeichnet die Menschheit beziehungsweise Menschen allgemein. Der deutsche Plural gibt diesen generischen Sinn natürlich und ohne Beschränkung auf männliche Personen wieder.
- source_word: רָב
  choice: reichlich
  rationale: רָב kann hier adverbial die Fülle des herabträufelnden Regens bezeichnen. Da es syntaktisch auch zu אָדָם gezogen werden kann, wird die Alternative in einer Fußnote bewahrt.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: die Menschen
  alternative: der Mensch / die Menschheit
  rationale: אָדָם bezeichnet an dieser Stelle nicht eindeutig einen einzelnen Mann, sondern Menschen allgemein. „Die Menschen“ ist im heutigen Deutsch die natürliche kollektive Wiedergabe und legt keine geschlechtliche Einschränkung nahe.
- issue: Syntaktische Zuordnung von רָב
  choice: reichlich, auf das Träufeln bezogen
  alternative: auf viele Menschen, mit רָב als Attribut zu אָדָם
  rationale: Beide Zuordnungen sind sprachlich möglich. Der Haupttext folgt der traditionellen adverbialen Auffassung, während die Fußnote die echte syntaktische Mehrdeutigkeit offenhält.
translation_notes:
  register: Poetisches, aber gegenwärtiges Standarddeutsch. Der Vers bleibt als Relativsatz bewusst mit dem vorhergehenden Vers verbunden. „Herabströmen“ und „träufeln“ bewahren die gestufte Wetterbildsprache des Hebräischen.
