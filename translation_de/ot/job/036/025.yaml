  text: All mankind has looked on it[b][a]; man gazes from afar.
translation:
  language: de
  text: Alle Menschen[b] haben es[a] gesehen; der Sterbliche blickt von fern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn“. Das hebräische Pronomen steht im maskulinen Singular und kann persönlich verstanden werden; im Zusammenhang ist jedoch eher Gottes zuvor genanntes Werk gemeint.'
    reason: alternative_reading
  - marker: b
    text: „Menschen“ und „der Sterbliche“ geben die beiden generischen hebräischen Bezeichnungen אָדָם und אֱנוֹשׁ wieder; die zweite kann besonders die Sterblichkeit und Begrenztheit des Menschen hervorheben.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָדָם
  choice: Alle Menschen
  rationale: כָּל mit אָדָם bezeichnet hier umfassend die Menschheit. „Alle Menschen“ gibt den generischen Sinn in natürlichem, heutigem Deutsch wieder.
- source_word: חָזוּ
  choice: haben … gesehen
  rationale: חזה bezeichnet das Sehen oder betrachtende Wahrnehmen. Das deutsche Perfekt entspricht der hebräischen abgeschlossenen Verbform und klingt hier natürlich.
- source_word: בּוֹ
  choice: es
  rationale: Das maskuline Singularsuffix bezieht sich im Zusammenhang am ehesten auf Gottes zuvor genanntes Werk. Da „Werk“ im Deutschen sächlich ist, lautet das entsprechende Pronomen „es“; der mögliche persönliche Bezug bleibt in einer Fußnote erhalten.
- source_word: אֱנוֹשׁ
  choice: ein Sterblicher
  rationale: אֱנוֹשׁ bezeichnet den Menschen häufig mit dem Beiklang seiner Sterblichkeit und Begrenztheit. „Ein Sterblicher“ bewahrt diese Nuance und den generischen Singular.
- source_word: יַבִּיט
  choice: betrachtet
  rationale: Die Hifil-Form von נבט bedeutet hinsehen, anschauen oder betrachten. „Betrachtet“ vermittelt ein bewusstes, anhaltendes Schauen und passt zum würdigen poetischen Stil.
- source_word: מֵרָחוֹק
  choice: aus der Ferne
  rationale: Die Wendung bezeichnet räumliche Distanz. „Aus der Ferne“ ist präzise, idiomatisch und poetisch angemessen.
theological_decisions:
- issue: Bezug des Pronomens בּוֹ
  choice: 'Unpersönlicher Bezug auf Gottes Werk: „es“'
  alternative: 'Persönlicher Bezug auf Gott: „ihn“'
  rationale: Der unmittelbare Zusammenhang spricht von Gottes Werk, das Menschen wahrnehmen. Das hebräische maskuline Singularpronomen lässt formal jedoch auch einen persönlichen Bezug zu; deshalb wird die Alternative nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger poetischer Satzführung. Der Parallelismus bleibt erhalten; die unterschiedlichen hebräischen Menschenbezeichnungen werden bewusst unterschieden.
