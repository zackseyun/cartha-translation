translation:
  language: de
  text: Dann macht er ihnen ihre Taten und ihre Vergehen bekannt und zeigt ihnen, dass sie sich überhoben haben[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dass sie sich stark gemacht haben“; im Zusammenhang ist wahrscheinlich gemeint, dass sie sich selbstherrlich erhoben haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: Dann macht er … bekannt
  rationale: Das Hifil von נגד bedeutet „mitteilen, kundtun, bekannt machen“. „Dann“ gibt das narrative Waw im Zusammenhang der Abfolge natürlich wieder.
- source_word: לָהֶם
  choice: ihnen
  rationale: Die Präposition mit Pronominalsuffix bezeichnet die Personen, denen etwas bekannt gemacht wird.
- source_word: פָּעֳלָם
  choice: ihre Taten
  rationale: פֹּעַל bezeichnet Werk, Tat oder Handeln; zusammen mit „Vergehen“ ist hier das moralisch bewertete Tun gemeint.
- source_word: וּפִשְׁעֵיהֶם
  choice: und ihre Vergehen
  rationale: פשע bezeichnet Übertretung beziehungsweise Auflehnung. „Vergehen“ ist im modernen Deutsch verständlich und bewahrt den moralischen Ernst, ohne eine bestimmte Form der Rebellion festzulegen.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier am natürlichsten den Inhalt dessen ein, was Gott ihnen bekannt macht. Eine kausale Wiedergabe mit „weil“ bleibt syntaktisch möglich, ist aber weniger wahrscheinlich.
- source_word: יִתְגַּבָּרוּ
  choice: sie sich überhoben haben
  rationale: Das Hitpael von גבר bedeutet wörtlich etwa „sich stark machen“ und bezeichnet im Kontext wahrscheinlich selbstherrliche Erhebung. „Sich überheben“ bewahrt dieses Bild und die negative moralische Nuance.
theological_decisions:
- issue: Moralische Bedeutung von יִתְגַּבָּרוּ
  choice: 'als selbstherrliche Erhebung wiedergegeben: „sie sich überhoben haben“'
  alternative: „sie stark geworden sind“ oder „sie die Oberhand gewonnen haben“
  rationale: Die Verbindung mit „ihren Vergehen“ legt eine ethische Aussage über Selbstüberhebung nahe. Die Fußnote bewahrt zugleich den wörtlicheren Sinn und damit die echte lexikalische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bekannt machen“ gibt den Offenbarungscharakter des Verbs klar wieder; „sich überheben“ ist gehoben, aber allgemein verständlich und näher am hebräischen Bild als eine reine Umschreibung mit „arrogant handeln“.
