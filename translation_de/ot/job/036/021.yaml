  text: הִ֭שָּׁמֶר אַל תֵּ֣פֶן אֶל אָ֑וֶן כִּֽי עַל זֶ֝֗ה בָּחַ֥רְתָּ מֵ/עֹֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/021.yaml
  text: Take care[a]; do not turn to iniquity[b], for you have chosen this rather than affliction.
translation:
  language: de
  text: Hüte dich! Wende dich nicht dem Unrecht zu[a], denn das hast du dem Leiden vorgezogen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Bösen“, „der Bosheit“ oder möglicherweise „dem Unheil“; das hebräische Wort אָוֶן hat sowohl ethische als auch leidensbezogene Bedeutungen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „denn dies hast du statt des Elends gewählt“. Das hebräische עֳנִי kann „Elend“, „Bedrängnis“ oder „Leiden“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Hüte dich!
  rationale: Der Nifal-Imperativ von שׁמר spricht eine eindringliche Warnung aus. „Hüte dich!“ ist im Deutschen knapp, natürlich und würdevoll.
- source_word: אַל תֵּפֶן
  choice: Wende dich nicht
  rationale: Die Verbindung aus אַל und dem Qal von פנה formuliert ein Verbot, sich einer Sache zuzuwenden. Die deutsche Wendung bewahrt das Richtungsbild.
- source_word: אֶל אָוֶן
  choice: dem Unrecht zu
  rationale: אָוֶן kann Unrecht, Bosheit, Böses oder auch Unheil bezeichnen. Im Zusammenhang der Mahnung ist die ethische Bedeutung wahrscheinlich; „Unrecht“ ist gegenwärtig und vermeidet das altertümlich klingende „Frevel“.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die vorausgehende Warnung; „denn“ gibt diesen Zusammenhang prägnant wieder.
- source_word: עַל זֶה
  choice: das
  rationale: Der Ausdruck weist auf das unmittelbar genannte Unrecht zurück. Im Deutschen ist das Demonstrativpronomen nach „vorgezogen“ idiomatisch.
- source_word: בָּחַרְתָּ
  choice: hast du … vorgezogen
  rationale: בחר bedeutet wählen; zusammen mit dem vergleichenden מִן lässt sich die gemeinte Bevorzugung im Deutschen natürlich mit „vorziehen“ ausdrücken. Das Perfekt wahrt die vollendete Handlung mit gegenwärtiger Relevanz.
- source_word: מֵעֹנִי
  choice: dem Leiden
  rationale: עֹנִי bezeichnet Bedrängnis, Elend oder Leiden. Im Kontext von Hiobs Erfahrung trifft „Leiden“ den Bezug natürlich; das präfigierte מִן markiert hier den Vergleich.
theological_decisions:
- issue: Vorwurf einer bewussten Wahl des Unrechts
  choice: Die Aussage wird als Elihus direkte Behauptung wiedergegeben, dass Hiob das Unrecht dem Leiden vorgezogen habe.
  alternative: Man könnte die Zeile allgemeiner als Warnung verstehen, Unrecht nicht anstelle des Leidens zu wählen.
  rationale: Die Perfektform בָּחַרְתָּ bezeichnet grammatisch eine bereits getroffene Wahl. Die Übersetzung bewahrt die Schärfe und Spannung von Elihus Vorwurf, ohne ihn als Erzählerurteil zu bestätigen oder abzuschwächen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit direkter Mahnrede. „Unrecht“ ist verständlicher und weniger altertümlich als „Frevel“. Die zweite Satzhälfte wird idiomatisch formuliert, während eine Fußnote die hebräische Vergleichskonstruktion und ihre mögliche Wiedergabe offenlegt.
