  verdict: revise
  source_fidelity: 'Die Hauptübersetzung gibt die hebräischen Imperative und die Vergleichsaussage sachgerecht wieder: הִשָּׁמֶר ist eine eindringliche Warnung, אַל־תֵּפֶן אֶל־אָוֶן verbietet die Hinwendung zum Unrecht, und בָּחַרְתָּ מֵעֳנִי bezeichnet eine dem Leiden/Elend vorgezogene Wahl. אָוֶן kann jedoch neben ethischem Unrecht auch Unheil/Bedrängnis bezeichnen; die Fußnote wahrt diese Breite angemessen. Die Aussage bleibt Elihus Rede und wird nicht als Erzählerurteil ausgegeben.'
  naturalness: „Hüte dich! Wende dich nicht dem Unrecht zu“ ist natürliches modernes Standarddeutsch und hat einen passenden gehobenen Mahnregister. „das hast du dem Leiden vorgezogen“ ist idiomatisch. Der Fußnotentext zu b sollte jedoch nicht als wörtliche Übersetzung bezeichnet werden, weil „mehr als Leiden gewählt“ die hebräische Konstruktion im Deutschen missverständlich und unnatürlich abbildet; außerdem sollte sein Anker unmittelbar bei „vorgezogen“ stehen.
  terminology: „Unrecht“ ist für die im Kontext naheliegende ethische Lesart von אָוֶן treffend und zeitgemäß. „Leiden“ gibt עֳנִי im Hiobskontext gut wieder. Die Alternativen „Böses“, „Bosheit“ und „Unheil“ sind als Fußnotenhinweis ausreichend; die leidensbezogene Möglichkeit sollte nicht als gleich sicher behandelt werden.
