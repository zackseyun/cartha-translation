    issue: Die als „Wörtlicher“ eingeführte Formulierung in Fußnote b ist keine klare oder natürliche Wiedergabe der hebräischen Vergleichskonstruktion.
    rationale: „Dies hast du mehr als Leiden gewählt“ kann im Deutschen quantitativ verstanden werden und verschleiert, dass מִן hier am plausibelsten die dem Leiden vorgezogene Alternative ausdrückt. Die textlich mögliche Formulierung „statt des Elends“ sollte als alternative Übersetzungsmöglichkeit, nicht als präzise wörtliche Fassung, ausgewiesen werden.
