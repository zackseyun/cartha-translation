  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי חֵ֭מָה פֶּן יְסִֽיתְ/ךָ֣ בְ/סָ֑פֶק וְ/רָב כֹּ֝֗פֶר אַל יַטֶּֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/018.yaml
  text: Because wrath—beware lest it entice you into scoffing[c][b][a], and do not let a great ransom turn you aside.
translation:
  language: de
  text: Denn der Zorn[a] – hüte dich, dass er dich nicht zum Hohn verführt[b]; und lass dich nicht durch ein hohes Lösegeld[c] abbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wessen Zorn gemeint ist, bleibt im Hebräischen offen; möglich sind unter anderem Gottes Zorn oder Hiobs eigener Zorn.
    reason: theological_ambiguity
  - marker: b
    text: 'Oder: „zum Händeklatschen“. Das hebräische Wort ist schwierig und kann das Schlagen beziehungsweise Klatschen der Hände bezeichnen, möglicherweise als Geste des Hohns.'
    reason: lexical_alternative
  - marker: c
    text: '„Lösegeld“ kann auch einen Sühnepreis oder, je nach Zusammenhang, Bestechungsgeld bezeichnen. Möglich ist auch: „Lass dich nicht von einem großen Lösegeld beeinflussen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die begründende beziehungsweise warnende Aussage ein und lässt die genaue syntaktische Verbindung mit dem Zusammenhang offen.
- source_word: חֵמָה
  choice: der Zorn
  rationale: Gibt die Intensität von חֵמָה wieder, ohne ausdrücklich festzulegen, wessen Zorn gemeint ist.
- source_word: פֶּן יְסִיתְךָ
  choice: hüte dich, dass er dich nicht … verführt
  rationale: פֶּן formuliert eine Warnung; der Hifil von סות bezeichnet Verleiten, Anstiften oder Irreführen.
- source_word: בְסָפֶק
  choice: zum Hohn
  rationale: Das seltene und schwierige Wort wird kontextuell als höhnische oder spöttische Reaktion verstanden; die möglicherweise wörtlichere Deutung als Händeklatschen steht in der Fußnote.
- source_word: רָב כֹּפֶר
  choice: ein hohes Lösegeld
  rationale: רָב bezeichnet hier die beträchtliche Höhe des כֹּפֶר; ‚Lösegeld‘ wahrt dessen Bedeutung als Preis zur Abwendung einer Folge, ohne vorschnell ‚Bestechungsgeld‘ festzulegen.
- source_word: אַל יַטֶּךָּ
  choice: lass dich nicht … abbringen
  rationale: Der Hifil von נטה bezeichnet ein Abwenden oder Abbringen; die deutsche Form bewahrt das Bild einer Abweichung, ohne ein im Hebräischen nicht genanntes Ziel zu ergänzen.
theological_decisions:
- issue: Bezug von חֵמָה („Zorn“)
  choice: Der Bezug bleibt unbestimmt.
  alternative: Gottes Zorn oder Hiobs eigener Zorn ausdrücklich benennen.
  rationale: Der hebräische Text nennt den Träger des Zorns nicht; eine Festlegung würde die echte Deutungsspannung auflösen.
- issue: Bedeutung und Funktion von כֹּפֶר
  choice: Lösegeld
  alternative: Sühnepreis oder Bestechungsgeld
  rationale: „Lösegeld“ bildet den weiteren Bedeutungsbereich ab und vermeidet eine unnötige dogmatische oder moralische Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich erhält den abrupten Warncharakter des hebräischen Satzes; die schwierige Wendung בְסָפֶק und der unbestimmte Bezug des Zorns werden nicht stillschweigend vereindeutigt.
