  text: עַל כַּפַּ֥יִם כִּסָּה א֑וֹר וַ/יְצַ֖ו עָלֶ֣י/הָ בְ/מַפְגִּֽיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/032.yaml
  text: He covers his hands with lightning[b][a], and commands it to strike the mark.
translation:
  language: de
  text: Er bedeckt seine Hände mit dem Blitz[a] und weist ihn an, sein Ziel zu treffen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Licht“; im Zusammenhang der Gewitterbilder ist wahrscheinlich ein Blitz gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte Ausdruck ist im Hebräischen schwer verständlich. Möglich sind auch: „gegen den, den er trifft“ oder „gegen den Fürbitter“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּפַּיִם
  choice: seine Hände
  rationale: Der Dual von כַּף bezeichnet beide Handflächen bzw. Hände. „Hände“ ist im Deutschen natürlich und bewahrt das körperhafte Bild.
- source_word: כִּסָּה
  choice: bedeckt
  rationale: כסה bedeutet „bedecken, verhüllen“. „Bedeckt“ gibt das konkrete Bild ohne zusätzliche Deutung wieder.
- source_word: אוֹר
  choice: Blitz
  rationale: אוֹר bedeutet gewöhnlich „Licht“, bezeichnet im Zusammenhang der umgebenden Gewitterbilder aber wahrscheinlich den Blitz.
- source_word: וַיְצַו
  choice: weist ... an
  rationale: צוה bedeutet „befehlen, anweisen“. Die Formulierung bewahrt Gottes persönliche Lenkung und klingt im Deutschen mit dem folgenden Infinitiv natürlich.
- source_word: עָלֶיהָ
  choice: ihn
  rationale: Das feminine Suffix bezieht sich vermutlich auf das als Blitz bzw. Blitzgeschehen verstandene אוֹר. Deutsch verlangt hier beim maskulinen „Blitz“ das Pronomen „ihn“; der schwierige Bezug wird nicht weiter ausgedeutet.
- source_word: בְמַפְגִּיעַ
  choice: sein Ziel zu treffen
  rationale: Die Form von פגע ist äußerst schwierig. Im Gewitterzusammenhang liegt eine Aussage über das gelenkte Treffen des Blitzes nahe; „sein Ziel zu treffen“ gibt diesen möglichen Sinn verständlich wieder.
theological_decisions:
- issue: Deutung von בְמַפְגִּיעַ
  choice: sein Ziel zu treffen
  alternative: gegen den, den er trifft; gegen den Fürbitter
  rationale: Der Gewitterkontext stützt die Zielvorstellung, doch die hebräische Form bleibt mehrdeutig. Eine mögliche Bedeutung „Fürbitter“ wird nicht in den Haupttext übernommen, da sie hier eine unnötige theologische Festlegung erzeugen könnte; die Alternativen werden in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Körpermetapher „seine Hände“ bleibt erhalten; die unsichere Schlusswendung wird im Haupttext verständlich wiedergegeben und in der Fußnote als mehrdeutig ausgewiesen.
