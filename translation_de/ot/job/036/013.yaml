base_translation:
  language: en
  yaml_path: translation/ot/job/036/013.yaml
  text: But the godless in heart store up anger[b][a]; they do not cry for help when he binds them.
translation:
  language: de
  text: Doch die Gottlosen im Herzen hegen Zorn[a]; sie rufen nicht um Hilfe, wenn er sie bindet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Gottlosen im Herzen“ kann auch mit „die Heuchler im Herzen“ oder „die im Innersten Frevelhaften“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil er sie bindet“. Die hebräische Konjunktion kann statt temporal auch kausal verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַנְפֵי לֵב
  choice: Menschen, die im Herzen gottlos sind
  rationale: חנף bezeichnet hier Menschen, deren innere Haltung von Gottlosigkeit oder Frevel geprägt ist. Die Formulierung bewahrt den Bezug auf das Herz, klingt im modernen Deutschen aber natürlicher als „die Gottlosen des Herzens“.
- source_word: יָשִׂימוּ אָף
  choice: häufen Zorn an
  rationale: Die wörtliche Wendung „Zorn setzen“ wäre im Deutschen unverständlich. „Zorn anhäufen“ erhält das Bild eines angesammelten oder festgehaltenen Zorns; der Zorn wird dabei als Zorn der handelnden Menschen verstanden.
- source_word: לֹא יְשַׁוְּעוּ
  choice: sie schreien nicht um Hilfe
  rationale: Das Piel von שׁוע bezeichnet einen Hilferuf. Die Wiedergabe ist präzise und im Deutschen idiomatisch.
- source_word: כִּי
  choice: wenn
  rationale: 'כִּי kann hier temporal verstanden werden: Sie rufen in dem Augenblick ihrer Fesselung oder Bedrängnis nicht um Hilfe. Die ebenfalls mögliche kausale Lesart wird in einer Fußnote bewahrt.'
- source_word: אֲסָרָם
  choice: er sie bindet
  rationale: אָסַר bedeutet binden, fesseln oder gefangen setzen. „Bindet“ bleibt semantisch offen und gibt das singularische Subjekt als Pronomen wieder; aus dem Zusammenhang ist Gott gemeint.
theological_decisions:
- issue: Bezug des unausgesprochenen singularischen Subjekts bei אֲסָרָם
  choice: Das Subjekt wird mit „er“ wiedergegeben und verweist im Zusammenhang auf Gott.
  alternative: Das Subjekt ausdrücklich als „Gott“ benennen.
  rationale: Der hebräische Text enthält ein Verb in der dritten Person Singular, nennt das Subjekt an dieser Stelle jedoch nicht ausdrücklich. Das Pronomen wahrt diese Form und lässt den kontextuellen Bezug bestehen.
- issue: Zuordnung des Zorns in יָשִׂימוּ אָף
  choice: Der Zorn wird als von den gottlosen Menschen angesammelter Zorn verstanden.
  alternative: Die Wendung auf den göttlichen Zorn beziehen, den sie gegen sich aufhäufen.
  rationale: Die Gottlosen sind das grammatische Subjekt von „setzen/anhäufen“. Daher liegt zunächst nahe, dass sie selbst Zorn in sich tragen; eine ausdrückliche Ergänzung wie „Gottes Zorn“ wäre im Ausgangstext nicht vorhanden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt knapp und poetisch; unnötige theologische Explizierungen werden vermieden.
