id: JOB.36.30
reference: Job 36:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵן פָּרַ֣שׂ עָלָ֣י/ו אוֹר֑/וֹ וְ/שָׁרְשֵׁ֖י הַ/יָּ֣ם כִּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/030.yaml
  text: Behold[a], he spreads his light over it[c][b], and he covers the roots of the sea.
translation:
  language: de
  text: Sieh, er breitet sein Licht[a] darüber aus[b] und bedeckt die Wurzeln des Meeres[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „seinen Blitz“ beziehungsweise „seinen Lichtglanz“.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich kann das hebräische Pronomen auch mit „über ihm“ wiedergegeben werden; worauf es sich bezieht, wird nicht ausdrücklich gesagt.
    reason: alternative_reading
  - marker: c
    text: Das Bild kann die tiefsten oder grundlegenden Bereiche des Meeres bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel hebt das folgende Bild hervor. „Sieh“ klingt im Deutschen würdig und poetisch, ohne unnötig altertümlich zu wirken.
- source_word: פָּרַשׂ
  choice: breitet … aus
  rationale: Das Verb bezeichnet das Ausbreiten oder Ausspannen. Die trennbare Wendung „breitet … aus“ gibt das Bild natürlich und präzise wieder.
- source_word: עָלָיו
  choice: darüber
  rationale: Das maskuline Singularsuffix hat im Vers keinen ausdrücklich genannten Bezug. „Darüber“ passt zum vorausgehenden Wolken- und Unwetterbild, ohne eine Person als Bezug festzulegen; die formale Mehrdeutigkeit wird in einer Fußnote offengehalten.
- source_word: אוֹרוֹ
  choice: sein Licht
  rationale: אוֹר bedeutet gewöhnlich „Licht“, kann im Unwetterzusammenhang aber auch Blitzlicht oder leuchtenden Glanz bezeichnen. Die allgemeinere Grundbedeutung bleibt im Haupttext erhalten.
- source_word: וְשָׁרְשֵׁי הַיָּם
  choice: und … die Wurzeln des Meeres
  rationale: Die wörtliche, kräftige Metapher „Wurzeln des Meeres“ wird bewahrt; gemeint sein können dessen tiefste oder grundlegende Bereiche.
- source_word: כִּסָּה
  choice: bedeckt
  rationale: Das Verb bedeutet unmittelbar „bedecken“. Das Präsens entspricht der anschaulichen poetischen Beschreibung.
theological_decisions:
- issue: Unbestimmter Bezug des Pronomens in עָלָיו
  choice: Unpersönliche Wiedergabe mit „darüber“
  alternative: „über ihm“ oder, auf Gott rückbezogen, „über sich“
  rationale: Der hebräische Text nennt den Bezug nicht ausdrücklich. Der Haupttext folgt dem Wolken- und Unwetterzusammenhang, während die Fußnote die grammatisch mögliche personale Deutung bewahrt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper poetischer Satzführung. Die konkrete Bildsprache des Hebräischen bleibt erhalten; nicht ausdrücklich aufgelöste Mehrdeutigkeiten werden in den Fußnoten kenntlich gemacht.
