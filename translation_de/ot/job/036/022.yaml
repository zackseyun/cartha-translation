  variant: modern standard German
source:
  edition: WLC
  text: הֶן אֵ֭ל יַשְׂגִּ֣יב בְּ/כֹח֑/וֹ מִ֖י כָמֹ֣/הוּ מוֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/022.yaml
  text: Behold[a], God is exalted in his power[b]; who is a teacher like him?
translation:
  language: de
  text: Sieh, Gott ist erhaben in seiner Kraft[a]; wer ist ein Lehrer wie er?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch seine Kraft“ beziehungsweise „mit seiner Macht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wer ist wie er als Lehrer?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel leitet die Aussage nachdrücklich ein. „Sieh“ ist im heutigen gehobenen Deutsch verständlich und bewahrt den poetischen Aufforderungscharakter.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier eine allgemeine Gottesbezeichnung und wird im Deutschen natürlich mit „Gott“ wiedergegeben.
- source_word: יַשְׂגִּיב
  choice: ist erhaben
  rationale: Das Hifil von שׂגב bezeichnet hier Hoheit beziehungsweise erhabene Größe. „Ist erhaben“ wahrt die knappe poetische Aussage, ohne die mögliche Nuance unnötig zu verengen.
- source_word: בְּכֹחוֹ
  choice: in seiner Kraft
  rationale: Die Präposition ב kann die Sphäre, Art und Weise oder das Mittel bezeichnen. „In seiner Kraft“ erhält diese Offenheit weitgehend.
- source_word: מִי כָמֹהוּ
  choice: wer ist ... wie er?
  rationale: Die rhetorische Vergleichsfrage drückt Gottes Unvergleichlichkeit aus und lässt sich direkt und natürlich so wiedergeben.
- source_word: מוֹרֶה
  choice: ein Lehrer
  rationale: Das Partizip von ירה bezeichnet hier den Lehrenden. „Lehrer“ ist knapp, verständlich und entspricht der substantivischen Funktion.
theological_decisions:
- issue: Verhältnis von Gottes Erhabenheit zu seiner Kraft
  choice: Gott ist in seiner Kraft erhaben.
  alternative: Gott erweist sich durch seine Kraft als erhaben; Gott handelt machtvoll.
  rationale: Der Text verbindet Gottes Erhabenheit mit seiner Kraft, ohne das genaue Verhältnis eindeutig festzulegen. Die Formulierung bewahrt diese Spannung und vermeidet eine weitergehende dogmatische Festlegung.
- issue: Syntax der abschließenden Vergleichsfrage
  choice: Wer ist ein Lehrer wie er?
  alternative: Wer ist wie er als Lehrer?
  rationale: Beide Analysen vermitteln Gottes Unvergleichlichkeit als Lehrender. Die Hauptfassung ist natürliches Deutsch; die alternative Akzentsetzung wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. „Sieh“ wahrt den aufmerksamkeitslenkenden Auftakt; „erhaben“ und „Kraft“ erhalten den gehobenen Ton, ohne altertümlich zu wirken.
