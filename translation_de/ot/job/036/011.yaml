  text: אִֽם יִשְׁמְע֗וּ וְֽ/יַ֫עֲבֹ֥דוּ יְכַלּ֣וּ יְמֵי/הֶ֣ם בַּ/טּ֑וֹב וּ֝/שְׁנֵי/הֶ֗ם בַּ/נְּעִימִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/011.yaml
  text: If they listen and serve[b][a], they will complete their days in prosperity and their years in pleasantness.
translation:
  language: de
  text: Wenn sie hören[a] und dienen, verbringen sie ihre Tage im Wohlergehen[b] und ihre Jahre in Freuden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gehorchen“; das hebräische Verb kann ein Hören bezeichnen, das zur Befolgung führt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „im Guten“ und „in angenehmen Dingen“; auch: „in Annehmlichkeiten“ oder „in Freuden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet einen realen Bedingungssatz ein und bewahrt Elihus Aussage als konditionale Behauptung.
- source_word: יִשְׁמְעוּ
  choice: sie hören
  rationale: שׁמע kann hören, zuhören oder gehorchen bedeuten. „Hören“ bewahrt die Grundbedeutung und lässt das im Zusammenhang anklingende gehorsame Hören offen.
- source_word: וְיַעֲבֹדוּ
  choice: und dienen
  rationale: עבד bezeichnet hier am breitesten den Dienst; „dienen“ verengt die Aussage weder auf kultische Anbetung noch auf bloße Arbeit.
- source_word: יְכַלּוּ
  choice: vollenden sie
  rationale: Das Piel von כלה kann „vollenden, zu Ende bringen“ bedeuten. Mit Tagen und Jahren bezeichnet es das Durchleben der Lebenszeit und erhält zugleich die bildhafte Ausdrucksweise.
- source_word: בַּטּוֹב
  choice: im Wohlergehen
  rationale: Das substantivierte טוֹב bezeichnet günstige, gute Lebensumstände. „Wohlergehen“ ist natürlich und weniger einseitig materiell als „Wohlstand“.
- source_word: בַּנְּעִימִים
  choice: in angenehmer Fülle
  rationale: Der substantivierte Plural von נעים kann angenehme Dinge oder Annehmlichkeiten bezeichnen. Die Formulierung gibt den positiven Lebenszustand idiomatisch wieder, ohne ihn auf einzelne Genüsse festzulegen.
theological_decisions:
- issue: Ob der Vers materiellen Wohlstand als ausnahmsloses theologisches Prinzip verheißt
  choice: Die bedingte Aussage Elihus wird ohne dogmatische Erweiterung wiedergegeben.
  alternative: Die Aussage als allgemeingültige Garantie irdischen Wohlstands oder ausschließlich als geistlichen Segen zu deuten.
  rationale: Der hebräische Text formuliert Elihus weisheitliche Behauptung über günstige Lebensumstände. Die Übersetzung soll sie weder universalisieren noch spiritualisieren.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewahrtem poetischem Parallelismus. „Wohlergehen“ vermeidet eine unnötige Verengung auf materiellen Reichtum; „angenehme Fülle“ hält den ungewöhnlichen substantivierten Plural lesbar fest.
