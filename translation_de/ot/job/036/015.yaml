base_translation:
  language: en
  yaml_path: translation/ot/job/036/015.yaml
  text: He rescues the afflicted by their affliction[b][a], and opens their ears by oppression.
translation:
  language: de
  text: Den Elenden rettet er durch sein Elend[a], und durch Bedrängnis öffnet er ihnen die Ohren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Den Armen rettet er in seinem Elend.“ Die hebräischen Wörter können Armut, Elend, Bedrängnis oder Unterdrückung hervorheben; die Präposition kann „durch“ oder „in“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „deckt ihnen die Ohren auf“. Die hebräische Wendung meint, jemanden zum Hören beziehungsweise zum Annehmen von Unterweisung zu bringen.'
    reason: cultural_note
lexical_decisions:
- source_word: יְחַלֵּץ
  choice: rettet
  rationale: Das Piel von חלץ bezeichnet hier das Herausziehen beziehungsweise Retten aus Gefahr. „rettet“ ist gegenwärtiges, klares Deutsch und bewahrt den aktiven Rettungssinn.
- source_word: עָנִי
  choice: den Elenden
  rationale: עָנִי kann einen Armen, Gebeugten oder Bedrängten bezeichnen. Im Parallelismus mit עָנְיוֹ und לַחַץ steht hier das durch Leiden geprägte Elend im Vordergrund, ohne wirtschaftliche Armut auszuschließen.
- source_word: בְעָנְיוֹ
  choice: durch sein Elend
  rationale: Die Präposition בְּ kann instrumental oder umstandsbezogen verstanden werden. „durch“ gibt die wahrscheinlich instrumentale Aussage wieder; das Singularpronomen wahrt die grammatische Spannung zwischen dem generischen Singular עָנִי und dem späteren Pluralsuffix.
- source_word: וְיִגֶל
  choice: öffnet
  rationale: גלה bedeutet wörtlich „aufdecken/enthüllen“. Mit „Ohr“ als Objekt liegt die hebräische Wendung für das Öffnen zum Hören beziehungsweise zur Unterweisung vor.
- source_word: בַּלַּחַץ
  choice: durch Bedrängnis
  rationale: לַחַץ bezeichnet Druck, Bedrängnis oder Unterdrückung. „Bedrängnis“ passt sowohl zum persönlichen Leiden als auch zum instrumentalen בְּ und ist im Deutschen idiomatischer als „durch Unterdrückung“, ohne die Härte abzuschwächen.
- source_word: אָזְנָם
  choice: ihnen das Ohr
  rationale: Das Suffix ist 3. Person maskulin Plural. Die idiomatische deutsche Einzahl „das Ohr“ bezeichnet bei mehreren Personen jeweils das Hörvermögen; „ihnen“ bewahrt ausdrücklich den Plural des Hebräischen.
theological_decisions:
- issue: Leiden als Mittel göttlicher Rettung und Unterweisung
  choice: Die beiden בְּ-Fügungen werden instrumental mit „durch“ wiedergegeben.
  alternative: „in seinem Elend ... in der Bedrängnis“, wobei das Leiden nur als Situation der Rettung und Unterweisung erscheint.
  rationale: Der Parallelismus legt eine instrumentale Bedeutung nahe. Die Übersetzung lässt Elihus spannungsreiche Behauptung stehen, ohne daraus abzuleiten, jedes Leiden sei an sich gut, stets Strafe oder in jedem Fall auf dieselbe Weise heilsam.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „der Elende“ ist leicht gehoben, aber verständlich und bildet die Mehrdeutigkeit zwischen Armut und Bedrängnis besser ab als eine rein wirtschaftliche Bezeichnung. Die Satzstellung folgt dem poetischen Parallelismus.
