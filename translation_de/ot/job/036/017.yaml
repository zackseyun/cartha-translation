  text: Doch du bist erfüllt vom Urteil des Frevlers[a]; Urteil und Recht ergreifen dich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch du bist erfüllt vom Urteil über den Frevler.“ Das knappe Hebräisch kann das Urteil eines Frevlers, ein Urteil über den Frevler oder eine für Frevler kennzeichnende Art des Urteilens meinen.'
