lexical_decisions:
- source_word: וְדִין רָשָׁע מָלֵאתָ
  choice: Doch du bist erfüllt vom Urteil über den Frevler
  rationale: Die adversative Wiedergabe von וְ passt zum Zusammenhang. Die gedrängte Wortfolge wird als Urteil verstanden, das den Frevler betrifft; „erfüllt“ bewahrt das Bild von מלא.
- source_word: דִּין
  choice: Urteil
  rationale: „Urteil“ gibt den forensischen Sinn wieder und bewahrt die Wiederholung im zweiten Halbvers.
- source_word: רָשָׁע
  choice: der Frevler
  rationale: Das substantivierte Singularadjektiv bezeichnet allgemein den schuldigen bzw. gottlosen Menschen; „Frevler“ ist im poetisch-biblischen Register prägnant.
- source_word: וּמִשְׁפָּט
  choice: und Recht
  rationale: „Recht“ hält die Bedeutungsnähe zu דִּין fest, ohne beide Begriffe gleich wiederzugeben.
- source_word: יִתְמֹכוּ
  choice: ergreifen dich
  rationale: תמך kann stützen, festhalten oder ergreifen bedeuten. Im negativen Kontext ist „ergreifen dich“ natürlich; das im Hebräischen nicht ausgesprochene Objekt wird aus der Anrede ergänzt, während die Alternative in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Bezug von דִּין רָשָׁע
  choice: das Urteil über den Frevler
  alternative: das Urteil des Frevlers / die Art von Urteil, die den Frevler kennzeichnet
  rationale: Die hebräische Genitivverbindung ist gedrängt und lässt offen, ob der Frevler Objekt, Träger oder Kennzeichen des Urteils ist. Der Haupttext folgt der im Kontext naheliegenden Strafgericht-Lesart; die echte Mehrdeutigkeit wird angemerkt.
- issue: Bedeutung und Objekt von יִתְמֹכוּ
  choice: Urteil und Recht ergreifen dich
  alternative: Urteil und Recht stützen dich / halten fest
  rationale: Das Verb steht ohne ausdrückliches Objekt und kann sowohl stützendes als auch festhaltendes Ergreifen bezeichnen. Der Kontext legt eine belastende Wirkung nahe, doch die positive bzw. neutralere Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Syntax. „Frevler“ wahrt den gehobenen Weisheitsliteratur-Ton, ohne eine konfessionelle Sonderdeutung einzutragen.
