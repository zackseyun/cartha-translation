source:
  edition: WLC
  text: אֶשָּׂ֣א דֵ֭עִ/י לְ/מֵ/רָח֑וֹק וּ֝/לְ/פֹעֲלִ֗/י אֶֽתֵּֽן צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/003.yaml
  text: I will bring my knowledge from afar[b][a], and to my Maker I will ascribe righteousness.
translation:
  language: de
  text: Ich hole mein Wissen aus der Ferne[a] und spreche meinem Schöpfer Gerechtigkeit zu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich trage mein Wissen weithin.«'
    reason: Die Verbindung aus נשׂא und לְמֵרָחוֹק kann neben dem Herbeiholen aus weiter Ferne auch als weitreichendes Vortragen verstanden werden.
  - marker: b
    text: 'Oder: »und gebe meinem Schöpfer recht.«'
    reason: צֶדֶק kann »Gerechtigkeit« oder »das Rechte« bezeichnen; נתן lässt sich in dieser Verbindung auch idiomatisch mit »recht geben« wiedergeben.
lexical_decisions:
- source_word: אֶשָּׂא
  choice: ich hole
  rationale: נשׂא bedeutet grundsätzlich »heben, tragen, bringen«. Zusammen mit »mein Wissen« und »aus der Ferne« gibt »holen« im Deutschen die Vorstellung wieder, Wissen aus weiter Ferne herbeizubringen.
- source_word: דֵעִי
  choice: mein Wissen
  rationale: Die Form bezeichnet das Wissen bzw. die Erkenntnis des Sprechers. »Mein Wissen« ist direkt, verständlich und weniger subjektiv als »meine Meinung«.
- source_word: לְמֵרָחוֹק
  choice: aus der Ferne
  rationale: Die Präpositionalverbindung bezeichnet hier im Zusammenspiel mit נשׂא am ehesten den fernen Ausgangspunkt, aus dem das Wissen herbeigeholt wird. Die mögliche Nuance »weithin« bleibt in der Fußnote erhalten.
- source_word: וּלְפֹעֲלִי
  choice: meinem Schöpfer
  rationale: Das Partizip פֹעֵל bezeichnet den Handelnden oder Hervorbringenden; mit dem Suffix der ersten Person ist im Kontext Gott als derjenige gemeint, der den Sprecher geschaffen hat. »Mein Schöpfer« ist natürlich und würdevoll.
- source_word: אֶתֵּן
  choice: spreche … zu
  rationale: נתן heißt wörtlich »geben«. Mit »Gerechtigkeit« als Objekt und dem Schöpfer als Empfänger bezeichnet es hier idiomatisch das Zuerkennen oder Zuschreiben von Gerechtigkeit.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: צדק umfasst sowohl Gerechtigkeit als auch sittliche Richtigkeit. Das deutsche »Gerechtigkeit« bewahrt hier den Bezug auf Gottes gerechtes Wesen und Handeln; »Recht« ist als Alternative vermerkt.
theological_decisions:
- issue: Bedeutung von צֶדֶק in Bezug auf Gott
  choice: Gerechtigkeit
  alternative: Recht / Richtigkeit
  rationale: Der Ausdruck kann Gottes moralische Richtigkeit und seine gerechte Rechtsprechung bezeichnen. »Gerechtigkeit« hält beide Aspekte eher zusammen, ohne die Aussage auf einen einzelnen dogmatischen Sinn festzulegen.
- issue: Funktion von אֶתֵּן gegenüber dem Schöpfer
  choice: Gerechtigkeit zusprechen
  alternative: Gerechtigkeit zuschreiben / Recht geben
  rationale: Die Formulierung beschreibt Elihus erklärtes Urteil über Gott und nicht die Verleihung einer Eigenschaft, die Gott zuvor fehlte. »Zusprechen« wahrt den deklarativen Charakter, ohne die theologische Spannung durch eine erklärende Paraphrase aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Bildsprache des Hebräischen bleibt erhalten, während »hole … aus der Ferne« und »spreche … zu« für heutige Leser verständlich formuliert sind.
