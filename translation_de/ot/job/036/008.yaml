lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt sowohl die verbindende Kraft von וְ als auch die Bedingungspartikel אִם und fügt sich natürlich in den fortlaufenden Gedankengang ein.
- source_word: אֲסוּרִים
  choice: sie ... gebunden sind
  rationale: Das passive Partizip von אסר wird verbal und passiv wiedergegeben, ohne es zum Substantiv „Gefangene“ umzudeuten.
- source_word: בַּזִּקִּים
  choice: in Fesseln
  rationale: „Fesseln“ bezeichnet die konkreten Zwangsmittel klar und idiomatisch; „Ketten“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: יִלָּכְדוּן
  choice: gefangen
  rationale: Die passive Bedeutung des Nifal von לכד wird in einer knappen, zur Parallelzeile passenden Form bewahrt.
- source_word: בְּחַבְלֵי
  choice: in Stricken des
  rationale: „Stricke“ erhält das konkrete Bild von Seilen oder Banden und führt die Fesselungsmetaphorik fort.
- source_word: עֹנִי
  choice: Elends
  rationale: עֹנִי kann Bedrängnis, Elend oder Armut bezeichnen. „Elend“ hält die Bedeutung breit und lässt offen, welche Form des Leidens gemeint ist.
theological_decisions:
- issue: Art der Bildsprache
  choice: Die konkrete Sprache körperlicher Fesselung bleibt erhalten und kann zugleich metaphorisch auf Leiden oder göttliche Zucht verweisen.
  alternative: Die Aussage ausschließlich als buchstäbliche Gefangenschaft oder ausschließlich als metaphorische Not wiederzugeben.
  rationale: Der Wortlaut ist konkret, doch der Zusammenhang handelt von Gottes Umgang mit Leidenden. Die Übersetzung legt sich nicht unnötig auf nur eine Ebene fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Bilder „Fesseln“ und „Stricke“ bleiben konkret; die Satzform bleibt wegen des anschließenden Verses bewusst offen.
