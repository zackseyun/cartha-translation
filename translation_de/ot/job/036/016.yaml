source:
  edition: WLC
  text: וְ/אַ֤ף הֲסִיתְ/ךָ֨ מִ/פִּי צָ֗ר רַ֭חַב לֹא מוּצָ֣ק תַּחְתֶּ֑י/הָ וְ/נַ֥חַת שֻׁ֝לְחָנְ/ךָ֗ מָ֣לֵא דָֽשֶׁן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/016.yaml
  text: Indeed[a], he lured you out of the mouth of distress into a broad place with no constraint beneath it[c][b], and the setting of your table was full of richness.
translation:
  language: de
  text: Ja, er lockte dich aus dem Rachen der Bedrängnis[a] in einen weiten Raum ohne Einengung unter sich[b]; und was auf deinem Tisch aufgetragen war, war voller reichhaltiger Speisen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus dem Mund der Bedrängnis“; auch möglich: „aus dem Rachen der Not“ oder „aus der Öffnung der Enge“. Das Hebräische verbindet Not mit räumlicher Enge.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „in die Weite, unter der keine Einengung ist“. Die hebräische Wendung ist schwierig; sie beschreibt wahrscheinlich einen weiten Ort ohne Beschränkung.'
    reason: textual_or_grammatical_difficulty
  - marker: c
    text: 'Wörtlich etwa: „und das auf deinem Tisch Aufgetragene war voll von Fett“. „Fett“ steht hier für reichhaltige Speise und Fülle; das seltene Wort für das Aufgetragene ist in seiner Bedeutung nicht völlig sicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: Ja
  rationale: Gibt die verstärkende und weiterführende Funktion der Wendung knapp und idiomatisch wieder.
- source_word: הֲסִיתְךָ
  choice: er lockte dich
  rationale: Das Hifil von סות/סית bezeichnet ein Locken oder Weglocken. Im Zusammenhang ist die Bewegung aus der Bedrängnis heraus positiv, ohne dass die sonst mögliche negative Färbung des Verbs verschwiegen wird.
- source_word: מִפִּי צָר
  choice: aus dem Rachen der Bedrängnis
  rationale: „Rachen“ bewahrt das konkrete Bild von פֶּה und klingt im Deutschen bei einer verschlingenden Not natürlicher als „Mund“. צַר bezeichnet Bedrängnis und kann zugleich räumliche Enge anklingen lassen.
- source_word: רַחַב
  choice: in einen weiten Raum
  rationale: Bewahrt den räumlichen Gegensatz zwischen Enge und Weite; die Zielrichtung „in“ ist aus dem Zusammenhang ergänzt.
- source_word: לֹא מוּצָק תַּחְתֶּיהָ
  choice: wo dich nichts einengt
  rationale: Die schwierige Wendung wird als Beschreibung eines Ortes ohne Beschränkung verstanden. Die idiomatische Formulierung macht den Gegensatz zur Bedrängnis deutlich; die wörtlichere räumliche Fassung steht in der Fußnote.
- source_word: וְנַחַת שֻׁלְחָנְךָ
  choice: und dein Tisch war … gedeckt
  rationale: נַחַת ist selten und in diesem Zusammenhang unsicher; wahrscheinlich ist das auf dem Tisch Hingestellte oder Aufgetragene gemeint. Die deutsche Formulierung gibt dieses Bild natürlich wieder.
- source_word: מָלֵא דָשֶׁן
  choice: mit üppigen Speisen
  rationale: דֶּשֶׁן bedeutet wörtlich „Fett/Fettigkeit“ und bezeichnet hier reichhaltige Kost beziehungsweise Fülle. „Üppige Speisen“ überträgt die damalige positive Wertung verständlich.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von הֲסִיתְךָ
  choice: Das Pronomen „er“ bleibt stehen; „Gott“ wird nicht in den Haupttext eingefügt.
  alternative: „Gott lockte dich“
  rationale: Der Zusammenhang legt Gott als Subjekt nahe, doch im hebräischen Vers selbst steht kein ausdrückliches Substantiv. Die Übersetzung wahrt diese formale Zurückhaltung.
- issue: Bildlicher Gegensatz zwischen Bedrängnis und Weite
  choice: Die Bilder von Rachen, Enge und weitem Raum bleiben erhalten.
  alternative: 'Abstrakt: „Er befreite dich aus der Not.“'
  rationale: Der poetische und theologisch bedeutsame Gegensatz von bedrängender Enge und geschenkter Weite soll nicht zu einer bloßen Erklärung verflacht werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Bildsprache. Unnatürliche Hebraismen werden im Haupttext behutsam geglättet und in den Fußnoten offengelegt.
