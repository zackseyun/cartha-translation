  text: כִּי בָ֭/ם יָדִ֣ין עַמִּ֑ים יִֽתֶּן אֹ֥כֶל לְ/מַכְבִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/031.yaml
  text: For by them he judges peoples; he gives food in abundance.
translation:
  language: de
  text: Denn durch sie richtet er Völker; er gibt Nahrung in Fülle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָם
  choice: durch sie
  rationale: Das pronominale בָם verweist auf die zuvor genannten Erscheinungen bzw. Mittel zurück. „Durch sie“ gibt den instrumentalen Sinn natürlich wieder, ohne den nicht ausdrücklich genannten Bezug festzulegen.
- source_word: יָדִין
  choice: richtet
  rationale: Das Verb דין bezeichnet hier Gottes richterisches Handeln an Völkern; das deutsche „richtet“ bewahrt sowohl den juristischen als auch den strafenden Bedeutungsbereich.
- source_word: עַמִּים
  choice: Völker
  rationale: Der Plural wird direkt und idiomatisch mit „Völker“ wiedergegeben.
- source_word: אֹכֶל
  choice: Nahrung
  rationale: „Nahrung“ ist im Kontext göttlicher Versorgung weiter und würdevoller als das umgangssprachlichere „Essen“.
- source_word: לְמַכְבִּיר
  choice: in Fülle
  rationale: Die seltene Bildung bezeichnet Überfluss bzw. reichliches Maß. „In Fülle“ ist knapp, natürlich und bewahrt diesen Sinn.
theological_decisions:
- issue: Dieselben Mittel dienen Gericht und Versorgung
  choice: 'Die parallelen Aussagen bleiben unverbunden nebeneinander stehen: Gott richtet durch sie Völker und gibt Nahrung in Fülle.'
  alternative: Den Gegensatz ausdrücklich mit „doch“ oder „zugleich“ markieren.
  rationale: Der hebräische Text lässt die theologische Spannung zwischen Gericht und Versorgung bestehen, ohne eine zusätzliche Konjunktion einzufügen.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch. Die unbestimmte Rückverweisung „sie“ bleibt erhalten, da der Vers seinen Bezug aus dem vorangehenden Kontext bezieht.
