  yaml_path: translation/ot/job/036/014.yaml
  text: They die in youth[a], and their life ends among the male cult prostitutes.
translation:
  language: de
  text: Sie sterben in jungen Jahren, und ihr Leben endet unter männlichen Kultprostituierten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Geweihten“. Der hebräische Ausdruck bezeichnet wahrscheinlich männliche Kultprostituierte, die mit heidnischem Gottesdienst verbunden waren.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּמֹת
  choice: sterben
  rationale: Das Qal-Imperfekt von מות bezeichnet hier den Tod. Im Deutschen wird wegen des pluralischen Bezugs der Suffixe idiomatisch der Plural verwendet.
- source_word: בַּנֹּעַר
  choice: in jungen Jahren
  rationale: נֹעַר bezeichnet Jugend beziehungsweise die frühe Lebenszeit. „In jungen Jahren“ ist natürliches, gegenwärtiges Deutsch.
- source_word: נַפְשָׁם
  choice: sie
  rationale: נֶפֶשׁ kann Seele, Leben oder Person bezeichnen. Hier ist es idiomatisch Subjekt von „sterben“; „ihre Seele stirbt“ wäre im Deutschen missverständlich und unnötig wörtlich.
- source_word: וְחַיָּתָם
  choice: und ihr Leben endet
  rationale: Das Nomen bezeichnet ihr Leben beziehungsweise ihre Lebenszeit. Das Prädikat „endet“ wird aus dem parallelen ersten Satzglied ergänzt, damit der deutsche Satz vollständig und verständlich ist.
- source_word: בַּקְּדֵשִׁים
  choice: unter männlichen Kultprostituierten
  rationale: קְדֵשִׁים bezeichnet im biblisch-hebräischen Sprachgebrauch wahrscheinlich Männer, die mit unerlaubten kultisch-sexuellen Praktiken verbunden waren. Die Wiedergabe wahrt das männliche Geschlecht und den kultischen Zusammenhang, ohne den traditionsbeladenen Ausdruck „Sodomiter“ zu verwenden.
theological_decisions:
- issue: Bedeutung von קְדֵשִׁים
  choice: männliche Kultprostituierte
  alternative: Geweihte; Tempelprostituierte
  rationale: Der Ausdruck bezeichnet hier wahrscheinlich männliche Personen in kultisch-sexuellem Zusammenhang und nicht allgemein heilige Menschen. Da die genaue institutionelle Funktion historisch nicht völlig sicher ist, wird die wörtlichere Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen Satzglieder bleiben knapp; das im zweiten Glied nicht ausdrücklich wiederholte Verb wird für einen vollständigen deutschen Satz sinngemäß ergänzt.
