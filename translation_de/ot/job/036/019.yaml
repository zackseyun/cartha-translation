  text: Will your cry avail when distress comes[b][a], or all the exertions of your strength?
translation:
  language: de
  text: Wird dein Hilferuf etwas ausrichten, wenn die Bedrängnis kommt,[a][b] oder werden all deine Kraftanstrengungen etwas ausrichten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Wortlaut dieses Verses ist schwierig, besonders bei den Ausdrücken, die hier mit „dein Hilferuf“ und „wenn die Bedrängnis kommt“ wiedergegeben sind.
    reason: lexical_alternative
  - marker: b
    text: 'Nach einer anderen Deutung des schwierigen Hebräischen: „Wird dein Reichtum ausreichen, damit du nicht in Bedrängnis gerätst, oder all deine Kraftanstrengungen?“'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיַעֲרֹךְ
  choice: Wird ... etwas ausrichten
  rationale: ערך bedeutet gewöhnlich „ordnen, aufstellen“; im vorliegenden schwierigen poetischen Zusammenhang liegt die übertragene Bedeutung „nützen, ausreichen, etwas ausrichten“ nahe. Die Formulierung bewahrt die rhetorische Frage.
- source_word: שׁוּעֲךָ
  choice: dein Hilferuf
  rationale: Die masoretische Vokalisierung weist auf שׁוע im Sinn eines Hilferufs oder Flehens. „Hilferuf“ ist im Deutschen natürlich und gibt die Notlage deutlicher wieder als das allgemeinere „Ruf“. Die Deutung als „Reichtum“ wird in Fußnote [b] erhalten.
- source_word: לֹא בְצָר
  choice: wenn die Bedrängnis kommt
  rationale: Die hebräische Wortverbindung ist schwierig, da לֹא normalerweise „nicht“ bedeutet und בְצָר „in Bedrängnis“. Im Zusammenhang wird sie häufig situationsbezogen verstanden. Die Übersetzung bietet einen kohärenten deutschen Sinn, ohne die abweichende, stärker wörtliche Deutung zu verschweigen.
- source_word: וְכֹל
  choice: oder aller
  rationale: 'Das ו verbindet in der rhetorischen Frage einen zweiten möglichen Behelf mit dem ersten. Im Deutschen bringt „oder“ die Aussage passend zum Ausdruck: Weder der Hilferuf noch der volle Krafteinsatz vermag zu helfen.'
- source_word: מַאֲמַצֵּי כֹחַ
  choice: aller Einsatz deiner Kraft
  rationale: Die Wendung verbindet Anstrengung beziehungsweise Aufbietung mit Kraft. „Einsatz deiner Kraft“ gibt beide Bestandteile in natürlichem, würdigem Deutsch wieder; „deiner“ ergibt sich aus der direkten Anrede und dem Parallelismus.
theological_decisions:
- issue: Mehrdeutigkeit der Aussage über das vermeintliche Hilfsmittel in der Not
  choice: Im Haupttext stehen „Hilferuf“ und eine situationsbezogene Wiedergabe von לֹא בְצָר.
  alternative: „Wird dein Reichtum ausreichen, damit du nicht in Bedrängnis gerätst, oder alle Kräfte deiner Stärke?“
  rationale: Die masoretische Vokalisierung stützt „Hilferuf“, doch der Vers ist sprachlich ungewöhnlich und lässt eine andere Deutung zu. Diese wird nicht dogmatisch ausgeschlossen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die knappe rhetorische Struktur des Hebräischen bleibt erhalten; sachlich notwendige Glättungen und die echte textliche Mehrdeutigkeit werden durch Fußnoten kenntlich gemacht.
