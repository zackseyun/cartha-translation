id: JOB.36.12
reference: Job 36:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם לֹ֣א יִ֭שְׁמְעוּ בְּ/שֶׁ֣לַח יַעֲבֹ֑רוּ וְ֝/יִגְוְע֗וּ כִּ/בְלִי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/012.yaml
  text: But if they do not listen[a], they will pass away by the sword, and they will die without knowledge.
translation:
  language: de
  text: Doch wenn sie nicht hören, kommen sie durch das Schwert um und sterben ohne Erkenntnis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus Mangel an Erkenntnis“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Doch wenn
  rationale: Die Wendung leitet einen bedingten Gegensatz zum vorherigen Vers ein; „Doch wenn“ gibt diesen Zusammenhang natürlich wieder.
- source_word: לֹא יִשְׁמְעוּ
  choice: sie nicht hören
  rationale: שׁמע umfasst Hören, Aufmerken und Gehorchen. „Hören“ bewahrt diese Bedeutungsbreite, ohne den Sinn vorschnell auf Gehorsam einzuengen.
- source_word: בְּשֶׁלַח
  choice: durch das Schwert
  rationale: שׁלח bezeichnet hier ein tödliches Geschoss oder eine Waffe; im Gerichtskontext ist „Schwert“ die idiomatisch naheliegende Wiedergabe.
- source_word: יַעֲבֹרוּ
  choice: kommen sie … um
  rationale: עבר bedeutet wörtlich „hinübergehen“, bezeichnet hier jedoch im Zusammenhang mit dem Schwert das Umkommen. Die deutsche Formulierung ist klar und bewahrt die Parallelität zum folgenden Sterben.
- source_word: וְיִגְוְעוּ
  choice: und sterben
  rationale: גוע bezeichnet das Sterben oder Verscheiden; „sterben“ ist präzise, natürlich und würdevoll.
- source_word: כִּבְלִי דָעַת
  choice: ohne Erkenntnis
  rationale: Die Wendung kann einen Zustand („ohne Erkenntnis“) oder einen Grund („aus Mangel an Erkenntnis“) ausdrücken. Der Haupttext folgt eng der hebräischen Konstruktion; die kausale Möglichkeit steht in der Fußnote.
theological_decisions:
- issue: Ob שׁמע bloßes Hören oder eine gehorsame Reaktion bezeichnet
  choice: sie nicht hören
  alternative: sie nicht gehorchen
  rationale: „Hören“ lässt die im Hebräischen angelegte Verbindung von Wahrnehmen und Befolgen offen und vermeidet eine theologische Verengung.
- issue: Ob כִּבְלִי דָעַת Ursache oder Zustand ausdrückt
  choice: ohne Erkenntnis
  alternative: aus Mangel an Erkenntnis
  rationale: Die Zustandsangabe entspricht unmittelbar der Präpositionalfügung; die ebenfalls plausible kausale Deutung wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Weisheitsstil. „Erkenntnis“ nimmt den Erkenntnisbegriff des hebräischen דַּעַת auf; die Satzstruktur bleibt knapp und parallel.
