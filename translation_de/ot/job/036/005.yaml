  text: הֶן אֵ֣ל כַּ֭בִּיר וְ/לֹ֣א יִמְאָ֑ס כַּ֝בִּ֗יר כֹּ֣חַֽ לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/005.yaml
  text: Behold[a], God is mighty and does not despise[b]; he is mighty in strength of heart.
translation:
  language: de
  text: Siehe[a], Gott ist mächtig und verwirft nicht[b]; mächtig ist er an Kraft des Herzens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gewiss“. Das hebräische Wort leitet eine nachdrückliche Aussage ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „verschmäht“ oder „verachtet“. Im Hebräischen wird kein Objekt ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Kraft des Herzens“; gemeint sein können Verstandeskraft, innere Stärke oder Entschlossenheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sieh
  rationale: Die Partikel leitet eine nachdrückliche Aussage ein. „Sieh“ bewahrt ihre hinweisende Funktion und den gehobenen poetischen Ton.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier die übliche poetische Bezeichnung für Gott; eine Erweiterung zu einem besonderen Titel wäre nicht erforderlich.
- source_word: כַּבִּיר
  choice: mächtig
  rationale: Das Adjektiv bezeichnet Größe beziehungsweise Macht. „Mächtig“ passt an beiden Stellen und erhält die Wiederholung.
- source_word: וְלֹא יִמְאָס
  choice: und verwirft nicht
  rationale: מאס kann „verwerfen“, „verschmähen“ oder „verachten“ bedeuten. Da das Hebräische kein Objekt nennt, bleibt auch die deutsche Fassung ohne ergänztes Objekt.
- source_word: כֹּחַ לֵב
  choice: Herzensstärke
  rationale: Die knappe Zusammensetzung erhält sowohl das Bild des Herzens als auch die Mehrdeutigkeit zwischen Einsicht, innerer Kraft und Entschlossenheit.
theological_decisions:
- issue: Nicht genanntes Objekt von „verwirft nicht“
  choice: verwirft nicht
  alternative: verachtet niemanden
  rationale: Der hebräische Text lässt das Objekt unausgesprochen. Die objektlose Wiedergabe bewahrt diese echte Offenheit, statt „niemanden“ oder eine bestimmte Personengruppe einzufügen.
- issue: Bedeutung von כֹּחַ לֵב
  choice: Herzensstärke
  alternative: Verstandeskraft / Entschlossenheit
  rationale: לֵב kann Herz, Verstand oder inneren Willen bezeichnen. Die bildhafte Hauptfassung legt sich nicht unnötig auf nur eine dieser Bedeutungen fest.
translation_notes:
  register: Moderne, gehobene poetische Standardsprache. Die Wiederholung von „mächtig“ und die knappe Satzform spiegeln den hebräischen Parallelismus; Fußnoten erläutern, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
