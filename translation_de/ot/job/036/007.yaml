source:
  edition: WLC
  text: לֹֽא יִגְרַ֥ע מִ/צַּדִּ֗יק עֵ֫ינָ֥י/ו וְ/אֶת מְלָכִ֥ים לַ/כִּסֵּ֑א וַ/יֹּשִׁיבֵ֥/ם לָ֝/נֶ֗צַח וַ/יִּגְבָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/007.yaml
  text: He does not withdraw his eyes from the righteous[a], but with kings on the throne he seats them forever[b], and they are exalted.
translation:
  language: de
  text: Er wendet seine Augen nicht von den Gerechten ab[a], sondern setzt sie zusammen mit Königen für immer auf den Thron, und sie werden erhöht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Könige auf dem Thron – er lässt sie für immer dort sitzen“. Das Hebräische ist knapp formuliert; der Satz kann auch unmittelbar von den Königen handeln, statt davon, dass die Gerechten mit Königen auf den Thron gesetzt werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „und er erhöht sie“. Das Schlussverb kann auch so verstanden werden, dass Gott das mitgedachte Subjekt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְרַע
  choice: wendet … nicht … ab
  rationale: גרע bedeutet grundsätzlich „vermindern, entziehen, wegnehmen“. In Verbindung mit „seinen Augen“ gibt „die Augen nicht von jemandem abwenden“ das Bild und den Sinn an dieser Stelle natürlich wieder.
- source_word: מִצַּדִּיק
  choice: von den Gerechten
  rationale: Das substantivierte Adjektiv im Singular wird hier kollektiv beziehungsweise allgemein verstanden; der deutsche Plural bezeichnet diese Personengruppe ohne unnötige Festlegung auf einen einzelnen Mann.
- source_word: עֵינָיו
  choice: seine Augen
  rationale: Die konkrete anthropomorphe Bildsprache des Hebräischen bleibt erhalten und wird nicht zu „Fürsorge“ oder „Aufmerksamkeit“ abstrahiert.
- source_word: וְאֶת מְלָכִים לַכִּסֵּא
  choice: sondern … mit Königen auf den Thron
  rationale: Die knappe, elliptische Wendung wird als königliche Ehrenstellung der Gerechten verstanden. „Mit Königen“ wahrt die syntaktische Verbindung, ohne ein im Hebräischen nicht ausdrücklich vorhandenes zusätzliches finites Verb einzusetzen.
- source_word: וַיֹּשִׁיבֵם
  choice: setzt sie
  rationale: Der Hifil von ישׁב bedeutet „sitzen lassen, setzen“. Zusammen mit „auf den Thron“ ist „setzt sie“ klar und weniger interpretierend als „inthronisiert sie“.
- source_word: לָנֶצַח
  choice: für immer
  rationale: Die Wendung bezeichnet fortdauernde Dauer; „für immer“ ist gegenwärtiges, verständliches Standarddeutsch.
- source_word: וַיִּגְבָּהוּ
  choice: und sie werden erhöht
  rationale: Die masoretische Form legt ein plurales Subjekt nahe und beschreibt das Erlangen einer hohen Stellung. Die deutsche passive Formulierung gibt den resultativen Sinn wieder, ohne die knappe Aussage unnötig auszudeuten.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Aufmerksamkeit
  choice: Das konkrete Bild „seine Augen“ bleibt stehen.
  alternative: „seine Fürsorge“, „seine Aufmerksamkeit“ oder „seinen Blick“
  rationale: So bleibt die poetische Darstellung von Gottes unablässiger Zuwendung erhalten, ohne die Bildsprache zu verflachen.
- issue: Bezug des Pronomens im Königssatz
  choice: „sie“ bezieht sich auf die kollektiv verstandenen Gerechten, die mit Königen auf den Thron gesetzt werden.
  alternative: „sie“ bezieht sich auf die Könige, die Gott dauerhaft auf den Thron setzt.
  rationale: Die Gerechten sind der vorherige thematische Bezugspunkt und können als kollektiver Singular ein plurales Pronomen aufnehmen. Wegen der gedrängten hebräischen Syntax wird die andere mögliche Gliederung in einer Fußnote genannt.
- issue: Subjekt des Schlussverbs
  choice: 'Die Gerechten sind das Subjekt: „sie werden erhöht“.'
  alternative: 'Gott ist das mitgedachte Subjekt: „er erhöht sie“.'
  rationale: Die vokalisierte hebräische Form lässt sich am unmittelbarsten mit pluralischem Subjekt verstehen; zugleich ist die aktive Deutung im Überlieferungs- und Übersetzungszusammenhang möglich und wird deshalb nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Bildsprache. Die ungewöhnlich kompakte Syntax des hebräischen Königssatzes wird im Haupttext verständlich wiedergegeben; echte Auslegungsalternativen werden in den Fußnoten offengelegt.
