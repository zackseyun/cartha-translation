  text: כִּֽי אָ֭מְנָם לֹא שֶׁ֣קֶר מִלָּ֑/י תְּמִ֖ים דֵּע֣וֹת עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/004.yaml
  text: For truly[a], my words are not false; one perfect in knowledge is with you.
translation:
  language: de
  text: Denn wahrhaftig, meine Worte sind nicht unwahr; einer, der an Wissen vollkommen ist, ist bei dir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der an Wissen Vollkommene ist bei dir“; möglicherweise bezieht sich die Aussage auf Gott statt auf Elihu selbst.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אָמְנָם
  choice: Denn wirklich
  rationale: כִּי knüpft begründend an den vorherigen Gedankengang an; אָמְנָם verstärkt die Aussage. „Denn wirklich“ gibt beides in natürlichem, würdigem Deutsch wieder.
- source_word: לֹא שֶׁקֶר מִלָּי
  choice: meine Worte sind keine Lüge
  rationale: Die hebräische Nominalaussage verneint die Unwahrheit von Elihus Worten. „Keine Lüge“ bewahrt die kräftige Bildlichkeit von שֶׁקֶר besser als das abstraktere „nicht falsch“.
- source_word: תְּמִים
  choice: vollkommenem
  rationale: Das Adjektiv bezeichnet Ganzheit, Vollständigkeit oder Unversehrtheit. „Vollkommen“ erhält hier die auffällige Stärke von Elihus Aussage, ohne sie erklärend abzuschwächen.
- source_word: דֵּעוֹת
  choice: Wissen
  rationale: Der formale Plural kann im Deutschen idiomatisch als abstrakter Singular wiedergegeben werden. „Wissen“ passt zur Weisheitsrede und vermeidet eine unnötige Festlegung auf einzelne Einsichten.
- source_word: עִמָּךְ
  choice: ist bei dir
  rationale: Die Präposition עִם bedeutet „mit/bei“. „Bei dir“ ist in diesem Satz natürlich und bewahrt die unmittelbare Anrede Jobs.
theological_decisions:
- issue: Bezug von „einer mit vollkommenem Wissen“
  choice: Im Haupttext grammatisch offen formuliert; im unmittelbaren Zusammenhang liegt Elihus Selbstbezeichnung nahe.
  alternative: Die Wendung kann auf Gott als den bei Job gegenwärtigen, in Wissen Vollkommenen bezogen werden.
  rationale: Der Wechsel von „meine Worte“ zur unbestimmten Formulierung „einer ...“ lässt den Bezug formal offen. Daher wird kein Name oder Pronomen ergänzt; die alternative Gottesreferenz wird in der Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitsregister. Die ungewöhnlich starke Selbstaussage wird nicht geglättet; die syntaktische und theologische Mehrdeutigkeit des zweiten Halbverses bleibt erhalten.
