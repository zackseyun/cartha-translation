  yaml_path: translation/ot/job/036/023.yaml
  text: Who has appointed his way for him? Or who has said[b][a], ‘You have done wrong’?”
translation:
  language: de
  text: 'Wer hat ihm seinen Weg vorgeschrieben[a]? Und wer hat gesagt: »Du hast Unrecht[b] getan«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer hat ihm seinen Weg bestimmt?“ Das hebräische Verb kann unter anderem „bestimmen“, „anordnen“ oder „vorschreiben“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Du hast Ungerechtigkeit getan.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי פָקַד עָלָיו דַּרְכּוֹ
  choice: Wer hat ihm seinen Weg vorgeschrieben?
  rationale: Die rhetorische Frage bestreitet, dass irgendjemand Gottes Handlungsweg festlegen oder ihm Weisungen erteilen könnte. „Vorgeschrieben“ gibt פקד in dieser Verbindung natürlich wieder, ohne die mögliche Bedeutung „zur Rechenschaft ziehen“ zu verschweigen.
- source_word: וּמִי
  choice: Und wer
  rationale: וּ verbindet die beiden parallelen rhetorischen Fragen. Im Deutschen ist „Und wer“ klar und idiomatisch.
- source_word: אָמַר
  choice: hat gesagt
  rationale: Das Perfekt bezeichnet hier die rhetorische Frage, ob jemals jemand eine solche Anklage erhoben hat; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: פָּעַלְתָּ עַוְלָה
  choice: Du hast Unrecht getan
  rationale: פעל bedeutet „tun/handeln“, während עַוְלָה moralisches Unrecht oder Ungerechtigkeit bezeichnet. Die Formulierung ist gegenwärtig, würdig und bewahrt die direkte Anrede.
theological_decisions:
- issue: Bezug der männlichen Suffixe und der zweiten Person
  choice: Die Aussagen beziehen sich im Kontext auf Gott, ohne den Namen „Gott“ ergänzend in den Vers einzusetzen.
  alternative: Eine allgemeinere Aussage über einen mächtigen Herrscher oder Menschen.
  rationale: Hiob 36,22–23 handelt ausdrücklich von Gottes Größe und Gerechtigkeit. Die Pronomen werden deshalb kontextgemäß auf Gott bezogen; zugleich bleibt die pronominale Ausdrucksweise des Hebräischen erhalten.
- issue: Charakter der zweiten rhetorischen Frage
  choice: Die Frage verneint, dass jemand Gott berechtigt des Unrechts bezichtigen kann.
  alternative: Eine bloße Feststellung, dass noch niemand eine solche Aussage geäußert habe.
  rationale: Der Parallelismus und der unmittelbare Kontext betonen Gottes unübertreffliche Autorität und Gerechtigkeit. Die Übersetzung lässt die rhetorische Form stehen und macht daraus keine ausdrückliche dogmatische Aussage.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede wird mit deutschen Anführungszeichen markiert; Gottesbezug wird aus dem Kontext erschlossen und nicht durch eine erklärende Ergänzung im Haupttext festgelegt.
