  text: לֹא יְחַיֶּ֥ה רָשָׁ֑ע וּ/מִשְׁפַּ֖ט עֲנִיִּ֣ים יִתֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/006.yaml
  text: He does not keep the wicked alive[b][a], but gives justice to the afflicted.
translation:
  language: de
  text: Er erhält den Gottlosen nicht am Leben[a], doch den Bedrängten[b] gewährt er Recht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er lässt den Gottlosen nicht leben.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Armen“; das hebräische Wort kann Menschen bezeichnen, die niedriggestellt, unterdrückt, bedrängt oder wirtschaftlich arm sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֶּה
  choice: erhält … am Leben
  rationale: Die Piel-Form von חיה bezeichnet hier am ehesten das Bewahren beziehungsweise Erhalten des Lebens, nicht ein Auferwecken oder erstmaliges Lebenschenken.
- source_word: רָשָׁע
  choice: den Gottlosen
  rationale: Das morphologisch singularische Substantiv ist generisch gebraucht. Der deutsche substantivierte Singular bewahrt diese Form und ist im gehobenen modernen Standarddeutsch verständlich.
- source_word: מִשְׁפַּט
  choice: Recht
  rationale: Im Zusammenhang bezeichnet מִשְׁפָּט den gerechten Anspruch beziehungsweise die den Bedrängten zukommende Rechtshilfe. „Recht gewähren“ gibt die hebräische Konstruktion natürlich wieder.
- source_word: עֲנִיִּים
  choice: den Bedrängten
  rationale: עָנִי kann Arme, Niedrige, Bedrückte oder allgemein Leidende bezeichnen. „Bedrängte“ bewahrt die größere Bedeutungsbreite, ohne den Ausdruck auf wirtschaftliche Armut zu verengen.
- source_word: יִתֵּן
  choice: gewährt
  rationale: נתן bedeutet grundsätzlich „geben“. In Verbindung mit „Recht“ ist „gewähren“ eine natürliche und würdige deutsche Wiedergabe.
- source_word: וּ
  choice: doch
  rationale: Die Konjunktion ist formal additiv, stellt hier aber Gottes Handeln gegenüber dem Gottlosen und den Bedrängten einander kontrastierend gegenüber.
theological_decisions:
- issue: Ob יְחַיֶּה eine Auferweckung oder ein theologisches Lebenschenken bezeichnet
  choice: Als zeitliches Erhalten des Lebens wiedergegeben
  alternative: „lebendig machen“ oder „Leben geben“
  rationale: Der poetische Zusammenhang handelt von Gottes gerechtem Walten. Eine auf Auferstehung bezogene Formulierung würde einen theologischen Gedanken eintragen, den dieser Vers nicht ausdrücklich enthält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der poetische Gegensatz wird durch „doch“ verdeutlicht; die knappe Satzstruktur und der generische Singular des Hebräischen bleiben erhalten.
