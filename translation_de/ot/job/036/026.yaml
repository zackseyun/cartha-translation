  text: הֶן אֵ֣ל שַׂ֭גִּיא וְ/לֹ֣א נֵדָ֑ע מִסְפַּ֖ר שָׁנָ֣י/ו וְ/לֹא חֵֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/026.yaml
  text: Behold[a], God is great, and we do not know him[b]; the number of his years is unsearchable.
translation:
  language: de
  text: Siehe, Gott ist groß, und wir erkennen ihn nicht[a]; die Zahl seiner Jahre ist unerforschlich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und wir wissen nicht“; das Objekt „ihn“ ist aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „und die Zahl seiner Jahre lässt sich nicht ergründen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Siehe
  rationale: Die Partikel leitet eine nachdrückliche Aussage ein und lenkt die Aufmerksamkeit auf das Folgende. „Siehe“ bewahrt den gehobenen poetischen Klang.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier die poetische Bezeichnung für Gott; „Gott“ ist im Deutschen klar und angemessen.
- source_word: שַׂגִּיא
  choice: groß
  rationale: Das Adjektiv bezeichnet Größe oder Erhabenheit. „Groß“ bewahrt die semantische Weite, ohne die Aussage auf Macht oder räumliche Ausdehnung zu verengen.
- source_word: וְלֹא נֵדָע
  choice: und wir erkennen ihn nicht völlig
  rationale: Wörtlich steht „und wir wissen/erkennen nicht“, ohne ausgesprochenes Objekt. Der Zusammenhang legt Gott als Objekt nahe. „Nicht völlig“ macht den gemeinten Mangel an menschlichem Begreifen verständlich, ohne eine völlige Unkenntnis Gottes zu behaupten.
- source_word: מִסְפַּר שָׁנָיו
  choice: die Zahl seiner Jahre
  rationale: Die direkte Wiedergabe erhält das poetische und anthropomorphe Bild für Gottes unermessliche Dauer.
- source_word: וְלֹא חֵקֶר
  choice: ist unerforschlich
  rationale: Die nominale Wendung bedeutet wörtlich, dass es kein Erforschen bzw. Ergründen gibt. „Ist unerforschlich“ ist knappes, natürliches Deutsch und bewahrt die Aussage menschlicher Unergründlichkeit.
theological_decisions:
- issue: Unausgesprochenes Objekt bei וְלֹא נֵדָע
  choice: Gott als Objekt ergänzen und mit „wir erkennen ihn nicht völlig“ wiedergeben
  alternative: 'Die Aussage absolut lassen: „und wir wissen nicht“'
  rationale: Der unmittelbare Kontext weist auf Gott als das unausgesprochene Objekt. Die Ergänzung „nicht völlig“ bringt den Sinn des Nicht-Ergründens zum Ausdruck, ohne die Aussage so zu formulieren, als sei keinerlei Gotteserkenntnis möglich.
- issue: Bedeutung von Gottes „Jahren“
  choice: Das Bild „seine Jahre“ beibehalten
  alternative: Deutend mit „seine Ewigkeit“ oder „seine Lebenszeit“ übersetzen
  rationale: Der hebräische Text spricht poetisch von Gottes Jahren. Die direkte Wiedergabe bewahrt Bild und theologische Spannung, statt den Ausdruck systematisch als „Ewigkeit“ auszulegen.
- issue: Konstruktion וְלֹא חֵקֶר
  choice: 'Prädikativ auf „die Zahl seiner Jahre“ beziehen: „ist unerforschlich“'
  alternative: 'Formnäher: „und es gibt kein Erforschen der Zahl seiner Jahre“'
  rationale: Beide Fassungen vermitteln denselben Grundsinn. Die gewählte Form ist im Deutschen natürlicher, während eine Fußnote die formnähere Möglichkeit dokumentiert.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, poetischem Ton. „Siehe“ und „unerforschlich“ tragen den gehobenen Stil der Weisheitsdichtung, ohne altertümliche Satzformen zu verwenden.
