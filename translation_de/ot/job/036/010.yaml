source:
  edition: WLC
  text: וַ/יִּ֣גֶל אָ֭זְנָ/ם לַ/מּוּסָ֑ר וַ֝/יֹּ֗אמֶר כִּֽי יְשֻׁב֥וּ/ן מֵ/אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/010.yaml
  text: He opens their ear to discipline[b][a], and says that they should turn back from wickedness.
translation:
  language: de
  text: Er öffnet ihnen das Ohr für Zurechtweisung[a] und sagt, sie sollen sich vom Unrecht abwenden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für Unterweisung“; auch: „zur Züchtigung“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Bosheit“, „Frevel“ oder in anderem Zusammenhang „Unheil“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֶל
  choice: öffnet
  rationale: גלה bezeichnet hier mit „Ohr“ als Objekt idiomatisch das Öffnen beziehungsweise Freilegen des Ohrs für aufmerksames Hören. „Öffnet“ bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: אָזְנָם
  choice: ihnen das Ohr
  rationale: Der hebräische Singular mit pluralischem Suffix wird durch die deutsche distributive Wendung „ihnen das Ohr“ natürlich und quellennah wiedergegeben.
- source_word: לַמּוּסָר
  choice: für Zurechtweisung
  rationale: מוּסָר umfasst Unterweisung, Erziehung und korrigierende Disziplin. Im Zusammenhang des Leidens als Korrektur bringt „Zurechtweisung“ die lehrende wie die korrigierende Seite zum Ausdruck, ohne einen rein strafenden Sinn festzulegen.
- source_word: וַיֹּאמֶר
  choice: und sagt
  rationale: Die einfache Wiedergabe wahrt die verbale Abfolge und ergänzt kein im Hebräischen unausgedrücktes Objekt.
- source_word: כִּי
  choice: '[Inhaltssatz ohne eigenes Wort]'
  rationale: כִּי leitet hier den Inhalt des Gesagten ein. Im Deutschen folgt nach „sagt“ idiomatisch ein uneingeleiteter Inhaltssatz; ein ausdrückliches „dass“ wäre ebenfalls möglich, aber schwerfälliger.
- source_word: יְשֻׁבוּן
  choice: sie sollen … umkehren
  rationale: שוב bedeutet zurückkehren beziehungsweise umkehren. „Sollen“ gibt im berichteten Sprechen die auffordernde Nuance wieder, ohne die Form zu einem direkten Imperativ umzubauen.
- source_word: מֵאָוֶן
  choice: vom Unrecht
  rationale: אָוֶן kann Unrecht, Bosheit oder Unheil bezeichnen. Hier verlangt der Aufruf zur Umkehr einen moralischen Sinn; „Unrecht“ ist gegenwärtiges, verständliches Deutsch und vermeidet die altertümliche Färbung von „Frevel“.
theological_decisions:
- issue: Charakter von מוּסָר in Elihus Rede
  choice: Zurechtweisung als lehrende Korrektur
  alternative: Unterweisung mit stärker pädagogischem Sinn; Züchtigung mit stärker strafendem Sinn
  rationale: Der Zusammenhang verbindet Leid mit Gottes korrigierendem Reden. „Zurechtweisung“ hält die Spannung zwischen Unterweisung und Korrektur offen, ohne eine bestimmte Lehre über den Zweck allen Leidens einzutragen.
- issue: Moralischer oder leidbezogener Sinn von אָוֶן
  choice: moralisches Unrecht
  alternative: Unheil oder Mühsal
  rationale: Die Verbindung mit Umkehr spricht hier vorrangig für menschliches Fehlverhalten. Die lexikalische Möglichkeit „Unheil“ wird dennoch in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wendung „ihnen das Ohr öffnen“ bewahrt das hebräische Bild; „Zurechtweisung“ hält den pädagogischen und korrigierenden Gehalt von מוּסָר zusammen. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
