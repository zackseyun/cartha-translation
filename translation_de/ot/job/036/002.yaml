  yaml_path: translation/ot/job/036/002.yaml
  text: Bear with me a little, and I will show you, for there are still words for God.
translation:
  language: de
  text: Hab noch ein wenig Geduld mit mir, dann will ich dir noch etwas darlegen; denn es gibt noch Worte für Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּתַּר לִי זְעֵיר
  choice: Hab noch ein wenig Geduld mit mir
  rationale: Die Wendung fordert den Angesprochenen auf, noch kurz zu warten beziehungsweise den Redner noch etwas zu ertragen; die deutsche Formulierung gibt beides natürlich wieder.
- source_word: וַאֲחַוֶּךָּ
  choice: dann will ich es dir darlegen
  rationale: Das aramaisierende Verb חוה bedeutet hier mitteilen, kundtun oder darlegen. „Darlegen“ passt zu Elihus fortgesetzter Argumentation, ohne einen visuellen Sinn von „zeigen“ aufzudrängen.
- source_word: כִּי עוֹד לֶאֱלוֹהַּ מִלִּים
  choice: denn es gibt noch Worte für Gott
  rationale: Die knappe Nominalkonstruktion wird möglichst offen bewahrt. לֶאֱלוֹהַּ bezeichnet eine Beziehung der Worte zu Gott und kann hier besonders den Sinn „zugunsten Gottes/zu Gottes Verteidigung“ tragen; „für Gott“ legt diese Beziehung nicht enger fest als der Ausgangstext.
theological_decisions:
- issue: Spricht Elihu ausdrücklich im Namen Gottes oder lediglich zu Gottes Gunsten?
  choice: Worte für Gott
  alternative: Worte im Namen Gottes / Worte zu Gottes Verteidigung
  rationale: Die Präposition לְ bezeichnet hier nicht eindeutig eine göttliche Beauftragung. Die gewählte Fassung bewahrt die Spannung und vermeidet, Elihus Anspruch theologisch zu verstärken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satzteil ist idiomatisch formuliert; die bewusst knappe Schlusswendung wahrt die Mehrdeutigkeit des Hebräischen.
