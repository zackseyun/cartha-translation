    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang eine Begründung beziehungsweise Erläuterung von Gottes Größe und Wirken ein.
- source_word: יְגָרַע
  choice: zieht … empor
  rationale: Das Verb bedeutet gewöhnlich „wegnehmen, entziehen, vermindern“. Im meteorologischen Zusammenhang gibt „emporziehen“ die kontextuelle Vorstellung verständlich wieder, ohne die Grundbedeutung völlig aufzugeben.
- source_word: נִטְפֵי מָיִם
  choice: die Wassertropfen
  rationale: Gibt die hebräische Genitivverbindung knapp und natürlich wieder.
- source_word: יָזֹקּוּ
  choice: sie lassen … herabrinnen
  rationale: Bewahrt gegenüber einem eindeutigen „destillieren“ oder „herabgießen“ die schwierige Bildsprache des Verbs זקק und passt zur Entstehung beziehungsweise Abgabe von Regen.
- source_word: מָטָר
  choice: Regen
  rationale: Ist die direkte und im Deutschen natürliche Entsprechung.
- source_word: לְאֵדוֹ
  choice: aus seinem Dunst
  rationale: אֵד bezeichnet Dunst oder Wasserdampf. Die Präposition לְ ist hier schwierig; „aus“ stellt den wahrscheinlichen Herkunftsbezug idiomatisch dar. Das maskuline Singularsuffix bleibt als „seinem“ erhalten.
theological_decisions:
- issue: Bezug des maskulinen Singularsuffixes in לְאֵדוֹ
  choice: „seinem Dunst“ mit Bezug auf Gott
  alternative: Unpersönlich „aus dem Dunst“ beziehungsweise textkritisch oder vokalisch erschlossene andere Bezüge
  rationale: Gott ist im unmittelbaren Zusammenhang das handelnde Subjekt. Der Bezug auf ihn bewahrt die grammatische Form und die Aussage über sein Wirken in der Schöpfung, ohne sie weiter auszudeuten.
translation_notes:
