base_translation:
  language: en
  yaml_path: translation/ot/job/030/026.yaml
  text: For I hoped for good[a], but evil came; I waited for light, but darkness came.
translation:
  language: de
  text: Denn ich hoffte auf Gutes[a], doch es kam Unheil; ich wartete auf Licht, doch es kam Dunkelheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: auf Wohlergehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang eine Begründung beziehungsweise Erläuterung von Hiobs Klage ein.
- source_word: טוֹב
  choice: Gutes
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet allgemein etwas Wohltuendes oder Günstiges und bewahrt den Gegensatz zu רָע, ohne ihn auf Wohlstand einzuengen.
- source_word: קִוִּיתִי
  choice: ich hoffte
  rationale: Das Verb bezeichnet erwartungsvolles Hoffen; die Wiedergabe passt natürlich zu „auf Gutes“.
- source_word: וַיָּבֹא
  choice: es kam
  rationale: Die schlichte und in beiden Vershälften wiederholte Form bewahrt die prägnante Umkehrung der Erwartung.
- source_word: רָע
  choice: Unheil
  rationale: Im Klagezusammenhang bezeichnet רָע widrige Erfahrung beziehungsweise Unglück, nicht notwendig moralisch Böses. „Unheil“ gibt diesen Sinn im Deutschen treffend wieder.
- source_word: אֲיַחֲלָה
  choice: ich wartete
  rationale: Das Verb drückt hoffnungsvolles Warten aus. „Wartete“ unterscheidet es stilistisch von קִוִּיתִי, ohne die semantische Nähe zu verdecken.
- source_word: לְאוֹר
  choice: auf Licht
  rationale: Die Bildsprache wird unaufgelöst bewahrt und kann sowohl konkrete als auch übertragene Hoffnung ausdrücken.
- source_word: אֹפֶל
  choice: Dunkelheit
  rationale: Bewahrt den unmittelbaren Gegensatz zu „Licht“; das starke hebräische Wort kann auch „Finsternis“ oder „Dunkel“ bedeuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die Wiederholung „es kam“ bleiben erhalten. „Unheil“ vermeidet im Kontext die missverständliche Deutung als moralisch Böses; die Fußnote bei „Gutes“ weist auf dessen möglichen Sinn als Wohlergehen hin.
