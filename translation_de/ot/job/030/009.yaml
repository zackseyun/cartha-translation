lexical_decisions:
- source_word: וְעַתָּה
  choice: Und jetzt
  rationale: Leitet den gegenwärtigen Zustand Hiobs ein und lässt zugleich den Gegensatz zu seinem früheren Ansehen erkennen, ohne die Konjunktion stärker als nötig auszudeuten.
- source_word: נְגִינָתָם
  choice: ihr Lied
  rationale: נְגִינָה bezeichnet ein Lied oder Musikstück. Der Kontext macht den spöttischen Gebrauch deutlich; die knappe Wiedergabe bewahrt das Bild und nennt die mögliche Nuance in der Fußnote.
- source_word: הָיִיתִי
  choice: bin ich … geworden
  rationale: Das Perfekt von היה beschreibt hier einen eingetretenen Zustand, der in der Gegenwart fortbesteht.
- source_word: וָאֱהִי
  choice: bin ich … geworden
  rationale: Die fortführende Verbform steht parallel zur ersten Aussage. Die wiederholte deutsche Wendung gibt den gegenwärtigen Zustand und die poetische Parallelität klar wieder.
- source_word: לָהֶם
  choice: für sie
  rationale: 'Gibt die Relation idiomatisch wieder: So gilt oder dient Hiob ihnen.'
- source_word: לְמִלָּה
  choice: zum Gerede
  rationale: מִלָּה bedeutet wörtlich »Wort« und kann hier eine über jemanden umlaufende Äußerung oder Redensart bezeichnen. »Gerede« ist im heutigen Deutsch verständlich und bewahrt die abwertende, aber nicht vollständig festgelegte Bedeutung.
