  text: Und jetzt bin ich ihr Lied[a] geworden, und ich bin ihnen zum Gerede[b] geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr Spottlied«. Das hebräische Wort bedeutet »Lied« oder »Musikstück«; im Zusammenhang kann es ein spöttisches Lied bezeichnen.'
