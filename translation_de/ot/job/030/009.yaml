  naturalness: »Ich bin ihr Lied geworden« und »ich bin ihnen zum Gerede geworden« sind verständliches, würdiges modernes Standarddeutsch und bewahren die parallele Satzstruktur. Die Wiederholung von »ich bin« ist im Deutschen zur klaren Abbildung der hebräischen Parallelität angemessen.
  terminology: »Gerede« ist für לְמִלָּה als kontextuell abwertende Rede über Hiob möglich, bleibt aber weiter als eine ausdrücklich festgelegte »Redensart« oder ein »Spottwort«. Die Fußnote sollte die lexikalische Spannweite erläutern, ohne das im Text nicht ausdrücklich vorhandene Verständnis als zwingend darzustellen.
