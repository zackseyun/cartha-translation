  text: On my right, a brood rises up[a]; they send my feet away[c][b], and they build up against me their paths of disaster.
translation:
  language: de
  text: Zu meiner Rechten erhebt sich Gesindel[a]; sie schicken meine Füße fort[b] und schütten gegen mich ihre Wege des Unheils auf[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine zügellose Schar“. Das seltene hebräische Wort פִּרְחַח bezeichnet offenbar eine verachtete oder ungebärdige Gruppe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Sie schicken meine Füße fort.“ Gemeint sein kann, dass sie ihn verdrängen, vom Weg abbringen oder ihn zu Fall bringen.'
    reason: lexical_alternative
  - marker: c
    text: 'Das Hebräische bewahrt hier das feindlich gebrauchte Bild vom Aufschütten eines Weges; möglich ist auch: „Sie schütten gegen mich ihre Pfade des Unheils auf.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָמִין
  choice: Zu meiner Rechten
  rationale: Die räumliche Wendung bezeichnet die feindliche Stellung an Hiobs rechter Seite; die deutsche Formulierung ist natürlich und bewahrt das Bild.
- source_word: פִּרְחַח
  choice: Gesindel
  rationale: Das seltene Kollektivwort bezeichnet offenbar eine verachtete, zügellose Gruppe. „Gesindel“ gibt Hiobs abwertende Haltung wieder, ohne eine bestimmte Altersgruppe festzulegen.
- source_word: יָקוּמוּ
  choice: erhebt sich
  rationale: קום bezeichnet hier ein feindliches Aufstehen oder Sich-Erheben; der Singular stimmt im Deutschen mit dem Kollektiv „Gesindel“ überein.
- source_word: רַגְלַי שִׁלֵּחוּ
  choice: sie treiben meine Füße fort
  rationale: Die schwierige Wendung lautet wörtlich etwa „meine Füße schicken sie fort“. „Treiben ... fort“ bleibt nahe am Bild und ist verständlicher, ohne die mögliche Bedeutung des Vertreibens oder Zu-Fall-Bringens eindeutig festzulegen.
- source_word: וַיָּסֹלּוּ
  choice: sie schütten ... auf
  rationale: סלל bezeichnet häufig das Aufschütten oder Anlegen eines Weges. „Aufschütten“ erhält die konkrete Straßenbaumetapher.
- source_word: עָלַי
  choice: gegen mich
  rationale: Im feindlichen Zusammenhang hat die Präposition adversative Bedeutung.
- source_word: אָרְחוֹת אֵידָם
  choice: ihre Wege des Verderbens
  rationale: Die Formulierung bewahrt sowohl das Wegbild als auch das Suffix „ihre“ bei אֵידָם. „Verderben“ kann Unheil, Untergang oder Vernichtung bezeichnen und lässt die genaue Beziehung der Wege zum Unheil offen.
