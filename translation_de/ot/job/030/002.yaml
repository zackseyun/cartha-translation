lexical_decisions:
- source_word: גַּם
  choice: Selbst
  rationale: Gibt die steigernde, nachdrückliche Funktion im abwertenden Zusammenhang natürlich wieder.
- source_word: כֹּחַ יְדֵיהֶם
  choice: die Kraft ihrer Hände
  rationale: Bewahrt das konkrete hebräische Bild für körperliche Arbeitskraft und praktische Leistungsfähigkeit.
- source_word: לָמָּה לִּי
  choice: was nützt sie mir?
  rationale: Gibt die rhetorische Frage idiomatisch wieder; das feminine Pronomen bezieht sich im Deutschen auf „Kraft“.
- source_word: עָלֵימוֹ אָבַד כָּלַח
  choice: Ihre Lebenskraft ist geschwunden
  rationale: Versteht עָלֵימוֹ als auf die Männer bezogen und כָּלַח als ihre verlorene volle Kraft; „geschwunden“ drückt den eingetretenen Verlust natürlich aus.
- source_word: כָּלַח
  choice: Lebenskraft
  rationale: Das seltene, unsichere Substantiv bezeichnet hier wahrscheinlich volle Kraft oder die Blüte reifen Lebens. „Lebenskraft“ passt zum Kontext, ohne die mögliche Altersbedeutung im Haupttext zu stark festzulegen.
