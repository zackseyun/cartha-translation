  text: Auch die Kraft ihrer Hände – was nützt sie mir? Ihre volle Kraft ist dahin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihre Blüte ist dahin.“ Das seltene hebräische Wort kann volle Kraft oder die Blüte des reifen Alters bezeichnen.'
