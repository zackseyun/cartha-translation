  text: Did I not weep for the one whose day was hard? Was not my soul grieved for the poor?[a]
translation:
  language: de
  text: Habe ich nicht um den geweint, dem es schwer erging? War meine Seele nicht um den Bedürftigen betrübt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über den Bedürftigen«. Der erste Satz kann auch heißen: »Habe ich nicht um den geweint, der in Not war?« Wörtlicher spricht das Hebräische von einem Menschen, dessen »Tag schwer« ist.'
    reason: Lexikalische und idiomatische Alternative zu לִקְשֵׁה יוֹם und אֶבְיוֹן.
lexical_decisions:
- source_word: אִם לֹא
  choice: Habe ich nicht …?
  rationale: Die Verbindung leitet hier eine rhetorische Frage ein und bewahrt so den Ton von Hiobs Selbstverteidigung.
- source_word: בָכִיתִי
  choice: geweint
  rationale: Das Verb bezeichnet tatsächliches Weinen und wahrt das emotionale sowie poetische Gewicht.
- source_word: לִקְשֵׁה יוֹם
  choice: um den, der einen schweren Tag durchmachte
  rationale: Die Formulierung hält am hebräischen Bild des »schweren Tages« fest, gibt die betroffene Person im Deutschen aber verständlich wieder.
- source_word: עָגְמָה
  choice: war betrübt
  rationale: Das Verb drückt schmerzliche Trauer aus und bildet eine natürliche Parallele zum Weinen.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Die poetische Selbstbezeichnung des Hebräischen bleibt erhalten, ohne sie auf einen technisch definierten, immateriellen Seelenteil einzuengen.
- source_word: לָאֶבְיוֹן
  choice: über den Armen
  rationale: אֶבְיוֹן bezeichnet einen armen oder bedürftigen Menschen; »der Arme« ist knapp, würdig und im Deutschen idiomatisch.
theological_decisions:
- issue: Anthropologische Bedeutung von נַפְשִׁי
  choice: »meine Seele« als poetische Bezeichnung für Hiobs inneres Selbst
  alternative: »ich« oder »mein Innerstes«
  rationale: Die Wiedergabe bewahrt die Bildsprache des Ausgangstextes, ohne daraus eine bestimmte Lehre über die Beschaffenheit des Menschen abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. Das Bild vom »schweren Tag« wird bewahrt und zugleich durch »durchmachte« natürlich verständlich gemacht.
