source:
  edition: WLC
  text: אֲשַׁוַּ֣ע אֵ֭לֶי/ךָ וְ/לֹ֣א תַעֲנֵ֑/נִי עָ֝מַ֗דְתִּי וַ/תִּתְבֹּ֥נֶן בִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/020.yaml
  text: I cry out to you[a], but you do not answer me; I stand, and you only look at me.
translation:
  language: de
  text: Ich schreie zu dir, doch du antwortest mir nicht; ich stehe da, und du siehst mich nur an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich stand da, und du sahst mich aufmerksam an.« Das Hebräische kann hier vergangenheitsbezogen verstanden werden; das Verb kann auch ein aufmerksames Betrachten oder Erwägen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשַׁוַּע
  choice: Ich schreie
  rationale: Das Piel von שׁוע bezeichnet einen dringlichen Hilferuf. »Ich schreie« bewahrt die Intensität, ohne den Inhalt des Rufes näher festzulegen.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Die Präposition אֶל mit Suffix der 2. Person Singular wird im Deutschen natürlich mit »zu dir« wiedergegeben.
- source_word: וְלֹא תַעֲנֵנִי
  choice: doch du antwortest mir nicht
  rationale: ענה bedeutet hier unmittelbar »antworten«. »Doch« bringt den im Zusammenhang ausgedrückten Gegensatz hervor, ohne die Aussage zu verstärken.
- source_word: עָמַדְתִּי
  choice: ich stehe da
  rationale: Obwohl die Verbform formal ein Perfekt ist, kann sie im poetischen Zusammenhang als gegenwärtiger Zustand innerhalb der fortdauernden Klage verstanden werden. »Da« klingt im Deutschen natürlich und bezeichnet keine zusätzliche Handlung.
- source_word: וַתִּתְבֹּנֶן בִּי
  choice: und du siehst mich nur an
  rationale: התבונן kann aufmerksames Hinsehen oder Betrachten bezeichnen. »Nur« macht den Kontrast zum ausbleibenden Antworten deutlich, ohne Gott ausdrücklich Ignorieren oder Untätigkeit zuzuschreiben.
theological_decisions:
- issue: Stärke der Aussage über Gottes ausbleibende Reaktion
  choice: Die Klage über die nicht beantwortete Bitte und Gottes bloßes Ansehen wird beibehalten.
  alternative: »Du rettest mich nicht« oder »du ignorierst mich«
  rationale: Der hebräische Text spricht ausdrücklich vom Nicht-Antworten und vom Ansehen, nicht jedoch vom Nicht-Retten oder Ignorieren. So bleibt die theologische Spannung der Klage erhalten.
- issue: Zeitbezug der zweiten Vershälfte
  choice: Präsentische Wiedergabe im Zusammenhang der fortdauernden Klage
  alternative: »Ich stand da, und du sahst mich aufmerksam an.«
  rationale: Die hebräischen Verbformen erlauben eine vergangenheitsbezogene Lesart. Der poetische Zusammenhang kann jedoch auch als lebendige gegenwärtige Klage wiedergegeben werden; die Alternative wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die direkte Anrede und die Intensität der Klage bleiben erhalten; interpretierende Zusätze wie »retten« oder »ignorieren« werden vermieden.
