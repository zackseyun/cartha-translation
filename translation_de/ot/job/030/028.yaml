  yaml_path: translation/ot/job/030/028.yaml
  text: I go about darkened[a], but not by the sun[b]; I stand up in the assembly and cry for help.
translation:
  language: de
  text: Dunkel[a] gehe ich umher, doch ohne Sonne[b]; in der Versammlung stehe ich auf und schreie um Hilfe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „trauernd“ oder „schwarz“. Das hebräische Wort kann sowohl Trauer als auch ein dunkles Aussehen anklingen lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ohne Sonne“. Im Zusammenhang kann dies bedeuten, dass sein dunkler Zustand nicht durch Sonneneinwirkung verursacht ist; die knappe hebräische Formulierung lässt die genaue Beziehung offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֵר
  choice: verdunkelt
  rationale: Das Partizip von קדר kann einen dunklen oder geschwärzten Zustand ebenso wie Trauer bezeichnen. „Verdunkelt“ hält die körperliche und die seelische Bilddimension offen.
- source_word: הִלַּכְתִּי
  choice: gehe ich umher
  rationale: Die Präsensform gibt den fortdauernden Zustand in der poetischen Klage natürlich wieder; „umhergehen“ entspricht der kontextuellen Verwendung von הלך.
- source_word: בְּלֹא חַמָּה
  choice: doch nicht von der Sonne
  rationale: 'Die knappe Formulierung bewahrt das wörtliche Bild („nicht durch/von der Sonne“) und den naheliegenden Gegensatz: Hiobs Verdunkelung stammt nicht von Sonneneinwirkung.'
- source_word: קַמְתִּי
  choice: ich stehe ... auf
  rationale: קום bezeichnet hier sein öffentliches Aufstehen innerhalb der versammelten Gemeinschaft.
- source_word: בַקָּהָל
  choice: in der Versammlung
  rationale: „Versammlung“ gibt קהל allgemein wieder, ohne spätere kirchliche Vorstellungen einzutragen.
- source_word: אֲשַׁוֵּעַ
  choice: schreie um Hilfe
  rationale: Das Piel von שוע bezeichnet einen dringlichen Hilferuf; die Wendung ist im modernen Deutsch klar und bewahrt die Intensität der Klage.
