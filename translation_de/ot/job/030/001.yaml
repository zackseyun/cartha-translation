  text: וְ/עַתָּ֤ה שָֽׂחֲק֣וּ עָלַ/י֮ צְעִירִ֥ים מִמֶּ֗/נִּי לְ/יָ֫מִ֥ים אֲשֶׁר מָאַ֥סְתִּי אֲבוֹתָ֑/ם לָ֝/שִׁ֗ית עִם כַּלְבֵ֥י צֹאנִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/001.yaml
  text: But now those younger than I laugh at me[a], whose fathers I refused to set with the dogs of my flock.
translation:
  language: de
  text: Doch jetzt lachen über mich Männer, die jünger sind als ich – Männer, deren Väter ich verschmähte, sie zu den Hunden meiner Herde zu stellen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu meinen Hütehunden«. Wörtlich steht im Hebräischen: »zu den Hunden meiner Herde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Doch jetzt
  rationale: Kennzeichnet den scharfen Gegensatz zwischen Ijobs früherem Ansehen und seiner jetzigen Erniedrigung.
- source_word: שָׂחֲקוּ עָלַי
  choice: lachen über mich
  rationale: Bewahrt das konkrete Bild des Lachens; der Zusammenhang macht den höhnischen Sinn deutlich.
- source_word: צְעִירִים מִמֶּנִּי לְיָמִים
  choice: Männer, die jünger sind als ich
  rationale: לְיָמִים bezeichnet idiomatisch das Lebensalter. Der maskuline Zusammenhang mit ihren Vätern legt hier »Männer« nahe.
- source_word: אֲשֶׁר מָאַסְתִּי ... לָשִׁית
  choice: deren Väter ich verschmähte und nicht einmal ... gestellt hätte
  rationale: מָאַס bezeichnet ablehnende Geringschätzung. Die deutsche Konstruktion bringt den Sinn einer als unwürdig verworfenen Einordnung natürlich zum Ausdruck; »nicht einmal« verdeutlicht die im Vergleich liegende Herabsetzung, ohne ein neues Sachdetail einzuführen.
- source_word: עִם כַּלְבֵי צֹאנִי
  choice: zu den Hunden meiner Herde
  rationale: Gibt die konkrete und bewusst grobe hebräische Wendung wieder, ohne sie im Haupttext auf die funktionale Deutung »Hütehunde« festzulegen.
theological_decisions: []
