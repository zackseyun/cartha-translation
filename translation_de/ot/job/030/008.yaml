source:
  edition: WLC
  text: בְּֽנֵי נָ֭בָל גַּם בְּנֵ֣י בְלִי שֵׁ֑ם נִ֝כְּא֗וּ מִן הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/008.yaml
  text: Sons of fools[a], indeed sons without a name[c][b], they were scourged from the land.
translation:
  language: de
  text: Söhne von Toren, ja, Söhne ohne Namen[a], wurden aus dem Land vertrieben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Söhne ohne Namen« ist eine hebräische Wendung für Menschen ohne gesellschaftliches Ansehen oder Ehre.
    reason: cultural_note
  - marker: b
    text: 'Das seltene hebräische Verb kann auch bedeuten: »wurden aus dem Land hinausgeschlagen«; die genaue Nuance zwischen gewaltsamem Schlagen und Vertreibung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נָבָל
  choice: Söhne von Toren
  rationale: Die Konstruktion bezeichnet Männer, die einer verachteten Gruppe zugerechnet werden. »Toren« bewahrt neben mangelnder Einsicht auch den moralisch-sozialen Tadel von נָבָל.
- source_word: גַּם
  choice: ja
  rationale: Hier verstärkt und ergänzt גַּם die zweite, appositionelle Bezeichnung; »ja« klingt im Deutschen natürlich und gibt den Nachdruck knapp wieder.
- source_word: בְּנֵי בְלִי שֵׁם
  choice: Söhne ohne Namen
  rationale: Die weitgehend wörtliche Wiedergabe erhält das hebräische Bild. Gemeint sind Menschen ohne gesellschaftliches Ansehen oder Ehre; dies wird in einer Fußnote erläutert.
- source_word: נִכְּאוּ
  choice: wurden … vertrieben
  rationale: Das seltene Verb kann gewaltsames Schlagen oder Vertreibung bezeichnen. Zusammen mit מִן הָאָרֶץ liegt im Kontext die resultative Bedeutung »vertrieben« nahe, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: מִן הָאָרֶץ
  choice: aus dem Land
  rationale: אֶרֶץ bezeichnet hier am ehesten den bewohnten Lebensraum beziehungsweise das Land, aus dem die Genannten ausgeschlossen wurden, nicht die Erde im kosmischen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Formulierung »Söhne von … / Söhne ohne …« bewahrt die markante hebräische Sozialcharakterisierung; die seltene Verbform wird kontextgemäß übersetzt und zugleich in der Fußnote offengehalten.
