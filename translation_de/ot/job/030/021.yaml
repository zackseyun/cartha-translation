  rationale: Die Revision ersetzt allein das im heutigen Deutsch ungebräuchliche „feindest du mich an“ durch „gehst du gegen mich vor“. Dies gibt die aktive Gegnerschaft von תִשְׂטְמֵנִי natürlich wieder und vermeidet es, durch „verfolgen“ oder „angreifen“ eine mögliche spezifischere Nuance als alleinige Deutung festzulegen. Die poetische Direktheit und die anthropomorphe Bildsprache bleiben erhalten.
