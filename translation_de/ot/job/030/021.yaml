  text: Du bist grausam zu mir geworden[a]; mit der Kraft deiner Hand gehst du gegen mich vor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast dich mir gegenüber als erbarmungslos erwiesen.“'
