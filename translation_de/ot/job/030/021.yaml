  source_fidelity: Die Übersetzung gibt den Zustandswechsel in תֵּהָפֵךְ, die Grausamkeit von אַכְזָר, die instrumentale Wendung „mit der Kraft deiner Hand“ und die konkrete Handmetapher treffend wieder. Für תִשְׂטְמֵנִי ist „anfeinden“ semantisch grundsätzlich möglich, doch die gewählte Satzform klingt im heutigen Standarddeutsch unnötig ungebräuchlich. „gegen mich vorgehen“ bewahrt die aktive, feindselige Handlung, ohne die umstrittene Nuance zu eng auf „verfolgen“ oder „angreifen“ festzulegen.
  naturalness: „Du bist grausam zu mir geworden“ ist verständlich und stilistisch passend. „Mit der Kraft deiner Hand feindest du mich an“ ist zwar grammatisch möglich, wirkt aber archaisierend und im modernen Standarddeutsch wenig idiomatisch. „gehst du gegen mich vor“ ist klar und natürlich, bei weiterhin würdig-poetischem Register.
  terminology: Die Begriffe „grausam“, „Kraft“ und „Hand“ sind angemessen. Die Fußnoten sollen die möglichen stärkeren Konkretisierungen von שׂטם als Verfolgung oder Angriff weiterhin kenntlich machen.
