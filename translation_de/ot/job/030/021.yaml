lexical_decisions:
- source_word: תֵּהָפֵךְ
  choice: du bist … geworden
  rationale: Der Nifal von הפך bezeichnet hier einen Zustandswandel. „Bist … geworden“ gibt diesen Wandel im Deutschen natürlich wieder, ohne eine ausdrücklich reflexive Bedeutung festzulegen.
- source_word: לְאַכְזָר
  choice: grausam
  rationale: אַכְזָר bezeichnet Grausamkeit beziehungsweise Erbarmungslosigkeit. Als prädikatives Adjektiv ist „grausam“ direkt, verständlich und idiomatisch.
- source_word: לִי
  choice: zu mir
  rationale: Die Präposition bezeichnet die auf Hiob gerichtete Beziehung. „Zu mir“ bewahrt die hebräische Ausdrucksweise, während die feindliche Bedeutung aus dem Prädikat hervorgeht.
- source_word: בְּעֹצֶם
  choice: mit der Kraft
  rationale: עֹצֶם kann Stärke, Macht oder Wucht bezeichnen; mit instrumentellem בְּ ergibt sich natürlich „mit der Kraft“.
- source_word: יָדְךָ
  choice: deiner Hand
  rationale: Die konkrete Hand-Metapher wird beibehalten und nicht abstrakt als „Macht“ aufgelöst.
- source_word: תִשְׂטְמֵנִי
  choice: feindest du mich an
  rationale: שׂטם bezeichnet feindseliges Verhalten, Anfeindung oder Verfolgung. „Anfeinden“ bewahrt die aktive Feindschaft, ohne zwingend eine länger andauernde Verfolgung anzunehmen.
theological_decisions:
- issue: Anthropomorphe und anklagende Rede über Gottes Handeln
  choice: Die direkte Anrede und das konkrete Bild von Gottes Hand bleiben unverändert erhalten.
  alternative: 'Die Aussage abschwächen oder abstrahieren, etwa: „Deine Macht stellt sich gegen mich.“'
  rationale: Hiobs Klage richtet eine scharfe Anschuldigung unmittelbar an Gott. Die Übersetzung bewahrt diese theologische Spannung, statt sie erklärend zu mildern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele poetische Struktur, die direkte Gottesrede und das anschauliche Bild der Hand werden bewahrt; „feindest du mich an“ ist gehoben, aber allgemein verständlich und gibt die feindselige Handlung präzise wieder.
