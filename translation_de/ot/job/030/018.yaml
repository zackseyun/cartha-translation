  naturalness: Die Formulierung ist insgesamt klar und würdevoll. »Wie die Öffnung meines Untergewands schnürt es mich ein« ist zwar verständlich, aber »umschließt es mich« bildet die Kleidungsmetapher und die Grundbedeutung von אזר (umgürten) etwas unmittelbarer ab.
  terminology: »Gewand« und »Öffnung« sind angemessen. »Tunika« ist für כֻּתֹּנֶת der etablierte, nicht unnötig spezifizierende deutsche Begriff. Die Anmerkung zum schwierigen Verb soll ebenfalls beim Gewand als grammatischem Bild bleiben, statt unmittelbar zu behaupten, Ijob selbst werde entstellt.
