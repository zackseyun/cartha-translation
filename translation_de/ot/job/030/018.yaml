  text: By great force my garment is disfigured[b][a]; like the collar of my tunic it binds me.
translation:
  language: de
  text: Mit großer Kraft wird mein Gewand entstellt[a]; wie die Öffnung meiner Tunika[b] umschließt es mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird mein Gewand verändert«; möglicherweise auch: »packt er mein Gewand«. Das hebräische Verb ist schwierig. Die Zeile wird meist so verstanden, dass Ijobs Leiden sein Gewand bildhaft als entstellt oder einengend erscheinen lässt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »wie der Mund meiner Tunika«, das heißt deren Öffnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָב כֹּחַ
  choice: Mit großer Kraft
  rationale: Die Präposition בְּ mit רָב כֹּחַ bezeichnet hier wahrscheinlich Mittel oder Intensität. Die Wendung bleibt bewusst ohne ausdrücklich genanntes handelndes Subjekt.
- source_word: יִתְחַפֵּשׂ
  choice: wird entstellt
  rationale: Das Hitpael von חפשׂ ist an dieser Stelle schwierig. Im Zusammenhang der körperlichen Not und des Kleidungsbildes bezeichnet es wahrscheinlich ein gewaltsames Verändern oder Entstellen; die möglichen Alternativen werden in der Fußnote offengehalten.
- source_word: לְבוּשִׁי
  choice: mein Gewand
  rationale: לְבוּשׁ bezeichnet allgemein ein Kleidungsstück. »Gewand« bewahrt den Singular und passt zum poetischen Parallelbild.
- source_word: כְּפִי
  choice: wie die Öffnung meines Untergewands
  rationale: פִּי bedeutet wörtlich »Mund«, bei einem Kleidungsstück jedoch dessen Öffnung. »Öffnung« ist genauer als das stärker deutende »Kragen«.
- source_word: כֻתָּנְתִּי
  choice: meines Untergewands
  rationale: כֻּתֹּנֶת bezeichnet ein am Körper getragenes tunikaartiges Kleidungsstück. »Untergewand« ist im biblischen Kontext verständlich und weniger fremdsprachlich als »Tunika«.
- source_word: יַאַזְרֵנִי
  choice: schnürt es mich ein
  rationale: אזר bedeutet »umgürten«. Hier legt das Bild der Kleidungsöffnung eine bedrängende Umschließung nahe; »schnürt mich ein« gibt diesen restriktiven Sinn natürlich wieder.
