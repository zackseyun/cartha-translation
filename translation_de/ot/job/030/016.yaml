    rationale: Die hebräische Präposition bedeutet formal „auf/über mich“, doch in dieser Wendung beschreibt sie wahrscheinlich das innere Zusammenbrechen bzw. Ausgeschüttetsein des Selbst. Deutsch „über mir“ legt nahe, die Seele befinde sich räumlich oberhalb Hiobs. „In mir“ gibt den Sinn idiomatisch wieder; die wörtlichere Alternative soll die Fußnote dokumentieren.
  - severity: low
    issue: Die Fußnote sollte die formale Alternative als „über mich/auf mich“ statt „über/auf mir“ formulieren.
    rationale: Die Suffixform עָלַי bezieht sich auf die erste Person; „über mich“ bildet die formale deutsche Alternative genauer und passt besser zur Bewegungsmetapher des Ausgießens.
