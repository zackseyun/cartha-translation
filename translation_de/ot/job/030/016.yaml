  source_fidelity: 'Die Grundstruktur und die lexikalischen Entscheidungen treffen den hebräischen Text gut: וְעַתָּה wird angemessen als „Und nun“ wiedergegeben, נפשי als „meine Seele“, und ימי עני als „Tage des Elends“. Bei עָלַי ist jedoch „über mir“ keine gute deutsche Entsprechung: Es erzeugt vor allem ein räumliches Bild oberhalb des Sprechers. Die mit der Wendung gemeinte innere Erschöpfung wird mit „in mir“ idiomatisch und kontextgerecht wiedergegeben, während die formale Alternative in der Fußnote erhalten bleibt.'
  naturalness: „Ergießt sich meine Seele über mir“ ist im modernen Deutschen missverständlich und nicht natürlich. „Ergießt sich meine Seele in mir“ ist als poetische Metapher verständlich und bewahrt das Bild des Ausgegossenseins. Der zweite Halbvers ist klar und poetisch angemessen.
  terminology: „Seele“, „Elend“ und „ergreifen“ sind für den poetischen Registerzusammenhang passend. „Elend“ lässt die Bedeutung von עֹנִי als umfassende Not bzw. Bedrängnis offen und engt sie nicht auf Armut ein.
  issues:
