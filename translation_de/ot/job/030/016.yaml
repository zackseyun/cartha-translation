lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die zeitliche Markierung als auch die verbindende Funktion, ohne den Zusammenhang ausdrücklich adversativ zu deuten.
- source_word: עָלַי
  choice: über mir
  rationale: Gibt die hebräische Präposition formal wieder und erhält das ungewöhnliche, mehrdeutige Bild; die im Deutschen idiomatischere Deutung „in mir“ wird in der Fußnote genannt.
- source_word: תִּשְׁתַּפֵּךְ
  choice: ergießt sich
  rationale: Bewahrt den reflexiven Stamm und das Bild des Ausgießens in natürlichem poetischem Deutsch.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Erhält die poetische und anthropologische Weite von נֶפֶשׁ, das hier das innere Selbst beziehungsweise Leben bezeichnet.
- source_word: יֹאחֲזוּנִי
  choice: ergreifen mich
  rationale: Gibt das kräftige Zugreifen von אחז prägnant wieder und passt zum gehobenen poetischen Register.
- source_word: יְמֵי עֹנִי
  choice: Tage des Elends
  rationale: „Elend“ deckt hier umfassend Not, Leiden und Erniedrigung ab, ohne den Ausdruck auf wirtschaftliche Armut zu verengen.
