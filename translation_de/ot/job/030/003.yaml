translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die kurze Reihung „Öde und Verwüstung“ wahrt die Härte des hebräischen Bildes; seltene oder syntaktisch unsichere Ausdrücke werden nicht stillschweigend harmonisiert, sondern in den Fußnoten kenntlich gemacht.
