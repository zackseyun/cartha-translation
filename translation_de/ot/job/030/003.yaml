  yaml_path: translation/ot/job/030/003.yaml
  text: Through want and hunger they are gaunt[b][a], gnawing the dry ground in the night of desolation and waste.
translation:
  language: de
  text: Von Mangel und Hunger ausgemergelt, nagen sie am dürren Land[a], nachts[b], in Öde und Verwüstung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie scharren im dürren Land“ beziehungsweise „sie fliehen ins dürre Land“. Das zugrunde liegende hebräische Wort ist selten und seine Bedeutung hier unsicher.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bedeutet gewöhnlich „gestern“ oder „letzte Nacht“. Seine Bedeutung und syntaktische Zuordnung sind hier unsicher; die Wiedergabe „nachts“ folgt einer in diesem poetischen Zusammenhang möglichen Deutung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֶסֶר וּבְכָפָן
  choice: Von Mangel und Hunger
  rationale: Die Präposition בְ bezeichnet hier am natürlichsten den Umstand oder die Ursache ihres elenden Zustands. חֶסֶר meint Mangel oder Entbehrung, כָּפָן persönlichen Hunger bis hin zum Verhungern.
- source_word: גַּלְמוּד
  choice: ausgemergelt
  rationale: Das seltene Adjektiv bezeichnet hier im Zusammenhang wahrscheinlich einen durch Entbehrung verdorrten oder abgezehrten Zustand. „Ausgemergelt“ ist im Deutschen anschaulich und idiomatisch, ohne die schwierige Stelle unnötig zu verengen.
- source_word: הָעֹרְקִים
  choice: nagen sie
  rationale: Die Form ist selten und ihre Bedeutung umstritten. Im Zusammenhang mit der Nahrungssuche in Vers 4 ist ein verzweifeltes Nagen oder Abschaben des kargen Bodens plausibel. Die Unsicherheit wird in Fußnote [a] offengelegt.
- source_word: צִיָּה
  choice: am dürren Land
  rationale: צִיָּה bezeichnet trockenes, ausgedörrtes Land oder eine dürre Gegend. „Dürres Land“ bewahrt das konkrete Bild und passt idiomatisch zu „nagen an“.
- source_word: אֶמֶשׁ
  choice: nachts
  rationale: אֶמֶשׁ bedeutet gewöhnlich „gestern“ oder „letzte Nacht“, kann hier im schwierigen poetischen Zusammenhang jedoch zeitlich auf die Nacht bezogen werden. „Nachts“ ergibt einen knappen, verständlichen Satz; die Alternativen werden in Fußnote [b] genannt.
- source_word: שׁוֹאָה וּמְשֹׁאָה
  choice: Öde und Verwüstung
  rationale: Das klanglich eng verbundene Wortpaar steigert das Bild völliger Verlassenheit und Zerstörung. „Öde und Verwüstung“ erhält sowohl die Parallelität als auch den düsteren poetischen Ton.
