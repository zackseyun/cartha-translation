  text: תִּשָּׂאֵ֣/נִי אֶל ר֭וּחַ תַּרְכִּיבֵ֑/נִי וּ֝/תְמֹגְגֵ֗/נִי תשוה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/022.yaml
  text: You lift me up to the wind[a]; you make me ride on it[b], and you toss me about in the storm.
translation:
  language: de
  text: Du hebst mich empor in den Wind[a], lässt mich auf ihm dahinfahren und lässt mich im Sturm zergehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du hebst mich auf den Wind und lässt mich auf ihm reiten.«'
    reason: lexical_alternative
  - marker: b
    text: 'Das letzte hebräische Wort ist schwer zu deuten. Es kann auf Sturm, brausendes Getöse oder Verderben bezogen werden. Daher wird die Zeile auch übersetzt: »Du wirfst mich im Sturm hin und her« oder: »Du lässt mich ins Verderben zergehen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשָּׂאֵנִי
  choice: Du hebst mich empor
  rationale: נשׂא bezeichnet das Heben, Tragen oder Forttragen. »emporheben« bewahrt das konkrete Bild und passt zum anschließenden Getragenwerden durch den Wind.
- source_word: אֶל רוּחַ
  choice: in den Wind
  rationale: רוּחַ kann »Wind«, »Atem« oder »Geist« bedeuten. Das Bild vom Dahinfahren und die zerstörerische Szenerie sprechen hier für »Wind«; אֶל wird richtungsbezogen mit »in« wiedergegeben.
- source_word: תַּרְכִּיבֵנִי
  choice: lässt mich auf ihm dahinfahren
  rationale: Der Hifil von רכב bedeutet »reiten/fahren lassen«. Das ergänzte »auf ihm« nimmt den Wind auf; »dahinfahren« klingt im Deutschen bei diesem poetischen Windbild natürlicher als »reiten«.
- source_word: וּתְמֹגְגֵנִי
  choice: lässt mich … zergehen
  rationale: מוג bezeichnet ein Schmelzen, Zerfließen oder inneres Vergehen. »zergehen« erhält dieses Bild des Aufgelöstwerdens, ohne die schwierige Schlussform vorschnell als bloßes Umherschleudern umzudeuten.
- source_word: תשוה
  choice: im Sturm
  rationale: Die Schlussform ist textlich und lexikalisch schwierig. Eine kontextuelle Deutung als Sturm, Getöse oder zerstörerischer Tumult verbindet sie mit dem Windbild; die Unsicherheit wird in der Fußnote offengelegt.
theological_decisions:
- issue: Gott als unmittelbar Handelnder in Hiobs Klage
  choice: Die direkte Anrede und alle Handlungen bleiben Gott zugeschrieben.
  alternative: Die Vorgänge unpersönlich als Wirkung des Sturms darstellen.
  rationale: Die hebräischen Verben stehen in der zweiten Person Singular. Die Übersetzung bewahrt damit die theologische Spannung von Hiobs Anklage, ohne sie zu erklären oder abzuschwächen.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die wiederholte Konstruktion »lässt mich« bildet die hebräische Verursachungsform natürlich ab. »zergehen« bewahrt das Auflösungsbild des Verbs; die unsichere Schlussform wird im Haupttext kontextuell und in der Fußnote transparent wiedergegeben.
