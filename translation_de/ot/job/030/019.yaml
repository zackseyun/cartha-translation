  text: הֹרָ֥/נִי לַ/חֹ֑מֶר וָ֝/אֶתְמַשֵּׁ֗ל כֶּ/עָפָ֥ר וָ/אֵֽפֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/019.yaml
  text: He has thrown me into the mire[b][a], and I have become like dust and ashes.
translation:
  language: de
  text: Er hat mich in den Schlamm[a] geworfen, und ich bin wie Staub und Asche geworden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Lehm“ bzw. „in den Morast“. Das hebräische Wort kann Ton, Lehm oder Schlamm bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und ich bin Staub und Asche gleich geworden“. Die hebräische Form kann auch eine stärker passive Nuance haben.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֹרָנִי
  choice: Er hat mich … geworfen
  rationale: Die Hifil-Form mit Suffix der 1. Person Singular bezeichnet hier ein kraftvolles Werfen. Das unausgesprochene Subjekt der 3. Person Singular wird dem Zusammenhang entsprechend mit „Er“ wiedergegeben.
- source_word: לַחֹמֶר
  choice: in den Schlamm
  rationale: חֹמֶר kann Ton, Lehm oder Schlamm bezeichnen. Im Bild der Erniedrigung ist „Schlamm“ im heutigen Deutsch anschaulich und natürlich.
- source_word: וָאֶתְמַשֵּׁל
  choice: ich bin … geworden
  rationale: 'Die Form vermittelt einen resultativen, reflexiv-passiven Sinn: Hiob ist etwas anderem gleich bzw. ähnlich geworden. Die gewählte Formulierung ist idiomatisch und lässt die Vergleichspartikel des folgenden Ausdrucks zur Geltung kommen.'
- source_word: כֶּעָפָר וָאֵפֶר
  choice: wie Staub und Asche
  rationale: Die Vergleichspartikel כ wird mit „wie“ wiedergegeben; das feste Bildpaar „Staub und Asche“ bewahrt die Motive von Vergänglichkeit und Erniedrigung.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Verbs הֹרָנִי
  choice: „Er“, im Zusammenhang auf Gott bezogen
  alternative: 'Unpersönliche oder subjektlose Wiedergabe, etwa: „In den Schlamm geworfen …“'
  rationale: Die hebräische Verbform hat ein maskulines Subjekt der 3. Person Singular; im unmittelbaren Redezusammenhang ist Gott gemeint. „Er“ macht die Grammatik verständlich, ohne eine zusätzliche Deutung einzutragen.
- issue: Bedeutung von וָאֶתְמַשֵּׁל
  choice: 'Resultativer Zustand: „ich bin wie … geworden“'
  alternative: 'Passivischer: „ich bin … gleichgestellt worden“'
  rationale: Die Form kann reflexiv bzw. passivisch verstanden werden. Die Hauptfassung bewahrt das Ergebnis des Vorgangs in natürlichem Deutsch; die stärker passivische Möglichkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schlamm“ ist allgemein verständlich und bewahrt das erniedrigende Bild; die vertraute Wendung „Staub und Asche“ erhält die biblische Bildsprache.
