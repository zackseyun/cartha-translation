  text: who pluck saltwort among the bushes[b][a], and the root of broom shrubs is their food.
translation:
  language: de
  text: die Salzkraut[a] zwischen den Sträuchern pflücken, und die Wurzel von Ginstersträuchern ist ihre Nahrung.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Malve“; welcher Pflanzenart das hebräische Wort genau entspricht, ist unsicher. Wahrscheinlich ist eine salzverträgliche Wildpflanze gemeint.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „ihr Brot“; „Brot“ steht hier im weiteren Sinn für Nahrung oder Lebensunterhalt.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּטְפִים
  choice: die … pflücken
  rationale: Das Partizip von קטף bezeichnet das Abpflücken von Pflanzen. Die substantivierte Form „die … pflücken“ setzt die Beschreibung der Menschen aus dem vorherigen Vers natürlich fort.
- source_word: מַלּוּחַ
  choice: Salzkraut
  rationale: Der genaue Pflanzenname ist unsicher; wahrscheinlich ist eine salzverträgliche Wildpflanze gemeint. „Salzkraut“ bewahrt diesen wahrscheinlichen Bezug, ohne eine vertraute Kulturpflanze nahezulegen.
- source_word: עֲלֵי שִׂיחַ
  choice: zwischen den Sträuchern
  rationale: על bezeichnet hier wahrscheinlich den Ort des Sammelns im Buschland. „Zwischen den Sträuchern“ ist im Deutschen natürlich und erhält das Bild karger Nahrungssuche.
- source_word: וְשֹׁרֶשׁ רְתָמִים
  choice: und Ginsterwurzel
  rationale: רתמים bezeichnet Ginstersträucher der Wüste. Die kompakte Kollektivbildung „Ginsterwurzel“ gibt die hebräische Verbindung aus singularischem „Wurzel“ und pluralischem Pflanzennamen idiomatisch wieder.
- source_word: לַחְמָם
  choice: ist ihre Nahrung
  rationale: לֶחֶם bedeutet wörtlich „Brot“, kann aber allgemein Nahrung oder Lebensunterhalt bezeichnen. Hier ist „Nahrung“ sachlich klarer, da die Wurzel selbst als karge Speise dient.
