  text: נָתְס֗וּ נְֽתִיבָ֫תִ֥/י לְ/הַוָּתִ֥/י יֹעִ֑ילוּ לֹ֖א עֹזֵ֣ר לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/013.yaml
  text: They tear up my path for my ruin[b][a]; they profit from it—there is no helper for them.
translation:
  language: de
  text: Sie zerstören meinen Weg; sie fördern mein Verderben[a] – sie haben keinen Helfer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ziehen Nutzen daraus«. Das hebräische Verb kann »nützen« oder »etwas fördern« bedeuten; wahrscheinlich ist hier gemeint, dass sie Jobs Verderben vorantreiben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ohne dass ihnen jemand hilft«. Die knappe hebräische Wendung kann besagen, dass sie keinen Helfer haben oder dass sie ohne fremde Hilfe handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְסוּ
  choice: reißen … auf
  rationale: Das Verb bezeichnet ein gewaltsames Niederreißen oder Zerstören. Bei einem Pfad gibt »aufreißen« das konkrete Bild natürlich wieder.
- source_word: נְתִיבָתִי
  choice: meinen Pfad
  rationale: נְתִיבָה bezeichnet einen Pfad oder eine Bahn. »Pfad« bewahrt sowohl das konkrete Bild als auch seine mögliche übertragene Bedeutung.
- source_word: לְהַוָּתִי
  choice: mein Verderben
  rationale: הַוָּה kann Unheil, Verderben oder Untergang bezeichnen. Im Zusammenhang drückt die Wendung aus, dass Jobs Verderben gefördert wird.
- source_word: יֹעִילוּ
  choice: treiben … voran
  rationale: Der Hifil von יעל kann »nützen«, »fördern« oder »voranbringen« bedeuten. Hier liegt als sinngemäßes Objekt Jobs Verderben aus dem vorhergehenden Ausdruck nahe.
- source_word: לֹא עֹזֵר לָמוֹ
  choice: sie haben keinen Helfer
  rationale: Die knappe Nominalkonstruktion wird eng am Hebräischen wiedergegeben und lässt offen, ob ihnen tatsächlich niemand beisteht oder ob sie ohne fremde Hilfe handeln.
