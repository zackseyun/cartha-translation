  text: Meine Haut ist an mir schwarz geworden[a], und meine Knochen brennen vor Hitze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Meine Haut wird schwarz und löst sich von mir ab.« Wörtlich: »Meine Haut ist schwarz geworden von auf mir«; die hebräische Wendung kann schwarze, sich ablösende Haut oder dunkel am Körper hängende Haut beschreiben.'
