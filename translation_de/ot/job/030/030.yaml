lexical_decisions:
- source_word: עוֹרִי
  choice: meine Haut
  rationale: עוֹר bezeichnet im menschlichen Zusammenhang natürlich die Haut.
- source_word: שָׁחַר
  choice: wird schwarz
  rationale: Das Verb beschreibt hier das Dunkel- oder Schwarzwerden und wird im Deutschen klar und bildkräftig wiedergegeben.
- source_word: מֵעָלָי
  choice: löst sich von mir ab
  rationale: Wörtlich steht »von über/auf mir«; im Zusammenhang einer erkrankten Haut liegt ein Ablösen oder Abfallen nahe, ohne dass die hebräische Wendung völlig eindeutig wäre.
- source_word: וְעַצְמִי
  choice: und meine Knochen
  rationale: Das morphologisch singularische עֶצֶם kann kollektiv gebraucht sein; der deutsche Plural ist hier idiomatisch.
- source_word: חָרָה
  choice: brennen
  rationale: חרה vermittelt die Vorstellung des Brennens oder Heißwerdens und bewahrt das starke Körperbild.
- source_word: מִנִּי
  choice: vor
  rationale: Die Präposition bezeichnet hier die Ursache des Brennens; »vor Hitze« ist natürliches Deutsch.
- source_word: חֹרֶב
  choice: Hitze
  rationale: חֹרֶב bezeichnet Hitze beziehungsweise trockene Glut; »Hitze« bleibt breiter und weniger deutend als »Fieber«.
