  text: At night my bones are pierced in me[b][a], and my gnawing pains do not lie down.
translation:
  language: de
  text: Nachts werden meine Knochen in mir durchbohrt[a], und meine Sehnen[b] kommen nicht zur Ruhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische hat wörtlich etwa: »von über mir«. Die Wendung ist schwierig; das Verb kann auch allgemeiner im Sinn von »nagen« verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Adern« beziehungsweise »Gefäße«; das seltene hebräische Wort kann körperliche Stränge oder Kanäle bezeichnen. Manche verstehen es hier übertragen als »nagende Schmerzen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה
  choice: Nachts
  rationale: Die adverbiale Zeitangabe wird im modernen Deutschen knapp und natürlich mit »Nachts« wiedergegeben.
- source_word: עֲצָמַי
  choice: meine Knochen
  rationale: Die konkrete Körpermetaphorik des hebräischen Plurals bleibt erhalten.
- source_word: נִקַּר
  choice: werden … durchbohrt
  rationale: Das Verb bezeichnet ein Bohren oder Durchbohren. Die deutsche Pluralkongruenz richtet sich natürlich nach »meine Knochen«, auch wenn die hebräische Verbform im Singular steht.
- source_word: מֵעָלָי
  choice: in mir
  rationale: Die hebräische Präpositionalverbindung ist schwer verständlich und lautet sehr wörtlich etwa »von über/auf mir«. Im Zusammenhang innerer körperlicher Qual wird sie idiomatisch mit »in mir« wiedergegeben, ohne die Unsicherheit zu verschweigen.
- source_word: וְעֹרְקַי
  choice: und meine Sehnen
  rationale: Das seltene Substantiv bezeichnet vermutlich körperliche Stränge oder Kanäle; »Sehnen« bewahrt das konkrete Körperbild und vermeidet, die mögliche übertragene Bedeutung »Schmerzen« vorschnell festzulegen.
- source_word: לֹא יִשְׁכָּבוּן
  choice: kommen nicht zur Ruhe
  rationale: Wörtlich »legen sich nicht hin«. Die Wiedergabe bewahrt das Bild fehlender Ruhe und klingt im Deutschen natürlich.
