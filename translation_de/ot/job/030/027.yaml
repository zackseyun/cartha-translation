  text: מֵעַ֖/י רֻתְּח֥וּ וְ/לֹא דָ֗מּוּ קִדְּמֻ֥/נִי יְמֵי עֹֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/027.yaml
  text: My inward parts boil and do not rest[a]; days of affliction confront me.
translation:
  language: de
  text: Mein Inneres kocht und kommt nicht zur Ruhe[a]; Tage des Elends sind mir entgegengetreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Eingeweide sieden und stehen nicht still; Tage der Bedrängnis sind mir begegnet.“'
    reason: Lexikalische Alternativen bewahren die körperlichere Wiedergabe von מֵעַי sowie die Bedeutungsbreite von דמם, עֹנִי und קדם.
lexical_decisions:
- source_word: מֵעַי
  choice: mein Inneres
  rationale: מֵעֶה bezeichnet wörtlich die inneren Organe beziehungsweise Eingeweide und poetisch das tiefste Innere. „Mein Inneres“ bewahrt die leiblich-seelische Bildhaftigkeit, ohne das heute leicht missverständliche „Eingeweide“ zu verwenden.
- source_word: רֻתְּחוּ
  choice: kocht
  rationale: Die Form von רתח bezeichnet Kochen oder Sieden. „Kocht“ gibt das heftige körperliche Bild knapp und natürlich wieder.
- source_word: וְלֹא דָמּוּ
  choice: und kommt nicht zur Ruhe
  rationale: דמם kann still sein, schweigen oder aufhören bedeuten. Bezogen auf das als Einheit aufgefasste „Innere“ drückt „kommt nicht zur Ruhe“ die anhaltende Unruhe idiomatisch aus.
- source_word: קִדְּמֻנִי
  choice: treten mir entgegen
  rationale: קדם bezeichnet hier das Entgegenkommen oder Begegnen. „Treten mir entgegen“ erhält die Personifizierung der leidvollen Tage und lässt ihre feindselige Wirkung erkennen, ohne sie stärker als der hebräische Ausdruck festzulegen.
- source_word: יְמֵי עֹנִי
  choice: Tage des Elends
  rationale: עֹנִי kann Elend, Bedrängnis, Leiden oder Armut bezeichnen. Im Zusammenhang von Hiobs Klage umfasst „Elend“ seinen leidvollen Zustand, ohne ihn auf wirtschaftliche Armut zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Körpermetaphorik. Der Singular „kommt“ fasst „mein Inneres“ im Deutschen als Einheit auf; das hebräische Verb steht entsprechend der pluralischen Körperbezeichnung im Plural.
