  text: I have become a brother to jackals[a], and a companion to ostriches.
translation:
  language: de
  text: Ich bin den Schakalen zum Bruder geworden und den Straußen[a] zum Gefährten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Töchtern der Straußin“; eine hebräische Bezeichnung für Strauße.'
