lexical_decisions:
- source_word: אָח
  choice: Bruder
  rationale: Das Substantiv bedeutet wörtlich „Bruder“ und bewahrt hier das poetische Bild enger Zugehörigkeit zu Tieren der Einöde.
- source_word: הָיִיתִי
  choice: bin … geworden
  rationale: Das Qal-Perfekt der 1. Person Singular von היה bezeichnet hier einen entstandenen Zustand; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: לְתַנִּים
  choice: den Schakalen
  rationale: תַנִּים bezeichnet in poetischen Schilderungen verwüsteter oder einsamer Orte wahrscheinlich Schakale; das Präfix ל wird entsprechend der deutschen Fügung mit „zum Bruder werden“ wiedergegeben.
- source_word: וְרֵעַ
  choice: und … zum Gefährten
  rationale: רֵעַ kann einen Freund, Gefährten oder Genossen bezeichnen. „Gefährte“ erhält den Parallelismus zu „Bruder“, ohne besondere emotionale Vertrautheit vorauszusetzen.
- source_word: לִבְנוֹת יַעֲנָה
  choice: den Straußen
  rationale: Die wörtliche Wendung „Töchter des Straußes“ bezeichnet Strauße. Im Haupttext steht die natürliche deutsche Tierbezeichnung; die hebräische Ausdrucksweise wird in der Fußnote bewahrt.
