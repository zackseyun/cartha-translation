review_pass:
  verdict: revise
  source_fidelity: Die Hauptfassung deutet die schwierige Vergleichskonstruktion כְּפֶרֶץ sinnvoll als Eindringen durch eine Bresche. Gegenüber „im Getöse des Einsturzes“ vermeidet „unter dem Einsturz“ jedoch die nicht ausdrücklich im Hebräischen liegende akustische Ausdeutung von שֹׁאָה und gibt תַּחַת unmittelbarer wieder. Die genaue Beziehung von תַּחַת zu שֹׁאָה bleibt poetisch und semantisch umstritten.
  naturalness: „Wie eine breite Bresche kommen sie heran“ ist im Deutschen kaum verständlich, weil die Angreifer dabei mit der Bresche identifiziert werden. „Wie durch eine breite Bresche dringen sie ein“ ist idiomatisch, bewahrt das Bild und passt zum Kontext des Andringens feindseliger Menschen. „Sich heranwälzen“ ist natürlicher als „sich vorwälzen“.
  terminology: „Bresche“ trifft פֶרֶץ präzise. „Einsturz“ ist für שֹׁאָה als zerstörerischen Zusammenbruch möglich, ohne die Bedeutung auf bloßes Geräusch („Getöse“) einzuengen. Die Alternative in der Fußnote dokumentiert sowohl die stärker formale Vergleichslesart als auch die kontextuelle Wiedergabe von תַּחַת.
  issues:
  - severity: medium
    issue: Die Wendung „Wie eine breite Bresche kommen sie heran“ ist als deutsche Vergleichsmetapher missverständlich und unidiomatisch.
    rationale: Sie kann nahelegen, die Subjekte seien selbst eine Bresche. Die hebräische Konstruktion wird im Deutschen verständlicher als Bewegung durch eine Bresche wiedergegeben; die formale Vergleichslesart bleibt in der Anmerkung erhalten.
  - severity: low
    issue: „im Getöse des Einsturzes“ spezifiziert שֹׁאָה zu stark als Lärmereignis.
    rationale: שֹׁאָה bezeichnet vor allem Verwüstung, Unheil oder zerstörerischen Zusammenbruch; ein akustisches „Getöse“ ist möglich, aber nicht erforderlich. Eine weniger eingeengte Wiedergabe wahrt die Offenheit besser.
