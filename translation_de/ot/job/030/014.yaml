  yaml_path: translation/ot/job/030/014.yaml
  text: Like a wide breach they come[a]; amid the crash they roll on.
translation:
  language: de
  text: Wie durch eine breite Bresche dringen sie ein[a]; unter dem Einsturz wälzen sie sich heran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, stärker am Wortlaut: „Wie eine breite Bresche kommen sie heran; inmitten des Zusammenbruchs wälzen sie sich heran.“'
    reason: Die Funktion von כְּ bei פֶּרֶץ kann als Vergleich („wie eine Bresche“) oder im Deutschen sinngemäß als Bewegung durch eine Bresche wiedergegeben werden. Bei תַּחַת שֹׁאָה sind „unter“ und eine kontextuelle Wiedergabe wie „inmitten“ möglich.
lexical_decisions:
- source_word: כְּ/פֶרֶץ רָחָב
  choice: Wie eine breite Bresche
  rationale: כְּ kennzeichnet zunächst einen Vergleich; פֶּרֶץ bezeichnet eine Bresche oder Mauerlücke, רָחָב deren große Weite. Die ungewöhnliche, kraftvolle Metapher bleibt erhalten.
- source_word: יֶאֱתָיוּ
  choice: kommen sie heran
  rationale: Das Verb bezeichnet ihr Kommen beziehungsweise Herannahen. „Heran“ macht die auf Hiob gerichtete Bewegung im Deutschen natürlich deutlich, ohne ein spezielleres Angriffsverb einzutragen.
- source_word: תַּחַת שֹׁאָה
  choice: im Getöse des Einsturzes
  rationale: תַּחַת bedeutet grundsätzlich „unter“, kann hier aber die begleitenden Umstände bezeichnen. שֹׁאָה umfasst vernichtenden Zusammenbruch, Verwüstung oder krachenden Einsturz; die Fassung hält Klang und Zerstörung des Bildes zusammen.
- source_word: הִתְגַּלְגָּלוּ
  choice: wälzen sie sich vor
  rationale: Der Hitpael von גלל beschreibt reflexive, rollende oder wälzende Bewegung. „Sich vorwälzen“ vermittelt den unaufhaltsamen Andrang und bewahrt die auffällige Bildsprache.
