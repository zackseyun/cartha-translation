  terminology: „Bogensehne“ vermeidet die im heutigen Deutsch naheliegende anatomische Bedeutung von „Sehne“. „Zügel“ und „gedemütigt“ sind im poetischen Register passend. Die Fußnote soll Ketiv und Qere nicht nur als allgemeine Unsicherheit, sondern als unterschiedliche Besitzsuffixe benennen.
