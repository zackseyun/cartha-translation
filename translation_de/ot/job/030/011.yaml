  text: Because he has loosened his cord and afflicted me[b][a], they have cast off restraint before me.
translation:
  language: de
  text: Denn er hat meine Bogensehne[a] gelöst und mich gedemütigt; vor mir haben sie alle Zügel fahren lassen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Überlieferung bietet unterschiedliche Lesungen: Der Qere („meine Schnur/Bogensehne“) steht dem Ketiv („seine Schnur/Bogensehne“) gegenüber. Das Wort kann allgemein eine Schnur, insbesondere eine Bogensehne, bezeichnen.'
    reason: textual_and_lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sie haben den Zaum vor mir losgelassen“; gemeint ist, dass sie in meiner Gegenwart jede Zurückhaltung ablegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die zuvor geschilderte Verachtung ein und klingt im poetischen Zusammenhang natürlich.
- source_word: יִתְרוֹ
  choice: meine Sehne
  rationale: Die Konsonantenüberlieferung und die Lesetradition sind nicht eindeutig; im Zusammenhang ist wahrscheinlich Jobs Sehne beziehungsweise Bogensehne gemeint, die Gott löst und ihn dadurch wehrlos macht. Die Alternative „seine Sehne“ wird in der Fußnote bewahrt.
- source_word: פִּתַּח
  choice: hat … gelöst
  rationale: Bei einer Sehne bedeutet das Verb sachgemäß „lösen“ oder „lockern“.
- source_word: וַיְעַנֵּנִי
  choice: und mich gedemütigt
  rationale: Hier liegt ענה im Sinn von demütigen oder niederbeugen vor, nicht das gleichlautende Verb „antworten“. „Gedemütigt“ passt besonders zur sozialen Erniedrigung Jobs in diesem Abschnitt.
- source_word: וְרֶסֶן
  choice: alle Zügel
  rationale: Das konkrete Bild von Zügel oder Zaum wird bewahrt; die deutsche Wendung „die Zügel fahren lassen“ vermittelt zugleich das gemeinte Ablegen jeder Zurückhaltung.
- source_word: מִפָּנַי
  choice: vor mir
  rationale: Bezeichnet das schamlose Verhalten in Jobs Gegenwart und ihm gegenüber.
- source_word: שִׁלֵּחוּ
  choice: haben … fahren lassen
  rationale: Mit „Zügel“ bezeichnet das Verb ein Loslassen; die idiomatische Wendung gibt die daraus folgende Zügellosigkeit natürlich wieder.
theological_decisions:
- issue: Subjekt und Besitzverhältnis im ersten Satzteil
  choice: Gott ist das unausgesprochene Subjekt; gelesen wird „meine Sehne“
  alternative: „Er hat seine Sehne gelöst“
  rationale: Der unmittelbare Zusammenhang spricht davon, dass Gott Job erniedrigt hat; die masoretische Textüberlieferung lässt beim Besitzsuffix jedoch eine echte Unsicherheit erkennen, die in der Fußnote offengelegt wird.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Das Bild der Sehne bleibt konkret, während „alle Zügel fahren lassen“ die zweite Metapher im Deutschen verständlich und anschaulich wiedergibt. Die Unsicherheit der masoretischen Überlieferung wird nicht stillschweigend aufgelöst.
