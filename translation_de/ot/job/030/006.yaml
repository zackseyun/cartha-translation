  text: בַּ/עֲר֣וּץ נְחָלִ֣ים לִ/שְׁכֹּ֑ן חֹרֵ֖י עָפָ֣ר וְ/כֵפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/006.yaml
  text: In the gullies of the wadis they dwell[b][a], in holes of the dust and among the rocks.
translation:
  language: de
  text: In den Schluchten der Wadis wohnen sie[a], in Erdlöchern und zwischen Felsen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In den Rinnen der Trockentäler wohnen sie“; die hebräischen Bezeichnungen können Schluchten, Bachbetten beziehungsweise Täler meinen, und die Verbform lässt sich eng als „zu wohnen“ auffassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲרוּץ
  choice: in den Schluchten
  rationale: עָרוּץ bezeichnet einen Einschnitt, eine Rinne oder Schlucht; „Schluchten“ gibt das vom Wasser eingeschnittene Gelände natürlich und prägnant wieder.
- source_word: נְחָלִים
  choice: der Wadis
  rationale: נַחַל kann ein Tal oder besonders ein zeitweise wasserführendes Bachbett bezeichnen. „Wadis“ bewahrt hier den nahöstlichen Landschaftsbezug und lässt offen, ob gerade Wasser fließt.
- source_word: לִשְׁכֹּן
  choice: wohnen sie
  rationale: Der Infinitiv bezeichnet in diesem Zusammenhang ihren Aufenthalt bzw. Wohnort; im Deutschen ist die finite Wiedergabe „wohnen sie“ natürlich.
- source_word: חֹרֵי עָפָר
  choice: Erdlöchern
  rationale: חוֹר bezeichnet ein Loch oder einen Hohlraum, עָפָר lockere Erde bzw. Staub. Das zusammengesetzte „Erdlöcher“ ist idiomatisch und wahrt das Bild armseliger Behausungen.
- source_word: וְכֵפִים
  choice: und zwischen Felsen
  rationale: כֵּפִים bezeichnet Felsen oder Felsklippen. Die Präposition ist aus der parallelen Ortsangabe sinngemäß zu ergänzen; „zwischen Felsen“ klingt im Deutschen natürlicher als eine rein koordinierte Form.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wadi“ ist ein geläufiger geografischer Fachausdruck; die Fußnote bietet eine verständliche Alternative. Die knappe, harte Bildsprache des Hebräischen bleibt erhalten.
