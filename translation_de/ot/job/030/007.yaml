source:
  edition: WLC
  text: בֵּין שִׂיחִ֥ים יִנְהָ֑קוּ תַּ֖חַת חָר֣וּל יְסֻפָּֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/007.yaml
  text: Among the bushes they bray[b][a]; under the nettles they huddle together.
translation:
  language: de
  text: Zwischen den Büschen iahen sie; unter Nesseln[a] drängen sie sich zusammen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter Dorngestrüpp“ beziehungsweise „unter Dornbüschen“. Welche Pflanze das hebräische Wort genau bezeichnet, ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden sie zusammengedrängt“ beziehungsweise „kauern sie sich zusammen“. Das hebräische Verb bezeichnet hier ein Zusammenkommen oder Zusammengedrängtsein; die genaue Nuance ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: zwischen
  rationale: Die Präposition bezeichnet hier die Lage inmitten mehrerer Büsche; „zwischen“ ist im Deutschen natürlich und wahrt die räumliche Bildsprache.
- source_word: שִׂיחִים
  choice: Büschen
  rationale: Das Wort bezeichnet niedriges Busch- oder Strauchwerk. „Büsche“ ist klar, gegenwärtig und vermeidet eine unnötige Festlegung auf dichtes Gestrüpp.
- source_word: יִנְהָקוּ
  choice: iahen sie
  rationale: Das Verb נהק bezeichnet besonders den Ruf eines Esels. „iahen“ bewahrt die schroffe, tierhafte Darstellung genauer als das allgemeinere „stöhnen“ oder „schreien“.
- source_word: תַּחַת
  choice: unter
  rationale: Die einfache räumliche Bedeutung wird im Deutschen unmittelbar mit „unter“ wiedergegeben.
- source_word: חָרוּל
  choice: Nesseln
  rationale: Der Ausdruck bezeichnet eine unangenehme wilde, möglicherweise dornige Pflanze. „Nesseln“ entspricht einer verbreiteten Deutung, während eine Fußnote die botanische Unsicherheit offenhält.
- source_word: יְסֻפָּחוּ
  choice: drängen sie sich zusammen
  rationale: Die Verbform vermittelt ein Zusammengebracht- oder Zusammengedrängtsein. Die Formulierung ist natürlich und erhält das Bild einer eng beieinanderliegenden Gruppe, ohne die unsichere Nuance zu überbestimmen.
theological_decisions: []
