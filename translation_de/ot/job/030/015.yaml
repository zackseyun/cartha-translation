  text: הָהְפַּ֥ךְ עָלַ֗/י בַּלָּ֫ה֥וֹת תִּרְדֹּ֣ף כָּ֭/רוּחַ נְדִבָתִ֑/י וּ֝/כְ/עָ֗ב עָבְרָ֥ה יְשֻׁעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/015.yaml
  text: Terrors are turned upon me[a]; they pursue my nobility like the wind[b], and my salvation passes away like a cloud.
translation:
  language: de
  text: Schrecken haben sich gegen mich gewandt; wie der Wind verfolgen sie meine Würde[a], und wie eine Wolke ist meine Rettung[b] vergangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Ehre“, „meinen vornehmen Stand“ oder „mein Wohlergehen“. Das hebräische Wort bezeichnet hier wahrscheinlich Hiobs angesehene oder erhöhte Stellung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mein Heil“ oder „mein Wohlergehen“. Das hebräische Wort kann konkrete Rettung ebenso wie einen Zustand des Wohlergehens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהְפַּךְ עָלַי
  choice: haben sich gegen mich gewandt
  rationale: Die passive beziehungsweise resultative Form von הפך beschreibt, dass die Schrecken gegen Hiob gekehrt worden sind. Im Deutschen gibt die reflexive Wendung den Zustandswechsel natürlich wieder.
- source_word: בַּלָּהוֹת
  choice: Schrecken
  rationale: Das Substantiv bezeichnet erschreckende, plötzlich hereinbrechende Schrecknisse. „Schrecken“ ist knapp, kraftvoll und im poetischen Kontext verständlich.
- source_word: תִּרְדֹּף
  choice: sie jagen … davon
  rationale: רדף bedeutet „verfolgen“ oder „jagen“. Obwohl die Verbform feminin singular ist, kann sie sich auf das vorausgehende pluralische Kollektiv „Schrecken“ beziehen. „Davonjagen“ verdeutlicht im Deutschen die durch Wind und Wolke geprägte Bewegung des Verschwindens.
- source_word: כָּרוּחַ
  choice: wie der Wind
  rationale: רוּחַ bezeichnet hier am wahrscheinlichsten den Wind. Das Bild hebt das rasche und unwiderstehliche Fortgetriebenwerden hervor und steht parallel zum Wolkenvergleich.
- source_word: נְדִבָתִי
  choice: meine Würde
  rationale: Der schwierige Ausdruck kann eine vornehme, angesehene oder erhöhte Stellung bezeichnen. „Meine Würde“ passt zu Hiobs Verlust von Ehre und gesellschaftlichem Ansehen, ohne einen erblichen Adelsrang vorauszusetzen.
- source_word: וּכְעָב
  choice: wie eine Wolke
  rationale: עָב bezeichnet eine Wolke, gegebenenfalls eine dichte Wolke. Die einfache Wiedergabe bewahrt das klare poetische Bild.
- source_word: עָבְרָה
  choice: ist … vergangen
  rationale: עבר bezeichnet hier das Vorübergehen beziehungsweise Verschwinden. Das deutsche Perfekt entspricht dem vollendeten hebräischen Verb und klingt in der Klage natürlich.
- source_word: יְשֻׁעָתִי
  choice: meine Rettung
  rationale: ישועה meint in diesem Zusammenhang vor allem Rettung oder Befreiung aus Hiobs Not. „Rettung“ vermeidet eine unnötige Einschränkung auf einen späteren lehrhaften Begriff des Heils.
theological_decisions:
- issue: Bedeutungsumfang von יְשֻׁעָתִי
  choice: meine Rettung
  alternative: mein Heil; mein Wohlergehen
  rationale: Das hebräische Wort kann konkrete Befreiung, umfassendes Heil oder Wohlergehen bezeichnen. Im Klagekontext ist „Rettung“ naheliegend, während die Fußnote den weiteren Bedeutungsraum offenhält.
- issue: Bezug und Numerus von תִּרְדֹּף
  choice: Die Schrecken jagen Hiobs Würde davon
  alternative: Hiobs Würde wird wie vom Wind verfolgt beziehungsweise fortgejagt
  rationale: Die feminine Singularform lässt eine kollektivische Beziehung auf „Schrecken“ zu; zugleich ist die Syntax dichterisch und nicht völlig eindeutig. Die Hauptfassung folgt dem unmittelbaren Anschluss, ohne das Bild in eine ausdrückliche theologische Deutung umzuwandeln.
translation_notes:
  register: Moderne, gehobene Standardsprache mit knapper poetischer Parallelität. „Davon“ macht das deutsche Bewegungsbild idiomatisch, während die beiden Vergleiche mit Wind und Wolke erhalten bleiben. Die schwer festzulegenden Begriffe נְדִיבָתִי und יְשֻׁעָתִי werden durch unmittelbar zugeordnete Fußnoten offengehalten.
