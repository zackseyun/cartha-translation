source:
  edition: WLC
  text: מִן גֵּ֥ו יְגֹרָ֑שׁוּ יָרִ֥יעוּ עָ֝לֵ֗י/מוֹ כַּ/גַּנָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/005.yaml
  text: They are driven out from the midst[b][a]; they shout after them as after a thief.
translation:
  language: de
  text: Aus der Gemeinschaft werden sie vertrieben; man schreit ihnen nach wie einem Dieb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Man schreit gegen sie wie gegen einen Dieb.“ Im Hebräischen wird nicht ausdrücklich gesagt, wer schreit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן־גֵּו
  choice: aus der Gemeinschaft
  rationale: מִן bezeichnet die Trennung, גֵּו die Mitte bzw. das Innere. Im Zusammenhang geht es am ehesten um den Ausschluss aus der menschlichen Gemeinschaft; die Wiedergabe macht diesen Bezug im Deutschen verständlich.
- source_word: יְגֹרָשׁוּ
  choice: werden sie vertrieben
  rationale: Die Form beschreibt eine gewaltsame Vertreibung und rückt wie der hebräische Passivausdruck das Ergehen der Betroffenen in den Vordergrund.
- source_word: יָרִיעוּ
  choice: man schreit
  rationale: Das Verb bedeutet hier, einen lauten, feindseligen Ruf zu erheben. Das unpersönliche „man“ gibt den im Hebräischen nicht ausdrücklich genannten Handlungsträger natürlich wieder.
- source_word: עָלֵימוֹ
  choice: hinter ihnen her
  rationale: עַל kann bei einem feindseligen Zuruf die Richtung gegen eine Person bezeichnen. Zusammen mit dem Vergleich des Diebes ist „hinter ihnen her“ idiomatisch und bewahrt das Bild öffentlicher Verfolgung.
- source_word: כַּגַּנָּב
  choice: wie hinter einem Dieb
  rationale: Die Vergleichspartikel כְּ setzt die Betroffenen einem Dieb gleich, gegen den ein Alarm- oder Verfolgungsruf erhoben wird. Die ergänzte Präposition ergibt im Deutschen einen vollständigen, natürlichen Vergleich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gemeinschaft“ verdeutlicht kontextgemäß „Mitte“, ohne eine geografische Bedeutung wie „Schlucht“ einzuführen; diese wäre eher mit einem anderen hebräischen Wort verbunden.
