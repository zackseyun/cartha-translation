base_translation:
  language: en
  yaml_path: translation/ot/job/030/023.yaml
  text: For I know that you will bring me to death[b][a], and to the house appointed for every living one.
translation:
  language: de
  text: 'Denn ich weiß: Du wirst mich zum Tod zurückführen[a], zum Haus, das für alle Lebenden bestimmt ist.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du wirst mich zum Tod bringen.“ Das Verb bedeutet wörtlich, jemanden zurückkehren zu lassen oder zurückzuführen.'
    reason: lexical_alternative
  - marker: b
    text: Das „Haus, das für alle Lebenden bestimmt ist“, kann poetisch das Grab oder den Scheol als gemeinsames Ziel aller Menschen bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet im Zusammenhang Hiobs vorangehende Klage; „Denn“ bewahrt diese Verknüpfung natürlich.
- source_word: יָדַעְתִּי
  choice: ich weiß
  rationale: Das Qal Perfekt bezeichnet hier ein feststehendes Wissen und wird im modernen Deutschen idiomatisch präsentisch wiedergegeben.
- source_word: מָוֶת
  choice: Tod
  rationale: Das Substantiv bezeichnet unmittelbar den Tod; eine ausdrückliche Gleichsetzung mit Scheol oder Grab wäre interpretierend.
- source_word: תְּשִׁיבֵנִי
  choice: du wirst mich zurückführen
  rationale: Das Hifil von שוב hat die kausative Bedeutung „zurückkehren lassen/zurückführen“. „Zurückführen“ erhält diese lexikalische Nuance, auch wenn „zum Tod bringen“ im Deutschen geläufiger wäre.
- source_word: וּבֵית מוֹעֵד
  choice: zum Haus, das … bestimmt ist
  rationale: „Haus“ setzt das Zielbild der ersten Zeile fort. מוֹעֵד kann einen festgesetzten Ort oder Termin bezeichnen; die Relativkonstruktion gibt hier den bestimmten Zielort natürlich wieder, ohne „Versammlung“ festzulegen.
- source_word: לְכָל חָי
  choice: für alle Lebenden
  rationale: Die hebräische kollektiv-singularische Wendung wird im Deutschen idiomatisch und mit unverändert universaler Aussage wiedergegeben.
theological_decisions:
- issue: Deutung des Todesbildes
  choice: Der Tod wird als das gemeinsame, für alle Lebenden bestimmte Ziel und bildlich als Haus bezeichnet.
  alternative: Das „Haus“ bezeichnet genauer das Grab oder den Scheol als Versammlungsort der Toten.
  rationale: Der hebräische Text nennt den Tod und ein bestimmtes Haus, aber nicht ausdrücklich Scheol oder Grab. Die Übersetzung bewahrt das poetische Bild und erläutert die mögliche engere Deutung nur in der Fußnote.
- issue: Bedeutung des Rückkehrmotivs
  choice: Die Übersetzung erhält mit „zurückführen“ die kausative Rückkehrbedeutung des Verbs.
  alternative: „Du wirst mich zum Tod bringen“ versteht die Wendung idiomatisch als Aussage über Hiobs künftiges Sterben, ohne eine vorgängige Herkunft aus dem Tod anzudeuten.
  rationale: Das Hebräische erlaubt die formalere Rückkehrnuance, doch deren genaue Vorstellung bleibt spannungsvoll. Eine Fußnote nennt deshalb die im Deutschen naheliegende idiomatische Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet die feste Gewissheit der hebräischen Aussage klar ab; die beiden Zielangaben bleiben parallel. Sämtliche Fußnotenmarker stehen im Haupttext.
