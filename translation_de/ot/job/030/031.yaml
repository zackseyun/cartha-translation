  yaml_path: translation/ot/job/030/031.yaml
  text: So my lyre has become mourning[b][a], and my pipe the sound of those who weep.
translation:
  language: de
  text: So ist meine Leier[a] zur Trauer geworden und meine Flöte[b] zum Klang der Weinenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Harfe“. Das hebräische Wort כִּנּוֹר bezeichnet eine Leier oder ein harfenähnliches Saiteninstrument.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mein Blasinstrument“. Das hebräische Wort עוּגָב bezeichnet allgemein ein Blasinstrument; seine genaue Bauform ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ist … geworden
  rationale: Die Form von היה bezeichnet hier einen eingetretenen Zustand, dessen Wirkung in Ijobs gegenwärtiger Klage fortbesteht.
- source_word: לְאֵבֶל
  choice: zur Trauer
  rationale: אֵבֶל bezeichnet Trauer beziehungsweise das Trauern; die Wendung bewahrt das Bild, dass das Musikinstrument nun dem Ausdruck des Leids dient.
- source_word: כִּנֹּרִי
  choice: meine Leier
  rationale: כִּנּוֹר bezeichnet ein antikes Saiteninstrument. „Leier“ ist präziser als die mögliche, aber leicht modern missverständliche Wiedergabe „Harfe“.
- source_word: וְעֻגָבִי
  choice: meine Flöte
  rationale: עוּגָב bezeichnet ein nicht sicher identifizierbares Blasinstrument. „Flöte“ ist im Deutschen natürlich; die Fußnote hält die instrumentenkundliche Ungewissheit offen.
- source_word: לְקוֹל
  choice: zum Klang
  rationale: קוֹל kann „Stimme“, „Laut“ oder „Klang“ bedeuten. Mit לְ und parallel zu „zur Trauer“ gibt „zum Klang“ die Zuordnung beziehungsweise Verwandlung knapp wieder.
- source_word: בֹּכִים
  choice: der Weinenden
  rationale: Das substantivisch gebrauchte Partizip bezeichnet Menschen, die weinen. „Der Weinenden“ bewahrt diesen persönlichen Bezug und passt zum würdevollen poetischen Register.
