base_translation:
  language: en
  yaml_path: translation/ot/job/030/024.yaml
  text: Surely one does not stretch out a hand against a ruin[a], if in his calamity there is a cry for help.
translation:
  language: de
  text: Gewiss streckt man nicht gegen einen Trümmerhaufen[a] die Hand aus, wenn einer in seinem Unglück um Hilfe schreit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gewiss streckt man nicht die Hand nach einem Trümmerhaufen aus, wenn in seinem Verderben ein Hilferuf ertönt.“ Der hebräische Wortlaut dieses Verses ist sehr schwer verständlich; besonders unsicher sind die mit „gegen einen Trümmerhaufen“ wiedergegebene Wendung und die Beziehung des Ausdrucks לָהֶן.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel kann bekräftigend oder adversativ wirken. Im Zusammenhang von Hiobs Klage leitet „Doch“ eine einschränkende Gegenbehauptung ein, ohne die schwierige Aussage zu stark festzulegen.
- source_word: בְּעִי
  choice: gegen einen Trümmerhaufen
  rationale: Die seltene und unsichere Form wird meist mit „Trümmer(haufen)“ verbunden. Mit „die Hand ausstrecken“ gibt „gegen“ die wahrscheinlich feindliche Zielrichtung wieder.
- source_word: יִשְׁלַח יָד
  choice: die Hand ausstrecken
  rationale: Die hebräische Bildsprache bleibt erhalten; im Zusammenhang deutet die Wendung auf einen Angriff beziehungsweise ein Vorgehen gegen jemanden oder etwas.
- source_word: אִם
  choice: wenn
  rationale: „Wenn“ bewahrt den konditionalen Sinn der Partikel und ergibt im Deutschen eine verständliche Verknüpfung, ohne die unsichere Syntax aufzulösen.
- source_word: בְּפִידוֹ
  choice: in seinem Unglück
  rationale: פיד bezeichnet schweres Unheil oder Verderben. „In seinem Unglück“ ist idiomatisch und bewahrt den Personenbezug des Suffixes.
- source_word: לָהֶן
  choice: nicht eigens wiedergegeben
  rationale: Die Form und ihre syntaktische Beziehung sind an dieser Stelle äußerst unsicher. Eine ausdrückliche Wiedergabe wie „von ihnen“ wäre im Deutschen unklar und könnte einen nicht gesicherten Bezug einführen; die Schwierigkeit wird in der Fußnote benannt.
- source_word: שׁוּעַ
  choice: um Hilfe schreit
  rationale: Das Wort bezeichnet einen Hilferuf in Bedrängnis. Die verbale deutsche Formulierung ist natürlich und gibt diesen Sinn präzise wieder.
theological_decisions:
- issue: Sinnzusammenhang des schwierigen Verses
  choice: Als rhetorische Frage über das Verschonen eines bereits Zerschlagenen und dessen Hilferuf wiedergegeben
  alternative: 'Als Aussagesatz: „Gewiss streckt man nicht die Hand gegen einen Trümmerhaufen aus, wenn in seinem Unglück ein Hilferuf ertönt.“'
  rationale: Die hebräische Wortfolge ist dunkel und enthält kein ausdrückliches Fragezeichen. Die rhetorische Frage passt jedoch zum Zusammenhang und macht die wahrscheinlich gemeinte Spannung verständlich, ohne eine besondere Lehrposition einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Hand-Metapher wurde bewahrt; eine Fußnote weist offen auf die erhebliche textliche und syntaktische Unsicherheit hin.
