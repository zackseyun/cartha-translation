  terminology: „Haut“, „Fleisch“, „Knochen“ und „Sehnen“ sind sachgerecht und in diesem poetischen Kontext angemessen. Die Gottesansprache im „Du“ ist im Kontext von Ijobs Rede konsistent. Die Fußnotenformulierung stellt die lexikalische Spannweite von סכך hinreichend dar.
