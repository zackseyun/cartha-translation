  source_fidelity: Die Übersetzung gibt עור und בשר zutreffend als „Haut und Fleisch“ wieder. „bekleidet“ entspricht dem Hifil von לבש und bewahrt das bildhafte Körperbildungsbild. „mit Knochen und Sehnen durchwoben“ ist eine vertretbare, poetisch natürliche Kontextauslegung von תסככני; die Fußnote nennt die wesentliche alternative Bedeutung des Bedeckens bzw. Umschließens, ohne sie im Haupttext zu verdrängen.
