  text: You clothed me with skin and flesh[a], and wove me together with bones and sinews.
translation:
  language: de
  text: Du hast mich mit Haut und Fleisch bekleidet und mich mit Knochen und Sehnen durchwoben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Knochen und Sehnen umschlossen“. Das hebräische Verb kann auch „bedecken“, „umgeben“ oder „umschließen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: Haut
  rationale: Im Zusammenhang mit dem menschlichen Körper bezeichnet das Wort die Haut; „Fell“ wäre hier unnatürlich.
- source_word: בָשָׂר
  choice: Fleisch
  rationale: Die konkrete Bezeichnung für das Körpergewebe bewahrt die poetische Verbindung mit „Haut“.
- source_word: תַּלְבִּישֵׁנִי
  choice: du hast mich bekleidet
  rationale: Der Hifil von לבש bedeutet „bekleiden“ und erhält das Bild, dass Gott den Menschen mit Haut und Fleisch umgibt.
- source_word: בַעֲצָמוֹת
  choice: mit Knochen
  rationale: Die Präposition ב wird hier instrumental beziehungsweise begleitend verstanden und im Deutschen natürlich mit „mit“ wiedergegeben.
- source_word: גִידִים
  choice: Sehnen
  rationale: Das Wort bezeichnet festes verbindendes Körpergewebe; „Sehnen“ ist verständlich, konkret und poetisch angemessen.
- source_word: תְּסֹכְכֵנִי
  choice: du hast mich durchwoben
  rationale: Die Wiedergabe beschreibt im Kontext der Körperbildung ein umgebendes und verbindendes Wirken. Da das hebräische Verb auch „bedecken“ oder „umschließen“ bedeuten kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
theological_decisions:
- issue: Bildhafte Darstellung der göttlichen Formung des Menschen
  choice: Der Vers beschreibt poetisch, wie Gott Ijobs Körper formte, ohne über den unmittelbaren Text hinaus weitere anthropologische oder schöpfungstheologische Aussagen einzutragen.
  alternative: Das zweite Verb streng als „bedecken“ oder „umschließen“ wiederzugeben.
  rationale: „Durchwoben“ ergibt im Zusammenhang der körperlichen Formung ein natürliches deutsches Bild, während die Fußnote die echte Bedeutungsbreite des hebräischen Verbs bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter Körperbildsprache. Das Perfekt entspricht dem rückblickenden Zusammenhang; die Wiederholung von „mich“ wahrt den poetischen Parallelismus.
