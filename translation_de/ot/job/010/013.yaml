  text: וְ֭/אֵלֶּה צָפַ֣נְתָּ בִ/לְבָבֶ֑/ךָ יָ֝דַ֗עְתִּי כִּי זֹ֥את עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/013.yaml
  text: Yet these things you hid in your heart[b][a]; I knew that this was with you.
translation:
  language: de
  text: Doch diese Dinge hast du in deinem Herzen verborgen[a]; ich wusste, dass dies bei dir war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch diese Dinge hast du in deinem Herzen aufbewahrt.“ Das hebräische Verb kann „verbergen“, „aufbewahren“ oder „bereithalten“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: '„Dies war bei dir“ kann auch bedeuten: „Dies war in deinem Sinn“ oder: „Dies gehörte zu deiner verborgenen Absicht.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Doch dies
  rationale: 'Das וְ erhält im Zusammenhang eine adversative Nuance: Hiob stellt der zuvor beschriebenen Fürsorge Gottes eine verborgene Absicht gegenüber. אֵלֶּה kann hier zusammenfassend mit „dies“ wiedergegeben werden.'
- source_word: צָפַנְתָּ
  choice: hast du verborgen
  rationale: צפן kann „verbergen“, „aufbewahren“ oder „bereithalten“ bedeuten. „Verborgen“ passt zur nicht offengelegten inneren Absicht, ohne deren Inhalt festzulegen.
- source_word: בִלְבָבֶךָ
  choice: in deinem Herzen
  rationale: לֵבָב bezeichnet das innere Denken und Wollen. „Herz“ bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: יָדַעְתִּי
  choice: ich wusste
  rationale: Das Qatal der ersten Person Singular wird in diesem Redezusammenhang natürlich mit dem Präteritum wiedergegeben.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Hiob wusste.
- source_word: זֹאת
  choice: dies
  rationale: Das feminine Singular-Demonstrativum verweist verdichtet auf die zuvor erwähnte verborgene Sache oder Absicht. „Dies“ lässt den Bezug wie im Hebräischen offen.
- source_word: עִמָּךְ
  choice: bei dir war
  rationale: Die Wendung bedeutet wörtlich „mit/bei dir“. „Bei dir war“ bewahrt das Idiom und vermeidet die Festlegung auf „in deinem Sinn“ oder „dein Plan“.
theological_decisions:
- issue: Art und Bezug von Gottes verborgener Absicht in Hiobs Rede
  choice: Der Bezug von „dies“ bleibt offen; Hiob spricht von etwas, das Gott in seinem Herzen verborgen hielt.
  alternative: „Dies“ ausdrücklich als Gottes geheimen Plan deuten, Hiob leiden zu lassen, oder auf die Wohltaten des vorherigen Verses beziehen.
  rationale: Der hebräische Text benennt den Inhalt nicht ausdrücklich. Die Übersetzung wahrt daher Hiobs anklagende Spannung, ohne eine bestimmte theologische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Körpermetapher „in deinem Herzen“ und die knappe, mehrdeutige Wendung „bei dir war“ bleiben erhalten; die Fußnoten erläutern die möglichen Bedeutungen, ohne den Haupttext zu überdeuten.
