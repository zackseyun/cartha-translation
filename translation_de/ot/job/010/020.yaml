  yaml_path: translation/ot/job/010/020.yaml
  text: Are not my days few? Then cease and leave me alone[a], so that I may brighten up a little[b],
translation:
  language: de
  text: Sind meine Tage nicht wenige? Dann hör auf und lass mich in Ruhe[a], damit ich ein wenig aufatmen kann[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wende dich von mir ab“ beziehungsweise „zieh dich von mir zurück“. Der hebräische Ausdruck ist knapp und in seiner genauen Form schwierig.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „damit ich ein wenig heiter werde“ beziehungsweise „mich ein wenig erhole“. Das Verb kann eine kurze Erleichterung oder Aufhellung des Gemüts bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא מְעַט יָמַי
  choice: Sind meine Tage nicht nur noch wenige?
  rationale: Bewahrt die rhetorische Frage und gibt מְעַט bei den Lebenstagen natürlich mit „nur noch wenige“ wieder; „noch“ verdeutlicht den kontextuellen Bezug auf Hiobs verbleibende Lebenszeit.
- source_word: יחדל ישית מִמֶּנִּי
  choice: Dann hör auf und lass mich in Ruhe
  rationale: Der überlieferte Konsonantentext ist knapp und schwierig. Die Wiedergabe erhält mit „hör auf“ das zusätzliche Verb יחדל und fasst ישית ממני im Zusammenhang idiomatisch als Bitte auf, von Hiob abzulassen.
- source_word: וְאַבְלִיגָה מְעָט
  choice: damit ich ein wenig aufatmen kann
  rationale: בלג bezeichnet hier wohl eine kurze Erleichterung oder Aufhellung. „Aufatmen“ ist modernes, würdiges Deutsch und lässt offen, ob vor allem seelische Erheiterung, Erholung oder ein Wiedergewinnen von Kraft gemeint ist.
theological_decisions:
- issue: Der unausgesprochene Adressat der Aufforderung
  choice: Die deutsche Verbform bleibt ohne ausdrücklich ergänztes „Gott“.
  alternative: „Dann hör du auf, Gott, und lass mich in Ruhe“
  rationale: Aus dem Zusammenhang richtet Hiob seine Bitte an Gott, doch im hebräischen Vers wird der Name nicht genannt. Die Übersetzung vermeidet daher eine explizite Ergänzung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, unmittelbar verständlichem Stil. „Lass mich in Ruhe“ ist bewusst idiomatisch, ohne salopp zu wirken; „aufatmen“ vermittelt die erbetene kurze Entlastung. Das abschließende Komma wurde beibehalten, da der Vers syntaktisch in Hiob 10,21 weiterführt.
