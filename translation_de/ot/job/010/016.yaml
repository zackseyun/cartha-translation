  yaml_path: translation/ot/job/010/016.yaml
  text: If I lift myself up[a], you hunt me like a lion[b], and again you show yourself wonderful against me.
translation:
  language: de
  text: Wenn ich mich erhebe[a], jagst du mich wie ein Löwe; und erneut zeigst du dich auf erstaunliche Weise gegen mich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische ist knapp und schwierig. Wörtlich steht hier etwa: „Und er/es erhebt sich.“ Gemeint sein kann der zuvor erwähnte Kopf Hiobs; möglich ist daher auch: „Wenn mein Kopf sich erhebt“ oder „Wenn ich erhöht werde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Und erneut tust du Erstaunliches an mir.“ Das hebräische Verb bezeichnet außergewöhnliches oder wunderbares Handeln, hier jedoch in einem feindlich empfundenen Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגְאֶה
  choice: Wenn ich mich erhebe
  rationale: Das Verb גאה bezeichnet ein Sich-Erheben oder Hochsein. Die hebräische Form steht zwar in der 3. Person Singular und ist elliptisch; im Zusammenhang kann das Subjekt der zuvor genannte Kopf Hiobs sein. Die deutsche Fassung gibt den Sinn idiomatisch in der 1. Person wieder und kennzeichnet die Unsicherheit in einer Fußnote.
- source_word: כַּשַּׁחַל
  choice: wie ein Löwe
  rationale: שַׁחַל bezeichnet einen Löwen, oft mit dem Beiklang von Kraft oder Wildheit. „Wie ein Löwe“ bewahrt das Bild, ohne es unnötig auszudeuten.
- source_word: תְּצוּדֵנִי
  choice: jagst du mich
  rationale: Das Verb צוד bezeichnet das Jagen oder Verfolgen von Beute. „Jagst du mich“ passt unmittelbar zum Löwenbild.
- source_word: וְתָשֹׁב
  choice: dann … erneut
  rationale: שׁוב bedeutet wörtlich „zurückkehren“, kann aber eine Wiederholung ausdrücken. „Erneut“ gibt diese iterative Bedeutung in natürlichem Deutsch wieder.
- source_word: תִּתְפַּלָּא
  choice: zeigst du dich … auf erstaunliche Weise
  rationale: Der Hitpael von פלא kann bedeuten, sich als wunderbar oder außergewöhnlich zu erweisen beziehungsweise Außergewöhnliches zu tun. Die Formulierung wahrt den reflexiven Zug und lässt im feindlichen Kontext die befremdliche Spannung bestehen.
- source_word: בִי
  choice: gegen mich
  rationale: Die Präposition ב kann „an mir“, „bei mir“ oder in diesem Zusammenhang „gegen mich“ bedeuten. Wegen des Bildes der Jagd gibt „gegen mich“ die feindliche Ausrichtung am klarsten wieder.
theological_decisions:
- issue: פלא im Zusammenhang mit Gottes feindlich empfundener Handlung
  choice: zeigst du dich erneut auf erstaunliche Weise gegen mich
  alternative: tust du erneut Erstaunliches an mir
  rationale: Hiob beschreibt Gottes außergewöhnliches Handeln nicht als wohltätiges Wunder, sondern als gegen ihn gerichtet. Die Übersetzung bewahrt sowohl den Gedanken des Außergewöhnlichen als auch die theologische Spannung, ohne Gottes Handeln wertend auf eine positive oder rein gewaltsame Bedeutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild der Jagd bleibt knapp und unmittelbar; die ungewöhnliche Verbindung von Gottes erstaunlichem Handeln mit Hiobs Leid wird nicht geglättet.
