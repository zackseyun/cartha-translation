  text: נָֽקְטָ֥ה נַפְשִׁ֗/י בְּ/חַ֫יָּ֥/י אֶֽעֶזְבָ֣ה עָלַ֣/י שִׂיחִ֑/י אֲ֝דַבְּרָה֗ בְּ/מַ֣ר נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/001.yaml
  text: My soul loathes my life[a]; I will give free course to my complaint[b]; I will speak in the bitterness of my soul.
translation:
  language: de
  text: Meine Seele ekelt sich vor meinem Leben.[a] Ich will meiner Klage freien Lauf lassen;[b] ich will aus der Bitterkeit meiner Seele heraus reden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Meine Seele ist meines Lebens überdrüssig.« Das hebräische Verb kann sowohl tiefe Lebensmüdigkeit als auch Abscheu ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ich will meine Klage loslassen.« Gemeint ist, dass Hiob seine Klage nicht länger zurückhält.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקְטָה
  choice: ekelt sich vor
  rationale: Das Verb bezeichnet hier starke Abneigung bis zum Lebensüberdruss. Die Formulierung gibt die emotionale Schärfe wieder, ohne die mögliche Bedeutung tiefer Müdigkeit auszuschließen.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Bewahrt das hebräische Bild für Hiobs inneres Selbst und erhält die bewusste Wiederholung am Anfang und Ende des Verses.
- source_word: בְּחַיָּי
  choice: vor meinem Leben
  rationale: Mit dem gewählten deutschen Verb verlangt die natürliche Fügung »sich vor etwas ekeln« den Dativ; gemeint ist Hiobs eigenes Leben als Gegenstand seiner Abneigung.
- source_word: אֶעֶזְבָה עָלַי שִׂיחִי
  choice: ich will meiner Klage freien Lauf lassen
  rationale: Die hebräische Wendung drückt aus, dass Hiob seine Klage nicht länger zurückhalten will. Die deutsche Redewendung vermittelt diesen Sinn natürlich.
- source_word: שִׂיחִי
  choice: meine Klage
  rationale: Im Zusammenhang bezeichnet das Wort keine neutrale Betrachtung, sondern Hiobs klagende Rede.
- source_word: אֲדַבְּרָה
  choice: ich will … reden
  rationale: Der Kohortativ bringt Hiobs entschlossenen Vorsatz zum Ausdruck.
- source_word: בְּמַר נַפְשִׁי
  choice: aus der Bitterkeit meiner Seele heraus
  rationale: Die Formulierung versteht die Präposition als Bezeichnung des inneren Zustands beziehungsweise Ursprungs der Rede und gibt zugleich das Bild der Bitterkeit wieder.
