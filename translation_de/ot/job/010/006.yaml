  text: כִּֽי תְבַקֵּ֥שׁ לַ/עֲוֺנִ֑/י וּ֭/לְ/חַטָּאתִ֥/י תִדְרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/006.yaml
  text: that you seek out my iniquity and search for my sin?[a]
translation:
  language: de
  text: dass du nach meiner Schuld suchst und meiner Sünde nachforschst?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn du suchst nach meiner Schuld und forschst meiner Sünde nach.“'
    reason: כִּי kann statt als Fortsetzung der Frage auch begründend mit „denn“ verstanden werden.
lexical_decisions:
- source_word: כִּי
  choice: dass
  rationale: Im Zusammenhang setzt כִּי die rhetorische Frage aus Vers 5 fort und leitet deren Inhalt beziehungsweise Ziel ein; „dass“ wahrt diese unterordnende Funktion.
- source_word: תְבַקֵּשׁ
  choice: du … suchst
  rationale: Das Piel von בקש bezeichnet aktives Suchen. Zusammen mit „nach meiner Schuld“ klingt „suchst“ im Deutschen natürlich und bewahrt den prüfenden Unterton.
- source_word: לַעֲוֺנִי
  choice: nach meiner Schuld
  rationale: עָוֹן kann Schuld, Vergehen oder die Folge von Schuld bezeichnen. „Schuld“ erhält hier die Mehrdeutigkeit zwischen moralischem Fehlverhalten und Schuldstatus besser als das gehobene „Missetat“.
- source_word: וּלְחַטָּאתִי
  choice: meiner Sünde
  rationale: חַטָּאת bezeichnet hier parallel zu עָוֹן die Sünde beziehungsweise Verfehlung. „Sünde“ gibt den geläufigen theologischen und moralischen Sinn wieder, ohne Hiobs tatsächliche Schuld zu behaupten.
- source_word: תִדְרֹשׁ
  choice: nachforschst
  rationale: דרש kann suchen, nachforschen oder untersuchen bedeuten. „Nachforschen“ vermittelt die intensive, prüfende Suche und bildet eine natürliche Steigerung zu „suchen“.
theological_decisions:
- issue: Wiedergabe des Begriffspaars עָוֹן und חַטָּאת
  choice: „Schuld“ und „Sünde“, ohne damit Hiobs tatsächliche Schuld festzustellen
  alternative: „Vergehen“ und „Sünde“ beziehungsweise „Missetat“ und „Sünde“
  rationale: Der Vers gibt Hiobs Klage wieder, Gott suche bei ihm nach moralischem Versagen. Die Formulierung bewahrt diese Spannung und macht Hiobs Wahrnehmung nicht zu einem Urteil des Erzählers.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität der beiden Verben und der beiden Begriffe für moralische Schuld bleibt erkennbar; die Satzstellung schließt an die vorausgehende rhetorische Frage an.
