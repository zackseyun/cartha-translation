  text: Your hands shaped me and made me[a], together all around[c][b]; yet you swallow me up.
translation:
  language: de
  text: Deine Hände haben mich geformt[a] und gemacht, zusammen ringsum[b]; doch du verschlingst mich[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gestaltet“ beziehungsweise „gebildet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „zusammen ringsum“. Die knappe Wendung ist in ihrer genauen Bedeutung unsicher; sie kann die umfassende Gestaltung Hiobs ausdrücken.'
    reason: cultural_note
  - marker: c
