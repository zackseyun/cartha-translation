lexical_decisions:
- source_word: יָדֶיךָ
  choice: Deine Hände
  rationale: Der hebräische Plural mit Suffix der 2. Person Singular wird beibehalten. Das konkrete Bild bezeichnet Gottes persönliches schöpferisches Handeln.
- source_word: עִצְּבוּנִי
  choice: haben mich geformt
  rationale: Das Piel von עצב bezeichnet hier gestaltendes, handwerklich vorgestelltes Formen. „Geformt“ bewahrt diese Bildlichkeit in natürlichem Deutsch.
- source_word: וַיַּעֲשׂוּנִי
  choice: und gemacht
  rationale: עשה ist das gewöhnliche Verb für „machen“. Zusammen mit „geformt“ gibt es die zweifache Beschreibung des Schöpfungshandelns wieder, ohne die Parallelität einzuebnen.
- source_word: יַחַד סָבִיב
  choice: ganz und gar, ringsum
  rationale: 'Die knappe und ungewöhnliche Verbindung drückt wahrscheinlich umfassende Gestaltung aus: als Ganzes und von allen Seiten. Die deutsche Fassung bleibt bildhaft und lässt die räumliche Nuance von סביב erkennen.'
- source_word: וַתְּבַלְּעֵנִי
  choice: doch du verschlingst mich
  rationale: בלע bedeutet wörtlich „verschlingen“ und dient hier als drastisches Bild für Vernichtung. „Doch“ gibt im Kontext den scharfen Gegensatz wieder, obwohl das hebräische ו formal auch schlicht verbindend sein kann.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Schöpfungshandeln
  choice: Das konkrete Bild „Deine Hände“ und beide Verben des Formens und Machens werden bewahrt.
  alternative: Du hast mich erschaffen.
  rationale: Hiob beruft sich auf Gottes unmittelbare, sorgfältige Gestaltung. Eine verallgemeinernde Wiedergabe mit „erschaffen“ würde die persönliche und handwerkliche Bildsprache abschwächen.
- issue: Spannung zwischen Gottes Erschaffen und seinem vernichtenden Handeln
  choice: Der Gegensatz wird mit „doch du verschlingst mich“ unvermittelt stehen gelassen.
  alternative: Und nun willst du mich vernichten.
  rationale: Die Klage stellt Gottes fürsorgliches Formen und sein von Hiob erfahrenes vernichtendes Handeln scharf nebeneinander. Diese theologische Spannung darf nicht erklärend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Schöpfungsmetaphorik und das drastische Bild des Verschlingens bleiben erhalten. Die ungewöhnliche hebräische Wendung יחד סביב wird verständlich, aber nicht übermäßig ausdeutend als „ganz und gar, ringsum“ wiedergegeben.
