  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen Bedeutungen des Hebräischen präzise wieder: das futurisch/modale »Ich will sagen«, die negative Bitte, die gerichtliche Nuance von תַּרְשִׁיעֵנִי und die offene Konflikt- bzw. Rechtsstreitnuance von תְּרִיבֵנִי. »weshalb« gibt עַל־מַה idiomatisch als Frage nach dem Grund wieder.'
