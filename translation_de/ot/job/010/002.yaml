id: JOB.10.2
reference: Job 10:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֹמַ֣ר אֶל אֱ֭לוֹהַּ אַל תַּרְשִׁיעֵ֑/נִי הֽ֝וֹדִיעֵ֗/נִי עַ֣ל מַה תְּרִיבֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/002.yaml
  text: I will say to God[a], ‘Do not condemn me[b]; let me know why you contend with me.’
translation:
  language: de
  text: 'Ich will zu Gott sagen: »Sprich mich nicht schuldig[a]; lass mich wissen, weshalb du gegen mich streitest[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verurteile mich nicht«; das hebräische Verb hat einen gerichtlichen Sinn und bezeichnet das Erklären für schuldig.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »einen Rechtsstreit gegen mich führst« beziehungsweise »mit mir rechtest«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Ich will … sagen
  rationale: Das Qal-Imperfekt der 1. Person Singular kann hier futurisch oder modal verstanden werden. Im Zusammenhang leitet es Hiobs beabsichtigte Anrede an Gott ein.
- source_word: אֶל אֱלוֹהַּ
  choice: zu Gott
  rationale: אֱלוֹהַּ ist im Hiobbuch eine singularische Bezeichnung für Gott; die natürliche deutsche Wiedergabe ist »Gott«.
- source_word: אַל תַּרְשִׁיעֵנִי
  choice: Sprich mich nicht schuldig
  rationale: 'Das Hifil von רשע hat einen gerichtlichen Sinn: jemanden für schuldig erklären. Die Formulierung bildet diesen Sinn genauer ab als das breitere »verurteile mich nicht«.'
- source_word: הוֹדִיעֵנִי
  choice: lass mich wissen
  rationale: Der Hifil-Imperativ von ידע bedeutet, jemanden wissen zu lassen oder ihm etwas mitzuteilen. Die gewählte Form ist natürlich und bewahrt die kausative Bedeutung.
- source_word: עַל מַה
  choice: weshalb
  rationale: Die Wendung fragt hier nach dem Grund oder Anlass und wird im Deutschen idiomatisch mit »weshalb« wiedergegeben.
- source_word: תְּרִיבֵנִי
  choice: du gegen mich streitest
  rationale: ריב kann streiten, rechten oder einen Rechtsstreit führen bedeuten. »Gegen mich streiten« bewahrt sowohl den Konflikt- als auch den möglichen gerichtlichen Unterton.
theological_decisions:
- issue: Gerichtlicher Unterton von Hiobs Bitte an Gott
  choice: »Sprich mich nicht schuldig« und »gegen mich streitest«
  alternative: »Verurteile mich nicht« und »einen Rechtsstreit gegen mich führst«
  rationale: Die Übersetzung erhält die Rechtssprache, ohne die ganze Aussage auf ein technisch verstandenes Gerichtsverfahren festzulegen. So bleibt die Spannung bestehen, dass Hiob Gott zugleich als Richter und als seinen Widerpart anspricht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; die forensische Mehrdeutigkeit der beiden zentralen Verben wird im Text und in den Fußnoten gewahrt.
