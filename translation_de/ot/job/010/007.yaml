source:
  edition: WLC
  text: עַֽל דַּ֭עְתְּ/ךָ כִּי לֹ֣א אֶרְשָׁ֑ע וְ/אֵ֖ין מִ/יָּדְ/ךָ֣ מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/007.yaml
  text: Though you know that I am not wicked[b][a], there is no one who can deliver from your hand.
translation:
  language: de
  text: Obwohl du weißt, dass ich nicht gottlos bin[a], kann mich doch niemand aus deiner Hand[b] retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ich nicht schuldig bin“. Wörtlich steht hier „nicht gottlos“. Hiob bestreitet damit, ein gottloser Mensch zu sein; er behauptet nicht unbedingt, völlig sündlos zu sein.'
    reason: lexical_alternative
  - marker: b
    text: „Aus deiner Hand“ ist ein hebräisches Bild für die Befreiung aus jemandes Macht oder Gewalt.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דַּעְתְּךָ
  choice: Obwohl du weißt
  rationale: Die Wendung führt hier Gottes Wissen mit einem im Zusammenhang naheliegenden konzessiven Sinn ein. Die Übersetzung klingt im Deutschen natürlich und bewahrt Hiobs vorwurfsvollen Appell an Gottes Wissen.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet den Inhalt dessen ein, was Gott weiß. Der konzessive Sinn wird bereits durch „obwohl“ ausgedrückt.
- source_word: לֹא אֶרְשָׁע
  choice: ich nicht gottlos bin
  rationale: Das Qal-Imperfekt von רשע kann hier einen Zustand bezeichnen. „Nicht gottlos“ bewahrt den moralischen Begriff des Hebräischen und macht daraus weder eine Behauptung völliger Sündlosigkeit noch lediglich einen juristischen Freispruch.
- source_word: וְאֵין
  choice: kann doch niemand
  rationale: Die deutsche Formulierung gibt die absolute Verneinung der hebräischen Existenzkonstruktion idiomatisch wieder; „doch“ unterstreicht den durch „obwohl“ eröffneten Gegensatz.
- source_word: מִיָּדְךָ
  choice: aus deiner Hand
  rationale: Die wörtliche Wiedergabe erhält das hebräische Bild für Macht und Verfügungsgewalt.
- source_word: מַצִּיל
  choice: retten
  rationale: Das Hifil-Partizip von נצל bezeichnet jemanden, der befreit oder rettet. Mit „kann“ ergibt sich im Deutschen eine natürliche Aussage über die Unmöglichkeit einer Rettung.
theological_decisions:
- issue: Hiobs Behauptung seiner Unschuld vor Gott
  choice: Hiob bestreitet, gottlos zu sein.
  alternative: „Ich bin nicht schuldig“ oder „Ich bin unschuldig“
  rationale: Das Hebräische verwendet רשע („gottlos, schuldig/frevelhaft“) und behauptet nicht ausdrücklich völlige Sündlosigkeit. Die Übersetzung bewahrt die Spannung von Hiobs Klage, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform ist natürlich, bewahrt aber das Bild der „Hand“ sowie die knappe, spannungsvolle Aussage des Hebräischen.
