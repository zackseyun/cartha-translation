  text: כַּ/אֲשֶׁ֣ר לֹא הָיִ֣יתִי אֶהְיֶ֑ה מִ֝/בֶּ֗טֶן לַ/קֶּ֥בֶר אוּבָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/019.yaml
  text: I would have been as though I had not been[b][a]; from the womb I would have been carried to the grave.
translation:
  language: de
  text: Ich wäre wie wenn ich nie gewesen wäre; vom Mutterleib ins Grab würde ich getragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: als
  rationale: Die Vergleichspartikel leitet hier einen irrealen Vergleich ein; zusammen mit „als hätte ich“ gibt sie den kontrafaktischen Sinn natürlich wieder.
- source_word: לֹא הָיִיתִי אֶהְיֶה
  choice: Ich wäre, als hätte ich nie existiert
  rationale: Die Abfolge der Formen von היה beschreibt im Zusammenhang einen irrealen, von Hiob gewünschten Zustand. Die deutsche Konstruktion mit Konjunktiv II bewahrt diesen Sinn, ohne ein missverständliches Futur zu verwenden.
- source_word: מִבֶּטֶן
  choice: vom Mutterleib
  rationale: Die konkrete Geburtsmetaphorik des Hebräischen bleibt erhalten; „vom Mutterleib“ ist im Deutschen würdig und verständlich.
- source_word: לַקֶּבֶר
  choice: ins Grab
  rationale: קֶבֶר bezeichnet hier das Grab beziehungsweise die Begräbnisstätte, nicht die Unterwelt; „ins Grab“ ist präzise und idiomatisch.
- source_word: אוּבָל
  choice: hätte man mich ... getragen
  rationale: Der Hophal von יבל hat passiv-kausativen Sinn („gebracht/getragen werden“). Die unpersönliche deutsche Form ist natürlich und bewahrt das Bild, unmittelbar vom Mutterleib zum Grab getragen zu werden.
theological_decisions:
- issue: Hiobs Aussage über Nichtsein und Tod
  choice: Als irrealen Wunsch formuliert
  alternative: Als wörtliche Lehraussage über Präexistenz oder den Zustand nach dem Tod verstehen
  rationale: Grammatik und Kontext kennzeichnen die Aussage als kontrafaktische Klage. Die Übersetzung legt daher keine darüber hinausgehende anthropologische oder konfessionelle Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konjunktiv II macht den irrealen Wunsch deutlich; die knappe Parallelstruktur und die starke Bewegung vom Mutterleib zum Grab bleiben erhalten.
