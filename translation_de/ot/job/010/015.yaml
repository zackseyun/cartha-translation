source:
  edition: WLC
  text: אִם רָשַׁ֡עְתִּי אַלְלַ֬י לִ֗/י וְ֭/צָדַקְתִּי לֹא אֶשָּׂ֣א רֹאשִׁ֑/י שְׂבַ֥ע קָ֝ל֗וֹן וּ/רְאֵ֥ה עָנְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/015.yaml
  text: If I am wicked[a], woe to me! Even if I am righteous, I cannot lift up my head, filled with disgrace and looking on my affliction.
translation:
  language: de
  text: Wenn ich Unrecht getan habe, wehe mir! Selbst wenn ich im Recht bin, kann ich meinen Kopf nicht erheben, von Schmach erfüllt – sieh mein Elend![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Fortsetzung von Hiobs Selbstbeschreibung: »… von Schmach erfüllt und auf mein Elend blickend.« Der hebräische Satzbau ist schwierig; die überlieferte Punktierung kann auch als direkte Aufforderung an Gott verstanden werden: »Sieh mein Elend!«'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם רָשַׁעְתִּי
  choice: Wenn ich Unrecht getan habe
  rationale: Die Verbform bezeichnet hier am natürlichsten ein sündhaftes oder unrechtes Handeln. Die Wiedergabe als Handlung bewahrt den perfektischen Aspekt und vermeidet eine vorschnelle rein forensische Verengung auf »schuldig«.
- source_word: אַלְלַי לִי
  choice: wehe mir
  rationale: Die feste Klageformel wird knapp, idiomatisch und mit ihrer vollen Ausrufekraft wiedergegeben.
- source_word: וְצָדַקְתִּי
  choice: Selbst wenn ich im Recht bin
  rationale: Das וְ hat im Gegensatz zum vorangehenden Satz konzessive Kraft. »Im Recht sein« bewahrt hier die moralisch-rechtliche Spannung von צדק, ohne Hiobs Aussage zu einer umfassenden Behauptung persönlicher Sündlosigkeit auszuweiten.
- source_word: לֹא אֶשָּׂא רֹאשִׁי
  choice: kann ich meinen Kopf nicht erheben
  rationale: Die deutsche Wendung gibt sowohl die konkrete Bildsprache als auch den Gedanken verlorener Würde und Zuversicht wieder. »Kann nicht« drückt die kontextuelle Unmöglichkeit aus, ohne das Hebräische als bloßen Willensentschluss zu lesen.
- source_word: שְׂבַע קָלוֹן
  choice: Ich bin der Schmach satt
  rationale: שְׂבַע bezeichnet das Gesättigt- oder Übervollsein. »Der Schmach satt« ist im Deutschen natürlich, erhält das Sättigungsbild und vermittelt zugleich Hiobs völlige Überlastung durch Erniedrigung.
- source_word: וּרְאֵה עָנְיִי
  choice: sieh doch mein Elend
  rationale: Die masoretische Punktierung legt formal einen Imperativ im Singular nahe. Daher wird die Wendung als unmittelbare Bitte an Gott wiedergegeben; »doch« macht den eindringlichen, klagenden Ton natürlich hörbar.
theological_decisions:
- issue: Deutung von וּרְאֵה עָנְיִי
  choice: 'Unmittelbare Bitte an Gott: »sieh doch mein Elend«'
  alternative: 'Fortsetzung von Hiobs Selbstbeschreibung: »und blicke auf mein Elend« beziehungsweise »mein Elend vor Augen«'
  rationale: Die hebräische Syntax ist schwierig, doch die überlieferte Punktierung von רְאֵה spricht am deutlichsten für einen Imperativ. Die alternative Einbindung in Hiobs Selbstbeschreibung bleibt in der Fußnote ausdrücklich offen, sodass der mögliche abrupte Wechsel zur Anrede Gottes nicht geglättet und die textliche Spannung nicht verschwiegen wird.
- issue: Bedeutungsumfang von צדק
  choice: »im Recht bin«
  alternative: »gerecht bin«
  rationale: Im Streitkontext steht besonders Hiobs Recht gegenüber der gegen ihn erhobenen Anklage im Vordergrund. »Im Recht« wahrt diesen forensischen Akzent, ohne die Frage nach seiner Gerechtigkeit theologisch umfassender zu entscheiden, als es der Vers verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Klagesprache. Die Satzteilung macht den abrupten Übergang zur möglichen direkten Gottesanrede verständlich, ohne die Schwierigkeit des Hebräischen zu verdecken. »Schmach« erhält den öffentlichen Charakter der Erniedrigung; »der Schmach satt« bewahrt zugleich das hebräische Sättigungsbild.
