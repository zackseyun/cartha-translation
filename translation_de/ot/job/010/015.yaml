  terminology: »Unrecht getan«, »im Recht«, »Kopf erheben«, »Schmach« und »Elend« sind sachgerecht. »Im Recht« wahrt den forensischen Akzent von צדק; die Fußnote erhält die breitere alternative Selbstbeschreibung sowie die syntaktische Unsicherheit bei וּרְאֵה offen.
