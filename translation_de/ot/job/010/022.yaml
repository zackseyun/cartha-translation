  text: a land of gloom[a], like deep darkness, of the shadow of death and without order, where it shines like deep darkness.
translation:
  language: de
  text: ein Land der Düsternis, wie tiefes Dunkel, ein Land des Todesschattens[a] und ohne Ordnung, wo es wie tiefes Dunkel leuchtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »tiefer Dunkelheit«. Das hebräische Wort צַלְמָוֶת kann speziell den Todesschatten oder allgemeiner sehr tiefe Dunkelheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: Land
  rationale: Im Zusammenhang bezeichnet das Wort das Totenreich als Bereich oder Ort; »Land« wahrt die räumliche Bildsprache.
- source_word: עֵיפָתָה
  choice: der Düsternis
  rationale: Die Form bezeichnet hier Dunkelheit oder Düsterkeit. »Düsternis« fügt sich natürlich in die gehäufte Dunkelheitsmetaphorik ein.
- source_word: כְּמוֹ אֹפֶל
  choice: wie tiefes Dunkel
  rationale: אֹפֶל meint dichte, tiefe Finsternis. Die Wiederholung dieser Wiedergabe erhält die rahmende und steigernde Wirkung des Hebräischen.
- source_word: צַלְמָוֶת
  choice: Todesschatten
  rationale: »Todesschatten« bewahrt die mögliche Verbindung mit Tod und Totenreich; die ebenfalls plausible allgemeinere Bedeutung »tiefer Schatten« wird in der Fußnote genannt.
- source_word: וְלֹא סְדָרִים
  choice: und ohne Ordnung
  rationale: סְדָרִים bezeichnet Ordnungen oder geregelte Strukturen; die Formulierung gibt die Vorstellung eines chaotischen, ungeordneten Bereichs knapp wieder.
- source_word: וַתֹּפַע
  choice: wo selbst das Licht … ist
  rationale: 'Das Verb יפע bezeichnet Leuchten oder Aufstrahlen. Die kontextuelle Wiedergabe macht das paradoxe Bild idiomatisch verständlich: Selbst das dortige Leuchten gleicht tiefem Dunkel.'
theological_decisions:
- issue: Bedeutung von צַלְמָוֶת
  choice: Todesschatten im Haupttext
  alternative: tiefer Schatten / tiefes Dunkel
  rationale: Die traditionelle, etymologisch naheliegende Todesassoziation passt zum Kontext des Totenreichs, doch die lexikalische Mehrdeutigkeit wird nicht dogmatisch entschieden, sondern durch die Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die dichte Reihung der Dunkelheitsbegriffe und das paradoxe Schlussbild bleiben erhalten; »selbst das Licht« verdeutlicht die implizite Pointe, ohne sie theologisch aufzulösen.
