  text: וְ/לָ֣/מָּה מֵ֭/רֶחֶם הֹצֵאתָ֑/נִי אֶ֝גְוַ֗ע וְ/עַ֣יִן לֹא תִרְאֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/018.yaml
  text: Why[a], then, did you bring me out from the womb? I should have died, and no eye would have seen me.
translation:
  language: de
  text: Warum hast du mich denn aus dem Mutterleib kommen lassen? Ich wäre gestorben, und kein Auge hätte mich gesehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder näher an der Form des Hebräischen: „Ich würde sterben, und kein Auge würde mich sehen.“ Die hebräischen Imperfektformen lassen diese Wiedergabe zu; der Zusammenhang spricht jedoch für einen irrealen Sinn.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Warum … dann
  rationale: לָמָה ist die direkte Frage „warum“; das vorangestellte וְ verbindet sie mit der vorausgehenden Klage. „Dann“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: מֵרֶחֶם
  choice: aus dem Mutterleib
  rationale: Die räumliche Herkunftsangabe bewahrt das konkrete Bild der Geburt; „Mutterleib“ ist im Deutschen eindeutig und dem würdigen Register angemessen.
- source_word: הֹצֵאתָנִי
  choice: hast du mich … hervorgeholt
  rationale: Der Hifil von יצא bezeichnet hier das Veranlassen des Herauskommens, also Gottes Hervorbringen bei der Geburt. „Hervorgeholt“ wahrt die direkte Anrede und klingt im modernen Deutsch natürlich.
- source_word: אֶגְוַע
  choice: Ich wäre gestorben
  rationale: Das Qal-Imperfekt von גוע bezeichnet im Klagezusammenhang die nicht eingetretene, von Hiob gewünschte Folge. Der deutsche Konjunktiv II gibt diesen irrealen Sinn idiomatisch wieder.
- source_word: וְעַיִן לֹא תִרְאֵנִי
  choice: und kein Auge hätte mich gesehen
  rationale: „Auge“ steht metonymisch für einen Menschen, der Hiob erblickt hätte. Die Negation wird im Deutschen natürlich mit „kein Auge“ ausgedrückt; der Konjunktiv II führt die irreale Folge fort.
theological_decisions:
- issue: Irrealer Todeswunsch oder formal unabgeschlossene Aussage
  choice: 'Die beiden Imperfektformen werden als irreale, auf die Vergangenheit bezogene Folge wiedergegeben: „wäre gestorben … hätte … gesehen“.'
  alternative: 'Formaler: „Ich würde sterben, und kein Auge würde mich sehen.“'
  rationale: Die hebräischen Imperfektformen lassen formal eine weniger ausdrücklich kontrafaktische Wiedergabe zu. Im Zusammenhang von Hiobs Klage über seine Geburt ist jedoch der nicht eingetretene Ausgang gemeint, ohne die Spannung seines an Gott gerichteten Todeswunsches abzuschwächen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Klageton. Die direkte Anrede Gottes und das konkrete Geburtsbild bleiben erhalten; die ungewöhnliche Metonymie „kein Auge“ wird bewusst nicht geglättet.
