  text: Did you not pour me out like milk and curdle me like cheese?[a]
translation:
  language: de
  text: Hast du mich nicht wie Milch ausgegossen und wie Käse gerinnen lassen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Quark gerinnen lassen“. Das hebräische Substantiv kann konkreter „Käse“ oder allgemeiner ein geronnenes Milchprodukt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hast du nicht
  rationale: Leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet; die deutsche Form bewahrt Fragecharakter und Rückbezug.
- source_word: כֶחָלָב
  choice: wie Milch
  rationale: Das präfigierte כ kennzeichnet den Vergleich; „wie Milch“ gibt das Bild knapp und idiomatisch wieder.
- source_word: תַּתִּיכֵנִי
  choice: mich ausgegossen
  rationale: Der Hifil von נתך bezeichnet hier das Ausgießen einer Flüssigkeit; die Wiedergabe passt zum Milchbild und erhält die körperliche Entstehungsmetapher.
- source_word: וְכַגְּבִנָּה
  choice: und mich wie Käse
  rationale: גְּבִנָּה kann konkret „Käse“ oder allgemeiner ein geronnenes Milchprodukt bezeichnen; „Käse“ ist die unmittelbare, verständliche Hauptwiedergabe.
- source_word: תַּקְפִּיאַנִי
  choice: gerinnen lassen
  rationale: Der Hifil von קפא drückt das Verfestigen beziehungsweise Gerinnen aus. „Gerinnen lassen“ ist im Deutschen für Milch natürlich und bildet die verursachende Verbform ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die anschauliche Metapher von Ausgießen und Gerinnen bleiben erhalten; die Wiederholung von „mich“ sorgt für natürliche deutsche Syntax.
