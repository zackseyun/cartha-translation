id: JOB.10.12
reference: Job 10:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חַיִּ֣ים וָ֭/חֶסֶד עָשִׂ֣יתָ עִמָּדִ֑/י וּ֝/פְקֻדָּתְ/ךָ֗ שָֽׁמְרָ֥ה רוּחִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/012.yaml
  text: You have granted me life and steadfast love[b][a], and your care has preserved my spirit.
translation:
  language: de
  text: Du hast mir Leben und beständige Liebe geschenkt, und deine Fürsorge[a] hat meinen Geist[b] bewahrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Aufsicht“; das hebräische Wort kann auch „Heimsuchung“ bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meinen Atem“ beziehungsweise „meinen Lebensatem“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  choice: Leben
  rationale: Die morphologische Pluralform bezeichnet hier idiomatisch das Leben als Ganzes; der deutsche Singular ist die natürliche Entsprechung.
- source_word: וָחֶסֶד
  choice: beständige Liebe
  rationale: חֶסֶד umfasst Güte, verlässliche Zuwendung und loyale Liebe. „Beständige Liebe“ bewahrt dieses Bedeutungsgewicht, ohne den Ausdruck auf eine bestimmte dogmatische Deutung einzuengen.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: hast mir … geschenkt
  rationale: Wörtlich steht „hast mit mir getan“. Zusammen mit „Leben und beständige Liebe“ bezeichnet die Wendung hier das gütige Gewähren dieser Gaben; „geschenkt“ gibt den begünstigenden Sinn natürlich wieder.
- source_word: וּפְקֻדָּתְךָ
  choice: deine Fürsorge
  rationale: פְקֻדָּה kann Aufsicht, Zuwendung oder Heimsuchung bezeichnen. Weil diese Zuwendung den Geist bewahrt, passt „Fürsorge“ im Kontext am besten; die weitere Bedeutungsbreite wird in der Fußnote offengelegt.
- source_word: שָׁמְרָה
  choice: hat … bewahrt
  rationale: שׁמר bedeutet bewahren, behüten oder schützen. „Bewahrt“ entspricht dem hebräischen Verb eng und passt zur Erhaltung von Geist beziehungsweise Lebensatem.
- source_word: רוּחִי
  choice: meinen Geist
  rationale: רוּחַ kann „Geist“, „Atem“ oder „Lebensatem“ bedeuten. „Geist“ ist im Deutschen eine würdige und kontextuell passende Hauptlesart; die körperlich-lebensbezogene Alternative bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutungsgehalt von חֶסֶד in Bezug auf Gott
  choice: beständige Liebe
  alternative: Güte; Barmherzigkeit; loyale Liebe
  rationale: Die Formulierung bringt Gottes verlässliche, wohlwollende Zuwendung zum Ausdruck, ohne ausdrücklich eine engere Bundesterminologie vorauszusetzen.
- issue: Bedeutung von פְקֻדָּה
  choice: positive göttliche Fürsorge
  alternative: Aufsicht; Heimsuchung
  rationale: Der Folgesatz „hat meinen Geist bewahrt“ spricht hier für eine wohlwollende, erhaltende Zuwendung. Die lexikalische Mehrdeutigkeit wird dennoch nicht verschwiegen.
- issue: Bedeutung von רוּחַ
  choice: Geist
  alternative: Atem; Lebensatem
  rationale: Der Zusammenhang erlaubt sowohl die innere Lebenskraft als auch den lebensspendenden Atem. Die Hauptübersetzung entscheidet sich für „Geist“, während die Fußnote die echte Alternative bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Ton. Die Satzstruktur bleibt nahe am hebräischen Parallelismus; schwer verständliche Wörtlichkeit wird vermieden. Die Fußnotenmarker stehen unmittelbar bei den jeweils mehrdeutigen Ausdrücken.
