  text: before I go—and do not return—to the land of darkness and deep shadow,[a]
translation:
  language: de
  text: bevor ich gehe – und nicht zurückkehre – in das Land der Finsternis und des tiefen Schattens,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: »das Land der Finsternis und des Todesschattens«.'
    reason: Lexikalische Alternative zu צַלְמָוֶת.
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: bevor
  rationale: Die temporale Konjunktion gibt die Bedeutung »bevor« unmittelbar und natürlich wieder.
- source_word: אֵלֵךְ
  choice: ich gehe
  rationale: Die einfache Bewegungsbedeutung von הלך bleibt erhalten, ohne das im Zusammenhang gemeinte Sterben ausdrücklich in den Text einzutragen.
- source_word: וְלֹא אָשׁוּב
  choice: und nicht zurückkehre
  rationale: Die Verbindung aus Konjunktion, Verneinung und שׁוב wird eng am Hebräischen wiedergegeben; ein verstärkendes »nie mehr« wird nicht ergänzt.
- source_word: אֶל
  choice: in
  rationale: Bei einer Bewegung in ein als Raum vorgestelltes Land ist »in« im Deutschen idiomatischer als »zu«.
- source_word: אֶרֶץ
  choice: das Land
  rationale: אֶרֶץ bezeichnet hier einen Bereich beziehungsweise ein Land, nicht allgemein die Erde.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: »Finsternis« gibt die Grundbedeutung wieder und wahrt den würdevoll-poetischen Ton.
- source_word: צַלְמָוֶת
  choice: tiefer Schatten
  rationale: Die Wendung wahrt das Bild und die lexikalische Spannung zwischen tiefem Dunkel und der traditionellen Deutung als Todesschatten.
theological_decisions:
- issue: Wiedergabe von צַלְמָוֶת im poetischen Todeskontext
  choice: tiefer Schatten
  alternative: Todesschatten; tiefes Dunkel
  rationale: Der Haupttext erhält das Schattenbild, ohne die umstrittene Todeskomponente ausdrücklich festzulegen. Die traditionelle Wiedergabe wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Bildsprache. Der Satzbau folgt dem hebräischen Gedankenfluss und lässt den Vers als Fortsetzung der vorausgehenden Bitte erkennen.
