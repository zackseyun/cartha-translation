  terminology: „Gottlose“ und „Werk deiner Hände“ passen zum würdigen, modernen Bibelregister. Die Fußnote wahrt zutreffend die mögliche pragmatische Nuance einer begünstigenden Zuwendung, ohne sie dem Haupttext aufzuzwingen.
