  text: הֲ/ט֤וֹב לְ/ךָ֨ כִּֽי תַעֲשֹׁ֗ק כִּֽי תִ֭מְאַס יְגִ֣יעַ כַּפֶּ֑י/ךָ וְ/עַל עֲצַ֖ת רְשָׁעִ֣ים הוֹפָֽעְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/003.yaml
  text: Is it good for you that you oppress[a], that you despise the work of your hands, and shine upon the counsel of the wicked?
translation:
  language: de
  text: Ist es gut für dich, dass du unterdrückst, dass du das Werk deiner Hände verachtest und den Plan der Gottlosen bescheinst?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und dem Plan der Gottlosen deine Gunst erweist“. Das hebräische Verb bedeutet wörtlich „aufleuchten“ oder „strahlend erscheinen“ und drückt hier wahrscheinlich wohlwollende Zuwendung aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב לְךָ
  choice: Ist es gut für dich
  rationale: Die direkte rhetorische Frage bewahrt sowohl den Grundsinn von טוֹב als auch Hiobs scharfe Herausforderung, ohne sie deutend zu „Gefällt es dir“ abzuschwächen.
- source_word: תַעֲשֹׁק
  choice: du unterdrückst
  rationale: Das Verb עָשַׁק bezeichnet Bedrückung beziehungsweise Unterdrückung; die kräftige Wiedergabe erhält den anklagenden Ton.
- source_word: תִמְאַס
  choice: du ... verachtest
  rationale: מָאַס verbindet Ablehnung mit Geringschätzung. „Verachten“ gibt diese Nuance im Kontext natürlich wieder.
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: das Werk deiner Hände
  rationale: יְגִיעַ kann Mühe, Arbeit oder deren Erzeugnis bezeichnen. Zusammen mit „deiner Hände“ verweist es hier idiomatisch auf das von Gott Geschaffene.
- source_word: עֲצַת רְשָׁעִים
  choice: der Plan der Gottlosen
  rationale: עֵצָה kann Rat, Plan oder Vorhaben bedeuten. Im Zusammenhang bezeichnet „Plan“ natürlich das beabsichtigte Handeln der Gottlosen, ohne dessen genaue Art festzulegen.
- source_word: הוֹפָעְתָּ
  choice: du ... aufleuchtest
  rationale: Der Hifil von יָפַע bezeichnet ein strahlendes Erscheinen oder Aufleuchten. Die Bildsprache bleibt im Haupttext erhalten; ihre wahrscheinlich positive Bedeutung wird in der Fußnote erläutert.
theological_decisions:
- issue: Anthropomorphe Anklage gegen Gott
  choice: Hiobs direkte rhetorische Herausforderung bleibt ungemildert stehen.
  alternative: „dass du zu unterdrücken scheinst“ oder „dass es dir gefällt, Unrecht zu tun“
  rationale: Der hebräische Text formuliert die Klage scharf und anklagend. Eine dogmatisch motivierte Abschwächung würde die theologische Spannung des Verses vorzeitig auflösen.
- issue: Bedeutung des göttlichen Aufleuchtens über den Gottlosen
  choice: Die konkrete Lichtmetapher steht im Haupttext; die mögliche Bedeutung „Gunst erweisen“ erscheint als Alternative in der Fußnote.
  alternative: „und den Plan der Gottlosen begünstigst“
  rationale: Die metaphorische Form des Hebräischen ist eindeutig genug, während ihre pragmatische Bedeutung nicht vollständig expliziert wird. Haupttext und Fußnote bewahren beides.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen mit „dass“ eingeleiteten Glieder erhalten die eindringliche Rhetorik. „Gottlose“ ist bibelsprachlich vertraut, aber weiterhin allgemein verständlich; „aufleuchten“ bewahrt bewusst das ungewöhnliche Bild des Ausgangstextes.
