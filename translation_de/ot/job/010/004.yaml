  text: הַ/עֵינֵ֣י בָשָׂ֣ר לָ֑/ךְ אִם כִּ/רְא֖וֹת אֱנ֣וֹשׁ תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/004.yaml
  text: Do you have eyes of flesh[a], or do you see as a man sees?
translation:
  language: de
  text: Hast du Augen aus Fleisch, oder siehst du, wie ein Mensch[a] sieht?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Sterblicher sieht“. Das hebräische Wort bezeichnet allgemein einen Menschen und kann dessen Sterblichkeit oder Schwäche anklingen lassen.'
    reason: Lexikalische Bedeutungsnuance von אֱנוֹשׁ.
lexical_decisions:
- source_word: הַעֵינֵי בָשָׂר לָךְ
  choice: Hast du Augen aus Fleisch
  rationale: Die hebräische Nominalkonstruktion mit לָךְ drückt Besitz aus. Die deutsche Wendung „Hast du“ gibt dies natürlich wieder; „Augen aus Fleisch“ bewahrt das konkrete Bild körperlich begrenzter Wahrnehmung.
- source_word: אִם
  choice: oder
  rationale: אִם leitet hier in der rhetorischen Frage keine Bedingung, sondern die zweite Vergleichsfrage ein.
- source_word: כִּרְאוֹת
  choice: wie … sieht
  rationale: Die Präposition כְּ mit dem Infinitiv von ראה bildet einen Vergleich. Die finite deutsche Formulierung ist natürlich und erhält den Bezug zum Sehen.
- source_word: אֱנוֹשׁ
  choice: ein Mensch
  rationale: אֱנוֹשׁ bezeichnet im generischen Singular einen Menschen, häufig mit einem Beiklang von Sterblichkeit oder Schwäche. „Ein Mensch“ gibt den allgemeinen Sinn idiomatisch wieder, ohne den Beiklang im Haupttext zu verstärken.
- source_word: תִּרְאֶה
  choice: siehst du
  rationale: ראה bedeutet hier „sehen“ beziehungsweise „wahrnehmen“. „Siehst du“ bewahrt die konkrete Bildsprache und die rhetorische Zuspitzung.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Wahrnehmung
  choice: Der konkrete Gegensatz zwischen „Augen aus Fleisch“ und Gottes Sehen bleibt ungemildert stehen.
  alternative: 'Deutend umschreiben: „Beurteilst du nach dem äußeren Anschein wie Menschen?“'
  rationale: Der hebräische Text formuliert bewusst körperlich und rhetorisch. Eine erklärende Umschreibung würde die Bildsprache abschwächen und eine Auslegung in den Text eintragen.
- issue: Generischer Singular אֱנוֹשׁ
  choice: ein Mensch
  alternative: ein Sterblicher
  rationale: „Ein Mensch“ wahrt den generischen Singular. Der mögliche Beiklang menschlicher Sterblichkeit und Schwäche wird in der Fußnote kenntlich gemacht, ohne ihn als alleinige Bedeutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe rhetorische Frage und das konkrete Bild des hebräischen Textes bleiben erhalten.
