id: JOB.10.5
reference: Job 10:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/כִ/ימֵ֣י אֱנ֣וֹשׁ יָמֶ֑י/ךָ אִם שְׁ֝נוֹתֶ֗י/ךָ כִּ֣/ימֵי גָֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/005.yaml
  text: Are your days like the days of man[b][a], or your years like the days of a mighty man?
translation:
  language: de
  text: Sind deine Tage wie die eines Sterblichen[a] oder deine Jahre wie die eines Mannes[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines Menschen“. Das hebräische Wort אֱנוֹשׁ kann die Gebrechlichkeit und Sterblichkeit des Menschen hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort גָבֶר kann auch „kräftiger Mann“ oder „starker Mann“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִימֵי ... יָמֶיךָ
  choice: Sind deine Tage wie die eines ...?
  rationale: Die Fragepartikel הֲ und die Vergleichspartikel כְּ ergeben eine rhetorische Vergleichsfrage. Die deutsche Wortstellung ist natürlich und bewahrt den Bezug auf Gottes Tage.
- source_word: אֱנוֹשׁ
  choice: Sterblichen
  rationale: אֱנוֹשׁ bezeichnet den Menschen häufig unter dem Gesichtspunkt seiner Schwäche und Sterblichkeit. „Sterblicher“ gibt diese Nuance wieder und unterscheidet den Ausdruck zugleich von גָבֶר im zweiten Versglied.
- source_word: אִם
  choice: oder
  rationale: Im parallelen Fragesatz verbindet אִם die zweite Vergleichsfrage alternativ mit der ersten; es leitet hier keinen Bedingungssatz ein.
- source_word: שְׁנוֹתֶיךָ
  choice: deine Jahre
  rationale: Direkte Wiedergabe des Plurals mit Suffix der zweiten Person Singular; der Ausdruck steht parallel zu „deine Tage“.
- source_word: כִּימֵי גָבֶר
  choice: wie die eines Mannes
  rationale: גָבֶר bezeichnet einen Mann und kann Kraft oder Manneskraft anklingen lassen. „Mann“ vermeidet eine Überdeutung und wahrt durch den Gegensatz zu „Sterblicher“ dennoch die lexikalische Variation.
theological_decisions:
- issue: Gottes Verhältnis zu menschlicher Lebenszeit
  choice: Die rhetorische Frage bleibt als Vergleich formuliert.
  alternative: Eine erklärende Aussage über Gottes Ewigkeit.
  rationale: Der hebräische Text fragt, ob Gottes Tage und Jahre menschlichen Zeitmaßen gleichen; er formuliert die Folgerung nicht ausdrücklich und soll daher nicht dogmatisch erweitert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die verkürzte Wiederaufnahme „wie die eines …“ vermeidet unnötige Wiederholung, ohne die poetische Parallelität aufzugeben. Die beiden verschiedenen hebräischen Menschenbezeichnungen werden im Deutschen als „Sterblicher“ und „Mann“ unterschieden.
