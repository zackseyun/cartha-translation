base_translation:
  language: en
  yaml_path: translation/ot/job/010/009.yaml
  text: Remember[a], please, that you made me like clay[b], and will you return me to dust?
translation:
  language: de
  text: Denk doch daran, dass du mich wie Ton gemacht hast[a] – und wirst du mich wieder zu Staub werden lassen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie Ton“; gemeint ist ein Vergleich. Der hebräische Ausdruck sagt hier nicht ausdrücklich „aus Ton“, ruft aber die Bildwelt der Erschaffung des Menschen wach.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder als Aussage: „und du wirst mich wieder zu Staub werden lassen.“ Die hebräische Form kann im Zusammenhang als Aussage oder als rhetorische Frage verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר נָא
  choice: Denk doch daran
  rationale: Der Imperativ זְכָר richtet sich an Gott; נָא mildert ihn als eindringliche Bitte. „Denk doch daran“ klingt im modernen Deutschen natürlich und bewahrt den bittenden Ton.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, woran Gott denken soll.
- source_word: כַחֹמֶר
  choice: wie Ton
  rationale: Das Präfix כ־ bezeichnet ausdrücklich einen Vergleich. „Wie Ton“ bewahrt die Bildsprache, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „aus Ton“ einzuführen.
- source_word: עֲשִׂיתָנִי
  choice: du mich ... gemacht hast
  rationale: עשה ist das allgemeine Verb „machen“. Die Wiedergabe vermeidet eine unnötige Präzisierung zu „formen“, während der Tonvergleich die Schöpfungsbildsprache trägt.
- source_word: עָפָר
  choice: Staub
  rationale: „Staub“ ist die übliche und kontextgerechte Wiedergabe von עָפָר in der Bildwelt von Schöpfung und Sterblichkeit.
- source_word: תְּשִׁיבֵנִי
  choice: willst du mich wieder ... werden lassen?
  rationale: Der Hifil von שוב bedeutet, jemanden zurückzubringen beziehungsweise zurückkehren zu lassen. Im Deutschen gibt „wieder zu Staub werden lassen“ Ziel und Kausativität natürlich wieder.
theological_decisions:
- issue: Aussage oder rhetorische Frage im zweiten Satzteil
  choice: 'Als rhetorische Frage: „und willst du mich wieder zu Staub werden lassen?“'
  alternative: 'Als Aussage: „und du wirst mich wieder zu Staub werden lassen.“'
  rationale: Die hebräische Verbform trägt kein eigenes Fragezeichen; der Klagekontext erlaubt jedoch eine rhetorische Frage. Die Hauptfassung bewahrt Jobs protestierenden Appell, während die Fußnote die grammatisch mögliche Aussage nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Denk doch daran“ gibt die Bitte natürlich wieder; der Gedankenstrich markiert den Umschlag von Gottes schöpferischem Handeln zu Jobs Klage über die Rückkehr zum Staub.
