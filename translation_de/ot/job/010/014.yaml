  variant: modern standard German
source:
  edition: WLC
  text: אִם חָטָ֥אתִי וּ/שְׁמַרְתָּ֑/נִי וּ֝/מֵ/עֲוֺנִ֗/י לֹ֣א תְנַקֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/014.yaml
  text: If I sin[a], you watch me[b], and you will not acquit me of my iniquity.
translation:
  language: de
  text: Wenn ich sündige[a], beobachtest du mich genau[b] und sprichst mich nicht von meiner Schuld frei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn ich gesündigt habe …«'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist hier eine genaue, prüfende Beobachtung, nicht schützendes Bewahren.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet einen Bedingungssatz ein und bewahrt die Offenheit, ob Job hypothetisch oder allgemein spricht.
- source_word: חָטָאתִי
  choice: ich sündige
  rationale: Das Qal Perfekt 1. Person Singular steht hier in einem bedingten, allgemein gefassten Zusammenhang. Das deutsche Präsens gibt diesen Sinn natürlich wieder; »gesündigt habe« bleibt möglich.
- source_word: וּשְׁמַרְתָּנִי
  choice: beobachtest du mich genau
  rationale: שׁמר bezeichnet hier im Kontext göttlicher Prüfung keine schützende Bewahrung, sondern eine aufmerksame, belastende Überwachung.
- source_word: וּמֵעֲוֺנִי
  choice: von meiner Schuld
  rationale: עָוֹן kann Vergehen, Schuld oder deren Folge bezeichnen. Mit נקה liegt hier besonders der gerichtliche Aspekt der Schuld nahe, ohne die moralische Dimension auszublenden.
- source_word: לֹא תְנַקֵּנִי
  choice: sprichst mich nicht … frei
  rationale: 'Das Piel von נקה hat hier einen forensischen Sinn: für unschuldig erklären beziehungsweise freisprechen. Die deutsche Formulierung passt zum gerichtlichen Charakter von Jobs Klage.'
theological_decisions:
- issue: Forensischer oder reinigender Sinn von נקה
  choice: 'gerichtlich: »sprichst mich nicht von meiner Schuld frei«'
  alternative: 'reinigend: »reinigst du mich nicht«; auf Straflosigkeit bezogen: »lässt du mich nicht ungestraft«'
  rationale: Der Zusammenhang beschreibt Gottes prüfende Beobachtung und sein Nichtfreisprechen. Die gerichtliche Wiedergabe erhält Jobs anklagende Spannung, ohne spätere Lehrbegriffe einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Von meiner Schuld freisprechen« ist verständlich und bewahrt den forensischen Ton; »genau beobachten« macht die im Zusammenhang negative Bedeutung von שׁמר deutlich.
