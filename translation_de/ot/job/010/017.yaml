  text: תְּחַדֵּ֬שׁ עֵדֶ֨י/ךָ נֶגְדִּ֗/י וְ/תֶ֣רֶב כַּֽ֭עַשְׂ/ךָ עִמָּדִ֑/י חֲלִיפ֖וֹת וְ/צָבָ֣א עִמִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/017.yaml
  text: You renew your witnesses against me[a], and you increase your anger with me[b]; changes and hard service are with me.
translation:
  language: de
  text: 'Immer neue Zeugen lässt du gegen mich auftreten[a],

    und du lässt deinen Zorn auf mich wachsen;

    Wechsel und Kriegsdienst begleiten mich[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Immer neue Beweise bringst du gegen mich vor.« Das hebräische Wort kann Zeugen, Zeugnisse oder belastende Beweise bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Wechsel/Ablösungen und Heer/Kriegsdienst sind mit mir.« Die knappe hebräische Wortgruppe ist umstritten; möglich sind sowohl aufeinanderfolgende Ablösungen als auch ein Heer oder Kriegsdienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַדֵּשׁ
  choice: Immer neue … lässt du … auftreten
  rationale: Das Piel von חדש bezeichnet ein Erneuern oder Wieder-neu-Hervorbringen. Die idiomatische deutsche Wendung gibt sowohl den wiederholten Vorgang als auch das Auftreten der Zeugen wieder.
- source_word: עֵדֶיךָ
  choice: deine Zeugen
  rationale: עֵד kann einen Zeugen, ein Zeugnis oder einen Beweis bezeichnen. »Zeugen« bewahrt hier am besten das forensische Bild; die sachliche Bedeutung »Beweise« wird in der Fußnote genannt.
- source_word: נֶגְדִּי
  choice: gegen mich
  rationale: Das Wort bedeutet räumlich »vor mir«, erhält im rechtlichen und feindlichen Zusammenhang aber die natürliche Bedeutung »gegen mich«.
- source_word: וְתֶרֶב
  choice: und du lässt … wachsen
  rationale: Die Form von רבה drückt ein Vermehren oder Vergrößern aus. Mit »Zorn« ist »wachsen lassen« im Deutschen natürlich und wahrt die kausative Nuance.
- source_word: כַּעַשְׂךָ
  choice: deinen Zorn
  rationale: כעס kann Zorn, Unmut oder Verärgerung bezeichnen. Im Zusammenhang der direkten Klage zu Gott ist »Zorn« klar und angemessen.
- source_word: עִמָּדִי
  choice: auf mich
  rationale: Die Präposition bedeutet wörtlich »mit mir«. In Verbindung mit Zorn verlangt natürliches Deutsch jedoch »Zorn auf mich«; der feindliche Bezug bleibt erhalten.
- source_word: חֲלִיפוֹת
  choice: eine Angriffswelle nach der anderen
  rationale: Das Substantiv bezeichnet Wechsel, Ablösungen oder aufeinanderfolgende Einheiten. Zusammen mit צבא vermittelt es wahrscheinlich das Bild wiederholter militärischer Angriffe.
- source_word: וְצָבָא
  choice: und ein Heer
  rationale: צבא kann Heer, Heerschar, Kriegsdienst oder Dienstpflicht bedeuten. Im Zusammenhang mit חֲלִיפוֹת ist die militärische Bedeutung »Heer« naheliegend, ohne die alternative Lesart auszuschließen.
- source_word: עִמִּי
  choice: stehen gegen mich
  rationale: Wörtlich lautet die Wendung »sind mit mir«. Der feindliche Zusammenhang macht im Deutschen »stehen gegen mich« verständlich; die ungewöhnliche hebräische Formulierung wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Sind die »Zeugen« Personen oder Beweise für Hiobs vermeintliche Schuld?
  choice: Die personale Metapher »Zeugen« bleibt im Haupttext erhalten.
  alternative: »Beweise« oder »Zeugnisse«
  rationale: Der hebräische Ausdruck lässt beide Vorstellungen zu. Die Übersetzung legt nicht fest, ob konkrete Personen, Leiden als belastende Indizien oder bildhaft personifizierte Anklagen gemeint sind.
- issue: Deutung von חֲלִיפוֹת וְצָבָא
  choice: Die militärische Bildsprache wird als Folge von Angriffswellen und einem Heer wiedergegeben.
  alternative: »Wechsel und Frondienst« beziehungsweise »Ablösungen und Kriegsdienst«
  rationale: Die Verbindung der beiden Wörter begünstigt ein Bild aufeinanderfolgender feindlicher Kräfte, doch צבא kann auch schweren oder verpflichtenden Dienst bezeichnen. Diese Spannung wird durch die Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Klagesprache mit klarer poetischer Gliederung. Die erste und zweite Zeile bleiben rechtlich-forensisch, die dritte bewahrt den abrupten Wechsel zur militärischen Bildwelt. Ungewöhnliche hebräische Wendungen werden im Haupttext verständlich gemacht und in den Fußnoten transparent gehalten.
