  text: שַׂ֣ק תָּ֭פַרְתִּי עֲלֵ֣י גִלְדִּ֑/י וְ/עֹלַ֖לְתִּי בֶ/עָפָ֣ר קַרְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/015.yaml
  text: I have sewn sackcloth over my skin[b][a], and thrust my horn into the dust.
translation:
  language: de
  text: Ich habe Sacktuch über meine Haut genäht und mein Horn[b] in den Staub gedrückt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Horn in den Staub gesenkt“; möglicherweise auch: „mein Horn im Staub entweiht“. Das hebräische Verb ist schwierig; seine genaue Bedeutung ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: Das „Horn“ ist im Hebräischen ein Bild für Kraft, Ehre oder erhöhtes Ansehen.
    reason: cultural_note
lexical_decisions:
- source_word: שַׂק
  choice: Sacktuch
  rationale: Bezeichnet den groben Stoff beziehungsweise das Trauergewand; „Sacktuch“ ist im Deutschen die etablierte und im Klagekontext präzise Wiedergabe.
- source_word: תָּפַרְתִּי
  choice: Ich habe … genäht
  rationale: Qal Perfekt 1. Person Singular von תפר, „nähen“. Das deutsche Perfekt bezeichnet passend eine vollzogene Handlung, deren Ergebnis fortbesteht.
- source_word: עֲלֵי
  choice: über
  rationale: Die Präposition bezeichnet hier die Anbringung des Sacktuchs über beziehungsweise auf der Haut. „Über“ bewahrt das körperliche Bild natürlich.
- source_word: גִלְדִּי
  choice: meine Haut
  rationale: גֶּלֶד bezeichnet Haut beziehungsweise Fell. „Meine Haut“ ist bei einem Menschen idiomatisch und genauer als das allgemeinere „mein Körper“.
- source_word: וְעֹלַלְתִּי
  choice: und … gedrückt
  rationale: Die seltene und schwierige Verbform wird im Zusammenhang als Erniedrigen oder Niederdrücken verstanden. „In den Staub gedrückt“ gibt die konkrete Bewegung beziehungsweise den resultierenden Zustand wieder, ohne die umstrittene Nuance dogmatisch festzulegen.
- source_word: בֶעָפָר
  choice: in den Staub
  rationale: Das ב kann hier zusammen mit dem Verb einen resultativen beziehungsweise gerichteten Sinn tragen. „In den Staub“ ist im Deutschen bei „drücken“ natürlich und vermittelt die Erniedrigung.
- source_word: קַרְנִי
  choice: mein Horn
  rationale: Die wörtliche poetische Metapher bleibt erhalten; das Horn steht im Hebräischen für Kraft, Ehre oder erhöhtes Ansehen.
theological_decisions:
- issue: Metapher des Horns
  choice: Die Metapher „mein Horn“ bleibt im Haupttext erhalten.
  alternative: meine Kraft; meine Würde
  rationale: Das konkrete hebräische Bild trägt die poetische Aussage der Erniedrigung. Eine Auflösung im Haupttext würde den Bedeutungsumfang unnötig verengen.
- issue: Unsichere Bedeutung von וְעֹלַלְתִּי
  choice: Als konkrete Erniedrigung „in den Staub gedrückt“ wiedergegeben.
  alternative: in den Staub gesenkt; im Staub entweiht; in den Staub gestoßen
  rationale: Die genaue Nuance des schwierigen Verbs ist umstritten. Die gewählte Formulierung passt zum Trauerbild, während eine Fußnote die echte lexikalische Unsicherheit sichtbar hält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die körperlich-konkrete Trauersprache bleiben erhalten; die schwer verständliche Hornmetapher wird nicht geglättet, sondern knapp erläutert.
