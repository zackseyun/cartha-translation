  text: although there is no violence in my hands[b][a], and my prayer is pure.
translation:
  language: de
  text: Obwohl an meinen Händen keine Gewalttat klebt[a] und mein Gebet rein ist[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn an meinen Händen klebt keine Gewalttat.“ Die hebräische Präposition kann hier unterschiedlich verstanden werden; der Haupttext gibt sie aus dem Zusammenhang konzessiv wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „lauter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: obwohl
  rationale: 'Die Präposition wird im Zusammenhang als konzessiv verstanden: Hiob leidet, obwohl er seine Unschuld an Gewalttat beteuert. Die mögliche begründende Deutung wird in einer Fußnote bewahrt.'
- source_word: לֹא חָמָס בְּכַפָּי
  choice: an meinen Händen keine Gewalttat klebt
  rationale: Die Formulierung bewahrt das konkrete Bild der Hände und gibt die deutsche Redeweise für persönliche Schuld natürlich wieder. חָמָס bezeichnet Gewalttat, Unrecht oder Gewalt; „Gewalttat“ hält den unmittelbaren Sinn fest.
- source_word: וּתְפִלָּתִי
  choice: und mein Gebet
  rationale: תְּפִלָּה ist das übliche Wort für Gebet; der Ausdruck ist hier treffender und weniger eng als „Flehen“.
- source_word: זַכָּה
  choice: rein
  rationale: Das Adjektiv bezeichnet Reinheit beziehungsweise Lauterkeit. „Rein“ verbindet sich im Deutschen natürlich mit „Gebet“, ohne eine umfassende Sündlosigkeit zu behaupten.
theological_decisions:
- issue: Hiobs Aussage über seine eigene Unschuld
  choice: Als auf Gewalttat und die Lauterkeit seines Gebets bezogene Unschuldsbeteuerung wiedergeben.
  alternative: Als Behauptung völliger Sündlosigkeit oder lediglich kultischer Reinheit verstehen.
  rationale: Der unmittelbare Text spricht konkret von Gewalttat an Hiobs Händen und von seinem reinen Gebet. Die Übersetzung bewahrt diese begrenzte Aussage und die theologische Spannung, ohne sie auszuweiten oder abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wendung „an meinen Händen … klebt“ bewahrt das hebräische Körperbild und klingt zugleich idiomatisch; der Satz bleibt als Fortsetzung des Zusammenhangs gestaltet.
