  variant: modern standard German
source:
  edition: WLC
  text: הֲ/קֵ֥ץ לְ/דִבְרֵי ר֑וּחַ א֥וֹ מַה יַּ֝מְרִֽיצְ/ךָ֗ כִּ֣י תַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/003.yaml
  text: Is there no end to windy words? Or what provokes you[a], that you answer this way?
translation:
  language: de
  text: Nehmen die windigen Worte kein Ende? Oder was treibt dich dazu[a], so zu antworten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was macht dir Mut, zu antworten?“'
    reason: Das seltene Verb יַמְרִיצְךָ kann hier neben „antreiben“ auch im Sinn von „ermutigen“ oder „kühn machen“ verstanden werden.
lexical_decisions:
- source_word: הֲקֵץ
  choice: Nehmen … kein Ende?
  rationale: קֵץ bezeichnet ein Ende oder eine Grenze. Die rhetorische Frage drückt hier Verärgerung aus; die deutsche Wendung „kein Ende nehmen“ gibt diese Wirkung natürlich wieder.
- source_word: לְדִבְרֵי רוּחַ
  choice: die windigen Worte
  rationale: Wörtlich steht „Worte des Windes“. „Windige Worte“ bewahrt das Bild des Windes und bezeichnet zugleich gehaltloses Gerede, ohne die Metapher durch eine rein deutende Wiedergabe zu ersetzen.
- source_word: אוֹ
  choice: Oder
  rationale: Die einfache disjunktive Konjunktion leitet die zweite rhetorische Frage ein.
- source_word: מַה
  choice: was
  rationale: Das Fragepronomen fragt direkt nach dem Anlass oder Antrieb für die Antwort.
- source_word: יַמְרִיצְךָ
  choice: treibt dich dazu
  rationale: Die Hifil-Form von מרץ kann ein Antreiben, Anstacheln oder Ermutigen bezeichnen. „Treibt dich dazu“ ist im Deutschen natürlich und wahrt die mögliche Bandbreite besser als eine eindeutig emotionale Festlegung wie „reizt dich“.
- source_word: כִּי
  choice: dazu, … zu
  rationale: כִּי verbindet hier den Antrieb mit der folgenden Handlung. Die deutsche Infinitivkonstruktion gibt dieses Verhältnis idiomatisch wieder.
- source_word: תַעֲנֶה
  choice: so zu antworten
  rationale: ענה bedeutet „antworten“ oder „erwidern“. „So“ verdeutlicht knapp den vorwurfsvollen Bezug auf die Art der vorausgehenden Rede.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe und das Windbild des Hebräischen bleiben erhalten; die seltene Verbform wird wegen ihrer echten lexikalischen Mehrdeutigkeit in einer Fußnote alternativ wiedergegeben.
