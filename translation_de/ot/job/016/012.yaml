base_translation:
  language: en
  yaml_path: translation/ot/job/016/012.yaml
  text: I was at ease[a], but he shattered me; he seized me by my neck and dashed me to pieces; he set me up for himself as a target.
translation:
  language: de
  text: Ich lebte in Ruhe[a], doch er riss mich auseinander; er packte mich am Genick und zerschmetterte mich. Er stellte mich für sich als Zielscheibe auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „riss mich auseinander“ wiedergegebene Verb ist selten und kann auch „schüttelte mich heftig“, „zerschlug mich“ oder „ließ mich erbeben“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֵו
  choice: ungestört
  rationale: Das Adjektiv bezeichnet einen Zustand der Ruhe und Sicherheit. „Ungestört“ bildet den scharfen Gegensatz zum unmittelbar folgenden gewaltsamen Angriff natürlich ab.
- source_word: וַיְפַרְפְּרֵנִי
  choice: er riss mich auseinander
  rationale: Das seltene und unsichere Verb bezeichnet hier eine gewaltsame Zerstörung oder Erschütterung. Die Übersetzung wahrt die Heftigkeit; weitere mögliche Bedeutungen stehen in der Fußnote.
- source_word: וְאָחַז
  choice: er packte mich
  rationale: Das Verb bedeutet ergreifen oder festhalten; „packte“ vermittelt in diesem Zusammenhang die feindselige Gewalt.
- source_word: בְּעָרְפִּי
  choice: am Genick
  rationale: עֹרֶף bezeichnet den Nacken beziehungsweise das Genick. „Am Genick“ gibt das Bild eines gewaltsamen Zugriffs prägnant wieder.
- source_word: וַיְפַצְפְּצֵנִי
  choice: zerschmetterte mich
  rationale: Die intensive, seltene Verbform beschreibt gewaltsames Zerbrechen oder Zerschlagen. „Zerschmetterte“ bewahrt die drastische Bildsprache und unterscheidet sich vom vorangehenden unsicheren Verb.
- source_word: וַיְקִימֵנִי
  choice: er stellte mich auf
  rationale: 'Der Hifil von קום ist kausativ: Der Sprecher wird hingestellt beziehungsweise positioniert. Mit der folgenden Zielscheibenmetapher ist „stellte mich … auf“ idiomatisch.'
- source_word: לוֹ
  choice: für sich
  rationale: Das Pronomen bezeichnet die Zuordnung zum handelnden Subjekt; „für sich“ bringt dessen eigenen Zweck knapp zum Ausdruck.
- source_word: לְמַטָּרָה
  choice: als Zielscheibe
  rationale: Das Substantiv bezeichnet ein Ziel für einen Angriff. „Zielscheibe“ ist im Deutschen anschaulich und bewahrt die militärische Metapher.
theological_decisions:
- issue: Bezug des unausgesprochenen männlichen Subjekts in der dritten Person
  choice: Nur mit „er“ wiedergegeben, ohne den Handelnden ausdrücklich zu benennen.
  alternative: Gott ausdrücklich als den Angreifer nennen; alternativ einen unbestimmten Gegner annehmen.
  rationale: Im Zusammenhang von Hiobs Rede ist Gott der naheliegende Bezug, doch der hebräische Vers nennt ihn nicht ausdrücklich. Die Übersetzung bewahrt daher die rhetorische und theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftiger, konkreter Gewaltmetaphorik. Die seltenen Verben werden nicht künstlich vereinheitlicht; die Unsicherheit des ersten wird in einer Fußnote offengelegt.
