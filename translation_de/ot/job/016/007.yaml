  yaml_path: translation/ot/job/016/007.yaml
  text: Surely now he has worn me out[b][a]; you have devastated all my company.
translation:
  language: de
  text: Doch jetzt hat er mich erschöpft[a]; du hast meine ganze Gemeinschaft[b] verwüstet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat er mich ermüdet“ beziehungsweise „hat er mich völlig ausgelaugt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine ganze Versammlung“, „meine ganze Gemeinde“ oder „meinen ganzen Kreis“. Das hebräische Wort kann eine Versammlung oder einen zusammengehörigen Personenkreis bezeichnen; der genaue Bezug bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel markiert hier einen nachdrücklichen Übergang zu Hiobs gegenwärtigem Leiden. „Doch“ gibt die Wendung im Klagegang natürlich wieder, ohne die Partikel unnötig restriktiv zu verstehen.
- source_word: עַתָּה
  choice: jetzt
  rationale: Das Zeitadverb bezeichnet unmittelbar Hiobs gegenwärtige Lage.
- source_word: הֶלְאָנִי
  choice: hat er mich erschöpft
  rationale: Das Verb לאה bedeutet „ermüden, erschöpfen“. Die Form hat ein implizites Subjekt in der 3. Person Singular maskulin und ein Objekt in der 1. Person Singular; „er“ bleibt daher ohne ausdrückliche Identifizierung stehen.
- source_word: הֲשִׁמּוֹתָ
  choice: du hast … verwüstet
  rationale: Die kausative Form von שמם bezeichnet das Verödenlassen oder Verwüsten. Die 2. Person Singular wird beibehalten, sodass der auffällige Personenwechsel des Hebräischen erhalten bleibt.
- source_word: כָּל
  choice: ganze
  rationale: Im Deutschen verbindet sich der Totalitätsausdruck idiomatisch als „meine ganze Gemeinschaft“ mit dem folgenden Substantiv.
- source_word: עֲדָתִי
  choice: meine … Gemeinschaft
  rationale: עֵדָה kann eine Versammlung, Gemeinde oder zusammengehörige Gruppe bezeichnen. „Gemeinschaft“ ist im Kontext von Hiobs verlorenem Lebens- und Familienkreis verständlich und wahrt zugleich den kollektiven Sinn.
theological_decisions:
- issue: Wechsel der grammatischen Person zwischen den beiden Verben
  choice: „er hat mich erschöpft; du hast … verwüstet“
  alternative: 'Beide Verben auf Gott in der 2. Person beziehen: „du hast mich erschöpft; du hast … verwüstet“; oder beide in die 3. Person setzen.'
  rationale: Der masoretische Text wechselt tatsächlich von der 3. Person Singular zur 2. Person Singular. Die Übersetzung glättet diesen Wechsel nicht und lässt offen, ob Hiob vom Reden über Gott unmittelbar zur Anrede Gottes übergeht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und klagend. Der unvermittelte Wechsel von „er“ zu „du“ wird bewusst erhalten; „er“ wird nicht ausdrücklich als Gott identifiziert.
