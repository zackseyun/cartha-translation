source:
  edition: WLC
  text: יָ֘סֹ֤בּוּ עָלַ֨/י רַבָּ֗י/ו יְפַלַּ֣ח כִּ֭לְיוֹתַ/י וְ/לֹ֣א יַחְמ֑וֹל יִשְׁפֹּ֥ךְ לָ֝/אָ֗רֶץ מְרֵרָֽתִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/013.yaml
  text: His archers surround me[a]; he splits open my kidneys and does not spare[c][b]; he pours out my gall on the ground.
translation:
  language: de
  text: Seine Bogenschützen umringen mich[a]; er spaltet meine Nieren[b] und verschont mich nicht; meine Galle[c] schüttet er auf die Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »seine Mächtigen« oder »seine Anführer«. Die hebräische Form ist schwierig; »seine Bogenschützen« passt zur Angriffsszene dieses Verses und des weiteren Zusammenhangs.
    reason: alternative_reading
  - marker: b
    text: Wörtlich »meine Nieren«; im Hebräischen können die Nieren als innere Organe zugleich für das Innerste des Menschen stehen.
    reason: cultural_note
  - marker: c
    text: Oder »meine Gallenflüssigkeit«; manche verstehen das Wort bildlich als »meine Bitterkeit«. Der körperliche Sinn entspricht jedoch der gewaltsamen Bildsprache des Verses.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסֹבּוּ
  choice: umringen
  rationale: Das Qal-Imperfekt von סבב bezeichnet hier ein feindliches Umgeben. »Umringen« ist natürliches modernes Deutsch und bewahrt das Angriffsbild.
- source_word: רַבָּיו
  choice: seine Bogenschützen
  rationale: Die hebräische Form ist schwierig. Im Zusammenhang der gewaltsamen Angriffs- und Verwundungsbilder ist die traditionelle Deutung als Schützen am stimmigsten; »Bogenschützen« vermeidet im Deutschen die mögliche Bedeutung von »Schützen« als Beschützer.
- source_word: יְפַלַּח
  choice: spaltet
  rationale: Das Piel von פלח beschreibt ein gewaltsames Aufspalten oder Durchbohren. »Spaltet« erhält die drastische Körperlichkeit des Bildes.
- source_word: כִּלְיוֹתַי
  choice: meine Nieren
  rationale: Das Wort bezeichnet wörtlich die Nieren und kann im hebräischen Denken zugleich auf das Innerste des Menschen weisen. Der konkrete Körperbegriff bleibt im Haupttext erhalten.
- source_word: וְלֹא יַחְמוֹל
  choice: und verschont mich nicht
  rationale: חמל bedeutet in diesem Gewaltzusammenhang, jemanden zu schonen oder Erbarmen mit ihm zu haben. Die gewählte Formulierung ist knapp und idiomatisch.
- source_word: יִשְׁפֹּךְ
  choice: schüttet er
  rationale: Das Qal von שפך bedeutet »ausgießen, ausschütten«. Die deutsche Wortstellung hebt die Galle als weiteres drastisches Körperbild hervor.
- source_word: מְרֵרָתִי
  choice: meine Galle
  rationale: Das Substantiv kann konkret Galle beziehungsweise Gallenflüssigkeit bezeichnen und hängt zugleich mit Bitterkeit zusammen. Das körperliche Verständnis passt am besten zur gewaltsamen Bildsprache des Verses.
theological_decisions:
- issue: Anthropologische Bildsprache in Hiobs poetischer Leidensklage
  choice: Die konkreten Körperbegriffe »Nieren« und »Galle« bleiben im Haupttext erhalten.
  alternative: Abstraktere Wiedergaben wie »mein Innerstes« und »meine Bitterkeit«.
  rationale: Der Vers schildert Hiobs Leiden in drastischen anatomischen Bildern. Die konkrete Wiedergabe wahrt die Kraft und Spannung der hebräischen Poesie, ohne sie zu vergeistigen oder abzuschwächen.
- issue: Wechsel von pluralischem zu singularischem Handlungsträger
  choice: Das pluralische »seine Bogenschützen« wird im ersten Satzteil beibehalten; die folgenden singularischen Verben werden mit »er« wiedergegeben.
  alternative: Alle Handlungen den Bogenschützen zuschreiben oder den Subjektwechsel glätten.
  rationale: Der hebräische Text wechselt von einem Plural zu singularischen Verbformen. Die Übersetzung bewahrt diesen grammatischen Wechsel und lässt offen, wie genau Gottes Handeln und das seiner Angriffskräfte poetisch zueinander stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst drastischer poetischer Körperbildsprache. Der Satzrhythmus folgt den drei Angriffsbildern des Hebräischen; die Voranstellung von »meine Galle« im letzten Glied wirkt im Deutschen gehoben, bleibt aber gut verständlich.
