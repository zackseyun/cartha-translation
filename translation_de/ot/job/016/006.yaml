  text: If I speak[a], my pain is not eased; and if I refrain, what goes away from me?
translation:
  language: de
  text: Wenn ich rede, lässt mein Schmerz nicht nach; und wenn ich schweige, was weicht dann von mir?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was geht von mir fort?“ Das Hebräische ist knapp und kann andeuten: „Was von meinem Schmerz verlässt mich?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֲדַבְּרָה
  choice: Wenn ich rede
  rationale: Die Bedingung wird im Deutschen natürlich mit „wenn“ und Präsens wiedergegeben; die kohortativische Form verlangt hier keine zusätzliche Modalität.
- source_word: לֹא יֵחָשֵׂךְ כְּאֵבִי
  choice: lässt mein Schmerz nicht nach
  rationale: Das Nifal von חשׂך bezeichnet ein Zurückgehalten- oder Gemindertwerden. Bei „Schmerz“ gibt „nicht nachlassen“ den kontextuellen Sinn natürlich wieder, ohne die Aussage zu verengen.
- source_word: וְאַחְדְּלָה
  choice: und wenn ich schweige
  rationale: חדל bedeutet „aufhören, ablassen“. Im Gegensatz zu „reden“ ist das gemeinte Ablassen das Schweigen; diese knappe deutsche Wiedergabe macht den Parallelismus verständlich.
- source_word: מַה מִנִּי יַהֲלֹךְ
  choice: was weicht dann von mir?
  rationale: הלך mit מן kann „von jemandem weggehen/weichen“ bedeuten. Die knappe Frage bewahrt die Ellipse des Hebräischen, statt „Schmerz“ ausdrücklich zu ergänzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Gegensatz zwischen Reden und Schweigen bleibt klar; die Ellipse der Schlussfrage und damit ihre genuine Mehrdeutigkeit werden bewahrt.
