source:
  edition: WLC
  text: יַסְגִּירֵ֣/נִי אֵ֭ל אֶ֣ל עֲוִ֑יל וְ/עַל יְדֵ֖י רְשָׁעִ֣ים יִרְטֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/011.yaml
  text: God hands me over to the ungodly and throws me into the hands of the wicked[a][b].
translation:
  language: de
  text: Gott liefert mich dem Gottlosen aus und schleudert mich in die Hände der Frevler.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das letzte hebräische Verb ist selten und in seiner Bedeutung unsicher; möglicherweise: »und stößt mich in die Gewalt der Frevler« oder »und überlässt mich der Gewalt der Frevler«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּירֵנִי
  choice: liefert mich … aus
  rationale: Das Hifil von סגר bezeichnet hier die Übergabe in die Gewalt eines anderen; „ausliefern“ gibt diesen feindlichen Vorgang im Deutschen natürlich wieder.
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet im Kontext Hiobs Gott selbst und nicht allgemein einen Mächtigen.
- source_word: עֲוִיל
  choice: dem Gottlosen
  rationale: Das Substantiv bezeichnet einen moralisch verkehrten beziehungsweise ruchlosen Menschen; der Singular des Ausgangstextes bleibt erhalten.
- source_word: וְעַל יְדֵי
  choice: in die Hände
  rationale: Die Wendung bezeichnet hier die Übergabe in die Gewalt anderer und wird durch die entsprechende deutsche Metapher idiomatisch wiedergegeben.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Der Plural bezeichnet Menschen, die durch Bosheit und Schuld gekennzeichnet sind; „Frevler“ wahrt den moralisch-religiösen Ton und unterscheidet ihn lexikalisch von עֲוִיל.
- source_word: יִרְטֵנִי
  choice: schleudert mich
  rationale: Das seltene und schwierige Verb wird traditionell als gewaltsames Werfen oder Schleudern verstanden. Die Übersetzung bewahrt diese wahrscheinliche Stoßrichtung, ohne die Unsicherheit zu verschweigen.
theological_decisions:
- issue: Bezug von אֵל
  choice: Gott selbst liefert Hiob aus.
  alternative: Ein nicht näher bestimmter „Mächtiger“ liefert ihn aus.
  rationale: Im Kontext des Hiobbuches verweist אֵל regelmäßig auf Gott; gerade darin liegt die Spannung von Hiobs Klage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ausliefern“ und „in die Hände“ bilden die feindliche Übergabe in fremde Gewalt natürlich ab. Die markante Rede von Gottes Handeln und die Unsicherheit des Schlussverbs bleiben erhalten.
