base_translation:
  language: en
  yaml_path: translation/ot/job/016/009.yaml
  text: His anger has torn me and hated me[a]; he gnashes his teeth at me; my adversary sharpens his eyes against me.
translation:
  language: de
  text: Sein Zorn hat mich zerfleischt und mich gehasst; er knirscht mit seinen Zähnen gegen mich. Mein Gegner schärft seine Augen gegen mich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung lautet wörtlich: „schärft seine Augen gegen mich“; gemeint ist ein scharfer, feindselig auf mich gerichteter Blick.'
    reason: Die ungewöhnliche hebräische Metapher wird im Haupttext bewahrt und in der Fußnote erläutert.
lexical_decisions:
- source_word: אַפּוֹ
  choice: Sein Zorn
  rationale: אַף bezeichnet wörtlich die Nase, idiomatisch jedoch Zorn. „Sein Zorn“ ist im Deutschen klar, natürlich und bewahrt die Heftigkeit des Bildes.
- source_word: טָרַף
  choice: hat mich zerfleischt
  rationale: Das Verb bezeichnet das Zerreißen von Beute durch ein Raubtier. „Zerfleischt“ bewahrt dieses gewaltsame Bild; das im Hebräischen nicht ausdrücklich gesetzte Objekt ergibt sich aus dem folgenden „mich“.
- source_word: וַיִּשְׂטְמֵנִי
  choice: und er hasst mich
  rationale: שׂטם drückt Hass oder feindselige Gesinnung aus. „Hasst mich“ gibt dies direkt wieder, ohne eine zusätzliche äußere Handlung einzutragen.
- source_word: חָרַק עָלַי בְּשִׁנָּיו
  choice: er knirscht mit den Zähnen gegen mich
  rationale: חָרַק bezeichnet das zornige Knirschen mit den Zähnen. „Gegen mich“ erhält die feindselige Ausrichtung von עָלַי.
- source_word: צָרִי
  choice: Mein Gegner
  rationale: צַר bezeichnet einen feindlich Gegenüberstehenden. „Gegner“ ist würdig und verständlich und legt nicht fest, ob Gott oder ein menschlicher Feind gemeint ist.
- source_word: יִלְטוֹשׁ עֵינָיו לִי
  choice: schärft seine Augen gegen mich
  rationale: לָטַשׁ bedeutet „schärfen“ oder „wetzen“. Die bewusst ungewöhnliche Formulierung bewahrt das hebräische Bild eines scharf und feindselig fixierten Blicks; die Fußnote erläutert es.
theological_decisions:
- issue: Bezug der feindseligen männlichen Einzahlformen
  choice: Die männlichen Einzahlformen bleiben ohne ausdrückliche Identifizierung ihres Bezugs erhalten.
  alternative: Den Handelnden ausdrücklich als Gott oder als menschlichen Feind bezeichnen.
  rationale: Der Vers nennt den Bezug nicht erneut ausdrücklich. Die offene Formulierung bewahrt die Spannung, ob Hiob Gott als Gegner beschreibt, einen menschlichen Feind meint oder beides poetisch ineinanderblendet.
- issue: Personifikation des Zorns und Wechsel zum persönlichen Subjekt
  choice: „Sein Zorn“ bleibt im ersten Satz Subjekt; anschließend steht schlicht „er“.
  alternative: „In seinem Zorn zerfleischt er mich“ und damit ein einheitliches persönliches Subjekt formulieren.
  rationale: Die gewählte Fassung hält sich enger an die hebräische Bild- und Satzstruktur und vermeidet es, den poetischen Subjektwechsel stillschweigend zu glätten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst kräftiger poetischer Bildlichkeit. Das ungewöhnliche „schärft seine Augen“ bleibt als hebräische Metapher stehen; die theologische Identität des Gegners wird nicht festgelegt.
