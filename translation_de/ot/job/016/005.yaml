  yaml_path: translation/ot/job/016/005.yaml
  text: I could strengthen you with my mouth[b][a], and the moving of my lips could hold back grief.
translation:
  language: de
  text: Ich würde euch mit meinem Mund stärken, und der Trost meiner Lippen würde euren Schmerz lindern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und ebenfalls möglich: „und die Bewegung meiner Lippen würde zurückhalten“. Das Hebräische nennt nicht ausdrücklich, was zurückgehalten oder gelindert wird; „euren Schmerz“ ist aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲאַמִּצְכֶם
  choice: Ich könnte euch stärken
  rationale: Das Piel von אמץ mit Objekt der 2. Person Plural bedeutet „stärken“. Der Modalgebrauch gibt die hypothetische Rollenumkehr aus Vers 4 natürlich wieder.
- source_word: בְּמוֹ פִי
  choice: mit meinem Mund
  rationale: Die instrumentale Wendung bleibt nah am konkreten hebräischen Bild und ist im Deutschen verständlich.
- source_word: נִיד שְׂפָתַי
  choice: der Trost meiner Lippen
  rationale: נִיד kann eine Bewegung beziehungsweise Gebärde des Mitgefühls und daraus folgend Trost oder Beileid bezeichnen. Zusammen mit „meiner Lippen“ ist hier tröstender Zuspruch gemeint; die konkrete Bildsprache der Lippen bleibt erhalten.
- source_word: יַחְשֹׂךְ
  choice: könnte euren Schmerz lindern
  rationale: חשׂך bedeutet grundsätzlich „zurückhalten, vermindern, ersparen“. Da das Objekt im Hebräischen fehlt, wird „euren Schmerz“ aus dem Zusammenhang ergänzt, um im Deutschen einen vollständigen und natürlichen Satz zu bilden.
