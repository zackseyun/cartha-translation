  text: מְלִיצַ֥/י רֵעָ֑/י אֶל אֱ֝ל֗וֹהַ דָּלְפָ֥ה עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/020.yaml
  text: My friends are my mockers[a]; my eye pours out tears to God.
translation:
  language: de
  text: Meine Freunde sind meine Spötter[a]; zu Gott hin vergießt mein Auge Tränen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Meine Freunde sind meine Fürsprecher/Vermittler.« Das hebräische Wort מְלִיצַי wird teils positiv verstanden; im Zusammenhang von Hiobs Klage liegt jedoch »Spötter« näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלִיצַי
  choice: meine Spötter
  rationale: Das Wort kann im Zusammenhang einen spöttischen oder höhnenden Sprecher bezeichnen. Angesichts von Hiobs Klage über seine Freunde passt die negative Bedeutung am besten; die mögliche positive Deutung bleibt in der Fußnote erhalten.
- source_word: רֵעָי
  choice: meine Freunde
  rationale: רֵעַ bezeichnet einen Freund oder Gefährten. „Freunde“ klingt natürlich und bewahrt die bittere Spannung, dass gerade seine Freunde zu Spöttern geworden sind.
- source_word: אֶל אֱלוֹהַ
  choice: zu Gott hin
  rationale: אֶל bezeichnet die Richtung auf Gott zu. „Zu Gott hin“ erhält dieses gerichtete Bild deutlicher als das bloße „vor Gott“.
- source_word: דָּלְפָה
  choice: vergießt … Tränen
  rationale: Das Verb bezeichnet wörtlich ein Tropfen oder Rinnen. In Verbindung mit dem Auge gibt „Tränen vergießen“ den anhaltenden Tränenfluss in natürlichem Deutsch wieder.
- source_word: עֵינִי
  choice: mein Auge
  rationale: Der hebräische Text steht im Singular. Der Singular wird als markantes poetisches Bild bewahrt.
theological_decisions:
- issue: Bedeutung von מְלִיצַי
  choice: Spötter
  alternative: Fürsprecher/Vermittler
  rationale: Der unmittelbare Klagekontext unterstützt die adversative Deutung, doch die lexikalisch und auslegungsgeschichtlich vertretene positive Deutung wird nicht ausgeschlossen, sondern in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. Der ungewöhnliche Singular „mein Auge“ und die Richtungsangabe „zu Gott hin“ folgen bewusst dem Hebräischen.
