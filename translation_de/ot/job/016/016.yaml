source:
  edition: WLC
  text: פָּנַ֣/י חמרמרה מִנִּי בֶ֑כִי וְ/עַ֖ל עַפְעַפַּ֣/י צַלְמָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/016.yaml
  text: My face is red from weeping[a], and on my eyelids is deep darkness.
translation:
  language: de
  text: Mein Gesicht ist gerötet vom Weinen, und auf meinen Lidern liegt tiefe Dunkelheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: »Todesschatten«. Das hebräische Wort kann sehr tiefe Dunkelheit bezeichnen und wird auch mit einem Bezug zum Tod verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנַי
  choice: mein Gesicht
  rationale: Die hebräische Pluralform mit Suffix wird idiomatisch kollektiv gebraucht; im Deutschen ist der Singular »mein Gesicht« natürlich und treffend.
- source_word: חמרמרה
  choice: ist gerötet
  rationale: Das seltene Verb bezeichnet eine sichtbare Veränderung des Gesichts infolge heftiger Erregung oder körperlicher Not. Im Zusammenhang mit dem Weinen gibt »gerötet« die wahrscheinliche Wirkung wieder, ohne die genaue körperliche Erscheinung zu stark festzulegen.
- source_word: מִנִּי
  choice: vom
  rationale: 'Die Präposition bezeichnet hier Ursache oder Ausgangspunkt: Die Rötung rührt vom Weinen her.'
- source_word: בֶכִי
  choice: Weinen
  rationale: Das Substantiv bezeichnet Weinen oder Klagen. »Weinen« ist verständlich, würdevoll und bewahrt den poetischen Ton.
- source_word: וְעַל
  choice: und auf
  rationale: Konjunktion und Präposition leiten die parallele zweite Vershälfte direkt ein.
- source_word: עַפְעַפַּי
  choice: meinen Lidern
  rationale: Das hebräische Wort bezeichnet ausdrücklich die Augenlider, nicht allgemein die Augen.
- source_word: צַלְמָוֶת
  choice: tiefste Dunkelheit
  rationale: Der poetische Ausdruck kann tiefes Dunkel beziehungsweise Todesdunkel bezeichnen. »Tiefste Dunkelheit« wahrt die Bildkraft und passt zur sichtbaren, leidvollen Verdüsterung der Augenpartie, ohne den möglichen Todesbezug auszuschließen.
theological_decisions:
- issue: Bedeutungsumfang von צַלְמָוֶת
  choice: tiefste Dunkelheit
  alternative: Todesschatten
  rationale: Der Kontext beschreibt Hiobs vom Weinen gezeichnetes Gesicht. Daher ist die Bedeutung »tiefe Dunkelheit« im Haupttext naheliegend; die traditionelle, möglicherweise mitschwingende Deutung als »Todesschatten« wird in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige deutsche Poesiesprache. »Gerötet« ist idiomatischer als »rot« und lässt die durch anhaltendes Weinen verursachte Veränderung erkennen. Die Formulierung »liegt tiefste Dunkelheit« macht das statische Bild der zweiten Vershälfte im Deutschen natürlich, ohne ein zusätzliches starkes Deutungselement einzuführen.
