base_translation:
  language: en
  yaml_path: translation/ot/job/016/008.yaml
  text: You have shriveled me up—it has become a witness; my gauntness rises up against me and answers to my face.
translation:
  language: de
  text: Du hast mich zusammenschrumpfen lassen, und es ist zu einem Zeugen geworden; meine Auszehrung erhebt sich gegen mich und antwortet mir ins Gesicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקְמְטֵנִי
  choice: Du hast mich zusammenschrumpfen lassen
  rationale: Das Verb קמט bezeichnet ein Einschrumpfen oder Runzligwerden. Die Formulierung gibt Hiobs körperlichen Verfall natürlich und anschaulich wieder, ohne die Ursache näher festzulegen.
- source_word: כַחֲשִׁי
  choice: meine Auszehrung
  rationale: Im Zusammenhang bezeichnet כחש den abgemagerten, ausgezehrten Zustand Hiobs. „Auszehrung“ bewahrt das Bild seines sichtbar geschwächten Körpers.
- source_word: יַעֲנֶה
  choice: sagt mir ins Gesicht aus
  rationale: ענה bedeutet grundsätzlich „antworten“, kann in einem gerichtlichen Zusammenhang aber auch das Aussagen oder Zeugnisgeben bezeichnen. Da im Vers ausdrücklich ein Zeuge genannt wird, bringt „aussagen“ den forensischen Bildzusammenhang zur Geltung; „ins Gesicht“ bewahrt die direkte, anklagende Wirkung von בְּפָנַי.
theological_decisions:
- issue: Der körperliche Verfall als anklagender Zeuge
  choice: Die Auszehrung tritt gegen Hiob auf und sagt gegen ihn aus.
  alternative: Die Auszehrung erhebt sich in Hiob und antwortet ihm ins Gesicht.
  rationale: Die Präposition בִּי kann räumlich („in mir“) oder feindlich („gegen mich“) verstanden werden. Der Zusammenhang mit „Zeuge“ und dem Auftreten vor Hiobs Gesicht stützt die gerichtliche, gegen ihn gerichtete Lesart, ohne zu erklären, worin die vermeintliche Anklage besteht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das drastische Körperbild und die gerichtliche Metaphorik bleiben erhalten; der Gedankenstrich markiert den knappen Übergang vom göttlichen Handeln zu dessen sichtbarer Zeugnisfunktion.
