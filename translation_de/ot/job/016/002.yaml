base_translation:
  language: en
  yaml_path: translation/ot/job/016/002.yaml
  text: I have heard many such things[a]; all of you are miserable comforters.
translation:
  language: de
  text: Vieles dieser Art habe ich gehört. Ihr alle seid leidige Tröster.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Tröster des Elends“; oder: „mühsame Tröster“.'
