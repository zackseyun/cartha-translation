lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: habe ich … gehört
  rationale: Das Qal-Perfekt in der 1. Person Singular bezeichnet zurückliegendes Hören mit Bedeutung für Hiobs gegenwärtige Klage; das deutsche Perfekt ist hier natürlich.
- source_word: כְאֵלֶּה רַבּוֹת
  choice: Solche Reden … schon oft
  rationale: Wörtlich steht etwa „viele solche Dinge“. Im Zusammenhang sind die Äußerungen der Freunde gemeint; „solche Reden“ gibt den Bezug idiomatisch wieder, und „schon oft“ bewahrt den Gedanken der Vielzahl und Wiederholung.
- source_word: מְנַחֲמֵי
  choice: Tröster
  rationale: Das substantivierte Partizip von נחם bezeichnet Tröstende bzw. Tröster und erhält die im Kontext scharfe Ironie.
- source_word: עָמָל
  choice: leidige
  rationale: עמל kann Mühsal, Elend, Beschwerde oder Leid bezeichnen. Im Konstruktgefüge charakterisiert es die Tröster beziehungsweise ihren Trost als belastend und unerfreulich; „leidige Tröster“ ist knapp, natürlich und lässt die genaue Beziehung offen.
- source_word: כֻּלְּכֶם
  choice: ihr alle
  rationale: Die ausdrücklich pluralische, umfassende Anrede richtet Hiobs Vorwurf an die gesamte Gruppe seiner Freunde.
