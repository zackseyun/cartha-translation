  yaml_path: translation/ot/job/016/018.yaml
  text: O earth[a], do not cover my blood[c][b], and let there be no resting place for my cry.
translation:
  language: de
  text: Erde, bedecke mein Blut[a][c] nicht, und mein Schrei[b] finde keinen Ort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein vergossenes Blut“. Wörtlich steht im Hebräischen „mein Blut“; im Zusammenhang kann damit unschuldig vergossenes Blut gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mein Klageruf“. Das Wort kann einen Notschrei bezeichnen, der zugleich ein Ruf nach Hilfe und Gerechtigkeit ist.'
    reason: lexical_alternative
  - marker: c
    text: Das Bild erinnert an Blut, das aus der Erde nach Gerechtigkeit ruft; vergleiche 1. Mose 4,10.
    reason: cross_reference
lexical_decisions:
- source_word: אֶרֶץ
  choice: Erde
  rationale: Die direkte Anrede ergibt sich aus dem folgenden Verb in der 2. Person feminin Singular. „Erde“ wahrt den weiten, poetischen Horizont besser als „Land“; ein zusätzliches „O“ ist im modernen Deutschen nicht nötig.
- source_word: אַל תְּכַסִּי
  choice: bedecke ... nicht
  rationale: אַל mit der Verbform drückt hier ein dringendes Verbot oder einen verneinten Wunsch aus. „Bedecken“ bewahrt das konkrete Bild und lässt die Bedeutung des Verbergens vor der Gerechtigkeit mitschwingen.
- source_word: דָמִי
  choice: mein Blut
  rationale: Wörtlich steht „mein Blut“. Im Zusammenhang kann damit das unschuldig vergossene Blut gemeint sein; die konkrete und mehrdeutige Formulierung bleibt im Haupttext erhalten.
- source_word: וְאַל יְהִי מָקוֹם
  choice: und ... soll keine Ruhestätte finden
  rationale: Die hebräische Existenzkonstruktion lautet wörtlich „und es sei kein Ort“. Die deutsche Formulierung gibt im Zusammenhang natürlich wieder, dass der Schrei nirgends zur Ruhe kommen oder verstummen soll, ohne den Bildgehalt aufzugeben.
- source_word: לְזַעֲקָתִי
  choice: mein Schrei
  rationale: זְעָקָה bezeichnet einen Not- oder Hilfeschrei, der zugleich als Ruf nach Recht verstanden werden kann. „Schrei“ ist knapp und wahrt diese Offenheit.
theological_decisions:
- issue: Anspielung auf unschuldig vergossenes Blut, das nach Gerechtigkeit ruft
  choice: Die konkreten Bilder „mein Blut“ und „mein Schrei“ bleiben im Haupttext bestehen.
  alternative: „mein vergossenes Blut“ und „mein Klageruf“ würden den forensischen Sinn stärker hervorheben.
  rationale: Der Vers dürfte das Motiv des aus der Erde nach Gerechtigkeit rufenden Blutes aufnehmen, legt die genaue Beziehung zwischen Blut, Klage und Rechtfertigung aber nicht ausdrücklich fest. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischer Direktheit. Die Anrede „Erde“ bleibt ohne archaisierendes „O“. „Ruhestätte finden“ gibt die kontextuelle Bedeutung von מָקוֹם idiomatisch wieder und bewahrt zugleich das Bild eines Schreis, der nicht zur Ruhe kommen darf.
