translation:
  language: de
  text: Er möge einem Mann bei Gott Recht verschaffen[a], wie ein Mensch seinem Nächsten Recht verschafft.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für einen Mann bei Gott eintreten“ beziehungsweise „den Rechtsstreit eines Mannes mit Gott entscheiden“. Das hebräische Verb kann in rechtlichem Zusammenhang das Entscheiden, Schlichten oder Führen eines Rechtsstreits bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich „ein Sohn des Menschen“; hier eine gewöhnliche Bezeichnung für einen Menschen, nicht notwendigerweise ein messianischer Titel. Oder für „seinem Nächsten“: „seinem Freund“ beziehungsweise „seinem Gefährten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹכַח
  choice: Er möge … Recht schaffen
  rationale: Die Hifil-Form von יכח hat hier einen rechtlichen Sinn und kann das Entscheiden, Schlichten oder Vertreten in einem Streit bezeichnen. „Recht schaffen“ bewahrt diese juristische Weite, ohne die Rolle auf eine neutrale Schlichtung festzulegen.
- source_word: לְגֶבֶר
  choice: für einen Mann
  rationale: גֶּבֶר bezeichnet hier den männlichen Menschen als Streitpartei. Die Präposition לְ wird entsprechend dem Parallelismus als Angabe der begünstigten Person wiedergegeben.
- source_word: עִם אֱלוֹהַּ
  choice: Gott gegenüber
  rationale: עִם bedeutet grundsätzlich „mit“; im Zusammenhang eines Rechtsstreits bezeichnet es die andere beteiligte Partei. „Gott gegenüber“ klingt im Deutschen natürlich und lässt offen, ob an Vertretung, Auseinandersetzung oder Schlichtung gedacht ist.
- source_word: וּבֶן אָדָם
  choice: wie ein Menschensohn
  rationale: בֶּן־אָדָם bedeutet wörtlich „Menschensohn“ und idiomatisch „Mensch“. Das vergleichende „wie“ gibt den verkürzten poetischen Parallelismus wieder; die wörtliche Wendung bleibt erhalten und wird in der Fußnote erläutert.
- source_word: לְרֵעֵהוּ
  choice: für seinen Nächsten
  rationale: רֵעַ kann einen Nächsten, Mitmenschen, Gefährten oder Freund bezeichnen. „Nächster“ ist weit genug und erhält zugleich das benefaktive לְ parallel zu לְגֶבֶר.
theological_decisions:
- issue: Mögliche messianische Überdeutung von בֶּן־אָדָם
  choice: Die Wendung wird wörtlich als „Menschensohn“ wiedergegeben, aber ausdrücklich als gewöhnliche Bezeichnung für einen Menschen erläutert.
  alternative: Dynamisch „ein Mensch“ übersetzen oder die Wendung als christologischen Titel „der Menschensohn“ auffassen.
  rationale: Im unmittelbaren poetischen Parallelismus entspricht בֶּן־אָדָם dem zuvor genannten גֶּבֶר und bezeichnet einen Menschen. Ein bestimmter Artikel, eine Großschreibung als Titel oder eine ausdrückliche messianische Deutung wäre vom hebräischen Text nicht gefordert.
- issue: Rolle des ersehnten Rechtsbeistands
  choice: Die Formulierung „für einen Mann … Recht schaffen“ bewahrt die zugunsten des Menschen ausgerichtete Aussage.
  alternative: „Zwischen einem Mann und Gott schlichten“, was eine strikt neutrale Mittlerrolle nahelegen würde.
  rationale: Das לְ vor גֶּבֶר lässt sich benefaktiv verstehen und steht parallel zum לְ vor רֵעֵהוּ. Daher sollte die Übersetzung nicht stillschweigend eine unparteiische Vermittlung zum alleinigen Sinn machen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst beibehaltener poetischer Verdichtung. „Menschensohn“ ist weniger alltäglich, erhält jedoch die hebräische Bildform; die Fußnote verhindert eine unbegründete Titellesung.
