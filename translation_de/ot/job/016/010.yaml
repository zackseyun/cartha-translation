  text: They have opened their mouths wide against me[a]; with reproach they have struck my cheek; together they gather themselves against me.
translation:
  language: de
  text: Sie reißen ihre Münder weit gegen mich auf; höhnisch schlagen sie mir auf die Wange; gemeinsam sammeln sie sich gegen mich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gemeinsam schließen sie sich gegen mich zusammen“; möglicherweise auch: „gemeinsam sind sie gegen mich erfüllt“. Das letzte Verb ist idiomatisch und seine genaue Bedeutung unsicher; der Kontext legt ein gemeinsames Vorgehen gegen Hiob nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּעֲרוּ עָלַי בְּפִיהֶם
  choice: Sie reißen gegen mich den Mund weit auf
  rationale: פער bezeichnet das weite Öffnen des Mundes und trägt hier eine feindselige, höhnische Färbung. Die deutsche Wendung bewahrt das anschauliche Bild; עָלַי wird im Angriffskontext mit „gegen mich“ wiedergegeben.
- source_word: בְּחֶרְפָּה
  choice: voller Hohn
  rationale: חֶרְפָּה umfasst Schmach, Beschimpfung und Verhöhnung. „Voller Hohn“ klingt im modernen Deutsch natürlich und bringt die demütigende Feindseligkeit zum Ausdruck.
- source_word: הִכּוּ לְחָיָי
  choice: schlagen sie mich auf die Wange
  rationale: נכה bedeutet „schlagen“, und לְחִי bezeichnet Wange oder Kiefer. Die Wiedergabe bezeichnet einen konkreten, entehrenden Schlag, ohne das Bild zu verallgemeinern.
- source_word: יַחַד
  choice: geschlossen
  rationale: יַחַד kennzeichnet gemeinsames, einträchtiges Handeln. „Geschlossen“ betont hier, dass die Gegner als vereinte feindliche Gruppe handeln.
- source_word: עָלַי יִתְמַלָּאוּן
  choice: rotten sie sich gegen mich zusammen
  rationale: Die Hitpael-Form von מלא ist an dieser Stelle idiomatisch schwierig. Im Kontext bezeichnet sie wahrscheinlich das gemeinsame Ansammeln oder Aufbieten feindlicher Kräfte; „sich zusammenrotten“ bewahrt diesen Sinn in natürlichem Deutsch.
