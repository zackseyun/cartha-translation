  variant: modern standard German
source:
  edition: WLC
  text: גַּ֤ם אָנֹכִי֮ כָּ/כֶ֪ם אֲדַ֫בֵּ֥רָה ל֤וּ יֵ֪שׁ נַפְשְׁ/כֶ֡ם תַּ֤חַת נַפְשִׁ֗/י אַחְבִּ֣ירָה עֲלֵי/כֶ֣ם בְּ/מִלִּ֑ים וְ/אָנִ֥יעָה עֲ֝לֵי/כֶ֗ם בְּמ֣וֹ רֹאשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/004.yaml
  text: I too could speak like you[a], if your soul were in place of my soul[c][b]; I could heap up words against you and shake my head at you.
translation:
  language: de
  text: Auch ich könnte reden wie ihr, wenn ihr an meiner Stelle wärt. Ich könnte Worte gegen euch aneinanderreihen[a] und über euch den Kopf schütteln.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb kann das Verbinden, Zusammenfügen oder Aneinanderreihen von Worten bezeichnen; sinngemäß auch: »Worte gegen euch auftürmen«.'
    reason: lexical_alternative
  - marker: b
    text: Das Kopfschütteln ist hier eine Geste des Spotts oder der Verachtung.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: Auch ich
  rationale: Bewahrt die betonte Selbstbezeichnung und die rhetorische Gegenüberstellung zu den Freunden.
- source_word: כָכֶם אֲדַבֵּרָה
  choice: könnte reden wie ihr
  rationale: Der hypothetische Zusammenhang wird im Deutschen natürlich durch den Konjunktiv wiedergegeben; „wie ihr“ bezieht sich auf die Art ihres Redens.
- source_word: לוּ יֵשׁ נַפְשְׁכֶם תַּחַת נַפְשִׁי
  choice: wenn ihr an meiner Stelle wärt
  rationale: נֶפֶשׁ bezeichnet hier die Person beziehungsweise das Selbst. Die idiomatische Wendung gibt den gedachten Rollentausch klar wieder und bewahrt die Aussage, ohne eine spezifische Seelenanthropologie einzutragen.
- source_word: אַחְבִּירָה עֲלֵיכֶם בְּמִלִּים
  choice: Ich könnte Worte gegen euch aneinanderreihen
  rationale: „Aneinanderreihen“ wahrt den Grundsinn des Verbindens oder Zusammenfügens; „gegen euch“ bringt die kontextuell feindselige Ausrichtung der Worte zum Ausdruck.
- source_word: וְאָנִיעָה עֲלֵיכֶם בְּמוֹ רֹאשִׁי
  choice: und über euch den Kopf schütteln
  rationale: Gibt die körperliche Geste in natürlichem modernem Deutsch wieder; „über euch“ entspricht der gerichteten hebräischen Präposition.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im hypothetischen Rollentausch
  choice: personenbezogen als „ihr“ und „meiner Stelle“ wiedergegeben
  alternative: „wenn eure Seele anstelle meiner Seele wäre“ oder „wenn euer Leben anstelle meines Lebens wäre“
  rationale: Im Kontext bezeichnet נֶפֶשׁ die ganze Person beziehungsweise ihre Lebenslage. Die idiomatische Übersetzung vermeidet, eine Leib-Seele-Lehre in den Vers hineinzulesen; die lexikalische Breite wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt rhetorisch zugespitzt, ohne unnötig archaische Formulierungen. Die konkrete Wiederholung von נֶפֶשׁ wird zugunsten der im Deutschen natürlichen Wendung „an meiner Stelle“ idiomatisch aufgelöst; die relevante Bedeutungsentscheidung ist transparent dokumentiert.
