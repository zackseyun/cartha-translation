base_translation:
  language: en
  yaml_path: translation/ot/job/016/019.yaml
  text: Even now[a], behold, my witness is in heaven[b], and he who testifies for me is in the heights.
translation:
  language: de
  text: 'Auch jetzt, sieh: Im Himmel ist mein Zeuge, und in den Höhen mein Zeuge[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das zweite hebräische Wort ist ein nahes Synonym für »Zeuge«; auch möglich: »und in den Höhen ist der, der für mich Zeugnis ablegt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Auch jetzt gilt
  rationale: Die Verbindung betont, dass die Aussage selbst in Hiobs gegenwärtiger Not weiterhin gilt. Die Formulierung gibt diese fortdauernde, nachdrückliche Geltung in natürlichem Deutsch wieder.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird als würdiger, gegenwärtig verständlicher Aufmerksamkeitsruf wiedergegeben.
- source_word: בַשָּׁמַיִם
  choice: im Himmel
  rationale: Gemeint ist hier im Parallelismus mit den Höhen der himmlische Bereich, nicht bloß der sichtbare Himmel.
- source_word: עֵדִי
  choice: mein Zeuge
  rationale: Die direkte Wiedergabe bewahrt das rechtliche Bild von Hiobs Berufung auf einen Zeugen.
- source_word: וְשָׂהֲדִי
  choice: mein Fürsprecher
  rationale: Das aramaisierende, zu »Zeuge/bezeugen« gehörende Wort bezeichnet im parallelen Rechtsbild den, der für Hiob Zeugnis ablegt. »Fürsprecher« macht diese Funktion knapp verständlich, ohne die Identität der Gestalt festzulegen; die wörtlichere Alternative steht in der Fußnote.
- source_word: בַּמְּרוֹמִים
  choice: in den Höhen
  rationale: Die Formulierung bewahrt das räumliche Höhenbild und den poetischen Parallelismus zu »im Himmel«.
theological_decisions:
- issue: Identität des himmlischen Zeugen
  choice: Die Gestalt wird nur funktional als »mein Zeuge« und »mein Fürsprecher« bezeichnet.
  alternative: Gott selbst, ein himmlischer Mittler oder eine poetische Personifikation von Hiobs Zeugnis ausdrücklich bestimmen.
  rationale: Der hebräische Text identifiziert die Gestalt nicht eindeutig. Die Übersetzung bewahrt deshalb die rechtliche Bildsprache und die theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Sieh« erhält den nachdrücklichen Charakter von הִנֵּה; »in den Höhen« bewahrt den poetischen Parallelismus. Der Fußnotenmarker steht unmittelbar nach dem betroffenen Vers.
