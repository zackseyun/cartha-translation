  text: כִּֽי שְׁנ֣וֹת מִסְפָּ֣ר יֶאֱתָ֑יוּ וְ/אֹ֖רַח לֹא אָשׁ֣וּב אֶהֱלֹֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/022.yaml
  text: For a few years will come[b][a], and I will go on the path from which I will not return.
translation:
  language: de
  text: Denn nur wenige Jahre werden noch kommen,[a] dann gehe ich den Pfad,[b] von dem ich nicht zurückkehren werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Jahre von Zahl«, das heißt: wenige oder begrenzte Jahre.'
    reason: lexical_alternative
  - marker: b
    text: Der Pfad, von dem es keine Rückkehr gibt, bezeichnet den unumkehrbaren Weg in den Tod.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Hiobs vorausgehende Aussage ein und wahrt den kausalen Zusammenhang.
- source_word: שְׁנוֹת מִסְפָּר
  choice: nur noch wenige Jahre
  rationale: Die Wendung bedeutet wörtlich »Jahre von Zahl« und bezeichnet eine begrenzte, geringe Zahl von Jahren. »Nur noch« macht im Deutschen den kontextuellen Bezug auf die verbleibende Lebenszeit natürlich deutlich.
- source_word: יֶאֱתָיוּ
  choice: kommen
  rationale: Das Verb bedeutet »kommen/eintreffen«; Subjekt sind die wenigen verbleibenden Jahre.
- source_word: וְאֹרַח
  choice: dann ... den Pfad
  rationale: אֹרַח bezeichnet einen Weg oder Pfad und wird hier bildlich für den Weg in den Tod gebraucht. Das hebräische ו wird im natürlichen deutschen Satzgefüge zeitlich-fortführend mit »dann« wiedergegeben.
- source_word: לֹא אָשׁוּב
  choice: von dem ich nicht zurückkehren werde
  rationale: Bewahrt die Verneinung und bezieht die Rückkehr idiomatisch auf den zuvor genannten Pfad.
- source_word: אֶהֱלֹךְ
  choice: gehe ich
  rationale: Gibt den Qal-Imperfekt von הלך schlicht wieder; im Zusammenhang bezeichnet er Hiobs bevorstehenden Gang.
theological_decisions:
- issue: Bezug des unumkehrbaren Pfades
  choice: Die Todesvorstellung bleibt als Bild im Haupttext unausgesprochen und wird in der Fußnote erläutert.
  alternative: Den Pfad ausdrücklich als »Weg in den Tod« wiedergeben.
  rationale: Der hebräische Text nennt den Tod nicht ausdrücklich. Die metaphorische Spannung und Bildsprache sollen daher im Haupttext erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Wegmetapher bleibt erhalten; die ungewöhnliche hebräische Wendung für die begrenzte Lebenszeit wird verständlich und idiomatisch wiedergegeben.
