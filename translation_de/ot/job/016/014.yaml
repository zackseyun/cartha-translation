  text: יִפְרְצֵ֣/נִי פֶ֭רֶץ עַל פְּנֵי פָ֑רֶץ יָרֻ֖ץ עָלַ֣/י כְּ/גִבּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/014.yaml
  text: He breaks through me with breach upon breach[b][a]; he rushes at me like a warrior.
translation:
  language: de
  text: Er reißt mich auf – Bresche über Bresche; er stürmt gegen mich an wie ein Krieger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Krieger“ kann auch als „starker Mann“ oder „Held“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְרְצֵנִי
  choice: Er bricht mich auf
  rationale: Das Qal von פרץ mit Suffix der 1. Person Singular bezeichnet ein gewaltsames Aufbrechen oder Durchbrechen. »Bricht mich auf« bewahrt, dass Hiob selbst vom Angriff aufgerissen wird.
- source_word: פֶרֶץ עַל־פְּנֵי פָרֶץ
  choice: Bresche über Bresche
  rationale: Die Wiederholung von פֶרֶץ wird beibehalten; die knappe poetische Wendung vermittelt eine Folge sich häufender Durchbrüche.
- source_word: יָרוּץ עָלַי
  choice: er stürmt gegen mich an
  rationale: רוץ bedeutet grundsätzlich »laufen«, bezeichnet hier aber eine schnelle, feindliche Bewegung. »Gegen mich anstürmen« gibt Richtung und Angriffsdynamik natürlich wieder.
- source_word: כְגִבּוֹר
  choice: wie ein Krieger
  rationale: גִּבּוֹר kann einen starken, mächtigen Mann oder besonders einen kampferprobten Krieger bezeichnen. Der unmittelbare Angriffskontext spricht für »Krieger«.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Angriffs
  choice: Das männliche Pronomen »er« bleibt ohne ausdrückliche Identifizierung.
  alternative: »Gott« als Subjekt ausdrücklich nennen.
  rationale: Der hebräische Vers enthält nur verbale Formen der 3. Person Singular. Der Kontext legt Gott nahe, doch der Vers selbst nennt ihn nicht; diese Textgestalt wird bewahrt.
translation_notes:
  register: Dichterisch verdichtetes, modernes Standarddeutsch. Die Wiederholung »Bresche über Bresche« bewahrt das eindringliche hebräische Bild; »stürmt gegen mich an« ist gegenwärtig und würdevoll.
