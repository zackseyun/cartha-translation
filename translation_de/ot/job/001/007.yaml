source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן מֵ/אַ֣יִן תָּבֹ֑א וַ/יַּ֨עַן הַ/שָּׂטָ֤ן אֶת יְהוָה֙ וַ/יֹּאמַ֔ר מִ/שּׁ֣וּט בָּ/אָ֔רֶץ וּ/מֵֽ/הִתְהַלֵּ֖ךְ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/007.yaml
  text: Then Yahweh said to the Adversary[a], “Where have you come from?” And the Adversary answered Yahweh and said, “From roaming on the earth and from walking about on it.”
translation:
  language: de
  text: 'Da sagte Jahwe zu dem Widersacher[a]: »Woher kommst du?« Der Widersacher antwortete Jahwe: »Ich habe die Erde durchstreift und bin auf ihr umhergezogen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »der Satan«. Das Wort steht hier mit bestimmtem Artikel und dient als Titel im Sinn von »der Widersacher«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche wissenschaftliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: הַשָּׂטָן
  choice: der Widersacher
  rationale: Der bestimmte Artikel kennzeichnet die Bezeichnung hier als Titel beziehungsweise Rolle. »Widersacher« gibt den weiteren adversativen Sinn natürlicher wieder als »der Satan« und legt noch keinen Eigennamen fest.
- source_word: מֵאַיִן תָּבֹא
  choice: Woher kommst du?
  rationale: Die knappe deutsche Frage gibt Herkunft beziehungsweise Ausgangspunkt idiomatisch wieder; der Kontext macht die vorausgegangene Ankunft deutlich.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: antwortete
  rationale: Die hebräische Vollformel »antwortete und sagte« wird im natürlichen modernen Deutsch ohne Bedeutungsverlust zusammengezogen.
- source_word: מִשּׁוּט בָּאָרֶץ
  choice: Ich habe die Erde durchstreift
  rationale: שׁוט bezeichnet ein Umherziehen beziehungsweise Hin-und-her-Ziehen. »Durchstreift« vermittelt diese Bewegung idiomatisch; »Erde« entspricht dem kosmischen Rahmen besser als »Land«.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: und bin auf ihr umhergezogen
  rationale: Die reflexiv-intensive Verbform bezeichnet wiederholte Bewegung. »Umhergezogen« wahrt den iterativen Sinn und vermeidet die im Deutschen hier unnatürliche wörtliche Form »auf ihr umhergegangen«.
theological_decisions:
- issue: Ist הַשָּׂטָן hier Eigenname oder Titel/Rollenbezeichnung?
  choice: 'Titel/Rollenbezeichnung: »der Widersacher«'
  alternative: Eigenname »Satan« oder formnahe Wiedergabe »der Satan«
  rationale: Der bestimmte Artikel im Hebräischen spricht in diesem Kontext deutlich für eine Rollenbezeichnung. Die Übersetzung vermeidet es, die spätere Verwendung als Eigenname rückwirkend eindeutig in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die erzählerische Einleitung bleibt knapp; die hebräische Antwortformel wird idiomatisch gestrafft. Die beiden annähernd parallelen Bewegungsverben bleiben als zwei Aussagen erkennbar.
