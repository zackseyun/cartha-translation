source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הִנֵּ֤ה כָל אֲשֶׁר ל/וֹ֙ בְּ/יָדֶ֔/ךָ רַ֣ק אֵלָ֔י/ו אַל תִּשְׁלַ֖ח יָדֶ֑/ךָ וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/עִ֖ם פְּנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/012.yaml
  text: And Yahweh said to the Accuser[a], “Look, all that he has is in your hand; only against him do not stretch out your hand.” Then the Accuser went out from the presence of Yahweh.
translation:
  language: de
  text: 'Da sagte Jahwe zum Ankläger[a]: »Sieh, alles, was ihm gehört, ist in deiner Hand. Nur gegen ihn darfst du deine Hand nicht ausstrecken.« Darauf ging der Ankläger aus der Gegenwart Jahwes hinaus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zum Satan« beziehungsweise »zum Widersacher«. Im Hebräischen steht der bestimmte Artikel; das deutet hier auf eine Bezeichnung oder Rolle hin.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt; »Jahwe« ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: הַשָּׂטָן
  choice: der Ankläger
  rationale: Der Artikel kennzeichnet hier eher eine Funktion oder Amtsbezeichnung als eindeutig einen Eigennamen. Im Kontext des himmlischen Hofes bringt »der Ankläger« die anklagende Rolle zum Ausdruck.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die aufmerksamkeitslenkende und nachdrückliche Funktion wird in würdigem, verständlichem Deutsch bewahrt.
- source_word: כָל אֲשֶׁר לוֹ
  choice: alles, was ihm gehört
  rationale: Die Wendung bezeichnet umfassend Hiobs Besitz und wird natürlich und präzise wiedergegeben.
- source_word: בְּיָדֶךָ
  choice: ist in deiner Hand
  rationale: Das Bild der Hand als Macht- und Verfügungsbereich bleibt erhalten und verbindet sich bewusst mit der Wiederholung von »Hand« im folgenden Verbot.
- source_word: רַק
  choice: nur
  rationale: Das Wort markiert klar die einzige Einschränkung der erteilten Vollmacht.
- source_word: אֵלָיו
  choice: gegen ihn selbst
  rationale: Die Präposition bezeichnet das Ziel einer feindlichen Handlung; »selbst« verdeutlicht den Kontrast zwischen Hiobs Besitz und seiner Person, ohne den Sinn auf eine bestimmte Art der Schädigung festzulegen.
- source_word: אַל תִּשְׁלַח יָדֶךָ
  choice: darfst du deine Hand nicht ausstrecken
  rationale: Die hebräische Bildsprache und die Wiederholung von »Hand« bleiben erhalten; die deutsche Modalform gibt das verbindliche Verbot natürlich wieder.
- source_word: וַיֵּצֵא
  choice: ging ... hinaus
  rationale: Schlichte narrative Wiedergabe des Bewegungsverbs.
- source_word: מֵעִם פְּנֵי יְהוָה
  choice: aus der Gegenwart Jahwes
  rationale: Die idiomatische Wendung bezeichnet das Fortgehen aus der unmittelbaren Gegenwart Jahwes und bewahrt den Rahmen der himmlischen Ratsversammlung.
theological_decisions:
- issue: Wiedergabe von הַשָּׂטָן im Hiobprolog
  choice: der Ankläger
  alternative: der Satan; der Widersacher
  rationale: Der bestimmte Artikel spricht in diesem Zusammenhang für eine Rolle oder Bezeichnung. »Der Ankläger« bewahrt die gerichtliche Funktion, ohne spätere Vorstellungen stärker in den Text einzutragen, als es die hebräische Form verlangt.
- issue: Reichweite der Erlaubnis und ihre Grenze
  choice: Hiobs gesamter Besitz wird in die Hand des Anklägers gegeben, Hiob selbst bleibt ausgenommen
  alternative: »alles, was ihm gehört« könnte weiter als sein materieller Besitz verstanden werden
  rationale: Der Gegensatz zwischen כָל אֲשֶׁר לוֹ und אֵלָיו unterscheidet das, was Hiob gehört, von seiner eigenen Person. Die Übersetzung wahrt diese Spannung und fügt keine nähere Bestimmung der erlaubten Schäden hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Hand-Metapher des Hebräischen wurde bewusst bewahrt. »Darauf« hält den Erzählfluss knapp und natürlich; der Gottesname erscheint einheitlich als »Jahwe«.
