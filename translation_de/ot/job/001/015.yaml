base_translation:
  language: en
  yaml_path: translation/ot/job/001/015.yaml
  text: And Sheba fell upon them and took them[a], and they struck down the young men with the edge of the sword[c][b]; and I alone have escaped to tell you.
translation:
  language: de
  text: Da fielen die Sabäer über sie her, nahmen sie weg[a] und erschlugen die jungen Männer[b] mit der Schneide des Schwertes[c]. Nur ich allein bin entkommen, um dir davon zu berichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Pronomen bezieht sich auf die im vorherigen Vers genannten Rinder und Esel.
    reason: referent_clarification
  - marker: b
    text: „Die jungen Männer“ kann hier auch „die Knechte“ oder „die Bediensteten“ bedeuten; wahrscheinlich sind die Männer gemeint, die das Vieh versorgten.
    reason: lexical_alternative
  - marker: c
    text: Hebräisch „mit dem Mund des Schwertes“, eine Redewendung für die Schneide des Schwertes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל שְׁבָא
  choice: Da fielen die Sabäer über sie her
  rationale: נפל bezeichnet hier einen feindlichen Überfall. שְׁבָא steht als Eigenname beziehungsweise kollektive Bezeichnung für die aus Saba kommenden Angreifer; „die Sabäer“ ist im Deutschen klar und natürlich.
- source_word: וַתִּקָּחֵם
  choice: und nahmen sie weg
  rationale: Das Suffix bezieht sich auf die zuvor genannten Rinder und Esel. „Wegnehmen“ gibt לקח direkt wieder und lässt den Zusammenhang eines Raubüberfalls erkennen.
- source_word: הַנְּעָרִים
  choice: die jungen Männer
  rationale: נְעָרִים kann junge Männer, Knechte oder Bedienstete bezeichnen. Die formnähere Wiedergabe bewahrt die lexikalische Offenheit; der Kontext legt nahe, dass Jobs Viehknechte gemeint sind.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: erschlugen sie mit der Schneide des Schwertes
  rationale: Die Wendung bezeichnet tödliches Schlagen durch das Schwert. „Schneide des Schwertes“ bewahrt das Bild des hebräischen Idioms in verständlichem Deutsch.
- source_word: וָאִמָּלְטָה
  choice: bin entkommen
  rationale: מלט bezeichnet das Entrinnen beziehungsweise Entkommen. Das deutsche Perfekt passt zur gegenwärtigen Meldung des gerade entkommenen Boten.
- source_word: רַק אֲנִי לְבַדִּי
  choice: Nur ich allein
  rationale: „Nur“ und „allein“ geben die doppelte Hervorhebung des Hebräischen wieder.
- source_word: לְהַגִּיד לָךְ
  choice: um dir davon zu berichten
  rationale: נגד bezeichnet hier das Überbringen einer Nachricht. „Berichten“ passt natürlich zur Botenrede; „davon“ nimmt das gemeldete Geschehen auf.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, dringliche Botenrede und die verstärkende Formulierung „Nur ich allein“ bleiben erhalten. Die kollektive Bezeichnung שְׁבָא wird zur eindeutigen Personenbezeichnung „die Sabäer“ aufgelöst, ohne den Herkunftsbezug zu verändern.
