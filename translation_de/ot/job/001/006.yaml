source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/יּ֔וֹם וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י הָ/אֱלֹהִ֔ים לְ/הִתְיַצֵּ֖ב עַל יְהוָ֑ה וַ/יָּב֥וֹא גַֽם הַ/שָּׂטָ֖ן בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/006.yaml
  text: There was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them.
translation:
  language: de
  text: Eines Tages kamen die Söhne Gottes[b], um sich vor Jahwe einzufinden, und auch der Widersacher[a] kam in ihre Mitte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Satan“. Im Hebräischen steht „der Satan/Widersacher“ mit bestimmtem Artikel; hier kann die Bezeichnung daher als Titel oder Funktionsangabe statt als Eigenname dienen.'
    reason: alternative_reading
  - marker: b
    text: Mit den „Söhnen Gottes“ können himmlische Wesen in der himmlischen Ratsversammlung gemeint sein.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Eines Tages
  rationale: Die hebräische Erzählformel eröffnet eine neue Szene. „Eines Tages“ gibt dies im heutigen Deutsch natürlich wieder, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes „nun“ einzuführen.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: die Söhne Gottes
  rationale: Die formnahe Wiedergabe bewahrt Bildsprache und Deutungsspielraum des Hebräischen; „himmlische Wesen“ wäre bereits eine Interpretation.
- source_word: לְהִתְיַצֵּב
  choice: um sich … einzufinden
  rationale: Das Hitpael bezeichnet hier das Erscheinen beziehungsweise Sich-Einfinden in Gegenwart eines Höhergestellten. Die Wendung klingt natürlich und lässt den Hof- beziehungsweise Versammlungskontext erkennen.
- source_word: עַל יְהוָה
  choice: vor Jahwe
  rationale: In Verbindung mit dem Sich-Einfinden bezeichnet עַל hier das Erscheinen vor jemandem. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: הַשָּׂטָן
  choice: der Widersacher
  rationale: Der bestimmte Artikel spricht hier für eine Rollen- oder Funktionsbezeichnung. „Widersacher“ bewahrt die lexikalische Bedeutung, ohne den Ausdruck vorschnell als Eigennamen festzulegen.
- source_word: בְּתוֹכָם
  choice: in ihre Mitte
  rationale: Die Wendung gibt die Zugehörigkeit zur versammelten Gruppe idiomatisch wieder und bleibt dem räumlichen Bild des Hebräischen nahe.
theological_decisions:
- issue: Ob הַשָּׂטָן als Eigenname oder als Titel wiederzugeben ist
  choice: der Widersacher
  alternative: Satan; der Ankläger
  rationale: Da das Hebräische den bestimmten Artikel trägt, wird die Bezeichnung hier als Rolle beziehungsweise Titel wiedergegeben. Die traditionelle Wiedergabe „Satan“ bleibt in der Fußnote erhalten.
- issue: Ob בְּנֵי הָאֱלֹהִים formal oder deutend übersetzt werden soll
  choice: die Söhne Gottes
  alternative: die himmlischen Wesen; die göttlichen Wesen
  rationale: Die formnahe Übersetzung bewahrt die hebräische Ausdrucksweise und ihre theologische Spannung; der wahrscheinliche Bezug auf Wesen der himmlischen Ratsversammlung wird nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache des Hebräischen bleibt erhalten; erklärungsbedürftige Deutungsmöglichkeiten werden in Fußnoten ausgewiesen, statt im Haupttext festgelegt zu werden.
