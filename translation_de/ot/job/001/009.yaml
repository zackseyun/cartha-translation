  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר הַֽ/חִנָּ֔ם יָרֵ֥א אִיּ֖וֹב אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/009.yaml
  text: Then the Accuser answered Yahweh and said[b][a], “Does Job fear God for nothing?"
translation:
  language: de
  text: 'Da antwortete der Ankläger[a] Jahwe und sagte: „Fürchtet Hiob Gott etwa umsonst[b]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „der Satan“ oder „der Widersacher“. Der Ausdruck steht mit dem bestimmten Artikel und bezeichnet hier eine Rolle, daher „der Ankläger“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ohne Grund“, „ohne Anlass“. Die Frage zielt darauf, ob Hiobs Gottesfurcht uneigennützig ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Da antwortete
  rationale: ענה bezeichnet in der erzählenden Redeeinleitung ein Antworten; „Da“ gibt die fortschreitende hebräische Erzählform natürlich wieder.
- source_word: הַשָּׂטָן
  choice: der Ankläger
  rationale: Der bestimmte Artikel weist hier auf eine Rolle oder Amtsbezeichnung. „Ankläger“ bringt die anklagende, widerstreitende Funktion im himmlischen Gespräch zum Ausdruck, ohne den Ausdruck vorschnell als Eigennamen zu behandeln.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die zweite hebräische Redeeinleitung wird trotz der im Deutschen möglichen Verkürzung bewahrt, da sie die formale Abfolge „antwortete … und sagte“ wiedergibt.
- source_word: הַחִנָּם
  choice: etwa umsonst
  rationale: חִנָּם kann „umsonst“, „ohne Gegenleistung“ oder „ohne Grund“ bedeuten. In der rhetorischen Frage stellt der Ausdruck besonders infrage, ob Hiobs Gottesfurcht ohne Eigennutz ist; „umsonst“ bewahrt zugleich die Mehrdeutigkeit.
- source_word: יָרֵא
  choice: fürchtet
  rationale: ירא bezeichnet gegenüber Gott ehrfürchtige Furcht. „Fürchten“ erhält die traditionelle und gewichtige Wortbedeutung, ohne sie auf bloße Verehrung zu verengen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet hier den Gott, den Hiob fürchtet; „Gott“ ist die direkte deutsche Entsprechung.
theological_decisions:
- issue: הַשָּׂטָן mit bestimmtem Artikel
  choice: der Ankläger
  alternative: der Satan; der Widersacher
  rationale: Die Wiedergabe als Rollenbezeichnung trägt dem Artikel Rechnung und vermeidet es, spätere Vorstellungen über „Satan“ als Eigennamen unbemerkt in diese Szene einzutragen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Sinn der Frage mit חִנָּם
  choice: Hiobs Gottesfurcht wird als möglicherweise nicht uneigennützig hinterfragt
  alternative: Die Frage bedeutet ausschließlich „ohne Ursache“
  rationale: Der Ausdruck lässt sowohl den Gedanken „ohne Grund“ als auch „ohne Lohn oder Vorteil“ zu. „Umsonst“ hält diese Spannung offen und passt zum folgenden Vorwurf, Hiob profitiere von Gottes Schutz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische doppelte Redeeinleitung „antwortete … und sagte“ bleibt erhalten. „Etwa“ kennzeichnet die rhetorische Frage, während „umsonst“ die beabsichtigte Mehrdeutigkeit wahrt.
