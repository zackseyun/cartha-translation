  text: ע֣וֹד זֶ֣ה מְדַבֵּ֗ר וְ/זֶה֮ בָּ֣א וַ/יֹּאמַר֒ כַּשְׂדִּ֞ים שָׂ֣מוּ שְׁלֹשָׁ֣ה רָאשִׁ֗ים וַֽ/יִּפְשְׁט֤וּ עַל הַ/גְּמַלִּים֙ וַ/יִּקָּח֔וּ/ם וְ/אֶת הַ/נְּעָרִ֖ים הִכּ֣וּ לְ/פִי חָ֑רֶב וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/017.yaml
  text: While this one was still speaking[a], another came and said, “The Chaldeans formed three raiding parties, swept down on the camels and took them, and they struck down the young men with the edge of the sword[c][b]. And I alone have escaped to tell you.”
translation:
  language: de
  text: 'Während dieser noch redete, kam ein anderer und sagte: »Die Chaldäer bildeten drei Abteilungen[a], überfielen die Kamele und nahmen sie mit. Sie erschlugen die jungen Männer[b] mit der Schneide des Schwertes[c]. Nur ich allein bin entkommen, um es dir zu berichten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »teilten sich in drei Gruppen auf« beziehungsweise »stellten drei Abteilungen auf«; wörtlich: »setzten drei Köpfe«.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »jungen Männern« können hier auch Diener oder Bedienstete des Haushalts gemeint sein.
    reason: lexical_alternative
  - marker: c
    text: 'Hebräische Wendung, wörtlich: »mit dem Mund des Schwertes«; gemeint ist, dass sie mit Schwertern getötet wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֣וֹד זֶ֣ה מְדַבֵּר
  choice: Während dieser noch redete
  rationale: עֹוד mit dem Partizip bezeichnet eine noch andauernde Handlung; זֶה verweist in der Botenfolge auf den zuvor genannten Boten.
- source_word: וְזֶה בָּא וַיֹּאמַר
  choice: kam ein anderer und sagte
  rationale: Das zweite זֶה bezeichnet im Erzählzusammenhang den nächsten Boten; »ein anderer« ist dafür im Deutschen natürlich.
- source_word: כַּשְׂדִּים
  choice: Die Chaldäer
  rationale: Das Ethnonym bezeichnet hier kollektiv die angreifende Gruppe.
- source_word: שָׂמוּ שְׁלֹשָׁה רָאשִׁים
  choice: bildeten drei Stoßtrupps
  rationale: Wörtlich steht »setzten drei Köpfe«; im militärischen Zusammenhang sind drei Abteilungen oder Trupps gemeint. »Stoßtrupps« bewahrt den Angriffscharakter.
- source_word: וַיִּפְשְׁטוּ עַל
  choice: fielen über ... her
  rationale: פשט על bezeichnet hier einen plötzlichen räuberischen Überfall.
- source_word: וַיִּקָּחוּם
  choice: nahmen sie mit
  rationale: Das Suffix bezieht sich auf die Kamele; im Kontext bezeichnet לקח ihre Wegnahme als Beute.
- source_word: הַנְּעָרִים
  choice: die jungen Männer
  rationale: נְעָרִים kann junge Männer, Diener oder Bedienstete bezeichnen. Die Grundbedeutung bleibt im Text stehen; die kontextuelle Möglichkeit wird in einer Fußnote genannt.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: erschlugen sie mit der Schärfe des Schwertes
  rationale: Die Wendung bedeutet, jemanden mit dem Schwert zu töten; »Schärfe des Schwertes« lässt das hebräische Bild vom »Mund des Schwertes« in verständlichem Deutsch erkennen.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Nur ich allein bin entkommen
  rationale: רַק und לְבַדִּי betonen gemeinsam, dass der Bote der einzige Entkommene ist.
- source_word: לְהַגִּיד לָךְ
  choice: um es dir zu berichten
  rationale: הגיד bedeutet mitteilen oder berichten; die Formulierung passt zur wiederkehrenden Botenrede.
