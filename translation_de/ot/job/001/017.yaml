  to: 'Während dieser noch redete, kam ein anderer und sagte: »Die Chaldäer bildeten drei Abteilungen[a], überfielen die Kamele und nahmen sie mit. Sie erschlugen die jungen Männer[b] mit der Schneide des Schwertes[c]. Nur ich allein bin entkommen, um es dir zu berichten.«'
