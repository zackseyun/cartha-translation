  yaml_path: translation/ot/job/001/011.yaml
  text: But stretch out your hand[a], please, and touch all that he has, and he will surely curse you to your face.
translation:
  language: de
  text: Doch streck bitte deine Hand aus und taste alles an, was er hat; er wird dir gewiss ins Angesicht fluchen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „segnen“. Im Prolog des Hiobbuches wird dies hier allgemein als euphemistische Ausdrucksweise für „fluchen“ verstanden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Doch
  rationale: Kennzeichnet den nachdrücklichen Gegensatz zu der vorherigen Aussage und klingt im Deutschen natürlich.
- source_word: שְׁלַח נָא יָדְךָ
  choice: streck nur deine Hand aus
  rationale: Bewahrt das hebräische Bild für ein machtvolles Eingreifen. Das auffordernde נָא wird hier durch „nur“ wiedergegeben, das in diesem herausfordernden Zusammenhang natürlicher als „bitte“ klingt.
- source_word: וְגַע
  choice: und taste … an
  rationale: Gibt die Grundbedeutung „berühren, antasten“ wieder und lässt zugleich den im Kontext erkennbaren schädigenden Eingriff mitschwingen, ohne ihn mit „schlagen“ ausdrücklich festzulegen.
- source_word: בְּכָל אֲשֶׁר לוֹ
  choice: alles …, was er hat
  rationale: Natürliche und genaue Wiedergabe des Ausdrucks für Hiobs gesamten Besitz.
- source_word: אִם לֹא
  choice: ganz gewiss
  rationale: Die wörtlich bedingte Formulierung dient hier in einer schwurähnlichen Aussage der nachdrücklichen Bekräftigung.
- source_word: עַל פָּנֶיךָ
  choice: ins Angesicht
  rationale: Bewahrt die Wendung für eine offene, unmittelbare Schmähung Gottes.
- source_word: יְבָרֲכֶךָּ
  choice: dir … fluchen
  rationale: Obwohl ברך gewöhnlich „segnen“ bedeutet, ist es im Prolog des Hiobbuches in diesem feindseligen Zusammenhang als ehrfürchtiger Euphemismus für „fluchen“ zu verstehen. Die wörtliche lexikalische Form wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Euphemistischer Gebrauch von ברך im Prolog des Hiobbuches
  choice: Im Haupttext mit „fluchen“ wiedergeben
  alternative: Wörtlich „segnen“
  rationale: Der Zusammenhang macht deutlich, dass der Satan behauptet, Hiob werde sich offen gegen Gott wenden. „Fluchen“ vermittelt diesen Sinn; die ungewöhnliche hebräische Wortwahl und die darin liegende Spannung bleiben durch die Fußnote transparent.
- issue: Schwurähnliche Konstruktion אִם לֹא
  choice: Als nachdrückliche Gewissheitsaussage „ganz gewiss“ wiedergeben
  alternative: 'Wörtlich-rhetorisch: „ob er dir dann nicht …“'
  rationale: Die Konstruktion drückt hier keine offene Bedingung, sondern die behauptete Gewissheit des folgenden Geschehens aus. Die deutsche Aussageform gibt diese Funktion klar wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die Hand ausstrecken“ und „ins Angesicht“ erhalten die markanten hebräischen Bilder; „antasten“ verbindet Quellennähe mit der im Zusammenhang gemeinten Schädigung. Der Fußnotenmarker steht unmittelbar bei der betreffenden Wiedergabe „fluchen“.
