  yaml_path: translation/ot/job/001/013.yaml
  text: There was a day when his sons and his daughters were eating and drinking wine in the house of their oldest brother[a].
translation:
  language: de
  text: Eines Tages waren seine Söhne und Töchter im Haus ihres ältesten Bruders[a] und aßen und tranken Wein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erstgeborenen Bruders“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Eines Tages
  rationale: Die hebräische Erzählformel führt eine neue Szene ein. „Eines Tages“ gibt ihre idiomatisch indefinite zeitliche Funktion natürlich wieder, ohne ein nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: וּבָנָיו וּבְנֹתָיו
  choice: seine Söhne und Töchter
  rationale: Das Hebräische nennt Söhne und Töchter ausdrücklich; die Übersetzung bewahrt diese Unterscheidung.
- source_word: אֹכְלִים וְשֹׁתִים
  choice: aßen und tranken
  rationale: Die Partizipien beschreiben die gerade andauernde Handlung. Im Deutschen stellt die Verbindung mit „waren … im Haus“ die Szene hinreichend als im Verlauf befindlich dar; eine schwerfällige Verlaufsumschreibung wird vermieden.
- source_word: יַיִן
  choice: Wein
  rationale: Direkte und kontextgemäße Entsprechung.
- source_word: בְּבֵית אֲחִיהֶם
  choice: im Haus ihres … Bruders
  rationale: Die Konstruktion bezeichnet den Ort und das verwandtschaftliche Verhältnis eindeutig.
- source_word: הַבְּכוֹר
  choice: ältesten
  rationale: Gemeint ist der Bruder an erster Stelle der Geburtsfolge. „Ältester Bruder“ ist im modernen Deutschen idiomatisch; die formnähere Alternative „erstgeborener Bruder“ bleibt in der Fußnote erhalten.
