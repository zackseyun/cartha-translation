  text: וְ/הִנֵּה֩ ר֨וּחַ גְּדוֹלָ֜ה בָּ֣אָה מֵ/עֵ֣בֶר הַ/מִּדְבָּ֗ר וַ/יִּגַּע֙ בְּ/אַרְבַּע֙ פִּנּ֣וֹת הַ/בַּ֔יִת וַ/יִּפֹּ֥ל עַל הַ/נְּעָרִ֖ים וַ/יָּמ֑וּתוּ וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/019.yaml
  text: And behold[a], a great wind came from across the wilderness and struck the four corners of the house, and it fell on the young men, and they died[b]; and I alone have escaped to tell you.
translation:
  language: de
  text: Und da kam[a] ein gewaltiger Wind von jenseits der Wüste, traf die vier Ecken des Hauses, und das Haus stürzte auf die jungen Leute[b], und sie starben. Nur ich allein bin entkommen, um es dir zu berichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und siehe“. Oder: „Und plötzlich“.'
    reason: Die hebräische Wendung וְהִנֵּה lenkt lebhaft die Aufmerksamkeit auf das berichtete Ereignis und kann im Zusammenhang dessen plötzliches Eintreten signalisieren.
  - marker: b
    text: Das hebräische Wort kann auch „die jungen Männer“ oder „die Diener“ bedeuten.
    reason: Lexikalische Mehrdeutigkeit von הַנְּעָרִים; die genaue Referenz wird nicht ausdrücklich aufgelöst.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh da
  rationale: Bewahrt die deiktische Lebendigkeit und den plötzlichen Einsatz des Berichts in einer würdigen, noch verständlichen deutschen Wendung.
- source_word: רוּחַ גְּדוֹלָה
  choice: ein gewaltiger Wind
  rationale: רוּחַ bezeichnet hier aufgrund des Zusammenhangs Wind; גְּדוֹלָה beschreibt dessen außerordentliche Stärke. „Gewaltiger Wind“ klingt im Deutschen natürlicher als „großer Wind“, ohne ausdrücklich einen Sturm hinzuzufügen.
- source_word: בָּאָה מֵעֵבֶר הַמִּדְבָּר
  choice: kam von jenseits der Wüste
  rationale: Gibt den räumlichen Ausgangspunkt „von der anderen Seite/jenseits“ wieder, ohne die Geografie weiter festzulegen.
- source_word: וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת
  choice: traf die vier Ecken des Hauses
  rationale: נגע kann berühren, erreichen oder treffen bedeuten; angesichts des Einsturzes bringt „traf“ die zerstörerische Wirkung angemessen zum Ausdruck.
- source_word: וַיִּפֹּל עַל הַנְּעָרִים
  choice: Da stürzte es auf die jungen Leute
  rationale: Das singularische Verb bezieht sich am natürlichsten auf das Haus. „Stürzte“ macht diesen Bezug im Deutschen klar, ohne ein zusätzliches Substantiv einzuführen.
- source_word: הַנְּעָרִים
  choice: die jungen Leute
  rationale: Die Bezeichnung kann junge Menschen, junge Männer oder Diener meinen. „Junge Leute“ lässt die im Kontext bestehende Referenzbreite offen und vermeidet die unbegründete Festlegung auf Diener.
- source_word: וַיָּמֻתוּ
  choice: und sie starben
  rationale: Entspricht unmittelbar dem nicht-kausativen hebräischen Verb und fügt keine ausdrückliche Tötungsformulierung hinzu.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Nur ich allein bin entkommen
  rationale: Gibt die doppelte Hervorhebung der Ausschließlichkeit natürlich wieder; das Perfekt passt zu mündlicher Berichterstattung im modernen Deutsch.
- source_word: לְהַגִּיד לָךְ
  choice: um es dir zu berichten
  rationale: „Berichten“ passt zur wiederkehrenden Botenformel; das ergänzte Pronomen „es“ ist im Deutschen idiomatisch und bezeichnet das soeben geschilderte Geschehen.
theological_decisions:
- issue: Identität der נְעָרִים
  choice: die jungen Leute
  alternative: die jungen Männer / die Diener
  rationale: Der Ausdruck ist lexikalisch mehrdeutig und der unmittelbare Zusammenhang nennt Söhne und Töchter. Die Übersetzung soll weder ausschließlich männliche Opfer noch Diener als Referenten festschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Unmittelbarkeit. Kurze Hauptsätze bilden den dringlichen Botenbericht nach. „Sieh da“ ist bewusst etwas gehobener, aber allgemein verständlich; die Fußnote nennt eine stärker idiomatische Alternative.
