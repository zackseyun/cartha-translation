  source_fidelity: 'Die Handlungsfolge und die Trauergesten werden im Entwurf grundsätzlich zutreffend wiedergegeben. „Verneigte sich“ ist für וַיִּשְׁתָּחוּ jedoch zu schwach und insbesondere nach „warf sich zu Boden“ missverständlich: Das Verb bezeichnet hier ein Niederwerfen bzw. Prostrieren, ohne dass in diesem Vers ausdrücklich „Anbetung“ ergänzt werden muss.'
  naturalness: „Fiel zu Boden und warf sich nieder“ ist modernes, flüssiges Erzähldeutsch und bildet die zwei aufeinanderfolgenden hebräischen Verben klarer ab als „warf sich zu Boden und verneigte sich“. „Schor sich den Kopf“ ist als knappe Beschreibung der Trauergeste möglich und angemessen.
  terminology: „Hiob“, „Obergewand“ und die zurückhaltende Wiedergabe der kultisch möglichen, aber nicht ausdrücklich benannten Bedeutung von שׁחה sind angemessen. Die Fußnote sollte die körperliche Hauptbedeutung als Übersetzungsalternative korrekt spiegeln.
