    issue: „verneigte sich“ gibt וַיִּשְׁתָּחוּ zu abgeschwächt wieder.
    rationale: Das hebräische Verb bezeichnet ein Sich-Niederwerfen bzw. eine Prostration. Eine bloße Verbeugung kann aufrecht erfolgen und verwischt die Intensität der Handlung, zumal Hiob unmittelbar zuvor zu Boden fällt.
  - severity: low
    issue: Die Kombination „warf sich zu Boden und verneigte sich“ wirkt semantisch uneinheitlich.
    rationale: Sie lässt die zweite Handlung wie eine aufrechte oder nur leichte Verbeugung nach einem Niederwerfen erscheinen. „Fiel zu Boden und warf sich nieder“ bewahrt die Abfolge und ist idiomatischer.
