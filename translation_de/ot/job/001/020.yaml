  text: וַ/יָּ֤קָם אִיּוֹב֙ וַ/יִּקְרַ֣ע אֶת מְעִל֔/וֹ וַ/יָּ֖גָז אֶת רֹאשׁ֑/וֹ וַ/יִּפֹּ֥ל אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/020.yaml
  text: Then Job rose[a], tore his robe, shaved his head, fell to the ground, and bowed down.
translation:
  language: de
  text: Da stand Hiob auf, zerriss sein Obergewand, schor sich den Kopf, fiel zu Boden und warf sich nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verneigte sich“. Das hebräische Verb bezeichnet ein körperliches Sich-Niederbeugen oder Sich-Niederwerfen, oft als Ausdruck von Ehrfurcht oder Anbetung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Da stand Hiob auf
  rationale: Das Qal-Wayyiqtol von קום führt die nächste Handlung der Erzählung ein; „stand … auf“ ist im modernen Deutschen natürlich.
- source_word: וַיִּקְרַע אֶת מְעִילוֹ
  choice: zerriss sein Obergewand
  rationale: קרע bezeichnet hier das Zerreißen von Kleidung als Trauergeste; מְעִיל ist ein bedeutendes äußeres Kleidungsstück.
- source_word: וַיָּגָז אֶת רֹאשׁוֹ
  choice: schor sich den Kopf
  rationale: גזז bedeutet abscheren beziehungsweise kurz abschneiden. Die Wendung gibt die konkrete Trauerhandlung wieder, ohne mehr als der hebräische Wortlaut über vollständige Kahlheit zu behaupten.
- source_word: וַיִּפֹּל אַרְצָה
  choice: warf sich zu Boden
  rationale: אַרְצָה bezeichnet die Bewegung zum Boden hin. Im Zusammenhang mit der unmittelbar folgenden Verneigung gibt „warf sich zu Boden“ die absichtliche körperliche Bewegung natürlich wieder.
- source_word: וַיִּשְׁתָּחוּ
  choice: verneigte sich
  rationale: Die Form von שׁחה bezeichnet ein Sich-Niederbeugen oder Sich-Niederwerfen, häufig als ehrfürchtige beziehungsweise gottesdienstliche Handlung. Die Übersetzung bewahrt die körperliche Bedeutung und lässt die religiöse Zielrichtung, die erst der Kontext erkennen lässt, offen.
theological_decisions:
- issue: Ob Hiobs letzte Handlung ausdrücklich als Anbetung bezeichnet werden soll
  choice: verneigte sich
  alternative: betete an / warf sich anbetend nieder
  rationale: Der hebräische Ausdruck kann eine ehrfürchtige oder kultische Niederbeugung bezeichnen, nennt in diesem Vers jedoch weder ausdrücklich Gott als Ziel noch verwendet er ein zusätzliches Wort für Anbetung. Die zurückhaltende Wiedergabe bewahrt diese Spannung; der folgende Vers verdeutlicht den Gottesbezug.
translation_notes:
  register: Modernes, würdiges Erzähldeutsch. „Obergewand“ ist verständlicher als das altertümliche „Mantel“ im Sinn eines antiken Kleidungsstücks; „verneigte sich“ vermeidet eine ausdrückliche theologische Festlegung, während die Fußnote die mögliche kultische Bedeutung nennt.
