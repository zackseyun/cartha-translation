  text: עַ֚ד זֶ֣ה מְדַבֵּ֔ר וְ/זֶ֖ה בָּ֣א וַ/יֹּאמַ֑ר בָּנֶ֨י/ךָ וּ/בְנוֹתֶ֤י/ךָ אֹֽכְלִים֙ וְ/שֹׁתִ֣ים יַ֔יִן בְּ/בֵ֖ית אֲחִי/הֶ֥ם הַ/בְּכֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/018.yaml
  text: While this one was still speaking[a], another came and said, “Your sons and your daughters were eating and drinking wine in the house of their firstborn brother.”
translation:
  language: de
  text: 'Während dieser noch redete, kam ein anderer und sagte: »Deine Söhne und Töchter aßen und tranken Wein[a] im Haus ihres erstgeborenen Bruders.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »hielten ein Festmahl und tranken Wein«. Wörtlich heißt es im Hebräischen: »aßen und tranken Wein«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד זֶה מְדַבֵּר
  choice: Während dieser noch redete
  rationale: Die Formulierung bewahrt die andauernde Handlung des Partizips und macht deutlich, dass der nächste Bote eintrifft, bevor der vorige ausgeredet hat.
- source_word: וְזֶה בָּא
  choice: kam ein anderer
  rationale: Wörtlich steht »und dieser kam«; im Zusammenhang bezeichnet die Wendung jedoch einen weiteren Boten und wird so im Deutschen natürlich wiedergegeben.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Schlichte, natürliche Wiedergabe der hebräischen Erzählform, die die direkte Rede einleitet.
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: Deine Söhne und Töchter
  rationale: Das ausdrücklich genannte Paar »Söhne und Töchter« bleibt erhalten, statt es zu »Kinder« zu verallgemeinern.
- source_word: אֹכְלִים וְשֹׁתִים יַיִן
  choice: aßen und tranken Wein
  rationale: Die Partizipien schildern eine zu diesem Zeitpunkt andauernde Tätigkeit. Die Übersetzung bleibt eng beim Wortlaut; eine Wiedergabe mit »feierten« wäre stärker deutend.
- source_word: בְּבֵית אֲחִיהֶם הַבְּכוֹר
  choice: im Haus ihres erstgeborenen Bruders
  rationale: »Erstgeborener Bruder« gibt הַבְּכוֹר genauer wieder als lediglich »ältester Bruder« und ist im Deutschen verständlich.
