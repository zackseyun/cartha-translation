  text: וַ/יְהִ֡י כִּ֣י הִקִּיפֽוּ֩ יְמֵ֨י הַ/מִּשְׁתֶּ֜ה וַ/יִּשְׁלַ֧ח אִיּ֣וֹב וַֽ/יְקַדְּשֵׁ֗/ם וְ/הִשְׁכִּ֣ים בַּ/בֹּקֶר֮ וְ/הֶעֱלָ֣ה עֹלוֹת֮ מִסְפַּ֣ר כֻּלָּ/ם֒ כִּ֚י אָמַ֣ר אִיּ֔וֹב אוּלַי֙ חָטְא֣וּ בָנַ֔/י וּ/בֵרֲכ֥וּ אֱלֹהִ֖ים בִּ/לְבָבָ֑/ם כָּ֛כָה יַעֲשֶׂ֥ה אִיּ֖וֹב כָּל הַ/יָּמִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/005.yaml
  text: And when the days of the feasting had run their course, Job would send and consecrate them, and he would rise early in the morning and offer burnt offerings according to the number of them all. For Job said, “Perhaps my sons have sinned and cursed God in their hearts.” Thus Job would do all the time.
translation:
  language: de
  text: 'Wenn die Tage des Festmahls jeweils vorüber waren, ließ Hiob sie zu sich kommen und heiligte sie. Früh am Morgen stand er auf und brachte Brandopfer dar, entsprechend ihrer aller Zahl. Denn Hiob sagte sich: »Vielleicht haben meine Söhne gesündigt und Gott in ihren Herzen verflucht[a].« So handelte Hiob jedes Mal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Gott in ihrem Herzen gesegnet«; »segnen« ist hier wahrscheinlich eine verhüllende Ausdrucksweise für »verfluchen« oder »sich von Gott lossagen«.'
    reason: Macht den euphemistischen Wortlaut des Hebräischen und die daraus entstehende Übersetzungsentscheidung transparent.
lexical_decisions:
- source_word: הִקִּיפוּ יְמֵי הַמִּשְׁתֶּה
  choice: die Tage des Festmahls jeweils vorüber waren
  rationale: Die Wendung bezeichnet den Abschluss beziehungsweise vollständigen Umlauf der Festtage; »jeweils« macht den wiederholten Ablauf im Kontext deutlich.
- source_word: וַיְקַדְּשֵׁם
  choice: und heiligte sie
  rationale: Bewahrt die kultische Bedeutung des Verbs, ohne eine im Text nicht näher erklärte Reinigungszeremonie einzuführen.
- source_word: עֹלוֹת מִסְפַּר כֻּלָּם
  choice: für jeden von ihnen ein Brandopfer
  rationale: Gibt idiomatisch wieder, dass die Zahl der Brandopfer der Zahl aller Kinder entsprach.
- source_word: כָּכָה יַעֲשֶׂה אִיּוֹב כָּל הַיָּמִים
  choice: So machte es Ijob allezeit
  rationale: Die Verbform und כָּל הַיָּמִים schildern Ijobs regelmäßige, fortgesetzte Gewohnheit.
theological_decisions:
- issue: בֵּרֲכוּ אֱלֹהִים bedeutet formal »Gott gesegnet«, wird hier jedoch als ehrfürchtiger Euphemismus verstanden.
  choice: Gott … verflucht
  alternative: Gott … gesegnet
  rationale: Im Zusammenhang mit möglicher Sünde und ebenso in Ijob 1,11; 2,5.9 bezeichnet »segnen« sehr wahrscheinlich verhüllend das Verfluchen beziehungsweise Lossagen von Gott. Eine Fußnote bewahrt die auffällige Formulierung des Hebräischen.
- issue: Die Sorge gilt einer inneren Verfehlung.
  choice: in ihrem Herzen
  alternative: in Gedanken
  rationale: Die wörtlichere Wendung erhält die biblische Vorstellung des Herzens als Zentrum des inneren Denkens und Wollens, ohne sie auf bloße Gedanken zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Handlung wird durch »jeweils« und »allezeit« kenntlich gemacht. Der traditionelle deutsche Name »Ijob« wird verwendet; unnötige kultische Zusatzdeutungen werden vermieden.
