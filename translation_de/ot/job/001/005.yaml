  naturalness: »ließ Ijob nach ihnen schicken« ist im heutigen Deutsch missverständlich und unidiomatisch; es kann bedeuten, er habe jemandem hinter ihnen hergeschickt. »ließ sie zu sich kommen« gibt die veranlasste Sendung klar wieder. »allezeit« ist deutlich gehobener bzw. altertümlicher als das angestrebte moderne Standarddeutsch. Außerdem ist »Hiob« die übliche moderne deutsche Namensform.
