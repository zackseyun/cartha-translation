base_translation:
  language: en
  yaml_path: translation/ot/job/001/016.yaml
  text: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned among the sheep and the young men and consumed them, and I alone have escaped to tell you.”
translation:
  language: de
  text: 'Während dieser noch redete, kam ein anderer und sagte: »Feuer Gottes fiel vom Himmel und setzte die Schafe und die jungen Männer in Brand und verzehrte sie. Nur ich allein bin entkommen, um es dir zu berichten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשׁ אֱלֹהִים
  choice: Feuer Gottes
  rationale: Die hebräische Genitivverbindung wird formal offen wiedergegeben; sie kann ein von Gott kommendes oder außergewöhnlich gewaltiges Feuer bezeichnen.
- source_word: בַצֹּאן וּבַנְּעָרִים
  choice: die Schafe und die jungen Männer
  rationale: צֹאן bezeichnet hier das Kleinvieh, im Kontext konkret die Schafe; נְעָרִים wird als »junge Männer« wiedergegeben, ohne ihre Rolle als Diener ausdrücklich festzulegen.
- source_word: וַתִּבְעַר ... וַתֹּאכְלֵם
  choice: setzte ... in Brand und verzehrte sie
  rationale: 'Die zwei aufeinanderfolgenden Verben werden unterschieden: Das Feuer entbrennt an bzw. unter ihnen und vernichtet sie schließlich vollständig.'
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Nur ich allein bin entkommen
  rationale: Die emphatische Häufung von רַק, אֲנִי und לְבַדִּי bleibt im Deutschen durch »Nur ich allein« hörbar.
theological_decisions:
- issue: Bedeutung von »Feuer Gottes«
  choice: Die wörtliche Wendung »Feuer Gottes« bleibt im Haupttext stehen.
  alternative: »Ein gewaltiges Feuer« oder »Feuer von Gott«
  rationale: Der Erzähler berichtet die Deutung des Boten, ohne ausdrücklich zu klären, ob Gott das Feuer unmittelbar gesandt hat oder ob die Wendung seine außergewöhnliche Gewalt bezeichnet. Diese Spannung soll erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Botenformel wird knapp und erzählerisch flüssig wiedergegeben; »dieser« und »ein anderer« erhalten den raschen Wechsel der Unglücksbotschaften.
