  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן הֲ/שַׂ֥מְתָּ לִבְּ/ךָ֖ עַל עַבְדִּ֣/י אִיּ֑וֹב כִּ֣י אֵ֤ין כָּמֹ֨/הוּ֙ בָּ/אָ֔רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/008.yaml
  text: 'And Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is none like him on the earth: a blameless and upright man[b], one who fears God and turns away from evil.”'
translation:
  language: de
  text: 'Und Jahwe sagte zu dem Ankläger[a]: »Hast du auf meinen Diener Hiob geachtet?[b] Denn auf der Erde gibt es keinen wie ihn, einen untadeligen und aufrichtigen Mann, der Gott fürchtet und sich vom Bösen abwendet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch »der Ankläger«; auch »der Satan« oder »der Widersacher«. Der Ausdruck bezeichnet hier eher eine Rolle oder Funktion als eindeutig einen Eigennamen.
    reason: alternative_reading
  - marker: b
    text: 'Traditionell auch: »Hast du auf meinen Diener Hiob geachtet?« Wörtlich heißt es: »Hast du dein Herz auf meinen Diener Hiob gerichtet?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner etablierten wissenschaftlichen Form wieder, statt ihn durch einen Titel wie »der HERR« zu ersetzen.
- source_word: הַשָּׂטָן
  choice: der Ankläger
  rationale: Der Artikel weist hier auf eine Rolle bzw. Amtsbezeichnung hin. »Der Ankläger« gibt zudem den forensischen Sinn in natürlichem Deutsch wieder, ohne vorschnell einen Eigennamen anzunehmen.
- source_word: הֲשַׂמְתָּ לִבְּךָ עַל
  choice: Hast du dein Herz auf … gerichtet?
  rationale: Bewahrt das hebräische Bild wörtlich und verständlich. Gemeint ist, die Aufmerksamkeit bewusst auf jemanden zu richten; die idiomatischere Alternative wird in der Fußnote genannt.
- source_word: עַבְדִּי
  choice: meinen Diener
  rationale: Bezeichnet hier Hiobs Zugehörigkeit zu Gott und seinen Dienst für ihn; »Diener« passt kontextuell besser als »Sklave«.
- source_word: כִּי אֵין כָּמֹהוּ בָּאָרֶץ
  choice: Denn auf der Erde gibt es keinen wie ihn
  rationale: Gibt die Aussage von Hiobs unvergleichlichem Charakter natürlich wieder und wahrt den wahrscheinlich universalen Bezug von בָּאָרֶץ.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: einen Mann, untadelig und aufrichtig
  rationale: »Mann« bezeichnet konkret Hiob; »untadelig« meint sittliche Integrität, nicht absolute Sündlosigkeit, und »aufrichtig« gibt die moralische Geradheit von יָשָׁר wieder.
- source_word: יְרֵא אֱלֹהִים
  choice: der Gott fürchtet
  rationale: Bewahrt die gewichtige biblische Redeweise für anhaltende Ehrfurcht und Frömmigkeit.
- source_word: וְסָר מֵרָע
  choice: und sich vom Bösen abwendet
  rationale: Drückt die durch das Partizip bezeichnete beständige Abkehr und Vermeidung des Bösen klar aus.
theological_decisions:
- issue: Ist הַשָּׂטָן hier ein Eigenname oder eine Rollenbezeichnung?
  choice: 'Rollenbezeichnung: »der Ankläger«'
  alternative: »Satan«, »der Satan« oder »der Widersacher«
  rationale: Der hebräische Artikel spricht in diesem Zusammenhang stark für einen Titel. Die Übersetzung wahrt die Szene des himmlischen Hofes und trägt keine spätere Verwendung als Eigenname in den Text ein.
- issue: Bezeichnet תָּם sündlose Vollkommenheit?
  choice: »untadelig« im Sinn persönlicher Integrität
  alternative: »vollkommen« oder »vollständig«
  rationale: Im weisheitlichen Zusammenhang und zusammen mit »aufrichtig« beschreibt das Wort einen integren Lebenswandel, nicht ausdrücklich absolute Sündlosigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Hebräischen, ohne unnatürlich zu wirken. Das konkrete Herzbild bleibt im Haupttext erhalten; eine geläufigere idiomatische Wiedergabe steht in der Fußnote.
