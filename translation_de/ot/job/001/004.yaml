base_translation:
  language: en
  yaml_path: translation/ot/job/001/004.yaml
  text: His sons would go and hold a feast[a], each in his own house on his day, and they would send and invite their three sisters to eat and drink with them.
translation:
  language: de
  text: Seine Söhne pflegten, jeder in seinem eigenen Haus, an seinem Tag[a] ein Festmahl zu veranstalten. Sie sandten hin und luden ihre drei Schwestern ein, mit ihnen zu essen und zu trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „an seinem Geburtstag“. Wörtlich heißt es im Hebräischen „an seinem Tag“. Gemeint sein kann entweder ein dem jeweiligen Sohn zugeteilter Tag oder sein Geburtstag.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: pflegten … zu veranstalten
  rationale: Die Folge der Qatal-Formen beschreibt hier im Zusammenhang mit Vers 5 eine wiederkehrende Gewohnheit. Die deutsche Konstruktion „pflegten … zu“ gibt diesen habituellen Sinn klar wieder.
- source_word: בָנָיו
  choice: seine Söhne
  rationale: Das hebräische Substantiv bezeichnet ausdrücklich die männlichen Kinder; die Schwestern werden später gesondert genannt.
- source_word: וְעָשׂוּ מִשְׁתֶּה
  choice: ein Festmahl zu veranstalten
  rationale: Die idiomatische Verbindung bedeutet, ein gemeinschaftliches Festessen auszurichten. „Festmahl“ bewahrt den feierlichen Charakter, ohne eine bestimmte religiöse Feier vorauszusetzen.
- source_word: בֵּית אִישׁ
  choice: der Reihe nach in ihren Häusern … jeder
  rationale: 'אִישׁ hat hier distributiven Sinn: Jeder Sohn richtete das Mahl in seinem eigenen Haus aus. „Der Reihe nach“ macht die im Kontext erkennbare wechselnde Zuordnung natürlich verständlich.'
- source_word: יוֹמוֹ
  choice: an seinem Tag
  rationale: Die wörtliche und absichtlich offene Formulierung wird beibehalten. Sie kann den jeweils zugewiesenen Tag oder möglicherweise den Geburtstag bezeichnen.
- source_word: וְשָׁלְחוּ וְקָרְאוּ
  choice: Sie ließen … einladen
  rationale: Die beiden Verben schildern das Aussenden einer Nachricht und die Einladung. Das deutsche „ließen … einladen“ fasst den Vorgang idiomatisch zusammen, ohne persönliche Anwesenheit beim Überbringen zu unterstellen.
- source_word: לִשְׁלֹשֶׁת אֲחִיתֵיהֶם
  choice: ihre drei Schwestern
  rationale: Zahl, Verwandtschaftsbezeichnung und Possessivbezug werden direkt und natürlich wiedergegeben.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: zu essen und zu trinken
  rationale: Die beiden Infinitive bezeichnen schlicht die Teilnahme am gemeinsamen Mahl.
- source_word: עִמָּהֶם
  choice: mit ihnen
  rationale: Die Präposition bezeichnet die gemeinsame Teilnahme der Schwestern mit ihren Brüdern.
