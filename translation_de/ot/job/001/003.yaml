  verdict: revise
  source_fidelity: Die Tierzahlen, Kamele, Ochsengespanne und Eselinnen sind zutreffend wiedergegeben. „Schafe und Ziegen“ legt jedoch nahe, dass jeweils 7.000 Tiere beider Arten oder eine fest bestimmte Zusammensetzung gemeint seien; צֹאן ist ein Sammelbegriff für Kleinvieh und lässt die genaue Zusammensetzung offen. Die Fußnote behauptet zudem zu bestimmt, beide Arten seien gemeint. עֲבֻדָּה רַבָּה מְאֹד bezeichnet am ehesten eine sehr umfangreiche Dienerschaft bzw. einen großen Dienstbetrieb; „sehr viel Gesinde“ ist weniger idiomatisch. „Angesehener“ verengt גָּדוֹל auf gesellschaftliches Ansehen, während der Kontext umfassende Größe bzw. Bedeutung ausdrückt.
