  text: וַ/יְהִ֣י מִ֠קְנֵ/הוּ שִֽׁבְעַ֨ת אַלְפֵי צֹ֜אן וּ/שְׁלֹ֧שֶׁת אַלְפֵ֣י גְמַלִּ֗ים וַ/חֲמֵ֨שׁ מֵא֤וֹת צֶֽמֶד בָּקָר֙ וַ/חֲמֵ֣שׁ מֵא֣וֹת אֲתוֹנ֔וֹת וַ/עֲבֻדָּ֖ה רַבָּ֣ה מְאֹ֑ד וַ/יְהִי֙ הָ/אִ֣ישׁ הַ/ה֔וּא גָּד֖וֹל מִ/כָּל בְּנֵי קֶֽדֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/003.yaml
  text: His livestock were seven thousand sheep[a], three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large household; and that man was greater than all the sons of the east.
translation:
  language: de
  text: Sein Viehbestand umfasste siebentausend Stück Kleinvieh[a], dreitausend Kamele, fünfhundert Ochsengespanne, fünfhundert Eselinnen und eine sehr große Dienerschaft. Dieser Mann war bedeutender als alle Bewohner des Ostens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann Schafe, Ziegen oder Kleinvieh im Allgemeinen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵהוּ
  choice: sein Viehbestand
  rationale: Der Ausdruck bezeichnet erworbenen Besitz, besonders Herden und Haustiere; die anschließende Tieraufzählung legt die konkrete Wiedergabe „Viehbestand“ nahe.
- source_word: צֹאן
  choice: Schafe und Ziegen
  rationale: Das hebräische Sammelwort umfasst gewöhnlich Kleinvieh, insbesondere Schafe und Ziegen. Die explizite Wiedergabe vermeidet eine unbegründete Verengung auf Schafe.
- source_word: צֶמֶד בָּקָר
  choice: Ochsengespanne
  rationale: צֶמֶד bezeichnet ein zusammengejochtes Paar; „Ochsengespanne“ gibt die gezählten Arbeitspaare natürlich und knapp wieder.
- source_word: אֲתוֹנוֹת
  choice: Eselinnen
  rationale: Die feminine Pluralform bezeichnet ausdrücklich weibliche Esel.
- source_word: עֲבֻדָּה רַבָּה מְאֹד
  choice: sehr viel Gesinde
  rationale: Im Kontext des großen Landguts bezeichnet עֲבֻדָּה wahrscheinlich die umfangreiche Dienerschaft beziehungsweise den Dienstbetrieb. „Gesinde“ ist im Deutschen für die gesamte Dienerschaft eines großen Haushalts verständlich und bewahrt den kollektiven Charakter.
- source_word: גָּדוֹל מִכָּל
  choice: angesehener als alle
  rationale: Die Vergleichskonstruktion bezeichnet hier Größe im sozialen und wirtschaftlichen Sinn; „angesehener“ vermittelt die herausragende Stellung natürlicher als das unbestimmte „größer“.
- source_word: בְּנֵי קֶדֶם
  choice: Menschen des Ostens
  rationale: Die hebräische Wendung bedeutet idiomatisch die Bevölkerung beziehungsweise Bewohner des Ostens; eine wörtliche Form wie „Söhne des Ostens“ wäre im modernen Deutschen missverständlich.
theological_decisions:
- issue: Bedeutung von גָּדוֹל in der Aussage über Ijobs Vorrangstellung
  choice: angesehener als alle
  alternative: größer als alle
  rationale: Der Kontext nennt Besitz und Haushaltsgröße und beschreibt damit Rang, Wohlstand und gesellschaftliche Bedeutung. Die Übersetzung legt nicht fest, dass moralische oder geistliche Größe gemeint sei.
- issue: Referenz von בְּנֵי קֶדֶם
  choice: Menschen des Ostens
  alternative: Söhne des Ostens
  rationale: Der maskuline hebräische Gruppenbegriff hat hier repräsentative ethnisch-geografische Bedeutung. „Menschen des Ostens“ gibt den Gesamtbezug wieder, ohne eine ausschließlich männliche Gruppe zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt der hebräischen Bestandsaufnahme nahe, verwendet aber natürliche deutsche Begriffe. „Gesinde“ ist leicht historisch gefärbt, passt jedoch zum antiken Großhaushalt und bezeichnet kollektiv die Dienerschaft.
