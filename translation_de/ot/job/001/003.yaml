  terminology: „Viehbestand“, „Ochsengespanne“ und „Eselinnen“ sind treffend. „Kleinvieh“ bewahrt die lexikalische Spannweite von צֹאן. „Dienerschaft“ ist gegenüber dem historisch gefärbten und teils abwertend wirkenden „Gesinde“ der passendere Registerausdruck. „Bewohner des Ostens“ entspricht dem idiomatischen Gruppenbezug von בְּנֵי קֶדֶם.
