  to: Sein Viehbestand umfasste siebentausend Stück Kleinvieh[a], dreitausend Kamele, fünfhundert Ochsengespanne, fünfhundert Eselinnen und eine sehr große Dienerschaft. Dieser Mann war bedeutender als alle Bewohner des Ostens.
