source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ עָרֹ֨ם יצתי מִ/בֶּ֣טֶן אִמִּ֗/י וְ/עָרֹם֙ אָשׁ֣וּב שָׁ֔מָ/ה יְהוָ֣ה נָתַ֔ן וַ/יהוָ֖ה לָקָ֑ח יְהִ֛י שֵׁ֥ם יְהוָ֖ה מְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/021.yaml
  text: And he said[a], “Naked I came out from my mother’s womb, and naked I will return there. Yahweh gave, and Yahweh has taken away[b]. May the name of Yahweh be blessed.”
translation:
  language: de
  text: 'Und er sagte: „Nackt bin ich aus dem Leib meiner Mutter gekommen, und nackt werde ich dorthin zurückkehren.[a] Jahwe[b] hat gegeben, und Jahwe hat genommen. Der Name Jahwes sei gesegnet.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dorthin“. Das Ziel bleibt im Hebräischen unausgesprochen; gemeint sein können bildlich der Mutterleib, die Erde beziehungsweise das Grab oder allgemeiner die Rückkehr in einen Zustand ohne Besitz.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch: JHWH, der Gottesname; traditionell mit „der HERR“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֹם
  choice: nackt
  rationale: Die direkte und natürliche deutsche Entsprechung bewahrt sowohl das konkrete Bild der Geburt als auch den Gedanken, ohne Besitz aus dem Leben zu scheiden.
- source_word: יצתי
  choice: bin ich … gekommen
  rationale: Das Verb יצא bezeichnet hier das Hervorkommen bei der Geburt. Die deutsche Perfektform klingt gegenwärtig und natürlich.
- source_word: מִבֶּטֶן אִמִּי
  choice: aus dem Leib meiner Mutter
  rationale: „Leib“ gibt בֶּטֶן im Geburtszusammenhang verständlich und körperlich konkret wieder; die Beziehung „meiner Mutter“ bleibt ausdrücklich erhalten.
- source_word: וְעָרֹם אָשׁוּב שָׁמָה
  choice: und nackt werde ich dorthin zurückkehren
  rationale: Die Voranstellung von „nackt“ erhält den hebräischen Nachdruck. „Dorthin“ gibt שָׁמָּה wieder, ohne das im Text nicht ausdrücklich genannte Ziel als Erde, Grab oder Mutterleib festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als Eigenname wahrt das im hebräischen Text verwendete Tetragramm, statt es durch einen Titel zu ersetzen.
- source_word: נָתַן
  choice: hat gegeben
  rationale: Das Perfekt bezeichnet eine vollzogene Handlung; die deutsche Perfektform bildet mit dem folgenden Satzglied ein klares, feierliches Gegensatzpaar.
- source_word: לָקָח
  choice: hat genommen
  rationale: „Genommen“ entspricht dem einfachen hebräischen Verb genauer als das stärker deutende „weggenommen“ und ist im Zusammenhang des Verlustes eindeutig.
- source_word: יְהִי
  choice: sei
  rationale: Der deutsche Konjunktiv I gibt den jussivischen Wunsch beziehungsweise Segensspruch knapp und würdig wieder.
- source_word: שֵׁם יְהוָה
  choice: der Name Jahwes
  rationale: Die Genitivverbindung entspricht der hebräischen Konstruktverbindung und klingt im Deutschen natürlich und ehrfürchtig.
- source_word: מְבֹרָךְ
  choice: gesegnet
  rationale: „Gesegnet“ bewahrt die passive Bedeutung und das Wortfeld des Segnens; „gepriesen“ wäre interpretierender.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen unmittelbar. „Jahwe“ bewahrt ihn als persönlichen Namen; die traditionelle Ersetzung durch „der HERR“ wird in einer Fußnote kenntlich gemacht.
- issue: Bezug von שָׁמָּה („dorthin“)
  choice: Die unbestimmte Ortsangabe bleibt erhalten.
  alternative: „zur Erde“, „ins Grab“ oder bildlich „in den Mutterleib“
  rationale: Der hebräische Text bestimmt das Ziel der Rückkehr nicht ausdrücklich. Die wörtliche Ortsangabe bewahrt die mögliche Spannung zwischen Herkunftsort, Erde beziehungsweise Grab und dem Zustand völliger Besitzlosigkeit.
- issue: Gottes Handeln im Verlust
  choice: „Jahwe hat genommen“
  alternative: „Jahwe hat weggenommen“
  rationale: Die schlichte Formulierung spiegelt Jobs Aussage, ohne zusätzlich zu erklären, auf welche Weise Gott den Verlust bewirkt hat. So wird die theologische Spannung des Zusammenhangs nicht geglättet.
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem, knappem Satzrhythmus. Die Wiederholungen „nackt“ und „Jahwe“ sowie der Segensspruch bleiben als prägende rhetorische Elemente erhalten.
