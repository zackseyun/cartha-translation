base_translation:
  language: en
  yaml_path: translation/ot/job/001/010.yaml
  text: Have you not put a hedge around him and around his house and around all that he has[a], on every side? You have blessed the work of his hands[b], and his livestock has spread throughout the land.
translation:
  language: de
  text: Hast du nicht um ihn, um sein Haus und um alles, was ihm gehört, ringsum einen Zaun gezogen?[a] Das Werk seiner Hände hast du gesegnet, und sein Vieh hat sich im Land ausgebreitet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier das Bild einer schützenden Einfriedung; auch: „ihn … ringsum eingezäunt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Verb bezeichnet ein Hervorbrechen oder Sich-Ausbreiten und kann hier auch bedeuten: „hat im Land stark zugenommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂכְתָּ
  choice: mit einem Schutzwall umgeben
  rationale: Die Wiedergabe bewahrt das konkrete Bild einer schützenden Einfriedung und klingt zugleich in modernem Deutsch natürlich.
- source_word: בַעֲדוֹ / וּבְעַד בֵּיתוֹ / וּבְעַד כָּל אֲשֶׁר לוֹ מִסָּבִיב
  choice: ihn, sein Haus und alles, was ihm gehört, ringsum
  rationale: Die Formulierung erfasst sowohl die dreifache Zuordnung als auch die allseitige, schützende Umschließung.
- source_word: מַעֲשֵׂה יָדָיו
  choice: das Werk seiner Hände
  rationale: Die im Deutschen verständliche Körperteilmetapher für Hiobs Arbeit und produktive Tätigkeit bleibt erhalten.
- source_word: בֵּרַכְתָּ
  choice: hast du gesegnet
  rationale: Das Verb wird nicht auf wirtschaftlichen Erfolg reduziert; die ausdrückliche Zuschreibung göttlichen Segens bleibt bestehen.
- source_word: מִקְנֵהוּ
  choice: sein Vieh
  rationale: Der Ausdruck bezeichnet hier Hiobs Tierbestand beziehungsweise seine Herden; „Vieh“ ist breit, knapp und geläufig.
- source_word: פָּרַץ בָּאָרֶץ
  choice: hat sich im Land weithin ausgebreitet
  rationale: Die Formulierung bewahrt die dynamische Vorstellung des Hervorbrechens und der räumlich sichtbaren Ausdehnung, ohne im Deutschen befremdlich zu wirken.
- source_word: הֲלֹא
  choice: Hast du nicht
  rationale: Die rhetorische Frage und der darin liegende Vorwurf des Sprechers werden direkt beibehalten.
theological_decisions:
- issue: Segenssprache oder bloße Beschreibung materiellen Erfolgs
  choice: Das Werk seiner Hände hast du gesegnet
  alternative: Das Werk seiner Hände hast du gedeihen lassen
  rationale: „Gesegnet“ bewahrt die ausdrückliche theologische Aussage, dass Hiobs Erfolg auf Gottes Segen zurückgeht.
- issue: Konkretes Schutzbild oder abstrakte Schutzbehauptung
  choice: mit einem Schutzwall umgeben
  alternative: beschützt
  rationale: Das konkrete Bild der allseitigen Einfriedung bleibt erhalten und wird nicht zu einer abstrakten Aussage verflacht.
- issue: Bedeutung von פָּרַץ bei Hiobs Viehbestand
  choice: hat sich im Land weithin ausgebreitet
  alternative: hat sich im Land stark vermehrt
  rationale: Die gewählte Fassung wahrt die Spannung zwischen zahlenmäßiger Zunahme und räumlicher Ausbreitung und erhält die dynamische Bildkraft des Verbs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Schutzwall gibt die konkrete Einfriedungsmetapher verständlich wieder; die rhetorische Frage bleibt unverändert. Die dynamische und teilweise mehrdeutige Aussage über die Ausbreitung beziehungsweise Vermehrung des Viehs wird im Text und in der Fußnote bewahrt.
