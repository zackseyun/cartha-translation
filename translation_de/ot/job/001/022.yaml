  source_fidelity: 'Die Übersetzung gibt die beiden hebräischen Aussagen präzise wieder: Hiob sündigt angesichts des ganzen Geschehens nicht und schreibt Gott keine תִּפְלָה zu. „Bei all dem“ entspricht בְּכָל זֹאת idiomatisch und umfassend. Die Konstruktion „schrieb Gott … zu“ bildet die Bedeutung von וְלֹא נָתַן … לֵאלֹהִים angemessen ab.'
