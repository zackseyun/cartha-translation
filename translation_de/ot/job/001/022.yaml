id: JOB.1.22
reference: Job 1:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/כָל זֹ֖את לֹא חָטָ֣א אִיּ֑וֹב וְ/לֹא נָתַ֥ן תִּפְלָ֖ה לֵ/אלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/022.yaml
  text: In all this[a], Job did not sin, nor did he charge God with wrongdoing.
translation:
  language: de
  text: Bei all dem sündigte Hiob nicht und schrieb Gott nichts Verkehrtes[a] zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und legte Gott keine Torheit zur Last“ oder „und schrieb Gott nichts Ungehöriges zu“.'
    reason: Lexikalische Alternativen für das seltene תִּפְלָה und die damit verbundene Konstruktion.
lexical_decisions:
- source_word: בְּכָל זֹאת
  choice: Bei all dem
  rationale: Die Wendung umfasst die Gesamtheit der zuvor geschilderten Ereignisse und klingt im heutigen Deutsch natürlich.
- source_word: לֹא חָטָא
  choice: sündigte nicht
  rationale: חטא ist das übliche Verb für „sündigen“; die ausdrücklich religiös-moralische Aussage wird nicht zu einem allgemeinen „tat nichts Falsches“ abgeschwächt.
- source_word: אִיּוֹב
  choice: Hiob
  rationale: Verwendet die im Deutschen etablierte Form des Personennamens.
- source_word: וְלֹא נָתַן
  choice: und schrieb … nichts … zu
  rationale: נתן bedeutet wörtlich „geben“, bildet hier aber mit תִּפְלָה und dem indirekten Objekt eine idiomatische Aussage über das Zuschreiben beziehungsweise Anlasten.
- source_word: תִּפְלָה
  choice: Verkehrtes
  rationale: Das seltene Wort bezeichnet etwas Törichtes, Ungehöriges oder moralisch Anstößiges. „Verkehrtes“ wahrt die moralische Tragweite, ohne die lexikalische Breite unnötig auf eindeutiges „Unrecht“ zu verengen.
- source_word: לֵאלֹהִים
  choice: Gott
  rationale: ל kennzeichnet hier den Empfänger der Zuschreibung; אֱלֹהִים wird im Kontext schlicht mit „Gott“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von תִּפְלָה in der Aussage über Gott
  choice: Hiob schrieb Gott nichts Verkehrtes zu
  alternative: Hiob legte Gott keine Torheit zur Last; Hiob schrieb Gott nichts Ungehöriges zu
  rationale: Die Formulierung hält fest, dass Hiob Gott angesichts seines Leidens nichts Tadelnswertes zuschrieb. Zugleich wird das seltene תִּפְלָה nicht ausschließlich als moralisches Unrecht oder als intellektuelle Torheit festgelegt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe Satzstruktur des Hebräischen bleibt erhalten; „Bei all dem“ knüpft unmittelbar an die zuvor geschilderten Verluste an.
