lexical_decisions:
- source_word: וַיִּוָּלְדוּ
  choice: wurden … geboren
  rationale: Der Narrativform mit Niphal von ילד entspricht eine passive Geburtsformel. „Wurden geboren“ gibt diese Bedeutung natürlich und präzise wieder.
- source_word: לוֹ
  choice: ihm
  rationale: Die Präposition ל mit Suffix bezeichnet hier in der Geburtsformel die Zuordnung zum Vater. Das deutsche „ihm wurden … geboren“ bewahrt diese Relation in gehobener, aber verständlicher Sprache.
- source_word: שִׁבְעָה בָנִים
  choice: sieben Söhne
  rationale: Die Kardinalzahl und die ausdrücklich männliche Verwandtschaftsbezeichnung werden genau wiedergegeben.
- source_word: וְשָׁלֹשׁ בָּנוֹת
  choice: und drei Töchter
  rationale: Die koordinierende Konjunktion, die Kardinalzahl und die ausdrücklich weibliche Verwandtschaftsbezeichnung werden genau wiedergegeben.
theological_decisions: []
