  yaml_path: translation/ot/job/001/014.yaml
  text: And a messenger came to Job and said[a], “The oxen were plowing, and the donkeys were grazing beside them,”
translation:
  language: de
  text: 'Und ein Bote kam zu Hiob und sagte: »Die Rinder waren beim Pflügen, und die Eselinnen weideten neben ihnen,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאָךְ
  choice: Und ein Bote
  rationale: מַלְאָךְ kann einen menschlichen Boten oder einen Engel bezeichnen. Hier berichtet ein menschlicher Überbringer von einem Unglück; daher passt »Bote« zum Kontext. Das וּ wird mit »Und« wiedergegeben.
- source_word: בָּא אֶל אִיּוֹב
  choice: kam zu Hiob
  rationale: בוא bezeichnet das Kommen, und אֶל gibt die Richtung auf eine Person hin an. »Kam zu Hiob« ist im modernen Deutschen natürlich.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die Verbform führt die Erzählung fort. Das grammatische Geschlecht des Boten macht ein zusätzliches Pronomen im Deutschen unnötig.
- source_word: הַבָּקָר
  choice: Die Rinder
  rationale: בָּקָר bezeichnet Rinder beziehungsweise Großvieh. Da sie pflügen, sind Arbeitstiere gemeint; »Rinder« bleibt dabei näher am Umfang des hebräischen Sammelbegriffs als die engeren Alternativen »Ochsen« oder »Zugochsen«.
- source_word: הָיוּ חֹרְשׁוֹת
  choice: waren beim Pflügen
  rationale: Die Verbindung aus הָיוּ und Partizip stellt die Handlung als gerade andauernd dar. »Waren beim Pflügen« gibt diesen Verlauf idiomatisch wieder.
- source_word: וְהָאֲתֹנוֹת
  choice: und die Eselinnen
  rationale: אֲתֹנוֹת bezeichnet ausdrücklich weibliche Esel. »Eselinnen« bewahrt diese lexikalische Einzelheit knapp und natürlich, sodass keine Fußnote nötig ist.
- source_word: רֹעוֹת
  choice: weideten
  rationale: רעה bezeichnet hier das Fressen beziehungsweise Weiden von Tieren. »Weideten« ist im Zusammenhang präzise und gut verständlich.
- source_word: עַל יְדֵיהֶם
  choice: neben ihnen
  rationale: Die wörtlich körperbezogene Wendung bezeichnet hier räumliche Nähe. »Neben ihnen« gibt die idiomatische Bedeutung klar wieder.
