id: JOB.1.1
reference: Job 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִ֛ישׁ הָיָ֥ה בְ/אֶֽרֶץ ע֖וּץ אִיּ֣וֹב שְׁמ֑/וֹ וְ/הָיָ֣ה הָ/אִ֣ישׁ הַ/ה֗וּא תָּ֧ם וְ/יָשָׁ֛ר וִ/ירֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/001.yaml
  text: There was a man in the land of Uz whose name was Job[a], and that man was blameless and upright, fearing God and turning away from evil.
translation:
  language: de
  text: Im Land Uz lebte ein Mann namens Hiob. Dieser Mann war untadelig und rechtschaffen; er fürchtete Gott und hielt sich vom Bösen fern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wich dem Bösen aus. Das hebräische Verb kann bedeuten, sich vom Bösen abzuwenden, davon abzuweichen oder es zu meiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָיָה
  choice: Im Land Uz lebte ein Mann
  rationale: Die deutsche Existenzaussage mit »lebte« eröffnet die Erzählung natürlich und gibt den männlichen Singular von אִישׁ wieder, ohne zusätzliche inhaltliche Nuancen einzuführen.
- source_word: בְאֶרֶץ עוּץ
  choice: im Land Uz
  rationale: »Land« entspricht der geografischen Bedeutung von אֶרֶץ; »Uz« wird als Ortsname transliteriert.
- source_word: אִיּוֹב שְׁמוֹ
  choice: namens Hiob
  rationale: Die knappe deutsche Namensformel gibt die Identifizierung natürlich wieder. »Hiob« ist die im Deutschen etablierte Form des Personennamens.
- source_word: וְהָיָה הָאִישׁ הַהוּא
  choice: Dieser Mann war
  rationale: »Dieser Mann« nimmt die zuvor eingeführte Person wieder auf und bewahrt die demonstrative Kraft von הַהוּא.
- source_word: תָּם
  choice: untadelig
  rationale: Das Wort bezeichnet hier unversehrte moralische Integrität, nicht notwendigerweise absolute Sündlosigkeit. »Untadelig« bewahrt das starke Lob, ohne Vollkommenheit ausdrücklich zu behaupten.
- source_word: יָשָׁר
  choice: rechtschaffen
  rationale: Das Adjektiv bezeichnet ethische Geradheit. »Rechtschaffen« ist im modernen Deutschen verständlich und passt als Charakterbeschreibung zu »untadelig«.
- source_word: וִירֵא אֱלֹהִים
  choice: er fürchtete Gott
  rationale: Die Wendung bezeichnet ehrfürchtige Gottesfurcht. Der Kontext verlangt trotz der formal pluralischen Gestalt von אֱלֹהִים den singularischen Bezug »Gott«.
- source_word: וְסָר מֵרָע
  choice: und hielt sich vom Bösen fern
  rationale: Die Formulierung drückt die fortgesetzte Abkehr und Vermeidung des Bösen idiomatisch aus; die mögliche Bildnuance des Ausweichens wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung der moralischen Beschreibung Hiobs
  choice: Hiob wird als untadelig und rechtschaffen, also als Mann von moralischer Integrität, beschrieben.
  alternative: Hiob wird als absolut sündlos oder moralisch vollkommen bezeichnet.
  rationale: תָּם und יָשָׁר sprechen im weisheitlichen Zusammenhang ein starkes moralisches Lob aus, verlangen aber nicht die Aussage absoluter Sündlosigkeit.
- issue: Referent von אֱלֹהִים
  choice: Gott
  alternative: Götter
  rationale: Die feste Wendung der Gottesfurcht und der Erzählzusammenhang weisen auf einen singularischen Referenten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die geläufigen deutschen Namenformen »Uz« und »Hiob« werden verwendet. Der erste hebräische Satz wird zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert; die wiederaufnehmende Struktur bleibt durch »Dieser Mann« erhalten.
