  text: אִם יַזְקִ֣ין בָּ/אָ֣רֶץ שָׁרְשׁ֑/וֹ וּ֝/בֶ/עָפָ֗ר יָמ֥וּת גִּזְעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/008.yaml
  text: Though its root grows old in the earth[a], and its stump dies in the dust[b],
translation:
  language: de
  text: Auch wenn seine Wurzel in der Erde alt wird[a] und sein Stumpf im Staub abstirbt[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn seine Wurzel in der Erde alt wird.“ Die hebräische Partikel kann eine Bedingung ausdrücken; im Zusammenhang des Baumvergleichs ist hier wahrscheinlich ein einräumender Sinn gemeint.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „sein Stock“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Auch wenn
  rationale: Die Partikel kann konditional („wenn“) gebraucht werden; im Zusammenhang des Baumvergleichs hat sie hier wahrscheinlich konzessiven Sinn. „Auch wenn“ bewahrt den möglichen Bedingungscharakter besser als ein rein behauptendes „obwohl“ und führt natürlich zu der Hoffnung in Vers 9.
- source_word: יַזְקִין
  choice: alt wird
  rationale: Die Verbform bezeichnet das Altwerden. „Alt wird“ ist direkt, natürlich und erhält den prozesshaften Sinn.
- source_word: בָּאָרֶץ
  choice: in der Erde
  rationale: Im botanischen Bild bezeichnet אֶרֶץ die Erde beziehungsweise den Erdboden. „Erde“ klingt poetisch, bleibt allgemein verständlich und bildet eine passende Parallele zu „Staub“.
- source_word: שָׁרְשׁוֹ
  choice: seine Wurzel
  rationale: Der hebräische Singular mit Suffix wird als poetischer Kollektivsingular beibehalten.
- source_word: וּבֶעָפָר
  choice: und im Staub
  rationale: עָפָר bedeutet gewöhnlich „Staub“ oder lockere Erde. „Staub“ erhält den poetischen Klang und die im Buch Hiob mitschwingende Verbindung mit Sterblichkeit.
- source_word: יָמוּת
  choice: abstirbt
  rationale: Das Verb bedeutet wörtlich „stirbt“. Beim Stumpf eines Baumes ist „abstirbt“ im Deutschen idiomatischer, ohne das Bild durch „verdorrt“ oder Ähnliches zu erweitern.
- source_word: גִּזְעוֹ
  choice: sein Stumpf
  rationale: גֵּזַע bezeichnet hier den verbleibenden Stumpf beziehungsweise Stock eines gefällten Baumes. „Stumpf“ passt am klarsten zum Kontext.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die Wortstellung bleibt gut verständlich und bewahrt den Parallelismus von „in der Erde“ und „im Staub“. Der Vers endet mit einem Komma, da der Gedanke in Vers 9 weitergeführt wird.
