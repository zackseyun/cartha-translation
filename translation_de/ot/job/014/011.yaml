  text: אָֽזְלוּ מַ֭יִם מִנִּי יָ֑ם וְ֝/נָהָ֗ר יֶחֱרַ֥ב וְ/יָבֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/011.yaml
  text: As waters disappear from the sea, and a river dries up and withers,
translation:
  language: de
  text: Wie Wasser aus dem Meer schwindet und ein Fluss versiegt und austrocknet,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְלוּ
  choice: schwindet
  rationale: Das Verb bezeichnet hier das Verschwinden beziehungsweise Zurückgehen des Wassers; „schwinden“ gibt das Bild natürlich und prägnant wieder.
- source_word: יָם
  choice: See
  rationale: יָם kann „Meer“ oder ein größeres Binnengewässer bezeichnen. Im Parallelismus mit einem versiegenden Fluss passt „See“ als natürliches Bild eines austrocknenden Gewässers, ohne die Grundbedeutung zu überdehnen.
- source_word: נָהָר
  choice: Fluss
  rationale: Die übliche und kontextgerechte Bedeutung ist „Fluss“ beziehungsweise dauerhafter Wasserlauf.
- source_word: יֶחֱרַב
  choice: versiegt
  rationale: Das Verb beschreibt das Trockenwerden eines Gewässers; idiomatisches Deutsch sagt von einem Fluss, dass er „versiegt“.
- source_word: וְיָבֵשׁ
  choice: und austrocknet
  rationale: Die zusätzliche Verbform wird beibehalten und nicht mit יֶחֱרַב verschmolzen; so bleibt die verstärkende Doppelung des Hebräischen hörbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als einleitender Vergleich syntaktisch offen und endet daher mit einem Komma. Die hebräische Doppelung „versiegt und austrocknet“ wird trotz ihrer Nähe im Deutschen bewahrt.
