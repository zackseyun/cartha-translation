  text: יִכְבְּד֣וּ בָ֭נָי/ו וְ/לֹ֣א יֵדָ֑ע וְ֝/יִצְעֲר֗וּ וְֽ/לֹא יָבִ֥ין לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/021.yaml
  text: His sons come to honor[a], and he does not know it; they are brought low, and he does not perceive it.
translation:
  language: de
  text: Kommen seine Söhne zu Ehren[a], weiß er es nicht; werden sie gering, nimmt er es nicht wahr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seine Söhne werden geehrt, und er weiß es nicht; sie werden gering, und er erkennt es nicht an ihnen.“'
    reason: 'Lexikalische Alternative: Die Verben können stärker als Zustandsveränderung beziehungsweise als passivisches Ergebnis verstanden werden. Das abschließende „an ihnen“ macht den möglichen Bezug von לָמוֹ auf die Söhne ausdrücklich.'
lexical_decisions:
- source_word: יִכְבְּדוּ
  choice: gelangen zu Ansehen
  rationale: Das Qal von כבד bezeichnet hier, dass die Söhne an Gewicht beziehungsweise Ansehen gewinnen. Die deutsche Formulierung gibt diesen resultativen Sinn natürlich wieder.
- source_word: בָנָיו
  choice: seine Söhne
  rationale: Das hebräische maskuline Pluralnomen mit Suffix der 3. Person Singular bezeichnet ausdrücklich seine Söhne.
- source_word: וְלֹא יֵדָע
  choice: weiß er nichts davon
  rationale: ידע bedeutet „wissen/kennen“. „Davon“ nimmt im Deutschen den zuvor beschriebenen Umstand idiomatisch auf.
- source_word: וְיִצְעֲרוּ
  choice: werden sie gering
  rationale: צער bezeichnet hier das Geringwerden beziehungsweise den Verlust an Bedeutung und bildet den Gegensatz zum Erlangen von Ansehen.
- source_word: וְלֹא יָבִין לָמוֹ
  choice: nimmt er es nicht wahr
  rationale: בין kann „verstehen“, „unterscheiden“ oder „wahrnehmen“ bedeuten. Im Kontext steht die fehlende Kenntnis vom Ergehen der Söhne im Vordergrund; das deutsche Pronomen nimmt dieses Ergehen auf, während לָמוֹ den Bezug auf sie stützt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des Hebräischen und der Gegensatz zwischen Ansehen und Geringwerden bleiben erhalten.
