  text: וְ/אִ֥ישׁ שָׁכַ֗ב וְֽ/לֹא יָ֫ק֥וּם עַד בִּלְתִּ֣י שָׁ֭מַיִם לֹ֣א יָקִ֑יצוּ וְ/לֹֽא יֵ֝עֹ֗רוּ מִ/שְּׁנָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/012.yaml
  text: So a man lies down and does not rise[a]; until the heavens are no more[b], they will not awake or be roused from their sleep.
translation:
  language: de
  text: So legt sich ein Mann nieder und steht nicht auf. Bis der Himmel nicht mehr besteht,[a] werden sie nicht erwachen und nicht aus ihrem Schlaf geweckt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis keine Himmel mehr sind“. Die hebräische Wendung bezeichnet im Zusammenhang einen praktisch unerreichbaren Endpunkt.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Vers beschreibt den Tod bildhaft als Schlaf: Die Toten „erwachen“ nicht und werden nicht „geweckt“.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ
  choice: So … ein Mann
  rationale: אִישׁ bezeichnet hier im repräsentativen Singular einen Mann; die Form wird nicht zu „Mensch“ oder „Person“ neutralisiert. Das וְ verbindet den Satz folgernd mit dem vorherigen Vergleich und wird deshalb kontextgemäß mit „So“ wiedergegeben.
- source_word: שָׁכַב
  choice: legt sich … nieder
  rationale: Das Verb bedeutet „sich hinlegen“ und dient hier als Bild für den Tod. Die Übersetzung bewahrt dieses Bild, statt ausdrücklich „stirbt“ zu sagen.
- source_word: וְלֹא יָקוּם
  choice: und steht nicht auf
  rationale: קום bedeutet „aufstehen, sich erheben“. Die knappe Wiedergabe erhält sowohl das Bild als auch seine mögliche Auferstehungsresonanz, ohne diese lehrhaft auszudeuten.
- source_word: עַד בִּלְתִּי שָׁמַיִם
  choice: Bis der Himmel nicht mehr ist
  rationale: Die ungewöhnliche Wendung bezeichnet den Zeitpunkt, an dem der Himmel nicht mehr besteht, und setzt damit im Zusammenhang einen praktisch unerreichbaren Endpunkt. Obwohl שָׁמַיִם formal pluralisch ist, entspricht der deutsche Singular „der Himmel“ dem natürlichen Sprachgebrauch.
- source_word: לֹא יָקִיצוּ
  choice: werden sie nicht erwachen
  rationale: Das Verb bedeutet „erwachen“ und steht im Plural. Die Übersetzung vollzieht den hebräischen Wechsel vom repräsentativen Singular „ein Mann“ zum Plural der Toten nach.
- source_word: וְלֹא יֵעֹרוּ
  choice: und nicht … aufgerüttelt werden
  rationale: Die Niphalform bezeichnet das Aufgeweckt- oder Aufgerütteltwerden. „Aufgerüttelt“ erhält die passive Bedeutung und verstärkt poetisch das vorausgehende „erwachen“.
- source_word: מִשְּׁנָתָם
  choice: aus ihrem Schlaf
  rationale: „Schlaf“ ist die schlichte Bedeutung des Nomens und führt das Todesbild fort; das Possessivpronomen entspricht den vorangehenden Pluralformen.
theological_decisions:
- issue: Ob das Todesbild als Vernichtung oder als Verneinung einer künftigen Auferstehung auszudeuten ist
  choice: Das Bild vom Niederlegen, Aufstehen, Erwachen und Schlaf bleibt ohne dogmatische Erweiterung erhalten.
  alternative: Ausdrücklich „stirbt und lebt nicht wieder“ sagen oder den Vers als unmittelbare Aussage über die endgültige Auferstehung formulieren.
  rationale: Der poetische Vers spricht aus Hiobs Perspektive und wahrt eine Spannung, die im weiteren biblischen Zeugnis nicht durch eine erklärende Übersetzung dieses Einzelverses aufgelöst werden sollte.
- issue: Wiedergabe des repräsentativen אִישׁ
  choice: ein Mann
  alternative: ein Mensch; eine Person
  rationale: Der hebräische Text verwendet ausdrücklich den maskulinen Singular אִישׁ. „Ein Mann“ bildet diese Form genau ab, auch wenn die Aussage die menschliche Sterblichkeit allgemein behandelt.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bewahrter poetischer Bildwelt. Der Wechsel vom Singular „ein Mann“ zum Plural „sie“ folgt dem hebräischen Text, auch wenn er im Deutschen auffällt. Die beiden Fußnotenmarker stehen jeweils unmittelbar bei der Aussage, die sie erläutern.
