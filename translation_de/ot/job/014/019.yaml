review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbilder und die direkte Anrede an Gott sind zutreffend wiedergegeben. Die Zuordnung des seltenen סְפִיחֶיהָ zu „seine Fluten“ bleibt jedoch unsicher und ist im Deutschen zudem referenziell missverständlich: Das maskuline Possessivpronomen kann sich grammatisch auf „Wasser“ beziehen, während der hebräische Suffix feminin ist und die genaue Bezugsgröße bzw. Bedeutung umstritten ist. Eine weniger festlegende Formulierung mit Fußnote wahrt die Unsicherheit besser.'
  naturalness: „Wasser schleift Steine ab“ und „den Erdboden fortspülen“ sind modernes, natürliches Deutsch. „Seine Fluten“ ist zwar verständlich, wirkt aber wegen des Bezugs auf das singuläre Neutrum „Wasser“ und der seltenen hebräischen Form unnötig bestimmt. „Seine Auswaschungen“ ist im Deutschen ebenfalls nicht idiomatisch.
  terminology: „Hoffnung des Menschen“ gibt den repräsentativen Singular אֱנוֹשׁ angemessen wieder; „vernichtest du“ gibt den Hifil von אבד klar wieder. „Erdboden“ ist im Erosionsbild vertretbar, auch wenn „Staub der Erde“ wörtlicher wäre.
  issues:
  - severity: medium
    issue: Das unsichere סְפִיחֶיהָ wird mit „seine Fluten“ zu bestimmt und mit potenziell irreführendem Possessivbezug wiedergegeben.
    rationale: Das Wort ist selten und seine Bedeutung wie auch der Bezug des femininen Suffixes sind strittig. Eine Konstruktion ohne Possessivpronomen („Wasser spült die Erde mit seinen Auswaschungen fort“) wäre weiterhin semantisch zu eng und stilistisch schwach. Die Satzstruktur kann die Unsicherheit besser bewahren, indem die problematische Einheit als „was es ausspült“ paraphrasiert und mit einer Fußnote als unsichere Wiedergabe gekennzeichnet wird.
  revised_text: Wasser schleift Steine ab; es spült fort, was aus der Erde hervorkommt. So vernichtest du die Hoffnung des Menschen.[a]
  revised_footnotes:
  - marker: a
    text: 'Der hebräische Text ist im mittleren Satzglied unsicher. Wörtlich etwa: „seine/ihre sᵉfîḥîm, Staub der Erde“. Das seltene Wort kann möglicherweise „Auswaschungen“, „Ausströmungen“ oder „was hervorsprießt“ bedeuten; deshalb sind auch Deutungen wie „Wasserfluten spülen den Staub der Erde fort“ möglich.'
    reason: lexical_alternative
  revision_rationale: Die Überarbeitung soll die lexikalische und syntaktische Unsicherheit von סְפִיחֶיהָ sichtbar halten und vermeidet zugleich die im Deutschen missverständliche Formulierung „seine Fluten“. Die gewählte Paraphrase ist als Lesart möglich, darf aber wegen der weitreichenden Umstellung nicht als sichere Übersetzung im Haupttext stehen. Daher ist menschliche Prüfung erforderlich.
