source:
  edition: WLC
  text: אֲבָנִ֤ים שָׁ֥חֲקוּ מַ֗יִם תִּשְׁטֹֽף סְפִיחֶ֥י/הָ עֲפַר אָ֑רֶץ וְ/תִקְוַ֖ת אֱנ֣וֹשׁ הֶאֱבַֽדְתָּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/019.yaml
  text: Water wears away stones[a]; its torrents wash away the soil of the earth; so you destroy the hope of man.
translation:
  language: de
  text: Wasser schleift Steine ab; seine Fluten[a] spülen den Erdboden fort. So vernichtest du die Hoffnung des Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „seine Fluten“ wiedergegebene hebräische Wort ist selten und in seiner Bedeutung unsicher. Möglich sind auch „seine Ausströmungen“, „seine Spülungen“ oder vielleicht „was daraus hervorsprießt“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים
  choice: Steine
  rationale: Die gewöhnliche Pluralbezeichnung passt zum poetischen Bild der Abtragung durch Wasser.
- source_word: שָׁחֲקוּ
  choice: schleift … ab
  rationale: Das Verb bezeichnet Abreiben oder allmähliches Zermürben; die deutsche Wendung gibt den Erosionsvorgang anschaulich und natürlich wieder.
- source_word: מַיִם
  choice: Wasser
  rationale: Obwohl die hebräische Form morphologisch pluralisch ist, bezeichnet sie gewöhnlich Wasser als Stoff; der deutsche Singular ist idiomatisch.
- source_word: תִּשְׁטֹף
  choice: spülen … fort
  rationale: Das Verb kann Wegspülen oder Überschwemmen bezeichnen; im Zusammenhang der Erosion ist „fortspülen“ treffend.
- source_word: סְפִיחֶיהָ
  choice: seine Fluten
  rationale: Das seltene und unsichere Wort wird im erosiven Kontext als ausströmende oder reißende Wassermassen verstanden. Die Unsicherheit wird in einer Fußnote bewahrt.
- source_word: עֲפַר אָרֶץ
  choice: den Erdboden
  rationale: Wörtlich steht „Staub der Erde/des Landes“. Im Zusammenhang bezeichnet es lockeres Erdmaterial; „Erdboden“ ist verständlich und erhält das Bild.
- source_word: וְתִקְוַת אֱנוֹשׁ
  choice: die Hoffnung des Menschen
  rationale: אֱנוֹשׁ bezeichnet den sterblichen, gebrechlichen Menschen im repräsentativen Singular. „des Menschen“ bewahrt Zahl und Aussage, ohne unnötig geschlechtsspezifisch zu wirken.
- source_word: הֶאֱבַדְתָּ
  choice: vernichtest du
  rationale: Der Hifil von אבד bedeutet zugrunde richten oder vernichten. Die direkte Anrede Gottes bleibt erhalten.
theological_decisions:
- issue: Direkte Anrede Gottes im Schlusssatz
  choice: So vernichtest du die Hoffnung des Menschen.
  alternative: Und die Hoffnung des Menschen vernichtest du.
  rationale: Die Verbform der zweiten Person Singular richtet sich eindeutig an Gott. „So“ macht den im poetischen Zusammenhang naheliegenden Vergleich sichtbar, ohne die theologische Spannung von Ijobs Aussage abzuschwächen.
- issue: Wiedergabe von אֱנוֹשׁ
  choice: des Menschen
  alternative: eines Sterblichen
  rationale: Der hebräische Ausdruck betont menschliche Sterblichkeit und Gebrechlichkeit. „des Menschen“ bewahrt den repräsentativen Singular und klingt im Deutschen natürlich; „eines Sterblichen“ wäre expliziter, aber interpretierender.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper poetischer Bildfolge. Das Semikolon hält die beiden Naturbilder zusammen; der abschließende Satz wahrt die direkte, spannungsvolle Anrede an Gott.
