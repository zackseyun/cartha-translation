  text: אַף עַל זֶ֭ה פָּקַ֣חְתָּ עֵינֶ֑/ךָ וְ/אֹ֘תִ֤/י תָבִ֖יא בְ/מִשְׁפָּ֣ט עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/003.yaml
  text: Yet on such a one you open your eyes[a], and you bring me into judgment with you.
translation:
  language: de
  text: Doch selbst auf einen solchen richtest du deine Augen und bringst mich mit dir ins Gericht[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor dich zum Gericht« beziehungsweise »gegen dich in einen Rechtsstreit«. Wörtlich steht im Hebräischen »mit dir«.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  choice: Doch selbst
  rationale: 'Die Partikel wirkt hier zugleich verstärkend und adversativ: Trotz der zuvor geschilderten menschlichen Vergänglichkeit nimmt Gott den Menschen ins prüfende Auge.'
- source_word: עַל זֶה
  choice: auf einen solchen
  rationale: Wörtlich steht »auf diesen«. Im Zusammenhang verweist der Ausdruck auf den vergänglichen Menschen aus den Versen 1–2; »auf einen solchen« macht diesen Rückbezug im Deutschen verständlich, ohne ihn unnötig auszudeuten.
- source_word: פָּקַחְתָּ עֵינֶךָ
  choice: richtest du deine Augen
  rationale: Die hebräische Wendung lautet wörtlich »öffnest du deine Augen«. Im Zusammenhang bezeichnet sie Gottes gezielte Aufmerksamkeit oder prüfenden Blick; »richtest du deine Augen« bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: וְאֹתִי
  choice: und bringst mich
  rationale: Das vorangestellte Objektpronomen hebt Hiob persönlich hervor. Die Formulierung bleibt im Deutschen flüssig und bewahrt durch »mich« den persönlichen Nachdruck.
- source_word: תָבִיא
  choice: bringst
  rationale: Der Hifil von בוא bedeutet grundlegend »bringen« beziehungsweise »kommen lassen«. »Bringst« erhält den lexikalischen Kern; »lädst vor« wäre bereits stärker juristisch ausdeutend.
- source_word: בְמִשְׁפָּט
  choice: ins Gericht
  rationale: מִשְׁפָּט bezeichnet hier ein gerichtliches Verfahren oder Urteil. »Ins Gericht bringen« gibt die Rechtsszene idiomatisch und würdig wieder.
- source_word: עִמָּךְ
  choice: mit dir
  rationale: Die Präposition עִם bedeutet regulär »mit«. Im gerichtlichen Zusammenhang kann sie ein Erscheinen vor Gott oder einen Rechtsstreit mit ihm bezeichnen; die wörtlichere Wiedergabe hält diese Spannung offen.
theological_decisions:
- issue: Das durch עִמָּךְ bezeichnete gerichtliche Verhältnis zwischen Hiob und Gott
  choice: mit dir
  alternative: vor dir; gegen dich
  rationale: Der hebräische Wortlaut legt zunächst »mit dir« nahe, lässt im Rechtskontext aber offen, ob Hiob vor Gottes Gericht erscheint oder mit Gott als Prozessgegner in einen Rechtsstreit tritt. Die Übersetzung bewahrt diese theologische und juristische Spannung.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewahrter poetischer Bildsprache. »Einen solchen« stellt den Bezug zum vergänglichen Menschen der vorausgehenden Verse her; »ins Gericht« wahrt den rechtlichen Charakter, ohne die Szene als modernes Gerichtsverfahren zu verengen.
