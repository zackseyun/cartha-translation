  yaml_path: translation/ot/job/014/022.yaml
  text: Surely his flesh on him feels pain[b][a], and his soul on him mourns.
translation:
  language: de
  text: Nur sein Fleisch tut ihm weh[a], und seine Seele trauert in ihm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gewiss, sein Fleisch schmerzt an ihm.“ Das Hebräische ist knapp und idiomatisch: Es wiederholt in beiden Halbversen eine Präposition, die je nach Zusammenhang etwa „an“, „auf“, „über“ oder „in Bezug auf“ bedeuten kann.'
    reason: lexical_alternative
  - marker: b
    text: „Seele“ kann hier auch „Leben“, „Selbst“ oder „inneres Wesen“ bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Doch nur
  rationale: Die Partikel kann einschränkend („nur“) oder bekräftigend („gewiss“) verstanden werden. Im Zusammenhang bildet „doch nur“ einen natürlichen, pointierten Abschluss, ohne die Mehrdeutigkeit zu verschweigen.
- source_word: בְּשָׂרוֹ
  choice: sein Fleisch
  rationale: Die konkrete hebräische Bildsprache wird gegenüber dem deutenderen „sein Körper“ bewahrt.
- source_word: עָלָיו
  choice: an ihm
  rationale: Das ungewöhnliche, in beiden Halbversen wiederholte עָלָיו wird möglichst eng und im Deutschen noch verständlich wiedergegeben.
- source_word: יִכְאָב
  choice: leidet Schmerz
  rationale: Das Verb bezeichnet körperliches Schmerzempfinden; die Formulierung ist würdevoll und lässt die Art des Schmerzes offen.
- source_word: נַפְשׁוֹ
  choice: seine Seele
  rationale: „Seele“ bewahrt im Parallelismus mit „Fleisch“ die poetische Spannung; נֶפֶשׁ kann zugleich Leben, Selbst oder inneres Wesen bezeichnen.
- source_word: תֶּאֱבָל
  choice: trauert
  rationale: Das Verb bezeichnet Trauern oder Klagen; „trauert“ ist knapp, natürlich und poetisch angemessen.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ neben „Fleisch“
  choice: Seele
  alternative: Leben; Selbst; inneres Wesen
  rationale: Die Wiedergabe erhält den poetischen Gegensatz, ohne daraus eine bestimmte Lehre über die Beschaffenheit des Menschen abzuleiten.
- issue: Bezug des Schmerzes und der Trauer nach dem Tod
  choice: Die ungewöhnliche Wendung „an ihm“ wird beibehalten.
  alternative: „in ihm“ oder „um sich selbst“
  rationale: Der hebräische Wortlaut bleibt bewusst spannungsvoll und wird nicht auf eine bestimmte Vorstellung vom Zustand nach dem Tod festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wiederholung „an ihm“ ist absichtlich erhalten, obwohl sie im Deutschen ungewöhnlich klingt; sie spiegelt das zweimalige עָלָיו und vermeidet eine vorschnelle Deutung.
