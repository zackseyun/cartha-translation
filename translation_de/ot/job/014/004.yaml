source:
  edition: WLC
  text: מִֽי יִתֵּ֣ן טָ֭הוֹר מִ/טָּמֵ֗א לֹ֣א אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/004.yaml
  text: Who can bring a clean thing out of an unclean? No one[a].
translation:
  language: de
  text: Wer kann Reines aus Unreinem hervorbringen? Kein Einziger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Nicht einer.“'
    reason: Die hebräische Wendung לֹא אֶחָד ist eine betonte, knappe Verneinung; die Fußnote macht ihre Form sichtbar.
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Fragepronomen eröffnet eine direkte rhetorische Frage; die modale Bedeutung ergibt sich zusammen mit dem Verb und dem Kontext.
- source_word: יִתֵּן
  choice: kann … hervorbringen
  rationale: נתן bedeutet wörtlich „geben“, bezeichnet in dieser Verbindung jedoch das Hervorbringen oder Entstehenlassen. „Kann … hervorbringen“ gibt die idiomatische Bedeutung und die vorausgesetzte Unmöglichkeit natürlich wieder.
- source_word: טָהוֹר
  choice: Reines
  rationale: Das Adjektiv wird substantivisch gebraucht. „Reines“ bewahrt knapp den Gegensatz zwischen rein und unrein, ohne den Bezug näher festzulegen.
- source_word: מִטָּמֵא
  choice: aus Unreinem
  rationale: Die Präposition מִן bezeichnet hier Herkunft oder Ausgangspunkt; auch טָמֵא ist wahrscheinlich substantivisch gebraucht. „Aus Unreinem“ erhält die absichtlich offene Reinheitsaussage.
- source_word: לֹא אֶחָד
  choice: Kein Einziger
  rationale: Die knappe hebräische Antwort bedeutet wörtlich etwa „nicht einer“. „Kein Einziger“ klingt im Deutschen natürlich, bewahrt aber stärker als bloßes „Niemand“ die pointierte Zählform des Originals.
theological_decisions:
- issue: Bezug der Reinheits- und Unreinheitssprache
  choice: Eine allgemein formulierte Aussage darüber, dass Reines nicht aus Unreinem hervorgebracht werden kann, im Kontext auf den Menschen bezogen.
  alternative: Eine ausschließlich auf Geburt von unreinen Eltern bezogene Aussage oder ein eng gefasster Satz über moralische beziehungsweise kultische Unreinheit.
  rationale: Der hebräische Vers ist knapp und sprichwortartig. Die Übersetzung legt nicht fest, ob die Unreinheit moralisch, kultisch, erblich oder existenziell gemeint ist, und bewahrt so die theologische Spannung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, knappem Ton. Die substantivierten Adjektive „Reines“ und „Unreines“ erhalten die Offenheit und Parallelität des Hebräischen; die Satzstellung bleibt natürlich deutsch.
