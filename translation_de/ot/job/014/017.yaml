  variant: modern standard German
source:
  edition: WLC
  text: חָתֻ֣ם בִּ/צְר֣וֹר פִּשְׁעִ֑/י וַ֝/תִּטְפֹּ֗ל עַל עֲוֺנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/017.yaml
  text: My transgression is sealed up in a bag[a], and you cover over my iniquity.
translation:
  language: de
  text: Mein Vergehen ist in einem Beutel versiegelt, und du überdeckst meine Schuld.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du trägst etwas auf meine Schuld auf“, „du nähst meine Schuld zu“ oder „du verschließt meine Schuld zusätzlich“. Das hebräische Verb ist hier schwer zu deuten; das genaue Bild ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתֻם
  choice: ist … versiegelt
  rationale: Das passive Partizip von חתם bezeichnet etwas, das verschlossen und durch ein Siegel gesichert ist; die resultative Passivform bleibt erhalten.
- source_word: בִּצְרוֹר
  choice: in einem Beutel
  rationale: צְרוֹר kann ein verschnürtes Bündel oder einen Beutel bezeichnen. „Beutel“ gibt das konkrete Bild in natürlichem Deutsch wieder.
- source_word: פִּשְׁעִי
  choice: mein Vergehen
  rationale: פֶּשַׁע bezeichnet Übertretung oder Auflehnung. „Vergehen“ ist gewichtig, verständlich und legt den poetischen Kontext nicht unnötig auf offene Rebellion fest.
- source_word: וַתִּטְפֹּל
  choice: du überdeckst
  rationale: Die Bedeutung von טפל ist hier schwierig; vorgeschlagen werden unter anderem auftragen, überziehen, zunähen oder befestigen. „Überdecken“ bewahrt die Vorstellung, dass Hiobs Schuld zusätzlich bedeckt beziehungsweise gesichert wird, ohne die genaue Bildhandlung zu stark festzulegen.
- source_word: עַל
  choice: über
  rationale: Mit טפל bezeichnet עַל wahrscheinlich etwas, das auf oder über etwas anderem angebracht wird.
- source_word: עֲוֺנִי
  choice: meine Schuld
  rationale: עָוֹן kann Schuld, Verfehlung oder deren Folgen meinen. „Schuld“ ist im Deutschen natürlich und hält einen sinnvollen Unterschied zu פֶּשַׁע („Vergehen“) aufrecht, ohne den Begriff ausschließlich auf die Tat einzuengen.
theological_decisions:
- issue: Aussagekraft des Bildes
  choice: Hiob beschreibt Gott als den, der sein Vergehen verwahrt und seine Schuld zur späteren Anrechnung sichert, nicht als den, der sie vergibt.
  alternative: Das Versiegeln und Überdecken könnte als Verbergen oder Beseitigen der Sünde und damit als Bild der Vergebung verstanden werden.
  rationale: Im Zusammenhang der Klage, besonders nach Vers 16, geht es darum, dass Gott Hiobs Verfehlung genau beachtet. Die Übersetzung lässt das Bild selbst stehen und fügt keine ausdrückliche Vergebungsaussage ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bewahrt den poetischen Parallelismus. „Vergehen“ und „Schuld“ sind allgemein verständlich und geben die unterschiedlichen hebräischen Begriffe wieder; die umstrittene zweite Bildhälfte wird durch eine Fußnote offengehalten.
