  text: Denn jetzt zählst du meine Schritte[a]; du achtest nicht auf meine Sünde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zählst du meine Schritte ab“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du behältst meine Sünde nicht im Blick“ oder „du beobachtest meine Sünde nicht“. Im Zusammenhang kann der Satz auch hypothetisch verstanden werden: „du würdest nicht auf meine Sünde achten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Aussage im Zusammenhang begründend oder erläuternd ein; „Denn“ bewahrt diese Verknüpfung.
- source_word: עַתָּה
  choice: jetzt
  rationale: Das Zeitadverb bezeichnet Hiobs gegenwärtige Lage im Gegensatz zu der erhofften Möglichkeit der vorangehenden Verse.
- source_word: צְעָדַי
  choice: meine Schritte
  rationale: Die direkte und im Deutschen natürliche Wiedergabe erhält das Bild, dass Gott jede Bewegung Hiobs zählt.
- source_word: תִּסְפּוֹר
  choice: zählst
  rationale: ספר im Qal bedeutet hier „zählen“ oder „abzählen“; „zählst“ ist präzise und idiomatisch.
- source_word: לֹא
  choice: nicht
  rationale: Die einfache hebräische Verneinung wird unmittelbar wiedergegeben.
- source_word: תִשְׁמוֹר עַל
  choice: wachst über
  rationale: שׁמר mit עַל kann das aufmerksame Beobachten oder Bewachen bezeichnen. „über etwas wachen“ erhält die Beobachtungsnuance, ohne die genaue Beziehung zur Sünde enger festzulegen.
- source_word: חַטָּאתִי
  choice: meine Sünde
  rationale: Der Singular wird bewahrt; er kann hier konkret, kollektiv oder abstrakt verstanden werden.
theological_decisions:
- issue: Bedeutung des verneinten Satzes לֹא תִשְׁמוֹר עַל חַטָּאתִי
  choice: 'Als gegenwärtige Aussage übersetzt: „du wachst nicht über meine Sünde“.'
  alternative: „du würdest nicht über meine Sünde wachen“ oder „du lauerst nicht auf meine Sünde“.
  rationale: Die hebräische Form ist ein negierter Imperfekt und lässt zunächst eine gegenwärtige Aussage zu. Der Zusammenhang kann auch eine hypothetische Fortführung oder das gezielte Aufspüren von Sünde nahelegen. Die Hauptfassung bewahrt die einfache Syntax und löst die Spannung zu den Nachbarversen nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des Hebräischen bleibt erhalten. „Sünde“ steht wie im Ausgangstext im Singular; die mehrdeutige Wendung שׁמר על wird weder harmonisiert noch konfessionell zugespitzt.
