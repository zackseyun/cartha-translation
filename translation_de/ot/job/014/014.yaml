source:
  edition: WLC
  text: אִם יָמ֥וּת גֶּ֗בֶר הֲ/יִ֫חְיֶ֥ה כָּל יְמֵ֣י צְבָאִ֣/י אֲיַחֵ֑ל עַד בּ֝֗וֹא חֲלִיפָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/014.yaml
  text: If a man dies[a], will he live again? All the days of my hard service I would wait, until my relief comes.
translation:
  language: de
  text: Wenn ein Mann stirbt, wird er wieder leben? Alle Tage meines harten Dienstes würde ich warten, bis meine Ablösung[a] kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Veränderung“ oder „meine Erneuerung“. Das hebräische Wort kann einen Wechsel, eine Ablösung oder eine Erneuerung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָמוּת גֶּבֶר
  choice: Wenn ein Mann stirbt
  rationale: „Wenn“ gibt die allgemeine Bedingung idiomatisch wieder; „ein Mann“ wahrt die konkrete maskuline Einzahl von גֶּבֶר, ohne die Bedeutung künstlich zu verstärken.
- source_word: הֲיִחְיֶה
  choice: wird er wieder leben?
  rationale: Das im Deutschen ergänzte „wieder“ verdeutlicht die aus der Abfolge von Tod und Leben hervorgehende Frage, ohne sie als Gewissheit auszugeben.
- source_word: כָּל יְמֵי צְבָאִי
  choice: All die Tage meines harten Dienstes
  rationale: צָבָא kann Kriegsdienst, verpflichtenden Dienst oder eine festgesetzte Dienstzeit bezeichnen. „Harter Dienst“ bewahrt die Vorstellung einer auferlegten, beschwerlichen Zeit, ohne das Bild auf Militärdienst einzuengen.
- source_word: אֲיַחֵל
  choice: würde ich warten
  rationale: Die Verbform kann sowohl Warten als auch Hoffen ausdrücken. Im Bedingungszusammenhang ist „würde ich warten“ syntaktisch natürlich und lässt den Hoffnungston mitschwingen.
- source_word: עַד בּוֹא חֲלִיפָתִי
  choice: bis meine Erneuerung kommt
  rationale: חֲלִיפָה bezeichnet einen Wechsel und kann hier Erneuerung oder Ablösung meinen. „Erneuerung“ nimmt den Kontext möglichen neuen Lebens auf, ohne dessen genaue Art festzulegen; die breitere Bedeutungsvielfalt wird in der Fußnote genannt.
theological_decisions:
- issue: Ob der Vers eine eindeutige Lehre von der Auferstehung ausspricht
  choice: Die Frage bleibt offen; „Erneuerung“ deutet neues Leben an, definiert es aber nicht dogmatisch.
  alternative: „Auferstehung“ würde den Gedanken ausdrücklich festlegen; „Wechsel“ wäre lexikalisch offener, im Deutschen jedoch weniger klar und natürlich.
  rationale: Hiob formuliert eine spannungsvolle Frage und anschließend eine bedingte Erwartung. Die Übersetzung soll mögliche Hoffnung auf Leben nach dem Tod hörbar machen, ohne aus der Frage eine eindeutige Lehrbehauptung zu machen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nahe am hebräischen Gedankengang, während „harter Dienst“ und „würde ich warten“ natürliches Deutsch gewährleisten.
