  text: אָ֭דָם יְל֣וּד אִשָּׁ֑ה קְצַ֥ר יָ֝מִ֗ים וּֽ/שְׂבַֽע רֹֽגֶז־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/001.yaml
  text: Man[a], born of woman[b], is short of days and full of turmoil.
translation:
  language: de
  text: Der Mensch, von einer Frau geboren, lebt nur wenige Tage und ist voller Unruhe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „voller Not“ oder „voller Aufruhr“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: der Mensch
  rationale: Der generische Singular bezeichnet hier den Menschen als Vertreter der allgemeinen menschlichen Existenz. „Der Mensch“ bewahrt diese Form im Deutschen natürlich und geschlechtsübergreifend.
- source_word: יְלוּד אִשָּׁה
  choice: von einer Frau geboren
  rationale: Die partizipiale Wendung bezeichnet konkret den von einer Frau geborenen Menschen und unterstreicht seine menschliche Begrenztheit.
- source_word: קְצַר יָמִים
  choice: lebt nur wenige Tage
  rationale: Die hebräische Wendung bedeutet wörtlich etwa „kurz an Tagen“. Die gewählte Form gibt das Bild verständlich und würdevoll als Kürze des Lebens wieder.
- source_word: וּשְׂבַע רֹגֶז
  choice: und ist voller Unruhe
  rationale: שְׂבַע bezeichnet ein Erfüllt- oder Gesättigtsein; רֹגֶז umfasst Unruhe, Aufruhr und Not. „Voller Unruhe“ bewahrt die innere wie äußere Dimension, während die Fußnote die Bedeutungsbreite nennt.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: der Mensch
  alternative: ein Mensch; die Menschheit
  rationale: Der Vers formuliert eine allgemeine Aussage über die menschliche Existenz im repräsentativen Singular. „Der Mensch“ erhält diese Spannung zwischen Einzelmensch und Menschheit, ohne die Aussage auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und poetisch; die ungewöhnliche hebräische Bildlichkeit von „kurz an Tagen“ wird zugunsten unmittelbarer Verständlichkeit als „lebt nur wenige Tage“ wiedergegeben.
