  text: Look away from him[a], so that he may rest, until he fulfills his day like a hired worker.
translation:
  language: de
  text: Wende deinen Blick von ihm ab, damit er Ruhe findet, bis er wie ein Tagelöhner seinen Tag vollendet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wende deinen Blick von ihm ab und lass ihn aufhören, bis er wie ein Tagelöhner an seinem Tag Gefallen findet.“ Das Hebräische kann sowohl ein Aufhören beziehungsweise Nachlassen und damit eine Ruhepause als auch die Zufriedenheit beim Erreichen des zugemessenen Tagesendes betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁעֵה
  choice: Wende deinen Blick … ab
  rationale: Der Imperativ bezeichnet hier das Abwenden des Blicks oder der Aufmerksamkeit. Im Zusammenhang bittet Ijob Gott, seine prüfende Aufmerksamkeit von dem Menschen abzuziehen.
- source_word: מֵעָלָיו
  choice: von ihm
  rationale: Die Präpositionsverbindung mit dem Suffix der 3. Person Singular bezeichnet, dass Blick, Aufmerksamkeit oder Druck von ihm genommen werden.
- source_word: וְיֶחְדָּל
  choice: damit er Ruhe findet
  rationale: חדל bedeutet grundsätzlich „aufhören“ oder „ablassen“. Hier liegt sinngemäß eine Unterbrechung der Bedrängnis und damit eine Ruhepause nahe; die Wiedergabe vermeidet den möglichen Fehlschluss, der Mensch solle zu existieren aufhören.
- source_word: עַד
  choice: bis
  rationale: Die Konjunktion bezeichnet die zeitliche Grenze der erbetenen Ruhe.
- source_word: יִרְצֶה
  choice: vollendet hat
  rationale: רצה kann „Gefallen haben“, „zufrieden sein“ oder „annehmen“ bedeuten. In Verbindung mit dem Tagelöhner und seinem Tag ist wahrscheinlich das befriedigende Erreichen des Tagesendes gemeint. „vollendet hat“ gibt diesen Abschluss idiomatisch wieder, während die Fußnote die echte Bedeutungsbreite bewahrt.
- source_word: כְּשָׂכִיר
  choice: wie ein Tagelöhner
  rationale: שָׂכִיר bezeichnet einen gegen Lohn angestellten Arbeiter. „Tagelöhner“ bewahrt das soziale und zeitliche Bild knapp und verständlich.
- source_word: יוֹמוֹ
  choice: seinen Tag
  rationale: Die wörtliche Formulierung wird beibehalten; das Bild vom Tagelöhner macht deutlich, dass sein zugemessener Arbeitstag gemeint ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede Gottes bleibt durch den Imperativ erkennbar. „Tagelöhner“ bewahrt das konkrete Bild der antiken Arbeitswelt; die Fußnote hält die Mehrdeutigkeit von חדל und רצה offen.
