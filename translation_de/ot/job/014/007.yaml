source:
  edition: WLC
  text: כִּ֤י יֵ֥שׁ לָ/עֵ֗ץ תִּ֫קְוָ֥ה אִֽם יִ֭כָּרֵת וְ/ע֣וֹד יַחֲלִ֑יף וְ֝/יֹֽנַקְתּ֗/וֹ לֹ֣א תֶחְדָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/007.yaml
  text: 'For there is hope for a tree: if it is cut down[a], it will sprout again[b], and its shoot will not cease.'
translation:
  language: de
  text: 'Denn für einen Baum gibt es Hoffnung: Wird er gefällt, treibt er wieder aus, und sein junger Trieb hört nicht auf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung zum vorausgehenden Gedanken ein und bewahrt den kausalen Zusammenhang.
- source_word: יֵשׁ לָעֵץ תִּקְוָה
  choice: für einen Baum gibt es Hoffnung
  rationale: Die hebräische Existenzkonstruktion wird natürlich wiedergegeben; der Singular „ein Baum“ ist hier allgemein und sprichwörtlich zu verstehen.
- source_word: אִם יִכָּרֵת
  choice: Wird er gefällt
  rationale: Ein uneingeleiteter deutscher Konditionalsatz gibt das hebräische אִם idiomatisch wieder; das Nifal bezeichnet das Gefälltwerden des Baumes.
- source_word: וְעוֹד יַחֲלִיף
  choice: treibt er wieder aus
  rationale: Im botanischen Kontext bezeichnet חלף die Erneuerung des Wachstums. „wieder austreiben“ vermittelt dieses Bild konkret und natürlich.
- source_word: וְיֹנַקְתּוֹ
  choice: und sein junger Trieb
  rationale: יוֹנֶקֶת bezeichnet einen frischen beziehungsweise zarten Schössling oder Trieb; „junger Trieb“ wahrt das Bild in verständlichem Deutsch.
- source_word: לֹא תֶחְדָּל
  choice: hört nicht auf
  rationale: Gibt die fortdauernde Lebenskraft des Triebes eng am hebräischen Wortlaut wieder, ohne näher zu bestimmen, ob sein Wachstum oder Hervorkommen gemeint ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Schlichtheit. Die Baum-Metapher und die nicht ausdrücklich aufgelöste Aussage, dass der junge Trieb „nicht aufhört“, bleiben erhalten.
