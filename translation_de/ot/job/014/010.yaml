    reason: lexical_alternative
lexical_decisions:
- source_word: גֶבֶר
  choice: ein Mann
  rationale: Das Wort bezeichnet hier den einzelnen Mann, möglicherweise mit dem Beiklang von Kraft oder Stärke. „Ein Mann“ bewahrt die konkrete maskuline Einzahl, ohne diesen Beiklang zu überdehnen.
- source_word: יָמוּת
  choice: stirbt
  rationale: Das Imperfekt beschreibt hier in poetischer, allgemeingültiger Aussage die menschliche Sterblichkeit; das deutsche Präsens gibt diese gnomische Funktion natürlich wieder.
- source_word: וַיֶּחֱלָשׁ
  choice: liegt entkräftet da
  rationale: Das Verb bezeichnet das Schwach- oder Kraftloswerden. Im Zusammenhang mit dem Sterben drückt „liegt entkräftet da“ den erreichten Zustand idiomatisch aus, ohne bloß eine vorübergehende Krankheit nahezulegen.
- source_word: אָדָם
  choice: ein Mensch
  rationale: אָדָם bezeichnet hier den Menschen als sterbliches menschliches Wesen und steht parallel zu גֶבֶר. Die Wiedergabe mit „Mensch“ macht den Wechsel der hebräischen Begriffe sichtbar.
- source_word: וַיִּגְוַע
  choice: verscheidet
  rationale: Das Verb bezeichnet das Erlöschen des Lebens beziehungsweise das Sterben. „Verscheidet“ ist knapp, würdig und unterscheidet sich im Ausdruck von dem vorausgehenden „stirbt“.
- source_word: וְאַיּוֹ
  choice: – und wo ist er?
  rationale: Die direkte Frage nach dem Verstorbenen bleibt ohne erklärende Ergänzung stehen. Der Gedankenstrich bildet den scharfen poetischen Übergang ab; die Konjunktion wird als „und“ bewahrt.
theological_decisions:
- issue: Bedeutung der abschließenden Frage für den Zustand nach dem Tod
  choice: Die offene Frage „und wo ist er?“ wird unverändert als Frage wiedergegeben.
  alternative: Die Frage als Aussage über Nichtexistenz oder als Hinweis auf einen bestimmten Zustand nach dem Tod auslegen.
  rationale: Der Vers selbst beantwortet die Frage nicht. Eine festlegende Deutung würde die poetische und theologische Spannung des hebräischen Textes auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrtem poetischem Parallelismus. „Verscheidet“ ist bewusst etwas gehobener, aber allgemein verständlich; die offene Schlussfrage bleibt knapp und eindringlich.
