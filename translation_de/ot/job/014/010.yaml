  text: But a man dies and is laid low[a]; a human being expires[c][b], and where is he?
translation:
  language: de
  text: Doch ein Mann stirbt und wird kraftlos[a]; ein Mensch[b] verscheidet[c] – und wo ist er?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wird schwach.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen stehen hier zwei verschiedene Wörter parallel: גבר („Mann“, möglicherweise mit dem Beiklang von Kraft) und אדם („Mensch“). Dadurch wird die Sterblichkeit des Menschen hervorgehoben.'
    reason: cultural_note
  - marker: c
