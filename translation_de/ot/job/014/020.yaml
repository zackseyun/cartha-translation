  text: תִּתְקְפֵ֣/הוּ לָ֭/נֶצַח וַֽ/יַּהֲלֹ֑ךְ מְשַׁנֶּ֥ה פָ֝נָ֗י/ו וַֽ/תְּשַׁלְּחֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/020.yaml
  text: You overpower him forever[a], and he passes on[b]; you alter his face and send him away.
translation:
  language: de
  text: Du überwältigst ihn für immer, und er geht dahin[a]; du veränderst sein Gesicht[b] und schickst ihn fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er geht fort“. Das hebräische Verb bedeutet wörtlich „gehen“, bezeichnet hier aber wahrscheinlich das Scheiden aus dem Leben oder aus der Welt der Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein Aussehen“. Das hebräische Wort für „Gesicht“ kann weiter gefasst auch den äußeren Anblick bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְקְפֵהוּ
  choice: du überwältigst ihn
  rationale: 'Das Hifil von תקף bezeichnet hier Gottes starkes Vorgehen gegen den Menschen: Er gewinnt die Oberhand und überwältigt ihn. Die Formulierung bewahrt die Kraft des Verbs.'
- source_word: לָנֶצַח
  choice: für immer
  rationale: נֶצַח bezeichnet bleibende Dauer beziehungsweise Endgültigkeit. Im Zusammenhang unterstreicht es, dass der sterbliche Mensch Gottes Übermacht nicht rückgängig machen kann.
- source_word: וַיַּהֲלֹךְ
  choice: und er geht dahin
  rationale: הלך bedeutet wörtlich „gehen“. „Dahingehen“ ist im Deutschen eine natürliche, poetisch-würdevolle Formulierung, die hier das Scheiden aus dem Leben oder der menschlichen Welt nahelegt, ohne den Tod ausdrücklicher zu benennen als der hebräische Text.
- source_word: מְשַׁנֶּה
  choice: du veränderst
  rationale: Das Partizip von שנה („ändern, verändern“) setzt die direkte Anrede Gottes sinngemäß fort. „Verändern“ gibt den aktiven Vorgang klar und natürlich wieder.
- source_word: פָנָיו
  choice: sein Gesicht
  rationale: פנים bedeutet konkret „Gesicht“, kann aber auch das Aussehen oder den äußeren Anblick bezeichnen. Die Hauptfassung bewahrt das konkrete hebräische Bild.
- source_word: וַתְּשַׁלְּחֵהוּ
  choice: und schickst ihn fort
  rationale: Das Piel von שלח kann „fortschicken, entlassen“ bedeuten. „Fortschicken“ wahrt das Bild der Entfernung, ohne eine Vertreibung oder Entlassung zu stark festzulegen.
theological_decisions:
- issue: Bezeichnet וַיַּהֲלֹךְ ausdrücklich den Tod?
  choice: Die Übersetzung „er geht dahin“ lässt den im Zusammenhang wahrscheinlichen Abschied aus dem Leben anklingen, ohne ihn ausdrücklich festzuschreiben.
  alternative: „Er stirbt“ beziehungsweise „er vergeht“.
  rationale: Das unmittelbare Umfeld handelt von menschlicher Vergänglichkeit, doch das hebräische Verb selbst bedeutet lediglich „gehen“. Die genuine Spannung zwischen wörtlicher Bewegung und euphemistischem Scheiden bleibt daher erhalten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-poetischem Ton. „Dahingehen“ bewahrt die im Kontext naheliegende Todesnähe, ohne die lexikalische Offenheit von הלך aufzugeben; „Gesicht“ erhält das konkrete hebräische Bild.
