source:
  edition: WLC
  text: וְ֭/אוּלָם הַר נוֹפֵ֣ל יִבּ֑וֹל וְ֝/צ֗וּר יֶעְתַּ֥ק מִ/מְּקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/018.yaml
  text: But even a mountain falling wears away[b][a], and a rock is moved from its place.
translation:
  language: de
  text: Doch selbst ein stürzender Berg zerfällt[a], und ein Fels wird von seiner Stelle gerückt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „verwelkt“ oder „welkt dahin“; das sonst häufig von Pflanzen gebrauchte Verb wird hier bildhaft auf einen Berg bezogen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird von seinem Platz entfernt“ beziehungsweise „weicht von seiner Stelle“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Doch selbst
  rationale: 'Gibt den starken Gegensatz und die hervorhebende Kraft der Wendung wieder: Sogar scheinbar Beständiges vergeht.'
- source_word: הַר נוֹפֵל
  choice: ein stürzender Berg
  rationale: Das Qal-Partizip נוֹפֵל wird als fortdauernder beziehungsweise anschaulich dargestellter Vorgang wiedergegeben; der unbestimmte Ausdruck bewahrt den sprichwortartigen Charakter.
- source_word: יִבּוֹל
  choice: zerfällt
  rationale: Das Verb bedeutet gewöhnlich „welken“ oder „verblassen“, wird hier jedoch bildhaft auf einen Berg bezogen. „Zerfällt“ klingt im Deutschen natürlich und vermittelt dessen allmählichen Verfall; die wörtlichere Bildbedeutung bleibt in der Fußnote erhalten.
- source_word: וְצוּר
  choice: und ein Fels
  rationale: צוּר kann einen Felsen, eine Felswand oder ein Felsmassiv bezeichnen. „Fels“ ist hier die breite, natürliche Entsprechung und bildet die poetische Parallele zu „Berg“.
- source_word: יֶעְתַּק
  choice: wird … gerückt
  rationale: Das Verb bezeichnet das Fortbewegen, Entfernen oder Versetzen. Die passive Formulierung bewahrt den Sinn, ohne einen Handelnden zu ergänzen.
- source_word: מִמְּקֹמוֹ
  choice: von seiner Stelle
  rationale: Nahe Wiedergabe der Präpositionalfügung; sie erhält das Bild von etwas Feststehendem, das seinen Ort verliert.
theological_decisions: []
