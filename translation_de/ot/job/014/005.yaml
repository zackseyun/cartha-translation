id: JOB.14.5
reference: Job 14:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִ֥ם חֲרוּצִ֨ים יָמָ֗י/ו מִֽסְפַּר חֳדָשָׁ֥י/ו אִתָּ֑/ךְ חק/ו עָ֝שִׂ֗יתָ וְ/לֹ֣א יַעֲבֽוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/005.yaml
  text: Since his days are determined[a], the number of his months is with you; you have set his limit[b], and he cannot pass it.
translation:
  language: de
  text: Da seine Tage festgesetzt sind[a], die Zahl seiner Monate bei dir liegt und du ihm eine Grenze gesetzt hast[b], kann er sie nicht überschreiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn seine Tage festgesetzt sind“. Die hebräische Partikel kann eine Bedingung einleiten; im Zusammenhang gibt sie wahrscheinlich den Grund für Hiobs Bitte an: „Da seine Tage festgesetzt sind“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Bestimmung“ beziehungsweise „eine Satzung“. Das hebräische Wort kann eine festgelegte Vorschrift oder Grenze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Da
  rationale: Die Partikel kann eine Bedingung („wenn“) einleiten, führt hier im Zusammenhang aber wahrscheinlich den Grund für Hiobs anschließende Bitte an. „Da“ gibt diese begründende Funktion in natürlichem Deutsch wieder, ohne die mögliche konditionale Lesart zu verschweigen.
- source_word: חֲרוּצִים
  choice: festgesetzt
  rationale: Das passive Partizip bezeichnet die Tage als entschieden oder verbindlich bestimmt. „Festgesetzt“ ist klar, würdig und lässt die göttliche Bestimmung der Lebensdauer erkennen.
- source_word: יָמָיו
  choice: seine Tage
  rationale: Die wörtliche Wendung bezieht sich im Kontext auf die Lebenstage des Menschen.
- source_word: מִסְפַּר חֳדָשָׁיו
  choice: die Zahl seiner Monate
  rationale: Die nominale Formulierung des Hebräischen wird transparent bewahrt und nicht unnötig in „seine Monate sind gezählt“ umgeformt.
- source_word: אִתָּךְ
  choice: bei dir liegt
  rationale: Hebräisch steht wörtlich „bei dir“. „Bei dir liegt“ ist im Deutschen natürlich und bewahrt sowohl den Gedanken göttlichen Wissens als auch den göttlicher Verfügung, ohne sich auf nur einen davon festzulegen.
- source_word: חֻקּוֹ
  choice: ihm eine Grenze
  rationale: Das Substantiv kann eine Satzung, Festsetzung oder einen vorgeschriebenen Grenzwert bezeichnen. Im Zusammenhang mit dem folgenden Überschreiten ist „Grenze“ anschaulich und idiomatisch.
- source_word: עָשִׂיתָ
  choice: gesetzt hast
  rationale: Das allgemeine Verb „machen/tun“ bedeutet in Verbindung mit einer Grenze oder Festsetzung, dass diese eingerichtet beziehungsweise festgelegt wird.
- source_word: וְלֹא יַעֲבוֹר
  choice: kann er sie nicht überschreiten
  rationale: Das maskuline Singularverb bezieht sich auf den Menschen. Im Kontext bezeichnet es seine Unfähigkeit, über die von Gott festgesetzte Lebensgrenze hinauszugehen; das feminine Pronomen „sie“ nimmt im Deutschen „Grenze“ auf.
theological_decisions:
- issue: Göttliche Bestimmung der menschlichen Lebensdauer
  choice: Der Vers sagt aus, dass die Lebenszeit des Menschen festgesetzt ist, ihre Dauer bei Gott liegt und Gott eine unüberschreitbare Grenze gesetzt hat.
  alternative: Man könnte „bei dir“ schwächer ausschließlich auf Gottes Kenntnis der Lebensdauer beziehen und seine aktive Bestimmung weniger hervorheben.
  rationale: Die Verbindung von „festgesetzt“, „bei dir“ und „du hast eine Grenze gesetzt“ spricht sowohl von Gottes Wissen als auch von seiner Verfügung. Die Übersetzung erhält diese starke Aussage, ohne daraus ein umfassenderes Lehrsystem abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. Die Satzfügung bildet den Gedankengang flüssig ab; „bei dir liegt“ und „Grenze“ bewahren zugleich die konkrete Bildsprache und die theologische Spannung des Hebräischen.
