translation_notes:
  register: Poetische, aber allgemein verständliche Standardsprache. Das ungewöhnliche Bild vom „Duft von Wasser“ bleibt erhalten; die botanische Aussage wird nicht stärker präzisiert, als es der knappe hebräische Wortlaut erlaubt.
