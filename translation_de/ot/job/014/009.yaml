translation:
  language: de
  text: Schon vom Duft des Wassers treibt er aus und bringt Wuchs hervor wie eine Pflanze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und bringt Ertrag hervor wie etwas Gepflanztes.“ Das mit „Wuchs“ wiedergegebene hebräische Wort bedeutet gewöhnlich „Ernte“. Im Zusammenhang kann es den Ertrag beziehungsweise neuen Wuchs einer Pflanze bezeichnen; manche verstehen es konkreter als Triebe oder Zweige.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵיחַ
  choice: Beim Duft von
  rationale: רֵיחַ bezeichnet Geruch oder Duft; die Präposition מִן beschreibt hier poetisch die Reaktion auf die bloße Nähe beziehungsweise Wahrnehmung von Wasser. „Beim Duft von“ ist im Deutschen knapp und bildhaft.
- source_word: מַיִם
  choice: Wasser
  rationale: מַיִם ist formal pluralisch, wird aber gewöhnlich als Stoffbezeichnung gebraucht. „Wasser“ ist daher die natürliche deutsche Wiedergabe.
- source_word: יַפְרִחַ
  choice: treibt er aus
  rationale: Das Hifil von פרח kann Knospen, Sprießen oder Blühen bezeichnen. Im Zusammenhang eines gefällten Baumes gibt „austreiben“ die beginnende Erneuerung wieder, ohne bereits Blüten vorauszusetzen.
- source_word: וְעָשָׂה קָצִיר
  choice: und bringt neuen Wuchs hervor
  rationale: עשה ist ein allgemeines Verb für Tun oder Hervorbringen. קָצִיר bedeutet gewöhnlich „Ernte“, bezeichnet hier im Pflanzenbild aber wahrscheinlich das neu Hervorgebrachte, etwa Triebe oder Zweige. „Neuen Wuchs“ bewahrt die bildliche Aussage, ohne die ungewöhnliche Wortwahl zu eng festzulegen.
- source_word: כְּמוֹ
  choice: wie
  rationale: Die gewöhnliche und natürliche Wiedergabe des Vergleichspartikels.
- source_word: נָטַע
  choice: eine Pflanze
  rationale: Das substantivisch gebrauchte Wort bezeichnet etwas Gepflanztes. „Pflanze“ gibt dies natürlich wieder und vermeidet es, den im unmittelbaren Kontext naheliegenden Baum ausdrücklich in das einzelne Wort hineinzulesen.
