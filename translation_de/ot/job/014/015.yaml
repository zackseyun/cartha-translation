source:
  edition: WLC
  text: תִּ֭קְרָא וְ/אָנֹכִ֣י אֶֽעֱנֶ֑/ךָּ לְֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ תִכְסֹֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/015.yaml
  text: You would call[a], and I would answer you[b]; you would long for the work of your hands.
translation:
  language: de
  text: Du würdest rufen[a], und ich würde dir antworten; nach dem Werk deiner Hände würdest du dich sehnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Zukunftsaussage: „Du wirst rufen, und ich werde dir antworten.“'
    reason: grammatical_alternative
  - marker: b
    text: Mit dem „Werk deiner Hände“ ist hier der Mensch als Gottes Geschöpf gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְרָא
  choice: Du würdest rufen
  rationale: Das Qal-Imperfekt der 2. Person Singular steht im Zusammenhang von Hiobs erhofftem Szenario und erhält daher modale Bedeutung. Der deutsche Konjunktiv II gibt diese Hoffnung wieder, ohne einen schlichten Zukunftssatz daraus zu machen.
- source_word: וְאָנֹכִי
  choice: und ich
  rationale: Die Konjunktion und das ausdrücklich gesetzte Personalpronomen heben Hiobs Antwort als Gegenstück zu Gottes Rufen hervor.
- source_word: אֶעֱנֶךָּ
  choice: würde dir antworten
  rationale: Das Qal-Imperfekt der 1. Person Singular mit Suffix der 2. Person bedeutet „dir antworten“. Der Konjunktiv II entspricht dem modalen Sinn des vorangehenden Verbs.
- source_word: לְמַעֲשֵׂה
  choice: nach dem Werk
  rationale: מַעֲשֶׂה kann ein Werk, eine Tat oder etwas Hervorgebrachtes bezeichnen. Zusammen mit „deiner Hände“ ist das von Gott geschaffene Wesen gemeint.
- source_word: יָדֶיךָ
  choice: deiner Hände
  rationale: Die wörtliche Wendung bewahrt das anschauliche Schöpferbild des Hebräischen und ist im Deutschen verständlich.
- source_word: תִכְסֹף
  choice: würdest du dich sehnen
  rationale: Das Verb כסף bezeichnet starkes Verlangen oder Sehnen. „Sich sehnen nach“ ist eine natürliche deutsche Wiedergabe und bewahrt die emotionale Kraft der Aussage.
theological_decisions:
- issue: Ob der Vers lediglich Gottes Beachtung oder sein Verlangen nach dem von ihm geschaffenen Menschen ausdrückt
  choice: nach dem Werk deiner Hände würdest du dich sehnen
  alternative: du würdest das Werk deiner Hände beachten
  rationale: כסף drückt eher Sehnsucht oder starkes Verlangen als bloße Beachtung aus. Die Übersetzung bewahrt Hiobs spannungsvolle Hoffnung, Gott werde sich seinem Geschöpf wieder zuwenden, ohne diese Hoffnung als bereits erfüllte Gewissheit darzustellen.
- issue: Zeitliche beziehungsweise modale Bedeutung der hebräischen Imperfektformen
  choice: würdest … würde … würdest
  alternative: wirst … werde … wirst
  rationale: Der Kontext von Hiob 14 beschreibt ein ersehntes, vorgestelltes Geschehen. Der Konjunktiv II bildet diesen Sinn im Deutschen am besten ab; die mögliche futurische Lesart bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Satzrhythmus. „Werk deiner Hände“ bewahrt das konkrete Schöpferbild; „sich sehnen nach“ gibt die starke Gefühlsbedeutung des hebräischen Verbs natürlich wieder.
