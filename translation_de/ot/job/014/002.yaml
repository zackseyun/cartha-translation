  naturalness: „Wie eine Blume kommt er hervor“ ist modernes, würdiges und poetisch knappes Standarddeutsch. „Bleibt nicht bestehen“ ist für die im Kontext gemeinte fehlende Dauer idiomatischer als das etwas unvollständige „bleibt nicht“.
