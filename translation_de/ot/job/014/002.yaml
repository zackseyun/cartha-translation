base_translation:
  language: en
  yaml_path: translation/ot/job/014/002.yaml
  text: Like a flower he comes forth and withers[a]; he flees like a shadow and does not remain.
translation:
  language: de
  text: Wie eine Blume kommt er hervor und verwelkt[a]; er flieht wie ein Schatten und bleibt nicht bestehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und wird abgeschnitten«; das hebräische Verb kann sowohl im Sinne des Verwelkens oder Verblühens als auch des Abgeschnittenwerdens verstanden werden, besonders im Bild der Blume.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִיץ
  choice: Wie eine Blume
  rationale: צִיץ bezeichnet eine Blume oder Blüte. „Blume“ ist im modernen Deutsch natürlich und bewahrt das Bild menschlicher Vergänglichkeit.
- source_word: יָצָא
  choice: geht er auf
  rationale: יצא bedeutet wörtlich „hinausgehen/hervorkommen“. Bei einer Blume gibt „aufgehen“ ihr Hervorkommen idiomatisch wieder, ohne das Bild zu erklären oder auszuweiten.
- source_word: וַיִּמָּל
  choice: und verwelkt
  rationale: Das Verb kann hier das Verwelken beziehungsweise Verblühen oder ein Abgeschnittenwerden bezeichnen. Im unmittelbaren Blumenbild ist „verwelkt“ die natürliche Hauptlesart; die andere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: וַיִּבְרַח
  choice: flieht er
  rationale: ברח heißt gewöhnlich „fliehen“. Die konkrete, lebhafte Bildsprache wird beibehalten statt zu „vergeht“ abgeschwächt zu werden.
- source_word: כַּצֵּל
  choice: wie ein Schatten
  rationale: Die direkte Entsprechung bewahrt das poetische Bild von Flüchtigkeit und kurzer Dauer.
- source_word: וְלֹא יַעֲמוֹד
  choice: und bleibt nicht
  rationale: עמד bedeutet wörtlich „stehen“, bezeichnet hier jedoch das Fortbestehen oder Verweilen. „Bleibt nicht“ ist knapp, verständlich und poetisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die männliche Einzahl wird entsprechend dem Zusammenhang von Hiob 14,1 beibehalten; die lexikalische Mehrdeutigkeit von וַיִּמָּל wird nicht aufgelöst, sondern durch die Fußnote sichtbar gemacht.
