  text: מִ֤י יִתֵּ֨ן בִּ/שְׁא֬וֹל תַּצְפִּנֵ֗/נִי תַּ֭סְתִּירֵ/נִי עַד שׁ֣וּב אַפֶּ֑/ךָ תָּ֤שִׁ֥ית לִ֖/י חֹ֣ק וְ/תִזְכְּרֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/013.yaml
  text: Oh[a], that you would hide me in Sheol, that you would conceal me until your anger turns away[b], that you would appoint a time for me and remember me!
translation:
  language: de
  text: Ach, würdest du mich doch im Totenreich[a] verbergen, mich verstecken, bis dein Zorn sich abwendet, mir eine Frist setzen[b] und an mich denken!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Scheol« beziehungsweise »im Bereich der Toten«. Das hebräische Wort bezeichnet das Totenreich und nicht nur ein Grab.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »eine festgesetzte Zeit bestimmen« oder »eine Grenze setzen«. Das hebräische Wort bezeichnet etwas Festgesetztes, Vorgeschriebenes oder Begrenztes.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Wenn du doch … würdest
  rationale: Die hebräische Wunschformel drückt ein starkes, unerfülltes Verlangen aus; diese deutsche Konstruktion gibt ihren optativischen und emotionalen Charakter natürlich wieder.
- source_word: בִּשְׁאוֹל
  choice: im Totenreich
  rationale: שְׁאוֹל bezeichnet hier den Bereich der Toten, nicht bloß ein einzelnes Grab. „Totenreich“ bewahrt die alttestamentliche Vorstellung, ohne eine spätere Höllenlehre einzutragen.
- source_word: תַּצְפִּנֵנִי / תַּסְתִּירֵנִי
  choice: mich verbergen / mich verstecken
  rationale: Die beiden weitgehend parallelen Verben werden mit zwei nahen deutschen Ausdrücken wiedergegeben, sodass sowohl ihre Bedeutungsnähe als auch die poetische Steigerung erkennbar bleiben.
- source_word: עַד שׁוּב אַפֶּךָ
  choice: bis dein Zorn sich abwendet
  rationale: אַף bedeutet idiomatisch „Zorn“; שׁוב beschreibt hier dessen Abwendung. Die Formulierung ist natürlich und bewahrt das Bild einer Richtungsänderung.
- source_word: תָּשִׁית לִי חֹק
  choice: mir eine Frist setzen
  rationale: חֹק bezeichnet etwas Festgesetztes oder Begrenztes. Im zeitlichen Zusammenhang ist „Frist“ prägnant, lässt aber offen, ob vor allem ein festgelegter Zeitpunkt oder ein begrenzter Zeitraum gemeint ist.
- source_word: וְתִזְכְּרֵנִי
  choice: und dann an mich denken
  rationale: Das Verb bedeutet „sich erinnern/an jemanden denken“. „Dann“ verdeutlicht den im Kontext angelegten zeitlichen Anschluss, ohne den Inhalt des Erinnerns näher auszudeuten.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Totenreich
  alternative: Scheol; Grab
  rationale: „Totenreich“ vermittelt gewöhnlichen deutschen Lesern den gemeinten Bereich der Toten. Es verengt den Ausdruck weder auf die Grabstätte noch setzt es ihn mit einer später ausgebildeten Vorstellung von Hölle gleich.
- issue: Bedeutung von חֹק
  choice: Frist
  alternative: festgesetzte Zeit; Grenze; Bestimmung
  rationale: Der Kontext legt einen zeitlichen Bezug nahe, doch das Wort trägt zugleich den Gedanken des Festgesetzten und Begrenzten. „Frist“ erhält beide Aspekte, während die Fußnote die Bedeutungsbreite ausweist.
- issue: Gottes Erinnern
  choice: an mich denken
  alternative: mich nicht vergessen; mich wieder ins Leben rufen
  rationale: Die Übersetzung hält sich an den Wortlaut und legt nicht fest, welche konkrete göttliche Handlung aus dem Erinnern folgt. So bleibt die Spannung des Zusammenhangs über Tod und mögliche erneute Zuwendung bestehen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Wiederholung. Die zweimalige Wunschkonstruktion bildet die hebräische Folge abhängiger Verbformen als einen leidenschaftlichen Wunsch ab. „Totenreich“ ist verständlicher als die reine Transliteration „Scheol“; die Fußnote bewahrt den hebräischen Fachbegriff und seine Bedeutungsbreite.
