  yaml_path: translation/ot/job/003/021.yaml
  text: who wait for death[a], but it does not come, and dig for it more than for hidden treasures,
translation:
  language: de
  text: 'die auf den Tod warten[a], doch er kommt nicht,

    und nach ihm graben, mehr als nach verborgenen Schätzen,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er ist nicht da“; wörtlich lautet das Hebräische „und er ist nicht“ und meint, dass der Tod nicht erscheint oder kommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְחַכִּים
  choice: die ... warten
  rationale: Das Partizip von חכה bezeichnet erwartungsvolles Warten. „Warten“ gibt den lexikalischen Grundsinn direkt wieder; das Verlangen ergibt sich aus dem Kontext.
- source_word: לַמָּוֶת
  choice: auf den Tod
  rationale: Die Präposition ל mit חכה wird im Deutschen idiomatisch durch „auf“ wiedergegeben; der Tod ist das Erwartete.
- source_word: וְאֵינֶנּוּ
  choice: doch er kommt nicht
  rationale: Wörtlich heißt die Wendung „und er ist nicht“. Das maskuline Suffix bezieht sich auf den Tod; „doch er kommt nicht“ macht die im Kontext gemeinte ausbleibende Ankunft natürlich verständlich, während die wörtliche Alternative in der Fußnote erhalten bleibt.
- source_word: וַיַּחְפְּרֻהוּ
  choice: und nach ihm ... graben
  rationale: חפר bedeutet wörtlich „graben“. Die Formulierung bewahrt das anschauliche Bild der Suche nach vergrabenen Kostbarkeiten.
- source_word: מִמַּטְמוֹנִים
  choice: mehr ... als nach verborgenen Schätzen
  rationale: מַטְמוֹן bezeichnet einen verborgenen oder aufbewahrten Schatz. Das מִן hat hier vergleichende Bedeutung; „verborgene Schätze“ erhält die Verbindung zum Bild des Grabens.
