  text: יַ֭חַד אֲסִירִ֣ים שַׁאֲנָ֑נוּ לֹ֥א שָׁ֝מְע֗וּ ק֣וֹל נֹגֵֽשׂ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/018.yaml
  text: There the prisoners are at ease together[a]; they do not hear the voice of the taskmaster.
translation:
  language: de
  text: Dort sind die Gefangenen gemeinsam ungestört; sie hören die Stimme des Antreibers[a] nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Unterdrückers“ oder „des Eintreibers“.'
