lexical_decisions:
- source_word: יַחַד
  choice: gemeinsam
  rationale: Das Adverb beschreibt den geteilten Zustand der Gefangenen; „gemeinsam“ gibt den kollektiven Sinn natürlich wieder.
- source_word: אֲסִירִים
  choice: die Gefangenen
  rationale: Die Bezeichnung meint inhaftierte oder gebundene Menschen; „Gefangene“ ist im Zusammenhang klar und hält offen, um welche Art von Gefangenschaft es geht.
- source_word: שַׁאֲנָנוּ
  choice: sind … ungestört
  rationale: Das Verb bezeichnet einen ruhigen, von Störung freien Zustand. „Ungestört“ vermeidet eine zu starke Gleichsetzung mit anderen hebräischen Ausdrücken für Ruhe.
- source_word: לֹא שָׁמְעוּ
  choice: sie hören … nicht
  rationale: Die poetische Perfektform beschreibt hier den fortdauernden Zustand der Toten; das deutsche Präsens bringt diesen Zusammenhang angemessen zum Ausdruck.
- source_word: קוֹל
  choice: die Stimme
  rationale: „Stimme“ bezeichnet hier die hörbaren Befehle oder Forderungen des Bedrängers und entspricht der üblichen Bedeutung des hebräischen Wortes.
- source_word: נֹגֵשׂ
  choice: des Antreibers
  rationale: Das Partizip bezeichnet jemanden, der Menschen zur Arbeit oder zu Leistungen drängt. „Antreiber“ ist anschaulich, ohne den Sinn ausschließlich auf Sklavenarbeit oder Abgabenerhebung festzulegen.
