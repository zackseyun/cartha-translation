  yaml_path: translation/ot/job/003/024.yaml
  text: For my sighing comes before my bread[b][a], and my groanings pour out like water.
translation:
  language: de
  text: Denn vor meinem Brot[a] kommt mein Seufzen, und meine Schreie[b] ergießen sich wie Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „meinem Essen“; das hebräische Wort für „Brot“ kann umfassender alles bezeichnen, was man isst.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „meine Brüllrufe“; das hebräische Wort kann einen lauten, tierähnlichen Schrei bezeichnen und verstärkt so den Ausdruck von Hiobs Qual.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Partikel leitet hier eine Begründung beziehungsweise Erläuterung von Hiobs elendem Zustand ein; „Denn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: לִפְנֵי
  choice: noch vor
  rationale: Die Präposition bezeichnet hier am ehesten ein zeitliches Vorausgehen. „Noch vor“ macht verständlich, dass das Seufzen bereits vor dem Essen einsetzt, ohne die Bildfolge aufzulösen.
- source_word: לַחְמִי
  choice: meinem Brot
  rationale: לֶחֶם bedeutet konkret „Brot“, kann jedoch auch allgemein für Nahrung oder Essen stehen. Die konkrete Bildsprache bleibt im Haupttext erhalten; die weitere Bedeutung wird in einer Fußnote genannt.
- source_word: אַנְחָתִי
  choice: mein Seufzen
  rationale: אַנְחָה bezeichnet einen aus Not hervorgehenden Seufzer oder ein Seufzen. Die substantivierte Form „mein Seufzen“ bewahrt den kollektiven Singular und klingt im Deutschen natürlich.
- source_word: תָבֹא
  choice: kommt
  rationale: בוא bedeutet gewöhnlich „kommen“. Das Präsens entspricht dem fortdauernden Zustand, den Hiob in seiner Klage schildert.
- source_word: וַיִּתְּכוּ
  choice: ergießen sich
  rationale: נתך bezeichnet ein Ausgießen oder Ausströmen. Mit dem Vergleich „wie Wasser“ gibt „ergießen sich“ das Bild eines unaufhaltsamen Ausflusses idiomatisch und anschaulich wieder.
- source_word: כַמַּיִם
  choice: wie Wasser
  rationale: Der direkte Vergleich ist klar und wird wörtlich bewahrt.
- source_word: שַׁאֲגֹתָי
  choice: meine Schmerzensschreie
  rationale: Das von שׁאג abgeleitete Wort bezeichnet lautes Brüllen oder machtvolle Schreie. „Schmerzensschreie“ vermittelt im Deutschen die heftige, hörbare Qual, während die tierähnliche Nuance von „Brüllen“ in der Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gut verständlicher poetischer Bildsprache. Die konkrete Wendung „vor meinem Brot“ und das Wasserbild bleiben erhalten; „Schmerzensschreie“ vermeidet ein unnatürliches deutsches „Brüllen“ im Haupttext, ohne dessen Intensität zu verlieren.
