source:
  edition: WLC
  text: קָטֹ֣ן וְ֭/גָדוֹל שָׁ֣ם ה֑וּא וְ֝/עֶ֗בֶד חָפְשִׁ֥י מֵ/אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/019.yaml
  text: The small and the great are there[a], and the servant is free from his master.
translation:
  language: de
  text: Klein und Groß sind dort, und der Sklave ist frei von seinem Herrn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… frei von seinem Besitzer.“ Das hebräische Wort für „Herr“ bezeichnet hier den Herrn eines Sklaven und kann daher auch dessen Besitzer meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹן
  choice: Klein
  rationale: Im Gegensatz zu גָדוֹל bezeichnet das substantivierte Adjektiv Menschen von geringem Rang oder Ansehen; die knappe Form bewahrt die prägnante Gegenüberstellung.
- source_word: גָדוֹל
  choice: Groß
  rationale: Als Gegenbegriff zu קָטֹן meint das substantivierte Adjektiv Menschen von hohem Rang oder Ansehen; „Klein und Groß“ ist im Deutschen eine natürliche feste Paarung.
- source_word: שָׁם
  choice: dort
  rationale: Das Wort verweist auf den im Zusammenhang beschriebenen Bereich des Todes und wird deiktisch knapp wiedergegeben.
- source_word: הוּא
  choice: sind
  rationale: Das formal singularische Pronomen steht nach dem zusammengefassten Paar „Klein und Groß“. Im Deutschen erfordert die Aussage über beide Gruppen den Plural; ein zusätzliches „gleichermaßen“ wäre im Hebräischen nicht ausdrücklich vorhanden.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Der Gegensatz zum Freisein von einem Herrn hebt das rechtlich-soziale Abhängigkeitsverhältnis hervor; daher ist „Sklave“ hier genauer als das weiter gefasste „Diener“.
- source_word: חָפְשִׁי
  choice: frei
  rationale: Das Adjektiv bezeichnet unmittelbar die Freiheit im Gegensatz zur Sklaverei.
- source_word: מֵאֲדֹנָיו
  choice: von seinem Herrn
  rationale: Die Präposition bezeichnet die Trennung, und אֲדוֹן meint hier den menschlichen Herrn des Sklaven. „Herr“ wahrt die sachliche Beziehung, ohne eine Gottesbezeichnung zu unterstellen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Parallelstruktur des Hebräischen bleibt erhalten. „Klein und Groß“ ist sozial zu verstehen, nicht primär körperlich; „Sklave“ macht den im Kontext betonten Gegensatz zur Freiheit deutlich.
