  source_fidelity: 'Die Übersetzung gibt die parallele Aussage des Hebräischen zuverlässig wieder: קָטֹן וְגָדוֹל als die sozialen Gegenpole „Klein und Groß“, שָׁם als „dort“ und עֶבֶד חָפְשִׁי מֵאֲדֹנָיו als „der Sklave ist frei von seinem Herrn“. Sie fügt kein nicht ausdrücklich ausgedrücktes „gleichermaßen“ hinzu und bewahrt den Bezug auf den zuvor beschriebenen Todesbereich.'
