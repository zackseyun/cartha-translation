  text: I was not at ease[a], and I was not quiet; I was not at rest[b], and turmoil came.
translation:
  language: de
  text: Ich hatte keine Ruhe, keine Stille, keine Rast – und Unruhe kam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich war nicht unbesorgt, nicht ruhig und nicht in Ruhe; und Aufruhr kam.“ Das Hebräische reiht drei nahezu parallele Verben für das Ausbleiben von Erleichterung aneinander. Das abschließende Wort kann Unruhe, Erregung, Aufruhr oder Bedrängnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַוְתִּי
  choice: ich fand Ruhe
  rationale: Das Verb bezeichnet Ungestörtheit, Ruhe oder unbeschwerte Sicherheit. Die idiomatische Wendung „Ruhe finden“ gibt hier den erlebten Zustand wieder, ohne ihn auf äußere Sicherheit zu verengen.
- source_word: שָׁקַטְתִּי
  choice: ich fand Stille
  rationale: שׁקט bezeichnet Stille beziehungsweise Freiheit von Störung. „Stille finden“ wahrt im Deutschen den Unterschied zum vorangehenden Ausdruck und zugleich den parallelen Satzbau.
- source_word: נָחְתִּי
  choice: ich konnte nicht ausruhen
  rationale: נוח bedeutet ruhen oder zur Ruhe kommen. „Ausruhen“ lässt sich natürlich von den beiden substantivischen Wendungen abheben und erhält die Steigerung der drei nahezu parallelen Verben.
- source_word: רֹגֶז
  choice: Unruhe
  rationale: Das Substantiv kann Unruhe, Erregung, Aufruhr oder Bedrängnis bezeichnen. „Unruhe“ bewahrt die Bedeutungsbreite und bildet einen bewussten Gegensatz zu den drei verweigerten Ruhebegriffen.
- source_word: וַיָּבֹא
  choice: da kam
  rationale: Das Verb bezeichnet schlicht das Eintreten beziehungsweise Kommen. „Da kam“ gibt die erzählerische Folge wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt wie „über mich“ hinzuzufügen.
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: keine ... und keine ...; nicht ...
  rationale: Die drei Negationen werden in jeder Teilaussage erkennbar wiedergegeben. Eine vollständig wortgleiche Wiederholung von „ich war nicht“ wäre mit den gewählten deutschen Ausdrücken unnatürlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die drei parallelen Verneinungen und der Gegensatz zwischen Ruhe und eintretender Unruhe bleiben hörbar; die Formulierungen sind idiomatisch, ohne die mehrdeutigen hebräischen Begriffe vorschnell festzulegen.
