  yaml_path: translation/ot/job/003/014.yaml
  text: with kings and counselors of the earth, who built ruins for themselves,
translation:
  language: de
  text: 'mit Königen und Ratgebern der Erde,

    die sich Ruinen bauten,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְלָכִים
  choice: Königen
  rationale: Die direkte und natürliche Entsprechung von מֶלֶךְ im Plural.
- source_word: יֹעֲצֵי אָרֶץ
  choice: Ratgebern der Erde
  rationale: Bewahrt die weit gefasste Genitivverbindung des Hebräischen; gemeint sind hochgestellte Berater beziehungsweise Machthaber der Welt.
- source_word: הַבֹּנִים חֳרָבוֹת לָמוֹ
  choice: die sich Ruinen bauten
  rationale: Gibt die auffällige, spannungsvolle Formulierung wörtlich-nah wieder. חֳרָבוֹת bezeichnet Ruinen oder verwüstete Stätten; לָמוֹ bedeutet hier »für sich«. Eine Deutung als Paläste oder Grabmäler wird nicht in den Haupttext eingetragen.
theological_decisions:
- issue: Deutung der von den Königen errichteten חֳרָבוֹת
  choice: Die paradoxe Aussage »die sich Ruinen bauten« bleibt bestehen.
  alternative: »die sich verödete Stätten wieder aufbauten« oder »die sich Grabmäler bauten«
  rationale: Der hebräische Text benennt Ruinen beziehungsweise verwüstete Orte, ohne ausdrücklich Wiederaufbau oder Grabmäler zu sagen. Die genuine Bildspannung soll nicht durch eine erklärende Deutung aufgelöst werden.
translation_notes:
  register: Dignifizierte, knappe poetische Sprache. Die Zeilenbrechung bildet den Parallelismus des Versglieds ab; die ungewöhnliche Wendung »sich Ruinen bauen« ist bewusst erhalten.
