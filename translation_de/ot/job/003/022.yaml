source:
  edition: WLC
  text: הַ/שְּׂמֵחִ֥ים אֱלֵי גִ֑יל יָ֝שִׂ֗ישׂוּ כִּ֣י יִמְצְאוּ קָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/022.yaml
  text: who rejoice exceedingly[c][b][a], who exult when they find the grave—
translation:
  language: de
  text: die sich über alle Maßen freuen[a] und jubeln, wenn[b] sie ein Grab[c] finden —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sich bis zum Jubel freuen“; die hebräische Wendung verstärkt die Aussage idiomatisch.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil sie ein Grab finden“. Die hebräische Konjunktion kann hier sowohl zeitlich als auch begründend verstanden werden.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „das Grab“. Das hebräische Wort kann ein einzelnes Grab oder das Grab allgemein als Bild für den Tod bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: die sich freuen
  rationale: Der mit Artikel versehene Partizipialausdruck ist substantivisch gebraucht und führt die Beschreibung der Menschen aus dem vorherigen Vers fort.
- source_word: אֱלֵי גִיל
  choice: über alle Maßen
  rationale: Die Wendung bedeutet wörtlich etwa „bis zum Jubel“ und wirkt hier idiomatisch als Verstärkung der Freude. „Über alle Maßen“ gibt diese Steigerung natürlich und würdig wieder.
- source_word: יָשִׂישׂוּ
  choice: und jubeln
  rationale: Das Verb bezeichnet ausgelassene Freude. „Jubeln“ bewahrt die poetische Steigerung gegenüber dem vorhergehenden „sich freuen“.
- source_word: כִּי
  choice: wenn
  rationale: Die Konjunktion bezeichnet hier plausibel den Zeitpunkt beziehungsweise Anlass des Jubels. Die ebenfalls mögliche kausale Deutung wird in einer Fußnote erhalten.
- source_word: יִמְצְאוּ
  choice: sie finden
  rationale: „Finden“ entspricht der schlichten und eindringlichen Aussage des hebräischen Verbs מצא.
- source_word: קָבֶר
  choice: ein Grab
  rationale: Das artikellose hebräische Substantiv lässt sich natürlich indefinit wiedergeben. Im Zusammenhang steht das Grab als ersehntes Ziel für den Tod.
