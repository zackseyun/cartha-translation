base_translation:
  language: en
  yaml_path: translation/ot/job/003/015.yaml
  text: or with princes who had gold[b][a], who filled their houses with silver—
translation:
  language: de
  text: 'oder mit Fürsten[a], die Gold besaßen

    und ihre Häuser[b] mit Silber füllten —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Herrschern“ oder „Vornehmen“.
    reason: lexical_alternative
  - marker: b
    text: „Paläste“ ist im Zusammenhang möglich, doch wörtlich steht hier „Häuser“.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: oder
  rationale: Setzt Hiobs Reihe nicht eingetretener Möglichkeiten aus dem Zusammenhang fort und bewahrt die schlichte poetische Verknüpfung.
- source_word: עִם
  choice: bei
  rationale: Bezeichnet hier die vorgestellte Gemeinschaft mit den verstorbenen Großen. „Bei“ klingt im Deutschen in diesem Zusammenhang natürlicher als das ebenfalls mögliche „mit“.
- source_word: שָׂרִים
  choice: Fürsten
  rationale: Bezeichnet hochrangige Machthaber oder Würdenträger. „Fürsten“ wahrt den gehobenen poetischen Ton, ohne den Begriff auf ein bestimmtes Amt festzulegen.
- source_word: זָהָב לָהֶם
  choice: die Gold besaßen
  rationale: Die hebräische Wendung bezeichnet idiomatisch Besitz. Diese Formulierung gibt den Sinn klar und natürlich wieder.
- source_word: הַמְמַלְאִים
  choice: füllten
  rationale: Das Partizip beschreibt die Fürsten weiter. Im Kontext der bereits Verstorbenen ist eine deutsche Relativkonstruktion in der Vergangenheit angemessen.
- source_word: בָּתֵּיהֶם
  choice: ihre Häuser
  rationale: Der Grundbegriff bedeutet „Häuser“. „Paläste“ wäre angesichts der fürstlichen Besitzer denkbar, aber spezifischer als der hebräische Wortlaut.
- source_word: כָּסֶף
  choice: Silber
  rationale: Im Zusammenhang mit Gold und angehäuftem Reichtum ist das Edelmetall gemeint; „Geld“ würde das konkrete poetische Bild abschwächen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Der Vers bleibt als Teil des übergreifenden Satzes offen und endet entsprechend mit einem Gedankenstrich. Die hebräischen parallelen Partizipialbeschreibungen werden für natürliches Deutsch mit einem Relativsatz und „und“ verbunden.
