  variant: modern standard German
source:
  edition: WLC
  text: לְ֭/גֶבֶר אֲשֶׁר דַּרְכּ֣/וֹ נִסְתָּ֑רָה וַ/יָּ֖סֶךְ אֱל֣וֹהַּ בַּעֲדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/023.yaml
  text: to a man whose way is hidden[b][a], and whom God has hedged in?
translation:
  language: de
  text: für einen Mann, dessen Weg verborgen ist[a] und den Gott ringsum eingeschlossen hat[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dessen Pfad verhüllt ist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Gott eingezäunt“ beziehungsweise „abgeriegelt hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְגֶבֶר
  choice: für einen Mann
  rationale: Die Präposition לְ führt, in Fortsetzung der rhetorischen Frage aus Vers 20, den Empfänger des Lichts ein. גֶּבֶר bezeichnet hier einen einzelnen Mann.
- source_word: אֲשֶׁר דַּרְכּוֹ
  choice: dessen Weg
  rationale: Die possessive Relativkonstruktion gibt den Bezug auf den Weg des Mannes natürlich wieder; „Weg“ bewahrt die mögliche Metapher für seinen Lebenslauf.
- source_word: נִסְתָּרָה
  choice: verborgen ist
  rationale: Die Nifalform bezeichnet einen Zustand des Verborgenseins. Die Formulierung lässt offen, wem der Weg verborgen ist.
- source_word: וַיָּסֶךְ
  choice: und … ringsum eingeschlossen hat
  rationale: Das Verb bezeichnet das Absperren oder Umschließen. „Ringsum eingeschlossen“ verbindet sich idiomatisch mit בַּעֲדוֹ und bewahrt das Bild, ohne eine konkrete Art der Einfriedung festzulegen.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Das poetische Singularwort für Gott wird schlicht mit „Gott“ wiedergegeben; eine Erweiterung wie „der Allmächtige“ wäre im Ausgangstext nicht begründet.
- source_word: בַּעֲדוֹ
  choice: den … ringsum
  rationale: Mit dem Verb des Umschließens bezeichnet die Präposition die Einhegung um den Mann herum; im Deutschen wird dies durch „den … ringsum eingeschlossen“ ausgedrückt.
theological_decisions:
- issue: Gottes unmittelbare Rolle beim Einschließen des Mannes
  choice: 'Gott bleibt ausdrücklich das Subjekt: „den Gott … eingeschlossen hat“.'
  alternative: Eine unpersönliche oder passive Formulierung, die Gottes Rolle abschwächt.
  rationale: אֱלוֹהַּ ist das ausdrückliche Subjekt des Verbs. Hiobs spannungsvolle Klage darf nicht dadurch entschärft werden, dass die göttliche Handlung verschleiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Fortsetzung der rhetorischen Frage aus Vers 20 fragmentarisch angebunden. „Mann“ entspricht der maskulinen Singularform; „Weg“ wahrt die bildhafte und zugleich lebensgeschichtliche Bedeutung. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
