  yaml_path: translation/ot/job/003/025.yaml
  text: For the dread I dreaded has come upon me[b][a], and what I feared has come to me.
translation:
  language: de
  text: Denn das Entsetzen, vor dem mir graute, ist über mich gekommen[a], und was ich fürchtete, ist zu mir gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denn Furcht fürchtete ich, und sie ist über mich gekommen.“ Das Hebräische verbindet ein Substantiv mit einem gleichstämmigen Verb und verstärkt dadurch die Aussage. Im zweiten Satzteil steht ein anderes Verb: „ist zu mir gekommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet bzw. erläutert hier Ijobs vorausgehende Klage; „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: פַחַד פָּחַדְתִּי
  choice: das Entsetzen, vor dem mir graute
  rationale: Die Wiedergabe bewahrt Substantiv und Verb und damit die eindringliche figura etymologica des Hebräischen, ohne im Deutschen unnatürlich zu klingen.
- source_word: וַיֶּאֱתָיֵנִי
  choice: ist über mich gekommen
  rationale: Das Verb bezeichnet hier das Eintreffen bzw. Hereinbrechen des gefürchteten Unheils. „Über mich gekommen“ passt zum Zusammenhang und unterscheidet sich von יָבֹא לִי im zweiten Satzglied.
- source_word: וַאֲשֶׁר
  choice: und was
  rationale: Die knappe Relativverbindung entspricht dem parallelen Aufbau und ist idiomatisches modernes Deutsch.
- source_word: יָגֹרְתִּי
  choice: ich fürchtete
  rationale: Das Verb bezeichnet Furcht oder Grauen. „Fürchtete“ ist klar und lässt zugleich die stärkere Formulierung des ersten Satzglieds hervortreten.
- source_word: יָבֹא לִי
  choice: ist zu mir gekommen
  rationale: Die einfache Wendung bewahrt die leichte Variation gegenüber „ist über mich gekommen“. Das deutsche Perfekt beschreibt das nun eingetretene Unheil angemessen.
