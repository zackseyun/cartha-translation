  text: יִקְּבֻ֥/הוּ אֹרְרֵי י֑וֹם הָ֝/עֲתִידִ֗ים עֹרֵ֥ר לִוְיָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/008.yaml
  text: Let those who curse days curse it, those ready to rouse Leviathan.
translation:
  language: de
  text: Verfluchen sollen ihn die, die Tage verfluchen, die bereit sind, Leviatan zu wecken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die imstande sind, Leviatan aufzureizen.'
    reason: הָעֲתִידִים kann „bereit“ oder „befähigt/imstande“ bedeuten; עֹרֵר kann neben „wecken“ auch „aufreizen“ bzw. „aufstören“ heißen.
lexical_decisions:
- source_word: יִקְּבֻהוּ
  choice: Verfluchen sollen ihn
  rationale: Der Jussiv wird als Wunsch bzw. Aufforderung wiedergegeben; das Suffix bezieht sich auf den zuvor genannten Tag.
- source_word: אֹרְרֵי יוֹם
  choice: die, die Tage verfluchen
  rationale: יוֹם steht formal im Singular, kann hier jedoch kollektiv bzw. als Klassenbezeichnung verstanden werden. Die deutsche Mehrzahl gibt diesen Sinn natürlich wieder und entspricht dem unmittelbaren Zusammenhang.
- source_word: הָעֲתִידִים
  choice: die imstande sind
  rationale: Das Wort bezeichnet hier Personen, die bereit oder befähigt sind; „imstande“ bewahrt diese Bedeutungsbreite.
- source_word: עֹרֵר
  choice: aufzuschrecken
  rationale: Der Infinitiv bedeutet erwecken, aufstören oder aufreizen. „Aufschrecken“ vermittelt das Heraufbeschwören und Beunruhigen des Leviatan, ohne die Wendung unnötig auszudeuten.
- source_word: לִוְיָתָן
  choice: Leviatan
  rationale: Der Eigenname bzw. die Bezeichnung des mythisch-chaotischen Wesens wird transliteriert und nicht durch eine Deutung ersetzt.
theological_decisions:
- issue: Identität und Funktion des Leviatan
  choice: Leviatan bleibt unkommentiert im Haupttext stehen.
  alternative: Leviatan ausdrücklich als Seeungeheuer, Drache oder mythologisches Chaoswesen deuten.
  rationale: Der hebräische Text benennt Leviatan, erklärt aber an dieser Stelle weder Identität noch Funktion abschließend. Die Übersetzung bewahrt diese Offenheit.
- issue: Bedeutung von אֹרְרֵי יוֹם
  choice: als „die, die Tage verfluchen“ wiedergegeben
  alternative: „die den Tag verfluchen“ oder „die den Tag verwünschen“
  rationale: Die Form ist singularisch, doch die Wendung kann eine Personengruppe bezeichnen, deren Tätigkeit das Verfluchen von Tagen ist. Die Mehrzahl vermeidet eine vorschnelle Beschränkung auf ausschließlich diesen einen Tag.
translation_notes:
  register: Poetisch, düster und würdevoll; die vorangestellte Verbform wahrt den Fluchwunsch. „Leviatan“ bleibt als traditionsreiche, heute verständliche Namensform erhalten.
