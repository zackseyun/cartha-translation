base_translation:
  language: en
  yaml_path: translation/ot/job/003/011.yaml
  text: Why did I not die from the womb[b][a], and come out from the belly and expire?
translation:
  language: de
  text: Warum starb ich nicht im Mutterleib? Warum kam ich aus dem Schoß hervor und verschied?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und starb“ oder „und hauchte mein Leben aus“. Das hier verwendete hebräische Verb unterscheidet sich von „starb“ im ersten Satzteil und kann das Verscheiden betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Warum
  rationale: Die natürliche deutsche Frage nach dem Grund; sie bewahrt den klagenden Ton.
- source_word: לֹא
  choice: nicht
  rationale: Einfache Verneinung des ersten Verbalsatzes.
- source_word: מֵרֶחֶם
  choice: schon im Mutterleib
  rationale: 'רֶחֶם bezeichnet den Mutterleib. Die Präposition מן kann hier zeitlich verstanden werden: Hiob fragt, warum er nicht bereits im Mutterleib starb.'
- source_word: אָמוּת
  choice: starb ich
  rationale: Der Imperfekt der 1. Person Singular wird in der rückblickenden Klage idiomatisch als vergangene Frage wiedergegeben.
- source_word: מִבֶּטֶן
  choice: aus dem Schoß
  rationale: בֶּטֶן bezeichnet hier den mütterlichen Leib. „Schoß“ wahrt gegenüber „Mutterleib“ die verwandte, aber unterschiedliche Bildsprache.
- source_word: יָצָאתִי
  choice: kam ich ... hervor
  rationale: Gibt die konkrete Bewegung des Herauskommens wieder, statt sie lediglich als „wurde geboren“ zu deuten.
- source_word: וְאֶגְוָע
  choice: und verschied
  rationale: גוע bezeichnet das Verscheiden beziehungsweise Aushauchen und bleibt damit von מות „sterben“ im ersten Halbvers unterschieden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Warum“ ist im Deutschen nötig, damit nicht fälschlich auch das Hervorkommen selbst verneint wird; das einzelne hebräische Fragewort erstreckt sich sinngemäß auf beide parallelen Fragen. „Mutterleib“ und „Schoß“ bilden die zwei verwandten, aber verschiedenen hebräischen Körperbegriffe ab.
