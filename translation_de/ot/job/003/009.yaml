source:
  edition: WLC
  text: יֶחְשְׁכוּ֮ כּוֹכְבֵ֪י נִ֫שְׁפּ֥/וֹ יְקַו לְ/א֥וֹר וָ/אַ֑יִן וְ/אַל יִ֝רְאֶ֗ה בְּ/עַפְעַפֵּי שָֽׁחַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/009.yaml
  text: May the stars of its twilight be dark[a]; may it wait for light, but there be none[b], and may it not see the eyelids of dawn.
translation:
  language: de
  text: Mögen die Sterne seiner Dämmerung dunkel werden[a]; es soll auf Licht warten, doch es gibt keines, und die Augenlider der Morgenröte soll es nicht sehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sterne seiner Abenddämmerung“. Das hebräische Wort kann die Dämmerung bezeichnen, besonders die Abenddämmerung.'
    reason: lexical_alternative
  - marker: b
    text: „Die Augenlider der Morgenröte“ ist ein hebräisches poetisches Bild für das erste Aufleuchten des Morgens.
    reason: cultural_note
lexical_decisions:
- source_word: יֶחְשְׁכוּ
  choice: sollen dunkel werden
  rationale: Das Qal-Imperfekt hat im Fluchzusammenhang einen Wunschcharakter. „Sollen dunkel werden“ gibt diesen im Deutschen natürlich wieder.
- source_word: כּוֹכְבֵי נִשְׁפּוֹ
  choice: die Sterne seiner Dämmerung
  rationale: Die Constructusverbindung und das Suffix werden bewahrt. נֶשֶׁף kann Dämmerung, besonders Abenddämmerung, bezeichnen; der Kontext legt die mit Sternen verbundene Dämmerung nahe.
- source_word: יְקַו לְאוֹר
  choice: es soll auf Licht warten
  rationale: קוה bezeichnet erwartungsvolles Warten oder Hoffen. „Warten“ erhält die Erwartung, ohne die personifizierte Nacht stärker zu psychologisieren.
- source_word: וָאַיִן
  choice: doch keines kommt
  rationale: Die knappe Negation bezeichnet das Ausbleiben des erwarteten Lichts. Die deutsche Formulierung macht den Gegensatz idiomatisch deutlich, ohne ein anderes Subjekt einzuführen.
- source_word: וְאַל יִרְאֶה
  choice: soll es nicht sehen
  rationale: אַל mit Imperfekt drückt hier einen negativen Wunsch aus und setzt die Verwünschung fort.
- source_word: בְּעַפְעַפֵּי שָׁחַר
  choice: die Augenlider der Morgenröte
  rationale: Die wörtliche, lebendige poetische Metapher wird erhalten. שַׁחַר wird mit dem im Deutschen bildkräftigen „Morgenröte“ wiedergegeben.
theological_decisions: []
