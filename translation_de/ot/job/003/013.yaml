source:
  edition: WLC
  text: כִּֽי עַ֭תָּה שָׁכַ֣בְתִּי וְ/אֶשְׁק֑וֹט יָ֝שַׁ֗נְתִּי אָ֤ז יָנ֬וּחַֽ לִֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/013.yaml
  text: For now I would have lain down and been quiet[b][a]; I would have slept—then I would have been at rest.
translation:
  language: de
  text: Denn jetzt läge ich da und wäre still[a]; ich schliefe – dann hätte ich Ruhe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und wäre ungestört«; auch »und hätte Frieden« ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »dann wäre Ruhe für mich«; auch: »dann könnte ich ruhen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung zu Ijobs vorausgehendem Wunsch ein und bewahrt die kausale Funktion natürlich im Deutschen.
- source_word: עַתָּה
  choice: jetzt
  rationale: Bezeichnet das gegenwärtige, jedoch nicht eingetretene Ergebnis seines Todes bei der Geburt; der Konjunktiv II macht den irrealen Sinn deutlich.
- source_word: שָׁכַבְתִּי
  choice: läge ich da
  rationale: Bewahrt das körperliche Bild des Liegens und gibt den im Kontext gemeinten irrealen Zustand idiomatisch mit dem Konjunktiv II wieder.
- source_word: וְאֶשְׁקֹט
  choice: und wäre still
  rationale: Gibt den Zustand ungestörter Ruhe eng am hebräischen Verb wieder, ohne ihn ausdrücklich als Frieden oder Tod auszudeuten.
- source_word: יָשַׁנְתִּי
  choice: ich schliefe
  rationale: Bewahrt das gewöhnliche Verb für Schlaf und damit das poetische Todesbild, ohne die Metapher erklärend aufzulösen.
- source_word: אָז
  choice: dann
  rationale: Markiert knapp und natürlich die folgende Stufe der poetischen Gedankenfolge.
- source_word: יָנוּחַ לִי
  choice: dann hätte ich Ruhe
  rationale: Gibt die hebräische Konstruktion mit לִי in natürlichem Deutsch als persönlichen Zustand der Ruhe wieder; die wörtlichere unpersönliche Fassung wird in der Fußnote genannt.
theological_decisions:
- issue: Todesbild durch Liegen, Schlafen und Ruhen
  choice: Die konkreten Bilder des Liegens, Schlafens und Ruhens bleiben erhalten.
  alternative: Die Bilder ausdrücklich als „tot sein“ oder „im Tod ruhen“ wiederzugeben.
  rationale: Der Vers spricht poetisch von der ersehnten Ruhe des Todes, formuliert jedoch mit gewöhnlichen Verben. Die Übersetzung bewahrt diese Bildsprache und legt keine weitergehende Lehre über den Zustand der Toten fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konjunktiv II bildet den irrealen Rückblick ab; die knappe Parallelstruktur und der Gedankenstrich bewahren den poetischen Rhythmus.
