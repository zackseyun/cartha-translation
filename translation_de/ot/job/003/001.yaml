  text: אַחֲרֵי כֵ֗ן פָּתַ֤ח אִיּוֹב֙ אֶת פִּ֔י/הוּ וַ/יְקַלֵּ֖ל אֶת יוֹמֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/003/001.yaml
  text: After this[a], Job opened his mouth and cursed his day.
translation:
  language: de
  text: Danach öffnete Hiob seinen Mund und verfluchte seinen Tag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Tag seiner Geburt“. Wörtlich steht im Hebräischen: „seinen Tag“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: Danach
  rationale: Die Wendung markiert eine zeitliche Folge. „Danach“ ist knapp, natürlich und entspricht dem erzählerischen Übergang.
- source_word: פָּתַח ... אֶת פִּיהוּ
  choice: öffnete … seinen Mund
  rationale: Die bildhafte hebräische Redeformel wird bewahrt; sie leitet Hiobs feierlich gewichtige Rede ein, statt sie zu „begann zu sprechen“ einzuebnen.
- source_word: אִיּוֹב
  choice: Hiob
  rationale: Die im Deutschen etablierte Form des Eigennamens.
- source_word: וַיְקַלֵּל
  choice: verfluchte
  rationale: Das Piel von קלל bezeichnet hier ein Verfluchen. Die deutliche Aussage des Textes wird nicht abgeschwächt.
- source_word: אֶת יוֹמוֹ
  choice: seinen Tag
  rationale: Dies gibt den knappen hebräischen Ausdruck wörtlich wieder. Der folgende Zusammenhang macht deutlich, dass der Tag seiner Geburt gemeint ist.
theological_decisions:
- issue: Ob ausdrücklich gesagt werden soll, dass „sein Tag“ Hiobs Geburtstag beziehungsweise den Tag seiner Geburt bezeichnet
  choice: Im Haupttext bleibt die knappe Formulierung „seinen Tag“ erhalten.
  alternative: „den Tag seiner Geburt“ oder „seinen Geburtstag“
  rationale: Der hebräische Vers nennt die Geburt hier noch nicht ausdrücklich; erst der folgende Zusammenhang erklärt den Bezug. Die Übersetzung bewahrt daher die schrittweise Entfaltung und löst die knappe Formulierung nicht vorzeitig auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber verständliche Wendung „öffnete … seinen Mund“ bewahrt bewusst die feierliche hebräische Redeformel.
