  source_fidelity: Der jussivische Fluchwunsch wird mit „soll“ grundsätzlich angemessen wiedergegeben. „Vergehen“ bedeutet bei einem Tag jedoch gewöhnlich schlicht „ablaufen“ und schwächt יֹאבַד („zugrunde gehen, umkommen, verloren gehen“) entscheidend ab. „zugrunde gehen“ gibt den Untergangswunsch eindeutig wieder. Die Personifikation der Nacht, die passive Aussage über die Empfängnis und die männliche Markierung von גבר bleiben gewahrt.
