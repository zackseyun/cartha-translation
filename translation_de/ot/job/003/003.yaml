base_translation:
  language: en
  yaml_path: translation/ot/job/003/003.yaml
  text: May the day perish on which I was born[a], and the night that said, ‘A man is conceived.’
translation:
  language: de
  text: 'Zugrunde gehen soll der Tag, an dem ich geboren wurde, und die Nacht, die sprach: »Ein Mann[a] ist empfangen worden!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein männliches Kind ist empfangen worden.«'
    reason: 'Lexikalische Alternative: גבר bezeichnet einen männlichen Menschen und kann hier im Zusammenhang der Empfängnis ein männliches Kind meinen.'
lexical_decisions:
- source_word: יֹאבַד
  choice: soll vergehen
  rationale: Die Soll-Form gibt den jussivischen Fluchwunsch wieder und vermeidet die Aussage einer bloßen zukünftigen Tatsache.
- source_word: יוֹם
  choice: der Tag
  rationale: Gemeint ist in diesem Zusammenhang der bestimmte Tag von Hiobs Geburt.
- source_word: אִוָּלֶד בּוֹ
  choice: an dem ich geboren wurde
  rationale: Der Nifal von ילד bezeichnet hier das Geborenwerden; bei einem Tag ist »an dem« im Deutschen idiomatisch.
- source_word: וְהַלַּיְלָה
  choice: und die Nacht
  rationale: Die Nacht steht als zweites Glied parallel zum Tag und wird ebenfalls in den Fluchwunsch einbezogen.
- source_word: אָמַר
  choice: die sprach
  rationale: Die Formulierung bewahrt die Personifikation der Nacht; »sprach« passt zum würdevollen poetischen Register.
- source_word: הֹרָה
  choice: ist empfangen worden
  rationale: Die passive deutsche Form bezeichnet die erfolgte Empfängnis, ohne die Nacht zum empfangenden Subjekt zu machen.
- source_word: גָבֶר
  choice: ein Mann
  rationale: »Mann« bildet die männliche Bezeichnung גבר formal ab; weil im Zusammenhang auch ein männliches Kind gemeint sein kann, wird diese Sinnmöglichkeit in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die vorangestellte Verwünschung wird im Deutschen natürlich als Soll-Satz formuliert; die Personifikation der Nacht und die Spannung der ungewöhnlichen Wendung »ein Mann ist empfangen worden« bleiben erhalten.
