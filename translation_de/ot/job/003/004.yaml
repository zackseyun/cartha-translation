  yaml_path: translation/ot/job/003/004.yaml
  text: May that day be darkness[a]; may God above not seek it[b], and may no light shine upon it.
translation:
  language: de
  text: Möge jener Tag Finsternis sein; Gott von oben frage nicht nach ihm[a], und kein Lichtglanz leuchte über ihm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „möge sich nicht um ihn kümmern“. Das hebräische Verb kann „suchen“, „nach etwas fragen“, „beachten“ oder „sich um etwas kümmern“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „keine Helligkeit“ beziehungsweise „kein Licht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַהוּא
  choice: dieser Tag
  rationale: Die Wendung verweist auf den zuvor genannten Tag von Ijobs Geburt. Im Deutschen nimmt „dieser Tag“ den unmittelbaren Rückbezug natürlich auf.
- source_word: יְהִי חֹשֶׁךְ
  choice: soll Finsternis sein
  rationale: Der Jussiv drückt einen verwünschenden Wunsch aus. „Soll … sein“ bewahrt diese Kraft und gibt das Substantiv חֹשֶׁךְ formal als „Finsternis“ wieder.
- source_word: יִדְרְשֵׁהוּ
  choice: soll nicht nach ihm fragen
  rationale: דרש kann „suchen“, „nach etwas fragen“ oder im Kontext „sich darum kümmern“ bedeuten. „Nach ihm fragen“ erhält das hebräische Bild und lässt die Bedeutung des Beachtens offen.
- source_word: אֱלוֹהַּ מִמָּעַל
  choice: Gott droben
  rationale: אֱלוֹהַּ bezeichnet in der poetischen Sprache des Ijobbuches Gott; מִמָּעַל gibt die räumliche Perspektive „von oben/droben“ an. Die knappe Fügung passt zum poetischen Register.
- source_word: תּוֹפַע
  choice: soll … erstrahlen
  rationale: Das Verb יפע bezeichnet leuchtendes Hervortreten oder Aufstrahlen. „Erstrahlen“ bildet dies idiomatisch und poetisch ab.
- source_word: נְהָרָה
  choice: Lichtglanz
  rationale: Das seltene Substantiv bezeichnet Helligkeit, Licht oder Glanz. „Lichtglanz“ wahrt die konkrete Lichtvorstellung und die erhöhte poetische Sprache, ohne die Bedeutung auf Tageslicht einzuengen.
- source_word: עָלָיו
  choice: über ihm
  rationale: Das Pronomen bezieht sich auf den grammatisch maskulinen „Tag“. „Über ihm“ gibt die räumliche Beziehung natürlich wieder.
theological_decisions:
- issue: Direkte Nennung Gottes in Ijobs Verwünschung
  choice: „Gott droben“ unverändert als handelndes Subjekt beibehalten
  alternative: „der Himmel droben“ oder eine unpersönliche Umschreibung
  rationale: Der hebräische Text nennt ausdrücklich Gott. Ijobs kühne Klage darf nicht theologisch abgeschwächt werden.
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Die parallelen Jussive werden einheitlich mit „soll“ wiedergegeben; „Finsternis“, „droben“ und „erstrahlen“ tragen den gehobenen Klagecharakter, ohne archaische Satzformen zu verwenden.
