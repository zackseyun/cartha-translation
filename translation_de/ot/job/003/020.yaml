base_translation:
  language: en
  yaml_path: translation/ot/job/003/020.yaml
  text: Why is light given to the troubled[b][a], and life to the bitter in soul?
translation:
  language: de
  text: Warum wird dem Geplagten Licht gegeben[a] und denen mit bitterer Seele Leben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum gibt er dem Geplagten Licht und denen mit bitterer Seele Leben?“ Der hebräische Text nennt den Geber nicht ausdrücklich; im Zusammenhang ist vermutlich Gott gemeint. „Licht“ ist hier ein poetisches Bild für das fortdauernde Dasein.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה
  choice: Warum
  rationale: Das Frageadverb eröffnet Hiobs Klage unmittelbar und bewahrt ihre eindringliche Kürze.
- source_word: יִתֵּן
  choice: wird … gegeben
  rationale: Die unpersönliche Passivform gibt den Sinn des hebräischen Verbs wieder, ohne den im Hebräischen nicht ausdrücklich genannten Geber als Gott zu benennen.
- source_word: לְעָמֵל
  choice: dem Elenden
  rationale: עָמֵל bezeichnet hier einen Menschen in Mühsal und tiefem Leid, nicht bloß einen Arbeitenden. „Elender“ ist im Deutschen natürlich und dem Klagekontext angemessen.
- source_word: אוֹר
  choice: Licht
  rationale: Das poetische Bild des Hebräischen wird beibehalten; im Zusammenhang steht Licht für das fortdauernde Dasein.
- source_word: וְחַיִּים
  choice: und Leben
  rationale: חַיִּים ist formal pluralisch, bezeichnet idiomatisch aber das Leben und wird im Deutschen natürlich im Singular wiedergegeben.
- source_word: לְמָרֵי נָפֶשׁ
  choice: denen, deren Seele verbittert ist
  rationale: Die Formulierung bewahrt sowohl die Verbitterung als auch נֶפֶשׁ als Bezeichnung des inneren Menschen und klingt zugleich in modernem Deutsch verständlich.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von יִתֵּן
  choice: Der Geber bleibt durch die Passivform „wird … gegeben“ ungenannt.
  alternative: „Warum gibt er dem Elenden Licht …?“ oder ausdrücklich „Warum gibt Gott …?“
  rationale: Im Kontext ist Gott wahrscheinlich als Geber vorausgesetzt, doch der hebräische Vers nennt ihn nicht. Die Übersetzung bewahrt diese Zurückhaltung und damit die Spannung in Hiobs Klage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. Die Satzstellung folgt natürlichem Deutsch, ohne die implizite Urheberschaft oder die Seelenmetaphorik zu glätten.
