  yaml_path: translation/ot/job/003/006.yaml
  text: As for that night[a], let darkness seize it; let it not rejoice among the days of the year; let it not enter into the number of the months.
translation:
  language: de
  text: 'Jene Nacht: Möge Finsternis sie ergreifen! Sie soll sich nicht unter den Tagen des Jahres freuen[a] und nicht in die Zahl der Monate eingehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie soll nicht zu den Tagen des Jahres gehören.“ Das hier verwendete hebräische Verb ist selten; manche verstehen es als Ausschluss aus dem Kalender statt als Ausdruck fehlender Freude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלַּיְלָה הַהוּא
  choice: Jene Nacht aber
  rationale: Die vorangestellte Wortgruppe hebt die Nacht als Thema hervor. „Jene Nacht aber“ gibt diese markierte Stellung natürlich und würdevoll wieder.
- source_word: יִקָּחֵהוּ
  choice: soll sie ergreifen
  rationale: לקח bedeutet wörtlich „nehmen“. Mit der personifiziert handelnden Finsternis vermittelt „ergreifen“ die feindliche Inbesitznahme, ohne den Ausdruck unnötig auszudeuten.
- source_word: אֹפֶל
  choice: Finsternis
  rationale: אֹפֶל bezeichnet Dunkelheit oder tiefes Dunkel. „Finsternis“ passt zum poetischen Register und bewahrt die personifizierende Wirkung.
- source_word: אַל יִחַדְּ
  choice: Sie soll sich nicht freuen
  rationale: Die seltene Verbform ist umstritten. Eine mögliche Deutung bezieht sie auf freudige Teilnahme; diese wird im Haupttext erhalten, während die kalenderbezogene Deutung „sich anschließen/zugerechnet werden“ in der Fußnote genannt wird.
- source_word: בִּימֵי שָׁנָה
  choice: unter den Tagen des Jahres
  rationale: Die Präposition ב bezeichnet hier die Zugehörigkeit zu einer Gruppe. „Unter den Tagen des Jahres“ bewahrt zugleich den poetischen und den inklusiven Sinn.
- source_word: בְּמִסְפַּר יְרָחִים
  choice: in die Zahl der Monate
  rationale: Die Formulierung erhält das konkrete Bild des Zählens und der Aufnahme in eine gezählte Reihe.
- source_word: אַל יָבֹא
  choice: nicht eingehen
  rationale: בוא bedeutet „kommen“ oder „eingehen“. Zusammen mit „in die Zahl“ ist „eingehen“ im Deutschen eine natürliche und zugleich formnahe Wiedergabe.
