  register: Moderne, würdige Standardsprache mit poetischer Parallelität. Das maskuline Pronomen »ihn« nimmt den in Vers 3 genannten »Tag« wieder auf. Die drei Wunsch- beziehungsweise Fluchsätze werden durch Semikola verbunden; ungewöhnliche Bildsprache und lexikalische Mehrdeutigkeit bleiben erhalten.
