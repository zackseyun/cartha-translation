  text: יִגְאָלֻ֡/הוּ חֹ֣שֶׁךְ וְ֭/צַלְמָוֶת תִּשְׁכָּן עָלָ֣י/ו עֲנָנָ֑ה יְ֝בַעֲתֻ֗/הוּ כִּֽמְרִ֥ירֵי יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/005.yaml
  text: May darkness and deep shadow reclaim it[a]; may a cloud dwell over it[b]; may the blacknesses of the day terrify it.
translation:
  language: de
  text: Finsternis und tiefes Dunkel[a] sollen ihn zurückfordern; eine Wolke soll sich über ihm niederlassen; die Verdunkelungen des Tages[b] sollen ihn in Schrecken versetzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Todesschatten«; traditionell auch »Schatten des Todes« für צַלְמָוֶת.
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung ist schwierig. Möglich sind auch »die Schwärze des Tages«, »die Verfinsterungen des Tages« beziehungsweise »Sonnenfinsternisse« oder, weniger wahrscheinlich, »die Bitterkeiten des Tages«.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָלֻהוּ
  choice: sollen ihn zurückfordern
  rationale: גאל bezeichnet das Zurückfordern oder Auslösen dessen, worauf ein Anspruch besteht. Im Fluchzusammenhang vermeidet »zurückfordern« die im Deutschen meist positive Erlösungsbedeutung und zeichnet das Bild, dass die Finsternis den Tag wieder an sich nimmt.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: Die gewöhnliche Bedeutung passt zur poetischen Rücknahme des Geburtstages ins Dunkel.
- source_word: צַלְמָוֶת
  choice: Todesschatten
  rationale: Die traditionelle Deutung bewahrt die eindringliche Bildsprache; da das Wort auch allgemeiner »tiefste Dunkelheit« bedeuten kann, wird diese echte lexikalische Unsicherheit in einer Fußnote offengehalten.
- source_word: תִּשְׁכָּן עָלָיו
  choice: soll sich über ihm niederlassen
  rationale: שׁכן bedeutet wohnen, sich niederlassen oder bleiben. Bei einer Wolke gibt »sich über ihm niederlassen« das Bild natürlich wieder, ohne die Dauerhaftigkeit ganz aufzugeben.
- source_word: עֲנָנָה
  choice: eine Wolke
  rationale: Das konkrete meteorologische Bild wird als singularische Wolke wiedergegeben.
- source_word: יְבַעֲתֻהוּ
  choice: sollen ihn in Schrecken versetzen
  rationale: Das Piel von בעת drückt das Verursachen heftigen Schreckens oder Entsetzens aus; die Formulierung erhält diese Intensität.
- source_word: כִּמְרִירֵי יוֹם
  choice: die Verdüsterungen des Tages
  rationale: Die schwierige Pluralform wird im Kontext von Finsternis und Wolke am ehesten als dunkle Erscheinungen oder Verdunkelungen verstanden. »Verdüsterungen« bewahrt den Plural und die ungewöhnliche poetische Wendung, ohne eine einzelne Deutung wie Sonnenfinsternisse festzuschreiben.
