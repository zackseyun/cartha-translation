source:
  edition: WLC
  text: א֤וֹ כְ/נֵ֣פֶל טָ֭מוּן לֹ֣א אֶהְיֶ֑ה כְּ֝/עֹלְלִ֗ים לֹא רָ֥אוּ אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/016.yaml
  text: Or like a hidden miscarriage[a], I would not be[b], like infants who never saw light.
translation:
  language: de
  text: Oder wäre ich nicht da wie eine verborgene Fehlgeburt[a], wie Säuglinge, die nie das Licht sahen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein verborgenes totgeborenes Kind“. Das hebräische Wort kann eine Fehlgeburt oder eine Totgeburt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: Oder
  rationale: Leitet eine weitere Möglichkeit in Hiobs Gedankenfolge ein und entspricht der schlichten Alternative des Hebräischen.
- source_word: כְנֵפֶל
  choice: wie eine Fehlgeburt
  rationale: Das Substantiv נֵפֶל kann eine Fehlgeburt oder ein tot geborenes Kind bezeichnen. „Fehlgeburt“ ist im heutigen Deutsch unmittelbar verständlich; die weitere Bedeutung bleibt in der Fußnote erhalten.
- source_word: טָמוּן
  choice: verborgene
  rationale: Das passive Partizip von טמן bedeutet „verborgen“ oder „versteckt“. Die Wiedergabe wahrt das Bild, ohne es ausdrücklich als Begräbnis zu deuten.
- source_word: לֹא אֶהְיֶה
  choice: ich wäre nicht da
  rationale: Die Form bedeutet wörtlich „ich wäre nicht“. „Nicht da sein“ drückt die gemeinte Nichtexistenz natürlich aus, ohne die knappe Aussage unnötig zu erklären.
- source_word: כְעֹלְלִים
  choice: wie Säuglinge
  rationale: עֹלְלִים bezeichnet sehr kleine Kinder; „Säuglinge“ passt zu den hier genannten Kindern, die das Licht nie sahen.
- source_word: לֹא רָאוּ אוֹר
  choice: die das Licht nie sahen
  rationale: Bewahrt das hebräische Bild vom Sehen des Lichts als Eintritt in beziehungsweise Erfahrung des irdischen Lebens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Parallelstruktur und das Bild vom „Licht sehen“ bleiben erhalten. „Nicht da“ gibt die Aussage über Nichtexistenz natürlich wieder, ohne eine weitergehende theologische Deutung einzutragen.
