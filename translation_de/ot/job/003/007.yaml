  text: Sieh, jene Nacht sei unfruchtbar; kein Jubelruf komme in sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Gibt den aufmerksamkeitslenkenden Ausruf knapp und würdevoll wieder.
- source_word: גַלְמוּד
  choice: unfruchtbar
  rationale: Im Zusammenhang der verfluchten Geburtsnacht bezeichnet das seltene Wort eine Nacht, die ohne Geburt und damit ohne Frucht bleiben soll; zugleich klingt Verlassenheit an.
- source_word: רְנָנָה
  choice: Jubelruf
  rationale: Bezeichnet einen lauten Freudenschrei oder Jubel; hier wahrscheinlich den Jubel über eine Geburt.
- source_word: תָּבוֹא ... בּוֹ
  choice: dringe in sie ein
  rationale: Bewahrt die räumliche Metapher des Hebräischen, nach der kein Jubel in die personifizierte Nacht hineinkommen soll.
theological_decisions:
- issue: Reichweite von Ijobs Verwünschung
  choice: Die Nacht wird poetisch als unfruchtbar und ohne Jubel gewünscht.
  alternative: Die Nacht wird als einsam oder verödet bezeichnet.
  rationale: Die Übersetzung hält die Bildsprache der Klage fest, ohne Ijobs Worte als sachliche Aussage über Gottes Handeln oder als Lehrsatz umzudeuten.
translation_notes:
  register: Moderne, gehobene Standardsprache mit poetischer Knappheit. „Sieh“ wahrt den Ausrufcharakter; „Jubelruf“ ist verständlich und bildet den hörbaren Geburtsjubel ab.
