base_translation:
  language: en
  yaml_path: translation/ot/job/003/017.yaml
  text: There the wicked cease from turmoil[b][a], and there those weary in strength find rest.
translation:
  language: de
  text: Dort hört das Toben der Frevler auf[a], und dort ruhen die, deren Kraft erschöpft ist[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unruhe“, „Erregung“ oder „Aufruhr“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die an Kraft Erschöpften“ bzw. „die Erschöpften der Kraft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Dort
  rationale: Das Ortsadverb verweist auf den in Hiobs Klage beschriebenen Bereich; „Dort“ ist natürlich und bewahrt die poetische Wiederholung.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: Das substantivierte Adjektiv bezeichnet moralisch böse Menschen. „Frevler“ ist im poetisch-biblischen Register knapp und verständlich, ohne eine konkrete juristische Schuldbehauptung einzutragen.
- source_word: חָדְלוּ
  choice: hören … auf
  rationale: Das Qal-Perfekt von חדל bedeutet „aufhören, ablassen“. Im Deutschen gibt das Präsens die allgemeine Beschreibung des Ortes im Kontext angemessen wieder.
- source_word: רֹגֶז
  choice: zu wüten
  rationale: Das Nomen kann Unruhe, Erregung, Toben oder Wüten bezeichnen. Zusammen mit חדל wird die substantivische Wendung im Deutschen idiomatisch verbal wiedergegeben; die Bedeutungsbreite wird in einer Fußnote kenntlich gemacht.
- source_word: וְשָׁם
  choice: und dort
  rationale: Die Wiederholung des Ortsadverbs samt Konjunktion bewahrt Parallelismus und Nachdruck der hebräischen Zeile.
- source_word: יָנוּחוּ
  choice: ruhen
  rationale: נוח bedeutet „ruhen, zur Ruhe kommen“. „Ruhen“ ist knapp, natürlich und erhält die poetische Aussage.
- source_word: יְגִיעֵי כֹחַ
  choice: die, deren Kraft erschöpft ist
  rationale: Die wörtliche Fügung „die Müden/Erschöpften der Kraft“ bezeichnet Menschen, deren Kraft aufgebraucht ist. Die gewählte Formulierung ist verständliches modernes Deutsch und hält כֹּחַ ausdrücklich fest.
theological_decisions:
- issue: Aussage über den Zustand der Frevler und Erschöpften am beschriebenen Ort
  choice: Die poetische Aussage wird ohne dogmatische Ausdeutung als Teil von Hiobs Klage wiedergegeben.
  alternative: Den Ort oder die Ruhe ausdrücklich als bestimmte Lehre über das Jenseits zu definieren.
  rationale: Der Vers selbst beschreibt den Ort poetisch, legt aber keine ausgearbeitete Jenseitslehre dar; diese Spannung darf nicht durch erklärende Zusätze aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Die zweimalige Ortsangabe „dort“ bleibt erhalten; die ungewöhnliche hebräische Fügung יְגִיעֵי כֹחַ wird verständlich wiedergegeben und zugleich in der Fußnote transparent gemacht.
