  text: because it did not shut the doors of my womb[b][a], nor hide trouble from my eyes.
translation:
  language: de
  text: Denn sie schloss die Türen meines Mutterleibs[a] nicht und verbarg die Mühsal[b] nicht vor meinen Augen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „meines Bauches“. Im Zusammenhang ist der Mutterleib gemeint, aus dem Hiob geboren wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Leid“, „das Elend“ oder „die Not“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet im Zusammenhang Hiobs vorausgehenden Fluch. „Denn“ bewahrt den kausalen Anschluss und klingt in poetischer Klage natürlich.
- source_word: סָגַר
  choice: schloss
  rationale: Das Verb bezeichnet das Schließen oder Verschließen; zusammen mit „Türen“ gibt „schloss“ das konkrete Bild schlicht wieder.
- source_word: דַּלְתֵי
  choice: Türen
  rationale: Das Wort bezeichnet Türen beziehungsweise Türflügel. „Türen“ bewahrt das Bild des verschlossenen Zugangs zum Mutterleib.
- source_word: בִטְנִי
  choice: meines Mutterleibs
  rationale: בטן kann Bauch oder Mutterleib bedeuten. Im Zusammenhang mit Hiobs Geburt ist „Mutterleib“ die naheliegende Bedeutung; die ungewöhnliche possessive Form des Hebräischen bleibt erhalten.
- source_word: וַיַּסְתֵּר
  choice: und verbarg so ... nicht
  rationale: 'Die vorausgehende Verneinung gilt sinngemäß auch für den zweiten Vorgang. „so“ macht den Folgezusammenhang verständlich: Hätte die Nacht den Mutterleib verschlossen, wäre Hiob die spätere Mühsal verborgen beziehungsweise erspart geblieben.'
- source_word: עָמָל
  choice: Mühsal
  rationale: Der Ausdruck umfasst belastende Arbeit, Not, Leid und Elend. „Mühsal“ wahrt diese Breite und passt zum poetischen Register der Klage.
- source_word: מֵעֵינָי
  choice: vor meinen Augen
  rationale: Dies ist eine natürliche deutsche Wiedergabe des hebräischen Bildes und lässt sowohl das Sehen als auch das Erleben der Mühsal anklingen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Sprache mit bewahrtem poetischem Bild. Das feminine Pronomen „sie“ nimmt im Kontext die zuvor erwähnte Nacht auf. Die Formulierung vermeidet eine konfessionelle Deutung und erhält die Mehrdeutigkeit von עָמָל durch eine Fußnote.
