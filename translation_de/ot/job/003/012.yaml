  register: Modernes, würdiges Standarddeutsch. Die konkrete und fremdartige Metapher „Knie“ bleibt im Haupttext erhalten; die Fußnote erläutert den wahrscheinlichen kulturellen Hintergrund. Die Satzstellung wahrt den poetischen Parallelismus.
