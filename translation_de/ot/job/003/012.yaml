  text: מַ֭דּוּעַ קִדְּמ֣וּ/נִי בִרְכָּ֑יִם וּ/מַה שָּׁ֝דַ֗יִם כִּ֣י אִינָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/012.yaml
  text: Why did knees receive me[a], and why breasts[b], that I should nurse?
translation:
  language: de
  text: Warum empfingen mich Knie,[a] und warum Brüste, damit ich saugen konnte?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den „Knien“ ist wahrscheinlich gemeint, dass das Neugeborene bei der Geburt auf den Knien oder im Schoß aufgenommen wurde.
    reason: cultural_note
  - marker: b
    text: Das hebräische Verb bezeichnet das Saugen eines Säuglings; es kann auch mit „an der Brust trinken“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Das Frageadverb eröffnet Hiobs Klage unmittelbar; „Warum“ gibt seine direkte Kraft natürlich wieder.
- source_word: קִדְּמוּנִי
  choice: nahmen mich … auf
  rationale: קדם bedeutet hier, jemandem entgegenzukommen beziehungsweise ihn zu empfangen. Zusammen mit „Knien“ bezeichnet es wahrscheinlich die Aufnahme des Neugeborenen bei der Geburt.
- source_word: בִרְכָּיִם
  choice: Knie
  rationale: Der konkrete Plural wird bewahrt, obwohl damit kulturell wohl die Aufnahme des Neugeborenen auf den Knien oder im Schoß gemeint ist.
- source_word: וּמַה
  choice: und warum
  rationale: Wörtlich steht „und was“, doch im parallelen Fragesatz setzt es die Warum-Frage des ersten Halbverses fort.
- source_word: שָׁדַיִם
  choice: Brüste
  rationale: Der anatomische Ausdruck entspricht dem Hebräischen; „der Mutter“ wird nicht ergänzt, da dies zwar naheliegt, aber nicht ausdrücklich dasteht.
- source_word: כִּי
  choice: damit
  rationale: כִּי leitet hier am natürlichsten einen Zweck- oder Folgesatz ein, der sich auf die Brüste bezieht.
- source_word: אִינָק
  choice: ich trinken konnte
  rationale: Das Verb bezeichnet das Saugen eines Säuglings an der Brust. „Trinken“ ist im Deutschen natürlich und eindeutig; die genauere Bildlichkeit wird in der Fußnote genannt.
theological_decisions: []
