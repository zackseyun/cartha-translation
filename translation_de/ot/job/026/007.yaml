  text: He stretches out the north over emptiness[b][a]; he hangs the earth on nothing.
translation:
  language: de
  text: Er spannt den Norden[a] über der Leere[b] aus; er hängt die Erde über dem Nichts auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den nördlichen Himmel“. Im Hebräischen steht lediglich „den Norden“, was in diesem poetischen Zusammenhang den nördlichen Himmel bezeichnen kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die formlose Leere“ oder „die Öde“. Das hebräische Wort kann Leere, Öde oder einen ungeformten Zustand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: spannt … aus
  rationale: Das Qal-Partizip von נטה bezeichnet ein Ausspannen oder Ausbreiten. „spannt … aus“ bewahrt das räumliche, kosmologische Bild und klingt im Deutschen natürlich.
- source_word: צָפוֹן
  choice: den Norden
  rationale: Das Substantiv bedeutet gewöhnlich „Norden“. Im poetischen Zusammenhang kann damit der nördliche Himmel gemeint sein; die wörtlichere Wiedergabe hält diese Deutung offen.
- source_word: תֹּהוּ
  choice: der Leere
  rationale: תֹּהוּ kann Leere, Öde oder formlose Leere bezeichnen. „Leere“ ist verständlich und bewahrt die Unbestimmtheit des Ausdrucks.
- source_word: תֹּלֶה
  choice: hängt … auf
  rationale: Das Qal-Partizip von תלה bedeutet „hängen“ oder „aufhängen“. Die Formulierung gibt das Bild einer frei aufgehängten Erde direkt wieder.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Im kosmischen Zusammenhang bezeichnet אֶרֶץ die Erde beziehungsweise die Welt, nicht ein bestimmtes Land.
- source_word: בְּלִי מָה
  choice: dem Nichts
  rationale: Die Wendung bedeutet „ohne irgendetwas“ beziehungsweise „nichts“. Zusammen mit עַל ergibt sich idiomatisch „über dem Nichts“.
- source_word: עַל
  choice: über der / über dem
  rationale: Die Präposition hat hier in beiden Halbversen einen räumlichen Sinn. „über“ bewahrt zudem die auffällige Wiederholung desselben hebräischen Wortes.
theological_decisions:
- issue: Kosmologische Bildsprache
  choice: Der Vers wird als poetische Beschreibung von Gottes souveränem Handeln an der Schöpfung wiedergegeben, ohne moderne naturwissenschaftliche Aussagen hineinzulesen.
  alternative: Den Vers als präzise moderne Aussage über eine im Weltraum schwebende Erde zu behandeln oder „Norden“ ausdrücklich mythologisch auszudeuten.
  rationale: Die hebräische Weisheitsdichtung stellt Gottes Macht über den Kosmos bildhaft dar. Die Übersetzung bewahrt die Aussagen und ihre Spannung, ohne sie wissenschaftlich oder mythologisch festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper poetischer Parallelität. Die Wiederholung von עַל wird durch zweimaliges „über“ hörbar gemacht; „der Norden“ bleibt bewusst deutungsoffen.
