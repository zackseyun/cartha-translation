- from: Er zog einen Kreis über die Wasserfläche[a], bis an die Grenze von Licht und Finsternis.
  to: Er zog einen Kreis auf der Wasseroberfläche, bis zur Grenze zwischen Licht und Finsternis.[a]
  rationale: Die Revision beseitigt eine im Deutschen mögliche räumliche Fehllektüre von „über“ und glättet die Grenzformulierung. Das knappe, poetische Bild des hebräischen Textes und die im englischen Audit Trail dokumentierte Alternative bleiben erhalten.
