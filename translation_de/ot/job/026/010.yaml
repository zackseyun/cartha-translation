  text: חֹֽק חָ֭ג עַל פְּנֵי מָ֑יִם עַד תַּכְלִ֖ית א֣וֹר עִם חֹֽשֶׁךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/010.yaml
  text: He inscribed a circle on the surface of the waters[a], at the boundary of light and darkness.
translation:
  language: de
  text: Er zog einen Kreis auf der Wasseroberfläche, bis zur Grenze zwischen Licht und Finsternis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Er setzte auf der Wasseroberfläche eine Grenze, bis zu dem Punkt, an dem Licht und Finsternis zusammentreffen.'
    reason: Die Verbindung חֹק חָג kann entweder das Ziehen eines Kreises oder das Festsetzen einer kreisförmigen Grenze hervorheben; auch עַל kann räumlich als „auf“ oder „über“ verstanden werden.
lexical_decisions:
- source_word: חֹק חָג
  choice: zog einen Kreis
  rationale: חֹק bezeichnet hier eine festgelegte Grenze, während חָג das kreisförmige Ziehen oder Abstecken ausdrückt. „zog einen Kreis“ bewahrt das konkrete Bild einer markierten, kreisförmigen Begrenzung.
- source_word: עַל פְּנֵי מָיִם
  choice: über die Wasserfläche
  rationale: פְּנֵי bezeichnet wörtlich die Vorder- oder Oberfläche; „Wasserfläche“ gibt das räumliche Bild in natürlichem modernem Deutsch wieder. עַל kann hier sowohl „auf“ als auch „über“ bedeuten.
- source_word: עַד תַּכְלִית
  choice: bis an die Grenze
  rationale: עַד bezeichnet die Erstreckung bis zu einem Endpunkt, und תַּכְלִית den äußersten Punkt oder die Grenze.
- source_word: אוֹר עִם חֹשֶׁךְ
  choice: von Licht und Finsternis
  rationale: Wörtlich steht „Licht mit Finsternis“. Die Formulierung bezeichnet die Grenze, an der beide Bereiche zusammentreffen, ohne das Verhältnis unnötig weiter auszudeuten.
theological_decisions: []
translation_notes:
  register: Poetisches, würdiges Standarddeutsch mit einem konkreten kosmischen Bild. „Finsternis“ wahrt den gehobenen Parallelismus zu „Licht“, ohne altertümliche Satzformen zu verwenden.
