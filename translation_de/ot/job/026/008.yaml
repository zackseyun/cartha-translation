id: JOB.26.8
reference: Job 26:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: צֹרֵֽר מַ֥יִם בְּ/עָבָ֑י/ו וְ/לֹא נִבְקַ֖ע עָנָ֣ן תַּחְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/008.yaml
  text: He binds up the waters in his clouds[b][a], yet the cloud is not split open under them.
translation:
  language: de
  text: Er bindet die Wasser in seinen dichten Wolken[a], doch die Wolke reißt unter ihnen nicht auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in seinen Wolken“; das hebräische Wort kann besonders dichte, schwere Wolken bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „platzt unter ihnen nicht“; wörtlicher: „wird unter ihnen nicht aufgespalten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרֵר
  choice: bindet
  rationale: Das Partizip von צרר bezeichnet ein Binden, Umschließen oder Zusammenhalten. „Bindet“ bewahrt das konkrete poetische Bild, ohne es erklärend auszubauen.
- source_word: מַיִם
  choice: die Wasser
  rationale: Der hebräische Plural wird in der gehobenen Bildsprache mit „die Wasser“ wiedergegeben. So bleibt zugleich ein möglicher Bezug des pluralischen Suffixes in תַּחְתָּם erhalten.
- source_word: בְּעָבָיו
  choice: in seinen dichten Wolken
  rationale: עָב bezeichnet besonders eine dichte, schwere Wolke oder Wolkenmasse. Der Plural mit Suffix der 3. Person Singular wird als „seinen dichten Wolken“ wiedergegeben.
- source_word: וְלֹא
  choice: doch ... nicht
  rationale: 'Das einfache ו erhält hier aus dem inhaltlichen Gegensatz natürliche adversative Kraft: Trotz der eingeschlossenen Wasser reißt die Wolke nicht auf.'
- source_word: נִבְקַע
  choice: reißt ... nicht auf
  rationale: Der Nifal von בקע bedeutet „gespalten/aufgerissen werden“. Die deutsche Formulierung ist natürlich und bewahrt das Bild des Aufreißens; die mögliche Wiedergabe „platzt nicht“ wird in der Fußnote genannt.
- source_word: עָנָן
  choice: die Wolke
  rationale: Der hebräische Singular wird beibehalten. Er kann in der Poesie generisch oder kollektiv verstanden werden.
- source_word: תַּחְתָּם
  choice: unter ihnen
  rationale: Das Suffix ist maskulin Plural. „Unter ihnen“ bewahrt diese Form und lässt den im Hebräischen nicht völlig eindeutigen Bezug offen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der seltenere Plural „die Wasser“ ist bewusst beibehalten, um die kosmische Bildsprache und die grammatische Mehrzahl des Hebräischen zu bewahren. Die mögliche Mehrdeutigkeit von „unter ihnen“ wird nicht stillschweigend aufgelöst.
