source:
  edition: WLC
  text: הֶן אֵ֤לֶּה קְצ֬וֹת דרכ/ו וּ/מַה שֵּׁ֣מֶץ דָּ֭בָר נִשְׁמַע בּ֑/וֹ וְ/רַ֥עַם גבורת/ו מִ֣י יִתְבּוֹנָֽן־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/026/014.yaml
  text: Look[a], these are the fringes of his ways[b], and what a mere whisper we hear of him! But the thunder of his power—who can understand it?
translation:
  language: de
  text: Sieh[a], das sind nur die äußersten Ränder seiner Wege; und was für ein leises Flüstern hören wir von ihm! Doch den Donner seiner Macht – wer kann ihn begreifen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Siehe«. Das hebräische Wort ruft nachdrücklich zur Aufmerksamkeit auf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sieh
  rationale: Die hinweisende Interjektion lenkt nachdrücklich die Aufmerksamkeit auf das Folgende. „Sieh“ ist gegenwärtig, würdig und weniger altertümlich als „Siehe“.
- source_word: קְצוֹת
  choice: die äußersten Ränder
  rationale: Das Wort bezeichnet Enden, äußerste Bereiche oder Ränder. Die Formulierung macht deutlich, dass nur die Randbereiche dessen sichtbar sind, was Gott tut, ohne den poetischen Sinn aufzulösen.
- source_word: דְּרָכָיו
  choice: seiner Wege
  rationale: „Wege“ bewahrt die hebräische Metapher für Gottes Handeln und vermeidet die einengende Deutung als bloße Werke.
- source_word: שֵׁמֶץ דָּבָר
  choice: ein leises Flüstern
  rationale: Die seltene Verbindung bezeichnet eine äußerst geringe, kaum vernehmbare Mitteilung. „Leises Flüstern“ verbindet die geringe Menge mit dem Hörbild und bildet den poetischen Gegensatz zum Donner; דָּבָר wird idiomatisch in die Wendung aufgenommen, nicht eigens als „Wort“ wiedergegeben.
- source_word: נִשְׁמַע בּוֹ
  choice: hören wir von ihm
  rationale: Die Form lässt sich im Kontext kollektiv beziehungsweise unpersönlich verstehen. „Von ihm“ bezeichnet das Wenige, das über Gott vernommen wird, ohne es vorschnell als direkte Rede Gottes festzulegen.
- source_word: רַעַם גְּבוּרָתוֹ
  choice: den Donner seiner Macht
  rationale: Die wörtliche Bildsprache erhält den starken akustischen Gegensatz zwischen leisem Flüstern und Donner. „Macht“ gibt die Stärke beziehungsweise Gewalt Gottes natürlich wieder.
- source_word: יִתְבּוֹנָן
  choice: kann ihn begreifen
  rationale: Das Verb bezeichnet einsichtiges Wahrnehmen oder Verstehen. „Begreifen“ passt zur rhetorischen Frage nach der Grenze menschlichen Erfassens; das Pronomen bezieht sich natürlich auf den Donner.
theological_decisions:
- issue: Reichweite menschlicher Erkenntnis von Gottes Wegen
  choice: Der Vers stellt das Wahrgenommene als bloße äußerste Ränder von Gottes Wegen und als leises Flüstern dar.
  alternative: Die Aussage könnte enger nur auf die im Kontext genannten Schöpfungswerke bezogen werden.
  rationale: Der unmittelbare Zusammenhang beschreibt kosmische Taten Gottes, während der poetische Gegensatz die Begrenztheit menschlicher Wahrnehmung hervorhebt. Die Übersetzung belässt offen, ob „seine Wege“ hier ausschließlich diese Werke oder Gottes Handeln umfassender bezeichnet.
- issue: Bezug des Pronomens in der Schlussfrage
  choice: „ihn“ bezieht sich grammatisch auf „den Donner seiner Macht“.
  alternative: Sinngemäß könnte die Frage auf Gottes Macht selbst bezogen und mit „sie“ formuliert werden.
  rationale: Der hebräische Satz nennt ausdrücklich den Donner als Objekt des Begreifens. Die Übersetzung bewahrt dieses Bild, ohne Donner und Macht gleichzusetzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter poetischer Bildspannung. „Äußerste Ränder“, „leises Flüstern“ und „Donner“ halten den Kontrast zwischen dem kaum Wahrgenommenen und der überwältigenden Macht aufrecht. Der einzige Fußnotenmarker [a] steht im Haupttext.
