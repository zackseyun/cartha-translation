  text: מְאַחֵ֥ז פְּנֵי כִסֵּ֑ה פַּרְשֵׁ֖ז עָלָ֣י/ו עֲנָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/009.yaml
  text: He covers the face of his throne[b][a], spreading his cloud over it.
translation:
  language: de
  text: Er verhüllt[a] die Vorderseite[b] seines Thrones und breitet seine Wolke darüber aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher möglicherweise: »Er ergreift« oder »hält fest«. Das hebräische Verb bezeichnet gewöhnlich das Ergreifen oder Festhalten; zusammen mit der ausgebreiteten Wolke ist hier wohl ein Verhüllen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »das Gesicht seines Thrones«; gemeint sein kann dessen sichtbare Fläche oder Vorderseite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֵז
  choice: verhüllt
  rationale: Das Verb bedeutet gewöhnlich »ergreifen« oder »festhalten«. Im poetischen Zusammenhang mit der darüber ausgebreiteten Wolke bezeichnet es hier wahrscheinlich das Verbergen oder Verhüllen; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: פְּנֵי
  choice: die Vorderseite
  rationale: פָּנִים kann das »Gesicht«, die Vorderseite oder sichtbare Fläche bezeichnen. »Vorderseite« bewahrt das räumliche Bild und klingt im Deutschen bei einem Thron verständlicher als »Gesicht«.
- source_word: כִסֵּה
  choice: seines Thrones
  rationale: כִּסֵּא bezeichnet einen Thron. Der Zusammenhang nennt Gott als unausgesprochenes Subjekt; zusammen mit »seine Wolke« ist der possessive Bezug im Deutschen sachgerecht.
- source_word: פַּרְשֵׁז
  choice: breitet … aus
  rationale: Die Form bezeichnet das Ausbreiten oder Ausspannen. Die finite Wiedergabe mit »und« ergibt einen natürlichen deutschen Parallelismus, ohne das Verhältnis der beiden Verbalformen enger festzulegen.
- source_word: עָלָיו
  choice: darüber
  rationale: Das Suffix bezieht sich am natürlichsten auf den Thron beziehungsweise dessen Vorderseite; »darüber« gibt die räumliche Beziehung knapp wieder.
- source_word: עֲנָנוֹ
  choice: seine Wolke
  rationale: Der Singular mit Suffix wird direkt wiedergegeben und setzt das Bild der Wolke fort, welche den Thron den Blicken entzieht.
theological_decisions:
- issue: Unausgesprochenes Subjekt und possessiver Bezug
  choice: Gott verhüllt seinen eigenen Thron mit seiner Wolke.
  alternative: 'Unpersönlicher: Er verhüllt »den Thron«, ohne dessen Zugehörigkeit ausdrücklich zu machen.'
  rationale: Der Abschnitt beschreibt Gottes Wirken im Kosmos. Das göttliche Subjekt sowie »seine Wolke« stützen den Bezug »seines Thrones«, ohne eine weitergehende theologische Deutung einzutragen.
- issue: Art der Verhüllung
  choice: Das Verb wird kontextuell als »verhüllt« wiedergegeben.
  alternative: Wörtlicher sind »ergreift«, »hält fest« oder möglicherweise »schließt ein«.
  rationale: Die folgende Aussage über die ausgebreitete Wolke legt eine Verhüllung nahe. Da das hebräische Verb diese Bedeutung nicht eindeutig festlegt, wird die Spannung durch eine Fußnote sichtbar gehalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die knappe Parallelstruktur der hebräischen Poesie bleibt erhalten; ungewöhnliche hebräische Bildsprache und lexikalische Unsicherheit werden nicht geglättet, sondern in den Fußnoten ausgewiesen.
