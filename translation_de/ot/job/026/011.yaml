  naturalness: „Die Säulen des Himmels erbeben“ ist natürliches, würdiges poetisches Deutsch. „Vor seinem Schelten“ ist im poetisch-biblischen Register verständlich und gibt die Reaktion auf Gottes גערה idiomatisch wieder. „Bestürzt“ ist hier weniger auf moralisches Entsetzen festgelegt als „entsetzt“ und wahrt die Bedeutung von תמהּ als fassungslose Verwunderung.
