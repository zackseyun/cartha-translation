  text: The pillars of heaven tremble and are astonished at his rebuke[a][b][c].
translation:
  language: de
  text: Die Säulen des Himmels erbeben[a] und sind bestürzt[b] vor seinem Schelten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schwanken« oder »zittern«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sind erstaunt«, »sind fassungslos« oder »sind entsetzt«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »von seinem Schelten«; möglich ist auch: »wegen seines Scheltens«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שָׁמַיִם
  choice: die Säulen des Himmels
  rationale: Die Wendung gibt das kosmische Bild des hebräischen Textes unmittelbar und im Deutschen idiomatisch wieder, ohne es als Berge oder Fundamente auszudeuten.
- source_word: יְרוֹפָפוּ
  choice: erbeben
  rationale: Das Verb רפף bezeichnet ein Beben, Zittern oder Schwanken. »Erbeben« ist im poetischen Zusammenhang natürlich und bewahrt sowohl die Bewegung als auch die ehrfurchtgebietende Wirkung.
- source_word: וְיִתְמְהוּ
  choice: und sind entsetzt
  rationale: תמהּ bezeichnet eine bestürzte, fassungslose Reaktion. »Entsetzt« erhält die starke Wirkung, ohne zwingend moralische Abscheu auszudrücken; »staunen« bleibt als mögliche mildere Wiedergabe vermerkt.
- source_word: מִגַּעֲרָתוֹ
  choice: über seinen Donnerwort
  rationale: מִן kann hier Ursache oder Auslöser markieren. »Über« ist im Deutschen idiomatisch. גְּעָרָה ist ein machtvolles Schelten oder Drohwort; »Donnerwort« gibt dessen überwältigende Kraft im poetischen Kontext wieder, ohne einen tatsächlichen Donnerschlag zu behaupten.
theological_decisions:
- issue: Kosmisches Bild der »Säulen des Himmels«
  choice: Das poetische kosmologische Bild wird unverändert beibehalten.
  alternative: Die Säulen als Berge, Fundamente oder buchstäbliche Bauteile eines antiken Weltmodells auslegen.
  rationale: Die Übersetzung soll das Bild des Ausgangstextes weder entmythologisieren noch als naturkundliche Aussage festlegen.
- issue: Personifikation der Himmelssäulen
  choice: Die Reaktion »erbeben und sind entsetzt« wird als dichterische Personifikation bewahrt.
  alternative: Die Aussage auf ein rein physisches Schwanken reduzieren.
  rationale: Die beiden hebräischen Verben verbinden Bewegung mit fassungsloser Reaktion; diese Spannung soll erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles poetisches Deutsch. Die kosmische Bildsprache bleibt erhalten. »Donnerwort« ist gehoben, aber verständlich, und vermittelt die Macht des göttlichen Scheltens; die Fußnote nennt wörtlichere Möglichkeiten.
