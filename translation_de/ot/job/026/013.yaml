  text: בְּ֭/רוּח/וֹ שָׁמַ֣יִם שִׁפְרָ֑ה חֹֽלֲלָ֥ה יָ֝ד֗/וֹ נָחָ֥שׁ בָּרִֽיחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/013.yaml
  text: By his breath the heavens are made fair[c][b][a]; his hand pierced the fleeing serpent.
translation:
  language: de
  text: Durch seinen Hauch[a] wurde der Himmel herrlich; seine Hand durchbohrte[b] die fliehende Schlange[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »durch seinen Geist« oder »durch seinen Wind«. Das hebräische Wort kann Hauch, Wind oder Geist bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Oder »formte«. Das hebräische Verb kann unterschiedlich verstanden werden; »durchbohrte« passt am besten zum Kampfesbild dieser Zeile.
    reason: alternative_reading
  - marker: c
    text: Die »fliehende Schlange« erinnert wahrscheinlich an eine kosmische Chaos-Schlange; vergleiche Jesaja 27,1.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוּחוֹ
  choice: Durch seinen Hauch
  rationale: רוּחַ kann »Hauch«, »Wind« oder »Geist« bedeuten. »Hauch« bewahrt hier das anschauliche poetische Bild, ohne die Stelle ausdrücklich trinitarisch festzulegen; בְּ bezeichnet das Mittel.
- source_word: שָׁמַיִם
  choice: der Himmel
  rationale: Im Deutschen bezeichnet der Singular »Himmel« in poetisch-kosmologischem Zusammenhang natürlich das Himmelsgewölbe und entspricht hier dem hebräischen שָׁמַיִם.
- source_word: שִׁפְרָה
  choice: wurde … herrlich
  rationale: Die Form bezeichnet ein Schön-, Klar- oder Glanzvollwerden beziehungsweise ein Herrlichmachen. Die Wiedergabe wahrt den resultativen Sinn und den gehobenen poetischen Ton.
- source_word: חֹלֲלָה
  choice: durchbohrte
  rationale: חול kann in dieser poetischen Form unterschiedlich verstanden werden, unter anderem als durchbohren, hervorbringen oder formen. Mit Gottes Hand als Handelnder und der fliehenden Schlange als Gegenüber passt »durchbohrte« am besten zum Kampfesbild.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Die konkrete Bildsprache wird beibehalten; die Hand steht zugleich für wirksame Macht.
- source_word: נָחָשׁ בָּרִיחַ
  choice: die fliehende Schlange
  rationale: בָּרִיחַ kann eine fliehende, dahingleitende oder langgestreckte Bewegung bezeichnen. »Fliehend« ist im kosmischen Kampfesbild gut begründet und lässt die Identität der Schlange offen.
theological_decisions:
- issue: Ob רוּחַ ausdrücklich als persönlicher »Geist« zu verstehen ist
  choice: Im Haupttext steht »Hauch«.
  alternative: »Geist« oder »Wind«
  rationale: Der hebräische Ausdruck lässt alle drei Bedeutungen zu. »Hauch« bewahrt das Bild göttlicher Schöpfermacht, ohne eine trinitarische Identifizierung in den Text einzutragen.
- issue: Ob נָחָשׁ בָּרִיחַ im Haupttext als Satan oder Leviatan identifiziert werden soll
  choice: Das Bild bleibt als »die fliehende Schlange« stehen.
  alternative: Leviatan, eine kosmische Chaos-Schlange oder in theologischer Deutung Satan
  rationale: Der Vers enthält kosmische Kampfesbildsprache, nennt die Schlange aber weder Satan noch ausdrücklich Leviatan. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem poetischem Klang. Der parallele Satzbau und die konkreten Bilder »Hauch«, »Hand« und »Schlange« bleiben erhalten; echte lexikalische und theologische Mehrdeutigkeit wird in den Fußnoten ausgewiesen.
