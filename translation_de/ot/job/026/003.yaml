base_translation:
  language: en
  yaml_path: translation/ot/job/026/003.yaml
  text: How you have counseled one without wisdom[a], and made sound wisdom known abundantly!
translation:
  language: de
  text: Wie[a] hast du doch einem, dem es an Weisheit fehlt, Rat gegeben und Einsicht in Fülle vermittelt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was für einen Rat hast du einem gegeben, dem es an Weisheit fehlt, und was für Einsicht hast du in Fülle vermittelt!“ Das hebräische מַה kann hier mit „wie“ oder „was für“ wiedergegeben werden; „wie … doch“ hebt Hiobs Ironie hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Wie
  rationale: Das einleitende מַה kann hier einen ironischen Ausruf ausdrücken. „Wie … doch“ gibt Hiobs spöttisches Erstaunen im Deutschen natürlich wieder, ohne die mögliche Wiedergabe mit „was“ auszuschließen.
- source_word: יָּעַצְתָּ
  choice: Rat gegeben
  rationale: Das Verb יעץ bedeutet „raten, beraten“. Die Wendung „Rat gegeben“ ist im Deutschen natürlich und bewahrt den Bezug zur Weisheitsrede.
- source_word: לְלֹא חָכְמָה
  choice: einem, dem es an Weisheit fehlt
  rationale: Die Verbindung bezeichnet den Empfänger des Rates als jemanden ohne Weisheit. Die Formulierung bleibt hinsichtlich seiner Identität offen und klingt im Deutschen idiomatisch.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: „Weisheit“ ist die übliche und kontextgerechte Wiedergabe in der Weisheitsliteratur.
- source_word: וְתוּשִׁיָּה
  choice: Einsicht
  rationale: תּוּשִׁיָּה bezeichnet hier tragfähige, wirksame Weisheit beziehungsweise verständigen Rat. „Einsicht“ ist eine natürliche deutsche Wiedergabe; die Verstärkung liegt zusätzlich in „in Fülle“.
- source_word: לָרֹב
  choice: in Fülle
  rationale: Die Wendung bezeichnet ein großes Maß und verstärkt in diesem Zusammenhang ironisch, wie viel Einsicht Bildad angeblich vermittelt habe.
- source_word: הוֹדָעְתָּ
  choice: vermittelt
  rationale: Der Hifil von ידע bedeutet wörtlich „wissen lassen, bekannt machen“. Bei Einsicht als Gegenstand gibt „vermittelt“ diese kausative Bedeutung im Deutschen natürlich wieder.
