lexical_decisions:
- source_word: מֶה
  choice: Wie
  rationale: In der rhetorischen Ausrufefrage gibt מֶה idiomatisch den ironischen Ausruf „Wie!“ wieder.
- source_word: עָזַרְתָּ
  choice: hast du … geholfen
  rationale: Das Perfekt von עזר bezeichnet die vermeintlich vollbrachte Hilfe; das deutsche Perfekt wirkt in der direkten Anrede natürlich.
- source_word: לְלֹא כֹחַ
  choice: dem Kraftlosen
  rationale: Die Wendung bezeichnet singularisch jemanden ohne Kraft; die substantivische Wiedergabe ist knapp und erhält den Parallelismus.
- source_word: הוֹשַׁעְתָּ
  choice: hast du … gerettet
  rationale: ישׁע bedeutet retten oder befreien; „gerettet“ bewahrt die unmittelbare Bildsprache und die ironische Aussage.
- source_word: זְרוֹעַ
  choice: den Arm
  rationale: Das konkrete Bild des Arms als Träger von Kraft bleibt entsprechend dem hebräischen poetischen Ausdruck erhalten.
- source_word: לֹא עֹז
  choice: dem jede Stärke fehlt
  rationale: Die Formulierung gibt „ohne Stärke/Macht“ idiomatisch wieder, ohne die personifizierende Rede vom Arm aufzulösen.
theological_decisions:
- issue: Ironischer Sinn der beiden Ausrufe
  choice: Die Ironie wird durch die exklamative Form mit „Wie“ bewahrt.
  alternative: Wörtliche Fragen mit „Was“
  rationale: Hiob lobt Bildad nicht tatsächlich, sondern stellt dessen vermeintliche Hilfe scharf ironisch heraus; dies ergibt sich aus der pragmatischen Funktion von מֶה und dem Kontext.
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Der singularische Bezug und das hebräische Bild vom kraftlosen Arm bleiben erhalten; die ungewöhnliche Formulierung trägt bewusst die scharfe Ironie.
