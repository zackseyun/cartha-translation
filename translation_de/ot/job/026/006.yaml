base_translation:
  language: en
  yaml_path: translation/ot/job/026/006.yaml
  text: Sheol lies naked before him[b][a], and Abaddon has no covering.
translation:
  language: de
  text: Nackt liegt das Totenreich vor ihm[a], und Abaddon[b] hat keine Bedeckung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Totenreich liegt entblößt vor ihm.“'
    reason: lexical_alternative
  - marker: b
    text: Abaddon kann auch mit „Untergang“ oder „Vernichtung“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: Nackt liegt
  rationale: Das Adjektiv bedeutet „nackt, bloß“. Die Formulierung bewahrt das lebendige poetische Bild und klingt im Deutschen natürlich.
- source_word: שְׁאוֹל
  choice: das Totenreich
  rationale: שְׁאוֹל bezeichnet hier den Bereich der Toten. „Totenreich“ vermittelt die Bedeutung gewöhnlichen Lesern klarer als eine bloße Transliteration und verengt sie nicht auf ein einzelnes Grab.
- source_word: נֶגְדּוֹ
  choice: vor ihm
  rationale: Die Präposition mit Suffix bedeutet „vor ihm, in seiner Gegenwart“. Die knappe Wiedergabe bewahrt den im Kontext auf Gott bezogenen Ausdruck ohne erklärenden Zusatz.
- source_word: אֵין
  choice: hat keine
  rationale: 'Die hebräische Existenzverneinung wird zusammen mit לְ idiomatisch als Besitzverneinung wiedergegeben: „Abaddon hat keine Hülle“.'
- source_word: כְּסוּת
  choice: Hülle
  rationale: Das Substantiv bezeichnet eine Bedeckung. „Hülle“ erhält die poetische Entsprechung zu „nackt“ und drückt zugleich fehlende Verbergung aus.
- source_word: אֲבַדּוֹן
  choice: Abaddon
  rationale: Im Parallelismus mit dem Totenreich wirkt der Ausdruck wie die Bezeichnung eines Bereichs. Die Transliteration wahrt diese Bildwelt und den biblischen Wiedererkennungswert; die wörtliche Bedeutung wird in einer Fußnote genannt.
theological_decisions:
- issue: Bezug des maskulinen Singularsuffixes in נֶגְדּוֹ
  choice: „vor ihm“, im Kontext auf Gott bezogen
  alternative: Bezug auf einen nicht näher bezeichneten Beobachter
  rationale: Der Zusammenhang beschreibt Gottes Herrschaft und Einsicht auch in verborgene Bereiche. Die Übersetzung lässt das Pronomen wie im Hebräischen stehen und vermeidet eine ausdrückliche Ergänzung des Gottesnamens.
- issue: Verhältnis von Totenreich und Abaddon
  choice: Zwei parallele Bezeichnungen bzw. eng verwandte Bereiche werden sprachlich nicht gleichgesetzt
  alternative: Beide Ausdrücke ausdrücklich als denselben Ort wiedergeben
  rationale: Der poetische Parallelismus verbindet die Begriffe eng, ohne ihre genaue Beziehung zu definieren. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die parallelen Bilder „nackt“ und „keine Hülle“ werden bewahrt; „Totenreich“ sorgt für unmittelbare Verständlichkeit, während „Abaddon“ als markanter hebräischer Begriff stehen bleibt.
