  text: אֶת מִ֭י הִגַּ֣דְתָּ מִלִּ֑ין וְ/נִשְׁמַת מִ֝י יָצְאָ֥ה מִמֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/004.yaml
  text: To whom have you declared words[a], and whose breath has come out from you?
translation:
  language: de
  text: Wem hast du Worte mitgeteilt, und wessen Atem[a] ist aus dir hervorgegangen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geist“. Das hebräische Wort kann „Atem“ und in manchen Zusammenhängen „Geist“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי
  choice: Wem
  rationale: Die mit אֶת eingeleitete Frage bezeichnet hier idiomatisch die Person, an die beziehungsweise für die gesprochen wird. „Wem“ erhält die rhetorische Schärfe.
- source_word: הִגַּדְתָּ
  choice: hast du … verkündet
  rationale: Der Hifil von נגד bedeutet „mitteilen, kundtun, verkünden“. „Verkündet“ passt zum gehobenen poetischen Ton und zur spöttischen Frage Hiobs.
- source_word: מִלִּין
  choice: diese Worte
  rationale: Das aramaisierende מִלִּין bezeichnet gesprochene Worte oder Äußerungen. Der im Deutschen idiomatische Zusatz „diese“ verweist auf die unmittelbar vorausgehende Rede Bildads, ohne den Sinn festzulegen.
- source_word: וְנִשְׁמַת מִי
  choice: und wessen Atem
  rationale: נְשָׁמָה kann „Atem“, „Lebenshauch“ oder kontextabhängig „Geist“ bedeuten. „Atem“ bewahrt hier zunächst das konkrete Bild; die mögliche Bedeutung „Geist“ wird in der Fußnote erhalten.
- source_word: יָצְאָה מִמֶּךָּ
  choice: ist aus dir hervorgegangen
  rationale: Die Wendung gibt das konkrete Bild von יצא מן („aus … hinausgehen/hervorgehen“) in natürlichem, gehobenem Deutsch wieder und kann sowohl auf Atem als auch auf einen Geist bezogen werden.
theological_decisions:
- issue: Wessen Atem oder Geist durch Bildad spricht
  choice: Die rhetorische Frage bleibt offen und lautet „wessen Atem“; die Alternative „Geist“ steht in der Fußnote.
  alternative: „Wessen Geist ist von dir ausgegangen?“
  rationale: Der hebräische Text benennt den Urheber nicht und lässt offen, ob נְשָׁמָה konkret als Atem oder weitergehend als Geist zu verstehen ist. Diese Spannung darf nicht durch eine ausdrückliche Zuschreibung aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rhetorisch-poetischem Klang. Die Satzstruktur folgt eng den beiden parallelen Fragen des Hebräischen; „hervorgegangen“ bewahrt das körperliche Bild, ohne die geistige Lesart auszuschließen.
