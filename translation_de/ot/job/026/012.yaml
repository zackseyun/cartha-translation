base_translation:
  language: en
  yaml_path: translation/ot/job/026/012.yaml
  text: By his power he stilled the sea[a], and by his understanding he shattered Rahab.
translation:
  language: de
  text: 'Durch seine Kraft brachte er das Meer zur Ruhe,[b]

    und durch seine Einsicht zerschmetterte er Rahab.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab ist hier ein poetischer Name für eine Chaosmacht oder ein Meeresungeheuer, das Gott bezwingt; deutend kann man auch „das Meeresungeheuer“ übersetzen.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann hier nach anderer Auffassung auch „aufwühlen“ oder „erregen“ bedeuten; seine genaue Bedeutung ist umstritten.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: בְּכֹחוֹ
  choice: Durch seine Kraft
  rationale: Die Präposition ב ist hier instrumental zu verstehen. „Kraft“ gibt כֹּחַ im kosmisch-poetischen Zusammenhang natürlich und prägnant wieder.
- source_word: רָגַע
  choice: brachte er ... zur Ruhe
  rationale: Im Zusammenhang mit dem Meer bezeichnet das Verb am ehesten das Stillen oder Beruhigen. Die Formulierung ist im modernen Deutsch natürlich und bewahrt die Vorstellung, dass Gott das chaotische Meer bezwingt.
- source_word: הַיָּם
  choice: das Meer
  rationale: Die direkte Wiedergabe erhält sowohl die konkrete Bedeutung als auch den poetischen Anklang an das Meer als Chaosmacht.
- source_word: וּבִתְבוּנָתוֹ
  choice: und durch seine Einsicht
  rationale: תְּבוּנָה bezeichnet Einsicht, Verständnis oder Unterscheidungsvermögen. „Einsicht“ klingt im Deutschen natürlich und wahrt den Weisheitsbezug.
- source_word: מָחַץ
  choice: zerschmetterte er
  rationale: Das Verb bezeichnet ein gewaltsames Zerschlagen oder Zermalmen. „Zerschmetterte“ entspricht der kraftvollen poetischen Bildsprache.
- source_word: רָהַב
  choice: Rahab
  rationale: Hier ist das Wort am besten als poetischer Eigenname einer Chaosmacht beziehungsweise eines Meeresungeheuers zu verstehen. Die Transliteration wahrt das hebräische Bild und vermeidet eine einengende Auslegung im Haupttext.
theological_decisions:
- issue: Ob רָהַב als Eigenname oder deutend als Gattungsbezeichnung wiederzugeben ist
  choice: Der Eigenname „Rahab“ als Bezeichnung einer von Gott bezwungenen Chaosmacht
  alternative: „das Meeresungeheuer“ oder abstrakt „Hochmut“
  rationale: Der poetisch-kosmologische Zusammenhang spricht für eine personifizierte Chaosmacht. Der Eigenname bewahrt die Mehrdeutigkeit des Bildes; die Fußnote erläutert die wahrscheinliche Bedeutung, ohne sie im Haupttext festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. „Brachte ... zur Ruhe“ ist verständlich und vermeidet die mögliche Unklarheit von „stillte“; „zerschmetterte“ erhält die Wucht des hebräischen Verbs.
