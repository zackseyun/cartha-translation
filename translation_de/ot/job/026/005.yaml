source:
  edition: WLC
  text: הָ/רְפָאִ֥ים יְחוֹלָ֑לוּ מִ/תַּ֥חַת מַ֝֗יִם וְ/שֹׁכְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/005.yaml
  text: The departed spirits tremble beneath the waters[a], and those who dwell in them.
translation:
  language: de
  text: Die Totengeister zittern unter den Wassern[a], ebenso deren Bewohner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Toten winden sich unter den Wassern.“ Das hebräische Wort רְפָאִים kann „die Toten“ oder „die Totengeister“ bedeuten; יְחוֹלָלוּ lässt sich auch mit „winden sich“ wiedergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְפָאִים
  choice: die Totengeister
  rationale: Im poetischen Zusammenhang bezeichnet רְפָאִים die Verstorbenen in der Unterwelt, nicht das alte Volk der Refaïter. „Totengeister“ wahrt den poetischen und unterweltlichen Sinn deutlicher als das schlichtere „die Toten“.
- source_word: יְחוֹלָלוּ
  choice: zittern
  rationale: Das Verb חול kann hier ein Beben, Zittern oder Sichwinden ausdrücken. „Zittern“ passt zum Bild der erschütterten Unterwelt, ohne die mögliche körperliche Nuance des Sichwindens ganz auszuschließen.
- source_word: מִתַּחַת מַיִם
  choice: unter den Wassern
  rationale: Die Wendung bezeichnet den Raum unterhalb der Wasser. Der Plural „Wasser“ wird in der poetischen Form „den Wassern“ wiedergegeben, um das kosmische Bild zu bewahren.
- source_word: וְשֹׁכְנֵיהֶם
  choice: ebenso deren Bewohner
  rationale: Das Suffix bezieht sich am natürlichsten auf die Wasser. „Deren Bewohner“ erhält den knappen Parallelismus und lässt offen, wer diese Bewohner im Einzelnen sind.
theological_decisions:
- issue: Referenz von רְפָאִים
  choice: Totengeister in der Unterwelt
  alternative: die Refaïter als altes Volk
  rationale: Der poetische Kontext von Hiob 26 beschreibt Gottes Herrschaft über kosmische und unterweltliche Bereiche. Daher ist hier die verbreitete poetische Bedeutung „Verstorbene/Totengeister“ wahrscheinlicher als der Name eines Volkes.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. „Totengeister“ verdeutlicht den Unterweltsbezug, während „unter den Wassern“ das kosmische Raumbild und „deren Bewohner“ die referenzielle Offenheit des Hebräischen bewahrt.
