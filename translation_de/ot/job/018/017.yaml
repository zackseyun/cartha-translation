  terminology: „Andenken“ gibt זִכְרוֹ in diesem Kontext idiomatisch wieder und bewahrt den Sinn des fortlebenden Gedenkens. „Straße“ für חוּץ ist vertretbar; die mögliche Nuance eines öffentlichen Platzes bzw. des Außenbereichs bleibt in der Fußnote ausgewiesen.
