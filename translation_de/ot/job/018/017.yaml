  text: זִֽכְר/וֹ אָ֭בַד מִנִּי אָ֑רֶץ וְ/לֹא שֵׁ֥ם ל֝֗/וֹ עַל פְּנֵי חֽוּץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/017.yaml
  text: His memory perishes from the earth[a], and he has no name on the face of the street.
translation:
  language: de
  text: Sein Andenken verschwindet von der Erde[a], und auf der Straße hat er keinen Namen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sein Andenken verschwindet aus dem Land, und auf dem öffentlichen Platz hat er keinen Namen.«'
    reason: 'Lexikalische Alternativen: אֶרֶץ kann »Erde« oder »Land«, חוּץ »Straße«, »Außenbereich« oder »öffentlicher Platz« bedeuten.'
lexical_decisions:
- source_word: זִכְרוֹ
  choice: die Erinnerung an ihn
  rationale: Das Substantiv bezeichnet Erinnerung oder Gedenken. Die Formulierung ist im modernen Deutschen natürlich und meint das fortbestehende menschliche Andenken an ihn.
- source_word: אָבַד
  choice: schwindet
  rationale: Das Verb kann »verloren gehen«, »verschwinden« oder »zugrunde gehen« bedeuten. »Schwindet« verbindet die Vorstellung des Verschwindens mit der Erinnerung als Subjekt.
- source_word: מִנִּי אָרֶץ
  choice: von der Erde
  rationale: אֶרֶץ kann »Land« oder »Erde« bedeuten. Im Zusammenhang der vollständigen Auslöschung des Andenkens gibt »Erde« die umfassende Aussage gut wieder; die Alternative bleibt in der Fußnote erhalten.
- source_word: וְלֹא שֵׁם לוֹ
  choice: bleibt kein Name von ihm
  rationale: Wörtlich steht »und kein Name ist ihm«. Die Wiedergabe drückt aus, dass weder seine Identität noch sein öffentliches Ansehen im Gedächtnis fortbestehen, und fügt sich natürlich in den deutschen Satz.
- source_word: עַל־פְּנֵי
  choice: auf
  rationale: Die feste räumliche Wendung bedeutet wörtlich »auf der Oberfläche von«. Im Deutschen ist bei »Straße« die schlichte Präposition »auf« idiomatisch und bewahrt das Ortsbild.
- source_word: חוּץ
  choice: der Straße
  rationale: Das Wort kann den Außenbereich, die Straße oder einen öffentlichen Platz bezeichnen. »Straße« steht hier für den öffentlichen Raum, in dem der Name eines Menschen bekannt bleibt.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der Parallelismus zwischen dem schwindenden Andenken und dem nicht fortbestehenden Namen wird gewahrt; die Mehrdeutigkeit von אֶרֶץ und חוּץ ist in der Fußnote dokumentiert.
