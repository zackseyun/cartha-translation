  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: זִכְרוֹ bezeichnet sein Andenken, אָבַד dessen Verschwinden, und אֶרֶץ kann hier sinnvoll mit „Erde“ wiedergegeben werden. Der zweite Halbvers gibt jedoch וְלֹא שֵׁם לוֹ weniger genau wieder: „kein Name von ihm“ bedeutet im Deutschen eher, dass kein von ihm stammender Name vorhanden ist, statt dass ihm kein Name bleibt bzw. zukommt. Auch „bleibt“ ist im Hebräischen nicht ausdrücklich enthalten.'
