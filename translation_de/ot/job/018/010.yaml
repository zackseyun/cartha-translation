  yaml_path: translation/ot/job/018/010.yaml
  text: His rope is hidden in the ground[a], and his trap on the path.
translation:
  language: de
  text: Sein Fangseil liegt in der Erde verborgen[a], seine Falle auf dem Pfad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seine Schnur ist im Boden verborgen, seine Schlinge auf dem Pfad.“'
    reason: Lexikalische Alternativen für חבל, אֶרֶץ und מַלְכֹּדֶת; die Bildsprache kann entweder allgemein als Falle oder konkreter als Schnur und Schlinge wiedergegeben werden.
lexical_decisions:
- source_word: טָמוּן
  choice: liegt … verborgen
  rationale: Das passive Partizip von טמן bezeichnet einen verborgenen bzw. vergrabenen Zustand. „liegt … verborgen“ gibt diesen Zustand im Deutschen natürlich wieder.
- source_word: בָּאָרֶץ
  choice: in der Erde
  rationale: Im Zusammenhang mit einer verborgenen Fangvorrichtung bezeichnet אֶרֶץ den Boden bzw. das Erdreich; „in der Erde“ bewahrt die konkrete räumliche Vorstellung.
- source_word: חַבְלוֹ
  choice: sein Fangseil
  rationale: חבל bedeutet „Seil“ oder „Schnur“ und bezeichnet hier offenbar einen Bestandteil der Falle. „Fangseil“ verdeutlicht den Kontext, ohne es mit מַלְכֹּדֶת gleichzusetzen.
- source_word: וּמַלְכֻּדְתּוֹ
  choice: seine Falle
  rationale: מַלְכֹּדֶת bezeichnet eine Falle oder Schlinge. „Falle“ ist die allgemeinste und verständlichste Wiedergabe.
- source_word: עֲלֵי נָתִיב
  choice: auf dem Pfad
  rationale: Die Wendung bezeichnet den Ort, an dem die Falle liegt. „auf dem Pfad“ erhält das Bild einer Vorrichtung, die dort verborgen ist, wo jemand entlanggeht.
