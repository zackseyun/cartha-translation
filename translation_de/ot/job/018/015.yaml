translation:
  language: de
  text: In seinem Zelt wohnt, was ihm nicht gehört[a]; auf seine Wohnstätte wird Schwefel gestreut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist hier knapp und mehrdeutig. Möglich ist auch: »In seinem Zelt bleibt nichts, was ihm gehört.« Manche beziehen die feminine Verbform auf den erst am Versende genannten »Schwefel«; dann lautet der Anfang etwa: »In seinem Zelt wohnt Schwefel.« Die Bedeutung der anschließenden Wendung bleibt dabei unsicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁכּוֹן
  choice: wohnt
  rationale: Das Verb שכן bedeutet »wohnen, sich niederlassen«. Die feminine Verbform steht ohne ausdrücklich genanntes vorausgehendes Subjekt; die Übersetzung lässt diese ungewöhnliche Konstruktion in Verbindung mit dem unbestimmten »etwas« erkennen.
- source_word: בְּאָהֳלוֹ
  choice: in seinem Zelt
  rationale: אֹהֶל bezeichnet konkret ein Zelt. Dieses Bild wird beibehalten, statt es allgemein mit »Haus« oder »Wohnung« wiederzugeben.
- source_word: מִבְּלִי לוֹ
  choice: etwas, das nicht zu ihm gehört
  rationale: Die elliptische Wendung bezeichnet hier wahrscheinlich etwas, das keine Beziehung oder Zugehörigkeit zu ihm hat. Die Wiedergabe ist im Deutschen verständlich, legt aber nicht fest, was diese fremde Präsenz ist.
- source_word: יְזֹרֶה
  choice: wird … gestreut
  rationale: Das Piel von זרה bedeutet »streuen, ausstreuen«. Die aktive Verbform kann unpersönlich gebraucht sein; das deutsche Passiv vermeidet einen im Text nicht genannten Handelnden.
- source_word: עַל נָוֵהוּ
  choice: über seine Wohnstätte
  rationale: נָוֶה kann Wohnort, Behausung oder Weideplatz bedeuten. Parallel zu »seinem Zelt« bezeichnet es hier am ehesten seine Wohnstätte.
- source_word: גָפְרִית
  choice: Schwefel
  rationale: גָפְרִית bezeichnet Schwefel als Stoff und Bild zerstörerischen Gerichts. »Schwefel« ist die genaue und geläufige deutsche Entsprechung.
theological_decisions:
- issue: Die schwierige Syntax des ersten Halbverses und das Subjekt der femininen Verbform
  choice: Eine nicht näher bestimmte, ihm nicht zugehörige Präsenz wohnt in seinem Zelt.
  alternative: Nichts von dem, was ihm gehört, bleibt in seinem Zelt; oder der am Versende genannte Schwefel ist das nachgestellte Subjekt und wohnt in seinem Zelt.
  rationale: 'Der hebräische Text ist stark verkürzt: תִּשְׁכּוֹן ist feminin, während מִבְּלִי לוֹ kein eindeutig ausgedrücktes Subjekt liefert. Die Hauptfassung folgt der naheliegenden Zugehörigkeitsdeutung, ohne die fremde Präsenz näher zu bestimmen; die Fußnote bewahrt die anderen grammatisch diskutierten Möglichkeiten.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkreten Bilder »Zelt«, »Wohnstätte« und »Schwefel« bleiben erhalten. Der erste Halbvers wird lesbar formuliert, während die echte syntaktische Mehrdeutigkeit in der Fußnote offengelegt wird.
