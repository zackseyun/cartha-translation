  source_fidelity: 'Die Hauptaussage trifft den schwierigen ersten Halbvers im Grundsatz: In dem Zelt des Betroffenen befindet sich etwas, das ihm nicht gehört; danach wird Schwefel auf seine Wohnstätte gestreut. Die Wendung מִבְּלִי לוֹ ist jedoch elliptisch und darf weder eine konkrete fremde Person noch eindeutig eine zeitliche Bedeutung („nicht mehr“) festlegen. Die Fußnote sollte die mögliche Rückbeziehung der femininen Verbform auf גָפְרִית vorsichtiger formulieren, weil die vorliegende Paraphrase „ohne dass es noch ihm gehört“ den hebräischen Ausdruck nicht angemessen wiedergibt.'
  naturalness: „In seinem Zelt wohnt, was ihm nicht gehört“ ist idiomatischer und knapper als „wohnt etwas, das nicht zu ihm gehört“. „Auf seine Wohnstätte wird Schwefel gestreut“ bildet עַל und das Bild des Bestreuens unmittelbar ab und bleibt modernes, würdiges Standarddeutsch.
  terminology: „Zelt“, „Wohnstätte“ und „Schwefel“ sind sachgerecht. „Schwefel“ ist gegenüber dem traditionellen „Schwefel und Feuer/Brimstone“-Sprachgebrauch modern und präzise. Es ist keine konfessionell lenkende Terminologie vorhanden.
