  text: יֹ֭אכַל בַּדֵּ֣י עוֹר֑/וֹ יֹאכַ֥ל בַּ֝דָּ֗י/ו בְּכ֣וֹר מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/013.yaml
  text: It devours the limbs of his skin[a]; the firstborn of death devours his limbs.
translation:
  language: de
  text: Es verzehrt die Glieder seiner Haut; der Erstgeborene des Todes verzehrt seine Glieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Erstgeborene des Todes“ ist möglicherweise eine poetische Personifikation für das tödlichste Leiden oder den mächtigsten Vollstrecker des Todes.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹאכַל
  choice: verzehrt
  rationale: Das Qal Imperfekt von אכל bezeichnet hier bildhaft zerstörerisches Fressen. „Verzehrt“ bewahrt die eindringliche poetische Wirkung; im ersten Halbvers bleibt das Subjekt wie im Hebräischen unausgesprochen.
- source_word: בַּדֵּי / בַּדָּיו
  choice: die Glieder / seine Glieder
  rationale: בדים kann Teile, Glieder oder Zweige bezeichnen. Im Zusammenhang mit Haut und körperlichem Verfall gibt „Glieder“ den körperlichen Sinn am besten wieder und wahrt die Wiederholung.
- source_word: עוֹרוֹ
  choice: seiner Haut
  rationale: עוֹר bedeutet gewöhnlich „Haut“ oder „Fell“; beim menschlichen Körper ist „Haut“ die natürliche deutsche Entsprechung.
- source_word: בְּכוֹר מָוֶת
  choice: der Erstgeborene des Todes
  rationale: Die formnahe Wiedergabe erhält das auffällige poetische Genitivbild und legt dessen umstrittene Bedeutung nicht vorschnell auf eine bestimmte Krankheit oder Todesart fest.
theological_decisions:
- issue: Deutung von בְּכוֹר מָוֶת
  choice: Das poetische Bild „der Erstgeborene des Todes“ bleibt im Haupttext erhalten.
  alternative: die tödlichste Krankheit; der schrecklichste Tod; der vornehmste Vollstrecker des Todes
  rationale: Der hebräische Ausdruck ist bildhaft und mehrdeutig. Eine ausdeutende Wiedergabe würde die echte Spannung des Textes unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. Die ungewöhnliche Wendung „Glieder seiner Haut“ wird wegen der Struktur und Mehrdeutigkeit des hebräischen Textes beibehalten.
