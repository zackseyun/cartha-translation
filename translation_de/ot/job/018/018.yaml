  text: They drive him from light into darkness[b][a], and banish him from the world.
translation:
  language: de
  text: Sie stoßen[a] ihn aus dem Licht in die Finsternis und vertreiben ihn aus der Welt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie jagen ihn aus dem Licht in die Finsternis.“'
