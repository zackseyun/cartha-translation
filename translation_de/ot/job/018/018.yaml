lexical_decisions:
- source_word: יֶהְדְּפֻהוּ
  choice: Sie stoßen ihn
  rationale: Das Qal Imperfekt 3. Person Plural mit Objektsuffix bewahrt ein nicht näher bestimmtes plurales Subjekt. „Stoßen“ gibt die gewaltsame Bewegung beziehungsweise Verdrängung prägnant wieder.
- source_word: מֵאוֹר
  choice: aus dem Licht
  rationale: Die Präposition מִן bezeichnet die Trennung beziehungsweise Bewegung weg vom Licht. Der bestimmte Artikel ist im Deutschen im Gegensatz zu idiomatischem Englisch in dieser Gegenüberstellung natürlich.
- source_word: אֶל חֹשֶׁךְ
  choice: in die Finsternis
  rationale: אֶל bezeichnet die Richtung auf einen neuen Bereich hin; „in die Finsternis“ bildet den poetischen Gegensatz zu „aus dem Licht“ klar ab.
- source_word: וּמִתֵּבֵל
  choice: aus der Welt
  rationale: תֵּבֵל bezeichnet die Welt, häufig mit dem Beiklang der bewohnten Welt. „Welt“ ist im Vers knapp, natürlich und poetisch.
- source_word: יְנִדֻּהוּ
  choice: vertreiben ihn
  rationale: Die Verbform bezeichnet das Veranlassen von Entfernung oder Ausschluss. „Vertreiben“ wahrt die aktive Pluralform und vermeidet eine unnatürliche oder übermäßig rechtliche Zuspitzung.
