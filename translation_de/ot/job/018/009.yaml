  text: A trap seizes him by the heel[a]; a snare holds him fast.
translation:
  language: de
  text: Eine Falle packt ihn an der Ferse[a]; eine Schlinge hält ihn fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine Falle fängt ihn an der Ferse; eine Schlinge packt ihn.“ Das letzte hebräische Wort ist selten und kann eine bestimmte Art Falle oder Schlinge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאחֵז
  choice: packt
  rationale: Das Qal-Imperfekt von אחז bezeichnet ein Ergreifen oder Packen. „Packt“ gibt das gewaltsame Zufassen der Falle im Deutschen anschaulich und natürlich wieder.
- source_word: בְּעָקֵב
  choice: an der Ferse
  rationale: עָקֵב bedeutet „Ferse“. Die Präposition ב bezeichnet hier im Bild des Fangens die Stelle, an der die Falle zugreift.
- source_word: פָּח
  choice: Falle
  rationale: פָּח bezeichnet eine Falle oder Schlinge. „Falle“ wahrt den allgemeinen Bildgehalt und unterscheidet den Ausdruck vom seltenen Substantiv im zweiten Halbvers.
- source_word: יַחֲזֵק
  choice: hält … fest
  rationale: Das Hifil-Imperfekt von חזק drückt hier festen, überwältigenden Zugriff aus. „Hält … fest“ bewahrt die Intensität und entspricht idiomatischem Deutsch.
- source_word: עָלָיו
  choice: ihn
  rationale: על mit Suffix bezeichnet hier die gegen die Person gerichtete, sie erfassende Wirkung. Im Deutschen wird diese Beziehung bei „festhalten“ natürlich durch das Akkusativobjekt ausgedrückt.
- source_word: צַמִּים
  choice: Schlinge
  rationale: Das seltene Wort bezeichnet wahrscheinlich eine besondere Fangvorrichtung, möglicherweise eine Schlinge. Die genaue Art bleibt unsicher; „Schlinge“ passt zum Parallelismus, ohne es mit פָּח gleichzusetzen.
