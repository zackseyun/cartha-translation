base_translation:
  language: en
  yaml_path: translation/ot/job/018/012.yaml
  text: His strength is famished[a], and calamity is ready at his side.
translation:
  language: de
  text: Seine Kraft ist ausgehungert, und Unheil steht an seiner Seite[a] bereit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für sein Stolpern“. Das hebräische Wort kann „Seite“ beziehungsweise „Rippe“ bezeichnen; manche verstehen es hier im Sinn von Stolpern oder Hinken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: ist
  rationale: Das Qal-Imperfekt von היה beschreibt hier im poetischen Zusammenhang einen gegenwärtigen Zustand; das deutsche Präsens gibt dies natürlich wieder.
- source_word: רָעֵב
  choice: ausgehungert
  rationale: Das Adjektiv bezeichnet Hunger. „Ausgehungert“ bewahrt die starke, bedrohliche Bildsprache besser als das mildere „hungrig“.
- source_word: אֹנוֹ
  choice: seine Kraft
  rationale: אוֹן kann Kraft, Stärke oder auch Besitz beziehungsweise Vermögen bezeichnen. Im Zusammenhang des dahinschwindenden Vermögens eines Menschen ist „Kraft“ die naheliegende körperlich-poetische Wiedergabe, ohne die möglichen weiteren Bedeutungen zum Haupttext zu machen.
- source_word: וְאֵיד
  choice: und Unheil
  rationale: אֵיד bezeichnet vernichtendes Unglück oder Verderben. „Unheil“ ist im Deutschen prägnant, würdevoll und für poetische Rede gut geeignet.
- source_word: נָכוֹן
  choice: steht … bereit
  rationale: Die Form bezeichnet etwas Feststehendes oder Vorbereitetes. „Steht bereit“ vermittelt anschaulich, dass das Unheil unmittelbar zum Angriff bereit ist.
- source_word: לְצַלְעוֹ
  choice: an seiner Seite
  rationale: צלע bezeichnet gewöhnlich die Seite oder Rippe; mit der Präposition ergibt sich hier das Bild eines Unheils, das dicht neben ihm bereitsteht. Die ebenfalls vertretene Deutung als Stolpern oder Hinken wird in der Fußnote offengehalten.
theological_decisions: []
