  register: Modernes, würdiges Standarddeutsch mit anschaulicher poetischer Sprache. Die Bildfolge von eingeschränkten Schritten und dem eigenen, zum Sturz führenden Plan bleibt erhalten; lexikalische Mehrdeutigkeiten werden in den Fußnoten ausgewiesen.
