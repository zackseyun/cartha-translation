  text: His vigorous steps are constrained[b][a], and his own counsel casts him down.
translation:
  language: de
  text: Seine kraftvollen Schritte werden eingeengt[a], und sein eigener Plan bringt ihn zu Fall[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seine starken Schritte werden eingeengt“; אוֹן kann „Kraft“ oder „Stärke“ bedeuten, und das Verb auch „werden verengt“ oder „werden eingeschränkt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein eigener Rat wirft ihn nieder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצְרוּ
  choice: werden eingeengt
  rationale: Das Verb beschreibt, wie der Bewegungsspielraum verengt oder eingeschränkt wird. „Werden eingeengt“ bewahrt das räumliche Bild und klingt im Deutschen natürlich.
- source_word: צַעֲדֵי
  choice: Schritte
  rationale: Der Konstruktplural bezeichnet Schritte oder Tritte; „Schritte“ gibt das poetische Bild unmittelbar wieder.
- source_word: אוֹנוֹ
  choice: seine kraftvollen
  rationale: אוֹן kann Kraft oder Stärke bezeichnen. Im Zusammenhang mit „Schritten“ gibt „kraftvoll“ den Sinn eines ehemals energischen, sicheren Ausschreitens wieder, ohne die mögliche Nuance zu verabsolutieren.
- source_word: וְתַשְׁלִיכֵהוּ
  choice: bringt ihn zu Fall
  rationale: Die Hifil-Form mit femininem Subjekt bezieht sich auf den folgenden „Plan“. „Bringt ihn zu Fall“ vermittelt die verursachte Niederlage in natürlichem Deutsch.
- source_word: עֲצָתוֹ
  choice: sein eigener Plan
  rationale: עֵצָה umfasst Rat, Vorhaben oder Plan. Hier kehrt sich das eigene Vorhaben gegen den Betreffenden; „sein eigener Plan“ macht diese Ironie klar und bleibt sachlich.
