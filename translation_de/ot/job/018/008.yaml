  text: כִּֽי שֻׁלַּ֣ח בְּ/רֶ֣שֶׁת בְּ/רַגְלָ֑י/ו וְ/עַל שְׂ֝בָכָ֗ה יִתְהַלָּֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/008.yaml
  text: For he is sent into a net by his own feet, and he walks onto a mesh.
translation:
  language: de
  text: Denn durch seine Füße wird er ins Netz getrieben, und auf einem Flechtwerk geht er umher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֻׁלַּח
  choice: treiben ihn
  rationale: Das passive Pual bezeichnet hier, dass der Betroffene ins Netz hineingeraten bzw. hineingetrieben wird. Die Formulierung mit seinen eigenen Füßen bewahrt die pointierte Aussage, dass seine Schritte ihn selbst dorthin bringen.
- source_word: בְּרַגְלָיו
  choice: seine eigenen Füße
  rationale: Das Präfix ב kann instrumentale Bedeutung haben. »Seine eigenen« macht im Deutschen die Selbstverursachung deutlich, ohne einen fremden Urheber einzuführen.
- source_word: רֶשֶׁת
  choice: Netz
  rationale: Gängige und bildlich passende Bezeichnung für eine Fangvorrichtung.
- source_word: שְׂבָכָה
  choice: Flechtwerk
  rationale: Das seltene Wort bezeichnet etwas Geflochtenes bzw. ein netzartiges Gefüge. »Flechtwerk« wahrt den Unterschied zu רשת, ohne die genaue Art der Falle stärker festzulegen als der hebräische Text.
- source_word: יִתְהַלָּךְ
  choice: geht er dahin
  rationale: Die Hitpael-Form beschreibt sein Umher- bzw. Dahingehen. Die deutsche Wendung bleibt natürlich und erhält den Aspekt fortgesetzter Bewegung.
theological_decisions:
- issue: Handelnder beim Hineingeraten in die Falle
  choice: Seine eigenen Füße treiben ihn ins Netz.
  alternative: Er wird ins Netz geschickt.
  rationale: Das hebräische Passiv lässt den äußeren Handelnden ungenannt, während בְרַגְלָיו die eigenen Füße als Mittel hervorhebt. Die Übersetzung vermeidet es, Gott oder einen anderen Urheber ausdrücklich einzusetzen, und bewahrt zugleich die Spannung zwischen passivem Geschick und selbst vollzogenem Weg.
translation_notes:
  register: Moderne, würdige Bildsprache mit parallelem Satzbau. »Flechtwerk« ist bewusst etwas ungewöhnlich, da auch das hebräische שְׂבָכָה selten ist; eine präzisierende Festlegung auf eine bestimmte Fallenkonstruktion wird vermieden.
