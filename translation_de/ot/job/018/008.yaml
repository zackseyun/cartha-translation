  naturalness: „Durch seine Füße wird er ins Netz getrieben“ ist modernes, verständliches Deutsch und bewahrt die im Hebräischen offene Frage nach dem letztlichen Handelnden. „Auf einem Flechtwerk geht er umher“ ist als bildhafte, würdige Sprache natürlich genug; „Flechtwerk“ erhält die lexikalische Unterscheidung zum ersten „Netz“.
  terminology: „Netz“ für רֶשֶׁת und „Flechtwerk“ für שְׂבָכָה sind angemessen. Die unbestimmte Form „einem Flechtwerk“ bildet die fehlende Bestimmtheit im Hebräischen idiomatisch ab, ohne die Art der Vorrichtung zu präzisieren.
