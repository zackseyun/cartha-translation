base_translation:
  language: en
  yaml_path: translation/ot/job/018/016.yaml
  text: His roots dry up beneath[a], and above, his branch withers.
translation:
  language: de
  text: Unten vertrocknen seine Wurzeln, und oben wird sein Zweig[a] abgeschnitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Trieb“. Das hebräische Substantiv bedeutet gewöhnlich „Ernte“ beziehungsweise das Abgeschnittene und bezeichnet hier wohl den oberirdischen Wuchs der Pflanze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּחַת
  choice: unten
  rationale: Die räumliche Angabe bildet den knappen poetischen Gegenpol zu וּמִמַּעַל („oben“).
- source_word: שָׁרָשָׁיו
  choice: seine Wurzeln
  rationale: Der hebräische Plural mit Suffix wird direkt wiedergegeben und bewahrt das Pflanzenbild.
- source_word: יִבָשׁוּ
  choice: vertrocknen
  rationale: Das Verb bezeichnet das Trockenwerden; „vertrocknen“ ist im Deutschen bei Wurzeln natürlich und anschaulich.
- source_word: וּמִמַּעַל
  choice: und oben
  rationale: Die knappe Wiedergabe erhält den Parallelismus zwischen dem unteren und dem oberen Teil der Pflanze.
- source_word: יִמַּל
  choice: wird … abgeschnitten
  rationale: Die Form bezeichnet hier wahrscheinlich das Abgeschnittenwerden beziehungsweise Abhauen von Pflanzenwuchs. Die Wiedergabe wahrt das gewaltsame Bild, statt es zu „verwelken“ abzuschwächen.
- source_word: קְצִירוֹ
  choice: sein Zweig
  rationale: קָצִיר bedeutet gewöhnlich „Ernte“ oder das Abgeschnittene; parallel zu den Wurzeln bezeichnet es hier wahrscheinlich den oberirdischen Wuchs. „Zweig“ macht dieses Bild im Deutschen verständlich, ohne den Bezug auf eine Pflanze aufzugeben.
theological_decisions: []
translation_notes:
  register: 'Knappe, würdige Bildsprache mit deutlich erhaltenem Parallelismus: „unten“/„oben“ und „Wurzeln“/„Zweig“. Das Futur beziehungsweise die unabgeschlossene Verbform wird im Deutschen als poetisch-anschauliches Präsens wiedergegeben.'
