  yaml_path: translation/ot/job/018/011.yaml
  text: Terrors frighten him on every side[a], and scatter him at his feet.
translation:
  language: de
  text: 'Schrecken ängstigen ihn ringsum

    und jagen ihn bei jedem Schritt in die Flucht[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und zerstreuen ihn zu seinen Füßen«. Die ungewöhnliche Wendung kann bildlich meinen, dass die Schrecken ihn bei jedem Schritt verfolgen oder aufscheuchen.'
    reason: Die hebräische Verbindung von וֶהֱפִיצֻהוּ mit לְרַגְלָיו ist ungewöhnlich. Die Anmerkung erhält die wörtliche Formulierung und markiert die bildhafte Deutung als Deutung.
lexical_decisions:
- source_word: סָבִיב
  choice: ringsum
  rationale: Das adverbial gebrauchte Wort bezeichnet ein Umgeben von allen Seiten; »ringsum« ist knapp, natürlich und poetisch.
- source_word: בִּעֲתֻהוּ
  choice: ängstigen ihn
  rationale: Die Verbform bezeichnet heftiges Erschrecken oder Versetzen in Angst. »ängstigen« bewahrt den Sinn, ohne die stammverwandte Formulierung »Schrecken erschrecken« zu verwenden.
- source_word: בַלָּהוֹת
  choice: Schrecken
  rationale: Der Plural bezeichnet Schrecknisse oder furchteinflößende Mächte; die deutsche Sammel- beziehungsweise Pluralform »Schrecken« passt zum poetischen Kontext.
- source_word: וֶהֱפִיצֻהוּ
  choice: treiben ihn vor sich her
  rationale: Die Hifil-Form von פוץ kann »zerstreuen« bedeuten. Zusammen mit לְרַגְלָיו ist hier wahrscheinlich das Aufscheuchen beziehungsweise rastlose Vorantreiben gemeint; die Wiedergabe ergibt im Deutschen ein verständliches Bild, ohne die Bedrohung näher zu bestimmen.
- source_word: לְרַגְלָיו
  choice: vor sich her
  rationale: Wörtlich steht »zu/an seinen Füßen«. Im Zusammenhang kann die Wendung ausdrücken, dass die Schrecken ihn auf Schritt und Tritt hetzen oder vorantreiben. Die bildhafte Deutung wird durch eine Fußnote als solche kenntlich gemacht.
