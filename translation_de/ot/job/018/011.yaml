translation_notes:
  register: Moderne, würdige poetische Standardsprache. Der Parallelismus bleibt durch zwei kurze Zeilen erhalten; die schwer verständliche wörtliche Fußformulierung wird im Haupttext idiomatisch wiedergegeben und in der Fußnote offengelegt.
