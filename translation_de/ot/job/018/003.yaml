  text: מַ֭דּוּעַ נֶחְשַׁ֣בְנוּ כַ/בְּהֵמָ֑ה נִ֝טְמִ֗ינוּ בְּ/עֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/003.yaml
  text: Why are we regarded as cattle[b][a], and considered unclean in your eyes?
translation:
  language: de
  text: Warum werden wir wie Vieh angesehen[a] und gelten in euren Augen als unrein[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Tiere behandelt“. Das hebräische Wort bezeichnet allgemein ein Tier, häufig Vieh, und wird hier verächtlich gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: Das zugrunde liegende hebräische Wort ist schwierig. Wahrscheinlich geht es darum, als unrein oder befleckt angesehen zu werden; andere Deutungen sind möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Das Frageadverb leitet Bildads rhetorische Frage ein; „Warum“ ist knapp und natürlich.
- source_word: נֶחְשַׁבְנוּ
  choice: werden wir … gleichgeachtet
  rationale: Die passive Form von חשׁב bezeichnet hier, wie die Sprecher eingeschätzt oder eingestuft werden. Zusammen mit כַבְּהֵמָה gibt „dem Vieh gleichgeachtet“ den abwertenden Vergleich idiomatisch wieder.
- source_word: כַבְּהֵמָה
  choice: dem Vieh
  rationale: בְּהֵמָה ist eine breite Bezeichnung für Tier beziehungsweise besonders Groß- oder Nutzvieh. „Vieh“ bewahrt den kollektiven Singular und den verächtlichen Ton, ohne die Bedeutung auf wilde Tiere einzuengen.
- source_word: נִטְמִינוּ
  choice: gelten … als unrein
  rationale: Die schwierige Form wird im Parallelismus als Aussage über Verunreinigung beziehungsweise Unreinheit verstanden. „gelten als unrein“ nimmt die bewertende Perspektive von „in euren Augen“ natürlich auf.
- source_word: בְּעֵינֵיכֶם
  choice: in euren Augen
  rationale: Die geläufige hebräische Wendung bezeichnet Wahrnehmung oder Beurteilung; das deutsche Idiom entspricht ihr unmittelbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe und der parallele Aufbau der beiden Aussagen bleiben erhalten; die textlich schwierige zweite Aussage wird nicht als völlig sicher dargestellt.
