  text: Then Bildad the Shuhite answered and said:[a]
translation:
  language: de
  text: Darauf antwortete Bildad, der Schuchiter, und sagte:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Bildad, der Schuchiter, antwortete und sagte.“'
    reason: Lexikalische Alternative für das eröffnende וַ; es kann als schlichte Fortführung mit „und“ wiedergegeben werden.
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: ענה bezeichnet in dieser Gesprächsformel das Antworten auf die vorangegangene Rede; „antwortete“ bewahrt den dialogischen Zusammenhang.
- source_word: בִּלְדַּד
  choice: Bildad
  rationale: Der Personenname wird in der im Deutschen etablierten Form wiedergegeben.
- source_word: הַשֻּׁחִי
  choice: der Schuchiter
  rationale: Die Herkunfts- oder Sippenbezeichnung wird mit der im Deutschen gebräuchlichen Form „Schuchiter“ wiedergegeben.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die Wiedergabe erhält beide Verben der hebräischen Redeeinleitung, statt „antwortete und sagte“ zu einem einzigen Verb zusammenzuziehen.
- source_word: וַ
  choice: Darauf
  rationale: Das eröffnende Waw führt die nächste Reaktion im Gespräch fort. „Darauf“ drückt diese Abfolge in natürlichem modernem Deutsch aus, ohne ein rein zeitliches „dann“ zu erzwingen.
