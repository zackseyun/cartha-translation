  yaml_path: translation/ot/job/018/002.yaml
  text: How long will you keep setting traps with words? Understand[b][a], and afterward we will speak.
translation:
  language: de
  text: Wie lange wollt ihr noch mit Worten Fallen stellen?[a] Versteht; danach wollen wir reden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie lange wollt ihr den Worten Grenzen setzen?“ Die hebräische Wendung ist schwierig; sie kann statt auf sprachliche Fallen auch darauf zielen, der Rede ein Ende zu setzen oder endloses Reden zu beklagen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Danach werden wir reden.“ Die Verbform kann sowohl als Einladung als auch als schlichte Zukunftsaussage verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Wie lange
  rationale: Die feste hebräische Frageform bezeichnet idiomatisch die Dauer eines als unerträglich empfundenen Zustands.
- source_word: תְּשִׂימוּן
  choice: wollt ihr noch … stellen
  rationale: שׂים bedeutet „setzen, stellen, legen“. Das deutsche „noch“ gibt im Zusammenhang den vorwurfsvollen Fortdauer-Aspekt der Frage wieder, ohne eine eigene lexikalische Bedeutung des Verbs zu behaupten.
- source_word: קִנְצֵי לְמִלִּין
  choice: mit Worten Fallen stellen
  rationale: Die Wendung ist textlich und lexikalisch schwierig. Diese Wiedergabe folgt der möglichen Deutung von קִנְצֵי als „Fallen/Schlingen“ und fasst לְמִלִּין kontextgemäß instrumental; die wörtlichere Deutung als „Enden/Grenzen für Worte“ bleibt in der Fußnote erhalten.
- source_word: תָּבִינוּ
  choice: Kommt zur Einsicht
  rationale: Der Plural aus בין fordert die Angesprochenen auf, verständig zu werden beziehungsweise die Sache zu begreifen. „Kommt zur Einsicht“ ist im Deutschen natürlicher als das isolierte „Versteht“ und wahrt den kognitiven Nachdruck.
- source_word: וְאַחַר
  choice: danach
  rationale: 'Das Wort markiert knapp die zeitlich-logische Abfolge: erst Einsicht, anschließend das Reden.'
- source_word: נְדַבֵּר
  choice: wollen wir reden
  rationale: Der Imperfekt der 1. Person Plural kann hier im Deutschen gut als aufforderndes „wollen wir“ wiedergegeben werden; die ebenfalls mögliche schlichte Zukunft steht in der Fußnote.
theological_decisions:
- issue: Bezug und Bildlichkeit der schwierigen Wendung קִנְצֵי לְמִלִּין
  choice: Die bildhafte Deutung „mit Worten Fallen stellen“ steht im Haupttext.
  alternative: „den Worten Grenzen/ein Ende setzen“ beziehungsweise eine Klage über endloses Reden
  rationale: Der hebräische Ausdruck ist unsicher und darf nicht zur Grundlage einer weitergehenden theologischen Aussage gemacht werden. Die Fußnote hält die sachlich wichtige Alternative offen.
- issue: Aussage- oder Aufforderungscharakter von נְדַבֵּר
  choice: 'auffordernd: „wollen wir reden“'
  alternative: 'zukünftig: „werden wir reden“'
  rationale: Beides ist grammatisch möglich. Der vorangehende Imperativ begünstigt im Kontext eine auffordernde Abfolge, ohne die Zukunftsdeutung auszuschließen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Anrede steht wie im Hebräischen im Plural. Der Haupttext bleibt knapp und vorwurfsvoll; die beiden echten Mehrdeutigkeiten werden nicht geglättet, sondern in Fußnoten ausgewiesen.
