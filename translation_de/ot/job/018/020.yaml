  yaml_path: translation/ot/job/018/020.yaml
  text: Those who come after are appalled at his day[c][b][a], and those who went before are seized with horror.
translation:
  language: de
  text: Die Nachkommenden sind über seinen Tag entsetzt[a][b], und die Früheren packt das Grauen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »seinem Tag« ist wahrscheinlich der Tag seines Unheils oder Gerichts gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Späteren … die Früheren«. Manche verstehen das Wortpaar räumlich: »die im Westen … die im Osten«.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: »sie ergreifen Schauder«; eine idiomatische Wendung dafür, von Grauen gepackt zu werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יוֹמוֹ
  choice: über seinen Tag
  rationale: Die Wendung bewahrt das konkrete hebräische »seinen Tag«; עַל bezeichnet hier den Anlass beziehungsweise Gegenstand des Entsetzens. Im Deutschen ist »über« bei einer erschreckenden Nachricht oder einem Schicksal natürlich.
- source_word: נָשַׁמּוּ
  choice: sind ... entsetzt
  rationale: Das Verb bezeichnet bestürztes, erschüttertes Staunen; »entsetzt« gibt die starke emotionale Reaktion in gegenwärtigem Deutsch wieder.
- source_word: אַחֲרֹנִים
  choice: die Späteren
  rationale: Die substantivierte Bezeichnung bedeutet wörtlich »Spätere« beziehungsweise »Nachfolgende«. Die knappe Form erhält die mögliche zeitliche Gegenüberstellung.
- source_word: וְקַדְמֹנִים
  choice: und die Früheren
  rationale: Das Wort kann »Frühere« oder räumlich »Östliche« bedeuten. Im Parallelismus mit אַחֲרֹנִים ist die zeitliche Bedeutung am naheliegendsten.
- source_word: אָחֲזוּ שָׂעַר
  choice: packt das Grauen
  rationale: Wörtlich ergreifen die Früheren ein Schaudern; die deutsche idiomatische Wendung »jemanden packt das Grauen« bewahrt sowohl die Kraft von אָחֲזוּ als auch die Schreckensreaktion von שָׂעַר.
theological_decisions:
- issue: Bedeutung von »seinem Tag«
  choice: Die wörtliche Wendung bleibt im Haupttext stehen.
  alternative: »über seinen Unglückstag« oder »über seinen Untergang«
  rationale: Der Kontext legt einen Tag des Unheils oder Gerichts nahe, doch der hebräische Text benennt dies nicht ausdrücklich. Die Übersetzung erhält deshalb die Offenheit und erläutert sie in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus bleibt knapp und ausgewogen; die ungewöhnliche Wendung »sein Tag« wird aus Gründen der Formtreue beibehalten und erläutert.
