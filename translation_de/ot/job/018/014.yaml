base_translation:
  language: en
  yaml_path: translation/ot/job/018/014.yaml
  text: He is torn from the security of his tent[b][a], and he is marched off to the king of terrors.
translation:
  language: de
  text: Aus der Sicherheit seines Zeltes wird er weggerissen[a], und man führt ihn zum König der Schrecken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wird aus seinem Zelt weggerissen, das seine Sicherheit war.“ Das Hebräische kann entweder die Sicherheit seines Zeltes oder das Zelt selbst als seine Sicherheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Der König der Schrecken“ ist eine poetische Bezeichnung, die häufig als Personifikation des Todes verstanden wird.
    reason: alternative_reading
lexical_decisions:
- source_word: יִנָּתֵק
  choice: wird er weggerissen
  rationale: Das Nifal von נתק bezeichnet gewaltsames Losreißen oder Wegziehen. Die passive Form und die Härte des Bildes bleiben erhalten.
- source_word: מֵאָהֳלוֹ
  choice: seines Zeltes
  rationale: אֹהֶל bedeutet wörtlich „Zelt“. Das konkrete poetische Bild bleibt im Deutschen verständlich.
- source_word: מִבְטַחוֹ
  choice: aus der Sicherheit
  rationale: מִבְטָח kann Sicherheit, Zuversicht oder Vertrauen bezeichnen. Zusammen mit „seinem Zelt“ liegt eine räumlich-appositionelle Deutung nahe, ohne dass die alternative Satzbeziehung ausgeschlossen wird.
- source_word: וְתַצְעִדֵהוּ
  choice: und man führt ihn
  rationale: Das Hifil von צעד bedeutet „gehen lassen“, „führen“ oder „voranschreiten lassen“. Das unbestimmte „man“ gibt die nicht ausdrücklich identifizierte feminine Verbalinstanz wieder, ohne ihr eine konkrete Gestalt zuzuschreiben.
- source_word: לְמֶלֶךְ
  choice: zum König
  rationale: 'לְ bezeichnet hier die Richtung oder das Ziel: „zu dem König“.'
- source_word: בַּלָּהוֹת
  choice: der Schrecken
  rationale: Der Plural bezeichnet Schrecken oder Grauen. „König der Schrecken“ bewahrt die prägnante poetische Wendung.
theological_decisions:
- issue: Identität des „Königs der Schrecken“
  choice: Die poetische Bezeichnung bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Personifizierter Tod, Totenreich oder eine dämonische Schreckensgestalt.
  rationale: Der hebräische Text bestimmt den Bezug nicht ausdrücklich. Die Übersetzung bewahrt daher die metaphorische und theologische Offenheit.
- issue: Subjekt von וְתַצְעִדֵהוּ
  choice: Unpersönliche Wiedergabe mit „man“
  alternative: „Sie führt ihn“, bezogen auf eine feminine, personifizierte Größe; oder „er wird geführt“.
  rationale: Die feminine Singularform hat im unmittelbaren deutschen Kontext kein eindeutig benennbares Bezugswort. Eine unpersönliche Form vermeidet eine unbelegte Festlegung und bewahrt zugleich die aktive Bewegung.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit konkreter Bildsprache. „Weggerissen“ erhält die Gewalt des hebräischen Verbs; „man führt ihn“ vermeidet eine nicht belegte Identifizierung des grammatisch femininen Subjekts.
