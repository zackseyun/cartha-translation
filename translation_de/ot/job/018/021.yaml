id: JOB.18.21
reference: Job 18:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַךְ אֵ֭לֶּה מִשְׁכְּנ֣וֹת עַוָּ֑ל וְ֝/זֶ֗ה מְק֣וֹם לֹא יָדַֽע אֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/018/021.yaml
  text: Surely these are the dwellings of the unjust[b][a], and this is the place of one who does not know God.
translation:
  language: de
  text: Gewiss, das sind die Wohnstätten des Ungerechten[a], und dies ist der Ort dessen, der Gott nicht kennt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: des Bösen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Gewiss
  rationale: Die Partikel bekräftigt hier als abschließende Feststellung Bildads Aussage; „Gewiss“ gibt diese emphatische Funktion wieder, ohne sie restriktiv als „nur“ zu deuten.
- source_word: אֵלֶּה
  choice: das sind
  rationale: Das pluralische Demonstrativpronomen weist auf das zuvor geschilderte Geschick zurück. Im Deutschen ist „das sind“ die natürliche prädikative Form.
- source_word: מִשְׁכְּנוֹת
  choice: Wohnstätten
  rationale: Das Wort bezeichnet allgemein Orte des Wohnens. „Wohnstätten“ wahrt den Plural und klingt würdig, ohne die Bedeutung unnötig auf Zelte einzuengen.
- source_word: עַוָּל
  choice: des Ungerechten
  rationale: Das Substantiv bezeichnet einen Menschen, der durch Unrecht oder verkehrtes Handeln gekennzeichnet ist. „Ungerechter“ erhält den moralisch-rechtlichen Akzent; „Böser“ bleibt als mögliche breitere Wiedergabe in der Fußnote.
- source_word: וְזֶה
  choice: und dies ist
  rationale: Konjunktion und Demonstrativpronomen leiten den parallelen zusammenfassenden Satzteil ein; die im Hebräischen nicht ausgedrückte Kopula muss im Deutschen ergänzt werden.
- source_word: מְקוֹם
  choice: der Ort
  rationale: „Ort“ ist die direkte und unbestimmte Wiedergabe und bewahrt die Parallelität zu den „Wohnstätten“.
- source_word: לֹא יָדַע אֵל
  choice: dessen, der Gott nicht kennt
  rationale: Die Formulierung bildet die hebräische Verbalkonstruktion idiomatisch nach. „Kennen“ lässt sowohl den relationalen und moralischen Gehalt als auch den unmittelbaren Wortsinn bestehen, ohne ihn erklärend festzulegen.
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet an dieser Stelle den Gott, von dem im Buch Hiob die Rede ist; eine Erweiterung zu einem besonderen Gottestitel ist nicht angezeigt.
theological_decisions:
- issue: Bedeutung von „Gott nicht kennen“
  choice: Die wörtliche Wendung „Gott nicht kennt“ bleibt erhalten und kann relationales sowie moralisches Nichtanerkennen einschließen.
  alternative: Die Aussage als bloßes intellektuelles Nichtwissen oder ausdrücklich als fehlende Bundesbeziehung auszudeuten.
  rationale: Der Weisheitskontext legt mehr als bloße Unkenntnis nahe, doch eine ausdeutende Paraphrase würde die theologische Spannung des Ausdrucks vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzparallelität und die demonstrative Rückbindung an das zuvor geschilderte Geschick bleiben sichtbar; „Wohnstätten“ vermeidet die alltagssprachliche Verengung von „Wohnungen“ auf einzelne Wohneinheiten.
