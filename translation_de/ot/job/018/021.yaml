  source_fidelity: 'Der deutsche Text gibt die hebräische Satzstruktur und die wesentlichen Lexeme zuverlässig wieder: אַךְ als bekräftigendes „Gewiss“, אֵלֶּה als rückverweisendes Demonstrativ, מִשְׁכְּנוֹת im Plural als „Wohnstätten“, עַוָּל mit dem moralisch-rechtlichen Akzent „der Ungerechte“ sowie לֹא יָדַע אֵל wörtlich und offen als „der Gott nicht kennt“. Die Singularform „des Ungerechten“ entspricht dem hebräischen Bezug auf den einzelnen ungerechten Menschen, obwohl dessen Wohnstätten pluralisch genannt werden.'
  naturalness: „Gewiss, das sind die Wohnstätten des Ungerechten, und dies ist der Ort dessen, der Gott nicht kennt“ ist modernes, würdiges Standarddeutsch. Die leicht gehobenen Ausdrücke „Wohnstätten“ und „dies“ passen zum poetisch-weisheitlichen Register Hiobs und sind nicht unnatürlich.
