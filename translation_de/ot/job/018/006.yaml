base_translation:
  language: en
  yaml_path: translation/ot/job/018/006.yaml
  text: The light in his tent grows dark[a], and his lamp above him is extinguished.
translation:
  language: de
  text: Das Licht in seinem Zelt wird dunkel, und seine Lampe über ihm erlischt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹר
  choice: Licht
  rationale: Die konkrete Grundbedeutung bewahrt das poetische Bild der Helligkeit im Zelt.
- source_word: חָשַׁךְ
  choice: wird dunkel
  rationale: Die Form bezeichnet hier das Dunkelwerden und nicht nur einen statischen Zustand.
- source_word: בְּאָהֳלוֹ
  choice: in seinem Zelt
  rationale: „Zelt“ gibt das konkrete hebräische Bild wieder und kann zugleich die Wohnstätte bezeichnen.
- source_word: וְנֵרוֹ
  choice: und seine Lampe
  rationale: נֵר bezeichnet konkret eine Lampe beziehungsweise ihr Licht; „Lampe“ erhält den Bildparallelismus.
- source_word: עָלָיו
  choice: über ihm
  rationale: Die Präposition kann eine räumliche Lage auf, an oder über jemandem ausdrücken; im Bild der Lampe ist „über ihm“ natürlich und präzise.
- source_word: יִדְעָךְ
  choice: erlischt
  rationale: Das Verb bezeichnet das Ausgehen beziehungsweise Erlöschen eines Lichts oder Feuers; „erlischt“ ist knapp, würdevoll und idiomatisch.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit erhaltener hebräischer Zelt- und Lampenmetaphorik. Die beiden parallelen Vorgänge werden natürlich als „wird dunkel“ und „erlischt“ wiedergegeben.
