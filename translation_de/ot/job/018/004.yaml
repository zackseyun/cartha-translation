    issue: „soll deinetwegen die Erde verlassen“ verfehlt die Passivbedeutung von תֵּעָזַב אָרֶץ.
    rationale: Die Erde ist im Hebräischen dasjenige, was verlassen bzw. preisgegeben wird; sie ist nicht handelndes Subjekt. Die deutsche Formulierung ist zudem syntaktisch missverständlich.
  - severity: medium
    issue: Die Formulierung „Du, der sich ... zerreißt“ ist im Deutschen nicht kongruent und unnatürlich.
    rationale: Bei direkter Anrede muss es „Du, der du dich ... zerreißt“ heißen. Der hebräische Wechsel von der dritten zur zweiten Person kann ohne künstlich fehlerhafte deutsche Syntax in einer Fußnote festgehalten werden.
