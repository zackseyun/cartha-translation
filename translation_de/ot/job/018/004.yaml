  text: טֹֽרֵ֥ף נַפְשׁ֗/וֹ בְּ/אַ֫פּ֥/וֹ הַ֭/לְמַעַנְ/ךָ תֵּעָ֣זַב אָ֑רֶץ וְ/יֶעְתַּק צ֝֗וּר מִ/מְּקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/004.yaml
  text: You who tear yourself apart in your anger—shall the earth be abandoned for your sake[a], or a rock be moved from its place?
translation:
  language: de
  text: Du, der du dich in deinem Zorn selbst zerreißt[a] – soll deinetwegen die Erde preisgegeben werden oder ein Fels von seinem Platz gerückt werden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der seine Seele in seinem Zorn zerreißt“. Das Hebräische beginnt mit einem Ausdruck in der dritten Person und wechselt dann mit „deinetwegen“ zur direkten Anrede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֹרֵף נַפְשׁוֹ
  choice: der sich selbst zerreißt
  rationale: Das Partizip von טרף bezeichnet ein Zerreißen oder Zerfleischen; mit נַפְשׁוֹ ergibt sich hier das Bild selbstzerstörerischen Zorns. Die reflexive deutsche Wendung ist natürlich und bewahrt die Bildkraft.
- source_word: בְּאַפּוֹ
  choice: in seinem Zorn
  rationale: אַף bedeutet wörtlich „Nase“, bezeichnet aber häufig Zorn. Die dritte Person bleibt zunächst erhalten, weil sie im hebräischen Auftakt ausdrücklich markiert ist.
- source_word: הַלְמַעַנְךָ
  choice: deinetwegen
  rationale: Die Präposition mit dem Suffix der zweiten Person richtet die rhetorische Frage unmittelbar an Hiob und fragt, ob seinetwegen die bestehende Ordnung weichen solle.
- source_word: תֵּעָזַב אָרֶץ
  choice: soll die Erde verlassen werden
  rationale: Der Nifal von עזב wird passiv wiedergegeben. אָרֶץ meint im parallelen, kosmisch-proverbialen Zusammenhang eher die Erde als ein einzelnes Land.
- source_word: וְיֶעְתַּק צוּר מִמְּקֹמוֹ
  choice: oder ein Fels von seinem Platz gerückt werden
  rationale: עתק bezeichnet hier das Versetzen oder Entfernen. „Ein Fels“ wahrt den sprichwörtlichen Charakter und vermeidet einen unbeabsichtigten Gottesbezug.
theological_decisions:
- issue: Wechsel von der dritten zur zweiten Person
  choice: 'Den formalen Wechsel im Haupttext bewahren: „Du, der sich in seinem Zorn …“ und danach „deinetwegen“.'
  alternative: 'Den ganzen Satz für einen einheitlichen direkten Anruf in die zweite Person setzen: „Du, der du dich in deinem Zorn …“'
  rationale: Der hebräische Text beginnt mit einem Partizip und Suffixen der dritten Person, wechselt aber bei לְמַעַנְךָ ausdrücklich zur zweiten Person. Die gewählte deutsche Konstruktion bleibt verständlich und erhält diese auffällige Spannung.
- issue: Rhetorische Aussage über die Weltordnung
  choice: Bildads Frage als scharfe Zurechtweisung wiedergeben, ohne ihre Behauptung theologisch zu bestätigen.
  alternative: Die Frage ausdrücklich als Aussage über eine unveränderliche moralische Weltordnung auslegen.
  rationale: Der Vers gibt Bildads Rede wieder. Die Übersetzung sollte deren rhetorische Wucht zeigen, aber nicht über den Wortlaut hinaus Bildads Sicht zur Stimme des Erzählers machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Konstruktion „Du, der sich …“ ist bewusst gewählt, um den im Hebräischen vorhandenen Personenwechsel sichtbar zu halten; die Fußnote erklärt ihn.
