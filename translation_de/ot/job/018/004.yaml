  verdict: revise
  source_fidelity: Der Entwurf trifft die Bildsprache des עצמzerreißenden Zorns, die rhetorische Frage sowie die kosmische Tragweite von Erde und Fels grundsätzlich. Doch „soll deinetwegen die Erde verlassen“ gibt den hebräischen Nifal von עזב nicht wieder und kann zudem nahelegen, dass das angesprochene „Du“ die Erde verlassen solle. Gemeint ist, ob die Erde preisgegeben/verlassen werden soll.
  naturalness: „Du, der sich in seinem Zorn selbst zerreißt“ ist im modernen Standarddeutsch wegen des nicht auf „Du“ abgestimmten Reflexivpronomens nicht idiomatisch und wirkt grammatisch gebrochen. Eine einheitliche direkte Anrede ist natürlich; der im Hebräischen vorhandene Wechsel wird in der Fußnote dokumentiert.
  terminology: „Zorn“, „Erde“, „Fels“ und „von seinem Platz gerückt werden“ sind angemessen. „Preisgegeben werden“ ist hier eine natürliche passive Wiedergabe von עזב, ohne den Sinn zu verengen.
  issues:
