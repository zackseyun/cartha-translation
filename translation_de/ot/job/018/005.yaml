source:
  edition: WLC
  text: גַּ֤ם א֣וֹר רְשָׁעִ֣ים יִדְעָ֑ךְ וְ/לֹֽא יִ֝גַּ֗הּ שְׁבִ֣יב אִשּֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/005.yaml
  text: Indeed[a], the light of the wicked is put out, and the flame of his fire does not shine.
translation:
  language: de
  text: Ja, das Licht der Frevler erlischt, und die Flamme[a] seines Feuers leuchtet nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Funke seines Feuers“. Das hebräische Wort kann sowohl „Flamme“ als auch „Funke“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Ja
  rationale: Die Partikel bekräftigt hier Bildads Aussage. „Ja“ gibt diesen Nachdruck im Deutschen natürlich wieder, ohne einen bloß additiven Sinn wie „auch“ nahezulegen.
- source_word: אוֹר
  choice: Licht
  rationale: Das konkrete Bild des Lichts bleibt erhalten, auch wenn es bildlich für Lebensglück oder Wohlergehen stehen kann.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Der substantivierte Plural bezeichnet Frevler als Gruppe. „Frevler“ ist in poetisch-biblischer Sprache prägnant und verständlich.
- source_word: יִדְעָךְ
  choice: erlischt
  rationale: Das Verb bezeichnet das Verlöschen oder Schwächerwerden eines Lichts. „Erlischt“ ist idiomatisch und setzt keinen ausdrücklich genannten Handelnden voraus.
- source_word: וְלֹא
  choice: und … nicht
  rationale: Die koordinierende Verneinung wird in natürlicher deutscher Satzstellung wiedergegeben.
- source_word: יִגַּהּ
  choice: leuchtet
  rationale: Das Verb bezeichnet das Ausstrahlen von Licht; „leuchtet“ bewahrt das poetische Bild.
- source_word: שְׁבִיב
  choice: Flamme
  rationale: Das Wort kann „Funke“ oder „Flamme“ bedeuten. „Flamme“ passt gut zur parallelen Lichtmetaphorik und zum folgenden „seines Feuers“, während die Alternative in einer Fußnote erhalten bleibt.
- source_word: אִשּׁוֹ
  choice: seines Feuers
  rationale: Das hebräische Substantiv „Feuer“ mit Suffix der dritten Person Singular wird bildgetreu wiedergegeben; „Lampe“ würde ein anderes Bild einführen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelität. „Frevler“ wahrt den gehobenen Weisheitsstil, ohne die Bildsprache auszudeuten.
