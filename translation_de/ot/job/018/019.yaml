  text: לֹ֘א נִ֤ין ל֣/וֹ וְ/לֹא נֶ֣כֶד בְּ/עַמּ֑/וֹ וְ/אֵ֥ין שָׂ֝רִ֗יד בִּ/מְגוּרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/019.yaml
  text: He has neither offspring nor posterity among his people[b][a], and no survivor in the places where he sojourned.
translation:
  language: de
  text: Er hat weder Nachkommen noch Nachfahren unter seinem Volk[a], und niemand bleibt übrig an den Orten, wo er wohnte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann das zweite Wort auch „Enkel“ bedeuten; das Wortpaar bezeichnet hier das vollständige Erlöschen seiner Nachkommenschaft.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in seinen Wohnstätten“ beziehungsweise „an den Orten, wo er sich als Fremder aufhielt“. Das hebräische Wort kann Orte des Wohnens oder des vorübergehenden Aufenthalts bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִין
  choice: Nachkommen
  rationale: נִין bezeichnet Nachwuchs beziehungsweise leibliche Nachkommenschaft. „Nachkommen“ ist im modernen Deutschen natürlich und bildet mit dem folgenden Begriff eine umfassende Aussage über das Erlöschen seiner Linie.
- source_word: נֶכֶד
  choice: Nachfahren
  rationale: נֶכֶד kann besonders einen Enkel oder einen späteren Nachkommen bezeichnen. „Nachfahren“ wahrt zusammen mit „Nachkommen“ die Aussage, dass seine gesamte weitere Linie abgeschnitten ist, ohne die mögliche Bedeutung „Enkel“ auszuschließen.
- source_word: בְּעַמּוֹ
  choice: unter seinem Volk
  rationale: Die Präposition בְּ bezeichnet hier den gemeinschaftlichen Bereich, in dem der Betroffene steht. „Unter seinem Volk“ ist idiomatisches Deutsch und bewahrt den sozialen Bezug.
- source_word: שָׂרִיד
  choice: niemand bleibt übrig
  rationale: שָׂרִיד bezeichnet einen Übriggebliebenen oder Überlebenden. Die verbale Wiedergabe „niemand bleibt übrig“ klingt im Deutschen natürlich und gibt die völlige Auslöschung deutlich wieder.
- source_word: בִּמְגוּרָיו
  choice: an den Orten, wo er wohnte
  rationale: מָגוּר kann sowohl Wohnstätte als auch Ort eines vorübergehenden Aufenthalts bezeichnen. Die Übersetzung bleibt lesbar, während eine Fußnote die Bedeutungsbreite nennt.
