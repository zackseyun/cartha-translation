  source_fidelity: Die Übersetzung gibt die futurische Zusage der hebräischen Perfekta im Kontext angemessen wieder. „dass in deinem Zelt Frieden herrscht“ entspricht שָׁלוֹם in seiner umfassenden Bedeutung, ohne den konkreten Bildträger אָהֳלֶךָ aufzugeben. „wenn du deine Wohnstätte überprüfst“ ist für וּפָקַדְתָּ נָוְךָ kontextgerecht. „wirst du nichts vermissen“ gibt die hier wahrscheinliche, nichtmoralische Bedeutung von וְלֹא תֶחֱטָא treffend wieder und wahrt die in der Fußnote dokumentierte Alternative.
