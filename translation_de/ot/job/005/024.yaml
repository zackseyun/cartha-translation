source:
  edition: WLC
  text: וְֽ֭/יָדַעְתָּ כִּי שָׁל֣וֹם אָהֳלֶ֑/ךָ וּֽ/פָקַדְתָּ֥ נָ֝וְ/ךָ וְ/לֹ֣א תֶחֱטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/024.yaml
  text: You will know that your tent is at peace[a], and when you inspect your dwelling, you will not miss anything.
translation:
  language: de
  text: Du wirst erkennen, dass in deinem Zelt Frieden herrscht; und wenn du deine Wohnstätte überprüfst, wirst du nichts vermissen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und du wirst nicht sündigen“. Das hebräische Verb kann „sündigen“ bedeuten, hat aber auch den Grundsinn „verfehlen“; in diesem Zusammenhang ist wahrscheinlich gemeint, dass bei der Überprüfung nichts fehlt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Du wirst erkennen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im Zusammenhang dieser Verheißungen zukünftigen Sinn. „Erkennen“ gibt die zugesicherte Gewissheit natürlich wieder.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was erkannt wird, nicht primär eine Begründung.
- source_word: שָׁלוֹם
  choice: Frieden herrscht
  rationale: שָׁלוֹם bezeichnet hier Frieden, Sicherheit und unversehrtes Wohlergehen. Die Formulierung „in deinem Zelt Frieden herrscht“ bewahrt den Leitbegriff „Frieden“ und klingt im Deutschen natürlich.
- source_word: אָהֳלֶךָ
  choice: deinem Zelt
  rationale: Die konkrete Zeltmetaphorik und damit das altorientalische Bild werden beibehalten; zugleich kann das Zelt für den häuslichen Lebensbereich stehen.
- source_word: וּפָקַדְתָּ
  choice: wenn du ... überprüfst
  rationale: פקד kann besuchen, sich kümmern, mustern oder überprüfen bedeuten. Im Zusammenhang mit dem anschließenden Nichtvermissen passt eine überprüfende Bestandsaufnahme am besten.
- source_word: נָוְךָ
  choice: deine Wohnstätte
  rationale: נָוֶה kann Wohnort, Behausung oder Weideplatz bezeichnen. Parallel zu „Zelt“ ist hier der häusliche Sinn wahrscheinlich; „Wohnstätte“ wahrt zugleich den poetischen Ton.
- source_word: וְלֹא תֶחֱטָא
  choice: wirst du nichts vermissen
  rationale: חטא bedeutet häufig „sündigen“, kann aber grundlegend auch „verfehlen“ heißen. Nach dem Überprüfen der Wohnstätte liegt hier wahrscheinlich der Sinn nahe, dass nichts fehlt beziehungsweise vermisst wird.
theological_decisions:
- issue: Bedeutung von וְלֹא תֶחֱטָא im Zusammenhang
  choice: 'nichtmoralischer Sinn: „wirst du nichts vermissen“'
  alternative: „wirst du nicht sündigen“
  rationale: Der unmittelbare Zusammenhang handelt von Frieden und Unversehrtheit im häuslichen Bereich. Auf das Überprüfen der Wohnstätte folgt folgerichtig die Feststellung, dass nichts fehlt. Da die verbreitete moralische Bedeutung des Verbs jedoch echt und grammatisch möglich ist, wird sie in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Zeltmetaphorik. „Wohnstätte“ hält den poetischen Parallelismus, während „überprüfst“ und „nichts vermissen“ für heutige Leser verständlich bleiben.
