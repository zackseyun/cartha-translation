  terminology: „Frieden“ bewahrt den zentralen Begriff שָׁלוֹם. „Zelt“ erhält das historische Bild. „Wohnstätte“ ist eine angemessene poetisch-neutrale Wiedergabe von נָוֶה. Die Fußnote erläutert die lexikalische Mehrdeutigkeit von חטא sachlich und ohne theologische Festlegung.
