  text: מֵ֭פֵר מַחְשְׁב֣וֹת עֲרוּמִ֑ים וְֽ/לֹא תַעֲשֶׂ֥ינָה יְ֝דֵי/הֶ֗ם תּוּשִׁיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/012.yaml
  text: He frustrates the schemes of the crafty, so that their hands accomplish no success.
translation:
  language: de
  text: Er vereitelt die Pläne der Listigen, sodass ihre Hände keinen Erfolg erzielen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: vereitelt
  rationale: Das Partizip bezeichnet hier das Durchkreuzen oder Unwirksammachen von Plänen; „vereitelt“ gibt dies im Deutschen prägnant wieder.
- source_word: מַחְשְׁבוֹת
  choice: Pläne
  rationale: Das Wort kann Gedanken, Absichten oder Vorhaben bezeichnen; im Zusammenhang mit den Listigen sind konkrete „Pläne“ gemeint.
- source_word: עֲרוּמִים
  choice: Listigen
  rationale: עָרוּם kann je nach Zusammenhang klug, schlau oder listig bedeuten; hier ist wegen der vereitelten Vorhaben die negative Bedeutung passend.
- source_word: תּוּשִׁיָּה
  choice: Erfolg
  rationale: Das seltene Wort umfasst wirkungsvolle Klugheit, Tüchtigkeit oder Gelingen. Im Satz bezeichnet es das erfolgreiche Ergebnis des Handelns; „Erfolg“ ist hier klar und kontextgerecht.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt
  choice: Das maskuline Singularpronomen wird mit „Er“ wiedergegeben.
  alternative: „Gott“ ausdrücklich einsetzen.
  rationale: Der unmittelbare Kontext identifiziert den Handelnden, doch der hebräische Vers selbst nennt ihn nicht erneut. Das Pronomen bewahrt die Textform, ohne eine erklärende Ergänzung einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild der handelnden „Hände“ bleibt erhalten; die Formulierung ist zugleich für heutige Leser verständlich.
