source:
  edition: WLC
  text: כִּ֤י לֹא יֵצֵ֣א מֵ/עָפָ֣ר אָ֑וֶן וּ֝/מֵ/אֲדָמָ֗ה לֹא יִצְמַ֥ח עָמָֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/006.yaml
  text: For trouble does not come from the dust[a], nor does toil sprout from the ground.
translation:
  language: de
  text: Denn nicht aus dem Staub kommt Unheil hervor[a], und nicht aus dem Erdboden wächst Mühsal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn nicht aus dem Staub kommt Unrecht hervor, und nicht aus dem Erdboden wächst Elend.« Die hebräischen Begriffe können sowohl moralische Verkehrtheit als auch Unheil, Leid oder Mühsal bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt den argumentativen Zusammenhang.
- source_word: יֵצֵא
  choice: kommt ... hervor
  rationale: Gibt das Hervorgehen aus einer Quelle natürlich wieder und entspricht dem Bild des Parallelglieds.
- source_word: מֵעָפָר
  choice: aus dem Staub
  rationale: עָפָר bezeichnet gewöhnlich Staub; mit bestimmtem Artikel ist die Wendung im Deutschen idiomatisch.
- source_word: אָוֶן
  choice: Unheil
  rationale: Das Wort kann sowohl moralische Verkehrtheit als auch daraus entstehendes Leid oder Unheil bezeichnen. Im Zusammenhang mit עָמָל und dem Thema des Leidens passt »Unheil«, ohne moralische Kausalität festzuschreiben.
- source_word: וּמֵאֲדָמָה
  choice: und nicht aus dem Erdboden
  rationale: אֲדָמָה bezeichnet Boden oder Ackererde; »Erdboden« bewahrt das Wachstumsbild und bildet einen natürlichen Parallelismus zu »Staub«.
- source_word: יִצְמַח
  choice: wächst
  rationale: Das Verb bezeichnet pflanzliches Sprießen oder Wachsen. »Wächst« klingt im Deutschen natürlich und hält die agrarische Metapher aufrecht.
- source_word: עָמָל
  choice: Mühsal
  rationale: עָמָל umfasst mühevolle Arbeit, Beschwernis und Leid. »Mühsal« bewahrt diese Spannweite und den poetischen Parallelismus zu »Unheil«.
theological_decisions:
- issue: Bedeutung von אָוֶן und עָמָל in Elifas’ Aussage
  choice: Die Aussage handelt von Unheil und Mühsal, die nicht von selbst aus der Erde hervorgehen.
  alternative: Die Aussage handelt ausdrücklich von Sünde beziehungsweise Bosheit und ihrem moralischen Ertrag.
  rationale: Der Kontext betrifft menschliches Leiden, doch beide hebräischen Begriffe können auch moralische Bedeutungen tragen. Die Übersetzung bewahrt die Spannung und schreibt dem Vers keine eindeutigere Lehre über die Ursache des Leidens zu, als sein Wortlaut hergibt.
translation_notes:
  register: Moderne, würdige Standardsprache mit knappem poetischem Parallelismus. »Erdboden« und »wächst« erhalten das landwirtschaftliche Bild; die Lexik lässt die echte semantische und theologische Mehrdeutigkeit stehen.
