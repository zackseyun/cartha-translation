base_translation:
  language: en
  yaml_path: translation/ot/job/005/002.yaml
  text: For vexation kills the fool[a], and jealousy puts the simple to death.
translation:
  language: de
  text: Denn den Narren bringt der Zorn um, und die Eifersucht tötet den leichtgläubigen Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Neid. Das hebräische Wort kann sowohl Eifersucht als auch Neid bezeichnen; hier geht es um eine zerstörerische Leidenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Elifas’ begründende Aussage ein und verbindet den Vers argumentativ mit dem Vorangehenden.
- source_word: לֶאֱוִיל
  choice: den Toren
  rationale: אֱוִיל bezeichnet in der Weisheitsliteratur einen moralisch und praktisch törichten Menschen, nicht bloß jemanden mit geringer Intelligenz. Die generische Form gibt die sprichwortartige Aussage wieder.
- source_word: יַהֲרָג
  choice: bringt ... um
  rationale: Das Qal-Imperfekt hat hier allgemeingültige, sprichwortartige Bedeutung. „Bringt ... um“ ist gegenwärtiges, natürliches Deutsch und bewahrt die tödliche Aussage.
- source_word: כָּעַשׂ
  choice: Groll
  rationale: כַּעַשׂ kann Ärger, Verdruss, Kränkung oder erregten Unmut bezeichnen. „Groll“ erfasst hier eine anhaltende, zerstörerische innere Erregung und steht passend parallel zu קִנְאָה.
- source_word: וּפֹתֶה
  choice: und den Unerfahrenen
  rationale: פֹּתֶה bezeichnet in der Weisheitsliteratur einen unerfahrenen, leicht beeinflussbaren Menschen. „Unerfahrenen“ vermeidet die heute oft rein abwertende Wirkung von „Einfältigen“, ohne die Verletzlichkeit der bezeichneten Person zu verlieren.
- source_word: תָּמִית
  choice: tötet
  rationale: 'Das Hifil von מות ist kausativ: Die Eifersucht bewirkt den Tod. Im Deutschen drückt „tötet“ diese Verursachung knapp und unmittelbar aus.'
- source_word: קִנְאָה
  choice: Eifersucht
  rationale: קִנְאָה bezeichnet hier parallel zu כָּעַשׂ eine zerstörerische Leidenschaft. „Eifersucht“ wahrt den negativen emotionalen Sinn; „Neid“ bleibt als echte lexikalische Alternative in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem weisheitlichem Parallelismus. Die beiden Halbverse werden lexikalisch leicht variiert („bringt ... um“ / „tötet“), ohne den engen Bedeutungsparallelismus des Hebräischen abzuschwächen.
