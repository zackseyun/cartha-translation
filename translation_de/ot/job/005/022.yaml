  text: לְ/שֹׁ֣ד וּ/לְ/כָפָ֣ן תִּשְׂחָ֑ק וּֽ/מֵ/חַיַּ֥ת הָ֝/אָ֗רֶץ אַל תִּירָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/022.yaml
  text: At destruction and famine you will laugh[a], and you will not fear the beasts of the earth.
translation:
  language: de
  text: Über Verwüstung und Hungersnot wirst du lachen, und vor den wilden Tieren des Landes wirst du dich nicht fürchten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Fürchte dich nicht vor den wilden Tieren des Landes.« Die hebräische Form kann als Verbot gelesen werden; im Zusammenhang dient sie wahrscheinlich als Zusicherung von Schutz.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁד
  choice: Verwüstung
  rationale: Das Wort bezeichnet gewaltsame Zerstörung oder Verheerung. »Verwüstung« ist im Deutschen prägnant, poetisch angemessen und bildet mit »Hunger« ein Paar von Katastrophen.
- source_word: כָפָן
  choice: Hunger
  rationale: Das Substantiv kann Hunger oder Hungersnot bezeichnen. Ohne Artikel ist »Hunger« natürlich und bewahrt die knappe Parallelstruktur des Hebräischen.
- source_word: תִּשְׂחָק
  choice: wirst du lachen
  rationale: Das Verb bedeutet lachen und kann hier furchtlose Überlegenheit gegenüber drohendem Unheil ausdrücken. Die wörtliche Bildsprache bleibt erhalten, ohne sie als Spott festzulegen.
- source_word: מֵחַיַּת הָאָרֶץ
  choice: vor den wilden Tieren des Landes
  rationale: חַיָּה bezeichnet in diesem Zusammenhang am ehesten wild lebende Tiere. »Des Landes« gibt הָאָרֶץ im konkreten irdischen Sinn natürlich wieder.
- source_word: אַל תִּירָא
  choice: wirst du dich nicht fürchten
  rationale: Obwohl אַל mit dem Imperfekt gewöhnlich ein Verbot ausdrückt, lässt sich die Form im Zusammenhang der zugesagten Bewahrung als verheißende Zusicherung verstehen. Die Fußnote nennt die grammatisch naheliegende Alternative.
theological_decisions:
- issue: Aussageweise von אַל תִּירָא im Kontext
  choice: 'Verheißende Zusicherung: »wirst du dich nicht fürchten«'
  alternative: 'Verbot oder Ermutigung: »Fürchte dich nicht«'
  rationale: Die umgebenden Verse schildern zugesagte Bewahrung und künftigen Segen; daher passt eine Zusicherung zur Abfolge der Imperfektformen. Weil אַל normalerweise eine verneinte Aufforderung einleitet, wird die echte Mehrdeutigkeit ausdrücklich in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die Satzstellung erhält die beiden parallelen Versteile; »wilde Tiere« ist heute verständlicher als das altertümlichere »Tiere des Feldes« oder »Bestien«.
