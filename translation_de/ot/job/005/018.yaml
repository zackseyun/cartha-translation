  text: כִּ֤י ה֣וּא יַכְאִ֣יב וְ/יֶחְבָּ֑שׁ יִ֝מְחַ֗ץ ו/יד/ו תִּרְפֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/018.yaml
  text: For he causes pain[a], but he binds up; he shatters, but his hands heal.
translation:
  language: de
  text: Denn er fügt Schmerzen zu, doch er verbindet; er zerschmettert, doch seine Hände heilen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „seine Hand“ im Singular, das Verb „heilen“ jedoch im Plural. Die pluralische Wiedergabe „seine Hände heilen“ folgt dem Verb und dem naheliegenden Sinn.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Aussage ein und bewahrt die erklärende beziehungsweise kausale Funktion.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen hebt das Subjekt hervor; im Deutschen genügt im Zusammenhang das natürliche „er“.
- source_word: יַכְאִיב
  choice: fügt Schmerzen zu
  rationale: Der Hifil von כאב bezeichnet das Verursachen von Schmerz. Die Wiedergabe bleibt direkt, ohne vorzeitig das konkretere Bild einer Verwundung einzuführen.
- source_word: וְיֶחְבָּשׁ
  choice: doch er verbindet
  rationale: חבש bezeichnet hier das Verbinden einer Verletzung. „Doch“ bringt den im Parallelismus klaren Gegensatz natürlich zum Ausdruck.
- source_word: יִמְחַץ
  choice: er zerschmettert
  rationale: מחץ bezeichnet heftiges Schlagen oder Zermalmen. „Zerschmettert“ bewahrt die starke poetische Bildsprache und den Kontrast zum Heilen.
- source_word: וְיָדוֹ
  choice: doch seine Hand
  rationale: Der masoretische Konsonantentext hat das Substantiv im Singular („seine Hand“); diese auffällige Form wird im Haupttext bewahrt.
- source_word: תִּרְפֶּינָה
  choice: heilt
  rationale: רפא bedeutet im Qal „heilen“. Die deutsche Singularform richtet sich grammatisch nach „seine Hand“; die Abweichung zum pluralischen hebräischen Verb wird in der Fußnote offengelegt.
theological_decisions:
- issue: Göttliches Handeln in Leid und Wiederherstellung
  choice: Sowohl das Zufügen von Schmerz als auch das Verbinden und Heilen wird unmittelbar Gott zugeschrieben.
  alternative: Die erste Aussage abschwächen, etwa mit „er lässt Schmerzen zu“.
  rationale: Der hebräische Text nennt Gott ausdrücklich als Handelnden auf beiden Seiten. Die Übersetzung bewahrt diese theologische Spannung, statt sie erklärend abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelität. Die adversative Wiedergabe „doch“ verdeutlicht den im Vers angelegten Kontrast, ohne zusätzliche Deutung einzutragen.
