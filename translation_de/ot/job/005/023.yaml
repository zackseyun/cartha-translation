base_translation:
  language: en
  yaml_path: translation/ot/job/005/023.yaml
  text: For you will have a covenant with the stones of the field[c][b][a], and the wild animals of the field will be at peace with you.
translation:
  language: de
  text: Denn du wirst mit den Steinen des Feldes einen Bund haben[a], und die wilden Tiere des Feldes werden mit dir Frieden halten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dein Bund ist mit den Steinen des Feldes.“ Gemeint sein können die Steine auf dem Acker, die bei der Feldarbeit Hindernisse darstellen; das hebräische Bild bleibt im Text erhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „werden mit dir Frieden geschlossen haben“ oder „werden mit dir in Frieden sein“. Das Hebräische beschreibt ein hergestelltes oder bestehendes Friedensverhältnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Zusage und stellt den logischen Zusammenhang im Deutschen natürlich her.
- source_word: עִם אַבְנֵי הַשָּׂדֶה בְרִיתֶךָ
  choice: mit den Steinen des Feldes stehst du im Bund
  rationale: Der hebräische Nominalsatz enthält kein ausdrückliches Verb. „Im Bund stehen“ ergänzt es idiomatisch, bewahrt aber das konkrete poetische Bild der Feldsteine.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: und die wilden Tiere des Feldes
  rationale: חַיָּה bezeichnet in dieser Verbindung Tiere der freien Wildbahn; „wilde Tiere“ ist im modernen Deutschen klarer und natürlicher als „Tiere“ oder „Getier“ allein.
- source_word: הָשְׁלְמָה לָךְ
  choice: werden mit dir in Frieden leben
  rationale: Die Form von שׁלם bezeichnet ein hergestelltes beziehungsweise bestehendes Friedensverhältnis. Die Zukunftsform entspricht dem Zusagekontext, während „in Frieden leben“ die Beziehung im Deutschen verständlich ausdrückt.
