base_translation:
  language: en
  yaml_path: translation/ot/job/005/020.yaml
  text: In famine he will redeem you from death[b][a], and in war from the power of the sword.
translation:
  language: de
  text: In der Hungersnot erlöst[a] er dich vom Tod und im Krieg aus der Gewalt des Schwertes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „befreit er dich“ oder „rettet er dich“. Das hebräische Verb bezeichnet Freikauf, Befreiung oder Rettung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus den Händen des Schwertes“; eine bildhafte Wendung für die Gewalt des Schwertes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָב
  choice: In der Hungersnot
  rationale: רָעָב kann Hunger oder Hungersnot bezeichnen. Im Zusammenhang einer umfassenden Notlage ist „Hungersnot“ die konkrete und natürliche Wiedergabe; בְּ bezeichnet den Umstand.
- source_word: פָּדְךָ
  choice: erlöst er dich
  rationale: פדה bezeichnet Loskauf, Befreiung oder Rettung. „erlöst“ bewahrt das gewichtige Freilassungsprofil des Verbs, ohne hier eine weitergehende heilsgeschichtliche Aussage vorauszusetzen.
- source_word: מִמָּוֶת
  choice: vom Tod
  rationale: מִן bezeichnet die Trennung beziehungsweise Rettung aus einer Gefahr; מָוֶת wird als konkretes Substantiv „Tod“ erhalten.
- source_word: וּבְמִלְחָמָה
  choice: und im Krieg
  rationale: מִלְחָמָה bedeutet Krieg oder Kampf. „im Krieg“ entspricht dem allgemeinen Sinn und steht parallel zu „in der Hungersnot“.
- source_word: מִידֵי
  choice: aus der Gewalt
  rationale: Die Wendung „aus den Händen von“ bezeichnet idiomatisch die Macht oder Gewalt, der jemand ausgeliefert ist. Beim Schwert ist „aus der Gewalt“ im Deutschen natürlich und inhaltlich präzise.
- source_word: חָרֶב
  choice: des Schwertes
  rationale: חָרֶב ist die übliche Bezeichnung für das Schwert und steht hier zugleich für tödliche Kriegsgewalt.
theological_decisions:
- issue: Wiedergabe von פדה im Weisheitskontext
  choice: erlöst
  alternative: rettet; kauft frei
  rationale: „Erlöst“ erhält die stärkere Bedeutung von Freisetzung oder Befreiung. Der Vers spricht im unmittelbaren Zusammenhang von Rettung aus zeitlicher Not; eine umfassendere soteriologische Bedeutung wird daher nicht ausdrücklich hineingelesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erhalten; das im zweiten Halbvers ausgelassene Verb wird aus dem ersten Halbvers mitverstanden. Die Fußnoten sichern sowohl die Bedeutungsbreite von פדה als auch das hebräische Bild „Hände des Schwertes“.
