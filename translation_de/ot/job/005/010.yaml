lexical_decisions:
- source_word: הַנֹּתֵן מָטָר
  choice: der Regen … fallen lässt
  rationale: Das substantivierte Qal-Partizip führt die Beschreibung Gottes aus dem vorigen Vers fort. Die Wendung bedeutet wörtlich »der Regen gibt«; »Regen … fallen lässt« gibt dies in natürlichem modernem Deutsch wieder, ohne die Aussage zu erweitern.
- source_word: עַל־פְּנֵי אָרֶץ
  choice: auf die Erde
  rationale: Die hebräische Wendung bezeichnet die Oberfläche der Erde beziehungsweise des Landes. Im Deutschen ist »auf die Erde« idiomatisch; die wörtliche Wiedergabe »auf das Angesicht der Erde« wäre hier unnötig fremdsprachlich.
- source_word: וְשֹׁלֵחַ מַיִם
  choice: und Wasser … schickt
  rationale: Das parallele Qal-Partizip שֹׁלֵחַ bezeichnet ein Senden oder Schicken. מַיִם wird im Deutschen idiomatisch als Stoffbezeichnung im Singular wiedergegeben.
- source_word: עַל־פְּנֵי חוּצוֹת
  choice: über das offene Land
  rationale: חוּצוֹת kann Straßen, Plätze oder Bereiche außerhalb geschlossener Siedlungen bezeichnen. Im Zusammenhang mit Regen und in der Parallele zu אָרֶץ ist »das offene Land« die naheliegende, zugleich bewusst nicht zu enge Wiedergabe.
theological_decisions:
- issue: Reichweite von אָרֶץ
  choice: Erde
  alternative: Land
  rationale: Der Zusammenhang beschreibt Gottes allgemeines Wirken in der Schöpfung und nennt kein bestimmtes Gebiet. Dennoch bleibt »Land« lexikalisch möglich und wird daher in einer Fußnote bewahrt.
- issue: Bedeutung von חוּצוֹת
  choice: offenes Land
  alternative: Straßen oder freie Flächen
  rationale: Die Naturbeschreibung legt unbebautes beziehungsweise frei liegendes Land nahe. Da das Wort andernorts auch städtische Außenräume und Straßen bezeichnen kann, wird diese Mehrdeutigkeit nicht verschwiegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die poetische Parallelität der beiden Satzhälften bleibt erhalten; die hebräische Wiederholung von »auf dem Angesicht von« wird zugunsten einer natürlichen deutschen Formulierung idiomatisch wiedergegeben.
