  text: 'um die Niedrigen in die Höhe zu setzen,

    sodass die Trauernden zur Rettung erhöht werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sodass die Verdüsterten zum Heil erhöht werden“ oder „… in Sicherheit erhöht werden“. Das hebräische Wort für „Trauernde“ kann auch Menschen bezeichnen, die verdüstert oder düster sind; es verbindet Trauer mit dem Bild des Dunkelwerdens. „Rettung“ kann auch „Heil“ oder „Sicherheit“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָשׂוּם
  choice: zu setzen
  rationale: Der Infinitiv von שׂוּם bezeichnet im Zusammenhang mit dem vorangehenden Vers Zweck oder Folge. „Zu setzen“ bewahrt die konkrete verbale Aussage.
- source_word: שְׁפָלִים
  choice: Niedrige
  rationale: Das Adjektiv bezeichnet Menschen in niedriger, erniedrigter oder demütiger Stellung. „Niedrige“ lässt soziale und existentielle Erniedrigung offen, ohne eine moralische Eigenschaft festzulegen.
- source_word: לְמָרוֹם
  choice: in die Höhe
  rationale: מָרוֹם bezeichnet Höhe oder einen erhöhten Ort. Die Formulierung erhält den räumlichen Gegensatz zu den „Niedrigen“.
- source_word: וְקֹדְרִים
  choice: Trauernde
  rationale: Das Partizip von קדר kann Menschen bezeichnen, die verdunkelt, düster oder trauernd sind. „Trauernde“ gibt den kontextuellen Sinn natürlich wieder; die Bildsprache der Verdunkelung wird in der Fußnote bewahrt.
- source_word: שָׂגְבוּ
  choice: emporzuheben
  rationale: שׂגב bezeichnet das Hochsein beziehungsweise das sichere Erhöhtwerden. Im deutschen Infinitivgefüge wird die finite hebräische Form idiomatisch als parallele Zweck- oder Folgeaussage wiedergegeben.
- source_word: יֶשַׁע
  choice: zum Heil
  rationale: יֶשַׁע umfasst Rettung, Befreiung und Sicherheit. „Heil“ bewahrt die semantische und theologische Weite, ohne den unmittelbaren Sinn konkreter Rettung auszuschließen.
theological_decisions:
- issue: Wiedergabe von יֶשַׁע im weisheitlichen Zusammenhang
  choice: Heil
  alternative: Rettung; Sicherheit
  rationale: „Heil“ erhält die Breite des hebräischen Begriffs und seine theologische Resonanz, ohne ihn auf eine spätere dogmatische Bedeutung festzulegen. Im unmittelbaren Zusammenhang kann weiterhin konkrete Rettung gemeint sein.
translation_notes:
  register: Moderne, würdige Standardsprache. Der poetische Gegensatz zwischen Niedrigkeit und Höhe bleibt erhalten. Die Infinitivkonstruktion schließt syntaktisch an Hiob 5,9 an; der Zeilenumbruch bildet den hebräischen Parallelismus ab.
