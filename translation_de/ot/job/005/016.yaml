base_translation:
  language: en
  yaml_path: translation/ot/job/005/016.yaml
  text: So there is hope for the poor[a], and injustice shuts its mouth.
translation:
  language: de
  text: So gibt es Hoffnung für den Armen, und das Unrecht verschließt seinen Mund.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Bosheit verschließt ihren Mund“; wörtlicher auch: „und der Mund des Unrechts schließt sich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: So gibt es
  rationale: Das Wayyiqtol von היה führt hier die Folge der vorausgehenden Aussage ein. „So“ wahrt den Folgezusammenhang; das Präsens gibt den allgemeinen, sprichwortartigen Sinn natürlich wieder.
- source_word: לַדַּל
  choice: für den Armen
  rationale: דַּל kann einen armen, schwachen oder sozial machtlosen Menschen bezeichnen. „der Arme“ ist idiomatisch und lässt wirtschaftliche Not wie gesellschaftliche Schutzlosigkeit mitschwingen.
- source_word: תִּקְוָה
  choice: Hoffnung
  rationale: תִּקְוָה bezeichnet Hoffnung oder Erwartung. „Hoffnung“ passt klar zum Gegensatz, dass das Unrecht zum Schweigen gebracht wird.
- source_word: וְעֹלָתָה
  choice: und das Unrecht
  rationale: עַוְלָה bezeichnet Unrecht, Ungerechtigkeit oder verwerfliches Handeln. „Unrecht“ ist im Deutschen knapp, umfassend und lässt die Personifikation des hebräischen Textes bestehen.
- source_word: קָפְצָה פִּיהָ
  choice: verschließt seinen Mund
  rationale: Wörtlich beschreibt die Wendung, dass „sein/ihr Mund sich schloss“ beziehungsweise geschlossen wurde. Die Übersetzung bewahrt das anschauliche Bild und gibt das Verstummen des personifizierten Unrechts wieder.
theological_decisions: []
