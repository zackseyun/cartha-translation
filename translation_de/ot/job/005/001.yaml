source:
  edition: WLC
  text: קְֽרָא נָ֭א הֲ/יֵ֣שׁ עוֹנֶ֑/ךָּ וְ/אֶל מִ֖י מִ/קְּדֹשִׁ֣ים תִּפְנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/001.yaml
  text: Call now—is there anyone who will answer you? And to which of the holy ones will you turn?[a]
translation:
  language: de
  text: Ruf doch! Gibt es jemanden, der dir antwortet? Und an wen von den Heiligen[a] willst du dich wenden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »heiligen Wesen«. Gemeint sind hier wahrscheinlich himmlische Wesen.'
    reason: Lexikalische Alternative und sachliche Einordnung des mehrdeutigen substantivierten Adjektivs מִקְּדֹשִׁים.
lexical_decisions:
- source_word: קְרָא נָא
  choice: Ruf doch!
  rationale: Der Imperativ קְרָא fordert zum Rufen auf; נָא verleiht der Aufforderung hier Nachdruck. „Doch“ klingt im deutschen Streitgespräch natürlich und weniger höflich als „bitte“.
- source_word: הֲיֵשׁ עוֹנֶךָ
  choice: Gibt es jemanden, der dir antwortet?
  rationale: Die Existenzfrage הֲיֵשׁ wird direkt wiedergegeben; עוֹנֶךָ bezeichnet substantivisch einen, der dem Angeredeten antwortet.
- source_word: וְאֶל מִי מִקְּדֹשִׁים
  choice: Und an wen von den Heiligen
  rationale: Die Präpositionen werden transparent mit „an wen von“ wiedergegeben. „Heilige“ bewahrt die substantivische Mehrzahl von קָדוֹשׁ, ohne die Identität im Haupttext ausdrücklich festzulegen.
- source_word: תִּפְנֶה
  choice: willst du dich wenden
  rationale: פנה bedeutet wörtlich „sich wenden“. Die deutsche reflexive Form bewahrt das Bild und lässt den im Kontext naheliegenden Gedanken einer Bitte um Hilfe anklingen, ohne ihn auszuschreiben.
theological_decisions:
- issue: Identität der „Heiligen“ (מִקְּדֹשִׁים)
  choice: Im Haupttext „Heilige“, mit Hinweis auf wahrscheinlich himmlische Wesen
  alternative: Heilige Wesen; Engel; menschliche Heilige
  rationale: Der Kontext des Hiobbuches legt himmlische Wesen nahe. Die allgemeinere Wiedergabe „Heilige“ bewahrt jedoch die lexikalische Offenheit und vermeidet es, eine spätere konfessionelle Vorstellung oder die engere Bezeichnung „Engel“ in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen rhetorischen Fragen und der herausfordernde Ton Elifas’ bleiben erhalten; „Ruf doch!“ gibt die disputative Zuspitzung idiomatisch wieder.
