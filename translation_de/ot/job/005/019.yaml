id: JOB.5.19
reference: Job 5:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/שֵׁ֣שׁ צָ֭רוֹת יַצִּילֶ֑/ךָּ וּ/בְ/שֶׁ֓בַע לֹא יִגַּ֖ע בְּ/ךָ֣ רָֽע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/019.yaml
  text: In six troubles he will deliver you[a]; even in seven[b], no evil will touch you.
translation:
  language: de
  text: Aus sechs Nöten wird er dich retten[a], und in sieben wird kein Unheil dich treffen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische poetische Formel „sechs … und sieben“ bezeichnet wiederholte oder umfassende Rettung; sie setzt nicht unbedingt eine wörtliche Obergrenze von genau sieben Nöten.
    reason: cultural_note
  - marker: b
    text: 'Oder: „wird dich nichts Böses berühren“ beziehungsweise „wird kein Unglück dich erreichen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֵׁשׁ
  choice: Aus sechs
  rationale: 'Bei יַצִּיל kann בְּ mit der Zahl im Deutschen natürlich als „aus“ wiedergegeben werden: Er rettet aus den Nöten. Die Zahlenform des hebräischen Spruchs bleibt erhalten.'
- source_word: צָרוֹת
  choice: Nöten
  rationale: צָרוֹת bezeichnet Bedrängnisse, Notlagen oder Widrigkeiten. „Nöte“ ist breit genug und passt zum gehobenen poetischen Ton.
- source_word: יַצִּילֶךָּ
  choice: wird er dich retten
  rationale: Der Hifil von נצל bedeutet „retten, entreißen“. Die implizite männliche Einzahl bleibt entsprechend dem Hebräischen als Pronomen stehen.
- source_word: וּבְשֶׁבַע
  choice: und in sieben
  rationale: Die wörtliche Steigerungsform „sechs … sieben“ wird bewahrt. Das Deutsche kann die klimaktische Fortführung mit „und“ natürlich ausdrücken.
- source_word: לֹא יִגַּע בְּךָ
  choice: wird … dich [nicht] treffen
  rationale: נגע mit בְּ kann „berühren, erreichen, treffen“ bedeuten. „Dich treffen“ ist in Verbindung mit Unheil idiomatisches Deutsch.
- source_word: רָע
  choice: Unheil
  rationale: רָע kann hier schädliches Übel, Unglück oder Unheil bezeichnen. „Unheil“ passt zum Zusammenhang äußerer Nöte, ohne die Aussage auf körperlichen Schaden zu verengen.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts von יַצִּילֶךָּ
  choice: „er“ bleibt stehen
  alternative: „Gott wird dich retten“
  rationale: Im Kontext ist Gott gemeint, doch der Vers nennt ihn nicht ausdrücklich. Das Pronomen bewahrt die Form des hebräischen Textes und fügt keinen Gottesnamen ein.
- issue: Bedeutung der Zahlenfolge „sechs … sieben“
  choice: Die Zahlen werden als poetische Steigerungsform beibehalten.
  alternative: Eine Paraphrase wie „immer wieder“ oder eine streng auf genau sieben Nöte begrenzte Aussage
  rationale: Die hebräische Zahlenformel drückt Steigerung und umfassende beziehungsweise wiederholte Bewahrung aus. Der Haupttext erhält das Bild, während die Fußnote seine idiomatische Funktion erläutert.
- issue: Bedeutungsbreite von רָע
  choice: „Unheil“
  alternative: „Böses“
  rationale: Der Zusammenhang handelt von Notlagen und Rettung. „Unheil“ gibt die mögliche Bedeutung als schädigendes Ereignis wieder, ohne eine Aussage über moralisches Böses zu erzwingen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem poetischem Ton. Die parallele Zahlenstruktur des Hebräischen und das unausgesprochene, im Kontext auf Gott bezogene Subjekt bleiben erhalten.
