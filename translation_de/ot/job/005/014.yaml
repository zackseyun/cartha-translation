base_translation:
  language: en
  yaml_path: translation/ot/job/005/014.yaml
  text: By day they meet darkness[a], and at noon they grope as in the night.
translation:
  language: de
  text: Am Tag stoßen sie auf Finsternis, und am Mittag tasten sie wie bei Nacht umher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als wäre es Nacht“. Das Hebräische vergleicht ihr Tasten am Mittag mit dem Tasten bei Nacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם
  choice: Am Tag
  rationale: Die adverbiale Zeitangabe wird knapp und idiomatisch wiedergegeben und bildet den Gegensatz zu Nacht und Mittag ab.
- source_word: יְפַגְּשׁוּ
  choice: stoßen sie auf
  rationale: פגשׁ bezeichnet hier das Begegnen oder Antreffen; „auf etwas stoßen“ vermittelt im Deutschen die unerwartete Begegnung mit der Finsternis natürlich.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: Die Wiedergabe bewahrt sowohl die konkrete Bildsprache als auch ihre mögliche übertragene Bedeutung im Weisheitskontext.
- source_word: וְכַלַּיְלָה
  choice: wie in der Nacht
  rationale: 'Die Vergleichspartikel כ wird als Vergleich ausgedrückt: Obwohl es Mittag ist, bewegen sie sich tastend, als herrsche Nacht.'
- source_word: יְמַשְׁשׁוּ
  choice: tasten sie umher
  rationale: משׁשׁ bezeichnet das tastende Suchen in fehlendem Licht; „umhertasten“ gibt die körperliche Bildhaftigkeit präzise und verständlich wieder.
- source_word: בַצָּהֳרָיִם
  choice: am Mittag
  rationale: Die genaue Tageszeit bleibt erhalten und verstärkt den scharfen Gegensatz zwischen größter Helligkeit und erfahrenem Dunkel.
