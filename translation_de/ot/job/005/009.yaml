lexical_decisions:
- source_word: עֹשֶׂה
  choice: der … tut
  rationale: Das Qal-Partizip beschreibt im Zusammenhang Gott relativisch. „der … tut“ ist im Deutschen natürlich und bewahrt diese Funktion.
- source_word: גְדֹלוֹת
  choice: große Dinge
  rationale: Das substantivisch gebrauchte Adjektiv im Plural wird direkt und verständlich wiedergegeben, ohne es enger als „Taten“ oder „Werke“ auszulegen.
- source_word: וְאֵין חֵקֶר
  choice: die nicht zu ergründen sind
  rationale: Die Formulierung gibt die Unmöglichkeit vollständiger Erforschung idiomatisch wieder und lässt zugleich erkennen, dass sie sich auf die großen Dinge bezieht.
- source_word: נִפְלָאוֹת
  choice: Wunder
  rationale: „Wunder“ bezeichnet außergewöhnliche, staunenerregende Taten und entspricht prägnant dem poetischen Parallelismus.
- source_word: עַד אֵין מִסְפָּר
  choice: ohne Zahl
  rationale: Die feste deutsche Wendung drückt die hebräische Aussage der Unzählbarkeit knapp aus und bewahrt den poetischen Rhythmus.
