base_translation:
  language: en
  yaml_path: translation/ot/job/005/003.yaml
  text: I have seen a fool taking root[a], and suddenly I cursed his dwelling.
translation:
  language: de
  text: Ich selbst habe gesehen, wie ein Tor Wurzeln schlug, und plötzlich verfluchte ich seine Wohnstätte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich erklärte seine Wohnstätte für verflucht“ oder „Ich erkannte seine Wohnstätte als dem Untergang geweiht.“ Das hebräische Verb kann einen ausgesprochenen Fluch oder eine urteilende Feststellung des Verhängnisses bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Ich selbst
  rationale: Das ausdrücklich gesetzte Personalpronomen wird zur Wiedergabe der hebräischen Betonung mit „selbst“ hervorgehoben.
- source_word: רָאִיתִי
  choice: habe gesehen
  rationale: Das Perfekt berichtet von Elifas’ eigener Erfahrung; das deutsche Perfekt klingt hier natürlich und bewahrt den Zeugnischarakter.
- source_word: אֱוִיל
  choice: ein Tor
  rationale: „Tor“ bezeichnet wie das hebräische Wort eine moralisch-geistliche Kategorie der Weisheitsliteratur, nicht bloß mangelnde Intelligenz.
- source_word: מַשְׁרִישׁ
  choice: Wurzeln schlug
  rationale: Die Form bezeichnet das Wurzelschlagen beziehungsweise Sichfestsetzen und bewahrt so das Bild scheinbarer Stabilität.
- source_word: וָאֶקּוֹב
  choice: da verfluchte ich
  rationale: Der unmittelbare lexikalische Sinn „verfluchen“ wird im Haupttext beibehalten; „da“ gibt den erzählerischen Anschluss wieder, ohne einen Gegensatz einzutragen.
- source_word: נָוֵהוּ
  choice: seine Wohnstätte
  rationale: „Wohnstätte“ gibt den umfassenden Sinn von Wohn- oder Aufenthaltsort würdig wieder, ohne ihn unnötig auf ein Haus zu verengen.
- source_word: פִתְאֹם
  choice: plötzlich
  rationale: Das Adverb bewahrt die im Hebräischen ausgedrückte Plötzlichkeit; seine genaue Zuordnung bleibt im Deutschen wie im Ausgangstext offen.
theological_decisions:
- issue: Bedeutung von וָאֶקּוֹב
  choice: Elifas sagt, dass er die Wohnstätte des Toren verfluchte.
  alternative: Elifas erkannte oder erklärte die Wohnstätte als verflucht beziehungsweise dem Untergang geweiht.
  rationale: Der direkte lexikalische Sinn stützt „verfluchen“. Da die Aussage jedoch auch als urteilende Feststellung verstanden werden kann, wird diese genuine Deutungsmöglichkeit in der Fußnote erhalten.
- issue: Bezug von פִתְאֹם
  choice: „plötzlich“ steht nach dem Verbalsatz und kann zunächst das Verfluchen näher bestimmen.
  alternative: „plötzlich“ kann inhaltlich die unvermittelte Erkenntnis oder den plötzlich eintretenden Untergang der Wohnstätte mit anklingen lassen.
  rationale: Die knappe poetische Wortstellung erlaubt mehr als eine Nuance. Die Übersetzung vermeidet eine erklärende Erweiterung, die diese Spannung auflösen würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Bildsprache der Weisheitsdichtung. „Tor“ und „Wohnstätte“ sind leicht gehoben, aber allgemein verständlich. Die Satzstellung lässt die poetische Abruptheit sowie die mögliche Mehrdeutigkeit von „plötzlich“ bestehen.
