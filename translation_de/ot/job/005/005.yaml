  text: אֲשֶׁ֤ר קְצִיר֨/וֹ רָ֘עֵ֤ב יֹאכֵ֗ל וְ/אֶֽל מִ/צִּנִּ֥ים יִקָּחֵ֑/הוּ וְ/שָׁאַ֖ף צַמִּ֣ים חֵילָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/005.yaml
  text: The hungry eat his harvest[a], and take it even from among the thorns, and the thirsty pant after their wealth.
translation:
  language: de
  text: Seine Ernte verzehrt der Hungrige und nimmt sie sogar aus den Dornen; und nach ihrem Vermögen lechzen die Durstigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine Schlinge/Falle verschlingt ihr Vermögen.“ Der hebräische Wortlaut des letzten Satzteils ist schwierig. Der Haupttext folgt der verbreiteten Deutung, bei der „die Durstigen“ parallel zu „der Hungrige“ steht.'
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִירוֹ
  choice: seine Ernte
  rationale: קָצִיר bezeichnet die Ernte beziehungsweise den Ertrag; das Possessivsuffix wird ausdrücklich wiedergegeben.
- source_word: רָעֵב
  choice: der Hungrige
  rationale: Das Adjektiv steht substantivisch. Der deutsche Singular bewahrt die grammatische Form und lässt zugleich eine typische Person erkennen.
- source_word: וְאֶל מִצִּנִּים יִקָּחֵהוּ
  choice: und holt sie sogar zwischen den Dornen hervor
  rationale: Die schwierige Wendung schildert, dass die Ernte selbst aus einem von Dornen umgebenen oder dornigen Bereich genommen wird. „Hervorholen“ gibt die räumliche Vorstellung natürlich wieder, ohne eine bestimmte Schutzvorrichtung festzulegen.
- source_word: צִנִּים
  choice: Dornen
  rationale: Die übliche Bedeutung passt zum landwirtschaftlichen Bild; weniger wahrscheinliche Deutungen wie „Haken“ werden nicht in den Haupttext aufgenommen.
- source_word: וְשָׁאַף
  choice: lechzen nach
  rationale: שָׁאַף kann heftiges Verlangen, Gieren oder Schnappen ausdrücken. „Lechzen nach“ erhält im Deutschen das Bild des Durstes und die begierige Ausrichtung auf den Besitz.
- source_word: צַמִּים
  choice: die Durstigen
  rationale: Diese verbreitete Deutung des schwierigen Ausdrucks schafft eine naheliegende Parallele zu „der Hungrige“. Die alternative Lesung als „Schlinge/Falle“ wird in der Fußnote bewahrt.
- source_word: חֵילָם
  choice: ihr Vermögen
  rationale: חַיִל kann Besitz, Mittel oder Wohlstand bezeichnen. „Vermögen“ ist im Zusammenhang präzise und bewahrt das pluralische Possessivsuffix.
theological_decisions:
- issue: Deutung des schwierigen Schlussglieds
  choice: „die Durstigen“ als Subjekt, die nach „ihrem Vermögen“ lechzen
  alternative: „Eine Schlinge/Falle verschlingt ihr Vermögen“
  rationale: Die Hauptfassung folgt der möglichen Vokalisierung und dem Parallelismus zwischen Hunger und Durst, ohne die textlich und lexikalisch mögliche Alternativdeutung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache von Hunger, Dornen und Durst bleibt erhalten; die schwierige Schlussklausel wird nicht stillschweigend vereindeutigt.
