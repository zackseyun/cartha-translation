  text: He catches the wise in their craftiness[c][b][a], and the counsel of the twisted is hurried along.
translation:
  language: de
  text: Er fängt die Weisen in ihrer eigenen List[a], und der Rat der Verschlagenen[b] wird überstürzt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „durch ihre eigene Schlauheit“ oder „in ihrer Arglist“. Das hebräische Wort kann je nach Zusammenhang auch Klugheit bezeichnen, ist hier aber negativ gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Verdrehten“; auch: „der Hinterhältigen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „wird hastig fortgetrieben“ oder „wird beschleunigt“. Das hebräische Verb bezeichnet zunächst Hast oder Überstürzung; ein Scheitern wird damit nicht ausdrücklich gesagt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹכֵד
  choice: fängt
  rationale: Das qalische Partizip wird im Zusammenhang verbal gebraucht; Gott ist aus dem Kontext als Subjekt zu ergänzen. „Fängt“ bewahrt das Bild des Fangens.
- source_word: חֲכָמִים
  choice: die Weisen
  rationale: Das substantivierte Adjektiv bezeichnet diejenigen, die als weise gelten, und erhält die ironische Zuspitzung.
- source_word: בְּעָרְמָם
  choice: in ihrer eigenen List
  rationale: עָרְמָה kann auch Klugheit bezeichnen, hat hier im Parallelismus jedoch eine negative Bedeutung. „Eigene“ verdeutlicht knapp, dass gerade ihre List zum Mittel ihres Fangs wird.
- source_word: וַעֲצַת
  choice: und der Rat
  rationale: עֵצָה kann Rat, Ratschlag oder Plan bedeuten. „Rat“ wahrt den Bezug zur Weisheitssprache und lässt sowohl Beratung als auch Vorhaben anklingen.
- source_word: נִפְתָּלִים
  choice: der Verschlagenen
  rationale: Das Wort bezeichnet wörtlich verdrehte und daraus übertragen hinterhältige oder verschlagene Menschen. „Verschlagene“ gibt den negativen Charakter in natürlichem Deutsch wieder.
- source_word: נִמְהָרָה
  choice: überstürzt sich
  rationale: Das feminine Singularverb stimmt mit „Rat“ überein und bezeichnet ein hastiges, übereiltes Vorgehen. Die reflexive Formulierung ist im Deutschen natürlich und bewahrt die Vorstellung, dass ihr Rat kopflos voraneilt, ohne den Ausgang ausdrücklich als Scheitern auszudeuten.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Partizips
  choice: „Er“ bezeichnet aufgrund des Zusammenhangs Gott.
  alternative: Eine unbestimmte Wiedergabe wie „Einer, der …“ oder eine subjektlose Konstruktion.
  rationale: Im unmittelbaren Kontext werden Gottes Taten beschrieben. Das im Deutschen nötige Pronomen führt dieses Subjekt fort, ohne eine neue Aussage einzutragen.
- issue: Moralische Färbung von עָרְמָה und נִפְתָּלִים
  choice: Negative Wiedergabe mit „List“ und „Verschlagenen“.
  alternative: Neutralere Wiedergaben wie „Klugheit“ und „Gewundenen“.
  rationale: Der Parallelismus beschreibt Menschen, deren Ränke Gott durchkreuzt. Daher liegt hier bei beiden Ausdrücken eine negative ethische Bedeutung nahe.
- issue: Aussage von נִמְהָרָה über den Rat
  choice: „überstürzt sich“ bewahrt vor allem die Bedeutung übereilter Hast.
  alternative: „wird vereitelt“, „kommt rasch zu Fall“ oder „wird fortgerissen“.
  rationale: Das Verb selbst bezeichnet zunächst Hast oder Übereilung. Ein ausdrückliches Scheitern ist im Kontext naheliegend, soll aber nicht als allein mögliche Bedeutung in den Haupttext eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Parallelstruktur bleibt erhalten. „Überstürzt sich“ ist idiomatisch, lässt aber die ungewöhnliche hebräische Personifikation des Rates stehen; die Fußnoten bewahren lexikalische Alternativen und die Spannung zwischen bloßer Hast und daraus folgendem Scheitern.
