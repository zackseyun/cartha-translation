  verdict: approve
  source_fidelity: 'Der Text gibt die hebräische Aussage zuverlässig wieder: Die Kinder sind von יֶשַׁע („Rettung“, auch „Befreiung/Sicherheit“) fern, werden am Stadttor zermalmt bzw. niedergedrückt, und es gibt keinen Retter. „Kinder“ ist für בָּנָיו als generische Nachkommenschaft vertretbar. „Zermalmt“ wahrt die starke Bildlichkeit von דכא, ohne die Art der Bedrängnis unnötig festzulegen.'
  naturalness: „Seine Kinder sind fern von Rettung; am Tor werden sie zermalmt, und niemand rettet sie“ ist modernes, würdiges und gut verständliches Standarddeutsch. Die knappe, parallele Satzstruktur passt zum poetischen Weisheitstext.
  terminology: „Rettung“ bildet die Wortverbindung mit „rettet“ im Schlussteil sinnvoll ab und vermeidet eine unangebrachte dogmatische Verengung von יֶשַׁע. „Am Tor“ ist im Deutschen idiomatisch; die Fußnote erklärt sachgerecht die gemeinte Institution des Stadttors. Die Fußnotenanker sind in der deutschen Fassung korrekt den jeweiligen Erläuterungen zugeordnet.
