id: JOB.5.4
reference: Job 5:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִרְחֲק֣וּ בָנָ֣י/ו מִ/יֶּ֑שַׁע וְ/יִֽדַּכְּא֥וּ בַ֝/שַּׁ֗עַר וְ/אֵ֣ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/004.yaml
  text: His children are far from safety[a], and they are crushed in the gate[b], with no one to rescue them.
translation:
  language: de
  text: Seine Kinder sind fern von Rettung[a]; am Tor[b] werden sie zermalmt, und niemand rettet sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fern von Befreiung“ oder „fern von Sicherheit“.'
    reason: lexical_alternative
  - marker: b
    text: Das Tor meint das Stadttor, den üblichen Ort für Rechtsprechung und öffentliche Entscheidungen.
    reason: cultural_note
lexical_decisions:
- source_word: יִרְחֲקוּ
  choice: sind fern
  rationale: Das Verb רחק bezeichnet räumliche oder übertragene Ferne. „Sind fern“ gibt den zuständlichen Sinn knapp und quellennah wieder.
- source_word: בָנָיו
  choice: seine Kinder
  rationale: בנים kann sowohl „Söhne“ als auch allgemeiner „Kinder“ bezeichnen. Hier ist die umfassendere Wiedergabe im Deutschen natürlich und sachgerecht.
- source_word: מִיֶּשַׁע
  choice: von Rettung
  rationale: יֶשַׁע bezeichnet Rettung, Befreiung oder daraus folgende Sicherheit. „Rettung“ bewahrt den unmittelbaren Zusammenhang mit מַצִּיל im Schlusssatz, ohne den Ausdruck ausdrücklich auf theologisches Heil einzuengen.
- source_word: וְיִדַּכְּאוּ
  choice: werden sie zermalmt
  rationale: Die passive Verbform von דכא drückt gewaltsames Zerschlagen oder Niederdrücken aus. „Zermalmt“ bewahrt die starke Bildsprache; im Zusammenhang des Tores kann sie auch gesellschaftliche oder rechtliche Unterdrückung einschließen.
- source_word: בַשַּׁעַר
  choice: am Tor
  rationale: Das Stadttor war der übliche Ort öffentlicher Verhandlungen und Rechtsprechung. Das idiomatische deutsche „am Tor“ gibt den Schauplatz natürlich wieder; seine kulturelle Bedeutung wird in einer Fußnote erklärt.
- source_word: וְאֵין מַצִּיל
  choice: und niemand rettet sie
  rationale: Die Verbindung aus אֵין und Partizip bezeichnet das Fehlen eines Retters. Die finite deutsche Form ist klar und bewahrt den Bezug zu „Rettung“ im ersten Satzteil.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit quellennaher Satzstruktur. Die starke Metapher „zermalmt“ bleibt erhalten; die rechtlich-öffentliche Bedeutung des Tores wird erklärt, ohne sie in den Haupttext hineinzudeuten.
