  text: Behold[a], blessed is the man whom God reproves[e][d][c][b]; therefore do not despise the discipline of the Almighty.
translation:
  language: de
  text: 'Sieh doch: Wohl dem Menschen, den Gott zurechtweist; verachte die Erziehung des Allmächtigen nicht.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: eine Glücklichpreisungsformel; auch: „Glücklich ist der Mensch“ oder „Glücklich zu preisen ist der Mensch“. Sie bezeichnet einen beneidenswerten, begünstigten Zustand. „Zurechtweist“ kann auch „korrigiert“ oder „rügt“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Schaddai“, traditionell mit „der Allmächtige“ wiedergegeben. „Erziehung“ kann auch „Disziplin“, „Korrektur“ oder „Züchtigung“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Bewahrt den aufmerksamkeitslenkenden und hervorhebenden Charakter der Einleitung in natürlichem, gehobenem Gegenwartsdeutsch.
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die weisheitliche Glücklichpreisungsformel bezeichnet einen beneidenswerten, begünstigten Zustand und nicht bloß ein momentanes Gefühl.
- source_word: אֱנוֹשׁ
  choice: der Mensch
  rationale: Gibt die generische Einzahl für einen Menschen bzw. Sterblichen im Deutschen natürlich und ohne unnötige geschlechtliche Verengung wieder.
- source_word: יוֹכִיחֶנּוּ
  choice: den Gott zurechtweist
  rationale: Der Hifil von יכח bezeichnet hier korrigierendes Zurechtweisen; die Form enthält ein männliches Singularobjekt, das sich auf אֱנוֹשׁ bezieht.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Sachgemäße Standardwiedergabe der Gottesbezeichnung im Buch Hiob.
- source_word: מוּסַר
  choice: Zurechtweisung
  rationale: Erfasst in diesem Zusammenhang sowohl den korrigierenden als auch den erzieherischen Gehalt und verbindet die beiden Vershälften lexikalisch verständlich.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Traditionelle und verständliche bedeutungsorientierte Wiedergabe des Gottesnamens bzw. -titels Schaddai.
- source_word: אַל תִּמְאָס
  choice: lehne … nicht ab
  rationale: Gibt die Warnung idiomatisch wieder, etwas nicht geringschätzig zurückzuweisen; weniger missverständlich als die mögliche Formulierung „verachte … nicht“.
theological_decisions:
- issue: Göttliche Zurechtweisung als Kennzeichen eines glücklichen Menschen
  choice: Glücklich ist der Mensch, den Gott zurechtweist
  alternative: Wohl dem Menschen, den Gott bestraft
  rationale: Die Übersetzung bewahrt die Spannung, dass schmerzliche göttliche Korrektur als heilsam und begünstigend bezeichnet wird, ohne יוֹכִיחַ oder מוּסַר auf strafendes Handeln zu verengen.
- issue: Wiedergabe von שַׁדַּי
  choice: der Allmächtige
  alternative: Schaddai
  rationale: Die traditionelle Bedeutungswiedergabe ist im Deutschen verständlich; eine Fußnote macht den hebräischen Ausdruck transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh doch“ erhält den emphatischen Diskursmarker, ohne archaisches „Siehe“. Die parallele Wiedergabe „zurechtweist/Zurechtweisung“ macht den Gedankengang deutlich; das im Hebräischen nicht ausdrücklich vorhandene „darum“ verdeutlicht die folgernde Beziehung der beiden Satzhälften, wie sie im Kontext naheliegt.
