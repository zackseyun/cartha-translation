  text: For man is born for trouble[a], and the sons of flame fly upward.
translation:
  language: de
  text: 'Denn der Mensch wird zur Mühsal geboren,

    und die Söhne der Flamme fliegen empor.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Funken fliegen empor“. Wörtlich steht im Hebräischen „die Söhne der Flamme“; möglicherweise sind auch „die Söhne Reschefs“ gemeint. Die Wendung wird häufig als Bezeichnung für Funken verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Elifas’ begründende Erklärung ein und stellt den natürlichen Zusammenhang zum vorhergehenden Gedanken her.
- source_word: אָדָם
  choice: der Mensch
  rationale: Gibt den generischen Singular im modernen Standarddeutsch natürlich und allgemein verständlich wieder.
- source_word: לְעָמָל
  choice: zur Mühsal
  rationale: עָמָל umfasst Mühe, Not und leidvolle Beschwernis. „Mühsal“ bewahrt diese Breite und passt zum sprichwörtlichen Ton.
- source_word: יוּלָּד
  choice: wird … geboren
  rationale: Die passive Verbform bezeichnet in dieser allgemeinen Aussage das Geborenwerden als menschliche Grunderfahrung.
- source_word: וּבְנֵי רֶשֶׁף
  choice: die Söhne der Flamme
  rationale: Die bildhafte und möglicherweise mehrdeutige hebräische Wendung bleibt sichtbar, statt vorschnell ausschließlich als „Funken“ gedeutet zu werden.
- source_word: יַגְבִּיהוּ עוּף
  choice: fliegen empor
  rationale: Gibt die Verbindung von Hochsteigen und Fliegen idiomatisch und zugleich bildkräftig wieder.
