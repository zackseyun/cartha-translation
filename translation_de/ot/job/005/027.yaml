lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Gibt den aufmerksamkeitslenkenden Ausruf knapp und würdig wieder.
- source_word: חֲקַרְנוּהָ
  choice: das haben wir erforscht
  rationale: Bewahrt das gründliche Untersuchen und den Rückbezug des femininen Suffixes auf זֹאת.
- source_word: כֶּן הִיא
  choice: so ist es
  rationale: Gibt die bekräftigende Aussage direkt wieder, ohne sie näher auszudeuten.
- source_word: שְׁמָעֶנָּה
  choice: Höre es
  rationale: Bewahrt den Imperativ und gibt das pronominale Suffix idiomatisch wieder.
- source_word: וְאַתָּה דַע לָךְ
  choice: und du, erkenne es für dich selbst
  rationale: Erhält das ausdrücklich gesetzte Pronomen אַתָּה und die persönliche Aneignung durch לָךְ; das im Deutschen ergänzte „es“ macht den Bezug natürlich verständlich.
theological_decisions:
- issue: Geltungsanspruch der Aussage Elifas’
  choice: so ist es
  alternative: so verhält es sich
  rationale: Der Vers wird als selbstbewusste Behauptung der sprechenden Figur wiedergegeben, ohne dass die Übersetzung ihre Wahrheit erzählerisch bestätigt oder bestreitet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Hervorhebung von „du“ bleibt durch die Kommasetzung erhalten; die knappe, nachdrückliche Schlussform wird bewahrt.
