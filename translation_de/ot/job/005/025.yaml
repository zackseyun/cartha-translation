  variant: modern standard German
source:
  edition: WLC
  text: וְֽ֭/יָדַעְתָּ כִּי רַ֣ב זַרְעֶ֑/ךָ וְ֝/צֶאֱצָאֶ֗י/ךָ כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/025.yaml
  text: You will know that your offspring are many[b][a], and your descendants are like the grass of the earth.
translation:
  language: de
  text: Du wirst wissen, dass deine Nachkommenschaft[a] zahlreich ist und deine Nachkommen wie das Gras der Erde[b] sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Saat«. Das hebräische Wort זֶרַע ist eine Kollektivbezeichnung für die Nachkommenschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »des Landes«. Das hebräische Wort אֶרֶץ kann je nach Zusammenhang »Erde« oder »Land« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Du wirst wissen
  rationale: Das Qal Perfekt 2. Person Maskulin Singular mit וְ hat im poetischen Zusammenhang zukunftsbezogenen beziehungsweise folgernden Sinn. Die Formulierung bewahrt den Zusicherungscharakter.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt dessen ein, was der Angesprochene wissen wird.
- source_word: רַב
  choice: zahlreich
  rationale: Bei dem kollektiven Singular זֶרַע bezeichnet das Adjektiv eine große Anzahl beziehungsweise Fülle.
- source_word: זַרְעֶךָ
  choice: deine Nachkommenschaft
  rationale: זֶרַע ist hier kollektiv für die leibliche Nachkommenschaft gebraucht. Der deutsche Singular gibt die grammatische Form und den Kollektivsinn gut wieder.
- source_word: וְצֶאֱצָאֶיךָ
  choice: und deine Nachkommen
  rationale: Das Wort bezeichnet die aus jemandem hervorgehende Nachkommenschaft. „Nachkommen“ ist gegenwärtig, verständlich und wahrt die Parallelität, ohne beide hebräischen Begriffe gleich wiederzugeben.
- source_word: כְּעֵשֶׂב
  choice: wie das Gras
  rationale: Die Vergleichspartikel und das Substantiv werden direkt und idiomatisch wiedergegeben; das Bild deutet im Zusammenhang auf große Zahl und üppige Vermehrung.
- source_word: הָאָרֶץ
  choice: der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im allgemeinen Naturvergleich ist „Erde“ passend, während die mögliche Bedeutung „Land“ in einer Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kollektive Singular „Nachkommenschaft“ und der Plural „Nachkommen“ bilden die hebräische Parallelität natürlich ab. Im zweiten Satzglied wurde „sind“ ergänzt, um die im Hebräischen mögliche Ellipse im Deutschen flüssig und eindeutig wiederzugeben.
