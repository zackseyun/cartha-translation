base_translation:
  language: en
  yaml_path: translation/ot/job/005/021.yaml
  text: You will be hidden from the lash of the tongue[b][a], and you will not fear destruction when it comes.
translation:
  language: de
  text: Vor der Geißel der Zunge wirst du verborgen sein[a], und du wirst dich nicht vor der Verwüstung[b] fürchten, wenn sie kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor der Geißel der Zunge“ – ein Bild für verletzende oder verleumderische Rede.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Zerstörung“, „Verderben“ oder „Verwüstung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹט לָשׁוֹן
  choice: vor der Peitsche der Zunge
  rationale: שׁוֹט bezeichnet wörtlich eine Peitsche oder Geißel; zusammen mit לָשׁוֹן entsteht ein Bild für verletzende oder verleumderische Rede. Die deutsche Formulierung bewahrt dieses eindringliche Bild.
- source_word: תֵּחָבֵא
  choice: wirst du geborgen sein
  rationale: Das Nifal von חבא bedeutet, verborgen oder versteckt zu sein. „Geborgen sein“ gibt hier den Schutzgedanken natürlich wieder, ohne die Bildsprache unnötig auszuweiten.
- source_word: וְלֹא תִירָא
  choice: und du wirst dich nicht … fürchten
  rationale: Die verneinte Imperfektform wird als zugesicherte Zukunft wiedergegeben und nicht zu einer bloßen Aufforderung abgeschwächt.
- source_word: מִשֹּׁד
  choice: vor der Verwüstung
  rationale: שֹׁד bezeichnet gewaltsame Verwüstung, Zerstörung oder Vernichtung. „Verwüstung“ bewahrt den ereignishaften und gewaltsamen Charakter des Ausdrucks.
- source_word: כִּי יָבוֹא
  choice: wenn sie kommt
  rationale: כִּי wird im Zusammenhang temporal verstanden. Das feminine Pronomen bezieht sich im Deutschen grammatisch auf „Verwüstung“.
theological_decisions: []
