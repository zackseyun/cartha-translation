  text: תָּב֣וֹא בְ/כֶ֣לַח אֱלֵי קָ֑בֶר כַּ/עֲל֖וֹת גָּדִ֣ישׁ בְּ/עִתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/026.yaml
  text: You will come to the grave in full vigor[b][a], like a sheaf gathered up in its season.
translation:
  language: de
  text: Du wirst in voller Lebenskraft[a] zum Grab kommen, wie ein Garbenhaufen[b], der zu seiner Zeit eingebracht wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in hohem, reifem Alter«. Das seltene hebräische Wort כֶּלַח kann ein voll ausgereiftes Lebensalter oder unverminderte Lebenskraft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »wie beim Heraufbringen eines Garbenhaufens zu seiner Zeit«. Gemeint ist offenbar geerntetes Getreide, das zum passenden Zeitpunkt eingebracht oder aufgeschichtet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: du wirst kommen
  rationale: Das Qal-Imperfekt 2. Person maskulin Singular von בוא bezeichnet hier die erwartete Zukunft; zusammen mit dem Ziel »zum Grab« ist »kommen« im Deutschen natürlich und bewahrt die Direktheit des Hebräischen.
- source_word: בְכֶלַח
  choice: in voller Lebenskraft
  rationale: כֶּלַח ist selten und in seiner Bedeutung umstritten. »Volle Lebenskraft« gibt die Vorstellung eines ausgereiften, erfüllten Lebensstadiums wieder, ohne den Ausdruck eindeutig auf hohes Alter festzulegen.
- source_word: אֱלֵי קָבֶר
  choice: zum Grab
  rationale: אֱלֵי bezeichnet die Richtung, קֶבֶר die Grabstätte. »Zum Grab« ist eine knappe und idiomatische Wiedergabe.
- source_word: כַּעֲלוֹת
  choice: der ... eingebracht wird
  rationale: Die Vergleichspartikel כ und der Infinitiv von עלה ergeben im landwirtschaftlichen Bild wahrscheinlich das Herauf- beziehungsweise Einbringen der Ernte. Die passive Form macht den im Hebräischen knappen Vorgang im Deutschen verständlich.
- source_word: גָּדִישׁ
  choice: Garbenhaufen
  rationale: גָּדִישׁ bezeichnet eher einen Haufen oder Stapel geschnittenen Getreides als eine einzelne Garbe. »Garbenhaufen« bewahrt das konkrete Erntebild.
- source_word: בְּעִתּוֹ
  choice: zu seiner Zeit
  rationale: Der Ausdruck bezeichnet den passenden, vorgesehenen Zeitpunkt. »Zu seiner Zeit« erhält sowohl die zeitliche Offenheit als auch den Bezug auf die reife Ernte.
