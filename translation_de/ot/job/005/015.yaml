base_translation:
  language: en
  yaml_path: translation/ot/job/005/015.yaml
  text: But he saves the needy from the sword of their mouth[a], and from the hand of the strong.
translation:
  language: de
  text: Doch er rettet den Bedürftigen vor dem Schwert ihres Mundes[a] und aus der Hand des Starken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch er rettete den Bedürftigen vor dem Schwert, vor ihrem Mund und aus der Hand des Starken.“ Der hebräische Wortlaut ist stark verdichtet; „aus/von ihrem Mund“ kann auch als eigenes Satzglied statt als nähere Bestimmung zu „Schwert“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּשַׁע
  choice: er rettet
  rationale: Das Verb ישׁע bezeichnet Rettung oder Befreiung; Gott ist im Zusammenhang das unausgesprochene Subjekt. Das Präsens entspricht dem allgemeinen, spruchhaften Charakter der Aussage.
- source_word: מֵחֶרֶב
  choice: vor dem Schwert
  rationale: חֶרֶב bedeutet „Schwert“, und מִן bezeichnet hier das, wovor jemand gerettet wird. Im Deutschen ist bei „retten“ die Verbindung „vor dem Schwert“ idiomatisch.
- source_word: מִפִּיהֶם
  choice: ihres Mundes
  rationale: Wörtlich steht „aus/von ihrem Mund“. In Verbindung mit „Schwert“ lässt sich die verdichtete hebräische Formulierung als Metapher „Schwert ihres Mundes“ wiedergeben. Der kollektive Singular „Mund“ bleibt erhalten.
- source_word: וּמִיַּד
  choice: und aus der Hand
  rationale: יָד bedeutet wörtlich „Hand“ und kann Macht oder Gewalt bezeichnen. Das konkrete Bild wird bewahrt.
- source_word: חָזָק
  choice: des Starken
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet einen starken beziehungsweise mächtigen Menschen. Der Singular entspricht der Form des hebräischen Textes.
- source_word: אֶבְיוֹן
  choice: den Bedürftigen
  rationale: אֶבְיוֹן bezeichnet einen armen, bedürftigen und gesellschaftlich verletzlichen Menschen. „Bedürftigen“ bildet diese Bedeutungsbreite ab.
theological_decisions:
- issue: Bildhafte Bedeutung von „Schwert ihres Mundes“
  choice: Die Metapher für zerstörerisches Reden wird beibehalten.
  alternative: „vor dem Schwert, aus ihrem Mund“ beziehungsweise eine auflösende Wiedergabe wie „vor ihren verletzenden Worten“
  rationale: Die unmittelbare Verbindung von „Schwert“ und „Mund“ erzeugt ein bewusst starkes poetisches Bild. Eine Auflösung in „Worte“ würde die Aussage interpretierend verengen; die alternative syntaktische Gliederung bleibt jedoch möglich und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Bildsprache und die syntaktische Mehrdeutigkeit des Hebräischen werden bewahrt; die ungewöhnliche Formulierung wird durch eine Fußnote abgesichert.
