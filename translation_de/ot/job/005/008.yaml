id: JOB.5.8
reference: Job 5:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אוּלָ֗ם אֲ֭נִי אֶדְרֹ֣שׁ אֶל אֵ֑ל וְ/אֶל אֱ֝לֹהִ֗ים אָשִׂ֥ים דִּבְרָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/008.yaml
  text: But as for me[a], I would seek God, and to God I would present my case.
translation:
  language: de
  text: Ich jedoch würde mich an Gott wenden und Gott meine Sache vorlegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mein Anliegen darlegen.'
    reason: Lexikalische Alternative für דִּבְרָתִי und die Verbindung mit אָשִׂים; der Ausdruck kann allgemein eine Angelegenheit oder ein persönlich vorgebrachtes Anliegen bezeichnen.
lexical_decisions:
- source_word: אוּלָם אֲנִי
  choice: Ich jedoch
  rationale: „Jedoch“ gibt den kontrastierenden Übergang wieder; das ausdrücklich gesetzte Pronomen אֲנִי bleibt durch die Voranstellung betont.
- source_word: אֶדְרֹשׁ אֶל אֵל
  choice: würde mich an Gott wenden
  rationale: דרשׁ mit אֶל bezeichnet hier das suchende, bittende Hinwenden zu Gott. Die deutsche Wendung ist natürlich und bewahrt den beratenden beziehungsweise hypothetischen Ton der Verbform im Zusammenhang.
- source_word: וְאֶל אֱלֹהִים
  choice: und Gott
  rationale: אֵל und אֱלֹהִים bezeichnen in den parallelen Satzgliedern denselben göttlichen Adressaten. Beide werden daher ohne künstliche Bedeutungsdifferenzierung mit „Gott“ wiedergegeben.
- source_word: אָשִׂים דִּבְרָתִי
  choice: meine Sache vorlegen
  rationale: שׂים bedeutet wörtlich „setzen/legen“; zusammen mit דִּבְרָה bezeichnet es das Darlegen einer Angelegenheit. „Meine Sache vorlegen“ erhält sowohl die allgemeine als auch die mögliche rechtlich-petitionäre Nuance.
theological_decisions:
- issue: Wiedergabe der parallelen Gottesbezeichnungen אֵל und אֱלֹהִים
  choice: Beide als „Gott“
  alternative: „Gott“ und „der Allmächtige“ oder „El“ und „Gott“
  rationale: Der Parallelismus verlangt keine Unterscheidung zweier Referenten oder verschiedener göttlicher Eigenschaften. Eine erweiternde Wiedergabe würde eine im hebräischen Vers nicht ausdrücklich markierte Differenz eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ich jedoch“ bewahrt den markierten Kontrast, ohne altertümlich zu wirken; „meine Sache vorlegen“ lässt die mögliche gerichtliche Färbung erkennen, legt den Ausdruck aber nicht einseitig juristisch fest.
