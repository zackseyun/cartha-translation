  text: וַ/יִּשְׁכּ֤וֹן עָ֘רִ֤ים נִכְחָד֗וֹת בָּ֭תִּים לֹא יֵ֣שְׁבוּ לָ֑/מוֹ אֲשֶׁ֖ר הִתְעַתְּד֣וּ לְ/גַלִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/028.yaml
  text: He has lived in ruined cities[a], in houses where no one dwells, which were destined to become heaps.
translation:
  language: de
  text: Er wohnte in zerstörten Städten, in Häusern, die niemand bewohnte[a] und die dazu bestimmt waren, zu Trümmerhaufen zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Häusern, die sie nicht bewohnten«. Der hebräische Wortlaut ist hier knapp und lässt besonders im mittleren Satzteil mehrere eng verwandte Wiedergaben zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכּוֹן
  choice: Er wohnte
  rationale: Das Verb שכן bedeutet »wohnen, sich niederlassen«. Das deutsche Präteritum gibt die hebräische Erzählform natürlich und sachlich wieder.
- source_word: עָרִים נִכְחָדוֹת
  choice: in zerstörten Städten
  rationale: Das passive Partizip von כחד bezeichnet Städte, die vernichtet oder verwüstet worden sind. »Zerstört« wahrt diesen starken Sinn und passt zum Bild der Trümmerhaufen.
- source_word: בָּתִּים לֹא יֵשְׁבוּ לָמוֹ
  choice: in Häusern, die niemand bewohnte
  rationale: Die hebräische Wendung ist knapp und syntaktisch schwierig. Eine unbestimmte Wiedergabe macht den naheliegenden Sinn verlassener, unbewohnter Häuser in verständlichem Deutsch deutlich, ohne das schwer einzuordnende Pronomen ausdrücklich festzulegen.
- source_word: אֲשֶׁר הִתְעַתְּדוּ
  choice: die dazu bestimmt waren
  rationale: Der Hitpael von עתד kann »bereitet, vorgesehen, bestimmt sein« bedeuten. »Dazu bestimmt waren« bewahrt die auf den folgenden Zustand gerichtete Aussage.
- source_word: לְגַלִּים
  choice: zu Trümmerhaufen zu werden
  rationale: גַּלִּים bezeichnet Haufen oder Schutthügel, besonders als Überreste zerstörter Gebäude. »Trümmerhaufen« verdeutlicht das konkrete Ruinenbild.
