source:
  edition: WLC
  text: לֹֽא יָס֨וּר מִנִּי חֹ֗שֶׁךְ יֹֽ֭נַקְתּ/וֹ תְּיַבֵּ֣שׁ שַׁלְהָ֑בֶת וְ֝/יָס֗וּר בְּ/ר֣וּחַ פִּֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/030.yaml
  text: He will not depart from darkness[a]; a flame will dry up his shoots[b], and by the breath of his mouth he will pass away.
translation:
  language: de
  text: Er wird der Finsternis nicht entkommen; eine Flamme wird seinen Schössling[a] verdorren lassen, und durch den Hauch seines Mundes[b] wird er vergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Schössling“ setzt das Pflanzenbild fort: Der Frevler wird wie ein Baum dargestellt, dessen junger Trieb von der Flamme versengt wird und verdorrt.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „Durch den Hauch von Gottes Mund wird er vergehen.“ Das hebräische Possessivsuffix in „seines Mundes“ kann sich auf den Frevler beziehen; möglich ist jedoch auch ein nicht ausdrücklich genannter Bezug auf Gott.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר ... מִנִּי חֹשֶׁךְ
  choice: wird der Finsternis nicht entkommen
  rationale: סור bezeichnet ein Weichen oder Sich-Entfernen. Zusammen mit מן und „Finsternis“ drückt die Wendung aus, dass der Frevler der Finsternis beziehungsweise dem Unheil nicht entrinnen kann. „Nicht entkommen“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: יֹנַקְתּוֹ
  choice: seine Schösslinge
  rationale: Das Substantiv bezeichnet junge Triebe oder Sprosse einer Pflanze. „Schösslinge“ bewahrt das Bild des Frevlers als Baum, dessen frischer Wuchs vernichtet wird.
- source_word: תְּיַבֵּשׁ שַׁלְהָבֶת
  choice: eine Flamme wird … verdorren lassen
  rationale: יבש im Piel bedeutet „austrocknen, verdorren lassen“, und שלהבת bezeichnet eine Flamme oder Feuersglut. Die Formulierung erhält das Bild versengter Pflanzentriebe.
- source_word: וְיָסוּר
  choice: wird er vergehen
  rationale: Das zweite סור beschreibt hier wahrscheinlich die endgültige Entfernung beziehungsweise den Untergang des Frevlers. „Vergehen“ macht das Ergebnis auf Deutsch verständlich, ohne die Aussage unnötig auszudeuten.
- source_word: בְּרוּחַ פִּיו
  choice: durch den Hauch seines Mundes
  rationale: רוּחַ kann „Hauch“, „Wind“ oder „Geist“ bedeuten. In Verbindung mit „Mund“ liegt „Hauch“ nahe und bewahrt zugleich die mögliche Anspielung auf einen vernichtenden Atem oder Ausspruch.
- source_word: פִּיו
  choice: seines Mundes
  rationale: Das maskuline Suffix der dritten Person bezieht sich syntaktisch am ehesten auf den unmittelbar beschriebenen Frevler. Da jedoch auch Gott als nicht ausdrücklich genannter Bezug denkbar ist, wird diese Möglichkeit in einer Fußnote offengehalten.
theological_decisions:
- issue: Bezugswort von „seines“ in „Hauch seines Mundes“
  choice: Der Mund des Frevlers
  alternative: Der Mund Gottes
  rationale: Der Frevler ist im unmittelbaren Zusammenhang das nächstliegende maskuline Bezugswort. Weil die Wendung vom Hauch des Mundes aber auch göttliches Gericht bezeichnen kann und das Hebräische den Bezug nicht ausdrücklich festlegt, wird die alternative Deutung nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Pflanzenmetapher bleibt erhalten; die Mehrdeutigkeit des Pronominalbezugs in der Schlusszeile wird durch eine Fußnote bewahrt.
