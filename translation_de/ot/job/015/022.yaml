  text: לֹא יַאֲמִ֣ין שׁ֭וּב מִנִּי חֹ֑שֶׁךְ ו/צפו ה֣וּא אֱלֵי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/022.yaml
  text: He does not expect to return from darkness[a], and he is destined for the sword.
translation:
  language: de
  text: Er rechnet nicht damit, aus der Finsternis zurückzukehren, und er ist dem Schwert bestimmt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Schwert hält nach ihm Ausschau« beziehungsweise »das Schwert erwartet ihn«. Die hebräische Verbform ist schwierig; die Zeile kündigt wahrscheinlich drohendes gewaltsames Gericht an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַאֲמִין
  choice: rechnet nicht damit
  rationale: Das Hifil von אמן bezeichnet hier im Blick auf die Zukunft ein Erwarten oder Für-wahrscheinlich-Halten; die deutsche Wendung ist natürlich und wahrt die Verneinung.
- source_word: שׁוּב
  choice: zurückzukehren
  rationale: Der Infinitiv gibt den Inhalt der Erwartung an und bezeichnet die Rückkehr beziehungsweise das Herauskommen aus dem folgenden Zustand.
- source_word: מִנִּי חֹשֶׁךְ
  choice: aus der Finsternis
  rationale: מן bezeichnet die Bewegung aus einem Bereich oder Zustand heraus; »Finsternis« bewahrt die bildhafte Sprache von Unheil und Todesnähe.
- source_word: וְצָפוּ הוּא אֱלֵי חָרֶב
  choice: und er ist dem Schwert bestimmt
  rationale: Die schwierige Form צפו wird im Kontext als passivische Bestimmung zu drohendem gewaltsamem Tod verstanden. Die Formulierung ist idiomatisch, ohne die textliche Unsicherheit zu verschweigen.
- source_word: חָרֶב
  choice: das Schwert
  rationale: Das Schwert steht als konkretes Bild für gewaltsamen Tod beziehungsweise Gericht.
theological_decisions:
- issue: Aussage über das bevorstehende Schicksal des Frevlers
  choice: Die Zeile wird als drohende Bestimmung zum gewaltsamen Tod wiedergegeben.
  alternative: Das Schwert hält nach ihm Ausschau beziehungsweise erwartet ihn.
  rationale: Der Zusammenhang spricht für unausweichliches Unheil; wegen der schwierigen hebräischen Verbform bleibt die alternative Personifikation des Schwertes in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Finsternis« erhält das poetische Bild; »dem Schwert bestimmt« gibt die bedrohliche Zielrichtung knapp wieder. Der Fußnotenmarker steht unmittelbar nach der textlich schwierigen zweiten Vershälfte.
