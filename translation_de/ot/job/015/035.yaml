  text: הָרֹ֣ה עָ֭מָל וְ/יָ֣לֹד אָ֑וֶן וּ֝/בִטְנָ֗/ם תָּכִ֥ין מִרְמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/015/035.yaml
  text: They conceive trouble and give birth to wickedness[a]; their womb prepares deceit.
translation:
  language: de
  text: Sie sind mit Unheil schwanger und gebären Bosheit[a]; ihr Schoß bereitet Täuschung vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie empfangen Unheil und bringen Unrecht hervor.“'
    reason: 'Lexikalische Alternative: הרה kann den Vorgang des Empfangens bezeichnen, ילד das Hervorbringen, und אָוֶן kann mit „Unrecht“ wiedergegeben werden.'
lexical_decisions:
- source_word: הָרֹה
  choice: sind ... schwanger
  rationale: Das Qal-Partizip von הרה bezeichnet hier im fortgeführten Geburtsbild das Schwangersein. Die deutsche Wendung bewahrt das Bild natürlich und deutlich.
- source_word: עָמָל
  choice: Unheil
  rationale: עָמָל kann Mühsal, Not oder schädliches Tun bezeichnen. Im moralischen Zusammenhang erfasst „Unheil“ sowohl das Verderbliche als auch die Folge davon.
- source_word: וְיָלֹד
  choice: und gebären
  rationale: Das Qal von ילד führt das Bild von Schwangerschaft und Geburt ausdrücklich fort; „gebären“ ist knapp, würdig und bildgetreu.
- source_word: אָוֶן
  choice: Bosheit
  rationale: אָוֶן kann Unrecht, Böses oder Unheil bedeuten. Neben עָמָל und מִרְמָה bringt „Bosheit“ die ethische Aussage zur Geltung, ohne sie konfessionell zuzuspitzen.
- source_word: וּבִטְנָם
  choice: ihr Schoß
  rationale: בטן bezeichnet Bauch, Leib oder Mutterschoß. „Schoß“ erhält im Deutschen den Zusammenhang mit Schwangerschaft und Geburt und gibt die kollektiv gebrauchte Singularform wieder.
- source_word: תָּכִין
  choice: bereitet ... vor
  rationale: Der Hifil von כון bedeutet unter anderem bereitmachen oder vorbereiten. „Bereitet ... vor“ wahrt die Vorstellung eines innerlich heranreifenden Ergebnisses.
- source_word: מִרְמָה
  choice: Täuschung
  rationale: מִרְמָה bezeichnet Täuschung, Trug oder Hinterlist. „Täuschung“ ist modernes Standarddeutsch und lässt offen, ob der Akzent auf der Handlung oder der betrügerischen Absicht liegt.
theological_decisions:
- issue: Numerus des unausgesprochenen Subjekts
  choice: 'Pluralisch: „Sie sind ...; ihr Schoß ...“'
  alternative: 'Singularisch: „Er ist ...; sein Schoß ...“ oder generisch: „Wer ...“'
  rationale: Obwohl הָרֹה formal Singular ist, weist das Suffix der 3. Person maskulin Plural in בִטְנָם auf eine Mehrzahl beziehungsweise eine als Gruppe betrachtete Klasse. Der Plural gibt die Bösen als Gruppe natürlich wieder und vermeidet einen unbegründeten Wechsel.
- issue: Moralische Abstufung von עָמָל, אָוֶן und מִרְמָה
  choice: „Unheil“, „Bosheit“, „Täuschung“
  alternative: „Mühsal“, „Unrecht“, „Trug“
  rationale: Die gewählte Folge erhält die Steigerung und den Parallelismus, ohne die teils überlappenden hebräischen Begriffe gleichzusetzen oder eine spezifische Lehrdeutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit poetischer Würde. Das durchgehende Schwangerschafts- und Geburtsbild bleibt erhalten; die ungewöhnliche kollektive Formulierung „ihr Schoß“ spiegelt die Bildsprache und den hebräischen Numerus möglichst eng.
