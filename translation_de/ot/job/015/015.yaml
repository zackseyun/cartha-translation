  variant: modern standard German
source:
  edition: WLC
  text: הֵ֣ן ב/קדש/ו לֹ֣א יַאֲמִ֑ין וְ֝/שָׁמַ֗יִם לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/015.yaml
  text: Look[a], he puts no trust even in his holy ones, and the heavens are not pure in his eyes.
translation:
  language: de
  text: Sieh, selbst seinen Heiligen[a] vertraut er nicht, und die Himmel sind in seinen Augen nicht rein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinen heiligen Wesen«. Gemeint sind hier wahrscheinlich himmlische Wesen.'
    reason: Lexikalische Alternative und wahrscheinlicher Bezug des mehrdeutigen Ausdrucks.
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel hebt die folgende Aussage nachdrücklich hervor; „Sieh“ ist gegenwärtig, verständlich und würdevoll.
- source_word: בִּקְדֹשָׁיו
  choice: seinen Heiligen
  rationale: Die Formulierung bewahrt die wörtliche Bedeutung „seine Heiligen“, ohne den wahrscheinlich himmlischen Bezug im Haupttext festzuschreiben.
- source_word: לֹא יַאֲמִין
  choice: vertraut er nicht
  rationale: Das Hifil von אמן bezeichnet hier das Setzen von Vertrauen; „vertrauen“ gibt diesen Beziehungssinn natürlich wieder.
- source_word: וְשָׁמַיִם
  choice: und die Himmel
  rationale: Der Plural des Hebräischen wird beibehalten und trägt den poetischen Parallelismus mit den Heiligen.
- source_word: לֹא זַכּוּ
  choice: sind ... nicht rein
  rationale: זכה bezeichnet hier Reinheit beziehungsweise Lauterkeit, nicht primär gerichtliche Unschuld.
- source_word: בְּעֵינָיו
  choice: in seinen Augen
  rationale: Die hebräische Bildsprache für Gottes Urteil bleibt erhalten und ist im Deutschen idiomatisch verständlich.
theological_decisions:
- issue: Bezug von „seinen Heiligen“
  choice: Die lexikalisch offene Bezeichnung bleibt im Haupttext erhalten; wahrscheinlich sind himmlische Wesen gemeint.
  alternative: Menschliche Heilige oder allgemein alle heiligen Wesen.
  rationale: Der Parallelismus mit „den Himmeln“ legt himmlische Wesen nahe, doch der hebräische Ausdruck selbst spezifiziert dies nicht ausdrücklich. Daher wird die wahrscheinliche Deutung nur in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Parallelstruktur. „Heilige“ ist bewusst substantivisch und offen formuliert; die Fußnote verhindert eine vorschnelle kirchliche Verengung.
