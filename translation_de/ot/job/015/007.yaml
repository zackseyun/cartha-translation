base_translation:
  language: en
  yaml_path: translation/ot/job/015/007.yaml
  text: Were you born as the first man[a], and were you brought forth before the hills?
translation:
  language: de
  text: Wurdest du als erster Mensch geboren, und wurdest du vor den Hügeln hervorgebracht?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wurdest du als Adam, als erster Mensch, geboren?« Im Hebräischen steht »erster Mensch«; dies kann auf Adam anspielen, ohne den Namen eindeutig als Eigennamen zu verwenden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲ/רִאישׁוֹן אָדָם
  choice: als der erste Mensch
  rationale: Die Fragepartikel הֲ leitet eine rhetorische Frage ein. רִאשׁוֹן bezeichnet zeitlichen Vorrang; zusammen mit אָדָם ergibt sich am natürlichsten »als der erste Mensch«, ohne אָדָם ausdrücklich als Eigennamen zu deuten.
- source_word: תִּוָּלֵד
  choice: bist du ... geboren
  rationale: Das Nifal von ילד bedeutet gewöhnlich »geboren werden«; die deutsche Formulierung gibt die rhetorische Frage unmittelbar und idiomatisch wieder.
- source_word: וְ/לִ/פְנֵי
  choice: und ... vor
  rationale: Konjunktion und Präposition verbinden eine zweite, parallele Frage und drücken zeitlichen Vorrang aus.
- source_word: גְבָעוֹת
  choice: den Hügeln
  rationale: גְבָעוֹת bezeichnet Hügel und bewahrt hier das poetische Bild der uranfänglichen Landschaft.
- source_word: חוֹלָלְתָּ
  choice: wurdest du ... hervorgebracht
  rationale: Die Verbform trägt Geburts- beziehungsweise Wehenbildlichkeit. »Hervorgebracht« bewahrt dieses Bild und unterscheidet sich zugleich vom vorherigen ילד.
theological_decisions:
- issue: Ob אָדָם als Eigenname Adam oder als Gattungsbezeichnung Mensch zu verstehen ist
  choice: Gattungsbezeichnung in »der erste Mensch«
  alternative: »Adam, der erste Mensch«
  rationale: Elifas stellt eine rhetorische Frage nach uranfänglichem Alter und damit verbundener Weisheit. Der hebräische Wortlaut kann auf Adam anspielen, nennt אָדָם hier aber nicht eindeutig als Eigennamen; die Hauptübersetzung bewahrt diese Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache mit erhaltener poetischer Parallelität. Die Wiederholung unterschiedlicher Geburtsverben wird durch »geboren« und »hervorgebracht« sichtbar gemacht.
