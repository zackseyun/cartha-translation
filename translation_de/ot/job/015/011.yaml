base_translation:
  language: en
  yaml_path: translation/ot/job/015/011.yaml
  text: Are the consolations of God too small for you[a], or a word spoken gently to you?
translation:
  language: de
  text: Sind dir Gottes Tröstungen und ein sanft zu dir gesprochenes Wort zu wenig?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט
  choice: zu wenig
  rationale: 'Die Fragepartikel הַ mit מְעַט bildet eine rhetorische Frage nach der vermeintlichen Unzulänglichkeit: »Ist/sind ... zu wenig?« Das ist im Deutschen natürlich und bewahrt den vorwurfsvollen Ton.'
- source_word: מִמְּךָ
  choice: dir
  rationale: Die Präposition bezeichnet hier die Beziehung zum Angesprochenen; der deutsche Dativ in »dir ... zu wenig« gibt dies idiomatisch wieder.
- source_word: תַּנְחֻמוֹת
  choice: die Tröstungen
  rationale: Der Plural bezeichnet Zuspruch und Handlungen, die Trost vermitteln. »Tröstungen« erhält den Plural und den gehobenen Ton des Textes.
- source_word: אֵל
  choice: Gottes
  rationale: אֵל bezeichnet hier eindeutig Gott; der Genitiv gibt die hebräische Status-constructus-Verbindung natürlich wieder.
- source_word: וְדָבָר
  choice: und ein Wort
  rationale: וְ wird formal als »und« wiedergegeben; דָבָר meint im Redekontext ein Wort beziehungsweise einen Ausspruch. Die genaue logische Beziehung zum ersten Satzglied bleibt offen.
- source_word: לָאַט
  choice: sanft
  rationale: Das Adverb bezeichnet eine leise, behutsame oder sanfte Weise. »sanft« passt zum Kontext des tröstenden Zuspruchs, ohne eine zusätzliche Sprechhandlung unnötig einzuführen.
- source_word: עִמָּךְ
  choice: zu dir
  rationale: Obwohl עִם gewöhnlich »mit« bedeutet, verlangt das Deutsche bei einem Wort, das sich an jemanden richtet, idiomatisch »zu dir«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe von Elifas bleibt erhalten; die knappe und mehrdeutige Verbindung der beiden Satzglieder wird nicht dogmatisch aufgelöst.
