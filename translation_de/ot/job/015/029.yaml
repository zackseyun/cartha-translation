  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹֽא יֶ֭עְשַׁר וְ/לֹא יָק֣וּם חֵיל֑/וֹ וְ/לֹֽא יִטֶּ֖ה לָ/אָ֣רֶץ מִנְלָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/029.yaml
  text: He will not become rich[a], and his wealth will not endure[b], and his produce will not bend down to the earth.
translation:
  language: de
  text: Er wird nicht reich werden, und sein Vermögen wird keinen Bestand haben; sein Ertrag[a] wird sich nicht bis zur Erde neigen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zugrunde liegende hebräische Wort ist selten und unsicher. Möglich sind auch „Besitz“, „Gewinn“ oder „Fülle“.
    reason: lexical_alternative
  - marker: b
    text: Die Schlusswendung kann das Bild von Zweigen oder Ertrag hervorrufen, die sich unter ihrer Fülle bis zur Erde neigen. Andere verstehen sie allgemeiner so, dass sich sein Besitz nicht über das Land ausbreiten wird.
    reason: alternative_reading
lexical_decisions:
- source_word: יֶעְשַׁר
  choice: wird nicht reich werden
  rationale: Das Qal von עשר bezeichnet hier das Reichwerden; die dynamische Formulierung gibt den verbalen Vorgang besser wieder als ein bloßer Zustand.
- source_word: יָקוּם
  choice: wird keinen Bestand haben
  rationale: Wörtlich bedeutet das Verb „stehen“ oder „sich erheben“. Zusammen mit חֵילוֹ bezeichnet es idiomatisch, dass das Vermögen nicht bestehen oder von Dauer sein wird.
- source_word: חֵילוֹ
  choice: sein Vermögen
  rationale: חַיִל kann Kraft, Besitzmittel oder Reichtum bezeichnen. Im Zusammenhang mit dem Reichwerden ist „Vermögen“ klar und zugleich etwas weiter als „Reichtum“.
- source_word: יִטֶּה
  choice: wird sich nicht … neigen
  rationale: נטה kann „neigen“, „ausstrecken“ oder „ausbreiten“ bedeuten. „Sich neigen“ bewahrt das mögliche konkrete Bild eines schweren Ertrags, der bis zur Erde herabhängt, ohne dieses Bild stärker auszumalen als der hebräische Text.
- source_word: מִנְלָם
  choice: sein Ertrag
  rationale: Das seltene und unsichere Wort wird kontextuell als Ertrag beziehungsweise erworbener Besitz verstanden. „Ertrag“ ermöglicht die naheliegende Bildsprache der Schlusswendung; die Unsicherheit und weitere Möglichkeiten werden in den Fußnoten offengelegt.
theological_decisions:
- issue: Aussage über den Bestand des Wohlstands des Frevlers
  choice: Die kategorische Zukunftsaussage des Redners bleibt unverändert stehen.
  alternative: Die Aussage als allgemeine Möglichkeit oder als ausdrückliche göttliche Verheißung formulieren.
  rationale: Der Vers gibt Elifas Behauptung wieder. Die Übersetzung darf sie weder abschwächen noch über den Wortlaut hinaus als verbindliche Lehraussage bestätigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Keinen Bestand haben“ gibt die hebräische Wendung idiomatisch wieder; die Schlussklausel bleibt bewusst bildhaft und wird wegen des seltenen letzten Wortes in den Fußnoten nicht vereindeutigt.
