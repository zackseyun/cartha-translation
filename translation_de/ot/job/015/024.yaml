  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Rhythmus. Die parallelen Begriffe werden unterschieden, ohne die Intensität des Hebräischen abzuschwächen; die Unsicherheit des seltenen militärischen Ausdrucks bleibt in der Fußnote sichtbar.
