  variant: modern standard German
source:
  edition: WLC
  text: יְֽ֭בַעֲתֻ/הוּ צַ֣ר וּ/מְצוּקָ֑ה תִּ֝תְקְפֵ֗/הוּ כְּ/מֶ֤לֶךְ עָתִ֬יד לַ/כִּידֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/024.yaml
  text: Distress and anguish terrify him[a]; they overpower him like a king ready for battle.
translation:
  language: de
  text: Not und Bedrängnis versetzen ihn in Schrecken; sie überwältigen ihn wie ein König, der zum Angriff bereit ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein König, der zum Kampf bereit ist“. Das seltene hebräische Wort kann einen Kampf oder, genauer, einen bewaffneten Angriff bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַעֲתֻהוּ
  choice: versetzen ihn in Schrecken
  rationale: Die Piel-Form bezeichnet das Verursachen heftigen Schreckens. Die deutsche Wendung gibt die starke kausative Bedeutung natürlich und würdig wieder.
- source_word: צַר
  choice: Not
  rationale: Das Substantiv bezeichnet Bedrängnis, Not oder eine bedrückende Lage. „Not“ ist prägnant und bildet mit „Bedrängnis“ eine natürliche poetische Paarung.
- source_word: מְצוּקָה
  choice: Bedrängnis
  rationale: Das Wort bezeichnet starken Druck, Enge oder Bedrängnis. Die Wiedergabe bewahrt das Bild bedrückender Enge und vermeidet eine bloße Wiederholung von „Not“.
- source_word: תִּתְקְפֵהוּ
  choice: sie überwältigen ihn
  rationale: Obwohl das Verb formal feminin singular ist, greift es die vorangehende Wortpaarung kollektiv auf. Im Deutschen bezieht sich der Plural natürlich auf „Not und Bedrängnis“; „überwältigen“ gibt die gewaltsame Übermacht von תקף wieder.
- source_word: כְּמֶלֶךְ
  choice: wie ein König
  rationale: Die Vergleichspartikel כ wird unmittelbar und idiomatisch wiedergegeben.
- source_word: עָתִיד
  choice: bereit
  rationale: Im Zusammenhang bezeichnet עָתִיד einen vorbereiteten oder kampfbereiten Zustand. „Bereit“ ist klar und knapp.
- source_word: לַכִּידוֹר
  choice: zum Angriff
  rationale: כידור ist ein seltenes und unsicheres Wort. Im militärischen Vergleich bezeichnet es wahrscheinlich einen Angriff oder Kampf; „zum Angriff“ bewahrt die wahrscheinlich spezifischere Stoßrichtung.
theological_decisions: []
