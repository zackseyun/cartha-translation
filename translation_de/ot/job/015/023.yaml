source:
  edition: WLC
  text: נֹ֘דֵ֤ד ה֣וּא לַ/לֶּ֣חֶם אַיֵּ֑ה יָדַ֓ע כִּֽי נָכ֖וֹן בְּ/יָד֣/וֹ יֽוֹם חֹֽשֶׁךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/023.yaml
  text: He wanders about for bread[a], saying[b], ‘Where is it?’ He knows that a day of darkness is ready at hand for him.
translation:
  language: de
  text: 'Er irrt auf der Suche nach Brot[a] umher: »Wo ist es?« Er weiß, dass ein Tag der Finsternis für ihn bereitsteht.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Brot« kann im Hebräischen auch Nahrung im Allgemeinen bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Ein Tag der Finsternis ist in seiner Hand bereit.« Die Wendung kann wahrscheinlich besagen, dass dieser Tag für ihn bereitsteht oder nahe bevorsteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדֵד
  choice: irrt … umher
  rationale: Das Qal-Partizip bezeichnet ein fortgesetztes, unstetes Umherziehen. »Irrt … umher« gibt diese ruhelose Bewegung wieder, ohne sie ausdrücklich als Flucht oder Verbannung zu deuten.
- source_word: לַלֶּחֶם
  choice: auf der Suche nach Brot
  rationale: לֶחֶם bedeutet wörtlich »Brot«, kann aber auch Nahrung allgemein bezeichnen. Die Präposition ל wird hier idiomatisch als Ziel der ruhelosen Suche wiedergegeben.
- source_word: אַיֵּה
  choice: Wo ist es?
  rationale: Das Fragewort bedeutet »wo?«. Das im Deutschen nötige Pronomen »es« nimmt das zuvor genannte Brot auf.
- source_word: יָדַע
  choice: Er weiß
  rationale: Das Perfekt von ידע bezeichnet hier eine feste Gewissheit oder Erkenntnis; die direkte Wiedergabe »er weiß« wahrt den Wortlaut.
- source_word: נָכוֹן
  choice: unmittelbar bevorsteht
  rationale: נָכוֹן bezeichnet etwas Feststehendes oder Bereitstehendes. Zusammen mit בְּיָדוֹ drückt die Formulierung aus, dass der dunkle Tag für ihn bereit und nahe ist; »unmittelbar bevorsteht« ist dafür natürliches Deutsch.
- source_word: בְּיָדוֹ
  choice: ihm … unmittelbar
  rationale: Wörtlich lautet der Ausdruck »in seiner Hand«. Im Zusammenhang weist er wahrscheinlich auf die unmittelbare Nähe beziehungsweise sichere Verfügbarkeit des dunklen Tages für ihn hin. Die idiomatische Wiedergabe vermeidet im Haupttext ein missverständliches deutsches Bild.
- source_word: יוֹם חֹשֶׁךְ
  choice: ein Tag der Finsternis
  rationale: Die Genitivverbindung bezeichnet einen von Finsternis geprägten Tag. Das Bild bleibt erhalten und wird nicht vorschnell als Unglück, Verderben oder Gericht ausgedeutet.
theological_decisions:
- issue: Bildgehalt von »Tag der Finsternis«
  choice: Das Bild wird unverändert als »ein Tag der Finsternis« wiedergegeben.
  alternative: ein Tag des Unheils; der Tag des Verderbens; ein Tag des Gerichts
  rationale: Im Zusammenhang von Elifas’ Rede weist die Wendung auf drohendes Unheil für den Frevler. Der hebräische Ausdruck selbst benennt jedoch weder ausdrücklich ein göttliches Gericht noch eine bestimmte Form des Verderbens; die bildhafte und theologisch offene Formulierung bleibt daher bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Bildsprache des Hebräischen bleibt bei »Tag der Finsternis« erhalten; die Wendung בְּיָדוֹ wird im Haupttext idiomatisch wiedergegeben und in der Fußnote wörtlich ausgewiesen.
