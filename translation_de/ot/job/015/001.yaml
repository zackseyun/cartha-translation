  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: de
  text: 'Da antwortete Elifas, der Temaniter, und sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: Das Verb ענה steht hier in der üblichen Dialogformel »antwortete und sagte«. »Antwortete« kennzeichnet Elifas’ Rede als Erwiderung auf Hiobs vorherige Worte.
- source_word: אֱלִיפַז
  choice: Elifas
  rationale: Der Personenname wird entsprechend der etablierten deutschen Bibeltradition transliteriert.
- source_word: הַתֵּימָנִי
  choice: der Temaniter
  rationale: Das Gentiliz bezeichnet Elifas als Mann aus Teman. »Der Temaniter« ist knapp, verständlich und bewahrt die appositionelle Form des Hebräischen.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die Wiedergabe bewahrt neben »antwortete« auch das zweite Verb אמר und damit die vollständige hebräische Redeeinleitung.
- source_word: וַ
  choice: Da
  rationale: Das eröffnende Waw führt die Handlung beziehungsweise den Dialog fort. »Da« gibt diesen narrativen Anschluss in natürlichem, würdigem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in einer knappen, würdigen Erzählform. Die doppelte Redeeinleitung »antwortete … und sagte« bleibt wegen der beiden ausdrücklichen hebräischen Verben erhalten.
