base_translation:
  language: en
  yaml_path: translation/ot/job/015/002.yaml
  text: Should a wise man answer with windy knowledge[a], and fill his belly with the east wind?
translation:
  language: de
  text: Soll ein Weiser mit windigem Wissen antworten[a] und seinen Bauch mit dem Ostwind füllen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Wissen, das nur Wind ist“, das heißt mit leerem oder gehaltlosem Wissen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָכָם
  choice: ein Weiser
  rationale: Das Fragepräfix הֲ leitet eine rhetorische Frage ein. Das substantivierte Adjektiv gibt den generischen maskulinen Singular knapp und natürlich wieder.
- source_word: יַעֲנֶה
  choice: soll ... antworten
  rationale: Der Imperfekt in der rhetorischen Frage fragt tadelnd nach dem Angemessenen; „soll“ bewahrt diese modale Nuance.
- source_word: דַעַת רוּחַ
  choice: windigem Wissen
  rationale: Die Konstruktverbindung bedeutet wörtlich etwa „Wissen des Windes“. „Windiges Wissen“ erhält das Windbild und vermittelt zugleich die gemeinte Inhaltsleere, ohne die Metapher aufzulösen.
- source_word: וִימַלֵּא
  choice: und ... füllen
  rationale: Der koordinierte Imperfekt setzt die rhetorische Frage fort; „füllen“ bewahrt das konkrete Bild.
- source_word: קָדִים
  choice: dem Ostwind
  rationale: Das Wort bezeichnet den Ostwind, der häufig als heiß und zerstörerisch vorgestellt wird. Die konkrete Naturmetapher bleibt unverändert.
- source_word: בִּטְנוֹ
  choice: seinen Bauch
  rationale: „Bauch“ ist die direkte und anschauliche Entsprechung und bewahrt das körperliche Bild.
