base_translation:
  language: en
  yaml_path: translation/ot/job/015/003.yaml
  text: Should he argue with useless words[a], or with speech that does no good?
translation:
  language: de
  text: Sollte er mit nutzloser Rede streiten und mit Worten, mit denen er nichts ausrichtet?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹכֵחַ
  choice: streiten
  rationale: Das Hifil-Partizip von יכח kann je nach Zusammenhang »argumentieren«, »zurechtweisen« oder »streiten« bedeuten. Im Streitgespräch kritisiert Elifas Hiobs Redeweise; »streiten« gibt die verbale Auseinandersetzung natürlich wieder, ohne den Ausdruck unnötig juristisch zu verengen.
- source_word: בְּדָבָר
  choice: mit Worten
  rationale: דָבָר bezeichnet hier parallel zu מִלִּים eine sprachliche Äußerung. Der deutsche Plural ist in diesem Zusammenhang idiomatisch und erhält den poetischen Parallelismus.
- source_word: לֹא יִסְכּוֹן
  choice: die nichts nützen
  rationale: סכן bezeichnet hier Nutzen oder Vorteil. Die Relativkonstruktion bewahrt den verbalen Charakter des Hebräischen und klingt im modernen Deutsch natürlicher als eine nominale Wiedergabe wie »nutzlose Worte«.
- source_word: וּמִלִּים
  choice: oder mit Reden
  rationale: מִלִּים bedeutet »Worte« oder »Äußerungen«. »Reden« vermeidet eine starre Wiederholung und wahrt den synonymen Parallelismus; das ו wird im rhetorischen Fragesatz sinngemäß als »oder« wiedergegeben.
- source_word: לֹא יוֹעִיל בָּם
  choice: die nichts bewirken
  rationale: יעל bedeutet »nützen«, »helfen« oder »Nutzen bringen«. »Nichts bewirken« gibt die Wirkungslosigkeit der Reden idiomatisch wieder; בם wird auf die genannten Äußerungen bezogen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der parallele Aufbau der beiden Halbverse bleiben erhalten; die Variation »Worte/Reden« entspricht dem hebräischen Wechsel zwischen דָבָר und מִלִּים.
