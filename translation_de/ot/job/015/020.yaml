  text: כָּל יְמֵ֣י רָ֭שָׁע ה֣וּא מִתְחוֹלֵ֑ל וּ/מִסְפַּ֥ר שָׁ֝נִ֗ים נִצְפְּנ֥וּ לֶ/עָרִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/020.yaml
  text: All the days of the wicked man he writhes[c][b][a], and a number of years are stored up for the ruthless.
translation:
  language: de
  text: Der Gottlose[a] windet sich alle seine Tage[b], und eine Zahl von Jahren ist dem Gewalttätigen vorbehalten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Gottlose“ steht im Hebräischen grammatisch im männlichen Singular und stellt einen gottlosen Menschen als Typus dar.
    reason: cultural_note
  - marker: b
    text: 'Oder: „ist in Angst“; das hebräische Verb kann sich winden, zittern oder wehenartige Qual bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „verborgen“ beziehungsweise „aufbewahrt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי רָשָׁע
  choice: Alle Tage des Gottlosen
  rationale: Die Konstruktion bezeichnet umfassend die gesamte Lebenszeit des als Einzelfigur dargestellten Gottlosen. Die deutsche Form bewahrt die hebräische Struktur, ohne ein nicht ausdrücklich gesetztes Possessivpronomen einzufügen.
- source_word: הוּא מִתְחוֹלֵל
  choice: windet er sich
  rationale: Das selbstständige Pronomen wird in der deutschen Satzstellung wiedergegeben; das Partizip bezeichnet einen anhaltenden Zustand. „Sich winden“ bewahrt das körperlich-seelische Bild, ohne „Qual“ ausdrücklich hinzuzufügen.
- source_word: וּמִסְפַּר שָׁנִים
  choice: und eine Anzahl von Jahren
  rationale: Die Wendung bezeichnet eine feststehende, aber nicht genannte Zahl von Jahren. „Eine Anzahl“ erhält diese Unbestimmtheit.
- source_word: נִצְפְּנוּ
  choice: ist … aufgespart
  rationale: Das Nifal von צפן kann Verbergen ebenso wie Aufbewahren oder Vorbehaltensein ausdrücken. „Aufgespart“ erhält das Bild eines zurückgelegten Zeitraums.
- source_word: לֶעָרִיץ
  choice: für den Gewalttätigen
  rationale: עָרִיץ bezeichnet einen gewalttätigen, rücksichtslosen oder tyrannischen Menschen. „Gewalttätiger“ trifft den Kern, ohne die Aussage unnötig auf politische Herrschaft zu begrenzen.
theological_decisions:
- issue: Bedeutung der für den Gewalttätigen aufgesparten Jahre
  choice: Die Aussage bleibt bei einem festgelegten, nicht näher bestimmten Zeitraum.
  alternative: Die Jahre ausdrücklich als Jahre der Strafe oder als begrenzte Lebensjahre deuten.
  rationale: Der hebräische Text nennt weder Strafe noch Lebensende ausdrücklich. Die Übersetzung bewahrt daher die Spannung und legt den Bezug der Jahre nicht dogmatisch fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Satzstellung „windet er sich“ spiegelt das hebräische wiederaufnehmende Pronomen; die Bildsprache und die Mehrdeutigkeit von מִתְחוֹלֵל und נִצְפְּנוּ bleiben erhalten.
