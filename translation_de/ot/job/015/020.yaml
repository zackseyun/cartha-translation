revisions:
- from: Alle Tage des Gottlosen windet er sich[a][b], und eine Anzahl von Jahren ist für den Gewalttätigen aufgespart.[c]
  to: Der Gottlose[a] windet sich alle seine Tage[b], und eine Zahl von Jahren ist dem Gewalttätigen vorbehalten.[c]
  rationale: Die Revision ordnet den kulturellen Fußnotenanker korrekt zu, bereinigt die fehlerhafte lexikalische Anmerkung und formuliert den Satz in natürlichem modernem Standarddeutsch. „Vorbehalten“ gibt die für נִצְפְּנוּ relevante Bedeutung des Bewahrt- oder Reserviertseins wieder, ohne festzulegen, ob die Jahre als Lebenszeit, Leidenszeit oder Strafe zu verstehen sind.
