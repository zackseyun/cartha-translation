  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי כִסָּ֣ה פָנָ֣י/ו בְּ/חֶלְבּ֑/וֹ וַ/יַּ֖עַשׂ פִּימָ֣ה עֲלֵי כָֽסֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/027.yaml
  text: because he has covered his face with his fat[a], and has put fatness on his loins.
translation:
  language: de
  text: Denn er hat sein Gesicht mit seinem Fett bedeckt und Fettpolster an seinen Lenden gebildet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn er bedeckte sein Gesicht mit Fett und bildete Fettfalten an seinen Flanken.“'
    reason: Das seltene Wort פִּימָה und die Körperbezeichnung כָסֶל lassen auch diese konkretere Wiedergabe zu.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung bzw. Erläuterung zum vorausgehenden Zusammenhang ein und bewahrt den kausalen Sinn in natürlichem Deutsch.
- source_word: כִסָּה
  choice: hat … bedeckt
  rationale: Gibt die Grundbedeutung „bedecken, verhüllen“ wieder; das Perfekt beschreibt hier passend den eingetretenen Zustand.
- source_word: פָנָיו
  choice: sein Gesicht
  rationale: Die konkrete Bedeutung passt zum anschließenden körperlichen Bild.
- source_word: בְּחֶלְבּוֹ
  choice: mit seinem Fett
  rationale: Bewahrt sowohl das konkrete Bild des Fettes als auch das Possessivsuffix; die Wendung zeichnet Wohlleben und Selbstgenuss körperlich aus.
- source_word: וַיַּעַשׂ
  choice: gebildet
  rationale: Das allgemeine Verb „machen, tun“ wird im Deutschen zusammen mit „Fettpolster“ idiomatisch als „bilden“ wiedergegeben.
- source_word: פִּימָה
  choice: Fettpolster
  rationale: Das seltene Substantiv bezeichnet wahrscheinlich Fett, Dicke oder eine Fettauflage. „Fettpolster“ ist anschaulich und natürlich, ohne das Bild zu abstrahieren.
- source_word: עֲלֵי
  choice: an
  rationale: Bezeichnet hier die räumliche Lage am Körper; „an“ ist im Deutschen idiomatischer als ein starres „auf“.
- source_word: כָסֶל
  choice: seinen Lenden
  rationale: Das Wort kann Lenden, Hüften oder Flanken bezeichnen. „Lenden“ wahrt den anatomischen und poetischen Charakter, ohne übermäßig festzulegen.
theological_decisions: []
