source:
  edition: WLC
  text: יַרְשִֽׁיעֲ/ךָ֣ פִ֣י/ךָ וְ/לֹא אָ֑נִי וּ֝/שְׂפָתֶ֗י/ךָ יַעֲנוּ בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/006.yaml
  text: Your own mouth condemns you[a], and not I; your own lips testify against you.
translation:
  language: de
  text: Dein eigener Mund spricht dich schuldig, nicht ich; deine eigenen Lippen sagen gegen dich aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »antworten gegen dich«. Das hebräische Verb bedeutet gewöhnlich »antworten«, kann hier jedoch im Zusammenhang der Anklage den Sinn einer belastenden Aussage haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְשִׁיעֲךָ
  choice: spricht dich schuldig
  rationale: Der Hifil von רשע bedeutet hier, jemanden für schuldig zu erklären. Die Formulierung bewahrt den forensischen Sinn und klingt im Deutschen natürlich.
- source_word: פִיךָ
  choice: dein eigener Mund
  rationale: Wörtlich steht »dein Mund«. »Eigener« verdeutlicht im Kontext, dass Hiobs eigene Rede ihn belastet.
- source_word: וְלֹא אָנִי
  choice: nicht ich
  rationale: 'Die knappe Stellung erhält den betonten Gegensatz: Nicht Elifas, sondern Hiobs eigener Mund spricht ihn schuldig.'
- source_word: וּשְׂפָתֶיךָ
  choice: deine eigenen Lippen
  rationale: Wörtlich »deine Lippen«. »Eigenen« führt die parallele Betonung der Selbstbelastung fort.
- source_word: יַעֲנוּ בָךְ
  choice: sagen gegen dich aus
  rationale: ענה bedeutet grundsätzlich »antworten«, kann hier aber im Zusammenhang mit Schuld und Anklage einen forensischen Sinn tragen. »Gegen dich aussagen« gibt diese Bildsprache verständlich wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Forensische Bildsprache in Elifas’ Vorwurf
  choice: »spricht dich schuldig« und »sagen gegen dich aus«
  alternative: »erweist dich als schuldig« und »antworten gegen dich«
  rationale: Die Übersetzung gibt Elifas’ Behauptung wieder, Hiobs eigene Worte belasteten ihn, ohne diese Behauptung als Urteil des Erzählers zu bestätigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Parallelismus und der betonte Gegensatz »nicht ich« bleiben erhalten; die forensische Bildsprache wird idiomatisch wiedergegeben.
