source:
  edition: WLC
  text: כִּ֤י יְאַלֵּ֣ף עֲוֺנְ/ךָ֣ פִ֑י/ךָ וְ֝/תִבְחַ֗ר לְשׁ֣וֹן עֲרוּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/005.yaml
  text: For your iniquity teaches your mouth[b][a], and you choose the tongue of the crafty.
translation:
  language: de
  text: Denn deine Schuld lehrt deinen Mund[a], und du wählst die Sprache der Listigen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Vergehen lehrt deinen Mund“. Das hebräische Wort kann Vergehen, Schuld oder die Folge von Schuld bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Zunge der Listigen“; auch „die Sprache der Schlauen“ ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Elifas’ Begründung für den vorausgehenden Vorwurf ein und gibt den argumentativen Zusammenhang natürlich wieder.
- source_word: יְאַלֵּף
  choice: lehrt
  rationale: Das Piel von אלף bedeutet hier „lehren/unterweisen“. „Lehrt“ bewahrt die Personifikation, nach der die Schuld Hiobs Reden prägt.
- source_word: עֲוֺנְךָ
  choice: deine Schuld
  rationale: עָוֹן kann Vergehen, Schuld oder Schuldfolge bezeichnen. „Schuld“ lässt hier sowohl den moralischen als auch den zurechenbaren Aspekt anklingen; die Alternative „Vergehen“ wird in der Fußnote genannt.
- source_word: פִיךָ
  choice: deinen Mund
  rationale: Die konkrete hebräische Redeweise bleibt erhalten und bildet mit „Sprache“ im zweiten Halbvers ein poetisches Bildfeld.
- source_word: וְתִבְחַר
  choice: und du wählst
  rationale: Gibt das Qal von בחר direkt wieder und erhält den persönlichen Vorwurf an Hiob.
- source_word: לְשׁוֹן
  choice: die Sprache
  rationale: לָשׁוֹן bedeutet wörtlich „Zunge“, kann aber metonymisch die Redeweise bezeichnen. „Sprache“ klingt im Deutschen hier natürlicher; die wörtlichere Alternative wird in der Fußnote dokumentiert.
- source_word: עֲרוּמִים
  choice: der Listigen
  rationale: עָרוּם kann je nach Kontext klug, schlau oder listig bedeuten. In Elifas’ Vorwurf ist die negative Bedeutung „listig“ naheliegend, ohne die lexikalische Spannweite zu verschweigen.
theological_decisions:
- issue: Moralische Bedeutungsbreite von עָוֹן
  choice: „deine Schuld“
  alternative: „dein Vergehen“ oder „deine Sünde“
  rationale: „Schuld“ wahrt die Spannung zwischen moralischem Fehlverhalten und daraus erwachsender Zurechenbarkeit, ohne Elifas’ Anklage zu einer objektiven Aussage des Erzählers zu machen.
- issue: Bewertung von עֲרוּמִים
  choice: „der Listigen“
  alternative: „der Schlauen“ oder „der Klugen“
  rationale: Der unmittelbare Kontext legt eine negative Wertung nahe. Eine Fußnote erhält jedoch die grundsätzlich mögliche neutralere oder positivere Nuance des hebräischen Wortes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Personifikation „deine Schuld lehrt deinen Mund“ und die parallele Bildsprache des Hebräischen werden bewusst bewahrt; Fußnoten dokumentieren echte lexikalische Alternativen.
