id: JOB.15.26
reference: Job 15:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יָר֣וּץ אֵלָ֣י/ו בְּ/צַוָּ֑אר בַּ֝/עֲבִ֗י גַּבֵּ֥י מָֽגִנָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/026.yaml
  text: He rushes at him with his neck[a], with the thick bosses of his shields.
translation:
  language: de
  text: Er stürmt mit vorgestrecktem Hals[a] auf ihn los, mit den dicken Buckeln seiner Schilde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit Hals«. Gemeint sein kann ein Angriff mit vorgestrecktem oder trotzig gerecktem Hals. Das hebräische Bild ist anschaulich, aber stark verkürzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרוּץ
  choice: stürmt … los
  rationale: Das Verb bedeutet grundsätzlich »laufen«. Im feindseligen Zusammenhang gibt »stürmt … los« die heftige, gegen jemanden gerichtete Bewegung natürlich wieder, ohne eine bestimmte militärische Angriffsform festzulegen.
- source_word: אֵלָיו
  choice: auf ihn … los
  rationale: In Verbindung mit der feindseligen Bewegung bezeichnet אֶל die Richtung gegen das Gegenüber. Die deutsche Wendung »auf ihn losstürmen« ist idiomatisch und bewahrt den Angriffssinn.
- source_word: בְּצַוָּאר
  choice: mit vorgestrecktem Hals
  rationale: Wörtlich steht nur »mit Hals«. Das im Deutschen ergänzte »vorgestreckt« macht das anschauliche Bild einer trotzigen, ungestümen Vorwärtsbewegung verständlich; die knappe Form des Hebräischen wird in der Fußnote offengelegt.
- source_word: בַּעֲבִי
  choice: mit den dicken
  rationale: עֳבִי bezeichnet Dicke oder Massigkeit. »dicken« gibt die konkrete Beschaffenheit der nachfolgend genannten Schildbuckel knapp wieder.
- source_word: גַּבֵּי
  choice: Buckeln
  rationale: In Verbindung mit Schilden sind wahrscheinlich deren gewölbte, hervorstehende Mittelteile gemeint. »Buckel« ist dafür im Deutschen die genaue sachsprachliche Bezeichnung.
- source_word: מָגִנָּיו
  choice: seiner Schilde
  rationale: Die hebräische Form ist Plural mit einem Suffix der dritten Person Singular. Der ungewöhnliche Plural wird deshalb beibehalten und nicht zu »seinem Schild« geglättet.
theological_decisions:
- issue: Bezug der Pronomen
  choice: Die Pronomen bleiben als »er«, »ihn« und »seiner« stehen.
  alternative: Die Beteiligten ausdrücklich als den Frevler und Gott benennen.
  rationale: Der Vers setzt die Bezugspersonen aus dem Zusammenhang voraus. Eine ausdrückliche Benennung würde zwar verdeutlichen, aber mehr in den Vers eintragen, als seine hebräische Form selbst sagt.
translation_notes:
  register: Moderne, würdige Standardsprache. »Schildbuckel« ist ein präziser, noch verständlicher Sachbegriff; im Satz wurde die natürlichere Verbindung »Buckel seiner Schilde« gewählt. Die ungewöhnliche Mehrzahl »Schilde« und die gedrängte Bildfolge bleiben erhalten.
