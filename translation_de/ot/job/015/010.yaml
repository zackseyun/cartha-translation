base_translation:
  language: en
  yaml_path: translation/ot/job/015/010.yaml
  text: Both the gray-haired and the aged are among us[a], older in days than your father.
translation:
  language: de
  text: Sowohl Grauhaarige als auch Hochbetagte sind unter uns, an Lebensjahren älter als dein Vater.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „groß gegenüber deinem Vater an Tagen“. Die Wendung bezeichnet hier ein höheres Lebensalter als das deines Vaters.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם
  choice: Auch ... auch
  rationale: Die wiederholte Partikel hebt beide Gruppen parallel hervor; die Wiederholung bewahrt zugleich die hebräische Struktur.
- source_word: שָׂב
  choice: Grauhaarige
  rationale: Die Wiedergabe erhält das konkrete Bild grauen Haares als Zeichen hohen Alters.
- source_word: יָשִׁישׁ
  choice: Hochbetagte
  rationale: Der Ausdruck bezeichnet Menschen in sehr fortgeschrittenem Alter und bleibt vom parallelen שָׂב unterscheidbar.
- source_word: בָּנוּ
  choice: sind unter uns
  rationale: Die Präposition mit Suffix bezeichnet hier soziale Zugehörigkeit beziehungsweise Anwesenheit in der Gemeinschaft des Sprechers.
- source_word: כַּבִּיר מֵאָבִיךָ יָמִים
  choice: älter an Tagen als dein Vater
  rationale: כַּבִּיר bedeutet grundsätzlich »groß/mächtig«; zusammen mit dem Vergleich und »Tage« ergibt sich hier ein höheres Lebensalter. »An Tagen« bewahrt etwas vom hebräischen Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Hervorhebung und die Altersbildsprache des Hebräischen bleiben erhalten; die ungewöhnliche Wendung »älter an Tagen« wahrt den semitischen Ausdruck, ohne unverständlich zu werden.
