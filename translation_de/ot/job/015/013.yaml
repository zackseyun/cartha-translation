translation:
  language: de
  text: dass du deinen Geist gegen Gott richtest und Worte aus deinem Mund hervorbringst?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass du deinen Geist Gott zuwendest“. Im Hebräischen steht wörtlich „zu/auf Gott hin“; „gegen Gott“ gibt die im vorwurfsvollen Zusammenhang nahegelegte oppositionelle Ausrichtung wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion führt hier den Inhalt der vorausgehenden anklagenden Frage weiter; im Deutschen schließt „dass“ natürlich an Vers 12 an.
- source_word: תָשִׁיב
  choice: richtest
  rationale: Der Hifil von שׁוב bezeichnet hier das Lenken oder Wenden der inneren Haltung. „Richtest“ ist im Deutschen mit „Geist“ und einer Zielangabe idiomatisch.
- source_word: אֶל אֵל
  choice: gegen Gott
  rationale: אֶל bedeutet grundsätzlich „zu/auf … hin“. Der anklagende Zusammenhang legt eine feindliche Ausrichtung nahe; diese kontextuelle Deutung steht im Haupttext, während die formalere Alternative in der Fußnote erhalten bleibt.
- source_word: רוּחֶךָ
  choice: deinen Geist
  rationale: רוּחַ bezeichnet hier wahrscheinlich die innere Haltung oder Gemütsverfassung Hiobs. „Geist“ bewahrt die Bedeutungsbreite besser als das stärker deutende „Zorn“ oder „Gemüt“.
- source_word: וְהֹצֵאתָ
  choice: und … hervorbringst
  rationale: Der Hifil von יצא bedeutet wörtlich, etwas herausgehen zu lassen beziehungsweise hervorzubringen. Die Wiedergabe erhält das konkrete Bild der aus dem Mund kommenden Worte.
- source_word: מִפִּיךָ
  choice: aus deinem Mund
  rationale: מִן kennzeichnet die Quelle; „aus deinem Mund“ gibt das Bild im Deutschen unmittelbar wieder.
- source_word: מִלִּין
  choice: solche Worte
  rationale: מִלִּין bedeutet „Worte“ oder „Äußerungen“. Das im Deutschen ergänzte „solche“ stellt den natürlichen Rückbezug auf Hiobs beanstandete Rede her, ohne den Inhalt näher festzulegen.
theological_decisions:
- issue: Richtung des Geistes gegenüber Gott
  choice: gegen Gott
  alternative: zu Gott / auf Gott hin
  rationale: Die Präposition bezeichnet formal eine Ausrichtung zu Gott hin, während Elifas’ Vorwurf diese als oppositionell versteht. Die Hauptfassung gibt die pragmatische Kraft wieder; die Fußnote bewahrt die echte lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt bildhaft und schließt syntaktisch als Fortsetzung der Frage aus Vers 12 an.
