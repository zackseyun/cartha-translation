  text: קוֹל פְּחָדִ֥ים בְּ/אָזְנָ֑י/ו בַּ֝/שָּׁל֗וֹם שׁוֹדֵ֥ד יְבוֹאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/021.yaml
  text: A sound of terrors is in his ears[a]; in prosperity the destroyer comes upon him.
translation:
  language: de
  text: Schreckenslaute sind in seinen Ohren; im Wohlergehen[a] kommt der Verwüster über ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Frieden“ oder „in Sicherheit“. Das hebräische Wort שָׁלוֹם kann Frieden, Wohlergehen oder Sicherheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: Laute
  rationale: קוֹל bezeichnet einen Laut, Klang oder eine Stimme. Zusammen mit dem Plural פְּחָדִים steht hier das akustisch Wahrgenommene im Vordergrund; im Deutschen gibt der Plural „Laute“ die Verbindung natürlich wieder.
- source_word: פְּחָדִים
  choice: Schreckens-
  rationale: Der hebräische Plural bezeichnet Schrecken oder schreckenerregende Dinge und nicht nur ein inneres Angstgefühl. „Schreckenslaute“ bewahrt die bedrohliche Mehrzahl in einer verständlichen deutschen Zusammensetzung.
- source_word: בְּאָזְנָיו
  choice: sind in seinen Ohren
  rationale: Die konkrete hebräische Wendung lautet wörtlich „in seinen Ohren“. Die Wiedergabe erhält dieses Bild, ohne durch „hallen“ oder „dröhnen“ eine nicht ausdrücklich genannte Nuance hinzuzufügen.
- source_word: בַּשָּׁלוֹם
  choice: im Wohlergehen
  rationale: שָׁלוֹם kann Frieden, Sicherheit, Wohlergehen oder gedeihliche Verhältnisse bezeichnen. „Im Wohlergehen“ passt zum Kontrast mit dem plötzlich kommenden Verwüster; die ebenfalls möglichen Bedeutungen werden in der Fußnote offengehalten.
- source_word: שׁוֹדֵד
  choice: der Verwüster
  rationale: Das Partizip bezeichnet jemanden, der verheert, plündert oder verwüstet. „Verwüster“ ist zugänglich und lässt offen, ob besonders Zerstörung oder Plünderung gemeint ist.
- source_word: יְבוֹאֶנּוּ
  choice: kommt ... über ihn
  rationale: Das Verb „kommen“ trägt ein Suffix der 3. Person Singular. „Kommt über ihn“ gibt die feindliche Ankunft wieder, ohne sie durch ein ausdrückliches Angriffsverb näher auszudeuten. Das Präsens entspricht der lebhaften poetischen Darstellung; ein futurischer Bezug ist im Zusammenhang möglich.
