base_translation:
  language: en
  yaml_path: translation/ot/job/015/016.yaml
  text: how much less a man who is detestable and corrupt[b][a], who drinks injustice like water!
translation:
  language: de
  text: wie viel weniger ein abscheulicher und verdorbener[a] Mann, der Unrecht[b] wie Wasser trinkt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „besudelt“ beziehungsweise „widerwärtig“; das hebräische Wort נֶאֱלָח ist selten und bezeichnet etwas Beflecktes oder Abstoßendes.
    reason: lexical_alternative
  - marker: b
    text: Oder „Ungerechtigkeit“, „Verkehrtheit“ oder „Frevel“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: wie viel weniger
  rationale: 'Die Wendung führt das Schlussargument aus dem vorherigen Vers fort: Wenn schon die himmlischen Wesen beziehungsweise die Himmel vor Gott nicht rein sind, wie viel weniger dann der Mensch.'
- source_word: נִתְעָב
  choice: abscheulich
  rationale: Das Nifal-Partizip bezeichnet jemanden, der Abscheu hervorruft. „Abscheulich“ bewahrt die starke wertende Aussage und klingt im Deutschen natürlich.
- source_word: נֶאֱלָח
  choice: verdorben
  rationale: Das seltene Wort bezeichnet einen befleckten, widerwärtigen oder moralisch verdorbenen Zustand. „Verdorben“ gibt die moralische Verunreinigung verständlich wieder; „besudelt“ bleibt als mögliche Alternative in der Fußnote.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das hebräische Substantiv steht maskulin im Singular. „Ein Mann“ bewahrt die Form des Ausgangstextes, auch wenn die Aussage repräsentativen Charakter hat.
- source_word: שֹׁתֶה
  choice: der … trinkt
  rationale: Das Partizip wird als Relativsatz wiedergegeben und behält so den kennzeichnenden beziehungsweise gewohnheitsmäßigen Sinn.
- source_word: כַמַּיִם
  choice: wie Wasser
  rationale: Die direkte Vergleichsformulierung vermittelt, dass der Mann das Unrecht so selbstverständlich und reichlich aufnimmt wie Wasser.
- source_word: עַוְלָה
  choice: Unrecht
  rationale: Das Wort umfasst Unrecht, Ungerechtigkeit und moralische Verkehrtheit. „Unrecht“ ist im modernen Deutschen klar, kräftig und weniger eng auf soziale Ungerechtigkeit beschränkt als „Ungerechtigkeit“.
theological_decisions:
- issue: Repräsentative maskuline Sprache
  choice: ein Mann
  alternative: ein Mensch; die Menschheit
  rationale: Der hebräische Text verwendet אִישׁ im maskulinen Singular. Die Übersetzung bewahrt diese Form, ohne den repräsentativen Bezug auf Menschen allgemein auszuschließen.
- issue: Moralischer Begriff עַוְלָה
  choice: Unrecht
  alternative: Ungerechtigkeit; Frevel; Verkehrtheit
  rationale: „Unrecht“ bewahrt die moralische Schwere, bleibt allgemein genug für das Bedeutungsspektrum und vermeidet sowohl archaische als auch unnötig dogmatisch aufgeladene Sprache.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die zugespitzte rhetorische Fortführung aus Vers 15 sowie das kräftige Bild vom Trinken des Unrechts bleiben erhalten. Die beiden hebräischen Wertungen werden nicht zu einer einzigen Aussage geglättet.
