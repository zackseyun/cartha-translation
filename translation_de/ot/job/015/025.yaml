source:
  edition: WLC
  text: כִּֽי נָטָ֣ה אֶל אֵ֣ל יָד֑/וֹ וְ/אֶל שַׁ֝דַּ֗י יִתְגַּבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/025.yaml
  text: because he has stretched out his hand against God[a], and has shown himself mighty against the Almighty.
translation:
  language: de
  text: Denn er hat seine Hand gegen Gott ausgestreckt[a] und sich gegen den Allmächtigen stark gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn er hat seine Hand Gott entgegen ausgestreckt und macht sich stark gegen den Allmächtigen.“'
    reason: Bewahrt die direktionale Grundbedeutung von אֶל sowie eine mögliche präsentische beziehungsweise nicht ausdrücklich vollendete Wiedergabe von יִתְגַּבָּר.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet im Zusammenhang das Geschick des Frevlers. „Denn“ gibt den kausalen Anschluss an den vorhergehenden Vers natürlich wieder.
- source_word: נָטָה
  choice: hat … ausgestreckt
  rationale: Die konkrete Bedeutung „ausstrecken“ wird zusammen mit „Hand“ bewahrt; im Kontext bezeichnet das Bild feindseliges Aufbegehren.
- source_word: אֶל
  choice: gegen / gegenüber
  rationale: Die Präposition bezeichnet wörtlich die Ausrichtung auf jemanden hin. Der feindselige Kontext rechtfertigt im ersten Halbvers „gegen“; im zweiten wahrt „gegenüber“ zugleich Richtung und Widerstand.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier die allgemeine Gottesbezeichnung. „Gott“ erhält den Unterschied zum parallelen Titel שַׁדַּי.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Die singularische hebräische Wendung und ihr anschauliches Bild werden direkt beibehalten.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Der Gottesname beziehungsweise -titel wird entsprechend seiner üblichen Bedeutung übersetzt und bleibt vom parallelen אֵל unterschieden.
- source_word: יִתְגַּבָּר
  choice: sich … stark gezeigt
  rationale: Die reflexive Form bezeichnet, dass jemand sich stark macht oder als stark erweist. Die Formulierung bewahrt die Selbstbehauptung und die Ironie des Aufbegehrens gegen den Allmächtigen.
theological_decisions:
- issue: Wiedergabe der parallelen Gottesbezeichnungen
  choice: אֵל als „Gott“ und שַׁדַּי als „der Allmächtige“
  alternative: „Gott“ und „Schaddai“
  rationale: Die unterschiedlichen Bezeichnungen werden bedeutungsgemäß übersetzt, ohne sie gleichzusetzen; so bleibt der poetische Parallelismus erkennbar.
- issue: Richtung oder feindselige Opposition bei אֶל
  choice: Im Haupttext kontextuell „gegen Gott“
  alternative: Wörtlicher „zu Gott hin“ beziehungsweise „Gott entgegen“
  rationale: Das Ausstrecken der Hand und das Sich-stark-Machen beschreiben hier Auflehnung. Die Fußnote erhält jedoch die grundsätzlich direktionale Bedeutung der Präposition und die weniger interpretierende Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem hebräischem Hand-Bild. Der Vers beginnt als begründender Anschluss mit „Denn“. Die leicht ungewöhnliche Formulierung „sich … stark gezeigt“ hält die reflexive Selbstbehauptung des Hebräischen fest, ohne sie durch eine stärker deutende Aussage wie „trotzte“ oder „handelte vermessen“ zu ersetzen.
