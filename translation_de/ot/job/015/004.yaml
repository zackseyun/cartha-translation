  variant: modern standard German
source:
  edition: WLC
  text: אַף אַ֭תָּה תָּפֵ֣ר יִרְאָ֑ה וְ/תִגְרַ֥ע שִׂ֝יחָ֗ה לִ/פְנֵי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/004.yaml
  text: Indeed[c][b][a], you annul the fear of God and diminish meditation before God.
translation:
  language: de
  text: Ja, du untergräbst[a] die Gottesfurcht[b] und schmälerst die Andacht vor Gott.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „machst … unwirksam“ oder „hebst … auf“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Furcht“; im Zusammenhang ist die Furcht Gottes beziehungsweise die Ehrfurcht vor Gott gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das Gebet“, „das Nachsinnen“ oder „die Klage vor Gott“. Das hebräische Wort kann besinnliches wie auch betendes oder klagendes Reden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Ja
  rationale: Die Partikel verstärkt hier Elifas’ Vorwurf. Das einleitende „Ja“ gibt diese nachdrückliche, bestätigende Funktion im Deutschen natürlich wieder.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Personalpronomen der zweiten Person Singular hebt Ijob als den Angesprochenen hervor.
- source_word: תָּפֵר
  choice: untergräbst
  rationale: Der Hifil von פרר bezeichnet das Brechen, Aufheben oder Unwirksammachen. „Untergräbst“ wahrt die Schärfe des Vorwurfs und klingt im Deutschen in Verbindung mit Gottesfurcht idiomatisch.
- source_word: יִרְאָה
  choice: die Gottesfurcht
  rationale: Das Substantiv bedeutet wörtlich „Furcht“, bezeichnet hier im parallelen religiösen Zusammenhang jedoch die ehrfürchtige Haltung gegenüber Gott. „Gottesfurcht“ bewahrt den etablierten biblischen Begriff.
- source_word: וְתִגְרַע
  choice: und schmälerst
  rationale: Der Qal von גרע bedeutet vermindern, verringern oder entziehen. „Schmälerst“ gibt die Vorstellung einer Beeinträchtigung oder Verringerung prägnant wieder.
- source_word: שִׂיחָה
  choice: die Andacht
  rationale: שִׂיחָה kann Nachsinnen, Gebet, Klage oder betrachtendes Reden bezeichnen. „Andacht“ erfasst im Zusammenhang mit „vor Gott“ die religiös-besinnliche Dimension, ohne den Ausdruck ausschließlich auf Gebet festzulegen.
- source_word: לִפְנֵי אֵל
  choice: vor Gott
  rationale: לִפְנֵי bedeutet „vor/in der Gegenwart von“, während אֵל hier Gott bezeichnet. „Vor Gott“ ist knapp, würdig und quellennah.
theological_decisions:
- issue: Religiöser Sinn von יִרְאָה
  choice: die Gottesfurcht
  alternative: die Furcht; die Ehrfurcht
  rationale: Elifas wirft Ijob nicht vor, allgemeine Angst zu beeinträchtigen, sondern eine auf Gott bezogene Haltung. „Gottesfurcht“ bringt diesen Kontext zum Ausdruck; die Fußnote macht transparent, dass im Hebräischen nur „Furcht“ steht.
- issue: Bedeutungsbreite von שִׂיחָה vor Gott
  choice: die Andacht
  alternative: das Gebet; das Nachsinnen; die Klage
  rationale: Der hebräische Ausdruck bleibt mehrdeutig und kann inneres Sinnen ebenso wie an Gott gerichtetes Reden bezeichnen. „Andacht“ wahrt diese religiöse Weite besser als das engere „Gebet“; die möglichen Lesarten werden in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anklage bleibt knapp und zugespitzt; die semantische Breite der religiösen Schlüsselbegriffe wird durch Fußnoten offengehalten.
