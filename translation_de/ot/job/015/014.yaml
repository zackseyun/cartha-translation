  yaml_path: translation/ot/job/015/014.yaml
  text: What is man[a], that he should be pure, or one born of a woman[c][b], that he should be righteous?
translation:
  language: de
  text: Was ist der Mensch[a], dass er rein[b] sein könnte, und dass ein von einer Frau Geborener gerecht[c] sein könnte?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sterbliche Mensch“. Das hebräische Wort hebt die Schwäche und Vergänglichkeit des Menschen hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „lauter“ beziehungsweise „frei von Schuld“. Das hebräische Wort kann Reinheit sowohl im weiteren als auch im moralischen Sinn bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „im Recht“. Das hebräische Wort kann sowohl Gerechtigkeit als auch das Im-Recht-Sein in einem Urteil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Was ist
  rationale: Die Wendung eröffnet eine rhetorische Frage nach Wesen oder Stellung des Menschen; „Was ist der Mensch“ gibt die knappe hebräische Konstruktion idiomatisch wieder.
- source_word: אֱנוֹשׁ
  choice: der Mensch
  rationale: אֱנוֹשׁ bezeichnet hier den einzelnen Menschen als Vertreter der sterblichen, schwachen Menschheit. „Der Mensch“ bewahrt den generischen Singular und klingt im Deutschen natürlich und würdevoll.
- source_word: כִּי
  choice: dass
  rationale: Nach der rhetorischen Frage leitet כִּי den Folgesatz ein. „Dass er … sein könnte“ bringt den im Kontext verneinend gemeinten Möglichkeitssinn natürlich zum Ausdruck.
- source_word: יִזְכֶּה
  choice: rein sein könnte
  rationale: Das Qal von זכה kann Reinheit, Lauterkeit oder Freiheit von Schuld bezeichnen. „Rein“ wahrt die moralische und zugleich weiter gefasste Bildsprache.
- source_word: וְכִי
  choice: und wie könnte
  rationale: Die Konjunktion führt die parallele zweite rhetorische Frage ein. Die idiomatische deutsche Formulierung „und wie könnte“ verdeutlicht die Parallelität, ohne deren Aussage aufzulösen.
- source_word: יִצְדַּק
  choice: gerecht sein
  rationale: Das Qal von צדק bezeichnet hier den Zustand, gerecht beziehungsweise im Recht zu sein. „Gerecht sein“ erhält die breite moralisch-evaluative Bedeutung und vermeidet eine unnötig technische forensische Festlegung.
- source_word: יְלוּד אִשָּׁה
  choice: ein von einer Frau Geborener
  rationale: Die hebräische Wendung bezeichnet einen Menschen unter dem Gesichtspunkt seiner menschlichen Herkunft und Gebrechlichkeit. Die substantivierte Form bewahrt den repräsentativen Singular und das poetische Bild.
theological_decisions:
- issue: Anthropologischer Umfang von אֱנוֹשׁ und יְלוּד אִשָּׁה
  choice: 'Generischer Singular: „der Mensch“ und „ein von einer Frau Geborener“'
  alternative: „ein menschliches Wesen“ beziehungsweise „jeder, der von einer Frau geboren ist“
  rationale: Beide hebräischen Ausdrücke stehen im Singular, beziehen sich aber allgemein auf die Menschheit. Die Übersetzung bewahrt diese repräsentative Form, ohne die Aussage auf Männer zu beschränken.
- issue: Moralische oder forensische Nuance von יִצְדַּק
  choice: „gerecht sein“
  alternative: „im Recht sein“ oder „gerechtfertigt sein“
  rationale: Der Weisheitskontext thematisiert umfassend menschliche Reinheit und Gerechtigkeit. „Gerecht sein“ lässt sowohl moralische als auch evaluative Anklänge zu und importiert keine spätere technische Rechtfertigungsterminologie.
- issue: Möglichkeitssinn der rhetorischen Fragen
  choice: „sein könnte“ beziehungsweise „wie könnte … sein“
  alternative: „sei“ oder „sein sollte“
  rationale: Die rhetorischen Fragen stellen die Möglichkeit menschlicher Reinheit und Gerechtigkeit infrage. Der Konjunktiv gibt diese Spannung im modernen Deutschen klar wieder, ohne sie in eine ausdrückliche dogmatische Behauptung umzuwandeln.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit poetisch-würdigem Ton. Die parallelen rhetorischen Fragen bleiben erhalten; die leicht gehobene Wendung „ein von einer Frau Geborener“ bewahrt bewusst das hebräische Bild.
