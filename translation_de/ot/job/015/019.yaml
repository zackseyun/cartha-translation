  yaml_path: translation/ot/job/015/019.yaml
  text: To them alone the land was given[b][a], and no stranger passed among them.
translation:
  language: de
  text: Ihnen allein wurde das Land[a] gegeben, und kein Fremder zog mitten unter ihnen hindurch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Erde“. Das hebräische אֶרֶץ kann beides bedeuten; „Land“ passt hier eher zum Gedanken eines ausschließlich einer Gruppe gegebenen Gebiets.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und kein Außenstehender ging durch ihre Mitte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֶם לְבַדָּם
  choice: ihnen allein
  rationale: Die Verbindung bezeichnet die ausschließliche Zuweisung an diese Personengruppe. „Ihnen allein“ ist im Deutschen knapp, natürlich und bewahrt die Hervorhebung.
- source_word: נִתְּנָה
  choice: wurde gegeben
  rationale: Der Nifal von נתן ist hier passiv. Die Wiedergabe erhält sowohl die Grundbedeutung als auch die passive Form.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der Zusammenhang einer ausschließlich einer Gruppe überlassenen Region, die von keinem Fremden durchzogen wurde, spricht hier eher für „Land“.
- source_word: זָר
  choice: Fremder
  rationale: זָר bezeichnet jemanden, der nicht zur betreffenden Gruppe gehört. „Fremder“ bewahrt diese soziale Bedeutung, ohne Nationalität oder ethnische Zugehörigkeit näher festzulegen.
- source_word: עָבַר בְּתוֹכָם
  choice: zog mitten unter ihnen hindurch
  rationale: עָבַר bezeichnet das Vorüber- oder Hindurchgehen; בְּתוֹכָם lokalisiert dies in ihrer Mitte. Die Formulierung gibt Bewegung und räumliche Vorstellung in natürlichem Deutsch wieder.
