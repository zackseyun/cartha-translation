base_translation:
  language: en
  yaml_path: translation/ot/job/015/031.yaml
  text: Let him not trust in emptiness[a], deceiving himself[c][b], for emptiness will be his recompense.
translation:
  language: de
  text: Er vertraue nicht auf Nichtiges – er ist getäuscht –, denn Nichtiges wird er dafür erhalten.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… auf Nichtiges, indem er irregeht“; die hebräische Form kann sowohl „irregehen“ als auch „getäuscht/irregeführt sein“ bedeuten. Eine ausdrückliche Selbsttäuschung ist möglich, aber nicht zwingend.'
    reason: lexical_alternative
  - marker: b
    text: '„Nichtiges“ gibt an beiden Stellen dasselbe hebräische Wort wieder; es kann auch „Leeres“, „Wertloses“, „Trug“ oder „Falschheit“ bedeuten. Wörtlicher am Schluss: „denn Nichtiges wird seine Gegenleistung sein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יַאֲמֵן
  choice: Er vertraue nicht
  rationale: Die Verneinung אַל mit der Imperfektform drückt hier eine Warnung oder Aufforderung aus; der deutsche Konjunktiv I gibt die drittpersonige Mahnung würdig und knapp wieder.
- source_word: בַשָּׁוְא
  choice: auf Nichtiges
  rationale: שָׁוְא bezeichnet Leeres, Nichtiges, Wertloses oder Trügerisches. „Nichtiges“ klingt im Deutschen natürlich als Gegenstand des Vertrauens und lässt die semantische Breite bestehen.
- source_word: נִתְעָה
  choice: und täusche sich nicht selbst
  rationale: Der Niphal von תעה kann „irregehen“, „irregeführt sein“ oder in diesem Zusammenhang selbsttäuschendes Vertrauen bezeichnen. Die koordinierte Wiedergabe folgt der masoretischen Lesung mit אַל und macht den reflexiven Sinn verständlich, ohne die passive Alternative zu verschweigen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet die vorausgehende Warnung.
- source_word: שָׁוְא
  choice: Nichtiges
  rationale: Die gleiche Wiedergabe wie beim ersten Vorkommen bewahrt die pointierte Wiederholung des hebräischen Wortes.
- source_word: תִּהְיֶה תְמוּרָתוֹ
  choice: wird er dafür bekommen
  rationale: תְּמוּרָה meint Tausch, Ersatz oder das, was jemand als Gegenleistung erhält. Die idiomatische Formulierung hält das Motiv des entsprechenden Ertrags fest, ohne vorschnell einen technischen Vergeltungsbegriff einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von שָׁוְא wird bewusst bewahrt. Der Konjunktiv I „Er vertraue nicht“ entspricht der drittpersonigen Warnung; „dafür bekommen“ ist idiomatischer als „Vergeltung“ und wahrt die Austauschsemantik von תְּמוּרָה.
