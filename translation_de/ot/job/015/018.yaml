  text: what wise men declare[a], and have not hidden from their fathers—
translation:
  language: de
  text: was Weise verkünden und vor ihren Vätern nicht verborgen haben[a] –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was ihre Väter nicht verborgen haben“; oder: „und nichts von dem verschwiegen haben, was von ihren Vätern stammt“. Das Hebräische lässt die Beziehung zwischen „verborgen haben“ und „ihren Vätern“ unterschiedlich verstehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: was
  rationale: Das Relativpronomen leitet den Inhalt dessen ein, was die Weisen weitergeben; „was“ ist im Deutschen natürlich und entspricht „das, was“.
- source_word: חֲכָמִים
  choice: Weise
  rationale: Die substantivierte Form gibt die männliche Pluralform knapp und würdig wieder und bezeichnet hier weise Männer beziehungsweise überliefernde Gelehrte.
- source_word: יַגִּידוּ
  choice: verkünden
  rationale: Der Hifil von נגד bezeichnet das Bekanntmachen oder Darlegen. „Verkünden“ bewahrt den gehobenen Ton und passt zur öffentlichen Weitergabe überlieferter Weisheit.
- source_word: וְלֹא כִחֲדוּ
  choice: und … nicht verborgen haben
  rationale: כחד bedeutet hier „verbergen, verhehlen“. Das Perfekt „verborgen haben“ gibt die abgeschlossene beziehungsweise überlieferungsbezogene Aussage natürlich wieder.
- source_word: מֵאֲבוֹתָם
  choice: vor ihren Vätern
  rationale: In Verbindung mit „verbergen“ kann מִן die Personen bezeichnen, denen etwas vorenthalten wird. „Väter“ hält die konkrete hebräische Bezeichnung fest; im Zusammenhang können damit auch Vorfahren gemeint sein.
theological_decisions:
- issue: Beziehung von מֵאֲבוֹתָם zu כִחֲדוּ
  choice: vor ihren Vätern nicht verborgen haben
  alternative: was ihre Väter nicht verborgen haben; nichts von dem verschwiegen haben, was von ihren Vätern stammt
  rationale: Die knappe hebräische Syntax lässt offen, ob die Väter diejenigen sind, vor denen nichts verborgen wurde, oder die Quelle beziehungsweise Träger der Überlieferung. Der Haupttext folgt der unmittelbar möglichen Verbindung mit „verbergen“, während die Fußnote die anderen grammatischen Deutungen offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als syntaktisch vom vorhergehenden Vers abhängiges Fragment stehen; der Gedankenstrich wahrt den fortlaufenden Satzbau.
