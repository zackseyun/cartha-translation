translation:
  language: de
  text: Noch vor seiner Zeit wird es erfüllt werden[a], und sein Zweig[b] wird nicht grün sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird es vollendet sein«. Das hebräische Verb bedeutet wörtlich »voll oder gefüllt werden«; seine genaue Bedeutung an dieser Stelle ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sein Palmzweig« oder »sein Wipfeltrieb«. Das hebräische Wort bezeichnet einen zweigartigen Teil eines Baumes oder einer Pflanze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֹא יוֹמוֹ
  choice: noch vor seiner Zeit
  rationale: Die wörtliche Wendung »nicht zu seiner Zeit/seinem Tag« bezeichnet hier idiomatisch einen Zeitpunkt vor der ihm zugemessenen Zeit und passt zum Zusammenhang eines vorzeitigen Endes.
- source_word: תִּמָּלֵא
  choice: wird es sich erfüllen
  rationale: Das Nifal von מלא bedeutet wörtlich »voll/gefüllt werden« und kann im Zusammenhang »erfüllt« oder »vollendet werden« ausdrücken. Die unbestimmte Formulierung bewahrt die Unklarheit des nicht ausdrücklich genannten Subjekts und vermeidet das im Hebräischen nicht ausdrücklich vorhandene Bild einer Zahlung.
- source_word: כִפָּתוֹ
  choice: sein Zweig
  rationale: Das Substantiv bezeichnet einen zweigartigen Pflanzenteil, möglicherweise einen Palmzweig oder Wipfeltrieb. »Zweig« erhält das Pflanzenbild, ohne die Pflanzenart genauer festzulegen, als es der Kontext erlaubt.
- source_word: לֹא רַעֲנָנָה
  choice: wird nicht grün bleiben
  rationale: רענן bezeichnet bei Pflanzen Frische, Grün oder üppiges Gedeihen. »Nicht grün bleiben« gibt das konkrete Pflanzenbild natürlich wieder und bringt den Verlust der Lebenskraft zum Ausdruck.
theological_decisions:
- issue: Art des vorzeitigen Geschehens
  choice: Die Aussage bleibt mit »wird es sich erfüllen« bewusst unbestimmt.
  alternative: »Seine Vergeltung wird vorzeitig voll bezahlt« oder »er wird vorzeitig abgeschnitten«
  rationale: Der unmittelbare Zusammenhang handelt vom Untergang des Gottlosen, doch der hebräische Wortlaut nennt weder Zahlung noch Abschneiden ausdrücklich. Die Übersetzung bewahrt daher die Spannung zwischen lexikalischer Bedeutung und kontextueller Gerichtsaussage.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die unpersönliche Wendung »wird es sich erfüllen« bildet die syntaktische Unbestimmtheit des Hebräischen ab; das konkrete Pflanzenbild bleibt erhalten.
