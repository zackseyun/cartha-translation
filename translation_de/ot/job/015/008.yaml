id: JOB.15.8
reference: Job 15:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/בְ/ס֣וֹד אֱל֣וֹהַ תִּשְׁמָ֑ע וְ/תִגְרַ֖ע אֵלֶ֣י/ךָ חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/008.yaml
  text: Have you listened in the council of God[a], and restricted wisdom to yourself?
translation:
  language: de
  text: Hast du im Rat Gottes[a] zugehört und die Weisheit auf dich allein beschränkt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Gottes vertrautem Kreis“ beziehungsweise „in Gottes geheimer Beratung“. Das hebräische Wort kann einen vertraulichen Kreis, eine Ratsversammlung oder eine geheime Beratung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְ/סוֹד
  choice: im Rat
  rationale: סוֹד bezeichnet einen vertraulichen Kreis, eine Ratsversammlung oder eine geheime Beratung. „Im Rat Gottes“ bewahrt hier das Bild eines privilegierten Zugangs zu Gottes Beratungen.
- source_word: אֱלוֹהַ
  choice: Gottes
  rationale: אֱלוֹהַ ist die in Hiob häufige singularische Bezeichnung für Gott; im Deutschen verlangt die Verbindung mit „Rat“ den Genitiv.
- source_word: תִּשְׁמָע
  choice: hast du … zugehört
  rationale: שׁמע kann „hören“ oder „zuhören“ bedeuten. Im Zusammenhang einer Ratsversammlung bringt „zugehört“ die behauptete Teilnahme an vertraulichen Beratungen natürlich zum Ausdruck; die rhetorische Frage wird idiomatisch im Perfekt wiedergegeben.
- source_word: וְ/תִגְרַע
  choice: und … beschränkt
  rationale: גרע bedeutet vermindern, schmälern, vorenthalten oder beschränken. Mit אֵלֶיךָ bezeichnet es hier, dass Weisheit exklusiv auf den Angeredeten begrenzt werde.
- source_word: אֵלֶיךָ
  choice: auf dich allein
  rationale: Die Präposition mit Suffix bezeichnet die Ausrichtung auf den Angeredeten. „Auf dich allein“ macht in Verbindung mit „beschränken“ den exklusiven Sinn im Deutschen deutlich.
- source_word: חָכְמָה
  choice: die Weisheit
  rationale: חָכְמָה wird standardgemäß mit „Weisheit“ wiedergegeben und bezeichnet hier Weisheit oder Einsicht allgemein.
theological_decisions:
- issue: Bedeutung von סוֹד in der Rede Elifas’
  choice: „im Rat Gottes“ als Bild für die Teilnahme an Gottes vertraulicher Beratung
  alternative: „in Gottes Geheimnis“, „im vertrauten Kreis Gottes“ oder „bei Gottes Beratung“
  rationale: Die rhetorische Frage verspottet den Anspruch auf privilegierten Zugang zu Gottes inneren Beratungen. „Rat“ bewahrt die mögliche Vorstellung einer himmlischen Ratsversammlung, ohne die ebenfalls mögliche Bedeutung „Geheimnis“ zu verschweigen; diese wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte rhetorische Frage bleibt knapp und zugespitzt; „auf dich allein beschränkt“ vermittelt den Vorwurf exklusiven Weisheitsbesitzes idiomatisch.
