  text: יַחְמֹ֣ס כַּ/גֶּ֣פֶן בִּסְר֑/וֹ וְ/יַשְׁלֵ֥ךְ כַּ֝/זַּ֗יִת נִצָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/033.yaml
  text: He will shake off his unripe grapes like a vine[b][a], and cast off his blossom like an olive tree.
translation:
  language: de
  text: Er wird seine unreifen Trauben gewaltsam abreißen wie ein Weinstock und seine Blüte abwerfen wie ein Olivenbaum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder beim ersten Bild: „seine unreifen Trauben abstreifen“. Das hebräische Verb bezeichnet häufig gewaltsames Handeln, Berauben oder Entziehen; hier beschreibt es bildhaft den vorzeitigen Verlust der Frucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹס
  choice: gewaltsam abstreifen
  rationale: Das Verb חמס bezeichnet gewöhnlich gewaltsames Handeln, Berauben oder Entziehen. Im landwirtschaftlichen Bild wird diese starke Bedeutung konkret auf den vorzeitigen Verlust der unreifen Trauben bezogen; „gewaltsam abstreifen“ bewahrt sowohl die Härte des Verbs als auch das Bild.
- source_word: כַּגֶּפֶן
  choice: wie ein Weinstock
  rationale: גפן bezeichnet hier die Weinrebe beziehungsweise den Weinstock; im Deutschen ist „Weinstock“ in diesem Vergleich natürlich und eindeutig.
- source_word: בִּסְרוֹ
  choice: seine unreifen Trauben
  rationale: בֹּסֶר bezeichnet noch unreife Trauben. Das maskuline Suffix wird mit „seine“ wiedergegeben und auf den im Kontext beschriebenen Menschen bezogen.
- source_word: וְיַשְׁלֵךְ
  choice: und … abwerfen
  rationale: Die Hifil-Form von שלך bedeutet werfen oder wegwerfen. Bei der Blüte eines Baumes gibt „abwerfen“ das aktive Bild idiomatisch wieder.
- source_word: כַּזַּיִת
  choice: wie ein Olivenbaum
  rationale: זית kann Olive oder Olivenbaum bedeuten; da von der Blüte die Rede ist, verlangt der Vergleich hier „Olivenbaum“.
- source_word: נִצָּתוֹ
  choice: seine Blüte
  rationale: נִצָּה bezeichnet Blüte oder Blume einer Pflanze. „Blüte“ passt zum Olivenbaum und zur Vorstellung eines Verlusts vor der Fruchtbildung.
