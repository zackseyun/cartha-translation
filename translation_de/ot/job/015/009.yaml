  yaml_path: translation/ot/job/015/009.yaml
  text: What do you know that we do not know? What do you understand that is not with us?[a]
translation:
  language: de
  text: Was weißt du, was wir nicht wissen? Was verstehst du, was nicht bei uns ist?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das wir nicht haben«. Wörtlich: »und es ist nicht bei uns«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָדַעְתָ
  choice: Was weißt du
  rationale: Das Fragewort מַה und das Qal Perfekt von ידע bilden hier eine rhetorische Frage mit gegenwärtigem Sinn. Die knappe Wiedergabe entspricht dem Hebräischen und klingt im Deutschen natürlich.
- source_word: וְלֹא נֵדָע
  choice: das wir nicht wissen
  rationale: Nach der einleitenden Frage gibt die deutsche Relativkonstruktion den Gegensatz idiomatisch wieder, ohne den Sinn des hebräischen וְ zu überladen.
- source_word: תָבִין
  choice: Was verstehst du
  rationale: Das Hifil von בין bezeichnet hier Einsicht beziehungsweise Verstehen und steht parallel zu »wissen«.
- source_word: וְלֹא עִמָנוּ הוּא
  choice: das uns nicht bekannt ist
  rationale: Wörtlich heißt die Wendung »und es ist nicht bei uns«. Im Deutschen gibt »uns nicht bekannt« den gemeinten Besitz an Einsicht natürlich wieder; die wörtlichere, bewusst mehrdeutige Form bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Knappe, rhetorisch zugespitzte Fragen in modernem, würdigem Standarddeutsch. Die Parallelität von Wissen und Verstehen bleibt erhalten; die ungewöhnliche hebräische Besitz-/Gegenwartsformulierung wird in der Fußnote dokumentiert.
