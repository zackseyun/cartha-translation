  text: כִּֽי עֲדַ֣ת חָנֵ֣ף גַּלְמ֑וּד וְ֝/אֵ֗שׁ אָכְלָ֥ה אָֽהֳלֵי שֹֽׁחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/034.yaml
  text: For the company of the godless is barren[b][a], and fire consumes the tents of bribery.
translation:
  language: de
  text: Denn die Gemeinschaft der Gottlosen ist unfruchtbar,[a] und Feuer verzehrt die Zelte der Bestechung.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Gemeinschaft des Heuchlers ist unfruchtbar«. Das hebräische Wort חָנֵף kann »Heuchler« bedeuten, bezeichnet im Buch Hiob jedoch oft allgemeiner einen gottlosen oder frevelhaften Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Zelte der Bestechung« oder »die Zelte einer Bestechungsgabe«. Gemeint sind Behausungen, die von korrupt erworbenem Gewinn geprägt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt den Zusammenhang natürlich wieder.
- source_word: עֲדַת
  choice: die Gemeinschaft der
  rationale: Bezeichnet eine versammelte Gruppe oder Gemeinschaft; vermeidet hier einen unnötig kultischen oder kirchlichen Beiklang.
- source_word: חָנֵף
  choice: Gottlosen
  rationale: Das Wort bezeichnet im Buch Hiob häufig Menschen, die gottlos oder frevelhaft handeln, nicht lediglich Heuchler. Der hebräische Singular ist nach dem Kollektivwort עֲדַת kollektiv zu verstehen.
- source_word: גַּלְמוּד
  choice: bleibt unfruchtbar
  rationale: Gibt den Gedanken des Unfruchtbaren, Nachkommenlosen oder Ertraglosen idiomatisch wieder. »Bleibt« bringt den resultativen Zustand zur Geltung, ohne die Aussage zeitlich eng festzulegen.
- source_word: וְאֵשׁ
  choice: und Feuer
  rationale: Bewahrt die schlichte Koordination und das konkrete Bild des Ausgangstextes.
- source_word: אָכְלָה
  choice: verzehrt
  rationale: Das Perfekt kann hier eine allgemeingültige oder anschaulich als gewiss dargestellte Aussage ausdrücken; das deutsche Präsens passt zum Weisheitsspruch.
- source_word: אָהֳלֵי
  choice: die Zelte der
  rationale: Erhält das konkrete, kulturgeschichtlich passende Bild des Hebräischen.
- source_word: שֹׁחַד
  choice: Bestechung
  rationale: Der Ausdruck kann »Bestechung« oder »Bestechungsgabe« bedeuten. Die knappe Genitivverbindung wahrt die Ellipse des Hebräischen und bezeichnet Behausungen, die von unrechtmäßigem Gewinn geprägt sind.
