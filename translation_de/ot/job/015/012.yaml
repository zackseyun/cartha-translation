lexical_decisions:
- source_word: מַה
  choice: Warum
  rationale: Das wörtliche »was« fragt in beiden parallelen Satzteilen idiomatisch nach Grund oder Anlass; »warum« gibt die rhetorische Frage im Deutschen natürlich wieder.
- source_word: יִקָּחֲךָ לִבֶּךָ
  choice: reißt dein Herz dich fort
  rationale: Das Verb לקח bedeutet grundsätzlich »nehmen«. Mit »dein Herz« als Subjekt beschreibt die Wendung bildhaft, wie sich der Angeredete von seinem Inneren mitreißen lässt; die ungewöhnliche Subjektstellung der hebräischen Aussage bleibt erhalten.
- source_word: יִרְזְמוּן
  choice: funkeln
  rationale: Das seltene Verb bezeichnet offenbar eine auffällige Bewegung oder Ausdrucksweise der Augen. »Funkeln« passt zum vorwurfsvollen Zusammenhang, ohne die schwer bestimmbare Geste zu stark auszudeuten; andere mögliche Bedeutungen werden in der Fußnote genannt.
- source_word: עֵינֶיךָ
  choice: deine Augen
  rationale: Die wörtliche Wiedergabe ist im Deutschen natürlich und bewahrt das körperhafte Bild.
