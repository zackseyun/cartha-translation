base_translation:
  language: en
  yaml_path: translation/ot/job/039/025.yaml
  text: At the blast of the trumpet he says[a], ‘Aha!’ From far away he smells the battle[c][b], the thunder of commanders and the war cry.
translation:
  language: de
  text: 'Beim Schall des Horns ruft es: »Ha!«[a] Schon von Weitem wittert es die Schlacht, den Donner der Befehlshaber und das Kriegsgeschrei.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sagt es«. »Ha!« ist ein Ausruf begieriger Erregung und schildert die Kampfbereitschaft des Pferdes.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »das Dröhnen der Befehlshaber und den Signalstoß«. Das mit »Donner« wiedergegebene Wort bezeichnet bildlich gewaltigen Lärm; das letzte Wort kann einen Schlachtruf oder einen Signalstoß meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֵי שֹׁפָר
  choice: Beim Schall des Horns
  rationale: Die Wendung bezeichnet den Anlass beziehungsweise Zeitpunkt, an dem das Signalhorn ertönt. Die Wiedergabe ist natürlich und wahrt den zeitlichen Sinn.
- source_word: שֹׁפָר
  choice: Horn
  rationale: Das Wort bezeichnet ein zum Signalgeben verwendetes Horn. »Horn« bewahrt gegenüber dem allgemeineren »Trompete« den konkreten Charakter des hebräischen Ausdrucks.
- source_word: יֹאמַר
  choice: ruft es
  rationale: Wörtlich steht »sagt es«. Im Deutschen gibt »ruft es« die hörbare, begeisterte Äußerung des Schlachtrosses natürlich wieder, ohne den Sinn wesentlich zu erweitern.
- source_word: הֶאָח
  choice: Ha!
  rationale: Die kurze Interjektion drückt hier gespannte, begierige Erregung aus; »Ha!« ist knapp und im modernen Deutschen verständlich.
- source_word: וּמֵרָחוֹק
  choice: Schon von Weitem
  rationale: Die Formulierung gibt die räumliche Entfernung wieder; »schon« verdeutlicht idiomatisch, dass das Pferd die Schlacht trotz großer Entfernung wahrnimmt.
- source_word: יָרִיחַ
  choice: wittert es
  rationale: Das Verb bezeichnet die Wahrnehmung durch den Geruch. Bei einem Tier ist »wittern« die natürliche deutsche Entsprechung und erhält das konkrete Bild.
- source_word: מִלְחָמָה
  choice: die Schlacht
  rationale: Im unmittelbaren militärischen Szenario bezeichnet das Substantiv den Kampf beziehungsweise die Schlacht, nicht abstrakt den Zustand des Krieges.
- source_word: רַעַם
  choice: den Donner
  rationale: Die wörtliche Bedeutung »Donner« wird als kraftvolle Metapher für den Lärm des Kampfgeschehens bewahrt.
- source_word: שָׂרִים
  choice: der Befehlshaber
  rationale: Im militärischen Zusammenhang sind Truppenführer gemeint; »Befehlshaber« ist hier präziser als das sonst mögliche »Fürsten«.
- source_word: וּתְרוּעָה
  choice: und das Kriegsgeschrei
  rationale: Das Wort kann einen lauten Ruf oder einen Signalstoß bezeichnen. Neben dem Donner der Befehlshaber passt »Kriegsgeschrei« gut in die Schlachtszene, ohne die alternative Bedeutung zu verschweigen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Das Schlachtross wird entsprechend dem Hebräischen im Deutschen mit dem sächlichen Pronomen aufgenommen. Die konkreten Sinneseindrücke und die Donner-Metapher bleiben erhalten; die Mehrdeutigkeit von תְרוּעָה wird in einer Fußnote ausgewiesen.
