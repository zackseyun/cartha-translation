  yaml_path: translation/ot/job/039/020.yaml
  text: Can you make him leap like the locust? The majesty of his snorting is terrifying[a].
translation:
  language: de
  text: Kannst du es wie eine Heuschrecke springen lassen? Sein majestätisches Schnauben ist furchterregend.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kannst du es wie eine Heuschrecke erbeben lassen?“ Das hebräische Verb kann bedeuten, etwas zu erschüttern, erbeben zu lassen oder heftig zu bewegen; möglicherweise schwingt neben der Bewegung auch eine Klangvorstellung mit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַרְעִישֶׁנּוּ
  choice: Lässt du es … springen?
  rationale: Das Hifil von רעשׁ bezeichnet ein heftiges Erschüttern oder Bewegen. Beim Kriegspferd und im Vergleich mit der Heuschrecke liegt hier ein kraftvolles Springen nahe; die mögliche Klangkomponente bleibt in der Fußnote erhalten.
- source_word: כָּאַרְבֶּה
  choice: wie eine Heuschrecke
  rationale: Der singularische Vergleich wird im Deutschen natürlich mit dem unbestimmten Artikel wiedergegeben und beschreibt die plötzlich-sprunghafte Bewegung.
- source_word: הוֹד
  choice: Hoheit
  rationale: Das Wort bezeichnet Hoheit, Pracht oder majestätische Erscheinung. „Hoheit“ bewahrt den gehobenen poetischen Ton und lässt die auffällige Verbindung mit dem Schnauben stehen.
- source_word: נַחְרוֹ
  choice: seines Schnaubens
  rationale: Der Ausdruck bezieht sich auf das kräftige Ausstoßen des Atems durch die Nüstern und passt genau zum Pferdebild.
- source_word: אֵימָה
  choice: ist Schrecken
  rationale: Die nominale Aussage des Hebräischen wird bewusst knapp beibehalten. „Schrecken“ gibt die überwältigend furchteinflößende Wirkung wieder, ohne sie zu einer bloßen Eigenschaft abzuschwächen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Das Pferd wird entsprechend dem grammatischen Geschlecht im Deutschen mit „es“ bezeichnet. Die ungewöhnliche, bildkräftige Nominalfügung „Die Hoheit seines Schnaubens ist Schrecken“ bewahrt die Spannung und Prägnanz des Hebräischen.
