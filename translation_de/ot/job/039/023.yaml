  text: Over him the quiver rattles[b][a], the flashing spear and javelin.
translation:
  language: de
  text: Über ihm[a] klirrt der Köcher, Speer und Wurfspieß blitzen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gegen ihn klirrt der Köcher.“ Die hebräische Präposition lässt unterschiedliche räumliche beziehungsweise gegnerische Nuancen zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Flamme/Klinge des Speeres und des Wurfspießes“ – ein poetisches Bild für das Aufblitzen der Waffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: über ihm
  rationale: Die Präposition עַל mit Suffix bezeichnet hier die räumliche Beziehung zum Pferd. „Über ihm“ bewahrt das Bild, ohne die mögliche feindliche Nuance von „gegen ihn“ festzuschreiben.
- source_word: תִּרְנֶה
  choice: klirrt
  rationale: Das poetische Verb bezeichnet hier einen hellen, metallisch wirkenden Klang. In Verbindung mit dem Köcher gibt „klirrt“ die Schlachtszene im Deutschen anschaulich wieder.
- source_word: אַשְׁפָּה
  choice: der Köcher
  rationale: Dies ist die übliche Bezeichnung für den Behälter, in dem Pfeile getragen werden.
- source_word: לַהַב
  choice: blitzen
  rationale: Das Substantiv bedeutet wörtlich „Flamme“ oder „Klinge/Schneide“ und beschreibt hier poetisch den hellen Glanz der Waffen. Die verbale Wiedergabe „blitzen“ ist im Deutschen natürlich und erhält das Bild.
- source_word: חֲנִית
  choice: Speer
  rationale: „Speer“ ist die breite, geläufige deutsche Entsprechung für diese Waffe.
- source_word: כִידוֹן
  choice: Wurfspieß
  rationale: Der Begriff bezeichnet eine leichtere, zum Werfen geeignete Waffe und bleibt so von חֲנִית („Speer“) unterschieden.
