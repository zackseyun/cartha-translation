  text: אִם עַל פִּ֭י/ךָ יַגְבִּ֣יהַּ נָ֑שֶׁר וְ֝/כִ֗י יָרִ֥ים קִנּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/027.yaml
  text: Is it at your command that the eagle flies high and lifts up its nest?[a][b][c]
translation:
  language: de
  text: Steigt der Adler etwa auf deinen Befehl[a] empor und legt sein Nest in der Höhe an?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „auf deinen Mund“, eine Wendung für „auf deinen Befehl“ oder „nach deinem Wort“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der große Greifvogel“. Das hebräische Wort kann je nach Zusammenhang auch einen Geier bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „und erhöht sein Nest“; gemeint sein kann, dass er es hoch oben anlegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: etwa
  rationale: אִם leitet hier im Zusammenhang eine rhetorische Frage ein; „etwa“ gibt deren Ton im Deutschen natürlich wieder.
- source_word: עַל־פִּיךָ
  choice: auf deinen Befehl
  rationale: Wörtlich „auf deinen Mund“; die Wendung bezeichnet das Handeln nach jemandes Anordnung oder Wort.
- source_word: יַגְבִּיהַּ
  choice: steigt … hoch
  rationale: Das Hifil von גבה bezeichnet das Hochsteigen beziehungsweise Sich-Erheben; beim Adler ist „hochsteigen“ eine natürliche, bildtreue Wiedergabe.
- source_word: נָשֶׁר
  choice: Adler
  rationale: „Adler“ ist die herkömmliche und im Bild des hoch gelegenen Nestes passende Wiedergabe; der hebräische Vogelname kann jedoch auch einen großen Geier bezeichnen.
- source_word: וְכִי
  choice: und
  rationale: Die Verbindung führt innerhalb derselben rhetorischen Frage den zweiten Vorgang an; im Deutschen genügt die einfache Beiordnung.
- source_word: יָרִים קִנּוֹ
  choice: legt sein Nest in der Höhe an
  rationale: Wörtlich wird das Nest „erhöht“ beziehungsweise „hoch gemacht“. Gemeint ist im Kontext die Anlage des Nestes an einem hoch gelegenen Ort; die deutsche Formulierung bewahrt dieses Höhenbild ohne den Eindruck, der Vogel hebe ein fertiges Nest hoch.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit dem natürlichen Ton einer rhetorischen Gottesrede. „Etwa“ macht die Fragefunktion von אִם hörbar; die Bildsprache der Höhe bleibt in beiden Verben erhalten.
