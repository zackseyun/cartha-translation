  text: Will the wild ox be willing to serve you? Will he spend the night at your feeding trough?[a][b]
translation:
  language: de
  text: Wird der Wildochse[b] bereit sein, dir zu dienen? Wird er die Nacht an deiner Futterkrippe[a] verbringen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an deinem Futtertrog«. Das hebräische Wort bezeichnet einen Futterplatz für Tiere.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wildstier« beziehungsweise »Auerochse«; welche Tierart mit dem hebräischen Ausdruck genau gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֹאבֶה
  choice: Wird ... bereit sein
  rationale: Das Verb אבה bezeichnet Bereitschaft oder Einwilligung, nicht bloß Fähigkeit. Die Formulierung bewahrt diesen Willensaspekt in der rhetorischen Frage.
- source_word: רֵּים
  choice: Wildochse
  rationale: Die genaue Tierart ist unsicher. »Wildochse« ist verständlich, zoologisch zurückhaltend und gibt den Gegensatz zu einem domestizierten Arbeitstier gut wieder.
- source_word: עָבְדֶךָ
  choice: dir zu dienen
  rationale: עבד bezeichnet hier praktische Arbeit beziehungsweise Dienst für einen Herrn. »Dir zu dienen« ist knapp, natürlich und bewahrt das Herr-Diener-Motiv.
- source_word: אִם
  choice: Wird
  rationale: אִם leitet hier im poetischen Parallelismus die zweite rhetorische Frage ein. Die Wiederholung von »Wird« klingt im Deutschen natürlicher als ein wörtliches »oder ob«.
- source_word: יָלִין
  choice: die Nacht ... verbringen
  rationale: לין bedeutet übernachten oder über Nacht bleiben. Die gewählte Wendung ist modernes, idiomatisches Deutsch.
- source_word: עַל
  choice: an
  rationale: Obwohl עַל häufig »auf/über« bedeutet, bezeichnet es hier die Lage beim Futterplatz. Im Deutschen ist »an der Futterkrippe« idiomatisch.
- source_word: אֲבוּסֶךָ
  choice: deiner Futterkrippe
  rationale: אֵבוּס bezeichnet einen Futterplatz beziehungsweise Futtertrog für Tiere. »Futterkrippe« ist konkret und verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden parallelen rhetorischen Fragen und der Willensaspekt des Verbs werden bewahrt; die unsichere Tierbestimmung wird nicht im Haupttext überpräzisiert.
