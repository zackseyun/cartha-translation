  text: יְת֣וּר הָרִ֣ים מִרְעֵ֑/הוּ וְ/אַחַ֖ר כָּל יָר֣וֹק יִדְרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/008.yaml
  text: He explores the mountains for his pasture[b][a], and he searches after every green thing.
translation:
  language: de
  text: Er durchstreift die Berge als seine Weide und sucht nach allem frischen Grün.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „nach allem Grünen“; gemeint sind frische Pflanzen oder frischer Bewuchs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתוּר
  choice: durchstreift
  rationale: Das Qal von תור bezeichnet ein Erkunden oder Umherziehen. „Durchstreift“ gibt hier die freie Nahrungssuche des Wildesels natürlich wieder.
- source_word: הָרִים
  choice: die Berge
  rationale: הָרִים bedeutet „die Berge“; der bestimmte Artikel wird beibehalten.
- source_word: מִרְעֵהוּ
  choice: nach Weide
  rationale: מִרְעֶה bezeichnet Weide, Weideplatz oder Futter. In Verbindung mit „durchstreift“ gibt „nach Weide“ den Zweck der Bewegung idiomatisch wieder; das Suffix der dritten Person Singular wird im Deutschen nicht eigens ausgedrückt.
- source_word: וְאַחַר
  choice: und ... nach
  rationale: אַחַר trägt zusammen mit דרשׁ den Gedanken des Nachsuchens beziehungsweise Verfolgens eines Ziels.
- source_word: כָּל
  choice: allem
  rationale: כָּל ist hier distributiv gebraucht; „allem“ erfasst die umfassende Suche nach verfügbarem Grün.
- source_word: יָרוֹק
  choice: frischen Grün
  rationale: יָרוֹק bezeichnet hier Grünes, besonders frische Pflanzen oder jungen Bewuchs. „frisches Grün“ ist im Deutschen natürlich und kontextgerecht.
- source_word: יִדְרוֹשׁ
  choice: sucht
  rationale: דרשׁ bedeutet im Qal „suchen“ oder „nach etwas verlangen“; beim Nahrungserwerb ist „sucht“ die klare natürliche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche und zugleich würdige Standardsprache. Die parallelen Verben „durchstreift“ und „sucht“ bilden die aktive Nahrungssuche ab; „frisches Grün“ vermeidet das im Deutschen schwerfällige „jedes grüne Ding“.
