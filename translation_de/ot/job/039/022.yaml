  text: יִשְׂחַ֣ק לְ֭/פַחַד וְ/לֹ֣א יֵחָ֑ת וְ/לֹֽא יָ֝שׁ֗וּב מִ/פְּנֵי חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/022.yaml
  text: He laughs at fear and is not dismayed[b][a], and he does not turn back from the sword.
translation:
  language: de
  text: Es lacht über die Angst[a] und ist nicht bestürzt; vor dem Schwert weicht es nicht zurück.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Es spottet über die Angst.« Das hebräische Verb kann neben dem Lachen auch Spott ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Es kehrt vor dem Schwert nicht um.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: lacht
  rationale: Das Qal-Imperfekt von שׂחק bewahrt mit »lacht« das lebhafte Bild einer furchtlosen, beinahe spöttischen Reaktion; »spottet« ist als mögliche Bedeutungsnuance in der Fußnote vermerkt.
- source_word: לְפַחַד
  choice: über die Angst
  rationale: פחד bezeichnet Angst, Furcht oder Schrecken. Nach »lachen« gibt »über« die hebräische Konstruktion im Deutschen natürlich wieder, ohne die Intensität unnötig zu steigern.
- source_word: יֵחָת
  choice: ist nicht bestürzt
  rationale: Das Nifal von חתת kann ein Gebrochensein, Erschrecken oder Bestürztsein ausdrücken. »Ist nicht bestürzt« erfasst hier die innere Unerschrockenheit, ohne das zugrunde liegende Bild zu überdehnen.
- source_word: יָשׁוּב
  choice: weicht … nicht zurück
  rationale: שׁוב bedeutet grundsätzlich »umkehren/zurückkehren«. Im Kampfzusammenhang gibt »zurückweichen« die gemeinte Bewegung idiomatisch wieder.
- source_word: מִפְּנֵי
  choice: vor
  rationale: מִפְּנֵי kann »vor«, »von … weg« oder »wegen« bedeuten. Zusammen mit dem Zurückweichen bezeichnet es hier die Bedrohung, angesichts derer das Pferd nicht weicht.
- source_word: חָרֶב
  choice: dem Schwert
  rationale: Das singularische חרב ist ein repräsentatives Bild für Waffe und Kampf; der bestimmte Artikel entspricht dem natürlichen deutschen Ausdruck.
