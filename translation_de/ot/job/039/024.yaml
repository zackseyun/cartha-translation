  text: בְּ/רַ֣עַשׁ וְ֭/רֹגֶז יְגַמֶּא אָ֑רֶץ וְ/לֹֽא יַ֝אֲמִ֗ין כִּי ק֥וֹל שׁוֹפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/024.yaml
  text: With fierceness and rage he devours the ground[b][a], and he cannot stand still at the sound of the trumpet.
translation:
  language: de
  text: Mit Ungestüm und Erregung verschlingt es den Boden[a]; es hält nicht still, wenn der Schofar ertönt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »verschlingt die Erde« – ein Bild für die Geschwindigkeit und den Eifer des vorwärtsstürmenden Pferdes.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und es glaubt nicht, dass der Klang des Schofars [ertönt]«. Die Bedeutung der Wendung ist umstritten; im Zusammenhang wird sie meist idiomatisch verstanden: Das Pferd kann sich beim Signal nicht stillhalten oder zurückhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַעַשׁ
  choice: Mit Ungestüm
  rationale: רַעַשׁ bezeichnet heftige Bewegung, Erschütterung oder Getöse. Im Zusammenhang mit dem Schlachtross gibt »Ungestüm« natürlich und prägnant die wilde, vorwärtsdrängende Kraft wieder.
- source_word: וְרֹגֶז
  choice: und Erregung
  rationale: רֹגֶז kann Unruhe, Erregung, Zittern oder Zorn bezeichnen. »Erregung« bewahrt hier die körperliche und emotionale Spannung, ohne das Pferd unnötig zu vermenschlichen.
- source_word: יְגַמֶּא
  choice: verschlingt
  rationale: Das Verb גמא bedeutet wörtlich »hinunterschlucken«. Mit »Boden« entsteht das anschauliche Bild, dass das Pferd in rasendem Lauf die Strecke gleichsam verschlingt.
- source_word: אָרֶץ
  choice: den Boden
  rationale: Im unmittelbaren Zusammenhang ist das Gelände gemeint, das das Pferd im Lauf zurücklegt; »Boden« ist daher treffender als »Erde« oder »Land«.
- source_word: וְלֹא יַאֲמִין
  choice: hält es nicht still
  rationale: Obwohl אמן im Hifil gewöhnlich »glauben« bedeutet, wird die Wendung hier vielfach idiomatisch im Sinn von »stillhalten«, »standhalten« oder »sich zurückhalten« verstanden. Die gewählte Fassung passt zum erregten Schlachtross und bleibt durch eine Fußnote für die wörtlichere Möglichkeit offen.
- source_word: כִּי
  choice: beim
  rationale: כִּי verbindet die Reaktion des Pferdes mit dem Ertönen des Signals. Die deutsche Präpositionalfügung »beim Klang« gibt diesen situativen beziehungsweise zeitlichen Zusammenhang natürlich wieder.
- source_word: קוֹל שׁוֹפָר
  choice: Klang des Schofars
  rationale: שׁוֹפָר bezeichnet ein Signalhorn, typischerweise aus einem Tierhorn. »Schofar« ist im Deutschen präzise und bewahrt die konkrete historische Bezeichnung.
theological_decisions:
- issue: Mehrdeutigkeit von וְלֹא יַאֲמִין
  choice: beim Klang des Schofars hält es nicht still
  alternative: es glaubt nicht, dass der Schofar ertönt / es hält sich beim Klang des Schofars nicht zurück
  rationale: Der Kontext legt eine idiomatische Aussage über die kaum zu zügelnde Kampfbereitschaft des Pferdes nahe. Da die Verbform formal auch »glauben« heißen kann und andere idiomatische Deutungen möglich sind, wird die Spannung nicht dogmatisch entschieden, sondern in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das grammatische Neutrum »es« nimmt das in Vers 19 genannte Pferd auf. »Ungestüm« und »verschlingt« erhalten die kraftvolle Bildsprache; »Schofar« wahrt die historische Genauigkeit.
