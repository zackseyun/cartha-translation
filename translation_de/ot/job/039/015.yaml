  text: and she forgets that a foot may crush them[b][a], and a wild animal may trample them.
translation:
  language: de
  text: und vergisst, dass ein Fuß sie zertreten[a] und ein wildes Tier[b] sie zerstampfen kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie zertreten“. Das feminine Singularsuffix bezieht sich wahrscheinlich kollektiv auf die zurückgelassenen Eier.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ein Tier des Feldes“, eine hebräische Bezeichnung für ein wild lebendes Landtier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: und vergisst
  rationale: Das Qal-Wajjiqtol der 3. Person Femininum Singular setzt die lebendige poetische Beschreibung der Straußenhenne fort; das deutsche Präsens passt zum Zusammenhang.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was sie vergisst, nicht eine Begründung.
- source_word: רֶגֶל
  choice: ein Fuß
  rationale: 'Der artikellose Singular ist allgemein zu verstehen: Jeder beliebige Fuß könnte die zurückgelassenen Eier treffen.'
- source_word: תְּזוּרֶהָ
  choice: sie zertreten
  rationale: Im Zusammenhang bezeichnet das Verb die Beschädigung durch einen Fuß. „Zertreten“ gibt das konkrete Bild natürlich wieder; das feminine Singularsuffix wird mit Blick auf die kollektiv gemeinten Eier idiomatisch pluralisch übersetzt.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: und ein wildes Tier
  rationale: Die Wendung bedeutet wörtlich „Tier des Feldes“ und bezeichnet hier verständlich ein wild lebendes Landtier.
- source_word: תְּדוּשֶׁהָ
  choice: sie zerstampfen kann
  rationale: דושׁ bedeutet „treten, stampfen, dreschen“. „Zerstampfen“ wahrt die kräftige Bildsprache und unterscheidet den Ausdruck vom vorhergehenden Verb; „kann“ gibt die mögliche Gefahr natürlich wieder.
