  text: כְּנַף רְנָנִ֥ים נֶעֱלָ֑סָה אִם אֶ֝בְרָ֗ה חֲסִידָ֥ה וְ/נֹצָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/013.yaml
  text: The wings of the ostrich flap joyfully—are they the pinions and plumage of the stork?[a]
translation:
  language: de
  text: Die Flügel der Straußenhenne schlagen voller Freude – sind es etwa die Schwingen und das Gefieder des Storches?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Flügel des Straußes schlägt stolz; doch ist er Schwinge und Gefieder des Storches?“ Der hebräische Text ist schwierig und wird unterschiedlich verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַף
  choice: Flügel
  rationale: Der hebräische Singular kann kollektiv verstanden werden; im Deutschen bezeichnet „Flügel“ in dieser Form natürlich das Flügelpaar.
- source_word: רְנָנִים
  choice: der Straußenhenne
  rationale: Im Zusammenhang der Tierreden bezeichnet das schwierige Wort den Strauß; die feminine Form und die folgenden Verse über Eier legen legen hier „Straußenhenne“ nahe.
- source_word: נֶעֱלָסָה
  choice: schlagen voller Freude
  rationale: Das Verb verbindet ausgelassene Freude beziehungsweise Frohlocken mit der Bewegung der Flügel. Die Formulierung gibt beide Aspekte wieder.
- source_word: אִם
  choice: sind es etwa
  rationale: אִם leitet hier wahrscheinlich eine rhetorische, vergleichende Frage ein. „Etwa“ bewahrt deren skeptischen Unterton.
- source_word: אֶבְרָה
  choice: Schwingen
  rationale: Das Wort bezeichnet Flügel oder kräftige Schwungfedern; „Schwingen“ passt zum poetischen Register und unterscheidet den Ausdruck von כְּנַף.
- source_word: חֲסִידָה
  choice: des Storches
  rationale: Im zoologischen Kontext ist חֲסִידָה als Vogelname „Storch“ zu verstehen, nicht als Eigenschaft wie „treu“ oder „gütig“.
- source_word: וְנֹצָה
  choice: und das Gefieder
  rationale: Das Nomen bezeichnet Federn beziehungsweise Gefieder. „Gefieder“ bildet im Deutschen eine natürliche poetische Paarung mit „Schwingen“.
