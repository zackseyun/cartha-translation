  text: כִּֽי תַעֲזֹ֣ב לָ/אָ֣רֶץ בֵּצֶ֑י/הָ וְֽ/עַל עָפָ֥ר תְּחַמֵּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/014.yaml
  text: For she leaves her eggs to the earth and warms them on the dust,[a]
translation:
  language: de
  text: Denn sie überlässt ihre Eier der Erde und wärmt sie auf dem Staub.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gibt ihre Eier der Erde preis«. Das hebräische Verb kann stärker als bloßes Zurücklassen verstanden werden; die zweite Vershälfte beschreibt jedoch vor allem, dass die Eier ungeschützt auf dem Boden liegen, nicht unbedingt, dass sie völlig aufgegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorangehenden Beschreibung ein und bewahrt den kausal-erklärenden Zusammenhang.
- source_word: תַעֲזֹב
  choice: überlässt
  rationale: Gibt das Bedeutungsspektrum von »lassen, verlassen, preisgeben« in diesem Zusammenhang natürlich wieder, ohne eine vollständige Aufgabe der Eier zwingend festzulegen.
- source_word: לָאָרֶץ
  choice: der Erde
  rationale: Bewahrt mit dem Dativ nach »überlassen« die konkrete Bildsprache des hebräischen Ausdrucks »der Erde«.
- source_word: בֵּצֶיהָ
  choice: ihre Eier
  rationale: Direkte Wiedergabe des Plurals mit Suffix der 3. Person feminin Singular; gemeint ist im Kontext die Straußenhenne.
- source_word: וְעַל עָפָר
  choice: auf dem Staub
  rationale: Nahe Wiedergabe der Präpositionalfügung; »Staub« erhält den poetisch-biblischen Bildgehalt.
- source_word: תְּחַמֵּם
  choice: wärmt sie
  rationale: Gibt das Piel von חמם als »warm machen« wieder. Das ergänzte Pronomen bezieht sich natürlich auf die Eier; »ausbrüten« wäre stärker interpretierend.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Konkretheit. »Überlässt« wahrt die Mehrdeutigkeit zwischen einfachem Zurücklassen und stärkerem Preisgeben; die Fußnote nennt die kräftigere Möglichkeit.
