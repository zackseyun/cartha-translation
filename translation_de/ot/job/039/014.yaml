review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt den erklärenden Anschluss von כִּי mit „Denn“ angemessen wieder. „überlässt ihre Eier der Erde“ bildet die Konstruktion mit עזב und לָאָרֶץ eng ab, ohne die stärkere Nuance von „preisgeben/verlassen“ auszuschließen. „wärmt sie auf dem Staub“ entspricht וְעַל־עָפָר תְּחַמֵּם und belässt das im Hebräischen vorausgesetzte Objekt bei den Eiern.
  naturalness: Der Satz ist klares, würdiges modernes Standarddeutsch. Die Verbindung „der Erde überlassen“ hat eine bewusst poetisch-biblische Färbung, ist aber idiomatisch und für den Kontext gut verständlich. „auf dem Staub“ bewahrt die konkrete, poetische Bildsprache; eine Glättung zu „im Staub“ wäre weniger quellennah.
  terminology: „Eier“, „Erde“ und „Staub“ sind treffend und registergerecht. „Überlässt“ wahrt gegenüber einem unqualifizierten „verlässt“ oder „gibt preis“ die kontextuell mögliche Abstufung. Die Fußnote dokumentiert die stärkere lexikalische Alternative sachgerecht und ohne den hebräischen Befund zu überdeuten.
