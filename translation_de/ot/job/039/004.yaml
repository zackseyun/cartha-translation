  text: יַחְלְמ֣וּ בְ֭נֵי/הֶם יִרְבּ֣וּ בַ/בָּ֑ר יָ֝צְא֗וּ וְ/לֹא שָׁ֥בוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/004.yaml
  text: Their young ones become strong[a]; they grow up in the open field; they go out and do not return to them.
translation:
  language: de
  text: Ihre Jungen werden kräftig; sie wachsen im freien Land heran[a], ziehen fort und kehren nicht zu ihnen zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der Wildnis« oder »in freier Natur«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְלְמוּ
  choice: werden kräftig
  rationale: Das Verb חָלַם bezeichnet hier im Zusammenhang mit Tierjungen ihr körperliches Erstarken und Gedeihen. »Werden kräftig« gibt diesen Sinn natürlich und ohne unnötige Spezifizierung wieder.
- source_word: בְנֵיהֶם
  choice: ihre Jungen
  rationale: Wörtlich steht »ihre Söhne/Kinder«; bei Tieren bezeichnet »ihre Jungen« den Nachwuchs idiomatisch und ohne eine Beschränkung auf männliche Tiere.
- source_word: יִרְבּוּ
  choice: wachsen … heran
  rationale: רבה kann »zahlreich werden« oder »zunehmen« bedeuten. Im poetischen Zusammenhang beschreibt es am ehesten das weitere Wachstum der Jungtiere; »heranwachsen« bewahrt diesen Entwicklungsgedanken.
- source_word: בַבָּר
  choice: im freien Land
  rationale: בָּר bezeichnet hier offenes, unbebautes Land beziehungsweise die freie Natur. »Im freien Land« bewahrt das Landschaftsbild; die naheliegende Alternative »in der Wildnis« wird in der Fußnote genannt.
- source_word: יָצְאוּ
  choice: ziehen fort
  rationale: יָצְאוּ bezeichnet ihr Weggehen. »Ziehen fort« klingt bei Wildtieren natürlich und lässt das Ziel unbestimmt.
- source_word: וְלֹא שָׁבוּ לָמוֹ
  choice: und kehren nicht zu ihnen zurück
  rationale: Die Formulierung gibt die Verneinung und das auf die Muttertiere bezogene לָמוֹ direkt wieder, ohne durch »nie« eine stärkere zeitliche Aussage hinzuzufügen.
