  text: סֶ֣לַע יִ֭שְׁכֹּן וְ/יִתְלֹנָ֑ן עַֽל שֶׁן סֶ֝֗לַע וּ/מְצוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/028.yaml
  text: He dwells on the cliff and spends the night there[c][b][a], on the tooth of the crag and the stronghold.
translation:
  language: de
  text: Auf einem Felsen wohnt er und übernachtet, auf einem Felszacken[a] und einer Festung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf dem Zahn eines Felsens“; gemeint ist ein scharf vorspringender Felszacken oder Gipfel.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „Bergfeste“ oder „sicherer Zufluchtsort“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סֶלַע
  choice: Felsen
  rationale: Das Wort bezeichnet hier eine hoch gelegene, steile Felsformation als Wohn- und Ruheplatz des Adlers. „Felsen“ ist im Deutschen natürlich und bewahrt den poetischen Ton.
- source_word: יִשְׁכֹּן
  choice: wohnt
  rationale: שׁכן bezeichnet ein dauerhaftes Wohnen oder Sich-Aufhalten. „wohnt“ gibt den stativen Sinn klar und würdig wieder.
- source_word: וְיִתְלֹנָן
  choice: und verbringt dort die Nacht
  rationale: Die Form von לון/לין bezeichnet das Übernachten. Die explizite Wiedergabe macht den zeitlichen Aspekt im modernen Deutsch deutlich; „dort“ ist sinngemäß aus dem Kontext ergänzt.
- source_word: עַל
  choice: auf
  rationale: Die Präposition bezeichnet hier unmittelbar den Ort.
- source_word: שֶׁן סֶלַע
  choice: dem Zahn des Felsens
  rationale: Die wörtliche Metapher „Zahn des Felsens“ bezeichnet einen scharf hervortretenden Felszacken. Ihre Beibehaltung wahrt die konkrete poetische Bildsprache.
- source_word: וּמְצוּדָה
  choice: seiner Festung
  rationale: מְצוּדָה kann eine Festung oder einen sicheren, schwer zugänglichen Zufluchtsort bezeichnen. Das possessive „seiner“ stellt im Deutschen natürlich die appositionelle Beziehung zum Felszahn her, ohne das Bild aufzulösen.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit gehoben-poetischem Ton. Die hebräische Metapher „Zahn des Felsens“ bleibt bewusst erhalten; die abschließende Nominalgruppe wird als Apposition wiedergegeben.
