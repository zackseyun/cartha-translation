  text: יִ֭שְׂחַק לַ/הֲמ֣וֹן קִרְיָ֑ה תְּשֻׁא֥וֹת נ֝וֹגֵ֗שׂ לֹ֣א יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/007.yaml
  text: He laughs at the tumult of the city[b][a]; he does not hear the shouts of the driver.
translation:
  language: de
  text: Er lacht über den Lärm der Stadt[a]; die Rufe des Treibers[b] hört er nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Getümmel der Stadt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „des Antreibers“, „des Fronvogts“. Das hebräische Wort kann allgemein jemanden bezeichnen, der andere antreibt oder Arbeit einfordert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: er lacht
  rationale: Das Qal-Imperfekt von שׂחק bezeichnet hier die unbekümmerte, fast spöttische Reaktion des Wildesels. „Lacht“ gibt das Verb direkt wieder, ohne die stärkere Deutung „verspottet“ einzutragen.
- source_word: לַהֲמוֹן
  choice: über den Lärm
  rationale: הָמוֹן kann Lärm, Getöse oder unruhiges Treiben bezeichnen. „Lärm“ ist im Deutschen natürlich und bewahrt den akustischen Schwerpunkt; die breitere Bedeutung „Getümmel“ wird in der Fußnote genannt.
- source_word: קִרְיָה
  choice: der Stadt
  rationale: קִרְיָה bezeichnet eine Stadt beziehungsweise Ortschaft. Der bestimmte generische Ausdruck „der Stadt“ bildet den Gegensatz zwischen besiedeltem Raum und der Freiheit des Wildesels idiomatisch ab.
- source_word: תְּשֻׁאוֹת
  choice: die Rufe
  rationale: Der Plural bezeichnet laute Rufe oder Geschrei. „Rufe“ ist würdig und natürlich und lässt offen, ob einzelne Zurufe oder anhaltendes Rufen gemeint sind.
- source_word: נֹגֵשׂ
  choice: des Treibers
  rationale: נֹגֵשׂ kann einen Antreiber, Fronvogt oder jemanden bezeichnen, der Arbeit beziehungsweise Leistung einfordert. Im Zusammenhang mit dem Wildesel passt „Treiber“ am besten, ohne die weitergehenden Bedeutungen auszuschließen.
- source_word: לֹא יִשְׁמָע
  choice: hört er nicht
  rationale: Die Formulierung gibt die Grundbedeutung „nicht hören“ formal und idiomatisch wieder. Eine Wiedergabe wie „achtet er nicht“ würde die im Kontext mögliche Bedeutung des Nichtbeachtens bereits auslegen.
