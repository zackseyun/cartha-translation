  yaml_path: translation/ot/job/039/030.yaml
  text: Its young ones suck up blood[a], and where the slain are[b], there it is.
translation:
  language: de
  text: Seine Jungen saugen Blut[a], und wo Erschlagene sind[b], da ist er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schlürfen Blut« beziehungsweise »lecken Blut«. Das hebräische Verb ist sehr anschaulich und kann begieriges Saugen, Schlürfen oder Auflecken bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wo die Leichen sind«. Im Hebräischen steht »die Erschlagenen«; das Wort hebt den gewaltsamen Tod hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרֹחָיו
  choice: seine Jungen
  rationale: Das Substantiv bezeichnet hier die Nachkommen des zuvor genannten Greifvogels. »Jungen« ist natürlich und legt weder Nestlinge noch bereits flügge Jungvögel unnötig fest.
- source_word: יְעַלְעוּ
  choice: schlürfen
  rationale: Das seltene, bildhafte Verb beschreibt ein begieriges Saugen, Schlingen oder Auflecken. »Schlürfen« bewahrt die drastische Anschaulichkeit und passt unmittelbar zu »Blut«.
- source_word: דָם
  choice: Blut
  rationale: Direkte und kontextgemäße Wiedergabe ohne Abschwächung.
- source_word: וּבַאֲשֶׁר
  choice: und wo
  rationale: Die hebräische Relativkonstruktion leitet eine Ortsangabe ein; »und wo« ist direkt und im Deutschen idiomatisch.
- source_word: חֲלָלִים
  choice: Erschlagene
  rationale: Das Wort bezeichnet gewaltsam Getötete oder tödlich Verwundete. »Erschlagene« erhält den Hinweis auf den gewaltsamen Tod, ohne bloß »Leichen« zu sagen.
- source_word: שָׁם הוּא
  choice: da ist er
  rationale: Das maskuline Pronomen verweist auf den zuvor genannten Vogel. Die präsentische Form bewahrt die knappe poetische Aussage.
