  yaml_path: translation/ot/job/039/021.yaml
  text: It paws in the valley and rejoices in its strength[b][a]; it goes out to meet the weapons.
translation:
  language: de
  text: Es scharrt im Tal und freut sich an seiner Kraft[a]; es zieht den Waffen entgegen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „und jubelt in seiner Kraft“; die hebräische Wendung lässt das genaue Verhältnis zur Kraft offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Kampf entgegen“. Das hebräische Wort kann Waffen beziehungsweise Bewaffnung und darüber hinaus den bewaffneten Kampf bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפְּרוּ
  choice: Es scharrt
  rationale: חפר bedeutet wörtlich „graben“; beim Kriegspferd bezeichnet es hier anschaulich das Scharren mit den Hufen. Der auffällige hebräische Plural wird im Zusammenhang mit dem einzelnen Pferd sinngemäß als Singular wiedergegeben.
- source_word: בָעֵמֶק
  choice: im Tal
  rationale: עֵמֶק bezeichnet gewöhnlich ein Tal oder eine Niederung; „im Tal“ ist die direkte und natürliche Wiedergabe.
- source_word: וְיָשִׂישׂ
  choice: und freut sich
  rationale: שׂושׂ bezeichnet Freude oder Frohlocken. „Freut sich“ ist modern und würdig, ohne die Aussage unnötig zu verstärken.
- source_word: בְּכֹחַ
  choice: an seiner Kraft
  rationale: Die Verbindung von ב mit כֹּחַ lässt mehrere Nuancen zu. „An seiner Kraft“ drückt idiomatisch aus, dass das Pferd sich seiner Kraft freut, ohne einen ausdrücklichen Kausalzusammenhang festzulegen.
- source_word: יֵצֵא
  choice: es zieht
  rationale: יצא bedeutet grundsätzlich „hinausgehen“. Im militärischen Zusammenhang gibt „zieht … entgegen“ die Bewegung natürlich wieder, ohne das stärkere „stürmt“ hinzuzufügen.
- source_word: לִקְרַאת
  choice: entgegen
  rationale: לקראת bezeichnet die Bewegung auf eine Begegnung zu. In Verbindung mit „ziehen“ ist „entgegen“ im Deutschen idiomatisch.
- source_word: נָשֶׁק
  choice: den Waffen
  rationale: נֶשֶׁק kann Waffen beziehungsweise Bewaffnung und erweitert auch den bewaffneten Kampf bezeichnen. Die konkrete Grundbedeutung wird im Haupttext bewahrt.
