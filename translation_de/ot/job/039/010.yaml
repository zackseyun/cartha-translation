  text: הֲֽ/תִקְשָׁר רֵ֭ים בְּ/תֶ֣לֶם עֲבֹת֑/וֹ אִם יְשַׂדֵּ֖ד עֲמָקִ֣ים אַחֲרֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/010.yaml
  text: Will you bind the wild ox in the furrow with its rope[b][a], or will it harrow the valleys behind you?
translation:
  language: de
  text: Kannst du den Auerochsen[a] mit seinem Strick an die Furche binden, oder wird er hinter dir die Talgründe eggen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Wildrind« beziehungsweise »den Wildstier«. Das hebräische Wort רֵים bezeichnet ein kräftiges wildes Rind, nicht das sagenhafte »Einhorn« älterer Übersetzungen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Talgründe pflügen« beziehungsweise »einebnen«. Das hebräische Verb bezeichnet hier wahrscheinlich eine Bodenbearbeitung wie Eggen oder Einebnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִקְשָׁר
  choice: Kannst du … binden
  rationale: קשׁר bedeutet »binden, festbinden«. Die Form eröffnet eine rhetorische Frage, die das menschliche Unvermögen hervorhebt.
- source_word: רֵים
  choice: Auerochsen
  rationale: רֵים bezeichnet ein starkes wildes Rind. »Auerochse« ist im Deutschen verständlich und zoologisch konkreter als »Wildrind«; die mögliche allgemeinere Bedeutung wird in der Fußnote bewahrt.
- source_word: בְּתֶלֶם
  choice: an die Furche
  rationale: תֶּלֶם bezeichnet eine Pflugfurche. Die Präposition ב kann hier die Einbindung des Tieres in die Arbeit an der Furche ausdrücken; natürliches Deutsch verlangt eher »an die Furche« als »in der Furche«.
- source_word: עֲבֹתוֹ
  choice: mit seinem Strick
  rationale: עֲבוֹת bezeichnet einen Strick oder ein starkes Seil; das Suffix der 3. Person Singular bezieht sich auf den Auerochsen.
- source_word: אִם
  choice: oder
  rationale: אִם führt hier parallel zur ersten rhetorischen Frage die zweite Möglichkeit ein und ist daher als »oder« wiederzugeben.
- source_word: יְשַׂדֵּד
  choice: wird er … eggen
  rationale: שׂדד bezeichnet in diesem landwirtschaftlichen Zusammenhang wahrscheinlich das Bearbeiten beziehungsweise Einebnen des Bodens. »Eggen« gibt diese Tätigkeit prägnant wieder, ohne sie mit dem Pflügen gleichzusetzen.
- source_word: עֲמָקִים
  choice: die Talgründe
  rationale: עֲמָקִים bedeutet wörtlich »Täler« beziehungsweise tiefer gelegene Flächen. »Talgründe« verbindet den topografischen Sinn mit dem Bild landwirtschaftlich bearbeiteter Flächen.
- source_word: אַחֲרֶיךָ
  choice: hinter dir
  rationale: Die Wendung beschreibt, dass das Tier dem Menschen bei gelenkter Feldarbeit folgt; »hinter dir« ist anschaulich und idiomatisch.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die rhetorische Doppelstruktur bleibt erhalten. »Auerochse« wahrt die konkrete Tierwelt des Textes; »Talgründe« erhält sowohl den räumlichen als auch den landwirtschaftlichen Bildgehalt.
