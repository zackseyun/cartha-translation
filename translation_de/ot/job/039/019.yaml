  text: Do you give the horse its strength? Do you clothe its neck with a mane?[a]
translation:
  language: de
  text: Gibst du dem Pferd seine Kraft? Bekleidest du seinen Hals mit einer Mähne?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „mit Donner“. So versteht eine ältere Auslegungstradition רַעְמָה; hier steht „Mähne“, weil unmittelbar vom Bekleiden des Pferdehalses die Rede ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִתֵּן
  choice: Gibst du
  rationale: Die Fragepartikel mit dem Imperfekt von נתן bildet eine rhetorische Frage an Hiob. „Gibst du“ gibt die unmittelbare Herausforderung natürlich wieder, ohne eine zusätzliche modale Bedeutung einzutragen.
- source_word: לַסּוּס
  choice: dem Pferd
  rationale: Der bestimmte Artikel spricht für „dem Pferd“; zugleich ist die Form hier generisch und bezeichnet das Pferd als Gattung.
- source_word: גְּבוּרָה
  choice: seine Kraft
  rationale: גְּבוּרָה kann Kraft, Stärke oder Macht bezeichnen. „Kraft“ passt prägnant zur körperlichen Stärke des Pferdes; das Possessivpronomen ergibt im Deutschen einen natürlichen Satz und entspricht dem Sinnzusammenhang.
- source_word: הֲתַלְבִּישׁ
  choice: Bekleidest du
  rationale: Der Hifil von לבש bedeutet „bekleiden“. Die Wahl bewahrt das anschauliche Bild, nach dem der Hals des Pferdes mit seiner Mähne wie mit einem Kleid versehen wird.
- source_word: צַוָּארוֹ
  choice: seinen Hals
  rationale: Das maskuline Singularsuffix bezieht sich auf סוּס. Im Deutschen verlangt das grammatisch maskuline „Pferd“ hier das Pronomen „seinen“, ohne damit das biologische Geschlecht festzulegen.
- source_word: רַעְמָה
  choice: einer Mähne
  rationale: Im unmittelbaren Bild vom Bekleiden des Pferdehalses bezeichnet das Wort am wahrscheinlichsten die Mähne. Die mögliche traditionelle Deutung „Donner“ bleibt in einer Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallelen rhetorischen Fragen und die Metapher des Bekleidens bleiben erhalten; die echte lexikalische Unsicherheit bei רַעְמָה wird nicht im Haupttext geglättet, sondern in der Fußnote dokumentiert.
