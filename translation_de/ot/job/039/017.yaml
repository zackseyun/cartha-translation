  text: כִּֽי הִשָּׁ֣/הּ אֱל֣וֹהַּ חָכְמָ֑ה וְ/לֹא חָ֥לַק לָ֝֗/הּ בַּ/בִּינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/017.yaml
  text: because God has deprived her of wisdom and has not given her a share in understanding[a][b].
translation:
  language: de
  text: Denn Gott hat ihr Weisheit versagt[a] und ihr keinen Anteil an Einsicht zugeteilt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn Gott hat sie die Weisheit vergessen lassen“; auch möglich: „Denn Gott hat bewirkt, dass ihr Weisheit fehlt.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und hat ihr an Einsicht nicht zugeteilt“, das heißt: Er hat ihr keinen Anteil an Einsicht gegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung für das zuvor beschriebene Verhalten des Straußes ein. „Denn“ gibt diese kausale Funktion in würdigem, natürlichem Deutsch knapp wieder.
- source_word: הִשָּׁהּ
  choice: hat ihr … versagt
  rationale: Die seltene Kausativform von נשה bezeichnet hier, dass Weisheit bei ihr fehlt, weil Gott sie ihr nicht zukommen ließ. „Hat ihr … versagt“ bewahrt sowohl die göttliche Verursachung als auch den idiomatischen deutschen Ausdruck; die mögliche Bedeutung „vergessen lassen“ wird in einer Fußnote genannt.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Dies ist die übliche deutsche Wiedergabe der singularischen Gottesbezeichnung אֱלוֹהַּ im Buch Hiob; eine Erweiterung wie „der Allmächtige“ ist hier nicht im Ausgangstext begründet.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Das Substantiv bezeichnet hier Weisheit beziehungsweise die zu vernünftigem Verhalten nötige Befähigung. „Weisheit“ ist die direkte und kontextgerechte Wiedergabe.
- source_word: וְלֹא
  choice: und … keinen
  rationale: Die koordinierende Verbindung und die Verneinung werden in natürlicher deutscher Satzstellung wiedergegeben.
- source_word: חָלַק לָהּ
  choice: ihr keinen Anteil … zugeteilt
  rationale: חלק bedeutet grundlegend „teilen, zuteilen“. Die Formulierung bewahrt das Bild einer Zuteilung genauer als das allgemeinere „gegeben“.
- source_word: בַּבִּינָה
  choice: an Einsicht
  rationale: בינה bezeichnet Verständnis, Einsicht oder Unterscheidungsvermögen. „Einsicht“ unterscheidet sich im Deutschen sinnvoll von „Weisheit“ und passt zur Vorstellung eines zugeteilten Anteils.
theological_decisions:
- issue: Gottes Wirken beim Mangel des Straußes an Weisheit
  choice: 'Gott bleibt das ausdrückliche Subjekt: Er hat ihr Weisheit versagt und ihr keinen Anteil an Einsicht zugeteilt.'
  alternative: Eine abschwächende Formulierung wie „ihr fehlt Weisheit“, die Gottes unmittelbare Urheberschaft nicht nennt.
  rationale: Der hebräische Text nennt אֱלוֹהַּ ausdrücklich als handelndes Subjekt. Die Übersetzung bewahrt diese theologische Spannung, ohne sie abzumildern oder weiter auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die parallelen Begriffe „Weisheit“ und „Einsicht“ sowie das Zuteilungsbild des hebräischen Textes bleiben erhalten. Die weiblichen Pronomen beziehen sich wie im Kontext auf die Straußenhenne.
