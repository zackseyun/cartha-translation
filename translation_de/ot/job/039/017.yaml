  source_fidelity: Die Übersetzung gibt die kausale Konjunktion כִּי treffend mit „Denn“ wieder und bewahrt Gott als ausdrückliches Subjekt beider Verbhandlungen. „hat ihr Weisheit versagt“ ist eine idiomatische, semantisch vertretbare Wiedergabe der schwierigen Hifil-Form הִשָּׁהּ; die mögliche Nuance „vergessen lassen“ beziehungsweise „Weisheit fehlen lassen“ wird angemessen in der Fußnote dokumentiert. „ihr keinen Anteil an Einsicht zugeteilt“ bildet die Zuteilungsmetaphorik von חָלַק לָהּ sowie die Unterscheidung von Weisheit und Einsicht zuverlässig ab.
