source:
  edition: WLC
  text: הֲ/יָדַ֗עְתָּ עֵ֭ת לֶ֣דֶת יַעֲלֵי סָ֑לַע חֹלֵ֖ל אַיָּל֣וֹת תִּשְׁמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/001.yaml
  text: Do you know the time when the mountain goats give birth? Do you watch over the deer in labor?[a][b][c]
translation:
  language: de
  text: Kennst du die Zeit, in der die Steinböcke gebären? Beobachtest du die Hirschkühe bei den Wehen?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wachst du über die Hirschkühe, wenn sie sich in Wehen winden?“'
    reason: lexical_alternative
  - marker: b
    text: „Steinböcke“ gibt einen Ausdruck wieder, der wörtlich etwa „Wildziegen des Felsens“ bedeutet.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Kennst du
  rationale: Die Fragepartikel mit dem Qal Perfekt von ידע bildet hier eine rhetorische Frage; das deutsche Präsens gibt ihre gegenwärtige Aussagekraft natürlich wieder.
- source_word: עֵת לֶדֶת
  choice: die Zeit, in der … gebären
  rationale: עֵת bezeichnet die Zeit oder den Zeitpunkt; der Infinitiv von ילד wird im Deutschen idiomatisch als Temporalsatz wiedergegeben.
- source_word: יַעֲלֵי סָלַע
  choice: die Steinböcke
  rationale: Der Ausdruck bedeutet wörtlich etwa „Wildziegen des Felsens“ und bezeichnet felsbewohnende Wildziegen, wahrscheinlich Steinböcke. „Steinböcke“ ist prägnant und im Deutschen zoologisch naheliegend.
- source_word: חֹלֵל
  choice: bei den Wehen
  rationale: Die Form bezeichnet hier das Sich-Winden beziehungsweise die Geburtswehen; die Wendung gibt den Geburtsvorgang natürlich wieder.
- source_word: אַיָּלוֹת
  choice: die Hirschkühe
  rationale: Das feminine Substantiv bezeichnet weibliche Hirsche. „Hirschkühe“ wahrt die Geschlechtsangabe deutlicher als das allgemeinere „Hirsche“.
- source_word: תִּשְׁמֹר
  choice: Beobachtest du
  rationale: שׁמר kann „bewachen“, „hüten“ oder „beobachten“ bedeuten. Im parallelen Zusammenhang mit dem Wissen um den Geburtszeitpunkt ist „beobachten“ sachlich und vermeidet die zusätzliche Vorstellung fürsorglichen Beschützens.
theological_decisions:
- issue: Bedeutungsumfang von תִּשְׁמֹר im Blick auf Gottes Verhältnis zur Tierwelt
  choice: Beobachtest du
  alternative: Wachst du über
  rationale: Der hebräische Ausdruck lässt sowohl aufmerksames Beobachten als auch Bewachen zu. Der Haupttext wählt die kontextuell zurückhaltendere Bedeutung; die Fußnote bewahrt die weitergehende Möglichkeit, ohne eine besondere Lehraussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen rhetorischen Fragen bleiben erhalten. „Hirschkühe“ ist präzise und allgemein verständlich; „bei den Wehen“ vermeidet eine unnatürlich wörtliche Wiedergabe des Sich-Windens.
