base_translation:
  language: en
  yaml_path: translation/ot/job/039/002.yaml
  text: Do you count the months they fulfill[a], and do you know the time when they give birth?
translation:
  language: de
  text: Zählst du die Monate, bis sie voll sind, und kennst du den Zeitpunkt, an dem sie gebären?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Zählst du die Monate, die sie erfüllen?« Das Hebräische verwendet ein aktives Verb; gemeint ist, dass die Monate ihrer Tragezeit voll werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּסְפֹּר
  choice: Zählst du
  rationale: Das Qal Imperfekt 2. Person maskulin Singular steht im Zusammenhang einer rhetorischen Frage. Das deutsche Präsens gibt den fortlaufenden göttlichen Fragediskurs natürlich wieder.
- source_word: יְרָחִים
  choice: die Monate
  rationale: Das Substantiv bezeichnet Monate; der bestimmte Artikel ist im Deutschen wegen des folgenden Relativsatzes idiomatisch.
- source_word: תְּמַלֶּאנָה
  choice: die sie erfüllen
  rationale: Das Piel Imperfekt 3. Person feminin Plural bezieht sich auf die zuvor genannten weiblichen Tiere. Die aktive Form des Hebräischen bleibt erhalten; gemeint ist, dass ihre Trächtigkeitsmonate das volle Maß erreichen.
- source_word: וְיָדַעְתָּ
  choice: und kennst du
  rationale: Das Qal Perfekt 2. Person maskulin Singular mit Konjunktion wird innerhalb der rhetorischen Fragenfolge präsentisch wiedergegeben. »Kennen« passt natürlich zu einem bestimmten Zeitpunkt.
- source_word: עֵת
  choice: die Zeit
  rationale: עֵת bezeichnet einen Zeitpunkt oder eine festgesetzte Zeit. »Die Zeit« ist klar und vermeidet die interpretierende Erweiterung »festgesetzte Zeit«.
- source_word: לִדְתָּנָה
  choice: wann sie gebären
  rationale: Der Infinitivus constructus von ילד mit Suffix der 3. Person feminin Plural wird idiomatisch als temporaler Nebensatz wiedergegeben und bezieht sich auf das Gebären der weiblichen Tiere.
