lexical_decisions:
- source_word: הֲתִבְטַח
  choice: Wirst du ihm vertrauen
  rationale: Das Qal-Imperfekt 2. Person Singular steht in einer rhetorischen Frage. „Vertrauen“ gibt בטח natürlich wieder; das Dativpronomen entspricht im Deutschen der üblichen Rektion des Verbs.
- source_word: כִּי רַב כֹּחוֹ
  choice: weil seine Kraft groß ist
  rationale: כִּי ist hier kausal, und רַב beschreibt das große Maß der כֹּחַ. „Kraft“ passt zum Zusammenhang körperlicher Arbeitsleistung.
- source_word: וְתַעֲזֹב אֵלָיו
  choice: und ihm … überlassen
  rationale: עזב bedeutet grundsätzlich „lassen, zurücklassen“. Mit אֵלָיו bringt „jemandem etwas überlassen“ im Deutschen sowohl das konkrete Lassen als auch das kontextuell mitschwingende Anvertrauen einer Aufgabe zum Ausdruck.
- source_word: יְגִיעֶךָ
  choice: deine Mühe
  rationale: יְגִיעַ kann die mühevolle Arbeit oder deren Ertrag bezeichnen. „Mühe“ bewahrt den unmittelbaren Arbeitsbezug; die mögliche Bedeutung „Ertrag“ wird in einer Fußnote offengehalten.
