  text: Will you trust him because his strength is great[a], and leave your labor to him?
translation:
  language: de
  text: Wirst du ihm vertrauen, weil seine Kraft groß ist, und ihm deine Mühe[a] überlassen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Ertrag“. Das hebräische Wort kann sowohl die mühevolle Arbeit als auch das bezeichnen, was sie hervorbringt.'
