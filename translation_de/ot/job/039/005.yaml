source:
  edition: WLC
  text: מִֽי שִׁלַּ֣ח פֶּ֣רֶא חָפְשִׁ֑י וּ/מֹסְר֥וֹת עָ֝ר֗וֹד מִ֣י פִתֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/005.yaml
  text: Who has let the wild donkey go free? Who has untied the bonds of the swift donkey?[a]
translation:
  language: de
  text: Wer hat den Wildesel frei laufen lassen, und wer hat die Fesseln des Wildesels gelöst?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zweite hebräische Wort für „Wildesel“ (עָרוֹד) kann auch mit „Onager“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Interrogativpronomen eröffnet in beiden Vershälften Gottes rhetorische Frage.
- source_word: שִׁלַּח
  choice: hat ... laufen lassen
  rationale: Das Piel Perfekt bezeichnet hier das Freilassen; zusammen mit חָפְשִׁי ergibt sich im Deutschen natürlich „frei laufen lassen“.
- source_word: פֶּרֶא
  choice: Wildesel
  rationale: Das Wort bezeichnet den wilden Esel; „Wildesel“ ist die klare, moderne deutsche Tierbezeichnung.
- source_word: חָפְשִׁי
  choice: frei
  rationale: Das Adjektiv beschreibt den Zustand des freigelassenen Tieres.
- source_word: וּמֹסְרוֹת
  choice: und die Fesseln
  rationale: Der Plural bezeichnet Bindungen beziehungsweise Haltevorrichtungen; „Fesseln“ bewahrt das konkrete Bild.
- source_word: עָרוֹד
  choice: Wildesel
  rationale: Das Wort bezeichnet ebenfalls einen wilden Esel, möglicherweise eine besondere Art, und steht poetisch parallel zu פֶּרֶא. Eine nicht ausdrücklich belegte Bedeutungsnuance wie „schnell“ wird nicht in den Haupttext aufgenommen.
- source_word: פִתֵּחַ
  choice: hat ... gelöst
  rationale: Bei Fesseln bedeutet das Piel Perfekt „lösen“ oder „losmachen“; „gelöst“ ist idiomatisch und präzise.
