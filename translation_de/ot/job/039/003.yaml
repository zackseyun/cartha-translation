  yaml_path: translation/ot/job/039/003.yaml
  text: They crouch down[a], they bring forth their young[b]; they cast off their labor pains.
translation:
  language: de
  text: Sie kauern sich nieder[a] und bringen ihre Jungen zur Welt; sie werden ihre Geburtswehen los.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie sinken nieder“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Sie schicken ihre Geburtswehen fort.“'
    reason: literal_rendering
lexical_decisions:
- source_word: תִּכְרַעְנָה
  choice: sie kauern sich nieder
  rationale: Das Verb כרע bezeichnet hier das körperliche Niedersinken der Tiere beim Gebären. „Sich niederkauern“ ist im Deutschen natürlich und wahrt das konkrete Bild; „niederknien“ wäre bei Tieren weniger passend.
- source_word: יַלְדֵיהֶן
  choice: ihre Jungen
  rationale: Die Form bezeichnet das Geborene beziehungsweise den Nachwuchs. Im Tierkontext ist „ihre Jungen“ die idiomatische und präzise Wiedergabe.
- source_word: תְּפַלַּחְנָה
  choice: bringen … zur Welt
  rationale: Im Geburtszusammenhang bezeichnet das Verb das Hervorbringen der Jungen. „Zur Welt bringen“ ist klares, gegenwärtiges Deutsch und behält den poetischen Parallelismus bei.
- source_word: חֶבְלֵיהֶם
  choice: ihre Geburtswehen
  rationale: חבלים bezeichnet in diesem Kontext die mit der Geburt verbundenen Wehen. Die pronominale Form steht im masoretischen Text formal maskulin, bezieht sich dem Zusammenhang nach jedoch auf die weiblichen Tiere; Deutsch gibt dies natürlich mit „ihre“ wieder.
- source_word: תְּשַׁלַּחְנָה
  choice: sie werden … los
  rationale: שלח bedeutet grundsätzlich „senden, fortlassen, freigeben“. Im Zusammenhang beschreibt es, dass die Tiere nach der Geburt von den Wehen frei werden. „Loswerden“ gibt diesen Sinn natürlich wieder, während die Fußnote die wörtlichere Bildsprache bewahrt.
