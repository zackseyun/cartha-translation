source:
  edition: WLC
  text: הֲ/תַאֲמִ֣ין בּ֭/וֹ כִּי ישוב זַרְעֶ֑/ךָ וְֽ/גָרְנְ/ךָ֥ יֶאֱסֹֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/012.yaml
  text: Will you trust him that he will bring back your seed and gather it to your threshing floor?[a]
translation:
  language: de
  text: Vertraust du ihm, dass er deine Saat zurückbringt und sie auf deiner Tenne sammelt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »deine Saat«; im Zusammenhang ist wahrscheinlich das Erntegut gemeint, das vom Feld zur Tenne gebracht wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַאֲמִין
  choice: Vertraust du
  rationale: Das Hifil von אמן bezeichnet hier das praktische Vertrauen darauf, dass der Wildstier die erwartete Arbeit verrichtet.
- source_word: בּוֹ
  choice: ihm
  rationale: Das maskuline Singularsuffix bezieht sich auf den zuvor genannten Wildstier; das Pronomen bewahrt diesen Bezug.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt des Vertrauens ein.
- source_word: יָשׁוּב
  choice: zurückbringt
  rationale: שׁוב bedeutet grundsätzlich »zurückkehren«; mit einem Objekt ist hier im landwirtschaftlichen Zusammenhang ein Zurückbringen gemeint.
- source_word: זַרְעֶךָ
  choice: deine Saat
  rationale: זֶרַע bezeichnet wörtlich Samen beziehungsweise Saat und kann hier metonymisch das daraus hervorgegangene Erntegut meinen. »Saat« bewahrt die Wortnähe und die kontextuelle Offenheit.
- source_word: גָרְנְךָ
  choice: deiner Tenne
  rationale: גֹּרֶן ist der Dreschplatz beziehungsweise die Tenne, nicht eine Scheune oder ein Speicher.
- source_word: יֶאֱסֹף
  choice: sie ... sammelt
  rationale: אָסַף bedeutet sammeln oder zusammenbringen. Das ergänzte Pronomen nimmt die feminine deutsche Bezeichnung »Saat« auf.
