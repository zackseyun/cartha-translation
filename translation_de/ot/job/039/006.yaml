  text: to whom I have given the desert for his house[a], and the salt land for his dwelling place[c][b],
translation:
  language: de
  text: 'dem ich die Steppe zu seinem Haus bestimmt habe[a]

    und das Salzland zu seinen Wohnstätten[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Wüste« beziehungsweise »das Ödland« (עֲרָבָה).'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen der Plural: »seine Wohnstätten«. Dieser wurde im Text beibehalten; möglich ist auch die zusammenfassende Wiedergabe »seinen Wohnort«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: dem
  rationale: Das Relativpronomen bezieht sich auf den Wildesel im vorigen Vers; der Dativ ergibt sich im Deutschen natürlich aus der Konstruktion »jemandem etwas geben«.
- source_word: שַׂמְתִּי
  choice: ich ... gegeben habe
  rationale: שׂוּם bedeutet grundsätzlich »setzen, stellen, bestimmen«; mit den Bezeichnungen für Lebensraum drückt es hier aus, dass Gott dem Tier dieses Gebiet als Heimat zugewiesen hat. »gegeben« ist natürlich und bleibt nahe am Sinn.
- source_word: עֲרָבָה
  choice: die Steppe
  rationale: עֲרָבָה bezeichnet trockenes, weithin offenes Steppen- oder Wüstenland. »Steppe« gibt den Lebensraum präzise wieder, ohne hier unnötig den geografischen Eigennamen »Araba« anzunehmen.
- source_word: בֵיתוֹ
  choice: zum Haus
  rationale: Die wörtliche Metapher »sein Haus« bleibt erhalten. »zum« ergänzt im Deutschen die im Hebräischen nur durch die Wortfügung ausgedrückte Beziehung.
- source_word: וּמִשְׁכְּנוֹתָיו
  choice: zu seinen Wohnstätten
  rationale: Der hebräische Plural wird bewahrt. »Wohnstätten« ist gehoben, aber allgemein verständlich und passt zum poetischen Parallelismus mit »Haus«.
- source_word: מְלֵחָה
  choice: das Salzland
  rationale: מְלֵחָה bezeichnet salzhaltiges, unfruchtbares Gelände. »Salzland« bewahrt das Landschaftsbild, ohne es enger als konkrete Salzfläche festzulegen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Sprache. Der Parallelismus »Haus / Wohnstätten« und der hebräische Plural wurden bewahrt. »Steppe« und »Salzland« vermitteln die karge Landschaft präzise und verständlich.
