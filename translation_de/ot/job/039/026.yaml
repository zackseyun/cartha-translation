base_translation:
  language: en
  yaml_path: translation/ot/job/039/026.yaml
  text: Is it by your understanding that the hawk soars[a], spreading its wings toward the south?
translation:
  language: de
  text: Ist es deiner Einsicht zu verdanken, dass der Habicht sich emporschwingt[a] und seine Flügel nach Süden ausbreitet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Falke fliegt auf«; das hebräische נֵץ bezeichnet allgemein einen habicht- oder falkenartigen Greifvogel, und die genaue Flugbewegung ist nicht völlig sicher.'
    reason: Lexikalische Alternativen bei Vogelart und Flugverb.
lexical_decisions:
- source_word: הֲמִבִּינָתְךָ
  choice: Ist es deiner Einsicht zu verdanken
  rationale: Die Fragepartikel mit מִן bezeichnet hier den vermeintlichen Ursprung beziehungsweise die Ursache des Handelns. Die Formulierung gibt die rhetorische Frage natürlich wieder, ohne בִּינָה zu »Weisheit« zu verallgemeinern.
- source_word: יַאֲבֶר
  choice: sich emporschwingt
  rationale: Das Hifil von אבר bezeichnet die Flugbewegung eines Vogels, wahrscheinlich das Auffliegen oder Emporsteigen. »Sich emporschwingen« bewahrt die aufwärtsgerichtete Bildlichkeit.
- source_word: נֵץ
  choice: der Habicht
  rationale: נֵץ bezeichnet einen habicht- oder falkenartigen Greifvogel; die genaue Art ist nicht sicher. »Habicht« ist eine geläufige, hinreichend allgemeine deutsche Entsprechung.
- source_word: יִפְרֹשׂ
  choice: ausbreitet
  rationale: פרשׂ bedeutet »ausbreiten« oder »ausspannen«. Die koordinierte Verbform gibt die fortlaufende Handlung des hebräischen Textes direkt wieder.
- source_word: כְּנָפוֹ
  choice: seine Flügel
  rationale: Das hebräische Singularwort kann kollektiv für das Flügelpaar stehen. Im Deutschen ist bei einem fliegenden Vogel der Plural idiomatisch; das grammatische Maskulinum von »Habicht« verlangt »seine«.
- source_word: לְתֵימָן
  choice: nach Süden
  rationale: תֵימָן bezeichnet hier die Himmelsrichtung Süden, und לְ markiert die Richtung. »Nach Süden« ist dafür die natürliche deutsche Formulierung.
