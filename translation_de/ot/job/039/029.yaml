  text: מִ/שָּׁ֥ם חָֽפַר אֹ֑כֶל לְ֝/מֵ/רָח֗וֹק עֵינָ֥י/ו יַבִּֽיטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/029.yaml
  text: From there he spies out food[a]; his eyes look from far away.
translation:
  language: de
  text: Von dort erspäht er Nahrung; seine Augen blicken in die Ferne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשָּׁם
  choice: Von dort
  rationale: Die Ortsangabe bezeichnet den erhöhten Standort, von dem aus der Adler Ausschau hält.
- source_word: חָפַר
  choice: erspäht
  rationale: Das Verb bedeutet gewöhnlich »graben«, bezeichnet hier aber im Zusammenhang mit dem Adler das suchende Aufspüren von Nahrung. »Ers späht« gibt die aufmerksame Suche aus großer Entfernung natürlich wieder.
- source_word: אֹכֶל
  choice: Nahrung
  rationale: Das Substantiv bedeutet allgemein »Nahrung, Speise«. »Nahrung« bleibt näher am Hebräischen als das kontextuell mögliche »Beute«.
- source_word: לְמֵרָחוֹק
  choice: in die Ferne
  rationale: Die Wendung bezeichnet eine große Entfernung und verbindet sich im Deutschen natürlich mit »blicken«.
- source_word: עֵינָיו יַבִּיטוּ
  choice: seine Augen blicken
  rationale: Die konkrete Bildsprache und die Übereinstimmung des pluralischen Verbs mit »Augen« werden bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität der beiden Satzhälften und das konkrete Bild des scharfen Fernblicks bleiben erhalten.
