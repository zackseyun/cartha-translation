  text: When she lifts herself up on high[b][a], she laughs at the horse and its rider.
translation:
  language: de
  text: Wenn sie sich in die Höhe erhebt[a], lacht sie über Pferd und Reiter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn sie ihre Flügel in die Höhe schlägt« oder »wenn sie sich hoch aufrichtet«. Das hebräische Verb bezeichnet wahrscheinlich eine Aufwärtsbewegung; die genaue Nuance ist umstritten.'
