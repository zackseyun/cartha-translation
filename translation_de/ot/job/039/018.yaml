  register: Moderne, verständliche und zugleich poetisch-würdevolle Sprache. »Sich in die Höhe schwingen« lässt die zoologisch und lexikalisch umstrittene Art der Aufwärtsbewegung bewusst offen; »Pferd und Reiter« ist eine natürliche generische Paarformel.
