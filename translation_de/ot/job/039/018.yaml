    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת
  choice: Sobald
  rationale: Die Verbindung leitet den Zeitpunkt beziehungsweise die Situation der folgenden Handlung ein. »Sobald« ist im Deutschen natürlich und gibt den dynamischen Übergang wieder.
- source_word: בַּמָּרוֹם תַּמְרִיא
  choice: sie sich in die Höhe schwingt
  rationale: Die Form bezeichnet ein Sich-Erheben beziehungsweise Emporschwingen. Die Wendung bewahrt das poetische Bild, ohne zu behaupten, der Strauß fliege oder schwebe tatsächlich.
- source_word: תִּשְׂחַק
  choice: lacht sie über
  rationale: שׂחק kann sowohl »lachen« als auch »verspotten« ausdrücken. »Über … lachen« erhält das konkrete Bild und lässt den spöttischen Unterton erkennen.
- source_word: לַסּוּס וּלְרֹכְבוֹ
  choice: über Pferd und Reiter
  rationale: Der hebräische bestimmte/generische Singular bezeichnet Pferd und den zu ihm gehörenden Reiter. Die feste deutsche Paarformel ist knapp, idiomatisch und bewahrt den generischen Sinn.
