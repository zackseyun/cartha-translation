  text: הִקְשִׁ֣יחַ בָּנֶ֣י/הָ לְּ/לֹא לָ֑/הּ לְ/רִ֖יק יְגִיעָ֣/הּ בְּלִי פָֽחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/016.yaml
  text: She treats her young harshly[a], as if they were not hers; her labor is in vain, without fear.
translation:
  language: de
  text: Sie behandelt ihre Jungen hart[a], als wären sie nicht ihre eigenen; ihre Mühe ist vergeblich, ohne dass sie sich fürchtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie macht ihre Jungen hart gegen sich, als gehörten sie nicht zu ihr.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשִׁיחַ
  choice: behandelt ... hart
  rationale: Das Hifil von קשׁח bezeichnet ein Hartmachen oder ein hartes Verhalten. Im Zusammenhang mit dem Strauß ist die idiomatische Wiedergabe „behandelt ... hart“ verständlich und bewahrt den Sinn.
- source_word: בָּנֶיהָ
  choice: ihre Jungen
  rationale: Wörtlich steht „ihre Söhne/Kinder“; bei einem Tier ist „ihre Jungen“ die natürliche deutsche Entsprechung.
- source_word: לְלֹא לָהּ
  choice: als wären sie nicht ihre eigenen
  rationale: Die knappe Wendung bedeutet wörtlich etwa „als nicht ihr/zu ihr gehörig“. Die gewählte Formulierung gibt den vergleichenden Sinn in natürlichem Deutsch wieder.
- source_word: לְרִיק
  choice: vergeblich
  rationale: „Vergeblich“ ist eine knappe und geläufige Entsprechung für ריק im Sinn erfolgloser oder nutzloser Mühe.
- source_word: יְגִיעָהּ
  choice: ihre Mühe
  rationale: Das Wort bezeichnet ihre Anstrengung oder Mühsal. „Mühe“ passt zum Zusammenhang, ohne die Bedeutung unnötig auf Geburtsarbeit einzuengen.
- source_word: בְּלִי פָחַד
  choice: doch sie fürchtet sich nicht
  rationale: Die Wendung lautet wörtlich „ohne Furcht“. Als adverbialer Abschluss kann sie natürlich als „doch sie fürchtet sich nicht“ wiedergegeben werden; das „doch“ verdeutlicht den syntaktischen Anschluss, ohne die Furcht näher zu bestimmen.
theological_decisions: []
