lexical_decisions:
- source_word: וְהוֹחַלְתִּי
  choice: Und ich wartete
  rationale: Die Hifil-Form von יחל kann erwartungsvolles Hoffen oder Warten bezeichnen. Im Zusammenhang wartet Elihu darauf, dass die Älteren weiterreden; daher passt „wartete“ am besten.
- source_word: כִּי
  choice: denn
  rationale: Beide Vorkommen führen eine Begründung beziehungsweise nähere Erklärung ein. Die Wiederholung von „denn“ bewahrt die Struktur des Hebräischen und klingt im Deutschen würdig und natürlich.
- source_word: לֹא יְדַבֵּרוּ
  choice: sie redeten nicht
  rationale: Das Imperfekt bezeichnet hier im erzählenden Rückblick das Ausbleiben ihrer Rede. „Sie redeten nicht“ gibt dies knapp und idiomatisch wieder.
- source_word: עָמְדוּ
  choice: sie waren verstummt
  rationale: Wörtlich bedeutet das Verb „sie standen“; im Kontext bezeichnet es offenbar, dass die Männer mit dem Reden aufgehört hatten. „Sie waren verstummt“ macht diesen kontextuellen Sinn deutlich, während die wörtliche Bildsprache in einer Fußnote erhalten bleibt.
- source_word: לֹא עָנוּ עוֹד
  choice: antworteten nicht mehr
  rationale: ענה mit עוד und Verneinung bezeichnet, dass keine weitere Antwort erfolgte. „Antworteten nicht mehr“ ist modernes, genaues Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in einem natürlichen, würdigen Erzählton. Die zweimalige Begründung mit כִּי wird durch die Wiederholung von „denn“ sichtbar gehalten; die ungewöhnliche wörtliche Wendung „sie standen“ wird verständlich im Haupttext und transparent in der Fußnote wiedergegeben.
