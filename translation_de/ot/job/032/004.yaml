  yaml_path: translation/ot/job/032/004.yaml
  text: Elihu had waited to speak to Job[b][a], because they were older than he in days.
translation:
  language: de
  text: Elihu hatte damit gewartet, zu Hiob zu sprechen,[a] denn sie waren älter als er.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Elihu wartete Hiob gegenüber mit Worten“; gemeint ist, dass er mit dem Reden zu Hiob wartete.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „denn sie waren älter als er an Tagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִיהוּ
  choice: Elihu aber
  rationale: Das Waw führt die Erzählung weiter und markiert zugleich den Wechsel zu Elihu; „aber“ gibt den leichten Kontrast im Deutschen natürlich wieder, ohne ein zeitliches „nun“ einzuführen.
- source_word: חִכָּה
  choice: hatte gewartet
  rationale: Das Verb bedeutet „warten“. Das Plusquamperfekt kennzeichnet den rückblickenden Hintergrund vor Elihus anschließendem Eingreifen.
- source_word: אֶת אִיּוֹב בִּדְבָרִים
  choice: bevor er zu Hiob sprach
  rationale: Wörtlich steht eine ungewöhnliche Verbindung etwa im Sinn von „Hiob mit Worten abwarten“. Im Zusammenhang bezeichnet sie Elihus Warten mit dem Reden zu Hiob; die deutsche Nebensatzform gibt diesen Sinn verständlich wieder.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet, weshalb Elihu gewartet hatte.
- source_word: זְקֵנִים הֵמָּה מִמֶּנּוּ לְיָמִים
  choice: sie waren älter als er
  rationale: Die Vergleichskonstruktion bezeichnet höheres Lebensalter. Das wörtliche „an Tagen“ ist im modernen Deutschen unnötig sperrig und wird in der Fußnote sichtbar gehalten.
