lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungspartikel knüpft an Elihus vorausgehende Begründung an; »Darum« ist im modernen Deutsch klar und natürlich.
- source_word: אָמַרְתִּי
  choice: sage ich
  rationale: Die Perfektform kann formal »sagte ich« bedeuten, hat hier im laufenden Redekontext aber wahrscheinlich performative Gegenwartskraft.
- source_word: שִׁמְעָה לִּי
  choice: Hör mir zu
  rationale: Der Singularimperativ fordert den Angeredeten zu aufmerksamer Beachtung auf; die deutsche Wendung gibt Verb und Präposition idiomatisch wieder.
- source_word: אֲחַוֶּה
  choice: will … darlegen
  rationale: Das Verb bezeichnet das Kundtun oder Mitteilen. »Darlegen« bewahrt den gehobenen rhetorischen Ton, ohne bereits eine ausführliche Erklärung vorauszusetzen.
- source_word: דֵּעִי
  choice: mein Wissen
  rationale: Die Form bezeichnet das eigene Wissen beziehungsweise die eigene Erkenntnis; »Wissen« gibt den epistemischen Anspruch direkt wieder.
- source_word: אַף אֲנִי
  choice: Auch ich
  rationale: Die Wortgruppe fügt Elihu mit Nachdruck zu den Redenden hinzu; »Auch ich« ist prägnant und natürlich.
