  footnotes:
  - marker: a
    text: 'Oder: »Darum sagte ich: ›Hör mir zu! Auch ich will mein Wissen darlegen.‹« Die hebräische Perfektform kann als einfache Vergangenheit verstanden werden; im Zusammenhang hat sie jedoch wahrscheinlich gegenwärtige, performative Kraft.'
