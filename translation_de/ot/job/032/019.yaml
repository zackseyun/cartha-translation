translation:
  language: de
  text: Sieh, mein Bauch ist wie Wein, der keine Öffnung hat[a]; wie neue Weinschläuche droht er zu bersten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mein Bauch ist wie Wein, der nicht geöffnet wird“. „Bauch“ kann hier zugleich das Innere des Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Weinschläuche waren Behälter aus Tierhaut, in denen unter anderem Wein aufbewahrt wurde.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel leitet Elihus anschaulichen Vergleich ein. „Sieh“ bewahrt ihre hinweisende Kraft in gehobenem, aber verständlichem Deutsch.
- source_word: בִטְנִי
  choice: mein Inneres
  rationale: בטן bezeichnet wörtlich den Bauch, kann hier aber auch das Innere als Sitz aufgestauter Worte meinen. „Mein Inneres“ bewahrt die körperliche Vorstellung, ohne im Deutschen ungewollt nur den Verdauungstrakt nahezulegen.
- source_word: כְּיַיִן
  choice: wie Wein
  rationale: Die schlichte Vergleichsformulierung wird direkt wiedergegeben. Dass der Wein unter Druck steht, ergibt sich aus dem Zusammenhang; „gärend“ wird nicht ergänzt.
- source_word: לֹא יִפָּתֵחַ
  choice: der keinen Ausweg hat
  rationale: Die Form bedeutet wörtlich „der nicht geöffnet wird“. Im Bild geht es um eingeschlossenen Wein ohne Möglichkeit, Druck abzugeben; „keinen Ausweg hat“ vermittelt dies natürlich, während die wörtliche Alternative in der Fußnote erhalten bleibt.
- source_word: כְּאֹבוֹת חֲדָשִׁים
  choice: wie neue Weinschläuche
  rationale: אֹבוֹת bezeichnet hier Behälter aus Tierhaut. Die Verbindung mit Wein macht „Weinschläuche“ eindeutig; חֲדָשִׁים wird direkt mit „neue“ wiedergegeben.
- source_word: יִבָּקֵעַ
  choice: droht es zu bersten
  rationale: בקע bedeutet aufspalten oder aufbersten. „Droht ... zu bersten“ gibt den unmittelbar bevorstehenden Bruch und den Druck des Vergleichs idiomatisch wieder.
