  yaml_path: translation/ot/job/032/013.yaml
  text: Lest you say[a], ‘We have found wisdom; God will vanquish him, not man.’
translation:
  language: de
  text: 'Damit ihr nicht sagt[a]: »Wir haben Weisheit gefunden; Gott wird ihn vertreiben, kein Mensch.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Damit ihr nicht sagt: ›Wir haben Weisheit gefunden; Gott wird ihm antworten, kein Mensch‹«; beziehungsweise: »Gott kann ihn überwinden, kein Mensch.« Das hebräische Verb bedeutet gewöhnlich »forttreiben« oder »verjagen«, kann hier aber weiter gefasst das Überwinden oder Widerlegen Hiobs bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Damit … nicht
  rationale: Leitet die Warnung vor einer möglichen Behauptung ein und gibt die abwehrende Funktion im Deutschen natürlich wieder.
- source_word: תֹּאמְרוּ
  choice: ihr sagt
  rationale: Die 2. Person Maskulin Plural bezeichnet die angesprochenen Freunde; im deutschen Nebensatz ist Präsens idiomatisch.
- source_word: מָצָאנוּ
  choice: wir haben … gefunden
  rationale: Das Perfekt bezeichnet den als erreicht behaupteten Erkenntnisgewinn.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Entspricht der üblichen und kontextuell angemessenen Bedeutung.
- source_word: אֵל
  choice: Gott
  rationale: Bezeichnet hier im ausdrücklichen Gegensatz zu einem Menschen Gott.
- source_word: יִדְּפֶנּוּ
  choice: wird ihn vertreiben
  rationale: Bewahrt die konkrete Grundbedeutung von נדף, jemanden fortzutreiben oder zu verjagen. Der Kontext kann zugleich ein Widerlegen oder Überwinden Hiobs meinen; diese Mehrdeutigkeit wird in der Fußnote offengehalten.
- source_word: לֹא אִישׁ
  choice: nicht ein Mensch
  rationale: Gibt den generischen Gegensatz zwischen Gott und einem menschlichen Handelnden im heutigen Deutschen klar wieder.
theological_decisions:
- issue: Generisches אִישׁ im Gegensatz zu Gott
  choice: ein Mensch
  alternative: ein Mann
  rationale: Gemeint ist ein menschlicher Handelnder im Gegensatz zu Gott, nicht eigens eine männliche Person.
- issue: Deutung von אֵל יִדְּפֶנּוּ לֹא אִישׁ
  choice: Gott wird ihn vertreiben, nicht ein Mensch
  alternative: Gott wird ihm antworten, nicht ein Mensch; Gott wird ihn überwinden, nicht ein Mensch
  rationale: Die Hauptfassung hält an der konkreten lexikalischen Bildsprache fest, ohne die kontextuell möglichen Bedeutungen des Widerlegens oder Überwindens auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nahe am poetischen Hebräisch; »Damit … nicht« ist natürlicher als das altertümliche »Auf dass nicht«.
