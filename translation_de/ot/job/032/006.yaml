  text: וַ/יַּ֤עַן אֱלִיה֖וּא בֶן בַּֽרַכְאֵ֥ל הַ/בּוּזִ֗י וַ/יֹּ֫אמַ֥ר צָ֘עִ֤יר אֲנִ֣י לְ֭/יָמִים וְ/אַתֶּ֣ם יְשִׁישִׁ֑ים עַל כֵּ֖ן זָחַ֥לְתִּי וָֽ/אִירָ֓א מֵ/חַוֺּ֖ת דֵּעִ֣/י אֶתְ/כֶֽם׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/006.yaml
  text: Then Elihu son of Barakel the Buzite answered and said[a], “I am young in days, and you are aged[b]; therefore I was timid and afraid to declare my knowledge to you.
translation:
  language: de
  text: 'Da antwortete Elihu, der Sohn Barakels, der Busiter, und sagte: »Ich bin jung an Jahren[a], ihr aber seid hochbetagt. Darum hielt ich mich zurück[b] und fürchtete mich, euch mein Wissen darzulegen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jung an Tagen“; gemeint ist: vergleichsweise jung.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „Darum war ich scheu“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: antwortete ... und sagte
  rationale: Die zweigliedrige hebräische Redeeinleitung wird bewahrt; „antwortete“ bezeichnet hier eine Reaktion im Gespräch, ohne eine unmittelbar vorausgehende Frage vorauszusetzen.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל הַבּוּזִי
  choice: Elihu, der Sohn Barakels, der Busiter
  rationale: Die Eigennamen werden in einer im Deutschen gut lesbaren Transliteration wiedergegeben; „Busiter“ bezeichnet die Herkunft beziehungsweise Gruppenzugehörigkeit.
- source_word: צָעִיר אֲנִי לְיָמִים
  choice: Ich bin jung an Jahren
  rationale: Die deutsche Wendung erhält das Bild des hebräischen Ausdrucks „jung an Tagen“, klingt jedoch natürlich und macht den Altersvergleich verständlich.
- source_word: יְשִׁישִׁים
  choice: hochbetagt
  rationale: Das Wort bezeichnet ein weit fortgeschrittenes Alter; „hochbetagt“ ist respektvoll und passt zu Elihus höflicher Anrede.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Kennzeichnet knapp und natürlich die Folgerung aus dem Altersunterschied.
- source_word: זָחַלְתִּי
  choice: hielt ich mich zurück
  rationale: Das seltene Verb beschreibt ein scheues Zurückweichen oder Zögern. Die Formulierung gibt hier Elihus Zurückhaltung vor den Älteren wieder.
- source_word: וָאִירָא
  choice: und fürchtete mich
  rationale: Bewahrt neben dem vorausgehenden Zurückhalten den eigenen Ausdruck für Furcht und damit die zweifache Beschreibung seiner Hemmung.
- source_word: מֵחַוֺּת דֵּעִי אֶתְכֶם
  choice: euch mein Wissen darzulegen
  rationale: חוה bezeichnet das Mitteilen oder Darlegen; דֵּעִי wird als „mein Wissen“ wiedergegeben, ohne es abschwächend auf eine bloße Meinung festzulegen.
