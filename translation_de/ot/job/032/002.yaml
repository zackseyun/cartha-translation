source:
  edition: WLC
  text: וַ/יִּ֤חַר אַ֨ף אֱלִיה֣וּא בֶן בַּרַכְאֵ֣ל הַ/בּוּזִי֮ מִ/מִּשְׁפַּ֪חַ֫ת רָ֥ם בְּ֭/אִיּוֹב חָרָ֣ה אַפּ֑/וֹ עַֽל צַדְּק֥/וֹ נַ֝פְשׁ֗/וֹ מֵ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/002.yaml
  text: Then Elihu son of Barakel the Buzite[a], from the family of Ram, burned with anger against Job; his anger burned because he justified himself rather than God.
translation:
  language: de
  text: Da entbrannte Elihus Zorn gegen Hiob, des Sohnes Barachels, des Busiters aus der Sippe Rams. Sein Zorn entbrannte, weil Hiob sich selbst statt Gott Recht gab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil er sich für gerechter hielt als Gott“.'
    reason: Alternative Wiedergabe der schwierigen vergleichenden Wendung מֵאֱלֹהִים.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Da entbrannte der Zorn
  rationale: Die Wendung bezeichnet aufflammenden Zorn. „Der Zorn entbrannte“ bewahrt das hebräische Bild und klingt im Deutschen würdig und verständlich.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל
  choice: Elihus, des Sohnes Barachels
  rationale: Die Namen werden nach gebräuchlicher deutscher Bibeltradition wiedergegeben; das Abstammungsverhältnis bleibt ausdrücklich erhalten.
- source_word: הַבּוּזִי
  choice: des Busiters
  rationale: Das Ethnikon mit Artikel bezeichnet Elihu als Angehörigen der Busiter.
- source_word: מִמִּשְׁפַּחַת רָם
  choice: aus der Sippe Ram
  rationale: מִשְׁפָּחָה bezeichnet hier eine größere Familien- oder Sippengruppe; „Sippe“ unterscheidet sie klar von der unmittelbaren Abstammungsangabe.
- source_word: בְּאִיּוֹב
  choice: gegen Hiob
  rationale: Bei einem Verb des Zorns kennzeichnet ב die Person, gegen die sich der Zorn richtet.
- source_word: חָרָה אַפּוֹ
  choice: Sein Zorn entbrannte
  rationale: Die Wiederholung des hebräischen Zornmotivs wird zur Betonung auch im Deutschen beibehalten.
- source_word: עַל
  choice: weil
  rationale: Die Präposition leitet hier den Grund für Elihus Zorn ein.
- source_word: צַדְּקוֹ נַפְשׁוֹ
  choice: sich selbst für gerecht erklärte
  rationale: Die Verbform hat einen rechtfertigenden beziehungsweise für gerecht erklärenden Sinn; נַפְשׁוֹ wird in dieser Verbindung reflexiv als „sich selbst“ verstanden.
- source_word: מֵאֱלֹהִים
  choice: statt Gott
  rationale: 'Das מִן trägt hier wahrscheinlich vergleichend-kontrastive Kraft: Hiobs Selbstrechtfertigung geschieht gegenüber beziehungsweise auf Kosten der Rechtfertigung Gottes. „Statt Gott“ bewahrt diesen Kontrast knapp.'
theological_decisions:
- issue: Deutung von עַל צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים
  choice: weil Hiob sich selbst für gerecht erklärte statt Gott
  alternative: weil er sich für gerechter hielt als Gott
  rationale: Die Hauptfassung wahrt den forensischen Sinn des Verbs und den Kontrast zu Gott, ohne ausdrücklich eine abstrakte Behauptung moralischer Überlegenheit zuzuschreiben. Die stärkere komparative Deutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Zornesformel des Hebräischen bleibt als bewusste Wiederholung erhalten; „Sippe“ gibt die soziale Gruppierung präziser wieder als das mehrdeutige „Familie“.
