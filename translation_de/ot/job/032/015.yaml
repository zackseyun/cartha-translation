  yaml_path: translation/ot/job/032/015.yaml
  text: They are dismayed[a]; they answer no more[b]; words have departed from them.
translation:
  language: de
  text: Sie sind bestürzt[a], sie antworten nicht mehr; die Worte sind ihnen entwichen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie sind erschüttert“ bzw. „Sie sind wie zerschmettert“. Das hebräische Verb kann ein Zerbrechen, Erschrecken oder Bestürztsein bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Die Worte sind von ihnen gewichen“ – ein Bild dafür, dass sie nichts mehr zu sagen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַתּוּ
  choice: Sie sind bestürzt
  rationale: Das Verb חתת kann ein Zerbrechen, Erschrecken oder Bestürztsein bezeichnen. Im Zusammenhang beschreibt es, wie Hiobs Freunde verstummt sind; „bestürzt“ gibt diesen inneren und rhetorischen Zusammenbruch natürlich wieder, ohne das Bild unnötig zu verhärten.
- source_word: עָנוּ
  choice: sie antworten
  rationale: ענה bezeichnet hier das Antworten oder Erwيدern im Streitgespräch. „Antworten“ passt zum Kontext.
- source_word: לֹא ... עוֹד
  choice: nicht mehr
  rationale: עוֹד bezeichnet mit der Verneinung eine nun beendete Fortdauer; „nicht mehr“ ist knapp und idiomatisch.
- source_word: הֶעְתִּיקוּ
  choice: sind ... entwichen
  rationale: Die Hifil-Form von עתק kann „wegbewegen“, „entfernen“ oder „weichen lassen“ bedeuten. Mit „Worte“ als Subjekt und מֵהֶם als Trennungsangabe bewahrt „sind ihnen entwichen“ die anschauliche Personifikation.
- source_word: מֵהֶם
  choice: ihnen ... entwichen
  rationale: Die Präposition bezeichnet die Trennung von den Betroffenen. Die deutsche Dativkonstruktion mit „entweichen“ gibt „von ihnen“ idiomatisch wieder.
- source_word: מִלִּים
  choice: die Worte
  rationale: Die Grundbedeutung ist „Worte“. Das bewahrt das hebräische Bild, statt es als „sie haben nichts mehr zu sagen“ aufzulösen.
theological_decisions: []
