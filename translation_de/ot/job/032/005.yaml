base_translation:
  language: en
  yaml_path: translation/ot/job/032/005.yaml
  text: When Elihu saw that there was no answer in the mouth of the three men[a], his anger burned.
translation:
  language: de
  text: Als Elihu sah, dass die drei Männer keine Antwort hatten, entbrannte sein Zorn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Als … sah
  rationale: Das Waw-Consecutivum führt die Erzählung weiter; mit „Als“ wird zugleich der zeitliche Zusammenhang mit Elihus anschließender Reaktion natürlich wiedergegeben.
- source_word: אֱלִיהוּא
  choice: Elihu
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Elihu wahrnahm.
- source_word: אֵין מַעֲנֶה
  choice: keine Antwort mehr wussten
  rationale: Die existentielle Verneinung und „Antwort“ werden im Kontext eines verstummten Streitgesprächs idiomatisch wiedergegeben. „Mehr“ ist kontextuell erschlossen und verdeutlicht, dass die Männer zuvor gesprochen hatten, nun aber keine Erwiderung fanden.
- source_word: בְּפִי
  choice: wussten
  rationale: Die hebräische Wendung „im Mund“ bezeichnet hier, dass die Männer keine Erwiderung vorzubringen hatten. Eine wörtliche Wiedergabe wäre im heutigen Deutschen unnatürlich; die Bedeutung wird daher idiomatisch ausgedrückt.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים
  choice: die drei Männer
  rationale: Direkte und natürliche Wiedergabe der hebräischen Nominalgruppe.
- source_word: וַיִּחַר אַפּוֹ
  choice: entbrannte sein Zorn
  rationale: Die Formulierung bewahrt das hebräische Bild eines aufflammenden Zorns und klingt zugleich würdig und verständlich.
theological_decisions: []
translation_notes:
