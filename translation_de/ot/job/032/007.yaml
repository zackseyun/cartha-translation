  text: אָ֭מַרְתִּי יָמִ֣ים יְדַבֵּ֑רוּ וְ/רֹ֥ב שָׁ֝נִ֗ים יֹדִ֥יעוּ חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/007.yaml
  text: I said[a], ‘Days should speak, and many years should make wisdom known.’
translation:
  language: de
  text: 'Ich sagte[a]: »Die Tage sollen reden, und die vielen Jahre sollen Weisheit erkennen lassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich dachte: Das Alter soll reden, und die vielen Jahre sollen Weisheit erkennen lassen.“ Im Hebräischen stehen „Tage“ und „viele Jahre“ sinnbildlich für hohes Alter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Ich sagte
  rationale: Das Qal Perfekt 1. Person Singular von אמר bedeutet unmittelbar „ich sagte“. Im Zusammenhang kann es auch Elihus bisherigen Gedanken oder seine Erwartung einleiten; diese Möglichkeit wird in der Fußnote genannt.
- source_word: יָמִים
  choice: die Tage
  rationale: 'Die wörtliche Wiedergabe bewahrt die poetische Metonymie und Personifikation: „Tage“ stehen für hohes Alter beziehungsweise ältere Menschen.'
- source_word: יְדַבֵּרוּ
  choice: sollen reden
  rationale: Das Imperfekt bezeichnet hier am ehesten eine erwartete oder als angemessen betrachtete Handlung. „Sollen reden“ gibt diese Nuance wieder, ohne daraus eine bloße Zukunftsaussage zu machen.
- source_word: וְרֹב שָׁנִים
  choice: die vielen Jahre
  rationale: Die Formulierung gibt die „Fülle/Vielzahl von Jahren“ natürlich wieder und hält den poetischen Parallelismus zu „den Tagen“ aufrecht.
- source_word: יֹדִיעוּ
  choice: sollen … kundtun
  rationale: Das Hiphil von ידע bedeutet „wissen lassen, bekannt machen“. „Kundtun“ bewahrt den kausativen Sinn und passt zum gehobenen poetischen Register.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Das abstrakte Substantiv wird direkt wiedergegeben und bewahrt das zentrale Weisheitsmotiv des Buches.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Personifikation. „Kundtun“ ist leicht gehoben, aber allgemein verständlich und bildet den kausativen Sinn präziser ab als das enger deutende „lehren“.
