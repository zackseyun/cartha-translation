  text: אָ֭כֵן רֽוּחַ הִ֣יא בֶ/אֱנ֑וֹשׁ וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּבִינֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/008.yaml
  text: But there is a spirit in man[a], and the breath of the Almighty gives them understanding.
translation:
  language: de
  text: Doch im Menschen ist ein Geist[a], und der Atem des Allmächtigen gibt ihnen Einsicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gewiss, in einem Menschen ist ein Geist, und der Atem des Allmächtigen gibt ihm Einsicht.“ Im Hebräischen folgt auf den Singular „Mensch“ am Verb ein pluralisches Objektsuffix („ihnen“).'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  choice: Doch
  rationale: Markiert im Zusammenhang Elihus einen korrigierenden, nachdrücklichen Gegensatz; „Doch“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: רוּחַ
  choice: Geist
  rationale: Bezeichnet hier den Geist im Menschen und bleibt bewusst von נְשָׁמָה, „Atem“, unterschieden.
- source_word: הִיא
  choice: ist
  rationale: Die hebräische Nominalkonstruktion wird idiomatisch als „im Menschen ist ein Geist“ wiedergegeben, ohne sie in eine hervorgehobene Spaltkonstruktion umzudeuten.
- source_word: בֶאֱנוֹשׁ
  choice: im Menschen
  rationale: אֱנוֹשׁ bezeichnet den sterblichen Menschen; der deutsche Singular kann hier allgemein und repräsentativ verstanden werden.
- source_word: וְנִשְׁמַת
  choice: und der Atem des
  rationale: „Atem“ ist die naheliegende Bedeutung und bewahrt die begriffliche Unterscheidung gegenüber רוּחַ, „Geist“.
- source_word: שַׁדַּי
  choice: des Allmächtigen
  rationale: Das Gottesprädikat שַׁדַּי wird mit der im Deutschen geläufigen Bedeutungswiedergabe übersetzt.
- source_word: תְּבִינֵם
  choice: gibt ihnen Einsicht
  rationale: Die Hifil-Form von בין drückt das Verleihen von Verständnis oder Einsicht aus; „ihnen“ bewahrt den maskulinen Pluralsuffix des Hebräischen.
theological_decisions:
- issue: Anthropologische Aussage und Numeruswechsel
  choice: Der allgemeine Singular „im Menschen“ steht neben dem pluralischen „ihnen“.
  alternative: „In einem Menschen … gibt ihm Einsicht“ oder geglättet „in den Menschen … gibt ihnen Einsicht“.
  rationale: Der hebräische Text wechselt vom generischen Singular אֱנוֹשׁ zum pluralischen Objektsuffix in תְּבִינֵם. Die Übersetzung bewahrt diese Spannung, statt den Numerus anzugleichen.
- issue: Verhältnis von menschlichem Geist und göttlichem Atem
  choice: Beide Ausdrücke werden durch „und“ parallel verbunden.
  alternative: 'Eine identifizierende Hervorhebung: „Es ist der Geist im Menschen, der Atem des Allmächtigen, der …“.'
  rationale: Die hebräische Satzfolge lässt die beiden Glieder nebeneinanderstehen. Eine deutsche Spaltkonstruktion könnte sie stärker gleichsetzen, als der Wortlaut eindeutig verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einsicht“ gibt den kognitiven Sinn prägnant wieder; der auffällige Wechsel von Singular zu Plural bleibt im Haupttext erhalten.
