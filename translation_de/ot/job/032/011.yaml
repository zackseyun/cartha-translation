  text: Look[a], I waited for your words; I listened to your insights[c][b], until you searched out words.
translation:
  language: de
  text: Siehe, ich wartete auf eure Worte; ich hörte euren Überlegungen zu, bis ihr nach Worten suchtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „bis ihr Worte erforschtet“ oder „bis ihr nach Worten suchtet“. Die knappe hebräische Wendung kann das Suchen nach einer passenden Antwort oder Formulierung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel hebt Elihus Aussage hervor. „Siehe“ bewahrt diese Funktion in knapper, würdevoller Form, ohne so altertümlich wie „Fürwahr“ zu wirken.
- source_word: הוֹחַלְתִּי
  choice: ich wartete
  rationale: יחל kann erwartungsvolles Warten oder Hoffen bezeichnen. Hier steht Elihus geduldiges Zurückhalten beim Reden im Vordergrund.
- source_word: לְדִבְרֵיכֶם
  choice: auf eure Worte
  rationale: Mit „warten“ verlangt natürliches Deutsch die Verbindung „auf eure Worte“.
- source_word: אָזִין
  choice: ich hörte auf
  rationale: Das Hifil von אזן bezeichnet aufmerksames Zuhören. „Auf etwas hören“ bringt die bewusste Aufmerksamkeit knapp zum Ausdruck.
- source_word: תְּבוּנוֹתֵיכֶם
  choice: eure Einsichten
  rationale: Der Plural kann Verständnis, Einsichten oder Überlegungen bezeichnen. „Einsichten“ wahrt die Mehrzahl und passt zu den vorgetragenen Gedankengängen.
- source_word: עַד
  choice: während
  rationale: Vor dem durativen Verb des Suchens kann עַד die zeitliche Erstreckung des Zuhörens bis zum Abschluss des Vorgangs ausdrücken. Natürliches Deutsch gibt diesen begleitenden Verlauf hier am besten mit „während“ wieder, ohne die Grenzbedeutung durch eine Fußnote zu verschweigen.
- source_word: תַּחְקְרוּן
  choice: ihr nach … suchtet
  rationale: חקר bezeichnet gründliches Suchen oder Erforschen. In Verbindung mit „Worten“ ist „nach Worten suchen“ im Deutschen idiomatisch und bewahrt das Bild des Suchens.
- source_word: מִלִּין
  choice: Worten
  rationale: Das poetische, aramaisierende Pluralwort bedeutet wörtlich „Worte“. Die direkte Wiedergabe vermeidet die interpretierende Einengung auf „Argumente“ oder „Antworten“.
