  text: כִּ֤י לֹ֣א יָדַ֣עְתִּי אֲכַנֶּ֑ה כִּ֝/מְעַ֗ט יִשָּׂאֵ֥/נִי עֹשֵֽׂ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/022.yaml
  text: For I do not know how to flatter[b][a]; otherwise my Maker would soon carry me away.
translation:
  language: de
  text: Denn ich weiß nicht, wie man schmeichelt[a]; sonst würde mein Schöpfer mich schon bald hinwegnehmen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie man jemanden mit ehrenden Titeln anspricht“. Das hebräische Verb kann ein schmeichelndes oder parteiisches Anreden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „fortnehmen“. Das Hebräische sagt nicht ausdrücklich „töten“, auch wenn ein Wegnehmen im Gericht gemeint sein kann.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet Elihus zuvor erklärte Weigerung, jemanden parteiisch zu behandeln; „Denn“ gibt diese erklärende Funktion natürlich wieder.
- source_word: לֹא יָדַעְתִּי
  choice: ich weiß nicht, wie man
  rationale: In Verbindung mit dem folgenden Verb bezeichnet die Wendung fehlende Fähigkeit oder eingeübte Praxis. Das deutsche Präsens entspricht dem im Kontext gemeinten gegenwärtigen Unvermögen.
- source_word: אֲכַנֶּה
  choice: schmeichelt
  rationale: Das Piel von כנה kann hier ein schmeichelndes oder parteiisches Anreden, auch mit ehrenden Titeln, bezeichnen. „Schmeicheln“ ist knapp, verständlich und bewahrt den negativen sozialen Sinn.
- source_word: כִּמְעַט
  choice: schon bald
  rationale: Im Zusammenhang der angedrohten Folge drückt die Wendung zeitliche Nähe aus. „Schon bald“ gibt die bevorstehende Konsequenz idiomatisch wieder.
- source_word: יִשָּׂאֵנִי
  choice: würde mich hinwegnehmen
  rationale: נשא kann „heben“, „tragen“ oder „wegnehmen“ bedeuten. „Hinwegnehmen“ wahrt die Vorstellung göttlicher Entfernung im Gericht, ohne ausdrücklich „töten“ zu sagen.
- source_word: עֹשֵׂנִי
  choice: mein Schöpfer
  rationale: Das Partizip bezeichnet den, der den Sprecher gemacht hat. „Mein Schöpfer“ ist im Deutschen natürlich und bewahrt die persönliche Beziehung zwischen Geschöpf und Schöpfer.
theological_decisions:
- issue: Art der angedrohten göttlichen Handlung
  choice: „mein Schöpfer würde mich schon bald hinwegnehmen“
  alternative: „mein Schöpfer würde mich schon bald töten“ oder „mich forttragen“
  rationale: Das hebräische נשא bezeichnet nicht ausdrücklich das Töten. Eine Entfernung im Gericht, möglicherweise bis hin zum Tod, kann gemeint sein; die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Formulierung bleibt nahe an der hebräischen Bildsprache, ohne die mögliche Gerichtsaussage auf den Tod festzulegen.
