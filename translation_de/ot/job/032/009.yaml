  text: לֹֽא רַבִּ֥ים יֶחְכָּ֑מוּ וּ֝/זְקֵנִ֗ים יָבִ֥ינוּ מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/009.yaml
  text: It is not the many who are wise[a], nor the old who understand justice.
translation:
  language: de
  text: Nicht die Vielen sind weise, und nicht die Alten verstehen, was recht ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Recht“ oder „ein gerechtes Urteil“. Das hebräische Wort kann Recht, Gerechtigkeit, Urteil oder die rechte Ordnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: nicht … und nicht
  rationale: Die Verneinung gilt im parallel aufgebauten Satz beiden Aussagen; die Wiederholung im Deutschen macht dies natürlich und eindeutig.
- source_word: רַבִּים
  choice: die Vielen
  rationale: Das substantivierte Adjektiv bezeichnet eine große Zahl von Menschen. „Die Vielen“ bewahrt die allgemeine, sprichwortartige Aussage und vermeidet die hier weniger wahrscheinliche Bedeutung „die Großen“.
- source_word: יֶחְכָּמוּ
  choice: sind weise
  rationale: Die Qal-Form von חכם kann ein Weisesein oder Weisewerden ausdrücken. Im allgemeinen Aussagesatz ist „sind weise“ die natürliche Entsprechung.
- source_word: וּזְקֵנִים
  choice: die Alten
  rationale: Im Zusammenhang steht das Lebensalter im Gegensatz zu echter Einsicht. „Die Alten“ gibt diesen Sinn wieder, ohne das amtlich klingende „Älteste“ zu verwenden.
- source_word: יָבִינוּ
  choice: verstehen
  rationale: בין bezeichnet hier das Verstehen beziehungsweise Unterscheiden; „verstehen“ ist klar und wahrt den Parallelismus mit „weise sein“.
- source_word: מִשְׁפָּט
  choice: was recht ist
  rationale: מִשְׁפָּט umfasst hier Recht, gerechtes Urteil und die rechte Ordnung. „Was recht ist“ bezeichnet idiomatisch den Gegenstand sittlich-rechtlicher Einsicht, ohne den Sinn auf ein Gerichtsverfahren zu verengen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der hebräische Parallelismus wird durch „Nicht … und nicht …“ bewahrt; „die Alten“ bezieht sich auf das Alter, nicht auf ein Amt.
