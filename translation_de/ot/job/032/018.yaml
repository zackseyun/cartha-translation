  text: כִּ֭י מָלֵ֣תִי מִלִּ֑ים הֱ֝צִיקַ֗תְ/נִי ר֣וּחַ בִּטְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/018.yaml
  text: For I am full of words[a]; the spirit within me constrains me.
translation:
  language: de
  text: Denn ich bin voller Worte; der Geist in meinem Innern[a] drängt mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Geist meines Bauches“; der „Bauch“ kann im Hebräischen das Innere eines Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Elihus Begründung dafür ein, warum er nun sprechen muss, und gibt die erklärend-kausale Funktion natürlich wieder.
- source_word: מָלֵתִי מִלִּים
  choice: ich bin voll von Worten
  rationale: Bewahrt das Bild der angestauten Worte und gibt den resultierenden gegenwärtigen Zustand idiomatisch auf Deutsch wieder.
- source_word: הֱצִיקַתְנִי
  choice: drängt mich
  rationale: Das Verb bezeichnet Bedrängnis oder Druck. „Drängt mich“ wahrt das Bild inneren Drucks, ohne die ausdrückliche Bedeutung „zwingt mich“ einzutragen.
- source_word: רוּחַ
  choice: der Geist
  rationale: Bezeichnet hier den inneren Lebensgeist oder Antrieb; „Geist“ bewahrt die mögliche anthropologische Bedeutung besser als eine Festlegung auf „Atem“.
- source_word: בִּטְנִי
  choice: in meinem Innern
  rationale: Das wörtliche „mein Bauch“ bezeichnet idiomatisch das leiblich-seelische Innere. Die Übersetzung ist im modernen Deutsch verständlich; das konkrete hebräische Bild bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bezug und Bedeutung von רוּחַ
  choice: der Geist in meinem Innern
  alternative: mein innerer Antrieb / der Atem in meinem Bauch
  rationale: Der Text benennt Elihus inneren Geist, ohne ihn ausdrücklich mit Gottes Geist gleichzusetzen. Die Übersetzung bewahrt diese Offenheit und vermeidet eine theologische Vereindeutigung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und das Bild des inneren Drucks bleiben erhalten; die semantische Spannung von „Geist“, „Atem“ und innerem Antrieb wird nicht aufgelöst.
