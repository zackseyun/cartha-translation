translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »auch ich« bildet den emphatischen Parallelismus des Hebräischen ab; »meinen Teil antworten« hält die Metapher vom Anteil bewusst sichtbar.
