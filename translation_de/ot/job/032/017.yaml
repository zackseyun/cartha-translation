  yaml_path: translation/ot/job/032/017.yaml
  text: I too will answer for my part[b][a]; I too will declare my knowledge.
translation:
  language: de
  text: Auch ich will meinen Teil dazu sagen[a]; auch ich will kundtun, was ich weiß[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »meinen Anteil«; gemeint ist wahrscheinlich Elihus eigener Beitrag zur Aussprache.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »meine Erkenntnis darlegen« bzw. »mein Wissen kundtun«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַעֲנֶה
  choice: will … antworten
  rationale: Das Qal von ענה bedeutet hier im Rahmen der Redebeiträge »antworten« bzw. »erwidern«.
- source_word: אַף אֲנִי
  choice: auch ich
  rationale: Die zweimalige Wendung betont, dass Elihu nun ebenfalls das Wort ergreift; die Wiederholung bewahrt den hebräischen Parallelismus.
- source_word: חֶלְקִי
  choice: meinen Teil
  rationale: חלק bezeichnet wörtlich den »Teil« oder »Anteil« und meint hier wahrscheinlich Elihus eigenen Beitrag zur Aussprache.
- source_word: אֲחַוֶּה
  choice: kundtun
  rationale: Das Piel von חוה bedeutet »mitteilen«, »darlegen« oder »kundtun«; die gewählte Form passt zu einer feierlichen Rede, ohne altertümlich unverständlich zu sein.
- source_word: דֵעִי
  choice: was ich weiß
  rationale: דעה bezeichnet Wissen oder Erkenntnis. Die natürliche deutsche Wendung gibt den Inhalt wieder, ohne ihn zum bloßen subjektiven »Meinung« abzuschwächen.
