source:
  edition: WLC
  text: וַֽ/יִּשְׁבְּת֡וּ שְׁלֹ֤שֶׁת הָ/אֲנָשִׁ֣ים הָ֭/אֵלֶּה מֵ/עֲנ֣וֹת אֶת אִיּ֑וֹב כִּ֤י ה֖וּא צַדִּ֣יק בְּ/עֵינָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/032/001.yaml
  text: So these three men stopped answering Job[a], because he was righteous in his own eyes.
translation:
  language: de
  text: Da hörten diese drei Männer auf, Hiob zu antworten, weil er in seinen eigenen Augen[a] gerecht war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, nach einer anderen Textüberlieferung: „weil er in ihren Augen gerecht war“.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: hörten … auf
  rationale: Das Verb שׁבת bezeichnet hier das Aufhören; zusammen mit dem Infinitiv מֵעֲנוֹת ist „aufhören zu antworten“ natürliches modernes Deutsch.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: diese drei Männer
  rationale: Gibt Zahl, Demonstrativ und maskulines Bezugswort direkt und idiomatisch wieder.
- source_word: מֵעֲנוֹת אֶת אִיּוֹב
  choice: Hiob zu antworten
  rationale: ענה bedeutet im Streitgespräch „antworten“; der Objektmarker wird im Deutschen nicht eigens wiedergegeben.
- source_word: כִּי
  choice: weil
  rationale: Leitet hier den Grund dafür ein, dass die Männer nicht weiter antworteten.
- source_word: צַדִּיק
  choice: gerecht
  rationale: Bewahrt den moralisch-rechtlichen Gehalt von צַדִּיק und entspricht dem etablierten, weiterhin verständlichen biblischen Sprachgebrauch.
- source_word: בְּעֵינָיו
  choice: in seinen eigenen Augen
  rationale: Die im vorgelegten hebräischen Text stehende singularische Form wird bewahrt; „eigenen“ macht die idiomatische Bedeutung als Selbsteinschätzung deutlich, ohne sie als objektiv richtig zu bestätigen.
theological_decisions:
- issue: Ob Hiob tatsächlich gerecht war oder sich selbst dafür hielt
  choice: „in seinen eigenen Augen gerecht“
  alternative: „in ihren Augen gerecht“
  rationale: Die Form בְּעֵינָיו im vorgelegten WLC-Text trägt ein Suffix der 3. Person Singular. Die Übersetzung lässt die Spannung zwischen Hiobs Selbsteinschätzung und einem objektiven Urteil bestehen. Die abweichende Texttradition mit pluralischem Bezug wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da“ führt die Folgerung beziehungsweise den Fortgang der Erzählung knapp ein; die Satzstruktur bleibt nah am Hebräischen und zugleich natürlich verständlich.
