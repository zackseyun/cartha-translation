  language: de
  text: Ich will doch niemanden bevorzugen[a] und keinem Menschen schmeicheln[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Gesicht eines Mannes erheben“; eine hebräische Redewendung für Begünstigung oder Parteilichkeit.'
