lexical_decisions:
- source_word: אַל נָא
  choice: Ich will doch … nicht
  rationale: Die Verbindung aus אַל und נָא drückt hier einen nachdrücklichen negativen Wunsch beziehungsweise Vorsatz aus. „doch“ bewahrt den eindringlichen Ton, ohne im Deutschen eine unnatürliche Bitte an die Zuhörer zu formulieren.
- source_word: אֶשָּׂא פְנֵי אִישׁ
  choice: für niemanden Partei ergreifen
  rationale: Die Wendung „das Gesicht eines Mannes erheben“ ist ein hebräisches Idiom für Begünstigung oder Parteilichkeit. Die deutsche Formulierung gibt diesen Sinn natürlich wieder; „niemanden“ vermittelt den generischen Geltungsbereich des indefiniten אִישׁ.
- source_word: וְאֶל אָדָם
  choice: und keinem Menschen
  rationale: אָדָם bezeichnet hier parallel zu אִישׁ einen Menschen. „Keinem Menschen“ bewahrt den persönlichen Bezug und ergibt eine klare deutsche Parallelstruktur.
- source_word: לֹא אֲכַנֶּה
  choice: schmeicheln
  rationale: Das Piel von כנה kann hier das Anreden mit ehrenden oder schmeichelnden Titeln bezeichnen. „Schmeicheln“ gibt die ethische Stoßrichtung knapp und idiomatisch wieder, während die engere Alternative in einer Fußnote erhalten bleibt.
