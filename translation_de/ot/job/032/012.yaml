lexical_decisions:
- source_word: וְעָדֵיכֶם אֶתְבּוֹנָן
  choice: Ich hörte euch aufmerksam zu
  rationale: Das Hitpolel von בין bezeichnet eingehende Betrachtung bzw. aufmerksame Wahrnehmung; im Zusammenhang einer Rede-Debatte gibt „aufmerksam zuhören“ den Sinn im natürlichen modernen Deutsch wieder.
- source_word: וְהִנֵּה
  choice: doch seht
  rationale: הִנֵּה markiert hier nach dem aufmerksamen Zuhören eine überraschende bzw. nachdrückliche Feststellung. „Doch seht“ bewahrt diese rhetorische Kraft und verbindet zugleich den Gegensatz natürlich.
- source_word: אֵין לְאִיּוֹב מוֹכִיחַ
  choice: Keiner von euch konnte Hiob widerlegen
  rationale: מוֹכִיחַ kann jemanden bezeichnen, der zurechtweist, korrigiert oder argumentativ widerlegt. Im Kontext des Streitgesprächs steht die argumentative Widerlegung im Vordergrund; „konnte“ macht die ergebnislose Bemühung idiomatisch deutlich.
- source_word: עוֹנֶה אֲמָרָיו
  choice: auf seine Worte antworten
  rationale: ענה mit אֲמָרִים bezeichnet eine Antwort auf das Gesagte. Die nahe deutsche Wiedergabe ist klar und würdevoll.
- source_word: מִכֶּם
  choice: von euch
  rationale: Die Präposition מן bezeichnet hier die Herkunft aus der angesprochenen Gruppe; zusammen mit „keiner“ ist „keiner von euch“ die natürliche deutsche Form.
theological_decisions:
- issue: Bedeutungsumfang von מוֹכִיחַ
  choice: widerlegen
  alternative: zurechtweisen / korrigieren
  rationale: Die argumentative Situation legt „widerlegen“ nahe, ohne die ebenfalls mögliche Bedeutung moralischer Zurechtweisung zu verschweigen; diese bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers folgt der hebräischen Gedankenfolge, vermeidet jedoch eine hölzerne Wiedergabe. „Doch seht“ erhält die rhetorische Funktion von וְהִנֵּה; beide echten lexikalischen Mehrdeutigkeiten werden durch Fußnoten offengehalten.
