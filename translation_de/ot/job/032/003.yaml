  yaml_path: translation/ot/job/032/003.yaml
  text: And his anger burned against his three friends because they had found no answer[a], yet they had condemned Job.
translation:
  language: de
  text: Auch über seine drei Freunde entbrannte sein Zorn, weil sie keine Antwort gefunden und Hiob dennoch verurteilt hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hiob für schuldig erklärt“; auch möglich: „Hiob als gottlos erklärt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹשֶׁת רֵעָיו
  choice: Auch über seine drei Freunde
  rationale: Die Präposition ב bezeichnet bei חרה אף idiomatisch das Ziel des Zorns. „Über“ ist dafür im Deutschen natürlich; „auch“ nimmt die Fortführung vom vorherigen Vers auf.
- source_word: חָרָה אַפּוֹ
  choice: entbrannte sein Zorn
  rationale: Die Formulierung bewahrt das hebräische Bild des brennenden Zorns und klingt zugleich würdig und idiomatisch.
- source_word: עַל אֲשֶׁר
  choice: weil
  rationale: Die Verbindung leitet den Grund für Elihus Zorn ein; „weil“ gibt diesen Zusammenhang knapp und natürlich wieder.
- source_word: לֹא מָצְאוּ מַעֲנֶה
  choice: sie keine Antwort gefunden hatten
  rationale: מַעֲנֶה bezeichnet im Streitgespräch eine Antwort oder Erwiderung. Das Plusquamperfekt verdeutlicht, dass dieser Sachverhalt Elihus Zorn vorausging.
- source_word: וַיַּרְשִׁיעוּ
  choice: dennoch verurteilt hatten
  rationale: Der Hifil von רשע hat hier wahrscheinlich den forensischen Sinn „für schuldig erklären/verurteilen“. „Dennoch“ macht den im Zusammenhang liegenden Gegensatz deutlich, ohne die Grundbedeutung des ו als eigene Aussage zu behandeln.
- source_word: אֶת אִיּוֹב
  choice: Hiob
  rationale: Der direkte Objektmarker bleibt unübersetzt; der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
theological_decisions:
- issue: Bedeutung der Handlung der Freunde gegenüber Hiob
  choice: 'forensisch: „Hiob verurteilt“'
  alternative: 'moralisch charakterisierend: „Hiob für gottlos erklärt“ oder „als schuldig behandelt“'
  rationale: Der Hifil von רשע bezeichnet häufig das Schuldigsprechen. „Verurteilt“ bewahrt den forensischen Ton, ohne genauer festzulegen, worin Hiobs vermeintliche Schuld bestand.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Verbmetapher „entbrannte sein Zorn“ bewahrt die Bildhaftigkeit des Hebräischen. Das adversative „dennoch“ bildet die Logik des Satzes natürlich ab.
