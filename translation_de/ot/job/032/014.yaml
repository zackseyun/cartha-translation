  yaml_path: translation/ot/job/032/014.yaml
  text: He has not directed words against me[b][a], and I will not answer him with your sayings.
translation:
  language: de
  text: Er hat keine Worte gegen mich vorgebracht[a], und ich werde ihm nicht mit euren Aussagen antworten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er hat keine Worte gegen mich ins Feld geführt.« Das hebräische Verb kann »ordnen« oder »aufstellen« bedeuten und hier das Vorbringen einer Argumentation bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ich werde ihm nicht mit euren Argumenten antworten.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרַךְ
  choice: vorgebracht
  rationale: Das Verb bedeutet grundsätzlich »ordnen, aufstellen« und bezeichnet mit »Worte« in diesem Streitgespräch das geordnete Vorbringen einer Rede oder Argumentation. »Vorgebracht« ist im Deutschen natürlich und wahrt den forensisch-disputativen Sinn.
- source_word: אֵלַי
  choice: gegen mich
  rationale: Die Präposition bezeichnet die Ausrichtung auf Elihu; im Streitkontext gibt »gegen mich« wieder, dass Hiob seine Worte nicht an Elihu als Gegenüber gerichtet hat.
- source_word: מִלִּין
  choice: Worte
  rationale: Der aramaisierende Plural bezeichnet gesprochene Worte oder Rede. »Worte« ist die direkte und verständliche Wiedergabe; der argumentative Zusammenhang wird durch »vorgebracht« ausgedrückt.
- source_word: אִמְרֵיכֶם
  choice: eure Aussagen
  rationale: »Aussagen« gibt die Äußerungen der Freunde wieder und unterscheidet den Ausdruck sprachlich von מִלִּין, ohne ihn vorschnell auf förmliche Argumente einzuengen.
- source_word: אֲשִׁיבֶנּוּ
  choice: ich werde ihm … antworten
  rationale: Der Hifil von שוב kann »antworten, erwidern« bedeuten. Das Suffix der dritten Person Singular bezieht sich auf Hiob.
- source_word: וּבְאִמְרֵיכֶם לֹא אֲשִׁיבֶנּוּ
  choice: und ich werde ihm nicht mit euren Aussagen antworten
  rationale: 'Die Präposition בְּ wird instrumental als »mit« wiedergegeben: Elihu will Hiob nicht unter Verwendung der Äußerungen seiner drei Freunde antworten.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Ausdrücke מִלִּין und אִמְרֵיכֶם werden mit »Worte« und »Aussagen« unterschieden; die mögliche argumentative Zuspitzung wird in den Fußnoten offengehalten.
