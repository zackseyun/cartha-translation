  text: וְ/אִם זְר֖וֹעַ כָּ/אֵ֥ל לָ֑/ךְ וּ֝/בְ/ק֗וֹל כָּמֹ֥/הוּ תַרְעֵֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/009.yaml
  text: Or do you have an arm like God’s[a], and can you thunder with a voice like his?
translation:
  language: de
  text: Oder hast du einen Arm wie Gottes Arm, und kannst du mit einer Stimme wie die seine donnern?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Oder hast du
  rationale: In der fortlaufenden Reihe rhetorischer Fragen führt וְאִם eine weitere herausfordernde Alternative ein. „Oder hast du“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: זְרוֹעַ
  choice: Arm
  rationale: Das konkrete Bild des Arms wird bewahrt; die damit verbundene Bedeutung von Kraft oder Macht bleibt als Metapher erkennbar.
- source_word: כָּאֵל
  choice: wie Gott
  rationale: Im Kontext spricht Gott selbst und vergleicht seine Macht mit derjenigen Hiobs. Das Deutsche benötigt nach „Arm“ keinen possessiven Zusatz, sodass „einen Arm wie Gott“ die Ellipse natürlich wiedergibt.
- source_word: לָךְ
  choice: hast du
  rationale: Das wörtliche „ist dir/zu dir“ bezeichnet hier Besitz und wird idiomatisch mit „hast du“ ausgedrückt.
- source_word: וּבְקוֹל
  choice: und kannst du mit einer Stimme
  rationale: בְּ bezeichnet hier das Mittel beziehungsweise die Art des Donnerns; „mit einer Stimme“ erhält das Bild und ist im Deutschen verständlich.
- source_word: כָּמֹהוּ
  choice: wie seiner
  rationale: Das Suffix verweist auf Gott; da sich der Vergleich auf „Stimme“ bezieht, ist das feminine Pronomen „seiner“ im Deutschen idiomatisch.
- source_word: תַרְעֵם
  choice: kannst du … donnern
  rationale: Die Hifil-Form von רעם bezeichnet hier machtvolles Donnern beziehungsweise Donner erschallen zu lassen. Die Modalform „kannst du“ bringt die rhetorische Herausforderung zum Ausdruck und bewahrt die Gewittertheophanie.
theological_decisions:
- issue: Bezug von אֵל im göttlichen Vergleich
  choice: Gott
  alternative: ein Gott
  rationale: Der unmittelbare Kontext zeigt, dass der Gott Israels zu Hiob spricht und ihn mit seiner eigenen Macht konfrontiert. „Gott“ gibt diesen konkreten Bezug wieder; die grammatisch mögliche, aber kontextuell weniger wahrscheinliche generische Lesart wird in der Fußnote erhalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die körperliche Metapher „Arm“ und das theophanische Bild des Donnerns bleiben erhalten; die rhetorische Frage klingt direkt und natürlich.
