base_translation:
  language: en
  yaml_path: translation/ot/job/040/006.yaml
  text: Then Yahweh answered Job out of the storm and said:[a]
translation:
  language: de
  text: Da antwortete Jahwe Hiob aus dem Sturm und sagte:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Wirbelsturm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Da antwortete
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Da“ gibt die zeitliche Folge natürlich wieder, während ענה hier „antworten“ bedeutet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Umschrift des Tetragramms.
- source_word: אֶת אִיּוֹב
  choice: Hiob
  rationale: Die Akkusativmarkierung kennzeichnet Hiob als die angesprochene Person. Im Deutschen ist „jemandem antworten“ zwar üblich, doch die biblisch gehobene Konstruktion „Hiob antworten“ wäre unnatürlich; hier wird der Name direkt an das Verb angeschlossen, dem Ausgangstext entsprechend.
- source_word: מִן סְעָרָה
  choice: aus dem Sturm
  rationale: סְעָרָה bezeichnet einen Sturm, ein Unwetter oder einen Wirbelsturm. „Sturm“ ist verständlich und wahrt die Breite des Ausdrucks; die engere mögliche Wiedergabe steht in der Fußnote.
- source_word: וַיֹּאמַר
  choice: 'und sagte:'
  rationale: Die übliche hebräische Einleitung direkter Rede wird wörtlich und natürlich wiedergegeben; der Doppelpunkt kündigt die folgende Rede an.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der Text nennt ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen und verwendet die im modernen Deutschen übliche Form, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Erzählform und die doppelte Redeeinleitung („antwortete … und sagte“) bleiben erhalten.
