base_translation:
  language: en
  yaml_path: translation/ot/job/040/002.yaml
  text: Will one who contends with the Almighty correct him? Let the one who argues with God answer it[a][b].
translation:
  language: de
  text: Will etwa jemand, der mit dem Allmächtigen streitet, ihn zurechtweisen?[a] Wer Gott Vorwürfe macht, antworte darauf![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Will jemand, der mit dem Allmächtigen rechtet, ihn belehren oder tadeln?« Das Hebräische verbindet Sprache des Rechtsstreits mit der des Zurechtweisens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »antworte dies« beziehungsweise »antworte ihm«. Das hebräische Suffix kann sich eher auf die angesprochene Sache als unmittelbar auf Gott beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב
  choice: Will einer, der … streitet
  rationale: Von ריב, »streiten, eine Rechtssache führen«. Die verbale Wiedergabe ist im Deutschen natürlich und bewahrt den rechtlich-disputativen Klang.
- source_word: עִם
  choice: mit
  rationale: Die Präposition bedeutet wörtlich »mit«, trägt im Zusammenhang eines Streits aber einen gegnerischen Unterton.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Etablierte deutsche Wiedergabe des Gottesnamens beziehungsweise -titels שדי im Buch Hiob.
- source_word: יִסּוֹר
  choice: ihn zurechtweisen
  rationale: יסר kann »erziehen, unterweisen, züchtigen, zurechtweisen« bedeuten. Hier ist nach Syntax und Parallelismus der menschliche Streitende das Subjekt, der sich anmaßt, den Allmächtigen zurechtzuweisen.
- source_word: מוֹכִיחַ
  choice: Wer … Vorwürfe macht
  rationale: יכח umfasst argumentieren, tadeln, zurechtweisen und eine Rechtssache führen. »Vorwürfe macht« bringt im Kontext die anklagend-kritische Haltung gegenüber Gott in verständlichem Deutsch zum Ausdruck.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Die in Hiob häufige poetische Singularform wird ohne unbelegte Zusatzbedeutung schlicht mit »Gott« wiedergegeben.
- source_word: יַעֲנֶנָּה
  choice: antworte darauf
  rationale: Das feminine Singularsuffix verweist wahrscheinlich auf die angesprochene Sache oder Streitfrage. »Darauf« wahrt diesen Bezug idiomatisch, ohne die im Hebräischen vorhandene Kürze völlig aufzulösen.
theological_decisions:
- issue: Weist der Mensch Gott zurecht, oder wird der mit Gott Streitende selbst zurechtgewiesen?
  choice: Die rhetorische Frage beschreibt den menschlichen Streitenden als jemanden, der sich anmaßt, den Allmächtigen zurechtzuweisen.
  alternative: Der mit dem Allmächtigen Streitende soll Zurechtweisung annehmen.
  rationale: Syntax und Parallelismus sprechen dafür, den menschlichen Streitenden als Subjekt von יִסּוֹר zu verstehen; der zweite Halbvers fordert denselben Menschen zur Antwort auf.
- issue: Worauf bezieht sich das Suffix in יַעֲנֶנָּה?
  choice: 'Auf die vorgebrachte Sache oder Streitfrage: »darauf«.'
  alternative: 'Direkt auf Gott: »ihm antworte er«; oder deiktisch: »dies antworte er«.'
  rationale: Das feminine Singularsuffix passt nicht unmittelbar zu אֱלוֹהַּ und weist daher eher auf eine unausgesprochene feminine Sache, Behauptung oder Streitfrage. Die verdichtete Referenz bleibt in einer Fußnote offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Mit dem Allmächtigen streitet« bewahrt die hebräische Präposition und den forensischen Unterton; »Vorwürfe macht« ist allgemeinverständlich und hält die tadelnde, anklagende Nuance fest. Die beiden rhetorisch eng verbundenen Halbverse bleiben knapp und eindringlich.
