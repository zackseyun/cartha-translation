    rationale: אֶל־פִּיהוּ bedeutet primär „zu/auf sein Maul hin“. Die Aussage soll die genaue Art des Heranströmens nicht weiter festlegen.
  - severity: low
    issue: „Schwillt der Fluss gewaltig an“ verengt יַעֲשֹׁק auf Anschwellen.
    rationale: Das Bild meint ein gewaltsames Bedrängen beziehungsweise Toben eines Stroms; ein Anschwellen ist möglich, aber nicht erforderlich.
