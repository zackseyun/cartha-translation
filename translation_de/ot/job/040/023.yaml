  yaml_path: translation/ot/job/040/023.yaml
  text: Look, if a river rages, he is not alarmed; he is confident even if the Jordan surges against his mouth.
translation:
  language: de
  text: Siehe, wenn ein Strom tobt, erschrickt es nicht; es bleibt unbesorgt, auch wenn der Jordan seinem Maul zustürmt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auch wenn der Jordan gegen sein Maul hervorbricht“ oder „in sein Maul hineinbricht“.'
    reason: Die Verbindung יָגִיחַ ... אֶל־פִּיהוּ beschreibt ein heftiges Hervorbrechen beziehungsweise Zustürmen auf das Maul zu; die genaue räumliche Nuance bleibt auslegbar.
lexical_decisions:
- source_word: יַעֲשֹׁק נָהָר
  choice: Schwillt der Fluss gewaltig an
  rationale: Das Verb עשׁק bedeutet gewöhnlich „bedrängen, überwältigen, gewaltsam handeln“. In Verbindung mit „Fluss“ bezeichnet es hier am ehesten ein bedrohliches Anschwellen oder Toben; die Formulierung wahrt die Gewaltigkeit des Bildes, ohne dem Fluss menschliches Handeln zuzuschreiben.
- source_word: לֹא יַחְפּוֹז
  choice: so erschrickt es nicht
  rationale: חפז kann hastiges, bestürztes oder alarmiertes Reagieren ausdrücken. „erschrickt nicht“ gibt im Kontext die unerschütterliche Ruhe des Tieres natürlich wieder.
- source_word: יִבְטַח
  choice: es bleibt ruhig
  rationale: Das Verb בטח bezeichnet Sicherheit, Zuversicht oder sorgloses Vertrauen. Bei einem Tier klingt „bleibt ruhig“ im Deutschen natürlich und bewahrt den Gegensatz zum Erschrecken, ohne dem Tier ausdrücklich reflektierten Glauben zuzuschreiben.
- source_word: יָגִיחַ יַרְדֵּן אֶל־פִּיהוּ
  choice: der Jordan ihm bis ans Maul dringt
  rationale: גיח bezeichnet ein Hervorbrechen oder Vordringen. „bis ans Maul dringt“ gibt die Richtung אֶל־פִּיהוּ anschaulich wieder und lässt offen, ob das Wasser lediglich heranreicht oder unmittelbar dagegenströmt.
