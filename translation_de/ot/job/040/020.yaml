source:
  edition: WLC
  text: כִּֽי ב֭וּל הָרִ֣ים יִשְׂאוּ ל֑/וֹ וְֽ/כָל חַיַּ֥ת הַ֝/שָּׂדֶ֗ה יְשַֽׂחֲקוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/020.yaml
  text: For the mountains bear food for him[b][a], and all the wild animals of the field play there.
translation:
  language: de
  text: Denn die Berge bringen ihm Nahrung hervor[a], und alle wilden Tiere des Feldes spielen dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn die Berge bringen Ertrag für ihn hervor.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet hier eine Begründung beziehungsweise Erläuterung zur Versorgung des Behemot ein; „Denn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: בּוּל
  choice: Nahrung
  rationale: Das seltene Wort bezeichnet den Ertrag oder das, was hervorgebracht wird. Im Zusammenhang mit der Versorgung des Tieres drückt „Nahrung“ den gemeinten Sachbezug klar aus, während die mögliche Bedeutung „Ertrag“ in der Fußnote erhalten bleibt.
- source_word: הָרִים
  choice: die Berge
  rationale: Dies ist die direkte und kontextgemäße Wiedergabe des bestimmten Plurals.
- source_word: יִשְׂאוּ לוֹ
  choice: bringen ihm … hervor
  rationale: In Verbindung mit בּוּל beschreibt נשׂא, dass die Berge etwas für ihn hervorbringen. Die Formulierung ist im modernen Deutschen verständlich und bewahrt die Vorstellung, dass das Gelände seinen Unterhalt erzeugt.
- source_word: וְכָל חַיַּת הַשָּׂדֶה
  choice: und alle wilden Tiere des Feldes
  rationale: Die feste Wortverbindung bezeichnet die frei lebenden Landtiere. „Wilde Tiere des Feldes“ ist modern verständlich und wahrt zugleich das hebräische Bild vom Feld.
- source_word: יְשַׂחֲקוּ
  choice: spielen
  rationale: Die Piel-Form von שׂחק bezeichnet hier spielerische oder ausgelassene Bewegung; „spielen“ ist die schlichte, natürliche Entsprechung.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf das zuvor genannte Bergland als gemeinsamen Lebensraum.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung ist flüssig, während das Bild der Nahrung hervorbringenden Berge und der Ausdruck „Tiere des Feldes“ erhalten bleiben.
