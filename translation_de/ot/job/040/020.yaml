  terminology: „Wilde Tiere des Feldes“ wahrt sowohl den Ausdruck als auch dessen Sinn als frei lebende Landtiere. Es werden keine theologisch oder zoologisch überfestlegenden Deutungen eingeführt. Die Fußnote ist korrekt am lexikalisch mehrdeutigen Ausdruck verankert.
