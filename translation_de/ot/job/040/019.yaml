lexical_decisions:
- source_word: רֵאשִׁית
  choice: der Erste
  rationale: Die Wendung bezeichnet hier am ehesten Vorrang oder höchsten Rang unter den Geschöpfen; „der Erste“ bewahrt zugleich die mögliche Bedeutung zeitlicher Priorität.
- source_word: דַּרְכֵי אֵל
  choice: unter den Werken Gottes
  rationale: דֶּרֶךְ bedeutet wörtlich „Weg“, kann aber auch Gottes Wirken bezeichnen. Im Schöpfungszusammenhang ist „Werke“ im Deutschen verständlicher; die wörtlichere Alternative wird in der Fußnote erhalten.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier eine gewöhnliche Gottesbezeichnung und wird im modernen Standarddeutsch natürlich mit „Gott“ wiedergegeben.
- source_word: הָעֹשׂוֹ
  choice: der, der ihn gemacht hat
  rationale: Die substantivierte Partizipialform bedeutet wörtlich „der ihn Machende“. Die gewählte Form ist klar, modern und hält den Bezug ausdrücklich fest.
- source_word: יַגֵּשׁ
  choice: kann … heranbringen
  rationale: Der Hifil von נגשׁ bedeutet gewöhnlich „heranbringen“ oder „darbringen“. Das Modalverb „kann“ gibt die im Kontext naheliegende Exklusivität wieder, während „heranbringen“ eng an der Verbform bleibt.
- source_word: חַרְבּוֹ
  choice: sein Schwert
  rationale: Das maskuline Suffix bedeutet formal „sein“. Sein Bezug bleibt im Hebräischen mehrdeutig; die Fußnote weist deshalb auf andere mögliche Deutungen der schwierigen Klausel hin.
theological_decisions:
- issue: Deutung des schwierigen zweiten Halbverses
  choice: nur der, der ihn gemacht hat, kann sein Schwert an ihn heranbringen
  alternative: 'Der ihn gemacht hat, hat ihm sein Schwert gegeben; oder: Der ihn gemacht hat, soll sein Schwert heranbringen.'
  rationale: Die hebräische Syntax ist stark verdichtet, und sowohl der Bezug von „sein“ als auch das Verhältnis von Schöpfer, Geschöpf und Schwert sind umstritten. Der Haupttext gibt die kontextuell plausible Aussage wieder, dass allein der Schöpfer dem Behemot mit dem Schwert nahen kann; die Fußnote bewahrt die echten Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Der Erste unter“ klingt natürlicher als „der Erste der Werke“, ohne die Aussage über den Vorrang abzuschwächen. Die schwer auflösbare Schlussklausel wird lesbar übersetzt und ihre Mehrdeutigkeit durch eine unmittelbar markierte Fußnote offengehalten.
