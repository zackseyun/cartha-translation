  terminology: „Werke Gottes“ gibt דַּרְכֵי אֵל im Schöpfungskontext idiomatisch wieder. „Der, der ihn gemacht hat“ ist eine klare Wiedergabe von הָעֹשׂוֹ und vermeidet eine unnötige dogmatische oder interpretative Aufladung.
