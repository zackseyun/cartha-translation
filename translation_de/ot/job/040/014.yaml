  yaml_path: translation/ot/job/040/014.yaml
  text: Then even I will praise you[a], because your right hand can save you.
translation:
  language: de
  text: Dann werde sogar ich dich preisen, denn deine rechte Hand kann dich retten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… kann dir selbst Rettung schaffen.“ Das Hebräische enthält eine Präposition, die den Nutzen für die angesprochene Person ausdrückt („für dich/für dich selbst“).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Dann … selbst
  rationale: Die Verbindung führt die vorausgehende Herausforderung fort und verstärkt zugleich die Aussage; im Deutschen gibt „Dann … selbst“ den folgernden Zusammenhang und die Betonung natürlich wieder.
- source_word: אֲנִי
  choice: ich
  rationale: 'Das ausdrücklich gesetzte Pronomen bleibt wegen seiner Betonung erhalten: Gott selbst spricht.'
- source_word: אוֹדֶךָ
  choice: werde … dich preisen
  rationale: Das Hifil von ידה bezeichnet hier das Loben beziehungsweise anerkennende Preisen. Im Kontext der göttlichen Einräumung ist „dich preisen“ natürlich und sachgerecht.
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion leitet den Grund für die vorangehende Aussage ein.
- source_word: תוֹשִׁיעַ
  choice: retten kann
  rationale: Das Hifil von ישׁע bedeutet „retten, befreien“. Im Zusammenhang der bedingten Herausforderung steht die erwiesene Fähigkeit im Vordergrund; daher gibt „kann“ den Sinn besser wieder als eine bloße Zukunftsaussage.
- source_word: לְךָ
  choice: dich
  rationale: Die Präposition bezeichnet den Vorteil oder Nutzen für die angesprochene Person. „Dich retten“ ist idiomatisches Deutsch; die wörtlichere reflexive Nuance wird in der Fußnote bewahrt.
- source_word: יְמִינֶךָ
  choice: deine rechte Hand
  rationale: Das konkrete hebräische Bild für Kraft und Macht bleibt erhalten, statt es deutend durch „deine eigene Kraft“ zu ersetzen.
theological_decisions:
- issue: Anthropomorphe Bildsprache für Macht
  choice: deine rechte Hand dich retten kann
  alternative: deine eigene Kraft dich retten kann
  rationale: Der hebräische Text nennt ausdrücklich die „rechte Hand“. Die Übersetzung bewahrt dieses konkrete Bild und löst es nicht stillschweigend in seine Bedeutung „Kraft“ auf.
- issue: Nuance von לְךָ
  choice: dich retten
  alternative: für dich selbst Rettung schaffen
  rationale: Die idiomatische deutsche Formulierung gibt das Ziel der Rettung klar wieder, während die Präposition des Vorteils eine reflexive Nuance zulässt. Diese echte lexikalische Alternative wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge und das Bild der rechten Hand bleiben nah am Hebräischen; „Dann“ macht den Bezug zur vorausgehenden Herausforderung verständlich.
