  yaml_path: translation/ot/job/040/011.yaml
  text: Pour out the overflowings of your anger[c][b][a], and look on everyone who is proud and bring him low.
translation:
  language: de
  text: Schütte die Ausbrüche deines Zorns aus,[a] sieh jeden Hochmütigen an und erniedrige ihn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verstreue den überströmenden Zorn«. Das hebräische Verb kann »zerstreuen«, »aussenden« oder »ausschütten« bedeuten; das Substantiv bezeichnet heftigen, überströmenden Zorn oder Zornesausbrüche.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »jeden Hochmütigen«; das anschließende »ihn« nimmt jeden Einzelnen in den Blick.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵץ
  choice: Entfessle
  rationale: Der Imperativ bezeichnet ein kraftvolles Aussenden oder Zerstreuen. In Verbindung mit den »Ausbrüchen des Zorns« gibt »entfesseln« die freigesetzte Gewalt natürlich wieder, ohne das Bild durch ein unpassendes deutsches Verb zu glätten.
- source_word: עֶבְרוֹת אַפֶּךָ
  choice: die Ausbrüche deines Zorns
  rationale: Der Plural עֶבְרוֹת bezeichnet heftige, überschäumende Regungen; אַף ist hier die übliche hebräische Bezeichnung für Zorn. »Ausbrüche« wahrt die Mehrzahl und Intensität.
- source_word: וּרְאֵה
  choice: sieh … an
  rationale: Die Konstruktion richtet den Blick gezielt auf die folgenden Personen und führt zur Aufforderung, sie zu erniedrigen.
- source_word: כָל גֵּאֶה
  choice: jeden Hochmütigen
  rationale: 'Das substantivierte Adjektiv im Singular mit כָל ist distributiv zu verstehen: jeder einzelne hochmütige Mensch.'
- source_word: וְהַשְׁפִּילֵהוּ
  choice: und erniedrige ihn
  rationale: Der Hifil-Imperativ von שׁפל bedeutet, jemanden niedrig zu machen oder herabzusetzen. Das maskuline Singularsuffix nimmt jeden Hochmütigen einzeln auf.
