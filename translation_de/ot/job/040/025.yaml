base_translation:
  language: en
  yaml_path: translation/ot/job/040/025.yaml
  text: Can you draw out Leviathan with a fishhook[b][a], or press down his tongue with a rope?
translation:
  language: de
  text: Kannst du den Leviatan mit einem Angelhaken herausziehen oder mit einem Seil seine Zunge niederdrücken?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Zunge mit einer Schnur hinabsenken« beziehungsweise »seine Zunge mit einem Seil niederhalten«. Das hebräische Bild ist schwer zu deuten und bezieht sich möglicherweise auf die Bezwingung des Tieres am Maul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשֹׁךְ
  choice: herausziehen
  rationale: Das Qal-Imperfekt von משׁך bezeichnet hier im Zusammenhang des Fischfangs ein Ziehen beziehungsweise Herausziehen und passt zur rhetorischen Frage nach dem Fang des Leviatan.
- source_word: לִוְיָתָן
  choice: den Leviatan
  rationale: Die Bezeichnung wird als Eigenname transliteriert. Im Deutschen steht beim Akkusativ eines männlichen Eigennamens dieser Art idiomatisch der Artikel.
- source_word: בְּחַכָּה
  choice: mit einem Angelhaken
  rationale: חכה bezeichnet einen zum Fischfang verwendeten Haken; „Angelhaken“ gibt das Bild in modernem Deutsch eindeutig wieder.
- source_word: וּבְחֶבֶל
  choice: mit einem Seil
  rationale: חבל kann Seil oder Schnur bedeuten. „Seil“ bewahrt die allgemeine, kräftige Vorstellung, ohne speziell eine Angelschnur vorauszusetzen.
- source_word: תַּשְׁקִיעַ
  choice: niederdrücken
  rationale: Der Hifil von שׁקע bedeutet wörtlich, etwas sinken oder hinabgehen zu lassen. Bei der Zunge und einem Seil gibt „niederdrücken“ das konkrete, jedoch schwer deutbare Bild wieder, ohne die Fangtechnik genauer festzulegen.
- source_word: לְשֹׁנוֹ
  choice: seine Zunge
  rationale: Der hebräische Text nennt ausdrücklich die Zunge; diese körperlich-konkrete Formulierung bleibt erhalten.
