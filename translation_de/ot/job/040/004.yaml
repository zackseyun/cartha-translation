source:
  edition: WLC
  text: הֵ֣ן קַ֭לֹּתִי מָ֣ה אֲשִׁיבֶ֑/ךָּ יָ֝דִ֗/י שַׂ֣מְתִּי לְמוֹ פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/004.yaml
  text: Look[a], I am insignificant; what can I answer you? I put my hand over my mouth.
translation:
  language: de
  text: Sieh, ich bin unbedeutend[a]. Was kann ich dir antworten? Ich habe meine Hand auf meinen Mund gelegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich bin gering.“ Traditionell auch: „Ich bin verwerflich.“'
    reason: 'Lexikalische Alternative: קַלֹּתִי kann Geringheit beziehungsweise geringes Gewicht ausdrücken; die traditionelle Wiedergabe ist moralisch stärker.'
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel leitet Hiobs unmittelbare, nachdrückliche Einsicht ein. „Sieh“ ist gegenwärtiges, würdiges Deutsch und bewahrt den auffordernden Charakter.
- source_word: קַלֹּתִי
  choice: ich bin unbedeutend
  rationale: Die Form von קלל bezeichnet hier Kleinheit, Geringsein oder geringes Gewicht. „Unbedeutend“ bringt Hiobs Selbsterniedrigung zum Ausdruck, ohne die moralisch stärkere Bedeutung „verwerflich“ einzutragen.
- source_word: מָה אֲשִׁיבֶךָּ
  choice: Was kann ich dir antworten?
  rationale: מָה bezeichnet den Inhalt einer möglichen Antwort; das im Deutschen ergänzte „kann“ gibt den rhetorischen Sinn der Unfähigkeit natürlich wieder. אֲשִׁיבֶךָּ bedeutet in diesem Zusammenhang „dir antworten“.
- source_word: יָדִי שַׂמְתִּי לְמוֹ פִי
  choice: Ich lege meine Hand auf meinen Mund
  rationale: Die körperliche Geste wird wörtlich und idiomatisch wiedergegeben. Das deutsche Präsens stellt die mit dem Sprechen vollzogene, nun geltende Geste unmittelbar dar.
theological_decisions:
- issue: Soll Hiobs Selbstbeschreibung moralisch wertend übersetzt werden?
  choice: ich bin unbedeutend
  alternative: ich bin verwerflich; ich bin gering
  rationale: Der hebräische Ausdruck spricht hier eher von Geringheit oder fehlendem Gewicht als ausdrücklich von sittlicher Verderbtheit. Die Übersetzung bewahrt Hiobs Demut vor Gott, ohne eine weitergehende moraltheologische Aussage festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die knappe Satzfolge und die konkrete Geste des Schweigens bleiben erhalten.
