translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur des Hebräischen bleibt erhalten; die leicht kontrastive Wiedergabe von וְ mit »doch« ergibt im Deutschen einen natürlichen Sinn. Der Fußnotenmarker steht nach dem gesamten Vers, da die Anmerkung mehrere Formulierungen betrifft.
