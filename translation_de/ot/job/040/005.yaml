  text: I have spoken once[a], and I will not answer; twice, and I will add nothing more.
translation:
  language: de
  text: Einmal habe ich geredet, und ich werde nicht antworten; ein zweites Mal, und ich werde nichts mehr hinzufügen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Einmal habe ich geredet und werde nicht antworten; ein zweites Mal, und ich werde nicht fortfahren.« Das hebräische Verb für »hinzufügen« kann auch bedeuten, eine Handlung fortzusetzen oder zu wiederholen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: Einmal
  rationale: Die feminine Zahlform »eins« wird hier adverbial gebraucht und bedeutet im Zusammenhang idiomatisch »einmal«.
- source_word: דִּבַּרְתִּי
  choice: habe ich geredet
  rationale: Das Perfekt bezeichnet Hiobs bereits vollzogene Rede mit gegenwärtiger Bedeutung in seiner Antwort an den HERRN.
- source_word: וְלֹא אֶעֱנֶה
  choice: doch ich werde nicht antworten
  rationale: ענה bedeutet im Qal »antworten, erwidern«. »Doch« gibt den im Zusammenhang naheliegenden Gegensatz wieder, ohne den Aussagegehalt zu erweitern.
- source_word: וּשְׁתַּיִם
  choice: ein zweites Mal
  rationale: Die Zahl »zwei« ist parallel zu אַחַת adverbial gebraucht. Im Deutschen bezeichnet »ein zweites Mal« die zweite bereits erfolgte Äußerung natürlicher als das missverständliche »zweimal«.
- source_word: וְלֹא אוֹסִיף
  choice: doch ich werde nichts mehr hinzufügen
  rationale: יסף im Hifil kann »hinzufügen«, »fortfahren« oder »etwas erneut tun« bedeuten. Die Formulierung bewahrt das hebräische Bild und macht deutlich, dass Hiob nicht weiterreden will.
