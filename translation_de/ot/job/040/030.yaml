id: JOB.40.30
reference: Job 40:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִכְר֣וּ עָ֭לָי/ו חַבָּרִ֑ים יֶ֝חֱצ֗וּ/הוּ בֵּ֣ין כְּֽנַעֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/030.yaml
  text: Will traders bargain over him? Will they divide him among the merchants?[a][b]
translation:
  language: de
  text: Werden Händler um ihn feilschen? Werden sie ihn unter Kaufleuten aufteilen?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Werden Gefährten seinetwegen ein Mahl veranstalten?« Der hebräische Text des ersten Satzes ist schwierig; חַבָּרִים kann auch nichtkommerziell als »Gefährten« verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »Kanaanäern«; hier wahrscheinlich im Sinn von »Kaufleuten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְרוּ
  choice: feilschen
  rationale: Das Verb כרה bedeutet gewöhnlich »graben«, wird hier aber zusammen mit עַל und im kommerziellen Parallelismus am ehesten idiomatisch als Aushandeln eines Geschäfts verstanden.
- source_word: עָלָיו
  choice: um ihn
  rationale: Die Präposition עַל bezeichnet hier den Gegenstand der Verhandlung; im Deutschen ist »um ihn feilschen« idiomatisch.
- source_word: חַבָּרִים
  choice: Händler
  rationale: Das Wort kann »Gefährten/Genossen« bedeuten. Der Parallelismus mit כְּנַעֲנִים legt im Haupttext jedoch eine Gruppe von Handelspartnern nahe.
- source_word: יֶחֱצוּהוּ
  choice: ihn ... aufteilen
  rationale: חצה bedeutet »teilen, aufteilen«. Die Wiedergabe lässt offen, ob es um Handelsanteile oder um eine körperliche Zerlegung geht.
- source_word: בֵּין
  choice: unter
  rationale: Vor einer Mehrzahl bezeichnet בֵּין hier die Verteilung innerhalb einer Gruppe; »unter« ist natürliches modernes Deutsch.
- source_word: כְּנַעֲנִים
  choice: Kaufleuten
  rationale: Wörtlich steht »Kanaanäern«; der Ausdruck kann metonymisch Händler bezeichnen. Der Handelskontext spricht für »Kaufleute« im Haupttext, während die wörtliche Bedeutung in einer Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die beiden rhetorischen Fragen und die männlichen Pronomen des Hebräischen bleiben erhalten. »Händler« und »Kaufleute« bilden den kommerziellen Parallelismus ab; die echte Unsicherheit des ersten Satzes und die wörtliche ethnische Bezeichnung im zweiten werden durch Fußnoten sichtbar gemacht.
