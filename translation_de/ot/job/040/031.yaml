    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְמַלֵּא
  choice: Kannst du … spicken
  rationale: Die Fragepartikel mit dem Piel-Imperfekt der 2. Person Singular bildet eine rhetorische Herausforderung. „Kannst du“ gibt diese Kraft natürlich wieder; „spicken“ bezeichnet hier das vielfache Durchbohren beziehungsweise Besetzen mit spitzen Waffen.
- source_word: בְשֻׂכּוֹת
  choice: mit Harpunen
  rationale: Das seltene Substantiv bezeichnet wohl spitze oder mit Widerhaken versehene Jagd- beziehungsweise Fanggeräte. „Harpunen“ passt zum großen Wassertier und zum parallelen Ausdruck im zweiten Satzglied.
- source_word: עוֹרוֹ
  choice: seine Haut
  rationale: Die gewöhnliche anatomische Bezeichnung ist im Deutschen auch bei einem großen Tier natürlich und bewahrt die konkrete Bildsprache.
- source_word: וּבְצִלְצַל דָּגִים
  choice: mit Fischspeeren
  rationale: Die Wendung bezeichnet wörtlich ein mit Fischen verbundenes Fanggerät. „Fischspeere“ wahrt den Parallelismus zu den Harpunen und das Bild eines Angriffs auf den Kopf; die genaue Geräteart bleibt jedoch unsicher.
- source_word: רֹאשׁוֹ
  choice: seinen Kopf
  rationale: Die direkte Wiedergabe bewahrt den anatomischen Parallelismus zu „seine Haut“.
theological_decisions: []
