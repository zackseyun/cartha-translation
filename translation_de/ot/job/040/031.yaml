  text: Can you fill his hide with harpoons[b][a], or his head with fishing spears?
translation:
  language: de
  text: Kannst du seine Haut mit Harpunen[a] füllen und seinen Kopf mit Fischspeeren[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit mit Widerhaken versehenen Fanggeräten“; das seltene hebräische Wort kann allgemein spitze oder mit Widerhaken versehene Jagd- und Fanggeräte bezeichnen.'
