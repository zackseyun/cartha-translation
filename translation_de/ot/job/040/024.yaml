base_translation:
  language: en
  yaml_path: translation/ot/job/040/024.yaml
  text: Can one capture him before his eyes? Can one pierce his nose with snares?[a][b]
translation:
  language: de
  text: Kann man ihn vor seinen Augen fangen? Kann man seine Nase mit Schlingen durchbohren?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wird er ihn vor seinen Augen fangen? Wird er seine Nase mit Fallen durchbohren?« Der hebräische Wortlaut ist knapp und schwierig; die Verbformen können auch weniger allgemein verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch: »mit Schlingen«; auch »mit Fallen« ist möglich. Traditionelle Übersetzungen geben hier teilweise »Haken« wieder; das hebräische Substantiv bezeichnet gewöhnlich eher Schlingen oder Fallen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: vor seinen Augen
  rationale: Die Präposition בְּ mit »Augen« bezeichnet hier am ehesten ein Handeln offen vor den Augen des Tieres, also während es zusieht.
- source_word: יִקָּחֶנּוּ
  choice: kann man ihn … fangen?
  rationale: לקח bedeutet grundsätzlich »nehmen«; im Jagdzusammenhang gibt »fangen« das Ergreifen eines Tieres natürlich wieder. Die Frageform entspricht der rhetorischen Herausforderung des Kontextes.
- source_word: בְּמוֹקְשִׁים
  choice: mit Schlingen
  rationale: מוֹקֵשׁ bezeichnet gewöhnlich eine Schlinge oder Falle. »Schlingen« wahrt den üblichen lexikalischen Sinn, obwohl die Verbindung mit dem Durchbohren der Nase schwierig bleibt.
- source_word: יִנְקָב
  choice: durchbohren
  rationale: נקב bedeutet »durchbohren, ein Loch machen«; »durchbohren« bewahrt die kräftige, konkrete Bildsprache.
- source_word: אָף
  choice: Nase
  rationale: Hier ist eindeutig das Körperteil gemeint. »Nase« ist weiter und unmittelbarer als »Nasenloch«.
theological_decisions:
- issue: Subjekt und Modalität der beiden knappen Verbformen
  choice: unpersönliche rhetorische Fragen mit »man« und »kann«
  alternative: »Wird er ihn vor seinen Augen fangen? Wird er seine Nase mit Fallen durchbohren?«
  rationale: Der hebräische Text nennt das Subjekt nicht ausdrücklich und ist sehr knapp. Im Zusammenhang von Gottes Herausforderung liegt eine Frage nach menschlicher Fähigkeit nahe; die alternative Konstruktion bleibt jedoch sprachlich möglich und wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Zuspitzung und die schwierige Verbindung von »durchbohren« mit »Schlingen« wurden bewahrt, statt sie durch die kontextuell naheliegende, lexikalisch aber weniger direkte Wiedergabe »Haken« stillschweigend zu glätten.
