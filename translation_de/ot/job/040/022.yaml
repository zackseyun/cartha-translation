  source_fidelity: 'Der Text gibt die beiden parallelen hebräischen Aussagen angemessen wieder: יְסֻכֻּהוּ („bedecken/beschirmen ihn“) und יְסֻבּוּהוּ („umgeben ihn“). „mit ihrem Schatten“ ist im Deutschen eine natürliche Wiedergabe der Schattenaussage und wahrt die bildhafte Schutzfunktion. Die botanisch und geographisch nicht völlig eindeutigen Ausdrücke צֶאֱלִים und עַרְבֵי נָחַל werden nicht übermäßig festgelegt; die Alternativen sind in den Anmerkungen verfügbar.'
