  text: יְסֻכֻּ֣/הוּ צֶאֱלִ֣ים צִֽלֲל֑/וֹ יְ֝סֻבּ֗וּ/הוּ עַרְבֵי נָֽחַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/022.yaml
  text: The lotus trees cover him with their shade[b][a]; the willows of the brook surround him.
translation:
  language: de
  text: Lotusbäume[a] bedecken ihn mit ihrem Schatten; die Weiden am Bach[b] umgeben ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schattenbäume“. Welche Pflanzen mit צֶאֱלִים genau gemeint sind, ist unsicher; „Lotusbäume“ ist die traditionelle Wiedergabe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Pappeln am Wadi“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסֻכֻּהוּ
  choice: bedecken ihn
  rationale: Das Verb סכך bezeichnet hier das Bedecken beziehungsweise schützende Beschirmen. „Bedecken ihn“ gibt die Bildsprache direkt und im Deutschen natürlich wieder.
- source_word: צֶאֱלִים
  choice: Lotusbäume
  rationale: Die traditionelle botanische Bestimmung lautet „Lotusbäume“, doch die genaue Pflanzenart ist unsicher; diese Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: צִלֲלוֹ
  choice: mit ihrem Schatten
  rationale: צֵל bedeutet „Schatten“ oder „Schutz spendender Schatten“. Das singularische Suffix kann sich auf die kollektiv aufgefassten Bäume beziehen; im Deutschen ist „ihrem Schatten“ idiomatisch.
- source_word: יְסֻבּוּהוּ
  choice: umgeben ihn
  rationale: סבב bedeutet „umgeben, rings um etwas sein“. „Umgeben ihn“ bewahrt die schlichte räumliche Aussage.
- source_word: עַרְבֵי נָחַל
  choice: die Weiden am Bach
  rationale: עַרְבֵי kann Weiden oder pappelartige Uferbäume bezeichnen, und נַחַל einen Bach, Wasserlauf oder ein Wadi. „Weiden am Bach“ ist verständlich und traditionell, während die Alternative in der Fußnote erhalten bleibt.
