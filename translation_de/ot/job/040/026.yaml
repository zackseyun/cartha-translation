translation:
  language: de
  text: Kannst du ihm eine Binsenschnur durch die Nase ziehen[a] oder mit einem Haken seinen Kiefer durchbohren[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Binse“ oder „ein Schilfrohr“; das hebräische Wort bezeichnet wörtlich eine Binse oder ein Schilfrohr und kann hier eine daraus gefertigte Schnur meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Wange durchbohren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָשִׂים
  choice: Kannst du … ziehen
  rationale: Die Fragepartikel mit dem Imperfekt formuliert eine rhetorische Herausforderung. Im Zusammenhang mit einem durch die Nase geführten Gegenstand gibt „ziehen“ den Vorgang im Deutschen natürlich wieder.
- source_word: אַגְמוֹן
  choice: eine Binse
  rationale: Das Wort bezeichnet zunächst eine Binse bzw. ein Schilfgewächs. Die konkrete Bedeutung kann hier auch eine daraus gefertigte Schnur sein; die Übersetzung bewahrt das Bild des hebräischen Textes und nennt die funktionale Deutung in der Fußnote.
- source_word: בְּאַפּוֹ
  choice: durch die Nase
  rationale: אַף bedeutet „Nase“ oder „Nasenloch“. „Durch die Nase“ entspricht dem Bild des Hindurchführens und ist idiomatisches Deutsch.
- source_word: וּבְחוֹחַ
  choice: mit einem Haken
  rationale: חוֹחַ kann „Dorn“ oder „Haken“ bedeuten. Beim Fangen und Fesseln eines Tieres passt „Haken“ zum Kontext und zum parallelen Bild.
- source_word: תִּקּוֹב
  choice: durchbohren
  rationale: Das Verb bezeichnet das Durchstechen oder Durchbohren. „Durchbohren“ gibt die konkrete, gewaltsame Handlung prägnant wieder.
- source_word: לֶחֱיוֹ
  choice: seinen Kiefer
  rationale: לְחִי kann „Kiefer“ oder „Wange“ bedeuten. Im Bild eines Hakens zur Beherrschung des Tieres ist „Kiefer“ die naheliegende Wiedergabe; die Alternative bleibt in der Fußnote sichtbar.
