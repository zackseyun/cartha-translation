  text: הִנֵּה נָ֣א כֹח֣/וֹ בְ/מָתְנָ֑י/ו וְ֝/אֹנ֗/וֹ בִּ/שְׁרִירֵ֥י בִטְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/016.yaml
  text: Look now[a], his strength is in his loins[b], and his power in the muscles of his belly.
translation:
  language: de
  text: 'Sieh doch: Seine Kraft liegt in seinen Lenden und seine Stärke[a] in den Muskeln[b] seines Bauches.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lebenskraft“. Die beiden hebräischen Ausdrücke bezeichnen einander nahestehende Formen körperlicher Kraft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sehnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf das Beschriebene, während נָא die Aufforderung belebt. „Sieh doch“ ist gegenwärtiges, würdiges Deutsch und bewahrt die eindringliche Deixis ohne archaisches „Siehe nun“.
- source_word: כֹחוֹ
  choice: seine Kraft
  rationale: כֹחַ bezeichnet hier die körperliche Kraft des Tieres. „Kraft“ ist im anatomischen Zusammenhang klar und bildet mit „Stärke“ die enge poetische Parallele ab.
- source_word: בְמָתְנָיו
  choice: in seinen Lenden
  rationale: מָתְנַיִם bezeichnet die Lenden- beziehungsweise Hüftregion. „Lenden“ wahrt den weiteren anatomischen Sinn und den gehobenen poetischen Ton.
- source_word: וְאֹנוֹ
  choice: und seine Stärke
  rationale: אוֹן kann Kraft, Stärke oder Lebenskraft bezeichnen. „Stärke“ gibt die körperliche Bedeutung natürlich wieder und erhält zugleich die begriffliche Nähe, aber nicht völlige Identität, zum parallelen כֹחַ.
- source_word: בִּשְׁרִירֵי
  choice: in den Muskeln
  rationale: שְׁרִירִים bezeichnet Muskeln, Sehnen oder feste fleischige Teile. „Muskeln“ ist im modernen Deutschen die klarste anatomische Wiedergabe; die mögliche Alternative wird in einer Fußnote bewahrt.
- source_word: בִטְנוֹ
  choice: seines Bauches
  rationale: בֶּטֶן bezeichnet hier den Bauch beziehungsweise Unterleib. „Bauch“ ist direkt, verständlich und weniger fachsprachlich als „Abdomen“.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Ton. Die knappe hebräische Parallelstruktur bleibt erhalten; „Lenden“ bewahrt die traditionelle anatomische Weite, während „Muskeln“ für heutige Leser unmittelbar verständlich ist.
