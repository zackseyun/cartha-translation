  text: יַחְפֹּ֣ץ זְנָב֣/וֹ כְמוֹ אָ֑רֶז גִּידֵ֖י פחד/ו יְשֹׂרָֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/017.yaml
  text: He makes his tail stiff like a cedar[a]; the sinews of his thighs are knit together.
translation:
  language: de
  text: Er lässt seinen Schwanz steif werden wie eine Zeder; die Sehnen seiner Schenkel[a] sind miteinander verflochten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seiner Lenden«; möglicherweise genauer: »seiner Hoden«. Das hebräische Wort ist unsicher und umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: lässt ... steif werden
  rationale: Das Verb חפץ bedeutet gewöhnlich »Gefallen haben«, bezeichnet hier im Zusammenhang mit dem Schwanz und dem Vergleich mit einer Zeder aber offenbar eine körperliche Bewegung oder Festigkeit. Die Wiedergabe bewahrt das kraftvolle Bild, ohne ein emotionales Gefallen hineinzulesen.
- source_word: זְנָבוֹ
  choice: seinen Schwanz
  rationale: Wörtliche und im Deutschen natürliche Wiedergabe des Substantivs mit Suffix der 3. Person Singular maskulin.
- source_word: כְמוֹ אָרֶז
  choice: wie eine Zeder
  rationale: Der direkte Vergleich bewahrt das Bild von Größe, Stärke und Festigkeit.
- source_word: גִּידֵי
  choice: die Sehnen
  rationale: גיד bezeichnet Sehnen oder Bänder; »Sehnen« ist anatomisch verständlich und passt zum gehobenen poetischen Stil.
- source_word: פַחֲדוֹ
  choice: seiner Schenkel
  rationale: Das seltene und unsichere Wort wird im körperlichen Zusammenhang als Bezeichnung der Schenkelregion verstanden. Die lexikalische Unsicherheit und die spezifischere anatomische Deutung werden in der Fußnote kenntlich gemacht.
- source_word: יְשֹׂרָגוּ
  choice: sind miteinander verflochten
  rationale: Das Verb bezeichnet ein Verschlingen oder Verflechten. »Miteinander verflochten« gibt die enge, kräftige Verbindung der Sehnen bildhaft und natürlich wieder.
