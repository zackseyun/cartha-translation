  text: His bones are tubes of bronze[b][a]; his limbs are like bars of iron.
translation:
  language: de
  text: Seine Knochen sind Röhren[a] aus Bronze, seine Gebeine sind wie ein Eisenstab[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kanäle aus Bronze“. Das hebräische Wort kann Kanäle, Rinnen oder röhrenartige Gebilde bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ein Gussstück aus Eisen“ oder „wie ein Eisenbarren“. Die genaue Bedeutung des hebräischen Wortes ist unsicher; es bezeichnet wahrscheinlich ein gegossenes oder stabförmiges Metallstück.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָמָיו
  choice: seine Knochen
  rationale: עֶצֶם bezeichnet gewöhnlich Knochen; die konkrete anatomische Bedeutung passt zum Parallelismus.
- source_word: אֲפִיקֵי
  choice: Röhren
  rationale: אֲפִיקִים kann Kanäle, Rinnen oder röhrenartige Gebilde bezeichnen. „Röhren“ bewahrt hier das körperbezogene Bild, ohne es allgemein zu „stark wie“ abzuschwächen.
- source_word: נְחוּשָׁה
  choice: Bronze
  rationale: נְחוּשָׁה kann Kupfer oder Bronze bezeichnen; im poetischen Vergleich körperlicher Festigkeit ist „Bronze“ im Deutschen die naheliegende Wiedergabe.
- source_word: גְּרָמָיו
  choice: seine Gebeine
  rationale: גֶּרֶם kann Knochen oder Gebein bedeuten. „Gebeine“ bewahrt die enge anatomische Parallelität mit עֲצָמָיו und zugleich die poetische Variation.
- source_word: כִּמְטִיל
  choice: wie Stangen
  rationale: מָטִיל bezeichnet wahrscheinlich etwas Gegossenes beziehungsweise einen Metallstab oder -barren. „Stangen“ vermittelt im Zusammenhang Starrheit und massive Festigkeit.
- source_word: בַּרְזֶל
  choice: Eisen
  rationale: Die reguläre Bedeutung ist „Eisen“; das Metallbild steht parallel zu Bronze.
