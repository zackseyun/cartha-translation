  text: Verbirg sie[a] allesamt im Staub; binde ihre Gesichter im Verborgenen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Begrabe sie allesamt im Staub.“ Das hebräische Verb kann „verbergen“ bedeuten und im Zusammenhang mit Staub zugleich an ein Begräbnis denken lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „binde ihre Gesichter an einem verborgenen Ort“. Die hebräische Schlussformulierung ist schwierig; sie kann einen verborgenen Ort oder einen Zustand des Verborgenseins bezeichnen und greift vermutlich das Verb „verbergen“ aus der ersten Vershälfte auf.'
    reason: alternative_reading
lexical_decisions:
- source_word: טָמְנֵם
  choice: Verbirg sie
  rationale: Das Verb טמן bedeutet „verbergen, verstecken“. Die Wiedergabe bewahrt den Grundsinn und legt sich trotz des Staub- und Todesmotivs nicht vorschnell auf „begraben“ fest.
- source_word: בֶּעָפָר
  choice: im Staub
  rationale: עָפָר bezeichnet häufig Staub oder lockere Erde; „Staub“ wahrt den poetischen Klang und die mögliche Todesassoziation.
- source_word: יָחַד
  choice: allesamt
  rationale: Das Adverb bezeichnet die gemeinsame, umfassende Handlung. „Allesamt“ ist im poetisch-gehobenen Register natürlich und macht den kollektiven Bezug deutlich.
- source_word: פְּנֵיהֶם
  choice: ihre Gesichter
  rationale: Die konkrete Pluralform wird transparent wiedergegeben, ohne den möglichen metonymischen Sinn auf „sie selbst“ einzuengen.
- source_word: חֲבֹשׁ
  choice: fessle
  rationale: חבשׁ bedeutet hier „binden“. „Fessle“ gibt den befohlenen Akt des Bindens im Deutschen klar wieder und bewahrt das Bild der Bezwingung.
- source_word: בַּטָּמוּן
  choice: im Verborgenen
  rationale: Die schwierige substantivierte Form bezeichnet wahrscheinlich etwas Verborgenes oder einen verborgenen Ort. „Im Verborgenen“ erhält den Anklang an das einleitende טמן und lässt Ort und Zustand bewusst offen.
