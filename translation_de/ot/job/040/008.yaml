  text: הַ֭/אַף תָּפֵ֣ר מִשְׁפָּטִ֑/י תַּ֝רְשִׁיעֵ֗/נִי לְמַ֣עַן תִּצְדָּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/008.yaml
  text: Would you even annul my justice? Would you condemn me so that you may be justified?[a]
translation:
  language: de
  text: Willst du wirklich mein Recht aufheben? Willst du mich schuldig sprechen, damit du im Recht bist?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Urteil“. Das hebräische Wort kann Recht, Gerechtigkeit oder Urteil bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאַף
  choice: Willst du wirklich
  rationale: Die Verbindung der Fragepartikel mit אַף verstärkt die entrüstete rhetorische Frage. „Wirklich“ gibt diesen Nachdruck im heutigen Deutsch natürlich wieder.
- source_word: תָּפֵר
  choice: aufheben
  rationale: Das Hifil von פרר bezeichnet das Außerkraftsetzen oder Ungültigmachen. „Aufheben“ bewahrt hier den rechtlichen Sinn und ist allgemein verständlich.
- source_word: מִשְׁפָּטִי
  choice: mein Recht
  rationale: מִשְׁפָּט kann Recht, Gerechtigkeit oder Urteil bezeichnen. „Mein Recht“ erhält die juristische Mehrdeutigkeit zwischen Gottes gerechtem Handeln, Rechtsanspruch und richterlicher Entscheidung; „mein Urteil“ wird als Alternative in der Fußnote genannt.
- source_word: תַּרְשִׁיעֵנִי
  choice: mich schuldig sprechen
  rationale: 'Das Hifil von רשע ist forensisch: jemanden für schuldig erklären. „Schuldig sprechen“ macht diesen Gerichtskontext präzise und verständlich.'
- source_word: לְמַעַן
  choice: damit
  rationale: לְמַעַן bezeichnet hier Zweck beziehungsweise beabsichtigte Folge. „Damit“ ist die natürliche deutsche Entsprechung.
- source_word: תִּצְדָּק
  choice: du im Recht bist
  rationale: Das Qal von צדק bezeichnet im forensischen Gegensatz zu „schuldig sprechen“ das Rechtbehalten beziehungsweise Als-gerecht-Erwiesenwerden. „Im Recht sein“ klingt im modernen Deutsch natürlicher als das missverständliche „gerechtfertigt werden“ und bewahrt den gerichtlichen Kontrast.
theological_decisions:
- issue: Forensische oder allgemein moralische Wiedergabe
  choice: Die forensische Sprache wird mit „Recht“, „schuldig sprechen“ und „im Recht sein“ bewahrt.
  alternative: Eine allgemein moralische Fassung wie „meine Gerechtigkeit bestreiten … mich ins Unrecht setzen, damit du recht hast“.
  rationale: מִשְׁפָּט, das Hifil von רשע und צדק bilden einen deutlich gerichtlichen Wortzusammenhang. Die Übersetzung erhält dadurch die Spannung, dass Hiobs Selbstrechtfertigung als Anklage gegen Gottes Recht erscheint, ohne diese Spannung konfessionell auszudeuten.
- issue: Bedeutungsumfang von מִשְׁפָּטִי
  choice: mein Recht
  alternative: meine Gerechtigkeit; mein Urteil
  rationale: „Mein Recht“ lässt mehrere Aspekte des hebräischen Begriffs anklingen. Da „mein Urteil“ ebenfalls möglich ist, wird es in einer Fußnote ausgewiesen, statt die Mehrdeutigkeit stillschweigend auszuschließen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallelen Fragen und der juristische Wortzusammenhang des Hebräischen bleiben deutlich; „wirklich“ trägt den entrüsteten Nachdruck, ohne altertümlich zu wirken.
