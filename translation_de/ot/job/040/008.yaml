  source_fidelity: Die Übersetzung gibt die verstärkte rhetorische Frage von הַאַף angemessen wieder. „Mein Recht aufheben“ trifft die forensisch geprägte Mehrdeutigkeit von מִשְׁפָּטִי im Rahmen des Deutschen ausreichend; „mich schuldig sprechen“ und „du im Recht bist“ bewahren den Gegensatz von רשע im Hifil und צדק im Qal. „Damit“ gibt לְמַעַן idiomatisch als Zweckangabe wieder.
