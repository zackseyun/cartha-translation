  yaml_path: translation/ot/job/040/027.yaml
  text: Will he make many pleas to you[b][a], or will he speak soft words to you?
translation:
  language: de
  text: Wird er viele Bitten an dich richten oder wird er sanfte Worte zu dir sprechen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲיַרְבֶּה
  choice: Wird er … überschütten
  rationale: Die Hifil-Form von רבה bedeutet, etwas zahlreich zu machen oder zu vermehren. Mit „Flehen“ gibt „überschütten“ die Fülle der Bitten in natürlichem Deutsch wieder, ohne den Sinn zu verschärfen.
- source_word: אֵלֶיךָ
  choice: dich / zu dir
  rationale: Die Präposition אֶל mit Suffix bezeichnet die Ausrichtung auf das angesprochene Gegenüber. Im ersten Satzteil verlangt idiomatisches Deutsch das Akkusativobjekt „dich“, im zweiten „zu dir“.
- source_word: תַּחֲנוּנִים
  choice: Flehen
  rationale: Das Substantiv bezeichnet eindringliche Bitten um Gunst oder Erbarmen. „Flehen“ ist gegenwärtig, würdig und bewahrt die Intensität des hebräischen Ausdrucks.
- source_word: אִם
  choice: oder
  rationale: Im parallelen Fragesatz leitet אִם die zweite Alternative ein; daher ist hier „oder“ statt des konditionalen „wenn“ angemessen.
- source_word: יְדַבֵּר
  choice: sagen
  rationale: דבר bedeutet „reden/sprechen“. In Verbindung mit „Worte“ ist „Worte sagen“ im Deutschen natürlicher als „Worte sprechen“ und erhält den sachlichen Sinn.
- source_word: רַכּוֹת
  choice: sanfte Worte
  rationale: Das feminine Pluraladjektiv von רך wird substantivisch gebraucht und bezeichnet Sanftes im Reden. „Sanfte Worte“ bewahrt die offene Bedeutung, ohne wie „schmeichelnde Worte“ unzulässig eine Täuschungsabsicht anzudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem rhetorischem Ton. Die beiden parallelen Fragen sind zu einem flüssigen Satz verbunden; die direkte Anrede im maskulinen Singular bleibt im Deutschen formal unmarkiert.
