  text: הִנֵּה נָ֣א בְ֭הֵמוֹת אֲשֶׁר עָשִׂ֣יתִי עִמָּ֑/ךְ חָ֝צִ֗יר כַּ/בָּקָ֥ר יֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/015.yaml
  text: Look now at Behemoth[a], which I made along with you; he eats grass like an ox.
translation:
  language: de
  text: Sieh doch den Behemot[a], den ich zusammen mit dir gemacht habe; er frisst Gras wie ein Rind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Tier“. Viele verstehen „Behemot“ als Namen oder Bezeichnung eines bestimmten großen Geschöpfs; andere halten es für das Nilpferd oder ein anderes großes Tier.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: Die Verbindung lenkt nachdrücklich und unmittelbar die Aufmerksamkeit auf das Folgende. „Sieh doch“ ist im heutigen Deutsch natürlich und bewahrt den auffordernden Ton.
- source_word: בְהֵמוֹת
  choice: Behemot
  rationale: Der Ausdruck ist mit dem gewöhnlichen Wort für Tier beziehungsweise Vieh verwandt, bezeichnet hier im poetischen Zusammenhang aber offenbar ein bestimmtes großes Geschöpf. Die Transliteration vermeidet eine vorschnelle zoologische Festlegung.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: den ich … gemacht habe
  rationale: Das Relativpronomen bezieht sich auf den im Deutschen maskulinen „Behemot“; עשה wird schlicht und treffend mit „machen“ wiedergegeben.
- source_word: עִמָּךְ
  choice: ebenso wie dich
  rationale: Die Formulierung drückt hier am ehesten aus, dass Gott sowohl Behemot als auch den angesprochenen Menschen geschaffen hat. Sie vermeidet die missverständliche räumliche Lesart „bei dir“.
- source_word: חָצִיר
  choice: Gras
  rationale: Das Wort bezeichnet Gras oder Grünfutter; „Gras“ ist die klare und natürliche Entsprechung.
- source_word: כַּבָּקָר
  choice: wie ein Rind
  rationale: בקר kann kollektiv „Rinder/Vieh“ bezeichnen. Im deutschen Vergleich ist „wie ein Rind“ anschaulich, ohne das Geschlecht unnötig auf „Stier“ oder die Funktion auf „Ochse“ festzulegen.
- source_word: יֹאכֵל
  choice: er frisst
  rationale: Das maskuline Singularverb bezieht sich auf Behemot. Bei einem Tier ist „frisst“ im Deutschen idiomatisch und bewahrt den maskulinen Bezug.
theological_decisions:
- issue: Identität von בְהֵמוֹת
  choice: Als Bezeichnung eines bestimmten Geschöpfs behandeln und „Behemot“ transliterieren.
  alternative: Generisch „das Tier“ übersetzen oder ausdrücklich mit dem Nilpferd beziehungsweise einem anderen bekannten Tier identifizieren.
  rationale: Wortform und dichterischer Zusammenhang erlauben unterschiedliche zoologische Deutungen, legen aber keine davon ausdrücklich fest. Die Transliteration bewahrt diese Offenheit und die literarische Wirkung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh doch“ gibt die aufmerksamkeitslenkende Aufforderung natürlich wieder; „Behemot“ bewahrt die absichtliche Offenheit des hebräischen Ausdrucks.
