  text: תַּֽחַת צֶאֱלִ֥ים יִשְׁכָּ֑ב בְּ/סֵ֖תֶר קָנֶ֣ה וּ/בִצָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/021.yaml
  text: Under the lotus trees he lies down[a], in the shelter of the reeds and the marsh.
translation:
  language: de
  text: Unter Lotusbäumen liegt es, im Schutz von Schilf und Sumpf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unter schattenspendenden Bäumen“. Welche Pflanzenart das hebräische Wort genau bezeichnet, ist unsicher; „Lotusbäume“ ist eine verbreitete Deutung aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: Unter
  rationale: Die Präposition bezeichnet die Lage unterhalb beziehungsweise im Schatten der genannten Pflanzen; „unter“ ist im Deutschen natürlich und präzise.
- source_word: צֶאֱלִים
  choice: Lotussträuchern
  rationale: Der seltene Pflanzenname wird im Flussuferkontext häufig als Lotusgewächs verstanden. „Lotussträucher“ gibt die schattenspendende, verholzende Vegetation wieder, ohne sie als große Bäume festzulegen; die Unsicherheit der Bestimmung wird in der Fußnote bewahrt.
- source_word: יִשְׁכָּב
  choice: liegt es
  rationale: Das Qal-Imperfekt beschreibt hier einen charakteristischen beziehungsweise anschaulich gegenwärtigen Zustand. Das sächliche Pronomen nimmt das im Deutschen übliche „Behemot“ auf.
- source_word: בְּסֵתֶר
  choice: im Schutz
  rationale: סֵתֶר bezeichnet einen geschützten oder verborgenen Ort. „Im Schutz“ ist natürlich und passt zur Deckung durch die Ufervegetation.
- source_word: קָנֶה
  choice: Schilf
  rationale: Der formale Singular kann kollektiv gebraucht sein. „Schilf“ ist im Deutschen ebenfalls ein natürliches Kollektivum für den Pflanzenbestand.
- source_word: וּבִצָּה
  choice: und Sumpf
  rationale: בִּצָּה bezeichnet sumpfiges Gelände. In der Verbindung „Schilf und Sumpf“ bleiben beide von בְ abhängigen Größen eng zusammengefasst.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe poetische Bildfolge des Hebräischen bleibt erhalten. Das Pronomen „es“ entspricht dem grammatischen Geschlecht von „Behemot“ im deutschen Kontext; der Fußnotenmarker steht am Versende, da er die unsichere Pflanzenbestimmung im ersten Satzteil erläutert.
