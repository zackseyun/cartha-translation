  text: Will you play with him like a bird[b][a], or tie him up for your girls?
translation:
  language: de
  text: Wirst du mit ihm[a] spielen wie mit einem Vogel oder ihn für deine Mädchen[b] anbinden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verwendet ein maskulines Singularpronomen und bezieht sich auf den Leviatan; bei einem Tier wäre im Deutschen auch „damit“ möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für deine jungen Frauen“; das hebräische Wort kann Mädchen oder junge Frauen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׂחֶק
  choice: Wirst du … spielen
  rationale: שׂחק bezeichnet hier das Spielen bzw. Sichvergnügen; in der rhetorischen Frage ist „spielen“ natürlich und bewahrt das Bild eines zahmen Tieres.
- source_word: בּוֹ
  choice: mit ihm
  rationale: Das maskuline Singularsuffix verweist auf den Leviatan. „Ihm“ bewahrt diese grammatische und diskursive Bezugnahme.
- source_word: כַּצִּפּוֹר
  choice: wie mit einem Vogel
  rationale: צִפּוֹר ist die gewöhnliche Bezeichnung für einen Vogel. Die Präposition bei „spielen“ wird im Deutschen in den Vergleich einbezogen, sodass die Formulierung idiomatisch bleibt.
- source_word: וְתִקְשְׁרֶנּוּ
  choice: oder ihn … anbinden
  rationale: קשר bedeutet binden bzw. festbinden. „Anbinden“ passt im Deutschen besonders gut zum Bild eines für den häuslichen Umgang festgehaltenen Tieres; das hebräische וְ verbindet hier zwei parallele rhetorische Möglichkeiten und wird natürlich mit „oder“ wiedergegeben.
- source_word: לְנַעֲרוֹתֶיךָ
  choice: für deine Mädchen
  rationale: נַעֲרוֹת bezeichnet weibliche Jugendliche bzw. junge Frauen. „Mädchen“ ist gegenwärtig, verständlich und wahrt den femininen Plural, ohne das altertümliche „Jungfrauen“ einzutragen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die rhetorische Frage und das absichtlich unrealistische Bild des Leviatans als Spieltier bleiben erhalten. „Anbinden“ ist anschaulich und weniger gehoben als „fesseln“, ohne umgangssprachlich zu wirken.
