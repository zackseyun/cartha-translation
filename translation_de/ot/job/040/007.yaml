review_pass:
  verdict: revise
  source_fidelity: Der Imperativ „Gürte dir … die Hüften“ gibt אֱזָר … חֲלָצֶיךָ sachgerecht wieder; „doch“ kann נָא als nachdrückliche Partikel angemessen abbilden. „wie ein Mann“ entspricht כגבר. Die Wiedergabe von וְהוֹדִיעֵנִי als „belehre mich“ ist jedoch stärker und im Deutschen semantisch enger als das kausative „lass mich wissen / teile mir mit“; sie legt eine Lehrerrolle Hiobs nahe, die der hebräische Ausdruck nicht ausdrücklich bezeichnet.
  naturalness: „Gürte dir doch wie ein Mann die Hüften!“ ist verständlich, aber die Stellung von „wie ein Mann“ innerhalb der Verbgruppe wirkt leicht schwerfällig. „Gürte deine Hüften wie ein Mann!“ ist idiomatischer und bewahrt Bild und Nachdruck. „Tu es mir kund“ ist würdiges, modernes Standarddeutsch und knapp genug für die herausfordernde Rede.
  terminology: „Hüften“ ist als moderne Wiedergabe von חֲלָצַיִם vertretbar. „Mann“ soll im Haupttext stehen bleiben. Für הודיע ist „Tu es mir kund“ dem „belehre mich“ vorzuziehen, weil es das Veranlassen zum Wissen ausdrückt, ohne die zusätzliche Bedeutung „unterrichten/belehren“ festzulegen.
  issues:
  - severity: medium
    issue: „und du belehre mich“ überbestimmt וְהוֹדִיעֵנִי.
    rationale: Der Hifil von ידע fordert auf, etwas wissen zu lassen bzw. kundzutun. „Belehren“ kann zwar kontextuell möglich sein, bezeichnet aber spezifischer das Unterrichten und verändert damit die Aussage leicht.
  - severity: low
    issue: Die Fußnote erklärt die Redewendung, obwohl der deutsche Haupttext sie bereits als konkrete Hüft-Metapher wiedergibt.
    rationale: Eine knappe Alternative kann die Stärke-Nuance von גבר erläutern; die bisherige wörtliche Wiederholung ist wenig informativ und die Formulierung „kann ... anklingen lassen“ ist unnötig ausgreifend.
  revised_text: Gürte deine Hüften wie ein Mann! Ich will dich fragen, und tu es mir kund.
