  text: אֱזָר נָ֣א כְ/גֶ֣בֶר חֲלָצֶ֑י/ךָ אֶ֝שְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/007.yaml
  text: Gird up your loins like a man; I will question you[a], and you shall make it known to me.
translation:
  language: de
  text: Gürte deine Hüften wie ein Mann! Ich will dich fragen, und tu es mir kund.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱזָר נָא
  choice: Gürte dir doch
  rationale: Der Imperativ von אזר bezeichnet das Umschließen oder Festgürten. „Gürte dir … die Hüften“ bewahrt das konkrete Bild der Vorbereitung; „doch“ gibt den nachdrücklich auffordernden Ton der Partikel נָא wieder, ohne sie irreführend als Zeitangabe zu übersetzen.
- source_word: כְגֶבֶר
  choice: wie ein Mann
  rationale: גבר bezeichnet einen Mann und kann zugleich Stärke oder Wehrhaftigkeit anklingen lassen. Die Wiedergabe erhält die geschlechtsspezifische Form und lässt die Kraftnuance aus dem Zusammenhang hervorgehen.
- source_word: חֲלָצֶיךָ
  choice: die Hüften
  rationale: חלצים bezeichnet den Hüft- beziehungsweise Lendenbereich. „Hüften“ ist im heutigen Deutsch verständlicher als „Lenden“ und bewahrt dennoch das körperliche Bild des hebräischen Ausdrucks.
- source_word: אֶשְׁאָלְךָ
  choice: Ich will dich fragen
  rationale: שאל bedeutet „fragen“. Die Konstruktion kündigt Gottes unmittelbar folgende Befragung an; „ich will“ bewahrt den bestimmten, herausfordernden Ton.
- source_word: וְהוֹדִיעֵנִי
  choice: und du belehre mich
  rationale: Der Hifil von ידע bedeutet „wissen lassen, kundtun, unterrichten“. „Belehre mich“ gibt die kausative Aufforderung knapp und würdig wieder und passt zur rhetorischen Herausforderung, ohne sie zum bloßen „Antworte mir“ zu verengen.
theological_decisions:
- issue: Geschlechtsspezifische Sprache in גבר
  choice: wie ein Mann
  alternative: wie ein Krieger / wie ein starker Mann
  rationale: Die maskuline Bezeichnung wird nicht neutralisiert. Zugleich wird die mögliche Nebenbedeutung von Stärke oder Wehrhaftigkeit in der Fußnote offengehalten.
- issue: Rhetorischer Charakter von וְהוֹדִיעֵנִי
  choice: und du belehre mich
  alternative: und lass es mich wissen / und gib mir Auskunft
  rationale: 'Die Formulierung wahrt die Spannung der göttlichen Herausforderung: Hiob wird tatsächlich zum Belehren aufgefordert, obwohl der Zusammenhang die Ironie dieser Aufforderung erkennen lässt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete hebräische Körperbild bleibt im Haupttext erhalten; die heute weniger geläufige Redewendung wird in der Fußnote erläutert. Der Satzbau bleibt knapp und herausfordernd.
