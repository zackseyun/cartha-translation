  text: שִׂים עָלָ֥י/ו כַּפֶּ֑/ךָ זְכֹ֥ר מִ֝לְחָמָ֗ה אַל תּוֹסַֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/032.yaml
  text: Lay your hand on him[a]; remember the battle—you will not do it again.
translation:
  language: de
  text: Leg deine Hand an ihn! Denk an den Kampf – tu es nicht noch einmal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »Füge nicht hinzu«; idiomatisch: »Tu es nicht weiter/noch einmal.« Im Kontext kann dies auch die Folgerung ausdrücken: »Du wirst es nicht wieder tun.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים
  choice: Leg
  rationale: Der Imperativ bedeutet wörtlich »lege/setze«. In Verbindung mit »Hand« ist »Leg deine Hand an ihn« im Deutschen natürlich und bewahrt die Aufforderung.
- source_word: עָלָיו
  choice: an ihn
  rationale: עַל mit Suffix der 3. Person Singular kann hier die gegen Leviatan gerichtete Berührung oder den Zugriff bezeichnen. Im Deutschen gibt »die Hand an jemanden legen« diesen bedrohlichen Zugriff idiomatisch wieder.
- source_word: כַּפֶּךָ
  choice: deine Hand
  rationale: כַּף bezeichnet die Handfläche beziehungsweise die Hand. »Hand« ist in diesem Zusammenhang die natürliche deutsche Entsprechung.
- source_word: זְכֹר
  choice: Denk an
  rationale: Der Imperativ von זכר bedeutet »erinnere dich/gedenke«. »Denk an« klingt in der unmittelbaren Warnung natürlich und bewahrt den direkten Aufforderungscharakter.
- source_word: מִלְחָמָה
  choice: den Kampf
  rationale: מִלְחָמָה bezeichnet Krieg oder Kampf. Bei der persönlichen Konfrontation mit Leviatan passt »Kampf« besser als das allgemeinere »Krieg«.
- source_word: אַל תּוֹסַף
  choice: du wirst es nicht wieder tun
  rationale: Wörtlich steht eine verneinte Form von »hinzufügen/fortfahren«. Im Zusammenhang bezeichnet sie idiomatisch, dass der Versuch nach dieser Kampferfahrung nicht wiederholt wird; die deutsche Fassung gibt dies als warnende Folgerung wieder.
theological_decisions:
- issue: Modalität von אַל תּוֹסַף
  choice: 'als warnende Folgerung: »du wirst es nicht wieder tun«'
  alternative: 'als Verbot: »Tu es nicht noch einmal«'
  rationale: Die hebräische Konstruktion ist formal eine verneinte Aufforderung, kann im Kontext aber die sichere Folge der Begegnung ausdrücken. Die Hauptfassung folgt dieser kontextuellen Lesart, während die Fußnote die wörtlichere Form und die mögliche Aufforderungsnuance offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Aufforderungen und der Gedankenstrich bewahren die zugespitzte Warnung des hebräischen Textes.
