  text: רְאֵ֣ה כָל גֵּ֭אֶה הַכְנִיעֵ֑/הוּ וַ/הֲדֹ֖ךְ רְשָׁעִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/012.yaml
  text: Look on everyone who is proud[a], and humble him; and tread down the wicked where they stand.
translation:
  language: de
  text: Sieh jeden Hochmütigen an und erniedrige ihn; tritt die Frevler nieder, wo sie stehen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an ihrer Stelle“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Sieh … an
  rationale: Der Imperativ von ראה fordert Hiob auf, seinen Blick gezielt auf die Hochmütigen als Gegenstand des Gerichts zu richten.
- source_word: כָל גֵּאֶה
  choice: jeden Hochmütigen
  rationale: כָל mit substantiviertem Adjektiv bezeichnet distributiv jeden Angehörigen dieser Gruppe; die Formulierung ist knapp und natürlich.
- source_word: הַכְנִיעֵהוּ
  choice: erniedrige ihn
  rationale: Der Hifil-Imperativ von כנע mit maskulinem Singularsuffix bedeutet, den Hochmütigen niedrig zu machen. „Erniedrige“ erhält den Gegensatz zu seinem Hochmut.
- source_word: וַהֲדֹךְ
  choice: tritt … nieder
  rationale: Das seltene Verb bezeichnet ein gewaltsames Niederdrücken oder Zerschmettern. „Niedertreten“ wahrt das konkrete Gerichtsbild, ohne die Bedeutung unnötig festzulegen.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: רְשָׁעִים bezeichnet Menschen, die moralisch schuldig und gottlos handeln; „Frevler“ ist im würdigen biblischen Register prägnant.
- source_word: תַּחְתָּם
  choice: wo sie stehen
  rationale: תחת mit Suffix kann hier örtlich „an ihrer Stelle“ beziehungsweise „dort, wo sie sind“ bedeuten. Die gewählte Fassung gibt diesen Sinn idiomatisch wieder.
theological_decisions:
- issue: Art des an Hiob gerichteten Befehls
  choice: Die Imperative als unmittelbare göttliche Herausforderung wiedergeben, ohne Hiob tatsächlich göttliche Gerichtsgewalt zuzuschreiben.
  alternative: Die Aufforderungen ausdrücklich als hypothetisch oder unmöglich kennzeichnen.
  rationale: Der Kontext macht die Herausforderung deutlich, doch der Vers selbst formuliert echte Imperative. Die Übersetzung bewahrt diese Spannung, statt sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus bleibt erhalten; „Hochmütigen“ und „erniedrige“ bilden den beabsichtigten Gegensatz. Der Fußnotenmarker steht an der Wendung, auf die sich die örtliche Alternative bezieht.
