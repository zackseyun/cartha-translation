  yaml_path: translation/ot/job/040/028.yaml
  text: Will he make a covenant with you[b][a], that you would take him as a servant forever?
translation:
  language: de
  text: Wird er einen Bund mit dir schließen[a]? Wirst du ihn für immer als Sklaven[b] nehmen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Bund mit dir schneiden“; dies ist eine feste hebräische Wendung für „einen Bund schließen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als Diener“. Das hebräische Wort kann sowohl einen Diener als auch einen Sklaven bezeichnen; hier steht die dauerhafte Verfügungsgewalt im Vordergrund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִכְרֹת בְּרִית
  choice: Wird er einen Bund … schließen
  rationale: כרת ברית ist die feste hebräische Wendung für das Schließen eines Bundes. Das Fragewort הֲ wird durch die Entscheidungsfrage wiedergegeben.
- source_word: עִמָּךְ
  choice: mit dir
  rationale: Die Präpositionalverbindung bezeichnet den Partner des Bundes und spricht Job direkt an.
- source_word: תִּקָּחֶנּוּ
  choice: sodass du ihn … nimmst
  rationale: לקח bedeutet „nehmen“; das Suffix bezeichnet das zuvor angesprochene Tier. „Sodass“ gibt den Zusammenhang mit dem erwarteten Ergebnis der Vereinbarung natürlich wieder, ohne ihn unnötig zu präzisieren.
- source_word: לְעֶבֶד
  choice: zum Sklaven
  rationale: עבד kann „Diener“ oder „Sklave“ bedeuten. In Verbindung mit dauerhafter Verfügung hebt der Kontext den Status als Besitz und damit „Sklave“ hervor.
- source_word: עוֹלָם
  choice: für immer
  rationale: עוֹלָם bezeichnet hier eine unbegrenzte beziehungsweise dauerhafte Zeitspanne; „für immer“ bewahrt die rhetorische Zuspitzung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt erhalten; die traditionelle Bundesformulierung „einen Bund schließen“ ist natürlich und quellennah.
