  language: de
  text: Da antwortete Hiob Jahwe und sagte:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: יהוה (JHWH); auch als „Jehova“ wiedergegeben.'
    reason: Hinweis auf die hebräische Schreibung des Gottesnamens und auf eine traditionelle alternative Wiedergabe.
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: Das Qal-Wayyiqtol von ענה leitet Hiobs Erwiderung ein. „Antwortete“ ist hier die natürliche und zugleich formtreue deutsche Wiedergabe.
- source_word: אִיּוֹב
  choice: Hiob
  rationale: Der Eigenname wird gemäß der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: אֶת
  choice: '[nicht gesondert übersetzt]'
  rationale: Der hebräische Akkusativmarker hat keine eigenständige deutsche Entsprechung; seine Funktion wird durch Satzbau und Kasus ausgedrückt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Umschrift.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Das Qal-Wayyiqtol von אמר bildet zusammen mit „antwortete“ die hebräische Redeeinleitungsformel. Beide Verben bleiben erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: JHWH; Jehova; der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als Gottesnamen. „Jahwe“ bewahrt den Charakter als Eigenname und entspricht der üblichen modernen deutschen Umschrift; die Unsicherheit der historischen Aussprache wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die formelhafte Doppelung „antwortete … und sagte“ bleibt zur Wahrung der hebräischen Erzählstruktur erhalten.
