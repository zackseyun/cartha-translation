base_translation:
  language: en
  yaml_path: translation/ot/job/040/001.yaml
  text: And Yahweh answered Job and said:[a]
translation:
  language: de
  text: 'Da antwortete Jahwe[a] Hiob und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; auch als „Jehova“ wiedergegeben.'
    reason: Erläuterung der hebräischen Form des Gottesnamens und einer alternativen Wiedergabe.
lexical_decisions:
- source_word: וַיַּעַן
  choice: Da antwortete
  rationale: Das Verb ענה bezeichnet hier im erzählerischen Dialog ein Antworten. „Da“ gibt die fortschreitende hebräische Erzählungsform im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: אֶת kennzeichnet „Hiob“ als bestimmtes direktes Objekt und hat im Deutschen keine eigene Entsprechung.
- source_word: אִיּוֹב
  choice: Hiob
  rationale: „Hiob“ ist die im Deutschen etablierte Form des hebräischen Personennamens אִיּוֹב.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: אמר ist das gewöhnliche Verb für „sagen“. Beide hebräischen Redeverben werden beibehalten; die Formel „antwortete … und sagte“ ist gehoben, aber verständlich und bildet den Ausgangstext genau ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt den Eigennamen und ist im modernen Deutschen die gebräuchliche wissenschaftliche Umschrift; die Fußnote weist auf die hebräische Namensform und weitere Wiedergaben hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Redeformel des Hebräischen wird aus Gründen der formalen Treue bewahrt; der Doppelpunkt leitet die folgende Gottesrede ein.
