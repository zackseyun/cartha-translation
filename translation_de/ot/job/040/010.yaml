  text: עֲדֵ֥ה נָ֣א גָֽא֣וֹן וָ/גֹ֑בַהּ וְ/ה֖וֹד וְ/הָדָ֣ר תִּלְבָּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/010.yaml
  text: Adorn yourself[a], please, with majesty and loftiness, and clothe yourself with splendor and honor.
translation:
  language: de
  text: Schmücke dich doch mit Hoheit und Erhabenheit, und kleide dich in Glanz und Würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲדֵה
  choice: Schmücke dich
  rationale: Der Imperativ bezeichnet hier, sich selbst mit etwas zu schmücken oder zu umgeben. Die Wiedergabe ist im Deutschen natürlich und nimmt das parallele Bild des Sich-Kleidens auf.
- source_word: נָא
  choice: doch
  rationale: Die Partikel verstärkt hier die auffordernde, herausfordernde Rede. Im Kontext von Gottes Antwort an Hiob trifft „doch“ den Ton besser als ein höflich klingendes „bitte“ oder das zeitliche „nun“.
- source_word: גָאוֹן
  choice: Hoheit
  rationale: Im Zusammenhang bezeichnet das Wort erhabene, majestätische Größe und nicht notwendig sündhaften Stolz. „Hoheit“ passt zum königlichen und göttlichen Bedeutungsfeld.
- source_word: גֹּבַהּ
  choice: Erhabenheit
  rationale: Wörtlich bezeichnet das Wort Höhe; parallel zu גָאוֹן meint es hier erhöhte Größe. „Erhabenheit“ bewahrt das Bild, ohne vorschnell die negative Wertung „Hochmut“ einzutragen.
- source_word: הוֹד
  choice: Glanz
  rationale: Das Wort bezeichnet sichtbare Pracht und stattliche Herrlichkeit. „Glanz“ ist poetisch, verständlich und unterscheidet sich klar von „Hoheit“.
- source_word: הָדָר
  choice: Würde
  rationale: Das Wort kann Pracht, Majestät oder ehrwürdige Zierde bezeichnen. „Würde“ gibt im parallelen Begriffspaar eine verwandte, aber eigenständige Nuance wieder.
- source_word: תִּלְבָשׁ
  choice: kleide dich
  rationale: Die Form führt die Aufforderung fort und bewahrt ausdrücklich die Kleidungsmetapher des hebräischen Textes.
theological_decisions:
- issue: Ob גָאוֹן und גֹּבַהּ negativ als Stolz und Hochmut oder positiv als majestätische Größe wiederzugeben sind
  choice: Hoheit und Erhabenheit
  alternative: Stolz und Hochmut
  rationale: Gott fordert Hiob im unmittelbaren Zusammenhang heraus, die überwältigende Größe und Herrschaftsmacht anzulegen, die Gott zukommen. Das Kleidungsbild und die Verbindung mit Glanz und Würde sprechen hier eher für majestätische Attribute als für moralische Laster; die grundsätzlich mögliche Spannung der Wörter wird durch die kontextgerechte Wortwahl nicht unnötig negativ festgelegt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischer Parallelstruktur. „Doch“ vermittelt die rhetorische Herausforderung des göttlichen Redens, ohne altertümlich oder übermäßig höflich zu wirken.
