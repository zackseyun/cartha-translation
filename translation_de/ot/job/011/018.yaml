  text: And you will be secure[a], because there is hope; you will look around and lie down in safety.
translation:
  language: de
  text: Dann wirst du zuversichtlich sein, denn es gibt Hoffnung; du wirst dich umsehen[a] und dich sicher niederlegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du wirst graben“. Das hebräische Verb bezeichnet wörtlich das Graben; hier kann es darum gehen, die Umgebung zu prüfen oder einen Platz herzurichten, bevor man sich niederlegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָטַחְתָּ
  choice: Dann wirst du zuversichtlich sein
  rationale: בטח bezeichnet hier aufgrund der vorhandenen Hoffnung einen Zustand der Zuversicht und Sicherheit. „Zuversichtlich sein“ ist im Deutschen natürlich und vermeidet die mögliche Fehlbedeutung, äußerlich abgesichert zu sein.
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: denn es gibt Hoffnung
  rationale: תִּקְוָה bedeutet gewöhnlich „Hoffnung“ oder „Erwartung“; כִּי begründet hier die vorausgehende Zuversicht.
- source_word: וְחָפַרְתָּ
  choice: du wirst dich umsehen
  rationale: חפר bedeutet wörtlich „graben“, kann hier jedoch das prüfende Umschauen oder Herrichten eines Ruheplatzes bezeichnen. Die flüssige Haupttextfassung wahrt den Kontext; die konkrete lexikalische Alternative bleibt in der Fußnote erhalten.
- source_word: לָבֶטַח
  choice: sicher
  rationale: Die adverbiale Wendung bezeichnet ein Liegen in Sicherheit oder ohne Furcht; „sicher“ verbindet sich im Deutschen natürlich mit „sich niederlegen“.
- source_word: תִּשְׁכָּב
  choice: dich niederlegen
  rationale: שׁכב bedeutet konkret „liegen“ beziehungsweise „sich niederlegen“. Die reflexive deutsche Form gibt die Handlung idiomatisch wieder, ohne sie zum allgemeineren „ruhen“ abzuschwächen.
