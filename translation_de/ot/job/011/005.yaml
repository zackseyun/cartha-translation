  text: וְֽ/אוּלָ֗ם מִֽי יִתֵּ֣ן אֱל֣וֹהַּ דַּבֵּ֑ר וְ/יִפְתַּ֖ח שְׂפָתָ֣י/ו עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/005.yaml
  text: But if only God would speak and open his lips against you,[a]
translation:
  language: de
  text: Doch wenn Gott nur reden und seine Lippen dir gegenüber öffnen würde![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit dir« oder »zu dir«. Die hebräische Präposition bedeutet wörtlich »mit«; im Zusammenhang kann die Anrede zugleich konfrontativ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Doch
  rationale: Kennzeichnet einen deutlichen Gegensatz zu Zofars vorausgehender Klage und klingt im modernen Deutschen natürlich.
- source_word: מִי יִתֵּן
  choice: wenn … nur … würde
  rationale: Die feste Wendung drückt einen nachdrücklichen Wunsch aus, keine wörtliche Frage danach, wer etwas geben werde.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Der singularische Gottesname wird ohne sachlich unbegründete Erweiterung wiedergegeben.
- source_word: דַּבֵּר
  choice: reden … würde
  rationale: Im Anschluss an die Wunschformel bezeichnet die Form die herbeigewünschte Handlung; der deutsche Konjunktiv gibt dies idiomatisch wieder.
- source_word: וְיִפְתַּח
  choice: und … öffnen würde
  rationale: Die zweite, koordinierte Handlung bleibt ausdrücklich erhalten.
- source_word: שְׂפָתָיו
  choice: seine Lippen
  rationale: Bewahrt das konkrete anthropomorphe Bild des hebräischen Textes, statt es zu »Mund« oder bloßem »Sprechen« zu verflachen.
- source_word: עִמָּךְ
  choice: gegen dich
  rationale: Die Präposition bedeutet grundsätzlich »mit«, erhält hier aber im Zusammenhang von Zofars erwarteter göttlicher Entgegnung wahrscheinlich konfrontativen Sinn.
theological_decisions:
- issue: 'Anthropomorphe Rede von Gott: »seine Lippen öffnen«'
  choice: Das körperhafte Sprachbild wird unmittelbar beibehalten.
  alternative: Zu »zu dir sprechen« umschreiben.
  rationale: Die Bildsprache bezeichnet Gottes Reden, ohne eine Aussage über seine Körperlichkeit erzwingen zu müssen; ihre Bewahrung folgt dem hebräischen Ausdruck.
- issue: Bedeutungsrichtung von עִמָּךְ
  choice: 'konfrontativ: »gegen dich«'
  alternative: »mit dir« oder »zu dir«
  rationale: Zofar wünscht, dass Gott auf Hiobs Aussagen antwortet und ihm entgegentritt. Da die hebräische Präposition selbst wörtlich »mit« heißen kann, bleibt diese echte lexikalische Mehrdeutigkeit in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wunschkonstruktion ist idiomatisch formuliert; das markante Bild vom Öffnen der Lippen und die kontextuelle Schärfe der Anrede bleiben erhalten.
