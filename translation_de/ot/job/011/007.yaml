  yaml_path: translation/ot/job/011/007.yaml
  text: Can you discover the depths of God? Can you find the limit of the Almighty?[a][b]
translation:
  language: de
  text: Kannst du die Tiefen Gottes ergründen[a]? Kannst du bis zur äußersten Grenze des Allmächtigen gelangen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Kannst du das Erforschen Gottes finden?“ Das hebräische Wort kann „Forschen“, „Erforschung“ oder das Ergebnis beziehungsweise den Gegenstand des Forschens bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Kannst du bis ans Ende, bis zum vollen Umfang oder bis zur Vollkommenheit des Allmächtigen gelangen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵקֶר
  choice: die Tiefen … ergründen
  rationale: חֵקֶר bezeichnet das Erforschen oder das, was erforscht werden soll. Die deutsche Verbindung „die Tiefen … ergründen“ gibt sowohl den Suchvorgang als auch dessen unerreichbaren Gegenstand natürlich wieder.
- source_word: אֱלוֹהַ
  choice: Gott
  rationale: Schlichte und übliche Wiedergabe der singulären Gottesbezeichnung; sie entspricht dem Parallelismus mit שַׁדַּי.
- source_word: תִּמְצָא
  choice: ergründen
  rationale: מצא bedeutet grundsätzlich „finden“. Zusammen mit חֵקֶר bezeichnet es hier das erfolgreiche Erforschen; „ergründen“ ist im Deutschen idiomatisch und wahrt die Bildrichtung.
- source_word: אִם
  choice: oder
  rationale: אִם leitet hier im parallelen zweiten Glied eine weitere rhetorische Frage ein, nicht einen Bedingungssatz. „Oder“ verbindet beide Fragen im Deutschen natürlich.
- source_word: עַד תַּכְלִית
  choice: bis zur Vollkommenheit … vordringen
  rationale: עַד bezeichnet das Erreichen eines äußersten Punktes; תַּכְלִית kann Ende, äußerste Ausdehnung oder Vollkommenheit meinen. Die Formulierung bewahrt diese Vorstellung, ohne sie auf eine räumliche Grenze zu reduzieren.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Traditionelle und verständliche deutsche Wiedergabe des Gottestitels שַׁדַּי.
- source_word: תִּמְצָא
  choice: vordringen
  rationale: Das wiederholte מצא wird kontextgerecht als erfolgreiches Gelangen bis zum äußersten Umfang ausgedrückt; die Fußnote hält die wörtlichere Alternative „finden“ fest.
theological_decisions:
- issue: Reichweite menschlicher Gotteserkenntnis
  choice: Die rhetorischen Fragen verneinen, dass ein Mensch Gott erschöpfend ergründen oder seine Vollkommenheit vollständig erfassen kann.
  alternative: Die Aussage könnte als Verneinung jeder möglichen Gotteserkenntnis verstanden werden.
  rationale: Der hebräische Text spricht vom Erforschen und vom Erreichen der תַּכְלִית Gottes. Er bestreitet damit umfassende Erkenntnis, sagt aber nicht ausdrücklich, dass keinerlei wahre Erkenntnis Gottes möglich sei.
- issue: Bedeutung von תַּכְלִית beim Allmächtigen
  choice: Vollkommenheit
  alternative: Grenze, Ende oder ganzer Umfang
  rationale: „Vollkommenheit“ ist lexikalisch möglich und vermeidet den missverständlichen Eindruck, Gott habe eine endliche Grenze. Da der Ausdruck mehrdeutig bleibt, werden die anderen Möglichkeiten in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Aufbau zweier rhetorischer Fragen bleibt erhalten; „ergründen“ und „vordringen“ vermeiden eine schwerfällige Wiederholung, während die Fußnoten die hebräischen Bedeutungsalternativen offenhalten.
