- source_word: וַיַּעַן
  choice: antwortete
  rationale: ענה bezeichnet in dieser formelhaften Dialogeinleitung das Antworten. Das deutsche Präteritum gibt die hebräische Erzählform natürlich wieder.
- source_word: צֹפַר
  choice: Zofar
  rationale: Der Personenname wird gemäß der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: הַנַּעֲמָתִי
  choice: der Naamatiter
  rationale: Das Gentiliz bezeichnet Zofar nach seiner Herkunft oder Zugehörigkeit; „Naamatiter“ bewahrt diese Form knapp und traditionell.
- source_word: וַיֹּאמַר
  choice: ':'
  rationale: Das auf „antwortete“ folgende formelhafte „und sagte“ wird im natürlichen modernen Deutsch durch den Doppelpunkt vor der direkten Rede ausgedrückt, ohne den Inhalt der Redeeinleitung zu verlieren.
