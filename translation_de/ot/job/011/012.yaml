  text: וְ/אִ֣ישׁ נָ֭בוּב יִלָּבֵ֑ב וְ/עַ֥יִר פֶּ֝֗רֶא אָדָ֥ם יִוָּלֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/012.yaml
  text: But an empty-headed man will gain understanding when a wild donkey’s colt is born a man[a][b].
translation:
  language: de
  text: Doch ein Hohlkopf wird Verstand gewinnen, wenn das Fohlen eines Wildesels als Mensch geboren wird.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „Ein hohler Mann bekommt Herz.“ Im Hebräischen kann „Herz“ für Verstand und Einsicht stehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Aussage ist wahrscheinlich ironisch: Ein törichter Mann wird ebenso wenig verständig, wie ein Wildeselfohlen als Mensch geboren wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: Doch
  rationale: Die Konjunktion leitet im Zusammenhang einen ironischen Gegensatz ein; „Doch“ gibt diese adversative Wirkung natürlich wieder.
- source_word: אִישׁ נָבוּב
  choice: ein hohlköpfiger Mann
  rationale: נָבוּב bedeutet wörtlich „hohl“ und bezeichnet hier bildlich einen törichten, verständnislosen Menschen. „Hohlköpfig“ bewahrt Bild und Schärfe der Aussage.
- source_word: יִלָּבֵב
  choice: wird Verstand gewinnen
  rationale: Die Form von לבב bedeutet wörtlich etwa „Herz bekommen“; im hebräischen Sprachgebrauch steht das Herz für Einsicht und Verstand. Das Imperfekt wird mit „wird … gewinnen“ wiedergegeben.
- source_word: עַיִר פֶּרֶא
  choice: das Fohlen eines Wildesels
  rationale: Die Konstruktverbindung bezeichnet das Junge eines Wildesels. Diese Formulierung ist im Deutschen klar und nah am Hebräischen.
- source_word: אָדָם יִוָּלֵד
  choice: als Mensch geboren wird
  rationale: יִוָּלֵד ist ein Nifal-Imperfekt von ילד, „geboren werden“; אָדָם bezeichnet hier einen Menschen. „Als Mensch“ drückt den unmöglichen Wechsel der Art idiomatisch aus.
theological_decisions:
- issue: Ironische Aussagekraft des Spruchs
  choice: Der hohlköpfige Mann gewinnt dann Verstand, wenn ein Wildeselfohlen als Mensch geboren wird.
  alternative: Der Vers könnte ohne ausdrückliche Ironisierung als zwei koordinierte Aussagen oder als Hoffnung auf eine Verwandlung verstanden werden.
  rationale: Der hebräische Satz ist knapp und schwierig. Die Parallelität legt jedoch einen ironischen Vergleich mit einem unmöglichen Ereignis nahe. „Wenn“ macht diesen Zusammenhang lesbar, ohne das im Ausgangstext nicht ausdrücklich vorhandene „nur“ einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildsprache und die Spannung des knappen hebräischen Spruchs bleiben erhalten; die wahrscheinliche Ironie wird durch den Satzbau erkennbar, aber nicht durch ein zusätzliches „nur“ überbestimmt.
