base_translation:
  language: en
  yaml_path: translation/ot/job/011/003.yaml
  text: Will your empty talk make men keep silent[a], and when you mock, will no one shame you?
translation:
  language: de
  text: Soll dein leeres Gerede Menschen zum Schweigen bringen[a]? Und wenn du spottest, soll dich niemand beschämen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Prahlerei“ oder „dein Geschwätz“. Das hebräische Wort kann leeres, müßiges, prahlerisches oder falsches Reden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּיךָ
  choice: dein leeres Gerede
  rationale: Das Substantiv kann leeres, nichtiges, prahlerisches oder falsches Reden bezeichnen. „Leeres Gerede“ bewahrt den abwertenden Ton, ohne die Bedeutung auf bewusste Lügen festzulegen.
- source_word: מְתִים
  choice: Menschen
  rationale: Der Plural bezeichnet hier allgemein Menschen. „Menschen“ ist im modernen Deutschen natürlich und gibt den generischen Bezug wieder.
- source_word: יַחֲרִישׁו
  choice: zum Schweigen bringen
  rationale: Die Hifil-Form von חרש hat hier kausativen Sinn. Die Wendung gibt wieder, dass Hiobs Worte andere verstummen lassen sollen.
- source_word: וַתִּלְעַג
  choice: Und wenn du spottest
  rationale: לעג bedeutet spotten oder verhöhnen. Die konditionale Wiedergabe verbindet die beiden parallelen rhetorischen Fragen natürlich, während „Und“ die hebräische Verknüpfung wahrt.
- source_word: מַכְלִם
  choice: beschämen
  rationale: Das Hifil-Partizip von כלם bezeichnet jemanden, der Schande zufügt oder beschämt. „Beschämen“ ist knapp und erhält die zwischenmenschliche Schärfe.
