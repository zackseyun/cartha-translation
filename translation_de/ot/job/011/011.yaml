source:
  edition: WLC
  text: כִּי ה֭וּא יָדַ֣ע מְתֵי שָׁ֑וְא וַ/יַּרְא אָ֝֗וֶן וְ/לֹ֣א יִתְבּוֹנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/011.yaml
  text: For he knows men of falsehood; when he sees wickedness[a], does he not take notice?
translation:
  language: de
  text: Denn er kennt Menschen voller Falschheit; wenn er Unrecht sieht, nimmt er es nicht wahr?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er beachtet es nicht“. Das hebräische Schlussglied kann als einfache Verneinung verstanden werden; im Zusammenhang liegt jedoch die rhetorische Frage nahe: „Nimmt er es nicht wahr?“'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Zofars Aussage ein und gibt den argumentativen Zusammenhang natürlich wieder.
- source_word: הוּא
  choice: er
  rationale: Bezieht sich im Zusammenhang auf Gott; das Deutsche benötigt hier ein Pronomen, ohne dass eine besondere Großschreibung nötig wäre.
- source_word: יָדַע
  choice: kennt
  rationale: Das Perfekt bezeichnet hier Gottes feststehende, allgemeingültige Kenntnis; das deutsche Präsens gibt diesen Sinn angemessen wieder.
- source_word: מְתֵי שָׁוְא
  choice: Menschen voller Falschheit
  rationale: מְתֵי bezeichnet Menschen, שָׁוְא kann Falschheit, Nichtigkeit oder Täuschung ausdrücken. Die Formulierung bewahrt den moralischen Sinn, ohne die Menschen selbst pauschal als ‚wertlos‘ zu bezeichnen.
- source_word: וַיַּרְא
  choice: wenn er … sieht
  rationale: Die Satzfolge wird im Zusammenhang sinnvoll als allgemeiner zeitlicher Sachverhalt verstanden. So entsteht im Deutschen ein natürlicher Übergang zur abschließenden rhetorischen Frage.
- source_word: אָוֶן
  choice: Unrecht
  rationale: Das Wort bezeichnet häufig moralisch verwerfliches Handeln beziehungsweise daraus entstehendes Unheil. ‚Unrecht‘ passt hier zum moralischen Zusammenhang und bleibt breit genug.
- source_word: וְלֹא יִתְבּוֹנָן
  choice: sollte er es nicht bemerken?
  rationale: התבונן bedeutet aufmerksam wahrnehmen, beachten oder erwägen. Als rhetorische Frage gelesen, unterstreicht die Wendung, dass Gott das gesehene Unrecht sehr wohl wahrnimmt.
theological_decisions:
- issue: Aussagekraft des Schlussglieds וְלֹא יִתְבּוֹנָן
  choice: 'Als rhetorische Frage: „sollte er es nicht bemerken?“'
  alternative: 'Als schlichte Verneinung: „und er beachtet es nicht“ beziehungsweise „ohne es zu beachten“'
  rationale: Die unmarkierte hebräische Frageform lässt formal auch eine einfache Verneinung zu. Im Zusammenhang behauptet Zofar jedoch Gottes umfassende Kenntnis menschlicher Falschheit; daher passt die rhetorische Frage besser zum Gedankengang. Die grammatisch mögliche Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Menschen voller Falschheit“ vermeidet sowohl das missverständliche „falsche Menschen“ als auch das altertümliche und stärker wertende „nichtige Menschen“. Die rhetorische Frage erhält die Spannung des hebräischen Schlussglieds; die alternative Lesart wird ausdrücklich dokumentiert.
