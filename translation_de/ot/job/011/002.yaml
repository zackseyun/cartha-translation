  text: הֲ/רֹ֣ב דְּ֭בָרִים לֹ֣א יֵעָנֶ֑ה וְ/אִם אִ֖ישׁ שְׂפָתַ֣יִם יִצְדָּֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/002.yaml
  text: Should a multitude of words go unanswered[a], and should a man of lips be proved right?
translation:
  language: de
  text: Soll eine Fülle von Worten unbeantwortet bleiben, und soll ein Mann der Lippen[a] im Recht sein?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „ein Mann der Lippen“; gemeint ist jemand, der durch viele, möglicherweise leere Worte auffällt, also ein Vielredner.
    reason: Erläuterung eines hebräischen Idioms
lexical_decisions:
- source_word: הֲרֹב דְּבָרִים
  choice: eine Fülle von Worten
  rationale: רֹב bezeichnet hier eine große Menge. „Eine Fülle von Worten“ gibt sowohl die Quantität als auch den kritischen Unterton des Wortreichtums in natürlichem Deutsch wieder.
- source_word: לֹא יֵעָנֶה
  choice: unbeantwortet bleiben
  rationale: 'Der Niphal von ענה ist hier passiv zu verstehen: Die vielen Worte sollen nicht ohne Antwort bleiben. Die deutsche Formulierung bewahrt die rhetorische Frage.'
- source_word: וְאִם
  choice: und soll
  rationale: וְאִם leitet im poetischen Parallelismus die zweite rhetorische Teilfrage ein. „Und soll“ gibt diese Funktion natürlicher wieder als ein wörtliches „und wenn“.
- source_word: אִישׁ שְׂפָתַיִם
  choice: ein Mann der Lippen
  rationale: Die ungewöhnliche hebräische Wendung bezeichnet einen Menschen, der durch sein Reden charakterisiert ist, wohl einen Vielredner. Das Bild der Lippen bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
- source_word: יִצְדָּק
  choice: recht bekommen
  rationale: 'Das Qal von צדק hat hier einen bewertenden beziehungsweise forensischen Sinn: als im Recht befindlich gelten oder bestätigt werden. „Recht bekommen“ ist gegenwärtiges, verständliches Deutsch und vermeidet eine unnötige dogmatische Aufladung von „gerechtfertigt werden“.'
theological_decisions:
- issue: Bedeutung von צדק in diesem Streitgespräch
  choice: recht bekommen
  alternative: gerechtfertigt werden; als gerecht dastehen
  rationale: Im Kontext geht es darum, ob ausgiebiges Reden einen Menschen als sachlich im Recht erweist. Die Übersetzung hält den forensisch-evaluativen Sinn fest, ohne eine spätere theologische Fachbedeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Aufbau der beiden rhetorischen Fragen und das auffällige hebräische Lippenbild bleiben erhalten; die Fußnote macht das Idiom verständlich.
