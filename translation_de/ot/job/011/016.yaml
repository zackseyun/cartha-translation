  source_fidelity: 'Der Text gibt die hebräische Abfolge und Bildsprache zuverlässig wieder: כִּי als begründendes »Denn«, das explizite »du«, das zukünftige Vergessen des Elends sowie die anschließende Erinnerung unter dem Vergleich mit bereits vorbeigegangenem Wasser. Das nicht ausgedrückte Objekt von תִזְכֹּר wird mit »daran« nachvollziehbar auf »Elend« bezogen. Die spannungsvolle Gegenüberstellung von »vergessen« und »daran denken« bleibt erhalten.'
  naturalness: »Denn du wirst dein Elend vergessen; du wirst daran denken wie an Wasser, das vorübergeflossen ist« ist verständliches, würdiges modernes Standarddeutsch. Die leicht ungewohnte Verbindung ist als bewusste poetische Vergleichsform angemessen und bewahrt die Bildlichkeit.
  terminology: »Elend« ist für עָמָל im Kontext eine tragfähige, nicht einengende Wiedergabe. »Vorübergeflossen« konkretisiert das Wasserbild idiomatisch, ohne den Sinn von עבר zu verändern. Es werden keine konfessionell geprägten Begriffe oder zusätzlichen theologischen Deutungen eingeführt.
