source:
  edition: WLC
  text: כִּי אַ֭תָּה עָמָ֣ל תִּשְׁכָּ֑ח כְּ/מַ֖יִם עָבְר֣וּ תִזְכֹּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/016.yaml
  text: For you will forget your misery[a]; you will remember it as waters that have passed by.
translation:
  language: de
  text: Denn du wirst dein Elend vergessen; du wirst daran denken wie an Wasser, das vorübergeflossen ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »du wirst dich daran nur noch wie an vorübergeflossenes Wasser erinnern.« Das hebräische Bild vergleicht das frühere Elend mit Wasser, das bereits vorüber ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung beziehungsweise Folge der vorausgehenden Verheißung ein.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Personalpronomen wird beibehalten; im Deutschen ist es zugleich für die finite Verbform erforderlich.
- source_word: עָמָל
  choice: Elend
  rationale: Bezeichnet hier leidvolle Not oder Mühsal; »Elend« erfasst die Erfahrung des Leidens, ohne sie auf Arbeit zu verengen.
- source_word: תִּשְׁכָּח
  choice: wirst vergessen
  rationale: Das Qal-Imperfekt der 2. Person maskulin Singular hat im Kontext Zukunftsbedeutung.
- source_word: כְמַיִם
  choice: wie an Wasser
  rationale: Die Vergleichspartikel wird mit »wie« wiedergegeben. Nach »daran denken« ergänzt »an« idiomatisch die Vergleichsgröße; der hebräische Plural מַיִם wird im Deutschen natürlich als singularisches »Wasser« ausgedrückt.
- source_word: עָבְרוּ
  choice: vorübergeflossen ist
  rationale: Das Perfekt beschreibt Wasser, das bereits vorbeigezogen und nicht mehr gegenwärtig ist; »geflossen« macht das natürliche Bild im Deutschen deutlich.
- source_word: תִזְכֹּר
  choice: du wirst daran denken
  rationale: Das Qal-Imperfekt der 2. Person maskulin Singular wird futurisch verstanden. »Daran« nimmt das zuvor genannte Elend auf, obwohl das Objekt im Hebräischen unausgesprochen bleibt.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche und zugleich würdevolle Standardsprache. Die poetische Spannung zwischen »vergessen« und »daran denken« bleibt bewusst erhalten; der zweite Halbvers beschreibt eine Erinnerung an etwas endgültig Vergangenes.
