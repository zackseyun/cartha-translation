  text: כִּי אָ֤ז תִּשָּׂ֣א פָנֶ֣י/ךָ מִ/מּ֑וּם וְ/הָיִ֥יתָ מֻ֝צָ֗ק וְ/לֹ֣א תִירָֽא־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/015.yaml
  text: For then you will lift up your face without blemish[b][a]; you will stand firm and will not fear.
translation:
  language: de
  text: Denn dann wirst du dein Gesicht ohne Makel erheben[a]; du wirst fest stehen[b] und dich nicht fürchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann kannst du den Kopf ohne Scham hochhalten.“ Wörtlich steht im Hebräischen: „dein Gesicht ohne Makel erheben“. Das Bild drückt wiedergewonnenes Selbstvertrauen und Freiheit von Schande aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du wirst sicher sein“ beziehungsweise „fest gegründet sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָז
  choice: Denn dann
  rationale: כִּי leitet hier die Folge der vorausgehenden Bedingung ein, und אָז bezeichnet den daraus entstehenden Zeitpunkt. „Denn dann“ gibt diesen Zusammenhang knapp und natürlich wieder.
- source_word: תִּשָּׂא פָנֶיךָ
  choice: du wirst dein Gesicht … erheben
  rationale: Die hebräische Wendung wird bildhaft und weitgehend formal bewahrt; sie bezeichnet wiedergewonnenes Selbstvertrauen und Freiheit von Schande.
- source_word: מִמּוּם
  choice: ohne Makel
  rationale: מוּם bezeichnet gewöhnlich einen Fehler oder Makel. Hier ist das Wort bildlich gebraucht; „ohne Makel“ erhält das ungewöhnliche Bild, ohne es vorschnell als „ohne Scham“ auszulegen.
- source_word: מֻצָק
  choice: fest stehen
  rationale: Das Partizip aus יצק vermittelt Festigkeit, Stabilität oder ein festes Gegründetsein. „Fest stehen“ ist im modernen Deutschen verständlich und bewahrt das Bild der Standfestigkeit.
- source_word: וְלֹא תִירָא
  choice: und dich nicht fürchten
  rationale: Die Formulierung gibt die verneinte Zukunftsaussage schlicht und in einem würdigen poetischen Register wieder.
