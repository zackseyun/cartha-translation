lexical_decisions:
- source_word: רָבַצְתָּ
  choice: du wirst dich niederlegen
  rationale: Gibt das konkrete Bild des Sich-Niederlegens wieder und lässt zugleich den Zusammenhang sicheren Ruhens erkennen, ohne ihn erklärend in den Text einzutragen.
- source_word: מַחֲרִיד
  choice: jemand wird dich aufschrecken
  rationale: Das Partizip bezeichnet jemanden, der Zittern oder Schrecken verursacht. „Aufschrecken“ ist im Zusammenhang des Niederlegens natürlich und bewahrt den Gedanken äußerer Bedrohung.
- source_word: חִלּוּ פָנֶיךָ
  choice: werden deine Gunst suchen
  rationale: Die Wendung bedeutet idiomatisch, das Wohlwollen einer Person zu suchen oder sie inständig zu bitten. Die Übersetzung gibt den Sinn in natürlichem Deutsch wieder; die wörtliche Bildsprache wird in der Fußnote genannt.
- source_word: רַבִּים
  choice: viele
  rationale: Schlichte und genaue Wiedergabe der substantivisch gebrauchten Mehrzahlbezeichnung.
- source_word: וְאֵין
  choice: und niemand wird
  rationale: Natürliche deutsche Wiedergabe der verneinten Existenzkonstruktion in ihrem futurischen Kontext.
