  text: Its measure is longer than the earth and broader than the sea[a].
translation:
  language: de
  text: Ihr Maß ist länger als die Erde und breiter als das Meer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihre Ausdehnung ist länger als die Erde und breiter als das Meer.“'
