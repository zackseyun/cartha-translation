lexical_decisions:
- source_word: אֲרֻכָּה
  choice: länger
  rationale: Das feminine Adjektiv bezieht sich auf מִדָּהּ und steht mit dem vergleichenden מִן; daher ist der deutsche Komparativ „länger als“ natürlich und präzise.
- source_word: מֵאֶרֶץ
  choice: als die Erde
  rationale: Das vorangestellte מִן bezeichnet hier den Vergleich. אֶרֶץ wird im kosmischen Parallelismus mit „Meer“ am besten als „Erde“ wiedergegeben.
- source_word: מִדָּהּ
  choice: ihr Maß
  rationale: מִדָּה bezeichnet Maß, Größe oder Ausdehnung. „Ihr Maß“ bewahrt das konkrete Substantiv; das feminine Suffix nimmt den im Zusammenhang beschriebenen Gegenstand wieder auf.
- source_word: וּרְחָבָה
  choice: und breiter
  rationale: Das feminine Adjektiv steht parallel zu אֲרֻכָּה; der Komparativ gibt die Vergleichskonstruktion idiomatisch wieder.
- source_word: מִנִּי יָם
  choice: als das Meer
  rationale: מִנִּי ist eine poetische Form von מִן und markiert hier einen Vergleich. יָם bedeutet direkt „Meer“ und erhält das Bild sowie den Parallelismus.
