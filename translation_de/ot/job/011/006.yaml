base_translation:
  language: en
  yaml_path: translation/ot/job/011/006.yaml
  text: and would tell you the hidden things of wisdom[a], for sound wisdom has two sides. Know, then[c][b], that God has overlooked some of your iniquity.
translation:
  language: de
  text: 'und er dir die verborgenen Dinge der Weisheit[a] kundtun würde; denn Einsicht hat zwei Seiten.[b] Dann wisse: Gott rechnet dir einen Teil deiner Schuld nicht an.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Geheimnisse der Weisheit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „denn sie ist doppelt an Einsicht“. Der schwierige hebräische Ausdruck besagt wohl, dass Weisheit mehr Seiten hat, als zunächst sichtbar sind.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Gott fordert weniger von dir, als deine Schuld verdient“; möglicherweise auch: „Gott hat einen Teil deiner Schuld vergessen“. Das hebräische Verb ist schwer zu deuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַגֶּד לְךָ
  choice: und er dir … kundtun würde
  rationale: Das Hifil von נגד bedeutet „mitteilen, kundtun“. Der Konjunktiv führt den Wunschzusammenhang aus Vers 5 natürlich fort.
- source_word: תַּעֲלֻמוֹת חָכְמָה
  choice: die verborgenen Dinge der Weisheit
  rationale: Bewahrt den konkreten Plural und die Genitivverbindung; „Geheimnisse der Weisheit“ ist ebenfalls möglich.
- source_word: כִפְלַיִם לְתוּשִׁיָּה
  choice: Einsicht hat zwei Seiten
  rationale: כפלים bezeichnet hier eine Zweiheit oder Doppelheit; תושיה ist ein schwieriger Weisheitsbegriff. Die Formulierung wahrt das Bild und bleibt im Deutschen verständlich.
- source_word: וְדַע
  choice: Dann wisse
  rationale: Gibt den Imperativ und seinen folgernden Anschluss knapp und natürlich wieder.
- source_word: יַשֶּׁה לְךָ אֱלוֹהַ מֵעֲוֺנֶךָ
  choice: Gott rechnet dir einen Teil deiner Schuld nicht an
  rationale: Das schwierige Verb kann mit „vergessen“ verbunden werden; im Kontext zielt Zofars Aussage wohl darauf, dass Gott nicht die ganze Schuld ahndet. Die Übersetzung macht diese kontextuelle Bedeutung verständlich, ohne die Unsicherheit zu verschweigen.
theological_decisions:
- issue: Zofars Aussage über Gottes Umgang mit Hiobs Schuld
  choice: Gott rechnet einen Teil der Schuld nicht an
  alternative: 'Gott fordert weniger von dir, als deine Schuld verdient; oder: Gott hat einen Teil deiner Schuld vergessen'
  rationale: Der Kontext spricht für die Anklage, Hiob werde milder behandelt, als er verdiene. Das wird als Zofars Aussage wiedergegeben, nicht als uneingeschränkte Bestätigung seiner Theologie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz setzt den Wunsch aus Vers 5 fort. Die schwierigen Weisheitsbegriffe und die Mehrdeutigkeit des letzten Verbs werden im Text lesbar wiedergegeben und in den Fußnoten offengelegt.
