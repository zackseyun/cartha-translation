base_translation:
  language: en
  yaml_path: translation/ot/job/011/010.yaml
  text: If he passes by and shuts someone in[a], and calls an assembly[b], then who can turn him back?
translation:
  language: de
  text: Wenn er vorüberzieht und jemanden einschließt[a] und eine Versammlung einberuft[b] – wer kann ihn zurückhalten?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jemanden einsperrt“ oder „jemanden ausliefert“.'
    reason: lexikalische Alternative
  - marker: b
    text: 'Auch möglich: „Menschen versammelt“ oder „eine Versammlung zusammenruft“; die Wendung kann einen gerichtlichen Beiklang haben.'
    reason: lexikalische Alternative
  - marker: c
    text: 'Oder: „Wer kann es rückgängig machen?“ Das hebräische maskuline Suffix kann sich persönlich auf den Handelnden beziehen; sinngemäß kann die Frage aber auch auf die Umkehrung seines Handelns zielen.'
    reason: alternative Deutung
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die Partikel leitet eine hypothetische Aussage ein. „Wenn“ bewahrt diese Funktion und passt im Deutschen zum rhetorischen Nachsatz.
- source_word: יַחֲלֹף
  choice: vorüberzieht
  rationale: Das Verb חלף bezeichnet hier ein Vorüberziehen oder Hindurchziehen. Die Wahl erhält das Bewegungsbild, ohne eine zerstörerische Wirkung hineinzulesen.
- source_word: וְיַסְגִּיר
  choice: und jemanden einschließt
  rationale: Die Hifil-Form von סגר kann „einschließen“, „einsperren“ oder „ausliefern“ bedeuten. „Jemanden einschließt“ hält das konkrete Bild fest; das im Hebräischen unausgesprochene Objekt wird für natürliches Deutsch allgemein ergänzt.
- source_word: וְיַקְהִיל
  choice: und eine Versammlung einberuft
  rationale: Die Hifil-Form von קהל bedeutet „versammeln“ oder „einberufen“. Die Formulierung gibt den veranlassenden Sinn wieder und lässt einen möglichen öffentlichen oder gerichtlichen Rahmen offen.
- source_word: וּמִי
  choice: wer
  rationale: Die Verbindung aus Konjunktion und Fragewort eröffnet die rhetorische Folgefrage. Der Gedankenstrich stellt den Zusammenhang im Deutschen natürlich her, ohne ein zusätzliches „dann“ zu benötigen.
- source_word: יְשִׁיבֶנּוּ
  choice: kann ihn zurückhalten
  rationale: Die Hifil-Form von שוב mit maskulinem Singularsuffix bezeichnet wörtlich ein Zurückbringen oder Zurückwenden. „Zurückhalten“ gibt in diesem rhetorischen Zusammenhang idiomatisch wieder, dass niemand sein Handeln aufhalten oder umkehren kann.
theological_decisions:
- issue: Bezug der maskulinen Singularformen und des Suffixes
  choice: Gott ist das unausgesprochene Subjekt; das abschließende Suffix wird persönlich mit „ihn“ wiedergegeben.
  alternative: 'Die Schlusswendung kann allgemeiner auf Gottes Handeln bezogen werden: „Wer kann es rückgängig machen?“'
  rationale: Der Zusammenhang handelt von Gottes Wissen und unwiderstehlichem Handeln. Der persönliche Bezug entspricht den unmittelbar vorausgehenden Verbformen; die mögliche abstraktere Deutung wird wegen der sprachlichen Offenheit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe rhetorische Struktur des Hebräischen bleibt durch die Reihung und den Gedankenstrich erhalten. Die ergänzte unbestimmte Person nach „einschließt“ sorgt für verständliches Deutsch, ohne eine konkrete Identität festzulegen.
