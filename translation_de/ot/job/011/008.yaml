source:
  edition: WLC
  text: גָּבְהֵ֣י שָׁ֭מַיִם מַה תִּפְעָ֑ל עֲמֻקָּ֥ה מִ֝/שְּׁא֗וֹל מַה תֵּדָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/008.yaml
  text: It is higher than the heavens—what can you do? Deeper than Sheol—what can you know?[a]
translation:
  language: de
  text: Höher als der Himmel – was kannst du tun? Tiefer als das Totenreich – was kannst du erkennen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Tiefer als Scheol« oder »tiefer als das Grab«. Hebräisch: Scheol.'
    reason: Lexikalische Alternativen für שְׁאוֹל und Transparenz gegenüber dem hebräischen Begriff.
lexical_decisions:
- source_word: גָּבְהֵי שָׁמַיִם
  choice: Höher als der Himmel
  rationale: Die Wendung bezeichnet wörtlich die Höhen des Himmels. Die vergleichende Wiedergabe ist im Deutschen natürlich und bildet den Parallelismus mit »Tiefer als das Totenreich« ab.
- source_word: מַה תִּפְעָל
  choice: was kannst du tun?
  rationale: מַה leitet eine rhetorische Frage ein; der Imperfekt von פעל bezeichnet hier im Zusammenhang menschliches Vermögen. Die Wiedergabe bleibt nah am Wortlaut.
- source_word: עֲמֻקָּה מִשְּׁאוֹל
  choice: Tiefer als das Totenreich
  rationale: Das Adjektiv setzt das aus dem Zusammenhang erschlossene Bezugswort fort, und מִן dient dem Vergleich. »Totenreich« gibt שְׁאוֹל verständlich wieder, ohne den Begriff auf das einzelne Grab einzuengen.
- source_word: מַה תֵּדָע
  choice: was kannst du erkennen?
  rationale: ידע bedeutet grundsätzlich »wissen, kennen, erkennen«. »Erkennen« bezeichnet hier passend das Erfassen der unergründlichen göttlichen Weisheit und wahrt die rhetorische Aussage menschlicher Begrenztheit.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: das Totenreich
  alternative: Scheol; das Grab
  rationale: »Totenreich« vermittelt den althebräischen Vorstellungsbereich im modernen Deutschen besser als das engere »Grab«. »Scheol« wäre formnäher, ist jedoch erklärungsbedürftiger. Die Fußnote bewahrt beide Alternativen.
- issue: Unausgesprochenes Bezugswort der Adjektive
  choice: Kein Bezugswort ergänzen
  alternative: Gottes Weisheit bzw. das Ergründbare des Allmächtigen ausdrücklich einsetzen
  rationale: Das Hebräische führt den Gedanken aus Vers 7 elliptisch fort. Die deutsche Fassung bewahrt diese poetische Offenheit, statt die mögliche Referenz theologisch festzulegen.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die zwei knappen rhetorischen Fragen und der Höhen-Tiefen-Parallelismus werden bewahrt; Gedankenstriche markieren die Zäsur der beiden Vershälften.
