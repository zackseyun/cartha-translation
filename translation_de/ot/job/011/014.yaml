base_translation:
  language: en
  yaml_path: translation/ot/job/011/014.yaml
  text: If iniquity is in your hand[a], put it far away[b], and do not let injustice dwell in your tents.
translation:
  language: de
  text: Wenn Böses in deiner Hand ist[a], schaff es weit fort, und lass in deinen Zelten[b] kein Unrecht wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „In deiner Hand“ kann hier das bezeichnen, was du festhältst, besitzt oder selbst tust.
    reason: idiomatische Erläuterung
  - marker: b
    text: „In deinen Zelten“ kann den häuslichen Lebensbereich bezeichnen.
    reason: kultureller Hinweis
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet entsprechend der hebräischen Syntax einen Bedingungssatz ein.
- source_word: אָוֶן
  choice: Böses
  rationale: Das Wort kann Unheil, Bosheit oder schuldhaftes Tun bezeichnen. Im Zusammenhang der moralischen Aufforderung steht die ethische Bedeutung im Vordergrund; „Böses“ bleibt dabei natürlich und hinreichend weit.
- source_word: בְּיָדְךָ
  choice: in deiner Hand
  rationale: Bewahrt das hebräische Bild von etwas, das jemand besitzt, festhält oder tut, ohne dessen Bedeutung vorschnell auf eine einzige Möglichkeit einzuengen.
- source_word: הַרְחִיקֵהוּ
  choice: schaff es weit fort
  rationale: Gibt den kausativen Imperativ und die ausdrückliche Vorstellung räumlicher Entfernung wieder.
- source_word: וְאַל
  choice: und lass … kein
  rationale: Formuliert das hebräische Verbot in natürlichem modernem Deutsch.
- source_word: תַּשְׁכֵּן
  choice: lass … wohnen
  rationale: Bewahrt das Wohnbild der Wurzel שכן und gibt im negierten Zusammenhang die Aufforderung wieder, dem Unrecht keinen bleibenden Raum zu gewähren.
- source_word: בְּאֹהָלֶיךָ
  choice: in deinen Zelten
  rationale: Erhält den ausdrücklich pluralischen und konkreten Ausdruck des hebräischen Textes; zugleich bezeichnet er den häuslichen Lebensbereich.
- source_word: עַוְלָה
  choice: Unrecht
  rationale: Bezeichnet verkehrtes oder ungerechtes Handeln. „Unrecht“ steht in enger Beziehung zu „Böses“, ohne die beiden poetisch parallelen Ausdrücke gleichzusetzen.
theological_decisions:
- issue: Moralische Begriffe im poetischen Parallelismus
  choice: אָוֶן und עַוְלָה werden mit den verwandten, aber unterschiedlichen Begriffen „Böses“ und „Unrecht“ wiedergegeben.
  alternative: Beide Wörter könnten einheitlich mit „Böses“ oder stärker zugespitzt mit „Frevel“ und „Ungerechtigkeit“ übersetzt werden.
  rationale: Die unterschiedliche Wortwahl erhält den synonymen Parallelismus, ohne dem Vers eine fachtheologische Unterscheidung aufzuzwingen, die der hebräische Text nicht eindeutig verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkreten Bilder „Hand“, „wohnen“ und „Zelte“ bleiben erhalten; die Satzstellung wurde für flüssiges Deutsch behutsam angepasst.
