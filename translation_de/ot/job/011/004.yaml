  text: וַ֭/תֹּאמֶר זַ֣ךְ לִקְחִ֑/י וּ֝/בַ֗ר הָיִ֥יתִי בְ/עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/004.yaml
  text: For you say[a], ‘My teaching is pure, and I am clean in your eyes.’
translation:
  language: de
  text: 'Denn du sagst: »Rein ist meine Lehre, und lauter bin ich in deinen Augen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Unterweisung« bzw. »meine Darlegung«. Das hebräische Substantiv kann das bezeichnen, was man als Lehre empfangen oder dargelegt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: du sagst
  rationale: Das wayyiqtol kann formal vergangen wiedergegeben werden; im poetischen Streitgespräch bezeichnet es hier jedoch treffend Hiobs gegenwärtig vorgehaltene Behauptung.
- source_word: זַךְ
  choice: rein
  rationale: Das Adjektiv bezeichnet Reinheit oder Lauterkeit und ist hier prädikativ auf לִקְחִי bezogen.
- source_word: לִקְחִי
  choice: meine Lehre
  rationale: לֶקַח kann das Empfangene oder als Unterweisung Dargelegte bezeichnen. »Lehre« gibt den Inhalt von Hiobs vorgetragener Position knapp und natürlich wieder.
- source_word: וּבַר
  choice: lauter
  rationale: בַּר bedeutet rein oder sauber. »Lauter« wahrt im Deutschen eine erkennbare Nuance gegenüber dem zuvor verwendeten »rein«, ohne den semantischen Zusammenhang aufzulösen.
- source_word: הָיִיתִי
  choice: bin ich
  rationale: Obwohl die Form ein Perfekt der ersten Person Singular ist, bezeichnet sie innerhalb der zitierten Selbstaussage natürlich einen gegenwärtigen Zustand.
- source_word: בְעֵינֶיךָ
  choice: in deinen Augen
  rationale: Die bildhafte hebräische Wendung für eine Beurteilung durch jemanden wird im Deutschen verständlich und formnah bewahrt.
theological_decisions:
- issue: Bezug der zweiten Person Singular in »in deinen Augen«
  choice: Gott als Angeredeter innerhalb des von Zofar wiedergegebenen Anspruchs
  alternative: der jeweilige Gesprächspartner oder ein allgemeiner Beurteilender
  rationale: Zofar stellt Hiobs Aussage als Reinheitsanspruch vor Gott dar. Die Übersetzung lässt die direkte Anrede stehen und fügt den Gottesbezug nicht erklärend in den Haupttext ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Adjektive זַךְ und בַר werden mit »rein« und »lauter« unterschieden. Das vorangestellte »Denn« bildet die begründende Funktion im Zusammenhang ab. Der Fußnotenmarker steht am Ende der vollständig zitierten Aussage.
