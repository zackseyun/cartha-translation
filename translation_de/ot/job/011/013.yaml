  text: אִם אַ֭תָּ֗ה הֲכִינ֣וֹתָ לִבֶּ֑/ךָ וּ/פָרַשְׂתָּ֖ אֵלָ֣י/ו כַּפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/013.yaml
  text: If you prepare your heart and stretch out your hands to him,[a]
translation:
  language: de
  text: Wenn du dein Herz bereitest und deine Hände zu ihm ausstreckst,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Hand zu ihm ausbreitest“. Im Hebräischen steht „Handfläche/Hand“ im Singular; die Wendung bezeichnet jedoch gewöhnlich die Gebetsgebärde mit ausgestreckten Händen.'
    reason: Lexikalische Alternative und Erklärung des Numerus.
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet einen Bedingungssatz ein und bewahrt Zofars konditionale Aufforderung.
- source_word: אַתָּה
  choice: du
  rationale: Das ausdrücklich gesetzte Personalpronomen der zweiten Person Singular wird zur Betonung der direkten Anrede an Hiob beibehalten.
- source_word: הֲכִינוֹתָ
  choice: bereitest
  rationale: Die Hifil-Form von כון bezeichnet hier, etwas bereit, fest oder geordnet zu machen. „Das Herz bereiten“ bewahrt die Bildsprache, ohne die innere Haltung näher auszudeuten.
- source_word: לִבֶּךָ
  choice: dein Herz
  rationale: לֵב bezeichnet den inneren Menschen einschließlich Denken und Wollen. „Herz“ erhält den hebräischen anthropologischen Ausdruck.
- source_word: וּפָרַשְׂתָּ
  choice: und … ausstreckst
  rationale: פרשׂ bedeutet ausbreiten oder ausstrecken; im Gebetszusammenhang bezeichnet es die Gebärde ausgestreckter Hände.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition bezeichnet die Ausrichtung auf einen männlichen Singularreferenten, im Kontext Gott. Das Pronomen wird nicht durch den im Hebräischen ungenannten Namen ersetzt.
- source_word: כַּפֶּךָ
  choice: deine Hände
  rationale: Das hebräische Substantiv „Handfläche/Hand“ steht im Singular, doch die Wendung bezeichnet gewöhnlich die Gebetshaltung mit ausgestreckten Händen. Der deutsche Plural gibt diese Gebärde natürlich wieder; der Singular wird in einer Fußnote dokumentiert.
theological_decisions:
- issue: Bezugswort des Pronomens in אֵלָיו
  choice: Das Pronomen wird als „zu ihm“ wiedergegeben und bezieht sich im Kontext auf Gott.
  alternative: Zur Verdeutlichung „zu Gott“ schreiben.
  rationale: Der Zusammenhang macht den Bezug auf Gott verständlich. Die pronominale Form des Ausgangstextes bleibt erhalten, ohne einen dort nicht ausdrücklich stehenden Gottesnamen einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht bildhafte Wendung „das Herz bereiten“ bewahrt die hebräische Ausdrucksweise; „die Hände ausstrecken“ ist im Deutschen als Gebetsgebärde verständlich.
