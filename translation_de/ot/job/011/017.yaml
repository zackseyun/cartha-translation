  text: And your lifetime will rise brighter than noon[a]; though there is darkness[c][b], it will become like the morning.
translation:
  language: de
  text: Deine Lebenszeit[a] wird heller als der Mittag aufstrahlen; selbst wenn Dunkelheit da ist[b], wird sie wie der Morgen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Leben“ oder allgemeiner „irdisches Dasein“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Der seltene hebräische Ausdruck ist unsicher; möglich sind auch „Düsternis“ oder „Verborgenheit“. Die dichterisch stark verdichtete zweite Vershälfte kann auch wiedergegeben werden: „Dunkelheit wird wie der Morgen sein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִצָּהֳרַיִם
  choice: heller als der Mittag
  rationale: Die Präposition מִן bezeichnet hier am natürlichsten einen Vergleich. „Mittag“ bewahrt das Bild des hellsten Tageslichts und klingt im Deutschen idiomatisch.
- source_word: יָקוּם
  choice: wird … aufstrahlen
  rationale: קום bedeutet gewöhnlich „aufstehen, sich erheben“. Im Zusammenhang mit der Helligkeit gibt „aufstrahlen“ das Bild einer sich erhebenden, hell werdenden Lebenslage natürlich wieder, ohne die Metapher in eine sachliche Aussage aufzulösen.
- source_word: חָלֶד
  choice: deine Lebenszeit
  rationale: חָלֶד kann die Lebensdauer, das Leben oder das irdische Dasein bezeichnen. „Lebenszeit“ bewahrt hier den zeitlichen Sinn. Das Possessivpronomen ergibt sich aus der direkten Anrede im Zusammenhang.
- source_word: תָּעֻפָה
  choice: auch wenn es dunkel wird
  rationale: Der seltene und unsichere Ausdruck wird im poetischen Gegensatz zum Morgen am ehesten auf Dunkelheit oder Düsternis bezogen. Die konzessive Formulierung macht den verdichteten Zusammenhang im Deutschen verständlich, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: כַּבֹּקֶר
  choice: wie am Morgen
  rationale: כְּ kennzeichnet den Vergleich, und בֹּקֶר bedeutet „Morgen“. „Wie am Morgen“ gibt das gemeinte helle Morgenlicht im Deutschen natürlich wieder.
- source_word: תִּהְיֶה
  choice: wird es … sein
  rationale: היה kann „sein“ oder kontextbedingt „werden“ bedeuten. Die deutsche Wendung lässt offen, ob eine Verwandlung oder ein resultierender Zustand im Vordergrund steht.
