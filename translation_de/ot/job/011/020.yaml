base_translation:
  language: en
  yaml_path: translation/ot/job/011/020.yaml
  text: But the eyes of the wicked will fail[a], and refuge will perish from them, and their hope will be the breathing out of life.
translation:
  language: de
  text: Doch die Augen der Frevler werden versagen, und Zuflucht geht ihnen verloren; ihre Hoffnung ist ein Aushauchen des Lebens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „ihre Hoffnung: ein Aushauchen des Lebens“. Die hebräische Wendung ist schwierig; sie meint wahrscheinlich den letzten, ersterbenden Atemzug.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי רְשָׁעִים
  choice: die Augen der Frevler
  rationale: Bewahrt das konkrete hebräische Bild der versagenden Augen. „Frevler“ bezeichnet hier knapp und würdevoll Menschen, die schuldhaft böse handeln.
- source_word: תִּכְלֶינָה
  choice: werden versagen
  rationale: Mit „Augen“ bezeichnet das Verb ihr Erlahmen oder Sich-Erschöpfen bei vergeblichem Ausschauen; „versagen“ erhält das Bild, ohne es auszudeuten.
- source_word: מָנוֹס
  choice: jede Zuflucht
  rationale: Das Substantiv kann Flucht, Entrinnen oder einen Zufluchtsort bezeichnen. Im Deutschen gibt „Zuflucht“ den Gedanken einer nicht mehr verfügbaren Rettungsmöglichkeit natürlich wieder; „jede“ verdeutlicht idiomatisch deren völligen Verlust.
- source_word: אָבַד מִנְהֶם
  choice: wird ihnen verlorengehen
  rationale: Die Verbindung bedeutet, dass ihnen die Zuflucht beziehungsweise Möglichkeit des Entrinnens abhandenkommt. Die Zukunftsform folgt dem poetischen Zusammenhang mit den umgebenden Imperfektformen.
- source_word: תִקְוָתָם
  choice: ihre Hoffnung
  rationale: „Hoffnung“ ist die natürliche Entsprechung und lässt sowohl subjektives Hoffen als auch das Erwartete offen.
- source_word: מַפַּח נָפֶשׁ
  choice: ein Aushauchen des Lebens
  rationale: Die schwierige Wendung verbindet das Aus- beziehungsweise Wegblasen des Atems mit נֶפֶשׁ, das hier Leben oder Lebensatem bezeichnen kann. Die Formulierung wahrt das Todes- und Atembild, statt es als bloße „Verzweiflung“ aufzulösen.
theological_decisions:
- issue: Zeitbezug von „ihre Hoffnung“ und מַפַּח נָפֶשׁ
  choice: ihre Hoffnung ist nur noch ein Aushauchen des Lebens
  alternative: ihre Hoffnung wird ein Aushauchen des Lebens sein
  rationale: Im hebräischen Nominalsatz steht kein ausdrückliches Verb. Das Präsens bewahrt diese Offenheit und beschreibt pointiert, worauf ihre Hoffnung hinausläuft, ohne eine zusätzliche Zukunftsform einzutragen.
- issue: Deutung der schwierigen Schlusswendung
  choice: Todes- und Atembild ausdrücklich bewahren
  alternative: ihre Hoffnung ist Verzweiflung / ihre einzige Hoffnung ist der Tod
  rationale: Solche Alternativen lösen die Metapher theologisch und psychologisch stärker auf, als der schwierige hebräische Wortlaut erlaubt. Die Übersetzung wahrt dessen Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener hebräischer Bildsprache. Der Doppelpunkt beziehungsweise Nominalsatz wird im Deutschen durch „ist nur noch“ natürlich wiedergegeben; „nur noch“ markiert die bittere Zuspitzung, ohne die Hoffnung als positive Rettung umzudeuten.
