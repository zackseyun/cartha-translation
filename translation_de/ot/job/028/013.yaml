source:
  edition: WLC
  text: לֹא יָדַ֣ע אֱנ֣וֹשׁ עֶרְכָּ֑/הּ וְ/לֹ֥א תִ֝מָּצֵ֗א בְּ/אֶ֣רֶץ הַֽ/חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/013.yaml
  text: Man does not know its worth[b][a], and it is not found in the land of the living.
translation:
  language: de
  text: Kein Mensch kennt ihren Wert[a], und im Land der Lebenden ist sie nicht zu finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Preis“ beziehungsweise „ihre Bewertung“. Das hebräische Wort bezeichnet den bestimmten oder zugemessenen Wert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: Mensch
  rationale: Das singularische אֱנוֹשׁ bezeichnet hier den sterblichen Menschen repräsentativ. „Kein Mensch“ gibt zusammen mit der Verneinung die allgemeine Aussage natürlich und inklusiv wieder, ohne den Singular aufzugeben.
- source_word: יָדַע
  choice: kennt
  rationale: Das Qatal formuliert im Kontext eine allgemeine Wahrheit. Das deutsche Präsens ist daher angemessen; eine Wiedergabe mit „kann nicht erkennen“ würde eine im Verb nicht ausdrücklich enthaltene Unmöglichkeit hinzufügen.
- source_word: עֶרְכָּהּ
  choice: ihren Wert
  rationale: Das von ערך abgeleitete Substantiv bezeichnet Bewertung, Wert oder Preis. „Wert“ ist im Zusammenhang mit der Weisheit natürlich und weit genug, ohne die Aussage unnötig auf einen Kaufpreis zu verengen.
- source_word: תִמָּצֵא
  choice: ist sie nicht zu finden
  rationale: Das Nifal wird passiv wiedergegeben. Die deutsche Wendung ist idiomatisch und behauptet nicht ausdrücklich eine absolute Unauffindbarkeit.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: im Land der Lebenden
  rationale: Die feste poetische Wendung für den Bereich des irdischen menschlichen Lebens bleibt bildhaft und quellennah erhalten.
theological_decisions: []
translation_notes:
  register: Poetisches, würdiges Standarddeutsch mit klarer Syntax. Das feminine Pronomen „sie/ihren“ nimmt die Weisheit aus dem unmittelbaren Kontext auf. Die idiomatische Wendung „Land der Lebenden“ wird bewahrt.
