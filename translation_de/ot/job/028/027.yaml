  text: Then he saw it and declared it; he established it[a], and also searched it out.
translation:
  language: de
  text: Da sah er sie und zählte sie, setzte sie fest und erforschte sie auch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verkündete sie“, „zählte sie auf“ oder „legte sie dar“. Das hebräische Verb kann zählen, aufzählen, erzählen oder kundtun bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Damals
  rationale: Das temporale Adverb markiert den Zeitpunkt beziehungsweise die Abfolge; „Damals“ fügt sich natürlich in den poetischen Zusammenhang ein.
- source_word: רָאָהּ
  choice: sah er sie
  rationale: Das feminine Suffix verweist im unmittelbaren Kontext auf die Weisheit. „Sah“ bewahrt die konkrete Ausdrucksweise und kann zugleich umfassendes Wahrnehmen bezeichnen.
- source_word: וַיְסַפְּרָהּ
  choice: stellte sie dar
  rationale: ספר kann zählen, aufzählen, erzählen oder darlegen bedeuten. „Stellte sie dar“ wahrt hier die Aussage des Kundtuns, ohne die ebenfalls mögliche Bedeutung des Zählens zu verdecken.
- source_word: הֱכִינָהּ
  choice: gründete sie
  rationale: כון im Hifil bezeichnet das Festmachen, Bereiten oder Begründen. „Gründete“ vermittelt poetisch, dass Gott der Weisheit festen Bestand und Ordnung gab.
- source_word: וְגַם
  choice: und … auch
  rationale: Die Formulierung erhält die kumulative, leicht verstärkende Funktion der hebräischen Verbindung.
- source_word: חֲקָרָהּ
  choice: ergründete sie
  rationale: חקר bezeichnet gründliches Untersuchen und Ausforschen. „Ergründete“ gibt dies knapp und idiomatisch wieder und bildet einen angemessenen poetischen Abschluss.
theological_decisions:
- issue: Bezug der femininen Suffixe
  choice: Alle femininen Suffixe werden auf die im Kontext genannte Weisheit bezogen und mit „sie“ wiedergegeben.
  alternative: Die Suffixe könnten abstrakter auf das Maß oder die Ordnung der Weisheit bezogen werden.
  rationale: Der unmittelbare Kontext behandelt die Weisheit als Gegenstand von Gottes Sehen, Darstellen, Gründen und Ergründen. Das deutsche Femininum ermöglicht es, den grammatischen Bezug ohne zusätzliche Deutung sichtbar zu erhalten.
translation_notes:
  register: Poetisches, würdiges modernes Standarddeutsch. Die Reihe kurzer Verben und der Bezug auf „die Weisheit“ durch „sie“ bleiben erhalten; „gründete“ und „ergründete“ schaffen einen natürlichen deutschen Klang, ohne die unterschiedlichen hebräischen Verben gleichzusetzen.
