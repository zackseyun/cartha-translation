  text: אֱ֭לֹהִים הֵבִ֣ין דַּרְכָּ֑/הּ וְ֝/ה֗וּא יָדַ֥ע אֶת מְקוֹמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/023.yaml
  text: God understands its way[a], and he knows its place.
translation:
  language: de
  text: Gott versteht ihren Weg, und er kennt ihren Ort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Trotz der formal pluralischen Gestalt bezeichnet das Wort hier mit den singularischen Verben eindeutig den einen Gott.
- source_word: הֵבִין
  choice: versteht
  rationale: Der Hifil von בין bezeichnet Verstehen oder Erkennen. Das Präsens gibt die allgemeingültige Aussage über Gottes Wissen natürlich wieder.
- source_word: דַּרְכָּהּ
  choice: den Weg zu ihr
  rationale: Wörtlich ist auch „ihren Weg“ möglich. Im Zusammenhang der Suche nach der Weisheit bezeichnet die Wendung wahrscheinlich den Weg, auf dem sie zu finden ist; die Fußnote bewahrt die formale Alternative.
- source_word: וְהוּא
  choice: und er
  rationale: Die Konjunktion mit dem selbstständigen Pronomen hebt Gott als den Wissenden hervor, ohne dass im Deutschen eine stärkere Markierung nötig ist.
- source_word: יָדַע
  choice: kennt
  rationale: ידע bezeichnet hier sicheres Wissen. Das Präsens entspricht dem zeitlos-allgemeinen Charakter der Aussage.
- source_word: אֶת מְקוֹמָהּ
  choice: ihren Ort
  rationale: מקום bedeutet „Ort“ oder „Stätte“. Das feminine Pronomen bezieht sich im Deutschen natürlich auf die feminine „Weisheit“.
theological_decisions:
- issue: Bedeutung von דַּרְכָּהּ
  choice: „den Weg zu ihr“ als Weg, auf dem die Weisheit zu finden ist
  alternative: „ihren Weg“ als formale Wiedergabe der Possessivkonstruktion
  rationale: Der Kontext von Hiob 28 fragt, wo Weisheit gefunden werden kann und wo ihr Ort ist. Daher liegt die zielgerichtete Bedeutung nahe, ohne dass die wörtlichere Lesart ausgeschlossen wird; diese bleibt in der Fußnote erhalten.
- issue: Bezug der femininen Suffixe
  choice: Bezug auf die Weisheit mit deutschen femininen Pronomen
  alternative: Unpersönliche Wiedergabe, etwa „dessen/sein“, soweit die Zielsprache dies zulässt
  rationale: Anders als im Englischen ist „Weisheit“ auch im Deutschen grammatisch feminin. „ihr/ihren“ ist deshalb natürlich und verstärkt die Personifikation nicht unnötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Parallelstruktur des Hebräischen bleibt erhalten; „Weg zu ihr“ wird wegen des Suchmotivs im Kontext gewählt, während die formal mögliche Lesart in der Fußnote steht.
