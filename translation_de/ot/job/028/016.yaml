source:
  edition: WLC
  text: לֹֽא תְ֭סֻלֶּה בְּ/כֶ֣תֶם אוֹפִ֑יר בְּ/שֹׁ֖הַם יָקָ֣ר וְ/סַפִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/016.yaml
  text: It cannot be valued with the gold of Ophir[b][a], with precious onyx or sapphire.
translation:
  language: de
  text: Sie kann nicht mit Ofirgold aufgewogen werden, nicht mit kostbarem Onyx[a] und Saphir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Beryll“; welcher Edelstein mit dem hebräischen Ausdruck genau bezeichnet wird, ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: Möglicherweise „Lapislazuli“; die antike Bezeichnung entspricht nicht unbedingt der heutigen mineralogischen Einteilung.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְסֻלֶּה
  choice: aufgewogen werden
  rationale: Das Pual von סלל bezeichnet hier im Zusammenhang mit kostbaren Gütern eine Wertabwägung. „Mit … aufgewogen werden“ ist im Deutschen idiomatisch und bewahrt sowohl das Bild des Wiegens als auch die Aussage, dass Weisheit keinen entsprechenden Gegenwert hat.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: mit Ofirgold
  rationale: כֶּתֶם bezeichnet feines oder geläutertes Gold, während אוֹפִיר dessen berühmte Herkunft angibt. „Ofirgold“ ist knapp, natürlich und gibt die Präposition בְּ in diesem Vergleich mit „mit“ wieder.
- source_word: שֹׁהַם
  choice: Onyx
  rationale: Die genaue Bestimmung des Edelsteins ist unsicher. „Onyx“ ist die herkömmliche und allgemein verständliche Wiedergabe; die mögliche Alternative wird in einer Fußnote genannt.
- source_word: יָקָר
  choice: kostbar
  rationale: Das Adjektiv hebt den hohen Wert des שֹׁהַם hervor. „Kostbar“ ist im Deutschen eine natürliche Bezeichnung für Edelsteine und passt zum poetischen Register.
- source_word: סַפִּיר
  choice: Saphir
  rationale: „Saphir“ ist die traditionelle Wiedergabe, obwohl im antiken Sprachgebrauch möglicherweise Lapislazuli gemeint war. Diese Unsicherheit wird in einer Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch gut verständlich. Die feminine Form „Sie“ nimmt die im Zusammenhang behandelte Weisheit auf. Die Wiederholung von „nicht“ bildet die hebräische Wertungsreihe natürlich nach.
