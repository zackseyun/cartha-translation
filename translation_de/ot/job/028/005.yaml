  text: As for the earth[a], from it bread comes out, but underneath it is turned up as by fire.
translation:
  language: de
  text: 'Die Erde: Aus ihr kommt Brot hervor, doch unter ihr wird sie wie Feuer umgewendet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und unter ihr wird sie wie durch Feuer umgewendet“. Der hebräische Vergleich kann Ähnlichkeit („wie Feuer“) oder die Art und Weise („wie durch Feuer“) bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Der Zusammenhang stellt die Nahrung hervorbringende Erdoberfläche dem durch Bergbau umgewendeten Untergrund gegenüber; daher ist der allgemeine Sinn „Erde“ passender als „Land“ im territorialen Sinn.
- source_word: מִמֶּנָּה
  choice: aus ihr
  rationale: Das feminine Suffix bezieht sich auf אֶרֶץ; im Deutschen wird dieser grammatische Bezug mit „ihr“ natürlich beibehalten.
- source_word: יֵצֵא
  choice: kommt … hervor
  rationale: Die Wendung gibt die konkrete Bewegungsrichtung des Verbs wieder und klingt im Deutschen in Verbindung mit dem Ertrag der Erde natürlich und würdig.
- source_word: לָחֶם
  choice: Brot
  rationale: Die konkrete Bedeutung wird bewahrt, statt sie zu „Nahrung“ zu verallgemeinern; Brot steht hier anschaulich für den Ertrag der Erde.
- source_word: וְתַחְתֶּיהָ
  choice: doch unter ihr
  rationale: „Doch“ bringt den im Zusammenhang erkennbaren Gegensatz zwischen der fruchtbaren Oberfläche und dem aufgewühlten Untergrund zum Ausdruck, ohne das hebräische ו übermäßig zu präzisieren.
- source_word: נֶהְפַּךְ
  choice: wird alles umgewendet
  rationale: Der Niphal von הפך bezeichnet ein Umkehren oder Umwenden. Das ergänzte „alles“ macht im Deutschen verständlich, dass der Bereich unter der Erde gemeint ist, ohne einen neuen konkreten Gegenstand einzuführen.
- source_word: כְּמוֹ אֵשׁ
  choice: wie Feuer
  rationale: Die knappe Vergleichsform des Hebräischen bleibt erhalten. Sie lässt offen, ob das Unterirdische dem Feuer gleicht oder in einer dem Feuer vergleichbaren Weise umgewendet wird.
