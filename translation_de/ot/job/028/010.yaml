  register: Moderne, würdevolle poetische Sprache. Die anschauliche Formulierung „sein Auge“ bleibt erhalten; „Stollen“ macht den Bergbaukontext verständlich, während die Fußnote die eigentliche Bedeutungsbreite von יְאֹרִים offenlegt.
