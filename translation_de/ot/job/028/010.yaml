  text: He cuts channels through the rocks[b][a], and his eye sees every precious thing.
translation:
  language: de
  text: Er bricht Kanäle durch die Felsen[a], und sein Auge sieht alles Kostbare[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wasserläufe“. Das hebräische Wort kann Wasserläufe oder Kanäle bezeichnen; seine genaue Bedeutung im Bergbauzusammenhang ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alles Wertvolle“; im Zusammenhang möglicherweise kostbares Erz oder Edelsteine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצּוּרוֹת
  choice: in den Felsen
  rationale: צוּר bezeichnet Fels oder hartes Gestein. Die Präposition ב wird hier räumlich verstanden; zusammen mit dem Verb beschreibt die Wendung das Aufbrechen von Gestein.
- source_word: יְאֹרִים
  choice: Stollen
  rationale: יְאֹרִים bezeichnet gewöhnlich Wasserläufe oder Kanäle. Im bergbaulichen Zusammenhang sind jedoch in den Fels getriebene Gänge gemeint; „Stollen“ gibt dieses Bild im Deutschen natürlich wieder, bleibt aber eine kontextuelle Deutung.
- source_word: בִּקֵּעַ
  choice: bricht
  rationale: בקע bedeutet spalten, aufbrechen oder durchbrechen. „bricht“ bewahrt die Kraft des Verbs und passt zum Vortreiben von Stollen im Fels.
- source_word: יְקָר
  choice: alles Kostbare
  rationale: יְקָר bezeichnet etwas Kostbares oder Wertvolles, ohne es ausdrücklich auf Erz oder Edelsteine einzugrenzen.
- source_word: רָאֲתָה עֵינוֹ
  choice: sein Auge erblickt
  rationale: Die wörtliche Wendung „sein Auge sieht/hat gesehen“ wird beibehalten. Das Präsens fügt sich in die allgemeine poetische Beschreibung; „erblickt“ klingt natürlich und bewahrt das anschauliche Subjekt „sein Auge“.
