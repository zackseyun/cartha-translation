  text: פָּ֤רַץ נַ֨חַל מֵֽ/עִם גָּ֗ר הַֽ/נִּשְׁכָּחִ֥ים מִנִּי רָ֑גֶל דַּ֖לּוּ מֵ/אֱנ֣וֹשׁ נָֽעוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/004.yaml
  text: He breaks open a shaft away from where people dwell[a]; forgotten by the foot, they hang far from men[c][b], they sway.
translation:
  language: de
  text: Fern von bewohnten Orten bricht man einen Schacht aus[a]; vom Fuß vergessen[b] hängen[c] sie fern von Menschen, sie schwanken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, den schwierigen hebräischen Wortlaut enger wiedergebend: »Fern von einem Ansässigen/Fremden bricht man eine Rinne oder ein Bachbett auf.« Das mit »Schacht« übersetzte Wort bedeutet sonst meist »Bach«, »Wadi« oder »Rinne«; hier wird es häufig im Licht des Bergbaus verstanden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »vom Fuß vergessen«. Gemeint ist wohl, dass dieser Ort oder diese Arbeiter außerhalb der Wahrnehmung oder Reichweite der Menschen liegen, die oben zu Fuß unterwegs sind.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »sie werden hinabgelassen« beziehungsweise »sie baumeln«. Das hebräische Verb kann ein Hängen oder Herablassen bezeichnen, vermutlich an Seilen in einem Bergwerk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַץ
  choice: bricht … auf
  rationale: Das Verb bezeichnet ein gewaltsames Durchbrechen oder Aufbrechen und passt zur Erschließung eines Grubenschachts.
- source_word: נַחַל
  choice: Schacht
  rationale: נַחַל bedeutet gewöhnlich »Bach«, »Wadi« oder »Rinne«. Im Bergbaukontext von Hiob 28 liegt jedoch eine künstlich aufgebrochene Vertiefung oder ein Schacht nahe; die ungewöhnliche Verwendung bleibt in einer Fußnote sichtbar.
- source_word: מֵעִם גָּר
  choice: fern von jeder Siedlung
  rationale: Die schwierige Wortfolge bezeichnet wahrscheinlich einen Ort abseits menschlichen Wohnens. Die Übersetzung gibt diesen wahrscheinlichen räumlichen Sinn natürlich wieder, ohne die wörtlich mögliche Beziehung zum »Fremden/Beisassen« zu verschweigen.
- source_word: הַנִּשְׁכָּחִים מִנִּי רָגֶל
  choice: vom Fuß vergessen
  rationale: Die verdichtete hebräische Wendung wird bildhaft und formal nah wiedergegeben. Gemeint sein dürfte, dass die Bergleute oder der Ort außerhalb des Bereichs gewöhnlicher Fußgänger liegen.
- source_word: דַּלּוּ
  choice: hängen sie
  rationale: Das Verb kann ein Herabhängen, Hinabgelassenwerden oder Baumeln bezeichnen. Im Bergbauzusammenhang ist das Hängen an Seilen wahrscheinlich.
- source_word: מֵאֱנוֹשׁ
  choice: fern von Menschen
  rationale: אֱנוֹשׁ bezeichnet den sterblichen Menschen beziehungsweise die Menschheit; »Menschen« ist im Deutschen generisch, natürlich und inklusiv.
- source_word: נָעוּ
  choice: sie schwanken
  rationale: Das Verb bezeichnet eine unsichere Hin-und-her-Bewegung und zeichnet anschaulich das Schwanken hängender Bergleute.
