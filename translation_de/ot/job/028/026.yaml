  text: when he made a decree for the rain[a], and a path for the thunderbolt of the storms,
translation:
  language: de
  text: als er dem Regen eine Ordnung gab und dem Blitz des Donners eine Bahn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und dem Blitz der Donnerstimmen eine Bahn“.'
