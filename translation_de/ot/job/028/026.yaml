lexical_decisions:
- source_word: בַּעֲשֹׂתוֹ
  choice: als er … gab
  rationale: Die Präposition ב mit dem Infinitivus constructus und Suffix hat hier temporale Bedeutung. Im Deutschen gibt „als er“ den zeitlichen Nebensatz natürlich wieder; עשה wird zusammen mit חֹק idiomatisch als „eine Ordnung geben“ ausgedrückt.
- source_word: לַמָּטָר
  choice: dem Regen
  rationale: מָטָר bezeichnet den Regen und steht mit Artikel. Der deutsche Dativ ergibt sich aus der idiomatischen Verbindung „jemandem/etwas eine Ordnung geben“.
- source_word: חֹק
  choice: eine Ordnung
  rationale: חֹק bezeichnet etwas Festgesetztes oder Vorgeschriebenes. Im kosmologischen Zusammenhang meint es die von Gott gesetzte Regelung für den Regen. „Ordnung“ bewahrt diesen Sinn, ohne ihn auf einen räumlichen „Grenzwert“ oder einen rein juristischen „Erlass“ zu verengen.
- source_word: וְדֶרֶךְ
  choice: und … eine Bahn
  rationale: דֶּרֶךְ bedeutet Weg oder Pfad. Für den Verlauf einer Himmelserscheinung ist „Bahn“ im Deutschen natürlich und bildkräftig.
- source_word: לַחֲזִיז
  choice: dem Wetterleuchten
  rationale: חֲזִיז bezeichnet hier einen Blitz beziehungsweise eine blitzartige Wettererscheinung. „Wetterleuchten“ lässt die enge Verbindung mit dem folgenden Donnersausdruck bestehen und vermeidet die zusätzliche Vorstellung eines einschlagenden „Donnerkeils“.
- source_word: קֹלוֹת
  choice: des Donners
  rationale: קוֹל bedeutet Stimme oder Schall und kann im Wetterkontext Donner bezeichnen. Der hebräische Plural lässt sich im idiomatischen Deutschen kollektiv mit „Donner“ wiedergeben; die wörtlichere Form wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Gott setzt der Schöpfung eine feste Ordnung
  choice: Der Vers beschreibt knapp, wie Gott Regen und Gewittererscheinungen eine Ordnung beziehungsweise Bahn gibt.
  alternative: Eine stärker ausdeutende Fassung, die ausdrücklich Gottes fortwährende Vorsehung oder uneingeschränkte Naturbeherrschung formuliert.
  rationale: Der poetische Text setzt Gottes ordnendes Handeln voraus, entfaltet daraus aber keine systematische Lehre. Die Übersetzung wahrt diese Aussage, ohne sie dogmatisch zu erweitern.
translation_notes:
  register: Moderne, gehobene Standardsprache mit poetischem Rhythmus. „Ordnung“ und „Bahn“ bilden die parallelen göttlichen Setzungen des hebräischen Verses ab; die ungewöhnliche Verbindung von Blitz und pluralischen „Stimmen/Donnern“ bleibt über die Fußnote sichtbar.
