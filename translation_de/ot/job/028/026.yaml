    issue: „Wetterleuchten“ für חֲזִיז
    rationale: Das deutsche Wort bezeichnet typischerweise einen fernen Lichtschein am Horizont und kann gerade ohne hörbaren Donner auftreten. חֲזִיז bezeichnet hier eine Blitzerscheinung; „Blitz“ wahrt die meteorologische Bildsprache und die Verbindung zu קֹלוֹת besser.
