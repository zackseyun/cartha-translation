  text: But where can wisdom be found[a], and where is the place of understanding?
translation:
  language: de
  text: Doch woher ist Weisheit zu finden?[a] Und wo ist der Ort der Einsicht?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Von woher wird Weisheit gefunden werden?“'
    reason: Die Fußnote macht die Präposition in מֵאַיִן („von woher“) sowie die passive Imperfektform von תִּמָּצֵא sichtbar. Die Zukunftsform dient hier der formnahen Wiedergabe; im Haupttext wird die rhetorisch-modale Funktion idiomatisch wiedergegeben.
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Doch die Weisheit
  rationale: Das Präfix וְ leitet hier nach der Schilderung des Bergbaus eine rhetorische Gegenwendung ein. „Doch“ gibt diesen Übergang natürlich wieder; der bestimmte Artikel des Hebräischen wird bewahrt.
- source_word: מֵאַיִן
  choice: woher
  rationale: מֵאַיִן fragt ausdrücklich nach Herkunft oder Quelle. Das moderne deutsche „woher“ bildet diese Bedeutung präzise und idiomatisch ab.
- source_word: תִּמָּצֵא
  choice: ist sie zu finden
  rationale: Der Nifal-Imperfekt von מצא bezeichnet das Gefundenwerden. In der rhetorischen Frage drückt „ist … zu finden“ die Möglichkeit aus, ohne einen bloß zukünftigen Zeitpunkt festzulegen.
- source_word: וְאֵי זֶה מְקוֹם
  choice: Und wo ist der Ort
  rationale: Die hebräische Wendung fragt idiomatisch nach dem Ort. זֶה wird nicht mechanisch als „dieser“ wiedergegeben, sondern innerhalb der natürlichen deutschen Fragekonstruktion erfasst.
- source_word: בִּינָה
  choice: Einsicht
  rationale: בִּינָה bezeichnet verstehendes Unterscheidungsvermögen. „Einsicht“ ist im Deutschen würdevoll und wahrt zugleich die begriffliche Unterscheidung zur „Weisheit“.
