  text: וְֽ֭/נֶעֶלְמָה מֵ/עֵינֵ֣י כָל חָ֑י וּ/מֵ/ע֖וֹף הַ/שָּׁמַ֣יִם נִסְתָּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/021.yaml
  text: It is hidden from the eyes of every living thing[a], and concealed from the birds of the heavens.
translation:
  language: de
  text: Sie ist den Augen alles Lebendigen verborgen und vor den Vögeln des Himmels verhüllt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶעֶלְמָה
  choice: Sie ist … verborgen
  rationale: Das feminine Pronomen nimmt die im Kontext genannte Weisheit auf. Das Nifal Perfekt von עלם wird resultativ-passiv wiedergegeben; die einleitende Konjunktion muss im Deutschen nicht eigens mit „und“ ausgedrückt werden.
- source_word: מֵעֵינֵי
  choice: den Augen … verborgen
  rationale: Die deutsche Fügung „jemandes Augen verborgen sein“ bewahrt das hebräische Augenbild und klingt zugleich natürlich und würdig.
- source_word: כָל חָי
  choice: alles Lebendige
  rationale: Die substantivierte Form gibt den umfassenden Sinn wieder, ohne den Ausdruck unnötig auf Menschen oder Tiere einzuengen.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: und vor den Vögeln des Himmels
  rationale: עוֹף wird im Kontext idiomatisch als „Vögel“ verstanden. „Des Himmels“ bewahrt die poetische hebräische Wendung genauer als das ebenfalls mögliche „des Himmelsraums“ oder „am Himmel“.
- source_word: נִסְתָּרָה
  choice: verhüllt
  rationale: Das Nifal Perfekt von סתר bezeichnet das Verborgensein. „Verhüllt“ erhält den synonymen Parallelismus, ohne „verborgen“ unmittelbar zu wiederholen.
theological_decisions:
- issue: Bezug des femininen Verbs
  choice: „Sie“ bezieht sich auf die Weisheit aus dem unmittelbaren Kontext.
  alternative: Unpersönliches „Es“
  rationale: Die feminine Verbform nimmt grammatisch und sachlich die Weisheit (חָכְמָה) aus Vers 20 auf; „Sie“ macht diesen Zusammenhang im Deutschen klar, ohne eine zusätzliche Deutung einzuführen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit dichterischem Parallelismus. Die beiden Halbverse werden eng parallel gestaltet; die hebräische Bildsprache von Augen und Himmel bleibt erhalten.
