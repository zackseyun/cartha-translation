  yaml_path: translation/ot/job/028/003.yaml
  text: He sets an end to darkness[a], and he searches out every limit, the stones of gloom and deep darkness.
translation:
  language: de
  text: Er setzt der Finsternis ein Ende; bis zur äußersten Grenze erforscht er das Gestein der Dunkelheit und der tiefsten Finsternis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell für „tiefste Finsternis“: „Todesschatten“.'
    reason: Bewahrt die traditionelle Wiedergabe von צַלְמָוֶת, während die Hauptfassung den Bergbaukontext und die Bedeutung tiefer Dunkelheit abbildet.
lexical_decisions:
- source_word: קֵץ שָׂם לַחֹשֶׁךְ
  choice: Er setzt der Finsternis ein Ende
  rationale: Die Wendung gibt das konkrete Setzen einer Grenze bzw. eines Endes idiomatisch wieder und bewahrt die bildhafte Aussage des Hebräischen.
- source_word: וּלְכָל תַּכְלִית
  choice: bis an die äußerste Grenze
  rationale: תַּכְלִית bezeichnet hier die äußerste Grenze oder den fernsten erreichbaren Punkt. Die Formulierung passt zum umfassenden Vordringen des Bergmanns.
- source_word: הוּא חוֹקֵר
  choice: erforscht
  rationale: חקר bezeichnet gründliches Suchen und Erkunden; „erforscht“ wahrt diese untersuchende, erschließende Bedeutung im Bergbaukontext.
- source_word: אֶבֶן
  choice: das Gestein
  rationale: Der Singular kann kollektiv verstanden werden. „Gestein“ ist im deutschen Bergbaukontext natürlicher als „Stein“ und hält zugleich am singularisch-kollektiven Bild fest.
- source_word: אֹפֶל
  choice: im Dunkel
  rationale: אֹפֶל bezeichnet Dunkelheit oder Düsterkeit. „Dunkel“ unterscheidet den Ausdruck von חֹשֶׁךְ und bleibt in modernem Deutsch verständlich.
- source_word: וְצַלְמָוֶת
  choice: in tiefer Finsternis
  rationale: Im Zusammenhang des unterirdischen Bergbaus bezeichnet צַלְמָוֶת am ehesten tiefste Dunkelheit. Die traditionelle Deutung „Todesschatten“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe von צַלְמָוֶת
  choice: tiefe Finsternis
  alternative: Todesschatten
  rationale: Der unmittelbare Bergbaukontext spricht für die Bedeutung einer besonders tiefen unterirdischen Dunkelheit. Da die traditionelle Analyse des Wortes und seine Deutung als „Todesschatten“ nicht ausgeschlossen werden sollen, wird sie ausdrücklich als Alternative genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satz bleibt knapp und poetisch; „Gestein“ macht den Bergbaukontext verständlich, ohne die Bildsprache auszudeuten.
