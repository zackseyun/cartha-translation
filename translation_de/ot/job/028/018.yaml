base_translation:
  language: en
  yaml_path: translation/ot/job/028/018.yaml
  text: Coral and crystal are not worth mentioning, and the price of wisdom is above pearls.
translation:
  language: de
  text: Korallen und Kristall sind nicht der Rede wert; Weisheit zu erwerben[a] ist mehr wert als Perlen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Der Wert der Weisheit; das hebräische Wort ist nur hier belegt und in seiner Bedeutung unsicher.'
    reason: Kennzeichnet die lexikalische Unsicherheit des seltenen מֶשֶׁךְ.
  - marker: b
    text: 'Oder: Rubine; welche Kostbarkeit gemeint ist, lässt sich nicht sicher bestimmen.'
    reason: Bewahrt die Unsicherheit bei der Identifikation von פְּנִינִים.
lexical_decisions:
- source_word: רָאמוֹת (rāmôt)
  choice: Korallen
  rationale: Die genaue Bestimmung des kostbaren Materials ist unsicher; „Korallen“ ist eine verbreitete und im Zusammenhang passende Wiedergabe.
- source_word: גָבִישׁ (gābîš)
  choice: Kristall
  rationale: Das seltene Wort bezeichnet wahrscheinlich ein durchsichtiges oder kristallines kostbares Material.
- source_word: לֹא יִזָּכֵר (lōʾ yizzākēr)
  choice: sind nicht der Rede wert
  rationale: Wörtlich „werden nicht erwähnt“; im Preisvergleich bedeutet die Wendung idiomatisch, dass diese Kostbarkeiten gegenüber der Weisheit nicht ins Gewicht fallen.
- source_word: מֶשֶׁךְ חָכְמָה (mešek ḥokmāh)
  choice: Weisheit zu erwerben
  rationale: מֶשֶׁךְ ist hier schwer zu bestimmen. Die Wiedergabe als Erwerb bzw. Beschaffung der Weisheit bewahrt den Gedanken des aufzubringenden Gegenwerts, ohne das seltene Substantiv zu präzise als festen „Preis“ festzulegen.
- source_word: פְּנִינִים (penînîm)
  choice: Perlen
  rationale: Das Wort bezeichnet kostbare Schmucksteine oder organische Kostbarkeiten, ist aber nicht sicher identifiziert; „Perlen“ passt zum Wertvergleich und vermeidet eine Wiederholung von „Korallen“.
theological_decisions:
- issue: Unvergleichlicher Wert der Weisheit
  choice: Der Vers stellt den Erwerb der Weisheit über kostbare Materialien, ohne zu behaupten, Weisheit sei tatsächlich käuflich.
  alternative: „Der Preis der Weisheit übertrifft Perlen“
  rationale: Die Infinitivkonstruktion im Deutschen hält den Wert- und Erwerbsgedanken zusammen und vermeidet den möglichen Eindruck, Weisheit habe einen buchstäblichen Marktpreis.
translation_notes:
  register: Dignige, gut verständliche Standardsprache. „Nicht der Rede wert“ gibt die hebräische Wendung natürlich wieder; der parallele Wertvergleich bleibt klar und prägnant.
