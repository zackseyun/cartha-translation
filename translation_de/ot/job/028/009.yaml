  text: An den Feuerstein legt er Hand an[a]; Berge stürzt er von der Wurzel her um[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gegen den Feuerstein streckt er seine Hand aus“ beziehungsweise „An das harte Gestein legt er Hand an“. Das Hebräische kann die Arbeit am harten Fels beim Bergbau beschreiben.'
