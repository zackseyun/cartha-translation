lexical_decisions:
- source_word: בַּחַלָּמִישׁ
  choice: an den Feuerstein
  rationale: חַלָּמִישׁ bezeichnet Feuerstein beziehungsweise sehr hartes Gestein. Mit „an“ bleibt die auf den Fels gerichtete bergmännische Arbeit erkennbar, ohne die Präposition enger festzulegen, als der Kontext erlaubt.
- source_word: שָׁלַח יָדוֹ
  choice: legt er Hand an
  rationale: Die Wendung bezeichnet hier das tätige Ausstrecken beziehungsweise Anlegen der Hand. „Hand anlegen“ ist im Deutschen natürlich und vermittelt entschlossenes menschliches Eingreifen.
- source_word: הָפַךְ
  choice: wühlt er … um
  rationale: הפך bedeutet wenden, umkehren oder umstürzen. Im Bergbauzusammenhang gibt „umwühlen“ die tiefgreifende Aufgrabung anschaulich wieder, ohne eine bloß oberflächliche Bewegung nahezulegen.
- source_word: מִשֹּׁרֶשׁ
  choice: von der Wurzel her
  rationale: Der hebräische Singular „Wurzel“ steht bei den Bergen kollektiv und bezeichnet ihren tiefsten Grund. Die Formulierung bewahrt den Singular und die Herkunftsangabe מן.
- source_word: הָרִים
  choice: Berge
  rationale: הָרִים bedeutet hier allgemein „Berge“; der artikellose deutsche Plural entspricht dem poetisch-generischen Sinn.
