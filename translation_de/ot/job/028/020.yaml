  text: וְֽ֭/הַ/חָכְמָה מֵ/אַ֣יִן תָּב֑וֹא וְ/אֵ֥י זֶ֝֗ה מְק֣וֹם בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/020.yaml
  text: But wisdom—from where does it come? And where is the place of understanding?[a]
translation:
  language: de
  text: Doch die Weisheit – woher kommt sie? Und wo ist der Ort der Einsicht?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Etwas formaler: „Woher kommt die Weisheit, und wo ist der Ort der Einsicht?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Doch die Weisheit
  rationale: חָכְמָה bedeutet „Weisheit“. Das vorangestellte וְ kann schlicht „und“ heißen, markiert hier im Zusammenhang aber die kontrastierende Rückkehr zur Leitfrage des Gedichts; „doch“ gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: מֵאַיִן
  choice: woher
  rationale: Die Präposition מִן mit dem Fragewort אַיִן fragt nach Herkunft oder Ursprung. „Woher“ bewahrt diesen Akzent knapp und idiomatisch.
- source_word: תָּבוֹא
  choice: kommt sie
  rationale: Das Qal-Imperfekt, 3. Person Femininum Singular von בוא, bezieht sich auf „Weisheit“ und hat hier allgemein-gegenwärtigen Sinn. „Kommt sie“ entspricht der rhetorischen Frage besser als eine Zukunftsform.
- source_word: וְאֵי זֶה
  choice: Und wo ist
  rationale: 'Die Wendung ist örtlich zu verstehen: „und wo ist“. Ein zusätzliches „denn“ wäre möglich, aber nicht erforderlich.'
- source_word: מְקוֹם
  choice: der Ort
  rationale: מְקוֹם heißt „Ort“ oder „Platz“. „Der Ort“ wahrt das räumliche Bild und den würdigen poetischen Ton.
- source_word: בִּינָה
  choice: Einsicht
  rationale: בִּינָה bezeichnet Verstehen, Einsicht oder Unterscheidungsvermögen. „Einsicht“ bildet im Deutschen ein natürliches Begriffspaar mit „Weisheit“ und vermeidet den etwas schwerfälligen Ausdruck „Verständnis“.
