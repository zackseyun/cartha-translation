  text: לֹא יֻתַּ֣ן סְג֣וֹר תַּחְתֶּ֑י/הָ וְ/לֹ֥א יִ֝שָּׁקֵ֗ל כֶּ֣סֶף מְחִירָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/015.yaml
  text: Fine gold cannot be given in exchange for it[c][b][a], nor can silver be weighed as its price.
translation:
  language: de
  text: Feingold kann nicht als Gegenwert für sie gegeben werden,[a] und Silber lässt sich nicht als ihr Preis abwiegen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lauteres Gold kann nicht für sie gegeben werden.“'
    reason: lexical_alternative
  - marker: b
    text: 'Silber wurde als Zahlungsmittel nach Gewicht abgewogen. Gemeint ist: Kein Silber lässt sich als Gegenwert für sie abwiegen.'
    reason: cultural_note
lexical_decisions:
- source_word: יֻתַּן
  choice: kann … gegeben werden
  rationale: Das passive Verb bezeichnet hier, was als Gegenwert angeboten oder entrichtet werden kann; zusammen mit לֹא drückt es Unmöglichkeit aus.
- source_word: סְגוֹר
  choice: Feingold
  rationale: Das seltene poetische Wort bezeichnet hochwertiges, geläutertes Gold; „Feingold“ ist im Deutschen prägnant und wahrt die Wertvorstellung.
- source_word: תַּחְתֶּיהָ
  choice: im Tausch für sie
  rationale: תחת bezeichnet hier Ersatz beziehungsweise Tauschwert, nicht eine räumliche Lage. Das Suffix bezieht sich auf die Weisheit im Kontext.
- source_word: יִשָּׁקֵל
  choice: kann … abgewogen werden
  rationale: Das Passiv von שקל verweist auf das Abwiegen von Silber als Zahlungsmittel und entspricht parallel der Unmöglichkeitsaussage im ersten Halbvers.
- source_word: כֶּסֶף
  choice: Silber
  rationale: Die konkrete Bedeutung „Silber“ bewahrt das antike Bild einer Zahlung nach Gewicht, auch wenn Silber hier als Geld dient.
- source_word: מְחִירָהּ
  choice: ihr Preis
  rationale: מְחִיר bezeichnet den Kauf- oder Gegenwert; „ihr Preis“ ist natürlich und erhält das Handelsbild.
theological_decisions:
- issue: Bezugswort der femininen Suffixe
  choice: „sie/ihr“ bezieht sich auf die Weisheit aus dem vorhergehenden Kontext
  alternative: Das Bezugswort im Vers ausdrücklich als „Weisheit“ wiederholen
  rationale: Die hebräischen Suffixe setzen das Bezugswort voraus. Das Pronomen erhält den Zusammenhang, ohne eine im Vers selbst nicht wiederholte Bezeichnung einzufügen.
- issue: Syntaktische Rollen im ersten Halbvers
  choice: Feingold ist das Subjekt dessen, was nicht als Gegenwert gegeben werden kann
  alternative: Die Weisheit könne nicht für Feingold hingegeben werden
  rationale: Die hebräische Wortstellung und Grammatik weisen סְגוֹר als Subjekt des passiven יֻתַּן und תַּחְתֶּיהָ als Tauschbestimmung aus.
translation_notes:
  register: Moderne, gehobene Standardsprache mit erhaltener poetischer Parallelität. „Feingold“ und „Silber abwiegen“ bewahren die konkrete antike Wert- und Handelssprache; die feminine Pronominalreferenz auf die Weisheit bleibt erhalten.
