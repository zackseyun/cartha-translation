  text: כִּי ה֭וּא לִ/קְצוֹת הָ/אָ֣רֶץ יַבִּ֑יט תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם יִרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/024.yaml
  text: For he looks to the ends of the earth[b][a]; he sees under all the heavens.
translation:
  language: de
  text: Denn er blickt bis an die Enden der Erde; er sieht unter allen Himmeln.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage über Gottes Kenntnis der Weisheit; „Denn“ gibt diese erklärende Funktion natürlich wieder.
- source_word: הוּא
  choice: er
  rationale: Das Pronomen bezieht sich im Zusammenhang eindeutig auf Gott; die Kleinschreibung entspricht dem modernen deutschen Gebrauch.
- source_word: לִקְצוֹת הָאָרֶץ
  choice: bis an die Enden der Erde
  rationale: Die Wendung bezeichnet die äußersten Bereiche der Erde. „Bis an die Enden der Erde“ ist idiomatisch, würdevoll und bewahrt die räumliche Weite.
- source_word: יַבִּיט
  choice: blickt
  rationale: Das Hifil von נבט bezeichnet ein gerichtetes Hinschauen. „blickt“ erhält die bewusste Ausrichtung und passt zum poetischen Parallelismus.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: alles unter dem Himmel
  rationale: Im Deutschen gibt „alles unter dem Himmel“ den umfassenden Sinn von כָּל in Verbindung mit dem räumlichen תַּחַת natürlich wieder. Der formale hebräische Plural wird in der Fußnote kenntlich gemacht.
- source_word: יִרְאֶה
  choice: er sieht
  rationale: ראה ist das gewöhnliche Verb für „sehen“. Die schlichte Wiedergabe wahrt den Parallelismus mit „blickt“.
theological_decisions:
- issue: Bezug des Pronomens הוּא
  choice: Das Subjekt ist Gott, dessen umfassender Blick beschrieben wird.
  alternative: Das Pronomen ohne kontextuelle Identifizierung als unbestimmt auffassen.
  rationale: Der unmittelbare Zusammenhang von Ijob 28 identifiziert den, der den Ort der Weisheit kennt und die ganze Schöpfung überschaut, eindeutig als Gott; eine ausdrückliche Einfügung des Namens in den Vers ist dennoch nicht nötig.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit dichterischer Würde. Die parallelen Verben „blickt“ und „sieht“ sowie die umfassende räumliche Bildsprache bleiben erhalten.
