  naturalness: „Denn er blickt bis an die Enden der Erde; er sieht unter allen Himmeln“ ist modernes, verständliches Deutsch mit einer dem poetischen Register angemessenen, leicht gehobenen Bildsprache. Die parallelen Verben bleiben erhalten.
  terminology: „Enden der Erde“, „blickt“, „sieht“ und „Himmeln“ entsprechen dem hebräischen Wortlaut und seinem poetischen Parallelismus. Der Gottesbezug des Pronomens bleibt kontextuell, ohne den Gottesnamen ergänzend einzuführen.
