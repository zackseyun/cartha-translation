- from: Denn er blickt bis an die Enden der Erde; er sieht alles unter dem Himmel.[a]
  to: Denn er blickt bis an die Enden der Erde; er sieht unter allen Himmeln.
  rationale: Die Revision entfernt die nicht im Ausgangstext vorhandene Ergänzung „alles“ und gibt כָּל הַשָּׁמַיִם als „allen Himmeln“ wieder. Dadurch werden Wortlaut, Parallelismus und poetische Weite des Hebräischen gewahrt, ohne die Aussage zu interpretativ zu verstärken. Da der hebräische Plural nun im Text erscheint, ist die bisherige Fußnote entbehrlich.
