lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: als er … gab
  rationale: Der Infinitiv mit ל setzt im Zusammenhang die zeitliche Beschreibung von Gottes ordnendem Handeln fort. Die Wiedergabe mit „als“ ist im Deutschen natürlich; zusammen mit מִשְׁקָל passt „gab“ idiomatisch.
- source_word: לָרוּחַ
  choice: dem Wind
  rationale: רוּחַ kann auch „Geist“ oder „Atem“ bedeuten; die Parallele zu den Wassern und der Schöpfungskontext sprechen hier für die meteorologische Bedeutung.
- source_word: מִשְׁקָל
  choice: sein Gewicht
  rationale: Das Substantiv bezeichnet Gewicht beziehungsweise das Wiegen. „Sein Gewicht“ drückt aus, dass Gott dem Wind sein bestimmtes Gewicht zuweist, ohne das Bild aufzulösen.
- source_word: וּמַיִם
  choice: die Wasser
  rationale: Die Pluralform und der poetische Parallelismus werden mit „die Wasser“ bewahrt.
- source_word: תִּכֵּן
  choice: abmaß
  rationale: Das Verb bezeichnet genaues Messen, Abwägen oder Bestimmen. „Abmaß“ wahrt das Bild geordneter Quantifizierung und verbindet sich natürlich mit „nach Maß“.
- source_word: בְּמִדָּה
  choice: nach Maß
  rationale: Die Wendung bezeichnet einen Maßstab oder eine zugemessene Menge. „Nach Maß“ ist prägnant, gegenwärtig und bildet die hebräische Konstruktion angemessen ab.
theological_decisions:
- issue: Fortgeltendes Subjekt aus dem vorhergehenden Vers
  choice: Das unausgesprochene Subjekt wird als Gott („er“) verstanden.
  alternative: 'Den Infinitiv formal ohne ausdrücklich genanntes Subjekt wiedergeben: „um dem Wind Gewicht zu geben“.'
  rationale: Die Infinitivkonstruktion hängt vom Kontext ab und führt die Beschreibung von Gottes Handeln fort. Das Pronomen macht dies im Deutschen lesbar, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die Wiederholung „Maß/abmaß“ bildet die hebräische Mess- und Ordnungsmetaphorik nach; die beiden Fußnotenmarker stehen vollständig im Haupttext.
