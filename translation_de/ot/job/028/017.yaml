  text: Gold and glass cannot equal it[b][a], nor can its exchange be an article of fine gold.
translation:
  language: de
  text: Gold und Glas kommen ihr nicht gleich,[a] und kein Gefäß aus Feingold kann als Tausch für sie dienen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kristall“. Das hebräische Wort זְכוֹכִית kann ein durchsichtiges kostbares Material bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Und ihr Tausch ist kein Gefäß aus Feingold.“ „Gefäß“ kann auch allgemeiner „Gegenstand“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: kommen ihr nicht gleich
  rationale: Das Verb ערך bezeichnet hier das vergleichende Abschätzen. Die Formulierung bringt zum Ausdruck, dass Gold und Glas den Wert der Weisheit nicht erreichen; das feminine Suffix verweist im Zusammenhang auf die Weisheit.
- source_word: זָהָב
  choice: Gold
  rationale: Die übliche und kontextuell eindeutige Bezeichnung des Edelmetalls.
- source_word: זְכוֹכִית
  choice: Glas
  rationale: Das Wort bezeichnet wahrscheinlich Glas, das in der Antike ein kostbarer transparenter Werkstoff war. „Kristall“ bleibt eine mögliche traditionelle Alternative.
- source_word: תְמוּרָתָהּ
  choice: für sie eintauschen
  rationale: תמורה bezeichnet Tausch oder Ersatz. Die verbale Wiedergabe bewahrt das Handelsbild und klingt im Deutschen natürlicher als eine substantivische Formulierung mit „Tauschwert“.
- source_word: כְּלִי פָז
  choice: ein Gefäß aus Feingold
  rationale: כְּלִי kann allgemein einen Gegenstand oder ein Gerät, hier aber gut ein gearbeitetes Gefäß bezeichnen; פָז meint besonders kostbares, geläutertes Gold.
