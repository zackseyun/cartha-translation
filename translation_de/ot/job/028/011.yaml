  source_fidelity: 'Die Grundbedeutung ist zutreffend: חִבֵּשׁ bezeichnet ein Binden, Aufhalten oder Abdichten, und die zweite Zeile gibt תעלומהּ ... יוציא אור treffend als das Ans-Licht-Bringen von Verborgenem wieder. Die seltene Form מִבְּכִי bleibt jedoch unsicher; „Sickerstellen ... abdämmen“ macht aus ihr konkrete Stellen und verbindet sie mit „abdämmen“ in einer im Deutschen sachlich nicht ganz passenden Weise.'
  naturalness: '„Sickerstellen der Ströme abdämmen“ ist im modernen Deutsch ungewohnt: Sickerstellen werden eher abgedichtet, während Wasser(-fluss) aufgestaut oder zurückgehalten wird. „Das Sickerwasser der Ströme zurückhalten“ ist idiomatischer und hält die bildliche sowie lexikalische Offenheit besser aufrecht.'
  terminology: „Ströme“, „Verborgenes“ und „ans Licht bringen“ sind registergerecht und bewahren die poetische Knappheit. Die Fußnote soll die mögliche Anspielung auf Weinen sowie die alternativen Deutungen als Sicker- bzw. Tröpfelwasser weiterhin kenntlich machen.
  issues:
