  yaml_path: translation/ot/job/028/011.yaml
  text: He dams up the sources of the rivers[a], and brings what is hidden out to the light.
translation:
  language: de
  text: Er hält das Sickerwasser der Ströme zurück[a] und bringt Verborgenes ans Licht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hält das Tröpfeln der Ströme zurück.“ Das seltene hebräische Wort kann an „Weinen“ beziehungsweise an tröpfelndes oder durchsickerndes Wasser erinnern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּכִי
  choice: die Sickerstellen
  rationale: Das seltene und schwierige Wort bezeichnet im Zusammenhang des Bergbaus wahrscheinlich Stellen, an denen Wasser hervortritt oder durchsickert. „Sickerstellen“ bewahrt diesen konkreten Sinn, ohne die im hebräischen Wort möglicherweise anklingende Vorstellung des Weinens festzuschreiben.
- source_word: נְהָרוֹת
  choice: der Ströme
  rationale: Der Plural bezeichnet Flüsse oder größere Wasserläufe. „Ströme“ passt zur poetischen Sprache und kann hier auch unterirdische Wasserläufe bezeichnen.
- source_word: חִבֵּשׁ
  choice: dämmt … ab
  rationale: Das Verb bedeutet grundsätzlich „binden, verbinden, zurückhalten“. Im Zusammenhang der Beherrschung von Wasser beim Bergbau gibt „abdämmen“ die praktische Wirkung natürlich wieder.
- source_word: תַּעֲלֻמָהּ
  choice: Verborgenes
  rationale: Das Substantiv bezeichnet etwas Verborgenes oder Verdecktes. Die offene Formulierung erhält die mögliche Bezugnahme auf Bodenschätze, ohne sie ausdrücklich auf Erz oder Schätze einzuengen.
- source_word: יֹצִא
  choice: bringt … ans
  rationale: Der Hifil von יצא bedeutet „herausbringen“ oder „hervorkommen lassen“. Zusammen mit „Licht“ ist „ans Licht bringen“ im Deutschen präzise und idiomatisch.
- source_word: אוֹר
  choice: Licht
  rationale: Die Wendung „ans Licht bringen“ bewahrt den Gegensatz zwischen dem Verborgenen und dem Sichtbarwerden.
