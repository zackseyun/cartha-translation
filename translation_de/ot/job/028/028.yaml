  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָֽ/אָדָ֗ם הֵ֤ן יִרְאַ֣ת אֲ֭דֹנָ/י הִ֣יא חָכְמָ֑ה וְ/ס֖וּר מֵ/רָ֣ע בִּינָֽה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/028/028.yaml
  text: And he said to man[a], ‘Behold, the fear of the Lord—that is wisdom, and to turn away from evil is understanding.’
translation:
  language: de
  text: 'Und er sagte zum Menschen[a]: »Sieh, die Furcht des Herrn – sie ist Weisheit, und sich vom Bösen abzuwenden ist Einsicht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zur Menschheit«. Das hebräische Wort אָדָם steht im Singular und bezeichnet hier den Menschen stellvertretend für die gesamte Menschheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Bewahrt die erzählerische Verknüpfung des Wayyiqtol, ohne eine stärkere zeitliche Abfolge hineinzulesen.
- source_word: לָאָדָם
  choice: zum Menschen
  rationale: אָדָם bezeichnet hier den einzelnen Menschen stellvertretend für die Menschheit; die Formulierung ist im modernen Deutschen natürlich und wahrt den Singular.
- source_word: הֵן
  choice: Sieh
  rationale: Gibt den aufmerksamkeitslenkenden, feierlichen Charakter der Partikel in gegenwärtigem, verständlichem Deutsch wieder.
- source_word: יִרְאַת אֲדֹנָי
  choice: die Furcht des Herrn
  rationale: Bewahrt das volle Bedeutungsgewicht von ehrfürchtiger, scheuer Gottesfurcht, statt es auf bloße Ehrfurcht abzuschwächen.
- source_word: הִיא
  choice: sie ist
  rationale: Gibt das betonte identifizierende Pronomen ausdrücklich wieder.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Entspricht dem zentralen Weisheitsbegriff des Kapitels.
- source_word: וְסוּר מֵרָע
  choice: und sich vom Bösen abzuwenden
  rationale: Drückt die substantivisch gebrauchte Infinitivkonstruktion natürlich aus und bewahrt den Gedanken einer bewussten Abkehr vom moralisch Bösen.
- source_word: בִּינָה
  choice: Einsicht
  rationale: Ein geläufiger deutscher Weisheitsbegriff, der hier die Fähigkeit zu verständigem, sittlichem Erkennen bezeichnet.
theological_decisions:
- issue: Generisches אָדָם
  choice: zum Menschen
  alternative: zur Menschheit
  rationale: Der hebräische Ausdruck steht im Singular, meint aber den Menschen repräsentativ und damit die Menschheit insgesamt. Der Haupttext bewahrt den Singular; die Fußnote macht die kollektive Reichweite deutlich.
- issue: Bedeutung von יִרְאַת אֲדֹנָי
  choice: die Furcht des Herrn
  alternative: die Ehrfurcht vor dem Herrn
  rationale: „Furcht“ hält die theologische Spannung zwischen Scheu, Ehrfurcht und wirklichem Fürchten offen und schwächt den hebräischen Ausdruck nicht ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede behält durch »Sieh« ihren feierlichen Hinweischarakter; die parallele Gleichsetzung von Gottesfurcht mit Weisheit und Abkehr vom Bösen mit Einsicht bleibt sichtbar.
