  text: The topaz of Cush cannot equal it[a]; it cannot be valued in pure gold.
translation:
  language: de
  text: Der Topas aus Kusch kommt ihr nicht gleich[a]; mit reinem Gold lässt sie sich nicht aufwiegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Chrysolith aus Kusch“ oder „der Peridot aus Kusch“; welcher Edelstein mit פִּטְדָה genau gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: kommt ihr nicht gleich
  rationale: ערך bezeichnet hier das Gleichkommen oder die Vergleichbarkeit im Wert. Die feminine Form verweist im Kontext auf die Weisheit; „kommt ihr nicht gleich“ bewahrt diesen Bezug und klingt im Deutschen natürlich.
- source_word: פִּטְדַת כּוּשׁ
  choice: der Topas aus Kusch
  rationale: פִּטְדָה bezeichnet einen Edelstein, dessen genaue mineralogische Bestimmung unsicher ist. „Topas“ entspricht der verbreiteten traditionellen Wiedergabe; die Unsicherheit wird in einer Fußnote kenntlich gemacht. כּוּשׁ wird als Eigenname „Kusch“ wiedergegeben.
- source_word: בְּכֶתֶם טָהוֹר
  choice: mit reinem Gold
  rationale: כֶּתֶם bezeichnet kostbares beziehungsweise geläutertes Gold, טָהוֹר unterstreicht dessen Reinheit. Die Präposition ב wird hier passend zum Bild des Abwägens instrumental mit „mit“ wiedergegeben.
- source_word: תְסֻלֶּה
  choice: kann sie nicht aufgewogen werden
  rationale: Das Verb gehört hier zur Sprache der Wertbestimmung und kann zugleich das konkrete Bild des Abwägens anklingen lassen. „Aufgewogen werden“ bewahrt diese Bildlichkeit und drückt aus, dass kein entsprechender Gegenwert festgesetzt werden kann.
