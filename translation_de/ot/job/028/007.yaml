  text: נָ֭תִיב לֹֽא יְדָ֣ע/וֹ עָ֑יִט וְ/לֹ֥א שְׁ֝זָפַ֗תּ/וּ עֵ֣ין אַיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/007.yaml
  text: A path no bird of prey knows[a], and the eye of the falcon has not seen it.
translation:
  language: de
  text: Einen Pfad kennt kein Raubvogel, und das Auge des Milans[a] hat ihn nicht erblickt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Falke«. Das hebräische Wort bezeichnet einen Raubvogel; die genaue Art ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתִיב
  choice: Pfad
  rationale: נָתִיב bezeichnet einen Pfad oder Weg. »Pfad« bewahrt das poetische Bild einer verborgenen Route.
- source_word: לֹא יְדָעוֹ
  choice: den kein Raubvogel kennt
  rationale: Das Verb ידע mit Objektsuffix bedeutet »ihn kennen«. Der Relativsatz gibt die hebräische Aussage im Deutschen natürlich wieder.
- source_word: עָיִט
  choice: Raubvogel
  rationale: עָיִט ist eine allgemeine Bezeichnung für einen Beute jagenden Vogel; »Raubvogel« vermeidet eine unbegründete Festlegung auf eine Art.
- source_word: וְלֹא שְׁזָפַתּוּ
  choice: und den … nicht erspäht hat
  rationale: שׁזף kann »sehen«, »erblicken« oder »erspähen« bedeuten. »Ers späht« wäre falsch getrennt; »erspäht« vermittelt hier prägnant das scharfe Sehen des Vogels und bleibt natürlich.
- source_word: עֵין
  choice: das Auge des
  rationale: Die wörtliche Bildsprache »Auge des« wird bewahrt.
- source_word: אַיָּה
  choice: Milan
  rationale: אַיָּה bezeichnet einen Raubvogel, wahrscheinlich einen Milan; die genaue Art ist jedoch unsicher und wird deshalb in einer Fußnote offengehalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die parallelen Aussagen »kennt« und »nicht erspäht hat« sowie das Bild vom scharfen Vogelauge bleiben erhalten.
