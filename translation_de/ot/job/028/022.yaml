  text: אֲבַדּ֣וֹן וָ֭/מָוֶת אָ֣מְר֑וּ בְּ֝/אָזְנֵ֗י/נוּ שָׁמַ֥עְנוּ שִׁמְעָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/022.yaml
  text: Abaddon and Death say[a], ‘With our ears we have heard a report of it.’
translation:
  language: de
  text: 'Abaddon und der Tod sagen[a]: »Mit unseren Ohren haben wir Kunde von ihr vernommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verderben und Tod sagten: ›Mit unseren Ohren haben wir ein Gerücht über sie gehört.‹«'
    reason: 'Lexikalische und temporale Alternative: אֲבַדּוֹן kann »Verderben« bedeuten, אָמְרוּ kann mit Vergangenheit wiedergegeben werden, und שִׁמְעָהּ kann »ein Gerücht über sie« heißen.'
lexical_decisions:
- source_word: אֲבַדּוֹן
  choice: Abaddon
  rationale: Die Umschrift bewahrt die poetische Personifizierung des Totenreichs beziehungsweise der Vernichtung als sprechende Macht; die Bedeutungsalternative »Verderben« wird in der Fußnote genannt.
- source_word: וָמָוֶת
  choice: und der Tod
  rationale: Der bestimmte Artikel ist im Deutschen bei der personifizierten Größe natürlich; die Kleinschreibung des Artikels und Großschreibung des Substantivs genügen, um die Personifizierung im Kontext erkennen zu lassen.
- source_word: אָמְרוּ
  choice: sagen
  rationale: Obwohl die hebräische Form formal perfektiv ist, passt das Präsens als lebendige beziehungsweise allgemeingültige poetische Aussage zum unmittelbaren Zusammenhang.
- source_word: בְּאָזְנֵינוּ
  choice: Mit unseren Ohren
  rationale: Die Formulierung bildet das hebräische Höridiom bewusst nach und betont, dass die Kenntnis nur durch Hörensagen zustande kam.
- source_word: שָׁמַעְנוּ
  choice: haben wir … gehört
  rationale: Das deutsche Perfekt bezeichnet ein zurückliegendes Hören mit gegenwärtiger Relevanz und klingt in direkter Rede natürlich.
- source_word: שִׁמְעָהּ
  choice: von ihr gehört
  rationale: Die idiomatische deutsche Wendung gibt den Sinn »eine Kunde/ein Gerücht über sie gehört« wieder. Das feminine Suffix bezieht sich im Zusammenhang auf die Weisheit; »ihr« bewahrt diesen Bezug ausdrücklich.
theological_decisions:
- issue: Personifizierung von Abaddon und Tod
  choice: Beide erscheinen im Haupttext als gemeinsam sprechende Größen.
  alternative: »Verderben und Tod sagten …« als stärker abstrakte Wiedergabe.
  rationale: Sprechen und Hören personifizieren beide ausdrücklich. Die Übersetzung bewahrt das poetische Bild, ohne daraus eine weitergehende ontologische Aussage abzuleiten.
- issue: Bezug des femininen Suffixes in שִׁמְעָהּ
  choice: »von ihr« mit Bezug auf die Weisheit
  alternative: »eine Kunde davon« beziehungsweise »ihr Gerücht«
  rationale: Im Kontext ist die Weisheit das gesuchte feminine Bezugswort. Die deutsche Form macht den Bezug verständlich, ohne die Aussage über bloßes Hörensagen zu verstärken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Personifizierung. »Mit unseren Ohren« ist absichtlich etwas formeller und quellennah; »von ihr gehört« hält den Bezug auf die Weisheit klar und bleibt für heutige Leser natürlich.
