  text: לֹֽא הִדְרִיכֻ֥/הוּ בְנֵי שָׁ֑חַץ לֹֽא עָדָ֖ה עָלָ֣י/ו שָֽׁחַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/008.yaml
  text: The proud beasts have not trodden it[a]; the lion has not passed over it.
translation:
  language: de
  text: Die stolzen Tiere haben ihn nicht betreten[a]; kein Löwe ist über ihn gegangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne des Stolzes“. Gemeint sind wahrscheinlich stolze, mächtige Wildtiere, besonders Raubtiere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדְרִיכֻהוּ
  choice: haben ihn nicht betreten
  rationale: Das Hifil von דרך bezeichnet hier im Zusammenhang mit dem verborgenen Pfad das Betreten bzw. Beschreiten. „Betreten“ gibt die Bewegung auf dem Weg natürlich wieder und bezieht das Suffix auf den im Kontext genannten Pfad.
- source_word: בְנֵי שָׁחַץ
  choice: die stolzen Tiere
  rationale: Wörtlich „Söhne des Stolzes/der Hoheit“. Im poetischen Parallelismus mit שׁחל sind wahrscheinlich stolze, mächtige Wildtiere, besonders Raubtiere, gemeint. Die Fußnote bewahrt die wörtliche Bildsprache und die verbleibende Deutungsoffenheit.
- source_word: עָדָה עָלָיו
  choice: ist über ihn gegangen
  rationale: Das Verb mit על beschreibt eine Bewegung über bzw. auf dem Pfad entlang. Die Formulierung ist bewusst schlicht und wahrt den Parallelismus zum Betreten.
- source_word: שָׁחַל
  choice: Löwe
  rationale: שׁחל ist eine poetische Bezeichnung für den Löwen, möglicherweise mit dem Beiklang von Stärke oder Wildheit. „Löwe“ ist im Deutschen klar und würdig.
theological_decisions: []
