  verdict: revise
  source_fidelity: Der Entwurf trifft die Grundbilder von Saphir und Goldstaub, löst jedoch die erste Nominalsatzkonstruktion („Ort/Vorkommen des Saphirs sind ihre Steine“) mit „eine Fundstätte“ semantisch und grammatisch unglücklich auf. Der feminine Suffixbezug verweist im unmittelbaren Kontext am natürlichsten auf die Erde (V. 5), nicht auf ein ergänztes neutrales „Land“.
  naturalness: „Seine Steine sind eine Fundstätte für Saphir“ verbindet einen Plural („Steine“) mit einer singulären Ortsbezeichnung und klingt im Deutschen weder idiomatisch noch poetisch klar. Eine verbale Wiedergabe mit „findet sich“ gibt das Vorkommen von Saphir in den Steinen natürlich wieder.
  terminology: „Saphir“ mit Fußnote zu „Lapislazuli“ bewahrt die unsichere mineralogische Referenz angemessen. „Goldstaub“ ist eine treffende, knappe Wiedergabe von „Staub des Goldes“. Die femininen Pronomen sollten den kontextuellen Bezug auf „die Erde“ abbilden.
