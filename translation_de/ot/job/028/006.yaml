  text: מְקוֹם סַפִּ֥יר אֲבָנֶ֑י/הָ וְ/עַפְרֹ֖ת זָהָ֣ב לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/006.yaml
  text: Its stones are the place of sapphire[a], and it has dust of gold.
translation:
  language: de
  text: In ihren Steinen findet sich Saphir[a], und sie enthält Goldstaub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder möglicherweise „Lapislazuli“; welcher Edelstein mit dem hebräischen Ausdruck genau gemeint ist, ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם
  choice: Fundstätte
  rationale: מקום bezeichnet einen Ort. Im Zusammenhang des Bergbaus gibt „Fundstätte“ natürlich und konkret wieder, dass dort Edelstein vorkommt, ohne die Aussage zu einer abstrakten „Quelle“ umzudeuten.
- source_word: סַפִּיר
  choice: Saphir
  rationale: Die traditionelle und allgemein verständliche Wiedergabe ist „Saphir“; möglicherweise bezeichnete das hebräische Wort jedoch Lapislazuli, weshalb die Unsicherheit in einer Fußnote erhalten bleibt.
- source_word: אֲבָנֶיהָ
  choice: Seine Steine
  rationale: Der feminine Suffixbezug weist auf die Erde beziehungsweise das Land im Kontext zurück. Im Deutschen richtet sich das Pronomen beim naheliegenden Bezug „Land“ nach dessen grammatischem Geschlecht; „Steine“ bewahrt zudem das konkrete Bild.
- source_word: וְעַפְרֹת
  choice: und ... Goldstaub
  rationale: Die Form hängt mit Staub beziehungsweise lockerer Erde zusammen. Das Kompositum „Goldstaub“ ist im Deutschen knapp und poetisch und gibt die Verbindung mit זָהָב idiomatisch wieder.
- source_word: זָהָב
  choice: Gold
  rationale: Die übliche und eindeutige Wiedergabe des hebräischen Wortes für das Edelmetall.
- source_word: לוֹ
  choice: es enthält
  rationale: Die Präposition mit Suffix bedeutet wörtlich „ihm/ihm zu“. In der verblosen Aussage drückt sie Besitz oder Vorkommen aus; „es enthält“ ist im Deutschen natürlich und passt zum Bergbaukontext.
theological_decisions: []
