base_translation:
  language: en
  yaml_path: translation/ot/job/028/002.yaml
  text: Iron is taken from the dust[a], and copper is smelted from stone.
translation:
  language: de
  text: Eisen wird aus dem Erdreich gewonnen, und Kupfer wird aus Gestein geschmolzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bronze“. Das hebräische Wort kann Kupfer oder Bronze bezeichnen; hier ist „Kupfer“ vorzuziehen, weil es um die Gewinnung von Metall aus Gestein geht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: Eisen
  rationale: Die gewöhnliche Bedeutung des hebräischen Substantivs ist das Metall Eisen.
- source_word: מֵעָפָר
  choice: aus dem Erdreich
  rationale: עָפָר kann Staub, lockere Erde oder Erdboden bezeichnen. „Erdreich“ bewahrt das konkrete Bild und ist im Zusammenhang des Bergbaus natürlich verständlich.
- source_word: יֻקָּח
  choice: wird gewonnen
  rationale: Wörtlich steht die Passivform „wird genommen“. „Wird gewonnen“ gibt im bergbaulichen Zusammenhang den Sinn idiomatisch wieder, ohne das Verfahren enger als der Ausgangstext festzulegen.
- source_word: וְאֶבֶן
  choice: und aus Gestein
  rationale: אֶבֶן bedeutet Stein. „Gestein“ bezeichnet hier natürlich das erzhaltige Ausgangsmaterial; die Präposition „aus“ wird sinngemäß im zweiten Satzglied ergänzt.
- source_word: יָצוּק
  choice: wird … geschmolzen
  rationale: יצק kann ausgießen, gießen oder im metallurgischen Zusammenhang ausschmelzen bedeuten. Hier bezeichnet es die Gewinnung des Metalls durch Schmelzen.
- source_word: נְחוּשָׁה
  choice: Kupfer
  rationale: Der Ausdruck kann Kupfer oder Bronze bezeichnen. Im Zusammenhang der Gewinnung aus Gestein ist „Kupfer“ sachlich wahrscheinlicher, da Bronze eine Legierung ist.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit parallelem Satzbau. „Erdreich“ und „Gestein“ vermitteln das Bergbaubild natürlich; die genuine Mehrdeutigkeit der Metallbezeichnung bleibt in der Fußnote erhalten.
