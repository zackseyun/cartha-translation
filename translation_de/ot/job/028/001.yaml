source:
  edition: WLC
  text: כִּ֤י יֵ֣שׁ לַ/כֶּ֣סֶף מוֹצָ֑א וּ֝/מָק֗וֹם לַ/זָּהָ֥ב יָזֹֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/001.yaml
  text: Surely there is a mine for silver[b][a], and a place where they refine gold.
translation:
  language: de
  text: '**Hiob 28,1**


    Ja, Silber hat eine Fundstätte[a], und Gold einen Ort, wo man es läutert[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Ursprungsort“. Das hebräische Wort bezeichnet einen Ausgangs-, Herkunfts- oder Ursprungsort; wegen des folgenden Bergbaukontexts steht hier „Fundstätte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wo man es schmilzt“. Das hebräische Verb kann das Läutern beziehungsweise Ausschmelzen von Edelmetall bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ja
  rationale: Die Partikel eröffnet hier mit bekräftigender Wirkung die poetische Betrachtung. „Ja“ gibt diese Funktion im Deutschen natürlich wieder, ohne einen nicht eindeutig vorhandenen Kausalzusammenhang einzuführen.
- source_word: יֵשׁ
  choice: hat
  rationale: Die hebräische Existenzkonstruktion „es gibt für Silber“ wird im Deutschen idiomatisch als „Silber hat“ wiedergegeben.
- source_word: לַכֶּסֶף מוֹצָא
  choice: Silber hat eine Fundstätte
  rationale: מוֹצָא bezeichnet grundsätzlich einen Ausgangs-, Ursprungs- oder Herkunftsort. Im Zusammenhang des Bergbaus in Hiob 28 ist „Fundstätte“ konkret und verständlich, ohne das Wort enger als nötig als technischen Ausdruck für ein Bergwerk festzulegen.
- source_word: וּמָקוֹם לַזָּהָב
  choice: und Gold einen Ort
  rationale: Die parallele deutsche Konstruktion gibt die Zuordnung des Ortes zum Gold knapp und poetisch wieder.
- source_word: יָזֹקּוּ
  choice: wo man es läutert
  rationale: Die dritte Person Plural kann ein unbestimmtes menschliches Subjekt ausdrücken; dafür ist deutsches „man“ idiomatisch. „Läutern“ bezeichnet die Reinigung beziehungsweise Raffination des Goldes und bewahrt den metallurgischen Sinn.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; „man“ gibt das unbestimmte pluralische Subjekt natürlich wieder.
