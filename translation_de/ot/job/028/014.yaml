source:
  edition: WLC
  text: תְּה֣וֹם אָ֭מַר לֹ֣א בִ/י הִ֑יא וְ/יָ֥ם אָ֝מַ֗ר אֵ֣ין עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/014.yaml
  text: The deep says[a], ‘It is not in me,’ and the sea says, ‘It is not with me.’
translation:
  language: de
  text: 'Die Tiefe sagt: »Sie ist nicht in mir«, und das Meer sagt: »Sie ist nicht bei mir.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהוֹם
  choice: die Tiefe
  rationale: Bezeichnet die große Wassertiefe beziehungsweise Urflut. »Die Tiefe« ist knapp, poetisch und bildet einen natürlichen Parallelismus zu »das Meer«, ohne die kosmologische Bildwelt unnötig festzulegen.
- source_word: אָמַר
  choice: sagt
  rationale: Das hebräische Qatal kann hier als lebendige, allgemeingültige Aussage im poetischen Diskurs wiedergegeben werden. Das Präsens erhält zudem die Personifikation.
- source_word: לֹא בִי הִיא
  choice: Sie ist nicht in mir
  rationale: Das feminine Pronomen הִיא verweist im Zusammenhang auf die im Deutschen ebenfalls feminine »Weisheit«. Daher kann die grammatische und personifizierende Rückbindung im Deutschen unmittelbar erhalten bleiben.
- source_word: יָם
  choice: das Meer
  rationale: Die gewöhnliche und bildgetreue Entsprechung von יָם; sie bewahrt den poetischen Parallelismus mit »der Tiefe«.
- source_word: אֵין עִמָּדִי
  choice: Sie ist nicht bei mir
  rationale: Die Formulierung bewahrt die räumlich-persönliche Vorstellung von עִמָּדִי und vermeidet die stärker deutende Wiedergabe »Ich besitze sie nicht«.
theological_decisions:
- issue: Bezug des femininen Pronomens הִיא
  choice: »Sie« als Rückverweis auf die Weisheit
  alternative: »Es« als neutraler Verweis auf das Gesuchte
  rationale: Der weitere Zusammenhang (Hiob 28,12.20) nennt die Weisheit als Gegenstand der Suche. Da »Weisheit« auch im Deutschen feminin ist, lässt sich der grammatische Bezug ohne erklärende Glättung bewahren.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der Parallelismus der beiden Satzhälften und die Personifikation von Tiefe und Meer bleiben erhalten; die Wiederholung von »sagt« folgt der hebräischen Struktur.
