  - marker: b
    text: 'Möglicherweise wörtlicher: „Ein Strom wurde über ihr Fundament ausgegossen“ oder „ergoss sich über ihr Fundament“. Das hebräische Bild ist stark verdichtet.'
    reason: lexical_alternative
  - marker: c
    text: Der Vers kann besonders auf die Generation anspielen, die durch die Sintflut umkam, oder allgemeiner auf den plötzlichen Untergang der Frevler.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen führt die nähere Beschreibung der im Zusammenhang genannten Frevler ein.
- source_word: קֻמְּטוּ
  choice: weggerafft wurden
  rationale: Die schwierige Passivform bezeichnet hier wahrscheinlich ein plötzliches, gewaltsames Beseitigtwerden. „Weggerafft“ gibt dies wieder, ohne das mögliche Bild des Einschrumpfens oder Abschneidens festzuschreiben.
- source_word: וְלֹא עֵת
  choice: vor ihrer Zeit
  rationale: Die knappe hebräische Wendung bedeutet im Zusammenhang einen vorzeitigen Tod oder Untergang; die idiomatische deutsche Formulierung bewahrt diesen Sinn.
- source_word: נָהָר
  choice: ein Strom
  rationale: Das Substantiv bezeichnet einen Fluss oder Strom. „Strom“ passt zur zerstörerischen Wasserbewegung, ohne ausdrücklich „Sintflut“ zu sagen.
- source_word: יוּצַק
  choice: wegspülte
  rationale: Das Verb bedeutet grundsätzlich „ausgießen“. In Verbindung mit einem Strom und dem Grund der Betroffenen ist die Bildaussage im Deutschen am natürlichsten als Wegspülen wiederzugeben; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: יְסוֹדָם
  choice: deren Grund
  rationale: Der Singular mit Suffix bedeutet wörtlich „ihr Grund/Fundament“. „Grund“ ist knapp, bildhaft und im Deutschen natürlich.
theological_decisions:
- issue: Bezug des Wassergerichts
  choice: Die Formulierung lässt offen, ob konkret auf die Generation der Sintflut oder allgemein auf den plötzlichen Untergang der Frevler angespielt wird.
  alternative: Die Aussage ausdrücklich als Hinweis auf die Sintflut oder ausschließlich als allgemeine Metapher zu deuten.
  rationale: Der Zusammenhang und das Wasserbild erlauben einen Bezug auf die Sintflut, doch der hebräische Text legt ihn nicht eindeutig fest.
translation_notes:
  register: Moderne, würdige Standardsprache. „Weggerafft“ wahrt die Plötzlichkeit des Gerichts; „Grund“ und „Strom“ erhalten das knappe, konkrete Wasserbild. Die Fußnoten kennzeichnen die lexikalische Unsicherheit und vermeiden eine Festlegung auf eine einzige theologische Deutung.
