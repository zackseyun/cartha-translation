  text: die vor ihrer Zeit weggerafft wurden[a][c], deren Fundament ein Strom wegspülte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die vor ihrer Zeit abgeschnitten wurden“. Das hebräische Verb ist schwierig und kann ein Ergriffenwerden, Einschrumpfen oder plötzliches Beseitigtwerden bezeichnen.'
