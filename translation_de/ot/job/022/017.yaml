  text: who said to God, ‘Depart from us,’ and, ‘What can the Almighty do to them?’
translation:
  language: de
  text: 'die zu Gott sagten: »Weiche von uns! Was kann der Allmächtige ihnen tun?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוּר מִמֶּנּוּ
  choice: Weiche von uns!
  rationale: Der Imperativ סוּר fordert Gott auf, sich zu entfernen; „weichen“ ist würdig, verständlich und bewahrt den schroffen Ton.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Die traditionelle und im Deutschen verständliche Wiedergabe des Gottesnamens bzw. Gottestitels Schaddai.
- source_word: יִפְעַל ... לָמוֹ
  choice: kann ... ihnen schon tun
  rationale: Das Imperfekt kann hier modal-rhetorisch verstanden werden. „Ihnen tun“ lässt offen, ob nützen oder antun gemeint ist; „schon“ gibt den abweisenden rhetorischen Ton natürlich wieder, ohne ein zusätzliches Objekt einzuführen.
theological_decisions:
- issue: Pronomenwechsel von „uns“ zu „ihnen“
  choice: ihnen
  alternative: uns
  rationale: Der masoretische Text hat ausdrücklich לָמוֹ, „ihnen/für sie“. Der auffällige Wechsel wird nicht nach dem ähnlichen Wortlaut in Hiob 21,14–15 harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und herausfordernd; der auffällige Pronomenwechsel des hebräischen Textes wird bewahrt.
