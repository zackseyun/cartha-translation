  source_fidelity: 'Der masoretische Text hat nach dem Imperativ „Weiche von uns“ tatsächlich den auffälligen Wechsel zu לָמוֹ („ihnen/zu ihrem Nutzen“). Der Haupttext bewahrt „ihnen“ und die Fußnote weist zutreffend auf den Wechsel hin. Allerdings ist „Wörtlich: ihnen oder für sie“ sprachlich ungenau: לָמוֹ bedeutet nicht alternativ „ihnen oder für sie“, sondern „ihnen“, wobei die Dativrelation je nach Verb auch einen Nutzenbezug haben kann.'
