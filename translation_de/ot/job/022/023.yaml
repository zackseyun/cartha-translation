  text: Wenn du zum Allmächtigen zurückkehrst, wirst du wiederhergestellt[a]; du wirst Unrecht aus deinem Zelt entfernen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wirst du gebaut werden«; im Zusammenhang auch: »wirst du aufgebaut« oder »wirst du wieder aufgebaut«.'
