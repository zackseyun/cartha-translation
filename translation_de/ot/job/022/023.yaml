  - marker: b
    text: »Unrecht« kann auch »Ungerechtigkeit« oder »Vergehen« bedeuten; »Zelt« kann den Wohnbereich oder die Hausgemeinschaft bezeichnen.
    reason: lexical_and_metonymic_alternative
lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Leitet einen Bedingungssatz ein und entspricht der hebräischen Syntax natürlich.
- source_word: תָּשׁוּב
  choice: du zurückkehrst
  rationale: Bewahrt die Grundbedeutung von שוב, ohne die im Zusammenhang mitklingende Umkehr ausdrücklich als »Buße tun« zu deuten.
- source_word: עַד שַׁדַּי
  choice: zum Allmächtigen
  rationale: עַד bezeichnet hier die Ausrichtung auf Gott; שַׁדַּי wird als geläufiger Gottesname beziehungsweise Titel übersetzt.
- source_word: תִּבָּנֶה
  choice: du wirst wiederhergestellt
  rationale: Das Niphal von בנה bedeutet wörtlich »gebaut/aufgebaut werden« und bezeichnet hier bildhaft Wiederherstellung oder erneute Festigung.
- source_word: תַּרְחִיק
  choice: du entfernst
  rationale: Gibt die kausative Bedeutung »fern machen« in natürlichem modernem Deutsch wieder.
- source_word: עַוְלָה
  choice: Unrecht
  rationale: Der umfassende deutsche Ausdruck deckt moralisches Unrecht, Vergehen und Ungerechtigkeit ab, ohne den Sinn unnötig einzuengen.
- source_word: מֵאָהֳלֶךָ
  choice: aus deinem Zelt
  rationale: Bewahrt das konkrete Bild des hebräischen Textes; das Zelt kann zugleich für Wohnbereich oder Hausgemeinschaft stehen.
theological_decisions:
- issue: Wörtliche oder deutende Wiedergabe der Baumetapher
  choice: du wirst wiederhergestellt
  alternative: du wirst aufgebaut / wieder aufgebaut
  rationale: Die verständliche Wiedergabe vermittelt die gemeinte Wiederherstellung, während die Fußnote die konkrete hebräische Metapher sichtbar hält.
- issue: שוב als Rückkehr oder ausdrücklich als Buße
  choice: zurückkehrst
  alternative: umkehrst / Buße tust
  rationale: »Zurückkehren« bewahrt die lexikalische und theologische Offenheit des Verbs und bezeichnet hier zugleich eine Hinwendung zu Gott.
- issue: Verhältnis der beiden Bedingungssätze
  choice: zweites »wenn« beibehalten
  alternative: »und Unrecht aus deinem Zelt entfernst«
  rationale: Die Wiederholung macht die bedingende Funktion des zweiten Satzteils deutlich, obwohl das Hebräische kein zweites אִם ausdrücklich setzt; auch eine koordinierende Auffassung ist möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Zeltmetapher bleibt erhalten; die ungewöhnlichere Baumetapher wird im Haupttext verständlich wiedergegeben und in der Fußnote offengelegt.
