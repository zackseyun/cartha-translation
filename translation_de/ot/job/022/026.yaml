  variant: modern standard German
source:
  edition: WLC
  text: כִּי אָ֭ז עַל שַׁדַּ֣י תִּתְעַנָּ֑ג וְ/תִשָּׂ֖א אֶל אֱל֣וֹהַּ פָּנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/026.yaml
  text: For then you will delight yourself in the Almighty[b][a], and lift up your face to God.
translation:
  language: de
  text: Denn dann wirst du am Allmächtigen Freude haben[a] und dein Angesicht zu Gott erheben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich am Allmächtigen erfreuen“.'
    reason: lexical_alternative
  - marker: b
    text: Das Angesicht zu Gott zu erheben kann einen zuversichtlichen Zugang zu ihm, wiederhergestellte Gunst oder freimütiges Gebet ausdrücken.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אָז
  choice: Denn dann
  rationale: כִּי führt hier die Begründungs- beziehungsweise Folgewirkung der vorausgehenden Aufforderung weiter; אָז bezeichnet den daraus folgenden Zeitpunkt.
- source_word: עַל שַׁדַּי
  choice: am Allmächtigen
  rationale: עַל bezeichnet bei התענג den Gegenstand der Freude. „Am Allmächtigen“ ist im Deutschen idiomatisch und gibt den verständlichen Sinn des Gottestitels שַׁדַּי wieder.
- source_word: תִּתְעַנָּג
  choice: wirst du … Freude haben
  rationale: Der Hitpael von ענג bezeichnet persönliches Wohlgefallen beziehungsweise Sich-Erfreuen. Die Formulierung ist natürlich und bewahrt den positiven, gehobenen Ton.
- source_word: וְתִשָּׂא
  choice: und … erheben
  rationale: נשׂא bedeutet wörtlich „heben/erheben“. Mit „Angesicht“ bleibt das konkrete Bild der hebräischen Wendung erhalten.
- source_word: אֶל אֱלוֹהַּ
  choice: zu Gott
  rationale: אֶל gibt die Richtung an; אֱלוֹהַּ ist die singularische Gottesbezeichnung und wird ohne zusätzliche Spezifizierung als „Gott“ wiedergegeben.
- source_word: פָּנֶיךָ
  choice: dein Angesicht
  rationale: „Angesicht“ bewahrt die konkrete Bildsprache und passt im modernen würdevollen Bibelregister natürlich zur Wendung „zu Gott erheben“.
theological_decisions:
- issue: Bedeutung der Wendung „das Angesicht zu Gott erheben“
  choice: Die konkrete Wendung wird beibehalten.
  alternative: „voll Zuversicht zu Gott beten“, „zu Gott aufblicken“ oder „vor Gott den Kopf erheben“
  rationale: Das Bild kann einen zuversichtlichen Zugang, wiederhergestellte Gunst oder kühnes Gebet andeuten. Eine Paraphrase würde die Aussage auf nur eine dieser Deutungen verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Angesicht“ ist bewusst gegenüber dem alltäglicheren „Gesicht“ gewählt, weil es die poetische Bildsprache und den idiomatischen Zusammenhang trägt, ohne die mögliche Bedeutung auszudeuten.
