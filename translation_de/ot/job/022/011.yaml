  text: אוֹ חֹ֥שֶׁךְ לֹֽא תִרְאֶ֑ה וְֽ/שִׁפְעַת מַ֥יִם תְּכַסֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/011.yaml
  text: or darkness[a], so that you cannot see, and an abundance of waters covers you.
translation:
  language: de
  text: oder Finsternis, sodass du nichts sehen kannst, und eine Fülle von Wasser bedeckt dich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und eine Wasserflut bedeckt dich.« Der hebräische Ausdruck kann überströmende Wassermassen bezeichnen; der Haupttext bewahrt den weiteren Sinn »eine Fülle von Wasser«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: oder
  rationale: Die Konjunktion führt knapp eine weitere mögliche Bedrängnis in Elifas’ Schilderung ein.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: Das Substantiv bezeichnet wörtliche oder bildliche Dunkelheit; »Finsternis« bewahrt hier den ernsten poetischen Ton.
- source_word: לֹא תִרְאֶה
  choice: sodass du nichts sehen kannst
  rationale: Wörtlich steht »du siehst nicht«. Die resultative Formulierung stellt im Deutschen den naheliegenden Zusammenhang mit der Finsternis her, ohne die Bildaussage zu verändern.
- source_word: וְשִׁפְעַת
  choice: und eine Fülle von
  rationale: שִׁפְעָה kann Fülle, Übermaß oder Überströmen bezeichnen. »eine Fülle von« erhält den breiten lexikalischen Sinn; die konkretere Deutung als Flut wird in der Fußnote genannt.
- source_word: מַיִם
  choice: Wasser
  rationale: Das hebräische מַיִם hat pluralische Form, wird im modernen Deutschen in dieser Verbindung jedoch natürlich als kollektiver Singular »Wasser« wiedergegeben.
- source_word: תְּכַסֶּךָּ
  choice: bedeckt dich
  rationale: Das Piel von כסה bedeutet »bedecken«. Diese Wiedergabe wahrt das unmittelbare Bild und vermeidet die stärker deutende Übersetzung »überwältigt dich«.
