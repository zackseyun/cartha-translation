source:
  edition: WLC
  text: לֹא מַ֭יִם עָיֵ֣ף תַּשְׁקֶ֑ה וּ֝/מֵ/רָעֵ֗ב תִּֽמְנַֽע לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/007.yaml
  text: You gave no water to the weary to drink[a], and from the hungry you withheld bread.
translation:
  language: de
  text: Dem Erschöpften gabst du kein Wasser zu trinken, und dem Hungrigen verweigertest du Brot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Brot“ kann auch allgemeiner „Nahrung“ bedeuten; im Haupttext bleibt der konkrete Ausdruck des Ausgangstextes erhalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: kein
  rationale: Die einfache Verneinung wird im ersten deutschen Satzglied idiomatisch mit „kein Wasser“ ausgedrückt; der zweite Vorwurf trägt mit „verweigertest“ bereits eine negative Bedeutung.
- source_word: מַיִם
  choice: Wasser
  rationale: Das hebräische Substantiv bezeichnet Wasser; im Deutschen steht es natürlich als nicht zählbares Substantiv im Singular.
- source_word: עָיֵף
  choice: dem Erschöpften
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet einen müden oder entkräfteten Menschen. Der Singular bleibt erhalten und kann zugleich repräsentativ verstanden werden.
- source_word: תַּשְׁקֶה
  choice: gabst du ... zu trinken
  rationale: Der Hifil von שׁקה bedeutet „zu trinken geben“. Diese Formulierung gibt den kausativen Sinn in natürlichem Deutsch wieder.
- source_word: וּמֵרָעֵב
  choice: und dem Hungrigen
  rationale: Wörtlich steht „und von einem Hungrigen“. Da מנע im Deutschen idiomatisch mit einem Dativobjekt konstruiert wird, wird die Relation als „dem Hungrigen ... verweigern“ wiedergegeben.
- source_word: תִּמְנַע
  choice: verweigertest
  rationale: Der Qal von מנע bedeutet vorenthalten, zurückhalten oder verweigern. „Verweigertest“ drückt den moralischen Vorwurf einer versagten notwendigen Gabe klar aus.
- source_word: לָחֶם
  choice: Brot
  rationale: Der konkrete hebräische Ausdruck wird bewahrt, obwohl er weiter gefasst auch Nahrung bezeichnen kann.
