  source_fidelity: 'Die Übersetzung gibt die beiden Vorwürfe des hebräischen Textes zuverlässig wieder: die verweigerte Gabe von Wasser an den Erschöpften und das Vorenthalten von Brot gegenüber dem Hungrigen. Die kausative Bedeutung von תַּשְׁקֶה ist mit „gabst du … zu trinken“ angemessen erfasst; die deutsche Dativkonstruktion bei „verweigern“ überträgt die hebräische מִן-Relation idiomatisch, ohne den Sinn zu verändern.'
  naturalness: „Dem Erschöpften gabst du kein Wasser zu trinken, und dem Hungrigen verweigertest du Brot“ ist natürliches, würdiges modernes Standarddeutsch. Die leicht gehobene Wortstellung und das Präteritum passen zum poetisch-anklagenden Kontext.
  terminology: „Erschöpften“, „Hungrigen“, „Wasser“ und „Brot“ sind treffend. Die Fußnote erläutert sachlich die mögliche weitere Bedeutung von לֶחֶם, ohne den konkreten Wortlaut im Haupttext zu verwischen. Der Fußnotenanker steht korrekt bei „Brot“.
