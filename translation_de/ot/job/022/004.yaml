  terminology: »Furcht« beziehungsweise »Ehrfurcht«, »zurechtweisen« und »ins Gericht gehen« sind terminologisch tragfähig. Die Fußnoten bieten sinnvolle Alternativen und erläutern die wörtliche Form. Die Marker sind korrekt an den jeweiligen Aussagen verankert.
