source:
  edition: WLC
  text: הֲֽ֭/מִ/יִּרְאָ֣תְ/ךָ יֹכִיחֶ֑/ךָ יָב֥וֹא עִ֝מְּ/ךָ֗ בַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/004.yaml
  text: Is it because of your fear of him that he reproves you and enters into judgment with you?[a][b][c]
translation:
  language: de
  text: Weist er dich etwa zurecht, weil du ihn fürchtest,[a][b] und geht mit dir ins Gericht?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »weil du Ehrfurcht vor ihm hast«; wörtlich: »wegen deiner Furcht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »tadelt er dich« oder »bringt er dich zur Rechenschaft«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »kommt er mit dir ins Gericht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיִּרְאָתְךָ
  choice: etwa …, weil du ihn fürchtest
  rationale: Die Präposition מִן bezeichnet hier den Grund; יִרְאָה kann »Furcht« oder »Ehrfurcht« bedeuten. Die Wendung wird im Deutschen natürlich als Nebensatz wiedergegeben. Das im Hebräischen unausgesprochene Objekt wird aus dem Kontext als Gott erschlossen und mit »ihn« ausgedrückt.
- source_word: יֹכִיחֶךָ
  choice: weist er dich zurecht
  rationale: Das Hifil von יכח kann zurechtweisen, tadeln oder einen Rechtsstreit führen bedeuten. »zurechtweisen« bewahrt den mahnenden Sinn, während der folgende Teilsatz die gerichtliche Dimension ausdrücklich trägt.
- source_word: יָבֹא עִמְּךָ בַּמִּשְׁפָּט
  choice: geht mit dir ins Gericht
  rationale: Die idiomatische deutsche Wendung entspricht wörtlich »kommt mit dir ins Gericht« und erhält sowohl das gerichtliche Bild als auch die Gegenüberstellung Gottes mit dem Angeredeten.
- source_word: מִּשְׁפָּט
  choice: Gericht
  rationale: Hier bezeichnet das Wort ein gerichtliches Verfahren beziehungsweise eine rechtliche Auseinandersetzung. »Gericht« passt zur deutschen Wendung »mit jemandem ins Gericht gehen«.
theological_decisions:
- issue: Bezugswort der Furcht
  choice: 'Die Furcht ist auf Gott gerichtet: »weil du ihn fürchtest«.'
  alternative: 'Das Objekt unausgesprochen lassen: »wegen deiner Furcht« oder »aus Furcht vor dir«.'
  rationale: Der Kontext handelt von Gottes Vorgehen gegen Hiob; daher ist Gott das naheliegende Objekt der Furcht. Die Ergänzung macht die hebräische Ellipse im Deutschen verständlich, ohne eine zusätzliche theologische Aussage einzuführen.
- issue: Rhetorische Wirkung der Frage
  choice: Die Frage wird mit »etwa« als rhetorische Frage wiedergegeben, die eine verneinende Antwort erwartet.
  alternative: Eine formal neutrale Frage ohne ausdrückliches rhetorisches Signal.
  rationale: Elifas bestreitet im Kontext ironisch, dass Gott Hiob wegen dessen Gottesfurcht zur Rechenschaft zieht. »etwa« lässt diese Stoßrichtung erkennen, ohne sie auszuformulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe wird durch »etwa« erhalten. »Mit jemandem ins Gericht gehen« ist eine geläufige, gehobene Wendung und bewahrt das forensische Bild des Hebräischen.
