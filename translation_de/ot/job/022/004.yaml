  source_fidelity: Die Übersetzung gibt die hebräische rhetorische Kausalfrage angemessen wieder. »weil du ihn fürchtest« entfaltet die im Hebräischen elliptische, kontextuell auf Gott bezogene »deine Furcht«, ohne den Sinn zu verändern. »Weist ... zurecht« trifft יֹכִיחֶךָ im gegebenen Kontext, und »geht mit dir ins Gericht« bewahrt die gerichtliche Bildsprache von יָבֹא עִמְּךָ בַּמִּשְׁפָּט.
