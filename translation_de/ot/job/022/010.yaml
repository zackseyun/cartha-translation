  register: Modernes, würdiges Standarddeutsch mit poetischer Knappheit. Die Bildsprache der Schlingen und die intensive Angstterminologie bleiben erhalten; der deutsche Satz löst lediglich die im Hebräischen mögliche Wortwiederholung idiomatisch auf.
