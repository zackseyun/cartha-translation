  text: עַל כֵּ֭ן סְבִיבוֹתֶ֣י/ךָ פַחִ֑ים וִֽ֝/יבַהֶלְ/ךָ פַּ֣חַד פִּתְאֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/010.yaml
  text: Therefore snares are all around you[a], and sudden terror terrifies you.
translation:
  language: de
  text: Darum sind rings um dich Schlingen, und plötzlicher Schrecken versetzt dich in Angst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung zieht aus den vorausgehenden Anschuldigungen eine Folgerung; „Darum“ gibt diese Folgerungsbeziehung knapp und natürlich wieder.
- source_word: סְבִיבוֹתֶיךָ
  choice: rings um dich
  rationale: Die adverbiale Wendung bezeichnet das, was jemanden von allen Seiten umgibt; zusammen mit dem im Deutschen ergänzten „sind“ bleibt die hebräische Satzstruktur gut erkennbar.
- source_word: פַחִים
  choice: Schlingen
  rationale: פַח bezeichnet eine Fangvorrichtung, besonders eine Falle oder Schlinge. „Schlingen“ bewahrt hier das poetische Bild einer ringsum lauernden Gefahr.
- source_word: וִיבַהֶלְךָ
  choice: versetzt dich in Angst
  rationale: Das Verb בהל bedeutet erschrecken, bestürzen oder in Angst und Unruhe versetzen. Die Wiedergabe vermeidet im Deutschen die schwerfällige Wiederholung „Schrecken erschreckt dich“, ohne die Wirkung des Verbs abzuschwächen.
- source_word: פַּחַד
  choice: Schrecken
  rationale: Das Substantiv bezeichnet Furcht, Schrecken oder Grauen; „Schrecken“ entspricht der Intensität des Zusammenhangs und verbindet sich natürlich mit „plötzlich“.
- source_word: פִּתְאֹם
  choice: plötzlicher
  rationale: Das hebräische Adverb „plötzlich“ kann sinngemäß attributiv auf פַּחַד bezogen werden. „Plötzlicher Schrecken“ ist im Deutschen natürlich und bewahrt den Gedanken des unvermittelten Einbruchs.
theological_decisions: []
