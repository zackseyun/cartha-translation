  text: Will you keep to the ancient path that men of wickedness have trodden?[a][b]
translation:
  language: de
  text: Willst du an dem uralten Pfad festhalten, den Menschen des Unrechts betreten haben?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an dem Pfad aus alter Zeit“ oder „an dem seit alters beschrittenen Pfad“. Der hebräische Ausdruck meint hier einen Pfad aus ferner Vergangenheit, nicht unbedingt einen ewigen Pfad.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den böse Menschen betreten haben“ oder „den Menschen der Bosheit betreten haben“. Wörtlich steht im Hebräischen „Menschen des Unrechts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרַח
  choice: Pfad
  rationale: אֹרַח bezeichnet einen Pfad oder Weg und kann bildlich für einen Lebenswandel stehen. „Pfad“ erhält das konkrete Wegbild.
- source_word: עוֹלָם
  choice: uralt
  rationale: עוֹלָם bezeichnet hier einen seit langer Zeit bestehenden Pfad, nicht zwingend einen ewigen. „Uralt“ gibt den zeitlichen Rückbezug natürlich wieder.
- source_word: תִּשְׁמֹר
  choice: willst du ... bleiben
  rationale: שׁמר bedeutet bewahren, beachten oder einhalten. Mit einem Pfad als Objekt ist sinngemäß gemeint, auf diesem Weg zu bleiben beziehungsweise ihm zu folgen.
- source_word: אֲשֶׁר
  choice: den
  rationale: Das Relativpronomen leitet den Satz ein, der den Pfad näher bestimmt.
- source_word: דָּרְכוּ
  choice: betreten haben
  rationale: Das Verb דרך bedeutet treten oder beschreiten. „Betreten haben“ bewahrt das konkrete Pfadbild und klingt im Deutschen natürlich.
- source_word: מְתֵי אָוֶן
  choice: Menschen des Unrechts
  rationale: מְתֵי ist eine konstruktgebundene Pluralform für Menschen oder Männer; אָוֶן kann Unrecht, Bosheit, Frevel, Mühsal oder Trug bezeichnen. „Menschen des Unrechts“ bewahrt die formale Fügung und ihre moralische Aussage, ohne sie unnötig einzuengen.
theological_decisions: []
