  text: עָבִ֣ים סֵֽתֶר ל֭/וֹ וְ/לֹ֣א יִרְאֶ֑ה וְ/ח֥וּג שָׁ֝מַ֗יִם יִתְהַלָּֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/014.yaml
  text: Clouds are a covering for him[a], so that he does not see; and he walks on the vault of heaven.
translation:
  language: de
  text: Wolken verhüllen ihn, und er sieht nicht; auf dem Himmelsgewölbe geht er umher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dichte Wolken sind ihm eine Hülle, und er sieht nicht; auf dem Kreis des Himmels geht er umher.“'
    reason: Bewahrt mögliche Wiedergaben von עָבִים als „dichte Wolken“, סֵתֶר als „Hülle“ und חוּג als „Kreis“ sowie die koordinierende Verknüpfung der mittleren Satzglieder.
lexical_decisions:
- source_word: עָבִים
  choice: Wolken
  rationale: Der Plural bezeichnet Wolken, häufig dichte Regenwolken. „Wolken“ ist im Deutschen natürlich; ihre verhüllende Wirkung wird bereits durch das folgende Verb ausgedrückt.
- source_word: סֵתֶר לוֹ
  choice: verhüllen ihn
  rationale: Die nominale Wendung bezeichnet etwas, das ihm als Verbergung oder Bedeckung dient. Die verbale Wiedergabe ist natürliches Deutsch und bewahrt das konkrete Bild der Wolken als Sichtschutz.
- source_word: וְלֹא יִרְאֶה
  choice: sodass er nicht sieht
  rationale: Die Konjunktion kann rein nebenordnend oder als Folge verstanden werden. „Sodass“ macht den im Zusammenhang naheliegenden Folgesinn deutlich, ohne ein Unvermögen hinzuzufügen.
- source_word: חוּג שָׁמַיִם
  choice: Himmelsgewölbe
  rationale: חוּג bezeichnet einen Kreis oder die gewölbte Himmelsweite. „Himmelsgewölbe“ gibt das räumliche Bild würdig und verständlich wieder, ohne daraus eine technische Kosmologie abzuleiten.
- source_word: יִתְהַלָּךְ
  choice: geht er umher
  rationale: Die Hitpael-Form von הלך kann ein Umhergehen oder Sich-Bewegen ausdrücken. „Geht … umher“ bewahrt diese Nuance besser als das schlichtere „geht“.
theological_decisions:
- issue: Sprecherperspektive und Subjekt
  choice: Das Pronomen „er“ bleibt stehen und wird nicht ausdrücklich durch „Gott“ ersetzt.
  alternative: „Gott“ als Subjekt ausdrücklich einsetzen.
  rationale: Im Zusammenhang gibt Elifas wieder, was er dem Frevler als Auffassung über Gott zuschreibt. Das unveränderte Pronomen bewahrt den Diskursfluss und vermeidet eine erklärende Ergänzung.
- issue: Verhältnis zwischen Verhüllung und Nichtsehen
  choice: 'Folgesinn: „sodass er nicht sieht“'
  alternative: 'Reine Beiordnung: „und er sieht nicht“'
  rationale: Der Folgesinn liegt sachlich nahe, doch die hebräische Konjunktion bleibt mehrdeutig. Die alternative koordinierende Lesart wird deshalb in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist bildhaft und gut verständlich; „Himmelsgewölbe“ hält das poetische Register, während „geht er umher“ die iterative beziehungsweise bewegte Nuance der Verbform wiedergibt.
