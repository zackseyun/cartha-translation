source:
  edition: WLC
  text: וְ/שִׁית עַל עָפָ֥ר בָּ֑צֶר וּ/בְ/צ֖וּר נְחָלִ֣ים אוֹפִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/024.yaml
  text: and lay gold in the dust[a], and the gold of Ophir among the stones of the wadis[c][b],
translation:
  language: de
  text: und lege das Gold[a] in den Staub und das Gold aus Ofir[b] zwischen die Felsen der Wadis[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Golderz“ beziehungsweise „das kostbare Metall“. Das seltene hebräische Wort bezeichnet nicht nur verarbeitetes Gold.'
    reason: lexical_alternative
  - marker: b
    text: Ofir war für besonders kostbares Gold bekannt. Im Hebräischen steht hier nur der Ortsname „Ofir“.
    reason: cultural_note
  - marker: c
    text: 'Wadis sind Täler oder Bachbetten, die oft nur zeitweise Wasser führen. Möglich ist auch: „Bachtäler“ oder „Wildbäche“.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁית
  choice: und lege
  rationale: שׁית bedeutet „setzen, legen, stellen“. Der Imperativ und das vorangestellte וְ werden in der fortlaufenden Aufforderung mit „und lege“ wiedergegeben.
- source_word: עַל עָפָר
  choice: in den Staub
  rationale: עַל heißt gewöhnlich „auf/über“. Im Deutschen gibt „in den Staub legen“ das poetische Bild des Preisgebens natürlicher wieder als das wörtlichere „auf den Staub legen“.
- source_word: בָּצֶר
  choice: das Gold
  rationale: Das seltene Wort kann kostbares Metall, Gold beziehungsweise Golderz bezeichnen. Im Parallelismus mit Ofir ist „Gold“ im Haupttext klar und knapp; die weiter gefasste Bedeutung bleibt in einer Fußnote erhalten. Ein Possessivpronomen wird nicht ergänzt, da es im Hebräischen nicht ausdrücklich steht.
- source_word: וּבְצוּר נְחָלִים
  choice: zwischen die Felsen der Wadis
  rationale: צוּר bezeichnet Fels oder Gestein, נְחָלִים je nach Gelände Wasserläufe, Bachtäler oder saisonale Trockentäler. Die Formulierung vermittelt idiomatisch das Bild vom Gold, das im felsigen Gelände der Wadis abgelegt wird.
- source_word: אוֹפִיר
  choice: das Gold aus Ofir
  rationale: Ofir ist ein für kostbares Gold berühmter Ort. Der hebräische Ortsname steht metonymisch; „das Gold aus Ofir“ macht den im Parallelismus vorausgesetzten Bezug deutlich.
theological_decisions:
- issue: Aussageabsicht innerhalb von Elifas’ Aufforderung
  choice: Die Worte werden als Aufforderung verstanden, materielles Gold preiszugeben und nicht darauf zu vertrauen.
  alternative: Das Gold wird an einem natürlichen Ort sicher verwahrt.
  rationale: Der unmittelbare Zusammenhang mit Vers 25, in dem der Allmächtige selbst zum kostbaren Besitz wird, spricht für das Preisgeben irdischen Reichtums. Die Formulierung bleibt jedoch bildhaft und fügt keine ausdrückliche Aussage über das Wegwerfen hinzu.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die Satzform bleibt als Fortsetzung des vorhergehenden Zusammenhangs kleingeschrieben und endet entsprechend der Verssyntax mit einem Komma. Die seltenen Landschafts- und Metallbegriffe werden knapp erläutert, ohne die Bildsprache im Haupttext zu überfrachten.
