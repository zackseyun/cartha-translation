  yaml_path: translation/ot/job/022/006.yaml
  text: For you took pledges from your brothers for no reason[b][a], and stripped the clothing from the naked.
translation:
  language: de
  text: Denn ohne Grund hast du deinen Brüdern Pfänder[a][b] abgenommen und den Nackten die Kleider ausgezogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast deinen Brüdern ohne Anlass Sicherheiten abgenommen.“'
    reason: lexical_alternative
  - marker: b
    text: „Brüder“ kann hier über leibliche Geschwister hinaus Mitglieder der eigenen Gemeinschaft bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Elifas’ konkrete Anklage mit begründender beziehungsweise erläuternder Kraft ein und knüpft natürlich an den vorherigen Vers an.
- source_word: תַחְבֹּל
  choice: nahmst ... Pfänder
  rationale: חבל bezeichnet hier das Nehmen eines Pfandes beziehungsweise einer Sicherheit für eine Schuld. Die deutsche Pluralform gibt den vorwurfsvoll als wiederholt oder typisch dargestellten Vorgang natürlich wieder.
- source_word: אַחֶיךָ
  choice: deinen Brüdern
  rationale: Gibt die maskuline Pluralform wörtlich wieder; im Kontext kann sie über leibliche Brüder hinaus Angehörige der eigenen Gemeinschaft bezeichnen.
- source_word: חִנָּם
  choice: ohne Grund
  rationale: Drückt aus, dass die Pfänder ohne berechtigten Anlass und damit ungerecht genommen wurden; die Wendung ist knapp und idiomatisch.
- source_word: וּבִגְדֵי
  choice: die Kleider
  rationale: בגד bezeichnet Kleidungsstücke beziehungsweise Kleidung. Der bestimmte Ausdruck ist im Deutschen in Verbindung mit „ausziehen“ natürlich.
- source_word: עֲרוּמִּים
  choice: den Nackten
  rationale: Bewahrt die scharfe, möglicherweise bewusst paradoxe Formulierung des Hebräischen. Das Wort kann auch unzureichend Bekleidete bezeichnen.
- source_word: תַּפְשִׁיט
  choice: zogst ... aus
  rationale: Der Hifil von פשט bedeutet hier, jemandem Kleidung auszuziehen. Die deutsche Konstruktion ist direkt und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Spannung, Nackten die Kleider auszuziehen, bleibt entsprechend dem Hebräischen erhalten; eine Deutung als bloß dürftig Bekleidete wird nicht in den Haupttext eingetragen.
