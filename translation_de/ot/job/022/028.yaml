revisions:
- from: Du wirst eine Sache beschließen[a], und sie wird für dich Bestand haben; Licht wird über deinen Wegen leuchten.
  to: Du wirst etwas festlegen[a], und es wird für dich Bestand haben; auf deinen Wegen wird Licht leuchten.
  rationale: Die Revision glättet zwei geringe idiomatische Unebenheiten, ohne den Sinn zu verändern. »Etwas festlegen« vermittelt die feste, wirksame Entscheidung von גזר mit אֹמֶר, ohne die stärkere Amts- oder Herrschaftskonnotation von »verfügen« aufzudrängen. »Auf deinen Wegen« gibt die poetische Ortsbeziehung des Hebräischen klar wieder. Die Fußnote erhält die wörtlichere Rede-/Ausspruchsnuance von אֹמֶר in natürlichem Deutsch.
