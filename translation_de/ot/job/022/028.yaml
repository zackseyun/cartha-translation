  yaml_path: translation/ot/job/022/028.yaml
  text: You will decree a matter[a], and it will be established for you, and light will shine on your ways.
translation:
  language: de
  text: Du wirst etwas festlegen[a], und es wird für dich Bestand haben; auf deinen Wegen wird Licht leuchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Du wirst einen Ausspruch festlegen, und er wird für dich bestehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִגְזַר
  choice: du wirst … beschließen
  rationale: גזר bezeichnet wörtlich ein Schneiden oder Abtrennen und kann übertragen »entscheiden, bestimmen, verfügen« bedeuten. »Beschließen« gibt hier eine feste Entscheidung oder Erklärung wieder, ohne unnötig königliche oder amtliche Vollmacht anzudeuten.
- source_word: אֹמֶר
  choice: eine Sache
  rationale: אֹמֶר bedeutet gewöhnlich »Wort, Ausspruch, Rede«. In Verbindung mit גזר kann es auf das Gesagte beziehungsweise Beschlossene zielen. »Eine Sache« gibt diesen praktischen Sinn wieder; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: יָקָם
  choice: sie wird … Bestand haben
  rationale: קום bedeutet im Qal »aufstehen, stehen, bestehen«. Bei einer beschlossenen Sache bezeichnet es deren Bestätigung oder Wirksamwerden. »Bestand haben« bewahrt das Bild des Bestehens und vermeidet eine übersteigerte Erfolgsgarantie.
- source_word: לָךְ
  choice: für dich
  rationale: Die Präposition ל bezeichnet hier die Beziehung oder den Vorteil für die angesprochene Person. »Für dich« ist die direkte und offene Wiedergabe.
- source_word: דְּרָכֶיךָ
  choice: deine Wege
  rationale: דרך bezeichnet konkrete Wege und bildlich den Lebensweg oder das Handeln. »Wege« erhält die poetische Metapher.
- source_word: נָגַהּ אֹור
  choice: Licht wird … leuchten
  rationale: נגה bedeutet »leuchten, glänzen«; mit אוֹר als Subjekt entsteht das klare poetische Bild von Licht, das die Wege erhellt.
theological_decisions:
- issue: Charakter der Zusage in Elifas’ Rede
  choice: Die Aussage wird als zuversichtliche Erwartung formuliert, ohne sie sprachlich zu einer uneingeschränkten göttlichen Garantie zu verstärken.
  alternative: Eine absolute Verheißung sicheren Erfolgs oder lediglich eine Möglichkeit ausdrücken.
  rationale: Der Vers gibt Elifas’ Auffassung innerhalb der Auseinandersetzung des Hiobbuches wieder. Die Übersetzung wahrt die Bestimmtheit seiner Aussage, ohne vorwegzunehmen, in welchem Maß das Buch seine Theologie bestätigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener poetischer Bildsprache. »Bestand haben« ist leicht gehoben, aber allgemein verständlich und bildet קום genauer ab als eine freie Umschreibung wie »in Erfüllung gehen«.
