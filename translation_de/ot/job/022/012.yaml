source:
  edition: WLC
  text: הֲֽ/לֹא אֱ֭לוֹהַּ גֹּ֣בַהּ שָׁמָ֑יִם וּ/רְאֵ֤ה רֹ֖אשׁ כּוֹכָבִ֣ים כִּי רָֽמּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/012.yaml
  text: Is not God in the height of heaven? And see the highest stars[b][a], how lofty they are.
translation:
  language: de
  text: Ist Gott nicht in der Höhe des Himmels[a]? Und sieh die höchsten Sterne[b] – wie hoch sie stehen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Höhen des Himmels“. Wörtlich steht im Hebräischen: „die Höhe des Himmels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den Kopf“ oder „die Spitze der Sterne“; gemeint sind wahrscheinlich die höchststehenden Sterne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Ist … nicht
  rationale: Die Form leitet eine rhetorische Frage ein, die Zustimmung erwartet. Die deutsche Wendung bewahrt sowohl die Frageform als auch deren natürlichen Nachdruck.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Dies ist die schlichte und sachgemäße Wiedergabe der singularischen Gottesbezeichnung, ohne zusätzliche Deutung.
- source_word: גֹּבַהּ שָׁמָיִם
  choice: in der Höhe des Himmels
  rationale: Die constructus-Verbindung bezeichnet wörtlich die Höhe des Himmels. Mit der aus dem Nominalsatz erschlossenen Ortsangabe bleibt das räumliche Bild im Deutschen verständlich erhalten.
- source_word: וּרְאֵה
  choice: Und sieh
  rationale: Die Wiedergabe bewahrt sowohl die Konjunktion als auch den Imperativ von ראה und entspricht dem auffordernden Blick auf die Sterne.
- source_word: רֹאשׁ כּוֹכָבִים
  choice: die höchsten Sterne
  rationale: רֹאשׁ bedeutet wörtlich „Kopf/Spitze“ und bezeichnet hier idiomatisch den obersten Bereich beziehungsweise die höchststehenden Sterne. Die gewählte Form ist im Deutschen natürlich und erhält das Höhenbild.
- source_word: כִּי
  choice: wie
  rationale: כִּי führt hier am plausibelsten eine ausrufende Feststellung über die Höhe der Sterne ein. „Wie“ gibt diese Funktion idiomatisch wieder, ohne einen Kausalzusammenhang zu unterstellen.
- source_word: רָמּוּ
  choice: wie hoch sie stehen
  rationale: Das Verb רום bezeichnet das Hochsein beziehungsweise Erhabensein. Im Zusammenhang mit Sternen drückt „hoch stehen“ die räumliche Bedeutung klar und natürlich aus.
theological_decisions:
- issue: Räumliche Transzendenz Gottes oder rhetorische Beobachtung innerhalb der Rede Elifas’
  choice: Die rhetorische Frage und das räumliche Höhenbild werden ohne erklärende Erweiterung wiedergegeben.
  alternative: Die Aussage als ausdrückliche Lehre von Gottes Ferne oder als direkte theologische Kritik an Hiob paraphrasieren.
  rationale: Der Vers gehört zur Rede Elifas’ und verbindet Gottes Ort in der Himmelshöhe rhetorisch mit den hochstehenden Sternen. Eine weitergehende theologische Folgerung wird im hebräischen Satz nicht ausdrücklich formuliert.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, poetischem Klang. Die rhetorische Frage bleibt unmittelbar; der Gedankenstrich macht den ausrufenden Charakter des letzten Satzteils lesbar, ohne zusätzliche Aussage einzuführen.
