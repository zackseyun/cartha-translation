  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: de
  text: 'Darauf antwortete Elifas, der Temaniter:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: ענה bezeichnet in dieser narrativen Form die Erwiderung in einem Gespräch. „Antwortete“ gibt diese dialogische Funktion im Deutschen natürlich und präzise wieder.
- source_word: אֱלִיפַז
  choice: Elifas
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition transliteriert.
- source_word: הַתֵּמָנִי
  choice: der Temaniter
  rationale: Das Gentiliz bezeichnet Elifas als Mann aus Teman. „Der Temaniter“ ist knapp, würdig und im Deutschen als Herkunftsbezeichnung verständlich.
- source_word: וַיֹּאמַר
  choice: ':'
  rationale: Das hebräische „und sagte“ bildet zusammen mit „antwortete“ eine feste Redeeinleitungsformel. Im natürlichen modernen Deutsch wird der Beginn der direkten Rede idiomatisch durch einen Doppelpunkt angezeigt, ohne dass inhaltliche Information verloren geht.
- source_word: וַ
  choice: Darauf
  rationale: Das einleitende Waw führt die nächste Reaktion im Dialog fort. „Darauf“ macht den Anschluss an die vorausgehende Rede natürlicher deutlich als ein mechanisches „Und“.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem literarischem Ton. Die hebräische Doppelverbformel „antwortete und sagte“ wird idiomatisch zu „antwortete:“ verdichtet.
