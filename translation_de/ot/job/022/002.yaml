  text: הַ/לְ/אֵ֥ל יִסְכָּן גָּ֑בֶר כִּֽי יִסְכֹּ֖ן עָלֵ֣י/מוֹ מַשְׂכִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/002.yaml
  text: Can a man be of use to God? Surely he who is wise is of use to himself[a].
translation:
  language: de
  text: Kann ein Mensch Gott von Nutzen sein? Denn wer Einsicht hat, nützt sich selbst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kann ein Mensch Gott Gewinn bringen? Denn wer Einsicht hat, bringt sich selbst Gewinn.“'
    reason: Lexikalische und syntaktische Alternative zu סכן und כִּי.
lexical_decisions:
- source_word: הַלְאֵל
  choice: Kann ... Gott ...?
  rationale: Die Fragepartikel הֲ und לְאֵל kennzeichnen eine rhetorische Frage danach, ob ein Mensch Gott Nutzen bringen kann.
- source_word: יִסְכָּן
  choice: von Nutzen sein / nützt
  rationale: סכן bezeichnet hier das Nützlich- oder Förderlichsein. Die beiden Vorkommen werden im Deutschen sinngleich wiedergegeben.
- source_word: גָּבֶר
  choice: ein Mensch
  rationale: גבר ist morphologisch maskulin, bezeichnet hier jedoch repräsentativ einen Menschen; „ein Mensch“ ist im modernen Deutschen natürlich und erhält die allgemeine Aussage.
- source_word: כִּי
  choice: Ja
  rationale: כִּי kann den zweiten Halbvers erklärend oder bekräftigend einleiten. „Ja“ wahrt die Bekräftigung, ohne den logischen Zusammenhang eindeutiger festzulegen, als es der hebräische Text tut.
- source_word: עָלֵימוֹ
  choice: sich selbst
  rationale: Die Präposition עַל mit dem pronominalen Suffix bezeichnet hier wahrscheinlich denjenigen, dem der Nutzen zugutekommt.
- source_word: מַשְׂכִּיל
  choice: ein Einsichtiger
  rationale: Das substantivierte Partizip von שכל bezeichnet einen Menschen mit Einsicht beziehungsweise jemanden, der verständig handelt.
theological_decisions:
- issue: Ob ein Mensch Gott einen Vorteil verschaffen kann
  choice: Die erste Frage ist so formuliert, dass sie im Zusammenhang eine verneinende Antwort nahelegt; der Nutzen der Einsicht kommt dem Menschen selbst zugute.
  alternative: 'Der zweite Halbvers kann enger erklärend gelesen werden: „Denn ein Einsichtiger nützt sich selbst.“'
  rationale: Die Übersetzung bewahrt die rhetorische Gegenüberstellung zwischen Gott und dem Menschen, ohne daraus eine über den Vers hinausgehende Lehrformel abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe rhetorische Form und der Parallelismus bleiben erhalten; wirtschaftlich eng klingendes „profitieren“ wird im Haupttext vermieden.
