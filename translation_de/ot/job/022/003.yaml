  text: הַ/חֵ֣פֶץ לְ֭/שַׁדַּי כִּ֣י תִצְדָּ֑ק וְ/אִם בֶּ֝֗צַע כִּֽי תַתֵּ֥ם דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/003.yaml
  text: Is it any pleasure to the Almighty that you are righteous[b][a], or any gain that you make your ways blameless?
translation:
  language: de
  text: Ist es dem Allmächtigen eine Freude, dass du gerecht bist, oder ist es ein Gewinn für ihn, dass du deine Wege untadelig machst?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ לְשַׁדַּי
  choice: Hat der Allmächtige etwas davon
  rationale: חֵפֶץ kann Freude, Gefallen, Wunsch oder Interesse bezeichnen. Im Parallelismus mit בֶּצַע liegt hier der Gedanke eines Nutzens oder Vorteils nahe; die deutsche Wendung ist natürlich und lässt offen, ob Freude oder Nutzen im Vordergrund steht.
- source_word: כִּי תִצְדָּק
  choice: wenn du gerecht bist
  rationale: Das Qal von צדק bedeutet hier am ehesten, gerecht beziehungsweise im Recht zu sein; eine reflexive Bedeutung wie „dich selbst rechtfertigst“ wird nicht vorausgesetzt.
- source_word: בֶּצַע
  choice: Gewinn
  rationale: בֶּצַע bezeichnet Gewinn oder Vorteil und bewahrt das wirtschaftliche Bild der zweiten rhetorischen Frage.
- source_word: כִּי תַתֵּם דְּרָכֶיךָ
  choice: wenn du deine Wege untadelig machst
  rationale: Das Hiphil von תמם ist kausativ; „untadelig machst“ gibt diesen Zug wieder. „Deine Wege“ bewahrt das hebräische Bild für Lebensführung und Verhalten.
theological_decisions:
- issue: Ob menschliche Gerechtigkeit Gott innerlich Freude bereitet oder ihm einen Vorteil verschafft
  choice: Die rhetorischen Fragen geben Elifas’ Behauptung wieder, dass Gott aus Hiobs Gerechtigkeit keinen Nutzen oder Gewinn zieht.
  alternative: Die erste Hälfte kann enger als Frage nach Gottes Freude oder Gefallen verstanden werden.
  rationale: Der Parallelismus von חֵפֶץ und בֶּצַע legt Nutzen beziehungsweise Vorteil nahe, ohne eine allgemeine theologische Aussage darüber zu erzwingen, ob Gott andernorts an Gerechtigkeit Gefallen hat. Die Aussage bleibt als Argument Elifas’ erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Struktur und der Parallelismus bleiben erhalten; „der Allmächtige“ gibt den in Hiob üblichen Gottesnamen שַׁדַּי wieder.
