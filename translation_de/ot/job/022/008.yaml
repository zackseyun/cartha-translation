  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֣ישׁ זְ֭רוֹעַ ל֣/וֹ הָ/אָ֑רֶץ וּ/נְשׂ֥וּא פָ֝נִ֗ים יֵ֣שֶׁב בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/008.yaml
  text: But the land belonged to the strong man[b][a], and the favored man lived in it.
translation:
  language: de
  text: Doch dem Mächtigen[a] gehörte das Land, und der Angesehene[b] wohnte darin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Mann des Arms“, eine hebräische Wendung für einen starken oder mächtigen Mann.
    reason: lexical_alternative
  - marker: b
    text: Oder „der Begünstigte“, „der Bevorzugte“ oder „der Geehrte“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ זְרוֹעַ
  choice: Doch dem Mächtigen
  rationale: Die Konjunktion wird im Zusammenhang adversativ mit „Doch“ wiedergegeben. Wörtlich bezeichnet אִישׁ זְרוֹעַ einen „Mann des Arms“ und idiomatisch einen starken, einflussreichen oder mächtigen Mann. „der Mächtige“ gibt diese soziale Machtstellung natürlich und knapp wieder.
- source_word: לוֹ הָאָרֶץ
  choice: gehörte das Land
  rationale: 'Die Konstruktion mit לְ drückt Besitz oder Verfügungsgewalt aus: Das Land war sein beziehungsweise stand unter seiner Kontrolle.'
- source_word: וּנְשׂוּא פָנִים
  choice: und der Angesehene
  rationale: Die Wendung bedeutet wörtlich etwa „einer, dessen Gesicht erhoben wird“ und kann einen Geehrten, Begünstigten oder bevorzugt Behandelten bezeichnen. „der Angesehene“ bewahrt die mögliche Bedeutung gesellschaftlicher Ehre, ohne den im Kontext möglichen Beiklang der Begünstigung zu verdecken; dieser wird in der Fußnote genannt.
- source_word: יֵשֶׁב בָּהּ
  choice: wohnte darin
  rationale: יָשַׁב bezeichnet hier das Wohnen beziehungsweise Ansässigsein im Land. „wohnte darin“ ist modern, klar und wahrt den Bezug des femininen Suffixes auf הָאָרֶץ.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und der Gegensatz zum Umgang mit den Schwachen im Kontext bleiben erhalten. Die mehrdeutige Wendung נְשׂוּא פָנִים wird im Haupttext zurückhaltend und in der Fußnote mit ihren möglichen sozialen Nuancen wiedergegeben.
