source:
  edition: WLC
  text: הֲ/לֹ֣א רָעָֽתְ/ךָ֣ רַבָּ֑ה וְ/אֵֽין קֵ֝֗ץ לַ/עֲוֺנֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/005.yaml
  text: Is not your evil abundant[b][a], and there is no end to your iniquities?
translation:
  language: de
  text: Ist deine Bosheit[a] nicht groß, und nehmen deine Vergehen kein Ende[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schlechtigkeit«. Das hebräische Wort kann in anderen Zusammenhängen auch »Unheil« bedeuten; hier weist die Parallele zu »deine Vergehen« auf moralische Bosheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »und es gibt kein Ende für deine Vergehen«; auch möglich: »und deine Vergehen sind grenzenlos«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Ist … nicht
  rationale: Gibt die rhetorische Frage wieder, die eine bejahende Antwort erwartet, und bewahrt so den anklagenden Ton.
- source_word: רָעָתְךָ
  choice: deine Bosheit
  rationale: רָעָה kann auch Unheil bezeichnen; durch den Parallelismus mit »deine Vergehen« ist hier jedoch moralische Bosheit gemeint.
- source_word: רַבָּה
  choice: groß
  rationale: Das Adjektiv bezeichnet Größe oder Fülle. »Groß« verbindet sich im Deutschen natürlich mit dem Singular »Bosheit«.
- source_word: וְאֵין קֵץ
  choice: und nehmen … kein Ende
  rationale: Die idiomatische deutsche Wendung gibt die hebräische Aussage »und es gibt kein Ende« natürlich wieder und bleibt innerhalb der rhetorischen Frage.
- source_word: לַעֲוֺנֹתֶיךָ
  choice: deine Vergehen
  rationale: Der Plural עֲוֺנוֹת bezeichnet schuldhafte Verfehlungen beziehungsweise Missetaten. »Vergehen« bewahrt den moralischen Ernst, ohne altertümlich zu klingen.
theological_decisions:
- issue: Moralische Bosheit oder erlittenes Unheil in רָעָתְךָ
  choice: moralische Bosheit
  alternative: Unheil oder Unglück
  rationale: Obwohl רָעָה beide Bedeutungsfelder haben kann, weist der parallele Ausdruck »deine Vergehen« hier deutlich auf eine moralische Anklage Elifas’.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, anklagendem Ton. Die idiomatische Formulierung »kein Ende nehmen« erhält die rhetorische Struktur, ohne den Sinn zu glätten.
