  text: וְ/הָיָ֣ה שַׁדַּ֣י בְּצָרֶ֑י/ךָ וְ/כֶ֖סֶף תּוֹעָפ֣וֹת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/025.yaml
  text: then the Almighty will be your gold[a], and choice silver for you.
translation:
  language: de
  text: Dann wird der Allmächtige dein Gold[a] und erlesenes Silber für dich sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann wird der Allmächtige dein Schatz sein und Silber in Fülle für dich.“ Die hebräischen Ausdrücke für „Gold“ und für die nähere Bestimmung des Silbers sind schwierig. Möglicherweise ist gemeint, dass Gott Reichtum schenkt, nicht dass Gott selbst der Schatz ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Dann wird … sein
  rationale: Das Waw mit Perfekt bezeichnet im Zusammenhang die Folge der vorausgehenden Aufforderung. „Dann wird“ gibt diesen konsekutiven, zukünftigen Sinn im Deutschen natürlich wieder.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Dies ist die geläufige deutsche Wiedergabe des Gottesnamens beziehungsweise Gottestitels Schaddai und passt zum Sprachgebrauch im Buch Hiob.
- source_word: בְּצָרֶיךָ
  choice: dein Gold
  rationale: בצר kann hier kostbares Metall beziehungsweise Golderz bezeichnen. Im poetischen Parallelismus mit „Silber“ ist „dein Gold“ eine klare und natürliche Wiedergabe, obwohl auch „dein Schatz“ möglich ist.
- source_word: וְכֶסֶף
  choice: und … Silber
  rationale: Das zweite Glied des poetischen Parallelismus wird mit dem aus dem ersten Glied ergänzten Prädikat verbunden.
- source_word: תּוֹעָפוֹת
  choice: erlesenes
  rationale: Das seltene und schwierige Wort bezeichnet in diesem Zusammenhang möglicherweise besonders wertvolles oder reichlich vorhandenes Silber. „Erlesenes“ wahrt den Qualitätsaspekt, ohne die unsichere Bedeutung übermäßig festzulegen.
- source_word: לָךְ
  choice: für dich
  rationale: Die Form bezeichnet den persönlichen Bezug beziehungsweise Nutzen und wird im Deutschen idiomatisch mit „für dich“ wiedergegeben.
theological_decisions:
- issue: Deutung der Verheißung in Elifas’ Rede
  choice: Der Allmächtige selbst wird als Hiobs wahrer Reichtum bezeichnet.
  alternative: Der Allmächtige wird Hiob Gold und Silber in Fülle verschaffen.
  rationale: Die poetische Syntax lässt sowohl die Identifikation Gottes mit dem wahren Schatz als auch eine Zusage materiellen Wohlstands zu. Der Haupttext bewahrt die starke Metapher; die andere mögliche Deutung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzform. Die echte lexikalische und theologische Mehrdeutigkeit wird durch die Fußnote bewahrt.
