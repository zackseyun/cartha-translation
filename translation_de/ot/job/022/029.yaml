  text: כִּֽי הִ֭שְׁפִּילוּ וַ/תֹּ֣אמֶר גֵּוָ֑ה וְ/שַׁ֖ח עֵינַ֣יִם יוֹשִֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/029.yaml
  text: For when they are brought low[a], you say[b], ‘Lift them up!’ and he saves the one with downcast eyes.
translation:
  language: de
  text: 'Denn wenn Menschen erniedrigt werden[a], sagst du: »Es geht wieder aufwärts!«[b] Und den Menschen mit gesenkten Augen rettet er.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wenn sie erniedrigen«; das Hebräische nennt weder ausdrücklich, wer erniedrigt, noch wen. Möglich ist auch: »wenn man dich erniedrigt« oder, näher an der hebräischen Aktivform: »wenn sie erniedrigen«.'
    reason: alternative_reading
  - marker: b
    text: 'Das Hebräische ist hier knapp und mehrdeutig; wörtlich etwa: »Höhe!« oder »Erhöhung!« Möglich ist auch: »Aufwärts!« oder »Es gibt Erhöhung.«'
    reason: textual_ambiguity
  - marker: c
    text: 'Wörtlich: »den Niedrigen/Gesenkten an Augen«. Gemeint sein kann ein demütiger, erniedrigter oder niedergeschlagener Mensch. Das unausgesprochene Subjekt von »rettet« ist im Zusammenhang wahrscheinlich Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn wenn
  rationale: Die Verbindung kann begründend oder zeitlich verstanden werden. »Denn wenn« gibt im Zusammenhang beides wieder.
- source_word: הִשְׁפִּילוּ
  choice: sie jemanden erniedrigen
  rationale: Die Hifil-Form ist aktiv und steht in der 3. Person Plural. Da das hebräische Objekt unausgesprochen bleibt, wird das unbestimmte »jemanden« zur Bildung eines natürlichen deutschen Satzes ergänzt und in einer Fußnote kenntlich gemacht.
- source_word: וַתֹּאמֶר
  choice: wirst du sagen
  rationale: Die Form richtet sich an eine einzelne angesprochene Person. Im Zusammenhang bezeichnet sie eher die Folge im geschilderten Fall als eine vergangene Erzählhandlung.
- source_word: גֵּוָה
  choice: Erhebung!
  rationale: Das Nomen bezeichnet hier wahrscheinlich Höhe beziehungsweise Erhöhung und bildet den Gegensatz zum Erniedrigen. Die knappe, elliptische Ausrufform des Hebräischen bleibt erhalten.
- source_word: וְשַׁח עֵינַיִם
  choice: den Menschen mit gesenkten Augen
  rationale: Die wörtliche Bildsprache »niedrig/gesenkt an Augen« kann Demut, Niedrigkeit oder Niedergeschlagenheit ausdrücken. Die Übersetzung bewahrt das Bild, ohne sich auf nur eine Deutung festzulegen.
- source_word: יוֹשִׁעַ
  choice: rettet er
  rationale: Das Verb steht in der 3. Person Singular maskulin und bedeutet »retten/befreien«. Das unausgesprochene Subjekt bleibt wie im Hebräischen unausdrücklich; im Zusammenhang ist wahrscheinlich Gott gemeint.
theological_decisions:
- issue: Subjekt von יוֹשִׁעַ
  choice: »rettet er«, ohne das Subjekt ausdrücklich als Gott zu benennen
  alternative: »Gott rettet« oder ein unpersönliches »man rettet«
  rationale: Im Zusammenhang ist Gott als Subjekt naheliegend, doch der hebräische Text nennt ihn in diesem Satz nicht ausdrücklich. Das Pronomen bewahrt diese Knappheit.
- issue: Sinn von גֵּוָה
  choice: positiver Ausruf »Erhebung!«
  alternative: »Es geht aufwärts!«, »Richte sie auf!« oder negativ »Hochmut«
  rationale: Der unmittelbare Gegensatz zur Erniedrigung spricht für Erhöhung beziehungsweise Wiederaufrichtung. Die nominale Wiedergabe vermeidet es, aus dem schwierigen Nomen ohne Not einen Imperativ zu machen.
- issue: Bedeutung von שַׁח עֵינַיִם
  choice: bildhaft »Mensch mit gesenkten Augen«
  alternative: deutend »der Demütige« oder »der Niedergeschlagene«
  rationale: Die Bildform lässt offen, ob vor allem Demut, niedriger Stand oder Niedergeschlagenheit gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Ausrufform »Erhebung!« spiegelt bewusst die Ellipse des hebräischen Textes; die Fußnoten machen die grammatische und semantische Mehrdeutigkeit sichtbar.
