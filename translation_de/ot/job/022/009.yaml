id: JOB.22.9
reference: Job 22:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַ֭לְמָנוֹת שִׁלַּ֣חְתָּ רֵיקָ֑ם וּ/זְרֹע֖וֹת יְתֹמִ֣ים יְדֻכָּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/009.yaml
  text: You sent widows away empty[c][b][a], and the arms of orphans were crushed.
translation:
  language: de
  text: 'Witwen hast du mit leeren Händen fortgeschickt,

    und die Arme der Waisen[a] wurden zerschmettert.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Vaterlosen“. Das hebräische Wort bezeichnet besonders Kinder, die ihren Vater verloren haben.'
    reason: lexical_alternative
  - marker: b
    text: Die „Arme“ können hier auch für die Kraft oder Macht der Waisen stehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנוֹת
  choice: Witwen
  rationale: Die übliche Bedeutung des Plurals bezeichnet Frauen, deren Ehemänner gestorben sind, und bewahrt ihre im Kontext vorausgesetzte soziale Schutzlosigkeit.
- source_word: שִׁלַּחְתָּ
  choice: hast du … fortgeschickt
  rationale: Der Piel von שלח bedeutet hier, jemanden wegzuschicken oder abzuweisen. „Fortgeschickt“ ist im anklagenden Zusammenhang natürlich und deutlich.
- source_word: רֵיקָם
  choice: mit leeren Händen
  rationale: Das Adverb bedeutet „leer“ beziehungsweise „ohne etwas erhalten zu haben“. Die deutsche Wendung „mit leeren Händen“ gibt den Sinn idiomatisch wieder.
- source_word: זְרֹעוֹת
  choice: Arme
  rationale: Die konkrete Körperbezeichnung wird bewahrt; zugleich kann das hebräische Bild auch Stärke oder Macht bezeichnen.
- source_word: יְתֹמִים
  choice: Waisen
  rationale: Das Wort bezeichnet insbesondere Kinder ohne Vater und damit eine sozial schutzlose Gruppe. „Waisen“ ist die geläufige moderne Wiedergabe; die engere Bedeutung wird in einer Fußnote kenntlich gemacht.
- source_word: יְדֻכָּא
  choice: wurden zerschmettert
  rationale: Die passive Form von דכא bezeichnet ein Zermalmen oder Zerschmettern. Trotz der morphologisch singularischen Verbform verlangt das pluralische „Arme“ im Deutschen den Plural.
theological_decisions:
- issue: Konkrete oder bildliche Bedeutung der zerschmetterten Arme
  choice: Das konkrete Bild „die Arme … wurden zerschmettert“ bleibt im Haupttext stehen.
  alternative: „Ihre Kraft wurde gebrochen.“
  rationale: Der hebräische Ausdruck lässt die konkrete Gewaltdarstellung und die bildliche Aussage über gebrochene Kraft nebeneinander anklingen. Eine rein abstrakte Übersetzung würde diese Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelstruktur. „Mit leeren Händen“ ist idiomatischer als ein isoliertes „leer“; „zerschmettert“ bewahrt die Härte und Bildkraft des hebräischen Verbs.
