source:
  edition: WLC
  text: קַח נָ֣א מִ/פִּ֣י/ו תּוֹרָ֑ה וְ/שִׂ֥ים אֲ֝מָרָ֗י/ו בִּ/לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/022.yaml
  text: Please[a], receive instruction from his mouth, and lay up his words in your heart.
translation:
  language: de
  text: Nimm doch[a] Weisung aus seinem Mund an und bewahre seine Worte in deinem Herzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Lehre; Unterweisung; auch: Gesetz. Das hebräische Wort lautet Tora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: nimm … an
  rationale: Das Imperativverb bedeutet wörtlich „nimm“, bezeichnet hier aber im Zusammenhang mit Weisung deren bereitwillige Annahme. „Nimm … an“ bewahrt das Bild und klingt im modernen Deutsch natürlich.
- source_word: נָא
  choice: doch
  rationale: Die Partikel verleiht der Aufforderung einen bittenden oder eindringlichen Ton, ohne hier notwendig zeitlich „nun“ zu bedeuten. Das deutsche „doch“ gibt diese Nuance knapp und idiomatisch wieder.
- source_word: מִפִּיו
  choice: aus seinem Mund
  rationale: Die konkrete hebräische Wendung wird beibehalten; sie bezeichnet die unmittelbar ausgesprochene Weisung.
- source_word: תּוֹרָה
  choice: Weisung
  rationale: Im Weisheitskontext bezeichnet תּוֹרָה autoritative Unterweisung, nicht zwingend das mosaische Gesetz. „Weisung“ wahrt sowohl die lehrende als auch die verbindliche Nuance.
- source_word: וְשִׂים
  choice: bewahre
  rationale: Wörtlich steht „lege/setze“. In Verbindung mit „in deinem Herzen“ meint die Wendung, die Worte innerlich aufzunehmen und festzuhalten; „bewahre“ gibt dies natürlich wieder.
- source_word: אֲמָרָיו
  choice: seine Worte
  rationale: Dies ist eine direkte, natürliche Wiedergabe des Plurals und erhält das Gewicht der gesprochenen Äußerungen.
- source_word: בִּלְבָבֶךָ
  choice: in deinem Herzen
  rationale: Das hebräische Herz bezeichnet das innere Denken und Wollen. Die geläufige deutsche Wendung bewahrt das Bild.
theological_decisions:
- issue: Bedeutung von תּוֹרָה in einer Weisheitsrede
  choice: Weisung
  alternative: Gesetz; Lehre; Unterweisung
  rationale: „Weisung“ vermeidet eine unbegründete Beschränkung auf das mosaische Gesetz, lässt aber den autoritativen Charakter der Rede bestehen. Dabei bleibt erkennbar, dass dies Elifas’ Aufforderung innerhalb seiner Rede ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache „aus seinem Mund“ und „in deinem Herzen“ bleibt erhalten; „doch“ gibt den bittend-eindringlichen Ton der Partikel נָא wieder.
