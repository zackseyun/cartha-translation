  variant: modern standard German
source:
  edition: WLC
  text: יְֽמַלֵּ֥ט אִֽי נָקִ֑י וְ֝/נִמְלַ֗ט בְּ/בֹ֣ר כַּפֶּֽי/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/022/030.yaml
  text: He delivers even one who is not innocent[b][a], and he will be delivered through the cleanness of your hands.
translation:
  language: de
  text: Er rettet sogar einen, der nicht unschuldig ist,[a] und dieser wird durch die Reinheit deiner Hände gerettet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er rettet den Unschuldigen.“ Der hebräische Wortlaut des ersten Satzteils ist schwierig und wird unterschiedlich verstanden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „durch die Reinheit deiner Hände“; reine Hände sind ein Bild für Unschuld oder moralische Lauterkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַלֵּט
  choice: rettet
  rationale: Der Piel von מלט bezeichnet hier das Bewirken von Entkommen, also Retten oder Befreien. „Rettet“ ist prägnant und entspricht dem folgenden Nifal.
- source_word: אִי נָקִי
  choice: einen, der nicht unschuldig ist
  rationale: Die schwierige Verbindung wird entsprechend einer verbreiteten traditionellen Deutung als Bezeichnung eines Nichtschuldlosen verstanden. Die ungewöhnliche Formulierung „nicht unschuldig“ bewahrt die Spannung des Hebräischen, statt sie zu „schuldig“ zu verschärfen.
- source_word: נָקִי
  choice: unschuldig
  rationale: נָקִי bezeichnet häufig Schuldlosigkeit oder Freiheit von Schuld und hat hier einen moralisch-rechtlichen Klang.
- source_word: וְנִמְלַט
  choice: und dieser wird … gerettet
  rationale: Der Nifal von מלט kann „gerettet werden“ oder „entkommen“ bedeuten. Die passive Wiedergabe wahrt die Parallelität zum ersten Satzteil; „dieser“ macht den Bezug im Deutschen verständlich.
- source_word: בְּבֹר
  choice: durch die Reinheit
  rationale: בְּ wird instrumental als „durch“ verstanden; בֹר bezeichnet hier Reinheit beziehungsweise Lauterkeit.
- source_word: כַּפֶּיךָ
  choice: deiner Hände
  rationale: Die Form bezeichnet die Hände beziehungsweise Handflächen. Zusammen mit „Reinheit“ entsteht das im Hebräischen gebräuchliche Bild moralischer Unschuld oder Lauterkeit.
theological_decisions:
- issue: Deutung des ersten Satzteils
  choice: Gott rettet sogar einen Menschen, der nicht unschuldig ist.
  alternative: Er rettet den Unschuldigen.
  rationale: Der hebräische Wortlaut ist außerordentlich schwierig. Die gewählte Lesart folgt der traditionellen Auffassung von אִי als einer negierenden beziehungsweise negationsähnlichen Form und passt zum zweiten Satzteil, in dem die Rettung mit der Reinheit der Hände des Angeredeten verbunden wird. Die Fußnote hält die andere plausible Deutung offen, ohne eine umfassendere Lehre über Fürbitte in den Vers hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas ungewöhnliche Wendung „nicht unschuldig“ ist bewusst beibehalten, um die Mehrdeutigkeit und theologische Spannung des schwierigen hebräischen Wortlauts nicht vorschnell aufzulösen.
