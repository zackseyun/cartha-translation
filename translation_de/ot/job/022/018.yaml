  yaml_path: translation/ot/job/022/018.yaml
  text: Yet he filled their houses with good things[b][a], but the counsel of the wicked is far from me.
translation:
  language: de
  text: Doch er füllte ihre Häuser mit Gutem[a], aber der Rat der Gottlosen ist mir fern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit Gutem“; gemeint sein können gute Gaben oder Wohlergehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch als Wunsch möglich: „Der Rat der Gottlosen sei mir fern.“ Das Hebräische lautet unmittelbarer als Feststellung: „Der Rat der Gottlosen ist mir fern.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: Doch er
  rationale: Die Verbindung aus Konjunktion und ausdrücklichem Pronomen hebt den Gegensatz zur Haltung der Gottlosen im Kontext hervor; „er“ bezeichnet Gott.
- source_word: מִלֵּא
  choice: füllte
  rationale: Das Verb bedeutet „füllen“; das Präteritum entspricht dem rückblickenden poetischen Zusammenhang.
- source_word: בָתֵּיהֶם
  choice: ihre Häuser
  rationale: Bewahrt das konkrete Bild des Hebräischen, auch wenn damit im Kontext der Lebensbereich ihres Wohlergehens gemeint ist.
- source_word: טוֹב
  choice: mit Gutem
  rationale: Das substantivisch gebrauchte „gut“ wird im Deutschen natürlich mit „Gutem“ wiedergegeben, ohne es vorschnell auf Wohlstand einzuengen.
- source_word: וַעֲצַת
  choice: der Rat ... aber
  rationale: „Rat“ gibt עֵצָה wieder; das nachgestellte „aber“ macht den im Zusammenhang liegenden Gegensatz natürlich deutlich.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: Traditionelle, prägnante und sachlich genaue Wiedergabe des substantivierten Plurals für Menschen, die schuldig und böse handeln.
- source_word: רָחֲקָה מֶנִּי
  choice: ist mir fern
  rationale: Die Zustandsaussage wahrt die qatal-Form und drückt die Distanzierung des Sprechers aus, ohne daraus einen Wunsch oder Befehl zu machen.
theological_decisions:
- issue: Aussageform im zweiten Halbvers
  choice: „der Rat der Gottlosen aber ist mir fern“ als Feststellung
  alternative: „der Rat der Gottlosen sei mir fern“ als Wunsch
  rationale: Das Hebräische verwendet eine qatal-Form und keinen Imperativ oder Jussiv. Daher bleibt der Haupttext eine Feststellung; die mögliche wunschhafte Auffassung wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetisch knapper Satzführung. „Mit Gutem“ bewahrt die offene Bildsprache; die Feststellung im zweiten Halbvers bleibt erhalten.
