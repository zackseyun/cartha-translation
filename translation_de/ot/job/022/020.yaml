  text: אִם לֹ֣א נִכְחַ֣ד קִימָ֑/נוּ וְ֝/יִתְרָ֗/ם אָ֣כְלָה אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/020.yaml
  text: Surely our adversaries have been cut off[b][a], and fire has consumed what was left of them.
translation:
  language: de
  text: »Gewiss sind unsere Gegner vernichtet[a], und was von ihnen übrig blieb, hat das Feuer verzehrt.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische קִימָנוּ ist schwer zu deuten. Es kann, wie im Haupttext, „unsere Gegner“ bedeuten; nach anderer Auffassung bedeutet es „unser Besitz“ oder „unser Bestand“.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: Ja
  rationale: Die Verbindung dient hier als nachdrückliche Bekräftigung, nicht als echte Bedingung. »Ja« gibt diese Gewissheit im Deutschen knapp und natürlich wieder.
- source_word: נִכְחַד
  choice: vernichtet sind
  rationale: Der Niphal von כחד bezeichnet das Beseitigt- oder Vernichtetsein. Die Formulierung wahrt den passiven, resultativen Sinn.
- source_word: קִימָנוּ
  choice: die, die sich gegen uns erhoben
  rationale: Die schwierige Form wird kontextuell auf Gegner bezogen und dabei möglichst nah an der Vorstellung des Sich-Erhebens wiedergegeben. Andere Deutungen sind in der Fußnote vermerkt.
- source_word: וְיִתְרָם
  choice: was von ihnen übrig blieb
  rationale: יתר bezeichnet hier den verbliebenen Rest; die Umschreibung ist natürlich und bewahrt den Bezug auf die zuvor genannte Gruppe.
- source_word: אָכְלָה אֵשׁ
  choice: hat das Feuer verzehrt
  rationale: Die Wendung beschreibt Feuer als zerstörende, verzehrende Kraft. Das bestimmte »das Feuer« entspricht der determinierten hebräischen Konstruktion.
theological_decisions: []
