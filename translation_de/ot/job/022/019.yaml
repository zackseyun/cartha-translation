  text: יִרְא֣וּ צַדִּיקִ֣ים וְ/יִשְׂמָ֑חוּ וְ֝/נָקִ֗י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/019.yaml
  text: The righteous see and rejoice[a], and the innocent mock them.
translation:
  language: de
  text: Die Gerechten sehen und freuen sich, und der Schuldlose spottet über sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְאוּ
  choice: sehen es
  rationale: Das Qal-Imperfekt von ראה bezeichnet hier das Wahrnehmen des zuvor geschilderten Geschehens. Das ergänzte „es“ ist im Deutschen für einen natürlichen, verständlichen Satz hilfreich und greift den Kontext auf, ohne den Bezug näher festzulegen.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Das substantivierte Adjektiv im Plural bezeichnet Menschen, die als gerecht gelten; „die Gerechten“ bewahrt die prägnante moralische Kategorie des Hebräischen.
- source_word: וְיִשְׂמָחוּ
  choice: und freuen sich
  rationale: שׂמח bezeichnet Freude beziehungsweise Frohsein. „Sich freuen“ ist gegenwärtiges, natürliches Standarddeutsch und überzeichnet die Intensität nicht.
- source_word: וְנָקִי
  choice: und der Schuldlose
  rationale: Das substantivierte Adjektiv steht im Singular und wird daher auch im Deutschen singularisch wiedergegeben. „Schuldlos“ trifft die Bedeutung von Freiheit von Schuld, ohne umfassende Sündlosigkeit zu behaupten.
- source_word: יִלְעַג
  choice: spottet
  rationale: לעג bezeichnet höhnisches oder verächtliches Lachen. „Spotten“ gibt den negativen, verächtlichen Ton knapp und idiomatisch wieder.
- source_word: לָמוֹ
  choice: über sie
  rationale: Die Präposition ל mit dem Pronomen hat bei לעג die Bedeutung „über/gegen sie“. „Über sie spotten“ ist im Deutschen idiomatisch; der unverdeutete Pluralbezug bleibt erhalten.
theological_decisions:
- issue: Bezug des pluralischen Pronomens לָמוֹ
  choice: Das Pronomen bleibt als „sie“ stehen und wird im Haupttext nicht ausdrücklich identifiziert.
  alternative: Den Bezug erläuternd als „über die Frevler“ wiedergeben.
  rationale: Im Zusammenhang bezieht sich das Pronomen wahrscheinlich auf die zuvor beschriebenen Frevler beziehungsweise deren Untergang. Da der hebräische Vers selbst jedoch nur ein Pronomen verwendet, vermeidet die Übersetzung eine interpretierende Explizierung.
- issue: Freude und Spott angesichts des Gerichts
  choice: Die spannungsvolle Reaktion der Gerechten wird ohne Abschwächung wiedergegeben.
  alternative: Die Freude ausdrücklich als Freude über Gottes Gerechtigkeit deuten oder den Spott mildern.
  rationale: Der Wortlaut schreibt sowohl Freude als auch Spott dem Gerechten beziehungsweise Schuldlosen zu. Eine moralisch-theologische Erklärung würde über den Vers hinausgehen und seine Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus zwischen „die Gerechten“ im Plural und „der Schuldlose“ im Singular bleibt erhalten. Keine Fußnote ist nötig, da „spottet über sie“ die lexikalische Spannweite im Kontext klar und natürlich wiedergibt.
