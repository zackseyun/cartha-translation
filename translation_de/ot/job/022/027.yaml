source:
  edition: WLC
  text: תַּעְתִּ֣יר אֵ֭לָי/ו וְ/יִשְׁמָעֶ֑/ךָּ וּ/נְדָרֶ֥י/ךָ תְשַׁלֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/027.yaml
  text: You will pray to him[a], and he will hear you, and you will fulfill your vows.
translation:
  language: de
  text: Du wirst zu ihm beten, und er wird dich hören, und du wirst deine Gelübde erfüllen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „deine Gelübde entrichten“ oder „bezahlen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעְתִּיר
  choice: du wirst beten
  rationale: Der Hifil von עתר bezeichnet hier ein inständiges Bitten oder Beten. Mit אֵלָיו und dem anschließenden Hören Gottes ist „beten“ im heutigen Deutsch natürlich und sinngenau.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition אֶל mit dem Suffix der 3. Person Singular Maskulinum bedeutet wörtlich „zu ihm“. Der Bezug auf Gott ergibt sich aus dem Kontext, sodass der hebräische Ausdruck ohne verdeutlichende Ergänzung bewahrt werden kann.
- source_word: וְיִשְׁמָעֶךָּ
  choice: und er wird dich hören
  rationale: שׁמע bedeutet gewöhnlich „hören“ oder „zuhören“. „Dich hören“ gibt den Ausdruck direkt wieder und lässt die im Gebetszusammenhang mitschwingende wohlwollende Zuwendung bestehen, ohne ausdrücklich „erhören“ oder „antworten“ einzutragen.
- source_word: וּנְדָרֶיךָ
  choice: und deine Gelübde
  rationale: נֶדֶר bezeichnet ein gegenüber Gott abgelegtes Gelübde. Der Plural mit Suffix wird direkt als „deine Gelübde“ wiedergegeben; eine Einschränkung auf Gelübdeopfer wäre spezifischer als der Ausgangstext.
- source_word: תְשַׁלֵּם
  choice: wirst du erfüllen
  rationale: Der Piel von שלם bedeutet in Verbindung mit Gelübden idiomatisch, sie zu entrichten beziehungsweise zu erfüllen. „Gelübde erfüllen“ ist im modernen Deutsch die geläufige und klare Wendung; die wörtlichere Zahlungsmetaphorik bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Ob die Schlussaussage kultisch-wörtlicher („Gelübde bezahlen/entrichten“) oder im Deutschen idiomatisch („Gelübde erfüllen“) wiederzugeben ist
  choice: du wirst deine Gelübde erfüllen
  alternative: du wirst deine Gelübde entrichten / bezahlen
  rationale: Gemeint ist, dass der Betende das Gott Gelobte tatsächlich ausführt. „Erfüllen“ vermittelt diese religiöse Verpflichtung verständlich, ohne den Ausdruck fälschlich auf eine Geldzahlung zu verengen; die zugrunde liegende hebräische Metapher wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Zukunftsform und die parataktische Satzstruktur des Hebräischen bleiben erhalten. Das Pronomen „ihm“ bewahrt den unmittelbaren Rückbezug auf Gott, ohne den Namen erläuternd einzusetzen. Der Fußnotenmarker steht sachgerecht bei der Wendung, auf die sich die lexikalische Alternative bezieht.
