  source_fidelity: 'Die Übersetzung bildet die hebräische Satzfolge und die Zukunftsformen zuverlässig ab: תעתיר אליו als „Du wirst zu ihm beten“, וישמעך als „er wird dich hören“ und ונדריך תשלם als „du wirst deine Gelübde erfüllen“. Das Pronomen „ihm“ bewahrt den im Kontext gegebenen Gottesbezug, ohne ihn im Vers zu ergänzen. „Erfüllen“ gibt die idiomatische Bedeutung von שלם bei Gelübden treffend wieder.'
