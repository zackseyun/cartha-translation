  yaml_path: translation/ot/job/022/021.yaml
  text: Come to terms with him, please, and be at peace; by this good will come to you.
translation:
  language: de
  text: Mach dich doch mit ihm vertraut und lebe in Frieden; dadurch wird Gutes zu dir kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „durch sie/diese“ (maskuliner Plural). Der Bezug ist nicht ausdrücklich genannt, wahrscheinlich sind die vorausgehenden Aufforderungen gemeint.
    reason: Die Fußnote dokumentiert die auffällige pluralische Form בָּהֶם, ohne ihren Bezug im Haupttext übermäßig festzulegen.
lexical_decisions:
- source_word: הַסְכֶּן נָא עִמּוֹ
  choice: Verständige dich doch mit ihm
  rationale: Das Hifil von סכן bezeichnet hier ein Sich-vertraut-Machen beziehungsweise ein Einvernehmen mit jemandem; „verständige dich“ gibt die Aufforderung idiomatisch wieder, ohne das Verhältnis genauer festzulegen. נָא wird mit „doch“ als höflich-eindringliche Partikel ausgedrückt.
- source_word: וּשְׁלם
  choice: und halte Frieden
  rationale: Die Aufforderung aus der Wurzel שלם zielt auf einen Zustand des Friedens beziehungsweise ungestörter Beziehung. „Halte Frieden“ wahrt gegenüber „versöhne dich“ die offenere Formulierung des Hebräischen.
- source_word: בָּהֶם
  choice: dadurch
  rationale: Das maskuline Pluralpronomen bedeutet wörtlich „durch sie/diese“ und verweist wahrscheinlich auf die vorangehenden Aufforderungen. Im Deutschen fasst „dadurch“ diesen Rückbezug natürlich zusammen.
- source_word: תְּבוֹאַתְךָ טוֹבָה
  choice: wird Gutes zu dir kommen
  rationale: טוֹבָה wird substantivisch als „Gutes“ verstanden; die Verbform mit Suffix drückt aus, dass dieses Gute zum Angesprochenen kommt.
theological_decisions:
- issue: Identität des mit „ihm“ bezeichneten Gegenübers
  choice: Das Pronomen „ihm“ bleibt stehen, ohne den Namen Gottes einzusetzen.
  alternative: „Verständige dich doch mit Gott“
  rationale: Im Zusammenhang ist Gott gemeint, doch der hebräische Vers verwendet nur das Pronomen. Die Übersetzung bewahrt diese Textgestalt und vermeidet eine erklärende Ergänzung im Haupttext.
- issue: Art der geforderten Beziehung
  choice: „Verständige dich … und halte Frieden“
  alternative: „Versöhne dich … und sei gerettet/wohlbehalten“
  rationale: Die gewählte Fassung lässt offen, ob primär Vertrautheit, Einvernehmen oder Versöhnung gemeint ist, und deutet שלם nicht soteriologisch um.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufforderungen sind klar und unmittelbar formuliert; „doch“ gibt die eindringlich-höfliche Nuance von נָא wieder. Der Parallelismus der beiden Imperative bleibt erhalten.
