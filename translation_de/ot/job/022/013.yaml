id: JOB.22.13
reference: Job 22:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְֽ֭/אָמַרְתָּ מַה יָּ֣דַֽע אֵ֑ל הַ/בְעַ֖ד עֲרָפֶ֣ל יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/013.yaml
  text: Yet you say[b][a], ‘What does God know? Can he judge through thick darkness?’
translation:
  language: de
  text: 'Doch du sagst: »Was weiß Gott? Kann er durch das Dunkel hindurch richten?[a]«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Richtet er durch das Dunkel hindurch?« Das hebräische Imperfekt kann hier auch als einfache Gegenwarts- oder Zukunftsaussage verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: »Dunkel« kann auch mit »dichte Dunkelheit«, »dunkle Wolke« oder »Düsternis« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Doch du sagst
  rationale: Das Waw kann im anklagenden Zusammenhang adversativ wiedergegeben werden; das deutsche Präsens vermittelt die gegenwärtig zugeschriebene Haltung natürlich.
- source_word: מַה יָדַע אֵל
  choice: Was weiß Gott?
  rationale: מַה leitet die direkte Frage ein, יָדַע bezeichnet hier Wissen, und אֵל wird idiomatisch mit »Gott« wiedergegeben.
- source_word: הַבְעַד
  choice: durch … hindurch
  rationale: Die Präposition bezeichnet hier ein dazwischenliegendes Hindernis; die zweiteilige deutsche Wendung macht diese räumliche Vorstellung deutlich.
- source_word: עֲרָפֶל
  choice: Dunkel
  rationale: Das Substantiv kann dichtes Dunkel, Dunkelheit oder eine dunkle Wolke bezeichnen. »Dunkel« ist natürlich und bewahrt die Bildhaftigkeit, während Alternativen in der Fußnote genannt werden.
- source_word: יִשְׁפּוֹט
  choice: Kann er … richten?
  rationale: Der Imperfekt steht in einer rhetorischen Frage. Die Wiedergabe mit »kann« bringt den im Kontext naheliegenden Zweifel an Gottes wirksamem Richten zum Ausdruck, ohne die grammatisch mögliche präsentische Lesart zu verschweigen.
theological_decisions:
- issue: Ob יִשְׁפּוֹט eine Fähigkeit oder schlicht gegenwärtiges beziehungsweise künftiges Handeln bezeichnet
  choice: Kann er durch das Dunkel hindurch richten?
  alternative: Richtet er durch das Dunkel hindurch? / Wird er durch das Dunkel hindurch richten?
  rationale: Elifas gibt eine Haltung wieder, nach der das Dunkel Gottes Wahrnehmung und Richten behindere. Die Fähigkeitsfrage passt zum rhetorischen Zusammenhang; die offene Aspektbedeutung des hebräischen Imperfekts wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und rhetorisch zugespitzt. Beide Fußnotenmarker stehen im Haupttext; Marker [a] folgt der fraglichen Verbform, Marker [b] dem gesamten Zitat, dessen Bildwort er erläutert.
