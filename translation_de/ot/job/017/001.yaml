  text: My spirit is broken[a]; my days are extinguished[b]; graves await me.
translation:
  language: de
  text: Mein Geist ist gebrochen[a], meine Tage sind erloschen[b]; Gräber warten auf mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Atem“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Meine Tage sind ausgelöscht.“ Das Verb beschreibt wahrscheinlich bildhaft, wie etwas gelöscht wird oder erlischt.'
