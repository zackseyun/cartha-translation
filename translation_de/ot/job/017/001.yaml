lexical_decisions:
- source_word: רוּחִי
  choice: mein Geist
  rationale: רוּחַ kann „Geist“ oder „Atem“ bezeichnen. Im Klagezusammenhang gibt „mein Geist“ Hiobs inneres Zerbrochensein natürlich wieder; die körperliche Bedeutung „mein Atem“ bleibt als Fußnote erhalten.
- source_word: חֻבָּלָה
  choice: ist gebrochen
  rationale: Die Passivform bezeichnet Schädigung, Verderben oder Zerstörung. „Ist gebrochen“ ist im Deutschen idiomatisch und bewahrt den eindringlichen Klageton, ohne die Art der Schädigung näher festzulegen.
- source_word: יָמַי
  choice: meine Tage
  rationale: Die wörtliche possessive Mehrzahl bezeichnet die verbleibende Lebenszeit Hiobs.
- source_word: נִזְעָכוּ
  choice: sind erloschen
  rationale: Das Verb vermittelt das Bild des Löschens oder Erlöschens. „Sind erloschen“ bewahrt die Metapher eines ausgehenden Lichts beziehungsweise Lebens.
- source_word: קְבָרִים
  choice: Gräber
  rationale: Die hebräische Mehrzahl wird beibehalten, statt sie zum kollektiven Singular „das Grab“ abzuflachen.
- source_word: לִי
  choice: warten auf mich
  rationale: לִי bedeutet wörtlich „für mich“ oder „mir“. Im Zusammenhang gibt „warten auf mich“ natürlich wieder, dass Hiob nur noch Gräber vor sich sieht, ohne den Grundgedanken zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Dreigliederung der hebräischen Klage wird bewahrt; das abschließende „warten auf mich“ gibt die idiomatische Bedeutung von לִי wieder.
