translation:
  language: de
  text: Wer Freunde für einen Anteil verrät,[a] dessen Kindern werden die Augen versagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um eines Anteils willen“, „um Gewinnes willen“; nach einer anderen Deutung: „mit Schmeichelei“. Die hebräische Wendung ist schwierig und kann auf die eigennützige Behandlung von Freunden zielen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֵלֶק
  choice: um eines Anteils willen
  rationale: חֵלֶק bezeichnet grundsätzlich einen Anteil oder Teil. Die Formulierung bleibt nahe am Hebräischen und deutet den persönlichen Vorteil an, ohne den im Text nicht ausdrücklich genannten Begriff „Beute“ in den Haupttext aufzunehmen.
- source_word: יַגִּיד
  choice: verrät
  rationale: Der Hifil von נגד bedeutet zunächst „mitteilen, bekannt machen“. Im Zusammenhang mit Freunden und einem erhofften Anteil liegt ein nachteiliges Preisgeben nahe; „verrät“ gibt diese kontextuelle Stoßrichtung natürlich wieder, ohne einen besonderen Rechtsvorgang vorauszusetzen.
- source_word: רֵעִים
  choice: Freunde
  rationale: רֵעִים bezeichnet hier Freunde oder Gefährten. „Freunde“ macht die im Vers liegende zwischenmenschliche Treulosigkeit deutlich.
- source_word: וְעֵינֵי בָנָיו
  choice: und die Augen seiner Kinder
  rationale: Die Konstruktion wird eng am Hebräischen wiedergegeben. בנים kann je nach Kontext Söhne oder allgemein Kinder bezeichnen; hier ist „Kinder“ angemessen.
- source_word: תִּכְלֶנָה
  choice: werden verschmachten
  rationale: כלה kann „zu Ende gehen, schwinden, vergehen“ bedeuten. Bei Augen bezeichnet es bildhaft ein Versagen oder Vergehen; „verschmachten“ bewahrt diese poetische Offenheit besser als eine rein physiologische Festlegung.
theological_decisions:
- issue: Zusammenhang zwischen dem Verrat und dem Ergehen der Kinder
  choice: Die beiden Aussagen werden mit „und“ verbunden.
  alternative: Eine ausdrückliche Vergeltungsformel wie „dessen Kinder werden …“
  rationale: Das Hebräische setzt die Sätze lediglich koordinierend nebeneinander. Die Übersetzung vermeidet es deshalb, die Aussage ausdrücklich als göttliche Vergeltungsregel auszudeuten, obwohl ein solcher Zusammenhang mitschwingen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Satzfügung und die Dunkelheit des hebräischen Ausgangstextes werden bewahrt; interpretierende Zusätze wie „an der Beute“ stehen nicht im Haupttext.
