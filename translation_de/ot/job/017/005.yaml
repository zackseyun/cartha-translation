  source_fidelity: Die Übersetzung erfasst die wahrscheinlich gemeinte nachteilige Offenlegung bzw. den Verrat von Freunden um eines eigenen Anteils willen. Die schwierige Wendung לְחֵלֶק wird im Haupttext nicht überdeutet; die Varianten bleiben in der Anmerkung erhalten. Die Aussage über die Augen der Kinder wird zutreffend als Folgeaussage wiedergegeben, ohne eine ausdrückliche Vergeltungsinstanz hinzuzufügen.
  naturalness: „Er“ ist in einem einzeln zitierten Vers ohne klaren deutschen Bezug etwas unvermittelt. Eine generische Wer-dessen-Konstruktion gibt den im Hebräischen impliziten Bezug zwischen dem Handelnden und „seinen Kindern“ idiomatischer wieder. „Den Augen versagen“ ist im modernen Standarddeutsch eine natürliche, zugleich bildhafte Wiedergabe von תכלנה bei „Augen“.
  terminology: „Freunde“ ist passend für רֵעִים; „Anteil“ bewahrt den Grundsinn von חֵלֶק. „Verrät“ ist als kontextuelle Zuspitzung von יַגִּיד vertretbar, sollte wegen der textlichen Schwierigkeit durch die zurückhaltende Fußnote begleitet bleiben.
