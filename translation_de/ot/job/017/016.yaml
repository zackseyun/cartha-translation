    reason: alternative_reading
lexical_decisions:
- source_word: בַּדֵּי
  choice: Riegeln
  rationale: Im Zusammenhang mit dem Totenreich bezeichnet das Wort am ehesten Riegel oder Sperrbalken. Das bewahrt das poetische Bild eines verschlossenen, gefängnisartigen Totenreichs; die Bedeutung „Teile“ bleibt als lexikalische Möglichkeit in der Fußnote erhalten.
- source_word: שְׁאֹל
  choice: Totenreichs
  rationale: „Totenreich“ gibt den althebräischen Begriff in verständlichem modernem Deutsch wieder, ohne ihn auf ein einzelnes Grab oder auf eine spätere Vorstellung von Hölle einzuengen.
- source_word: תֵּרַדְנָה
  choice: Fahren sie hinab
  rationale: Die feminine Pluralform verweist wahrscheinlich auf die zuvor erwähnten Hoffnungen. Die Frageform entspricht dem rhetorischen Zusammenhang; „hinabfahren“ ist im Deutschen eine würdige, natürliche Wendung für den Weg ins Totenreich.
- source_word: אִם
  choice: Werden
  rationale: אִם leitet hier wahrscheinlich eine zweite rhetorische Frage ein. Eine wörtliche Wiedergabe mit „wenn“ wäre im Deutschen missverständlich; „werden“ erhält den fragenden Sinn.
- source_word: יַחַד
  choice: gemeinsam
  rationale: Das Adverb bezeichnet hier das gemeinsame Geschick von Ijob und seinen Hoffnungen beziehungsweise der zuvor genannten Größe.
- source_word: עַל עָפָר
  choice: in den Staub
  rationale: Obwohl die Präposition gewöhnlich „auf/über“ bedeutet, verlangt die Bewegung des Hinabsteigens im natürlichen Deutschen „in den Staub“. Die Alternative „auf dem Staub“ wird mit der Lesart „ruhen“ in der Fußnote bewahrt.
- source_word: נָחַת
  choice: hinabsteigen
  rationale: Die schwierige Schlussform wird entsprechend der parallelen Bewegung in der ersten Vershälfte als Abstieg verstanden und verbal wiedergegeben. Die verbreitete Deutung als „ruhen“ bleibt ausdrücklich in einer Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Totenreich
  alternative: Scheol; Grab; Hölle
  rationale: „Totenreich“ bewahrt den Bezug auf den Bereich der Toten, bleibt für heutige Leser verständlich und vermeidet sowohl die Verengung auf das Grab als auch die unbelegte Gleichsetzung mit der Hölle.
- issue: Bezugswort des femininen Plurals תֵּרַדְנָה
  choice: Das Pronomen „sie“ bleibt ohne erläuternden Zusatz stehen.
  alternative: Ausdrückliche Ergänzung „meine Hoffnungen“
  rationale: Der Kontext legt einen Rückbezug auf Ijobs Hoffnungen nahe, doch der hebräische Vers nennt das Bezugswort nicht erneut. Die Übersetzung bewahrt diese grammatische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Zweigliedrigkeit. „Totenreich“ ist verständlicher als eine unkommentierte Transliteration „Scheol“. Die ungewöhnliche Bildsprache der Riegel und die Unsicherheit der Schlusszeile werden nicht geglättet, sondern im Text beziehungsweise in den Fußnoten bewahrt.
