  text: Steigen sie hinab zu den Riegeln des Totenreichs? Werden wir gemeinsam im Staub ruhen?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu den Teilen des Totenreichs«; das hebräische Wort kann auch »Riegel« oder »Sperrbalken« bedeuten. Das Bild kann an die verschlossenen Tore des Totenreichs erinnern.'
