source:
  edition: WLC
  text: וְ֭/אַיֵּה אֵפ֣וֹ תִקְוָתִ֑/י וְ֝/תִקְוָתִ֗/י מִ֣י יְשׁוּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/015.yaml
  text: And where[a], then, is my hope? And my hope—who can see it?
translation:
  language: de
  text: Und wo ist dann meine Hoffnung? Und meine Hoffnung – wer wird sie sehen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer kann sie sehen?“ Das hebräische Verb kann auch mit „erblicken“ oder „schauen“ wiedergegeben werden; die Verbform lässt sich sowohl futurisch („wird“) als auch modal („kann“) verstehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיֵּה
  choice: Und wo
  rationale: אַיֵּה ist eine Ortsfrage („wo?“); das vorangestellte וְ führt Ijobs Klage weiter und wird daher mit „Und“ wiedergegeben.
- source_word: אֵפוֹ
  choice: dann
  rationale: אֵפוֹ verstärkt die Frage beziehungsweise verleiht ihr folgernden Nachdruck. „dann“ ist im Deutschen natürlich und wahrt diese Funktion.
- source_word: תִקְוָתִי
  choice: meine Hoffnung
  rationale: תִּקְוָה bezeichnet Hoffnung oder Erwartung; „Hoffnung“ passt hier am natürlichsten zu Ijobs Klage.
- source_word: וְתִקְוָתִי
  choice: Und meine Hoffnung
  rationale: Die Wiederholung des Substantivs im Hebräischen bleibt wegen ihrer Betonung und poetischen Wirkung erhalten.
- source_word: מִי
  choice: wer
  rationale: Das gewöhnliche Fragepronomen leitet die zweite Frage ein.
- source_word: יְשׁוּרֶנָּה
  choice: wird sie sehen
  rationale: שׁור bedeutet „sehen, erblicken, schauen“. Das Imperfekt wird als Zukunft wiedergegeben; das feminine Suffix bezieht sich auf תִּקְוָה („Hoffnung“), daher „sie“.
theological_decisions:
- issue: Zeitliche oder modale Deutung von יְשׁוּרֶנָּה
  choice: wer wird sie sehen?
  alternative: wer kann sie sehen?
  rationale: Das hebräische Imperfekt lässt sowohl eine futurische als auch eine modale Wiedergabe zu. Der Haupttext erhält die formal naheliegende Zukunftsform; die modale Lesart wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „meine Hoffnung“ und die beiden Fragen bewahren die knappe poetische Eindringlichkeit des Hebräischen.
