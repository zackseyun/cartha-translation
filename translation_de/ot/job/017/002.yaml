base_translation:
  language: en
  yaml_path: translation/ot/job/017/002.yaml
  text: Surely mockers are with me[b][a], and my eye lodges on their provocation.
translation:
  language: de
  text: Gewiss, Spötter sind bei mir[a], und bei ihren Provokationen verweilt mein Auge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Betrüger sind bei mir«; das hebräische Wort kann täuschende oder spöttische Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Ausdruck ist schwierig. Oder: »bei ihrer Widerspenstigkeit« oder »bei ihrer Bitterkeit«; er kann provozierendes, rebellisches oder bitteres Verhalten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Gewiss
  rationale: Die Verbindung wird hier als bekräftigende Schwurformel verstanden, nicht als Bedingungssatz. »Gewiss« gibt diese emphatische Aussage im Deutschen natürlich wieder.
- source_word: הֲתֻלִים
  choice: Spötter
  rationale: Das Substantiv bezeichnet Menschen, die täuschen oder verspotten. Im Zusammenhang mit den verletzenden Reden von Hiobs Gefährten passt »Spötter« am besten; die mögliche Bedeutung »Betrüger« bleibt in einer Fußnote erhalten.
- source_word: עִמָּדִי
  choice: sind bei mir
  rationale: Die Präposition mit Suffix bezeichnet die unmittelbare Gegenwart bei Hiob. »Bei mir« ist dafür eine natürliche und genaue deutsche Wiedergabe.
- source_word: וּבְהַמְּרוֹתָם
  choice: auf ihrem aufrührerischen Verhalten
  rationale: Die schwierige Form kann provozierendes, widerspenstiges, rebellisches oder bitteres Verhalten bezeichnen. »Aufrührerisches Verhalten« bewahrt den Widerstandsaspekt, ohne ausdrücklich eine Rebellion gegen Gott festzulegen.
- source_word: תָּלַן
  choice: ruht
  rationale: Das Verb bedeutet wörtlich »übernachten, Herberge nehmen« und beschreibt hier bildhaft das anhaltende Verweilen des Auges. »Ruht« bewahrt im Deutschen etwas von diesem Bild und klingt zugleich natürlich.
- source_word: עֵינִי
  choice: mein Auge
  rationale: Der hebräische Text verwendet den Singular. Dieser lässt sich auch im Deutschen beibehalten.
theological_decisions:
- issue: Bezug des aufrührerischen Verhaltens
  choice: Die Formulierung bezeichnet das Verhalten der Spötter, ohne dessen letztliches Objekt zu bestimmen.
  alternative: »ihre Rebellion« könnte ausdrücklich als Rebellion gegen Gott verstanden werden.
  rationale: Der hebräische Ausdruck benennt widerspenstiges oder provozierendes Verhalten, legt hier aber nicht eindeutig fest, gegen wen es gerichtet ist. Die Übersetzung soll diese Offenheit bewahren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bekräftigende Eröffnung und der Singular »mein Auge« bleiben erhalten. Die ungewöhnliche Bildsprache des verweilenden Auges wird mit »ruht« lesbar wiedergegeben; die erhebliche lexikalische Unsicherheit im zweiten Halbvers wird durch die Fußnote offengelegt.
