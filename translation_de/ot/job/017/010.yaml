base_translation:
  language: en
  yaml_path: translation/ot/job/017/010.yaml
  text: But all of you[a], come back now, and come; I will not find a wise man among you.
translation:
  language: de
  text: Doch ihr alle, kehrt zurück und kommt doch! Ich werde unter euch keinen Weisen finden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kehrt um und kommt doch!“ Das Hebräische ist eine nachdrückliche Aufforderung; wahrscheinlich fordert Hiob seine Freunde heraus, ihre Argumente noch einmal vorzubringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Doch
  rationale: Kennzeichnet einen starken Gegensatz und klingt im Deutschen zugleich natürlich und würdevoll.
- source_word: כֻּלָּם
  choice: ihr alle
  rationale: Die folgenden Verbformen stehen in der zweiten Person maskulin Plural; Hiob redet seine Gesprächspartner direkt an.
- source_word: תָּשֻׁבוּ
  choice: kehrt … zurück
  rationale: Die Form von שוב hat hier auffordernden Charakter und fordert die Freunde wahrscheinlich heraus, erneut mit ihren Argumenten anzutreten.
- source_word: וּבֹאוּ נָא
  choice: und kommt her
  rationale: בוא mit נָא bildet hier eine nachdrückliche Aufforderung. „Kommt her“ bewahrt die Bewegungsvorstellung, ohne den Ton als höfliche Bitte abzuschwächen; „nur“ gibt die auffordernde Nuance von נָא im Satz wieder.
- source_word: וְלֹא אֶמְצָא
  choice: Ich werde … nicht finden
  rationale: Der Imperfekt bezeichnet hier plausibel das Ergebnis der vorausgehenden Aufforderung, ohne eine Unfähigkeit Hiobs zu behaupten.
- source_word: בָכֶם
  choice: unter euch
  rationale: Die Präposition bezeichnet hier die Zugehörigkeit beziehungsweise den Ort innerhalb der angesprochenen Gruppe.
- source_word: חָכָם
  choice: keinen Weisen
  rationale: Das maskuline Singularadjektiv wird substantivisch gebraucht und bezieht sich im Kontext auf Hiobs männliche Gesprächspartner.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von חָכָם
  choice: keinen Weisen
  alternative: keinen weisen Menschen / niemanden, der weise ist
  rationale: Die hebräische Form ist maskulin Singular und bezeichnet im unmittelbaren Zusammenhang Hiobs männliche Gesprächspartner. Die gewählte Form erhält diese grammatische und situative Bestimmtheit, ohne zusätzliche Lehraussagen einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Streitton. Die Wiederholung der beiden Bewegungsverben bleibt erhalten; die etwas ungewöhnliche Formulierung spiegelt die pointierte hebräische Aufforderung.
