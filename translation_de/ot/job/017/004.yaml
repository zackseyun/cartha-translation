id: JOB.17.4
reference: Job 17:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי לִ֭בָּ/ם צָפַ֣נְתָּ מִּ/שָּׂ֑כֶל עַל כֵּ֝֗ן לֹ֣א תְרֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/004.yaml
  text: For you have hidden their heart from understanding[b][a]; therefore you will not exalt them.
translation:
  language: de
  text: Denn du hast ihr Herz der Einsicht verschlossen[a]; darum wirst du sie nicht erhöhen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »du hast ihr Herz vor Einsicht verborgen«. »Herz« bezeichnet im Hebräischen auch Verstand, Urteilsvermögen und das innere Selbst.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »du wirst sie nicht emporheben«; im Zusammenhang möglicherweise: »du wirst sie nicht triumphieren lassen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Partikel leitet die Begründung für die folgende Aussage ein und fügt sich natürlich in den poetischen Gedankengang ein.
- source_word: לִבָּם
  choice: ihr Herz
  rationale: Das hebräische »Herz« bezeichnet häufig das innere Vermögen zu denken, zu urteilen und zu wollen; die bildhafte Ausdrucksweise bleibt erhalten.
- source_word: צָפַנְתָּ מִשָּׂכֶל
  choice: du hast ihr Herz der Einsicht verschlossen
  rationale: צפן bedeutet verbergen oder vorenthalten, und מִן bezeichnet hier Trennung bzw. Entzug. Die deutsche Wendung gibt sinngemäß wieder, dass ihnen Einsicht unzugänglich gemacht wurde, ohne das Herz selbst räumlich »vor« der Einsicht verborgen erscheinen zu lassen.
- source_word: עַל כֵּן
  choice: darum
  rationale: Die übliche folgernde Verbindung gibt den Zusammenhang zwischen Ursache und Konsequenz knapp wieder.
- source_word: לֹא תְרֹמֵם
  choice: du wirst sie nicht erhöhen
  rationale: Die Form von רום trägt das Bild des Erhöhens oder Emporhebens. »Erhöhen« wahrt dieses Bild und lässt offen, ob Ansehen, Stellung oder Triumph gemeint ist.
theological_decisions:
- issue: Bezug der Pluralsuffixe »ihr« und »sie«
  choice: Die unbestimmten Pronomen bleiben erhalten; Hiob redet Gott an und spricht von einer dritten Gruppe.
  alternative: Die Bezugsgruppe ausdrücklich als Hiobs Gegner oder deren Verbündete benennen.
  rationale: Der hebräische Vers identifiziert die Gruppe nicht ausdrücklich. Eine nähere Bestimmung würde eine kontextuelle Deutung in den Text eintragen.
- issue: Art des göttlichen Handelns am Erkenntnisvermögen
  choice: 'Direkte Anrede: »du hast … verschlossen«'
  alternative: Abgeschwächt als bloßes Zulassen oder als selbstverschuldete Unverständigkeit formulieren.
  rationale: Das hebräische Verb steht aktiv in der zweiten Person Singular und schreibt Gott die Handlung unmittelbar zu; diese theologische Spannung darf nicht aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelität und die direkte Gottesrede bleiben gewahrt. »Einsicht« ist allgemein verständlich und trifft den Gedanken geistiger Urteilskraft; »erhöhen« erhält die Mehrdeutigkeit des hebräischen Bildes.
