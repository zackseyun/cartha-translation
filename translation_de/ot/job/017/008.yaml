base_translation:
  language: en
  yaml_path: translation/ot/job/017/008.yaml
  text: The upright are appalled at this[a], and the innocent stirs himself up against the godless.
translation:
  language: de
  text: Die Aufrichtigen sind darüber entsetzt, und der Unschuldige erhebt sich gegen den Gottlosen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen den Heuchler“. Das hebräische Wort kann einen gottlosen, ruchlosen oder irreligiösen Menschen bezeichnen und wird traditionell mitunter als „Heuchler“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: sind entsetzt
  rationale: Das Qal von שׁמם bezeichnet hier bestürztes Entsetzen; „sind entsetzt“ gibt die emotionale Stärke im Deutschen natürlich wieder.
- source_word: יְשָׁרִים
  choice: die Aufrichtigen
  rationale: Das substantivierte Pluraladjektiv bezeichnet Menschen von moralischer Geradheit; „die Aufrichtigen“ ist knapp und idiomatisch.
- source_word: עַל זֹאת
  choice: darüber
  rationale: עַל mit זֹאת bezeichnet hier den Anlass der Reaktion. „darüber“ ist im Deutschen die natürliche Verbindung mit „entsetzt sein“.
- source_word: נָקִי
  choice: der Unschuldige
  rationale: Das Wort bezeichnet einen von Schuld Freien; die substantivische Einzahl des Hebräischen bleibt erhalten.
- source_word: יִתְעֹרָר
  choice: lehnt sich … auf
  rationale: Die reflexive Verbform beschreibt ein Sich-Aufraffen zu Widerstand. „lehnt sich gegen … auf“ bewahrt sowohl die Eigenaktivität als auch die oppositionelle Stoßrichtung.
- source_word: חָנֵף
  choice: der Gottlose
  rationale: חָנֵף bezeichnet hier allgemein einen ruchlosen, irreligiösen oder gottlosen Menschen; „Gottloser“ wahrt diese ethisch-religiöse Breite besser als das engere „Heuchler“.
- source_word: עַל חָנֵף
  choice: gegen den Gottlosen
  rationale: Bei dem Verb des Sich-Aufraffens ist עַל adversativ zu verstehen und bezeichnet die Person, gegen die sich der Widerstand richtet.
theological_decisions:
- issue: Wiedergabe von חָנֵף
  choice: der Gottlose
  alternative: der Heuchler
  rationale: Der Zusammenhang stellt Aufrichtige und Unschuldige einem irreligiösen beziehungsweise ruchlosen Menschen gegenüber. „Gottloser“ erhält diesen moralisch-religiösen Gegensatz, ohne den Sinn auf Unaufrichtigkeit zu verengen.
- issue: Aktivität des Unschuldigen in יִתְעֹרָר
  choice: lehnt sich … auf
  alternative: wird aufgebracht
  rationale: Die reflexiv-intensive Form legt nahe, dass der Unschuldige selbst zum Widerstand aktiv wird. Eine rein passive Wiedergabe würde diese Spannung abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen substantivierten Personenbezeichnungen und der Singular in der zweiten Vershälfte wurden bewahrt. Die Formulierung „lehnt sich … auf“ ist verständlich und bildet die reflexive, widerständige Bewegung des hebräischen Verbs ab.
