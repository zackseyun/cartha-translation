base_translation:
  language: en
  yaml_path: translation/ot/job/017/006.yaml
  text: He has made me a byword among the peoples[b][a], and I have become one before whom people spit.
translation:
  language: de
  text: 'Er hat mich zum Spottwort bei den Völkern gemacht[a],

    und ich bin zu einem geworden, den man offen anspuckt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu einem Sprichwort bei den Völkern«. Gemeint ist wahrscheinlich ein sprichwörtliches Beispiel, das dem Spott preisgegeben ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »und zum Spucken vor Gesichtern bin ich geworden«. Das seltene hebräische Wort bezeichnet wahrscheinlich das Anspucken oder einen Gegenstand des Anspuckens als Ausdruck offener Verachtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצִּגַנִי
  choice: Er hat mich ... gemacht
  rationale: Die Hifil-Form mit Suffix der 1. Person Singular bezeichnet ein verursachtes Hinstellen oder öffentliches Ausstellen. Im Deutschen gibt „hat mich ... gemacht“ die prädikative Konstruktion natürlich wieder.
- source_word: לִמְשֹׁל
  choice: zum Spottwort
  rationale: Das ungewöhnliche Substantiv beziehungsweise die substantivisch verstandene Form bezeichnet hier wahrscheinlich ein sprichwörtliches Beispiel, das dem öffentlichen Spott dient. „Spottwort“ bewahrt sowohl den Wortcharakter als auch die Verachtung im Kontext.
- source_word: עַמִּים
  choice: unter den Völkern
  rationale: Der Plural עַמִּים wird als „Völker“ erhalten; „unter“ gibt die öffentliche Verbreitung innerhalb verschiedener Völker idiomatisch wieder.
- source_word: וְתֹפֶת
  choice: einer ..., dem man ... spuckt
  rationale: Das seltene Wort bezeichnet wahrscheinlich „Spucken“, „Speichel“ oder einen Gegenstand des Anspuckens. Die personale Umschreibung macht das Bild auf Deutsch verständlich, ohne es zum allgemeinen Begriff „Schande“ abzuschwächen.
- source_word: לְפָנִים
  choice: ins Gesicht
  rationale: Wörtlich steht „vor/zu Gesichtern“. Im Zusammenhang mit dem Spucken bezeichnet die Wendung offene, unmittelbar gegen Hiob gerichtete Verachtung; „ins Gesicht“ ist die natürliche deutsche Entsprechung.
- source_word: אֶהְיֶה
  choice: ich bin ... geworden
  rationale: Obwohl die Form morphologisch ein Imperfekt ist, beschreibt sie im poetischen Zusammenhang plausibel den eingetretenen und fortdauernden Zustand. Das Perfekt „bin geworden“ entspricht außerdem dem Parallelismus mit „hat mich ... gemacht“.
theological_decisions:
- issue: Unausgesprochenes Subjekt von וְהִצִּגַנִי
  choice: „Er“ ohne ausdrückliche Identifizierung
  alternative: „Gott“
  rationale: Der Zusammenhang legt Gott als Handelnden nahe, doch der hebräische Vers nennt ihn nicht ausdrücklich. Das Pronomen erhält diese formale Zurückhaltung.
translation_notes:
  register: Moderne, würdige Standardsprache mit verständlicher Bildsprache. „Spottwort“ ist knapp und poetisch; die zweite Zeile wird wegen der im Deutschen sonst undurchsichtigen wörtlichen Konstruktion maßvoll idiomatisiert. Beide Fußnotenmarker stehen im Haupttext.
