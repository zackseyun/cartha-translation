base_translation:
  language: en
  yaml_path: translation/ot/job/017/009.yaml
  text: Yet the righteous holds fast to his way[a], and the one with clean hands grows stronger.
translation:
  language: de
  text: Doch der Gerechte hält an seinem Weg fest, und wer reine Hände hat, gewinnt an Kraft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fügt Kraft hinzu“; möglich ist auch: „wird stärker“ oder, enger gefasst, „gewinnt an Mut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאחֵז
  choice: Doch … hält … fest
  rationale: Das einfache Bindewort kann mit „und“ wiedergegeben werden; nach der düsteren Klage Hiobs liegt hier jedoch ein leicht gegensätzlicher Sinn nahe. אחז bezeichnet ein Ergreifen oder Festhalten und drückt hier Beharrlichkeit aus.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivisch gebrauchte Adjektiv steht im repräsentativen Singular. „Der Gerechte“ bewahrt diese Form, ohne ein zusätzliches Geschlechtssubstantiv einzuführen.
- source_word: דַּרְכּוֹ
  choice: seinem Weg
  rationale: דֶּרֶךְ kann Weg, Pfad oder Lebensführung bezeichnen. „Weg“ erhält sowohl das konkrete Bild als auch den übertragenen Sinn.
- source_word: וּטֳהָר יָדַיִם
  choice: wer reine Hände hat
  rationale: Die Wendung bezeichnet Unschuld oder moralische Reinheit. Die deutsche Formulierung bleibt natürlich und bewahrt zugleich das anschauliche Bild der Hände.
- source_word: יֹסִיף אֹמֶץ
  choice: gewinnt an Kraft
  rationale: Wörtlich bedeutet die Verbindung „fügt Kraft hinzu“. „Gewinnt an Kraft“ gibt den Zuwachs idiomatisch wieder, ohne אֹמֶץ auf den engeren Sinn „Mut“ festzulegen.
