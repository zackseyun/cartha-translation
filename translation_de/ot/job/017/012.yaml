  source_fidelity: 'Die hebräische Aussage enthält kein ausdrückliches Verb des Sagens. Die zweite, knapp formulierte Aussage lautet wörtlich etwa: „Licht ist nahe vor/angesichts der Finsternis.“ Die Übertragung von לַיְלָה לְיוֹם יָשִׂימוּ als „Sie machen die Nacht zum Tag“ ist treffend. „angesichts der Finsternis“ gibt מִפְּנֵי offen und bildhaft wieder.'
