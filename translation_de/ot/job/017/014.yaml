  text: I call to the pit, ‘You are my father,’ and to the worm, ‘My mother and my sister.’
translation:
  language: de
  text: 'Zur Grube rufe ich: »Du bist mein Vater!«, und zum Wurm: »Meine Mutter und meine Schwester!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁחַת
  choice: Grab
  rationale: Das Wort bezeichnet hier die Grube bzw. das Grab als Bereich des Todes. »Grab« ist im Deutschen natürlich und bewahrt den poetischen Parallelismus mit dem Wurm.
- source_word: קָרָאתִי
  choice: rufe ich
  rationale: Das Verb קרא bedeutet hier »rufen/anrufen«; die Präsensform gibt Hiobs gegenwärtige, bildhafte Rede natürlich wieder.
- source_word: רִמָּה
  choice: Wurm
  rationale: Gemeint ist der Verwesungswurm. Die knappe Wiedergabe »Wurm« entspricht der poetischen Personifizierung und legt die Bildsprache nicht unnötig aus.
theological_decisions:
- issue: Personifizierung von Grab und Wurm als nächste Angehörige
  choice: Die direkte Anrede und die familiären Bezeichnungen bleiben unverändert erhalten.
  alternative: Die Metapher erklärend als Erwartung des Todes und der Verwesung wiedergeben.
  rationale: Der hebräische Text formuliert bewusst drastisch und poetisch. Eine erklärende Auflösung würde die theologische und emotionale Spannung von Hiobs Todesnähe abschwächen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Struktur. Die vorangestellten Adressaten »Zum Grab« und »zum Wurm« spiegeln die hebräische Parallelität; Ausrufezeichen markieren die eindringliche direkte Anrede, ohne zusätzliche Deutung.
