  yaml_path: translation/ot/job/017/007.yaml
  text: My eye has grown dim from grief[b][a], and all my members are like a shadow.
translation:
  language: de
  text: Mein Auge ist vor Kummer[a] trübe geworden, und alle meine Glieder[b] sind wie ein Schatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor Zorn«, »vor Verdruss« oder »vor Gram«. Das hebräische Wort kann verschiedene Formen innerer Erregung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »meine Gestalt«, »meine Körperteile« oder »mein Körperbau«. Die genaue Bedeutung des seltenen hebräischen Ausdrucks ist unsicher; wahrscheinlich meint er Hiobs körperliche Gestalt oder seine Glieder insgesamt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכַהּ
  choice: ist trübe geworden
  rationale: Das Verb כהה bezeichnet ein Trüb-, Matt- oder Schwachwerden. Die Formulierung bewahrt sowohl den Zustandswechsel als auch das Bild nachlassender Sehkraft.
- source_word: מִכַּעַשׂ
  choice: vor Kummer
  rationale: כַּעַשׂ kann Kummer, Verdruss, Erregung oder Zorn bezeichnen. Im Zusammenhang von Hiobs Klage passt »Kummer« natürlich, ohne die anderen möglichen Nuancen zu leugnen.
- source_word: עֵינִי
  choice: Mein Auge
  rationale: Der hebräische Text steht im Singular. Auch im Deutschen kann »Auge« hier dichterisch für die Sehkraft stehen.
- source_word: וִיצֻרַי
  choice: meine Glieder
  rationale: Die seltene Form bezeichnet hier wahrscheinlich Hiobs körperliche Gestalt beziehungsweise deren einzelne Glieder. »Glieder« ist verständlich und passt zum vorausgehenden Auge; die lexikalische Unsicherheit wird in einer Fußnote erhalten.
- source_word: כַּצֵּל
  choice: wie ein Schatten
  rationale: Die wörtliche Bildsprache vermittelt Unscheinbarkeit, Kraftlosigkeit und Dahinschwinden, ohne diese Aspekte ausdeutend festzulegen.
- source_word: כֻּלָּם
  choice: alle
  rationale: Das maskuline Pluralpronomen bezieht sich gesammelt auf die zuvor genannten Glieder und wird im Deutschen knapp und idiomatisch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. Der Singular »mein Auge« und der Vergleich »wie ein Schatten« folgen bewusst eng dem Hebräischen; echte lexikalische Mehrdeutigkeit wird in den Fußnoten offengehalten.
