  text: Lay down[a], please, a pledge for me with yourself[b]; who else is there who would strike hands with me?
translation:
  language: de
  text: Tritt doch bei dir selbst für mich als Bürge ein[a]! Wer sonst würde mit mir einschlagen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stelle doch bei dir selbst eine Bürgschaft für mich.“ Das Hebräische verwendet Rechtssprache für das Stellen einer Sicherheit oder Bürgschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Wer ist es, der meine Hand einschlagen würde?“ Das Einschlagen der Hand war eine Geste zum Abschluss einer Bürgschaft oder verbindlichen Zusage.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׂימָה נָּא
  choice: Hinterlege doch
  rationale: Der Imperativ von שׂים bezeichnet hier im rechtlichen Zusammenhang das Setzen oder Hinterlegen einer Sicherheit; „doch“ gibt die bittende Kraft von נָּא natürlich wieder.
- source_word: עָרְבֵנִי
  choice: eine Bürgschaft für mich
  rationale: Die Form von ערב bezeichnet das Eintreten als Bürge beziehungsweise das Stellen einer Sicherheit zugunsten des Sprechers. Die nominale deutsche Wiedergabe verbindet sich natürlich mit „hinterlegen“.
- source_word: עִמָּךְ
  choice: bei dir selbst
  rationale: Die Form bedeutet wörtlich „bei/mit dir“. „Bei dir selbst“ bringt die auffällige Vorstellung zum Ausdruck, dass Gott die Sicherheit bei sich selbst stellen soll, ohne die Spannung aufzulösen.
- source_word: מִי הוּא
  choice: Wer sonst
  rationale: Die rhetorische Frage setzt voraus, dass kein anderer Bürge vorhanden ist. „Sonst“ macht diesen im Zusammenhang liegenden Kontrast in natürlichem Deutsch deutlich.
- source_word: לְיָדִי יִתָּקֵעַ
  choice: würde mir die Hand darauf geben
  rationale: Das hebräische Bild beschreibt das Einschlagen beziehungsweise Darreichen der Hand zum Abschluss einer Bürgschaft. Die deutsche Wendung bewahrt die konkrete Geste und macht zugleich ihren verbindlichen Sinn verständlich.
theological_decisions:
- issue: An Gott gerichtete rechtliche Metapher
  choice: Hiob bittet Gott, bei sich selbst eine Bürgschaft für ihn zu hinterlegen.
  alternative: Hiob bittet lediglich um irgendeinen Bürgen, ohne Gott als denjenigen anzusprechen, der selbst die Sicherheit stellt.
  rationale: עָרְבֵנִי עִמָּךְ verbindet die Bitte um Bürgschaft unmittelbar mit „bei dir“. Die Übersetzung erhält die ungewöhnliche und theologisch spannungsvolle Vorstellung, ohne sie systematisch zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Bildsprache bleibt erhalten; „Bürgschaft“ ist präzise und allgemein verständlich, während die Fußnoten die alternative verbale Fassung und die antike Handschlag-Geste erläutern.
