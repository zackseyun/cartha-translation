  source_fidelity: 'Die Übersetzung erfasst die rechtliche Bitte und die rhetorische Aussage, dass kein anderer als Gott als Bürge in Betracht kommt. „Hinterlege ... eine Bürgschaft“ ist jedoch im Deutschen sachlich und kollokativ ungenau: Hinterlegt wird eine Sicherheit bzw. ein Pfand, während eine Bürgschaft übernommen oder gestellt wird. Die imperativische Verbform עָרְבֵנִי wird klarer durch „tritt ... als Bürge ein“ wiedergegeben.'
