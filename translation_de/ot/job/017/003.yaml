  terminology: „Bürge“ und „Bürgschaft“ geben die juristische Metapher angemessen wieder. Die Fußnote zu der Handschlaggeste sollte die deutsche idiomatische Formulierung „mit mir einschlagen“ aufgreifen und die wörtliche Wendung vorsichtig erläutern.
