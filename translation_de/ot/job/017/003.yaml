    rationale: „An meine Hand schlagen“ ist als deutsches Wörtlichkeitszitat schwer verständlich. „Mit mir einschlagen“ ist die natürliche deutsche Entsprechung, während die Fußnote die hebräische Hand-Geste als Vertragszeichen erklären kann.
