  register: Moderne, würdige Klagesprache. Der Gedankenstrich macht die wahrscheinlich appositionelle Beziehung der schwierigen Schlusswendung zu „meine Pläne“ lesbar, ohne die syntaktische Offenheit durch ein zusätzliches Verb aufzulösen.
