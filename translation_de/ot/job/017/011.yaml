base_translation:
  language: en
  yaml_path: translation/ot/job/017/011.yaml
  text: My days have passed by; my plans are broken off[a], the desires of my heart.
translation:
  language: de
  text: Meine Tage sind vergangen; meine Pläne sind zerrissen – die Wünsche meines Herzens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die Besitzungen meines Herzens“, „was meinem Herzen kostbar war“ oder „die Erbteile meines Herzens“. Der hebräische Ausdruck ist selten und schwer zu deuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: meine Tage
  rationale: Die wörtliche und im Deutschen natürliche Wiedergabe bewahrt das hebräische Bild für die dahingehende Lebenszeit.
- source_word: עָבְרוּ
  choice: sind vergangen
  rationale: Das Perfekt bezeichnet die Tage als vorüber; „sind vergangen“ ist idiomatisch und wahrt den abgeschlossenen Aspekt.
- source_word: זִמֹּתַי
  choice: meine Pläne
  rationale: זִמָּה kann hier Absichten oder Vorhaben bezeichnen. „Pläne“ passt zum Klagezusammenhang und vermeidet den im Deutschen meist negativen Beiklang von „Machenschaften“.
- source_word: נִתְּקוּ
  choice: sind abgebrochen
  rationale: Das Nifal von נתק bezeichnet ein Abreißen, Abtrennen oder Abbrechen. Bei „Plänen“ gibt „sind abgebrochen“ den gewaltsamen Abbruch verständlich wieder, ohne eine Ursache hinzuzufügen.
- source_word: מוֹרָשֵׁי
  choice: die Wünsche
  rationale: Der seltene und schwierige Ausdruck kann Besitz, Erbteil oder das vom Herzen festgehaltene Kostbare bezeichnen. Im Parallelismus mit den Plänen ist „die Wünsche“ eine sinnvolle kontextuelle Wiedergabe; die konkrete Besitzmetaphorik bleibt in der Fußnote sichtbar.
- source_word: לְבָבִי
  choice: meines Herzens
  rationale: „Herz“ bewahrt die hebräische Vorstellung vom inneren Zentrum des Denkens, Wollens und Verlangens.
theological_decisions: []
