  text: אִם אֲ֭קַוֶּה שְׁא֣וֹל בֵּיתִ֑/י בַּ֝/חֹ֗שֶׁךְ רִפַּ֥דְתִּי יְצוּעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/013.yaml
  text: If I hope for Sheol as my house[a], if I spread my bed in the darkness,
translation:
  language: de
  text: Wenn ich auf den Scheol[a] als mein Haus hoffe und in der Finsternis mein Lager ausbreite,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Grab“ oder „das Totenreich“. Der hebräische Ausdruck „Scheol“ bezeichnet den Bereich der Toten und meint mehr als nur eine Grabstätte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Leitet eine bedingte oder erwogene Möglichkeit ein. „Wenn“ bewahrt diese Offenheit, ohne die Aussage zu einer sicheren zeitlichen Erwartung umzudeuten.
- source_word: אֲקַוֶּה
  choice: hoffe
  rationale: Das Verb קוה bezeichnet erwartungsvolles Warten oder Hoffen. „Hoffe“ erhält hier die auffällige Spannung, dass Ijob den Scheol als künftige Wohnstätte vor Augen hat.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration bewahrt den weiteren hebräischen Begriff für den Bereich der Toten und verengt ihn nicht auf ein einzelnes Grab.
- source_word: בֵּיתִי
  choice: als mein Haus
  rationale: Das im Hebräischen ohne Kopulaverb stehende Verhältnis von „Scheol“ und „mein Haus“ wird im Deutschen natürlich mit „als“ wiedergegeben.
- source_word: בַּחֹשֶׁךְ
  choice: in der Finsternis
  rationale: Gibt Präposition und Artikel wieder und bewahrt zugleich das düstere Bild des Todesbereichs.
- source_word: רִפַּדְתִּי
  choice: ausbreite
  rationale: Das Verb bezeichnet das Ausbreiten oder Herrichten einer Liegestatt. „Ausbreite“ hält das konkrete Bild fest.
- source_word: יְצוּעָי
  choice: mein Lager
  rationale: Bezeichnet eine Liegestatt. „Lager“ klingt im Deutschen natürlich mit „ausbreiten“ und wahrt das Bild vom Niederlegen zur Ruhe.
theological_decisions:
- issue: Deutende Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: das Grab; das Totenreich
  rationale: „Scheol“ bewahrt die begriffliche Weite des hebräischen Ausdrucks und vermeidet sowohl eine Verengung auf die Grabstätte als auch die Eintragung späterer Jenseitsvorstellungen.
- issue: Bedeutungsnuance von קוה angesichts des Todes
  choice: hoffe
  alternative: warte; erwarte
  rationale: Die Wiedergabe erhält die Spannung des hebräischen Verbs zwischen Hoffnung und erwartungsvollem Warten, statt Ijobs Haltung gegenüber dem Tod ausschließlich neutral zu formulieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzform und das konkrete Bild vom Haus und ausgebreiteten Lager bleiben erhalten; der Vers endet entsprechend dem fortlaufenden Satzbau mit einem Komma.
