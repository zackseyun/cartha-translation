base_translation:
  language: en
  yaml_path: translation/ot/job/038/017.yaml
  text: Have the gates of death been revealed to you[a], or have you seen the gates of deep darkness?
translation:
  language: de
  text: Sind dir die Tore des Todes enthüllt worden, und hast du die Tore der tiefen Finsternis[a] gesehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Todesschattens«. Das hebräische Wort kann auch tiefe Dunkelheit oder düstere Finsternis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/נִגְלוּ לְךָ
  choice: Haben sich dir ... enthüllt
  rationale: Die Fragepartikel mit dem Nifal Perfekt von גלה bildet eine rhetorische Frage. Die reflexive deutsche Form gibt den passiven Sinn idiomatisch wieder und bewahrt לְךָ als „dir“.
- source_word: שַׁעֲרֵי מָוֶת
  choice: die Tore des Todes
  rationale: Die Status-constructus-Verbindung wird direkt wiedergegeben; das konkrete Bild vom Zugang zum Totenreich bleibt erhalten.
- source_word: וְ/שַׁעֲרֵי
  choice: und ... die Tore
  rationale: Das hebräische וְ wird als „und“ bewahrt. Beide Satzglieder bilden eine parallele rhetorische Doppelfrage.
- source_word: צַלְמָוֶת
  choice: tiefste Finsternis
  rationale: Das Wort bezeichnet dichte, bedrohliche Dunkelheit und kann im Kontext an die Unterwelt erinnern. „Tiefste Finsternis“ ist im modernen Deutsch natürlich, ohne die Bedeutung ausdrücklich auf den Tod festzulegen.
- source_word: תִּרְאֶה
  choice: hast du ... gesehen
  rationale: Das Qal Imperfekt 2. Person Singular wird im Kontext der parallelen Erfahrungsfrage idiomatisch mit dem deutschen Perfekt wiedergegeben.
theological_decisions:
- issue: Bezug von צַלְמָוֶת auf Tod oder Dunkelheit
  choice: tiefste Finsternis
  alternative: Todesschatten
  rationale: Die Übersetzung hält die Unterweltsymbolik offen, legt den Ausdruck aber nicht enger als lexikalisch nötig auf den Tod fest.
translation_notes:
  register: Moderne, würdige poetische Sprache. Die parallele Struktur und die konkrete Bildwelt des Hebräischen bleiben erhalten; „tiefste Finsternis“ vermittelt die Intensität von צַלְמָוֶת verständlich.
