  - severity: low
    issue: „Haben sich dir ... enthüllt“ ist reflexiv statt klar passiv.
    rationale: 'Das hebräische Nifal ist hier passiv: Die Tore werden dem Angeredeten enthüllt. „Sind dir ... enthüllt worden“ bildet diese Richtung expliziter ab.'
