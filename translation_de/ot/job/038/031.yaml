base_translation:
  language: en
  yaml_path: translation/ot/job/038/031.yaml
  text: Can you bind the chains of the Pleiades[c][b][a], or loosen the cords of Orion?
translation:
  language: de
  text: Kannst du die Bande der Plejaden[b] knüpfen oder die Fesseln des Orion lösen?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: »Bänder«. Das seltene hebräische Wort bezeichnet wahrscheinlich Bindungen oder Verbindungen; die genaue Art ist unsicher.'
    reason: lexical_alternative
  - marker: c
    text: Das hier mit »Orion« wiedergegebene hebräische Wort kann auch »Narr« oder »Törichter« bedeuten; in diesem Zusammenhang bezeichnet es wahrscheinlich das Sternbild.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְקַשֵּׁר
  choice: Kannst du … knüpfen
  rationale: Die Fragepartikel mit dem Piel-Imperfekt 2. Person Singular bildet eine rhetorische Frage. »Knüpfen« passt im Deutschen natürlich zu »Bande« und bewahrt das Bild des Verbindens.
- source_word: מַעֲדַנּוֹת
  choice: die Bande
  rationale: Das seltene Wort bezeichnet hier wahrscheinlich Bindungen oder Bänder. »Bande« wahrt die konkrete, aber nicht sicher als metallene Ketten bestimmte Bildsprache und entspricht dem Parallelismus.
- source_word: כִּימָה
  choice: des Siebengestirns
  rationale: Der astronomische Name wird gewöhnlich mit den Plejaden identifiziert. »Siebengestirn« ist die geläufige traditionelle deutsche Bezeichnung; die Fußnote nennt die moderne Namensform.
- source_word: מֹשְׁכוֹת
  choice: die Fesseln
  rationale: Das Substantiv bezeichnet etwas zum Ziehen oder Festhalten, etwa Stricke oder Bande. »Fesseln« ergibt mit »lösen« eine natürliche deutsche Verbindung und erhält das Bild einer himmlischen Bindung.
- source_word: כְּסִיל
  choice: Orion
  rationale: Im astronomischen Zusammenhang und parallel zu כִּימָה ist sehr wahrscheinlich das Sternbild Orion gemeint, obwohl das gleichlautende gewöhnliche Wort »Tor« bedeuten kann.
- source_word: תְּפַתֵּחַ
  choice: lösen
  rationale: Das Verb bedeutet grundlegend »öffnen«; bei Fesseln oder Stricken ist »lösen« die idiomatische deutsche Wiedergabe und bildet den Gegenpol zu »knüpfen«.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der poetische Parallelismus zwischen Knüpfen und Lösen bleibt erhalten. Die seltenen Himmels- und Bindungsbegriffe werden nicht überpräzisiert; echte lexikalische Unsicherheiten stehen in den Fußnoten.
