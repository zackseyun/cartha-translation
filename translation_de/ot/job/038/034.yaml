source:
  edition: WLC
  text: הֲ/תָרִ֣ים לָ/עָ֣ב קוֹלֶ֑/ךָ וְֽ/שִׁפְעַת מַ֥יִם תְּכַסֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/034.yaml
  text: Can you raise your voice to the clouds[b][a], so that an abundance of water covers you?
translation:
  language: de
  text: Kannst du deine Stimme zu den Wolken[a] erheben, sodass dich eine Fülle von Wasser[b] bedeckt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu der Wolke“ beziehungsweise „zu der dichten Wolke“. Das hebräische Wort steht im Singular und kann eine dichte Regenwolke bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und eine Wasserflut bedeckt dich“. Der hebräische Ausdruck kann eine überströmende Wassermenge bezeichnen; die beiden Satzteile können auch nebengeordnet verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָרִים
  choice: Kannst du … erheben
  rationale: Die Fragepartikel mit dem Hifil von רוּם formuliert eine Frage nach Hiobs Fähigkeit. „Kannst du … erheben“ gibt den herausfordernden Frageton natürlich wieder.
- source_word: לָעָב
  choice: zu den Wolken
  rationale: עָב bezeichnet eine Wolke beziehungsweise eine dichte Regenwolke. Der deutsche kollektive Plural klingt in dieser Anrede natürlich; der Singular und die Bedeutungsnuance „dichte Wolke“ bleiben in der Fußnote erhalten.
- source_word: קוֹלֶךָ
  choice: deine Stimme
  rationale: קוֹל bezeichnet hier die menschliche Stimme, die zu den Wolken erhoben wird.
- source_word: וְשִׁפְעַת מַיִם
  choice: sodass … eine Fülle von Wasser
  rationale: שִׁפְעָה drückt Fülle, Überfluss oder ein Überströmen aus. „Eine Fülle von Wasser“ bewahrt den Mengenaspekt, ohne zwingend eine zerstörerische Überschwemmung anzunehmen; „sodass“ macht die naheliegende Folgebeziehung deutlich.
- source_word: תְּכַסֶּךָּ
  choice: dich … bedeckt
  rationale: Das Piel von כסה mit Suffix der 2. Person maskulin Singular bedeutet hier unmittelbar, dass das Wasser den Angeredeten bedeckt.
theological_decisions:
- issue: Verhältnis der beiden Satzteile
  choice: Der zweite Satzteil wird mit „sodass“ als beabsichtigte Folge des Rufens zu den Wolken wiedergegeben.
  alternative: 'Koordinierend: „und eine Wasserflut bedeckt dich“.'
  rationale: Im Zusammenhang der rhetorischen Fragen über die Herrschaft über das Wetter liegt eine Folgebeziehung nahe. Da das hebräische וְ auch eine bloße Verbindung zulässt, wird diese Alternative in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte rhetorische Frage und das Wetterbild bleiben erhalten; der kollektive Plural „Wolken“ dient der natürlichen deutschen Ausdrucksweise.
