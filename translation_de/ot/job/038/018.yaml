  yaml_path: translation/ot/job/038/018.yaml
  text: Have you comprehended the expanse of the earth? Tell me, if you know it all.
translation:
  language: de
  text: Hast du die Weiten der Erde erfasst? Sag es, wenn du sie vollständig kennst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְבֹּנַנְתָּ
  choice: hast du … erfasst
  rationale: Das Verb bezeichnet hier ein verstehendes Wahrnehmen oder gründliches Erfassen; „erfasst“ gibt sowohl die gedankliche als auch die erkundende Dimension natürlich wieder.
- source_word: רַחֲבֵי אָרֶץ
  choice: die Weiten der Erde
  rationale: Der Plural רַחֲבֵי bezeichnet die ausgedehnten Weiten bzw. die ganze Breite der Erde. „Weiten“ ist im Deutschen idiomatisch und bewahrt das räumliche Bild.
- source_word: הַגֵּד
  choice: Sag es
  rationale: Der Imperativ fordert Hiob heraus, sein angebliches Wissen darzulegen. Das ergänzte „es“ ergibt einen natürlichen deutschen Satz und nimmt den Inhalt der Frage auf.
- source_word: כֻּלָּהּ
  choice: sie ganz
  rationale: Das feminine Suffix bezieht sich grammatisch am ehesten auf אֶרֶץ, „Erde“. „Sie ganz“ bewahrt diesen Bezug und die Aussage umfassender Kenntnis.
theological_decisions:
- issue: Umfang und Gegenstand von Hiobs Wissen
  choice: „wenn du sie ganz kennst“ mit Bezug auf die Erde
  alternative: „wenn du das alles weißt“
  rationale: Das feminine Suffix in כֻּלָּהּ legt einen Rückbezug auf die feminine „Erde“ nahe. Die Übersetzung vermeidet eine zusätzliche theologische Deutung und bewahrt Gottes rhetorische Herausforderung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe rhetorische Frage und der herausfordernde Imperativ bleiben erhalten; keine Fußnote erforderlich.
