  text: מִי שָׁ֭ת בַּ/טֻּח֣וֹת חָכְמָ֑ה א֤וֹ מִֽי נָתַ֖ן לַ/שֶּׂ֣כְוִי בִינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/036.yaml
  text: Who has put wisdom in the inward parts[a], or who has given understanding to the mind?
translation:
  language: de
  text: Wer hat Weisheit ins Innere gelegt[a], oder wer hat dem Verstand Einsicht gegeben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Wer hat Weisheit in die verborgenen Bereiche gelegt, oder wer hat dem Hahn Einsicht gegeben?« Manche verstehen den zweiten Ausdruck als Bezeichnung für einen Vogel – traditionell den Hahn, bisweilen den Ibis – und nicht für den Verstand.'
    reason: Bewahrt die erhebliche lexikalische Unsicherheit beider seltenen Ausdrücke und die traditionsreiche Tierdeutung.
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Fragepronomen eröffnet Gottes rhetorische Frage.
- source_word: שָׁת
  choice: gelegt
  rationale: Gibt die Grundbedeutung »setzen/legen« wieder und klingt in der Verbindung »Weisheit ins Innere legen« natürlich.
- source_word: בַּטֻּחוֹת
  choice: ins Innere
  rationale: Der seltene und schwierige Ausdruck bezeichnet wahrscheinlich die verborgenen inneren Bereiche des Menschen. Die Wiedergabe bewahrt das körperlich-räumliche Bild, ohne es irreführend auf »Nieren« festzulegen.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und kontextgemäße Wiedergabe; sie steht parallel zu »Einsicht«.
- source_word: אוֹ
  choice: oder
  rationale: Verbindet die beiden parallelen Fragesätze als Disjunktion.
- source_word: נָתַן
  choice: gegeben
  rationale: Entspricht der gewöhnlichen Bedeutung des Verbs und bildet ein natürliches Gegenstück zu »gelegt«.
- source_word: לַשֶּׂכְוִי
  choice: dem Verstand
  rationale: Die Bedeutung des seltenen Substantivs ist umstritten. Der Parallelismus mit »ins Innere« sowie »Weisheit« und »Einsicht« spricht für ein inneres Erkenntnisvermögen; die alte Deutung als Vogel wird in der Fußnote bewahrt.
- source_word: בִינָה
  choice: Einsicht
  rationale: Bewahrt neben »Weisheit« den Aspekt des verständigen Erkennens und Unterscheidens.
theological_decisions:
- issue: Deutung zweier schwieriger Begriffe im Zusammenhang der Gottesrede
  choice: Der Vers spricht davon, dass Gott dem Inneren des Menschen Weisheit und dem Verstand Einsicht gibt.
  alternative: Der Vers kann von verborgenen Bereichen und von einem Vogel, traditionell dem Hahn, sprechen, dem Gott instinktive Erkenntnis gibt.
  rationale: Der poetische Parallelismus stützt die anthropologische Deutung, entscheidet die lexikalische Frage aber nicht zweifelsfrei. Deshalb wird die traditionsreiche Tierdeutung nicht ausgeschlossen, sondern ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe rhetorische Parallelstruktur des Hebräischen bleibt erhalten; die schwierigen Begriffe werden im Haupttext verständlich wiedergegeben, ohne die echte Mehrdeutigkeit in der Fußnote zu verschweigen.
