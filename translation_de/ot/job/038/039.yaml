base_translation:
  language: en
  yaml_path: translation/ot/job/038/039.yaml
  text: Do you hunt prey for the lioness[a], and satisfy the appetite of the young lions,
translation:
  language: de
  text: 'Jagst du für die Löwin Beute

    und stillst den Hunger der jungen Löwen?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתָצוּד
  choice: Jagst du
  rationale: Das Fragepräfix הֲ und das Qal-Imperfekt 2. Person maskulin Singular von צוד bilden eine rhetorische Frage an Hiob. „Jagst du“ gibt Handlung und Aspekt im Deutschen natürlich wieder.
- source_word: לְלָבִיא
  choice: für die Löwin
  rationale: לָבִיא kann einen Löwen oder eine Löwin bezeichnen. Im Zusammenhang mit den jungen Löwen ist „Löwin“ naheliegend, ohne die Versorgung durch Gott ausdrücklich weiter auszudeuten; לְ wird mit „für“ wiedergegeben.
- source_word: טָרֶף
  choice: Beute
  rationale: טֶרֶף bezeichnet hier Beute als Nahrung eines Raubtiers. „Beute“ bewahrt diesen konkreten räuberischen Bezug.
- source_word: וְחַיַּת
  choice: den Hunger
  rationale: חַיַּת bedeutet wörtlich etwa „Leben/Lebenskraft von“, bezeichnet in der Verbindung mit מלא hier jedoch das zu stillende Lebensbedürfnis beziehungsweise den Hunger der Tiere. „Hunger“ ist im Deutschen klar und idiomatisch.
- source_word: כְּפִירִים
  choice: der jungen Löwen
  rationale: כְּפִירִים bezeichnet junge Löwen; diese Wiedergabe ist präzise und in modernem Deutsch natürlich.
- source_word: תְּמַלֵּא
  choice: stillst
  rationale: Das Piel-Imperfekt 2. Person maskulin Singular von מלא heißt wörtlich „füllst“. In Verbindung mit „Hunger“ entspricht „stillst“ dem deutschen Sprachgebrauch und bewahrt den Sinn.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die zweigliedrige rhetorische Frage und der poetische Parallelismus des Hebräischen bleiben erhalten. Die ungewöhnlich wörtliche Wendung „das Leben/die Lebenskraft füllen“ wird idiomatisch als „den Hunger stillen“ wiedergegeben.
