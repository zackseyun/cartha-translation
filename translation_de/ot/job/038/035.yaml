  text: הַֽ/תְשַׁלַּ֣ח בְּרָקִ֣ים וְ/יֵלֵ֑כוּ וְ/יֹאמְר֖וּ לְ/ךָ֣ הִנֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/035.yaml
  text: Can you send out lightnings so that they go and say to you[a], ‘Here we are’ ?
translation:
  language: de
  text: 'Kannst du die Blitze aussenden, sodass sie losziehen und zu dir sagen: »Hier sind wir«?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתְשַׁלַּח
  choice: Kannst du … aussenden
  rationale: Das Fragepräfix mit dem Hifil-Imperfekt richtet eine rhetorische Frage an Hiob. »Kannst du« bringt die im Zusammenhang liegende Herausforderung seines Vermögens natürlich zum Ausdruck.
- source_word: בְּרָקִים
  choice: die Blitze
  rationale: Der deutsche Plural »Blitze« gibt die Mehrzahl des hebräischen Nomens idiomatisch wieder und ermöglicht die anschließende Personifikation.
- source_word: וְיֵלֵכוּ
  choice: sodass sie losziehen
  rationale: Die Fortsetzung mit waw und Imperfekt kann hier als Folge oder Ziel des Aussendens verstanden werden. »Losziehen« bewahrt zugleich das Bild ausgesandter Boten.
- source_word: וְיֹאמְרוּ
  choice: und … sagen
  rationale: Die Wiedergabe erhält die ausdrückliche Personifikation der Blitze und schließt sich im Deutschen natürlich an den vorangehenden Satzteil an.
- source_word: לְךָ
  choice: zu dir
  rationale: Die Präposition mit dem singularischen Pronomen bezeichnet Hiob als Empfänger der Antwort.
- source_word: הִנֵּנוּ
  choice: Hier sind wir
  rationale: Dies ist eine natürliche moderne Antwortformel, die Anwesenheit und Bereitschaft ausdrückt, ohne archaisch zu klingen.
theological_decisions:
- issue: Personifikation der Blitze in Gottes Rede
  choice: 'Die Blitze ziehen los und melden: »Hier sind wir«.'
  alternative: Die Aussage als unpersönliche Beschreibung eines von Gott gelenkten Naturvorgangs wiedergeben.
  rationale: Der hebräische Text schreibt den Blitzen ausdrücklich Bewegung und Rede zu. Diese poetische Personifikation veranschaulicht Gottes Befehlsgewalt über die Schöpfung, ohne den Blitzen buchstäbliches Bewusstsein zuzuschreiben.
translation_notes:
  register: Moderne, würdige und poetische Standardsprache. Die rhetorische Herausforderung an Hiob und das lebendige Botenbild bleiben erhalten; die mögliche Zweck- bzw. Folgebeziehung von וְיֵלֵכוּ wird mit »sodass« wiedergegeben.
