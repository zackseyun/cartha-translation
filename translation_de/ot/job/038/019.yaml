base_translation:
  language: en
  yaml_path: translation/ot/job/038/019.yaml
  text: Where is the way to the dwelling of light[a], and where is the place of darkness,
translation:
  language: de
  text: Wo ist der Weg zur Wohnung des Lichts[a], und die Finsternis – wo ist ihr Ort?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formaler: „Welches ist der Weg, wo das Licht wohnt, und die Finsternis – wo ist ihr Ort?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי זֶה
  choice: Wo ist
  rationale: Die Frage zielt idiomatisch auf Ort beziehungsweise Zugang; „Wo ist“ ist im Deutschen natürlich und bewahrt die räumliche Aussage.
- source_word: הַדֶּרֶךְ
  choice: der Weg
  rationale: „Weg“ gibt דֶּרֶךְ breit und bildkräftig wieder, ohne die Aussage auf eine befestigte Straße oder einen schmalen Pfad einzuengen.
- source_word: יִשְׁכָּן
  choice: auf dem … wohnt
  rationale: שׁכן bedeutet „wohnen, sich niederlassen“. Die relativische Wiedergabe bleibt näher an der hebräischen Satzgestalt als die Umformung zu „Weg zur Wohnung“ und erhält die Personifikation des Lichts.
- source_word: אוֹר
  choice: das Licht
  rationale: Die übliche Entsprechung; im Zusammenhang steht das kosmische Licht der Finsternis gegenüber.
- source_word: וְחֹשֶׁךְ
  choice: und die Finsternis
  rationale: Die Konjunktion und das Substantiv werden unmittelbar wiedergegeben; „Finsternis“ entspricht dem gehobenen, würdevollen Register der poetischen Gottesrede.
- source_word: מְקוֹמוֹ
  choice: ihr Ort
  rationale: מָקוֹם bedeutet „Ort“; das maskuline Suffix bezieht sich grammatisch auf חֹשֶׁךְ. Das deutsche Pronomen richtet sich nach dem Genus von „Finsternis“.
