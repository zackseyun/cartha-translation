  source_fidelity: 'Der Entwurf gibt die beiden hebräischen Fragen und die durchgehende Geburtsmetaphorik präzise wieder: מִבֶּטֶן מִי mit „Aus wessen Schoß“, יָצָא mit „ging ... hervor“ und יְלָדוֹ mit „wer gebar“ sind sachgerecht. „das Eis“ entspricht הַקָּרַח; „den Reif des Himmels“ gibt die Konstruktion כְּפוֹר שָׁמַיִם angemessen wieder.'
  naturalness: „Aus wessen Schoß ging das Eis hervor, und wer gebar den Reif des Himmels?“ ist idiomatische, moderne und zugleich würdige poetische Standardsprache. Die direkte Wiederaufnahme des Objekts bei „gebar“ ist im Deutschen klarer als ein nachgestelltes Pronomen.
