  yaml_path: translation/ot/job/038/029.yaml
  text: From whose womb did the ice come forth[a], and who gave birth to the frost of heaven?
translation:
  language: de
  text: Aus wessen Schoß ging das Eis hervor, und wer gebar den Reif des Himmels?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּטֶן מִי
  choice: Aus wessen Schoß
  rationale: בֶּטֶן bezeichnet Leib oder Mutterleib. „Schoß“ bewahrt im Deutschen die Geburtsmetaphorik und bildet mit dem folgenden „gebar“ ein natürliches poetisches Bild.
- source_word: יָצָא
  choice: ging ... hervor
  rationale: Das Verb bedeutet „hinausgehen, hervorgehen“. „ging hervor“ ist gehoben, aber gegenwärtig verständlich und erhält die Vorstellung einer Geburt.
- source_word: הַקָּרַח
  choice: das Eis
  rationale: קֶרַח bezeichnet Eis; der bestimmte Artikel wird entsprechend wiedergegeben.
- source_word: וּכְפֹר שָׁמַיִם
  choice: und ... den Reif des Himmels
  rationale: כְּפוֹר bezeichnet Reif, besonders den sichtbaren weißen Reif. „des Himmels“ bewahrt die Genitivkonstruktion und die kosmisch-poetische Bildwelt.
- source_word: מִי יְלָדוֹ
  choice: wer gebar ihn
  rationale: ילד bedeutet im Qal „gebären“. Das maskuline Objektsuffix bezieht sich auf כְּפוֹר; im deutschen Haupttext wird das Bezugswort zur Klarheit direkt als Objekt von „gebar“ geführt.
