  text: when the dust hardens into a mass[a], and the clods stick together?
translation:
  language: de
  text: 'wenn der Staub zu einer festen Masse wird[a]

    und die Erdschollen aneinanderhaften?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn der Staub zu einer Gussmasse erstarrt“. Das Hebräische verwendet ein Bild aus dem Gießen beziehungsweise Erstarren, um die Verdichtung des Bodens zu beschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶקֶת
  choice: wenn … zu einer festen Masse wird
  rationale: Die Präposition mit dem Infinitiv bildet hier im Zusammenhang einen Temporalsatz. Das Guss- oder Erstarrungsbild wird sinngemäß als Festwerden wiedergegeben.
- source_word: עָפָר
  choice: der Staub
  rationale: עָפָר bezeichnet Staub oder lockere Erde; „Staub“ bewahrt die konkrete Bildsprache.
- source_word: לַמּוּצָק
  choice: zu einer festen Masse
  rationale: Das Wortfeld von יצק kann Gegossenes oder Erstarrtes bezeichnen. „Feste Masse“ drückt im Kontext die Verdichtung des Bodens aus, ohne das mögliche Gussbild ganz auf Metall festzulegen.
- source_word: וּרְגָבִים
  choice: und die Erdschollen
  rationale: רְגָבִים sind Klumpen oder Schollen von Erde. „Erdschollen“ ist im modernen Deutschen eindeutig und anschaulich.
- source_word: יְדֻבָּקוּ
  choice: aneinanderhaften
  rationale: Die passive Verbform beschreibt, dass die Erdschollen miteinander verbunden werden beziehungsweise zusammenkleben. „Aneinanderhaften“ gibt das physische Bild natürlich wieder.
