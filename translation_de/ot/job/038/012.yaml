source:
  edition: WLC
  text: הְֽ֭/מִ/יָּמֶי/ךָ צִוִּ֣יתָ בֹּ֑קֶר ידעתה שחר מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/012.yaml
  text: Have you[a], in your days, commanded the morning[b], and caused the dawn to know its place?
translation:
  language: de
  text: Hast du je in deinem Leben[a] dem Morgen geboten und die Morgenröte wissen lassen, wo ihr Platz ist?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von deinen Tagen her«. Gemeint ist: irgendwann seit Beginn deines Lebens.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: »und die Morgenröte ihren Platz wissen lassen«. Das hebräische Verb steht in einer kausativen Form.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיָּמֶיךָ
  choice: je in deinem Leben
  rationale: Die Fragepartikel mit מִן und »deine Tage« fragt idiomatisch, ob Ijob dies irgendwann während seines Lebens getan hat. Die deutsche Wiedergabe ist natürlich und bewahrt den zeitlichen Umfang der Frage.
- source_word: צִוִּיתָ
  choice: geboten
  rationale: Das Verb bezeichnet ein autoritatives Befehlen. »Dem Morgen geboten« entspricht dem poetischen und feierlichen Ton der göttlichen Herausforderung.
- source_word: בֹּקֶר
  choice: dem Morgen
  rationale: »Morgen« bezeichnet hier personifiziert die kosmische Größe, der ein Befehl erteilt werden kann.
- source_word: יָדַעְתָּה
  choice: wissen lassen
  rationale: Die Hifil-Form von ידע hat kausative Bedeutung. »Wissen lassen« erhält sowohl diese Bedeutung als auch die Personifizierung der Morgenröte.
- source_word: שַׁחַר
  choice: die Morgenröte
  rationale: שַׁחַר bezeichnet die Morgendämmerung beziehungsweise Morgenröte. »Morgenröte« unterscheidet den Ausdruck vom parallelen בֹּקֶר und passt zur poetischen Bildsprache.
- source_word: מְקוֹמוֹ
  choice: wo ihr Platz ist
  rationale: Die Umformung des hebräischen Nominalausdrucks »ihren Platz« in einen deutschen Nebensatz klingt natürlich, ohne einen »bestimmten« oder »zugewiesenen« Platz in den Text hineinzulesen.
theological_decisions:
- issue: Gottes Herrschaft über Morgen und Morgenröte
  choice: Die personifizierende Sprache und das autoritative »geboten« bleiben erhalten.
  alternative: Die Aussage als bloße Frage nach der Festsetzung natürlicher Abläufe paraphrasieren.
  rationale: Der Vers stellt Gottes einzigartige Herrschaft über die Schöpfung heraus, ohne den poetischen Vorgang in eine sachliche Erklärung aufzulösen.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem poetischem Ton. »Geboten« wahrt die feierliche Sprache; »je in deinem Leben« gibt das hebräische Zeitidiom natürlich wieder. Die parallelen Begriffe »Morgen« und »Morgenröte« bleiben unterschieden.
