- source_word: שֹׁאָה וּמְשֹׁאָה
  choice: Einöde und Ödland
  rationale: Die beiden eng verwandten Begriffe werden als koordinierte Ausdrücke für unbewohntes, verwüstetes Land bewahrt, statt sie zu einem einzigen Begriff zusammenzuziehen.
- source_word: לְהַשְׂבִּיעַ
  choice: zu sättigen
  rationale: 'Die konkrete Metapher des hebräischen Verbs ‚sättigen‘ bleibt erhalten: Der Regen versorgt selbst das menschenleere Land reichlich.'
- source_word: לְהַצְמִיחַ מֹצָא דֶשֶׁא
  choice: den Austrieb des Grases sprießen zu lassen
  rationale: Die Formulierung bewahrt sowohl das kausative ‚sprießen lassen‘ als auch מֹצָא im Sinn dessen, was hervortritt beziehungsweise austreibt.
