  footnotes:
  - marker: a
    text: 'Oder: „als ich ihm eine Wolke als Gewand anlegte“. Das Hebräische beschreibt das Bekleiden und Wickeln eines Neugeborenen und führt damit das Geburtsbild für das Meer im Zusammenhang fort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמִי
  choice: als ich … machte
  rationale: 'Die Präposition ב mit dem Infinitivus constructus von שׂוּם und dem Suffix der 1. Person Singular ist hier temporal: „als ich machte/setzte“. Die gewählte Formulierung ist im Deutschen natürlich und lässt sich auf beide parallelen Satzglieder beziehen.'
- source_word: עָנָן
  choice: die Wolke
  rationale: עָנָן bezeichnet eine Wolke. Der bestimmte Artikel klingt im Deutschen in dieser poetischen Schöpfungsschilderung natürlich.
- source_word: לְבֻשׁוֹ
  choice: zu seinem Gewand
  rationale: לְבוּשׁ bedeutet Kleidung oder Gewand. „Gewand“ bewahrt das anschauliche Kleidungsbild; das maskuline Suffix verweist im Zusammenhang auf das Meer.
- source_word: וַעֲרָפֶל
  choice: und das Dunkel
  rationale: עֲרָפֶל bezeichnet dichtes, atmosphärisches Dunkel. „Das Dunkel“ ist würdevoll und poetisch; die Vorstellung von Dichte wird bereits durch das Bild der verhüllenden Windel getragen.
- source_word: חֲתֻלָּתוֹ
  choice: zu seiner Windel
  rationale: Das Wort bezeichnet eine Umhüllung beziehungsweise Windel und gehört zum Bild des Wickelns eines Neugeborenen. „Windel“ führt die Geburtsmetaphorik des Meeres verständlich fort.
