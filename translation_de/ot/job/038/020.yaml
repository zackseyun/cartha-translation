  source_fidelity: 'Die Übersetzung gibt die beiden parallel geführten rhetorischen Teilsätze sachgerecht wieder: תִקָּחֶנּוּ als räumliches „es … bringst“, אֶל גְּבוּלוֹ als „an seine Grenze“ sowie תָבִין נְתִיבוֹת בֵּיתוֹ als Erkennen der Pfade zu seinem Haus. „Damit“ ist für כִּי im Anschluss an die vorausgehende rhetorische Frage eine vertretbare deutsche Wiedergabe. Die Singularbezüge bleiben, wie im hebräischen Kontext, nicht ausdrücklich auf Licht oder Finsternis festgelegt.'
