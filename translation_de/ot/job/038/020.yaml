  text: כִּ֣י תִ֭קָּחֶ/נּוּ אֶל גְּבוּל֑/וֹ וְ/כִֽי תָ֝בִ֗ין נְתִיב֥וֹת בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/020.yaml
  text: that you might take it to its boundary[b][a], and that you might discern the paths to its house?
translation:
  language: de
  text: damit du es an seine Grenze bringst[a] und die Pfade zu seinem Haus erkennst?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Pronomen „es“, „seine“ und „seinem“ beziehen sich auf die im Zusammenhang singularisch dargestellte Größe – entweder das Licht oder die Finsternis in den parallelen Fragen von Hiob 38,19–20. Das grammatische Geschlecht im Deutschen kann diese Mehrdeutigkeit des Hebräischen nicht vollständig abbilden.
    reason: cross_reference
  - marker: b
    text: 'Oder: „und die Wege zu seiner Heimat verstehst?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: damit
  rationale: In der fortlaufenden rhetorischen Frage bezeichnet כִּי hier am ehesten den Zweck beziehungsweise die gedachte Folge. „Damit“ gibt diesen untergeordneten Anschluss im Deutschen natürlich wieder.
- source_word: תִקָּחֶנּוּ
  choice: du es … bringst
  rationale: לקח kann „nehmen“, „holen“ oder „bringen/führen“ bedeuten. In Verbindung mit אֶל („an/zu“) passt „bringen“ zur räumlichen Vorstellung; das Objektpronomen bleibt wie im Hebräischen im Singular.
- source_word: אֶל גְּבוּלוֹ
  choice: an seine Grenze
  rationale: גְּבוּל bezeichnet eine Grenze oder Begrenzung. „An seine Grenze“ bewahrt das räumliche Bild, ohne daraus ein politisches Gebiet zu machen.
- source_word: וְכִי
  choice: und
  rationale: Das zweite כִּי steht parallel zum ersten. Im Deutschen wirkt die einmalige Einleitung mit „damit“ und die anschließende Verbindung durch „und“ natürlich, ohne die syntaktische Parallelität inhaltlich aufzulösen.
- source_word: תָבִין
  choice: erkennst
  rationale: בין bezeichnet verstehendes Erkennen oder Unterscheiden. „Erkennen“ passt zu den Wegen, die zu einem Ziel führen, und bleibt in allgemein verständlicher Sprache.
- source_word: נְתִיבוֹת
  choice: die Pfade
  rationale: נְתִיבוֹת meint Pfade, Wege oder Spuren. „Pfade“ erhält das konkrete poetische Wegbild.
- source_word: בֵּיתוֹ
  choice: seinem Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“. Diese Wiedergabe bewahrt die Personifikation, nach der Licht oder Finsternis ein eigenes Haus hat.
theological_decisions:
- issue: Bezug der singularischen Pronomen
  choice: Die singularischen Pronomen werden beibehalten und ihr möglicher Bezug auf Licht oder Finsternis wird in einer Fußnote offengehalten.
  alternative: Die Pronomen ausdrücklich nur auf das Licht beziehen oder durch „jeweils“ beide Größen einbeziehen.
  rationale: Der unmittelbare Kontext von Hiob 38,19–20 stellt Licht und Finsternis parallel nebeneinander; der hebräische Singular legt nicht eindeutig fest, welche der beiden Größen gemeint ist. Eine eindeutige Zuordnung würde die genuine Mehrdeutigkeit beseitigen.
translation_notes:
  register: Moderne, würdige Standardsprache mit konkreter poetischer Bildgebung. Die Satzform schließt als Zwecksatz an die vorausgehende Frage an; „Haus“, „Grenze“ und „Pfade“ bewahren die räumliche Personifikation des Hebräischen.
