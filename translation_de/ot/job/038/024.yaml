  text: By what way is light divided[b][a], or the east wind scattered over the earth?
translation:
  language: de
  text: Auf welchem Weg verteilt sich das Licht[a], und breitet sich der Ostwind über die Erde aus?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Blitz“. Das hebräische Wort bedeutet gewöhnlich „Licht“, kann hier im Zusammenhang des Unwetters aber enger verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Wo ist der Weg, auf dem sich das Licht verteilt und der Ostwind über die Erde ausbreitet?“ Die hebräische Eingangsfrage kann nach Ort oder Art und Weise fragen; ihre Reichweite über beide Versteile bleibt in der knappen Satzfügung offen.'
    reason: ambiguity
lexical_decisions:
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Auf welchem Weg
  rationale: Die Wendung kann nach Ort oder Art und Weise fragen. „Auf welchem Weg“ bewahrt das Bild eines Weges und lässt die Frage bewusst offen.
- source_word: יֵחָלֶק
  choice: verteilt sich
  rationale: 'Der Nifal von חלק kann passiv oder reflexiv verstanden werden: sich verteilen, geteilt oder verteilt werden. Die reflexive deutsche Form passt natürlich zum poetischen Bild.'
- source_word: אוֹר
  choice: das Licht
  rationale: „Licht“ ist die gewöhnliche Bedeutung. Eine Einengung auf „Blitz“ ist im Unwetterkontext möglich, aber lexikalisch nicht zwingend.
- source_word: יָפֵץ
  choice: breitet sich ... aus
  rationale: Das Hifil von פוץ bezeichnet das Zerstreuen oder Ausbreiten. Da im masoretischen Text kein ausdrückliches Subjekt des Verteilens genannt wird, gibt die reflexive Form die Bildaussage im Deutschen flüssig wieder.
- source_word: קָדִים
  choice: der Ostwind
  rationale: קָדִים bezeichnet häufig den trockenen, aus Osten kommenden Wind; der meteorologische Zusammenhang stützt „Ostwind“.
- source_word: עֲלֵי אָרֶץ
  choice: über die Erde
  rationale: Die Präposition mit אֶרֶץ kann „über/auf der Erde“ bedeuten. „Über die Erde“ entspricht dem kosmischen Horizont der Rede.
