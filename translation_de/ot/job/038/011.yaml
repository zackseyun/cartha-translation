source:
  edition: WLC
  text: וָ/אֹמַ֗ר עַד פֹּ֣ה תָ֭בוֹא וְ/לֹ֣א תֹסִ֑יף וּ/פֹ֥א יָ֝שִׁ֗ית בִּ/גְא֥וֹן גַּלֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/011.yaml
  text: and I said[a], ‘You may come this far, and no farther; here your proud waves shall stop.’
translation:
  language: de
  text: 'und ich sprach: »Bis hierher darfst du kommen und nicht weiter; hier wird dem Stolz deiner Wellen eine Grenze gesetzt.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier ein Verb mit der Bedeutung „setzen“ oder „stellen“. Die knappe hebräische Wendung besagt, dass der Stolz beziehungsweise die Wucht der Wellen an diesem Punkt festgesetzt und damit aufgehalten wird. Möglich ist auch: „Hier sollen deine stolzen Wellen zum Stillstand kommen.“'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: und ich sprach
  rationale: Das Qal-Wayyiqtol in der 1. Person Singular führt die Schilderung von Gottes ordnendem Handeln fort. „Sprach“ wahrt den würdigen poetischen Ton.
- source_word: עַד־פֹּה
  choice: bis hierher
  rationale: Die Verbindung bezeichnet eine räumliche Grenze und wird im Deutschen idiomatisch mit „bis hierher“ wiedergegeben.
- source_word: תָבוֹא
  choice: darfst du kommen
  rationale: Die 2. Person Singular redet das Meer poetisch an. Im Zusammenhang der gesetzten Grenze bringt „darfst“ den erlaubten Umfang zum Ausdruck, ohne die Personifikation aufzugeben.
- source_word: וְלֹא תֹסִיף
  choice: und nicht weiter
  rationale: Das Hifil von יסף bedeutet wörtlich „fortfahren, noch hinzufügen“. Bei einer räumlichen Begrenzung ist „und nicht weiter“ die natürliche deutsche Entsprechung.
- source_word: וּפֹא יָשִׁית
  choice: hier wird … eine Grenze gesetzt
  rationale: שׁית bedeutet grundsätzlich „setzen, stellen“. Die knappe hebräische Konstruktion bezeichnet hier den Punkt, an dem die Wucht der Wellen festgesetzt beziehungsweise aufgehalten wird. Die deutsche Formulierung erhält das Bild des Setzens und ist zugleich verständlich.
- source_word: בִּגְאוֹן גַּלֶּיךָ
  choice: dem Stolz deiner Wellen
  rationale: גאון kann „Hoheit“, „Stolz“ oder anschwellende Übermacht bezeichnen. Der substantivische Ausdruck „Stolz deiner Wellen“ bewahrt die dichterische Mehrdeutigkeit genauer als das bloße Adjektiv „stolz“.
theological_decisions:
- issue: Personifikation des Meeres unter Gottes Befehl
  choice: Das Meer wird weiterhin unmittelbar mit „du“ angeredet und als einer von Gott gesetzten Grenze unterworfen dargestellt.
  alternative: Das Meer vollständig als unpersönliche Naturkraft wiedergeben.
  rationale: Die direkte Anrede gehört zur hebräischen Dichtung und unterstreicht Gottes Herrschaft über die Schöpfung, ohne das Meer zu einer eigenständigen Gottheit oder einem göttlichen Rivalen zu machen.
- issue: Mehrdeutigkeit von גאון
  choice: „Stolz“ als dichterische Bezeichnung für die Hoheit, Wucht oder Übermacht der Wellen beibehalten.
  alternative: Eindeutig als moralischen Hochmut oder ausschließlich als physisches Anschwellen deuten.
  rationale: Der hebräische Ausdruck lässt sowohl das majestätische Anschwellen als auch einen personifizierten Stolz anklingen; die Übersetzung soll diese Spannung nicht auflösen.
translation_notes:
  register: Modernes Standarddeutsch mit würdig-poetischem Klang. Die direkte Anrede des personifizierten Meeres bleibt erhalten; „bis hierher … und nicht weiter“ bildet die Grenzsetzung klar und einprägsam ab.
