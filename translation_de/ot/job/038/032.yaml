  yaml_path: translation/ot/job/038/032.yaml
  text: Can you bring out the Mazzaroth in its season[b][a], or guide Ayish along with her children?
translation:
  language: de
  text: Kannst du die Mazzarot zu seiner Zeit hervortreten lassen[a] oder Ajisch samt ihren Kindern leiten[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mazzarot ist ein seltener hebräischer Ausdruck aus der Himmelskunde; möglicherweise bezeichnet er Sternbilder oder die Zeichen des Tierkreises.
    reason: lexical_alternative
  - marker: b
    text: Ajisch ist ein hebräischer Name für einen Stern oder ein Sternbild. Manche Übersetzungen geben ihn mit „Arktur“ wieder; häufig wird er als „der Bär“ verstanden. Mit ihren „Kindern“ sind wahrscheinlich die zugehörigen Sterne gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֹצִיא
  choice: Kannst du … hervortreten lassen
  rationale: Die Hifil-Form von יצא bezeichnet hier das Veranlassen des Erscheinens. Die Formulierung bewahrt den kausativen Sinn und passt natürlich zum Auftreten von Sternbildern am Himmel.
- source_word: מַזָּרוֹת
  choice: die Mazzarot
  rationale: Der seltene astronomische Ausdruck ist in seiner genauen Bedeutung unsicher. Die lautnahe Wiedergabe vermeidet die unbelegte Festlegung auf Tierkreis oder Sternbilder; mögliche Bedeutungen stehen in der Fußnote.
- source_word: בְּעִתּוֹ
  choice: zu ihrer Zeit
  rationale: Die Wendung bezeichnet den jeweils bestimmten oder passenden Zeitpunkt. Das grammatisch maskuline Suffix bezieht sich auf den Ausdruck מַזָּרוֹת; im Deutschen richtet sich das Pronomen natürlich nach der als Plural aufgefassten Bezeichnung Mazzarot.
- source_word: וְעַיִשׁ
  choice: Ajisch
  rationale: Auch dieser Stern- oder Sternbildname ist nicht sicher identifiziert. Die Transkription bewahrt diese Ungewissheit, statt sich auf Arktur oder den Bären festzulegen.
- source_word: עַל בָּנֶיהָ
  choice: mit ihren Kindern
  rationale: Die Wiedergabe erhält das feminine Bild und die wörtliche Verwandtschaftsmetapher des Hebräischen; gemeint sind wahrscheinlich zugehörige Sterne.
- source_word: תַנְחֵם
  choice: führen
  rationale: Die Hifil-Form von נחה bedeutet führen oder leiten. „Führen“ ist knapp, würdevoll und lässt das Bild der gelenkten Himmelsbewegung bestehen.
