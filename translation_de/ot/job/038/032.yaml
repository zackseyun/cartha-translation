translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Klang. Die beiden unsicheren astronomischen Namen werden transkribiert; die Fußnoten erläutern mögliche Identifizierungen, ohne die im Hebräischen bestehende Unsicherheit aufzulösen.
