lexical_decisions:
- source_word: תִּתְהַפֵּךְ
  choice: sie verwandelt sich
  rationale: Der Hitpael von הפך kann reflexiv oder passiv verstanden werden. „Sie verwandelt sich“ gibt die Form natürlich wieder, ohne die Mehrdeutigkeit völlig aufzulösen; das feminine Pronomen bezieht sich aus dem Zusammenhang auf die Erde.
- source_word: כְּחֹמֶר חוֹתָם
  choice: wie Ton unter einem Siegel
  rationale: Die knappe hebräische Fügung vergleicht die Erde mit Ton, der durch ein Siegel geprägt wird. „Unter einem Siegel“ macht das Bild im Deutschen verständlich, ohne die Aussage weiter auszudeuten.
- source_word: וְיִתְיַצְּבוּ
  choice: und sie treten hervor
  rationale: Die Pluralform bezeichnet nicht ausdrücklich genannte Erscheinungen oder Konturen, die im Morgenlicht sichtbar hervortreten. Das Subjekt bleibt wie im Hebräischen offen.
- source_word: כְּמוֹ לְבוּשׁ
  choice: wie ein Gewand
  rationale: לְבוּשׁ bezeichnet ein Kleidungsstück oder Gewand. Die singularische poetische Bildsprache bleibt erhalten.
theological_decisions: []
