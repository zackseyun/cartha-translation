  text: Sie verwandelt sich wie Ton unter einem Siegel[a], und sie treten hervor[b] wie ein Gewand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie wird gewendet wie Ton unter einem Siegel.“ Das hebräische Verb kann reflexiv oder passiv verstanden werden.'
