    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: Worin
  rationale: Die Verbindung fragt nach dem tragenden beziehungsweise aufnehmenden Grund. „Worin“ passt im Deutschen natürlich zum folgenden Bild des Einsenkens.
- source_word: אֲדָנֶיהָ
  choice: ihre Sockel
  rationale: אֶדֶן bezeichnet einen Sockel, eine Basis oder eine Fundamentfassung. „Sockel“ bewahrt das konkrete architektonische Bild und den Plural.
- source_word: הָטְבָּעוּ
  choice: wurden … eingesenkt
  rationale: Die Hophal-Form von טבע ist passiv und bezeichnet das Versenken oder feste Einbetten. „Eingesenkt“ erhält sowohl die Passivform als auch die anschauliche Bauwerkssprache.
- source_word: אוֹ
  choice: oder
  rationale: Die einfache disjunktive Konjunktion verbindet die beiden rhetorischen Fragen.
- source_word: מִי
  choice: wer
  rationale: Entspricht unmittelbar dem hebräischen Fragepronomen.
- source_word: יָרָה
  choice: legte
  rationale: ירה kann wörtlich „werfen“ oder „schleudern“ bedeuten; bei einem Eckstein bezeichnet es im Baukontext idiomatisch dessen Setzen beziehungsweise Legen.
- source_word: אֶבֶן פִּנָּתָהּ
  choice: ihren Eckstein
  rationale: Wörtlich „den Stein ihrer Ecke“. „Eckstein“ ist die natürliche deutsche Baubezeichnung; das feminine Suffix verweist im Kontext auf die Erde.
theological_decisions:
- issue: Architektonisches Bild für die Erschaffung der Erde
  choice: Das Bild von Sockeln und Eckstein wird konkret beibehalten.
  alternative: Dynamische Auflösung als „Worauf ruht die Erde?“
  rationale: Gottes poetische Fragen beschreiben die Erde als Bauwerk. Die Bildsprache soll weder in eine abstrakte kosmologische Aussage aufgelöst noch modern wissenschaftlich gedeutet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die konkrete Bauwerksmetaphorik bleiben erhalten. „Worin“ verbindet sich idiomatisch mit „eingesenkt“, ohne die unbekannte Grundlage näher zu bestimmen.
