  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „ihre Fundamente“ oder „ihre Aufnahmen“. Das hebräische Wort kann einen Sockel, eine Basis oder einen Fundamentsockel bezeichnen.
    reason: lexical_alternative
