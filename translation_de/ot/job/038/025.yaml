translation:
  language: de
  text: Wer hat der Flut eine Rinne gegraben[a] und dem Blitzstrahl des Donners einen Weg?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer hat dem Wolkenbruch eine Rinne gegraben und dem Donnerblitz einen Weg?“ Wörtlich: „für die Flut … für den חֲזִיז der Stimmen/Laute“; קֹלוֹת kann im Wetterzusammenhang „Donner“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִלַּג
  choice: gebahnt
  rationale: Das Verb bezeichnet ein Teilen oder Aufspalten, durch das ein Lauf entsteht. Zusammen mit תְּעָלָה gibt „eine Rinne gebahnt“ das Anlegen eines Wasserlaufs natürlich und bildkräftig wieder.
- source_word: שֶּׁטֶף
  choice: Wasserflut
  rationale: Das Substantiv kann eine strömende Flut, einen Sturzregen oder einen Schwall bezeichnen. „Wasserflut“ passt zur Rinne und bewahrt den Gedanken gewaltig strömenden Wassers, ohne die mögliche Beziehung zum Wolkenbruch völlig auszuschließen.
- source_word: תְּעָלָה
  choice: Rinne
  rationale: Gemeint ist eine Leitung oder ein gegrabener Wasserlauf. „Rinne“ ist im Deutschen anschaulich und passt zum poetischen Bild eines für die Flut geschaffenen Laufs.
- source_word: דֶרֶךְ
  choice: Weg
  rationale: Das Wort bezeichnet hier den Lauf oder die Bahn des Wetterphänomens. „Weg“ wahrt die einfache poetische Parallele zu „Rinne“.
- source_word: חֲזִיז
  choice: Blitz
  rationale: Das seltene Wort bezeichnet wahrscheinlich einen Blitz beziehungsweise Wetterstrahl. In Verbindung mit קֹלוֹת wird es hier als Teil der idiomatischen Wiedergabe „Gewitterblitz“ verstanden.
- source_word: קֹלוֹת
  choice: Gewitter-
  rationale: Wörtlich bedeutet das Wort „Stimmen“ oder „Laute“ und bezeichnet im Wetterkontext häufig Donner. „Gewitterblitz“ gibt die Verbindung idiomatisch wieder; die wörtlichere und lexikalisch unsichere Form bleibt in der Fußnote sichtbar.
theological_decisions: []
