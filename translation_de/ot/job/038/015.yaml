base_translation:
  language: en
  yaml_path: translation/ot/job/038/015.yaml
  text: Their light is withheld from the wicked[b][a], and the uplifted arm is broken.
translation:
  language: de
  text: Den Gottlosen wird ihr Licht entzogen, und der erhobene Arm[a] wird gebrochen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der „Arm“ steht hier wahrscheinlich für Kraft oder Macht, besonders für gewaltsame Macht.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wird zerbrochen werden“. Das hebräische Imperfekt kann sowohl eine lebendig dargestellte gegenwärtige Handlung als auch eine zukünftige Handlung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִמָּנַע
  choice: wird entzogen
  rationale: Das Nifal Imperfekt von מנע bezeichnet hier passiv, dass etwas vorenthalten bzw. entzogen wird. „Wird entzogen“ gibt Form und Zusammenhang natürlich wieder.
- source_word: מֵרְשָׁעִים
  choice: den Gottlosen
  rationale: Die Präposition מִן bezeichnet die Trennung bzw. den Entzug. Der deutsche Dativ bei „jemandem etwas entziehen“ gibt diese Beziehung idiomatisch wieder; „Gottlose“ wahrt die moralische Kategorie ohne geschlechtliche Verengung.
- source_word: אוֹרָם
  choice: ihr Licht
  rationale: Das Suffix bezeichnet das Licht der Gottlosen bzw. das Licht, das sie genießen. Der unmittelbare Kontext spricht vom Morgenlicht, das Übeltäter bloßstellt und ihr Tun beendet.
- source_word: וּזְרוֹעַ
  choice: und der Arm
  rationale: זְרוֹעַ bedeutet wörtlich „Arm“ und kann bildlich für Kraft oder Macht stehen. Das Bild bleibt im Haupttext erhalten.
- source_word: רָמָה
  choice: erhobene
  rationale: Die Form von רום beschreibt den Arm als hochgehoben. „Erhoben“ bewahrt das Bild und kann zugleich überhebliche oder gewaltsame Macht anklingen lassen.
- source_word: תִּשָּׁבֵר
  choice: wird gebrochen
  rationale: Das Nifal Imperfekt von שבר lässt sich im poetischen Zusammenhang als lebendige gegenwärtige bzw. regelmäßig eintretende Handlung verstehen. Die deutsche Form „wird gebrochen“ wahrt zugleich die im Hebräischen mögliche Zukunftsnuance.
