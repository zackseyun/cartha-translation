  text: הֲ֭/יָדַעְתָּ חֻקּ֣וֹת שָׁמָ֑יִם אִם תָּשִׂ֖ים מִשְׁטָר֣/וֹ בָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/033.yaml
  text: Do you know the ordinances of the heavens? Can you establish their rule on the earth?[a]
translation:
  language: de
  text: Kennst du die Ordnungen des Himmels? Kannst du seine Herrschaft auf der Erde aufrichten?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Suffix lautet Singular („seine“), obwohl „Himmel“ im Hebräischen formal Plural ist; es kann sich kollektiv auf den Himmel beziehen. Auch möglich: „seine Regierung“ oder „seine Herrschaftsgewalt“.'
    reason: Der formale Singular und die Bedeutungsbreite von מִשְׁטָר sollen erkennbar bleiben, ohne den nicht völlig eindeutigen Bezug dogmatisch festzulegen.
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Kennst du
  rationale: Die Fragepartikel mit dem Qal Perfekt von ידע fragt hier idiomatisch nach gegenwärtigem Wissen. „Kennst du“ gibt die göttliche Herausforderung natürlich wieder.
- source_word: חֻקּוֹת
  choice: Ordnungen
  rationale: חֻקּוֹת bezeichnet festgesetzte Bestimmungen oder Ordnungen. Im kosmischen Zusammenhang vermittelt „Ordnungen“ die von Gott gesetzte Regelmäßigkeit, ohne den Ausdruck auf menschliche Gesetzgebung zu verengen.
- source_word: שָׁמָיִם
  choice: des Himmels
  rationale: Das morphologisch plurale שָׁמַיִם bezeichnet den Himmel beziehungsweise die Himmelssphäre. Im modernen Deutschen ist der kollektive Singular „der Himmel“ hier natürlich und bewahrt den gehobenen kosmischen Ton.
- source_word: אִם
  choice: Kannst du
  rationale: אִם leitet parallel zur ersten Frage eine zweite rhetorische Frage ein. „Kannst du“ gibt ihre Funktion im Deutschen klar und idiomatisch wieder.
- source_word: תָּשִׂים
  choice: zur Geltung bringen
  rationale: שׂים bedeutet grundsätzlich „setzen, einsetzen“. Zusammen mit מִשְׁטָר bezeichnet es hier das Wirksamsetzen einer Herrschaft; „zur Geltung bringen“ drückt dies natürlich aus, ohne unnötig eine erstmalige Errichtung zu behaupten.
- source_word: מִשְׁטָרוֹ
  choice: seine Herrschaft
  rationale: מִשְׁטָר bezeichnet Herrschaft, Gewalt oder leitende Ordnung. „Herrschaft“ bewahrt die Regierungskomponente; „seine“ bildet den maskulinen Singularsuffix ausdrücklich ab und kann sich kollektiv auf den Himmel beziehen.
- source_word: בָאָרֶץ
  choice: auf der Erde
  rationale: Die Präposition בְּ bezeichnet hier den irdischen Wirkungsbereich. „Auf der Erde“ ist die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Art der himmlischen Ordnung
  choice: Der Vers spricht von festgesetzten kosmischen Ordnungen und ihrer Herrschaft im irdischen Bereich, ohne astrologischen Determinismus zu behaupten.
  alternative: Die Himmelskörper oder Sternbilder üben einen ausdrücklich astrologischen Einfluss auf irdische Ereignisse aus.
  rationale: Der Zusammenhang behandelt Sterne und Himmel, doch חֻקּוֹת und מִשְׁטָר benennen Ordnung und Herrschaft allgemein. Die Übersetzung wahrt diese Aussage, ohne eine spezifische Lehre astraler Verursachung einzutragen.
- issue: Bezug des Singularsuffixes in מִשְׁטָרוֹ
  choice: „seine Herrschaft“ bewahrt den Singular und bezieht ihn am ehesten kollektiv auf den Himmel.
  alternative: „ihre Herrschaft“ richtet sich im Deutschen nach einem pluralisch verstandenen „die Himmel“ oder bezieht die Herrschaft auf die Ordnungen.
  rationale: Das hebräische Suffix ist formal maskulin Singular. Sein genauer Bezug ist nicht völlig eindeutig; die Übersetzung bewahrt die Form, während die Fußnote die mögliche kollektive Bezugnahme erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen Fragen bleiben knapp und rhetorisch. „Zur Geltung bringen“ vermeidet das im Deutschen unnatürliche „Herrschaft einsetzen“ und bewahrt zugleich den Gedanken, eine himmlische Herrschaft auf der Erde wirksam zu machen.
