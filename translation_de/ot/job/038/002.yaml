  text: מִ֤י זֶ֨ה מַחְשִׁ֖יךְ עֵצָ֥ה בְ/מִלִּ֗ין בְּֽלִי דָֽעַת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/002.yaml
  text: Who is this who darkens counsel with words without knowledge?[a]
translation:
  language: de
  text: Wer ist es, der den Ratschluss mit Worten ohne Erkenntnis verdunkelt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „den Rat“, „den Plan“ oder „die Absicht“ statt „den Ratschluss“.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Wer ist es
  rationale: Die Verbindung aus Fragepronomen und Demonstrativum formuliert eine nachdrückliche, konfrontative Frage. „Wer ist es“ klingt im Deutschen natürlich und würdevoll.
- source_word: מַחְשִׁיךְ
  choice: verdunkelt
  rationale: Die Wiedergabe bewahrt das hebräische Bild des Dunkelmachens und deutet es nicht vorschnell als bloßes Verwirren oder Verbergen.
- source_word: עֵצָה
  choice: Ratschluss
  rationale: „Ratschluss“ kann im Kontext sowohl weise Beratung als auch Plan oder Absicht bezeichnen und erhält damit die semantische und theologische Offenheit des hebräischen Wortes.
- source_word: בְמִלִּין
  choice: mit Worten
  rationale: Die Präposition ist instrumental gebraucht; „mit Worten“ gibt dies knapp und idiomatisch wieder.
- source_word: בְּלִי דָעַת
  choice: ohne Erkenntnis
  rationale: Die Formulierung folgt der hebräischen Wendung eng und vermeidet die interpretierende Verengung auf „unverständig“ oder „unwissend“.
theological_decisions:
- issue: Bedeutung von עֵצָה in Gottes Rede
  choice: Ratschluss
  alternative: Rat, Plan oder Absicht
  rationale: „Ratschluss“ lässt offen, ob vor allem Gottes weise Beratung, sein Plan oder seine Absicht gemeint ist, und löst die im Kontext bestehende Spannung nicht einseitig auf.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Die rhetorische Schärfe und das Bild des Verdunkelns bleiben erhalten; die Wortstellung ist zugleich für heutige Leser verständlich.
