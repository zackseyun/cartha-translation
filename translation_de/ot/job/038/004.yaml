base_translation:
  language: en
  yaml_path: translation/ot/job/038/004.yaml
  text: Where were you when I founded the earth? Tell me[a], if you know understanding.
translation:
  language: de
  text: Wo warst du, als ich die Erde gründete? Sag an, wenn du Einsicht hast.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיפֹה
  choice: Wo
  rationale: Das interrogative Adverb fragt nach dem Ort; „Wo“ gibt die unmittelbare Herausforderung natürlich und präzise wieder.
- source_word: הָיִיתָ
  choice: warst du
  rationale: Das Qal Perfekt 2. Person maskulin Singular von היה steht in einer auf die Vergangenheit bezogenen Frage; „warst du“ ist die idiomatische deutsche Wiedergabe.
- source_word: בְּיָסְדִי
  choice: als ich … gründete
  rationale: ב mit Infinitivus constructus und Suffix der 1. Person Singular hat hier temporale Bedeutung. „Als ich … gründete“ bewahrt knapp das architektonische Bild von יסד.
- source_word: אָרֶץ
  choice: die Erde
  rationale: Im Zusammenhang der kosmischen Schöpfung ist die Erde gemeint, nicht ein begrenztes Land.
- source_word: הַגֵּד
  choice: Sag es
  rationale: Der Imperativ von נגד fordert zum Mitteilen oder Darlegen auf. „Sag es“ ist im Deutschen natürlich; das Pronomen „es“ nimmt sinngemäß die verlangte Antwort auf.
- source_word: אִם
  choice: wenn
  rationale: אִם leitet hier eine bedingte, rhetorische Herausforderung ein; „wenn“ erhält diese Funktion.
- source_word: יָדַעְתָּ
  choice: du … hast
  rationale: Das Perfekt von ידע bezeichnet im Bedingungssatz einen gegenwärtig beanspruchten Besitz von Erkenntnis; die deutsche Wendung „Einsicht haben“ gibt dies idiomatisch wieder.
- source_word: בִינָה
  choice: Einsicht
  rationale: בינה bezeichnet Verständnis, Einsicht oder Urteilsvermögen. „Einsicht“ passt natürlich zur Weisheitssprache und vermeidet die schwerfällige Formulierung „Verständnis wissen“.
theological_decisions:
- issue: Schöpfungsterminologie in Gottes Rede
  choice: יסד mit „gründen“ wiedergeben
  alternative: „das Fundament der Erde legen“
  rationale: „Gründen“ bewahrt das architektonische Schöpfungsbild und die ausdrückliche Darstellung Gottes als Urheber der Erde, ohne das Bild erklärend auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter rhetorischer Schärfe. Die knappe Satzstruktur der göttlichen Herausforderung bleibt erhalten; „Einsicht haben“ ist natürlicher als eine formal mögliche, im Deutschen jedoch unidiomatische Verbindung mit „wissen“.
