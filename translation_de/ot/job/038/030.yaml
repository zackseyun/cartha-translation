  text: The waters are hidden like stone[b][a], and the surface of the deep is frozen.
translation:
  language: de
  text: Das Wasser wird hart wie Stein[a], und die Oberfläche der Tiefe erstarrt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Das Wasser verbirgt sich wie Stein.“ Das hebräische Verb ist an dieser Stelle ungewöhnlich; im Zusammenhang beschreibt es wahrscheinlich, wie das Wasser fest und hart wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und die Oberfläche der Tiefe schließt sich fest zusammen“; auch „gerinnt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֶבֶן
  choice: wie Stein
  rationale: Die Präposition כְּ kennzeichnet einen Vergleich. „Wie Stein“ bewahrt das Bild der steinartigen Härte, ohne ausdrücklich eine Verwandlung in Stein zu behaupten.
- source_word: מַיִם
  choice: die Wasser
  rationale: Das hebräische Pluralwort kann als Stoffbezeichnung dienen; „die Wasser“ erhält hier den gehobenen, kosmisch-poetischen Klang.
- source_word: יִתְחַבָּאוּ
  choice: werden hart
  rationale: Das Verb bedeutet gewöhnlich „sich verbergen“. Im Zusammenhang mit der Kälte und dem Parallelvers über die erstarrende Tiefe bezeichnet es wahrscheinlich bildhaft das Sich-Zurückziehen beziehungsweise Festwerden des Wassers. Die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: וּפְנֵי
  choice: und die Oberfläche
  rationale: „Das Angesicht von“ bezeichnet bei einem Gewässer idiomatisch dessen Oberfläche.
- source_word: תְהוֹם
  choice: der Tiefe
  rationale: „Die Tiefe“ gibt den kosmischen beziehungsweise großen Wasserkörper wieder, ohne die stärker deutende Konnotation von „Abgrund“ einzutragen.
- source_word: יִתְלַכָּדוּ
  choice: erstarrt
  rationale: Das Verb bezeichnet ein Erfasst-, Zusammengehalten- oder Festgeschlossenwerden. „Erstarrt“ drückt im Kältekontext den Vorgang natürlich aus, während die konkrete Grundvorstellung in der Fußnote erhalten bleibt.
