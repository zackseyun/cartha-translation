  text: 'Wer hat ihre Maße festgelegt – wenn du es weißt –

    oder wer hat die Messschnur über sie gespannt?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי שָׂם
  choice: Wer hat … festgelegt
  rationale: Die Frageform wird bewahrt; שׂים bezeichnet hier im Bild des Bauens das Bestimmen beziehungsweise Festlegen der Maße.
- source_word: מְמַדֶּיהָ
  choice: ihre Maße
  rationale: Der feminine Suffixbezug gilt der Erde aus dem Kontext; „Maße“ gibt ihre bemessenen Ausdehnungen natürlich und prägnant wieder.
- source_word: כִּי תֵדָע
  choice: wenn du es weißt
  rationale: Die konditionale Wiedergabe erhält die offene grammatische Möglichkeit und lässt die Ironie der rhetorischen Frage aus dem Zusammenhang hervorgehen, ohne sie durch „gewiss“ ausdrücklich festzulegen.
- source_word: אוֹ
  choice: oder
  rationale: Bewahrt die disjunktive Verknüpfung der parallelen Fragen.
- source_word: מִי נָטָה עָלֶיהָ קָּו
  choice: wer hat die Messschnur über sie gespannt
  rationale: נטה bezeichnet das Ausspannen; קו ist im Baukontext eine zum Messen verwendete Schnur. „Über sie“ bewahrt den räumlichen Bezug auf die Erde.
