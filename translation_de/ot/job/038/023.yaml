  variant: modern standard German
source:
  edition: WLC
  text: אֲשֶׁר חָשַׂ֥כְתִּי לְ/עֶת צָ֑ר לְ/י֥וֹם קְ֝רָ֗ב וּ/מִלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/023.yaml
  text: which I have reserved for a time of distress[a], for a day of battle and war[b],
translation:
  language: de
  text: die ich für eine Zeit der Bedrängnis[a] aufbewahrt habe, für einen Tag des Kampfes und des Krieges,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zurückgehalten« oder »aufgespart«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen bezieht sich auf die im vorherigen Vers genannten Vorräte beziehungsweise Hagelkörner; im Deutschen ist der feminine Pluralanschluss an die vorausgehenden Größen natürlich.
- source_word: חָשַׂכְתִּי
  choice: ich … aufbewahrt habe
  rationale: חשׂך kann »zurückhalten«, »aufsparen« oder »aufbewahren« bedeuten. »Aufbewahrt« bringt hier das absichtsvolle Bereithalten für einen späteren Zeitpunkt zum Ausdruck.
- source_word: לְעֶת
  choice: für eine Zeit
  rationale: Die Präposition לְ bezeichnet hier Bestimmung oder Zweck; עֵת meint einen Zeitpunkt oder Zeitraum.
- source_word: צָר
  choice: Bedrängnis
  rationale: צָר bezeichnet in diesem Zusammenhang Not, Bedrängnis oder Bedrohung. »Bedrängnis« wahrt den gewichtigen Ton.
- source_word: לְיוֹם
  choice: für einen Tag
  rationale: Die Wendung steht parallel zu לְעֶת und wird entsprechend als Bestimmungsangabe wiedergegeben.
- source_word: קְרָב
  choice: Kampf
  rationale: קְרָב ist ein militärischer Ausdruck für Kampf oder Schlacht. »Kampf« bildet zusammen mit »Krieg« eine natürliche deutsche Wortpaarung.
- source_word: וּמִלְחָמָה
  choice: und Krieg
  rationale: Die Wiedergabe bewahrt die hebräische Verbindung zweier militärischer Begriffe, ohne sie zu einem einzigen Ausdruck zusammenzuziehen.
theological_decisions:
- issue: Göttlicher Einsatz von Naturgewalten im Gerichts- und Kriegsbild
  choice: 'Die Aussage bleibt unmittelbar: Gott hat die zuvor genannten Naturgewalten für Zeiten der Bedrängnis, des Kampfes und des Krieges aufbewahrt.'
  alternative: Die Sprache ausschließlich als allgemeine Metapher für Vorsehung ohne militärischen Bezug verstehen.
  rationale: Der Vers nennt ausdrücklich Kampf und Krieg. Die Übersetzung erhält dieses Bild, ohne seine theologischen Folgerungen weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur »für eine Zeit …, für einen Tag …« und die militärische Doppelung bleiben erhalten. Das Relativpronomen setzt den Satz aus Vers 22 fort.
