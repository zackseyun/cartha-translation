  text: damit sie die Ränder der Erde ergreift[a] und die Frevler von ihr abgeschüttelt werden[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „die Flügel der Erde“, ein poetisches Bild für ihre äußersten Ränder; möglich ist auch „die Enden der Erde“.
    reason: lexical_alternative
  - marker: b
    text: Das Bild zeigt, wie die Morgenröte die Erde ergreift und die Frevler von ihr abschüttelt, ähnlich wie man Staub aus einem Kleidungsstück schüttelt.
    reason: cultural_note
lexical_decisions:
- source_word: לֶאֱחֹז
  choice: damit sie … erfasst
  rationale: Der Infinitiv mit ל drückt hier in Fortführung des vorigen Verses Zweck oder Folge aus. אחז bezeichnet ein konkretes Ergreifen oder Festhalten; „erfasst“ bewahrt das Bild in natürlichem Deutsch.
- source_word: בְּכַנְפוֹת
  choice: die Ränder
  rationale: כָּנָף bedeutet wörtlich „Flügel“, bezeichnet in dieser räumlichen Verbindung jedoch die äußersten Enden oder Ränder der Erde. „Ränder“ gibt das poetische Bild verständlich wieder, ohne es unnötig geometrisch festzulegen.
- source_word: הָאָרֶץ
  choice: der Erde
  rationale: Im kosmischen Zusammenhang der Rede über Schöpfung und Morgenlicht ist „Erde“ gegenüber „Land“ vorzuziehen.
- source_word: וְיִנָּעֲרוּ
  choice: und … abgeschüttelt werden
  rationale: Der Niphal von נער beschreibt ein Geschüttelt- oder Abgeschütteltwerden. Die Formulierung erhält das Bild der Erde als etwas, das ausgeschüttelt wird.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: Das substantivierte Adjektiv bezeichnet schuldhaft böse Menschen. „Frevler“ ist knapp, würdig und in poetischer biblischer Rede verständlich.
- source_word: מִמֶּנָּה
  choice: von ihr
  rationale: Das feminine Suffix verweist auf die Erde. Mit „abgeschüttelt werden“ ist „von ihr“ die natürliche deutsche Fügung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das feminine Pronomen „sie“ setzt den Bezug auf die im vorherigen Vers genannte Morgenröte fort. Die poetische Bildfolge und der Passivcharakter des hebräischen Verbs bleiben erhalten.
