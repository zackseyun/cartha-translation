  text: מִֽי יְסַפֵּ֣ר שְׁחָקִ֣ים בְּ/חָכְמָ֑ה וְ/נִבְלֵ֥י שָׁ֝מַ֗יִם מִ֣י יַשְׁכִּֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/037.yaml
  text: Who can count the clouds with wisdom[a], or tip over the jars of the heavens?
translation:
  language: de
  text: Wer kann mit Weisheit die Wolken zählen, und wer kann die Krüge des Himmels[a] auskippen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Schläuche des Himmels“. Das hebräische Bild stellt den Regen als Inhalt von Gefäßen am Himmel dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: wer kann
  rationale: Das Fragepronomen leitet zwei rhetorische Fragen nach einer Fähigkeit ein; „kann“ gibt die im Deutschen erforderliche modale Aussage natürlich wieder.
- source_word: יְסַפֵּר
  choice: zählen
  rationale: Das Piel von ספר bezeichnet hier im Zusammenhang mit den Wolken am ehesten das Zählen oder Nummerieren.
- source_word: שְׁחָקִים
  choice: die Wolken
  rationale: Das poetische Wort kann Himmel oder Wolken bezeichnen; der Zusammenhang mit Regen und den himmlischen Gefäßen spricht hier für „Wolken“.
- source_word: בְּחָכְמָה
  choice: mit Weisheit
  rationale: Die instrumentale beziehungsweise adverbiale Präpositionalfügung wird formnah wiedergegeben, ohne festzulegen, ob Weisheit Mittel oder Art des Zählens ist.
- source_word: וְנִבְלֵי שָׁמַיִם
  choice: die Krüge des Himmels
  rationale: נבל bezeichnet ein Gefäß, besonders einen Schlauch oder Krug. „Krüge“ bewahrt das anschauliche Bild himmlischer Regenbehälter, ohne „Wasser“ in den Haupttext einzutragen.
- source_word: יַשְׁכִּיב
  choice: auskippen
  rationale: Das Hifil von שכב bedeutet wörtlich „hinlegen lassen“. Auf Gefäße bezogen beschreibt es bildhaft ihr Neigen oder Umlegen, sodass der Inhalt ausgeschüttet wird; „auskippen“ ist dafür im Deutschen konkret und verständlich.
