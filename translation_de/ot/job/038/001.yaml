  yaml_path: translation/ot/job/038/001.yaml
  text: Then Yahweh answered Job out of the whirlwind and said:[a]
translation:
  language: de
  text: Da antwortete Jahwe Hiob aus dem Sturm und sagte:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Wirbelsturm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Da antwortete
  rationale: Das narrative Wayyiqtol von ענה bezeichnet hier ein Antworten. „Da“ gibt den Fortgang der Erzählung natürlich wieder und knüpft Jahwes Rede an die vorausgehenden Reden Hiobs an.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת אִיּוֹב
  choice: Hiob
  rationale: אֶת kennzeichnet das direkte Objekt und bleibt im Deutschen unübersetzt; der Personenname wird in seiner geläufigen deutschen Form „Hiob“ wiedergegeben.
- source_word: מִן־הַסְּעָרָה
  choice: aus dem Sturm
  rationale: סְעָרָה bezeichnet einen heftigen Sturm oder Wirbelsturm. „Sturm“ ist im modernen Deutsch klar und lässt die im hebräischen Ausdruck vorhandene Bedeutungsbreite bestehen; die spezifischere Alternative wird in einer Fußnote genannt.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die Form von אמר führt Jahwes folgende direkte Rede ein. „Und sagte“ bildet die hebräische Abfolge verständlich und in heutigem, würdigem Deutsch ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der persönliche Gottesname. Seine Wiedergabe als „Jahwe“ bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Bildgehalt von סְעָרָה in der Gotteserscheinung
  choice: Sturm
  alternative: Wirbelsturm
  rationale: Das hebräische Wort kann allgemein einen heftigen Sturm und spezifischer einen Wirbelsturm bezeichnen. Der Haupttext vermeidet eine unnötige Verengung; die plausible bildhaftere Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Doppelformel „antwortete … und sagte“ bleibt erhalten, ohne sie stilistisch zu glätten.
