    issue: „unerforschten Tiefen“ erweitert die Bedeutung von חֵקֶר interpretativ.
    rationale: Das Wortfeld betrifft Erforschen, Ergründen oder die äußersten/innersten Bereiche; der Grundtext behauptet nicht unmittelbar, dass die Tiefen unerforscht seien.
  - severity: low
