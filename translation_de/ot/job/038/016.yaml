  text: הֲ֭/בָאתָ עַד נִבְכֵי יָ֑ם וּ/בְ/חֵ֥קֶר תְּ֝ה֗וֹם הִתְהַלָּֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/016.yaml
  text: Have you come to the springs of the sea[b][a], or walked in the recesses of the deep?
translation:
  language: de
  text: Hast du die Quellen des Meeres[a] erreicht und bist du in den innersten Bereichen der Tiefe umhergegangen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zu den verborgenen Winkeln des Meeres.'
    reason: Die seltene Form נִבְכֵי kann neben „Quellen“ möglicherweise auch verborgene Bereiche oder Winkel bezeichnen.
  - marker: b
    text: 'Oder: „… oder bist du in den innersten Bereichen der Tiefe umhergegangen?“; auch: „in den äußersten Bereichen der Tiefe“.'
    reason: חֵקֶר תְּהוֹם ist ungewöhnlich und kann räumlich die innersten oder äußersten Bereiche der Tiefe bezeichnen. Das hebräische ו kann in diesem parallelen Fragesatz idiomatisch auch mit „oder“ wiedergegeben werden.
lexical_decisions:
- source_word: הֲבָאתָ עַד
  choice: Bist du bis zu … gekommen
  rationale: Die Fragepartikel mit dem Qal Perfekt 2. Person Singular von בוא formuliert eine direkte rhetorische Herausforderung; עַד bezeichnet das Erreichen eines Ziels.
- source_word: נִבְכֵי יָם
  choice: den Quellen des Meeres
  rationale: נִבְכֵי wird hier im wahrscheinlichen hydrologischen Sinn als verborgene Quellorte des Meeres verstanden. Die seltene Form lässt jedoch auch eine räumliche Deutung zu, die in der Fußnote genannt wird.
- source_word: וּבְחֵקֶר תְּהוֹם
  choice: und … in den unerforschten Tiefen der Urflut
  rationale: חֵקֶר bezeichnet das Erforschen beziehungsweise das bis an seine Grenze Erforschte und legt hier unzugängliche, unerforschte Bereiche nahe. תְּהוֹם wird mit „Urflut“ wiedergegeben, um die poetisch-kosmologische Färbung zu bewahren, ohne einen eigennamlichen Sinn festzulegen.
- source_word: הִתְהַלָּכְתָּ
  choice: bist du … umhergegangen
  rationale: Der Hitpael von הלך kann ein Sich-Bewegen beziehungsweise Umhergehen ausdrücken. „Umhergegangen“ erhält das anschauliche Bild, dass Job diese unzugänglichen Bereiche durchschritten habe.
- source_word: וּ
  choice: und
  rationale: Die hebräische Konjunktion wird formal als „und“ beibehalten; im parallelen Fragesatz ist im Deutschen auch „oder“ möglich.
theological_decisions: []
