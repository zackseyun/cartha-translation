  register: Poetisch-würdevoller, zugleich moderner Fragesatz. „Urflut“ bewahrt die besondere Färbung von תְּהוֹם; die seltenen und mehrdeutigen Wendungen werden nicht im Haupttext überladen, sondern durch Fußnoten offengehalten.
