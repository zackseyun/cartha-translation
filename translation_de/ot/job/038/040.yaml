  text: כִּי יָשֹׁ֥חוּ בַ/מְּעוֹנ֑וֹת יֵשְׁב֖וּ בַ/סֻּכָּ֣ה לְמוֹ אָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/040.yaml
  text: when they crouch in their dens and lie in wait in the thicket?[a]
translation:
  language: de
  text: wenn sie sich in ihren Höhlen ducken und im Dickicht auf der Lauer liegen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Versteck“ oder „im Unterschlupf“ statt „im Dickicht“. Das hebräische Wort סֻכָּה bezeichnet hier einen Ort, der beim Lauern Deckung bietet, nicht eine gebaute Hütte im Zusammenhang mit dem Laubhüttenfest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: wenn
  rationale: Im Zusammenhang der rhetorischen Frage bezeichnet כִּי den Zeitpunkt beziehungsweise die Situation, in der die Löwen auf Beute lauern.
- source_word: יָשֹׁחוּ
  choice: sie sich ducken
  rationale: Das Verb beschreibt hier das Sich-Niederducken der Tiere in Jagdhaltung; diese Wiedergabe ist im Deutschen natürlich und kontextgerecht.
- source_word: בַמְּעוֹנוֹת
  choice: in ihren Höhlen
  rationale: מְעוֹנוֹת bezeichnet Wohn- oder Lagerstätten; im Löwenkontext passt „Höhlen“. Das Possessivpronomen wird aus dem Zusammenhang ergänzt.
- source_word: יֵשְׁבוּ ... לְמוֹ אָרֶב
  choice: auf der Lauer liegen
  rationale: Die Verbindung aus „sitzen/verweilen“ und der Zweckangabe „zum Lauern/Hinterhalt“ wird durch die geläufige deutsche Jagdwendung idiomatisch und präzise wiedergegeben.
- source_word: בַסֻּכָּה
  choice: im Dickicht
  rationale: סֻכָּה meint hier einen deckenden, zum Lauern geeigneten Unterschlupf, nicht eine gebaute Festhütte. „Dickicht“ passt zum natürlichen Lebensraum.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Verbindung „auf der Lauer liegen“ gibt יֵשְׁבוּ mit לְמוֹ אָרֶב gemeinsam wieder; die Frage setzt Vers 39 syntaktisch fort.
