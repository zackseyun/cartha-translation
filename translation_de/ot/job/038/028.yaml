  yaml_path: translation/ot/job/038/028.yaml
  text: Does the rain have a father[a], or who has begotten the drops of dew?
translation:
  language: de
  text: Hat der Regen einen Vater, oder wer hat die Tautropfen gezeugt?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲיֵשׁ לַמָּטָר
  choice: Hat der Regen
  rationale: Die Verbindung aus Fragepartikel, Existenzpartikel und לְ drückt hier idiomatisch Besitz beziehungsweise Zuordnung aus; im Deutschen ist „Hat der Regen“ natürlich und genau.
- source_word: אָב
  choice: einen Vater
  rationale: Das konkrete Wort „Vater“ bewahrt die Zeugungsmetaphorik und den poetischen Parallelismus.
- source_word: אוֹ
  choice: oder
  rationale: Die einfache disjunktive Konjunktion verbindet die beiden parallelen Fragen.
- source_word: מִי
  choice: wer
  rationale: Das direkte Fragepronomen wird knapp und idiomatisch mit „wer“ wiedergegeben.
- source_word: הוֹלִיד
  choice: hat ... gezeugt
  rationale: Der Hifil von ילד bezeichnet hier das Zeugen beziehungsweise Hervorbringen. „gezeugt“ bewahrt den väterlichen Bildbereich des Parallelverses, ohne ihn zu umschreiben.
- source_word: אֶגְלֵי טָל
  choice: die Tautropfen
  rationale: Die Constructusverbindung bezeichnet Tropfen des Taus; das deutsche Kompositum ist natürlich und erhält das konkrete Bild.
