translation:
  language: de
  text: als die Morgensterne gemeinsam sangen[a] und alle Söhne Gottes vor Freude jauchzten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „miteinander jubelten“. Hebräisch: „Söhne Gottes“ kann hier himmlische Wesen bezeichnen; auch „Engel“ ist als Deutung vorgeschlagen worden.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/רָן
  choice: als ... jubelten
  rationale: Die Präposition בְּ mit dem Infinitiv von רנן bildet hier im Zusammenhang der vorausgehenden Frage einen temporalen Nebensatz. רנן bezeichnet jubelnden Gesang oder Jubelruf; „jubelten“ bewahrt die freudige, poetische Weite des Ausdrucks.
- source_word: יַחַד
  choice: miteinander
  rationale: יַחַד bezeichnet Gemeinsamkeit oder Gleichzeitigkeit. „Miteinander“ klingt im Deutschen natürlich und erhält den kollektiven Sinn.
- source_word: כּוֹכְבֵי בֹקֶר
  choice: die Morgensterne
  rationale: Die Status-constructus-Verbindung bedeutet wörtlich „Sterne des Morgens“. „Morgensterne“ ist die natürliche deutsche poetische Entsprechung.
- source_word: וַ/יָּרִיעוּ
  choice: und ... vor Freude jauchzten
  rationale: רוע/ריע im Hifil bezeichnet das Erheben eines lauten, hier offenkundig freudigen Rufs. „Vor Freude jauchzten“ gibt den feierlichen Parallelismus zu רנן idiomatisch wieder.
- source_word: כָּל
  choice: alle
  rationale: כָּל bezeichnet die Gesamtheit der genannten Gruppe und wird direkt mit „alle“ wiedergegeben.
- source_word: בְּנֵי אֱלֹהִים
  choice: Söhne Gottes
  rationale: Die Wendung bedeutet formal „Söhne Gottes“. Diese Wiedergabe bewahrt das markante Bild des Hebräischen und legt die Wesen nicht vorschnell als „Engel“ fest.
theological_decisions:
- issue: Identität der בְּנֵי אֱלֹהִים
  choice: Im Haupttext wörtlich „Söhne Gottes“
  alternative: „die himmlischen Wesen“, „die Engel“ oder „die göttlichen Wesen“
  rationale: Im Buch Hiob bezeichnet die Wendung wahrscheinlich Angehörige des himmlischen Hofes. „Engel“ wäre jedoch eine interpretierende Festlegung. Die formnahe Wiedergabe erhält die theologische Spannung und Transparenz des hebräischen Ausdrucks.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der Vers bleibt als Fortsetzung der vorausgehenden Frage syntaktisch offen; „als“ und das abschließende Fragezeichen erhalten diesen Zusammenhang. Der Parallelismus wird durch „jubelten“ und „vor Freude jauchzten“ hörbar gemacht, ohne beide hebräischen Verben gleichzusetzen.
