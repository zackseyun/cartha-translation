  text: als ich ihm meine Grenze setzte und Riegel und Türen anbrachte,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als ich ihm meine Bestimmung festlegte«. Das hebräische Verb bedeutet gewöhnlich »brechen«; seine Bedeutung in dieser Verbindung ist unsicher. Im Zusammenhang bezeichnet es wahrscheinlich das Festlegen einer Grenze für das Meer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁבֹּר
  choice: festsetzte
  rationale: Die Grundbedeutung der Wurzel שׁבר ist zwar »brechen«, doch ergibt das hier mit חֻקִּי keinen klaren natürlichen Sinn. Im Zusammenhang wird dem Meer eine feste Grenze auferlegt; »festsetzte« gibt diese kontextuelle Bedeutung wieder, ohne das Bild unnötig zu verflachen.
- source_word: עָלָיו
  choice: ihm
  rationale: Das Suffix bezieht sich auf das Meer im vorausgehenden Zusammenhang. Beim deutschen Verb »festsetzen« ist der Dativ »ihm« natürlich und entspricht funktional dem hebräischen עַל.
- source_word: חֻקִּי
  choice: meine Grenze
  rationale: חֹק kann eine Satzung, Festsetzung oder festgelegte Grenze bezeichnen. Da das Meer eingeschlossen und zurückgehalten wird, bringt »Grenze« den konkreten Sinn am besten zum Ausdruck; der Aspekt göttlicher Anordnung bleibt durch »festsetzte« erhalten.
- source_word: וָאָשִׂים
  choice: einsetzte
  rationale: שׂים bedeutet »setzen, stellen, anbringen«. Bei Riegeln und Türen klingt »einsetzte« im Deutschen natürlich und bewahrt das architektonische Bild.
- source_word: בְּרִיחַ
  choice: Riegel
  rationale: בְּרִיחַ bezeichnet einen Riegel oder Querbalken zum Verschließen eines Zugangs. Der deutsche Singular entspricht der hebräischen Form und ist zusammen mit dem folgenden Paar von Türen verständlich.
- source_word: וּדְלָתָיִם
  choice: und Türen
  rationale: Die Dualform bezeichnet zwei Türflügel beziehungsweise eine Doppeltür. »Türen« bewahrt das konkrete Bild in natürlichem Deutsch, ohne die Form unnötig auszudeuten.
theological_decisions:
- issue: Anthropomorphe Darstellung von Gottes Herrschaft über das Meer
  choice: 'Das konkrete Bild bleibt erhalten: Gott setzt dem Meer eine Grenze und verschließt es mit Riegel und Türen.'
  alternative: Die Bildsprache zu einer abstrakten Aussage über Gottes Herrschaft über die Natur verallgemeinern.
  rationale: Der Vers entfaltet Gottes Souveränität in anschaulicher architektonischer Sprache. Ihre Beibehaltung wahrt die poetische Kraft und vermeidet eine dogmatische Glättung.
- issue: Mehrdeutigkeit von חֹק zwischen Grenze und Satzung
  choice: Im Haupttext steht »Grenze«; die mögliche Bedeutung »Satzung/Festsetzung« wird in der Fußnote genannt.
  alternative: Im Haupttext »meine Satzung« oder »meine Festsetzung« wiedergeben.
  rationale: Der unmittelbare Kontext legt eine räumliche Begrenzung des Meeres nahe, während die Fußnote die rechtlich-anordnende Bedeutungsnuance und die ungewöhnliche Verbverbindung offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Syntax. Die konkrete Bildsprache des Hebräischen bleibt erhalten; die schwierige und möglicherweise mehrdeutige Verbindung וָאֶשְׁבֹּר ... חֻקִּי wird im Haupttext kontextgemäß und in der Fußnote transparent wiedergegeben.
