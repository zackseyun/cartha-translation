  text: to make it rain on a land where no man is[a], on a wilderness in which there is no human,
translation:
  language: de
  text: um es auf ein Land regnen zu lassen, in dem kein Mann ist,[a] auf eine Wildnis, in der kein Mensch ist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in dem niemand ist“. Im Hebräischen stehen in den beiden parallelen Satzgliedern zwei verwandte, aber unterschiedliche Wörter: אִישׁ („Mann“) und אָדָם („Mensch, Menschheit“).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַמְטִיר
  choice: um es regnen zu lassen
  rationale: Der Hifil-Infinitiv von מטר hat kausative Bedeutung. „Es regnen zu lassen“ gibt diese im Deutschen natürlich wieder und schließt syntaktisch an den vorausgehenden Kontext an.
- source_word: עַל
  choice: auf
  rationale: Die Präposition bezeichnet hier die Fläche beziehungsweise den Ort, auf den der Regen fällt.
- source_word: אֶרֶץ
  choice: ein Land
  rationale: Gemeint ist ein Landstrich, nicht die gesamte Erde. Die artikellose Form wird passend mit dem unbestimmten Artikel wiedergegeben.
- source_word: לֹא אִישׁ
  choice: wo kein Mann ist
  rationale: אִישׁ bezeichnet im Singular einen Mann. Die existentielle Formulierung wahrt den Wortlaut und unterscheidet den Ausdruck vom folgenden אָדָם.
- source_word: מִדְבָּר
  choice: eine Wildnis
  rationale: מִדְבָּר bezeichnet häufig unbewohntes, unbebautes Land oder Steppe und nicht zwingend eine Sandwüste. „Wildnis“ bewahrt diesen weiteren Sinn.
- source_word: לֹא אָדָם בּוֹ
  choice: in der kein Mensch lebt
  rationale: אָדָם bezeichnet hier den Menschen allgemein. „Lebt“ bringt die idiomatische existentielle Aussage von לֹא ... בּוֹ zum Ausdruck, während „Mensch“ den lexikalischen Unterschied zu אִישׁ bewahrt.
theological_decisions:
- issue: Wiedergabe von אָדָם in allgemein-menschlicher Bedeutung
  choice: Mensch
  alternative: Mann; Menschheit
  rationale: Hier ist nicht eigens ein männliches Individuum gemeint, sondern ein Mensch beziehungsweise die menschliche Bevölkerung allgemein. „Mensch“ erhält zugleich den poetischen Unterschied zum vorhergehenden אִישׁ („Mann“).
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Der Vers ist als fortlaufendes Satzglied formuliert; deshalb beginnt er kleingeschrieben und endet mit einem Komma. Die Wiederholung der unbewohnten Orte und der lexikalische Unterschied zwischen אִישׁ und אָדָם bleiben erkennbar.
