  text: Or who shut in the sea with doors when it burst out from the womb[b][a],
translation:
  language: de
  text: Oder wer verschloss das Meer mit Türen, als es hervorbrach, als es aus dem Mutterschoß hervorkam?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hervorströmte“ statt „hervorbrach“; das hebräische Verb bezeichnet ein kraftvolles Hervordringen.'
    reason: lexical_alternative
  - marker: b
    text: Das Meer wird hier wie ein Kind dargestellt, das aus dem Mutterschoß hervorkommt; damit wird die poetische Schöpfungsbildsprache fortgeführt.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסֶךְ
  choice: verschloss
  rationale: Das Verb bezeichnet hier das Umschließen oder Absperren des Meeres; „verschloss“ verbindet sich natürlich mit dem Bild der Türen.
- source_word: בִּדְלָתַיִם
  choice: mit Türen
  rationale: Die Dualform von „Tür“ wird als Plural wiedergegeben; die Präposition bezeichnet das Mittel, mit dem das Meer eingeschlossen wird.
- source_word: יָם
  choice: das Meer
  rationale: Obwohl im Hebräischen kein Artikel steht, ist im kosmischen Zusammenhang das bestimmte, als bekannt vorausgesetzte Meer gemeint.
- source_word: בְּגִיחוֹ
  choice: als es hervorbrach
  rationale: Die Form bezeichnet ein kraftvolles Hervordringen und leitet das Geburtsbild ein.
- source_word: מֵרֶחֶם
  choice: aus dem Mutterschoß
  rationale: „Mutterschoß“ bewahrt im Deutschen das konkrete Geburtsbild und klingt poetisch, ohne altertümlich zu wirken.
- source_word: יֵצֵא
  choice: hervortrat
  rationale: Das finite Verb wird eigens wiedergegeben, damit die hebräische Wiederaufnahme des Hervorkommens erhalten bleibt; der Wechsel von „hervorbrach“ zu „hervortrat“ begrenzt die stilistische Schwerfälligkeit.
theological_decisions:
- issue: Poetisches Schöpfungsbild des Meeres
  choice: Das Meer wird als neugeborenes Wesen dargestellt, das Gott mit Türen einschließt.
  alternative: Die Bildsprache abstrakt als Gottes Setzen von Grenzen für das Meer wiederzugeben.
  rationale: Die konkrete Geburts- und Türmetaphorik gehört zur Aussageform des hebräischen Gedichts und sollte weder entmythologisiert noch zu einer dogmatischen Behauptung über einen kosmischen Geburtsvorgang ausgebaut werden.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die Wiederholung des Hervorkommens entspricht der hebräischen Syntax, wird jedoch durch zwei unterschiedliche, sinnverwandte Verben natürlich gestaltet.
