  yaml_path: translation/ot/job/038/003.yaml
  text: Gird up your loins like a man[a]; I will question you[b], and you shall make it known to me.
translation:
  language: de
  text: Gürte dir doch wie ein Mann die Hüften[a]! Ich will dich fragen, und lass es mich wissen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mach dich bereit wie ein Krieger.“ Wörtlich steht hier das Bild, sich wie ein Mann die Hüften zu gürten – eine Redewendung für entschlossene Vorbereitung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und mach es mir bekannt“ oder „und lass es mich wissen“. Häufig wird sinngemäß „und antworte mir“ übersetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר נָא
  choice: Gürte dir doch
  rationale: אזר bezeichnet das Umgürten als entschlossene Vorbereitung. Das Modalpartikel „doch“ gibt hier die nachdrückliche, auffordernde Funktion von נָא natürlicher wieder als ein höfliches „bitte“.
- source_word: כְגֶבֶר
  choice: wie ein Mann
  rationale: גֶּבֶר bezeichnet einen Mann und kann Stärke oder Kampfeskraft mitschwingen lassen. Die konkrete männliche Form und die Bildsprache des hebräischen Textes bleiben erhalten.
- source_word: חֲלָצֶיךָ
  choice: die Hüften
  rationale: חֲלָצַיִם bezeichnet den Hüft- beziehungsweise Lendenbereich. „Die Hüften gürten“ bewahrt das konkrete Bild und ist im Deutschen verständlicher als das heute altertümlich oder anatomisch wirkende „die Lenden gürten“.
- source_word: וְאֶשְׁאָלְךָ
  choice: Ich will dich fragen
  rationale: שׁאל bedeutet „fragen“. „Ich will dich fragen“ bewahrt den ankündigenden und zugleich herausfordernden Ton.
- source_word: וְהוֹדִיעֵנִי
  choice: und du belehre mich
  rationale: Der Hifil von ידע bedeutet „wissen lassen, kundtun“. „Belehre mich“ ist im Deutschen knapp und natürlich und erhält die pointierte Aufforderung Gottes an Hiob.
theological_decisions:
- issue: Geschlechtsspezifische Formulierung in Gottes Herausforderung
  choice: wie ein Mann
  alternative: wie ein Krieger
  rationale: Der hebräische Text verwendet ausdrücklich גֶּבֶר. Die Wiedergabe bewahrt diese Form, ohne daraus eine allgemeine Aussage über eine Überlegenheit von Männern abzuleiten; im Zusammenhang geht es um entschlossene Bereitschaft.
- issue: Gottes Aufforderung, ihn zu belehren
  choice: und du belehre mich
  alternative: und lass es mich wissen
  rationale: 'Die zugespitzte, rhetorische Spannung bleibt stehen: Gott fordert Hiob tatsächlich auf, ihm sein Wissen darzulegen. Die Formulierung wird nicht zum bloßen „antworte mir“ abgeschwächt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete hebräische Bild bleibt erhalten, wird aber mit „Hüften“ statt des heute weniger geläufigen „Lenden“ wiedergegeben. Der kurze Ausruf und „belehre mich“ bewahren den scharfen, rhetorischen Ton der Gottesrede.
