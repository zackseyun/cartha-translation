  text: הֲ֭/בָאתָ אֶל אֹצְר֣וֹת שָׁ֑לֶג וְ/אֹצְר֖וֹת בָּרָ֣ד תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/022.yaml
  text: Have you entered the storehouses of the snow[a], or have you seen the storehouses of the hail?
translation:
  language: de
  text: Bist du in die Vorratskammern des Schnees gelangt[a], oder hast du die Vorratskammern des Hagels gesehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schatzkammern des Schnees … Schatzkammern des Hagels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבָאתָ אֶל
  choice: Bist du in … gelangt
  rationale: Die Fragepartikel הֲ leitet eine rhetorische Frage ein; בוא im Perfekt 2. Person maskulin Singular bezeichnet das Gelangen an einen Ort. „In … gelangt“ gibt zusammen mit אֶל die räumliche Vorstellung idiomatisch wieder, ohne mehr als das Betreten der genannten Vorratskammern auszudrücken.
- source_word: אֹצְרוֹת
  choice: Vorratskammern
  rationale: אֹצָר kann eine Schatzkammer, Vorratskammer oder einen Aufbewahrungsort bezeichnen. „Vorratskammern“ bewahrt hier das konkrete Bild aufbewahrter Wettervorräte und ist im modernen Deutsch unmittelbar verständlich.
- source_word: שָׁלֶג
  choice: Schnee
  rationale: Die übliche deutsche Entsprechung des meteorologischen Begriffs.
- source_word: וְאֹצְרוֹת
  choice: und … die Vorratskammern
  rationale: Das וְ verbindet die beiden parallelen Teile der rhetorischen Frage. Das schlichte „und“ bildet die hebräische Koordination direkt und natürlich ab.
- source_word: בָּרָד
  choice: Hagel
  rationale: Die übliche deutsche Entsprechung des meteorologischen Begriffs.
- source_word: תִּרְאֶה
  choice: hast du … gesehen
  rationale: Das Imperfekt steht im zweiten Teil der poetischen Doppelfrage parallel zum vorausgehenden Perfekt. Das deutsche Perfekt ergibt eine flüssige, zusammenhängende Frage; die formal mögliche präsentische Wiedergabe „siehst du“ bleibt als grammatische Nuance im Hintergrund.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Das konkrete kosmische Bild von Gottes Vorratsräumen für Schnee und Hagel bleibt erhalten; die rhetorische Frage wird weder erklärt noch theologisch aufgelöst.
