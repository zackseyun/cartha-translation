  text: מִ֤י יָכִ֥ין לָ/עֹרֵ֗ב צֵ֫יד֥/וֹ כִּֽי ילד/ו אֶל אֵ֣ל יְשַׁוֵּ֑עוּ יִ֝תְע֗וּ לִ/בְלִי אֹֽכֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/041.yaml
  text: Who prepares its prey for the raven when its young cry out to God and wander about for lack of food?[a][b][c]
translation:
  language: de
  text: Wer stellt dem Raben seine Beute bereit, wenn seine Jungen zu Gott um Hilfe schreien und aus Mangel an Nahrung umherirren?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer versorgt den Raben mit Nahrung?“ Das hebräische Verb bedeutet „bereitmachen“ oder „bereitstellen“, und „Beute“ kann allgemeiner als „Nahrung“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil seine Jungen zu Gott um Hilfe schreien“. Die Konjunktion kann statt zeitlich („wenn“) auch begründend („weil“ oder „denn“) verstanden werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „umherstreifen“ oder „sich verirren“. Das hebräische Verb kann ein Umherziehen oder Abirren auf der Suche nach Nahrung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Wer
  rationale: Das Fragepronomen leitet in Gottes Rede eine rhetorische Frage ein.
- source_word: יָכִין
  choice: stellt … bereit
  rationale: Der Hifil von כון bezeichnet hier das Bereitmachen oder Bereitstellen; die Wendung ist im Deutschen natürlich und bewahrt den konkreten Sinn.
- source_word: לָעֹרֵב
  choice: dem Raben
  rationale: Die Präposition kennzeichnet den Empfänger; der bestimmte Singular bezeichnet den Raben als typischen Vertreter seiner Art.
- source_word: צֵידוֹ
  choice: seine Beute
  rationale: ציד bezeichnet Jagdbeute oder dadurch gewonnene Nahrung. Das Suffix der dritten Person Singular wird mit „seine“ wiedergegeben und bezieht sich auf den Raben.
- source_word: כִּי
  choice: wenn
  rationale: Die Konjunktion beschreibt hier plausibel die Situation, in der die Not der Rabenjungen sichtbar wird; eine kausale Lesart bleibt in der Fußnote erhalten.
- source_word: יַלְדָו
  choice: seine Jungen
  rationale: Das Substantiv mit Suffix bezeichnet die Jungen des Raben; „seine Jungen“ ist knapp und idiomatisch.
- source_word: אֶל אֵל
  choice: zu Gott
  rationale: אֵל wird in diesem Zusammenhang als allgemeine Bezeichnung für Gott verstanden, nicht als zu transliterierender Eigenname.
- source_word: יְשַׁוֵּעוּ
  choice: um Hilfe schreien
  rationale: Der Piel von שוע bezeichnet einen Hilferuf; die deutsche Fassung macht diesen Bedeutungsaspekt ausdrücklich und natürlich wieder.
- source_word: יִתְעוּ
  choice: umherirren
  rationale: Der Qal von תעה kann umherziehen, irren oder sich verirren bedeuten; „umherirren“ bewahrt sowohl die Bewegung als auch die Notlage.
- source_word: לִבְלִי אֹכֶל
  choice: aus Mangel an Nahrung
  rationale: Die Wendung bezeichnet das Fehlen von Nahrung und lässt zugleich den ursächlichen Zusammenhang mit dem Umherirren erkennen.
