  text: יָ֭דַעְתָּ כִּי אָ֣ז תִּוָּלֵ֑ד וּ/מִסְפַּ֖ר יָמֶ֣י/ךָ רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/021.yaml
  text: You know[a], for then you were born, and the number of your days is great!
translation:
  language: de
  text: Du weißt es ja, denn damals wurdest du geboren, und die Zahl deiner Tage ist groß![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und deine Tage sind zahlreich.« Wörtlich: »und die Zahl deiner Tage [ist] groß/zahlreich.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Du weißt es ja
  rationale: Das Qal Perfekt 2. Person Maskulin Singular von ידע steht hier in einer ironischen rhetorischen Aussage. Das deutsche Präsens mit »ja« gibt diese spöttische Gewissheit natürlich wieder, ohne ein ausdrückliches »sicherlich« einzuführen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die ironische Begründung ein und verbindet den Satz im Deutschen flüssig mit dem vorausgehenden Zusammenhang.
- source_word: אָז
  choice: damals
  rationale: Das Temporaladverb verweist auf die zuvor geschilderte Zeit der Schöpfung; »damals« ist in diesem rückblickenden Zusammenhang natürlicher als »dann«.
- source_word: תִּוָּלֵד
  choice: du wurdest geboren
  rationale: 'Das Nifal Imperfekt 2. Person Maskulin Singular von ילד wird im ironischen Kontext mit vergangenem Zeitbezug gebraucht: Hiob müsste zu jener Zeit bereits geboren worden sein.'
- source_word: וּמִסְפַּר יָמֶיךָ
  choice: und die Zahl deiner Tage
  rationale: Die hebräische Status-constructus-Verbindung wird formal und zugleich idiomatisch wiedergegeben.
- source_word: רַבִּים
  choice: ist groß
  rationale: Das Adjektiv bezeichnet hier die große Zahl der Lebenstage. Die singularische deutsche Form richtet sich nach dem Bezugswort »Zahl«; die alternative Wiedergabe mit »viele Tage« wird in der Fußnote genannt.
theological_decisions:
- issue: Ironischer Charakter der göttlichen Aussage
  choice: Die Aussage wird als scheinbare Feststellung formuliert und durch »ja« als Ironie kenntlich gemacht.
  alternative: Eine ausdrückliche rhetorische Frage wie »Das weißt du doch wohl?«
  rationale: Der hebräische Text ist formal eine Aussage. Die Übersetzung bewahrt diese Form und macht den im Zusammenhang deutlichen Spott nur sprachlich hörbar, ohne den Satz in eine Frage umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bewahrt die knappe, scharf ironische Aussageform der Gottesrede; »damals« stellt den zeitlichen Rückbezug auf die Schöpfung klar heraus.
