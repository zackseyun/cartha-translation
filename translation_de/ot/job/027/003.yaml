  text: כִּֽי כָל ע֣וֹד נִשְׁמָתִ֣/י בִ֑/י וְ/ר֖וּחַ אֱל֣וֹהַּ בְּ/אַפִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/003.yaml
  text: For as long as my breath is still in me[a], and the spirit of God is in my nostrils,
translation:
  language: de
  text: Denn solange mein Atem noch in mir ist und Gottes Hauch in meinen Nasenlöchern ist,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Partikel leitet hier die feierliche Bekräftigung Hiobs ein und verbindet sie begründend mit dem folgenden Schwur.
- source_word: כָל עוֹד
  choice: solange … noch
  rationale: Die Verbindung bezeichnet die ununterbrochene Dauer und wird im Deutschen natürlich mit „solange … noch“ wiedergegeben.
- source_word: נִשְׁמָתִי
  choice: mein Atem
  rationale: נְשָׁמָה bezeichnet hier den Atem als Zeichen fortdauernden Lebens; „Seele“ wäre im unmittelbaren Kontext zu abstrakt.
- source_word: בִי
  choice: in mir
  rationale: Die Präposition bezeichnet die Gegenwart des Atems im Inneren des Sprechers.
- source_word: וְרוּחַ
  choice: und … Lebenshauch
  rationale: רוּחַ kann Atem, Wind, Hauch oder Geist bedeuten. Im Parallelismus mit „mein Atem“ und in Verbindung mit den Nasenlöchern steht der lebensspendende Atem im Vordergrund; „Lebenshauch“ erhält zugleich mehr von der Weite des hebräischen Ausdrucks als eine bloße Wiederholung von „Atem“.
- source_word: אֱלוֹהַּ
  choice: Gottes
  rationale: אֱלוֹהַּ ist die besonders im Buch Hiob häufige singularische Gottesbezeichnung und wird schlicht mit „Gott“ wiedergegeben.
- source_word: בְּאַפִּי
  choice: in meinen Nasenlöchern
  rationale: אַף bezeichnet hier konkret Nase beziehungsweise Nasenlöcher; das Bild des Atmens verlangt die körperliche Bedeutung.
theological_decisions:
- issue: Bedeutung von רוּחַ אֱלוֹהַּ im Parallelismus mit נִשְׁמָתִי
  choice: Gottes Lebenshauch
  alternative: der Geist Gottes
  rationale: Der unmittelbare Zusammenhang von Atem, fortdauerndem Leben und Nasenlöchern spricht für den lebensspendenden Hauch Gottes. Da רוּחַ ebenso „Geist“ bedeuten kann, bleibt diese theologisch bedeutsame Lesart in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Körperlichkeit. „Lebenshauch“ vermeidet eine schwerfällige Doppelung von „Atem“, ohne die mögliche Bedeutung „Geist“ zu verschweigen. Das Komma am Versende entspricht dem syntaktisch weiterführenden Satz in Vers 4.
