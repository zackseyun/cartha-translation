  text: כִּ֤י מַה תִּקְוַ֣ת חָ֭נֵף כִּ֣י יִבְצָ֑ע כִּ֤י יֵ֖שֶׁל אֱל֣וֹהַּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/008.yaml
  text: For what is the hope of the godless when God cuts him off[c][b][a], when God takes away his life?
translation:
  language: de
  text: Denn welche Hoffnung hat der Gottlose[a], wenn er Gewinn macht[b], wenn Gott ihm das Leben nimmt[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Heuchler“. Das hebräische Wort kann einen gottlosen, frevelhaften oder heuchlerischen Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Satzfügung ist schwierig; auch möglich: „auch wenn er Gewinn macht“ oder „obwohl er Gewinn gemacht hat“.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlicher: „wenn Gott sein Leben herauszieht“; auch möglich: „seine Seele“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְוַת
  choice: Hoffnung
  rationale: Das Substantiv bezeichnet das Erhoffte oder die Erwartung. „Hoffnung“ ist im Deutschen natürlich und entspricht der rhetorischen Frage nach der letzten Zuversicht des Gottlosen.
- source_word: חָנֵף
  choice: der Gottlose
  rationale: Das Wort bezeichnet hier einen Menschen, der Gott missachtet oder frevelhaft handelt. „Der Gottlose“ gibt den religiös-moralischen Sinn im Hiobbuch besser wieder als das enger verstandene „der Heuchler“.
- source_word: יִבְצָע
  choice: auch wenn er Gewinn macht
  rationale: 'בצע kann das Abschneiden, aber auch das Erlangen von Gewinn bezeichnen. Mit dem Gottlosen als naheliegendem Subjekt ergibt sich der Sinn: Selbst erworbener Gewinn bietet keine Hoffnung, wenn Gott das Leben nimmt. Wegen der schwierigen und mehrdeutigen Klausel werden andere Deutungen in der Fußnote bewahrt.'
- source_word: יֵשֶׁל
  choice: nimmt
  rationale: Das Verb beschreibt hier das Wegnehmen beziehungsweise Herausziehen des Lebens. „Nimmt“ ist natürliches Deutsch und wahrt den Parallelismus, ohne die Bildsprache unnötig zu überpräzisieren.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Die poetische Singularform ist im Hiobbuch eine gewöhnliche Bezeichnung für Gott und wird direkt mit „Gott“ wiedergegeben.
- source_word: נַפְשׁוֹ
  choice: ihm das Leben
  rationale: נֶפֶשׁ bezeichnet hier das Leben des Menschen, das Gott beim Tod wegnimmt. „Das Leben“ vermeidet eine nicht erforderliche metaphysische Festlegung durch „Seele“.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: „Leben“ statt „Seele“
  alternative: „seine Seele“
  rationale: Der Vers spricht vom Tod und davon, dass Gott das Leben nimmt; er formuliert keine technische Lehre über die Beschaffenheit der Seele.
- issue: Subjekt und Sinn von יִבְצָע
  choice: Der Gottlose macht Gewinn, doch dieser gibt ihm angesichts des Todes keine Hoffnung.
  alternative: Gott schneidet ihn ab beziehungsweise rafft ihn dahin.
  rationale: Die hebräische Form und der knappe Satzbau lassen mehrere Deutungen zu. Die Hauptfassung folgt der geläufigen Bedeutung „Gewinn machen“, während die alternative, ebenfalls theologisch gewichtige Lesart ausdrücklich in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt knapp; „auch wenn“ macht den zugestandenen, aber letztlich wertlosen Gewinn verständlich. Die Mehrdeutigkeit der schwierigen mittleren Klausel wird nicht verdeckt, sondern in der Fußnote offengelegt.
