  text: עָשִׁ֣יר יִ֭שְׁכַּב וְ/לֹ֣א יֵאָסֵ֑ף עֵינָ֖י/ו פָּקַ֣ח וְ/אֵינֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/019.yaml
  text: He lies down rich[a], but he will not be gathered; he opens his eyes[b], and he is gone.
translation:
  language: de
  text: 'Reich legt er sich nieder, doch er wird nicht versammelt[a];

    er öffnet seine Augen – und ist nicht mehr.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »er wird nicht zu seinen Vorfahren versammelt«. Das Hebräische ist knapp und kann auf Tod und Bestattung anspielen, ohne dies ausdrücklich zu sagen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »und er ist nicht«; eine Wendung dafür, dass jemand verschwunden oder nicht mehr am Leben ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: reich
  rationale: Das Adjektiv wird prädikativ wiedergegeben und bewahrt so die knappe Form des Hebräischen, ohne ausdrücklich »ein reicher Mann« zu ergänzen.
- source_word: יִשְׁכַּב
  choice: legt er sich nieder
  rationale: שׁכב bedeutet grundlegend »sich hinlegen/niederlegen«. Das poetische Präsens gibt die Szene anschaulich wieder und lässt den im Kontext möglichen Zukunfts- oder Ergebnisbezug offen.
- source_word: וְלֹא יֵאָסֵף
  choice: doch er wird nicht versammelt
  rationale: Die passive Form von אסף kann schlicht »versammelt werden« bedeuten, aber auch auf Tod, Bestattung oder das Versammeltwerden zu den Vorfahren anspielen. Die knappe, mehrdeutige Formulierung bleibt im Haupttext erhalten; »doch« macht den Gegensatz deutlich.
- source_word: עֵינָיו פָּקַח
  choice: er öffnet seine Augen
  rationale: Die hebräische Voranstellung von »seine Augen« wird in natürliches modernes Deutsch überführt; der abrupte Szenenwechsel bleibt erhalten.
- source_word: וְאֵינֶנּוּ
  choice: und ist nicht mehr
  rationale: Wörtlich lautet die Wendung »und er ist nicht«. »Ist nicht mehr« ist eine geläufige deutsche Entsprechung für Verschwinden oder Tod und bewahrt den knappen, endgültigen Ton.
theological_decisions:
- issue: Bedeutung von »nicht versammelt werden«
  choice: Die unbestimmte passive Wendung bleibt stehen.
  alternative: »Er wird nicht zu seinen Vorfahren versammelt« oder »er wird nicht bestattet«
  rationale: Das Hebräische nennt weder die Vorfahren noch ausdrücklich eine Bestattung. Eine Ergänzung würde eine mögliche Todes- und Bestattungsanspielung zu stark festlegen.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die Inversion »Reich legt er sich nieder« bewahrt die Hervorhebung und Knappheit des Hebräischen; Gedankenstrich und Zeilenbruch geben den abrupten Umschlag wieder.
