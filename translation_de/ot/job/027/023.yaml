  text: Er klatscht über ihn in die Hände und zischt ihn von seinem Platz aus an.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „pfeift ihn an“. Das hebräische Verb kann Pfeifen oder Zischen bezeichnen; „zischt“ bringt hier den feindseligen Ton zum Ausdruck.'
