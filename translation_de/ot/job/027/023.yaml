  verdict: revise
  source_fidelity: Die Wiedergabe bewahrt das unausgesprochene maskuline Singularsubjekt, die Handgebärde, die gegen die betroffene Person gerichtete Lautäußerung und die Ortsangabe. „Über ihn in die Hände klatschen“ kann die Richtung von עָלֵימוֹ angemessen wiedergeben. Bei וְיִשְׁרֹק עָלָיו ist jedoch „jemandem zuzischen“ im Deutschen eher das leise Zusprechen von Worten und bildet die feindselig gegen ihn gerichtete Handlung weniger klar ab als „jemanden anzischen“.
  naturalness: „Er klatscht über ihn in die Hände“ ist als literarisch-würdige Formulierung verständlich. „… zischt ihm … zu“ ist dagegen semantisch missverständlich und stilistisch weniger treffend; „… zischt ihn … an“ ist im modernen Standarddeutsch die natürliche Form für ein feindseliges Zischen gegen eine Person.
  terminology: Die Begriffe „klatscht“, „zischt“ und „Platz“ sind angemessen. Die Fußnoten erhalten sowohl die lexikalische Alternative zu שרק als auch die bewusst offengelassene Subjektidentität. Die Alternative sollte nicht „pfeift ihm zu“ lauten, da dies im Deutschen leicht einen freundlichen oder anfeuernden Sinn annimmt.
