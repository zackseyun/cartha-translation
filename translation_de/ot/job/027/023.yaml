lexical_decisions:
- source_word: יִשְׂפֹּק
  choice: klatscht
  rationale: שׂפק bezeichnet im Qal hier zusammen mit כפים das Schlagen beziehungsweise Klatschen der Hände. „Klatscht … in die Hände“ bewahrt die konkrete Gebärde, ohne ihren genauen Beweggrund festzulegen.
- source_word: עָלֵימוֹ
  choice: über ihn
  rationale: על mit Suffix kann „über“, „gegen“ oder in einer Zielrichtung „auf jemanden hin“ bedeuten. „Über ihn“ passt zur deutschen Wendung „über jemanden in die Hände klatschen“ und wahrt die feindselige Ausrichtung.
- source_word: כַפֵּימוֹ
  choice: in die Hände
  rationale: כף bedeutet wörtlich „Handfläche“, bezeichnet im Plural mit Suffix aber idiomatisch die Hände. Im Deutschen lautet die natürliche Wendung „in die Hände klatschen“.
- source_word: וְיִשְׁרֹק
  choice: und zischt
  rationale: שרק kann Pfeifen oder Zischen bezeichnen. Im feindseligen Kontext gibt „zischt“ den abwertenden Klang gut wieder; „pfeift“ bleibt als Alternative in der Fußnote erhalten.
- source_word: עָלָיו
  choice: ihm … zu
  rationale: על mit Suffix kennzeichnet hier das Ziel der Lautäußerung. Das deutsche „jemandem zuzischen“ gibt diese Richtung idiomatisch wieder.
- source_word: מִמְּקֹמוֹ
  choice: von seinem Platz aus
  rationale: מקום bedeutet allgemein „Ort“ oder „Platz“. Die Formulierung bleibt konkret und lässt offen, was für ein Aufenthaltsort gemeint ist.
theological_decisions:
- issue: Identität des unausgesprochenen Subjekts
  choice: Das männliche Singularpronomen „er“ wird beibehalten, ohne den Handelnden näher zu bestimmen.
  alternative: Als Subjekt könnten Gott, andere Menschen oder im Zusammenhang eine unpersönliche Macht beziehungsweise der Ostwind verstanden werden.
  rationale: Im Hebräischen stehen Verben in der dritten Person Maskulinum Singular, aber kein ausdrückliches Subjekt. Da der Vers dessen Identität nicht eindeutig festlegt, bewahrt die Übersetzung diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Formulierung vermeidet unnötige Wörtlichkeit, bewahrt aber die konkreten Gesten und die Mehrdeutigkeit des Subjekts.
