source:
  edition: WLC
  text: אִם יִרְבּ֣וּ בָנָ֣י/ו לְמוֹ חָ֑רֶב וְ֝/צֶאֱצָאָ֗י/ו לֹ֣א יִשְׂבְּעוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/014.yaml
  text: If his sons multiply[a], it is for the sword, and his descendants will not be satisfied with bread.
translation:
  language: de
  text: Wenn seine Söhne zahlreich werden, sind sie für das Schwert bestimmt, und seine Nachkommen werden vom Brot nicht satt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Sie werden nicht genug zu essen haben. Wörtlich steht im Hebräischen, dass sie vom Brot nicht satt werden.'
    reason: Erläuterung der hebräischen Wendung für unzureichende Nahrung.
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet am natürlichsten einen Bedingungssatz ein; die grundsätzlich mögliche zeitliche Nuance bleibt im Deutschen mitschwingend.
- source_word: יִרְבּוּ
  choice: zahlreich werden
  rationale: Gibt die Zunahme an Zahl idiomatisch und ohne die im Deutschen missverständliche Formulierung „sich vermehren“ wieder.
- source_word: בָנָיו
  choice: seine Söhne
  rationale: Bewahrt die ausdrücklich maskuline Pluralform des Hebräischen.
- source_word: לָמוֹ חָרֶב
  choice: sind sie für das Schwert bestimmt
  rationale: Drückt die Bestimmung zum Tod durch Krieg oder Gewalt aus und bewahrt zugleich das konkrete Bild des Schwertes.
- source_word: וְצֶאֱצָאָיו
  choice: und seine Nachkommen
  rationale: Bezeichnet die weitere Nachkommenschaft und ist im modernen Deutschen natürlich.
- source_word: לֹא יִשְׂבְּעוּ
  choice: werden … nicht satt
  rationale: Entspricht der Grundbedeutung „satt/gesättigt sein“ und lässt den Mangel an ausreichender Nahrung erkennen.
- source_word: לָחֶם
  choice: vom Brot
  rationale: Bewahrt das konkrete hebräische Wort „Brot“, das hier zugleich für Nahrung stehen kann.
theological_decisions: []
