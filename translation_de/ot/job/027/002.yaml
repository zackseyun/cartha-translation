  yaml_path: translation/ot/job/027/002.yaml
  text: As God lives[a], who has taken away my justice, and the Almighty, who has made my soul bitter[b],
translation:
  language: de
  text: So wahr Gott lebt, der mir mein Recht entzogen hat[a], und der Allmächtige, der meine Seele verbittert hat[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der mir Gerechtigkeit verweigert“ oder „der mir meinen Rechtsanspruch entzogen hat“. Das hebräische מִשְׁפָּט kann Recht, Gerechtigkeit, Urteil oder einen berechtigten Anspruch bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der mein Leben verbittert hat“ oder einfach „der mich verbittert hat“. Das hebräische נֶפֶשׁ kann je nach Zusammenhang „Seele“, „Leben“ oder die eigene Person bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אֵל
  choice: So wahr Gott lebt
  rationale: Die Verbindung חַי mit einem Gottestitel ist eine Schwurformel. „So wahr Gott lebt“ gibt ihre Funktion im Deutschen natürlich und feierlich wieder.
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier innerhalb der Schwurformel der allgemeine Gottestitel „Gott“, kein zu transkribierender Eigenname.
- source_word: הֵסִיר
  choice: entzogen hat
  rationale: Der Hifil von סור bedeutet „entfernen, wegnehmen“. Zusammen mit מִשְׁפָּטִי drückt „mein Recht entzogen“ idiomatisch aus, dass Hiob sich seines berechtigten Anspruchs beraubt sieht.
- source_word: מִשְׁפָּטִי
  choice: mein Recht
  rationale: מִשְׁפָּט kann Recht, Rechtsanspruch, Urteil oder gerechte Entscheidung bezeichnen. „Mein Recht“ bewahrt im Deutschen sowohl den forensischen Kontext als auch Hiobs Klage über verweigerte Gerechtigkeit.
- source_word: וְשַׁדַּי
  choice: und der Allmächtige
  rationale: שַׁדַּי wird als Gottestitel bedeutungsgemäß mit „der Allmächtige“ wiedergegeben; das erhält den feierlichen Parallelismus.
- source_word: הֵמַר
  choice: verbittert hat
  rationale: Der Hifil von מרר bedeutet „bitter machen, verbittern“. Das deutsche Verb bewahrt das Bild und ist zugleich natürlich.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann Seele, Leben oder das eigene Selbst bezeichnen. „Meine Seele“ bewahrt die poetische Ausdrucksweise, ohne den möglichen Sinn „mein Leben/mich selbst“ auszuschließen; Alternativen werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe der Gottestitel אֵל und שַׁדַּי
  choice: Gott … der Allmächtige
  alternative: Gott … Schaddai
  rationale: Die Titel werden übersetzt statt transkribiert. Dadurch bleibt ihr Sinn für heutige Leser unmittelbar verständlich, während der feierliche Parallelismus der Schwurformel erhalten bleibt.
- issue: Hiobs Aussage, Gott habe ihm מִשְׁפָּט entzogen
  choice: der mir mein Recht entzogen hat
  alternative: der mir Gerechtigkeit verweigert hat
  rationale: Die Übersetzung lässt Hiobs scharfe Klage als seine eigene Aussage stehen und mildert die theologische Spannung nicht ab. Zugleich behauptet sie nicht erläuternd, dass Gott objektiv ungerecht sei.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der geläufigen Schwurformel „So wahr Gott lebt“. Der Satz bleibt wegen der Fortsetzung des Schwurs in den folgenden Versen syntaktisch offen und endet daher mit einem Komma. Die markante Klage Hiobs wird weder abgeschwächt noch dogmatisch aufgelöst.
