  yaml_path: translation/ot/job/027/010.yaml
  text: Will he delight himself in the Almighty? Will he call on God at all times?[a][b]
translation:
  language: de
  text: Hat er Freude am Allmächtigen? Ruft er Gott zu jeder Zeit an?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Wenn er am Allmächtigen Freude hat“; die hebräische Partikel leitet hier im Zusammenhang eine rhetorische Frage ein.'
    reason: lexical_alternative
  - marker: b
    text: „Anrufen“ kann hier auch mit „zu Gott rufen“ oder „zu Gott beten“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wird er …?
  rationale: In diesem Zusammenhang leitet אִם keine gewöhnliche Bedingung ein, sondern eine rhetorische Frage über den Gottlosen. Die deutsche Frageform gibt diese Funktion natürlich wieder.
- source_word: עַל
  choice: an
  rationale: Mit התענג bezeichnet עַל die Person, an der jemand Freude hat. „An … Freude haben“ ist im Deutschen idiomatisch und bedeutungsnah.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Der Gottesbeiname wird seiner Bedeutung entsprechend übersetzt, nicht als „Schaddai“ transkribiert.
- source_word: יִתְעַנָּג
  choice: Freude haben
  rationale: Der Hitpael von ענג bezeichnet, an jemandem oder etwas Gefallen beziehungsweise Freude zu finden. Die Formulierung ist natürlich und bewahrt den Sinn, ohne eine im Deutschen unnatürliche Reflexivkonstruktion zu erzwingen.
- source_word: יִקְרָא
  choice: anrufen
  rationale: קרא bezeichnet mit Gott als Bezugsgröße das Anrufen Gottes, besonders im Gebet. „Anrufen“ bewahrt die religiöse Bedeutung, ohne sie unnötig einzuengen.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Das singularische Gotteswort wird schlicht mit „Gott“ wiedergegeben; eine Erweiterung ist vom Hebräischen nicht gedeckt.
- source_word: בְּכָל עֵת
  choice: zu jeder Zeit
  rationale: Die Wendung bezeichnet ausnahmslose beziehungsweise beständige Regelmäßigkeit. „Zu jeder Zeit“ bildet die hebräische Ausdrucksweise klar und würdig ab.
theological_decisions:
- issue: Wiedergabe des Gottesbeinamens שַׁדַּי
  choice: der Allmächtige
  alternative: Schaddai
  rationale: Da es sich um einen Gottesbeinahmen beziehungsweise Titel handelt, wird er übersetzt. So bleibt seine Bedeutung für heutige Leser unmittelbar verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit parallelen rhetorischen Fragen. „Freude haben an“ klingt natürlicher als eine formal reflexive Wiedergabe; „anrufen“ erhält die knappe religiöse Aussage des Hebräischen.
