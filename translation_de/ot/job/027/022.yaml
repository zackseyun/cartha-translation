lexical_decisions:
- source_word: וְיַשְׁלֵךְ עָלָיו
  choice: Er schleudert gegen ihn
  rationale: Das Hifil von שלך bedeutet „werfen, schleudern“. Mit עָלָיו bezeichnet die Wendung eine feindliche, gegen den Betroffenen gerichtete Handlung. Da im Hebräischen kein ausdrückliches Objekt steht, lässt die Übersetzung ebenfalls offen, was geschleudert wird, und ergänzt weder „sich“ noch „Unheil“.
- source_word: וְלֹא יַחְמֹל
  choice: und verschont ihn nicht
  rationale: חמל kann „verschonen“ oder „Mitleid haben“ bedeuten. Im Zusammenhang des schonungslosen Gerichts gibt „verschont ihn nicht“ Bedeutung und Kürze treffend wieder.
- source_word: מִיָּדוֹ
  choice: vor seiner Hand
  rationale: יָד bedeutet wörtlich „Hand“ und kann zugleich Macht oder Gewalt bezeichnen. Die konkrete hebräische Bildsprache bleibt erhalten; „vor“ ist im Deutschen bei „fliehen“ idiomatisch.
- source_word: בָּרוֹחַ יִבְרָח
  choice: flieht er, ja, er flieht
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt den Vorgang. Die bewusste Wiederholung bildet diese Hervorhebung nach, ohne eine nicht ausdrücklich genannte Art oder Geschwindigkeit der Flucht hinzuzufügen.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts
  choice: Das Pronomen „Er“ bleibt ohne erklärende Identifizierung stehen.
  alternative: „Gott“ oder „der Ostwind“ ausdrücklich als Subjekt einsetzen.
  rationale: Der hebräische Vers nennt das Subjekt nicht erneut. Eine ausdrückliche Identifizierung würde die im Text und Zusammenhang bestehende Bezugsoffenheit vorschnell auflösen.
- issue: Reflexive oder nicht reflexive Deutung von וְיַשְׁלֵךְ
  choice: Kein reflexives „sich“ im Haupttext ergänzen.
  alternative: „Er wirft/stürzt sich auf ihn.“
  rationale: Das hebräische Verb ist hier nicht ausdrücklich reflexiv. Die mögliche Deutung als gewaltsames Sich-Stürzen wird in der Fußnote genannt, aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leichte Ungewöhnlichkeit von „schleudert gegen ihn“ bewahrt die Objektauslassung und Deutungsoffenheit des Hebräischen; die verstärkende Wiederholung am Versende bildet dessen rhetorischen Nachdruck ab.
