  text: וַ/יֹּ֣סֶף אִ֭יּוֹב שְׂאֵ֥ת מְשָׁל֗/וֹ וַ/יֹּאמַֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/001.yaml
  text: And Job again took up his discourse and said:[a]
translation:
  language: de
  text: Und Hiob nahm erneut seine Rede auf und sagte:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinen Spruch«, »sein Gleichnis« oder »seinen Ausspruch«; das hebräische Wort kann verschiedene Arten gewichtiger oder bildhafter Rede bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: erneut
  rationale: Das Verb יסף bedeutet wörtlich »hinzufügen« oder »fortfahren«. Zusammen mit dem Infinitiv שׂאת bezeichnet es hier die erneute beziehungsweise fortgesetzte Aufnahme einer feierlichen Rede.
- source_word: שְׂאֵת
  choice: erhob
  rationale: Der Infinitiv von נשׂא bedeutet grundsätzlich »heben, tragen«. In der Verbindung שׂאת משל ist »eine Rede erheben« eine gehobene, im Deutschen verständliche Wiedergabe, die das hebräische Bild bewahrt.
- source_word: מְשָׁלוֹ
  choice: seine Rede
  rationale: מָשָׁל kann Spruch, Gleichnis, Spottlied oder eine gewichtige poetische Rede bezeichnen. Da hier eine längere poetische Äußerung Hiobs folgt, passt »Rede« im Kontext am besten; die weitere Bedeutungsbreite wird in der Fußnote erhalten.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die gewöhnliche narrative Form von אמר leitet den Wortlaut der folgenden Rede ein und wird direkt wiedergegeben.
- source_word: אִיּוֹב
  choice: Hiob
  rationale: Der Personenname wird gemäß der im Deutschen etablierten biblischen Namensform wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Erhob seine Rede« bewahrt bewusst die Bildsprache und den feierlich-poetischen Charakter des hebräischen Ausdrucks, ohne unnötig altertümlich zu wirken.
