  yaml_path: translation/ot/job/027/015.yaml
  text: Those who survive him will be buried by death[a], and his widows will not weep.
translation:
  language: de
  text: Die ihn überleben, werden vom Tod begraben werden[a], und seine Witwen werden nicht weinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werden im Tod begraben werden«. Die hebräische Wendung ist knapp und kann die Art beziehungsweise das Schicksal des Begräbnisses oder ein Begraben inmitten des Todes ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִידוֹ
  choice: die ihn überleben
  rationale: Das Substantiv bezeichnet die Übriggebliebenen beziehungsweise Überlebenden. Trotz der Singularform mit Suffix ist es hier kollektiv gebraucht, wie das folgende Verb im Plural zeigt.
- source_word: בַּמָּוֶת
  choice: vom Tod
  rationale: Die Präposition ב kann hier ein Mittel beziehungsweise eine schicksalhafte Begleitumständlichkeit ausdrücken. »Vom Tod« bewahrt die markante Personifizierung und die gedrängte Ausdrucksweise des Hebräischen.
- source_word: יִקָּבֵרוּ
  choice: werden begraben werden
  rationale: Der Nifal-Imperfekt von קבר ist passiv und bedeutet »begraben werden«.
- source_word: וְאַלְמְנֹתָיו
  choice: und seine Witwen
  rationale: אַלְמָנָה bedeutet »Witwe«; der Plural mit Suffix verweist auf die Frauen, die durch die hier vorausgesetzten Todesfälle zu Witwen geworden sind.
- source_word: לֹא תִבְכֶּינָה
  choice: werden nicht weinen
  rationale: בכה bezeichnet konkret das Weinen; diese Wiedergabe ist präziser als das weiter gefasste »trauern«.
