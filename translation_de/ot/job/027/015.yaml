  verdict: approve
  source_fidelity: Die Übersetzung gibt die kollektive Bedeutung von שָׂרִידוֹ angemessen wieder und bewahrt den Plural des folgenden Verbs. »vom Tod begraben« hält die ungewöhnliche, verdichtete Verbindung בַּמָּוֶת mit »begraben werden« sichtbar, ohne die umstrittene Nuance einseitig aufzulösen; die Fußnote dokumentiert die naheliegende Alternative »im Tod«. Auch »seine Witwen werden nicht weinen« entspricht dem hebräischen Wortlaut und seiner schroffen Aussage.
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. Die doppelte Zukunftsform in »werden ... begraben werden« ist grammatisch korrekt. Die Formulierung »vom Tod begraben« ist bewusst hart und leicht poetisch, aber für den poetischen Hiobtext gut vertretbar und verständlich.
  terminology: »Witwen« und »weinen« sind präzise und registergerecht. »Die ihn überleben« macht die relationale Suffixbedeutung idiomatischer deutlich als ein möglicherweise missverständliches »seine Übriggebliebenen«.
