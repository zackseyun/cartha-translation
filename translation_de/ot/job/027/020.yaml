  text: תַּשִּׂיגֵ֣/הוּ כַ֭/מַּיִם בַּלָּה֑וֹת לַ֝֗יְלָה גְּנָבַ֥תּ/וּ סוּפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/020.yaml
  text: Terrors overtake him like waters[b][a]; in the night a storm steals him away.
translation:
  language: de
  text: Schrecken ereilen ihn wie Wassermassen[a]; in der Nacht stiehlt ihn ein Sturm[b] fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie Fluten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ein Sturmwind« oder »ein Wirbelsturm«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשִּׂיגֵהוּ
  choice: ereilen ihn
  rationale: Die Hifil-Form von נשׂג beschreibt hier, wie die Schrecken ihn einholen. »Ereilen« ist im Deutschen natürlich und bewahrt das Bild eines Unheils, das sein Opfer erreicht.
- source_word: כַמַּיִם
  choice: wie Wassermassen
  rationale: Der hebräische Plural bezeichnet überwältigendes Wasser. »Wassermassen« gibt diese Kraft in natürlichem Deutsch wieder, ohne das Bild ausdrücklich auf eine bestimmte Art von Flut festzulegen.
- source_word: בַּלָּהוֹת
  choice: Schrecken
  rationale: בלהות bezeichnet furchterregende, plötzlich hereinbrechende Schrecken. Die knappe Wiedergabe passt zum poetischen Gerichtskontext.
- source_word: לַיְלָה
  choice: in der Nacht
  rationale: Das Substantiv wird adverbial gebraucht; »in der Nacht« ist eine direkte und idiomatische Wiedergabe.
- source_word: גְּנָבַתּוּ
  choice: stiehlt ihn fort
  rationale: Das Verb גנב bedeutet grundsätzlich »stehlen«. Die Formulierung bewahrt das Bild, dass der Sturm ihn unvermittelt und gleichsam heimlich wegnimmt.
- source_word: סוּפָה
  choice: ein Sturm
  rationale: סופה bezeichnet einen heftigen Sturm oder Sturmwind. »Sturm« ist die klare, nicht unnötig spezifizierende deutsche Entsprechung.
