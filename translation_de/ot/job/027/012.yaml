  language: de
  text: Seht, ihr alle habt es gesehen; warum redet ihr dann so leeres Zeug?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum handelt ihr dann so vergeblich?“ Das Hebräische verbindet הֶבֶל („Nichtigkeit, Leere, Vergeblichkeit“) mit einem stammverwandten Verb und erzeugt damit ein nachdrückliches Wortspiel. Die genaue Bedeutung des Verbs ist unsicher; es kann sich auf leere Rede oder allgemeiner auf vergebliches Handeln beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel leitet eine nachdrückliche Feststellung ein; „Seht“ ist im Deutschen würdig und verständlich.
- source_word: אַתֶּם כֻּלְּכֶם
  choice: ihr alle
  rationale: Gibt die ausdrücklich genannte zweite Person Plural samt umfassender Betonung wieder.
- source_word: חֲזִיתֶם
  choice: habt es gesehen
  rationale: חזה bezeichnet hier eigenes Sehen beziehungsweise Wahrnehmen; das Perfekt passt zum vorausgesetzten bereits Erkannten.
- source_word: וְלָמָּה
  choice: Warum … dann
  rationale: „Dann“ macht den folgernden Zusammenhang zwischen ihrem Sehen und Hiobs Vorwurf natürlich deutlich.
- source_word: זֶּה
  choice: so völlig
  rationale: זה verstärkt hier wahrscheinlich die Verbindung aus Nomen und stammverwandtem Verb; „so völlig“ wahrt diese Intensität, ohne es als gegenständliches „dies“ zu missdeuten.
- source_word: הֶבֶל תֶּהְבָּלוּ
  choice: redet ihr … nichtig
  rationale: Nomen und stammverwandtes Verb aus הבל bilden ein nachdrückliches Wortspiel. Im Kontext der Reden richtet sich der Vorwurf am ehesten gegen ihr nichtiges Reden; die Fußnote hält die breitere Deutung offen.
theological_decisions:
- issue: Bezug der Nichtigkeit auf Rede, Verhalten oder Zustand
  choice: redet ihr … nichtig
  alternative: werdet ihr … nichtig / verhaltet ihr euch so nichtig
  rationale: Der unmittelbare Gesprächskontext begünstigt den Bezug auf das Reden, doch die seltene stammverwandte Konstruktion legt die genaue Bedeutungsnuance nicht eindeutig fest; deshalb wird die Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Seht“ bewahrt den aufmerksamkeitslenkenden Ton; „nichtig“ entspricht dem hebräischen Bildfeld von Leere und Vergeblichkeit. Die ungewöhnliche Wiederholung des Stammes הבל wird soweit möglich durch „völlig nichtig“ nachgebildet und in der Fußnote erläutert.
