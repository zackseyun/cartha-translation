  text: בָּנָ֣ה כָ/עָ֣שׁ בֵּית֑/וֹ וּ֝/כְ/סֻכָּ֗ה עָשָׂ֥ה נֹצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/018.yaml
  text: He builds his house like a moth[a], like a shelter that a watchman makes.
translation:
  language: de
  text: Er baut sein Haus wie eine Motte[a], wie eine Hütte, die ein Wächter errichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie eine Made«. Das hebräische Wort bezeichnet gewöhnlich eine Motte, kann lexikalisch jedoch auch als Made verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָה
  choice: baut
  rationale: Das Qal-Perfekt bezeichnet hier im poetischen Zusammenhang ein charakteristisches Tun; das deutsche Präsens gibt diese allgemeine Aussage natürlich wieder.
- source_word: כָעָשׁ
  choice: wie eine Motte
  rationale: עָשׁ bezeichnet gewöhnlich eine Motte. Das Bild hebt die Zerbrechlichkeit und Vergänglichkeit des gebauten Hauses hervor; die ungewöhnliche Bildsprache bleibt erhalten.
- source_word: בֵּיתוֹ
  choice: sein Haus
  rationale: Der Parallelismus mit der vorübergehend errichteten Hütte spricht für ein Bauwerk und nicht für die übertragene Bedeutung »Hausstand« oder »Familie«.
- source_word: וּכְסֻכָּה
  choice: wie eine Hütte
  rationale: סֻכָּה ist eine einfache, vorübergehend genutzte Schutz- oder Wachhütte. »Hütte« ist im modernen Deutsch klar und bewahrt den provisorischen Charakter.
- source_word: עָשָׂה
  choice: errichtet
  rationale: Das Verb עשה bedeutet allgemein »machen«; bei einer Hütte ist »errichten« idiomatisch und nimmt zugleich den Baugedanken der ersten Vershälfte auf.
- source_word: נֹצֵר
  choice: ein Wächter
  rationale: Das Partizip bezeichnet jemanden, der wacht oder bewacht, hier wahrscheinlich einen Feld- oder Weinbergwächter, der eine vorübergehende Hütte nutzt.
theological_decisions: []
