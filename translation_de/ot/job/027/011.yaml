  text: אוֹרֶ֣ה אֶתְ/כֶ֣ם בְּ/יַד אֵ֑ל אֲשֶׁ֥ר עִם שַׁ֝דַּ֗י לֹ֣א אֲכַחֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/011.yaml
  text: I will teach you concerning the hand of God[b][a]; what is with the Almighty I will not hide.
translation:
  language: de
  text: Ich will euch über die Hand Gottes unterweisen[a]; was beim Allmächtigen ist, will ich nicht verbergen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über Gottes Hand“. Die Wendung kann Gottes Macht, Wirken oder Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung ist knapp und mehrdeutig; möglich sind auch: „was dem Allmächtigen gehört“, „der Ratschluss des Allmächtigen“ oder „was vom Allmächtigen kommt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹרֶה
  choice: Ich will … unterweisen
  rationale: Das Hifil Imperfekt 1. Person Singular von ירה bezeichnet hier das Unterrichten. „Ich will“ gibt die ankündigende Aussage wieder; „unterweisen“ passt zum würdigen Kontext.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Direktes Objektpronomen der 2. Person maskulin Plural; im modernen Standarddeutsch natürlich mit „euch“ wiedergegeben.
- source_word: בְּיַד אֵל
  choice: über die Hand Gottes
  rationale: ב wird als Angabe des Unterrichtsgegenstands verstanden. Die Metapher „Hand Gottes“ bleibt erhalten und kann Gottes Macht, Wirken oder Handeln umfassen.
- source_word: אֵל
  choice: Gott
  rationale: אֵל fungiert hier als Gottesbezeichnung; „Gott“ ist die klare und übliche deutsche Wiedergabe.
- source_word: אֲשֶׁר עִם שַׁדַּי
  choice: was beim Allmächtigen ist
  rationale: Die knappe, elliptische Relativkonstruktion wird bewusst nicht zu „Ratschluss“, „Absicht“ oder „Wege“ präzisiert. „Beim“ ist im Deutschen verständlicher als das streng wörtliche „mit“, ohne die offene Bedeutung stark einzuengen.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Übliche deutsche Wiedergabe des in Hiob häufigen Gottestitels שַׁדַּי.
- source_word: לֹא אֲכַחֵד
  choice: will ich nicht verbergen
  rationale: Das Piel von כחד bedeutet hier „verbergen“ oder „verschweigen“. „Nicht verbergen“ bewahrt die Formulierung des Ausgangstextes und passt zu Hiobs angekündigter Unterweisung.
theological_decisions:
- issue: Göttliches Handeln in der Wendung „Hand Gottes“
  choice: Die Metapher „die Hand Gottes“ wird beibehalten.
  alternative: Gottes Macht; Gottes Wirken; was Gott tut
  rationale: Die bildhafte Wendung kann Macht, Tätigkeit oder konkrete Verfahrensweise Gottes bezeichnen. Eine ausdeutende Übersetzung würde diese theologische Bedeutungsbreite unnötig verengen.
- issue: Bedeutung der elliptischen Wendung אֲשֶׁר עִם שַׁדַּי
  choice: „was beim Allmächtigen ist“ bleibt inhaltlich offen.
  alternative: der Ratschluss des Allmächtigen; was dem Allmächtigen gehört; was vom Allmächtigen kommt
  rationale: Der hebräische Text nennt keinen ausdrücklichen Gegenstand wie Ratschluss, Absicht oder Gericht. Die offene Wiedergabe bewahrt diese Unbestimmtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unterweisen“ wahrt den lehrhaften Ton, ohne unnötig altertümlich zu wirken. Die beiden zentralen hebräischen Bilder beziehungsweise Ellipsen werden nicht auslegend aufgelöst.
