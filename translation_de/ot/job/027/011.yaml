  terminology: „Gott“ für אֵל und „der Allmächtige“ für שַׁדַּי sind etablierte, registergerechte Wiedergaben. Die Fußnoten erläutern die Bildsprache und die semantische Offenheit, ohne diese konfessionell oder auslegend festzulegen. Die Anker stehen an den jeweils erläuterten Wendungen.
