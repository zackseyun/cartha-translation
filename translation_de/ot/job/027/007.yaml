base_translation:
  language: en
  yaml_path: translation/ot/job/027/007.yaml
  text: May my enemy be like the wicked[a], and the one who rises against me like the unrighteous.
translation:
  language: de
  text: Möge mein Feind wie ein Gottloser sein[a], und wer sich gegen mich erhebt, wie ein Ungerechter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im Sinn des Ergehens: „Möge es meinem Feind ergehen wie einem Gottlosen und meinem Widersacher wie einem, der Unrecht tut.“'
    reason: Die knappe hebräische Vergleichskonstruktion kann den Charakter beziehungsweise Status der Gegner bezeichnen oder, im Kontext, ihr entsprechendes Ergehen einschließen.
lexical_decisions:
- source_word: יְהִי
  choice: soll dastehen
  rationale: Der Qal-Jussiv von היה drückt hier einen Wunsch oder eine Verwünschung aus. „Soll dastehen“ gibt diese volitive Kraft natürlich wieder und bezeichnet den erhofften Status beziehungsweise Ausgang des Feindes.
- source_word: כְרָשָׁע
  choice: wie ein Gottloser
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich; רָשָׁע bezeichnet einen schuldigen, bösen oder gottlosen Menschen. „Wie ein Gottloser“ bewahrt die personenbezogene moralische Kategorie, ohne sie auf ein bestimmtes Vergehen einzuengen.
- source_word: אֹיְבִי
  choice: mein Feind
  rationale: Das Substantiv אֹיֵב mit Suffix der ersten Person Singular bedeutet direkt „mein Feind“.
- source_word: וּמִתְקוֹמְמִי
  choice: und wer sich gegen mich erhebt
  rationale: Die Partizipialform von קום beschreibt jemanden, der sich feindlich gegen den Sprecher stellt. Die verbale Wiedergabe bewahrt das Bild des Sich-Erhebens besser als das knappe „mein Widersacher“.
- source_word: כְעַוָּל
  choice: wie ein Ungerechter
  rationale: עַוָּל bezeichnet einen Menschen, der durch Unrecht gekennzeichnet ist. „Ein Ungerechter“ hält den Personenbezug fest und bildet eine natürliche Parallele zu „ein Gottloser“.
theological_decisions:
- issue: Reichweite der Verwünschung
  choice: Die jussivische Aussage bleibt als Wunsch nach Gleichstellung beziehungsweise gleichem Ergehen formuliert.
  alternative: Eine direkte Behauptung, der Feind sei bereits gottlos und ungerecht.
  rationale: Der hebräische Jussiv יְהִי und die beiden Vergleichspartikeln כְּ sprechen für einen Wunsch oder eine Verwünschung, nicht für eine schlichte Identifikation.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und das Bild des Sich-Erhebens wurden bewahrt; „Gottloser“ und „Ungerechter“ geben die beiden verwandten, aber nicht völlig identischen moralischen Bezeichnungen wieder.
