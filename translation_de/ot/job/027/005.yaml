base_translation:
  language: en
  yaml_path: translation/ot/job/027/005.yaml
  text: Far be it from me to declare you right[a]; until I die[b], I will not remove my integrity from myself.
translation:
  language: de
  text: Es sei fern von mir, euch recht zu geben[a]! Bis ich sterbe, lasse ich meine Lauterkeit[b] nicht von mir weichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch für gerecht zu erklären“ oder „euch für im Recht befindlich zu erklären“. Das hebräische Verb hat hier einen forensischen Sinn: Jemand wird als im Recht befindlich erklärt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Unsträflichkeit“ oder „Schuldlosigkeit“. Der hebräische Ausdruck kann in Hiobs Selbstverteidigung moralische Lauterkeit oder Unbescholtenheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Es sei fern von mir
  rationale: Die feste deutsche Wendung gibt die nachdrückliche Zurückweisung des hebräischen Ausrufs würdig und natürlich wieder.
- source_word: אִם אַצְדִּיק אֶתְכֶם
  choice: euch recht zu geben
  rationale: Der Hifil von צדק bezeichnet hier, jemanden für im Recht zu erklären. Im Streitgespräch drückt „euch recht zu geben“ diesen forensischen Sinn verständlich und idiomatisch aus; die Fußnote bewahrt die wörtlicheren Möglichkeiten.
- source_word: עַד אֶגְוָע
  choice: Bis ich sterbe
  rationale: גוע bezeichnet das Sterben beziehungsweise Verscheiden. Die schlichte Formulierung ist klar, feierlich und nicht unnötig archaisch.
- source_word: לֹא אָסִיר
  choice: lasse … nicht … weichen
  rationale: Die Formulierung bewahrt das konkrete Bild des Entfernens oder Abwendens, klingt im Deutschen mit „von mir“ jedoch natürlicher als eine starre Wiedergabe mit „entfernen“.
- source_word: תֻּמָּתִי
  choice: meine Lauterkeit
  rationale: תֻּמָּה bezeichnet in Hiobs Selbstverteidigung seine moralische Unbescholtenheit und innere Redlichkeit. „Lauterkeit“ wahrt diese Bedeutungsbreite, ohne absolute Sündlosigkeit zu behaupten.
- source_word: מִמֶּנִּי
  choice: von mir
  rationale: Die ausdrückliche hebräische Präpositionalfügung bleibt erhalten und verbindet sich im Deutschen idiomatisch mit „weichen lassen“.
theological_decisions:
- issue: Art von Hiobs Aussage über seinen moralischen Zustand
  choice: „meine Lauterkeit“ als Beharren auf moralischer Integrität
  alternative: „meine Schuldlosigkeit“ oder „meine Unsträflichkeit“
  rationale: Hiob weigert sich, den Vorwürfen seiner Freunde zuzustimmen, und hält an seiner Lauterkeit fest. Die Wiedergabe verschärft seine Aussage weder zu einer Behauptung absoluter Sündlosigkeit noch schwächt sie sie zu bloßer subjektiver Aufrichtigkeit ab.
- issue: Bedeutung der Rechtfertigung der Freunde
  choice: „euch recht zu geben“
  alternative: „euch für gerecht zu erklären“
  rationale: Der Zusammenhang ist ein Rechts- und Streitgespräch. Die gewählte Formulierung lässt erkennen, dass Hiob den Freunden nicht zugesteht, mit ihrem Urteil über ihn im Recht zu sein, ohne den Ausdruck auf eine spätere dogmatische Verwendung von „rechtfertigen“ festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Der erste Satz bleibt nachdrücklich, der zweite bewahrt durch „von mir weichen“ das konkrete hebräische Bild, ohne im Deutschen hölzern zu wirken.
