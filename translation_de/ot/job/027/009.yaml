  text: הַֽ֭/צַעֲקָת/וֹ יִשְׁמַ֥ע אֵ֑ל כִּֽי תָב֖וֹא עָלָ֣י/ו צָרָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/009.yaml
  text: Will God hear his cry when distress comes upon him?[a][b][c]
translation:
  language: de
  text: Wird Gott sein Schreien[a] hören, wenn[b] die Not[c] über ihn kommt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „seinen Hilferuf“ oder „seinen Schrei“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „falls“; die hebräische Konjunktion kann hier konditional verstanden werden, doch „wenn“ passt gut zum Zusammenhang.'
    reason: alternative_reading
  - marker: c
    text: „Not“ kann auch mit „Bedrängnis“, „Unglück“ oder „Drangsal“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצַּעֲקָתוֹ
  choice: sein Schreien
  rationale: צְעָקָה bezeichnet einen dringlichen Schrei oder Hilferuf aus Bedrängnis. „Sein Schreien“ ist im Deutschen natürlich und bewahrt die Eindringlichkeit, ohne den Ausdruck vorschnell als ausdrücklich formulierte Bitte festzulegen.
- source_word: יִשְׁמַע
  choice: wird … hören
  rationale: 'Das Yiqtol ist im Zusammenhang als futurisch gefärbte rhetorische Frage verständlich: Ob Gott den Betreffenden in eintretender Not hören wird.'
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet hier Gott; „Gott“ ist die klare und übliche deutsche Wiedergabe.
- source_word: כִּי
  choice: wenn
  rationale: 'כִּי lässt sich hier gut temporal verstehen: Gott soll ihn hören, wenn die Not eintritt. Die konditionale Lesart „falls“ bleibt möglich und wird in einer Fußnote genannt.'
- source_word: תָבוֹא
  choice: kommt
  rationale: בוא bedeutet grundlegend „kommen“. Die Wendung „Not kommt über jemanden“ gibt das hebräische Bild verständlich und relativ formnah wieder.
- source_word: עָלָיו
  choice: über ihn
  rationale: Bei בוא mit עַל bezeichnet die Präposition, dass etwas über jemanden kommt beziehungsweise ihn trifft.
- source_word: צָרָה
  choice: Not
  rationale: צָרָה umfasst Bedrängnis, Not und Unglück. „Not“ ist knapp, idiomatisch und lässt sowohl äußere Bedrängnis als auch die daraus entstehende Belastung zu.
theological_decisions:
- issue: Rhetorische Frage nach Gottes Hören
  choice: Die Frage bleibt unverändert rhetorisch und wird nicht durch eine ausdrückliche Verneinung ergänzt.
  alternative: „Gott wird sein Schreien nicht hören …“
  rationale: Der hebräische Text formuliert eine Frage. Der Zusammenhang legt zwar eine erwartete negative Antwort nahe, doch sollte diese nicht in den Wortlaut eingefügt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt natürlich, während die knappe rhetorische Form und das Bild der über jemanden kommenden Not erhalten werden.
