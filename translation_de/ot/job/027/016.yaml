base_translation:
  language: en
  yaml_path: translation/ot/job/027/016.yaml
  text: Though he heaps up silver like dust and prepares clothing like clay[b][a],
translation:
  language: de
  text: Auch wenn er Silber wie Staub anhäuft und Kleidung[b] wie Lehm bereithält,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn er Silber wie Staub anhäuft und Kleidung wie Lehm bereithält.“ Die hebräische Partikel אִם kann konditional („wenn“) oder konzessiv („auch wenn“) verstanden werden; die konzessive Bedeutung passt zum Gedankengang des Zusammenhangs.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Gewänder“ statt „Kleidung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Auch wenn
  rationale: Die Partikel kann eine Bedingung („wenn“) oder hier im Zusammenhang eine Einräumung („auch wenn“) ausdrücken. Die konzessive Wiedergabe passt zum folgenden Gedanken, dass der angehäufte Besitz dem Gottlosen letztlich nicht bleibt.
- source_word: יִצְבֹּר
  choice: anhäuft
  rationale: Das Verb צבר bezeichnet das Zusammentragen zu einem Haufen beziehungsweise das Anhäufen und bewahrt so das konkrete Bild des Staubes.
- source_word: כֶּעָפָר
  choice: wie Staub
  rationale: Die Präposition כ kennzeichnet den Vergleich; „wie Staub“ erhält das poetische Bild einer kaum zählbaren Menge.
- source_word: כָּסֶף
  choice: Silber
  rationale: Das Wort kann Silber als Edelmetall und damit auch Geld bezeichnen. Die konkrete Wiedergabe „Silber“ bewahrt die Bildsprache.
- source_word: וְכַחֹמֶר
  choice: und … wie Lehm
  rationale: חֹמֶר bezeichnet hier am ehesten Lehm oder Ton. „Lehm“ vermittelt im Vergleich eine gewöhnliche, reichlich vorhandene Masse; „Mörtel“ wäre kontextuell weniger wahrscheinlich.
- source_word: יָכִין
  choice: bereitstellt
  rationale: Der Hifil von כון bedeutet hier, etwas herzurichten oder bereitzuhalten. „bereitstellt“ ist im Deutschen natürlich und passt zu Kleidung als angehäuftem Besitz.
- source_word: מַלְבּוּשׁ
  choice: Kleidung
  rationale: Das Substantiv kann kollektiv Kleidung oder einzelne Kleidungsstücke beziehungsweise Gewänder bezeichnen. „Kleidung“ gibt den kollektiven Sinn in modernem Deutsch wieder.
theological_decisions:
- issue: Funktion von אִם im Zusammenhang
  choice: 'konzessiv: „Auch wenn“'
  alternative: 'konditional: „Wenn“'
  rationale: Der Fortgang in Vers 17 nimmt die Möglichkeit des Anhäufens auf und stellt ihr den Verlust des Besitzes gegenüber. Die konzessive Fassung bildet diesen argumentativen Gegensatz gut ab, ohne die grammatisch mögliche konditionale Lesart zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener poetischer Bildsprache. Der Satz bleibt durch das abschließende Komma bewusst zum folgenden Vers hin geöffnet.
