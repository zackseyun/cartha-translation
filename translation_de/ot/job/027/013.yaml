  text: זֶ֤ה חֵֽלֶק אָדָ֖ם רָשָׁ֥ע עִם אֵ֑ל וְֽ/נַחֲלַ֥ת עָ֝רִיצִ֗ים מִ/שַּׁדַּ֥י יִקָּֽחוּ׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/013.yaml
  text: 'This is the portion of a wicked man with God[c][b][a], and the inheritance that the ruthless receive from the Almighty:'
translation:
  language: de
  text: 'Das ist der Anteil eines gottlosen Menschen bei Gott[a] und das Erbe, das Gewalttätige[b] vom Allmächtigen empfangen[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Bei Gott“ kann hier sinngemäß auch „von Gott“ bedeuten, also den Anteil, den Gott dem gottlosen Menschen zuteilt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Rücksichtslose“ beziehungsweise „Gewalttäter“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „nehmen“. Im Zusammenhang mit Anteil und Erbe ist hier das Empfangen eines zugeteilten Geschicks gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Das ist
  rationale: Das Demonstrativpronomen eröffnet eine zusammenfassende Aussage; im Deutschen wird die Kopula natürlich ergänzt.
- source_word: חֵלֶק
  choice: Anteil
  rationale: „Anteil“ bezeichnet hier das einem Menschen zufallende Geschick und bleibt vom folgenden „Erbe“ unterscheidbar.
- source_word: אָדָם רָשָׁע
  choice: eines gottlosen Menschen
  rationale: Die Formulierung gibt den generischen Singular natürlich wieder; „gottlos“ ist im Kontext der Weisheitsliteratur eine geläufige Wiedergabe von רָשָׁע.
- source_word: עִם אֵל
  choice: bei Gott
  rationale: „Bei Gott“ bewahrt die Grundbedeutung der Präposition עִם, ohne die mögliche idiomatische Bedeutung „von Gott“ im Haupttext festzulegen.
- source_word: נַחֲלַת
  choice: Erbe
  rationale: „Erbe“ entspricht dem Bild eines zugeteilten Besitzes oder Geschicks und bildet die Parallele zu „Anteil“.
- source_word: עָרִיצִים
  choice: Gewalttätige
  rationale: Das Wort bezeichnet gewalttätige, rücksichtslose oder unterdrückerische Menschen; „Gewalttätige“ ist verständlich und wahrt den starken moralischen Ton.
- source_word: מִשַּׁדַּי
  choice: vom Allmächtigen
  rationale: שַׁדַּי ist ein Gottestitel und wird seiner Bedeutung entsprechend mit „der Allmächtige“ wiedergegeben.
- source_word: יִקָּחוּ
  choice: empfangen
  rationale: Wörtlich bedeutet das Verb „nehmen“; im Zusammenhang von Anteil und Erbe bezeichnet es idiomatisch das Empfangen des zugeteilten Geschicks.
theological_decisions:
- issue: Beziehung des Anteils zu Gott in עִם אֵל
  choice: bei Gott
  alternative: von Gott
  rationale: Die hebräische Präposition bedeutet zunächst „mit/bei“, kann hier aber idiomatisch die von Gott bestimmte Zuteilung meinen. Der Haupttext wahrt die formale Mehrdeutigkeit, die Fußnote nennt die naheliegende Deutung.
- issue: Gottestitel שַׁדַּי
  choice: der Allmächtige
  alternative: Schaddai
  rationale: Der Ausdruck fungiert als Gottestitel; die Übersetzung vermittelt seine traditionelle Bedeutungsfunktion, statt ihn als Eigennamen zu behandeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur von „Anteil“ und „Erbe“ bleibt erhalten. Der Doppelpunkt wahrt den Übergang zur folgenden Ausführung.
