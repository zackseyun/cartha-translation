source:
  edition: WLC
  text: אִם תְּדַבֵּ֣רְנָה שְׂפָתַ֣/י עַוְלָ֑ה וּ֝/לְשׁוֹנִ֗/י אִם יֶהְגֶּ֥ה רְמִיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/004.yaml
  text: my lips will not speak injustice[a], nor will my tongue utter deceit.
translation:
  language: de
  text: Meine Lippen werden kein Unrecht reden[a], und meine Zunge wird keinen Trug äußern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht eine schwurartige Wendung mit „wenn“: wörtlich etwa „wenn meine Lippen Unrecht reden …“. Sie drückt hier eine nachdrückliche Verneinung aus: „Meine Lippen werden gewiss kein Unrecht reden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: werden kein … / wird keinen …
  rationale: Die zweimalige אִם-Konstruktion hat hier im Zusammenhang von Ijobs feierlicher Bekräftigung die Kraft einer entschiedenen Verneinung. Im Deutschen wird sie natürlich durch „nicht/kein“ mit futurisch-entschlossenem Sinn wiedergegeben.
- source_word: תְּדַבֵּרְנָה
  choice: werden … reden
  rationale: Das Piel von דבר bedeutet „reden/sprechen“. Der Imperfekt drückt in dieser Schwurform Ijobs feste Entschlossenheit aus; der Plural stimmt mit „Lippen“ überein.
- source_word: שְׂפָתַי
  choice: meine Lippen
  rationale: Das konkrete Körperbild bleibt erhalten und bildet mit „meine Zunge“ den poetischen Parallelismus.
- source_word: עַוְלָה
  choice: Unrecht
  rationale: „Unrecht“ bewahrt die moralische Bedeutung von עַוְלָה und ist im Deutschen zugleich natürlich. Es bleibt von dem anschließenden „Trug“ unterschieden.
- source_word: וּלְשׁוֹנִי
  choice: und meine Zunge
  rationale: Das Waw verbindet den parallelen zweiten Halbvers. Die erneut gesetzte Verneinung macht ein deutsches „noch“ unnötig; „und“ folgt der hebräischen Struktur klar und natürlich.
- source_word: יֶהְגֶּה
  choice: wird … äußern
  rationale: הגה kann „murmeln“, „äußern“ oder „sinnen“ bedeuten. Mit „Zunge“ als Subjekt und „Trug“ als Objekt bezeichnet es hier das Hervorbringen von Worten; „äußern“ ist würdig und verständlich.
- source_word: רְמִיָּה
  choice: Trug
  rationale: „Trug“ gibt die Bedeutung „Täuschung/Falschheit“ knapp wieder und passt zur poetischen Sprache, ohne mit „Unrecht“ zusammenzufallen.
theological_decisions: []
