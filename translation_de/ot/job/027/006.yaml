  text: בְּ/צִדְקָתִ֣/י הֶ֭חֱזַקְתִּי וְ/לֹ֣א אַרְפֶּ֑/הָ לֹֽא יֶחֱרַ֥ף לְ֝בָבִ֗/י מִ/יָּמָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/006.yaml
  text: I hold fast to my righteousness and will not let it go[b][a]; my heart does not reproach me for any of my days.
translation:
  language: de
  text: An meiner Gerechtigkeit halte ich fest und lasse sie nicht los[a]; mein Herz macht mir an keinem Tag meines Lebens Vorwürfe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „An meiner Rechtschaffenheit halte ich fest und gebe sie nicht auf.“ Das hebräische Wort bedeutet gewöhnlich „Gerechtigkeit“, kann in diesem Zusammenhang aber auch persönliche Rechtschaffenheit oder Integrität bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Mein Herz schmäht mich nicht alle meine Tage.“ Das Verb kann „schmähen“, „verhöhnen“ oder „Vorwürfe machen“ bedeuten. Die knappe hebräische Wendung mit „meinen Tagen“ bezeichnet unter der Verneinung wahrscheinlich die gesamte Lebenszeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתִי
  choice: an meiner Gerechtigkeit
  rationale: צִדְקָה bezeichnet gewöhnlich Gerechtigkeit beziehungsweise das Rechtsein. „Gerechtigkeit“ bewahrt hier den moralisch-rechtlichen Anspruch; „Rechtschaffenheit“ ist eine mögliche kontextuelle Alternative.
- source_word: הֶחֱזַקְתִּי
  choice: halte ich fest
  rationale: Das Hifil von חזק bezeichnet hier ein festes Ergreifen oder Festhalten. Das deutsche Präsens gibt Hiobs gegenwärtige, entschiedene Haltung im Zusammenhang natürlich wieder.
- source_word: וְלֹא אַרְפֶּהָ
  choice: und lasse sie nicht los
  rationale: Das Hifil von רפה bedeutet lockerlassen, freigeben oder loslassen. Das feminine Suffix verweist auf „meine Gerechtigkeit“ zurück.
- source_word: לֹא יֶחֱרַף לְבָבִי
  choice: mein Herz macht mir … nicht zum Vorwurf
  rationale: חרף kann schmähen, verhöhnen oder Vorwürfe machen bedeuten. Mit „mein Herz“ als Subjekt bezeichnet die Wendung innere Selbstanklage, ohne das hebräische „Herz“ deutend durch „Gewissen“ zu ersetzen.
- source_word: מִיָּמָי
  choice: keinen meiner Tage
  rationale: 'מן mit ימים wird unter der Negation am natürlichsten distributiv verstanden: Kein Tag seines Lebens gibt seinem Herzen Anlass zur Selbstanklage. Die Formulierung bewahrt zugleich den ungewöhnlichen Bezug auf seine Tage.'
theological_decisions:
- issue: Ob צִדְקָה stärker als „Gerechtigkeit“ oder im Sinne persönlicher „Rechtschaffenheit“ wiederzugeben ist.
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Der gewöhnliche moralisch-rechtliche Gehalt des Nomens soll erhalten bleiben. „Rechtschaffenheit“ trifft einen möglichen kontextuellen Aspekt in Hiobs Unschuldsbeteuerung, würde den Anspruch jedoch stärker auf persönliche Integrität eingrenzen.
- issue: Ob לֹא יֶחֱרַף לְבָבִי als Gewissensfreiheit oder wörtlicher als Rede des Herzens wiederzugeben ist.
  choice: mein Herz macht mir … nicht zum Vorwurf
  alternative: mein Gewissen klagt mich … nicht an
  rationale: Die gewählte Fassung erhält das biblisch-anthropologische Bild vom Herzen und vermittelt dennoch den Sinn innerer Selbstanklage, ohne den Ausdruck ausdrücklich mit „Gewissen“ gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelstruktur und das Bild des festgehaltenen Rechtsanspruchs bleiben erhalten. „Herz“ wird bewusst nicht durch das interpretierende „Gewissen“ ersetzt; Fußnoten dokumentieren die wesentlichen lexikalischen und idiomatischen Alternativen.
