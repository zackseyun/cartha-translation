  source_fidelity: 'Die Übersetzung gibt die Abfolge des Hebräischen zutreffend wieder: Der Ostwind ist der Handelnde, trägt den Betroffenen fort, worauf dieser „dahingeht/fort ist“; anschließend entfernt derselbe Wind ihn gewaltsam von seinem Ort. „Er ist dahin“ ist als resultative Wiedergabe von וְיֵלַךְ vertretbar.'
  naturalness: „Von seinem Ort wegfegen“ ist verständlich, wirkt jedoch wegen der Verbindung von „von“ und „weg“ etwas schwerfällig. „Von seinem Ort fortwirbeln“ ist idiomatisch, poetisch knapp und bildet die stürmisch-wirbelnde Bildlichkeit von סער genauer ab.
  terminology: „Ostwind“, „trägt ihn fort“ und „Ort“ sind sachgerecht und modern. Es sind keine theologischen Fachbegriffe oder Eigennamen betroffen.
