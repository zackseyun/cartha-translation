- from: Der Ostwind trägt ihn fort, und er ist dahin; er fegt ihn von seinem Ort weg.
  to: Der Ostwind trägt ihn fort, und er ist dahin; er wirbelt ihn von seinem Ort fort.
  rationale: Die Änderung betrifft ausschließlich die zweite Verbphrase. „Wirbelt ... fort“ wahrt die Gewalt und Sturmassoziation von סער, ohne eine übermäßig spezifische Deutung einzutragen, und klingt im modernen Standarddeutsch natürlicher als „fegt ... weg“. Die Parallelität der beiden Satzhälften bleibt erhalten.
