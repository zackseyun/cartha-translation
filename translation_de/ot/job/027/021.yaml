  text: יִשָּׂאֵ֣/הוּ קָדִ֣ים וְ/יֵלַ֑ךְ וִֽ֝/ישָׂעֲרֵ֗/הוּ מִ/מְּקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/021.yaml
  text: The east wind carries him away[a], and he is gone; it sweeps him away from his place.
translation:
  language: de
  text: Der Ostwind trägt ihn fort, und er ist dahin; er wirbelt ihn von seinem Ort fort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשָּׂאֵהוּ
  choice: trägt ihn fort
  rationale: נשׂא bedeutet „heben, tragen, forttragen“. Im Zusammenhang mit dem Wind gibt „trägt ihn fort“ die gewaltsame Entfernung natürlich und bildgetreu wieder.
- source_word: קָדִים
  choice: der Ostwind
  rationale: קָדִים bezeichnet häufig den Ostwind, der in der hebräischen Dichtung oft zerstörerisch auftritt. Die Wiedergabe macht den meteorologischen Handelnden ausdrücklich.
- source_word: וְיֵלַךְ
  choice: und er ist dahin
  rationale: הלך bedeutet wörtlich „gehen“. Nach dem Fortgetragenwerden drückt „er ist dahin“ im Deutschen knapp und idiomatisch das Ergebnis aus.
- source_word: וִישָׂעֲרֵהוּ
  choice: er fegt ihn … weg
  rationale: Die Form von סער vermittelt stürmisches, gewaltsames Fortreißen. „Wegfegen“ ist im Deutschen natürlich, bewahrt das Sturm-Bild und passt zum folgenden „von seinem Ort“.
- source_word: מִמְּקֹמוֹ
  choice: von seinem Ort
  rationale: מָקוֹם bedeutet schlicht „Ort, Platz“. „Von seinem Ort“ ist prägnant und bleibt der poetischen Form nahe.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper poetischer Parallelität. Der Ostwind bleibt als zerstörerische Naturgewalt ausdrücklich benannt; die beiden Verben werden unterschiedlich wiedergegeben, um die Steigerung vom Forttragen zum gewaltsamen Wegfegen zu erhalten.
