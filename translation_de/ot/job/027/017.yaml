  text: יָ֭כִין וְ/צַדִּ֣יק יִלְבָּ֑שׁ וְ֝/כֶ֗סֶף נָקִ֥י יַחֲלֹֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/017.yaml
  text: He may prepare it[a], but the righteous will wear it[b], and the innocent will divide the silver.
translation:
  language: de
  text: Mag er auch Kleidung[b] anfertigen, der Gerechte wird sie tragen, und der Schuldlose wird das Silber verteilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: „Kleidung“ ist aus dem vorhergehenden Vers ergänzt; im Hebräischen ist das Objekt bei „anfertigen“ und „tragen“ nicht ausdrücklich genannt.
    reason: cross_reference
lexical_decisions:
- source_word: יָכִין
  choice: Mag er es auch bereitstellen
  rationale: 'Das Hifil von כון bedeutet hier „bereitstellen, herrichten“. Der konzessive Ausdruck „Mag er … auch“ ergibt sich aus dem Zusammenhang: Was der Frevler ansammelt, kommt anderen zugute. Das Objekt wird aus dem vorhergehenden Vers ergänzt.'
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular und bezeichnet repräsentativ einen gerechten Menschen. „Der Gerechte“ ist im Deutschen natürlich und bewahrt diese Form.
- source_word: יִלְבָּשׁ
  choice: wird es tragen
  rationale: Das Qal von לבש bedeutet „anziehen, tragen“. Das ergänzte „es“ verweist auf die im vorhergehenden Vers genannte Kleidung.
- source_word: כֶסֶף
  choice: das Silber
  rationale: כֶּסֶף kann „Silber“ oder „Geld“ bedeuten. Im Zusammenhang mit angehäuften Schätzen und parallel zur Kleidung bleibt „Silber“ konkret und quellennah.
- source_word: נָקִי
  choice: der Schuldlose
  rationale: Das substantivierte Adjektiv bezeichnet jemanden, der frei von Schuld ist. „Der Schuldlose“ gibt den moralischen Gegensatz zum Frevler präzise wieder.
- source_word: יַחֲלֹק
  choice: wird … aufteilen
  rationale: Das Qal von חלק bedeutet „teilen, aufteilen, zuteilen“. „Aufteilen“ beschreibt verständlich, dass das angehäufte Silber einem anderen zufällt und von ihm geteilt wird.
