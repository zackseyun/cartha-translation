lexical_decisions:
- source_word: בִּרְחֹץ
  choice: als … badeten
  rationale: Der Infinitiv mit בְּ bezeichnet hier am natürlichsten einen zeitlichen Umstand; רָחַץ bedeutet „waschen, baden“. Das konkrete Bild wird im Deutschen mit dem aktiven „badeten“ idiomatisch bewahrt.
- source_word: הֲלִיכַי
  choice: meine Schritte
  rationale: Das Wort bezeichnet das Gehen beziehungsweise den Gang; „meine Schritte“ erhält die konkrete poetische Bildsprache.
- source_word: בְּחֵמָה
  choice: in Dickmilch
  rationale: חֵמָה bezeichnet ein dickes Sauermilchprodukt, das je nach Zusammenhang auch als Rahm oder butterähnliches Erzeugnis verstanden werden kann. „Dickmilch“ ist anschaulich und historisch weniger irreführend als modernes „Butter“.
- source_word: וְצוּר
  choice: und der Fels
  rationale: צוּר bedeutet „Fels, Felsgestein“. Der bestimmte Ausdruck wirkt im Deutschen in dieser poetisch-generischen Darstellung natürlich.
- source_word: יָצוּק
  choice: ausgoss
  rationale: יָצַק bedeutet „gießen, ausgießen“; „ausgoss“ bewahrt das Bild überreicher Versorgung.
- source_word: עִמָּדִי
  choice: neben mir
  rationale: Die Präposition bedeutet wörtlich „mit mir, bei mir, neben mir“. Die räumliche Bedeutung wird im Haupttext erhalten, statt sie deutend als „für mich“ wiederzugeben.
- source_word: פַּלְגֵי
  choice: Ströme von
  rationale: פַּלְגֵי bezeichnet geteilte Wasserläufe, Kanäle oder Bäche; „Ströme“ vermittelt die poetische Fülle.
- source_word: שָׁמֶן
  choice: Öl
  rationale: שֶׁמֶן bedeutet gewöhnlich Öl, im israelitischen Kontext häufig Olivenöl; die knappe Wiedergabe „Öl“ genügt.
