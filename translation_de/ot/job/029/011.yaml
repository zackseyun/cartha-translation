  text: כִּ֤י אֹ֣זֶן שָׁ֭מְעָה וַֽ/תְּאַשְּׁרֵ֑/נִי וְ/עַ֥יִן רָ֝אֲתָ֗ה וַ/תְּעִידֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/011.yaml
  text: For when an ear heard[a], it called me blessed, and when an eye saw, it testified for me.
translation:
  language: de
  text: Denn wer von mir hörte, pries mich glücklich, und wer mich sah, legte Zeugnis für mich ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Hiobs zuvor geschildertes früheres Ansehen ein und entspricht dem hebräischen Zusammenhang natürlich.
- source_word: אֹזֶן שָׁמְעָה
  choice: wer von mir hörte
  rationale: Gibt das generisch gebrauchte Körperteilbild sinngemäß und in natürlichem modernem Deutsch wieder. Das im Hebräischen nicht ausdrücklich genannte Objekt ergibt sich aus dem anschließenden Pronomen der ersten Person.
- source_word: וַתְּאַשְּׁרֵנִי
  choice: pries mich glücklich
  rationale: 'Bewahrt den evaluativen Sinn des Verbs אשר: Jemand erklärt Hiob für glücklich beziehungsweise begünstigt. „Glücklich preisen“ ist im Deutschen idiomatisch und würdevoll.'
- source_word: וְעַיִן רָאֲתָה
  choice: und wer mich sah
  rationale: Gibt den parallelen generischen Ausdruck mit „Auge“ in natürlichem Deutsch wieder und erhält die knappe Entsprechung von Hören und Sehen.
- source_word: וַתְּעִידֵנִי
  choice: trat als Zeuge für mich ein
  rationale: Gibt die gerichtssprachliche Bedeutung „zeugen, Zeugnis ablegen“ wieder und macht entsprechend dem Kontext deutlich, dass das Zeugnis zugunsten Hiobs ausfiel.
theological_decisions:
- issue: Art des Zeugnisses über Hiob
  choice: als günstiges Zeugnis für Hiob wiedergegeben
  alternative: „legte Zeugnis über mich ab“ oder „bezeugte mich“
  rationale: Der unmittelbare Kontext beschreibt Hiobs früheres öffentliches Ansehen. Die Präposition ist nicht ausdrücklich gesetzt, doch die Verbform mit Personenobjekt und der Parallelismus zu „pries mich glücklich“ stützen ein günstiges Zeugnis, ohne eine besondere konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Körperteil-Metonymien „ein Ohr“ und „ein Auge“ werden zugunsten der im Deutschen natürlichen generischen Form „wer …“ aufgelöst; Parallelismus und Aussage bleiben erhalten.
