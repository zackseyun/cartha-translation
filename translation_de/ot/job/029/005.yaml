  text: when the Almighty was still with me[a], and my young men were around me,
translation:
  language: de
  text: 'als der Allmächtige noch bei mir war

    und meine jungen Männer[a] um mich waren,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Diener“. Das hebräische Wort kann je nach Zusammenhang junge Männer, Bedienstete oder Diener bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד
  choice: als ... noch ... war
  rationale: Die Verbindung aus בְּ und עוֹד bezeichnet hier einen in der Vergangenheit fortdauernden Zustand. „Als ... noch ... war“ gibt sowohl den zeitlichen Bezug als auch den Rückblick auf einen inzwischen beendeten Zustand natürlich wieder.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: שַׁדַּי ist ein Gottesname beziehungsweise Gottestitel, der im Hiobbuch traditionell und verständlich mit „der Allmächtige“ wiedergegeben wird.
- source_word: עִמָּדִי
  choice: bei mir
  rationale: Die Präposition mit dem Suffix der ersten Person bezeichnet Gegenwart und Nähe. „Bei mir“ ist im Deutschen in diesem Zusammenhang natürlicher als das ebenfalls mögliche „mit mir“.
- source_word: סְבִיבוֹתַי
  choice: um mich
  rationale: Die Form bezeichnet die Umgebung des Sprechers und wird hier idiomatisch mit „um mich“ wiedergegeben.
- source_word: נְעָרָי
  choice: meine jungen Männer
  rationale: נַעַר kann einen jungen Mann, Diener oder Bediensteten bezeichnen. „Meine jungen Männer“ bewahrt die lexikalische Offenheit, ohne den sozialen Status vorschnell festzulegen.
