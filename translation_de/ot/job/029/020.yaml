  text: My glory was ever fresh with me[b][a], and my bow was renewed in my hand.
translation:
  language: de
  text: Meine Ehre blieb bei mir frisch[a], und mein Bogen wurde in meiner Hand erneuert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Meine Ehre war neu bei mir.« Das hebräische Adjektiv bedeutet »neu«, meint hier aber wahrscheinlich, dass Hiobs Ehre frisch und unvermindert blieb.'
    reason: lexical_alternative
  - marker: b
    text: Der Bogen ist wahrscheinlich ein Bild für Kraft oder Tatkraft; der hebräische Text behält das konkrete Bild bei.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: meine Ehre
  rationale: כָּבוֹד kann Herrlichkeit, Ehre oder Ansehen bezeichnen. Im Rückblick auf Hiobs frühere gesellschaftliche Stellung klingt „Ehre“ im Deutschen natürlich, ohne den Begriff auf bloßes Ansehen zu verengen.
- source_word: חָדָשׁ
  choice: blieb frisch
  rationale: Das Prädikatsadjektiv bedeutet wörtlich „neu“, bezeichnet hier im Zusammenhang aber wahrscheinlich unverminderte, fortdauernde Frische. „Blieb frisch“ macht zusammen mit עִמָּדִי den beständigen Zustand idiomatisch deutlich.
- source_word: עִמָּדִי
  choice: bei mir
  rationale: Die Wendung bedeutet wörtlich „bei/mit mir“ und besagt hier, dass Hiobs Ehre bei ihm blieb und nicht schwand.
- source_word: קַשְׁתִּי
  choice: mein Bogen
  rationale: Der konkrete Bogen wird bewahrt; er kann poetisch für Kraft oder Wehrhaftigkeit stehen.
- source_word: בְּיָדִי
  choice: in meiner Hand
  rationale: Die räumliche Formulierung erhält das konkrete Bild des gebrauchsbereiten Bogens.
- source_word: תַחֲלִיף
  choice: erneuerte sich
  rationale: Die Hifil-Form von חלף kann wechseln, neu sprießen oder sich erneuern ausdrücken. Das reflexive deutsche Verb gibt den intransitiv wirkenden Sinn im Kontext wieder und wahrt die Parallelität zur frischen Ehre.
theological_decisions: []
translation_notes:
  register: Moderne, gehobene Standardsprache mit poetischer Parallelität. „Ehre“ ist für den Kontext natürlicher als „Herrlichkeit“; die Bilder von Frische, Bogen und Hand bleiben erhalten.
