  text: קוֹל נְגִידִ֥ים נֶחְבָּ֑אוּ וּ֝/לְשׁוֹנָ֗/ם לְ/חִכָּ֥/ם דָּבֵֽקָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/010.yaml
  text: The voice of nobles was hushed[b][a], and their tongue stuck to the roof of their mouth.
translation:
  language: de
  text: Die Stimme der Vornehmen verstummte[a], und ihre Zunge klebte ihnen am Gaumen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Die Stimme der Vornehmen verbarg sich“; gemeint ist, dass sie verstummten.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild einer am Gaumen klebenden Zunge bezeichnet, dass jemand nicht spricht oder nicht sprechen kann.
    reason: idiom_explanation
lexical_decisions:
- source_word: קוֹל
  choice: Stimme
  rationale: Bei menschlichen Sprechern bezeichnet קוֹל hier ihre hörbare Stimme beziehungsweise ihr Reden; „Stimme“ bewahrt zugleich das Bild des Hebräischen.
- source_word: נְגִידִים
  choice: Vornehmen
  rationale: Das Wort bezeichnet hochgestellte Personen, Führende oder Fürsten. Im Zusammenhang ist „Vornehme“ weit genug, um gesellschaftlichen Rang auszudrücken, ohne ein bestimmtes Herrscheramt vorauszusetzen.
- source_word: נֶחְבָּאוּ
  choice: verstummte
  rationale: Die Grundbedeutung des Verbs ist „sich verbergen“. Mit „Stimme“ als Subjekt beschreibt es bildhaft, dass sie nicht mehr zu hören war; „verstummte“ gibt den gemeinten Vorgang in natürlichem Deutsch wieder.
- source_word: וּלְשׁוֹנָם
  choice: und ihre Zunge
  rationale: Der hebräische Singular mit pluralischem Possessivsuffix lässt sich als kollektiver Singular wiedergeben und erhält so die poetische Form.
- source_word: לְחִכָּם
  choice: ihnen am Gaumen
  rationale: חֵך bezeichnet den Gaumen. Das zusätzliche „ihnen“ macht im Deutschen die Zugehörigkeit bei dem kollektiven Singular „ihre Zunge“ eindeutig und idiomatisch.
- source_word: דָּבֵקָה
  choice: klebte
  rationale: Das Verb bedeutet „haften, kleben, sich anschließen“. „Am Gaumen kleben“ bewahrt das konkrete hebräische Bild für Sprachlosigkeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus. „Vornehme“ vermeidet die zu enge Festlegung auf Fürsten oder amtliche Herrscher; die zweite Vershälfte erhält das körperhafte Bild des Hebräischen.
