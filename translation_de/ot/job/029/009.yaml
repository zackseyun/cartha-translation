source:
  edition: WLC
  text: שָׂ֭רִים עָצְר֣וּ בְ/מִלִּ֑ים וְ֝/כַ֗ף יָשִׂ֥ימוּ לְ/פִי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/009.yaml
  text: Princes held back their words[a], and put their hand over their mouth.
translation:
  language: de
  text: Fürsten hielten ihre Worte zurück[a] und legten die Hand auf ihren Mund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vornehme hielten sich mit dem Reden zurück.«'
    reason: Lexikalisch und idiomatisch mögliche Wiedergabe von שָׂרִים und עָצְרוּ בְמִלִּים.
lexical_decisions:
- source_word: שָׂרִים
  choice: Fürsten
  rationale: Das Wort bezeichnet hochrangige Amtsträger oder Herrschende. »Fürsten« bewahrt den gehobenen gesellschaftlichen Rang und passt zur öffentlichen Ehrerbietung im Zusammenhang.
- source_word: עָצְרוּ
  choice: hielten … zurück
  rationale: Das Verb bedeutet hier, die eigene Rede zu hemmen oder zurückzuhalten. Die deutsche Wendung ist natürlich und gibt den Sinn im Zusammenhang präzise wieder.
- source_word: בְמִלִּים
  choice: ihre Worte
  rationale: Wörtlich steht »mit/in Worten«; zusammen mit עָצְרוּ ist das Zurückhalten der Rede gemeint. Das Possessivpronomen ist aus dem Zusammenhang ergänzt und ergibt eine natürliche deutsche Formulierung.
- source_word: וְכַף
  choice: die Hand
  rationale: כַּף kann Handfläche oder Hand bezeichnen. In der Geste des Schweigens ist »die Hand auf den Mund legen« die übliche deutsche Wendung.
- source_word: יָשִׂימוּ
  choice: legten
  rationale: Das Verb bedeutet »setzen, stellen, legen«. Bei dieser Körpergeste ist »legten« im Deutschen idiomatisch.
- source_word: לְפִיהֶם
  choice: auf ihren Mund
  rationale: Die Präposition bezeichnet hier die Richtung beziehungsweise Lage der Hand am Mund. Der Singular »Mund« mit pluralischem Possessivpronomen folgt der hebräischen Ausdrucksweise und ist auch im Deutschen verständlich.
