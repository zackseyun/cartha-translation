  yaml_path: translation/ot/job/029/012.yaml
  text: For I delivered the poor who cried for help[a], and the fatherless who had no helper.
translation:
  language: de
  text: Denn ich rettete den Armen, der um Hilfe schrie, und den Vaterlosen[a], der keinen Helfer hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Waise“. Das hebräische Wort bezeichnet genauer einen Menschen ohne Vater und damit einen sozial besonders Schutzbedürftigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Hiobs zuvor geschildertes Ansehen ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: אֲמַלֵּט
  choice: ich rettete
  rationale: Das Piel von מלט bezeichnet aktives Retten oder Befreien; „rettete“ ist klar, würdig und kontextgerecht.
- source_word: עָנִי
  choice: den Armen
  rationale: עָנִי kann einen armen oder bedrängten Menschen bezeichnen; im Zusammenhang von sozialer Schutzbedürftigkeit ist „den Armen“ die natürliche Wiedergabe.
- source_word: מְשַׁוֵּעַ
  choice: der um Hilfe schrie
  rationale: Das Partizip beschreibt den Armen als Hilferufenden; der deutsche Relativsatz bewahrt diesen Sinn und klingt idiomatisch.
- source_word: יָתוֹם
  choice: den Vaterlosen
  rationale: יָתוֹם bezeichnet besonders einen Menschen ohne Vater. „Vaterloser“ erhält diese spezifische soziale Kategorie deutlicher als „Waise“.
- source_word: וְלֹא עֹזֵר לוֹ
  choice: der keinen Helfer hatte
  rationale: Der Relativsatz bezieht die Aussage klar auf den Vaterlosen und bewahrt den Gedanken, dass ihm niemand beistand.
