id: JOB.29.16
reference: Job 29:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָ֣ב אָ֭נֹכִֽי לָֽ/אֶבְיוֹנִ֑ים וְ/רִ֖ב לֹא יָדַ֣עְתִּי אֶחְקְרֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/016.yaml
  text: I was a father to the poor[a], and I investigated the case of one I did not know.
translation:
  language: de
  text: Ich war den Bedürftigen ein Vater, und einen Rechtsstreit, den ich nicht kannte, untersuchte ich gründlich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Den Rechtsstreit eines mir Unbekannten erforschte ich.'
    reason: Die knappe hebräische Form kann entweder einen Hiob zuvor unbekannten Rechtsstreit oder den Rechtsstreit eines ihm unbekannten Menschen bezeichnen.
lexical_decisions:
- source_word: אָב
  choice: Vater
  rationale: Die wörtliche Wiedergabe bewahrt das Bild fürsorglicher Verantwortung und schützender Fürsprache.
- source_word: אָנֹכִי
  choice: ich war
  rationale: Das selbstständige Pronomen hebt Hiob hervor; der Rückblick in Hiob 29 verlangt im Deutschen die Vergangenheitsform.
- source_word: לָאֶבְיוֹנִים
  choice: den Bedürftigen
  rationale: אֶבְיוֹן bezeichnet Arme oder Notleidende. „Bedürftige“ gibt die soziale Verwundbarkeit natürlich wieder, ohne den Sinn auf völlige Mittellosigkeit zu verengen.
- source_word: וְרִיב
  choice: und einen Rechtsstreit
  rationale: רִיב kann einen Streit, Rechtsfall oder Prozess bezeichnen. „Rechtsstreit“ erhält den rechtlichen Zusammenhang und die Verbindung zu Hiobs Fürsprache.
- source_word: לֹא יָדַעְתִּי
  choice: den ich nicht kannte
  rationale: 'Die Form kann sich unmittelbar auf den Rechtsstreit beziehen: Hiob untersuchte auch einen ihm zuvor unbekannten Fall. Eine mögliche personenbezogene Deutung wird in der Fußnote bewahrt.'
- source_word: אֶחְקְרֵהוּ
  choice: untersuchte ich gründlich
  rationale: חקר bezeichnet sorgfältiges Erforschen oder Nachprüfen. Das Suffix der dritten Person Singular nimmt den Rechtsstreit wieder auf; „gründlich“ vermittelt die Intensität des Verbs.
theological_decisions:
- issue: Bezug von לֹא יָדַעְתִּי
  choice: Der unbekannte Gegenstand ist im Haupttext der Rechtsstreit.
  alternative: Hiob untersuchte den Rechtsstreit eines Menschen, den er nicht kannte.
  rationale: רִיב ist das unmittelbar vorausgehende maskuline Bezugswort und אֶחְקְרֵהוּ nimmt es grammatisch wieder auf. Zugleich lässt die knappe hebräische Form im Zusammenhang mit Hiobs Fürsprache auch eine personenbezogene Auslegung zu; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Wendung „den Bedürftigen ein Vater“ bewahrt das hebräische Bild; „Rechtsstreit“ und „untersuchte ich gründlich“ vermitteln den rechtlichen und sorgfältig prüfenden Charakter der zweiten Vershälfte.
