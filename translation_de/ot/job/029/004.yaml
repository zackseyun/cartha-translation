lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Leitet im Zusammenhang mit Hiobs Rückblick einen Vergleich zu den ersehnten früheren Tagen ein und bewahrt die vergleichende Färbung.
- source_word: הָיִיתִי
  choice: ich … war
  rationale: Das Qal Perfekt der 1. Person Singular wird im rückblickenden Zusammenhang natürlich mit dem deutschen Präteritum wiedergegeben.
- source_word: בִּימֵי
  choice: in den Tagen
  rationale: Bewahrt die hebräische Zeitangabe und klingt im gehobenen modernen Deutsch natürlich.
- source_word: חָרְפִּי
  choice: meiner Reife
  rationale: Das Wort bezeichnet die Herbst- beziehungsweise Erntezeit und übertragen eine Zeit voller Kraft und Entfaltung. „Reife“ vermittelt dies, ohne den im Deutschen oft mit Verfall verbundenen „Herbst“ in den Haupttext zu setzen.
- source_word: בְּסוֹד
  choice: vertrauter Rat
  rationale: סוֹד kann einen vertraulichen Rat, einen engen Kreis oder innige Gemeinschaft bezeichnen. „Vertrauter Rat“ hält die beratende und die beziehungsbezogene Bedeutung zusammen.
- source_word: אֱלוֹהַּ
  choice: Gottes
  rationale: Der Genitiv gibt die Verbindung mit סוֹד im Deutschen knapp und natürlich wieder.
- source_word: עֲלֵי
  choice: über … lag
  rationale: „Über“ wahrt das räumliche Bild; „lag“ bildet zusammen mit der Präposition eine verständliche deutsche Wendung, ohne eine zusätzliche Tätigkeit wie Schützen oder Wachen einzutragen.
- source_word: אָהֳלִי
  choice: meinem Zelt
  rationale: Bewahrt das konkrete Bild des hebräischen Textes; Haushalt oder Wohnstätte sind mögliche Implikationen, aber nicht an die Stelle des Bildes zu setzen.
theological_decisions:
- issue: Bedeutung von בְּסוֹד אֱלוֹהַּ für Hiobs frühere Beziehung zu Gott
  choice: „Gottes vertrauter Rat“ bezeichnet Gottes vertrauliche Nähe und Gunst, ohne den Ausdruck ausschließlich als Freundschaft oder besondere Offenbarung festzulegen.
  alternative: „Gottes Geheimnis“, „Gottes Freundschaft“ oder „Gottes vertraute Gemeinschaft“
  rationale: Der hebräische Ausdruck umfasst sowohl vertraulichen Rat als auch enge Gemeinschaft. Die gewählte Formulierung bewahrt diese Spannung und vermeidet eine konfessionelle oder mystische Überbestimmung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt als abhängiger Vergleichssatz offen, entsprechend dem Verszusammenhang. Das konkrete Bild des Zeltes und die Mehrdeutigkeit von סוֹד werden bewahrt.
