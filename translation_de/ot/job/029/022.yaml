  register: Modernes, gehobenes Standarddeutsch mit bewahrtem poetischem Bild. Die mögliche Bedeutung „antworten“ wird nicht in den Haupttext eingetragen, sondern als echte lexikalische Alternative in der Fußnote erhalten.
