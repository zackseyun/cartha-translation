base_translation:
  language: en
  yaml_path: translation/ot/job/029/022.yaml
  text: After my words they did not speak again[b][a], and my word dripped upon them.
translation:
  language: de
  text: Nach meinen Worten redeten sie nicht noch einmal[a], und auf sie träufelte meine Rede.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „antworteten sie nicht mehr“. Das hebräische Verb kann hier erneutes Reden oder eine weitere Antwort bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Auf sie träufelte meine Rede“; ein poetisches Bild für Worte, die wie Tropfen auf Menschen fallen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי דְבָרִי
  choice: Nach meinen Worten
  rationale: Gibt die zeitliche Beziehung und den konkreten Plural von דָּבָר knapp und quellennah wieder.
- source_word: לֹא יִשְׁנוּ
  choice: redeten sie nicht noch einmal
  rationale: שׁנה bezeichnet hier im Redekontext wahrscheinlich ein erneutes Reden beziehungsweise Antworten. Die Formulierung bewahrt diese Bedeutung, ohne sie auf eine Erwiderung festzulegen.
- source_word: וְעָלֵימוֹ
  choice: auf sie herab
  rationale: עַל mit Suffix bezeichnet die Zielrichtung; „herab“ ergänzt im Deutschen natürlich die räumliche Bewegung des Träufelns.
- source_word: תִּטֹּף
  choice: träufelte
  rationale: Bewahrt das poetische Bild des Tropfens und klingt im Deutschen bei Rede sanfter und natürlicher als „tropfte“.
- source_word: מִלָּתִי
  choice: meine Rede
  rationale: Das poetische Singularwort מִלָּה kann eine Äußerung oder Rede bezeichnen. „Meine Rede“ ist natürlich und unterscheidet sich vom vorausgehenden Plural „meinen Worten“.
theological_decisions: []
