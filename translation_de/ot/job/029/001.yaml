  text: Und Hiob setzte seine Rede fort und sagte:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Spruch“, „sein Gleichnis“ oder „sein Orakel“. Das hebräische Wort maschal hat ein breites Bedeutungsspektrum; hier leitet es Hiobs längere poetische Rede ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: fuhr fort
  rationale: יסף bedeutet wörtlich „hinzufügen“ und bezeichnet mit folgendem Infinitiv hier die Fortsetzung der Rede. „fuhr fort“ gibt die Erzählwendung natürlich und würdig wieder.
- source_word: אִיּוֹב
  choice: Hiob
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: שְׂאֵת
  choice: vorzutragen
  rationale: נשׂא bedeutet grundsätzlich „heben, tragen“; in der Verbindung נשׂא משל bezeichnet es das Anheben beziehungsweise Vortragen einer Rede. „vorzutragen“ bildet die idiomatische Bedeutung in natürlichem Deutsch ab.
- source_word: מְשָׁלוֹ
  choice: seinen Ausspruch
  rationale: מָשָׁל hat ein breites Bedeutungsspektrum, darunter Spruch, Gleichnis und poetische Rede. „Ausspruch“ bleibt hinreichend offen und passt zu Hiobs längerer poetischer Rede, ohne sie auf ein Sprichwort oder Gleichnis zu verengen.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die gewöhnliche narrative Form zur Einleitung direkter Rede wird schlicht und idiomatisch wiedergegeben.
