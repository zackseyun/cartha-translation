  text: צֶ֣דֶק לָ֭בַשְׁתִּי וַ/יִּלְבָּשֵׁ֑/נִי כִּֽ/מְעִ֥יל וְ֝/צָנִ֗יף מִשְׁפָּטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/014.yaml
  text: I put on righteousness[a], and it clothed me[b]; my justice was like a robe and a turban.
translation:
  language: de
  text: Gerechtigkeit zog ich an, und sie bekleidete mich; mein gerechtes Handeln war wie ein Mantel und ein Turban.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Recht war wie ein Mantel und ein Turban.“ Das hebräische Wort kann Recht, gerechtes Urteil oder Rechtspflege bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: צֶדֶק bezeichnet hier moralische Rechtschaffenheit beziehungsweise Gerechtigkeit. „Gerechtigkeit“ bewahrt die ethische und soziale Weite des Begriffs, während מִשְׁפָּטִי im zweiten Halbvers mit „mein Recht“ wiedergegeben wird.
- source_word: לָבַשְׁתִּי
  choice: zog ich an
  rationale: Die aktive Formulierung erhält das konkrete Bild des Anziehens eines Kleidungsstücks und klingt im Deutschen natürlich.
- source_word: וַיִּלְבָּשֵׁנִי
  choice: und sie kleidete mich
  rationale: 'Die Wiederholung desselben Verbstamms wird bewahrt: Hiob zieht die Gerechtigkeit an, und diese kleidet ihn. So bleibt die poetische Umkehrung sichtbar.'
- source_word: כִּמְעִיל
  choice: wie Mantel
  rationale: מְעִיל bezeichnet ein würdevolles Obergewand. „Mantel“ ist verständlich und erhält die Bekleidungsmetapher.
- source_word: וְצָנִיף
  choice: und Turban
  rationale: צָנִיף ist eine gewickelte Kopfbedeckung. „Turban“ ist die präzise und im Deutschen geläufige Entsprechung.
- source_word: מִשְׁפָּטִי
  choice: mein Recht
  rationale: מִשְׁפָּט kann Recht, Rechtsprechung oder gerechtes Urteil bezeichnen. „Mein Recht“ bewahrt die knappe nominale Form und lässt offen, ob vor allem Hiobs gerechtes Handeln oder seine Rechtsprechung gemeint ist.
theological_decisions:
- issue: Verhältnis von צֶדֶק und מִשְׁפָּט
  choice: „Gerechtigkeit“ und „mein Recht“ werden als verwandte, aber nicht identische Begriffe wiedergegeben.
  alternative: Beide Begriffe könnten mit „Gerechtigkeit“ übersetzt oder מִשְׁפָּטִי als „mein gerechtes Urteil“ expliziert werden.
  rationale: Die unterschiedliche Wortwahl erhält die hebräische Parallelität, ohne sie einzuebnen oder die genaue Art von Hiobs gerechtem Handeln dogmatisch festzulegen.
translation_notes:
  register: Moderne, würdige poetische Sprache. Die Wiederholung von „anziehen/kleiden“ bildet das hebräische Wortspiel nach; „Mantel und Turban“ vermittelt öffentliche Würde und Ehre.
