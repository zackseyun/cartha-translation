  text: רָא֣וּ/נִי נְעָרִ֣ים וְ/נֶחְבָּ֑אוּ וִֽ֝/ישִׁישִׁים קָ֣מוּ עָמָֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/008.yaml
  text: The young men saw me and withdrew[a], and the aged rose and stood.
translation:
  language: de
  text: Junge Männer sahen mich und zogen sich zurück[a], und alte Männer erhoben sich und blieben stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verbargen sich“; das hebräische Verb kann bedeuten, dass man sich verbirgt. Hier drückt es wahrscheinlich aus, dass sie sich aus Ehrfurcht vor Hiob zurückzogen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּנִי
  choice: sahen mich
  rationale: Die einfache Bedeutung von ראה ist hier die visuelle Wahrnehmung; eine stärker deutende Wiedergabe ist nicht nötig.
- source_word: נְעָרִים
  choice: junge Männer
  rationale: Der maskuline Plural bezeichnet hier junge männliche Personen und bildet den Alterskontrast zu den alten Männern.
- source_word: וְנֶחְבָּאוּ
  choice: zogen sich zurück
  rationale: Der Niphal von חבא bedeutet gewöhnlich „sich verbergen“. Im gesellschaftlichen Ehrenkontext bezeichnet er wahrscheinlich ein ehrerbietiges Zurückweichen; die wörtlichere Alternative bleibt in der Fußnote erhalten.
- source_word: וִישִׁישִׁים
  choice: alte Männer
  rationale: ישישים bezeichnet hochbetagte männliche Personen. „Älteste“ wird vermieden, da dies ein Amt statt des Alters bezeichnen könnte.
- source_word: קָמוּ
  choice: erhoben sich
  rationale: קום bezeichnet die erste Bewegung des respektvollen Aufstehens und wird als eigene Handlung bewahrt.
- source_word: עָמָדוּ
  choice: blieben stehen
  rationale: עמד folgt auf קום und beschreibt, dass die alten Männer nach dem Aufstehen standen beziehungsweise stehen blieben. So bleiben beide hebräischen Verben erkennbar.
theological_decisions: []
