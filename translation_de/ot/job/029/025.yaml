  yaml_path: translation/ot/job/029/025.yaml
  text: I chose their way and sat as chief[a]; I dwelt like a king among the troops[c][b], like one who comforts mourners.
translation:
  language: de
  text: Ich wählte ihren Weg und saß als Oberster[a]; ich wohnte wie ein König in der Schar[b], wie einer, der Trauernde tröstet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich wählte ihren Weg und nahm an der Spitze Platz.“ Das Hebräische kann bedeuten, dass Hiob den einzuschlagenden Weg auswählte oder billigte und dann den führenden Platz einnahm.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ein König in der Truppe“. Das hebräische Wort kann eine Truppe, Schar oder bewaffnete Gruppe bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Der abschließende Vergleich ist im Hebräischen schwer zu deuten. Gemeint sein kann: „wie einer, der Trauernde tröstet“, wodurch Hiobs tröstende Rolle neben seiner Ehrenstellung hervorgehoben wird.'
    reason: textual_or_syntactic_difficulty
lexical_decisions:
- source_word: אֶבֲחַר
  choice: Ich bestimmte
  rationale: Das Qal-Imperfekt 1. Person Singular beschreibt im Rückblick von Hiob 29 am natürlichsten ein wiederholtes oder charakteristisches Handeln in der Vergangenheit. „Bestimmte“ gibt hier wieder, dass Hiob den einzuschlagenden Weg auswählte beziehungsweise vorgab.
- source_word: דַּרְכָּם
  choice: ihren Weg
  rationale: דֶּרֶךְ bedeutet „Weg“, „Pfad“ oder übertragen „Vorgehensweise“. Die wörtliche und im Deutschen verständliche Form „ihren Weg“ bewahrt diese Bildhaftigkeit und Offenheit.
- source_word: וְאֵשֵׁב רֹאשׁ
  choice: und saß als Oberster da
  rationale: Die Verbindung aus ישב und רֹאשׁ bezeichnet eine führende Sitz- oder Rangstellung. Die Wiedergabe erhält sowohl das konkrete Sitzen als auch die gesellschaftliche Vorrangstellung.
- source_word: וְאֶשְׁכּוֹן
  choice: ich wohnte
  rationale: שׁכן bedeutet „wohnen“, „sich niederlassen“ oder „weilen“. „Wohnte“ bleibt nah am hebräischen Bild und passt zum gehobenen poetischen Register.
- source_word: כְּמֶלֶךְ
  choice: wie ein König
  rationale: Das Präfix כ־ kennzeichnet ausdrücklich einen Vergleich; „wie ein König“ bewahrt diese Form.
- source_word: בַּגְּדוּד
  choice: inmitten der Schar
  rationale: גְּדוּד kann eine Truppe, Schar oder bewaffnete Gruppe bezeichnen. „Schar“ vermeidet eine unnötig enge militärische Festlegung, während „inmitten“ die Stellung innerhalb der Gruppe natürlich ausdrückt.
- source_word: כַּאֲשֶׁר
  choice: wie einer, der
  rationale: Die schwierige Vergleichsfügung wird im Deutschen mit „wie einer, der“ verständlich wiedergegeben, ohne den Bezug des folgenden Singularverbs zu überbestimmen.
- source_word: אֲבֵלִים יְנַחֵם
  choice: Trauernde tröstet
  rationale: אֲבֵלִים bezeichnet Menschen in Trauer; das Piel von נחם bedeutet hier „trösten“. Die Formulierung ist knapp, natürlich und quellennah.
theological_decisions:
- issue: Bezug und Sinn des Schlussvergleichs
  choice: wie einer, der Trauernde tröstet
  alternative: wie ein König in der Schar – wie einer, der Trauernde tröstet; oder eine stärker syntaktisch verbundene Deutung
  rationale: Die hebräische Schlusskonstruktion ist schwierig, legt aber eine tröstende Rolle Hiobs nahe. Die Übersetzung wahrt den Vergleich und vermeidet eine theologische oder syntaktische Eindeutigkeit, die der Text nicht sicher bietet.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischer Knappheit. „Oberster“ bewahrt den Ranggedanken, ohne einen modernen Amtstitel einzutragen; „Schar“ hält die Bedeutung von גְּדוּד bewusst weiter als das stärker militärische „Truppe“.
