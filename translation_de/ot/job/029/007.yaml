lexical_decisions:
- source_word: בְּצֵאתִי
  choice: Als ich … hinausging
  rationale: Die Präposition ב mit dem Infinitivus constructus von יצא und dem Suffix der 1. Person Singular hat hier temporale Bedeutung. Die Formulierung ist natürlich und bewahrt zugleich das Motiv des Hinausgehens.
- source_word: שַׁעַר
  choice: zum Tor
  rationale: Das Tor war im altorientalischen Umfeld ein öffentlicher Versammlungs- und Gerichtsplatz. Der bestimmte Ausdruck wird direkt wiedergegeben, ohne ihn im Haupttext bereits zu »Stadttor« zusammenzuziehen.
- source_word: עֲלֵי קָרֶת
  choice: an der Stadt
  rationale: Die idiomatische Wendung ordnet das Tor räumlich der Stadt zu. »An der Stadt« bewahrt die formale Trennung von »Tor« und »Stadt«, während die Fußnote die natürliche Deutung »Stadttor« nennt.
- source_word: בָּרְחוֹב
  choice: auf dem Platz
  rationale: רְחוֹב bezeichnet hier einen breiten öffentlichen Freiraum oder Platz, nicht notwendig eine Straße. Im Deutschen ist bei einem öffentlichen Platz die Präposition »auf« idiomatisch.
- source_word: אָכִין
  choice: bereitete
  rationale: Der Hifil von כון kann »bereiten«, »aufstellen« oder »fest einrichten« bedeuten. »Bereitete« wahrt die Offenheit, ob Ijob seinen Sitz herrichten ließ, einnahm oder aufstellen ließ.
- source_word: מוֹשָׁבִי
  choice: meinen Sitz
  rationale: מוֹשָׁב bezeichnet im Zusammenhang mit Tor und öffentlichem Platz Ijobs Sitz beziehungsweise Sitzplatz in der Versammlung, nicht seinen Wohnort.
