  text: Then I said[a], ‘I will die in my nest, and I will multiply my days like the sand.’
translation:
  language: de
  text: 'Da sagte ich: »In meinem Nest werde ich sterben und meine Tage vermehren, bis sie so zahlreich sind wie der Sand.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »und meine Tage vermehren wie der Phönix«. Das hier mit »Sand« übersetzte hebräische Wort wird von manchen an dieser Stelle als Bezeichnung eines Vogels verstanden. Im Zusammenhang ist jedoch »Sand« wahrscheinlicher; dies entspricht dem verbreiteten biblischen Bild einer sehr großen Zahl.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da dachte ich
  rationale: אָמַר kann hier Jobs innere Aussage bzw. Erwartung einleiten. „Da dachte ich“ gibt den rückblickenden Zusammenhang im Deutschen natürlich wieder.
- source_word: עִם קִנִּי
  choice: in meinem Nest
  rationale: Das wörtliche Bild des Nestes bleibt erhalten; עִם wird in dieser Verbindung idiomatisch als Ort der Geborgenheit verstanden.
- source_word: אֶגְוָע
  choice: werde ich sterben
  rationale: Die schlichte Wiedergabe entspricht der Bedeutung des Verbs und passt zum würdevollen poetischen Register.
- source_word: וְכַחוֹל
  choice: wie den Sand
  rationale: חוֹל bedeutet gewöhnlich „Sand“ und bezeichnet hier wahrscheinlich bildhaft eine sehr große Zahl. Die mögliche Deutung als Vogelname wird in der Fußnote bewahrt.
- source_word: אַרְבֶּה יָמִים
  choice: meine Tage vermehren
  rationale: Die Form von רבה hat kausativ-mehrende Bedeutung; „meine Tage vermehren“ erhält die ungewöhnliche, aber verständliche poetische Ausdrucksweise und meint ein langes Leben.
