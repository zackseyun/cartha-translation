  text: וְ/יִֽחֲל֣וּ כַ/מָּטָ֣ר לִ֑/י וּ֝/פִי/הֶ֗ם פָּעֲר֥וּ לְ/מַלְקֽוֹשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/023.yaml
  text: They waited for me as for the rain[a], and they opened their mouths wide for the spring rain.
translation:
  language: de
  text: Sie warteten auf mich wie auf den Regen und öffneten ihren Mund weit für den Spätregen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Frühlingsregen“. Das hebräische Wort bezeichnet den späten saisonalen Regen gegen Ende der Regenzeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִחֲלוּ
  choice: sie warteten
  rationale: יחל bezeichnet hier ein erwartungsvolles Warten oder Hoffen. „Warteten“ passt zum Bild des ersehnten Regens und bleibt sachlich.
- source_word: כַמָּטָר
  choice: wie auf den Regen
  rationale: 'Das vergleichende כ beschreibt, wie sie auf Hiob warteten: so, wie man auf Regen wartet. Im Deutschen verlangt „warten“ idiomatisch die Präposition „auf“.'
- source_word: לִי
  choice: auf mich
  rationale: Das ausdrückliche Pronomen wird unmittelbar wiedergegeben. Dass damit im Zusammenhang besonders Hiobs Worte oder Rat gemeint sind, ergibt sich aus dem Kontext und wird nicht in den Text hineingetragen.
- source_word: וּפִיהֶם
  choice: und ihren Mund
  rationale: 'Das Hebräische verwendet den Singular „Mund“ mit einem pluralischen Possessivsuffix distributiv: jeder von ihnen öffnete seinen Mund. Diese Form ist im Deutschen natürlich.'
- source_word: פָּעֲרוּ
  choice: öffneten ... weit
  rationale: פער bezeichnet ein weites Öffnen, besonders des Mundes. Die Wiedergabe bewahrt das anschauliche Bild ohne die Nebenbedeutungen von „gaffen“.
- source_word: לְמַלְקוֹשׁ
  choice: für den Spätregen
  rationale: מַלְקוֹשׁ ist der späte saisonale Regen gegen Ende der Regenzeit. „Spätregen“ ist präzise, knapp und bewahrt den landwirtschaftlichen Gegensatz zum Frühregen.
