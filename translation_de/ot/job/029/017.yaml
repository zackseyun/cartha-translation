  text: וָֽ֭/אֲשַׁבְּרָ/ה מְתַלְּע֣וֹת עַוָּ֑ל וּ֝/מִ/שִּׁנָּ֗י/ו אַשְׁלִ֥יךְ טָֽרֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/017.yaml
  text: I broke the fangs of the unrighteous, and from his teeth I threw the prey.
translation:
  language: de
  text: Ich zerbrach die Fangzähne des Ungerechten und schleuderte die Beute aus seinen Zähnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְתַלְּעוֹת
  choice: Fangzähne
  rationale: Das seltene Wort bezeichnet hier die zupackenden Zähne beziehungsweise Kiefer eines Raubtiers. „Fangzähne“ bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: עַוָּל
  choice: des Ungerechten
  rationale: Das Substantiv bezeichnet einen Menschen, der Unrecht tut; die substantivierte Singularform entspricht dem hebräischen Singular.
- source_word: אַשְׁלִיךְ
  choice: riss … aus
  rationale: Das Verb bedeutet gewöhnlich „werfen, schleudern“ und kann in dieser Konstruktion das gewaltsame Entfernen ausdrücken. Im deutschen Raubtierbild gibt „aus den Zähnen reißen“ den gemeinten Rettungsakt idiomatisch wieder, ohne den Ausgang des Geschehens zu erweitern.
- source_word: טָרֶף
  choice: die Beute
  rationale: Das Wort bezeichnet Beute beziehungsweise das Zerrissene und führt das Raubtierbild fort.
theological_decisions:
- issue: Bildhafte Darstellung von Hiobs Rechtspflege
  choice: Das Raubtierbild bleibt vollständig erhalten.
  alternative: Die Aussage abstrakt als Befreiung eines Opfers aus der Gewalt eines Frevlers wiederzugeben.
  rationale: Der hebräische Text beschreibt Hiobs Eingreifen metaphorisch und identifiziert weder die Beute ausdrücklich mit einer Person noch die Handlung mit einem bestimmten Rechtsverfahren.
translation_notes:
  register: Kurzer, kraftvoller Parallelismus in modernem, würdigem Standarddeutsch. Die Vergangenheitsform passt zu Hiobs Rückblick; die maskuline Singularreferenz des Hebräischen bleibt durch „des Ungerechten“ und „ihm“ erkennbar.
