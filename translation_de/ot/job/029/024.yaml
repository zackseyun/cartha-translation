  text: אֶשְׂחַ֣ק אֲ֭לֵ/הֶם לֹ֣א יַאֲמִ֑ינוּ וְ/א֥וֹר פָּ֝נַ֗/י לֹ֣א יַפִּילֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/024.yaml
  text: I smiled at them—they did not believe it[c][b][a]; and they did not cast down the light of my face.
translation:
  language: de
  text: Ich lächelte ihnen zu – sie konnten es kaum glauben[a]; und sie trübten das Leuchten meines Gesichts nicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sie glaubten nicht«. Auch möglich: »Ich lachte ihnen zu – sie glaubten es nicht.« Die hebräische Aussage kann das Erstaunen über Hiobs wohlwollende Zuwendung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Sie ließen das Licht meines Gesichts nicht fallen.« Gemeint ist wohl, dass sie seinen freundlichen, wohlwollenden Gesichtsausdruck nicht zum Schwinden brachten.'
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂחַק אֲלֵהֶם
  choice: Ich lächelte ihnen zu
  rationale: שׂחק kann »lachen« oder »lächeln« bedeuten. Im Zusammenhang mit Hiobs wohlwollender Zuwendung passt »lächeln« am besten; אֶל bezeichnet die Ausrichtung auf die Menschen.
- source_word: לֹא יַאֲמִינוּ
  choice: sie konnten es kaum glauben
  rationale: Wörtlich heißt es »sie glaubten nicht«. Im Kontext drückt die Wendung wahrscheinlich ihr erstauntes Reagieren auf Hiobs freundliche Zuwendung aus; die Fußnote bewahrt die formale Alternative.
- source_word: וְאוֹר פָּנַי
  choice: das Leuchten meines Gesichts
  rationale: Die Bildrede bezeichnet einen hellen, freundlichen oder wohlwollenden Gesichtsausdruck. »Leuchten« bewahrt das Lichtbild und klingt im Deutschen natürlich.
- source_word: לֹא יַפִּילוּן
  choice: sie trübten … nicht
  rationale: Der Hifil von נפל bedeutet formal »fallen lassen/niederwerfen«. Mit »Licht/Leuchten des Gesichts« als Objekt gibt »trüben« die Wirkung idiomatisch wieder, ohne das Bild aufzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Bildsprache des Hebräischen bleibt mit »Leuchten meines Gesichts« erkennbar; das Verb wird für natürliche Verständlichkeit moderat idiomatisiert.
