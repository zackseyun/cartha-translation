  text: Meine Wurzel war zum Wasser hin ausgebreitet, und der Tau blieb über Nacht in meiner Ernte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: bei meinem Erntegut. Das hebräische Wort bedeutet gewöhnlich „Ernte“; wegen des Pflanzenbildes verstehen manche es hier als Laub oder Zweige.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשִׁי
  choice: Meine Wurzel
  rationale: Die morphologisch singularische Form mit Suffix der 1. Person Singular wird im Deutschen wörtlich und zugleich natürlich als „meine Wurzel“ wiedergegeben.
- source_word: פָתוּחַ
  choice: breitete sich … aus
  rationale: Das passive Partizip bezeichnet einen geöffneten beziehungsweise ausgebreiteten Zustand. Die verbale deutsche Fassung vermittelt das Bild einer Wurzel, die sich zum Wasser hin erstreckt, natürlich und anschaulich.
- source_word: אֱלֵי מָיִם
  choice: zum Wasser hin
  rationale: אֱלֵי bezeichnet die Richtung oder Ausrichtung; מָיִם wird hier kollektiv verstanden. „Zum Wasser hin“ bewahrt die Richtungsangabe und klingt im Deutschen natürlicher als „zu den Wassern“.
- source_word: וְטַל
  choice: und … der Tau
  rationale: Direkte und idiomatische Wiedergabe von טַל.
- source_word: יָלִין
  choice: blieb … über Nacht
  rationale: לון bezeichnet das Übernachten oder Verweilen über Nacht. Die Formulierung erhält diese zeitliche Nuance in klarem, modernem Deutsch.
- source_word: בִּקְצִירִי
  choice: auf meinen Zweigen
  rationale: קָצִיר bedeutet gewöhnlich „Ernte“, ist hier jedoch im Zusammenhang mit Wurzel und Tau ungewöhnlich. Ein auf Zweige beziehungsweise Geäst bezogener Sinn führt das Pflanzenbild stimmig fort; die geläufige Bedeutung „Ernte“ bleibt als echte lexikalische Alternative in der Fußnote erhalten.
