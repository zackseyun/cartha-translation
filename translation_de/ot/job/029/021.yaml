  source_fidelity: 'Die Wiedergabe von לִי שָׁמְעוּ als »Sie hörten mir zu«, von יִחֵלּוּ als erwartungsvolles Warten und von וַיִּדְּמוּ als Schweigen trifft den hebräischen Parallelismus gut. Die finale Formulierung »um meinen Rat zu hören« ist jedoch im Ausgangstext nicht angelegt: לְמוֹ stellt das Schweigen zu Hiobs Rat in Beziehung, bezeichnet aber keinen ausdrücklich formulierten Zweck und auch nicht das Hören des Rates.'
