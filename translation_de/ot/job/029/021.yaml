  yaml_path: translation/ot/job/029/021.yaml
  text: They listened to me and waited[b][a], and they kept silent for my counsel.
translation:
  language: de
  text: Sie hörten mir zu und warteten erwartungsvoll[a]; bei meinem Rat schwiegen sie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und hofften«. Das Verb kann wartendes Hoffen oder erwartungsvolles Warten ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »sie schwiegen bei meinem Rat«. Die Wendung kann ihr Schweigen bei Hiobs Rat oder als Reaktion auf ihn bezeichnen.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: לִי שָׁמְעוּ
  choice: Sie hörten mir zu
  rationale: Die Verbindung bezeichnet hier aufmerksames Hören auf Hiob; »jemandem zuhören« ist die natürliche deutsche Wiedergabe.
- source_word: וְיִחֵלּוּ
  choice: und warteten erwartungsvoll
  rationale: יחל kann Warten, Hoffen oder Erwarten bezeichnen. Im Kontext warten die Angesehenen gespannt auf Hiobs Worte; »warteten erwartungsvoll« bewahrt diese Nuance.
- source_word: וְיִדְּמוּ
  choice: sie schwiegen
  rationale: דמם bezeichnet hier Schweigen oder Stillsein. Das Präteritum fügt sich natürlich in Hiobs Rückblick ein.
- source_word: לְמוֹ עֲצָתִי
  choice: um meinen Rat zu hören
  rationale: Die poetische Präposition לְמוֹ stellt das Schweigen in Beziehung zu Hiobs Rat. Die finale Wiedergabe macht im Deutschen den naheliegenden Sinn verständlich, ohne die syntaktische Mehrdeutigkeit unmarkiert zu lassen.
- source_word: עֲצָתִי
  choice: meinen Rat
  rationale: עֵצָה bezeichnet in diesem Weisheitskontext Rat beziehungsweise Beratung. »Rat« ist modern, würdig und weniger altertümlich als »Ratschluss«.
