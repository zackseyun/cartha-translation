  text: מִֽי יִתְּנֵ֥/נִי כְ/יַרְחֵי קֶ֑דֶם כִּ֝/ימֵ֗י אֱל֣וֹהַּ יִשְׁמְרֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/002.yaml
  text: Oh[a], that I were as in months gone by, as in the days when God watched over me[b],
translation:
  language: de
  text: Wäre ich doch wie in den Monaten von einst, wie in den Tagen, als Gott über mich wachte[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als Gott mich behütete« oder »bewahrte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: Wäre ich doch
  rationale: Die wörtliche Frage »Wer wird mich geben?« ist hier eine hebräische Wunschformel. »Wäre ich doch« gibt den sehnsüchtigen Rückblick im modernen Deutschen natürlich wieder.
- source_word: כְיַרְחֵי קֶדֶם
  choice: wie in den Monaten von einst
  rationale: כְּ bezeichnet den Vergleich, יֶרַח den Monat und קֶדֶם hier die vergangene Zeit. Die Formulierung bewahrt das Zeitbild und den poetischen Ton.
- source_word: כִּימֵי
  choice: wie in den Tagen
  rationale: Die Wiedergabe erhält den parallelen Aufbau der beiden Zeitangaben.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Die poetische Singularform bezeichnet Gott; eine Erweiterung wie »der Allmächtige« wäre ohne שדי nicht begründet.
- source_word: יִשְׁמְרֵנִי
  choice: über mich wachte
  rationale: שׁמר kann bewahren, behüten oder über jemanden wachen bedeuten. Im Rückblick auf Gottes schützende Fürsorge ist »über mich wachte« klar und idiomatisch.
theological_decisions:
- issue: Gottes früheres Handeln in Hiobs Rückblick
  choice: Gott über mich wachte
  alternative: Gott mich behütete / bewahrte
  rationale: Die Formulierung beschreibt Gottes schützende Zuwendung, ohne die Aussage durch weitergehende lehrmäßige Festlegungen zu präzisieren.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der Wunschcharakter der hebräischen Redewendung und der Parallelismus der beiden Zeitangaben bleiben erhalten.
