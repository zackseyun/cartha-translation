  yaml_path: translation/ot/job/029/013.yaml
  text: The blessing of the perishing man came upon me[b][a], and I made the widow’s heart sing for joy.
translation:
  language: de
  text: Der Segen dessen, der zugrunde ging, kam über mich[a], und ich ließ das Herz der Witwe vor Freude jubeln[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Segen dessen, der dem Untergang nahe war, kam über mich.« Das hebräische Partizip kann jemanden bezeichnen, der zugrunde geht, ruiniert ist oder dem Tod nahe ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ich brachte das Herz der Witwe zum Jubeln« oder »ich ließ es sich freuen«. Das hebräische Verb bezeichnet hier ein veranlasstes freudiges Rufen oder Jubeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת
  choice: der Segen des
  rationale: Die Status-constructus-Verbindung wird als Genitiv wiedergegeben; im Kontext ist es der vom Bedrohten ausgesprochene Segen.
- source_word: אֹבֵד
  choice: des Verlorenen
  rationale: Das substantivierte Qal-Partizip bezeichnet einen Menschen, der zugrunde geht, dem Untergang nahe oder ruiniert ist. „Verlorenen“ wahrt die semantische Breite besser als eine Festlegung auf den Tod.
- source_word: עָלַי תָּבֹא
  choice: kam über mich
  rationale: Die Verbindung aus עַל und dem Bewegungsverb bewahrt das Bild eines Segens, der über Hiob kommt; das Imperfekt wird im rückblickenden poetischen Kontext als Vergangenheit verstanden.
- source_word: לֵב אַלְמָנָה
  choice: das Herz der Witwe
  rationale: Die Nominalverbindung wird natürlich und bildgetreu wiedergegeben; „Herz“ bezeichnet das innere Empfinden.
- source_word: אַרְנִן
  choice: ließ ich vor Freude jubeln
  rationale: 'Die Hifil-Form ist kausativ: Hiob bewirkte, dass das Herz der Witwe jubelte. Die deutsche Formulierung erhält sowohl die Kausalität als auch den freudigen Ausruf.'
