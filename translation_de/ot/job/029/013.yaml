  naturalness: Die Satzstellung der zweiten Vershälfte ist natürlich. Die substantivierte Form „des Verlorenen“ wirkt hier dagegen unidiomatisch und missverständlich. Die Fußnote b enthält zudem den grammatisch fehlerhaften Wortlaut „ließ ich sich freuen“.
