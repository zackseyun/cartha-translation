lexical_decisions:
- source_word: עֵינַיִם
  choice: Augen
  rationale: 'Der konkrete Plural bleibt als prädikatives Bild erhalten: Hiob gab dem Blinden Orientierung und praktische Hilfe.'
- source_word: הָיִיתִי
  choice: war ich
  rationale: Das Qal Perfekt 1. Person Singular beschreibt rückblickend Hiobs frühere Rolle; die deutsche Wortstellung folgt der poetischen Parallelstruktur.
- source_word: לַעִוֵּר
  choice: für den Blinden
  rationale: Die Präposition ל bezeichnet hier Beziehung beziehungsweise Nutzen; der substantivierte Singular kann repräsentativ verstanden werden.
- source_word: וְרַגְלַיִם
  choice: und … Füße
  rationale: Das konkrete Parallelbild zu »Augen« wird bewahrt und bezeichnet Hilfe bei Bewegung und Fortkommen.
- source_word: לַפִּסֵּחַ
  choice: für den Gehbehinderten
  rationale: Die Form bezeichnet einen Menschen, dessen Gehfähigkeit beeinträchtigt ist. Die Wahl ist im heutigen Deutsch verständlich und respektvoll, ohne das Bild der Füße aufzulösen.
- source_word: אָֽנִי
  choice: ich
  rationale: Das selbstständige Pronomen setzt Nachdruck auf Hiob. Die vorangestellte Formulierung »Für den Blinden war ich …« lässt diesen Nachdruck im Deutschen natürlich hervortreten, ohne ein unidiomatisches abschließendes »ich selbst«.
