  text: when his lamp shone above my head[a], and by his light I walked through darkness.
translation:
  language: de
  text: als seine Lampe über meinem Kopf leuchtete[a] und ich in seinem Licht durch die Finsternis ging.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ich in ihrem Licht durch die Finsternis ging.“ Das hebräische Suffix in „seinem/ihrem Licht“ kann sich im Zusammenhang auf Gott oder unmittelbar auf die Lampe beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהִלּוֹ נֵרוֹ
  choice: als seine Lampe … leuchtete
  rationale: Die Präposition ב mit dem Infinitiv bildet hier einen temporalen Nebensatz. נֵר wird konkret als „Lampe“ wiedergegeben; das Leuchten wird im Deutschen natürlich auf die Lampe bezogen.
- source_word: עֲלֵי רֹאשִׁי
  choice: über meinem Kopf
  rationale: Die Wendung bezeichnet die räumliche Position der Lampe und wird in modernem Deutsch idiomatisch wiedergegeben.
- source_word: לְאוֹרוֹ
  choice: bei seinem Licht
  rationale: ל bezeichnet hier das Licht als begleitendes bzw. leitendes Mittel. Das maskuline Suffix kann im Kontext auf Gott bezogen werden; diese Deutung bleibt im Haupttext erhalten.
- source_word: אֵלֶךְ
  choice: ich … ging
  rationale: Das Imperfekt beschreibt im rückblickenden Zusammenhang ein Geschehen der Vergangenheit. „ging“ ist natürlich und bewahrt das Bewegungsbild.
- source_word: חֹשֶׁךְ
  choice: durch die Dunkelheit
  rationale: Die Präposition „durch“ bringt im Deutschen die Bewegung trotz bzw. innerhalb der Dunkelheit idiomatisch zum Ausdruck.
theological_decisions:
- issue: Bezug des maskulinen Singularsuffixes in לְאוֹרוֹ
  choice: '„bei seinem Licht“: Bezug auf Gott im weiteren Zusammenhang'
  alternative: '„bei ihrem Licht“: unmittelbarer Bezug auf die Lampe'
  rationale: Hiob erinnert sich im Kontext an Gottes fürsorgliche Gegenwart. Grammatisch und bildlich ist beim zweiten Suffix jedoch auch der nähere Bezug auf die Lampe möglich; deshalb wird die Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete Bild der Lampe bleibt erhalten; die mögliche Mehrdeutigkeit des Suffixbezugs wird nicht stillschweigend beseitigt.
