source:
  edition: WLC
  text: וּ/מַה יִּצְדַּ֣ק אֱנ֣וֹשׁ עִם אֵ֑ל וּ/מַה יִּ֝זְכֶּ֗ה יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/004.yaml
  text: So how can man be righteous before God? And how can one born of woman be pure?[a][b]
translation:
  language: de
  text: Wie könnte da ein Mensch vor Gott[a] gerecht sein? Und wie könnte ein von einer Frau Geborener rein[b] sein?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Gott“. Im Hebräischen steht wörtlich „mit Gott“; die Wendung kann jedoch den Stand eines Menschen vor ihm bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sauber“ oder „unschuldig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה
  choice: Wie könnte da / Und wie könnte
  rationale: מַה leitet hier rhetorische Fragen ein und hat idiomatisch die Bedeutung „wie“. Das erste „da“ nimmt den verbindenden Charakter von וּ auf natürliche Weise auf; im zweiten Satz wird וּ ausdrücklich mit „Und“ wiedergegeben.
- source_word: יִצְדַּק
  choice: gerecht sein
  rationale: Das Qal von צדק bezeichnet hier das Gerecht- oder Im-Recht-Sein in Beziehung zu Gott. „Gerecht sein“ bewahrt die Aussageform, ohne die mögliche gerichtliche Nuance vorschnell auf einen bestimmten Rechtfertigungsbegriff festzulegen.
- source_word: אֱנוֹשׁ
  choice: ein Mensch
  rationale: אֱנוֹשׁ bezeichnet den Menschen, oft mit dem Beiklang seiner Schwäche und Sterblichkeit. „Ein Mensch“ gibt den generischen Singular im heutigen Deutsch natürlich wieder.
- source_word: עִם אֵל
  choice: vor Gott
  rationale: עִם bedeutet wörtlich „mit“. Im Zusammenhang bezeichnet die Wendung jedoch den Stand des Menschen Gott gegenüber; „vor Gott“ ist dafür im Deutschen idiomatisch und lässt die relationale wie die gerichtliche Nuance offen.
- source_word: יִזְכֶּה
  choice: rein sein
  rationale: Das Qal von זכה kann „rein“, „sauber“ oder „unschuldig sein“ bedeuten. „Rein sein“ bildet eine natürliche Parallele zu „gerecht sein“ und engt die Aussage nicht ausschließlich auf rechtliche Unschuld ein.
- source_word: יְלוּד אִשָּׁה
  choice: ein von einer Frau Geborener
  rationale: Die Wendung bezeichnet einen Menschen unter dem Gesichtspunkt seiner menschlichen Geburt und Geschöpflichkeit. Die substantivierte Form bewahrt das Bild und den generischen Sinn des Hebräischen.
theological_decisions:
- issue: Generische anthropologische Sprache
  choice: ein Mensch … ein von einer Frau Geborener
  alternative: ein Sterblicher … wer von einer Frau geboren ist
  rationale: Die hebräischen Singularformen sprechen repräsentativ vom Menschen. Die gewählte Form ist geschlechtsübergreifend verständlich und bewahrt zugleich die konkrete Bildsprache des zweiten Halbverses.
- issue: Relationale beziehungsweise gerichtliche Bedeutung des menschlichen Standes vor Gott
  choice: vor Gott
  alternative: mit Gott
  rationale: Obwohl die Präposition wörtlich „mit“ lautet, fragt der Vers nach der Gerechtigkeit des Menschen in seinem Verhältnis zu Gott. „Vor Gott“ erhält die mögliche Gerichtsszene, ohne eine ausgearbeitete Lehre der Rechtfertigung in den Text einzutragen.
- issue: Bedeutungsbreite von Reinheit und Unschuld
  choice: rein sein
  alternative: sauber sein; unschuldig sein
  rationale: Das Verb kann kultische, moralische oder gerichtliche Reinheit bezeichnen. „Rein“ bewahrt diese Spannung besser als das ausschließlich forensisch wirkende „unschuldig“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei rhetorischen Fragen und der poetische Parallelismus bleiben erhalten. „Ein von einer Frau Geborener“ ist bewusst leicht gehoben, um die prägnante hebräische Wendung abzubilden, bleibt aber allgemein verständlich.
