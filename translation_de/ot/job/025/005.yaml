id: JOB.25.5
reference: Job 25:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵ֣ן עַד יָ֭רֵחַ וְ/לֹ֣א יַאֲהִ֑יל וְ֝/כוֹכָבִ֗ים לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/005.yaml
  text: Behold[a], even the moon does not shine[b], and the stars are not pure in his eyes.
translation:
  language: de
  text: Sieh, selbst der Mond leuchtet nicht,[a] und die Sterne sind in seinen Augen nicht rein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist nicht hell«; möglicherweise auch: »gibt kein Licht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »nicht sauber«; möglicherweise auch: »nicht hell in seinen Augen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Leitet eine nachdrückliche Beobachtung ein und bewahrt den aufmerksamkeitslenkenden, poetisch gehobenen Charakter.
- source_word: עַד
  choice: selbst
  rationale: Hat hier vor dem folgenden Substantiv verstärkende Bedeutung, nicht räumliche oder zeitliche.
- source_word: יָרֵחַ
  choice: der Mond
  rationale: Direkte und natürliche Wiedergabe des genannten Himmelskörpers.
- source_word: לֹא יַאֲהִיל
  choice: leuchtet nicht
  rationale: Das seltene Verb bezeichnet hier wahrscheinlich das Leuchten oder Lichtgeben; die knappe Formulierung bleibt poetisch und wahrt die lexikalische Unsicherheit durch eine Fußnote.
- source_word: וְכוֹכָבִים
  choice: und die Sterne
  rationale: Gibt die koordinierte Fortführung des Bildes der Himmelskörper schlicht wieder.
- source_word: לֹא זַכּוּ
  choice: sind … nicht rein
  rationale: Bewahrt im Zusammenhang mit der Beurteilung vor Gott vorrangig den Sinn von Reinheit, ohne die mögliche Nuance von Helligkeit zu verschweigen.
- source_word: בְעֵינָיו
  choice: in seinen Augen
  rationale: Bewahrt die hebräische Perspektivmetapher, die auch im heutigen Deutschen verständlich und würdevoll ist.
theological_decisions:
- issue: Bezug des maskulinen Singularsuffixes in בְעֵינָיו („in seinen Augen“)
  choice: „seinen“ bezieht sich auf Gott
  alternative: Bezug auf einen nicht näher bezeichneten Betrachter innerhalb des poetischen Arguments
  rationale: Im Zusammenhang von Ijob 25,2–6 spricht Bildad von Gottes Erhabenheit und der Unreinheit der Geschöpfe vor ihm; daher ist Gott der naheliegende Bezug. Die Übersetzung fügt den Gottesnamen jedoch nicht erklärend in den Vers ein.
translation_notes:
  register: Modernes Standarddeutsch mit knapper, würdevoller poetischer Syntax. »Sieh« erhält den Aufmerksamkeitssignalcharakter von הֵן; »in seinen Augen« bewahrt das hebräische Bild. Die Fußnoten spiegeln die genuine lexikalische Unsicherheit der beiden Verben wider.
