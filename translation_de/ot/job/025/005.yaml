  source_fidelity: Die Übersetzung gibt die emphatische Wendung הֵן עַד angemessen mit „Sieh, selbst“ wieder. „der Mond leuchtet nicht“ entspricht dem hier wahrscheinlich lichtbezogenen יַאֲהִיל; „die Sterne sind in seinen Augen nicht rein“ bewahrt die prädikative Aussage von לֹא זַכּוּ und die Perspektivmetapher בְּעֵינָיו. Der im Kontext naheliegende Gottesbezug von „seinen“ wird nicht unnötig expliziert.
