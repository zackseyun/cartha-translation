- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: אמר bedeutet in der üblichen Redeeinleitung „sagen“; die Wiedergabe erhält beide Verben der hebräischen Formel.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: Da antwortete ... und sagte
  rationale: „Da“ kennzeichnet knapp den Fortgang des Dialogs, während die zweigliedrige hebräische Redeeinleitung formal erkennbar bleibt.
