  yaml_path: translation/ot/job/025/003.yaml
  text: Is there any number to his troops? And upon whom does his light not rise?[a][b][c]
translation:
  language: de
  text: Kann man seine Truppen zählen?[a] Und über wem geht sein Licht nicht auf?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kann man seine Heerscharen zählen?«'
    reason: lexical_alternative
  - marker: b
    text: »Sein Licht« kann Gottes allumfassendes Licht, seinen Glanz oder seine Reichweite bezeichnen; der hebräische Text legt die Bedeutung nicht genauer fest.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֵשׁ מִסְפָּר
  choice: Kann man … zählen?
  rationale: 'Die hebräische Existenzfrage lautet wörtlich etwa: »Gibt es eine Zahl für …?« Die deutsche Formulierung gibt denselben Sinn natürlich und prägnant wieder.'
- source_word: לִגְדוּדָיו
  choice: seine Truppen
  rationale: גְּדוּד bezeichnet eine Truppe, Schar oder militärische Abteilung. »Truppen« wahrt das militärische Bild und passt zum Kontext von Gottes überwältigender Herrschaft.
- source_word: וְעַל־מִי
  choice: Und über wem
  rationale: »Über wem« bildet die räumliche Vorstellung von עַל ab und ist in Verbindung mit aufgehender Helligkeit idiomatisch.
- source_word: לֹא יָקוּם
  choice: geht … nicht auf
  rationale: קוּם bedeutet »aufstehen, sich erheben«. Bei Licht gibt »aufgehen« das Bild im Deutschen natürlich wieder, ohne dessen genaue Deutung festzulegen.
- source_word: אוֹרֵהוּ
  choice: sein Licht
  rationale: אוֹר bedeutet »Licht«; das maskuline Possessivsuffix wird direkt mit »sein« wiedergegeben. Die offene Bildsprache bleibt erhalten.
theological_decisions:
- issue: Bezug der maskulinen Suffixe in »seine Truppen« und »sein Licht«
  choice: Die Pronomen bleiben erhalten und beziehen sich im Zusammenhang auf Gott.
  alternative: Explizit »Gottes Truppen« und »Gottes Licht« zu schreiben.
  rationale: Vers 2 macht Gott zum Gegenstand von Bildads Rede. Die Pronomen geben den hebräischen Wortlaut jedoch genauer wieder und vermeiden eine unnötige Explizierung.
- issue: Bedeutung von »sein Licht«
  choice: Das breite, nicht näher bestimmte Bild des göttlichen Lichts bleibt stehen.
  alternative: Das Licht ausdrücklich als Sonnenlicht, göttlichen Glanz, Gunst oder universale Wirksamkeit zu deuten.
  rationale: Der hebräische Text legt die Art des Lichts nicht fest. Eine engere Bestimmung würde eine echte Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Die beiden rhetorischen Fragen sind knapp und verständlich formuliert; das militärische Bild und die offene Lichtmetapher bleiben gewahrt.
