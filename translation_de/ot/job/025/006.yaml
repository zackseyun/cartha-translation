id: JOB.25.6
reference: Job 25:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַ֭ף כִּֽי אֱנ֣וֹשׁ רִמָּ֑ה וּ/בֶן אָ֝דָ֗ם תּוֹלֵעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/025/006.yaml
  text: how much less man[a], who is a maggot, and the son of man[b], who is a worm!
translation:
  language: de
  text: wie viel weniger der Mensch[a], der eine Made ist, und das Menschenkind[b], das ein Wurm ist!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sterbliche Mensch“; das hebräische Wort אֱנוֹשׁ hebt häufig die Schwachheit und Vergänglichkeit des Menschen hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sohn des Menschen“; hier eine poetische Bezeichnung für einen Menschen, kein messianischer Titel.'
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: wie viel weniger
  rationale: 'Die Wendung führt Bildads Schluss vom Größeren zum Kleineren fort: Wenn schon die Himmelskörper vor Gott nicht rein sind, dann erst recht nicht der gebrechliche Mensch.'
- source_word: אֱנוֹשׁ
  choice: der Mensch
  rationale: Das Wort bezeichnet den Menschen unter dem Gesichtspunkt seiner Schwachheit und Sterblichkeit. Die Fußnote macht diese Nuance sichtbar, ohne sie im Haupttext übermäßig auszudeuten.
- source_word: רִמָּה
  choice: Made
  rationale: Das Substantiv bezeichnet besonders eine mit Verwesung verbundene Made und bleibt damit vom allgemeineren תּוֹלֵעָה im zweiten Halbvers unterschieden.
- source_word: בֶן אָדָם
  choice: das Menschenkind
  rationale: Die poetische Wendung wird quellennah wiedergegeben und steht parallel zu אֱנוֹשׁ. Im Deutschen bewahrt „Menschenkind“ die Bildstruktur, ohne hier einen Titel nahezulegen.
- source_word: תּוֹלֵעָה
  choice: Wurm
  rationale: „Wurm“ ist die natürliche allgemeine Entsprechung und erhält die begriffliche Unterscheidung von der vorhergehenden „Made“.
theological_decisions:
- issue: Ob בֶן אָדָם hier als messianischer Titel zu verstehen ist
  choice: Nicht titularer poetischer Ausdruck für einen Menschen
  alternative: Messianischer Titel „Menschensohn“
  rationale: Die Wendung steht parallel zu אֱנוֹשׁ und beschreibt in diesem Zusammenhang menschliche Niedrigkeit und Vergänglichkeit. Eine messianische Deutung würde dem Kontext eine nicht angezeigte Aussage hinzufügen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung der Relativsätze macht die knappen hebräischen Nominalsätze im Deutschen klar und erhält zugleich den drastischen poetischen Parallelismus von „Made“ und „Wurm“.
