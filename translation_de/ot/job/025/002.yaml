  text: הַמְשֵׁ֣ל וָ/פַ֣חַד עִמּ֑/וֹ עֹשֶׂ֥ה שָׁ֝ל֗וֹם בִּ/מְרוֹמָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/002.yaml
  text: Dominion and dread are with him[b][a]; he makes peace in his heights.
translation:
  language: de
  text: Herrschaft und Schrecken sind bei ihm[a]; er schafft Frieden in seinen Höhen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Herrschaft und Schrecken gehören ihm.«'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »an seinen erhabenen Orten«; wahrscheinlich ist der erhabene himmlische Bereich gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֵׁל
  choice: Herrschaft
  rationale: Das Substantiv bezeichnet Herrschaft oder Herrschergewalt. »Herrschaft« gibt den abstrakten Begriff knapp wieder und wahrt den nominalen Stil des ersten Satzteils.
- source_word: וָפַחַד
  choice: und Schrecken
  rationale: פחד kann Furcht, Schrecken oder Grauen bezeichnen. »Schrecken« bringt die ehrfurchtgebietende, Furcht auslösende Majestät zum Ausdruck, ohne die Aussage zu einer bloß inneren »Furcht« abzuschwächen.
- source_word: עִמּוֹ
  choice: sind bei ihm
  rationale: Die Präpositionalfügung bedeutet wörtlich »bei ihm«. Im verblosen hebräischen Satz wird im Deutschen »sind« ergänzt; die Formulierung wahrt die mögliche Bedeutung des Bei-ihm-Seins, ohne sie eindeutig als Besitzverhältnis festzulegen.
- source_word: עֹשֶׂה
  choice: er schafft
  rationale: Das Partizip von עשה beschreibt hier Gottes kennzeichnendes Handeln. »Er schafft« ist im Deutschen klar und lässt die durative beziehungsweise charakteristische Nuance offen.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: שׁלום umfasst Frieden, Wohlergehen und unversehrte Ordnung. »Frieden« ist im kosmischen Zusammenhang natürlich und hält die umfassenderen Bedeutungsanteile offen.
- source_word: בִּמְרוֹמָיו
  choice: in seinen Höhen
  rationale: מרום bezeichnet eine Höhe oder einen erhabenen Ort. Der Plural mit Suffix wird durch »in seinen Höhen« formal nah und poetisch wiedergegeben; die naheliegende Beziehung auf den himmlischen Bereich wird nicht schon im Haupttext festgeschrieben.
theological_decisions:
- issue: Sinn des ersten, verblosen Satzteils
  choice: Herrschaft und Schrecken sind bei Gott
  alternative: Herrschaft und Schrecken gehören ihm
  rationale: עִמּוֹ lässt sowohl eine transparente räumlich-begleitende Wiedergabe (»bei ihm«) als auch eine possessive Deutung (»gehören ihm«) zu. Der Haupttext bewahrt die offenere Formulierung.
- issue: Bezug der »Höhen«
  choice: Die poetische Ortsangabe bleibt als »seine Höhen« erhalten
  alternative: Explizite Wiedergabe als »seine Himmel« beziehungsweise »seine himmlischen Höhen«
  rationale: Der Kontext legt den erhabenen himmlischen Bereich nahe, doch das hebräische Wort bedeutet zunächst »Höhen«. Die Übersetzung vermeidet daher eine unnötige Verengung.
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch verständlich. Die knappe Parallelstruktur und die kosmische Bildsprache des Hebräischen bleiben erhalten.
