source:
  edition: WLC
  text: מָֽה אֱ֭נוֹשׁ כִּ֣י תְגַדְּלֶ֑/נּוּ וְ/כִי תָשִׁ֖ית אֵלָ֣י/ו לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/017.yaml
  text: What is man[a], that you make so much of him[b], and that you set your heart on him?
translation:
  language: de
  text: Was ist der Mensch[a], dass du ihn so hoch achtest[b] und dein Herz auf ihn richtest?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mensch“ übersetzt das hebräische אֱנוֹשׁ, eine Singularbezeichnung für den sterblichen Menschen; vgl. Psalm 8,5.
    reason: cross_reference
  - marker: b
    text: 'Oder: „ihn groß machst“ oder „ihn erhebst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Was ist
  rationale: Leitet die rhetorische Frage direkt und im Deutschen natürlich ein.
- source_word: אֱנוֹשׁ
  choice: der Mensch
  rationale: Bewahrt den repräsentativen Singular und bezeichnet den sterblichen, hinfälligen Menschen; zugleich bleibt die Anspielung auf Psalm 8 erkennbar.
- source_word: כִּי
  choice: dass
  rationale: Führt nach der rhetorischen Frage den Inhalt ein und bildet die hebräische Satzstruktur idiomatisch ab.
- source_word: תְגַדְּלֶנּוּ
  choice: du ihn so wichtig nimmst
  rationale: Das Piel von גדל bedeutet hier, jemanden groß zu machen beziehungsweise ihm großes Gewicht beizumessen. Die Formulierung ist modern und erhält Hiobs beunruhigten Unterton.
- source_word: וְכִי
  choice: und
  rationale: Verbindet die parallele zweite Aussage flüssig mit der ersten; das bereits gesetzte „dass“ wirkt über die Koordination fort.
- source_word: תָשִׁית
  choice: richtest
  rationale: Gibt das Setzen oder Lenken des Herzens auf ein Ziel in natürlichem Deutsch wieder.
- source_word: אֵלָיו
  choice: auf ihn
  rationale: Bezeichnet die Richtung und den Gegenstand der göttlichen Aufmerksamkeit.
- source_word: לִבֶּךָ
  choice: dein Herz
  rationale: Bewahrt das konkrete anthropomorphe Bild des Hebräischen, statt es zu „Aufmerksamkeit“ oder „Sinn“ zu abstrahieren.
theological_decisions:
- issue: Repräsentativer Singular und Geschlechtsbezug von אֱנוֹשׁ
  choice: der Mensch
  alternative: ein Mensch; die Menschheit; der Sterbliche
  rationale: „Der Mensch“ bewahrt den grammatischen und repräsentativen Singular, ist im modernen Standarddeutsch generisch verständlich und hält die literarische Beziehung zu Psalm 8 offen.
- issue: Anthropomorphe Rede von Gottes Zuwendung
  choice: dein Herz auf ihn richtest
  alternative: ihm deine Aufmerksamkeit schenkst; deinen Sinn auf ihn richtest
  rationale: Die Übersetzung erhält das hebräische Bild vom Herzen Gottes und löst seine gedankliche wie emotionale Spannweite nicht in eine abstrakte Aussage auf.
- issue: Ton der göttlichen Aufmerksamkeit im Kontext von Hiobs Klage
  choice: so wichtig nimmst
  alternative: groß machst; erhebst
  rationale: Die Formulierung kann hohe Beachtung ausdrücken, ohne diese ausschließlich positiv zu deuten. So bleibt die Spannung erhalten, dass Gottes intensive Aufmerksamkeit für Hiob im Kontext belastend wirkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und der poetische Parallelismus bleiben erhalten; „so wichtig nimmst“ vermittelt den Sinn idiomatisch, während die Fußnote die formnäheren Alternativen dokumentiert.
