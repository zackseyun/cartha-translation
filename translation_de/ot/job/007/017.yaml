  source_fidelity: Der Entwurf gibt die rhetorische Frage, den repräsentativen Singular אֱנוֹשׁ und das Bild vom auf den Menschen gerichteten Herzen zutreffend wieder. „So wichtig nehmen“ kann im Deutschen jedoch vor allem „ernst nehmen“ bedeuten und bildet גדל im Piel weniger unmittelbar ab. „So hoch achten“ gibt die im Kontext gemeinte hohe Beachtung klarer und natürlich wieder.
  naturalness: „Was ist der Mensch, dass du ihn so hoch achtest und dein Herz auf ihn richtest?“ ist modernes, würdiges Standarddeutsch und bewahrt den Parallelismus. Die bisherige Wendung „ihn so wichtig nimmst“ ist in dieser Bedeutung weniger idiomatisch.
  terminology: „Der Mensch“ ist als repräsentativer Singular angemessen. „Herz“ soll wegen des hebräischen Bildes stehen bleiben. Die bisherige Fußnotenalternative „groß sein lässt“ ist für das transitive Piel von גדל keine präzise Alternative und wird entfernt.
