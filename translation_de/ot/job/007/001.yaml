  source_fidelity: 'Die rhetorische Frage und der Vergleich mit den Tagen eines Lohnarbeiters werden zutreffend wiedergegeben. „Frondienst“ ist jedoch zu eng und historisch spezifisch: Es bezeichnet im Deutschen gewöhnlich unentgeltliche, zwangsweise Arbeitsleistungen gegenüber einer Herrschaft und legt damit Aspekte fest, die צָבָא hier nicht ausdrücklich enthält. Der hebräische Begriff lässt den Bereich von Kriegsdienst bis zu einem beschwerlichen, auferlegten Dienst offen.'
