  text: הֲ/לֹא צָבָ֣א לֶ/אֱנ֣וֹשׁ על אָ֑רֶץ וְ/כִ/ימֵ֖י שָׂכִ֣יר יָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/001.yaml
  text: Is not man consigned to hard service on earth[a], and are not his days like those of a hired worker?
translation:
  language: de
  text: Ist dem Menschen auf Erden nicht ein schwerer Dienst auferlegt[a], und sind seine Tage nicht wie die eines Tagelöhners?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ist dem Menschen auf Erden nicht Kriegsdienst auferlegt?“ Das hebräische Wort צָבָא kann Kriegsdienst oder Kriegsdienstzeit bezeichnen, im Zusammenhang aber auch allgemeiner einen beschwerlichen, auferlegten Dienst, wie der Vergleich mit einem Tagelöhner nahelegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Muss ... nicht ...?
  rationale: Die rhetorische Frage erwartet Zustimmung. Zusammen mit צָבָא gibt „Muss ... nicht Frondienst leisten?“ die auferlegte Verpflichtung im Deutschen natürlich wieder.
- source_word: צָבָא
  choice: Frondienst leisten
  rationale: Das Wort kann Kriegs- oder Heeresdienst, aber auch eine auferlegte, beschwerliche Dienstzeit bezeichnen. Der Parallelismus mit dem Tagelöhner legt hier belastenden Pflichtdienst nahe; die militärische Bildhälfte bleibt in der Fußnote sichtbar.
- source_word: אֱנוֹשׁ
  choice: der Mensch
  rationale: Bezeichnet den Menschen unter dem Gesichtspunkt seiner Schwäche und Sterblichkeit. „Der Mensch“ ist im modernen Standarddeutsch generisch und würdig.
- source_word: עַל־אָרֶץ
  choice: auf der Erde
  rationale: Bewahrt den umfassenden Schauplatz menschlichen Lebens und meint nicht ein bestimmtes Landstück.
- source_word: וְכִימֵי
  choice: und sind seine Tage nicht wie die eines
  rationale: Die Vergleichskonstruktion wird für natürliches Deutsch als parallele rhetorische Frage entfaltet.
- source_word: שָׂכִיר
  choice: Tagelöhners
  rationale: Gemeint ist ein gegen Lohn beschäftigter Arbeiter. „Tagelöhner“ passt besonders zum Bezug auf seine „Tage“ und vermittelt die begrenzte, mühsame Dienstzeit prägnant.
- source_word: יָמָיו
  choice: seine Tage
  rationale: Bewahrt das konkrete zeitliche Bild des Hebräischen statt es zu „Lebenszeit“ zu verallgemeinern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Frondienst“ hält den Gedanken eines belastenden, auferlegten Dienstes fest; die mögliche militärische Bedeutung wird nicht beseitigt, sondern in der Fußnote dokumentiert. Der Marker [a] steht unmittelbar bei der betreffenden Wendung.
