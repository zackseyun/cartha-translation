  source_fidelity: Die Passivkonstruktionen geben die Hofal-Form הָנְחַלְתִּי und das passive מִנּוּ zutreffend als Hiob zugewiesenes Los wieder. Die zeitliche und syntaktische Parallelität bleibt erhalten. Für שָׁוְא ist „Vergeblichkeit“ im Kontext treffender als „Nichtigkeit“, das im heutigen Deutsch leicht „Nicht-Existenz“ nahelegt.
  naturalness: „So sind mir … zugeteilt worden“ ist modernes, flüssiges Standarddeutsch und wahrt zugleich den resultativen Bezug der hebräischen Perfektformen. „Nächte der Mühsal“ bildet die hebräische Constructus-Verbindung enger nach als „Nächte voller Mühsal“ und klingt dennoch natürlich.
  terminology: „Vergeblichkeit“ deckt hier den Bereich von שָׁוְא (Leere, vergebliche/futile Beschaffenheit) idiomatisch ab. „Mühsal“ ist für עָמָל als leidvolle Plage bzw. Anstrengung angemessen, ohne es einseitig auf Erwerbsarbeit festzulegen.
