  text: כֵּ֤ן הָנְחַ֣לְתִּי לִ֭/י יַרְחֵי שָׁ֑וְא וְ/לֵיל֥וֹת עָ֝מָ֗ל מִנּוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/003.yaml
  text: So I have been allotted months of emptiness[b][a], and nights of misery have been assigned to me.
translation:
  language: de
  text: So sind mir Monate der Vergeblichkeit[a] zugeteilt worden, und Nächte der Mühsal[b] sind mir zugemessen worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Monate der Leere“ oder „Monate der Nichtigkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Nächte der Plage“, „Nächte der Not“ oder „Nächte des Leids“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: So
  rationale: Leitet aus dem Vergleich in Vers 1–2 die entsprechende Aussage über Hiobs eigenes Erleben ab und bewahrt den folgernden beziehungsweise vergleichenden Anschluss.
- source_word: הָנְחַ֣לְתִּי לִי
  choice: wurden mir … zugeteilt
  rationale: Die Hofal-Form stellt Hiob als Empfänger eines ihm auferlegten Loses dar. Die deutsche Passivkonstruktion gibt dies natürlich wieder.
- source_word: יַרְחֵי שָׁוְא
  choice: Monate der Nichtigkeit
  rationale: שָׁוְא kann Leere, Vergeblichkeit oder Nichtigkeit bezeichnen. „Nichtigkeit“ lässt die Aussage bewusst offen zwischen inhaltsleerer und vergeblicher Zeit.
- source_word: וְלֵילוֹת עָמָל
  choice: und Nächte voller Mühsal
  rationale: עָמָל umfasst Mühsal, Plage, Not und leidvolle Anstrengung. „Voller Mühsal“ ist im Deutschen verständlich und passt zu Hiobs schmerzlichem Erleben, ohne den Begriff auf Arbeit zu verengen.
- source_word: מִנּוּ לִי
  choice: wurden mir zugemessen
  rationale: Die passive Verbform bezeichnet Nächte, die Hiob bestimmt beziehungsweise als Anteil zugemessen wurden. „Zugemessen“ wahrt die Parallele zur ersten Vershälfte, ohne dasselbe Verb zu wiederholen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Passivstruktur des Hebräischen bleibt erhalten; „zugeteilt“ und „zugemessen“ vermitteln das Hiob auferlegte Los. Die beiden mehrdeutigen Leidensbegriffe werden im Haupttext nicht unnötig präzisiert, ihre wesentlichen Alternativen stehen in den Fußnoten.
