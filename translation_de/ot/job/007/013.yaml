lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי ist hier am natürlichsten als zeitlich-bedingte Einleitung zu Hiobs wiederkehrendem Gedanken zu verstehen. Der Zusammenhang in Vers 14 zeigt, was geschieht, wenn er auf Ruhe hofft.
- source_word: אָמַרְתִּי
  choice: ich sage
  rationale: Die Perfektform kann wörtlich »ich sagte« heißen; im Zusammenhang gibt das deutsche Präsens jedoch einen wiederkehrenden oder jeweils neu gefassten Gedanken natürlich wieder.
- source_word: תְּנַחֲמֵנִי
  choice: wird mich trösten
  rationale: Das Piel von נחם bezeichnet hier das Trösten beziehungsweise Linderung durch Ruhe.
- source_word: עַרְשִׂי
  choice: mein Bett
  rationale: עֶרֶשׂ bezeichnet ein Bett oder Ruhelager. »Bett« ist im Deutschen die unmittelbarste Entsprechung und wird vom folgenden Synonym unterschieden.
- source_word: יִשָּׂא
  choice: wird … mittragen
  rationale: נשׂא bedeutet grundsätzlich »heben, tragen«. »Mittragen« bewahrt das Bild einer Last und drückt verständlich aus, dass Hiob vom Lager Entlastung in seiner Klage erwartet.
- source_word: בְשִׂיחִי
  choice: meine Klage
  rationale: שִׂיחַ kann Nachsinnen, Äußerung oder Klage bezeichnen. Im Kontext von Hiobs Leid und seiner belasteten Rede liegt »Klage« nahe.
- source_word: מִשְׁכָּבִי
  choice: mein Lager
  rationale: מִשְׁכָּב bezeichnet den Ort des Liegens. »Lager« bildet mit »Bett« ein natürliches poetisches Begriffspaar, ohne identische Wiederholung.
