  text: גַּם אֲנִי֮ לֹ֤א אֶחֱשָׂ֫ךְ פִּ֥/י אֲֽ֭דַבְּרָה בְּ/צַ֣ר רוּחִ֑/י אָ֝שִׂ֗יחָה בְּ/מַ֣ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/011.yaml
  text: I also will not restrain my mouth[a]; I will speak in the distress of my spirit[c][b]; I will complain in the bitterness of my soul.
translation:
  language: de
  text: Auch ich werde meinen Mund nicht zurückhalten[a]; ich will reden in der Bedrängnis meines Geistes[b]; ich will klagen[c] in der Bitterkeit meiner Seele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meinen Mund nicht vorenthalten“; gemeint ist, die eigenen Worte nicht zurückzuhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in der Angst meines Geistes“.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb kann je nach Zusammenhang auch „reden“, „nachsinnen“ oder „sein Leid aussprechen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Die additive Grundbedeutung wird bewahrt, ohne einen im Hebräischen nicht ausdrücklich bezeichneten Kausalzusammenhang einzuführen.
- source_word: לֹא אֶחֱשָׂךְ פִּי
  choice: ich werde meinen Mund nicht zurückhalten
  rationale: Die Wendung gibt das Bild des hebräischen Idioms wieder und ist im Deutschen verständlich; gemeint ist, dass Hiob seine Worte nicht länger zurückhält.
- source_word: אֲדַבְּרָה
  choice: ich will reden
  rationale: Die Form drückt hier Hiobs Entschluss aus. „Ich will reden“ klingt im Deutschen entschlossen und gibt das einfache Verb דבר unmittelbar wieder.
- source_word: בְּצַר רוּחִי
  choice: in der Bedrängnis meines Geistes
  rationale: צַר bezeichnet Bedrängnis oder Angst. „Geist“ bewahrt die eigene Bild- und Begriffswelt von רוּחַ, ohne sie technisch-dogmatisch zu bestimmen.
- source_word: אָשִׂיחָה
  choice: ich will klagen
  rationale: Das Verb kann nachdenken, reden oder klagen bezeichnen. Im Zusammenhang von Leid und Seelenbitterkeit ist „klagen“ die naheliegende kontextuelle Wiedergabe.
- source_word: בְּמַר נַפְשִׁי
  choice: in der Bitterkeit meiner Seele
  rationale: Die Formulierung bewahrt sowohl das Bitterkeitsbild als auch נֶפֶשׁ als Bezeichnung von Hiobs innerem, lebendigem Selbst.
theological_decisions:
- issue: Die anthropologischen Begriffe רוּחַ und נֶפֶשׁ in der hebräischen Poesie
  choice: Unterschieden als „Geist“ und „Seele“ wiedergeben
  alternative: Beide vereinheitlichend als „Inneres“ wiedergeben oder mit „Sinn“ und „Herz“ übersetzen
  rationale: Der Vers verwendet zwei verschiedene, poetisch parallele Begriffe. Ihre Unterscheidung bleibt erhalten, ohne daraus eine bestimmte Lehre über die Zusammensetzung des Menschen abzuleiten.
- issue: Bedeutungsspanne von אָשִׂיחָה
  choice: Im Haupttext „ich will klagen“
  alternative: „ich will reden“, „ich will nachsinnen“ oder „ich will meinen Schmerz aussprechen“
  rationale: Der leidvolle Kontext stützt die klagende Bedeutung, doch eine Fußnote hält die echte lexikalische Mehrdeutigkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener poetischer Parallelität. „Mund zurückhalten“ bewahrt das hebräische Bild, während „Bedrängnis“, „Geist“, „Bitterkeit“ und „Seele“ die dichte Klagesprache wiedergeben. Die Satzfolge mit Semikola spiegelt die drei entschlossenen Aussagen des Verses.
