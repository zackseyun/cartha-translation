  text: then you terrify me with dreams and frighten me with visions[a].
translation:
  language: de
  text: dann erschreckst du mich mit Träumen und jagst mir mit Visionen Angst ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und du erschreckst mich in Träumen, und von Visionen versetzt du mich in Angst.“ Die hebräischen Präpositionen können formaler mit „in/durch“ beziehungsweise „von/aus“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: dann
  rationale: Die Konjunktion knüpft an Hiobs vorausgehende Klage an; „dann“ gibt hier die zeitliche beziehungsweise folgernde Verbindung natürlich wieder.
- source_word: חִתַּתַּנִי
  choice: erschreckst du mich
  rationale: Die Piel-Form von חתת bezeichnet ein heftiges Versetzen in Schrecken. „erschreckst du mich“ ist im modernen Deutschen natürlich und wahrt die direkte Anrede Gottes.
- source_word: בַחֲלֹמוֹת
  choice: mit Träumen
  rationale: 'ב kann hier instrumental verstanden werden: Die Träume sind das Mittel des Erschreckens. „mit Träumen“ ist idiomatisch und lässt die präpositionale Nuance offen genug.'
- source_word: וּמֵחֶזְיֹנוֹת
  choice: und … mit Visionen
  rationale: מן kann Herkunft oder Mittel bezeichnen. Im poetischen Parallelismus ist die instrumentale Wiedergabe „mit Visionen“ natürlich; das einleitende ו wird mit „und“ wiedergegeben.
- source_word: תְּבַעֲתַנִּי
  choice: jagst mir … Angst ein
  rationale: בעת im Piel drückt heftiges Erschrecken oder Versetzen in Angst aus. Die Wendung gibt die Intensität wieder und vermeidet eine monotone Wiederholung desselben deutschen Verbs.
