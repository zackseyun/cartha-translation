  variant: modern standard German
source:
  edition: WLC
  text: כַּ֭/מָּה לֹא תִשְׁעֶ֣ה מִמֶּ֑/נִּי לֹֽא תַ֝רְפֵּ֗/נִי עַד בִּלְעִ֥/י רֻקִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/019.yaml
  text: How long will you not look away from me[a], nor leave me alone until I swallow my spit?
translation:
  language: de
  text: Wie lange willst du deinen Blick nicht von mir abwenden[a] und mich nicht in Ruhe lassen, bis ich meinen Speichel geschluckt habe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie lange willst du nicht von mir wegsehen?« Die Wendung »bis ich meinen Speichel geschluckt habe« bedeutet: auch nur für einen ganz kurzen Augenblick.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Wie lange
  rationale: In diesem Klagezusammenhang leitet כַּמָּה eine zeitliche Frage ein; »Wie lange« gibt sie im Deutschen natürlich wieder.
- source_word: תִשְׁעֶה מִמֶּנִּי
  choice: willst du deinen Blick nicht von mir abwenden
  rationale: שׁעה bezeichnet hier das Richten beziehungsweise Wenden des Blicks. Die Formulierung bewahrt das Bild von Gottes anhaltender, bedrängender Beobachtung.
- source_word: תַרְפֵּנִי
  choice: mich nicht in Ruhe lassen
  rationale: Die Hifil-Form von רפה bedeutet loslassen oder von jemandem ablassen; »in Ruhe lassen« ist gegenwärtiges, verständliches Deutsch und passt zum Parallelismus.
- source_word: עַד
  choice: bis
  rationale: עַד bezeichnet die zeitliche Grenze der erbetenen kurzen Ruhepause.
- source_word: בִּלְעִי רֻקִּי
  choice: bis ich meinen Speichel geschluckt habe
  rationale: Die wörtlich-anschauliche Wendung bezeichnet eine äußerst kurze Zeitspanne. »Speichel« ist im modernen Standarddeutsch natürlich und würdig, ohne das körperliche Bild abzuschwächen.
theological_decisions:
- issue: Gottes Blick als bedrängende Beobachtung
  choice: Das Bild des nicht abgewandten Blicks bleibt ausdrücklich erhalten.
  alternative: 'Allgemeiner: »Wie lange lässt du nicht von mir ab?«'
  rationale: Der hebräische Text verbindet Jobs Bitte mit dem Motiv göttlicher Beobachtung. Die Übersetzung soll die Spannung seiner Klage weder mildern noch theologisch erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte, körperlich anschauliche Sprache von Jobs Klage bleibt erhalten; »deinen Blick … abwenden« klingt natürlicher als das knappere »wegsehen« und macht das zugrunde liegende Bild deutlich.
