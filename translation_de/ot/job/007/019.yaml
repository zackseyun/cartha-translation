  source_fidelity: Der Entwurf gibt die zeitliche Klageeinleitung כַּמָּה treffend mit „Wie lange“ wieder. „deinen Blick nicht von mir abwenden“ entspricht תִשְׁעֶה מִמֶּנִּי im Kontext der Bitte, den auf Hiob gerichteten Blick abzuwenden. „mich nicht in Ruhe lassen“ vermittelt die Hifil-Form תַרְפֵּנִי idiomatisch und ohne zusätzliche Auslegung. Die Begrenzung mit „bis“ sowie das konkrete Bild „bis ich meinen Speichel geschluckt habe“ bewahren die Kürze ausdrückende hebräische Wendung.
  naturalness: Modernes Standarddeutsch, flüssig und der klagende, direkte Ton ist angemessen. Die Satzfügung mit der doppelten Verneinung ist klar und bildet den hebräischen Parallelismus gut ab. „Speichel“ ist sachlich, natürlich und wahrt die körperliche Anschaulichkeit.
  terminology: Die Anrede „du“ ist im Kontext von Hiobs Gottesrede passend. Es werden keine konfessionell lenkenden Begriffe oder nicht im Ausgangstext angelegten theologischen Deutungen eingeführt.
