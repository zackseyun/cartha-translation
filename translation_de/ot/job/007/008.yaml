  yaml_path: translation/ot/job/007/008.yaml
  text: The eye of the one who sees me will no longer behold me[a]; your eyes will be on me[b], but I will be gone.
translation:
  language: de
  text: Das Auge dessen, der mich sieht, wird mich nicht mehr erblicken[a]; deine Augen werden auf mich gerichtet sein, doch ich werde nicht mehr da sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Auge, das mich sieht, wird mich nicht sehen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Deine Augen sind auf mich, und ich bin nicht.“ Gemeint ist: Wenn Gott nach ihm Ausschau hält, ist er nicht mehr da.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְשׁוּרֵנִי
  choice: wird mich … erblicken
  rationale: Das Verb שׁור bezeichnet ein Hinschauen oder Erblicken. „Erblicken“ bewahrt den visuellen Schwerpunkt und den gehobenen, aber verständlichen Ton der Klage; der Imperfekt wird im Zusammenhang futurisch wiedergegeben.
- source_word: עֵין רֹאִי
  choice: das Auge dessen, der mich sieht
  rationale: Die Konstruktion bedeutet wörtlich etwa „das Auge meines Sehenden“. Die gewählte Formulierung erhält das konkrete hebräische Bild und bleibt im Deutschen verständlich.
- source_word: לֹא
  choice: nicht mehr
  rationale: Die Negation bezeichnet im Kontext Hiobs bevorstehendes Verschwinden aus dem Blickfeld. „Nicht mehr“ macht diesen zeitlichen Zusammenhang deutlich, ohne die Aussage unnötig auszudeuten.
- source_word: עֵינֶיךָ בִּי
  choice: deine Augen werden auf mich gerichtet sein
  rationale: Der Plural „deine Augen“ und die auf Hiob gerichtete Aufmerksamkeit bleiben erhalten. Das im Hebräischen verblos formulierte Verhältnis wird für natürliches Deutsch mit „gerichtet sein“ wiedergegeben.
- source_word: וְאֵינֶנִּי
  choice: doch ich werde nicht mehr da sein
  rationale: Wörtlich heißt die Wendung „und ich bin nicht“. Sie kann das Verschwundensein beziehungsweise den Tod ausdrücken; die futurische Wiedergabe passt zum Zusammenhang und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bezug von „deine Augen“
  choice: Direkte Anrede Gottes, ohne den Namen Gottes ergänzend einzufügen
  alternative: Allgemeine Anrede eines beliebigen Betrachters
  rationale: Im unmittelbaren Zusammenhang redet Hiob zu Gott. Die Übersetzung bewahrt die direkte Anrede, fügt aber kein im hebräischen Text nicht genanntes „Gott“ hinzu.
- issue: Bedeutung von וְאֵינֶנִּי
  choice: Hiobs Nicht-mehr-da-Sein wird ausgedrückt, ohne ausdrücklich „Tod“ einzusetzen
  alternative: Explizite Wiedergabe als „ich werde tot sein“
  rationale: Die hebräische Wendung kann auf Tod oder Verschwinden zielen, nennt den Tod aber nicht ausdrücklich. Die offenere Formulierung bewahrt die poetische und theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Augenmetaphorik. Die Zukunftsorientierung wird im Haupttext natürlich ausgedrückt; die knappe, verblos formulierte Gestalt des zweiten Halbverses bleibt in der Fußnote sichtbar.
