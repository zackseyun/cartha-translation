base_translation:
  language: en
  yaml_path: translation/ot/job/007/002.yaml
  text: Like a servant who longs for shade[a], and like a hired worker who waits for his wages[c][b],
translation:
  language: de
  text: Wie ein Sklave, der nach Schatten lechzt,[a] und wie ein Tagelöhner, der auf seinen Lohn wartet,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach Kühlung«. Wörtlich steht hier »Schatten«; gemeint ist die Erleichterung von der Hitze.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf seine Bezahlung« beziehungsweise »auf den Ertrag seiner Arbeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעֶבֶד
  choice: Wie ein Sklave
  rationale: עֶבֶד kann sowohl einen Diener als auch einen Sklaven bezeichnen. Im Bild von harter, fremdbestimmter Arbeit bringt »Sklave« die soziale Abhängigkeit und Belastung deutlicher zum Ausdruck.
- source_word: יִשְׁאַף
  choice: der sich … sehnt
  rationale: שׁאף bezeichnet hier ein starkes Verlangen. »Sich sehnen« gibt diese Intensität in natürlichem modernem Deutsch wieder, ohne die mögliche körperliche Nuance des Hechelns unnötig festzulegen.
- source_word: צֵל
  choice: Schatten
  rationale: צֵל bedeutet wörtlich »Schatten« und meint im Zusammenhang die ersehnte Kühlung und Erleichterung von der Hitze.
- source_word: וּכְשָׂכִיר
  choice: und wie ein Tagelöhner
  rationale: שָׂכִיר ist ein gegen Lohn angestellter Arbeiter. »Tagelöhner« passt zum antiken Arbeitszusammenhang und zur Erwartung der nach getaner Arbeit fälligen Bezahlung.
- source_word: יְקַוֶּה
  choice: der … wartet
  rationale: קוה kann »warten«, »hoffen« oder »erwarten« bedeuten. Bei ausstehendem Arbeitslohn ist »auf … warten« die natürliche deutsche Wiedergabe der erwartungsvollen Haltung.
- source_word: פָעֳלוֹ
  choice: seinen Lohn
  rationale: פֹּעַל kann Arbeit, Ertrag oder Vergütung bezeichnen. In Verbindung mit dem Tagelöhner ist die Bezahlung für die geleistete Arbeit gemeint.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen Vergleiche und das intensive Verlangen des erschöpften Arbeitenden bleiben erhalten. »Tagelöhner« macht den historischen Lohnarbeitskontext knapp und verständlich sichtbar.
