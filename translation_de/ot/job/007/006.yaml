source:
  edition: WLC
  text: יָמַ֣/י קַ֭לּוּ מִנִּי אָ֑רֶג וַ֝/יִּכְל֗וּ בְּ/אֶ֣פֶס תִּקְוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/006.yaml
  text: My days are swifter than a weaver’s shuttle[b][a]; they come to an end without hope.
translation:
  language: de
  text: Meine Tage eilen schneller dahin als ein Weberschiffchen[a]; sie gehen zu Ende, ohne Hoffnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Wort kann allgemeiner ein Webgerät oder möglicherweise den Webstuhl bezeichnen; „Weberschiffchen“ entspricht dem Bild rascher Bewegung.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Meine Tage
  rationale: Die konkrete Pluralform mit Suffix der 1. Person Singular wird beibehalten; Hiob spricht von der Kürze seiner verbleibenden Lebenszeit Tag für Tag.
- source_word: קַלּוּ
  choice: eilen schneller dahin
  rationale: Das Verb bezeichnet hier Schnelligkeit. Die verbale deutsche Wendung gibt die Bewegung und den durch מִן ausgedrückten Vergleich natürlich wieder.
- source_word: מִנִּי אָרֶג
  choice: als ein Weberschiffchen
  rationale: Das seltene Wort bezeichnet im Zusammenhang ein Webgerät. „Weberschiffchen“ passt am besten zum Bild einer raschen Hin-und-her-Bewegung, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: וַיִּכְלוּ
  choice: sie gehen zu Ende
  rationale: כלה bedeutet hier „aufgebraucht werden, zu Ende gehen“ und bezieht sich auf Hiobs Tage.
- source_word: בְּאֶפֶס תִּקְוָה
  choice: ohne Hoffnung
  rationale: אֶפֶס drückt das Fehlen aus, תִּקְוָה bedeutet „Hoffnung“; die knappe Wendung entspricht dem Hebräischen und klingt im Deutschen natürlich.
theological_decisions:
- issue: Reichweite der Hoffnungslosigkeit
  choice: ohne Hoffnung
  alternative: hoffnungslos
  rationale: Die Übersetzung lässt Hiobs Aussage in ihrer ungemilderten Klage stehen und deutet sie weder als dogmatische Verneinung jeder Hoffnung noch als bloß vorübergehendes Gefühl aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Eilen … dahin“ macht den Geschwindigkeitsvergleich idiomatisch; der zweite Halbvers bleibt bewusst knapp und schonungslos.
