  source_fidelity: „Meine Tage“ gibt יָמַי unmittelbar wieder. „eilen schneller dahin als ein Weberschiffchen“ bewahrt sowohl den Vergleich als auch das Bild rascher Bewegung in מִנִּי אָרֶג. „sie gehen zu Ende, ohne Hoffnung“ entspricht וַיִּכְלוּ בְּאֶפֶס תִּקְוָה und lässt die knappe, ungemilderte Klage bestehen.
