source:
  edition: WLC
  text: כָּלָ֣ה עָ֭נָן וַ/יֵּלַ֑ךְ כֵּ֥ן יוֹרֵ֥ד שְׁ֝א֗וֹל לֹ֣א יַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/009.yaml
  text: As a cloud fades away and vanishes[a], so the one who goes down to Sheol does not come up.
translation:
  language: de
  text: Wie eine Wolke sich auflöst und verschwindet, so kommt der, der in die Scheol[a] hinabsteigt, nicht herauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Grab“ oder „Bereich der Toten“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: sich auflöst
  rationale: Das Verb bezeichnet das Zu-Ende-Gehen oder Schwinden. Bei einer Wolke gibt „sich auflöst“ das Bild im Deutschen natürlich wieder.
- source_word: עָנָן
  choice: Wolke
  rationale: Die gewöhnliche Bedeutung bewahrt das anschauliche Vergleichsbild.
- source_word: וַיֵּלַךְ
  choice: und verschwindet
  rationale: Wörtlich steht „und geht“. Zusammen mit כָּלָה und dem Subjekt „Wolke“ bezeichnet es ihr Verschwinden; die Wiedergabe ist idiomatisch, ohne das Bild zu verändern.
- source_word: כֵּן
  choice: so
  rationale: Leitet knapp und natürlich die Entsprechung zwischen dem Wolkenbild und dem menschlichen Tod ein.
- source_word: יוֹרֵד
  choice: wer … hinabsteigt
  rationale: Das substantivisch gebrauchte Partizip bezeichnet allgemein denjenigen, der hinabsteigt. Die Relativkonstruktion klingt im Deutschen natürlich und erhält die Abwärtsbewegung.
- source_word: שְׁאוֹל
  choice: Totenreich
  rationale: „Totenreich“ hält den Bezug auf den Bereich der Toten offen und ist modernen deutschen Lesern unmittelbar verständlich. Es verengt den Ausdruck nicht ausschließlich auf das einzelne Grab und vermeidet zugleich eine lehrmäßig überladene Wiedergabe wie „Hölle“.
- source_word: לֹא יַעֲלֶה
  choice: kommt nicht wieder herauf
  rationale: Das Imperfekt formuliert hier die allgemeine Aussage des Vergleichs. „Heraufkommen“ bewahrt den vertikalen Gegensatz zum Hinabsteigen; „wieder“ macht im Deutschen die gemeinte Rückkehr idiomatisch deutlich.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Totenreich
  alternative: Scheol; Grab
  rationale: Der hebräische Ausdruck kann den Bereich der Toten bezeichnen und ist nicht ohne Weiteres mit „Hölle“ gleichzusetzen. „Totenreich“ bewahrt die konzeptionelle Offenheit zwischen Unterwelt, Todesbereich und Grabnähe. Der Vers beschreibt aus Hiobs Perspektive die Endgültigkeit des Todes, ohne damit alle Aussagen über eine mögliche Auferstehung systematisch zu entscheiden.
- issue: Aussage von לֹא יַעֲלֶה
  choice: als allgemeine Aussage im Vergleich wiedergegeben
  alternative: 'futurisch: „wird nicht heraufkommen“'
  rationale: Die präsentische Formulierung passt zur allgemeinen Beobachtung des Wolkenvergleichs. Sie wahrt die Spannung des Verses und macht daraus weder ausdrücklich eine absolute dogmatische Leugnung der Auferstehung noch eine bloß vorläufige Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung stellt wie im Hebräischen zunächst das Wolkenbild voran. „Hinabsteigt“ und „herauf“ erhalten die räumliche Gegenüberstellung; „Totenreich“ bleibt verständlich und theologisch zurückhaltend.
