  text: לֹא יָשׁ֣וּב ע֣וֹד לְ/בֵית֑/וֹ וְ/לֹא יַכִּירֶ֖/נּוּ ע֣וֹד מְקֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/010.yaml
  text: He does not return again to his house[a], and his place does not know him anymore.
translation:
  language: de
  text: Er kehrt nicht mehr in sein Haus zurück, und seine Stätte kennt ihn nicht mehr[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erkennt ihn nicht mehr“. Das hebräische Verb kann auch „wiedererkennen“ oder „anerkennen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: kehrt … zurück
  rationale: שׁוב bedeutet gewöhnlich „zurückkehren“. Die deutsche Verbklammer gibt die Bewegung natürlich und genau wieder.
- source_word: עוֹד (erstes Vorkommen)
  choice: nicht mehr
  rationale: Mit der Verneinung bezeichnet עוֹד das endgültige Ausbleiben einer weiteren Rückkehr; „nicht mehr“ ist im Deutschen idiomatischer als „nicht wieder zurück“.
- source_word: לְבֵיתוֹ
  choice: in sein Haus
  rationale: בַּיִת bezeichnet wörtlich das Haus. Bei „zurückkehren“ ist im Deutschen die Richtungsangabe „in sein Haus“ natürlich und bewahrt das konkrete Bild.
- source_word: יַכִּירֶנּוּ
  choice: erkennt ihn
  rationale: Die Hifil-Form von נכר kann „erkennen, wiedererkennen“ oder „anerkennen“ bedeuten. „Erkennt ihn“ wahrt die poetische Personifikation des Ortes und die lexikalische Offenheit besser als das im Deutschen weniger natürliche „kennt ihn“.
- source_word: עוֹד (zweites Vorkommen)
  choice: nicht mehr
  rationale: In Verbindung mit לֹא drückt עוֹד das dauerhafte Ende des Erkennens aus; „nicht mehr“ ist präzise und idiomatisch.
- source_word: מְקֹמוֹ
  choice: sein Ort
  rationale: מָקוֹם bedeutet „Ort, Platz“. „Sein Ort“ bleibt knapp, bewahrt die Personifikation und legt den Ausdruck nicht vorschnell auf Wohnort oder gesellschaftliche Stellung fest.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrtem poetischem Parallelismus. Die zweimalige Wendung „nicht mehr“ spiegelt die Wiederholung von עוֹד in beiden Vershälften; die Personifikation „sein Ort erkennt ihn“ bleibt erhalten.
