  text: that you attend to him every morning[b][a], and test him every moment?
translation:
  language: de
  text: dass du ihn jeden Morgen beachtest[a] und ihn jeden Augenblick prüfst?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn jeden Morgen aufsuchst“ oder „nach ihm siehst“. Das hebräische Verb kann „aufsuchen“, „beachten“ oder „sich einer Person annehmen“ bedeuten; hier bleibt die Art dieser Zuwendung offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihn jeden Augenblick untersuchst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדֶנּוּ
  choice: dass du nach ihm siehst
  rationale: פקד bezeichnet hier Gottes wiederholte, aktive Zuwendung oder Beachtung. „Nach ihm sehen“ wahrt die mögliche Spannweite zwischen Aufsuchen, Beachten und prüfender Aufmerksamkeit, ohne die Handlung einseitig als fürsorglich darzustellen.
- source_word: לִבְקָרִים
  choice: jeden Morgen
  rationale: Der Plural mit ל bezeichnet regelmäßig wiederkehrende Zeitpunkte; „jeden Morgen“ gibt dies im modernen Deutschen natürlich wieder.
- source_word: לִרְגָעִים
  choice: jeden Augenblick
  rationale: רגעים bezeichnet kurze Zeitabschnitte; die Formulierung bewahrt den Eindruck unablässiger Wiederholung.
- source_word: תִּבְחָנֶנּוּ
  choice: ihn prüfst
  rationale: בחן bedeutet prüfen oder untersuchen, besonders durch genaue Beobachtung. „Prüfen“ passt zum belastenden Ton von Hiobs Klage.
- source_word: ־נּוּ
  choice: ihm / ihn
  rationale: Das maskuline Singularsuffix verweist auf den Menschen aus dem vorangehenden Vers; die Pronomen erhalten diesen Bezug.
theological_decisions:
- issue: Ton der göttlichen Aufmerksamkeit
  choice: Gottes Handeln als fortwährende, in Hiobs Klage belastende Aufmerksamkeit wiedergeben
  alternative: Die Wendung ausschließlich als fürsorglichen Besuch oder wohlwollende Zuwendung formulieren
  rationale: Der unmittelbare Kontext ist eine rhetorische Klage über unablässige göttliche Beobachtung. Die Übersetzung bewahrt diese Spannung, ohne Gottes Absicht über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage wird als Fortsetzung von Vers 17 formuliert. „Nach ihm sehen“ lässt die lexikalische Mehrdeutigkeit von פקד hörbar, während „prüfst“ den bedrängenden Kontext klar ausdrückt.
