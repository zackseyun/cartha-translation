base_translation:
  language: en
  yaml_path: translation/ot/job/007/004.yaml
  text: When I lie down[a], I say, ‘When will I arise?’ But the evening drags on[c][b], and I am full of tossing until dawn.
translation:
  language: de
  text: 'Wenn ich mich hinlege, sage ich: »Wann werde ich aufstehen?« Doch der Abend zieht sich hin[a], und bis zur Morgendämmerung bin ich des Umherwälzens satt[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich möglicherweise: »und der Abend wird abgemessen«. Gemeint ist wohl, dass sich der Abend beziehungsweise die Nacht quälend in die Länge zieht.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann rastlose Bewegungen, ein Umherwandern oder ein Umherwälzen bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann »Dämmerung« sowohl am Abend als auch am Morgen bezeichnen. Im Zusammenhang ist wahrscheinlich die Morgendämmerung gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: אִם kann konditional »wenn/falls« bedeuten, leitet hier aber am ehesten eine wiederkehrende Situation ein. Das deutsche »wenn« bewahrt zugleich die mögliche konditionale Nuance.
- source_word: שָׁכַבְתִּי וְאָמַרְתִּי
  choice: ich mich hinlege, sage ich
  rationale: Die Perfektformen beschreiben im Zusammenhang Hiobs regelmäßig wiederkehrendes nächtliches Erleben; das deutsche Präsens gibt diesen iterativen Sinn natürlich wieder.
- source_word: מָתַי אָקוּם
  choice: Wann kann ich wieder aufstehen?
  rationale: קום bezeichnet hier das Aufstehen vom Lager. »wieder« verdeutlicht idiomatisch die ersehnte Beendigung der Nacht, ohne eine weitergehende theologische Bedeutung einzutragen.
- source_word: וּמִדַּד עָרֶב
  choice: Doch der Abend zieht sich hin
  rationale: מדד bedeutet wörtlich »messen/abmessen«; die schwierige Formulierung vermittelt im Kontext wahrscheinlich, dass sich die Abend- beziehungsweise Nachtzeit quälend in die Länge zieht.
- source_word: וְשָׂבַעְתִּי
  choice: bin ich … satt
  rationale: שׂבע bedeutet »satt sein/werden«. Die deutsche Wendung bewahrt das konkrete Bild und drückt zugleich Überdruss aus.
- source_word: נְדֻדִים
  choice: des ruhelosen Umherwälzens
  rationale: Das Substantiv bezeichnet rastlose Bewegungen oder ein Umherwandern. Im Zusammenhang des Liegens gibt »Umherwälzen« die körperliche Schlaflosigkeit anschaulich wieder; »ruhelos« erschließt den Sinn.
- source_word: עֲדֵי נָשֶׁף
  choice: bis zur Morgendämmerung
  rationale: נֶשֶׁף kann Abend- oder Morgendämmerung bezeichnen. Als Endpunkt der durchwachten Nacht ist hier die Morgendämmerung gemeint.
