  yaml_path: translation/ot/job/007/021.yaml
  text: Why do you not pardon my transgression and take away my iniquity? For now I will lie down in the dust[a]; you will seek me diligently[b], but I will be gone.
translation:
  language: de
  text: Warum vergibst du mir meine Übertretung nicht und nimmst meine Schuld nicht weg?[a] Denn jetzt werde ich mich in den Staub legen. Du wirst eifrig nach mir suchen,[b] aber ich werde nicht mehr da sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Warum trägst du meine Übertretung nicht und lässt meine Schuld nicht vorübergehen?“ Die beiden hebräischen Verben bedeuten grundsätzlich „heben/tragen“ und „vorübergehen lassen“; hier bezeichnen sie Vergebung und das Wegnehmen von Schuld.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Du wirst früh nach mir suchen.“ Das hebräische Verb kann an frühes, besonders morgendliches Suchen denken lassen, bezeichnet aber häufig ernsthaftes oder eifriges Suchen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: vergibst
  rationale: נשׂא bedeutet wörtlich „heben/tragen“, bezeichnet mit einer Verfehlung als Objekt aber idiomatisch das Wegnehmen beziehungsweise Vergeben von Schuld. „Vergibst“ ist im modernen Deutschen klar und natürlich.
- source_word: פִשְׁעִי
  choice: meine Übertretung
  rationale: פשע bezeichnet eine Übertretung oder Auflehnung, häufig einen bewussten Bruch. „Übertretung“ bewahrt das Gewicht des Ausdrucks und unterscheidet ihn vom folgenden עון.
- source_word: וְתַעֲבִיר
  choice: und nimmst … nicht weg
  rationale: Der Hifil von עבר kann „vorübergehen lassen“ oder „beseitigen“ bedeuten. In Verbindung mit עון liegt das Wegnehmen der Schuld nahe; die Formulierung ist zugleich idiomatisches modernes Deutsch.
- source_word: עֲוֺנִי
  choice: meine Schuld
  rationale: עון kann Vergehen, Schuld oder die Folge eines Vergehens bezeichnen. „Schuld“ passt zum Gedanken des Wegnehmens und erhält neben „Übertretung“ einen eigenständigen Akzent.
- source_word: כִּי עַתָּה
  choice: Denn nun
  rationale: Die Wendung begründet die Bitte mit Jobs unmittelbar bevorstehendem Tod. „Denn nun“ wahrt sowohl den begründenden als auch den zeitlichen Zusammenhang.
- source_word: לֶעָפָר אֶשְׁכָּב
  choice: werde ich mich in den Staub legen
  rationale: Die konkrete Metapher des Liegens im Staub verweist auf Tod und Begräbnis, ohne das Bild interpretierend durch „sterben“ zu ersetzen.
- source_word: וְשִׁחֲרְתַּנִי
  choice: Du wirst mich eindringlich suchen
  rationale: שׁחר kann im Piel eifrig oder ernsthaft suchen bedeuten und trägt möglicherweise den Nebensinn frühen Suchens. „Eindringlich suchen“ gibt hier die Intensität natürlich wieder.
- source_word: וְאֵינֶנִּי
  choice: aber ich werde nicht mehr da sein
  rationale: Wörtlich steht „und ich bin nicht“. Im Zukunftszusammenhang bezeichnet die Wendung Jobs Nicht-mehr-Dasein; „aber“ verdeutlicht den im Satz liegenden Gegensatz, ohne ihn theologisch auszudeuten.
theological_decisions:
- issue: Unterscheidung der beiden Begriffe für Verfehlung
  choice: פשע als „Übertretung“ und עון als „Schuld“ wiedergeben
  alternative: Beide Begriffe mit „Sünde“ wiedergeben
  rationale: Die verschiedenen hebräischen Wörter und ihr poetischer Parallelismus sollen nicht eingeebnet werden. Zugleich bleibt bei עון die Spannung zwischen Tat und daraus erwachsender Schuld erhalten.
- issue: Todesbild in לֶעָפָר אֶשְׁכָּב
  choice: Das konkrete Bild „mich in den Staub legen“ beibehalten
  alternative: Interpretierend mit „sterben“ übersetzen
  rationale: Der Ausgangstext spricht bildhaft von Sterblichkeit und Begräbnis. Die Bildsprache bewahrt die poetische und theologische Spannung.
- issue: Zeitpunkt und Art des göttlichen Suchens
  choice: שׁחר als intensives Suchen wiedergeben und den möglichen Morgenbezug in einer Fußnote nennen
  alternative: „Du wirst mich früh suchen“
  rationale: Im Kontext steht wahrscheinlich die Ernsthaftigkeit des Suchens im Vordergrund. Der lexikalisch mögliche Bezug auf frühes Suchen bleibt ausdrücklich dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. Die Satzstruktur bleibt nahe am hebräischen Parallelismus, ohne unnatürlich wörtlich zu klingen.
