  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wind“. Das hebräische Wort kann „Hauch“, „Wind“ oder „Geist“ bedeuten; hier bringt es die Flüchtigkeit des Lebens zum Ausdruck.'
