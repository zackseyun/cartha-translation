lexical_decisions:
- source_word: זְכֹר
  choice: Denk daran
  rationale: Der Qal-Imperativ 2. Person Maskulin Singular richtet sich im Kontext an Gott. „Denk daran“ ist im modernen Deutsch eine natürliche, direkte Bitte.
- source_word: כִּי
  choice: Doppelpunkt nach „Denk daran“
  rationale: כִּי leitet hier den Inhalt dessen ein, woran Gott denken soll. Im Deutschen gibt ein Doppelpunkt diese Beziehung natürlicher wieder als ein ausdrückliches „dass“.
- source_word: רוּחַ
  choice: Hauch
  rationale: רוּחַ kann „Hauch“, „Wind“ oder „Geist“ bedeuten. Im Klagezusammenhang bezeichnet „Hauch“ treffend die Flüchtigkeit und Vergänglichkeit des Lebens.
- source_word: חַיָּי
  choice: mein Leben
  rationale: Die Form bezeichnet das Leben des Sprechers; „mein Leben“ ist die klare und natürliche deutsche Entsprechung.
- source_word: לֹא תָשׁוּב
  choice: wird nicht wieder
  rationale: Das Verb שׁוב bedeutet grundsätzlich „zurückkehren“ oder „wiederkehren“. In Verbindung mit „sehen“ gibt „nicht wieder“ die idiomatische Bedeutung wieder, ohne die Aussage unnötig zu verkomplizieren.
- source_word: עֵינִי
  choice: mein Auge
  rationale: Der hebräische Text hat den Singular. Dieser wird als poetische Redeweise bewahrt.
- source_word: לִרְאוֹת
  choice: sehen
  rationale: „Sehen“ entspricht dem Grundsinn von ראה und kann hier zugleich das Erleben bezeichnen.
- source_word: טוֹב
  choice: Gutes
  rationale: טוֹב umfasst Gutes, Wohlergehen und Glück. „Gutes“ bewahrt diese Bedeutungsbreite.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Singular „mein Auge“ und die breite Bedeutung von „Gutes“ bleiben erhalten. „Nur“ verdeutlicht die prädikative Metapher und ihre Vergänglichkeitsaussage, ohne eine konfessionelle Deutung einzutragen.
