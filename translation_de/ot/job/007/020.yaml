id: JOB.7.20
reference: Job 7:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חָטָ֡אתִי מָ֤ה אֶפְעַ֨ל לָ/ךְ֮ נֹצֵ֪ר הָ/אָ֫דָ֥ם לָ֤/מָה שַׂמְתַּ֣/נִי לְ/מִפְגָּ֣ע לָ֑/ךְ וָ/אֶהְיֶ֖ה עָלַ֣/י לְ/מַשָּֽׂא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/020.yaml
  text: If I have sinned[a], what can I do to you, watcher of mankind? Why have you made me your target[c][b], so that I have become a burden to myself?
translation:
  language: de
  text: Wenn ich gesündigt habe, was kann ich dir antun, du Wächter der Menschen? Warum hast du mich zu deiner Zielscheibe gemacht,[a] sodass ich mir selbst zur Last geworden bin?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Warum hast du mich für dich zum Angriffsziel gemacht?«'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text lautet »mir selbst zur Last«; einige alte Übersetzungen geben sinngemäß »dir zur Last« wieder.
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָאתִי
  choice: Wenn ich gesündigt habe
  rationale: 'Die Form ist ein Perfekt der 1. Person Singular: wörtlich »Ich habe gesündigt«. Im argumentativen Zusammenhang hat die Aussage jedoch einen einräumenden Sinn; »Wenn ich gesündigt habe« gibt diesen wieder, ohne Hiob ein uneingeschränktes Schuldbekenntnis zuzuschreiben.'
- source_word: מָה אֶפְעַל לָךְ
  choice: was kann ich dir antun
  rationale: Das Imperfekt fragt rhetorisch danach, was Hiob gegenüber Gott überhaupt bewirken könnte. »Kann« drückt diese Ohnmacht aus; »dir antun« ist im Deutschen natürlich und bewahrt die auf Gott gerichtete Handlung.
- source_word: נֹצֵר הָאָדָם
  choice: du Wächter der Menschen
  rationale: נֹצֵר kann schützendes Bewahren wie auch prüfendes Beobachten bezeichnen. »Wächter« lässt diese im Klagezusammenhang wichtige Spannung bestehen. Der generische Singular הָאָדָם wird im Deutschen natürlich kollektiv mit »der Menschen« wiedergegeben.
- source_word: לָמָה שַׂמְתַּנִי לְמִפְגָּע לָךְ
  choice: Warum hast du mich zu deiner Zielscheibe gemacht
  rationale: מִפְגָּע bezeichnet hier ein Ziel beziehungsweise einen Gegenstand des Angriffs. »Zielscheibe« vermittelt Hiobs Klage anschaulich und gibt לָךְ idiomatisch durch das Possessivpronomen wieder.
- source_word: וָאֶהְיֶה עָלַי לְמַשָּׂא
  choice: sodass ich mir selbst zur Last geworden bin
  rationale: Der masoretische Text עָלַי weist am natürlichsten auf Hiob selbst zurück. Die konsekutive Verbindung »sodass« macht den gedanklichen Zusammenhang mit Gottes Handeln deutlich, ohne die abweichende alte Lesart in den Haupttext aufzunehmen.
theological_decisions:
- issue: Einräumung oder ausdrückliches Sündenbekenntnis
  choice: Wenn ich gesündigt habe
  alternative: Ich habe gesündigt
  rationale: Die hebräische Verbform ist formal eine Feststellung, doch die anschließende rhetorische Frage legt im Kontext eine Einräumung nahe. Die Übersetzung wahrt Hiobs Argument, ohne die Spannung seiner Unschuldsbeteuerungen vorschnell aufzulösen.
- issue: Bezug der Last am Versende
  choice: mir selbst zur Last
  alternative: dir zur Last
  rationale: Der masoretische Text liest עָלַי (»auf mir/mir selbst«). Einige alte Übersetzungen spiegeln offenbar eine Lesart mit Bezug auf Gott; sie wird deshalb in einer Fußnote dokumentiert, aber nicht an die Stelle des überlieferten hebräischen Haupttextes gesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, klagender Anrede. »Wächter« bewahrt die Doppeldeutigkeit zwischen Fürsorge und bedrängender Beobachtung; »Zielscheibe« ist bewusst anschaulich und allgemein verständlich.
