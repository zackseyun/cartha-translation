  yaml_path: translation/ot/job/007/012.yaml
  text: Am I the sea[a], or a sea monster[b], that you set a guard over me?
translation:
  language: de
  text: Bin ich etwa das Meer oder ein Seeungeheuer[a], dass du mich unter Bewachung stellst[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Drache“ oder „Schlange“. Das hebräische Wort bezeichnet ein großes bedrohliches Wesen und erscheint häufig in Bildern vom Meer und vom Chaos.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: „dass du eine Wache über mich stellst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָם
  choice: Bin ich etwa das Meer
  rationale: Die Fragepartikel הֲ leitet eine rhetorische Frage ein. „Das Meer“ bewahrt das poetische Bild; „etwa“ macht den rhetorischen Ton im heutigen Deutsch natürlich hörbar.
- source_word: אִם
  choice: oder
  rationale: אִם verbindet hier die beiden Möglichkeiten einer rhetorischen Doppelfrage disjunktiv.
- source_word: תַּנִּין
  choice: Seeungeheuer
  rationale: תַּנִּין kann ein großes bedrohliches Wasserwesen, einen Drachen oder eine Schlange bezeichnen. Im Parallelismus mit „Meer“ gibt „Seeungeheuer“ das Bild klar wieder, ohne es mythologisch weiter auszudeuten.
- source_word: כִּי
  choice: dass
  rationale: כִּי führt hier den Folgesatz ein, der erklärt, weshalb Job sich mit Meer und Seeungeheuer vergleicht.
- source_word: תָשִׂים
  choice: du ... lässt
  rationale: Das Qal-Imperfekt von שׂים bedeutet „setzen, stellen, anbringen“. Zusammen mit מִשְׁמָר wird die Wendung im Deutschen idiomatisch mit „bewachen lässt“ wiedergegeben.
- source_word: עָלַי מִשְׁמָר
  choice: mich bewachen lässt
  rationale: Die Wortgruppe bezeichnet eine über Job verhängte Bewachung oder Aufsicht. Die Formulierung ist natürliches modernes Deutsch und bewahrt den Gedanken auferlegter Überwachung.
theological_decisions:
- issue: Poetische Chaosbildsprache von תַּנִּין
  choice: Seeungeheuer, ohne weitergehende Mythologisierung
  alternative: Drache oder Schlange
  rationale: Job klagt, dass Gott ihn wie eine kosmische Bedrohung behandelt, die unter Kontrolle gehalten werden müsse. Die Übersetzung wahrt diese Spannung, ohne ein nicht ausdrücklich genanntes mythologisches System einzutragen.
translation_notes:
  register: Moderne, würdevolle poetische Sprache. „Etwa“ kennzeichnet die rhetorische Frage; „bewachen lässt“ ist idiomatisch, während die Fußnote die konkrete hebräische Wendung mit einer über Job gestellten Wache erhält.
