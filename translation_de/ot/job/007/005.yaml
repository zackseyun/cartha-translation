  text: My flesh is clothed with worms and clods of dust; my skin hardens[a], then breaks out again.
translation:
  language: de
  text: Mein Fleisch ist mit Würmern und Erdklumpen bedeckt; meine Haut schließt sich[a] und bricht wieder auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Meine Haut verhärtet sich und eitert wieder.“ Die beiden letzten hebräischen Verben sind schwer zu deuten. Sie können beschreiben, wie sich die Haut kurzzeitig schließt und dann erneut aufbricht; möglich ist auch ein Sinn wie: „Meine Haut reißt auf und wird widerwärtig.“'
    reason: alternative_reading
lexical_decisions:
- source_word: לָבַשׁ
  choice: ist … bedeckt
  rationale: Das Verb bedeutet wörtlich „sich kleiden/anziehen“. Im Deutschen gibt „ist mit … bedeckt“ das Bild natürlich wieder; „ist bekleidet“ klänge hier unnötig steif.
- source_word: בְּשָׂרִי
  choice: mein Fleisch
  rationale: Die direkte Entsprechung bewahrt die konkrete körperliche Aussage des Hebräischen.
- source_word: רִמָּה
  choice: Würmer
  rationale: Das Wort bezeichnet Würmer oder Maden im Zusammenhang mit Verwesung. „Würmer“ bleibt breit genug und vermeidet eine unnötige Präzisierung.
- source_word: גיש עפר
  choice: Erdkrusten
  rationale: Die seltene Verbindung bezeichnet wahrscheinlich Klumpen oder Krusten von Staub beziehungsweise Erde. „Erdkrusten“ passt zum Bild von Schmutz, der auf der erkrankten Haut festgebacken ist.
- source_word: עוֹרִי
  choice: meine Haut
  rationale: Dies ist die gewöhnliche und kontextgemäße Bedeutung.
- source_word: רָגַע
  choice: schließt sich
  rationale: Das schwierige Verb wird im Zusammenhang mit der folgenden erneuten Öffnung als vorübergehendes Zusammenziehen oder Schließen der Haut verstanden.
- source_word: וַיִּמָּאֵס
  choice: bricht wieder auf
  rationale: Obwohl die Form sonst mit Verwerfen oder Abscheu verbunden werden kann, legt der körperliche Zusammenhang hier eine erneut aufbrechende oder eiternde Haut nahe. Die Wiedergabe wahrt den wahrscheinlichen Krankheitsverlauf.
theological_decisions:
- issue: Bedeutung der beiden letzten Verben
  choice: Die Haut schließt sich und bricht wieder auf.
  alternative: 'Die Haut verhärtet sich und eitert wieder; oder: Meine Haut ist unruhig und widerlich.'
  rationale: Der hebräische Wortlaut ist schwierig. Die gewählte Fassung folgt der wahrscheinlichen Darstellung eines wiederkehrenden Wundverlaufs, kennzeichnet die Unsicherheit aber durch eine Fußnote, statt sie als eindeutig auszugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Körperlichkeit und das Bild der Bedeckung bleiben erhalten; die schwierige Schlusszeile wird flüssig formuliert, ohne ihre textliche Unsicherheit zu verschweigen.
