translation:
  language: de
  text: Sodass meine Seele das Erdrosseltwerden wählt,[a] den Tod statt meiner Gebeine.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Ersticken“ oder „das Erwürgtwerden“; auch „mein Leben“ statt „meine Seele“ ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Tod von meinen Gebeinen“. Die Präposition wird hier wahrscheinlich vergleichend verstanden: Tod statt des Weiterlebens in seinem leidenden Körper.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְחַר
  choice: Da würde … lieber … wählen
  rationale: Die Form bezeichnet das Wählen; im Zusammenhang mit Hiobs vorausgehendem Wunsch und der folgenden Vergleichskonstruktion gibt der deutsche Konjunktiv mit „lieber“ den poetischen Sinn natürlich wieder, ohne die Handlung als bereits vollzogen darzustellen.
- source_word: מַחֲנָק
  choice: Erdrosselung
  rationale: Das Substantiv bezeichnet Erdrosseln, Würgen oder Ersticken. „Erdrosselung“ bewahrt das konkrete, drastische Bild.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נֶפֶשׁ kann Seele, Leben, Selbst oder Person bezeichnen. „Meine Seele“ erhält hier die hebräische Ausdrucksweise und ihre poetische Intensität; „mein Leben“ oder schlicht „ich“ sind ebenfalls möglich.
- source_word: מָוֶת
  choice: den Tod
  rationale: Die übliche und unmittelbare Wiedergabe von מָוֶת.
- source_word: מֵעַצְמוֹתָי
  choice: statt meiner Gebeine
  rationale: 'Wörtlich steht „von meinen Gebeinen“. Nach „Tod“ ist die Präposition wahrscheinlich vergleichend zu verstehen: Tod statt des Weiterlebens in seinem leidenden Körper. „Gebeine“ wahrt das konkrete Bild des Hebräischen.'
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener poetischer Härte. „Gebeine“ ist leicht gehoben, aber allgemein verständlich und bildet das konkrete hebräische Bild genauer ab als „Körper“.
