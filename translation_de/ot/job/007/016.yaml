  rationale: 'Die Revision beseitigt die im Deutschen unklare anaphorische Verwendung von „es“, ohne die hebräische Auslassung zu verschweigen: „mein Leben“ wird kontextgemäß im Haupttext ergänzt und in der Anmerkung als nicht ausdrücklich genannt ausgewiesen. „Lass von mir ab“ ist idiomatischer; der Verzicht auf „nur“ vermeidet eine unnötige Verstärkung.'
