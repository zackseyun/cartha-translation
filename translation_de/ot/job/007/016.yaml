  source_fidelity: 'Der Entwurf gibt die Satzfolge und den Sinn des Hebräischen insgesamt treffend wieder: die starke Ablehnung, die begrenzte Lebenszeit, die Aufforderung zum Ablassen und die Vergänglichkeit der Tage. Bei מָאַסְתִּי bleibt das Objekt im Hebräischen jedoch unausgedrückt; „es“ bildet diese Auslassung zwar formal nach, ist im Deutschen ohne klaren Bezug aber nicht idiomatisch. Der Kontext legt „mein Leben“ nahe, sollte aber durch eine Anmerkung als Ergänzung kenntlich bleiben. „nur“ in „nur ein Hauch“ verstärkt die Aussage leicht über den Wortlaut hinaus und ist entbehrlich.'
  naturalness: „Lass ab von mir“ ist verständlich, aber „Lass von mir ab“ ist die im heutigen Standarddeutsch deutlich geläufigere Wortstellung für die Aufforderung, jemanden in Ruhe zu lassen. „Ich verabscheue es“ klingt ohne vorhergehendes Bezugswort unnatürlich und unklar.
  terminology: „verabscheuen“, „ewig leben“, „denn“ und „ein Hauch“ sind angemessene, würdige und moderne Wiedergaben. „Hauch“ bewahrt die konkrete wie auch die übertragene Dimension von הֶבֶל, ohne die stärker abstrahierende Deutung „Nichtigkeit“ festzulegen.
