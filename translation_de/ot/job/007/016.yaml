  text: מָ֭אַסְתִּי לֹא לְ/עֹלָ֣ם אֶֽחְיֶ֑ה חֲדַ֥ל מִ֝מֶּ֗/נִּי כִּי הֶ֥בֶל יָמָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/016.yaml
  text: I despise my life[a]; I will not live forever. Leave me alone[b], for my days are a breath.
translation:
  language: de
  text: Ich verabscheue mein Leben[a]; ich werde nicht ewig leben. Lass von mir ab, denn meine Tage sind ein Hauch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich verabscheue es“ oder „Ich lehne es ab“. Im Hebräischen bleibt das Objekt unausgesprochen; der Zusammenhang legt „mein Leben“ nahe.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Atem“ oder „Dunst“ bedeuten und betont die Kürze und Flüchtigkeit des Lebens.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָאַסְתִּי
  choice: Ich verabscheue es
  rationale: Das Verb מאס bezeichnet starkes Ablehnen, Verschmähen oder Verabscheuen. Da das Hebräische kein Objekt nennt, wahrt „es“ diese Offenheit besser als die ausdrückliche Ergänzung „mein Leben“.
- source_word: לֹא לְעֹלָם אֶחְיֶה
  choice: ich werde nicht ewig leben
  rationale: Die Wiedergabe entspricht der Verneinung, לְעוֹלָם („ewig, für immer“) und der Verbform „ich werde leben“, ohne daraus ausdrücklich einen Wunsch zu machen.
- source_word: חֲדַל מִמֶּנִּי
  choice: Lass ab von mir
  rationale: Der Imperativ von חדל fordert zum Aufhören oder Ablassen auf; zusammen mit מִמֶּנִּי gibt „Lass ab von mir“ die Formulierung knapp, verständlich und würdevoll wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für Hiobs Bitte ein.
- source_word: הֶבֶל
  choice: nur ein Hauch
  rationale: הֶבֶל kann Atem, Hauch oder Dunst und daraus folgend Vergänglichkeit und Nichtigkeit bezeichnen. „Nur ein Hauch“ hebt die Kürze und Flüchtigkeit des Lebens hervor.
- source_word: יָמָי
  choice: meine Tage
  rationale: Die wörtliche und natürliche Wiedergabe bezeichnet Hiobs begrenzte Lebenszeit.
theological_decisions:
- issue: Nicht genanntes Objekt von מָאַסְתִּי
  choice: Das Objekt bleibt durch „es“ unbestimmt.
  alternative: „Ich verabscheue mein Leben“
  rationale: Im Hebräischen fehlt ein ausdrückliches Objekt. Der Zusammenhang legt zwar Hiobs Leben nahe, doch sollte diese Deutung nicht ohne Kennzeichnung in den Haupttext eingetragen werden.
- issue: Aussage über die begrenzte Lebenszeit
  choice: „ich werde nicht ewig leben“ als Feststellung
  alternative: „ich möchte nicht ewig leben“ als Wunsch
  rationale: Die hebräische Form kann eine schlichte Aussage über die Zukunft beziehungsweise die Sterblichkeit ausdrücken; eine ausdrücklich voluntative Deutung wäre stärker festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lass ab von mir“ bewahrt den knappen Imperativ und klingt gehoben, ohne veraltet zu sein. Die Satzstruktur folgt der gedrängten Form der hebräischen Klage.
