base_translation:
  language: en
  yaml_path: translation/ot/job/019/017.yaml
  text: My breath is repulsive to my wife[b][a], and I am loathsome to the sons of my own body.
translation:
  language: de
  text: Mein Atem ist meiner Frau widerlich, und den Söhnen meines eigenen Leibes[b] bin ich abscheulich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der schwierige hebräische Ausdruck kann auch verstanden werden: »und mein Flehen gilt den Söhnen meines Leibes« oder: »Ich flehe die Söhne meines Leibes um Gunst an.«'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »den Söhnen meines Leibes«. Gemeint sein können Hiobs eigene Kinder oder allgemeiner seine nahen Blutsverwandten.'
    reason: cultural_note
lexical_decisions:
- source_word: רוּחִי
  choice: mein Atem
  rationale: רוּחַ kann »Atem«, »Wind« oder »Geist« bedeuten. Im Zusammenhang mit Hiobs körperlichem Leiden und der Abscheu seiner Frau ist »Atem« die naheliegende konkrete Bedeutung.
- source_word: זָרָה
  choice: ist … widerlich
  rationale: Die Form bezeichnet wörtlich etwas Fremdes oder Befremdliches und kann hier die dadurch hervorgerufene Abstoßung ausdrücken. »Widerlich« gibt die soziale und körperliche Abscheu in natürlichem Deutsch wieder.
- source_word: לְאִשְׁתִּי
  choice: meiner Frau
  rationale: Das ל kennzeichnet die betroffene Person; der deutsche Dativ ist bei »widerlich sein« idiomatisch.
- source_word: וְחַנֹּתִי
  choice: bin ich zum Ekel geworden
  rationale: Die schwierige Form wird im Parallelismus als Aussage über Hiobs Abscheulichkeit verstanden. Die Übersetzung bewahrt die Verbindung zur Zurückweisung im ersten Halbvers, ohne die unsichere Ableitung im Haupttext auszubreiten.
- source_word: לִבְנֵי בִטְנִי
  choice: den Söhnen meines eigenen Leibes
  rationale: Die körperliche Wendung wird weitgehend formal bewahrt. »Leib« vermittelt die biologische oder blutsverwandtschaftliche Nähe besser als das im Deutschen missverständliche wörtliche »Bauch«.
theological_decisions:
- issue: Bezug von »Söhne meines Leibes«
  choice: Die wörtliche Verwandtschaftsbezeichnung bleibt im Haupttext stehen.
  alternative: »meine Kinder« oder »meine nahen Blutsverwandten«
  rationale: Der hebräische Ausdruck kann Hiobs eigene Kinder oder allgemeiner enge Blutsverwandte bezeichnen. Da der genaue Bezug unsicher ist, wird er nicht dogmatisch festgelegt.
- issue: Deutung von וְחַנֹּתִי
  choice: Als parallele Aussage der Abscheu übersetzt.
  alternative: Als Flehen oder Bitte um Gunst verstanden.
  rationale: Der unmittelbare Parallelismus stützt die Abscheu-Deutung; die sprachlich mögliche Bitte-Deutung wird wegen der echten textlichen Schwierigkeit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Haupttext ist gut verständlich, bewahrt aber mit »Söhnen meines eigenen Leibes« die auffällige körperliche Verwandtschaftsmetapher des Hebräischen; die entscheidende sprachliche Mehrdeutigkeit wird in den Fußnoten offengelegt.
