  source_fidelity: 'Die Aussage wird zutreffend wiedergegeben: Job erhält von seinem eigenen Hausuntergebenen keine Antwort und muss ihn persönlich anflehen. Die präsentische, lebhafte Wiedergabe des hebräischen Perfekts ist im poetischen Klagekontext vertretbar; die Fußnote wahrt die mögliche Vergangenheitslesart. Das לְ in לְעַבְדִּי wird im Deutschen jedoch besser durch die Konstruktion „jemandem zurufen“ abgebildet als durch das hier missverständlicher mögliche Akkusativobjekt bei „rufen“.'
