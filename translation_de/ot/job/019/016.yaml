  text: I call to my servant[a], but he does not answer[b]; I plead with him with my own mouth.
translation:
  language: de
  text: Ich rufe meinem Diener[a] zu, doch er antwortet nicht[b]; mit meinem eigenen Mund flehe ich ihn an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meinem Sklaven“. Das hebräische Wort עֶבֶד kann je nach Zusammenhang einen Diener oder einen Sklaven bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, mit strengerer Wiedergabe der hebräischen Verbformen: „Ich rief meinem Diener zu, doch er antwortete nicht; mit meinem eigenen Mund flehte ich ihn an.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעַבְדִּי
  choice: meinen Diener
  rationale: עֶבֶד kann je nach sozialem Zusammenhang „Diener“ oder „Sklave“ bezeichnen. Hier ist „Diener“ im Haupttext natürlich, während die ebenfalls mögliche Wiedergabe „Sklave“ in der Fußnote erhalten bleibt.
- source_word: קָרָאתִי
  choice: Ich rufe
  rationale: Das Perfekt kann in der poetischen Klage eine gegenwärtig und lebhaft geschilderte Lage ausdrücken. „Ich rufe“ fügt sich daher natürlich in den Zusammenhang; die strengere Vergangenheitswiedergabe bleibt möglich.
- source_word: וְלֹא יַעֲנֶה
  choice: doch er antwortet nicht
  rationale: ענה bedeutet „antworten“. Das verbindende וְ ist wegen des inhaltlichen Gegensatzes adversativ mit „doch“ wiedergegeben; das Imperfekt beschreibt hier passend die ausbleibende Antwort in Jobs gegenwärtiger Lage.
- source_word: בְּמוֹ פִי
  choice: mit meinem eigenen Mund
  rationale: Die hervorgehobene Form בְּמוֹ und „mein Mund“ unterstreichen, dass Job persönlich flehen muss. „Mit meinem eigenen Mund“ bewahrt diese Betonung.
- source_word: אֶתְחַנֶּן לוֹ
  choice: flehe ich ihn an
  rationale: Das Hitpael von חנן bezeichnet inständiges Bitten um Gunst oder Erbarmen. „Ihn anflehen“ gibt den demütigenden Rollenwechsel wieder, ohne die im Hebräischen nicht ausdrücklich vorhandene Modalität „müssen“ hinzuzufügen.
