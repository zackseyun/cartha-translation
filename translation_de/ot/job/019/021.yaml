source:
  edition: WLC
  text: חָנֻּ֬/נִי חָנֻּ֣/נִי אַתֶּ֣ם רֵעָ֑/י כִּ֥י יַד אֱ֝ל֗וֹהַּ נָ֣גְעָה בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/021.yaml
  text: Have pity on me[a], have pity on me, you my friends[b], for the hand of God has struck me.
translation:
  language: de
  text: Habt Erbarmen mit mir[a], habt Erbarmen mit mir, ihr meine Freunde! Denn Gottes Hand hat mich getroffen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seid mir gnädig“ oder „Habt Mitleid mit mir“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „hat mich berührt“; im Zusammenhang bezeichnet die Wendung eine schädigende Einwirkung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֻּנִי
  choice: Habt Erbarmen mit mir
  rationale: Der pluralische Imperativ richtet sich an Hiobs Freunde und bittet in diesem Zusammenhang um mitfühlende, barmherzige Behandlung. Die Wiederholung bleibt erhalten und vermittelt die Dringlichkeit des Hilferufs.
- source_word: רֵעָי
  choice: ihr meine Freunde
  rationale: רֵעַ bezeichnet hier Freunde oder Gefährten. Die direkte Anrede wird bewahrt; „Freunde“ ist im modernen Deutsch natürlich und im Kontext treffend.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Hiobs Bitte ein. „Denn“ entspricht dem argumentativen Zusammenhang und dem würdevollen poetischen Register.
- source_word: יַד אֱלוֹהַּ
  choice: Gottes Hand
  rationale: Die hebräische Metapher für göttliches Handeln beziehungsweise göttliche Macht wird transparent beibehalten.
- source_word: נָגְעָה בִּי
  choice: hat mich getroffen
  rationale: נגע mit ב bezeichnet ein Berühren mit wirksamer, hier schädigender Folge. „Getroffen“ vermittelt Hiobs Leiden natürlich und kräftig, ohne die Aussage bereits abstrakt als „heimgesucht“ oder „geplagt“ auszudeuten.
theological_decisions:
- issue: Göttliche Urheberschaft von Hiobs Leiden
  choice: Denn Gottes Hand hat mich getroffen
  alternative: Denn Gottes Hand hat mich berührt
  rationale: Der hebräische Text führt Hiobs Leiden ausdrücklich auf Gottes Handeln zurück. Die Übersetzung bewahrt diese theologische Spannung, ohne sie abzuschwächen oder systematisch aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die eindringliche Wiederholung und die Metapher von Gottes Hand bleiben erhalten.
