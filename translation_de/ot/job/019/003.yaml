  text: These ten times you have humiliated me[a]; you are not ashamed to wrong me.
translation:
  language: de
  text: Schon zehnmal habt ihr mich gedemütigt; ihr schämt euch nicht, mir Unrecht zu tun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich schlecht zu behandeln“, „hart mit mir umzugehen“; wörtlicher möglicherweise: „mich wie einen Fremden zu behandeln“. Das hebräische Verb ist schwierig und kann ausdrücken, dass Hiobs Freunde ihm entfremdet oder feindselig begegnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: Schon zehnmal
  rationale: Die hebräische Zahlenwendung bezeichnet nachdrücklich wiederholtes Handeln. „Schon zehnmal“ bewahrt die konkrete rhetorische Zahl und klingt im Deutschen natürlich.
- source_word: תַּכְלִימוּנִי
  choice: habt ihr mich gedemütigt
  rationale: Der Hifil von כלם bezeichnet das Zufügen von Schande oder Beschämung. „Gedemütigt“ gibt sowohl die verursachende Bedeutung als auch Hiobs persönliche Erniedrigung wieder.
- source_word: לֹא תֵבֹשׁוּ
  choice: ihr schämt euch nicht
  rationale: בוש bezeichnet das Empfinden von Scham. Die direkte deutsche Formulierung erhält Hiobs moralischen Vorwurf.
- source_word: תַּהְכְּרוּ לִי
  choice: mich schlecht zu behandeln
  rationale: Die seltene und schwierige Verbform bezeichnet hier im Zusammenhang ein feindseliges, verletzendes oder entfremdendes Verhalten gegenüber Hiob. Die gewählte Formulierung ist verständlich, ohne die unsichere genaue Nuance zu eng festzulegen; die wörtlichere Möglichkeit wird in der Fußnote genannt.
theological_decisions:
- issue: Art des Vorwurfs gegen Hiobs Freunde
  choice: Die lexikalische Mehrdeutigkeit des Verbs wird offengehalten.
  alternative: Die Wendung ausschließlich als „mich wie einen Fremden behandeln“ oder ausschließlich als „mir Unrecht tun“ festlegen.
  rationale: Der Vers erhebt einen zwischenmenschlichen und moralischen Vorwurf, doch die schwierige hebräische Verbform erlaubt mehrere verwandte Nuancen. Keine davon sollte aus theologischen Gründen zur einzig möglichen Deutung gemacht werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Klage- und Vorwurfston. Die Anrede im Plural und die rhetorische Zahl bleiben erhalten.
