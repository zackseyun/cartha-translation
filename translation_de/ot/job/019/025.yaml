base_translation:
  language: en
  yaml_path: translation/ot/job/019/025.yaml
  text: But as for me[a], I know that my Redeemer lives[c][b], and afterward he will rise over the dust.
translation:
  language: de
  text: 'Ich aber weiß: Mein Erlöser[a] lebt, und als Letzter wird er sich über dem Staub erheben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Rechtsbeistand“ beziehungsweise „mein Löser“. Das hebräische Wort bezeichnet jemanden, der einen Angehörigen auslöst, verteidigt oder dessen Recht durchsetzt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und zuletzt wird er auf dem Staub stehen“ oder „und danach wird er sich über dem Staub erheben“. Der hebräische Satzteil ist schwer zu deuten. „Staub“ kann an die Erde, die Sterblichkeit oder das Grab erinnern; in der ersten Alternative wird er auch als „Erdboden“ verstanden. Wörtlich steht „Staub“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Das selbstständige Pronomen ist betont; zusammen mit der Konjunktion ergibt sich im Zusammenhang ein persönlicher Kontrast.
- source_word: יָדַעְתִּי
  choice: weiß
  rationale: Die Perfektform bezeichnet hier eine gefestigte Erkenntnis mit gegenwärtiger Geltung; das deutsche Präsens gibt dies natürlich wieder.
- source_word: גֹּאֲלִי
  choice: mein Erlöser
  rationale: גאל bezeichnet den Löser, Beistand oder Rechtswahrer eines Angehörigen. „Erlöser“ wahrt die traditionelle Bedeutungsweite, ohne die genaue Identität oder Funktion festzulegen.
- source_word: חָי
  choice: lebt
  rationale: Das prädikative Adjektiv „lebend“ wird im Deutschen idiomatisch verbal wiedergegeben.
- source_word: וְאַחֲרוֹן
  choice: und als Letzter
  rationale: אַחֲרוֹן kann substantivisch „der Letzte“ beziehungsweise „als Letzter“ bedeuten. Diese Wiedergabe ist lexikalisch eng und erhält zugleich die umstrittene zeitliche und personale Nuance.
- source_word: עַל עָפָר
  choice: über dem Staub
  rationale: עַל kann „auf“, „über“ oder „gegen“ bedeuten; עָפָר heißt wörtlich „Staub“. Die Formulierung bewahrt das Bild und legt es nicht vorschnell als Erde oder Grab aus.
- source_word: יָקוּם
  choice: wird er sich erheben
  rationale: קום kann „aufstehen“, „sich erheben“ oder „dastehen“ bedeuten. „Sich erheben“ passt zu „über dem Staub“, ohne ausschließlich eine gerichtliche oder auferstehungstheologische Deutung festzuschreiben.
theological_decisions:
- issue: Identität und Funktion von גֹּאֵל
  choice: „mein Erlöser“, ohne die Gestalt ausdrücklich mit Gott, einem himmlischen Zeugen oder dem Messias gleichzusetzen
  alternative: „mein Rechtsbeistand“ oder „mein Löser“
  rationale: Der hebräische Ausdruck besitzt rechtliche, familiäre und rettende Bedeutungsanteile. Die Übersetzung wahrt seine theologische Tragweite, ohne die im Vers nicht ausdrücklich bestimmte Identität aufzulösen.
- issue: Bedeutung von וְאַחֲרוֹן ... יָקוּם
  choice: „und als Letzter wird er sich über dem Staub erheben“
  alternative: „und zuletzt wird er auf dem Erdboden stehen“ oder „und danach wird er sich über dem Staub erheben“
  rationale: Syntax und Aussage des Satzteils sind umstritten. Die Hauptfassung nimmt אַחֲרוֹן substantivisch und קום dynamisch, während die Fußnote wichtige zeitliche und räumliche Alternativen erhält; eine ausdrücklich ausgearbeitete Auferstehungslehre wird nicht in den Text hineingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die traditionelle Bezeichnung „Erlöser“ bleibt erhalten; die umstrittene Schlussklausel wird weder konfessionell noch eindeutig eschatologisch festgelegt. Alle Fußnotenmarker stehen im Haupttext.
