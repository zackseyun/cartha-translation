id: JOB.19.6
reference: Job 19:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דְּֽעוּ אֵ֭פוֹ כִּי אֱל֣וֹהַּ עִוְּתָ֑/נִי וּ֝/מְצוּד֗/וֹ עָלַ֥/י הִקִּֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/006.yaml
  text: Know then that God has wronged me and has surrounded me with his net[a][b].
translation:
  language: de
  text: 'Erkennt also: Gott hat mir Unrecht getan[a] und mich mit seinem Netz[b] umschlossen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mich ungerecht behandelt« oder »das Recht gegen mich verdreht«; das hebräische Verb kann das Beugen oder Verdrehen dessen bezeichnen, was recht ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit seiner Falle« beziehungsweise »mit seinem Fangnetz«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ
  choice: Erkennt
  rationale: Der Imperativ Plural von ידע fordert die Angeredeten auf, die behauptete Tatsache anzuerkennen. „Erkennt“ ist direkt und passt zum argumentativen Zusammenhang.
- source_word: אֵפוֹ
  choice: also
  rationale: Die Diskurspartikel markiert hier Folgerung und Nachdruck; „also“ gibt den Gedankengang natürlich wieder.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: Die singuläre Gottesbezeichnung wird ohne Zusatz als „Gott“ wiedergegeben.
- source_word: עִוְּתָנִי
  choice: hat mir Unrecht getan
  rationale: Das Verb עות kann das Beugen oder Verdrehen des Rechten und daraus folgend ungerechte Behandlung bezeichnen. Diese Formulierung bewahrt Hiobs scharfen Vorwurf in natürlichem Deutsch.
- source_word: מְצוּדוֹ
  choice: mit seinem Netz
  rationale: Das Substantiv bezeichnet ein Fangnetz beziehungsweise eine Falle. „Netz“ erhält das konkrete Jagdbild.
- source_word: עָלַי הִקִּיף
  choice: mich … umschlossen
  rationale: Das Hifil von נקף bezeichnet das Umgeben oder Einkreisen. „Umschlossen“ verbindet sich im Deutschen idiomatisch mit dem Bild des Netzes.
theological_decisions:
- issue: Hiobs Vorwurf gegen Gott
  choice: Die direkte Aussage „Gott hat mir Unrecht getan“ bleibt ungemildert stehen.
  alternative: „Gott hat mich bedrängt“ oder „Gott hat sich gegen mich gewandt“.
  rationale: Der hebräische Ausdruck hat eine starke moralisch-rechtliche Komponente. Die Übersetzung bewahrt die theologische Spannung von Hiobs Klage, ohne seine Einschätzung dadurch als lehrmäßiges Urteil zu bestätigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt nach „Erkennt also“ wahrt den eindringlichen argumentativen Ton. Die drastische Anklage wird nicht abgeschwächt; die Jagdmetapher bleibt konkret.
