translation:
  language: de
  text: Mit eisernem Griffel und Blei[a] mögen sie für immer in den Felsen eingemeißelt werden![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Blei könnte zusammen mit dem eisernen Werkzeug verwendet oder in die eingeritzten Buchstaben gefüllt worden sein, damit sie besser sichtbar blieben. Der Text erklärt seine Funktion jedoch nicht.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „für immer sollen sie in den Felsen gehauen werden“. Das hebräische Verb bedeutet gewöhnlich „hauen“ oder „heraushauen“; hier geht es darum, Worte dauerhaft einzuschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵט
  choice: mit ... Griffel
  rationale: עֵט bezeichnet ein Schreib- oder Ritzwerkzeug. Zusammen mit Eisen und Fels ist ein Werkzeug zum Einritzen gemeint; „Griffel“ bewahrt zugleich das Bild des Schreibens.
- source_word: בַּרְזֶל
  choice: eisernem
  rationale: Die Materialangabe wird direkt wiedergegeben und bestimmt den Griffel näher.
- source_word: וְעֹפָרֶת
  choice: und mit Blei
  rationale: עֹפָרֶת bezeichnet Blei. Seine genaue Funktion wird im Text nicht erklärt; daher bleibt die schlichte Materialangabe stehen.
- source_word: לָעַד
  choice: für immer
  rationale: Die Wendung drückt die gewünschte dauerhafte Bewahrung der Worte aus und ist in modernem Deutsch natürlich.
- source_word: בַּצּוּר
  choice: in den Felsen
  rationale: צוּר bedeutet Fels oder Felsgestein. „In den Felsen“ verdeutlicht, dass die Schrift hineingeschnitten wird, ohne den Begriff zum allgemeineren „Stein“ abzuschwächen.
- source_word: יֵחָצְבוּן
  choice: sollen sie ... eingemeißelt werden
  rationale: חצב bedeutet gewöhnlich „hauen, heraushauen“. Im Zusammenhang mit dauerhaft festgehaltenen Worten bezeichnet es das Einschneiden einer Inschrift; die Wunschbedeutung des Imperfekts wird mit „sollen“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet die knappe hebräische Reihung ab; „eingemeißelt“ ist im Deutschen für eine dauerhafte Felsinschrift natürlicher als das wörtliche „gehauen“.
