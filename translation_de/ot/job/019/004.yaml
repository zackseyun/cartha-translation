id: JOB.19.4
reference: Job 19:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַף אָמְנָ֥ם שָׁגִ֑יתִי אִ֝תִּ֗/י תָּלִ֥ין מְשׁוּגָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/004.yaml
  text: And even if I truly have gone astray[a], my error remains with me.
translation:
  language: de
  text: 'Und selbst wenn ich wirklich geirrt habe: Mein Irrtum bleibt bei mir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Mein Irrtum übernachtet bei mir.«'
    reason: Das hebräische Verb bedeutet wörtlich »übernachten«; die Hauptübersetzung gibt seinen idiomatischen Sinn wieder.
lexical_decisions:
- source_word: וְאַף
  choice: Und selbst wenn
  rationale: Die Verbindung leitet im Zusammenhang eine betonte Einräumung ein; »Und selbst wenn« bewahrt sowohl den Anschluss an den vorherigen Vers als auch den einräumenden Sinn.
- source_word: אָמְנָם
  choice: wirklich
  rationale: Das Adverb verstärkt die Einräumung und wird mit dem im heutigen Deutsch natürlichen »wirklich« wiedergegeben.
- source_word: שָׁגִיתִי
  choice: ich geirrt habe
  rationale: Das Verb bezeichnet ein Abirren oder Irren. »Geirrt« bewahrt die Bedeutung, ohne den Ausdruck vorschnell als »gesündigt« moralisch festzulegen.
- source_word: אִתִּי
  choice: bei mir
  rationale: Die Präposition bezeichnet hier am natürlichsten den Bereich, in dem der Irrtum verbleibt; »bei mir« passt zudem zum Bild des Übernachtens im folgenden Verb.
- source_word: תָּלִין
  choice: bleibt
  rationale: Das Verb bedeutet wörtlich »übernachten« oder »Herberge nehmen«, drückt hier aber idiomatisch ein Verbleiben aus. Das konkrete Bild wird in der Fußnote erhalten.
- source_word: מְשׁוּגָתִי
  choice: mein Irrtum
  rationale: Das Substantiv bezeichnet Irrtum oder Abirren und greift das vorherige Verb auf. »Irrtum« ist präzise und vermeidet die stärkere, hier nicht zwingende Deutung »Sünde«.
theological_decisions:
- issue: Ob Hiob tatsächliche moralische Schuld eingesteht
  choice: Die Aussage wird als hypothetische Einräumung formuliert und mit »Irrtum« wiedergegeben.
  alternative: »Auch wenn ich wirklich gesündigt habe«
  rationale: Die hebräischen Ausdrücke können Irren oder Abirren bezeichnen, verlangen aber hier weder eine ausdrückliche Sündenbeichte noch die Feststellung tatsächlicher Schuld. Die konditionale Spannung bleibt daher erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet die enge Folgerung zwischen der eingeräumten Möglichkeit und Hiobs Aussage ab, dass der Irrtum bei ihm selbst verbleibt.
