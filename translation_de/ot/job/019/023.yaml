base_translation:
  language: en
  yaml_path: translation/ot/job/019/023.yaml
  text: Oh[a], that now my words were written down! Oh[b], that they were inscribed in a book!
translation:
  language: de
  text: Ach, würden meine Worte doch jetzt aufgeschrieben! Ach, würden sie doch in ein Buch[a] eingraviert[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in einer Schriftrolle« beziehungsweise »in einem Schriftstück«; das hebräische Wort kann verschiedene Formen schriftlicher Dokumente bezeichnen.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »eingeritzt«; das hebräische Verb kann eine dauerhafte Inschrift bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ach, würden … doch
  rationale: Die hebräische Wendung formuliert keinen wörtlichen Fragesatz, sondern einen dringlichen Wunsch. Die deutsche Konstruktion mit »Ach« und »doch« gibt diesen optativischen Ton natürlich wieder.
- source_word: אֵפוֹ
  choice: jetzt
  rationale: Die Partikel verstärkt hier die Dringlichkeit des Wunsches; »jetzt« bewahrt diese emotionale Unmittelbarkeit.
- source_word: וְיִכָּתְבוּן
  choice: würden … aufgeschrieben
  rationale: Die passive Form von כתב bezeichnet das schriftliche Aufzeichnen. Der deutsche Konjunktiv mit »würden« fügt sich natürlich in den Wunsch ein.
- source_word: מִלָּי
  choice: meine Worte
  rationale: Dies ist die direkte und im Kontext natürliche Wiedergabe des Plurals mit Suffix der ersten Person.
- source_word: בַּסֵּפֶר
  choice: in einem Buch
  rationale: סֵפֶר kann ein Buch, eine Schriftrolle oder allgemein ein Schriftstück bezeichnen. »Buch« ist im modernen Deutsch verständlich; die historische Bedeutungsbreite wird in einer Fußnote erhalten.
- source_word: וְיֻחָקוּ
  choice: würden … festgehalten
  rationale: חקק kann das Einritzen oder Eingravieren und damit eine dauerhafte Aufzeichnung bezeichnen. »Festgehalten« ist im Zusammenhang mit einem Buch natürlich, während die konkretere Bedeutung in der Fußnote bewahrt bleibt.
theological_decisions: []
