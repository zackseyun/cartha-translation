id: JOB.19.22
reference: Job 19:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ֭/מָּה תִּרְדְּפֻ֣/נִי כְמוֹ אֵ֑ל וּ֝/מִ/בְּשָׂרִ֗/י לֹ֣א תִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/022.yaml
  text: Why do you pursue me like God[b][a], and are not satisfied with my flesh?
translation:
  language: de
  text: Warum verfolgt ihr mich wie Gott[a] und werdet an meinem Fleisch nicht satt?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Gott“. Das hebräische Wort אֵל kann auch „ein Gott“ oder, hier weniger wahrscheinlich, „ein Mächtiger“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „werdet von meinem Fleisch nicht satt“. Das Bild stellt die Freunde als unerbittliche Angreifer dar, die sich gleichsam an Ijobs eigenem Fleisch sättigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Warum
  rationale: Das Frageadverb leitet Ijobs anklagende Protestfrage direkt und natürlich ein.
- source_word: תִּרְדְּפֻנִי
  choice: verfolgt ihr mich
  rationale: רדף bezeichnet verfolgen, nachjagen oder feindlich bedrängen. „Verfolgt“ bewahrt sowohl das Bild des Nachsetzens als auch den feindseligen Sinn, ohne ihn unnötig einzuengen.
- source_word: כְמוֹ
  choice: wie
  rationale: Die einfache Vergleichspartikel wird im modernen Deutschen natürlich mit „wie“ wiedergegeben.
- source_word: אֵל
  choice: Gott
  rationale: 'Im Zusammenhang liegt der Bezug auf Gott nahe: Ijob vergleicht das unerbittliche Vorgehen seiner Freunde mit dem von ihm empfundenen göttlichen Angriff. Die lexikalisch mögliche allgemeinere Lesart wird in einer Fußnote erhalten.'
- source_word: וּמִבְּשָׂרִי
  choice: an meinem Fleisch
  rationale: Die Präposition מִן steht bei שבע für das, woran man sich sättigt. „An meinem Fleisch“ ist idiomatisch, hält das konkrete Körperbild fest und lässt die Vorstellung räuberischen Verzehrens anklingen.
- source_word: לֹא תִשְׂבָּעוּ
  choice: werdet … nicht satt
  rationale: שבע bedeutet satt oder gesättigt werden. Die deutsche Wendung ist lebendig und bewahrt das Bild unersättlicher Feindseligkeit.
theological_decisions:
- issue: Bezug von אֵל im Vergleich כְמוֹ אֵל
  choice: Gott
  alternative: ein Gott; ein Mächtiger
  rationale: Der unmittelbare Kontext spricht am ehesten von dem Gott, dessen Hand Ijob getroffen hat (19,21). Dennoch kann אֵל lexikalisch auch allgemein „ein Gott“ oder „ein Mächtiger“ bedeuten; diese echte Mehrdeutigkeit wird nicht verschwiegen, sondern in der Fußnote angegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede im Plural und die drastische Fleischmetapher bleiben erhalten; die Satzstellung ist natürlich, ohne die rhetorische Schärfe abzuschwächen.
