  terminology: „Gott“, „Fleisch“ und „verfolgt“ sind kontextgerecht. „Ijob“ entspricht einer in deutschsprachigen Bibelübersetzungen verbreiteten Namensform. Die Fußnoten sind sachlich und erhalten die relevante lexikalische Mehrdeutigkeit.
