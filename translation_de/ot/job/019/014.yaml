  yaml_path: translation/ot/job/019/014.yaml
  text: My relatives have failed me[a], and my acquaintances have forgotten me.
translation:
  language: de
  text: Meine Verwandten bleiben aus[a], und meine Bekannten haben mich vergessen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »Meine Nahen haben aufgehört.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ
  choice: haben sich zurückgezogen
  rationale: Das Verb bedeutet grundsätzlich „aufhören, ablassen“. Mit „meine Verwandten“ als Subjekt bezeichnet es hier idiomatisch das Ende ihrer Nähe beziehungsweise Unterstützung, ohne das im Hebräischen fehlende Objekt ausdrücklich zu ergänzen.
- source_word: קְרוֹבָי
  choice: meine Verwandten
  rationale: Das substantivierte „meine Nahen“ kann nahestehende Personen und besonders Angehörige bezeichnen; „Verwandte“ ist im Kontext klar und natürlich.
- source_word: וּמְיֻדָּעַי
  choice: und meine Bekannten
  rationale: Die Form bezeichnet Menschen, die dem Sprecher bekannt oder vertraut sind. „Bekannte“ bewahrt diese Bedeutung, ohne die größere Vertrautheit von „Freunde“ vorauszusetzen.
- source_word: שְׁכֵחוּנִי
  choice: haben mich vergessen
  rationale: Die direkte Wiedergabe erhält sowohl die Grundbedeutung von שׁכח als auch die eindringliche Sprache der Klage.
