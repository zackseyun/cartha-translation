id: JOB.19.13
reference: Job 19:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַ֭חַ/י מֵ/עָלַ֣/י הִרְחִ֑יק וְ֝/יֹדְעַ֗/י אַךְ זָ֥רוּ מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/013.yaml
  text: He has driven my brothers far from me[b][a], and those who know me are wholly estranged from me.
translation:
  language: de
  text: Er hat meine Brüder weit von mir entfernt,[a] und die mich kennen, sind mir völlig fremd geworden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er hat meine Brüder von mir fortgeschafft.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und meine Bekannten haben sich völlig von mir entfremdet.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: meine Brüder
  rationale: Die maskuline Pluralform mit Suffix der 1. Person Singular bedeutet wörtlich »meine Brüder«. Im Zusammenhang kann sie auch nahe Verwandte umfassen; die direkte Wiedergabe bewahrt jedoch Form und soziale Schärfe.
- source_word: מֵעָלַי
  choice: weit von mir
  rationale: In Verbindung mit הִרְחִיק bezeichnet die Präposition idiomatisch eine Entfernung aus Hiobs Nähe oder Lebenskreis.
- source_word: הִרְחִיק
  choice: hat … weit … entfernt
  rationale: Das Hifil-Perfekt bedeutet »fern machen, entfernen«. Die gewählte Form gibt den kausativen Sinn natürlich wieder, ohne eine im Verb nicht ausdrücklich enthaltene Gewaltsamkeit hinzuzufügen.
- source_word: וְיֹדְעַי
  choice: die mich kennen
  rationale: Die partizipiale Form bedeutet wörtlich »die mich Kennenden« und bezeichnet Menschen, die mit Hiob vertraut sind. Die Formulierung bleibt transparent und lebendig.
- source_word: אַךְ
  choice: völlig
  rationale: Die Partikel verstärkt hier die Aussage und hebt die Vollständigkeit der Entfremdung hervor.
- source_word: זָרוּ
  choice: sind … fremd geworden
  rationale: Das Qal-Perfekt beschreibt, dass die Betreffenden fremd beziehungsweise entfremdet geworden sind. Die deutsche Formulierung bewahrt sowohl den eingetretenen Zustand als auch das Bild des Fremdwerdens.
- source_word: מִמֶּנִּי
  choice: mir
  rationale: Das hebräische מִן markiert die Trennung von Hiob. Im Deutschen drückt »mir fremd geworden« diesen Beziehungsabbruch idiomatisch aus; die Alternative »von mir entfremdet« bildet die Präposition formaler ab.
theological_decisions:
- issue: Unausgesprochenes Subjekt von הִרְחִיק
  choice: Das Subjekt bleibt als Pronomen »Er« stehen.
  alternative: Gott hat meine Brüder weit von mir entfernt.
  rationale: Das Hebräische enthält ein unausgesprochenes Subjekt in der 3. Person Singular. Der Kontext weist auf Gott, doch die Übersetzung nennt ihn nicht ausdrücklich und bewahrt so die knappe Form sowie die theologische Spannung des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Brüder« wahrt die konkrete hebräische Form; »die mich kennen« vermeidet das etwas distanziertere »Bekannte«. Die Hauptfassung ist gut verständlich und bewahrt zugleich Hiobs scharfe Klage.
