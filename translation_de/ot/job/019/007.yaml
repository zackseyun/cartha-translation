source:
  edition: WLC
  text: הֵ֤ן אֶצְעַ֣ק חָ֭מָס וְ/לֹ֣א אֵעָנֶ֑ה אֲ֝שַׁוַּ֗ע וְ/אֵ֣ין מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/007.yaml
  text: Look[a], I cry out, “Violence!” but I am not answered; I cry for help[c][b], but there is no justice.
translation:
  language: de
  text: 'Ja, ich schreie: »Gewalt!«[a], doch ich bekomme keine Antwort; ich rufe um Hilfe, doch es gibt kein Recht.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Unrecht!« Das hebräische Wort kann Gewalt, Unrecht oder einen empörten Rechtsruf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »doch es gibt kein gerechtes Urteil« beziehungsweise »keine rechtliche Abhilfe«. Das hebräische Wort hat hier einen rechtlichen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Ja
  rationale: Die Partikel leitet die Klage nachdrücklich ein. »Ja« wirkt im modernen Deutschen natürlich und bewahrt den bekräftigenden, aufmerksamkeitslenkenden Ton.
- source_word: אֶצְעַק
  choice: ich schreie
  rationale: צעק bezeichnet einen lauten, dringlichen Schrei aus Bedrängnis; »schreien« gibt Lautstärke und Dringlichkeit knapp wieder.
- source_word: חָמָס
  choice: Gewalt
  rationale: Das Substantiv kann Gewalt, Unrecht oder einen empörten Rechtsruf bezeichnen. »Gewalt!« bewahrt den direkten Klageruf und die verbreitete Grundbedeutung.
- source_word: אֵעָנֶה
  choice: ich bekomme keine Antwort
  rationale: Der Nifal von ענה bedeutet hier »beantwortet werden«. Die aktive deutsche Wendung ist natürlich und hält fest, dass Jobs Ruf unbeantwortet bleibt.
- source_word: אֲשַׁוַּע
  choice: ich rufe um Hilfe
  rationale: Das Verb bezeichnet einen dringenden Hilferuf. Diese Wiedergabe unterscheidet den Ausdruck leicht vom vorausgehenden lauten Schreien und macht sein Ziel deutlich.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: מִשְׁפָּט umfasst hier Recht, gerechtes Urteil und rechtliche Abhilfe. »Recht« ist im Deutschen knapp, würdevoll und lässt die rechtliche wie moralische Dimension offen.
theological_decisions:
- issue: Art von Jobs Klage gegen Gott
  choice: Die Klage über den unbeantworteten Hilferuf und das fehlende Recht wird ohne Abschwächung wiedergegeben.
  alternative: Die Aussage indirekter formulieren, damit sie nicht nahelegt, Gott verweigere Antwort oder Recht.
  rationale: Der hebräische Text stellt Jobs scharfen Protest unvermittelt dar. Die Übersetzung bewahrt diese theologische Spannung, statt sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit parallelem Satzbau. Der unmittelbare Klageruf bleibt erhalten; altertümliche Formen wie »Siehe« und unnötig juristische Fachsprache werden vermieden.
