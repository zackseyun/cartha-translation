  text: גַּם עֲ֭וִילִים מָ֣אֲסוּ בִ֑/י אָ֝ק֗וּמָה וַ/יְדַבְּרוּ בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/018.yaml
  text: Even little children despise me; when I rise[a], they speak against me.
translation:
  language: de
  text: Selbst Kinder[a] verachten mich; wenn ich aufstehe, reden sie gegen mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Toren“, „Unverschämte“ oder „junge Knaben“. Das hebräische Wort עֲוִילִים bezeichnet gewöhnlich törichte oder sittlich unempfindsame Menschen; hier verstehen es viele als Hinweis auf unreife oder gering geachtete junge Leute, die Hiob verhöhnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Selbst
  rationale: Hebt im fortlaufenden Klagezusammenhang die besondere Erniedrigung hervor, dass sogar gesellschaftlich wenig angesehene Junge Hiob verachten.
- source_word: עֲוִילִים
  choice: junge Burschen
  rationale: Das seltene Wort kann törichte oder moralisch unverständige Menschen bezeichnen; im Kontext liegt eine Bezeichnung für unreife junge Leute nahe. Die Formulierung bewahrt diese kontextuelle Deutung, ohne ausdrücklich Kleinkinder vorauszusetzen.
- source_word: מָאֲסוּ בִי
  choice: verachten mich
  rationale: מאס bezeichnet hier eine von Geringschätzung geprägte Zurückweisung; „verachten“ gibt den sozialen und emotionalen Ton natürlich wieder.
- source_word: אָקוּמָה
  choice: wenn ich aufstehe
  rationale: 'Die Verbform lässt sich im Zusammenhang als temporale beziehungsweise wiederholte Bedingung verstehen: Sobald oder sooft Hiob aufsteht, reden sie gegen ihn.'
- source_word: וַיְדַבְּרוּ בִי
  choice: reden sie gegen mich
  rationale: דבר mit ב trägt hier im feindseligen Kontext den Sinn, gegen jemanden zu reden. Die Wiedergabe bleibt näher am Wortlaut als das stärker deutende „verspotten“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Junge Burschen“ vermittelt Jugend und soziale Erniedrigung, vermeidet aber die möglicherweise zu enge Festlegung auf kleine Kinder. Die schwierige lexikalische Bandbreite wird in der Fußnote offengehalten.
