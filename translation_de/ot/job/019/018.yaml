  terminology: 'Die Fußnote muss „moralisch unverständige Menschen“ ersetzen: Diese Formulierung bedeutet im Deutschen eher „moralisch nicht zu verstehende Menschen“, nicht Menschen ohne Einsicht bzw. moralisches Urteilsvermögen. „Törichte oder sittlich unempfindsame Menschen“ gibt die einschlägige Bedeutungsrichtung angemessen wieder.'
