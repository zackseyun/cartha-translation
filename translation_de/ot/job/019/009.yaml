  text: כְּ֭בוֹדִ/י מֵ/עָלַ֣/י הִפְשִׁ֑יט וַ֝/יָּ֗סַר עֲטֶ֣רֶת רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/009.yaml
  text: He has stripped my honor from me and removed the crown from my head[a].
translation:
  language: de
  text: Er hat mich meiner Ehre entkleidet und die Krone von meinem Kopf genommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Herrlichkeit“ oder „meine Würde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: meine Ehre
  rationale: כָּבוֹד kann Ehre, Herrlichkeit oder Würde bezeichnen. Im Zusammenhang von Hiobs Erniedrigung und dem Verlust seines Ansehens gibt „meine Ehre“ den sozialen und persönlichen Status natürlich wieder.
- source_word: מֵעָלַי
  choice: mir … genommen
  rationale: Wörtlich steht „von über mir/auf mir weg“. Mit dem Verb הִפְשִׁיט bildet die deutsche Wendung „mir … genommen“ idiomatisch den Entzug ab, ohne das Bild unnötig zu verkomplizieren.
- source_word: הִפְשִׁיט
  choice: genommen
  rationale: Das Verb bezeichnet eigentlich das Abstreifen oder Entkleiden. „Mir meine Ehre genommen“ ist im Deutschen natürlich; die Vorstellung, dass Hiob seiner Ehre entkleidet wird, bleibt als Entzugsbild erhalten.
- source_word: וַיָּסַר
  choice: entfernt
  rationale: Die Hifil-Form von סור bedeutet hier „wegnehmen/entfernen“. „Entfernt“ wahrt die parallele Bewegung des Entzugs.
- source_word: עֲטֶרֶת
  choice: die Krone
  rationale: Das Substantiv bezeichnet eine Krone, einen Kranz oder ein Diadem als Zeichen von Ehre und Rang. „Krone“ ist klar, geläufig und bewahrt das poetische Bild.
- source_word: רֹאשִׁי
  choice: meinem Kopf
  rationale: Die konkrete Körperangabe wird wörtlich bewahrt, weil die Krone auf dem Kopf das zentrale Bild der zweiten Vershälfte bildet.
theological_decisions:
- issue: Identität des unausgesprochenen Subjekts
  choice: Das Pronomen „Er“ bleibt stehen und verweist im Kontext auf Gott.
  alternative: Ein nicht näher bestimmter Gegner oder eine unpersönliche Macht.
  rationale: Im unmittelbaren Zusammenhang schreibt Hiob sein Leiden Gott zu. Da der hebräische Vers den Namen Gottes jedoch nicht nennt, ergänzt die Übersetzung ihn nicht und bewahrt so die knappe Form und die theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. Das Perfekt gibt den vollzogenen Entzug mit gegenwärtiger Wirkung wieder; die Metapher der Krone bleibt erhalten.
