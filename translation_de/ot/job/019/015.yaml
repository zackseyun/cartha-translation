  text: The guests in my house and my female servants count me as a stranger; I have become a foreigner in their eyes.
translation:
  language: de
  text: Die Gäste in meinem Haus und meine Mägde halten mich für einen Fremden; in ihren Augen bin ich zu einem Fremden geworden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Die Fremden, die in meinem Haus wohnen. Das hebräische Wort kann Gäste, Zugezogene oder ansässige Fremde bezeichnen.'
    reason: Die soziale Stellung der mit גָּרֵי bezeichneten Personen ist mehrdeutig und soll nicht stillschweigend auf kurzfristige Gäste verengt werden.
lexical_decisions:
- source_word: גָּרֵי בֵיתִי
  choice: die Gäste in meinem Haus
  rationale: גָּר bezeichnet Menschen, die sich außerhalb ihrer angestammten Gemeinschaft an einem Ort aufhalten; im Zusammenhang des Hauses ist „Gäste in meinem Haus“ natürlich und verständlich. Die mögliche Bedeutung länger dort lebender Fremder bleibt in der Fußnote erhalten.
- source_word: אַמְהֹתַי
  choice: meine Mägde
  rationale: אָמָה bezeichnet eine weibliche Dienerin beziehungsweise Sklavin. „Mägde“ wahrt die historische soziale Stellung knapper als das modernere, aber weniger genaue „Dienerinnen“.
- source_word: זָר
  choice: ein Fremder
  rationale: זָר bezeichnet hier jemanden, der nicht mehr als zugehörig gilt. „Fremder“ gibt diese soziale Entfremdung idiomatisch wieder.
- source_word: נָכְרִי
  choice: Ausländer
  rationale: נָכְרִי bezeichnet einen Menschen fremder Herkunft oder Zugehörigkeit. Die von זָר abweichende Wiedergabe bewahrt den Wechsel der hebräischen Wörter und die Steigerung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und der Bedeutungswechsel von „Fremder“ zu „Ausländer“ bilden Hiobs zunehmende soziale Entfremdung ab.
