  text: If indeed you magnify yourselves against me and prove my disgrace against me[b][a],
translation:
  language: de
  text: Wenn ihr euch wirklich über mich erhebt[a] und meine Schmach gegen mich ins Feld führt[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch auf meine Kosten großmacht“. Das hebräische Verb kann ausdrücken, dass man sich einem anderen gegenüber großmacht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mir meine Schmach als Beweis vorhaltet“ beziehungsweise „meine Schmach gegen mich geltend macht“. Das hebräische Verb kann hier das Führen oder Begründen eines Falls bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אָמְנָם
  choice: wenn ihr … wirklich
  rationale: אִם leitet den Bedingungssatz ein, während אָמְנָם ihn nachdrücklich verstärkt. Die Stellung von „wirklich“ im deutschen Satz klingt natürlich und bewahrt den Nachdruck.
- source_word: עָלַי תַּגְדִּילוּ
  choice: euch über mich erhebt
  rationale: Der Hifil von גדל bezeichnet hier ein Sich-groß-Machen gegenüber beziehungsweise auf Kosten eines anderen. „Sich über jemanden erheben“ gibt Bild und feindselige Überheblichkeit idiomatisch wieder.
- source_word: וְתוֹכִיחוּ עָלַי
  choice: gegen mich ins Feld führt
  rationale: יכח im Hifil kann einen Streit führen, etwas nachweisen oder einen Fall begründen. Die Wendung wahrt den forensisch-argumentativen Sinn, ohne die mehrdeutige Formulierung vorschnell auf „beweisen“ festzulegen.
- source_word: חֶרְפָּתִי
  choice: meine Schmach
  rationale: חֶרְפָּה bezeichnet Schmach, Schande oder entehrenden Vorwurf. „Schmach“ bewahrt sowohl den sozialen Ehrverlust als auch das, was Hiobs Freunde gegen ihn verwenden.
theological_decisions: []
