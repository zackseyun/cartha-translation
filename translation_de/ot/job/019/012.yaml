source:
  edition: WLC
  text: יַ֤חַד יָ֘בֹ֤אוּ גְדוּדָ֗י/ו וַ/יָּסֹ֣לּוּ עָלַ֣/י דַּרְכָּ֑/ם וַ/יַּחֲנ֖וּ סָבִ֣יב לְ/אָהֳלִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/012.yaml
  text: Together his troops come; they build up their road against me[a], and they camp all around my tent.
translation:
  language: de
  text: Gemeinsam rücken seine Truppen an; sie schütten ihren Weg gegen mich auf[a] und schlagen rings um mein Zelt ihr Lager auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie schütten ihren Belagerungsdamm gegen mich auf«. Das hebräische Verb kann das Anlegen eines Weges oder das Aufschütten eines Belagerungsdamms bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Gemeinsam
  rationale: Das Adverb bezeichnet ein vereintes oder gleichzeitiges Vorgehen und gibt den koordinierten Angriff natürlich wieder.
- source_word: יָבֹאוּ
  choice: rücken … an
  rationale: בוא bedeutet grundsätzlich »kommen«; im militärischen Zusammenhang macht »anrücken« die feindliche Annäherung deutlich, ohne die Art der Truppen näher festzulegen.
- source_word: גְדוּדָיו
  choice: seine Truppen
  rationale: גְּדוּד bezeichnet eine Truppe, Schar oder einen Streiftrupp. »Truppen« ist im militärischen Bild klar und lässt deren Größe offen.
- source_word: וַיָּסֹלּוּ
  choice: sie schütten … auf
  rationale: סלל kann das Aufschütten oder Anlegen eines Weges beziehungsweise eines Belagerungsdamms bezeichnen. »aufschütten« bewahrt das konkrete Bild.
- source_word: עָלַי
  choice: gegen mich
  rationale: Die Präposition bedeutet wörtlich »auf/über mir«, hat hier im Angriffskontext jedoch adversative Bedeutung.
- source_word: דַּרְכָּם
  choice: ihren Weg
  rationale: דֶּרֶךְ bedeutet »Weg, Straße, Pfad«. »Weg« bewahrt die lexikalische Offenheit; die Fußnote erläutert die mögliche Belagerungsvorstellung.
- source_word: וַיַּחֲנוּ
  choice: schlagen … ihr Lager auf
  rationale: חנה bedeutet »lagern, sich lagern«. Die deutsche Wendung ist idiomatisch und erhält den militärischen Zusammenhang.
- source_word: סָבִיב
  choice: rings um
  rationale: Das Wort bezeichnet eine vollständige Umringung und wird im Deutschen knapp und anschaulich wiedergegeben.
- source_word: לְאָהֳלִי
  choice: mein Zelt
  rationale: אֹהֶל bezeichnet konkret ein Zelt und kann zugleich für die Wohnstätte oder den Haushalt stehen; das konkrete Bild bleibt erhalten.
theological_decisions:
- issue: Bezug des Suffixes der 3. Person Singular in גְדוּדָיו
  choice: Das Pronomen »seine« bleibt stehen; im Zusammenhang bezieht es sich auf Gott, den Hiob im Bild eines Angreifers beschreibt.
  alternative: Ein nicht näher bestimmter feindlicher Befehlshaber innerhalb des Bildes.
  rationale: Der unmittelbare Kontext spricht von Gottes feindlich empfundener Behandlung Hiobs. Die pronominale Form des Hebräischen wird jedoch nicht durch den ausdrücklichen Gottesnamen ersetzt, sodass die sprachliche Perspektive und ein mögliches Maß an Offenheit gewahrt bleiben.
translation_notes:
  register: Moderne, würdige Standardsprache mit anschaulichem militärischem Bild. Das poetische Präsens vergegenwärtigt Hiobs Schilderung; »Zelt« bewahrt die konkrete Bildsprache.
