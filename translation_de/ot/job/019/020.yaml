  text: My bone clings to my skin and to my flesh[b][a], and I have escaped with the skin of my teeth.
translation:
  language: de
  text: Meine Knochen kleben an meiner Haut und an meinem Fleisch,[a] und ich bin mit der Haut meiner Zähne entkommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Mein Knochen klebt an meiner Haut und an meinem Fleisch.« Das hebräische Wort für »Knochen« steht in der Einzahl, kann hier aber das gesamte Knochengerüst bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die einzigartige hebräische Wendung ist schwer zu deuten; wahrscheinlich meint sie, dass Hiob nur mit knapper Not entkommen ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹרִי וּבִבְשָׂרִי
  choice: Nur Haut und Fleisch … an meinen Knochen
  rationale: עוֹר und בָּשָׂר bezeichnen wörtlich »Haut« und »Fleisch«. Die deutsche Satzgestaltung gibt das Bild von Hiobs bis auf das Skelett abgemagertem Körper natürlich wieder; »nur« verdeutlicht die im Zusammenhang ausgedrückte äußerste Reduktion.
- source_word: דָּבְקָה עַצְמִי
  choice: kleben noch an meinen Knochen
  rationale: דבק bedeutet »haften, kleben«. Das singularische עַצְמִי kann kollektiv das Knochengerüst bezeichnen; im natürlichen Deutschen steht dafür der Plural »meine Knochen«.
- source_word: וָאֶתְמַלְּטָה
  choice: ich bin … entkommen
  rationale: Das Verb מלט bezeichnet Entkommen oder Entrinnen. Das deutsche Perfekt beschreibt den gegenwärtigen Zustand als Ergebnis eines äußerst knappen Entrinnens.
- source_word: בְּעוֹר שִׁנָּי
  choice: mit der Haut meiner Zähne
  rationale: Die ungewöhnliche hebräische Wendung wird formal bewahrt, statt ihre schwer deutbare Bildsprache im Haupttext aufzulösen. Die Präposition בְּ wird mit »mit« wiedergegeben.
theological_decisions:
- issue: Deutung der Wendung בְּעוֹר שִׁנָּי
  choice: Das ungewöhnliche Bild »mit der Haut meiner Zähne« bleibt im Haupttext erhalten.
  alternative: »mit knapper Not« oder »nur um Haaresbreite«
  rationale: Die Bedeutung ist wahrscheinlich ein äußerst knappes Entkommen, doch der genaue Bezug der einzigartigen hebräischen Wendung ist umstritten. Eine idiomatische Auflösung würde diese echte Unsicherheit verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Haupttext ist gut verständlich, bewahrt aber die auffällige und möglicherweise bewusst paradoxe Bildsprache der zweiten Vershälfte; die wörtlichere Syntax der ersten Hälfte steht in der Fußnote.
