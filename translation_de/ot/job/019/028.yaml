base_translation:
  language: en
  yaml_path: translation/ot/job/019/028.yaml
  text: If you say[a], ‘How shall we pursue him, since the root of the matter is found in me?’
translation:
  language: de
  text: 'Wenn ihr sagt[a]: »Wie sollen wir ihn verfolgen? Und die Wurzel der Sache findet sich in mir.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist schwierig. Der letzte Satzteil kann – je nach Bewertung des Konsonantentextes und der alten Übersetzungen – auch sinngemäß verstanden werden als: „und die Wurzel der Sache findet sich in ihm“. „Verfolgen“ kann hier zudem den stärkeren Sinn „heftig bedrängen“ haben.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier am besten eine hypothetische Äußerung von Hiobs Gegnern ein; „Wenn“ passt zum folgenden Imperfekt und zum Zusammenhang.
- source_word: תֹאמְרוּ
  choice: ihr sagt
  rationale: Das Qal-Imperfekt der 2. Person Plural erhält im Bedingungssatz natürlich präsentisch-hypothetischen Sinn.
- source_word: מַה
  choice: Wie
  rationale: 'מַה ist zusammen mit dem Verb adverbial-interrogativ zu verstehen: „Wie?“ beziehungsweise „auf welche Weise?“'
- source_word: נִּרְדָּף
  choice: wollen wir … verfolgen
  rationale: Das Qal-Imperfekt der 1. Person Plural von רדף bezeichnet „verfolgen, nachjagen“ und kann im Kontext feindselige Verfolgung einschließen. „Wollen wir“ gibt die erwägende Frage idiomatisch wieder.
- source_word: לוֹ
  choice: ihn
  rationale: ל markiert hier das Ziel beziehungsweise Objekt der Verfolgung; im Deutschen ist das direkte Objekt idiomatisch.
- source_word: וְשֹׁרֶשׁ
  choice: weil die Wurzel
  rationale: Die Konjunktion verbindet den zweiten Satzteil wahrscheinlich begründend mit dem ersten. Das Bild „Wurzel“ bleibt bewusst erhalten.
- source_word: דָּבָר
  choice: der Sache
  rationale: דָּבָר bezeichnet hier die fragliche Angelegenheit oder den Streitfall, nicht notwendig ein gesprochenes Wort.
- source_word: נִמְצָא
  choice: zu finden ist
  rationale: Die Nifal-Form hat passiv-resultative Bedeutung; die Formulierung bewahrt diese, ohne das schwierige Bild auszudeuten.
- source_word: בִי
  choice: in mir
  rationale: Der masoretische Konsonantentext mit Vokalisierung liest „in mir“. Diese schwierige Lesart wird im Haupttext bewahrt; die mögliche alternative Deutung wird in der Fußnote genannt.
theological_decisions:
- issue: Bezug der Schlussklausel
  choice: „in mir“ gemäß dem masoretischen Text
  alternative: „in ihm“ nach alternativer Textdeutung und unter Berücksichtigung alter Übersetzungen
  rationale: Die textliche und syntaktische Spannung darf nicht stillschweigend zugunsten einer eindeutigen Schuldzuweisung aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Metapher „Wurzel der Sache“ und die Ich-Form des masoretischen Textes bleiben erhalten; die textliche Alternative wird transparent in der Fußnote ausgewiesen.
