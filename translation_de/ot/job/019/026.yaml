base_translation:
  language: en
  yaml_path: translation/ot/job/019/026.yaml
  text: And after my skin has been destroyed[b][a], yet from my flesh I will see God.
translation:
  language: de
  text: Und nachdem meine Haut zerstört worden ist,[a] werde ich doch aus meinem Fleisch heraus Gott sehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung »nachdem meine Haut zerstört worden ist« ist im Hebräischen sprachlich schwierig. Wörtlichere Wiedergaben lauten etwa: »nachdem sie meine Haut abgeschlagen haben – dies« oder »nachdem sie meine Haut abgelöst haben«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »werde ich in meinem Fleisch Gott sehen«; auch möglich: »werde ich ohne mein Fleisch Gott sehen«. Die hebräische Wendung ist schwierig und wird unterschiedlich verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַחַר
  choice: Und nachdem
  rationale: Bewahrt die zeitliche Abfolge und die Verknüpfung mit dem vorhergehenden Vers in natürlichem Deutsch.
- source_word: עוֹרִי
  choice: meine Haut
  rationale: Die gewöhnliche Bedeutung von עוֹר ist »Haut« beziehungsweise »Fell«; im menschlichen Zusammenhang ist »meine Haut« angemessen und bewahrt Hiobs körperliche Bildsprache.
- source_word: נִקְּפוּ זֹאת
  choice: zerstört ist
  rationale: Die Wendung ist lexikalisch und syntaktisch schwierig. Die sinngemäße passive Wiedergabe bezeichnet die Zerstörung der Haut, ohne das unklare זֹאת durch ein künstliches »dies« abzubilden.
- source_word: וּ/מִ/בְּשָׂרִי
  choice: doch von meinem Fleisch aus
  rationale: מִן wird in seiner naheliegenden Bedeutung »von/aus« wiedergegeben; »doch« verdeutlicht den Gegensatz im Zusammenhang. Die Formulierung lässt die umstrittene Beziehung des Sprechers zu seinem Fleisch bewusst offen.
- source_word: אֶחֱזֶה
  choice: werde ich sehen
  rationale: חזה bedeutet »sehen, schauen«. »sehen« ist klar, gegenwärtig und würdevoll.
- source_word: אֱלוֹהַּ
  choice: Gott
  rationale: אֱלוֹהַּ ist die in Hiob häufige singularische Bezeichnung für Gott und wird unmittelbar mit »Gott« wiedergegeben.
theological_decisions:
- issue: Ob וּמִבְּשָׂרִי ausdrücklich eine leibliche Auferstehung bezeichnet
  choice: Die Hauptfassung lautet »von meinem Fleisch aus« und bewahrt damit die Spannung des Hebräischen.
  alternative: »in meinem Fleisch« oder »ohne mein Fleisch«
  rationale: Präposition und Syntax sind umstritten. »In meinem Fleisch« würde eine leibliche Deutung stärker festlegen, »ohne mein Fleisch« dagegen eine körperlose Schau. Der Ausgangstext entscheidet diese Frage nicht eindeutig.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. »Fleisch« bleibt wegen der konkreten Körperbildsprache erhalten; die etwas markierte Formulierung »von meinem Fleisch aus« bildet die echte Mehrdeutigkeit der hebräischen Präposition ab.
