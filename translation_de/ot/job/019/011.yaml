  text: וַ/יַּ֣חַר עָלַ֣/י אַפּ֑/וֹ וַ/יַּחְשְׁבֵ֖/נִי ל֣/וֹ כְ/צָרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/011.yaml
  text: His anger burns against me[a], and he counts me as his enemies.
translation:
  language: de
  text: Sein Zorn entbrannte gegen mich, und er rechnete mich zu seinen Feinden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחַר
  choice: entbrannte
  rationale: Das Verb חרה bildet mit אַף eine feste Wendung für aufflammenden oder entbrennenden Zorn. Das Präteritum entspricht der hebräischen Erzählform und bewahrt zugleich das Bild.
- source_word: עָלַי
  choice: gegen mich
  rationale: עַל bezeichnet hier die feindselige Ausrichtung des Zorns und wird im Deutschen idiomatisch mit „gegen mich“ wiedergegeben.
- source_word: אַפּוֹ
  choice: sein Zorn
  rationale: אַף bedeutet wörtlich „Nase“, bezeichnet in dieser Wendung aber den Zorn. „Zorn“ wahrt die Intensität und passt zum Verb „entbrannte“.
- source_word: וַיַּחְשְׁבֵנִי
  choice: er rechnete mich
  rationale: חשב bedeutet hier, jemanden als etwas anzusehen oder einer Gruppe zuzurechnen. In Verbindung mit dem pluralischen Ausdruck כְצָרָיו ist „zu seinen Feinden rechnen“ natürlich und präzise.
- source_word: לוֹ
  choice: seinen
  rationale: Der Dativ des Bezugs wird im Deutschen am natürlichsten durch das Possessivpronomen in „seinen Feinden“ ausgedrückt.
- source_word: כְצָרָיו
  choice: zu seinen Feinden
  rationale: צָר bezeichnet einen Feind oder Widersacher. Der Plural und das Suffix der dritten Person Singular bleiben ausdrücklich erhalten.
theological_decisions:
- issue: Bezug des Subjekts und der Suffixe in der dritten Person Singular
  choice: Das Subjekt bleibt Gott; Hiob klagt, dass Gott gegen ihn handelt.
  alternative: Ein nicht näher bezeichneter feindlicher Akteur
  rationale: Im Zusammenhang von Hiob 19,6–12 schreibt Hiob diese Handlungen Gott zu. Die Übersetzung bewahrt diese theologische Spannung, ohne sie abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und die starke Aussage des Hebräischen bleiben erhalten; keine Fußnote ist nötig, da die gewählte Wiedergabe die wesentlichen lexikalischen Nuancen unmittelbar ausdrückt.
