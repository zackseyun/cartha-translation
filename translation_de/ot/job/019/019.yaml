  text: תִּֽ֭עֲבוּ/נִי כָּל מְתֵ֣י סוֹדִ֑/י וְ/זֶֽה אָ֝הַ֗בְתִּי נֶהְפְּכוּ בִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/019.yaml
  text: All my intimate friends abhor me[a], and those whom I loved have turned against me.
translation:
  language: de
  text: Alle meine Vertrauten verabscheuen mich,[a] und jene, die ich liebte, haben sich gegen mich gewandt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle Männer meines vertraulichen Kreises“ oder „alle Menschen meiner geheimen Beratung“. Gemeint sind Ijobs Vertraute und enge Gefährten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: verabscheuen mich
  rationale: Das Verb תעב bezeichnet starke Abneigung oder Abscheu; „verabscheuen“ bewahrt diese Intensität in natürlichem modernem Deutsch.
- source_word: כָּל
  choice: alle
  rationale: Der umfassende Quantor wird im Deutschen am natürlichsten mit „alle“ wiedergegeben.
- source_word: מְתֵי סוֹדִי
  choice: meine Vertrauten
  rationale: Die Wendung bezeichnet wörtlich die Männer beziehungsweise Menschen aus Ijobs vertraulichem Rat oder engstem Kreis. „Meine Vertrauten“ vermittelt sowohl Nähe als auch Vertrauensstellung.
- source_word: וְזֶה
  choice: und die
  rationale: Obwohl זֶה formal Singular ist, weist das folgende Verb im Plural auf einen kollektiven Bezug. „Und die“ gibt diesen Bezug idiomatisch wieder, ohne einen künstlichen Singular zu erzwingen.
- source_word: אָהַבְתִּי
  choice: ich liebte
  rationale: Die Qatal-Form bezeichnet hier passend Ijobs bisherige beziehungsweise frühere Zuneigung; das deutsche Präteritum fügt sich natürlich in die Klage ein.
- source_word: נֶהְפְּכוּ
  choice: haben sich gewandt
  rationale: Der Niphal von הפך drückt eine Umkehr oder einen Wechsel der Haltung aus. „Haben sich gewandt“ bewahrt das Bild der veränderten Ausrichtung.
- source_word: בִי
  choice: gegen mich
  rationale: Im feindseligen Kontext hat die Präposition adversative Bedeutung; „gegen mich“ gibt sie im Deutschen klar und idiomatisch wieder.
