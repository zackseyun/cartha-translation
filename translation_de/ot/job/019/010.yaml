  text: יִתְּצֵ֣/נִי סָ֭בִיב וָ/אֵלַ֑ךְ וַ/יַּסַּ֥ע כָּ֝/עֵ֗ץ תִּקְוָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/010.yaml
  text: He tears me down on every side[a], and I am gone; he has uprooted my hope like a tree.
translation:
  language: de
  text: Er reißt mich ringsum nieder, und ich vergehe[a]; er hat meine Hoffnung wie einen Baum entwurzelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und ich gehe“; möglicherweise auch: „und ich bin dahin“. Die Wendung kann hier das Vergehen oder Zugrundegehen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּצֵנִי
  choice: Er reißt mich … nieder
  rationale: Das Verb נתץ bezeichnet das Niederreißen oder Zerstören. „Niederreißen“ bewahrt die starke Bildsprache und gibt das ausdrückliche Objektsuffix „mich“ wieder.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb bezeichnet eine umfassende Einwirkung von allen Seiten; „ringsum“ ist knapp, natürlich und würdevoll.
- source_word: וָאֵלַךְ
  choice: sodass ich vergehe
  rationale: 'Wörtlich steht „und ich gehe“. Im Zusammenhang bezeichnet die Wendung wahrscheinlich die Folge des Niederreißens: Hiob ist dem Untergang preisgegeben. „Sodass“ macht diesen Folgesinn deutlich, während „vergehe“ die mögliche Bedeutung des Untergangs wiedergibt.'
- source_word: וַיַּסַּע
  choice: hat er … entwurzelt
  rationale: נסע kann das Herausziehen oder Entfernen von etwas Festem bezeichnen. In Verbindung mit dem Vergleich eines Baumes setzt „entwurzelt“ das Bild im Deutschen treffend fort.
- source_word: כָּעֵץ
  choice: wie einen Baum
  rationale: Die einfache Vergleichsformulierung bleibt direkt erhalten. Der Akkusativ ergibt sich im Deutschen aus dem gewählten Verb und stellt die Hoffnung bildlich einem entwurzelten Baum gleich.
- source_word: תִּקְוָתִי
  choice: meine Hoffnung
  rationale: תקוה bedeutet hier natürlich „Hoffnung“ und bezeichnet das, worauf Hiob noch vertraute oder wartete.
theological_decisions: []
