  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller poetischer Bildsprache. Die ungewöhnliche hebräische Wendung „und ich gehe“ wird im Haupttext sinngemäß wiedergegeben und in der Fußnote offengelegt.
