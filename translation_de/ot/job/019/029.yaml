  text: גּ֤וּרוּ לָ/כֶ֨ם מִ/פְּנֵי חֶ֗רֶב כִּֽי חֵ֭מָה עֲוֺנ֣וֹת חָ֑רֶב לְמַ֖עַן תֵּדְע֣וּ/ן ש/דין׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/019/029.yaml
  text: Be afraid of the sword yourselves[a], for wrath brings the punishments of the sword, so that you may know that there is judgment.
translation:
  language: de
  text: Fürchtet euch selbst vor dem Schwert, denn Zorn zieht die Strafen des Schwertes nach sich, damit ihr erkennt, dass es ein Gericht gibt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit ihr erkennt, dass der Allmächtige da ist“. Der hebräische Schlussausdruck ist schwierig und wird auch als „dass es Gerichte gibt“ oder „dass es einen Richter gibt“ verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּרוּ לָכֶם
  choice: Fürchtet euch selbst
  rationale: Der pluralische Imperativ von גור warnt eindringlich vor drohender Gefahr; לָכֶם hebt die Angesprochenen hervor. Die Formulierung ist natürlich und bewahrt den Nachdruck.
- source_word: מִפְּנֵי חֶרֶב
  choice: vor dem Schwert
  rationale: מִפְּנֵי bezeichnet hier das, wovor man sich fürchten soll. „Vor dem Schwert“ ist im Deutschen idiomatisch und erhält das konkrete Bild.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der Warnung ein.
- source_word: חֵמָה
  choice: Zorn
  rationale: Das Wort bezeichnet heftigen, entbrannten Zorn. „Zorn“ bewahrt sowohl die emotionale als auch die mögliche gerichtliche Dimension.
- source_word: עֲוֺנוֹת חָרֶב
  choice: die Strafen des Schwertes
  rationale: עָוֹן kann Schuld, Vergehen oder deren strafende Folge bezeichnen. Im Zusammenhang mit Schwert und Gericht ist die Konsequenz der Schuld gemeint; die knappe Genitivfügung erhält zugleich die Dichte des Hebräischen.
- source_word: לְמַעַן תֵּדְעוּן
  choice: damit ihr erkennt
  rationale: לְמַעַן drückt einen Zweck aus; der Imperfekt bezeichnet das beabsichtigte Erkennen. „Erkennt“ klingt hier würdevoll und nicht bloß intellektuell.
- source_word: שדין
  choice: dass es ein Gericht gibt
  rationale: Die schwierige Schlussform wird im unmittelbaren Kontext am plausibelsten auf das Bestehen von Gericht bezogen. Wegen der sprachlichen Unsicherheit werden andere überlieferte Deutungen in der Fußnote genannt.
theological_decisions:
- issue: Deutung des schwierigen Schlussausdrucks שדין
  choice: dass es ein Gericht gibt
  alternative: dass der Allmächtige da ist; dass es Gerichte gibt; dass es einen Richter gibt
  rationale: Die Warnung vor vergeltender Gerechtigkeit stützt die Deutung „Gericht“, doch der hebräische Ausdruck ist ungewöhnlich und mehrdeutig. Die Hauptfassung legt den Kontext zugrunde, ohne die bedeutsamen Alternativen zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Warnung bleibt direkt und eindringlich; das zweimalige Schwertmotiv sowie die schwierige gerichtliche Aussage am Versende werden bewahrt.
