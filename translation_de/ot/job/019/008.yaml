source:
  edition: WLC
  text: אָרְחִ֣/י גָ֭דַר וְ/לֹ֣א אֶעֱב֑וֹר וְ/עַ֥ל נְ֝תִיבוֹתַ֗/י חֹ֣שֶׁךְ יָשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/008.yaml
  text: He has walled up my way so that I cannot pass[a], and he has set darkness upon my paths.
translation:
  language: de
  text: Er hat meinen Weg zugemauert, sodass ich nicht hindurchkomme[a], und auf meine Pfade legt er Finsternis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Subjekt wird im Hebräischen nicht ausdrücklich genannt, ist aber an den Verbformen erkennbar. Aus dem Zusammenhang geht hervor, dass Hiob von Gott spricht; im Vers selbst steht jedoch kein ausdrückliches „er“.
    reason: alternative_reading
lexical_decisions:
- source_word: אָרְחִי
  choice: meinen Weg
  rationale: Das Substantiv bezeichnet einen Weg, Pfad oder Lebensweg. „Meinen Weg“ ist im Deutschen natürlich und bewahrt sowohl die konkrete als auch die übertragene Bedeutung.
- source_word: גָדַר
  choice: hat … zugemauert
  rationale: Das Verb beschreibt das Absperren durch eine Mauer oder Einfriedung. „Zugemauert“ erhält das kräftige, konkrete Bild der unüberwindbaren Blockade.
- source_word: וְלֹא אֶעֱבוֹר
  choice: sodass ich nicht hindurchkomme
  rationale: Die Wendung gibt die Folge der Absperrung idiomatisch wieder. „Hindurchkomme“ entspricht dem Durch- oder Vorübergehen und passt zum Bild eines versperrten Weges.
- source_word: נְתִיבוֹתַי
  choice: meine Pfade
  rationale: Der Plural bleibt erhalten; „Pfade“ gibt die poetische Vorstellung von Hiobs verschiedenen Lebenswegen knapp und würdig wieder.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: „Finsternis“ ist eine direkte, poetisch angemessene Wiedergabe und wahrt die mögliche konkrete wie metaphorische Bedeutung.
- source_word: יָשִׂים
  choice: legt
  rationale: Der hebräische Imperfekt steht parallel zum vorangehenden Perfekt, kann aber die fortwirkende bzw. anschaulich gegenwärtige Handlung hervorheben. Das Präsens „legt“ bewahrt diese Aspektspannung, statt beide Verbformen unterschiedslos als abgeschlossen wiederzugeben.
- source_word: וְעַל נְתִיבוֹתַי חֹשֶׁךְ יָשִׂים
  choice: und auf meine Pfade legt er Finsternis
  rationale: Die Wortstellung erhält das konkrete poetische Bild, dass Finsternis auf Hiobs Wege gelegt wird, statt es interpretierend zu „verdunkelt“ zu verdichten.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts in der dritten Person
  choice: er
  alternative: Gott
  rationale: Im Hebräischen ist das maskuline Subjekt nur durch die Verbformen angezeigt und nicht ausdrücklich benannt. Der Zusammenhang bezieht es auf Gott; „er“ bewahrt jedoch die Ausdrucksweise und vermeidet eine explizite Ergänzung im Haupttext.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-poetischem Klang. Die konkreten Bilder des Zumauerns und der auf die Pfade gelegten Finsternis bleiben erhalten; die wechselnde hebräische Verbperspektive wird nicht eingeebnet.
