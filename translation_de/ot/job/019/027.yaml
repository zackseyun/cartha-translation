  text: whom I myself will see for myself[a], and my eyes will see, and not another[b]. My kidneys fail within my bosom.
translation:
  language: de
  text: den ich selbst für mich sehen werde[a], den meine Augen sehen werden – nicht ein Fremder[b]. Meine Nieren verzehren sich in meiner Brust[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den ich selbst als den Meinen sehen werde« beziehungsweise »den ich selbst auf meiner Seite sehen werde«. Das hebräische »für mich« ist knapp und mehrdeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: »nicht ein anderer«.'
    reason: lexical_alternative
  - marker: c
    text: Hebräisch »Nieren«, ein Bild für das Innerste oder tiefe Empfindungen.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: den
  rationale: Das Relativpronomen bezieht sich auf den persönlichen »Erlöser« im vorherigen Vers und fungiert hier als Objekt von »sehen«.
- source_word: אֲנִי
  choice: ich selbst
  rationale: Das ausdrücklich gesetzte Personalpronomen betont das Subjekt über die bereits im Verb enthaltene Person hinaus.
- source_word: אֶחֱזֶה
  choice: sehen werde
  rationale: חזה bezeichnet ein Sehen oder Schauen, möglicherweise mit gesteigerter Intensität; »sehen« ist hier klar und lässt die genaue Art der Schau offen.
- source_word: לִּי
  choice: für mich
  rationale: Der schwierige Dativ wird möglichst unmittelbar wiedergegeben, ohne ihn einseitig als »auf meiner Seite« zu deuten.
- source_word: וְעֵינַי רָאוּ
  choice: meine eigenen Augen werden ihn sehen
  rationale: Das Qatal wird im poetischen Parallelismus zum vorhergehenden Imperfekt futurisch verstanden. »Eigene« macht die im Parallelismus liegende persönliche Betonung im Deutschen natürlich hörbar; »ihn« ergänzt das aus dem Kontext eindeutige Objekt.
- source_word: וְלֹא זָר
  choice: kein Fremder
  rationale: זָר bedeutet wörtlich »Fremder«; diese Wiedergabe bewahrt die genuine Mehrdeutigkeit gegenüber dem kontextuell möglichen Sinn »kein anderer«.
- source_word: כָּלוּ
  choice: verzehren sich
  rationale: כלה kann hier das Aufgerieben- oder Aufgezehrtwerden durch heftiges Verlangen ausdrücken; das Präsens gibt den hebräischen Perfektzustand als gegenwärtige innere Erschöpfung wieder.
- source_word: כִלְיֹתַי
  choice: meine Nieren
  rationale: Die konkrete hebräische Metapher für das Innerste und den Sitz tiefer Empfindungen bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
- source_word: בְּחֵקִי
  choice: in meiner Brust
  rationale: חֵיק bezeichnet Brust, Schoß oder Busen; »in meiner Brust« bewahrt das Körperbild und klingt im modernen Deutschen natürlich und würdig.
theological_decisions:
- issue: Art der von Hiob erwarteten Schau
  choice: Als persönliche zukünftige Schau des im vorherigen Vers Genannten formuliert, ohne ihren Zeitpunkt oder ihre leibliche beziehungsweise geistige Art festzulegen.
  alternative: Ausdrückliche Deutung als leibliche Auferstehung, als Rechtfertigung noch zu Lebzeiten oder als Gottesschau nach dem Tod.
  rationale: Der Vers betont stark, dass Hiob selbst sehen wird, entscheidet für sich allein aber nicht zwischen den weitergehenden theologischen Deutungen.
- issue: Bedeutung von וְלֹא זָר
  choice: »kein Fremder« im Haupttext, mit »kein anderer« als Fußnotenalternative.
  alternative: »kein anderer« als eindeutige Festlegung darauf, dass niemand stellvertretend für Hiob sieht.
  rationale: Die wörtliche Bedeutung »Fremder« und der kontextuelle Sinn »anderer« sind beide möglich; Haupttext und Fußnote bewahren diese Spannung.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrten hebräischen Körperbildern. Die Satzstellung hält die emphatische Ich-Betonung und den poetischen Parallelismus fest. Sämtliche Fußnotenmarker stehen unmittelbar an der einschlägigen Stelle im Haupttext.
