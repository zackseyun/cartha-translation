  source_fidelity: Die Übersetzung gibt die Klagefrage עַד־אָנָה treffend als „Wie lange noch“ wieder. „Mich quälen“ ist eine idiomatische und kontextuell angemessene Wiedergabe von תּוֹגְיוּן נַפְשִׁי, wobei „mich“ die hier personenbezogene Bedeutung von נֶפֶשׁ natürlich ausdrückt. „Mich mit Worten zermalmen“ bewahrt sowohl das instrumentale בְּ als auch die starke Bildlichkeit von דכא.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und wahrt zugleich den nachdrücklichen, klagenden Ton Hiobs. Die Wiederholung von „mich“ trägt die hebräische Parallelität gut.
