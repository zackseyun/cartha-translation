  text: How long will you torment me and crush me with words?[a]
translation:
  language: de
  text: Wie lange noch wollt ihr mich quälen und mich mit Worten zermalmen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie lange noch wollt ihr meine Seele betrüben und mich mit Worten zermalmen?«'
    reason: 'Lexikalische Alternative: תּוֹגְיוּן kann auch »betrüben« bedeuten, und נַפְשִׁי lässt sich wörtlicher mit »meine Seele« wiedergeben.'
lexical_decisions:
- source_word: עַד אָנָה
  choice: Wie lange noch
  rationale: Die idiomatische deutsche Klageformel bewahrt die rhetorische Dringlichkeit; »noch« verdeutlicht das bereits andauernde Verhalten, ohne den Sinn zu erweitern.
- source_word: תּוֹגְיוּן
  choice: wollt ihr … quälen
  rationale: Das Hifil von יגה bezeichnet hier das Zufügen inneren Leids. »Quälen« gibt die anhaltende seelische Bedrängnis im Zusammenhang treffend und kräftig wieder.
- source_word: נַפְשִׁי
  choice: mich
  rationale: נֶפֶשׁ bezeichnet hier Hiob als Person beziehungsweise sein inneres Selbst. Das deutsche Pronomen vermeidet eine ungewollt dualistische Auffassung von »Seele« und klingt natürlich.
- source_word: וּתְדַכְּאוּנַנִי
  choice: und mich … zermalmen
  rationale: Das Verb דכא vermittelt das Bild des Zerdrückens oder Zermalmens. Die Formulierung erhält die starke metaphorische Gewalt der Anklage.
- source_word: בְמִלִּים
  choice: mit Worten
  rationale: Die Präposition בְּ bezeichnet hier das Mittel; »mit Worten« ist die natürliche deutsche Wiedergabe.
