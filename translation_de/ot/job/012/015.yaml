  text: הֵ֤ן יַעְצֹ֣ר בַּ/מַּ֣יִם וְ/יִבָ֑שׁוּ וִֽ֝/ישַׁלְּחֵ֗/ם וְ/יַ֖הַפְכוּ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/015.yaml
  text: Look[a], if he holds back the waters, they dry up; if he sends them out, they overturn the earth.
translation:
  language: de
  text: 'Sieh: Hält er die Wasser zurück, trocknen sie aus; lässt er sie los, wühlen sie die Erde[a] um.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land“. Das hebräische Wort אֶרֶץ kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel leitet eine nachdrückliche, anschauliche Feststellung ein. „Sieh“ bewahrt diesen Impuls in würdigem, modernem Deutsch.
- source_word: יַעְצֹר בַּמַּיִם
  choice: hält er die Wasser zurück
  rationale: עצר bezeichnet hier das Zurückhalten oder Hemmen der Wasser. Die deutsche Wendung gibt Gottes wirksame Kontrolle klar und idiomatisch wieder.
- source_word: וְיִבָשׁוּ
  choice: trocknen sie aus
  rationale: Das pluralische Verb wird auf die zuvor genannten Wasser bezogen. Die Formulierung bewahrt den knappen hebräischen Ausdruck, obwohl das Bild sachlich auch die vom Wasser abhängigen Gebiete mit umfasst.
- source_word: וִישַׁלְּחֵם
  choice: lässt er sie los
  rationale: Das Suffix verweist am natürlichsten auf die Wasser. „Loslassen“ drückt ihre Freigabe aus und passt zum Gegensatz des Zurückhaltens.
- source_word: וְיַהַפְכוּ
  choice: wühlen sie … um
  rationale: הפך beschreibt ein Umkehren oder Umstürzen. Bei entfesselten Wassern vermittelt „umwühlen“ die zerstörerische Umgestaltung anschaulich, ohne das Bild auf ein bestimmtes Flutereignis festzulegen.
- source_word: אָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im Zusammenhang der umfassenden göttlichen Macht über die Wasser passt „Erde“ gut; die engere Möglichkeit bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Reichweite von אֶרֶץ in der weisheitlich-poetischen Aussage über Gottes Herrschaft
  choice: die Erde
  alternative: das Land
  rationale: Der Vers schildert Gottes Macht in weitreichenden Bildern. „Die Erde“ bewahrt den kosmischen Klang, ohne auf eine bestimmte Fluterzählung festgelegt zu werden; „das Land“ bleibt lexikalisch möglich.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch mit poetischem Parallelismus. Der Doppelpunkt nach „Sieh“ markiert die nachfolgende anschauliche Aussage; die beiden konditional wirkenden Satzhälften sind syntaktisch parallel gestaltet.
