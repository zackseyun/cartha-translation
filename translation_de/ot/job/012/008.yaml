  text: Or speak to the earth[a], and it will teach you[b]; and the fish of the sea will tell you.
translation:
  language: de
  text: Oder sprich zur Erde[a], und sie wird dich lehren[b]; und die Fische des Meeres werden es dir erzählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Land“. Das hebräische Wort אֶרֶץ kann sowohl „Erde“ als auch „Land“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht das Verb in der weiblichen Einzahl, entsprechend dem grammatischen Geschlecht von „Erde“.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֤וֹ
  choice: Oder
  rationale: Die disjunktive Partikel führt die Reihe der Aufforderungen aus dem Kontext fort; „Oder“ ist im Deutschen natürlich und formnah.
- source_word: שִׂ֣יחַ
  choice: sprich
  rationale: Mit לָאָרֶץ bezeichnet das Verb hier das Reden zu beziehungsweise Ansprechen der Erde und steht parallel zum Fragen der Tiere und Vögel.
- source_word: לָ/אָ֣רֶץ
  choice: zur Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Die umfassende Reihe von Landtieren, Vögeln und Meeresfischen legt hier „Erde“ nahe, ohne die Alternative zu verschweigen.
- source_word: וְ/תֹרֶ֑/ךָּ
  choice: und sie wird dich lehren
  rationale: Das Hifil von ירה bedeutet gewöhnlich „lehren/unterweisen“. Das feminine Pronomen „sie“ entspricht dem grammatischen Geschlecht von „Erde“ im Hebräischen und erhält die Personifikation auch im Deutschen.
- source_word: וִֽ/יסַפְּר֥וּ לְ֝/ךָ֗
  choice: auch … werden es dir erzählen
  rationale: ספר im Piel kann „erzählen, berichten, kundtun“ bedeuten. „Erzählen“ ist poetisch und verständlich; „auch“ gibt das verbindende ו idiomatisch wieder, und „es“ macht im Deutschen den vorausgesetzten Inhalt natürlich deutlich.
- source_word: דְּגֵ֣י הַ/יָּֽם
  choice: die Fische des Meeres
  rationale: Die Genitivfügung bewahrt Bild und poetischen Klang des hebräischen Ausdrucks.
theological_decisions: []
