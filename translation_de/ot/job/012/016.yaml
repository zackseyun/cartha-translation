  terminology: „Einsicht“ gibt die praktische, tragfähige Weisheit von תּוּשִׁיָּה gut wieder. „Irrender“ und „Irreführender“ bewahren den Unterschied zwischen dem intransitiven Qal und dem kausativen Hiphil, ohne Gott als unmittelbaren Urheber von Irrtum zu deuten.
