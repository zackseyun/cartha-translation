  text: עִ֭מּ/וֹ עֹ֣ז וְ/תֽוּשִׁיָּ֑ה ל֝֗/וֹ שֹׁגֵ֥ג וּ/מַשְׁגֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/016.yaml
  text: With him are strength and sound wisdom[a]; the one who goes astray and the one who leads astray belong to him.
translation:
  language: de
  text: Bei ihm sind Kraft und Einsicht; ihm gehören der Irrende und der Irreführende.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Getäuschte und der Täuscher“. Das erste hebräische Partizip kann im Zusammenhang auch passiv verstanden werden; der Haupttext bewahrt jedoch den formalen Gegensatz zwischen dem, der irrt, und dem, der andere irren lässt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: Bei ihm
  rationale: Die Präposition mit Suffix bezeichnet hier Zugehörigkeit beziehungsweise Verfügbarkeit. „Bei ihm“ bewahrt die hebräische Ausdrucksweise und passt zum Parallelismus.
- source_word: עֹז
  choice: Kraft
  rationale: עֹז bezeichnet Stärke oder Macht; „Kraft“ ist im Deutschen natürlich und würdevoll.
- source_word: תּוּשִׁיָּה
  choice: verlässliche Weisheit
  rationale: Das Wort bezeichnet besonders in der Weisheitsliteratur wirksame, tragfähige Einsicht. „Verlässliche Weisheit“ gibt diese Nuance wieder, ohne den Sinn auf bloßen Erfolg einzuengen.
- source_word: לוֹ
  choice: ihm gehören
  rationale: ל mit Pronominalsuffix drückt hier Besitz oder Zuordnung aus. Die Formulierung wahrt die starke Aussage über Gottes Herrschaft, ohne eine moralische Verursachung zu behaupten.
- source_word: שֹׁגֵג
  choice: der Irrende
  rationale: Das Qal-Partizip bezeichnet jemanden, der irrt oder vom Weg abkommt. „Der Irrende“ erhält den intransitiven Sinn knapp und parallel.
- source_word: מַשְׁגֶּה
  choice: der, der in die Irre führt
  rationale: Das Hiphil-Partizip bezeichnet jemanden, der einen anderen irren lässt. Die Formulierung bewahrt gegenüber שֹׁגֵג den kausativen Gegensatz.
theological_decisions:
- issue: Gottes Verhältnis zum Irrenden und zu dem, der in die Irre führt
  choice: Beide gehören ihm beziehungsweise stehen unter seiner Herrschaft, ohne dass die Art der Beziehung näher bestimmt wird.
  alternative: Gott kennt beide; Gott lenkt beide in seiner Vorsehung; Gott verursacht Irrtum und Irreführung unmittelbar.
  rationale: Der hebräische Text ordnet beide Gott zu, erklärt aber nicht, dass Gott ihr moralisches Handeln unmittelbar verursacht. „Ihm gehören“ erhält die theologische Spannung, ohne sie auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; „der Irrende“ ist bewusst leicht gehoben, aber allgemein verständlich.
