  yaml_path: translation/ot/job/012/005.yaml
  text: A torch is despised in the thought of one who is at ease; it is ready for those whose foot slips.
translation:
  language: de
  text: Eine Fackel gilt im Denken des Sorglosen als verachtenswert; sie steht bereit für die, deren Fuß wankt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut dieses Verses ist schwierig. Möglich ist auch, לַפִּיד bildlich als „Unheil“ zu verstehen: „Im Denken des Sorglosen gilt Unheil als verachtenswert; es steht bereit für die, deren Fuß wankt.“'
    reason: Die Bedeutung von לַפִּיד, die Funktion des seltenen עַשְׁתּוּת und die Satzbezüge sind umstritten. Die Anmerkung bewahrt eine wesentliche alternative Auslegung, ohne die Hauptfassung zu überladen.
lexical_decisions:
- source_word: לַפִּיד
  choice: Fackel
  rationale: Die übliche Bedeutung des Substantivs ist „Fackel“. Im poetischen Bild bezeichnet es wohl etwas, das erst in drohender Not als nötig erkannt wird.
- source_word: עַשְׁתּוּת
  choice: lebt
  rationale: Das seltene Wort ist textlich und lexikalisch schwierig. Im Zusammenhang mit שַׁאֲנָן wird die im WLC vokalisierte Auffassung als „Gedanke“ nicht ausdrücklich wiedergegeben; die Wendung wird natürlich als Beschreibung des sorglosen Menschen formuliert.
- source_word: שַׁאֲנָן
  choice: sorglos
  rationale: Das Wort bezeichnet jemanden, der sicher und ungestört lebt; „sorglos“ bewahrt hier den Kontrast zur drohenden Unsicherheit.
- source_word: נָכוֹן
  choice: steht bereit
  rationale: Gibt den Gedanken von „bereit/feststehend“ wieder, ohne das Subjekt gegenüber dem knappen hebräischen Satz unnötig zu präzisieren.
- source_word: מוֹעֲדֵי רָגֶל
  choice: dessen Fuß wankt
  rationale: Die seltene Konstruktion wird kontextgemäß auf das Straucheln beziehungsweise Wanken des Fußes bezogen; der Singular „Fuß“ entspricht רָגֶל.
theological_decisions:
- issue: Bezug und Sinn des Fackelbildes
  choice: Die Fackel wird vom Sorglosen verachtet, steht aber für den Wankenden bereit.
  alternative: Der Wankende selbst wird als verachtete Fackel oder als verachtetes Unglück verstanden.
  rationale: Die poetische Syntax ist schwierig. Die gewählte Fassung folgt der masoretischen Wortfolge und der überlieferten Deutung, ohne eine besondere lehrmäßige Aussage in das Bild einzutragen.
translation_notes:
  register: Knappes, würdiges poetisches Deutsch. Die Umstellung gegenüber der hebräischen Wortfolge schafft einen verständlichen Kontrast, während die Fußnote die echte textliche und lexikalische Unsicherheit sichtbar hält.
