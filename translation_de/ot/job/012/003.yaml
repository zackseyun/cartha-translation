source:
  edition: WLC
  text: גַּם לִ֤/י לֵבָ֨ב כְּֽמוֹ/כֶ֗ם לֹא נֹפֵ֣ל אָנֹכִ֣י מִ/כֶּ֑ם וְ/אֶת מִי אֵ֥ין כְּמוֹ אֵֽלֶּה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/003.yaml
  text: I too have a mind like you; I am not inferior to you[a]. And who does not know such things as these?
translation:
  language: de
  text: Auch ich habe Verstand[a] wie ihr; ich stehe euch nicht nach. Und wer kennt solche Dinge nicht?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Auch ich habe ein Herz wie ihr.“ Das Herz bezeichnet hier den Verstand, also die Fähigkeit zu denken und zu verstehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut ist elliptisch; wörtlicher etwa: „Und bei wem gibt es nicht dergleichen?“'
    reason: textual_ambiguity
lexical_decisions:
- source_word: גַּם לִי לֵבָב
  choice: Auch ich habe Verstand
  rationale: לֵבָב bedeutet wörtlich „Herz“, bezeichnet hier aber das Denk- und Erkenntnisvermögen. „Verstand“ gibt Hiobs Anspruch auf geistige Ebenbürtigkeit im modernen Deutschen klar wieder; „Auch“ bewahrt die hinzufügende und leicht nachdrückliche Kraft von גַּם.
- source_word: כְּמוֹכֶם
  choice: wie ihr
  rationale: Die knappe Vergleichsformulierung entspricht dem Hebräischen und ist im Deutschen natürlich.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: ich stehe euch nicht nach
  rationale: Die Verbindung von נפל mit מן drückt aus, dass jemand einem anderen nicht unterlegen ist. Die deutsche Wendung ist idiomatisch und bewahrt das anschauliche Vergleichsgefälle besser als das formellere „ich bin euch nicht unterlegen“.
- source_word: וְאֶת מִי אֵין כְּמוֹ אֵלֶּה
  choice: Und wer kennt solche Dinge nicht?
  rationale: Der hebräische Satz ist elliptisch und wörtlich schwer verständlich. Im Zusammenhang weist Hiob die Aussagen seiner Freunde als allgemein bekannt zurück. „kennt“ bringt diese rhetorische Aussage natürlich zum Ausdruck, während eine Fußnote die formale Mehrdeutigkeit offenlegt.
theological_decisions:
- issue: Hiobs Einschätzung der Aussagen seiner Freunde
  choice: Die Schlussfrage wird als Hinweis auf allgemein bekannte Gedanken wiedergegeben.
  alternative: „Und bei wem gibt es nicht dergleichen?“
  rationale: Der Kontext stützt die Bedeutung, dass die vorgetragenen Einsichten nichts Besonderes sind. Da der hebräische Wortlaut elliptisch bleibt, wird die wörtlichere Möglichkeit in einer Fußnote bewahrt, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung „jemandem nicht nachstehen“ erhält Hiobs selbstbewussten Ton; die rhetorische Schlussfrage bleibt knapp. Die beiden Fußnoten sichern die konkrete hebräische Herz-Metapher und die echte Unschärfe des letzten Satzteils.
