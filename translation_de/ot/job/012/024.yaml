source:
  edition: WLC
  text: מֵסִ֗יר לֵ֭ב רָאשֵׁ֣י עַם הָ/אָ֑רֶץ וַ֝/יַּתְעֵ֗/ם בְּ/תֹ֣הוּ לֹא דָֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/024.yaml
  text: He removes understanding from the heads of the people of the land[c][b][a], and makes them wander in a trackless waste.
translation:
  language: de
  text: Er nimmt den Führern des Volkes im Land den Verstand[a] und führt sie in wegloser Öde in die Irre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er entfernt das Herz der Häupter des Volkes im Land/auf der Erde.“ „Herz“ bezeichnet hier Verstand oder Urteilsvermögen; „Häupter“ meint die Führenden. Statt „im Land“ ist auch „auf der Erde“ möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in einer Öde, kein Weg“ — also in einer Einöde ohne Weg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר לֵב
  choice: nimmt … den Verstand
  rationale: מֵסִיר bezeichnet das Wegnehmen oder Entziehen; לֵב bedeutet wörtlich „Herz“, steht hier aber für Verstand und Urteilsvermögen. Die deutsche Konstruktion gibt beides natürlich wieder.
- source_word: רָאשֵׁי עַם הָאָרֶץ
  choice: den Obersten des Volkes im Land
  rationale: רָאשֵׁי („Häupter“) bezeichnet idiomatisch die führenden Personen. הָאָרֶץ kann „Land“ oder „Erde“ heißen; im politischen Zusammenhang liegt „Land“ nahe, ohne die Alternative auszuschließen.
- source_word: וַיַּתְעֵם
  choice: und lässt sie … umherirren
  rationale: Die Kausativform von תעה drückt aus, dass Gott sie in die Irre beziehungsweise orientierungslos umhergehen lässt.
- source_word: בְּתֹהוּ לֹא דָרֶךְ
  choice: in wegloser Öde
  rationale: תֹהוּ bezeichnet Leere, Verwüstung oder eine öde Einöde; לֹא דָרֶךְ heißt wörtlich „kein Weg“. „Weglose Öde“ bewahrt das räumliche Bild knapp und idiomatisch.
theological_decisions:
- issue: Das in den Verbformen vorausgesetzte Subjekt
  choice: „Er“ bezieht sich im Zusammenhang auf Gott.
  alternative: Das Subjekt in diesem Vers nicht ausdrücklich identifizieren.
  rationale: Der vorangehende Zusammenhang nennt Gott als den Handelnden. Das Pronomen bewahrt den Anschluss, ohne den Gottesnamen erklärend in den Vers einzufügen.
- issue: Art des göttlichen Handelns an den Führenden
  choice: Gott entzieht ihnen Urteilsvermögen und lässt sie orientierungslos umherirren.
  alternative: Die Aussage abschwächend als bloße Zulassung oder als selbstverschuldete Verirrung wiedergeben.
  rationale: Die hebräischen Verbformen schreiben Gott die Handlung unmittelbar beziehungsweise kausativ zu; diese theologische Spannung wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Oberste“ ist verständlicher als das wörtliche „Häupter“, während die Fußnote die Bildsprache und die Mehrdeutigkeit von אֶרֶץ dokumentiert. Die kompakte Wendung „weglose Öde“ erhält den poetischen Parallelismus und das Wüstenbild.
