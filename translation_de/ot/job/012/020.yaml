source:
  edition: WLC
  text: מֵסִ֣יר שָׂ֭פָה לְ/נֶאֱמָנִ֑ים וְ/טַ֖עַם זְקֵנִ֣ים יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/020.yaml
  text: He removes speech from the trusted[b][a], and takes away discernment from the elders.
translation:
  language: de
  text: Er entzieht den Vertrauenswürdigen die Sprache[a] und nimmt den Ältesten die Urteilskraft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Lippe“; gemeint sein können die Fähigkeit zu sprechen oder die Beredsamkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Urteilsvermögen“, „die Einsicht“ beziehungsweise „den Verstand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: entzieht
  rationale: Das Hifil-Partizip bezeichnet hier ein Wegnehmen oder Berauben. „Entzieht“ verbindet sich im Deutschen natürlich mit „die Sprache“ und gibt den fortdauernd beschriebenen Handlungsvollzug knapp wieder.
- source_word: שָׂפָה
  choice: Sprache
  rationale: Wörtlich bedeutet das Wort „Lippe“, steht hier jedoch metonymisch für das Sprechen beziehungsweise die Fähigkeit, sich auszudrücken. „Sprache“ ist im Deutschen natürlich und wahrt das Bild indirekt.
- source_word: לְנֶאֱמָנִים
  choice: den Vertrauenswürdigen
  rationale: Das Wort kann treue, zuverlässige oder als verlässlich geltende Menschen bezeichnen. „Vertrauenswürdigen“ bewahrt diese Bedeutungsbreite, ohne eine spezifisch religiöse Treue hineinzulesen.
- source_word: טַעַם
  choice: Urteilskraft
  rationale: Neben der wörtlichen Bedeutung „Geschmack“ bezeichnet טַעַם bildlich Einsicht, Urteilsvermögen oder verständige Beurteilung. „Urteilskraft“ passt zum Erfahrungswissen der Ältesten.
- source_word: זְקֵנִים
  choice: den Ältesten
  rationale: Der Ausdruck bezeichnet ältere, erfahrene und häufig gesellschaftlich angesehene Menschen. „Älteste“ erhält sowohl den Alters- als auch den Statusaspekt.
- source_word: יִקָּח
  choice: nimmt … weg
  rationale: לקח bedeutet grundsätzlich „nehmen“; im Parallelismus ist das entziehende „wegnehmen“ gemeint. Die geteilte Verbform „nimmt … die Urteilskraft“ wird durch den Sinn des Entzugs getragen; die Formulierung gibt sie idiomatisch als „nimmt …“ wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der parallele Satzbau und die Aussage, dass selbst verlässliche und erfahrene Menschen ihrer Fähigkeiten beraubt werden, bleiben erhalten. „Älteste“ ist nicht auf ein bestimmtes religiöses Amt festgelegt.
