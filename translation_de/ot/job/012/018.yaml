  text: מוּסַ֣ר מְלָכִ֣ים פִּתֵּ֑חַ וַ/יֶּאְסֹ֥ר אֵ֝ז֗וֹר בְּ/מָתְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/018.yaml
  text: He loosens the bonds of kings and binds a belt around their waists[a][b].
translation:
  language: de
  text: 'Er löst die Fesseln der Könige[a]

    und bindet einen Gürtel um ihre Hüften[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Zucht der Könige«. Das hebräische Wort kann »Zucht/Disziplin« oder »Fessel/Band« bedeuten; »Fesseln« passt hier besonders gut zu »löst« und zum folgenden »bindet«.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild kann Erniedrigung oder Unterwerfung ausdrücken; es kann aber auch das Umgürten zur Bereitschaft zum Handeln meinen. Der knappe hebräische Ausdruck entscheidet die Bildbedeutung nicht näher.
    reason: cultural_note
lexical_decisions:
- source_word: מוּסַר
  choice: Fesseln
  rationale: Das Substantiv kann »Zucht/Disziplin« oder konkret »Fessel/Band« bedeuten. Zusammen mit פִּתֵּחַ (»lösen«) und als Gegenstück zum folgenden »bindet« liegt hier die konkrete Bedeutung nahe; »Fesseln« bewahrt zugleich die Bildsprache.
- source_word: פִּתֵּחַ
  choice: löst
  rationale: Das Verb bedeutet wörtlich »öffnen« und kann bei Bindungen »lösen« heißen. Diese Wiedergabe ist im Deutschen natürlich und erhält das körperliche Bild.
- source_word: מְלָכִים
  choice: Könige
  rationale: Dies ist die gewöhnliche und genaue Bedeutung; eine Verallgemeinerung zu »Herrschern« ist nicht nötig.
- source_word: וַיֶּאְסֹר
  choice: bindet
  rationale: Das Verb bedeutet »binden/festbinden«. »Bindet« bildet den beabsichtigten Gegensatz zu »löst« ab.
- source_word: אֵזוֹר
  choice: Gürtel
  rationale: Das Wort bezeichnet einen Gürtel oder eine Gurtung um den Leib. »Gürtel« ist eine klare, gegenwärtige und hinreichend neutrale Wiedergabe.
- source_word: בְּמָתְנֵיהֶם
  choice: um ihre Hüften
  rationale: מָתְנַיִם bezeichnet Hüften beziehungsweise Lenden. Die Präposition ist mit der Bindung idiomatisch als »um« wiedergegeben; »Hüften« vermeidet das altertümliche »Lenden«.
theological_decisions:
- issue: Deutung der Umkehrungsbildsprache
  choice: Die konkrete Gegenüberstellung »löst … bindet« bleibt stehen und stellt Gottes souveränen Umgang mit Königen dar, ohne die Art der Umkehr abschließend auszudeuten.
  alternative: Gott befreit Könige aus Fesseln und gürtet sie zum Handeln; oder er löst ihre Herrschaftsgewalt und unterwirft anschließend die Könige selbst.
  rationale: Der hebräische Text ist knapp und bildhaft. Eine ausdeutende Paraphrase würde die echte Mehrdeutigkeit zwischen Befreiung, Entmachtung und Erniedrigung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verben »löst« und »bindet« sowie die konkrete Bildsprache des Hebräischen werden bewahrt. Der Zeilenumbruch macht den poetischen Parallelismus sichtbar.
