source:
  edition: WLC
  text: עִ֭מּ/וֹ חָכְמָ֣ה וּ/גְבוּרָ֑ה ל֝֗/וֹ עֵצָ֥ה וּ/תְבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/013.yaml
  text: With him are wisdom and might[a]; to him belong counsel and understanding.
translation:
  language: de
  text: Bei ihm sind Weisheit und Macht; ihm gehören Rat und Einsicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִמּוֹ
  choice: Bei ihm
  rationale: עִם mit Pronominalsuffix bedeutet am natürlichsten „bei/mit ihm“. Im Deutschen drückt „bei ihm sind“ in der poetischen Nominalkonstruktion Zugehörigkeit und Vorhandensein aus, ohne das Hebräische zu „in ihm“ umzudeuten.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und kontextuell passende Wiedergabe für חָכְמָה; gemeint ist umfassende weise Einsicht.
- source_word: וּגְבוּרָה
  choice: und Macht
  rationale: גְבוּרָה bezeichnet Stärke, Macht oder Kraft. „Macht“ passt zum Kontext göttlicher Souveränität und bildet mit „Weisheit“ ein natürliches Begriffspaar.
- source_word: לוֹ
  choice: ihm gehören
  rationale: ל mit Suffix bezeichnet hier in einem verblosen Satz Besitz oder Zugehörigkeit. „Ihm gehören“ gibt diese Funktion idiomatisch und deutlich wieder.
- source_word: עֵצָה
  choice: Rat
  rationale: עֵצָה kann Rat, Beratung oder Plan bezeichnen. „Rat“ bewahrt die knappe poetische Form und umfasst hier überlegtes Planen.
- source_word: וּתְבוּנָה
  choice: und Einsicht
  rationale: תְבוּנָה bezeichnet Verständnis, Einsicht oder Urteilsvermögen. „Einsicht“ ist im modernen Deutschen natürlich und unterscheidet sich klar von „Weisheit“.
theological_decisions:
- issue: Bezug der Pronominalsuffixe
  choice: Die Pronomen bleiben als „ihm“ wiedergegeben; der Kontext identifiziert den Bezug als Gott.
  alternative: Den Bezug im Vers ausdrücklich mit „Gott“ wiedergeben.
  rationale: Der unmittelbare Zusammenhang handelt von Gottes Weisheit und Macht. Die pronominale Form wahrt jedoch die Ausdrucksweise des Hebräischen und vermeidet eine unnötige Explizierung.
translation_notes:
  register: Knappes, würdevolles modernes Standarddeutsch mit bewahrtem poetischem Parallelismus. Keine Fußnote ist nötig, da „Bei ihm“ die Grundbedeutung von עִמּוֹ direkt wiedergibt; die mögliche Vorstellung des Innewohnens wird durch den deutschen Besitz- und Zugehörigkeitsausdruck nicht ausgeschlossen.
