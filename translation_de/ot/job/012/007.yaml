  text: וְֽ/אוּלָ֗ם שְׁאַל נָ֣א בְהֵמ֣וֹת וְ/תֹרֶ֑/ךָּ וְ/ע֥וֹף הַ֝/שָּׁמַ֗יִם וְ/יַגֶּד לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/007.yaml
  text: But ask the animals[a], please, and they will teach you, and the birds of the heavens, and they will tell you.
translation:
  language: de
  text: Doch frag einmal die Tiere, sie werden dich lehren, und die Vögel des Himmels, sie werden es dir sagen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: Doch
  rationale: Die Konjunktion markiert eine kontrastierende Wendung in Ijobs Rede; „Doch“ ist im Deutschen knapp, natürlich und dem poetischen Ton angemessen.
- source_word: שְׁאַל נָא
  choice: frag einmal
  rationale: Der Imperativ bedeutet „fragen“. Die Partikel נָא verleiht der Aufforderung Nachdruck beziehungsweise einen auffordernden Ton; „einmal“ gibt diese pragmatische Nuance natürlicher wieder als ein höfliches „bitte“.
- source_word: בְהֵמוֹת
  choice: die Tiere
  rationale: Das Wort bezeichnet hier allgemein Landtiere und nicht nur Vieh. „Tiere“ bildet zudem einen klaren Parallelbegriff zu den folgenden Vögeln.
- source_word: וְתֹרֶךָּ
  choice: sie werden dich lehren
  rationale: Die Hifil-Form von ירה bedeutet „lehren, unterweisen“. Das feminine Singularverb stimmt im Hebräischen mit dem kollektiv gebrauchten בְהֵמוֹת überein; im Deutschen verlangt „die Tiere“ idiomatisch den Plural.
- source_word: וְעוֹף הַשָּׁמַיִם
  choice: und die Vögel des Himmels
  rationale: עוֹף bezeichnet hier die fliegenden Tiere beziehungsweise Vögel. „Vögel des Himmels“ gibt die hebräische Fügung eng wieder und bewahrt den gehobenen poetischen Klang, ohne unverständlich zu wirken.
- source_word: וְיַגֶּד לָךְ
  choice: sie werden es dir sagen
  rationale: Das Hifil von נגד bedeutet „sagen, mitteilen, kundtun“. Das ergänzte „es“ ist im Deutschen idiomatisch und verweist auf das, wonach Ijob fragen soll; der Plural entspricht dem deutschen Subjekt „die Vögel“.
theological_decisions: []
