  text: He leads priests away stripped[b][a], and he overthrows the mighty.
translation:
  language: de
  text: Er führt Priester ausgeplündert weg[a] und stürzt die Mächtigen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beraubt“; auch möglich: „wie Beute“ oder „barfuß“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „die Beständigen“ oder „die fest Stehenden“, also Menschen, deren Stellung als dauerhaft gesichert gilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: führt … weg
  rationale: Das Hifil-Partizip von הלך bezeichnet hier, dass der im Zusammenhang vorausgesetzte göttliche Handelnde jemanden fortführt. „Wegführen“ gibt dies im Gerichtskontext natürlich wieder.
- source_word: כֹּהֲנִים
  choice: Priester
  rationale: Dies ist die direkte und im Zusammenhang passende Bezeichnung für religiöse Würdenträger.
- source_word: שׁוֹלָל
  choice: ausgeplündert
  rationale: Die Form bezeichnet hier einen Zustand der Beraubung und Erniedrigung. „Ausgeplündert“ wahrt den Bezug zu Beute und Verlust; alternative Nuancen werden in der Fußnote genannt.
- source_word: אֵתָנִים
  choice: die Mächtigen
  rationale: Das Wort bezeichnet Stärke, Beständigkeit oder feste Stellung. Im Parallelismus mit den Priestern und in der Reihe gestürzter Würdenträger ist „die Mächtigen“ eine natürliche Wiedergabe, ohne die Grundnuance der Festigkeit auszuschließen.
- source_word: יְסַלֵּף
  choice: stürzt
  rationale: Das Piel von סלף kann „verdrehen“, „verkehrt machen“ oder „umstürzen“ bedeuten. Hier beschreibt es, wie feststehende Machthaber zu Fall gebracht werden; „stürzt“ gibt die kontextuelle Wirkung knapp wieder.
theological_decisions:
- issue: Fortführung des unausgesprochenen Subjekts im Zusammenhang von Hiob 12
  choice: Das Subjekt wird mit „er“ wiedergegeben und weiterhin auf Gott bezogen.
  alternative: Zur Verdeutlichung ausdrücklich „Gott“ einsetzen.
  rationale: Die umliegenden Verse führen Gottes Handeln fort, ohne den Gottesnamen in jeder Zeile zu wiederholen. „Er“ bewahrt den poetischen Fluss und fügt keine im Vers selbst nicht ausgesprochene Bezeichnung ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Die Mehrdeutigkeit von שׁוֹלָל und אֵתָנִים bleibt durch Fußnoten sichtbar; „stürzt“ entspricht dem Kontext des Machtverlusts, ohne eine konfessionelle Deutung einzutragen.
