  text: אָ֭מְנָם כִּ֣י אַתֶּם עָ֑ם וְ֝/עִמָּ/כֶ֗ם תָּמ֥וּת חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/002.yaml
  text: No doubt you are the people[a], and wisdom will die with you.
translation:
  language: de
  text: Gewiss, ihr seid das Volk[a], und mit euch wird die Weisheit sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Aussage ist ironisch: Hiobs Freunde reden, als hätten sie die Weisheit für sich allein gepachtet.'
    reason: Die Fußnote macht den im Zusammenhang erkennbaren ironischen Sinn deutlich, ohne ihn in den Haupttext einzutragen oder die zugespitzte hebräische Formulierung zu ersetzen.
lexical_decisions:
- source_word: אָמְנָם כִּי
  choice: Gewiss
  rationale: Die Wortverbindung leitet eine nachdrückliche Behauptung ein. Im Zusammenhang ist sie als beißende ironische Zustimmung zu verstehen; „Gewiss“ bewahrt sowohl den Nachdruck als auch die im Kontext erkennbare Ironie.
- source_word: אַתֶּם
  choice: ihr
  rationale: Das maskuline Personalpronomen der 2. Person Plural richtet sich unmittelbar an Hiobs Freunde.
- source_word: עָם
  choice: das Volk
  rationale: Die bestimmte Wendung gibt die zugespitzte Aussage wieder, als seien Hiobs Freunde das maßgebliche oder einzig zählende Volk. Das ungewohnte Bild bleibt erhalten, statt es erklärend aufzulösen.
- source_word: וְעִמָּכֶם
  choice: und mit euch
  rationale: 'Die Präpositionalfügung bezeichnet Begleitung beziehungsweise Gleichzeitigkeit: Wenn die Angeredeten sterben, soll der ironischen Aussage zufolge auch die Weisheit sterben.'
- source_word: תָּמוּת
  choice: wird ... sterben
  rationale: Das Qal-Imperfekt der 3. Person Singular feminin stimmt mit „Weisheit“ überein. Die Zukunftsform und das starke Bild des Sterbens werden unmittelbar wiedergegeben.
- source_word: חָכְמָה
  choice: die Weisheit
  rationale: „Weisheit“ ist die reguläre und kontextgerechte Wiedergabe; sie erscheint personifiziert als etwas, das zusammen mit den Freunden sterben könnte.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzform und das personifizierende Bild vom Sterben der Weisheit bewahren die Schärfe von Hiobs Ironie.
