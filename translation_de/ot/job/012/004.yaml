id: JOB.12.4
reference: Job 12:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שְׂחֹ֤ק לְ/רֵעֵ֨/הוּ אֶֽהְיֶ֗ה קֹרֵ֣א לֶ֭/אֱלוֹהַּ וַֽ/יַּעֲנֵ֑/הוּ שְׂ֝ח֗וֹק צַדִּ֥יק תָּמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/004.yaml
  text: I am a laughingstock to my friend[a], one who called to God and he answered him[b], a laughingstock to the righteous and blameless man.
translation:
  language: de
  text: Meinem Freund bin ich zum Gespött geworden[a] – ich, der zu Gott rief und dem er antwortete[b]. Zum Gespött ist der Gerechte, der untadelig ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach der masoretischen Vokalisierung: „seinem Freund“. Im Zusammenhang liegt „meinem Freund“ nahe, da Hiob von sich selbst spricht.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „und er antwortete ihm“; mit „ihm“ ist Hiob gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂחֹק
  choice: zum Gespött
  rationale: Das Substantiv bezeichnet hier spöttisches Lachen, das sich gegen einen Menschen richtet. Die feste deutsche Wendung „jemandem zum Gespött sein“ gibt die prädikative Aussage natürlich und würdig wieder.
- source_word: לְרֵעֵהוּ
  choice: meinem Freund
  rationale: Der masoretisch vokalisierte Suffix lautet formal „seinem Freund“. Im Zusammenhang spricht Hiob jedoch von sich und seiner Beziehung zu seinem Gefährten; daher steht im Haupttext die kontextuell naheliegende erste Person, während die formale Lesart in der Fußnote erhalten bleibt.
- source_word: אֶהְיֶה
  choice: bin ich … geworden
  rationale: Die Imperfektform beschreibt in diesem Klagezusammenhang Hiobs gegenwärtigen, eingetretenen Zustand. „Bin … geworden“ klingt im Deutschen idiomatisch und lässt den Wandel seines Ansehens erkennen, ohne eine Zukunftsaussage zu erzwingen.
- source_word: קֹרֵא לֶאֱלוֹהַּ
  choice: ich, der zu Gott rief
  rationale: Das Partizip wird als Relativsatz auf Hiob bezogen. Das Präteritum verbindet den Ruf sachgerecht mit der anschließenden Erhörung.
- source_word: וַיַּעֲנֵהוּ
  choice: und dem er antwortete
  rationale: Die dritte Person des hebräischen Objekts („ihm“) bleibt durch das Relativpronomen „dem“ erhalten; Gott ist das naheliegende Subjekt, Hiob der Angesprochene.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: „Gerecht“ ist die etablierte und sachgerechte Wiedergabe für moralische Rechtschaffenheit im weisheitlichen Kontext.
- source_word: תָּמִים
  choice: der untadelig ist
  rationale: Das Wort bezeichnet Ganzheit und Lauterkeit des Lebenswandels. „Untadelig“ bewahrt diesen Anspruch, ohne absolute Sündlosigkeit auszudrücken.
theological_decisions:
- issue: Ob Hiobs Selbstbeschreibung absolute Sündlosigkeit behauptet
  choice: „untadelig“ als Bezeichnung sittlicher Lauterkeit und Integrität
  alternative: „vollkommen“ im Sinn absoluter moralischer Fehlerlosigkeit
  rationale: תָּמִים bezeichnet in der Weisheitsliteratur einen ungeteilten, lauteren Lebenswandel. Die Übersetzung darf Hiobs starken Unschuldsanspruch nicht abschwächen, soll daraus aber keine Behauptung metaphysischer oder absoluter Sündlosigkeit machen.
- issue: Bezug von „der Gerechte, der untadelig ist“
  choice: als verallgemeinernde und zugleich auf Hiob anwendbare Aussage
  alternative: ausschließlich als direkte Apposition zu Hiob
  rationale: Der knappe hebräische Nominalsatz kann Hiobs Lage in eine allgemeine Aussage fassen. Die eigenständige Satzform erhält diese Spannung, statt den Ausdruck ausschließlich als Apposition festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „zum Gespött“ bildet die hebräische Rahmung nach. Der zweite Satz bleibt bewusst knapp und nominal geprägt; „untadelig“ bezeichnet Integrität, nicht absolute Vollkommenheit.
