base_translation:
  language: en
  yaml_path: translation/ot/job/012/012.yaml
  text: With the aged is wisdom[a], and with length of days[b], understanding.
translation:
  language: de
  text: Bei den Alten ist Weisheit[a] und bei langem Leben[b] Einsicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unter den Alten ist Weisheit.“ Die hebräische Präposition kann Zugehörigkeit oder einen Bereich ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Länge der Tage“; gemeint ist ein langes Leben oder ein hohes Alter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּישִׁישִׁים
  choice: bei den Alten
  rationale: 'Die Präposition בְּ kann hier Zugehörigkeit oder den Bereich bezeichnen: Weisheit findet sich bei beziehungsweise unter alten Menschen. „Bei den Alten“ ist knapp, natürlich und bewahrt den Parallelismus.'
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und sachgerechte Wiedergabe im Kontext der Weisheitsliteratur.
- source_word: וְאֹרֶךְ יָמִים
  choice: und bei langem Leben
  rationale: Die hebräische Wendung bedeutet wörtlich „Länge der Tage“. „Bei langem Leben“ gibt das Bild verständlich wieder und passt zum parallelen „bei den Alten“.
- source_word: תְּבוּנָה
  choice: Einsicht
  rationale: Das Wort bezeichnet verständige Einsicht beziehungsweise Urteilsvermögen. „Einsicht“ steht natürlich neben „Weisheit“ und erhält die begriffliche Nuance.
theological_decisions:
- issue: Aussage oder rhetorische Frage im Zusammenhang
  choice: Als Aussagesatz wiedergegeben
  alternative: „Ist nicht bei den Alten Weisheit und bei langem Leben Einsicht?“
  rationale: Der masoretische Text enthält kein ausdrückliches Frageelement. Obwohl der Zusammenhang eine rhetorische Lesart zulassen kann, wahrt der Aussagesatz die Form des überlieferten hebräischen Wortlauts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem sprichwörtlichem Parallelismus. „Die Alten“ bezeichnet hier alte Menschen allgemein und ist nicht auf Männer beschränkt.
