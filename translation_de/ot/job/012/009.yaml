  text: מִ֭י לֹא יָדַ֣ע בְּ/כָל אֵ֑לֶּה כִּ֥י יַד יְ֝הוָה עָ֣שְׂתָה זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/009.yaml
  text: Who among all these does not know that the hand of Yahweh has done this?[a]
translation:
  language: de
  text: Wer von all diesen weiß nicht, dass die Hand Jahwes dies getan hat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לֹא יָדַע
  choice: Wer … weiß nicht
  rationale: Die rhetorische Frage wird im Deutschen idiomatisch im Präsens wiedergegeben; ידע behält seine Grundbedeutung „wissen/erkennen“.
- source_word: בְּכָל אֵלֶּה
  choice: von all diesen
  rationale: Die Präposition בְּ wird hier partitiv verstanden. „Von all diesen“ bezieht sich natürlich auf die zuvor genannten Geschöpfe und bewahrt den offenen Rückverweis des Hebräischen.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was erkannt wird.
- source_word: יַד
  choice: die Hand
  rationale: Das konkrete hebräische Bild für Gottes Wirken und Macht wird beibehalten, statt es erklärend mit „Macht“ aufzulösen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift gibt den Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עָשְׂתָה זֹּאת
  choice: dies getan hat
  rationale: עשה wird in seiner weiten Bedeutung „tun“ wiedergegeben; das Perfekt bezeichnet die vollzogene Handlung, und זֹאת bleibt als singularisches „dies“ erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die deutsche Form „Jahwe“ bewahrt den Eigennamen; die traditionelle Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Direktheit, das anthropomorphe Bild „Hand Jahwes“ und der offene Bezug von „dies“ bleiben erhalten.
