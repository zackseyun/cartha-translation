  yaml_path: translation/ot/job/012/023.yaml
  text: He makes nations great[a], and he destroys them; he enlarges nations, and he leads them away.
translation:
  language: de
  text: Er lässt Völker groß werden und vernichtet sie; er breitet Völker aus und führt sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im Sinn des Zusammenhangs: „Er breitet Völker aus und führt sie weg.“ Das hebräische Verb bedeutet allgemein „führen“ oder „leiten“; eine Richtung wird nicht ausdrücklich genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂגִּיא
  choice: lässt … groß werden
  rationale: Das Hifil-Partizip von שׂגא bezeichnet ein Verursachen von Größe oder Wachstum. Die Formulierung gibt den kausativen Sinn natürlich wieder, ohne Wohlstand als besondere Bedeutung festzulegen.
- source_word: לַגּוֹיִם
  choice: Völker
  rationale: גּוֹיִם bezeichnet hier politische beziehungsweise ethnische Gemeinwesen allgemein; „Völker“ vermeidet die unpassende Einschränkung auf Nichtisraeliten.
- source_word: וַיְאַבְּדֵם
  choice: vernichtet sie
  rationale: Die Form von אבד bezeichnet hier, dass Gott die Völker zugrunde gehen lässt. „Vernichtet“ ist knapp und bildet einen deutlichen Gegensatz zu ihrem Großwerden.
- source_word: שֹׁטֵחַ
  choice: breitet … aus
  rationale: Das Partizip von שטח trägt das Bild des Ausbreitens oder Ausdehnens. Bei Völkern kann dies räumliche Ausdehnung oder wachsenden Einfluss bezeichnen; die bildhafte Offenheit bleibt erhalten.
- source_word: וַיַּנְחֵם
  choice: führt sie weg
  rationale: נחה bedeutet grundsätzlich „führen“ oder „leiten“. „Wegführen“ nimmt im Zusammenhang mit Vernichtung und der Umkehrung nationaler Größe die Bewegungsrichtung auf, ohne eine konkrete Form der Entfernung festzulegen.
theological_decisions:
- issue: Bedeutung der Bewegung der Völker im zweiten Halbvers
  choice: Gott breitet Völker aus und führt sie anschließend weg.
  alternative: Gott breitet Völker aus und führt beziehungsweise leitet sie.
  rationale: Der Zusammenhang betont Gottes Herrschaft über Aufstieg und Untergang der Völker. נחה kann auch ein fürsorgliches Leiten bezeichnen; der negative Parallelismus legt hier jedoch „wegführen“ nahe. Die Fußnote bewahrt die echte lexikalische Mehrdeutigkeit.
translation_notes:
  register: Moderne, würdige Standardsprache mit knappem poetischem Parallelismus. Das zweimalige „Völker“ bewahrt die Struktur des Hebräischen; der Wechsel von Partizip und finitem Verb wird zugunsten eines flüssigen deutschen Verses nicht eigens markiert.
