  text: They grope in darkness[a], without light; he makes them stagger like a drunkard.
translation:
  language: de
  text: Sie tasten in der Finsternis umher, ohne Licht; er lässt sie wie Betrunkene taumeln[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „er lässt sie umherirren“. Das hebräische Verb kann ein orientierungsloses Umherirren oder Abirren bezeichnen; der Vergleich mit Betrunkenen legt hier „taumeln“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַשְׁשׁוּ
  choice: sie tasten … umher
  rationale: Der Piel-Stamm von משׁשׁ bezeichnet ein suchendes Tasten, besonders wenn die Sicht fehlt. „Umhertasten“ gibt das Bild im heutigen Deutsch natürlich wieder.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: חֹשֶׁךְ bezeichnet Dunkelheit oder Finsternis. „Finsternis“ bewahrt hier den würdevollen poetischen Ton und lässt sowohl die konkrete als auch die bildliche Bedeutung offen.
- source_word: וְלֹא אוֹר
  choice: ohne Licht
  rationale: Wörtlich steht „und nicht Licht“. „Ohne Licht“ ist idiomatisches Deutsch und erhält den knappen Gegensatz.
- source_word: וַיַּתְעֵם
  choice: er lässt sie taumeln
  rationale: Die Form von תעה ist kausativ und bedeutet, jemanden umherirren oder fehlgehen zu lassen. Im Zusammenhang mit der Finsternis und dem Vergleich mit einem Betrunkenen bringt „taumeln lassen“ die körperliche Orientierungslosigkeit anschaulich zum Ausdruck, ohne die lexikalische Alternative zu verschweigen.
- source_word: ־ם (Suffix in וַיַּתְעֵם)
  choice: sie
  rationale: Das Objektsuffix der 3. Person maskulin Plural verweist auf die zuvor im Zusammenhang genannten Menschen.
- source_word: כַּשִּׁכּוֹר
  choice: wie einen Betrunkenen
  rationale: Das substantivisch gebrauchte Wort bezeichnet einen betrunkenen Menschen. Wegen der Konstruktion mit „lässt sie taumeln“ verlangt natürliches Deutsch hier den Akkusativ Singular.
theological_decisions:
- issue: Unausgesprochenes Subjekt von וַיַּתְעֵם
  choice: er lässt sie taumeln
  alternative: sie taumeln
  rationale: Die Verbform hat ein Subjekt der 3. Person maskulin Singular und ein Objekt der 3. Person maskulin Plural. Das „er“ ist daher grammatisch begründet und bezieht sich im größeren Zusammenhang auf Gott; eine Wiedergabe ohne dieses Subjekt würde die Aussage abschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit poetisch-würdigem Ton. Die Wortstellung bewahrt den hebräischen Parallelismus, ohne unnatürlich zu wirken. Der Fußnotenmarker steht unmittelbar bei der lexikalisch erklärten Wiedergabe.
