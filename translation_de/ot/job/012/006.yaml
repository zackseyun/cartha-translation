base_translation:
  language: en
  yaml_path: translation/ot/job/012/006.yaml
  text: The tents of destroyers are at ease[a], and those who provoke God are secure—those whose god brings into their hand.
translation:
  language: de
  text: Die Zelte der Verwüster sind ungestört, und die, die Gott reizen, sind sicher – sie, denen Gott etwas in die Hand gibt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut der letzten Zeile ist schwierig und lässt das Objekt zu „gibt/bringt“ offen; „etwas“ ist im Deutschen ergänzt. Auch möglich: „die Gott in seine Hand bringt“. Die Zeile kann sich auf Gottes Vorsehung beziehen oder ironisch darauf, dass den Frevlern ihr eigener Gott beziehungsweise ihre eigene Macht als Gott gilt.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלָיוּ
  choice: bleiben unbehelligt
  rationale: Das Verb bezeichnet ungestörte Ruhe und Sorglosigkeit. „Bleiben unbehelligt“ gibt im Deutschen den hier beklagten Gegensatz zwischen Gewalttat und sicherem Leben natürlich wieder.
- source_word: אֹהָלִים
  choice: Zelte
  rationale: Das konkrete Bild wird beibehalten; zugleich können die Zelte stellvertretend für die Haushalte oder Wohnstätten stehen.
- source_word: לְשֹׁדְדִים
  choice: der Verwüster
  rationale: Das substantivierte Partizip bezeichnet gewaltsame Plünderer oder Zerstörer. „Verwüster“ bewahrt die Breite der gewaltsamen Bedeutung.
- source_word: וּבַטֻּחוֹת
  choice: sicher leben
  rationale: Die Form bezeichnet Sicherheit beziehungsweise einen sicheren Zustand und steht parallel zur ungestörten Ruhe im ersten Halbvers.
- source_word: לְמַרְגִּיזֵי אֵל
  choice: die Gott reizen
  rationale: Der Kausativ von רגז bezeichnet hier Menschen, die Gott zum Zorn reizen oder herausfordern. „Gott reizen“ ist knapp und idiomatisch.
- source_word: לַאֲשֶׁר הֵבִיא אֱלוֹהַּ בְּיָדוֹ
  choice: sie, deren Gott ihnen Macht in die Hand gibt
  rationale: Die schwierige Schlussklausel wird ironisch auf den Gegenstand des Vertrauens der Frevler bezogen. „Macht“ verdeutlicht, was ihnen nach dieser Lesart als Gott dient; wegen der syntaktischen Mehrdeutigkeit werden andere Deutungen in der Fußnote genannt.
theological_decisions:
- issue: Bezug und Funktion von אֱלוֹהַּ in der Schlussklausel
  choice: '„deren Gott ihnen Macht in die Hand gibt“: „Gott“ als ironische Bezeichnung dessen, worauf die Gewalttäter vertrauen'
  alternative: „die Gott in seine Hand bringt“ oder „denen Gott etwas in die Hand gibt“
  rationale: Der Zusammenhang schildert die anstößige Sicherheit der Gottlosen. Die gewählte Lesart lässt die Schlusszeile ihre Selbstvergötterung beziehungsweise ihr Vertrauen auf eigene Macht zuspitzen. Da der hebräische Satzbau auch den wahren Gott als Handelnden zulässt, wird diese Spannung nicht verschwiegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit konkretem poetischem Bild. Die Parallelstruktur wird bewahrt; die schwer verständliche Schlussklausel wird lesbar formuliert, während ihre echte exegetische Mehrdeutigkeit in der Fußnote erhalten bleibt.
