  text: מוֹלִ֣יךְ יוֹעֲצִ֣ים שׁוֹלָ֑ל וְֽ/שֹׁפְטִ֥ים יְהוֹלֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/017.yaml
  text: He leads counselors away stripped[a], and he makes judges foolish.
translation:
  language: de
  text: Er führt Ratgeber beraubt[a] fort und macht Richter zu Narren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ausgeplündert“ oder „als Beraubte“; das hebräische Wort kann hervorheben, dass die Ratgeber gedemütigt und ihres Besitzes entledigt fortgeführt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: führt … fort
  rationale: Das Hifil-Partizip von הלך bezeichnet hier ein veranlasstes Weggehen. „führt … fort“ gibt die Bewegung idiomatisch wieder und passt zum Bild abgeführter Besiegter.
- source_word: יוֹעֲצִים
  choice: Ratgeber
  rationale: Das Wort bezeichnet Personen, die Rat erteilen. „Ratgeber“ ist im modernen Deutschen natürlich und wahrt den politischen beziehungsweise gesellschaftlichen Kontext.
- source_word: שׁוֹלָל
  choice: ausgeplündert
  rationale: Die Form aus dem Wortfeld שלל beschreibt hier wahrscheinlich einen Zustand der Beraubung und Erniedrigung. „ausgeplündert“ bewahrt diesen Sinn, ohne die mögliche konkrete Begleitvorstellung der Nacktheit oder Barfüßigkeit festzuschreiben.
- source_word: שֹׁפְטִים
  choice: Richter
  rationale: Die direkte Bedeutung ist „Richter“; zugleich können damit Amtsträger mit Regierungsgewalt gemeint sein. Die Übersetzung erhält die Parallelität zu den Ratgebern.
- source_word: יְהוֹלֵל
  choice: macht … zu Narren
  rationale: Das Piel von הלל II drückt aus, dass jemand töricht oder irrational gemacht wird. Die deutsche Wendung gibt den kausativen Sinn klar und kräftig wieder.
theological_decisions:
- issue: Unausgesprochenes Subjekt
  choice: „Er“ wird als Subjekt ergänzt und bezieht sich im Zusammenhang auf Gott.
  alternative: Den Gottesnamen oder „Gott“ ausdrücklich einsetzen.
  rationale: Der hebräische Vers enthält im Partizipialsatz kein ausdrücklich genanntes Subjekt; der Kontext von Hiob 12 identifiziert jedoch Gott als Handelnden. „Er“ wahrt den Kontext, ohne den Gottesnamen in diesen Vers einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fortführen“ vermittelt das Abführen in Niederlage; „zu Narren machen“ erhält die scharfe poetische Parallelität, ohne eine medizinische Aussage über Wahnsinn einzutragen.
