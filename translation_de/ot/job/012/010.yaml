  text: אֲשֶׁ֣ר בְּ֭/יָד/וֹ נֶ֣פֶשׁ כָּל חָ֑י וְ֝/ר֗וּחַ כָּל בְּשַׂר אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/010.yaml
  text: In whose hand is the life of every living thing[a], and the breath of all mankind.
translation:
  language: de
  text: In dessen Hand liegt das Leben jedes Lebewesens[a] und der Atem aller Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Seele alles Lebendigen und der Geist alles menschlichen Fleisches“.'
    reason: Lexikalische Alternative für נֶפֶשׁ und רוּחַ sowie formnähere Wiedergabe von כָּל בְּשַׂר אִישׁ.
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: in dessen Hand
  rationale: Die Relativpartikel und die Präpositionalfügung werden zusammen als anschließender Relativsatz wiedergegeben. Das Bild der Hand als Ausdruck von Macht und Verfügungsgewalt bleibt erhalten.
- source_word: נֶפֶשׁ
  choice: Leben
  rationale: Im Zusammenhang bezeichnet das Wort vor allem das belebende Leben der Geschöpfe. „Leben“ passt zum Parallelbegriff „Atem“ und vermeidet eine unnötige Festlegung auf eine spätere Leib-Seele-Systematik.
- source_word: כָּל חָי
  choice: alles Lebendigen
  rationale: Die Formulierung bewahrt den umfassenden Bezug auf alles, was lebt, und klingt im Deutschen würdig und natürlich.
- source_word: וְרוּחַ
  choice: und der Atem
  rationale: Im Parallelismus mit נֶפֶשׁ bezeichnet רוּחַ hier wahrscheinlich den Lebensatem. Die mögliche Wiedergabe „Geist“ bleibt in der Fußnote sichtbar.
- source_word: כָּל בְּשַׂר אִישׁ
  choice: aller Menschen
  rationale: Die hebräische Wendung bezeichnet die gesamte Menschheit in ihrer geschöpflichen Leiblichkeit. „Aller Menschen“ gibt den kollektiven Sinn klar und idiomatisch wieder; die formnähere Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Anthropologische Begriffe נֶפֶשׁ und רוּחַ
  choice: „Leben“ und „Atem“
  alternative: „Seele“ und „Geist“
  rationale: Die konkrete Wiedergabe hebt Gottes Verfügung über das Leben aller Geschöpfe hervor, ohne eine schärfere anthropologische Trennung in den Text einzutragen, als das Hebräische verlangt.
- issue: Menschheitsbezug in כָּל בְּשַׂר אִישׁ
  choice: „aller Menschen“
  alternative: „allen menschlichen Fleisches“
  rationale: Die Hauptfassung ist im modernen Deutschen verständlich und gibt den umfassenden menschlichen Bezug wieder. Die wörtlichere Form bewahrt den Aspekt sterblicher Leiblichkeit und wird deshalb als Alternative dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der relative Anschluss „In dessen Hand“ bewahrt die Satzstruktur des Hebräischen; „liegt“ macht die deutsche Formulierung flüssig, ohne das Bild der Hand aufzulösen.
