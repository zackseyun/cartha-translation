lexical_decisions:
- source_word: וַיַּעַן
  choice: Da antwortete
  rationale: Die Wayyiqtol-Form von ענה führt Ijobs Erwiderung als nächsten Schritt im Dialog ein. „Da antwortete“ ist im modernen Deutschen natürlich und bewahrt die herkömmliche Antwortformel.
- source_word: אִיּוֹב
  choice: Ijob
  rationale: Der Personenname wird nach der im modernen deutschen Bibelgebrauch verbreiteten Form wiedergegeben.
- source_word: וַיֹּאמַר
  choice: und sagte
  rationale: Die Wayyiqtol-Form von אמר ist die übliche Redeeinleitung. „Und sagte“ bildet die hebräische Doppelverbform ab, ohne sie paraphrasierend zu glätten.
- source_word: וַ
  choice: Da
  rationale: Das eröffnende Waw kennzeichnet die Abfolge im Gespräch. „Da“ gibt diesen Fortgang im Deutschen idiomatisch wieder; „Und“ bleibt als formnähere Alternative möglich.
