    issue: Unklarer Bezug im zweiten Passiv
    rationale: In »schließt er einen Mann ein, wird nicht wieder geöffnet« hat »wird ... geöffnet« kein ausdrückliches oder eindeutig ellipsierbares Bezugsobjekt. Das Hebräische lässt das Objekt von יִפָּתֵחַ offen; die deutsche Fassung sollte diese Offenheit bewahren, ohne grammatisch missverständlich zu werden.
