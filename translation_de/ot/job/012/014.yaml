  text: הֵ֣ן יַ֭הֲרוֹס וְ/לֹ֣א יִבָּנֶ֑ה יִסְגֹּ֥ר עַל אִ֝֗ישׁ וְ/לֹ֣א יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/014.yaml
  text: Look[a], if he tears down, it cannot be rebuilt; if he shuts a man in[b], it cannot be opened.
translation:
  language: de
  text: 'Sieh[a]: Was er niederreißt, wird nicht wieder aufgebaut; schließt er einen Mann ein[b], kann niemand wieder öffnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wahrlich« oder »Siehe«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sperrt er einen Mann ein« oder »hält er einen Mann eingeschlossen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Partikel lenkt nachdrücklich die Aufmerksamkeit auf die folgende Aussage. »Sieh« ist im heutigen Deutsch verständlich und bewahrt den auffordernden Charakter, ohne so altertümlich wie »siehe« zu wirken.
- source_word: יַהֲרוֹס
  choice: niederreißt
  rationale: Das Verb הרס bezeichnet das Einreißen oder Zerstören, besonders von Bauwerken. »Niederreißt« erhält das konkrete Baubild, das im folgenden Passiv von בנה fortgeführt wird.
- source_word: וְלֹא יִבָּנֶה
  choice: wird nicht wieder aufgebaut
  rationale: 'Der Nifal von בנה ist passiv: »gebaut/aufgebaut werden«. »Wieder aufgebaut« entspricht im Deutschen dem Zusammenhang nach einer Zerstörung; die Formulierung bewahrt die bestimmte, unumkehrbar wirkende Folge, ohne ausdrücklich ein Modalverb in den hebräischen Text einzutragen.'
- source_word: יִסְגֹּר
  choice: schließt ... ein
  rationale: סגר kann »schließen«, »einschließen« oder »einsperren« bedeuten. »Einschließen« bewahrt das konkrete Bild und legt sich nicht unnötig auf eine förmliche Gefangenschaft fest.
- source_word: עַל אִישׁ
  choice: einen Mann
  rationale: אִישׁ bezeichnet hier einen einzelnen Mann. In Verbindung mit סגר gibt עַל die von der Handlung betroffene Person an; die deutsche Wortstellung folgt dem idiomatischen »einen Mann einschließen«.
- source_word: וְלֹא יִפָּתֵחַ
  choice: wird nicht wieder geöffnet
  rationale: 'Der Nifal von פתח ist passiv: »geöffnet werden«. Das unausgesprochene Bezugsobjekt bleibt wie im Hebräischen offen; »wieder« macht im Deutschen die Gegenbewegung zum Einschließen verständlich, ohne sie als ausdrücklich genannte Freilassung auszudeuten.'
theological_decisions:
- issue: Bezug des unausgesprochenen handelnden Subjekts
  choice: er
  alternative: Gott; der HERR
  rationale: Die hebräischen Verben stehen in der dritten Person Singular, doch in diesem Vers wird kein Gottesname und kein Titel ausdrücklich genannt. Das Pronomen »er« erhält den Bezug aus dem Zusammenhang, ohne eine nicht im Vers stehende Benennung einzufügen.
- issue: Stärke der negativen Aussagen
  choice: wird nicht wieder aufgebaut / wird nicht wieder geöffnet
  alternative: kann nicht wieder aufgebaut / kann nicht wieder geöffnet werden
  rationale: Das Hebräische verwendet jeweils eine verneinte Passivform, aber kein ausdrückliches Wort für »können«. Die gewählte Fassung bewahrt die kategorische Wirkung und bleibt zugleich formal näher am Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach »Sieh« gibt die einleitende Partikel natürlich wieder. Die parallele Satzstruktur erhält den poetischen Zusammenhang zwischen Niederreißen und fehlendem Wiederaufbau sowie Einschließen und fehlender Öffnung.
