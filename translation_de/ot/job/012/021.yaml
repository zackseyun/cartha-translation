lexical_decisions:
- source_word: שׁוֹפֵךְ
  choice: gießt … aus
  rationale: Das Partizip von שׁפך bezeichnet ein Ausgießen. Die deutsche Wendung bewahrt das anschauliche Bild und verbindet sich natürlich mit „Verachtung“.
- source_word: בּוּז
  choice: Verachtung
  rationale: בּוּז bezeichnet Verachtung oder Geringschätzung; „Verachtung“ gibt die öffentliche Herabsetzung treffend wieder.
- source_word: נְדִיבִים
  choice: Vornehme
  rationale: Im Zusammenhang gesellschaftlicher Umkehrung bezeichnet das Wort hochgestellte oder führende Personen. „Vornehme“ ist weiter als „Fürsten“ und vermeidet eine unnötige Festlegung auf königliche Amtsträger.
- source_word: מְזִיחַ
  choice: Gürtel
  rationale: Das Substantiv bezeichnet einen Gürtel oder eine Gurtung. „Gürtel“ ist im heutigen Deutsch verständlich und erhält das konkrete poetische Bild.
- source_word: אֲפִיקִים
  choice: Mächtigen
  rationale: Hier bezeichnet das Wort kraftvolle oder machtvolle Menschen und steht parallel zu den Vornehmen. „Mächtige“ bringt sowohl Stärke als auch gesellschaftliche Macht zum Ausdruck.
- source_word: רִפָּה
  choice: lockert
  rationale: Die Form von רפה bedeutet „locker machen“ oder „erschlaffen lassen“. „Lockert“ entspricht dem Bild eines gelösten Gürtels, ohne es vorschnell auszudeuten.
theological_decisions:
- issue: Bildhafte Darstellung göttlicher Erniedrigung und Entmachtung
  choice: „lockert den Gürtel der Mächtigen“
  alternative: „entwaffnet die Mächtigen“ oder „nimmt den Mächtigen ihre Kraft“
  rationale: Der hebräische Text beschreibt Gottes Umkehrung menschlichen Ranges und menschlicher Macht mit einem konkreten Bild. Die wörtlich-nahe Wiedergabe bewahrt dessen poetische Offenheit und legt es nicht ausschließlich militärisch oder abstrakt aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und das konkrete Bild des hebräischen Textes bleiben erhalten; die Fußnoten weisen auf die Bedeutungsbreite hin, ohne die Metapher im Haupttext aufzulösen.
