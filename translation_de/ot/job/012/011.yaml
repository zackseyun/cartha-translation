source:
  edition: WLC
  text: הֲ/לֹא אֹ֭זֶן מִלִּ֣ין תִּבְחָ֑ן וְ֝/חֵ֗ךְ אֹ֣כֶל יִטְעַם לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/011.yaml
  text: Does not the ear test words[a], as the palate tastes food?
translation:
  language: de
  text: Prüft nicht das Ohr die Worte[a], wie der Gaumen die Speise kostet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Prüft nicht das Ohr die Rede, wie der Gaumen die Speise kostet?«'
    reason: 'Lexikalische Alternative: מִלִּין kann neben »Worte« auch zusammenfassend »Rede« bezeichnen.'
lexical_decisions:
- source_word: הֲלֹא
  choice: Prüft nicht
  rationale: Die Verbindung leitet eine rhetorische Frage ein, die Zustimmung erwartet; die deutsche Form mit »nicht« bewahrt diese Kraft natürlich.
- source_word: אֹזֶן
  choice: Ohr
  rationale: Die konkrete Körperbezeichnung erhält das hebräische Bild für das hörende und unterscheidende Wahrnehmen.
- source_word: מִלִּין
  choice: Worte
  rationale: Die Mehrzahl bezeichnet Worte beziehungsweise Rede; »Worte« ist direkt und fügt sich in den Vergleich mit der Speise.
- source_word: תִּבְחָן
  choice: prüft
  rationale: Das Verb bezeichnet prüfendes Untersuchen. »Prüft« bildet zudem einen klaren Parallelismus zum Kosten.
- source_word: חֵךְ
  choice: Gaumen
  rationale: Gemeint ist genauer der Gaumen, nicht allgemein der Mund; so bleibt die sinnliche Entsprechung zum Ohr erhalten.
- source_word: אֹכֶל
  choice: Speise
  rationale: Das Substantiv bezeichnet Essbares beziehungsweise Nahrung. »Speise« wirkt in diesem poetischen Satz würdig und verständlich.
- source_word: יִטְעַם
  choice: kostet
  rationale: Das Verb bedeutet »schmecken, kosten«. »Kostet« bezeichnet hier die prüfende Geschmackswahrnehmung idiomatisch.
- source_word: לוֹ
  choice: nicht eigens wiedergegeben
  rationale: Die pronominale Form gehört idiomatisch zur Aussage über das Kosten; eine ausdrückliche Wiedergabe wie »für sich selbst« wäre im Deutschen schwerfällig und könnte einen sachlich nicht beabsichtigten Gegensatz betonen.
theological_decisions: []
translation_notes:
  register: Moderne, gehobene Standardsprache mit bewahrtem poetischem Parallelismus. Die rhetorische Frage und die beiden konkreten Sinnesbilder bleiben erhalten.
