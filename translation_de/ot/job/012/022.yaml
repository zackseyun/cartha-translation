base_translation:
  language: en
  yaml_path: translation/ot/job/012/022.yaml
  text: He reveals deep things out of darkness[a], and brings the shadow of death to light.
translation:
  language: de
  text: Er enthüllt tiefe Dinge aus der Finsternis und bringt den Todesschatten[a] ans Licht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tiefe Finsternis“ oder „Todesfinsternis“ für „Todesschatten“ (hebräisch צַלְמָוֶת).'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגַלֶּה
  choice: enthüllt
  rationale: Das Partizip von גלה bezeichnet ein Aufdecken oder Offenlegen. „Enthüllt“ bewahrt das Bild des Verborgenen, das sichtbar und erkennbar gemacht wird.
- source_word: עֲמֻקוֹת
  choice: Tiefen
  rationale: Das substantivierte feminine Pluralwort kann tiefe Orte, Tiefen oder verborgene Dinge bezeichnen. „Tiefen“ erhält die räumliche und übertragene Offenheit des poetischen Ausdrucks.
- source_word: מִנִּי חֹשֶׁךְ
  choice: aus der Finsternis
  rationale: Die Präposition bezeichnet hier Herkunft beziehungsweise Hervorkommen. „Aus der Finsternis“ gibt das Bild natürlich und prägnant wieder.
- source_word: וַיֹּצֵא
  choice: bringt … ans Licht
  rationale: 'Der Hifil von יצא ist kausativ: Er lässt etwas herauskommen. Die deutsche Wendung „ans Licht bringen“ bildet diese Bedeutung idiomatisch ab.'
- source_word: לָאוֹר
  choice: ans Licht
  rationale: Die Form bezeichnet die Bewegung zum Licht hin. In Verbindung mit „bringen“ ist „ans Licht“ die natürliche deutsche Entsprechung.
- source_word: צַלְמָוֶת
  choice: Todesschatten
  rationale: „Todesschatten“ erhält die traditionelle, lexikalisch mögliche Deutung und die poetische Intensität. Die ebenfalls mögliche Bedeutung „tiefe Finsternis“ wird in einer Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe von צַלְמָוֶת
  choice: Todesschatten
  alternative: tiefe Finsternis oder Todesfinsternis
  rationale: Die Frage ist vor allem lexikalisch und poetisch. Die traditionelle Wiedergabe bleibt vertretbar und bewahrt den möglichen Todesbezug; die Deutung als besonders dichte Finsternis wird wegen der echten Mehrdeutigkeit nicht verschwiegen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelität. „Finsternis“ und „Todesschatten“ erhalten den gehobenen Bildcharakter, ohne altertümliche Syntax zu verwenden.
