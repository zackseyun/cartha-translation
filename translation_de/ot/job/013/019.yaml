source:
  edition: WLC
  text: מִי ה֭וּא יָרִ֣יב עִמָּדִ֑/י כִּֽי עַתָּ֖ה אַחֲרִ֣ישׁ וְ/אֶגְוָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/019.yaml
  text: Who is it that will contend with me? For then I would be silent and die[a].
translation:
  language: de
  text: Wer ist es, der mit mir streiten will? Denn dann würde ich schweigen und sterben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn jetzt würde ich schweigen und sterben.“ Das hebräische Adverb bedeutet häufig „jetzt“; im Gedankengang Hiobs verstehen es jedoch viele im Sinn von „dann“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הוּא
  choice: Wer ist es
  rationale: Das Fragewort mit dem selbstständigen Pronomen ist nachdrücklich; „Wer ist es“ gibt diese rhetorische Betonung im modernen Deutschen natürlich wieder.
- source_word: יָרִיב
  choice: der … streiten will
  rationale: ריב bezeichnet eine Auseinandersetzung und kann einen rechtlichen Beiklang haben. „Streiten“ bewahrt die gegnerische, gegebenenfalls forensische Bedeutung, ohne ein förmliches Gerichtsverfahren vorauszusetzen.
- source_word: עִמָּדִי
  choice: mit mir
  rationale: Die Präposition wird unmittelbar mit „mit mir“ wiedergegeben; der adversative Sinn ergibt sich bereits aus dem Verb „streiten“.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet hier die Begründung beziehungsweise Folgerung zu Hiobs Herausforderung ein; „Denn“ fügt sich natürlich in den argumentativen Zusammenhang.
- source_word: עַתָּה
  choice: dann
  rationale: Das Adverb bedeutet gewöhnlich „jetzt“, kann im Zusammenhang jedoch auf die Folge der eben formulierten Herausforderung weisen. „Dann“ ergibt hier den schlüssigeren Gedankengang; die wörtlich naheliegende Alternative wird in der Fußnote bewahrt.
- source_word: אַחֲרִישׁ
  choice: würde ich schweigen
  rationale: Die Verbform bezeichnet hier das Stillsein beziehungsweise Schweigen. Der deutsche Konjunktiv gibt die im Kontext verstandene Folge angemessen wieder.
- source_word: וְאֶגְוָע
  choice: und sterben
  rationale: גוע bezeichnet das Verscheiden oder Sterben. „Sterben“ ist klar, würdig und bewahrt die Schärfe der Aussage.
theological_decisions: []
translation_notes:
