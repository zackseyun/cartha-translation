  text: לָֽ/מָּה פָנֶ֥י/ךָ תַסְתִּ֑יר וְ/תַחְשְׁבֵ֖/נִי לְ/אוֹיֵ֣ב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/024.yaml
  text: Why do you hide your face and count me as your enemy?[a]
translation:
  language: de
  text: Warum verbirgst du dein Angesicht und hältst mich für deinen Feind?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und mich als einen Feind von dir ansiehst.“'
    reason: Lexikalische Alternative, welche die relationale Form לָךְ ausdrücklicher wiedergibt.
lexical_decisions:
- source_word: לָמָה
  choice: Warum
  rationale: Direkte Frage nach dem Grund; „Warum“ ist die natürliche deutsche Entsprechung.
- source_word: פָנֶיךָ
  choice: dein Angesicht
  rationale: Bewahrt den konkreten hebräischen Ausdruck und dessen poetisch-biblische Bedeutung von Gegenwart und Zuwendung.
- source_word: תַסְתִּיר
  choice: verbirgst du
  rationale: Das Hifil von סתר bedeutet „verbergen“ oder „verstecken“; „dein Angesicht verbergen“ ist im Deutschen idiomatisch und würdevoll.
- source_word: וְתַחְשְׁבֵנִי
  choice: und hältst mich
  rationale: חשב bezeichnet hier das Einschätzen oder Ansehen als etwas; die deutsche Konstruktion „jemanden für … halten“ gibt den prädikativen Sinn natürlich wieder.
- source_word: לְאוֹיֵב
  choice: für … Feind
  rationale: Das לְ kennzeichnet nach חשב die prädikative Ergänzung; „für einen Feind halten“ entspricht dieser Konstruktion.
- source_word: לָךְ
  choice: deinen
  rationale: 'Das formal relationale „dir/für dich“ wird in dieser deutschen Wendung idiomatisch als Zugehörigkeit ausgedrückt: „deinen Feind“.'
theological_decisions:
- issue: Anthropomorphe Rede von Gottes verborgenem Angesicht
  choice: Den Ausdruck „dein Angesicht verbergen“ im Haupttext bewahren.
  alternative: dich entziehen / deine Gegenwart verbergen
  rationale: Der hebräische Text verwendet bewusst das konkrete Bild des Angesichts für Gottes Gegenwart oder Zuwendung. Die wörtliche Bildsprache bewahrt die poetische und theologische Spannung, ohne sie auszudeuten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, poetischem Register. „Angesicht“ ist bewusst leicht gehoben, da es die feste biblische Bildsprache natürlicher bewahrt als das alltägliche „Gesicht“.
