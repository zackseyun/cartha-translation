base_translation:
  language: en
  yaml_path: translation/ot/job/013/004.yaml
  text: But you are plasterers of lies[b][a]; all of you are worthless physicians.
translation:
  language: de
  text: Doch ihr übertüncht mit Lügen[a]; wertlose Ärzte[b] seid ihr alle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr beschmiert mit Falschheit“ beziehungsweise „ihr erdichtet Lügen“. Das hebräische Wort kann Bestreichen oder Übertünchen bezeichnen und bewahrt hier wohl das Bild, dass sie die Wirklichkeit mit Lügen überdecken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ärzte ohne Wert“. Die Wiedergabe „Götzenärzte“ ist aufgrund einer anderen Bedeutung des hebräischen Wortes möglich, in diesem Zusammenhang aber weniger wahrscheinlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Doch
  rationale: Leitet einen scharfen Gegensatz zu den vorangehenden Worten ein und entspricht dem gehobenen, aber natürlichen Ton von Hiobs Rede.
- source_word: אַתֶּם
  choice: ihr
  rationale: Gibt die direkte Anrede in der zweiten Person Plural eindeutig wieder.
- source_word: טֹפְלֵי שָׁקֶר
  choice: ihr übertüncht alles mit Lügen
  rationale: טפל bezeichnet hier wahrscheinlich das Bestreichen oder Übertünchen. Die verbale deutsche Fassung bewahrt das konkrete Bild und klingt natürlicher als das ungewöhnliche Substantiv „Übertüncher“. „Alles“ verdeutlicht idiomatisch das mitgedachte Objekt des Überdeckens, ohne einen neuen konkreten Gegenstand festzulegen.
- source_word: רֹפְאֵי
  choice: Ärzte
  rationale: Bewahrt das Bild von Heilkundigen, die in ihrer Aufgabe versagen; „Ärzte“ ist im modernen Standarddeutsch klar und würdig.
- source_word: אֱלִל
  choice: untaugliche
  rationale: אֱלִל bezeichnet hier am ehesten Wertlosigkeit oder Nichtigkeit. Im Zusammenhang mit Ärzten bringt „untauglich“ präzise zum Ausdruck, dass sie nichts ausrichten können.
- source_word: כֻּלְּכֶם
  choice: ihr alle
  rationale: Bewahrt den umfassenden und durch die Schlussstellung betonten Vorwurf gegen sämtliche Gesprächspartner.
theological_decisions:
- issue: Bedeutung von אֱלִל
  choice: Als Bezeichnung der Wertlosigkeit beziehungsweise Untauglichkeit der Ärzte verstanden.
  alternative: „Götzenärzte“ oder „Ärzte des Nichts“.
  rationale: Obwohl אֱלִל auch „Götze“ bedeuten kann, passt in dieser Verbindung die Bedeutung „wertlos, nichtig“ besser und vermeidet eine sachlich unbegründete Aussage über Götzendienst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem rhetorischem Ton. Die Umstellung im zweiten Satzteil erhält die emphatische Schlussaussage „ihr alle“; das Bild des Übertünchens bleibt erhalten, ohne die schwerfällige Bildung „Übertüncher der Lüge“ zu verwenden.
