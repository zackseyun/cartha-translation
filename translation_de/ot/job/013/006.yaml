  language: de
  text: Hört doch meine Darlegung[a] an und achtet auf die Einwände meiner Lippen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Zurechtweisung“ beziehungsweise „meine Beweisführung“. Das hebräische Wort kann Tadel, Berichtigung oder eine begründete Darlegung bezeichnen.'
