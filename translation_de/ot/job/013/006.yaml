  terminology: Keine theologischen Fachbegriffe sind betroffen. „Einwände“ gibt die streitende bzw. forensische Dimension von רִבוֹת idiomatischer wieder, ohne daraus ausdrücklich eine gerichtliche Klage zu machen. Die Fußnoten bewahren die lexikalischen Alternativen und die semantische Offenheit von תוֹכַחְתִּי und רִבוֹת.
