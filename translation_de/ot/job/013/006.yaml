    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: Hört doch … an
  rationale: Der pluralische Imperativ ruft die Angesprochenen zum Zuhören auf; נָא mildert und verstärkt die Bitte. „Doch“ gibt diese bittende Aufforderung in natürlichem Deutsch wieder.
- source_word: תוֹכַחְתִּי
  choice: meine Darlegung
  rationale: Das Substantiv kann Zurechtweisung, Beweisführung oder eine begründete Darlegung bezeichnen. Im forensisch geprägten Zusammenhang bezeichnet „Darlegung“ Hiobs vorgebrachten Gedankengang, ohne die Bedeutung auf einen Tadel zu verengen.
- source_word: וְרִבוֹת
  choice: und die Streitsachen
  rationale: Die Form gehört zum Wortfeld von Streit, Rechtsstreit und rechtlichem Vorbringen. „Streitsachen“ bewahrt den forensischen Klang und zugleich den ungewöhnlichen poetischen Ausdruck.
- source_word: שְׂפָתַי
  choice: meiner Lippen
  rationale: Die konkrete hebräische Metapher wird wörtlich bewahrt, statt sie zu „meine Worte“ zu verflachen.
- source_word: הַקְשִׁיבוּ
  choice: achtet auf
  rationale: Der Imperativ bezeichnet aufmerksames Hinhören. „Achtet auf“ unterscheidet ihn natürlich von שׁמע im ersten Halbvers und erhält die Steigerung des Parallelismus.
theological_decisions: []
