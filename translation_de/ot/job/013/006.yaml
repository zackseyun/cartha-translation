  source_fidelity: Der erste Halbvers gibt שִׁמְעוּ נָא und תוֹכַחְתִּי zutreffend als höfliche Aufforderung wieder; „Darlegung“ ist im forensischen Kontext eine angemessene, nicht einengende Wiedergabe. Im zweiten Halbvers wahrt „achtet auf“ die gesteigerte Aufmerksamkeit von הַקְשִׁיבוּ. „Streitsachen“ bezeichnet im Deutschen jedoch gewöhnlich die Gegenstände eines Rechtsstreits, nicht die von Hiobs Lippen vorgebrachten Einwände bzw. Streitargumente (רִבוֹת).
