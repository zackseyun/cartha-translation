source:
  edition: WLC
  text: כַּ֭פְּ/ךָ מֵ/עָלַ֣/י הַרְחַ֑ק וְ֝/אֵ֥מָתְ/ךָ֗ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/021.yaml
  text: Withdraw your hand far from me[b][a], and do not let your dread terrify me.
translation:
  language: de
  text: Halte deine Hand von mir fern, und dein Schrecken versetze mich nicht in Angst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּפְּךָ
  choice: deine Hand
  rationale: כַּף bezeichnet wörtlich Handfläche oder Hand. „Hand“ bewahrt das konkrete, anthropomorphe Bild und ist im Deutschen idiomatisch.
- source_word: מֵעָלַי הַרְחַק
  choice: halte … von mir fern
  rationale: Der Hifil-Imperativ von רחק fordert dazu auf, etwas auf Abstand zu bringen beziehungsweise fernzuhalten; מֵעָלַי bezeichnet die Entfernung von dem, was auf Job liegt. Die Formulierung ist natürlich und erhält das Bild der bedrückenden Hand.
- source_word: אֵמָתְךָ
  choice: dein Schrecken
  rationale: אֵימָה bezeichnet Schrecken oder Entsetzen. „Dein Schrecken“ bewahrt den Bezug zu Gott, ohne ihn vorschnell als bloß subjektive Gottesfurcht zu deuten.
- source_word: אַל תְּבַעֲתַנִּי
  choice: versetze mich nicht in Angst
  rationale: בעת bedeutet erschrecken, bestürzen oder in Angst versetzen. Die gewählte Formulierung gibt das Verbot klar wieder und lässt „dein Schrecken“ wie im Hebräischen als Subjekt stehen.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Hand
  choice: Das konkrete Bild „deine Hand“ wird beibehalten.
  alternative: deine Macht; dein Schlag; deine Bedrückung
  rationale: Der hebräische Text nennt ausdrücklich Gottes Hand. Eine abstrakte Deutung würde vorwegnehmen, ob Macht, Strafe, Leiden oder Druck gemeint ist.
- issue: Bedeutung von „dein Schrecken“
  choice: Die mehrdeutige Zuordnung als von Gott ausgehender beziehungsweise mit ihm verbundener Schrecken bleibt bestehen.
  alternative: die Angst vor dir
  rationale: Der Suffixausdruck kann den von Gott ausgehenden oder durch seine Gegenwart hervorgerufenen Schrecken bezeichnen. Die Übersetzung löst diese Spannung nicht einseitig auf.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit direkter Anrede. Der parallele Aufbau der beiden Bitten und die poetische Bildsprache bleiben erhalten.
