  source_fidelity: Die Übersetzung gibt den Hifil-Imperativ הַרְחַק treffend als Bitte wieder und bewahrt mit „deine Hand“ das konkrete Bild von כַּפְּךָ. „von mir fern“ vermittelt die Entfernung von Job, die mit מֵעָלַי verbunden ist, ohne die Metapher unnötig auszudeuten. „Dein Schrecken“ entspricht אֵמָתְךָ; der anschließende Prohibitivsatz gibt אַל תְּבַעֲתַנִּי angemessen wieder.
  naturalness: „Halte deine Hand von mir fern“ ist modernes, verständliches Standarddeutsch und wahrt den gehobenen poetischen Registerton. „Dein Schrecken versetze mich nicht in Angst“ ist bewusst leicht formal und als Bitte gut verständlich; die Wiederaufnahme von Schrecken und Angst spiegelt die intensive Aussage, ohne unnatürlich zu wirken.
  terminology: Die Schlüsselbegriffe sind sachgerecht und theologisch nicht einengend wiedergegeben. Insbesondere bleibt „deine Hand“ anthropomorph und „dein Schrecken“ offen für den von Gott ausgehenden bzw. mit seiner Gegenwart verbundenen Schrecken. Es sind keine Fußnoten erforderlich.
