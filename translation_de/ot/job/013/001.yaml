  yaml_path: translation/ot/job/013/001.yaml
  text: Look[a], my eye has seen all this; my ear has heard and understood it.
translation:
  language: de
  text: Sieh, dies alles hat mein Auge gesehen; mein Ohr hat es gehört und erfasst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und verstanden“ / „und erwogen“. Wörtlich setzt das Hebräische etwa fort: „und verstand für sich“; gemeint ist, dass das Gehörte begriffen wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel leitet eine nachdrückliche Feststellung ein. „Sieh“ bewahrt ihre hinweisende Kraft in heutigem, würdigem Deutsch.
- source_word: כֹּל
  choice: dies alles
  rationale: Das wörtliche „alles“ fasst die zuvor behandelten Dinge zusammen; „dies alles“ macht diesen Rückbezug im Deutschen natürlich deutlich.
- source_word: רָאֲתָה עֵינִי
  choice: hat mein Auge gesehen
  rationale: Die auffällige Einzahl „mein Auge“ bleibt erhalten und bildet den poetischen Parallelismus mit „mein Ohr“ ab.
- source_word: שָׁמְעָה אָזְנִי
  choice: mein Ohr hat es gehört
  rationale: Die Einzahl des Körperteils wird entsprechend dem Hebräischen bewahrt; das Pronomen „es“ nimmt „dies alles“ idiomatisch wieder auf.
- source_word: וַתָּבֶן לָהּ
  choice: und erfasst
  rationale: Das Verb בין bezeichnet verstehendes Erfassen oder Unterscheiden. Die feminine Verbform knüpft am natürlichsten an „mein Ohr“ an; „erfasst“ drückt aus, dass das Gehörte auch begriffen wurde, ohne die schwer nachzubildende pronominale Wendung übermäßig wörtlich wiederzugeben.
theological_decisions: []
