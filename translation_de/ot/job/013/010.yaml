  text: הוֹכֵ֣חַ יוֹכִ֣יחַ אֶתְ/כֶ֑ם אִם בַּ֝/סֵּ֗תֶר פָּנִ֥ים תִּשָּׂאֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/010.yaml
  text: He will surely rebuke you if in secret you show partiality[a].
translation:
  language: de
  text: Er wird euch gewiss zurechtweisen, wenn ihr heimlich parteiisch seid[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gesichter erhebt“; eine hebräische Redewendung für parteiisches Bevorzugen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ יוֹכִיחַ
  choice: wird gewiss zurechtweisen
  rationale: Der absolute Infinitiv mit der finiten Form von יכח verstärkt die Aussage. „Gewiss“ gibt diese Betonung wieder; „zurechtweisen“ bewahrt hier den tadelnden und prüfenden Sinn.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Das Pronomen ist maskulin Plural und bezeichnet Hiobs Freunde als Gruppe.
- source_word: אִם
  choice: wenn
  rationale: „Wenn“ drückt im Deutschen die reale Bedingung einer Warnung natürlich aus, ohne die Handlung als bereits feststehend zu behaupten.
- source_word: בַּסֵּתֶר
  choice: im Verborgenen
  rationale: Die Präposition mit סתר bezeichnet verborgenes, nicht offen erkennbares Handeln. „Im Verborgenen“ erhält diese konkrete Nuance.
- source_word: פָּנִים תִּשָּׂאוּן
  choice: ihr Partei ergreift
  rationale: Die feste Wendung נשׂא פנים bedeutet wörtlich „Gesichter erheben“, idiomatisch jedoch, jemanden parteiisch zu bevorzugen. „Partei ergreifen“ ist im Kontext von Hiobs Vorwurf an seine Freunde natürlich und bewahrt die ethisch-juristische Stoßrichtung.
theological_decisions:
- issue: Wiedergabe der Wendung נשׂא פנים
  choice: Partei ergreift
  alternative: Parteilichkeit übt; jemanden bevorzugt; Gesichter erhebt
  rationale: Die Wendung bezeichnet eine sachwidrige Bevorzugung, besonders im Zusammenhang mit Urteil und Fürsprache. Im Kontext warnt Hiob seine Freunde davor, selbst zugunsten Gottes voreingenommen zu argumentieren. Die Übersetzung legt nicht näher fest, auf welche Weise diese Parteinahme geschieht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die nachdrückliche hebräische Verbkonstruktion wird durch „gewiss“ wiedergegeben; die idiomatische Wendung wird im Haupttext verständlich übersetzt und in der Fußnote wörtlich erläutert.
