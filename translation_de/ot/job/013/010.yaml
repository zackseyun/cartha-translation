  source_fidelity: Die Verstärkung durch Infinitivus absolutus (הוֹכֵחַ יוֹכִיחַ) ist mit „gewiss zurechtweisen“ angemessen wiedergegeben. Auch die Konditionalstruktur und die adverbiale Bestimmung בַּסֵּתֶר sind erhalten. „Partei ergreifen“ kann jedoch auch eine berechtigte Positionierung bezeichnen und gibt die in נשׂא פָּנִים enthaltene Bedeutung ungebührlicher Parteilichkeit nicht hinreichend deutlich wieder.
  naturalness: „Er wird euch gewiss zurechtweisen, wenn ihr heimlich parteiisch seid“ ist modernes, idiomatisches Standarddeutsch und bewahrt den knappen, warnenden Charakter des Verses.
  terminology: Für נשׂא פָּנִים ist „parteiisch sein“ im Deutschen präziser als „Partei ergreifen“, weil es die negative Konnotation von Begünstigung bzw. Parteilichkeit trägt, ohne ein nicht im Hebräischen genanntes Objekt einzuführen. Die Fußnote erläutert die wörtliche Bildsprache sachgerecht.
