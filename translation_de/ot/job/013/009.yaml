  text: הֲ֭/טוֹב כִּֽי יַחְקֹ֣ר אֶתְ/כֶ֑ם אִם כְּ/הָתֵ֥ל בֶּ֝/אֱנ֗וֹשׁ תְּהָתֵ֥לּוּ בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/009.yaml
  text: Will it be good when he examines you? Or will you mock him as one mocks a man?[a][b]
translation:
  language: de
  text: Wird es gut für euch ausgehen, wenn er euch erforscht? Oder werdet ihr ihn täuschen, wie man einen Menschen täuscht?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihn verspotten« oder »sein Spiel mit ihm treiben«. Das hebräische Verb kann Täuschung, Spott oder ein respektloses Spiel mit jemandem bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב כִּי
  choice: Wird es gut für euch ausgehen, wenn
  rationale: Die rhetorische Frage blickt im Zusammenhang auf das Ergebnis der bevorstehenden göttlichen Prüfung. „Für euch ausgehen“ macht den im Hebräischen knappen Bezug auf die Angeredeten im Deutschen natürlich deutlich, ohne den Sinn festzulegen, als ginge es um moralische Güte.
- source_word: יַחְקֹר אֶתְכֶם
  choice: er euch erforscht
  rationale: חקר bezeichnet gründliches Erforschen oder Untersuchen. „Erforscht“ bewahrt die intensive Prüfung und passt zum würdevollen Register.
- source_word: אִם
  choice: Oder
  rationale: אִם leitet hier die zweite, parallele rhetorische Frage ein; im Deutschen gibt „Oder“ diese Alternative natürlich wieder.
- source_word: כְּהָתֵל בֶּאֱנוֹשׁ
  choice: wie man einen Menschen täuscht
  rationale: Die Vergleichskonstruktion stellt Gottes Behandlung der Behandlung eines Menschen gegenüber. התל kann täuschen, verspotten oder sein Spiel mit jemandem treiben bedeuten; „täuschen“ ergibt mit der Vorstellung, Gottes Prüfung entgehen zu wollen, einen klaren und quellennahen Satz.
- source_word: תְּהָתֵלּוּ בוֹ
  choice: könnt ihr ihn täuschen
  rationale: Die rhetorische Frage zielt auf die Unmöglichkeit, Gott so zu behandeln wie einen Menschen. Das deutsche Modalverb „könnt“ bringt diese pragmatische Stoßrichtung natürlich zum Ausdruck; die lexikalische Mehrdeutigkeit von התל wird in der Fußnote bewahrt.
- source_word: אֱנוֹשׁ
  choice: einen Menschen
  rationale: אֱנוֹשׁ bezeichnet den Menschen und kann dessen Schwachheit oder Sterblichkeit anklingen lassen. „Mensch“ ist hier natürlich und erhält den Gegensatz zu Gott.
theological_decisions:
- issue: Bezug der Pronomen in der dritten Person Singular
  choice: Die Pronomen beziehen sich im Kontext auf Gott, der die Angeredeten erforscht und nicht getäuscht werden kann.
  alternative: Ein nicht näher bestimmter Prüfer oder Richter.
  rationale: Hiob 13,7–11 handelt davon, dass die Freunde zugunsten Gottes unrichtig reden und deshalb mit seiner Prüfung rechnen müssen. Der deutsche Text belässt die Pronomen und fügt den Gottesnamen nicht erklärend ein.
- issue: Semantische Spannung von התל
  choice: Im Haupttext steht „täuschen“, die Bedeutungen „verspotten“ und „sein Spiel mit jemandem treiben“ bleiben in der Fußnote sichtbar.
  alternative: Im Haupttext „verspotten“ oder „sein Spiel mit ihm treiben“.
  rationale: Der Zusammenhang göttlicher Durchforschung begünstigt „täuschen“, während die Vergleichsformulierung auch Spott oder respektloses Spiel zulässt. Die Fußnote verhindert eine unnötige Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe bleibt erhalten; „einen Menschen“ ist allgemein-menschlich gemeint und steht im Gegensatz zu Gott. Der einzige Fußnotenmarker [a] erscheint unmittelbar nach dem mehrdeutigen zweiten Fragesatz.
