  text: הֵ֣ן יִ֭קְטְלֵ/נִי לא אֲיַחֵ֑ל אַךְ דְּ֝רָכַ֗/י אֶל פָּנָ֥י/ו אוֹכִֽיחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/015.yaml
  text: Though he slay me[a], I will not hope; yet I will argue my ways before him.
translation:
  language: de
  text: Mag er mich auch töten[a] – ich werde nicht hoffen; doch vor ihm will ich mein Verhalten verteidigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionelle Wiedergabe: „Auch wenn er mich tötet, will ich doch auf ihn hoffen.“ Sie beruht auf einer alternativen Lesart des Hebräischen.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Mag … auch
  rationale: הֵן ist eigentlich hervorhebend („siehe“, „gewiss“), kann in diesem Zusammenhang aber zusammen mit dem folgenden Satz eine einräumende Zuspitzung ausdrücken. „Mag … auch“ gibt diese Wirkung in natürlichem Deutsch wieder.
- source_word: יִקְטְלֵנִי
  choice: er mich töten
  rationale: קטל bedeutet „töten“. Das deutsche „töten“ ist klar, würdig und weniger stilistisch altertümlich als „erschlagen“.
- source_word: לֹא אֲיַחֵל
  choice: ich werde nicht hoffen
  rationale: Der vorliegende masoretische Text hat לֹא („nicht“). יחל kann „warten“ oder „hoffen“ bedeuten; „hoffen“ bewahrt hier die semantische und theologische Spannung, ohne ein Objekt zu ergänzen.
- source_word: אַךְ
  choice: doch
  rationale: 'אַךְ markiert hier die Gegenbewegung: Trotz der Aussicht auf den Tod wird Hiob seine Sache vor Gott darlegen.'
- source_word: דְּרָכַי
  choice: meine Wege
  rationale: Die wörtliche Bildsprache bezeichnet Hiobs Lebensführung beziehungsweise sein Verhalten und bleibt auch im Deutschen verständlich.
- source_word: אֶל־פָּנָיו
  choice: vor ihm
  rationale: Wörtlich „zu seinem Angesicht“; „vor ihm“ gibt idiomatisch die unmittelbare Gegenwart Gottes wieder.
- source_word: אוֹכִיחַ
  choice: will ich … verteidigen
  rationale: Das Hifil von יכח bezeichnet im rechtlichen beziehungsweise disputativen Zusammenhang das Darlegen oder Verfechten einer Sache. Mit „meine Wege verteidigen“ ist der juristische Sinn im Deutschen natürlich ausgedrückt.
theological_decisions:
- issue: Masoretische Verneinung oder traditionelle Lesart des Hoffnungssatzes
  choice: 'Der Haupttext folgt לֹא: „ich werde nicht hoffen“.'
  alternative: „Auch wenn er mich tötet, will ich doch auf ihn hoffen.“
  rationale: Der vorgelegte WLC-Text liest ausdrücklich לֹא („nicht“), nicht לוֹ („auf ihn/ihm“). Daher bleibt die Verneinung im Haupttext stehen. Die traditionsreiche alternative Lesart wird wegen ihrer textgeschichtlichen und theologischen Bedeutung in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich hebt die schroffe Spannung hervor; „meine Wege“ bewahrt die hebräische Bildsprache, während „verteidigen“ den rechtlichen Kontext für heutige Leser erschließt.
