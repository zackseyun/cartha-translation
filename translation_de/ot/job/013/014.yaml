translation:
  language: de
  text: Warum sollte ich mein Fleisch zwischen meine Zähne nehmen[a] und mein Leben in meine Hand nehmen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum sollte ich mein Fleisch mit meinen Zähnen nehmen?“ Die hebräische Wendung ist schwierig; wahrscheinlich beschreibt sie rücksichtslose Selbstgefährdung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mein Leben in meine Hand setzen/legen“. Oder: „meine Seele“; das hebräische Wort kann „Leben“, „Seele“ oder „Selbst“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: Warum sollte
  rationale: Die Wendung leitet hier eine rhetorische Frage nach Grund oder Zweck ein. „Warum sollte“ ist im Deutschen natürlich und bewahrt ihre fragende Kraft.
- source_word: אֶשָּׂא
  choice: sollte ich … nehmen
  rationale: נשא kann „heben“, „tragen“ oder „nehmen“ bedeuten. In Verbindung mit dem schwierigen Bild vom Fleisch zwischen den Zähnen passt „nehmen“ am besten.
- source_word: בְשָׂרִי
  choice: mein Fleisch
  rationale: Die konkrete Bedeutung „Fleisch“ bewahrt das eindringliche hebräische Bild besser als das glättende „Körper“.
- source_word: בְשִׁנָּי
  choice: zwischen meine Zähne
  rationale: Wörtlich steht „in/mit meinen Zähnen“. „Zwischen meine Zähne“ gibt die räumliche Vorstellung in natürlichem Deutsch wieder, ohne die schwierige Wendung auszudeuten.
- source_word: וְנַפְשִׁי
  choice: mein Leben
  rationale: נפש kann „Leben“, „Seele“ oder „Selbst“ bedeuten. Im Zusammenhang bewusster Selbstgefährdung vermittelt „Leben“ den gemeinten Sinn am klarsten.
- source_word: אָשִׂים בְּכַפִּי
  choice: aufs Spiel setzen
  rationale: Wörtlich lautet die Wendung „in meine Handfläche/Hand legen“. Gemeint ist, das eigene Leben einer offenkundigen Gefahr auszusetzen; die deutsche Redewendung gibt diese Funktion natürlich wieder.
theological_decisions:
- issue: Bedeutung von נפש
  choice: Leben
  alternative: Seele
  rationale: Der Vers handelt von der Gefährdung des eigenen Lebens. „Seele“ wäre lexikalisch möglich, könnte im heutigen Deutsch aber unnötig eine vom Körper getrennte Wesenheit nahelegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das erste, bewusst rätselhafte Bild bleibt konkret erhalten; die zweite hebräische Gefährdungswendung wird mit einer geläufigen deutschen Redewendung wiedergegeben und in der Fußnote wörtlich dokumentiert.
