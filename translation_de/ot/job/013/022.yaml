  yaml_path: translation/ot/job/013/022.yaml
  text: Then call[a], and I will answer; or let me speak, and you reply to me.
translation:
  language: de
  text: Dann ruf[a], und ich werde antworten; oder lass mich reden, und antworte du mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und ruf, und ich werde antworten; oder ich werde reden, und antworte mir.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָא
  choice: Dann ruf
  rationale: Der Qal-Imperativ 2. Person Singular von קרא eröffnet die erste von zwei möglichen Gesprächsordnungen. „Dann“ gibt den Zusammenhang im Deutschen natürlich wieder; formal wäre auch „Und ruf“ oder schlicht „Ruf“ möglich.
- source_word: וְאָנֹכִי
  choice: und ich
  rationale: Das selbstständige Pronomen אָנֹכִי hebt das Subjekt hervor. Das ausdrücklich gesetzte „ich“ bewahrt diese Betonung in natürlichem Deutsch.
- source_word: אֶעֱנֶה
  choice: werde antworten
  rationale: Der Qal-Imperfekt 1. Person Singular von ענה bezeichnet hier Jobs zugesagte Antwort, falls Gott ihn ruft.
- source_word: אוֹ
  choice: oder
  rationale: Die disjunktive Partikel führt die umgekehrte Gesprächsordnung als Alternative ein.
- source_word: אֲדַבֵּר
  choice: lass mich reden
  rationale: Der Piel-Imperfekt 1. Person Singular von דבר ist in dieser Gegenüberstellung am natürlichsten als Vorschlag beziehungsweise Bitte wiedergegeben. Formal ist auch „ich werde reden“ möglich.
- source_word: וַהֲשִׁיבֵנִי
  choice: und antworte du mir
  rationale: Der Hiphil-Imperativ 2. Person Singular mit Suffix der 1. Person Singular von שוב fordert Gott zur Erwiderung auf. Das betonte „du“ verdeutlicht den wechselseitigen Aufbau, ohne den Sinn zu erweitern.
theological_decisions: []
