  text: אַךְ שְׁ֭תַּיִם אַל תַּ֣עַשׂ עִמָּדִ֑/י אָ֥ז מִ֝/פָּנֶ֗י/ךָ לֹ֣א אֶסָּתֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/020.yaml
  text: 'Only do not do two things to me[a]; then I will not hide myself from your face:'
translation:
  language: de
  text: 'Nur zweierlei tu mir nicht an; dann werde ich mich nicht vor deinem Angesicht verbergen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Nur
  rationale: Die Partikel schränkt Ijobs Bitte ein und leitet die eine Bedingung ein, unter der er bereit ist, Gott gegenüberzutreten.
- source_word: שְׁתַּיִם
  choice: zweierlei
  rationale: Das feminine Zahlwort steht ohne ausdrückliches Bezugswort. „Zweierlei“ gibt diese substantivische Verwendung im Deutschen knapp und natürlich wieder.
- source_word: אַל תַּעַשׂ עִמָּדִי
  choice: tu mir nicht an
  rationale: עשה mit עִם bezeichnet hier ein Handeln an bzw. gegenüber Ijob. Die Formulierung verweist voraus auf die beiden belastenden Handlungen, die im folgenden Vers genannt werden.
- source_word: אָז
  choice: dann
  rationale: Das Adverb kennzeichnet die Folge, die eintritt, wenn Gott Ijobs Bitte erfüllt.
- source_word: מִפָּנֶיךָ
  choice: vor deinem Angesicht
  rationale: Die Wendung bewahrt das konkrete Bild von Gottes Angesicht und trägt zugleich die idiomatische Bedeutung seiner Gegenwart.
- source_word: לֹא אֶסָּתֵר
  choice: werde ich mich nicht … verbergen
  rationale: 'Der Nifal wird im Zusammenhang reflexiv beziehungsweise intransitiv verstanden: Ijob wird sich Gott nicht entziehen oder vor ihm verstecken.'
theological_decisions:
- issue: Ijobs Haltung gegenüber Gott
  choice: Die Aussage bleibt als bedingte Bereitschaft formuliert, vor Gott hervorzutreten.
  alternative: Die Wendung ausdrücklich als Furchtlosigkeit oder als gerichtliche Zuversicht deuten.
  rationale: Der hebräische Text sagt lediglich, dass Ijob sich nicht verbergen wird; eine weitergehende theologische oder psychologische Deutung sollte nicht in die Übersetzung eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zweierlei“ ist knapp und verweist natürlich auf die zwei Bitten des Folgeverses; „vor deinem Angesicht“ erhält die bildhafte Sprache des Hebräischen.
