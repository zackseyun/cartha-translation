  text: Listen carefully to my word[a], and let my declaration be in your ears.
translation:
  language: de
  text: Hört aufmerksam auf mein Wort und nehmt meine Darlegung zu Ohren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und meine Darlegung in euren Ohren“. Für „Darlegung“ auch: „Erklärung“ oder „Äußerung“.'
    reason: Die Fußnote bewahrt die elliptische, konkrete hebräische Formulierung und dokumentiert die Bedeutungsbreite von אַחֲוָה.
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Hört genau
  rationale: Die Verbindung aus finitem Verb und Infinitivus absolutus verstärkt die Aufforderung. „Hört genau“ gibt diesen Nachdruck in natürlichem modernem Deutsch wieder.
- source_word: מִלָּתִי
  choice: mein Wort
  rationale: מִלָּה bezeichnet hier ein Wort beziehungsweise eine Rede. „Mein Wort“ bewahrt den Singular und den feierlichen, direkten Ton.
- source_word: וַאֲחֲוָתִי
  choice: meine Darlegung
  rationale: Das von חוה abgeleitete Substantiv bezeichnet hier das, was Hiob darlegt oder erklärt. „Darlegung“ ist im Deutschen natürlich und wahrt die mögliche erklärende Nuance.
- source_word: בְּאָזְנֵיכֶם
  choice: in eure Ohren dringen
  rationale: Die hebräische Wendung lautet wörtlich „in euren Ohren“. Mit „in eure Ohren dringen“ bleibt das konkrete Bild erhalten, während der Satz im Deutschen idiomatisch und als Aufforderung verständlich ist.
