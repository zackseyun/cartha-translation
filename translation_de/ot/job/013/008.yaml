  text: הֲ/פָנָ֥י/ו תִּשָּׂא֑וּ/ן אִם לָ/אֵ֥ל תְּרִיבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/008.yaml
  text: Will you show partiality for him? Will you contend for God?[a][b]
translation:
  language: de
  text: Wollt ihr für ihn Partei ergreifen?[a] Wollt ihr für Gott streiten?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wollt ihr sein Gesicht erheben?« Das ist eine hebräische Redewendung für Parteilichkeit oder Begünstigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Wollt ihr Gottes Sache vertreten?«'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲפָנָיו תִּשָּׂאוּן
  choice: Wollt ihr für ihn Partei ergreifen?
  rationale: Die Wendung bedeutet wörtlich, jemandes Gesicht zu erheben, bezeichnet in einem rechtlichen oder streitenden Zusammenhang aber Parteilichkeit beziehungsweise Begünstigung. „Für ihn Partei ergreifen“ gibt sowohl die Voreingenommenheit als auch den argumentativen Kontext natürlich wieder.
- source_word: אִם
  choice: Beginn einer zweiten Frage
  rationale: אִם leitet hier parallel zur ersten Frage eine weitere rhetorische Frage ein. Im Deutschen wird die interrogative Kraft durch einen neuen Fragesatz klarer und natürlicher ausgedrückt als durch ein wörtliches „wenn“; auch „oder“ wäre möglich.
- source_word: לָאֵל
  choice: für Gott
  rationale: אֵל bezeichnet hier Gott; ל kennzeichnet die Person, zu deren Gunsten oder in deren Interesse gestritten wird.
- source_word: תְּרִיבוּן
  choice: Wollt ihr … streiten?
  rationale: 'ריב hat einen rechtlichen und kontroversen Bedeutungsbereich: streiten, einen Rechtsstreit führen oder eine Sache vertreten. „Streiten“ erhält die Breite des Ausdrucks, ohne ein förmliches Gerichtsverfahren vorauszusetzen.'
theological_decisions:
- issue: Ob Hiob seinen Freunden vorwirft, Gott mit parteiischer Fürsprache zu verteidigen
  choice: Zwei rhetorische Fragen werfen den Freunden Parteilichkeit für Gott und ein Streiten für ihn vor.
  alternative: Die zweite Frage kann enger forensisch als „Wollt ihr Gottes Sache vertreten?“ oder „Wollt ihr für Gott plädieren?“ verstanden werden.
  rationale: Der Zusammenhang stellt die Freunde als voreingenommene Verteidiger Gottes dar. Die Übersetzung bewahrt jedoch mit „streiten“ den weiteren Bedeutungsumfang von ריב und legt keine bestimmte Form der Fürsprache fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Anrede im Plural wird durch „ihr“ eindeutig wiedergegeben. „Partei ergreifen“ ist idiomatisch und passt zum Streitkontext; „streiten“ bewahrt die rechtliche wie allgemein kontroverse Spannung des hebräischen Verbs.
