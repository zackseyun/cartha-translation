  text: הַ֭/לְ/אֵל תְּדַבְּר֣וּ עַוְלָ֑ה וְ֝/ל֗/וֹ תְּֽדַבְּר֥וּ רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/007.yaml
  text: Will you speak injustice for God[a], and deceit for him?
translation:
  language: de
  text: Wollt ihr für Gott Unrecht reden und für ihn Trug reden[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wollt ihr zu Gott Unrecht reden und zu ihm Trug reden?“ Die hebräische Präposition kann auch „zu“ bedeuten; der Zusammenhang legt jedoch nahe, dass Hiob seinen Freunden vorwirft, Gott durch unlautere Aussagen zu verteidigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלְאֵל
  choice: für Gott
  rationale: Die Präposition ל kann hier denjenigen bezeichnen, zu dessen Gunsten oder in dessen Vertretung gesprochen wird. Im Zusammenhang wirft Hiob seinen Freunden vor, Gott mit unlauteren Argumenten zu verteidigen.
- source_word: תְּדַבְּרוּ
  choice: wollt ihr … reden / aussprechen
  rationale: Das Imperfekt in der rhetorischen Frage hat den Ton einer vorwurfsvollen Herausforderung. „Wollt ihr“ gibt diesen Ton im Deutschen natürlich wieder.
- source_word: עַוְלָה
  choice: Unrecht
  rationale: Das Wort bezeichnet moralisch oder rechtlich Verkehrtes. „Unrecht“ bewahrt dieses Gewicht und lässt zugleich Raum für die im Kontext mitschwingende Bedeutung falscher Rede.
- source_word: וְלוֹ
  choice: für ihn
  rationale: Das Pronomen verweist auf Gott; die Wiedergabe hält die parallele Konstruktion beider Satzhälften fest.
- source_word: רְמִיָּה
  choice: Täuschung
  rationale: Das Abstraktum bezeichnet Täuschung, Trug oder Arglist. „Täuschung“ unterscheidet sich klar von „Unrecht“ und passt als Gegenstand des Redens.
theological_decisions:
- issue: Ob Hiobs Freunde zu Gott oder zu seinen Gunsten sprechen
  choice: Sie sprechen für Gott, also zu seiner Verteidigung.
  alternative: Sie sprechen Unrecht zu Gott.
  rationale: Der nähere Zusammenhang, besonders Hiob 13,8, handelt davon, dass die Freunde für Gott Partei ergreifen. Die Übersetzung wahrt dennoch durch eine Fußnote die grammatisch mögliche Deutung als Rede zu Gott.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe wird durch „Wollt ihr“ bewahrt. „Aussprechen“ in der zweiten Hälfte vermeidet im Deutschen eine harte Wiederholung, ohne das im Hebräischen wiederholte Verb inhaltlich auszulassen.
