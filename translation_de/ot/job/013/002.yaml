lexical_decisions:
- source_word: כְּדַעְתְּכֶם
  choice: Was ihr wisst
  rationale: Die Präposition כְּ mit דַּעַת und dem Suffix der 2. Person Plural stellt Hiobs Wissen dem seiner Freunde vergleichend gegenüber. „Was ihr wisst“ gibt diesen Sinn im Deutschen natürlich wieder und bildet einen klaren Parallelismus zu „weiß auch ich“.
- source_word: יָדַעְתִּי
  choice: weiß
  rationale: Das formal perfektive Verb bezeichnet hier einen gegenwärtigen Wissensstand; daher ist das deutsche Präsens sachlich und idiomatisch angemessen.
- source_word: גַם אָנִי
  choice: auch ich
  rationale: גַם und das selbstständige Pronomen betonen, dass Hiob dasselbe Wissen besitzt wie seine Gesprächspartner.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: ich stehe euch nicht nach
  rationale: Das Partizip נֹפֵל mit מִן drückt einen vergleichenden Rückstand oder eine Unterlegenheit aus. Die deutsche Wendung „jemandem nicht nachstehen“ bewahrt den Vergleich und klingt natürlich, ohne die im Zusammenhang naheliegende intellektuelle Hinsicht ausdrücklich in den Text einzutragen.
