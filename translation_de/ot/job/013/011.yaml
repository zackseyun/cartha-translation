base_translation:
  language: en
  yaml_path: translation/ot/job/013/011.yaml
  text: Will not his majesty terrify you[b][a], and his dread fall upon you?
translation:
  language: de
  text: Wird euch seine Erhabenheit[a] nicht in Schrecken versetzen und sein Schrecken[b] über euch fallen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Hoheit« beziehungsweise »seine Erhöhung«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Furcht vor ihm«; gemeint sein kann der Schrecken, den er hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Wird … nicht
  rationale: Leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet; die deutsche Zukunftsform gibt hier die erwartete Folge natürlich wieder.
- source_word: שְׂאֵתוֹ
  choice: seine Erhabenheit
  rationale: Das Substantiv kann Erhöhung, Würde oder erhabenen Rang bezeichnen. „Erhabenheit“ bewahrt diese Bedeutung und passt zum feierlichen Zusammenhang.
- source_word: תְּבַעֵת
  choice: in Schrecken versetzen
  rationale: Die Piel-Form von בעת bezeichnet das Hervorrufen heftigen Schreckens; die deutsche Wendung gibt diese Intensität idiomatisch wieder.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Direktes Objektpronomen der zweiten Person maskulin Plural.
- source_word: וּפַחְדּוֹ
  choice: sein Schrecken
  rationale: Bewahrt die Possessivkonstruktion und lässt offen, ob der von Gott ausgehende Schrecken oder die Furcht vor ihm gemeint ist.
- source_word: יִפֹּל עֲלֵיכֶם
  choice: über euch fallen
  rationale: Erhält das anschauliche hebräische Bild von etwas Überwältigendem, das auf Menschen herabkommt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und das Bild des über die Angesprochenen fallenden Schreckens bleiben erhalten; die Mehrdeutigkeit der hebräischen Possessivverbindung wird nicht aufgelöst.
