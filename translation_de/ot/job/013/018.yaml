  text: See now[a], I have prepared my case; I know that I will be vindicated.
translation:
  language: de
  text: Sieh doch, ich habe meine Rechtssache geordnet; ich weiß, dass ich als im Recht erwiesen werde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Sieh
  rationale: Die Partikelverbindung lenkt nachdrücklich und unmittelbar die Aufmerksamkeit auf Hiobs folgende Aussage. Das gegenwärtige deutsche „Sieh“ bewahrt diesen Aufforderungscharakter, ohne altertümlich zu wirken.
- source_word: עָרַכְתִּי
  choice: ich habe … vorbereitet
  rationale: ערך bezeichnet das Ordnen oder Zurechtlegen. Im gerichtlichen Zusammenhang ist „vorbereitet“ eine natürliche Wiedergabe dafür, dass Hiob seine Sache geordnet dargelegt hat.
- source_word: מִשְׁפָּט
  choice: meinen Rechtsfall
  rationale: מִשְׁפָּט hat hier im Rahmen von Hiobs Gerichtsrede den Sinn einer Rechtssache. „Rechtsfall“ macht den forensischen Zusammenhang deutlich; das Possessivpronomen ergibt sich aus Verbform und Kontext.
- source_word: יָדַעְתִּי
  choice: ich weiß
  rationale: Das Perfekt bezeichnet hier Hiobs gefestigte Gewissheit in der Gegenwart.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet den Inhalt dessen ein, was Hiob weiß.
- source_word: אֲנִי
  choice: ich
  rationale: Das ausdrücklich gesetzte Pronomen hebt Hiob selbst hervor. Im Deutschen bleibt es als notwendiges Subjekt erhalten, auch wenn die zusätzliche hebräische Betonung nur begrenzt abbildbar ist.
- source_word: אֶצְדָּק
  choice: Recht bekommen werde
  rationale: 'Die Form von צדק ist in diesem Zusammenhang forensisch: Hiob erwartet, im Rechtsstreit als im Recht stehend erwiesen beziehungsweise anerkannt zu werden. „Recht bekommen“ ist natürliches modernes Deutsch und vermeidet eine vorschnelle dogmatische Aufladung durch „gerechtfertigt werden“.'
theological_decisions:
- issue: Forensischer Sinn von Hiobs Gewissheit
  choice: Hiob ist überzeugt, in seinem Rechtsstreit Recht zu bekommen.
  alternative: Ich werde gerechtfertigt werden / als gerecht erwiesen werden.
  rationale: Die Gerichtssprache des Zusammenhangs spricht für eine forensische Aussage über Hiobs Sache. Die Übersetzung gibt diese Zuversicht wieder, ohne daraus eine paulinische Rechtfertigungslehre zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, selbstbewusste Aussageform des Hebräischen bleibt erhalten; „Rechtsfall“ und „Recht bekommen“ führen die gerichtliche Bildwelt konsequent fort.
