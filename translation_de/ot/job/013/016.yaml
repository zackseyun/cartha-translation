base_translation:
  language: en
  yaml_path: translation/ot/job/013/016.yaml
  text: This also will be my salvation[b][a], for no godless man may come before him.
translation:
  language: de
  text: Auch das[a] wird mir zur Rettung[b], denn kein Gottloser[c] wird vor ihn treten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Auch er“. Das Pronomen kann sich hier auf das zuvor Gesagte beziehen; möglich ist auch ein persönlicher Bezug.'
    reason: textual_ambiguity
  - marker: b
    text: 'Oder: „Befreiung“; im Zusammenhang möglicherweise auch mit dem Sinn einer Bestätigung von Hiobs Recht.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „Frevler“ oder „Heuchler“. Gemeint ist ein Mensch, der Gott gegenüber ehrfurchtslos ist, nicht nur ein unaufrichtiger Mensch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Auch das
  rationale: גַּם kennzeichnet eine Hinzufügung oder Bekräftigung. Das formal maskuline Pronomen הוּא kann sich im Zusammenhang auf das zuvor Gesagte bzw. die zuvor geschilderte Situation beziehen; „das“ gibt diesen rückverweisenden Sinn im Deutschen natürlich wieder, ohne die formale Alternative zu verschweigen.
- source_word: לִי
  choice: mir
  rationale: In Verbindung mit לִישׁוּעָה bezeichnet לִי den Nutzen bzw. das Ergebnis für Hiob; „mir zur Rettung“ ist idiomatisch und nah an der hebräischen Konstruktion.
- source_word: לִישׁוּעָה
  choice: zur Rettung
  rationale: יְשׁוּעָה bezeichnet Rettung oder Befreiung und kann im Kontext von Hiobs Rechtsstreit auch den Beiklang seiner Rechtserweisung haben. „Rettung“ wahrt die Breite und das feierliche Gewicht des Ausdrucks.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für Hiobs vorausgehende Aussage ein.
- source_word: חָנֵף
  choice: Gottloser
  rationale: Das Wort bezeichnet einen gegenüber Gott ehrfurchtslosen, frevelhaften Menschen, nicht lediglich einen unaufrichtigen Menschen. „Gottloser“ trifft den religiös-moralischen Sinn im modernen Standarddeutsch.
- source_word: לְפָנָיו
  choice: vor ihn
  rationale: Die Präposition bezeichnet das Erscheinen in jemandes Gegenwart. Mit „treten“ ergibt „vor ihn“ eine natürliche und zugleich würdevolle deutsche Wendung.
- source_word: יָבוֹא
  choice: wird … treten
  rationale: Das Imperfekt formuliert hier eine allgemeine bzw. zu erwartende Aussage. „Vor ihn treten“ gibt das hebräische Kommen in die Gegenwart Gottes idiomatisch wieder.
theological_decisions:
- issue: Bezug des Pronomens הוּא
  choice: 'Rückverweis auf das zuvor Gesagte: „das“'
  alternative: „er“, mit möglichem Bezug auf Gott
  rationale: Im Zusammenhang liegt ein Rückverweis auf Hiobs Auftreten bzw. seinen Rechtsgang nahe. Da הוּא formal auch „er“ bedeutet, wird diese echte sprachliche Mehrdeutigkeit in einer Fußnote offengehalten.
- issue: Bedeutung von יְשׁוּעָה in Hiobs Aussage
  choice: „Rettung“ mit möglichem Beiklang von Befreiung und Rechtserweis
  alternative: „Befreiung“ oder „Bestätigung meines Rechts“
  rationale: „Rettung“ bewahrt den weiten Bedeutungsumfang des hebräischen Substantivs. Der forensische Zusammenhang darf mitschwingen, wird aber nicht als einzig möglicher Sinn in den Haupttext eingetragen.
- issue: Bezug von לְפָנָיו
  choice: „ihn“, bezogen auf Gott
  alternative: allgemeiner Bezug auf denjenigen, vor dem Hiob erscheint
  rationale: Der weitere Zusammenhang handelt von Hiobs Auftreten vor Gott. Das Pronomen bleibt im Haupttext jedoch unaufgelöst, sodass keine erklärende Ergänzung in den Wortlaut eingeführt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur folgt dem hebräischen Gedankengang. „Vor ihn treten“ ist verständlicher und idiomatischer als das wörtliche „vor sein Angesicht kommen“, ohne den Gedanken des Erscheinens in Gottes Gegenwart abzuschwächen.
