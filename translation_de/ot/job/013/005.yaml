  yaml_path: translation/ot/job/013/005.yaml
  text: If only you would keep completely silent[a], and it would count as wisdom for you.
translation:
  language: de
  text: Wenn ihr doch nur ganz schweigen würdet – das wäre für euch Weisheit!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Wenn … doch nur
  rationale: Die feste hebräische Wendung drückt einen nachdrücklichen Wunsch aus, keine wörtliche Frage danach, wer etwas geben wird. „Wenn … doch nur“ gibt diesen Wunsch im heutigen Deutsch natürlich wieder.
- source_word: הַחֲרֵשׁ תַּחֲרִישׁוּן
  choice: ihr … ganz schweigen würdet
  rationale: Der Infinitivus absolutus zusammen mit der finiten Verbform verstärkt die Aussage. „Ganz schweigen“ bewahrt sowohl den Gedanken des Schweigens als auch den Nachdruck der hebräischen Konstruktion.
- source_word: וּתְהִי
  choice: Das würde … gelten
  rationale: Die feminine Singularform bezieht sich wahrscheinlich auf das zuvor genannte Schweigen beziehungsweise auf den gesamten Sachverhalt. Die Formulierung macht im Deutschen deutlich, dass ihr Schweigen als Weisheit bewertet würde, ohne den Bezug dogmatisch festzulegen.
- source_word: לָכֶם
  choice: euch
  rationale: Die Präposition ל bezeichnet hier die Beziehung zu den Angesprochenen; im Ausdruck „euch als Weisheit gelten“ wird sie idiomatisch wiedergegeben.
- source_word: לְחָכְמָה
  choice: als Weisheit
  rationale: חָכְמָה bedeutet „Weisheit“. In Verbindung mit היה und ל gibt „als Weisheit gelten“ den prädikativen Sinn in natürlichem Deutsch wieder.
