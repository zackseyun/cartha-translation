  text: הַחֲרִ֣ישׁוּ מִ֭מֶּ/נִּי וַ/אֲדַבְּרָה אָ֑נִי וְ/יַעֲבֹ֖ר עָלַ֣/י מָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/013.yaml
  text: Be silent before me[a], and let me speak; then let come upon me what may.
translation:
  language: de
  text: Schweigt mir gegenüber[a] und lasst mich reden; dann komme über mich, was auch immer kommen mag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Schweigt von mir.“ Die ungewöhnliche Formulierung kann bedeuten: Schweigt mir gegenüber bzw. lasst mich reden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרִישׁוּ
  choice: Schweigt
  rationale: Der Hifil-Imperativ Plural von חרשׁ fordert die Angesprochenen knapp und nachdrücklich auf, still zu sein.
- source_word: מִמֶּנִּי
  choice: vor mir
  rationale: Wörtlich steht „von mir“. In Verbindung mit der Aufforderung zum Schweigen bezeichnet es hier idiomatisch das Schweigen Job gegenüber beziehungsweise in seiner Gegenwart; „vor mir“ bewahrt diese relationale Bedeutung in natürlichem Deutsch.
- source_word: וַאֲדַבְּרָה
  choice: und lasst mich reden
  rationale: Die Kohortativform bringt Jobs Willen beziehungsweise die Aufforderung zum Ausdruck, ihm das Reden zu gestatten.
- source_word: אָנִי
  choice: mich
  rationale: Das selbstständige Pronomen hebt Job als Sprecher hervor. Im Deutschen wird dieser Nachdruck innerhalb von „lasst mich reden“ hinreichend und natürlich wiedergegeben.
- source_word: וְיַעֲבֹר
  choice: dann komme
  rationale: עבר bedeutet grundsätzlich „vorübergehen“ oder „über etwas hinweggehen“; zusammen mit עָלַי beschreibt es hier idiomatisch, was Job treffen oder über ihn kommen mag. Der Konjunktiv „komme“ gibt den voluntativen Sinn wieder.
- source_word: עָלַי
  choice: über mich
  rationale: Die Verbindung mit עבר wird mit der im Deutschen geläufigen Wendung „über mich kommen“ wiedergegeben.
- source_word: מָה
  choice: was auch kommen mag
  rationale: מָה ist hier unbestimmt im Sinn von „was auch immer“. Die Formulierung wahrt diese Offenheit und Jobs Bereitschaft, die Folgen auf sich zu nehmen.
theological_decisions: []
