  text: וְ֭/הוּא כְּ/רָקָ֣ב יִבְלֶ֑ה כְּ֝/בֶ֗גֶד אֲכָ֣ל/וֹ עָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/028.yaml
  text: while he wastes away like something rotten[a], like a garment eaten by moths.
translation:
  language: de
  text: 'Und er zerfällt wie Moder,

    wie ein Gewand, das eine Motte zerfressen hat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּא
  choice: Und er
  rationale: Die Konjunktion mit dem selbstständigen Pronomen nimmt die Person aus dem Zusammenhang wieder auf. „Und er“ bewahrt diese offene, parataktische Verknüpfung, ohne sie zeitlich oder logisch näher festzulegen.
- source_word: כְּרָקָב
  choice: wie Moder
  rationale: רָקָב bezeichnet Fäulnis, Verrottung oder Moder. „Moder“ ist im Deutschen ein knapper, bildhafter Vergleich und passt zum poetischen Parallelismus.
- source_word: יִבְלֶה
  choice: zerfällt
  rationale: בלה bezeichnet das Sich-Abnutzen, Vergehen oder Zerfallen. „Zerfällt“ gibt hier den fortschreitenden Verfall natürlich wieder und verbindet sich idiomatisch mit „wie Moder“.
- source_word: כְּבֶגֶד
  choice: wie ein Kleid
  rationale: בֶּגֶד ist ein allgemeines Wort für Kleid oder Gewand. „Kleid“ ist verständlich, wahrt den Singular und bezeichnet hier ein Kleidungsstück, nicht speziell ein modernes Damenkleid.
- source_word: אֲכָלוֹ
  choice: das … zerfressen hat
  rationale: Die Form beschreibt das Kleid als von der Motte gefressen beziehungsweise verzehrt. Der deutsche Relativsatz gibt das Ergebnis anschaulich und idiomatisch wieder.
- source_word: עָשׁ
  choice: die Motte
  rationale: Das hebräische Substantiv steht im Singular. Der deutsche Singular bewahrt die Form des Ausgangstextes und ist in diesem Bild natürlich.
theological_decisions:
- issue: Bezug des Pronomens הוּא
  choice: Das männliche Pronomen bleibt mit „er“ ausdrücklich erhalten.
  alternative: Eine unpersönliche Wiedergabe wie „man“ oder eine explizite Identifizierung mit Ijob.
  rationale: Der Vers lässt den Bezug im unmittelbaren Wortlaut offen; der Kontext kann auf den leidenden Sprecher beziehungsweise Menschen weisen. Eine ausdrückliche Identifizierung würde die syntaktische Offenheit unnötig auflösen.
translation_notes:
  register: Poetisch, knapp und würdig; moderner Standarddeutscher Satzbau bei Erhaltung der hebräischen Parallelstruktur. „Moder“ ist leicht gehoben, aber allgemein verständlich und dem Verfallsbild angemessen.
