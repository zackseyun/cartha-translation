  text: הֶ/עָלֶ֣ה נִדָּ֣ף תַּעֲר֑וֹץ וְ/אֶת קַ֖שׁ יָבֵ֣שׁ תִּרְדֹּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/025.yaml
  text: Will you terrify a windblown leaf[b][a], and pursue dry chaff?
translation:
  language: de
  text: Willst du ein verwehtes Blatt erschrecken[a] und dürres Stroh[b] verfolgen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Schrecken versetzen“ bzw. „bedrängen“. Das hebräische Verb kann das Hervorrufen von Furcht oder eine harte, einschüchternde Behandlung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dürre Stoppeln“ beziehungsweise „dürre Spreu“. Das hebräische Wort bezeichnet trockenes pflanzliches Restmaterial und unterstreicht dessen Schwäche und Wertlosigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָלֶה
  choice: ein ... Blatt
  rationale: עָלֶה bezeichnet hier ein einzelnes Blatt; der unbestimmte Artikel ergibt sich im Deutschen natürlich aus dem Bild der rhetorischen Frage.
- source_word: נִדָּף
  choice: verwehtes
  rationale: Das Partizip von נדף beschreibt etwas, das vom Wind fortgetrieben oder umhergeweht wird. „Verwehtes“ bewahrt das anschauliche Bild der Hilflosigkeit.
- source_word: תַּעֲרוֹץ
  choice: erschrecken
  rationale: ערץ kann bedeuten, Furcht oder Schrecken hervorzurufen. „Erschrecken“ ist im modernen Deutsch natürlich und lässt die mögliche stärkere Nuance von Einschüchterung offen.
- source_word: וְאֶת
  choice: und
  rationale: Die Konjunktion verbindet die beiden parallelen Bilder; den hebräischen Akkusativmarker gibt das Deutsche nicht eigens wieder.
- source_word: קַשׁ
  choice: Stroh
  rationale: קַשׁ bezeichnet trockenes pflanzliches Restmaterial, besonders Stroh oder Stoppeln. „Stroh“ ist hier verständlich und vermeidet eine unnötige Verengung auf Spreu.
- source_word: יָבֵשׁ
  choice: dürr
  rationale: יָבֵשׁ bezeichnet das Pflanzenmaterial als trocken und spröde. „Dürr“ passt zum gehobenen poetischen Register.
- source_word: תִּרְדֹּף
  choice: verfolgen
  rationale: רדף bedeutet verfolgen oder nachjagen. „Verfolgen“ bewahrt die aggressive Bewegung und den Parallelismus.
theological_decisions: []
