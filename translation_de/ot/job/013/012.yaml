  text: זִֽ֭כְרֹנֵי/כֶם מִשְׁלֵי אֵ֑פֶר לְ/גַבֵּי חֹ֝֗מֶר גַּבֵּי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/012.yaml
  text: Your maxims are proverbs of ashes[a]; your defenses are defenses of clay.
translation:
  language: de
  text: Eure Denksprüche sind Sprüche aus Asche[a], eure Schutzwälle sind Schutzwälle aus Lehm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eure Erinnerungen sind Sprüche aus Asche; eure Rücken sind Rücken aus Lehm.“ Der hebräische Text ist knapp, und besonders die wiederholte Form von גַּב („Rücken“, auch eine erhöhte Fläche) ist schwer zu deuten. „Schutzwälle“ gibt eine kontextuelle Deutung wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: זִכְרֹנֵיכֶם
  choice: Eure Denksprüche
  rationale: Das von זכר abgeleitete Substantiv bezeichnet gewöhnlich Erinnerungen oder Gedenkzeichen. Zusammen mit מִשְׁלֵי liegt hier jedoch eine kontextuelle Deutung als einprägsame, autoritativ vorgetragene Weisheitssätze nahe. „Denksprüche“ bewahrt den Bezug zum Erinnern und klingt im Deutschen als Bezeichnung für prägnante Lehrsätze natürlich.
- source_word: מִשְׁלֵי
  choice: Sprüche
  rationale: מָשָׁל kann Spruch, Sprichwort oder Gleichnis bedeuten. „Sprüche“ erhält die nominale, weisheitliche Ausdrucksweise, ohne sie zu einer bloßen Vergleichspartikel abzuflachen.
- source_word: אֵפֶר
  choice: Asche
  rationale: „Asche“ ist die gewöhnliche Bedeutung und vermittelt hier Wertlosigkeit und Zerbrechlichkeit.
- source_word: לְגַבֵּי
  choice: sind
  rationale: Die knappe Verbindung aus ל und גַּב ist schwierig. In der poetischen Aussage lässt sie sich als prädikative Zuordnung verstehen; im Deutschen wird dafür die Kopula „sind“ ergänzt.
- source_word: חֹמֶר
  choice: Lehm
  rationale: חֹמֶר bezeichnet Lehm, Ton oder Mörtel. „Lehm“ passt besonders natürlich zu einem nur scheinbar festen Schutzwall und bewahrt das Bild eines schwachen, erdigen Baustoffs.
- source_word: גַּבֵּיכֶם
  choice: eure Schutzwälle
  rationale: גַּב bedeutet wörtlich „Rücken“ oder eine erhöhte Fläche. Im Zusammenhang ist wahrscheinlich ein bildlicher Schutz- oder Verteidigungsbau gemeint. „Schutzwälle“ erhält das konkrete Bild und vermeidet die abstraktere Deutung „Verteidigungen“.
theological_decisions: []
