base_translation:
  language: en
  yaml_path: translation/ot/job/013/026.yaml
  text: For you write bitter things against me and make me inherit the iniquities of my youth[a][b].
translation:
  language: de
  text: Denn du schreibst Bitteres gegen mich auf[a] und lässt mich die Verfehlungen meiner Jugend erben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du verfügst Bitteres gegen mich“. Wörtlich heißt es im Hebräischen: „du schreibst Bitteres gegen mich“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „lässt mich die Schuld oder die Strafe für die Verfehlungen meiner Jugend tragen“. Das hebräische Wort kann Verfehlung, Schuld oder deren Folge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Hiobs Klage ein und gibt den argumentativen Zusammenhang natürlich wieder.
- source_word: תִכְתֹּב עָלַי
  choice: du schreibst … gegen mich auf
  rationale: Bewahrt das Bild des hebräischen Verbs כתב („schreiben“); „gegen mich“ gibt die hier gegnerische Bedeutung der Präposition עַל wieder. „Aufschreiben“ klingt im Deutschen nach einer schriftlich festgehaltenen Anklage oder Verfügung, ohne diese Deutung festzulegen.
- source_word: מְרֹרוֹת
  choice: Bitteres
  rationale: Die substantivierte Form lässt offen, ob Anklagen, Verfügungen oder leidvolle Dinge gemeint sind.
- source_word: וְתוֹרִישֵׁנִי
  choice: und lässt mich … erben
  rationale: Gibt die kausative Form von ירשׁ wieder und bewahrt das auffällige Bild des Erbens beziehungsweise Besitzempfangens.
- source_word: עֲוֺנוֹת
  choice: die Verfehlungen
  rationale: Bezeichnet moralisches Unrecht, ohne die mögliche Mitbedeutung von Schuld oder deren Folgen im Haupttext vorschnell festzulegen.
- source_word: נְעוּרָי
  choice: meiner Jugend
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung mit Suffix der ersten Person.
theological_decisions:
- issue: Bedeutungsumfang von עֲוֺנוֹת im Zusammenhang
  choice: Verfehlungen aus Hiobs Jugend, wobei Schuld und Folgen mitschwingen können
  alternative: Schuld beziehungsweise Strafe für die Verfehlungen seiner Jugend
  rationale: עָוֹן kann das Unrecht selbst, die daraus entstehende Schuld oder dessen Folge bezeichnen. Der Haupttext wahrt diese Spannung, während die Fußnote die möglichen engeren Bedeutungen nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst ungewöhnliche Erbmetapher bleibt erhalten; „Bitteres“ wahrt die Unbestimmtheit des hebräischen Plurals.
