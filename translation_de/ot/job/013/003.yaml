  text: אוּלָ֗ם אֲ֭נִי אֶל שַׁדַּ֣י אֲדַבֵּ֑ר וְ/הוֹכֵ֖חַ אֶל אֵ֣ל אֶחְפָּֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/003.yaml
  text: But I would speak to the Almighty[a], and I desire to argue with God.
translation:
  language: de
  text: Doch ich will zum Allmächtigen reden, und ich wünsche, mit Gott zu rechten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Gott zu argumentieren“ oder „mit Gott zu streiten“. Das hebräische Verb kann eine argumentative oder forensische Auseinandersetzung, auch das Darlegen bzw. Erweisen einer Sache, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: Doch
  rationale: Kennzeichnet den deutlichen Gegensatz zu Hiobs vorheriger Zurückweisung der Worte seiner Freunde und klingt im Deutschen natürlich und würdig.
- source_word: אֲנִי
  choice: ich
  rationale: Das ausdrücklich gesetzte Pronomen betont Hiobs eigene Absicht; die Wortstellung „ich will“ bewahrt diese Hervorhebung.
- source_word: אֶל שַׁדַּי
  choice: mit dem Allmächtigen
  rationale: Bei דבר kann אֶל die Person bezeichnen, an die sich die Rede richtet. „Mit ... reden“ ist hier idiomatisches Deutsch; שַׁדַּי wird als Titel übersetzt.
- source_word: אֲדַבֵּר
  choice: will ... reden
  rationale: Das Imperfekt bezeichnet hier im Zusammenhang eine entschlossene Absicht, nicht lediglich eine zukünftige Handlung.
- source_word: וְהוֹכֵחַ
  choice: meine Sache zu vertreten
  rationale: Der Hifil von יכח hat hier eine forensisch-disputative Bedeutung. Die Wendung gibt das Vorbringen beziehungsweise Verfechten eines Anliegens wieder, ohne ein ausgesprochenes Objekt im Hebräischen als festen Bestandteil auszugeben; die Ergänzung wird deshalb in einer Fußnote erläutert.
- source_word: אֶל אֵל
  choice: vor Gott
  rationale: אֶל bezeichnet hier die Ausrichtung des Streitgesprächs auf Gott. „Vor Gott“ bringt die forensische Vorstellung einer Darlegung des eigenen Falls natürlich zum Ausdruck, bleibt aber als kontextuelle Deutung kenntlich.
- source_word: אֶחְפָּץ
  choice: ich wünsche
  rationale: Gibt den starken Willen beziehungsweise Wunsch Hiobs in einem würdigen, gegenwärtigen Deutsch wieder.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnungen שַׁדַּי und אֵל
  choice: „der Allmächtige“ und „Gott“
  alternative: „Schaddai“ und „Gott“ beziehungsweise „der Mächtige“
  rationale: Der Vers verwendet zwei unterschiedliche Gottesbezeichnungen parallel. Ihre unterschiedliche Wiedergabe bewahrt die stilistische Variation, ohne sie begrifflich gleichzumachen oder zusätzliche Lehraussagen einzutragen.
- issue: Forensische oder allgemein dialogische Bedeutung von יכח
  choice: „vor Gott meine Sache zu vertreten“
  alternative: „mit Gott zu rechten“, „mit Gott zu argumentieren“ oder „mit Gott zu reden“
  rationale: Die gewählte Formulierung wahrt den in Hiob naheliegenden forensischen Sinn und vermeidet zugleich, Hiobs Absicht als bloßen Tadel Gottes darzustellen. Die echte Bedeutungsbreite wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Doch“ trägt den starken Kontrast; „will“ drückt Entschlossenheit aus. Die rechtlich gefärbte Wendung wird natürlich formuliert und ihre Bedeutungsbreite durch die Fußnote offengehalten.
