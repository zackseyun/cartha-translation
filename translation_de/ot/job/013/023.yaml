  source_fidelity: Der Entwurf gibt כַּמָּה לִי idiomatisch und dem Plural entsprechend mit „Wie viele … habe ich?“ wieder. Die Paarungen עֲוֺנוֹת / חַטָּאוֹת und פִּשְׁעִי / חַטָּאתִי bleiben erkennbar differenziert. „Lass mich … erkennen“ vermittelt in diesem Gebetskontext den kausativen Sinn von הוֹדִיעֵנִי angemessen, ohne Hiobs Haltung als Schuldbekenntnis oder als Bestreitung festzulegen.
  naturalness: Modernes, klares und würdiges Standarddeutsch. Beide Sätze sind idiomatisch; die direkte Anrede Gottes ist im Kontext selbstverständlich und muss nicht ergänzt werden.
  terminology: „Vergehen“, „Sünden“, „Übertretung“ und „Sünde“ sind für die jeweiligen hebräischen Schuldbegriffe sachgerecht gewählt. Die Fußnote zu „Übertretung“ bewahrt die mögliche Nuance von Auflehnung/Rebellion, ohne sie im Haupttext zu erzwingen.
