  variant: modern standard German
source:
  edition: WLC
  text: כַּ/מָּ֣ה לִ֭/י עֲוֺנ֣וֹת וְ/חַטָּא֑וֹת פִּֽשְׁעִ֥/י וְ֝/חַטָּאתִ֗/י הֹדִיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/023.yaml
  text: How many are my iniquities and sins? Make my transgression and my sin known to me[a][b].
translation:
  language: de
  text: Wie viele Vergehen und Sünden habe ich?[a] Lass mich meine Übertretung[b] und meine Sünde erkennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie groß sind meine Vergehen und Sünden?“ Das hebräische Fragewort kann sowohl nach der Zahl als auch nach dem Ausmaß fragen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Auflehnung“ oder „Rebellion“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה לִי
  choice: Wie viele … habe ich?
  rationale: Die Wendung fragt idiomatisch nach Zahl oder Ausmaß. Mit den beiden Pluralformen ist die quantitative Wiedergabe im Haupttext am naheliegendsten und im Deutschen natürlich.
- source_word: עֲוֺנוֹת
  choice: Vergehen
  rationale: עָוֹן bezeichnet schuldhaftes Unrecht und kann auch die daraus entstehende Schuld meinen. „Vergehen“ bewahrt hier das moralische Gewicht und unterscheidet den Ausdruck von חַטָּאוֹת, ohne altertümlich zu wirken.
- source_word: וְחַטָּאוֹת
  choice: und Sünden
  rationale: „Sünden“ ist die klare und direkte Wiedergabe des Plurals von חַטָּאת.
- source_word: פִּשְׁעִי
  choice: meine Übertretung
  rationale: פֶּשַׁע bezeichnet ein schuldhaftes Überschreiten und kann den Beiklang bewusster Auflehnung tragen. „Übertretung“ erhält das Gewicht des Ausdrucks, ohne den rebellischen Aspekt zwingend festzulegen.
- source_word: וְחַטָּאתִי
  choice: und meine Sünde
  rationale: Die Einzahl mit Suffix wird transparent als „meine Sünde“ wiedergegeben und spiegelt die hebräische Paarung mit פִּשְׁעִי.
- source_word: הֹדִיעֵנִי
  choice: Lass mich … erkennen
  rationale: Der Hifil von ידע bedeutet „wissen lassen, bekannt machen“. Die Formulierung gibt den kausativen Sinn natürlich wieder und macht deutlich, dass Hiob um Erkenntnis seiner konkreten Schuld bittet.
theological_decisions:
- issue: Ob Hiobs Frage ein Schuldbekenntnis oder eine Herausforderung an Gott ist
  choice: Die Frage und Bitte werden ohne erklärenden Zusatz wiedergegeben.
  alternative: Die Formulierung könnte so erweitert werden, dass Hiob seine Schuld ausdrücklich bekennt oder bestreitet.
  rationale: 'Der hebräische Text lässt die Spannung bestehen: Hiob verwendet Begriffe für Schuld und Sünde, verlangt aber zugleich, dass Gott ihm diese konkret erkennen lässt. Die Übersetzung entscheidet diese Spannung nicht vorzeitig.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Frage ist idiomatisch formuliert; die zweite Satzhälfte bleibt nahe an der kausativen Bedeutung des hebräischen Verbs. Die verwandten Schuldbegriffe werden soweit möglich unterschieden.
