  text: וְ/תָ֘שֵׂ֤ם בַּ/סַּ֨ד רַגְלַ֗/י וְ/תִשְׁמ֥וֹר כָּל אָרְחוֹתָ֑/י עַל שָׁרְשֵׁ֥י רַ֝גְלַ֗/י תִּתְחַקֶּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/027.yaml
  text: You put my feet in the stocks[a], and you watch all my paths; you mark out the soles of my feet.
translation:
  language: de
  text: Du legst meine Füße in den Block und überwachst alle meine Pfade; die Sohlen meiner Füße zeichnest du nach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „An meinen Fußsohlen ritzt du eine Grenze ein.“ Das hebräische Verb kann ein Einzeichnen, Einritzen oder Abgrenzen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסַּד
  choice: in den Block
  rationale: סַד bezeichnet hier eine Vorrichtung, in der die Füße festgesetzt werden. „Block“ ist im Deutschen die natürliche Bezeichnung für dieses Fesselgerät und erhält das Gefängnisbild.
- source_word: וְתָשֵׂם
  choice: du legst
  rationale: שׂים bedeutet „setzen, legen, stellen“. Bei Füßen, die in einem Block fixiert werden, klingt „legen“ im Deutschen natürlich.
- source_word: וְתִשְׁמוֹר
  choice: du überwachst
  rationale: שׁמר kann „hüten, bewachen, beobachten“ bedeuten. Im Zusammenhang mit eingeschränkter Bewegungsfreiheit drückt „überwachen“ die feindlich empfundene genaue Beobachtung aus.
- source_word: כָּל אָרְחוֹתַי
  choice: alle meine Pfade
  rationale: אֹרַח bezeichnet einen Pfad oder Weg und kann zugleich den Lebenswandel anklingen lassen. „Pfade“ bewahrt das konkrete Bewegungsbild.
- source_word: עַל שָׁרְשֵׁי רַגְלַי
  choice: die Umrisse meiner Fußsohlen
  rationale: שֹׁרֶשׁ bedeutet gewöhnlich „Wurzel“, bezeichnet in dieser schwierigen Wendung aber offenbar die Unterseite beziehungsweise den Ansatz der Füße. Zusammen mit חקה legt der Kontext ein Nachzeichnen der Sohlen nahe.
- source_word: תִּתְחַקֶּה
  choice: zeichnest du nach
  rationale: Der Hitpael von חקה vermittelt die Vorstellung des Einritzens, Einzeichnens oder Abgrenzens. „Nachzeichnen“ verbindet dieses Bild mit der genauen Kontrolle der Füße, ohne die schwer deutbare Wendung völlig festzulegen.
theological_decisions:
- issue: Gottes Handeln wird als bedrängende Überwachung geschildert
  choice: Die direkte Anrede und die anklagende Bildsprache bleiben unverändert stehen.
  alternative: Die Aussagen als bloßes subjektives Empfinden Hiobs abzuschwächen.
  rationale: Der hebräische Text gibt Hiobs scharfe Klage unmittelbar wieder. Die Übersetzung soll die theologische Spannung nicht durch eine erklärende Abschwächung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Block“, „überwachst“ und „Pfade“ halten das Bild von Fesselung und lückenloser Kontrolle zusammen; die Fußsohlen-Wendung bleibt wegen des schwierigen Hebräisch in einer Fußnote bewusst offen.
