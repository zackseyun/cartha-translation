source:
  edition: WLC
  text: וְ/יָמַ֣/י קַ֭לּוּ מִנִּי רָ֑ץ בָּֽ֝רְח֗וּ לֹא רָא֥וּ טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/025.yaml
  text: My days are swifter than a runner[a]; they flee away; they do not see good.
translation:
  language: de
  text: Meine Tage sind schneller als ein Läufer; sie fliehen dahin und sehen nichts Gutes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kein Glück“, „kein Wohlergehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: meine Tage
  rationale: Die wörtliche Possessivform bewahrt die hebräische Redeweise für die Tage des eigenen Lebens und ist im Deutschen natürlich.
- source_word: קַלוּ
  choice: sind schneller
  rationale: Das Verb bezeichnet hier im Vergleich mit einem Läufer Schnelligkeit. Die komparative Wiedergabe ergibt sich aus מִנִּי.
- source_word: מִנִּי רָץ
  choice: als ein Läufer
  rationale: Die Präposition kennzeichnet den Vergleich; רָץ bezeichnet allgemein einen Läufer, ohne zwingend einen Boten oder Kurier zu meinen.
- source_word: בָּרְחוּ
  choice: sie fliehen dahin
  rationale: Die Form beschreibt bildhaft das rasche Entweichen der Tage. „Dahin“ gibt die fortgerichtete Bewegung idiomatisch wieder, ohne das Bild in ein Fliegen umzudeuten.
- source_word: לֹא רָאוּ
  choice: sie sehen nichts
  rationale: Die negierte Aussage wird im Deutschen mit „nichts“ natürlich formuliert und behält die personifizierende Rede von den Tagen bei.
- source_word: טוֹבָה
  choice: Gutes
  rationale: Die breite Bedeutung bleibt erhalten und wird nicht vorschnell auf Glück, Wohlergehen oder Wohlstand eingeengt.
theological_decisions: []
