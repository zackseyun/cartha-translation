  yaml_path: translation/ot/job/009/022.yaml
  text: It is all one[a]; therefore I say[b], ‘He destroys both the blameless and the wicked.’
translation:
  language: de
  text: 'Es ist alles einerlei; darum sage ich[a]: »Den Schuldlosen wie den Frevler vernichtet er.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »habe ich gesagt« oder »sagte ich«. Die hebräische Perfektform kann im Zusammenhang gegenwärtig, vergangen oder resultativ verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder unpersönlich: »Es vernichtet den Schuldlosen wie den Frevler.«'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת הִיא
  choice: Es ist alles einerlei
  rationale: Die Wendung bezeichnet hier nicht lediglich die Zahl eins, sondern die Gleichheit beziehungsweise praktische Unterschiedslosigkeit des Ausgangs. »Alles einerlei« gibt Hiobs ernüchternde Aussage knapp und natürlich wieder.
- source_word: עַל כֵּן
  choice: darum
  rationale: Die Konjunktion kennzeichnet Hiobs folgende Aussage als Schlussfolgerung aus dem Vorangehenden. »Darum« stellt diesen Zusammenhang in natürlichem Deutsch her.
- source_word: אָמַרְתִּי
  choice: sage ich
  rationale: Die hebräische Perfektform kann im Zusammenhang als gegenwärtige, ausdrücklich vorgetragene Feststellung verstanden werden. Die mögliche Vergangenheits- beziehungsweise Resultativbedeutung wird in einer Fußnote bewahrt.
- source_word: תָּם
  choice: der Schuldlose
  rationale: Das Wort bezeichnet einen Menschen von unversehrter Lauterkeit, nicht sündlose Vollkommenheit. »Schuldlos« bildet hier zudem einen klaren Gegenpol zu »Frevler« und passt zu Hiobs Klage über unterschiedsloses Ergehen.
- source_word: רָשָׁע
  choice: der Frevler
  rationale: »Frevler« bezeichnet prägnant den moralisch schuldigen, gottlosen Menschen und entspricht dem weisheitlichen Gegensatz zum Schuldlosen.
- source_word: הוּא מְכַלֶּה
  choice: vernichtet er
  rationale: Das maskuline Singularpronomen mit Partizip wird im Kontext am ehesten auf Gott bezogen. Die nachgestellte Formulierung hält den Bezug im Deutschen etwas weniger ausdrücklich, ohne die Härte von Hiobs Aussage abzuschwächen. Eine unpersönliche Deutung bleibt als Fußnote erhalten.
theological_decisions:
- issue: Subjekt von הוּא מְכַלֶּה
  choice: 'Das Pronomen wird persönlich wiedergegeben und im Kontext auf Gott bezogen: »vernichtet er«.'
  alternative: 'Unpersönlich: »es vernichtet den Schuldlosen wie den Frevler«.'
  rationale: Hiob spricht in Kapitel 9 von Gottes überwältigender Macht und seinem Handeln. Daher liegt Gott als gemeintes Subjekt nahe. Die Übersetzung lässt Hiobs scharfe theologische Klage stehen, statt sie abzumildern; zugleich wird die mögliche unpersönliche Auffassung in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Alles einerlei« ist idiomatisch und bewahrt Hiobs düstere Zuspitzung; »Schuldloser« und »Frevler« bilden einen klaren, inhaltlich passenden Gegensatz. Die Wortstellung »vernichtet er« lässt den Gottesbezug erkennbar, ohne einen im Hebräischen nicht genannten Gottesnamen einzufügen.
