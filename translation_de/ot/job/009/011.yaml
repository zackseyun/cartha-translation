id: JOB.9.11
reference: Job 9:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵ֤ן יַעֲבֹ֣ר עָ֭לַ/י וְ/לֹ֣א אֶרְאֶ֑ה וְ֝/יַחֲלֹ֗ף וְֽ/לֹא אָבִ֥ין לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/011.yaml
  text: Look[a], he passes by me, and I do not see him; he moves on[c][b], and I do not perceive him.
translation:
  language: de
  text: Sieh, er geht an mir vorüber, und ich sehe ihn nicht; er zieht weiter, und ich nehme ihn nicht wahr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ich verstehe ihn nicht“. Das hebräische Verb kann Wahrnehmen, Erkennen oder Verstehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Interjektion leitet eine nachdrückliche, anschauliche Feststellung ein. „Sieh“ bewahrt diese deiktische Kraft in natürlichem modernem Deutsch.
- source_word: יַעֲבֹר עָלַי
  choice: geht an mir vorüber
  rationale: עבר mit על beschreibt hier eine Bewegung an Job vorbei. Die Wendung ist idiomatisch und vermeidet, mit „über mich“ unnötig ein Hinwegschreiten über Job anzudeuten.
- source_word: וְלֹא אֶרְאֶה
  choice: und ich sehe ihn nicht
  rationale: Die einfache Verneinung des Verbs ראה wird direkt wiedergegeben; „kann ihn nicht sehen“ würde ein ausdrückliches Unvermögen hinzufügen.
- source_word: וְיַחֲלֹף
  choice: er zieht weiter
  rationale: חלף bezeichnet ein Vorüber- oder Weiterziehen. „Zieht weiter“ unterscheidet das Verb leicht vom ersten Bewegungsverb und erhält zugleich den poetischen Parallelismus.
- source_word: וְלֹא אָבִין לוֹ
  choice: und ich nehme ihn nicht wahr
  rationale: בין kann Verstehen, Unterscheiden oder Erkennen bezeichnen. Im Zusammenhang mit Gottes unbemerktem Vorübergehen bringt „wahrnehmen“ die erfahrungsbezogene Erkenntnis natürlich zum Ausdruck, ohne die mögliche Bedeutung „verstehen“ auszuschließen.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts und der pronominalen Bezüge
  choice: „er“ und „ihn“ beziehen sich auf Gott.
  alternative: Ein unbestimmtes Subjekt („jemand“) geht vorüber.
  rationale: Im unmittelbaren Zusammenhang beschreibt Job Gottes unerforschliches Handeln (Hiob 9,10–12). Die Pronomen bewahren diesen persönlichen Bezug, ohne den im Vers selbst nicht ausdrücklich genannten Gottesnamen einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. „Sieh“ ist bewusst knapp und lebendig; „er zieht weiter“ variiert das zweite Bewegungsverb, ohne die enge Entsprechung der beiden Vershälften aufzulösen.
