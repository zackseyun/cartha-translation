id: JOB.9.20
reference: Job 9:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם אֶ֭צְדָּק פִּ֣/י יַרְשִׁיעֵ֑/נִי תָּֽם אָ֝֗נִי וַֽ/יַּעְקְשֵֽׁ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/020.yaml
  text: If I am in the right[a], my own mouth would condemn me; though I am blameless, it would prove me crooked.
translation:
  language: de
  text: Bin ich im Recht, spricht mein eigener Mund mich schuldig; bin ich untadelig, stellt er mich als verkehrt hin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Subjekt ist im Hebräischen nicht ausdrücklich genannt. Gemeint sein kann: „mein eigener Mund stellt mich als verkehrt hin“; möglich ist auch: „Gott stellt mich als verkehrt hin“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Bin ich
  rationale: Die Bedingungspartikel wird in natürlichem Deutsch durch einen uneingeleiteten Konditionalsatz wiedergegeben; der Gesamtzusammenhang kann zugleich einen einräumenden Unterton tragen.
- source_word: אֶצְדָּק
  choice: im Recht
  rationale: Das Qal von צדק bezeichnet hier im forensischen Zusammenhang, im Recht zu sein, nicht sich selbst zu rechtfertigen.
- source_word: פִּי
  choice: mein eigener Mund
  rationale: Wörtlich steht „mein Mund“. „Eigener“ hebt die Ironie hervor, dass gerade Hiobs eigene Worte gegen ihn zeugen würden.
- source_word: יַרְשִׁיעֵנִי
  choice: spricht … mich schuldig
  rationale: 'Das Hifil von רשע hat hier gerichtlichen Sinn: jemanden für schuldig erklären beziehungsweise verurteilen.'
- source_word: תָּם
  choice: untadelig
  rationale: תם bezeichnet in Hiob persönliche Integrität und Unbescholtenheit, nicht absolute Sündlosigkeit.
- source_word: וַיַּעְקְשֵׁנִי
  choice: stellt er mich als verkehrt hin
  rationale: Die Form von עקשׁ beschreibt, dass Hiob als verdreht oder verkehrt erscheint beziehungsweise dargestellt wird. Die Formulierung vermeidet die stärkere Behauptung, er werde tatsächlich moralisch verdorben.
theological_decisions:
- issue: Subjekt von וַיַּעְקְשֵׁנִי
  choice: Das Pronomen „er“ knüpft im Haupttext zunächst an „mein eigener Mund“ an.
  alternative: Gott kann als unausgesprochenes Subjekt verstanden werden.
  rationale: Der Parallelismus legt die Fortführung des Subjekts „mein Mund“ nahe. Das Hebräische nennt das Subjekt des zweiten Verbs jedoch nicht ausdrücklich; deshalb wird die mögliche Beziehung auf Gott in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die forensische Bildsprache wird mit „im Recht“ und „schuldig sprechen“ bewahrt; „untadelig“ bezeichnet Integrität, ohne Sündlosigkeit zu behaupten.
