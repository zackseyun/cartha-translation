  terminology: „Im Recht“, „schuldig sprechen“ und „untadelig“ sind im Kontext von Hiobs Rechtfertigungs- und Integritätssprache treffend. „Mein eigener Mund“ ist eine vertretbare, stilistisch natürliche Verdeutlichung der Selbstanklage, auch wenn „eigener“ nicht ausdrücklich im Hebräischen steht.
