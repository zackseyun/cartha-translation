base_translation:
  language: en
  yaml_path: translation/ot/job/009/012.yaml
  text: Look[a], if he snatches away, who can turn him back? Who can say to him[b], ‘What are you doing?’
translation:
  language: de
  text: 'Sieh doch[a]: Wenn er hinwegreißt, wer kann ihn zurückwenden[b]? Wer kann zu ihm sagen: »Was tust du?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ja« bzw. »Gewiss«. Das hebräische Wort hebt die folgende Aussage nachdrücklich hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »wer kann ihn zurückkehren lassen?« Gemeint ist: wer kann ihn umkehren oder von seinem Handeln abbringen? Möglich ist auch ein sachlicher Bezug: »wer kann es zurückbringen?«, nämlich das, was er weggerissen hat.'
    reason: lexical_and_referential_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh doch
  rationale: Die Aufmerksamkeitspartikel leitet eine nachdrückliche, anschauliche Aussage ein. »Sieh doch« bewahrt diesen Impuls in natürlichem modernem Deutsch.
- source_word: יַחְתֹּף
  choice: etwas an sich reißt
  rationale: חטף bezeichnet ein plötzliches, gewaltsames Ergreifen oder Wegraffen. »An sich reißen« gibt sowohl die Heftigkeit als auch die Wegnahme wieder; »etwas« macht das im Hebräischen nicht ausdrücklich genannte Objekt im Deutschen grammatisch sichtbar, ohne es näher festzulegen.
- source_word: יְשִׁיבֶנּוּ
  choice: ihn zurückhalten
  rationale: Die Hifil-Form von שוב bedeutet wörtlich, jemanden zurückkehren zu lassen beziehungsweise zurückzuwenden. Im Zusammenhang bezeichnet sie das Zurückwenden Gottes von seinem Handeln; »zurückhalten« gibt die rhetorisch gemeinte Unmöglichkeit idiomatisch wieder.
- source_word: מִי
  choice: wer kann
  rationale: Das Fragewort steht in einer rhetorischen Frage, die Unfähigkeit ausdrückt. »Wer kann« macht diese Funktion im Deutschen natürlich deutlich.
- source_word: יֹאמַר אֵלָיו
  choice: zu ihm sagen
  rationale: Die Wendung wird ohne interpretierenden Zusatz direkt wiedergegeben.
- source_word: מַה תַּעֲשֶׂה
  choice: Was tust du?
  rationale: Der Imperfekt bezeichnet hier in einer herausfordernden Frage das gegenwärtige Handeln. Die knappe Form wahrt den würdevollen Ton und die unmittelbare Anrede.
theological_decisions:
- issue: Bezug der maskulinen Singularsuffixe
  choice: 'Die Pronomen werden persönlich auf Gott bezogen: »ihn … zu ihm«.'
  alternative: 'Das erste Suffix könnte sachlich auf das von Gott Weggeraffte bezogen werden: »wer kann es zurückbringen?«'
  rationale: Der unmittelbare Zusammenhang beschreibt Gottes unwiderstehliches Handeln; die folgende Wendung »Wer kann zu ihm sagen …?« stützt den persönlichen Bezug. Da das Hebräische beim ersten Suffix formal mehrdeutig bleiben kann, wird die sachliche Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen bleiben knapp und eindringlich. Die echte Mehrdeutigkeit des Suffixbezugs wird nicht im Haupttext aufgelöst, ohne die Alternative in der Fußnote offenzulegen.
