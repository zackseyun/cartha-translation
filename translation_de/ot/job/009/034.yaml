source:
  edition: WLC
  text: יָסֵ֣ר מֵ/עָלַ֣/י שִׁבְט֑/וֹ וְ֝/אֵמָת֗/וֹ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/034.yaml
  text: Let him remove his rod from upon me[a], and let not his terror frighten me.
translation:
  language: de
  text: Er nehme seine Rute von mir weg[a], und sein Schrecken ängstige mich nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wende seine Rute von mir ab.“'
    reason: 'Lexikalische Alternative: יָסֵר kann hier als „wegnehmen“ oder „abwenden“ verstanden werden; מֵעָלַי trägt zudem wörtlich die Nuance „von über mir weg“.'
lexical_decisions:
- source_word: יָסֵר
  choice: er nehme … weg
  rationale: Der Hifil von סור hat hier im Zusammenhang volitiven, jussivischen Sinn. „Er nehme … weg“ gibt Hiobs Wunsch in gehobenem, aber heutigem Deutsch wieder.
- source_word: מֵעָלַי
  choice: von mir weg
  rationale: Die Wendung bedeutet wörtlich „von über/auf mir weg“ und zeichnet die Rute als bedrückende Last. „Von mir weg“ ist natürliches Deutsch; die Fußnote bewahrt die alternative räumliche Nuance.
- source_word: שִׁבְטוֹ
  choice: seine Rute
  rationale: שֵׁבֶט kann Rute, Stab oder Zepter bezeichnen. Im Zusammenhang von Leiden und Bedrängnis vermittelt „Rute“ am klarsten das Bild eines Schlag- oder Züchtigungsinstruments.
- source_word: וְאֵמָתוֹ
  choice: und sein Schrecken
  rationale: אֵימָה bezeichnet Schrecken oder Grauen. „Sein Schrecken“ bewahrt sowohl die starke Wirkung als auch die Möglichkeit, dass der von Gott ausgehende Schrecken gemeint ist.
- source_word: אַל
  choice: nicht
  rationale: אַל verneint hier den volitiven Verbgedanken. Die deutsche Stellung „ängstige mich nicht“ wahrt den Wunschcharakter, ohne unnötig altertümlich zu klingen.
- source_word: תְּבַעֲתַנִּי
  choice: ängstige mich
  rationale: בעת bedeutet erschrecken, in Angst versetzen oder verstören. „Ängstige mich“ ist prägnant, würdig und vermeidet die stilistisch schwerfällige Wiederholung „sein Schrecken erschrecke mich“.
theological_decisions:
- issue: Bezug der Pronomen in der dritten Person Singular
  choice: 'Gott wird indirekt in der dritten Person bezeichnet: „er/seine/sein“.'
  alternative: 'Direkte Anrede: „Nimm deine Rute von mir weg, und dein Schrecken ängstige mich nicht.“'
  rationale: Der hebräische Text verwendet eine Verbform und Suffixe der dritten Person Singular. Die Übersetzung bewahrt diese grammatische Distanz und glättet Hiobs Rede über Gott nicht zu einer direkten Anrede.
translation_notes:
  register: Poetisch-gehobenes, zugleich modernes Standarddeutsch. Die jussivischen Formen „er nehme“ und „ängstige … nicht“ entsprechen dem Wunschcharakter des Hebräischen. Die indirekte Rede über Gott bleibt erhalten.
