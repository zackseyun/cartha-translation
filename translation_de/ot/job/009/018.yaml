  text: He does not let me catch my breath[b][a], for he fills me with bitterness.
translation:
  language: de
  text: Er lässt mich nicht wieder zu Atem kommen,[a] denn er sättigt mich mit Bitterem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »meinen Atem/Geist wiederherstellen«; auch: »meinen Atem zurückgewinnen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit bitteren Dingen«; sinngemäß auch: »mit bitterem Leid«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּנֵנִי
  choice: lässt mich
  rationale: נתן mit folgendem Infinitiv bedeutet hier idiomatisch »zulassen/gestatten«; »lässt mich« ist im Deutschen natürlich und präzise.
- source_word: הָשֵׁב רוּחִי
  choice: Atem holen
  rationale: Wörtlich steht »meinen Atem/Geist zurückkehren lassen«. Im Zusammenhang der unablässigen Bedrängnis bezeichnet die Wendung eine Gelegenheit, wieder zu Atem zu kommen; »Atem holen« gibt dies idiomatisch wieder.
- source_word: כִּי
  choice: sondern
  rationale: כִּי kann den begründenden oder kontrastierenden Anschluss einleiten. Nach der Verneinung gibt »sondern« hier die zugespitzte Gegenüberstellung natürlich wieder, ohne die mögliche kausale Nuance zu verschweigen.
- source_word: יַשְׂבִּיעַנִי
  choice: sättigt mich
  rationale: Der Hifil von שבע bedeutet »sättigen, reichlich füllen«. Das bewusst harte »sättigt« bewahrt das Bild einer bedrückenden Überfülle.
- source_word: מַמְּרֹרִים
  choice: mit Bitterkeiten
  rationale: Der hebräische Plural bezeichnet wörtlich »Bitterkeiten« beziehungsweise bittere Dinge oder Erfahrungen. Die Pluralform bewahrt die Konkretheit und Häufung des Leidens.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Sprache. »Nicht einmal« macht die im Kontext vorausgesetzte Unerbittlichkeit ausdrücklich, ohne den Sinn zu verändern. »Sättigt« und der ungewöhnliche Plural »Bitterkeiten« bewahren das kräftige hebräische Bild.
