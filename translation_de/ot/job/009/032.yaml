  text: כִּי לֹא אִ֣ישׁ כָּמֹ֣/נִי אֶֽעֱנֶ֑/נּוּ נָב֥וֹא יַ֝חְדָּ֗ו בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/032.yaml
  text: For he is not a man like me[a], that I should answer him, that we should come together in court.
translation:
  language: de
  text: Denn er ist kein Mensch wie ich; ich kann ihm nicht antworten und mit ihm gemeinsam vor Gericht treten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Ijobs vorausgehende Klage ein und gibt den argumentativen Zusammenhang natürlich wieder.
- source_word: לֹא אִישׁ כָּמֹנִי
  choice: er ist kein Mensch wie ich
  rationale: אִישׁ bezeichnet hier den Menschen im Gegensatz zu Gott. „Mensch“ bewahrt diesen Gegensatz im heutigen Deutsch natürlicher als das geschlechtsspezifische „Mann“.
- source_word: אֶעֱנֶנּוּ
  choice: dem ich antworten könnte
  rationale: ענה bedeutet hier im rechtlichen Zusammenhang „antworten“ beziehungsweise auf die Gegenpartei erwidern. Der Konjunktiv gibt die vorgestellte, tatsächlich unmögliche Situation wieder.
- source_word: נָבוֹא יַחְדָּו
  choice: sodass wir gemeinsam … träten
  rationale: Die erste Person Plural bezieht Ijob und Gott ein; „gemeinsam … träten“ drückt ihr beiderseitiges Erscheinen in derselben Rechtssache aus.
- source_word: בַּמִּשְׁפָּט
  choice: vor Gericht
  rationale: מִשְׁפָּט kann Gericht, Rechtssache oder Urteil bedeuten. Im forensischen Bild des Zusammenhangs vermittelt „vor Gericht“ die konkrete Bedeutung klar und idiomatisch.
theological_decisions:
- issue: Forensisches Bild zwischen Ijob und Gott
  choice: Die Aussage wird als Unmöglichkeit eines Rechtsstreits zwischen gleichgestellten Parteien wiedergegeben.
  alternative: „dass wir gemeinsam zum Gericht kämen“ beziehungsweise „zum Rechtsentscheid zusammenträten“
  rationale: Der hebräische Text gebraucht Rechtssprache, behauptet aber nicht mehr, als dass Gott für Ijob kein menschlicher Prozessgegner auf Augenhöhe ist. „Vor Gericht“ wahrt das Bild, ohne es dogmatisch auszubauen.
- issue: Wiedergabe von אִישׁ
  choice: „Mensch“
  alternative: „Mann“
  rationale: Obwohl אִישׁ morphologisch maskulin ist, liegt der inhaltliche Gegensatz hier zwischen Gott und einem Menschen. Das moderne deutsche „Mensch“ gibt diesen Gegensatz präzise wieder, ohne eine nicht entscheidende Geschlechtsspezifik hervorzuheben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt die begründende und hypothetische Bewegung des Hebräischen; das Rechtsbild wird idiomatisch, aber nicht interpretierend erweitert.
