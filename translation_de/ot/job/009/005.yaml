source:
  edition: WLC
  text: הַ/מַּעְתִּ֣יק הָ֭רִים וְ/לֹ֣א יָדָ֑עוּ אֲשֶׁ֖ר הֲפָכָ֣/ם בְּ/אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/005.yaml
  text: He removes mountains[a], and they do not know it[c][b], when he overturns them in his anger.
translation:
  language: de
  text: Er versetzt Berge[a], und sie merken es nicht[b], wenn er sie in seinem Zorn umstürzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er rückt Berge von ihrer Stelle.“ Das hebräische Verb bezeichnet, dass etwas aus seiner bisherigen Lage bewegt wird.'
    reason: lexical_alternative
  - marker: b
    text: Die poetische Aussage stellt die Berge so dar, als könnten sie wahrnehmen, was mit ihnen geschieht.
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּעְתִּיק
  choice: versetzt
  rationale: Das Hifil-Partizip von עתק bezeichnet hier das Bewegen aus der bisherigen Lage. „Versetzt“ gibt dies prägnant wieder und passt zur poetischen Darstellung von Gottes Macht; „entfernt“ wäre ebenfalls möglich, legt das Ergebnis aber stärker fest.
- source_word: הָרִים
  choice: Berge
  rationale: Die übliche Bedeutung des Plurals wird unmittelbar beibehalten.
- source_word: וְלֹא יָדָעוּ
  choice: und sie merken es nicht
  rationale: Das pluralische Verb bezieht sich grammatisch naheliegend auf die Berge. „Merken“ wirkt bei der poetischen Personifikation im Deutschen natürlicher als das wörtlichere „wissen“; „es“ ergänzt das im Hebräischen unausgesprochene Objekt.
- source_word: אֲשֶׁר
  choice: wenn
  rationale: Die Konjunktion führt hier den zeitlichen beziehungsweise begleitenden Umstand ein. „Wenn“ gibt diesen Zusammenhang im Deutschen idiomatisch wieder, ohne ihn unnötig enger festzulegen.
- source_word: הֲפָכָם
  choice: er sie … umstürzt
  rationale: הפך bezeichnet ein Umkehren oder Umstürzen; das Suffix bezeichnet „sie“, also die Berge. „Umstürzt“ bewahrt die gewaltsame Bildsprache.
- source_word: בְּאַפּוֹ
  choice: in seinem Zorn
  rationale: אַף bedeutet wörtlich „Nase“, bezeichnet idiomatisch jedoch Zorn. „In seinem Zorn“ ist im modernen Standarddeutsch klar, würdig und kontextgerecht.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzstruktur. Die Personifikation der Berge und die Bildsprache göttlicher Macht bleiben erhalten.
