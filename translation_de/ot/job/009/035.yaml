  text: אַֽ֭דַבְּרָה וְ/לֹ֣א אִירָאֶ֑/נּוּ כִּ֥י לֹא כֵ֥ן אָ֝נֹכִ֗י עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/035.yaml
  text: Then I would speak and not fear him[a], for I am not so in myself.
translation:
  language: de
  text: Dann würde ich reden und mich nicht vor ihm fürchten[a]; denn so steht es nicht mit mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann will ich reden und mich nicht vor ihm fürchten.“ Der hebräische Schlusssatz lässt sich auch formaler wiedergeben: „Denn nicht so bin ich bei mir selbst.“ Er ist elliptisch und in seiner genauen Bedeutung unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַבְּרָה
  choice: Dann würde ich reden
  rationale: Die Kohortativ-/Imperfektform der 1. Person Singular bezeichnet im Zusammenhang eine beabsichtigte oder hypothetische Handlung. „Dann würde ich reden“ macht zugleich den Bezug zum vorausgehenden Wunsch deutlich.
- source_word: וְלֹא אִירָאֶנּוּ
  choice: und mich nicht vor ihm fürchten
  rationale: ירא mit Suffix der 3. Person maskulin Singular bedeutet unmittelbar, sich vor ihm zu fürchten; die deutsche reflexive Wendung ist natürlich und präzise.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier die Begründung der vorhergehenden Aussage ein.
- source_word: לֹא כֵן
  choice: so … nicht
  rationale: Die knappe Vergleichsformel bleibt in der idiomatischen deutschen Wendung erhalten, ohne ihren unbestimmten Bezug vorschnell festzulegen.
- source_word: אָנֹכִי עִמָּדִי
  choice: steht es … mit mir
  rationale: Die wörtlich schwierige und elliptische Verbindung („ich … bei/mit mir“) wird durch eine geläufige deutsche Zustandsformel wiedergegeben, die den Selbstbezug und die Offenheit des Hebräischen wahrt.
theological_decisions:
- issue: Deutung des elliptischen Schlusssatzes
  choice: denn so steht es nicht mit mir
  alternative: denn so bin ich nicht bei mir selbst
  rationale: Der hebräische Schlusssatz ist äußerst knapp und syntaktisch ungewöhnlich. Die gewählte Fassung bleibt verständlich, legt aber weder einen bestimmten inneren Zustand noch eine weitergehende theologische Aussage fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der hypothetische Zusammenhang wird mit „würde“ ausgedrückt; die ungewöhnliche Schlusswendung wird lesbar wiedergegeben, ihre echte Mehrdeutigkeit jedoch in der Fußnote kenntlich gemacht.
