  text: אָנֹכִ֥י אֶרְשָׁ֑ע לָ/מָּה זֶּ֝֗ה הֶ֣בֶל אִיגָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/029.yaml
  text: I will be condemned[a]; why then should I labor in vain?
translation:
  language: de
  text: Ich werde schuldig gesprochen[a] – warum sollte ich mich dann vergeblich abmühen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde gottlos/frevlerisch sein.“ Das hebräische Verb kann sowohl moralisch („gottlos/frevlerisch sein“) als auch gerichtlich („für schuldig gelten oder schuldig gesprochen werden“) verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָנֹכִי
  choice: Ich
  rationale: Das selbstständige Personalpronomen hebt das Subjekt hervor; das ausdrückliche „Ich“ bewahrt diese Betonung.
- source_word: אֶרְשָׁע
  choice: werde für schuldig erklärt
  rationale: Das Qal von רשע kann moralisch „schuldig/frevelhaft sein“ oder in einem gerichtlichen Zusammenhang „für schuldig gelten beziehungsweise erklärt werden“ bedeuten. Hiobs Argument in 9,28–31 legt die forensische Wiedergabe nahe; die Zukunftsform wahrt den modalen beziehungsweise zukünftigen Bezug.
- source_word: לָמָה זֶּה
  choice: warum … dann
  rationale: 'Die Verbindung ist idiomatisch als folgernde Frage zu verstehen: „Warum dann?“ Das demonstrative זֶה wird daher nicht isoliert mit „dies“ wiedergegeben.'
- source_word: הֶבֶל
  choice: vergeblich
  rationale: הֶבֶל bezeichnet Leere, Nichtigkeit oder Vergeblichkeit. Hier kennzeichnet es Hiobs Mühe als zwecklos.
- source_word: אִיגָע
  choice: sollte ich mich … abmühen
  rationale: יגע bezeichnet mühevolle, ermüdende Arbeit. In der rhetorischen Frage bringt „sich abmühen“ sowohl Anstrengung als auch Erschöpfung natürlich zum Ausdruck.
theological_decisions:
- issue: Forensische oder moralische Bedeutung von רשע
  choice: 'forensisch: „werde für schuldig erklärt“'
  alternative: 'moralisch beziehungsweise beschreibend: „werde schuldig sein“ oder „werde als Frevler dastehen“'
  rationale: Der Zusammenhang handelt davon, dass Hiob seine Unschuld vor Gott nicht zur Geltung bringen kann und trotz seiner Bemühungen als schuldig dasteht. Die forensische Formulierung passt dazu, ohne die echte lexikalische Mehrdeutigkeit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet die folgernde rhetorische Frage knapp und natürlich ab; „sich abmühen“ ist allgemein verständlich und bewahrt den Aspekt anstrengender, letztlich vergeblicher Arbeit.
