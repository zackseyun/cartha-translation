  text: אִם הִתְרָחַ֥צְתִּי במו שָׁ֑לֶג וַ֝/הֲזִכּ֗וֹתִי בְּ/בֹ֣ר כַּפָּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/030.yaml
  text: If I washed myself with snow and cleansed my hands with lye,[a]
translation:
  language: de
  text: Wenn ich mich auch mit Schnee wüsche und meine Hände mit Lauge[a] reinigte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Seife«; das hebräische Wort bezeichnet genauer ein alkalisches Reinigungsmittel, etwa Lauge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: wenn … auch
  rationale: Leitet eine hypothetische Bedingung ein; zusammen mit dem folgenden Kontext gibt die Formulierung im Deutschen idiomatisch den Sinn »selbst wenn« wieder, ohne die Bedingungsstruktur aufzugeben.
- source_word: הִתְרָחַצְתִּי
  choice: ich mich … wüsche
  rationale: Das Hitpael von רחץ ist reflexiv. Der Konjunktiv II passt zu der hypothetischen Aussage und ist im modernen Deutsch natürlich.
- source_word: במו שָׁלֶג
  choice: mit Schnee
  rationale: Gibt das Mittel der Reinigung direkt wieder. »Schneewasser« wäre eine plausible, aber im Hebräischen nicht ausdrücklich genannte Präzisierung.
- source_word: וַהֲזִכּוֹתִי
  choice: und … reinigte
  rationale: Das Hifil von זכה bezeichnet das Reinmachen. »Reinigte« wahrt die Parallelität zum Waschen und lässt den körperlichen wie auch den moralischen Anklang bestehen.
- source_word: בְּבֹר
  choice: mit Lauge
  rationale: בֹּר bezeichnet hier ein alkalisches Reinigungsmittel. »Lauge« ist im Deutschen genauer als das allgemeinere und potenziell anachronistische »Seife«.
- source_word: כַּפָּי
  choice: meine Hände
  rationale: Wörtlich sind die Handflächen gemeint; im deutschen Zusammenhang ist »Hände« die natürliche und sachlich angemessene Wiedergabe.
