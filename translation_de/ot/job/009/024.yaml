id: JOB.9.24
reference: Job 9:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֶ֤רֶץ נִתְּנָ֬ה בְֽ/יַד רָשָׁ֗ע פְּנֵֽי שֹׁפְטֶ֥י/הָ יְכַסֶּ֑ה אִם לֹ֖א אֵפ֣וֹא מִי הֽוּא׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/024.yaml
  text: The earth is given into the hand of the wicked[a]; he covers the faces of its judges. If not[b], then who is it?
translation:
  language: de
  text: Die Erde ist in die Hand des Frevlers gegeben[a]; er verhüllt die Gesichter ihrer Richter[b]. Wenn nicht – wer ist es dann?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Land ist in die Hand eines Frevlers gegeben.“ Das hebräische Wort kann „Erde“ oder „Land“ bedeuten; „Frevler“ kann einen einzelnen Menschen oder den Frevler als Typus bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wer „verhüllt“, wird im Hebräischen nicht ausdrücklich genannt. Gemeint sein können Gott, der Frevler oder ein nicht näher bestimmter Handelnder.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Im Zusammenhang von Hiobs umfassender Klage über die ungerechte Weltordnung liegt „Erde“ nahe; „Land“ bleibt als echte Alternative in der Fußnote erhalten.
- source_word: נִתְּנָה
  choice: ist ... gegeben
  rationale: Das Nifal Perfekt von נתן bezeichnet hier passiv den bestehenden Zustand als Ergebnis einer Übergabe. „Ist gegeben“ bewahrt Form und zeitliche Offenheit.
- source_word: בְיַד
  choice: in die Hand
  rationale: Die hebräische Wendung bezeichnet die Auslieferung in jemandes Macht. Das deutsche Bild „in die Hand gegeben“ ist natürlich und bewahrt die Metapher.
- source_word: רָשָׁע
  choice: des Frevlers
  rationale: Das substantivierte maskuline Singularwort kann einen einzelnen gottlosen Menschen oder einen typischen Vertreter der Frevler bezeichnen. Der generische bestimmte Singular „der Frevler“ wahrt diese Knappheit besser als eine pluralische Verallgemeinerung.
- source_word: פְּנֵי שֹׁפְטֶיהָ
  choice: die Gesichter ihrer Richter
  rationale: Die konkrete Bildsprache von פָּנִים („Gesicht/Gesichter“) und die Bedeutung „Richter“ für שֹׁפְטִים werden direkt wiedergegeben. Das feminine Pronomen „ihrer“ nimmt grammatisch passend „die Erde“ auf.
- source_word: יְכַסֶּה
  choice: er verhüllt
  rationale: Das Piel Imperfekt 3. Person maskulin Singular bedeutet am ehesten „er bedeckt/verhüllt“. „Verhüllt“ ist im Deutschen für Gesichter idiomatisch, ohne wie „blendet“ eine zusätzliche Deutung einzutragen. Wer das Subjekt ist, bleibt im Hebräischen unausgesprochen.
- source_word: אִם לֹא אֵפוֹא מִי הוּא
  choice: Wenn nicht – wer ist es dann?
  rationale: Die knappe rhetorische Frage wird ohne ergänztes Bezugswort wiedergegeben. „Dann“ bringt die folgernde Kraft von אֵפוֹא zum Ausdruck; der Gedankenstrich erhält den abrupten poetischen Nachdruck.
theological_decisions:
- issue: Identität des unausgesprochenen Subjekts von „er verhüllt“ und der abschließenden Frage
  choice: Die Übersetzung nennt keinen ausdrücklich bestimmten Handelnden; das grammatisch notwendige „er“ bleibt durch eine Fußnote als mehrdeutig ausgewiesen.
  alternative: Das Subjekt ausdrücklich als Gott, den Frevler oder eine unbestimmte Instanz benennen beziehungsweise passiv übersetzen.
  rationale: Der Zusammenhang kann Gott als letztlich Verantwortlichen nahelegen, während der unmittelbar vorausgehende „Frevler“ ebenfalls als Subjekt verstanden werden kann. Der hebräische Wortlaut entscheidet dies nicht ausdrücklich; die theologische Spannung darf daher nicht aufgelöst werden.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrter poetischer Bildhaftigkeit. „Frevler“ ist gehoben, aber allgemein verständlich und entspricht dem weisheitlichen Kontext. Der Gedankenstrich bildet die zugespitzte rhetorische Schlussfrage ab.
