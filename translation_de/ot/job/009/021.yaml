  text: I am blameless[a]; I do not know myself; I despise my life.
translation:
  language: de
  text: Ich bin untadelig; ich kenne mich selbst nicht[a], ich verachte mein Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich achte nicht auf mich selbst“ oder „Ich kümmere mich nicht um mich selbst.“ Das hebräische Wort kann „Selbst“, „Seele“ oder „Leben“ bezeichnen; auch „kennen“ kann hier im Sinn von beachten oder sich kümmern verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּם
  choice: untadelig
  rationale: Das Wort bezeichnet Ganzheit beziehungsweise Rechtschaffenheit und beschreibt Hiob im Kontext als untadelig, ohne damit absolute Sündlosigkeit zu behaupten.
- source_word: לֹא אֵדַע נַפְשִׁי
  choice: Ich kenne mich selbst nicht
  rationale: Die möglichst direkte Wiedergabe erhält die schroffe und mehrdeutige Aussage. נֶפֶשׁ kann hier die eigene Person, das Selbst oder das Leben bezeichnen.
- source_word: אֶמְאַס
  choice: ich verachte
  rationale: מָאַס bedeutet ablehnen oder verachten; „verachte“ bewahrt hier die starke emotionale Aussage, ohne sie bis zu „verabscheuen“ zu steigern.
- source_word: חַיָּי
  choice: mein Leben
  rationale: Der Ausdruck bezeichnet Hiobs eigenes Leben beziehungsweise Dasein und wird im Deutschen natürlich mit „mein Leben“ wiedergegeben.
theological_decisions:
- issue: Reichweite von Hiobs Aussage, untadelig zu sein
  choice: untadelig
  alternative: unschuldig
  rationale: „Untadelig“ bewahrt die im Hiobbuch wichtige Sprache persönlicher Rechtschaffenheit, ohne die Behauptung als absolute Sündlosigkeit oder als bloße Unschuld an einer einzelnen Tat festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze bewahren den abgerissenen, zugespitzten Charakter des Hebräischen; die Mehrdeutigkeit der mittleren Aussage wird nicht stillschweigend aufgelöst.
