lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: ענה führt in dieser Gesprächsformel eine Erwiderung ein. „antwortete“ bewahrt den dialogischen Sinn und passt dazu, dass Hiob auf die vorangegangene Rede reagiert.
- source_word: אִיּוֹב
  choice: Hiob
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: וַיֹּאמַר
  choice: sagte
  rationale: אמר ist das gewöhnliche Verb des Sagens. „sagte“ bildet das zweite Verb der hebräischen Formel ab, ohne sie unnötig auszudeuten.
- source_word: וַ
  choice: Darauf
  rationale: Das Präfix Waw an den Wayyiqtol-Formen kennzeichnet die narrative Folge. „Darauf“ gibt den Übergang von der vorhergehenden Rede zu Hiobs Antwort in natürlichem Deutsch wieder.
