id: JOB.9.23
reference: Job 9:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם שׁ֭וֹט יָמִ֣ית פִּתְאֹ֑ם לְ/מַסַּ֖ת נְקִיִּ֣ם יִלְעָֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/023.yaml
  text: If a scourge kills suddenly[a], he mocks the calamity of the innocent.
translation:
  language: de
  text: Wenn eine Geißel plötzlich tötet, spottet er über den Zusammenbruch[a] der Unschuldigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die Prüfung der Unschuldigen“; auch: „über das Dahinschwinden der Unschuldigen“. Das seltene hebräische Wort kann eine Prüfung oder ein Zusammenbrechen beziehungsweise Sich-Auflösen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die Konjunktion wahrt den konditionalen beziehungsweise hypothetischen Charakter der Aussage, ohne sie zu einem regelmäßig eintretenden Geschehen umzudeuten.
- source_word: שׁוֹט
  choice: eine Geißel
  rationale: Das Wort bezeichnet wörtlich eine Peitsche oder Geißel und kann bildlich eine verheerende Plage meinen. „Geißel“ erhält sowohl das konkrete Bild als auch den erweiterten Sinn.
- source_word: יָמִית
  choice: tötet
  rationale: Der Hifil von מות bedeutet „sterben lassen, töten“. „Tötet“ ist präzise und in modernem Deutsch unmittelbar verständlich.
- source_word: פִּתְאֹם
  choice: plötzlich
  rationale: Dies entspricht der üblichen adverbialen Bedeutung und gibt die Unvermitteltheit knapp wieder.
- source_word: לְמַסַּת
  choice: über den Zusammenbruch
  rationale: Das seltene Substantiv lässt sich mit Prüfung beziehungsweise Erprobung verbinden, kann aber auch Auflösung, Dahinschwinden oder Zusammenbruch bezeichnen. „Zusammenbruch“ bewahrt in diesem Zusammenhang das Bild des Zerfallens, ohne es auf ein rein inneres Gefühl wie Verzweiflung zu verengen.
- source_word: נְקִיִּם
  choice: der Unschuldigen
  rationale: Gemeint sind Menschen, die frei von Schuld sind. Die substantivierte Form ist im Deutschen idiomatisch und passt zu Hiobs Klage über unverdientes Leiden.
- source_word: יִלְעָג
  choice: spottet er
  rationale: Das Verb bedeutet „spotten, verlachen“. Die Wortstellung ist natürliches Deutsch und lässt den nur aus dem Zusammenhang erschließbaren Bezug des Pronomens bestehen.
theological_decisions:
- issue: Subjekt von „spottet“
  choice: Das im Hebräischen unausgesprochene Subjekt wird mit „er“ wiedergegeben; im Zusammenhang zielt Hiobs Anklage wahrscheinlich auf Gott.
  alternative: Die Geißel könnte personifiziert als Subjekt verstanden werden; auch ein unbestimmtes Subjekt wäre grammatisch erwägenswert.
  rationale: „Er“ macht Gott nicht ausdrücklich zum Subjekt und bewahrt dadurch die formale Mehrdeutigkeit, lässt aber die scharfe theologische Spannung von Hiobs Rede unverändert stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe und anstößig scharfe Aussage Hiobs wird weder abgeschwächt noch durch die ausdrückliche Einfügung „Gott“ dogmatisch vereindeutigt.
