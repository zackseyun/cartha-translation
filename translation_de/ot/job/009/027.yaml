  text: 'Wenn ich mir sage: »Ich will meine Klage[a] vergessen, meine traurige Miene ablegen und wieder heiter werden[b]«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mein Nachsinnen« bzw. »meine innere Rede«. Das hebräische Wort kann innere Rede, Nachdenken oder Klage bezeichnen; im Zusammenhang dieses Klagelieds passt »Klage« am besten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »mein Gesicht verlassen und heiter werden«. Gemeint ist, die niedergeschlagene Miene abzulegen und zu versuchen, wieder heiter zu wirken. Die genaue Nuance des seltenen hebräischen Verbs ist unsicher.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם אָמְרִי
  choice: Wenn ich mir sage
  rationale: אִם leitet hier einen hypothetischen Gedanken ein. Das Perfekt אָמְרִי wird im Deutschen in diesem Zusammenhang natürlich mit dem Präsens wiedergegeben; »mir« verdeutlicht Jobs Selbstgespräch, ohne den Sinn zu verändern.
- source_word: אֶשְׁכְּחָה
  choice: Ich will … vergessen
  rationale: Die Form bezeichnet Jobs beabsichtigten Entschluss. »Ich will« gibt diesen voluntativen Zug direkt und idiomatisch wieder.
- source_word: שִׂיחִי
  choice: meine Klage
  rationale: שִׂיחַ kann innere Rede, Nachsinnen oder Klage bezeichnen. Im Zusammenhang von Jobs Leiden ist »Klage« am treffendsten, während die Bedeutungsbreite in einer Fußnote erhalten bleibt.
- source_word: אֶעֶזְבָה פָנַי
  choice: meine düstere Miene ablegen
  rationale: Wörtlich steht »mein Gesicht verlassen/aufgeben«. Die idiomatische Wiedergabe bezeichnet das Ablegen eines niedergeschlagenen Gesichtsausdrucks und klingt im modernen Deutsch natürlich.
- source_word: וְאַבְלִיגָה
  choice: und mich aufheitern
  rationale: בלג bezeichnet hier wahrscheinlich ein Nachlassen des Kummers beziehungsweise ein Aufhellen der Stimmung oder Miene. »Mich aufheitern« bewahrt sowohl den bewussten Versuch als auch die emotionale Bildhaftigkeit.
