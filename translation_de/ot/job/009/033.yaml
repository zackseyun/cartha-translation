  variant: modern standard German
source:
  edition: WLC
  text: לֹ֣א יֵשׁ בֵּינֵ֣י/נוּ מוֹכִ֑יחַ יָשֵׁ֖ת יָד֣/וֹ עַל שְׁנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/033.yaml
  text: There is no arbiter between us[a], who might lay his hand on us both.
translation:
  language: de
  text: Es gibt keinen Schiedsrichter[a] zwischen uns, der seine Hand auf uns beide legen könnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vermittler«. Das hebräische Wort kann jemanden bezeichnen, der zwischen zwei Streitparteien entscheidet oder eingreift.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יֵשׁ
  choice: Es gibt keinen
  rationale: Die hebräische Existenzverneinung wird im Deutschen idiomatisch und unmittelbar wiedergegeben.
- source_word: בֵּינֵינוּ
  choice: zwischen uns
  rationale: Die Form bezeichnet hier die Beziehung zwischen den beiden Streitparteien, Hiob und Gott.
- source_word: מוֹכִיחַ
  choice: Schiedsrichter
  rationale: Im rechtlichen Zusammenhang bezeichnet das Wort eine dritte Instanz, die zwischen Streitparteien entscheidet oder eingreift. „Schiedsrichter“ bewahrt diesen forensischen Sinn, ohne eine spätere theologische Deutung festzuschreiben.
- source_word: יָשֵׁת
  choice: legen könnte
  rationale: Die Verbform bezeichnet hier die gedachte Möglichkeit des Handelns durch den nicht vorhandenen Schiedsrichter.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Das konkrete hebräische Bild bleibt erhalten; die Hand kann dabei zugleich Autorität und Eingreifen ausdrücken.
- source_word: עַל שְׁנֵינוּ
  choice: auf uns beide
  rationale: Die Wendung bezieht den Schiedsrichter gleichermaßen auf beide Streitparteien und bewahrt das Bild der auf beide gelegten Hand.
theological_decisions:
- issue: Ob מוֹכִיחַ mit dem christologisch anklingenden Ausdruck „Vermittler“ wiederzugeben ist
  choice: Schiedsrichter
  alternative: Vermittler
  rationale: Der unmittelbare Zusammenhang ist Hiobs Rechtsstreit mit Gott und sein Wunsch nach einer dritten, entscheidenden Instanz. „Schiedsrichter“ wahrt diesen forensischen Sinn, während „Vermittler“ als mögliche, theologisch bedeutsame Alternative in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die klare Existenzverneinung und das anschauliche Bild der auf beide Parteien gelegten Hand wurden bewahrt; die hypothetische Nuance erscheint durch „könnte“.
