translation:
  language: de
  text: der die Erde von ihrer Stelle wegschüttelt und ihre Säulen erzittern[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: beben; oder: schaudern.'
    reason: Lexikalische Alternativen für יִתְפַלָּצוּן, das heftiges Zittern oder Beben bezeichnen kann.
lexical_decisions:
- source_word: הַמַּרְגִּיז
  choice: der … erbeben lässt
  rationale: Das Hifil-Partizip von רגז hat verursachende Bedeutung und setzt die Beschreibung Gottes in Form eines relativisch gebrauchten Partizips fort. „Erbeben lässt“ gibt diese Kausativität natürlich wieder.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Das kosmische Bild von Ort und Säulen spricht hier eher für die ganze Erde als für ein begrenztes Land.
- source_word: מִמְּקוֹמָהּ
  choice: von ihrer Stelle
  rationale: Die Präposition מן und das Substantiv mit Suffix bezeichnen eine Bewegung beziehungsweise Erschütterung weg vom angestammten Ort. „Von ihrer Stelle“ ist im heutigen Deutsch idiomatisch und bewahrt das Bild.
- source_word: וְעַמּוּדֶיהָ
  choice: und ihre Säulen
  rationale: „Säulen“ entspricht der Grundbedeutung von עמוד und erhält die poetische kosmologische Vorstellung, ohne sie deutend zu „Fundamenten“ umzuschreiben.
- source_word: יִתְפַלָּצוּן
  choice: erzittern
  rationale: Das Verb bezeichnet heftiges Zittern, Beben oder Schaudern. „Erzittern“ passt zur gewaltsamen kosmischen Bewegung und vermeidet eine unnötige psychologische Deutung.
theological_decisions:
- issue: Kosmologisches Bild von den Säulen der Erde
  choice: Das Bild wird wörtlich als „ihre Säulen“ bewahrt.
  alternative: Das Bild deutend mit „ihre Fundamente“ wiedergeben oder an moderne kosmologische Vorstellungen angleichen.
  rationale: Der hebräische Vers verwendet poetische altorientalische Kosmologie. Die Übersetzung soll dieses literarische Bild weder modernisieren noch als naturwissenschaftliche Aussage umformen.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der mit „der“ beginnende Vers wahrt die syntaktische Fortsetzung der Gottesbeschreibung im Kontext. Die parallelen Verben „erbeben lässt“ und „erzittern“ erhalten sowohl die Kausativität der ersten Verbform als auch die Bildkraft der zweiten.
