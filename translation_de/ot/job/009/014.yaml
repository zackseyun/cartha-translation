  text: How much less could I answer him and choose my words with him?[a][b][c]
translation:
  language: de
  text: Wie viel weniger könnte ich ihm antworten und meine Worte ihm gegenüber wählen?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie könnte ich ihm dann antworten?« Der hebräische Anfang ist eine idiomatische Wendung, die im Zusammenhang eine noch stärkere Unmöglichkeit ausdrückt.'
    reason: lexical_alternative
  - marker: b
    text: Statt »meine Worte« ist sinngemäß auch »meine Argumente« möglich, da Hiob davon spricht, seinen Fall vor Gott vorzutragen.
    reason: lexical_alternative
  - marker: c
    text: Für »ihm gegenüber« sind je nach Deutung auch »vor ihm«, »mit ihm« oder »gegen ihn« möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: Wie viel weniger
  rationale: 'Die idiomatische Verbindung leitet hier einen Schluss vom Größeren auf das Kleinere ein: Wenn niemand Gott widerstehen kann, kann Hiob ihm erst recht nicht antworten.'
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Personalpronomen hebt Hiob hervor; die deutsche Satzstellung vermittelt die Betonung ausreichend.
- source_word: אֶעֱנֶנּוּ
  choice: könnte ich ihm antworten
  rationale: ענה bedeutet im Qal gewöhnlich »antworten«; der Konjunktiv II gibt innerhalb der rhetorischen Frage Hiobs empfundene Unmöglichkeit natürlich wieder.
- source_word: אֶבְחֲרָה
  choice: wählen
  rationale: בחר behält seine Grundbedeutung »wählen, auswählen« und bezeichnet hier die sorgfältige Wahl dessen, was Hiob zu Gott sagen könnte.
- source_word: דְבָרַי
  choice: meine Worte
  rationale: דבר kann »Wort, Sache, Rede« bedeuten. »Meine Worte« ist nah am hebräischen Ausdruck und wahrt das Bild bewusster Wortwahl, ohne schon »Argumente« festzulegen.
- source_word: עִמּוֹ
  choice: ihm gegenüber
  rationale: עם bedeutet grundsätzlich »mit«. Im Zusammenhang einer möglichen Auseinandersetzung mit Gott gibt »ihm gegenüber« die relationale beziehungsweise forensische Nuance idiomatischer wieder, ohne eindeutig »gegen ihn« festzulegen.
theological_decisions:
- issue: Art von Hiobs Unvermögen, Gott zu antworten
  choice: Die rhetorische Form und das »könnte« wahren die Spannung zwischen praktischer Unmöglichkeit, menschlicher Unterlegenheit und möglicher gerichtlicher Auseinandersetzung.
  alternative: Die Aussage ausdrücklich als moralische Unwürdigkeit oder rechtliche Schuld Hiobs zu deuten.
  rationale: Der hebräische Vers benennt keine bestimmte dogmatische Ursache, sondern betont im Kontext Gottes Unwiderstehlichkeit und Hiobs Unfähigkeit, ihm angemessen zu entgegnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe am hebräischen Bild der Wortwahl; »ihm gegenüber« ist im Deutschen natürlicher als »mit ihm« und bewahrt zugleich die Mehrdeutigkeit des forensisch-disputativen Verhältnisses.
