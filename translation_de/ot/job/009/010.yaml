translation:
  language: de
  text: der Großes tut, das unerforschlich ist,[a] und Wunder, die nicht zu zählen sind.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das nicht zu ergründen ist“. Die hebräische Wendung bedeutet, dass seine großen Taten nicht vollständig erforscht oder begriffen werden können.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wunder ohne Zahl“; gemeint ist: unzählige Wunder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: der … tut
  rationale: Das Qal-Partizip beschreibt Gott aus dem vorherigen Zusammenhang. Die Relativkonstruktion ist im Deutschen natürlich und bewahrt den fortlaufenden Satzanschluss.
- source_word: גְדֹלוֹת
  choice: Großes
  rationale: Das substantivierte feminine Pluraladjektiv bezeichnet große Dinge beziehungsweise Taten, ohne die Aussage unnötig auf eine bestimmte Art von Werken einzuengen.
- source_word: עַד אֵין חֵקֶר
  choice: das unerforschlich ist
  rationale: Die hebräische Wendung besagt, dass Gottes große Taten menschlicher Erforschung und vollständigem Begreifen entzogen sind. Die Formulierung ist gegenwärtig, würdig und verständlich.
- source_word: וְנִפְלָאוֹת
  choice: und Wunder
  rationale: נפלאות bezeichnet außergewöhnliche, staunenerregende Taten. „Wunder“ gibt dies knapp und idiomatisch wieder.
- source_word: עַד אֵין מִסְפָּר
  choice: die nicht zu zählen sind
  rationale: Die Wendung bezeichnet eine unzählbare Menge. Diese Formulierung gibt den Sinn natürlich wieder und lässt die parallele Satzstruktur erkennen.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem poetischem Register. Der Vers bleibt als Relativsatz an den vorherigen Kontext angeschlossen. Die beiden parallelen Aussagen des Hebräischen werden bewahrt, ohne ihre Aussage künstlich zu präzisieren.
