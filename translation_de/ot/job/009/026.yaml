  yaml_path: translation/ot/job/009/026.yaml
  text: They pass by like reed boats, like an eagle swooping on prey.
translation:
  language: de
  text: Sie ziehen vorüber wie Schilfboote, wie ein Adler, der auf Beute herabstößt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלְפוּ
  choice: sie gleiten dahin
  rationale: Das Verb bezeichnet ein rasches Vorüberziehen. „Dahingleiten“ passt natürlich zu den Booten und bewahrt den Eindruck großer Geschwindigkeit im Kontext.
- source_word: אֳנִיּוֹת אֵבֶה
  choice: Boote aus Schilf
  rationale: אֵבֶה ist selten und bezeichnet hier wahrscheinlich Schilf beziehungsweise Papyrus als leichtes Material für schnelle Boote. „Schilf“ folgt der konsultierten Fassung und ist im Deutschen allgemein verständlich.
- source_word: נֶשֶׁר
  choice: Adler
  rationale: Der hebräische Vogelname kann einen großen Adler- oder Geiervogel bezeichnen; „Adler“ ist in diesem Jagdbild die natürliche traditionelle Wiedergabe.
- source_word: יָטוּשׂ עֲלֵי אֹכֶל
  choice: der auf Beute herabstößt
  rationale: Die Formulierung beschreibt den schnellen Stoßflug auf Nahrung beziehungsweise Beute. „Beute“ gibt den konkreten Sinn des Jagdbildes idiomatisch wieder.
