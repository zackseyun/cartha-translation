source:
  edition: WLC
  text: עֹֽשֶׂה עָ֭שׁ כְּסִ֥יל וְ/כִימָ֗ה וְ/חַדְרֵ֥י תֵמָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/009.yaml
  text: who made the Bear[a], Orion, and the Pleiades[c][b], and the chambers of the south.
translation:
  language: de
  text: der den Bären[b], den Orion, die Plejaden und die Kammern des Südens[c] schuf[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der den Bären, den Orion, die Plejaden und die Kammern des Südens macht“. Das hebräische Partizip kann sowohl fortdauerndes Handeln als auch eine vollendete Tat bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Der Bär“ gibt den hebräischen Namen eines Sternbilds wieder. In älteren Übersetzungen steht teilweise „Arktur“.
    reason: alternative_reading
  - marker: c
    text: Die „Kammern des Südens“ bezeichnen wahrscheinlich in poetischer Sprache die verborgenen Regionen oder Sternbilder des südlichen Himmels.
    reason: cultural_note
lexical_decisions:
- source_word: עֹשֶׂה
  choice: schuf
  rationale: Das Qal-Partizip beschreibt Gott in einem Relativsatz. Im Zusammenhang passt das Präteritum als Hinweis auf sein Schöpfungshandeln; die grammatisch mögliche gegenwärtige Bedeutung bleibt in einer Fußnote erhalten.
- source_word: עָשׁ
  choice: der Bär
  rationale: Das Wort bezeichnet hier wahrscheinlich das Sternbild des Bären. Die geläufige deutsche Bezeichnung ist verständlicher als eine Transliteration und weniger irreführend als die traditionelle Wiedergabe „Arktur“.
- source_word: כְּסִיל
  choice: Orion
  rationale: In diesem astronomischen Zusammenhang wird das Wort weithin als Bezeichnung des Sternbilds Orion verstanden.
- source_word: כִימָה
  choice: die Plejaden
  rationale: Das Wort wird üblicherweise mit dem Sternhaufen der Plejaden identifiziert; die geläufige astronomische Bezeichnung gibt den wahrscheinlichen Bezug klar wieder.
- source_word: חַדְרֵי תֵמָן
  choice: die Kammern des Südens
  rationale: Die wörtlich-poetische Wendung bewahrt das Bild verborgener Räume des südlichen Himmels, ohne es vorschnell zu „Sternbilder des Südens“ zu verdeutlichen. תֵמָן ist hier richtungsbezogen als „Süden“ verstanden.
