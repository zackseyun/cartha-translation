  register: Moderne, würdevolle Standardsprache. Die knappe Relativsatzform setzt syntaktisch den vorausgehenden Vers fort. Die bekannten astronomischen Namen werden direkt verwendet; das ungewöhnliche Bild „Kammern des Südens“ bleibt bewusst erhalten.
