  yaml_path: translation/ot/job/009/003.yaml
  text: If one wished to contend with him[b][a], he could not answer him one time out of a thousand.
translation:
  language: de
  text: Wenn jemand mit ihm streiten wollte,[a] könnte er ihm nicht einmal eines von tausend Malen antworten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit ihm einen Rechtsstreit führen“. Das hebräische Verb kann sowohl einen Streit als auch eine rechtliche Auseinandersetzung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Er könnte ihm nicht eines von tausend antworten.“ Gemeint ist, dass er nicht einmal in einem von tausend Fällen antworten könnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet hier einen hypothetischen Bedingungssatz ein.
- source_word: יַחְפֹּץ
  choice: wollte
  rationale: Das Verb bezeichnet Wunsch oder Bereitschaft; im deutschen Konditionalsatz gibt „wollte“ den hypothetischen Sinn natürlich wieder.
- source_word: לָרִיב
  choice: rechten
  rationale: „Rechten“ bewahrt sowohl den allgemeinen Sinn des Streitens als auch den möglichen rechtlichen Beiklang des hebräischen Verbs ריב.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: Entspricht der Präposition formal; der gegnerische Sinn ergibt sich aus „rechten“.
- source_word: לֹא יַעֲנֶנּוּ
  choice: könnte er ihm nicht … antworten
  rationale: ענה bedeutet hier „antworten“; der Zusammenhang legt Unvermögen und nicht bloße Weigerung nahe.
- source_word: אַחַת מִנִּי אָלֶף
  choice: unter tausend Malen nicht ein einziges Mal
  rationale: Gibt die extreme Unverhältnismäßigkeit der hebräischen Wendung wieder, ohne einen nicht ausdrücklich genannten Gegenstand wie „Fragen“ oder „Anklagen“ einzufügen.
theological_decisions:
- issue: Bezug der Pronomen
  choice: Der Haupttext lässt „jemand“, „ihm“ und „er“ stehen; im Zusammenhang ist ein Mensch gemeint, der mit Gott rechten will.
  alternative: Die Pronomen könnten isoliert als zwei nicht näher bestimmte menschliche Streitgegner verstanden werden.
  rationale: Hiob 9,2–4 handelt von Gottes Weisheit und Macht. Dennoch wird „Gott“ nicht ergänzend in den Vers eingesetzt, damit die Ausdrucksweise des Hebräischen erhalten bleibt.
- issue: Art des Streitens
  choice: „rechten“ lässt einen gerichtlichen oder streitenden Vorgang anklingen.
  alternative: „streiten“ oder „einen Rechtsstreit führen“
  rationale: Das Hebräische kann sowohl einen Streit allgemein als auch eine rechtliche Auseinandersetzung bezeichnen; die Übersetzung soll diese Spannung nicht unnötig festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Rechten“ ist gehoben, aber allgemein verständlich und erhält den forensischen Beiklang. Die ungewöhnliche Größenangabe bleibt nahe am hebräischen Bild; eine Fußnote erläutert die Ellipse.
