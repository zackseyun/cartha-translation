  terminology: Die Fußnote soll den rechtlichen Beiklang von ריב weiterhin nennen, aber „einen Rechtsstreit mit ihm führen“ als Alternative in natürlicher deutscher Wortstellung formulieren. Die zweite Fußnote sollte die hebräische Ellipse nicht mit der unidiomatischen Formulierung „eines von tausend antworten“ erklären.
