source:
  edition: WLC
  text: אִם קָרָ֥אתִי וַֽ/יַּעֲנֵ֑/נִי לֹֽא אַ֝אֲמִ֗ין כִּֽי יַאֲזִ֥ין קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/016.yaml
  text: If I called and he answered me[a], I would not believe that he was listening to my voice.
translation:
  language: de
  text: Wenn ich riefe und er mir antwortete, würde ich nicht glauben, dass er auf meine Stimme hörte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn ich laut riefe und er mir antwortete, würde ich nicht glauben, dass er meiner Stimme Gehör schenkte.“'
    reason: Lexikalische Alternative für קרא und אזן; die Verbform wahrt das hypothetische Bedingungsgefüge.
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet ein hypothetisches Bedingungsgefüge ein; „wenn“ bewahrt diese Offenheit, ohne den Satz zeitlich oder konzessiv festzulegen.
- source_word: קָרָאתִי
  choice: ich riefe
  rationale: קרא bedeutet hier „rufen“ oder „ausrufen“. Der Konjunktiv fügt sich natürlich in die hypothetische Aussage ein, ohne unnötig stärkere Emotionalität einzutragen.
- source_word: וַיַּעֲנֵנִי
  choice: und er mir antwortete
  rationale: ענה bezeichnet direkt das Antworten beziehungsweise Erwidern; die deutsche Wortstellung ist idiomatisch und wahrt den hypothetischen Zusammenhang.
- source_word: לֹא אַאֲמִין
  choice: würde ich nicht glauben
  rationale: Die Modalform gibt im Deutschen die durch אִם eröffnete hypothetische Aussage angemessen wieder.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Hiob nicht glauben würde, und nicht eine Begründung.
- source_word: יַאֲזִין
  choice: auf … hörte
  rationale: אזן meint aufmerksames Hinhören. „Auf meine Stimme hören“ bewahrt diese Nuance natürlicher als das gehobene „sein Ohr leihen“.
- source_word: קוֹלִי
  choice: meine Stimme
  rationale: Gibt die konkrete Grundbedeutung von קוֹל wieder, ohne sie interpretierend zu „Bitte“ oder „Klage“ zu verengen.
theological_decisions:
- issue: Hiobs Aussage über Gottes Antwort und Hören
  choice: 'Als subjektiven, hypothetischen Unglauben Hiobs wiedergeben: Selbst bei einer Antwort könnte er kaum glauben, dass Gott tatsächlich auf ihn hörte.'
  alternative: Als grundsätzliche Leugnung göttlichen Hörens oder lediglich als staunende Verwunderung wiedergeben.
  rationale: Der hebräische Bedingungssatz beschreibt Hiobs persönliche Reaktion in einer vorgestellten Situation. So bleibt die theologische Spannung erhalten, ohne daraus eine allgemeine Lehraussage zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der doppelte Konjunktiv hält das hypothetische Gefüge klar; „auf meine Stimme hören“ ist verständlich und bewahrt zugleich die Nuance aufmerksamen Hörens.
