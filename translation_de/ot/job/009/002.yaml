  text: אָ֭מְנָם יָדַ֣עְתִּי כִי כֵ֑ן וּ/מַה יִּצְדַּ֖ק אֱנ֣וֹשׁ עִם אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/002.yaml
  text: Truly[a], I know that it is so[b]; but how can a man be righteous before God?
translation:
  language: de
  text: Gewiss, ich weiß, dass es so ist. Doch wie kann ein Mensch vor Gott im Recht sein?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch wie kann ein Mensch vor Gott gerecht sein?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: Gewiss
  rationale: Leitet Hiobs nachdrückliches Zugeständnis ein und klingt im modernen Deutschen würdevoll und natürlich.
- source_word: יָדַעְתִּי
  choice: ich weiß
  rationale: Das Perfekt bezeichnet hier eine feste Erkenntnis; das deutsche Präsens gibt diesen Zustand idiomatisch wieder.
- source_word: כִי כֵן
  choice: dass es so ist
  rationale: Bewahrt die bestätigende Rückbeziehung auf das zuvor Gesagte.
- source_word: וּמַה
  choice: Doch wie könnte
  rationale: Das Waw mit dem Fragewort markiert hier eine gedankliche Gegenwendung; „doch“ macht sie im Deutschen natürlich deutlich.
- source_word: יִצְדַּק
  choice: im Recht sein
  rationale: Gibt die Qal-Form von צדק mit ihrem möglichen forensischen Sinn wieder, ohne bereits einen bestimmten Vorgang der Rechtfertigung vorauszusetzen.
- source_word: אֱנוֹשׁ
  choice: ein Mensch
  rationale: Das repräsentative Singularwort bezeichnet den sterblichen, schwachen Menschen; „ein Mensch“ ist inklusiv und im Deutschen idiomatisch.
- source_word: עִם אֵל
  choice: vor Gott
  rationale: Das wörtliche „mit Gott“ beschreibt im Kontext das Bestehen Gott gegenüber; „vor Gott“ vermittelt diese relationale und forensische Bedeutung natürlich.
theological_decisions:
- issue: Forensische Nuance menschlicher Gerechtigkeit Gott gegenüber
  choice: „wie könnte ein Mensch vor Gott im Recht sein?“
  alternative: „wie könnte ein Mensch bei Gott gerecht sein?“ / „wie könnte ein Mensch Gott gegenüber gerechtfertigt werden?“
  rationale: „Im Recht sein“ bewahrt den forensischen Unterton von יִצְדַּק, ohne die Frage durch eine spätere dogmatische Ausformulierung des Rechtfertigungsgeschehens vorzeitig zu beantworten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Gegenüberstellung von Hiobs Zustimmung und seiner grundlegenden Frage bleibt erhalten; die Formulierung vermeidet konfessionell geprägte Festlegungen.
