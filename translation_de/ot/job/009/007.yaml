id: JOB.9.7
reference: Job 9:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָ/אֹמֵ֣ר לַ֭/חֶרֶס וְ/לֹ֣א יִזְרָ֑ח וּ/בְעַ֖ד כּוֹכָבִ֣ים יַחְתֹּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/007.yaml
  text: who says to the sun[b][a], ‘Do not rise,’ and seals up the stars.
translation:
  language: de
  text: 'der zur Sonne[a] sagt: »Geh nicht auf!«[b],

    und die Sterne versiegelt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort חֶרֶס bedeutet hier in poetischem Gebrauch wahrscheinlich »Sonne«; an anderen Stellen kann es »Ton« oder »Tonscherbe« bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: »und sie geht nicht auf«. Das Hebräische kann entweder den an die Sonne gerichteten Befehl oder die Wirkung von Gottes Wort ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: der … sagt
  rationale: Das Partizip führt die Beschreibung Gottes aus dem vorherigen Zusammenhang als Relativsatz weiter.
- source_word: לַחֶרֶס
  choice: zur Sonne
  rationale: חֶרֶס bezeichnet hier im poetischen Zusammenhang mit Aufgehen und Sternen die Sonne; die sonst mögliche Bedeutung »Ton« passt nicht zum Kontext.
- source_word: וְלֹא יִזְרָח
  choice: »Geh nicht auf!«
  rationale: Nach »sagt« lässt sich der Imperfekt anschaulich als Inhalt eines Befehls verstehen. Die ebenfalls mögliche resultative Lesart wird in einer Fußnote bewahrt.
- source_word: וּבְעַד
  choice: und
  rationale: Die Präposition gehört hier zur Vorstellung des Verschließens; im Deutschen gibt »die Sterne versiegelt« den Sinn natürlich wieder, ohne eine unklare räumliche Präposition einzufügen.
- source_word: כּוֹכָבִים
  choice: die Sterne
  rationale: Die bestimmte Form ist im Deutschen bei dieser kosmischen Aussage idiomatisch.
- source_word: יַחְתֹּם
  choice: versiegelt
  rationale: 'Die Wiedergabe bewahrt das Bild des hebräischen Verbs חתם: Gott verschließt die Sterne und hindert ihr Erscheinen.'
theological_decisions:
- issue: Verhältnis von Gottes Wort zum Nichtaufgehen der Sonne
  choice: Das Wort wird als direkter Befehl wiedergegeben.
  alternative: »und sie geht nicht auf«
  rationale: Die Befehlslesart bewahrt die lebendige Personifikation, ohne die mögliche Ergebnislesart auszuschließen; diese wird ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als abhängige Relativkonstruktion an den vorherigen Kontext angeschlossen. Die poetische Personifikation und das Bild des Versiegelns werden erhalten.
