base_translation:
  language: en
  yaml_path: translation/ot/job/009/031.yaml
  text: then you would plunge me into the pit[b][a], and my own clothes would abhor me.
translation:
  language: de
  text: Dann würdest du mich in die Grube[a] tauchen, und meine Kleider würden mich verabscheuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Graben“. Das hebräische Wort kann „Grube“, „Graben“ oder in manchen Zusammenhängen „Verderben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das Adverb führt die Folge des im vorherigen Vers beschriebenen Waschens ein.
- source_word: בַּשַּׁחַת
  choice: in die Grube
  rationale: שַׁחַת kann eine Grube, einen Graben oder Verderben bezeichnen. Mit dem Bewegungsverb ist die Richtungsangabe „in die“ im Deutschen natürlich; „Grube“ bewahrt das konkrete Bild und legt sich nicht auf „Verderben“ fest.
- source_word: תִּטְבְּלֵנִי
  choice: würdest du mich … tauchen
  rationale: טבל bedeutet eintauchen oder untertauchen. „tauchen“ erhält das Bild und die direkte göttliche Handlung, ohne eine im Verb nicht ausdrücklich bezeichnete Gewaltkomponente hinzuzufügen.
- source_word: וְתִעֲבוּנִי
  choice: würden mich verabscheuen
  rationale: תעב bezeichnet starke Abscheu. Das pluralische Verb wird auf die nachfolgenden „Kleider“ bezogen.
- source_word: שַׂלְמוֹתָי
  choice: meine eigenen Kleider
  rationale: Das Wort bezeichnet Kleidungsstücke beziehungsweise Gewänder. „meine eigenen“ hebt die bittere Ironie hervor, dass selbst Hiobs Kleidung vor ihm zurückschrecken würde.
theological_decisions:
- issue: Handelnder der Verben in der zweiten Person
  choice: 'Gott wird direkt angesprochen: „du würdest mich … tauchen“.'
  alternative: Eine unpersönliche Wiedergabe, nach der Hiob lediglich in die Grube geriete.
  rationale: Die Verbform steht in der zweiten Person Singular und setzt Hiobs direkte Anrede an Gott fort. So bleibt die Spannung seiner Anklage erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der irreale Folgezusammenhang wird mit „würdest“ wiedergegeben; die starke Personifikation der Kleider bleibt erhalten.
