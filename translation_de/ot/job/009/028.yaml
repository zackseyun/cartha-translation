  text: יָגֹ֥רְתִּי כָל עַצְּבֹתָ֑/י יָ֝דַ֗עְתִּי כִּי לֹ֥א תְנַקֵּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/028.yaml
  text: I am afraid of all my pains[b][a]; I know that you will not acquit me.
translation:
  language: de
  text: Ich fürchte mich vor all meinen Leiden[a]; ich weiß, dass du mich nicht freisprechen wirst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Mir graut vor all meinen Schmerzen«; auch: »Ich fürchte all meine Sorgen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »du mich nicht für unschuldig halten wirst« oder »du mich nicht ungestraft lassen wirst«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: Ich fürchte
  rationale: Das Qal Perfekt 1. Person Singular von גור bezeichnet Furcht oder Grauen. Das deutsche Präsens gibt die hier vorliegende anhaltende Haltung natürlich wieder.
- source_word: כָל
  choice: all
  rationale: Der umfassende Quantor wird unmittelbar wiedergegeben.
- source_word: עַצְּבֹתַי
  choice: meine Leiden
  rationale: Das Wort kann Schmerzen, Leiden, Kümmernisse oder Sorgen bezeichnen. „Leiden“ passt zu Hiobs umfassender Not, ohne die Bedeutung ausschließlich auf körperliche Schmerzen oder seelische Trauer festzulegen.
- source_word: יָדַעְתִּי
  choice: ich weiß
  rationale: Das Qal Perfekt 1. Person Singular von ידע hat hier stative Gegenwartsbedeutung.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Hiob weiß; im Deutschen ist ein dass-Satz die natürliche Entsprechung.
- source_word: לֹא
  choice: nicht
  rationale: Die Verneinung wird direkt wiedergegeben.
- source_word: תְנַקֵּנִי
  choice: du mich nicht freisprechen wirst
  rationale: Das Piel von נקה kann bedeuten, jemanden für unschuldig zu erklären, freizusprechen oder ungestraft zu lassen. „Freisprechen“ bewahrt den gerichtlichen Klang von Hiobs Auseinandersetzung mit Gott.
theological_decisions:
- issue: Gerichtliche Bedeutung von נקה in Hiobs Anrede an Gott
  choice: du mich nicht freisprechen wirst
  alternative: du mich nicht für unschuldig halten wirst; du mich nicht ungestraft lassen wirst
  rationale: Die Wiedergabe erhält Hiobs Überzeugung, Gott werde ihn im Streit nicht für schuldlos erklären. Sie bewahrt die rechtliche und theologische Spannung des Zusammenhangs, ohne sie durch eine spätere Lehrkategorie aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Leiden“ ist allgemein verständlich und lässt die in עַצְּבֹתַי enthaltene Bandbreite zwischen körperlichem Schmerz und umfassender Not offen; „freisprechen“ erhält das forensische Bild.
