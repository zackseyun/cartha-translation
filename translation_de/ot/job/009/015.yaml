  text: אֲשֶׁ֣ר אִם צָ֭דַקְתִּי לֹ֣א אֶעֱנֶ֑ה לִ֝/מְשֹׁפְטִ֗/י אֶתְחַנָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/015.yaml
  text: Even if I were in the right, I would not answer; I would plead for mercy from my judge.
translation:
  language: de
  text: Selbst wenn ich im Recht wäre, würde ich nicht antworten; meinen Richter würde ich um Erbarmen anflehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדַקְתִּי
  choice: ich im Recht wäre
  rationale: Das Verb bezeichnet hier, im rechtlichen Kontext, Jobs Im-Recht-Sein; die konjunktivische Form gibt die hypothetische Aussage natürlich wieder.
- source_word: לֹא אֶעֱנֶה
  choice: würde ich nicht antworten
  rationale: Bewahrt die gerichtliche Bildwelt und lässt offen, ob Job nicht antworten könnte oder angesichts des Richters darauf verzichten würde.
- source_word: לִמְשֹׁפְטִי
  choice: meinen Richter
  rationale: Das mit Suffix versehene Partizip bezeichnet den, der über Job richtet; „Richter“ ist im Deutschen prägnant und kontextgemäß.
- source_word: אֶתְחַנָּן
  choice: würde ich um Erbarmen anflehen
  rationale: Die reflexive Verbform bezeichnet ein inständiges Flehen um Gunst oder Erbarmen; die Wiedergabe erhält sowohl Intensität als auch Abhängigkeit vom Richter.
theological_decisions:
- issue: Jobs hypothetische Gerechtigkeit vor Gott
  choice: Selbst wenn ich im Recht wäre
  alternative: Obwohl ich gerecht bin
  rationale: אִם markiert eine Bedingung. Die Übersetzung lässt die Spannung zwischen Jobs Unschuldsbeteuerung und seiner Ohnmacht vor dem göttlichen Richter bestehen, ohne eine dogmatische Schlussfolgerung einzutragen.
- issue: Art der Reaktion gegenüber dem Richter
  choice: nicht antworten; ... um Erbarmen anflehen
  alternative: mich nicht verteidigen; ... um Gnade bitten
  rationale: „Antworten“ bildet ענה direkt ab und bewahrt die forensische Mehrdeutigkeit; „Erbarmen“ gibt die erbetene Zuwendung wieder, ohne einen speziell konfessionellen Gnadenbegriff aufzudrängen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wahrt den knappen forensischen Parallelismus des Hebräischen; die Voranstellung „meinen Richter“ betont wie die hebräische Konstruktion den Adressaten des Flehens.
