source:
  edition: WLC
  text: חֲכַ֣ם לֵ֭בָב וְ/אַמִּ֣יץ כֹּ֑חַ מִֽי הִקְשָׁ֥ה אֵ֝לָ֗י/ו וַ/יִּשְׁלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/004.yaml
  text: He is wise in heart and mighty in strength[a]; who has hardened himself against him and prospered?
translation:
  language: de
  text: Er ist weisen Herzens und gewaltig an Kraft; wer hat sich gegen ihn verhärtet und ist unversehrt davongekommen[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und hat Erfolg gehabt?“ Das hebräische Verb kann auch ausdrücken, dass jemand heil oder unversehrt bleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵבָב
  choice: weisen Herzens
  rationale: Die Verbindung bezeichnet Weisheit des Herzens als Sitz von Denken und Wollen. „Weisen Herzens“ bewahrt das hebräische Bild und klingt im Deutschen würdig und poetisch.
- source_word: וְאַמִּיץ כֹּחַ
  choice: und gewaltig an Kraft
  rationale: Die leicht verstärkende Verbindung von אַמִּיץ und כֹּחַ wird erhalten, ohne im Deutschen unnötig schwerfällig zu wirken.
- source_word: מִי
  choice: Wer
  rationale: Leitet die rhetorische Frage unmittelbar und natürlich ein.
- source_word: הִקְשָׁה
  choice: hat sich verhärtet
  rationale: Die Hifil-Form beschreibt hier ein Sich-hart- beziehungsweise widerspenstig-Machen; die reflexive Wiedergabe erhält diese Bedeutung.
- source_word: אֵלָיו
  choice: gegen ihn
  rationale: In Verbindung mit הִקְשָׁה bezeichnet die Präposition die feindliche Ausrichtung des Widerstands.
- source_word: וַיִּשְׁלָם
  choice: und ist unversehrt davongekommen
  rationale: Das Verb שלם kann hier bedeuten, heil, ganz oder unbeschadet aus der Auseinandersetzung hervorzugehen. Die Formulierung gibt den im Kontext naheliegenden Ausgang idiomatisch wieder und lässt die Alternative „Erfolg gehabt“ in der Fußnote erkennen.
theological_decisions:
- issue: Unausgesprochenes Subjekt im ersten Halbvers
  choice: „Er“ wird als auf Gott bezogen ergänzt.
  alternative: Subjektlose Nominalformulierung wie „Weisen Herzens und gewaltig an Kraft“
  rationale: Im Hebräischen steht kein ausdrückliches Subjekt, doch der Zusammenhang bezieht die Aussagen eindeutig auf Gott. Das deutsche Pronomen ist zur Bildung eines vollständigen Satzes erforderlich.
translation_notes:
  register: Modernes Standarddeutsch mit würdig-poetischer Färbung. „Weisen Herzens“ bewahrt bewusst die Bildsprache des Hebräischen; die rhetorische Frage bleibt pointiert und offen formuliert.
