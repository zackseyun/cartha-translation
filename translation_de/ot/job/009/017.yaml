base_translation:
  language: en
  yaml_path: translation/ot/job/009/017.yaml
  text: who crushes me in a storm and multiplies my wounds without cause[a][b][c].
translation:
  language: de
  text: der mich im Sturm zermalmt[a][b] und meine Wunden ohne Grund vermehrt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »durch einen Sturm« oder »im Unwetter«. Die hebräische Präposition kann die Art und Weise oder das Mittel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Verb kann auch mit »zerschlägt« oder »verwundet« wiedergegeben werden; weniger wahrscheinlich ist hier »nach mir schnappt«.
    reason: lexical_alternative
  - marker: c
    text: 'Auch: »grundlos« oder »ohne Anlass«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: der
  rationale: Das Relativpronomen führt die auf Gott bezogene Beschreibung aus dem vorhergehenden Zusammenhang fort.
- source_word: בִּשְׂעָרָה
  choice: im Sturm
  rationale: שְׂעָרָה bezeichnet Sturm, Unwetter oder Wirbelsturm. Die Wendung bewahrt das eindrückliche Bild, ohne die Präposition eindeutig instrumental festzulegen.
- source_word: יְשׁוּפֵנִי
  choice: mich zermalmt
  rationale: Das seltene Verb שׁוף bezeichnet hier im Parallelismus mit den Wunden eine heftige, zerstörerische Verletzung. »Zermalmt« gibt diese Stärke natürlich und prägnant wieder.
- source_word: וְהִרְבָּה
  choice: vermehrt
  rationale: Der Hifil von רבה bedeutet »zahlreich machen« oder »vermehren« und verbindet sich im Deutschen idiomatisch mit »Wunden«.
- source_word: פְצָעַי
  choice: meine Wunden
  rationale: פצע bezeichnet unmittelbar eine Wunde oder Verletzung; »Wunden« passt zur poetischen Klage.
- source_word: חִנָּם
  choice: ohne Grund
  rationale: חִנָּם bedeutet unentgeltlich, grundlos oder ohne Ursache. »Ohne Grund« wahrt die moralische Schärfe von Ijobs Klage.
theological_decisions:
- issue: Ob חִנָּם absolute moralische Unschuld Ijobs behauptet oder seine Wahrnehmung unverdienten Leidens ausdrückt
  choice: Die Aussage wird ohne Abschwächung als »ohne Grund« wiedergegeben.
  alternative: »ohne dass ich es verdient hätte« oder »grundlos«
  rationale: Der Vers formuliert Ijobs Klage mit voller Kraft. Die Übersetzung soll die Spannung hinsichtlich göttlicher Gerechtigkeit weder auflösen noch durch eine dogmatische Erklärung einschränken.
translation_notes:
  register: Moderne, würdige Standardsprache mit dichterischer Wucht. Der Relativsatz bleibt als Fortsetzung des vorhergehenden Verses erhalten; die Mehrdeutigkeit der Sturmwendung und die theologische Spannung von Ijobs Protest werden durch Fußnoten beziehungsweise eine unverengte Haupttextformulierung bewahrt.
