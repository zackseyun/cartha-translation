lexical_decisions:
- source_word: נֹטֶה
  choice: ausspannt
  rationale: Das Qal-Partizip von נטה bezeichnet hier das Ausspannen oder Ausbreiten. „Ausspannt“ bewahrt das kosmisch-poetische Bild und klingt im Deutschen natürlich.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: Das hebräische Pluralwort bezeichnet in diesem kosmologischen Zusammenhang den Himmel als ausgespanntes Himmelsgewölbe. Der deutsche Singular ist idiomatisch und bildet keine sachliche Verengung auf bloßes Wettergeschehen.
- source_word: לְבַדּוֹ
  choice: allein
  rationale: „Allein“ bringt die Ausschließlichkeit und das Handeln ohne Mitwirkung knapp und genau zum Ausdruck.
- source_word: וְדוֹרֵךְ
  choice: und … schreitet
  rationale: דרך kann „treten“, „schreiten“ oder „einherschreiten“ bedeuten. „Schreitet“ erhält das machtvolle poetische Bild, ohne die zerstörerische Nebenbedeutung von „zertritt“ einzutragen.
- source_word: עַל
  choice: über
  rationale: Bei einer Bewegung auf beziehungsweise über einer Fläche ist „über“ im Deutschen natürlich und lässt das Bild des Schreitens auf den Erhebungen des Meeres bestehen.
- source_word: בָּמֳתֵי
  choice: die Höhen
  rationale: במה bedeutet grundsätzlich „Höhe“ oder „Höhenstätte“. Der Haupttext bewahrt die ungewöhnliche Metapher „Höhen des Meeres“, während die Fußnote die wahrscheinliche bildliche Bedeutung als Wellen nennt.
- source_word: יָם
  choice: des Meeres
  rationale: Der Singular entspricht dem Hebräischen und passt zur kosmisch-poetischen Darstellung.
theological_decisions:
- issue: Kosmische Bildsprache von Gottes alleiniger Herrschaft über die Schöpfung
  choice: Die poetische Aussage bleibt als Gottes alleiniges Ausspannen des Himmels und sein Schreiten über die Meereshöhen stehen.
  alternative: Die Wendung deutender als „auf den Wellen des Meeres geht“ wiederzugeben.
  rationale: Die Übersetzung bewahrt die erhabene und spannungsreiche Bildsprache, ohne sie zu entmythologisieren oder mit späteren theologischen Aussagen anzureichern. Die wahrscheinlich gemeinte Vorstellung der Wellen wird als lexikalische Alternative in der Fußnote geboten.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Der Relativanschluss „der“ setzt den Satz aus dem Kontext fort. Der Zeilenumbruch bildet den Parallelismus der beiden Partizipialaussagen ab.
