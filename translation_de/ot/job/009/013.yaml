  text: אֱ֭לוֹהַּ לֹא יָשִׁ֣יב אַפּ֑/וֹ תחת/ו שָׁ֝חֲח֗וּ עֹ֣זְרֵי רָֽהַב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/013.yaml
  text: God does not turn back his anger; beneath him the helpers of Rahab crouch.
translation:
  language: de
  text: Gott wendet seinen Zorn nicht ab; unter ihm kauern die Helfer Rahabs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab bezeichnet hier wahrscheinlich eine urzeitliche Chaosmacht; das hebräische Wort kann auch „Überheblichkeit“ oder „Trotz“ bedeuten.
    reason: Die Fußnote bewahrt die lexikalische und bildhafte Mehrdeutigkeit von רַהַב, ohne den Haupttext zu überladen.
lexical_decisions:
- source_word: לֹא יָשִׁיב אַפּוֹ
  choice: hält seinen Zorn nicht zurück
  rationale: Die Wendung bezeichnet, dass Gott seinen Zorn nicht abwendet oder zurücknimmt. Die deutsche Formulierung ist natürlich und lässt offen, ob der Schwerpunkt auf dem Zurückhalten oder dem Abwenden liegt.
- source_word: שָׁחֲחוּ
  choice: kauern
  rationale: Das Verb beschreibt ein Niedersinken beziehungsweise Sich-Beugen. „Kauern“ bewahrt hier das Bild gedemütigter, unterworfener Mächte und entspricht dem revidierten englischen Konsultationstext.
- source_word: עֹזְרֵי רָהַב
  choice: die Helfer Rahabs
  rationale: רַהַב wird als Eigenname wiedergegeben, da im poetischen Kontext wahrscheinlich die personifizierte Chaosmacht gemeint ist. Die Konstruktion bezeichnet deren Helfer oder Verbündete.
theological_decisions:
- issue: Deutung von רַהַב
  choice: Rahab als Eigenname beibehalten
  alternative: „Hochmut“ oder „die trotzige Macht“
  rationale: Die Eigennamendeutung bewahrt die poetisch-kosmologische Anspielung und vermeidet, die genuine Mehrdeutigkeit vorschnell auf eine abstrakte Eigenschaft festzulegen. Eine Fußnote nennt die mögliche Bedeutungsbreite.
- issue: Reichweite der Aussage über Gottes Zorn
  choice: ohne erklärende Abschwächung übersetzen
  alternative: eine zeitliche oder konditionale Einschränkung ergänzen
  rationale: Der hebräische Vers formuliert uneingeschränkt, dass Gott seinen Zorn nicht zurückhält beziehungsweise abwendet. Der Kontext darf diese Spannung erklären, aber die Übersetzung sollte keine nicht ausdrücklich genannte Einschränkung einführen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper poetischer Satzstruktur. „Kauern“ vermittelt Unterwerfung anschaulich, ohne altertümlich zu wirken; der seltene Name Rahab wird durch eine kurze Fußnote erschlossen.
