  yaml_path: translation/ot/job/009/019.yaml
  text: If it is a matter of strength[a], behold, he is mighty; and if of justice[b], who can summon him?
translation:
  language: de
  text: 'Geht es um Kraft: Siehe, er ist mächtig! Und geht es um Recht[a]: Wer kann mich vorladen[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Recht“ kann hier auch „Gericht“ oder „Rechtsstreit“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Der masoretische Text hat formal „mich“. Das Verb kann auch „zu einer Verhandlung bestellen“ oder „einen Termin ansetzen“ bedeuten. Aufgrund des Zusammenhangs verstehen manche den schwierigen Ausdruck als „Wer kann ihn vorladen?“
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לְכֹחַ
  choice: Geht es um Kraft
  rationale: Die elliptische hebräische Wendung bezeichnet den Bereich, um den es geht. Die deutsche Formulierung ist natürlich und bewahrt die konditionale Gegenüberstellung.
- source_word: אַמִּיץ
  choice: mächtig
  rationale: Das Adjektiv bezeichnet überwältigende Stärke. „Mächtig“ vermeidet die unmittelbare Wiederholung von „Kraft“ und erhält den gehobenen Ton.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel setzt einen nachdrücklichen rhetorischen Akzent. „Siehe“ ist im Deutschen würdevoll und in diesem poetischen Kontext verständlich.
- source_word: לְמִשְׁפָּט
  choice: um Recht
  rationale: מִשְׁפָּט kann hier Recht, Gericht oder einen Rechtsstreit bezeichnen. „Recht“ ist knapp und lässt die forensische Spannung des Zusammenhangs bestehen.
- source_word: יוֹעִידֵנִי
  choice: kann mich vorladen
  rationale: Die Hifil-Form von יעד kann im gerichtlichen Zusammenhang das Bestellen oder Vorladen zu einer Verhandlung bezeichnen; das Suffix -נִי ist formal die erste Person Singular („mich“).
theological_decisions:
- issue: Gerichtliche Bildsprache in Hiobs Auseinandersetzung mit Gott
  choice: Die Aussage wird ausdrücklich als Rechts- und Vorladungsszene wiedergegeben, ohne Hiobs provokante Frage abzuschwächen.
  alternative: 'Allgemeiner: „Wer setzt mir einen Termin?“ oder kontextuell angepasst: „Wer kann ihn vorladen?“'
  rationale: Der Zusammenhang handelt von der Unmöglichkeit, einen Rechtsstreit mit Gott zu führen. Zugleich wird die grammatische erste Person des masoretischen Textes im Haupttext bewahrt, statt die Spannung zugunsten einer glatteren theologischen Aussage aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelstruktur. „Siehe“ erhält den markanten Ausruf des Hebräischen; die Gerichtssprache bleibt klar, ohne eine strittige Deutung im Haupttext zu erzwingen.
