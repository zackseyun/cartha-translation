  text: וַ/יֵּֽצְאוּ֙ בְּנֵ֣י עַמּ֔וֹן וַ/יַּעַרְכ֥וּ מִלְחָמָ֖ה פֶּ֣תַח הַ/שָּׁ֑עַר וַ/אֲרַ֨ם צוֹבָ֤א וּ/רְחוֹב֙ וְ/אִֽישׁ ט֣וֹב וּ/מַֽעֲכָ֔ה לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/008.yaml
  text: Then the sons of Ammon came out and drew up for battle at the entrance of the gate[b][a], while Aram of Zobah and Rehob and the men of Tob and Maacah were by themselves in the field.
translation:
  language: de
  text: Da zogen die Ammoniter aus und stellten sich am Eingang des Tores zur Schlacht auf, während die Aramäer aus Zoba und Rehob sowie die Männer aus Tob[a] und Maacha getrennt von ihnen auf dem Feld standen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Männer aus Isch-Tob«. Die hebräische Wortfolge kann als »Männer aus Tob« oder als Ortsname »Isch-Tob« verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ בְּנֵי עַמּוֹן
  choice: Da zogen die Ammoniter aus
  rationale: Die idiomatische deutsche Volksbezeichnung gibt die hebräische Wendung »Söhne Ammons« natürlich wieder; יצא bezeichnet hier das Ausrücken aus der Stadt.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: stellten sich ... zur Schlacht auf
  rationale: Die militärische Wendung bezeichnet das Ordnen der Truppen in Schlachtaufstellung.
- source_word: פֶּתַח הַשָּׁעַר
  choice: am Eingang des Tores
  rationale: Gibt die Ortsangabe eng und verständlich wieder.
- source_word: וַאֲרַם צוֹבָא וּרְחוֹב
  choice: Die Aramäer aus Zoba und Rehob
  rationale: אֲרַם wird hier als Bezeichnung aramäischer Truppenkontingente verstanden; Zoba und Rehob sind Herkunftsorte beziehungsweise Herrschaftsgebiete.
- source_word: וְאִישׁ טוֹב
  choice: die Männer aus Tob
  rationale: אִישׁ kann kollektiv die Männer beziehungsweise das Kontingent aus Tob bezeichnen; die mögliche Auffassung als Ortsname Isch-Tob wird in der Fußnote bewahrt.
- source_word: לְבַדָּם
  choice: getrennt von ihnen
  rationale: Bezeichnet die räumlich getrennte Stellung der Verbündeten gegenüber den Ammonitern; der Bezug wird im Deutschen ausdrücklich gemacht.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: Eine nahe Wiedergabe von שָׂדֶה, die zugleich den Gegensatz zur Stellung am Stadttor erkennen lässt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ethnische Bezeichnung »Ammoniter« ist gegenüber dem wörtlichen, im heutigen Deutsch ungebräuchlichen »Söhne Ammons« bevorzugt. Die taktische Gegenüberstellung der beiden getrennten Truppenverbände wird durch zwei Sätze und »dagegen« verdeutlicht, ohne zusätzliche Sachinformation einzuführen.
