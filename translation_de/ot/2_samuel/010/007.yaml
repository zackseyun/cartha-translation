source:
  edition: WLC
  text: וַ/יִּשְׁמַ֖ע דָּוִ֑ד וַ/יִּשְׁלַח֙ אֶת יוֹאָ֔ב וְ/אֵ֥ת כָּל הַ/צָּבָ֖א הַ/גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/007.yaml
  text: When David heard[a], he sent Joab and all the army of the mighty men.
translation:
  language: de
  text: Als David davon hörte, schickte er Joab und das ganze Heer der Krieger[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und das ganze Heer, die kampfstarken Männer“. Das Hebräische lässt sich so verstehen, dass „die Krieger“ entweder als Beisatz zu „Heer“ steht oder das Heer näher bestimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע דָּוִד
  choice: Als David davon hörte
  rationale: שׁמע bedeutet im Qal „hören“. „Als“ gibt die zeitliche Abfolge der Wayyiqtol-Formen im natürlichen Deutschen wieder; „davon“ nimmt den Zusammenhang auf, ohne im Vers ein ausdrücklich genanntes Objekt vorzutäuschen.
- source_word: וַיִּשְׁלַח אֶת יוֹאָב
  choice: schickte er Joab
  rationale: שׁלח bedeutet hier schlicht „schicken/senden“. „Schickte“ ist im modernen deutschen Erzählstil natürlich; אֶת kennzeichnet nur das direkte Objekt und bleibt unübersetzt.
- source_word: וְאֵת כָּל הַצָּבָא
  choice: und das ganze Heer
  rationale: צָבָא bezeichnet hier die Streitmacht. „Heer“ ist eine klare, würdige und im historischen Zusammenhang geläufige Wiedergabe; כָּל wird idiomatisch mit „das ganze“ ausgedrückt.
- source_word: הַגִּבֹּרִים
  choice: der Krieger
  rationale: גִּבֹּרִים bezeichnet kampfstarke bzw. tapfere Männer. „Krieger“ passt zum militärischen Zusammenhang, ohne ausdrücklich eine besondere Elitetruppe anzunehmen. Der Genitiv gibt eine mögliche nähere Bestimmung von הַצָּבָא wieder; die appositionelle Lesart bleibt in der Fußnote erhalten.
theological_decisions: []
