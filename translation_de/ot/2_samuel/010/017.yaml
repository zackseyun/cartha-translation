source:
  edition: WLC
  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗ד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר אֶת הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֖א חֵלָ֑אמָ/ה וַ/יַּעַרְכ֤וּ אֲרָם֙ לִ/קְרַ֣את דָּוִ֔ד וַ/יִּלָּחֲמ֖וּ עִמּֽ/וֹס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, and came to Helam. Then Aram drew up in battle formation to meet David and fought with him.
translation:
  language: de
  text: Als David dies gemeldet wurde, versammelte er ganz Israel, überquerte den Jordan und kam nach Helam. Die Aramäer stellten sich David zum Kampf entgegen und kämpften gegen ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »kämpften mit ihm«; die hebräische Wendung bedeutet hier, gegen jemanden zu kämpfen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  choice: Als David dies gemeldet wurde
  rationale: Die unpersönliche Passivkonstruktion bewahrt, dass kein Überbringer der Meldung genannt wird. „Als“ gibt die erzählerische Verknüpfung im modernen Deutsch natürlich wieder.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: versammelte er ganz Israel
  rationale: Die Formulierung erhält den umfassenden kollektiven Ausdruck des Hebräischen, ohne ihn ausdrücklich auf das Heer einzuengen.
- source_word: וַיַּעֲבֹר אֶת הַיַּרְדֵּן
  choice: überquerte den Jordan
  rationale: Dies ist die natürliche deutsche Wiedergabe der Bewegung über den Fluss.
- source_word: וַיָּבֹא חֵלָמָה
  choice: und kam nach Helam
  rationale: Das Richtungssuffix bezeichnet die Bewegung auf den Ort zu; „nach Helam kommen“ drückt im Deutschen die Ankunft am Ziel aus.
- source_word: וַיַּעַרְכוּ אֲרָם
  choice: Die Aramäer stellten sich … zum Kampf
  rationale: Das Verb bezeichnet im militärischen Zusammenhang das Aufstellen zur Schlacht. Der kollektive Landesname „Aram“ wird im Deutschen natürlich als „die Aramäer“ wiedergegeben.
- source_word: לִקְרַאת דָּוִד
  choice: David … entgegen
  rationale: Die Präposition bezeichnet die Bewegung beziehungsweise Ausrichtung auf eine Begegnung zu; der Kampfzusammenhang macht deren feindlichen Charakter deutlich.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: und kämpften gegen ihn
  rationale: Obwohl die Präposition wörtlich „mit“ bedeutet, bezeichnet die gesamte hebräische Wendung hier eindeutig den Kampf gegen einen Gegner. „Gegen ihn“ vermeidet im modernen Deutsch das Missverständnis eines gemeinsamen Kampfes.
