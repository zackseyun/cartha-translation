  text: וַ/יָּ֣נָס אֲרָם֮ מִ/פְּנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜ד מֵ/אֲרָ֗ם שְׁבַ֤ע מֵאוֹת֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֨ת שׁוֹבַ֧ךְ שַׂר צְבָא֛/וֹ הִכָּ֖ה וַ/יָּ֥מָת שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/018.yaml
  text: Aram fled from before Israel[a], and David killed seven hundred charioteers and forty thousand horsemen from Aram. He also struck down Shobach, the commander of their army[b], and he died there.
translation:
  language: de
  text: Die Aramäer flohen vor Israel, und David tötete siebenhundert Angehörige der Streitwagentruppe[a] und vierzigtausend Reiter der Aramäer. Auch Schobach, den Befehlshaber seines Heeres[b], schlug er nieder, und er starb dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „siebenhundert Streitwagen/Streitwagentruppe“. Gemeint sein können Angehörige der Streitwagentruppe. In 1. Chronik 19,18 steht „siebentausend Streitwagen“.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „den Befehlshaber ihres Heeres“. Das hebräische Suffix steht im Singular: „seines Heeres“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס אֲרָם מִפְּנֵי יִשְׂרָאֵל
  choice: Die Aramäer flohen vor Israel
  rationale: אֲרָם bezeichnet hier kollektiv das aramäische Volk beziehungsweise Heer. Im Deutschen ist „die Aramäer“ natürlicher als das kollektiv gebrauchte „Aram“; מִפְּנֵי wird idiomatisch mit „vor“ wiedergegeben.
- source_word: וַיַּהֲרֹג דָּוִד
  choice: David tötete
  rationale: הרג bedeutet hier unmittelbar „töten“. Die schlichte moderne Wiedergabe wahrt zugleich den Unterschied zu נכה im zweiten Satz.
- source_word: שְׁבַע מֵאוֹת רֶכֶב
  choice: siebenhundert Mann der Streitwagen
  rationale: רֶכֶב bezeichnet wörtlich Streitwagen beziehungsweise die Streitwagentruppe. Da getötete Menschen gemeint sind, macht „Mann der Streitwagen“ den naheliegenden menschlichen Bezug deutlich, ohne den schwierigen hebräischen Wortlaut stillschweigend zu „Streitwagenkämpfern“ oder „Wagenlenkern“ zu verengen.
- source_word: וְאַרְבָּעִים אֶלֶף פָּרָשִׁים
  choice: vierzigtausend Reiter
  rationale: פָּרָשִׁים bezeichnet Reiter beziehungsweise Kavalleristen; „Reiter“ ist knapp, geläufig und sachlich.
- source_word: וְאֵת שׁוֹבַךְ
  choice: Schobach
  rationale: Die Namensform folgt der masoretischen Vokalisierung und einer im Deutschen verständlichen Umschrift.
- source_word: שַׂר צְבָאוֹ
  choice: den Befehlshaber seines Heeres
  rationale: שַׂר bezeichnet im militärischen Zusammenhang einen Befehlshaber, צָבָא das Heer. Das singularische Suffix wird formal als „seines“ bewahrt.
- source_word: הִכָּה
  choice: schlug er nieder
  rationale: נכה kann „schlagen“, „niederschlagen“ oder „besiegen“ bedeuten. „Schlug ... nieder“ bewahrt die lexikalische Unterscheidung zu הרג; der folgende Satz nennt ausdrücklich den Tod.
- source_word: וַיָּמָת שָׁם
  choice: sodass er dort starb
  rationale: Die deutsche Satzverknüpfung macht die im Kontext erkennbare Folge des Niederschlagens natürlich verständlich; „dort“ gibt שָׁם ohne Zusatz wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die kollektive Bezeichnung „Aram“ wird natürlich als „die Aramäer“ wiedergegeben. Beim schwierigen Ausdruck רֶכֶב bleibt die Übersetzung nahe am militärischen Sammelbegriff; die textliche Parallele wird in der Fußnote offengelegt. Das singularische Possessivsuffix bei „seines Heeres“ bleibt im Haupttext erhalten.
