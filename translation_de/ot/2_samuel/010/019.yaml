  text: וַ/יִּרְא֨וּ כָֽל הַ/מְּלָכִ֜ים עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥מוּ אֶת יִשְׂרָאֵ֖ל וַ/יַּֽעַבְד֑וּ/ם וַ/יִּֽרְא֣וּ אֲרָ֔ם לְ/הוֹשִׁ֥יעַ ע֖וֹד אֶת בְּנֵ֥י עַמּֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/019.yaml
  text: When all the kings who were servants of Hadadezer saw that they had been defeated before Israel, they made peace with Israel and served them. So Aram was afraid to save the sons of Ammon anymore.
translation:
  language: de
  text: Als alle Könige, die Hadadeser untertan waren, sahen, dass sie vor Israel geschlagen worden waren, schlossen sie Frieden mit Israel und dienten ihnen. Da fürchteten sich die Aramäer, den Ammonitern weiterhin zu Hilfe zu kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי הֲדַדְעֶזֶר
  choice: die Hadadeser untertan waren
  rationale: Das hebräische עבד bezeichnet hier politische Vasallität; „untertan waren“ gibt den Zusammenhang natürlicher wieder als das missverständliche „Diener waren“.
- source_word: נִגְּפוּ לִפְנֵי יִשְׂרָאֵל
  choice: vor Israel geschlagen worden waren
  rationale: Bewahrt die hebräische Wendung und bezeichnet eine militärische Niederlage.
- source_word: וַיַּשְׁלִמוּ אֶת יִשְׂרָאֵל
  choice: schlossen sie Frieden mit Israel
  rationale: Im Kontext bedeutet die Konstruktion, Frieden zu schließen beziehungsweise sich friedlich zu einigen.
- source_word: וַיַּעַבְדוּם
  choice: dienten ihnen
  rationale: Das Pronomen ist maskulin plural und bezieht sich grammatisch am ehesten auf Israel als dessen Angehörige; die Formulierung bewahrt diesen Numeruswechsel.
- source_word: וַיִּרְאוּ אֲרָם
  choice: fürchteten sich die Aramäer
  rationale: אֲרָם ist kollektiv gebraucht; im Deutschen ist die Personenbezeichnung hier natürlicher als „Aram fürchtete sich“.
- source_word: לְהוֹשִׁיעַ ... אֶת בְּנֵי עַמּוֹן
  choice: den Ammonitern ... zu Hilfe zu kommen
  rationale: Das Hifil von ישׁע kann „retten“ oder „zu Hilfe kommen“ bedeuten; im militärischen Bündniskontext ist „zu Hilfe kommen“ idiomatisch und lässt den unterstützenden Sinn erkennen.
theological_decisions:
- issue: Bedeutung von לְהוֹשִׁיעַ im Verhältnis zu den Ammonitern
  choice: zu Hilfe zu kommen
  alternative: zu retten
  rationale: Der Vers beschreibt die weitere militärische Unterstützung der Ammoniter durch Aram. „Zu Hilfe kommen“ gibt diesen Kontext präzise wieder, ohne eine besondere theologische Bedeutung von „retten“ einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Politische Unterordnung und militärische Hilfe werden klar und ohne unnötigen Fachwortschatz ausgedrückt; die Wiederholung „Israel ... ihnen“ folgt dem hebräischen Bezug.
