  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַֽ/יַּעֲרֹ֕ךְ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/010.yaml
  text: And the rest of the people he put under the command of Abishai his brother[c][b][a], and he drew them up to meet the sons of Ammon.
translation:
  language: de
  text: Den Rest des Volkes stellte er unter den Befehl seines Bruders Abischai[a] und stellte sie den Ammonitern entgegen in Schlachtordnung auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gab er in die Hand seines Bruders Abischai“; gemeint ist, dass er ihm die Truppen anvertraute und unterstellte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und er ordnete sie den Söhnen Ammons entgegen“. Das Verb bezeichnet im militärischen Zusammenhang das Aufstellen in Schlachtordnung; „Söhne Ammons“ kann auch mit „Ammoniter“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: den Rest des Volkes
  rationale: Die Wiedergabe bewahrt die konkrete hebräische Formulierung. Im militärischen Zusammenhang bezeichnet „Volk“ die übrigen Männer beziehungsweise Truppen.
- source_word: נָתַן בְּיַד
  choice: stellte er unter den Befehl
  rationale: Die Wendung bedeutet wörtlich „gab in die Hand“ und bezeichnet hier die Übertragung militärischer Befehlsgewalt.
- source_word: אַבְשַׁי
  choice: Abischai
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: אָחִיו
  choice: seines Bruders
  rationale: Die ausdrücklich genannte verwandtschaftliche Beziehung zu Joab bleibt erhalten.
- source_word: וַיַּעֲרֹךְ
  choice: Dieser stellte sie zur Schlacht auf
  rationale: ערך bezeichnet im militärischen Kontext das Ordnen beziehungsweise Aufstellen von Truppen in Schlachtformation. Das neue Subjekt ist im Deutschen zur Klarheit ausdrücklich mit „Dieser“ aufgenommen.
- source_word: לִקְרַאת
  choice: gegen
  rationale: Die Präposition bezeichnet eine Bewegung oder Ausrichtung zur Begegnung hin; im Kampfzusammenhang gibt „gegen“ die feindliche Konfrontation natürlich wieder.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die deutsche Volksbezeichnung ist die natürliche Entsprechung der wörtlichen hebräischen Wendung „Söhne Ammons“.
