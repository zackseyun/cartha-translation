  register: Moderne, klare und würdige Erzählsprache. Historische Bezeichnungen werden als „Aramäer“ statt traditionell „Syrer“ wiedergegeben. Die Aufzählung wird durch Doppelpunkt und „dazu“ strukturiert. Die im Deutschen nötige Ergänzung „Boten“ macht den impliziten Ablauf verständlich, ohne die Handlung inhaltlich auszubauen.
