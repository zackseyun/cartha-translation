source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י נִבְאֲשׁ֖וּ בְּ/דָוִ֑ד וַ/יִּשְׁלְח֣וּ בְנֵֽי עַמּ֡וֹן וַ/יִּשְׂכְּרוּ֩ אֶת אֲרַ֨ם בֵּית רְח֜וֹב וְ/אֶת אֲרַ֣ם צוֹבָ֗א עֶשְׂרִ֥ים אֶ֨לֶף֙ רַגְלִ֔י וְ/אֶת מֶ֤לֶךְ מַֽעֲכָה֙ אֶ֣לֶף אִ֔ישׁ וְ/אִ֣ישׁ ט֔וֹב שְׁנֵים עָשָׂ֥ר אֶ֖לֶף אִֽישׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/006.yaml
  text: When the sons of Ammon saw that they had become odious to David[a], the sons of Ammon sent and hired the Arameans of Beth-rehob and the Arameans of Zobah, twenty thousand foot soldiers, and the king of Maacah with one thousand men, and the men of Tob[c][b], twelve thousand men.
translation:
  language: de
  text: 'Als die Ammoniter erkannten, dass sie sich bei David verhasst gemacht hatten[a], sandten sie aus und warben die Aramäer von Bet-Rehob und die Aramäer von Zoba an: 20.000 Fußsoldaten, dazu den König von Maacha mit 1.000 Mann und die Männer von Tob[b] mit 12.000 Mann.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »dass sie David zum Gestank geworden waren«; gemeint ist, dass sie sich bei ihm verhasst oder widerwärtig gemacht hatten.'
    reason: lexical_alternative
  - marker: b
    text: Möglicherweise ist »Isch-Tob« als Orts- oder Sippenname zu lesen; hier wird die Wendung als »die Männer von Tob« verstanden.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: erkannten
  rationale: ראה bedeutet wörtlich „sehen“, bezeichnet hier aber das Erfassen der entstandenen Lage; „erkannten“ ist im modernen deutschen Erzählstil natürlich.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die idiomatische deutsche Volksbezeichnung gibt das hebräische „Söhne Ammons“ klar und würdig wieder.
- source_word: נִבְאֲשׁוּ בְּדָוִד
  choice: dass sie sich bei David verhasst gemacht hatten
  rationale: באשׁ hat bildlich den Ausgangspunkt „stinken“ und bedeutet hier, für jemanden widerwärtig oder verhasst geworden zu sein. Die gewählte Formulierung vermittelt den idiomatischen Sinn; das Geruchsbild bleibt in der Fußnote erhalten.
- source_word: וַיִּשְׁלְחוּ
  choice: sandten sie Boten aus
  rationale: Das Objekt ist im Hebräischen unausgesprochen; im Deutschen benötigt die Verbindung mit dem anschließenden Anwerben eine Ergänzung. „Boten“ ist eine kontextuell naheliegende, aber transparente Explizierung.
- source_word: וַיִּשְׂכְּרוּ
  choice: warben ... an
  rationale: שׂכר bezeichnet hier das entgeltliche Anwerben militärischer Kräfte. „Anwerben“ passt natürlich zum militärischen Zusammenhang.
- source_word: אֲרַם בֵּית רְחוֹב
  choice: die Aramäer von Bet-Rehob
  rationale: „Aramäer“ entspricht dem hebräischen Ethnonym genauer als das traditionelle „Syrer“; Bet-Rehob wird als Ortsname wiedergegeben.
- source_word: אֲרַם צוֹבָא
  choice: die Aramäer von Zoba
  rationale: Die Wiedergabe bewahrt das Ethnonym Aram und versteht Zoba als Herkunftsgebiet.
- source_word: עֶשְׂרִים אֶלֶף רַגְלִי
  choice: 20.000 Fußsoldaten
  rationale: רַגְלִי bezeichnet Fußtruppen; „Fußsoldaten“ ist klar und wahrt die militärische Unterscheidung.
- source_word: מֶלֶךְ מַעֲכָה
  choice: den König von Maacha
  rationale: Die Konstruktverbindung bezeichnet den Herrscher des Gebietes Maacha.
- source_word: אֶלֶף אִישׁ
  choice: 1.000 Mann
  rationale: Direkte, im militärischen Kontext idiomatische Wiedergabe der Zahlenangabe.
- source_word: אִישׁ טוֹב
  choice: die Männer von Tob
  rationale: Der Zusammenhang und die Parallele in 1. Chronik 19 sprechen dafür, Tob als Orts- oder Gebietsname und אִישׁ kollektiv als dessen Männer zu verstehen. Die mögliche Lesung „Isch-Tob“ wird in der Fußnote offengehalten.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: 12.000 Mann
  rationale: Direkte und natürliche Wiedergabe der Truppenstärke.
theological_decisions: []
