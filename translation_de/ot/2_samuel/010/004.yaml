  text: וַ/יִּקַּ֨ח חָנ֜וּן אֶת עַבְדֵ֣י דָוִ֗ד וַ/יְגַלַּח֙ אֶת חֲצִ֣י זְקָנָ֔/ם וַ/יִּכְרֹ֧ת אֶת מַדְוֵי/הֶ֛ם בַּ/חֵ֖צִי עַ֣ד שְׁתֽוֹתֵי/הֶ֑ם וַֽ/יְשַׁלְּחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
translation:
  language: de
  text: Da nahm Hanun Davids Diener, schor ihnen jeweils die Hälfte ihres Bartes ab, schnitt ihre Gewänder auf halber Höhe, bis zu ihrem Gesäß[a], ab und schickte sie fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zu ihrem Sitz“ oder „bis zu ihrem Intimbereich“. Das hebräische Wort ist selten, und die genaue Körperregion ist umstritten. Die Handlung sollte die Männer offenbar beschämen, indem ihre Gewänder sehr kurz abgeschnitten wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Das gewöhnliche Erzählverb לקח wird schlicht mit „nahm“ wiedergegeben; „ergriff“ oder „packte“ würde die Gewaltsamkeit stärker festlegen, als es das Verb selbst verlangt.
- source_word: עַבְדֵי דָוִד
  choice: Davids Diener
  rationale: עבד kann Diener, Sklave oder königlicher Beamter bedeuten. Hier bezeichnet es Männer im Dienst Davids, die als Gesandte auftreten; „Diener“ bewahrt die begriffliche Breite.
- source_word: וַיְגַלַּח אֶת חֲצִי זְקָנָם
  choice: schor ihnen jeweils die Hälfte des Bartes ab
  rationale: גלח bezeichnet das Scheren oder Rasieren. „Jeweils“ verdeutlicht ohne Sinnänderung, dass bei jedem Mann eine Hälfte seines Bartes entfernt wurde.
- source_word: וַיִּכְרֹת
  choice: schnitt … ab
  rationale: כרת bedeutet häufig „abschneiden“. Die trennbare Verbform bildet hier natürlich ab, dass ein Teil der Gewänder entfernt wurde.
- source_word: מַדְוֵיהֶם
  choice: ihre Gewänder
  rationale: Das seltenere Substantiv bezeichnet Kleidungsstücke, ohne deren genaue Art eindeutig festzulegen. „Gewänder“ ist würdig und hinreichend allgemein.
- source_word: בַּחֵצִי
  choice: in der Mitte
  rationale: Die Wendung bezeichnet den mittleren beziehungsweise halben Bereich der Gewänder. „In der Mitte“ erhält die räumliche Aussage.
- source_word: עַד שְׁתוֹתֵיהֶם
  choice: bis zum Gesäß
  rationale: Das seltene Wort שְׁתוֹת bezeichnet hier wahrscheinlich das Gesäß beziehungsweise den Sitz- oder Intimbereich. „Gesäß“ gibt die beschämende Entblößung direkt wieder, ohne die unsichere anatomische Zuordnung zu überpräzisieren.
- source_word: וַיְשַׁלְּחֵם
  choice: schickte sie fort
  rationale: שלח bedeutet hier, die Männer nach ihrer Demütigung wegzuschicken. „Schickte sie fort“ ist natürlich und folgt dem Erzählablauf.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Folge der hebräischen Erzählverben bleibt erhalten; „jeweils“ verhindert das Missverständnis, nur die Hälfte aller Bärte zusammen sei gemeint. Die Fußnote steht bei der tatsächlich strittigen anatomischen Bezeichnung.
