base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/014.yaml
  text: And when the sons of Ammon saw that Aram had fled[a], they fled before Abishai and entered the city[c][b]. Then Joab returned from against the sons of Ammon and came to Jerusalem.
translation:
  language: de
  text: Als die Ammoniter sahen, dass Aram geflohen war, flohen sie vor Abischai und gingen in die Stadt. Darauf zog sich Joab von den Ammonitern zurück und kam nach Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die wörtliche Wendung »Söhne Ammons« bezeichnet hier das Volk der Ammoniter. Die Volksbezeichnung ist im modernen Deutschen natürlich und eindeutig.
- source_word: רָאוּ כִּי נָס אֲרָם
  choice: sahen, dass Aram geflohen war
  rationale: »Sahen, dass« bewahrt die Wahrnehmungsformel; das Plusquamperfekt gibt die gegenüber ihrem Erkennen vorausliegende Flucht wieder. »Aram« erhält den hebräischen Landes- und Volksnamen und vermeidet das anachronistische »Syrien«.
- source_word: וַיָּנֻסוּ מִפְּנֵי אֲבִישַׁי
  choice: flohen sie vor Abischai
  rationale: Das deutsche »vor jemandem fliehen« gibt מִפְּנֵי in diesem militärischen Zusammenhang idiomatisch und genau wieder.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: zogen sich in die Stadt zurück
  rationale: Das Verb bezeichnet wörtlich das Hineingehen beziehungsweise Hineinkommen. Im Zusammenhang mit ihrer Flucht drückt »zogen sich … zurück« natürlich aus, dass sie in der befestigten Stadt Schutz suchten, ohne eine bestimmte Stadt zu ergänzen.
- source_word: וַיָּשָׁב יוֹאָב מֵעַל בְּנֵי עַמּוֹן
  choice: Darauf brach Joab den Kampf gegen die Ammoniter ab
  rationale: Die Verbindung von שׁוּב mit מֵעַל bezeichnet hier Joabs Abkehr vom Angriff beziehungsweise Kampf gegen die Ammoniter. Die deutsche Formulierung gibt den militärischen Sinn klar wieder.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: und kam nach Jerusalem
  rationale: בוא wird aus der erzählerischen Perspektive sachgerecht mit »kam« wiedergegeben; bei Städten ist »nach Jerusalem« im Deutschen idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit flüssiger Kriegserzählung. Ethnonyme werden idiomatisch wiedergegeben; der Eigenname »Aram« bleibt erhalten. Die einzige Fußnote macht die ungewöhnliche hebräische Wendung transparent.
