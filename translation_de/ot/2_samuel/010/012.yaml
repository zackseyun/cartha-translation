source:
  edition: WLC
  text: חֲזַ֤ק וְ/נִתְחַזַּק֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה יַעֲשֶׂ֥ה הַ/טּ֖וֹב בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/012.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: de
  text: Sei stark, und lasst uns stark sein für unser Volk und für die Städte unseres Gottes; und Jahwe möge tun, was in seinen Augen gut ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Jahwe wird tun, was in seinen Augen gut ist.“ Die hebräische Verbform kann hier auch als einfache Zukunftsaussage verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Sei stark
  rationale: Der Qal-Imperativ 2. Person maskulin Singular ist eine direkte Aufforderung. „Sei stark“ gibt ihn knapp wieder und entspricht dem anschließenden Kohortativ.
- source_word: וְנִתְחַזַּק
  choice: und lasst uns stark sein
  rationale: Der Hitpael-Kohortativ 1. Person Plural bezeichnet hier, Stärke zu zeigen bzw. sich als stark zu erweisen. Die natürliche deutsche Wendung wahrt den auffordernden und gemeinschaftlichen Sinn.
- source_word: בְּעַד
  choice: für
  rationale: Im militärischen Zusammenhang meint die Präposition den Einsatz zugunsten bzw. zur Verteidigung von jemandem. „Für“ ist idiomatisch und lässt diese Bedeutungsweite offen.
- source_word: עַמֵּנוּ
  choice: unser Volk
  rationale: עַם bezeichnet das Volk als Gemeinschaft und nicht speziell das Heer; die Parallele zu den Städten stützt die allgemeinere Wiedergabe.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: die Städte unseres Gottes
  rationale: Die deutsche Genitivkonstruktion bildet die hebräische Status-constructus-Verbindung klar und würdig ab.
- source_word: יהוה
  choice: Jahwe
  rationale: Der im Text stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יַעֲשֶׂה הַטּוֹב בְּעֵינָיו
  choice: möge tun, was in seinen Augen gut ist
  rationale: Die Wunschform fügt sich nach den Aufforderungen gut in den Kontext vertrauensvoller Ergebung; das hebräische Bild „in seinen Augen“ bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird transparent wiedergegeben, statt ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Modalität von יַעֲשֶׂה
  choice: Jahwe möge tun
  alternative: Jahwe wird tun
  rationale: Nach Imperativ und Kohortativ lässt sich der Yiqtol als Wunsch bzw. Ergebung in Gottes Willen verstehen. Da auch eine einfache Zukunftsaussage möglich ist, wird diese Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Aufforderungen bleiben knapp; das traditionelle hebräische Bild „was in seinen Augen gut ist“ wird bewusst nicht geglättet.
