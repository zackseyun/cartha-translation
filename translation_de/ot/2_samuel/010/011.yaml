  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק אֲרָם֙ מִמֶּ֔/נִּי וְ/הָיִ֥תָה לִּ֖/י לִֽ/ישׁוּעָ֑ה וְ/אִם בְּנֵ֤י עַמּוֹן֙ יֶחֱזְק֣וּ מִמְּ/ךָ֔ וְ/הָלַכְתִּ֖י לְ/הוֹשִׁ֥יעַֽ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/011.yaml
  text: He said[a], “If Aram is too strong for me, then you shall help me; but if the Ammonites are too strong for you[b], then I will go to help you.”
translation:
  language: de
  text: 'Er sagte: »Wenn Aram mir überlegen ist, dann komm du mir zu Hilfe; wenn aber die Ammoniter dir überlegen sind, dann werde ich hingehen und dir helfen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֱזְקוּ ... מִמֶּנִּי / מִמְּךָ
  choice: mir/dir überlegen ist/sind
  rationale: חזק mit מן bezeichnet hier im militärischen Zusammenhang Überlegenheit beziehungsweise das Gewinnen der Oberhand. »Überlegen sein« gibt dies knapp und natürlich wieder.
- source_word: אֲרָם
  choice: Aram
  rationale: Der hebräische Text nennt Aram; die Transliteration bewahrt die historische Bezeichnung und vermeidet die spätere geopolitische Bezeichnung »Syrien«.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Dies ist die geläufige deutsche Bezeichnung für die ethnisch-politische Gruppe; eine wörtliche Wiedergabe als »Söhne Ammons« wäre hier unnötig fremdartig.
- source_word: וְהָיְתָה לִּי לִישׁוּעָה
  choice: dann komm du mir zu Hilfe
  rationale: Die Wendung bezeichnet in diesem taktischen Zusammenhang konkrete Rettung beziehungsweise militärischen Beistand. Die idiomatische Formulierung bewahrt den Nachdruck auf dem angesprochenen Gegenüber.
- source_word: וְהָלַכְתִּי לְהוֹשִׁיעַ לָךְ
  choice: dann werde ich hingehen und dir helfen
  rationale: הלך mit dem Infinitiv bezeichnet eine Bewegung mit anschließendem Zweck. »Hingehen und dir helfen« gibt sowohl die Bewegung als auch die praktische Rettungshilfe wieder.
theological_decisions: []
