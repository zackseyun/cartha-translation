  text: וַ/יִּגַּ֣שׁ יוֹאָ֗ב וְ/הָ/עָם֙ אֲשֶׁ֣ר עִמּ֔/וֹ לַ/מִּלְחָמָ֖ה בַּֽ/אֲרָ֑ם וַ/יָּנֻ֖סוּ מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/013.yaml
  text: Then Joab and the people who were with him advanced to battle against Aram[a], and they fled before him.
translation:
  language: de
  text: Da rückten Joab und die Leute, die bei ihm waren, zum Kampf gegen Aram[a] vor, und die Aramäer flohen vor ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram bezeichnet hier die aramäischen Streitkräfte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: rückten … vor
  rationale: נגשׁ bedeutet grundsätzlich „sich nähern/herantreten“; zusammen mit לַמִּלְחָמָה bezeichnet es hier das Vorrücken zum Kampf.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: und das Volk, das bei ihm war
  rationale: Die Wiedergabe bleibt nahe am hebräischen עָם („Volk“), auch wenn im Zusammenhang Joabs Kampftruppe gemeint ist.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: Die Präposition mit מִלְחָמָה drückt hier Ziel beziehungsweise Zweck der Annäherung aus.
- source_word: בַּאֲרָם
  choice: gegen Aram
  rationale: Die Präposition ב kann beim Kampf den Gegner bezeichnen. „Aram“ bewahrt den Eigennamen des hebräischen Textes; gemeint sind im Kontext die aramäischen Streitkräfte.
- source_word: וַיָּנֻסוּ
  choice: und sie flohen
  rationale: נוּס bezeichnet deutlich die Flucht; „flohen“ vermeidet die mögliche Verharmlosung durch „zogen sich zurück“.
- source_word: מִפָּנָיו
  choice: vor ihm
  rationale: Die hebräische Wendung bedeutet, vor jemandem zu fliehen. Der Singular bezieht sich grammatisch auf Joab als führende Person.
- source_word: יוֹאָב
  choice: Joab
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rückten … vor“ gibt den militärischen Zusammenhang natürlich wieder; „das Volk, das bei ihm war“ wahrt zugleich die konkrete Ausdrucksweise des Hebräischen.
