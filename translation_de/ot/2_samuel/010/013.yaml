revisions:
- from: Da rückten Joab und das Volk, das bei ihm war, zum Kampf gegen Aram[a] vor, und sie flohen vor ihm.
  to: Da rückten Joab und die Leute, die bei ihm waren, zum Kampf gegen Aram[a] vor, und die Aramäer flohen vor ihm.
  rationale: Die ausdrückliche Nennung der Aramäer beseitigt eine im Deutschen entstandene, im Kontext des hebräischen Satzes nicht beabsichtigte Bezugsmehrdeutigkeit. Die Fußnote erläutert, weshalb der Eigenname Aram im folgenden Satzglied als „die Aramäer“ aufgenommen wird, ohne den hebräischen Eigennamen im Haupttext zu ersetzen.
