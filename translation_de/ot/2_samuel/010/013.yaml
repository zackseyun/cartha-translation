review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen hebräischen Begriffe zutreffend wieder: Joab und die bei ihm Befindlichen rücken zum Kampf gegen Aram vor; die Gegenseite flieht vor Joab. Das militärische Verständnis von נגשׁ und die kontextuelle Bedeutung von Aram sind angemessen berücksichtigt.'
  naturalness: '„Das Volk, das bei ihm war“ ist verständlich, wirkt im modernen Deutschen für eine Kampfgruppe jedoch etwas unnatürlich. Vor allem ist „und sie flohen“ nach dem zusammengesetzten Subjekt „Joab und das Volk“ missverständlich: Es kann sich im Deutschen zunächst auf Joab und seine Leute statt auf die Aramäer beziehen.'
  terminology: „Joab“, „Kampf“ und „Aram“ sind korrekt und registergerecht. „Die Leute, die bei ihm waren“ bewahrt die relative Unbestimmtheit von עָם besser als eine institutionell stärkere Bezeichnung wie „Heer“, ist aber im Deutschen idiomatischer.
  issues:
  - severity: medium
    issue: Mehrdeutiger Bezug von „sie flohen“
    rationale: Der hebräische Kontext und der Wechsel zum Plural lassen die Aramäer fliehen. Im Deutschen hat das unmittelbar vorausgehende Subjekt „Joab und das Volk“ jedoch ebenfalls Plural; daher sollte die fliehende Partei ausdrücklich genannt werden.
  - severity: low
    issue: „das Volk“ ist hier im Deutschen weniger idiomatisch
    rationale: עָם kann im Kontext Joabs begleitende Kämpfer bezeichnen. „Die Leute, die bei ihm waren“ bleibt semantisch zurückhaltend und klingt natürlicher.
  revised_text: Da rückten Joab und die Leute, die bei ihm waren, zum Kampf gegen Aram[a] vor, und die Aramäer flohen vor ihm.
  revised_footnotes:
  - marker: a
    text: Aram bezeichnet hier die aramäischen Streitkräfte.
    reason: lexical_alternative
  revision_rationale: Die ausdrückliche Nennung der Aramäer beseitigt eine im Deutschen entstandene, im Kontext des hebräischen Satzes nicht beabsichtigte Bezugsmehrdeutigkeit. Die Fußnote erläutert, weshalb der Eigenname Aram im folgenden Satzglied als „die Aramäer“ aufgenommen wird, ohne den hebräischen Eigennamen im Haupttext zu ersetzen.
