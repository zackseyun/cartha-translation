  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כַּ/אֲשֶׁר֩ עָשָׂ֨ה אָבִ֤י/ו עִמָּדִ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֨ח דָּוִ֧ד לְ/נַחֲמ֛/וֹ בְּ/יַד עֲבָדָ֖י/ו אֶל אָבִ֑י/ו וַ/יָּבֹ֨אוּ֙ עַבְדֵ֣י דָוִ֔ד אֶ֖רֶץ בְּנֵ֥י עַמּֽוֹן־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, just as his father showed kindness to me.” So David sent by the hand of his servants to comfort him concerning his father, and David’s servants came into the land of the Ammonites.
translation:
  language: de
  text: 'David sagte: „Ich will Hanun, dem Sohn des Nahasch, Güte erweisen, so wie sein Vater mir Güte erwiesen hat.“ Darauf sandte David seine Diener, um ihn wegen seines Vaters zu trösten.[a] Und Davids Diener kamen in das Land der Ammoniter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ihm wegen seines Vaters Trost zuzusprechen“. Der hebräische Ausdruck meint wahrscheinlich, ihm anlässlich des Todes seines Vaters Beileid zu bekunden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: Güte
  rationale: Im diplomatisch-politischen Zusammenhang bezeichnet חֶסֶד wohlwollende, loyale Zuwendung. „Güte erweisen“ gibt beide Vorkommen einheitlich, würdig und verständlich wieder, ohne den Ausdruck ausschließlich auf Bundestreue festzulegen.
- source_word: חָנוּן בֶּן נָחָשׁ
  choice: Hanun, dem Sohn des Nahasch
  rationale: Die Namen folgen der geläufigen deutschen Umschrift; die Sohnesbezeichnung wird ausdrücklich bewahrt. Der Dativ ergibt sich aus der deutschen Wendung „Güte erweisen“.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: „So wie“ kennzeichnet den Vergleich und die beabsichtigte Erwiderung der zuvor erfahrenen Güte natürlich und deutlich.
- source_word: עָשָׂה ... חֶסֶד
  choice: Güte erweisen
  rationale: Die feste deutsche Verbindung gibt die hebräische Konstruktion idiomatisch wieder und lässt sich in beiden Satzteilen parallel verwenden.
- source_word: לְנַחֲמוֹ אֶל־אָבִיו
  choice: um ihn wegen seines Vaters zu trösten
  rationale: נחם bezeichnet hier Trost im Trauerfall; אֶל־אָבִיו nennt den Vater als Anlass. Die Formulierung wahrt den Bezug, ohne den im Vers nicht ausdrücklich genannten Tod in den Haupttext einzufügen.
- source_word: בְּיַד עֲבָדָיו
  choice: sandte David seine Diener
  rationale: Die hebräische Wendung „durch die Hand seiner Diener“ bezeichnet die Diener als Beauftragte. Die deutsche Formulierung drückt ihre Entsendung natürlich aus und wird durch den folgenden Satz, in dem sie ankommen, bestätigt.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: das Land der Ammoniter
  rationale: „Ammoniter“ ist die übliche deutsche Wiedergabe des hebräischen Volksnamens „Söhne Ammons“; „Land“ bewahrt אֶרֶץ.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung von „Güte“ und „Davids Diener“ bildet die hebräische Wiederholung ab. Das einleitende „Und“ im letzten Satz bewahrt die fortlaufende Erzählstruktur, ohne sie in einen temporalen Nebensatz umzudeuten.
