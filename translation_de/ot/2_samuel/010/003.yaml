base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/003.yaml
  text: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
translation:
  language: de
  text: 'Da sagten die führenden Männer der Ammoniter zu ihrem Herrn Hanun: »Meinst du, David ehrt deinen Vater, weil er dir Tröster[a] geschickt hat? Hat David seine Diener nicht vielmehr zu dir geschickt, um die Stadt zu erkunden, sie auszuspionieren und sie zu Fall zu bringen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind Gesandte, die Hanun nach dem Tod seines Vaters ihr Beileid aussprechen und ihn trösten sollten.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי בְנֵי עַמּוֹן
  choice: die führenden Männer der Ammoniter
  rationale: שָׂרִים bezeichnet hochrangige politische oder höfische Amtsträger. „Führende Männer“ ist im modernen Deutschen verständlich und vermeidet die möglicherweise erblich-dynastische Engführung von „Fürsten“.
- source_word: אֲדֹנֵיהֶם
  choice: ihrem Herrn
  rationale: אדון ist hier die menschliche Herrschaftsbezeichnung für Hanun. „Herr“ bewahrt die hierarchische Beziehung, ohne einen göttlichen Titel anzudeuten.
- source_word: הַמְכַבֵּד ... בְּעֵינֶיךָ
  choice: Meinst du, David wolle ... ehren
  rationale: 'Die rhetorische Frage und das Idiom „in deinen Augen“ werden natürlich wiedergegeben: Es geht darum, ob Hanun Davids Handlung als Ehrung beurteilt.'
- source_word: מְנַחֲמִים
  choice: Tröster
  rationale: Das Partizip bezeichnet Personen, die nach dem Tod von Hanuns Vater Trost überbringen. „Tröster“ wahrt die knappe Personenbezeichnung des Hebräischen.
- source_word: הֲלוֹא
  choice: nicht vielmehr
  rationale: Die Partikel eröffnet eine rhetorische Frage, die Zustimmung erwartet und den argwöhnischen Gegensatz zur behaupteten Ehrung deutlich macht.
- source_word: חֲקוֹר אֶת הָעִיר
  choice: die Stadt zu erkunden
  rationale: חקר meint gründliches Untersuchen oder Ausforschen. „Erkunden“ passt zum vermuteten militärischen Zweck und klingt im Deutschen idiomatisch.
- source_word: וּלְרַגְּלָהּ
  choice: sie auszuspionieren
  rationale: Das Piel von רגל bezeichnet das Auskundschaften als Spion. Das Pronomen bezieht sich auf die Stadt.
- source_word: וּלְהָפְכָהּ
  choice: sie zu Fall zu bringen
  rationale: הפך kann „umstürzen, zu Fall bringen“ bedeuten. Die Formulierung wahrt den militärisch-politischen Sinn, ohne zwingend vollständige Zerstörung zu behaupten.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עבדים bezeichnet hier Davids königliche Diener beziehungsweise Gesandte. „Diener“ hält sich eng an den Ausdruck des Ausgangstextes.
theological_decisions:
- issue: Argwohn der ammonitischen Führer statt Erzählerurteil
  choice: Die Beschuldigung bleibt als rhetorische Frage in direkter Rede formuliert.
  alternative: Die Spionageabsicht als feststehende Tatsache wiedergeben.
  rationale: Der Vers berichtet die verdächtigende Deutung der ammonitischen Führer; der Erzähler bestätigt ihre Behauptung hier nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede klingt argwöhnisch und höfisch-politisch, bleibt aber für heutige Leser klar. Nur der erklärungsbedürftige Ausdruck „Tröster“ erhält eine Fußnote.
