  register: Modernes, würdiges Standarddeutsch mit klarer militärischer Erzählweise. Die geografische Bezeichnung „der Strom“ bleibt im Haupttext bewusst so unbestimmt wie im Hebräischen; die Identifikation mit dem Euphrat steht in der Fußnote. Eigennamen werden in einer für deutsche Leser gut lesbaren Form wiedergegeben.
