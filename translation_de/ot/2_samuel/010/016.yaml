base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/016.yaml
  text: Hadadezer sent and brought out the Arameans who were beyond the River[a], and they came to Helam[c][b], with Shobak the commander of Hadadezer’s army before them.
translation:
  language: de
  text: Hadad-Eser sandte aus und ließ die Aramäer von jenseits des Stromes[a] ausrücken. Sie kamen nach Helam, und Schobach[b], der Heerführer Hadad-Esers, war vor ihnen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich der Euphrat.
    reason: cultural_note
  - marker: b
    text: Der Name kann auch „Schobak“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „vor ihnen“; wahrscheinlich führte er das Heer an oder stand an seiner Spitze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte Boten aus
  rationale: Das Verb bedeutet zunächst „senden“. Da kein ausdrückliches Objekt genannt ist und Hadad-Eser anschließend die Aramäer ausrücken lässt, macht die deutsche Formulierung den vorausgesetzten Auftrag natürlich verständlich, ohne einen bestimmten Boten zu benennen.
- source_word: וַיֹּצֵא אֶת אֲרָם
  choice: ließ die Aramäer … ausrücken
  rationale: 'Der Hifil von יצא hat kausative Bedeutung: Hadad-Eser veranlasste die aramäischen Truppen, herauszukommen. „Ausrücken lassen“ gibt dies im militärischen Zusammenhang idiomatisch wieder.'
- source_word: אֲרָם אֲשֶׁר מֵעֵבֶר הַנָּהָר
  choice: die Aramäer, die jenseits des Stromes lebten
  rationale: אֲרָם bezeichnet hier im Zusammenhang die aramäischen Menschen beziehungsweise Truppen. Der ergänzte Ausdruck „lebten“ stellt den geografischen Bezug im Deutschen klar; „der Strom“ bewahrt die nicht ausdrücklich benannte Bezeichnung des Hebräischen.
- source_word: וַיָּבֹאוּ חֵילָם
  choice: Sie kamen nach Helam
  rationale: חֵילָם wird als Ortsname verstanden und entsprechend transliteriert. „Nach“ ist bei einem Zielort natürliches Deutsch.
- source_word: וְשׁוֹבַךְ
  choice: Schobach
  rationale: Die Wiedergabe folgt einer im Deutschen geläufigen Transliteration des Namens; „Schobak“ ist aufgrund des Schlusskonsonanten eine mögliche Alternative.
- source_word: שַׂר צְבָא
  choice: Heerführer
  rationale: Die Konstruktverbindung bezeichnet den militärischen Befehlshaber. „Heerführer“ ist knapp, verständlich und dem historischen Kontext angemessen.
- source_word: לִפְנֵיהֶם
  choice: zog vor ihnen her
  rationale: Wörtlich heißt die Wendung „vor ihnen“. Im militärischen Kontext bezeichnet sie wahrscheinlich Schobachs Stellung an der Spitze; das Verb „zog“ wird aus dem Bewegungszusammenhang ergänzt.
