  text: וַ/יַּ֣רְא אֲרָ֔ם כִּ֥י נִגַּ֖ף לִ/פְנֵ֣י יִשְׂרָאֵ֑ל וַ/יֵּאָסְפ֖וּ יָֽחַד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/015.yaml
  text: When Aram saw that it had been defeated before Israel[a], they gathered together.
translation:
  language: de
  text: Als Aram sah, dass es von Israel besiegt worden war[a], versammelten sie sich gemeinsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Aram sah, dass es von Israel besiegt worden war, und sie versammelten sich gemeinsam.“ Der singularische Eigenname „Aram“ steht im Hebräischen kollektiv für die Aramäer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Als ... sah
  rationale: Das Waw-Consecutivum führt die Erzählung weiter; mit „Als“ wird die zeitliche Beziehung zur folgenden Handlung im Deutschen natürlich ausgedrückt.
- source_word: אֲרָם
  choice: Aram
  rationale: Der singularische Eigenname bezeichnet hier kollektiv die Aramäer beziehungsweise ihre Streitkräfte; die Wiedergabe bewahrt den hebräischen Namen.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt der Wahrnehmung ein, nicht eine Begründung.
- source_word: נִגַּף
  choice: geschlagen worden war
  rationale: Der Niphal bezeichnet im militärischen Zusammenhang das Erleiden einer Niederlage. Die Formulierung ist idiomatisch und bewahrt zugleich das Bild des Geschlagenwerdens.
- source_word: לִפְנֵי
  choice: vor
  rationale: Im Kampfzusammenhang bedeutet לִפְנֵי, dass Aram Israel unterlag; „vor Israel“ erhält die Ausdrucksweise des Hebräischen.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird direkt übernommen.
- source_word: וַיֵּאָסְפוּ
  choice: versammelten sie sich
  rationale: Der Niphal von אסף bedeutet, sich zu sammeln oder zu versammeln. „Versammelten sich“ ist natürlich und fügt keine ausdrücklich militärische Deutung wie „formierten sich neu“ hinzu.
- source_word: יָחַד
  choice: gemeinsam
  rationale: Das Adverb bedeutet „zusammen, gemeinsam“ und bestimmt die Versammlung näher.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Spannung zwischen dem grammatisch singularischen „Aram“ und dem kollektiv gemeinten pluralischen „sie“ bleibt erhalten und wird in der Fußnote erläutert.
