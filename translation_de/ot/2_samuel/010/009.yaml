id: 2SA.10.9
reference: 2 Samuel 10:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֤ה אֵלָי/ו֙ פְּנֵ֣י הַ/מִּלְחָמָ֔ה מִ/פָּנִ֖ים וּ/מֵֽ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כֹּל֙ בְּחוּרֵ֣י ב/ישראל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/009.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose from all the choice men of Israel and arrayed them to meet Aram.
translation:
  language: de
  text: Als Joab sah, dass die Schlachtfront sich von vorn und von hinten gegen ihn richtete, wählte er aus allen auserlesenen Männern Israels einige aus[a] und stellte sie zum Kampf gegen Aram[b] auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »wählte er aus allen Auserlesenen Israels aus«.'
    reason: lexical_alternative
  - marker: b
    text: Mit »Aram« sind hier die aramäischen Truppen gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Bewahrt den gewöhnlichen Erzählausdruck von ראה; im Zusammenhang schließt das Sehen das Erfassen der taktischen Lage ein.
- source_word: פְּנֵי הַמִּלְחָמָה
  choice: die Schlachtfront
  rationale: Die wörtliche Wendung »das Angesicht der Schlacht« bezeichnet hier idiomatisch die Front beziehungsweise Kampflinie.
- source_word: הָיְתָה אֵלָיו
  choice: sich gegen ihn richtete
  rationale: Gibt die gegen Joab gerichtete militärische Aufstellung natürlich und präzise wieder.
- source_word: מִפָּנִים וּמֵאָחוֹר
  choice: von vorn und von hinten
  rationale: Bewahrt den räumlichen Gegensatz und macht die Bedrohung von zwei Seiten deutlich, ohne eine vollständige Einkesselung zu behaupten.
- source_word: וַיִּבְחַר מִכֹּל בְּחוּרֵי בְיִשְׂרָאֵל
  choice: wählte er aus allen auserlesenen Männern Israels einige aus
  rationale: מִכֹּל bezeichnet die Auswahl aus der Gesamtheit; בְּחוּרֵי meint ausgewählte beziehungsweise besonders geeignete Kämpfer. »Einige« ist im Deutschen zur Kennzeichnung der Teilmenge ergänzt.
- source_word: וַיַּעֲרֹךְ
  choice: stellte sie zum Kampf ... auf
  rationale: ערך bezeichnet im militärischen Zusammenhang das geordnete Aufstellen von Truppen zur Schlacht.
- source_word: לִקְרַאת אֲרָם
  choice: zum Kampf gegen Aram
  rationale: לקראת bezeichnet hier das Entgegentreten zur militärischen Begegnung; die Wiedergabe macht den Kontext deutlich und bewahrt den Namen Aram.
- source_word: אֲרָם
  choice: Aram
  rationale: Bewahrt den hebräischen Eigennamen statt ihn durch eine spätere geografische Bezeichnung zu ersetzen; gemeint sind im Kontext die aramäischen Truppen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Schlachtfront« erhält das militärische Bild des Hebräischen; »stellte sie zum Kampf ... auf« ist natürlicher als das gehobene »formierte sie« und bezeichnet dennoch präzise die Schlachtordnung.
