  verdict: revise
  source_fidelity: Der Entwurf gibt den Bericht an David, die Entsendung zu den Männern, ihre tiefe Beschämung, den Aufenthalt in Jericho und die Rückkehr nach dem Nachwachsen des Bartes insgesamt zutreffend wieder. »Der König ließ ihnen sagen« ist jedoch gegenüber וַיֹּאמֶר הַמֶּלֶךְ („der König sagte“) eine nicht ausdrücklich markierte Umformung zur mittelbaren Rede und sollte nicht an die Stelle der direkten königlichen Rede treten.
  naturalness: Der Text ist überwiegend natürliches, würdiges modernes Standarddeutsch. »Der König sagte« ist hier ebenso natürlich und näher am hebräischen Erzählstil. »sandte er ihnen entgegen« bewahrt die im Hebräischen unbenannte entsandte Person, ohne sie als Boten festzulegen.
  terminology: »zutiefst gedemütigt« gibt נִכְלָמִים מְאֹד angemessen wieder. »Bart« als kollektiver Singular ist im Deutschen idiomatisch und entspricht dem hebräischen Singular mit Pluralsuffix. Die Eigennamen und Ortsbezeichnung sind standardgemäß wiedergegeben.
