base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
translation:
  language: de
  text: 'Als man David davon berichtete, sandte er ihnen entgegen, denn die Männer waren zutiefst gedemütigt. Der König sagte: »Bleibt in Jericho, bis euer Bart wieder gewachsen ist; dann kehrt zurück.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Als man David davon berichtete
  rationale: Das Hifil von נגד bedeutet »berichten/mitteilen«; das unbestimmte Subjekt wird im Deutschen natürlich mit »man« wiedergegeben. »Davon« nimmt das zuvor Geschehene auf.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: sandte er ihnen jemanden entgegen
  rationale: Die hebräische Wendung lautet wörtlich »er sandte ihnen entgegen«. Das ergänzte »jemanden« macht die im Verb vorausgesetzte, aber nicht näher bezeichnete Person im Deutschen verständlich, ohne ausdrücklich »Boten« festzulegen.
- source_word: נִכְלָמִים מְאֹד
  choice: zutiefst gedemütigt
  rationale: Das Nifal-Partizip von כלם bezeichnet öffentliches Beschämt- oder Gedemütigtsein; מְאֹד verstärkt den Ausdruck.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Der König ließ ihnen sagen
  rationale: Im Zusammenhang richtet sich die Rede über den von David Entsandten an die Männer. Diese natürliche deutsche Formulierung verdeutlicht die mittelbare Übermittlung, ohne den Inhalt zu verändern.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: Bleibt in Jericho
  rationale: ישׁב bedeutet hier vorübergehend bleiben oder sich aufhalten; bei einer Stadt ist »in Jericho« idiomatisches Standarddeutsch.
- source_word: עַד יְצַמַּח זְקַנְכֶם
  choice: bis euer Bart wieder gewachsen ist
  rationale: צמח bedeutet »wachsen/sprießen«. Das singularische Kollektivsuffix in »euer Bart« entspricht der hebräischen Form und bezeichnet den Bart jedes Angeredeten; »wieder« ist durch den vorausgehenden Kontext des Abschneidens sachlich impliziert.
- source_word: וְשַׁבְתֶּם
  choice: dann kehrt zurück
  rationale: שׁוב bedeutet »zurückkehren«. »Dann« gibt die durch »bis« und die anschließende Konjunktion ausgedrückte zeitliche Folge natürlich wieder.
