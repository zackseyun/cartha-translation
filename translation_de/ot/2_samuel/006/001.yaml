  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt natürlichem deutschem Erzählstil; „ausgewählten Männer“ bewahrt den militärischen Auswahlgedanken, während die Fußnote die echte lexikalische Mehrdeutigkeit offenhält.
