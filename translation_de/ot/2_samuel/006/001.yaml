base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/001.yaml
  text: David again gathered all the chosen men of Israel[a], thirty thousand.
translation:
  language: de
  text: David versammelte erneut alle ausgewählten Männer Israels[a], dreißigtausend Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „junge Männer“ oder „auserlesene Männer“. Das hebräische Wort בָּחוּר kann das junge Alter oder die besondere Auswahl und Eignung bezeichnen; der Zusammenhang spricht hier eher für eine ausgewählte Truppe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: erneut
  rationale: Die Verbindung von יסף und עוד bezeichnet hier idiomatisch die Wiederholung einer Handlung. „Erneut“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: אֶת כָּל
  choice: alle
  rationale: אֶת markiert das bestimmte direkte Objekt, während כָּל die Gesamtheit bezeichnet. Im Deutschen wird dies angemessen mit „alle“ wiedergegeben.
- source_word: בָּחוּר
  choice: ausgewählten Männer
  rationale: בָּחוּר kann sowohl junge als auch ausgesuchte beziehungsweise besonders geeignete Männer bezeichnen. Im Zusammenhang einer großen Aufbietung liegt eine Auswahl kampffähiger Männer nahe, ohne dass die lexikalische Alternative verschwiegen wird.
- source_word: בְּיִשְׂרָאֵל
  choice: Israels
  rationale: Die Präposition ב bezeichnet hier innerhalb der Auswahl die Zugehörigkeit beziehungsweise den Bereich, aus dem die Männer genommen wurden. Der deutsche Genitiv „Israels“ ist idiomatisch und prägnant.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: dreißigtausend Mann
  rationale: Die Zahl wird direkt wiedergegeben; „Mann“ verdeutlicht im Deutschen natürlich, dass sich die Zahl auf die zuvor genannten Männer bezieht.
theological_decisions: []
