base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
translation:
  language: de
  text: David und das ganze Haus Israel feierten[b] vor Jahwe mit allerlei Instrumenten aus Zypressenholz[a], mit Leiern, Harfen, Handtrommeln, Rasseln[c] und Zimbeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „mit allerlei Zypressenhölzern“. Wahrscheinlich sind verschiedene Musikinstrumente aus Zypressenholz gemeint; auch die genaue Baumart ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „spielten“ beziehungsweise „jubelten“. Das hebräische Verb kann ausgelassenes Spielen und festliches Feiern bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Die genaue Art dieser Instrumente ist unsicher; möglicherweise waren es Sistren oder andere Schüttelinstrumente.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: feierten
  rationale: Das Piel von שׂחק bezeichnet hier im Zusammenhang einer musikalisch begleiteten Prozession ein ausgelassenes, festliches Tun. „Feierten“ gibt diesen Sinn natürlich wieder, ohne ihn auf bloßes Spielen zu verengen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bezeichnet ein Handeln in Jahwes Gegenwart; „vor Jahwe“ bewahrt sowohl das hebräische Idiom als auch den Gottesnamen.
- source_word: בְּכֹל עֲצֵי בְרוֹשִׁים
  choice: mit allerlei Instrumenten aus Zypressenholz
  rationale: Der schwierige, elliptische Ausdruck lautet wörtlich ungefähr „mit allerlei Zypressenhölzern“. Im musikalischen Kontext sind wahrscheinlich Instrumente aus diesem Holz gemeint; die Ergänzung „Instrumenten“ macht den wahrscheinlichen Bezug verständlich, während eine Fußnote die Unsicherheit offenlegt.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: das ganze Haus Israel
  rationale: Die korporative Ausdrucksweise des Hebräischen wird bewahrt und bleibt im Deutschen verständlich.
- source_word: כִנֹּרוֹת
  choice: Leiern
  rationale: כִּנּוֹר bezeichnet eher ein Leierinstrument als eine moderne Harfe.
- source_word: נְבָלִים
  choice: Harfen
  rationale: נֵבֶל ist ein von כִּנּוֹר unterschiedenes Saiteninstrument; die genaue Bauart ist unsicher, doch „Harfen“ ist eine verständliche konventionelle Wiedergabe.
- source_word: תֻפִּים
  choice: Handtrommeln
  rationale: תֹּף bezeichnet eine mit der Hand gespielte Rahmentrommel. „Handtrommeln“ ist präziser als das möglicherweise Schellen voraussetzende „Tamburine“.
- source_word: מְנַעַנְעִים
  choice: Rasseln
  rationale: Das seltene Wort bezeichnet wahrscheinlich geschüttelte Schlaginstrumente; „Rasseln“ ist verständlich, ohne eine unsichere genaue Bauform zu behaupten.
- source_word: צֶלְצֶלִים
  choice: Zimbeln
  rationale: Der Ausdruck bezeichnet metallene, gegeneinandergeschlagene Instrumente; „Zimbeln“ ist die übliche präzise Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korporative Wendung „Haus Israel“ bleibt erhalten. Die schwer deutbare Holzformulierung wird für die Lesbarkeit maßvoll ergänzt und in der Fußnote transparent gemacht; instrumentenkundliche Unsicherheiten werden nicht übergangen.
