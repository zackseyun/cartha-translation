  text: וַ/יָּ֥שָׁב דָּוִ֖ד לְ/בָרֵ֣ךְ אֶת בֵּית֑/וֹ וַ/תֵּצֵ֞א מִיכַ֤ל בַּת שָׁאוּל֙ לִ/קְרַ֣את דָּוִ֔ד וַ/תֹּ֗אמֶר מַה נִּכְבַּ֨ד הַ/יּ֜וֹם מֶ֣לֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נִגְלָ֤ה הַ/יּוֹם֙ לְ/עֵינֵ֨י אַמְה֣וֹת עֲבָדָ֔י/ו כְּ/הִגָּל֥וֹת נִגְל֖וֹת אַחַ֥ד הָ/רֵקִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/020.yaml
  text: Then David returned to bless his household[a]. But Michal daughter of Saul came out to meet David and said, “How honored the king of Israel was today, uncovering himself today in the sight of the servant girls of his servants[c][b], as one of the vulgar fellows shamelessly uncovers himself!”
translation:
  language: de
  text: 'Dann kehrte David zurück, um sein Haus zu segnen. Doch Michal, die Tochter Sauls, kam David entgegen und sagte: »Wie ehrenvoll hat sich der König von Israel heute gezeigt![a] Heute hat er sich vor den Augen der Sklavinnen seiner Diener entblößt[b] – so, wie sich einer der nichtsnutzigen Kerle schamlos entblößt!«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Michal spricht offenkundig spöttisch; wörtlich ist von der Ehre beziehungsweise Herrlichkeit des Königs die Rede.
    reason: rhetorical_clarification
  - marker: b
    text: Das Hebräische bezeichnet weibliche Abhängige niedrigen Status; »Sklavinnen« gibt in diesem Kontext wahrscheinlich ihren unfreien Status wieder.
    reason: lexical_alternative
  - marker: c
    text: 'Die hebräische Formulierung verstärkt das Entblößen; auch möglich: »wie sich einer der nichtsnutzigen Kerle ganz unverhohlen entblößt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבָרֵךְ אֶת־בֵּיתוֹ
  choice: seine Hausgemeinschaft zu segnen
  rationale: ברך bezeichnet hier das Segnen, während ביתו wahrscheinlich nicht nur das Gebäude, sondern die zu Davids Haus gehörenden Menschen meint. „Hausgemeinschaft“ bewahrt diesen umfassenden Sinn besser als „Familie“.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Michal, die Tochter Sauls
  rationale: Die Bezeichnung wird ausdrücklich beibehalten, da der Erzähler Michals Zugehörigkeit zum Haus Saul hervorhebt.
- source_word: מַה נִּכְבַּד הַיּוֹם
  choice: Wie ehrenvoll hat sich … heute gezeigt!
  rationale: כבד trägt den Sinn von Ehre beziehungsweise Herrlichkeit. Die Formulierung lässt die im Zusammenhang eindeutige Ironie hörbar werden, ohne sie durch eine rein abwertende Übersetzung zu ersetzen.
- source_word: נִגְלָה
  choice: hat er sich … entblößt
  rationale: Das Nifal von גלה bezeichnet hier ein Sich-Entblößen beziehungsweise Sich-Entdecken. „Sich entblößen“ gibt Michals Vorwurf wieder, ohne den genauen Grad der Entblößung festzulegen.
- source_word: אַמְהוֹת עֲבָדָיו
  choice: Mägde seiner Diener
  rationale: אמה bezeichnet weibliche Hausangehörige niedrigen und oft unfreien Standes; עבדיו sind hier Davids Diener beziehungsweise Untergebene. Die Genitivbeziehung und das von Michal betonte Ranggefälle bleiben erhalten.
- source_word: כְּהִגָּלוֹת נִגְלוֹת
  choice: so, wie sich … schamlos entblößt
  rationale: Die figura etymologica mit Infinitiv und finiter Form verstärkt die Handlung. „Schamlos“ gibt die verächtliche und emphatische Kraft in idiomatischem Deutsch wieder.
- source_word: אַחַד הָרֵקִים
  choice: einer der nichtsnutzigen Kerle
  rationale: ריקים bezeichnet wörtlich „Leere“ und übertragen wertlose oder verachtete Männer. „Nichtsnutzige Kerle“ ist gegenwärtig verständlich und bewahrt Michals beleidigenden Ton.
theological_decisions:
- issue: Sozialer Status der אַמְהוֹת
  choice: Mägde
  alternative: Sklavinnen
  rationale: אמה kann eine Sklavin oder eine weibliche Hausbedienstete niedrigen Ranges bezeichnen. „Mägde“ bewahrt die historisch-soziale Unterordnung, ohne einen im Einzelvers nicht genauer bestimmten Rechtsstatus zu stark festzulegen; die Fußnote nennt die mögliche Unfreiheit ausdrücklich.
- issue: Art und Ausmaß von Davids Entblößung
  choice: sich entblößt
  alternative: sich bloßgestellt / sich aufgedeckt
  rationale: Der hebräische Wortlaut bezeichnet Entblößung, bestimmt aber in diesem Vers nicht ausdrücklich deren körperliches Ausmaß. Die Übersetzung wahrt Michals Vorwurf, ohne vollständige Nacktheit zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Michals Sarkasmus und der soziale Hohn bleiben deutlich, ohne Umgangssprache oder eine Festlegung auf vollständige Nacktheit. Die Wiederholung von „heute“ folgt der markanten Wiederholung im Hebräischen.
