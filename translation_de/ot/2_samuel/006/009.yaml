  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des hebräischen Textes zutreffend wieder: Davids Furcht vor Jahwe, die Zeitangabe, seine Frage sowie die aktive Bewegung der Lade „zu mir“. „Sich vor Jahwe fürchten“ ist trotz der direkten Objektkonstruktion im Hebräischen die natürliche deutsche Wiedergabe im erzählerischen Kontext nach Usas Tod.'
