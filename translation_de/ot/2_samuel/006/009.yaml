  terminology: „Jahwe“ entspricht der vorgesehenen Wiedergabe von יהוה. „Die Lade Jahwes“ ist für אֲרוֹן יְהוָה ein etablierter, verständlicher biblischer Ausdruck. Die Fußnote erläutert angemessen die semantische Offenheit von אֵיךְ יָבֹא, ohne eine theologische Deutung festzuschreiben.
