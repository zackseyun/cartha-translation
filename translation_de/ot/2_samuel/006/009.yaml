source:
  edition: WLC
  text: וַ/יִּרָ֥א דָוִ֛ד אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֕אמֶר אֵ֛יךְ יָב֥וֹא אֵלַ֖/י אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/009.yaml
  text: And David feared Yahweh that day[a], and he said, “How can the ark of Yahweh come to me?”
translation:
  language: de
  text: 'An jenem Tag fürchtete David sich vor Jahwe und sagte: »Wie soll die Lade Jahwes zu mir kommen?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Wie wird die Lade Jahwes zu mir kommen?« Die Frage kann praktische Unsicherheit ausdrücken, aber ebenso Furcht oder ein Empfinden der Unwürdigkeit nach Usas Tod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: fürchtete sich vor
  rationale: Das Qal von ירא mit direktem Objekt bezeichnet hier angesichts von Usas Tod Davids konkrete Furcht. Die deutsche Wendung »sich vor jemandem fürchten« gibt dies natürlich wieder; »ehrfürchtig sein« wäre im Zusammenhang zu schwach.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die idiomatische Zeitangabe bleibt zeitlich bestimmt und klingt in modernem Standarddeutsch natürlich.
- source_word: אֵיךְ יָבֹא
  choice: Wie soll … kommen?
  rationale: »Wie soll« bewahrt sowohl die Frage nach dem möglichen Vorgehen als auch Davids erschrockene Infragestellung, ohne das im Hebräischen aktive Verb passiv als »gebracht werden« wiederzugeben.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition mit Suffix bedeutet schlicht »zu mir«; Zusätze wie »in mein Haus« wären interpretierend.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: Die hebräische Genitivverbindung wird knapp und transparent wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; die Transliteration bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Charakter von Davids Frage
  choice: Mehrdeutig als Frage »Wie soll … kommen?«
  alternative: 'Reine Zukunftsfrage: »Wie wird … kommen?«'
  rationale: Nach Usas Tod kann die Frage sowohl praktische Unsicherheit als auch Furcht beziehungsweise ein Empfinden der Unwürdigkeit ausdrücken. Die Übersetzung legt sich nicht eindeutig auf nur eine Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Lade« folgt dem etablierten biblischen Ausdruck für אֲרוֹן, während Satzbau und Verbwahl bewusst gegenwärtig und gut verständlich bleiben.
