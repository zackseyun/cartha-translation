source:
  edition: WLC
  text: וַ/יִּשָּׂאֻ֗/הוּ מִ/בֵּ֤ית אֲבִֽינָדָב֙ אֲשֶׁ֣ר בַּ/גִּבְעָ֔ה עִ֖ם אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/אַחְי֕וֹ הֹלֵ֖ךְ לִ/פְנֵ֥י הָ/אָרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/004.yaml
  text: They carried it from the house of Abinadab[a], which was on the hill, with the ark of God, and Ahio was walking before the ark.
translation:
  language: de
  text: Sie trugen sie aus Abinadabs Haus, das auf dem Hügel[a] lag, zusammen mit der Lade Gottes; und Achjo ging vor der Lade her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das in Gibea lag“. Das hebräische Wort גִּבְעָה kann sowohl „Hügel“ als auch den Ortsnamen „Gibea“ bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Sie trugen sie
  rationale: Das Verb נשׂא bezeichnet hier das Fortbewegen der Lade; das Suffix bezieht sich auf die im Deutschen feminine „Lade“. „Trugen“ bleibt nahe am Hebräischen, ohne die konkrete Transportweise weiter auszudeuten.
- source_word: מִבֵּית אֲבִינָדָב
  choice: aus Abinadabs Haus
  rationale: Die Präposition מן bezeichnet den Ausgangspunkt; die deutsche Genitivfügung ist natürlich und präzise.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: das auf dem Hügel lag
  rationale: גִּבְעָה wird wegen des Artikels im Haupttext als Gattungsbegriff „Hügel“ verstanden. „Lag“ gibt die örtliche Lage des Hauses idiomatisch wieder. Die mögliche Deutung als Ortsname bleibt in der Fußnote erhalten.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: zusammen mit der Lade Gottes
  rationale: עִם drückt Begleitung beziehungsweise Zuordnung aus. „Zusammen mit“ macht den syntaktisch schwierigen Anschluss im Deutschen verständlich, ohne die Spannung des hebräischen Satzes vollständig aufzulösen.
- source_word: וְאַחְיוֹ
  choice: und Achjo
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren Transliteration wiedergegeben.
- source_word: הֹלֵךְ
  choice: ging … her
  rationale: Das Partizip bezeichnet eine gleichzeitig andauernde Handlung. In Verbindung mit „vor … her“ klingt das deutsche Präteritum natürlich und bewahrt den prozessionalen Sinn.
- source_word: לִפְנֵי הָאָרוֹן
  choice: vor der Lade her
  rationale: Die Wendung bezeichnet die räumliche Position vor der Lade und wird idiomatisch als „vor … her“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Lade“ folgt dem hebräischen Text. Der etwas schwierige Anschluss von „zusammen mit der Lade Gottes“ wird bewusst nicht durch eine weitreichende Rekonstruktion geglättet.
