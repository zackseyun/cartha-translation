base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/021.yaml
  text: David said to Michal[a], “It was before Yahweh, who chose me above your father and above all his house, to appoint me ruler over the people of Yahweh, over Israel—and I celebrated before Yahweh.”
translation:
  language: de
  text: 'David sagte zu Michal: »Vor Jahwe, der mich deinem Vater und seinem ganzen Haus vorgezogen und mich zum Herrscher über das Volk Jahwes, über Israel, eingesetzt hat, habe ich gefeiert[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „habe ich gespielt“; im Zusammenhang auch: „habe ich getanzt“. Das hebräische Verb bezeichnet freudiges, ausgelassenes Tun und ist nicht ausschließlich ein Wort für Tanzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bezeichnet ein Handeln in Jahwes Gegenwart. „Vor Jahwe“ ist im Deutschen natürlich und bewahrt die betonte Wiederholung im Vers.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֲשֶׁר בָּחַר בִּי מֵאָבִיךְ וּמִכָּל בֵּיתוֹ
  choice: der mich deinem Vater und seinem ganzen Haus vorgezogen hat
  rationale: בָּחַר mit מִן stellt Davids Erwählung der nicht erfolgten Erwählung Sauls und seiner Dynastie gegenüber. „Vorgezogen“ gibt diesen vergleichenden beziehungsweise ausschließenden Sinn idiomatisch wieder; „Haus“ bewahrt die familiäre und dynastische Bedeutung.
- source_word: לְצַוֹּת אֹתִי
  choice: mich … eingesetzt hat
  rationale: צוה bedeutet gewöhnlich „befehlen“, bezeichnet hier mit dem folgenden Amt jedoch die Beauftragung beziehungsweise Einsetzung in eine Leitungsstellung.
- source_word: נָגִיד
  choice: Herrscher
  rationale: נָגִיד bezeichnet einen in leitende Autorität eingesetzten Mann. „Herrscher“ macht die Regierungsgewalt deutlich, ohne den Ausdruck auf den Rang eines Prinzen zu verengen.
- source_word: עַל עַם יְהוָה עַל יִשְׂרָאֵל
  choice: über das Volk Jahwes, über Israel
  rationale: Die Wiederholung von עַל bleibt erhalten; „über Israel“ erläutert appositionell, welches Volk gemeint ist.
- source_word: וְשִׂחַקְתִּי
  choice: will ich feiern
  rationale: שׂחק bezeichnet hier ausgelassenes, freudiges Tun, ist aber weniger tanzspezifisch als die zuvor verwendeten Verben. Die deutsche Zukunftsform gibt Davids entschlossene Fortsetzung seiner Aussage wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration bewahrt diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Ob Davids Handlung ausdrücklich als Tanz bezeichnet werden soll
  choice: feiern
  alternative: tanzen
  rationale: שׂחק kann spielerisches oder festlich-freudiges Handeln bezeichnen und ist breiter als die in den vorausgehenden Versen gebrauchten tanzbezogenen Verben. Deshalb wird der Sinn nicht auf „tanzen“ verengt; diese kontextuell mögliche Lesart steht in der Fußnote.
- issue: Zeit- und Aussagewert von וְשִׂחַקְתִּי
  choice: will ich feiern
  alternative: habe ich gefeiert
  rationale: Im Zusammenhang mit Davids anschließender Ankündigung in Vers 22 lässt sich die Form als entschlossene, auf weiteres Handeln gerichtete Aussage verstehen. Die Vergangenheitsdeutung bleibt grammatisch und kontextuell möglich und wird daher in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der elliptische Auftakt „Vor Jahwe war es“ bewahrt Davids pointierte Antwort, während der folgende Relativsatz im Deutschen verständlich bleibt. „Ganzes Haus“ erhält den dynastischen Klang des Hebräischen.
