base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/019.yaml
  text: He distributed to all the people[a], to the whole multitude of Israel, from man to woman, to each person one loaf of bread, one portion of meat, and one raisin cake. Then all the people went away[b], each to his house.
translation:
  language: de
  text: Er verteilte an das ganze Volk, an die gesamte Menge Israels, an Männer wie Frauen,[a] an jeden einen Brotlaib, eine Portion Fleisch[b] und einen Rosinenkuchen. Danach ging das ganze Volk fort, jeder nach Hause.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vom Mann bis zur Frau«; gemeint ist das gesamte versammelte Volk, Männer und Frauen.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »eine Portion« beziehungsweise »ein Maß«. Das hebräische Wort אֶשְׁפָּר ist selten und seine genaue Bedeutung unsicher. Viele verstehen es hier besonders aufgrund der Parallele in 1. Chronik 16,3 als eine Portion Fleisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: Er verteilte
  rationale: Das Piel von חלק bezeichnet hier das Austeilen einzelner Gaben an eine Menschenmenge; »verteilte« ist natürlich und sachlich.
- source_word: לְכָל הָעָם / לְכָל הֲמוֹן יִשְׂרָאֵל
  choice: an das ganze Volk, an die gesamte Menge Israels
  rationale: Beide parallelen, nachdrücklichen Wendungen des Hebräischen bleiben erhalten.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: an Männer wie Frauen
  rationale: Die hebräische Wendung lautet wörtlich »vom Mann bis zur Frau« und schließt ausdrücklich beide Gruppen ein; die gewählte Formulierung gibt den idiomatischen Sinn in natürlichem Deutsch wieder.
- source_word: לְאִישׁ
  choice: für jeden
  rationale: Der distributive Singular meint angesichts der unmittelbar zuvor genannten Männer und Frauen jede einzelne Person.
- source_word: חַלַּת לֶחֶם אַחַת
  choice: ein Brot
  rationale: חַלָּה bezeichnet hier einen Brotlaib beziehungsweise Brotkuchen; »ein Brot« ist im modernen Deutsch konkret und verständlich.
- source_word: אֶשְׁפָּר אֶחָד
  choice: eine Portion Fleisch
  rationale: Das seltene Wort אֶשְׁפָּר ist unsicher. Der Kontext und die Parallele in 1. Chronik 16,3 sprechen wahrscheinlich für eine Essensportion, traditionell als Fleischportion verstanden; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: אֲשִׁישָׁה אֶחָת
  choice: einen Rosinenkuchen
  rationale: אֲשִׁישָׁה bezeichnet wohl einen gepressten Kuchen, im biblischen Sprachgebrauch gewöhnlich als Rosinenkuchen verstanden.
- source_word: וַיֵּלֶךְ כָּל הָעָם אִישׁ לְבֵיתוֹ
  choice: Danach ging das ganze Volk fort, jeder nach Hause
  rationale: Die Formulierung gibt sowohl das anschließende Auseinandergehen als auch den distributiven Singular natürlich wieder.
