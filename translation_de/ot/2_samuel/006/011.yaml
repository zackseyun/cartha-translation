source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן יְהוָ֜ה בֵּ֣ית עֹבֵ֥ד אֱדֹ֛ם הַ/גִּתִּ֖י שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת עֹבֵ֥ד אֱדֹ֖ם וְ/אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/011.yaml
  text: And the ark of Yahweh remained in the house of Obed-edom the Gittite for three months[b][a], and Yahweh blessed Obed-edom and all his household.
translation:
  language: de
  text: Und die Lade Jahwes blieb drei Monate lang im Haus Obed-Edoms, des Gatiters[a]. Und Jahwe segnete Obed-Edom und sein ganzes Haus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Gatiter ist ein Mann, der mit der Stadt Gat verbunden ist.
    reason: cultural_note
  - marker: b
    text: 'Oder: „seinen ganzen Haushalt“. Das hebräische Wort kann die Hausgemeinschaft oder umfassender den gesamten häuslichen Bereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: ישׁב kann „sitzen“, „wohnen“ oder „bleiben“ bedeuten. Da die Lade Subjekt ist und eine Zeitdauer folgt, gibt „blieb“ den fortdauernden Aufenthalt natürlich und präzise wieder.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: Die hebräische Genitivverbindung wird direkt wiedergegeben. „Lade“ ist im Deutschen die etablierte Bezeichnung für אֲרוֹן in diesem Zusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen wissenschaftlichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: im Haus Obed-Edoms
  rationale: בֵּית bezeichnet hier zunächst den konkreten Aufenthaltsort der Lade. Der deutsche Genitiv ist natürlich und bewahrt die knappe hebräische Verbindung.
- source_word: עֹבֵד אֱדֹם
  choice: Obed-Edom
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: הַגִּתִּי
  choice: der Gatiter
  rationale: Das Zugehörigkeitsadjektiv bezeichnet einen mit Gat verbundenen Mann. „Gatiter“ ist die etablierte deutsche Form und bleibt näher am Hebräischen als die Paraphrase „aus Gat“.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: drei Monate lang
  rationale: „Lang“ macht die im Hebräischen durch den Zusammenhang ausgedrückte Zeitdauer in natürlichem Deutsch deutlich.
- source_word: וַיְבָרֶךְ
  choice: segnete
  rationale: „Segnen“ ist die direkte und kontextgemäße Wiedergabe von ברך; eine stärker deutende Umschreibung ist nicht nötig.
- source_word: אֶת עֹבֵד אֱדֹם וְאֶת כָּל בֵּיתוֹ
  choice: Obed-Edom und sein ganzes Haus
  rationale: „Sein ganzes Haus“ bewahrt die Bild- und Bedeutungsbreite von בֵּיתוֹ, das sowohl den Haushalt beziehungsweise die Hausgemeinschaft als auch den gesamten häuslichen Bereich bezeichnen kann.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch den traditionellen Ersatztitel „der HERR“ zu ersetzen.
- issue: Umfang des Segens über כָּל בֵּיתוֹ
  choice: sein ganzes Haus
  alternative: seinen ganzen Haushalt
  rationale: Die wörtlichere Formulierung erhält die mögliche umfassende Bedeutung von בַּיִת und legt nicht vorschnell fest, ob allein Personen oder auch die gesamte häusliche Lebenssphäre gemeint sind.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Satzfolge des Hebräischen bleibt erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken; die in der englischen Beratungsschicht offenbar vertauschte Markerplatzierung wurde nach ihrem Inhalt berichtigt.
