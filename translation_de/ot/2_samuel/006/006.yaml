  text: וַ/יָּבֹ֖אוּ עַד גֹּ֣רֶן נָכ֑וֹן וַ/יִּשְׁלַ֨ח עֻזָּ֜א אֶל אֲר֤וֹן הָֽ/אֱלֹהִים֙ וַ/יֹּ֣אחֶז בּ֔/וֹ כִּ֥י שָׁמְט֖וּ הַ/בָּקָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/006.yaml
  text: When they came to Nacon’s threshing floor[a], Uzza reached out to the ark of God and took hold of it[b], because the oxen stumbled.
translation:
  language: de
  text: Als sie zur Tenne Nakons[a] kamen, streckte Usa seine Hand nach der Lade Gottes aus und hielt sie fest, weil die Rinder strauchelten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »zur Tenne von Nakon«; weniger wahrscheinlich: »zur festen Tenne«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »weil die Rinder ausglitten«; möglicherweise auch: »weil die Rinder sie entgleiten ließen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: Tenne
  rationale: Das Substantiv bezeichnet den festen Platz, an dem Getreide gedroschen wurde; »Tenne« ist dafür die übliche knappe deutsche Entsprechung.
- source_word: נָכוֹן
  choice: Nachons
  rationale: Die Form wird hier am natürlichsten als Eigenname verstanden. Die mögliche adjektivische Deutung wird wegen der echten lexikalischen Mehrdeutigkeit in einer Fußnote bewahrt.
- source_word: וַיִּשְׁלַח
  choice: streckte ... seine Hand ... aus
  rationale: Im Zusammenhang mit dem folgenden Ergreifen bezeichnet שׁלח das Ausstrecken der implizierten Hand. Im Deutschen wird die Hand zur natürlichen und klaren Wiedergabe ausdrücklich genannt.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: Lade Gottes
  rationale: Die vollständige hebräische Wortverbindung wird beibehalten; »Lade Gottes« ist die etablierte, verständliche Bezeichnung.
- source_word: וַיֹּאחֶז בּוֹ
  choice: hielt sie fest
  rationale: אחז bedeutet ergreifen oder festhalten. »Hielt sie fest« passt natürlich zur Bewegung des Ausstreckens und vermeidet eine unnötig gewaltsame Nuance.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für Usas Handlung an. »Denn« gibt diesen Zusammenhang in würdigem, natürlichem Erzähldeutsch wieder.
- source_word: שָׁמְטוּ
  choice: waren gestrauchelt
  rationale: Das Verb kann ein Ausgleiten, Fallenlassen oder Entgleiten bezeichnen. Mit den Rindern als Subjekt wahrt »waren gestrauchelt« die wahrscheinlichste Lesart, ohne die genauen Abläufe zu bestimmen.
- source_word: הַבָּקָר
  choice: die Rinder
  rationale: בקר bezeichnet Rinder beziehungsweise Zugrinder. »Rinder« ist im modernen Standarddeutsch natürlicher als »Ochsen« und legt das Geschlecht nicht stärker fest als der Ausgangstext.
theological_decisions:
- issue: Grund für Usas Eingreifen
  choice: Usa griff ein, weil die Rinder gestrauchelt waren.
  alternative: Die Rinder ließen die Lade entgleiten oder brachten sie ins Wanken.
  rationale: Der hebräische Text nennt die Rinder als Subjekt eines mehrdeutigen Verbs. Die Übersetzung wahrt die unmittelbare Ursache, ohne ausdrücklich zu behaupten, die Lade sei bereits gefallen oder umgekippt.
translation_notes:
  register: Modernes, würdiges Erzähldeutsch. Der Satz folgt der knappen hebräischen Handlungsfolge. »Usa« entspricht der im Deutschen geläufigen Form; die Mehrdeutigkeit des Ortsnamens und des Verbs שׁמט wird in Fußnoten offengehalten.
