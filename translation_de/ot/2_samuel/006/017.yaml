base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/017.yaml
  text: They brought in the ark of Yahweh and set it in its place[a], inside the tent that David had pitched for it. And David offered burnt offerings and peace offerings before Yahweh.
translation:
  language: de
  text: Sie brachten die Lade Jahwes herein und stellten sie an ihren Platz, mitten im Zelt, das David für sie aufgeschlagen hatte. Dann brachte David vor Jahwe Brandopfer und Friedensopfer[a] dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Gemeinschaftsopfer; auch: Heilsopfer beziehungsweise Opfer des Wohlergehens. Das hebräische Wort שְׁלָמִים umfasst Frieden, Wohlergehen und Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: אֲרוֹן bezeichnet hier die heilige Lade; der Genitiv gibt die Zugehörigkeit zu Jahwe natürlich und präzise wieder.
- source_word: וַיָּבִאוּ
  choice: Sie brachten ... herein
  rationale: Der Hifil von בוא bezeichnet das Hineinbringen der Lade an den vorbereiteten Ort.
- source_word: וַיַּצִּגוּ אֹתוֹ בִּמְקוֹמוֹ
  choice: und stellten sie an ihren Platz
  rationale: יצג bedeutet hier, etwas gezielt an seinem vorgesehenen Ort aufzustellen.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: mitten in das Zelt
  rationale: בְּתוֹךְ bezeichnet die Lage im Inneren; zusammen mit dem Bewegungsvorgang ist im Deutschen der Akkusativ natürlich.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִד
  choice: das David für sie aufgeschlagen hatte
  rationale: נטה wird bei einem Zelt idiomatisch mit „aufschlagen“ wiedergegeben; לוֹ bezieht sich auf die Lade, die im Deutschen feminin ist.
- source_word: וַיַּעַל דָּוִד
  choice: Dann brachte David ... dar
  rationale: עלה bezeichnet im Opferkontext das Darbringen von Opfern; „dann“ bildet den erzählerischen Fortgang natürlich ab.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: Brandopfer ist die etablierte deutsche Bezeichnung für עֹלָה, ein vollständig auf dem Altar verbranntes Opfer.
- source_word: שְׁלָמִים
  choice: Friedensopfer
  rationale: Die traditionelle Wiedergabe ist verständlich und bewahrt den Zusammenhang des Begriffs mit Frieden, Wohlergehen und Gemeinschaft; alternative Nuancen werden in der Fußnote genannt.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet „vor“ beziehungsweise „in der Gegenwart von“; die knappe Form passt zum Opferkontext.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer oder Heilsopfer
  rationale: Keine einzelne deutsche Bezeichnung erfasst den gesamten Bedeutungsumfang. Der Haupttext verwendet den geläufigen Ausdruck, während die Fußnote die möglichen Nuancen offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Der Gottesname wird als „Jahwe“ wiedergegeben. Die kultischen Fachbegriffe bleiben erkennbar; die Mehrdeutigkeit von שְׁלָמִים wird nicht im Haupttext eingeengt, sondern durch eine Fußnote transparent gemacht.
