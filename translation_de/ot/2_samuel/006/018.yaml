source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔ד מֵ/הַעֲל֥וֹת הָ/עוֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֣רֶךְ אֶת הָ/עָ֔ם בְּ/שֵׁ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/018.yaml
  text: When David had finished offering the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh of hosts.
translation:
  language: de
  text: Nachdem David das Brandopfer und die Friedensopfer dargebracht hatte, segnete er das Volk im Namen Jahwes der Heerscharen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe der Heere“. Traditionell wird der Gottesname auch mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: Nachdem … dargebracht hatte
  rationale: Die Form bezeichnet den Abschluss der Opferhandlung vor der anschließenden Segnung. Die deutsche Nachdem-Konstruktion gibt diese zeitliche Abfolge natürlich wieder.
- source_word: מֵהַעֲלוֹת
  choice: dargebracht
  rationale: Der Hifil-Infinitiv von עלה bezeichnet im Opferkontext das Hinaufbringen beziehungsweise Darbringen eines Opfers. „Dargebracht“ ist im Deutschen präzise und idiomatisch.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: עֹלָה ist die übliche Bezeichnung für ein Opfer, das auf dem Altar vollständig verbrannt wird. Der Singular des Hebräischen bleibt erhalten.
- source_word: וְהַשְּׁלָמִים
  choice: und die Friedensopfer
  rationale: שְׁלָמִים bezeichnet Gemeinschafts- oder Heilsopfer. „Friedensopfer“ bewahrt den Bezug zum Wortfeld von Frieden und Wohlergehen und ist als Opferbezeichnung verständlich; andere Wiedergaben bleiben möglich.
- source_word: וַיְבָרֶךְ
  choice: segnete er
  rationale: ברך bedeutet hier schlicht „segnen“; eine erläuternde Erweiterung ist nicht erforderlich.
- source_word: אֶת־הָעָם
  choice: das Volk
  rationale: עָם meint die versammelte Volksgemeinschaft. „Das Volk“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: בְּשֵׁם
  choice: im Namen
  rationale: Die Wendung bezeichnet den Namen, unter dessen Autorität beziehungsweise Anrufung der Segen ausgesprochen wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: צְבָאוֹת kann Heere oder Scharen bezeichnen. „Heerscharen“ wahrt die traditionelle Weite des Ausdrucks, ohne ihn ausschließlich auf irdische Armeen festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den Eigennamen verwendet, wird er auch im Haupttext als Name wiedergegeben. Die traditionelle Ersetzung durch „der HERR“ bleibt als bekannte Alternative unübernommen.
- issue: Bedeutungsumfang des Titels יהוה צבאות
  choice: Jahwe der Heerscharen
  alternative: Jahwe der Heere
  rationale: „Heerscharen“ lässt offen, ob irdische, himmlische oder umfassend unter Gottes Befehl stehende Mächte gemeint sind. „Heere“ ist sprachlich direkter, kann aber enger militärisch verstanden werden.
- issue: Wiedergabe von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer
  rationale: Der hebräische Begriff verbindet die Opferart mit dem Wortfeld von Frieden, Heil und Wohlergehen, umfasst aber auch Gemeinschaft. „Friedensopfer“ hält diese Spannung sichtbar; „Gemeinschaftsopfer“ hebt stärker die gemeinsame Mahlgemeinschaft hervor.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter biblischer Opferterminologie. Die Satzstruktur ist flüssig, bleibt aber eng an der hebräischen Abfolge von abgeschlossener Opferhandlung und anschließender Segnung. Der Fußnotenmarker steht unmittelbar beim erklärten Gottestitel.
