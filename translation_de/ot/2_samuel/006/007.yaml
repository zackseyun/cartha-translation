  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔ה וַ/יַּכֵּ֥/הוּ שָׁ֛ם הָ/אֱלֹהִ֖ים עַל הַ/שַּׁ֑ל וַ/יָּ֣מָת שָׁ֔ם עִ֖ם אֲר֥וֹן הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/007.yaml
  text: And the anger of Yahweh burned against Uzzah[a], and God struck him there for the error, and he died there beside the ark of God.
translation:
  language: de
  text: Da entbrannte Jahwes Zorn über Usa, und Gott schlug ihn dort wegen des Fehlers[a], und er starb dort neben der Lade Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „wegen eines Vergehens“, „wegen seiner unbesonnenen Tat“ oder möglicherweise „weil er seine Hand ausstreckte“. Die hebräische Wendung ist schwer verständlich und wird unterschiedlich gedeutet.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Da entbrannte … Zorn
  rationale: Die hebräische Wendung beschreibt bildhaft ein Entbrennen des Zorns. „Da entbrannte … Zorn“ bewahrt dieses Bild in natürlichem, würdigem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּעֻזָּה
  choice: über Usa
  rationale: Die Präposition bezeichnet bei חרה אף den Gegenstand des Zorns; „Jahwes Zorn über Usa“ ist idiomatisches Deutsch.
- source_word: וַיַּכֵּהוּ
  choice: Gott schlug ihn
  rationale: נכה bedeutet hier „schlagen“. Die schlichte Wiedergabe nimmt den tödlichen Ausgang nicht vorweg, da dieser anschließend ausdrücklich berichtet wird.
- source_word: שָׁם
  choice: dort
  rationale: Das zweimalige „dort“ wird beibehalten, um die örtliche Betonung des hebräischen Erzähltextes zu bewahren.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der hebräische Text wechselt vom Gottesnamen zu אֱלֹהִים; diese Variation bleibt in der Übersetzung erhalten.
- source_word: עַל הַשַּׁל
  choice: wegen dieses Vergehens
  rationale: שַׁל ist ein seltenes und schwer verständliches Wort. „Vergehen“ bezeichnet eine schuldhafte Tat, ohne die genaue Art des Fehlverhaltens stärker festzulegen, als es der unsichere hebräische Ausdruck erlaubt.
- source_word: וַיָּמָת
  choice: und er starb
  rationale: Die einfache Erzählfolge wird unmittelbar und ohne zusätzliche kausale Deutung wiedergegeben.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: neben der Lade Gottes
  rationale: עִם bedeutet grundsätzlich „mit“, bezeichnet hier aber räumliche Nähe. „Neben“ ist im Deutschen klar und natürlich.
theological_decisions:
- issue: Ursache von Usas Tod in der schwer verständlichen Wendung עַל הַשַּׁל
  choice: wegen dieses Vergehens
  alternative: wegen des Fehlers; wegen seiner unbesonnenen Tat; möglicherweise weil er seine Hand ausstreckte
  rationale: Das seltene Wort שַׁל lässt verschiedene Deutungen zu. Der Haupttext benennt eine schuldhafte Tat, ohne sie als Irrtum, Respektlosigkeit oder konkrete Handbewegung festzulegen; die Alternativen werden transparent in der Fußnote genannt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Die Satzstruktur bewahrt die fortlaufende hebräische Erzählweise und die zweimalige Ortsangabe „dort“. Der seltene Ausdruck עַל הַשַּׁל wird bewusst nicht überpräzisiert.
