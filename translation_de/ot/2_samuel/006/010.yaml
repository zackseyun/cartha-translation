  text: וְ/לֹֽא אָבָ֣ה דָוִ֗ד לְ/הָסִ֥יר אֵלָ֛י/ו אֶת אֲר֥וֹן יְהוָ֖ה עַל עִ֣יר דָּוִ֑ד וַ/יַּטֵּ֣/הוּ דָוִ֔ד בֵּ֥ית עֹבֵֽד אֱד֖וֹם הַ/גִּתִּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/010.yaml
  text: So David was not willing to bring the ark of Yahweh to himself into the City of David[b][a], but David turned it aside to the house of Obed-edom the Gittite.
translation:
  language: de
  text: David war jedoch nicht bereit, die Lade Jahwes zu sich in die Stadt Davids hinaufzubringen[a], sondern David lenkte sie zum Haus Obed-Edoms, des Gatiters[b], um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Lade Jahwes zu sich in die Stadt Davids zu bringen“. Die Präposition kann sowohl eine Bewegung hinauf oder auf ein Ziel zu als auch lediglich die Zielrichtung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: ein Mann aus Gat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: war nicht bereit
  rationale: Das Verb bezeichnet Bereitschaft oder Einwilligung. Die Wendung gibt Davids ablehnende Entscheidung wieder, ohne sie unnötig als ausdrückliche Verweigerung zu verschärfen.
- source_word: לְהָסִיר אֵלָיו
  choice: zu sich ... hinaufzubringen
  rationale: הֵסִיר bedeutet grundsätzlich „entfernen/wegbringen“, bezeichnet hier aber im Zusammenhang die beabsichtigte Überführung der Lade zu David; „zu sich bringen“ ist im Deutschen idiomatisch.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: Die Status-constructus-Verbindung wird natürlich wiedergegeben; „Jahwe“ bildet den im hebräischen Text stehenden Gottesnamen ab.
- source_word: עַל עִיר דָוִד
  choice: in die Stadt Davids hinauf
  rationale: עַל kann hier eine Bewegung hinauf beziehungsweise auf ein Ziel zu ausdrücken. „Hinauf“ bewahrt die topografische Bewegungsrichtung, „in“ macht das Ziel deutlich.
- source_word: וַיַּטֵּהוּ
  choice: ließ ... abbiegen
  rationale: Die Hifil-Form von נטה bezeichnet hier das Umlenken der Lade auf ein anderes Ziel. Die kausative deutsche Formulierung wahrt diese Bedeutung.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: zum Haus Obed-Edoms
  rationale: בַּיִת bezeichnet hier am ehesten das konkrete Haus, in dem die Lade untergebracht wurde; „Haushalt“ bleibt als weitere Bedeutungsnuance möglich.
- source_word: הַגִּתִּי
  choice: des Gatiters
  rationale: Das Gentiliz bezeichnet einen Mann aus Gat. „Gatiter“ ist die konventionelle, knappe deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzgliederung mit „Stattdessen“ verdeutlicht den Gegensatz, ohne zusätzliche Sachinformation einzuführen. „Lade“ folgt dem etablierten biblischen Sprachgebrauch; „Gatiter“ bewahrt die Herkunftsbezeichnung.
