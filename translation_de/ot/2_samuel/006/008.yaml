  text: וַ/יִּ֣חַר לְ/דָוִ֔ד עַל֩ אֲשֶׁ֨ר פָּרַ֧ץ יְהוָ֛ה פֶּ֖רֶץ בְּ/עֻזָּ֑ה וַ/יִּקְרָ֞א לַ/מָּק֤וֹם הַ/הוּא֙ פֶּ֣רֶץ עֻזָּ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/008.yaml
  text: And David was angry because Yahweh had broken out against Uzzah[a], and he called that place Perez-uzzah to this day.
translation:
  language: de
  text: David wurde zornig, weil Jahwe gegen Usa losgebrochen war.[a] Und er nannte jenen Ort Perez-Usa; so heißt er bis auf den heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Perez-Usa“ klingt wie „Ausbruch gegen Usa“. Der Ortsname spielt auf das hebräische Wortspiel an: Jahwe war gegen Usa „losgebrochen“.'
    reason: Das Deutsche kann die Verbindung zwischen dem Verb פרץ, dem stammverwandten Substantiv und dem Ortsnamen Perez-Usa nicht vollständig wiedergeben.
lexical_decisions:
- source_word: וַיִּחַר לְדָוִד
  choice: David aber wurde zornig
  rationale: Die hebräische Wendung mit חרה bezeichnet aufflammenden Zorn. „Wurde zornig“ ist natürliches, gegenwärtiges Deutsch und bewahrt den emotionalen Nachdruck.
- source_word: פָּרַץ יְהוָה פֶּרֶץ בְּעֻזָּה
  choice: weil Jahwe gegen Usa losgebrochen war
  rationale: Verb und stammverwandtes Substantiv פרץ schildern einen plötzlichen, zerstörerischen Ausbruch. Eine wörtliche Doppelung wie „einen Durchbruch durchbrach“ wäre im Deutschen unverständlich; „losgebrochen“ erhält das kraftvolle Bild, während die Fußnote das Wortspiel erklärt. בְּ wird im Zusammenhang feindlich als „gegen“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: Darum nannte er jenen Ort
  rationale: Die Namensgebungsformel wird idiomatisch mit „nannte“ wiedergegeben. „Darum“ macht den im Zusammenhang liegenden Bezug der Benennung auf das Ereignis deutlich, ohne eine zusätzliche Ursache einzuführen.
- source_word: פֶּרֶץ עֻזָּה
  choice: Perez-Usa
  rationale: Der Ortsname wird transliteriert; seine Verbindung zur Wurzel פרץ und damit zum vorangehenden Geschehen wird in der Fußnote erläutert.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Dies ist eine geläufige, würdige deutsche Entsprechung der hebräischen Zeitformel.
theological_decisions:
- issue: Unmittelbarkeit des göttlichen Gerichtshandelns
  choice: Jahwe war gegen Usa losgebrochen
  alternative: Usas Tod war eine Folge seines Handelns
  rationale: Der hebräische Text stellt das Geschehen ausdrücklich als unmittelbares Handeln Jahwes dar. Die Übersetzung schwächt diese Aussage weder zu einer bloßen Folge noch zu einem Unfall ab.
- issue: Mehrdeutigkeit von Davids Zorn
  choice: Das Ziel seines Zorns bleibt unausgesprochen
  alternative: David war auf Jahwe zornig
  rationale: לְדָוִד bezeichnet David als den Zornigen, nennt aber das Objekt seines Zorns nicht ausdrücklich. Die deutsche Fassung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jahwe“ bewahrt den Gottesnamen; „losbrechen“ vermittelt die heftige Bildsprache. Der leicht feierliche Ausdruck „bis auf den heutigen Tag“ entspricht der biblischen Namensüberlieferungsformel.
