base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/022.yaml
  text: And I will make myself even more contemptible than this[a], and I will be lowly in my own eyes; but with the servant girls of whom you have spoken, with them I will be honored.
translation:
  language: de
  text: Und ich will mich noch geringer machen als das und in meinen eigenen Augen niedrig sein; doch bei den Sklavinnen[a], von denen du gesprochen hast – bei ihnen werde ich geehrt sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dienerinnen“ beziehungsweise „Mägde“. Das hebräische Wort bezeichnet Frauen in niedrigem, gewöhnlich unfreien häuslichen Status.'
    reason: lexikalische Alternative und sozialgeschichtliche Präzisierung
lexical_decisions:
- source_word: וּנְקַלֹּתִי
  choice: Und ich will mich noch geringer machen
  rationale: Das Nifal von קלל bezeichnet hier ein Geringwerden beziehungsweise ein Sich-gering-Machen. Die reflexive deutsche Formulierung passt zu Davids bewusstem Sich-Erniedrigen und erhält den Gegensatz zum späteren Geehrtwerden.
- source_word: עוֹד מִזֹּאת
  choice: noch geringer … als diesmal
  rationale: עוֹד verstärkt, während מִזֹּאת den Vergleich mit dem soeben beanstandeten Verhalten Davids ausdrückt. „Als diesmal“ ist im Deutschen natürlich und bezieht sich klar auf den konkreten Anlass.
- source_word: וְהָיִיתִי שָׁפָל בְּעֵינָי
  choice: und in meinen eigenen Augen niedrig sein
  rationale: שָׁפָל bedeutet niedrig oder gering. Die Formulierung bewahrt die soziale und wertende Bildsprache sowie die hebräische Wendung „in meinen Augen“, ohne sie vorschnell als moralische Demut auszulegen.
- source_word: הָאֲמָהוֹת
  choice: die Sklavinnen
  rationale: אָמָה bezeichnet eine weibliche Person in unfreier beziehungsweise sehr niedriger häuslicher Stellung. „Sklavinnen“ macht den im Zusammenhang wichtigen Rangunterschied deutlicher als das mildere „Dienerinnen“.
- source_word: אֲשֶׁר אָמַרְתְּ
  choice: von denen du gesprochen hast
  rationale: Die Relativkonstruktion verweist unmittelbar auf die von Michal zuvor erwähnten Frauen und lässt sich so sachlich und natürlich wiedergeben.
- source_word: עִמָּם
  choice: bei ihnen
  rationale: עִם kann hier den sozialen Kreis bezeichnen, in dem David Anerkennung findet. „Bei ihnen“ bewahrt diesen Bezug besser als eine eindeutige Festlegung auf die handelnde Urheberschaft „von ihnen“.
- source_word: אִכָּבֵדָה
  choice: werde ich geehrt sein
  rationale: Das Nifal von כבד bezeichnet das Geehrt- oder Angesehenwerden. Die Wiedergabe erhält den ausdrücklichen Gegensatz zwischen Niedrigkeit und Ehre und vermeidet das im Deutschen stärker theologisch gefärbte „verherrlicht“.
theological_decisions:
- issue: Sozialstatus von אָמָהוֹת
  choice: Im Haupttext „Sklavinnen“
  alternative: „Dienerinnen“ oder „Mägde“
  rationale: Der Vers arbeitet mit einem Rang- und Ehrgegensatz. „Sklavinnen“ gibt den niedrigen und wahrscheinlich unfreien sozialen Status deutlich wieder; die Fußnote nennt geläufigere, aber weniger präzise Alternativen.
- issue: Urheber der Ehre bei עִמָּם אִכָּבֵדָה
  choice: „bei ihnen werde ich geehrt sein“
  alternative: „von ihnen werde ich geehrt werden“
  rationale: Die Präposition עִם bedeutet zunächst „mit/bei“. Die Übersetzung wahrt die mögliche Bedeutung des sozialen Umfelds und legt nicht zwingend fest, dass die Frauen selbst die handelnden Urheber der Ehrung sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Kontrast zwischen Selbsterniedrigung und Ehre; „niedrig in meinen eigenen Augen“ bewahrt die offene Wertungs- und Ehrsprache des Ausgangstextes.
