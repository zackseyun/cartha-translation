  terminology: „Jahwe“, „Lade Gottes“, „Haus Obed-Edoms“ und „Stadt Davids“ sind sachgerecht. Die Fußnote erläutert den hebräischen Gottesnamen und die traditionelle Ersatzwiedergabe angemessen.
