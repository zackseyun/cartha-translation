  text: וַ/יֻּגַּ֗ד לַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ בֵּרַ֣ךְ יְהוָ֗ה אֶת בֵּ֨ית עֹבֵ֤ד אֱדֹם֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ בַּ/עֲב֖וּר אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יַּעַל֩ אֶת אֲר֨וֹן הָ/אֱלֹהִ֜ים מִ/בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם עִ֥יר דָּוִ֖ד בְּ/שִׂמְחָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/012.yaml
  text: And it was reported to King David[a], saying, “Yahweh has blessed the house of Obed-edom and all that belongs to him because of the ark of God.” So David went and brought up the ark of God from the house of Obed-edom to the city of David with rejoicing.
translation:
  language: de
  text: 'Dem König David wurde berichtet: „Jahwe[a] hat das Haus Obed-Edoms und alles, was ihm gehört, wegen der Lade Gottes gesegnet.“ Da ging David hin und brachte die Lade Gottes aus dem Haus Obed-Edoms mit Freude hinauf in die Stadt Davids.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell auch mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: wurde berichtet
  rationale: Das unpersönliche Passiv des Hofal wird bewahrt, ohne einen Überbringer der Nachricht hinzuzufügen.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: König David
  rationale: Titel und Eigenname werden in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: בֵּרַךְ יְהוָה
  choice: Jahwe hat … gesegnet
  rationale: Das Perfekt bezeichnet eine vollzogene Segnung, deren Wirkung für die berichtete Situation fortbesteht; das deutsche Perfekt passt zum mündlich wiedergegebenen Bericht.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: das Haus Obed-Edoms
  rationale: „Haus“ wahrt die konkrete Ausdrucksweise und kann zugleich Haushalt, Familie und Besitz umfassen.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: und alles, was ihm gehört
  rationale: Eine natürliche, umfassende Wiedergabe, die den Bezug auf Besitz und Hausverband offenlässt.
- source_word: בַּעֲבוּר
  choice: wegen
  rationale: Die Präposition drückt hier den ursächlichen Zusammenhang zwischen der Gegenwart der Lade und dem Segen aus.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Die etablierte und genaue deutsche Bezeichnung für den heiligen Kultgegenstand.
- source_word: וַיֵּלֶךְ דָּוִד
  choice: Da ging David hin
  rationale: „Da“ führt Davids Reaktion auf die Nachricht natürlich fort, ohne den kausalen Zusammenhang stärker festzulegen als der hebräische Erzählanschluss.
- source_word: וַיַּעַל אֶת אֲרוֹן הָאֱלֹהִים
  choice: brachte die Lade Gottes … hinauf
  rationale: Die kausative Bedeutung und die Aufwärtsbewegung nach Jerusalem werden erhalten.
- source_word: בְּשִׂמְחָה
  choice: unter Freudenjubel
  rationale: Gibt die freudige Begleitung des Hinaufbringens würdig und anschaulich wieder, ohne einen ausdrücklich genannten Akteur des Jubels zu ergänzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder; die traditionelle deutsche Ersatzlesung „der HERR“ wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Lade Gottes“ und „Haus Obed-Edoms“ folgt bewusst der hebräischen Erzählweise. Der Satzbau bleibt gut verständlich, wahrt aber das unpersönliche Passiv des Ausgangstextes.
