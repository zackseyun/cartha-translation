  source_fidelity: 'Der Entwurf gibt die wesentlichen Aussagen des hebräischen Textes zuverlässig wieder: die unpersönliche Nachrichtenübermittlung, den Segen über Obed-Edoms Haus und gesamten Besitzbereich, dessen Ursache in der Lade Gottes sowie Davids Hinaufbringen der Lade in die Stadt Davids. „Unter Freudenjubel“ ist jedoch gegenüber בְּשִׂמְחָה („mit/in Freude“) leicht verstärkend.'
