base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/003.yaml
  text: They set the ark of God on a new cart and brought it from the house of Abinadab[a], which was on the hill; and Uzzah and Ahio, the sons of Abinadab, were driving the new cart.
translation:
  language: de
  text: Sie setzten die Lade Gottes auf einen neuen Wagen und brachten sie aus dem Haus Abinadabs, das auf dem Hügel lag. Usa und Achjo, die Söhne Abinadabs, lenkten den neuen Wagen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: Sie setzten … auf
  rationale: Die Kausativform von רכב bezeichnet hier das Aufsetzen beziehungsweise Aufladen auf ein Fahrzeug; die gewählte Formulierung ist im Deutschen konkret und natürlich.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: „Lade“ ist die im deutschen Bibelsprachgebrauch verständliche und etablierte Bezeichnung für das hier gemeinte heilige Behältnis.
- source_word: אֶל עֲגָלָה חֲדָשָׁה
  choice: auf einen neuen Wagen
  rationale: אֶל bezeichnet hier die Bewegung auf das Fahrzeug; „Wagen“ gibt עֲגָלָה in diesem Zusammenhang idiomatisch wieder.
- source_word: וַיִּשָּׂאֻהוּ
  choice: brachten sie
  rationale: נשא kann „heben“, „tragen“ oder „fortbringen“ bedeuten. Da die Lade auf dem Wagen steht, vermeidet „brachten sie“ den missverständlichen Eindruck, sie sei von Menschen getragen worden.
- source_word: מִבֵּית אֲבִינָדָב
  choice: aus dem Haus Abinadabs
  rationale: Natürliche deutsche Wiedergabe der hebräischen Genitivverbindung.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: das auf dem Hügel lag
  rationale: Die Artikelform legt zunächst eine topografische Beschreibung nahe; die mögliche Deutung als Ortsname bleibt in der Fußnote erhalten.
- source_word: וְעֻזָּא וְאַחְיוֹ
  choice: Usa und Achjo
  rationale: Die Personennamen werden in einer geläufigen deutschen Transkription wiedergegeben.
- source_word: בְּנֵי אֲבִינָדָב
  choice: die Söhne Abinadabs
  rationale: בְּנֵי bezeichnet im Erzählzusammenhang am naheliegendsten leibliche Söhne.
- source_word: נֹהֲגִים
  choice: lenkten
  rationale: Das Partizip von נהג bezeichnet das Führen beziehungsweise Lenken; mit dem Wagen als Objekt ist „lenkten“ im Deutschen präzise und vermeidet die moderne Assoziation eines motorisierten Fahrzeugs bei „fuhren“.
- source_word: הָעֲגָלָה חֲדָשָׁה
  choice: den neuen Wagen
  rationale: Die Wiederholung des Ausdrucks im Hebräischen wird aus Gründen der Erzählstruktur und lexikalischen Einheitlichkeit beibehalten.
