base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/014.yaml
  text: And David was dancing with all his might before Yahweh[b][a], and David was wearing a linen ephod.
translation:
  language: de
  text: David tanzte[a] mit aller Kraft vor Jahwe und trug dabei ein leinenes Efod[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wirbelte umher“; das hebräische Wort beschreibt eine lebhafte, feierliche Bewegung.'
    reason: lexical_alternative
  - marker: b
    text: Ein Efod war ein besonderes israelitisches Kultgewand; hier bestand es aus Leinen.
    reason: cultural_note
lexical_decisions:
- source_word: מְכַרְכֵּר
  choice: tanzte
  rationale: Das Partizip bezeichnet hier eine lebhafte, feierliche Körperbewegung. „Tanzte“ ist im Deutschen natürlich und verständlich, ohne die Bewegung unnötig auf Wirbeln oder Springen festzulegen.
- source_word: בְּכָל עֹז
  choice: mit aller Kraft
  rationale: Die Wendung beschreibt vollen körperlichen Einsatz und wird durch die geläufige deutsche Formulierung prägnant wiedergegeben.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet „vor“ beziehungsweise „in der Gegenwart von“; „vor Jahwe“ bewahrt die knappe Ausdrucksweise des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als persönlicher Name transliteriert und nicht durch einen Titel ersetzt.
- source_word: חָגוּר
  choice: trug dabei
  rationale: Die Form beschreibt David als mit dem Kleidungsstück gegürtet beziehungsweise bekleidet. „Trug dabei“ ist natürliches modernes Deutsch und verbindet die gleichzeitigen Handlungen klar.
- source_word: אֵפוֹד
  choice: Efod
  rationale: Das Efod ist ein spezifisches israelitisches Kultgewand ohne genaue deutsche Entsprechung; die eingedeutschte Transliteration bewahrt den Fachbegriff.
- source_word: בָּד
  choice: leinenes
  rationale: בָּד bezeichnet hier das Material Leinen; das Adjektiv gibt dies knapp und ohne zusätzliche Qualitätsangabe wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Funktion des Efods
  choice: Efod als Kultgewand benennen, ohne David ausdrücklich als Priester zu bezeichnen
  alternative: Priestergewand
  rationale: Der Text nennt das Kleidungsstück, zieht aber an dieser Stelle keine ausdrückliche Folgerung über Davids Amt. Die Transliteration vermeidet eine theologische Überbestimmung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt flüssig und bewahrt zugleich die beiden Aussagen des hebräischen Verses. Fachbegriffe und der Gottesname werden transparent wiedergegeben.
