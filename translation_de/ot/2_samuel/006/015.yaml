  text: וְ/דָוִד֙ וְ/כָל בֵּ֣ית יִשְׂרָאֵ֔ל מַעֲלִ֖ים אֶת אֲר֣וֹן יְהוָ֑ה בִּ/תְרוּעָ֖ה וּ/בְ/ק֥וֹל שׁוֹפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/015.yaml
  text: So David and all the house of Israel were bringing up the ark of Yahweh with shouting and with the sound of the horn[a][b].
translation:
  language: de
  text: So brachten David und das ganze Haus Israel die Lade Jahwes unter Jubelrufen[a] und unter dem Schall des Schofars[b] hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter lautem Zuruf«. Das hebräische Wort kann einen Jubelruf, eine festliche Akklamation oder einen Signalruf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »unter dem Klang des Horns«. Ein Schofar ist ein Blasinstrument aus einem Tierhorn, häufig einem Widderhorn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: brachten … hinauf
  rationale: Das Hifil-Partizip bezeichnet hier im fortlaufenden Erzählzusammenhang die andauernde Handlung. Die deutsche Präteritalform mit trennbarem Verb gibt den narrativen Verlauf natürlich wieder; »hinauf« bewahrt zugleich die gerichtete Aufwärtsbewegung.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: das ganze Haus Israel
  rationale: Die wörtliche Wiedergabe erhält das korporative und familiäre Bild des hebräischen Ausdrucks. »Ganz Israel« wäre idiomatischer, würde dieses Bild aber einebnen.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: אֲרוֹן wird in diesem kultischen Zusammenhang traditionell und verständlich mit »Lade« wiedergegeben. Der Gottesname יְהוָה erscheint als »Jahwe«.
- source_word: תְרוּעָה
  choice: Jubelrufen
  rationale: Das Wort kann einen lauten Ruf, festlichen Jubel oder auch ein Signal bezeichnen. Da unmittelbar danach der Schofar genannt wird, bringt »Jubelrufe« hier wahrscheinlich den menschlichen, festlichen Zuruf zum Ausdruck, ohne die Bedeutungsbreite im Haupttext unnötig auszuweiten.
- source_word: קוֹל שׁוֹפָר
  choice: Schall des Schofars
  rationale: קוֹל bezeichnet den hörbaren Klang oder Schall; שׁוֹפָר ist das antike Horninstrument, gewöhnlich aus einem Tierhorn. »Schofar« vermeidet die moderne Vorstellung einer Metalltrompete und ist im Deutschen als Sachbegriff etabliert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Bundesnamen erkennbar wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Haus Israel« bleibt als biblisch-korporative Wendung erhalten; »Schofar« wird wegen seiner sachlichen Genauigkeit verwendet und in der Fußnote erklärt.
