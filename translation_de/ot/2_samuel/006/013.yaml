source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ֧י צָעֲד֛וּ נֹשְׂאֵ֥י אֲרוֹן יְהוָ֖ה שִׁשָּׁ֣ה צְעָדִ֑ים וַ/יִּזְבַּ֥ח שׁ֖וֹר וּ/מְרִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/013.yaml
  text: And when those carrying the ark of Yahweh had gone six steps[b][a], he sacrificed an ox and a fattened calf.
translation:
  language: de
  text: Als die Träger der Lade Yahwehs sechs Schritte gegangen waren, opferte er ein Rind und ein gemästetes Tier.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein Mastkalb. Das hebräische Wort bezeichnet allgemein ein gemästetes Tier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Yahwehs
  rationale: אֲרוֹן bezeichnet hier die heilige Lade; der Gottesname יְהוָה wird als »Yahweh« wiedergegeben.
- source_word: וַיְהִי כִּי
  choice: Und als
  rationale: Die Konstruktion leitet in der Erzählung einen zeitlichen Umstand ein; »Und als« ist im Deutschen natürlich und wahrt den Erzählfluss.
- source_word: נֹשְׂאֵי
  choice: die Träger
  rationale: Das Partizip bezeichnet diejenigen, die die Lade tragen. »Die Träger« ist knapp, klar und sachlich.
- source_word: צָעֲדוּ ... שִׁשָּׁה צְעָדִים
  choice: sechs Schritte gegangen waren
  rationale: Die Wortverbindung beschreibt ein Voranschreiten um sechs Schritte; die vorzeitige deutsche Form gibt das Verhältnis zur anschließenden Opferhandlung natürlich wieder.
- source_word: וַיִּזְבַּח
  choice: opferte er
  rationale: Das Verb bezeichnet das Schlachten beziehungsweise Darbringen eines Opfers. Das hebräische Subjekt bleibt unausgesprochen; das Pronomen »er« bewahrt diese kontextuelle Bezugnahme.
- source_word: שׁוֹר
  choice: einen Stier
  rationale: שׁוֹר bezeichnet ein Rind, hier im Opferzusammenhang wahrscheinlich einen männlichen Stier.
- source_word: מְרִיא
  choice: ein gemästetes Tier
  rationale: Das Wort bezeichnet allgemein ein gemästetes Tier und legt die Tierart nicht ausdrücklich fest; die Übersetzung vermeidet daher eine unbegründete Präzisierung zu »Kalb«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יְהוָה. »Yahweh« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des unausgesprochenen Subjekts von וַיִּזְבַּח
  choice: er
  alternative: David
  rationale: Der Kontext legt David als Handelnden nahe, doch der Vers nennt ihn an dieser Stelle nicht ausdrücklich. Das Pronomen wahrt die Form und die leichte Bezugsoffenheit des Hebräischen.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die feste kultische Bezeichnung »Lade« bleibt erhalten. Die Formulierung ist bewusst knapp und bewahrt sowohl das unausgesprochene Subjekt als auch die lexikalische Breite von מְרִיא.
