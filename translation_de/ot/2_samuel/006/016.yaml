source:
  edition: WLC
  text: וְ/הָיָה֙ אֲר֣וֹן יְהוָ֔ה בָּ֖א עִ֣יר דָּוִ֑ד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִד֙ מְפַזֵּ֤ז וּ/מְכַרְכֵּר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/016.yaml
  text: As the ark of Yahweh was coming into the city of David[a], Michal daughter of Saul looked out through the window and saw King David leaping and whirling before Yahweh, and she despised him in her heart.
translation:
  language: de
  text: Als die Lade Jahwes in die Stadt Davids kam, schaute Michal, die Tochter Sauls, durch das Fenster hinaus. Sie sah König David vor Jahwe springen und wirbeln[a], und sie verachtete ihn in ihrem Herzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden seltenen hebräischen Verben bezeichnen lebhafte, festliche Bewegungen; auch „hüpfen und sich im Kreis drehen“ ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... בָּא
  choice: Als ... kam
  rationale: Die hebräische Konstruktion eröffnet den zeitlichen Rahmen der Szene. „Als … kam“ gibt diesen im heutigen Deutsch natürlich wieder, ohne die Wendung unnötig mit „Und es geschah“ zu beschweren.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: Die Status-constructus-Verbindung wird direkt wiedergegeben; „Lade“ ist die etablierte deutsche Bezeichnung für das heilige Trageheiligtum.
- source_word: עִיר דָּוִד
  choice: die Stadt Davids
  rationale: Die feste Ortsbezeichnung wird als natürliche deutsche Genitivverbindung übersetzt.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Michal, die Tochter Sauls
  rationale: Die Apposition bleibt ausdrücklich erhalten, weil die Identifizierung Michals als Sauls Tochter im Erzählzusammenhang bedeutsam ist.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: schaute ... durch das Fenster hinaus
  rationale: Das Verb bezeichnet das Hinausschauen von einem umschlossenen oder erhöhten Ort; die Präposition wird räumlich mit „durch“ wiedergegeben, ohne eine Blickrichtung nach unten festzulegen.
- source_word: מְפַזֵּז וּמְכַרְכֵּר
  choice: springen und wirbeln
  rationale: Die beiden seltenen Verben schildern ausgelassene, körperlich lebhafte Bewegungen. Zwei verschiedene Bewegungsverben bewahren die anschauliche Doppelung besser als das allgemeinere „tanzen“.
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: sie verachtete ihn in ihrem Herzen
  rationale: Die wörtlich-nahe Formulierung bewahrt sowohl die starke innere Geringschätzung als auch deren zunächst unausgesprochenen Charakter.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bewertung von Davids Bewegung vor Jahwe
  choice: wertungsneutrale Beschreibung als „springen und wirbeln“
  alternative: „ausgelassen tanzen“ oder eine abwertende Bewegungsbeschreibung
  rationale: Der Erzähler beschreibt die Bewegung, während die Verachtung ausdrücklich Michal zugeschrieben wird. Die Übersetzung soll weder ihre negative Wertung übernehmen noch Davids Verhalten zusätzlich idealisieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung erhöht die Lesbarkeit, ohne die Abfolge oder den Zusammenhang des hebräischen Satzes zu verändern.
