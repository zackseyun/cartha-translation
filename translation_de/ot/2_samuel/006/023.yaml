  text: וּ/לְ/מִיכַל֙ בַּת שָׁא֔וּל לֹֽא הָ֥יָה לָ֖/הּ יָ֑לֶד עַ֖ד י֥וֹם מוֹתָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/023.yaml
  text: And Michal the daughter of Saul had no child until the day of her death[a].
translation:
  language: de
  text: Und Michal, die Tochter Sauls, hatte bis zum Tag ihres Todes kein Kind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keinen Nachkommen“; das hebräische Substantiv kann allgemein ein Kind bezeichnen, nicht notwendigerweise einen Sohn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִיכַל
  choice: Und Michal
  rationale: Die Verbindung aus Konjunktion und Präposition führt Michal idiomatisch als Satzgegenstand ein. „Und Michal“ bewahrt den Erzählanschluss und klingt im Deutschen natürlich.
- source_word: בַּת שָׁאוּל
  choice: die Tochter Sauls
  rationale: Die Status-constructus-Verbindung bezeichnet Michal nach ihrer Abstammung. Die Formulierung ist würdig, klar und eng am Hebräischen.
- source_word: לֹא הָיָה לָהּ
  choice: hatte … kein
  rationale: Der hebräische Ausdruck bezeichnet Besitz wörtlich als „es war ihr nicht“. Im Deutschen wird dies idiomatisch mit „hatte kein“ wiedergegeben.
- source_word: יָלֶד
  choice: Kind
  rationale: Das Substantiv kann hier allgemein ein Kind bezeichnen und muss nicht auf einen Sohn eingeengt werden. „Kind“ ist im Deutschen die natürlichste und sachlich offene Wiedergabe.
- source_word: עַד יוֹם מוֹתָהּ
  choice: bis zum Tag ihres Todes
  rationale: Die Übersetzung gibt die hebräische Zeitangabe eng, verständlich und ohne zusätzliche Deutung wieder.
theological_decisions:
- issue: Bedeutung der Kinderlosigkeit „bis zum Tag ihres Todes“
  choice: Die Zeitangabe wird wörtlich und geradlinig wiedergegeben; sie besagt, dass Michal ihr ganzes Leben kinderlos blieb.
  alternative: Die Wendung könnte freier mit „ihr Leben lang“ wiedergegeben werden.
  rationale: Die gewählte Form bewahrt sowohl die hebräische Ausdrucksweise als auch ihre Funktion, lebenslange Kinderlosigkeit festzustellen, ohne spekulative Folgerungen einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdigen Erzählstil. Die Satzstellung ist idiomatisch; die förmlichere Wendung „die Tochter Sauls“ bewahrt die ausdrückliche Herkunftsbezeichnung des Hebräischen.
