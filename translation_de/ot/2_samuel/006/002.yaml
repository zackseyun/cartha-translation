source:
  edition: WLC
  text: וַ/יָּ֣קָם וַ/יֵּ֣לֶךְ דָּוִ֗ד וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ מִֽ/בַּעֲלֵ֖י יְהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵ֚ת אֲר֣וֹן הָ/אֱלֹהִ֔ים אֲשֶׁר נִקְרָ֣א שֵׁ֗ם שֵׁ֣ם יְהוָ֧ה צְבָא֛וֹת יֹשֵׁ֥ב הַ/כְּרֻבִ֖ים עָלָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/002.yaml
  text: David arose and went[a], with all the people who were with him, from Baale-judah to bring up from there the ark of God, which is called by the Name, the name of Yahweh of Armies[d][c][b], who is enthroned above the cherubim.
translation:
  language: de
  text: 'David machte sich auf und zog mit dem ganzen Volk, das bei ihm war, von Baale-Juda[a] los, um von dort die Lade Gottes heraufzubringen, über der der Name genannt wird: der Name Jahwes der Heerscharen[b], der über den Kerubim thront[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von Baala in Juda«. Die hebräische Form ist ungewöhnlich und bezeichnet wahrscheinlich den Ort, der auch mit Kirjat-Jearim verbunden wird.'
    reason: alternative_reading
  - marker: b
    text: 'Die hebräische Namensformel ist verdichtet. Auch möglich: »über der der Name Jahwes der Heerscharen ausgerufen wird« oder »die nach dem Namen Jahwes der Heerscharen genannt wird«. Traditionell: »Jahwe Zebaot«; auch möglich: »Jahwe der Heere«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »der zwischen den Kerubim wohnt«. Die hebräische Wendung kann sowohl die Thronvorstellung als auch die räumliche Gegenwart bei den Kerubim ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: machte sich auf und zog … los
  rationale: Die beiden aufeinanderfolgenden Verben werden im Deutschen als natürlicher Aufbruchsausdruck wiedergegeben, ohne den Beginn und die anschließende Bewegung zusammenhanglos zu verdoppeln.
- source_word: וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: mit dem ganzen Volk, das bei ihm war
  rationale: Gibt sowohl die Begleitung Davids als auch den umfassenden Ausdruck כָל־הָעָם wieder.
- source_word: מִבַּעֲלֵי יְהוּדָה
  choice: von Baale-Juda
  rationale: Der Ausdruck wird im Zusammenhang am ehesten als Ortsname verstanden. Seine ungewöhnliche Form und die mögliche Identifikation mit Baala beziehungsweise Kirjat-Jearim werden in der Fußnote offengehalten.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: um von dort … heraufzubringen
  rationale: Der Hifil von עלה bezeichnet hier das Hinaufbringen der Lade; die Richtungsangabe מִשָּׁם bleibt ausdrücklich erhalten.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Dies ist die übliche, präzise deutsche Bezeichnung für die Bundeslade in diesem Erzählzusammenhang.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: über der der Name ausgerufen ist
  rationale: Die passivische, verdichtete Namensformel wird möglichst nah am Hebräischen bewahrt. Die Formulierung vermeidet es, die Beziehung des Namens zur Lade bloß als Benennung oder Besitz aufzulösen.
- source_word: שֵׁם יְהוָה צְבָאוֹת
  choice: der Name Jahwes der Heerscharen
  rationale: Der Gottesname wird als Jahwe wiedergegeben. Heerscharen bewahrt die umfassende militärisch-himmlische Bedeutung von צְבָאוֹת und ist im Deutschen als Gottestitel verständlich.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: der über den Kerubim thront
  rationale: Im Zusammenhang der Lade bezeichnet יֹשֵׁב königliches Thronen, nicht lediglich Wohnen. Die räumliche Beziehung zu den Kerubim wird idiomatisch ausgedrückt.
- source_word: עָלָיו
  choice: über den Kerubim
  rationale: Das Pronomen bezieht die Aussage letztlich auf die Lade; im Deutschen wird die Bildvorstellung durch die geläufige Wendung vom Thronen über den Kerubim verständlich gemacht, während eine alternative räumliche Fassung in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text ausdrücklich stehende Bundesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Wiedergabe des Titels צְבָאוֹת
  choice: der Heerscharen
  alternative: der Heere
  rationale: Heerscharen bewahrt die mögliche irdische wie himmlische Weite des Ausdrucks. Die modernere Alternative der Heere wird als sprachlich mögliche Wiedergabe kenntlich gemacht.
- issue: Verdichtete Namensformel der Lade
  choice: über der der Name ausgerufen ist
  alternative: die nach dem Namen genannt ist / über der der Name Jahwes … ausgerufen wird
  rationale: Die hebräische Konstruktion אֲשֶׁר נִקְרָא שֵׁם שֵׁם ist syntaktisch gedrängt. Die gewählte Fassung hält die besondere Verbindung zwischen Lade und göttlichem Namen fest, ohne sie als bloße Namensgebung, Eigentumsangabe oder kultische Anrufung eindeutig festzulegen.
- issue: Beziehung Jahwes zu den Kerubim
  choice: der über den Kerubim thront
  alternative: der zwischen den Kerubim wohnt
  rationale: Die Thronvorstellung entspricht dem Lade-Kontext und der königlichen Aussagekraft von יֹשֵׁב; die traditionelle räumliche Alternative bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Aufbruch wird idiomatisch formuliert; die ungewöhnliche und theologisch gewichtige Namensformel bleibt bewusst dichter und feierlicher. »Kerubim« folgt der im Deutschen etablierten biblischen Form.
