review_pass:
  verdict: revise
  source_fidelity: Die Satzstruktur, die Hilfeleistung für den König von Zoba und die Zahl von 22.000 Männern entsprechen dem Hebräischen. Die Namensform sollte jedoch näher an הֲדַדְעֶזֶר stehen; außerdem ist „Mann von Aram“ im heutigen Deutsch keine natürliche Wiedergabe der gegnerischen Gruppe.
  naturalness: „Aram-Damaskus“ ist als historische Staatsbezeichnung verständlich. „David schlug 22.000 Mann von Aram“ wirkt dagegen unidiomatisch; „22.000 Aramäer“ ist modernes, klares Deutsch.
  terminology: „Hadad-Eser“ bildet die Bestandteile des hebräischen Namens transparent ab. Die alternative Form ist als „Hadar-Eser“ wiederzugeben, nicht als verkürztes „Hadreser“. „Aramäer“ bezeichnet im zweiten Satz idiomatisch die mit בַּאֲרָם gemeinte gegnerische Gruppe.
  issues:
  - severity: medium
    issue: Die Fußnote nennt „Hadreser“ als abweichende Namensform.
    rationale: Die relevante abweichende Form lautet Hadar-Eser/Hadarezer; „Hadreser“ lässt den Vokal der abweichenden Namensform aus und ist keine angemessene Wiedergabe.
  - severity: medium
    issue: „22.000 Mann von Aram“ ist unnatürlich und semantisch missverständlich.
    rationale: Die Formulierung kann Herkunft statt der vom Verb betroffenen gegnerischen Gruppe nahelegen. „22.000 Aramäer“ gibt den militärischen Kontext und die Gruppenbezeichnung idiomatisch wieder, ohne „Soldaten“ ergänzend zu interpretieren.
  revised_text: Und Aram-Damaskus kam Hadad-Eser[a], dem König von Zoba, zu Hilfe, und David schlug 22.000 Aramäer.
  revised_footnotes:
