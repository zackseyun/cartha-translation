  text: וַ/תָּבֹא֙ אֲרַ֣ם דַּמֶּ֔שֶׂק לַ/עְזֹ֕ר לַ/הֲדַדְעֶ֖זֶר מֶ֣לֶךְ צוֹבָ֑ה וַ/יַּ֤ךְ דָּוִד֙ בַּֽ/אֲרָ֔ם עֶשְׂרִֽים וּ/שְׁנַ֥יִם אֶ֖לֶף אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: de
  text: Und Aram-Damaskus kam Hadad-Eser[a], dem König von Zoba, zu Hilfe, und David schlug 22.000 Aramäer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name erscheint an anderen Stellen auch in der Form „Hadar-Eser“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבֹא
  choice: kam
  rationale: Das narrative Wayyiqtol von בוא wird im Deutschen natürlich mit dem Präteritum „kam“ wiedergegeben.
- source_word: אֲרַם דַּמֶּשֶׂק
  choice: Aram-Damaskus
  rationale: Die Verbindung bezeichnet das aramäische Reich mit Damaskus als Zentrum. „Aram-Damaskus“ bewahrt die alttestamentliche Bezeichnung und ist im Deutschen klarer als das missverständliche „Syrien von Damaskus“.
- source_word: לַעְזֹר
  choice: zu Hilfe
  rationale: Die idiomatische Wendung „jemandem zu Hilfe kommen“ gibt עזר präzise und natürlich wieder.
- source_word: לַהֲדַדְעֶזֶר
  choice: Hadadeser
  rationale: Die im Deutschen übliche Transkription gibt den hier vorliegenden Namen הֲדַדְעֶזֶר wieder; die abweichende Namensform wird in einer Fußnote genannt.
- source_word: מֶלֶךְ צוֹבָה
  choice: dem König von Zoba
  rationale: Die Apposition wird im Deutschen dem durch „zu Hilfe kommen“ verlangten Dativ angepasst.
- source_word: וַיַּךְ
  choice: schlug
  rationale: נכה bezeichnet im militärischen Zusammenhang das Schlagen beziehungsweise Niedermachen. „Schlug“ bewahrt die knappe Formulierung, während die Zahl der Männer den tödlichen Ausgang nahelegt, ohne ihn lexikalisch überzubestimmen.
- source_word: בַּאֲרָם
  choice: von Aram
  rationale: Nach נכה kennzeichnet ב die betroffene gegnerische Gruppe. „Mann von Aram“ bewahrt die Bezeichnung des hebräischen Textes und ist im Deutschen verständlich.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: 22.000 Mann
  rationale: אִישׁ wird ausdrücklich als „Mann“ wiedergegeben; im militärischen Zählkontext ist der unveränderte Plural „Mann“ idiomatisch. Die Ziffernschreibung ist modern und gut lesbar.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper historischer Erzählweise. „Aram-Damaskus“ und „Aram“ vermeiden die später geprägte Bezeichnung „Syrien“. Der Fußnotenmarker steht unmittelbar nach dem betreffenden Namen.
