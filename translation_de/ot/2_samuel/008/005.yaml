- from: Und Aram-Damaskus kam Hadadeser[a], dem König von Zoba, zu Hilfe. David schlug 22.000 Mann von Aram.
  to: Und Aram-Damaskus kam Hadad-Eser[a], dem König von Zoba, zu Hilfe, und David schlug 22.000 Aramäer.
  rationale: Die Revision korrigiert die alternative Namensform und ersetzt die unidiomatische Gruppenbezeichnung durch die im Deutschen natürliche Bezeichnung „Aramäer“. Die knappe militärische Aussage von נכה bleibt mit „schlug“ bewusst erhalten; eine Übersetzung als „tötete“ würde stärker festlegen als der hebräische Wortlaut.
