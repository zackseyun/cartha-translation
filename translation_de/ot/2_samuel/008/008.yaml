  edition: WLC
  text: וּ/מִ/בֶּ֥טַח וּ/מִ/בֵּֽרֹתַ֖י עָרֵ֣י הֲדַדְעָ֑זֶר לָקַ֞ח הַ/מֶּ֧לֶךְ דָּוִ֛ד נְחֹ֖שֶׁת הַרְבֵּ֥ה מְאֹֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/008.yaml
  text: And from Betah and from Berothai[a], cities of Hadadezer[c][b], King David took very much bronze.
translation:
  language: de
  text: Und aus Betach und aus Berotai[a], den Städten Hadad-Esers, nahm König David sehr viel Bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Parallelbericht in 1. Chronik 18,8 heißen diese Orte Tibhat und Kun; der hebräische Text dieses Verses lautet Betach und Berotai.
    reason: cross_reference
  - marker: b
    text: 'Oder: Kupfer. Das hebräische Wort kann je nach Zusammenhang Kupfer oder Bronze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּטַח
  choice: Und aus Betach
  rationale: Die Konjunktion und die Präposition werden unmittelbar wiedergegeben; der Ortsname folgt der masoretischen Form dieses Verses.
- source_word: וּמִבֵּרֹתַי
  choice: und aus Berotai
  rationale: Die Form wird als Ortsname transliteriert und folgt dem hebräischen Text dieses Verses.
- source_word: עָרֵי הֲדַדְעָזֶר
  choice: den Städten Hadad-Esers
  rationale: Die Konstruktverbindung bezeichnet Städte, die Hadad-Eser gehörten oder unter seiner Herrschaft standen. Der Dativ erklärt die vorangestellten Ortsnamen als Apposition.
- source_word: לָקַח
  choice: nahm
  rationale: Die Grundbedeutung ‚nehmen‘ passt zum Erbeuten des Metalls, ohne den Vorgang stärker als ‚erobern‘ oder ‚beschlagnahmen‘ auszudeuten.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: König David
  rationale: Die Verbindung aus Titel und Eigenname entspricht natürlichem deutschem Sprachgebrauch.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Das hebräische Wort kann Kupfer oder Bronze bezeichnen. Im Zusammenhang mit Kriegsbeute und der späteren Verwendung für Tempelgerät ist ‚Bronze‘ die naheliegende Wiedergabe; die sachliche Mehrdeutigkeit bleibt in einer Fußnote erhalten.
- source_word: הַרְבֵּה מְאֹד
  choice: sehr viel
  rationale: Die adverbiale Verstärkung der großen Menge wird knapp, direkt und idiomatisch wiedergegeben.
