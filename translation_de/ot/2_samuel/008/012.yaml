  yaml_path: translation/ot/2_samuel/008/012.yaml
  text: from Aram[a], and from Moab, and from the Ammonites, and from the Philistines, and from Amalek, and from the spoil of Hadadezer son of Rehob[c][b], king of Zobah.
translation:
  language: de
  text: aus Aram[a], aus Moab, von den Ammonitern[b], von den Philistern, aus Amalek und aus der Beute Hadad-Esers[c], des Sohnes Rehobs, des Königs von Zoba.
  philosophy: optimal-equivalence
  footnotes:
