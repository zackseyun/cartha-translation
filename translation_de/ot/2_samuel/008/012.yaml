lexical_decisions:
- source_word: מֵאֲרָם
  choice: aus Aram
  rationale: Der Eigenname Aram bewahrt die hebräische Bezeichnung und vermeidet die spätere geografische Gleichsetzung mit Syrien.
- source_word: וּמִמּוֹאָב
  choice: aus Moab
  rationale: Moab ist der Eigenname des Landes beziehungsweise Volkes; bei einem Gebietsnamen ist „aus“ im Deutschen natürlich.
- source_word: וּמִבְּנֵי עַמּוֹן
  choice: von den Ammonitern
  rationale: Wörtlich steht „von den Söhnen Ammons“; die geläufige Volksbezeichnung gibt den ethnischen Bezug idiomatisch wieder.
- source_word: וּמִפְּלִשְׁתִּים
  choice: von den Philistern
  rationale: Die etablierte deutsche Volksbezeichnung entspricht dem hebräischen Ethnonym.
- source_word: וּמֵעֲמָלֵק
  choice: aus Amalek
  rationale: Der hebräische Text verwendet den Eigennamen Amalek und nicht ausdrücklich eine Volksbezeichnung; „aus Amalek“ bleibt dieser Form nahe.
- source_word: וּמִשְּׁלַל
  choice: und aus der Beute
  rationale: שָׁלָל bezeichnet im militärischen Zusammenhang erbeutete Güter; „Beute“ ist dafür die natürliche und präzise deutsche Entsprechung.
- source_word: הֲדַדְעֶזֶר
  choice: Hadad-Eser
  rationale: Die Wiedergabe folgt der Konsonantenform des Namens in diesem Vers und macht seine Bestandteile im Deutschen lesbar.
- source_word: בֶּן רְחֹב
  choice: des Sohnes Rehobs
  rationale: Die Genitivkonstruktion bindet die Abstammungsangabe eindeutig an Hadad-Eser.
- source_word: מֶלֶךְ צוֹבָה
  choice: des Königs von Zoba
  rationale: Titel und Ortsname werden transparent wiedergegeben; die Apposition bezieht sich auf Hadad-Eser.
