source:
  edition: WLC
  text: גַּם אֹתָ֕/ם הִקְדִּ֛ישׁ הַ/מֶּ֥לֶךְ דָּוִ֖ד לַֽ/יהוָ֑ה עִם הַ/כֶּ֤סֶף וְ/הַ/זָּהָב֙ אֲשֶׁ֣ר הִקְדִּ֔ישׁ מִ/כָּל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר כִּבֵּֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/011.yaml
  text: King David also dedicated them to Yahweh[b][a], along with the silver and the gold that he had dedicated from all the nations that he had subdued.
translation:
  language: de
  text: Auch sie[a] weihte König David Jahwe, zusammen mit dem Silber und dem Gold, die er aus allen Völkern, die er unterworfen hatte[b], geweiht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sie“ bezieht sich auf die im vorherigen Vers genannten Gegenstände.
    reason: cross_reference
  - marker: b
    text: 'Oder: „erobert hatte“. Das hebräische Verb kann bezeichnen, dass Völker mit Gewalt unter Kontrolle gebracht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: auch
  rationale: Gibt die additive Funktion im Anschluss an den vorherigen Vers natürlich wieder.
- source_word: אֹתָם
  choice: sie
  rationale: Bewahrt den pronominalen Rückverweis des Hebräischen; eine Fußnote erläutert den Bezug auf die im vorherigen Vers genannten Gegenstände.
- source_word: הִקְדִּישׁ
  choice: weihte / geweiht hatte
  rationale: „Weihen“ bringt das Aussondern für Jahwe in diesem kultischen Zusammenhang prägnant und verständlich zum Ausdruck.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: König David
  rationale: Natürliche deutsche Wiedergabe von Titel und Eigenname.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen יהוה als Eigennamen wieder.
- source_word: עִם
  choice: zusammen mit
  rationale: Verbindet die zuvor erwähnten Gegenstände idiomatisch mit Silber und Gold.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: dem Silber und dem Gold
  rationale: Bewahrt die bestimmte Bezugnahme auf die genannten Edelmetalle.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: das er ... geweiht hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass diese Weihe den hier neu genannten Gaben vorausging.
- source_word: מִכָּל הַגּוֹיִם
  choice: von all den Völkern
  rationale: מִן bezeichnet hier die Herkunft; גּוֹיִם meint im militärisch-politischen Zusammenhang die fremden Völker.
- source_word: אֲשֶׁר כִּבֵּשׁ
  choice: die er unterworfen hatte
  rationale: „Unterwerfen“ erfasst die gewaltsame Herrschaftsunterstellung, ohne zwingend eine dauerhafte territoriale Eroberung zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen; „Jahwe“ macht diesen Eigennamen im Haupttext sichtbar.
- issue: Bedeutungsumfang von כִּבֵּשׁ
  choice: unterworfen hatte
  alternative: erobert hatte
  rationale: Die gewählte Fassung bewahrt den militärisch-politischen Sinn und lässt offen, ob eine dauerhafte Annexion gemeint ist; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch „zusammen mit“ und das Plusquamperfekt idiomatisch gestaltet. Der Gottesname erscheint als „Jahwe“.
