source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח תֹּ֣עִי אֶת יֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִד לִ/שְׁאָל ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עִי הָיָ֣ה הֲדַדְעָ֑זֶר וּ/בְ/יָד֗/וֹ הָי֛וּ כְּלֵֽי כֶ֥סֶף וּ/כְלֵֽי זָהָ֖ב וּ/כְלֵ֥י נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/010.yaml
  text: Then Toi sent Joram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Toi; and in his hand were articles of silver, articles of gold[b], and articles of bronze.
translation:
  language: de
  text: Da sandte Toï seinen Sohn Joram zu König David, um sich nach seinem Wohlergehen zu erkundigen und ihn zu beglückwünschen, weil er gegen Hadad-Eser gekämpft und ihn besiegt hatte; denn Hadad-Eser hatte Krieg mit Toï geführt. Joram brachte Gegenstände aus Silber, Gold und Bronze mit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Und in seiner Hand waren Gegenstände aus Silber, Gegenstände aus Gold und Gegenstände aus Bronze.«'
    reason: Die Fußnote bewahrt die anschauliche hebräische Ausdrucksweise und die dreifache Wiederholung, während der Haupttext ihren gemeinten Sinn in natürlichem Deutsch wiedergibt.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da sandte
  rationale: Das Wayyiqtol führt die Erzählung fort; „Da“ gibt die zeitlich-folgernde Bewegung in natürlichem Deutsch wieder.
- source_word: תֹּעִי
  choice: Toï
  rationale: Der Personenname wird nach der hebräischen Form in Samuel transliteriert; das Trema verhindert im Deutschen die Lesung als Diphthong.
- source_word: יֽוֹרָם בְּנוֹ
  choice: seinen Sohn Joram
  rationale: Natürliches Deutsch, das sowohl das Verwandtschaftsverhältnis als auch den Namen eindeutig wiedergibt.
- source_word: לִשְׁאָל לוֹ לְשָׁלוֹם
  choice: um sich nach seinem Wohlergehen zu erkundigen
  rationale: Die hebräische Grußformel bezeichnet die Nachfrage nach dem Ergehen beziehungsweise Wohlergehen einer Person.
- source_word: וּלְבָרֲכוֹ
  choice: und ihn zu beglückwünschen
  rationale: ברך bedeutet grundsätzlich „segnen“, hat hier im diplomatischen Kontext jedoch den Sinn, David zu seinem Sieg Glück zu wünschen.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: weil er gegen Hadad-Eser gekämpft und ihn besiegt hatte
  rationale: ב bezeichnet hier die Gegnerschaft; נכה meint im militärischen Zusammenhang die Niederlage des Gegners, ohne zwingend dessen Tötung auszusagen.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעִי הָיָה הֲדַדְעָזֶר
  choice: denn Hadad-Eser hatte Krieg mit Toï geführt
  rationale: Die komprimierte Wendung „ein Mann von Kriegen mit Toï“ wird idiomatisch wiedergegeben, ohne eine zusätzliche Charakterisierung Hadad-Esers als Berufskrieger einzutragen.
- source_word: וּבְיָדוֹ הָיוּ
  choice: Joram brachte … mit
  rationale: Wörtlich heißt es „und in seiner Hand waren“; im Zusammenhang bezeichnet dies die von Joram mitgeführten Geschenke. Das Pronomen wird zur Klarheit mit dem wahrscheinlichen Bezugsnamen aufgelöst.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב וּכְלֵי נְחֹשֶׁת
  choice: Gegenstände aus Silber, Gold und Bronze
  rationale: כְּלִי ist ein weiter Begriff für Gegenstand, Gerät oder Gefäß. „Gegenstände“ lässt die genaue Art offen; נְחֹשֶׁת wird sachgemäß als „Bronze“ wiedergegeben.
