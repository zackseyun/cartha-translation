  terminology: Die Namensformen „Toï“, „Joram“ und „Hadad-Eser“ sind konsistent und für eine hebräisch orientierte deutsche Übersetzung vertretbar. „Gegenstände“ bewahrt die weite Bedeutung von כְּלִי, und „Bronze“ ist für נְחֹשֶׁת sachgerecht. „beglückwünschen“ gibt die diplomatische Funktion von וּלְבָרֲכוֹ natürlich wieder, ohne einen unnötig kultisch-religiösen Sinn einzutragen.
