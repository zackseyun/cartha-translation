  source_fidelity: Der Text gibt den hebräischen Erzählfortschritt, Toïs Gesandtschaft, die Gruß- und Glückwunschformel, Davids Sieg über Hadad-Eser, die vorausgehende Feindschaft und die mitgeführten Wertgegenstände zutreffend wieder. „Besiegt“ ist für וַיַּכֵּהוּ im militärischen Zusammenhang angemessen und behauptet keine Tötung.
