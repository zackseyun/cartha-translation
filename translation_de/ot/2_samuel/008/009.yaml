base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/009.yaml
  text: When Toi king of Hamath heard that David had struck down all the army of Hadadezer,[a]
translation:
  language: de
  text: Als Toï, der König von Hamat, hörte, dass David das ganze Heer Hadad-Esers geschlagen hatte,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der Parallelstelle 1. Chronik 18,9 lautet der Name des Königs „To-u“. Der hebräische Text an dieser Stelle lautet „Toï“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Als … hörte
  rationale: Das narrative Waw mit שׁמע führt das nächste Ereignis ein. Die deutsche als-Konstruktion gibt die zeitliche Abfolge natürlich wieder.
- source_word: תֹּעִי
  choice: Toï
  rationale: Der Personenname folgt der Form des hebräischen Textes in diesem Vers. Das Trema macht deutlich, dass o und i getrennt gesprochen werden.
- source_word: מֶלֶךְ חֲמָת
  choice: der König von Hamat
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Toïs Amt und Herrschaftsgebiet; „Hamat“ ist die geläufige deutsche Namensform.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Toï hörte, nicht eine Begründung.
- source_word: הִכָּה
  choice: geschlagen hatte
  rationale: נכה bezeichnet im militärischen Zusammenhang das Schlagen beziehungsweise Niederschlagen. Das Plusquamperfekt bildet das zeitlich vorausliegende Geschehen idiomatisch ab.
- source_word: אֵת כָּל חֵיל
  choice: das ganze Heer
  rationale: חַיִל bezeichnet hier die gesamte Streitmacht. „Heer“ ist prägnant, würdig und im militärischen Zusammenhang eindeutig.
- source_word: הֲדַדְעָזֶר
  choice: Hadad-Esers
  rationale: Die Schreibung mit Bindestrich bewahrt die erkennbaren Namensbestandteile und ermöglicht im Deutschen eine natürliche Genitivform.
