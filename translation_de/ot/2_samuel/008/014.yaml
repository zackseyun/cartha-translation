  text: וַ/יָּ֨שֶׂם בֶּ/אֱד֜וֹם נְצִבִ֗ים בְּ/כָל אֱדוֹם֙ שָׂ֣ם נְצִבִ֔ים וַ/יְהִ֥י כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑ד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/014.yaml
  text: He placed garrisons in Edom[a]; throughout all Edom he placed garrisons, and all Edom became servants to David[b]. And Yahweh gave David victory wherever he went.
translation:
  language: de
  text: Er setzte Besatzungen in Edom ein; in ganz Edom setzte er Besatzungen ein. Und ganz Edom wurde David untertan[a]. Und Jahwe schenkte David überall Sieg, wohin er ging[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ganz Edom wurde zu Knechten Davids“; der Landesname steht dabei zusammenfassend für seine Bevölkerung. Auch möglich: „Alle Edomiter wurden Davids Knechte.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Und Jahwe rettete David überall, wohin er ging.“ Das Verb kann „retten, befreien“ oder im militärischen Zusammenhang „Sieg schenken“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם / שָׂם
  choice: setzte … ein
  rationale: שׂים bedeutet allgemein „setzen, stellen, einsetzen“. In Verbindung mit „Besatzungen“ ist „einsetzen“ im Deutschen natürlich, ohne die Art der Stationierung unnötig zu präzisieren.
- source_word: נְצִבִים
  choice: Besatzungen
  rationale: Im Zusammenhang militärischer Eroberung bezeichnet das Wort wahrscheinlich stationierte Kräfte oder Posten zur Kontrolle des Gebiets. „Besatzungen“ gibt diesen militärischen Sinn wieder; „Statthalter“ bleibt lexikalisch möglich, ist hier aber weniger wahrscheinlich.
- source_word: בֶּאֱדוֹם / בְּכָל אֱדוֹם
  choice: in Edom / in ganz Edom
  rationale: Die Präposition bezeichnet den Ort; בְכָל drückt die umfassende Ausdehnung über Edom aus.
- source_word: וַיְהִי כָל אֱדוֹם עֲבָדִים לְדָוִד
  choice: So wurde ganz Edom David untertan
  rationale: עֲבָדִים bezeichnet hier im Eroberungskontext politische beziehungsweise dienstpflichtige Unterordnung. „Untertan“ bewahrt diese Aussage natürlicher als das im Deutschen leicht individualisierend und eigentumsrechtlich verstandene „Sklaven“.
- source_word: וַיּוֹשַׁע
  choice: schenkte … den Sieg
  rationale: Der Hifil von ישׁע kann „retten, befreien, Sieg schenken“ bedeuten. Im militärischen Summarium bringt „den Sieg schenken“ den Kontext und Gottes Handeln klar zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: wohin er auch zog
  rationale: Die Wendung bezeichnet umfassenden Erfolg an allen Orten, an die David ging. „Zog“ passt zum militärischen Kontext, während die Fußnote die allgemeinere Wiedergabe offenhält.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Unterordnung Edoms
  choice: wurde David untertan
  alternative: wurde David zu Knechten / Sklaven
  rationale: Der Plural עֲבָדִים benennt reale Unterordnung und Dienstpflicht, legt in dieser national-politischen Aussage aber nicht eindeutig den individuellen Rechtsstatus jedes Edomiters fest. „Untertan“ wahrt diese Spannung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung des hebräischen Textes wurde bewusst bewahrt. „Besatzungen“ ist militärisch klar, „untertan“ vermeidet eine ungesicherte Festlegung auf individuellen Sklavenstatus, und „Jahwe“ gibt den Gottesnamen direkt wieder.
