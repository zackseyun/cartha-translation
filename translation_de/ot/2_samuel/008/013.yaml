base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/013.yaml
  text: And David made a name for himself when he returned from striking down Aram in the Valley of Salt—eighteen thousand men[a].
translation:
  language: de
  text: 'David machte sich einen Namen, als er zurückkehrte, nachdem er Aram im Salztal geschlagen hatte: achtzehntausend Mann.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Textzeugen und die Parallele in 1. Chronik 18,12 weisen hier auf „Edom“ statt „Aram“ hin.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַשׂ ... שֵׁם
  choice: machte sich einen Namen
  rationale: Die im Deutschen natürliche Wendung bewahrt das hebräische Bild und bringt den Sinn zum Ausdruck, dass David Ansehen gewann.
- source_word: בְּשֻׁבוֹ
  choice: als er davon zurückkehrte
  rationale: Die Präposition mit Infinitivus constructus und Suffix hat temporale Bedeutung; „davon“ stellt zugleich den Bezug zum folgenden Schlag gegen Aram her.
- source_word: מֵהַכּוֹתוֹ
  choice: geschlagen zu haben
  rationale: נכה bezeichnet hier das militärische Schlagen beziehungsweise Besiegen. Die Formulierung bleibt nahe an der Konstruktion, ohne die nicht ausdrücklich genannte Art der Niederlage näher festzulegen.
- source_word: אֶת אֲרָם
  choice: Aram
  rationale: Der masoretische Text nennt ausdrücklich Aram. Der Eigenname wird beibehalten und nicht mit dem späteren geopolitischen Begriff „Syrien“ wiedergegeben.
- source_word: בְּגֵיא מֶלַח
  choice: im Salztal
  rationale: Die knappe deutsche Ortsbezeichnung gibt גֵּיא מֶלַח natürlich und sachlich wieder.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: achtzehntausend Mann
  rationale: Das Hebräische nennt nur die Zahl. „Mann“ ergänzt im militärischen Zusammenhang das im Deutschen erforderliche Bezugswort, ohne eine zusätzliche Gruppe einzuführen.
theological_decisions:
- issue: Identität des besiegten Gegners
  choice: Aram im Haupttext
  alternative: Edom
  rationale: Der vorgegebene masoretische Text von 2. Samuel 8,13 liest „Aram“. Mehrere Textzeugen sowie die Parallele in 1. Chronik 18,12 weisen dagegen auf „Edom“. Daher bleibt Aram im Haupttext, während die gewichtige Variante transparent in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung „sich einen Namen machen“ bewahrt das hebräische Bild; die etwas kompakte Satzfügung hält den Zusammenhang von Rückkehr, Sieg und Zahl offen, ohne den Text stärker als nötig auszudeuten.
