base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/002.yaml
  text: He struck Moab and measured them with a line[a], making them lie down on the ground. He measured off two lengths of line for death and a full length of line to keep alive. So Moab became David’s servants[b], bringing tribute.
translation:
  language: de
  text: Er schlug Moab und maß sie mit einer Schnur[a], indem er sie auf den Boden legen ließ. Er maß zwei Schnurlängen zum Töten ab und eine volle Schnurlänge, um am Leben zu lassen. So wurden die Moabiter Davids Untertanen[b] und brachten Tribut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem Seil“ oder „mit einer Messschnur“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Text beschreibt, wie David die am Boden liegenden Moabiter abmaß: Zwei abgemessene Abschnitte waren zum Töten bestimmt und ein voller Abschnitt dazu, die Betreffenden am Leben zu lassen. Damit ist gemeint, dass ein Teil getötet und ein anderer verschont wurde.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ אֶת־מוֹאָב
  choice: Er schlug Moab
  rationale: נכה bedeutet konkret „schlagen“ und kann im militärischen Zusammenhang auch Niederlage einschließen. Die knappe Wiedergabe bewahrt die Härte und legt den Grad des Sieges nicht zusätzlich aus.
- source_word: וַיְמַדְּדֵם בַּחֶבֶל
  choice: und maß die Moabiter mit einer Schnur ab
  rationale: Das Suffix bezeichnet die zuvor genannten Moabiter. חֶבֶל ist hier eine Schnur beziehungsweise Messschnur; „abmessen“ entspricht dem wiederholten Vorgang im Deutschen natürlich.
- source_word: הַשְׁכֵּב אֹתָם אַרְצָה
  choice: nachdem er sie auf den Boden hatte legen lassen
  rationale: 'Die Hifil-Konstruktion ist kausativ: David ließ sie sich hinlegen beziehungsweise hinlegen. Die vorzeitige Fassung verdeutlicht den Ablauf, ohne den Vorgang weiter auszumalen.'
- source_word: שְׁנֵי חֲבָלִים לְהָמִית
  choice: zwei Schnurlängen zum Töten
  rationale: „Schnurlängen“ bezeichnet zwei mit der Schnur bestimmte Abschnitte. „Zum Töten“ gibt den finalen Hifil-Infinitiv wieder und erhält die erschreckend knappe Formulierung.
- source_word: וּמְלֹא הַחֶבֶל לְהַחֲיוֹת
  choice: und eine volle Schnurlänge, um sie am Leben zu lassen
  rationale: מְלֹא bezeichnet das volle Maß; eine ausdrückliche Zahl steht im Hebräischen nicht. לְהַחֲיוֹת bedeutet kausativ „am Leben lassen“.
- source_word: וַתְּהִי מוֹאָב לְדָוִד לַעֲבָדִים
  choice: So wurden die Moabiter Davids Untertanen
  rationale: עֲבָדִים bezeichnet in diesem politisch-militärischen Zusammenhang unterworfene Dienstpflichtige beziehungsweise Vasallen. „Untertanen“ vermeidet die im Deutschen naheliegende, hier zu enge Deutung als persönliche Sklaven.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: und mussten ihm Tribut bringen
  rationale: מִנְחָה bezeichnet im königlich-politischen Kontext Tribut. Das Partizip beschreibt die fortdauernde Verpflichtung; „mussten“ macht den Unterwerfungszusammenhang idiomatisch deutlich.
theological_decisions:
- issue: Davids Behandlung der Moabiter beim Abmessen
  choice: Das konkrete Bild des Abmessens sowie die Zuweisung zum Töten und zum Lebenlassen bleiben im Haupttext erhalten.
  alternative: Die Schnur nur bildlich als Ausdruck allgemeiner Unterwerfung deuten oder ausdrücklich sagen, dass zwei Drittel getötet und ein Drittel verschont wurden.
  rationale: Der hebräische Text schildert einen konkreten und grausamen Vorgang. Das Verhältnis der Abschnitte legt eine entsprechende Aufteilung nahe, formuliert aber keine Bruchzahlen; deshalb wird weder abgeschwächt noch über die Bildsprache hinaus präzisiert.
- issue: Bedeutung von עֲבָדִים im politischen Kontext
  choice: Untertanen
  alternative: Diener oder Sklaven
  rationale: Der anschließende Tribut weist auf politische Unterwerfung und Vasallenstatus. „Untertanen“ gibt dies wieder, ohne persönliche Haussklaverei zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt angesichts der geschilderten Gewalt bewusst nüchtern und konkret. „Moab“ steht zunächst als Kollektivbezeichnung; wo Personen gemeint sind, wird zur Klarheit „die Moabiter“ verwendet. Alle Fußnotenmarker erscheinen im Haupttext.
