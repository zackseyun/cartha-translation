source:
  edition: WLC
  text: וְ/צָד֧וֹק בֶּן אֲחִיט֛וּב וַ/אֲחִימֶ֥לֶךְ בֶּן אֶבְיָתָ֖ר כֹּהֲנִ֑ים וּ/שְׂרָיָ֖ה סוֹפֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/017.yaml
  text: Zadok son of Ahitub and Ahimelech son of Abiathar were priests[b][a], and Seraiah was secretary.
translation:
  language: de
  text: Zadok, der Sohn Ahitubs, und Ahimelech, der Sohn Abjatars, waren Priester[a], und Seraja war Schreiber[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »führende Minister« oder »königliche Beamte«. Manche verstehen das hebräische Wort hier wegen der Aufzählung von Davids Amtsträgern in einem weiteren höfisch-administrativen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sekretär«. Das hebräische Wort bezeichnet einen Amtsträger, der für Schriftstücke oder Verwaltungsaufgaben zuständig war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  choice: Zadok
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בֶּן
  choice: der Sohn
  rationale: In dieser Aufzählung von Amtsträgern bezeichnet die genealogische Angabe am natürlichsten die unmittelbare Abstammung.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Der Personenname wird transliteriert; im Genitiv steht im Text die Form „Ahitubs“.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimelech
  rationale: Der Personenname wird in seiner geläufigen deutschen biblischen Form wiedergegeben.
- source_word: אֶבְיָתָר
  choice: Abjatar
  rationale: Diese Form entspricht dem im Deutschen üblichen biblischen Namen; im Text steht der Genitiv „Abjatars“.
- source_word: כֹּהֲנִים
  choice: Priester
  rationale: Dies ist die gewöhnliche und primäre Bedeutung des hebräischen Wortes. Eine weiter gefasste höfisch-administrative Deutung bleibt in einer Fußnote erhalten.
- source_word: שְׂרָיָה
  choice: Seraja
  rationale: Der Personenname wird in seiner im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: סוֹפֵר
  choice: Schreiber
  rationale: Das Wort bezeichnet hier einen für Schriftstücke und Verwaltungsaufgaben zuständigen Hofbeamten. „Schreiber“ bewahrt die Nähe zum hebräischen Ausdruck; die funktionale Alternative „Sekretär“ wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von כֹּהֲנִים innerhalb einer Liste königlicher Amtsträger
  choice: Priester
  alternative: führende Minister oder königliche Beamte
  rationale: Die Grundbedeutung ist „Priester“. Der administrative Zusammenhang ermöglicht zwar eine weiter gefasste Deutung, zwingt aber nicht dazu, die übliche Bedeutung im Haupttext aufzugeben; die echte lexikalische Möglichkeit wird daher in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die im Hebräischen fehlende Kopula wird für einen natürlichen deutschen Satz mit „waren“ und „war“ ergänzt. Die Namensformen folgen geläufigem deutschem Bibelgebrauch; beide echten lexikalischen Alternativen werden knapp in Fußnoten dokumentiert.
