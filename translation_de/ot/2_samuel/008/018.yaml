source:
  edition: WLC
  text: וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וְ/הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וּ/בְנֵ֥י דָוִ֖ד כֹּהֲנִ֥ים הָיֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
translation:
  language: de
  text: Benaja, der Sohn Jojadas, stand den Keretitern und den Peletitern vor,[a] und Davids Söhne waren Priester.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen nur: »Benaja, der Sohn Jojadas, und die Keretiter und die Peletiter«. Das Leitungsverhältnis ist nicht ausdrücklich genannt; nach 1. Chronik 18,17 war Benaja über sie gesetzt.'
    reason: Das ergänzte „stand ... vor“ macht die hebräische Ellipse im Deutschen verständlich, ohne ein spezifisch militärisches Befehlsverhältnis festzulegen.
  - marker: b
    text: 'Oder: »oberste Minister«, »hohe Hofbeamte« oder »königliche Amtsträger«. Das hebräische Wort ist die gewöhnliche Bezeichnung für »Priester«; manche verstehen es hier wegen des Zusammenhangs der königlichen Verwaltung in einem weiteren höfischen Sinn.'
    reason: Die Fußnote dokumentiert die mögliche kontextuelle Deutung, ohne den regulären Wortsinn von כֹּהֲנִים im Haupttext zu ersetzen.
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaja, der Sohn Jojadas
  rationale: Die Personennamen werden nach geläufigen deutschen Bibelnamensformen wiedergegeben. Die Apposition wird mit Kommas natürlich ins Deutsche übertragen.
- source_word: וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: die Keretiter und die Peletiter
  rationale: Die beiden Gruppenbezeichnungen werden möglichst quellennah transliteriert, ohne ihre ethnische Herkunft oder genaue militärische Funktion festzulegen.
- source_word: וּבְנָיָהוּ ... וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: Benaja ... befehligte die Keretiter und die Peletiter
  rationale: Im hebräischen Satz fehlt hier ein ausdrückliches Verb. Aus der administrativen Aufzählung und der Parallelstelle 1. Chronik 18,17 ergibt sich ein Leitungsverhältnis; „befehligte“ macht die Ellipse in natürlichem Deutsch verständlich, wird aber wegen ihres ergänzenden Charakters in einer Fußnote ausgewiesen.
- source_word: כֹּהֲנִים
  choice: Priester
  rationale: כֹּהֲנִים ist die gewöhnliche hebräische Bezeichnung für Priester. Die mögliche weitere Bedeutung im Sinn hoher Hofbeamter wird nicht stillschweigend in den Haupttext eingetragen, sondern als Auslegungsalternative in der Fußnote genannt.
- source_word: הָיוּ
  choice: waren
  rationale: Die Qal-Form von היה wird als gewöhnliche Kopula „waren“ wiedergegeben; „dienten als“ wäre stärker auslegend.
theological_decisions:
- issue: Davids Söhne werden כֹּהֲנִים genannt
  choice: Im Haupttext steht „Priester“.
  alternative: „oberste Minister“, „hohe Hofbeamte“ oder „königliche Amtsträger“
  rationale: Die Wiedergabe bewahrt den üblichen lexikalischen Sinn und damit auch die Spannung dazu, dass Davids Söhne nicht als levitische Kultpriester bekannt sind. Eine mögliche höfisch-administrative Bedeutung wird in der Fußnote offengelegt, aber nicht zur eindeutigen Hauptlesart gemacht.
- issue: Unausgedrücktes Verhältnis zwischen Benaja und den Keretitern und Peletitern
  choice: „befehligte“ wird als kontextuell erforderliche Ergänzung verwendet.
  alternative: 'Eine streng formale, aber im Deutschen unvollständige Reihung: „Benaja ... und die Keretiter und die Peletiter“'
  rationale: Der hebräische Text setzt das Verhältnis elliptisch voraus. Die Parallelstelle 1. Chronik 18,17 nennt Benaja ausdrücklich „über“ diesen Gruppen. Die Ergänzung schafft einen vollständigen deutschen Satz, ohne die militärische beziehungsweise administrative Identität der Gruppen weiter festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Befehligte“ gibt die hebräische Ellipse verständlich wieder und passt zur Funktion der beiden offenbar militärischen Gruppen; die Ergänzung wird ausdrücklich markiert. Die seltenen Gruppenbezeichnungen bleiben als „Keretiter“ und „Peletiter“ transliteriert. Der theologisch spannungsreiche Ausdruck „Priester“ wird bewusst nicht harmonisiert.
