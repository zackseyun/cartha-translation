base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/015.yaml
  text: So David reigned over all Israel[a], and David was administering justice and righteousness to all his people.
translation:
  language: de
  text: So herrschte David über ganz Israel. David übte Recht und Gerechtigkeit für sein ganzes Volk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „David sorgte für Recht und Gerechtigkeit bei seinem ganzen Volk.“ Das hebräische Begriffspaar ist eine feste Wendung für eine vorbildliche Königsherrschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: herrschte
  rationale: מלך bezeichnet hier in der zusammenfassenden Aussage Davids ausgeübte Königsherrschaft, nicht erst seine Thronbesteigung.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: über ganz Israel
  rationale: עַל kennzeichnet bei מלך den Herrschaftsbereich; die Formulierung bewahrt den umfassenden Bezug.
- source_word: וַיְהִי ... עֹשֶׂה
  choice: sorgte
  rationale: Die Verbindung von ויהי mit dem Partizip beschreibt fortgesetztes beziehungsweise regelmäßiges Handeln. Im Deutschen gibt „sorgte … für“ die Ausübung gerechter Regierung natürlich wieder.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Im königlichen Kontext bezeichnet מִשְׁפָּט die ordnungsgemäße Wahrung und Ausübung des Rechts.
- source_word: וּצְדָקָה
  choice: Gerechtigkeit
  rationale: צְדָקָה bezeichnet gerechtes, richtiges Handeln und bewahrt neben „Recht“ die ethische Dimension des Begriffspaars.
- source_word: לְכָל עַמּוֹ
  choice: bei seinem ganzen Volk
  rationale: Das ל bezeichnet hier den Personenkreis, dem Davids gerechte Regierung zugutekommt. „Bei seinem ganzen Volk“ ist idiomatisch und bewahrt sowohl den umfassenden Sinn als auch das Possessivsuffix.
theological_decisions:
- issue: Wiedergabe des königlichen Begriffspaars מִשְׁפָּט וּצְדָקָה
  choice: Recht und Gerechtigkeit
  alternative: Recht und das, was richtig ist
  rationale: Die zwei Substantive bleiben unterscheidbar und vermitteln sowohl die rechtliche als auch die ethisch-gerechte Seite idealer Königsherrschaft, ohne sie zu einem einzigen Gedanken zu verschmelzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung des Namens David folgt der hebräischen Struktur; „sorgte … für“ formuliert die andauernde Regierungstätigkeit natürlich, während die Fußnote eine formalere Wiedergabe bietet.
