  text: וַ/יִּקַּ֣ח דָּוִ֗ד אֵ֚ת שִׁלְטֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֣ר הָי֔וּ אֶ֖ל עַבְדֵ֣י הֲדַדְעָ֑זֶר וַ/יְבִיאֵ֖/ם יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/007.yaml
  text: And David took the shields of gold that belonged to the servants of Hadadezer and brought them to Jerusalem[a].
translation:
  language: de
  text: David nahm die goldenen Schilde[a], die den Dienern Hadad-Esers gehörten, und brachte sie nach Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Schilde aus Gold“. Nach einer weniger verbreiteten Deutung bedeutet das hebräische Wort „Köcher“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: לקח bedeutet in erzählender Prosa gewöhnlich „nehmen“. Das neutrale „nahm“ gibt den Vorgang wieder, ohne die stärkere Bedeutung „erbeutete“ ausdrücklich einzutragen.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: die goldenen Schilde
  rationale: Die traditionelle und im militärischen Zusammenhang naheliegende Deutung von שׁלטים ist „Schilde“. Die deutsche Formulierung „goldene Schilde“ gibt die hebräische Stoffangabe idiomatisch wieder.
- source_word: אֲשֶׁר הָיוּ אֶל
  choice: die … gehörten
  rationale: Die Verbindung bezeichnet hier am ehesten Besitz oder Zuordnung. „Gehörten“ ist im Deutschen natürlicher als das wörtlichere „bei … waren“.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: den Dienern Hadad-Esers
  rationale: עֲבָדִים kann Diener, königliche Bedienstete oder Amtsträger bezeichnen. „Diener“ wahrt die semantische Breite, ohne Sklavenstatus oder ein bestimmtes Amt vorauszusetzen.
- source_word: וַיְבִיאֵם
  choice: und brachte sie
  rationale: Die Hifil-Form von בוא bedeutet gewöhnlich „bringen“; das Suffix verweist auf die Schilde.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Übliche deutsche Namensform.
