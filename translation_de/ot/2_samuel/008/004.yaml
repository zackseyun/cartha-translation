base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/004.yaml
  text: David captured from him 1,700 horsemen and 20,000 foot soldiers[a]. Then David hamstrung all the chariot horses[c][b], but left enough for 100 chariots.
translation:
  language: de
  text: David nahm ihm 1.700 Reiter und 20.000 Fußsoldaten gefangen[a]. Dann durchtrennte David allen Streitwagenpferden die Sehnen[b], ließ aber genug Pferde für 100 Streitwagen übrig[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text von 2 Samuel nennt 1.700 Reiter; in der Parallelstelle 1. Chronik 18,4 stehen 7.000 Reiter.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „die ganze Streitwagenmacht“. Gemeint sind hier die Pferde, da ihnen die Sehnen durchtrennt werden konnten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder, näher an der knappen hebräischen Formulierung: „ließ aber davon 100 Streitwagen übrig“.'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: nahm … gefangen
  rationale: לכד bezeichnet hier das Gefangennehmen beziehungsweise Erbeuten im Kampf. „Nahm … gefangen“ ist im Deutschen natürlich und passt zu den genannten Truppen.
- source_word: מִמֶּנּוּ
  choice: ihm
  rationale: Das hebräische Suffix steht im Singular und bezieht sich im Zusammenhang auf den besiegten König Hadadeser.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת פָּרָשִׁים
  choice: 1.700 Reiter
  rationale: פָּרָשִׁים bezeichnet berittene Kämpfer. Die Zahl folgt dem masoretischen Text von 2 Samuel; die abweichende Parallelstelle wird in einer Fußnote genannt.
- source_word: וְעֶשְׂרִים אֶלֶף אִישׁ רַגְלִי
  choice: 20.000 Fußsoldaten
  rationale: Die wörtliche Wendung „Mann zu Fuß“ bezeichnet im militärischen Zusammenhang Fußtruppen; „Fußsoldaten“ gibt dies klar und modern wieder.
- source_word: וַיְעַקֵּר
  choice: durchtrennte … die Sehnen
  rationale: עקר bezeichnet hier das Durchtrennen der Sehnen, um die Pferde dauerhaft für den Kriegseinsatz untauglich zu machen. Die konkrete Formulierung ist verständlicher als das seltene deutsche Fachwort „entsehnte“.
- source_word: אֶת כָּל הָרֶכֶב
  choice: allen Streitwagenpferden
  rationale: רֶכֶב bedeutet gewöhnlich „Streitwagen“ oder „Wagenmacht“, bezeichnet hier aber metonymisch deren Pferde, denn nur diese können durch das Durchtrennen der Sehnen gelähmt werden.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: ließ aber genug von ihnen für 100 Streitwagen übrig
  rationale: 'יתר im Hifil bedeutet „übrig lassen“ oder „verschonen“. Die Formulierung macht den im Zusammenhang naheliegenden Sinn deutlich: David behielt eine ausreichende Zahl von Pferden für 100 Streitwagen.'
