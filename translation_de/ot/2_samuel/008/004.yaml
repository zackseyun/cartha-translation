  naturalness: 'Modernes Standarddeutsch und der erzählerische Registerton sind gelungen. Im bisherigen Schlusssatz ist das Pronomen „ihnen“ jedoch potenziell mehrdeutig: Es kann sich formal auf die unmittelbar genannten „Sehnen“ statt auf die Pferde beziehen. Die explizite Nennung von „Pferden“ beseitigt dies ohne Sinnänderung.'
