base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/016.yaml
  text: And Joab son of Zeruiah was over the army[b][a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: de
  text: Joab, der Sohn Zerujas, hatte den Oberbefehl über das Heer,[a] und Joschafat, der Sohn Ahiluds, war Kanzler.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: stand über dem Heer; auch: befehligte das Heer.'
    reason: lexical_alternative
  - marker: b
    text: Der „Kanzler“ war ein königlicher Beamter, der Vorgänge festhielt und dem König Bericht erstattete; auch „Sekretär“ oder „Chronist“.
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: hatte den Oberbefehl über das Heer
  rationale: Die Präposition עַל bezeichnet in dieser Ämterliste die Autorität über das Heer. Die Formulierung gibt die militärische Leitungsfunktion natürlich und präzise wieder.
- source_word: מַזְכִּיר
  choice: Kanzler
  rationale: Das Wort bezeichnet einen hohen königlichen Beamten, der Vorgänge festhielt und dem König Bericht erstattete. „Kanzler“ ist im Deutschen eine knappe historische Amtsbezeichnung, ohne Joschafat lediglich als Verfasser einer Chronik darzustellen.
- source_word: בֶּן
  choice: Sohn
  rationale: In der genealogischen Benennung bezeichnet בֶּן unmittelbar die Abstammung und wird entsprechend wörtlich wiedergegeben.
- source_word: וְ / וִ
  choice: und
  rationale: Die Präfixkonjunktion verbindet die beiden Amtsträger in der listenartigen Satzstruktur.
- source_word: יוֹאָב / צְרוּיָה / יְהוֹשָׁפָט / אֲחִילוּד
  choice: Joab / Zeruja / Joschafat / Ahilud
  rationale: Die Personennamen folgen den im modernen deutschen Bibelgebrauch üblichen Formen.
