lexical_decisions:
- source_word: וַיַּךְ
  choice: schlug
  rationale: נכה bezeichnet hier einen militärischen Schlag beziehungsweise eine Niederlage. „Schlug“ ist im Deutschen idiomatisch und lässt offen, ob Hadadeser persönlich getötet wurde.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadeser
  rationale: Der Personenname wird nach der Form des WLC ins Deutsche übertragen; die abweichende Namensform wird in einer Fußnote genannt.
- source_word: בֶּן רְחֹב
  choice: den Sohn Rehobs
  rationale: Die einfache Abstammungsangabe wird direkt wiedergegeben; der Genitiv ist im Deutschen natürlich.
- source_word: מֶלֶךְ צוֹבָה
  choice: den König von Zoba
  rationale: Die hebräische Status- und Ortsangabe wird unmittelbar und verständlich wiedergegeben.
- source_word: בְּלֶכְתּוֹ
  choice: als dieser auszog
  rationale: Die Infinitivkonstruktion bezeichnet einen zeitlichen Begleitumstand. „Dieser“ macht eindeutig, dass sich das Suffix auf Hadadeser bezieht; „auszog“ passt zum militärischen Zusammenhang.
- source_word: לְהָשִׁיב יָדוֹ
  choice: um seine Macht wiederherzustellen
  rationale: Wörtlich steht „seine Hand wiederherzustellen“. „Macht“ gibt das politische beziehungsweise militärische Idiom verständlich wieder, während die Fußnote die möglichen Nuancen bewahrt.
- source_word: בִּנְהַר
  choice: am Strom
  rationale: Das absolut gebrauchte נָהָר meint wahrscheinlich den Euphrat. „Am Strom“ bewahrt die zurückhaltende Ausdrucksweise des hebräischen Haupttextes; die wahrscheinliche Identifizierung steht in der Fußnote.
