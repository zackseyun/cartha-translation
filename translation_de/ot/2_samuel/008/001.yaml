source:
  edition: WLC
  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/יַּ֥ךְ דָּוִ֛ד אֶת פְּלִשְׁתִּ֖ים וַ/יַּכְנִיעֵ֑/ם וַ/יִּקַּ֥ח דָּוִ֛ד אֶת מֶ֥תֶג הָ/אַמָּ֖ה מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/001.yaml
  text: And after this[a], David struck the Philistines and subdued them, and David took Metheg-ammah from the hand of the Philistines.
translation:
  language: de
  text: Danach schlug David die Philister und unterwarf sie. David nahm Meteg-Amma[a] aus der Hand der Philister.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck ist schwierig und bedeutet wörtlich etwa „Zaum der Mutter“. Möglicherweise bezeichnet er bildhaft die Herrschaft über die führende Stadt. Vergleiche 1. Chronik 18,1, wo „Gat und seine Tochterstädte“ steht.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Danach
  rationale: Die Wendung leitet die nächste Begebenheit in der Erzählfolge ein. „Danach“ gibt den zeitlichen Übergang natürlich und knapp wieder.
- source_word: וַיַּךְ
  choice: schlug
  rationale: נכה bezeichnet hier im militärischen Zusammenhang das Schlagen eines Gegners. „Schlug“ bewahrt die konkrete Aussage, während das folgende Verb das Ergebnis nennt.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Die im Deutschen übliche Bezeichnung dieses Volkes.
- source_word: וַיַּכְנִיעֵם
  choice: unterwarf sie
  rationale: Das Hifil von כנע bezeichnet das Unterwerfen beziehungsweise In-Unterordnung-Bringen. „Unterwarf sie“ passt zum militärisch-politischen Zusammenhang.
- source_word: וַיִּקַּח
  choice: nahm
  rationale: לקח ist das gewöhnliche Verb für „nehmen“. Die breite Wiedergabe vermeidet eine unnötige Festlegung darauf, ob ausdrücklich Eroberung, Beschlagnahmung oder die Übernahme von Herrschaft gemeint ist.
- source_word: מֶתֶג הָאַמָּה
  choice: Meteg-Amma
  rationale: Die hebräische Wortgruppe ist schwierig und kann wörtlich etwa „Zaum der Mutterstadt“ bedeuten. Die Umschrift im Haupttext lässt offen, ob ein Name oder eine bildhafte Bezeichnung der Herrschaft über die führende Stadt vorliegt; die Fußnote erläutert die Möglichkeiten.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die hebräische Wendung bezeichnet Besitz oder Gewalt. Die wörtliche deutsche Entsprechung ist verständlich und bewahrt das Bild des Ausgangstextes.
