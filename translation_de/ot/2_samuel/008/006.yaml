  text: וַ/יָּ֨שֶׂם דָּוִ֤ד נְצִבִים֙ בַּ/אֲרַ֣ם דַּמֶּ֔שֶׂק וַ/תְּהִ֤י אֲרָם֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נוֹשְׂאֵ֣י מִנְחָ֑ה וַ/יֹּ֤שַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and Aram became servants to David, bringing tribute[c][b]. And Yahweh gave David victory wherever he went.
translation:
  language: de
  text: Und David richtete im Aram von Damaskus[a] Garnisonen ein. Aram wurde David dienstbar und brachte Tribut[b]. Und Jahwe verschaffte David den Sieg, wohin er auch ging[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im syrischen Damaskusgebiet«. Der hebräische Name lautet »Aram« und wird hier beibehalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Aram wurde David zu Dienern, die eine Gabe brachten«. Das hebräische Wort kann »Gabe«, »Opfergabe« oder in diesem politischen Zusammenhang »Tribut« bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Jahwe rettete/befreite David überall, wohin er ging«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... נְצִבִים
  choice: setzte ... Besatzungen ein
  rationale: שׂים bedeutet »setzen, hinstellen, einsetzen«. נְצִבִים kann eingesetzte Amtsträger, Posten oder Garnisonen bezeichnen; im Zusammenhang militärischer Eroberung gibt »Besatzungen« den wahrscheinlichsten Sinn natürlich wieder, ohne ausschließlich Gebäude oder einzelne Statthalter zu bezeichnen.
- source_word: בַּאֲרַם דַּמֶּשֶׂק
  choice: im Aram von Damaskus
  rationale: Der hebräische geografische Name אֲרָם bleibt als »Aram« erhalten. Die Verbindung mit Damaskus bezeichnet das von Damaskus aus beherrschte aramäische Gebiet; »von Damaskus« bildet die knappe hebräische Zuordnung verständlich ab.
- source_word: וַתְּהִי אֲרָם לְדָוִד לַעֲבָדִים
  choice: Aram wurde David dienstbar
  rationale: Wörtlich wird Aram für David »zu Dienern«. Da hier ein politisches Gemeinwesen kollektiv beschrieben wird, bringt »dienstbar« die Unterwerfung und Abhängigkeit zum Ausdruck, ohne den Begriff fälschlich auf persönliche Sklaverei zu verengen.
- source_word: נוֹשְׂאֵי מִנְחָה
  choice: musste Tribut entrichten
  rationale: מִנְחָה kann Gabe, Opfergabe oder Tribut bedeuten. Im Zusammenhang eines unterworfenen Gemeinwesens ist »Tribut« sachlich am treffendsten. »musste ... entrichten« macht das fortdauernde Vasallenverhältnis idiomatisch deutlich.
- source_word: וַיֹּשַׁע
  choice: verschaffte ... den Sieg
  rationale: Der Hifil von ישׁע bezeichnet ein Retten oder Befreien, hier im militärischen Zusammenhang. »den Sieg verschaffen« gibt die kontextuelle Wirkung klar wieder, während die Grundbedeutung in einer Fußnote offengehalten wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname »Jahwe« wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: wohin er auch zog
  rationale: Die Wendung bezeichnet umfassenden Erfolg an jedem Ort, an den David ging. »zog« passt zum Feldzugskontext, ohne das Hebräische unnötig auszubauen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Politische Bedeutung von עֲבָדִים
  choice: dienstbar
  alternative: Diener; Untertanen; Sklaven
  rationale: Der Plural bezeichnet hier die kollektive Unterwerfung Arams. »dienstbar« bewahrt den Dienstgedanken und vermeidet sowohl die individualisierende Vorstellung persönlicher Sklaverei als auch die rein verwaltungssprachliche Verengung auf »Untertanen«.
- issue: Bedeutung von וַיֹּשַׁע im Kriegskontext
  choice: verschaffte ... den Sieg
  alternative: rettete; befreite; half
  rationale: Der unmittelbare Zusammenhang handelt von Davids Feldzügen. Die gewählte Fassung macht die militärische Auswirkung von Jahwes rettendem Handeln verständlich, während die allgemeinere Grundbedeutung durch die Fußnote sichtbar bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze folgen dem hebräischen Erzählstil. »Besatzungen«, »dienstbar« und »Tribut entrichten« sind allgemein verständlich und entsprechen dem militärisch-politischen Zusammenhang; die Fußnoten bewahren die wesentlichen lexikalischen Alternativen.
