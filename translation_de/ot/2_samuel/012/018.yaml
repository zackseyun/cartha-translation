  text: וַ/יְהִ֛י בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וַ/יָּ֣מָת הַ/יָּ֑לֶד וַ/יִּֽרְאוּ֩ עַבְדֵ֨י דָוִ֜ד לְ/הַגִּ֥יד ל֣/וֹ כִּי מֵ֣ת הַ/יֶּ֗לֶד כִּ֤י אָֽמְרוּ֙ הִנֵּה֩ בִ/הְי֨וֹת הַ/יֶּ֜לֶד חַ֗י דִּבַּ֤רְנוּ אֵלָי/ו֙ וְ/לֹא שָׁמַ֣ע בְּ/קוֹלֵ֔/נוּ וְ/אֵ֨יךְ נֹאמַ֥ר אֵלָ֛י/ו מֵ֥ת הַ/יֶּ֖לֶד וְ/עָשָׂ֥ה רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/018.yaml
  text: And on the seventh day the child died. And David’s servants were afraid to tell him that the child was dead[a], for they said, “Behold, while the child was still alive, we spoke to him, and he did not listen to our voice. How then can we say to him, ‘The child is dead’? He may do harm.”
translation:
  language: de
  text: 'Am siebten Tag starb das Kind. Davids Diener fürchteten sich, ihm zu sagen, dass das Kind tot war; denn sie sagten: »Solange das Kind noch lebte, haben wir mit ihm gesprochen, aber er hat nicht auf uns gehört. Wie können wir ihm nun sagen: ›Das Kind ist tot‹? Er könnte etwas Schlimmes tun[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er könnte Böses tun« oder »Er könnte Schaden anrichten«. Möglicherweise ist gemeint, dass er sich selbst etwas antut. Das Hebräische lässt Art und Ziel der befürchteten Handlung offen.'
    reason: Die Fußnote nennt mögliche Wiedergaben und eine mögliche Deutung, ohne sie fälschlich als sämtlich wörtlich zu bezeichnen oder die Mehrdeutigkeit aufzulösen.
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Am siebten Tag
  rationale: Die erzählerische Fortführung durch וַיְהִי wird im Deutschen natürlich durch den zeitlichen Satzanfang wiedergegeben; ein wörtliches »Und es geschah« wäre hier unnötig schwerfällig.
- source_word: וַיָּמָת הַיָּלֶד
  choice: starb das Kind
  rationale: יֶלֶד bezeichnet hier aufgrund des Erzählzusammenhangs das kleine Kind; »Kind« legt kein höheres Alter nahe.
- source_word: וַיִּרְאוּ עַבְדֵי דָוִד
  choice: Davids Diener fürchteten sich
  rationale: ירא bezeichnet hier die Angst beziehungsweise Scheu vor Davids möglicher Reaktion, nicht Ehrfurcht.
- source_word: לְהַגִּיד לוֹ כִּי מֵת הַיֶּלֶד
  choice: ihm zu sagen, dass das Kind tot war
  rationale: הגיד wird im persönlichen Zusammenhang idiomatisch mit »sagen« wiedergegeben; der deutsche Zustandssatz entspricht dem hebräischen מֵת.
- source_word: הִנֵּה בִהְיוֹת הַיֶּלֶד חַי
  choice: Solange das Kind noch lebte
  rationale: הִנֵּה hebt die folgende Überlegung hervor, benötigt in natürlicher deutscher direkter Rede aber kein eigenes »Siehe«. Die Zeitkonstruktion bezeichnet die Phase, in der das Kind noch lebte.
- source_word: דִּבַּרְנוּ אֵלָיו
  choice: haben wir mit ihm gesprochen
  rationale: דבר אל bedeutet »zu/mit jemandem sprechen«; die deutsche Form passt zum Versuch der Diener, auf David einzuwirken.
- source_word: וְלֹא שָׁמַע בְּקוֹלֵנוּ
  choice: aber er hat nicht auf uns gehört
  rationale: Das hebräische Idiom »auf unsere Stimme hören« wird im modernen Deutschen natürlich als »auf uns hören« wiedergegeben und bewahrt den Sinn des Nichtbeachtens.
- source_word: וְאֵיךְ נֹאמַר אֵלָיו
  choice: Wie können wir ihm nun sagen
  rationale: Die rhetorische Frage drückt angesichts seines bisherigen Verhaltens die besorgte Folgerung der Diener aus; »nun« macht diesen Zusammenhang deutlich.
- source_word: וְעָשָׂה רָעָה
  choice: Er könnte etwas Schlimmes tun
  rationale: Die knappe Wendung bezeichnet eine schlimme, böse oder schädliche Handlung, ohne deren Art oder Ziel zu nennen. Die Übersetzung bewahrt diese Offenheit.
theological_decisions:
- issue: Art und Ziel der von David befürchteten Handlung in וְעָשָׂה רָעָה
  choice: Eine nicht näher bestimmte schlimme oder schädliche Handlung
  alternative: Er könnte sich selbst etwas antun; er könnte Böses tun; er könnte heftig reagieren
  rationale: Der hebräische Text nennt weder ein Objekt noch die konkrete Handlung. Deshalb wird weder Selbstverletzung noch eine bestimmte moralische oder psychologische Deutung in den Haupttext eingetragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Unnötig archaische Formeln wie »Und es geschah« und »Siehe« werden vermieden. Die direkte Rede bleibt lebendig, während die abschließende hebräische Mehrdeutigkeit durch Haupttext und Fußnote erhalten bleibt.
