  text: וָ/אֶתְּנָ֨/ה לְ/ךָ֜ אֶת בֵּ֣ית אֲדֹנֶ֗י/ךָ וְ/אֶת נְשֵׁ֤י אֲדֹנֶ֨י/ךָ֙ בְּ/חֵיקֶ֔/ךָ וָ/אֶתְּנָ֣/ה לְ/ךָ֔ אֶת בֵּ֥ית יִשְׂרָאֵ֖ל וִֽ/יהוּדָ֑ה וְ/אִ֨ם מְעָ֔ט וְ/אֹסִ֥פָה לְּ/ךָ֖ כָּ/הֵ֥נָּה וְ/כָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/008.yaml
  text: And I gave you your master's house and your master's wives into your bosom[a], and I gave you the house of Israel and Judah; and if that had been too little[b], I would have added to you such and such things.
translation:
  language: de
  text: Und ich gab dir das Haus deines Herrn und die Frauen deines Herrn in deinen Schoß[a], und ich gab dir das Haus Israel und Juda. Und wenn das zu wenig gewesen wäre, hätte ich dir noch dies und das hinzugefügt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an deine Brust“. Die hebräische Wendung bezeichnet eine enge Aufnahme und kann zugleich Zugehörigkeit oder Besitz ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „noch mehr von dieser Art“. Die hebräische Wendung bleibt unbestimmt und bezeichnet weitere Gaben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: ich gab
  rationale: Das Qal-Wajjiqtol von נתן führt die erzählende Rückschau fort; im Deutschen gibt das Präteritum dies natürlich wieder.
- source_word: בֵּית אֲדֹנֶיךָ
  choice: das Haus deines Herrn
  rationale: בַּיִת kann Haus, Haushalt oder Dynastie bezeichnen. Die konkrete Formulierung bewahrt diese Bedeutungsbreite und den Parallelismus.
- source_word: נְשֵׁי אֲדֹנֶיךָ
  choice: die Frauen deines Herrn
  rationale: Die Konstruktverbindung wird direkt wiedergegeben. „Frauen“ kann hier Ehefrauen bezeichnen, ohne im Deutschen unnötig eng auszulegen.
- source_word: בְּחֵיקֶךָ
  choice: in deinen Schoß
  rationale: חֵיק bezeichnet Brust oder Schoß. Die deutsche Wendung wahrt das körperliche Bild und lässt dessen Sinn von intimer Aufnahme beziehungsweise Besitz bewusst offen.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: das Haus Israel und Juda
  rationale: „Haus“ bewahrt den hebräischen Wortlaut und die Parallele zum Haus des früheren Herrn; gemeint sein können Volk und Herrschaftsbereich.
- source_word: וְאִם מְעָט
  choice: wenn das zu wenig gewesen wäre
  rationale: Die Formulierung drückt eine hypothetische, rückblickend als nicht eingetreten dargestellte Unzulänglichkeit idiomatisch aus.
- source_word: וְאֹסִפָה לְּךָ
  choice: hätte ich dir noch … hinzugefügt
  rationale: Das Hifil von יסף bedeutet hinzufügen oder vermehren; der deutsche Konjunktiv entspricht der hypothetischen Bedingung.
- source_word: כָּהֵנָּה וְכָהֵנָּה
  choice: dies und das
  rationale: Die verdoppelte demonstrative Wendung bezeichnet unbestimmt weitere Dinge dieser Art. „Noch dies und das“ erhält den offenen, steigernden Sinn.
theological_decisions:
- issue: Ob die Aussage als ausdrückliche göttliche Billigung ehelicher Beziehungen Davids zu Sauls Frauen auszulegen ist
  choice: Die Übertragung spricht textnah davon, dass Gott die Frauen des früheren Herrn „in deinen Schoß“ gab.
  alternative: Interpretierend „seinen Harem übergab“ oder abschwächend „seine Frauen deiner Obhut anvertraute“.
  rationale: Der hebräische Text beschreibt einen mit königlicher Nachfolge und Besitz verbundenen Übergang, erläutert dessen genaue rechtliche oder eheliche Bedeutung aber nicht. Die Übersetzung wahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Bildsprache. Kurze Hauptsätze vermeiden eine schwerfällige Häufung von „und“. „Herr“ gibt אֲדֹנֶיךָ im menschlichen Sinn wieder; der Kontext verhindert hier eine Verwechslung mit dem Gottesnamen.
