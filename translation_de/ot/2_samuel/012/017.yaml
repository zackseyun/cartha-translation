  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּקֻ֜מוּ זִקְנֵ֤י בֵית/וֹ֙ עָלָ֔י/ו לַ/הֲקִימ֖/וֹ מִן הָ/אָ֑רֶץ וְ/לֹ֣א אָבָ֔ה וְ/לֹֽא בָרָ֥א אִתָּ֖/ם לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/017.yaml
  text: The elders of his house stood beside him to raise him up from the ground[a], but he was unwilling[b], and he would not eat bread with them.
translation:
  language: de
  text: Da traten die Ältesten seines Hauses[a] zu ihm, um ihn vom Boden aufzurichten. Doch er wollte nicht und aß auch kein Brot mit ihnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ältesten seines Haushalts“. Wörtlich steht im Hebräischen „die Ältesten seines Hauses“.'
    reason: lexical_alternative
  - marker: b
    text: „Brot essen“ kann im Hebräischen allgemein bedeuten, Nahrung zu sich zu nehmen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ ... עָלָיו
  choice: Da traten ... zu ihm
  rationale: קום mit עַל beschreibt hier, wie die Ältesten sich zu dem am Boden liegenden David begeben und bei ihm Stellung nehmen. „Traten zu ihm“ gibt die Szene im Deutschen natürlich wieder, ohne das räumliche Verhältnis unnötig als „über ihm“ festzulegen.
- source_word: זִקְנֵי בֵיתוֹ
  choice: die Ältesten seines Hauses
  rationale: Die formnahe Wiedergabe bewahrt die Mehrdeutigkeit von בַּיִת, das hier sowohl das Haus als Institution als auch den königlichen Haushalt bezeichnen kann.
- source_word: לַהֲקִימוֹ מִן הָאָרֶץ
  choice: um ihn vom Boden aufzurichten
  rationale: 'Die Hifil-Form von קום ist kausativ: Sie wollten bewirken, dass David sich vom Boden erhob. „Aufrichten“ ist dafür idiomatisches und zugleich genaues Deutsch.'
- source_word: וְלֹא אָבָה
  choice: Doch er wollte nicht
  rationale: אָבָה bezeichnet Willigkeit oder Einverständnis. „Er wollte nicht“ bewahrt diese Nuance, ohne das stärkere „er weigerte sich“ einzutragen.
- source_word: וְלֹא בָרָא אִתָּם לָחֶם
  choice: und aß auch kein Brot mit ihnen
  rationale: Die konkrete hebräische Wendung mit לֶחֶם bleibt erhalten; im Kontext bezeichnet sie allgemein die Einnahme von Nahrung. „Auch“ verbindet die zweite Verneinung natürlich mit Davids vorheriger Unwilligkeit.
