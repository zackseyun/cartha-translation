  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֣ה מֵ֗ת לָ֤/מָּה זֶּה֙ אֲנִ֣י צָ֔ם הַ/אוּכַ֥ל לַ/הֲשִׁיב֖/וֹ ע֑וֹד אֲנִי֙ הֹלֵ֣ךְ אֵלָ֔י/ו וְ/ה֖וּא לֹֽא יָשׁ֥וּב אֵלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/023.yaml
  text: But now he is dead. Why should I fast any longer? Can I bring him back again? I am going to him[a], but he will not return to me.
translation:
  language: de
  text: Doch jetzt ist er tot. Warum sollte ich noch fasten? Kann ich ihn wieder zurückbringen? Ich gehe zu ihm[a], aber er wird nicht zu mir zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde zu ihm gehen.“ Das hebräische Partizip kann eine sichere zukünftige Handlung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Doch jetzt
  rationale: Der Ausdruck markiert den Gegensatz zwischen Davids Verhalten vor und nach dem Tod des Kindes; „Doch jetzt“ gibt diesen Umschwung natürlich wieder.
- source_word: מֵת
  choice: ist er tot
  rationale: Die prädikative Form bezeichnet hier den nun bestehenden Zustand des Todes.
- source_word: לָמָּה זֶּה אֲנִי צָם
  choice: Warum sollte ich noch fasten?
  rationale: Die idiomatische rhetorische Frage wird in natürlichem Deutsch wiedergegeben; „noch“ nimmt die zuvor andauernde Fastenpraxis auf.
- source_word: הַאוּכַל לַהֲשִׁיבוֹ עוֹד
  choice: Kann ich ihn wieder zurückbringen?
  rationale: Das Hifil von שוב bedeutet „zurückkehren lassen/zurückbringen“; im Zusammenhang ist die Rückkehr ins Leben gemeint, ohne deren Art näher auszudeuten.
- source_word: אֲנִי הֹלֵךְ אֵלָיו
  choice: Ich gehe zu ihm
  rationale: Das Partizip הֹלֵךְ kann einen gegenwärtig ausgerichteten oder sicheren zukünftigen Vorgang ausdrücken. Die knappe Wiedergabe bewahrt diese Offenheit.
- source_word: וְהוּא לֹא יָשׁוּב אֵלָי
  choice: aber er wird nicht zu mir zurückkehren
  rationale: Das Imperfekt bezeichnet hier die ausbleibende zukünftige Rückkehr; „aber“ verdeutlicht den Gegensatz der Bewegungsrichtungen.
theological_decisions:
- issue: Ob Davids Aussage eine bewusste Wiedervereinigung mit dem verstorbenen Kind im Jenseits lehrt
  choice: „Ich gehe zu ihm“ wird ohne nähere Bestimmung des Zustands nach dem Tod wiedergegeben.
  alternative: Die Aussage ausdrücklich entweder nur auf Davids eigenen Tod und das Totenreich oder auf eine persönliche Wiedervereinigung nach dem Tod beziehen.
  rationale: Der hebräische Text sagt lediglich, dass David zu dem Kind gehen wird, während das Kind nicht zu ihm zurückkehrt. Eine genauere Lehre über den Zwischenzustand oder das Heil verstorbener Kinder soll nicht in den Vers hineingetragen werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die rhetorischen Fragen und die bewusste theologische Offenheit des Hebräischen bleiben erhalten.
