  source_fidelity: 'Die Übersetzung gibt alle vier hebräischen Erzählhandlungen sachgerecht wieder: David versammelt „das ganze Volk“, geht nach Rabba, kämpft gegen die Stadt und nimmt sie ein. „Das ganze Volk“ bewahrt die lexikalische Weite von כָּל־הָעָם; die Fußnote benennt die im militärischen Kontext naheliegenden engeren Lesarten, ohne sie dem Haupttext aufzuzwingen.'
