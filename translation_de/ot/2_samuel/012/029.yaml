  text: וַ/יֶּאֱסֹ֥ף דָּוִ֛ד אֶת כָּל הָ/עָ֖ם וַ/יֵּ֣לֶךְ רַבָּ֑תָ/ה וַ/יִּלָּ֥חֶם בָּ֖/הּ וַֽ/יִּלְכְּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/029.yaml
  text: Then David gathered all the people and went to Rabbah and fought against it and captured it[a].
translation:
  language: de
  text: Da versammelte David das ganze Volk[a], zog nach Rabba, kämpfte gegen die Stadt und eroberte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das ganze Heer« oder »alle Truppen«; wörtlich: »das ganze Volk«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: versammelte
  rationale: אסף bezeichnet hier das Zusammenbringen der Menschen. »Versammelte« ist natürlich und bewahrt den Grundsinn, ohne eine förmliche militärische Musterung vorauszusetzen.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Wörtlich steht »das ganze Volk«. Im Kriegskontext ist wahrscheinlich Davids gesamte Streitmacht gemeint; der Haupttext bewahrt jedoch die weniger spezifische Ausdrucksweise des Hebräischen.
- source_word: רַבָּתָה
  choice: nach Rabba
  rationale: Der Ortsname רַבָּה trägt das Richtungs-He und bezeichnet eine Bewegung auf die Stadt zu. »Nach Rabba« gibt dies idiomatisch wieder.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: kämpfte gegen die Stadt
  rationale: לחם mit ב bezeichnet hier den Kampf gegen Rabba. Die ausdrückliche Wiederaufnahme als »die Stadt« ist im Deutschen klarer als ein mehrdeutiges Pronomen und entspricht dem femininen Bezug im Hebräischen.
- source_word: וַיִּלְכְּדָהּ
  choice: eroberte sie
  rationale: לכד bezeichnet im Zusammenhang mit einer Stadt deren Einnahme. »Eroberte sie« ist präzise, natürlich und nimmt den Bezug auf »die Stadt« auf.
theological_decisions: []
