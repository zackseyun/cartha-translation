  text: וְ/עַתָּ֗ה אֱסֹף֙ אֶת יֶ֣תֶר הָ/עָ֔ם וַ/חֲנֵ֥ה עַל הָ/עִ֖יר וְ/לָכְדָ֑/הּ פֶּן אֶלְכֹּ֤ד אֲנִי֙ אֶת הָ/עִ֔יר וְ/נִקְרָ֥א שְׁמִ֖/י עָלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/028.yaml
  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
translation:
  language: de
  text: Nun versammle den Rest des Heeres, schlag dein Lager vor der Stadt auf und nimm sie ein, sonst nehme ich die Stadt ein, und mein Name wird über ihr ausgerufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und mein Name wird über ihr ausgerufen“. Die Wendung besagt hier, dass Joab die Ehre für die Einnahme der Stadt zugeschrieben würde; sie kann zugleich an eine Benennung oder einen Herrschaftsanspruch anklingen lassen.'
    reason: Erläuterung des hebräischen Idioms und seiner im Kontext vorrangigen Aussage, ohne seine Bildsprache im Haupttext aufzulösen.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun
  rationale: Der Diskursmarker leitet den dringenden nächsten Schritt ein; „Nun“ ist knapp, natürlich und würdig.
- source_word: אֱסֹף
  choice: versammle
  rationale: Der Imperativ von אסף bezeichnet hier das Zusammenführen der verbliebenen Streitkräfte.
- source_word: יֶתֶר הָעָם
  choice: den Rest des Heeres
  rationale: עָם bedeutet grundsätzlich „Volk“, bezeichnet im militärischen Kontext der Belagerung jedoch die übrige Streitmacht.
- source_word: וַחֲנֵה עַל הָעִיר
  choice: belagere die Stadt
  rationale: Wörtlich geht es um das Lagern gegen die Stadt; im gegebenen Kriegskontext gibt „belagere“ die gemeinte Handlung natürlich wieder.
- source_word: וְלָכְדָהּ
  choice: und nimm sie ein
  rationale: לכד bezeichnet bei einer Stadt deren militärische Einnahme; „einnehmen“ ist im Deutschen die übliche Wendung.
- source_word: פֶּן
  choice: Sonst
  rationale: Die Partikel führt eine unerwünschte mögliche Folge ein; „Sonst“ bewahrt Warnung und Folgerelation in natürlichem Deutsch.
- source_word: אֶלְכֹּד אֲנִי
  choice: nehme ich die Stadt ein
  rationale: Die ausdrückliche Wiederholung desselben Verbs wird beibehalten; das hervorgehobene Pronomen אֲנִי wird durch die Wortstellung ausreichend erkennbar.
- source_word: וְנִקְרָא שְׁמִי עָלֶיהָ
  choice: und mein Name wird über ihr ausgerufen
  rationale: Die Wiedergabe bleibt dem hebräischen Bild nahe und bewahrt dessen Bedeutungsbreite zwischen öffentlicher Zuschreibung von Ehre, Anspruch und Benennung.
theological_decisions:
- issue: Bedeutung der Wendung, dass Joabs Name über der Stadt ausgerufen werde
  choice: Das hebräische Bild wird im Haupttext bewahrt.
  alternative: „und die Stadt wird nach mir benannt“ oder „und mir wird die Einnahme der Stadt zugeschrieben“
  rationale: Der Kontext spricht von der Anerkennung für die Eroberung; die Formulierung kann jedoch zugleich Benennung, Anspruch und zugeschriebene Ehre anklingen lassen. Eine engere Deutung würde diese Spannung unnötig auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Heer“, „belagern“ und „einnehmen“ entsprechen dem militärischen Zusammenhang. Das ungewöhnliche Namensidiom bleibt bewusst im Haupttext stehen und wird in der Fußnote erläutert.
