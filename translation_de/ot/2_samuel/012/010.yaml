  text: וְ/עַתָּ֗ה לֹא תָס֥וּר חֶ֛רֶב מִ/בֵּיתְ/ךָ֖ עַד עוֹלָ֑ם עֵ֚קֶב כִּ֣י בְזִתָ֔/נִי וַ/תִּקַּ֗ח אֶת אֵ֨שֶׁת֙ אוּרִיָּ֣ה הַ/חִתִּ֔י לִ/הְי֥וֹת לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/010.yaml
  text: Now therefore[a], the sword shall never depart from your house[b], because you have despised me and have taken the wife of Uriah the Hittite to be your wife.
translation:
  language: de
  text: Darum wird das Schwert niemals von deinem Haus weichen[a], weil du mich verachtet[b] und die Frau Urias, des Hethiters, zu deiner Frau genommen hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Haus“ kann hier die Familie, den Haushalt und die königliche Linie einschließen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich „mich verachtet“: Das Unrecht an Uria und seiner Frau wird als Verachtung Gottes selbst bezeichnet.'
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  choice: Darum
  rationale: Die Wendung leitet hier die aus der vorausgehenden Anklage folgende Gerichtsankündigung ein. „Darum“ gibt diesen folgernden Zusammenhang im Deutschen natürlich wieder.
- source_word: לֹא תָסוּר חֶרֶב ... עַד עוֹלָם
  choice: wird das Schwert niemals ... weichen
  rationale: סור bezeichnet hier das Weichen oder Sich-Entfernen; zusammen mit der Verneinung und עַד עוֹלָם ergibt sich eine anhaltende Gerichtsankündigung. „Niemals weichen“ ist idiomatisch und bewahrt das Bild des Schwertes.
- source_word: מִבֵּיתְךָ
  choice: von deinem Haus
  rationale: „Haus“ bewahrt die Weite des hebräischen Ausdrucks, der Familie, Hausgemeinschaft und königliche Linie umfassen kann.
- source_word: עֵקֶב כִּי
  choice: weil
  rationale: Die Verbindung nennt den Grund für das angekündigte Gericht; „weil“ gibt die kausale Funktion klar und knapp wieder.
- source_word: בְזִתָנִי
  choice: du mich verachtet
  rationale: Das Verb בזה bezeichnet Verachtung oder geringschätzige Behandlung. Das direkte göttliche Objekt „mich“ wird ohne erklärende Erweiterung beibehalten.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: die Frau des Hetiters Uria
  rationale: Die Formulierung hält die bestehende Ehebindung an Uria deutlich fest und folgt der hebräischen Wortgruppe eng.
- source_word: לִהְיוֹת לְךָ לְאִשָּׁה
  choice: dir ... zur Frau genommen
  rationale: Diese im Deutschen natürliche Wendung gibt die hebräische Formulierung für die Aneignung als Ehefrau wieder, ohne den Vorgang weiter auszudeuten.
theological_decisions:
- issue: Bezug des Pronomens in „du mich verachtet“
  choice: Das direkte göttliche „mich“ bleibt stehen.
  alternative: „Du hast das Wort/Gebot des HERRN verachtet.“
  rationale: Der hebräische Text hat ausdrücklich ein Suffix der ersten Person Singular. So bleibt die theologische Spannung erhalten, dass das Unrecht an Uria und seiner Frau als Verachtung Gottes selbst bezeichnet wird.
- issue: Umfang von „deinem Haus“
  choice: Die offene Metapher „Haus“ wird beibehalten.
  alternative: „deine Familie“, „dein Haushalt“ oder „deine Dynastie“
  rationale: Der hebräische Ausdruck kann mehrere dieser Bereiche zugleich umfassen. Eine engere Wiedergabe würde den möglichen Umfang der Gerichtsankündigung vorschnell festlegen.
- issue: Zeitliche Tragweite von עַד עוֹלָם
  choice: „niemals“
  alternative: „für immer“ oder „auf ewig“
  rationale: In Verbindung mit der Verneinung wird die fortdauernde Wirkung idiomatisch als „niemals weichen“ ausgedrückt, ohne die genaue Reichweite des Zeitbegriffs dogmatisch zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist klar und knapp; das biblische Bild vom Schwert und die mehrdeutige Rede vom „Haus“ bleiben erhalten.
