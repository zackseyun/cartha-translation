  text: לְ/עָשִׁ֗יר הָיָ֛ה צֹ֥אן וּ/בָקָ֖ר הַרְבֵּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/002.yaml
  text: The rich man had very many sheep and cattle[a].
translation:
  language: de
  text: Der Reiche hatte sehr viele Schafe und Rinder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein reicher Mann hatte sehr viele Schafe und Rinder.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעָשִׁיר
  choice: Der Reiche
  rationale: Die Verbindung von לְ mit הָיָה drückt Besitz aus. Im Zusammenhang steht der reiche Mann dem armen gegenüber; daher ist die bestimmte Form »der Reiche« im Deutschen passend.
- source_word: הָיָה
  choice: hatte
  rationale: Das wörtliche »war« bildet zusammen mit לְ eine hebräische Besitzkonstruktion, die im modernen Deutschen natürlich mit »hatte« wiedergegeben wird.
- source_word: צֹאן
  choice: Schafe
  rationale: צֹאן bezeichnet kollektiv Kleinvieh, vor allem Schafe und Ziegen. »Schafe« ist hier eine klare, natürliche Wiedergabe im Gegensatz zu den anschließend genannten Rindern.
- source_word: וּבָקָר
  choice: und Rinder
  rationale: בָּקָר bezeichnet Großvieh, gewöhnlich Rinder; »Rinder« ist die übliche moderne deutsche Entsprechung.
- source_word: הַרְבֵּה מְאֹד
  choice: sehr viele
  rationale: Die Wortverbindung verstärkt die Mengenangabe; »sehr viele« bewahrt diese Betonung schlicht und idiomatisch.
