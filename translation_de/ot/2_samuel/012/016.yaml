  text: וַ/יְבַקֵּ֥שׁ דָּוִ֛ד אֶת הָ/אֱלֹהִ֖ים בְּעַ֣ד הַ/נָּ֑עַר וַ/יָּ֤צָם דָּוִד֙ צ֔וֹם וּ/בָ֥א וְ/לָ֖ן וְ/שָׁכַ֥ב אָֽרְצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/016.yaml
  text: And David sought God on behalf of the boy[b][a]. David fasted a fast, and he went in and spent the night and lay on the ground.
translation:
  language: de
  text: Da suchte David Gott um des Jungen willen[a]. David hielt ein Fasten[b], ging hinein, verbrachte die Nacht und lag auf dem Boden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „der Junge“ ist Davids erkranktes Kind gemeint (Verse 15 und 18). Auch „das Kind“ ist als Übersetzung möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen: „fastete ein Fasten“. Diese Verbindung von Verb und stammverwandtem Substantiv hebt das Fasten hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: suchte
  rationale: Das Verb בקש bezeichnet hier ein ernsthaftes Suchen nach Gott zugunsten des Kindes. „Suchte“ bewahrt die offene hebräische Formulierung, ohne die Handlung ausdrücklich als Flehen oder Beten festzulegen.
- source_word: אֶת־הָאֱלֹהִים
  choice: Gott
  rationale: Die Form bezeichnet eindeutig Gott als das unmittelbare Objekt von Davids Suchen.
- source_word: בְּעַד
  choice: um … willen
  rationale: Die Wendung bringt den stellvertretenden, zugunsten des Jungen gerichteten Sinn von בעד prägnant zum Ausdruck.
- source_word: הַנַּעַר
  choice: der Junge
  rationale: נער kann je nach Zusammenhang „Junge“, „junger Mann“, „Diener“ oder „Kind“ bedeuten. Hier ist Davids kleiner Sohn gemeint; „Junge“ entspricht dem verwendeten hebräischen Substantiv, während „Kind“ als kontextuelle Alternative in der Fußnote genannt wird.
- source_word: וַיָּצָם ... צוֹם
  choice: hielt ein Fasten
  rationale: Die natürliche deutsche Wendung bewahrt sowohl die Handlung als auch das im Hebräischen ausdrücklich genannte Substantiv צוֹם. Die figura etymologica wird in einer Fußnote offengelegt, da „fastete ein Fasten“ im Deutschen unidiomatisch wäre.
- source_word: וּבָא
  choice: ging hinein
  rationale: בוא bezeichnet hier das Hineingehen; wohin David ging, lässt der Text unausgesprochen.
- source_word: וְלָן
  choice: verbrachte die Nacht
  rationale: לון bedeutet, über Nacht zu bleiben beziehungsweise die Nacht zu verbringen. Die gewählte Formulierung ist klar und modern.
- source_word: וְשָׁכַב אָרְצָה
  choice: lag auf dem Boden
  rationale: Die Wendung beschreibt Davids liegende Haltung am Boden. „Boden“ ist im Zusammenhang mit dem vorherigen Hineingehen natürlicher als „Erde“, ohne einen genaueren Ort festzulegen.
