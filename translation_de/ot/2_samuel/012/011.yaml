  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי֩ מֵקִ֨ים עָלֶ֤י/ךָ רָעָה֙ מִ/בֵּיתֶ֔/ךָ וְ/לָקַחְתִּ֤י אֶת נָשֶׁ֨י/ךָ֙ לְ/עֵינֶ֔י/ךָ וְ/נָתַתִּ֖י לְ/רֵעֶ֑י/ךָ וְ/שָׁכַב֙ עִם נָשֶׁ֔י/ךָ לְ/עֵינֵ֖י הַ/שֶּׁ֥מֶשׁ הַ/זֹּֽאת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/011.yaml
  text: 'Thus says Yahweh: Behold[a], I am raising up disaster against you from your own house, and I will take your wives before your eyes and give them to your neighbor[b], and he will lie with your wives in the sight of this sun.'
translation:
  language: de
  text: 'So spricht Jahwe: Siehe, ich lasse aus deinem eigenen Haus Unheil gegen dich aufkommen. Ich werde deine Frauen vor deinen Augen nehmen und sie deinem Gefährten[a] geben; er wird vor den Augen dieser Sonne[b] bei deinen Frauen liegen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinem Nächsten“ beziehungsweise „einem dir Nahestehenden“.'
    reason: Das hebräische רֵעַ kann je nach Zusammenhang einen Gefährten, Nächsten, Vertrauten oder Mitmenschen bezeichnen; die Person bleibt im Vers ungenannt.
  - marker: b
    text: 'Das heißt: öffentlich, am helllichten Tag.'
    reason: Die wörtliche Wendung „vor den Augen dieser Sonne“ beschreibt die öffentliche Sichtbarkeit des Geschehens.
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die feste prophetische Botenformel wird in natürlichem, feierlichem Deutsch wiedergegeben; der Gottesname bleibt als Eigenname erkennbar.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: „Siehe“ bewahrt die aufmerksamkeitslenkende und nachdrückliche Funktion der hebräischen Partikel.
- source_word: מֵקִים עָלֶיךָ רָעָה
  choice: ich lasse Unheil gegen dich aufstehen
  rationale: „Unheil“ bezeichnet hier die angekündigte Katastrophe beziehungsweise das Gericht, nicht moralische Bosheit; „aufstehen lassen“ erhält das Bild von קום.
- source_word: מִבֵּיתֶךָ
  choice: aus deinem eigenen Haus
  rationale: „Haus“ umfasst hier Davids Familie und Haushalt; „eigenen“ hebt hervor, dass das Unheil aus seinem engsten Bereich kommt.
- source_word: וְלָקַחְתִּי אֶת נָשֶׁיךָ לְעֵינֶיךָ
  choice: Ich werde deine Frauen vor deinen Augen nehmen
  rationale: Die konkrete Wendung wahrt sowohl die Handlung als auch die öffentliche, für David wahrnehmbare Demütigung.
- source_word: לְרֵעֶיךָ
  choice: deinem Nächsten
  rationale: רֵעַ kann einen Nächsten, Gefährten oder Vertrauten bezeichnen. „Nächster“ wahrt die lexikalische Offenheit, ohne den im Vers nicht genannten Betreffenden festzulegen.
- source_word: וְשָׁכַב עִם נָשֶׁיךָ
  choice: er wird mit deinen Frauen schlafen
  rationale: Die deutsche sexuelle Umschreibung gibt den hebräischen Euphemismus verständlich und ohne zusätzliche Deutung wieder.
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  choice: vor den Augen dieser Sonne
  rationale: Die ungewöhnlich konkrete Personifikation und der demonstrative Ausdruck „dieser Sonne“ bleiben erhalten; eine Fußnote erläutert den Sinn.
theological_decisions:
- issue: Bedeutung von רָעָה im angekündigten göttlichen Gericht
  choice: Unheil
  alternative: Böses
  rationale: Im Zusammenhang bezeichnet das Wort das verhängte Unglück, nicht moralische Bosheit. Die Übersetzung lässt die Aussage bestehen, dass Jahwe dieses Gericht herbeiführt, ohne ihm moralisches Böses zuzuschreiben.
- issue: Identität des רֵעַ
  choice: nicht näher bestimmter „Nächster“
  alternative: Gefährte oder ausdrückliche Identifizierung mit Absalom
  rationale: Der Vers selbst nennt die Person nicht. Die Übersetzung bewahrt diese Unbestimmtheit und importiert die spätere erzählerische Erfüllung nicht in den Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Formel und konkreter Bildsprache. Ungewöhnliche hebräische Wendungen werden dort erhalten, wo sie verständlich bleiben, und knapp in Fußnoten erläutert.
