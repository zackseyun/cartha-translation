  rationale: Die Überarbeitung glättet vor allem die deutsche Satzstellung und wählt mit „deinem Gefährten“ eine eng am hebräischen Ausdruck orientierte, dennoch nicht identifizierende Wiedergabe. Die sexuelle Umschreibung wird in einem dem prophetischen Register entsprechenden Deutsch formuliert. Die Fußnotenanker und ihre Erläuterungen bleiben korrekt zugeordnet.
