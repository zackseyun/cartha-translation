  verdict: revise
  source_fidelity: 'Der Entwurf gibt die prophetische Ankündigung insgesamt treffend wieder: רָעָה ist angemessen als „Unheil“ verstanden, die Herkunft aus Davids Haus bleibt erhalten, und die konkrete öffentliche Bildsprache der abschließenden Wendung wird nicht nivelliert. „Deinem Nächsten“ ist als mögliche Bedeutung von רֵעַ vertretbar, doch „deinem Gefährten“ bildet die singuläre possessive Form und den engeren persönlichen Bezug unmittelbarer ab, ohne die im Vers offene Identität zu bestimmen.'
  naturalness: Die Formulierung „Unheil aus deinem eigenen Haus gegen dich aufstehen“ ist im Deutschen wegen der Stellung der Ergänzungen unnötig schwerfällig. „aus deinem eigenen Haus Unheil gegen dich aufkommen“ ist modernes, würdiges Standarddeutsch und bewahrt den kausativen Sinn von מֵקִים.
  terminology: „Jahwe“, „Unheil“ und „Frauen“ sind konsistent und sachgerecht. „Mit deinen Frauen schlafen“ ist als verständliche sexuelle Umschreibung möglich; „bei deinen Frauen liegen“ wahrt jedoch den biblisch-feierlichen Registerton und die euphemistische Ausdrucksweise des Hebräischen präziser.
  issues:
  - severity: medium
    issue: Unnatürliche Wortstellung bei der Ankündigung des Unheils
    rationale: „Ich lasse Unheil aus deinem eigenen Haus gegen dich aufstehen“ lässt im Deutschen die Beziehungen zwischen Herkunft und Ziel des Unheils sperrig erscheinen. Eine Umstellung verbessert die Lesbarkeit ohne Bedeutungsverschiebung.
  - severity: low
    issue: „Nächsten“ ist für רֵעֶךָ weniger präzise als „Gefährten“
    rationale: Das hebräische Wort kann zwar „Nächster“ bedeuten, bezeichnet mit Possessivsuffix hier aber unmittelbar einen persönlichen Bezugspartner. „Gefährten“ wahrt diesen Bezug und belässt die konkrete Person offen.
  - severity: low
    issue: Register bei „mit deinen Frauen schlafen“
    rationale: Die Formulierung ist verständlich, wirkt aber gegenüber der prophetisch-biblischen Rede etwas alltagssprachlicher. „bei deinen Frauen liegen“ gibt das hebräische Euphemismus idiomatisch und würdig wieder.
