  text: וַ/יִּלָּ֣חֶם יוֹאָ֔ב בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן וַ/יִּלְכֹּ֖ד אֶת עִ֥יר הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/026.yaml
  text: And Joab fought against Rabbah of the Ammonites and captured the royal city[a].
translation:
  language: de
  text: Joab kämpfte gegen Rabba der Ammoniter und eroberte die königliche Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Hauptstadt“. Wörtlich: „die Stadt des Königtums“ beziehungsweise „der Königsherrschaft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֶם
  choice: kämpfte gegen
  rationale: Das Nifal von לחם bezeichnet hier das Führen eines Kampfes gegen einen Gegner; „kämpfte gegen“ ist natürlich und wahrt den militärischen Zusammenhang.
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: Rabba, die Stadt der Ammoniter
  rationale: Rabba ist der Ortsname; בְּנֵי עַמּוֹן bezeichnet die Ammoniter. Der erläuternde Zusatz macht den Bezug im modernen Deutschen klar, ohne den Ort mit der anschließend genannten Königsstadt gleichzusetzen.
- source_word: וַיִּלְכֹּד
  choice: eroberte
  rationale: לכד bedeutet im militärischen Zusammenhang „einnehmen, erobern“; bei einer Stadt ist „eroberte“ idiomatisches modernes Deutsch.
- source_word: עִיר הַמְּלוּכָה
  choice: die Königsstadt
  rationale: Die Wendung lautet wörtlich „Stadt des Königtums/der Königsherrschaft“. „Königsstadt“ bleibt knapp und nahe am Hebräischen, während die Fußnote die mögliche funktionale Deutung nennt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und erzählerisch; die nicht völlig eindeutige Bedeutung von עִיר הַמְּלוּכָה wird nicht im Haupttext aufgelöst, sondern in der Fußnote kenntlich gemacht.
