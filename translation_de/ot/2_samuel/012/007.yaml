source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר נָתָ֛ן אֶל דָּוִ֖ד אַתָּ֣ה הָ/אִ֑ישׁ כֹּה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י מְשַׁחְתִּ֤י/ךָֽ לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֥י הִצַּלְתִּ֖י/ךָ מִ/יַּ֥ד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/007.yaml
  text: 'Then Nathan said to David[a], “You are the man! Thus says Yahweh, the God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul.”'
translation:
  language: de
  text: 'Da sagte Nathan zu David: „Du bist der Mann![a] So spricht Jahwe, der Gott Israels: Ich habe dich zum König über Israel gesalbt, und ich habe dich aus Sauls Hand gerettet.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du bist jener Mann!“ Wörtlich steht im Hebräischen: „Du bist der Mann!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Handlung weiter; „Da“ gibt die erzählerische Abfolge im Deutschen natürlich wieder.
- source_word: אַתָּה הָאִישׁ
  choice: Du bist der Mann!
  rationale: Die nominale Aussage ist nach Nathans Gleichnis zugespitzt und nachdrücklich. Der bestimmte Artikel wird direkt wiedergegeben, ohne das deutende „jener“ in den Haupttext einzutragen.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Dies ist die geläufige, würdevolle deutsche Wiedergabe der prophetischen Botenformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Status-constructus-Verbindung wird klar und unmittelbar wiedergegeben.
- source_word: אָנֹכִי ... וְאָנֹכִי
  choice: Ich ... und ich
  rationale: Die ausdrückliche und wiederholte Nennung des Personalpronomens bewahrt den Nachdruck der beiden göttlichen Handlungen.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: Ich habe dich zum König ... gesalbt
  rationale: „Salben“ erhält die konkrete Handlung und ihre Bedeutung für die Einsetzung in das Königsamt; „zum König“ ist idiomatisches Deutsch.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: Die Präposition bezeichnet hier den Herrschaftsbereich des Königs.
- source_word: הִצַּלְתִּיךָ
  choice: ich habe dich ... gerettet
  rationale: Das Verb bezeichnet die Befreiung aus konkreter Lebensgefahr oder feindlicher Gewalt; „gerettet“ ist im modernen Deutsch klar und natürlich.
- source_word: מִיַּד שָׁאוּל
  choice: aus Sauls Hand
  rationale: Die hebräische Metapher für Sauls Gewalt beziehungsweise Macht bleibt verständlich und quellentreu erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Tetragrammaton als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Königliche Salbung
  choice: zum König gesalbt
  alternative: zum König eingesetzt
  rationale: Die direkte Wiedergabe von משׁח bewahrt sowohl den historischen Vorgang als auch seine theologische Bedeutung, ohne diese näher auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Botenformel „So spricht“ und die Metapher „aus Sauls Hand“ bewahren die Ausdrucksweise des Hebräischen, ohne unnötig altertümlich zu wirken.
