  yaml_path: translation/ot/2_samuel/012/006.yaml
  text: And he must repay the ewe lamb fourfold[a], because he did this thing and because he had no pity.
translation:
  language: de
  text: Und das weibliche Lamm soll er vierfach ersetzen, weil er so etwas getan und kein Erbarmen gezeigt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil er so etwas getan und das weibliche Lamm nicht verschont hat.“ Das hebräische Verb kann sowohl das Verschonen als auch das Handeln aus Mitleid oder Erbarmen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכִּבְשָׂה
  choice: das Lamm
  rationale: כִּבְשָׂה bezeichnet hier ein weibliches Lamm. Im Deutschen ist „Lamm“ natürlich und grammatisch sächlich; „weibliches Lamm“ wäre zwar genauer, klänge im laufenden Urteil jedoch schwerfällig.
- source_word: יְשַׁלֵּם
  choice: soll er … ersetzen
  rationale: Das Piel von שׁלם bezeichnet hier die geschuldete Ersatzleistung. Die Konstruktion mit „soll“ gibt Davids richterlichen Ausspruch wieder; „ersetzen“ passt idiomatisch zum geschädigten Tier.
- source_word: אַרְבַּעְתָּיִם
  choice: vierfach
  rationale: Die Form bezeichnet eine Ersatzleistung in vierfacher Höhe und entspricht der rechtlichen Forderung aus Exodus 21,37 nach deutscher Verszählung.
- source_word: עֵקֶב אֲשֶׁר
  choice: weil
  rationale: Die Wendung leitet die Begründung des Urteils ein; „weil“ ist die natürliche deutsche Entsprechung.
- source_word: עָשָׂה אֶת־הַדָּבָר הַזֶּה
  choice: so etwas getan
  rationale: Die idiomatische Formulierung gibt den vorwurfsvollen Sinn von „diese Sache getan“ in natürlichem modernem Deutsch wieder, ohne die Tat näher auszudeuten.
- source_word: לֹא חָמָל
  choice: kein Erbarmen gezeigt
  rationale: חמל kann sowohl das Verschonen als auch das davon motivierte Mitleid oder Erbarmen bezeichnen. Im Kontext bringt „kein Erbarmen gezeigt“ die moralische Gefühllosigkeit natürlich zum Ausdruck.
