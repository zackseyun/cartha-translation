base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/015.yaml
  text: Then Nathan went to his house[a], and Yahweh struck the child whom Uriah’s wife had borne to David[c][b], and it became sick.
translation:
  language: de
  text: Dann ging Nathan nach Hause. Und Jahwe schlug[a] das Kind, das Urias Frau David geboren hatte,[b] und es wurde krank.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „suchte … heim“ beziehungsweise „schlug … mit einer Plage“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Urias Frau“. Der Text nennt Batseba hier bewusst nicht beim Namen.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „und es erkrankte“. Das hebräische Verb bezeichnet, dass das Kind krank wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Dann ging
  rationale: Das narrative Waw führt die Handlung weiter; „Dann“ gibt die zeitliche Abfolge im heutigen Deutsch natürlich wieder.
- source_word: בֵּיתוֹ
  choice: nach Hause
  rationale: Wörtlich steht „zu/in sein Haus“. Im Deutschen bezeichnet „nach Hause“ in diesem Zusammenhang natürlich Nathans Rückkehr in sein eigenes Haus.
- source_word: וַיִּגֹּף
  choice: schlug
  rationale: Das Verb נָגַף bezeichnet ein schädigendes Schlagen oder Heimsuchen. „Schlug“ bewahrt die direkte Aussage und legt die genaue Art des Leidens nicht vorzeitig fest.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: הַיֶּלֶד
  choice: das Kind
  rationale: Im Kontext ist Davids junges Kind gemeint; „Kind“ ist präzise und natürlich.
- source_word: אֲשֶׁר יָלְדָה אֵשֶׁת אוּרִיָּה לְדָוִד
  choice: das Urias Frau David geboren hatte
  rationale: Die Formulierung bewahrt die hebräische Bezeichnung „Urias Frau“ und ersetzt sie nicht erklärend durch Batsebas Namen.
- source_word: וַיֵּאָנַשׁ
  choice: und es wurde schwer krank
  rationale: Das Verb bezeichnet hier ein ernstes Krankwerden. „Schwer krank“ gibt die Intensität wieder, ohne bereits ausdrücklich den Tod oder Unheilbarkeit zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ erhält ihn, statt ihn durch den traditionellen Titel zu ersetzen.
- issue: Göttliche Urheberschaft des Leidens
  choice: Jahwe schlug das Kind
  alternative: Jahwe ließ das Kind erkranken
  rationale: Der Text schreibt Jahwe die Handlung unmittelbar zu. Die Übersetzung bewahrt diese theologisch spannungsreiche Aussage und schwächt sie nicht zu bloßem Zulassen ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze erhalten den knappen Erzählstil; die direkte göttliche Urheberschaft und die auffällige Bezeichnung „Urias Frau“ bleiben unverändert stehen.
