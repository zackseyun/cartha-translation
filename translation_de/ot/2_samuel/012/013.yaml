  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל נָתָ֔ן חָטָ֖אתִי לַֽ/יהוָ֑ה וַ/יֹּ֨אמֶר נָתָ֜ן אֶל דָּוִ֗ד גַּם יְהוָ֛ה הֶעֱבִ֥יר חַטָּאתְ/ךָ֖ לֹ֥א תָמֽוּת־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/013.yaml
  text: Then David said to Nathan[a], “I have sinned against Yahweh.” And Nathan said to David, “Yahweh also has taken away your sin[b]; you shall not die.”
translation:
  language: de
  text: 'Da sagte David zu Nathan: „Ich habe gegen Jahwe gesündigt.“ Nathan sagte zu David: „Auch Jahwe hat deine Sünde weggenommen[a]; du wirst nicht sterben[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat deine Sünde beseitigt“. Das hebräische Verb bedeutet wörtlich etwa „hat vorübergehen lassen“ und bezeichnet hier das Wegnehmen der Sünde beziehungsweise ihrer Schuldhaftigkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du sollst nicht sterben“. Der hebräische Text sagt lediglich, dass David nicht sterben wird; der rechtliche Zusammenhang kann eine Verschonung von der Todesstrafe nahelegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Ich habe … gesündigt
  rationale: Das Qal-Perfekt in der 1. Person Singular ist ein unmittelbares Schuldbekenntnis. Das deutsche Perfekt drückt die abgeschlossene Tat mit ihrer fortdauernden Bedeutung in diesem Zusammenhang natürlich aus.
- source_word: לַיהוָה
  choice: gegen Jahwe
  rationale: Die Präposition ל bezeichnet hier bei חטא die Person, gegen die sich die Sünde richtet. „Gegen“ entspricht dem üblichen deutschen Sprachgebrauch.
- source_word: גַּם
  choice: auch
  rationale: „Auch“ bewahrt die ergänzende beziehungsweise nachdrücklich anknüpfende Funktion von גַּם, ohne sie stärker auszudeuten.
- source_word: הֶעֱבִיר
  choice: hat … weggenommen
  rationale: Das Hifil von עבר bedeutet wörtlich etwa „vorübergehen lassen“ oder „fortschaffen“. Mit „deine Sünde“ bezeichnet es hier deren Beseitigung; „weggenommen“ ist klar und idiomatisch, ohne den Vorgang theologisch näher zu erklären.
- source_word: חַטָּאתְךָ
  choice: deine Sünde
  rationale: חַטָּאת kann je nach Zusammenhang Sünde, Schuld oder Sündopfer bezeichnen. Hier nimmt das Wort Davids unmittelbar zuvor bekannte Sünde auf.
- source_word: לֹא תָמוּת
  choice: du wirst nicht sterben
  rationale: Das negierte Imperfekt von מות sagt aus, dass David nicht sterben wird. Die Übersetzung wahrt den Wortlaut, statt ausdrücklich „hingerichtet werden“ einzufügen.
- source_word: וַיֹּאמֶר … וַיֹּאמֶר
  choice: Da sagte … Nathan sagte
  rationale: Die deutsche Erzählfolge wird natürlich wiedergegeben, ohne das hebräische ו jeweils schematisch mit „und“ zu übersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet das Tetragramm. „Jahwe“ gibt den offenbarten Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Vergebung in הֶעֱבִיר חַטָּאתְךָ
  choice: Jahwe hat deine Sünde weggenommen
  alternative: Jahwe hat deine Sünde beseitigt; Jahwe hat deine Sünde vorübergehen lassen
  rationale: Der Vers bezeugt, dass Gott Davids Sünde wegnimmt und er deshalb nicht stirbt, erklärt hier aber nicht den Mechanismus der Sühne. Die Formulierung bewahrt diese theologische Offenheit.
- issue: Bedeutung von Davids Nichtsterben
  choice: du wirst nicht sterben
  alternative: du wirst nicht hingerichtet werden
  rationale: Der rechtliche Zusammenhang kann eine Verschonung vom Todesurteil nahelegen, doch der hebräische Wortlaut nennt lediglich das Nichtsterben. Die Übersetzung fügt keine ausdrücklich passive Hinrichtungsaussage hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich. „Jahwe“ bewahrt den Gottesnamen; „weggenommen“ ist allgemein verständlich und lässt die im Vers nicht erläuterte Weise der Vergebung offen.
