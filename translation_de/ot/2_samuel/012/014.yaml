    issue: Mehrdeutiges Pronomen in der Fußnote
    rationale: In „ihn zu verhöhnen“ kann sich „ihn“ formal auf verschiedene vorausgehende Bezugsgrößen beziehen. Die ausdrückliche Nennung Jahwes macht die alternative Deutung transparent.
