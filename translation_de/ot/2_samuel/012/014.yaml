source:
  edition: WLC
  text: אֶ֗פֶס כִּֽי נִאֵ֤ץ נִאַ֨צְתָּ֙ אֶת אֹיְבֵ֣י יְהוָ֔ה בַּ/דָּבָ֖ר הַ/זֶּ֑ה גַּ֗ם הַ/בֵּ֛ן הַ/יִּלּ֥וֹד לְ/ךָ֖ מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/014.yaml
  text: Nevertheless[a], because by this matter you have utterly scorned the enemies of Yahweh, the son born to you will surely die.
translation:
  language: de
  text: Doch weil du durch diese Sache die Feinde Jahwes zutiefst verachtet hast[a], wird auch der Sohn, der dir geboren wurde, ganz gewiss sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Viele Übersetzungen geben den schwierigen hebräischen Satz sinngemäß so wieder: „Du hast den Feinden Jahwes Anlass gegeben, Jahwe zu verhöhnen“ oder „zu lästern“. Dies beruht auf einer interpretierenden oder textkritisch geänderten Lesart.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶפֶס
  choice: Doch
  rationale: Leitet nach der zuvor zugesagten Vergebung eine starke gegensätzliche Einschränkung ein; „Doch“ ist im modernen Deutsch knapp und würdevoll.
- source_word: כִּי
  choice: weil
  rationale: Kennzeichnet den Grund für die angekündigte Folge.
- source_word: נִאֵץ נִאַצְתָּ
  choice: zutiefst verachtet hast
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage; „zutiefst“ gibt diese Emphase natürlich wieder.
- source_word: אֶת אֹיְבֵי יְהוָה
  choice: die Feinde Jahwes
  rationale: Folgt der vorliegenden masoretischen Syntax, in der die Wendung als direktes Objekt des Verbs erscheint.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen in seiner im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בַּדָּבָר הַזֶּה
  choice: durch diese Sache
  rationale: דָּבָר bezeichnet hier die betreffende Angelegenheit beziehungsweise Tat; „Sache“ bewahrt die Breite des Ausdrucks.
- source_word: גַּם
  choice: auch
  rationale: Bewahrt die additive beziehungsweise hervorhebende Funktion der Partikel beim Übergang zur angekündigten Folge.
- source_word: הַבֵּן הַיִּלּוֹד לְךָ
  choice: der Sohn, der dir geboren worden ist
  rationale: Bewahrt sowohl das ausdrücklich männliche בֵּן als auch den passiven Charakter des Partizips.
- source_word: מוֹת יָמוּת
  choice: wird ganz gewiss sterben
  rationale: Die emphatische Verbindung aus Infinitivus absolutus und finitem Verb drückt sichere Gewissheit aus.
theological_decisions:
- issue: Subjekt-Objekt-Verhältnis in der Wendung mit den „Feinden Jahwes“
  choice: David hat durch diese Sache „die Feinde Jahwes“ zutiefst verachtet.
  alternative: David hat den Feinden Jahwes Anlass gegeben, Jahwe zu verhöhnen beziehungsweise zu lästern; andere Deutungen lesen, David habe Jahwe selbst verachtet.
  rationale: Der Haupttext folgt der unmittelbar vorliegenden masoretischen Wortfolge und lässt deren schwierigen Sinn stehen. Die verbreitete interpretierende oder textkritisch geänderte Lesart wird in der Fußnote genannt, ohne die Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der schwierige masoretische Haupttext bleibt erhalten; die geläufige Alternativdeutung wird transparent in der Fußnote dokumentiert.
