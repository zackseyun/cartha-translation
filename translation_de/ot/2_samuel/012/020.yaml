base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/020.yaml
  text: Then David got up from the ground[a], washed, anointed himself, and changed his clothes. He went into the house of Yahweh and bowed down. Then he went to his house, asked, and they set bread before him, and he ate.
translation:
  language: de
  text: Da stand David vom Boden auf, wusch sich, salbte sich und wechselte seine Kleidung. Dann ging er in das Haus Jahwes und warf sich nieder.[a] Danach ging er in sein Haus und bat, und man setzte ihm Brot vor, und er aß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „betete an“. Das hebräische Verb kann das körperliche Niederwerfen als Ausdruck von Ehrerbietung oder Anbetung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם ... מֵהָאָרֶץ
  choice: stand ... vom Boden auf
  rationale: Gibt das körperliche Aufstehen nach Davids Liegen auf dem Boden im Trauerkontext natürlich wieder.
- source_word: וַיִּרְחַץ
  choice: wusch sich
  rationale: רחץ bezeichnet hier das Waschen beziehungsweise Baden; die reflexive deutsche Form passt zur persönlichen Reinigung.
- source_word: וַיָּסֶךְ
  choice: salbte sich
  rationale: סוך meint das Auftragen von Öl auf den eigenen Körper und markiert hier das Ende des Trauerverhaltens.
- source_word: וַיְחַלֵּף שִׂמְלֹתוֹ
  choice: wechselte seine Kleidung
  rationale: Natürliches modernes Deutsch für den Kleidungswechsel; das Substantiv bezeichnet hier die Kleidung insgesamt.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Bewahrt die gebräuchliche biblische Bezeichnung für das Heiligtum und gibt den Gottesnamen als Eigennamen wieder.
- source_word: וַיִּשְׁתָּחוּ
  choice: warf sich nieder
  rationale: Bewahrt zunächst die konkrete Körperhandlung des Sich-Niederwerfens, während der Kontext zugleich Verehrung erkennen lässt.
- source_word: וַיִּשְׁאַל
  choice: verlangte etwas
  rationale: Das hebräische Verb steht ohne ausdrückliches Objekt. Die Formulierung bleibt unbestimmt, klingt aber im Deutschen vollständiger als ein bloßes 'bat'.
- source_word: וַיָּשִׂימוּ לוֹ לֶחֶם
  choice: man setzte ihm Brot vor
  rationale: Gibt das unbestimmte pluralische Subjekt idiomatisch mit 'man' wieder und bewahrt לֶחֶם konkret als 'Brot'.
- source_word: וַיֹּאכַל
  choice: er aß
  rationale: Schlichte Wiedergabe des abschließenden Erzählverbs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. 'Jahwe' bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von וַיִּשְׁתָּחוּ
  choice: warf sich nieder
  alternative: betete an
  rationale: Die gewählte Fassung erhält die körperliche Bedeutung des Verbs und löst nicht vollständig auf, ob Handlung oder religiöse Funktion hervorgehoben wird; im Haus Jahwes ist Verehrung jedoch klar mitgemeint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. 'Haus Jahwes' hält den biblischen Ausdruck fest; 'warf sich nieder' bewahrt die anschauliche Handlung und ihre religiöse Spannung.
