base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/021.yaml
  text: Then his servants said to him[a], “What is this thing that you have done? While the child was alive, you fasted and wept; but when the child died, you got up and ate bread.”
translation:
  language: de
  text: 'Da sagten seine Diener zu ihm: „Was hast du da getan? Als das Kind noch lebte, hast du seinetwegen gefastet und geweint. Doch als das Kind starb, bist du aufgestanden und hast Brot gegessen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Brot gegessen“; im Hebräischen eine übliche Wendung für das Essen von Nahrung oder einer Mahlzeit.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ עֲבָדָיו אֵלָיו
  choice: Da sagten seine Diener zu ihm
  rationale: „Da“ führt die Handlung natürlich fort. עֲבָדָיו bezeichnet im königlichen Hofzusammenhang passend Davids Diener, ohne ihren rechtlichen Status unnötig festzulegen.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָה
  choice: Was hast du da getan?
  rationale: Die idiomatische deutsche Frage bewahrt das erstaunte und vorwurfsvolle Nachfragen der Diener, ohne die im Deutschen schwerfällige Formulierung „Was ist diese Sache?“ nachzuahmen.
- source_word: בַּעֲבוּר הַיֶּלֶד חַי
  choice: Als das Kind noch lebte, hast du seinetwegen
  rationale: Die Formulierung gibt sowohl den Bezug auf das Kind (בַּעֲבוּר, „seinetwegen“) als auch den zeitlichen Gegensatz zwischen seinem Leben und Tod wieder. „Kind“ passt hier besser als „Junge“ zum Säugling im Kontext.
- source_word: צַמְתָּ וַתֵּבְךְּ
  choice: hast du ... gefastet und geweint
  rationale: Direkte, natürliche Wiedergabe der beiden Verben; „geweint“ wahrt den ernsten Erzählton.
- source_word: וְכַאֲשֶׁר מֵת הַיֶּלֶד
  choice: Doch als das Kind starb
  rationale: „Doch“ macht den im Zusammenhang klaren Gegensatz sichtbar; „starb“ gibt das dynamische hebräische Verb wieder.
- source_word: קַמְתָּ וַתֹּאכַל לָחֶם
  choice: bist du aufgestanden und hast Brot gegessen
  rationale: „Aufgestanden“ gibt קום im Kontext natürlich wieder. „Brot gegessen“ bewahrt das konkrete hebräische Bild, während die Fußnote auf den weiteren idiomatischen Sinn hinweist.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Parallelismus und der starke Gegensatz zwischen dem Verhalten vor und nach dem Tod des Kindes bleiben erhalten.
