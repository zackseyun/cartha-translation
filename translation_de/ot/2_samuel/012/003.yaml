source:
  edition: WLC
  text: וְ/לָ/רָ֣שׁ אֵֽין כֹּ֗ל כִּי֩ אִם כִּבְשָׂ֨ה אַחַ֤ת קְטַנָּה֙ אֲשֶׁ֣ר קָנָ֔ה וַ/יְחַיֶּ֕/הָ וַ/תִּגְדַּ֥ל עִמּ֛/וֹ וְ/עִם בָּנָ֖י/ו יַחְדָּ֑ו מִ/פִּתּ֨/וֹ תֹאכַ֜ל וּ/מִ/כֹּס֤/וֹ תִשְׁתֶּה֙ וּ/בְ/חֵיק֣/וֹ תִשְׁכָּ֔ב וַ/תְּהִי ל֖/וֹ כְּ/בַֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/003.yaml
  text: But the poor man had nothing except one little ewe lamb[a], which he had bought. He kept it alive, and it grew up with him and with his children together; it would eat from his morsel and drink from his cup and lie in his bosom[c][b], and it was like a daughter to him.
translation:
  language: de
  text: Der Arme aber hatte nichts außer einem einzigen kleinen weiblichen Lamm, das er gekauft hatte. Er hielt es am Leben, und es wuchs zusammen mit ihm und seinen Söhnen auf. Es aß von seinem Bissen, trank aus seinem Becher und lag in seinem Schoß[b]; es war für ihn wie eine Tochter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „an seiner Brust“ oder „in seinen Armen“. Das hebräische Wort bezeichnet den Brust-, Arm- oder Schoßbereich und drückt hier innige Nähe aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  choice: der Arme
  rationale: Bezeichnet einen armen beziehungsweise mittellosen Mann und wahrt den erzählerischen Gegensatz zum reichen Mann.
- source_word: אֵין כֹּל כִּי אִם
  choice: hatte nichts außer
  rationale: Gibt die ausschließende Wendung natürlich und vollständig wieder.
- source_word: כִּבְשָׂה אַחַת קְטַנָּה
  choice: ein einziges kleines weibliches Lamm
  rationale: Bewahrt Einzahl, Kleinheit und das ausdrücklich weibliche Geschlecht; „einziges“ bringt אַחַת im Kontext des alleinigen Besitzes zur Geltung.
- source_word: אֲשֶׁר קָנָה
  choice: das er gekauft hatte
  rationale: קנה bedeutet hier am naheliegendsten „kaufen“; das Plusquamperfekt ordnet den Kauf vor der weiteren Pflege ein.
- source_word: וַיְחַיֶּהָ
  choice: Er hielt es am Leben
  rationale: Gibt den kausativen Sinn des Hifil unmittelbar wieder, ohne ihn auf „aufziehen“ oder „nähren“ zu verengen.
- source_word: וַתִּגְדַּל
  choice: es wuchs ... auf
  rationale: Beschreibt im häuslichen Zusammenhang natürlich das Heranwachsen des Lammes.
- source_word: עִמּוֹ וְעִם בָּנָיו יַחְדָּו
  choice: bei ihm und seinen Söhnen auf, mit ihnen zusammen
  rationale: Bewahrt das formale „seinen Söhnen“ sowie die Betonung durch יַחְדָּו; die deutsche Formulierung bleibt verständlich.
- source_word: מִפִּתּוֹ
  choice: von seinem Bissen
  rationale: פַּת bezeichnet ein Stück beziehungsweise einen Bissen Brot oder Speise und unterstreicht das unmittelbare Teilen.
- source_word: מִכֹּסוֹ
  choice: aus seinem Becher
  rationale: Natürliche deutsche Wiedergabe des konkreten Besitzbildes.
- source_word: בְחֵיקוֹ
  choice: an seiner Brust
  rationale: חֵיק kann Brust, Schoß oder den Bereich der Arme bezeichnen; „an seiner Brust“ vermittelt Nähe und Zuneigung ohne altertümlich zu wirken.
- source_word: תִשְׁכָּב
  choice: lag
  rationale: Bewahrt den Grundsinn „liegen“, ohne Schlaf ausdrücklich vorauszusetzen.
- source_word: וַתְּהִי לוֹ כְּבַת
  choice: es war für ihn wie eine Tochter
  rationale: Erhält den ausdrücklichen Vergleich und die starke familiäre Zuneigung.
theological_decisions:
- issue: Vermenschlichende häusliche Bildsprache für das Lamm
  choice: Die innige familiäre Sprache wird ungeschmälert beibehalten.
  alternative: Die Bilder abschwächen, um Sentimentalität zu vermeiden.
  rationale: Das Hebräische steigert bewusst das Mitgefühl, indem es das Lamm als geliebtes Mitglied des Haushalts schildert.
- issue: Wiedergabe von בָּנָיו
  choice: seinen Söhnen
  alternative: seinen Kindern
  rationale: Das Hebräische bezeichnet formal seine Söhne. Da „Söhne“ im Deutschen in diesem Satz natürlich verständlich ist, wird die genauere Wiedergabe gewählt und keine geschlechtsumfassende Bedeutung vorausgesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge folgt dem hebräischen Aufbau, wird aber für einen natürlichen deutschen Erzählfluss leicht gegliedert. Die emotionale Intensität der Parabel bleibt erhalten; altertümliches „an seinem Busen“ wird vermieden.
