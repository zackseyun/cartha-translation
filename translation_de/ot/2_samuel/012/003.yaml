  to: Der Arme aber hatte nichts außer einem einzigen kleinen weiblichen Lamm, das er gekauft hatte. Er hielt es am Leben, und es wuchs zusammen mit ihm und seinen Söhnen auf. Es aß von seinem Bissen, trank aus seinem Becher und lag in seinem Schoß[b]; es war für ihn wie eine Tochter.
  rationale: Die irreführende Fußnote a wird entfernt. Der Satz über das Aufwachsen wird idiomatischer gefasst, ohne die Betonung des gemeinsamen Haushaltslebens zu verlieren. „in seinem Schoß“ bildet die Lokalangabe בְּחֵיקוֹ präzise und natürlich ab; die möglichen Nuancen werden in der Fußnote dokumentiert.
