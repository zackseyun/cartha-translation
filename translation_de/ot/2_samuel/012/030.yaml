  text: וַ/יִּקַּ֣ח אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וּ/מִשְׁקָלָ֨/הּ כִּכַּ֤ר זָהָב֙ וְ/אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑ד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/030.yaml
  text: He took the crown of their king from his head[a]. Its weight was a talent of gold, and in it was a precious stone, and it was placed on David’s head[b]. He brought out the spoil of the city in very great quantity.
translation:
  language: de
  text: Er nahm ihrem König die Krone vom Kopf[a]. Sie wog ein Talent Gold und hatte einen kostbaren Stein; dann wurde sie David auf den Kopf gesetzt[b]. Er brachte aus der Stadt sehr viel Beute heraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er nahm Milkom die Krone vom Kopf.“ Der hebräische Ausdruck kann auch als Name des ammonitischen Gottes Milkom (auch Malkam) verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Ein Talent war eine sehr große Gewichtseinheit. Es wird häufig auf ungefähr 34 Kilogramm geschätzt; die antiken Gewichtsstandards waren jedoch nicht überall gleich.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: Krone
  rationale: Bezeichnet hier im königlichen Zusammenhang eine Krone oder ein Diadem; „Krone“ ist die natürliche und allgemein verständliche deutsche Entsprechung.
- source_word: מַלְכָּם
  choice: ihrem König
  rationale: Die Form lässt sich als „ihr König“ verstehen; dies passt unmittelbar zu der Krone, die von seinem Kopf genommen wird. Die mögliche Lesung als Gottesname bleibt in Fußnote [a] erhalten.
- source_word: מֵעַל רֹאשׁוֹ
  choice: vom Kopf
  rationale: Gibt die räumliche Bewegung von der Oberseite des Kopfes im heutigen Deutsch natürlich wieder, ohne den hebräischen Sinn abzuschwächen.
- source_word: כִּכַּר זָהָב
  choice: ein Talent Gold
  rationale: כִּכָּר bezeichnet eine sehr große antike Gewichtseinheit. Der etablierte Fachausdruck „Talent“ bewahrt den historischen Maßbegriff.
- source_word: וְאֶבֶן יְקָרָה
  choice: war mit einem kostbaren Stein besetzt
  rationale: Der hebräische Ausdruck ist knapp („und ein kostbarer Stein“). Die Formulierung macht den naheliegenden Bezug des Steins zur Krone verständlich, ohne seine genaue Fassung näher zu bestimmen.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִד
  choice: dann wurde sie David auf den Kopf gesetzt
  rationale: Drückt den erzählten Übergang der Krone auf Davids Kopf natürlich aus; das feminine Pronomen bezieht sich auf „Krone“.
- source_word: וּשְׁלַל הָעִיר
  choice: Aus der Stadt … Beute
  rationale: שָׁלָל ist Kriegsbeute. Die deutsche Satzstellung verbindet die Beute klar mit der eroberten Stadt.
- source_word: הוֹצִיא הַרְבֵּה מְאֹד
  choice: ließ er … in sehr großer Menge wegschaffen
  rationale: Der Hifil von יצא bedeutet „hinausbringen lassen“ bzw. „wegschaffen“. Die kausative Wiedergabe und die starke Mengenangabe entsprechen dem Hebräischen.
theological_decisions:
- issue: Ob מַלְכָּם „ihr König“ oder den Namen des ammonitischen Gottes Milkom/Malkam bezeichnet
  choice: ihrem König
  alternative: Milkom (auch Malkam)
  rationale: Die vokalisierte Form und der unmittelbare Zusammenhang mit „seinem Kopf“ stützen die personale königliche Lesung. Da die Deutung als Gottesname sprachlich und traditionsgeschichtlich belegt ist, wird sie nicht ausgeschlossen, sondern in Fußnote [a] bewahrt.
translation_notes:
  register: Moderne, würdige Erzählsprache. „Talent“ bleibt als historischer Maßbegriff stehen und wird erklärt. Die Formulierung „war mit einem kostbaren Stein besetzt“ löst nur den syntaktisch knappen Bezug auf die Krone auf; die echte Mehrdeutigkeit von מַלְכָּם bleibt durch Fußnote [a] sichtbar.
