  naturalness: Die Sprache ist modern, klar und erzählerisch angemessen. „Er brachte aus der Stadt sehr viel Beute heraus“ ist im Deutschen flüssig und zugleich näher am Verb. Die Satzverbindung mit Semikolon bleibt gut lesbar.
