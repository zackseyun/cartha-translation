source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אֶת נָתָ֖ן אֶל דָּוִ֑ד וַ/יָּבֹ֣א אֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁנֵ֣י אֲנָשִׁ֗ים הָיוּ֙ בְּ/עִ֣יר אֶחָ֔ת אֶחָ֥ד עָשִׁ֖יר וְ/אֶחָ֥ד רָֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/001.yaml
  text: Then Yahweh sent Nathan to David. He came to him and said to him[a], “There were two men in one city, one rich and one poor.”
translation:
  language: de
  text: 'Da sandte Jahwe Nathan zu David. Er kam zu ihm und sagte zu ihm: »In einer Stadt gab es zwei Männer, der eine war reich, der andere arm.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: שׁלח bezeichnet hier im fortlaufenden Erzählstil das Senden einer Person mit einem Auftrag; „sandte“ ist präzise und im biblischen Erzählregister natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, um den im Hebräischen stehenden Eigennamen zu bewahren und nicht durch einen Titel zu ersetzen.
- source_word: אֶת נָתָן
  choice: Nathan
  rationale: Die unübersetzte Objektmarkierung אֶת kennzeichnet Nathan als direktes Objekt; der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אֶל דָּוִד
  choice: zu David
  rationale: אֶל bezeichnet hier das Ziel von Nathans Sendung. „Zu David“ vermeidet die überdeutende Wiedergabe „gegen David“.
- source_word: וַיָּבֹא אֵלָיו
  choice: Er kam zu ihm
  rationale: בוא mit אֶל beschreibt Nathans unmittelbares Kommen zu David; die Pronomenreferenz bleibt wie im Hebräischen erhalten.
- source_word: וַיֹּאמֶר לוֹ
  choice: und sagte zu ihm
  rationale: Der ausdrücklich genannte indirekte Bezug לוֹ wird bewahrt. „Sagte“ entspricht dem gewöhnlichen Erzählgebrauch von אמר.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: zwei Männer
  rationale: אֲנָשִׁים bezeichnet in diesem Gleichnis zwei männliche Personen; „Männer“ ist sachlich und idiomatisch.
- source_word: הָיוּ בְּעִיר אֶחָת
  choice: In einer Stadt lebten
  rationale: Das existentielle היה wird im Deutschen in dieser Gleichniseröffnung mit „lebten“ natürlich ausgedrückt; „es waren ... in einer Stadt“ wäre formnäher, aber weniger idiomatisch.
- source_word: אֶחָד עָשִׁיר וְאֶחָד רָאשׁ
  choice: der eine war reich, der andere arm
  rationale: Die knappen hebräischen Nominalsätze werden durch „war“ ergänzt. Die deutsche Gegenüberstellung „der eine ... der andere“ gibt den Kontrast klar und natürlich wieder; רָאשׁ bedeutet hier „arm“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen; „der HERR“ ersetzt ihn durch einen Titel, während „Jehova“ auf einer späteren Verbindung der Konsonanten mit fremden Vokalzeichen beruht.
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. Die Satzfolge bleibt eng am hebräischen Text, während „lebten“ und „der eine ... der andere“ für natürliches Standarddeutsch sorgen. Keine Fußnote ist nötig, da die idiomatische Wiedergabe keine sachlich bedeutsame Mehrdeutigkeit verdeckt.
