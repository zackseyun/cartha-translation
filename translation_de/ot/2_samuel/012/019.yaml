source:
  edition: WLC
  text: וַ/יַּ֣רְא דָּוִ֗ד כִּ֤י עֲבָדָי/ו֙ מִֽתְלַחֲשִׁ֔ים וַ/יָּ֥בֶן דָּוִ֖ד כִּ֣י מֵ֣ת הַ/יָּ֑לֶד וַ/יֹּ֨אמֶר דָּוִ֧ד אֶל עֲבָדָ֛י/ו הֲ/מֵ֥ת הַ/יֶּ֖לֶד וַ/יֹּ֥אמְרוּ מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/019.yaml
  text: When David saw that his servants were whispering[a], David understood that the child was dead. So David said to his servants, “Is the child dead?” And they said, “He is dead.”
translation:
  language: de
  text: 'Als David sah, dass seine Diener miteinander flüsterten, erkannte er, dass das Kind tot war. Da sagte David zu seinen Dienern: »Ist das Kind tot?« Sie antworteten: »Es ist tot.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet die Antwort im Hebräischen nur: »Tot.«'
    reason: Die deutsche Übersetzung ergänzt »Es ist« für einen natürlichen vollständigen Satz.
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: Die Grundbedeutung von ראה bezeichnet hier die visuelle Wahrnehmung, aus der David einen Schluss zieht; »sah« ist direkt und natürlich.
- source_word: מִתְלַחֲשִׁים
  choice: miteinander flüsterten
  rationale: Das Hitpael-Partizip von לחש bezeichnet leises, vertrauliches Reden; »miteinander flüsterten« macht den wechselseitigen Vorgang im Deutschen natürlich deutlich.
- source_word: וַיָּבֶן
  choice: erkannte
  rationale: בין bezeichnet hier das Erfassen eines Sachverhalts anhand beobachteter Anzeichen. »Erkannte« gibt diesen Folgerungsvorgang idiomatisch wieder.
- source_word: מֵת
  choice: tot war / tot / Es ist tot
  rationale: מֵת bezeichnet in diesem Zusammenhang den Zustand des Totseins. Die unterschiedlichen deutschen Formen entsprechen der indirekten Aussage, der Frage und der knappen Antwort.
- source_word: הַיָּלֶד
  choice: das Kind
  rationale: יֶלֶד kann »Kind« oder »Junge« bedeuten; angesichts des Säuglings im Kontext ist »das Kind« am treffendsten.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עֶבֶד kann je nach Kontext Diener, Bediensteter oder Sklave bezeichnen. Hier sind Angehörige des königlichen Haushalts gemeint; »Diener« bewahrt die übliche Ausdrucksweise, ohne den rechtlichen Status festzulegen.
- source_word: הֲמֵת הַיֶּלֶד
  choice: Ist das Kind tot?
  rationale: Die Fragepartikel mit dem Prädikat מֵת fragt unmittelbar nach dem Zustand des Kindes; die deutsche Formulierung bildet dies genau und natürlich ab.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: sagte ... antworteten
  rationale: אמר bedeutet grundsätzlich »sagen«. Beim zweiten Vorkommen macht »antworteten« die im Kontext eindeutige Gesprächsfunktion im Deutschen flüssig, ohne den Inhalt zu erweitern.
