  text: מַדּ֜וּעַ בָּזִ֣יתָ אֶת דְּבַ֣ר יְהוָ֗ה לַ/עֲשׂ֣וֹת הָ/רַע֮ ב/עינ/ו אֵ֣ת אוּרִיָּ֤ה הַֽ/חִתִּי֙ הִכִּ֣יתָ בַ/חֶ֔רֶב וְ/אֶ֨ת אִשְׁתּ֔/וֹ לָקַ֥חְתָּ לְּ/ךָ֖ לְ/אִשָּׁ֑ה וְ/אֹת֣/וֹ הָרַ֔גְתָּ בְּ/חֶ֖רֶב בְּנֵ֥י עַמּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/009.yaml
  text: Why have you despised the word of Yahweh[a], to do what is evil in his sight? You struck down Uriah the Hittite with the sword, and took his wife for yourself as a wife[c][b], and killed him with the sword of the Ammonites.
translation:
  language: de
  text: Warum hast du das Wort Jahwes[a] verachtet und getan, was in seinen Augen böse ist? Uria, den Hetiter, hast du mit dem Schwert erschlagen; seine Frau hast du dir zur Frau genommen[b], und ihn selbst hast du mit dem Schwert der Ammoniter getötet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum hast du das Wort Jahwes geringschätzig behandelt?“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seine Frau hast du dir zur Frau genommen“. Die Formulierung betont Davids persönliche Aneignung.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „mit dem Schwert der Söhne Ammons“. Gemeint ist, dass David Urias Tod durch die Ammoniter herbeiführte.'
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Die direkte Frage eröffnet Nathans anklagende Rede und gibt die rhetorische Schärfe natürlich wieder.
- source_word: בָּזִיתָ
  choice: hast du … verachtet
  rationale: בזה bezeichnet Verachtung oder Geringschätzung und ist stärker als bloßer Ungehorsam.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ bewahrt die hebräische Ausdrucksweise; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינָיו
  choice: und getan, was in seinen Augen böse ist
  rationale: Die Formulierung erhält die bildhafte hebräische Bewertungsformel und verbindet Davids Tat unmittelbar mit seiner Verachtung von Jahwes Wort.
- source_word: הִכִּיתָ בַחֶרֶב
  choice: hast du mit dem Schwert erschlagen
  rationale: נכה bedeutet hier gewaltsam niederschlagen beziehungsweise erschlagen; die Schwertformulierung und die rhetorische Steigerung zum späteren הרג bleiben erhalten.
- source_word: לָקַחְתָּ לְּךָ לְאִשָּׁה
  choice: hast du dir zur Frau genommen
  rationale: Das reflexive „dir“ bewahrt den eigennützigen Nachdruck von לְךָ, während „zur Frau“ die eheliche Aneignung ausdrücklich bezeichnet.
- source_word: הָרַגְתָּ
  choice: hast du … getötet
  rationale: הרג ist das allgemeine Verb für töten; die moralische Schuld wird durch den Kontext deutlich, ohne das Verb interpretierend zu „ermorden“ zu verschärfen.
- source_word: בְּחֶרֶב בְּנֵי עַמּוֹן
  choice: durch das Schwert der Ammoniter
  rationale: „Durch“ macht verständlich, dass David Urias Tod mittels der ammonitischen Streitkräfte herbeiführte, und bewahrt zugleich das wiederholte Schwertmotiv.
- source_word: אוּרִיָּה הַחִתִּי
  choice: Uria, den Hetiter
  rationale: Dies sind die im modernen deutschen Bibelsprachgebrauch geläufigen Formen des Namens und der Herkunftsbezeichnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Davids mittelbare Verantwortung für Urias Tod
  choice: durch das Schwert der Ammoniter getötet
  alternative: mit dem Schwert der Ammoniter getötet
  rationale: Die Präposition „durch“ verdeutlicht die im Kontext gemeinte mittelbare Täterschaft, ohne David von der im hebräischen Text ausdrücklich zugerechneten Tötung zu entlasten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer anklagender Satzführung. Die Voranstellung von „Uria, den Hetiter“ und „seine Frau“ erhält den rhetorischen Nachdruck des Hebräischen; unnötig altertümliche Wörter werden vermieden.
