base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/027.yaml
  text: Then Joab sent messengers to David and said[a], “I have fought against Rabbah; I have also captured the city of waters.”
translation:
  language: de
  text: 'Da schickte Joab Boten zu David und sagte: »Ich habe gegen Rabba gekämpft und auch die Wasserstadt eingenommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da schickte
  rationale: Das narrative וַ führt die Handlung weiter. »Da« gibt die zeitliche Folge im modernen deutschen Erzählstil natürlich wieder.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im menschlichen und militärischen Zusammenhang bezeichnet das Wort entsandte Überbringer einer Nachricht.
- source_word: וַיֹּאמֶר
  choice: ließ ihm sagen
  rationale: Da Joab Boten schickt, ist die Rede durch sie vermittelt. Die deutsche Wendung macht diese im Kontext klare Vermittlung natürlich kenntlich, ohne den Inhalt zu verändern.
- source_word: נִלְחַמְתִּי בְרַבָּה
  choice: Ich habe gegen Rabba gekämpft
  rationale: בְ mit dem Stadtnamen bezeichnet hier im Belagerungskontext das Kampfziel; »gegen Rabba« ist idiomatisches Deutsch. Das Perfekt passt zu Joabs Bericht über das bisher Erreichte.
- source_word: רַבָּה
  choice: Rabba
  rationale: Der Ortsname wird in gebräuchlicher deutscher Form wiedergegeben; die nähere Bestimmung als ammonitische Hauptstadt ergibt sich aus dem Kontext.
- source_word: גַּם
  choice: auch
  rationale: »Auch« bewahrt die additive Verknüpfung des zweiten berichteten Erfolgs mit dem Kampf gegen Rabba.
- source_word: לָכַדְתִּי
  choice: eingenommen
  rationale: Bei einer Stadt bezeichnet לכד ihre militärische Einnahme; »eingenommen« ist dafür die natürliche deutsche Wendung.
- source_word: עִיר הַמָּיִם
  choice: die Wasserstadt
  rationale: Das deutsche Kompositum gibt die hebräische Genitivverbindung knapp wieder, ohne abschließend festzulegen, ob ein Stadtteil, die wasserführende Unterstadt oder der Bereich der Wasserversorgung gemeint ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die schwer eindeutig zu bestimmende Bezeichnung »Wasserstadt« bleibt im Haupttext bewusst transparent und wird nicht auf einen bestimmten Stadtteil oder die Kontrolle der Wasserversorgung verengt.
