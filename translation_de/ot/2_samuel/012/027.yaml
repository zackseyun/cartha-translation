  verdict: revise
  source_fidelity: 'Die Wiedergabe von וַיֹּאמֶר mit „ließ ihm sagen“ macht zwar die durch die Boten naheliegende Übermittlung explizit, verschiebt aber die ausdrückliche hebräische Erzählformulierung „und sagte“. Die übrigen Elemente sind quellennah: Boten, Kampf gegen Rabba, additive Partikel und militärisches „eingenommen“ entsprechen dem Text gut. „Wasserstadt“ bewahrt die offene Bedeutung von עִיר הַמָּיִם angemessen.'
  naturalness: Mit „und sagte“ bleibt der Satz im modernen Standarddeutsch klar und natürlich. Die direkte Rede nach dem Bericht über die Entsendung von Boten ist als Erzählkonvention ohne Weiteres verständlich.
  terminology: „Rabba“ ist eine gebräuchliche deutsche Form des Ortsnamens. „Boten“ und „eingenommen“ passen zum militärisch-narrativen Register. „Wasserstadt“ ist als transparente, nicht festlegende Wiedergabe des schwierigen Ausdrucks vorzuziehen.
  issues:
  - severity: medium
    issue: „ließ ihm sagen“ ergänzt eine vermittelte Sprechhandlung statt des hebräischen „und sagte“.
    rationale: Der Kontext legt nahe, dass die Boten Joabs Mitteilung überbringen, doch der Quelltext formuliert die direkte Rede Joabs. Die Übersetzung sollte diese Darstellung nicht im Haupttext umformen; die direkte Rede nach „und sagte“ ist im Deutschen idiomatisch.
  - severity: low
    issue: 'Die Fußnote „Oder: sagte“ verteidigt eine weniger quellennähere Hauptlesart.'
    rationale: Nach der Anpassung an „und sagte“ ist keine Fußnote erforderlich. Die lexikalische Offenheit von „Wasserstadt“ muss nicht zwingend erläutert werden, da der Haupttext sie bereits bewahrt.
  revised_text: 'Da schickte Joab Boten zu David und sagte: »Ich habe gegen Rabba gekämpft und auch die Wasserstadt eingenommen.«'
