    rationale: Die übliche masoretische Lesung wird mit einer Ziegelform beziehungsweise einer Einrichtung zur Ziegelherstellung verbunden, nicht ausdrücklich mit mehreren Öfen. Die Wendung mit „hindurchführen“ bleibt zudem semantisch umstritten.
  - severity: medium
    issue: Der Haupttext stellt sowohl die Werkzeugverwendung als auch die Schlusswendung als eindeutig geregelte Zwangsarbeit dar.
    rationale: Die Arbeitsdeutung ist möglich und im Audit gewählt, aber וַיָּשֶׂם und וְהֶעֱבִיר ... בַּמַּלְבֵּן lassen auch wörtlichere bzw. härtere Deutungen zu. Eine zurückhaltendere Formulierung und eine präzise Fußnote bewahren diese Spannung besser.
  - severity: low
    issue: Die Fußnote nennt „Moloch/Milkom“ ohne den maßgeblichen textkritischen Zusammenhang klar zu beschreiben.
    rationale: Entscheidend ist der Unterschied zwischen der masoretisch gelesenen Form mit Bezug auf Ziegelherstellung und dem anders deutbaren Konsonantentext. Diese Information ist für Leser klarer und textnäher als eine unqualifizierte Aufzählung von Eigennamen.
