revisions:
- from: Die Bewohner, die darin waren, ließ er herausführen und setzte sie zur Arbeit mit Sägen, eisernen Spitzhacken und eisernen Äxten ein.[a] Auch ließ er sie an den Ziegelöfen arbeiten.[b] So verfuhr er mit allen Städten der Ammoniter.[c] Danach kehrten David und das ganze Volk nach Jerusalem zurück.
  to: Die Leute, die darin waren, ließ er herausführen und setzte sie bei Sägen, eisernen Spitzhacken und eisernen Äxten ein.[a] Er ließ sie auch bei der Ziegelherstellung arbeiten.[b] So verfuhr er mit allen Städten der Ammoniter.[c] Danach kehrten David und das ganze Volk nach Jerusalem zurück.
  rationale: Die Revision behält die plausible, im englischen POB-Audit bevorzugte Arbeitsdeutung im Haupttext bei, ersetzt jedoch die sachlich nicht gesicherte Pluralform „Ziegelöfen“ durch die weitere Formulierung „bei der Ziegelherstellung“. Die Fußnote dokumentiert die wörtlichere Lesart, die masoretische Lesung und die abweichenden Deutungsmöglichkeiten, damit der problematische hebräische Befund nicht dogmatisch aufgelöst wird.
