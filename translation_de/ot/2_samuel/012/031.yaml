review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die im englischen Audit bevorzugte Deutung von Fronarbeit grundsätzlich verständlich wieder. Er legt jedoch die besonders umstrittene Schlusswendung zu stark als Arbeit „an den Ziegelöfen“ fest. Der masoretische Lesebefund bietet hier eine Lesung zu מַלְבֵּן („Ziegelform/Einrichtung zur Ziegelherstellung“), während der Konsonantentext auch anders gelesen worden ist; ein Plural „Ziegelöfen“ ist nicht gedeckt. Die Werkzeugbezeichnungen bleiben unsicher und müssen als solche erkennbar bleiben.
  naturalness: Das Deutsch ist überwiegend natürlich und würdig. „bei der Ziegelherstellung arbeiten“ ist idiomatischer und weniger sachlich überpräzise als „an den Ziegelöfen arbeiten“. „Die Leute“ entspricht הָעָם in diesem Kontext natürlich; „das ganze Volk“ am Schluss bleibt als Bezeichnung von Davids Heer bzw. Gefolge erhalten.
  terminology: „Ammoniter“ und „Jerusalem“ sind korrekt. „Spitzhacken“ und „Äxte“ sind als plausible konkrete Haupttextlösungen vertretbar, dürfen aber nicht als sichere Identifikationen erscheinen. Die Fußnote soll die wörtlichere Konstruktion sowie die abweichende Lesung des Konsonantentextes präzise nennen, ohne eine Hinrichtungsdeutung zu behaupten.
