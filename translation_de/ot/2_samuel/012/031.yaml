base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/031.yaml
  text: And he brought out the people who were in it and put them to work with saws[a], iron picks, and iron axes, and made them labor at the brick kiln. Thus he did to all the cities of the Ammonites[c][b]. Then David and all the people returned to Jerusalem.
translation:
  language: de
  text: Die Leute, die darin waren, ließ er herausführen und setzte sie bei Sägen, eisernen Spitzhacken und eisernen Äxten ein.[a] Er ließ sie auch bei der Ziegelherstellung arbeiten.[b] So verfuhr er mit allen Städten der Ammoniter.[c] Danach kehrten David und das ganze Volk nach Jerusalem zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »stellte sie an die Säge, an eiserne scharfe Geräte und an eiserne Schneidewerkzeuge«. Die genaue Bedeutung der beiden Bezeichnungen für eiserne Geräte und die Konstruktion des Satzes sind unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Text ist schwierig. Wörtlicher: »Er ließ sie durch die Ziegelform bzw. die Einrichtung zur Ziegelherstellung gehen.« Die masoretisch gelesene Form wird gewöhnlich so verstanden; der Konsonantentext ist auch anders gelesen worden, etwa mit Bezug auf ihren König bzw. Milkom. Die Wendung wird traditionell teils als Hinrichtung statt als Zwangsarbeit verstanden.'
    reason: alternative_reading
  - marker: c
    text: Vgl. 1. Chronik 20,3; auch der Wortlaut dieses Parallelberichts ist schwierig.
    reason: cross_reference
lexical_decisions:
- source_word: הוֹצִיא
  choice: ließ er herausführen
  rationale: Der Hifil von יצא hat hier den kausativen Sinn »herausbringen/herausführen«. Die Formulierung ist im Deutschen natürlich und bewahrt diesen Sinn.
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: die Bewohner, die darin waren
  rationale: Wörtlich steht »das Volk, das in ihr war«. »Die Bewohner« gibt den Bezug auf die eroberte Stadt in natürlichem Deutsch wieder.
- source_word: וַיָּשֶׂם
  choice: setzte sie zur Arbeit … ein
  rationale: Das Verb bedeutet zunächst »setzen, stellen«. Zusammen mit der folgenden Werkzeugliste ist die Zuweisung zu Zwangsarbeit eine plausible Deutung; die wörtlichere und härtere mögliche Lesart wird in der Fußnote offengehalten.
- source_word: בַּמְּגֵרָה
  choice: mit Sägen
  rationale: מְגֵרָה bezeichnet eine Säge. Der Singular kann kollektiv beziehungsweise instrumental verstanden werden; im Deutschen ist der Plural in der Werkzeugliste idiomatisch.
- source_word: בַחֲרִצֵי הַבַּרְזֶל
  choice: eisernen Spitzhacken
  rationale: Die seltene Wendung bezeichnet offenbar scharfe eiserne Geräte, möglicherweise Dreschschlitten oder andere Schneidewerkzeuge. »Spitzhacken« ist im Arbeitskontext plausibel, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: בְמַגְזְרֹת הַבַּרְזֶל
  choice: eisernen Äxten
  rationale: Das Wort bezeichnet eiserne Schneidegeräte. »Äxte« ist eine konkrete, verständliche Wiedergabe; die genauere Geräteart bleibt unsicher.
- source_word: וְהֶעֱבִיר אוֹתָם ב/מלכן
  choice: Auch ließ er sie an den Ziegelöfen arbeiten
  rationale: Die Konsonantenfolge und die Konstruktion sind schwierig. Im Zusammenhang mit den Geräten und unter Vergleich mit 1. Chronik 20,3 ist eine Deutung auf Fronarbeit bei der Ziegelherstellung möglich. Die wörtlichere Wiedergabe »ließ sie hindurchgehen« und die mögliche Hinrichtungsdeutung werden in einer Fußnote bewahrt.
- source_word: וְכֵן יַעֲשֶׂה
  choice: So verfuhr er
  rationale: Das imperfektive Verb fasst hier Davids Vorgehen gegenüber den ammonitischen Städten erzählerisch zusammen. »So verfuhr er« klingt im modernen Deutschen natürlich.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: mit allen Städten der Ammoniter
  rationale: »Ammoniter« ist das übliche deutsche Ethnonym für בְנֵי עַמּוֹן.
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: kehrten … nach Jerusalem zurück
  rationale: שוב mit Zielangabe bedeutet im Erzählzusammenhang »zurückkehren«. Das zusammengesetzte Subjekt wird im Deutschen idiomatisch mit dem Plural wiedergegeben.
theological_decisions:
- issue: Ob David die ammonitischen Gefangenen mit Werkzeugen und einem Ziegelofen hinrichten ließ oder sie zu harter Arbeit zwang
  choice: Zwangsarbeit mit Werkzeugen und an den Ziegelöfen
  alternative: Er setzte beziehungsweise legte sie an Sägen und eiserne Geräte und ließ sie durch den Ziegelofen gehen; dies kann als Hinrichtung verstanden werden.
  rationale: Die hebräischen Formulierungen mit וַיָּשֶׂם und וְהֶעֱבִיר sowie die abschließende schwierige Konsonantenfolge erlauben mehrere Deutungen. Der Haupttext folgt der im Kontext und angesichts von 1. Chronik 20,3 plausiblen Arbeitsdeutung, während die Fußnoten die traditionelle Hinrichtungsdeutung ausdrücklich offenhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Haupttext ist gut verständlich und folgt einer plausiblen Fronarbeitsdeutung, ohne die erhebliche sprachliche und theologische Mehrdeutigkeit zu verdecken. »Bewohner« konkretisiert das kontextuelle הָעָם, während am Versende »das ganze Volk« die allgemeinere hebräische Bezeichnung bewahrt.
