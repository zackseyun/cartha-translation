  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des Hebräischen zuverlässig wieder: כִּי als begründendes „Denn“, die elliptische Rückverweisung mit „es“, den Kontrast in „Ich aber“, die zukünftige direkte göttliche Handlung sowie die öffentliche Gegenüberstellung von „im Verborgenen“ und „vor ganz Israel und vor der Sonne“. Die direkte göttliche Agentivität wird weder abgeschwächt noch überdeutet.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. „Im Verborgenen“ ist idiomatisch und angemessen; „diese Sache tun“ ist leicht formell, aber im prophetischen Gerichtsregister natürlich und dem demonstrativen הַדָּבָר הַזֶּה angemessen. Die Wiederholung von „vor“ trägt die hebräische Parallelität klar.
  terminology: „Ganz Israel“ gibt כָּל־יִשְׂרָאֵל treffend wieder. „Vor der Sonne“ bewahrt das auffällige hebräische Bild; die Fußnote bietet die idiomatische Deutung als Alternative, ohne den Wortlaut im Haupttext zu ersetzen. Der Fußnotenanker steht korrekt am Satzende und bezieht sich eindeutig auf „vor der Sonne“.
