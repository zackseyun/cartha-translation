id: 2SA.12.12
reference: 2 Samuel 12:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֥י אַתָּ֖ה עָשִׂ֣יתָ בַ/סָּ֑תֶר וַ/אֲנִ֗י אֶעֱשֶׂה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל וְ/נֶ֥גֶד הַ/שָּֽׁמֶשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/012.yaml
  text: For you did it in secret[a], but I will do this thing before all Israel and before the sun.
translation:
  language: de
  text: Denn du hast es im Verborgenen getan. Ich aber werde diese Sache vor ganz Israel und vor der Sonne tun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: öffentlich, am helllichten Tag; wörtlich: »vor der Sonne«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das im vorhergehenden Vers angekündigte Gericht ein und gibt die erklärende Funktion natürlich wieder.
- source_word: עָשִׂיתָ בַסָּתֶר
  choice: du hast es im Verborgenen getan
  rationale: Das Verb bleibt wie im Hebräischen elliptisch und verweist auf Davids Tat zurück; »im Verborgenen« wahrt den Gegensatz zur öffentlichen Ausführung.
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Das Waw markiert hier im Kontext einen deutlichen Gegensatz zwischen Davids heimlichem Handeln und Gottes öffentlichem Handeln.
- source_word: אֶעֱשֶׂה אֶת־הַדָּבָר הַזֶּה
  choice: werde diese Sache tun
  rationale: Bewahrt das direkte göttliche Handeln, den Zukunftsbezug und die demonstrative, etwas formelle Ausdrucksweise des Hebräischen.
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל
  choice: vor ganz Israel
  rationale: Gibt die räumliche und öffentliche Bedeutung von נֶגֶד knapp und idiomatisch wieder.
- source_word: וְנֶגֶד הַשָּׁמֶשׁ
  choice: und vor der Sonne
  rationale: Erhält das auffällige hebräische Bild, statt es im Haupttext als »am helllichten Tag« auszudeuten.
theological_decisions:
- issue: Urheberschaft des angekündigten Gerichts
  choice: 'Direkte göttliche Urheberschaft: »Ich aber werde diese Sache … tun«'
  alternative: »Ich werde dies geschehen lassen«
  rationale: Das Hebräische verwendet ein direktes Verb in der ersten Person. Die Aussage sollte nicht zu einer bloßen Zulassung abgeschwächt werden, auch wenn sich das Gericht geschichtlich durch menschliche Akteure vollzieht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Im Verborgenen« und »vor der Sonne« bewahren den bildhaften Gegensatz des Hebräischen; die Fußnote erläutert die idiomatische Bedeutung, ohne sie im Haupttext festzulegen.
