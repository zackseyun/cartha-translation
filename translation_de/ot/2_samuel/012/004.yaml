base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/004.yaml
  text: A traveler came to the rich man[a], and he spared taking from his own flock and from his own herd to prepare for the traveler who had come to him. So he took the ewe lamb of the poor man and prepared it for the man who had come to him.
translation:
  language: de
  text: Da kam ein Wanderer zu dem reichen Mann[a]. Der reiche Mann brachte es nicht über sich, eines von seinen eigenen Schafen oder Rindern zu nehmen, um es für den Reisenden zuzubereiten, der zu ihm gekommen war. Stattdessen nahm er das weibliche Lamm des armen Mannes und bereitete es für den Mann zu, der zu ihm gekommen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Gast« für »Wanderer« und »Reisenden«. Im Hebräischen stehen zwei verwandte, aber unterschiedliche Bezeichnungen: die eine für einen Menschen auf der Reise, die andere für einen, der gastlich aufgenommen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵלֶךְ
  choice: Wanderer
  rationale: Das Wort bezeichnet einen Menschen auf der Reise. »Wanderer« ist verständlich und bewahrt den Unterschied zum späteren, verwandten Ausdruck für den aufgenommenen Reisenden.
- source_word: וַיַּחְמֹל
  choice: brachte es nicht über sich
  rationale: חמל bedeutet gewöhnlich »schonen« oder »Mitleid haben«. Da hier kein ausdrückliches Objekt genannt wird, gibt die idiomatische Formulierung das selbstschonende Zurückschrecken des Reichen wieder, ohne ein Objekt in den hebräischen Text einzutragen.
- source_word: מִצֹּאנוֹ וּמִבְּקָרוֹ
  choice: eines von seinen eigenen Schafen oder Rindern
  rationale: Die Kollektiva צאן und בקר bezeichnen Kleinvieh und Großvieh; im Deutschen benennt die konkrete partitive Form natürlich ein Tier aus dem jeweiligen eigenen Bestand und hebt den Besitzkontrast hervor.
- source_word: לַעֲשׂוֹת / וַיַּעֲשֶׂהָ
  choice: zuzubereiten / bereitete es zu
  rationale: Im Zusammenhang eines Gastmahls bezeichnet עשה die Zubereitung des Tieres. Die Wiederholung desselben deutschen Verbs bildet die Wiederholung im Hebräischen ab.
- source_word: לָאֹרֵחַ
  choice: für den Reisenden
  rationale: אֹרֵחַ kann einen Reisenden oder einen als Gast aufgenommenen Menschen bezeichnen. »Reisender« hält die Reisebedeutung fest und bleibt gegenüber »Wanderer« lexikalisch unterscheidbar.
- source_word: כִּבְשַׂת
  choice: das weibliche Lamm
  rationale: Die feminine Form bezeichnet ausdrücklich ein weibliches Lamm. Die klare moderne Formulierung wahrt diese Einzelheit.
- source_word: הָאִישׁ הָרָאשׁ
  choice: der arme Mann
  rationale: רָאשׁ bezeichnet hier einen armen oder bedürftigen Menschen und bildet den unmittelbaren Gegensatz zu »der reiche Mann«.
- source_word: הַבָּא לוֹ / הַבָּא אֵלָיו
  choice: der zu ihm gekommen war
  rationale: Die substantivierten Partizipien bezeichnen den angekommenen Besucher; das Plusquamperfekt ordnet sein Kommen natürlich vor der Zubereitung ein.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parataktische Erzählweise wird weitgehend bewahrt; »Stattdessen« macht den im hebräischen Handlungsablauf liegenden Kontrast natürlich deutlich. Die Formulierung zu וַיַּחְמֹל wahrt dessen Bedeutungskomponente des Schonens beziehungsweise Mitleids, ohne dem Reichen echtes Mitgefühl mit einem ausdrücklich genannten Gegenstand zuzuschreiben.
