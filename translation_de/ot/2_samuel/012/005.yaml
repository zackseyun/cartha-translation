base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/005.yaml
  text: Then David burned with anger against the man greatly[a], and he said to Nathan, “As Yahweh lives, the man who has done this is a son of death!”
translation:
  language: de
  text: 'Da entbrannte Davids Zorn heftig gegen den Mann, und er sagte zu Nathan: »So wahr Jahwe lebt: Der Mann, der das getan hat, ist ein Mensch des Todes![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch »ein Sohn des Todes«; das heißt: Er hat den Tod verdient oder ist des Todes schuldig.'
    reason: Erläutert die hebräische Redewendung בֶן־מָוֶת und hält ihre wörtliche Form transparent.
lexical_decisions:
- source_word: וַיִּחַר אַף דָּוִד
  choice: Da entbrannte Davids Zorn
  rationale: Die deutsche Wendung bewahrt das hebräische Bild vom entbrennenden Zorn und klingt zugleich natürlich und würdevoll.
- source_word: בָּאִישׁ מְאֹד
  choice: heftig gegen den Mann
  rationale: „Gegen den Mann“ bezeichnet das Ziel des Zorns; „heftig“ gibt das verstärkende מְאֹד ausdrücklich wieder.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Dies ist die natürliche deutsche Entsprechung der feierlichen hebräischen Schwurformel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: בֶן מָוֶת
  choice: ein Kind des Todes
  rationale: Die bildhafte hebräische Wendung bleibt im Haupttext sichtbar; ihre Bedeutung als Todeswürdigkeit wird in der Fußnote erläutert.
- source_word: הָאִישׁ הָעֹשֶׂה זֹאת
  choice: der Mann, der das getan hat
  rationale: Der substantivierte Partizipialausdruck wird als klarer deutscher Relativsatz wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בֶן מָוֶת
  choice: ein Kind des Todes
  alternative: hat den Tod verdient
  rationale: Die wörtlich-bildhafte Fassung erhält die Schärfe und Eigenart des Hebräischen, während die Fußnote den idiomatischen Sinn offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lebhafte Zornesmetapher und die feierliche Schwurformel werden bewahrt; „Kind des Todes“ vermeidet im Deutschen die mögliche Fehlwirkung, als bezeichne „Sohn“ hier ausschließlich ein männliches Abstammungsverhältnis.
