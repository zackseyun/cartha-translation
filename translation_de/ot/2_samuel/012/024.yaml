  text: וַ/יְנַחֵ֣ם דָּוִ֗ד אֵ֚ת בַּת שֶׁ֣בַע אִשְׁתּ֔/וֹ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/יִּשְׁכַּ֣ב עִמָּ֑/הּ וַ/תֵּ֣לֶד בֵּ֗ן ו/יקרא אֶת שְׁמ/וֹ֙ שְׁלֹמֹ֔ה וַ/יהוָ֖ה אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/024.yaml
  text: Then David comforted Bathsheba his wife[a], and he went in to her and lay with her. She bore a son, and he named him Solomon[b]. And Yahweh loved him.
translation:
  language: de
  text: Dann tröstete David seine Frau Batseba. Er ging zu ihr und schlief mit ihr.[a] Sie gebar einen Sohn, und er gab ihm den Namen Salomo. Jahwe liebte ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräische Umschreibung: „Er ging zu ihr und lag mit ihr“; sie bezeichnet Geschlechtsverkehr.'
    reason: Hinweis auf die hebräische Ausdrucksweise und die bewusst idiomatische deutsche Wiedergabe.
lexical_decisions:
- source_word: וַיְנַחֵם
  choice: tröstete
  rationale: Das Piel von נחם bezeichnet hier Trost nach einem Todesfall. „Tröstete“ ist im Deutschen natürlich und gibt den Zusammenhang wieder, ohne die Art des Trostes näher festzulegen.
- source_word: בַּת שֶׁבַע אִשְׁתּוֹ
  choice: seine Frau Batseba
  rationale: Die ausdrückliche Bezeichnung Batsebas als Davids Frau bleibt erhalten; die deutsche Wortstellung ist natürlich und würdevoll.
- source_word: וַיָּבֹא אֵלֶיהָ וַיִּשְׁכַּב עִמָּהּ
  choice: Er ging zu ihr und schlief mit ihr
  rationale: Die Übersetzung bewahrt beide aufeinanderfolgenden hebräischen Verben, gibt die sexuelle Bedeutung aber in verständlichem modernem Deutsch wieder.
- source_word: וַתֵּלֶד בֵּן
  choice: Sie gebar einen Sohn
  rationale: „Gebar“ ist knapp, gehoben, aber weiterhin allgemein verständlich und entspricht der hebräischen Erzählweise.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ שְׁלֹמֹה
  choice: er gab ihm den Namen Salomo
  rationale: Dies ist die natürliche deutsche Wiedergabe der hebräischen Wendung „seinen Namen nennen“. Das maskuline Subjekt wird im Zusammenhang auf David bezogen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲהֵבוֹ
  choice: liebte ihn
  rationale: אהב bedeutet hier schlicht „lieben“; das Suffix verweist auf den neugeborenen Sohn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen als Namen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Subjekt der Namensgebung
  choice: David gab dem Kind den Namen Salomo
  alternative: Batseba gab dem Kind den Namen Salomo
  rationale: Die mas­ku­li­ne Singularform וַיִּקְרָא führt am natürlichsten David als weiterhin handelndes Subjekt fort; eine weibliche Verbform steht nicht im Text.
translation_notes:
  register: Moderne standarddeutsche Erzählsprache mit würdigem biblischem Ton. „Gebar“ hält die Formulierung knapp und leicht gehoben; „schlief mit ihr“ vermittelt die Bedeutung des hebräischen Idioms ohne unnötige Derbheit.
