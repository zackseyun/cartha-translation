source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בְּ/עוֹד֙ הַ/יֶּ֣לֶד חַ֔י צַ֖מְתִּי וָֽ/אֶבְכֶּ֑ה כִּ֤י אָמַ֨רְתִּי֙ מִ֣י יוֹדֵ֔עַ יחנ/ני יְהוָ֖ה וְ/חַ֥י הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/022.yaml
  text: He said[a], “While the child was still alive, I fasted and wept, because I said, ‘Who knows? Yahweh may be gracious to me, and the child may live.’”
translation:
  language: de
  text: 'Er sagte: „Solange das Kind noch lebte, fastete und weinte ich. Denn ich sagte: ‚Wer weiß? Vielleicht wird Jahwe mir gnädig sein, und das Kind wird am Leben bleiben.‘[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer kann wissen? Vielleicht wird Jahwe mir gnädig sein, sodass das Kind am Leben bleibt.“'
    reason: Die Wendung מִי יוֹדֵעַ kann auch mit „Wer kann wissen?“ wiedergegeben werden; zudem kann die letzte mit וְ angeschlossene Aussage als erhoffte Folge von Jahwes Gnade verstanden werden.
lexical_decisions:
- source_word: בְּעוֹד הַיֶּלֶד חַי
  choice: Solange das Kind noch lebte
  rationale: בְּעוֹד bezeichnet hier den fortdauernden Zustand in der Vergangenheit; „solange … noch“ gibt sowohl die zeitliche Dauer als auch die prekäre Fortdauer des Lebens natürlich wieder.
- source_word: צַמְתִּי וָאֶבְכֶּה
  choice: fastete und weinte ich
  rationale: Die beiden Verben werden direkt und in würdigem, geläufigem Deutsch wiedergegeben.
- source_word: כִּי אָמַרְתִּי
  choice: Denn ich sagte mir
  rationale: כִּי begründet Davids Verhalten. Das ergänzte reflexive „mir“ kennzeichnet natürliches inneres Sprechen, ohne den Inhalt zu verändern.
- source_word: מִי יוֹדֵעַ
  choice: Wer weiß?
  rationale: Die knappe deutsche Redewendung bewahrt die im Hebräischen ausgedrückte Ungewissheit.
- source_word: יְחָנֵּנִי
  choice: Vielleicht ist … mir gnädig
  rationale: חנן bezeichnet das Erweisen von Gnade oder Gunst. „Mir gnädig sein“ wahrt den persönlichen Bezug und passt nach „Wer weiß?“ idiomatisch zur erhofften, aber ungewissen Möglichkeit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְחַי הַיָּלֶד
  choice: und das Kind bleibt am Leben
  rationale: Die Formulierung erhält die Koordination des Hebräischen und steht im Wirkungsbereich der durch „Wer weiß?“ und „vielleicht“ eröffneten Hoffnung, ohne Gewissheit zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Grad der Gewissheit in Davids Hoffnung
  choice: „Wer weiß? Vielleicht …“
  alternative: „Jahwe wird mir gnädig sein, und das Kind wird leben“
  rationale: מִי יוֹדֵעַ drückt Unsicherheit und Hoffnung aus, nicht Zuversicht auf einen feststehenden Ausgang. Die Übersetzung vermeidet daher eine Verheißung oder Gewissheit, die der Text nicht ausspricht.
- issue: Verhältnis zwischen Gottes Gnade und dem Weiterleben des Kindes
  choice: 'koordinierte Aussage: „und das Kind bleibt am Leben“'
  alternative: 'Folgesatz: „sodass das Kind am Leben bleibt“'
  rationale: Das וְ verbindet die Aussagen formal. Ein Folgeverhältnis ist im Zusammenhang gut möglich, wird im Haupttext aber nicht ausdrücklich festgelegt; die Fußnote nennt diese mögliche Deutung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Weinte“ ist schlicht und feierlich; „sagte mir“ macht das berichtete innere Sprechen idiomatisch. Die doppelte Unsicherheit des Verses bleibt erhalten.
