  source_fidelity: Die Vermittlungsformel בְּיַד נָתָן הַנָּבִיא ist mit „durch den Propheten Nathan“ sachgerecht wiedergegeben. Die beiden Verben lassen ihr Subjekt im Deutschen wie im Hebräischen offen. „Um JHWHs willen“ kann בַּעֲבוּר angemessen wiedergeben, ohne den in V. 24 genannten Grund zu einem vollständigen Kausalsatz auszuformulieren.
  naturalness: „Er sandte durch Nathan, den Propheten“ ist im heutigen Standarddeutsch wegen des fehlenden Objekts und der unidiomatischen Apposition nicht ausreichend natürlich. Ein ausdrücklich ergänztes, aber vom Vermittlungskontext klar getragenes „eine Botschaft“ macht den elliptischen hebräischen Ausdruck verständlich.
  terminology: „JHWH“ wahrt das Tetragramm; „Jedidja“ ist eine etablierte deutsche Namensform. Die Namensfußnote gibt die wahrscheinliche Bedeutung zutreffend an. Die Stellung „den Propheten Nathan“ ist die übliche deutsche Bezeichnung.
