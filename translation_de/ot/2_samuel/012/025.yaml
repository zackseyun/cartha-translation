source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח בְּ/יַד֙ נָתָ֣ן הַ/נָּבִ֔יא וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ יְדִ֣ידְיָ֑הּ בַּ/עֲב֖וּר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/025.yaml
  text: And he sent word through Nathan the prophet[a], and he called his name Jedidiah[b], because of Yahweh.
translation:
  language: de
  text: Und er sandte durch den Propheten Nathan eine Botschaft[a] und nannte ihn Jedidja,[b] um JHWHs willen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand Nathans, des Propheten“.'
    reason: lexical_alternative
  - marker: b
    text: Jedidja bedeutet wahrscheinlich „Geliebter JHWHs“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: er sandte
  rationale: Das Verb bedeutet grundsätzlich „senden“. Da im Hebräischen kein ausdrückliches Objekt genannt wird, bewahrt die knappe Wiedergabe die Ellipse, statt „eine Botschaft“ in den Haupttext einzufügen.
- source_word: בְּיַד נָתָן הַנָּבִיא
  choice: durch Nathan, den Propheten
  rationale: Die Wendung bedeutet wörtlich „durch die Hand Nathans, des Propheten“ und bezeichnet hier Vermittlung beziehungsweise Beauftragung. „Durch Nathan“ ist im modernen Deutschen natürlich und erhält diesen Sinn.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: nannte ihn
  rationale: Die hebräische Wendung lautet wörtlich „er nannte seinen Namen“, bezeichnet aber idiomatisch die Namensgebung. „Nannte ihn“ ist prägnantes, natürliches Deutsch.
- source_word: יְדִידְיָהּ
  choice: Jedidja
  rationale: Der Personenname wird in einer im Deutschen üblichen, quellennahen Form wiedergegeben. Seine wahrscheinliche Bedeutung wird in einer Fußnote erklärt.
- source_word: בַּעֲבוּר
  choice: um … willen
  rationale: Die Präposition kann einen Grund oder Beweggrund ausdrücken. „Um JHWHs willen“ wahrt die semantische Offenheit zwischen „wegen“ und „JHWH zuliebe“ und klingt würdig.
- source_word: יְהוָה
  choice: JHWH
  rationale: Das Tetragramm wird als Gottes Eigenname sichtbar bewahrt, ohne eine unsichere Vokalisierung als Bestandteil des Haupttextes festzulegen.
theological_decisions:
- issue: Subjekt von „sandte“ und „nannte“
  choice: Das Pronomen „er“ bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: JHWH ausdrücklich als Subjekt beider Verben nennen; alternativ Nathan als Subjekt von „nannte“ verstehen.
  rationale: Der Zusammenhang legt JHWH als Subjekt von „sandte“ nahe, doch der Subjektbezug von „nannte“ kann unterschiedlich verstanden werden. Die pronominale Form des Hebräischen bewahrt diese Spannung und vermeidet eine übermäßige Festlegung.
- issue: Bezug von בַּעֲבוּר יְהוָה
  choice: „um JHWHs willen“
  alternative: „weil JHWH ihn liebte“ oder „wegen JHWH“
  rationale: Der Vers nennt JHWH als Grund beziehungsweise Beweggrund, formuliert aber keinen vollständigen Kausalsatz. Die gewählte Fassung stellt keinen zusätzlichen theologischen Zusammenhang ausdrücklich her.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die ungewöhnliche Kürze von „er sandte“ folgt bewusst der Ellipse des hebräischen Textes; die Fußnoten erläutern das Vermittlungsidiom und die Bedeutung des Namens.
