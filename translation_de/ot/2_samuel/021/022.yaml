base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/022.yaml
  text: These four were born to the Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: de
  text: Diese vier wurden dem Rafa in Gat geboren[a], und sie fielen durch die Hand Davids und durch die Hand seiner Diener.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Riesen“ oder „den Refaïm“. Das Hebräische kann sich auf Rafa als einen Ahnherrn, auf einen Riesen oder auf die mit Gat verbundene Refaïm-Gruppe beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְבַּעַת אֵלֶּה
  choice: diese vier
  rationale: Die Zahl mit nachgestelltem Demonstrativpronomen wird im Deutschen natürlich mit „diese vier“ wiedergegeben; „Männer“ steht nicht ausdrücklich im Hebräischen.
- source_word: יֻלְּדוּ
  choice: wurden geboren
  rationale: Die passive Form von ילד bezeichnet hier Geburt beziehungsweise Abstammung. „Wurden geboren“ ist im modernen Deutsch verständlich und bewahrt die Form des Ausgangstextes.
- source_word: לְהָרָפָה
  choice: dem Rafa
  rationale: Die Form kann einen namens- oder titelartigen Ahnherrn, den Riesen oder die Rafaïter bezeichnen. Die transliterierte Wiedergabe bewahrt diese Unsicherheit am ehesten.
- source_word: בְּגַת
  choice: in Gat
  rationale: Natürliche Wiedergabe der Ortsangabe.
- source_word: וַיִּפְּלוּ
  choice: sie fielen
  rationale: „Fielen“ bewahrt das hebräische Bild; im Zusammenhang eines Kampfes ist der Tod der vier gemeint.
- source_word: בְיַד
  choice: durch die Hand
  rationale: Die Wendung bezeichnet die handelnde beziehungsweise ausführende Person. Die bildhafte hebräische Ausdrucksweise bleibt so erhalten und ist auf Deutsch verständlich.
- source_word: עֲבָדָיו
  choice: seiner Diener
  rationale: עבד bezeichnet hier Männer im Dienst Davids. „Diener“ ist die direkte, kontextgerechte Wiedergabe, ohne sie enger als Soldaten oder Gefolgsleute festzulegen.
theological_decisions:
- issue: Identität von הָרָפָה
  choice: Als „dem Rafa“ konservativ transliteriert
  alternative: „dem Riesen“ oder „den Rafaïtern“
  rationale: Der Vers fasst die vorausgehenden Kämpfe zusammen und verbindet die vier mit der in Gat beheimateten Riesentradition. Da die hebräische Bezeichnung unterschiedlich verstanden werden kann, wird sie im Haupttext nicht eindeutig als Gattungs- oder Volksbezeichnung festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Formulierung „durch die Hand Davids und durch die Hand seiner Diener“ bewahrt die Struktur und Bildsprache des Hebräischen; die ungewöhnliche Abstammungsangabe wird durch eine Fußnote erläutert.
