    rationale: Die hebräische Bezeichnung ist strittig. Die Anmerkung muss die im Haupttext bewahrte Ambiguität nachvollziehbar erläutern und die wesentlichen Alternativen transparent darstellen, ohne eine einzelne Deutung festzulegen.
  - severity: low
    issue: „Riesensippe“ in der Fußnote legt die Referenz stärker als die Haupttextform fest.
    rationale: Die Verbindung mit einer Riesentradition ist plausibel, doch die Form הָרָפָה kann auch einen einzelnen Ahnherrn oder eine Gruppenbezeichnung meinen. Eine neutralere Erläuterung bewahrt die Unsicherheit besser.
