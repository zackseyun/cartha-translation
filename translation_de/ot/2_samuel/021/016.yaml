source:
  edition: WLC
  text: ו/ישבו בְּנֹ֜ב אֲשֶׁ֣ר בִּ/ילִידֵ֣י הָ/רָפָ֗ה וּ/מִשְׁקַ֤ל קֵינ/וֹ֙ שְׁלֹ֤שׁ מֵאוֹת֙ מִשְׁקַ֣ל נְחֹ֔שֶׁת וְ/ה֖וּא חָג֣וּר חֲדָשָׁ֑ה וַ/יֹּ֖אמֶר לְ/הַכּ֥וֹת אֶת דָּוִֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/016.yaml
  text: And Ishbi-benob[a], who was among the descendants of Rapha, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword[c][b], said that he would strike down David.
translation:
  language: de
  text: Und Jischbi-Benob[a], einer der Nachkommen Rafas[b], dessen Speer dreihundert Schekel an Bronze wog und der mit einem neuen Schwert[c] gegürtet war, sagte, er werde David erschlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Namensform ist unsicher. „Jischbi-Benob“ folgt der traditionellen Auffassung; möglich sind auch „Jeschbi-Benob“ oder eine andere Trennung der Konsonanten.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich auch: „einer von denen, die Rafa geboren wurden“. Gemeint ist wahrscheinlich das Riesengeschlecht, das mit den Refaitern verbunden wird.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen steht nur „neu“; das zugehörige Substantiv fehlt. Traditionell wird „Schwert“ ergänzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבו בְּנֹב
  choice: Jischbi-Benob
  rationale: Der Konsonantentext und seine Worttrennung sind schwierig. Die traditionelle Auffassung als Personenname passt jedoch zum Zusammenhang und zu den Namen der übrigen Krieger aus dem Geschlecht Rafas. Die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: אֲשֶׁר בִּילִידֵי הָרָפָה
  choice: einer von den Nachkommen Rafas
  rationale: Die Wendung bezeichnet Zugehörigkeit durch Abstammung. Der Eigenname Rafa bleibt erhalten, statt deutend mit „Riese“ wiedergegeben zu werden.
- source_word: וּמִשְׁקַל קֵינוֹ
  choice: dessen Speer … wog
  rationale: קֵין wird in diesem Kampfzusammenhang traditionell als Speer oder Speerschaft verstanden. Die Relativkonstruktion ist im Deutschen natürlich und bewahrt den Sinn der Gewichtsangabe.
- source_word: שְׁלֹשׁ מֵאוֹת מִשְׁקַל נְחֹשֶׁת
  choice: dreihundert Schekel Bronze
  rationale: Die antike Gewichtseinheit Schekel wird aus Transparenzgründen beibehalten. נְחֹשֶׁת bezeichnet hier am wahrscheinlichsten Bronze.
- source_word: וְהוּא חָגוּר חֲדָשָׁה
  choice: der mit einem neuen Schwert gegürtet war
  rationale: Im Hebräischen steht nur das feminine Adjektiv „neu“; ein feminines Substantiv ist ausgelassen. „Schwert“ ist die traditionelle und im Kampfzusammenhang wahrscheinlichste Ergänzung, bleibt aber in einer Fußnote als Ergänzung kenntlich.
- source_word: וַיֹּאמֶר לְהַכּוֹת אֶת דָּוִד
  choice: sagte, er werde David erschlagen
  rationale: Die Wiedergabe bewahrt das Verb „sagen“ und versteht den folgenden Infinitiv als geäußerte Absicht. „Erschlagen“ entspricht dem militärischen Zusammenhang, ohne die Formulierung bloß zu „beabsichtigte“ zu glätten.
