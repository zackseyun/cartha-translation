  yaml_path: translation/ot/2_samuel/021/020.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
translation:
  language: de
  text: In Gat kam es wieder zum Krieg. Dort war ein Mann von gewaltiger Größe[a]. Er hatte an jeder Hand sechs Finger und an jedem Fuß sechs Zehen, insgesamt vierundzwanzig[b]. Auch er stammte von Rafa ab[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich möglicherweise: »ein Mann von Maß«; gemeint ist wohl ein Mann von außergewöhnlicher Körpergröße oder mächtiger Gestalt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Die Finger seiner Hände und die Finger seiner Füße: sechs und sechs, vierundzwanzig an der Zahl.«'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: »Auch er wurde dem Rafa geboren.« Die Formulierung kann Zugehörigkeit zu Rafas Abstammungslinie bezeichnen; möglicherweise besteht ein Bezug zu den Refaïtern, einer mit außergewöhnlich großen Menschen verbundenen Gruppe.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִלְחָמָה בְּגַת
  choice: bei Gat zum Krieg
  rationale: מִלְחָמָה bezeichnet Krieg oder bewaffneten Kampf; בְּגַת lokalisiert das Geschehen bei beziehungsweise in Gat. Die Formulierung ist im Deutschen natürlich und lässt offen, ob die Kampfhandlungen unmittelbar in oder im Umfeld der Stadt stattfanden.
- source_word: אִישׁ מדין
  choice: ein Mann von gewaltiger Größe
  rationale: Die schwierige Wendung bezeichnet wahrscheinlich einen Mann außergewöhnlicher Körpermaße. Die Übersetzung gibt den wahrscheinlichen Sinn wieder, ohne sie auf bloße Körperhöhe zu verengen.
- source_word: אֶצְבְּעֹת יָדָיו וְאֶצְבְּעֹת רַגְלָיו
  choice: Finger … Zehen
  rationale: Das Hebräische spricht wörtlich von den Fingern seiner Hände und den Fingern seiner Füße. Modernes Deutsch unterscheidet hier idiomatisch zwischen Fingern und Zehen.
- source_word: שֵׁשׁ וָשֵׁשׁ עֶשְׂרִים וְאַרְבַּע מִסְפָּר
  choice: an jeder Hand sechs … an jedem Fuß sechs … insgesamt vierundzwanzig
  rationale: Die Angabe meint sechs Finger je Hand und sechs Zehen je Fuß, wie die ausdrücklich genannte Gesamtzahl vierundzwanzig bestätigt.
- source_word: יֻלַּד לְהָרָפָה
  choice: stammte von Rafa ab
  rationale: Die passive Form von ילד mit ל drückt hier Herkunft beziehungsweise Zugehörigkeit zu einer Abstammungslinie aus. Die natürliche deutsche Wiedergabe bewahrt Rafa als Bezeichnung, statt sie deutend mit „Riese“ zu übersetzen.
theological_decisions:
- issue: Identität von הָרָפָה
  choice: Rafa als Bezeichnung eines Ahnherrn oder einer Abstammungsgruppe
  alternative: der Riese; die Rafaïter beziehungsweise Refaïter
  rationale: Der Vers betont Abstammung oder Gruppenzugehörigkeit. Die Transliteration vermeidet, die nicht völlig eindeutige Bezeichnung im Haupttext vorschnell als Gattungswort „Riese“ festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die ungewöhnliche Anatomie wird eindeutig und ohne unnötige Schwerfälligkeit wiedergegeben; die Unsicherheit der Wendungen מדין und הָרָפָה bleibt in den Fußnoten sichtbar.
