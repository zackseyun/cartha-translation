  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שמעי אֲחִ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/021.yaml
  text: And he defied Israel[a], and Jonathan the son of Shimei, David’s brother, struck him down.
translation:
  language: de
  text: Und er verhöhnte Israel. Da erschlug ihn Jonatan, der Sohn Schimis[a], des Bruders Davids.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften und die Parallelstelle in 1. Chronik 20,7 lesen „Schima“ oder „Schimea“ statt „Schimi“.
    reason: textual_variant
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: verhöhnte
  rationale: Das Verb חרף bezeichnet hier feindseliges, herausforderndes Schmähen. „Verhöhnte“ gibt den beleidigenden Charakter im militärischen Zusammenhang natürlich wieder.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Der hebräische Text nennt Israel als kollektive nationale Größe; diese Ausdrucksweise bleibt im Deutschen klar und knapp.
- source_word: וַיַּכֵּהוּ
  choice: erschlug ihn
  rationale: נכה bedeutet grundsätzlich „schlagen“, bezeichnet in diesem Kampfzusammenhang aber einen tödlichen Schlag. „Erschlug ihn“ wahrt sowohl das Bild als auch das Ergebnis.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: בֶּן שמעי
  choice: der Sohn Schimis
  rationale: Der vorliegende Konsonantentext bietet שמעי, daher wird der Name als „Schimi“ wiedergegeben. Die abweichende Namensform der Parallelstelle wird in einer Fußnote dokumentiert.
- source_word: אֲחִי דָוִד
  choice: des Bruders Davids
  rationale: 'Die Genitivfügung gibt die hebräische Apposition präzise wieder: Schimi, nicht Jonatan, wird als Bruder Davids bezeichnet.'
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei aufeinanderfolgenden Sätze bewahren die knappe Erzählweise des Hebräischen; „Da“ macht den erzählerischen Fortgang natürlich. Der Fußnotenmarker steht unmittelbar bei dem Namen, auf den sich die Textvariante bezieht.
