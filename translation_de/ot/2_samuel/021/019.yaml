  text: וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים וַ/יַּ֡ךְ אֶלְחָנָן֩ בֶּן יַעְרֵ֨י אֹרְגִ֜ים בֵּ֣ית הַלַּחְמִ֗י אֵ֚ת גָּלְיָ֣ת הַ/גִּתִּ֔י וְ/עֵ֣ץ חֲנִית֔/וֹ כִּ/מְנ֖וֹר אֹרְגִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/019.yaml
  text: And there was again war at Gob with the Philistines[a], and Elhanan son of Jaare-oregim the Bethlehemite struck down Goliath the Gittite[b], and the shaft of his spear was like a weaver’s beam.
translation:
  language: de
  text: Und wieder gab es bei Gob Krieg mit den Philistern. Da erschlug Elhanan, der Sohn Jaare-Oregims, der Bethlehemiter,[a] Goliat aus Gat.[b] Der Schaft seines Speeres war wie ein Weberbaum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Namensform „Jaare-Oregim“ ist schwierig. Manche nehmen an, dass „Oregim“ („Weber“) hier versehentlich vom Versende wiederholt wurde.
    reason: textual_variant
  - marker: b
    text: 1. Chronik 20,5 lautet anders und berichtet, Elhanan habe Lachmi, den Bruder Goliats, erschlagen. Viele verstehen die Lesart im Samuelbuch hier als schwierig oder in der Textüberlieferung beschädigt und gleichen sie daher an die Chronikstelle an.
    reason: textual_variant
lexical_decisions:
- source_word: בְּגוֹב
  choice: bei Gob
  rationale: Bei einem Schlachtort gibt „bei Gob“ die lokale Funktion der Präposition בְּ natürlich wieder, ohne zu behaupten, die Kämpfe hätten innerhalb der Ortschaft stattgefunden.
- source_word: וַיַּךְ
  choice: erschlug
  rationale: נכה bezeichnet hier im Kampf ein tödliches Niederschlagen; „erschlug“ ist prägnant, würdig und kontextgemäß.
- source_word: יַעְרֵי אֹרְגִים
  choice: Jaare-Oregim
  rationale: Die schwierige Namensform des masoretischen Textes wird transliteriert und nicht stillschweigend nach der Chronikparallele geändert.
- source_word: בֵּית הַלַּחְמִי
  choice: der Betlehemiter
  rationale: Die Form wird ihrem naheliegenden gentilischen Sinn entsprechend als Herkunftsbezeichnung wiedergegeben.
- source_word: אֵת גָּלְיָת הַגִּתִּי
  choice: Goliat aus Gat
  rationale: Der masoretische Text nennt ausdrücklich Goliat, den Gatiter. „Aus Gat“ ist im heutigen Deutsch natürlicher als „der Gatiter“ und bewahrt denselben Sinn.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: Der Schaft seines Speeres
  rationale: עֵץ bedeutet wörtlich „Holz“, bezeichnet hier aber idiomatisch den hölzernen Speerschaft.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: wie ein Weberbaum
  rationale: Der Weberbaum ist der schwere Querbaum eines Webstuhls; die traditionelle Sachbezeichnung bildet den Vergleich knapp und genau ab.
theological_decisions:
- issue: Spannung zum Bericht, dass David Goliat tötete, und zur Parallelstelle 1. Chronik 20,5
  choice: 'Die masoretische Lesart wird im Haupttext beibehalten: Elhanan erschlug Goliat aus Gat.'
  alternative: 'Nach 1. Chronik 20,5: Elhanan erschlug Lachmi, den Bruder Goliats aus Gat.'
  rationale: Der vorgelegte hebräische Text nennt Goliat ausdrücklich. Die bedeutsame abweichende Parallelüberlieferung wird transparent in einer Fußnote genannt, statt den Haupttext stillschweigend zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwierige masoretische Lesart bleibt im Haupttext erhalten; die Textvariante wird nicht harmonisiert, sondern in der Fußnote offengelegt. „Betlehemiter“ und „Weberbaum“ sind knappe, sachlich genaue Bezeichnungen.
