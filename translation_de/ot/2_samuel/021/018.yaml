base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/018.yaml
  text: After this[a], there was again war with the Philistines at Gob, and then Sibbecai the Hushathite struck down Saph[b], who was among the descendants of Rapha.
translation:
  language: de
  text: Danach kam es bei Gob erneut zum Krieg mit den Philistern. Da erschlug Sibbechai, der Huschathiter, Saf[a], der zu den Nachkommen Rafas[b] gehörte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text hat „Saf“; im Parallelbericht in 1. Chronik 20,4 lautet der Name „Sippai“.
    reason: textual_variant
  - marker: b
    text: 'Oder: „der zu den Nachkommen des Riesen gehörte“. Das Hebräische kann einen Ahnherrn namens Rafa meinen oder die mit dem Riesen beziehungsweise den Rafaitern verbundene Linie.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: Danach
  rationale: Gibt den zeitlichen Übergang knapp und natürlich wieder.
- source_word: וַתְּהִי עוֹד הַמִּלְחָמָה
  choice: kam es erneut zum Krieg
  rationale: Bewahrt den Wiederholungsaspekt von עוֹד und entspricht natürlichem modernem Deutsch.
- source_word: בְּגֹב
  choice: bei Gob
  rationale: Bei einer Schlacht bzw. einem Kriegsschauplatz ist „bei“ idiomatisch; ב kann hier örtlich verstanden werden.
- source_word: פְּלִשְׁתִּים
  choice: den Philistern
  rationale: Übliche deutsche Bezeichnung des Volkes.
- source_word: אָז
  choice: Damals
  rationale: Markiert den anschließenden Zeitpunkt, ohne einen zusätzlichen logischen Zusammenhang einzutragen.
- source_word: הִכָּה
  choice: erschlug
  rationale: Im Kampfzusammenhang bezeichnet נכה hier sehr wahrscheinlich einen tödlichen Schlag; „erschlug“ ist prägnant und würdig.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Sibbechai, der Huschathiter
  rationale: Transliteriert Namen und Herkunftsbezeichnung in einer im Deutschen verständlichen Form.
- source_word: סַף
  choice: Saf
  rationale: Folgt dem masoretischen Text; die abweichende Namensform im Parallelbericht wird in einer Fußnote genannt.
- source_word: אֲשֶׁר בִּילִדֵי הָרָפָה
  choice: einen von den Nachkommen Rafas
  rationale: Gibt die Zugehörigkeit zur Nachkommenschaft wieder und lässt im Haupttext Rafa als Namen bzw. Ahnherrn stehen.
theological_decisions:
- issue: Ob הָרָפָה als Eigenname beziehungsweise Sippenahne oder als Bezeichnung „der Riese“ zu verstehen ist
  choice: Rafa als Name bzw. Ahnherr
  alternative: „der Riese“ oder „der Rafait“
  rationale: Die genealogische Wendung legt eine Abstammungs- oder Sippenangabe nahe. Da der hebräische Ausdruck jedoch unterschiedlich verstanden werden kann, bleibt die alternative Deutung in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper erzählerischer Satzführung. Die Eigennamen sind deutsch transliteriert; echte textliche und lexikalische Mehrdeutigkeiten werden in Fußnoten bewahrt.
