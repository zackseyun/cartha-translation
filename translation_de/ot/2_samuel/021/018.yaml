  naturalness: Modernes Standarddeutsch und der erzählerische Registerton sind insgesamt gelungen. „Saf, einen von den Nachkommen Rafas“ ist als Apposition zwar verständlich, aber weniger flüssig als ein Relativsatz. „Da“ bildet אָז als nächsten Erzählschritt natürlicher ab als „Damals“.
