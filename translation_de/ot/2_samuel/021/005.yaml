  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הָ/אִישׁ֙ אֲשֶׁ֣ר כִּלָּ֔/נוּ וַ/אֲשֶׁ֖ר דִּמָּה לָ֑/נוּ נִשְׁמַ֕דְנוּ מֵֽ/הִתְיַצֵּ֖ב בְּ/כָל גְּבֻ֥ל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/005.yaml
  text: They said to the king[a], “The man who consumed us, and who planned against us[b], so that we should be destroyed from having a place within all the territory of Israel—”
translation:
  language: de
  text: 'Sie sagten zum König: „Der Mann, der uns aufgerieben hat und gegen uns plante,[a] uns zu vernichten, sodass wir uns im ganzen Gebiet Israels nicht mehr halten könnten[b] –“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Böses gegen uns ersann“. Das hebräische Verb kann ein feindliches Planen oder Ersinnen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „davon, sich im ganzen Gebiet Israels hinzustellen/zu behaupten“, also dort weiterhin Bestand und einen Platz zu haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּנוּ
  choice: uns aufgerieben hat
  rationale: Das Piël von כלה bezeichnet hier das Aufzehren beziehungsweise Zugrunderichten. „Aufgerieben“ bewahrt die bildhafte Härte der Anklage, ohne eine bereits vollständig vollzogene Vernichtung zu behaupten.
- source_word: דִּמָּה לָנוּ
  choice: gegen uns plante
  rationale: דמה hat in diesem Zusammenhang den Sinn von ersinnen oder planen; לָנוּ wird wegen der feindlichen Absicht idiomatisch mit „gegen uns“ wiedergegeben.
- source_word: נִשְׁמַדְנוּ
  choice: uns zu vernichten
  rationale: Das Nifal von שׁמד bezeichnet Vernichtung oder Ausrottung. Der deutsche Infinitiv bindet die beabsichtigte Vernichtung natürlich an das feindliche Planen an.
- source_word: מֵהִתְיַצֵּב
  choice: sodass wir uns … nicht mehr halten könnten
  rationale: התיצב bedeutet wörtlich, sich hinzustellen oder festen Stand zu gewinnen. Im Zusammenhang bezeichnet es den fortdauernden Bestand beziehungsweise das Bleiberecht der Gibeoniter in Israel.
- source_word: בְּכָל גְּבֻל יִשְׂרָאֵל
  choice: im ganzen Gebiet Israels
  rationale: גְּבוּל bezeichnet hier nicht nur eine Grenzlinie, sondern das gesamte Hoheits- oder Siedlungsgebiet Israels.
- source_word: הָאִישׁ
  choice: Der Mann
  rationale: Der bestimmte Ausdruck verweist auf Saul zurück und bleibt in der direkten Rede bewusst knapp und anklagend.
theological_decisions:
- issue: Verhältnis von Plan, Vernichtung und Verlust des Standorts in Israel
  choice: als feindliche Absicht mit daraus folgender Unmöglichkeit des Bleibens wiedergegeben
  alternative: 'als reine Ergebnisaussage: „und es dahin brachte, dass wir vernichtet wurden“'
  rationale: Die knappe hebräische Folge lässt Zweck und Ergebnis eng ineinanderlaufen. Die Übersetzung macht die beabsichtigte Vernichtung verständlich, ohne eine besondere theologische Deutung des Handelns Sauls einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Aufgerieben“ hält die drastische Bildlichkeit des Hebräischen fest; „sich halten können“ gibt den Gedanken eines fortdauernden Standorts idiomatisch wieder. Der Gedankenstrich wahrt den in Vers 5 noch nicht abgeschlossenen Satz, der in Vers 6 weitergeführt wird.
