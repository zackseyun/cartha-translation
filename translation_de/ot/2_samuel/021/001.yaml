source:
  edition: WLC
  text: וַ/יְהִ֣י רָעָב֩ בִּ/ימֵ֨י דָוִ֜ד שָׁלֹ֣שׁ שָׁנִ֗ים שָׁנָה֙ אַחֲרֵ֣י שָׁנָ֔ה וַ/יְבַקֵּ֥שׁ דָּוִ֖ד אֶת פְּנֵ֣י יְהוָ֑ה וַ/יֹּ֣אמֶר יְהוָ֗ה אֶל שָׁאוּל֙ וְ/אֶל בֵּ֣ית הַ/דָּמִ֔ים עַל אֲשֶׁר הֵמִ֖ית אֶת הַ/גִּבְעֹנִֽים־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: There was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
translation:
  language: de
  text: 'Zur Zeit Davids herrschte drei Jahre lang eine Hungersnot, Jahr für Jahr. Da suchte David das Angesicht Jahwes[a]. Jahwe antwortete: »Sie ist wegen Saul und wegen seines blutschuldigen Hauses gekommen[b], weil er die Gibeoniter getötet hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „suchte das Angesicht Jahwes“; gemeint ist, dass David sich an Jahwe wandte und ihn befragte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Haus der Blut[e]“; eine hebräische Wendung für ein Haus beziehungsweise eine Dynastie, die des Blutvergießens oder der Blutschuld schuldig ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: Hungersnot
  rationale: Im erzählenden Zusammenhang bezeichnet das Wort eine schwere, das Land betreffende Nahrungsmittelknappheit; „Hungersnot“ ist im Deutschen präziser als „Hunger“.
- source_word: שָׁלֹשׁ שָׁנִים שָׁנָה אַחֲרֵי שָׁנָה
  choice: drei Jahre lang, Jahr für Jahr
  rationale: Die Wiedergabe bewahrt sowohl die Zeitangabe als auch die hebräische Wiederholung, die das ununterbrochene Andauern hervorhebt.
- source_word: וַיְבַקֵּשׁ ... אֶת־פְּנֵי יְהוָה
  choice: suchte David das Angesicht Jahwes
  rationale: Die bildhafte hebräische Wendung wird bewahrt; sie bezeichnet hier, dass David sich an Jahwe wandte, um ihn zu befragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen geläufigen wissenschaftlichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל שָׁאוּל וְאֶל בֵּית הַדָּמִים
  choice: wegen Saul und wegen seines mit Blutschuld beladenen Hauses
  rationale: Das im Kontext ursächliche אֶל wird mit „wegen“ wiedergegeben. „Haus“ bezeichnet Sauls Hausgemeinschaft beziehungsweise Dynastie; „mit Blutschuld beladen“ vermittelt die rechtlich-moralische Schuld des Ausdrucks „Haus der Blut[taten]“.
- source_word: עַל אֲשֶׁר הֵמִית אֶת־הַגִּבְעֹנִים
  choice: weil er die Gibeoniter getötet hat
  rationale: Das singularische Verb weist auf Saul als verantwortlichen Handelnden zurück. „Getötet“ gibt die Aussage klar wieder, ohne eine im Verb nicht zwingend enthaltene gerichtliche Hinrichtung anzunehmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname wahrt, dass der hebräische Text den Gottesnamen und nicht den Titel אֲדֹנָי verwendet.
- issue: Bezug der Blutschuld
  choice: Saul und sein Haus werden als Ursache der Hungersnot genannt; Saul wird ausdrücklich das Töten der Gibeoniter zugeschrieben.
  alternative: „gegen Saul und gegen das Haus der Bluttaten“ ohne ausdrücklich kausale Verknüpfung
  rationale: Die Antwort erklärt im Zusammenhang den Grund der Hungersnot. Die deutsche Kausalformulierung macht diese Funktion deutlich, während die eigentümliche Doppelbezeichnung Saul und sein Haus erhalten bleibt.
- issue: Ergänztes Bezugswort am Anfang der direkten Rede
  choice: „Sie“ bezieht sich auf die Hungersnot.
  alternative: 'Elliptisch: „Wegen Saul und wegen seines Hauses der Blutschuld“'
  rationale: Das Hebräische formuliert knapp ohne ausdrückliches Subjekt. Im Deutschen stellt das Pronomen den Bezug zur Hungersnot natürlich her, ohne die Ursache näher auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Bildsprache „das Angesicht Jahwes suchen“ bleibt im Haupttext erhalten und wird in der Fußnote erklärt. Die wiederholte Zeitangabe „drei Jahre lang, Jahr für Jahr“ bewahrt die Betonung des Ausgangstextes.
