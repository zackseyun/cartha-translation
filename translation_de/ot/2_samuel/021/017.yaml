base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/017.yaml
  text: But Abishai son of Zeruiah came to his aid[a], struck the Philistine, and killed him. Then David’s men swore to him, saying, “You must not go out with us to battle any longer, lest you extinguish the lamp of Israel.”
translation:
  language: de
  text: 'Doch Abischai, der Sohn der Zeruja, kam ihm zu Hilfe, schlug den Philister und tötete ihn. Da schworen Davids Männer ihm: »Du darfst nicht mehr mit uns in den Kampf ziehen, damit du die Leuchte Israels[a] nicht auslöschst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »die Lampe Israels«; gemeint ist bildhaft Davids lebenswichtige Bedeutung für das Volk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזָר לוֹ
  choice: kam ihm zu Hilfe
  rationale: עזר bezeichnet Hilfe oder Beistand. Die Formulierung gibt Abischais Eingreifen im Kampf natürlich und präzise wieder.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: Abischai, der Sohn der Zeruja
  rationale: Die Eigennamen folgen der im Deutschen üblichen biblischen Form; בן wird als Verwandtschaftsbezeichnung wiedergegeben.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: schlug den Philister
  rationale: נכה bedeutet hier „schlagen“. Da das folgende Verb den Tod ausdrücklich nennt, vermeidet diese Wiedergabe eine unnötige Vorwegnahme.
- source_word: וַיְמִיתֵהוּ
  choice: und tötete ihn
  rationale: Die Hifil-Form von מות bezeichnet eindeutig das Verursachen des Todes; „tötete ihn“ ist im modernen Deutsch direkt und natürlich.
- source_word: אָז נִשְׁבְּעוּ אַנְשֵׁי דָוִד לוֹ
  choice: Da schworen Davids Männer ihm
  rationale: נשבע bezeichnet das Ablegen eines Eides. „Davids Männer“ gibt die hebräische Genitivverbindung knapp und verständlich wieder.
- source_word: לֹא תֵצֵא עוֹד אִתָּנוּ לַמִּלְחָמָה
  choice: Du darfst nicht mehr mit uns in den Kampf ziehen
  rationale: Im Zusammenhang des Schwurs hat das Imperfekt nachdrücklich verbietende Kraft. „Nicht mehr“ entspricht עוֹד und die Wendung ist idiomatisches modernes Deutsch.
- source_word: וְלֹא תְכַבֶּה
  choice: damit du … nicht auslöschst
  rationale: Die formal beigeordnete Negation bezeichnet hier die befürchtete Folge, die durch das Verbot verhindert werden soll. Diese deutsche Konstruktion bildet den Sinn klar ab.
- source_word: נֵר יִשְׂרָאֵל
  choice: die Leuchte Israels
  rationale: נֵר bezeichnet eine Lampe oder Leuchte. „Leuchte“ bewahrt das konkrete Bild und verbindet sich im Deutschen natürlich mit dem Verb „auslöschen“.
theological_decisions:
- issue: Metaphorische Bezeichnung Davids als Israels lebenswichtige Leuchte
  choice: Die Metapher „die Leuchte Israels“ bleibt im Haupttext erhalten.
  alternative: „das Licht Israels“ oder deutend „Israels Hoffnung“
  rationale: Der hebräische Text verwendet ein konkretes Bild, keine abstrakte Erklärung. Seine Beibehaltung wahrt die königliche und nationale Symbolik, ohne Davids Bedeutung dogmatisch einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Kampfschilderung bleibt knapp; die Eidformel wird mit natürlicher, aber nachdrücklicher Verbotsform wiedergegeben. Das hebräische Bild נֵר wird als „Leuchte“ im Text bewahrt und in der Fußnote wörtlich erläutert.
