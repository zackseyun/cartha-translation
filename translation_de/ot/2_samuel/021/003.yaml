  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/גִּבְעֹנִ֔ים מָ֥ה אֶעֱשֶׂ֖ה לָ/כֶ֑ם וּ/בַ/מָּ֣ה אֲכַפֵּ֔ר וּ/בָרְכ֖וּ אֶת נַחֲלַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/003.yaml
  text: David said to the Gibeonites[a], “What shall I do for you, and with what shall I make atonement[b], that you may bless the inheritance of Yahweh?”
translation:
  language: de
  text: 'David sagte zu den Gibeonitern: „Was soll ich für euch tun, und womit soll ich Sühne leisten[a], damit ihr das Erbteil Jahwes[b] segnet[c]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wiedergutmachung leisten“. Das hebräische Verb bezeichnet hier die Behebung schwerer Schuld und kann einen ausdrücklich sühnenden Sinn haben.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Jahwes Erbteil“ ist hier Israel gemeint, das Volk, das Jahwe gehört.
    reason: cultural_note
  - marker: c
    text: 'Wörtlicher als beigeordneter Satz: „und segnet das Erbteil Jahwes“. Im Zusammenhang kann die Form den beabsichtigten Zweck oder das gewünschte Ergebnis ausdrücken.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die gewöhnliche Wiedergabe der narrativen Form von אמר; sie führt Davids direkte Rede ein, ohne den Sprechakt als bloße Frage enger auszulegen.
- source_word: הַגִּבְעֹנִים
  choice: die Gibeoniter
  rationale: Die etablierte deutsche Bezeichnung für die Bewohner beziehungsweise Volksgruppe von Gibeon.
- source_word: מָה אֶעֱשֶׂה לָכֶם
  choice: Was soll ich für euch tun
  rationale: Das Imperfekt hat hier deliberativen Sinn. „Was soll ich … tun?“ ist im modernen Deutschen natürlich und hält die Frage offen.
- source_word: וּבַמָּה
  choice: und womit
  rationale: 'Bewahrt die instrumentale Bedeutung von בְּ: David fragt, durch welches Mittel die Sühne erfolgen soll.'
- source_word: אֲכַפֵּר
  choice: soll ich Sühne leisten
  rationale: Das Piel von כפר bezeichnet hier die Beseitigung beziehungsweise Deckung schwerer Schuld. „Sühne leisten“ erhält dieses religiös-rechtliche Gewicht besser als das allgemeinere „Wiedergutmachung leisten“.
- source_word: וּבָרְכוּ
  choice: damit ihr … segnet
  rationale: Die mit וְ angeschlossene volitive Form lässt sich im Zusammenhang als beabsichtigte Folge verstehen. „Damit“ drückt diesen Zweck- beziehungsweise Ergebnissinn idiomatisch aus; die wörtlich koordinierende Lesart wird in einer Fußnote bewahrt.
- source_word: נַחֲלַת יְהוָה
  choice: den Erbbesitz Jahwes
  rationale: נַחֲלָה bezeichnet einen zugeteilten oder bleibenden Besitz. Hier ist damit Israel als das Jahwe gehörende Volk gemeint.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Bedeutung von כפר im Zusammenhang mit Blutschuld und gebrochenen Verpflichtungen
  choice: Sühne leisten
  alternative: Wiedergutmachung leisten; entsühnen
  rationale: „Sühne leisten“ bewahrt sowohl den Gedanken der Schuldbehebung als auch das theologische Gewicht des Verbs, ohne die konkrete Art der geforderten Handlung vorwegzunehmen.
- issue: Syntaktischer Sinn von וּבָרְכוּ אֶת נַחֲלַת יְהוָה
  choice: 'Zweck beziehungsweise Ergebnis: „damit ihr den Erbbesitz Jahwes segnet“'
  alternative: 'Einfache Beiordnung: „und segnet den Erbbesitz Jahwes“'
  rationale: Im Kontext fragt David nach einer Handlung, die zur Aufhebung des Unheils über Israel führen soll. Die hebräische Konjunktion kann jedoch auch schlichter koordinierend verstanden werden; diese echte Mehrdeutigkeit wird in der Fußnote genannt.
- issue: Referenz von נַחֲלַת יְהוָה
  choice: Israel als Jahwes Erbbesitz
  alternative: das Land als Jahwes Erbbesitz
  rationale: Im unmittelbaren Zusammenhang steht das von der Hungersnot betroffene Israel im Vordergrund. Der Ausdruck kann grundsätzlich auch das Land einschließen, weshalb die Übersetzung den bildhaften Oberbegriff „Erbbesitz“ beibehält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe am hebräischen Satzbau, ohne unnatürlich zu wirken. „Sühne leisten“ trägt den ernsten schuld- und bundestheologischen Kontext; Fußnoten bewahren lexikalische und syntaktische Alternativen.
