base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/014.yaml
  text: They buried the bones of Saul and of Jonathan his son in the land of Benjamin[a], in Zela, in the tomb of Kish his father. They did all that the king had commanded, and after that God responded to the plea for the land.
translation:
  language: de
  text: Sie begruben die Gebeine Sauls und seines Sohnes Jonatan im Gebiet Benjamins, in Zela, im Grab Kischs, des Vaters Sauls. Sie taten alles, was der König befohlen hatte. Danach ließ Gott sich für das Land erbitten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Danach erhörte Gott das Gebet für das Land.“ Das hebräische Verb bezeichnet eine günstige Antwort auf Bitten oder Flehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֶת עַצְמוֹת
  choice: Sie begruben die Gebeine
  rationale: „Gebeine“ gibt das konkrete עַצְמוֹת würdig und im Bestattungskontext natürlich wieder; der erzählende Wayyiqtol wird als Präteritum übersetzt.
- source_word: שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  choice: Sauls und seines Sohnes Jonatan
  rationale: Die Formulierung bewahrt die Zugehörigkeit beider Gebeine und macht deutlich, dass Jonatan Sauls Sohn ist.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: im Gebiet Benjamins
  rationale: „Gebiet“ vermittelt den territorialen Sinn von אֶרֶץ hier natürlicher als das im Deutschen missverständliche „Land Benjamin“.
- source_word: בְּצֵלָע
  choice: in Zela
  rationale: Der Ortsname wird in geläufiger deutscher Umschrift wiedergegeben.
- source_word: בְּקֶבֶר קִישׁ אָבִיו
  choice: im Grab Kischs, des Vaters Sauls
  rationale: קֶבֶר bezeichnet hier ein Grab beziehungsweise eine Grabstätte. Die explizite Nennung Sauls verhindert, dass Kisch irrtümlich als Vater Jonatans verstanden wird.
- source_word: וַיַּעֲשׂוּ כֹּל אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: Sie taten alles, was der König befohlen hatte
  rationale: Die Übersetzung erhält den Relativsatz und gibt die zeitlich vorausliegende Anordnung im Deutschen mit Plusquamperfekt wieder.
- source_word: וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ
  choice: ließ Gott sich für das Land erbitten
  rationale: Der Niphal von עתר bezeichnet, dass Gott sich einer Bitte zugänglich zeigt beziehungsweise sie günstig beantwortet. Die Formulierung bewahrt diese Bedeutung, ohne ein im Satz nicht ausdrücklich genanntes Gebet als Substantiv in den Haupttext einzuführen.
- source_word: אַחֲרֵי כֵן
  choice: Danach
  rationale: Die knappe Zeitangabe gibt die Abfolge der Ereignisse natürlich wieder.
theological_decisions:
- issue: Bedeutung von וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ
  choice: Danach ließ Gott sich für das Land erbitten.
  alternative: Danach erhörte Gott das Gebet für das Land.
  rationale: Die gewählte Fassung wahrt die im Verb enthaltene günstige Reaktion auf eine Bitte, ohne die Bitte als ausdrücklich genanntes Satzglied erscheinen zu lassen. Sie vermeidet zugleich die stärkere, im Vers nicht formulierte Deutung, Gott habe das Land „geheilt“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gebeine“ und „ließ sich erbitten“ entsprechen dem Bestattungs- und Gebetskontext, ohne unnötig altertümlich zu werden; die Fußnote erläutert die ungewohntere, aber quellennähere Schlussformulierung.
