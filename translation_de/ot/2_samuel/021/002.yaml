  text: וַ/יִּקְרָ֥א הַ/מֶּ֛לֶךְ לַ/גִּבְעֹנִ֖ים וַ/יֹּ֣אמֶר אֲלֵי/הֶ֑ם וְ/הַ/גִּבְעֹנִ֞ים לֹ֣א מִ/בְּנֵ֧י יִשְׂרָאֵ֣ל הֵ֗מָּה כִּ֚י אִם מִ/יֶּ֣תֶר הָ/אֱמֹרִ֔י וּ/בְנֵ֤י יִשְׂרָאֵל֙ נִשְׁבְּע֣וּ לָ/הֶ֔ם וַ/יְבַקֵּ֤שׁ שָׁאוּל֙ לְ/הַכֹּתָ֔/ם בְּ/קַנֹּאת֥/וֹ לִ/בְנֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/002.yaml
  text: So the king called the Gibeonites and spoke to them[a]. Now the Gibeonites were not from the sons of Israel, but from the remnant of the Amorites; and the sons of Israel had sworn to them[c][b]. But Saul had sought to strike them down in his zeal for the sons of Israel and Judah.
translation:
  language: de
  text: Da ließ der König die Gibeoniter rufen und sprach mit ihnen. Die Gibeoniter gehörten nämlich nicht zu den Israeliten, sondern stammten vom Rest der Amoriter ab. Die Israeliten hatten ihnen einen Eid geleistet; Saul aber hatte in seinem Eifer für Israel und Juda versucht, sie niederzuschlagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus Eifersucht für Israel und Juda“. Das hebräische Wort kann je nach Zusammenhang sowohl Eifer als auch Eifersucht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא הַמֶּלֶךְ לַגִּבְעֹנִים
  choice: Da ließ der König die Gibeoniter rufen
  rationale: קרא mit ל bezeichnet hier das Herbeirufen. Die kausative deutsche Wendung ist natürlich und lässt wie der hebräische Text den König als Veranlasser erscheinen.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: und sprach mit ihnen
  rationale: Die Wendung gibt das Gesprächseinleitende idiomatisch wieder; ein wörtliches „sagte zu ihnen“ wäre ebenfalls möglich, wirkt ohne anschließende direkte Rede jedoch weniger natürlich.
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: gehörten nämlich nicht zu den Israeliten
  rationale: Die nationale Zugehörigkeit ist im Deutschen mit „Israeliten“ klar und natürlich ausgedrückt. Das erklärende ו wird mit „nämlich“ wiedergegeben.
- source_word: מִיֶּתֶר הָאֱמֹרִי
  choice: waren ein Rest der Amoriter
  rationale: יֶתֶר bezeichnet das Übriggebliebene beziehungsweise einen verbliebenen Teil. „Ein Rest“ bewahrt diese Aussage, ohne eine technisch-theologische Bedeutung von „Überrest“ aufzudrängen.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: hatten ihnen einen Eid geschworen
  rationale: Das Plusquamperfekt macht deutlich, dass die Verpflichtung Sauls Vorgehen vorausging. Die ausdrückliche Nennung des Eides ist im Deutschen idiomatisch.
- source_word: וַיְבַקֵּשׁ שָׁאוּל לְהַכֹּתָם
  choice: Saul aber hatte versucht, sie zu erschlagen
  rationale: בקש mit Infinitiv bezeichnet hier Sauls Bestreben beziehungsweise Versuch. נכה trägt in diesem Zusammenhang tödliche Gewalt und wird mit „erschlagen“ prägnant wiedergegeben.
- source_word: בְּקַנֹּאתוֹ לִבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: weil er für Israel und Juda eiferte
  rationale: קנא kann Eifer oder Eifersucht bezeichnen. Im politischen Zusammenhang ist „eifern für“ die natürliche Hauptlesart und erhält zugleich die problematische Intensität seines Handelns.
theological_decisions:
- issue: Wiedergabe von בני ישראל als nationale Bezeichnung
  choice: Israeliten / Israel
  alternative: Söhne Israels
  rationale: Die idiomatische Wiedergabe bezeichnet das Volk einschließlich aller Angehörigen klar. Beim zweiten Vorkommen steht „Israel“ parallel zu „Juda“ und bewahrt so die politische Gegenüberstellung.
- issue: Motivbezeichnung durch קנא
  choice: für Israel und Juda eifern
  alternative: aus Eifersucht für Israel und Juda handeln
  rationale: Der Zusammenhang spricht eher von nationalem Eifer als von Neid. Die Übersetzung rechtfertigt Sauls Gewalt nicht, sondern lässt die Spannung zwischen seinem behaupteten Eifer und dem gebrochenen Eid bestehen.
- issue: Gewaltabsicht in לְהַכֹּתָם
  choice: sie zu erschlagen
  alternative: sie niederzuschlagen
  rationale: Im Kontext der Blutschuld und der Verfolgung der Gibeoniter ist tödliche Gewalt gemeint. „Erschlagen“ macht dies deutlich, ohne zusätzliche Motive oder Einzelheiten einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die erklärende Zwischeninformation wird durch „nämlich“ kenntlich gemacht. „Erschlagen“ wahrt den ernsten historischen Ton; „eifern“ erhält die Mehrdeutigkeit des Motivbegriffs durch eine Fußnote.
