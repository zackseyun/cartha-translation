  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ הַ/גִּבְעֹנִ֗ים אֵֽין ל/י כֶּ֤סֶף וְ/זָהָב֙ עִם שָׁא֣וּל וְ/עִם בֵּית֔/וֹ וְ/אֵֽין לָ֥/נוּ אִ֖ישׁ לְ/הָמִ֣ית בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֛אמֶר מָֽה אַתֶּ֥ם אֹמְרִ֖ים אֶעֱשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/004.yaml
  text: The Gibeonites said to him[a], “We have no claim for silver or gold against Saul or against his house, and it is not for us to put any man in Israel to death.” Then he said[b], “What do you say that I should do for you?”
translation:
  language: de
  text: 'Die Gibeoniter sagten zu ihm: „Uns geht es gegenüber Saul und seinem Haus nicht um Silber oder Gold,[a] und es steht uns nicht zu, in Israel jemanden zu töten.“[b] Da sagte er: „Was soll ich eurer Meinung nach für euch tun?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zwischen uns und Saul und seinem Haus geht es nicht um Silber oder Gold.“ Die hebräische Wendung ist idiomatisch und bezieht sich wahrscheinlich auf eine finanzielle Entschädigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch möglich: „Wir haben niemanden, den wir in Israel töten könnten.“ Gemeint ist wahrscheinlich: „Wir haben nicht das Recht, in Israel jemanden zu töten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין לִי כֶּסֶף וְזָהָב עִם שָׁאוּל וְעִם בֵּיתוֹ
  choice: Uns geht es gegenüber Saul und seinem Haus nicht um Silber oder Gold
  rationale: Die idiomatische hebräische Wendung verneint im Kontext wahrscheinlich eine finanzielle Entschädigungsforderung. Die deutsche Formulierung gibt diesen Sinn natürlich wieder, ohne die Aussage stärker als nötig juristisch festzulegen. Der hebräische Singular לִי wird entsprechend der kollektiv sprechenden Gibeoniter im Plural wiedergegeben.
- source_word: עִם
  choice: gegenüber
  rationale: עִם bedeutet gewöhnlich „mit“, bezeichnet hier aber die beteiligte Gegenpartei in einer Streit- oder Entschädigungsangelegenheit. „Gegenüber“ bewahrt diesen Bezug, ohne zwingend eine förmliche Klage zu unterstellen.
- source_word: וְאֵין לָנוּ אִישׁ לְהָמִית בְּיִשְׂרָאֵל
  choice: und es steht uns nicht zu, in Israel jemanden zu töten
  rationale: Die elliptische Aussage betrifft im Kontext eher fehlende Befugnis oder fehlendes Recht als das Fehlen einer Person, die getötet werden könnte. „Es steht uns nicht zu“ gibt diese idiomatische Bedeutung klar und würdig wieder.
- source_word: אִישׁ
  choice: jemanden
  rationale: אִישׁ bezeichnet hier generisch eine einzelne Person. „Jemanden“ ist im modernen Deutschen natürlich und bewahrt den allgemeinen Sinn.
- source_word: מָה אַתֶּם אֹמְרִים אֶעֱשֶׂה לָכֶם
  choice: Was verlangt ihr, das ich für euch tun soll?
  rationale: Die komprimierte hebräische Frage bittet die Gibeoniter, ihre gewünschte Wiedergutmachung zu nennen. „Was verlangt ihr“ ist im Deutschen natürlicher als eine wörtliche Wiedergabe mit „sagen“; der folgende Satzteil bewahrt den Bezug auf Davids Handeln.
theological_decisions:
- issue: Befugnis der Gibeoniter zur Tötung eines Israeliten
  choice: es steht uns nicht zu
  alternative: wir haben niemanden, den wir in Israel töten könnten
  rationale: Die Übersetzung folgt dem wahrscheinlich gemeinten rechtlichen beziehungsweise gesellschaftlichen Vorbehalt, ohne eine weitergehende theologische Aussage über staatliche Strafgewalt einzutragen. Die wörtlichere syntaktische Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist natürlich formuliert; idiomatische Ellipsen des Hebräischen werden sinngerecht entfaltet, während echte sprachliche Alternativen in den Fußnoten erhalten bleiben.
