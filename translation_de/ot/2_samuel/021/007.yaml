source:
  edition: WLC
  text: וַ/יַּחְמֹ֣ל הַ/מֶּ֔לֶךְ עַל מְפִי בֹ֖שֶׁת בֶּן יְהוֹנָתָ֣ן בֶּן שָׁא֑וּל עַל שְׁבֻעַ֤ת יְהוָה֙ אֲשֶׁ֣ר בֵּֽינֹתָ֔/ם בֵּ֣ין דָּוִ֔ד וּ/בֵ֖ין יְהוֹנָתָ֥ן בֶּן שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/007.yaml
  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
translation:
  language: de
  text: Doch der König verschonte Mefi-Boschet, den Sohn Jonatans, des Sohnes Sauls, wegen des Eides Jahwes[a], der zwischen ihnen bestand, zwischen David und Jonatan, dem Sohn Sauls.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Eid Jahwes«. Wahrscheinlich ist ein Eid zwischen David und Jonatan gemeint, der unter Anrufung Jahwes geschworen wurde; die Wendung legt dies jedoch nicht ausdrücklich fest.'
    reason: lexikalische und theologische Mehrdeutigkeit
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: verschonte
  rationale: Das Verb bezeichnet hier konkret, dass der König Mefi-Boschet nicht töten beziehungsweise zum Tod ausliefern ließ. »Verschonte« gibt diesen erzählerischen Sinn präziser wieder als das allgemeinere »hatte Mitleid mit«.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der Titel bezeichnet im Zusammenhang David; die Übersetzung bewahrt jedoch die Ausdrucksform des hebräischen Textes.
- source_word: מְפִיבֹשֶׁת
  choice: Mefi-Boschet
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, am Hebräischen orientierten Form wiedergegeben.
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: den Sohn Jonatans, des Sohnes Sauls
  rationale: Die wiederholte Abstammungsangabe des Hebräischen bleibt sichtbar, statt sie deutend zu »Sauls Enkel« zu glätten.
- source_word: עַל
  choice: wegen
  rationale: Die Präposition führt hier den Grund dafür ein, dass der König Mefi-Boschet verschonte.
- source_word: שְׁבֻעַת יְהוָה
  choice: des Eides Jahwes
  rationale: Die formnahe Wiedergabe bewahrt die mögliche Spannung zwischen einem Jahwe zugeschriebenen Eid und einem unter Anrufung Jahwes geschworenen Eid.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר בֵּינֹתָם
  choice: der zwischen ihnen bestand
  rationale: Diese natürliche deutsche Formulierung wahrt die relationale Aussage des hebräischen Textes.
- source_word: בֵּין דָּוִד וּבֵין יְהוֹנָתָן
  choice: zwischen David und Jonatan
  rationale: Im Deutschen genügt ein einmaliges »zwischen«; die beiderseitige Beziehung bleibt eindeutig.
theological_decisions:
- issue: Bedeutung von שְׁבֻעַת יְהוָה (»Eid Jahwes«)
  choice: Die Hauptübersetzung bewahrt die formale Mehrdeutigkeit; die Fußnote nennt als wahrscheinlichen Sinn einen im Namen Jahwes geschworenen Eid zwischen David und Jonatan.
  alternative: Ein von Jahwe selbst geleisteter oder gegebener Eid.
  rationale: Im erzählerischen Bundeskontext ist wahrscheinlich ein Eid gemeint, bei dem Jahwe als Zeuge angerufen wurde. Der hebräische Genitiv legt diese Deutung jedoch nicht ausdrücklich fest, daher wird sie nicht in den Haupttext eingetragen.
- issue: Bezug von »der König«
  choice: Der Titel bleibt im Text stehen; gemeint ist David.
  alternative: Den Titel im Haupttext durch »David« ersetzen.
  rationale: Der Kontext identifiziert den König, doch der hebräische Wortlaut verwendet an dieser Stelle den Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die genealogische Wiederholung und die Mehrdeutigkeit von »Eid Jahwes« bleiben erhalten; Satzbau und Namensformen sind zugleich für heutige Leser gut verständlich.
