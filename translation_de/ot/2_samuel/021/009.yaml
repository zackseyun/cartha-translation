  text: וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד הַ/גִּבְעֹנִ֗ים וַ/יֹּקִיעֻ֤/ם בָּ/הָר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יִּפְּל֥וּ שבעתים יָ֑חַד ו/הם הֻמְת֜וּ בִּ/ימֵ֤י קָצִיר֙ בָּ/רִ֣אשֹׁנִ֔ים תחלת קְצִ֥יר שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/009.yaml
  text: He gave them into the hand of the Gibeonites[a], and they hanged them on the mountain before Yahweh, and the seven of them fell together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
translation:
  language: de
  text: Er übergab sie den Gibeonitern. Sie hängten sie auf dem Berg vor Jahwe auf[a], und die sieben fielen gemeinsam. Sie wurden in den ersten Tagen der Ernte zu Tode gebracht, zu Beginn der Gerstenernte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „pfählten sie“ beziehungsweise „stellten sie öffentlich zur Schau“. Das hebräische Verb kann allgemein ein öffentliches Aufhängen oder Ausstellen bezeichnen; die genaue Art des Vollzugs ist nicht sicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם בְּיַד הַגִּבְעֹנִים
  choice: Er übergab sie den Gibeonitern
  rationale: Die Verbindung von נתן mit בְּיַד bezeichnet hier die Übergabe in die Gewalt beziehungsweise Verfügungsgewalt anderer. Das natürliche deutsche „übergab“ gibt den idiomatischen und rechtlich-gerichtlichen Sinn wieder, ohne das hebräische Bild unverständlich wörtlich nachzuahmen.
- source_word: וַיֹּקִיעֻם
  choice: Diese hängten sie ... auf
  rationale: יקע bezeichnet ein öffentliches Aufhängen, Zur-Schau-Stellen oder möglicherweise Pfählen. „aufhängen“ eignet sich im Kontext als verständliche Hauptwiedergabe; die genaue Vollzugsart bleibt durch die Fußnote offen.
- source_word: בָּהָר
  choice: auf dem Berg
  rationale: Die bestimmte Singularform wird formal und natürlich als „auf dem Berg“ wiedergegeben.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „vor“ bewahrt die räumliche wie auch die kultisch-gerichtliche Bedeutung von לִפְנֵי, ohne sie näher festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird entsprechend der Projektvorgabe als „Jahwe“ wiedergegeben.
- source_word: וַיִּפְּלוּ שבעתים יָחַד
  choice: und alle sieben fielen gemeinsam
  rationale: Die Form שבעתים ist hier im Kontext als Bezeichnung der sieben Männer zu verstehen. „fielen“ bewahrt das hebräische Todesbild, während „gemeinsam“ יָחַד wiedergibt.
- source_word: הֻמְתוּ
  choice: Sie wurden ... getötet
  rationale: Der Hophal von מות bezeichnet das Verursachen ihres Todes. Die passive Form bleibt erhalten.
- source_word: בִּימֵי קָצִיר בָּרִאשֹׁנִים
  choice: in den ersten Tagen der Ernte
  rationale: Die Wiedergabe erhält die zeitliche Bestimmung und die pluralische Form des Hebräischen.
- source_word: תחלת קְצִיר שְׂעֹרִים
  choice: zu Beginn der Gerstenernte
  rationale: Die appositionelle Zeitangabe präzisiert, um welche frühe Erntezeit es sich handelt.
theological_decisions:
- issue: Genaue Art der durch יקע bezeichneten Hinrichtung beziehungsweise öffentlichen Zurschaustellung
  choice: Im Haupttext steht „hängten ... auf“; eine Fußnote nennt „pfählten“ und „stellten öffentlich zur Schau“ als mögliche Bedeutungsnuancen.
  alternative: Sie pfählten sie; sie stellten sie öffentlich zur Schau.
  rationale: Der Ausdruck beschreibt eine öffentliche, vor Jahwe vollzogene Tötung oder Zurschaustellung, legt aber die konkrete Methode nicht zweifelsfrei fest. Die Übersetzung wahrt diese Spannung, statt eine bestimmte Hinrichtungsart dogmatisch festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze machen den Wechsel des handelnden Subjekts deutlich. Das etwas bildhafte „fielen“ bleibt als bewusste Nähe zum Hebräischen erhalten.
