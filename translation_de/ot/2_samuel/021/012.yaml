  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יִּקַּ֞ח אֶת עַצְמ֤וֹת שָׁאוּל֙ וְ/אֶת עַצְמוֹת֙ יְהוֹנָתָ֣ן בְּנ֔/וֹ מֵ/אֵ֕ת בַּעֲלֵ֖י יָבֵ֣ישׁ גִּלְעָ֑ד אֲשֶׁר֩ גָּנְב֨וּ אֹתָ֜/ם מֵ/רְחֹ֣ב בֵּֽית שַׁ֗ן אֲשֶׁ֨ר תלו/ם שם ה/פלשתים בְּ/י֨וֹם הַכּ֧וֹת פְּלִשְׁתִּ֛ים אֶת שָׁא֖וּל בַּ/גִּלְבֹּֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/012.yaml
  text: Then David went and took the bones of Saul and the bones of Jonathan his son from the citizens of Jabesh-gilead[a], who had stolen them from the public square of Beth-shan[c][b], where the Philistines had hung them on the day the Philistines struck down Saul on Gilboa.
translation:
  language: de
  text: Da ging David hin und holte die Gebeine Sauls und die Gebeine seines Sohnes Jonatan von den Einwohnern von Jabesch-Gilead. Diese hatten sie vom öffentlichen Platz in Bet-Schean gestohlen[a], wo die Philister sie aufgehängt[b] hatten, an dem Tag, als die Philister Saul auf dem Gilboa erschlugen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heimlich weggenommen“. Wörtlicher: „gestohlen“; vgl. 1. Samuel 31,11–13.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur Schau gestellt“; möglicherweise auch: „aufgespießt“. Das hebräische Verb bedeutet zunächst „aufhängen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹת
  choice: Gebeine
  rationale: Das hebräische Substantiv bezeichnet wörtlich die Knochen. „Gebeine“ ist im deutschen Bestattungszusammenhang natürlich und würdevoll, ohne zum allgemeineren „Überreste“ zu verallgemeinern.
- source_word: בַּעֲלֵי יָבֵישׁ גִּלְעָד
  choice: die Einwohner von Jabesch-Gilead
  rationale: בַּעֲלֵי bezeichnet hier idiomatisch die zu einem Ort gehörenden Menschen. „Einwohner“ gibt dies im modernen Deutschen klar wieder.
- source_word: גָּנְבוּ
  choice: hatten ... weggenommen
  rationale: Das Verb bedeutet grundsätzlich „stehlen“. Im Zusammenhang mit der heimlichen Bergung der Leichname vermeidet „weggenommen“ jedoch die im Deutschen mögliche Unterstellung unrechtmäßiger Bereicherung und wahrt zugleich den Aspekt des Entfernens; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: רְחֹב
  choice: öffentlicher Platz
  rationale: Das Wort bezeichnet eine offene Fläche beziehungsweise einen Platz in einer Stadt; „öffentlicher Platz“ macht den Schauplatz der öffentlichen Zurschaustellung deutlich.
- source_word: בֵּית שַׁן
  choice: Bet-Schean
  rationale: Die Form folgt einer geläufigen deutschen Transkription des Ortsnamens.
- source_word: תלו/ם שם
  choice: sie aufgehängt hatten
  rationale: תלה bedeutet am unmittelbarsten „aufhängen“. Die konkrete Art der öffentlichen Zurschaustellung bleibt im Hebräischen offen und wird daher nicht als Pfählung festgelegt.
- source_word: הַכּוֹת ... אֶת שָׁאוּל
  choice: Saul ... erschlugen
  rationale: נכה bezeichnet hier den tödlichen Schlag gegen Saul. „Erschlugen“ ist prägnant und bewahrt die verbale Bildhaftigkeit, ohne bloß mit „töteten“ zu paraphrasieren.
- source_word: בַּגִּלְבֹּעַ
  choice: auf dem Gilboa
  rationale: Die Präposition und der bekannte Gebirgsname werden knapp wiedergegeben; eine erklärende Ergänzung wie „Gebirge“ steht nicht ausdrücklich im Text.
- source_word: וַיֵּלֶךְ ... וַיִּקַּח
  choice: Da ging David hin und holte
  rationale: Die fortschreitende Erzählfolge wird mit „Da“ wiedergegeben. „Holte“ entspricht in diesem Kontext natürlichem Deutsch für Davids Übernahme und Rückführung der Gebeine.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: seines Sohnes Jonatan
  rationale: Die deutsche Wortstellung identifiziert Jonatan eindeutig und natürlich als Sauls Sohn.
