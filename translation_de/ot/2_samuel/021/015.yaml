base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/015.yaml
  text: And there was war again between the Philistines and Israel[a], and David went down with his servants with him, and they fought against the Philistines, and David grew weary.
translation:
  language: de
  text: Und wieder kam es zum Krieg zwischen den Philistern und Israel. David zog mit seinen Dienern[a] hinab, und sie kämpften gegen die Philister. David wurde müde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Männern“. Wörtlich: „seinen Dienern“; damit können hier die Männer im königlichen Dienst, insbesondere militärische Gefolgsleute, gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: Und wieder kam es zum Krieg
  rationale: Die Formulierung gibt die narrative Einführung durch היה und die Wiederholung durch עוֹד in natürlichem, heutigem Deutsch wieder.
- source_word: לַפְּלִשְׁתִּים אֶת יִשְׂרָאֵל
  choice: zwischen den Philistern und Israel
  rationale: Die ungewöhnliche hebräische Verbindung bezeichnet hier die gegnerischen Kriegsparteien; die gewählte Fassung ist im Deutschen klar und wahrt diese Beziehung.
- source_word: וַיֵּרֶד
  choice: zog ... hinab
  rationale: „Hinabziehen“ bewahrt die Bewegungsrichtung von ירד und passt zum militärischen Zusammenhang.
- source_word: וַעֲבָדָיו עִמּוֹ
  choice: mit seinen Dienern
  rationale: עֲבָדָיו bezeichnet Männer im Dienst des Königs. Das deutsche „mit“ gibt zugleich עִמּוֹ wieder, ohne die im Deutschen schwerfällige Doppelung „seine Diener mit ihm“.
- source_word: וַיִּלָּחֲמוּ אֶת פְּלִשְׁתִּים
  choice: sie kämpften gegen die Philister
  rationale: Die Wendung bezeichnet das aktive Kämpfen gegen die Philister und wird idiomatisch und unmittelbar wiedergegeben.
- source_word: וַיָּעַף דָּוִד
  choice: Dabei wurde David müde
  rationale: יעף beschreibt das Ermüden beziehungsweise Erschöpftwerden. „Dabei“ stellt den naheliegenden Zusammenhang mit dem Kampf her, ohne eine darüber hinausgehende Ursache festzulegen.
