base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/013.yaml
  text: He brought up from there the bones of Saul and the bones of Jonathan his son[a], and they gathered the bones of those who had been impaled.
translation:
  language: de
  text: Er holte von dort die Gebeine Sauls und die Gebeine seines Sohnes Jonatan herauf, und sie sammelten die Gebeine der Aufgehängten[a] ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Gepfählten“ beziehungsweise „der öffentlich Ausgestellten“. Das hebräische Wort bezeichnet hier die hingerichteten Männer, deren Leichname öffentlich zur Schau gestellt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: holte ... herauf
  rationale: Das Hifil von עלה bezeichnet hier das Heraufbringen bzw. Bergen der Gebeine und bewahrt mit „herauf“ die räumliche Komponente.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Direkte und natürliche Wiedergabe der Ortsangabe.
- source_word: עַצְמוֹת
  choice: Gebeine
  rationale: Gibt „Knochen“ im würdevollen Bestattungskontext präzise und idiomatisch wieder.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: seines Sohnes Jonatan
  rationale: Stellt die Zugehörigkeit eindeutig heraus und entspricht natürlichem modernem Deutsch.
- source_word: וַיַּאַסְפוּ
  choice: sie sammelten ... ein
  rationale: Bewahrt den grammatischen Plural des hebräischen Verbs; „einsammeln“ bezeichnet das Bergen verstreuter Gebeine natürlich.
- source_word: הַמּוּקָעִים
  choice: der Hingerichteten
  rationale: Der Ausdruck bezeichnet die getöteten Männer, deren Körper öffentlich ausgestellt wurden; die allgemeinere Wiedergabe vermeidet eine ungesicherte Festlegung auf die genaue Hinrichtungs- oder Ausstellungsart.
