  text: וַ/יֻּגַּ֖ד לְ/דָוִ֑ד אֵ֧ת אֲשֶׁר עָשְׂתָ֛ה רִצְפָּ֥ה בַת אַיָּ֖ה פִּלֶ֥גֶשׁ שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/011.yaml
  text: And it was reported to David what Rizpah daughter of Aiah, Saul’s concubine, had done.
translation:
  language: de
  text: David wurde mitgeteilt, was Rizpa, die Tochter Ajas, Sauls Nebenfrau, getan hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: wurde berichtet
  rationale: Die passive Form von נגד bezeichnet die Übermittlung einer Nachricht. „Wurde berichtet“ bewahrt das Passiv und klingt im modernen Deutschen natürlich.
- source_word: לְדָוִד
  choice: David
  rationale: Die mit ל markierte Empfängerangabe wird im Deutschen als Dativ in „David wurde berichtet“ wiedergegeben.
- source_word: אֵת אֲשֶׁר
  choice: was
  rationale: Objektmarker und Relativpartikel leiten gemeinsam den Inhalt der Mitteilung ein; „was“ gibt dies idiomatisch wieder.
- source_word: עָשְׂתָה
  choice: getan hatte
  rationale: Das Plusquamperfekt macht deutlich, dass Rizpas Handeln der Berichterstattung vorausging.
- source_word: רִצְפָּה
  choice: Rizpa
  rationale: Der Personenname wird in einer im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: בַת אַיָּה
  choice: die Tochter Ajas
  rationale: Die Herkunftsangabe wird direkt und in natürlicher deutscher Namensform wiedergegeben.
- source_word: פִּלֶגֶשׁ שָׁאוּל
  choice: Sauls Nebenfrau
  rationale: Die Statusbezeichnung פִּילֶגֶשׁ wird ohne Euphemismus als „Nebenfrau“ wiedergegeben; der hebräische Genitivbezug zu Saul bleibt erhalten.
