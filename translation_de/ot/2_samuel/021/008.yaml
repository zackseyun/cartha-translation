source:
  edition: WLC
  text: וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֶת שְׁ֠נֵי בְּנֵ֨י רִצְפָּ֤ה בַת אַיָּה֙ אֲשֶׁ֣ר יָלְדָ֣ה לְ/שָׁא֔וּל אֶת אַרְמֹנִ֖י וְ/אֶת מְפִבֹ֑שֶׁת וְ/אֶת חֲמֵ֗שֶׁת בְּנֵי֙ מִיכַ֣ל בַּת שָׁא֔וּל אֲשֶׁ֥ר יָלְדָ֛ה לְ/עַדְרִיאֵ֥ל בֶּן בַּרְזִלַּ֖י הַ/מְּחֹלָתִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/008.yaml
  text: So the king took the two sons of Rizpah daughter of Aiah[a], whom she had borne to Saul—Armoni and Mephibosheth—and the five sons of Michal daughter of Saul, whom she had borne to Adriel son of Barzillai the Meholathite.
translation:
  language: de
  text: Da nahm der König die beiden Söhne Rizpas, der Tochter Ajas, die sie Saul geboren hatte – Armoni und Mefi-Boschet –, sowie die fünf Söhne Michals[a], der Tochter Sauls, die sie Adriel, dem Sohn Barsillais, des Meholatiters, geboren hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften und alte Übersetzungen haben hier „Merab“ statt „Michal“; vergleiche 1. Samuel 18,19, wo Adriel als Ehemann Merabs, der Tochter Sauls, genannt wird.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahm
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da nahm“ gibt die zeitlich-folgernde Bewegung im natürlichen deutschen Erzählstil wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Titel wird beibehalten; obwohl im Kontext David gemeint ist, nennt der hebräische Text hier nicht seinen Namen.
- source_word: שְׁנֵי בְּנֵי
  choice: die beiden Söhne
  rationale: Die Zahl im Status constructus bezeichnet die klar bestimmte Zweiergruppe; „die beiden Söhne“ ist im Deutschen idiomatisch.
- source_word: רִצְפָּה בַת אַיָּה
  choice: Rizpa, die Tochter Ajas
  rationale: Die Eigennamen werden nach gängiger deutscher Bibelnamensform wiedergegeben, die Abstammungsangabe unmittelbar angeschlossen.
- source_word: אֲשֶׁר יָלְדָה לְשָׁאוּל
  choice: die sie Saul geboren hatte
  rationale: ילד mit ל bezeichnet hier Saul als Vater; das Plusquamperfekt macht die zeitliche Vorordnung gegenüber dem Handeln des Königs deutlich.
- source_word: אַרְמֹנִי וְאֶת מְפִבֹשֶׁת
  choice: Armoni und Mefi-Boschet
  rationale: Die Eigennamen werden in gebräuchlichen deutschen Formen wiedergegeben; der genealogische Zusammenhang unterscheidet diesen Mefi-Boschet von Jonatans Sohn.
- source_word: חֲמֵשֶׁת בְּנֵי
  choice: die fünf Söhne
  rationale: Die zweite, durch das Objektzeichen markierte Gruppe wird als bestimmte Fünfergruppe wiedergegeben.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Michal, die Tochter Sauls
  rationale: Der masoretische Ausgangstext liest „Michal“. Diese Lesart bleibt im Haupttext stehen; die bedeutsame Variante „Merab“ wird in einer Fußnote dokumentiert.
- source_word: אֲשֶׁר יָלְדָה לְעַדְרִיאֵל
  choice: die sie Adriel ... geboren hatte
  rationale: Die gleiche hebräische Konstruktion wie im ersten Relativsatz wird bewusst entsprechend wiedergegeben.
- source_word: בֶּן בַּרְזִלַּי
  choice: dem Sohn Barsillais
  rationale: Die patronymische Angabe wird in natürlichem Deutsch mit Genitiv wiedergegeben.
- source_word: הַמְּחֹלָתִי
  choice: dem Meholatiter
  rationale: Das Gentiliz bezeichnet Adriels Herkunft beziehungsweise Zugehörigkeit und wird mit der im Deutschen üblichen Herkunftsbezeichnung wiedergegeben.
theological_decisions:
- issue: 'Historische beziehungsweise textkritische Spannung: Michal als Mutter der Söhne Adriels'
  choice: „Michal“ bleibt als Lesart des masoretischen Ausgangstextes im Haupttext erhalten.
  alternative: „Merab“, wie einige Handschriften und alte Ausleger lesen und wie es zu 1. Samuel 18,19 passt.
  rationale: Die Spannung wird nicht stillschweigend harmonisiert. Der zugrunde gelegte hebräische Text wird übersetzt, während die sachlich und textgeschichtlich wichtige Alternative transparent in der Fußnote erscheint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche grenzen die Namen der beiden Söhne übersichtlich als Apposition ab. „sowie“ markiert die zweite Objektgruppe klar, ohne dem hebräischen Text zusätzliche Deutung aufzuerlegen.
