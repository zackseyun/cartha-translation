  verdict: approve
  source_fidelity: 'Der Entwurf gibt die hebräischen Leitbegriffe und Satzbezüge zuverlässig wieder: Rizpa nimmt das Sacktuch, breitet es auf dem Felsen aus, hält dort vom Erntebeginn bis zum Ausgießen des Wassers vom Himmel Wache und wehrt Vögel tagsüber sowie Wildtiere nachts ab. „auf sie“ und „auf ihnen“ können die im Kontext vorausgesetzten ausgestellten Toten bezeichnen und bewahren das pluralische Suffix des Hebräischen. Die Fußnote gibt die mögliche Deutung als Regen wieder, ohne sie in den Haupttext zu verlagern.'
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. „bei Tag … bei Nacht“, „landen“ und die weder-noch-Konstruktion sind flüssig und klar. „Sacktuch“ sowie „Vögel des Himmels“ haben einen leicht biblischen, aber weiterhin verständlichen Ton, der zur Erzählung passt.
  terminology: Namen sind korrekt als „Rizpa“ und „Aja“ wiedergegeben. „Sacktuch“, „Felsen“, „Wasser vom Himmel“, „Vögel des Himmels“ und „wilde Tiere des Feldes“ entsprechen dem hebräischen Wortlaut angemessen. Die Übersetzung fügt weder eine bestimmte Ernteart noch eine dogmatische oder sonstige Deutung hinzu.
  issues:
  - severity: low
    issue: Die Übersetzungsnotiz beschreibt „auf sie“ als möglicherweise auf Rizpa oder das Sacktuch bezogen.
    rationale: Das hebräische Suffix עֲלֵיהֶם ist an beiden Stellen Plural und bezieht sich kontextuell auf die vorausgesetzten Leichname. Der veröffentlichte Übersetzungstext selbst bleibt jedoch vertretbar und muss dafür nicht geändert werden.
  revised_text: Da nahm Rizpa, die Tochter Ajas, das Sacktuch und breitete es für sich auf dem Felsen aus – vom Beginn der Ernte an, bis Wasser vom Himmel auf sie herabgegossen wurde.[a] Sie ließ weder bei Tag die Vögel des Himmels auf ihnen landen noch bei Nacht die wilden Tiere des Feldes.
