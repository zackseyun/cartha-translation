source:
  edition: WLC
  text: וַ/תִּקַּ֣ח רִצְפָּה֩ בַת אַיָּ֨ה אֶת הַ/שַּׂ֜ק וַ/תַּטֵּ֨/הוּ לָ֤/הּ אֶל הַ/צּוּר֙ מִ/תְּחִלַּ֣ת קָצִ֔יר עַ֛ד נִתַּךְ מַ֥יִם עֲלֵי/הֶ֖ם מִן הַ/שָּׁמָ֑יִם וְ/לֹֽא נָתְנָה֩ ע֨וֹף הַ/שָּׁמַ֜יִם לָ/נ֤וּחַ עֲלֵי/הֶם֙ יוֹמָ֔ם וְ/אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה לָֽיְלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/010.yaml
  text: Then Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock[a], from the beginning of harvest until water was poured on them from the heavens. And she did not allow the birds of the sky to rest on them by day, nor the wild animals of the field by night.
translation:
  language: de
  text: Da nahm Rizpa, die Tochter Ajas, das Sacktuch und breitete es für sich auf dem Felsen aus – vom Beginn der Ernte an, bis Wasser vom Himmel auf sie herabgegossen wurde.[a] Sie ließ weder bei Tag die Vögel des Himmels auf ihnen landen noch bei Nacht die wilden Tiere des Feldes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „bis Regen vom Himmel auf sie fiel“. Wörtlicher heißt es im Hebräischen: „bis Wasser vom Himmel auf sie herabgegossen wurde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׂק
  choice: das Sacktuch
  rationale: שַׂק bezeichnet hier den groben Stoff, der mit Trauer verbunden ist; „Sacktuch“ bewahrt sowohl die konkrete Bedeutung als auch den kulturellen Beiklang.
- source_word: וַתַּטֵּהוּ לָהּ אֶל הַצּוּר
  choice: breitete es für sich auf dem Felsen aus
  rationale: נטה bezeichnet bei einem Tuch das Ausbreiten oder Ausspannen; לָהּ wird als Dativ des Vorteils mit „für sich“ wiedergegeben, und אֶל bezeichnet hier natürlich den Ort auf dem Felsen.
- source_word: הַצּוּר
  choice: dem Felsen
  rationale: צוּר bedeutet konkret „Fels/Felsen“. Die Übersetzung vermeidet eine nähere Bestimmung des Ortes, die der hebräische Text nicht gibt.
- source_word: מִתְּחִלַּת קָצִיר
  choice: vom Beginn der Ernte an
  rationale: Der hebräische Text nennt keine bestimmte Getreideart; daher wird keine Gersten- oder Weizenernte ergänzt.
- source_word: עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמָיִם
  choice: bis Wasser vom Himmel auf sie herabgegossen wurde
  rationale: Die passive Form von נתך bewahrt das anschauliche Bild des ausgegossenen Wassers. „Regen“ ist wahrscheinlich gemeint, wird aber nur in der Fußnote als sinngemäße Möglichkeit genannt.
- source_word: עוֹף הַשָּׁמַיִם
  choice: die Vögel des Himmels
  rationale: Die feste hebräische Wendung wird in würdigem, verständlichem Deutsch bildnah wiedergegeben.
- source_word: לָנוּחַ עֲלֵיהֶם
  choice: auf ihnen landen
  rationale: נוח bezeichnet hier das Sichniederlassen der Vögel auf den Leichnamen; „landen“ ist im Deutschen klarer und natürlicher als das missverständliche „ruhen“.
- source_word: חַיַּת הַשָּׂדֶה
  choice: die wilden Tiere des Feldes
  rationale: Die Formulierung macht deutlich, dass frei lebende Landtiere gemeint sind, und bewahrt zugleich das hebräische Bild vom Feld.
- source_word: יוֹמָם ... לָיְלָה
  choice: bei Tag ... bei Nacht
  rationale: Diese idiomatische Wiedergabe erhält den knappen zeitlichen Gegensatz des Hebräischen.
- source_word: וְלֹא נָתְנָה
  choice: Sie ließ weder ... noch
  rationale: נתן mit Infinitiv bedeutet hier „zulassen“. Die deutsche weder-noch-Konstruktion gibt die beiden abgewehrten Gefahren flüssig und präzise wieder.
theological_decisions: []
translation_notes:
  register: 'Moderne, würdige Erzählsprache. Der drastische Zusammenhang wird nicht ausgeschmückt. Der Wechsel von Singular („auf sie“: Rizpa und/oder das Sacktuch ist grammatisch möglich, im Kontext wohl die ausgestellten Toten mitgemeint) zu Plural („auf ihnen“) folgt der Spannung des hebräischen Textes; die Fußnote beschränkt sich auf die ausdrücklich geforderte lexikalische Alternative.'
