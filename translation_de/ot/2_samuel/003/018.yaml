  source_fidelity: 'Die Hauptübersetzung gibt die Aufforderung, die göttliche Zusage, David als Mittel der Rettung und die wiederholte Metapher »aus der Hand« zutreffend wieder. Bei אָמַר אֶל־דָּוִד ist »über David gesagt« jedoch weniger quellennah: אֶל bezeichnet gewöhnlich den Adressaten bzw. Empfänger der Zusage. »David zugesagt« ist im Kontext idiomatisch, wahrt diese Beziehung und erklärt zugleich die anschließende Rede über David. Die Mehrdeutigkeit der Konstruktion bei הוֹשִׁיעַ bleibt durch die Fußnote dokumentiert.'
  naturalness: »Nun handelt!« ist eine natürliche, dringliche Aufforderung in moderner Standardsprache. »David zugesagt« klingt in diesem Kontext deutlich idiomatischer als »über David gesagt«. Die Fußnotenmarke wird unmittelbar an der mehrdeutigen Verbform platziert.
  terminology: »Jahwe«, »Diener«, »retten«, »durch die Hand« und »aus der Hand« sind angemessen und konsistent. »aller Feinde Israels« ist im Deutschen klarer als das potenziell mehrdeutige kollektivbezogene »aller seiner Feinde« und gibt den Bezug des hebräischen Plurals wieder.
