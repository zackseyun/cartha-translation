revisions:
- from: 'Jetzt handelt! Denn Jahwe hat über David gesagt: »Durch die Hand meines Dieners David werde ich mein Volk Israel aus der Hand der Philister und aus der Hand aller seiner Feinde retten.«[a]'
  to: 'Nun handelt! Denn Jahwe hat David zugesagt: »Durch die Hand meines Dieners David werde ich mein Volk Israel aus der Hand der Philister und aus der Hand aller Feinde Israels retten[a].«'
  rationale: Die Revision ersetzt die bei אֶל־דָּוִד weniger genaue Formulierung »über David gesagt« durch das quellennähere und im Deutschen natürliche »David zugesagt«. Sie setzt den Anker an die betreffende mehrdeutige Verbform und klärt den Bezug von »ihren Feinden« als Feinde Israels. Die dokumentierte alternative Subjektzuweisung wird weder beseitigt noch theologisch entschieden.
