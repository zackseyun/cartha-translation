  text: וְ/עַתָּ֖ה עֲשׂ֑וּ כִּ֣י יְהוָ֗ה אָמַ֤ר אֶל דָּוִד֙ לֵ/אמֹ֔ר בְּ/יַ֣ד דָּוִ֣ד עַבְדִּ֗/י הוֹשִׁ֜יעַ אֶת עַמִּ֤/י יִשְׂרָאֵל֙ מִ/יַּ֣ד פְּלִשְׁתִּ֔ים וּ/מִ/יַּ֖ד כָּל אֹיְבֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/018.yaml
  text: Now then[a], do it, for Yahweh has spoken concerning David, saying, ‘By the hand of my servant David I will save my people Israel from the hand of the Philistines and from the hand of all their enemies.’
translation:
  language: de
  text: 'Nun handelt! Denn Jahwe hat David zugesagt: »Durch die Hand meines Dieners David werde ich mein Volk Israel aus der Hand der Philister und aus der Hand aller Feinde Israels retten[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Mein Diener David wird mein Volk Israel aus der Hand der Philister und aus der Hand aller Feinde Israels retten.« Die hebräische Form kann auch so verstanden werden, dass David das grammatische Subjekt ist, statt dass Jahwe als Sprecher durch David handelt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה עֲשׂוּ
  choice: Jetzt handelt!
  rationale: Die Wendung leitet einen dringlichen Übergang zum Handeln ein. Der Imperativ steht im Plural; „Jetzt handelt!“ gibt seine direkte, auffordernde Kraft natürlich wieder.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorangehende Aufforderung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: אָמַר אֶל דָּוִד לֵאמֹר
  choice: hat über David gesagt
  rationale: 'Obwohl אֶל gewöhnlich „zu“ bedeutet, verlangt der Zusammenhang hier am ehesten eine Aussage über David: Das folgende Gotteswort bezeichnet David in der dritten Person als „meinen Diener“. „Hat gesagt“ wahrt zugleich die fortdauernde Bedeutung des früheren Gotteswortes.'
- source_word: בְּיַד דָּוִד עַבְדִּי
  choice: Durch die Hand meines Dieners David
  rationale: „Durch die Hand“ bewahrt das hebräische Bild für Mittel beziehungsweise Beauftragten und bleibt im Deutschen verständlich. עַבְדִּי bezeichnet David in seiner von Gott übertragenen Aufgabe als „meinen Diener“.
- source_word: הוֹשִׁיעַ
  choice: werde ich … retten
  rationale: Die Form wird im Zusammenhang als Aussage Jahwes verstanden, der durch David Rettung wirkt. „Retten“ passt zur militärischen Befreiung, ohne den theologischen Gehalt des Verbs abzuschwächen. Die grammatische Mehrdeutigkeit wird in einer Fußnote dokumentiert.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: mein Volk Israel
  rationale: Die Wiedergabe erhält sowohl das Besitzverhältnis als auch die Benennung des Volkes.
- source_word: מִיַּד פְּלִשְׁתִּים וּמִיַּד כָּל אֹיְבֵיהֶם
  choice: aus der Hand der Philister und aus der Hand aller seiner Feinde
  rationale: Die Wiederholung von „aus der Hand“ bewahrt das hebräische Bild feindlicher Gewalt. Das singularische „seiner“ bezieht sich im Deutschen sinngemäß auf das Kollektiv „Volk Israel“.
theological_decisions:
- issue: Subjekt von הוֹשִׁיעַ im angeführten Gotteswort
  choice: 'Jahwe ist der handelnde Retter und wirkt durch David: „werde ich … retten“'
  alternative: 'David ist das grammatische Subjekt: „Mein Diener David wird mein Volk Israel … retten“'
  rationale: Der Zusammenhang mit „Jahwe hat … gesagt“ und die Instrumentalangabe „durch die Hand meines Dieners David“ sprechen für Jahwe als den letztlich Handelnden. Da die hebräische Form jedoch auch anders bezogen werden kann, wird die alternative Lesart ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Aufforderung. Die wiederholte Wendung „aus der Hand“ erhält bewusst die Bildsprache des Hebräischen; „durch die Hand“ kennzeichnet David als beauftragtes Mittel der Rettung.
