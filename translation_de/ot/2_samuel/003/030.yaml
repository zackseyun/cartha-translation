base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/030.yaml
  text: So Joab and Abishai his brother killed Abner because he had killed Asahel their brother at Gibeon in the battle[a].
translation:
  language: de
  text: So töteten Joab und sein Bruder Abischai Abner, weil er ihren Bruder Asaël in der Schlacht bei Gibeon getötet hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Joab und sein Bruder Abischai töteten Abner.“ Die hebräische Konjunktion kann schlicht mit „und“ wiedergegeben werden; „so“ verdeutlicht den erklärenden Zusammenhang mit dem Kontext.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: töteten
  rationale: Die Grundbedeutung von הרג wird mit dem neutralen, modernen Verb „töten“ wiedergegeben. „Ermordeten“ würde die rechtliche oder moralische Bewertung stärker festlegen, als es das hebräische Verb an dieser Stelle tut.
- source_word: לְאַבְנֵר
  choice: Abner
  rationale: Die Präposition ל kennzeichnet hier nach הרג das Objekt; im natürlichen Deutschen steht daher der direkte Akkusativ ohne eigene Wiedergabe der Präposition.
- source_word: עַל אֲשֶׁר
  choice: weil
  rationale: Die Verbindung nennt den Grund für die Tat; „weil“ gibt diesen Zusammenhang knapp und idiomatisch wieder.
- source_word: הֵמִית
  choice: getötet hatte
  rationale: Der Hifil von מות bezeichnet hier das Verursachen des Todes. Das Plusquamperfekt macht deutlich, dass Abners Tat der Tötung Abners vorausging.
- source_word: אֲחִיו / אֲחִיהֶם
  choice: sein Bruder / ihren Bruder
  rationale: „Sein Bruder“ bezeichnet Abischai als Joabs Bruder; „ihren Bruder“ bezeichnet Asaël als Bruder von Joab und Abischai. Beide Verwandtschaftsangaben bleiben ausdrücklich erhalten.
- source_word: בְּגִבְעוֹן
  choice: bei Gibeon
  rationale: „Bei Gibeon“ ist für den Ort eines Kampfgeschehens natürliches Deutsch und vermeidet die unnötige Festlegung, die Schlacht habe innerhalb der Stadt stattgefunden.
- source_word: בַּמִּלְחָמָה
  choice: in der Schlacht
  rationale: Der bestimmte Artikel verweist auf die aus dem Erzählzusammenhang bekannte Schlacht; „in der Schlacht“ bewahrt diese Bestimmtheit.
- source_word: וְ / וַ
  choice: So
  rationale: Das einleitende „So“ bringt den zusammenfassenden beziehungsweise folgernden Bezug zum vorausgehenden Erzählzusammenhang zum Ausdruck. Das schlichtere „Und“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung vermeidet eine mögliche kurzfristige Fehlzuordnung von „sein Bruder“ zu Abner. „Töteten“ bleibt gegenüber dem wertenden „ermordeten“ bewusst neutral; Motiv, Verwandtschaft und zeitliche Abfolge werden klar bewahrt.
