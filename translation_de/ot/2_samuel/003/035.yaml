base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/035.yaml
  text: Then all the people came to urge David to eat bread while it was still day[a], but David swore, saying, “May God do so to me, and more also[b], if before the sun goes down I taste bread or anything at all.”
translation:
  language: de
  text: 'Da kam das ganze Volk, um David Brot vorzusetzen, solange es noch Tag war[a]. Doch David schwor: »Gott soll mir dies und noch mehr antun[b], wenn ich, bevor die Sonne untergeht, Brot oder überhaupt irgendetwas koste!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bedeutet »Brot«, kann hier aber auch allgemeiner für Nahrung stehen. Die Übersetzung behält den konkreten Ausdruck bei.
    reason: lexical_alternative
  - marker: b
    text: 'Diese Eidesformel ist eine herkömmliche Selbstverfluchung: »Gott soll mir dies und noch mehr antun.« Welche Strafe gemeint ist, bleibt im Hebräischen unausgesprochen.'
    reason: cultural_note
lexical_decisions:
- source_word: לְהַבְרוֹת
  choice: dazu zu bewegen, ... zu essen
  rationale: Der Hifil von ברה bezeichnet hier das Veranlassen beziehungsweise Drängen zum Essen. Die Wiedergabe erfasst den Versuch des Volkes, den trauernden David zur Nahrungsaufnahme zu bewegen.
- source_word: לֶחֶם
  choice: Brot
  rationale: לֶחֶם kann allgemein Nahrung bezeichnen; »Brot« bewahrt jedoch das konkrete hebräische Wort und passt zum Zusammenhang von Trauer und Fasten.
- source_word: בְּעוֹד הַיּוֹם
  choice: noch bei Tageslicht
  rationale: Die Wendung besagt, dass der Tag noch nicht vorüber war, und bereitet den späteren Hinweis auf den Sonnenuntergang vor.
- source_word: וַיִּשָּׁבַע
  choice: schwor
  rationale: Die direkte und im Deutschen natürliche Wiedergabe leitet die folgende feierliche Eidesformel ein.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יֹסִיף
  choice: Gott soll mir dies und noch mehr antun
  rationale: Die Formulierung bewahrt die herkömmliche Selbstverfluchung, ohne die im Hebräischen ungenannte Strafe näher zu bestimmen.
- source_word: כִּי אִם
  choice: wenn
  rationale: In der Eidesformel führt כִּי אִם die Bedingung ein, unter der die Selbstverfluchung gelten soll.
- source_word: לִפְנֵי בּוֹא הַשֶּׁמֶשׁ
  choice: bevor die Sonne untergeht
  rationale: Die wörtlich ungewöhnliche Wendung vom »Kommen der Sonne« bezeichnet idiomatisch den Sonnenuntergang.
- source_word: אֶטְעַם
  choice: koste
  rationale: Die Grundbedeutung »kosten« unterstreicht, dass David nicht einmal die geringste Menge zu sich nehmen will.
- source_word: אוֹ כָל מְאוּמָה
  choice: oder überhaupt irgendetwas
  rationale: Die Formulierung gibt die nachdrückliche Ausweitung über Brot hinaus natürlich und vollständig wieder.
