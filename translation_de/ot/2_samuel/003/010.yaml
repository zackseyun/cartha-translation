  text: לְ/הַֽעֲבִ֥יר הַ/מַּמְלָכָ֖ה מִ/בֵּ֣ית שָׁא֑וּל וּ/לְ/הָקִ֞ים אֶת כִּסֵּ֣א דָוִ֗ד עַל יִשְׂרָאֵל֙ וְ/עַל יְהוּדָ֔ה מִ/דָּ֖ן וְ/עַד בְּאֵ֥ר שָֽׁבַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/010.yaml
  text: to transfer the kingdom from the house of Saul and to establish the throne of David over Israel and over Judah[a], from Dan to Beer-sheba.
translation:
  language: de
  text: um das Königtum vom Haus Sauls auf David zu übertragen und den Thron Davids über Israel und über Juda aufzurichten, von Dan bis Beerscheba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „von Dan bis Beerscheba“ bezeichnet das ganze Land von Norden bis Süden.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַעֲבִיר
  choice: wegzunehmen
  rationale: Der Hifil von עבר bezeichnet hier, dass das Königreich von einem Herrscherhaus auf ein anderes übergeht. „Wegzunehmen“ gibt im Satzgefüge die Entfernung vom Haus Sauls natürlich wieder; der anschließende Aufbau des davidischen Thrones macht die Übertragung deutlich.
- source_word: הַמַּמְלָכָה
  choice: das Königreich
  rationale: Der Begriff kann das Königreich oder die Königsherrschaft bezeichnen. „Königreich“ ist verständlich und lässt sowohl Herrschaftsbereich als auch politische Herrschaft anklingen.
- source_word: מִבֵּית שָׁאוּל
  choice: vom Haus Sauls
  rationale: „Haus“ bewahrt die biblische Bezeichnung für Familie und Dynastie, ohne sie auf einen rein modernen politischen Fachbegriff zu verengen.
- source_word: וּלְהָקִים
  choice: und … aufzurichten
  rationale: Der Hifil von קום bedeutet hier, etwas zu errichten beziehungsweise fest einzusetzen. „Den Thron aufrichten“ wahrt das konkrete königliche Bild und klingt im Deutschen würdig.
- source_word: אֶת כִּסֵּא דָוִד
  choice: den Thron Davids
  rationale: Die konkrete Metapher des Thrones steht für Davids königliche Herrschaft und wird nicht zu einem abstrakten Begriff aufgelöst.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: über Israel und über Juda
  rationale: Die Wiederholung von עַל wird beibehalten und hebt die Herrschaft über beide politischen Größen gesondert hervor.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: von Dan bis Beerscheba
  rationale: Die natürliche deutsche Wendung gibt die geografische Spannweite wieder; die Fußnote erklärt, dass damit das ganze Land von Norden bis Süden gemeint ist.
- source_word: בְּאֵר שָׁבַע
  choice: Beerscheba
  rationale: „Beerscheba“ ist die im modernen deutschen Bibelgebrauch geläufige Form des Ortsnamens.
theological_decisions:
- issue: Dynastische Sprache beim Haus Sauls und königliches Bild beim Thron Davids
  choice: Die konkreten Ausdrücke „Haus Sauls“ und „Thron Davids“ bleiben erhalten.
  alternative: „Sauls Dynastie“ und „Davids Herrschaft“
  rationale: Der Vers beschreibt einen politischen Herrschaftswechsel mit traditionellen dynastischen und königlichen Bildern. Ihre Beibehaltung wahrt den biblischen Ausdruck, ohne spätere theologische Deutungen einzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Klang. Die parallelen Infinitive und die Wiederholung „über … und über …“ bilden die Struktur des Hebräischen ab.
