source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע דָּוִד֙ מֵ/אַ֣חֲרֵי כֵ֔ן וַ/יֹּ֗אמֶר נָקִ֨י אָנֹכִ֧י וּ/מַמְלַכְתִּ֛/י מֵ/עִ֥ם יְהוָ֖ה עַד עוֹלָ֑ם מִ/דְּמֵ֖י אַבְנֵ֥ר בֶּן נֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/028.yaml
  text: Afterward[a], when David heard of it, he said[b], “I and my kingdom are forever innocent before Yahweh of the blood of Abner son of Ner.”
translation:
  language: de
  text: 'Als David später[a] davon hörte, sagte er: »Ich und mein Königreich sind vor Yahweh für immer unschuldig am Blut Abners, des Sohnes Ners.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »danach« beziehungsweise »nach diesem Ereignis«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »von den Bluten Abners«; eine hebräische Wendung für Blutvergießen beziehungsweise Blutschuld und die damit verbundene Verantwortung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחֲרֵי כֵן
  choice: später
  rationale: Die Zeitangabe bedeutet »danach/später«. »Später« ist im modernen deutschen Erzählstil natürlich und lässt den genauen zeitlichen Abstand offen.
- source_word: וַיִּשְׁמַע
  choice: Als David davon hörte
  rationale: Das Verb bedeutet »hören«. »Davon« nimmt ohne sachliche Ergänzung auf die zuvor berichtete Tötung Abners Bezug; die als-Satzfügung gibt die hebräische Erzählfolge idiomatisch wieder.
- source_word: נָקִי
  choice: unschuldig
  rationale: נָקִי bezeichnet hier das Freisein von Schuld beziehungsweise Verantwortlichkeit und wird in diesem rechtlich-moralischen Zusammenhang treffend mit »unschuldig« wiedergegeben.
- source_word: אָנֹכִי וּמַמְלַכְתִּי
  choice: Ich und mein Königreich
  rationale: Die Formulierung verbindet David selbst mit dem von ihm regierten Reich. »Königreich« bewahrt den politischen Sinn von מַמְלָכָה, ohne es auf Dynastie oder Königshaus einzuengen.
- source_word: מֵעִם יְהוָה
  choice: vor Yahweh
  rationale: Die Wendung beschreibt Davids Stellung gegenüber Yahweh als Zeugen und Richter. »Vor Yahweh« gibt diesen forensischen Beziehungsaspekt knapp und natürlich wieder.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte beziehungsweise dauerhafte Geltung. »Für immer« ist eine klare, gegenwärtige deutsche Entsprechung.
- source_word: מִדְּמֵי
  choice: am Blut
  rationale: Wörtlich steht der Plural »von den Blut(taten)«. Die deutsche Wendung »unschuldig am Blut« bewahrt das konkrete Bild und vermittelt zugleich die gemeinte Nichtverantwortlichkeit für Abners gewaltsamen Tod.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abners, des Sohnes Ners
  rationale: Die Namen werden in ihrer üblichen deutschen Form wiedergegeben; die Apposition bildet die hebräische Abstammungsangabe eindeutig und würdig ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. »Yahweh« gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Umfang von Davids Unschuldserklärung
  choice: Die Aussage als Davids eigene, dauerhafte Unschuldserklärung wiedergeben
  alternative: Die Erklärung als objektive göttliche Bestätigung oder als Aussage über sämtliche Handlungen seines Reiches formulieren
  rationale: Der Vers berichtet Davids Behauptung, er und sein Königreich seien hinsichtlich des Blutes Abners unschuldig. Die Übersetzung bestätigt oder relativiert diese Behauptung nicht über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlicher Erzählsyntax. Die direkte Rede bleibt knapp und forensisch geprägt. Der Name Yahweh wird unverdeckt verwendet; die hebräische Blut-Metaphorik bleibt im Haupttext erkennbar und wird in der Fußnote erläutert.
