id: 2SA.3.1
reference: 2 Samuel 3:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ אֲרֻכָּ֔ה בֵּ֚ין בֵּ֣ית שָׁא֔וּל וּ/בֵ֖ין בֵּ֣ית דָּוִ֑ד וְ/דָוִד֙ הֹלֵ֣ךְ וְ/חָזֵ֔ק וּ/בֵ֥ית שָׁא֖וּל הֹלְכִ֥ים וְ/דַלִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/001.yaml
  text: The war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
translation:
  language: de
  text: Der Krieg zwischen dem Haus Sauls und dem Haus Davids zog sich lange hin, und David wurde immer stärker, während das Haus Sauls immer schwächer wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Haus« ist hier die Familie beziehungsweise das Herrscherhaus gemeint; der Ausdruck hat sowohl familiäre als auch politische Bedeutung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה אֲרֻכָּה
  choice: Der Krieg … zog sich lange hin
  rationale: Die Verbindung bezeichnet einen Krieg von langer Dauer. Die idiomatische deutsche Wendung gibt den durativen Sinn des wörtlich »langen« Krieges natürlich wieder.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: zwischen dem Haus Sauls und dem Haus Davids
  rationale: »Haus« bewahrt die familiäre und zugleich politisch-dynastische Bedeutungsbreite des Hebräischen.
- source_word: וְדָוִד הֹלֵךְ וְחָזֵק
  choice: David wurde immer stärker
  rationale: Die Konstruktion mit הלך drückt eine fortschreitende Entwicklung aus; »immer stärker« gibt diesen Verlauf idiomatisch wieder.
- source_word: וּבֵית שָׁאוּל הֹלְכִים וְדַלִּים
  choice: während das Haus Sauls immer schwächer wurde
  rationale: Die fortschreitende Schwächung bildet den ausdrücklichen Gegensatz zu Davids wachsender Stärke. Der Singular entspricht dem deutschen Gebrauch beim Kollektiv »Haus«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Steigerung »immer stärker … immer schwächer« bildet die hebräische Gegenüberstellung klar und natürlich ab; die Wiederholung von »Haus« erhält die politische und familiäre Spannung.
