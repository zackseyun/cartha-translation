  source_fidelity: 'Die Übersetzung folgt dem hebräischen Erzählablauf und den wesentlichen Bedeutungen genau: Joab entfernt sich aus Davids Gegenwart, entsendet menschliche Boten zur Verfolgung Abners, diese bringen Abner zurück, und David weiß nichts davon. Das ergänzende „davon“ macht im Deutschen den Bezugsgegenstand der Unkenntnis idiomatisch explizit, ohne den Sinn zu erweitern.'
