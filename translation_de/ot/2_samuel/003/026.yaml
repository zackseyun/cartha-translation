source:
  edition: WLC
  text: וַ/יֵּצֵ֤א יוֹאָב֙ מֵ/עִ֣ם דָּוִ֔ד וַ/יִּשְׁלַ֤ח מַלְאָכִים֙ אַחֲרֵ֣י אַבְנֵ֔ר וַ/יָּשִׁ֥בוּ אֹת֖/וֹ מִ/בּ֣וֹר הַסִּרָ֑ה וְ/דָוִ֖ד לֹ֥א יָדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/026.yaml
  text: Then Joab went out from David and sent messengers after Abner[a], and they brought him back from the well of Sirah. But David did not know it.
translation:
  language: de
  text: Da ging Joab von David weg und sandte Boten hinter Abner her. Sie holten ihn vom Brunnen von Sira[a] zurück; David aber wusste nichts davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „von Bor-Sira“, wenn der hebräische Ausdruck als Ortsname und nicht als „Brunnen von Sira“ verstanden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ging ... weg
  rationale: Das narrative Wayyiqtol von יצא bezeichnet hier Joabs Weggehen aus Davids Gegenwart; „ging ... weg“ ist natürliches Deutsch und bewahrt die konkrete Bewegung.
- source_word: מֵעִם דָּוִד
  choice: von David weg
  rationale: מֵעִם bezeichnet die Bewegung aus der Gegenwart einer Person. „von David weg“ gibt dies im Deutschen klar und idiomatisch wieder.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im Erzählzusammenhang sind menschliche Überbringer beziehungsweise Beauftragte gemeint; „Boten“ ist die übliche klare Wiedergabe.
- source_word: אַחֲרֵי אַבְנֵר
  choice: hinter Abner her
  rationale: אַחֲרֵי drückt hier Nachfolgen beziehungsweise Verfolgung aus. Die Formulierung lässt den Zweck aus dem Zusammenhang hervorgehen, ohne ihn stärker festzulegen.
- source_word: וַיָּשִׁבוּ אֹתוֹ
  choice: Sie holten ihn ... zurück
  rationale: Der Hifil von שוב ist kausativ. „holten ihn zurück“ gibt im Deutschen natürlich wieder, dass die Boten Abners Rückkehr veranlassten.
- source_word: מִבּוֹר הַסִּרָה
  choice: vom Brunnen von Sira
  rationale: בּוֹר kann Grube, Zisterne oder Brunnen bezeichnen. „Brunnen von Sira“ ist im Kontext eine gut verständliche Wiedergabe; die mögliche Auffassung als zusammengesetzter Ortsname bleibt in der Fußnote erhalten.
- source_word: וְדָוִד לֹא יָדָע
  choice: David aber wusste nichts davon
  rationale: Das Waw hat hier natürlich kontrastierende Wirkung. „nichts davon“ benennt idiomatisch Davids Unkenntnis von Joabs Vorgehen, ohne zusätzliche Sachinformation einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Der Satzbau bleibt nahe am Hebräischen, vermeidet jedoch unnatürliche Wörtlichkeit. Die Ortsbezeichnung wird im Haupttext verständlich wiedergegeben; ihre echte lexikalische Mehrdeutigkeit wird in der Fußnote bewahrt.
