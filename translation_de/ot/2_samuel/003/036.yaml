base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/036.yaml
  text: And all the people recognized it[a], and it was good in their eyes; for everything the king did was good in the eyes of all the people.
translation:
  language: de
  text: Das ganze Volk erkannte es, und es gefiel ihnen[a], wie alles, was der König tat, dem ganzen Volk gefiel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und es war gut in ihren Augen“.'
    reason: Die Fußnote bewahrt das Bild der hebräischen Redewendung, während der Haupttext ihre natürliche deutsche Bedeutung wiedergibt.
lexical_decisions:
- source_word: הִכִּירוּ
  choice: nahm es wahr
  rationale: Das Hifil von נכר kann „erkennen“, „wahrnehmen“ oder „bemerken“ bedeuten. Im Zusammenhang nimmt das Volk Davids aufrichtige Haltung wahr; „nahm es wahr“ lässt den im Hebräischen nur aus dem Kontext erschließbaren Gegenstand offen.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: es gefiel ihnen
  rationale: Die hebräische Wendung bedeutet wörtlich, dass etwas „in ihren Augen gut war“, und bezeichnet hier Zustimmung oder Wohlgefallen. Die natürliche deutsche Wiedergabe „es gefiel ihnen“ trifft diesen Sinn.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה הַמֶּלֶךְ
  choice: wie überhaupt alles, was der König tat
  rationale: כְּכֹל hat vergleichende Kraft. „Wie überhaupt alles“ verbindet die konkrete Zustimmung mit der allgemeinen Zustimmung zu den Handlungen des Königs, ohne einen im Hebräischen nicht ausdrücklich gesetzten Begründungssatz einzuführen.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der Ausgangstext verwendet den Titel und nennt David hier nicht beim Namen.
- source_word: טוֹב בְּעֵינֵי כָל הָעָם
  choice: dem ganzen Volk gefiel
  rationale: Die Wiederholung der Bewertungsformel wird durch die Wiederholung von „gefiel“ sichtbar gehalten; zugleich bleibt der Satz in modernem Deutsch natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „gefiel“ spiegelt die Wiederholung der hebräischen Bewertungsformel; „wie überhaupt“ macht den vergleichend-verallgemeinernden Anschluss mit כְּכֹל verständlich.
