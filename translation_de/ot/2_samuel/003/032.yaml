base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/032.yaml
  text: They buried Abner in Hebron[a], and the king lifted up his voice and wept at Abner’s grave, and all the people wept.
translation:
  language: de
  text: Sie begruben Abner in Hebron. Der König erhob seine Stimme und weinte an Abners Grab[a], und das ganze Volk weinte ebenfalls.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „zum Grab Abners hin“. Die hebräische Präposition bezeichnet häufig eine Richtung auf etwas zu; hier ist wahrscheinlich das Weinen am Grab gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: Sie begruben
  rationale: Das Qal-Wayyiqtol bezeichnet die nächste Handlung der Erzählung. Im natürlichen Deutschen wird das einleitende וַ durch die Satzfolge wiedergegeben.
- source_word: בְּחֶבְרוֹן
  choice: in Hebron
  rationale: Die Präposition בְּ bezeichnet hier den Ort der Bestattung; „in Hebron“ ist die natürliche deutsche Wiedergabe.
- source_word: וַיִּשָּׂא הַמֶּלֶךְ אֶת־קוֹלוֹ
  choice: Der König erhob seine Stimme
  rationale: Die hebräische Wendung bezeichnet lautes, vernehmliches Klagen. „Erhob seine Stimme“ bewahrt den feierlich-literarischen Charakter, ohne unnatürlich zu wirken.
- source_word: וַיֵּבְךְּ
  choice: und weinte
  rationale: בכה bedeutet weinen oder klagen; im Bestattungskontext ist „weinte“ treffend und ermöglicht die Wiederholung des Verbs wie im Hebräischen.
- source_word: אֶל־קֶבֶר אַבְנֵר
  choice: an Abners Grab
  rationale: אֶל bezeichnet gewöhnlich eine Bewegung oder Ausrichtung auf etwas zu, kann im Kontext aber die örtliche Beziehung ausdrücken. „An Abners Grab“ ist idiomatisch und lässt die räumliche Ausrichtung noch anklingen.
- source_word: וַיִּבְכּוּ כָּל־הָעָם
  choice: und das ganze Volk weinte ebenfalls
  rationale: Die Wiederholung von בכה wird beibehalten. „Das ganze Volk“ gibt כָּל־הָעָם wieder; „ebenfalls“ macht im Deutschen natürlich deutlich, dass das Volk sich dem Weinen des Königs anschloss.
