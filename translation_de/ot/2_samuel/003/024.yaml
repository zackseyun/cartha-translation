base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/024.yaml
  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
translation:
  language: de
  text: 'Da kam Joab zum König und sagte: »Was hast du getan? Sieh doch, Abner ist zu dir gekommen! Warum hast du ihn denn weggeschickt? Nun ist er wirklich fortgegangen![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und er ging, gehend“. Die hebräische Verbindung aus Verb und Infinitiv verstärkt hier die Aussage: Abner ist wirklich fortgegangen.'
    reason: Die ungewöhnliche hebräische Verstärkung lässt sich im Deutschen nicht zugleich wörtlich und natürlich wiedergeben.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da kam“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: אֶל הַמֶּלֶךְ
  choice: zum König
  rationale: Die Richtungsangabe wird knapp und idiomatisch wiedergegeben.
- source_word: מֶה עָשִׂיתָה
  choice: Was hast du getan?
  rationale: Das Perfekt bezeichnet eine abgeschlossene Handlung mit gegenwärtigen Folgen; die deutsche Perfektform bewahrt zugleich den vorwurfsvollen Ton.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf den folgenden Sachverhalt. „Sieh doch“ klingt gegenwärtig und bewahrt den appellativen Nachdruck.
- source_word: בָא אַבְנֵר אֵלֶיךָ
  choice: Abner ist zu dir gekommen
  rationale: Das deutsche Perfekt bezeichnet Abners bereits erfolgtes Kommen und lässt dessen Bedeutung für Joabs gegenwärtigen Vorwurf hervortreten.
- source_word: לָמָּה זֶּה
  choice: Warum hast du ihn da …?
  rationale: Das demonstrative זֶה verstärkt die anklagende Frage. Das deutsche „da“ erhält diesen zusätzlichen, situationsbezogenen Nachdruck, ohne eine unnatürliche Konstruktion zu erzwingen.
- source_word: שִׁלַּחְתּוֹ
  choice: ihn … weggeschickt
  rationale: Der Piel von שׁלח bedeutet hier, jemanden wegzuschicken beziehungsweise ziehen zu lassen. „Weggeschickt“ betont Davids aktive Verantwortung.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: Nun ist er tatsächlich fort!
  rationale: Die Verbindung aus finitem Verb und Infinitivus absolutus hebt Abners Weggang nachdrücklich hervor. Die idiomatische Formulierung vermittelt, dass er wirklich und vollständig fort ist.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil mit direkter, erregter Rede. „Sieh doch“ und das situationsbezogene „da“ bewahren Joabs vorwurfsvollen Nachdruck; der Schlusssatz gibt die hebräische Verstärkung idiomatisch wieder.
