  text: וַ/יְקֹנֵ֥ן הַ/מֶּ֛לֶךְ אֶל אַבְנֵ֖ר וַ/יֹּאמַ֑ר הַ/כְּ/מ֥וֹת נָבָ֖ל יָמ֥וּת אַבְנֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/033.yaml
  text: And the king lamented over Abner and said[a], “Should Abner die as a fool dies?”
translation:
  language: de
  text: 'Und der König stimmte ein Klagelied über Abner an und sagte: »Sollte Abner sterben, wie ein Tor stirbt?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Wie ein Tor stirbt, sollte Abner sterben?« Das mit »Tor« übersetzte Wort kann auch einen sittlich verwerflichen oder ehrlosen Menschen bezeichnen.'
    reason: Die Anmerkung zeigt die im Hebräischen vorangestellte Vergleichskonstruktion und erläutert die mögliche moralische Bedeutungsweite von נָבָל.
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: stimmte ein Klagelied … an
  rationale: Das Verb קונן bezeichnet das Anstimmen bzw. Vortragen einer Totenklage. Die gewählte Formulierung ist im Deutschen natürlich und macht deutlich, dass die folgende Äußerung Teil eines Klagelieds ist.
- source_word: אֶל אַבְנֵר
  choice: über Abner
  rationale: אֶל kennzeichnet hier beim Klagen den Gegenstand der Klage. »Über Abner« ist dafür eine natürliche deutsche Entsprechung.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die bestimmte Bezeichnung wird beibehalten; gemeint ist im Erzählzusammenhang David.
- source_word: וַיֹּאמַר
  choice: sagte
  rationale: Das gewöhnliche hebräische Verb für »sagen« leitet den Wortlaut der poetischen Klage ein und wird nicht unnötig zu »sang« präzisiert.
- source_word: הַכְּמוֹת … יָמוּת
  choice: Musste … sterben, wie … stirbt?
  rationale: Die wörtlich stark verdichtete Wendung »wie der Tod/das Sterben … soll er sterben« wird als rhetorische Klagefrage wiedergegeben. Das Präteritum »musste … sterben« passt zur Klage über den bereits eingetretenen Tod, ohne eine göttliche Notwendigkeit zu behaupten.
- source_word: נָבָל
  choice: ein Tor
  rationale: נָבָל bezeichnet einen törichten, oft auch moralisch verwerflichen Menschen. »Tor« bewahrt den würdevoll-poetischen Ton und die biblische Resonanz; die mögliche moralische Schärfe wird in der Fußnote sichtbar gemacht.
- source_word: אַבְנֵר
  choice: Abner
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischer Färbung. »Klagelied anstimmen« kennzeichnet die Gattung, während »sagte« die Form des hebräischen Einleitungsverbs wahrt. Die rhetorische Frage bleibt als Ausdruck von Davids Protest und Trauer erhalten.
