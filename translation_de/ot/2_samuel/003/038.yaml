  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֶל עֲבָדָ֑י/ו הֲ/ל֣וֹא תֵדְע֔וּ כִּי שַׂ֣ר וְ/גָד֗וֹל נָפַ֛ל הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/038.yaml
  text: Then the king said to his servants[a], “Do you not know that a prince and a great man has fallen today in Israel?”
translation:
  language: de
  text: 'Da sagte der König zu seinen Dienern: „Wisst ihr nicht, dass heute ein Fürst[a] und großer Mann in Israel gefallen ist?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Anführer und großer Mann“. Das hebräische Wort שַׂר kann einen Fürsten, Befehlshaber, Herrscher oder führenden Amtsträger bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das waw-consecutivum führt die Erzählung weiter; „Da“ gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Direkte Wiedergabe des bestimmten Substantivs; aus dem Zusammenhang ist David gemeint, ohne dass sein Name ergänzt werden muss.
- source_word: עֲבָדָיו
  choice: zu seinen Dienern
  rationale: עֶבֶד bezeichnet im königlichen Umfeld Diener beziehungsweise Gefolgsleute. „Diener“ bleibt lexikalisch nah, ohne einen amtlichen Rang vorauszusetzen.
- source_word: הֲלוֹא תֵדְעוּ
  choice: Wisst ihr nicht
  rationale: Die Fragepartikel mit Verneinung leitet eine rhetorische Frage ein, die Zustimmung erwartet.
- source_word: כִּי
  choice: dass
  rationale: כִּי führt hier den Inhalt dessen ein, was die Angesprochenen wissen sollen.
- source_word: שַׂר
  choice: ein Fürst
  rationale: שַׂר kann einen Fürsten, Befehlshaber, Herrscher oder führenden Amtsträger bezeichnen. „Fürst“ bewahrt den gehobenen Ton und den hohen Rang Abners; die Bedeutungsbreite wird in der Fußnote kenntlich gemacht.
- source_word: וְגָדוֹל
  choice: und großer Mann
  rationale: Das Adjektiv גָדוֹל steht substantivisch und bezeichnet eine bedeutende, herausragende Person. Im Deutschen kann der gemeinsame Artikel bei „ein Fürst und großer Mann“ beide Bezeichnungen auf dieselbe Person beziehen.
- source_word: נָפַל
  choice: gefallen ist
  rationale: „Fallen“ ist auch im Deutschen eine gehobene und kontextgemäße Umschreibung für den Tod; das Perfekt unterstreicht die gegenwärtige Bedeutung des Ereignisses.
- source_word: הַיּוֹם הַזֶּה
  choice: heute
  rationale: Natürliche moderne Wiedergabe des wörtlichen Ausdrucks „an diesem Tag“.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Präposition bezeichnet hier den nationalen Bereich, in dem dieser bedeutende Mann gefallen ist.
theological_decisions:
- issue: Bezeichnung Abners durch שַׂר
  choice: Fürst
  alternative: Anführer; Befehlshaber; führender Mann
  rationale: Der hebräische Ausdruck legt nicht eindeutig einen erblichen Adelstitel fest. „Fürst“ erhält den feierlichen Rang des Satzes, während die Fußnote die genuine lexikalische Offenheit wahrt.
translation_notes:
  register: Moderne, würdige Standardsprache mit rhetorischer Direktheit. Die Todesmetapher „gefallen“ und die gehobene Rangbezeichnung entsprechen dem feierlichen Ton der Trauerrede.
