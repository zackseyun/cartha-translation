  source_fidelity: 'Der Entwurf gibt die hebräische Aussage vollständig und zutreffend wieder: David ist der Bezugsdativ der Geburt, es handelt sich ausdrücklich um Söhne, Hebron ist der Geburtsort, und Amnon wird als Davids Erstgeborener sowie als Sohn Ahinoams bezeichnet. „aus Jesreel“ gibt die feminine Herkunftsbezeichnung הַיִּזְרְעֵאלִת sachgerecht wieder.'
