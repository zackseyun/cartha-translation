  text: ו/ילדו לְ/דָוִ֛ד בָּנִ֖ים בְּ/חֶבְר֑וֹן וַ/יְהִ֤י בְכוֹר/וֹ֙ אַמְנ֔וֹן לַ/אֲחִינֹ֖עַם הַ/יִּזְרְעֵאלִֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/002.yaml
  text: Sons were born to David in Hebron[a], and his firstborn was Amnon, by Ahinoam the Jezreelitess.
translation:
  language: de
  text: David wurden in Hebron Söhne geboren. Sein Erstgeborener war Amnon, von Ahinoam aus Jesreel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Jesreelitin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/ילדו
  choice: wurden … geboren
  rationale: Die Form bezeichnet hier das Geborenwerden der Söhne und lässt sich im Deutschen natürlich als Passiv wiedergeben.
- source_word: לְ/דָוִד
  choice: David wurden
  rationale: Der hebräische Bezug mit ל wird durch die deutsche Dativkonstruktion idiomatisch und präzise ausgedrückt.
- source_word: בָּנִים
  choice: Söhne
  rationale: Das hebräische Wort bezeichnet ausdrücklich männliche Kinder, nicht allgemein Kinder oder Nachkommen.
- source_word: בְּ/חֶבְרוֹן
  choice: in Hebron
  rationale: Die Präposition wird hier schlicht örtlich gebraucht.
- source_word: וַ/יְהִי
  choice: war
  rationale: In diesem Zusammenhang leitet die Form die nähere Angabe zum Erstgeborenen ein; eine einfache Kopula ist im Deutschen klar und natürlich.
- source_word: בְכוֹר/וֹ
  choice: sein Erstgeborener
  rationale: Die Wiedergabe bewahrt die Bedeutung der Geburtsreihenfolge und mögliche familienrechtliche Nebenbedeutungen besser als „sein Ältester“.
- source_word: אַמְנוֹן
  choice: Amnon
  rationale: Der Personenname wird nach geläufiger deutscher Konvention wiedergegeben.
- source_word: לַ/אֲחִינֹעַם
  choice: von Ahinoam
  rationale: Das ל kennzeichnet in dieser Geburtsliste die Mutter. „Von Ahinoam“ ist knapp und vermeidet die im Deutschen mögliche Fehlinterpretation von „durch Ahinoam“.
- source_word: הַ/יִּזְרְעֵאלִת
  choice: aus Jesreel
  rationale: Das feminine Herkunftsadjektiv bezeichnet Ahinoam als Frau aus Jesreel. Die Herkunftsformulierung ist modernes, natürliches Deutsch und bewahrt den sachlichen Gehalt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erleichtert das Verständnis, ohne den sachlichen Zusammenhang zu verändern. Der Marker [a] steht unmittelbar bei der Herkunftsbezeichnung, auf die sich die Fußnote bezieht.
