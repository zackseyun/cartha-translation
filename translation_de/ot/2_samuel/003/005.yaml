source:
  edition: WLC
  text: וְ/הַ/שִּׁשִּׁ֣י יִתְרְעָ֔ם לְ/עֶגְלָ֖ה אֵ֣שֶׁת דָּוִ֑ד אֵ֛לֶּה יֻלְּד֥וּ לְ/דָוִ֖ד בְּ/חֶבְרֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/005.yaml
  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
translation:
  language: de
  text: 'Und der sechste: Jitream, von Egla, Davids Frau.[a] Diese wurden David in Hebron geboren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Frau Davids“. Im Zusammenhang bezeichnet die Wendung Egla als eine von Davids Frauen, nicht unbedingt als seine einzige Frau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשִּׁשִּׁי
  choice: und der sechste
  rationale: Der mit וְ verbundene Ordinal setzt die Aufzählung der Söhne Davids fort. „Sohn“ ist aus dem Zusammenhang eindeutig und muss nicht ergänzt werden.
- source_word: יִתְרְעָם
  choice: Jitream
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition und in Annäherung an die hebräische Lautgestalt wiedergegeben.
- source_word: לְעֶגְלָה
  choice: von Egla
  rationale: Das לְ kennzeichnet in dieser Geburtsliste die Mutter. „Von Egla“ ist im Deutschen natürlich und macht das Abstammungsverhältnis deutlich.
- source_word: אֵשֶׁת דָּוִד
  choice: Davids Frau
  rationale: Die hebräische Status-constructus-Verbindung bedeutet wörtlich „Frau Davids“. Der deutsche Genitiv bewahrt diese knappe Formulierung, ohne Alleinigkeit zu behaupten.
- source_word: אֵלֶּה
  choice: Diese
  rationale: Das Demonstrativpronomen fasst die zuvor genannten Söhne zusammen; eine Ergänzung wie „Söhne“ ist nicht erforderlich.
- source_word: יֻלְּדוּ
  choice: wurden … geboren
  rationale: Der passive Hofal von ילד bezeichnet hier in der genealogischen Formel das Geborenwerden.
- source_word: לְדָוִד
  choice: David
  rationale: In der Verbindung יֻלְּדוּ לְ bezeichnet לְ die Elternzugehörigkeit. „wurden David geboren“ bildet die hebräische Formel knapp und verständlich ab.
- source_word: בְּחֶבְרוֹן
  choice: in Hebron
  rationale: Die Präposition בְּ ist hier lokal und nennt den Ort der Geburten.
theological_decisions:
- issue: Bezeichnung Eglas als אֵשֶׁת דָּוִד trotz mehrerer Frauen Davids
  choice: Davids Frau
  alternative: eine Frau Davids
  rationale: Die Status-constructus-Verbindung bezeichnet Egla als Frau Davids, legt aber nicht fest, dass sie seine einzige Frau war. Die Hauptübersetzung bleibt eng am Hebräischen; die Fußnote schützt vor einem exklusiven Missverständnis.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Listenstruktur des Hebräischen bleibt erhalten; der Doppelpunkt verdeutlicht die elliptische Zuordnung des sechsten Sohnes.
