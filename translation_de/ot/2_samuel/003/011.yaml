  text: וְ/לֹֽא יָכֹ֣ל ע֔וֹד לְ/הָשִׁ֥יב אֶת אַבְנֵ֖ר דָּבָ֑ר מִ/יִּרְאָת֖/וֹ אֹתֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/011.yaml
  text: And he could no longer answer Abner a word[a], because he feared him.
translation:
  language: de
  text: Und er konnte Abner kein Wort mehr erwidern[a], weil er sich vor ihm fürchtete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Abner nichts mehr antworten“. Wörtlich lautet die hebräische Wendung: „Abner ein Wort erwidern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכֹל
  choice: konnte
  rationale: Das Verb bezeichnet Fähigkeit oder Vermögen; im verneinten Zusammenhang ist „konnte … nicht“ die natürliche deutsche Wiedergabe.
- source_word: עוֹד
  choice: mehr
  rationale: Zusammen mit der Verneinung bezeichnet עוֹד hier das Ende einer fortdauernden Möglichkeit; „kein … mehr“ gibt dies idiomatisch wieder.
- source_word: לְהָשִׁיב
  choice: erwidern
  rationale: Der Hifil von שוב bedeutet hier idiomatisch „antworten“ oder „erwidern“. „Erwidern“ passt zur direkten Reaktion auf Abner.
- source_word: אֶת־אַבְנֵר
  choice: Abner
  rationale: Der Eigenname wird in seiner etablierten deutschen biblischen Form wiedergegeben; אֶת kennzeichnet das direkte Objekt.
- source_word: דָּבָר
  choice: kein Wort
  rationale: Die hebräische Wendung bedeutet wörtlich, jemandem „ein Wort“ zu erwidern. Unter der Verneinung bewahrt „kein Wort“ die knappe und bildhafte Form.
- source_word: מִיִּרְאָתוֹ
  choice: weil er sich vor ihm fürchtete
  rationale: מִן bezeichnet hier den Grund, und יִרְאָה mit Objektsuffix drückt Furcht vor Abner aus. Der kausale Nebensatz ist im modernen Deutsch klar und natürlich.
- source_word: אֹתוֹ
  choice: ihm
  rationale: Das Objektsuffix bezieht sich auf Abner; nach „sich fürchten vor“ steht im Deutschen der Dativ.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die hebräische Kürze wird durch „kein Wort mehr erwidern“ bewahrt, während der Grund der Sprachlosigkeit in natürlichem Deutsch als Kausalsatz erscheint.
