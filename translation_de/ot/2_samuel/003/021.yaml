source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְנֵ֣ר אֶל דָּוִ֡ד אָק֣וּמָה וְֽ/אֵלֵ֡כָה וְ/אֶקְבְּצָה֩ אֶל אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אֶת כָּל יִשְׂרָאֵ֗ל וְ/יִכְרְת֤וּ אִתְּ/ךָ֙ בְּרִ֔ית וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וַ/יְּשַׁלַּ֥ח דָּוִ֛ד אֶת אַבְנֵ֖ר וַ/יֵּ֥לֶךְ בְּ/שָׁלֽוֹם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/021.yaml
  text: Abner said to David[a], “I will arise and go, and I will gather all Israel to my lord the king, so that they may make a covenant with you, and you shall reign over all that your soul desires.” Then David sent Abner away[c][b], and he went in peace.
translation:
  language: de
  text: 'Abner sagte zu David: „Ich will mich aufmachen und gehen und ganz Israel zu meinem Herrn, dem König, versammeln, damit sie einen Bund mit dir schließen[a]. Dann wirst du als König über alles herrschen, was deine Seele begehrt[b].“ David ließ Abner ziehen, und er ging in Frieden[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Bund mit dir schneiden“; dies ist die übliche hebräische Wendung für das Schließen eines Bundes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „was du begehrst“; wörtlich: „was deine Seele begehrt“.'
    reason: lexical_alternative
  - marker: c
    text: „In Frieden gehen“ ist eine hebräische Wendung für eine sichere Abreise in friedlichem Einvernehmen.
    reason: cultural_note
lexical_decisions:
- source_word: אָקוּמָה וְאֵלֵכָה
  choice: Ich will mich aufmachen und gehen
  rationale: Die Kohortativformen drücken Abners entschlossenen Vorsatz aus. Die leicht feierliche Doppelung bewahrt die rhetorische Bewegung des Hebräischen und bleibt im Deutschen verständlich.
- source_word: וְאֶקְבְּצָה ... אֶת כָּל יִשְׂרָאֵל
  choice: und ganz Israel ... versammeln
  rationale: קבץ bezeichnet hier das politische Zusammenbringen der Stämme; „ganz Israel“ gibt die kollektive Größe natürlich wieder.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: zu meinem Herrn, dem König
  rationale: 'אֶל wird richtungsbezogen verstanden: Abner will Israel zu David bringen. Die Apposition wahrt die höfische Anrede.'
- source_word: וְיִכְרְתוּ אִתְּךָ בְּרִית
  choice: damit sie einen Bund mit dir schließen
  rationale: כרת ברית ist die feste hebräische Wendung für das Eingehen eines Bundes. „Einen Bund schließen“ ist die entsprechende natürliche deutsche Wendung; die wörtliche Bildsprache wird in der Fußnote genannt.
- source_word: וּמָלַכְתָּ
  choice: Dann wirst du als König ... herrschen
  rationale: Das Verb bezeichnet die Ausübung der Königsherrschaft. Die Formulierung ist im modernen Deutschen natürlicher als „du wirst königen“ und erhält den ausdrücklichen Bezug auf das Königtum.
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: über alles, was deine Seele begehrt
  rationale: Die Wiedergabe bewahrt נפש als „Seele“ und damit die hebräische Rede vom inneren Selbst als Träger des Begehrens, ohne sie stillschweigend zu „Herz“ umzudeuten.
- source_word: וַיְשַׁלַּח דָּוִד אֶת אַבְנֵר
  choice: David ließ Abner ziehen
  rationale: Im Zusammenhang bedeutet שלח, dass David Abner entließ beziehungsweise seine Abreise gestattete. „Ließ ... ziehen“ drückt dies im Deutschen knapp und natürlich aus.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: und er ging in Frieden
  rationale: Die herkömmliche hebräische Wendung bezeichnet eine sichere, friedliche und einvernehmliche Abreise. Die formnahe deutsche Fassung bleibt verständlich und wird durch eine Fußnote erläutert.
theological_decisions:
- issue: Bundessprache
  choice: einen Bund mit dir schließen
  alternative: 'wörtlich: einen Bund mit dir schneiden'
  rationale: Gemeint ist hier ein politischer Bund. Die natürliche deutsche Bundesformel vermeidet eine unverständliche Hebraismusübertragung, während die Fußnote die konkrete hebräische Bildsprache offenlegt.
- issue: Anthropologische Sprache von נפש
  choice: was deine Seele begehrt
  alternative: was du begehrst
  rationale: Die explizite Nennung der „Seele“ wahrt die Ausdrucksweise und mögliche anthropologische Färbung des Ausgangstextes. Die idiomatischere Alternative wird als Übersetzungsmöglichkeit vermerkt, ohne die Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede Abners behält durch „mich aufmachen und gehen“ einen leicht feierlichen Ton; ansonsten wurden natürliche deutsche Satzführung und geläufige Wendungen bevorzugt. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
