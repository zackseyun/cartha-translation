translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rituellen Trauerhandlungen werden verständlich formuliert; die räumliche Mehrdeutigkeit von „vor Abner“ bleibt erhalten. Der Fußnotenmarker steht unmittelbar nach dem erklärungsbedürftigen Ausdruck.
