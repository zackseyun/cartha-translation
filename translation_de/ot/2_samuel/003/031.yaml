base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/031.yaml
  text: Then David said to Joab and to all the people who were with him[a], “Tear your clothes, gird yourselves with sackcloth, and mourn before Abner.” And King David was walking behind the bier.
translation:
  language: de
  text: 'Da sagte David zu Joab und zu dem ganzen Volk, das bei ihm war: „Zerreißt eure Kleider, legt Sacktuch an und haltet vor Abner die Totenklage.“ König David ging hinter der Totenbahre[a] her.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Liege“ oder „Bett“; hier ist die Bahre gemeint, auf der Abners Leichnam getragen wurde.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ בִגְדֵיכֶם
  choice: Zerreißt eure Kleider
  rationale: Der pluralische Imperativ bezeichnet das im Trauerritus übliche Zerreißen der Kleidung; die Wendung ist im Deutschen klar und nah am Hebräischen.
- source_word: וְחִגְרוּ שַׂקִּים
  choice: legt Trauergewänder aus Sacktuch an
  rationale: חגר bezeichnet eigentlich das Umbinden oder Anlegen, שַׂק grobes Sacktuch als Trauerkleidung. Die Übersetzung macht die kulturelle Funktion verständlich, ohne bloß modernes Verpackungsmaterial anzudeuten.
- source_word: וְסִפְדוּ
  choice: und haltet … die Totenklage
  rationale: ספד meint hier nicht nur allgemeine Trauer, sondern das rituelle Klagen um einen Verstorbenen. „Die Totenklage halten“ gibt dies präzise und würdig wieder.
- source_word: לִפְנֵי אַבְנֵר
  choice: vor Abner
  rationale: Die räumliche Formulierung des Hebräischen bleibt erhalten. Im Zusammenhang ist Abner auf der Bahre gemeint, doch dies wird nicht erklärend in den Haupttext eingefügt.
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: König David selbst
  rationale: Die königliche Bezeichnung wird natürlich wiedergegeben; „selbst“ hebt den bemerkenswerten Gegensatz hervor, dass David persönlich hinter der Bahre ging, ohne zusätzliche Sachinformation einzuführen.
- source_word: הֹלֵךְ אַחֲרֵי
  choice: ging … hinter … her
  rationale: Das Partizip beschreibt Davids fortlaufende Stellung beziehungsweise Bewegung im Trauerzug. Die deutsche Konstruktion ist idiomatisch und bewahrt den räumlichen Sinn.
- source_word: הַמִּטָּה
  choice: die Totenbahre
  rationale: מִטָּה bedeutet gewöhnlich Bett oder Liege, bezeichnet hier aber die Trage, auf der Abners Leichnam im Trauerzug lag. „Totenbahre“ ist im Deutschen eindeutig und kontextgerecht.
