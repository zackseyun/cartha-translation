base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/016.yaml
  text: Her husband went with her[a], walking and weeping behind her as far as Bahurim. Then Abner said to him, “Go[b], return.” So he returned.
translation:
  language: de
  text: 'Ihr Mann ging mit ihr, ging hinter ihr her und weinte bis nach Bahurim. Da sagte Abner zu ihm: »Geh, kehr um!«[b] Und er kehrte um.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Die beiden Imperative können zusammenfassend auch mit »Geh zurück!« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  choice: ihr Mann
  rationale: Im Zusammenhang bezeichnet אִישׁ mit dem Suffix der 3. Person feminin Singular den Ehemann der Frau; »ihr Mann« ist im Deutschen natürlich und präzise.
- source_word: הָלוֹךְ וּבָכֹה
  choice: er folgte ihr weinend
  rationale: Die hebräische Verbindung schildert ein fortdauerndes Gehen und Weinen. Die deutsche Formulierung gibt den begleitenden, anhaltenden Vorgang natürlich wieder.
- source_word: אַחֲרֶיהָ
  choice: ihr folgte
  rationale: Das Wort bezeichnet hier die Bewegung hinter der Frau her. »Ihr folgte« ist idiomatisches Deutsch; die räumlich ausdrücklichere Wiedergabe steht in der Fußnote.
- source_word: עַד בַּחֻרִים
  choice: bis nach Bahurim
  rationale: עַד vor einem Ortsnamen bezeichnet den Endpunkt einer Bewegung; »bis nach« ist dafür eine natürliche deutsche Wiedergabe.
- source_word: בַּחֻרִים
  choice: Bahurim
  rationale: Der Ortsname wird transliteriert und nicht übersetzt.
- source_word: לֵךְ שׁוּב
  choice: Geh, kehr um!
  rationale: Die Wiedergabe erhält beide hebräischen Imperative und damit den nachdrücklichen Charakter des Befehls.
- source_word: וַיָּשֹׁב
  choice: Und er kehrte um
  rationale: Das narrative וַ führt die Handlung fort; die Wiederaufnahme von »kehr um« bildet die unmittelbare Befolgung des Befehls ab.
