  text: וַ/יִּחַר֩ לְ/אַבְנֵ֨ר מְאֹ֜ד עַל דִּבְרֵ֣י אִֽישׁ בֹּ֗שֶׁת וַ/יֹּ֨אמֶר֙ הֲ/רֹ֨אשׁ כֶּ֥לֶב אָנֹ֘כִי֮ אֲשֶׁ֣ר לִֽ/יהוּדָה֒ הַ/יּ֨וֹם אֶֽעֱשֶׂה חֶ֜סֶד עִם בֵּ֣ית שָׁא֣וּל אָבִ֗י/ךָ אֶל אֶחָי/ו֙ וְ/אֶל מֵ֣רֵעֵ֔/הוּ וְ/לֹ֥א הִמְצִיתִ֖/ךָ בְּ/יַד דָּוִ֑ד וַ/תִּפְקֹ֥ד עָלַ֛/י עֲוֺ֥ן הָ/אִשָּׁ֖ה הַ/יּֽוֹם־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/008.yaml
  text: Then Abner became very angry because of Ish-bosheth’s words[a], and he said, “Am I a dog’s head that belongs to Judah? To this day I have shown covenant loyalty to the house of Saul your father, to his brothers, and to his friends, and have not delivered you into David’s hand; yet today you charge me with guilt concerning this woman.”
translation:
  language: de
  text: 'Da wurde Abner über die Worte Isch-Boschets sehr zornig und sagte: „Bin ich etwa ein Hundskopf, der zu Juda gehört?[a] Bis zum heutigen Tag habe ich dem Haus Sauls, deines Vaters, seinen Brüdern und seinen Freunden treue Verbundenheit erwiesen und dich nicht in Davids Hand ausgeliefert. Und heute rechnest du mir wegen dieser Frau eine Schuld an!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „ein Hundskopf, der zu Juda gehört“. Das schwer verständliche Schimpfbild bezeichnet vermutlich einen verachtenswerten Menschen auf Judas Seite; die Übersetzung bewahrt das Bild und seine Mehrdeutigkeit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְאַבְנֵר מְאֹד
  choice: Da wurde Abner … sehr zornig
  rationale: Die Wendung חרה ל bezeichnet das Entbrennen von Zorn; „sehr zornig werden“ gibt das Idiom und die Verstärkung durch מְאֹד in natürlichem Deutsch wieder.
- source_word: עַל דִּבְרֵי אִישׁ בֹּשֶׁת
  choice: über die Worte Isch-Boschets
  rationale: עַל bezeichnet hier den Anlass des Zorns; „über“ bewahrt zugleich die wörtliche Rede von den „Worten“.
- source_word: הֲרֹאשׁ כֶּלֶב אָנֹכִי אֲשֶׁר לִיהוּדָה
  choice: Bin ich etwa ein Hundskopf, der zu Juda gehört?
  rationale: „Hundskopf“ bewahrt das schwierige und verächtliche Bild des Hebräischen. „Der zu Juda gehört“ lässt offen, ob Zugehörigkeit, Parteinahme oder Herkunft gemeint ist.
- source_word: הַיּוֹם אֶעֱשֶׂה חֶסֶד
  choice: Bis zum heutigen Tag habe ich … treue Verbundenheit erwiesen
  rationale: Im Rückblick auf Abners bisheriges Verhalten bezeichnet הַיּוֹם den erreichten gegenwärtigen Zeitpunkt. „Treue Verbundenheit“ gibt חֶסֶד als loyale, tätige Zuwendung wieder, ohne ausdrücklich einen im Kontext nicht genannten Bund vorauszusetzen.
- source_word: עִם בֵּית שָׁאוּל אָבִיךָ אֶל אֶחָיו וְאֶל מֵרֵעֵהוּ
  choice: dem Haus Sauls, deines Vaters, seinen Brüdern und seinen Freunden
  rationale: „Haus Sauls“ bewahrt den dynastischen Sinn; „Brüder“ und „Freunde“ entsprechen den konkreten Beziehungsbezeichnungen des Ausgangstextes.
- source_word: וְלֹא הִמְצִיתִךָ בְּיַד דָּוִד
  choice: und dich nicht in Davids Hand ausgeliefert
  rationale: Die deutsche Wendung bewahrt das hebräische Bild von der Hand als Machtbereich und gibt den kausativen Sinn des Verbs wieder.
- source_word: וַתִּפְקֹד עָלַי עֲוֺן הָאִשָּׁה הַיּוֹם
  choice: Und heute rechnest du mir wegen dieser Frau eine Schuld an!
  rationale: פקד על in Verbindung mit עָוֺן bezeichnet das Anrechnen beziehungsweise Zur-Rechenschaft-Ziehen wegen einer Schuld. „Wegen dieser Frau“ bewahrt die Unbestimmtheit darüber, wie genau die Frau zur vorgeworfenen Schuld gehört.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Schärfe von Abners Antwort bleibt erhalten; das ungewöhnliche Schimpfbild wird nicht durch eine eindeutige Deutung ersetzt. Der erste Gebrauch von הַיּוֹם wird rückblickend („bis zum heutigen Tag“), der zweite als pointierter Gegenwartsbezug („heute“) wiedergegeben.
