  text: וַ/יָּ֤שָׁב אַבְנֵר֙ חֶבְר֔וֹן וַ/יַּטֵּ֤/הוּ יוֹאָב֙ אֶל תּ֣וֹךְ הַ/שַּׁ֔עַר לְ/דַבֵּ֥ר אִתּ֖/וֹ בַּ/שֶּׁ֑לִי וַ/יַּכֵּ֤/הוּ שָׁם֙ הַ/חֹ֔מֶשׁ וַ/יָּ֕מָת בְּ/דַ֖ם עֲשָׂה אֵ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/027.yaml
  text: When Abner returned to Hebron[a], Joab drew him aside into the middle of the gate to speak with him privately, and there he struck him in the belly, so that he died, for the blood of Asahel his brother.
translation:
  language: de
  text: Als Abner nach Hebron zurückkehrte, führte Joab ihn beiseite ins Innere des Tores, um ungestört mit ihm zu reden. Dort schlug er ihn in den Bauch[a], sodass er starb – wegen des Blutes Asaëls, seines Bruders.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionelle Wiedergabe: „an die fünfte Rippe“; gemeint ist wahrscheinlich die Bauch- oder Unterleibsgegend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: zurückkehrte
  rationale: שׁוב bezeichnet hier Abners Rückkehr nach Hebron, nachdem er zuvor fortgeschickt worden war.
- source_word: וַיַּטֵּהוּ
  choice: zog ... beiseite
  rationale: Die Hifil-Form von נטה bezeichnet ein Abbringen oder Beiseiteführen und bewahrt hier sowohl die gerichtete Bewegung als auch Joabs Absicht.
- source_word: אֶל־תּוֹךְ הַשַּׁעַר
  choice: ins Innere des Tores
  rationale: תּוֹךְ bezeichnet den Innenraum beziehungsweise die Mitte; שַׁעַר kann die gesamte Toranlage meinen. Die Formulierung ist quellennah und im Deutschen natürlich verständlich.
- source_word: לְדַבֵּר אִתּוֹ בַּשֶּׁלִי
  choice: um ungestört mit ihm zu reden
  rationale: בַּשֶּׁלִי ist selten und kann Ruhe, Ungestörtheit oder Vertraulichkeit ausdrücken. „Ungestört“ passt zur erzählten Situation, ohne die schwer bestimmbare Nuance vollständig auf „heimlich“ oder „privat“ festzulegen.
- source_word: וַיַּכֵּהוּ שָׁם הַחֹמֶשׁ
  choice: Dort schlug er ihn in den Bauch
  rationale: נכה bedeutet grundsätzlich „schlagen/treffen“. חֹמֶשׁ bezeichnet in vergleichbaren Tötungsszenen die Bauch- oder Unterleibsgegend; die traditionelle Wiedergabe „fünfte Rippe“ wird in der Fußnote erhalten.
- source_word: וַיָּמָת
  choice: sodass er starb
  rationale: Die Formulierung gibt den unmittelbaren tödlichen Ausgang des Schlages in natürlichem Deutsch als Folge wieder.
- source_word: בְּדַם עֲשָׂהאֵל אָחִיו
  choice: wegen des Blutes seines Bruders Asaël
  rationale: Die Präposition בְּ bezeichnet hier Grund oder Motiv. Die knappe Formulierung bewahrt die im Hebräischen anklingende Blut- und Vergeltungssprache, ohne sie ausdrücklich auszudeuten.
theological_decisions:
- issue: Charakterisierung von Joabs Motiv
  choice: wegen des Blutes seines Bruders Asaël
  alternative: aus Rache für seinen Bruder Asaël
  rationale: Der hebräische Text nennt das Blut Asaëls als Grund, bezeichnet Joabs Tat aber nicht ausdrücklich mit einem Wort für „Rache“. Die Übersetzung wahrt diese rechtlich-theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. „Ins Innere des Tores“ macht die antike Toranlage verständlich, ohne sie zu modernisieren. „Ungestört“ wahrt die Unsicherheit des seltenen Ausdrucks בַּשֶּׁלִי besser als eine eindeutigere Festlegung auf „heimlich“ oder „vertraulich“.
