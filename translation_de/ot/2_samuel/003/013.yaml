base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
translation:
  language: de
  text: 'Er sagte: „Gut. Ich werde mit dir einen Bund schließen. Nur um eines bitte ich dich: Du sollst mein Angesicht nicht sehen, es sei denn, du bringst zuerst Michal, Sauls Tochter, wenn du kommst, um mein Angesicht zu sehen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „mein Angesicht sehen“ kann hier auch im Sinn von „vor mir erscheinen“ beziehungsweise „bei mir vorgelassen werden“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Gut
  rationale: Bewahrt die knappe Zustimmung Davids, ohne sie erläuternd auszuweiten.
- source_word: אֶכְרֹת ... בְּרִית
  choice: einen Bund schließen
  rationale: Gibt die hebräische Wendung wörtlich „einen Bund schneiden“ in natürlichem, zugleich formalem Deutsch wieder.
- source_word: אַךְ דָּבָר אֶחָד אָנֹכִי שֹׁאֵל מֵאִתְּךָ
  choice: Nur eines verlange ich von dir
  rationale: Gibt die einschränkende Kraft von אַךְ und Davids verbindliche Bedingung prägnant wieder; „verlangen“ passt im Deutschen hier besser zum folgenden Verbot als das schwächere „bitten“.
- source_word: לֹא תִרְאֶה אֶת פָּנַי
  choice: Du wirst mein Angesicht nicht sehen
  rationale: Bewahrt die wiederholte hebräische Wendung und ihren persönlichen beziehungsweise höfischen Beiklang.
- source_word: כִּי אִם
  choice: es sei denn
  rationale: Drückt die ausnehmend-bedingende Bedeutung natürlich aus.
- source_word: לִפְנֵי הֱבִיאֲךָ
  choice: du bringst zuerst
  rationale: Macht die zeitliche Priorität der Bedingung idiomatisch deutlich.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Michal, Sauls Tochter
  rationale: Natürliche appositionelle Wiedergabe der hebräischen Identifizierung.
- source_word: בְּבֹאֲךָ לִרְאוֹת אֶת פָּנָי
  choice: wenn du kommst, um mein Angesicht zu sehen
  rationale: Erhält die Wiederholung von „mein Angesicht sehen“ und gibt Zweck sowie Zeitpunkt verständlich wieder.
