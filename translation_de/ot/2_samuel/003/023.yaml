base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/023.yaml
  text: When Joab and all the army that was with him arrived, they told Joab, saying, “Abner son of Ner came to the king, and he sent him away, and he went in peace.”
translation:
  language: de
  text: 'Als Joab und das ganze Heer, das bei ihm war, ankamen, berichteten sie Joab: »Abner, der Sohn Ners, ist zum König gekommen. Der König hat ihn fortgesandt, und er ist in Frieden fortgegangen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאוּ
  choice: zurückkamen
  rationale: Das Verb bedeutet grundsätzlich »kamen«. Im Erzählzusammenhang kehren Joab und das Heer von einem Beutezug zurück; »zurückkamen« gibt diesen Kontext natürlich wieder, ohne eine zusätzliche Deutung einzuführen.
- source_word: הַצָּבָא
  choice: das ganze Heer
  rationale: צָבָא bezeichnet hier die bewaffnete Truppe unter Joabs Führung; »Heer« ist im historischen Kontext angemessen und würdevoll.
- source_word: וַיַּגִּדוּ
  choice: berichtete man
  rationale: Die unbestimmte Mehrzahl »sie berichteten« nennt keine konkreten Personen. Die deutsche unpersönliche Form bewahrt diese Unbestimmtheit und vermeidet ein missverständliches Bezugswort.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: Der hat ihn gehen lassen
  rationale: Das Verb kann »wegschicken«, »entlassen« oder »gehen lassen« bedeuten. Hier bringt »gehen lassen« zum Ausdruck, dass David Abner unbehelligt ziehen ließ.
- source_word: בְּשָׁלוֹם
  choice: in Frieden
  rationale: Die formnahe Wendung bewahrt sowohl den Gedanken friedlicher Beziehungen als auch den einer sicheren, unversehrten Abreise.
theological_decisions:
- issue: Bedeutungsumfang von בְּשָׁלוֹם
  choice: in Frieden
  alternative: wohlbehalten / unbehelligt
  rationale: '»In Frieden« erhält die erzählerische und mögliche bundestheologische Spannung: Abner wurde friedlich entlassen, obwohl Joab ihn anschließend aus persönlicher Vergeltung töten wird.'
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit historisch angemessenem Erzählton. Die formelhafte hebräische Redeeinleitung לֵאמֹר wird im Deutschen nicht eigens mit »und sagten« wiederholt, da der Doppelpunkt ihre Funktion natürlich übernimmt. Die Pronomen werden durch »Der« eindeutig auf den König bezogen.
