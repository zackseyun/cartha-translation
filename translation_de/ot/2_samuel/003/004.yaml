- source_word: אֲדֹנִיָּה
  choice: Adonija
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition wiedergegeben.
- source_word: בֶן
  choice: der Sohn
  rationale: Die Constructusverbindung bezeichnet direkte Abstammung; die Formulierung mit bestimmtem Artikel klingt in einer deutschen Namensliste natürlich und eindeutig.
- source_word: חַגִּית
  choice: Haggit
  rationale: Der Personenname wird in einer im Deutschen üblichen Form wiedergegeben.
- source_word: וְהַחֲמִישִׁי
  choice: und der fünfte
  rationale: Die Konjunktion verbindet den nächsten Eintrag der fortlaufenden Liste; die Ordnungszahl wird direkt wiedergegeben.
- source_word: שְׁפַטְיָה
  choice: Schefatja
  rationale: Der hebräische Personenname wird nach geläufigen deutschen Transliterationskonventionen wiedergegeben.
- source_word: אֲבִיטָל
  choice: Abital
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
