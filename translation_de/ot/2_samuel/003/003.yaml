base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/003.yaml
  text: his second, Kileab, by Abigail the wife of Nabal the Carmelite; and the third, Absalom the son of Maacah daughter of Talmai king of Geshur.
translation:
  language: de
  text: 'der zweite: Kileab, von Abigajil, der Frau Nabals aus Karmel; und der dritte: Absalom, der Sohn Maachas, der Tochter Talmais, des Königs von Geschur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִשְׁנֵהוּ
  choice: der zweite
  rationale: Gibt die Ordnungsangabe im fortlaufenden genealogischen Satz knapp und natürlich wieder.
- source_word: כִלְאָב
  choice: Kileab
  rationale: Nahe Transkription des masoretischen Namens כִלְאָב; die abweichende Namensform Daniel in 1. Chronik 3,1 wird hier nicht harmonisierend eingesetzt.
- source_word: לַאֲבִיגַל
  choice: von Abigajil
  rationale: Das ל bezeichnet hier im genealogischen Zusammenhang die Mutter; „von“ ist im Deutschen knapp und idiomatisch.
- source_word: הַכַּרְמְלִי
  choice: des Karmeliters
  rationale: Bezeichnet Nabals Herkunft aus Karmel, nicht den späteren Karmeliterorden.
- source_word: גְּשׁוּר
  choice: Geschur
  rationale: Eingebürgerte deutsche Transkription des Orts- bzw. Reichsnamens.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger genealogischer Stil. Die elliptische Fortsetzung des vorangehenden Verses bleibt durch die Reihungsform „der zweite … der dritte“ erhalten; Doppelpunkte verbessern die Lesbarkeit, ohne zusätzliche Aussage einzuführen.
