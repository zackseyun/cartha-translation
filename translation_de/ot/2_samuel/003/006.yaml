  text: וַ/יְהִ֗י בִּֽ/הְיוֹת֙ הַ/מִּלְחָמָ֔ה בֵּ֚ין בֵּ֣ית שָׁא֔וּל וּ/בֵ֖ין בֵּ֣ית דָּוִ֑ד וְ/אַבְנֵ֛ר הָיָ֥ה מִתְחַזֵּ֖ק בְּ/בֵ֥ית שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/006.yaml
  text: While the war continued between the house of Saul and the house of David[a], Abner was strengthening himself in the house of Saul.
translation:
  language: de
  text: Während der Krieg zwischen dem Haus Sauls und dem Haus Davids andauerte, wurde Abner im Haus Sauls immer mächtiger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »festigte Abner seine Stellung im Haus Sauls«. Das hebräische Verb kann sowohl ein Erstarken als auch ein aktives Stärken der eigenen Position ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת הַמִּלְחָמָה
  choice: Während der Krieg … andauerte
  rationale: Die Konstruktion mit ב plus Infinitiv von היה bildet einen durativen Temporalsatz. Die Wiedergabe drückt den fortdauernden Krieg natürlich aus, ohne eine nicht ausdrücklich vorhandene Entsprechung für »nun« einzufügen.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: zwischen dem Haus Sauls und dem Haus Davids
  rationale: »Haus« bewahrt die hebräische Bildsprache und lässt sowohl die familiäre als auch die dynastisch-politische Bedeutung offen.
- source_word: הָיָה מִתְחַזֵּק
  choice: wurde … immer mächtiger
  rationale: Das Hithpael von חזק kann ein Erstarken beziehungsweise eine selbst betriebene Festigung der eigenen Macht bezeichnen. Die Hauptübersetzung ist im Deutschen natürlich und hält den Vorgang offen; die stärker reflexive Deutung wird in der Fußnote genannt.
- source_word: בְּבֵית שָׁאוּל
  choice: im Haus Sauls
  rationale: Die Präposition bezeichnet hier den Bereich beziehungsweise die politische Machtbasis, innerhalb deren Abner an Stärke gewann. Die Formulierung erhält zugleich die Mehrdeutigkeit von »Haus«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung »Haus Sauls/Haus Davids« wurde bewusst beibehalten, um die familiäre und dynastisch-politische Spannung des Hebräischen nicht aufzulösen.
