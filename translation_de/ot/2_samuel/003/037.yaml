base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/037.yaml
  text: So all the people and all Israel knew on that day that it was not from the king to put Abner son of Ner to death[a].
translation:
  language: de
  text: So erkannten an jenem Tag das ganze Volk und ganz Israel, dass die Tötung Abners, des Sohnes Ners, nicht vom König ausgegangen war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dass es nicht vom König her war, Abner, den Sohn Ners, zu töten“. Möglich ist auch die Deutung: „dass der König seine Tötung nicht angeordnet hatte“. Das Hebräische bezeichnet die Quelle oder den Ursprung des Geschehens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדְעוּ
  choice: So erkannten
  rationale: Das Qal-Wayyiqtol von ידע bezeichnet hier das Erlangen beziehungsweise Feststellen einer Erkenntnis; „erkannten“ passt natürlich zur erzählerischen Zusammenfassung.
- source_word: כָל הָעָם וְכָל יִשְׂרָאֵל
  choice: das ganze Volk und ganz Israel
  rationale: Bewahrt die zweigliedrige kollektive Ausdrucksweise des Hebräischen, ohne beide Bezeichnungen miteinander gleichzusetzen.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Gängige und würdevolle deutsche Wiedergabe der temporalen Wendung.
- source_word: כִּי
  choice: dass
  rationale: Leitet den Inhalt dessen ein, was erkannt wurde.
- source_word: לֹא הָיְתָה מֵהַמֶּלֶךְ
  choice: nicht vom König ausgegangen war
  rationale: Gibt die im Hebräischen ausgedrückte Quelle beziehungsweise den Ursprung idiomatisch wieder, ohne ausdrücklich eine Anordnung oder eine umfassende rechtliche Unschuld zu behaupten.
- source_word: לְהָמִית
  choice: die Tötung
  rationale: Die substantivische Formulierung fügt sich natürlich in die deutsche Ursprungswendung „vom König ausgegangen“ und bewahrt den kausativen Sinn des Hifil, ohne ein Gerichtsverfahren anzudeuten.
- source_word: אֶת אַבְנֵר בֶּן נֵר
  choice: Abners, des Sohnes Ners
  rationale: Bewahrt Namen und Abstammungsangabe in idiomatischem deutschem Genitiv.
theological_decisions:
- issue: Ausmaß der Aussage über Davids Verantwortung für Abners Tod
  choice: Die Tötung war nicht vom König ausgegangen.
  alternative: Der König war am Tod Abners unschuldig; der König hatte die Tötung nicht angeordnet.
  rationale: Der hebräische Text bezeichnet Quelle oder Ursprung des Geschehens. Er verwendet weder ausdrücklich eine rechtliche Kategorie der Unschuld noch das Vokabular eines Befehls; diese Spannung bleibt daher erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoll-erzählerischem Ton. Die doppelte Kollektivbezeichnung und die zurückhaltende Aussage zur Verantwortung des Königs bleiben erhalten.
