  text: וְ/הִנֵּה֩ עַבְדֵ֨י דָוִ֤ד וְ/יוֹאָב֙ בָּ֣א מֵֽ/הַ/גְּד֔וּד וְ/שָׁלָ֥ל רָ֖ב עִמָּ֣/ם הֵבִ֑יאוּ וְ/אַבְנֵ֗ר אֵינֶ֤/נּוּ עִם דָּוִד֙ בְּ/חֶבְר֔וֹן כִּ֥י שִׁלְּח֖/וֹ וַ/יֵּ֥לֶךְ בְּ/שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/022.yaml
  text: And behold[a], David’s servants and Joab came in from a raid and brought much plunder with them. But Abner was not with David in Hebron, because he had sent him away[b], and he had gone in peace.
translation:
  language: de
  text: Und siehe, Davids Leute und Joab kamen von einem Streifzug[a] zurück und brachten reiche Beute mit. Abner aber war nicht bei David in Hebron, denn David hatte ihn fortgeschickt, und er war in Frieden fortgegangen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Streifschar“. Das hebräische Wort kann sowohl eine Truppe beziehungsweise Schar als auch einen von ihr unternommenen Streifzug bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „In Frieden fortgehen“ bedeutet hier, dass Abner sicher und ohne Feindseligkeit abreiste.
    reason: idiom_clarification
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Die Wendung markiert anschaulich eine neue, überraschende Entwicklung. „Und siehe“ bewahrt diese deiktische Erzählfunktion in würdigem, allgemein verständlichem Deutsch.
- source_word: עַבְדֵי דָוִד
  choice: Davids Leute
  rationale: עֶבֶד bezeichnet hier Männer in Davids Dienst, darunter offenbar militärische Gefolgsleute. „Leute“ vermeidet die im Deutschen naheliegende Einengung auf Hausdiener oder Sklaven.
- source_word: מֵהַגְּדוּד
  choice: von einem Streifzug
  rationale: גְּדוּד kann eine Schar oder Truppe, aber auch deren Raub- beziehungsweise Kriegszug bezeichnen. Die anschließend erwähnte Beute spricht hier für die Wiedergabe als Unternehmung.
- source_word: וְשָׁלָל רָב עִמָּם הֵבִיאוּ
  choice: und brachten reiche Beute mit
  rationale: שָׁלָל ist erbeutetes Gut; רָב bezeichnet dessen große Menge. „Reiche Beute“ ist natürliches modernes Deutsch und gibt beides knapp wieder.
- source_word: וְאַבְנֵר אֵינֶנּוּ עִם דָּוִד בְּחֶבְרוֹן
  choice: Abner aber war nicht bei David in Hebron
  rationale: Das nachgestellte „aber“ macht den sachlichen Gegensatz zwischen der Rückkehr Joabs und Abners Abwesenheit deutlich, ohne mehr in die Konjunktion hineinzulesen.
- source_word: כִּי שִׁלְּחוֹ
  choice: denn David hatte ihn fortgeschickt
  rationale: Das Hebräische lässt das Subjekt unausgesprochen; aus dem Zusammenhang ist David gemeint. Seine ausdrückliche Nennung beseitigt im Deutschen eine vermeidbare Pronomenmehrdeutigkeit. Das Plusquamperfekt zeigt, dass die Handlung vor Joabs Ankunft lag.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: und er war in Frieden fortgegangen
  rationale: Die formnahe Wendung bewahrt sowohl den Gedanken einer friedlichen Trennung als auch den einer sicheren Abreise; die Fußnote erläutert den idiomatischen Umfang.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lebhafte Erzählformel „Und siehe“ bleibt erhalten; militärische Begriffe werden allgemein verständlich wiedergegeben. Die hebräische Mehrdeutigkeit von גְּדוּד und der Bedeutungsumfang von בְּשָׁלוֹם werden nicht stillschweigend eingeengt, sondern in Fußnoten ausgewiesen.
