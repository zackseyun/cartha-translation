  yaml_path: translation/ot/2_samuel/003/017.yaml
  text: Abner had spoken with the elders of Israel, saying, “For some time you have been seeking David to be king over you.”
translation:
  language: de
  text: 'Abner hatte mit den Ältesten Israels gesprochen und gesagt: »Schon seit Längerem habt ihr euch David als König über euch gewünscht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּדְבַר אַבְנֵר הָיָה עִם
  choice: Abner hatte mit … gesprochen
  rationale: Die idiomatische hebräische Wendung bezeichnet, dass Abner mit den Ältesten verhandelt bzw. gesprochen hatte. Das Plusquamperfekt gibt den rückblickenden Zusammenhang natürlich wieder.
- source_word: גַּם תְּמוֹל גַּם שִׁלְשֹׁם
  choice: schon seit Längerem
  rationale: Die feste Wendung bedeutet wörtlich »sowohl gestern als auch vorgestern«, idiomatisch jedoch »schon seit einiger Zeit«; die deutsche Formulierung bewahrt diesen zeitlichen Sinn.
- source_word: מְבַקְשִׁים אֶת דָּוִד לְמֶלֶךְ
  choice: wollt ihr David als König … haben
  rationale: בקשׁ bezeichnet hier nicht bloß eine Suche, sondern den anhaltenden Wunsch bzw. das Bestreben, David zum König zu haben.
