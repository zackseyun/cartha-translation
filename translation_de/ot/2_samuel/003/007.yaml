source:
  edition: WLC
  text: וּ/לְ/שָׁא֣וּל פִּלֶ֔גֶשׁ וּ/שְׁמָ֖/הּ רִצְפָּ֣ה בַת אַיָּ֑ה וַ/יֹּ֨אמֶר֙ אֶל אַבְנֵ֔ר מַדּ֥וּעַ בָּ֖אתָה אֶל פִּילֶ֥גֶשׁ אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/007.yaml
  text: Saul had a concubine whose name was Rizpah daughter of Aiah. And Ish-bosheth said to Abner[a], “Why did you go in to my father’s concubine?”
translation:
  language: de
  text: 'Saul hatte eine Nebenfrau namens Rizpa, eine Tochter Ajas. Und Isch-Boschet sagte zu Abner: „Warum bist du zur Nebenfrau meines Vaters gegangen?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt hier: „Warum hattest du Geschlechtsverkehr mit der Nebenfrau meines Vaters?“ Das Hebräische sagt wörtlich „zu … gehen“, eine geläufige sexuelle Umschreibung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשָׁאוּל
  choice: Saul hatte
  rationale: Die possessiv-existenzielle Konstruktion mit ל wird im modernen Deutschen natürlich mit „hatte“ wiedergegeben. Das Präfix ו leitet hier Hintergrundinformation ein und verlangt kein ausdrücklich übersetztes „nun“.
- source_word: פִּלֶגֶשׁ / פִּילֶגֶשׁ
  choice: Nebenfrau
  rationale: „Nebenfrau“ bezeichnet die sozialrechtliche Stellung verständlich und würdig; „Konkubine“ wäre ebenfalls möglich, wirkt im heutigen Deutsch jedoch distanzierter und teilweise abwertend.
- source_word: וּשְׁמָהּ רִצְפָּה
  choice: namens Rizpa
  rationale: Die knappe deutsche Form gibt die identifizierende Wendung „und ihr Name war Rizpa“ natürlich wieder.
- source_word: בַת אַיָּה
  choice: eine Tochter Ajas
  rationale: Die Patronymangabe wird idiomatisch wiedergegeben. Die Namensform „Ajas“ kennzeichnet im Deutschen den Genitiv von „Aja“.
- source_word: וַיֹּאמֶר
  choice: Und Isch-Boschet sagte
  rationale: Im Hebräischen steht nur „und er sagte“; der aus dem vorherigen Vers eindeutige Sprecher wird zur Vermeidung eines unklaren deutschen Pronomens ausdrücklich genannt.
- source_word: מַדּוּעַ בָּאתָה אֶל
  choice: Warum bist du zu … gegangen?
  rationale: Die Wendung mit בוא und אֶל bewahrt wörtlich den im Hebräischen üblichen sexuellen Euphemismus, ohne ihn im Haupttext auszudeuten.
- source_word: פִּילֶגֶשׁ אָבִי
  choice: Nebenfrau meines Vaters
  rationale: Die hebräische Statusbezeichnung und die possessive Verbindung werden direkt und natürlich wiedergegeben.
theological_decisions:
- issue: Vorwurf sexueller Beziehungen und möglicher Thronanspruch
  choice: Der Haupttext bewahrt den sexuellen Euphemismus „zu … gegangen“.
  alternative: „mit der Nebenfrau meines Vaters geschlafen“ oder „Beziehungen mit ihr gehabt“
  rationale: Der Vers formuliert den Vorwurf euphemistisch. Da der Besitz der Nebenfrau eines verstorbenen Königs im Erzählkontext auch politische Bedeutung haben konnte, soll die Übersetzung weder die sexuelle Aussage verschleiern noch eine politische Deutung ausdrücklich in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nebenfrau“ ist für gewöhnliche Leser verständlicher als „Konkubine“. Der hebräische Euphemismus bleibt im Haupttext erhalten und wird in der Fußnote erklärt. Der Fußnotenmarker steht unmittelbar nach dem betreffenden Satz.
