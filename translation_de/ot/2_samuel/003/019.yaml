source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר גַּם אַבְנֵ֖ר בְּ/אָזְנֵ֣י בִנְיָמִ֑ין וַ/יֵּ֣לֶךְ גַּם אַבְנֵ֗ר לְ/דַבֵּ֞ר בְּ/אָזְנֵ֤י דָוִד֙ בְּ/חֶבְר֔וֹן אֵ֤ת כָּל אֲשֶׁר טוֹב֙ בְּ/עֵינֵ֣י יִשְׂרָאֵ֔ל וּ/בְ/עֵינֵ֖י כָּל בֵּ֥ית בִּנְיָמִֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/019.yaml
  text: Abner also spoke in the hearing of Benjamin[b][a], and Abner also went to speak in the hearing of David at Hebron all that seemed good in the eyes of Israel and in the eyes of the whole house of Benjamin.
translation:
  language: de
  text: Abner sprach auch zu Benjamin[a]. Und Abner ging auch nach Hebron, um David alles zu sagen, was Israel und das ganze Haus Benjamin für gut hielten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in den Ohren Benjamins«; gemeint ist, dass Abner zu den Angehörigen des Stammes Benjamin sprach.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »alles, was in den Augen Israels und in den Augen des ganzen Hauses Benjamin gut war«; auch möglich: »alles, was Israel und dem ganzen Haus Benjamin gefiel«.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאָזְנֵי
  choice: zu / mitteilen
  rationale: Die Wendung bedeutet wörtlich »in die Ohren von«, idiomatisch jedoch, zu jemandem zu sprechen beziehungsweise ihm etwas mitzuteilen. Im Deutschen ist die idiomatische Wiedergabe natürlicher.
- source_word: בִנְיָמִין
  choice: Benjamin
  rationale: Der Stammesname steht kollektiv für die Angehörigen des Stammes; die knappe Metonymie bleibt erhalten.
- source_word: לְדַבֵּר
  choice: um … mitzuteilen
  rationale: דבר bezeichnet hier das Sprechen zu David; »mitteilen« bindet den folgenden Inhalt natürlich an das Verb, ohne Verhandlung oder Überredung hineinzulesen.
- source_word: בְּחֶבְרוֹן
  choice: nach Hebron
  rationale: Im Zusammenhang mit וילך bezeichnet die Ortsangabe sinnvoll das Ziel von Abners Gang; dass David dort angesprochen wird, bleibt klar.
- source_word: אֵת כָּל אֲשֶׁר טוֹב בְּעֵינֵי
  choice: alles, was … für gut hielten
  rationale: Die hebräische Wendung »gut in den Augen von« bezeichnet das, was jemand für gut, richtig oder annehmbar hält. Die deutsche Form bewahrt den wertenden Sinn.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Volksname wird wie im Hebräischen kollektiv gebraucht.
- source_word: כָּל בֵּית בִּנְיָמִן
  choice: das ganze Haus Benjamin
  rationale: »Haus« bewahrt die verwandtschaftlich-politische Ausdrucksweise des Hebräischen und vermeidet eine unnötige Festlegung allein auf »Stamm«.
- source_word: גַּם ... גַּם
  choice: auch … auch
  rationale: Beide Vorkommen markieren Abners zusätzliche, zweifache Tätigkeit. Die Wiederholung wird im Deutschen beibehalten, auch wenn das zweite »auch« an eine natürlichere Satzposition tritt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Stammesbezeichnungen »Benjamin« und »Haus Benjamin« sowie die Wiederholung von »auch« erhalten die Struktur und den historischen Ton des Ausgangstextes; die hebräischen Körperteilidiome werden im Haupttext natürlich wiedergegeben und in den Fußnoten dokumentiert.
