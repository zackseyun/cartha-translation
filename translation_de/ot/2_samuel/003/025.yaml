  text: יָדַ֨עְתָּ֙ אֶת אַבְנֵ֣ר בֶּן נֵ֔ר כִּ֥י לְ/פַתֹּתְ/ךָ֖ בָּ֑א וְ/לָ/דַ֜עַת אֶת מוֹצָֽאֲ/ךָ֙ וְ/אֶת מבוא/ך וְ/לָ/דַ֕עַת אֵ֛ת כָּל אֲשֶׁ֥ר אַתָּ֖ה עֹשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/025.yaml
  text: You know Abner son of Ner[a], that he came to deceive you, and to learn your going out and your coming in[b], and to learn all that you are doing.
translation:
  language: de
  text: 'Du kennst doch Abner, den Sohn Ners: Er ist gekommen, um dich zu täuschen[a], um zu erfahren, wie du aus- und eingehst[b], und um alles zu erfahren, was du tust.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um dich zu verführen“ beziehungsweise „um dich zu überreden“. Das hebräische Verb kann verführen, verlocken, überreden oder täuschen bedeuten; der feindselige Zusammenhang spricht hier für „täuschen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dein Ausgehen und dein Eingehen“; eine Wendung für die Gesamtheit der Bewegungen oder Tätigkeiten eines Menschen.'
    reason: cultural_note
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Du kennst doch
  rationale: Das Qal-Perfekt bezeichnet hier einen gegenwärtigen Wissensstand; „doch“ gibt Joabs vorwurfsvollen Appell natürlich wieder, ohne eine zusätzliche Gewissheitsformel einzuführen.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abner, den Sohn Ners
  rationale: Der Personenname wird transliteriert; die Abstammungsangabe wird in natürlichem modernem Deutsch mit Genitiv wiedergegeben.
- source_word: כִּי
  choice: Er ist gekommen
  rationale: Der mit כי eingeleitete Inhalt dessen, was David nach Joabs Worten erkennen soll, lässt sich nach dem Ausruf im Deutschen am natürlichsten als selbstständiger Aussagesatz wiedergeben.
- source_word: לְפַתֹּתְךָ
  choice: um dich zu täuschen
  rationale: פתה kann verführen, überreden oder täuschen bedeuten. Im feindseligen politisch-militärischen Kontext ist „täuschen“ die naheliegende Wiedergabe; die Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: בָּא
  choice: ist gekommen
  rationale: Das Perfekt beschreibt Abners bereits erfolgte Ankunft; im Deutschen passt wegen des Gegenwartsbezugs das Perfekt gut zur direkten Rede.
- source_word: לָדַעַת
  choice: um zu erfahren
  rationale: Der Infinitiv bezeichnet den Zweck, Informationen zu gewinnen. „Erfahren“ ist hier idiomatischer als das statische „wissen“.
- source_word: מוֹצָאֲךָ וְאֶת מְבוֹאֶךָ
  choice: wann du aus- und eingehst
  rationale: Die konkrete Bildsprache des hebräischen Wortpaars bleibt erhalten, während die deutsche Nebensatzform die beabsichtigte Erkundung von Davids Bewegungen natürlich ausdrückt.
- source_word: כָּל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: alles, was du tust
  rationale: Dies gibt den umfassenden Sinn knapp und natürlich wieder; das Partizip bezeichnet Davids gegenwärtige beziehungsweise fortlaufende Tätigkeit.
theological_decisions: []
