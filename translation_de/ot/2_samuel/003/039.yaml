source:
  edition: WLC
  text: וְ/אָנֹכִ֨י הַ/יּ֥וֹם רַךְ֙ וּ/מָשׁ֣וּחַ מֶ֔לֶךְ וְ/הָ/אֲנָשִׁ֥ים הָ/אֵ֛לֶּה בְּנֵ֥י צְרוּיָ֖ה קָשִׁ֣ים מִמֶּ֑/נִּי יְשַׁלֵּ֧ם יְהוָ֛ה לְ/עֹשֵׂ֥ה הָ/רָעָ֖ה כְּ/רָעָתֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/039.yaml
  text: And I am still weak today[a], though anointed king; and these men, the sons of Zeruiah, are too harsh for me[b]. May Yahweh repay the evildoer according to his evil.
translation:
  language: de
  text: Ich aber bin heute noch schwach[a], obwohl ich zum König gesalbt bin; und diese Männer, die Söhne Zerujas, sind mir zu hart. Möge Jahwe dem, der Böses tut, entsprechend seiner Bosheit vergelten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich aber bin heute noch zart.“ Das hebräische Wort kann „zart“ oder „weich“ bedeuten, bezeichnet hier im Zusammenhang jedoch wahrscheinlich Schwäche.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jahwe wird dem, der Böses tut, entsprechend seiner Bosheit vergelten.“ Die hebräische Verbform kann auch als einfache Zukunftsaussage verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַךְ
  choice: schwach
  rationale: Das Adjektiv bedeutet wörtlich „zart/weich“, bezeichnet hier aber am ehesten Davids politische Schwäche beziehungsweise seine begrenzte Fähigkeit, gegen die Söhne Zerujas vorzugehen.
- source_word: וּמָשׁוּחַ מֶלֶךְ
  choice: obwohl ich zum König gesalbt bin
  rationale: 'Die verblosen, nebeneinandergestellten Aussagen bilden inhaltlich einen Gegensatz: David ist gesalbt und König, kann sich aber dennoch nicht durchsetzen.'
- source_word: בְּנֵי צְרוּיָה
  choice: die Söhne Zerujas
  rationale: Die feste Familienbezeichnung für Joab und seine Brüder wird in ihrer hebräischen Form und rhetorischen Wirkung bewahrt.
- source_word: קָשִׁים מִמֶּנִּי
  choice: sind mir zu hart
  rationale: Die Formulierung bewahrt sowohl die Härte dieser Männer als auch Davids Unvermögen, sie zu bändigen; „stärker als ich“ bleibt als mögliche Sinndeutung enthalten.
- source_word: יְשַׁלֵּם
  choice: Möge … vergelten
  rationale: Der Imperfekt kann hier als Wunsch beziehungsweise Verwünschung verstanden werden. David überlässt die Vergeltung Gott; die ebenfalls mögliche futurische Lesart wird in einer Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird im Deutschen als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְעֹשֵׂה הָרָעָה
  choice: dem, der Böses tut
  rationale: Die partizipiale Wendung wird natürlich und zugleich eng am Hebräischen wiedergegeben, ohne sie unnötig zu substantivieren.
- source_word: כְּרָעָתוֹ
  choice: entsprechend seiner Bosheit
  rationale: Die Wendung bezeichnet eine Vergeltung, die dem begangenen Bösen entspricht; „Bosheit“ bewahrt dabei den Bezug auf das moralisch Böse.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den Eigennamen Gottes. Die Transliteration bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Aussageweise des abschließenden Verbs יְשַׁלֵּם
  choice: 'Wunsch: „Möge Jahwe … vergelten“'
  alternative: 'Zukunftsaussage: „Jahwe wird … vergelten“'
  rationale: Im Zusammenhang distanziert sich David von der Bluttat und überlässt Gott die Vergeltung. Da die hebräische Verbform zugleich futurisch verstanden werden kann, wird diese Spannung in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt den Gegensatz zwischen Davids gesalbtem Königtum und seiner gegenwärtigen Schwäche. „Mir zu hart“ hält die semantische Spannung zwischen charakterlicher Härte und praktischer Überlegenheit offen.
