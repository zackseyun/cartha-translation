  text: וַ/יִּשְׁלַח֩ אַבְנֵ֨ר מַלְאָכִ֧ים אֶל דָּוִ֛ד תחת/ו לֵ/אמֹ֖ר לְ/מִי אָ֑רֶץ לֵ/אמֹ֗ר כָּרְתָ֤/ה בְרִֽיתְ/ךָ֙ אִתִּ֔/י וְ/הִנֵּה֙ יָדִ֣/י עִמָּ֔/ךְ לְ/הָסֵ֥ב אֵלֶ֖י/ךָ אֶת כָּל יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/012.yaml
  text: Then Abner sent messengers to David on his behalf[a], saying, “To whom does the land belong?” saying, “Make your covenant with me, and behold[b], my hand is with you to bring all Israel over to you.”
translation:
  language: de
  text: 'Abner sandte Boten zu David in seinem Namen[a] und ließ ihm sagen: »Wem gehört das Land? Schließ mit mir einen Bund! Sieh, meine Hand ist mit dir[b], um ganz Israel dir zuzuwenden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an seiner Stelle“; wörtlich etwa: „unter ihm“. Der knappe hebräische Ausdruck ist in diesem Zusammenhang nicht eindeutig.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „meine Hand ist mit dir“; die Hand steht hier für wirksame Unterstützung und Macht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תחתו
  choice: in seinem eigenen Namen
  rationale: Die knappe Wendung bezeichnet hier am ehesten Abners Handeln in eigener Vertretung. Die Formulierung ist im Deutschen natürlich, ohne die schwierige hebräische Lesart zu verschweigen.
- source_word: לְמִי אָרֶץ
  choice: Wem gehört das Land?
  rationale: Die direkte rhetorische Frage bewahrt die Kürze und politische Mehrdeutigkeit des Hebräischen; sie wird nicht zu einer ausdrücklichen Aussage über Abners oder Davids Herrschaftsanspruch erweitert.
- source_word: כָּרְתָה בְרִיתְךָ אִתִּי
  choice: Schließ einen Bund mit mir!
  rationale: כרת ברית ist die feste hebräische Wendung für das Schließen eines Bundes. Natürliches Deutsch verlangt hier weder das wörtliche »schneiden« noch das missverständliche »deinen Bund«.
- source_word: וְהִנֵּה יָדִי עִמָּךְ
  choice: Sieh, meine Hand ist auf deiner Seite
  rationale: Die Wiedergabe erhält das Bild der Hand als Ausdruck von Macht und Unterstützung und macht zugleich seine politische Stoßrichtung im Deutschen verständlich.
- source_word: לְהָסֵב אֵלֶיךָ
  choice: auf deine Seite zu bringen
  rationale: Das Verb bezeichnet hier das Herbeiführen eines Wechsels der politischen Zugehörigkeit beziehungsweise Loyalität.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Die übliche kollektive Bezeichnung meint Israel als politisches Ganzes.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im politischen Zusammenhang sind menschliche Überbringer beziehungsweise Gesandte gemeint.
theological_decisions:
- issue: Deutung der rhetorischen Frage לְמִי אָרֶץ
  choice: Als direkte Frage »Wem gehört das Land?« beibehalten.
  alternative: Als Behauptung »Das Land gehört mir« oder als erklärende Frage »Wer soll über das Land herrschen?« wiedergeben.
  rationale: Der hebräische Wortlaut ist knapp und elliptisch. Die direkte Frage bewahrt die Spannung zwischen Besitzanspruch, tatsächlicher Macht und rechtmäßiger Herrschaft, ohne Abners genaue Absicht festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Botenrede wird natürlich mit »ließ ihm sagen« eingeleitet; das doppelte לֵאמֹר wird nicht mechanisch wiederholt. Das Bild der Hand und die knappe Frage nach dem Land bleiben erhalten.
