base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/009.yaml
  text: May God do so to Abner[a], and more also, if, just as Yahweh has sworn to David, so I do for him—
translation:
  language: de
  text: Gott soll Abner dies und noch mehr antun, wenn ich für David nicht genau das tue[a], was Jahwe ihm geschworen hat—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »tun werde«. Das hebräische Imperfekt ist zukunftsgerichtet; im Deutschen kann nach »wenn« dafür auch das Präsens stehen.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים לְאַבְנֵר וְכֹה יֹסִיף לוֹ
  choice: Gott soll Abner dies und noch Schlimmeres antun
  rationale: Die geläufige hebräische Selbstverfluchungsformel wird in natürlichem Deutsch wiedergegeben. Abner nennt sich selbst in der dritten Person; וְכֹה יֹסִיף verstärkt die angedrohte Strafe, ohne sie näher zu bestimmen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Wort bezeichnet hier im Singular den Gott, der als Vollstrecker des Schwurs angerufen wird.
- source_word: לְאַבְנֵר
  choice: Abner
  rationale: Der Sprecher nennt in der Schwurformel seinen eigenen Namen und belegt damit sich selbst mit dem Fluch; diese auffällige dritte Person bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im modernen Deutschen geläufige Form.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לְדָוִד
  choice: was Jahwe ihm geschworen hat
  rationale: Die Formulierung gibt den Inhalt, an dem Abner sein Handeln ausrichten will, idiomatisch wieder. Das Pronomen »ihm« verweist eindeutig auf David.
- source_word: כִּי כֵן אֶעֱשֶׂה לוֹ
  choice: wenn ich für David nicht genau das tue
  rationale: Im Zusammenhang der Selbstverfluchung hat כִּי konditionalen Sinn. Das hebräische Imperfekt bezeichnet Abners verbindliche, zukunftsgerichtete Absicht; deutsches Präsens nach »wenn« ist dafür natürlich. Der Name David macht den Bezug von לוֹ transparent.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Abners Selbstverfluchung
  choice: Abner nennt sich selbst in der dritten Person
  alternative: Gott soll mir dies und noch Schlimmeres antun
  rationale: Die dritte Person entspricht ausdrücklich dem hebräischen Wortlaut und bewahrt die feierliche, formelhafte Gestalt des Schwurs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste Schwurformel wird verständlich und kräftig formuliert, Abners auffällige Selbstbezeichnung bleibt erhalten. Der Gedankenstrich zeigt an, dass der Satz im folgenden Vers weitergeführt wird.
