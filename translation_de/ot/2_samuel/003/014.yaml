  terminology: Isch-Boschet ist eine etablierte deutsche Namensform. »Vorhäute von Philistern« bewahrt die hebräische Formulierung. Die Fußnote sollte die Bedeutung des hebräischen Verbs als Verlobung genauer erklären, statt die unidiomatische Wendung »mir verlobte« als bloßes Wörtlicher anzubieten. Die Zusatzinformation »getöteter Philister« ist für die Verweisfußnote nicht erforderlich und geht über den Wortlaut des vorliegenden Verses hinaus.
