base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/014.yaml
  text: Then David sent messengers to Ish-bosheth son of Saul[a], saying, “Give me my wife Michal[b], whom I betrothed to myself for a hundred Philistine foreskins.”
translation:
  language: de
  text: 'Darauf sandte David Boten zu Isch-Boschet, dem Sohn Sauls, und ließ ihm sagen: »Gib mir meine Frau Michal, die ich mir für hundert Vorhäute von Philistern zur Braut nahm.[a][b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die ich mir für hundert Vorhäute von Philistern verlobt habe«. Das hebräische Verb bezeichnet das Eingehen einer Verlobung beziehungsweise das Nehmen zur Braut.'
    reason: lexical_alternative
  - marker: b
    text: 'Siehe 1. Samuel 18,25–27: Saul verlangte hundert Vorhäute von Philistern als Brautpreis für Michal.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Darauf sandte David
  rationale: Die narrative Verbform führt die Handlung zeitlich weiter. »Darauf« gibt diese Abfolge in natürlichem Deutsch wieder, ohne einen stärkeren Kausalzusammenhang zu behaupten.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im menschlichen Zusammenhang bezeichnet das Wort entsandte Überbringer einer Nachricht; »Boten« ist hier klarer und weniger amtlich als »Gesandte«.
- source_word: אֶל אִישׁ בֹּשֶׁת בֶּן שָׁאוּל
  choice: zu Isch-Boschet, dem Sohn Sauls
  rationale: Der Personenname wird in einer im Deutschen üblichen hebräischen Umschrift wiedergegeben; die Apposition folgt eng dem Ausgangstext.
- source_word: לֵאמֹר
  choice: und ließ ihm sagen
  rationale: Diese idiomatische deutsche Redeeinleitung macht deutlich, dass die Boten Davids Worte übermitteln.
- source_word: תְּנָה
  choice: Gib mir
  rationale: Der Imperativ ist eine unmittelbare Forderung. »Zurückgeben« wäre aus dem Zusammenhang verständlich, steht jedoch nicht ausdrücklich im hebräischen Text.
- source_word: אֶת אִשְׁתִּי אֶת מִיכַל
  choice: meine Frau Michal
  rationale: Die zweite Akkusativfügung benennt die zuvor als »meine Frau« bezeichnete Person; Deutsch gibt diese Apposition ohne Wiederholung wieder.
- source_word: אֲשֶׁר אֵרַשְׂתִּי לִי
  choice: die ich … als Braut gewann
  rationale: Das Verb bezeichnet das rechtswirksame Erlangen einer Frau durch Verlobung. Die Formulierung ist in modernem Deutsch verständlicher als das wörtliche, aber ungebräuchliche »die ich mir verlobte«; eine Fußnote bewahrt die nähere Form des Hebräischen.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: für hundert Vorhäute von Philistern
  rationale: »Für« bezeichnet hier den verlangten Brautpreis beziehungsweise die Leistung, durch die David Michal gewann. Die konkrete und drastische Bezeichnung wird nicht abgeschwächt.
theological_decisions:
- issue: Michals ehelicher Status und Davids Anspruch auf sie
  choice: David nennt Michal »meine Frau«, während der Relativsatz auf die frühere Verlobung und den dafür geleisteten Brautpreis verweist.
  alternative: Beide Aussagen durch eine allgemeinere Formulierung wie »die ich geheiratet habe« anzugleichen.
  rationale: Der hebräische Text verbindet ausdrücklich אִשְׁתִּי (»meine Frau«) mit אֵרַשְׂתִּי (Verlobung beziehungsweise rechtswirksames Gewinnen als Braut). Die Übersetzung bewahrt diese rechtlich-relationale Spannung, statt sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge und direkter Rede. Die drastische historische Angabe bleibt unverhüllt; eine leicht altertümliche, im heutigen Deutsch missverständliche transitive Verwendung von »verloben« wird im Haupttext vermieden und in der Fußnote dokumentiert.
