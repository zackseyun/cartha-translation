base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/015.yaml
  text: So Ish-bosheth sent and took her from her husband[b][a], from Paltiel the son of Laish.
translation:
  language: de
  text: Da sandte Isch-Boschet hin und nahm sie von ihrem Mann weg, von Paltiël, dem Sohn des Lajisch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von dem Mann, von Paltiël, dem Sohn des Lajisch“. Im Zusammenhang ist mit „dem Mann“ ihr Ehemann gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: schickte hin
  rationale: Das Verb שׁלח bezeichnet hier das Aussenden, ohne die ausgesandten Personen ausdrücklich zu nennen. „Schickte hin“ gibt die Handlung natürlich wieder, ohne „Boten“ oder eine Nachricht in den Text einzutragen.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isch-Boschet
  rationale: Der Personenname wird in einer im Deutschen etablierten, dem Hebräischen nahen Form wiedergegeben.
- source_word: וַיִּקָּחֶהָ
  choice: ließ sie holen
  rationale: 'Die Hifil-ähnliche deutsche Umschreibung ist wegen des vorausgehenden Aussendens idiomatisch: Isch-Boschet veranlasst, dass sie weggenommen beziehungsweise geholt wird. Das bewahrt den erzählerischen Sinn, ohne die stärkere Bedeutung „entreißen“ einzutragen.'
- source_word: מֵעִם אִישׁ
  choice: von ihrem Mann
  rationale: אִישׁ bedeutet wörtlich „Mann“; im Kontext bezeichnet es Michals Ehemann. Das Possessivpronomen macht diese relationale Bedeutung im Deutschen verständlich, während eine Fußnote den Wortlaut offenlegt.
- source_word: מֵעִם
  choice: von …, von
  rationale: Die Wiederholung der Trennungspräposition im Hebräischen wird beibehalten und identifiziert den zunächst bezeichneten Mann anschließend namentlich.
- source_word: פַּלְטִיאֵל
  choice: Paltiël
  rationale: Die Form folgt dem masoretischen Text dieses Verses und macht durch das Trema die getrennte Aussprache der Vokale sichtbar.
- source_word: בֶּן לוש
  choice: dem Sohn des Lajisch
  rationale: בֶּן bezeichnet die Abstammung. Der Eigenname wird in einer gebräuchlichen deutschen Transliteration wiedergegeben; die ungewöhnliche WLC-Schreibung לוש wird im Zusammenhang mit der überlieferten Namensform Lajisch verstanden.
theological_decisions:
- issue: Bezeichnung Paltiëls als Michals Ehemann
  choice: „ihrem Mann“ im Haupttext
  alternative: „dem Mann“
  rationale: Der unmittelbare Zusammenhang stellt Paltiël als den Mann dar, bei dem Michal lebt; zugleich macht die Fußnote transparent, dass das Hebräische nur „von dem Mann“ sagt. Damit wird die erzählerische Beziehung verständlich wiedergegeben, ohne Fragen zur rechtlichen oder theologischen Bewertung der konkurrierenden Eheansprüche zu entscheiden.
translation_notes:
  register: Moderne, würdige Erzählsprache. „Da“ führt die Handlung im fortlaufenden Bericht natürlich weiter. Die doppelte Fügung „von ihrem Mann …, von Paltiël“ bildet die erklärende Wiederholung des Hebräischen ab.
