source:
  edition: WLC
  text: וַ/יָּבֹ֨א אַבְנֵ֤ר אֶל דָּוִד֙ חֶבְר֔וֹן וְ/אִתּ֖/וֹ עֶשְׂרִ֣ים אֲנָשִׁ֑ים וַ/יַּ֨עַשׂ דָּוִ֧ד לְ/אַבְנֵ֛ר וְ/לַ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/020.yaml
  text: Abner came to David at Hebron[a], and twenty men were with him. And David made a feast for Abner and for the men who were with him.
translation:
  language: de
  text: Abner kam zu David nach Hebron, und zwanzig Männer waren bei ihm. David veranstaltete für Abner und für die Männer, die bei ihm waren, ein Festmahl.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »richtete ein Festmahl aus« oder wörtlicher: »machte ein Festmahl«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: בוא kann je nach Erzählperspektive »kommen«, »gehen« oder »eintreffen« bedeuten. Da David in Hebron als Zielpunkt im Blick steht, ist »kam« hier natürlich und sachgerecht.
- source_word: אֶל דָּוִד חֶבְרוֹן
  choice: zu David nach Hebron
  rationale: Vor »Hebron« steht im Hebräischen keine eigene Präposition. Im Zusammenhang bezeichnet der Ortsname das Ziel der Reise und Davids Aufenthaltsort; »zu David nach Hebron« gibt dies im Deutschen klar wieder.
- source_word: וְאִתּוֹ עֶשְׂרִים אֲנָשִׁים
  choice: und zwanzig Männer waren bei ihm
  rationale: Der hebräische Nominalsatz enthält kein ausdrückliches Verb; im Deutschen wird passend »waren« ergänzt. אֲנָשִׁים bezeichnet hier Abners männliche Begleiter.
- source_word: וַיַּעַשׂ ... מִשְׁתֶּה
  choice: veranstaltete ... ein Festmahl
  rationale: Die Verbindung von עשה mit מִשְׁתֶּה bedeutet, ein Festmahl zu bereiten oder auszurichten. »veranstaltete ... ein Festmahl« ist natürliches modernes Deutsch und bewahrt den gesellschaftlichen Charakter des Mahls.
- source_word: מִשְׁתֶּה
  choice: Festmahl
  rationale: מִשְׁתֶּה bezeichnet ein festliches Mahl oder Gelage, bei dem Trinken mitgedacht sein kann. »Festmahl« gibt den Sinn wieder, ohne den Trinkaspekt stärker hervorzuheben, als es der Vers selbst tut.
- source_word: לְאַבְנֵר וְלַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: für Abner und für die Männer, die bei ihm waren
  rationale: Die Wiederholung von לְ wird durch das zweimalige »für« abgebildet. Die ausdrückliche Relativkonstruktion bleibt erhalten, statt sie verkürzend mit »seinen Männern« wiederzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Satzstruktur bleibt weitgehend erkennbar, während »veranstaltete ein Festmahl« die Wendung עשה + משתה idiomatisch wiedergibt. Der Fußnotenmarker wurde sachlich beim Ausdruck »Festmahl« gesetzt, auf den sich die lexikalische Alternative bezieht.
