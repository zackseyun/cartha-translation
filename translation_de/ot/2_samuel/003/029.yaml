source:
  edition: WLC
  text: יָחֻ֨לוּ֙ עַל רֹ֣אשׁ יוֹאָ֔ב וְ/אֶ֖ל כָּל בֵּ֣ית אָבִ֑י/ו וְֽ/אַל יִכָּרֵ֣ת מִ/בֵּ֣ית יוֹאָ֡ב זָ֠ב וּ/מְצֹרָ֞ע וּ/מַחֲזִ֥יק בַּ/פֶּ֛לֶךְ וְ/נֹפֵ֥ל בַּ/חֶ֖רֶב וַ/חֲסַר לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/029.yaml
  text: May it fall on the head of Joab and on all his father’s house[a], and may there never be cut off from the house of Joab one who has a discharge, or is leprous, or holds a staff, or falls by the sword[b], or lacks bread.
translation:
  language: de
  text: Es komme über Joabs Haupt und über sein ganzes Vaterhaus! Im Haus Joabs soll niemals jemand fehlen, der an Ausfluss leidet oder aussätzig ist[a], eine Spindel hält[b], durch das Schwert fällt oder kein Brot hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: »an einer Hautkrankheit leidet«. Das hebräische Wort bezeichnet nicht ausschließlich die heute als Lepra bekannte Krankheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sich auf einen Stab stützt«. Die Bedeutung der hebräischen Wendung ist unsicher; traditionell wird hier auch an einen Stab oder eine Krücke gedacht.'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: יָחֻלוּ עַל רֹאשׁ
  choice: Es komme über … Haupt
  rationale: Die Wunschform und die Wendung mit »Haupt« drücken aus, dass die zuvor genannte Blutschuld beziehungsweise ihre Folgen Joab treffen sollen. Das deutsche Singularpronomen nimmt diesen sinngemäß vorausgesetzten Bezug auf.
- source_word: כָּל בֵּית אָבִיו
  choice: sein ganzes Vaterhaus
  rationale: »Vaterhaus« bewahrt den Sinn der väterlichen Großfamilie beziehungsweise Sippe und den feierlich-ernsten Ton der Fluchformel.
- source_word: אַל יִכָּרֵת מִבֵּית יוֹאָב
  choice: im Haus Joabs soll es niemals an einem fehlen
  rationale: Die verneinte Form von כרת besagt hier, dass Menschen mit den aufgezählten Leiden in Joabs Haus nie aufhören beziehungsweise fehlen sollen. Diese idiomatische Wiedergabe macht den Sinn der hebräischen Fluchformel klar.
- source_word: זָב
  choice: der an Ausfluss leidet
  rationale: Gemeint ist ein krankhafter körperlicher Ausfluss, der zugleich kultische Unreinheit mit sich bringen konnte. Die Formulierung ist modern und vermeidet eine unnötige medizinische Präzisierung.
- source_word: מְצֹרָע
  choice: aussätzig ist
  rationale: Die traditionelle Wiedergabe ist knapp und im biblischen Zusammenhang verständlich; eine Fußnote weist darauf hin, dass der hebräische Ausdruck ein breiteres Spektrum schwerer Hautveränderungen bezeichnet als die moderne Lepra.
- source_word: מַחֲזִיק בַּפֶּלֶךְ
  choice: der eine Spindel hält
  rationale: פֶּלֶךְ bezeichnet am unmittelbarsten eine Spindel beziehungsweise ein Spinngerät. Das konkrete, schwer deutbare Bild bleibt erhalten, während die bekannte Deutung als Stab oder Krücke in einer Fußnote genannt wird.
- source_word: נֹפֵל בַּחֶרֶב
  choice: durch das Schwert fällt
  rationale: Bewahrt die hebräische Todesmetapher und den feierlichen Rhythmus der Aufzählung.
- source_word: חֲסַר לָחֶם
  choice: kein Brot hat
  rationale: Die Wiedergabe erhält das konkrete Bild des Brotmangels, das allgemein für fehlenden Lebensunterhalt stehen kann.
theological_decisions:
- issue: Art von Davids Aussage
  choice: Ein Fluch beziehungsweise Strafwunsch gegen Joab und sein Vaterhaus
  alternative: Eine bloße Vorhersage künftiger Ereignisse
  rationale: Die volitiven Verbformen werden am besten als Wunsch nach Vergeltung und nicht als neutrale Zukunftsaussage wiedergegeben.
- issue: Bezug des unausgesprochenen Subjekts in יָחֻלוּ
  choice: Die zuvor genannte Blutschuld beziehungsweise ihre Folgen sollen Joab und sein Haus treffen
  alternative: Ein unbestimmtes, ausdrücklich nicht näher benanntes Unheil soll sie treffen
  rationale: Die Wendung »über das Haupt kommen« verweist im Zusammenhang auf die Verantwortung für Abners Blut. Die Übersetzung lässt offen, ob dabei primär die Schuld oder die daraus folgende Strafe im Blick steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dem bewusst beibehaltenen biblischen Ausdruck »Vaterhaus«. Die Fluchformel wird idiomatisch, aber in ihrer Härte unverhüllt wiedergegeben. Die parallele Aufzählung bleibt erhalten; genuine Unsicherheiten bei מְצֹרָע und מַחֲזִיק בַּפֶּלֶךְ werden durch Fußnoten kenntlich gemacht.
