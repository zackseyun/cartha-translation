  text: יָדֶ֣/ךָ לֹֽא אֲסֻר֗וֹת וְ/רַגְלֶ֨י/ךָ֙ לֹא לִ/נְחֻשְׁתַּ֣יִם הֻגָּ֔שׁוּ כִּ/נְפ֛וֹל לִ/פְנֵ֥י בְנֵֽי עַוְלָ֖ה נָפָ֑לְתָּ וַ/יֹּסִ֥פוּ כָל הָ/עָ֖ם לִ/בְכּ֥וֹת עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/034.yaml
  text: Your hands were not bound[a], and your feet were not put into bronze fetters; as one falls before sons of injustice, so you have fallen. And all the people wept over him even more.
translation:
  language: de
  text: 'Deine Hände waren nicht gebunden,

    und deine Füße nicht in bronzene Fesseln gelegt.

    Wie man vor Übeltätern fällt,

    so bist du gefallen.

    Da weinte das ganze Volk noch mehr um ihn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדֶךָ לֹא אֲסֻרוֹת
  choice: Deine Hände waren nicht gebunden
  rationale: Die passive Form von אָסַר bezeichnet das Gebundensein. „Gebunden“ ist im Deutschen natürlich und bewahrt den Kontrast zu einem gefesselten Gefangenen.
- source_word: וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ
  choice: und deine Füße nicht in bronzene Fesseln gelegt
  rationale: נְחֻשְׁתַּיִם bezeichnet paarige Fesseln aus Bronze bzw. Kupfer. Die Formulierung erhält sowohl das Material als auch den Bezug auf die Füße; das im zweiten Versglied elliptische „waren“ wird aus dem ersten ergänzt.
- source_word: כִּנְפוֹל
  choice: Wie man … fällt
  rationale: Der Infinitiv mit כְּ leitet einen Vergleich ein. Das unpersönliche „man“ gibt die allgemeine Aussage im modernen Deutschen idiomatisch wieder.
- source_word: לִפְנֵי בְנֵי עַוְלָה
  choice: vor Übeltätern
  rationale: Wörtlich steht „vor Söhnen des Unrechts“. Das ist eine hebräische Personenbezeichnung für Menschen, die Unrecht tun; „Übeltäter“ überträgt den idiomatischen Sinn knapp und würdig.
- source_word: נָפָלְתָּ
  choice: so bist du gefallen
  rationale: Das Perfekt bezeichnet den vollendeten tragischen Ausgang. Das deutsche Perfekt passt zur direkten Klagerede und erhält die Wiederholung von „fallen“.
- source_word: וַיֹּסִפוּ כָל הָעָם לִבְכּוֹת עָלָיו
  choice: Da weinte das ganze Volk noch mehr um ihn
  rationale: יָסַף mit Infinitiv kann Fortsetzung oder Steigerung ausdrücken. Im Zusammenhang mit Davids Klage liegt eine Intensivierung des Weinens nahe; „noch mehr“ bewahrt diese Nuance.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache in poetischen Zeilen. Die hebräische Anrede an den Verstorbenen bleibt erhalten. Der idiomatische Ausdruck „Söhne des Unrechts“ wird im Haupttext verständlich als „Übeltäter“ wiedergegeben; keine konfessionelle Auslegung wird hinzugefügt.
