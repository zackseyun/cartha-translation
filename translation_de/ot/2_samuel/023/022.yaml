  edition: WLC
  text: אֵ֣לֶּה עָשָׂ֔ה בְּנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וְ/ל/וֹ שֵׁ֖ם בִּ/שְׁלֹשָׁ֥ה הַ/גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/022.yaml
  text: These things Benaiah son of Jehoiada did[b][a], and he had a name among the three mighty men.
translation:
  language: de
  text: Dies tat Benaja, der Sohn Jojadas, und er war unter den drei Helden angesehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und er hatte einen Namen unter den drei Helden“. Einige Ausleger ziehen aufgrund des größeren Verzeichnisses von Davids Kriegern und vergleichbarer Lesarten „die Dreißig“ in Betracht; der hebräische Text lautet hier „die drei“.'
    reason: Die Fußnote bewahrt sowohl das hebräische Idiom als auch die textkritisch beziehungsweise kontextuell erwogene Alternative, ohne die überlieferte Lesart im Haupttext zu ersetzen.
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Dies tat
  rationale: Das Demonstrativpronomen weist zusammenfassend auf die unmittelbar zuvor erzählten Taten zurück; „Dies tat“ ist im Deutschen knapp und natürlich.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaja, der Sohn Jojadas
  rationale: Die Eigennamen werden in ihrer geläufigen deutschen Bibelform wiedergegeben; das hebräische Konstrukt bezeichnet das Sohnverhältnis.
- source_word: וְלוֹ שֵׁם
  choice: und er war … angesehen
  rationale: Die wörtliche Wendung „und ihm war ein Name“ bezeichnet Ansehen oder Ruhm. Die idiomatische Wiedergabe vermittelt diesen Sinn in klarem modernem Deutsch; die wörtlichere Form steht in der Fußnote.
- source_word: בִּשְׁלֹשָׁה הַגִּבֹּרִים
  choice: unter den drei Helden
  rationale: Der masoretische Text liest ausdrücklich „drei“. גִּבּוֹרִים bezeichnet hier die herausragenden Krieger aus Davids Gefolgschaft; „Helden“ ist würdig, knapp und kontextgerecht.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die idiomatische Haupttextfassung vermeidet die im Deutschen missverständliche Formulierung „hatte einen Namen“, während die Fußnote die formale Gestalt und die Lesart „drei“ transparent macht.
