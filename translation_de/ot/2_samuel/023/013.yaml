  text: וַ/יֵּרְד֨וּ שלשים מֵ/הַ/שְּׁלֹשִׁ֣ים רֹ֗אשׁ וַ/יָּבֹ֤אוּ אֶל קָצִיר֙ אֶל דָּוִ֔ד אֶל מְעָרַ֖ת עֲדֻלָּ֑ם וְ/חַיַּ֣ת פְּלִשְׁתִּ֔ים חֹנָ֖ה בְּ/עֵ֥מֶק רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/013.yaml
  text: Then thirty of the thirty chief men went down and came at harvest time to David[a], to the cave of Adullam[c][b], while a band of the Philistines was camped in the Valley of Rephaim.
translation:
  language: de
  text: Da stiegen dreißig Anführer von den Dreißig[a] hinab und kamen zur Erntezeit zu David in die Höhle von Adullam; eine Schar der Philister[b] lagerte im Tal Refaïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist schwierig: „dreißig von den Dreißig, Anführer“. Gemeint sein können dreißig führende Männer oder, genauer, Angehörige der als „die Dreißig“ bekannten Elitetruppe Davids.'
    reason: alternative_reading
  - marker: b
    text: Hebräisch חַיַּת פְּלִשְׁתִּים, wörtlich etwa „Lebewesen/Tier der Philister“; hier offenbar eine idiomatische Bezeichnung für einen militärischen Trupp.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: stiegen … hinab
  rationale: Gibt die gewöhnliche Richtungsbedeutung von ירד wieder und klingt im deutschen Erzählstil natürlich.
- source_word: שלשים מֵהַשְּׁלֹשִׁים רֹאשׁ
  choice: dreißig von den Dreißig, die Anführer
  rationale: Die ungewöhnliche und gedrängte hebräische Formulierung wird möglichst sichtbar bewahrt. „Die Dreißig“ bezeichnet im Zusammenhang Davids Elitetruppe; רֹאשׁ kennzeichnet die Genannten als führend, ohne die syntaktische Schwierigkeit zu verdecken.
- source_word: וַיָּבֹאוּ
  choice: kamen
  rationale: Die wiederholte Zielangabe mit אֶל wird in natürlichem Deutsch durch „kamen … zu“ ausgedrückt.
- source_word: אֶל קָצִיר
  choice: zur Erntezeit
  rationale: Die wörtlich richtungsartige Wendung „zur Ernte“ ist hier am ehesten temporal zu verstehen.
- source_word: אֶל דָּוִד
  choice: zu David
  rationale: Direkte Wiedergabe der Zielangabe, ohne ein im Hebräischen nicht ausdrücklich genanntes Verb wie „aufsuchen“ oder „treffen“ hinzuzufügen.
- source_word: אֶל מְעָרַת עֲדֻלָּם
  choice: in die Höhle von Adullam
  rationale: Gibt die Zielrichtung zur Höhle sowie die hebräische Konstruktverbindung verständlich wieder.
- source_word: חַיַּת פְּלִשְׁתִּים
  choice: eine Schar der Philister
  rationale: חַיָּה bedeutet gewöhnlich „Lebewesen/Tier“, bezeichnet hier aber idiomatisch einen militärischen Trupp. „Schar“ passt zum Kontext und vermeidet eine irreführende Wörtlichkeit.
- source_word: חֹנָה
  choice: lagerte
  rationale: Das Partizip von חנה schildert den andauernden Hintergrundzustand des Lagernden.
- source_word: בְּעֵמֶק רְפָאִים
  choice: im Tal Refaïm
  rationale: Der Ortsname wird transliteriert; die Trema-Schreibung macht die getrennte Aussprache der Vokale deutlich.
