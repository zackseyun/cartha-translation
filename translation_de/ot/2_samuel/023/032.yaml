  text: Elyahba the Shaalbonite[a], the sons of Jashen, Jonathan.
translation:
  language: de
  text: Eljachba, der Schaalboniter[a], die Söhne Jaschens, Jonatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist hier knapp und schwer verständlich; wörtlich lautet er: »Eljachba, der Schaalboniter, die Söhne Jaschens, Jonatan.« Manche Ausleger nehmen eine Unregelmäßigkeit im Text an und ordnen die Liste anders, etwa indem sie Jonatan als einen der »Söhne Jaschens« verstehen. Diese Übersetzung bewahrt den überlieferten hebräischen Wortlaut, statt ihn durch eine Textänderung zu glätten.'
    reason: textual_variant
lexical_decisions:
- source_word: אֶלְיַחְבָּא
  choice: Eljachba
  rationale: Der Personenname wird nach dem Hebräischen transliteriert und nicht übersetzt.
- source_word: הַשַּׁעַלְבֹנִי
  choice: der Schaalboniter
  rationale: Das mit Artikel versehene Gentiliz bezeichnet einen Mann aus Schaalbon beziehungsweise Schaalbim; die deutsche Herkunftsbezeichnung bewahrt den Ortsnamenbezug.
- source_word: בְּנֵי
  choice: die Söhne
  rationale: Die Form ist eindeutig der konstruktgebundene Plural von »Sohn«. Trotz der schwierigen Verbindung mit dem folgenden Singular »Jonatan« wird die überlieferte Mehrzahl nicht geglättet.
- source_word: יָשֵׁן
  choice: Jaschen
  rationale: Das Wort wird im Konstruktgefüge »die Söhne Jaschens« als Personenname verstanden und ohne Texteingriff transliteriert.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Für den Personennamen wird die im modernen Deutschen übliche biblische Namensform verwendet.
