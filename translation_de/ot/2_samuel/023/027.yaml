  text: Abiëser aus Anatot[a], Mebunnai aus Huscha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen im Hebräischen Einwohner- beziehungsweise Zugehörigkeitsbezeichnungen: »der Anatotiter« und »der Huschaiter«.'
