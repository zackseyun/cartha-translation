lexical_decisions:
- source_word: אֲבִיעֶזֶר
  choice: Abiëser
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transliteriert; das Trema macht die getrennte Aussprache der Vokale deutlich.
- source_word: הָעַנְּתֹתִי
  choice: aus Anatot
  rationale: Das hebräische Gentiliz bezeichnet Herkunft oder Zugehörigkeit zu Anatot. Im heutigen Deutsch ist die Herkunftsangabe natürlicher und verständlicher als eine künstliche Einwohnerbezeichnung.
- source_word: מְבֻנַּי
  choice: Mebunnai
  rationale: Der Personenname wird transliteriert und nicht übersetzt.
- source_word: הַחֻשָׁתִי
  choice: aus Huscha
  rationale: Das hebräische Gentiliz bezeichnet Herkunft oder Zugehörigkeit zu Huscha. Die parallele Wiedergabe mit »aus« bewahrt die Struktur des Verses in natürlichem Deutsch.
theological_decisions: []
