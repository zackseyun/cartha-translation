source:
  edition: WLC
  text: וּ/בְלִיַּ֕עַל כְּ/ק֥וֹץ מֻנָ֖ד כֻּלָּ֑/הַם כִּֽי לֹ֥א בְ/יָ֖ד יִקָּֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/006.yaml
  text: But worthless men are all like thorns cast aside[a], for they cannot be taken with the hand.
translation:
  language: de
  text: Doch die Nichtswürdigen sind allesamt wie weggeworfene Dornen[a]; denn man kann sie nicht mit der Hand anfassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort belijjaʿal meint hier wahrscheinlich nichtswürdige oder böse Menschen, nicht den späteren Eigennamen »Belial«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלִיַּעַל
  choice: Doch die Nichtswürdigen
  rationale: בְּלִיַּעַל bezeichnet hier nicht den später personifizierten Eigennamen Belial, sondern nichtswürdige bzw. böse Menschen. Der substantivierte Plural macht den Personenbezug im Deutschen deutlich.
- source_word: כְּקוֹץ
  choice: wie … Dornen
  rationale: Das formal singularische קוֹץ kann kollektiv verstanden werden. Der deutsche Plural passt natürlich zum pluralischen Bezugswort und bewahrt das Bild.
- source_word: מֻנָד
  choice: weggeworfene
  rationale: Das passive Partizip bezeichnet etwas Weggestoßenes oder Beiseitegeworfenes. »Weggeworfen« passt zum Dornenbild, ohne die Aussage unnötig auszudeuten.
- source_word: כֻּלָּהַם
  choice: allesamt
  rationale: »Allesamt« gibt die umfassende Aussage prägnant wieder und wahrt den gehobenen, aber verständlichen Ton.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für den Dornenvergleich ein.
- source_word: לֹא בְיָד יִקָּחוּ
  choice: mit der Hand fasst man sie nicht an
  rationale: Die unpersönliche deutsche Form gibt wieder, dass solche Dornen nicht unmittelbar mit der Hand ergriffen werden. Sie bleibt näher an der Aussageform als eine ausdrücklich modale Wiedergabe mit »kann«.
theological_decisions:
- issue: Person oder Eigenschaft bei בְּלִיַּעַל
  choice: Bezeichnung nichtswürdiger Menschen
  alternative: Eigenname »Belial«
  rationale: Im alttestamentlichen Kontext ist das Wort hier als Charakterisierung von Menschen zu verstehen; eine Wiedergabe als Eigenname würde eine spätere Personifizierung in den Text eintragen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, bildhaftem Ton. »Nichtswürdige« und »allesamt« sind leicht gehoben, aber allgemein verständlich; die parallele Satzstruktur des hebräischen Verses bleibt erkennbar.
