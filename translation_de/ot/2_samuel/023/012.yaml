source:
  edition: WLC
  text: וַ/יִּתְיַצֵּ֤ב בְּ/תוֹךְ הַֽ/חֶלְקָה֙ וַ/יַּצִּילֶ֔/הָ וַ/יַּ֖ךְ אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֥עַשׂ יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/012.yaml
  text: But he took his stand in the middle of the field and defended it[a], and struck down the Philistines; and Yahweh brought about a great victory.
translation:
  language: de
  text: Er aber stellte sich inmitten des Feldstücks auf, verteidigte es und schlug die Philister nieder. So bewirkte Jahwe einen großen Sieg[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine große Rettung“ beziehungsweise „eine große Befreiung“. Das hebräische Wort kann all diese Bedeutungen tragen; hier bezeichnet es Jahwes rettendes Eingreifen im Kampf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצֵּב
  choice: stellte sich
  rationale: Der Hitpael von יצב bezeichnet hier das bewusste Einnehmen und Behaupten einer Stellung. „Stellte sich“ gibt die reflexive Form natürlich wieder; der Kampfzusammenhang macht das standhafte Antreten deutlich.
- source_word: בְּתוֹךְ הַחֶלְקָה
  choice: mitten auf das Feld
  rationale: חֶלְקָה bezeichnet ein abgegrenztes Stück Land oder Feld. „Mitten auf das Feld“ ist im deutschen Erzählstil klar und gibt בְּתוֹךְ idiomatisch wieder.
- source_word: וַיַּצִּילֶהָ
  choice: verteidigte es
  rationale: נצל bedeutet retten oder entreißen. Da sich das feminine Suffix auf חֶלְקָה, das Feldstück, bezieht, beschreibt „verteidigte es“ im militärischen Zusammenhang natürlich dessen Rettung vor der Einnahme.
- source_word: וַיַּךְ אֶת־פְּלִשְׁתִּים
  choice: schlug die Philister nieder
  rationale: נכה bezeichnet im Kampf häufig das Niederschlagen oder Besiegen. Die Wiedergabe bewahrt die Kraft des hebräischen Ausdrucks.
- source_word: וַיַּעַשׂ יְהוָה
  choice: So bewirkte Jahwe
  rationale: עשה mit dem abstrakten Objekt תְּשׁוּעָה bedeutet hier, dass Jahwe den Ausgang herbeiführte. „Bewirkte“ erhält die ausdrückliche göttliche Urheberschaft.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass im Deutschen ein persönlicher Name und nicht ersatzweise ein Titel steht.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: einen großen Sieg
  rationale: תְּשׁוּעָה kann Rettung, Befreiung oder Sieg bezeichnen. Im unmittelbaren Kampfzusammenhang vermittelt „Sieg“ den konkreten Sinn am klarsten; die weitere Bedeutungsbreite wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als Gottes persönlichen Namen. Die Transliteration „Jahwe“ wahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Bedeutung von תְּשׁוּעָה im Kampfzusammenhang
  choice: Sieg
  alternative: Rettung oder Befreiung
  rationale: „Sieg“ passt am unmittelbarsten zur militärischen Szene, während die Formulierung mit Jahwe als Handelndem zugleich festhält, dass der Sieg seine rettende Tat ist. Die semantische und theologische Weite des Wortes bleibt in der Fußnote sichtbar.
- issue: Verhältnis zwischen menschlichem Kampf und göttlichem Handeln
  choice: Samma verteidigt und kämpft; Jahwe bewirkt den Sieg
  alternative: Die menschliche Leistung allein entscheidet den Kampf
  rationale: 'Die beiden Aussagen des hebräischen Textes werden nebeneinandergestellt, ohne ihre Spannung aufzulösen: Der Kämpfer handelt tatsächlich, doch der große Sieg wird ausdrücklich Jahwe zugeschrieben.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Er aber“ nimmt den leicht kontrastierenden Anschluss des hebräischen וַ auf. Die Satzfolge bleibt knapp und handlungsbetont; die Fußnote steht unmittelbar bei dem mehrdeutigen Ausdruck „Sieg“.
