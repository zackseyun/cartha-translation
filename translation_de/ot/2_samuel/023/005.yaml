  source_fidelity: Die Verneinung in לֹא כֵן wird zu Recht im Haupttext beibehalten, während die gut begründete positive rhetorische Deutung in einer Fußnote erscheint. Auch die rhetorische Wiedergabe der schwierigen Schlussklausel bewahrt die Verneinung und lässt den nicht ausgedrückten Bezug von יַצְמִיחַ offen. Die bisherige Formulierung „steht mein Haus zu Gott“ ist jedoch keine natürliche Wiedergabe der Beziehungsaussage עִם אֵל und legt zudem eine Haltung beziehungsweise ein Verhalten des Hauses nahe.
  naturalness: „Mein Haus ist bei Gott nicht so“ ist modernes, verständliches Standarddeutsch und erhält die absichtlich schwierige, nicht näher erklärte Vergleichsaussage. Die Umstellung zu „Ja, ...“ gibt dem zweiten כִּי angemessen einen bekräftigenden Anschluss, ohne den textlichen Spannungsbogen durch ein stärker kontrastierendes „Doch“ zu interpretieren.
  terminology: „Haus“, „ewiger Bund“, „Heil“ und „Verlangen“ sind treffend und registergerecht. „Aufsprießen lassen“ bewahrt den kausativen Bildbereich von צמח; das Pronomen „es“ soll angesichts der elliptischen hebräischen Syntax weiterhin nicht präzisiert werden.
