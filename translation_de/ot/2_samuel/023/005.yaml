  text: כִּֽי לֹא כֵ֥ן בֵּיתִ֖/י עִם אֵ֑ל כִּי֩ בְרִ֨ית עוֹלָ֜ם שָׂ֣ם לִ֗/י עֲרוּכָ֤ה בַ/כֹּל֙ וּ/שְׁמֻרָ֔ה כִּֽי כָל יִשְׁעִ֥/י וְ/כָל חֵ֖פֶץ כִּֽי לֹ֥א יַצְמִֽיחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/005.yaml
  text: For my house is not so with God[a]; yet he has made with me an everlasting covenant, ordered in every way and kept secure[b]. For this is all my salvation and all my desire—will he not indeed make it grow?
translation:
  language: de
  text: Denn mein Haus ist bei Gott nicht so[a]. Ja, einen ewigen Bund hat er mit mir geschlossen, in allem geordnet und bewahrt. Denn all mein Heil und all mein Verlangen – wird er es nicht aufsprießen lassen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als positive rhetorische Frage: „Ist mein Haus nicht so bei Gott?“ Viele verstehen den schwierigen Anfang in diesem Sinn.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Ja, er wird es gewiss aufsprießen lassen.“ Die knappe hebräische Schlussklausel kann als rhetorische Frage oder als nachdrückliche Versicherung verstanden werden; auch der genaue Bezug von „es“ bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: denn
  rationale: Am Versanfang verbindet die Partikel Davids Aussage begründend mit dem vorausgehenden Gottesspruch; in der letzten Zeile leitet sie erneut eine Begründung ein.
- source_word: לֹא כֵן בֵּיתִי עִם אֵל
  choice: nicht so steht mein Haus zu Gott
  rationale: Die Wiedergabe erhält die im masoretischen Text stehende Verneinung, den relationalen Sinn von עִם und die schwer aufzulösende Spannung zum folgenden Bundeswort.
- source_word: בֵּיתִי
  choice: mein Haus
  rationale: „Haus“ bewahrt sowohl den konkreten Sinn von Familie und Hausgemeinschaft als auch den in diesem Zusammenhang wichtigen dynastischen Sinn.
- source_word: בְרִית עוֹלָם
  choice: einen ewigen Bund
  rationale: Die geläufige deutsche Bundesformel gibt die auf unabsehbare Dauer zielende Bedeutung von עוֹלָם angemessen wieder.
- source_word: שָׂם לִי
  choice: hat mit mir … geschlossen
  rationale: Das wörtliche „für mich gesetzt“ bezeichnet hier idiomatisch die Begründung eines Bundes; „einen Bund schließen“ ist dafür natürliches Deutsch.
- source_word: עֲרוּכָה בַכֹּל
  choice: in allem wohlgeordnet
  rationale: Die Formulierung bewahrt sowohl den Zustand des Geordnetseins als auch den umfassenden Sinn von בַכֹּל.
- source_word: וּשְׁמֻרָה
  choice: und bewahrt
  rationale: Das passive Partizip beschreibt den Bund als geschützt beziehungsweise sicher erhalten, ohne ausdrücklich einen im Satz nicht genannten Handelnden einzufügen.
- source_word: כָל יִשְׁעִי
  choice: all mein Heil
  rationale: „Heil“ umfasst Rettung und Wohlergehen und passt zum gehobenen, aber verständlichen Register des Ausspruchs.
- source_word: וְכָל חֵפֶץ
  choice: und all mein Verlangen
  rationale: חֵפֶץ kann Wunsch, Gefallen oder Verlangen bezeichnen; „Verlangen“ lässt den genauen Gegenstand offen und bildet eine natürliche Parallele zu „Heil“.
- source_word: כִּי לֹא יַצְמִיחַ
  choice: wird er es nicht aufsprießen lassen?
  rationale: Die rhetorische Frage wahrt das לֹא und gibt den kausativen Pflanzenwuchs von צמח anschaulich wieder. Das Pronomen „es“ lässt den Bezug auf Heil, Verlangen oder die Bundesverheißung bewusst offen.
theological_decisions:
- issue: Sinn der Anfangsklausel כִּי לֹא כֵן בֵּיתִי עִם אֵל
  choice: 'Als verneinte Aussage: „Denn nicht so steht mein Haus zu Gott.“'
  alternative: 'Als positive rhetorische Frage: „Steht mein Haus nicht so zu Gott?“'
  rationale: Die masoretische Punktierung bietet eine Verneinung. Obwohl die rhetorische Deutung den Anschluss an die Bundeszusage glättet, soll die schwierige Spannung des hebräischen Textes im Haupttext nicht stillschweigend beseitigt werden; die wichtige Alternative steht in der Fußnote.
- issue: Aussage und Bezug von יַצְמִיחַ
  choice: Als positive rhetorische Frage, in der Gott das nicht ausdrücklich bestimmte „es“ aufsprießen lässt.
  alternative: Als negative Feststellung („denn er lässt es nicht aufsprießen“) oder als starke positive Versicherung („ja, er wird es gewiss aufsprießen lassen“).
  rationale: Die knappe Syntax lässt mehrere Deutungen zu. Die rhetorische Frage erhält die hebräische Verneinung und passt zugleich zur bekräftigenden Bundesrede. Der Gegenstand des Verbs wird nicht dogmatisch auf eine einzelne Verheißung festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mein Haus“ und „Heil“ bewahren den biblisch-bündischen Klang, bleiben aber allgemein verständlich. Die ungewöhnliche Anfangsformulierung ist bewusst textnah, weil eine glattere Formulierung die echte Mehrdeutigkeit vorentscheiden würde.
