base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/017.yaml
  text: And he said[a], “Far be it from me, O Yahweh, that I should do this! Is it not the blood of the men who went at the risk of their lives?” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: de
  text: 'Und er sagte: »Fern sei es von mir, Yahweh, so etwas zu tun! Ist das nicht das Blut der Männer, die ihr Leben aufs Spiel gesetzt haben?«[a] Und er wollte es nicht trinken. Das taten die drei Helden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »... der Männer, die mit ihrem Leben gingen.« Gemeint ist: die unter Einsatz ihres Lebens gingen, also sich in Lebensgefahr begaben. David behandelt das Wasser wie ihr Blut, weil sie es unter Lebensgefahr beschafft hatten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי יְהוָה
  choice: Fern sei es von mir, Yahweh
  rationale: Die idiomatische Wendung drückt entschiedene Abscheu und Ablehnung aus; יְהוָה wird als Anrede verstanden und mit dem Gottesnamen wiedergegeben.
- source_word: מֵעֲשֹׂתִי זֹאת
  choice: so etwas zu tun
  rationale: Die Infinitivkonstruktion bezeichnet die von David entschieden verworfene Handlung und wird in natürlichem Deutsch wiedergegeben.
- source_word: הֲדַם הָאֲנָשִׁים
  choice: Sollte ich das Blut der Männer trinken
  rationale: Das interrogative הֲ leitet eine rhetorische Frage ein. Das Verb „trinken“ wird aus dem Zusammenhang ergänzt, um den elliptischen hebräischen Satz im Deutschen verständlich zu machen.
- source_word: הַהֹלְכִים בְּנַפְשׁוֹתָם
  choice: die ihr Leben aufs Spiel gesetzt haben
  rationale: Wörtlich etwa „die mit ihrem Leben gingen“; die Wendung bezeichnet eine Unternehmung unter Lebensgefahr.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Und er wollte es nicht trinken
  rationale: אָבָה bezeichnet Wollen oder Einwilligen. Das Suffix bezieht sich sinngemäß auf das Wasser und wird daher im Deutschen singularisch wiedergegeben.
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: Das taten die drei Helden
  rationale: אֵלֶּה verweist zusammenfassend auf die geschilderte Tat; גִּבֹּרִים bezeichnet hier Davids herausragende Krieger, wofür „Helden“ im Kontext knapp und natürlich ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; die Transliteration bewahrt den persönlichen Gottesnamen statt ihn durch einen Titel zu ersetzen.
- issue: Deutung des Wassers als Blut
  choice: 'rhetorische Frage: „Sollte ich das Blut der Männer trinken …?“'
  alternative: „Ist das nicht das Blut der Männer …?“
  rationale: Beide Fassungen geben Davids Gleichsetzung des unter Lebensgefahr beschafften Wassers mit dem Blut der Männer wieder. Die gewählte Form macht die im Hebräischen knappe Frage im Deutschen verständlich, ohne eine tatsächliche Verwandlung des Wassers zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage wird behutsam verdeutlicht; die bildhafte Gleichsetzung von Wasser und Blut sowie die starke persönliche Zurückweisung bleiben erhalten.
