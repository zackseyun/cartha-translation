lexical_decisions:
- source_word: אֲבִי עַלְבוֹן
  choice: Abi-Albon
  rationale: Der Personenname wird in einer dem Hebräischen angenäherten deutschen Umschrift wiedergegeben. Der Bindestrich bildet die Zweigliedrigkeit der masoretischen Schreibung lesefreundlich ab.
- source_word: הָעַרְבָתִי
  choice: der Arbatiter
  rationale: Das mit Artikel versehene Herkunftswort bezeichnet wahrscheinlich einen Mann aus Arbat beziehungsweise aus der Araba. »Arbatiter« bewahrt die ortsbezogene Bezeichnung, ohne die genaue geografische Zuordnung festzulegen.
- source_word: עַזְמָוֶת
  choice: Asmawet
  rationale: Der Personenname wird nach gängiger deutscher Bibelumschrift wiedergegeben; dabei stehen s und w für die entsprechenden hebräischen Laute.
- source_word: הַבַּרְחֻמִי
  choice: der Barchumiter
  rationale: Das Herkunftswort mit Artikel wird gemäß der masoretischen Konsonanten- und Vokalgestalt transliteriert. Eine Verbindung mit Bahurim ist möglich, aber nicht sicher.
