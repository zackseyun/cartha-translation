  text: Eliphelet son of Ahasbai son of the Maacathite[a], Eliam son of Ahithophel the Gilonite.
translation:
  language: de
  text: Elifelet, der Sohn Ahasbais, des Sohnes eines Maachatiters[a]; Eliam, der Sohn Ahitofels aus Gilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Elifelet, der Sohn Ahasbais, des Maachatiters; Eliam, der Sohn Ahitofels aus Gilo.« Die Zuordnung der Herkunftsbezeichnung ist in dieser Namensliste nicht eindeutig; siehe auch die parallele Liste in 1. Chronik 11,35–36.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִיפֶלֶט
  choice: Elifelet
  rationale: Der Personenname wird nach gebräuchlichen deutschen Transliterationskonventionen wiedergegeben.
- source_word: בֶּן
  choice: Sohn
  rationale: In dieser Namensliste bezeichnet בֶּן am natürlichsten die Abstammung; die Wiedergabe wahrt beide Vorkommen.
- source_word: אֲחַסְבַּי
  choice: Ahasbai
  rationale: Direkte Transliteration des hebräischen Personennamens.
- source_word: הַמַּעֲכָתִי
  choice: eines Maachatiters
  rationale: Das Gentiliz bezeichnet einen Mann aus Maacha beziehungsweise dessen Volks- oder Gebietszugehörigkeit. Der unbestimmte deutsche Artikel ist nötig, weil der Mann nicht namentlich genannt wird.
- source_word: אֱלִיעָם
  choice: Eliam
  rationale: Direkte Transliteration des hebräischen Personennamens.
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Der Personenname wird in einer im Deutschen etablierten Form wiedergegeben.
- source_word: הַגִּלֹנִי
  choice: aus Gilo
  rationale: Das hebräische Gentiliz wird im natürlichen heutigen Deutsch als Herkunftsangabe wiedergegeben.
