source:
  edition: WLC
  text: וַ/יִּבְקְעוּ֩ שְׁלֹ֨שֶׁת הַ/גִּבֹּרִ֜ים בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בֹּ֤אר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑ד וְ/לֹ֤א אָבָה֙ לִ/שְׁתּוֹתָ֔/ם וַ/יַּסֵּ֥ךְ אֹתָ֖/ם לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/016.yaml
  text: Then the three mighty men broke through the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But he was not willing to drink it; instead[b], he poured it out to Yahweh.
translation:
  language: de
  text: Da brachen die drei Helden durch das Lager der Philister, schöpften Wasser aus dem Brunnen von Bethlehem, der am Tor lag, nahmen es mit und brachten es zu David. Doch er wollte es nicht trinken[a], sondern goss es dem HERRN aus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie zu trinken“. Das Hebräische verwendet ein Pluralsuffix, das sich idiomatisch auf das Wasser beziehen kann.'
    reason: lexical_alternative
  - marker: b
    text: Das Ausgießen ist dem HERRN gewidmet; das verwendete Verb kann an ein Trankopfer anklingen lassen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: brachen … durch
  rationale: Das Verb bezeichnet hier das gewaltsame Durchbrechen einer feindlichen Stellung und passt zum militärischen Zusammenhang.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: die drei Helden
  rationale: גִּבּוֹרִים bezeichnet in den Davidserzählungen herausragende, kampferprobte Männer. „Helden“ bewahrt den titelartigen Klang und ist im Deutschen würdig und verständlich.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: durch das Lager der Philister
  rationale: Die Präposition steht im Zusammenhang mit בּקע für den Bereich, durch den sie sich gewaltsam hindurchbewegten.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: schöpften Wasser
  rationale: שׁאב ist das gewöhnliche Verb für das Schöpfen von Wasser aus einem Brunnen.
- source_word: מִבֹּאר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: aus dem Brunnen von Bethlehem, der am Tor lag
  rationale: Die Formulierung gibt sowohl die Zugehörigkeit zu Bethlehem als auch die Lage beim Stadttor natürlich wieder.
- source_word: וַיִּשְׂאוּ
  choice: nahmen es mit
  rationale: Das Verb bedeutet wörtlich „trugen/hoben“. Im Zusammenhang bezeichnet es das Mitnehmen und Befördern des geschöpften Wassers.
- source_word: וַיָּבִאוּ אֶל דָּוִד
  choice: brachten es zu David
  rationale: Dies entspricht unmittelbar der Bewegungsrichtung des hebräischen Ausdrucks, ohne ein nicht ausdrücklich vorhandenes „zurück“ einzufügen.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Doch er wollte es nicht trinken
  rationale: אָבָה hebt Davids fehlende Bereitschaft hervor. Das deutsche Singularpronomen bezieht sich natürlich auf die Stoffbezeichnung „Wasser“.
- source_word: וַיַּסֵּךְ אֹתָם
  choice: sondern goss es … aus
  rationale: Die konkrete Handlung bleibt im Haupttext erhalten; die kultisch-opfernde Bedeutung von נסך wird durch die Zielangabe und eine Fußnote kenntlich gemacht, ohne sie stärker festzulegen als der Text.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: Die Präposition ל markiert hier die Widmung der Ausgießung. Der Gottesname יהוה wird nach der vorgesehenen deutschen Konvention mit „der HERR“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von Davids Ausgießen des Wassers
  choice: Eine konkrete Ausgießung für den HERRN mit Anklängen an ein Trankopfer
  alternative: Eine rein symbolische Weigerung zu trinken, ohne kultische Bedeutung
  rationale: נסך hat häufig kultische Bedeutung, und לַיהוָה kennzeichnet die Handlung als Gott zugewandt. Dennoch nennt der Vers das Wasser nicht ausdrücklich ein Opfer; deshalb bleibt der Haupttext bei der konkreten Handlung, während die Fußnote den kultischen Anklang erläutert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die knappe Folge der Handlungen wird bewahrt; „Helden“ erhält den besonderen Rang der drei Männer, ohne eine konfessionelle Deutung einzutragen.
