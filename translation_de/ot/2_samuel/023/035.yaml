lexical_decisions:
- source_word: חצרו
  choice: Hezro
  rationale: Der Personenname wird gemäß der masoretischen Vokalisierung transliteriert; „Hezro“ ist im Deutschen verständlich und in biblischen Namensformen anschlussfähig.
- source_word: הַכַּרְמְלִי
  choice: aus Karmel
  rationale: Das Herkunftsadjektiv bezeichnet einen Mann aus Karmel. Die Umschreibung vermeidet das im heutigen Deutsch naheliegende Missverständnis, er sei Angehöriger des späteren Karmeliterordens.
- source_word: פַּעֲרַי
  choice: Paarai
  rationale: Der Personenname wird transliteriert; „Paarai“ bildet die hebräische Lautgestalt angemessen ab.
- source_word: הָאַרְבִּי
  choice: aus Arab
  rationale: Das Herkunftsadjektiv wird natürlich als Herkunftsangabe wiedergegeben. Gemeint ist wahrscheinlich ein Ort namens Arab; diese Deutung bleibt in einer Fußnote als wahrscheinlich, nicht als völlig sicher, gekennzeichnet.
