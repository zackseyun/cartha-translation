base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/004.yaml
  text: he is like the light of morning when the sun rises[a], a morning without clouds; from brightness, from rain[b], grass from the earth.
translation:
  language: de
  text: Er ist wie das Licht des Morgens, wenn die Sonne aufgeht[a], wie ein Morgen ohne Wolken; aus Glanz, aus Regen wächst frisches Grün aus der Erde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder näher am Hebräischen: „und wie Morgenlicht, wenn die Sonne aufgeht“. Die hebräische Zeile ist elliptisch und setzt die Beschreibung des Herrschers aus dem vorherigen Vers fort.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch knapp: „aus Glanz, aus Regen, Grün aus der Erde“. Gemeint ist offenbar das Bild frischen Wachstums im Licht nach dem Regen; das genaue Verhältnis der Satzteile bleibt jedoch mehrdeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאוֹר
  choice: Er ist wie das Licht
  rationale: Das Präfix וּ verbindet die Zeile mit dem vorherigen Vers, und כְּ leitet einen Vergleich ein. Das im Hebräischen unausgesprochene Subjekt wird aus dem gerechten Herrscher in Vers 3 ergänzt, damit der deutsche Satz verständlich ist.
- source_word: בֹּקֶר
  choice: Morgen
  rationale: „Morgen“ ist für beide Vorkommen die natürliche Standardwiedergabe und erhält die poetische Wiederholung.
- source_word: יִזְרַח שָׁמֶשׁ
  choice: wenn die Sonne aufgeht
  rationale: Das Verb bezeichnet das Aufgehen beziehungsweise Hervorstrahlen der Sonne. Die temporale Formulierung ist im modernen Deutsch idiomatisch.
- source_word: בֹּקֶר לֹא עָבוֹת
  choice: ein Morgen ohne Wolken
  rationale: Die Formulierung bildet die knappe hebräische Wendung klar und bildhaft ab, ohne sie unnötig auszuschmücken.
- source_word: מִנֹּגַהּ
  choice: aus Sonnenglanz
  rationale: נֹגַהּ bezeichnet Glanz oder Helligkeit. „Sonnenglanz“ macht den Bezug zum unmittelbar zuvor genannten Sonnenaufgang verständlich, während „aus“ die hebräische Präposition wahrt.
- source_word: מִמָּטָר
  choice: aus Regen
  rationale: Die ungewöhnliche Wiederholung der Präposition מִן wird bewusst beibehalten. Die wahrscheinlich gemeinte Wirkung nach dem Regen wird nicht stillschweigend zur einzigen Deutung gemacht.
- source_word: דֶּשֶׁא
  choice: frisches Grün
  rationale: Das Wort bezeichnet junges grünes Gras beziehungsweise sprießende Vegetation. „Frisches Grün“ ist natürlich, anschaulich und weiter als nur eine einzelne Grasart.
- source_word: מֵאָרֶץ
  choice: aus der Erde
  rationale: Die Wiedergabe bewahrt sowohl die Präposition als auch das poetische Bild des aus dem Erdboden hervorkommenden Grüns.
theological_decisions:
- issue: Unausgesprochenes Subjekt des Vergleichs
  choice: Das aus Vers 3 erschlossene Subjekt wird mit „Er ist“ ausdrücklich genannt.
  alternative: Die elliptische Form „Und wie das Licht des Morgens …“ ohne genanntes Subjekt.
  rationale: Der unmittelbare Zusammenhang bezieht den Vergleich auf den gerecht herrschenden Menschen. Die Ergänzung klärt die deutsche Syntax, ohne eine zusätzliche christologische oder konfessionelle Festlegung einzuführen.
- issue: Verhältnis der Bilder im letzten Halbvers
  choice: Die beiden hebräischen מִן-Wendungen werden als „aus Sonnenglanz, aus Regen“ erhalten; lediglich „wächst“ wird für einen vollständigen deutschen Satz ergänzt.
  alternative: „Im Sonnenglanz nach dem Regen sprießt frisches Grün aus der Erde.“
  rationale: Der hebräische Text ist stark verdichtet, und das genaue syntaktische Verhältnis von Glanz, Regen und Grün bleibt offen. Die gewählte Fassung bewahrt diese Spannung besser als eine eindeutig zeitliche oder kausale Auflösung.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Bildsprache. Die ungewöhnliche Verdichtung des letzten Halbverses bleibt spürbar, wird aber durch das ergänzte Verb „wächst“ grammatisch lesbar gemacht.
