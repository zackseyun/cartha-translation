  yaml_path: translation/ot/2_samuel/023/014.yaml
  text: David was then in the stronghold[a], and the garrison of the Philistines was then at Bethlehem.
translation:
  language: de
  text: David war damals in der Bergfeste, und der Posten der Philister war damals in Bethlehem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: damals … damals
  rationale: Das zweimalige Adverb rahmt beide Satzteile zeitlich. Die bewusste Wiederholung ist im Deutschen natürlich genug und bewahrt die Hervorhebung des Hebräischen.
- source_word: מְצוּדָה
  choice: Bergfeste
  rationale: Im Zusammenhang mit Davids Zufluchtsort bezeichnet das Wort einen befestigten, schwer zugänglichen Ort. „Bergfeste“ gibt den militärisch-topografischen Sinn prägnant wieder, ohne eine bestimmte Bauform festzulegen.
- source_word: מַצַּב
  choice: Posten
  rationale: Das Wort kann einen militärischen Standort oder die dort stationierte Einheit bezeichnen. „Posten“ bewahrt diese mögliche Unschärfe besser als das eindeutig auf eine Truppe bezogene „Garnison“.
- source_word: פְּלִשְׁתִּים
  choice: Philister
  rationale: Eingebürgerte deutsche Bezeichnung des Volkes.
- source_word: בֵּית לָחֶם
  choice: Bethlehem
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: וְ
  choice: und
  rationale: Die Konjunktion verbindet die beiden Aussagen schlicht koordinierend; „und“ bewahrt diese Struktur.
