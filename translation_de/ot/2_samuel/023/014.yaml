  source_fidelity: Die Übersetzung bewahrt die hebräische Satzstruktur mit zwei koordinierten Nominalsätzen und gibt אָז in beiden Satzteilen ausdrücklich als „damals“ wieder. „Bergfeste“ ist für מְצוּדָה im erzählerischen und topographisch-militärischen Kontext eine vertretbare, etablierte Wiedergabe. „Posten“ kann sowohl den militärischen Standort als auch die dort befindliche Einheit bezeichnen und erhält damit die semantische Offenheit von מַצַּב.
  naturalness: Der Satz ist klares, würdiges modernes Standarddeutsch. Die Wiederholung von „damals“ ist bewusst markiert, aber weder ungrammatisch noch unnötig schwerfällig; sie bildet die zweimalige hebräische Zeitangabe angemessen ab.
  terminology: „David“, „Philister“ und „Bethlehem“ entsprechen dem üblichen deutschen biblischen Sprachgebrauch. „Bergfeste“ und „Posten“ sind im Kontext verständlich und vermeiden eine unzulässige dogmatische oder historische Präzisierung.
