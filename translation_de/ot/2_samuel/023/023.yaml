  text: מִן הַ/שְּׁלֹשִׁ֣ים נִכְבָּ֔ד וְ/אֶל הַ/שְּׁלֹשָׁ֖ה לֹא בָ֑א וַ/יְשִׂמֵ֥/הוּ דָוִ֖ד אֶל מִשְׁמַעְתּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/023.yaml
  text: He was honored among the thirty[a], but he did not attain to the three[c][b]; and David appointed him over his bodyguard.
translation:
  language: de
  text: Unter den Dreißig war er hoch angesehen[a], doch an die Drei reichte er nicht heran[b]. David setzte ihn über seine Leibwache[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er war angesehener als die Dreißig.“ Die hebräische Formulierung kann sowohl die Stellung innerhalb der Gruppe als auch einen Vergleich ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „doch zu den Dreien kam er nicht“; gemeint ist vermutlich, dass er den Rang dieser herausragenden drei Krieger nicht erreichte.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: „zu seiner mischma''at“. Der Ausdruck kann „zu seinem Befehl“, „über seinen Befehlsbereich“ oder „über seine Wache“ bedeuten. „Leibwache“ gibt die im Zusammenhang wahrscheinliche militärische Bedeutung wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשִׁים
  choice: unter den Dreißig
  rationale: מִן kann hier die Zugehörigkeit zu einer Gruppe oder einen Vergleich ausdrücken. Im Zusammenhang der Heldenliste ist „unter den Dreißig“ eine natürliche Wiedergabe; die mögliche komparative Deutung wird in der Fußnote genannt.
- source_word: נִכְבָּד
  choice: war hoch angesehen
  rationale: Das Nifal von כבד bezeichnet hier Ehre beziehungsweise hohes Ansehen. Die Formulierung bewahrt die passive Zustandsbedeutung und klingt im modernen Deutsch natürlich.
- source_word: וְאֶל הַשְּׁלֹשָׁה לֹא בָא
  choice: doch an die Drei reichte er nicht heran
  rationale: בוא אֶל bezeichnet in diesem Rangkontext idiomatisch das Erreichen einer Stellung. „Nicht heranreichen“ bewahrt das Bild und macht deutlich, dass Benaja nicht den Rang der herausragenden Dreiergruppe erreichte.
- source_word: וַיְשִׂמֵהוּ
  choice: David setzte ihn über
  rationale: שׂים bedeutet grundsätzlich „setzen, stellen“ und bezeichnet hier die Übertragung einer Leitungsaufgabe. „Setzte ihn über“ ist idiomatisch und bleibt der hebräischen Ausdrucksweise nahe.
- source_word: אֶל מִשְׁמַעְתּוֹ
  choice: über seine Leibwache
  rationale: מִשְׁמַעַת kann Befehl, Zuständigkeitsbereich oder eine einem Befehl unterstellte Gruppe bezeichnen. Im militärischen Hofkontext ist „Leibwache“ wahrscheinlich, bleibt aber unsicher und wird deshalb erläutert.
