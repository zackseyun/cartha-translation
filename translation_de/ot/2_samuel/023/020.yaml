id: 2SA.23.20
reference: 2 Samuel 23:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חי רַב פְּעָלִ֖ים מִֽ/קַּבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת ה/אריה בְּ/ת֥וֹךְ הַ/בֹּ֖אר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/020.yaml
  text: And Benaiah son of Jehoiada[a], son of a valiant man, great in deeds, from Kabzeel—he struck down the two sons of Ariel of Moab, and he went down and struck down the lion in the midst of the pit on a snowy day.
translation:
  language: de
  text: Und Benaja, der Sohn Jojadas, der Sohn eines tapferen, tatenreichen Mannes aus Kabzeel, erschlug die beiden Ariels von Moab[a]. Auch stieg er hinab und erschlug an einem Schneetag mitten in der Grube den Löwen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des hebräischen Wortes אֲרִאֵל (’ari’el) ist hier unsicher. Gemeint sein könnten „löwengleiche Männer“, „Helden“ oder Träger eines Namens beziehungsweise Titels; alte Übersetzungen verstehen die Wendung teils als „die beiden Söhne Ariels“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חי
  choice: ein tapferer Mann
  rationale: Die Wendung bezeichnet im Zusammenhang der Heldenliste nicht bloß einen lebenden Menschen, sondern einen Mann von Kraft und Tapferkeit. Das parallele חַיִל in 1. Chronik 11,22 stützt diese idiomatische Wiedergabe.
- source_word: רַב פְּעָלִים
  choice: tatenreich
  rationale: Das kompakte deutsche Adjektiv gibt die Fülle beziehungsweise Größe bemerkenswerter Taten wieder und bewahrt den knappen appositionellen Stil des Hebräischen.
- source_word: מִקַּבְצְאֵל
  choice: aus Kabzeel
  rationale: Die Präposition מִן bezeichnet hier am natürlichsten die Herkunft.
- source_word: הִכָּה
  choice: erschlug
  rationale: Im Zusammenhang mit kriegerischen Heldentaten und dem Löwen bezeichnet נכה hier ein tödliches Niederschlagen. „Erschlug“ ist präzise, würdig und im modernen Deutschen verständlich.
- source_word: שְׁנֵי אֲרִאֵל מוֹאָב
  choice: die beiden Ariels von Moab
  rationale: אֲרִאֵל ist an dieser Stelle lexikalisch unsicher. Die transliterierende Form „Ariels“ hält offen, ob ein Name, Titel oder eine Bezeichnung für löwengleiche Helden gemeint ist; die Fußnote nennt die wichtigsten Möglichkeiten.
- source_word: יָרַד
  choice: stieg hinab
  rationale: Die Wiedergabe bildet die gerichtete Bewegung in die Grube natürlich und ausdrücklich ab.
- source_word: הָאריה
  choice: den Löwen
  rationale: Das Substantiv bezeichnet eindeutig einen Löwen; der bestimmte Artikel wird beibehalten.
- source_word: בְּתוֹךְ הַבֹּאר
  choice: mitten in der Grube
  rationale: בּוֹר kann Grube oder Zisterne bedeuten. „Grube“ ist hier die neutralste Wiedergabe, während „mitten in“ den Ausdruck בְּתוֹךְ angemessen abbildet.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: an einem Schneetag
  rationale: Die knappe, natürliche Form bezeichnet einen vom Schnee geprägten Tag, ohne genauer festzulegen, ob es gerade schneite oder bereits Schnee lag.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil mit knapper, der hebräischen Heldenliste entsprechender Satzstruktur. „Ariels“ bleibt bewusst als ungeklärte Bezeichnung stehen und wird in der Fußnote erläutert. Die attributive Fügung „eines tapferen, tatenreichen Mannes“ folgt der naheliegenden syntaktischen Zuordnung zu Benajas Vater, ohne zusätzliche biografische Angaben einzuführen.
