base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/009.yaml
  text: And after him was Eleazar son of Dodo[a], son of Ahohi, among the three mighty men with David, when they taunted the Philistines who had gathered there for battle[c][b], and the men of Israel had gone up.
translation:
  language: de
  text: Nach ihm kam Eleasar, der Sohn Dodos, des Sohnes Ahohis,[a] einer der drei Helden bei David, als sie die Philister verhöhnten,[b] die sich dort zum Kampf versammelt hatten, und die Männer Israels hinaufzogen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Sohn Dodais, der Sohn eines Ahohiters“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „herausforderten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „und die Männer Israels zogen hinauf“; im Zusammenhang kann damit gemeint sein, dass sie sich zurückzogen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/אחר/ו
  choice: Nach ihm kam
  rationale: Leitet den nächsten Helden in der Reihenfolge ein; „kam“ ergänzt im Deutschen natürlich das im Hebräischen fehlende Verb.
- source_word: אֶלְעָזָר
  choice: Eleasar
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: בֶּן דדי בֶּן אֲחֹחִי
  choice: der Sohn Dodos, des Sohnes Ahohis
  rationale: Gibt die Folge der Abstammungsangaben gemäß dem Konsonantentext als Personennamen wieder; die Deutung als „Dodai, der Ahochiter“ bleibt in der Fußnote erhalten.
- source_word: בִּ/שְׁלֹשָׁה גברים
  choice: einer der drei Helden
  rationale: Das בְּ bezeichnet hier die Zugehörigkeit zur Dreiergruppe; גברים hat im Zusammenhang den militärisch-heroischen Sinn „Helden“.
- source_word: עִם דָּוִד
  choice: bei David
  rationale: Drückt die Zugehörigkeit beziehungsweise Verbindung mit David in idiomatischem Deutsch aus.
- source_word: בְּ/חָֽרְפָם
  choice: als sie … verhöhnten
  rationale: חרף bezeichnet feindseliges Schmähen oder Verhöhnen; das Pluralpronomen wahrt die im Hebräischen nicht ausdrücklich benannte Mehrzahl.
- source_word: בַּ/פְּלִשְׁתִּים
  choice: die Philister
  rationale: Übliche deutsche Bezeichnung des Volkes.
- source_word: נֶאֶסְפוּ שָׁם לַ/מִּלְחָמָה
  choice: die sich dort zum Kampf versammelt hatten
  rationale: Das Nifal von אסף bezeichnet hier das Sichversammeln der Philister; der Relativsatz macht den Bezug natürlich verständlich.
- source_word: וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל
  choice: und die Männer Israels hinaufzogen
  rationale: Bewahrt die Grundbedeutung von עלה und damit die Mehrdeutigkeit; die kontextuell plausible Bedeutung „sich zurückziehen“ wird in der Fußnote genannt.
