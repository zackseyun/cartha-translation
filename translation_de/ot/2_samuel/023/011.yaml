source:
  edition: WLC
  text: וְ/אַחֲרָ֛י/ו שַׁמָּ֥א בֶן אָגֵ֖א הָרָרִ֑י וַ/יֵּאָסְפ֨וּ פְלִשְׁתִּ֜ים לַ/חַיָּ֗ה וַ/תְּהִי שָׁ֞ם חֶלְקַ֤ת הַ/שָּׂדֶה֙ מְלֵאָ֣ה עֲדָשִׁ֔ים וְ/הָ/עָ֥ם נָ֖ס מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/011.yaml
  text: After him was Shammah son of Agee the Hararite. The Philistines gathered together at Lehi[a], where there was a plot of ground full of lentils, and the people fled from before the Philistines.
translation:
  language: de
  text: Nach ihm kam Schamma, der Sohn Ages, der Harariter. Die Philister sammelten sich zum Kampf[a]. Dort lag ein Feldstück voller Linsen; das Volk aber floh vor den Philistern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck לַחַיָּה ist schwierig. Er kann hier „zum Kampf“ bedeuten; möglich sind auch Deutungen wie „zur Truppe“ beziehungsweise „zur Schar“. Manche verstehen ihn als Ortsnamen „bei Lehi“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Nach ihm kam
  rationale: Kennzeichnet die Abfolge in der Liste der Helden. Das im Hebräischen fehlende Verb wird im Deutschen für einen natürlichen, vollständigen Satz ergänzt.
- source_word: שַׁמָּא בֶן־אָגֵא הָרָרִי
  choice: Schamma, der Sohn Ages, der Harariter
  rationale: Die Eigennamen und die Herkunfts- oder Sippenbezeichnung werden in geläufiger deutscher Form wiedergegeben; die Apposition bleibt erhalten.
- source_word: וַיֵּאָסְפוּ פְלִשְׁתִּים
  choice: Die Philister sammelten sich
  rationale: Gibt die reflexiv-passive Bedeutung des Verbs im militärischen Zusammenhang natürlich und quellennah wieder.
- source_word: לַחַיָּה
  choice: zum Kampf
  rationale: Der Ausdruck ist textlich beziehungsweise lexikalisch schwierig. Im militärischen Zusammenhang bezeichnet er wahrscheinlich den Zweck der Sammlung; die mögliche Deutung als Truppe oder Ortsname wird in der Fußnote offengehalten.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: ein Feldstück
  rationale: חֶלְקָה bezeichnet ein abgegrenztes Stück oder eine Parzelle; „Feldstück“ bewahrt das konkrete Bild in knappem, natürlichem Deutsch.
- source_word: מְלֵאָה עֲדָשִׁים
  choice: voller Linsen
  rationale: Entspricht unmittelbar der hebräischen Formulierung und vermeidet die weitergehende Deutung „mit Linsen bepflanzt“.
- source_word: וְהָעָם נָס מִפְּנֵי פְלִשְׁתִּים
  choice: das Volk aber floh vor den Philistern
  rationale: „Das Volk“ bewahrt die unspezifische Bezeichnung עָם, während „floh vor“ die hebräische Wendung idiomatisch ins Deutsche überträgt. „Aber“ hebt den erzählerischen Gegensatz hervor.
