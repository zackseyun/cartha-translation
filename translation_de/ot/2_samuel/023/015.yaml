base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/015.yaml
  text: And David longed and said[a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: de
  text: 'David verspürte Verlangen und sagte[a]: »Wer gibt mir Wasser aus dem Brunnen von Bethlehem zu trinken, der am Tor liegt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Wenn mir doch jemand Wasser aus dem Brunnen von Bethlehem am Tor zu trinken gäbe!« Im Hebräischen wird die Sehnsucht in Form einer Frage ausgedrückt: »Wer gibt mir …?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוֶּה
  choice: da überkam David ein starkes Verlangen
  rationale: Das Hitpael von אוה bezeichnet ein starkes Begehren oder Verlangen. Die Formulierung gibt die emotionale Intensität in natürlichem, würdigem Deutsch wieder.
- source_word: וַיֹּאמַר
  choice: und er sagte
  rationale: Das Verb ist das gewöhnliche Wort für »sagen«. Der Text bezeichnet die Äußerung weder ausdrücklich als Selbstgespräch noch als Ausruf.
- source_word: מִי
  choice: Wer gibt mir
  rationale: Das Fragewort leitet hier eine Wunschfrage ein. Die Übersetzung bewahrt die hebräische Frageform; die gemeinte Sehnsucht wird in der Fußnote erläutert.
- source_word: יַשְׁקֵנִי מַיִם
  choice: gibt mir Wasser … zu trinken
  rationale: Das Hifil von שקה bedeutet, jemanden trinken zu lassen beziehungsweise ihm zu trinken zu geben. Diese Formulierung ist idiomatisch und wahrt den kausativen Sinn.
- source_word: מִבֹּאר
  choice: aus dem Brunnen
  rationale: בְּאֵר bezeichnet gewöhnlich einen Brunnen, nicht eine Zisterne.
- source_word: בֵּית לֶחֶם
  choice: Bethlehem
  rationale: Gebräuchliche deutsche Schreibung des Ortsnamens.
- source_word: אֲשֶׁר בַּשָּׁעַר
  choice: der am Tor liegt
  rationale: Die Wendung bestimmt den Brunnen durch seine Lage am Stadttor. »Am Tor« ist natürliches Deutsch und legt nicht irreführend nahe, der Brunnen befinde sich innerhalb des Tores.
