source:
  edition: WLC
  text: אָמַר֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לִ֥/י דִבֶּ֖ר צ֣וּר יִשְׂרָאֵ֑ל מוֹשֵׁל֙ בָּ/אָדָ֔ם צַדִּ֕יק מוֹשֵׁ֖ל יִרְאַ֥ת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/003.yaml
  text: 'The God of Israel has spoken[a]; the Rock of Israel has said to me: One who rules over mankind justly, ruling in the fear of God[b],'
translation:
  language: de
  text: 'Der Gott Israels hat gesprochen;

    der Fels Israels hat zu mir geredet:


    Wer gerecht über Menschen[a] herrscht,

    wer in Ehrfurcht vor Gott herrscht[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung kann auch „unter den Menschen“ oder „bei den Menschen“ verstanden werden. אָדָם kann kollektiv die Menschheit oder Menschen allgemein bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Die Zeilen können auch messianisch als Beschreibung eines idealen Königs verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: hat gesprochen
  rationale: Das Perfekt eröffnet den Gottesspruch. Das deutsche Perfekt gibt die abgeschlossene Rede mit fortdauernder Geltung natürlich wieder.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Status-constructus-Verbindung bezeichnet Israels Gott; der bestimmte Artikel ist im Deutschen erforderlich.
- source_word: לִי
  choice: zu mir
  rationale: Die Präposition mit Suffix bezeichnet hier am natürlichsten David als Adressaten der göttlichen Rede; „über mich“ ist grammatisch denkbar, im parallelen Redeeingang aber weniger wahrscheinlich.
- source_word: דִבֶּר
  choice: hat geredet
  rationale: Das Verb steht parallel zu אָמַר. „Hat geredet“ bewahrt die Wiederholung des Redeakts, ohne im Deutschen mechanisch zu klingen.
- source_word: צוּר יִשְׂרָאֵל
  choice: der Fels Israels
  rationale: צוּר ist ein Gottesprädikat und Bild für Beständigkeit und Schutz. Das Bild wird beibehalten und nicht erklärend aufgelöst.
- source_word: מוֹשֵׁל
  choice: wer … herrscht
  rationale: Das Partizip kann allgemein und grundsatzartig verstanden werden. Die deutsche Relativkonstruktion bewahrt diesen Charakter sowie die Wiederholung in beiden Verszeilen.
- source_word: בָּאָדָם
  choice: über Menschen
  rationale: Die Präposition bezeichnet den Herrschaftsbereich; אָדָם wird hier kollektiv für die Menschheit beziehungsweise menschliche Untertanen gebraucht. „Über Menschen“ ist idiomatisch und geschlechtsübergreifend.
- source_word: צַדִּיק
  choice: gerecht
  rationale: Das Adjektiv beschreibt in der knappen poetischen Fügung die Art des Herrschens. Die adverbiale deutsche Wiedergabe vermeidet die Festlegung auf die substantivische Aussage „ein Gerechter“.
- source_word: מוֹשֵׁל יִרְאַת אֱלֹהִים
  choice: wer in Ehrfurcht vor Gott herrscht
  rationale: Die elliptische hebräische Verbindung wird im Deutschen mit „in“ entfaltet. „Ehrfurcht vor Gott“ vermittelt den Sinn von יִרְאַת אֱלֹהִים heute verständlich und bewahrt die Vorstellung verantwortlicher Gottesfurcht.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die morphologische Pluralform bezeichnet in dieser festen hebräischen Ausdrucksweise den einen Gott und wird daher im Deutschen im Singular wiedergegeben.
theological_decisions:
- issue: Allgemeine Königsidee oder messianische Aussage
  choice: Die Hauptfassung formuliert einen allgemeinen Grundsatz über gerechte Herrschaft, ohne den Herrscher ausdrücklich mit dem Messias gleichzusetzen.
  alternative: Die Worte können als Beschreibung eines bestimmten idealen Königs und in messianischer Perspektive als letztlich im Messias erfüllt verstanden werden.
  rationale: Die partizipiale, stark verdichtete hebräische Form erlaubt eine allgemeine wie auch eine stärker individualisierte Lesart. Da der Vers den Messias nicht ausdrücklich nennt, bleibt diese Spannung im Haupttext offen und wird in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Zeilengliederung. Die Wiederholung von „herrscht“ bildet den hebräischen Parallelismus ab. Der Satz bleibt mit Komma offen, weil der Vergleich in Vers 4 weitergeführt wird.
