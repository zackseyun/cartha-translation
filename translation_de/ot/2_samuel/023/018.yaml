  text: וַ/אֲבִישַׁ֞י אֲחִ֣י יוֹאָ֣ב בֶּן צְרוּיָ֗ה ה֚וּא רֹ֣אשׁ ה/שלשי וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל וְ/ל/וֹ שֵׁ֖ם בַּ/שְּׁלֹשָֽׁה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/018.yaml
  text: Abishai[a], the brother of Joab son of Zeruiah, was chief of the Three. He wielded his spear against three hundred and killed them[b], and he had a name among the Three.
translation:
  language: de
  text: Abischai[a], der Bruder Joabs, des Sohnes der Zeruja, war der Anführer der Drei. Er erhob seinen Speer gegen dreihundert und erschlug sie[b]; auch unter den Drei hatte er einen Namen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Anführer der Drei«. Manche verstehen die Gruppe aufgrund der Parallelstelle in 1. Chronik 11,20 und der textlichen Unsicherheit in diesem Abschnitt stattdessen als »die Dreißig«.'
    reason: textual_variant
  - marker: b
    text: 'Oder: »Er schwang seinen Speer gegen dreihundert und erschlug sie.« Das Hebräische ist knapp; wörtlich etwa: »Er erhob seinen Speer gegen dreihundert Erschlagene.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ הַשְּׁלֹשִׁי
  choice: das Oberhaupt der Drei
  rationale: רֹאשׁ bezeichnet ein Haupt oder Oberhaupt. Trotz der textlichen Schwierigkeit des folgenden Ausdrucks wird entsprechend dem masoretischen Text und בַּשְּׁלֹשָׁה am Versende »die Drei« beibehalten.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: schwang seinen Speer
  rationale: עורר bedeutet grundsätzlich »aufwecken, erregen, in Bewegung setzen«. Mit dem Speer als Objekt gibt »schwang« den kriegerischen Gebrauch natürlich wieder, ohne das Ergebnis bereits in das Verb hineinzulesen.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: gegen dreihundert Erschlagene
  rationale: חָלָל bezeichnet Erschlagene oder Durchbohrte. Die knappe hebräische Konstruktion enthält kein zusätzliches finites Verb für »tötete«; die ungewöhnliche, aber verständliche Wiedergabe bewahrt diese Verdichtung.
- source_word: וְלוֹ שֵׁם
  choice: und er hatte einen Namen
  rationale: Die wörtliche hebräische Wendung bezeichnet Ruf oder Ansehen. »Er hatte einen Namen« bewahrt das Bild und ist im Deutschen verständlich.
- source_word: בַּשְּׁלֹשָׁה
  choice: unter den Drei
  rationale: בְּ mit der Gruppenbezeichnung wird relational als »unter« wiedergegeben; die Lesart folgt hier dem masoretischen Text.
- source_word: אֲבִישַׁי ... יוֹאָב ... צְרוּיָה
  choice: Abischai ... Joab ... Zeruja
  rationale: Die Personennamen folgen etablierten deutschen Bibelnamensformen.
