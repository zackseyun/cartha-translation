review_pass:
  verdict: revise
  source_fidelity: Die Namensangaben, die Bezeichnung der Gruppe als »die Drei« gemäß dem masoretischen Text und die Schlusswendung »unter den Drei« sind sachgerecht. Die hebräische Wendung zu den dreihundert Erschlagenen ist jedoch elliptisch; im deutschen Haupttext ist »gegen dreihundert Erschlagene« missverständlich, weil man keinen Speer sinnvoll gegen bereits Erschlagene schwingt. Die explizite Wiedergabe des naheliegenden Ergebnisses wahrt den Sinn der Formel und wird durch die Anmerkung transparent gemacht.
  naturalness: »Das Oberhaupt der Drei« wirkt im modernen Standarddeutsch unnötig schwerfällig. »Anführer der Drei« ist natürlich und präzise. Die revidierte Formulierung zum Speer ist idiomatisch und verständlich, ohne den knappen Charakter des Hebräischen in der Anmerkung zu verdecken.
  terminology: Abischai, Joab und Zeruja entsprechen etablierten deutschen Bibelnamensformen. »Anführer«, »Speer«, »erschlug« und »Ansehen« bzw. die idiomnahe Wendung »einen Namen haben« liegen im würdevollen modernen Bibelregister. Die textkritische Alternative »die Dreißig« bleibt korrekt als Fußnote gekennzeichnet.
  issues:
  - severity: medium
    issue: Die Haupttextformulierung »Er schwang seinen Speer gegen dreihundert Erschlagene« ist im Deutschen semantisch missverständlich.
    rationale: »Erschlagene« bezeichnet Tote; die Formulierung kann daher nahelegen, Abischai habe seinen Speer gegen bereits Tote geschwungen. Die hebräische knappe Formel setzt das Töten voraus bzw. bezeichnet deren Ergebnis. Ein deutsches finites Verb ist für einen verständlichen Haupttext gerechtfertigt.
  - severity: low
    issue: »das Oberhaupt der Drei« ist stilistisch weniger natürlich als »der Anführer der Drei«.
    rationale: Beide geben רֹאשׁ angemessen wieder, aber »Anführer« ist im modernen Standarddeutsch die geläufigere Personenbezeichnung.
  - severity: low
    issue: Die bisherige Fußnote b erklärt עורר mit »setzte ... in Bewegung«, was als deutsche Umschreibung unnötig mechanisch wirkt.
    rationale: »Erhob« oder »schwang« gibt die mögliche Bedeutung klarer wieder; die wörtliche hebräische Verdichtung kann zugleich knapp erläutert werden.
