revisions:
- from: Abischai[a], der Bruder Joabs, des Sohnes der Zeruja, war das Oberhaupt der Drei. Er schwang seinen Speer gegen dreihundert Erschlagene[b], und er hatte einen Namen unter den Drei.
  to: Abischai[a], der Bruder Joabs, des Sohnes der Zeruja, war der Anführer der Drei. Er erhob seinen Speer gegen dreihundert und erschlug sie[b]; auch unter den Drei hatte er einen Namen.
  rationale: Die Revision beseitigt die im Deutschen missverständliche Verbindung von »gegen« mit »Erschlagene«, indem sie das in der hebräischen Formel vorausgesetzte Töten im Haupttext ausspricht. Die Fußnote bewahrt die knappe, schwierige Form des Hebräischen und die Alternative für עורר. »Anführer« modernisiert die Personenbezeichnung, ohne die Bedeutung von רֹאשׁ zu verändern. Die textliche Unsicherheit zwischen »Drei« und »Dreißig« bleibt ausschließlich und ausdrücklich in der Fußnote erhalten.
