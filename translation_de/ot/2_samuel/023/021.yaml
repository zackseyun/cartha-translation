source:
  edition: WLC
  text: וְ/הוּא הִכָּה֩ אֶת אִ֨ישׁ מִצְרִ֜י אשר מַרְאֶ֗ה וּ/בְ/יַ֤ד הַ/מִּצְרִי֙ חֲנִ֔ית וַ/יֵּ֥רֶד אֵלָ֖י/ו בַּ/שָּׁ֑בֶט וַ/יִּגְזֹ֤ל אֶֽת הַ/חֲנִית֙ מִ/יַּ֣ד הַ/מִּצְרִ֔י וַ/יַּהַרְגֵ֖/הוּ בַּ/חֲנִיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/021.yaml
  text: He also struck down an Egyptian[a], a man of impressive appearance. The Egyptian had a spear in his hand, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[b], and killed him with his own spear.
translation:
  language: de
  text: Er schlug auch einen Ägypter[a] nieder, einen Mann von beeindruckender Erscheinung. Der Ägypter hatte einen Speer in der Hand. Benaja ging mit einem Stock[b] zu ihm hinab, entriss dem Ägypter den Speer und tötete ihn mit seinem eigenen Speer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen gut aussehenden Mann“ oder „einen Mann von auffälliger Erscheinung“. Die hebräische Wendung bezieht sich allgemein auf sein Aussehen. Manche verstehen sie aufgrund der Parallelstelle in 1. Chronik 11,23 als Hinweis auf außergewöhnliche Körpergröße.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit einem Stab“, „mit einer Rute“ oder „mit einer Keule“. Das hebräische Wort שֵׁבֶט kann je nach Zusammenhang einen Stock, Stab, eine Rute, ein Zepter oder eine Keule bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: erschlug
  rationale: נכה bezeichnet hier im kriegerischen Zusammenhang das Niederschlagen eines Gegners. „Erschlug“ gibt die zusammenfassende Aussage knapp wieder, während der letzte Satz den genauen Ablauf der Tötung schildert.
- source_word: אִישׁ מִצְרִי
  choice: einen Ägypter
  rationale: Die ethnische Bezeichnung ist im Deutschen vollständig und natürlicher als „einen ägyptischen Mann“.
- source_word: אשר מַרְאֶה
  choice: einen Mann von beeindruckender Erscheinung
  rationale: Die ungewöhnliche, elliptische Wendung bezieht sich allgemein auf das sichtbare Erscheinungsbild. Die Übersetzung legt sich weder ausschließlich auf Schönheit noch auf Körpergröße fest.
- source_word: וּבְיַד הַמִּצְרִי חֲנִית
  choice: Der Ägypter hatte einen Speer in der Hand
  rationale: Die hebräische Besitzkonstruktion wird in natürliches modernes Deutsch übertragen, wobei das konkrete Bild erhalten bleibt.
- source_word: וַיֵּרֶד אֵלָיו
  choice: ging ... zu ihm hinab
  rationale: ירד bedeutet wörtlich „hinabgehen“. Die Wiedergabe bewahrt die Bewegungsrichtung, ohne das Verb lediglich als militärisches „angreifen“ auszudeuten.
- source_word: בַּשָּׁבֶט
  choice: mit einem Stock
  rationale: שֵׁבֶט kann Stock, Stab, Rute, Zepter oder Keule bezeichnen. „Stock“ ist in dieser Kampfszene konkret und legt die genaue Beschaffenheit nicht unnötig fest.
- source_word: וַיִּגְזֹל
  choice: entriss
  rationale: גזל bezeichnet gewaltsames Wegnehmen. „Entriss“ bringt sowohl die Gewalt als auch die unmittelbare Kampfsituation natürlich zum Ausdruck.
- source_word: וַיַּהַרְגֵהוּ
  choice: tötete ihn
  rationale: הרג ist das gewöhnliche Verb für „töten“; die direkte moderne Formulierung entspricht dem nüchternen Erzählstil.
- source_word: בַּחֲנִיתוֹ
  choice: mit seinem eigenen Speer
  rationale: Das Suffix bezieht sich im Zusammenhang am natürlichsten auf den Ägypter, dem der Speer gerade entrissen wurde. „Eigenen“ verdeutlicht die Umkehrung, ohne den Sinn zu verändern.
- source_word: וְהוּא
  choice: Er ... auch
  rationale: Die Formulierung führt ein weiteres Beispiel seiner Taten an; „auch“ gibt diese additive Funktion idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die allgemein gehaltene Beschreibung des Ägypters und die Bandbreite von שֵׁבֶט werden nicht vorschnell vereindeutigt. „Er aber“ macht den Wechsel des handelnden Subjekts nach dem Satz über den Ägypter verständlich; der Satzschluss „mit seinem eigenen Speer“ bewahrt die dramatische Umkehrung.
