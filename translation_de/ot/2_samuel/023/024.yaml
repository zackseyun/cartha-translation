  - severity: low
    issue: Fußnote nennt die Textbasis der Variante nicht ausdrücklich
    rationale: Die Fußnote sollte erläutern, dass der Haupttext dem hebräischen Text mit »Dodo« folgt und dass »Dodai« aus der Parallelstelle stammt.
