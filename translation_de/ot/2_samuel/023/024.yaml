base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/024.yaml
  text: Asahel the brother of Joab was among the Thirty[a]; Elhanan son of Dodo of Bethlehem.
translation:
  language: de
  text: Asahel, der Bruder Joabs, gehörte zu den Dreißig; Elhanan, der Sohn Dodos[a], aus Bethlehem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text hat »Dodo«; in der Parallelstelle 1. Chronik 11,26 lautet der Name »Dodai«.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲשָׂה אֵל
  choice: Asaël
  rationale: Die im Konsonantentext getrennt geschriebene Form bezeichnet den bekannten Personennamen עֲשָׂהאֵל. »Asaël« folgt der üblichen deutschen Wiedergabe und macht die getrennten Vokale erkennbar.
- source_word: אֲחִי יוֹאָב
  choice: der Bruder Joabs
  rationale: Die Status-constructus-Verbindung bezeichnet eindeutig das verwandtschaftliche Verhältnis; diese Formulierung ist zugleich genau und natürlich.
- source_word: בַּשְּׁלֹשִׁים
  choice: gehörte zu den Dreißig
  rationale: Die Präposition ב bezeichnet hier die Zugehörigkeit zu der als »die Dreißig« bekannten Kriegergruppe. Das ergänzte Verb gibt den Sinn des knappen hebräischen Listenstils idiomatisch wieder.
- source_word: אֶלְחָנָן
  choice: Elhanan
  rationale: Übliche deutsche Umschrift des Personennamens.
- source_word: בֶּן דֹּדוֹ
  choice: der Sohn Dodos
  rationale: Der masoretische Text liest דֹּדוֹ, hier als Personenname »Dodo« verstanden. Die abweichende Namensform der Parallelstelle wird in einer Fußnote bewahrt, statt den Haupttext anzugleichen.
- source_word: בֵּית לָחֶם
  choice: aus Bethlehem
  rationale: Die Ortsangabe bezeichnet Elhanans Herkunft. »Aus Bethlehem« ist im Deutschen transparent und passt natürlich zur appositionellen Namensliste.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Listenstil. Das erste elliptische Glied wird zur Verständlichkeit mit »gehörte« ergänzt; im zweiten bleibt die knappe Reihungsform des Hebräischen erhalten. »Die Dreißig« wird als Bezeichnung der bekannten Kriegergruppe großgeschrieben.
