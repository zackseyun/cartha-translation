  text: צֶ֖לֶק הָ/עַמֹּנִ֑י נַחְרַי֙ הַ/בְּאֵ֣רֹתִ֔י נשאי כְּלֵ֖י יוֹאָ֥ב בֶּן צְרֻיָֽהס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/037.yaml
  text: Zelek the Ammonite[a], Naharai the Beerothite, armor-bearer of Joab son of Zeruiah;
translation:
  language: de
  text: Zelek, der Ammoniter, Naharai aus Beerot, der Waffenträger Joabs, des Sohnes Zerujas;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶלֶק
  choice: Zelek
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Umschrift wiedergegeben.
- source_word: הָעַמֹּנִי
  choice: der Ammoniter
  rationale: Das Herkunftsadjektiv bezeichnet Zeleks ethnische Zugehörigkeit; »Ammoniter« ist die geläufige deutsche Form.
- source_word: נַחְרַי
  choice: Naharai
  rationale: Die Schreibung gibt die masoretische Vokalisierung des Personennamens angemessen wieder.
- source_word: הַבְּאֵרֹתִי
  choice: aus Beerot
  rationale: Das Herkunftsadjektiv bezeichnet einen Mann aus Beerot. Die natürliche deutsche Wendung ist verständlicher als die ungebräuchliche Bildung »Beerotiter«.
- source_word: נשאי כְּלֵי
  choice: der Waffenträger
  rationale: Die Konsonanten נשאי werden im Kontext als Status-constructus-Partizip נֹשֵׂא verstanden; zusammen mit כְּלֵי bezeichnet die Wendung den Träger der Waffen beziehungsweise militärischen Ausrüstung.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: Joabs, des Sohnes Zerujas
  rationale: Die Genitivkonstruktion macht deutlich, dass Naharai Joabs Waffenträger war, und erhält zugleich die vollständige Abstammungsangabe.
theological_decisions: []
translation_notes:
  register: 'Knappes, würdiges Listenregister. Die Herkunftsbezeichnungen werden idiomatisch differenziert wiedergegeben: »Ammoniter« ist im Deutschen etabliert, während bei Beerot die natürliche Form »aus Beerot« gewählt wird. Das abschließende Semikolon wahrt den Fortgang der Namensliste.'
