lexical_decisions:
- source_word: בְּנָיָהוּ
  choice: Benaja
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: פִּרְעָתֹנִי
  choice: aus Piraton
  rationale: Das Herkunftsadjektiv bezeichnet einen Mann aus Piraton; eine Herkunftsangabe klingt im modernen Deutschen natürlicher als „der Piratoniter“.
- source_word: הִדַּי
  choice: Hiddai
  rationale: Der Personenname folgt dem masoretischen Text von 2. Samuel; die abweichende Form der Parallelstelle wird in der Fußnote genannt.
- source_word: מִנַּחֲלֵי
  choice: aus den Bachtälern des
  rationale: נַחַל kann ein jahreszeitlich wasserführendes Bachbett, einen Wadi oder das zugehörige Tal bezeichnen. „Bachtäler“ bewahrt die topografische Bedeutung in verständlichem Deutsch.
- source_word: גָעַשׁ
  choice: Gaasch
  rationale: Der Ortsname wird nach üblicher deutscher Lautentsprechung transliteriert.
