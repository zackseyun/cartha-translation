  text: ה֣וּא קָם֩ וַ/יַּ֨ךְ בַּ/פְּלִשְׁתִּ֜ים עַ֣ד כִּֽי יָגְעָ֣ה יָד֗/וֹ וַ/תִּדְבַּ֤ק יָד/וֹ֙ אֶל הַ/חֶ֔רֶב וַ/יַּ֧עַשׂ יְהוָ֛ה תְּשׁוּעָ֥ה גְדוֹלָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/הָ/עָ֛ם יָשֻׁ֥בוּ אַחֲרָ֖י/ו אַךְ לְ/פַשֵּֽׁט׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/010.yaml
  text: He rose and struck down the Philistines until his hand grew weary and his hand clung to the sword[a]. And Yahweh brought about a great victory on that day[b], and the people returned after him only to strip the slain.
translation:
  language: de
  text: Er erhob sich und schlug die Philister nieder, bis seine Hand ermüdete und seine Hand am Schwert haften blieb. So schenkte Jahwe an jenem Tag einen großen Sieg[a]. Das Volk kehrte ihm nach zurück, nur um die Erschlagenen auszuplündern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine große Befreiung“ beziehungsweise „eine große Rettung“. Das hebräische Wort kann allgemein eine Rettung bezeichnen; hier geht es um Jahwes entscheidendes Eingreifen im Kampf.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nur um abzustreifen“ – gemeint ist, den Gefallenen nach dem Kampf Waffen, Rüstung und Beute abzunehmen.'
    reason: cultural_note
lexical_decisions:
- source_word: קָם
  choice: er erhob sich
  rationale: Das Qal von קום bezeichnet hier den entschlossenen Beginn seines Eingreifens im Kampf. „Er erhob sich“ ist würdevoll und bleibt nahe am hebräischen Ausdruck.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: und schlug die Philister nieder
  rationale: נכה bezeichnet im militärischen Zusammenhang ein gewaltsames Schlagen, häufig mit tödlichem Ausgang. „Niederschlagen“ gibt diese Kampfbedeutung natürlich wieder.
- source_word: עַד כִּי יָגְעָה יָדוֹ
  choice: bis seine Hand ermüdete
  rationale: יגע bezeichnet Ermüdung oder Erschöpfung. Die Formulierung bewahrt das konkrete Bild der durch den langen Kampf ermüdeten Hand.
- source_word: וַתִּדְבַּק יָדוֹ אֶל הַחֶרֶב
  choice: und am Schwert haften blieb
  rationale: דבק kann „haften“, „kleben“ oder „sich fest anschließen“ bedeuten. Die Wiedergabe erhält das eindrückliche Bild, ohne festzulegen, ob eine Verkrampfung oder eine erzählerische Überzeichnung gemeint ist.
- source_word: וַיַּעַשׂ יְהוָה
  choice: So schenkte Jahwe
  rationale: עשה mit dem abstrakten Objekt תְּשׁוּעָה bezeichnet das Herbeiführen oder Bewirken der Rettung. „Schenkte“ klingt im Deutschen natürlich und hält die göttliche Urheberschaft ausdrücklich fest.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: einen großen Sieg
  rationale: תְּשׁוּעָה kann Rettung, Befreiung oder Sieg bezeichnen. Im unmittelbaren Kampfzusammenhang vermittelt „Sieg“ den konkreten Sinn am klarsten; die Fußnote hält die weitere Bedeutungsbreite offen.
- source_word: וְהָעָם יָשֻׁבוּ אַחֲרָיו
  choice: Das Volk kehrte hinter ihm zurück
  rationale: Die Formulierung folgt der hebräischen Orts- und Bewegungsangabe und vermeidet es, „Volk“ ohne ausdrückliche Textgrundlage durch „Truppen“ zu ersetzen.
- source_word: אַךְ לְפַשֵּׁט
  choice: nur um die Erschlagenen auszuplündern
  rationale: פשט bezeichnet hier das Abstreifen von Waffen, Rüstung und Beute von den Gefallenen. „Ausplündern“ gibt die gemeinte Handlung idiomatisch wieder, während die Fußnote das konkrete Bild erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von תְּשׁוּעָה im Kampfbericht
  choice: Sieg
  alternative: Rettung oder Befreiung
  rationale: Der militärische Kontext legt „Sieg“ als konkrete Bedeutung nahe. Die alternative Bedeutung wird in einer Fußnote genannt, damit die umfassendere Rettungsbedeutung des hebräischen Wortes sichtbar bleibt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die anschaulichen Körper- und Kampfbilder des Hebräischen bleiben erhalten; erklärungsbedürftige Bedeutungsbreiten werden in Fußnoten ausgewiesen.
