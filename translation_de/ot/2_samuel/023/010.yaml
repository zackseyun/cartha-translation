  naturalness: „Das Volk kehrte hinter ihm zurück“ ist im modernen Standarddeutsch nicht idiomatisch und lässt die Bewegungsrelation missverständlich werden. „Das Volk kehrte ihm nach zurück“ gibt אַחֲרָיו quellennah wieder und ist in einem gehobenen erzählerischen Register verständlich. Außerdem wird das Bild der am Schwert haftenden Hand mit explizitem Subjekt klarer gefasst.
