  source_fidelity: Die Namensformen und die Kennzeichnung der problematischen Lesarten entsprechen grundsätzlich dem masoretischen Text. Der Haupttext ergänzt jedoch mit „stellte ... und sie erschlug“ zwei ausdrückliche Verben, die im hebräischen Wortlaut hier nicht stehen. Gerade weil die betreffende Passage textlich und syntaktisch schwierig ist, sollte diese konkrete Ausdeutung nicht ohne Kennzeichnung in den Haupttext aufgenommen werden.
  naturalness: Der Text ist überwiegend modernes, verständliches Standarddeutsch. „in einem einzigen Kampf“ ist aber enger als בְּפַעַם אֶחָד („auf einmal/bei einer Gelegenheit“), und die eingefügten Verben erzeugen eine flüssige, aber zu stark interpretierende Satzauflösung.
  terminology: „Helden“, „Tachkemoniter“, „Anführer der Drei“ sowie „Adino, der Ezniter“ sind angemessen und konsistent. Die Fußnoten geben die maßgeblichen textkritischen und lexikalischen Unsicherheiten sachlich wieder.
  issues:
  - severity: medium
    issue: Unmarkierte Ergänzung von „stellte ... und sie erschlug“ im Haupttext
    rationale: Der hebräische Text bietet nach der schwierigen Bezeichnung keine expliziten Verben für Sich-entgegenstellen oder Töten. Die Ergänzung legt den fragmentarischen und umstrittenen Wortlaut zu stark fest; die Speer- bzw. Kampfdeutung gehört, soweit vertreten, in die Fußnote.
  - severity: low
    issue: „in einem einzigen Kampf“ verengt die Zeitangabe
    rationale: בְּפַעַם אֶחָד bezeichnet unmittelbar „auf einmal“ bzw. „bei einer Gelegenheit“, nicht ausdrücklich einen einzelnen Kampf.
  revised_text: 'Dies sind die Namen der Helden, die zu David gehörten: Joscheb-Baschebet[a], ein Tachkemoniter, war der Anführer der Drei.[b] Er war Adino, der Ezniter[c] – gegen achthundert Erschlagene auf einmal.'
  revised_footnotes:
