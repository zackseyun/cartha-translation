source:
  edition: WLC
  text: אֵ֛לֶּה שְׁמ֥וֹת הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד יֹשֵׁ֨ב בַּשֶּׁ֜בֶת תַּחְכְּמֹנִ֣י רֹ֣אשׁ הַ/שָּׁלִשִׁ֗י ה֚וּא עֲדִינ֣/וֹ ה/עצנ/ו עַל שְׁמֹנֶ֥ה מֵא֛וֹת חָלָ֖ל בְּ/פַ֥עַם אחד׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/008.yaml
  text: 'These are the names of the mighty men who belonged to David: Josheb-basshebeth[a], a Tahkemonite, chief of the Three. He was Adino the Eznite[c][b], who wielded his spear against eight hundred slain at one time.'
translation:
  language: de
  text: 'Dies sind die Namen der Helden, die zu David gehörten: Joscheb-Baschebet[a], ein Tachkemoniter, war der Anführer der Drei.[b] Er war Adino, der Ezniter,[c] der sich in einem einzigen Kampf gegen achthundert stellte und sie erschlug.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text dieses Verses ist schwer verständlich. „Joscheb-Baschebet“ folgt dem masoretischen Text; die Parallelstelle in 1. Chronik 11,11 nennt „Jaschobam, einen Hachmoniter“.
    reason: textual_variant
  - marker: b
    text: 'Oder nach einigen alten Textzeugen und Auslegern: „der Anführer der Dreißig“. Der masoretische Text lautet „der Anführer der Drei“.'
    reason: alternative_reading
  - marker: c
    text: 'Hebräisch: „Adino, der Ezniter“; die Wendung ist äußerst schwer verständlich. Viele deuten sie stattdessen etwa als „er schwang seinen Speer“ oder „er führte seinen Speer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּבֹּרִים
  choice: die Helden
  rationale: גִּבּוֹרִים bezeichnet hier besonders tapfere und kampferprobte Männer. „Helden“ ist im Deutschen für diese Gruppe natürlich und würdevoll, ohne den Begriff auf bloße Soldaten zu verengen.
- source_word: אֲשֶׁר לְדָוִד
  choice: die zu David gehörten
  rationale: Die Verbindung mit לְ bezeichnet Zugehörigkeit beziehungsweise enge Zuordnung. Die Formulierung gibt die Bindung an David wieder, ohne persönliches Eigentum anzudeuten.
- source_word: יֹשֵׁב בַּשֶּׁבֶת
  choice: Joscheb-Baschebet
  rationale: Die schwierige masoretische Form wird im Haupttext als Eigenname wiedergegeben und nicht stillschweigend an die Chronikparallele angeglichen.
- source_word: תַּחְכְּמֹנִי
  choice: ein Tachkemoniter
  rationale: Die Herkunfts- oder Sippenbezeichnung wird nach der in Samuel überlieferten hebräischen Form transliteriert.
- source_word: רֹאשׁ הַשָּׁלִשִׁי
  choice: der Anführer der Drei
  rationale: Dies folgt der masoretischen Vokalisierung und gibt רֹאשׁ in diesem militärischen Zusammenhang idiomatisch als „Anführer“ wieder. Die textkritische Alternative „Dreißig“ bleibt in der Fußnote sichtbar.
- source_word: עֲדִינוֹ הָעֶצְנוֹ
  choice: Adino, der Ezniter
  rationale: Die äußerst schwierige masoretische Wendung wird formal als Name mit Bezeichnung bewahrt. Die verbreitete Deutung als Aussage über das Schwingen oder Führen eines Speers wird nicht in den Haupttext eingesetzt, sondern in einer Fußnote genannt.
- source_word: עַל שְׁמֹנֶה מֵאוֹת חָלָל
  choice: gegen achthundert stellte und sie erschlug
  rationale: עַל bezeichnet hier die feindliche Ausrichtung, חָלָל die Erschlagenen. Da dem überlieferten Satz in der unmittelbaren Form ein klares deutsches Prädikat fehlt, macht die Wiedergabe das aus dem Kampfergebnis erschließbare Geschehen verständlich, ohne einen im masoretischen Text nicht ausdrücklich genannten Speer einzuführen.
- source_word: בְּפַעַם אֶחָד
  choice: in einem einzigen Kampf
  rationale: Die Wendung bezeichnet ein einziges Mal beziehungsweise eine einzige Gelegenheit; im Kriegerverzeichnis macht „in einem einzigen Kampf“ den situativen Sinn natürlich deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die schwierigen masoretischen Namensformen bleiben im Haupttext erhalten; konkurrierende textkritische und lexikalische Deutungen werden transparent in Fußnoten ausgewiesen. Die Syntax wird für flüssiges Deutsch behutsam ergänzt, ohne die Chronikfassung oder die Speer-Deutung stillschweigend in den Haupttext zu übernehmen.
