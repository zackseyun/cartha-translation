base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/019.yaml
  text: Was he not more honored than the three? So he became their commander[b][a], but he did not attain to the three.
translation:
  language: de
  text: War er nicht angesehener als die Drei?[a] So wurde er ihr Anführer. Doch an die Drei reichte er nicht heran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „War er nicht unter den Dreien angesehen?“ Das Hebräische kann weniger stark vergleichend verstanden werden; der Vergleich „angesehener als die Drei“ passt jedoch gut zur Satzfügung und zum parallelen Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Er erreichte nicht den Rang oder die Stellung der „Drei“, der höchsten Gruppe unter Davids Helden.'
    reason: cultural_note
lexical_decisions:
- source_word: מִן הַשְּׁלֹשָׁה
  choice: als die Drei
  rationale: Die Präposition מִן wird nach נִכְבָּד am besten komparativ verstanden. „Die Drei“ bezeichnet eine bekannte, herausgehobene Gruppe.
- source_word: הֲכִי
  choice: War er nicht
  rationale: Die Verbindung leitet eine rhetorische Frage ein, auf die eine bejahende Antwort erwartet wird.
- source_word: נִכְבָּד
  choice: angesehener
  rationale: Das Niphal von כבד bezeichnet hier hohe Wertschätzung beziehungsweise herausgehobenes Ansehen; im komparativen Satz ist „angesehener“ natürlich und präzise.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: So wurde er ihr Anführer
  rationale: שַׂר bezeichnet einen Leiter, Obersten oder Befehlshaber. „Anführer“ ist im militärischen Zusammenhang verständlich, ohne einen modernen Dienstgrad einzutragen.
- source_word: וְעַד הַשְּׁלֹשָׁה לֹא בָא
  choice: Doch an die Drei reichte er nicht heran
  rationale: Die Wendung bezeichnet bildhaft, dass er den Rang oder die Stellung der Drei nicht erreichte. Die deutsche Formulierung bewahrt das Bewegungsbild und vermittelt zugleich den Rangvergleich.
theological_decisions: []
