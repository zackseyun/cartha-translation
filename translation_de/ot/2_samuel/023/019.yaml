  source_fidelity: 'Die Übersetzung gibt die rhetorische Frage הֲכִי angemessen wieder und versteht מִן ... נִכְבָּד plausibel komparativ: „angesehener als die Drei“. „An die Drei reichte er nicht heran“ trifft die idiomatische, auf Rang bzw. Stellung bezogene Aussage von וְעַד הַשְּׁלֹשָׁה לֹא בָא. Die referenzielle Spannung bzw. Unschärfe von „ihr“ entspricht dem im Hebräischen nicht weiter bestimmten להם und wird nicht unzulässig aufgelöst.'
