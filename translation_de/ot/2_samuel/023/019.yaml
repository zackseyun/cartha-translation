  terminology: „Anführer“ ist für שַׂר angemessen allgemein und vermeidet die Eintragung eines spezifischen modernen Ranges. Die Fußnoten bewahren sowohl die weniger komparative Deutungsmöglichkeit als auch den statusbezogenen Sinn der Schlusswendung.
