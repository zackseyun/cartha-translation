id: 2SA.23.2
reference: 2 Samuel 23:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ר֥וּחַ יְהוָ֖ה דִּבֶּר בִּ֑/י וּ/מִלָּת֖/וֹ עַל לְשׁוֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/002.yaml
  text: The Spirit of Yahweh spoke by me[a], and his word was on my tongue.
translation:
  language: de
  text: Der Geist Yahwehs sprach durch mich[a], und sein Wort war auf meiner Zunge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in mir«. Die hebräische Präposition kann hier sowohl die vermittelnde Rolle Davids als auch den Bereich bezeichnen, in dem das Reden geschah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֥וּחַ יְהוָ֖ה
  choice: der Geist Yahwehs
  rationale: רוּחַ kann »Wind«, »Atem« oder »Geist« bedeuten. Im Zusammenhang prophetischer Rede bezeichnet es am ehesten Gottes offenbarendes Wirken. Der Gottesname יְהוָה wird als »Yahweh« wiedergegeben.
- source_word: דִּבֶּר בִּי
  choice: sprach durch mich
  rationale: דבר bedeutet hier »sprechen«; die Präposition בְּ bezeichnet in diesem Zusammenhang wahrscheinlich die vermittelnde bzw. instrumentale Rolle Davids. »Durch mich« ist im modernen Deutschen natürlich und sachlich genau.
- source_word: וּמִלָּתוֹ
  choice: und sein Wort
  rationale: מִלָּה bezeichnet ein Wort oder eine Äußerung. »Wort« bewahrt sowohl die Bildlichkeit als auch das Gewicht der göttlichen Rede.
- source_word: עַל לְשׁוֹנִי
  choice: war auf meiner Zunge
  rationale: Die Wiedergabe folgt dem hebräischen Bild eng und ist zugleich im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der Eigenname wird als Eigenname bewahrt. »Yahweh« entspricht der vorgegebenen Wiedergabepraxis und vermeidet die Ersetzung durch einen Titel.
- issue: Bedeutung von רוּחַ im Zusammenhang göttlicher Rede
  choice: Geist
  alternative: Atem; Wind
  rationale: Der Kontext beschreibt die göttliche Urheberschaft prophetischer Rede. »Geist« gibt dies wieder, ohne weitergehende systematisch-theologische Aussagen in den Vers einzutragen.
- issue: Funktion der Präposition בְּ in בִּי
  choice: durch mich
  alternative: in mir; mittels meiner
  rationale: Die instrumentale Deutung passt zum Parallelismus mit Gottes Wort auf Davids Zunge. Da die Präposition auch lokativ verstanden werden kann, wird »in mir« als echte Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus und das konkrete Bild »auf meiner Zunge« bleiben erhalten.
