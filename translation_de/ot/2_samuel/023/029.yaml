base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/029.yaml
  text: Heleb son of Baanah the Netophathite[a], Ittai son of Ribai from Gibeah of the sons of Benjamin;
translation:
  language: de
  text: Heleb, der Sohn Baanas, der Netofatiter; Ittai, der Sohn Ribais, aus Gibea der Benjaminiter[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus Gibea der Söhne Benjamins“.'
    reason: Die Fußnote dokumentiert die wörtliche Stammesbezeichnung hinter der natürlichen Wiedergabe „der Benjaminiter“.
lexical_decisions:
- source_word: חֵלֶב
  choice: Heleb
  rationale: Der Personenname wird nach der im Deutschen gebräuchlichen biblischen Form transliteriert.
- source_word: בֶּן בַּעֲנָה
  choice: der Sohn Baanas
  rationale: בֶּן bezeichnet hier im Namensverzeichnis die Abstammung; der Genitiv ist im Deutschen natürlich und präzise.
- source_word: הַנְּטֹפָתִי
  choice: der Netofatiter
  rationale: Das Gentiliz bezeichnet Herkunft oder Zugehörigkeit zu Netofa; die substantivische deutsche Form entspricht dem knappen Listenstil.
- source_word: אִתַּי
  choice: Ittai
  rationale: Der Personenname wird transliteriert; „Ittai“ gibt die Verdoppelung des Konsonanten wieder und entspricht einer geläufigen deutschen Namensform.
- source_word: בֶּן רִיבַי
  choice: der Sohn Ribais
  rationale: Die Abstammungsangabe wird mit einem natürlichen deutschen Genitiv wiedergegeben.
- source_word: מִגִּבְעַת
  choice: aus Gibea
  rationale: Die Präposition מִן bezeichnet die Herkunft; „aus“ gibt dies direkt wieder.
- source_word: בְּנֵי בִנְיָמִן
  choice: der Benjaminiter
  rationale: Wörtlich steht „der Söhne Benjamins“; im Zusammenhang bezeichnet die Wendung den Stamm Benjamin. „der Benjaminiter“ ist verständliches, heutiges Deutsch, während die Fußnote die hebräische Ausdrucksweise bewahrt.
