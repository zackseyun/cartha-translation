  text: וְ/אִישׁ֙ יִגַּ֣ע בָּ/הֶ֔ם יִמָּלֵ֥א בַרְזֶ֖ל וְ/עֵ֣ץ חֲנִ֑ית וּ/בָ/אֵ֕שׁ שָׂר֥וֹף יִשָּׂרְפ֖וּ בַּ/שָּֽׁבֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/007.yaml
  text: But the man who touches them must arm himself with iron and the shaft of a spear[c][b][a], and they must be completely burned with fire in their place.
translation:
  language: de
  text: Doch wer sie[a] anrührt, muss sich mit Eisen und dem Schaft eines Speeres ausrüsten[b]; sie werden an Ort und Stelle[c] im Feuer restlos verbrannt[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sie“ bezieht sich auf die nichtswürdigen Menschen im vorherigen Vers, die mit Dornen verglichen werden.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: „muss mit Eisen und dem Holz eines Speeres gefüllt sein“; auch: „muss sich mit Eisen und dem Schaft eines Speeres bewaffnen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „an ihrem Platz“ beziehungsweise „dort, wo sie sind“. Der hebräische Ausdruck ist selten.'
    reason: lexical_alternative
  - marker: d
    text: 'Das Hebräische verbindet den absoluten Infinitiv mit dem Verb und verstärkt dadurch die Aussage: „sie werden ganz gewiss verbrannt“.'
    reason: source_structure
lexical_decisions:
- source_word: וְאִישׁ יִגַּע בָּהֶם
  choice: Doch wer sie anrührt
  rationale: Die generische Wiedergabe mit „wer“ klingt im modernen Deutschen natürlich. „Anrühren“ bewahrt das konkrete Bild der gefährlichen Dornen; „doch“ gibt den einleitenden Gegensatz im Zusammenhang wieder.
- source_word: יִמָּלֵא
  choice: muss sich … ausrüsten
  rationale: Das Nifal von מלא bedeutet wörtlich „gefüllt sein“, bezeichnet mit den nachfolgenden Werkzeugen hier aber idiomatisch das vollständige Ausstatten zum Umgang mit den Dornen.
- source_word: בַרְזֶל
  choice: Eisen
  rationale: Der hebräische Ausdruck nennt lediglich das Material „Eisen“ und legt das konkrete eiserne Werkzeug nicht fest.
- source_word: וְעֵץ חֲנִית
  choice: und einem Speerschaft
  rationale: Wörtlich steht „Holz eines Speeres“. Gemeint ist der hölzerne Schaft; „Speerschaft“ erhält das konkrete Bild knapp und verständlich.
- source_word: וּבָאֵשׁ
  choice: im Feuer
  rationale: Die Präposition kann das Mittel oder den Bereich bezeichnen. „Im Feuer“ ist im Deutschen idiomatisch und lässt diese Nuance offen.
- source_word: שָׂרוֹף יִשָּׂרְפוּ
  choice: sie werden … restlos verbrannt
  rationale: Der absolute Infinitiv neben dem finiten Verb verstärkt den Vorgang. „Restlos“ bringt diese emphatische Aussage natürlich zum Ausdruck.
- source_word: בַּשָּׁבֶת
  choice: an Ort und Stelle
  rationale: 'Die seltene Wendung wird im Zusammenhang örtlich verstanden: Die Dornen werden dort verbrannt, wo sie sich befinden. Die Fußnote wahrt die wörtlichere Alternative.'
theological_decisions:
- issue: Bezug des Pronomens „sie“
  choice: Das Pronomen bleibt im Vers stehen; eine Fußnote verweist auf die nichtswürdigen Menschen des vorherigen Verses, die dort mit Dornen verglichen werden.
  alternative: Den Bezug unmittelbar als „diese nichtswürdigen Menschen“ ausformulieren.
  rationale: Die pronominale und bildhafte Ausdrucksweise des Hebräischen soll nicht durch eine erklärende Auslegung im Haupttext ersetzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt bildhaft und knapp; seltene oder mehrdeutige hebräische Wendungen werden nicht im Haupttext übererklärt, sondern in den Fußnoten kenntlich gemacht.
