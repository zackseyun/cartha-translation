source:
  edition: WLC
  text: וְ/אֵ֛לֶּה דִּבְרֵ֥י דָוִ֖ד הָ/אַֽחֲרֹנִ֑ים נְאֻ֧ם דָּוִ֣ד בֶּן יִשַׁ֗י וּ/נְאֻ֤ם הַ/גֶּ֨בֶר֙ הֻ֣קַם עָ֔ל מְשִׁ֨יחַ֙ אֱלֹהֵ֣י יַֽעֲקֹ֔ב וּ/נְעִ֖ים זְמִר֥וֹת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/001.yaml
  text: 'These are the last words of David: An oracle of David son of Jesse[a], an oracle of the man raised on high, the anointed of the God of Jacob[c][b], and the sweet singer of Israel.'
translation:
  language: de
  text: 'Dies sind die letzten Worte Davids:


    Ausspruch Davids, des Sohnes Isais,[a]


    Ausspruch des Mannes, der hoch erhoben wurde,


    des Gesalbten des Gottes Jakobs,[b]


    des lieblichen Sängers Israels.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „feierliche Erklärung Davids“. Das hebräische Wort kennzeichnet häufig einen gewichtigen, mitunter prophetischen Ausspruch.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Ausdruck lautet: „des Gesalbten des Gottes Jakobs“. Er bezeichnet hier unmittelbar David, trägt aber königlich-messianische Anklänge.'
    reason: theological_clarification
  - marker: c
    text: 'Wörtlich steht nicht ausdrücklich „Sänger“, sondern eine knappe Verbindung mit „Lieder Israels“. Möglich ist daher auch: „der Liebliche der Lieder Israels“; gemeint ist wahrscheinlich der Sänger bzw. Dichter der Lieder Israels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Dies sind
  rationale: Die Wendung führt den Abschnitt ein. „Dies sind“ gibt Demonstrativ und Kopula natürlich wieder; das וְ wird im Deutschen nicht eigens mit „und“ oder „nun“ ausgedrückt, da ein solcher Anschluss hier schwerfällig wäre.
- source_word: דִּבְרֵי דָוִד הָאַחֲרֹנִים
  choice: die letzten Worte Davids
  rationale: Die direkte, idiomatische Wiedergabe bewahrt den Charakter einer abschließenden Äußerung.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: „Ausspruch“ ist ein feierlicher Redemarker und wahrt den prophetisch-orakelhaften Ton, ohne im modernen Deutsch die missverständlichen Nebenbedeutungen von „Orakel“ hervorzurufen.
- source_word: בֶּן יִשַׁי
  choice: des Sohnes Isais
  rationale: Die Apposition wird im Deutschen im Genitiv an „Davids“ angeschlossen; „Isai“ folgt der geläufigen deutschen Namensform.
- source_word: הַגֶּבֶר
  choice: des Mannes
  rationale: Die Grundbedeutung ist „Mann“; mögliche Anklänge an Stärke oder Rang werden nicht ausdrücklich hinzugefügt.
- source_word: הֻקַם עָל
  choice: der hoch erhoben wurde
  rationale: Die passive Form und das Bild der Erhöhung bleiben erhalten. Die Formulierung lässt sowohl konkrete Einsetzung als auch Erhöhung zu.
- source_word: מְשִׁיחַ אֱלֹהֵי יַעֲקֹב
  choice: des Gesalbten des Gottes Jakobs
  rationale: „Gesalbter“ bezeichnet David in seinem königlichen Amt und bewahrt zugleich die weiterreichende messianische Resonanz. Die Genitivverbindung folgt dem hebräischen Ausdruck eng.
- source_word: נְעִים זְמִרוֹת יִשְׂרָאֵל
  choice: des lieblichen Sängers Israels
  rationale: „Lieblich“ bewahrt den poetischen Wert von נְעִים; „Sänger“ macht die im knappen hebräischen Ausdruck implizierte Beziehung zu den Liedern verständlich. Die textnahe Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Ob מְשִׁיחַ hier als unmittelbarer messianischer Titel wiederzugeben ist
  choice: des Gesalbten
  alternative: des Messias
  rationale: Im unmittelbaren Zusammenhang ist David der bezeichnete Gesalbte Gottes. „Gesalbter“ wahrt diesen historischen Bezug und lässt die königlich-messianische Tragweite bestehen, ohne den Vers ausdrücklich zu einer direkten Identifikation mit dem endzeitlichen Messias zu machen.
- issue: Wie die knappe Verbindung נְעִים זְמִרוֹת יִשְׂרָאֵל zu verstehen ist
  choice: des lieblichen Sängers Israels
  alternative: des Lieben der Lieder Israels
  rationale: Der masoretische Text nennt das Singen nicht ausdrücklich, legt es durch „Lieder“ jedoch nahe. Die Hauptfassung ist verständliches Deutsch; die Fußnote bewahrt die formale Mehrdeutigkeit der ungewöhnlich knappen Wendung.
translation_notes:
  register: Feierlich-poetischer, aber gegenwärtiger Standardstil. Die vier appositionellen Bezeichnungen Davids werden durch parallele Genitivgruppen zusammengehalten. „Ausspruch“ vermeidet ein unnötig rätselhaft klingendes „Orakel“, während „hoch erhoben“ die Bildsprache des Hebräischen bewahrt.
