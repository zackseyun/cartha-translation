source:
  edition: WLC
  text: וַ/יִּקְרָ֤א הַ/צֹּפֶה֙ וַ/יַּגֵּ֣ד לַ/מֶּ֔לֶךְ וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ אִם לְ/בַדּ֖/וֹ בְּשׂוֹרָ֣ה בְּ/פִ֑י/ו וַ/יֵּ֥לֶךְ הָל֖וֹךְ וְ/קָרֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/025.yaml
  text: Then the watchman called out and told the king. And the king said[a], “If he is by himself, there is news in his mouth.” And he kept coming nearer and nearer.
translation:
  language: de
  text: 'Da rief der Wächter und meldete es dem König. Der König sagte: »Wenn er allein ist, hat er eine gute Nachricht zu überbringen.[a]« Währenddessen kam der Läufer immer näher.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ist eine Nachricht in seinem Mund«. Das hebräische Wort kann auch neutral »Nachricht« bedeuten; im Zusammenhang ist wahrscheinlich eine gute Nachricht gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: der Wächter
  rationale: Das substantivierte Partizip bezeichnet den zum Beobachten aufgestellten Mann; »Wächter« ist im militärischen und städtischen Zusammenhang natürlich und würdevoll.
- source_word: וַיִּקְרָא
  choice: rief
  rationale: קרא bezeichnet hier den lauten Zuruf des Wächters; »rief« gibt dies knapp und idiomatisch wieder.
- source_word: וַיַּגֵּד לַמֶּלֶךְ
  choice: meldete es dem König
  rationale: Das Hifil von נגד bedeutet berichten oder melden. Das Pronomen »es« bezieht sich natürlich auf die Beobachtung des Wächters.
- source_word: אִם לְבַדּוֹ
  choice: Wenn er allein ist
  rationale: Dies bildet die Aussage über den einzelnen Läufer direkt ab, ohne ein im Hebräischen nicht wiederholtes Bewegungsverb einzufügen.
- source_word: בְּשׂוֹרָה
  choice: eine gute Nachricht
  rationale: בְּשׂוֹרָה kann allgemein eine Nachricht, häufig aber eine erfreuliche Botschaft bezeichnen. Davids Schluss aus dem einzelnen Läufer legt hier die positive Bedeutung nahe, ohne die lexikalische Alternative zu verschweigen.
- source_word: בְּפִיו
  choice: hat er … zu überbringen
  rationale: Die hebräische Wendung lautet wörtlich »in seinem Mund«. Im modernen Deutschen vermittelt »zu überbringen« denselben Sinn natürlicher; die Bildlichkeit wird in der Fußnote kenntlich gemacht.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְקָרֵב
  choice: Währenddessen kam der Läufer immer näher
  rationale: Die Infinitivkonstruktion drückt eine fortschreitende Annäherung aus. Das explizite »der Läufer« verhindert im Deutschen einen missverständlichen Bezug auf den König.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit erzählerisch würdigem Ton. Die direkte Rede bleibt knapp; die fortschreitende Annäherung wird idiomatisch wiedergegeben.
