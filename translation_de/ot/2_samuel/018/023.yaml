source:
  edition: WLC
  text: וִ/יהִי מָ֣ה אָר֔וּץ וַ/יֹּ֥אמֶר ל֖/וֹ ר֑וּץ וַ/יָּ֤רָץ אֲחִימַ֨עַץ֙ דֶּ֣רֶךְ הַ/כִּכָּ֔ר וַֽ/יַּעֲבֹ֖ר אֶת הַ/כּוּשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/023.yaml
  text: But he said[a], “Whatever happens, let me run.” So he said to him[c][b], “Run.” Then Ahimaaz ran by the way of the plain and passed the Cushite.
translation:
  language: de
  text: 'Doch er sagte: »Was auch geschieht, lass mich laufen!« Da sagte er zu ihm: »Lauf!« Und Ahimaaz lief auf dem Weg durch die Ebene[a] und überholte den Kuschiter.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich die Jordanebene; der hebräische Ausdruck nennt hier jedoch nur »die Ebene«.
    reason: cultural_note
  - marker: b
    text: 'Oder: »zog an dem Kuschiter vorbei«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי מָה אָרוּץ
  choice: 'Doch er sagte: »Was auch geschieht, lass mich laufen!«'
  rationale: Die idiomatische Wendung drückt aus, dass Ahimaaz ungeachtet des möglichen Ausgangs hartnäckig um die Erlaubnis bittet, loszulaufen. Die Wiedergabe ist im Deutschen natürlich und bewahrt sowohl das Zugeständnis als auch den volitiven Charakter von אָרוּץ.
- source_word: רוּץ
  choice: Lauf!
  rationale: Direkte Wiedergabe des Imperativs von רוץ.
- source_word: דֶּרֶךְ הַכִּכָּר
  choice: auf dem Weg durch die Ebene
  rationale: דֶּרֶךְ bezeichnet Weg oder Route; הַכִּכָּר meint hier wahrscheinlich die Ebene des Jordantals. Die Haupttextfassung bleibt beim allgemeineren Ausdruck des Hebräischen und legt die genaue geografische Bezeichnung nicht fest.
- source_word: וַיַּעֲבֹר אֶת־הַכּוּשִׁי
  choice: und überholte den Kuschiter
  rationale: עבר mit direktem Objekt kann »an jemandem vorbeiziehen« oder »jemanden überholen« bedeuten. Im Zusammenhang eines Wettlaufs von Boten ist »überholte« die natürliche kontextuelle Wiedergabe; die formalere Alternative wird in einer Fußnote genannt.
- source_word: הַכּוּשִׁי
  choice: der Kuschiter
  rationale: כּוּשִׁי bezeichnet einen Mann aus Kusch. »Kuschiter« bewahrt die ethnisch-geografische Bezeichnung des hebräischen Textes und vermeidet die weniger genaue traditionelle Wiedergabe »Äthiopier«.
- source_word: אֲחִימַעַץ
  choice: Ahimaaz
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die knappen Wiederholungen des hebräischen Dialogs bleiben erhalten; die idiomatische Bitte wird natürlich wiedergegeben, ohne ihre Dringlichkeit abzuschwächen.
