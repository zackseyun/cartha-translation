  source_fidelity: Die Übersetzung gibt die idiomatische, insistierende Bitte וִיהִי מָה אָרוּץ angemessen als »Was auch geschieht, lass mich laufen!« wieder. Der Imperativ »Lauf!«, die Route »auf dem Weg durch die Ebene« und das Überholen des Kuschiters entsprechen dem hebräischen Sinn und bewahren die knappe Erzählbewegung.
  naturalness: Modernes, flüssiges Standarddeutsch mit passendem erzählerischem Ton. »Lass mich laufen« macht den im Kontext erbetenen Charakter der Äußerung klar, ohne unnötig zu paraphrasieren.
