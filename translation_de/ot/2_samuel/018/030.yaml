base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/030.yaml
  text: The king said[a], “Turn aside; stand here.” So he turned aside and stood.
translation:
  language: de
  text: 'Der König sagte[a]: »Tritt zur Seite und stell dich hier auf.« Da trat er zur Seite und stellte sich auf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dreh dich um und stell dich hier auf.« Das hebräische Verb kann allgemein eine Wendung bezeichnen; im Zusammenhang bedeutet es wahrscheinlich, dass der Bote zur Seite treten soll, um dem nächsten Boten Platz zu machen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das narrative Wayyiqtol von אמר leitet direkte Rede ein; »sagte« ist die natürliche deutsche Wiedergabe.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Das Substantiv ist durch den Artikel bestimmt und bezeichnet den aus dem Zusammenhang bekannten König.
- source_word: סֹב
  choice: Tritt zur Seite
  rationale: Der Imperativ von סבב bezeichnet allgemein eine Wendung; im Zusammenhang weist der König den Boten jedoch offenbar an, zur Seite zu treten und dem nächsten Boten Platz zu machen.
- source_word: הִתְיַצֵּב
  choice: stell dich
  rationale: Der Hitpael-Imperativ von יצב bedeutet, sich an einer Stelle aufzustellen oder seinen Platz einzunehmen. Zusammen mit כֹּה ergibt sich idiomatisch »stell dich hierhin«.
- source_word: כֹּה
  choice: hierhin
  rationale: Das Adverb bezeichnet in diesem Befehl den Ort, an dem der Bote sich aufstellen soll.
- source_word: וַיִּסֹּב
  choice: trat er zur Seite
  rationale: Die Erfüllung des vorherigen Befehls wird mit demselben Verbstamm ausgedrückt; die deutsche Formulierung hält diese Verbindung aufrecht.
- source_word: וַיַּעֲמֹד
  choice: blieb dort stehen
  rationale: עמד bedeutet hier »stehen«; »blieb dort stehen« verdeutlicht im natürlichen Deutschen das Ergebnis des Sich-Aufstellens, ohne den Sinn wesentlich zu erweitern.
