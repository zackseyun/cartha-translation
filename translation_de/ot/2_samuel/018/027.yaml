  text: וַ/יֹּ֨אמֶר֙ הַ/צֹּפֶ֔ה אֲנִ֤י רֹאֶה֙ אֶת מְרוּצַ֣ת הָ/רִאשׁ֔וֹן כִּ/מְרֻצַ֖ת אֲחִימַ֣עַץ בֶּן צָד֑וֹק וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אִֽישׁ ט֣וֹב זֶ֔ה וְ/אֶל בְּשׂוֹרָ֥ה טוֹבָ֖ה יָבֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/027.yaml
  text: Then the watchman said[a], “I see the running of the first one is like the running of Ahimaaz the son of Zadok.” And the king said, “He is a good man[b], and he comes with good news.”
translation:
  language: de
  text: 'Da sagte der Wächter: „Ich sehe, der Lauf des Ersten gleicht dem von Ahimaaz, dem Sohn Zadoks.“ Der König sagte: „Er ist ein guter Mann und kommt mit einer guten Nachricht.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er wird mit einer guten Nachricht kommen.“ Das hebräische Verb kann futurisch verstanden werden.'
    reason: Die Verbform lässt neben der präsentischen Deutung auch eine futurische Wiedergabe zu.
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: der Wächter
  rationale: Das substantivisch gebrauchte Partizip bezeichnet den Mann, der von seinem erhöhten Standort aus Ausschau hält. „Wächter“ ist im Erzählzusammenhang klar und würdevoll.
- source_word: מְרוּצַת הָרִאשׁוֹן כִּמְרֻצַת אֲחִימַעַץ
  choice: Ich erkenne am Lauf des ersten Mannes, dass es Ahimaaz … ist
  rationale: Die idiomatische deutsche Fassung gibt die aufgrund der Laufart erfolgende Identifizierung natürlich wieder. Die formale Vergleichskonstruktion des Hebräischen bleibt in Fußnote [a] sichtbar.
- source_word: אֲחִימַעַץ בֶּן צָדוֹק
  choice: Ahimaaz, der Sohn Zadoks
  rationale: Die Namen werden nach üblicher deutscher Bibeltradition transliteriert; die Abstammungsangabe בן wird ausdrücklich wiedergegeben.
- source_word: אִישׁ טוֹב זֶה
  choice: Er ist ein guter Mann
  rationale: Dies ist eine natürliche deutsche Wiedergabe der wörtlicheren Wortfolge „Ein guter Mann ist dieser“ und bewahrt die positive Beurteilung durch den König.
- source_word: וְאֶל בְּשׂוֹרָה טוֹבָה יָבוֹא
  choice: und kommt mit einer guten Nachricht
  rationale: Die Präposition אֶל wird hier kontextgemäß als Bezug auf die mitgebrachte Botschaft verstanden. Das Yiqtol kann angesichts des gerade herannahenden Boten präsentisch aufgefasst werden; die futurische Möglichkeit wird in Fußnote [b] erhalten.
