base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/032.yaml
  text: Then the king said to the Cushite[a], “Is it well with the young man Absalom?” And the Cushite said, “May the enemies of my lord the king, and all who rise up against you for evil[b], be like that young man.”
translation:
  language: de
  text: 'Da sagte der König zu dem Kuschiten: „Geht es dem jungen Mann Absalom gut?“[a] Der Kuschit antwortete: „Möge es den Feinden meines Herrn, des Königs, und allen, die sich gegen dich erheben, um dir Böses anzutun, so ergehen wie diesem jungen Mann.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich wird nach dem „Frieden“ beziehungsweise Wohlergehen Absaloms gefragt. Gemeint sein kann auch: „Ist der junge Mann Absalom unversehrt?“'
    reason: lexical_alternative
  - marker: b
    text: Der Kuschit antwortet indirekt. Seine Worte lassen erkennen, dass Absalom das Schicksal eines Feindes des Königs erlitten hat, ohne seinen Tod ausdrücklich zu melden.
    reason: cultural_note
lexical_decisions:
- source_word: הַכּוּשִׁי
  choice: der Kuschit
  rationale: Das Gentiliz bezeichnet einen Mann aus Kusch. „Kuschit“ bewahrt die geografisch-ethnische Bezeichnung des Hebräischen und vermeidet die weniger genaue traditionelle Wiedergabe „Äthiopier“.
- source_word: הֲשָׁלוֹם לַנַּעַר
  choice: Geht es dem jungen Mann ... gut?
  rationale: שָׁלוֹם fragt hier umfassend nach Wohlergehen und Unversehrtheit. Die deutsche Formulierung ist natürlich und beschränkt die Frage nicht auf das bloße Überleben.
- source_word: לַנַּעַר
  choice: dem jungen Mann
  rationale: נַעַר kann je nach Zusammenhang Junge, Jugendlicher oder junger Mann bedeuten. Bei dem erwachsenen Absalom ist „junger Mann“ angemessen, ohne ihn kindlich erscheinen zu lassen.
- source_word: יִהְיוּ כַנַּעַר
  choice: Möge es ... so ergehen wie diesem jungen Mann
  rationale: Der Jussiv drückt einen Wunsch beziehungsweise eine Verwünschung aus. Diese idiomatische deutsche Wendung erhält zugleich die indirekte Mitteilung über Absaloms Schicksal.
- source_word: אֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: den Feinden meines Herrn, des Königs
  rationale: Die Wiedergabe bewahrt die förmliche höfische Anrede und macht die Apposition im Deutschen deutlich.
- source_word: קָמוּ עָלֶיךָ לְרָעָה
  choice: die sich gegen dich erheben, um dir Böses anzutun
  rationale: קום על bezeichnet feindliches Auftreten oder Auflehnung; לְרָעָה nennt die schädliche beziehungsweise böse Absicht. Die Formulierung gibt beides in natürlichem Deutsch wieder.
theological_decisions:
- issue: Indirekte Bekanntgabe von Absaloms Tod
  choice: Die verhüllende Antwort des Kuschiten bleibt im Haupttext erhalten.
  alternative: Absaloms Tod ausdrücklich nennen.
  rationale: Der hebräische Text meldet den Tod nicht direkt, sondern lässt ihn durch den Wunsch erkennen, die Feinde des Königs mögen wie Absalom enden. Diese erzählerische Spannung darf nicht aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Anrede und die indirekte, spannungsvolle Antwort des Boten bleiben erhalten; Satzbau und Redewendungen sind für heutige Leser natürlich formuliert.
