base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/021.yaml
  text: Then Joab said to the Cushite[a], “Go, tell the king what you have seen.” And the Cushite bowed down to Joab and ran.
translation:
  language: de
  text: 'Da sagte Joab zu dem Kuschiter[a]: »Geh und berichte dem König, was du gesehen hast!« Der Kuschiter verneigte sich vor Joab und rannte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kuschi«, falls das hebräische Wort als Personenname verstanden wird; traditionell: »der Äthiopier«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: der Kuschiter
  rationale: Die Volks- bzw. Herkunftsbezeichnung wird transparent wiedergegeben. Eine Deutung als Personenname »Kuschi« ist möglich und wird in der Fußnote genannt; das traditionelle »Äthiopier« ist geografisch weniger genau.
- source_word: לֵךְ
  choice: Geh
  rationale: Der Imperativ von הלך ist hier ein schlichter Befehl und wird im modernen Deutschen natürlich mit »Geh« wiedergegeben.
- source_word: הַגֵּד
  choice: berichte
  rationale: Der Hifil-Imperativ von נגד bedeutet, etwas bekanntzugeben oder zu melden. »Berichte« passt zur Übermittlung einer Nachricht an den König.
- source_word: אֲשֶׁר רָאִיתָה
  choice: was du gesehen hast
  rationale: Die Formulierung gibt den hebräischen Relativausdruck idiomatisch wieder; das Perfekt bezeichnet das zuvor Erlebte, das nun berichtet werden soll.
- source_word: וַיִּשְׁתַּחוּ
  choice: verneigte sich
  rationale: Das Verb bezeichnet eine ehrerbietige körperliche Verbeugung oder ein Niederwerfen. »Verneigte sich« bewahrt die Respektgeste, ohne eine gottesdienstliche Bedeutung einzutragen oder vollständiges Niederwerfen vorauszusetzen.
- source_word: וַיָּרֹץ
  choice: lief davon
  rationale: Das Verb רוץ bedeutet »laufen/rennen«. »Lief davon« zeigt natürlich, dass der Bote unmittelbar aufbrach, ohne den Sinn zu überdehnen.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die fortschreitende Erzählform wird mit »Da« als natürlichem deutschem Erzählanschluss wiedergegeben.
