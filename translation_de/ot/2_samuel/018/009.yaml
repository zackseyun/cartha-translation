source:
  edition: WLC
  text: וַ/יִּקָּרֵא֙ אַבְשָׁל֔וֹם לִ/פְנֵ֖י עַבְדֵ֣י דָוִ֑ד וְ/אַבְשָׁל֞וֹם רֹכֵ֣ב עַל הַ/פֶּ֗רֶד וַ/יָּבֹ֣א הַ/פֶּ֡רֶד תַּ֣חַת שׂוֹבֶךְ֩ הָ/אֵלָ֨ה הַ/גְּדוֹלָ֜ה וַ/יֶּחֱזַ֧ק רֹאשׁ֣/וֹ בָ/אֵלָ֗ה וַ/יֻּתַּן֙ בֵּ֤ין הַ/שָּׁמַ֨יִם֙ וּ/בֵ֣ין הָ/אָ֔רֶץ וְ/הַ/פֶּ֥רֶד אֲשֶׁר תַּחְתָּ֖י/ו עָבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/009.yaml
  text: Absalom happened to come before David’s servants while Absalom was riding on the mule. The mule went under the thick branches of a large terebinth[a], and his head got caught in the terebinth, so that he was left hanging between heaven and earth while the mule that was under him passed on.
translation:
  language: de
  text: Absalom begegnete unvermutet den Männern Davids. Er ritt auf dem Maultier, und das Maultier kam unter das dichte Geäst einer großen Terebinthe[a]. Da verfing sich sein Kopf in der Terebinthe, und er blieb zwischen Himmel und Erde hängen, während das Maultier unter ihm weiterlief.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer großen Eiche“. Das hebräische Wort אֵלָה bezeichnet wahrscheinlich eine Terebinthe, wird aber auch als „Eiche“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרֵא ... לִפְנֵי
  choice: begegnete unvermutet
  rationale: Das Niphal von קרא bezeichnet hier ein nicht beabsichtigtes Zusammentreffen. „Begegnete unvermutet“ gibt den zufälligen Charakter natürlich wieder.
- source_word: עַבְדֵי דָוִד
  choice: den Männern Davids
  rationale: עֲבָדִים bezeichnet in diesem militärischen Erzählzusammenhang Davids Gefolgsleute beziehungsweise Soldaten; „Männer“ ist im Deutschen natürlicher als das missverständliche „Knechte“.
- source_word: רֹכֵב עַל הַפֶּרֶד
  choice: Er ritt auf dem Maultier
  rationale: Die partizipiale Zustandsangabe wird als natürlicher deutscher Erzählsatz wiedergegeben; der bestimmte Artikel bleibt erhalten.
- source_word: תַּחַת שׂוֹבֶךְ הָאֵלָה הַגְּדוֹלָה
  choice: unter das dichte Geäst einer großen Terebinthe
  rationale: שׂוֹבֶךְ bezeichnet dichtes beziehungsweise verflochtenes Astwerk. אֵלָה wird präzise als „Terebinthe“ wiedergegeben; die deutsche unbestimmte Form ist hier idiomatisch, obwohl das Hebräische bestimmt formuliert.
- source_word: וַיֶּחֱזַק רֹאשׁוֹ בָאֵלָה
  choice: Da verfing sich sein Kopf in der Terebinthe
  rationale: Wörtlich hält sein Kopf im Baum fest; „verfing sich“ drückt den unbeabsichtigten Vorgang im Deutschen klar aus, ohne Haare als Ursache zu ergänzen.
- source_word: וַיֻּתַּן בֵּין הַשָּׁמַיִם וּבֵין הָאָרֶץ
  choice: und er blieb zwischen Himmel und Erde hängen
  rationale: Das passive נתן beschreibt hier den resultierenden Schwebezustand. Die konventionelle Wendung „zwischen Himmel und Erde“ bewahrt Bild und Ton.
- source_word: עָבָר
  choice: weiterlief
  rationale: Das Verb bezeichnet die fortgesetzte Bewegung des Maultiers; „weiterlief“ ist in der konkreten Szene natürlich und eindeutig.
theological_decisions:
- issue: Woran Absalom hängen blieb
  choice: Sein Kopf verfing sich im Baum.
  alternative: Sein Haar verfing sich im Baum.
  rationale: Der hebräische Text nennt ausdrücklich רֹאשׁוֹ, „seinen Kopf“, nicht sein Haar. Die verbreitete Haar-Deutung wird deshalb nicht in den Text eingetragen.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Kurze Satzglieder halten die rasche Handlung klar. „Terebinthe“ wahrt die botanische Präzision; die Fußnote nennt die geläufige Alternative. Keine Ergänzung der im Hebräischen nicht genannten Haare.
