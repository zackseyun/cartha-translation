  source_fidelity: 'Die Übersetzung gibt den hebräischen Satzbau und Sinn zuverlässig wieder: Joab bläst das Schofar, seine Truppen brechen die Verfolgung Israels ab, weil er sie zurückhält. »Truppen« ist im militärischen Kontext eine angemessene Wiedergabe von הָעָם. »ließ(en) davon ab, ... zu verfolgen« trifft die mit מִן und Infinitiv ausgedrückte Beendigung der Verfolgung. Die Wiedergabe von חָשַׂךְ als »hielt ... zurück« bewahrt den wahrscheinlichsten Kontextbezug, ohne die mögliche Nuance des Schonens als Hauptsinn festzuschreiben.'
