source:
  edition: WLC
  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שֹּׁפָ֔ר וַ/יָּ֣שָׁב הָ/עָ֔ם מִ/רְדֹ֖ף אַחֲרֵ֣י יִשְׂרָאֵ֑ל כִּֽי חָשַׂ֥ךְ יוֹאָ֖ב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/016.yaml
  text: Then Joab blew the trumpet[a], and the people turned back from pursuing Israel[c][b], because Joab restrained the people.
translation:
  language: de
  text: Da blies Joab das Signalhorn[a], und die Truppen ließen davon ab, Israel[b] zu verfolgen; denn Joab hielt die Truppen zurück.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Widderhorn«. Das hebräische Schofar war ein Horn, das unter anderem als Signalhorn verwendet wurde.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind hier die israelitischen Truppen, die auf Abschaloms Seite kämpften.
    reason: cultural_note
  - marker: c
    text: Das hebräische Verb kann auch »schonte« bedeuten; hier bezeichnet es wahrscheinlich, dass Joab seine Truppen von der weiteren Verfolgung abhielt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע ... בַּשֹּׁפָר
  choice: blies ... das Signalhorn
  rationale: תקע bezeichnet mit שׁופר das Blasen eines Horns. »Signalhorn« gibt den konkreten Gegenstand und seine militärische Funktion natürlich wieder.
- source_word: וַיָּשָׁב הָעָם מִרְדֹף
  choice: die Truppen ließen davon ab ... zu verfolgen
  rationale: Die Verbindung von שׁוב mit מן und Infinitiv bezeichnet hier das Aufhören mit der Verfolgung. Im militärischen Zusammenhang meint העם die Truppen, nicht das Volk im allgemeinen Sinn.
- source_word: אַחֲרֵי יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bleibt entsprechend dem Hebräischen erhalten; gemeint sind im Kontext die israelitischen Kräfte auf Abschaloms Seite.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für das Ende der Verfolgung ein. »Denn« ist in diesem erzählerischen Satz natürlich und klar.
- source_word: חָשַׂךְ ... אֶת הָעָם
  choice: hielt die Truppen zurück
  rationale: חשׂך kann zurückhalten, vorenthalten oder verschonen bedeuten. Hier ist das Zurückhalten der eigenen Truppen im militärischen Zusammenhang am wahrscheinlichsten, ohne ein Motiv der Schonung festzulegen.
theological_decisions:
- issue: Identität »Israels«
  choice: Der Haupttext bewahrt »Israel« und erläutert nur in einer Fußnote die im Kontext gemeinten Kräfte Abschaloms.
  alternative: »die Israeliten auf Abschaloms Seite« direkt im Haupttext
  rationale: So bleibt die Ausdrucksweise des hebräischen Textes erhalten, ohne die historische Zuordnung für heutige Leser unklar zu lassen.
- issue: Bedeutung von חָשַׂךְ
  choice: »hielt ... zurück«
  alternative: »verschonte«
  rationale: »Verschonte« könnte Joab ausdrücklich ein Motiv der Barmherzigkeit zuschreiben. Der Kontext verlangt zunächst nur, dass er seine Truppen an weiterer Verfolgung hinderte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Truppen« verdeutlicht den militärischen Sinn von העם; »Signalhorn« vermeidet die moderne Assoziation einer Metalltrompete und bleibt allgemein verständlich.
