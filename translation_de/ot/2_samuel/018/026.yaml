base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/026.yaml
  text: Then the watchman saw another man running[a], and the watchman called to the gatekeeper and said, “Look, a man is running by himself.” And the king said, “He also brings news.”
translation:
  language: de
  text: 'Da sah der Wächter einen weiteren Mann laufen. Der Wächter rief dem Torhüter zu: »Sieh nur, da läuft ein Mann ganz allein!« Der König sagte: »Auch er bringt eine Nachricht.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Auch er ist ein Bote«; das hebräische Partizip bezeichnet jemanden, der eine Meldung überbringt, häufig eine gute Nachricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: der Wächter
  rationale: Das substantivierte Partizip von צפה bezeichnet den Mann, der Ausschau hält. »Wächter« ist im Zusammenhang des Stadttores klar und idiomatisch.
- source_word: אִישׁ אַחֵר
  choice: einen weiteren Mann
  rationale: אַחֵר kennzeichnet ihn als zusätzlichen, vom ersten Läufer unterschiedenen Mann. »Ein weiterer Mann« gibt dies natürlich wieder.
- source_word: רָץ
  choice: laufen / da läuft
  rationale: Das Partizip beschreibt eine gerade beobachtete, andauernde Handlung. Die deutschen Formulierungen stellen den Mann entsprechend als im Lauf befindlich dar.
- source_word: הַשֹּׁעֵר
  choice: dem Torhüter
  rationale: Das Wort bezeichnet hier den für das Stadttor zuständigen Hüter. »Torhüter« ist präzise und gegenwärtig verständlich.
- source_word: הִנֵּה
  choice: Sieh nur, da
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf das Sichtbare. »Sieh nur, da« bewahrt diesen deiktischen Ausruf in natürlichem Deutsch.
- source_word: לְבַדּוֹ
  choice: ganz allein
  rationale: Die Formulierung hebt hervor, dass der Läufer ohne Begleitung kommt. »Ganz allein« gibt diese Beobachtung idiomatisch wieder.
- source_word: גַּם זֶה
  choice: Auch er
  rationale: Die Aussage ordnet den zweiten Läufer ebenso wie den ersten als Überbringer einer Meldung ein. »Auch er« ist natürliches Deutsch und wahrt die additive Kraft von גַּם.
- source_word: מְבַשֵּׂר
  choice: bringt eine Nachricht
  rationale: Das Piel-Partizip von בשׂר bezeichnet das Überbringen einer Meldung, häufig einer guten Nachricht. Der Kontext rechtfertigt jedoch nicht, ihren positiven Inhalt ausdrücklich festzulegen; »bringt eine Nachricht« bewahrt diese Offenheit.
