  text: Then David mustered the people who were with him and appointed over them commanders of thousands and commanders of hundreds[a][b].
translation:
  language: de
  text: Dann musterte David das Volk, das bei ihm war,[a] und setzte Befehlshaber über Tausend und Befehlshaber über Hundert über sie ein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zählte“ beziehungsweise „überprüfte“. Das hebräische Verb kann eine militärische Musterung bezeichnen und meint nicht nur das Zählen. Wörtlich steht „das Volk“; hier sind damit die Leute in Davids Streitmacht gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Oberste über Tausend und Oberste über Hundert“. „Tausend“ und „Hundert“ können hier militärische Einheiten bezeichnen, ohne dass ihre tatsächliche Stärke genau angegeben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: musterte
  rationale: פקד bezeichnet hier im militärischen Zusammenhang das Erfassen, Überprüfen und Ordnen der vorhandenen Streitkräfte; »musterte« gibt diesen Sinn prägnant wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: עם bedeutet wörtlich »Volk«. Im Zusammenhang ist damit Davids Streitmacht gemeint; die wörtliche Ausdrucksweise bleibt erhalten und wird in einer Fußnote erläutert.
- source_word: אֲשֶׁר אִתּוֹ
  choice: das bei ihm war
  rationale: Die relationale Formulierung des Hebräischen wird bewahrt, ohne sie als formelles Unterstellungsverhältnis auszudeuten.
- source_word: וַיָּשֶׂם עֲלֵיהֶם
  choice: setzte über sie … ein
  rationale: שים mit על bezeichnet hier das Einsetzen von Personen in eine Leitungsstellung über andere; die deutsche Wendung ist natürlich und sachlich.
- source_word: שָׂרֵי
  choice: Befehlshaber
  rationale: שׂר bezeichnet einen Leiter oder Amtsträger; im militärischen Zusammenhang ist »Befehlshaber« eine klare moderne Entsprechung.
- source_word: אֲלָפִים
  choice: Tausend
  rationale: אלף kann auch eine soziale oder militärische Einheit bezeichnen. In der festen Verbindung mit Hundert wird die numerische Form beibehalten, ohne die exakte Größe der Einheiten festzulegen.
- source_word: מֵאוֹת
  choice: Hundert
  rationale: Der Ausdruck bildet mit »Tausend« die übliche militärisch-administrative Paarung und wird strukturgleich wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Bedeutung wird klar wiedergegeben, während »das Volk« die hebräische Ausdrucksweise bewahrt. Die wiederholte Formulierung »Befehlshaber über …« erhält den parallelen Satzbau des Originals.
