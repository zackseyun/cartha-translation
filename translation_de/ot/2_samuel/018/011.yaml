base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/011.yaml
  text: Then Joab said to the man who had told him[a], “Look, you saw him[b]; why then did you not strike him there to the ground? And I would have been obliged to give you ten pieces of silver and one belt.”
translation:
  language: de
  text: 'Da sagte Joab zu dem Mann, der ihm berichtet hatte: »Du hast ihn doch gesehen! Warum hast du ihn dann nicht dort zu Boden geschlagen? Und es wäre an mir gewesen, dir zehn Silberstücke[a] und einen Gürtel zu geben.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zehn Silber«; eine bestimmte Einheit wird im Hebräischen nicht genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Und ich hätte dir zehn Silberstücke und einen Gürtel gegeben.« Wörtlicher lautet die hebräische Wendung: »Und es wäre an mir gewesen, dir … zu geben.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגִּיד לֹו
  choice: der ihm berichtet hatte
  rationale: Das substantivierte Partizip bezeichnet den Mann, der Joab Meldung erstattet hatte. Das Plusquamperfekt gibt im Deutschen den dem Gespräch vorausgehenden Bericht natürlich wieder.
- source_word: וְהִנֵּה רָאִיתָ
  choice: Du hast ihn also gesehen!
  rationale: וְהִנֵּה leitet Joabs zugespitzte Reaktion ein. „Also“ vermittelt hier den folgernden, vorwurfsvollen Ton idiomatisch; das im Hebräischen nicht ausdrücklich genannte Objekt ist aus dem Zusammenhang eindeutig Absalom.
- source_word: הִכִּיתוֹ שָׁם אָרְצָה
  choice: ihn dann nicht dort zu Boden geschlagen
  rationale: נכה wird als „schlagen“ wiedergegeben, ohne die im Zusammenhang naheliegende Tötungsabsicht ausdrücklich in das Verb hineinzulegen. „Dort zu Boden“ bewahrt sowohl שָׁם als auch die Richtungsform אָרְצָה.
- source_word: וְעָלַי לָתֶת לְךָ
  choice: Und es wäre an mir gewesen, dir … zu geben
  rationale: Die Fügung עָלַי mit Infinitiv bezeichnet, was Joab oblegen hätte. Die deutsche Wendung bewahrt diese Verpflichtungs- beziehungsweise Zuständigkeitsnuance und bleibt zugleich natürlich.
- source_word: עֲשָׂרָה כֶסֶף
  choice: zehn Silberstücke
  rationale: Wörtlich steht „zehn Silber“; eine bestimmte Gewichtseinheit wird nicht genannt. „Silberstücke“ ergänzt nur das im Deutschen notwendige Zählwort, ohne „Schekel“ vorauszusetzen.
- source_word: חֲגֹרָה אֶחָת
  choice: einen Gürtel
  rationale: חֲגֹרָה bezeichnet einen Gürtel oder Leibgurt. Der unbestimmte Artikel gibt das hebräische Zahlwort „einer“ in dieser Aufzählung natürlich wieder.
