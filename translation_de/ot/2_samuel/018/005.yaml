base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/005.yaml
  text: And the king commanded Joab and Abishai and Ittai[a], saying, “Deal gently for my sake with the young man Absalom.” And all the people heard when the king commanded all the commanders concerning Absalom.
translation:
  language: de
  text: 'Der König befahl Joab, Abischai und Ittai: „Geht mir zuliebe behutsam mit dem jungen Mann Absalom um.“[a] Das ganze Volk hörte, als der König allen Befehlshabern den Befehl in Bezug auf Absalom gab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder näher an der knappen hebräischen Form: „Seid mir zuliebe behutsam mit dem jungen Mann – mit Absalom.“ Das Hebräische verbindet Davids persönliche Bitte und die nähere Bestimmung Absaloms sehr gedrängt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: befahl
  rationale: צוה bezeichnet ein verbindliches Gebot oder einen Auftrag; „befahl“ bewahrt die königliche Autorität und ist im Deutschen natürlich.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die hebräische Bezeichnung wird beibehalten, statt den Namen David einzusetzen.
- source_word: אֶת יוֹאָב וְאֶת אֲבִישַׁי וְאֶת אִתַּי
  choice: Joab, Abischai und Ittai
  rationale: Die Eigennamen werden in ihren geläufigen deutschen Formen wiedergegeben; die wiederholte hebräische Objektmarkierung verlangt im Deutschen keine Entsprechung.
- source_word: לֵאמֹר
  choice: Einleitung der direkten Rede durch Doppelpunkt
  rationale: Der hebräische Redeintroduktor wird im natürlichen deutschen Erzählstil nicht eigens mit „indem er sagte“ wiederholt.
- source_word: לְאַט
  choice: geht … behutsam … um
  rationale: Das Adverb drückt Sanftheit beziehungsweise Zurückhaltung aus. Die verbale deutsche Wendung passt zum militärischen Kontext und lässt offen, welche konkrete Behandlung gemeint ist.
- source_word: לִי
  choice: mir zuliebe
  rationale: Die Form bringt Davids persönliches Anliegen zum Ausdruck; „mir zuliebe“ gibt diese relationale Bedeutung idiomatisch wieder.
- source_word: לַנַּעַר
  choice: mit dem jungen Mann
  rationale: נַעַר kann Junge, Jugendlicher oder junger Mann bedeuten. Da Absalom erwachsen ist, zugleich aber aus der väterlichen Sicht Davids bezeichnet wird, wahrt „junger Mann“ beide Aspekte.
- source_word: לְאַבְשָׁלוֹם
  choice: Absalom
  rationale: 'Die zweite Präposition dient hier wahrscheinlich der näheren Bestimmung beziehungsweise Apposition: Der junge Mann ist Absalom. Die knappe deutsche Apposition ist verständlich; die ungewöhnlich verdichtete hebräische Form wird in der Fußnote kenntlich gemacht.'
- source_word: וְכָל הָעָם שָׁמְעוּ
  choice: Das ganze Volk hörte
  rationale: עָם bedeutet wörtlich „Volk“; obwohl im Zusammenhang das versammelte Kriegsvolk gemeint ist, wird die breite hebräische Bezeichnung bewahrt.
- source_word: בְּצַוֹּת
  choice: wie … diesen Befehl gab
  rationale: Die Präposition mit dem Infinitiv bezeichnet den gleichzeitigen Vorgang. „Wie“ ist hier ein natürlicher deutscher Anschluss und bewahrt das öffentliche Mithören des Befehls.
- source_word: כָּל הַשָּׂרִים
  choice: allen Befehlshabern
  rationale: שָׂרִים bezeichnet in diesem militärischen Zusammenhang die führenden Offiziere beziehungsweise Kommandeure; „Befehlshaber“ ist präzise und registergerecht.
- source_word: עַל דְּבַר אַבְשָׁלוֹם
  choice: wegen Absalom
  rationale: Die Wendung bedeutet „in Bezug auf, hinsichtlich“. „Wegen Absalom“ ist knapp, natürlich und legt den genauen Inhalt nicht über den Kontext hinaus fest.
