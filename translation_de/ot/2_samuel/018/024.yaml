base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/024.yaml
  text: David was sitting between the two gates[a], and the watchman went up to the roof of the gate by the wall. He lifted up his eyes and looked, and behold, a man was running alone.
translation:
  language: de
  text: 'David saß zwischen den beiden Toren[a]. Der Wächter stieg auf das Dach des Tores an der Mauer. Er blickte auf und sah: Da lief ein Mann allein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zwischen den beiden Toranlagen«. Wörtlich steht im Hebräischen »zwischen den beiden Toren«; wahrscheinlich ist der Raum innerhalb einer befestigten Toranlage gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: saß
  rationale: Das Partizip beschreibt Davids andauernde Haltung in dieser Szene; das deutsche Präteritum gibt diesen Hintergrundszustand im Erzählstil natürlich wieder.
- source_word: בֵּין שְׁנֵי הַשְּׁעָרִים
  choice: zwischen den beiden Toren
  rationale: Dies entspricht dem ausdrücklichen Wortlaut. Gemeint ist wahrscheinlich der Raum zwischen zwei Toranlagen oder zwischen innerem und äußerem Tor, doch der Haupttext soll die Architektur nicht genauer bestimmen als das Hebräische.
- source_word: הַצֹּפֶה
  choice: der Wächter
  rationale: Die substantivierte Form bezeichnet den Mann, der von der Tor- oder Maueranlage aus Ausschau hält; »Wächter« ist im Deutschen klar und idiomatisch.
- source_word: וַיֵּלֶךְ ... אֶל גַּג הַשַּׁעַר
  choice: stieg auf das Dach des Tores
  rationale: Das Verb bedeutet grundsätzlich »gehen«, doch das Ziel ist ein Dach; »stieg auf« macht die im Zusammenhang vorausgesetzte Aufwärtsbewegung im Deutschen natürlich deutlich.
- source_word: אֶל הַחוֹמָה
  choice: an der Mauer
  rationale: Die zweite mit אֶל eingeleitete Ortsangabe beschreibt hier wahrscheinlich die Lage des Tordachs bei beziehungsweise an der Stadtmauer. Die Formulierung wahrt den räumlichen Bezug, ohne die Bauweise näher festzulegen.
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: Er blickte auf
  rationale: Die wörtliche hebräische Wendung »er hob seine Augen« wird mit einer geläufigen deutschen Entsprechung wiedergegeben.
- source_word: וַיַּרְא וְהִנֵּה
  choice: 'und sah: Da'
  rationale: »Da« bewahrt nach dem Wahrnehmungsverb die präsentierende, Aufmerksamkeit lenkende Kraft von הִנֵּה, ohne im modernen Deutsch gekünstelt zu wirken.
- source_word: אִישׁ רָץ
  choice: ein Mann lief
  rationale: אִישׁ bezeichnet hier einen männlichen Einzelnen; das Partizip stellt ihn als gerade laufend vor Augen. Im deutschen Erzählstil gibt das Präteritum diese beobachtete Handlung natürlich wieder.
- source_word: לְבַדּוֹ
  choice: ganz allein
  rationale: Die Wendung betont, dass der Läufer ohne Begleitung unterwegs war; »ganz allein« ist klar und idiomatisch.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. Kurze Hauptsätze bilden den raschen Wechsel von David zum Wächter und dann zum herannahenden Läufer ab. Das präsentierende הִנֵּה wird mit »Da« statt mit dem heute feierlich oder altertümlich wirkenden »siehe« wiedergegeben.
