  source_fidelity: 'Die Aussage wird grundsätzlich zutreffend wiedergegeben: Absalom errichtet noch zu Lebzeiten eine Steinsäule im Tal des Königs, weil ihm ein Sohn zur Bewahrung seines Namens fehlt; die Bezeichnung besteht bis zur Erzählergegenwart fort. Die Wendung „für sich genommen“ ist jedoch im heutigen Deutsch mehrdeutig und kann wie „in Besitz genommen“ wirken, statt die hebräische Handlung des Errichtens eines Denkmals klar auszudrücken.'
  naturalness: Der Entwurf ist insgesamt würdevoll und gut verständlich. „Für sich genommen und aufgerichtet“ ist allerdings stilistisch und semantisch missverständlich. „Sich ... eine Steinsäule errichtet“ ist modernes, idiomatisches Deutsch. „Bis zum heutigen Tag“ sollte dabei direkt an die fortdauernde Benennung anschließen.
  terminology: „Steinsäule“, „Tal des Königs“ und „Denkmal“ sind angemessen. Die Fußnote bewahrt die ungewöhnliche wörtliche Bezeichnung יַד אַבְשָׁלוֹם („Absaloms Hand“) und erklärt ihre idiomatische Funktion neutral. Der Marker ist korrekt bei der übersetzten Namensform gesetzt.
