base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/018.yaml
  text: Absalom had taken and set up for himself in his lifetime the pillar that is in the Valley of the King[a], for he said, “I have no son to keep my name in remembrance.” So he called the pillar by his own name, and it is called Absalom’s Monument to this day.
translation:
  language: de
  text: 'Absalom hatte sich noch zu Lebzeiten eine Steinsäule errichtet, die im Tal des Königs steht. Denn er sagte: »Ich habe keinen Sohn, der meinen Namen in Erinnerung hält.« Deshalb benannte er die Steinsäule nach sich selbst. Bis zum heutigen Tag wird sie »Absaloms Denkmal«[a] genannt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Absaloms Hand«. »Hand« bezeichnet hier ein Erinnerungszeichen oder Denkmal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח וַיַּצֶּב לוֹ
  choice: hatte … für sich genommen und aufgerichtet
  rationale: Die beiden hebräischen Verben werden wiedergegeben; der Plusquamperfekt kennzeichnet die Handlung als früheren Hintergrund zur laufenden Erzählung. »Aufgerichtet« passt konkret zu einer Steinsäule.
- source_word: בְחַיּו
  choice: schon zu seinen Lebzeiten
  rationale: Gibt die zeitliche Bedeutung des hebräischen Ausdrucks natürlich und prägnant wieder.
- source_word: מַצֶּבֶת
  choice: Steinsäule
  rationale: Bezeichnet einen aufgerichteten Stein beziehungsweise eine Säule. »Steinsäule« bewahrt das konkrete Bild und ist im Deutschen verständlich.
- source_word: בְּעֵמֶק הַמֶּלֶךְ
  choice: im Königstal
  rationale: Natürliche deutsche Wiedergabe des Ortsnamens »Tal des Königs«.
- source_word: בַּעֲבוּר הַזְכִּיר שְׁמִי
  choice: der meinen Namen in Erinnerung hält
  rationale: Bringt den Zweck der fortdauernden Erinnerung an Absaloms Namen zum Ausdruck, ohne über die Aussage des Hebräischen hinauszugehen.
- source_word: וַיִּקְרָא לַמַּצֶּבֶת עַל שְׁמוֹ
  choice: benannte er die Steinsäule nach sich selbst
  rationale: Gibt die hebräische Namensformel idiomatisch und eindeutig wieder.
- source_word: יַד אַבְשָׁלוֹם
  choice: Absaloms Denkmal
  rationale: יַד bedeutet wörtlich »Hand«, bezeichnet hier jedoch idiomatisch ein Erinnerungszeichen oder Denkmal. Die ungewöhnliche wörtliche Form bleibt in der Fußnote erhalten.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: Bis zum heutigen Tag
  rationale: Geläufige deutsche Entsprechung der hebräischen Formel für das Fortbestehen der Bezeichnung bis zur Zeit des Erzählers.
