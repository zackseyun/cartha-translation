  to: 'Absalom hatte sich noch zu Lebzeiten eine Steinsäule errichtet, die im Tal des Königs steht. Denn er sagte: »Ich habe keinen Sohn, der meinen Namen in Erinnerung hält.« Deshalb benannte er die Steinsäule nach sich selbst. Bis zum heutigen Tag wird sie »Absaloms Denkmal«[a] genannt.'
