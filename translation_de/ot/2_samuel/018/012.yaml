  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ אֶל יוֹאָ֔ב ו/לא אָנֹכִ֜י שֹׁקֵ֤ל עַל כַּפַּ/י֙ אֶ֣לֶף כֶּ֔סֶף לֹֽא אֶשְׁלַ֥ח יָדִ֖/י אֶל בֶּן הַ/מֶּ֑לֶךְ כִּ֣י בְ/אָזְנֵ֜י/נוּ צִוָּ֣ה הַ/מֶּ֗לֶךְ אֹ֠תְ/ךָ וְ/אֶת אֲבִישַׁ֤י וְ/אֶת אִתַּי֙ לֵ/אמֹ֔ר שִׁמְרוּ מִ֕י בַּ/נַּ֖עַר בְּ/אַבְשָׁלֽוֹם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/012.yaml
  text: But the man said to Joab[a], “Even if I were weighing out a thousand pieces of silver on my palms, I would not put out my hand against the king’s son; for in our hearing the king commanded you and Abishai and Ittai, saying[b], ‘Guard for me the young man Absalom.’”
translation:
  language: de
  text: 'Doch der Mann sagte zu Joab: „Selbst wenn ich tausend Silberstücke in meine Hände bekäme[a], würde ich meine Hand nicht gegen den Sohn des Königs erheben. Denn vor unseren Ohren befahl der König dir, Abischai und Ittai: ‚Gebt um meinetwillen auf den jungen Absalom acht!‘[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „wenn ich tausend Silber auf meinen Handflächen abwöge“. Gemeint ist eine hohe, nach Gewicht bemessene Silberzahlung.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut am Versende ist schwierig; wörtlich steht dort etwa: „Bewahrt מִי den jungen Mann, Absalom.“ Im Licht des Befehls in 2 Samuel 18,5 wird meist der Sinn „Gebt um meinetwillen auf den jungen Absalom acht“ angenommen.'
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁקֵל עַל כַּפַּי אֶלֶף כֶּסֶף
  choice: Selbst wenn ich tausend Silberstücke in meine Hände bekäme
  rationale: Die Wendung beschreibt eine sehr hohe, nach Gewicht bemessene Silberzahlung. Die deutsche Formulierung gibt den Sinn als angebotene Belohnung natürlich wieder; das konkrete Bild der Handflächen wird in der Fußnote bewahrt. „Silberstücke“ vermeidet die nicht ausdrücklich genannte Einheit „Schekel“.
- source_word: לֹא אֶשְׁלַח יָדִי אֶל
  choice: würde ich meine Hand nicht gegen … erheben
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Handbild und bringt zugleich klar zum Ausdruck, dass der Mann jede Gewalttat gegen Abschalom verweigert.
- source_word: בֶּן הַמֶּלֶךְ
  choice: den Sohn des Königs
  rationale: Die direkte Wiedergabe erhält die königliche Beziehung, auf der die Begründung des Mannes beruht.
- source_word: בְאָזְנֵינוּ
  choice: vor unseren Ohren
  rationale: Die Formulierung bewahrt das hebräische Körperbild und macht deutlich, dass die Anwesenden den Befehl persönlich hörten.
- source_word: צִוָּה
  choice: befahl
  rationale: Das Verb bezeichnet hier eine verbindliche Weisung des Königs; „befahl“ ist im Deutschen knapp und autoritativ.
- source_word: שִׁמְרוּ
  choice: Gebt … acht
  rationale: Im Zusammenhang fordert das Verb dazu auf, Abschalom zu bewachen und vor Schaden zu bewahren. „Auf jemanden achtgeben“ ist natürliches modernes Deutsch und lässt den Schutzaspekt erkennen.
- source_word: מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  choice: für mich auf den jungen Abschalom
  rationale: Der masoretische Wortlaut ist schwierig. Der Haupttext folgt dem aus 2 Samuel 18,5 und dem Erzählzusammenhang naheliegenden Sinn eines persönlichen Schutzauftrags des Königs, ohne die Textschwierigkeit zu verschweigen.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Der Artikel bezeichnet den im unmittelbaren Erzählzusammenhang bereits genannten Mann.
- source_word: וְלֹא אָנֹכִי
  choice: Selbst wenn ich … würde ich … nicht
  rationale: Die konditionale Formulierung gibt die nachdrückliche Weigerung des Sprechers in natürlichem Deutsch wieder.
