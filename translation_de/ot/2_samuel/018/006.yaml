  text: וַ/יֵּצֵ֥א הָ/עָ֛ם הַ/שָּׂדֶ֖ה לִ/קְרַ֣את יִשְׂרָאֵ֑ל וַ/תְּהִ֥י הַ/מִּלְחָמָ֖ה בְּ/יַ֥עַר אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/006.yaml
  text: So the troops went out into the field to meet Israel[a], and the battle took place in the forest of Ephraim.
translation:
  language: de
  text: Da zogen die Truppen ins offene Gelände hinaus, Israel entgegen,[a] und die Schlacht fand im Wald von Ephraim statt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »das Volk«; im Zusammenhang bezeichnet dies Davids Kampftruppe, daher »die Truppen«.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: das Kriegsvolk
  rationale: הָעָם bedeutet gewöhnlich »das Volk«, bezeichnet hier im militärischen Zusammenhang jedoch Davids zum Kampf ausziehende Truppe. »Kriegsvolk« bewahrt die kollektive Ausdrucksweise und macht den Kontext verständlich.
- source_word: הַשָּׂדֶה
  choice: ins freie Land hinaus
  rationale: שָׂדֶה kann »Feld« oder »freies Land« bedeuten. Zusammen mit יצא bezeichnet es das Hinausziehen in das offene Gelände; »ins freie Land hinaus« ist hier natürlich und vermeidet die Verengung auf ein einzelnes Ackerfeld.
- source_word: לִקְרַאת
  choice: entgegen
  rationale: לִקְרַאת bezeichnet eine Bewegung auf jemanden zu beziehungsweise ihm entgegen. Der feindliche Sinn ergibt sich aus dem Schlachtkontext und muss nicht zusätzlich in das Wort hineingetragen werden.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird entsprechend dem Hebräischen beibehalten. Im Zusammenhang sind damit die Absalom folgenden Streitkräfte Israels gemeint, doch der Text selbst sagt schlicht »Israel«.
- source_word: הַמִּלְחָמָה
  choice: die Schlacht
  rationale: מִלְחָמָה kann »Krieg« oder »Schlacht« bedeuten. Hier geht es um das konkrete Gefecht, daher ist »Schlacht« treffend.
- source_word: וַתְּהִי
  choice: fand … statt
  rationale: Die Grundbedeutung ist »war/geschah«. Mit »Schlacht« ist »fand statt« eine natürliche deutsche Wiedergabe.
- source_word: בְּיַעַר אֶפְרָיִם
  choice: im Wald von Ephraim
  rationale: Die Konstruktverbindung wird direkt und idiomatisch als »Wald von Ephraim« wiedergegeben, ohne die geografische Frage weiter aufzulösen.
