  text: וַ/תְּהִי שָׁ֧ם הַ/מִּלְחָמָ֛ה נפצית עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַ/יֶּ֤רֶב הַ/יַּ֨עַר֙ לֶ/אֱכֹ֣ל בָּ/עָ֔ם מֵ/אֲשֶׁ֥ר אָכְלָ֛ה הַ/חֶ֖רֶב בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/008.yaml
  text: The battle spread there over the face of all the land[a], and the forest devoured more of the people that day than the sword devoured.
translation:
  language: de
  text: Dort breitete sich die Schlacht über das ganze Land aus[a], und der Wald verschlang an jenem Tag mehr vom Volk, als das Schwert verschlang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dort war die Schlacht über das ganze Land zerstreut.“ Das hebräische Partizip kann stärker hervorheben, dass sich das Kampfgeschehen über das Gebiet verteilte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נפצית
  choice: breitete sich … aus
  rationale: Das Nifal-Partizip von פוץ bezeichnet ein Ausgebreitet- oder Zerstreutsein. Im Zusammenhang einer räumlich ausgedehnten Schlacht ist die reflexive Formulierung natürlich und bewahrt zugleich die Vorstellung der Verteilung über das Gebiet.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: über das ganze Land
  rationale: Die hebräische Wendung beschreibt die weite geografische Ausdehnung. „Land“ bezeichnet hier das örtliche Kampfgebiet, nicht die gesamte Erde; die körperhafte Wendung „über das Angesicht“ wäre im heutigen Deutschen unnötig sperrig.
- source_word: וירב … לֶאֱכֹל
  choice: verschlang … mehr
  rationale: רבה mit dem Infinitiv „fressen/verschlingen“ und dem anschließenden Vergleich drückt aus, dass der Wald mehr Todesopfer forderte. Die Wiedergabe bewahrt die anschauliche Personifikation.
- source_word: היער
  choice: der Wald
  rationale: יַעַר bezeichnet ein bewaldetes Gelände; „Wald“ ist im Deutschen die geläufige und bildkräftige Entsprechung.
- source_word: בעם
  choice: vom Volk
  rationale: 'Die Präposition bezeichnet hier innerhalb der Metapher eine Teilmenge: Der Wald verschlang Menschen aus dem Volk. „Mehr vom Volk“ gibt diesen partitiven Sinn knapp wieder.'
- source_word: מֵאֲשֶׁר אָכְלָה הַחֶרֶב
  choice: als das Schwert
  rationale: Der hebräische Vergleich besagt, dass der Wald mehr Menschen verschlang, als das Schwert verschlang. Im Deutschen kann das wiederholte Verb elliptisch entfallen, ohne Vergleich oder Personifikation aufzulösen.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die Formulierung entspricht dem rückverweisenden hebräischen Zeitausdruck und passt zum würdigen Erzählstil.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Metapher des verschlingenden Waldes und der Vergleich mit dem Schwert bleiben erhalten; die Mehrdeutigkeit von נפצית wird in der Fußnote ausgewiesen.
