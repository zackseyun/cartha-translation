base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
translation:
  language: de
  text: 'Und da kam der Kuschiter[a]. Der Kuschiter sagte: »Mein Herr und König möge die gute Nachricht vernehmen! Denn Jahwe hat dir heute gegenüber allen Recht verschafft, die sich gegen dich erhoben haben[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Äthiopier. Hebräisch: der Kuschiter.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: hat heute für dich Recht gesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 'Und sieh: Da'
  rationale: Bewahrt die hervorhebende, anschauliche Funktion des hebräischen Erzählmarkers und leitet zugleich im heutigen Deutsch natürlich das Eintreffen des Boten ein.
- source_word: הַכּוּשִׁי
  choice: der Kuschiter
  rationale: Gibt die Herkunftsbezeichnung mit bestimmtem Artikel wieder. „Kuschiter“ bleibt näher an Kusch als die historisch mögliche, aber geografisch leicht missverständliche Wiedergabe „Äthiopier“.
- source_word: יִתְבַּשֵּׂר
  choice: möge die gute Nachricht vernehmen
  rationale: Gibt die jussive Aussage in der respektvollen höfischen Anrede wieder. „Vernehmen“ ist würdevoll und verständlich, ohne eine reflexive Formulierung künstlich nachzuahmen.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr und König
  rationale: Natürliche deutsche Wiedergabe der höfischen Anrede; „Herr“ bezeichnet hier den menschlichen Gebieter, nicht Gott.
- source_word: שְׁפָטְךָ
  choice: hat dir Recht verschafft
  rationale: Erfasst die forensische Bedeutung von שׁפט als ein richterliches Handeln zugunsten Davids. Die zusätzliche Befreiungsformulierung bindet die Wendung מִיַּד idiomatisch an dieses Handeln an.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מִיַּד
  choice: aus der Gewalt
  rationale: Überträgt das hebräische Bild „aus der Hand“ verständlich als Befreiung aus feindlicher Macht.
- source_word: כָּל הַקָּמִים עָלֶיךָ
  choice: all derer, die sich gegen dich erhoben haben
  rationale: Bewahrt das verbale Bild des feindlichen Aufstehens und passt zum Kontext des Aufstands, ohne die Gegner enger zu bestimmen als der hebräische Text.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; die Umschrift bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Richterliches Handeln Gottes in שְׁפָטְךָ
  choice: hat dir Recht verschafft
  alternative: hat für dich Recht gesprochen / hat dich gerichtet
  rationale: Im Zusammenhang bezeichnet das Verb Gottes gerichtliches Eingreifen zugunsten des Königs und seine Befreiung von den Gegnern. „Hat dich gerichtet“ wäre im Deutschen leicht als Verurteilung misszuverstehen; die Fußnote hält die wörtlichere gerichtliche Ausdrucksweise offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobener höfischer Rede. Die Erzählung bleibt anschaulich; ungebräuchliche Satzkonstruktionen und konfessionell geprägte Zusätze werden vermieden.
