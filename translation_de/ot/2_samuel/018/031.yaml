revisions:
- from: 'Und sieh: Da kam der Kuschiter[a]. Der Kuschiter sagte: »Mein Herr und König möge die gute Nachricht vernehmen! Denn Jahwe hat dir heute Recht verschafft[b] und dich aus der Gewalt all derer befreit, die sich gegen dich erhoben haben.«'
  to: 'Und da kam der Kuschiter[a]. Der Kuschiter sagte: »Mein Herr und König möge die gute Nachricht vernehmen! Denn Jahwe hat dir heute gegenüber allen Recht verschafft, die sich gegen dich erhoben haben[b].«'
  rationale: Die Revision glättet die Einleitung, ohne ihre hervorhebende Erzählfunktion aufzugeben. Sie bildet שְׁפָטְךָ zusammen mit der Gegnergruppe als gerichtliches Handeln zugunsten Davids ab, ohne die in „aus der Hand“ mitgemeinte Befreiung als eigenständige zweite Handlung hinzuzufügen. Die Fußnote wird auf eine im Deutschen klare und kontextgerechte lexikalische Alternative beschränkt.
