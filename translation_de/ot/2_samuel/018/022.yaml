  to: 'Da bat Ahimaaz, der Sohn Zadoks, Joab noch einmal: »Was auch geschieht, lass mich bitte ebenfalls hinter dem Kuschiter herlaufen.« Doch Joab sagte: »Warum läufst du denn, mein Sohn, wenn du keine Nachricht hast, die dir Lohn einbringt?«[a]'
