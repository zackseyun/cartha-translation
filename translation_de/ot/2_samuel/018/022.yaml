  text: וַ/יֹּ֨סֶף ע֜וֹד אֲחִימַ֤עַץ בֶּן צָדוֹק֙ וַ/יֹּ֣אמֶר אֶל יוֹאָ֔ב וִ֣/יהִי מָ֔ה אָרֻֽצָה נָּ֥א גַם אָ֖נִי אַחֲרֵ֣י הַ/כּוּשִׁ֑י וַ/יֹּ֣אמֶר יוֹאָ֗ב לָֽ/מָּה זֶּ֞ה אַתָּ֥ה רָץ֙ בְּנִ֔/י וּ/לְ/כָ֖ה אֵין בְּשׂוֹרָ֥ה מֹצֵֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/022.yaml
  text: Then Ahimaaz son of Zadok said again to Joab[a], “Whatever happens, please let me also run after the Cushite.” But Joab said, “Why would you run, my son[b], since you have no message that will bring reward?”
translation:
  language: de
  text: 'Da bat Ahimaaz, der Sohn Zadoks, Joab noch einmal: »Was auch geschieht, lass mich bitte ebenfalls hinter dem Kuschiter herlaufen.« Doch Joab sagte: »Warum läufst du denn, mein Sohn, wenn du keine Nachricht hast, die dir Lohn einbringt?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Schlusssatz ist schwer verständlich. Möglich ist auch: »Du hast keine Nachricht, die günstig aufgenommen werden wird.«'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... וַיֹּאמֶר
  choice: bat ... noch einmal
  rationale: Die wörtliche Wendung »fügte nochmals hinzu und sagte« kennzeichnet eine wiederholte Bitte. Im Deutschen gibt »bat ... noch einmal« sowohl den Sprechakt als auch den Zusammenhang natürlich wieder.
- source_word: וִיהִי מָה
  choice: Was auch geschieht
  rationale: Die idiomatische Wendung drückt aus, dass Ahimaaz ungeachtet der möglichen Folgen auf seiner Bitte beharrt.
- source_word: אָרֻצָה נָּא
  choice: lass mich bitte ... laufen
  rationale: Der Kohortativ mit נָא ist eine nachdrückliche, höflich formulierte Bitte.
- source_word: גַם אֲנִי
  choice: mich ... ebenfalls
  rationale: Die Formulierung bewahrt den Nachdruck darauf, dass Ahimaaz als weiterer Läufer aufbrechen möchte.
- source_word: הַכּוּשִׁי
  choice: der Kuschiter
  rationale: Dies gibt die Volksbezeichnung direkt und historisch angemessen wieder, ohne sie vorschnell mit dem heutigen Äthiopien gleichzusetzen.
- source_word: לָמָּה זֶּה אַתָּה רָץ
  choice: Warum willst du denn laufen
  rationale: »Denn« vermittelt in natürlichem Deutsch den erstaunt-einwendenden Ton und einen Teil der demonstrativen Verstärkung durch זֶה.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die Anrede wahrt den vertraulichen oder möglicherweise herablassenden Ton, ohne eine leibliche Verwandtschaft vorauszusetzen.
- source_word: אֵין בְּשׂוֹרָה מֹצֵאת
  choice: Für diese Nachricht wirst du keinen Lohn bekommen
  rationale: 'Die schwierige elliptische Klausel wird entsprechend einer gut belegten kontextuellen Deutung wiedergegeben: Die Übermittlung wird Ahimaaz keinen Gewinn oder Lohn einbringen. Die verbleibende Mehrdeutigkeit wird in der Fußnote offengelegt.'
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede klingt eindringlich, aber nicht altertümlich. »Kuschiter« erhält die historische Volksbezeichnung; die Unsicherheit der Schlussklausel wird nicht verdeckt, sondern in einer Fußnote ausgewiesen.
