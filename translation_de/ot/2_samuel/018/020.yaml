base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/020.yaml
  text: Joab said to him[a], “You are not a bearer of news today. You may carry news on another day, but today you must not carry news, because the king’s son is dead.”
translation:
  language: de
  text: 'Joab sagte zu ihm: „Heute bist du kein Nachrichtenbote.[a] An einem anderen Tag kannst du eine Nachricht überbringen; heute aber sollst du keine Nachricht überbringen, denn der Sohn des Königs ist tot.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Überbringer einer guten Nachricht“. Das hebräische Wort kann eine Nachricht oder Botschaft bezeichnen, häufig eine erfreuliche; hier geht es jedoch um den Tod des Königssohnes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּשֹׂרָה
  choice: Überbringer der Nachricht
  rationale: Die Wendung bezeichnet wörtlich einen »Mann der Nachricht/Botschaft«. Die gewählte Form ist im Deutschen natürlich und lässt offen, ob die Nachricht als gut verstanden wird.
- source_word: וּבִשַּׂרְתָּ
  choice: kannst du eine Nachricht überbringen
  rationale: Im Gegensatz zum Verbot für den heutigen Tag bezeichnet die Form hier eine künftige Möglichkeit beziehungsweise Erlaubnis.
- source_word: לֹא תְבַשֵּׂר
  choice: sollst du keine Nachricht überbringen
  rationale: Das Imperfekt mit לֹא hat in Joabs direkter Rede verbietende Kraft; »sollst du nicht« gibt dies in würdigem, aktuellem Deutsch wieder.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für Joabs Verbot ein und entspricht dem gehobenen Erzählregister.
- source_word: בֶּן הַמֶּלֶךְ
  choice: der Sohn des Königs
  rationale: Gibt die hebräische Genitivverbindung klar und direkt wieder.
- source_word: מֵת
  choice: ist tot
  rationale: Bewahrt den resultativen beziehungsweise stativen Sinn der Aussage.
- source_word: הַיּוֹם הַזֶּה
  choice: heute
  rationale: Eine natürliche moderne Wiedergabe der wiederholten Zeitangabe.
theological_decisions: []
