  text: וַ/יִּנָּ֤גְפוּ שָׁם֙ עַ֣ם יִשְׂרָאֵ֔ל לִ/פְנֵ֖י עַבְדֵ֣י דָוִ֑ד וַ/תְּהִי שָׁ֞ם הַ/מַּגֵּפָ֧ה גְדוֹלָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא עֶשְׂרִ֥ים אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/007.yaml
  text: 'There the people of Israel were defeated before the servants of David[b][a], and the slaughter there was great on that day: twenty thousand men.'
translation:
  language: de
  text: 'Dort wurde das Volk Israel von Davids Männern besiegt, und an jenem Tag gab es dort ein großes Blutbad: zwanzigtausend Mann[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zwanzigtausend«. »Mann« ist aus dem Zusammenhang der Schlacht ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְפוּ
  choice: wurde … besiegt
  rationale: Das Nifal von נָגַף bezeichnet hier das Unterliegen im Kampf. »Wurde besiegt« gibt den militärischen Sinn klar wieder, ohne zu behaupten, jeder Einzelne sei erschlagen worden.
- source_word: עַם יִשְׂרָאֵל
  choice: das Volk Israel
  rationale: Die wörtliche Bezeichnung bleibt erhalten; im Zusammenhang sind damit die israelitischen Streitkräfte gemeint.
- source_word: לִפְנֵי
  choice: von
  rationale: In Verbindung mit einer Niederlage bezeichnet לִפְנֵי die überlegene Gegenseite. Das deutsche Passiv verlangt hier idiomatisch »von«.
- source_word: עַבְדֵי דָוִד
  choice: Davids Männer
  rationale: עֶבֶד kann Diener, Gefolgsmann oder Untergebener bedeuten. Im Schlachtbericht sind Davids Gefolgsleute beziehungsweise Truppen gemeint; »Davids Männer« ist natürlich und vermeidet den heute leicht häuslich verstandenen Ausdruck »Diener«.
- source_word: הַמַּגֵּפָה
  choice: das Gemetzel
  rationale: מַגֵּפָה kann auch eine Plage oder einen schweren Schlag bezeichnen. Hier verweist das Wort auf das massenhafte Töten in der Schlacht; »Gemetzel« gibt diese konkrete, tödliche Bedeutung wieder.
- source_word: גְדוֹלָה
  choice: war … groß
  rationale: Die schlichte Größenangabe des Hebräischen wird bewahrt und ist mit »Gemetzel« im gehobenen Erzählstil verständlich.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche und genaue Wiedergabe der üblichen hebräischen Zeitangabe.
- source_word: עֶשְׂרִים אָלֶף
  choice: zwanzigtausend Mann
  rationale: Im Hebräischen steht nur die Zahl. »Mann« verdeutlicht im Deutschen, dass die Zahl sich im Schlachtzusammenhang auf Kämpfer beziehungsweise Gefallene bezieht; die Ergänzung wird in einer Fußnote kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. »Davids Männer« ist im Deutschen natürlicher als »Davids Diener« und bezeichnet hier sein militärisches Gefolge. Das drastische »Gemetzel« bewahrt die tödliche Wucht von מַגֵּפָה in diesem Kampfbericht.
