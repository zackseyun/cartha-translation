translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und entschieden. „Terebinthe“ bewahrt die wahrscheinlich genaue Baumbezeichnung; die geläufigere Alternative steht in der Fußnote. Die Fußnotenmarker sind unmittelbar an den jeweils erklärten Wörtern gesetzt.
