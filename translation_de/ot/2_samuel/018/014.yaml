source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֔ב לֹא כֵ֖ן אֹחִ֣ילָה לְ/פָנֶ֑י/ךָ וַ/יִּקַּח֩ שְׁלֹשָׁ֨ה שְׁבָטִ֜ים בְּ/כַפּ֗/וֹ וַ/יִּתְקָעֵ/ם֙ בְּ/לֵ֣ב אַבְשָׁל֔וֹם עוֹדֶ֥/נּוּ חַ֖י בְּ/לֵ֥ב הָ/אֵלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/014.yaml
  text: Joab said[a], “Not so[b]; I will not wait before you.” Then he took three spears in his hand and drove them into the heart of Absalom while he was still alive in the heart of the terebinth.
translation:
  language: de
  text: 'Joab sagte: »Nicht so! Ich will mich vor deinen Augen nicht länger aufhalten.« Dann nahm er drei Spieße[a] in die Hand und stieß sie Absalom ins Herz, während dieser noch lebte, mitten in der Terebinthe[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »drei Stäbe« beziehungsweise »drei Stöcke«. Das hebräische Wort kann einen Stab, Stock oder ein Zepter bezeichnen; hier sind wahrscheinlich zum Zustoßen verwendete Waffen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Eiche«. Das hebräische Wort אֵלָה bezeichnet häufig eine Terebinthe; in Übersetzungen wird es auch als »Eiche« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹחִילָה לְפָנֶיךָ
  choice: ich will mich vor deinen Augen nicht länger aufhalten
  rationale: Die Hifil-Form von יחל bezeichnet hier ein Warten oder Zögern; לְפָנֶיךָ bedeutet wörtlich „vor dir“. Die Formulierung gibt Joabs Weigerung wieder, in Gegenwart des Angesprochenen weiter zu zögern.
- source_word: שְׁלֹשָׁה שְׁבָטִים
  choice: drei Spieße
  rationale: שֵׁבֶט kann Stab, Stock oder Zepter bedeuten. Da Joab die Gegenstände in Absaloms Herz stößt, bezeichnet das Wort hier wahrscheinlich spießartige Stichwaffen. Die weitere lexikalische Spannweite wird in einer Fußnote bewahrt.
- source_word: וַיִּתְקָעֵם
  choice: und stieß sie … ins Herz
  rationale: תקע bezeichnet hier ein kräftiges Hineinstoßen. „Stieß sie … ins Herz“ ist im Deutschen natürlich und bewahrt die gewaltsame, zielgerichtete Handlung.
- source_word: בְּלֵב אַבְשָׁלוֹם
  choice: Absalom ins Herz
  rationale: Das anatomisch direkte „Herz“ wird beibehalten und nicht zu „Brust“ verallgemeinert.
- source_word: עוֹדֶנּוּ חַי
  choice: während dieser … noch lebte
  rationale: Die Wendung betont, dass Absalom zu diesem Zeitpunkt noch am Leben war. „Dieser“ stellt den Bezug auf Absalom eindeutig her.
- source_word: בְּלֵב הָאֵלָה
  choice: im Innern der Terebinthe
  rationale: אֵלָה bezeichnet gewöhnlich eine Terebinthe. Das wiederholte לֵב bedeutet hier räumlich die Mitte beziehungsweise das Innere des Baumes; „im Innern“ gibt den Sinn in natürlichem Deutsch wieder, während das zuvor anatomisch gebrauchte „Herz“ erhalten bleibt.
