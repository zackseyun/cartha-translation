  text: Then ten young men, Joab’s armor-bearers, surrounded Absalom and struck him and killed him.
translation:
  language: de
  text: Da umringten zehn junge Männer, Joabs Waffenträger, Abschalom; sie schlugen ihn und töteten ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: umringten
  rationale: סבב bezeichnet hier das Umschließen einer Person. „Umringten“ gibt die räumliche und taktische Handlung natürlich und präzise wieder.
- source_word: עֲשָׂרָה נְעָרִים
  choice: zehn junge Männer
  rationale: נְעָרִים bezeichnet in diesem militärischen Dienstzusammenhang junge Männer beziehungsweise Untergebene, nicht Kinder. Die Wiedergabe wahrt den lexikalischen Sinn, ohne einen genaueren Rang festzulegen.
- source_word: נֹשְׂאֵי כְּלֵי יוֹאָב
  choice: Joabs Waffenträger
  rationale: Die Wendung bedeutet wörtlich „Träger der Geräte/Waffen Joabs“. „Waffenträger“ ist im militärischen Zusammenhang treffend und lässt offen, welche Ausrüstung sie im Einzelnen trugen.
- source_word: וַיַּכּוּ
  choice: sie schlugen auf ihn ein
  rationale: נכה bezeichnet das Schlagen oder Verwunden. Im Zusammenhang einer gemeinschaftlichen tödlichen Attacke gibt „schlugen auf ihn ein“ die fortgesetzte körperliche Gewalttat idiomatisch wieder.
- source_word: וַיְמִיתֻהוּ
  choice: töteten ihn
  rationale: Die Hifil-Form von מות bedeutet „den Tod verursachen“, also „töten“. Die direkte Wiedergabe entspricht der knappen Erzählweise.
- source_word: אַבְשָׁלוֹם
  choice: Abschalom
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Namensform wiedergegeben.
