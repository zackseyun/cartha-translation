base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/028.yaml
  text: Ahimaaz called out and said to the king[a], “Peace!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God[b], who has delivered up the men who lifted their hand against my lord the king.”
translation:
  language: de
  text: 'Ahimaaz rief dem König zu: „Friede!“[a] Dann warf er sich vor dem König mit dem Gesicht zur Erde nieder und sagte: „Gepriesen sei Jahwe, dein Gott, der die Männer ausgeliefert hat,[b] die ihre Hand gegen meinen Herrn, den König, erhoben haben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alles ist gut!“ Das hebräische schalom kann in diesem Zusammenhang Wohlergehen oder eine günstige Nachricht ausdrücken, nicht nur einen Gruß.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in die Hand gegeben hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief … zu
  rationale: Gibt den lauten Zuruf eines herannahenden Boten natürlich und erzählerisch passend wieder.
- source_word: שָׁלוֹם
  choice: Friede!
  rationale: Bewahrt die knappe hebräische Form und ihre Bedeutungsweite zwischen Gruß, Wohlergehen und guter Nachricht.
- source_word: וַיִּשְׁתַּחוּ לַמֶּלֶךְ לְאַפָּיו אָרְצָה
  choice: warf er sich vor dem König nieder, mit dem Gesicht zur Erde
  rationale: Beschreibt die konkrete körperliche Huldigung, ohne sie lediglich abstrakt als Ehrerweisung zu deuten.
- source_word: בָּרוּךְ יְהוָה אֱלֹהֶיךָ
  choice: Gepriesen sei Jahwe, dein Gott
  rationale: Entspricht der doxologischen Segensformel und gibt den Gottesnamen als Jahwe wieder.
- source_word: סִגַּר
  choice: ausgeliefert hat
  rationale: Das Verb bezeichnet hier die Übergabe der Gegner in fremde Gewalt; „ausgeliefert“ passt zum militärisch-politischen Zusammenhang.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Bezeichnet die konkreten männlichen Gegner im Aufstand.
- source_word: נָשְׂאוּ אֶת יָדָם
  choice: ihre Hand … erhoben haben
  rationale: Bewahrt das anschauliche hebräische Bild für feindliches Vorgehen oder Auflehnung.
- source_word: בַּאדֹנִי הַמֶּלֶךְ
  choice: gegen meinen Herrn, den König
  rationale: Erhält die höfische und ehrerbietige Anrede an David.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ gibt den persönlichen Gottesnamen als verbreitete wissenschaftliche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Botenmeldung „Friede!“ und das hebräische Bild vom Erheben der Hand bleiben erhalten; die vollständige Niederwerfung wird konkret und verständlich beschrieben.
