  source_fidelity: Die Hauptübersetzung „auf eigene Gefahr“ folgt nicht dem im angegebenen WLC-Text stehenden Ketiv בְּנַפְשׁוֹ („gegen/auf sein Leben“), sondern nimmt eine kontextuelle Deutung beziehungsweise die Qere-Richtung vor. Da der Personenbezug hier textlich strittig ist, sollte der Ketiv im Haupttext wiedergegeben und die Qere-Lesung in einer Fußnote vermerkt werden. Die Aussage, dass dem König nichts verborgen bleibt, und die Konsequenz, dass Joab sich ferngehalten hätte, sind sachgerecht.
  naturalness: „Gegen sein Leben hinterlistig gehandelt“ ist im Deutschen klar und behält die absichtlich harte, lebensbezogene Formulierung des Hebräischen bei. „Dich selbst ferngehalten“ ist idiomatischer als „abseitsgestanden“ und gibt die kontextuelle Distanzierung angemessen wieder.
  terminology: „Hinterlistig gehandelt“ gibt עָשָׂה שֶׁקֶר angemessen wieder, ohne eine speziell theologische oder rechtstechnische Bedeutung einzutragen. Die Fußnote unterscheidet Ketiv und Qere präzise und wahrt die Mehrdeutigkeit.
