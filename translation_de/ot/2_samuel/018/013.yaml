- from: Oder wenn ich auf eigene Gefahr[a] treulos gehandelt hätte – und dem König bleibt keine Sache verborgen –, dann hättest du selbst abseitsgestanden.
  to: Oder wenn ich gegen sein Leben hinterlistig gehandelt hätte – und dem König bleibt keine Sache verborgen –, dann hättest du dich selbst ferngehalten.[a]
  rationale: Die Revision gibt den im WLC überlieferten Ketiv im Haupttext wieder und dokumentiert die traditionelle abweichende Qere-Lesung in einer knapp verankerten Fußnote. Zugleich wird die abschließende Wendung idiomatischer formuliert, ohne ihren Sinn zu verändern.
