base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/013.yaml
  text: Or if I had dealt falsely against his life, and no matter is hidden from the king, then you yourself would have stood aside.
translation:
  language: de
  text: Oder wenn ich gegen sein Leben hinterlistig gehandelt hätte – und dem König bleibt keine Sache verborgen –, dann hättest du dich selbst ferngehalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Konsonantentext hat „gegen sein Leben“; die traditionelle Lesung (Qere) lautet „gegen mein Leben“.
    reason: Der Personenbezug des Suffixes ist zwischen Ketiv und Qere abweichend und soll transparent bleiben.
lexical_decisions:
- source_word: 'בְנַפְשׁוֹ (Ketiv: ב/נפש/ו)'
  choice: auf eigene Gefahr
  rationale: 'Die präpositionale Wendung ist kontextuell am natürlichsten auf das Leben des Sprechers bezogen: Hätte er gegen den königlichen Befehl gehandelt, hätte er damit sein eigenes Leben gefährdet. Die ungewöhnliche Formulierung und eine mögliche abweichende Deutung werden in der Fußnote offengehalten.'
- source_word: עָשִׂיתִי ... שֶׁקֶר
  choice: treulos gehandelt hätte
  rationale: Die Verbindung bezeichnet falsches beziehungsweise treuloses Handeln; „treulos handeln“ gibt den moralischen und loyalitätsbezogenen Gehalt im Kontext wieder.
- source_word: וְכָל־דָּבָר לֹא־יִכָּחֵד מִן־הַמֶּלֶךְ
  choice: und dem König bleibt keine Sache verborgen
  rationale: Bewahrt die allgemeine Aussage des Hebräischen und die präsentisch-gnomische Kraft des Imperfekts.
- source_word: תִּתְיַצֵּב מִנֶּגֶד
  choice: hättest du selbst abseitsgestanden
  rationale: Die Wendung meint, sich in Distanz beziehungsweise gegenüber zu stellen; im Kontext ist gemeint, dass Joab dem Sprecher bei der Aufdeckung nicht beigestanden hätte.
theological_decisions:
- issue: Bezug von בְנַפְשׁוֹ und überlieferte Lesart
  choice: Im Haupttext als Gefährdung des eigenen Lebens des Sprechers wiedergegeben
  alternative: „gegen sein Leben“ beziehungsweise „an seinem Leben“; nach Qere/traditioneller Lesung auch ausdrücklich „gegen mein Leben“
  rationale: Der Kontext verlangt keine dogmatische Festlegung, sondern eine textkritisch und syntaktisch schwierige Entscheidung. Die Übersetzung folgt dem wahrscheinlichen Sinnzusammenhang, während die Fußnote die echte Mehrdeutigkeit transparent macht.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Gedankenstrich markiert den eingeschobenen Grundsatz über die Kenntnis des Königs. „Abseitsgestanden“ bewahrt das räumliche Bild, klingt aber im Kontext zugleich nach verweigerter Unterstützung.
