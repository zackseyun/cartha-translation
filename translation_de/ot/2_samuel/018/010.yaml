    rationale: Das hebräische בָּאֵלָה kann mit »an einer Terebinthe« natürlich wiedergegeben werden. »In der Terebinthe« ist nicht falsch, kann aber im Deutschen unnötig den Eindruck erzeugen, Absalom befinde sich im Inneren des Baumes.
  - severity: low
    issue: »meldete es Joab« klingt leicht verwaltungssprachlich
    rationale: Für נגד im knappen Erzählstil ist »berichtete Joab« natürlicher und übermittelt denselben Sachverhalt.
