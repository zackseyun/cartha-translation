base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/010.yaml
  text: One man saw it and told Joab[a], and said, “Look, I saw Absalom hanging in the terebinth tree.”
translation:
  language: de
  text: 'Ein Mann sah es und berichtete Joab. Er sagte: »Sieh, ich habe Absalom an einer Terebinthe hängen sehen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an einer Eiche«. Das hebräische Wort אֵלָה bezeichnet eine Terebinthe und wird bisweilen allgemeiner mit »Eiche« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: Ein Mann
  rationale: Die Wendung bezeichnet einen einzelnen Mann. »Ein Mann« ist im Deutschen natürlich und bewahrt Numerus und Geschlecht der hebräischen Formulierung.
- source_word: וַיַּרְא
  choice: sah es
  rationale: Das Verb bedeutet »sehen«. Das im Zusammenhang vorausgesetzte Objekt wird mit »es« knapp ergänzt, damit der deutsche Satz vollständig und natürlich klingt.
- source_word: וַיַּגֵּד לְיוֹאָב
  choice: meldete es Joab
  rationale: נגד bezeichnet hier das Überbringen einer Nachricht. »Meldete es Joab« passt zum militärischen Erzählzusammenhang und gibt auch den Empfänger wieder.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel hebt die folgende Mitteilung hervor. »Sieh« bewahrt diesen deiktischen Nachdruck in würdiger, nicht altertümlicher Sprache.
- source_word: רָאִיתִי
  choice: ich habe … sehen sehen
  rationale: Gemeint ist eine abgeschlossene Wahrnehmung, die für die gegenwärtige Meldung relevant ist. Im natürlichen Deutschen wird dies idiomatisch durch »ich habe … hängen sehen« ausgedrückt.
- source_word: תָּלוּי
  choice: hängen
  rationale: 'Das passive Partizip beschreibt Absaloms fortdauernden Zustand: Er war aufgehängt beziehungsweise hing fest. In der Konstruktion mit »sehen« ist »hängen« die natürliche deutsche Form.'
- source_word: בָּאֵלָה
  choice: in der Terebinthe
  rationale: אֵלָה bezeichnet wahrscheinlich eine Terebinthe. Die Präposition ב passt im Kontext zu »in«, da Absalom im Geäst des Baumes hing; der bestimmte Artikel wird durch »der« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die direkte Rede bleibt knapp und bewahrt durch »Sieh« den Nachdruck des hebräischen הִנֵּה.
