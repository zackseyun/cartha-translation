  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם לֹ֣א תֵצֵ֗א כִּי֩ אִם נֹ֨ס נָנ֜וּס לֹא יָשִׂ֧ימוּ אֵלֵ֣י/נוּ לֵ֗ב וְ/אִם יָמֻ֤תוּ חֶצְיֵ֨/נוּ֙ לֹֽא יָשִׂ֤ימוּ אֵלֵ֨י/נוּ֙ לֵ֔ב כִּֽי עַתָּ֥ה כָמֹ֖/נוּ עֲשָׂרָ֣ה אֲלָפִ֑ים וְ/עַתָּ֣ה ט֔וֹב כִּי תִֽהְיֶה לָּ֥/נוּ מֵ/עִ֖יר ל/עזיר־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/003.yaml
  text: But the people said[a], “You must not go out, for if we flee, they will not pay attention to us; and if half of us die, they will not pay attention to us. For you are worth ten thousand of us[c][b]; so now it is better that you be ready to help us from the city.”
translation:
  language: de
  text: 'Doch das Volk sagte: »Du darfst nicht mit hinausziehen. Denn wenn wir fliehen, werden sie uns keine Beachtung schenken[a]; und wenn die Hälfte von uns stirbt, werden sie uns keine Beachtung schenken. Denn du zählst jetzt so viel wie zehntausend von uns[b]. Darum ist es besser, wenn du uns von der Stadt aus Hilfe leisten kannst[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie werden ihr Herz nicht auf uns richten.« Gemeint ist, dass das feindliche Heer den Truppen ohne David keine besondere Aufmerksamkeit schenken wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Denn jetzt bist du wie zehntausend von uns.«'
    reason: lexical_alternative
  - marker: c
    text: Die schwierige hebräische Schlussform wird gewöhnlich von dem Verb für »helfen« abgeleitet. Gemeint ist wahrscheinlich, dass David in der Stadt bleiben und von dort aus bei Bedarf Unterstützung leisten soll.
    reason: textual_or_cultural_note
lexical_decisions:
- source_word: לֹא תֵצֵא
  choice: Du darfst nicht mit hinausziehen
  rationale: Die verneinte Imperfektform drückt hier eine nachdrückliche Aufforderung aus. „Mit hinausziehen“ verdeutlicht im militärischen Zusammenhang, dass David nicht mit dem Heer ausrücken soll.
- source_word: כִּי אִם נֹס נָנוּס
  choice: Denn wenn wir fliehen
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam das Verb. Im Deutschen gibt der konditionale Satz den Sinn natürlich wieder; die Wiederholung „fliehend fliehen“ wäre unverständlich und unidiomatisch.
- source_word: לֹא יָשִׂימוּ אֵלֵינוּ לֵב
  choice: werden sie uns keine Beachtung schenken
  rationale: Die hebräische Wendung bedeutet wörtlich, das Herz auf jemanden zu richten. Hier bezeichnet sie die Aufmerksamkeit und das vorrangige Interesse des feindlichen Heeres.
- source_word: וְאִם יָמֻתוּ חֶצְיֵנוּ
  choice: und selbst wenn die Hälfte von uns stirbt
  rationale: „Stirbt“ bleibt nahe am allgemeinen Verb מות. „Selbst wenn“ bringt die steigernde, im Zusammenhang deutlich konzessive Fortführung des Arguments zum Ausdruck.
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  choice: Denn du zählst jetzt so viel wie zehntausend von uns
  rationale: Die Formulierung bewahrt das im masoretischen Text stehende „jetzt“ und gibt den Vergleich als Aussage über Davids außerordentliche Bedeutung für das Heer wieder, ohne eine rein wirtschaftliche Wertvorstellung aufzudrängen.
- source_word: וְעַתָּה טוֹב
  choice: Darum ist es besser
  rationale: טוֹב bezeichnet hier die vorzuziehende Handlungsweise. „Darum“ stellt den Folgerungszusammenhang im Deutschen klar dar; ein weiteres „jetzt“ wäre nach dem vorherigen Satz unnötig schwerfällig.
- source_word: מֵעִיר לְעָזִיר
  choice: wenn du uns von der Stadt aus zu Hilfe kommen kannst
  rationale: מן bezeichnet den Ausgangsort. Die schwierige Schlussform wird entsprechend der üblichen Herleitung von עזר als Hilfe oder Unterstützung verstanden; die Formulierung lässt offen, wie diese Hilfe konkret erfolgen soll.
