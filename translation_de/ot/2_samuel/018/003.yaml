  register: Modernes, würdevolles Standarddeutsch mit direkter militärischer Rede. Die Wiederholung „werden sie uns keine Beachtung schenken“ bildet die nachdrückliche Parallelstruktur des Hebräischen ab. Die Schlussaussage bleibt hinsichtlich der konkreten Art von Davids Hilfe bewusst offen.
