  to: 'Doch das Volk sagte: »Du darfst nicht mit hinausziehen. Denn wenn wir fliehen, werden sie uns keine Beachtung schenken[a]; und wenn die Hälfte von uns stirbt, werden sie uns keine Beachtung schenken. Denn du zählst jetzt so viel wie zehntausend von uns[b]. Darum ist es besser, wenn du uns von der Stadt aus Hilfe leisten kannst[c].«'
