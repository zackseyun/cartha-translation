  terminology: »Truppen«, »unter dem Befehl«, die Namen Abischai, Zeruja und Ittai sowie »der Gatiter« sind angemessen. Die Herkunftsbezeichnung bleibt als Gentilizium erhalten und wird nicht interpretierend erklärt.
