  text: וַ/יְשַׁלַּ֨ח דָּוִ֜ד אֶת הָ/עָ֗ם הַ/שְּׁלִשִׁ֤ית בְּ/יַד יוֹאָב֙ וְ֠/הַ/שְּׁלִשִׁית בְּ/יַ֨ד אֲבִישַׁ֤י בֶּן צְרוּיָה֙ אֲחִ֣י יוֹאָ֔ב וְ/הַ֨/שְּׁלִשִׁ֔ת בְּ/יַ֖ד אִתַּ֣י הַ/גִּתִּ֑י וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל הָ/עָ֔ם יָצֹ֥א אֵצֵ֛א גַּם אֲנִ֖י עִמָּ/כֶֽם־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/002.yaml
  text: 'David sent out the troops: one third under Joab[a], one third under Abishai son of Zeruiah, Joab’s brother, and one third under Ittai the Gittite. And the king said to the troops, “I myself will surely go out with you.”'
translation:
  language: de
  text: 'David ließ die Truppen ausrücken: ein Drittel unter dem Befehl Joabs[a], ein Drittel unter dem Befehl Abischais, des Sohnes Zerujas und Bruders Joabs, und ein Drittel unter dem Befehl Ittais, des Gatiters. Der König sagte zu den Truppen: »Auch ich will gewiss mit euch ausrücken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in der Hand Joabs«; eine hebräische Wendung mit der Bedeutung »unter seiner Autorität« oder »unter seinem Befehl«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: ließ … ausrücken
  rationale: Im militärischen Zusammenhang bezeichnet das Verb die Entsendung der Streitkräfte zum Einsatz. Die deutsche Wendung ist natürlich und bewahrt die Bewegungsrichtung.
- source_word: הָעָם
  choice: die Truppen
  rationale: Wörtlich bedeutet das Wort »das Volk«, bezeichnet hier aber im unmittelbaren Kampfzusammenhang Davids Streitkräfte.
- source_word: הַשְּׁלִשִׁית / הַשְּׁלִשִׁת
  choice: ein Drittel
  rationale: Die dreimalige Form bezeichnet jeweils eine der drei Abteilungen des Heeres.
- source_word: בְּיַד
  choice: unter dem Befehl
  rationale: Das wörtliche »in der Hand von« ist hier ein Idiom für die Unterstellung unter die Autorität beziehungsweise Führung eines Befehlshabers.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Abischai, des Sohnes Zerujas und Bruders Joabs
  rationale: Die appositionale Formulierung bewahrt beide Verwandtschaftsangaben und klingt im Deutschen natürlich.
- source_word: אִתַּי הַגִּתִּי
  choice: Ittai, des Gatiters
  rationale: Der Name wird gebräuchlich transkribiert; die Herkunftsbezeichnung identifiziert Ittai als Mann aus Gat.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Der König sagte
  rationale: Die deutsche Erzählprosa benötigt hier kein ausdrückliches »und«; die Bezeichnung »der König« bleibt erhalten.
- source_word: יָצֹא אֵצֵא
  choice: werde auf jeden Fall … ausrücken
  rationale: Der Infinitivus absolutus vor der finiten Verbform verstärkt die Aussage; »auf jeden Fall« gibt diese Bekräftigung verständlich wieder.
- source_word: גַּם אֲנִי
  choice: Auch ich selbst
  rationale: Die Formulierung bewahrt sowohl das einschließende גַּם als auch die Betonung des ausdrücklich gesetzten Pronomens.
- source_word: עִמָּכֶם
  choice: mit euch
  rationale: Die Präpositionalphrase bezeichnet die Begleitung beziehungsweise gemeinsame Teilnahme am Kampf.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle deutsche Erzählprosa. Militärische Begriffe werden klar, aber nicht technisierend wiedergegeben. Die Bekräftigung der persönlichen Teilnahme des Königs bleibt durch »Auch ich selbst« und »auf jeden Fall« erhalten.
