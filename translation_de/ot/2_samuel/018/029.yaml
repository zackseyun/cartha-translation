base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/029.yaml
  text: And the king said[a], “Is it well with the young man Absalom?” Ahimaaz said, “I saw a great commotion when Joab sent the king’s servant and your servant, but I did not know what it was.”
translation:
  language: de
  text: 'Da fragte der König: „Geht es dem jungen Mann Absalom gut?“ Ahimaaz antwortete: „Ich sah das große Getümmel[a], als Joab den Diener des Königs und deinen Diener losschickte; aber ich wusste nicht, worum es ging.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine große Menschenmenge“ oder „großen Aufruhr“; das hebräische Wort kann eine Menge, Lärm oder tumultartige Unruhe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Geht es … gut?
  rationale: In der Frage bezeichnet שָׁלוֹם das Wohlergehen Absaloms. Die Formulierung ist im modernen Deutsch natürlich und legt die Bedeutung nicht einseitig auf körperliche Unversehrtheit fest.
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: dem jungen Mann Absalom
  rationale: נַעַר kann je nach Zusammenhang „Junge“, „junger Mann“ oder „Diener“ bedeuten. Hier bewahrt „junger Mann“ sowohl den Grundsinn als auch Davids indirekte, emotional aufgeladene Bezeichnung seines Sohnes.
- source_word: הֶהָמוֹן הַגָּדוֹל
  choice: ein großes Getümmel
  rationale: הָמוֹן kann eine Menschenmenge, Lärm oder tumultartige Unruhe bezeichnen. „Getümmel“ lässt die im Hebräischen vorhandene Verbindung von Menge, Bewegung und Lärm offen.
- source_word: לִשְׁלֹחַ
  choice: als … losschickte
  rationale: Der Infinitiv mit לְ wird hier idiomatisch als temporaler Nebensatz wiedergegeben. „Losschicken“ passt zum Aussenden von Boten.
- source_word: עֶבֶד הַמֶּלֶךְ
  choice: den Diener des Königs
  rationale: עֶבֶד bezeichnet hier einen königlichen Untergebenen beziehungsweise Boten; „Diener“ ist kontextgemäßer als „Sklave“.
- source_word: וְאֶת עַבְדֶּךָ
  choice: und deinen Diener
  rationale: Die höfische Selbstbezeichnung Ahimaaz’ wird entsprechend der hebräischen Form bewahrt, statt sie schlicht durch „mich“ zu ersetzen.
- source_word: וְלֹא יָדַעְתִּי מָה
  choice: aber ich wusste nicht, worum es ging
  rationale: Das hebräische „ich wusste nicht, was“ ist elliptisch. Die deutsche Fassung ergänzt nur das sprachlich Erforderliche und bewahrt Ahimaaz’ ausweichende Aussage.
theological_decisions: []
