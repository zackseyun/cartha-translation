  register: Moderne, würdige Standardsprache. Die höfische Selbstbezeichnung „deinen Diener“ bleibt erhalten; die Mehrdeutigkeit von הָמוֹן wird im Haupttext nicht übermäßig festgelegt und in der Fußnote ausgewiesen.
