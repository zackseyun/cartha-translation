  text: וַ/אֲחִימַ֤עַץ בֶּן צָדוֹק֙ אָמַ֔ר אָר֣וּצָה נָּ֔א וַ/אֲבַשְּׂרָ֖ה אֶת הַ/מֶּ֑לֶךְ כִּי שְׁפָט֥/וֹ יְהוָ֖ה מִ/יַּ֥ד אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/019.yaml
  text: Then Ahimaaz the son of Zadok said[a], “Please let me run and bring news to the king[b], for Yahweh has delivered him from the hand of his enemies.”
translation:
  language: de
  text: 'Da sagte Ahimaaz, der Sohn Zadoks: »Lass mich doch hinlaufen und dem König die gute Nachricht bringen, denn Jahwe hat ihm gegenüber seinen Feinden Recht verschafft.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »denn Jahwe hat ihm Recht verschafft aus der Hand seiner Feinde«. Die hebräische Wendung verbindet Jahwes richterliches Eintreten für den König mit dessen Befreiung aus der Macht seiner Feinde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִימַעַץ בֶּן־צָדוֹק אָמַר
  choice: Da sagte Ahimaaz, der Sohn Zadoks
  rationale: Das Waw führt die Erzählung weiter; »Da« gibt die zeitliche Folge in natürlichem Deutsch wieder. Die Abstammungsangabe wird als Apposition formuliert.
- source_word: אָרוּצָה נָּא
  choice: Lass mich doch hinlaufen
  rationale: Der Kohortativ drückt Ahimaaz’ Wunsch aus; נָא verleiht der Bitte Nachdruck beziehungsweise Höflichkeit. »doch« bildet diese bittende Nuance idiomatisch ab.
- source_word: וַאֲבַשְּׂרָה אֶת־הַמֶּלֶךְ
  choice: und dem König die gute Nachricht bringen
  rationale: Das Piel von בשׂר bezeichnet das Überbringen beziehungsweise Verkünden einer Nachricht und hat hier wegen des Sieges eindeutig eine erfreuliche Färbung. Die deutsche Konstruktion verlangt den Empfänger im Dativ.
- source_word: כִּי
  choice: dass
  rationale: כִּי kann hier den Inhalt der zu überbringenden Nachricht einleiten. »dass« verbindet die Nachricht unmittelbar mit ihrem Inhalt und ist im Deutschen natürlicher als eine rein begründende Wiedergabe.
- source_word: שְׁפָטוֹ יְהוָה
  choice: dass Jahwe ihm Recht verschafft
  rationale: שׁפט mit pronominalem Objekt bezeichnet hier Gottes richterliches Handeln zugunsten des Königs. »ihm Recht verschafft« bewahrt diese forensische Aussage.
- source_word: מִיַּד אֹיְבָיו
  choice: und ihn aus der Hand seiner Feinde befreit hat
  rationale: Die Wendung bezeichnet Befreiung aus der Macht der Feinde. »Hand« erhält das hebräische Bild; das ergänzende »befreit« macht die resultative Bedeutung des gesamten Satzes im Deutschen deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Verhältnis von richterlicher Rechtfertigung und Rettung in שְׁפָטוֹ ... מִיַּד אֹיְבָיו
  choice: ihm Recht verschafft und ihn aus der Hand seiner Feinde befreit hat
  alternative: ihn aus der Hand seiner Feinde gerettet hat
  rationale: Das Verb שׁפט benennt ausdrücklich richterliches Handeln zugunsten Davids, während מִיַּד אֹיְבָיו dessen rettende Folge beschreibt. Die gewählte Formulierung bewahrt beide Aspekte, ohne den forensischen Sinn auf bloße Rettung zu reduzieren.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; die Transliteration bewahrt diese Form.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. »Lass mich doch« ist eine natürliche deutsche Bitte; »die gute Nachricht bringen« entspricht der positiven Bedeutung von בשׂר im gegebenen Siegeskontext. Die Fußnote bewahrt die ungewöhnlich kompakte hebräische Verbindung von Rechtsprechung und Befreiung.
