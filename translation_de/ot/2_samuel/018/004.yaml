  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/מֶּ֔לֶךְ אֲשֶׁר יִיטַ֥ב בְּ/עֵינֵי/כֶ֖ם אֶעֱשֶׂ֑ה וַ/יַּעֲמֹ֤ד הַ/מֶּ֨לֶךְ֙ אֶל יַ֣ד הַ/שַּׁ֔עַר וְ/כָל הָ/עָם֙ יָֽצְא֔וּ לְ/מֵא֖וֹת וְ/לַ/אֲלָפִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/004.yaml
  text: The king said to them[a], “What seems good in your eyes, I will do.” So the king stood beside the gate[c][b], and all the people went out by hundreds and by thousands.
translation:
  language: de
  text: 'Der König sagte zu ihnen[a]: »Was in euren Augen gut ist, das werde ich tun.« Dann stellte sich der König neben dem Tor[b], und das ganze Volk zog in Hundertschaften und Tausendschaften aus[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Was gut ist in euren Augen, werde ich tun.« Gemeint ist, was sie für richtig oder am besten halten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »beim Tor« beziehungsweise »an der Seite des Tores«. Im Hebräischen steht wörtlich »zur Hand des Tores«, eine Wendung für einen Platz daneben.'
    reason: lexical_alternative
  - marker: c
    text: Das heißt, in geordneten militärischen Einheiten von jeweils hundert beziehungsweise tausend Mann.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יִיטַב בְּעֵינֵיכֶם
  choice: Was in euren Augen gut ist
  rationale: Die Formulierung bewahrt das hebräische Bild der Augen als Ausdruck des Urteils und ist im Deutschen verständlich; gemeint ist, was sie für richtig oder am besten halten.
- source_word: אֶעֱשֶׂה
  choice: das werde ich tun
  rationale: Gibt die einfache und umfassende Bedeutung von עשה wieder, ohne eine zusätzliche Nuance einzutragen.
- source_word: אֶל יַד הַשַּׁעַר
  choice: neben das Tor
  rationale: Die Wendung bedeutet wörtlich etwa »zur Hand des Tores« und bezeichnet idiomatisch eine Position unmittelbar daneben. Mit »stellte sich« ist der Akkusativ im Deutschen natürlich.
- source_word: וְכָל הָעָם
  choice: das ganze Volk
  rationale: Bewahrt die konkrete Ausgangsbedeutung von עָם, obwohl der militärische Zusammenhang hier auch »Kriegsvolk« oder »Truppen« nahelegt.
- source_word: יָצְאוּ
  choice: zog ... aus
  rationale: »Ausziehen« gibt יצא im militärischen Zusammenhang natürlich wieder, ohne die stärker spezifizierende Vorstellung des Marschierens einzutragen.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: in Hundertschaften und Tausendschaften
  rationale: Macht die im Kontext gemeinte Gliederung in militärische Einheiten deutlich und erhält zugleich die Zahlenstruktur des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bewahrt das hebräische Bild »in euren Augen«. »Volk« bleibt als quellennaher Ausdruck stehen; die militärische Bedeutung wird durch »Hundertschaften und Tausendschaften« und die Fußnote verdeutlicht.
