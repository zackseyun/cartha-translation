base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/017.yaml
  text: And they took Absalom and threw him into the great pit in the forest[a], and they set up over him a very large heap of stones. And all Israel fled[b], each man to his tent.
translation:
  language: de
  text: Sie nahmen Abschalom und warfen ihn in die große Grube im Wald. Über ihm errichteten sie einen sehr großen Steinhaufen. Ganz Israel floh, jeder zu seinem Zelt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung bezeichnet die Zerstreuung in die jeweilige Unterkunft, also: nach Hause.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Sie nahmen
  rationale: Die gewöhnliche Erzählbedeutung von לקח wird direkt wiedergegeben, ohne die nicht ausdrücklich bezeichnete Gewalt durch »ergriffen« hinzuzufügen.
- source_word: וַיַּשְׁלִיכוּ אֹתוֹ
  choice: warfen ihn
  rationale: שלך bezeichnet hier die gewaltsame und entehrende Beseitigung des Leichnams; »warfen« ist im modernen Deutschen klar und natürlich.
- source_word: בַיַּעַר
  choice: im Wald
  rationale: יער bezeichnet den bereits im Kontext genannten Wald; der bestimmte Artikel wird durch »im« bewahrt.
- source_word: אֶל הַפַּחַת הַגָּדוֹל
  choice: in die große Grube
  rationale: פחת bezeichnet eine Grube oder Vertiefung. »Grube« ist hier die klare und konkrete deutsche Entsprechung.
- source_word: וַיַּצִּבוּ עָלָיו
  choice: errichteten sie über ihm
  rationale: יצב im Hifil bezeichnet das Aufstellen oder Errichten; zusammen mit dem Steinhaufen gibt »errichteten« den Vorgang idiomatisch und präzise wieder.
- source_word: גַּל אֲבָנִים גָּדוֹל מְאֹד
  choice: einen sehr großen Steinhaufen
  rationale: גל אבנים ist ein Haufen aus Steinen; גדול מאד betont dessen außergewöhnliche Größe. Das Kompositum »Steinhaufen« ist natürliches Deutsch.
- source_word: וְכָל יִשְׂרָאֵל נָסוּ
  choice: Ganz Israel aber floh
  rationale: Der kollektive Name »Israel« bleibt erhalten. Das deutsche Singularverb entspricht dem grammatischen Gebrauch mit dem Kollektiv; »aber« markiert natürlich den Szenenwechsel zur Flucht.
- source_word: אִישׁ לְאֹהָלוֹ
  choice: jeder zu seinem Zelt
  rationale: Die distributive Wendung wird knapp bewahrt. »Zelt« erhält das konkrete hebräische Bild, obwohl die Formel sinngemäß die Rückkehr in die eigene Unterkunft oder nach Hause bezeichnet.
theological_decisions:
- issue: Distributive maskuline Form אִישׁ לְאֹהָלוֹ
  choice: jeder zu seinem Zelt
  alternative: jeder Mann zu seinem Zelt
  rationale: Das deutsche »jeder« gibt die distributive Einzelform natürlich wieder, ohne eine zusätzliche Hervorhebung des Geschlechts zu erzeugen; das Possessivpronomen bewahrt den maskulinen Singular der Vorlage.
- issue: Wörtliche oder idiomatische Wiedergabe von לְאֹהָלוֹ
  choice: zu seinem Zelt
  alternative: nach Hause
  rationale: Das konkrete Bild der Vorlage bleibt im Haupttext erhalten. Da die Formel idiomatisch die Zerstreuung zur eigenen Unterkunft meint, wird diese Bedeutung in einer Fußnote erläutert.
translation_notes:
  register: Moderne, würdevolle Erzählprosa. Kurze Hauptsätze halten die rasche Abfolge der hebräischen Handlung fest. Das konkrete Bild »Zelt« bleibt erhalten und wird knapp erläutert; ungebräuchliche oder altertümliche Wörter werden vermieden.
