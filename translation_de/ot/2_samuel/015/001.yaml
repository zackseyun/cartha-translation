base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/001.yaml
  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
translation:
  language: de
  text: Danach beschaffte sich Absalom einen Wagen und Pferde sowie fünfzig Männer, die vor ihm herliefen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wagen, Pferde und vorauslaufende Männer gehörten zu einem Gefolge, wie es bei königlichen Aufzügen üblich war.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  choice: Danach
  rationale: Die hebräische Erzählformel stellt den zeitlichen Anschluss her. „Danach“ gibt sie in natürlichem, knappem Deutsch wieder.
- source_word: וַיַּעַשׂ לוֹ
  choice: beschaffte sich
  rationale: עשה mit לו kann hier das Herstellen oder Beschaffen für sich selbst bezeichnen. Bei Wagen, Pferden und Gefolge ist „beschaffte sich“ idiomatisch und wahrt den reflexiven Sinn.
- source_word: מֶרְכָּבָה וְסֻסִים
  choice: einen Wagen und Pferde
  rationale: Die konkrete Aufzählung wird ohne den interpretierenden Zusatz „königlich“ wiedergegeben.
- source_word: וַחֲמִשִּׁים אִישׁ רָצִים לְפָנָיו
  choice: sowie fünfzig Männer, die vor ihm herliefen
  rationale: Das Partizip רָצִים wird als Relativsatz wiedergegeben; „vor ihm herliefen“ bezeichnet anschaulich ihre Bewegung und Funktion.
theological_decisions:
- issue: Politische Symbolik von Absaloms Aufzug
  choice: Die königliche Selbstdarstellung bleibt im Haupttext unausgesprochen und wird nur in einer Fußnote erläutert.
  alternative: „Absalom richtete sich einen königlichen Aufzug ein.“
  rationale: Der hebräische Text beschreibt Wagen, Pferde und vorauslaufende Männer, ohne Absaloms Anspruch ausdrücklich zu benennen. Die Übersetzung soll die Folgerung ermöglichen, sie aber nicht in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wagen“ folgt dem üblichen biblisch-historischen Sprachgebrauch für einen Streit- oder Prunkwagen; die politische Deutung wird nicht in den Haupttext aufgenommen.
