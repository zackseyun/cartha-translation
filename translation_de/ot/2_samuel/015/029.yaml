base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/029.yaml
  text: So Zadok and Abiathar returned the ark of God to Jerusalem, and they stayed there.
translation:
  language: de
  text: So brachten Zadok und Abjatar die Lade Gottes nach Jerusalem zurück und blieben dort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: brachten … zurück
  rationale: 'Die Hifil-Form von שוב ist hier kausativ und transitiv: Zadok und Abjatar bringen die Lade an ihren vorherigen Ort zurück. Die deutsche Wendung gibt dies natürlich und präzise wieder.'
- source_word: צָדוֹק וְאֶבְיָתָר
  choice: Zadok und Abjatar
  rationale: Die Personennamen werden nach geläufiger deutscher Bibeltradition transliteriert; die Konjunktion bleibt erhalten.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Der hebräische Text sagt hier ausdrücklich »Lade Gottes« und nicht »Bundeslade«; die kürzere Bezeichnung wird daher bewahrt.
- source_word: יְרוּשָׁלָם
  choice: nach Jerusalem
  rationale: Die Präposition »nach« drückt im Deutschen die durch Verb und Kontext angezeigte Richtung aus.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: und blieben dort
  rationale: ישב kann sitzen, wohnen oder bleiben bedeuten. Im Erzählzusammenhang bezeichnet es ihren weiteren Aufenthalt in Jerusalem; »blieben dort« ist natürliches modernes Deutsch.
