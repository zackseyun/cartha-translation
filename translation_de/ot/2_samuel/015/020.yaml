  text: תְּמ֣וֹל בּוֹאֶ֗/ךָ וְ/הַ/יּ֞וֹם אנוע/ך עִמָּ֨/נוּ֙ לָ/לֶ֔כֶת וַ/אֲנִ֣י הוֹלֵ֔ךְ עַ֥ל אֲשֶׁר אֲנִ֖י הוֹלֵ֑ךְ שׁ֣וּב וְ/הָשֵׁ֧ב אֶת אַחֶ֛י/ךָ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/020.yaml
  text: You came only yesterday[a], and today should I make you wander with us, while I go wherever I can go? Return, and take your brothers back with you[c][b]. May steadfast love and faithfulness be with you.
translation:
  language: de
  text: Du bist doch erst gestern gekommen. Sollte ich dich da heute zum Umherziehen mit uns veranlassen, während ich gehe, wohin ich eben gehe?[a] Kehr um und nimm deine Brüder[b] mit dir zurück. Güte und Treue seien mit dir![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „während ich gehe, wohin ich gehe“. Die hebräische Wendung lässt Davids Fluchtweg bewusst unbestimmt.'
    reason: lexical_alternative
  - marker: b
    text: Mit „deine Brüder“ sind hier wahrscheinlich Ittais Gefährten oder Landsleute gemeint.
    reason: cultural_note
  - marker: c
    text: Im Hebräischen steht nur „Güte und Treue“; „seien mit dir“ ist aus dem Zusammenhang als Segenswunsch ergänzt.
    reason: textual_clarity
lexical_decisions:
- source_word: תְּמוֹל בּוֹאֶךָ
  choice: Du bist doch erst gestern gekommen
  rationale: תְּמוֹל bedeutet wörtlich „gestern“; „erst“ und „doch“ verdeutlichen im Deutschen Davids Hinweis darauf, dass Ittai erst vor Kurzem angekommen ist, ohne den Zeitbezug aufzulösen.
- source_word: אֲנוּעֲךָ
  choice: sollte ich dich … umherziehen lassen
  rationale: 'Die Form von נוע hat hier kausativen Sinn: David fragt, ob er Ittai zu einem unsteten Weiterziehen veranlassen beziehungsweise ihn daran teilnehmen lassen soll. „Umherziehen lassen“ bewahrt diesen Gedanken in natürlichem Deutsch.'
- source_word: עִמָּנוּ לָלֶכֶת
  choice: mit uns umherziehen
  rationale: Die Verbindung bezeichnet das Mitgehen mit Davids fliehender Gruppe. Im Deutschen ist der Gedanke des Gehens bereits in „umherziehen“ enthalten.
- source_word: וַאֲנִי הוֹלֵךְ עַל אֲשֶׁר אֲנִי הוֹלֵךְ
  choice: während ich gehe, wohin ich eben gehe
  rationale: Die bewusst offene und etwas elliptische hebräische Wendung wird nahe am Wortlaut wiedergegeben. „eben“ macht die resignierte Unbestimmtheit idiomatisch hörbar, ohne ein ausdrückliches „kann“ oder „muss“ in den Text einzutragen.
- source_word: שׁוּב וְהָשֵׁב
  choice: Kehr um und nimm … zurück
  rationale: Der erste Imperativ bezeichnet Ittais eigene Rückkehr; der Hifil-Imperativ des zweiten Verbs ist kausativ und fordert ihn auf, auch seine Begleiter zurückzuführen.
- source_word: אַחֶיךָ
  choice: deine Brüder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt im Haupttext erhalten. Der Kontext legt nahe, dass Ittais Gefährten beziehungsweise Landsleute gemeint sind.
- source_word: חֶסֶד וֶאֱמֶת
  choice: Beständige Liebe und Treue
  rationale: Das Wortpaar bezeichnet loyale, verlässliche Güte und Treue. „Beständige Liebe und Treue“ erhält sowohl den Beziehungscharakter von חֶסֶד als auch die Verlässlichkeit von אֱמֶת.
theological_decisions:
- issue: Die verblessene Schlussformel חֶסֶד וֶאֱמֶת
  choice: Beständige Liebe und Treue seien mit dir!
  alternative: Beständige Liebe und Treue!
  rationale: Im Hebräischen fehlt ein ausdrückliches Verb. Der Kontext spricht für einen Segenswunsch; „seien mit dir“ macht ihn im Deutschen verständlich, ohne ausdrücklich festzulegen, ob Gott als Geber genannt oder nur vorausgesetzt ist.
- issue: Unbestimmtheit von Davids Fluchtweg
  choice: wohin ich eben gehe
  alternative: wohin ich gehen kann / wohin ich gehen muss
  rationale: Der hebräische Wortlaut lässt offen, ob David Möglichkeit, Notwendigkeit oder bloße Ungewissheit betont. Die gewählte Fassung bewahrt diese Spannung, statt sie theologisch oder psychologisch festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die direkte Rede bleibt knapp und eindringlich. Die offene hebräische Formulierung zu Davids Weg wird nicht durch „kann“ oder „muss“ vereindeutigt; erklärungsbedürftige Bezüge stehen in Fußnoten.
