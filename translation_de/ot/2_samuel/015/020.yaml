    rationale: Die Formulierung ist verständlich, wirkt aber weniger idiomatisch als „Güte“ und legt den Schwerpunkt enger auf Liebe. „Güte und Treue“ gibt das häufige hebräische Wortpaar im modernen Deutsch natürlich und offen wieder.
