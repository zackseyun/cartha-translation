  to: Du bist doch erst gestern gekommen. Sollte ich dich da heute zum Umherziehen mit uns veranlassen, während ich gehe, wohin ich eben gehe?[a] Kehr um und nimm deine Brüder[b] mit dir zurück. Güte und Treue seien mit dir![c]
