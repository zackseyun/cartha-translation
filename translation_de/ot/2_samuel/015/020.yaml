  terminology: „Brüder“ bleibt als Quellenwort im Text angemessen; die Fußnote erklärt den kontextuellen Bezug zurückhaltend. Die Schlussformel wird sinnvoll als Segenswunsch ergänzt, ohne einen göttlichen Akteur ausdrücklich einzutragen.
