translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Die Personenbeziehungen werden zur unmittelbaren Verständlichkeit ausdrücklich als Sohnschaft formuliert; bei בְּיָדָם steht die natürliche deutsche Bedeutung im Haupttext, während die hebräische Bildsprache in der Fußnote erhalten bleibt.
