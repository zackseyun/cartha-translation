base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/036.yaml
  text: 'Look[a], their two sons are there with them: Ahimaaz for Zadok, and Jonathan for Abiathar[b]. You shall send to me by their hand every matter that you hear.'
translation:
  language: de
  text: 'Seht, dort bei ihnen sind ihre beiden Söhne: Ahimaaz, der Sohn Zadoks, und Jonatan, der Sohn Abjatars. Sendet mir durch sie[a] alles, was ihr hört.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch ihre Hand“; gemeint ist: durch sie als Überbringer.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jede Nachricht, die ihr hört“ beziehungsweise „jede Sache, die ihr hört“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel hebt das Folgende hervor. „Seht“ gibt diese Funktion in heutigem, würdigem Deutsch wieder und passt zur Anrede an mehrere Personen.
- source_word: שָׁם עִמָּם
  choice: dort bei ihnen
  rationale: Die Wendung bezeichnet sowohl den Ort als auch die Gemeinschaft mit den zuvor genannten Priestern.
- source_word: שְׁנֵי בְנֵיהֶם
  choice: ihre beiden Söhne
  rationale: Die Konstruktion bezeichnet eindeutig die zwei Söhne der beiden zuvor angesprochenen Männer.
- source_word: אֲחִימַעַץ לְצָדוֹק וִיהוֹנָתָן לְאֶבְיָתָר
  choice: Ahimaaz, der Sohn Zadoks, und Jonatan, der Sohn Abjatars
  rationale: Das ל kennzeichnet hier im Zusammenhang die jeweilige Zugehörigkeit. Da unmittelbar zuvor von „ihren beiden Söhnen“ die Rede ist, macht die natürliche deutsche Formulierung die Sohnschaft ausdrücklich.
- source_word: וּשְׁלַחְתֶּם
  choice: Lasst ... übermitteln
  rationale: Die Verbform hat im Anweisungszusammenhang auffordernden Sinn. Zusammen mit der Angabe des Übermittlungswegs ergibt sich im Deutschen eine natürliche pluralische Aufforderung.
- source_word: בְּיָדָם
  choice: durch sie
  rationale: Wörtlich „durch ihre Hand“; die hebräische Wendung bezeichnet hier die Personen als Überbringer und wird idiomatisch mit „durch sie“ wiedergegeben.
- source_word: כָּל דָּבָר
  choice: alles
  rationale: דָּבָר kann „Wort“, „Sache“, „Angelegenheit“ oder „Nachricht“ bedeuten. Das umfassende „alles“ bewahrt hier die Bedeutungsbreite, ohne die Information vorschnell auf eine bestimmte Art von Bericht festzulegen.
- source_word: אֲשֶׁר תִּשְׁמָעוּ
  choice: was ihr hört
  rationale: „Hören“ ist die direkte und im Zusammenhang passende Wiedergabe; die Form ist an mehrere Adressaten gerichtet.
