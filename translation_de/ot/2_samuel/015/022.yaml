base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/022.yaml
  text: Then David said to Ittai, “Go on and cross over.” So Ittai the Gittite crossed over, along with all his men and all the little ones who were with him.
translation:
  language: de
  text: 'Da sagte David zu Ittai: »Geh weiter und zieh hinüber!« Da zog Ittai, der Gatiter, hinüber, mit allen seinen Männern und allen Kindern, die bei ihm waren.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ וַעֲבֹר
  choice: Geh weiter und zieh hinüber
  rationale: Die beiden Imperative werden getrennt wiedergegeben. »Geh weiter« nimmt den im Zusammenhang naheliegenden Sinn von לֵךְ auf, während »zieh hinüber« עֲבֹר und die anschließende Bewegung über den Bach ausdrückt.
- source_word: הַגִּתִּי
  choice: der Gatiter
  rationale: Das Herkunftsadjektiv bezeichnet einen Mann aus Gat; »Gatiter« ist die geläufige deutsche Form.
- source_word: אֲנָשָׁיו
  choice: seinen Männern
  rationale: Im militärisch-gefolgschaftlichen Zusammenhang bezeichnet אֲנָשִׁים Ittais Männer beziehungsweise Gefolgsleute.
- source_word: הַטַּף
  choice: Kindern
  rationale: Der Sammelbegriff bezeichnet hier die Kinder beziehungsweise kleinen Angehörigen der mitziehenden Gruppe. Das natürliche deutsche »Kinder« vermeidet das missverständliche »die Kleinen«.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung von »hinüberziehen« bewahrt die knappe Erzählstruktur und den unmittelbaren Vollzug von Davids Anweisung.
