  text: וְ/דָוִד֙ הִגִּ֣יד לֵ/אמֹ֔ר אֲחִיתֹ֥פֶל בַּ/קֹּשְׁרִ֖ים עִם אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר דָּוִ֔ד סַכֶּל נָ֛א אֶת עֲצַ֥ת אֲחִיתֹ֖פֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/031.yaml
  text: And it was told David[a], saying, “Ahithophel is among the conspirators with Absalom.” And David said, “O Yahweh, please turn Ahithophel’s counsel into foolishness.”
translation:
  language: de
  text: 'Man berichtete David: »Ahitofel ist unter den Verschwörern auf Abschaloms Seite.« Da sagte David: »Jahwe, mach Ahitofels Rat doch zur Torheit![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vereitle Ahitofels Rat!« Das Hebräische bittet wörtlicher darum, Ahitofels Rat zur Torheit zu machen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד
  choice: Man berichtete
  rationale: Das Hifil von נגד bedeutet hier »berichten, mitteilen«. Die unpersönliche Formulierung mit »man« gibt die hebräische Berichtsformel natürlich wieder, ohne einen bestimmten Handelnden zu ergänzen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Quotativ wird im modernen Deutschen idiomatisch durch einen Doppelpunkt vor der direkten Rede wiedergegeben.
- source_word: בַּקֹּשְׁרִים
  choice: unter den Verschwörern
  rationale: Die substantivisch gebrauchte Pluralform bezeichnet die Gruppe derer, die sich verschworen haben; »unter den Verschwörern« bewahrt diesen konkreten Gruppenbezug.
- source_word: עִם
  choice: auf Abschaloms Seite
  rationale: Das schlichte »mit« bezeichnet hier die Zugehörigkeit zu Abschalom; im Deutschen macht »auf Abschaloms Seite« diese politische Verbindung natürlich verständlich.
- source_word: סַכֶּל
  choice: lass ... zur Torheit werden
  rationale: Der Piel-Imperativ bittet darum, Ahitofels Rat töricht beziehungsweise unwirksam werden zu lassen. Die Formulierung bewahrt das im hebräischen Verb enthaltene Motiv der Torheit, ohne die mögliche Wirkung vorschnell auf bloßes Scheitern zu verengen.
- source_word: נָא
  choice: doch
  rationale: Die Partikel kennzeichnet eine eindringliche Bitte. In diesem kurzen Gebet gibt »doch« den flehentlichen Ton natürlich wieder.
- source_word: עֲצַת
  choice: Rat
  rationale: עֵצָה bezeichnet hier den strategischen Rat Ahitofels. »Rat« ist prägnant, würdig und im politischen Zusammenhang verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch den Titel »der HERR« ersetzt; »Jahwe« ist die geläufige deutsche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in direkter Anrede
  choice: Jahwe
  alternative: HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe als »Jahwe« bewahrt den Charakter des offenbarten Eigennamens und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutung der Bitte סַכֶּל נָא אֶת־עֲצַת
  choice: lass ... zur Torheit werden
  alternative: vereitle ... den Rat
  rationale: Die gewählte Fassung erhält das Bild der Torheit und lässt offen, ob der Rat inhaltlich töricht, als töricht angesehen oder dadurch unwirksam wird. Die alternative Wirkungsübersetzung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Redeeinleitungsformel wird mit einem Doppelpunkt natürlich wiedergegeben; das knappe Stoßgebet bleibt eindringlich und bewahrt die bildhafte Rede von der Torheit.
