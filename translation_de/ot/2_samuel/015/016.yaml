base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/016.yaml
  text: So the king went out[a], and all his household after him on foot; and the king left ten women, concubines, to keep the house.
translation:
  language: de
  text: Da zog der König hinaus, und sein ganzer Haushalt folgte ihm zu Fuß.[a] Der König ließ zehn Frauen, Nebenfrauen, zurück, um das Haus zu hüten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und sein ganzer Haushalt an seinen Füßen“. Die hebräische Wendung besagt hier, dass sie ihm zu Fuß folgten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: zog … hinaus
  rationale: יצא bezeichnet hier im fortlaufenden Erzählstil den Aufbruch. „zog hinaus“ gibt die konkrete Bewegung natürlich und würdevoll wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die Übersetzung bewahrt die Bezeichnung des hebräischen Textes, statt den im Zusammenhang gemeinten David namentlich einzusetzen.
- source_word: וְכָל־בֵּיתוֹ
  choice: und sein ganzer Haushalt
  rationale: בַּיִת bezeichnet mit Suffix hier die zum königlichen Haus gehörenden Menschen, nicht das Gebäude.
- source_word: בְּרַגְלָיו
  choice: folgte ihm zu Fuß
  rationale: Die wörtliche Wendung „an/bei seinen Füßen“ beschreibt idiomatisch, dass der Haushalt dem König zu Fuß folgte. Die deutsche Fassung macht Bewegung und Fortbewegungsart deutlich.
- source_word: וַיַּעֲזֹב
  choice: ließ … zurück
  rationale: עזב bedeutet in diesem Zusammenhang, Personen zurückzulassen. „verließ“ oder „gab preis“ würde die beabsichtigte Aufgabe beziehungsweise die emotionale Färbung überzeichnen.
- source_word: עֶשֶׂר נָשִׁים פִּלַגְשִׁים
  choice: zehn Frauen, Nebenfrauen
  rationale: Die Apposition bewahrt sowohl נָשִׁים („Frauen“) als auch פִּלַגְשִׁים („Nebenfrauen“), ohne die beiden Ausdrücke zu einem einzigen zu glätten.
- source_word: לִשְׁמֹר
  choice: damit sie … hüteten
  rationale: שׁמר umfasst bewahren, hüten und bewachen. „hüten“ lässt hier sowohl die Aufsicht als auch die Erhaltung des Hauses anklingen.
- source_word: הַבָּיִת
  choice: das Haus
  rationale: Hier ist das königliche Wohnhaus gemeint. „Haus“ wahrt die Ausdrucksweise des Ausgangstextes; „Palast“ wäre kontextuell möglich, aber stärker deutend.
