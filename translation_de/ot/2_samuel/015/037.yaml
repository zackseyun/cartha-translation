base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/037.yaml
  text: So Hushai[a], David’s friend, came into the city, as Absalom was entering Jerusalem.
translation:
  language: de
  text: So kam Huschai, Davids Freund, in die Stadt, während Absalom in Jerusalem einzog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Absalom zog in Jerusalem ein.“ Die hebräische Verbindung kann auch schlicht mit „und“ wiedergegeben und die Verbform als vergangene Handlung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: So kam … in
  rationale: בוא bezeichnet ein Kommen beziehungsweise Hineingehen. Mit הָעִיר gibt „kam … in die Stadt“ die Bewegung natürlich und eng am Hebräischen wieder; „So“ nimmt den Erzählfaden auf.
- source_word: חוּשַׁי
  choice: Huschai
  rationale: Eingebürgerte deutsche Umschrift des Personennamens.
- source_word: רֵעֶה דָוִד
  choice: Davids Freund
  rationale: רֵעֶה bezeichnet hier einen Freund oder Vertrauten. „Freund“ ist direkt und vermeidet die nicht ausdrücklich genannte Amtsbezeichnung „Berater“.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Die bestimmte Gattungsbezeichnung wird bewahrt, obwohl aus dem Zusammenhang Jerusalem gemeint ist.
- source_word: וְאַבְשָׁלֹם יָבֹא
  choice: während Absalom … einzog
  rationale: Der einfache yiqtol nach dem vorausgehenden wayyiqtol kann die gleichzeitig verlaufende beziehungsweise hintergründige Handlung ausdrücken. „Während … einzog“ bildet diesen Aspektwechsel im Deutschen natürlich ab.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
