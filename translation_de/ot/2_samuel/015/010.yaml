base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/010.yaml
  text: Then Absalom sent spies throughout all the tribes of Israel, saying, “As soon as you hear the sound of the trumpet, then say, ‘Absalom has become king in Hebron.’”
translation:
  language: de
  text: 'Dann sandte Absalom Kundschafter in alle Stämme Israels und ließ sagen: »Sobald ihr den Klang des Horns hört, sollt ihr sagen: ›Absalom ist in Hebron König geworden!‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרַגְּלִים
  choice: heimlich Boten
  rationale: Das Wort bezeichnet gewöhnlich Kundschafter oder Spione. Hier sollen die Ausgesandten jedoch nicht Informationen beschaffen, sondern verdeckt ein vereinbartes Signal verbreiten; »heimlich Boten« gibt Funktion und konspirativen Charakter im Deutschen natürlich wieder.
- source_word: שׁוֹפָר
  choice: Widderhorn
  rationale: Das hebräische שׁוֹפָר bezeichnet ein als Signalhorn verwendetes Tierhorn; »Widderhorn« ist konkreter als das traditionelle, aber weniger genaue »Trompete«.
- source_word: מָלַךְ
  choice: ist … König geworden
  rationale: Die finite Verbform kann den Beginn der Königsherrschaft bezeichnen. Im Kontext wird Absaloms Thronbesteigung ausgerufen; das Perfekt gibt dies idiomatisch wieder.
- source_word: בְּחֶבְרוֹן
  choice: in Hebron
  rationale: Die Ortsangabe wird direkt und ohne interpretierende Ergänzung wiedergegeben.
theological_decisions:
- issue: Art und Status von Absaloms Königtum
  choice: »Absalom ist in Hebron König geworden« als Inhalt des vereinbarten Ausrufs
  alternative: »Absalom herrscht in Hebron«
  rationale: Die Übersetzung stellt den ausgerufenen Herrschaftsantritt dar, ohne Absaloms Anspruch theologisch oder rechtlich zu bestätigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede und der eingebettete Ausruf bleiben klar erkennbar; »ausrufen« entspricht der öffentlichen Bekanntmachung, die nach dem Hornsignal erfolgen soll.
