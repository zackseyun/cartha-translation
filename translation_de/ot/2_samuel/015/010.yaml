  source_fidelity: 'Die Aussagefolge und der ausgerufene Inhalt sind im Entwurf grundsätzlich getroffen. Jedoch gibt »heimlich Boten« מְרַגְּלִים weniger genau wieder: Das Wort bezeichnet Kundschafter/Spione, nicht einfach Boten. »ausrufen« verstärkt וַאֲמַרְתֶּם („ihr sollt sagen“) unnötig. »Widderhorn« ist zwar möglich, aber gegenüber dem im Text allgemein bezeichneten Schofar eine engere Festlegung.'
