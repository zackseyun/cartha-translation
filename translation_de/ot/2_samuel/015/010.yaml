  terminology: »Kundschafter« trifft מְרַגְּלִים in einem angemessenen biblisch-literarischen Register. »Horn« gibt שׁוֹפָר idiomatisch wieder, ohne die Tierart festzulegen. »König geworden« gibt den ausgerufenen Herrschaftsantritt natürlich wieder, ohne dessen Legitimität zu bestätigen.
