base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/021.yaml
  text: Then Ittai answered the king and said[a], “As Yahweh lives, and as my lord the king lives, surely in whatever place my lord the king may be, whether for death or for life[b], there your servant will be.”
translation:
  language: de
  text: 'Ittai antwortete dem König: „So wahr Jahwe lebt und so wahr mein Herr, der König, lebt:[a] Wo immer mein Herr, der König, sein wird – sei es zum Tod, sei es zum Leben –, dort wird dein Diener sein.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräische Schwurformel: „Jahwe lebt, und mein Herr, der König, lebt.“'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אִתַּי אֶת הַמֶּלֶךְ וַיֹּאמַר
  choice: Ittai antwortete dem König
  rationale: Die beiden hebräischen Redeeinleitungen werden im natürlichen modernen Deutsch gebündelt; die Antwortsituation bleibt deutlich.
- source_word: חַי יְהוָה וְחֵי אֲדֹנִי הַמֶּלֶךְ
  choice: So wahr Jahwe lebt und so wahr mein Herr, der König, lebt
  rationale: Die feierliche hebräische Schwurformel wird mit der geläufigen deutschen Formel „So wahr … lebt“ wiedergegeben; der Gottesname bleibt als Jahwe erhalten.
- source_word: כִּי אִם
  choice: durch die Schwurformel und die folgende Aussage ausgedrückt
  rationale: Die asseverative Verstärkung ist im Deutschen bereits durch „So wahr … lebt“ und die entschiedene Zusage getragen; ein zusätzliches „gewiss“ wäre schwerfällig.
- source_word: בִּמְקוֹם אֲשֶׁר יִהְיֶה שָּׁם
  choice: Wo auch immer … sein wird
  rationale: Gibt die offene Ortsangabe idiomatisch und zugleich eng am hebräischen Sinn wieder.
- source_word: אִם לְמָוֶת אִם לְחַיִּים
  choice: ob es in den Tod oder ins Leben geht
  rationale: Bewahrt die markante Reihenfolge Tod–Leben und drückt die bedingungslose Gefolgschaft verständlich aus.
- source_word: עַבְדֶּךָ
  choice: dein Diener
  rationale: Hier ist das Wort eine ehrerbietige Selbstbezeichnung gegenüber dem König; „Sklave“ würde den pragmatischen Sinn unnötig verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text ausdrücklich gebrauchte Gottesname erkennbar bleibt.
- issue: Art und Reichweite von Ittais Zusage
  choice: örtliche Gefolgschaft unabhängig davon, ob sie zu Tod oder Leben führt
  alternative: eine abstrakte Aussage über Gemeinschaft in Tod und Leben
  rationale: Die Syntax betont zunächst den Ort, an dem David sein wird, und ergänzt dann die beiden möglichen Ausgänge. Die Übersetzung erhält sowohl die Ortsbindung als auch die existentielle Zuspitzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die königliche Anrede bleibt formal; der Satzbau wurde nur so weit geglättet, dass der feierliche Schwur und Ittais entschiedene Loyalität unmittelbar verständlich sind.
