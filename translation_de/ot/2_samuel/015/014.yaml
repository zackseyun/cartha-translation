source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּ֠וִד לְ/כָל עֲבָדָ֨י/ו אֲשֶׁר אִתּ֤/וֹ בִ/ירוּשָׁלִַ֨ם֙ ק֣וּמוּ וְ/נִבְרָ֔חָה כִּ֛י לֹא תִֽהְיֶה לָּ֥/נוּ פְלֵיטָ֖ה מִ/פְּנֵ֣י אַבְשָׁל֑וֹם מַהֲר֣וּ לָ/לֶ֗כֶת פֶּן יְמַהֵ֤ר וְ/הִשִּׂגָ֨/נוּ֙ וְ/הִדִּ֤יחַ עָלֵ֨י/נוּ֙ אֶת הָ֣/רָעָ֔ה וְ/הִכָּ֥ה הָ/עִ֖יר לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/014.yaml
  text: Then David said to all his servants who were with him in Jerusalem[a], “Arise, and let us flee, for there will be no escape for us from Absalom. Hurry to depart[c][b], lest he quickly overtake us and bring disaster upon us and strike the city with the edge of the sword.”
translation:
  language: de
  text: 'Da sagte David zu allen seinen Dienern, die bei ihm in Jerusalem waren: »Auf, lasst uns fliehen! Denn uns bleibt kein Entkommen vor Abschalom. Beeilt euch aufzubrechen,[a] damit er uns nicht rasch einholt, Unheil über uns bringt[b] und die Stadt mit der Schärfe des Schwertes schlägt.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Beeilt euch zu gehen“; gemeint ist der unverzügliche Aufbruch.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Böses über uns bringt“. Das hebräische Wort kann sowohl Böses als auch Unheil bezeichnen; hier steht die drohende Katastrophe im Vordergrund.'
    reason: lexical_alternative
  - marker: c
    text: Das Hebräische lautet wörtlich „mit dem Mund des Schwertes“, eine bildhafte Wendung für das Töten durch das Schwert.
    reason: idiom_explanation
lexical_decisions:
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: עֶבֶד kann Diener, Knecht oder Sklave bezeichnen. Im königlichen Umfeld sind Davids Amtsträger und Gefolgsleute gemeint; „Diener“ bewahrt die breite Bedeutung, ohne einen rechtlichen Sklavenstatus festzulegen.
- source_word: קוּמוּ
  choice: Auf
  rationale: Der Imperativ von קום fordert angesichts der Gefahr zum sofortigen Handeln auf. Das knappe „Auf“ klingt im Deutschen natürlich, eindringlich und würdig.
- source_word: וְנִבְרָחָה
  choice: lasst uns fliehen
  rationale: Die Kohortativform schließt den Sprecher ein und drückt einen gemeinsamen dringenden Entschluss aus.
- source_word: פְלֵיטָה
  choice: Entkommen
  rationale: Das Substantiv bezeichnet hier die Möglichkeit, der herannahenden Gefahr zu entrinnen; „Entkommen“ vermeidet die zusätzliche religiöse Konnotation, die „Rettung“ haben könnte.
- source_word: מִפְּנֵי אַבְשָׁלוֹם
  choice: vor Abschalom
  rationale: מִפְּנֵי bezeichnet hier die Flucht vor einer bedrohenden Person. „Vor Abschalom“ ist die natürliche deutsche Entsprechung.
- source_word: מַהֲרוּ לָלֶכֶת
  choice: Beeilt euch aufzubrechen
  rationale: Der Imperativ mit Infinitiv verlangt sofortigen Aufbruch. Die Wiedergabe ist idiomatischer als das wörtliche „Beeilt euch zu gehen“.
- source_word: פֶּן
  choice: damit … nicht
  rationale: פֶּן leitet eine befürchtete Folge ein. „Damit … nicht“ gibt die abwehrende Zielrichtung natürlich wieder; möglich wäre auch „sonst“.
- source_word: יְמַהֵר וְהִשִּׂגָנוּ
  choice: uns rasch einholt
  rationale: Die Verbindung wiederholt das Motiv der Eile und bezeichnet das Einholen von Flüchtenden durch einen Verfolger.
- source_word: וְהִדִּיחַ עָלֵינוּ אֶת הָרָעָה
  choice: Unheil über uns bringt
  rationale: רָעָה bezeichnet in diesem Zusammenhang drohendes Unglück oder Verderben, nicht ausdrücklich moralische Bosheit. „Unheil“ wahrt diese kontextuelle Bedeutung.
- source_word: וְהִכָּה הָעִיר לְפִי חָרֶב
  choice: die Stadt mit der Schärfe des Schwertes schlägt
  rationale: Die Wiedergabe erhält sowohl das Verb „schlagen“ als auch das hebräische Schwertbild. Gemeint ist ein tödlicher militärischer Angriff auf die Stadt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Imperative und Ausrufe vermitteln Davids Dringlichkeit. Die teilweise ungewohnte Wendung „mit der Schärfe des Schwertes schlägt“ bewahrt bewusst das konkrete hebräische Bild; die Fußnote erläutert den zugrunde liegenden Ausdruck.
