  terminology: „Absalom“, „Jerusalem“ und „Männer“ sind korrekt und registergerecht. Die Fußnote bewahrt mit „in ihrer Unschuld“ und „aufrichtig“ die mögliche weitere Bedeutungsbreite, während sie den hier naheliegenden kontextuellen Sinn angemessen erläutert.
