  register: Moderne, würdige Erzählsprache. „Arglos“ ist prägnant und verständlich; die Fußnote bewahrt die Bedeutungsbreite von לְתֻמָּם. Der Fußnotenmarker steht nach dem gesamten erklärten Satzteil.
