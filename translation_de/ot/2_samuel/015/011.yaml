  text: וְ/אֶת אַבְשָׁל֗וֹם הָלְכ֞וּ מָאתַ֤יִם אִישׁ֙ מִ/יר֣וּשָׁלִַ֔ם קְרֻאִ֖ים וְ/הֹלְכִ֣ים לְ/תֻמָּ֑/ם וְ/לֹ֥א יָדְע֖וּ כָּל דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/011.yaml
  text: Two hundred men from Jerusalem went with Absalom[a], invited, and they went innocently, not knowing anything.
translation:
  language: de
  text: Mit Absalom gingen zweihundert Männer aus Jerusalem. Sie waren eingeladen worden und gingen arglos mit, ohne von irgendetwas zu wissen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ihrer Unschuld“ beziehungsweise „aufrichtig“. Der hebräische Ausdruck besagt hier wohl, dass sie nichts ahnten und Absaloms Vorhaben nicht kannten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת־אַבְשָׁלוֹם הָלְכוּ
  choice: Mit Absalom gingen
  rationale: אֶת bei einem Verb der Bewegung bezeichnet hier Begleitung. Die deutsche Wortfolge gibt die hervorgehobene Begleitung natürlich wieder.
- source_word: מָאתַיִם אִישׁ
  choice: zweihundert Männer
  rationale: Die hebräische Zählform verwendet אִישׁ und bezeichnet hier ausdrücklich Männer.
- source_word: מִירוּשָׁלַםִ
  choice: aus Jerusalem
  rationale: מִן kennzeichnet den Ausgangsort; im Deutschen ist „aus Jerusalem“ idiomatisch.
- source_word: קְרֻאִים
  choice: Sie waren eingeladen worden
  rationale: Das passive Partizip von קרא bedeutet in diesem Zusammenhang „eingeladen“. Die Wiedergabe vermeidet den Zusatz „Gäste“, der nicht ausdrücklich im Hebräischen steht.
- source_word: וְהֹלְכִים לְתֻמָּם
  choice: und gingen arglos mit
  rationale: לְתֻמָּם beschreibt hier angesichts des folgenden Nichtwissens ihre ahnungslose, unverdächtige Haltung. „Mit“ verdeutlicht im Deutschen, dass sie Absalom begleiteten.
- source_word: וְלֹא יָדְעוּ כָּל־דָּבָר
  choice: ohne von irgendetwas zu wissen
  rationale: Die Klausel erläutert ihre Arglosigkeit. „Von irgendetwas“ bewahrt die allgemeine Formulierung, ohne Absaloms Plan ausdrücklich in den Text einzutragen.
theological_decisions: []
