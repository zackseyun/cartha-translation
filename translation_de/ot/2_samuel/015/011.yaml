  source_fidelity: 'Die Übersetzung gibt alle Satzglieder des Hebräischen wieder: die zweihundert Männer aus Jerusalem begleiteten Absalom, waren eingeladen, gingen arglos mit und wussten nichts. „Arglos“ trifft לְתֻמָּם im durch den Folgesatz bestimmten Sinn des ahnungslosen Mitgehens; die allgemeine Formulierung „ohne von irgendetwas zu wissen“ fügt Absaloms Plan nicht in den Text ein.'
