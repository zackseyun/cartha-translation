base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/018.yaml
  text: And all his servants were passing by at his side[a], and all the Cherethites, and all the Pelethites, and all the Gittites—six hundred men who had come on foot with him from Gath—were passing on before the king.
translation:
  language: de
  text: Alle seine Diener zogen an seiner Seite vorüber; ebenso zogen alle Keretiter, alle Peletiter und alle Gatiter – sechshundert Mann, die mit ihm aus Gat gekommen waren[a] – vor dem König vorüber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „die bei seinem Fuß aus Gat gekommen waren“; gemeint sein kann: „die ihm aus Gat gefolgt waren“ oder „die mit ihm zu Fuß aus Gat gekommen waren“.'
    reason: Die hebräische Wendung בְרַגְלוֹ ist bildhaft und kann sowohl das Mitziehen in Davids Gefolge als auch einen konkreten Hinweis auf das Gehen zu Fuß anklingen lassen.
lexical_decisions:
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עֶבֶד kann Diener, Gefolgsleute oder königliche Beamte bezeichnen. „Diener“ bewahrt den Grundsinn, ohne ihre Stellung enger festzulegen.
- source_word: עֹבְרִים עַל יָדוֹ
  choice: zogen an seiner Seite vorüber
  rationale: עַל־יָד bezeichnet hier die räumliche Nähe, also „an der Seite“ bzw. „neben“ jemandem; die Verlaufsform wird im Deutschen durch das Verb im Erzählzusammenhang natürlich wiedergegeben.
- source_word: הַכְּרֵתִי
  choice: die Keretiter
  rationale: Die Bezeichnung einer Gruppe in Davids Dienst wird als Eigenname transliteriert und nicht deutend übersetzt.
- source_word: הַפְּלֵתִי
  choice: die Peletiter
  rationale: Wie bei den Keretitern wird die Gruppenbezeichnung in einer im Deutschen gebräuchlichen Transliteration wiedergegeben.
- source_word: הַגִּתִּים
  choice: die Gatiter
  rationale: Das Ethnikon bezeichnet Menschen aus Gat. „Gatiter“ ist transparent, knapp und wahrt die Form einer Volks- bzw. Herkunftsbezeichnung.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: sechshundert Mann
  rationale: אִישׁ dient hier als Zählbegriff. „Mann“ gibt dies unmittelbar wieder; „Soldaten“ wäre trotz des militärischen Zusammenhangs expliziter als der hebräische Ausdruck.
- source_word: אֲשֶׁר בָּאוּ בְרַגְלוֹ מִגַּת
  choice: die mit ihm aus Gat gekommen waren
  rationale: בְרַגְלוֹ lautet wörtlich etwa „mit/bei seinem Fuß“ und bezeichnet idiomatisch das Mitziehen in jemandes Gefolge, möglicherweise ausdrücklich zu Fuß. Die Hauptfassung gibt das Begleiten natürlich wieder; die konkrete Bildlichkeit und Alternative werden in der Fußnote bewahrt.
- source_word: עֹבְרִים עַל פְּנֵי הַמֶּלֶךְ
  choice: sie zogen vor dem König vorüber
  rationale: עַל־פְּנֵי bedeutet hier „vor“ bzw. „vor dem Angesicht von“. Die Formulierung zeichnet die vorbeiziehende Prozession klar nach.
