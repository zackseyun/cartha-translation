base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/012.yaml
  text: And Absalom sent for Ahithophel the Gilonite[a], David’s counselor, from his city, from Giloh, while he was offering the sacrifices. And the conspiracy grew strong[c][b], and the people kept increasing with Absalom.
translation:
  language: de
  text: Absalom ließ Ahitofel, den Giloniter und Davids Ratgeber, aus seiner Stadt Gilo holen[a], während Absalom die Schlachtopfer darbrachte. So wurde die Verschwörung immer stärker[b], und immer mehr Menschen schlossen sich Absalom an.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Absalom sandte Ahitofel“; im Zusammenhang ist wahrscheinlich gemeint, dass Absalom ihn zu sich rufen ließ.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Die Verschwörung gewann an Kraft.“'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Das Volk ging weiter und wurde zahlreich mit Absalom“; gemeint ist, dass Absaloms Anhängerschaft stetig wuchs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ließ … holen
  rationale: Bei einer Person als direktem Objekt und im Zusammenhang von Abschaloms Aufstand bezeichnet das Verb hier am ehesten eine Aufforderung, zu ihm zu kommen. Die Formulierung ist im Deutschen natürlicher als das missverständliche „sandte Ahitofel“.
- source_word: הַגִּלֹנִי
  choice: der Giloniter
  rationale: Die Herkunftsbezeichnung wird als Gentilizium wiedergegeben und durch die anschließende Nennung Gilos erläutert.
- source_word: יוֹעֵץ דָּוִד
  choice: Davids Ratgeber
  rationale: Die Genitivverbindung bezeichnet Ahitofels politische Beratungsfunktion für David.
- source_word: מֵעִירוֹ מִגִּלֹה
  choice: aus seiner Stadt Gilo
  rationale: Die Formulierung bewahrt sowohl die Bezeichnung als Stadt als auch den Ortsnamen, ohne im Deutschen unnötig schwerfällig zu wirken.
- source_word: בְּזָבְחוֹ אֶת־הַזְּבָחִים
  choice: während er die Schlachtopfer darbrachte
  rationale: Die Präposition mit Infinitiv bezeichnet eine gleichzeitig stattfindende Handlung. „Schlachtopfer darbringen“ erhält den kultischen Sinn des hebräischen Wortstamms, ohne dessen im Deutschen unnatürliche Wiederholung nachzuahmen.
- source_word: הַקֶּשֶׁר
  choice: die Verschwörung
  rationale: Im Zusammenhang mit dem organisierten Aufstand bezeichnet das Wort eine politische Verschwörung; „Plan“ wäre schwächer.
- source_word: אַמִּץ
  choice: wurde immer stärker
  rationale: Die Wendung mit וַיְהִי beschreibt eine fortschreitende Festigung, nicht nur einen statischen Zustand.
- source_word: הוֹלֵךְ וָרָב
  choice: immer mehr Menschen schlossen sich … an
  rationale: Die hebräische Verlaufsform bezeichnet eine stetig wachsende Zahl von Unterstützern. Die deutsche Wiedergabe drückt sowohl die Zunahme als auch die Zugehörigkeit zu Abschalom natürlich aus.
- source_word: אֶת אַבְשָׁלוֹם
  choice: schlossen sich Absalom an
  rationale: אֶת bezeichnet hier Gemeinschaft beziehungsweise Parteinahme. Die idiomatische deutsche Formulierung macht diese Ausrichtung deutlich.
