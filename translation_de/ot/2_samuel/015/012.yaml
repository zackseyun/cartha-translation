translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt nah an der hebräischen Erzählfolge, während idiomatische Wendungen wie „ließ … holen“ und „schlossen sich … an“ missverständliche Wörtlichkeit vermeiden. Die Schreibweise „Absalom“ folgt der im Deutschen geläufigen Namensform; „Ahitofel“ und „Gilo“ sind ebenfalls konventionell.
