base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/019.yaml
  text: Then the king said to Ittai the Gittite[a], “Why are you also going with us? Return and stay with the king[c][b], for you are a foreigner and also an exile from your own place.”
translation:
  language: de
  text: 'Da sagte der König zu Ittai, dem Gatiter: „Warum willst auch du mit uns gehen? Kehr um und bleib bei dem König,[a] denn du bist ein Fremder und außerdem aus deiner Heimat verbannt.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wer mit „dem König“ gemeint ist, wird im Hebräischen nicht ausdrücklich gesagt; möglich ist die in Jerusalem verbleibende königliche Herrschaft.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: „und außerdem bist du ein Verbannter zu deinem Ort“. Die hebräische Formulierung ist knapp und kann Ittais Entwurzelung sowie seine Bindung an seinen eigenen Herkunftsort hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Da sagte der König
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder. Der Titel bleibt entsprechend dem Hebräischen erhalten.
- source_word: אִתַּי הַגִּתִּי
  choice: Ittai, dem Gatiter
  rationale: Der Personenname wird transliteriert; die Herkunftsbezeichnung bezeichnet einen Mann aus Gat und wird mit der im Deutschen geläufigen Form „Gatiter“ wiedergegeben.
- source_word: לָמָּה תֵלֵךְ גַּם אַתָּה אִתָּנוּ
  choice: Warum willst auch du mit uns gehen?
  rationale: Das Imperfekt bezeichnet hier im direkten Gespräch eine beabsichtigte bzw. bevorstehende Handlung. Die Stellung von „auch du“ bewahrt die Hervorhebung von גַּם אַתָּה.
- source_word: שׁוּב וְשֵׁב
  choice: Kehr um und bleib
  rationale: Die beiden Imperative werden direkt und idiomatisch wiedergegeben. ישׁב bedeutet hier kontextuell „bleiben“, nicht wörtlich „sitzen“.
- source_word: עִם הַמֶּלֶךְ
  choice: bei dem König
  rationale: Die Titelformulierung wird beibehalten, ohne den im Hebräischen nicht ausdrücklich genannten Bezug festzulegen.
- source_word: נָכְרִי
  choice: ein Fremder
  rationale: Das Wort bezeichnet hier Ittais Status als Nichtisraelit bzw. Ortsfremder. „Fremder“ ist im biblisch-historischen Zusammenhang verständlich und vermeidet eine übermäßig moderne staatsrechtliche Festlegung.
- source_word: וְגַם גֹּלֶה אַתָּה לִמְקוֹמֶךָ
  choice: und außerdem aus deiner Heimat verbannt
  rationale: גֹּלֶה bezeichnet einen Vertriebenen oder Verbannten. Die knappe hebräische Verbindung mit לִמְקוֹמֶךָ ist ungewöhnlich; „aus deiner Heimat verbannt“ gibt den wahrscheinlich gemeinten Status natürlich wieder, während eine Fußnote die formale Mehrdeutigkeit wahrt.
theological_decisions:
- issue: Bezug von „dem König“ in עִם הַמֶּלֶךְ
  choice: Die Wendung „bei dem König“ bleibt im Haupttext unaufgelöst.
  alternative: „bei König Absalom“, „bei dem König in Jerusalem“ oder ein Bezug auf David
  rationale: Der hebräische Text nennt keinen Namen und wiederholt lediglich den Titel. Eine ausdrückliche Identifikation würde eine Auslegung in den Text eintragen.
- issue: Richtung und Sinn von לִמְקוֹמֶךָ
  choice: 'Im Haupttext als Herkunftsbezug verstanden: „aus deiner Heimat verbannt“.'
  alternative: 'Formal: „ein Verbannter zu deinem Ort“ bzw. „an deinem Ort“'
  rationale: Die hebräische Formulierung ist gedrängt und textlich bzw. syntaktisch schwierig. Die gewählte Fassung ergibt im Zusammenhang einen verständlichen Sinn, ohne die Unsicherheit zu verschweigen.
translation_notes:
  register: Moderner, würdevoller Erzählstil mit gut verständlicher direkter Rede. „Kehr um“ ist gegenwärtiges Standarddeutsch; „Gatiter“ bewahrt die historische Herkunftsbezeichnung. Die sachlichen Mehrdeutigkeiten werden in Fußnoten offengelegt.
