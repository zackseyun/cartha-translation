  text: וְ/אִם הָ/עִ֣יר תָּשׁ֗וּב וְ/אָמַרְתָּ֤ לְ/אַבְשָׁלוֹם֙ עַבְדְּ/ךָ֨ אֲנִ֤י הַ/מֶּ֨לֶךְ֙ אֶֽהְיֶ֔ה עֶ֣בֶד אָבִ֤י/ךָ וַֽ/אֲנִי֙ מֵ/אָ֔ז וְ/עַתָּ֖ה וַ/אֲנִ֣י עַבְדֶּ֑/ךָ וְ/הֵפַרְתָּ֣ה לִ֔/י אֵ֖ת עֲצַ֥ת אֲחִיתֹֽפֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/034.yaml
  text: But if you return to the city and say to Absalom, ‘I will be your servant, O king; as I was your father’s servant in the past, so now I will be your servant,’ then you will frustrate Ahithophel’s counsel for me.
translation:
  language: de
  text: 'Wenn du aber in die Stadt zurückkehrst und zu Abschalom sagst: »Ich will dein Diener sein, König. Wie ich früher der Diener deines Vaters war, so bin ich jetzt dein Diener«, dann wirst du für mich den Rat Ahitofels vereiteln.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Wenn du aber
  rationale: Die konditionale Partikel wird mit »wenn« wiedergegeben; »aber« bildet den Gegensatz zur zuvor genannten Möglichkeit ab.
- source_word: הַמֶּלֶךְ
  choice: König
  rationale: Als Anrede im Deutschen natürlich ohne Artikel; die Stellung nach der Selbstaussage bewahrt den Sinn des Hebräischen.
- source_word: וְהֵפַרְתָּ
  choice: dann kannst du … vereiteln
  rationale: Das Verb bedeutet hier, einen Plan unwirksam zu machen beziehungsweise zu durchkreuzen. Die deutsche Modalkonstruktion gibt Davids beabsichtigte Folge des Handelns natürlich wieder.
- source_word: עֲצַת אֲחִיתֹפֶל
  choice: den Rat Ahitofels
  rationale: עֵצָה bezeichnet hier sowohl den erteilten Rat als auch den strategischen Plan; »Rat« hält diese Bedeutungsbreite offen.
theological_decisions:
- issue: Huschais vorgetäuschter Loyalitätswechsel
  choice: Die direkte Rede wird ohne moralische Bewertung wiedergegeben.
  alternative: Die Aussage ausdrücklich als Täuschung oder Lüge kennzeichnen.
  rationale: Der Vers berichtet Davids Anweisung, bewertet ihre Moral an dieser Stelle jedoch nicht ausdrücklich.
- issue: לִי als Nutznießerangabe
  choice: für mich
  alternative: mir zuliebe / zu meinen Gunsten
  rationale: »Für mich« bewahrt die knappe Formulierung und lässt offen, ob primär Davids persönlicher Nutzen oder seine Sache gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur »Wie ich früher … so … nun« bleibt erhalten; Eigennamen folgen den im Deutschen üblichen biblischen Formen Abschalom und Ahitofel.
