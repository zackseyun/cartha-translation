  text: וְ/הִשְׁכִּים֙ אַבְשָׁל֔וֹם וְ/עָמַ֕ד עַל יַ֖ד דֶּ֣רֶךְ הַ/שָּׁ֑עַר וַ/יְהִ֡י כָּל הָ/אִ֣ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִיב֩ לָ/ב֨וֹא אֶל הַ/מֶּ֜לֶךְ לַ/מִּשְׁפָּ֗ט וַ/יִּקְרָ֨א אַבְשָׁל֤וֹם אֵלָי/ו֙ וַ/יֹּ֗אמֶר אֵֽי מִ/זֶּ֥ה עִיר֙ אַ֔תָּה וַ/יֹּ֕אמֶר מֵ/אַחַ֥ד שִׁבְטֵֽי יִשְׂרָאֵ֖ל עַבְדֶּֽ/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/002.yaml
  text: Absalom would rise early and stand beside the road to the gate. Whenever any man had a dispute and came to the king for judgment[a], Absalom would call to him and say, “From what city are you?” And he would say, “Your servant is from one of the tribes of Israel.”
translation:
  language: de
  text: 'Absalom pflegte früh am Morgen aufzustehen und sich an den Weg zum Tor zu stellen. Immer wenn jemand einen Rechtsstreit hatte und zum König kam, um sich von ihm Recht sprechen zu lassen[a], rief Absalom ihn zu sich und fragte: »Aus welcher Stadt kommst du?« Er antwortete: »Dein Diener stammt aus einem der Stämme Israels.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um ein Urteil zu erhalten«; das hebräische מִשְׁפָּט bezeichnet hier eine richterliche Entscheidung oder Rechtsprechung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכִּים ... וְעָמַד
  choice: stand früh am Morgen auf und stellte sich
  rationale: Die Verben bezeichnen frühes Aufstehen und Sichhinstellen. Der folgende iterative Zusammenhang zeigt eine wiederholte Gewohnheit; im Deutschen kann diese durch den Kontext und »immer wenn« natürlich ausgedrückt werden.
- source_word: עַל יַד דֶּרֶךְ הַשָּׁעַר
  choice: an den Weg zum Tor
  rationale: עַל יַד bezeichnet die unmittelbare Nähe, während דֶּרֶךְ הַשַּׁעַר den zum Tor führenden Weg meint. Die Formulierung ist räumlich klar und idiomatisch.
- source_word: רִיב
  choice: Rechtsstreit
  rationale: Das Wort kann Streit, Beschwerde oder Rechtssache bedeuten. Wegen des ausdrücklich gerichtlichen Zusammenhangs gibt »Rechtsstreit« die Bedeutung präzise wieder, ohne sie auf eine bestimmte Verfahrensart einzuengen.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ לַמִּשְׁפָּט
  choice: zum König kam, damit dieser Recht sprach
  rationale: לַמִּשְׁפָּט bezeichnet hier die richterliche Entscheidung. Die deutsche Wendung macht deutlich, dass der König als Richter angerufen wurde.
- source_word: וַיִּקְרָא ... אֵלָיו
  choice: rief Absalom ihn zu sich
  rationale: קרא אל kann »jemanden rufen« oder »jemanden zu sich rufen« bedeuten. Die Wahl wahrt die konkrete Szene, ohne einen amtlichen Befehl zu unterstellen.
- source_word: אֵי מִזֶּה עִיר אַתָּה
  choice: Aus welcher Stadt kommst du?
  rationale: Dies ist eine natürliche, direkte Wiedergabe der Herkunftsfrage.
- source_word: מֵאַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: aus einem der Stämme Israels
  rationale: Die knappe hebräische Herkunftsangabe wird im Deutschen idiomatisch mit »aus« wiedergegeben.
- source_word: עַבְדֶּךָ
  choice: Dein Diener
  rationale: Hier handelt es sich um eine ehrerbietige Selbstbezeichnung gegenüber dem Königssohn; »Diener« wahrt dieses gesellschaftliche Register, ohne unnötig einen Sklavenstatus zu behaupten.
