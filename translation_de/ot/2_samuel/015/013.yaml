base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/013.yaml
  text: Then a messenger came to David[a], saying, “The hearts of the men of Israel are with Absalom.”
translation:
  language: de
  text: 'Da kam ein Bote zu David und sagte: „Die Männer Israels stehen hinter Absalom.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „Das Herz der Männer Israels ist Absalom nach.“ Gemeint ist, dass ihre Loyalität oder Gefolgschaft ihm gilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: Das Wayyiqtol führt die Erzählung mit einer einfachen vergangenen Handlung fort; „Da kam“ ist im deutschen Erzählstil natürlich.
- source_word: הַמַּגִּיד
  choice: ein Bote
  rationale: Das substantivierte Hifil-Partizip bezeichnet den Überbringer einer Nachricht. Obwohl die Form bestimmt ist, führt das Deutsche eine solche Person hier idiomatisch mit dem unbestimmten Artikel ein.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Die Infinitivkonstruktion leitet die direkte Rede ein; „und sagte“ gibt ihre Funktion in natürlichem modernem Deutsch wieder.
- source_word: הָיָה לֶב ... אַחֲרֵי
  choice: stehen hinter
  rationale: Die wörtliche Wendung vom „Herz“ der Männer Israels, das „hinter“ Absalom ist, bezeichnet ihre innere und politische Gefolgschaft. „Hinter jemandem stehen“ bewahrt das Bild des Nachfolgens und vermittelt die gemeinte Loyalität klar.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: אִישׁ steht formal im Singular, wird hier jedoch kollektiv gebraucht. „Die Männer Israels“ wahrt sowohl den kollektiven als auch den ausdrücklich männlichen und wahrscheinlich politisch-militärischen Sinn.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Der Personenname wird gemäß der im Deutschen etablierten biblischen Namensform wiedergegeben.
