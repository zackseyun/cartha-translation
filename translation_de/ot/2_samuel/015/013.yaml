translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die politische Loyalitätswendung wird idiomatisch wiedergegeben; die ungewöhnliche kollektive Einzahl „Herz“ und das hebräische Bild bleiben in der Fußnote sichtbar.
