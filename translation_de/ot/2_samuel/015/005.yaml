  text: וְ/הָיָה֙ בִּ/קְרָב אִ֔ישׁ לְ/הִשְׁתַּחֲוֺ֖ת ל֑/וֹ וְ/שָׁלַ֧ח אֶת יָד֛/וֹ וְ/הֶחֱזִ֥יק ל֖/וֹ וְ/נָ֥שַׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/005.yaml
  text: And whenever a man came near to bow down to him[a], he would reach out his hand, take hold of him, and kiss him.
translation:
  language: de
  text: Und sooft ein Mann sich näherte, um sich vor ihm niederzubeugen[a], streckte er seine Hand aus, hielt ihn fest und küsste ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihm zu huldigen“. Das hebräische Verb kann eine ehrerbietige Verneigung bezeichnen und meint nicht notwendigerweise Anbetung im engeren religiösen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und sooft …, …
  rationale: Die Konstruktion mit היה beschreibt hier einen wiederholten, gewohnheitsmäßigen Vorgang; „sooft“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: בִּקְרָב
  choice: sich näherte
  rationale: קרב bezeichnet das Herankommen bzw. Näherkommen an Absalom.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das hebräische Substantiv steht im maskulinen Singular und bezeichnet hier jeweils einen der Männer, die zu Absalom kamen.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: um sich vor ihm niederzuwerfen
  rationale: השתחוה bezeichnet eine körperliche Verneigung oder Prostration als Ausdruck der Ehrerbietung; die Formulierung bewahrt die konkrete Geste, ohne religiöse Anbetung festzulegen.
- source_word: וְשָׁלַח אֶת יָדוֹ
  choice: streckte er seine Hand aus
  rationale: Die Verbindung von שׁלח mit „Hand“ bezeichnet das Ausstrecken der Hand.
- source_word: וְהֶחֱזִיק לוֹ
  choice: hielt ihn fest
  rationale: החזיק bedeutet hier, jemanden zu ergreifen beziehungsweise festzuhalten; im Zusammenhang ist keine gewaltsame Nuance erforderlich.
- source_word: וְנָשַׁק לוֹ
  choice: und küsste ihn
  rationale: נשק ist das gewöhnliche Verb für „küssen“ und bezeichnet hier eine soziale Geste der Zuwendung.
theological_decisions:
- issue: Bedeutung von השתחוה
  choice: sich vor ihm niederwerfen
  alternative: ihm huldigen
  rationale: Der Haupttext bewahrt die körperliche Handlung und lässt offen, wie stark der Akt politisch oder gesellschaftlich als Huldigung zu verstehen ist; eine religiöse Anbetung ist nicht zwingend gemeint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Handlung wird durch „sooft“ ausgedrückt; die Satzfolge bleibt anschaulich und eng am hebräischen Erzählstil.
