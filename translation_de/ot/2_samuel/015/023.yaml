  source_fidelity: Die Grundwiedergabe trifft die kollektive Klage, das wiederholte Hinüberziehen und die Route zur Wüste. »Während« macht jedoch aus der hebräischen Reihung unnötig eine unterordnende Zeitbeziehung, und »weiterzog« fügt gegenüber עֹבְרִים den Aspekt des Weiterziehens hinzu und verdeckt die wiederholte Bewegung des Hinüberziehens.
  naturalness: Die vorgeschlagene Fassung bleibt modernes, würdiges Standarddeutsch. Die Wiederholung von »hinüberziehen« ist hier wegen der bewussten Wiederholung von עבר im Hebräischen angemessen.
  terminology: »Kidrontal« ist als moderne topografische Wiedergabe von נחל קדרון vertretbar; die Fußnote bewahrt die traditionelle Bezeichnung und die sachliche Bandbreite von נחל. »Volk« ist für הָעָם passend.
