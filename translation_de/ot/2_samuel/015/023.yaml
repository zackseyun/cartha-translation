  - severity: medium
    issue: »zog ... weiter« in der letzten Satzhälfte
    rationale: »Weiter« ist im Hebräischen nicht ausgedrückt. Zudem schwächt es die wiederholte Verwendung von עבר ab, die im Deutschen mit »hinüberzog« wiedergegeben werden kann.
  - severity: low
    issue: »Auch der König«
    rationale: Das additive »auch« ist möglich, wird aber vom bloßen Waw nicht verlangt. Die schlichtere Reihung wahrt den Erzählstil genauer.
