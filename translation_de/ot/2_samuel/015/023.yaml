base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/023.yaml
  text: And all the land was weeping with a loud voice[a], and all the people were crossing over. The king also crossed over the Kidron Valley[b], and all the people were crossing over on the road toward the wilderness.
translation:
  language: de
  text: Das ganze Land weinte laut[a], und das ganze Volk zog hinüber. Der König überquerte das Kidrontal[b], und das ganze Volk zog auf dem Weg zur Wüste hinüber[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »weinte mit großer/lauter Stimme«.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: »den Bach Kidron«. Das hebräische Wort kann ein Wadi, eine Schlucht oder einen nur zeitweise wasserführenden Bach bezeichnen.'
    reason: cultural_note
  - marker: c
    text: Die hebräische Wendung ist knapp und lässt sich auch formaler als »auf dem Weg in Richtung Wüste« wiedergeben.
    reason: textual_ambiguity
lexical_decisions:
- source_word: כָל הָאָרֶץ
  choice: das ganze Land
  rationale: Die Wendung bezeichnet hier das Land beziehungsweise die Region kollektiv mitsamt ihrer Bevölkerung; die hebräische Bildsprache bleibt erhalten.
- source_word: בּוֹכִים קוֹל גָּדוֹל
  choice: weinte laut
  rationale: Wörtlich steht »weinten mit großer/lauter Stimme«. Das Deutsche gibt die hörbare, öffentliche Klage natürlich und prägnant wieder; der Plural beim hebräischen Kollektiv wird im Deutschen als Singular formuliert.
- source_word: כָל הָעָם
  choice: das ganze Volk
  rationale: עָם bezeichnet hier Davids gesamte Begleitgruppe und ist nicht auf Soldaten zu verengen.
- source_word: עֹבְרִים / עֹבֵר
  choice: hinüberzog / überquerte / zog … weiter
  rationale: עבר bezeichnet das Hinüberziehen beziehungsweise Überqueren. Beim Volk drücken die Formen einen fortdauernden Vorgang aus, beim König eine einzelne erzählte Handlung; in der letzten Wendung ergibt »weiterzog« zusammen mit der Wegangabe ein natürliches Deutsch.
- source_word: בְּנַחַל קִדְרוֹן
  choice: das Kidrontal
  rationale: נחל kann ein Wadi, ein Kerbtal oder einen zeitweise wasserführenden Bachlauf bezeichnen. »Kidrontal« ist eine verständliche topografische Wiedergabe, ohne ständig fließendes Wasser vorauszusetzen.
- source_word: עַל פְּנֵי דֶרֶךְ אֶת הַמִּדְבָּר
  choice: auf dem Weg zur Wüste
  rationale: Die knappe hebräische Formulierung weist auf den Weg beziehungsweise die Richtung zur Wüste. Die Übersetzung wahrt diese Zielrichtung, ohne die syntaktische Unklarheit unnötig auszudeuten.
