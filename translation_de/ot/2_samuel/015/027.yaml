base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/027.yaml
  text: Then the king said to Zadok the priest[a], “Are you a seer? Return to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan son of Abiathar.”
translation:
  language: de
  text: 'Da sagte der König zu dem Priester Zadok: »Bist du ein Seher?[a] Kehre in Frieden in die Stadt zurück, zusammen mit euren beiden Söhnen, deinem Sohn Ahimaaz und Jonatan, dem Sohn Abjatars.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Siehst du?« beziehungsweise »Du siehst doch?« Das Hebräische kann Zadok als »Seher« bezeichnen oder vom Sehen beziehungsweise Erkennen sprechen.'
    reason: lexikalische und syntaktische Mehrdeutigkeit
lexical_decisions:
- source_word: הֲרוֹאֶה אַתָּה
  choice: Bist du der Seher?
  rationale: Die Form kann רֹאֶה als substantiviertes Partizip »Seher« verstehen; der Fragesatz bewahrt die auffällige hebräische Formulierung und ihre mögliche Beziehung zu Zadoks Beobachter- und Botenrolle.
- source_word: שֻׁבָה
  choice: Kehre … zurück
  rationale: Der Imperativ von שוב mit direktionalem He bezeichnet die Rückkehr und wird im Deutschen natürlich mit »zurückkehren« wiedergegeben.
- source_word: הָעִיר
  choice: in die Stadt
  rationale: Beim Bewegungsverb bezeichnet die bestimmte Nominalform das Ziel; »in die Stadt« ist idiomatisches Deutsch.
- source_word: בְּשָׁלוֹם
  choice: in Frieden
  rationale: Die Wiedergabe erhält den Wortlaut und Bedeutungsumfang von שָׁלוֹם, der hier sowohl friedliches als auch unversehrtes Zurückkehren einschließen kann.
- source_word: שְׁנֵי בְנֵיכֶם אִתְּכֶם
  choice: zusammen mit euren beiden Söhnen
  rationale: Das pluralische Suffix in »euren« und »euch« bezieht Zadok und Abjatar ein; die deutsche Formulierung drückt die Begleitung natürlich aus.
- source_word: וַאֲחִימַעַץ בִּנְךָ וִיהוֹנָתָן בֶּן אֶבְיָתָר
  choice: deinem Sohn Ahimaaz und Jonatan, dem Sohn Abjatars
  rationale: Die ausdrücklichen Vaterschaftsangaben bleiben erhalten. Die Namen werden in geläufiger deutscher biblischer Form wiedergegeben.
theological_decisions:
- issue: Deutung von הֲרוֹאֶה אַתָּה
  choice: Bist du der Seher?
  alternative: Siehst du? / Du siehst doch?
  rationale: Der hebräische Ausdruck ist grammatisch mehrdeutig. Im Haupttext steht die substantivische Deutung, während die mögliche Wahrnehmungsfrage in der Fußnote ausdrücklich erhalten bleibt; dadurch wird Zadoks Funktion nicht dogmatisch festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede wechselt entsprechend dem Hebräischen vom Singular bei Zadok (»du«, »deinem«) zum Plural bei Zadok und Abjatar (»euren«). Die Namen der Söhne werden nachgestellt, um die Zugehörigkeit im Deutschen klar auszudrücken.
