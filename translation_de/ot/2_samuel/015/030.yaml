base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/030.yaml
  text: And David was going up the ascent of the Mount of Olives[a], going up and weeping, with his head covered, and he was walking barefoot. And all the people who were with him each covered his head, and they went up[c][b], weeping as they went.
translation:
  language: de
  text: David aber stieg den Aufstieg zum Ölberg hinauf. Während er hinaufstieg, weinte er; sein Kopf war verhüllt, und er ging barfuß. Auch alle, die bei ihm waren, verhüllten jeweils ihren Kopf[a]. Weinend stiegen sie immer weiter hinauf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jeder von ihnen verhüllte seinen Kopf.« Im Hebräischen steht ein distributiver Singular.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Und sie stiegen hinauf, hinaufsteigend und weinend.« Die Wiederholung hebt den fortgesetzten Vorgang anschaulich hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֵה הַזֵּיתִים
  choice: den Aufstieg zum Ölberg
  rationale: מַעֲלֵה bezeichnet den Aufstieg beziehungsweise den ansteigenden Weg. הַזֵּיתִים wird hier als etablierte topografische Bezeichnung »Ölberg« wiedergegeben.
- source_word: עֹלֶה ... עֹלֶה וּבוֹכֶה
  choice: stieg ... hinauf. Während er hinaufstieg, weinte er
  rationale: Die Wiederholung und der fortdauernde Charakter der Partizipien bleiben hörbar, ohne im Deutschen unnatürlich zu wirken.
- source_word: בֹּכֶה
  choice: weinte
  rationale: Die schlichte körperlich-emotionale Bedeutung wird bewahrt, ohne ein förmliches Klageritual einzutragen.
- source_word: וְרֹאשׁ לוֹ חָפוּי
  choice: sein Kopf war verhüllt
  rationale: Die stative Aussage und das Zeichen der Trauer werden wiedergegeben, ohne die Art der Bedeckung näher zu bestimmen.
- source_word: יָחֵף
  choice: barfuß
  rationale: Dies ist die natürliche und präzise moderne deutsche Entsprechung.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: alle, die bei ihm waren
  rationale: Die Wiedergabe bleibt so allgemein wie הָעָם und legt die Gruppe nicht unnötig als Truppen fest.
- source_word: חָפוּ אִישׁ רֹאשׁוֹ
  choice: verhüllten sich jeder den Kopf
  rationale: Der distributive Singular אִישׁ wird im Haupttext bewahrt; eine idiomatischere Alternative wird in der Fußnote genannt.
- source_word: וְעָלוּ עָלֹה וּבָכֹה
  choice: Weinend stiegen sie immer weiter hinauf
  rationale: Die Verbindung des finiten Verbs mit den Infinitivi absoluti unterstreicht den fortgesetzten, anschaulichen Vollzug. »immer weiter« vermittelt diese emphatisch-durative Wirkung in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Wiederholung des Hinaufsteigens wird zunächst ausdrücklich und am Versende durch »immer weiter« wiedergegeben; dadurch bleibt ihre emphatische Wirkung erhalten, ohne eine schwerfällige deutsche Satzform zu erzeugen.
