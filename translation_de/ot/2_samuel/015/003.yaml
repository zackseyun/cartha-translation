source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אַבְשָׁל֔וֹם רְאֵ֥ה דְבָרֶ֖/ךָ טוֹבִ֣ים וּ/נְכֹחִ֑ים וְ/שֹׁמֵ֥עַ אֵין לְ/ךָ֖ מֵ/אֵ֥ת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/003.yaml
  text: Then Absalom said to him[a], “Look, your claims are good and right[b], but there is no one from the king to hear you.”
translation:
  language: de
  text: 'Da sagte Absalom zu ihm: »Sieh, deine Anliegen sind gut und berechtigt[a]. Aber vonseiten des Königs ist niemand da, der dich anhört[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Deine Sache ist gut und richtig.« Das hebräische Wort דָּבָר kann »Wort«, »Angelegenheit« oder in einem rechtlichen Zusammenhang »Rechtssache/Anspruch« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Aber es gibt für dich keinen Hörenden vonseiten des Königs.« Gemeint ist offenbar niemand, der vom König beauftragt ist, die Rechtssache anzuhören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אַבְשָׁלוֹם
  choice: Da sagte Absalom zu ihm
  rationale: Das Narrativ-Waw führt die Handlung weiter. »Da sagte« gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder; »zu ihm« bewahrt den pronominalen Bezug.
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ dient als Aufmerksamkeitssignal. »Sieh« ist knapp, gegenwärtig und würdevoll, ohne das altertümliche »siehe«.
- source_word: דְבָרֶךָ
  choice: deine Anliegen
  rationale: דָּבָר kann Wort, Angelegenheit oder im Rechtszusammenhang einen vorgetragenen Fall beziehungsweise Anspruch bezeichnen. Der Plural »Anliegen« passt zu den pluralischen Adjektiven טוֹבִים וּנְכֹחִים und zum gerichtlichen Kontext, ohne die Bedeutung zu eng auf einen einzelnen Rechtsanspruch festzulegen.
- source_word: טוֹבִים וּנְכֹחִים
  choice: gut und berechtigt
  rationale: טוֹבִים bezeichnet eine positive Beurteilung; נְכֹחִים trägt den Gedanken von Geradheit, Richtigkeit und Angemessenheit. »Berechtigt« klingt im rechtlichen Zusammenhang natürlich, ohne bereits ein förmliches Urteil auszudrücken.
- source_word: וְשֹׁמֵעַ אֵין לְךָ מֵאֵת הַמֶּלֶךְ
  choice: Aber vonseiten des Königs ist niemand da, der dich anhört
  rationale: שֹׁמֵעַ bezeichnet hier jemanden, der eine Rechtssache anhört. מֵאֵת הַמֶּלֶךְ weist auf Herkunft oder Beauftragung durch den König hin. Die Formulierung lässt offen, welches konkrete Amt diese Person innehätte.
theological_decisions: []
