  language: en
  yaml_path: translation/ot/2_samuel/015/015.yaml
  text: The king’s servants said to the king[a], “Whatever my lord the king chooses, here are your servants.”
translation:
  language: de
  text: 'Da sagten die Diener des Königs zum König: »Was auch immer mein Herr, der König, wählt – hier sind deine Diener.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das narrative Wayyiqtol von אמר wird im Deutschen natürlich mit »Da sagten« wiedergegeben und führt die direkte Rede ein.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: die Diener des Königs
  rationale: עבד kann Diener, Sklave oder abhängigen Amtsträger bezeichnen. Im höfischen Zusammenhang ist »Diener« angemessen und bewahrt zugleich die Wiederholung mit עֲבָדֶיךָ.
- source_word: אֶל הַמֶּלֶךְ
  choice: zum König
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; »zum König« ist idiomatisches Standarddeutsch.
- source_word: כְּכֹל אֲשֶׁר יִבְחַר
  choice: Was auch immer … wählt
  rationale: Die Wendung bedeutet wörtlich »gemäß allem, was … wählt«. Die gewählte Formulierung drückt die uneingeschränkte Bereitschaft aus, sich der Wahl des Königs anzuschließen.
- source_word: יִבְחַר
  choice: wählt
  rationale: »Wählt« bewahrt die Grundbedeutung von בחר, ohne sie deutend zu »entscheidet« zu erweitern.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr, der König
  rationale: Die Formulierung erhält die ehrerbietige höfische Anrede; die Apposition wird im Deutschen durch Kommas kenntlich gemacht.
- source_word: הִנֵּה
  choice: hier sind
  rationale: הִנֵּה stellt die Diener als unmittelbar verfügbar und bereit vor. »Hier sind« ist dafür natürliches modernes Deutsch.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: Die Wiedergabe bewahrt die loyale Selbstbezeichnung und die lexikalische Wiederholung von עבד innerhalb des Verses.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit höfischer Direktrede. Die leicht markierte Wendung »hier sind deine Diener« bewahrt die Präsentations- und Bereitschaftsfunktion von הִנֵּה, ohne das heute altertümliche »siehe« zu verwenden.
