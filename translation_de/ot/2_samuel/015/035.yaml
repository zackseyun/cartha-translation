base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/035.yaml
  text: Are not Zadok and Abiathar the priests there with you? And whatever matter you hear from the king’s house, you shall report to Zadok and Abiathar the priests.
translation:
  language: de
  text: Sind nicht die Priester Zadok und Abjatar dort bei dir? Und alles, was du aus dem Haus des Königs erfährst, sollst du den Priestern Zadok und Abjatar berichten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל־הַדָּבָר אֲשֶׁר תִּשְׁמַע
  choice: Alles, was du … erfährst
  rationale: דָּבָר kann hier »Sache«, »Angelegenheit«, »Wort« oder allgemein den Inhalt einer Nachricht bezeichnen. Im Deutschen gibt »alles, was du erfährst« den gemeinten Informationsgehalt natürlich wieder, ohne ihn auf bloß akustisches Hören zu verengen.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: aus dem Haus des Königs
  rationale: Die formale Wendung bewahrt die mögliche Bedeutung sowohl des königlichen Gebäudes als auch des dortigen Hof- und Regierungsbereichs.
- source_word: תַּגִּיד
  choice: sollst du … berichten
  rationale: Das Verb bezeichnet das Mitteilen oder Melden von Information; »berichten« passt zum Auftrag, Nachrichten weiterzugeben.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die rhetorische Frage bleibt erhalten. Die wiederholte Amtsbezeichnung »die Priester« wird entsprechend dem Hebräischen in beiden Satzteilen wiedergegeben; die Wortstellung ist für natürliches Deutsch angepasst.
