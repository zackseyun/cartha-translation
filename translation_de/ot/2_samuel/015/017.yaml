  terminology: „Volk“ bewahrt die Weite von עָם. Der mögliche Ortsname ist als „Bet-Merhak“ wiederzugeben, nicht „Bet-Hammerchak“; letzteres entspricht dem hebräischen מֶּרְחָק nicht zuverlässig.
