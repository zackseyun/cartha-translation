- from: Der König zog hinaus, und das ganze Volk ging zu Fuß mit ihm. Beim abgelegenen Haus[a] machten sie halt.
  to: Der König zog hinaus, und das ganze Volk folgte ihm. Beim letzten Haus[a] machten sie halt.
