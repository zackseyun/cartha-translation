  text: The king went out[a], and all the people with him on foot, and they halted at the distant house.
translation:
  language: de
  text: Der König zog hinaus, und das ganze Volk folgte ihm. Beim letzten Haus[a] machten sie halt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beim abgelegenen Haus“. Der hebräische Ausdruck kann „Haus der Ferne/Entfernung“ bedeuten; möglicherweise ist Bet-Merhak ein Ortsname.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: zog hinaus
  rationale: Das Qal von יצא bezeichnet hier das Hinausgehen beziehungsweise den Aufbruch des Königs; „zog hinaus“ passt zum würdevollen Erzählstil und zum anschließenden Weg der Gruppe.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die bestimmte Bezeichnung verweist im Kontext auf David und wird direkt wiedergegeben.
- source_word: וְכָל הָעָם
  choice: und das ganze Volk
  rationale: עָם bezeichnet die gesamte den König begleitende Gruppe, ohne sie ausdrücklich auf Soldaten einzugrenzen.
- source_word: בְּרַגְלָיו
  choice: ging zu Fuß mit ihm
  rationale: Die Wendung lautet wörtlich etwa „an/bei seinen Füßen“ und bezeichnet hier wahrscheinlich die Begleitung in seinem Gefolge, offenbar zu Fuß. Die Übersetzung bewahrt beide Aspekte in natürlichem Deutsch.
- source_word: וַיַּעַמְדוּ
  choice: machten sie halt
  rationale: עמד bedeutet grundsätzlich „stehen“, bezeichnet in einem Reisebericht aber passend das Anhalten oder Stationmachen.
- source_word: בֵּית הַמֶּרְחָק
  choice: beim abgelegenen Haus
  rationale: Die Konstruktion bedeutet wörtlich ungefähr „Haus der Entfernung/Ferne“. „Abgelegenes Haus“ bleibt näher an dieser Formulierung als das stärker deutende „letztes Haus“, ohne die mögliche Lesart als Ortsname auszuschließen.
