base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/009.yaml
  text: The king said to him, “Go in peace.” So he arose and went to Hebron.
translation:
  language: de
  text: 'Der König sagte zu ihm: »Geh in Frieden!« Da stand er auf und ging nach Hebron.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die gewöhnliche deutsche Wiedergabe des narrativen Wayyiqtol von אמר; sie leitet die direkte Rede natürlich und ohne Zusatz ein.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Bewahrt die bestimmte Bezeichnung des Hebräischen, die sich im Kontext auf David bezieht, ohne den Namen erklärend einzusetzen.
- source_word: לֵךְ
  choice: Geh
  rationale: Natürliche und genaue Wiedergabe des Imperativs von הלך.
- source_word: בְּשָׁלוֹם
  choice: in Frieden
  rationale: Bewahrt die hebräische Abschieds- und Segensformel und ist im Deutschen idiomatisch.
- source_word: וַיָּקָם
  choice: Da stand er auf
  rationale: Gibt das narrative Fortschreiten und die konkrete Bedeutung von קום in natürlichem modernem Deutsch wieder.
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: Schlichte Wiedergabe des Bewegungsverbs הלך in der anschließenden Erzählfolge.
- source_word: חֶבְרוֹנָה
  choice: nach Hebron
  rationale: Die Richtungsendung ה bezeichnet eine Bewegung auf den Ort zu; bei Städtenamen wird dies im Deutschen natürlich mit »nach« ausgedrückt.
theological_decisions: []
