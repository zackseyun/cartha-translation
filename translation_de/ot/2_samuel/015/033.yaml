  text: וַ/יֹּ֥אמֶר ל֖/וֹ דָּוִ֑ד אִ֚ם עָבַ֣רְתָּ אִתִּ֔/י וְ/הָיִ֥תָ עָלַ֖/י לְ/מַשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/033.yaml
  text: David said to him[a], “If you pass on with me, you will be a burden to me.”
translation:
  language: de
  text: 'David sagte zu ihm: »Wenn du mit mir weiterziehst, wirst du mir zur Last fallen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר ... דָּוִד
  choice: David sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung fort; im natürlichen modernen Deutsch genügt die unmarkierte Erzählform ohne ein zusätzliches »und« oder »da«.
- source_word: לוֹ
  choice: zu ihm
  rationale: Das hebräische Pronomen wird ausdrücklich wiedergegeben; den aus dem Kontext bekannten Namen Huschai einzusetzen, würde über den Wortlaut des Verses hinausgehen.
- source_word: אִם
  choice: wenn
  rationale: Die Konjunktion leitet eine reale Bedingung ein; »wenn« ist hier direkt und idiomatisch.
- source_word: עָבַרְתָּ אִתִּי
  choice: du mit mir weiterziehst
  rationale: עבר bezeichnet grundlegend ein Hinüber- oder Weitergehen. Im Kontext von Davids Flucht gibt »weiterziehen« die gemeinsame Fortbewegung natürlich wieder, ohne eine im Vers nicht eigens genannte Überquerung festzulegen.
- source_word: וְהָיִתָ עָלַי
  choice: wirst du mir ... fallen
  rationale: Die Konstruktion היה mit על beschreibt die entstehende Belastung für David. Die deutsche Wendung »jemandem zur Last fallen« bildet diese Beziehung idiomatisch ab.
- source_word: לְמַשָּׂא
  choice: zur Last
  rationale: מַשָּׂא bedeutet eine zu tragende Last oder Bürde. »Zur Last« ist in diesem zwischenmenschlichen Zusammenhang klar, würdig und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und bewahrt Davids deutliche Einschätzung. Die Bewegungsbedeutung von עבר wird mit »weiterziehen« kontextgerecht wiedergegeben, ohne eine konkrete geografische Überquerung zu ergänzen.
