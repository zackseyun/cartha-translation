base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/006.yaml
  text: Absalom did this to all Israel who came to the king for judgment[a], and Absalom stole the hearts of the men of Israel.
translation:
  language: de
  text: So verfuhr Absalom mit allen Israeliten, die zum König kamen, um sich Recht sprechen zu lassen. Und Absalom stahl die Herzen der Männer Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gewann die Männer Israels für sich“. Wörtlich heißt es im Hebräischen: „stahl das Herz der Männer Israels“. Das Bild deutet an, dass Absalom ihre Loyalität auf verdeckte oder manipulative Weise gewann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אַבְשָׁלוֹם כַּדָּבָר הַזֶּה
  choice: So machte es Absalom
  rationale: Die Wendung verweist auf Absaloms wiederholtes Verhalten im vorausgehenden Kontext. „So machte es“ gibt diesen Rückverweis knapp und natürlich wieder.
- source_word: לְכָל יִשְׂרָאֵל
  choice: bei allen Israeliten
  rationale: Das לְ bezeichnet hier die Personen, denen gegenüber Absalom so handelte. „Bei allen Israeliten“ ist im Deutschen idiomatischer als die wörtliche Form „für/zu ganz Israel“.
- source_word: אֲשֶׁר יָבֹאוּ
  choice: die … kamen
  rationale: Der Imperfekt beschreibt im erzählenden Rückblick einen regelmäßig wiederkehrenden Vorgang; das deutsche Präteritum vermittelt dies im Zusammenhang natürlich.
- source_word: לַמִּשְׁפָּט
  choice: um einen Rechtsspruch zu erhalten
  rationale: מִשְׁפָּט meint hier die richterliche Entscheidung in einer Rechtssache. Die Formulierung macht Zweck und gerichtlichen Zusammenhang deutlich, ohne das Wort auf das allgemeinere „Gerechtigkeit“ zu verengen.
- source_word: וַיְגַנֵּב
  choice: stahl
  rationale: Das Verb גנב bedeutet wörtlich „stehlen“. Die Beibehaltung des Bildes bewahrt den Unterton, dass Absalom Loyalität auf verdeckte oder manipulative Weise gewann.
- source_word: אֶת לֵב אַנְשֵׁי יִשְׂרָאֵל
  choice: die Herzen der Männer Israels
  rationale: Das Hebräische gebraucht „Herz“ kollektiv im Singular. Im Deutschen ist bei mehreren Personen der distributive Plural „die Herzen“ natürlicher; „Männer Israels“ bewahrt die ausdrücklich maskuline Bezeichnung אַנְשֵׁי.
theological_decisions:
- issue: Geschlechtsspezifische Formulierung in אַנְשֵׁי יִשְׂרָאֵל
  choice: die Männer Israels
  alternative: die Menschen Israels / die Israeliten
  rationale: אַנְשֵׁי ist ausdrücklich maskulin. Obwohl die Wendung stellvertretend für eine breitere Bevölkerung stehen kann, wird die sprachliche Form des Ausgangstextes nicht stillschweigend neutralisiert.
- issue: Bildhafte Aussage „das Herz stehlen“
  choice: stahl … die Herzen
  alternative: gewann … für sich
  rationale: Die wörtliche Metapher lässt den kritischen Unterton von Absaloms Vorgehen erkennen. Eine rein positive Wiedergabe wie „gewann“ könnte die angedeutete Heimlichkeit oder Manipulation abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Rechtsspruch“ hält den gerichtlichen Sinn präzise fest; die markante hebräische Metapher wird im Haupttext bewahrt und in der Fußnote erläutert.
