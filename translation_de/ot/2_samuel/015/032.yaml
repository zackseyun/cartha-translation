source:
  edition: WLC
  text: וַ/יְהִ֤י דָוִד֙ בָּ֣א עַד הָ/רֹ֔אשׁ אֲשֶֽׁר יִשְׁתַּחֲוֶ֥ה שָׁ֖ם לֵ/אלֹהִ֑ים וְ/הִנֵּ֤ה לִ/קְרָאת/וֹ֙ חוּשַׁ֣י הָ/אַרְכִּ֔י קָר֨וּעַ֙ כֻּתָּנְתּ֔/וֹ וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/032.yaml
  text: When David came to the summit[a], where he worshiped God, behold[b], Hushai the Archite came to meet him with his tunic torn and dirt on his head.
translation:
  language: de
  text: Als David auf den Gipfel kam, wo er Gott anbetete[a], siehe[b], da kam ihm Huschai, der Arkiter, entgegen. Sein Gewand war zerrissen, und auf seinem Kopf lag Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Verbform kann sowohl eine damalige einzelne Handlung als auch Davids Gewohnheit bezeichnen: »wo er gewöhnlich Gott anbetete«.'
    reason: lexical_alternative
  - marker: b
    text: »Siehe« gibt einen hebräischen Erzählmarker wieder, der Huschais plötzliches Auftreten hervorhebt.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: der Gipfel
  rationale: Wörtlich »der Kopf«; im topografischen Zusammenhang bezeichnet das Wort die Anhöhe beziehungsweise ihren höchsten Punkt. »Gipfel« gibt diesen Sinn natürlich wieder.
- source_word: אֲשֶׁר יִשְׁתַּחֲוֶה שָׁם לֵאלֹהִים
  choice: wo er Gott anbetete
  rationale: Das Verb bezeichnet wörtlich ein Sich-Niederwerfen und im Bezug auf Gott kultische Verehrung. Das deutsche Imperfekt »anbetete« lässt offen, ob eine einzelne oder eine gewohnheitsmäßige Handlung gemeint ist.
- source_word: וְהִנֵּה
  choice: siehe
  rationale: Der hebräische Erzählmarker lenkt die Aufmerksamkeit auf Huschais unvermitteltes Auftreten. Das gehobene, aber verständliche »siehe« bewahrt diese erzählerische Hervorhebung.
- source_word: לִקְרָאתוֹ
  choice: kam ihm … entgegen
  rationale: Die Wendung bezeichnet die Bewegung auf jemanden zu, um ihm zu begegnen. Im Deutschen wird das aus dem Zusammenhang erschlossene Bewegungsverb ausdrücklich wiedergegeben.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Huschai, der Arkiter
  rationale: Der Personenname wird deutsch transliteriert; die Herkunftsbezeichnung wird in der üblichen Form »Arkiter« wiedergegeben.
- source_word: קָרוּעַ כֻּתָּנְתּוֹ
  choice: Sein Gewand war zerrissen
  rationale: כֻּתֹּנֶת bezeichnet ein am Körper getragenes Kleidungsstück. »Gewand« ist im Deutschen verständlich und vermeidet eine zu enge Festlegung auf »Untergewand« oder »Tunika«; קָרוּעַ beschreibt dessen zerrissenen Zustand.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: auf seinem Kopf lag Erde
  rationale: אֲדָמָה bedeutet Erde oder Erdboden, nicht speziell feinen Staub. Die Formulierung bewahrt das sichtbare Trauerzeichen ohne den Begriff unnötig einzuengen.
theological_decisions:
- issue: Zeitwert von יִשְׁתַּחֲוֶה
  choice: »wo er Gott anbetete« mit erklärender Fußnote
  alternative: »wo er gewöhnlich Gott anbetete« oder »wo er Gott anbetete« als einmalige Handlung
  rationale: Die hebräische Imperfektform kann hier gewohnheitsmäßiges Handeln bezeichnen, zwingt aber nicht zu dieser Deutung. Die Übersetzung erhält die Offenheit, statt eine bestimmte Vorgeschichte des Ortes festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem erzählerischem Ton. »Siehe« bleibt wegen seiner narrativen Funktion erhalten und wird in einer Fußnote erläutert; sonst werden veraltete oder unnötig fachsprachliche Kleidungsbegriffe vermieden.
