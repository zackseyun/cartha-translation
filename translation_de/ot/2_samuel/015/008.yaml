  text: כִּי נֵ֨דֶר֙ נָדַ֣ר עַבְדְּ/ךָ֔ בְּ/שִׁבְתִּ֥/י בִ/גְשׁ֛וּר בַּ/אֲרָ֖ם לֵ/אמֹ֑ר אִם ישיב יְשִׁיבֵ֤/נִי יְהוָה֙ יְר֣וּשָׁלִַ֔ם וְ/עָבַדְתִּ֖י אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/008.yaml
  text: For your servant made a vow while I was dwelling in Geshur in Aram[a], saying, ‘If Yahweh indeed brings me back to Jerusalem[c][b], then I will serve Yahweh.’
translation:
  language: de
  text: 'Denn dein Diener hat ein Gelübde abgelegt[a], als ich in Geschur in Aram lebte, mit den Worten: »Wenn Jahwe mich wirklich nach Jerusalem zurückbringt[b], will ich Jahwe dienen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: »ein Gelübde gelobt«; im Hebräischen stehen Substantiv und Verb desselben Wortstamms zusammen.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische verstärkt das Verb »zurückbringen« durch eine Wiederholung desselben Verbstamms.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Jahwe anbeten«. Das hebräische Verb kann den Dienst für Gott im Gottesdienst bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר נָדַר
  choice: hat ein Gelübde abgelegt
  rationale: Die hebräische figura etymologica (wörtlich etwa »ein Gelübde geloben«) wird in natürlichem, würdigem Deutsch idiomatisch wiedergegeben.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: In der Anrede an den König ist dies eine konventionelle ehrerbietige Selbstbezeichnung; »Diener« trifft hier das höfische Register besser als »Sklave«.
- source_word: בְּשִׁבְתִּי
  choice: als ich … lebte
  rationale: Die Infinitivkonstruktion bezeichnet den Zeitpunkt beziehungsweise Zeitraum des Gelübdes; »lebte« ist gegenwärtiges, natürliches Deutsch.
- source_word: בִגְשׁוּר בַּאֲרָם
  choice: in Geschur in Aram
  rationale: Die doppelte Ortsangabe bleibt erhalten, ohne das genaue politische oder geografische Verhältnis zwischen Geschur und Aram näher festzulegen.
- source_word: לֵאמֹר
  choice: Ich sagte
  rationale: Die formelhafte Einleitung des Zitats wird im Deutschen als eigener Satz natürlich wiedergegeben.
- source_word: אִם ישיב יְשִׁיבֵנִי
  choice: Wenn Jahwe mich wirklich … zurückbringt
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Hifil von שוב verstärkt die Aussage. »wirklich« gibt diese Emphase wieder; »zurückbringt« hält die räumliche Rückkehr fest.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: וְעָבַדְתִּי אֶת יְהוָה
  choice: will ich Jahwe dienen
  rationale: עבד kann im Blick auf Gott kultischen Dienst beziehungsweise Anbetung bezeichnen. »dienen« bewahrt den weiteren Bedeutungsumfang und die mögliche kultische Dimension.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt den Charakter als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עבד im Dienst für Gott
  choice: dienen
  alternative: anbeten
  rationale: Im Zusammenhang eines Gelübdes kann das Verb gottesdienstliches Handeln einschließen, bezeichnet aber grundsätzlich Dienst. »dienen« lässt den breiteren Sinn und die kultische Nuance offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die ehrerbietige Selbstbezeichnung »dein Diener« und der anschließende Wechsel zur ersten Person folgen dem hebräischen Redestil. Alle erklärungsbedürftigen formalen und semantischen Alternativen stehen in knappen Fußnoten.
