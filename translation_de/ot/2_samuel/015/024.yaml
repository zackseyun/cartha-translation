  text: וְ/הִנֵּ֨ה גַם צָד֜וֹק וְ/כָֽל הַ/לְוִיִּ֣ם אִתּ֗/וֹ נֹֽשְׂאִים֙ אֶת אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים וַ/יַּצִּ֨קוּ֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים וַ/יַּ֖עַל אֶבְיָתָ֑ר עַד תֹּ֥ם כָּל הָ/עָ֖ם לַ/עֲב֥וֹר מִן הָ/עִֽיר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/024.yaml
  text: And look[a], Zadok also came, and all the Levites with him, carrying the ark of the covenant of God. And they set down the ark of God[c][b], and Abiathar went up until all the people had finished crossing over from the city.
translation:
  language: de
  text: Und da war auch Zadok mit allen Leviten, die bei ihm waren und die Lade des Bundes Gottes trugen. Sie stellten die Lade Gottes ab[a], und Abjatar ging hinauf[b], bis das ganze Volk aus der Stadt[c] hinübergezogen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie stellten die Lade Gottes auf.“ Das hebräische Verb kann hier das Abstellen oder Positionieren bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Abjatar kam herauf.“ Wörtlich bezeichnet das hebräische Verb eine Aufwärtsbewegung; die genaue Perspektive im Erzählablauf ist unsicher.'
    reason: alternative_reading
  - marker: c
    text: Gemeint ist Jerusalem.
    reason: cross_reference
lexical_decisions:
- source_word: וְהִנֵּה גַם צָדוֹק
  choice: Und da war auch Zadok
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf einen neu in den Blick tretenden Teilnehmer. „Und da war“ gibt diese Funktion in natürlichem, würdigem Gegenwartsdeutsch wieder, ohne das heute altertümliche „siehe“ zu verwenden. Das im Englischen ergänzte „came“ steht nicht ausdrücklich im Hebräischen.
- source_word: וְכָל הַלְוִיִּם אִתּוֹ
  choice: mit allen Leviten, die bei ihm waren
  rationale: Die Formulierung bewahrt den Bezug von אִתּוֹ auf Zadok und klingt im Deutschen klarer als eine bloße Reihung.
- source_word: נֹשְׂאִים
  choice: trugen
  rationale: Das Partizip beschreibt die begleitende Handlung der Leviten; „trugen“ ist natürlich und sachlich.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: die Lade des Bundes Gottes
  rationale: Die vollständige hebräische Genitivverbindung wird transparent wiedergegeben; „Lade“ ist die etablierte deutsche Bezeichnung für אֲרוֹן in diesem kultischen Zusammenhang.
- source_word: וַיַּצִּקוּ אֶת אֲרוֹן הָאֱלֹהִים
  choice: Sie stellten die Lade Gottes ab
  rationale: Im Kontext bezeichnet das schwierige Verb das Abstellen oder Positionieren der Lade. „stellten … ab“ gibt die konkrete Handlung wieder, ohne eine präzisere räumliche Anordnung zu behaupten.
- source_word: וַיַּעַל אֶבְיָתָר
  choice: und Abjatar ging hinauf
  rationale: Die Grundbedeutung von עלה ist eine Aufwärtsbewegung. Die Übersetzung wahrt diese, statt eine nicht ausdrücklich genannte priesterliche Handlung einzutragen.
- source_word: עַד תֹּם כָּל הָעָם לַעֲבֹר מִן הָעִיר
  choice: bis das ganze Volk die Stadt verlassen hatte
  rationale: Wörtlich geht es darum, dass das Volk mit dem Hinübergehen aus der Stadt fertig war. „die Stadt verlassen hatte“ verbindet Ausgangspunkt und abgeschlossene Bewegung idiomatisch, ohne das Ziel oder den überquerten Ort zu ergänzen.
theological_decisions:
- issue: Bezug von „der Stadt“
  choice: „die Stadt“ bleibt im Haupttext unbenannt
  alternative: „Jerusalem“
  rationale: Jerusalem ist im Zusammenhang eindeutig gemeint, doch der hebräische Text nennt hier nur „die Stadt“. Die Identifikation wird daher in einer Fußnote erläutert.
- issue: Bedeutung von וַיַּעַל אֶבְיָתָר
  choice: „Abjatar ging hinauf“
  alternative: „Abjatar kam herauf“ oder eine Deutung als Opferhandlung
  rationale: Der Wortlaut bezeichnet am unmittelbarsten eine Aufwärtsbewegung; Richtungsperspektive und genaue erzählerische Funktion bleiben unsicher und sollen nicht dogmatisch festgelegt werden.
- issue: Bedeutung von וַיַּצִּקוּ
  choice: „stellten … ab“
  alternative: „stellten … auf“ oder „brachten … an ihren Platz“
  rationale: Das seltene Verb ist in diesem Zusammenhang nicht völlig eindeutig. Die gewählte Fassung bezeichnet das Niederstellen der Lade, ohne eine darüber hinausgehende kultische Deutung einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdigen Erzählstil. Altertümliches „siehe“ wurde vermieden. Die Satzverknüpfung folgt dem hebräischen Erzählfluss, während „die Stadt verlassen hatte“ die abschließende Bewegungsangabe idiomatisch wiedergibt. Alle Fußnotenmarker stehen unmittelbar an der jeweils erläuterten Stelle.
