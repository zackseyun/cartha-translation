base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/007.yaml
  text: And at the end of forty years, Absalom said to the king, “Please let me go and pay the vow that I vowed to the LORD in Hebron.”
translation:
  language: de
  text: 'Nach Ablauf von vierzig Jahren[a] sagte Abschalom zum König: »Lass mich doch nach Hebron gehen und dort mein Gelübde erfüllen, das ich dem HERRN abgelegt habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text lautet »vierzig Jahre«. Einige alte Textzeugen lesen »vier Jahre«; diese Angabe passt leichter zum erzählten zeitlichen Ablauf.
    reason: Kennzeichnet eine bedeutende alte Textvariante und die bekannte chronologische Schwierigkeit, ohne den masoretischen Haupttext zu ersetzen.
lexical_decisions:
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: Nach Ablauf von vierzig Jahren
  rationale: Gibt den masoretischen Text formal und idiomatisch wieder; die textkritische Schwierigkeit bei der Zahl wird in einer Fußnote offengelegt.
- source_word: אֵלֲכָה נָּא
  choice: Lass mich doch … gehen
  rationale: Gibt die höflich-bittende Nuance von נָא in natürlichem modernem Deutsch wieder.
- source_word: וַאֲשַׁלֵּם אֶת נִדְרִי
  choice: und dort mein Gelübde erfüllen
  rationale: שׁלם bezeichnet hier das Erfüllen beziehungsweise Einlösen eines Gelübdes. „Dort“ macht Hebron als Ziel der beabsichtigten Gelübdeerfüllung verständlich, im Einklang mit dem unmittelbaren Kontext von Vers 8.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen ist würdig, geläufig und vermeidet eine unsichere Rekonstruktion der Aussprache.
theological_decisions:
- issue: Bezug von „in Hebron“
  choice: Hebron wird als Ort der beabsichtigten Erfüllung des Gelübdes wiedergegeben.
  alternative: Hebron als Ort verstehen, an dem Abschalom das Gelübde abgelegt hatte.
  rationale: Vers 8 erklärt ausdrücklich, dass Abschalom das Gelübde während seines Aufenthalts in Geschur abgelegt habe. Daher bezieht sich Hebron im Zusammenhang am natürlichsten auf sein Reiseziel und die dort vorgesehene Erfüllung.
- issue: Textkritisch schwierige Zeitangabe
  choice: „vierzig Jahre“ gemäß dem WLC-Haupttext beibehalten und erläutern.
  alternative: „vier Jahre“ nach einer alten abweichenden Überlieferung in den Haupttext setzen.
  rationale: Die vorgegebene hebräische Textgrundlage liest eindeutig „vierzig“. Da die Angabe chronologisch schwierig ist und eine alte Variante existiert, wird die Spannung nicht stillschweigend beseitigt, sondern transparent in einer Fußnote benannt.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die direkte Rede klingt respektvoll, aber nicht altertümlich. Der Gottesname wird nach verbreiteter deutscher Bibelkonvention als HERR wiedergegeben.
