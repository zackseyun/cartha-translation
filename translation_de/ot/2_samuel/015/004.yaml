  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt werbend und selbstbewusst, ohne Absaloms Aussage stärker zu bewerten, als es der hebräische Text tut. Die rhetorische Wunschform sowie die rechtliche Mehrdeutigkeit des Schlussverbs bleiben durch Text und Fußnote erkennbar.
