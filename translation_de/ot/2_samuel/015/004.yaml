  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם מִי יְשִׂמֵ֥/נִי שֹׁפֵ֖ט בָּ/אָ֑רֶץ וְ/עָלַ֗/י יָב֥וֹא כָּל אִ֛ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִ֥יב וּ/מִשְׁפָּ֖ט וְ/הִצְדַּקְתִּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
translation:
  language: de
  text: 'Absalom pflegte zu sagen[a]: »Wenn man mich doch zum Richter im Land einsetzen würde! Dann könnte jeder, der einen Rechtsstreit oder einen Prozess hat, zu mir kommen[b], und ich würde ihm zu seinem Recht verhelfen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Und Absalom sagte«. Der Zusammenhang zeigt, dass er dies wiederholt sagte.'
    reason: discourse_alternative
  - marker: b
    text: »Jeder« gibt eine grammatisch maskuline Einzahl wieder, die hier allgemein jede Person mit einer Rechtssache bezeichnet.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: »und ich würde ihn für im Recht erklären« oder »ihm Recht geben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: pflegte zu sagen
  rationale: Der Erzählzusammenhang beschreibt Absaloms wiederholtes Vorgehen. Die deutsche Wendung gibt diesen iterativen Sinn natürlich wieder.
- source_word: מִי יְשִׂמֵנִי
  choice: Wenn man mich doch ... einsetzen würde!
  rationale: 'Wörtlich steht eine Frage: »Wer wird mich einsetzen?« Im Zusammenhang hat sie den Charakter eines rhetorischen Wunsches. Das unpersönliche »man« vermeidet einen bestimmten, im Hebräischen nicht genannten Handelnden.'
- source_word: שֹׁפֵט
  choice: Richter
  rationale: Das Wort bezeichnet hier jemanden, der Rechtsfälle entscheidet; »Richter« entspricht dem anschließenden juristischen Wortfeld.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Die Wiedergabe bewahrt den territorialen Sinn, ohne ihn unnötig auf »Staat« oder »Reich« festzulegen.
- source_word: וְעָלַי יָבוֹא
  choice: könnte ... zu mir kommen
  rationale: Der Satz beschreibt die von Absalom vorgestellte Folge seiner Einsetzung und zugleich den von ihm versprochenen Zugang zu seiner Rechtsprechung.
- source_word: כָּל אִישׁ
  choice: jeder
  rationale: Die grammatisch maskuline Einzahl wird hier allgemein für jede Person mit einer Rechtssache gebraucht. »Jeder« ist im Deutschen natürlich und erhält die generische Form.
- source_word: רִיב וּמִשְׁפָּט
  choice: einen Rechtsstreit oder einen Prozess
  rationale: רִיב bezeichnet eine Streit- oder Rechtssache, während מִשְׁפָּט in dieser Verbindung einen gerichtlich zu entscheidenden Fall bezeichnen kann. Die Übersetzung hält beide Ausdrücke unterscheidbar.
- source_word: וְהִצְדַּקְתִּיו
  choice: ich würde ihm zu seinem Recht verhelfen
  rationale: Der Hifil von צדק kann im gerichtlichen Zusammenhang bedeuten, jemanden für im Recht zu erklären oder ihm Recht zu verschaffen. Die Formulierung ist idiomatisch und lässt die günstige Entscheidung erkennen.
theological_decisions: []
