  yaml_path: translation/ot/2_samuel/015/028.yaml
  text: See[b][a], I will wait at the fords of the wilderness until word comes from you to inform me.
translation:
  language: de
  text: Seht, ich werde an den Furten[a] der Wüste warten[b], bis eine Nachricht von euch kommt, die mich informiert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an den Übergangsstellen in der Wüste“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werde mich aufhalten“ beziehungsweise „werde verweilen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Seht
  rationale: Der Imperativ Plural dient als direkte Aufforderung zur Aufmerksamkeit; „Seht“ bewahrt Form und Nachdruck des Hebräischen.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen betont den Sprecher. Im Deutschen wird der Nachdruck durch die vorangestellte Aufforderung und den Satzbau ausreichend vermittelt.
- source_word: מִתְמַהְמֵהַּ
  choice: werde … warten
  rationale: Das Hitpael-Partizip bezeichnet ein Verweilen oder Sich-Aufhalten. Im Kontext wartet David absichtlich auf Nachricht; die Zukunftsform gibt seine erklärte Absicht natürlich wieder.
- source_word: בְּעַבְרוֹת
  choice: an den Furten
  rationale: Die Pluralform bezeichnet Übergangsstellen, wahrscheinlich Furten. „An den Furten“ ist im Flucht- und Reisegeschehen präzise und idiomatisch.
- source_word: הַמִּדְבָּר
  choice: der Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes, offenes und trockenes Land. „Wüste“ ist die geläufige deutsche Bibelbezeichnung, ohne zwingend eine reine Sandwüste zu meinen.
- source_word: עַד בּוֹא דָבָר
  choice: bis eine Nachricht … kommt
  rationale: דָבָר meint hier eine Mitteilung oder Nachricht. Diese Wiedergabe macht den kontextuellen Sinn im modernen Deutsch klar.
- source_word: מֵעִמָּכֶם
  choice: von euch
  rationale: Die Präpositionalverbindung bezeichnet den Ursprung der Nachricht bei den Angesprochenen.
- source_word: לְהַגִּיד לִי
  choice: um mir Bescheid zu geben
  rationale: Der Hifil-Infinitiv von נגד bedeutet, etwas mitzuteilen oder bekannt zu machen. Die Formulierung ist natürlich und bewahrt den Zweckbezug.
