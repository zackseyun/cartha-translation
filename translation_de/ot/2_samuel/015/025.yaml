  naturalness: Der Text ist modernes, verständliches Standarddeutsch mit passendem erzählerischem Register. „Mich die Lade und ihre Wohnstätte sehen lassen“ ist grammatisch und stilistisch möglich; ohne „wieder“ ist es zudem knapper und quellennäher.
