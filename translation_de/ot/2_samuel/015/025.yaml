  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/צָד֔וֹק הָשֵׁ֛ב אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים הָ/עִ֑יר אִם אֶמְצָ֥א חֵן֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֶ/הֱשִׁבַ֕/נִי וְ/הִרְאַ֥/נִי אֹת֖/וֹ וְ/אֶת נָוֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/025.yaml
  text: Then the king said to Zadok[a], “Return the ark of God to the city. If I find favor in the eyes of Yahweh, he will bring me back and let me see it and its dwelling place.”
translation:
  language: de
  text: 'Dann sagte der König zu Zadok: „Bring die Lade Gottes in die Stadt zurück. Wenn ich Gunst in den Augen Jahwes finde, wird er mich zurückbringen und mich die Lade und ihre Wohnstätte sehen lassen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und mich ihn und seine Wohnstätte sehen lassen“. Die hebräischen Pronomen können stärker auf Gott bezogen verstanden werden; der unmittelbarste Bezug ist jedoch die Lade Gottes.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָשֵׁב
  choice: Bring … zurück
  rationale: Der Hifil-Imperativ von שוב fordert Zadok auf, die Lade an ihren bisherigen Ort zurückzubringen. Diese Wiedergabe ist im Deutschen natürlicher als das isolierte „Kehre … zurück“.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: die Lade Gottes
  rationale: Der hebräische Text hat ausdrücklich אֱלֹהִים („Gott“) und nicht den Gottesnamen; daher wird nicht zu „Lade Jahwes“ harmonisiert.
- source_word: הָעִיר
  choice: in die Stadt
  rationale: Die Zielrichtung ergibt sich aus dem Verb und dem Kontext. Gemeint ist Jerusalem, doch der Text selbst sagt hier nur „die Stadt“.
- source_word: אִם אֶמְצָא חֵן בְּעֵינֵי יְהוָה
  choice: Wenn ich Gunst in den Augen Jahwes finde
  rationale: Die Formulierung bewahrt das hebräische Idiom und gibt חֵן angemessen mit „Gunst“ wieder, ohne es deutend zu „wenn Jahwe Gefallen an mir hat“ umzuformen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וֶהֱשִׁבַנִי
  choice: wird er mich zurückbringen
  rationale: Der Hifil von שוב mit Suffix der ersten Person bezeichnet hier das von Jahwe bewirkte Zurückkehren Davids nach Jerusalem.
- source_word: וְהִרְאַנִי
  choice: und mich … wiedersehen lassen
  rationale: Der Hifil von ראה bedeutet „sehen lassen/zeigen“. „Wiedersehen lassen“ ist im Zusammenhang mit Davids erhoffter Rückkehr natürlich; das „wieder“ ergibt sich aus der Rückkehrsituation.
- source_word: אֹתוֹ
  choice: die Lade
  rationale: Das maskuline hebräische Pronomen bezieht sich am unmittelbarsten auf אֲרוֹן („Lade“). Da ein bloßes deutsches „sie“ neben „mich“ weniger klar wäre, wird das Bezugswort wiederholt.
- source_word: נָוֵהוּ
  choice: ihre Wohnstätte
  rationale: נָוֶה bezeichnet eine Wohn- oder Aufenthaltsstätte. Der Ausdruck bleibt offen genug für den Ort der Lade beziehungsweise, mittelbar, Gottes Wohnstätte und vermeidet den anachronistischen Ausdruck „Tempel“.
theological_decisions:
- issue: Bezug von אֹתוֹ וְאֶת־נָוֵהוּ („ihn/es und seine Wohnstätte“)
  choice: Im Haupttext beziehen sich die Ausdrücke unmittelbar auf die Lade und ihre Wohnstätte.
  alternative: Die maskulinen Formen können stärker auf Gott und seine Wohnstätte bezogen verstanden werden.
  rationale: Die unmittelbar zuvor genannte „Lade Gottes“ ist der nächstliegende grammatische Bezug. Da die Lade zugleich für Gottes Gegenwart steht und die hebräischen Formen einen stärker auf Gott bezogenen Sinn zulassen, wird diese Spannung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das hebräische Bild „Gunst in den Augen … finden“ bleibt erhalten. Die Wiederholung von „die Lade“ vermeidet eine im Deutschen missverständliche Pronomenfolge.
