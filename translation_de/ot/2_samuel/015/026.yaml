  text: וְ/אִם֙ כֹּ֣ה יֹאמַ֔ר לֹ֥א חָפַ֖צְתִּי בָּ֑/ךְ הִנְ/נִ֕י יַֽעֲשֶׂה לִּ֕/י כַּ/אֲשֶׁ֥ר ט֖וֹב בְּ/עֵינָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/026.yaml
  text: But if he says[a], ‘I take no pleasure in you,’ here I am[b]; let him do to me as seems good in his eyes.
translation:
  language: de
  text: 'Wenn er aber sagt: »Ich habe kein Gefallen an dir«, hier bin ich. Er soll mit mir tun, was in seinen Augen gut ist[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Bild »was in seinen Augen gut ist« bedeutet: was ihm gut oder richtig erscheint.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאִם
  choice: Wenn ... aber
  rationale: Die bedingende Konjunktion eröffnet eine Möglichkeit, die im Gegensatz zum vorherigen Vers steht. Die deutsche Satzstellung mit »aber« gibt beides natürlich wieder.
- source_word: כֹּה יֹאמַר
  choice: er sagt
  rationale: כֹּה führt bei אמר die direkte Rede ein und braucht im Deutschen keine gesonderte Wiedergabe. Das Imperfekt bezeichnet hier den hypothetischen Fall; im deutschen Konditionalsatz ist Präsens idiomatisch.
- source_word: לֹא חָפַצְתִּי בָּךְ
  choice: Ich habe kein Gefallen an dir
  rationale: חפץ bezeichnet Gefallen oder Wohlgefallen. Die Formulierung bewahrt den relationalen und wertenden Sinn, ohne ihn auf bloßes Wollen oder körperliches Begehren zu verengen.
- source_word: הִנְנִי
  choice: dann bin ich hier
  rationale: Die Selbstvorstellungsformel drückt hier Bereitschaft und Unterwerfung aus. »Dann bin ich hier« klingt im modernen Deutsch natürlich und bindet die Aussage an den vorausgehenden Bedingungssatz.
- source_word: יַעֲשֶׂה לִּי
  choice: Er soll mit mir tun
  rationale: Die jussivische Nuance bringt Davids willige Ergebung in Gottes Handeln zum Ausdruck. »Soll ... tun« gibt diese zulassende Aufforderung knapp wieder.
- source_word: כַּאֲשֶׁר טוֹב בְּעֵינָיו
  choice: was in seinen Augen gut ist
  rationale: Die Übersetzung bewahrt das hebräische Bild und ist zugleich im Deutschen verständlich; gemeint ist, was ihm gut oder richtig erscheint.
theological_decisions:
- issue: Bezug der Pronomen der dritten Person Singular
  choice: Die Pronomen bleiben stehen und beziehen sich aus dem Zusammenhang auf den HERRN.
  alternative: Den Gottesnamen ausdrücklich wiederholen oder die Pronomen durch besondere Großschreibung kennzeichnen.
  rationale: Der hebräische Text wiederholt den Gottesnamen nicht. Die Pronomen bewahren seine Ausdrucksweise, während der Kontext den Bezug eindeutig macht.
- issue: Art von Davids Ergebung
  choice: Die jussivische Form wird als bereitwillige Unterordnung wiedergegeben, ohne Gottes Entscheidung näher zu deuten.
  alternative: Sie stärker als fatalistische Resignation oder als ausdrückliche Bitte formulieren.
  rationale: הִנְנִי und יַעֲשֶׂה zeigen Bereitschaft und Zulassung; der Text legt jedoch weder Fatalismus noch eine eigentliche Bitte eindeutig fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und feierlich; das hebräische Bild »in seinen Augen« wird im Haupttext bewahrt und in der Fußnote erläutert.
