  text: וַ/אֲנִ֗י אָ֤נָה אוֹלִיךְ֙ אֶת חֶרְפָּתִ֔/י וְ/אַתָּ֗ה תִּהְיֶ֛ה כְּ/אַחַ֥ד הַ/נְּבָלִ֖ים בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּה֙ דַּבֶּר נָ֣א אֶל הַ/מֶּ֔לֶךְ כִּ֛י לֹ֥א יִמְנָעֵ֖/נִי מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/013.yaml
  text: As for me[a], where could I carry my disgrace? And you—you would be like one of the fools in Israel. So now, please speak to the king[c][b], for he will not withhold me from you.
translation:
  language: de
  text: Und ich – wohin sollte ich meine Schande[a] tragen? Und du wärst wie einer der Schurken[b] in Israel. Nun rede doch mit dem König, denn er wird mich dir nicht vorenthalten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Schmach« beziehungsweise »meine Entehrung«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »wie einer der Toren«. Das hebräische Wort bezeichnet hier einen moralisch gewissenlosen und ehrlosen Menschen, nicht lediglich einen unverständigen.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: Er wird sich nicht weigern, mich dir zu geben. Ob Tamar dies für eine wirkliche Möglichkeit hielt oder mit ihrer Bitte nur den Übergriff hinauszögern wollte, sagt der Vers nicht.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָנָה
  choice: wohin
  rationale: 'Das Frageadverb steht bei einem Verb der Bewegung und bezeichnet daher am natürlichsten ein Ziel: »Wohin soll ich … tragen?«'
- source_word: אוֹלִיךְ
  choice: soll ich … tragen
  rationale: Der Hifil von הלך bewahrt hier das räumliche Bild des Forttragens; im Deutschen gibt »tragen« zugleich das Erleiden bleibender gesellschaftlicher Schande wieder.
- source_word: חֶרְפָּתִי
  choice: meine Schande
  rationale: Gemeint ist die entehrende, öffentlich wirksame Schmach, die Tamar infolge der Tat treffen würde. »Schande« ist im heutigen Deutsch klar und würdevoll.
- source_word: כְּאַחַד הַנְּבָלִים
  choice: wie einer der schändlichen Menschen
  rationale: נבל bezeichnet hier nicht bloß mangelnde Intelligenz, sondern moralische Verkommenheit und ehrloses Verhalten. Die Wiedergabe macht diese ethische Wertung deutlich, ohne einen engeren Tatbestand hinzuzufügen.
- source_word: דַּבֶּר נָא
  choice: rede doch
  rationale: Der Imperativ mit נָא ist eine dringliche Bitte. »Rede doch« klingt natürlich und gibt den flehentlichen Ton wieder.
- source_word: יִמְנָעֵנִי מִמֶּךָּ
  choice: er wird mich dir nicht vorenthalten
  rationale: מנע bedeutet »zurückhalten, vorenthalten«. Die Formulierung folgt der hebräischen Syntax eng und lässt den im Kontext naheliegenden Gedanken einer Überlassung zur Ehe erkennen, ohne ihn in den Haupttext einzutragen.
theological_decisions:
- issue: Bedeutung und Absicht von Tamars Bitte an den König
  choice: Tamars Aussage wird unmittelbar als Erwartung wiedergegeben, der König werde sie Amnon nicht vorenthalten; ob sie dies wirklich für möglich hielt oder nur Zeit gewinnen wollte, bleibt offen.
  alternative: Die Aussage ausdrücklich als ernst gemeinten Heiratsvorschlag oder ausdrücklich als bloße Verzögerungstaktik deuten.
  rationale: Der Vers selbst erklärt weder die rechtliche oder politische Realisierbarkeit noch Tamars innere Absicht. Die Übersetzung bewahrt deshalb die erzählerische und rechtliche Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich gibt Tamars hervorgehobenes »Und ich« wieder; »Nun rede doch« wahrt den dringlichen, flehenden Ton. Die moralische Bedeutung von נְבָלִים wird im Haupttext verständlich ausgedrückt und in der Fußnote mit der wörtlicheren Alternative dokumentiert.
