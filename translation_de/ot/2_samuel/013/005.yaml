source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ יְה֣וֹנָדָ֔ב שְׁכַ֥ב עַל מִשְׁכָּבְ/ךָ֖ וְ/הִתְחָ֑ל וּ/בָ֧א אָבִ֣י/ךָ לִ/רְאוֹתֶ֗/ךָ וְ/אָמַרְתָּ֣ אֵלָ֡י/ו תָּ֣בֹא נָא֩ תָמָ֨ר אֲחוֹתִ֜/י וְ/תַבְרֵ֣/נִי לֶ֗חֶם וְ/עָשְׂתָ֤ה לְ/עֵינַ/י֙ אֶת הַ/בִּרְיָ֔ה לְמַ֨עַן֙ אֲשֶׁ֣ר אֶרְאֶ֔ה וְ/אָכַלְתִּ֖י מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/005.yaml
  text: Jehonadab said to him[a], “Lie down on your bed and pretend to be sick. When your father comes to see you, say to him, ‘Please let Tamar my sister come and give me food, and let her prepare the meal in my sight[c][b], so that I may watch and eat from her hand.’”
translation:
  language: de
  text: 'Jonadab sagte zu ihm: »Leg dich auf dein Bett und stell dich krank[a]. Wenn dein Vater kommt, um nach dir zu sehen, dann sag zu ihm: ›Bitte lass meine Schwester Tamar kommen und mir etwas zu essen[b] geben. Sie soll vor meinen Augen das Essen[c] zubereiten, damit ich zusehen und aus ihrer Hand essen kann.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Tu so, als seist du krank.« Das hebräische Verb bezeichnet hier ein vorgetäuschtes Kranksein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Brot«; das Wort kann allgemein Nahrung oder Essen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort bezeichnet wahrscheinlich eine besondere Speise für einen Kranken oder Genesenden.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁכַב עַל מִשְׁכָּבְךָ
  choice: Leg dich auf dein Bett
  rationale: Die Verbindung von שׁכב mit עַל und מִשְׁכָּב bezeichnet hier natürlich das Hinlegen auf das eigene Bett.
- source_word: וְהִתְחָל
  choice: stell dich krank
  rationale: Der Hitpael von חלה bezeichnet in diesem Zusammenhang das Vortäuschen einer Krankheit, nicht das tatsächliche Krankwerden.
- source_word: וּבָא אָבִיךָ לִרְאוֹתֶךָ
  choice: Wenn dein Vater kommt, um nach dir zu sehen
  rationale: Die auf die Aufforderungen folgende Verbfolge beschreibt die erwartete Situation; die temporale Wiedergabe mit »wenn« ist im Deutschen natürlich. »Nach dir sehen« passt zum Krankenbesuch.
- source_word: תָּבֹא נָא
  choice: Bitte lass ... kommen
  rationale: נָא kennzeichnet die höfliche Bitte; da der Vater über Tamars Kommen entscheiden soll, gibt »lass ... kommen« die Konstruktion treffend wieder.
- source_word: וְתַבְרֵנִי לֶחֶם
  choice: mir etwas zu essen geben
  rationale: ברה bezeichnet hier das Versorgen beziehungsweise Stärken mit Nahrung. Diese Wiedergabe unterscheidet das Verb von עשה, dem anschließenden Zubereiten, und versteht לֶחֶם idiomatisch als Nahrung.
- source_word: וְעָשְׂתָה לְעֵינַי אֶת הַבִּרְיָה
  choice: Sie soll die Krankenkost vor meinen Augen zubereiten
  rationale: הַבִּרְיָה meint wahrscheinlich eine für einen Kranken oder Genesenden bestimmte Speise; לְעֵינַי wird mit »vor meinen Augen« konkret bewahrt.
- source_word: לְמַעַן אֲשֶׁר אֶרְאֶה
  choice: damit ich zusehen ... kann
  rationale: ראה bezeichnet das Sehen ohne ausdrücklich genanntes Objekt. »Zusehen« greift den beabsichtigten visuellen Vorgang natürlich auf, ohne ein im Hebräischen nicht vorhandenes »es« einzufügen.
- source_word: וְאָכַלְתִּי מִיָּדָהּ
  choice: und aus ihrer Hand essen kann
  rationale: 'Die körperlich-konkrete Formulierung ist für die Handlung bedeutsam und wird daher beibehalten: Tamar soll ihm die Speise persönlich reichen.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch in direkter Rede. »Stell dich krank« ist geläufig und präzise; »Krankenkost« ist verständlich, bewahrt aber durch die Fußnote die leichte lexikalische Unsicherheit. Die beiden Verben für das Versorgen mit Nahrung und das Zubereiten werden bewusst unterschieden.
