  text: וְ/עָלֶ֨י/הָ֙ כְּתֹ֣נֶת פַּסִּ֔ים כִּי֩ כֵ֨ן תִּלְבַּ֧שְׁןָ בְנוֹת הַ/מֶּ֛לֶךְ הַ/בְּתוּלֹ֖ת מְעִילִ֑ים וַ/יֹּצֵ֨א אוֹתָ֤/הּ מְשָֽׁרְת/וֹ֙ הַ/ח֔וּץ וְ/נָעַ֥ל הַ/דֶּ֖לֶת אַחֲרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/018.yaml
  text: She was wearing a richly ornamented robe[a], for this is how the virgin daughters of the king used to dress. Then his attendant put her outside and bolted the door behind her.
translation:
  language: de
  text: Sie trug ein reich verziertes Gewand[a], denn so kleideten sich die jungfräulichen Töchter des Königs. Dann brachte sein Diener sie hinaus und verriegelte hinter ihr die Tür.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein buntes Gewand« beziehungsweise »ein langes Gewand mit Ärmeln«; die genaue Bedeutung der hebräischen Bezeichnung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת פַּסִּים
  choice: ein reich verziertes Gewand
  rationale: Die Wortverbindung bezeichnet ein besonderes Gewand, doch die genaue Bedeutung von פַּסִּים ist unsicher. »Reich verziert« ist im Deutschen verständlich und kennzeichnet das Gewand als vornehm, ohne die ebenfalls möglichen Deutungen »bunt« oder »langärmelig« als sicher auszugeben.
- source_word: כִּי כֵן תִּלְבַּשְׁןָ
  choice: denn so kleideten sich
  rationale: Die Formulierung erläutert eine übliche Kleidungsweise; das Präteritum gibt den erzählerischen Rückblick und den gewohnheitsmäßigen Sinn natürlich wieder.
- source_word: בְנוֹת הַמֶּלֶךְ הַבְּתוּלֹת
  choice: die jungfräulichen Töchter des Königs
  rationale: Die Wiedergabe bewahrt sowohl die königliche Zugehörigkeit als auch die ausdrücklich bezeichnete Jungfräulichkeit.
- source_word: מְעִילִים
  choice: in der Kleidungsbeschreibung mitgedacht
  rationale: Das Wort bezeichnet Gewänder beziehungsweise Obergewänder. Eine zusätzliche Wiedergabe als »in Gewändern« wäre nach »so kleideten sich« im Deutschen schwerfällig; die Bedeutung wird durch die vorausgehende Nennung des besonderen Gewands im Zusammenhang bewahrt.
- source_word: מְשָׁרְתוֹ
  choice: sein Diener
  rationale: Gemeint ist Amnons persönlicher Bediensteter. »Diener« ist natürliches, klares Standarddeutsch und passt zum Erzählzusammenhang.
- source_word: וַיֹּצֵא אֹתָהּ הַחוּץ
  choice: brachte ... sie hinaus
  rationale: Die kausative Verbform besagt, dass der Diener sie nach draußen beförderte. »Hinausbringen« bewahrt dies, ohne die körperliche Gewalt stärker zu bestimmen, als der Ausdruck selbst es tut.
- source_word: וְנָעַל הַדֶּלֶת אַחֲרֶיהָ
  choice: verriegelte hinter ihr die Tür
  rationale: נעל bedeutet hier, die Tür zu verschließen oder zu verriegeln. »Verriegelte« gibt die bewusste Endgültigkeit der Handlung prägnant wieder.
theological_decisions: []
