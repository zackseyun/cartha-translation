  source_fidelity: 'Der Text gibt die hebräische Aussage vollständig und angemessen wieder: Tamar trägt ein besonderes Gewand; die Erklärung bezieht sich auf die übliche Kleidung der jungfräulichen Königstöchter; Amnons Diener bringt sie hinaus und verschließt die Tür hinter ihr. Die umstrittene Bedeutung von כְּתֹנֶת פַּסִּים wird nicht überbestimmt und sachgerecht in der Fußnote kenntlich gemacht.'
  naturalness: Das Deutsch ist modernes, flüssiges Standarddeutsch. „reich verziertes Gewand“, „denn so kleideten sich“ und „verriegelte hinter ihr die Tür“ sind idiomatisch und bewahren den nüchternen erzählerischen Registerton.
  terminology: „jungfräulichen Töchter des Königs“ bewahrt ausdrücklich sowohl die königliche Zugehörigkeit als auch den im Hebräischen genannten Status. „Diener“ ist für מְשָׁרְתוֹ kontextgerecht. „Verriegelte“ trifft נעל gut. Die Auslassung einer gesonderten Wiedergabe von מְעִילִים ist im Deutschen stilistisch vertretbar, da die Aussage über die übliche Kleidung durch „so kleideten sich“ im Zusammenhang erhalten bleibt.
