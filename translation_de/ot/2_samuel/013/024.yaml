base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/024.yaml
  text: Then Absalom came to the king and said, “Look, your servant has shearers. Please let the king and his servants go with your servant.”
translation:
  language: de
  text: 'Da kam Abschalom zum König und sagte: »Sieh doch, dein Diener lässt die Schafe scheren. Der König und seine Diener mögen doch mit deinem Diener kommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹזְזִים
  choice: lässt die Schafe scheren
  rationale: Das substantivierte Partizip bezeichnet im Kontext die Schafscherer beziehungsweise den Vorgang der Schur. Die deutsche Formulierung macht die idiomatische Bedeutung deutlich, ohne einen Besitz an den Scherern zu behaupten.
- source_word: עַבְדֶּךָ
  choice: dein Diener
  rationale: Die höfische Selbstbezeichnung wird formal bewahrt; sie meint Abschalom selbst.
- source_word: יֵלֶךְ נָא
  choice: mögen doch … kommen
  rationale: Der Jussiv mit נָא drückt eine höfliche Einladung beziehungsweise Bitte aus. Im Deutschen ist aus der Perspektive des Einladenden »kommen« natürlicher als das lexikalisch engere »gehen«.
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: Bewahrt das aufmerksamkeitslenkende הִנֵּה und die höflich-abmildernde Partikel נָא in natürlichem Deutsch.
theological_decisions: []
