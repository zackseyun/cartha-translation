source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר ל֗/וֹ אַל אָחִ/י֙ אַל תְּעַנֵּ֔/נִי כִּ֛י לֹא יֵֽעָשֶׂ֥ה כֵ֖ן בְּ/יִשְׂרָאֵ֑ל אַֽל תַּעֲשֵׂ֖ה אֶת הַ/נְּבָלָ֥ה הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/012.yaml
  text: She said to him[a], “No, my brother, do not violate me, for such a thing is not done in Israel[b]. Do not do this disgraceful thing.”
translation:
  language: de
  text: 'Sie sagte zu ihm: „Nein, mein Bruder! Tu mir keine Gewalt an[a], denn so etwas tut man nicht in Israel. Begehe nicht diese Schandtat[b]!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Demütige mich nicht“ oder „Vergewaltige mich nicht“. Das hebräische Verb kann eine gewaltsame Verletzung bezeichnen, bei der sexuelle Gewalt und Demütigung beziehungsweise Entehrung zusammenklingen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „diese empörende Tat“ oder „diese abscheuliche Tat“. Der hebräische Ausdruck bezeichnet eine sittlich skandalöse Tat, nicht bloß Torheit oder Unvernunft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לוֹ
  choice: Sie sagte zu ihm
  rationale: Die Wayyiqtol-Form führt in üblicher Erzählweise Tamars direkte Rede ein. Im natürlichen Deutschen muss die Satzfolge nicht zusätzlich mit „Und“ markiert werden.
- source_word: אַל אָחִי
  choice: Nein, mein Bruder!
  rationale: Das erste אַל hat hier die Kraft eines dringlichen abwehrenden Ausrufs; die wörtliche Verwandtschaftsbezeichnung bleibt erhalten, weil das Geschwisterverhältnis für die Aussage wesentlich ist.
- source_word: אַל תְּעַנֵּנִי
  choice: Tu mir keine Gewalt an
  rationale: ענה im Piel bezeichnet in diesem Zusammenhang eine gewaltsame Verletzung, die sexuelle Gewalt sowie Demütigung und Entehrung einschließt. Die Formulierung ist klar und stark, ohne den Bedeutungsumfang auf nur einen Aspekt zu verengen.
- source_word: כִּי לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל
  choice: denn so etwas tut man nicht in Israel
  rationale: Das unpersönliche Niphal von עשה verweist auf eine gemeinschaftlich geltende sittliche Norm. Die deutsche unpersönliche Wendung gibt dies natürlich wieder.
- source_word: אַל תַּעֲשֵׂה אֶת הַנְּבָלָה הַזֹּאת
  choice: Begehe nicht diese Schandtat
  rationale: נְבָלָה bezeichnet eine moralisch empörende und schändliche Tat, nicht bloße Unvernunft. „Schandtat“ bringt die sittliche Verwerflichkeit prägnant zum Ausdruck; „begehen“ ist mit „Tat“ idiomatischer als ein wörtliches „tun“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Ausrufe bewahren die Dringlichkeit von Tamars Gegenwehr. „Tu mir keine Gewalt an“ ist allgemein verständlich und lässt zugleich die im hebräischen Verb verbundenen Aspekte sexueller Gewalt, Verletzung und Entehrung bestehen.
