base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/033.yaml
  text: Now let not my lord the king take this matter to heart[a], saying, ‘All the king’s sons are dead,’ for Amnon alone is dead.
translation:
  language: de
  text: 'Nun soll mein Herr, der König, sich die Sache nicht zu Herzen nehmen[a] und denken: »Alle Söhne des Königs sind tot.« Denn nur Amnon ist tot.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Sache nicht auf sein Herz legen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun
  rationale: Leitet Jonadabs korrigierende Aussage als natürlicher deutscher Diskursmarker ein.
- source_word: אַל יָשֵׂם ... אֶל לִבּוֹ
  choice: sich ... nicht zu Herzen nehmen
  rationale: Gibt die hebräische Wendung mit Herz-Metaphorik idiomatisch und würdevoll wieder.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr, der König
  rationale: Bewahrt die höfische, ehrerbietige Anrede.
- source_word: דָּבָר
  choice: die Sache
  rationale: Bezeichnet hier den gemeldeten Sachverhalt, ohne ihn enger als bloßes Wort oder Gerücht festzulegen.
- source_word: לֵאמֹר
  choice: und denken
  rationale: Im Deutschen bezeichnet die Infinitivkonstruktion hier natürlich den innerlich angenommenen Inhalt; ein wörtliches „indem er sagt“ wäre missverständlich.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: Alle Söhne des Königs
  rationale: Gibt die konkrete Referenz auf Davids männliche Kinder direkt wieder.
- source_word: מֵתוּ
  choice: sind tot
  rationale: Bewahrt den resultativen beziehungsweise stativen Sinn der gemeldeten Schlussfolgerung.
- source_word: כִּי אִם ... לְבַדּוֹ
  choice: Denn nur ...
  rationale: 'Bringt die ausschließende Korrektur knapp und natürlich zum Ausdruck: Nicht alle, sondern allein Amnon ist tot.'
- source_word: מֵת
  choice: ist tot
  rationale: Entspricht der stativen Aussage und hält den Kontrast zur vorangehenden Falschmeldung aufrecht.
