base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/014.yaml
  text: But he would not listen to her[a], and he was stronger than she was[c][b], and he violated her and lay with her.
translation:
  language: de
  text: Doch er wollte nicht auf sie hören[a]. Er war stärker als sie[b], tat ihr Gewalt an[c] und schlief mit ihr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf ihre Stimme hören“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er überwältigte sie.“'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb kann „demütigen“, „entehren“ oder „Gewalt antun“ bedeuten; hier bezeichnet es sexuelle Gewalt.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: wollte nicht
  rationale: Das Verb bezeichnet Bereitschaft oder Einwilligung. Mit der Verneinung und dem Infinitiv gibt „wollte nicht“ seine bewusste Weigerung natürlich und genau wieder.
- source_word: לִשְׁמֹעַ בְּקוֹלָהּ
  choice: auf sie hören
  rationale: Wörtlich steht „auf ihre Stimme hören“. Die deutsche Wendung „auf sie hören“ vermittelt in diesem Zusammenhang treffend, dass er ihre Bitte nicht beachtete.
- source_word: וַיֶּחֱזַק מִמֶּנָּה
  choice: Er war stärker als sie
  rationale: חזק mit מן drückt hier das Überlegensein beziehungsweise Obsiegen durch größere Kraft aus. Die Wiedergabe bewahrt die ausdrückliche Vergleichskonstruktion und die Abfolge der hebräischen Verben.
- source_word: וַיְעַנֶּהָ
  choice: tat ihr Gewalt an
  rationale: ענה bezeichnet in diesem Zusammenhang eine gewaltsame Demütigung und sexuelle Verletzung. „Tat ihr Gewalt an“ ist im Deutschen ernst und eindeutig gewaltbezogen, ohne den Bedeutungsumfang des Verbs vorschnell auf einen einzelnen Fachbegriff zu verengen; der folgende Satzteil benennt den sexuellen Vollzug.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: schlief mit ihr
  rationale: שׁכב mit direktem Objekt ist eine feste hebräische Wendung für Geschlechtsverkehr. „Schlief mit ihr“ ist die entsprechende natürliche deutsche Wendung; durch den unmittelbar genannten Gewaltakt kann sie hier nicht als einvernehmliche Begegnung missverstanden werden.
theological_decisions:
- issue: Darstellung der sexuellen Gewalttat
  choice: Die erzwungene und schuldhafte Gewalt wird ausdrücklich benannt.
  alternative: Das Verb וַיְעַנֶּהָ lediglich mit „demütigte“ oder „erniedrigte“ wiederzugeben.
  rationale: Der Erzählzusammenhang und die Verbindung mit וַיִּשְׁכַּב machen deutlich, dass es um sexuelle Gewalt geht. Zugleich bleibt in der Fußnote die lexikalische Spannweite zwischen Demütigung, Entehrung und Verletzung sichtbar.
