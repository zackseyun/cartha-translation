  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze bewahren die unerbittliche Abfolge des hebräischen Berichts. Die Formulierung vermeidet sowohl beschönigende Sprache als auch unnötig klinische Terminologie.
