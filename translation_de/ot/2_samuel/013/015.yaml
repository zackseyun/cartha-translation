  source_fidelity: 'Der Entwurf gibt die hebräische Satzfolge und die zentralen Wiederholungen zuverlässig wieder: Amnons sehr großer Hass, dessen Übermaß gegenüber der vorausgegangenen Liebe sowie die zwei knappen femininen Imperative. Das Plusquamperfekt „geliebt hatte“ ist im deutschen Erzählzusammenhang eine angemessene Wiedergabe der vorausgehenden Liebe. Die Vergleichsrelation von מִן wird korrekt durch „größer als“ ausgedrückt.'
