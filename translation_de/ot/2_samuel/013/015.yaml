  text: וַ/יִּשְׂנָאֶ֣/הָ אַמְנ֗וֹן שִׂנְאָה֙ גְּדוֹלָ֣ה מְאֹ֔ד כִּ֣י גְדוֹלָ֗ה הַ/שִּׂנְאָה֙ אֲשֶׁ֣ר שְׂנֵאָ֔/הּ מֵ/אַהֲבָ֖ה אֲשֶׁ֣ר אֲהֵבָ֑/הּ וַֽ/יֹּאמֶר לָ֥/הּ אַמְנ֖וֹן ק֥וּמִי לֵֽכִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/015.yaml
  text: Then Amnon hated her with very great hatred[a], because the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, “Get up, go.”
translation:
  language: de
  text: 'Dann hasste Amnon sie mit überaus großem Hass, denn der Hass, mit dem er sie hasste, war größer als die Liebe, mit der er sie geliebt hatte. Amnon sagte zu ihr: »Steh auf, geh!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen im Hebräischen zwei knappe Befehle: »Steh auf, geh!« Sie unterstreichen Amnons schroffe Zurückweisung; sinngemäß ließe sich der zweite auch mit »verschwinde« wiedergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂנָאֶהָ
  choice: Dann hasste Amnon sie
  rationale: 'Das narrative וַ führt die Handlung fort; »Dann« gibt diese Abfolge natürlich wieder. Das feminine Objektsuffix bezeichnet Tamar: »sie«.'
- source_word: שִׂנְאָה גְּדוֹלָה מְאֹד
  choice: mit überaus großem Hass
  rationale: Die Wendung verstärkt das Verb durch eine Häufung von Ausdrücken für Größe und Intensität. Die Formulierung bewahrt diese auffällige Emphase des Hebräischen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier die erklärende Begründung der vorausgehenden Aussage ein; »denn« ist im Deutschen klar und stilistisch passend.
- source_word: גְדוֹלָה הַשִּׂנְאָה ... מֵאַהֲבָה
  choice: der Hass ... war größer als die Liebe
  rationale: Die Präposition מִן kennzeichnet einen Vergleich. »Größer als« gibt die Konstruktion eindeutig und idiomatisch wieder.
- source_word: אֲשֶׁר שְׂנֵאָהּ
  choice: mit dem er sie hasste
  rationale: Der Relativsatz bezieht sich auf »Hass« und wird in seiner wiederholenden, eindringlichen Form bewahrt.
- source_word: אֲשֶׁר אֲהֵבָהּ
  choice: mit der er sie geliebt hatte
  rationale: Das Plusquamperfekt macht deutlich, dass diese Liebe dem nun beschriebenen Hass vorausging, ohne die im Text verwendete Bezeichnung »Liebe« psychologisch umzudeuten.
- source_word: קוּמִי לֵכִי
  choice: Steh auf, geh!
  rationale: Die beiden femininen Singularimperative werden knapp und unmittelbar wiedergegeben. »Geh« vermeidet die interpretierende Verstärkung zu »verschwinde«, während die schroffe Wirkung erhalten bleibt.
theological_decisions:
- issue: Bezeichnung von Amnons vorausgegangener Haltung als »Liebe«
  choice: Liebe
  alternative: Begehren / Verlangen
  rationale: Der hebräische Text verwendet אַהֲבָה und stellt diese ausdrücklich dem Hass gegenüber. Trotz des gewaltsamen Kontexts wird diese spannungsvolle Wortwahl nicht psychologisch oder theologisch geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlich starke Wiederholung von »Hass/hasste« und »Liebe/geliebt« folgt bewusst der emphatischen hebräischen Formulierung. Die Schlussworte bleiben kurz und hart. Der Fußnotenmarker steht bei dem Ausdruck, den die Fußnote tatsächlich erläutert.
