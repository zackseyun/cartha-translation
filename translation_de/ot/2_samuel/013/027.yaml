  yaml_path: translation/ot/2_samuel/013/027.yaml
  text: But Absalom pressed him[a], so he sent Amnon and all the king’s sons with him.
translation:
  language: de
  text: Doch Abschalom drängte ihn[a]. Da schickte der König Amnon und alle Königssöhne mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Abschalom setzte ihm zu“ / „Abschalom bedrängte ihn so lange“. Die hebräische Wendung bezeichnet mehr als eine einfache Bitte und drückt beharrlichen Nachdruck aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרָץ בּוֹ
  choice: Doch Abschalom drängte ihn
  rationale: Die Verbindung von פרץ mit בְּ bei einer Person ist hier idiomatisch und bezeichnet nachdrückliches, anhaltendes Drängen, nicht ein wörtliches „Durchbrechen“. „Drängte ihn“ gibt diese Stärke in natürlichem modernem Deutsch wieder.
- source_word: אַבְשָׁלוֹם
  choice: Abschalom
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition wiedergegeben.
- source_word: וַיִּשְׁלַח
  choice: Da schickte er
  rationale: שלח bedeutet im Kontext, dass David dem Drängen nachgibt und Amnon sowie die übrigen Königssöhne zum Fest gehen lässt beziehungsweise hinschickt. „Schickte“ ist knapp und kontextgemäß.
- source_word: אִתּוֹ
  choice: mit ihm
  rationale: Die pronominale Form bedeutet wörtlich „mit ihm“; der Bezug auf Abschalom ergibt sich aus dem Zusammenhang. Die Beibehaltung des Pronomens wahrt die Form und die leichte Bezugsnähe des Hebräischen.
- source_word: אֶת אַמְנוֹן
  choice: Amnon
  rationale: Die Akkusativpartikel bleibt unübersetzt; der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: וְאֵת כָּל בְּנֵי הַמֶּלֶךְ
  choice: und alle Söhne des Königs
  rationale: Die Wendung bezeichnet sämtliche Königssöhne. Die formnahe Fassung ist im Deutschen natürlich und bewahrt den königlichen Familienbezug.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bildet den narrativen Übergang vom beharrlichen Drängen Abschaloms zu Davids Nachgeben ab; der Pronomenbezug des hebräischen Textes bleibt erhalten.
