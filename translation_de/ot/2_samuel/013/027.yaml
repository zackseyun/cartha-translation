review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von וַיִּפְרָץ בּוֹ mit „drängte ihn“ trifft die idiomatische, nachdrückliche Bedeutung im Kontext. „schickte“, „mit ihm“ und die Nennung Amnons sowie aller Königssöhne entsprechen dem hebräischen Satzgehalt. Allerdings bezeichnet das Subjekt von וַיִּשְׁלַח im Kontext David/den König, nicht Abschalom.
  naturalness: „Doch Abschalom drängte ihn“ ist modernes, angemessen würdiges Deutsch. Nach diesem Satz würde das bloße Pronomen „er“ jedoch regulär auf Abschalom zurückverweisen und damit für deutsche Leser den falschen Handelnden nahelegen. Die ausdrückliche Wiederaufnahme „der König“ beseitigt diese Fehlleitung natürlich und knapp.
  terminology: „Abschalom“ und „Amnon“ folgen dem im Deutschen geläufigen biblischen Namensgebrauch. „Königssöhne“ ist eine idiomatische und präzise Wiedergabe von „Söhne des Königs“. Die Fußnote gibt die lexikalische Spannweite wieder, ohne eine über das Hebräische hinausgehende Deutung festzulegen.
  issues:
  - severity: medium
    issue: Der Bezug von „Da schickte er“ ist im Deutschen irreführend.
    rationale: Der unmittelbar vorangehende männliche Singular ist „Abschalom“; daher wird „er“ gewöhnlich auf Abschalom bezogen. Im hebräischen Erzählzusammenhang ist mit dem Subjekt von וַיִּשְׁלַח jedoch David, der König, gemeint. Der Handelnde muss im Deutschen ausdrücklich benannt werden.
