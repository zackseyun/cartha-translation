base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/009.yaml
  text: Then she took the pan and poured them out before him[a], but he refused to eat. And Amnon said[b], “Send everyone out from me.” So everyone went out from him.
translation:
  language: de
  text: 'Dann nahm sie die Pfanne und schüttete das Gebäck vor ihm aus[a]. Doch er weigerte sich zu essen. Da sagte Amnon: »Schickt alle hinaus, weg von mir!« Und alle gingen von ihm weg.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »goss/schüttete vor ihm aus«. Ein direktes Objekt steht im Hebräischen nicht ausdrücklich; es wird aus dem Kontext als das zubereitete Gebäck ergänzt. Im Zusammenhang des Servierens kann die Wendung auch das Anrichten vor ihm bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂרֵת
  choice: die Pfanne
  rationale: Das Substantiv bezeichnet hier das Gefäß, in dem Tamar das Gebäck zubereitet beziehungsweise aus dem sie es anrichtet. »Pfanne« passt zum unmittelbaren Kochkontext und bleibt konkret.
- source_word: וַתִּצֹק לְפָנָיו
  choice: schüttete das Gebäck vor ihm aus
  rationale: יצק bezeichnet wörtlich ein Ausgießen oder Ausschütten. Bei dem zuvor genannten Gebäck ist »ausschütten« im Deutschen natürlich; »das Gebäck« ergänzt den aus dem Kontext erschließbaren Gegenstand.
- source_word: וַיְמָאֵן לֶאֱכוֹל
  choice: er weigerte sich zu essen
  rationale: מָאֵן drückt eine bewusste Weigerung aus, nicht lediglich fehlenden Appetit.
- source_word: הוֹצִיאוּ
  choice: Schickt ... hinaus
  rationale: Der Hifil-Imperativ von יצא bedeutet, jemanden hinausgehen zu lassen beziehungsweise hinauszuschicken.
- source_word: כָל אִישׁ
  choice: alle
  rationale: Wörtlich steht »jeder Mann«; in der Aufforderung bezeichnet die Wendung kollektiv sämtliche Anwesenden. »Alle« gibt diese Funktion im modernen Deutsch knapp wieder.
- source_word: מֵעָלַי / מֵעָלָיו
  choice: weg von mir / von ihm weg
  rationale: Die Präposition bedeutet in diesem Zusammenhang idiomatisch, dass die Anwesenden Amnons unmittelbare Nähe beziehungsweise Gegenwart verlassen sollen. Die Wiederholung des Ausdrucks im Befehl und im Bericht bleibt erkennbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Erzähldeutsch. Die konkrete Handlung des hebräischen Verbs יצק wird bewahrt, ohne die Wendung unnatürlich wörtlich wiederzugeben. Die direkte Rede ist knapp und bestimmt formuliert.
