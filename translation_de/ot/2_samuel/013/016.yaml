base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/016.yaml
  text: But she said to him[a], “No, because this great wrong of sending me away is greater than the other that you did to me.” But he would not listen to her.
translation:
  language: de
  text: 'Doch sie sagte zu ihm[a]: »Nein! Denn dieses große Unrecht, mich wegzuschicken, ist größer als das andere, das du mir angetan hast.« Aber er wollte nicht auf sie hören.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher könnte der Anfang lauten: »Tu das nicht! Denn dieses große Unrecht – mich wegzuschicken – ist größer als das andere, das du mir angetan hast.« Der hebräische Satz ist stark verkürzt und syntaktisch schwierig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Nein!
  rationale: אַל leitet gewöhnlich ein Verbot ein, steht hier jedoch in einer stark verkürzten, schwierigen Äußerung als dringender Einspruch. »Nein!« gibt diesen im Deutschen natürlich wieder; die formalere Möglichkeit wird in der Fußnote genannt.
- source_word: אוֹדֹת
  choice: Denn
  rationale: Das Wort führt hier den Grund beziehungsweise den Gegenstand ihres Einspruchs ein. »Denn« stellt den Zusammenhang in natürlichem Deutsch her, ohne die schwierige hebräische Syntax zu überdeuten.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: dieses große Unrecht
  rationale: רָעָה bezeichnet hier ein moralisches und persönliches Unrecht; גְּדוֹלָה und הַזֹּאת werden ausdrücklich mit »große« und »dieses« wiedergegeben.
- source_word: מֵאַחֶרֶת אֲשֶׁר עָשִׂיתָ עִמִּי
  choice: größer als das andere, das du mir angetan hast
  rationale: אַחֶרֶת verweist auf ein weiteres beziehungsweise vorausgegangenes Unrecht. »Angetan« ist für עָשָׂה עִם in diesem Zusammenhang idiomatischer und eindringlicher als ein bloßes »getan«.
- source_word: לְשַׁלְּחֵנִי
  choice: mich wegzuschicken
  rationale: Der Infinitiv benennt das nun beanstandete Handeln. Die deutsche Infinitivgruppe schließt sich klar als Erläuterung an »dieses große Unrecht« an.
- source_word: וְלֹא אָבָה לִשְׁמֹעַ לָהּ
  choice: Aber er wollte nicht auf sie hören
  rationale: אָבָה bezeichnet Bereitschaft beziehungsweise deren Verweigerung. »Wollte nicht auf sie hören« bewahrt den willentlichen Charakter und ist natürliches Deutsch.
- source_word: לּוֹ
  choice: zu ihm
  rationale: Die Präposition mit Suffix wird in der Redeeinleitung regulär als indirektes Objekt wiedergegeben.
