base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/025.yaml
  text: But the king said to Absalom, “No, my son, please let us not all go, lest we be a burden on you.” And he pressed him, but he was not willing to go; so he blessed him.
translation:
  language: de
  text: 'Doch der König sagte zu Absalom: »Nein, mein Sohn, bitte, lasst uns nicht alle hingehen, damit wir dir nicht zur Last fallen.« Da drängte Absalom ihn, doch der König wollte nicht hingehen und segnete ihn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל־נָא נֵלֵךְ כֻּלָּנוּ
  choice: Wir wollen bitte nicht alle mitgehen
  rationale: Gibt die höflich verstärkte Verneinung mit נָא sowie den Kohortativ natürlich und zugleich quellengetreu wieder.
- source_word: וְלֹא נִכְבַּד עָלֶיךָ
  choice: damit wir dir nicht zur Last fallen
  rationale: Das Verb כבד bezeichnet hier das Schwerwerden im übertragenen Sinn; die idiomatische deutsche Wendung bewahrt das Bild und den Sinn.
- source_word: וַיִּפְרָץ בּוֹ
  choice: Absalom drängte ihn zwar
  rationale: פרץ ב bezeichnet beharrliches, starkes Drängen. Der ausdrücklich genannte Name verdeutlicht den im Hebräischen aus dem Kontext erschließbaren Subjektwechsel.
- source_word: וַיְבָרֲכֵהוּ
  choice: und segnete ihn
  rationale: Bewahrt die gewöhnliche Bedeutung von ברך und lässt offen, ob ein förmlicher Segen oder gute Wünsche gemeint sind.
theological_decisions:
- issue: Bedeutung des abschließenden Segnens
  choice: segnete ihn
  alternative: wünschte ihm alles Gute
  rationale: Die formalere Wiedergabe bewahrt die religiöse und zugleich alltagssprachliche Bedeutungsbreite des hebräischen Verbs, ohne sie einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist natürlich formuliert; das etwas stärkere »drängte« bildet die Intensität von ויפרץ בו ab. Keine Fußnoten erforderlich.
