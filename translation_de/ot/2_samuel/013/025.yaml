revisions:
- from: 'Doch der König sagte zu Absalom: »Nein, mein Sohn! Wir wollen bitte nicht alle mitgehen, damit wir dir nicht zur Last fallen.« Absalom drängte ihn zwar, aber er wollte nicht mitgehen und segnete ihn.'
  to: 'Doch der König sagte zu Absalom: »Nein, mein Sohn, bitte, lasst uns nicht alle hingehen, damit wir dir nicht zur Last fallen.« Da drängte Absalom ihn, doch der König wollte nicht hingehen und segnete ihn.'
  rationale: Die Überarbeitung macht die im Ausgangstext eindeutigen Personenbezüge transparent und glättet die Wiedergabe des pluralischen Kohortativs. Sie verändert weder den Sinn noch die offen gehaltene Bedeutung des abschließenden Segnens.
