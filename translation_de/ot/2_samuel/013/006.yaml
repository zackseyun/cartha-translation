  text: וַ/יִּשְׁכַּ֥ב אַמְנ֖וֹן וַ/יִּתְחָ֑ל וַ/יָּבֹ֨א הַ/מֶּ֜לֶךְ לִ/רְאֹת֗/וֹ וַ/יֹּ֨אמֶר אַמְנ֤וֹן אֶל הַ/מֶּ֨לֶךְ֙ תָּֽבוֹא נָ֞א תָּמָ֣ר אֲחֹתִ֗/י וּ/תְלַבֵּ֤ב לְ/עֵינַ/י֙ שְׁתֵּ֣י לְבִב֔וֹת וְ/אֶבְרֶ֖ה מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/006.yaml
  text: So Amnon lay down and pretended to be sick. When the king came to see him[a], Amnon said to the king, “Please let Tamar my sister come and make two cakes before my eyes, so that I may eat from her hand.”
translation:
  language: de
  text: 'Da legte sich Amnon hin und gab vor, krank zu sein. Als der König kam, um nach ihm zu sehen, sagte Amnon zum König: »Bitte lass meine Schwester Tamar kommen und vor meinen Augen zwei Kuchen[a] zubereiten, damit ich aus ihrer Hand esse.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zwei Fladen« oder »zwei Gebäckstücke«; welche Speise das hebräische Wort genau bezeichnet, ist ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich ... hin
  rationale: Beschreibt, wie Amnon sich im Rahmen seiner Täuschung niederlegt; die deutsche Wendung ist natürlich und bleibt nah am hebräischen Ausdruck.
- source_word: וַיִּתְחָל
  choice: stellte sich krank
  rationale: Die Hitpael-Form bezeichnet hier im Kontext das Vortäuschen einer Krankheit.
- source_word: לִרְאֹתוֹ
  choice: um nach ihm zu sehen
  rationale: Gibt das hebräische »ihn sehen« idiomatisch wieder und lässt den Besuchscharakter erkennen.
- source_word: תָּבוֹא נָא
  choice: Bitte lass ... kommen
  rationale: Gibt die höfliche Bitte mit נָא in natürlichem Deutsch wieder.
- source_word: תָּמָר אֲחֹתִי
  choice: meine Schwester Tamar
  rationale: Natürliche deutsche Wortstellung für die hebräische Apposition.
- source_word: וּתְלַבֵּב
  choice: zubereiten
  rationale: Das seltene, von לבב abgeleitete Verb bezeichnet die Herstellung der anschließend genannten Speise; »zubereiten« vermeidet eine unbelegte Festlegung auf eine bestimmte Kochtechnik.
- source_word: לְעֵינַי
  choice: vor meinen Augen
  rationale: Bewahrt die konkrete visuelle Formulierung und betont, dass Tamar die Speise in Amnons Gegenwart herstellen soll.
- source_word: שְׁתֵּי לְבִבוֹת
  choice: zwei Kuchen
  rationale: לְבִבוֹת bezeichnet eine nicht genau bestimmbare Art zubereiteter Back- oder Mehlspeise. »Kuchen« ist verständlich; die Unsicherheit wird in der Fußnote offengelegt. Eine Herzform wird vom Vers nicht ausdrücklich angegeben.
- source_word: וְאֶבְרֶה
  choice: damit ich ... esse
  rationale: Gibt den Zweck der Bitte und die Bedeutung des Essens beziehungsweise der Stärkung schlicht wieder.
- source_word: מִיָּדָהּ
  choice: aus ihrer Hand
  rationale: Entspricht dem hebräischen Singular und bewahrt die persönliche Bedienung, die Amnon verlangt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählweise. Die wörtlich-bildhafte Wendung »vor meinen Augen« und die persönliche Formulierung »aus ihrer Hand« bleiben erhalten; die unbekannte Speise wird nicht spekulativ als herzförmig bestimmt.
