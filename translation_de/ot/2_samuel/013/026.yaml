  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם וָ/לֹ֕א יֵֽלֶךְ נָ֥א אִתָּ֖/נוּ אַמְנ֣וֹן אָחִ֑/י וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֥/מָּה יֵלֵ֖ךְ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/026.yaml
  text: Then Absalom said[a], “If not, please let my brother Amnon go with us.” But the king said to him, “Why should he go with you?”
translation:
  language: de
  text: 'Da sagte Abschalom[a]: „Wenn nicht, dann lass doch meinen Bruder Amnon mit uns gehen.“ Doch der König sagte zu ihm: „Warum sollte er mit dir gehen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ausführlicher: „Wenn du nicht mitkommst, dann lass doch meinen Bruder Amnon mit uns gehen.“ Das Hebräische ist elliptisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte / Doch ... sagte
  rationale: Das Narrativ-Waw führt die Handlung fort. „Da“ ist im ersten Satz natürlich; „Doch“ gibt beim zweiten die ablehnende Reaktion des Königs wieder, ohne den Sinn zu überzeichnen.
- source_word: וָלֹא
  choice: Wenn nicht
  rationale: Die knappe, elliptische Wendung nimmt die vorherige Ablehnung des Königs auf. Die Ergänzung des Gemeinten bleibt der Fußnote vorbehalten.
- source_word: נָא
  choice: doch
  rationale: Die Modalpartikel kennzeichnet eine höfliche, eindringliche Bitte. Deutsches „doch“ wirkt hier natürlicher als ein ausdrücklich gesetztes „bitte“.
- source_word: יֵלֶךְ
  choice: lass ... gehen / sollte er gehen
  rationale: Der Jussiv in Abschaloms Bitte wird mit „lass ... gehen“ wiedergegeben; in der rhetorischen Frage des Königs entspricht „sollte er gehen“ dem Imperfekt idiomatisch.
- source_word: אִתָּנוּ
  choice: mit uns
  rationale: Direkte Wiedergabe der komitativen Präposition mit dem Suffix der ersten Person Plural.
- source_word: אַמְנוֹן אָחִי
  choice: meinen Bruder Amnon
  rationale: Diese Wortstellung ist im modernen Deutschen natürlich und bewahrt die ausdrücklich genannte familiäre Beziehung.
- source_word: לָמָה
  choice: Warum
  rationale: Die einfache Frage nach dem Grund wird direkt und natürlich wiedergegeben.
- source_word: עִמָּךְ
  choice: mit dir
  rationale: Das maskuline Singularsuffix bezieht sich auf Abschalom; „dir“ ist die entsprechende deutsche Form.
