base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/031.yaml
  text: Then the king arose[a], tore his garments, and lay on the ground, and all his servants were standing with their garments torn.
translation:
  language: de
  text: Da stand der König auf, zerriss seine Gewänder[a] und legte sich auf den Boden. Und alle seine Diener standen mit zerrissenen Gewändern da.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Zerreißen der eigenen Gewänder war in der hebräischen Bibel ein gebräuchlicher Ausdruck von Trauer, Entsetzen oder Klage.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: stand ... auf
  rationale: Das Qal-Wayyiqtol von קום führt die Erzählung fort und bezeichnet hier die abrupte Reaktion des Königs; „aufstehen“ ist im modernen Deutsch natürlich.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Titel verweist im Zusammenhang auf David; da der hebräische Text den Titel und nicht den Namen verwendet, bleibt „der König“ erhalten.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: zerriss seine Gewänder
  rationale: קרע mit בגד bezeichnet das Zerreißen der Kleidung als Ausdruck von Trauer oder Entsetzen. „Gewänder“ wahrt den würdevollen Erzählton, ohne altertümlich zu wirken.
- source_word: וַיִּשְׁכַּב אָרְצָה
  choice: legte sich auf den Boden
  rationale: שכב bezeichnet das Sich-Hinlegen beziehungsweise Liegen; die Richtungsendung in אָרְצָה legt eine Bewegung zum Boden hin nahe. „legte sich auf den Boden“ gibt dies idiomatisch wieder.
- source_word: וְכָל עֲבָדָיו
  choice: Auch alle seine Diener
  rationale: עבדים kann Diener, Bedienstete oder königliche Gefolgsleute bezeichnen. „Diener“ ist direkt und vermeidet eine nicht ausdrücklich genannte Amtsstellung; „auch“ stellt den Anschluss an die Reaktion des Königs natürlich her.
- source_word: נִצָּבִים
  choice: standen ... da
  rationale: Das Nifal-Partizip von נצב schildert einen andauernden Zustand. Die deutsche Wendung „standen ... da“ bildet die szenische, durative Aussage natürlich ab.
- source_word: קְרֻעֵי בְגָדִים
  choice: mit zerrissenen Gewändern
  rationale: Die passive Konstruktion beschreibt den resultierenden Zustand ihrer Kleidung. „mit zerrissenen Gewändern“ bewahrt diesen Sinn knapp und idiomatisch.
