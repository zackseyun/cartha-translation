source:
  edition: WLC
  text: וְ/אַבְשָׁל֣וֹם בָּרַ֔ח וַ/יֵּ֛לֶךְ אֶל תַּלְמַ֥י בֶּן עמיחור מֶ֣לֶךְ גְּשׁ֑וּר וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/037.yaml
  text: But Absalom fled and went to Talmai son of Ammihur[a], king of Geshur. And he mourned for his son all the days.
translation:
  language: de
  text: Absalom aber floh und ging zu Talmai, dem Sohn Ammihurs, dem König von Geschur. Und er[a] trauerte um seinen Sohn alle Tage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wer mit „er“ gemeint ist, wird im Hebräischen nicht ausdrücklich gesagt; aus dem Zusammenhang ist David als der Trauernde zu verstehen.
    reason: Mehrdeutiger Pronomenbezug im hebräischen Text.
lexical_decisions:
- source_word: וְאַבְשָׁלוֹם
  choice: Absalom aber
  rationale: Die Konjunktion וְ kann mit „und“ wiedergegeben werden; hier bringt die Nachstellung von „aber“ den erzählerischen Gegensatz zwischen Absaloms Flucht und dem vorangehenden Geschehen natürlich zum Ausdruck.
- source_word: בָּרַח
  choice: floh
  rationale: Das Verb bezeichnet eindeutig die Flucht und wird im Deutschen knapp und erzählerisch angemessen mit „floh“ wiedergegeben.
- source_word: וַיֵּלֶךְ אֶל
  choice: und ging zu
  rationale: Die gewöhnliche hebräische Erzählform mit אֶל bezeichnet die Bewegung zu einer Person hin; „ging zu“ ist im Deutschen direkt und natürlich.
- source_word: תַּלְמַי
  choice: Talmai
  rationale: Der Personenname wird nach üblicher deutscher Form transliteriert.
- source_word: בֶּן עמיחור
  choice: dem Sohn Ammihurs
  rationale: Die Patronymform wird idiomatisch als Apposition wiedergegeben; der Name wird in der geläufigen deutschen Form „Ammihur“ geschrieben.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: dem König von Geschur
  rationale: Die Status-constructus-Verbindung bezeichnet Talmai als König von Geschur. Die parallele Apposition ist im Deutschen klar und würdevoll.
- source_word: וַיִּתְאַבֵּל
  choice: Und er trauerte
  rationale: Der Hitpael von אבל bezeichnet Trauern, besonders im Zusammenhang mit einem Todesfall. Das hebräische Subjekt ist nur durch die maskuline Singularform angezeigt und wird daher nicht ausdrücklich als David benannt.
- source_word: עַל בְּנוֹ
  choice: um seinen Sohn
  rationale: Bei „trauern“ wird עַל im Deutschen idiomatisch mit „um“ wiedergegeben. Der Singular „seinen Sohn“ folgt dem Hebräischen; im Zusammenhang ist Amnon gemeint.
- source_word: כָּל הַיָּמִים
  choice: die ganze Zeit
  rationale: Die Wendung bedeutet wörtlich „alle die Tage“ und bezeichnet hier anhaltendes Trauern. „Die ganze Zeit“ bewahrt den zeitlichen Umfang in natürlichem modernem Deutsch, ohne daraus „sein ganzes Leben“ zu machen.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von וַיִּתְאַבֵּל
  choice: Das Pronomen „er“ bleibt im Haupttext stehen; eine Fußnote nennt David als die aus dem Zusammenhang naheliegende Bezugsperson.
  alternative: „Und David trauerte“
  rationale: Das Hebräische nennt den Namen nicht ausdrücklich. Die Wiedergabe bewahrt diese grammatische Offenheit, ohne die kontextuell wahrscheinliche Deutung zu verschweigen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdevoller Erzählweise. Die Namensformen „Absalom“, „Talmai“, „Ammihur“ und „Geschur“ folgen gängigen deutschen Bibelkonventionen. Die syntaktische Mehrdeutigkeit beim Trauernden bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
