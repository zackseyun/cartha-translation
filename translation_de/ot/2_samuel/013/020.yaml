base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/020.yaml
  text: Then Absalom her brother said to her[a], “Has Amnon your brother been with you? But now, my sister, keep silent; he is your brother. Do not take this matter to heart.” So Tamar remained, devastated[b], in the house of Absalom her brother.
translation:
  language: de
  text: 'Da sagte ihr Bruder Absalom zu ihr: »War dein Bruder Amnon bei dir?[a] Nun aber, meine Schwester, schweige; er ist dein Bruder. Nimm dir diese Sache nicht zu Herzen.« So blieb Tamar zerstört und einsam[b] im Haus ihres Bruders Absalom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »War dein Bruder Amnon bei dir?« Die zurückhaltende Wendung bezieht sich hier auf den sexuellen Übergriff.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »verwüstet« oder »verödet«. Das hebräische Wort bezeichnet einen zerstörten, trostlosen und verlassenen Zustand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיָה עִמָּךְ
  choice: war ... bei dir
  rationale: Die zurückhaltende hebräische Wendung wird ebenso indirekt wiedergegeben; im Zusammenhang bezeichnet sie den sexuellen Übergriff, ohne ihn hier ausdrücklich zu benennen.
- source_word: הַחֲרִישִׁי
  choice: schweige
  rationale: Der Imperativ gibt Absaloms knappe Aufforderung zum Schweigen unmittelbar und würdevoll wieder.
- source_word: אַל תָּשִׁיתִי אֶת־לִבֵּךְ לַדָּבָר הַזֶּה
  choice: Nimm dir diese Sache nicht zu Herzen
  rationale: Die geläufige deutsche Wendung entspricht dem hebräischen Bild, das Herz nicht auf diese Sache zu richten.
- source_word: וַתֵּשֶׁב
  choice: blieb
  rationale: Im Zusammenhang bezeichnet das Verb Tamars fortdauernden Aufenthalt und Zustand im Haus Absaloms.
- source_word: שֹׁמֵמָה
  choice: verstört
  rationale: Das Wort beschreibt einen Zustand erschütterter, trostloser Verwüstung. »Verstört« klingt im modernen Deutsch natürlich; eine Fußnote bewahrt die stärkere mögliche Nuance »verwüstet/verödet«.
- source_word: בֵּית אַבְשָׁלוֹם אָחִיהָ
  choice: im Haus ihres Bruders Absalom
  rationale: Die konkrete häusliche und familiäre Ortsangabe des Hebräischen bleibt erhalten.
theological_decisions:
- issue: Euphemistische Bezeichnung des sexuellen Übergriffs
  choice: Die indirekte Formulierung »War dein Bruder Amnon bei dir?« bleibt im Haupttext erhalten.
  alternative: »Hat dein Bruder Amnon dir Gewalt angetan?«
  rationale: Der hebräische Erzähler lässt Absalom zurückhaltend und indirekt sprechen. Eine ausdrückliche Benennung würde die Bedeutung im Kontext erklären, aber die sprachliche Zurückhaltung des Ausgangstextes aufheben.
- issue: Absaloms Hinweis auf das Geschwisterverhältnis
  choice: »er ist dein Bruder« wird ohne erklärende Abschwächung oder Rechtfertigung wiedergegeben.
  alternative: »er ist schließlich dein Bruder«
  rationale: Der Text lässt die verstörende Spannung dieser Begründung unkommentiert stehen. »Schließlich« würde eine zusätzliche argumentative Färbung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe und bedrückende Erzählweise sowie Absaloms direkte Rede bleiben erhalten. Die Euphemisierung des Hebräischen wird nicht stillschweigend aufgelöst; die Fußnote erläutert sie.
