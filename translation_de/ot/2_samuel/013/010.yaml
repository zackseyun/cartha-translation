base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/010.yaml
  text: Then Amnon said to Tamar[a], “Bring the food into the inner room, so that I may eat from your hand.” So Tamar took the cakes she had made and brought them into the inner room to Amnon her brother.
translation:
  language: de
  text: 'Da sagte Amnon zu Tamar: „Bring das Essen ins innere Zimmer[a], damit ich aus deiner Hand esse.“ Da nahm Tamar die Kuchen, die sie gemacht hatte, und brachte sie zu ihrem Bruder Amnon ins innere Zimmer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „ins Gemach“ oder einfach „ins Zimmer“. Das hebräische Wort חֶדֶר bezeichnet einen innen gelegenen Raum; „inneres Zimmer“ unterstreicht hier den abgeschiedenen Schauplatz.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאִי
  choice: Bring
  rationale: Der feminine Singularimperativ im Hifil von בוא fordert Tamar auf, das Essen an den bezeichneten Ort zu bringen.
- source_word: הַבִּרְיָה
  choice: das Essen
  rationale: Das Substantiv bezeichnet zubereitete Nahrung; „Essen“ ist im Deutschen natürlich und legt die Speise nicht genauer fest, als es der hebräische Text tut.
- source_word: הַחֶדֶר / הֶחָדְרָה
  choice: ins innere Zimmer
  rationale: חֶדֶר bezeichnet einen Innenraum oder ein Gemach; „inneres Zimmer“ bewahrt den Hinweis auf den abgeschiedenen Raum. Beim zweiten Vorkommen gibt die Richtungsendung die Bewegung hinein an.
- source_word: וְאֶבְרֶה
  choice: damit ich … esse
  rationale: ברה bezeichnet hier das Essen beziehungsweise die Nahrungsaufnahme. Die deutsche Finalkonstruktion gibt die Kohortativnuance im Anschluss an den Befehl natürlich wieder.
- source_word: מִיָּדֵךְ
  choice: aus deiner Hand
  rationale: Die wörtliche deutsche Wendung bewahrt die auffällige, manipulative Intimität von Amnons Bitte und entspricht dem Singular des Hebräischen.
- source_word: הַלְּבִבוֹת
  choice: die Kuchen
  rationale: Das Wort bezeichnet die zuvor von Tamar zubereiteten besonderen Gebäckstücke; „Kuchen“ ist verständlich, ohne ihre genaue Form oder Zubereitung zu behaupten.
- source_word: אָחִיהָ
  choice: ihrem Bruder
  rationale: Die ausdrückliche Verwandtschaftsbezeichnung wird bewahrt, weil sie für die narrative und moralische Spannung wesentlich ist.
theological_decisions: []
