  naturalness: Der Satz »Das hatte bei Absalom bereits festgestanden« ist im modernen Standarddeutsch unnatürlich. Eine Umstellung mit »nach Absaloms Entschluss« ist klarer und wahrt die vom Hebräischen zugelassene Nuance.
  terminology: Die Namensformen Jonadab, Schima, David, Amnon, Absalom und Tamar sind angemessen. »vergewaltigt« ist im Kontext eine sachgerechte, nicht beschönigende Wiedergabe von ענה im Piël. Die explizite Zuordnung »Absaloms Schwester« macht den Bezug des hebräischen Possessivsuffixes klar.
