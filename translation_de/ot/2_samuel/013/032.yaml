  text: וַ/יַּ֡עַן יוֹנָדָ֣ב בֶּן שִׁמְעָ֨ה אֲחִֽי דָוִ֜ד וַ/יֹּ֗אמֶר אַל יֹאמַ֤ר אֲדֹנִ/י֙ אֵ֣ת כָּל הַ/נְּעָרִ֤ים בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הֵמִ֔יתוּ כִּֽי אַמְנ֥וֹן לְ/בַדּ֖/וֹ מֵ֑ת כִּֽי עַל פִּ֤י אַבְשָׁלוֹם֙ הָיְתָ֣ה שׂוּמָ֔ה מִ/יּוֹם֙ עַנֹּת֔/וֹ אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/032.yaml
  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
translation:
  language: de
  text: 'Da antwortete Jonadab, der Sohn Schimas, des Bruders Davids, und sagte: »Mein Herr soll nicht sagen: ›Sie haben alle jungen Männer, die Söhne des Königs, getötet!‹ Denn nur Amnon ist tot. Denn seit dem Tag, an dem Amnon Tamar, Absaloms Schwester, vergewaltigt hatte, stand dies nach Absaloms Entschluss fest[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »auf Absaloms Mund/Wort hin war dies festgesetzt«. Die Wendung kann sich auf Absaloms Anordnung oder auf seinen feststehenden Entschluss beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Da antwortete ... und sagte
  rationale: Die beiden hebräischen Erzählverben werden bewahrt; die leicht formelhafte Wendung entspricht dem würdevollen Erzählstil.
- source_word: שִׁמְעָה אֲחִי דָוִד
  choice: Schima, der Bruder Davids
  rationale: Die verwandtschaftliche Zuordnung bezieht sich auf Schima; die deutsche Apposition macht dies eindeutig.
- source_word: אַל יֹאמַר אֲדֹנִי
  choice: Mein Herr soll nicht sagen
  rationale: Gibt den mit אַל gebildeten verneinten Jussiv und den ehrerbietigen höfischen Ton in natürlichem Deutsch wieder.
- source_word: הַנְּעָרִים בְּנֵי הַמֶּלֶךְ
  choice: alle jungen Männer, die Söhne des Königs
  rationale: נְעָרִים bezeichnet hier die anwesenden jungen Königssöhne; die Apposition bleibt erhalten.
- source_word: אַמְנוֹן לְבַדּוֹ מֵת
  choice: nur Amnon ist tot
  rationale: לְבַדּוֹ hebt die Ausschließlichkeit hervor; die knappe deutsche Formulierung gibt sie direkt wieder.
- source_word: עַל פִּי אַבְשָׁלוֹם הָיְתָה שׂוּמָה
  choice: Das hatte bei Absalom bereits festgestanden
  rationale: Die Formulierung vermittelt einen bei Absalom feststehenden Entschluss, ohne das idiomatische עַל־פִּי vorschnell ausschließlich als ausdrücklichen Befehl zu deuten.
- source_word: מִיּוֹם עַנֹּתוֹ
  choice: seit dem Tag, an dem Amnon ... vergewaltigt hatte
  rationale: ענה im Pi’el bezeichnet hier im Erzählzusammenhang die sexuelle Gewalttat. Der Name Amnon wird zur eindeutigen deutschen Bezugnahme wiederholt.
- source_word: תָּמָר אֲחֹתוֹ
  choice: seine Schwester Tamar
  rationale: Das Possessivsuffix bezeichnet Tamar als Schwester Absaloms; da sie zugleich Amnons Halbschwester ist, bleibt die natürliche deutsche Formulierung sachlich zutreffend.
theological_decisions:
- issue: Grad der Festlegung in Absaloms Entschluss
  choice: Das hatte bei Absalom bereits festgestanden
  alternative: Das war auf Absaloms Befehl hin festgesetzt worden
  rationale: Der hebräische Ausdruck kann Wort, Anordnung oder feststehenden Willen bezeichnen. Der Haupttext wahrt diese Spannweite; die mögliche Befehlsnuance wird in der Fußnote genannt.
- issue: Bezeichnung der Gewalttat an Tamar
  choice: vergewaltigt
  alternative: erniedrigt / geschändet
  rationale: Der unmittelbare Erzählzusammenhang bezeichnet sexuelle Gewalt. Die klare moderne Benennung vermeidet eine beschönigende Wiedergabe, während die breitere lexikalische Bedeutung in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, leicht formellem Erzählton. Die direkte Rede ist klar gegliedert. Traditionell geläufige deutsche Namensformen werden verwendet; beschönigende oder konfessionell geprägte Zusätze werden vermieden.
