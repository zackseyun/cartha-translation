base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/001.yaml
  text: After this[a], Absalom son of David had a beautiful sister whose name was Tamar, and Amnon son of David loved her.
translation:
  language: de
  text: Danach hatte Absalom, der Sohn Davids, eine schöne Schwester namens Tamar, und Amnon, der Sohn Davids, liebte sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „begehrte sie“ oder „war in sie vernarrt“. Im Hebräischen steht das gewöhnliche Verb für „lieben“; der weitere Verlauf zeigt jedoch, dass Amnons Zuneigung verdorben war.'
    reason: Lexikalische Alternativen werden kenntlich gemacht, während die Hauptübersetzung das unmarkierte hebräische Verb beibehält und die erzählerische Spannung wahrt.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Danach
  rationale: Die Erzählungsformel mit der Zeitangabe leitet eine nachfolgende Begebenheit ein. „Danach“ gibt den zeitlichen Anschluss im modernen Deutsch natürlich und knapp wieder.
- source_word: וּלְאַבְשָׁלוֹם בֶּן דָּוִד
  choice: hatte Abschalom, der Sohn Davids
  rationale: Die hebräische Besitzkonstruktion wird idiomatisch mit „hatte“ wiedergegeben. Die Bezeichnung „Sohn Davids“ bleibt erhalten, weil sie im Vers bei beiden Männern ausdrücklich erscheint.
- source_word: אָחוֹת יָפָה
  choice: eine schöne Schwester
  rationale: „Schön“ gibt יָפָה direkt wieder; im Zusammenhang bezeichnet es die körperliche Schönheit Tamars.
- source_word: וּשְׁמָהּ תָּמָר
  choice: namens Tamar
  rationale: Die knappe deutsche Namensformel gibt den Inhalt der hebräischen Aussage natürlich wieder.
- source_word: וַיֶּאֱהָבֶהָ
  choice: liebte sie
  rationale: Das Verb אהב ist das gewöhnliche Wort für „lieben“. Die direkte Wiedergabe bewahrt die Spannung zur später offenbarten Verderbtheit von Amnons Begehren.
- source_word: אַמְנוֹן בֶּן דָּוִד
  choice: Amnon, der Sohn Davids
  rationale: Die wiederholte Abstammungsangabe wird bewahrt und macht die Beziehungen innerhalb der Familie Davids ausdrücklich sichtbar.
theological_decisions:
- issue: Wiedergabe von אהב in einer moralisch belasteten Erzählung
  choice: liebte sie
  alternative: begehrte sie / war in sie vernarrt
  rationale: Der weitere Verlauf zeigt, dass Amnons sogenannte Liebe verdorben und gewalttätig war. Der Vers selbst verwendet jedoch unkommentiert das gewöhnliche Verb für „lieben“; die Hauptübersetzung bewahrt daher die literarische und theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die beiden parallelen Bezeichnungen „der Sohn Davids“ wurden trotz leichter stilistischer Wiederholung beibehalten, um die Familien- und Dynastiebezüge des hebräischen Textes sichtbar zu machen.
