source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח דָּוִ֛ד אֶל תָּמָ֖ר הַ/בַּ֣יְתָ/ה לֵ/אמֹ֑ר לְכִ֣י נָ֗א בֵּ֚ית אַמְנ֣וֹן אָחִ֔י/ךְ וַ/עֲשִׂי ל֖/וֹ הַ/בִּרְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/007.yaml
  text: Then David sent word to Tamar at home[a], saying, “Please go to the house of your brother Amnon and prepare the food for him.”
translation:
  language: de
  text: 'Da schickte David zu Tamar ins Haus und ließ ihr sagen: »Geh bitte in das Haus deines Bruders Amnon und bereite ihm die stärkende Speise zu.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »etwas zu essen« oder »eine Mahlzeit«. Das hebräische Wort bezeichnet hier wahrscheinlich eine Speise für einen Kranken oder Genesenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: schickte … und ließ ihr sagen
  rationale: Das Verb bedeutet „senden/schicken“. Zusammen mit אֶל und לֵאמֹר bezeichnet es hier idiomatisch das Übermitteln einer Botschaft; die deutsche Formulierung macht dies deutlich, ohne einen ausdrücklich genannten Boten einzuführen.
- source_word: הַבַּיְתָה
  choice: ins Haus
  rationale: Die Richtungsendung bezeichnet eine Bewegung zum Haus hin. „Ins Haus“ bewahrt diese räumliche Nuance; wessen Haus gemeint ist, lässt der hebräische Text an dieser Stelle offen.
- source_word: לְכִי נָא
  choice: Geh bitte
  rationale: Der feminine Singularimperativ wird durch נָא höflich abgemildert. „Geh bitte“ gibt sowohl die Aufforderung als auch ihren höflichen Ton natürlich wieder.
- source_word: בֵּית אַמְנוֹן אָחִיךְ
  choice: das Haus deines Bruders Amnon
  rationale: Die Wiedergabe bildet die hebräische Genitivverbindung klar ab und bewahrt sowohl den Namen als auch die ausdrücklich genannte Verwandtschaftsbeziehung.
- source_word: וַעֲשִׂי לוֹ הַבִּרְיָה
  choice: bereite ihm eine stärkende Speise zu
  rationale: עשה bedeutet allgemein „machen“, erhält hier aber durch das Speiseobjekt den natürlichen Sinn „zubereiten“. בִּרְיָה bezeichnet in diesem Zusammenhang Nahrung für einen Kranken oder Genesenden; „stärkende Speise“ bewahrt diese besondere Bedeutung, ohne die im weiteren Erzählverlauf genannte konkrete Zubereitungsform vorwegzunehmen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die höfliche Nuance von נָא und die besondere Bedeutung der Krankenspeise werden bewahrt; die räumliche Angabe הַבַּיְתָה wird nicht auf ein bestimmtes, im Text ungenanntes Haus festgelegt.
