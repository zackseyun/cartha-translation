base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/008.yaml
  text: So Tamar went to the house of her brother Amnon[a], while he was lying down. She took the dough, kneaded it, shaped it into cakes in his sight[b], and cooked the cakes.
translation:
  language: de
  text: Da ging Tamar in das Haus ihres Bruders Amnon, und er lag da. Sie nahm den Teig, knetete ihn, formte vor seinen Augen Kuchen daraus[a] und kochte die Kuchen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „formte herzförmige Kuchen“. Das hebräische Verb und das zugehörige Substantiv sind selten und könnten auf eine Form anspielen, die mit dem Wort für „Herz“ zusammenhängt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „kochte die Kuchen in Flüssigkeit“. Das hebräische Verb kann besonders das Kochen in Flüssigkeit bezeichnen, hier aber auch allgemeiner für die Zubereitung stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: Da ging
  rationale: Das Narrativ-Präteritum führt die Handlung fort; „Da ging“ gibt die zeitliche und folgerichtige Verbindung im Deutschen natürlich wieder.
- source_word: בֵּית אַמְנוֹן אָחִיהָ
  choice: in das Haus ihres Bruders Amnon
  rationale: Die Bewegungsrichtung wird im Deutschen idiomatisch mit „in das Haus“ ausgedrückt; das Verwandtschaftsverhältnis bleibt ausdrücklich erhalten.
- source_word: וְהוּא שֹׁכֵב
  choice: der dalag
  rationale: Die Umstandsangabe beschreibt Amnons Lage, ohne deutend „im Bett“ oder „krank“ hinzuzufügen.
- source_word: הַבָּצֵק
  choice: den Teig
  rationale: Dies ist die gewöhnliche und kontextuell eindeutige Bezeichnung für den zu verarbeitenden Teig.
- source_word: ו/תלוש
  choice: knetete ihn
  rationale: לוש bezeichnet im Zusammenhang mit Teig dessen Kneten.
- source_word: וַתְּלַבֵּב
  choice: formte ... Kuchen daraus
  rationale: Das seltene Verb ist mit dem folgenden seltenen Speisenamen verwandt und bezeichnet offenbar das Formen oder Herstellen dieser Kuchen; die mögliche Herzform wird wegen ihrer Unsicherheit nicht in den Haupttext aufgenommen.
- source_word: לְעֵינָיו
  choice: vor seinen Augen
  rationale: Die Wendung bewahrt anschaulich, dass die Zubereitung für Amnon sichtbar geschah.
- source_word: וַתְּבַשֵּׁל
  choice: kochte
  rationale: בשל kann allgemein das Garen oder Kochen und insbesondere das Sieden bezeichnen; „kochte“ wahrt im Haupttext die methodische Unbestimmtheit.
- source_word: הַלְּבִבוֹת
  choice: die Kuchen
  rationale: Das seltene Substantiv bezeichnet die hergestellte Speise. „Kuchen“ ist verständlich, ohne die unsichere etymologische Deutung als herzförmiges Gebäck festzuschreiben.
