base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/021.yaml
  text: When King David heard all these things[a], he was very angry.
translation:
  language: de
  text: Als König David all das hörte, wurde er sehr zornig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Es entbrannte ihm sehr“, das heißt: Sein Zorn entbrannte heftig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: Als König David
  rationale: Das וְ führt die nächste Handlung in der Erzählfolge ein. Im Deutschen gibt „als“ den zeitlichen Zusammenhang natürlich wieder; הַמֶּלֶךְ דָּוִד bezeichnet „König David“.
- source_word: שָׁמַע
  choice: hörte
  rationale: Die Grundbedeutung ist „hören“; mit „von“ bezeichnet die Formulierung hier idiomatisch, dass David von den Vorgängen erfuhr.
- source_word: אֵת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine eigenständige Entsprechung.
- source_word: כָּל הַ/דְּבָרִים הָ/אֵלֶּה
  choice: all diesen Dingen
  rationale: דְּבָרִים kann „Worte“, „Angelegenheiten“ oder „Dinge“ bedeuten. Hier umfasst es die zuvor berichteten Vorgänge; „Dinge“ bewahrt diese semantische Breite.
- source_word: וַ/יִּחַר ל/וֹ מְאֹד
  choice: wurde er sehr zornig
  rationale: Die hebräische Wendung beschreibt wörtlich ein starkes Brennen bei ihm und bezeichnet idiomatisch heftigen Zorn. „Wurde er sehr zornig“ ist im modernen Deutsch klar und bildet zugleich den Eintritt der Reaktion ab.
