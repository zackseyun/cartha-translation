base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/036.yaml
  text: And as soon as he finished speaking[a], behold, the king’s sons came, and they raised their voices and wept. The king also, and all his servants, wept with very great weeping.
translation:
  language: de
  text: Als er gerade ausgeredet hatte, da kamen die Söhne des Königs. Sie erhoben ihre Stimme und weinten laut. Auch der König und alle seine Diener weinten überaus heftig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „weinten ein sehr großes Weinen“; die hebräische Verstärkungsform hebt die außerordentliche Intensität ihres Weinens hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: Als er ausgeredet hatte
  rationale: Die hebräische Erzählungsformel mit Temporalsatz wird natürlich wiedergegeben; der Abschluss des Redens und die unmittelbar folgende Ankunft bleiben deutlich.
- source_word: וְהִנֵּה
  choice: siehe, da
  rationale: Bewahrt den aufmerksamkeitslenkenden und vergegenwärtigenden Charakter des hebräischen Diskursmarkers, ohne ihn bloß temporal als „plötzlich“ festzulegen.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: die Söhne des Königs
  rationale: Direkte und im Deutschen natürliche Wiedergabe der Status- und Verwandtschaftsbezeichnung.
- source_word: בָּאוּ
  choice: kamen
  rationale: Entspricht dem einfachen hebräischen Bewegungsverb und passt zum erzählerischen Blickpunkt.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: Sie erhoben ihre Stimmen
  rationale: Bewahrt das Bild der hebräischen Wendung für lautes Klagen und ist in gehobenem modernem Deutsch verständlich.
- source_word: וַיִּבְכּוּ
  choice: und weinten
  rationale: Gibt das Trauern und Vergießen von Tränen genauer wieder als das mehrdeutige „schrien“.
- source_word: וְגַם
  choice: Auch
  rationale: 'Markiert die Hinzufügung: Neben den Königssöhnen stimmen auch der König und seine Diener in die Klage ein.'
- source_word: וְכָל עֲבָדָיו
  choice: und alle seine Diener
  rationale: עֲבָדָיו kann im höfischen Kontext Diener, Bedienstete oder Amtsträger bezeichnen; „Diener“ hält diese Breite offen.
- source_word: בָּכוּ בְּכִי גָּדוֹל מְאֹד
  choice: weinten überaus heftig
  rationale: Die natürliche deutsche Formulierung vermittelt die starke Intensivierung des hebräischen stammverwandten Objekts, während die Fußnote dessen Form sichtbar macht.
