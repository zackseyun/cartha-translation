  text: But Absalom fled and went to Geshur[b][a], and he was there three years.
translation:
  language: de
  text: Abschalom aber floh und ging nach Geschur[a]. Dort blieb er drei Jahre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Abschalom floh und ging nach Geschur.“ Das hebräische Bindewort kann im Zusammenhang sowohl mit „und“ als auch mit „aber“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und er war dort drei Jahre“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: Abschalom aber
  rationale: Das וְ kann die Erzählung fortführen oder hier einen leichten Gegensatz beziehungsweise eine Wiederaufnahme markieren. Die Nachstellung „aber“ ist im Deutschen natürlich; die Alternative „Und Abschalom“ bleibt möglich.
- source_word: בָּרַח
  choice: floh
  rationale: בָּרַח bezeichnet gewöhnlich das Fliehen oder Entkommen. „Floh“ ist knapp und gibt die Fluchtbewegung präzise wieder.
- source_word: וַ/יֵּלֶךְ
  choice: ging
  rationale: הלך bedeutet in dieser narrativen Verbfolge schlicht „gehen“. „Ging“ bewahrt die direkte Ausdrucksweise des Hebräischen.
- source_word: גְּשׁוּר
  choice: Geschur
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Bibeltransliteration wiedergegeben.
- source_word: וַ/יְהִי שָׁם
  choice: Dort blieb er
  rationale: Wörtlich heißt die Wendung „und er war dort“. Im Zusammenhang mit einer Zeitdauer ist „Dort blieb er“ natürliches modernes Deutsch, ohne den Sinn wesentlich zu erweitern.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: drei Jahre
  rationale: Die Zahl-Nomen-Verbindung bezeichnet die Dauer seines Aufenthalts.
