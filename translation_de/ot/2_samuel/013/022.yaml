base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/022.yaml
  text: And Absalom did not speak with Amnon[a], either bad or good[b], because Absalom hated Amnon because he had violated Tamar his sister.
translation:
  language: de
  text: Absalom sprach mit Amnon weder Böses noch Gutes[a], denn Absalom hasste Amnon, weil Amnon Tamar, Absaloms Schwester, geschändet[b] hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht von Bösem bis zu Gutem“. Die hebräische Redewendung bedeutet hier, dass Absalom überhaupt nicht mit Amnon sprach.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „erniedrigt“. In diesem Zusammenhang bezeichnet das hebräische Verb Amnons sexuelle Gewalttat an Tamar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... עִם
  choice: redete mit
  rationale: Die Wendung bedeutet, mit oder zu jemandem zu reden. „Redete mit“ bewahrt die Präposition und klingt im Deutschen natürlich.
- source_word: לְמֵרָע וְעַד טוֹב
  choice: weder im Bösen noch im Guten
  rationale: 'Die gegensätzlichen Begriffe bilden eine umfassende Redewendung: Absalom wechselte mit Amnon keinerlei Worte. Die Übersetzung erhält Reihenfolge und Bildsprache des Hebräischen.'
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier die Begründung für Absaloms Schweigen ein.
- source_word: שָׂנֵא
  choice: hasste
  rationale: Das Verb bezeichnet unverhüllt starken Hass.
- source_word: עַל דְּבַר אֲשֶׁר
  choice: weil
  rationale: Die wörtlich nominale Konstruktion „wegen der Sache, dass“ bezeichnet den Grund; „weil“ gibt sie in natürlichem modernem Deutsch wieder.
- source_word: עִנָּה
  choice: sexuell misshandelt
  rationale: Das Verb kann demütigen oder erniedrigen bedeuten, bezeichnet in diesem erzählerischen Zusammenhang jedoch die zuvor berichtete sexuelle Gewalttat. „Sexuell misshandelt“ macht den Kontext deutlich, ohne die Bedeutungsbreite des Verbs völlig auszublenden.
- source_word: אֲחֹתוֹ
  choice: Absaloms Schwester
  rationale: Das Suffix bezieht sich im Satz auf Absalom. Die ausdrückliche Namensnennung verhindert im Deutschen eine missverständliche Zuordnung zu Amnon.
