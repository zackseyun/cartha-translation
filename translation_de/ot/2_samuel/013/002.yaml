base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/002.yaml
  text: Amnon was so distressed that he made himself sick because of Tamar his sister[a], for she was a virgin[b], and it seemed impossible in Amnon’s eyes to do anything to her.
translation:
  language: de
  text: Amnon war wegen seiner Schwester Tamar so bedrückt, dass er krank wurde.[a] Denn sie war Jungfrau, und in Amnons Augen schien es unmöglich, ihr irgendetwas zu tun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass er sich krank machte“. Die hebräische Form kann sowohl das Ergebnis („krank werden“) als auch eine reflexive Bedeutung („sich krank machen“) ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: '„In Amnons Augen“ ist eine hebräische Ausdrucksweise für seine eigene Einschätzung: Er sah keine Möglichkeit, ihr irgendetwas zu tun.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֶר
  choice: war … so bedrückt
  rationale: Das Verb beschreibt hier innere Bedrängnis oder seelischen Druck. „So bedrückt“ verbindet diesen Zustand natürlich mit der folgenden Erkrankung, ohne Amnons Begehren zu verharmlosen.
- source_word: לְהִתְחַלּוֹת
  choice: dass er krank wurde
  rationale: Die Hitpael-Form von חלה kann sowohl ein Krankwerden als auch ein Sich-selbst-krank-Machen bezeichnen. Der Haupttext gibt die resultative Lesart wieder; die reflexive Möglichkeit bleibt in der Fußnote erhalten.
- source_word: בַּעֲבוּר
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Grund beziehungsweise Anlass. „Wegen“ ist die knappe und natürliche deutsche Entsprechung.
- source_word: אֲחֹתוֹ
  choice: seiner Schwester
  rationale: Die Verwandtschaftsbezeichnung wird ausdrücklich bewahrt, da sie für den Verlauf und die moralische Dimension der Erzählung entscheidend ist.
- source_word: בְתוּלָה
  choice: Jungfrau
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich eine Jungfrau. Die direkte deutsche Entsprechung ist klarer als allgemeinere Ausdrücke wie „junge Frau“.
- source_word: וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן
  choice: in Amnons Augen schien es unmöglich
  rationale: Die Wiedergabe bewahrt das hebräische Perspektividiom „in den Augen“ und vermittelt, dass Amnon keinen gangbaren Weg sah.
- source_word: לַעֲשׂוֹת לָהּ מְאוּמָה
  choice: ihr etwas anzutun
  rationale: Die Formulierung lässt die konkrete Handlung unbestimmt, wie das hebräische מְאוּמָה („irgendetwas“) es tut. Im Deutschen bezeichnet „jemandem etwas antun“ zugleich natürlich eine gegen die Person gerichtete Handlung und passt zum bedrohlichen Erzählzusammenhang, ohne die spätere Tat schon ausdrücklich zu benennen.
