source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יֽוֹנָדָב֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּ֥ה בְנֵֽי הַ/מֶּ֖לֶךְ בָּ֑אוּ כִּ/דְבַ֥ר עַבְדְּ/ךָ֖ כֵּ֥ן הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/035.yaml
  text: Then Jonadab said to the king[a], “Look, the king’s sons have come; as your servant said, so it has happened.”
translation:
  language: de
  text: 'Da sagte Jonadab zum König: »Sieh, die Söhne des Königs sind gekommen. Wie dein Diener gesagt hat, so ist es geschehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw consecutivum führt die Erzählung weiter; »Da sagte« gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: יֽוֹנָדָב
  choice: Jonadab
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אֶל הַמֶּלֶךְ
  choice: zum König
  rationale: Gemeint ist der menschliche König David; die Anrede beziehungsweise Amtsbezeichnung wird idiomatisch mit »zum König« wiedergegeben.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die deiktische Partikel lenkt nachdrücklich die Aufmerksamkeit auf das unmittelbar Wahrnehmbare. »Sieh« wahrt diese Funktion in würdigem, verständlichem Deutsch.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: die Söhne des Königs
  rationale: Die Constructusverbindung wird natürlich wiedergegeben; der Plural ist im Kontext wichtig, weil Jonadab die Meldung widerlegt, alle Königssöhne seien getötet worden.
- source_word: בָּאוּ
  choice: sind gekommen
  rationale: Das Perfekt bezeichnet die nun feststehende Ankunft; das deutsche Perfekt passt zur unmittelbaren Feststellung nach »Sieh«.
- source_word: כִּדְבַר עַבְדְּךָ
  choice: Wie dein Diener gesagt hat
  rationale: דבר bezeichnet hier das zuvor Gesagte. »Dein Diener« bewahrt Jonadabs höfische Selbstbezeichnung.
- source_word: כֵּן הָיָה
  choice: so ist es geschehen
  rationale: Die Wendung bestätigt, dass Jonadabs frühere Aussage eingetroffen ist, und bewahrt zugleich die hebräische Entsprechungsstruktur »wie … so«.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Selbstbezeichnung »dein Diener« und die betonte Korrespondenz »Wie … so« bleiben erhalten; unnötig altertümliche Formulierungen werden vermieden.
