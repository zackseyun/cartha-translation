source:
  edition: WLC
  text: וּ/לְ/אַמְנ֣וֹן רֵ֗עַ וּ/שְׁמ/וֹ֙ יֽוֹנָדָ֔ב בֶּן שִׁמְעָ֖ה אֲחִ֣י דָוִ֑ד וְ/י֣וֹנָדָ֔ב אִ֥ישׁ חָכָ֖ם מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/003.yaml
  text: Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
translation:
  language: de
  text: Amnon hatte einen Freund namens Jonadab, den Sohn Schimeahs, eines Bruders Davids; Jonadab war ein sehr kluger Mann[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein sehr weiser Mann«; auch: »ein sehr scharfsinniger Mann«. Das hebräische Wort bezeichnet Klugheit oder Weisheit in einem weiten Sinn. Der Fortgang der Erzählung zeigt, dass Jonadab seine Klugheit für einen moralisch verwerflichen Rat einsetzt.'
    reason: Lexikalische Bedeutungsbreite von חָכָם und die im Erzählverlauf erkennbare moralische Spannung.
lexical_decisions:
- source_word: רֵעַ
  choice: Freund
  rationale: Das Substantiv bezeichnet einen Freund, Gefährten oder Vertrauten. »Freund« ist hier die natürliche deutsche Wiedergabe und beschreibt Jonadabs Beziehung zu Amnon, ohne sie näher zu bestimmen.
- source_word: וּלְאַמְנוֹן
  choice: Amnon hatte
  rationale: Die hebräische Konstruktion »und/für Amnon« drückt Besitz beziehungsweise Zuordnung aus. Im Deutschen wird sie idiomatisch mit »Amnon hatte« wiedergegeben; ein nicht ausdrücklich vorhandenes »Nun« wird nicht ergänzt.
- source_word: וּשְׁמוֹ
  choice: namens
  rationale: Die hebräische Namensformel bedeutet wörtlich »und sein Name war«. »Namens« gibt sie in diesem Satz knapp und natürlich wieder.
- source_word: בֶּן שִׁמְעָה
  choice: einen Sohn Schimas
  rationale: Die genealogische Wendung wird direkt wiedergegeben. Die Apposition macht im Deutschen eindeutig, dass Jonadab der Sohn Schimas ist.
- source_word: אֲחִי דָוִד
  choice: des Bruders Davids
  rationale: Die Genitivfügung bezieht sich auf Schima und kennzeichnet ihn als Davids Bruder. Die Formulierung bewahrt diese Zuordnung.
- source_word: אִישׁ חָכָם מְאֹד
  choice: ein äußerst kluger Mann
  rationale: חָכָם kann Weisheit, Klugheit oder geschickte Einsicht bezeichnen. »Äußerst klug« bewahrt die breite Grundbedeutung, ohne Jonadabs späteren, moralisch verwerflichen Rat vorwegnehmend positiv oder negativ zu bewerten; »Mann« entspricht אִישׁ.
theological_decisions:
- issue: Moralische Wertung von Jonadabs חָכָם
  choice: Die Hauptübersetzung verwendet das wertungsoffene »klug« und erläutert die Spannweite in einer Fußnote.
  alternative: »weise« oder »gerissen«
  rationale: »Weise« könnte im Deutschen moralische Zustimmung nahelegen, während »gerissen« Jonadab bereits ausdrücklich negativ beurteilt. Der hebräische Ausdruck selbst lässt die moralische Qualität seiner Klugheit zunächst offen; der Fortgang der Erzählung zeigt ihren problematischen Einsatz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei hebräischen Hauptsätze werden zur besseren Lesbarkeit als zwei deutsche Sätze wiedergegeben. »Schima« folgt einer geläufigen deutschen Namensform; die verschachtelte Verwandtschaftsangabe bleibt eindeutig erhalten.
