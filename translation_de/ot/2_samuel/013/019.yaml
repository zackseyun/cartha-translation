  source_fidelity: Die Abfolge der Handlungen und die Trauergesten werden zutreffend wiedergegeben. „Streute ... Asche auf ihren Kopf“, „zerriss“, „legte die Hand auf ihren Kopf“ und die Verbindung von Weggehen und lautem Rufen entsprechen dem Hebräischen. כְּתֹנֶת הַפַּסִּים ist jedoch in seiner genauen Bedeutung unsicher; „Prachtgewand“ legt einen luxuriösen Charakter nahe, der im Wort selbst nicht gesichert ist.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und wahrt einen erzählerisch würdigen Ton. „Ging laut schreiend davon“ ist verständlich; „ging weiter und schrie laut“ gibt die fortgesetzte Bewegung und das gleichzeitige Rufen etwas unmittelbarer wieder.
  terminology: „Besonderes Gewand“ ist für כְּתֹנֶת הַפַּסִּים im Haupttext vorsichtiger als „Prachtgewand“. Die Fußnote soll die gängigen, aber unsicheren Deutungen nennen und den Kontext von V. 18 mit „Jungfrauen“ statt der engeren Deutung „unverheiratete“ wiedergeben.
