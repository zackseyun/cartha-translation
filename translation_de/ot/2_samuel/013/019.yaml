base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/019.yaml
  text: Then Tamar put ashes on her head[a], tore the robe of many colors that was on her, put her hand on her head, and went away, going and crying out.
translation:
  language: de
  text: Da streute Tamar Asche auf ihren Kopf, zerriss das besondere Gewand[a], das sie trug, legte die Hand auf ihren Kopf und ging weiter und schrie laut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bedeutung des hebräischen Ausdrucks ist unsicher. Möglich sind etwa „langärmeliges Gewand“, „langes Gewand“ oder „vielfarbiges Gewand“. Nach 2. Samuel 13,18 war es ein besonderes Gewand der Königstöchter, solange sie Jungfrauen waren.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵפֶר
  choice: Asche
  rationale: Das Substantiv bezeichnet hier Asche als sichtbares Zeichen der Trauer; im Deutschen ist der Singular „Asche“ idiomatisch.
- source_word: וַתִּקַּח ... עַל רֹאשָׁהּ
  choice: streute ... Asche auf ihren Kopf
  rationale: Die wörtlich knappe hebräische Wendung beschreibt das Aufbringen von Asche auf den Kopf. „Streute“ gibt die konkrete Trauerhandlung natürlich wieder, ohne ihren Sinn auszudeuten.
- source_word: כְתֹנֶת הַפַּסִּים
  choice: Prachtgewand
  rationale: Die genaue Beschaffenheit des Gewands ist lexikalisch unsicher. „Prachtgewand“ bezeichnet ein auffälliges, besonderes Kleid, ohne sich ungesichert auf lange Ärmel oder viele Farben festzulegen; der Kontext von 2 Sam 13,18 verbindet es mit unverheirateten Königstöchtern.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: das sie trug
  rationale: Dies ist eine natürliche deutsche Wiedergabe der relativen Aussage, dass Tamar das Gewand anhatte.
- source_word: קָרָעָה
  choice: zerriss
  rationale: Das Verb bezeichnet das Zerreißen des Gewands als Zeichen von Trauer und Erschütterung.
- source_word: וַתָּשֶׂם יָדָהּ עַל רֹאשָׁהּ
  choice: legte die Hand auf ihren Kopf
  rationale: Die körperliche Gebärde wird eng am Hebräischen bewahrt und nicht weiter psychologisch ausgedeutet.
- source_word: וַתֵּלֶךְ הָלוֹךְ וְזָעָקָה
  choice: ging laut schreiend davon
  rationale: Die Verbindung aus finitem Verb, Infinitivus absolutus und זעק beschreibt ihr fortgesetztes Gehen bei lautem Rufen. Die deutsche Formulierung gibt Gleichzeitigkeit, Dauer und Intensität knapp und natürlich wieder.
