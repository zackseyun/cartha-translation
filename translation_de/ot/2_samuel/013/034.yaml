translation_notes:
  register: Modernes, würdiges Erzähldeutsch. Die hebräische Blickformel wird idiomatisch wiedergegeben; „Da“ erhält die aufmerksamkeitslenkende Funktion von הִנֵּה. Die räumliche Mehrdeutigkeit am Versende wird im Text nicht unnötig geglättet und in einer Fußnote kenntlich gemacht.
