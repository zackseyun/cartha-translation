base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/034.yaml
  text: But Absalom fled[a]. And the young man who was watching lifted up his eyes and saw, and behold, many people were coming by the road behind him[c][b], from the side of the mountain.
translation:
  language: de
  text: 'Absalom aber floh. Der junge Mann, der Ausschau hielt,[a] blickte auf[b] und sah: Da kamen viele Menschen auf dem Weg hinter ihm, von der Bergseite her.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Diener, der Wache hielt“; das Hebräische verbindet „junger Mann/Diener“ mit einem Ausdruck für das Beobachten oder Ausschauhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „erhob seine Augen“, eine hebräische Redewendung für das Aufblicken.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „von dem Weg hinter ihm, von der Bergseite her“. Die räumlichen Bezüge sind im Hebräischen knapp und nicht völlig eindeutig formuliert.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: floh
  rationale: ברח bezeichnet Flucht oder Entkommen. „Floh“ ist knapp, natürlich und bewahrt die erzählerische Bewegung.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: הַנַּעַר הַצֹּפֶה
  choice: der junge Mann, der Ausschau hielt
  rationale: נַעַר kann „junger Mann“ oder „Diener“ bedeuten; צֹפֶה bezeichnet jemanden, der beobachtet oder Ausschau hält. Die Wiedergabe bewahrt beide Bestandteile, ohne ein förmliches Wächteramt vorauszusetzen.
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  choice: blickte auf
  rationale: Die wörtliche Wendung „erhob seine Augen“ ist ein hebräisches Idiom. „Blickte auf“ gibt dessen Sinn in natürlichem modernem Deutsch wieder.
- source_word: וַיַּרְא וְהִנֵּה
  choice: 'und sah: Da'
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf das plötzlich Wahrgenommene. Die Konstruktion mit Doppelpunkt und „Da“ bewahrt diese Erzählfunktion ohne das heute altertümlich wirkende „siehe“.
- source_word: עַם רַב
  choice: viele Menschen
  rationale: עַם wird hier kollektiv gebraucht, רַב bezeichnet die große Zahl. „Viele Menschen“ bleibt neutral und unterstellt keine organisierte Menschenmenge.
- source_word: הֹלְכִים
  choice: kamen
  rationale: הלך bedeutet grundsätzlich gehen; aus der Perspektive des Ausschau Haltenden bewegt sich die Gruppe auf ihn beziehungsweise den Ort zu, weshalb „kamen“ im Deutschen idiomatisch ist.
- source_word: מִדֶּרֶךְ אַחֲרָיו
  choice: auf dem Weg hinter ihm her
  rationale: Die räumlich gedrängte Formulierung enthält einen Weg und אַחֲרָיו „hinter ihm“. Die gewählte Fassung erhält den naheliegenden Bezug auf eine Bewegung hinter einer männlichen Person, ohne die Unsicherheit ganz aufzulösen.
- source_word: מִצַּד הָהָר
  choice: von der Bergseite her
  rationale: צַד bedeutet „Seite“, הָר „Berg“ oder je nach Gelände „Höhe“. „Von der Bergseite her“ ist natürlich und bleibt nahe an der räumlichen Aussage.
