  source_fidelity: Die Übersetzung gibt Flucht, den als Ausschau Haltenden, das Aufblicken, die große Personengruppe und die Herkunft von der Bergseite im Wesentlichen treffend wieder. „Hinter ihm her“ bedeutet im heutigen Deutsch jedoch gewöhnlich „ihm folgend“ und legt damit eine Gefolgschaftsbeziehung nahe, die im hebräischen מִדֶּרֶךְ אַחֲרָיו nicht ausgedrückt ist. Die räumliche, im Bezug des Suffixes offene Formulierung muss ohne diese Zusatzbedeutung stehen bleiben.
  naturalness: Der Erzählstil ist modern, klar und angemessen würdig. „Da kamen“ ist eine natürliche Wiedergabe von וְהִנֵּה in diesem Kontext. Die geringfügige Umstellung zu „auf dem Weg hinter ihm“ ist idiomatisch und vermeidet die missverständliche Bewegungsnuance von „hinter ihm her“.
  terminology: „Absalom“, „floh“, „junger Mann“ und „Ausschau hielt“ sind sachgerecht. Die Fußnoten erläutern die möglichen Bedeutungen von נַעַר und die hebräische Blickformel angemessen, ohne ein Amt oder eine sonstige Rolle dogmatisch festzulegen.
