  to: 'Absalom aber floh. Der junge Mann, der Ausschau hielt,[a] blickte auf[b] und sah: Da kamen viele Menschen auf dem Weg hinter ihm, von der Bergseite her.[c]'
  rationale: Die Revision beschränkt sich auf die räumliche Wendung. „Hinter ihm“ entspricht der hebräischen Ortsangabe, während „hinter ihm her“ im Deutschen zusätzlich ausdrücken kann, dass die Menschen einer Person folgten. Die Fußnote bewahrt die im Hebräischen bestehende räumliche Verdichtung und Unsicherheit.
