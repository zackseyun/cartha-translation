source:
  edition: WLC
  text: וַֽ/יְהִי֙ הֵ֣מָּה בַ/דֶּ֔רֶךְ וְ/הַ/שְּׁמֻעָ֣ה בָ֔אָה אֶל דָּוִ֖ד לֵ/אמֹ֑ר הִכָּ֤ה אַבְשָׁלוֹם֙ אֶת כָּל בְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/לֹֽא נוֹתַ֥ר מֵ/הֶ֖ם אֶחָֽד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/030.yaml
  text: While they were on the way[a], the report came to David, saying, “Absalom has struck down all the king’s sons, and not one of them is left.”
translation:
  language: de
  text: 'Während sie unterwegs waren, erreichte David die Meldung[a]: »Absalom hat alle Söhne des Königs erschlagen; kein Einziger von ihnen ist übrig geblieben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Nachricht«; das hebräische Wort kann auch eine unbestätigte Meldung oder ein Gerücht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה בַדֶּרֶךְ
  choice: Während sie unterwegs waren
  rationale: Die hebräische Erzählungsformel führt einen begleitenden zeitlichen Umstand ein. Die deutsche Fassung bewahrt diesen Sinn in natürlicher, moderner Sprache.
- source_word: הַשְּׁמֻעָה
  choice: die Meldung
  rationale: שְׁמוּעָה kann eine Nachricht, Meldung oder ein Gerücht bezeichnen. Da sich die Behauptung später als übertrieben erweist, wahrt »Meldung« ihren zunächst unbestätigten Charakter, ohne sie bereits ausdrücklich als Gerücht zu bewerten.
- source_word: בָאָה אֶל דָּוִד
  choice: erreichte David
  rationale: Dies gibt das Eintreffen der Meldung bei David idiomatisch wieder und entspricht sachlich dem hebräischen »kam zu David«.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor direkter Rede
  rationale: Der hebräische Redeinleiter wird im Deutschen natürlich durch einen Doppelpunkt und direkte Rede wiedergegeben.
- source_word: הִכָּה
  choice: hat ... erschlagen
  rationale: נכה bezeichnet das Schlagen oder Niederschlagen und kann in einem tödlichen Kontext »erschlagen« bedeuten. Hier behauptet die Meldung ausdrücklich, kein Sohn sei übrig geblieben.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: alle Söhne des Königs
  rationale: Direkte und im Kontext geschlechtsspezifisch zutreffende Wiedergabe.
- source_word: וְלֹא נוֹתַר מֵהֶם אֶחָד
  choice: kein Einziger von ihnen ist übrig geblieben
  rationale: Die Formulierung bewahrt die nachdrückliche Einzelzählung von אֶחָד und gibt das Verbleiben beziehungsweise Übrigbleiben natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit würdigem erzählerischem Ton. Die direkte Rede bleibt als zunächst unbestätigte und später korrigierte Meldung erkennbar; die Übersetzung löst diese Spannung nicht vorzeitig auf.
