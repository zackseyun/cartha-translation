base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/004.yaml
  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
translation:
  language: de
  text: 'Er sagte zu ihm: „Warum bist du, Königssohn, Morgen für Morgen so abgemagert? Willst du es mir nicht erzählen?“ Amnon antwortete ihm: „Ich liebe Tamar[a], die Schwester meines Bruders Abschalom.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich bin in Tamar verliebt.“ Das Hebräische lautet wörtlich: „Ich liebe Tamar.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Die direkte Frage nach dem Grund wird im modernen Deutschen natürlich mit „Warum“ wiedergegeben.
- source_word: כָּכָה דַּל
  choice: siehst du … so elend aus
  rationale: דַּל bezeichnet hier dem Zusammenhang nach Amnons sichtbar angegriffenen Zustand, nicht wirtschaftliche Armut. Die idiomatische Formulierung gibt diesen Eindruck wieder, ohne eine konkrete Krankheit festzulegen.
- source_word: בֶּן הַמֶּלֶךְ
  choice: du Königssohn
  rationale: Die direkte Anrede bewahrt die rhetorische Betonung seiner privilegierten Stellung und klingt zugleich natürlich.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Morgen für Morgen
  rationale: Die Wiederholung bezeichnet ein regelmäßig wiederkehrendes Geschehen und wird formnah sowie idiomatisch wiedergegeben.
- source_word: הֲלוֹא תַּגִּיד לִי
  choice: Willst du es mir nicht erzählen?
  rationale: הֲלוֹא drückt hier eine erwartungsvolle Aufforderung aus; „erzählen“ passt zu der Bitte, den persönlichen Grund offenzulegen.
- source_word: אֲחוֹת אַבְשָׁלֹם אָחִי
  choice: die Schwester meines Bruders Abschalom
  rationale: Diese Wiedergabe erhält die auffällige relationale Struktur des Hebräischen.
- source_word: אֲנִי אֹהֵב
  choice: Ich liebe
  rationale: Das gewöhnliche hebräische Verb für „lieben“ wird ohne psychologische oder moralische Ausdeutung übersetzt.
theological_decisions:
- issue: Amnons Aussage über Tamar
  choice: Ich liebe Tamar
  alternative: Ich bin in Tamar verliebt / Ich begehre Tamar
  rationale: Der hebräische Wortlaut verwendet אָהֵב, das gewöhnliche Verb für „lieben“. Obwohl der weitere Erzählverlauf Amnons Haltung entlarvt, soll diese Aussage nicht vorwegnehmend als bloßes Begehren gedeutet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Morgen für Morgen“ bewahrt die hebräische Wiederholung; „du Königssohn“ erhält den Nachdruck der Anrede. Der Fußnotenmarker [a] steht unmittelbar bei „Tamar“.
