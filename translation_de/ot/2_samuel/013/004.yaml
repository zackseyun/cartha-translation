  verdict: revise
  source_fidelity: 'Die Grundstruktur und die Beziehungen sind korrekt wiedergegeben: Jonadab fragt Amnon nach seinem fortgesetzten Zustand; Amnon nennt Tamar als Schwester seines Bruders Abschalom und sagt mit אֹהֵב schlicht „ich liebe“. Für דַּל ist jedoch eine körperlich sichtbare Abmagerung bzw. Schwäche gemeint. „So elend aussehen“ kann im Deutschen primär seelisches Unglück oder eine allgemeine miserable Verfassung bezeichnen und ist daher weniger genau.'
  naturalness: „Morgen für Morgen“ und die direkte Anrede sind gut verständlich und angemessen würdevoll. „Warum bist du, Königssohn, Morgen für Morgen so abgemagert?“ ist idiomatisch und bildet den körperlichen Sinn von דַּל präziser ab.
  terminology: „Königssohn“, „Abschalom“ und „ich liebe“ sind angemessen. Die Fußnote bewahrt die mögliche idiomatischere Lesart „Ich bin in Tamar verliebt“, sollte aber nicht mit „Wörtlicher“ eingeführt werden, da der Haupttext selbst bereits die wörtliche Wiedergabe bietet.
