  yaml_path: translation/ot/2_samuel/013/011.yaml
  text: When she brought it near to him to eat[a], he seized her and said to her, “Come, lie with me, my sister.”
translation:
  language: de
  text: 'Als sie es ihm zum Essen näher brachte[a], packte er sie und sagte zu ihr: »Komm, schlaf mit mir, meine Schwester!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Als sie zu ihm trat, damit er essen konnte«. Das hebräische Verb kann sowohl bedeuten, dass Tamar näher kam, als auch, dass sie die Speise näher brachte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: sie brachte es näher
  rationale: Das Hifil von נגשׁ kann hier transitiv »heranbringen« oder in der überlieferten Konsonantengestalt auch im Sinn von »sich nähern« verstanden werden. Im Zusammenhang mit dem Servieren der Speise ist die transitive Wiedergabe am wahrscheinlichsten; die Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: אֵלָיו לֶאֱכֹל
  choice: ihm zum Essen
  rationale: Die Richtungsangabe und der Zweckinfinitiv werden in natürlichem Deutsch knapp verbunden. Das sachliche Objekt ist aus dem Zusammenhang erschlossen und durch »es« aufgenommen.
- source_word: וַיַּחֲזֶק בָּהּ
  choice: packte er sie
  rationale: חזק mit ב bezeichnet ein festes Ergreifen. »Packte« gibt den gewaltsamen Zugriff klar und idiomatisch wieder, ohne über den hebräischen Wortlaut hinauszugehen.
- source_word: בּוֹאִי
  choice: Komm
  rationale: Der feminine Singularimperativ wird direkt und knapp wiedergegeben.
- source_word: שִׁכְבִי עִמִּי
  choice: schlaf mit mir
  rationale: שׁכב mit עם ist hier eindeutig eine sexuelle Aufforderung. »Mit jemandem schlafen« ist im modernen Standarddeutsch die klare, geläufige Entsprechung; das wörtlichere »lieg bei mir« könnte bloßes gemeinsames Liegen nahelegen.
- source_word: אֲחוֹתִי
  choice: meine Schwester
  rationale: Die ausdrückliche Verwandtschaftsbezeichnung wird bewahrt, weil sie für die moralische und erzählerische Wirkung der Szene wesentlich ist.
theological_decisions:
- issue: Wiedergabe der sexuellen Aufforderung ohne beschönigende Abschwächung
  choice: schlaf mit mir
  alternative: lieg bei mir
  rationale: Der hebräische Ausdruck ist in diesem Kontext sexuell. Die gewählte Formulierung macht die Forderung verständlich, ohne zusätzliche Einzelheiten einzutragen.
- issue: Beibehaltung der verwandtschaftlichen Anrede
  choice: meine Schwester
  alternative: Auslassung der Anrede
  rationale: Die Anrede gehört ausdrücklich zum Text und verschärft die dargestellte Grenzüberschreitung; sie darf nicht geglättet oder ausgelassen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählung bleibt knapp und direkt; die Gewalt wird weder abgeschwächt noch ausgeschmückt. Die Fußnote erhält die echte lexikalisch-syntaktische Mehrdeutigkeit des ersten Verbs.
