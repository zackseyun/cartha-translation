  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung des Namens Absalom am Satzanfang bleibt erhalten, während die lange hebräische Satzkette zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert wird.
