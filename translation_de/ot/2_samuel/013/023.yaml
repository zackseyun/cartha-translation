base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/023.yaml
  text: It happened after two full years that Absalom had sheep shearers at Baal-hazor[a], which is near Ephraim, and Absalom invited all the king’s sons.
translation:
  language: de
  text: Nach Ablauf von zwei Jahren[a] hielt Absalom in Baal-Hazor, das bei Efraim liegt, Schafschur. Absalom lud alle Söhne des Königs ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »nach zwei Jahren von Tagen«; eine hebräische Wendung für einen vollständig verstrichenen Zeitraum von zwei Jahren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנָתַיִם יָמִים
  choice: nach zwei vollen Jahren
  rationale: Die hebräische Wendung verbindet »zwei Jahre« mit »Tage« und bezeichnet einen vollständig verstrichenen Zeitraum von zwei Jahren. Die deutsche Wiedergabe ist natürlich und bewahrt diesen Sinn.
- source_word: גֹזְזִים לְאַבְשָׁלוֹם
  choice: Absaloms Schafscherer
  rationale: Das substantivisch gebrauchte Partizip bezeichnet hier Männer, die Schafe scheren; der Zusammenhang mit Absalom wird durch den Genitiv knapp und verständlich ausgedrückt.
- source_word: בְּבַעַל חָצוֹר
  choice: in Baal-Hazor
  rationale: Der Ortsname wird transliteriert; »in« bezeichnet idiomatisch den Ort des Geschehens.
- source_word: אֲשֶׁר עִם אֶפְרָיִם
  choice: das bei Efraim liegt
  rationale: עִם drückt hier wahrscheinlich räumliche Nähe aus. Der Relativsatz macht den geografischen Bezug im Deutschen klar.
- source_word: וַיִּקְרָא
  choice: lud ... ein
  rationale: Das Verb bedeutet grundsätzlich »rufen«, hat im Zusammenhang des bevorstehenden Festes jedoch die pragmatische Bedeutung »einladen«.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: alle Söhne des Königs
  rationale: Die Formulierung gibt die hebräische Genitivverbindung klar und ohne zusätzliche Deutung wieder.
- source_word: וַיְהִי
  choice: Nach ...
  rationale: Die hebräische Erzählform führt das nächste Ereignis ein. Im natürlichen Deutschen übernimmt die vorangestellte Zeitangabe diese Funktion, ohne ein im Ausgangstext nicht vorhandenes »nun« einzufügen.
