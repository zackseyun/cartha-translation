source:
  edition: WLC
  text: וַ/תְּכַל֙ דָּוִ֣ד הַ/מֶּ֔לֶךְ לָ/צֵ֖את אֶל אַבְשָׁל֑וֹם כִּֽי נִחַ֥ם עַל אַמְנ֖וֹן כִּֽי מֵֽת־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/039.yaml
  text: And King David longed to go out to Absalom, for he was comforted concerning Amnon, since he was dead.
translation:
  language: de
  text: König David sehnte sich danach, zu Abschalom hinauszugehen[a], denn über Amnons Tod hatte er sich getröstet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist grammatisch schwierig. Nach einer anderen alten Deutung: „König David hörte auf, gegen Abschalom auszuziehen.“'
    reason: Die feminine Verbform וַתְּכַל ohne ausdrückliches feminines Subjekt ist ungewöhnlich; die Septuaginta und die Vulgata bezeugen eine Deutung im Sinn von „aufhören“, während der masoretische Text אֶל („zu“) liest.
lexical_decisions:
- source_word: וַתְּכַל ... לָצֵאת אֶל
  choice: sehnte sich danach, … hinauszugehen
  rationale: Im Zusammenhang mit 2. Samuel 14,1 bezeichnet die schwierige hebräische Wendung am ehesten Davids Verlangen, wieder auf Abschalom zuzugehen. Das ungewöhnliche feminine Verb lässt jedoch auch eine andere Deutung zu, die in der Fußnote festgehalten wird.
- source_word: נִחַם עַל אַמְנוֹן כִּי מֵת
  choice: über Amnons Tod hatte er sich getröstet
  rationale: נחם im Nifal kann hier das Getröstetwerden beziehungsweise das Nachlassen der Trauer bezeichnen. Die deutsche Formulierung gibt den Sinn der beiden hebräischen Teilsätze natürlich wieder, ohne eine darüber hinausgehende Versöhnung mit Abschalom zu behaupten.
theological_decisions:
- issue: Davids Haltung gegenüber Abschalom
  choice: Davids Sehnsucht, zu Abschalom hinauszugehen
  alternative: David hörte auf, gegen Abschalom auszuziehen
  rationale: Der masoretische Text hat אֶל („zu“) und der unmittelbare Fortgang spricht dafür, dass Davids Inneres Abschalom zugewandt war. Wegen der grammatischen Schwierigkeit und der alten abweichenden Überlieferung bleibt die Alternative ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Name אַבְשָׁלוֹם wird in der geläufigen deutschen Bibelform „Abschalom“ wiedergegeben; das wiederholte „König David“ bleibt erhalten.
