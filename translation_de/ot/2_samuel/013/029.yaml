base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/029.yaml
  text: So Absalom’s young men did to Amnon as Absalom had commanded[a]. Then all the king’s sons arose[b], and each mounted his mule and fled.
translation:
  language: de
  text: Da taten Absaloms junge Männer[a] Amnon an, was Absalom befohlen hatte.[b] Darauf standen alle Söhne des Königs auf; jeder bestieg sein Maultier, und sie flohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Absaloms Diener“ bzw. „Absaloms Begleiter“. Das hebräische Wort kann junge Männer im Dienst bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich knapp: „Sie taten Amnon an, wie Absalom befohlen hatte.“ Der vorausgehende Vers nennt den Befehl ausdrücklich: Sie sollten Amnon erschlagen, wenn sein Herz vom Wein fröhlich geworden war.'
    reason: cross_reference
lexical_decisions:
- source_word: נַעֲרֵי אַבְשָׁלוֹם
  choice: Absaloms junge Männer
  rationale: נַעַר kann einen jungen Mann, Diener oder Begleiter bezeichnen. „Junge Männer“ bewahrt die lexikalische Offenheit, ohne ihren genauen sozialen Status festzulegen; im Kontext handeln sie als Absaloms Beauftragte.
- source_word: וַיַּעֲשׂוּ לְאַמְנוֹן
  choice: führten … an Amnon aus
  rationale: Die Wendung bezeichnet knapp eine an Amnon vollzogene Handlung. Die deutsche Formulierung ist natürlich und lässt den unmittelbaren Kontext erklären, dass es sich um die Tötung Amnons handelt, ohne dies im Vers ausdrücklich hinzuzufügen.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: was Absalom befohlen hatte
  rationale: Die Formulierung bezeichnet die Übereinstimmung mit Absaloms vorausgegangenem Befehl; das Plusquamperfekt bildet die zeitliche Abfolge im Deutschen passend ab.
- source_word: וַיָּקֻמוּ
  choice: standen … auf
  rationale: „Aufstehen“ gibt das Verb direkt und in gegenwärtigem, würdigem Erzähldeutsch wieder.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: alle Söhne des Königs
  rationale: Direkte Wiedergabe der Constructusverbindung; gemeint sind die anwesenden männlichen Königssöhne.
- source_word: וַיִּרְכְּבוּ אִישׁ עַל פִּרְדּוֹ
  choice: jeder bestieg sein Maultier
  rationale: אִישׁ wird hier distributiv gebraucht („jeder“), und פֶּרֶד bezeichnet ein Maultier. „Bestieg“ ist idiomatisch und knapp.
- source_word: וַיָּנֻסוּ
  choice: sie flohen
  rationale: נוּס bezeichnet eine eilige Flucht; „flohen“ ist präzise und stilistisch angemessen.
