source:
  edition: WLC
  text: וַ/יְצַו֩ אַבְשָׁל֨וֹם אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר רְא֣וּ נָ֠א כְּ/ט֨וֹב לֵב אַמְנ֤וֹן בַּ/יַּ֨יִן֙ וְ/אָמַרְתִּ֣י אֲלֵי/כֶ֔ם הַכּ֧וּ אֶת אַמְנ֛וֹן וַ/הֲמִתֶּ֥ם אֹת֖/וֹ אַל תִּירָ֑אוּ הֲ/ל֗וֹא כִּ֤י אָֽנֹכִי֙ צִוִּ֣יתִי אֶתְ/כֶ֔ם חִזְק֖וּ וִ/הְי֥וּ לִ/בְנֵי חָֽיִל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/028.yaml
  text: 'Then Absalom commanded his young men[a], saying, “Please watch: when Amnon’s heart is merry with wine, and I say to you, ‘Strike Amnon,’ then kill him. Do not fear. Have I not myself commanded you? Be strong, and be men of valor.”'
translation:
  language: de
  text: 'Absalom befahl seinen jungen Männern: „Gebt acht! Wenn Amnons Herz durch den Wein guter Dinge ist und ich euch sage: ‚Schlagt Amnon nieder!‘, dann tötet ihn. Fürchtet euch nicht! Habe nicht ich selbst es euch befohlen? Seid stark und zeigt euch als tapfere Männer!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְעָרָיו
  choice: seinen jungen Männern
  rationale: נַעַר kann einen jungen Mann, Diener, Begleiter oder Gefolgsmann bezeichnen. Hier sind Absaloms persönliche Männer gemeint, die seinen Gewaltbefehl ausführen; die Wiedergabe bewahrt sowohl die maskuline Form als auch die mögliche Altersnuance.
- source_word: רְאוּ נָא
  choice: Gebt acht!
  rationale: Der Imperativ von ראה mit נָא fordert nachdrücklich zur Aufmerksamkeit auf. „Gebt acht!“ ist im Deutschen natürlich und erhält die Befehlswirkung, ohne נָא unpassend als höfliches „bitte“ abzuschwächen.
- source_word: כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן
  choice: Sobald Amnons Herz vom Wein guter Dinge ist
  rationale: Die hebräische Wendung spricht wörtlich davon, dass Amnons Herz durch den Wein „gut“ ist, also heiter oder gelöst. Die Formulierung erhält das Herzbild und behauptet nicht mehr als der Text, insbesondere keine vollständige Trunkenheit.
- source_word: הַכּוּ אֶת אַמְנוֹן
  choice: Schlagt Amnon nieder!
  rationale: נכה bezeichnet ein gewaltsames Schlagen und kann kontextabhängig auch tödliches Niederschlagen meinen. „Niederschlagen“ ist als Angriffssignal idiomatisch; der folgende Befehl benennt den Tod ausdrücklich.
- source_word: וַהֲמִתֶּם אֹתוֹ
  choice: dann tötet ihn
  rationale: Das Hifil von מות bedeutet „sterben lassen, töten“. „Dann“ macht im Deutschen die angeordnete Abfolge deutlich, die im Hebräischen durch die Verbverknüpfung ausgedrückt wird.
- source_word: אַל תִּירָאוּ
  choice: Fürchtet euch nicht!
  rationale: Die direkte Verneinung des Imperativs wird würdig und prägnant wiedergegeben.
- source_word: הֲלוֹא כִּי אָנֹכִי צִוִּיתִי אֶתְכֶם
  choice: Habe nicht ich selbst es euch befohlen?
  rationale: Die rhetorische Frage und das betonte אָנֹכִי werden durch „ich selbst“ erhalten. Das Pronomen „es“ bezieht den Befehl natürlich auf die unmittelbar zuvor angeordnete Tötung.
- source_word: חִזְקוּ
  choice: Seid stark
  rationale: Der Imperativ fordert Kraft, Entschlossenheit und Mut; „Seid stark“ ist direkt und lässt diese Bedeutungsbreite bestehen.
- source_word: וִהְיוּ לִבְנֵי חָיִל
  choice: zeigt euch als tapfere Männer
  rationale: בני חיל bezeichnet hier mutige, tatkräftige beziehungsweise kampffähige Männer. Die Formulierung erhält Geschlecht und martialischen Kontext, klingt aber natürlicher als das im heutigen Deutschen ungewöhnliche „Männer der Tapferkeit“.
theological_decisions:
- issue: Maskuline und martialische Aussage von לִבְנֵי חָיִל
  choice: zeigt euch als tapfere Männer
  alternative: seid mutig / seid tapfer
  rationale: Die Angesprochenen sind männliche Gefolgsleute, und der hebräische Ausdruck ist ausdrücklich maskulin. Eine rein abstrakte Wiedergabe würde die soziale und martialische Färbung des Ausgangstextes einebnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, angespannter Befehlsrede. Die hebräische Herzensmetapher wurde bewusst im Haupttext bewahrt; daher ist keine Fußnote erforderlich. Die imperativische Zuspitzung des Kontextes wird durch kurze Sätze und Ausrufezeichen hörbar gemacht.
