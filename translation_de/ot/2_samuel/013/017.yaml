base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/017.yaml
  text: Then he called his young man who served him and said[a], “Please send this one away from me, outside[b], and bolt the door behind her.”
translation:
  language: de
  text: 'Dann rief er seinen jungen Diener, der ihm diente, und sagte: »Schafft[b] doch diese da[a] von mir weg nach draußen und verriegle[c] die Tür hinter ihr!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »diese«; die feminine Form bezieht sich auf Tamar. Die Ausdrucksweise wirkt bewusst distanzierend und verächtlich.
    reason: lexical_alternative
  - marker: b
    text: 'Der erste Imperativ steht im Hebräischen im Plural: »Schafft …« Danach folgt mit »verriegle« ein Imperativ im Singular. Der Grund für diesen Numeruswechsel bleibt offen.'
    reason: source_ambiguity
  - marker: c
    text: 'Oder: »verschließe«. Das hebräische Verb kann »verriegeln«, »versperren« oder »abschließen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ מְשָׁרְתוֹ
  choice: seinen jungen Diener, der ihn bediente
  rationale: נַעַר bezeichnet hier einen jungen Mann beziehungsweise Diener; das Partizip מְשָׁרֵת beschreibt ausdrücklich seinen Dienst für Amnon. Die Wiedergabe bewahrt beide Bestandteile.
- source_word: שִׁלְחוּ נָא
  choice: Schafft doch
  rationale: שִׁלְחוּ ist ein Imperativ Plural mit dem Sinn »wegschicken/hinausschaffen«; נָא mildert oder unterstreicht die Aufforderung und wird idiomatisch mit »doch« wiedergegeben.
- source_word: זֹאת
  choice: diese da
  rationale: Das allein stehende feminine Demonstrativpronomen verweist auf Tamar, ohne sie beim Namen zu nennen. »Diese da« bewahrt im Deutschen den demonstrativen und bewusst distanzierenden, verächtlichen Ton, ohne das im Hebräischen nicht vorhandene Substantiv »Frau« einzufügen.
- source_word: מֵעָלַי
  choice: von mir weg
  rationale: Die Wendung bedeutet wörtlich etwa »von über/bei mir weg« und bezeichnet hier ihre Entfernung aus Amnons unmittelbarer Nähe.
- source_word: הַחוּצָה
  choice: nach draußen
  rationale: Die Richtungsform bezeichnet eine Bewegung hinaus; »nach draußen« gibt diese Richtung im Deutschen natürlich wieder.
- source_word: וּנְעֹל
  choice: und verriegle
  rationale: נעל kann das Verschließen, Verriegeln oder Versperren einer Tür bezeichnen. »Verriegle« passt zur antiken Türsicherung und bewahrt die nachdrückliche Handlung.
- source_word: אַחֲרֶיהָ
  choice: hinter ihr
  rationale: Bei einer Tür ist »hinter ihr« die natürliche deutsche Entsprechung von wörtlich »nach ihr«.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. »Diese da« gibt Amnons demonstrative Geringschätzung deutlich, aber ohne zusätzliche Beschimpfung wieder. Der auffällige Wechsel vom pluralischen zum singularischen Imperativ wird im Haupttext bewahrt und in einer Fußnote erklärt.
