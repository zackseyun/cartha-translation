  source_fidelity: Der Text gibt die hebräische Satzfolge und die erzählerische Rückblende zuverlässig wieder. Das Plusquamperfekt „waren ... geflohen“ ist im erklärenden Kontext angemessen; „leben dort bis zum heutigen Tag“ vermittelt die bis zur Erzählergegenwart andauernde Situation von וַיִּהְיוּ שָׁם גָּרִים gut.
