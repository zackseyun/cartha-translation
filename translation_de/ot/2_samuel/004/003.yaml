source:
  edition: WLC
  text: וַ/יִּבְרְח֥וּ הַ/בְּאֵרֹתִ֖ים גִּתָּ֑יְמָ/ה וַֽ/יִּהְיוּ שָׁ֣ם גָּרִ֔ים עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/003.yaml
  text: But the Beerothites fled to Gittaim and have lived there as sojourners to this day[a].
translation:
  language: de
  text: Doch die Beerotiter waren nach Gittajim geflohen und leben dort bis zum heutigen Tag als Fremde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und wohnen dort bis zum heutigen Tag als ansässige Fremde«.'
    reason: 'Lexikalische Alternative: גָּרִים kann den rechtlich-sozialen Status nicht einheimischer, aber ansässiger Bewohner hervorheben.'
lexical_decisions:
- source_word: וַיִּבְרְחוּ
  choice: waren … geflohen
  rationale: Das Qal-Wayyiqtol von ברח bedeutet »fliehen«. Das Plusquamperfekt kennzeichnet den Satz im Zusammenhang als erklärenden Rückblick.
- source_word: הַבְּאֵרֹתִים
  choice: die Beerotiter
  rationale: Das gentilizische Pluralwort bezeichnet die Bewohner beziehungsweise Angehörigen von Beerot; »Beerotiter« gibt die Volks- bzw. Herkunftsbezeichnung knapp wieder.
- source_word: גִּתָּיְמָה
  choice: nach Gittajim
  rationale: Der Ortsname mit direktionalem He bezeichnet eine Bewegung auf Gittajim zu; bei Ortsnamen ist im Deutschen »nach« idiomatisch.
- source_word: וַיִּהְיוּ שָׁם
  choice: leben dort
  rationale: Zusammen mit גָּרִים und »bis zum heutigen Tag« beschreibt die Wendung einen vom damaligen Geschehen bis in die Erzählgegenwart fortdauernden Aufenthalt.
- source_word: גָּרִים
  choice: als Fremde
  rationale: Das Partizip von גור bezeichnet Menschen, die außerhalb ihrer angestammten Heimat als nicht einheimische Bewohner leben. »Fremde« ist natürlich und wahrt die soziale Nuance; die Fußnote nennt die präzisere Alternative.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Die feste hebräische Zeitangabe bezeichnet das Fortbestehen eines Zustands bis zur Gegenwart des Erzählers.
- source_word: וַ
  choice: Doch
  rationale: Die Konjunktion leitet hier eine erklärende Hintergrundbemerkung mit leichtem Kontrast zum vorangehenden Vers ein.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Plusquamperfekt markiert den erklärenden Rückblick; das Präsens mit »bis zum heutigen Tag« vermittelt den bis zur Erzählgegenwart anhaltenden Zustand. Die Schreibungen »Beerotiter« und »Gittajim« orientieren sich an den hebräischen Namen.
