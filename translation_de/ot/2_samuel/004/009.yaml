  terminology: „Jahwe“, „erlöst“, „mein Leben“ und „aus jeder Not“ sind quellentreu und sprachlich passend. Die Namensformen Rechab, Baana, Rimmon und Beerot sind im deutschen Bibelgebrauch vertretbar.
