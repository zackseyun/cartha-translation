  text: וַ/יַּ֨עַן דָּוִ֜ד אֶת רֵכָ֣ב וְ/אֶת בַּעֲנָ֣ה אָחִ֗י/ו בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֵֽרֹתִ֖י וַ/יֹּ֣אמֶר לָ/הֶ֑ם חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/009.yaml
  text: But David answered Rekab and Baanah his brother[a], the sons of Rimmon the Beerothite, and said to them, “As Yahweh lives, who has redeemed my life out of every distress,
translation:
  language: de
  text: 'David aber antwortete Rechab und seinem Bruder Baana, den Söhnen Rimmons aus Beerot, und sagte zu ihnen: »So wahr Jahwe lebt, der mein Leben aus jeder Not erlöst hat:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: Die Wayyiqtol-Form von ענה führt hier Davids Erwiderung ein; die übliche deutsche Erzählformel ist natürlich und quellennah.
- source_word: רֵכָב וְאֶת־בַּעֲנָה אָחִיו
  choice: Rechab und seinem Bruder Baana
  rationale: אָחִיו ist Singular und bezeichnet Baana am natürlichsten als Rechabs Bruder. Die Namen werden nach geläufiger deutscher Bibeltransliteration wiedergegeben.
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: den Söhnen Rimmons aus Beerot
  rationale: Die Wendung nennt den Vater und kennzeichnet seine Herkunft; „aus Beerot“ ist im heutigen Deutsch verständlicher als ein substantiviertes Herkunftswort.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Diese feste deutsche Schwurformel bewahrt die feierliche Kraft der hebräischen Wendung.
- source_word: פָּדָה
  choice: erlöst hat
  rationale: פדה bezeichnet rettende Befreiung beziehungsweise Loskauf; „erlöst“ wahrt die lexikalische Tiefe und passt zu zurückliegenden Erfahrungen mit gegenwärtiger Bedeutung.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נפש meint in diesem Gefahrenkontext Davids Leben beziehungsweise seine Person, nicht speziell eine immaterielle Seele.
- source_word: מִכָּל־צָרָה
  choice: aus jeder Not
  rationale: „Not“ gibt צָרָה idiomatisch wieder; „jeder“ erhält die umfassende Bedeutung von כָּל.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ gibt ihn im Deutschen als Namen wieder, statt ihn durch einen Titel zu ersetzen; die gebräuchliche deutsche Form wird gegenüber der englischen Schreibung „Yahweh“ bevorzugt.
- issue: Bedeutungsumfang von פָּדָה
  choice: erlöst hat
  alternative: gerettet hat
  rationale: „Erlöst“ erhält den möglichen Loskauf- beziehungsweise Befreiungsaspekt, ohne hier einen bestimmten Erlösungsmechanismus in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der vorangestellte Konnektor וַ wird durch „aber“ wiedergegeben, da Davids Antwort einen deutlichen Gegensatz zur Erwartung der Täter bildet. Der Doppelpunkt am Versende lässt den im nächsten Vers fortgesetzten Schwur syntaktisch offen.
