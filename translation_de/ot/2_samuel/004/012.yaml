base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/012.yaml
  text: Then David commanded the young men[a], and they killed them and cut off their hands and their feet and hung them by the pool at Hebron. But they took the head of Ish-bosheth and buried it in the tomb of Abner at Hebron.
translation:
  language: de
  text: Darauf gab David den jungen Männern einen Befehl. Sie töteten sie, hieben ihnen Hände und Füße ab und hängten sie am Teich in Hebron auf.[a] Den Kopf Isch-Boschets aber nahmen sie und begruben ihn im Grab Abners in Hebron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über dem Teich«. Die hebräische Präposition kann hier allgemein den Ort oder eine genauere räumliche Beziehung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו דָּוִד אֶת הַנְּעָרִים
  choice: Darauf gab David den jungen Männern den Befehl
  rationale: Die fortschreitende Erzählform wird mit »Darauf« natürlich wiedergegeben. צוה bezeichnet einen verbindlichen Befehl; נְעָרִים kann junge Männer oder Diener bezeichnen. »junge Männer« bewahrt die naheliegende lexikalische Bedeutung, ohne ihre genaue Stellung festzulegen.
- source_word: וַיַּהַרְגוּם
  choice: Sie töteten die beiden
  rationale: הרג ist das gewöhnliche Verb für »töten«. Das deutsche »die beiden« macht den pluralischen Rückbezug auf Rechab und Baana aus dem Zusammenhang eindeutig, ohne zusätzliche Deutung.
- source_word: וַיְקַצְּצוּ אֶת יְדֵיהֶם וְאֶת רַגְלֵיהֶם
  choice: hieben ihnen Hände und Füße ab
  rationale: קצץ bedeutet abschneiden oder abhauen. »hieben … ab« gibt die gewaltsame Handlung präzise und in würdigem Erzählstil wieder.
- source_word: וַיִּתְלוּ עַל הַבְּרֵכָה
  choice: hängten sie am Teich … auf
  rationale: תלה bedeutet »aufhängen«. עַל kann hier eine Lage am Teich bezeichnen, lässt aber auch eine räumlich engere Wiedergabe wie »über dem Teich« zu; diese Ambiguität wird in der Fußnote erhalten.
- source_word: בְּחֶבְרוֹן
  choice: von Hebron / in Hebron
  rationale: Beim Teich bezeichnet der Ortsname dessen Lage oder Zugehörigkeit, daher natürlich »Teich von Hebron«; bei Abners Grab ist »in Hebron« die idiomatische Ortsangabe.
- source_word: וְאֵת רֹאשׁ אִישׁ בֹּשֶׁת לָקָחוּ
  choice: Den Kopf Isch-Boschets aber nahmen sie mit
  rationale: Der vorangestellte Akkusativ hebt den Kopf als neues Objekt hervor. »aber« bildet den Kontrast zur Behandlung der Leichen ab; »nahmen … mit« gibt לקח im Zusammenhang natürlich wieder.
- source_word: וַיִּקְבְּרוּ בְקֶבֶר אַבְנֵר
  choice: begruben ihn im Grab Abners
  rationale: Das im Hebräischen nicht eigens genannte Objekt ist der unmittelbar zuvor erwähnte Kopf. »Grab« ist die direkte und natürliche Wiedergabe von קֶבֶר.
theological_decisions:
- issue: Moralische und theologische Einordnung von Davids Handeln
  choice: Die Handlungen werden in ihrer Härte berichtet, ohne sie durch wertende oder ausdrücklich juristische Zusätze zu kommentieren.
  alternative: Die Tötung als »Hinrichtung« bezeichnen und damit stärker als förmlichen Rechtsakt einordnen.
  rationale: Der Vers erzählt Davids Befehl, die Tötung, Verstümmelung und öffentliche Zurschaustellung, gibt aber an dieser Stelle selbst kein ausdrückliches moralisches oder theologisches Urteil ab. Die Übersetzung soll diese Spannung nicht auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die drastischen Einzelheiten des hebräischen Textes werden weder abgeschwächt noch ausgeschmückt. Der Name אִישׁ־בֹּשֶׁת wird als »Isch-Boschet« transliteriert.
