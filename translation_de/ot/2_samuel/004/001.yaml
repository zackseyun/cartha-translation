translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählfolge wird durch „Als … hörte“ und das Plusquamperfekt klar wiedergegeben. Das markante hebräische Bild der erschlaffenden Hände bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
