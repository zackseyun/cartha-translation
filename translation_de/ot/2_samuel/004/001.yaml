  text: וַ/יִּשְׁמַ֣ע בֶּן שָׁא֗וּל כִּ֣י מֵ֤ת אַבְנֵר֙ בְּ/חֶבְר֔וֹן וַ/יִּרְפּ֖וּ יָדָ֑י/ו וְ/כָל יִשְׂרָאֵ֖ל נִבְהָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/001.yaml
  text: When Saul’s son heard that Abner had died in Hebron[a], his hands became weak, and all Israel was alarmed.
translation:
  language: de
  text: Als Sauls Sohn hörte, dass Abner in Hebron gestorben war, wurden ihm die Hände schlaff[a], und ganz Israel war bestürzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Seine Hände wurden schlaff«; eine hebräische Redewendung dafür, Kraft, Mut oder Entschlossenheit zu verlieren.'
    reason: Die Anmerkung erklärt das beibehaltene hebräische Körperbild und seine idiomatische Bedeutung.
lexical_decisions:
- source_word: בֶּן שָׁאוּל
  choice: Sauls Sohn
  rationale: Die Genitivkonstruktion bezeichnet Isch-Boschet indirekt. Die Formulierung bewahrt den Wortlaut, ohne den in diesem Vers nicht genannten Eigennamen einzufügen.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt dessen ein, was Sauls Sohn hörte.
- source_word: מֵת
  choice: gestorben war
  rationale: Das Qal Perfekt bezeichnet einen bereits eingetretenen Tod; das deutsche Plusquamperfekt gibt die zeitliche Abfolge gegenüber dem Hören natürlich wieder.
- source_word: בְּחֶבְרוֹן
  choice: in Hebron
  rationale: Die Präposition בְּ wird mit dem Ortsnamen in ihrer üblichen lokalen Bedeutung wiedergegeben.
- source_word: וַיִּרְפּוּ יָדָיו
  choice: wurden ihm die Hände schlaff
  rationale: Die Übersetzung erhält das hebräische Körperbild und lässt zugleich den idiomatischen Sinn eines Verlusts an Kraft, Mut oder Entschlossenheit erkennen.
- source_word: כָל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Die kollektive nationale Bezeichnung des Hebräischen bleibt erhalten.
- source_word: נִבְהָלוּ
  choice: war bestürzt
  rationale: Das Verb bezeichnet einen Zustand von Bestürzung, Beunruhigung oder Schrecken. „War bestürzt“ passt natürlich zum kollektiven Subjekt „ganz Israel“, ohne die Intensität unnötig festzulegen.
