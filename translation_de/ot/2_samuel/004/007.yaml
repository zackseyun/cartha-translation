  text: וַ/יָּבֹ֣אוּ הַ/בַּ֗יִת וְ/הֽוּא שֹׁכֵ֤ב עַל מִטָּת/וֹ֙ בַּ/חֲדַ֣ר מִשְׁכָּב֔/וֹ וַ/יַּכֻּ֨/הוּ֙ וַ/יְמִתֻ֔/הוּ וַ/יָּסִ֖ירוּ אֶת רֹאשׁ֑/וֹ וַ/יִּקְחוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יֵּֽלְכ֛וּ דֶּ֥רֶךְ הָ/עֲרָבָ֖ה כָּל הַ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/007.yaml
  text: They came into the house while he was lying on his bed in his bedroom[a], and they struck him and put him to death. Then they removed his head, took his head[c][b], and went by way of the Arabah all night.
translation:
  language: de
  text: Sie kamen in das Haus, während er auf seinem Bett in seinem Schlafzimmer[a] lag. Sie schlugen ihn und töteten ihn. Dann nahmen sie ihm den Kopf ab, nahmen seinen Kopf mit und gingen die ganze Nacht hindurch auf dem Weg durch die Araba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in der Kammer, in der er schlief“.'
    reason: lexical_alternative
  - marker: b
    text: Die Araba ist die Senke beziehungsweise Ebene des Jordangrabens; im Hebräischen steht eine geografische Bezeichnung.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ הַבַּיִת
  choice: Sie kamen in das Haus
  rationale: בוא mit הַבַּיִת bezeichnet hier das Hineinkommen in das Haus. Die Wiedergabe folgt der erzählerischen Bewegung des Hebräischen.
- source_word: וְהוּא שֹׁכֵב עַל מִטָּתוֹ
  choice: während er auf seinem Bett lag
  rationale: Die Nominalkonstruktion ist als begleitender Umstand zu verstehen; „während“ gibt diesen zeitlichen Zusammenhang in natürlichem Deutsch wieder.
- source_word: בַּחֲדַר מִשְׁכָּבוֹ
  choice: in seinem Schlafzimmer
  rationale: Die Wendung bezeichnet wörtlich den Raum seines Liegens beziehungsweise Schlafens. „Schlafzimmer“ ist die klare, heutige Entsprechung.
- source_word: וַיַּכֻּהוּ וַיְמִתֻהוּ
  choice: Sie schlugen ihn und töteten ihn
  rationale: 'Die beiden hebräischen Verben bleiben getrennt erhalten: zuerst das Schlagen, dann das ausdrückliche Töten. Dadurch wird keines der beiden Verben in das andere eingelesen.'
- source_word: וַיָּסִירוּ אֶת רֹאשׁוֹ
  choice: Dann nahmen sie ihm den Kopf ab
  rationale: Das Hifil von סור bedeutet „entfernen, wegnehmen“. Im Zusammenhang bezeichnet es die Enthauptung; „den Kopf abnehmen“ bleibt näher am Bild des Entfernens als das instrumentell konkretere „abschneiden“.
- source_word: וַיִּקְחוּ אֶת רֹאשׁוֹ
  choice: nahmen seinen Kopf mit
  rationale: לקח bedeutet „nehmen“. Das ergänzte „mit“ macht im Deutschen deutlich, dass sie den abgetrennten Kopf forttrugen, und bewahrt zugleich die auffällige Wiederholung von „Kopf“.
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: gingen auf dem Weg durch die Araba
  rationale: דֶּרֶךְ bezeichnet Weg oder Route; Araba wird als geografische Bezeichnung transliteriert. Die Formulierung lässt offen, ob vor allem eine bestimmte Route oder der Weg durch die Region gemeint ist.
- source_word: כָּל הַלָּיְלָה
  choice: die ganze Nacht hindurch
  rationale: Dies ist eine natürliche deutsche Wiedergabe der Zeitangabe und betont die ununterbrochene Dauer.
