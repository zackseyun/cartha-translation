base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/010.yaml
  text: When someone told me[a], saying, ‘Look, Saul is dead,’ and he thought he was bringing good news in his own eyes[b], I seized him and killed him in Ziklag—that was the reward I gave him for his news.
translation:
  language: de
  text: 'Denn als mir einer meldete: »Sieh, Saul ist tot!«, meinte er, gute Nachricht zu bringen.[a] Da packte ich ihn und tötete ihn in Ziklag – das war der Lohn, den ich ihm für seine Nachricht gab.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und er war in seinen Augen wie einer, der gute Nachricht bringt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Schlusswendung ist im Hebräischen verkürzt und ironisch. Gemeint ist: Statt des erwarteten Botenlohns erhielt der Mann den Tod als seinen »Lohn« für die Nachricht.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn als
  rationale: כִּי führt hier den begründenden Rückblick auf einen konkreten Fall ein. »Denn als« gibt sowohl den Anschluss an den Kontext als auch den zeitlichen Rahmen natürlich wieder.
- source_word: הַמַּגִּיד לִי לֵאמֹר
  choice: mir einer meldete
  rationale: Der substantivierte Partizipialausdruck bezeichnet »den, der mir berichtete«. Die deutsche Formulierung ist idiomatisch und bewahrt die Funktion einer Meldung.
- source_word: הִנֵּה מֵת שָׁאוּל
  choice: »Sieh, Saul ist tot!«
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf die Meldung; »Sieh« ist gegenwärtig und würdig. מֵת bezeichnet hier den eingetretenen Todeszustand.
- source_word: וְהוּא הָיָה כִמְבַשֵּׂר בְּעֵינָיו
  choice: hielt er sich selbst für einen Überbringer guter Nachricht
  rationale: בְּעֵינָיו bezeichnet seine eigene Einschätzung, während כִמְבַשֵּׂר ihn als vermeintlichen Freudenboten kennzeichnet. Die Wiedergabe macht diese Perspektive verständlich, ohne sie als Davids Urteil auszugeben.
- source_word: וָאֹחֲזָה בוֹ
  choice: Doch ich packte ihn
  rationale: אָחַז bezeichnet kräftiges Ergreifen oder Festhalten. »packte« ist direkt und bildet den scharfen Gegensatz zur Erwartung des Boten ab.
- source_word: וָאֶהְרְגֵהוּ
  choice: und tötete ihn
  rationale: Die Form bezeichnet schlicht das Töten; die Übersetzung fügt keine im Verb nicht ausdrücklich enthaltene gerichtliche Wertung hinzu.
- source_word: בְּצִקְלָג
  choice: in Ziklag
  rationale: Der Ortsname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: אֲשֶׁר לְתִתִּי לוֹ בְּשֹׂרָה
  choice: Das war der Lohn, den ich ihm für seine Nachricht gab
  rationale: 'Die hebräische Schlusswendung ist verkürzt und ironisch. בְּשֹׂרָה kann die gute Nachricht beziehungsweise den dafür erwarteten Botenlohn bezeichnen. Die Formulierung erhält die bittere Umkehrung: Statt einer Belohnung erhielt der Bote den Tod.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; »Überbringer guter Nachricht« wahrt die Bildsprache, während die zweite Fußnote die im Hebräischen elliptische Ironie erläutert.
