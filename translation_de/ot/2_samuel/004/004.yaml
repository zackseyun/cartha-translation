  text: וְ/לִ/יהֽוֹנָתָן֙ בֶּן שָׁא֔וּל בֵּ֖ן נְכֵ֣ה רַגְלָ֑יִם בֶּן חָמֵ֣שׁ שָׁנִ֣ים הָיָ֡ה בְּ/בֹ֣א שְׁמֻעַת֩ שָׁא֨וּל וִ/יהֽוֹנָתָ֜ן מִֽ/יִּזְרְעֶ֗אל וַ/תִּשָּׂאֵ֤/הוּ אֹֽמַנְתּ/וֹ֙ וַ/תָּנֹ֔ס וַ/יְהִ֞י בְּ/חָפְזָ֥/הּ לָ/נ֛וּס וַ/יִּפֹּ֥ל וַ/יִּפָּסֵ֖חַ וּ/שְׁמ֥/וֹ מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/004.yaml
  text: Jonathan son of Saul had a son crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel[a], and his nurse picked him up and fled. And as she hurried to flee, he fell and became lame. His name was Mephibosheth.
translation:
  language: de
  text: Jonatan, der Sohn Sauls, hatte einen Sohn, der an beiden Füßen lahm war.[a] Er war fünf Jahre alt, als die Nachricht über Saul und Jonatan aus Jesreel kam. Da nahm seine Betreuerin ihn auf und floh. Als sie in ihrer Eile floh, fiel er hin und wurde lahm. Sein Name war Mefi-Boschet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an den Füßen lahm“. Wörtlich: „an den Füßen getroffen/geschlagen“; der hebräische Dual kann sich auf beide Füße beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכֵה רַגְלָיִם
  choice: an beiden Füßen gelähmt
  rationale: Die Wendung bezeichnet eine Beeinträchtigung der Füße; der Dual רַגְלָיִם legt beide Füße nahe. Die Formulierung ist im modernen Deutschen klar und respektvoll.
- source_word: בֶּן חָמֵשׁ שָׁנִים
  choice: fünf Jahre alt
  rationale: Natürliche deutsche Altersangabe mit genauer Wiedergabe des Sinnes.
- source_word: בְּבֹא שְׁמֻעַת שָׁאוּל וִיהוֹנָתָן
  choice: als die Nachricht über Saul und Jonatan ... kam
  rationale: Gibt die temporale Konstruktion idiomatisch wieder, ohne den Inhalt der Nachricht über Tod und Niederlage hinausgehend auszudeuten.
- source_word: מִיִּזְרְעֶאל
  choice: aus Jesreel
  rationale: Direkte und natürliche Wiedergabe der Herkunftsangabe.
- source_word: אֹמַנְתּוֹ
  choice: seine Pflegerin
  rationale: Bezeichnet die Frau, die das Kind versorgte und aufzog; „Pflegerin“ ist hier verständlicher als das im Deutschen missverständliche „Amme“, ohne zwingend Stillen vorauszusetzen.
- source_word: וַתִּשָּׂאֵהוּ
  choice: nahm ... ihn auf
  rationale: Das Verb bezeichnet das Aufheben beziehungsweise Tragen des Kindes; die Formulierung passt natürlich zur unmittelbar folgenden Flucht.
- source_word: וַתָּנֹס
  choice: floh
  rationale: Knappes, übliches Äquivalent für die Fluchtbewegung.
- source_word: בְּחָפְזָהּ לָנוּס
  choice: in ihrer Eile auf der Flucht
  rationale: Bewahrt sowohl die Eile als auch den Zusammenhang mit dem Fliehen in natürlichem Deutsch.
- source_word: וַיִּפֹּל
  choice: fiel er hin
  rationale: Das maskuline Verb weist auf das Kind als Subjekt; „hinfallen“ ist im Deutschen für diesen Vorgang idiomatisch.
- source_word: וַיִּפָּסֵחַ
  choice: wurde gelähmt
  rationale: Drückt den infolge des Sturzes eingetretenen Zustand aus, ohne über Art oder medizinischen Umfang der Schädigung zu spekulieren.
- source_word: מְפִיבֹשֶׁת
  choice: Mefi-Boschet
  rationale: Gebräuchliche deutsche Umschrift, die die Bestandteile des hebräischen Namens erkennbar wiedergibt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Ein nicht ausdrücklich vorhandenes einleitendes „Nun“ wurde vermieden. Die überwiegend parataktische hebräische Erzählweise wurde behutsam in natürliches Deutsch übertragen; „Doch“ macht den unglücklichen Umschlag verständlich, ohne zusätzliche Sachinformation einzuführen.
