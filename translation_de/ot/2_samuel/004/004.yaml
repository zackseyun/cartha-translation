  to: Jonatan, der Sohn Sauls, hatte einen Sohn, der an beiden Füßen lahm war.[a] Er war fünf Jahre alt, als die Nachricht über Saul und Jonatan aus Jesreel kam. Da nahm seine Betreuerin ihn auf und floh. Als sie in ihrer Eile floh, fiel er hin und wurde lahm. Sein Name war Mefi-Boschet.
