  naturalness: Der Text ist flüssiges modernes Standarddeutsch. „Pflegerin“ kann heute allerdings eine beruflich-medizinische Rolle nahelegen; „Betreuerin“ ist hier neutraler. Die Verbindung mit „Doch“ ist stärker adversativ als das einfache hebräische Erzählanschlusswort; eine temporale Wiedergabe ist genauer und natürlicher.
  terminology: „lahm“ entspricht dem hebräischen Wortfeld präziser als „gelähmt“, das im Deutschen häufig eine weitergehende, medizinisch bestimmte Paralyse bezeichnet. „Mefi-Boschet“ ist eine etablierte deutsche Namensform.
