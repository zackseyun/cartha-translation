  text: וְ֠/הֵנָּה בָּ֜אוּ עַד תּ֤וֹךְ הַ/בַּ֨יִת֙ לֹקְחֵ֣י חִטִּ֔ים וַ/יַּכֻּ֖/הוּ אֶל הַ/חֹ֑מֶשׁ וְ/רֵכָ֛ב וּ/בַעֲנָ֥ה אָחִ֖י/ו נִמְלָֽטוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/006.yaml
  text: And there they came into the midst of the house[a], taking wheat, and they struck him in the belly. Then Rekab and Baanah his brother escaped.
translation:
  language: de
  text: Und dort kamen sie bis ins Innere des Hauses, um Weizen zu holen. Sie schlugen ihn in den Bauch[a]. Dann entkamen Rechab und sein Bruder Baana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „unter die fünfte Rippe“. Der hebräische Ausdruck bezeichnet wahrscheinlich allgemeiner den Bauch oder Unterleib.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנָּה
  choice: Und dort
  rationale: Die deiktische Wendung führt die Handlung am genannten Ort weiter. „Und dort“ ist natürliches modernes Deutsch und vermeidet das altertümliche „siehe“.
- source_word: בָּאוּ עַד תּוֹךְ הַבַּיִת
  choice: kamen sie bis ins Innere des Hauses
  rationale: עַד תּוֹךְ bezeichnet das Vordringen bis in den Innenbereich. Die Formulierung bleibt eng an der räumlichen Aussage des Hebräischen.
- source_word: לֹקְחֵי חִטִּים
  choice: um Weizen zu holen
  rationale: Die knappe Partizipialwendung bezeichnet sie als Weizenholende beziehungsweise nennt den mit ihrem Eintritt verbundenen Zweck. Die Wiedergabe lässt offen, ob dies ihr tatsächliches Vorhaben oder nur ein Vorwand war, und fügt daher kein ausdrückliches „als ob“ hinzu.
- source_word: וַיַּכֻּהוּ
  choice: Sie schlugen ihn
  rationale: נכה bedeutet hier zunächst „schlagen/treffen“. Obwohl der Zusammenhang einen tödlichen Angriff beschreibt, wird das Verb nicht vorschnell mit „töten“ oder ausdrücklich mit „erstechen“ wiedergegeben.
- source_word: אֶל הַחֹמֶשׁ
  choice: in den Bauch
  rationale: חֹמֶשׁ bezeichnet wahrscheinlich die Bauch- oder Unterleibsgegend. Die traditionelle Deutung als Stelle unter der fünften Rippe wird in einer Fußnote genannt.
- source_word: וְרֵכָב וּבַעֲנָה אָחִיו
  choice: Dann entkamen Rekab und sein Bruder Baana
  rationale: Die Konjunktion wird zur natürlichen Kennzeichnung der Handlungsfolge mit „Dann“ wiedergegeben; אָחִיו wird idiomatisch auf Rekab bezogen.
- source_word: נִמְלָטוּ
  choice: entkamen
  rationale: Der Niphal von מלט bezeichnet das erfolgreiche Entkommen und wird knapp und idiomatisch übersetzt.
