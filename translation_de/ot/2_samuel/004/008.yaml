source:
  edition: WLC
  text: וַ֠/יָּבִאוּ אֶת רֹ֨אשׁ אִֽישׁ בֹּ֥שֶׁת אֶל דָּוִד֮ חֶבְרוֹן֒ וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּֽה רֹ֣אשׁ אִֽישׁ בֹּ֗שֶׁת בֶּן שָׁאוּל֙ אֹֽיִבְ/ךָ֔ אֲשֶׁ֥ר בִּקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וַ/יִּתֵּ֣ן יְ֠הוָה לַֽ/אדֹנִ֨/י הַ/מֶּ֤לֶךְ נְקָמוֹת֙ הַ/יּ֣וֹם הַ/זֶּ֔ה מִ/שָּׁא֖וּל וּ/מִ/זַּרְעֽ/וֹ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/008.yaml
  text: They brought the head of Ish-bosheth to David at Hebron[a], and said to the king, “Here is the head of Ish-bosheth son of Saul, your enemy, who sought your life. Yahweh has given my lord the king vengeance today on Saul and on his offspring.”
translation:
  language: de
  text: 'Sie brachten David in Hebron den Kopf Isch-Boschets und sagten zum König: »Hier ist der Kopf Isch-Boschets, des Sohnes Sauls, deines Feindes, der dir nach dem Leben trachtete. Jahwe hat meinem Herrn, dem König, heute Rache[a] an Saul und seinen Nachkommen gewährt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen der Plural »Rachetaten« beziehungsweise »Racheakte«; er kann hier verstärkend gebraucht sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Sie brachten
  rationale: Das Wayyiqtol führt die Erzählung fort. Im natürlichen deutschen Erzählstil muss das einleitende ו nicht eigens mit »und« wiedergegeben werden.
- source_word: רֹאשׁ
  choice: Kopf
  rationale: Gemeint ist hier eindeutig der abgetrennte menschliche Kopf; eine bildliche Wiedergabe wäre nicht sachgerecht.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isch-Boschet
  rationale: Die Umschrift folgt der masoretischen Namensform des Verses und ersetzt sie nicht durch die verwandte Form Eschbaal.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: הִנֵּה
  choice: Hier ist
  rationale: Die präsentierende und hinweisende Funktion wird in modernem Deutsch natürlich wiedergegeben, ohne das altertümliche »siehe«.
- source_word: אֹיִבְךָ
  choice: deines Feindes
  rationale: Direkte Wiedergabe des Nomens mit dem Suffix der zweiten Person Singular; der Genitiv fügt sich in die Apposition ein.
- source_word: בִּקֵּשׁ אֶת נַפְשֶׁךָ
  choice: der dir nach dem Leben trachtete
  rationale: Die hebräische Wendung bezeichnet den Versuch, jemandem das Leben zu nehmen. Die deutsche Redewendung bewahrt sowohl den Sinn als auch die bildhafte Form.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: meinem Herrn, dem König
  rationale: Die höfische Anrede samt Suffix der ersten Person Singular bleibt erhalten; »Herr« bezeichnet hier den menschlichen König.
- source_word: נְקָמוֹת
  choice: Rache
  rationale: Das hebräische Wort steht im Plural, kann hier aber intensiv beziehungsweise als Bezeichnung von Racheakten gebraucht sein. Der deutsche Singular ist im Satz idiomatisch; der Formunterschied wird in einer Fußnote kenntlich gemacht.
- source_word: מִשָּׁאוּל וּמִזַּרְעוֹ
  choice: an Saul und seinen Nachkommen
  rationale: Die Präposition wird bei »Rache an jemandem« idiomatisch mit »an« wiedergegeben. זֶרַע ist ein kollektiver Ausdruck für die Nachkommenschaft.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Umschrift »Jahwe« wahrt seinen Charakter als Eigenname.
- issue: Bewertung der Behauptung, Jahwe habe dem König Rache gewährt
  choice: Die Aussage bleibt ohne wertenden Zusatz als direkte Rede der Mörder stehen.
  alternative: Durch Zusätze wie »angeblich« eine Distanzierung ausdrücken.
  rationale: Der Vers kennzeichnet die Behauptung als Rede der Männer, bestätigt sie aber nicht ausdrücklich durch den Erzähler. Eine theologische Bewertung darf daher nicht in die Übersetzung eingefügt werden; Davids Reaktion ergibt sich aus dem folgenden Kontext.
- issue: Bezug von אֹיִבְךָ und אֲשֶׁר בִּקֵּשׁ אֶת נַפְשֶׁךָ
  choice: Beide Bezeichnungen werden grammatisch auf Isch-Boschet bezogen.
  alternative: Die Aussage inhaltlich auf Saul umdeuten.
  rationale: Syntax und Wortlaut stellen Isch-Boschet als »deinen Feind, der dir nach dem Leben trachtete« dar. Auch wenn die Charakterisierung aus dem Mund der Mörder fragwürdig sein kann, darf sie nicht stillschweigend korrigiert werden.
translation_notes:
  register: Moderner, würdiger deutscher Erzählstil. Die direkte Rede bleibt höfisch, aber verständlich. »Isch-Boschet« folgt der hebräischen Namensform; »nach dem Leben trachten« bewahrt die hebräische Redeweise in geläufigem Deutsch. Der Fußnotenmarker steht unmittelbar bei »Rache«, also bei dem tatsächlich erläuterten Ausdruck.
