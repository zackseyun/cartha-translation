base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/005.yaml
  text: The sons of Rimmon the Beerothite[a], Rekab and Baanah, went and came to the house of Ish-bosheth in the heat of the day[b], while he was lying down for his midday rest.
translation:
  language: de
  text: Die Söhne Rimmons aus Beerot, Rechab und Baana, machten sich auf und kamen in der Mittagshitze zum Haus Isch-Boschets, während er gerade zur Mittagsruhe lag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Liegen des Mittags«, also eine Ruhezeit am Mittag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: Die Söhne Rimmons aus Beerot
  rationale: בְּנֵי bezeichnet hier am natürlichsten die leiblichen Söhne; הַבְּאֵרֹתִי ist eine Herkunftsbezeichnung und wird im Deutschen idiomatisch mit »aus Beerot« wiedergegeben.
- source_word: רֵכָב וּבַעֲנָה
  choice: Rechab und Baana
  rationale: Die Namensformen folgen geläufigen deutschen Bibelkonventionen und bilden die hebräischen Namen erkennbar ab.
- source_word: וַיֵּלְכוּ
  choice: machten sich auf
  rationale: Die Wendung gibt den Beginn der Bewegung natürlich wieder und bewahrt zusammen mit וַיָּבֹאוּ die zweistufige Erzählfolge.
- source_word: וַיָּבֹאוּ
  choice: kamen
  rationale: בוא mit אֶל bezeichnet hier das Gelangen zum Haus; »kamen … zum Haus« ist quellennah und idiomatisch.
- source_word: כְּחֹם הַיּוֹם
  choice: in der Mittagshitze
  rationale: Die Formulierung bezeichnet die heiße Tageszeit. Der folgende ausdrückliche Bezug auf die Mittagsruhe stützt die zeitliche Präzisierung, ohne lediglich »um die Mittagszeit« zu sagen.
- source_word: בֵּית אִישׁ־בֹּשֶׁת
  choice: zum Haus Isch-Boschets
  rationale: Die hebräische Genitivverbindung wird als natürlicher deutscher Genitiv wiedergegeben; der Eigenname wird transliteriert.
- source_word: וְהוּא שֹׁכֵב
  choice: Er hielt gerade
  rationale: Die Partizipialkonstruktion beschreibt Isch-Boschets gleichzeitigen Zustand; »gerade« verdeutlicht diesen Umstand im modernen Deutsch.
- source_word: אֵת מִשְׁכַּב הַצָּהֳרָיִם
  choice: seine Mittagsruhe
  rationale: Wörtlich handelt es sich um das »Liegen des Mittags«. »Mittagsruhe halten« gibt den Sinn würdig und idiomatisch wieder, ohne den Text auf einen kurzen Schlaf festzulegen.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Die doppelte Bewegungsfolge des Hebräischen bleibt durch »machten sich auf und kamen« erhalten. Die Fußnote bewahrt die ungewöhnliche wörtliche Ausdrucksweise der Schlusswendung.
