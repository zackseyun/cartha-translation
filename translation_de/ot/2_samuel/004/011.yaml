base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/011.yaml
  text: How much more[a], when wicked men have killed a righteous man in his own house on his bed[b], should I not now require his blood from your hand and purge you from the land?
translation:
  language: de
  text: Um wie viel mehr, wenn gottlose Männer einen gerechten Mann in seinem eigenen Haus auf seinem Bett getötet haben! Sollte ich nun nicht sein Blut von eurer Hand fordern[a] und euch aus dem Land beseitigen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: euch für seinen Tod zur Rechenschaft ziehen. Wörtlich: „sein Blut von eurer Hand fordern“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die richterliche Beseitigung der Mörder aus dem Land, hier durch ihre Hinrichtung.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: Wie viel mehr gilt das jetzt, da
  rationale: Die Wendung führt im Zusammenhang den Schluss vom geringeren Fall in Vers 10 auf den schwerwiegenderen Fall ein. Die deutsche Formulierung gibt diesen Erst-recht-Schluss natürlich wieder.
- source_word: אֲנָשִׁים רְשָׁעִים
  choice: gottlose Männer
  rationale: Die Wiedergabe bewahrt das klare moralische Urteil des hebräischen Ausdrucks; „gottlos“ ist hier würdig und im biblischen Erzählstil verständlich.
- source_word: הָרְגוּ
  choice: getötet haben
  rationale: Das Verb bezeichnet grundsätzlich das Töten. Obwohl der Zusammenhang eindeutig einen Mord schildert, wird diese rechtliche Präzisierung nicht in das allgemeinere hebräische Verb hineingelesen.
- source_word: אִישׁ צַדִּיק
  choice: einen gerechten Mann
  rationale: „Gerecht“ entspricht dem gewöhnlichen Bedeutungsbereich von צַדִּיק und lässt offen, ob hier umfassende Rechtschaffenheit oder besonders die Unschuld hinsichtlich dieser Tötung gemeint ist.
- source_word: בְּבֵיתוֹ עַל מִשְׁכָּבוֹ
  choice: in seinem eigenen Haus auf seinem Bett
  rationale: Die konkrete Szene und die Schutzlosigkeit des Opfers werden eng am Hebräischen wiedergegeben. „Eigenen“ verdeutlicht idiomatisch den Besitzbezug, ohne zusätzliche Information einzuführen.
- source_word: הֲלוֹא אֲבַקֵּשׁ אֶת דָּמוֹ מִיֶּדְכֶם
  choice: Sollte ich nicht sein Blut von eurer Hand fordern
  rationale: Die konkrete hebräische Rechts- und Verantwortungsformel bleibt erhalten. Das deutsche „eurer“ entspricht der Anrede an mehrere Personen, während „Hand“ wie im Hebräischen kollektiv im Singular steht.
- source_word: וּבִעַרְתִּי אֶתְכֶם מִן הָאָרֶץ
  choice: und euch aus dem Land wegschaffen
  rationale: Im Kontext bezeichnet בער die richterliche Beseitigung der Täter. „Wegschaffen“ ist klarer und natürlicher als ein im Deutschen potenziell rituell verstandenes „reinigen“, ohne die gerichtliche Schärfe zu verlieren.
theological_decisions:
- issue: Davids Forderung nach dem Blut des Getöteten
  choice: Das Blut-von-der-Hand-Fordern als konkrete Rechtsformel beibehalten
  alternative: euch für seinen Tod zur Rechenschaft ziehen / sein Blut rächen
  rationale: Die Bildsprache des hebräischen Textes verbindet Blutvergießen, Verantwortung und gerichtliche Ahndung. Eine rein deutende Wiedergabe würde diese alttestamentliche Rechtssprache verflachen oder sie auf persönliche Rache verengen.
- issue: Bedeutung des Wegschaffens aus dem Land
  choice: Als richterliche Entfernung formulieren
  alternative: euch aus dem Land tilgen / euch aus dem Land ausrotten
  rationale: Der Zusammenhang weist auf die Hinrichtung der Mörder, doch die Übersetzung übernimmt nicht unnötig eine noch spezifischere Tötungsformel als das hebräische Verb selbst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter hebräischer Rechtsbildsprache. Der Ausruf im ersten Satz macht den Erst-recht-Schluss verständlich; die anschließende rhetorische Frage folgt der Satzbewegung des Ausgangstextes.
