source:
  edition: WLC
  text: וּ/שְׁנֵ֣י אֲנָשִׁ֣ים שָׂרֵֽי גְדוּדִ֣ים הָי֪וּ בֶן שָׁא֟וּל שֵׁם֩ הָ/אֶחָ֨ד בַּֽעֲנָ֜ה וְ/שֵׁ֧ם הַ/שֵּׁנִ֣י רֵכָ֗ב בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֶֽרֹתִ֖י מִ/בְּנֵ֣י בִנְיָמִ֑ן כִּ֚י גַּם בְּאֵר֔וֹת תֵּחָשֵׁ֖ב עַל בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/002.yaml
  text: 'Saul’s son had two men who were commanders of raiding bands: the name of the one was Baanah[a], and the name of the second was Rechab, sons of Rimmon the Beerothite, from the sons of Benjamin; for Beeroth also was considered part of Benjamin.'
translation:
  language: de
  text: Sauls Sohn hatte zwei Männer als Anführer von Streifscharen. Der eine hieß Baana, der andere Rechab. Sie waren die Söhne Rimmons, eines Beerotiters, und gehörten zu den Nachkommen Benjamins; denn auch Beerot wurde Benjamin zugerechnet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »galt als zu Benjamin gehörig«.'
    reason: Lexikalische Alternative für תֵּחָשֵׁב עַל בִּנְיָמִן; die Wendung kann als Zurechnung oder als geltende Zugehörigkeit ausgedrückt werden.
lexical_decisions:
- source_word: שָׂרֵי גְדוּדִים
  choice: Anführer von Streifscharen
  rationale: שָׂרֵי bezeichnet Anführer oder Befehlshaber; גְדוּדִים meint hier am ehesten bewaffnete, für Streifzüge eingesetzte Scharen und nicht zwingend reguläre Truppenteile.
- source_word: בֶן שָׁאוּל
  choice: Sauls Sohn
  rationale: Die singularische Bezeichnung verweist im Zusammenhang auf Isch-Boschet; die deutsche Genitivfügung ist natürlich und hält den Bezug des Hebräischen offen genug für den Kontext.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: Der eine hieß ... der andere ...
  rationale: Gibt die hebräische Benennungsformel in natürlichem modernem Deutsch wieder, ohne ihren paarweisen Aufbau zu verlieren.
- source_word: בְּנֵי רִמּוֹן הַבְּאֶרֹתִי
  choice: Söhne Rimmons aus Beerot
  rationale: Bewahrt die Abstammungsangabe; das Gentiliz wird im Deutschen verständlich und natürlich als Herkunftsangabe wiedergegeben.
- source_word: מִבְּנֵי בִנְיָמִן
  choice: gehörten zu den Nachkommen Benjamins
  rationale: Die hebräische Stammesformel »von den Söhnen Benjamins« bezeichnet hier die Zugehörigkeit zum Stamm Benjamin; »Nachkommen« ist idiomatisch und wahrt die Abstammungssprache.
- source_word: תֵּחָשֵׁב עַל בִּנְיָמִן
  choice: wurde Benjamin zugerechnet
  rationale: Der Niphal von חשׁב bezeichnet das Angerechnet- oder Zugeordnetwerden; zusammen mit עַל geht es um Beerots politische beziehungsweise stammesmäßige Zuordnung zu Benjamin.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die langen hebräischen Nominalketten werden zur Lesbarkeit auf drei Sätze verteilt. Das anfängliche ו wird nicht mechanisch mit »Nun« wiedergegeben; sein fortführender Erzählwert ergibt sich aus dem Zusammenhang.
