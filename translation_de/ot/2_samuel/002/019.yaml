  text: Asahel pursued Abner[a], and he did not turn to the right or to the left from following Abner.
translation:
  language: de
  text: Asaël verfolgte Abner und wich, während er ihm folgte, weder nach rechts noch nach links ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: verfolgte
  rationale: רדף bezeichnet eine aktive, anhaltende Verfolgung; „verfolgte“ ist im deutschen Erzählstil natürlich und präzise.
- source_word: אַחֲרֵי אַבְנֵר
  choice: Abner
  rationale: Bei „jemanden verfolgen“ steht das Ziel der Verfolgung im Deutschen direkt als Akkusativobjekt; die hebräische Präposition wird daher nicht eigens wiedergegeben.
- source_word: וְלֹא נָטָה
  choice: wich … nicht … ab
  rationale: נטה bezeichnet hier das Abweichen von einer eingeschlagenen Richtung. Die Wendung verbindet sich idiomatisch mit der nachfolgenden Richtungsangabe.
- source_word: לָלֶכֶת
  choice: davon ab
  rationale: Der Infinitiv gehört zur Konstruktion des Abweichens im Gehen beziehungsweise Verfolgen. Im Deutschen wird diese Beziehung natürlich durch „davon ab, … zu folgen“ ausgedrückt, ohne ein zusätzliches „während er ging“ einzuführen.
- source_word: עַל הַיָּמִין וְעַל הַשְּׂמֹאול
  choice: weder nach rechts noch nach links
  rationale: Die feste Richtungsformel wird klar und bildnah wiedergegeben; wegen der Verneinung ist „weder … noch“ idiomatisches Deutsch.
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: davon ab, Abner zu folgen
  rationale: Wörtlich steht „von hinter Abner her“. Gemeint ist, dass Asaël die unmittelbare Verfolgung nicht unterbrach oder seitlich verließ.
- source_word: עֲשָׂהאֵל / אַבְנֵר
  choice: Asaël / Abner
  rationale: Die Personennamen folgen den im modernen deutschen Bibelgebrauch geläufigen Formen.
