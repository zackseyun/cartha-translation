base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/023.yaml
  text: But he refused to turn aside[a], so Abner struck him in the belly with the butt end of the spear, and the spear came out behind him; and he fell there and died on the spot. And everyone who came to the place where Asahel had fallen and died stood still.
translation:
  language: de
  text: Doch er weigerte sich auszuweichen. Da stieß Abner ihm das hintere Ende des Speeres in den Bauch[a], und der Speer trat hinter ihm heraus. Asaël fiel dort hin und starb auf der Stelle. Jeder, der an die Stelle kam, an der Asaël gefallen und gestorben war, blieb stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort חֹמֶשׁ bezeichnet hier einen Körperbereich, lässt sich aber nicht sicher bestimmen. Traditionell wird es mit „fünfte Rippe“ wiedergegeben; wahrscheinlich ist allgemeiner der Bauch- oder Unterleibsbereich gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן לָסוּר
  choice: Doch er weigerte sich auszuweichen
  rationale: מאן bezeichnet eine bewusste Weigerung; סור meint hier, von der Verfolgung abzulassen beziehungsweise aus Abners Weg zu gehen. „Auszuweichen“ bewahrt die konkrete Bewegung und passt natürlich in den Zusammenhang.
- source_word: וַיַּכֵּהוּ
  choice: Da stieß Abner ihm … in den Bauch
  rationale: נכה bedeutet allgemein „schlagen/treffen“. Da der Speer den Körper durchdringt, gibt „stieß“ den konkreten Vorgang im Deutschen klarer wieder, ohne eine zusätzliche Waffe oder Bewegung einzuführen.
- source_word: בְּאַחֲרֵי הַחֲנִית
  choice: mit dem hinteren Ende des Speeres
  rationale: Die Wendung bezeichnet den hinteren Teil des Speeres. „Hinteres Ende“ ist im Deutschen verständlich und bleibt näher am Hebräischen als eine technischere Festlegung wie „Speerschaft“ oder „Schaftende“.
- source_word: אֶל הַחֹמֶשׁ
  choice: in den Bauch
  rationale: חֹמֶשׁ ist hier eine unsichere anatomische Bezeichnung. „Bauch“ gibt den wahrscheinlich gemeinten Körperbereich natürlich wieder; die traditionelle Wiedergabe „fünfte Rippe“ wird in der Fußnote genannt.
- source_word: וַתֵּצֵא הַחֲנִית מֵאַחֲרָיו
  choice: sodass der Speer hinten wieder herauskam
  rationale: Die Formulierung bewahrt die Aussage, dass der Speer den Körper durchdrang und auf der Rückseite austrat. „Sodass“ macht den engen Folgezusammenhang im Deutschen deutlich.
- source_word: וַיִּפָּל שָׁם וַיָּמָת תַּחְתָּו
  choice: Asaël fiel dort hin und starb auf der Stelle
  rationale: '„Auf der Stelle“ gibt die idiomatische Bedeutung von תחתיו wieder: Er starb unmittelbar dort, wo er niedergestürzt war. Der Name schafft nach dem längeren Satz eindeutigen Bezug.'
- source_word: וַיַּעֲמֹדוּ
  choice: blieb stehen
  rationale: עמד beschreibt hier, wie jeder Ankommende an der Todesstelle anhielt. Der Singular entspricht im Deutschen dem distributiven „jeder“.
