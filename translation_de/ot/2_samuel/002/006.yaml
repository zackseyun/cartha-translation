  - severity: low
    issue: „dieses Gute tun“ klingt im modernen Standarddeutsch unidiomatisch.
    rationale: Die Formulierung bildet die hebräische Lexik sehr eng ab, ist aber stilistisch sperrig. „Diese Wohltat erweisen“ vermittelt dieselbe konkrete Zuwendung natürlich; die wörtliche Lesart bleibt in der Fußnote erhalten.
