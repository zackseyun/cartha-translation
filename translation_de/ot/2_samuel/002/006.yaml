  text: וְ/עַתָּ֕ה יַֽעַשׂ יְהוָ֥ה עִמָּ/כֶ֖ם חֶ֣סֶד וֶ/אֱמֶ֑ת וְ/גַ֣ם אָנֹכִ֗י אֶעֱשֶׂ֤ה אִתְּ/כֶם֙ הַ/טּוֹבָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר עֲשִׂיתֶ֖ם הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/006.yaml
  text: And now may Yahweh show you steadfast love and faithfulness[a]. And I also will do this good to you[c][b], because you have done this thing.
translation:
  language: de
  text: Und nun möge Jahwe euch Güte und Treue erweisen[a]. Auch ich will euch diese Wohltat erweisen[b], weil ihr dies getan habt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und nun wird Jahwe euch Güte und Treue erweisen.“ Die hebräische Verbform kann als Segenswunsch oder als Zukunftsaussage verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „dieses Gute“. Oder: „Auch ich will euch dieses Gute tun.“'
    reason: lexical_alternative
  - marker: c
    text: 'Gemeint ist die im vorherigen Vers erwähnte Tat: Sie hatten Saul begraben.'
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Verbindung aus Konjunktion und Zeitadverb führt Davids Segenswort in engem Anschluss an den vorherigen Vers ein.
- source_word: יַעַשׂ
  choice: erweise
  rationale: Der Imperfekt kann hier als Wunsch beziehungsweise Segensbitte verstanden werden. Mit den folgenden Begriffen Güte und Treue ist „erweisen“ im Deutschen idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: עִמָּכֶם
  choice: euch
  rationale: Die Präposition bezeichnet hier die Personen, denen Güte und Treue erwiesen werden; der deutsche Dativ gibt diesen Bezug natürlich wieder.
- source_word: חֶסֶד
  choice: Güte
  rationale: „Güte“ bezeichnet hier wohlwollende, verlässliche Zuwendung und bildet zusammen mit „Treue“ eine natürliche deutsche Wortverbindung, ohne den Begriff ausdrücklich auf eine einzelne dogmatische Deutung festzulegen.
- source_word: וֶאֱמֶת
  choice: Treue
  rationale: In der Verbindung mit חֶסֶד steht der relationale Sinn von Verlässlichkeit und Beständigkeit im Vordergrund, nicht abstrakte Wahrheit.
- source_word: וְגַם אָנֹכִי
  choice: Auch ich
  rationale: Die Formulierung bewahrt sowohl den Zusatzpartikel als auch die Hervorhebung des ausdrücklich gesetzten Personalpronomens.
- source_word: אֶעֱשֶׂה אִתְּכֶם הַטּוֹבָה הַזֹּאת
  choice: werde euch dieses Gute tun
  rationale: Die Wiedergabe bleibt nahe bei der wörtlichen Aussage „dieses Gute“, erhält damit die Unterscheidung zu חֶסֶד und gibt die auf die Adressaten gerichtete Handlung mit dem deutschen Dativ wieder.
- source_word: אֲשֶׁר עֲשִׂיתֶם הַדָּבָר הַזֶּה
  choice: weil ihr dies getan habt
  rationale: Das Relativwort leitet im Zusammenhang den Grund für Davids angekündigte gute Behandlung ein. Das knappe „dies“ verweist auf die unmittelbar zuvor erwähnte Tat.
theological_decisions:
- issue: Modale Bedeutung von יַעַשׂ
  choice: 'Segenswunsch: „erweise euch Jahwe …“'
  alternative: 'Zukunftsaussage: „Jahwe wird euch … erweisen“'
  rationale: Nach „Und nun“ passt der Imperfekt gut als jussivischer Segenswunsch Davids. Da die Form zugleich als Zukunftsaussage verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
- issue: Bedeutung von חֶסֶד וֶאֱמֶת
  choice: „Güte und Treue“
  alternative: „beständige Liebe und Treue“ oder „Gnade und Wahrheit“
  rationale: Die gewählte Formulierung bewahrt den relationalen Gedanken wohlwollender, verlässlicher Zuwendung, ohne eine spezifische Bundestheologie in den Ausdruck hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am Hebräischen, ohne unnötig altertümlich zu wirken. „Dieses Gute tun“ ist bewusst etwas formal gehalten, um den Demonstrativausdruck und die lexikalische Unterscheidung zwischen חֶסֶד und טוֹבָה zu erhalten.
