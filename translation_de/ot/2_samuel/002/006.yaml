revisions:
- from: Und nun erweise euch Jahwe Güte und Treue[a]. Auch ich werde euch dieses Gute tun[b], weil ihr dies getan habt[c].
  to: Und nun möge Jahwe euch Güte und Treue erweisen[a]. Auch ich will euch diese Wohltat erweisen[b], weil ihr dies getan habt[c].
  rationale: Die Revision klärt den deutschen Segenswunsch mit „möge“ und ersetzt eine unnötig unnatürliche, stark wörtliche Wendung durch „diese Wohltat erweisen“. Die lexikalische Nähe des Hebräischen „dieses Gute“ wird transparent in der Fußnote bewahrt.
