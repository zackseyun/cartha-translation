  variant: modern standard German
source:
  edition: WLC
  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֗וּל בְּ/מָלְכ/וֹ֙ עַל יִשְׂרָאֵ֔ל וּ/שְׁתַּ֥יִם שָׁנִ֖ים מָלָ֑ךְ אַ֚ךְ בֵּ֣ית יְהוּדָ֔ה הָי֖וּ אַחֲרֵ֥י דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/010.yaml
  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
translation:
  language: de
  text: Isch-Boschet[a], der Sohn Sauls, war vierzig Jahre alt, als er König über Israel wurde, und er regierte zwei Jahre. Doch das Haus Juda[b] hielt zu David[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der masoretische Text hat hier den Namen Isch-Boschet; in verwandten Überlieferungen begegnet die alternative Namensform Eschbaal.
    reason: alternative_reading
  - marker: b
    text: Wörtlich „das Haus Juda“, ein Sammelbegriff für den Stamm beziehungsweise das Gemeinwesen Juda.
    reason: lexical_alternative
  - marker: c
    text: Oder „folgte David“ beziehungsweise „stand auf Davids Seite“. Der hebräische Ausdruck bezeichnet Zugehörigkeit und Loyalität.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: war vierzig Jahre alt
  rationale: Die hebräische Altersformel wird idiomatisch und präzise im modernen Deutschen wiedergegeben.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isch-Boschet
  rationale: Die deutsche Umschrift folgt der im masoretischen Text überlieferten Namensform; die verwandte Form Eschbaal wird in einer Fußnote genannt.
- source_word: בְּמָלְכוֹ
  choice: als er König über Israel wurde
  rationale: Die Präposition mit der Verbform bezeichnet den Zeitpunkt, zu dem sein Alter angegeben wird. Diese Wiedergabe ist im Deutschen natürlicher als eine wörtliche Konstruktion und entspricht einer Thronbesteigungsformel.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bezeichnet in diesem königlichen Zusammenhang die Herrschaft über ein Volk.
- source_word: וּשְׁתַּיִם שָׁנִים מָלָךְ
  choice: und er regierte zwei Jahre
  rationale: Die direkte verbale Wiedergabe bewahrt die knappe hebräische Regierungsformel.
- source_word: אַךְ
  choice: Doch
  rationale: Das Wort hebt den Gegensatz zwischen Isch-Boschets Herrschaft über Israel und Judas Gefolgschaft gegenüber David hervor.
- source_word: בֵּית יְהוּדָה
  choice: das Haus Juda
  rationale: Die formnahe Wiedergabe bewahrt den korporativen Sinn des hebräischen Ausdrucks für den Stamm beziehungsweise das Gemeinwesen Juda.
- source_word: הָיוּ אַחֲרֵי דָוִד
  choice: hielt zu David
  rationale: Die hebräische Wendung bezeichnet politische Gefolgschaft oder Loyalität. „Hielt zu David“ gibt diesen Sinn natürlich wieder, ohne ihn unnötig einzuengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Regelformeln bleiben knapp; semitische Wendungen werden dort idiomatisch wiedergegeben, wo eine wörtliche Übersetzung missverständlich wäre. Der korporative Ausdruck „Haus Juda“ bleibt im Haupttext erhalten und wird erläutert.
