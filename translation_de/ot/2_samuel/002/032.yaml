  rationale: Die Revision vereinheitlicht die Namensform mit dem üblichen deutschen Bibelgebrauch, gibt die städtischen Ortsangaben präziser wieder und schärft die Erklärung der hebräischen Tagesanbruchsformel. Die Aussage bleibt offen dafür, ob die Gruppe bei Tagesanbruch bereits in Hebron war oder dort eben eintraf.
