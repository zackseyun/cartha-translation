base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/032.yaml
  text: They carried Asahel and buried him in his father's tomb[a], which was at Bethlehem. Then Joab and his men traveled all night[b], and daybreak came upon them at Hebron.
translation:
  language: de
  text: Sie trugen Asahel fort und begruben ihn im Grab seines Vaters[a], das in Bethlehem lag. Joab und seine Männer zogen die ganze Nacht hindurch; in Hebron wurde es für sie hell[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Grabstätte seines Vaters“. Das hebräische Wort kann ein einzelnes Grab oder eine Grabstätte beziehungsweise ein Familiengrab bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „In Hebron brach für sie der Tag an“. Wörtlich: „Es wurde ihnen hell.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת־עֲשָׂהאֵל
  choice: Sie trugen Asaël fort
  rationale: נשא bezeichnet hier das Tragen von Asaëls Leichnam zur Bestattung. „Forttragen“ ist im Deutschen natürlich und macht die Bewegung deutlich, ohne zusätzliche Einzelheiten einzutragen.
- source_word: וַיִּקְבְּרֻהוּ
  choice: begruben ihn
  rationale: קבר ist das gewöhnliche Verb für „begraben“ und wird hier klar und idiomatisch wiedergegeben.
- source_word: בְּקֶבֶר אָבִיו
  choice: im Grab seines Vaters
  rationale: קֶבֶר kann sowohl ein Grab als auch eine Grabstätte beziehungsweise ein Familiengrab bezeichnen. „Grab“ ist die natürliche deutsche Hauptwiedergabe; die weitere Möglichkeit wird in der Fußnote bewahrt.
- source_word: אֲשֶׁר בֵּית לָחֶם
  choice: das bei Bethlehem lag
  rationale: Die elliptische hebräische Ortsangabe wird im Deutschen mit einem Verb ergänzt. „Bei Bethlehem“ gibt die Ortsbeziehung zurückhaltend wieder.
- source_word: וַיֵּלְכוּ כָל־הַלַּיְלָה
  choice: zogen ... die ganze Nacht hindurch
  rationale: הלך bezeichnet hier die fortgesetzte nächtliche Bewegung. „Zogen“ passt zum militärischen Erzählzusammenhang, ohne ausdrücklich einen geordneten Marsch zu behaupten.
- source_word: יוֹאָב וַאֲנָשָׁיו
  choice: Joab und seine Männer
  rationale: Die Wiedergabe folgt dem allgemeinen Ausdruck אֲנָשָׁיו und bewahrt zugleich den militärischen Kontext.
- source_word: וַיֵּאֹר לָהֶם
  choice: wurde es für sie hell
  rationale: Die Formulierung bildet die hebräische Wendung eng und dennoch verständlich ab. Gemeint ist der Tagesanbruch; die Fußnote nennt eine idiomatischere Alternative.
- source_word: בְּחֶבְרוֹן
  choice: bei Hebron
  rationale: „Bei Hebron“ bewahrt die knappe Ortsangabe und vermeidet die nicht ausdrücklich gesagte Behauptung, sie seien bereits innerhalb der Stadt gewesen.
