  text: וַֽ/יְהִי֙ מִסְפַּ֣ר הַ/יָּמִ֔ים אֲשֶׁר֩ הָיָ֨ה דָוִ֥ד מֶ֛לֶךְ בְּ/חֶבְר֖וֹן עַל בֵּ֣ית יְהוּדָ֑ה שֶׁ֥בַע שָׁנִ֖ים וְ/שִׁשָּׁ֥ה חֳדָשִֽׁים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/011.yaml
  text: The length of time that David was king in Hebron over the house of Judah was seven years and six months[a].
translation:
  language: de
  text: Die Zeit, in der David in Hebron König über das Haus Juda war, betrug sieben Jahre und sechs Monate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Die Zahl der Tage«. Die hebräische Wendung bezeichnet hier die Dauer von Davids Herrschaft in Hebron.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: betrug
  rationale: Die einleitende Form von היה führt hier eine zusammenfassende Zeitangabe ein; im deutschen Satz wird sie zusammen mit מִסְפַּר הַיָּמִים natürlich durch »betrug« wiedergegeben.
- source_word: מִסְפַּר הַיָּמִים
  choice: Die Zeit
  rationale: Wörtlich »die Zahl der Tage«; die hebräische Wendung bezeichnet hier die Dauer der Herrschaft. »Die Zeit« gibt diesen Sinn klar und knapp wieder, während die wörtliche Form in der Fußnote erhalten bleibt.
- source_word: אֲשֶׁר הָיָה דָוִד מֶלֶךְ
  choice: in der David … König war
  rationale: Der Relativsatz verbindet die genannte Dauer mit Davids Königtum und lässt sich so natürlich und quellennah ins Deutsche übertragen.
- source_word: בְּחֶבְרוֹן
  choice: in Hebron
  rationale: Die Präposition bezeichnet hier den Ort von Davids Herrschaftssitz.
- source_word: עַל בֵּית יְהוּדָה
  choice: über das Haus Juda
  rationale: »Haus Juda« bewahrt die kollektive hebräische Bezeichnung, statt sie auf das bloße »Juda« zu verkürzen.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: sieben Jahre und sechs Monate
  rationale: Direkte, idiomatische Wiedergabe der angegebenen Dauer.
theological_decisions: []
