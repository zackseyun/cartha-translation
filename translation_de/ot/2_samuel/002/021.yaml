  text: וַ/יֹּ֧אמֶר ל֣/וֹ אַבְנֵ֗ר נְטֵ֤ה לְ/ךָ֙ עַל יְמִֽינְ/ךָ֙ א֣וֹ עַל שְׂמֹאלֶ֔/ךָ וֶ/אֱחֹ֣ז לְ/ךָ֗ אֶחָד֙ מֵֽ/הַ/נְּעָרִ֔ים וְ/קַח לְ/ךָ֖ אֶת חֲלִצָת֑/וֹ וְ/לֹֽא אָבָ֣ה עֲשָׂהאֵ֔ל לָ/ס֖וּר מֵ/אַחֲרָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/021.yaml
  text: Then Abner said to him[a], “Turn aside to your right or to your left, and seize one of the young men for yourself, and take his gear for yourself.” But Asahel was not willing to turn aside from following him.
translation:
  language: de
  text: 'Da sagte Abner zu ihm: »Bieg nach rechts oder links ab, pack dir einen von den jungen Männern und nimm dir seine Ausrüstung.[a]« Doch Asaël wollte nicht davon ablassen, ihm zu folgen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nimm dir seine Rüstung«. Das hebräische Wort meint wahrscheinlich die einem gefallenen Kämpfer abgenommene Ausstattung; welcher Gegenstand genau gemeint ist, bleibt unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטֵה לְךָ עַל יְמִינְךָ אוֹ עַל שְׂמֹאלֶךָ
  choice: Bieg nach rechts oder links ab
  rationale: Die Wendung bezeichnet im Verfolgungszusammenhang ein Abweichen vom bisherigen Weg. Die direkte Anrede bleibt erhalten; im Deutschen sind die Possessivangaben bei rechts und links entbehrlich.
- source_word: וֶאֱחֹז לְךָ אֶחָד מֵהַנְּעָרִים
  choice: pack dir einen von den jungen Männern
  rationale: אחז bedeutet ergreifen oder packen; das Dativpronomen gibt לְךָ natürlich wieder. »Junge Männer« bewahrt die lexikalische Offenheit von נְעָרִים, ohne vorschnell »Soldaten« oder »Diener« festzulegen.
- source_word: וְקַח לְךָ אֶת חֲלִצָתוֹ
  choice: nimm seine Ausrüstung an dich
  rationale: חֲלִצָה bezeichnet hier wahrscheinlich die einem Kämpfer abgenommene Ausstattung. »Ausrüstung« passt zum militärischen Kontext, ohne den unsicheren Gegenstand zu eng als Rüstung oder allgemeine Beute zu bestimmen.
- source_word: וְלֹא אָבָה עֲשָׂהאֵל
  choice: Doch Asaël wollte nicht
  rationale: אבה bezeichnet Bereitschaft oder Einwilligung; die Verneinung wird natürlich und ohne zusätzliche Schärfung als »wollte nicht« wiedergegeben.
- source_word: לָסוּר מֵאַחֲרָיו
  choice: davon ablassen, ihm zu folgen
  rationale: Die Formulierung gibt das Abweichen beziehungsweise Aufhören und das fortgesetzte Verfolgen idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache mit direkter und dringlicher Rede. »Pack dir« spiegelt den energischen Imperativ und ist verständlich, ohne unnötig gehoben zu wirken. Der Name wird als »Asaël« geschrieben, um die beiden Vokale erkennbar zu halten.
