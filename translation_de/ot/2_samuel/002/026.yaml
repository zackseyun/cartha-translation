  rationale: Die Revision bewahrt die Metapher vom fressenden Schwert, formuliert sie jedoch idiomatischer. „Es wird am Ende bitter sein“ bleibt näher an der offenen prädikativen Aussage des Hebräischen. Die Schlusssatzformulierung macht den militärischen Kontext verständlich, während die korrigierte Fußnote die formale Ambiguität von מֵאַחֲרֵי sachgerecht dokumentiert.
