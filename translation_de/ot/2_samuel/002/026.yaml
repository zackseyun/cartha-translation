  text: וַ/יִּקְרָ֨א אַבְנֵ֜ר אֶל יוֹאָ֗ב וַ/יֹּ֨אמֶר֙ הֲ/לָ/נֶ֨צַח֙ תֹּ֣אכַל חֶ֔רֶב הֲ/ל֣וֹא יָדַ֔עְתָּה כִּֽי מָרָ֥ה תִהְיֶ֖ה בָּ/אַחֲרוֹנָ֑ה וְ/עַד מָתַי֙ לֹֽא תֹאמַ֣ר לָ/עָ֔ם לָ/שׁ֖וּב מֵ/אַחֲרֵ֥י אֲחֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/026.yaml
  text: Then Abner called to Joab and said[a], “Must the sword devour forever? Do you not know that it will be bitter in the end? How long will it be before you tell the people to turn back from following their brothers?”
translation:
  language: de
  text: 'Da rief Abner Joab zu: „Muss das Schwert denn immer weiter fressen? Weißt du nicht, dass es am Ende bitter sein wird? Wie lange noch, bis du dem Volk sagst, es soll umkehren und seine Brüder nicht weiter verfolgen[a]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von hinter ihren Brüdern umzukehren/zurückzukehren“.'
    reason: Die hebräische Wendung beschreibt formal das Umkehren vom Hinterhergehen; im Kampfzusammenhang ist damit gemeint, die Verfolgung der eigenen Brüder einzustellen.
lexical_decisions:
- source_word: הֲלָנֶצַח
  choice: ewig
  rationale: Die Wendung leitet eine rhetorische Frage nach einer scheinbar endlosen Fortdauer ein; „ewig“ ist knapp und natürlich.
- source_word: תֹּאכַל חֶרֶב
  choice: das Schwert weiterfressen
  rationale: Die Personifikation des Schwertes und das konkrete Verb „essen/fressen“ bleiben erhalten. „Weiter-“ macht im Deutschen die gemeinte Fortdauer deutlich.
- source_word: מָרָה תִהְיֶה בָּאַחֲרוֹנָה
  choice: es am Ende bitter ausgehen wird
  rationale: „Bitter“ bewahrt die Bildsprache; „ausgehen“ bezeichnet natürlich den schließlich eintretenden Ausgang des Kampfes.
- source_word: וְעַד מָתַי
  choice: Wie lange dauert es noch, bis
  rationale: Diese Formulierung gibt die Frage nach Joabs weiterem Zögern in gegenwärtigem, idiomatischem Deutsch wieder.
- source_word: לֹא תֹאמַר לָעָם
  choice: du dem Volk sagst
  rationale: אמר bedeutet hier „sagen/auffordern“. „Sagst“ vermeidet die stärkere, im Ausgangstext nicht zwingend enthaltene Festlegung auf „befiehlst“.
- source_word: לָשׁוּב מֵאַחֲרֵי
  choice: umkehren und von der Verfolgung ... ablassen
  rationale: Die Wiedergabe verbindet die Grundbedeutung von שׁוב („umkehren“) mit dem im Kampfzusammenhang naheliegenden Sinn von מאחרי („hinterher/verfolgen“).
- source_word: אֲחֵיהֶם
  choice: seiner Brüder
  rationale: „Brüder“ bewahrt die familiäre und gemeinschaftliche Schärfe der Aussage über Israeliten, die gegen Israeliten kämpfen. Das Possessivpronomen richtet sich grammatisch nach dem Kollektiv „Volk“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die eindringliche Schwertmetapher und die dreifache rhetorische Zuspitzung des Hebräischen bleiben erhalten; militärische Einzelheiten werden nicht über den Kontext hinaus präzisiert.
