  text: וַ/יֹּ֤אמֶר אַבְנֵר֙ אֶל יוֹאָ֔ב יָק֤וּמוּ נָא֙ הַ/נְּעָרִ֔ים וִֽ/ישַׂחֲק֖וּ לְ/פָנֵ֑י/נוּ וַ/יֹּ֥אמֶר יוֹאָ֖ב יָקֻֽמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/014.yaml
  text: Then Abner said to Joab, “Please let the young men arise and compete before us.” And Joab said, “Let them arise.”
translation:
  language: de
  text: 'Da sagte Abner zu Joab: »Die jungen Männer sollen doch vortreten und sich vor uns messen.« Joab antwortete: »Sie sollen vortreten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: die jungen Männer
  rationale: נְעָרִים bezeichnet hier die jungen Gefolgsleute beziehungsweise Krieger beider Seiten; »junge Männer« bleibt nah am Hebräischen, ohne sie vorschnell als Knaben oder ausdrücklich als Soldaten einzuordnen.
- source_word: יָקוּמוּ נָא
  choice: sollen doch vortreten
  rationale: קוּם bedeutet wörtlich »aufstehen«, bezeichnet hier aber idiomatisch das Antreten; נָא verleiht der Aufforderung einen höflich-anregenden Ton, der mit »doch« wiedergegeben wird.
- source_word: וִישַׂחֲקוּ
  choice: miteinander kämpfen
  rationale: שׂחק kann »spielen«, »sich belustigen« oder in einem Wettkampf gegeneinander antreten bedeuten. Der unmittelbare Kontext (Verse 15–16) zeigt einen tödlichen bewaffneten Zweikampf; »miteinander kämpfen« bildet daher die situative Bedeutung natürlich ab, ohne den Ausgang bereits in den Satz einzutragen.
- source_word: לְפָנֵינוּ
  choice: vor unseren Augen
  rationale: Die Wendung bedeutet wörtlich »vor uns« und hebt hervor, dass der Kampf in Gegenwart der beiden Heerführer stattfinden soll; »vor unseren Augen« ist im Deutschen klar und idiomatisch.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die knappe Wiederholung in Joabs Antwort bleibt erhalten. Keine Fußnoten erforderlich; daher gibt es auch keine Marker im Haupttext.
