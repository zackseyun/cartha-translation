base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/016.yaml
  text: Each man seized his companion by the head[a], and his sword was in his companion’s side, so they fell together. Therefore that place, which is in Gibeon, was called Helkath-hazzurim.
translation:
  language: de
  text: Jeder packte den anderen am Kopf, und sein Schwert war in dessen Seite; so fielen sie zugleich. Deshalb nannte man jenen Ort in Gibeon Helkat-Hazzurim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ortsname Helkat-Hazzurim ist in seiner genauen Bedeutung unsicher. Vorgeschlagen wurden unter anderem „Feld der Seiten“, „Feld der scharfen Klingen“ und ähnliche Deutungen.
    reason: Die Transkription bewahrt die Unsicherheit der umstrittenen Wortherleitung, ohne im Haupttext eine bestimmte Deutung festzulegen.
lexical_decisions:
- source_word: וַיַּחֲזִקוּ אִישׁ בְּרֹאשׁ רֵעֵהוּ
  choice: Jeder packte den anderen am Kopf
  rationale: חזק bezeichnet hier ein kräftiges Zugreifen im Kampf. Das distributive אִישׁ und רֵעֵהוּ beschreiben jeweils die beiden einander gegenüberstehenden Kämpfer; „den anderen“ vermeidet den im Deutschen freundschaftlich klingenden Ausdruck „Gefährten“.
- source_word: וְחַרְבּוֹ בְּצַד רֵעֵהוּ
  choice: und stieß ihm sein Schwert in die Seite
  rationale: 'Der hebräische Ausdruck ist eine knappe, verblose Kampfschilderung: wörtlich etwa „und sein Schwert in der Seite des anderen“. Das im Deutschen nötige Verb „stieß“ gibt die naheliegende Bewegung wieder, ohne ein zusätzliches Kampfdetail einzuführen; צַד bedeutet hier „Seite“.'
- source_word: וַיִּפְּלוּ יַחְדָּו
  choice: So fielen sie alle zugleich
  rationale: „So“ macht den Folgecharakter der Erzählung deutlich. יַחְדָּו bezeichnet hier das gemeinsame beziehungsweise gleichzeitige Fallen der beteiligten Kämpfer; „alle“ bezieht die gesamte zuvor genannte Gruppe ein.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: Deshalb nannte man jenen Ort
  rationale: Das nicht näher bestimmte singularische Subjekt wird im Deutschen idiomatisch mit „man“ wiedergegeben. „Deshalb“ stellt den im Zusammenhang erkennbaren Bezug zwischen dem Geschehen und der Benennung her.
- source_word: חֶלְקַת הַצֻּרִים
  choice: Helkat-Hazzurim
  rationale: Der Ortsname wird transkribiert, weil seine genaue Bedeutung und Herleitung unsicher sind. Eine Übersetzung im Haupttext würde eine umstrittene Deutung festlegen.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: bei Gibeon
  rationale: Die Relativkonstruktion lokalisiert den benannten Ort. „Bei Gibeon“ ist im Deutschen eine natürliche Ortsangabe und lässt offen, ob der Platz innerhalb der Siedlung oder in ihrem unmittelbaren Gebiet lag.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit knapper, anschaulicher Kampfschilderung. Die paarweise Handlung wird idiomatisch wiedergegeben; der unsichere Ortsname bleibt transkribiert. Der Fußnotenmarker steht unmittelbar beim Ortsnamen, auf den die Anmerkung bezogen ist.
