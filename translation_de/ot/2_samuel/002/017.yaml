  text: The battle was very fierce that day[b][a], and Abner and the men of Israel were defeated before the servants of David.
translation:
  language: de
  text: An jenem Tag war die Schlacht äußerst heftig[a], und Abner und die Männer Israels wurden von den Dienern Davids besiegt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „An jenem Tag war die Schlacht überaus schwer.“'
