lexical_decisions:
- source_word: הַמִּלְחָמָה
  choice: die Schlacht
  rationale: מִלְחָמָה kann einen Krieg oder eine einzelne Schlacht bezeichnen. Im unmittelbaren Erzählzusammenhang geht es um dieses konkrete Gefecht.
- source_word: קָשָׁה עַד מְאֹד
  choice: äußerst heftig
  rationale: קָשָׁה bedeutet wörtlich „hart“ oder „schwer“; bei einer Schlacht gibt „heftig“ die Intensität des Kampfes idiomatisch wieder. „Äußerst“ bewahrt die starke Steigerung עַד מְאֹד.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die geläufige deutsche Zeitangabe gibt den rückverweisenden Ausdruck präzise und natürlich wieder.
- source_word: וַיִּנָּגֶף
  choice: wurden … geschlagen
  rationale: Der Nifal von נָגַף bezeichnet im militärischen Zusammenhang das Unterliegen oder Geschlagenwerden vor einem Gegner. Die deutsche Pluralform folgt dem zusammengesetzten Subjekt.
- source_word: וְאַנְשֵׁי יִשְׂרָאֵל
  choice: und die Männer Israels
  rationale: Die Wiedergabe bewahrt das konkrete אַנְשֵׁי („Männer von“) und bezeichnet im Kontext Abners Streitkräfte, ohne den Ausdruck zu „Israeliten“ zu verallgemeinern.
- source_word: לִפְנֵי
  choice: vor
  rationale: In Berichten über Kämpfe bezeichnet לִפְנֵי das Unterliegen vor einer gegnerischen Streitmacht. Das deutsche „vor“ erhält diese hebräische Ausdrucksweise.
- source_word: עַבְדֵי דָוִד
  choice: die Diener Davids
  rationale: עֶבֶד bezeichnet Menschen, die in Davids Dienst stehen. „Diener Davids“ bleibt quellennah; eine Fußnote erläutert die militärische Bedeutung im Kontext.
theological_decisions: []
