  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, während „äußerst heftig“ die Intensität des Kampfes idiomatisch ausdrückt. Die militärische Bedeutung von „Diener“ wird erläutert, ohne den Quellenausdruck im Haupttext zu glätten.
