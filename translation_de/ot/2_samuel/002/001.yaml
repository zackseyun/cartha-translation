source:
  edition: WLC
  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וַ/יִּשְׁאַל֩ דָּוִ֨ד בַּֽ/יהוָ֤ה לֵ/אמֹר֙ הַ/אֶעֱלֶ֗ה בְּ/אַחַת֙ עָרֵ֣י יְהוּדָ֔ה וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו עֲלֵ֑ה וַ/יֹּ֧אמֶר דָּוִ֛ד אָ֥נָה אֶעֱלֶ֖ה וַ/יֹּ֥אמֶר חֶבְרֹֽנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/001.yaml
  text: After this[a], David inquired of Yahweh, saying, “Shall I go up into one of the cities of Judah?” And Yahweh said to him, “Go up.” Then David said, “Where shall I go up?” And he said, “To Hebron.”
translation:
  language: de
  text: 'Danach befragte David Jahwe[a]: „Soll ich in eine der Städte Judas hinaufziehen?“ Jahwe antwortete ihm: „Zieh hinauf!“ David fragte: „Wohin soll ich hinaufziehen?“ Er antwortete: „Nach Hebron.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: Erläuterung der Wiedergabe des Gottesnamens
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Danach
  rationale: Die hebräische Erzählformel markiert einen zeitlichen Übergang. „Danach“ gibt ihn knapp und in natürlichem modernem Deutsch wieder.
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: befragte David Jahwe
  rationale: שׁאל mit ב und dem Gottesnamen bezeichnet hier das Einholen göttlicher Weisung. „Befragen“ ist prägnant und unterscheidet den Vorgang von einer beiläufigen Frage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch den traditionellen Ersatztitel „der HERR“ ersetzt.
- source_word: לֵאמֹר
  choice: durch den anschließenden Doppelpunkt wiedergegeben
  rationale: Der Infinitiv führt den Inhalt der Befragung ein. Im Deutschen übernimmt der Doppelpunkt diese Funktion natürlicher als ein zusätzliches „und sagte“.
- source_word: הַאֶעֱלֶה / עֲלֵה
  choice: Soll ich ... hinaufziehen? / Zieh hinauf!
  rationale: Die wiederholte Wurzel עלה bleibt in Frage und Antwort erkennbar; „hinaufziehen“ passt zur Bewegung in das judäische Bergland.
- source_word: בְּאַחַת עָרֵי יְהוּדָה
  choice: in eine der Städte Judas
  rationale: Die Formulierung bezeichnet eine einzelne, zunächst noch nicht bestimmte Stadt im Gebiet Judas und bewahrt die Bewegung in die Stadt hinein.
- source_word: אָנָה
  choice: Wohin
  rationale: Das Richtungsadverb fragt nach dem Ziel; „wohin“ ist die genaue und natürliche deutsche Entsprechung.
- source_word: חֶבְרֹנָה
  choice: Nach Hebron
  rationale: Das lokale He kennzeichnet die Bewegung auf Hebron zu; bei Städtenamen wird dies im Deutschen idiomatisch mit „nach“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ bewahrt den Charakter als Eigenname; die traditionelle Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Dialogstruktur und die Wiederholung von „hinaufziehen“ werden bewahrt; unnötig altertümliche Formen werden vermieden.
