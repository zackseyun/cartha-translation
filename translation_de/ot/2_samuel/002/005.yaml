source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אַנְשֵׁ֖י יָבֵ֣ישׁ גִּלְעָ֑ד וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם בְּרֻכִ֤ים אַתֶּם֙ לַֽ/יהוָ֔ה אֲשֶׁ֨ר עֲשִׂיתֶ֜ם הַ/חֶ֣סֶד הַ/זֶּ֗ה עִם אֲדֹֽנֵי/כֶם֙ עִם שָׁא֔וּל וַֽ/תִּקְבְּר֖וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/005.yaml
  text: Then David sent messengers to the men of Jabesh-gilead and said to them[a], “Blessed are you by Yahweh, because you have shown this kindness to your lord, to Saul[b], and have buried him.”
translation:
  language: de
  text: 'Da sandte David Boten zu den Männern von Jabesch-Gilead und ließ ihnen sagen: »Gesegnet seid ihr von Jahwe«[a], weil ihr eurem Herrn Saul diese Güte[b] erwiesen und ihn begraben habt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Segenswunsch: »Jahwe segne euch.«'
    reason: Die partizipiale Wendung kann als Feststellung oder als formelhafter Segenswunsch verstanden werden.
  - marker: b
    text: Das hebräische Wort bezeichnet je nach Zusammenhang Güte, Loyalität oder treue Liebe.
    reason: Das Bedeutungsspektrum von חֶסֶד ist weiter als das deutsche Einzelwort »Güte«.
lexical_decisions:
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im Erzählzusammenhang sind menschliche Abgesandte Davids gemeint, nicht himmlische Wesen.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: die Männer von Jabesch-Gilead
  rationale: Das Hebräische bezeichnet ausdrücklich die Männer der Stadt; die traditionelle deutsche Namensform ist klar und geläufig.
- source_word: בְּרֻכִים אַתֶּם לַיהוָה
  choice: Gesegnet seid ihr von Jahwe
  rationale: Die passive Partizipialform wird als Feststellung beziehungsweise Segensformel wiedergegeben. »Von Jahwe« versteht לַיהוָה als Bezeichnung des Urhebers des Segens; die mögliche Wunschform wird in der Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als persönlicher Name wiedergegeben und nicht durch den Titel »HERR« ersetzt.
- source_word: חֶסֶד
  choice: Güte
  rationale: Gemeint ist hier eine konkrete Tat loyaler Güte gegenüber Saul. Die Fußnote hält das weitere Bedeutungsspektrum des Wortes offen.
- source_word: אֲדֹנֵיכֶם
  choice: eurem Herrn
  rationale: Die Bezeichnung drückt Sauls Stellung als Herrscher und die ihm geschuldete Achtung aus.
- source_word: עִם שָׁאוּל
  choice: Saul
  rationale: Saul steht als erläuternde Apposition zu »eurem Herrn«; diese deutsche Fügung gibt die Beziehung natürlich und präzise wieder.
- source_word: וַתִּקְבְּרוּ אֹתוֹ
  choice: und ihn begraben habt
  rationale: Die abgeschlossene Bestattung wird zusammen mit der erwiesenen Güte als Grund für Davids Anerkennung genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt im Deutschen den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Aussage oder Segenswunsch in בְּרֻכִים אַתֶּם לַיהוָה
  choice: Gesegnet seid ihr von Jahwe
  alternative: Jahwe segne euch
  rationale: Das passive Partizip spricht zunächst für eine Aussage, kann im Kontext aber formelhaft Segenscharakter tragen. Die Alternative wird deshalb in einer Fußnote genannt, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen, wird aber durch »ließ ihnen sagen« und die bündige Apposition »eurem Herrn Saul« natürlich deutsch gestaltet.
