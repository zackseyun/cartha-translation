base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/015.yaml
  text: 'So they arose and crossed over by number: twelve for Benjamin and for Ish-bosheth the son of Saul[d][c][b][a], and twelve from the servants of David.'
translation:
  language: de
  text: 'Da standen sie auf und gingen in gleicher Zahl hinüber[a]: zwölf für Benjamin und für Isch-Boschet, den Sohn Sauls[b], und zwölf von den Dienern Davids[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „gingen nach der Zahl hinüber“. Das hebräische Verb kann „hinübergehen“, „überqueren“ oder „hinüberwechseln“ bedeuten; die Wendung bezeichnet die gezählte Anzahl.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „Isch-Boschet“; an anderen Stellen der alttestamentlichen Überlieferung erscheint die verwandte Namensform „Eschbaal“.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „von den Gefolgsleuten Davids“ beziehungsweise „von Davids Männern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: da standen sie auf
  rationale: Das Qal wayyiqtol von קום führt die nächste Handlung ein. „Da standen sie auf“ gibt die hebräische Erzählfolge natürlich und würdig wieder.
- source_word: וַיַּעַבְרוּ בְמִסְפָּר
  choice: traten abgezählt an
  rationale: עבר bezeichnet hier im Zusammenhang des vereinbarten Kampfes das Hinüber- beziehungsweise Vortreten, während בְמִסְפָּר die festgelegte, gleiche Anzahl hervorhebt. Die Formulierung gibt den situativen Sinn natürlich wieder, ohne eine bestimmte räumliche Bewegung zwingend festzulegen.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: לְבִנְיָמִן וּלְאִישׁ בֹּשֶׁת
  choice: für Benjamin und für Isch-Boschet
  rationale: 'Die Präposition ל kennzeichnet hier am ehesten Zugehörigkeit oder Vertretung: Die zwölf kämpfen auf der Seite Benjamins und Isch-Boschets. Die parallele Struktur des Hebräischen bleibt erhalten.'
- source_word: בֶּן שָׁאוּל
  choice: den Sohn Sauls
  rationale: Natürliche deutsche Wiedergabe der Abstammungsangabe; der Akkusativ folgt der Apposition zu „Isch-Boschet“.
- source_word: מֵעַבְדֵי דָוִד
  choice: von den Dienern Davids
  rationale: עבדים bedeutet wörtlich „Diener“, kann im königlich-militärischen Zusammenhang aber Gefolgsleute oder Männer im Dienst bezeichnen. „Diener“ wahrt die lexikalische Transparenz.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Traten abgezählt an“ vermeidet die im Deutschen missverständliche starre Nachbildung „gingen nach der Zahl hinüber“ und macht die militärische Aufstellung deutlich; die Fußnote bewahrt die formale und räumliche Mehrdeutigkeit des Hebräischen. Die Namensform folgt dem masoretischen Text.
