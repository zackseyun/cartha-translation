  text: וְ/יוֹאָ֗ב שָׁ֚ב מֵ/אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּקְבֹּ֖ץ אֶת כָּל הָ/עָ֑ם וַ/יִּפָּ֨קְד֜וּ מֵ/עַבְדֵ֥י דָוִ֛ד תִּשְׁעָֽה עָשָׂ֥ר אִ֖ישׁ וַ/עֲשָׂה אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/030.yaml
  text: And Joab returned from pursuing Abner[a], and he gathered all the people. When they were counted, nineteen men of David’s servants were missing, besides Asahel.
translation:
  language: de
  text: Und Joab kehrte von der Verfolgung Abners zurück und sammelte die ganze Truppe. Bei der Musterung fehlten von Davids Leuten neunzehn Männer und Asaël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „neunzehn Männer und Asaël“; Asaël wird zusätzlich zu den neunzehn Männern gezählt.'
    reason: Die Fußnote erläutert die knappe hebräische Zählweise, ohne sie im Haupttext unnötig auszudeuten.
lexical_decisions:
- source_word: שָׁב מֵאַחֲרֵי אַבְנֵר
  choice: kehrte von der Verfolgung Abners zurück
  rationale: שׁוב bedeutet im Qal „zurückkehren“; מֵאַחֲרֵי bezeichnet im militärischen Zusammenhang die Verfolgung, von der Joab abließ.
- source_word: וַיִּקְבֹּץ אֶת כָּל הָעָם
  choice: und sammelte das ganze Kriegsvolk
  rationale: עָם heißt grundsätzlich „Volk“, bezeichnet hier jedoch Joabs versammelte Kampftruppe. „Kriegsvolk“ bewahrt den Grundbegriff und macht den militärischen Kontext deutlich.
- source_word: וַיִּפָּקְדוּ
  choice: Bei der Musterung fehlten
  rationale: Das Nifal von פקד bezeichnet hier das Gemustert- bzw. Gezähltwerden; aus dem folgenden מן ergibt sich, dass die Genannten bei der Musterung fehlten.
- source_word: מֵעַבְדֵי דָוִד
  choice: von Davids Leuten
  rationale: עֲבָדִים bedeutet wörtlich „Diener“, bezeichnet im königlich-militärischen Zusammenhang aber Männer in Davids Dienst. „Davids Leute“ ist im Deutschen natürlich und kontextgerecht.
- source_word: תִּשְׁעָה עָשָׂר אִישׁ
  choice: neunzehn Männer
  rationale: Direkte Wiedergabe der Zahl mit אִישׁ im militärischen Kontext.
- source_word: וַעֲשָׂה אֵל
  choice: und Asaël
  rationale: Die überlieferte Schreibung gibt den Eigennamen Asaël orthografisch auffällig wieder. Das einfache „und“ folgt der hebräischen Form und lässt erkennen, dass Asaël zusätzlich zu den neunzehn Männern genannt wird.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Kriegsvolk“ verdeutlicht den militärischen Bezug von עָם, während „Davids Leute“ das in diesem Kontext steife oder missverständliche „Diener“ vermeidet. Die Namensform „Asaël“ markiert die getrennte Aussprache im Deutschen.
