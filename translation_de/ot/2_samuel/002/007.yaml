source:
  edition: WLC
  text: וְ/עַתָּ֣ה תֶּחֱזַ֣קְנָה יְדֵי/כֶ֗ם וִֽ/הְיוּ֙ לִ/בְנֵי חַ֔יִל כִּי מֵ֖ת אֲדֹנֵי/כֶ֣ם שָׁא֑וּל וְ/גַם אֹתִ֗/י מָשְׁח֧וּ בֵית יְהוּדָ֛ה לְ/מֶ֖לֶךְ עֲלֵי/הֶֽם׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/007.yaml
  text: Let your hands be strong[a], and be valiant men, for your lord Saul is dead, and the house of Judah also has anointed me king over them.
translation:
  language: de
  text: Nun fasst Mut[a] und seid tapfere Männer! Denn euer Herr Saul ist tot, und auch mich hat das Haus Juda zum König über sich gesalbt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Lasst eure Hände stark sein.“ Das hebräische Bild fordert zu Mut, Entschlossenheit und tatkräftigem Handeln auf.'
    reason: Das natürliche deutsche Idiom „fasst Mut“ gibt den Sinn wieder; die Fußnote bewahrt die konkrete Bildsprache und ihre Bedeutungsbreite.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun
  rationale: Die Wendung enthält ausdrücklich das Zeit- und Übergangswort עַתָּה („nun/jetzt“). Im Deutschen leitet „Nun“ die daraus folgende Aufforderung natürlich ein; das vorangestellte וְ wird dabei in den Satzübergang aufgenommen.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: fasst Mut[a]
  rationale: Wörtlich sollen die Hände der Angesprochenen stark sein. Das ist ein hebräisches Bild für Mut, Entschlossenheit und Handlungsfähigkeit. „Fasst Mut“ gibt den auffordernden Sinn in natürlichem Deutsch wieder; die Fußnote bewahrt das konkrete Bild.
- source_word: וִהְיוּ לִבְנֵי חַיִל
  choice: und seid tapfere Männer
  rationale: בְּנֵי חַיִל bezeichnet hier mutige, fähige Männer, wahrscheinlich mit militärischem Beiklang. „Tapfere Männer“ bewahrt sowohl die männliche Form als auch den Mutaspekt.
- source_word: כִּי מֵת אֲדֹנֵיכֶם שָׁאוּל
  choice: Denn euer Herr Saul ist tot
  rationale: כִּי begründet die Aufforderung und wird passend mit „Denn“ wiedergegeben. אֲדֹנֵיכֶם ist hier ein menschlicher Herrscher- und Ehrentitel für Saul, nicht eine Gottesbezeichnung.
- source_word: וְגַם אֹתִי
  choice: und auch mich
  rationale: Die Stellung von אֹתִי mit גַם hebt David als weiteres Objekt hervor. „Auch mich“ erhält diesen Fokus.
- source_word: מָשְׁחוּ בֵית יְהוּדָה לְמֶלֶךְ עֲלֵיהֶם
  choice: hat das Haus Juda zum König über sich gesalbt
  rationale: „Das Haus Juda“ bewahrt die korporative Bezeichnung בֵּית יְהוּדָה. „Zum König über sich“ gibt sowohl die Einsetzung in das Königsamt als auch den Herrschaftsbezug von עֲלֵיהֶם wieder.
theological_decisions:
- issue: Männliche Bezeichnung בְּנֵי חַיִל
  choice: tapfere Männer
  alternative: seid mutig / tapfere Menschen
  rationale: Der hebräische Ausdruck ist ausdrücklich männlich und bezeichnet im Zusammenhang die männlichen Anhänger beziehungsweise kämpferisch handlungsfähigen Männer Sauls. Eine Neutralisierung ist daher nicht erforderlich.
- issue: Titel אֲדֹנֵיכֶם für Saul
  choice: euer Herr
  alternative: euer Gebieter / euer Herrscher
  rationale: Der Ausdruck bezeichnet Saul als menschlichen politischen Herrn. „Herr“ erhält den Ehrentitel, ohne ihn als Gottesbezeichnung zu verstehen.
- issue: Salbung Davids zum König
  choice: zum König über sich gesalbt
  alternative: zu ihrem König gesalbt
  rationale: Die Formulierung hält die kultisch-politische Handlung der Salbung und die im Hebräischen ausdrücklich genannte Herrschaft „über ihnen“ zusammen, ohne weitergehende theologische Folgerungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Aufforderung. Das Ausrufezeichen markiert den exhortativen Charakter der beiden verbundenen Verbformen. „Haus Juda“ bleibt als biblische korporative Bezeichnung stehen; die Satzstellung „auch mich hat …“ bewahrt die Hervorhebung Davids.
