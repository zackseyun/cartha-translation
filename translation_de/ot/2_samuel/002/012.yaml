  text: וַ/יֵּצֵא֙ אַבְנֵ֣ר בֶּן נֵ֔ר וְ/עַבְדֵ֖י אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֑וּל מִֽ/מַּחֲנַ֖יִם גִּבְעֽוֹנָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/012.yaml
  text: Then Abner son of Ner[a], and the servants of Ish-bosheth son of Saul, went out from Mahanaim to Gibeon.
translation:
  language: de
  text: Darauf zogen Abner, der Sohn Ners, und die Diener Isch-Boschets[a], des Sohnes Sauls, von Mahanajim nach Gibeon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Derselbe Mann heißt in 1. Chronik 8,33 und 9,39 Eschbaal.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Darauf zogen ...
  rationale: Das narrative Waw führt die Handlung fort; „Darauf“ gibt den Erzählfluss natürlich wieder. Obwohl das hebräische Verb im Singular steht und sich zunächst an Abner anschließt, verlangt das zusammengesetzte Subjekt im Deutschen idiomatisch den Plural.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abner, der Sohn Ners
  rationale: Die Eigennamen werden in geläufiger deutscher Form wiedergegeben; die Abstammungsangabe wird natürlich formuliert.
- source_word: וְעַבְדֵי
  choice: und die Diener
  rationale: עֶבֶד kann je nach Zusammenhang Diener, Beamte oder Gefolgsmann bezeichnen. „Diener“ wahrt die lexikalische Breite, ohne den militärisch-politischen Rang näher festzulegen.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isch-Boschet
  rationale: Der masoretische Text bietet אִישׁ בֹּשֶׁת. Die deutsche Umschrift „Isch-Boschet“ folgt dieser Textform; die Parallelform in der Chronik wird in einer Fußnote genannt.
- source_word: בֶּן שָׁאוּל
  choice: des Sohnes Sauls
  rationale: Die Abstammungsangabe identifiziert Isch-Boschet als Sohn Sauls und wird in natürlicher deutscher Apposition wiedergegeben.
- source_word: מִמַּחֲנַיִם
  choice: von Mahanajim
  rationale: Die Präposition מִן bezeichnet den Ausgangspunkt; der Ortsname wird nach üblicher deutscher Umschrift wiedergegeben.
- source_word: גִּבְעֹנָה
  choice: nach Gibeon
  rationale: Das angehängte Richtungszeichen bezeichnet eine Bewegung auf den Ort zu. Bei Ortsnamen ist „nach Gibeon“ im Deutschen die natürliche Entsprechung.
