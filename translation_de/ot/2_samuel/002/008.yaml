id: 2SA.2.8
reference: 2 Samuel 2:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַבְנֵ֣ר בֶּן נֵ֔ר שַׂר צָבָ֖א אֲשֶׁ֣ר לְ/שָׁא֑וּל לָקַ֗ח אֶת אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וַ/יַּעֲבִרֵ֖/הוּ מַחֲנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/008.yaml
  text: But Abner son of Ner[a], the commander of Saul’s army, took Ish-bosheth son of Saul and brought him over to Mahanaim.
translation:
  language: de
  text: Abner aber, der Sohn Ners und Befehlshaber von Sauls Heer, nahm Isch-Boschet, den Sohn Sauls, und brachte ihn hinüber nach Mahanajim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isch-Boschet wird in 1. Chronik 8,33 und 9,39 Eschbaal genannt.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַבְנֵר
  choice: Abner aber
  rationale: Das Waw verbindet den Satz mit dem Vorhergehenden und markiert hier zugleich den erzählerischen Gegensatz zu Davids Salbung durch Juda.
- source_word: בֶּן נֵר
  choice: der Sohn Ners
  rationale: Die hebräische Abstammungsangabe wird in natürlichem Standarddeutsch wiedergegeben.
- source_word: שַׂר צָבָא אֲשֶׁר לְ/שָׁאוּל
  choice: Befehlshaber von Sauls Heer
  rationale: שַׂר צָבָא bezeichnet den militärischen Oberbefehlshaber; die Zugehörigkeit zu Saul wird knapp und klar ausgedrückt.
- source_word: לָקַח
  choice: nahm
  rationale: Die Grundbedeutung wird beibehalten; der unmittelbare Kontext verlangt keine stärkere Wiedergabe wie »ergriff« oder »bemächtigte sich«.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isch-Boschet
  rationale: Der im masoretischen Text dieses Verses überlieferte Personenname wird transliteriert; die Namensform Eschbaal in der Chronik wird in der Fußnote genannt.
- source_word: וַ/יַּעֲבִרֵ/הוּ
  choice: brachte ihn hinüber
  rationale: 'Die Hifil-Form von עבר hat kausativen Sinn: jemanden hinüberbringen. Die Formulierung bewahrt den möglichen Hinweis auf eine Überquerung, ohne eine im Vers nicht genannte Route festzulegen.'
- source_word: מַחֲנָיִם
  choice: Mahanajim
  rationale: Der Ortsname wird nach geläufiger deutscher Bibelnamenkonvention transliteriert.
theological_decisions: []
