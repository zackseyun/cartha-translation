base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/018.yaml
  text: 'The three sons of Zeruiah were there: Joab[a], Abishai, and Asahel. And Asahel was swift on his feet like one of the gazelles that are in the field.'
translation:
  language: de
  text: 'Die drei Söhne Zerujas waren dort: Joab, Abischai und Asahel. Asahel war leichtfüßig wie eine der Gazellen[a] auf dem Feld.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie eines der Rehe auf dem Feld“. Das hebräische Wort צְבִי kann auch allgemeiner ein wildlebendes Huftier bezeichnen; „Gazelle“ ist hier wahrscheinlich die genauere Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: waren dort
  rationale: Die Wendung bezeichnet schlicht ihre Anwesenheit am Schauplatz. „Waren dort“ ist im Deutschen natürlich und fügt kein im Hebräischen ausdrücklich vorhandenes Zeitadverb hinzu.
- source_word: שְׁלֹשָׁה בְּנֵי צְרוּיָה
  choice: die drei Söhne Zerujas
  rationale: Der bestimmte Ausdruck verweist auf die bekannte Dreiergruppe; der Name wird in der im Deutschen üblichen Form „Zeruja“ wiedergegeben.
- source_word: יוֹאָב וַאֲבִישַׁי וַעֲשָׂהאֵל
  choice: Joab, Abischai und Asaël
  rationale: Die Personennamen folgen geläufigen deutschen Bibelnamensformen; die Trema-Schreibung „Asaël“ macht die getrennte Aussprache der Vokale deutlich.
- source_word: קַל בְּרַגְלָיו
  choice: schnell zu Fuß
  rationale: קַל bezeichnet hier Schnelligkeit, nicht geringes Gewicht. „Schnell zu Fuß“ gibt die hebräische körperbezogene Wendung natürlich und verständlich wieder.
- source_word: כְּאַחַד הַצְּבָיִם
  choice: wie eine der Gazellen
  rationale: צְבִי bezeichnet im biblischen Hebräisch gewöhnlich eine Gazelle, die hier als Bild für Asaëls Laufgeschwindigkeit dient. Die Formulierung bewahrt den Vergleich mit einem einzelnen Tier aus der Gruppe.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: Die knappe Ortsangabe wird eng am Hebräischen wiedergegeben. Im Deutschen ist bei Tieren „auf dem Feld“ idiomatischer als „im Feld“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählsyntax. Das verbindende וַ am Anfang des zweiten Satzes wird nicht mechanisch mit „und“ wiedergegeben, da die Satzfolge den narrativen Zusammenhang im Deutschen bereits deutlich macht.
