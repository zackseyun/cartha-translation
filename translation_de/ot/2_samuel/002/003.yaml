base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/003.yaml
  text: And David brought up the men who were with him[a], each man with his household, and they settled in the towns of Hebron.
translation:
  language: de
  text: Auch die Männer, die bei ihm waren, nahm David mit hinauf, jeden mit seinem Hausstand. Sie ließen sich in den Ortschaften von Hebron nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »in den Städten Hebrons«. Gemeint sein können die Siedlungen, die zu Hebron beziehungsweise dessen Umfeld gehörten, und nicht nur das eigentliche Stadtzentrum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשָׁיו
  choice: Auch die Männer
  rationale: אֲנָשָׁיו bedeutet wörtlich »seine Männer«. Da der folgende Relativsatz ihre Zugehörigkeit zu David ausdrückt, ist »die Männer« im Deutschen natürlich und vermeidet eine unnötige Doppelung. Das וַ wird im Zusammenhang als anschließendes »auch« wiedergegeben.
- source_word: אֲשֶׁר עִמּוֹ
  choice: die bei ihm waren
  rationale: Der Relativsatz bezeichnet Davids Begleiter und wird im modernen Standarddeutsch unmittelbar und natürlich wiedergegeben.
- source_word: הֶעֱלָה
  choice: nahm … mit hinauf
  rationale: Der Hifil von עלה bezeichnet das Hinaufbringen beziehungsweise Hinaufführen. »Mit hinaufnehmen« bewahrt die geografische Aufwärtsbewegung nach Hebron im Bergland und klingt im Deutschen natürlicher als »hinaufbringen« bei Personen.
- source_word: אִישׁ וּבֵיתוֹ
  choice: jeden mit seiner Familie
  rationale: 'אִישׁ ist hier distributiv: Jeder Mann zog zusammen mit seinem Hausstand. »Familie« vermittelt in diesem Kontext den gemeinten häuslich-familiären Verband verständlicher als das wörtliche »Haus«, ohne ein Gebäude nahezulegen.'
- source_word: וַיֵּשְׁבוּ
  choice: Sie ließen sich … nieder
  rationale: ישב kann »wohnen«, »sitzen« oder »sich niederlassen« bedeuten. Nach dem Ortswechsel hebt »sich niederlassen« die Aufnahme eines Wohnsitzes treffend hervor.
- source_word: בְּעָרֵי חֶבְרוֹן
  choice: in den Ortschaften im Gebiet von Hebron
  rationale: עָרֵי kann »Städte« oder allgemeiner »Ortschaften« bezeichnen. Die Formulierung kann die zu Hebron gehörenden Siedlungen beziehungsweise Orte des Hebroner Gebiets meinen; die Wiedergabe vermeidet den Eindruck mehrerer Großstädte namens Hebron.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Der Ortsname wird gemäß der etablierten deutschen biblischen Namensform transliteriert.
