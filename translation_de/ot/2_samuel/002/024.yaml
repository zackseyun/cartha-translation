  text: וַֽ/יִּרְדְּפ֛וּ יוֹאָ֥ב וַ/אֲבִישַׁ֖י אַחֲרֵ֣י אַבְנֵ֑ר וְ/הַ/שֶּׁ֣מֶשׁ בָּ֔אָה וְ/הֵ֗מָּה בָּ֚אוּ עַד גִּבְעַ֣ת אַמָּ֔ה אֲשֶׁר֙ עַל פְּנֵי גִ֔יחַ דֶּ֖רֶךְ מִדְבַּ֥ר גִּבְעֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/024.yaml
  text: Joab and Abishai pursued Abner[a], and the sun went down; and they came as far as the hill of Ammah[b], which is opposite Giah on the way to the wilderness of Gibeon.
translation:
  language: de
  text: Joab und Abischai verfolgten Abner. Als die Sonne unterging, kamen sie bis zum Hügel Amma, der Giach gegenüberliegt[a], am Weg zur Wüste von Gibeon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der vor Giach liegt“; der hebräische Ausdruck kann eine Lage vor oder gegenüber einem Ort bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an der Straße zur Wüste von Gibeon“; das hebräische Wort kann sowohl „Weg“ als auch „Straße“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵי אַבְנֵר
  choice: Joab und Abischai verfolgten Abner
  rationale: רדף mit אַחֲרֵי bezeichnet hier im militärischen Erzählzusammenhang eine Verfolgung; im Deutschen wird die Präposition idiomatisch in das transitive Verb „verfolgen“ aufgenommen.
- source_word: וְהַשֶּׁמֶשׁ בָּאָה
  choice: Als die Sonne unterging
  rationale: Die wörtliche Wendung „die Sonne kam“ ist ein hebräisches Idiom für den Sonnenuntergang. Der temporale Nebensatz gibt den Zusammenhang mit dem Erreichen des Ortes in natürlichem Deutsch wieder.
- source_word: וְהֵמָּה בָּאוּ עַד
  choice: kamen sie bis zu
  rationale: עַד bezeichnet bei einer Ortsangabe die erreichte Grenze; „bis zu“ bewahrt diesen räumlichen Endpunkt.
- source_word: גִּבְעַת אַמָּה
  choice: zum Hügel Amma
  rationale: Die Status-constructus-Verbindung bezeichnet einen Hügel mit dem Eigennamen Amma. „Hügel Amma“ ist eine klare, knappe deutsche Ortsbezeichnung.
- source_word: אֲשֶׁר עַל־פְּנֵי גִיחַ
  choice: der Giach gegenüberliegt
  rationale: עַל־פְּנֵי kann eine Lage vor oder gegenüber einem Ort ausdrücken; „gegenüberliegt“ ist geografisch natürlich, ohne eine Himmelsrichtung festzulegen.
- source_word: דֶּרֶךְ מִדְבַּר גִּבְעוֹן
  choice: am Weg zur Wüste von Gibeon
  rationale: דֶּרֶךְ kann Weg oder Straße bedeuten und bezeichnet hier wahrscheinlich die Route zur mit Gibeon verbundenen Wüste.
- source_word: יוֹאָב / אֲבִישַׁי / אַבְנֵר / אַמָּה / גִּיחַ / גִּבְעוֹן
  choice: Joab / Abischai / Abner / Amma / Giach / Gibeon
  rationale: Die Personen- und Ortsnamen werden in geläufiger deutscher Bibelschreibung wiedergegeben.
