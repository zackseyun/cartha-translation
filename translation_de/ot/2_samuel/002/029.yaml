base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/029.yaml
  text: And Abner and his men traveled through the Arabah all that night[a], crossed the Jordan, went through all the Bithron, and came to Mahanaim.
translation:
  language: de
  text: Abner und seine Männer zogen die ganze Nacht durch die Araba, überquerten den Jordan, zogen durch ganz Bithron[a] und kamen nach Mahanajim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise: „durch das ganze Schluchtengebiet“. Das hebräische Wort Bithron kann eine Ortsbezeichnung oder eine beschreibende geografische Bezeichnung sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֲרָבָה
  choice: durch die Araba
  rationale: עֲרָבָה bezeichnet hier im Reiseweg wahrscheinlich die geografische Jordansenke beziehungsweise Araba und nicht nur allgemein eine Ebene. Die Wiedergabe als geografische Bezeichnung bewahrt diesen Sinn.
- source_word: כָּל הַלַּיְלָה הַהוּא
  choice: die ganze Nacht
  rationale: Die Wendung bezeichnet die gesamte Dauer jener Nacht; „die ganze Nacht“ ist im Deutschen natürlich und präzise.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: überquerten den Jordan
  rationale: עבר mit dem Jordan als direktem Objekt bezeichnet eindeutig das Überschreiten des Flusses.
- source_word: כָּל הַבִּתְרוֹן
  choice: durch das ganze Bitron
  rationale: הַבִּתְרוֹן kann eine Orts- oder Gebietsbezeichnung sein, lässt sich aufgrund seiner Wortbildung aber möglicherweise auch als Schluchten- oder Einschnittgebiet verstehen. Die Transliteration vermeidet eine vorschnelle Festlegung.
- source_word: מַחֲנָיִם
  choice: Mahanajim
  rationale: Der Ortsname wird in einer im Deutschen gut lesbaren Transliteration wiedergegeben und nicht übersetzt.
- source_word: הָלְכוּ / וַיֵּלְכוּ / וַיָּבֹאוּ
  choice: zogen … zogen … kamen
  rationale: „Zogen“ passt natürlich zu einer militärischen Gruppe auf einem längeren Weg, ohne die Fortbewegungsart unnötig festzulegen; „kamen“ gibt die Ankunft schlicht wieder.
- source_word: וַאֲנָשָׁיו
  choice: seine Männer
  rationale: Dies entspricht dem wörtlichen Sinn und passt zum militärischen Zusammenhang, ohne ausdrücklich „Soldaten“ zu interpretieren.
