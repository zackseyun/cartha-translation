source:
  edition: WLC
  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שּׁוֹפָ֔ר וַ/יַּֽעַמְדוּ֙ כָּל הָ/עָ֔ם וְ/לֹֽא יִרְדְּפ֥וּ ע֖וֹד אַחֲרֵ֣י יִשְׂרָאֵ֑ל וְ/לֹֽא יָסְפ֥וּ ע֖וֹד לְ/הִלָּחֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/028.yaml
  text: Then Joab blew the trumpet[a], and all the people stood still, and they no longer pursued Israel or continued to fight.
translation:
  language: de
  text: Da blies Joab das Signalhorn[a]. Das ganze Volk blieb stehen; sie verfolgten Israel nicht weiter und kämpften auch nicht weiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Horn“; das hebräische Wort שׁוֹפָר bezeichnet ein Horn, das als Signalinstrument verwendet wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: blies
  rationale: תקע bezeichnet mit בַּשּׁוֹפָר idiomatisch das Blasen eines Signalinstruments. „Blies“ ist im Deutschen natürlich und bewahrt die konkrete Handlung.
- source_word: בַּשּׁוֹפָר
  choice: das Signalhorn
  rationale: שׁוֹפָר ist ein Horn, das hier als Signalinstrument dient. „Signalhorn“ vermittelt Funktion und Gegenstand klar, ohne das Material unnötig auf Widderhorn festzulegen.
- source_word: וַיַּעַמְדוּ כָּל הָעָם
  choice: Das ganze Volk blieb stehen
  rationale: עמד bedeutet wörtlich „stehen“, bezeichnet im militärischen Zusammenhang aber das Anhalten. „Blieb stehen“ bewahrt das Bild und macht die gemeinte Unterbrechung der Verfolgung verständlich.
- source_word: הָעָם
  choice: das ganze Volk
  rationale: Der hebräische Text sagt „das ganze Volk“. Gemeint ist in diesem Zusammenhang Joabs Streitmacht; die allgemeinere Quellenaussage bleibt dennoch erhalten.
- source_word: יִרְדְּפוּ עוֹד אַחֲרֵי יִשְׂרָאֵל
  choice: sie verfolgten Israel nicht weiter
  rationale: רדף אחרי bedeutet „hinter jemandem her sein/verfolgen“; die Negation mit עוֹד ergibt „nicht weiter“.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird entsprechend dem hebräischen Text unverändert wiedergegeben, obwohl hier konkret Abners israelitische Streitmacht gemeint ist.
- source_word: וְלֹא יָסְפוּ עוֹד לְהִלָּחֵם
  choice: und kämpften auch nicht weiter
  rationale: יסף mit Infinitiv bezeichnet das Fortsetzen beziehungsweise erneute Tun. Negiertes עוֹד wird natürlich mit „nicht weiter“ wiedergegeben; „auch“ bildet die zweite eingestellte Handlung ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Situation wird durch „Signalhorn“ und den Kontext deutlich, während „das ganze Volk“ die Formulierung des hebräischen Textes bewahrt. Die Wiederholung von „nicht weiter“ bildet die parallelen hebräischen Aussagen klar ab.
