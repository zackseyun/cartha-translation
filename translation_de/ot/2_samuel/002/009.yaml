  text: וַ/יַּמְלִכֵ֨/הוּ֙ אֶל הַ/גִּלְעָ֔ד וְ/אֶל הָ/אֲשׁוּרִ֖י וְ/אֶֽל יִזְרְעֶ֑אל וְ/עַל אֶפְרַ֨יִם֙ וְ/עַל בִּנְיָמִ֔ן וְ/עַל יִשְׂרָאֵ֖ל כֻּלֹּֽ/ה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/009.yaml
  text: and made him king over Gilead[a], over the Ashurites, over Jezreel, over Ephraim, over Benjamin, and over all Israel.
translation:
  language: de
  text: Er setzte ihn als König über Gilead, über die Aschuriter[a], über Jesreel, über Ephraim, über Benjamin und über ganz Israel ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „die Aschuriter“. Manche verstehen den Ausdruck als „Ascher“, also als Bezeichnung für den Stamm oder das Gebiet Ascher.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּמְלִכֵהוּ
  choice: Er setzte ihn als König … ein
  rationale: Der Hifil von מלך mit Objektsuffix bezeichnet das Einsetzen eines Menschen als König. Die deutsche Wendung gibt den kausativen Sinn natürlich und präzise wieder.
- source_word: אֶל / עַל
  choice: über
  rationale: In Verbindung mit der Einsetzung zum König bezeichnen beide Präpositionen hier den Herrschaftsbereich; im Deutschen ist „über“ dafür idiomatisch.
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Eingebürgerte deutsche Form des Gebietsnamens.
- source_word: הָאֲשׁוּרִי
  choice: die Aschuriter
  rationale: Der masoretisch vokalisierte Text weist auf eine Bezeichnung der Zugehörigkeit hin, deren Singular kollektiv verstanden werden kann. Da die Form textlich beziehungsweise geografisch schwierig ist, bleibt die mögliche Deutung als „Ascher“ in der Fußnote erhalten.
- source_word: יִזְרְעֶאל
  choice: Jesreel
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: אֶפְרַיִם
  choice: Ephraim
  rationale: Eingebürgerte deutsche Form des Stammesnamens.
- source_word: בִּנְיָמִן
  choice: Benjamin
  rationale: Eingebürgerte deutsche Form des Stammesnamens.
- source_word: יִשְׂרָאֵל כֻּלֹּה
  choice: ganz Israel
  rationale: כֻּלֹּה hebt die vollständige Ausdehnung der Herrschaft hervor; „ganz Israel“ ist knapp und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Präposition „über“ bewahrt die feierliche Aufzählungsstruktur des Hebräischen; die schwierige Bezeichnung הָאֲשׁוּרִי wird im Haupttext nicht stillschweigend zu „Ascher“ geändert.
