  text: Abner turned behind him and said[a], “Are you Asahel?” And he said, “I am.”
translation:
  language: de
  text: 'Abner wandte sich um und sagte: „Bist du es, Asaël?“ Er sagte: „Ich bin es.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: wandte sich … um
  rationale: פנה bezeichnet hier das Sichumwenden während der Verfolgung; die deutsche Wendung ist natürlich und wahrt die Bewegungsbedeutung.
- source_word: אַחֲרָיו
  choice: nach hinten
  rationale: Die Präpositionalverbindung bezeichnet die Richtung hinter Abner; „nach hinten“ erhält den räumlichen Sinn, ohne ein bloßes Zurückblicken festzulegen.
- source_word: הֲאַתָּה זֶה
  choice: Bist du es
  rationale: Die Verbindung aus Fragepartikel, Personalpronomen und Demonstrativum dient der Identifizierung. „Bist du es?“ ist im Deutschen idiomatisch und bildet die hervorgehobene Identitätsfrage ab.
- source_word: עֲשָׂהאֵל
  choice: Asaël
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: אָנֹכִי
  choice: Ja
  rationale: Das selbstständige Pronomen ist hier eine knappe bestätigende Selbstaussage. Im Deutschen gibt „Ja“ die dialogische Funktion natürlicher wieder als das missverständliche „Ich bin es“, ohne zusätzlichen Inhalt einzuführen.
