base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/002.yaml
  text: 'So David went up there[a], and also his two wives: Ahinoam the Jezreelite and Abigail, the wife of Nabal the Carmelite.'
translation:
  language: de
  text: 'Da zog David dorthin hinauf, ebenso seine beiden Frauen: Ahinoam aus Jesreel und Abigail, die Frau Nabals, der aus Karmel stammte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Abigail, die Frau Nabals, des Karmeliters.“ Das maskuline Herkunftswort bezieht sich auf Nabal und bezeichnet ihn als Mann aus Karmel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל שָׁם
  choice: Da zog David dorthin hinauf
  rationale: עלה bezeichnet ein Hinaufziehen oder Hinaufgehen; שָׁם verweist auf das zuvor genannte Ziel. „Dorthin hinaufziehen“ bewahrt die Richtungsangabe und passt zu einer Reise mit Angehörigen.
- source_word: וְגַם שְׁתֵּי נָשָׁיו
  choice: ebenso seine beiden Ehefrauen
  rationale: וְגַם hat additive Bedeutung. „Ehefrauen“ gibt im heutigen Deutsch eindeutig wieder, dass נָשִׁים hier Davids Frauen im ehelichen Sinn bezeichnet.
- source_word: אֲחִינֹעַם הַיִּזְרְעֵלִית
  choice: Ahinoam aus Jesreel
  rationale: Das feminine Herkunftsadjektiv bezeichnet Ahinoam als Frau aus Jesreel; die Herkunftsformulierung ist im modernen Deutsch natürlicher als „die Jesreelitin“.
- source_word: וַאֲבִיגַיִל אֵשֶׁת נָבָל הַכַּרְמְלִי
  choice: und Abigail, die Frau Nabals aus Karmel
  rationale: Die Beschreibung knüpft Abigail literarisch an Nabal und die vorausgehende Erzählung. Das maskuline הַכַּרְמְלִי bezieht sich grammatisch auf Nabal und bezeichnet dessen Herkunft aus Karmel.
theological_decisions:
- issue: Abigail wird weiterhin als „Frau Nabals“ bezeichnet, obwohl sie nun Davids Ehefrau ist.
  choice: die Frau Nabals
  alternative: die frühere Frau Nabals / die Witwe Nabals
  rationale: Der hebräische Text sagt weder ausdrücklich „frühere Frau“ noch „Witwe“. Die spannungsvolle Identifizierung durch ihre frühere Ehe wird daher ohne erklärende Ergänzung bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Dorthin hinauf“ erhält die räumliche Nuance des Hebräischen; „Ehefrauen“ vermeidet die mögliche Mehrdeutigkeit von „Frauen“.
