source:
  edition: WLC
  text: וַ/יִּֽתְקַבְּצ֤וּ בְנֵֽי בִנְיָמִן֙ אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּהְי֖וּ לַ/אֲגֻדָּ֣ה אֶחָ֑ת וַ/יַּ֣עַמְד֔וּ עַ֥ל רֹאשׁ גִּבְעָ֖ה אֶחָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/025.yaml
  text: Then the sons of Benjamin gathered together behind Abner[a], became one band[b], and took their stand on the top of one hill.
translation:
  language: de
  text: Da sammelten sich die Benjaminiter hinter Abner[a], schlossen sich zu einer einzigen Schar[b] zusammen und bezogen auf dem Gipfel eines Hügels Stellung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Abner folgend“. Die hebräische Wendung kann sowohl eine räumliche Stellung („hinter“) als auch Gefolgschaft ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu einer einzigen Gruppe“ beziehungsweise „zu einem einzigen Verband“. Das hebräische Wort bezeichnet eine fest zusammengeschlossene Schar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: sammelten sich
  rationale: Die Hitpael-Form von קבץ bezeichnet ein gemeinschaftliches Sichversammeln; „sammelten sich“ ist natürlich und gibt das erneute Zusammenfinden im Kampfgeschehen wieder.
- source_word: בְנֵי בִנְיָמִן
  choice: die Benjaminiter
  rationale: Wörtlich „die Söhne Benjamins“; als Stammesbezeichnung ist „die Benjaminiter“ im modernen Deutschen klarer und idiomatischer.
- source_word: אַחֲרֵי אַבְנֵר
  choice: hinter Abner
  rationale: אַחֲרֵי kann sowohl die räumliche Stellung hinter jemandem als auch das Folgen unter dessen Führung bezeichnen. „Hinter Abner“ bewahrt das Bild und die Mehrdeutigkeit weitgehend.
- source_word: לַאֲגֻדָּה אֶחָת
  choice: zu einer einzigen Schar
  rationale: אֲגֻדָּה bezeichnet eine zusammengebundene beziehungsweise geschlossene Gruppe; „Schar“ passt zum militärischen Zusammenhang, während „einzigen“ ihre Geschlossenheit hervorhebt.
- source_word: וַיַּעַמְדוּ
  choice: bezogen … Stellung
  rationale: עמד meint im Kampfzusammenhang nicht nur das Stehen, sondern das Einnehmen und Halten einer Position.
- source_word: עַל רֹאשׁ גִּבְעָה אֶחָת
  choice: auf dem Gipfel eines Hügels
  rationale: רֹאשׁ bedeutet topografisch „Gipfel“ oder „Höhe“. Das unbestimmte „eines Hügels“ gibt אֶחָת hier natürlich wieder, ohne eine kontrastive Zählung zu erzwingen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stammesbezeichnung wird idiomatisch mit „Benjaminiter“ wiedergegeben; die militärische Situation klingt in „Schar“ und „Stellung beziehen“ an. Die mögliche Doppeldeutigkeit von אַחֲרֵי wird durch eine Fußnote bewahrt.
