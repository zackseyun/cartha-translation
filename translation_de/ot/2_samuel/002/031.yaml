  text: But David’s servants struck down three hundred and sixty men from Benjamin and from Abner’s men[a].
translation:
  language: de
  text: Doch[a] Davids Männer schlugen dreihundertsechzig Männer unter den Benjaminitern und unter Abners Männern nieder; sie starben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und Davids Männer …« Das hebräische Bindewort kann schlicht »und« bedeuten; »doch« hebt hier den Gegensatz zum Verlustbericht im vorhergehenden Vers hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַבְדֵי דָוִד
  choice: Doch Davids Männer
  rationale: Das einleitende וְ kann schlicht »und« bedeuten, trägt hier nach dem Verlustbericht in Vers 30 aber natürlich einen kontrastierenden Sinn. עֲבָדִים bezeichnet in diesem militärischen Zusammenhang Davids Gefolgsleute beziehungsweise Kämpfer; »Männer« ist im Deutschen natürlicher als »Diener« und vermeidet die unzutreffende Betonung eines Sklavenstatus.
- source_word: הִכּוּ
  choice: erschlugen
  rationale: נכה bezeichnet das Schlagen oder Niederstrecken; im Kampfzusammenhang und zusammen mit מֵתוּ ist hier eindeutig ein tödlicher Ausgang gemeint. »Erschlugen« gibt die militärische Gewalttat knapp wieder.
- source_word: מִ/בִּנְיָמִן
  choice: aus Benjamin
  rationale: מִן kennzeichnet die Gruppe, aus der die Gefallenen stammten; »Benjamin« bleibt entsprechend dem Hebräischen als Stammesbezeichnung stehen.
- source_word: וּ/בְ/אַנְשֵׁי אַבְנֵר
  choice: und von Abners Männern
  rationale: Die Wendung bezeichnet neben Benjamin die Abner zugehörigen Männer. Die unterschiedliche hebräische Präposition wird in natürlichem Deutsch mit »von« wiedergegeben, ohne die Gruppenzugehörigkeit zu verwischen.
- source_word: שְׁלֹשׁ מֵאוֹת וְ/שִׁשִּׁים אִישׁ
  choice: 360 Männer
  rationale: Die Zahl wird unmittelbar und idiomatisch wiedergegeben; אִישׁ steht nach der Zahl im Singular, verlangt im Deutschen jedoch den Plural.
- source_word: מֵתוּ
  choice: sie starben
  rationale: Das ausdrückliche Verb מות wird nicht stillschweigend ausgelassen. Ein selbstständiger Nachsatz bewahrt die hebräische Aussage über den tödlichen Ausgang, auch wenn sie nach »erschlugen« im Deutschen teilweise redundant wirkt.
