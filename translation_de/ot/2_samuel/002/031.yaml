translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wurde für gute Verständlichkeit geglättet, während das im Hebräischen ausdrücklich vorhandene »sie starben« erhalten bleibt. Die Schreibung der Zahl als Ziffer entspricht einem gut lesbaren modernen Register.
