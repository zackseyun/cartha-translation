review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des Hebräischen zutreffend wieder: die Männer Judas kommen, salben David dort zum König über das Haus Juda und teilen David die Bestattung Sauls durch die Männer von Jabesch-Gilead mit. Die unpersönliche Wiedergabe „berichtete man David“ verdeckt jedoch den im hebräischen Plural fortgeführten Handlungsträger und schwächt die erzählerische Verknüpfung mit den zuvor genannten Männern Judas.'
  naturalness: Die Sprache ist insgesamt modernes, würdiges Deutsch. „Und sie berichteten David“ ist hier ebenso natürlich wie „Dann berichtete man David“, aber quellennäher. Die Spaltkonstruktion „waren es, die“ ist zwar möglich, setzt jedoch eine Hervorhebung voraus, die der hebräische Relativsatz אשר für sich genommen nicht verlangt. Die schlichte deutsche Aussage ist idiomatischer.
  terminology: „Männer“, „salbten“, „zum König“ und „Haus Juda“ sind angemessen und bewahren sowohl die Geschlechtsmarkierung von אנשי als auch die korporative Metapher בית יהודה. „Jabesch-Gilead“ ist eine geläufige deutsche Namensform.
  issues:
  - severity: medium
    issue: Unpersönliches „man“ bei der Mitteilung an David
    rationale: ויגידו steht im Plural und setzt im Erzählfluss am naheliegendsten die zuvor genannten Männer Judas als Subjekt fort. „Sie berichteten David“ bewahrt diese Anbindung, ohne über das Hebräische hinauszugehen.
  - severity: medium
    issue: Spaltkonstruktion und Fußnote zur angeblichen identifizierenden Mehrdeutigkeit
    rationale: Der Relativsatz אשר קברו bedeutet regulär „die Saul begraben haben“ und kodiert nicht eigenständig eine zwingende Kontrast- oder Identifikationsbetonung. „waren es, die“ fügt eine solche Betonung ein; die Fußnote stellt die einfache Wiedergabe daher irreführend als bloße Alternative dar. Eine einfache Aussage ist im Deutschen die natürliche, semantisch ausreichende Wiedergabe.
  revised_text: 'Da kamen die Männer von Juda, und dort salbten sie David zum König über das Haus Juda. Und sie berichteten David: »Die Männer von Jabesch-Gilead haben Saul begraben.«'
