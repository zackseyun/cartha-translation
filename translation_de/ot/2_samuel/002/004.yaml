revisions:
- from: 'Da kamen die Männer von Juda, und dort salbten sie David zum König über das Haus Juda. Dann berichtete man David: »Die Männer von Jabesch-Gilead waren es, die Saul begraben haben.[a]«'
  to: 'Da kamen die Männer von Juda, und dort salbten sie David zum König über das Haus Juda. Und sie berichteten David: »Die Männer von Jabesch-Gilead haben Saul begraben.«'
  rationale: Die Revision erhält die Satzfolge, die Ortsangabe, die königliche Salbung und das Bild „Haus Juda“. Sie macht den pluralischen Erzählanschluss bei ויגידו sichtbar und ersetzt die überbetonende Spaltkonstruktion durch eine natürliche deutsche Wiedergabe des berichteten Sachverhalts. Da keine bedeutungstragende, im Deutschen zu dokumentierende Textvariante verbleibt, entfällt die Fußnote samt Marker.
