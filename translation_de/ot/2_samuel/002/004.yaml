  text: וַ/יָּבֹ֨אוּ֙ אַנְשֵׁ֣י יְהוּדָ֔ה וַ/יִּמְשְׁחוּ שָׁ֧ם אֶת דָּוִ֛ד לְ/מֶ֖לֶךְ עַל בֵּ֣ית יְהוּדָ֑ה וַ/יַּגִּ֤דוּ לְ/דָוִד֙ לֵ/אמֹ֔ר אַנְשֵׁי֙ יָבֵ֣ישׁ גִּלְעָ֔ד אֲשֶׁ֥ר קָבְר֖וּ אֶת שָׁאֽוּל־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/004.yaml
  text: Then the men of Judah came[a], and there they anointed David king over the house of Judah. And they told David, saying, "The men of Jabesh-gilead were the ones who buried Saul."
translation:
  language: de
  text: 'Da kamen die Männer von Juda, und dort salbten sie David zum König über das Haus Juda. Und sie berichteten David: »Die Männer von Jabesch-Gilead haben Saul begraben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Das wayyiqtol von בוא schildert hier die Ankunft; „da kamen“ ist im deutschen Erzählstil natürlich und wahrt den Fortgang der Handlung.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: die Männer von Juda
  rationale: אַנְשֵׁי bezeichnet ausdrücklich Männer; „von Juda“ gibt ihre Zugehörigkeit in natürlichem Deutsch wieder.
- source_word: וַיִּמְשְׁחוּ
  choice: salbten
  rationale: משׁח ist im königlichen Zusammenhang der übliche Ausdruck für die Salbung und bewahrt deren politische wie religiöse Bedeutung.
- source_word: לְמֶלֶךְ עַל בֵּית יְהוּדָה
  choice: zum König über das Haus Juda
  rationale: „Zum König“ ist die idiomatische deutsche Ergänzung zu „salben“; „Haus Juda“ bewahrt das korporative und stammesbezogene Bild von בֵּית יְהוּדָה.
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: Dann berichtete man David
  rationale: Die ungenannt bleibenden Mitteilenden werden im Deutschen natürlich mit „man“ wiedergegeben; der Inhalt der Mitteilung folgt unmittelbar nach dem Doppelpunkt, sodass ein wörtliches „indem sie sagten“ unnötig schwerfällig wäre.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: die Männer von Jabesch-Gilead
  rationale: אַנְשֵׁי wird geschlechtsgenau mit „Männer“ wiedergegeben; Jabesch-Gilead ist die geläufige deutsche Form des Ortsnamens.
- source_word: אֲשֶׁר קָבְרוּ אֶת שָׁאוּל
  choice: waren es, die Saul begraben haben
  rationale: Die deutsche Spaltkonstruktion bringt die mögliche identifizierende Hervorhebung des Relativsatzes zum Ausdruck, ohne die schlichtere Lesart auszuschließen; diese wird in der Fußnote genannt.
theological_decisions:
- issue: Geschlechtsspezifische Sammelbezeichnung אַנְשֵׁי
  choice: An beiden Stellen „Männer“
  alternative: „Leute“ oder „Bewohner“
  rationale: Das hebräische Wort bezeichnet lexikalisch Männer. Der erzählerische Zusammenhang lässt männliche Vertreter oder führende Männer erwarten; eine geschlechtsneutrale Wiedergabe würde die Formulierung des Ausgangstextes verallgemeinern.
- issue: Das Bild „Haus Juda“
  choice: „Haus Juda“ im Haupttext beibehalten
  alternative: „Juda“ oder „Stamm Juda“
  rationale: Die Formulierung bewahrt den korporativen beziehungsweise stammesbezogenen Ausdruck des Hebräischen und legt ihn nicht unnötig auf eine rein territoriale oder moderne politische Bedeutung fest.
- issue: Identifizierende Kraft des abschließenden Relativsatzes
  choice: „waren es, die Saul begraben haben“
  alternative: „haben Saul begraben“
  rationale: Die hervorgehobene deutsche Form gibt die mögliche Identifikation der Bestattenden wieder. Da der hebräische Relativsatz auch schlicht attributiv verstanden werden kann, bleibt die einfachere Wiedergabe als Fußnotenalternative erhalten.
translation_notes:
  register: Moderne, würdige deutsche Erzählsprache. „Haus Juda“ bleibt als bewusst quellennahes biblisches Bild erhalten; schwerfällige Nachbildung von לֵאמֹר wird vermieden. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Schlussaussage.
