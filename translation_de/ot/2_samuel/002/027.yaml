  text: וַ/יֹּ֣אמֶר יוֹאָ֔ב חַ֚י הָֽ/אֱלֹהִ֔ים כִּ֥י לוּלֵ֖א דִּבַּ֑רְתָּ כִּ֣י אָ֤ז מֵֽ/הַ/בֹּ֨קֶר֙ נַעֲלָ֣ה הָ/עָ֔ם אִ֖ישׁ מֵ/אַחֲרֵ֥י אָחִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/027.yaml
  text: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
translation:
  language: de
  text: 'Joab erwiderte: »So wahr Gott lebt: Wenn du nicht gesprochen hättest, dann wäre das Volk schon am Morgen abgezogen, jeder von der Verfolgung seines Bruders.[a][b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wäre das Volk vom Morgen an hinaufgezogen, jeder hinter seinem Bruder her weg«.'
    reason: Die hebräische Zeitangabe kann die zeitliche Beziehung knapp ausdrücken; »hinaufgezogen« gibt die Grundbedeutung von עלה wieder.
  - marker: b
    text: 'Oder: »jeder hätte aufgehört, seinem Bruder zu folgen bzw. ihn zu verfolgen«.'
    reason: Die Wendung »jeder hinter seinem Bruder her« bezeichnet im Zusammenhang wahrscheinlich das Ende der gegenseitigen Verfolgung.
lexical_decisions:
- source_word: חַי הָאֱלֹהִים
  choice: So wahr Gott lebt
  rationale: Die feste hebräische Schwurformel wird mit der entsprechenden natürlichen deutschen Wendung wiedergegeben.
- source_word: לוּלֵא דִּבַּרְתָּ
  choice: Wenn du nicht gesprochen hättest
  rationale: לוּלֵא leitet hier mit dem Perfekt eine irreale Bedingung ein; das Objekt von »sprechen« bleibt wie im Hebräischen unausgesprochen.
- source_word: כִּי אָז
  choice: hätte …
  rationale: Die Partikelfolge führt den Folgesatz der irrealen Bedingung ein. Im Deutschen wird dies natürlich durch die Konjunktivform ausgedrückt, ohne beide Partikeln gesondert zu übersetzen.
- source_word: מֵהַבֹּקֶר
  choice: erst am Morgen
  rationale: Im Zusammenhang bedeutet die Zeitangabe wahrscheinlich, dass die Verfolgung ohne Abners Einspruch bis zum Morgen angedauert hätte. Die formal näherliegende, aber mehrdeutige Wiedergabe wird in einer Fußnote genannt.
- source_word: נַעֲלָה
  choice: hätte … abgebrochen
  rationale: עלה bedeutet grundsätzlich »hinaufgehen«, bezeichnet hier im militärischen Zusammenhang jedoch wahrscheinlich das Abziehen beziehungsweise das Beenden der Verfolgung. Eine wörtlichere Alternative steht in der Fußnote.
- source_word: אִישׁ מֵאַחֲרֵי אָחִיו
  choice: das Volk die Verfolgung seiner Brüder
  rationale: Wörtlich steht »jeder hinter seinem Bruder her«. Im Kontext sind Angehörige desselben Volkes gemeint, die einander verfolgen; die deutsche Fassung gibt diesen Sinn verständlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schwurformel bleibt prägnant; die schwer verständliche militärische Wendung wird im Haupttext kontextgemäß wiedergegeben, während die formale Struktur und ihre Mehrdeutigkeit in den Fußnoten erhalten bleiben.
