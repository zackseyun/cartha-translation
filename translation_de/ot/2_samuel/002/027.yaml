review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe der Schwurformel und der irrealen Bedingung ist zutreffend. Die Hauptaussage verschiebt jedoch die Zeitangabe מֵהַבֹּקֶר: »erst am Morgen« bedeutet, dass der Abbruch bis zum Morgen aufgeschoben worden wäre, während der hebräische Text wörtlich »vom/seit dem Morgen« sagt und im Kontext eher einen bereits am Morgen erfolgten Abzug nahelegt. Auch die Fassung sollte die nur kontextuell erschlossene Bedeutung von עלה als Abziehen nicht als alleinige Bedeutung ausgeben.'
  naturalness: »So wahr Gott lebt« und die Satzfügung sind modernes, würdiges Standarddeutsch. »Die Verfolgung seiner Brüder« ist verständlich, verdeckt aber die im Hebräischen wiederholte Einzelperspektive (»jeder ... seinem Bruder«).
  terminology: Gottesbezeichnung, Schwurformel und Personenname sind angemessen. »Abziehen« ist in diesem militärischen Zusammenhang eine natürliche kontextuelle Wiedergabe von עלה, sollte aber durch eine Fußnote mit der Grundbedeutung »hinaufziehen« abgesichert werden.
  issues:
  - severity: high
    issue: »erst am Morgen« kehrt die zeitliche Blickrichtung von מֵהַבֹּקֶר um.
    rationale: Die Präposition מן bedeutet hier »vom/seit dem Morgen«; zusammen mit אָז kann dies als »schon am Morgen« verstanden werden. »Erst am Morgen« fügt eine Verzögerung hinzu, die der hebräische Text nicht ausdrückt.
  - severity: medium
    issue: Die Hauptfassung legt »die Verfolgung ... abgebrochen« als eindeutige Bedeutung fest.
    rationale: עלה heißt zunächst »hinaufgehen/ziehen«. Der Kontext spricht für das Abziehen bzw. Aufhören der Verfolgung, doch diese Deutung ist nicht die lexikalische Grundbedeutung und sollte als solche kenntlich bleiben.
  - severity: low
    issue: Die Formulierung »seiner Brüder« verallgemeinert die hebräische Einzelformel.
    rationale: אִישׁ מֵאַחֲרֵי אָחִיו lautet wörtlich etwa »jeder hinter seinem Bruder her«. Eine Wiedergabe mit »jeder ... seines Bruders« erhält die Struktur und vermeidet eine unnötig kollektive Umformung.
