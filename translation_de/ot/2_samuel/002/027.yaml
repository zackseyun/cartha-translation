  to: 'Joab erwiderte: »So wahr Gott lebt: Wenn du nicht gesprochen hättest, dann wäre das Volk schon am Morgen abgezogen, jeder von der Verfolgung seines Bruders.[a][b]«'
  rationale: Die Zeitangabe wird nicht länger mit dem gegenteiligen »erst am Morgen« wiedergegeben. Die kontextgemäße militärische Deutung wird im Haupttext natürlich formuliert, während die wörtliche Bedeutung von עלה sowie die knappe und auslegungsbedürftige Wendung über das Folgen hinter dem Bruder in Fußnoten transparent bleiben.
