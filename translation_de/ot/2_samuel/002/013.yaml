base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
translation:
  language: de
  text: Joab, der Sohn Zerujas, und Davids Gefolgsleute zogen aus und trafen am Teich[a] von Gibeon mit ihnen zusammen. Die einen setzten sich auf der einen Seite des Teiches, die anderen auf der anderen Seite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wasserbecken von Gibeon“; das hebräische Wort kann einen angelegten Teich oder ein Wasserreservoir bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב בֶּן צְרוּיָה
  choice: Joab, der Sohn Zerujas
  rationale: Die Abstammungsangabe wird vollständig und in natürlichem modernem Deutsch wiedergegeben; der eröffnende hebräische Erzählungsanschluss muss im Deutschen nicht eigens mit „und“ markiert werden.
- source_word: וְ/עַבְדֵי דָוִד
  choice: und Davids Gefolgsleute
  rationale: עֲבָדִים bezeichnet hier im militärischen Zusammenhang Davids unterstellte Männer. „Gefolgsleute“ vermeidet den heute vorwiegend häuslich verstandenen Ausdruck „Diener“, ohne vorschnell „Soldaten“ festzulegen.
- source_word: יָצְאוּ
  choice: zogen aus
  rationale: Gibt das gewöhnliche Verb יצא wieder und lässt zugleich den im Kontext naheliegenden Aufbruch einer bewaffneten Gruppe erkennen, ohne ein bestimmtes Marschieren auszumalen.
- source_word: וַ/יִּפְגְּשׁוּ/ם ... יַחְדָּו
  choice: trafen ... mit ihnen zusammen
  rationale: Die Form wahrt sowohl das Objektsuffix „sie/ihnen“, das auf die zuvor genannten Männer Abners verweist, als auch יחדו „zusammen“.
- source_word: עַל בְּרֵכַת גִּבְעוֹן
  choice: am Teich von Gibeon
  rationale: בְּרֵכָה kann einen angelegten Teich oder ein Wasserbecken bezeichnen. „Am“ gibt die räumliche Lage idiomatisch wieder.
- source_word: וַ/יֵּשְׁבוּ
  choice: setzten sich
  rationale: In der geschilderten Handlung bezeichnet ישב das Einnehmen einer sitzenden Position; „setzten sich“ ist im Deutschen natürlicher als das statische „saßen“.
- source_word: אֵלֶּה ... וְ/אֵלֶּה
  choice: die einen ... die anderen
  rationale: Die korrelative deutsche Wendung bildet den Gegensatz der beiden Gruppen klar ab, ohne zusätzliche Bezeichnungen einzuführen.
- source_word: עַל הַ/בְּרֵכָה מִ/זֶּה ... עַל הַ/בְּרֵכָה מִ/זֶּה
  choice: auf die eine Seite des Teiches ... auf die andere Seite
  rationale: Die wörtlich schwerfällige hebräische Ortswendung bezeichnet die gegenüberliegenden Seiten desselben Teiches; die deutsche Form macht diese räumliche Gegenüberstellung verständlich.
