base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/022.yaml
  text: Abner said again to Asahel[a], “Turn aside from following me. Why should I strike you to the ground? Then how could I lift up my face to Joab your brother?”
translation:
  language: de
  text: 'Abner sagte noch einmal zu Asaël: »Lass davon ab, mir zu folgen! Warum sollte ich dich zu Boden schlagen? Wie könnte ich dann deinem Bruder Joab noch unter die Augen treten?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... לֵאמֹר
  choice: sagte noch einmal
  rationale: Die hebräische Fügung bezeichnet ein erneutes Sprechen; die deutsche Formulierung gibt ihren iterativen Sinn natürlich wieder.
- source_word: סוּר לְךָ מֵאַחֲרַי
  choice: Lass davon ab, mir zu folgen
  rationale: סוּר fordert zum Abwenden auf, während מֵאַחֲרַי hier idiomatisch das Hinterhergehen beziehungsweise Verfolgen bezeichnet.
- source_word: לָמָּה אַכֶּכָּה אַרְצָה
  choice: Warum sollte ich dich zu Boden schlagen?
  rationale: Die Wendung bewahrt das konkrete Bild des Niederschlagens zu Boden, ohne ausdrücklich »töten« einzusetzen, obwohl der Zusammenhang tödliche Gewalt nahelegt.
- source_word: וְאֵיךְ אֶשָּׂא פָנַי אֶל
  choice: Wie könnte ich dann ... noch unter die Augen treten?
  rationale: Das hebräische Bild »mein Angesicht zu jemandem erheben« drückt aus, ob man einer Person nach einer beschämenden Tat noch begegnen kann. Die deutsche Redewendung vermittelt denselben Sinn und behält die Körperbildlichkeit teilweise bei.
- source_word: עֲשָׂהאֵל / אַבְנֵר / יוֹאָב
  choice: Asaël / Abner / Joab
  rationale: Die Personennamen folgen geläufigen deutschen Bibelschreibungen; der Trema in Asaël macht die getrennte Aussprache der Vokale deutlich.
