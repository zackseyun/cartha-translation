source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֥ה דֶּ֨בֶר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/הַ/בֹּ֖קֶר וְ/עַד עֵ֣ת מוֹעֵ֑ד וַ/יָּ֣מָת מִן הָ/עָ֗ם מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/015.yaml
  text: So Yahweh sent a plague on Israel from the morning until the appointed time[a], and seventy thousand men of the people died, from Dan to Beersheba.
translation:
  language: de
  text: Da sandte Jahwe vom Morgen an bis zur bestimmten Zeit[a] eine Seuche über Israel. Siebzigtausend Männer aus dem Volk starben, von Dan bis Beerscheba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zur festgesetzten Zeit“. Die hebräische Wendung kann eine bestimmte oder festgesetzte Zeit bezeichnen; weniger wahrscheinlich ist hier: „bis zur Versammlungszeit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ließ … kommen
  rationale: Das Verb bedeutet wörtlich „gab“, bezeichnet mit דֶּבֶר aber idiomatisch, dass Jahwe die Seuche über Israel bringt. „ließ … kommen“ bewahrt die ausdrückliche göttliche Urheberschaft, ohne sie zu einer bloßen Zulassung abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דֶּבֶר
  choice: Seuche
  rationale: „Seuche“ ist im heutigen Deutsch klar und bezeichnet hier treffend eine tödliche, das Volk treffende Plage.
- source_word: בְּיִשְׂרָאֵל
  choice: über Israel
  rationale: In Verbindung mit „kommen lassen“ gibt „über Israel“ die gegen das Land beziehungsweise Volk hereinbrechende Seuche natürlich wieder.
- source_word: מֵהַבֹּקֶר
  choice: von jenem Morgen an
  rationale: Der Artikel verweist im Erzählzusammenhang auf den betreffenden Morgen; diese Formulierung ist im Deutschen natürlicher als „vom Morgen an“.
- source_word: וְעַד עֵת מוֹעֵד
  choice: bis zur festgesetzten Zeit
  rationale: מוֹעֵד bezeichnet hier am wahrscheinlichsten einen bestimmten oder festgesetzten Zeitpunkt. Die Formulierung lässt offen, welcher Zeitpunkt genau gemeint ist.
- source_word: וַיָּמָת מִן הָעָם
  choice: Vom Volk starben
  rationale: Die Konstruktion bezeichnet diejenigen, die aus der Mitte beziehungsweise aus der Gesamtheit des Volkes starben; „Vom Volk starben“ ist knapp und textnah.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: von Dan bis Beerscheba
  rationale: Die feste geografische Wendung bezeichnet die ganze Ausdehnung Israels und wird im Deutschen idiomatisch so wiedergegeben.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: siebzigtausend Männer
  rationale: אִישׁ ist nach der Zahl distributiv gebraucht und ausdrücklich maskulin; „Männer“ bewahrt diese Form.
theological_decisions:
- issue: Göttliche Urheberschaft des Gerichts
  choice: So ließ Jahwe … eine Seuche über Israel kommen
  alternative: So ließ Jahwe eine Seuche in Israel zu
  rationale: Der hebräische Text schreibt Jahwe die Handlung unmittelbar zu. Eine Wiedergabe als bloße Zulassung würde diese Aussage abschwächen.
- issue: Bedeutung von עֵת מוֹעֵד
  choice: bis zur festgesetzten Zeit
  alternative: bis zur Versammlungszeit
  rationale: Die Wendung bezeichnet im Kontext am ehesten einen festgelegten zeitlichen Endpunkt. Da מוֹעֵד andernorts auch eine Versammlung oder deren Termin bezeichnen kann, wird die weniger wahrscheinliche Möglichkeit in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge des hebräischen Textes zu verändern. Der Gottesname wird als „Jahwe“ wiedergegeben; die geografische Gesamtformel und die maskuline Personenbezeichnung bleiben erhalten.
