  text: וַ/יֹּאמֶר֩ דָּוִ֨ד אֶל יְהוָ֜ה בִּ/רְאֹת֣/וֹ אֶֽת הַ/מַּלְאָ֣ךְ הַ/מַּכֶּ֣ה בָ/עָ֗ם וַ/יֹּ֨אמֶר֙ הִנֵּ֨ה אָנֹכִ֤י חָטָ֨אתִי֙ וְ/אָנֹכִ֣י הֶעֱוֵ֔יתִי וְ/אֵ֥לֶּה הַ/צֹּ֖אן מֶ֣ה עָשׂ֑וּ תְּהִ֨י נָ֥א יָדְ/ךָ֛ בִּ֖/י וּ/בְ/בֵ֥ית אָבִֽ/י־׀־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/017.yaml
  text: Then David said to the LORD, when he saw the angel striking the people, “Look, I have sinned, and I have done wrong; but these sheep—what have they done? Please let your hand be against me and against my father's house.”
translation:
  language: de
  text: 'Als David den Engel sah, der das Volk schlug, sagte er zum HERRN: »Sieh doch, ich habe gesündigt, und ich habe Unrecht getan. Aber diese Schafe – was haben sie getan? Lass doch deine Hand gegen mich und gegen das Haus meines Vaters sein!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens bewahrt dessen besondere Funktion und entspricht dem vertrauten Bibelregister.
- source_word: הַמַּלְאָךְ הַמַּכֶּה
  choice: der Engel, der das Volk schlug
  rationale: Das Partizip wird als laufende bzw. beobachtete Handlung wiedergegeben; »schlagen« wahrt die Härte und Breite des hebräischen Ausdrucks.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Gibt den eindringlichen deiktischen Ausruf natürlich wieder, ohne ihn zu einer bloßen logischen Partikel abzuschwächen.
- source_word: הֶעֱוֵיתִי
  choice: ich habe Unrecht getan
  rationale: Bewahrt neben »ich habe gesündigt« die zweite, inhaltlich verwandte Selbstaussage, ohne beide Verben gleichzusetzen.
- source_word: הַצֹּאן
  choice: diese Schafe
  rationale: Erhält Davids Hirtenmetapher für das Volk und macht die demonstrative Bezugnahme deutlich.
- source_word: בְבֵית אָבִי
  choice: gegen das Haus meines Vaters
  rationale: »Haus« bewahrt die mögliche Bedeutung von Familie bzw. Sippe und vermeidet eine vorschnelle Verengung auf ein Gebäude.
theological_decisions:
- issue: Davids Schuldbekenntnis gegenüber dem Leiden des Volkes
  choice: 'Die rhetorische Spannung bleibt stehen: David bekennt seine Schuld und fragt, was die als Schafe bezeichneten Menschen getan haben.'
  alternative: Die Aussage so umzuformulieren, dass das Volk ausdrücklich als völlig schuldlos oder David als alleiniger Schuldiger bezeichnet wird.
  rationale: Der hebräische Text formuliert eine rhetorische Frage und liefert an dieser Stelle keine ausdrückliche dogmatische Auflösung.
- issue: Bedeutung von Gottes »Hand«
  choice: Das konkrete biblische Bild »deine Hand gegen mich« wird beibehalten.
  alternative: Deutend mit »deine Strafe« oder »dein Gericht« wiedergeben.
  rationale: Die Metapher kann Gericht und wirksames Eingreifen umfassen; ihre Bildkraft und Bedeutungsbreite sollen erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, emotional eindringlicher Rede. Die Satzstellung wurde für natürliches Deutsch angepasst; Wiederholungen und die Schafmetapher des Hebräischen bleiben erhalten.
