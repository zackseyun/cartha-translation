base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/004.yaml
  text: But the king’s word prevailed against Joab and against the commanders of the army, so Joab and the commanders of the army went out from before the king to count the people of Israel.
translation:
  language: de
  text: Doch das Wort des Königs setzte sich gegen Joab und die Heerführer durch. So gingen Joab und die Heerführer vom König fort, um das Volk Israel zu zählen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק דְּבַר הַמֶּלֶךְ
  choice: Doch das Wort des Königs setzte sich … durch
  rationale: Die Formulierung gibt die wörtliche Vorstellung wieder, dass der Befehl beziehungsweise Entschluss des Königs stärker war und sich trotz des Widerstands durchsetzte.
- source_word: אֶל יוֹאָב וְעַל שָׂרֵי הֶחָיִל
  choice: gegen Joab und die Heerführer
  rationale: Die Präpositionen bezeichnen hier die Personen, deren Einwand vom königlichen Wort überwunden wurde; „gegen“ bewahrt diesen Widerstandsaspekt.
- source_word: שָׂרֵי הֶחָיִל
  choice: die Heerführer
  rationale: Im militärischen Zusammenhang bezeichnet der Ausdruck die Befehlshaber des Heeres; „Heerführer“ ist natürlich und prägnant.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: vom König hinaus
  rationale: Der hebräische Ausdruck bedeutet räumlich „vom Angesicht/vor dem König weg“; die idiomatische deutsche Wiedergabe beschreibt das Verlassen seiner Gegenwart.
- source_word: לִפְקֹד אֶת הָעָם אֶת יִשְׂרָאֵל
  choice: um das Volk Israel zu zählen
  rationale: פקד bezeichnet hier im Kontext der angeordneten Volkszählung das Erfassen beziehungsweise Zählen; die appositionale Folge „das Volk, Israel“ wird natürlich als „das Volk Israel“ wiedergegeben.
theological_decisions:
- issue: Widerstand Joabs und der Heerführer gegen den königlichen Befehl
  choice: „setzte sich gegen … durch“
  alternative: „behielt die Oberhand über …“
  rationale: 'Die gewählte Fassung erhält die im Hebräischen erkennbare Spannung: Der königliche Wille zwingt sich trotz ihres Widerstands durch, ohne zusätzliche Motive oder Bewertungen einzutragen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz bleibt nahe am markanten hebräischen Bild vom wirksamen „Wort“ des Königs; der zweite wird idiomatisch und klar formuliert.
