base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/014.yaml
  text: Then David said to Gad[a], “I am in great distress. Let us fall, please, into the hand of Yahweh, for his mercies are many[b]; but let me not fall into the hand of man.”
translation:
  language: de
  text: 'Da sagte David zu Gad: „Ich bin in großer Bedrängnis. Lass uns doch in die Hand Jahwes fallen, denn sein Erbarmen ist groß[a]. Aber in die Hand eines Menschen[b] will ich nicht fallen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „denn zahlreich sind seine Erbarmungen“; idiomatisch auch: „denn sein Erbarmen ist groß“.'
    reason: Kennzeichnet die hebräische Pluralform korrekt und erläutert die idiomatische deutsche Singularwiedergabe.
  - marker: b
    text: 'Gemeint ist: unter die Macht oder Verfügungsgewalt eines Menschen.'
    reason: Erläutert die hebräische Wendung „in die Hand“ und den generischen Gebrauch von אָדָם.
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Ich bin in großer Bedrängnis
  rationale: Die prädikative Wendung mit לִי bezeichnet Davids persönliche, schwere Bedrängnis. Die gewählte Formulierung ist idiomatisch, würdevoll und bewahrt die emotionale Stärke.
- source_word: נִפְּלָה נָּא
  choice: Lass uns doch … fallen
  rationale: Der Kohortativ der 1. Person Plural bezieht David gemeinsam mit dem Volk ein. נָא verleiht der Aussage einen bittenden Ton, der im Deutschen natürlich durch „doch“ wiedergegeben wird.
- source_word: בְיַד יְהוָה
  choice: in die Hand Jahwes
  rationale: Das Bild von der „Hand“ bezeichnet Macht und Verfügungsgewalt. Die konkrete hebräische Metapher bleibt erhalten; der Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben.
- source_word: כִּי רַבִּים רַחֲמָיו
  choice: denn sein Erbarmen ist groß
  rationale: Der hebräische Plural bezeichnet die Fülle von Jahwes barmherzigem Erweisen. Der deutsche Singular „Erbarmen“ klingt natürlich und bewahrt zusammen mit „groß“ den Sinn der Aussage; die wörtlichere Form steht in der Fußnote.
- source_word: וּבְיַד אָדָם
  choice: Aber in die Hand eines Menschen
  rationale: אָדָם bezeichnet hier den Menschen im Gegensatz zu Jahwe. „Eines Menschen“ bewahrt den Singular und die rhetorische Gegenüberstellung, ohne das Wort auf einen bestimmten Mann einzuengen.
- source_word: אַל אֶפֹּלָה
  choice: möchte ich nicht fallen
  rationale: Die Verbindung aus אַל und der Form der 1. Person Singular drückt Davids nachdrücklichen Wunsch aus. „Möchte ich nicht“ gibt diesen volitiven Sinn in natürlichem Deutsch wieder und lässt den Wechsel vom vorangehenden Plural zum Singular sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn in geläufiger deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wechsel von der ersten Person Plural zur ersten Person Singular
  choice: „Lass uns … fallen“ und danach „möchte ich nicht fallen“
  alternative: Beide Aussagen einheitlich im Singular wiedergeben
  rationale: Der masoretische Text wechselt tatsächlich vom Plural נִפְּלָה zum Singular אֶפֹּלָה. Die Übersetzung bewahrt diese Spannung, statt sie stillschweigend auszugleichen.
- issue: Bedeutung von אָדָם im Gegensatz zu Jahwe
  choice: eines Menschen
  alternative: von Menschen / in menschliche Hände
  rationale: Der generische Singular stellt menschliche Verfügungsgewalt der Hand Jahwes gegenüber. Die Übersetzung erhält sowohl das Bild als auch den Singular.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Hand-Metapher und der auffällige Numeruswechsel bleiben erhalten; unnötig altertümliche Wendungen werden vermieden.
