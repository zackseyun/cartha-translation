base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/020.yaml
  text: Araunah looked out and saw the king and his servants passing by him[a]. So Araunah went out and bowed down to the king with his face to the ground.
translation:
  language: de
  text: Arauna blickte hinaus und sah den König und seine Diener auf ihn zukommen.[a] Da ging Arauna hinaus und warf sich vor dem König nieder, das Gesicht zur Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an ihm vorbeizogen“ oder „sich ihm näherten“; die hebräische Wendung beschreibt wörtlich die Bewegung des Königs und seiner Diener in Beziehung zu Arauna.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: hielt Ausschau
  rationale: Das Verb bezeichnet hier ein Schauen von einem erhöhten Standort oder aus einer Öffnung heraus. „Hielt Ausschau“ gibt diese Nuance in natürlichem Deutsch wieder.
- source_word: וַיַּרְא
  choice: sah
  rationale: 'Die schlichte Wiedergabe bewahrt die hebräische Erzählfolge: Arauna schaut hinaus und nimmt anschließend den König wahr.'
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עבד bezeichnet im königlichen Umfeld Diener oder Gefolgsleute. „Diener“ ist direkt und legt ihre genauere amtliche Stellung nicht fest.
- source_word: עֹבְרִים עָלָיו
  choice: auf ihn zukamen
  rationale: Die Wendung beschreibt eine Bewegung in Beziehung zu Arauna. Da David zu Araunas Tenne kommt, gibt „auf ihn zukamen“ den Zusammenhang verständlich wieder; die wörtlichere Bewegungsangabe bleibt in der Fußnote sichtbar.
- source_word: וַיֵּצֵא
  choice: ging ... hinaus
  rationale: Dies ist eine natürliche und direkte Wiedergabe von יצא aus der zuvor eingenommenen Perspektive Araunas.
- source_word: וַיִּשְׁתַּחוּ
  choice: verbeugte sich
  rationale: Das Verb bezeichnet Niederbeugung oder Prostration. Im Zusammenhang ist es eine Ehrenbezeugung gegenüber dem menschlichen König, ohne dass göttliche Anbetung ausgesagt wird.
- source_word: אַפָּיו אָרְצָה
  choice: mit dem Gesicht zur Erde
  rationale: Die idiomatische Wendung beschreibt eine tiefe Verbeugung bis zur Erde und wird im Deutschen anschaulich und würdig wiedergegeben.
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Die Namensform folgt dem hebräischen Text des Samuelbuchs; „Ornan“ gehört zur Parallelüberlieferung in der Chronik.
theological_decisions:
- issue: Art von Araunas Geste vor dem König
  choice: Ehrerbietung vor einem menschlichen König, wiedergegeben mit „verbeugte sich vor dem König“
  alternative: „warf sich vor dem König nieder“ oder kontextwidrig „betete den König an“
  rationale: Das hebräische Verb kann sowohl kultische Anbetung als auch höfische Ehrerbietung bezeichnen. Hier richtet sich die Geste an König David; die Übersetzung benennt die körperliche Handlung, ohne Anbetung zu unterstellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählfolge und die körperliche Ehrerbietung bleiben klar; die mehrdeutige Bewegungsangabe wird im Haupttext kontextgerecht und in der Fußnote formnäher wiedergegeben.
