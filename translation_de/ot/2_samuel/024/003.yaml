base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/003.yaml
  text: But Joab said to the king[a], “May Yahweh your God add to the people a hundred times as many as they are, and may the eyes of my lord the king see it. But why does my lord the king delight in this thing?”
translation:
  language: de
  text: 'Doch Joab sagte zum König: »Möge Jahwe, dein Gott, das Volk hundertmal so zahlreich machen, wie es jetzt ist, und möge mein Herr und König es mit eigenen Augen sehen.[a] Aber warum hat mein Herr und König Gefallen an dieser Sache?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und die Augen meines Herrn, des Königs, sehen«. Das Hebräische nennt kein Objekt ausdrücklich; gemeint ist, dass der König die Vermehrung selbst noch erleben soll.'
    reason: Im hebräischen Satz ist das Objekt von »sehen« nur aus dem Zusammenhang zu erschließen.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch … sagte
  rationale: Das narrative Waw führt die Handlung fort; »Doch« gibt zugleich den im Zusammenhang klaren Widerspruch Joabs gegen den königlichen Befehl wieder.
- source_word: וְיוֹסֵף
  choice: Möge … so zahlreich machen
  rationale: Die Verbform drückt hier einen Wunsch aus. Das idiomatische Deutsch gibt das wörtliche »hinzufügen« zusammen mit der folgenden Mengenangabe als Vermehrung der Volkszahl wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל הָעָם
  choice: das Volk
  rationale: עָם bezeichnet allgemein das Volk. Obwohl der Zusammenhang eine Zählung wehrfähiger Männer betrifft, vermeidet »Volk« eine unnötige Einengung auf das Heer.
- source_word: כָּהֵם וְכָהֵם מֵאָה פְעָמִים
  choice: hundertmal so zahlreich … wie es jetzt ist
  rationale: Die verdoppelte Wendung כָּהֵם וְכָהֵם bezeichnet zusammen mit »hundertmal« eine Vermehrung gegenüber dem gegenwärtigen Bestand; »wie es jetzt ist« macht diesen Vergleich im Deutschen verständlich.
- source_word: וְעֵינֵי אֲדֹנִי הַמֶּלֶךְ רֹאוֹת
  choice: und möge mein Herr und König es mit eigenen Augen sehen
  rationale: Die Wendung äußert Joabs Wunsch, der König möge die Vermehrung noch selbst erleben. Das Objekt bleibt im Hebräischen unausgesprochen; »es« sorgt für natürliches Deutsch, während die Fußnote darauf hinweist.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr und König
  rationale: Die höfische Anrede wird in einer natürlichen, würdigen deutschen Formel wiedergegeben.
- source_word: חָפֵץ בַּדָּבָר הַזֶּה
  choice: hat … Gefallen an dieser Sache
  rationale: Die Formulierung bewahrt die Bedeutung von חפץ als Gefallen oder Verlangen und lässt offen, ob die »Sache« den Befehl oder die Volkszählung als Ganzes bezeichnet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt es als persönlichen Gottesnamen, statt es durch einen Herrschaftstitel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Joabs höfische Anrede bleibt erkennbar, ohne altertümliche Syntax. Die adversative Beziehung zum vorausgehenden königlichen Befehl wird durch »Doch« markiert.
