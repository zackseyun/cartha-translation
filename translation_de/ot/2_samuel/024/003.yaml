  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und den Sinn des Hebräischen zuverlässig wieder: Joabs gegensätzliche Antwort, den Wunsch nach hundertfacher Vermehrung des Volkes, den Wunsch, dass der König dies selbst sehen möge, und die abschließende kritische Frage. »Jahwe« entspricht dem expliziten Gottesnamen יהוה. Das in »sehen« implizite Objekt wird mit »es« behutsam und idiomatisch ergänzt.'
  naturalness: Modernes Standarddeutsch mit angemessen würdigem Erzähl- und Hofregister. »Mein Herr und König« ist als höfische Anrede gut verständlich; »mit eigenen Augen sehen« ist eine natürliche deutsche Entsprechung der hebräischen Augen-Wendung. Die doppelte adversative Gestaltung mit »Doch« und »Aber« ist im Kontext vertretbar und macht Joabs Einwand klar.
  terminology: Die Namen- und Gottesnamenpraxis ist konsistent. »Volk« wahrt die Weite von עָם, ohne den Begriff auf das Heer einzuengen. »Gefallen an dieser Sache haben« bildet חָפֵץ בַּדָּבָר הַזֶּה angemessen ab, ohne den Gegenstand über das hebräische »diese Sache« hinaus festzulegen.
