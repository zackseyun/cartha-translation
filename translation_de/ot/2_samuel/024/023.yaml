base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/023.yaml
  text: Araunah the king gave all this to the king[a]. And Araunah said to the king[b], “May Yahweh your God accept you.”
translation:
  language: de
  text: 'Arauna, der König,[a] gab dies alles dem König. Und Arauna sagte zum König: »Möge Jahwe, dein Gott, dir wohlgesinnt sein.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Arauna, der König«. Der hebräische Text bezeichnet Arauna hier ausdrücklich als König; manche Übersetzungen lassen den ungewöhnlichen Titel weg.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: »dich annehmen«, »Gefallen an dir haben« oder »dir Gunst erweisen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: dies alles
  rationale: Bezieht sich zusammenfassend auf die unmittelbar zuvor angebotenen Dinge und gibt die umfassende Bedeutung natürlich wieder.
- source_word: נָתַן
  choice: gab
  rationale: Das Qatal wird im erzählenden Zusammenhang als einfache Vergangenheit wiedergegeben.
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Übliche deutsche Namensform im Samuelbuch; die Form Ornan aus der Chronik wird nicht übernommen.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der ungewöhnliche, aber textlich klare Titel nach Arauna bleibt als Apposition erhalten.
- source_word: לַמֶּלֶךְ
  choice: dem König
  rationale: Das Präfix ל bezeichnet hier David als Empfänger.
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Gibt die Fortführung der Erzählung schlicht und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen יהוה als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Der Singular mit Suffix der zweiten Person maskulin wird direkt wiedergegeben.
- source_word: יִרְצֶךָ
  choice: dich wohlwollend annehmen
  rationale: רצה bezeichnet hier gnädige beziehungsweise wohlgefällige Annahme; die Formulierung bewahrt sowohl den persönlichen als auch den kultischen Bezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als Jahwe bewahrt den persönlichen Gottesnamen.
- issue: Der Titel „der König“ bei Arauna
  choice: Arauna, der König
  alternative: Arauna; Arauna, o König
  rationale: Der masoretische Text enthält הַמֶּלֶךְ als Apposition zu Arauna. Trotz der sachlichen Auffälligkeit wird der Titel nicht stillschweigend beseitigt.
- issue: Bedeutungsumfang von יִרְצֶךָ
  choice: dich wohlwollend annehmen
  alternative: Gefallen an dir haben; dir Gunst erweisen
  rationale: Die Übersetzung hält die Spannung zwischen Annahme im Opferzusammenhang und persönlichem Wohlwollen offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Königstitulierung wird im Haupttext bewahrt; die Segensformel bleibt knapp und offen für ihren persönlichen wie kultischen Sinn.
