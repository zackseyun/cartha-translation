base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/007.yaml
  text: They came to the fortified city of Tyre and to all the cities of the Hivites and the Canaanites[a], and they went out to the Negev of Judah, to Beersheba.
translation:
  language: de
  text: Sie kamen zur befestigten Stadt Tyrus und zu allen Städten der Hiwiter und Kanaaniter. Dann zogen sie weiter in den Negev Judas[a], bis nach Beerscheba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Süden Judas«. Das hebräische Wort kann sowohl die als Negev bezeichnete Region als auch allgemein das südliche Gebiet bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: מִבְצַר צֹר
  choice: zur befestigten Stadt Tyrus
  rationale: מִבְצָר bezeichnet einen befestigten Ort oder eine Festung. Zusammen mit צֹר ist »die befestigte Stadt Tyrus« eine natürliche Wiedergabe, die den militärisch-geografischen Sinn bewahrt.
- source_word: וְכָל עָרֵי הַחִוִּי וְהַכְּנַעֲנִי
  choice: und zu allen Städten der Hiwiter und Kanaaniter
  rationale: Die vom vorausgehenden Bewegungsverb bestimmte Zielrichtung wird im Deutschen durch »zu« verdeutlicht. Die Völkernamen werden in ihrer üblichen deutschen Form wiedergegeben.
- source_word: וַיֵּצְאוּ
  choice: Dann zogen sie weiter
  rationale: יצא bedeutet grundsätzlich »hinausgehen/ausziehen«. Im Reisebericht leitet das Verb die nächste Wegstrecke ein; »zogen sie weiter« gibt diese Funktion in natürlichem Deutsch wieder, ohne eine zusätzliche Zielaussage einzutragen.
- source_word: אֶל נֶגֶב יְהוּדָה
  choice: in den Negev von Juda
  rationale: נֶגֶב kann sowohl die geografische Region Negev als auch allgemein den Süden bezeichnen. Im Zusammenhang dieser Reiseroute ist die Gebietsbezeichnung »Negev« naheliegend; die allgemeinere Bedeutung wird in der Fußnote genannt.
- source_word: בְּאֵר שָׁבַע
  choice: Beerscheba
  rationale: Übliche deutsche Schreibweise des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wegbeschreibung bleibt knapp; »Dann« macht lediglich die im Hebräischen durch die Verbfolge erkennbare Abfolge natürlich verständlich.
