  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל אֲרַ֗וְנָה לֹ֚א כִּֽי קָנ֨וֹ אֶקְנֶ֤ה מֵ/אֽוֹתְ/ךָ֙ בִּ/מְחִ֔יר וְ/לֹ֧א אַעֲלֶ֛ה לַ/יהוָ֥ה אֱלֹהַ֖/י עֹל֣וֹת חִנָּ֑ם וַ/יִּ֨קֶן דָּוִ֤ד אֶת הַ/גֹּ֨רֶן֙ וְ/אֶת הַ/בָּקָ֔ר בְּ/כֶ֖סֶף שְׁקָלִ֥ים חֲמִשִּֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/024.yaml
  text: But the king said to Araunah[a], “No, but I will surely buy it from you for a price[c][b]. I will not offer to Yahweh my God burnt offerings that cost me nothing.” So David bought the threshing floor and the cattle for fifty shekels of silver.
translation:
  language: de
  text: 'Doch der König sagte zu Arauna: »Nein, sondern ich will es unbedingt von dir gegen Bezahlung kaufen. Ich werde Yahweh, meinem Gott, keine Brandopfer darbringen, die mich nichts kosten.« So kaufte David die Tenne und die Rinder für fünfzig Schekel Silber.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 1. Chronik 21,25 zahlt David sechshundert Schekel Gold für den Ort; hier werden fünfzig Schekel Silber für die Tenne und die Rinder genannt.
    reason: cross_reference
lexical_decisions:
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Der Personenname wird entsprechend seiner hebräischen Form in diesem Vers deutsch transliteriert; »Ornan« gehört zur Parallelüberlieferung in 1. Chronik.
- source_word: קָנוֹ אֶקְנֶה
  choice: ich will es dir auf jeden Fall abkaufen
  rationale: Der absolute Infinitiv vor dem finiten Verb verstärkt die Aussage. »Auf jeden Fall« gibt den Nachdruck in natürlichem Deutsch wieder; »es« wird aus dem Zusammenhang ergänzt.
- source_word: בִּמְחִיר
  choice: zu einem Preis
  rationale: מְחִיר bezeichnet den Kaufpreis beziehungsweise eine Bezahlung und wird ohne zusätzliche Präzisierung wiedergegeben.
- source_word: אַעֲלֶה
  choice: darbringen
  rationale: Die Hifil-Form von עלה bezeichnet bei Opfergaben das Hinaufbringen beziehungsweise Darbringen auf dem Altar.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als »Yahweh« wiedergegeben.
- source_word: אֱלֹהַי
  choice: meinem Gott
  rationale: Das Suffix der ersten Person Singular bleibt erhalten und bewahrt Davids persönliche Aussage.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: Dies ist die geläufige deutsche Bezeichnung für Opfer, die vollständig auf dem Altar verbrannt werden.
- source_word: חִנָּם
  choice: die mich nichts kosten
  rationale: Wörtlich bedeutet das Wort »umsonst« oder »unentgeltlich«; im Kontext ist gemeint, dass David keine kostenlos erhaltenen Opfergaben darbringen will.
- source_word: הַגֹּרֶן
  choice: die Tenne
  rationale: »Tenne« ist die präzise und geläufige Bezeichnung für den landwirtschaftlichen Dreschplatz.
- source_word: הַבָּקָר
  choice: die Rinder
  rationale: בָּקָר ist eine kollektive Bezeichnung für Rindvieh; »Rinder« wahrt die Breite des Ausdrucks besser als das speziellere »Ochsen«.
- source_word: בְּכֶסֶף שְׁקָלִים חֲמִשִּׁים
  choice: für fünfzig Schekel Silber
  rationale: Die Formulierung gibt den Kaufpreis natürlich wieder und bewahrt sowohl Gewichtseinheit als auch Material.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar als Name wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חִנָּם im Opferkontext
  choice: Brandopfer, die mich nichts kosten
  alternative: Brandopfer umsonst
  rationale: Die gewählte Fassung macht die kontextuell naheliegende persönliche Kostenbeteiligung deutlich; die wörtlichere Möglichkeit bleibt semantisch enthalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Kaufzusage wird idiomatisch ausgedrückt. »Tenne«, »Brandopfer« und »Schekel« bewahren die konkrete historische und kultische Sprache des Ausgangstextes.
