  source_fidelity: 'Der erste Satz gibt Ort, Altarwidmung und Opferarten zutreffend wieder. „Jahwe ließ sich für das Land erbitten“ bildet den Niphal von עתר angemessen ab, ohne ein ausdrücklich genanntes Gebet in den Haupttext einzutragen. Die Schlussformulierung „die Plage über Israel wurde aufgehalten“ ist jedoch nicht ganz treffend: מֵעַל יִשְׂרָאֵל bezeichnet das Ab- bzw. Nachlassen der bereits über Israel befindlichen Plage, nicht primär eine Plage, die ‚über Israel‘ aufgehalten wird.'
