source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤ד מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יֵּעָתֵ֤ר יְהוָה֙ לָ/אָ֔רֶץ וַ/תֵּעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/025.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings[a]. So Yahweh responded to the land[c][b], and the plague was restrained from Israel.
translation:
  language: de
  text: Dort baute David einen Altar für Jahwe und brachte Brandopfer und Heilsopfer[a] dar. Da ließ Jahwe sich für das Land erbitten[b], und die Plage ließ von Israel ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Gemeinschaftsopfer; traditionell auch: Friedensopfer.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische bezeichnet eine günstige Reaktion auf Bitten oder Flehen; daher auch: „Jahwe erhörte das Gebet für das Land.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן שָׁם
  choice: Dort baute
  rationale: Gibt die erzählerische Verbform und den Rückverweis auf den zuvor genannten Ort knapp und natürlich wieder.
- source_word: מִזְבֵּחַ לַיהוָה
  choice: einen Altar für Jahwe
  rationale: „Altar“ ist die etablierte Entsprechung; ל bezeichnet hier die Widmung, und der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וַיַּעַל עֹלוֹת
  choice: brachte Brandopfer dar
  rationale: Die feste deutsche Opferformulierung gibt עלה im kultischen Zusammenhang idiomatisch wieder.
- source_word: וּשְׁלָמִים
  choice: Heilsopfer
  rationale: „Heilsopfer“ ist eine präzise, im Deutschen etablierte Bezeichnung für diese Opfergattung; die mögliche Deutung als Gemeinschaftsopfer wird in der Fußnote bewahrt.
- source_word: וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: Da ließ Jahwe sich für das Land erbitten
  rationale: Die Formulierung bewahrt den im Niphal von עתר enthaltenen Bezug auf eine Bitte, ohne ein im Satz nicht ausdrücklich genanntes Gebet als Objekt einzufügen; לָאָרֶץ wird als „für das Land“ wiedergegeben.
- source_word: וַתֵּעָצַר הַמַּגֵּפָה מֵעַל יִשְׂרָאֵל
  choice: die Plage über Israel wurde aufgehalten
  rationale: Bewahrt die passive Bedeutung von עצר und gibt מֵעַל יִשְׂרָאֵל anschaulich und natürlich als Beendigung der über Israel liegenden Plage wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im Haupttext als Name erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: Jahwe ließ sich für das Land erbitten
  alternative: Jahwe erhörte das Gebet für das Land
  rationale: Die gewählte Fassung erhält den semantischen Bezug auf Flehen oder Bitten, behauptet aber nicht ausdrücklich ein im hebräischen Satz unausgesprochenes Substantiv „Gebet“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe bleiben erkennbar, während Satzbau und Verben für heutige Leser natürlich formuliert sind.
