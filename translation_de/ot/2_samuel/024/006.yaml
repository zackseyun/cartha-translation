  text: וַ/יָּבֹ֨אוּ֙ הַ/גִּלְעָ֔דָ/ה וְ/אֶל אֶ֥רֶץ תַּחְתִּ֖ים חָדְשִׁ֑י וַ/יָּבֹ֨אוּ֙ דָּ֣נָ/ה יַּ֔עַן וְ/סָבִ֖יב אֶל צִידֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/006.yaml
  text: They came to Gilead and to the land of Tahtim-hodshi[a], and they came to Dan-jaan[b], and around to Sidon.
translation:
  language: de
  text: Sie kamen nach Gilead und in das Land Tahtim-Hodschi[a]. Dann kamen sie nach Dan-Ja'an[b] und zogen ringsum nach Sidon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck Tahtim-Hodschi ist unklar. Manche ändern oder deuten den Text etwa als „das Land der Hetiter bei Kadesch“; welcher Ort gemeint ist, bleibt jedoch unsicher.
    reason: alternative_reading
  - marker: b
    text: Dan-Ja'an ist wahrscheinlich ein Ortsname; seine genaue Lage ist unbekannt.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: sie kamen / dann kamen sie
  rationale: Das Wayyiqtol von בוא führt die Reisestationen in erzählerischer Folge an. Die Wiederholung wird bewahrt; „dann“ verdeutlicht im Deutschen den Fortgang.
- source_word: הַגִּלְעָדָה
  choice: nach Gilead
  rationale: Das Direktiv-he bezeichnet die Bewegung auf das Gebiet Gilead zu; im Deutschen ist „nach Gilead“ idiomatisch.
- source_word: אֶרֶץ
  choice: das Land
  rationale: אֶרֶץ bezeichnet hier ein geografisches Gebiet, nicht die Erde insgesamt.
- source_word: תַּחְתִּים חָדְשִׁי
  choice: Tahtim-Hodschi
  rationale: Die hebräische Wendung ist textlich und geografisch dunkel. Eine Transliteration bewahrt die Unsicherheit, ohne eine vermutete Identifikation in den Haupttext einzutragen.
- source_word: דָּנָה יַּעַן
  choice: nach Dan-Jaan
  rationale: Die Wortgruppe wird am ehesten als Ortsname mit Richtungsangabe verstanden. Die genaue Identifikation bleibt unsicher.
- source_word: וְסָבִיב אֶל צִידוֹן
  choice: und zogen weiter durch die Umgebung bis nach Sidon
  rationale: סָבִיב weist auf eine Bewegung durch das umliegende Gebiet beziehungsweise im Umkreis hin. Die verbale Ausformulierung ergibt natürliches Deutsch; אֶל bezeichnet die Richtung auf Sidon zu.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Form eines Reiseberichts bleibt erhalten, während „zogen weiter durch die Umgebung“ die elliptische hebräische Wendung natürlich wiedergibt. Unsichere Ortsnamen werden transliteriert und in Fußnoten erläutert.
