  naturalness: Die revidierte Fassung bleibt ein flüssiger, knapper Reisebericht in modernem Standarddeutsch. „Zogen ringsum nach Sidon“ ist idiomatisch genug und gibt die elliptische Wegbeschreibung zurückhaltend wieder.
  terminology: Gilead, Sidon und Kadesch sind geläufige deutsche biblische Namensformen. Die unsicheren Ortsbezeichnungen bleiben transliteriert. „Dan-Ja'an“ kennzeichnet das im Hebräischen vorhandene Ajin besser als „Dan-Jaan“, ohne eine unsichere Identifizierung zu behaupten.
