  text: וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל דָּוִ֔ד יִקַּ֥ח וְ/יַ֛עַל אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הַ/טּ֣וֹב ב/עינ/ו רְאֵה֙ הַ/בָּקָ֣ר לָ/עֹלָ֔ה וְ/הַ/מֹּרִגִּ֛ים וּ/כְלֵ֥י הַ/בָּקָ֖ר לָ/עֵצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/022.yaml
  text: Then Araunah said to David[a], “Let my lord the king take and offer up what is good in his eyes. Look, the oxen are for the burnt offering[b], and the threshing sledges and the implements of the oxen are for the wood.”
translation:
  language: de
  text: 'Da sagte Arauna zu David: „Mein Herr, der König, nehme und opfere, was ihm gut erscheint.[a] Sieh, hier sind die Rinder für das Brandopfer und die Dreschschlitten und das Gerät der Rinder[b] als Brennholz.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „was gut ist in seinen Augen“.'
    reason: Die Fußnote bewahrt die bildhafte hebräische Wendung, während der Haupttext ihre Bedeutung in natürlichem Deutsch wiedergibt.
  - marker: b
    text: 'Oder: „die Ausrüstung der Rinder“. Der hebräische Ausdruck ist weit gefasst und kann allgemein das hölzerne Zubehör der Rinder bezeichnen, das als Brennmaterial dienen sollte.'
    reason: Der genaue Umfang von כְלֵי הַבָּקָר bleibt offen; die Alternative macht diese lexikalische Breite sichtbar.
lexical_decisions:
- source_word: יִקַּח וְיַעַל
  choice: nehme und opfere
  rationale: Die Folge von Imperfektformen drückt hier eine ehrerbietige Erlaubnis beziehungsweise Einladung aus. Der deutsche Konjunktiv I bewahrt den höfisch-deferenziellen Ton; „opfern“ gibt עלה im Opferkontext natürlich wieder.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Mein Herr, der König
  rationale: Die Anrede verbindet Ehrerbietung und Königstitel. Die Apposition mit Komma ist im Deutschen natürlich und würdevoll.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: was ihm gut erscheint
  rationale: Die deutsche Formulierung vermittelt die Bedeutung der hebräischen Wendung verständlich, ohne die Entscheidung des Königs näher zu bestimmen; die wörtliche Bildsprache wird in der Fußnote bewahrt.
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ lenkt Davids Aufmerksamkeit auf die angebotenen Tiere und Geräte. „Sieh“ ist knapp, gegenwärtig und würdevoll.
- source_word: הַבָּקָר
  choice: die Rinder
  rationale: Der Begriff bezeichnet hier die Zugtiere beim Dreschen, die zugleich für das Opfer geeignet sind. „Rinder“ ist im modernen Deutschen natürlicher und weniger geschlechtsspezifisch als „Ochsen“.
- source_word: לָעֹלָה
  choice: für das Brandopfer
  rationale: עֹלָה bezeichnet das vollständig verbrannte Opfer. Der bestimmte Artikel passt zu dem in der Situation vorgesehenen Opfer.
- source_word: הַמֹּרִגִּים
  choice: die Dreschschlitten
  rationale: מוֹרַג bezeichnet ein zum Dreschen eingesetztes Brett- oder Schlitteninstrument; „Dreschschlitten“ ist die sachlich präzise und etablierte deutsche Bezeichnung.
- source_word: כְלֵי הַבָּקָר
  choice: das Gerät der Rinder
  rationale: כְּלִי ist ein weiter Begriff für Gerät oder Ausrüstung. Die Übersetzung vermeidet die nicht ausdrücklich im Hebräischen festgelegte Verengung auf Joche.
- source_word: לָעֵצִים
  choice: als Brennholz
  rationale: Die Geräte sollen als Holz für das Opferfeuer dienen. „Als Brennholz“ macht diese im Kontext eindeutige Funktion in natürlichem Deutsch klar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der höfische Ton wird durch „Mein Herr, der König“ und den Konjunktiv „nehme und opfere“ bewahrt. Archaische Ausdrücke werden vermieden, sachlich notwendige Begriffe wie „Brandopfer“ und „Dreschschlitten“ jedoch beibehalten.
