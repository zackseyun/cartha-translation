base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/005.yaml
  text: They crossed the Jordan and camped at Aroer[a], on the right side of the city that is in the middle of the valley of Gad[c][b], and toward Jazer.
translation:
  language: de
  text: Sie überquerten den Jordan und schlugen ihr Lager bei Aroër auf, rechts von der Stadt[a], die mitten im Tal von Gad[b] liegt, und in Richtung Jaser[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zur Rechten der Stadt“. Manche verstehen die Angabe geografisch als „südlich der Stadt“; der hebräische Wortlaut nennt jedoch die rechte Seite.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mitten im Bachtal/Wadi von Gad“. Das hebräische Wort kann ein Tal, eine Schlucht oder ein zeitweise wasserführendes Bachbett bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und nach Jaser“ beziehungsweise „und zu Jaser“. Die hebräische Präposition kann sowohl eine Richtung als auch ein Ziel angeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ אֶת־הַיַּרְדֵּן
  choice: Sie überquerten den Jordan
  rationale: עבר mit dem Jordan als direktem Objekt bezeichnet hier das Überschreiten des Flusses. „Den Jordan überqueren“ ist im modernen Deutschen natürlich und präzise.
- source_word: וַיַּחֲנוּ בַעֲרוֹעֵר
  choice: und schlugen ihr Lager bei Aroër auf
  rationale: חנה bezeichnet das Lagern beziehungsweise Aufschlagen eines Lagers. Bei einem Ortsnamen gibt ב hier den Lagerplatz an; „bei Aroër“ ist in einer Reiseroute idiomatisch.
- source_word: יְמִין הָעִיר
  choice: rechts von der Stadt
  rationale: ימין bedeutet wörtlich „rechte Seite/rechts“. Die Übersetzung bewahrt die räumliche Formulierung, ohne sie stillschweigend als Himmelsrichtung zu deuten.
- source_word: אֲשֶׁר בְּתוֹךְ הַנַּחַל הַגָּד
  choice: die mitten im Tal von Gad liegt
  rationale: Der Relativsatz bezieht sich am naheliegendsten auf „die Stadt“. נחל kann ein Tal, Bachtal, Wadi oder Bachbett bezeichnen; „Tal“ ist verständlich, während die genauere landschaftliche Spannweite in der Fußnote erhalten bleibt. הַגָּד wird als Gebietsbezeichnung „von Gad“ verstanden.
- source_word: וְאֶל יַעְזֵר
  choice: und in Richtung Jaser
  rationale: אל kann sowohl das Ziel („nach/zu“) als auch die Richtung („in Richtung“) angeben. Da der Vers nicht eindeutig sagt, dass Jaser erreicht wurde, bleibt die Übersetzung bei der weniger festlegenden Richtungsangabe.
