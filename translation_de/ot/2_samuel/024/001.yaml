source:
  edition: WLC
  text: וַ/יֹּ֨סֶף֙ אַף יְהוָ֔ה לַ/חֲר֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יָּ֨סֶת אֶת דָּוִ֤ד בָּ/הֶם֙ לֵ/אמֹ֔ר לֵ֛ךְ מְנֵ֥ה אֶת יִשְׂרָאֵ֖ל וְ/אֶת יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/001.yaml
  text: Again the anger of Yahweh burned against Israel[a], and he incited David against them, saying, “Go[b], count Israel and Judah.”
translation:
  language: de
  text: 'Wieder entbrannte der Zorn Jahwes gegen Israel[a], und er stachelte David gegen sie an: »Geh, zähle[b] Israel und Juda!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 1. Chronik 21,1 heißt es, Satan sei gegen Israel aufgetreten und habe David dazu angereizt. Der Haupttext folgt hier dem naheliegenden Subjekt des hebräischen Textes in 2. Samuel und bewahrt die Spannung zwischen den beiden Berichten, statt sie anzugleichen.
    reason: cross_reference
  - marker: b
    text: 'Oder: „erfasse Israel und Juda zahlenmäßig“ beziehungsweise „führe eine Volkszählung von Israel und Juda durch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: Wieder
  rationale: In Verbindung mit dem folgenden Ausdruck bezeichnet das Verb eine erneute Handlung. „Wieder“ gibt diesen Sinn knapp und natürlich wieder.
- source_word: אַף יְהוָה לַחֲרוֹת
  choice: der Zorn Jahwes entbrannte
  rationale: Die hebräische Wendung beschreibt Zorn bildhaft als etwas, das heiß wird oder entbrennt. Die deutsche Formulierung bewahrt dieses Bild in würdiger, geläufiger Sprache.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen des hebräischen Textes, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּיִשְׂרָאֵל
  choice: gegen Israel
  rationale: Die Präposition bezeichnet hier die Richtung des Zorns und wird im Deutschen idiomatisch mit „gegen“ wiedergegeben.
- source_word: וַיָּסֶת
  choice: er reizte … auf
  rationale: Das Verb סות im Hifil bedeutet, jemanden zu einer Handlung anzustiften, anzureizen oder aufzureizen. „Aufreizen“ lässt sich mit der folgenden Wendung „gegen sie“ natürlich verbinden.
- source_word: בָּהֶם
  choice: gegen sie
  rationale: Die Wendung ist schwierig. Im Zusammenhang bezeichnet sie am ehesten die gegen Israel gerichtete Veranlassung Davids; die Übersetzung bewahrt dabei den Personenbezug des Pronomens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt die direkte Rede im heutigen Deutsch natürlicher ein als eine wörtliche Wiedergabe mit „indem er sagte“.
- source_word: לֵךְ
  choice: Geh
  rationale: Direkte und natürliche Wiedergabe des hebräischen Imperativs.
- source_word: מְנֵה
  choice: zähle
  rationale: Das Verb bedeutet „zählen“ oder „zahlenmäßig erfassen“. „Zähle“ ist knapp und bewahrt die Form des Befehls.
- source_word: יִשְׂרָאֵל וְאֶת יְהוּדָה
  choice: Israel und Juda
  rationale: Die beiden Namen werden ohne erklärende Erweiterung wiedergegeben und bewahren die Unterscheidung des hebräischen Textes.
theological_decisions:
- issue: Göttliche Urheberschaft der Anreizung Davids im Verhältnis zu 1. Chronik 21,1
  choice: „er reizte David gegen sie auf“, wobei „er“ auf Jahwe zurückweist
  alternative: Ein unbestimmtes Subjekt („jemand reizte David auf“) oder eine Harmonisierung mit 1. Chronik 21,1 („Satan reizte David auf“)
  rationale: Das Subjekt von וַיָּסֶת ist grammatisch am natürlichsten dasselbe wie im unmittelbar vorausgehenden Satz, also Jahwe. Die Übersetzung folgt dem Wortlaut von 2. Samuel und lässt die Spannung zur Paralleldarstellung in 1. Chronik bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Gottesname wird als „Jahwe“ wiedergegeben. Die knappe direkte Rede und das Bild vom entbrennenden Zorn bleiben erhalten; schwierige beziehungsweise theologisch spannungsreiche Formulierungen werden nicht harmonisiert.
