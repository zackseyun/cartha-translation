base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/002.yaml
  text: So the king said to Joab[a], the commander of the army who was with him, “Go about now through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know the number of the people.”
translation:
  language: de
  text: 'Da sagte der König zu Joab, dem Befehlshaber des Heeres, der bei ihm war: „Zieh nun durch alle Stämme Israels, von Dan bis Beerscheba, und zählt[a] das Volk[b], damit ich die Zahl des Volkes erfahre.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „Zieh“ in der Einzahl, „zählt“ aber in der Mehrzahl. Der Wechsel kann Joab und weitere Beteiligte einschließen.
    reason: source_form
  - marker: b
    text: 'Oder: „registriert“ beziehungsweise „mustert das Volk“. Das hebräische Verb kann eine Zählung oder amtliche Erfassung bezeichnen, auch in militärischem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw mit Imperfekt führt die Erzählung weiter. „Da sagte“ gibt die Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: שַׂר הַחַיִל
  choice: Befehlshaber des Heeres
  rationale: שַׂר bezeichnet hier den leitenden militärischen Amtsträger, חַיִל die Streitmacht beziehungsweise das Heer. Die Formulierung ist modern, klar und würdevoll.
- source_word: אֲשֶׁר אִתּוֹ
  choice: der bei ihm war
  rationale: Die Wiedergabe bewahrt den Relativsatz und bezieht ihn wie im Hebräischen auf Joab.
- source_word: שׁוּט נָא
  choice: Zieh nun durch
  rationale: שׁוּט bezeichnet das Umherziehen oder Durchstreifen eines Gebiets. נָא mildert beziehungsweise akzentuiert die Aufforderung und wird hier idiomatisch mit „nun“ wiedergegeben.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: durch alle Stämme Israels
  rationale: Bei einem Verb der Bewegung gibt „durch“ das Bereisen des gesamten Stammesgebiets natürlich wieder.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: von Dan bis Beerscheba
  rationale: Die feste geografische Wendung bezeichnet die ganze Nord-Süd-Ausdehnung Israels; die Ortsnamen werden in ihrer üblichen deutschen Form wiedergegeben.
- source_word: וּפִקְדוּ
  choice: und zählt
  rationale: פקד bezeichnet hier das Zählen beziehungsweise Registrieren bei einer Erhebung. Die Pluralform des hebräischen Imperativs wird bewusst erhalten.
- source_word: אֶת הָעָם
  choice: das Volk
  rationale: עָם ist die allgemeine Bezeichnung für das Volk. Der militärische Zusammenhang rechtfertigt keine Verengung auf Soldaten oder wehrfähige Männer.
- source_word: וְיָדַעְתִּי אֵת מִסְפַּר הָעָם
  choice: damit ich die Zahl des Volkes kenne
  rationale: Im Zusammenhang drückt die Verbfolge den Zweck der angeordneten Zählung aus. Die Formulierung bleibt nahe am hebräischen Ausdruck „die Zahl des Volkes kennen“.
theological_decisions:
- issue: Umfang von הָעָם im militärisch-administrativen Zusammenhang
  choice: das Volk
  alternative: die Krieger / die Truppen / die wehrfähigen Männer
  rationale: Obwohl Joab als Heerführer angesprochen wird und die Zählung militärische Bedeutung haben kann, steht im Hebräischen עָם, nicht eine ausdrücklich auf Kämpfer begrenzte Bezeichnung. Die Übersetzung lässt den Umfang daher so offen wie der Ausgangstext.
- issue: Numeruswechsel in den Befehlen
  choice: Singular „Zieh“ und Plural „zählt“ beibehalten
  alternative: beide Aufforderungen im Singular wiedergeben oder „lass das Volk zählen“ formulieren
  rationale: Der hebräische Text wechselt tatsächlich vom an Joab gerichteten Singular שׁוּט zum Plural וּפִקְדוּ. Die Übersetzung glättet diesen Wechsel nicht stillschweigend, sondern erläutert ihn.
translation_notes:
  register: Moderner, würdevoller Standardstil. Die geografische Formel und die Wiederholung von „Volk“ bleiben erhalten. Der auffällige Numeruswechsel wird im Haupttext bewahrt und durch eine Fußnote verständlich gemacht.
