  text: וַ/יַּ֤עַל דָּוִד֙ כִּ/דְבַר גָּ֔ד כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/019.yaml
  text: So David went up according to the word of Gad, just as Yahweh had commanded.
translation:
  language: de
  text: Da ging David hinauf, nach dem Wort Gads, wie Jahwe geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: Da ging … hinauf
  rationale: עלה bezeichnet hier eine Aufwärtsbewegung. „ging hinauf“ bewahrt diese räumliche Nuance und klingt im Deutschen natürlicher als „stieg hinauf“.
- source_word: דָּוִד
  choice: David
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: כִּדְבַר
  choice: wie … es ihm gesagt hatte
  rationale: כ + דבר bedeutet wörtlich „gemäß dem Wort“. Die idiomatische Wiedergabe macht deutlich, dass David Gads Weisung folgte, ohne den hebräischen Ausdruck im Deutschen unnötig steif nachzubilden.
- source_word: גָּד
  choice: Gad
  rationale: Gebräuchliche deutsche Wiedergabe des Namens des Propheten.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Die Wendung drückt die genaue Entsprechung zwischen Gads Weisung und Jahwes Gebot aus.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass Jahwes Gebot Davids Handlung vorausging; „gebieten“ entspricht dem autoritativen Charakter von צוה.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die gebräuchliche deutsche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Verhältnis zwischen Gads Wort und Jahwes Gebot
  choice: „wie Gad es ihm gesagt hatte, so wie Jahwe es geboten hatte“
  alternative: „nach dem Wort Gads, wie Jahwe geboten hatte“
  rationale: Die gewählte Fassung erhält die Aussage, dass Gads Weisung dem Gebot Jahwes entsprach, ohne näher festzulegen, ob sich „geboten“ grammatisch auf Gad oder auf David bezieht; im Hebräischen fehlt ein ausdrückliches Objekt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt erzählerisch knapp; „Da“ führt die Handlung natürlich fort. Keine Fußnoten erforderlich.
