revisions:
- from: Da ging David hinauf, wie Gad es ihm gesagt hatte, so wie Jahwe es geboten hatte.
  to: Da ging David hinauf, nach dem Wort Gads, wie Jahwe geboten hatte.
  rationale: Die Revision gibt כִּדְבַר גָּד unmittelbar als „nach dem Wort Gads“ wieder, bewahrt die Richtung von „ging hinauf“ und lässt bei „wie Jahwe geboten hatte“ das im Hebräischen nicht genannte Objekt offen. Dadurch wird die Formulierung zugleich knapper und natürlicher.
