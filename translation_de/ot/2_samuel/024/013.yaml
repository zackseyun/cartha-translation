  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד וַ/יַּגֶּד ל֑/וֹ וַ/יֹּ֣אמֶר ל֡/וֹ הֲ/תָב֣וֹא לְ/ךָ֣ שֶֽׁבַע שָׁנִ֣ים רָעָ֣ב בְּ/אַרְצֶ֡/ךָ אִם שְׁלֹשָׁ֣ה חֳ֠דָשִׁים נֻסְ/ךָ֨ לִ/פְנֵֽי צָרֶ֜י/ךָ וְ/ה֣וּא רֹדְפֶ֗/ךָ וְ/אִם הֱ֠יוֹת שְׁלֹ֨שֶׁת יָמִ֥ים דֶּ֨בֶר֙ בְּ/אַרְצֶ֔/ךָ עַתָּה֙ דַּ֣ע וּ/רְאֵ֔ה מָה אָשִׁ֥יב שֹׁלְחִ֖/י דָּבָֽר־־־׀׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/013.yaml
  text: So Gad came to David and told him[a], and said to him[c][b], “Shall seven years of famine come to you in your land? Or will you flee three months before your adversaries while they pursue you? Or shall there be three days of pestilence in your land? Now know and see what answer I should return to the one who sent me.”
translation:
  language: de
  text: 'Da kam Gad zu David, teilte ihm mit und sagte: „Soll eine siebenjährige Hungersnot über dein Land kommen?[a] Oder wirst du drei Monate lang vor deinen Feinden[b] fliehen, während sie dich verfolgen? Oder soll drei Tage lang eine Seuche[c] in deinem Land wüten? Überlege nun und entscheide, welche Antwort ich dem überbringen soll, der mich gesandt hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der Parallelstelle 1. Chronik 21,12 steht „drei Jahre Hungersnot“ statt „sieben Jahre“.
    reason: textual_variant
  - marker: b
    text: 'Oder: „Bedrängern“ oder „Gegnern“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Pest“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גָד אֶל דָּוִד
  choice: Da kam Gad zu David
  rationale: Das narrative וַיָּבֹא wird idiomatisch mit „Da kam“ wiedergegeben; die Bewegung auf David zu bleibt erhalten.
- source_word: וַיַּגֶּד לוֹ
  choice: berichtete es ihm
  rationale: נגד im Hifil bezeichnet das Mitteilen oder Berichten. Das deutsche „es“ nimmt die zuvor empfangene Botschaft auf, ohne zusätzlichen Inhalt einzuführen.
- source_word: שֶׁבַע שָׁנִים רָעָב בְּאַרְצֶךָ
  choice: sieben Jahre Hungersnot über dein Land kommen
  rationale: רָעָב bezeichnet hier eine landesweite Hungersnot. „Über dein Land kommen“ bildet die Bewegungsvorstellung von תָבוֹא natürlich ab.
- source_word: שְׁלֹשָׁה חֳדָשִׁים נֻסְךָ לִפְנֵי צָרֶיךָ
  choice: drei Monate lang vor deinen Bedrängern fliehen
  rationale: Die elliptische hebräische Konstruktion wird im Deutschen zu einer verständlichen Alternative entfaltet. צַר bezeichnet feindliche Widersacher; „Bedränger“ passt zugleich zum folgenden Verfolgen.
- source_word: וְהוּא רֹדְפֶךָ
  choice: während sie dich verfolgen
  rationale: Das singularische Pronomen wird kollektiv auf die pluralischen Bedränger bezogen. Der deutsche Plural macht diesen Bezug grammatisch klar.
- source_word: שְׁלֹשֶׁת יָמִים דֶּבֶר
  choice: drei Tage lang die Pest
  rationale: דֶּבֶר bezeichnet eine verheerende Seuche beziehungsweise Pest. „Pest“ ist knapp, gewichtig und allgemein verständlich.
- source_word: עַתָּה דַּע וּרְאֵה
  choice: Nun überlege und entscheide
  rationale: Die wörtliche Doppelaufforderung „erkenne und sieh“ fordert im Kontext eine erwogene Entscheidung. Die funktionale Wiedergabe ist natürliches Deutsch und wahrt den Entscheidungsdruck.
- source_word: מָה אָשִׁיב שֹׁלְחִי דָּבָר
  choice: welche Antwort ich dem überbringen soll, der mich gesandt hat
  rationale: הֵשִׁיב דָּבָר ist eine Wendung für das Erteilen beziehungsweise Zurückbringen einer Antwort. „Überbringen“ passt zur Rolle des Boten.
theological_decisions:
- issue: Zahlenunterschied zur Parallelstelle 1. Chronik 21,12
  choice: Im Haupttext steht gemäß WLC „sieben Jahre Hungersnot“.
  alternative: Die Parallelstelle 1. Chronik 21,12 nennt „drei Jahre Hungersnot“.
  rationale: Der vorgegebene masoretische Ausgangstext wird übersetzt und nicht mit der Parallelstelle harmonisiert. Die abweichende Zahl wird transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei Alternativen sind parallel und klar formuliert. Archaische Wendungen wie „erkenne und sieh“ werden zugunsten einer kontextgemäßen, dennoch gewichtigen Aufforderung vermieden.
