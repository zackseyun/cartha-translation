base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/012.yaml
  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: de
  text: 'Geh hin und rede zu David: »So spricht Jahwe: Drei Dinge[a] lege ich dir vor. Wähle dir eines davon aus, und ich werde es dir antun.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nur: „drei“; das Bezugswort ist im Hebräischen nicht genannt. Möglich sind auch „dreierlei“ oder „drei Möglichkeiten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְדִבַּרְתָּ
  choice: Geh hin und rede
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt den Auftrag. „Geh hin und rede“ gibt den nachdrücklichen Befehl in natürlichem, würdigem Deutsch wieder.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel bewahrt den feierlichen Botenstil des Hebräischen.
- source_word: שָׁלֹשׁ
  choice: drei Dinge
  rationale: Im Hebräischen steht nur die Zahl „drei“; ein Bezugswort ist aus dem Zusammenhang zu ergänzen. „Dinge“ ist zurückhaltender als das stärker deutende „Möglichkeiten“.
- source_word: אָנֹכִי נוֹטֵל עָלֶיךָ
  choice: lege ich dir vor
  rationale: Die Formulierung gibt das Präsentieren der drei zur Auswahl stehenden Gerichte idiomatisch wieder, ohne bereits eines davon als auferlegt darzustellen.
- source_word: בְּחַר לְךָ אַחַת מֵהֶם
  choice: Wähle dir eines davon aus
  rationale: „Dir“ bildet den ethischen Dativ לְךָ ab und lässt Davids persönliche Verantwortung bei der Wahl erkennen.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: dann werde ich es dir antun
  rationale: Im Gerichtszusammenhang hat die Handlung eine nachteilige Richtung. „Antun“ gibt dies klarer wieder als das missverständliche „für dich tun“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von göttlichem Gericht und Davids Wahl
  choice: Drei Gerichte werden David vorgelegt; eines soll er selbst auswählen.
  alternative: Gott habe David lediglich drei neutrale Möglichkeiten angeboten.
  rationale: Die Übersetzung bewahrt sowohl Davids echte Wahlverantwortung als auch den belastenden Gerichtskontext, der in „dir antun“ deutlich wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Botenformel „So spricht Jahwe“ bleibt bewusst formal; ansonsten ist der Satzbau natürlich und knapp.
