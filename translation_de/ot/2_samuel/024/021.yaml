source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲרַ֔וְנָה מַדּ֛וּעַ בָּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אֶל עַבְדּ֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜ד לִ/קְנ֧וֹת מֵ/עִמְּ/ךָ֣ אֶת הַ/גֹּ֗רֶן לִ/בְנ֤וֹת מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וְ/תֵעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/021.yaml
  text: And Araunah said[a], “Why has my lord the king come to his servant?” And David said, “To buy the threshing floor from you, to build an altar to Yahweh, so that the plague may be stopped from being upon the people.”
translation:
  language: de
  text: 'Und Arauna sagte: „Warum ist mein Herr, der König, zu seinem Diener[a] gekommen?“ David antwortete: „Um die Tenne von dir zu kaufen und einen Altar für Jahwe zu bauen, damit die Plage vom Volk abgewendet wird.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu deinem Diener“. Wörtlich steht im Hebräischen „zu seinem Diener“, eine höfische Selbstbezeichnung in der dritten Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Gibt die direkte Frage nach dem Grund des königlichen Besuchs natürlich und genau wieder.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr, der König
  rationale: Bewahrt sowohl die ehrerbietige Anrede als auch den Königstitel; die Apposition klingt im modernen Deutschen natürlich.
- source_word: עַבְדּוֹ
  choice: seinem Diener
  rationale: Entspricht formal der hebräischen dritten Person und bewahrt Araunas höfische Selbstbezeichnung.
- source_word: לִקְנוֹת מֵעִמְּךָ אֶת הַגֹּרֶן
  choice: um die Tenne von dir zu kaufen
  rationale: Gibt den Zweckinfinitiv, den Kaufvorgang und den landwirtschaftlichen Ort klar und idiomatisch wieder.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: einen Altar zu bauen
  rationale: Direkte und im Deutschen übliche Wiedergabe des zweiten Zweckinfinitivs.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet hier die Widmung des Altars; „für“ ist im Deutschen natürlicher als „zu“. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְתֵעָצַר הַמַּגֵּפָה מֵעַל הָעָם
  choice: damit die Plage vom Volk abgewendet wird
  rationale: Gibt den beabsichtigten Ausgang, die passive Verbform und das Ende der auf dem Volk lastenden Plage in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Zweck oder sichere Folge des Altarbaus
  choice: damit die Plage vom Volk abgewendet wird
  alternative: und die Plage wird vom Volk abgewendet werden
  rationale: Die Satzfügung lässt hier den beabsichtigten Zweck beziehungsweise erhofften Ausgang erkennen; sie garantiert das Ergebnis nicht unabhängig von Gottes Handeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Distanz der Anrede bleibt erhalten, während Davids Antwort knapp und natürlich formuliert ist.
