id: 2SA.24.11
reference: 2 Samuel 24:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֥קָם דָּוִ֖ד בַּ/בֹּ֑קֶר וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל גָּ֣ד הַ/נָּבִ֔יא חֹזֵ֥ה דָוִ֖ד לֵ/אמֹֽרפ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/011.yaml
  text: When David arose in the morning[a], the word of Yahweh had come to Gad the prophet, David’s seer, saying,
translation:
  language: de
  text: Als David am Morgen aufstand, war das Wort Jahwes an den Propheten Gad, Davids Seher, ergangen:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „und das Wort Jahwes war an Gad“; möglich ist auch: „da erging das Wort Jahwes an Gad“.'
    reason: Die hebräische Wendung הָיָה אֶל ist formal stativ und legt das genaue Zeitverhältnis nicht eindeutig fest.
lexical_decisions:
- source_word: וַיָּקָם
  choice: aufstand
  rationale: Das Wayyiqtol von קום führt die Erzählung fort; „aufstand“ ist im Deutschen natürlich und gibt den Vorgang präzise wieder.
- source_word: בַּבֹּקֶר
  choice: am Morgen
  rationale: Die Zeitangabe wird idiomatisch und ohne unnötige Präzisierung wiedergegeben.
- source_word: וּדְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ bewahrt die prophetische Offenbarungsformel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: הָיָה אֶל
  choice: war … ergangen
  rationale: Die hebräische Wendung bedeutet wörtlich etwa „war an/zu“ und bezeichnet hier das Ergehen des göttlichen Wortes. Das Plusquamperfekt lässt erkennen, dass dies beim morgendlichen Aufstehen Davids bereits geschehen war.
- source_word: גָּד הַנָּבִיא
  choice: den Propheten Gad
  rationale: Die Amtsbezeichnung נָבִיא wird direkt mit „Prophet“ wiedergegeben; die deutsche Wortstellung ist natürlich.
- source_word: חֹזֵה דָוִד
  choice: Davids Seher
  rationale: „Seher“ erhält die vom Wort „Prophet“ unterschiedene Bezeichnung חֹזֶה und gibt die Zugehörigkeitsbeziehung des Konstrukts knapp wieder.
- source_word: לֵאמֹר
  choice: Doppelpunkt
  rationale: Da die direkte Rede im nächsten Vers folgt, erfüllt im modernen Deutschen ein Doppelpunkt die Funktion der hebräischen Redeeinleitung natürlicher als das formelhafte „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen ausdrücklich stehende Bundesname sichtbar bleibt.
- issue: Zeitverhältnis von הָיָה אֶל
  choice: war … ergangen
  alternative: erging … an
  rationale: 'Das Plusquamperfekt entspricht dem wahrscheinlichen Rückblick: Als David aufstand, hatte Gad das Wort bereits empfangen. Die hebräische Form lässt sich jedoch auch weniger ausdrücklich als bloße Zustands- oder Ereignisangabe verstehen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel und die Unterscheidung zwischen „Prophet“ und „Seher“ bleiben erhalten; der Doppelpunkt leitet die im folgenden Vers beginnende direkte Rede ein.
