  text: וַ/יָּשֻׁ֖טוּ בְּ/כָל הָ/אָ֑רֶץ וַ/יָּבֹ֜אוּ מִ/קְצֵ֨ה תִשְׁעָ֧ה חֳדָשִׁ֛ים וְ/עֶשְׂרִ֥ים י֖וֹם יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/008.yaml
  text: They traveled throughout all the land, and at the end of nine months and twenty days they came to Jerusalem.
translation:
  language: de
  text: Sie zogen durch das ganze Land und kamen nach neun Monaten und zwanzig Tagen nach Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁטוּ
  choice: Sie zogen
  rationale: Das Verb שׁוט bezeichnet ein Umherziehen bzw. das Durchqueren eines Gebiets. „Sie zogen“ ist im Erzählzusammenhang natürlich und gibt die planmäßige Reise zur Volkszählung wieder, ohne die Ziellosigkeit von „sie streiften umher“ nahezulegen.
- source_word: בְּכָל הָאָרֶץ
  choice: durch das ganze Land
  rationale: Die Verbindung bezeichnet eine Bewegung durch das gesamte betreffende Gebiet. „Land“ meint hier das bereiste Herrschaftsgebiet, nicht die Erde.
- source_word: וַיָּבֹאוּ
  choice: und kamen
  rationale: בוא bedeutet hier „kommen“ bzw. „ankommen“. Mit dem Ziel „nach Jerusalem“ ist „kamen“ idiomatisch und bewahrt den schlichten Erzählstil.
- source_word: מִקְצֵה
  choice: nach
  rationale: Mit einer Zeitangabe bezeichnet מִקְצֵה den Ablauf bzw. Endpunkt eines Zeitraums. Das deutsche „nach“ gibt dies natürlich und präzise wieder.
- source_word: תִשְׁעָה חֳדָשִׁים וְעֶשְׂרִים יוֹם
  choice: neun Monaten und zwanzig Tagen
  rationale: Die Zeitdauer wird in idiomatischem Deutsch mit Dativ nach „nach“ wiedergegeben; die beiden Angaben bleiben entsprechend dem Hebräischen verbunden.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Die im Deutschen etablierte Form des Ortsnamens.
