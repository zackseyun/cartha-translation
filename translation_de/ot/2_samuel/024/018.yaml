  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֣אמֶר ל֗/וֹ עֲלֵה֙ הָקֵ֤ם לַֽ/יהוָה֙ מִזְבֵּ֔חַ בְּ/גֹ֖רֶן ארניה הַ/יְבֻסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/018.yaml
  text: That day Gad came to David and said to him[c][b][a], “Go up and set up an altar to Yahweh on the threshing floor of Araunah the Jebusite.”
translation:
  language: de
  text: 'An jenem Tag kam Gad zu David und sagte zu ihm: „Geh hinauf und errichte auf der Tenne Araunas, des Jebusiters, einen Altar für Jahwe.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: Das Qal-Wayyiqtol von בוא bezeichnet hier in der fortlaufenden Erzählung Gads Kommen zu David.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Gibt die bestimmte Zeitangabe wörtlich und zugleich in natürlichem modernem Deutsch wieder.
- source_word: עֲלֵה
  choice: Geh hinauf
  rationale: Der Imperativ von עלה enthält eine Aufwärtsbewegung, die mit „geh hinauf“ erhalten bleibt.
- source_word: הָקֵם
  choice: errichte
  rationale: Der Hifil-Imperativ von קום bedeutet hier, einen Altar aufzustellen beziehungsweise zu errichten; „errichte“ ist im Deutschen idiomatisch und präzise.
- source_word: לַיהוָה
  choice: Jahwe … einen Altar
  rationale: Die deutsche Dativkonstruktion gibt das ל der Widmung beziehungsweise Bestimmung natürlich wieder und bewahrt zugleich den im Hebräischen genannten Gottesnamen.
- source_word: בְּגֹרֶן
  choice: auf der Tenne
  rationale: ב bezeichnet hier den Ort; da der Altar auf diesem Platz errichtet werden soll, ist „auf der Tenne“ die natürliche räumliche Wiedergabe.
- source_word: ארניה
  choice: Arauna
  rationale: Die Namensform des Samueltextes wird als „Arauna“ wiedergegeben; die abweichende Form in der Chronik wird in einer Fußnote genannt.
- source_word: הַיְבֻסִי
  choice: des Jebusiters
  rationale: Die Herkunftsbezeichnung wird substantivisch und in natürlicher Verbindung mit dem Eigennamen wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Präposition ל in לַיהוָה
  choice: Jahwe einen Altar errichten
  alternative: einen Altar für Jahwe errichten
  rationale: Der deutsche Dativ drückt die Widmung an Jahwe idiomatisch aus, ohne die mögliche Nuance von Bestimmung oder Zugehörigkeit unnötig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt klar und erzählerisch; „Tenne“ ist der geläufige präzise Ausdruck für einen Dreschplatz. Der Gottesname wird als „Jahwe“ wiedergegeben.
