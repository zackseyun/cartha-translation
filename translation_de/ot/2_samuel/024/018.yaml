  source_fidelity: 'Der Entwurf gibt alle wesentlichen hebräischen Elemente zutreffend wieder: Gad kommt an jenem Tag zu David, der Imperativ „geh hinauf“ bewahrt die Richtungsnuance von עֲלֵה, und der Altar soll auf Araunas Tenne für/zu Jahwe errichtet werden. Die Namensform „Arauna“ ist im Deutschen gebräuchlich und die Fußnote benennt die abweichende chronistische Form angemessen.'
