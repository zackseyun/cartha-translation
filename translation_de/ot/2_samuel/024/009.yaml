source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן יוֹאָ֛ב אֶת מִסְפַּ֥ר מִפְקַד הָ/עָ֖ם אֶל הַ/מֶּ֑לֶךְ וַ/תְּהִ֣י יִשְׂרָאֵ֡ל שְׁמֹנֶה֩ מֵא֨וֹת אֶ֤לֶף אִֽישׁ חַ֨יִל֙ שֹׁ֣לֵֽף חֶ֔רֶב וְ/אִ֣ישׁ יְהוּדָ֔ה חֲמֵשׁ מֵא֥וֹת אֶ֖לֶף אִֽישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/009.yaml
  text: 'Joab gave the number of the census of the people to the king: Israel was eight hundred thousand valiant men who drew the sword[a], and the men of Judah were five hundred thousand men.'
translation:
  language: de
  text: 'Joab übergab dem König das Ergebnis der Zählung des Volkes: In Israel waren es achthunderttausend wehrfähige Männer, die das Schwert zogen,[a] und die Männer Judas waren fünfhunderttausend Mann.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Parallelstelle in 1. Chronik 21,5 nennt andere Gesamtzahlen: 1.100.000 für Israel und 470.000 für Juda. Hier werden die Zahlen des hebräischen Textes von 2. Samuel ohne Angleichung wiedergegeben.'
    reason: cross_reference
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: das Ergebnis der Zählung des Volkes
  rationale: Die Verbindung bezeichnet die bei der Musterung beziehungsweise Volkszählung ermittelte Zahl. „Ergebnis der Zählung“ gibt den Sinn im Deutschen natürlicher wieder als das schwerfällige „Zahl der Zählung“.
- source_word: וַתְּהִי יִשְׂרָאֵל
  choice: In Israel waren es
  rationale: Diese Formulierung gibt die resultative Angabe des hebräischen Kollektivnamens idiomatisch wieder und leitet die Gesamtzahl klar ein.
- source_word: שְׁמֹנֶה מֵאוֹת אֶלֶף
  choice: achthunderttausend
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: אִישׁ חַיִל
  choice: wehrfähige Männer
  rationale: Im Kontext der militärischen Musterung bezeichnet der Ausdruck kampftaugliche beziehungsweise leistungsfähige Männer. „Wehrfähig“ wahrt den militärischen Bezug, ohne Tapferkeit als ausdrücklich geprüfte Eigenschaft zu behaupten.
- source_word: שֹׁלֵף חֶרֶב
  choice: die das Schwert zogen
  rationale: Die konkrete hebräische Wendung wird beibehalten; sie kennzeichnet Männer, die zum bewaffneten Kampf bereit oder fähig waren.
- source_word: וְאִישׁ יְהוּדָה
  choice: und die Männer Judas
  rationale: Das singularische אִישׁ wird hier kollektiv gebraucht. Die deutsche Mehrzahl macht diesen Gruppensinn verständlich.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף אִישׁ
  choice: zählten fünfhunderttausend
  rationale: Die Zahl wird vollständig wiedergegeben; „zählten“ vermeidet im Deutschen die schwerfällige Wiederholung von „Männer“, das unmittelbar zuvor bereits genannt ist.
theological_decisions:
- issue: Abweichende Zahlen in der Parallele 1. Chronik 21,5
  choice: 'Der masoretische Text von 2. Samuel wird unverändert wiedergegeben: achthunderttausend für Israel und fünfhunderttausend für Juda.'
  alternative: Die Zahlen mit 1. Chronik 21,5 harmonisieren oder durch eine angenommene unterschiedliche Zählweise erklären.
  rationale: Die Übersetzung soll die vorliegende hebräische Textgestalt abbilden und keine nicht ausdrücklich genannte Harmonisierung oder Erklärung in den Vers eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zählung“ ist allgemein verständlich; „wehrfähig“ bringt den militärischen Kontext knapp zum Ausdruck. Das konkrete Bild des Schwertziehens bleibt erhalten.
