  naturalness: Der Text ist insgesamt gut verständlich und angemessen würdig. „mit dem, was ich getan habe“ ist hier weniger idiomatisch als „durch das, was ich getan habe“. Die Umstellung zu „Davids Herz schlug ihn“ macht das Subjekt und die bewusst beibehaltene Metapher klar; die Fußnote erläutert sie.
