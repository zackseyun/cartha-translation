  text: וַ/יַּ֤ךְ לֵב דָּוִד֙ אֹת֔/וֹ אַחֲרֵי כֵ֖ן סָפַ֣ר אֶת הָ/עָ֑ם וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל יְהוָ֗ה חָטָ֤אתִי מְאֹד֙ אֲשֶׁ֣ר עָשִׂ֔יתִי וְ/עַתָּ֣ה יְהוָ֔ה הַֽעֲבֶר נָא֙ אֶת עֲוֺ֣ן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/010.yaml
  text: After that[a], David’s heart struck him after he had counted the people. And David said to Yahweh, “I have sinned greatly in what I have done. And now, Yahweh, please take away the guilt of your servant[c][b], for I have acted very foolishly.”
translation:
  language: de
  text: 'Nachdem David das Volk gezählt hatte[a], schlug Davids Herz ihn[b]. Da sagte David zu Jahwe: »Ich habe schwer gesündigt durch das, was ich getan habe. Doch nun, Jahwe, nimm bitte die Schuld deines Dieners weg[c], denn ich habe sehr töricht gehandelt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Volk gemustert hatte“ oder „eine Volkszählung vorgenommen hatte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Davids Herz schlug ihn“ – ein hebräisches Bild für innere Gewissensnot oder ein schuldbeladenes Gewissen.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „die Verfehlung deines Dieners“. Das hebräische Wort kann die Verfehlung, die daraus erwachsende Schuld oder auch deren Folge beziehungsweise Strafe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: schlug ihm das Herz
  rationale: Die Formulierung bewahrt das hebräische Bild vom Herzen, das David schlägt, und ist im Deutschen als Ausdruck innerer Gewissensnot verständlich.
- source_word: אַחֲרֵי כֵן סָפַר אֶת־הָעָם
  choice: Nachdem David das Volk gezählt hatte
  rationale: 'Die temporale Konstruktion gibt die Abfolge wieder: Davids innere Erschütterung setzte nach der Zählung des Volkes ein. „Gezählt“ entspricht dem Grundsinn von ספר, ohne den Vorgang unnötig auszudeuten.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den Namen, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: חָטָאתִי מְאֹד
  choice: Ich habe schwer gesündigt
  rationale: „Schwer“ gibt die verstärkende Bedeutung von מְאֹד in natürlichem, würdevollem Deutsch wieder.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: mit dem, was ich getan habe
  rationale: Die Wendung verbindet Davids Sünde unmittelbar mit seiner Tat und folgt dem Sinn des hebräischen Relativsatzes.
- source_word: הַעֲבֶר נָא
  choice: nimm bitte … weg
  rationale: Der Hifil von עבר bezeichnet hier das Beseitigen der Schuld. „Nimm … weg“ ist klar und bewahrt den bildhaften Charakter des Ausdrucks.
- source_word: עֲוֺן עַבְדְּךָ
  choice: die Schuld deines Dieners
  rationale: עָוֹן kann Verfehlung, Schuld oder deren Folge bezeichnen. Im Zusammenhang von Bekenntnis und Bitte um Wegnahme trifft „Schuld“ den Sinn, ohne die Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: כִּי נִסְכַּלְתִּי מְאֹד
  choice: denn ich habe sehr töricht gehandelt
  rationale: Die Formulierung gibt sowohl das törichte Verhalten als auch die Verstärkung durch מְאֹד ausdrücklich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen in einer im Deutschen geläufigen Form.
- issue: Bedeutung von עָוֹן in Davids Bitte
  choice: Schuld
  alternative: Verfehlung; Schuldfolge oder Strafe
  rationale: Davids Bekenntnis und die Bitte, das Betreffende wegzunehmen, sprechen hier besonders für die moralische Schuld. Da das hebräische Wort ein breiteres Bedeutungsspektrum hat, werden die Alternativen in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Die hebräische Herz-Metapher bleibt erhalten; altertümliche Wendungen und konfessionell geprägte Zusätze werden vermieden.
