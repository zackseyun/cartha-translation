source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יָד֨/וֹ הַ/מַּלְאָ֥ךְ יְרֽוּשָׁלִַם֮ לְ/שַׁחֲתָ/הּ֒ וַ/יִּנָּ֤חֶם יְהוָה֙ אֶל הָ֣/רָעָ֔ה וַ֠/יֹּאמֶר לַ/מַּלְאָ֞ךְ הַ/מַּשְׁחִ֤ית בָּ/עָם֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ הָיָ֔ה עִם גֹּ֖רֶן ה/אורנה הַ/יְבֻסִֽי׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/016.yaml
  text: When the angel stretched out his hand toward Jerusalem to destroy it[a], Yahweh relented concerning the calamity and said to the angel who was destroying the people, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was by the threshing floor of Araunah the Jebusite.
translation:
  language: de
  text: 'Als der Engel seine Hand gegen Jerusalem ausstreckte, um es zu vernichten, sah Yahweh von dem Unheil[a] ab und sagte zu dem Engel, der das Volk vernichtete: »Genug! Lass jetzt deine Hand sinken.« Und der Engel Yahwehs befand sich bei der Tenne Araunas[b], des Jebusiters.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Yahweh ließ sich das Unheil gereuen.« Das hebräische Wort רָעָה bezeichnet hier Unheil beziehungsweise eine Katastrophe, nicht moralisch Böses.'
    reason: lexical_alternative
  - marker: b
    text: Arauna wird im Parallelbericht in 1. Chronik 21,15 Ornan genannt.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: seine Hand … ausstreckte
  rationale: Die Wendung שׁלח + יד bezeichnet hier das Ausstrecken der Hand zum Handeln; die konkrete Bildsprache bleibt erhalten.
- source_word: הַמַּלְאָךְ
  choice: der Engel
  rationale: Im Zusammenhang ist ein himmlischer Vollstrecker des Gerichts gemeint, nicht lediglich ein menschlicher Bote.
- source_word: לְשַׁחֲתָהּ
  choice: um es zu vernichten
  rationale: Das Suffix bezieht sich auf Jerusalem; שׁחת bezeichnet hier die beabsichtigte Zerstörung.
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: hatte Yahweh Erbarmen wegen des Unheils
  rationale: נחם im Nifal beschreibt hier Yahwehs Abkehr von der weiteren Vollstreckung des Gerichts. »Erbarmen haben« ist in diesem Kontext natürlich und vermeidet die irreführende Vorstellung moralischer Reue; רָעָה meint das verhängte Unheil, nicht moralisch Böses. Die Fußnote wahrt die mögliche Wiedergabe »ließ sich das Unheil gereuen«.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַמַּשְׁחִית בָּעָם
  choice: der das Volk vernichtete
  rationale: Das Partizip bezeichnet die im Verlauf befindliche zerstörerische Tätigkeit des Engels und wird idiomatisch als Relativsatz wiedergegeben.
- source_word: רַב
  choice: Genug!
  rationale: רַב fungiert hier als knapper Zuruf, der die Beendigung des Gerichts anordnet.
- source_word: עַתָּה הֶרֶף יָדֶךָ
  choice: Lass jetzt deine Hand sinken
  rationale: הרף fordert zum Aufhören auf; zusammen mit »Hand« bleibt das Bild des eingestellten Handelns erhalten.
- source_word: וּמַלְאַךְ יְהוָה
  choice: Der Engel Yahwehs
  rationale: Die Genitivverbindung bewahrt die Bezeichnung des Textes, ohne die Identität des Engels weiter auszudeuten.
- source_word: הָיָה עִם
  choice: befand sich bei
  rationale: עִם drückt hier räumliche Nähe aus; »befand sich bei« ist im Deutschen natürlich.
- source_word: גֹּרֶן
  choice: Tenne
  rationale: »Tenne« ist die präzise und im biblischen Erzählstil vertraute Bezeichnung für den Dreschplatz.
- source_word: הָאֹרְנָה
  choice: Arauna
  rationale: Die Namensform folgt dem Samueltext; die abweichende Form im Chronikbuch wird in einer Fußnote genannt.
theological_decisions:
- issue: Anthropopathische Rede in וַיִּנָּחֶם יְהוָה
  choice: hatte Yahweh Erbarmen wegen des Unheils
  alternative: Yahweh ließ sich das Unheil gereuen / Yahweh nahm das Unheil zurück
  rationale: Die Übersetzung bringt die im Erzählverlauf beschriebene Abkehr von weiterem Gericht zum Ausdruck, ohne moralische Schuld oder einen Irrtum Gottes einzutragen. Eine Fußnote legt die engere sprachliche Alternative offen.
- issue: Identität von מַלְאַךְ יְהוָה
  choice: der Engel Yahwehs
  alternative: eine theophanische Erscheinung / ein geschaffenes Engelwesen
  rationale: Der Vers bezeichnet die Gestalt als Engel Yahwehs, entscheidet aber nicht ausdrücklich zwischen weitergehenden theologischen Deutungen; die Übersetzung lässt diese Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze direkte Rede bewahrt die Dringlichkeit. »Tenne« hält den historischen Erzählton, bleibt aber allgemein verständlich. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
