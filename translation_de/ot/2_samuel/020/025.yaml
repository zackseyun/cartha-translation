  text: and Sheva was secretary[a], and Zadok and Abiathar were priests.
translation:
  language: de
  text: Schewa war Schreiber[a], und Zadok und Abjatar waren Priester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sekretär“. Das hebräische Wort kann einen amtlichen Schreiber oder Sekretär am Königshof bezeichnen.'
