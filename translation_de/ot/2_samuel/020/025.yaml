lexical_decisions:
- source_word: שיא
  choice: Schewa
  rationale: Der im masoretischen Text dieses Verses überlieferte Eigenname wird unmittelbar und nach gängiger deutscher Umschrift wiedergegeben. Abweichende Namen in parallelen Ämterlisten werden nicht in den Text eingetragen.
- source_word: סֹפֵר
  choice: Staatsschreiber
  rationale: Das Wort bezeichnet hier innerhalb der königlichen Verwaltung einen amtlichen Schreiber beziehungsweise Sekretär. „Staatsschreiber“ macht sowohl die Schreibtätigkeit als auch das öffentliche Amt deutlich.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Gängige deutsche Wiedergabe des Eigennamens.
- source_word: אֶבְיָתָר
  choice: Abjatar
  rationale: Gängige deutsche Wiedergabe des Eigennamens.
- source_word: כֹּהֲנִים
  choice: Priester
  rationale: Die übliche und sachlich genaue Wiedergabe der pluralischen Amtsbezeichnung.
- source_word: וְ
  choice: und / Satzverknüpfung
  rationale: Das erste Waw wird im Deutschen durch den Anschluss an die fortlaufende Liste ausgedrückt; das zweite verbindet Zadok und Abjatar. Ein einleitendes „und“ wäre isoliert verständlich, klingt im modernen deutschen Vers jedoch unnötig schwerfällig.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form einer königlichen Ämterliste bleibt erhalten; „Staatsschreiber“ verdeutlicht die administrative Funktion, ohne sie mit dem anders bezeichneten Amt eines Chronisten zu vermischen.
