base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/015.yaml
  text: They came and besieged him in Abel-beth-maacah[a], and they cast up a siege ramp against the city, and it stood against the rampart[c][b]; and all the people who were with Joab were destroying it to bring down the wall.
translation:
  language: de
  text: Sie kamen und belagerten ihn in Abel-Bet-Maacha[a]. Sie schütteten gegen die Stadt eine Belagerungsrampe[b] auf; sie stand am Außenwall[c]. Alle Leute, die bei Joab waren, waren dabei, sie zu zerstören, um die Mauer zum Einsturz zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und belagerten sie“. Wörtlich steht im Hebräischen „ihn“; damit ist wahrscheinlich Scheba als Ziel der Belagerung hervorgehoben, obwohl die Stadt belagert wurde.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „einen Belagerungsdamm“ beziehungsweise „einen Erdwall“.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann ein äußeres Verteidigungswerk, einen Wall oder eine Befestigung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Sie kamen
  rationale: Die übliche erzählende Wiedergabe von בוא bezeichnet das Eintreffen von Joabs Leuten.
- source_word: וַיָּצֻרוּ עָלָיו
  choice: und belagerten ihn
  rationale: צור mit עַל bedeutet hier „belagern“. Das maskuline Suffix „ihn“ zielt wahrscheinlich auf Scheba innerhalb der Stadt und wird nicht stillschweigend zu „sie“ (die Stadt) geglättet.
- source_word: בְּאָבֵלָה בֵּית הַמַּעֲכָה
  choice: in Abel-Bet-Maacha
  rationale: Der Ortsname wird in einer im Deutschen geläufigen, quellenahen Umschrift wiedergegeben.
- source_word: וַיִּשְׁפְּכוּ סֹלְלָה
  choice: Sie schütteten eine Belagerungsrampe auf
  rationale: שׁפך („ausschütten“) bezeichnet im Belagerungskontext das Aufschütten von Erdmaterial; סֹלְלָה ist eine Belagerungsrampe beziehungsweise ein Belagerungsdamm.
- source_word: אֶל הָעִיר
  choice: gegen die Stadt
  rationale: Das direktionale אֶל erhält im militärischen Zusammenhang durch „gegen“ seine feindliche Zielrichtung.
- source_word: וַתַּעֲמֹד בַּחֵל
  choice: und sie reichte bis an den Vorwall
  rationale: Das feminine Verb bezieht sich am natürlichsten auf die feminine סֹלְלָה. „Reichte bis an“ gibt ihre Lage am Verteidigungswerk idiomatisch wieder; חֵל bezeichnet wahrscheinlich ein äußeres Befestigungswerk.
- source_word: וְכָל הָעָם אֲשֶׁר אֶת יוֹאָב
  choice: Alle Leute, die bei Joab waren
  rationale: Die elliptische Wendung mit אֶת bezeichnet Zugehörigkeit beziehungsweise Begleitung; „bei Joab“ bleibt klar und wenig interpretierend.
- source_word: מַשְׁחִיתִם
  choice: richteten Zerstörung an
  rationale: Das Partizip beschreibt eine fortdauernde zerstörerische Tätigkeit, nennt aber kein ausdrückliches Objekt. Die Formulierung bewahrt dies, statt „die Mauer“ vorzeitig als Objekt einzusetzen.
- source_word: לְהַפִּיל הַחוֹמָה
  choice: um die Mauer zum Einsturz zu bringen
  rationale: Der Hifil von נפל bedeutet „zu Fall bringen“; die deutsche Wendung ist natürlich und entspricht dem Belagerungskontext.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die ungewöhnliche Ausrichtung der Belagerung auf „ihn“ sowie das fehlende ausdrückliche Objekt bei מַשְׁחִיתִם bleiben erhalten. Militärische Fachbegriffe werden sparsam verwendet und in Fußnoten erläutert.
