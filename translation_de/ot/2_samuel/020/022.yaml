source:
  edition: WLC
  text: וַ/תָּבוֹא֩ הָ/אִשָּׁ֨ה אֶל כָּל הָ/עָ֜ם בְּ/חָכְמָתָ֗/הּ וַֽ/יִּכְרְת֞וּ אֶת רֹ֨אשׁ שֶׁ֤בַע בֶּן בִּכְרִי֙ וַ/יַּשְׁלִ֣כוּ אֶל יוֹאָ֔ב וַ/יִּתְקַע֙ בַּ/שּׁוֹפָ֔ר וַ/יָּפֻ֥צוּ מֵֽ/עַל הָ/עִ֖יר אִ֣ישׁ לְ/אֹהָלָ֑י/ו וְ/יוֹאָ֛ב שָׁ֥ב יְרוּשָׁלִַ֖ם אֶל הַ/מֶּֽלֶךְ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/022.yaml
  text: Then the woman went to all the people in her wisdom[a], and they cut off the head of Sheba son of Bichri and threw it to Joab. Then he blew the trumpet, and they dispersed from the city, each man to his tent; and Joab returned to Jerusalem to the king.
translation:
  language: de
  text: Da ging die Frau in ihrer Weisheit zu dem ganzen Volk. Sie schlugen Scheba, dem Sohn Bichris, den Kopf ab und warfen ihn Joab zu. Darauf blies er das Horn, und sie zogen von der Stadt ab, jeder zu seinem Zelt[a]. Joab aber kehrte zum König nach Jerusalem zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung »jeder zu seinem Zelt« ist eine feste hebräische Ausdrucksweise für das Auseinandergehen und die Rückkehr an den eigenen Aufenthaltsort.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּבוֹא
  choice: Da ging
  rationale: בוא kann je nach Blickrichtung »kommen« oder »gehen« bedeuten; hier beschreibt »ging« natürlich die Bewegung der Frau zum Volk.
- source_word: אֶל כָּל הָעָם
  choice: zu dem ganzen Volk
  rationale: עָם bleibt bewusst allgemein; der Kontext legt die Bewohner beziehungsweise die versammelte Bevölkerung nahe, ohne dies ausdrücklich festzulegen.
- source_word: בְּחָכְמָתָהּ
  choice: in ihrer Weisheit
  rationale: Die substantivische Form und die instrumentale beziehungsweise modale Nuance der Präposition werden bewahrt; zugleich klingt die Wendung im Deutschen würdevoll und verständlich.
- source_word: וַיִּכְרְתוּ אֶת רֹאשׁ
  choice: Sie schlugen … den Kopf ab
  rationale: Die deutsche feste Wendung gibt das Abtrennen des Kopfes klar und natürlich wieder.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Scheba, dem Sohn Bichris
  rationale: Die Namen werden nach gängiger deutscher Bibeltradition wiedergegeben; der Patronym-Ausdruck wird idiomatisch im Dativ in den Satz eingebunden.
- source_word: וַיַּשְׁלִכוּ אֶל יוֹאָב
  choice: warfen ihn Joab zu
  rationale: Das Pronomen nimmt den Kopf auf; »zuwarfen« drückt Richtung und Empfänger im Deutschen knapp aus.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: blies er das Horn
  rationale: Der Singular bezieht sich im Kontext auf Joab. »Horn« gibt שׁוֹפָר verständlich wieder, ohne ein modernes Metallinstrument nahezulegen.
- source_word: וַיָּפֻצוּ מֵעַל הָעִיר
  choice: sie zogen von der Stadt ab
  rationale: Die Formulierung bezeichnet hier das Auflösen und Abziehen der Belagerer von ihrer Stellung gegen die Stadt; »zogen … ab« ist im Deutschen natürlicher als ein wörtliches »zerstreuten sich von über der Stadt«.
- source_word: אִישׁ לְאֹהָלָיו
  choice: jeder zu seinem Zelt
  rationale: Die hebräische distributive Wendung wird formal bewahrt; sie meint die Rückkehr jedes Einzelnen an seinen eigenen Aufenthaltsort.
- source_word: וְיוֹאָב שָׁב יְרוּשָׁלִַם אֶל הַמֶּלֶךְ
  choice: Joab aber kehrte zum König nach Jerusalem zurück
  rationale: Die deutsche Wortstellung macht deutlich, dass Jerusalem das Ziel der Rückkehr und der König die Person ist, zu der Joab zurückkehrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Handlung wird so direkt wiedergegeben wie im Hebräischen. Der Wechsel zu »Joab aber« markiert knapp den abschließenden Erzählstrang; der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung.
