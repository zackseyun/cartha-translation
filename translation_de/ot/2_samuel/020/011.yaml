    issue: „stellte sich neben ihn“ für עָמַד עָלָיו
    rationale: Die Präposition עַל bezeichnet hier am ehesten die Position über Amasa. Der unmittelbare Kontext macht deutlich, dass Amasa niedergestreckt am Boden liegt. „Über ihn“ bewahrt die konkrete räumliche Aussage besser.
  - severity: low
    issue: „rief“ für וַיֹּאמֶר
    rationale: Der öffentliche Charakter der Aussage kann ein Rufen nahelegen, doch das hebräische Verb lautet neutral „sagte“. Ohne ausdrückliches Signal für Lautstärke ist „sagte“ die quellentreuere, weiterhin natürliche Wiedergabe.
