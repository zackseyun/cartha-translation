  text: וְ/אִישׁ֙ עָמַ֣ד עָלָ֔י/ו מִֽ/נַּעֲרֵ֖י יוֹאָ֑ב וַ/יֹּ֗אמֶר מִי֩ אֲשֶׁ֨ר חָפֵ֧ץ בְּ/יוֹאָ֛ב וּ/מִ֥י אֲשֶׁר לְ/דָוִ֖ד אַחֲרֵ֥י יוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/011.yaml
  text: And one of Joab’s young men stood over him and said[a], “Whoever favors Joab, and whoever is for David[b], follow Joab!”
translation:
  language: de
  text: 'Einer von Joabs jungen Männern[a] stellte sich über ihn und sagte: »Wer zu Joab hält und wer für David ist, soll Joab folgen!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Junge Männer« kann hier auch »Diener«, »Gefolgsleute« oder »Begleiter« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: »hinter Joab her«. Gemeint ist der Aufruf, Joab zu folgen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Einer
  rationale: אִישׁ bezeichnet hier eine nicht näher bestimmte einzelne Person aus Joabs Leuten; »Einer« gibt diese Funktion im Deutschen natürlich wieder.
- source_word: עָמַד עָלָיו
  choice: stellte sich neben ihn
  rationale: עמד mit על kann in dieser räumlichen Szene das Stehen bei, neben oder über jemandem bezeichnen. Da Amasa am Boden liegt, vermittelt »neben ihn« die Position am Körper klar, ohne im Deutschen eine übertragene Überlegenheit anzudeuten.
- source_word: מִנַּעֲרֵי יוֹאָב
  choice: von Joabs jungen Männern
  rationale: נַעַר kann einen jungen Mann, Diener oder Gefolgsmann bezeichnen. Die transparente Wiedergabe »junge Männer« passt zum militärischen Gefolge, während die Fußnote die weitere Bedeutungsspanne nennt.
- source_word: וַיֹּאמֶר
  choice: und rief
  rationale: אמר bedeutet grundsätzlich »sagen«. In diesem Zusammenhang richtet der Mann einen öffentlichen Sammelruf an die vorbeiziehenden Truppen; »rief« gibt die kommunikative Funktion natürlich wieder.
- source_word: מִי אֲשֶׁר חָפֵץ בְּיוֹאָב
  choice: Wer zu Joab hält
  rationale: חפץ ב bezeichnet Gefallen, Wohlwollen oder Zustimmung. Im politischen und militärischen Zusammenhang drückt »zu Joab hält« die gemeinte Unterstützung aus, ohne eine emotionale Vorliebe zu überzeichnen.
- source_word: וּמִי אֲשֶׁר לְדָוִד
  choice: und wer für David ist
  rationale: Die Verbindung mit לְ bezeichnet hier Zugehörigkeit oder Parteinahme. »Für David ist« bewahrt die knappe politische Loyalitätsaussage.
- source_word: אַחֲרֵי יוֹאָב
  choice: soll Joab folgen
  rationale: Wörtlich steht nur »hinter Joab/her«. Als Zuruf fordert die elliptische Wendung dazu auf, sich Joab anzuschließen und ihm zu folgen; im Deutschen muss dies durch ein Verb ausgedrückt werden.
