  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל עֲמָשָׂ֔א הַזְעֶק לִ֥/י אֶת אִישׁ יְהוּדָ֖ה שְׁלֹ֣שֶׁת יָמִ֑ים וְ/אַתָּ֖ה פֹּ֥ה עֲמֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/004.yaml
  text: Then the king said to Amasa[a], “Call the men of Judah together for me within three days, and you, remain here.”
translation:
  language: de
  text: 'Da sagte der König zu Amasa: „Ruf mir binnen drei Tagen die Männer Judas[a] zusammen, und du bleib hier.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht eine männliche Kollektivbezeichnung. Gemeint sind wahrscheinlich die wehrfähigen beziehungsweise zum Kampf aufzubietenden Männer Judas; ausdrücklich „Krieger“ heißt es jedoch nicht.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw consecutivum führt die Erzählung weiter; „Da“ gibt die zeitliche Abfolge im modernen deutschen Erzählstil natürlich wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die bestimmte Bezeichnung verweist im Kontext auf David; eine Ersetzung durch den Eigennamen ist nicht nötig.
- source_word: הַזְעֶק
  choice: Ruf ... zusammen
  rationale: Der Hifil-Imperativ von זעק bezeichnet hier das Aufbieten beziehungsweise Zusammenrufen. Diese Wiedergabe bewahrt den kausativen Sinn in natürlichem Deutsch.
- source_word: לִי
  choice: mir
  rationale: Der Dativ bezeichnet eine Handlung im Auftrag beziehungsweise zugunsten des Königs; „mir“ ist idiomatisch und knapp.
- source_word: אֶת אִישׁ יְהוּדָה
  choice: die Männer von Juda
  rationale: אִישׁ steht formal im Singular, wird hier aber kollektiv gebraucht. Die Übersetzung bewahrt die männliche Kollektivbezeichnung, ohne den militärischen Kontext durch „Krieger“ ausdrücklich in den Wortlaut einzutragen.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: innerhalb von drei Tagen
  rationale: Im Zusammenhang des Befehls bezeichnet die Zeitangabe die Frist für das Zusammenrufen, nicht dessen Dauer.
- source_word: וְאַתָּה
  choice: und du selbst
  rationale: Das ausdrücklich gesetzte Pronomen hebt Amasa hervor. „Du selbst“ bildet diese Betonung ab, ohne einen stärkeren Gegensatz einzuführen.
- source_word: פֹּה עֲמֹד
  choice: sollst dich hier einfinden
  rationale: Wörtlich steht „steh hier“. Im Zusammenhang verlangt der König, dass Amasa nach erfülltem Auftrag an diesem Ort anwesend ist; „dich hier einfinden“ gibt diesen situationsbezogenen Sinn natürlicher wieder und vermeidet die missverständliche Vorstellung ununterbrochenen Stehens oder Bleibens während der dreitägigen Aufgabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der königliche Befehl ist knapp formuliert. Die ungewöhnliche Schlussanweisung wird sinngemäß als Aufforderung verstanden, nach dem Zusammenrufen wieder vor Ort zu erscheinen; die Spannung zwischen dem wörtlichen „steh hier“ und dem notwendigen Auftrag außerhalb des Ortes wird nicht durch die Annahme eines dauernden Verbleibens verschärft.
