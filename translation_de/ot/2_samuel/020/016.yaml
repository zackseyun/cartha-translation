  yaml_path: translation/ot/2_samuel/020/016.yaml
  text: Then a wise woman called out from the city, “Listen! Listen! Please tell Joab, ‘Come near to here, so that I may speak with you.’”
translation:
  language: de
  text: 'Da rief eine weise Frau aus der Stadt: „Hört! Hört! Sagt bitte zu Joab: ‚Komm hierher, damit ich mit dir reden kann.‘“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה חֲכָמָה
  choice: eine weise Frau
  rationale: Gibt die gebräuchliche hebräische Bezeichnung direkt und natürlich wieder; Weisheit bezeichnet hier erkennbar ihre Klugheit und Verhandlungskompetenz.
- source_word: שִׁמְעוּ שִׁמְעוּ
  choice: Hört! Hört!
  rationale: Bewahrt die eindringliche Wiederholung und die Pluralform des Aufrufs.
- source_word: אִמְרוּ נָא
  choice: Sagt bitte
  rationale: Der Pluralimperativ wird gewahrt; נָא verleiht der Aufforderung einen höflich-bittenden Ton.
- source_word: קְרַב עַד הֵנָּה
  choice: Komm hierher
  rationale: Natürliches modernes Deutsch für die Aufforderung, bis zu ihrem Standort heranzukommen.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: damit ich mit dir reden kann
  rationale: Gibt die beabsichtigte Folge der Aufforderung idiomatisch wieder; das Suffix ist maskuliner Singular und richtet sich auf Joab.
