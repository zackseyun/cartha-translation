  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל אֲבִישַׁ֔י עַתָּ֗ה יֵ֧רַֽע לָ֛/נוּ שֶׁ֥בַע בֶּן בִּכְרִ֖י מִן אַבְשָׁל֑וֹם אַ֠תָּה קַ֞ח אֶת עַבְדֵ֤י אֲדֹנֶ֨י/ךָ֙ וּ/רְדֹ֣ף אַחֲרָ֔י/ו פֶּן מָ֥צָא ל֛/וֹ עָרִ֥ים בְּצֻר֖וֹת וְ/הִצִּ֥יל עֵינֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/006.yaml
  text: Then David said to Abishai[a], “Now Sheba son of Bichri will do us more harm than Absalom. You, take your lord’s servants and pursue after him, lest he find fortified cities for himself and escape from our sight.”
translation:
  language: de
  text: 'Da sagte David zu Abischai: »Nun wird uns Scheba, der Sohn Bichris, mehr Schaden zufügen als Abschalom. Nimm du die Diener deines Herrn und verfolge ihn, damit er nicht befestigte Städte für sich findet und sich unserem Blick entzieht.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich schwer verständlich: »und unsere Augen rettet/entreißt«. Die Wendung bedeutet hier, dass er den Verfolgern entkommt oder sich ihrem Blick entzieht.'
    reason: Die Fußnote kennzeichnet die schwierige hebräische Bildsprache, ohne deren Subjekt-Objekt-Beziehung durch die unzutreffende Paraphrase »unsere Augen entrinnen lässt« zu verändern.
lexical_decisions:
- source_word: יֵרַע לָנוּ
  choice: wird uns … mehr Schaden zufügen
  rationale: Das Verb bezeichnet hier das Zufügen von Schaden oder Unheil, nicht abstrakte moralische Bosheit. Die Formulierung gibt zusammen mit מִן den Vergleich natürlich wieder.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Scheba, der Sohn Bichris
  rationale: Die Eigennamen werden nach geläufiger deutscher Bibeltradition transliteriert; die Abstammungsangabe wird idiomatisch als Genitiv wiedergegeben.
- source_word: מִן אַבְשָׁלוֹם
  choice: als Abschalom
  rationale: מִן markiert hier den Vergleich. Die knappe Wiedergabe bewahrt die im Hebräischen unausgesprochene Ergänzung, dass Scheba mehr schaden werde, als Abschalom es tat.
- source_word: אַתָּה קַח
  choice: Nimm du
  rationale: Das selbstständige Pronomen אַתָּה hebt Abischai nachdrücklich hervor; die deutsche Nachstellung von »du« bewahrt diesen Akzent natürlich.
- source_word: עַבְדֵי אֲדֹנֶיךָ
  choice: die Diener deines Herrn
  rationale: Die Wendung bezeichnet Davids Gefolgsleute und bewahrt zugleich die hierarchische Ausdrucksweise des Ausgangstextes.
- source_word: וּרְדֹף אַחֲרָיו
  choice: und verfolge ihn
  rationale: רדף mit אַחֲרֵי bezeichnet in diesem militärischen Zusammenhang das Verfolgen. Ein zusätzliches »hinter ihm her« wäre möglich, ist semantisch aber nicht erforderlich.
- source_word: פֶּן
  choice: damit … nicht
  rationale: פֶּן leitet eine befürchtete, zu verhindernde Möglichkeit ein. »Damit … nicht« ist im heutigen Deutsch natürlicher als das gehobene »damit nicht etwa« oder »auf dass nicht«.
- source_word: מָצָא לוֹ עָרִים בְּצֻרוֹת
  choice: befestigte Städte für sich findet
  rationale: Die Wiedergabe erhält sowohl die Grundbedeutung »finden« als auch den Dativ des Vorteils לוֹ. Gemeint ist, dass Scheba befestigte Zufluchtsorte gewinnt.
- source_word: וְהִצִּיל עֵינֵינוּ
  choice: und sich unserem Blick entzieht
  rationale: 'Die wörtlich ungewöhnliche Wendung »unsere Augen entrinnen/entkommen lassen« ist idiomatisch zu verstehen: Scheba könnte den Verfolgern entkommen. Die deutsche Formulierung bewahrt das Bild des Sehens.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Nimm du« erhält die emphatische Anrede; »damit … nicht« gibt die Warnung natürlich wieder. Der Fußnotenmarker steht unmittelbar bei der bildhaften Wendung, die er erläutert.
