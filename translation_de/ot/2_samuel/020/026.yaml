  text: וְ/גַ֗ם עִירָא֙ הַ/יָּ֣אִרִ֔י הָיָ֥ה כֹהֵ֖ן לְ/דָוִֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/026.yaml
  text: And Ira the Jairite also was priest to David[a].
translation:
  language: de
  text: Auch Ira, der Jairiter, war Priester Davids.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „oberster Minister“ oder „königlicher Berater“. Das hebräische Wort bedeutet wörtlich „Priester“, kann aber in manchen königlichen Zusammenhängen einen hohen Hofbeamten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Die additive Fortführung wird im Deutschen natürlich und vollständig durch „Auch“ wiedergegeben; ein zusätzliches „und“ wäre hier schwerfällig.
- source_word: עִירָא
  choice: Ira
  rationale: Der Personenname wird nach der etablierten deutschen Form transliteriert.
- source_word: הַיָּאִרִי
  choice: der Jairiter
  rationale: Die adjektivische Herkunfts- oder Sippenbezeichnung wird knapp und idiomatisch als „der Jairiter“ wiedergegeben.
- source_word: הָיָה
  choice: war
  rationale: In der Beamtenliste bezeichnet das Qal Perfekt einen bestehenden Zustand in der Vergangenheit, nicht den Beginn eines Amtes.
- source_word: כֹהֵן
  choice: Priester
  rationale: Die lexikalische Grundbedeutung ist „Priester“. Eine mögliche Bedeutung als hoher Hofbeamter wird nicht in den Haupttext eingetragen, sondern in der Fußnote bewahrt.
- source_word: לְדָוִד
  choice: Davids
  rationale: Der deutsche Genitiv gibt die Zuordnung zu David knapp und idiomatisch wieder, ohne die genaue Art des Dienstverhältnisses stärker festzulegen.
theological_decisions:
- issue: Bedeutung von כֹהֵן im königlichen Hofkontext
  choice: „Priester“ im Haupttext
  alternative: „oberster Minister“, „königlicher Berater“ oder allgemein „hoher Hofbeamter“
  rationale: Obwohl das Wort in diesem Zusammenhang möglicherweise ein hohes Hofamt bezeichnet, bleibt seine gewöhnliche Bedeutung „Priester“. Der Haupttext erhält diese sprachliche Spannung; die administrative Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form entspricht dem Charakter einer abschließenden Beamtennotiz; die echte lexikalische Mehrdeutigkeit wird durch eine Fußnote offengehalten.
