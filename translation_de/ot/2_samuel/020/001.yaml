  text: וְ/שָׁ֨ם נִקְרָ֜א אִ֣ישׁ בְּלִיַּ֗עַל וּ/שְׁמ֛/וֹ שֶׁ֥בַע בֶּן בִּכְרִ֖י אִ֣ישׁ יְמִינִ֑י וַ/יִּתְקַ֣ע בַּ/שֹּׁפָ֗ר וַ֠/יֹּאמֶר אֵֽין לָ֨/נוּ חֵ֜לֶק בְּ/דָוִ֗ד וְ/לֹ֤א נַֽחֲלָה לָ֨/נוּ֙ בְּ/בֶן יִשַׁ֔י אִ֥ישׁ לְ/אֹהָלָ֖י/ו יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/001.yaml
  text: There happened to be there a worthless man[a], whose name was Sheba son of Bichri, a Benjaminite. He blew the trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents[d][c][b], O Israel!”
translation:
  language: de
  text: 'Dort war ein niederträchtiger Mann[a] namens Scheba, der Sohn Bichris, ein Benjaminiter. Er blies das Schofarhorn[b] und rief: »Wir haben keinen Anteil an David und kein Erbteil am Sohn Isais! Jeder zu seinen Zelten[c], Israel!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »ein gewissenloser Mann« oder »ein Schurke«; hebräisch: »ein Mann Belials«.'
    reason: lexical_alternative
  - marker: b
    text: Ein Schofar ist ein Horn, das als öffentliches Signalinstrument diente; traditionell wird es als Widderhorn verstanden.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: »Jeder zu seinen Zelten«. Die Wendung fordert jeden Einzelnen auf, nach Hause oder in sein eigenes Lager zurückzukehren.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וְשָׁם נִקְרָא
  choice: Dort befand sich gerade
  rationale: Die Niphal-Form von קרא hat zusammen mit שָׁם hier ein existenzielles beziehungsweise begegnungsbezogenes Gewicht. Die deutsche Formulierung führt die anwesende Person natürlich in die Erzählung ein, ohne den Ausdruck irrtümlich auf eine Namensnennung zu beziehen.
- source_word: אִישׁ בְּלִיַּעַל
  choice: ein nichtswürdiger Mann
  rationale: בְּלִיַּעַל kennzeichnet den Mann hier als moralisch verwerflich oder gesetzlos. „Nichtswürdig“ bewahrt die wertende Schärfe, ohne „Belial“ als späteren Eigennamen einzutragen.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Scheba, ein Sohn Bichris
  rationale: Die Personennamen werden in einer im Deutschen üblichen biblischen Form wiedergegeben; die Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: אִישׁ יְמִינִי
  choice: aus dem Stamm Benjamin
  rationale: Die Wendung bezeichnet die Stammeszugehörigkeit. Die ausgeschriebene Form ist im modernen Deutschen klarer als das seltenere „Benjaminit“.
- source_word: וַיִּתְקַע בַּשֹּׁפָר
  choice: Er blies das Schofarhorn
  rationale: שׁוֹפָר bezeichnet ein als Signalinstrument verwendetes Horn. „Schofarhorn“ ist präziser als „Trompete“ und bleibt auch ohne Spezialwissen durch den Kontext verständlich.
- source_word: אֵין לָנוּ חֵלֶק בְּדָוִד
  choice: Wir haben keinen Anteil an David
  rationale: חֵלֶק bedeutet Anteil oder Teil und bezeichnet hier bildhaft die politische Zugehörigkeit zu Davids Herrschaft.
- source_word: וְלֹא נַחֲלָה לָנוּ בְּבֶן יִשַׁי
  choice: und kein Erbteil am Sohn Isais
  rationale: „Erbteil“ bewahrt die Grundbedeutung von נַחֲלָה und deren Anklang an zugewiesenen Besitz. Die Bezeichnung „Sohn Isais“ erhält den bewusst nichtköniglichen, möglicherweise abschätzigen Ton.
- source_word: אִישׁ לְאֹהָלָיו
  choice: Jeder zu seinen Zelten
  rationale: Das singularische אִישׁ wird distributiv gebraucht. Die knappe deutsche Form erhält den Charakter eines politischen Losungsrufs und die wörtliche Bildsprache.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Name ist hier eine direkte Anrede an die israelitischen Stämme und bleibt entsprechend am Ende des Ausrufs stehen.
theological_decisions:
- issue: Ob בְּלִיַּעַל als Eigenname oder als Charakterisierung zu verstehen ist
  choice: 'beschreibend: „ein nichtswürdiger Mann“'
  alternative: „ein Mann Belials“ oder „ein Belialsmann“
  rationale: Im erzählerischen Zusammenhang bezeichnet der Ausdruck einen moralisch verwerflichen Menschen. Ein Eigenname würde spätere dämonologische Vorstellungen in den Text eintragen, die diese Stelle nicht verlangt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der rebellische Ausruf bleibt knapp und rhythmisch. „Nichtswürdig“ ist bewusst kräftig, aber nicht konfessionell geprägt; „Schofarhorn“ bewahrt den konkreten kulturellen Gegenstand.
