  text: וַֽ/יַּעֲבֹ֞ר בְּ/כָל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל אָבֵ֛לָ/ה וּ/בֵ֥ית מַעֲכָ֖ה וְ/כָל הַ/בֵּרִ֑ים ו/יקלהו וַ/יָּבֹ֖אוּ אַף אַחֲרָֽי/ו־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/014.yaml
  text: He passed through all the tribes of Israel to Abel and Beth-maacah[b][a], and all the Berites assembled and also followed after him.
translation:
  language: de
  text: Er zog durch alle Stämme Israels nach Abel und Bet-Maacha. Alle Beriter[a] versammelten sich und folgten ihm ebenfalls.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »alle Beriter«. Manche Übersetzungen lesen »alle Bichriter« und beziehen die Bezeichnung aufgrund des Zusammenhangs auf Scheba, den Sohn Bichris. Der masoretische Text legt jedoch unmittelbarer »Beriter« nahe.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Auch sie kamen ihm nach.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: Er zog durch
  rationale: עבר bezeichnet hier die fortschreitende Bewegung durch ein Gebiet. »zog durch« ist im deutschen Erzählstil natürlich und gibt den Reise- beziehungsweise Verfolgungskontext wieder.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: durch alle Stämme Israels
  rationale: 'Die Präposition ב ist hier räumlich-distributiv zu verstehen: Die Bewegung führt durch die Gebiete der israelitischen Stämme.'
- source_word: אָבֵלָה וּבֵית מַעֲכָה
  choice: bis nach Abel und Bet-Maacha
  rationale: Das Richtungs-he an אָבֵלָה bezeichnet die Bewegung auf Abel zu. Bet-Maacha wird als Ortsname wiedergegeben; »bis nach« bezeichnet im Deutschen idiomatisch das erreichte Ziel.
- source_word: וְכָל הַבֵּרִים
  choice: Alle Beriter
  rationale: Der masoretische Text stützt am unmittelbarsten eine gentilizische Bezeichnung »Beriter«. Da ihre genaue Identität unsicher ist, bleibt die transparente Umschrift im Haupttext erhalten.
- source_word: וַיִּקָּהֲלוּ
  choice: versammelten sich
  rationale: Die Verbform bezeichnet das Zusammenkommen beziehungsweise Sichversammeln einer Gruppe.
- source_word: וַיָּבֹאוּ אַף אַחֲרָיו
  choice: und folgten ihm ebenfalls
  rationale: Wörtlich steht eine Verbindung aus »kommen« und »hinter ihm«. Im Zusammenhang bezeichnet sie den Anschluss an seine Bewegung; »ebenfalls« gibt אַף wieder.
