base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/017.yaml
  text: He came near to her[a], and the woman said, “Are you Joab?” He said, “I am.” Then she said to him, “Listen to the words of your servant.” He said, “I am listening.”
translation:
  language: de
  text: 'Er trat zu ihr heran, und die Frau fragte: „Bist du Joab?“ Er antwortete: „Ich bin es.“ Da sagte sie zu ihm: „Hör dir die Worte deiner Dienerin[a] an.“ Er antwortete: „Ich höre zu.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Magd“. Das hebräische Wort ist eine weibliche Selbstbezeichnung, die hier Demut und Dienstbereitschaft ausdrückt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב אֵלֶיהָ
  choice: Er trat zu ihr heran
  rationale: Das Qal von קרב bezeichnet hier die körperliche Annäherung; „zu ihr herantreten“ gibt Bewegung und Zielrichtung natürlich und ohne zusätzliche Deutung wieder.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: אִשָּׁה bezeichnet in diesem Erzählzusammenhang eine erwachsene Frau, nicht eigens eine Ehefrau.
- source_word: הַאַתָּה יוֹאָב
  choice: Bist du Joab?
  rationale: Die Fragepartikel mit dem selbstständigen Pronomen dient der unmittelbaren Feststellung seiner Identität.
- source_word: אָנִי
  choice: Ich bin es
  rationale: Das alleinstehende Pronomen bestätigt knapp die eigene Identität. Die deutsche Wendung ist natürlicher als das isolierte „Ich“ und fügt keine sachliche Information hinzu.
- source_word: שְׁמַע
  choice: Hör
  rationale: Der Imperativ von שמע fordert hier zum aufmerksamen Zuhören auf; „Hör auf …“ bewahrt zugleich den direkten Wortlaut und den bittenden Nachdruck.
- source_word: דִּבְרֵי
  choice: die Worte
  rationale: Der Konstruktplural von דָּבָר wird formnah als „die Worte“ wiedergegeben, statt ihn deutend zu „Botschaft“ oder „Anliegen“ zu erweitern.
- source_word: אֲמָתֶךָ
  choice: deiner Dienerin
  rationale: אָמָה ist eine ausdrücklich weibliche Bezeichnung für eine Dienerin beziehungsweise Sklavin und wird hier als demütige Selbstbezeichnung gebraucht. „Dienerin“ ist im Deutschen verständlich und weniger altertümlich als „Magd“.
- source_word: שֹׁמֵעַ אָנֹכִי
  choice: Ich höre zu
  rationale: Partizip und Pronomen bezeichnen gegenwärtige, aufmerksame Bereitschaft zum Hören. „Ich höre zu“ ist dafür im heutigen Deutsch natürlich und prägnant.
