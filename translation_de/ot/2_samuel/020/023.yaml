base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/023.yaml
  text: Joab was over all the army of Israel[a], and Benaiah son of Jehoiada was over the Cherethites and the Pelethites.
translation:
  language: de
  text: Joab befehligte das gesamte Heer Israels, und Benaja, der Sohn Jojadas, befehligte die Keretiter[a] und die Peletiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die masoretische Randlesung lautet „Keretiter“; der geschriebene Konsonantentext kann auch als „Kariter“ gelesen werden.
