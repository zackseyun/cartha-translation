lexical_decisions:
- source_word: וְ/יוֹאָב אֶל כָּל הַ/צָּבָא יִשְׂרָאֵל
  choice: Joab befehligte das ganze Heer Israels
  rationale: Die verblosen Worte bezeichnen in dieser Ämterliste Joabs Oberbefehl. „Befehligte“ gibt die Funktion von אֶל in diesem ungewöhnlichen Verwaltungsausdruck natürlich wieder; „das ganze Heer“ bewahrt כָּל und trifft die militärische Bedeutung von צָבָא.
- source_word: וּ/בְנָיָה בֶּן יְהוֹיָדָע
  choice: und Benaja, der Sohn Jojadas
  rationale: Die Eigennamen werden in geläufiger deutscher Form wiedergegeben. Die Apposition mit Artikel ist im Deutschen klar und würdevoll.
- source_word: עַל ה/כרי
  choice: befehligte die Kereter[a]
  rationale: עַל bezeichnet hier die Zuständigkeit beziehungsweise den Oberbefehl. „Kereter“ folgt der überlieferten Lesung des Gruppennamens; die abweichende Konsonantenform des vorliegenden Textes wird in einer Fußnote kenntlich gemacht.
- source_word: וְ/עַל הַ/פְּלֵתִי
  choice: und die Pleter
  rationale: Die zweite Präpositionalgruppe steht parallel zur ersten und hängt vom ergänzten Verb „befehligte“ ab. „Pleter“ ist die im Deutschen geläufige Übertragung des Gruppennamens.
theological_decisions: []
translation_notes:
  register: Moderne, klare Standardsprache mit dem für eine militärische Ämterliste passenden Verb „befehligte“. Der einleitende hebräische Anschluss wird schlicht durch die Satzfolge getragen und nicht mit einem unbelegten zeitlichen „nun“ erweitert.
