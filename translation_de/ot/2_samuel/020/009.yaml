  text: וַ/יֹּ֤אמֶר יוֹאָב֙ לַ/עֲמָשָׂ֔א הֲ/שָׁל֥וֹם אַתָּ֖ה אָחִ֑/י וַ/תֹּ֜חֶז יַד יְמִ֥ין יוֹאָ֛ב בִּ/זְקַ֥ן עֲמָשָׂ֖א לִ/נְשָׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/009.yaml
  text: Joab said to Amasa[a], “Is it well with you, my brother?” And Joab took hold of Amasa’s beard with his right hand to kiss him.
translation:
  language: de
  text: 'Joab sagte zu Amasa[a]: »Geht es dir gut, mein Bruder?« Dann fasste Joab mit der rechten Hand Amasa am Bart, um ihn zu küssen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jemanden am Bart zu fassen und ihn zu küssen, konnte zu einer vertrauten Begrüßung gehören; hier ist die Geste, wie der Zusammenhang zeigt, eine Täuschung.
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁלוֹם אַתָּה
  choice: Geht es dir gut?
  rationale: Die hebräische Wendung fragt nach Amasas Wohlergehen. Die deutsche Formulierung ist natürlich und bewahrt den Sinn der Friedens- beziehungsweise Wohlergehensfrage.
- source_word: אָחִי
  choice: mein Bruder
  rationale: Das Possessivsuffix wird ausdrücklich wiedergegeben. Die vertrauliche Anrede bewahrt zugleich die im Kontext vorgetäuschte Herzlichkeit.
- source_word: וַתֹּחֶז
  choice: fasste
  rationale: Das Verb bezeichnet das Ergreifen oder Festhalten. »Fasste« beschreibt die Handlung, ohne bereits die Gewalt des folgenden Verses vorwegzunehmen.
- source_word: יַד יְמִין יוֹאָב
  choice: Joab mit der rechten Hand
  rationale: Die ausdrückliche Angabe der rechten Hand bleibt erhalten und wird in natürlicher deutscher Satzstellung formuliert.
- source_word: בִּזְקַן עֲמָשָׂא
  choice: Amasa am Bart
  rationale: Bei deutschen Verben des Anfassens ist die Konstruktion »jemanden am Bart fassen« idiomatischer als ein direktes Possessiv, ohne den Sachgehalt zu verändern.
- source_word: לִנְשָׁק לוֹ
  choice: um ihn zu küssen
  rationale: Der mit ל gebildete Infinitiv drückt hier den Zweck der Handlung aus; »um ihn zu küssen« gibt dies eindeutig und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede klingt natürlich; die kulturell bedeutsamen Einzelheiten der rechten Hand, des Bartes und des Kusses bleiben erhalten.
