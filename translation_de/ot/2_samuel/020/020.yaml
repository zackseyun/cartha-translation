base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/020.yaml
  text: Joab answered and said[a], “Far be it from me, far be it, if I should swallow up or destroy!”
translation:
  language: de
  text: 'Joab antwortete: »Das sei mir fern, das sei mir fern, dass ich verschlinge oder vernichte![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dass ich verschlucke oder zugrunde richte«. Das Hebräische gebraucht anschauliche Verben für das Verzehren und Vernichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן יוֹאָב וַיֹּאמַר
  choice: Joab antwortete
  rationale: Die beiden hebräischen Redeeinleitungsverben bilden eine übliche narrative Formel. Im heutigen Deutsch gibt »antwortete« den Redeanschluss natürlich wieder, ohne das schwerfällige »antwortete und sagte«.
- source_word: חָלִילָה חָלִילָה לִי
  choice: Das sei mir fern, das sei mir fern
  rationale: Die idiomatische Zurückweisung wird in würdigem, verständlichem Deutsch wiedergegeben; die Wiederholung bewahrt den starken Nachdruck des Hebräischen.
- source_word: אִם ... וְאִם
  choice: dass ... oder
  rationale: Nach der deutschen Wendung »Das sei mir fern« führt »dass« die entschieden zurückgewiesene Möglichkeit natürlich ein; »oder« verbindet die beiden verneinten Handlungen sinngemäß.
- source_word: אֲבַלַּע
  choice: ich verschlinge
  rationale: Das Verb בלע bezeichnet wörtlich das Verschlingen. Die bildhafte Ausdrucksweise bleibt erhalten, obwohl hier im Belagerungskontext die gewaltsame Einnahme beziehungsweise Vernichtung gemeint ist.
- source_word: אַשְׁחִית
  choice: ich vernichte
  rationale: Die Hifil-Form von שׁחת bedeutet »vernichten« oder »zugrunde richten«. »Vernichten« ist hier knapp, deutlich und dem militärischen Zusammenhang angemessen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederholung und das Bild des Verschlingens bleiben erhalten; die doppelte hebräische Redeeinleitung wird zur natürlichen deutschen Form »antwortete« verdichtet.
