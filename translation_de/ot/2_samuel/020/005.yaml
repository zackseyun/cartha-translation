  text: So Amasa went to summon Judah[a], but he delayed beyond the appointed time that he had set for him.
translation:
  language: de
  text: So ging Amasa los, um Juda zusammenzurufen[a]. Doch er verspätete sich über die festgesetzte Zeit hinaus, die ihm gesetzt worden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um Juda aufzubieten“. Das hebräische Verb bezeichnet ein dringliches Zusammenrufen und schließt hier wahrscheinlich eine militärische Mobilisierung ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging … los
  rationale: Die erzählende Form von הלך führt Amasas Handlung ein. „ging … los“ klingt im modernen Deutschen natürlich und bringt den Aufbruch zum Ausdruck.
- source_word: לְהַזְעִיק
  choice: um … zusammenzurufen
  rationale: Der Hifil von זעק bezeichnet hier ein dringliches Zusammenrufen. Die Formulierung wahrt den offiziellen und dringlichen Sinn, ohne die militärische Bedeutung im Haupttext stärker festzulegen, als es das Verb allein verlangt.
- source_word: אֶת יְהוּדָה
  choice: Juda
  rationale: Juda steht kollektiv für dessen Bevölkerung beziehungsweise wehrfähige Männer. Die knappe Wiedergabe bewahrt die Ausdrucksweise des Hebräischen.
- source_word: וייחר
  choice: er kam später
  rationale: Die Form von אחר bedeutet in diesem Zusammenhang, dass Amasa die gesetzte Frist überschritt. „kam später“ verbindet sich im Deutschen natürlich mit dem anschließenden Vergleichsmaßstab.
- source_word: מִן הַמּוֹעֵד
  choice: als zu dem Zeitpunkt
  rationale: מוֹעֵד bezeichnet einen festgesetzten Zeitpunkt. Zusammen mit מן und אחר drückt die Wendung aus, dass dieser Zeitpunkt überschritten wurde.
- source_word: אֲשֶׁר יְעָדוֹ
  choice: den David ihm gesetzt hatte
  rationale: יעד bedeutet hier, einen Zeitpunkt festzusetzen. Das im Hebräischen unausgedrückte Subjekt ist aus dem unmittelbaren Kontext David; die Nennung vermeidet im Deutschen den missverständlichen Eindruck, Amasa habe sich selbst die Frist gesetzt.
