  to: Als David in sein Haus in Jerusalem kam, nahm der König die zehn Frauen, seine Nebenfrauen, die er zurückgelassen hatte, damit sie das Haus hüteten, und brachte sie in Gewahrsam[a]. Er sorgte für ihren Unterhalt, ging aber nicht zu ihnen ein[b]. So blieben sie bis zu ihrem Tod eingeschlossen und lebten in Witwenschaft[c].
  rationale: Die Revision entfernt die nicht ausdrücklich markierte Zusatznuance „mehr“ und ersetzt die potenziell missverständliche Formulierung „in ein Haus unter Bewachung“ durch das natürliche und kontextgenaue „in Gewahrsam“. Die Fußnote bewahrt weiterhin die konkrete hebräische Formulierung mit „Haus“. Alle Anker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
