  source_fidelity: 'Die Übersetzung bildet die Abfolge des hebräischen Textes im Wesentlichen zuverlässig ab: Davids Rückkehr, die zehn Nebenfrauen, ihre Unterbringung, Versorgung, sexuelle Enthaltung sowie ihre dauerhafte Absonderung. Das im Entwurf ergänzte „mehr“ in „ging aber nicht mehr zu ihnen ein“ steht jedoch nicht ausdrücklich im Hebräischen. Der Kontext kann eine fortdauernde Trennung nahelegen, aber die Übersetzung sollte dies nicht zusätzlich lexikalisch festlegen.'
