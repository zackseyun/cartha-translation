source:
  edition: WLC
  text: וַ/יָּבֹ֨א דָוִ֣ד אֶל בֵּית/וֹ֮ יְרֽוּשָׁלִַם֒ וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֵ֣ת עֶֽשֶׂר נָשִׁ֣ים פִּלַגְשִׁ֡ים אֲשֶׁ֣ר הִנִּיחַ֩ לִ/שְׁמֹ֨ר הַ/בַּ֜יִת וַֽ/יִּתְּנֵ֤/ם בֵּית מִשְׁמֶ֨רֶת֙ וַֽ/יְכַלְכְּלֵ֔/ם וַ/אֲלֵי/הֶ֖ם לֹא בָ֑א וַ/תִּהְיֶ֧ינָה צְרֻר֛וֹת עַד י֥וֹם מֻתָ֖/ן אַלְמְנ֥וּת חַיּֽוּת־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/003.yaml
  text: When David came to his house at Jerusalem[a], the king took the ten women, the concubines whom he had left to keep the house, and put them in guarded custody and provided for them, but he did not go in to them. So they were kept confined until the day of their death[c][b], living as widows.
translation:
  language: de
  text: Als David in sein Haus in Jerusalem kam, nahm der König die zehn Frauen, seine Nebenfrauen, die er zurückgelassen hatte, damit sie das Haus hüteten, und brachte sie in Gewahrsam[a]. Er sorgte für ihren Unterhalt, ging aber nicht zu ihnen ein[b]. So blieben sie bis zu ihrem Tod eingeschlossen und lebten in Witwenschaft[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „in ein Haus der Bewachung“ oder „in ein Haus des Gewahrsams“. Gemeint ist eine abgesonderte Unterkunft unter Aufsicht.
    reason: lexical_alternative
  - marker: b
    text: „Zu ihnen eingehen“ ist eine hebräische Umschreibung für geschlechtliche Beziehungen.
    reason: cultural_note
  - marker: c
    text: Wörtlich etwa „Witwenschaft des Lebens“ oder „Witwenschaft bei Lebzeiten“. Die ungewöhnliche Wendung beschreibt, dass sie wie Witwen lebten, obwohl ihr Mann noch lebte; sie kann zugleich eine lebenslange Witwenschaft ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: sein Haus
  rationale: בַּיִת kann Haus, Palast oder Haushalt bezeichnen. „Sein Haus“ bewahrt die konkrete und zugleich offene Ausdrucksweise des Hebräischen; aus dem Kontext ist die königliche Residenz ersichtlich.
- source_word: פִּלַגְשִׁים
  choice: Nebenfrauen
  rationale: Der Ausdruck bezeichnet Frauen mit anerkannter, aber gegenüber einer Hauptfrau nachgeordneter Stellung. „Nebenfrauen“ gibt diese soziale Stellung im heutigen Deutsch verständlicher wieder als das leicht abwertend wirkende „Konkubinen“.
- source_word: הִנִּיחַ לִשְׁמֹר הַבַּיִת
  choice: zurückgelassen hatte, damit sie das Haus hüteten
  rationale: שׁמר umfasst bewachen, hüten und achtgeben. „Das Haus hüten“ ist natürliches Deutsch und lässt sowohl Aufsicht als auch Bewachung anklingen.
- source_word: בֵּית מִשְׁמֶרֶת
  choice: ein Haus unter Bewachung
  rationale: Die Wendung lautet wörtlich „Haus der Bewachung/des Gewahrsams“. Die gewählte Form erhält das konkrete „Haus“ und macht zugleich deutlich, dass die Frauen dort unter Aufsicht und nicht in gewöhnlicher Unterkunft lebten.
- source_word: וַיְכַלְכְּלֵם
  choice: sorgte für ihren Unterhalt
  rationale: Das Verb bezeichnet das fortlaufende Versorgen mit dem Lebensnotwendigen. Die Formulierung ist klar und vermeidet den möglichen Eindruck bloß gelegentlicher Hilfe.
- source_word: וַאֲלֵיהֶם לֹא בָא
  choice: ging aber nicht mehr zu ihnen ein
  rationale: בוא אל ist hier eine verhüllende Bezeichnung für geschlechtliche Beziehungen. Die deutsche biblische Wendung bewahrt den Euphemismus; „mehr“ verdeutlicht im Erzählzusammenhang die fortan geltende Trennung, ohne deren Grund zu bewerten.
- source_word: צְרֻרוֹת
  choice: blieben ... eingeschlossen
  rationale: Das passive Partizip beschreibt einen anhaltenden Zustand des Abgesondert- oder Eingeschlossenseins. „Blieben eingeschlossen“ gibt diese durative, resultative Bedeutung wieder.
- source_word: עַד יוֹם מֻתָן
  choice: bis zu ihrem Tod
  rationale: Dies ist die natürliche deutsche Wiedergabe der hebräischen Nominalwendung „bis zum Tag ihres Todes“.
- source_word: אַלְמְנוּת חַיּוּת
  choice: lebten in Witwenschaft
  rationale: Die ungewöhnliche hebräische Wendung verbindet Witwenschaft mit fortdauerndem Leben. Die Übersetzung bewahrt den harten, paradoxen Zustand, während die Fußnote die wörtliche Form und ihre Deutung offenlegt.
theological_decisions:
- issue: Moralische und soziale Bewertung von Davids Behandlung der Nebenfrauen
  choice: 'Das Geschehen wird nüchtern und ohne Beschönigung beschrieben: Bewachung, Versorgung, dauerhafte sexuelle Trennung und ein Leben in Witwenschaft.'
  alternative: Die Unterbringung ausschließlich als Schutzmaßnahme darstellen oder Davids Handeln mit ausdrücklich verurteilender Sprache bewerten.
  rationale: Der hebräische Text berichtet die Maßnahmen und ihre lebenslangen Folgen, spricht aber an dieser Stelle kein ausdrückliches moralisches Urteil aus. Die Übersetzung soll weder rechtfertigen noch über den Wortlaut hinaus verurteilen.
- issue: Bedeutung von אַלְמְנוּת חַיּוּת
  choice: Die paradoxe Vorstellung einer Witwenschaft bei fortdauerndem Leben wird im Text bewahrt und in der Fußnote erläutert.
  alternative: Explizit festlegen, dass allein Davids Weiterleben gemeint ist, oder die Wendung ausschließlich als „lebenslange Witwenschaft“ verstehen.
  rationale: Die knappe und ungewöhnliche hebräische Formulierung lässt die genaue Beziehung von „Witwenschaft“ und „Leben“ offen. Eine eindeutige Auflösung würde mehr sagen als der Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrten hebräischen Bildern. „Nebenfrauen“ ist für einbarme soziale Verständlichkeit gewählt; „ging ... zu ihnen ein“ erhält den zurückhaltenden Euphemismus des Ausgangstextes. Die wiederholten Begriffe aus dem Feld von Bewachung und Einschließung bleiben hörbar, damit die Härte der geschilderten Lage nicht abgeschwächt wird.
