source:
  edition: WLC
  text: וַ/יַּ֜עַל כָּל אִ֤ישׁ יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י דָוִ֔ד אַחֲרֵ֖י שֶׁ֣בַע בֶּן בִּכְרִ֑י וְ/אִ֤ישׁ יְהוּדָה֙ דָּבְק֣וּ בְ/מַלְכָּ֔/ם מִן הַ/יַּרְדֵּ֖ן וְ/עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/002.yaml
  text: So every man of Israel went up from following David to follow Sheba son of Bichri[a], but the men of Judah held fast to their king[b], from the Jordan to Jerusalem.
translation:
  language: de
  text: Da zogen alle Männer Israels von David weg und Scheba, dem Sohn Bichris, nach. Die Männer Judas aber hielten fest zu ihrem König, vom Jordan bis nach Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: wandten sich … ab
  rationale: עלה bedeutet wörtlich „hinaufgehen“, bezeichnet hier im Zusammenhang aber den Abzug beziehungsweise die Abkehr von David. Die Verbindung mit מֵאַחֲרֵי macht im Deutschen „sich von … abwenden“ natürlich und gibt den Wechsel der Gefolgschaft wieder, ohne eine konkrete Marschrichtung zu behaupten.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: alle Männer Israels
  rationale: Die hebräische distributive Kollektivform lautet wörtlich „jeder Mann Israels“. Im Deutschen ist „alle Männer Israels“ idiomatischer und bewahrt den männlichen kollektiven Bezug.
- source_word: מֵאַחֲרֵי דָוִד … אַחֲרֵי שֶׁבַע
  choice: von David ab und folgten Scheba
  rationale: Die Wiederholung von אַחֲרֵי stellt die bisherige Gefolgschaft Davids der neuen Gefolgschaft Schebas gegenüber. Die deutsche Formulierung macht diesen Loyalitätswechsel klar.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Scheba, dem Sohn Bichris
  rationale: Die Namensform „Scheba“ entspricht gebräuchlicher deutscher Bibeltradition; das Patronym wird natürlich als „Sohn Bichris“ wiedergegeben.
- source_word: וְאִישׁ יְהוּדָה
  choice: Die Männer Judas aber
  rationale: אִישׁ steht hier kollektiv und verlangt wegen des pluralischen Verbs eine pluralische Wiedergabe. „Aber“ bringt den im Satzbau deutlich angelegten Gegensatz zum Verhalten Israels zum Ausdruck.
- source_word: דָּבְקוּ בְמַלְכָּם
  choice: hielten fest zu ihrem König
  rationale: דבק bezeichnet festes Haften oder Sich-Anschließen. „Fest zu jemandem halten“ bewahrt das Bild und vermittelt zugleich die politische Loyalität, ohne sie nur abstrakt zu paraphrasieren.
- source_word: מִן הַיַּרְדֵּן וְעַד יְרוּשָׁלָם
  choice: vom Jordan bis nach Jerusalem
  rationale: Die Konstruktion מִן … וְעַד bezeichnet die räumliche Strecke. Bei einem Zielort ist „bis nach Jerusalem“ im Deutschen natürlich.
theological_decisions:
- issue: Art der Abkehr Israels von David
  choice: als Wechsel der Gefolgschaft ausgedrückt
  alternative: das Verb עלה wörtlich mit „hinaufziehen“ wiedergeben
  rationale: Der unmittelbare Parallelismus „von hinter David … hinter Scheba“ betrifft politische Gefolgschaft. Die Übersetzung macht dies sichtbar, legt aber keine weitergehende theologische Bewertung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die kollektiven männlichen Bezeichnungen des Hebräischen bleiben erhalten. Die bewusst knappe Gegenüberstellung zwischen Israels Abkehr und Judas Festhalten wird gewahrt.
