  text: לֹא כֵ֣ן הַ/דָּבָ֗ר כִּ֡י אִישׁ֩ מֵ/הַ֨ר אֶפְרַ֜יִם שֶׁ֧בַע בֶּן בִּכְרִ֣י שְׁמ֗/וֹ נָשָׂ֤א יָד/וֹ֙ בַּ/מֶּ֣לֶךְ בְּ/דָוִ֔ד תְּנֽוּ אֹת֣/וֹ לְ/בַדּ֔/וֹ וְ/אֵלְכָ֖ה מֵ/עַ֣ל הָ/עִ֑יר וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל יוֹאָ֔ב הִנֵּ֥ה רֹאשׁ֛/וֹ מֻשְׁלָ֥ךְ אֵלֶ֖י/ךָ בְּעַ֥ד הַ/חוֹמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
translation:
  language: de
  text: '„So verhält es sich nicht. Vielmehr hat ein Mann aus dem Bergland Ephraims[a], Scheba, der Sohn Bichris, seine Hand gegen den König, gegen David, erhoben[b]. Liefert nur ihn aus, dann werde ich von der Stadt abziehen.“ Die Frau sagte zu Joab: „Siehe, sein Kopf wird dir über die Mauer zugeworfen werden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Gebirge Ephraim“; traditionell auch: „vom Gebirge Ephraim“. Der Ausdruck kann die Bergregion Ephraims bezeichnen, nicht nur einen einzelnen Berg.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Bild lautet wörtlich „hat seine Hand erhoben“ und bedeutet hier, dass er sich feindselig gegen den König aufgelehnt hat.
    reason: idiom_explanation
lexical_decisions:
- source_word: לֹא כֵן הַדָּבָר
  choice: So verhält es sich nicht
  rationale: Gibt die idiomatische Zurückweisung der vorausgehenden Annahme natürlich wieder, ohne die hebräische Wortstellung nachzuahmen.
- source_word: כִּי
  choice: Vielmehr
  rationale: Leitet nach der Verneinung die richtigstellende Erklärung ein.
- source_word: מֵהַר אֶפְרַיִם
  choice: aus dem Bergland Ephraims
  rationale: Bezeichnet hier am ehesten die gebirgige Region Ephraims und nicht zwingend einen einzelnen Berg.
- source_word: שֶׁבַע בֶּן בִּכְרִי שְׁמוֹ
  choice: der Scheba, der Sohn Bichris, heißt
  rationale: Gibt die hebräische Namensformel in natürlichem, eindeutigem Deutsch wieder.
- source_word: נָשָׂא יָדוֹ
  choice: seine Hand ... erhoben
  rationale: Bewahrt das konkrete hebräische Bild; der Zusammenhang lässt den Sinn feindseliger Auflehnung erkennen.
- source_word: בַּמֶּלֶךְ בְּדָוִד
  choice: gegen den König, gegen David
  rationale: Erhält die wiederholte Präposition und damit die nachdrückliche Apposition des Hebräischen.
- source_word: תְּנוּ אֹתוֹ לְבַדּוֹ
  choice: Liefert nur ihn aus
  rationale: Das pluralische Imperativ richtet sich an die Stadtbewohner; „nur ihn“ wahrt die ausschließende Bedeutung von לְבַדּוֹ.
- source_word: וְאֵלְכָה מֵעַל הָעִיר
  choice: dann werde ich von der Stadt abziehen
  rationale: Im Belagerungskontext bezeichnet die Wendung den militärischen Rückzug von der Stadt.
- source_word: הִנֵּה רֹאשׁוֹ מֻשְׁלָךְ אֵלֶיךָ
  choice: Sein Kopf wird dir gleich ... zugeworfen werden
  rationale: הִנֵּה mit dem Passivpartizip stellt das angekündigte Geschehen als unmittelbar bevorstehend dar; „gleich“ macht diese Funktion im Deutschen sichtbar.
- source_word: בְּעַד הַחוֹמָה
  choice: über die Mauer
  rationale: Entspricht der im Kontext naheliegenden Bewegung von innerhalb der Stadt zu Joab außerhalb der Mauer.
theological_decisions:
- issue: Bedeutung der Wendung נָשָׂא יָדוֹ
  choice: Das Bild „seine Hand ... erhoben“ bleibt im Haupttext erhalten.
  alternative: „sich gegen den König aufgelehnt“ oder „gegen den König rebelliert“
  rationale: Die bildhafte Formulierung des Hebräischen ist verständlich und bewahrt die Spannung zwischen konkretem Bild und übertragener Bedeutung; die Fußnote erläutert den Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Scheba“ und „Bichri“ folgen geläufigen deutschen Namensformen. Die direkte Rede bleibt bestimmt und knapp; „gleich“ gibt die Unmittelbarkeit der hebräischen Präsentationsformel natürlich wieder.
