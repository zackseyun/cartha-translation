source:
  edition: WLC
  text: אָנֹכִ֕י שְׁלֻמֵ֖י אֱמוּנֵ֣י יִשְׂרָאֵ֑ל אַתָּ֣ה מְבַקֵּ֗שׁ לְ/הָמִ֨ית עִ֤יר וְ/אֵם֙ בְּ/יִשְׂרָאֵ֔ל לָ֥/מָּה תְבַלַּ֖ע נַחֲלַ֥ת יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/019.yaml
  text: I am one of the peaceable and faithful in Israel. You are seeking to destroy a city[a], and a mother in Israel. Why would you swallow up the inheritance of Yahweh?
translation:
  language: de
  text: Ich gehöre zu den Friedfertigen und Treuen in Israel. Du willst eine Stadt und eine Mutter in Israel[a] vernichten. Warum willst du das Erbe Jahwes verschlingen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Stadt, die eine Mutter in Israel ist“; wahrscheinlich ist damit eine bedeutende oder fürsorgliche Stadt innerhalb Israels gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֻמֵי אֱמוּנֵי יִשְׂרָאֵל
  choice: zu den Friedfertigen und Treuen in Israel
  rationale: Die substantivierten Pluralformen bezeichnen eine Gruppe, der die Sprecherin sich zurechnet. „Friedfertigen“ und „Treuen“ geben die soziale Haltung und Verlässlichkeit natürlich wieder.
- source_word: מְבַקֵּשׁ לְהָמִית
  choice: willst … vernichten
  rationale: Die Konstruktion bezeichnet eine gegenwärtige Absicht. Da eine Stadt Objekt des Verbs ist, drückt „vernichten“ den kontextuellen Sinn idiomatisch aus, ohne die gewaltsame Tötungsabsicht abzuschwächen.
- source_word: עִיר וְאֵם בְּיִשְׂרָאֵל
  choice: eine Stadt und eine Mutter in Israel
  rationale: Die wörtliche Verbindung bewahrt das eindrückliche Mutterbild sowie die Möglichkeit, dass die beiden Ausdrücke appositionell gemeint sind. Die wahrscheinlichere appositionelle Deutung wird in der Fußnote genannt.
- source_word: תְבַלַּע
  choice: verschlingen
  rationale: Das konkrete Bild des Verschlingens bleibt erhalten und bezeichnet im Belagerungskontext metaphorisch die vollständige Zerstörung.
- source_word: נַחֲלַת יְהוָה
  choice: das Erbe Jahwes
  rationale: „Erbe“ bewahrt den bundestheologischen Gedanken, dass Israel Jahwe gehört; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Metaphorische Bedeutung von „Mutter in Israel“
  choice: Das Mutterbild bleibt im Haupttext unaufgelöst erhalten.
  alternative: „eine Stadt, die eine Mutter in Israel ist“ oder deutender „eine führende Stadt in Israel“
  rationale: Der hebräische Ausdruck kann appositionell verstanden werden, doch die genaue Funktion des Mutterbildes ist nicht vollständig festgelegt. Die Übersetzung bewahrt deshalb Bild und Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ich gehöre zu“ vermeidet eine unnatürliche wörtliche Substantivkonstruktion; „verschlingen“ erhält die kräftige Bildsprache des Hebräischen.
