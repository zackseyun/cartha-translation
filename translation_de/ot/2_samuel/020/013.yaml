id: 2SA.20.13
reference: 2 Samuel 20:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֥ר הֹגָ֖ה מִן הַֽ/מְסִלָּ֑ה עָבַ֤ר כָּל אִישׁ֙ אַחֲרֵ֣י יוֹאָ֔ב לִ/רְדֹּ֕ף אַחֲרֵ֖י שֶׁ֥בַע בֶּן בִּכְרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/013.yaml
  text: As soon as he had been removed from the highway[a], every man passed on after Joab to pursue Sheba son of Bichri.
translation:
  language: de
  text: Sobald er von der Straße[a] weggebracht worden war, zog jeder Mann hinter Joab her, um Scheba, den Sohn Bichris, zu verfolgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Hauptstraße“. Das hebräische Wort kann eine aufgeschüttete Straße oder einen Hauptweg bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Sobald
  rationale: Leitet einen temporalen Nebensatz ein und gibt im Erzählzusammenhang die unmittelbare Abfolge natürlich wieder.
- source_word: הֹגָה
  choice: er … weggebracht worden war
  rationale: Die Hophal-Form bezeichnet, dass der zuvor genannte Amasa beziehungsweise sein Leichnam von anderen entfernt wurde. Das Plusquamperfekt verdeutlicht, dass dies dem Weiterziehen vorausging.
- source_word: מִן הַמְסִלָּה
  choice: von der Straße
  rationale: מְסִלָּה kann eine aufgeschüttete Straße oder Hauptstraße bezeichnen; im Kontext ist das natürliche deutsche Wort „Straße“ ausreichend, während eine Fußnote die genauere Alternative bewahrt.
- source_word: עָבַר
  choice: zog … her
  rationale: Das Verb beschreibt hier das Weiterziehen der Truppe, nachdem das Hindernis beseitigt war.
- source_word: כָּל אִישׁ
  choice: jeder Mann
  rationale: Bewahrt den singularischen Kollektivausdruck und macht deutlich, dass die Männer der Streitmacht gemeint sind.
- source_word: אַחֲרֵי יוֹאָב
  choice: hinter Joab her
  rationale: Gibt das räumliche und führungsbezogene Folgen im Deutschen idiomatisch wieder.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: um … zu verfolgen
  rationale: Der Infinitiv bezeichnet den Zweck des Weiterziehens; „verfolgen“ passt zum militärischen Erzählzusammenhang.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Scheba, den Sohn Bichris
  rationale: Bewahrt die hebräische Namens- und Abstammungsangabe in natürlicher deutscher Form.
