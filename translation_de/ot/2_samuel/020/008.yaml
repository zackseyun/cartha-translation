  text: הֵ֗ם עִם הָ/אֶ֤בֶן הַ/גְּדוֹלָה֙ אֲשֶׁ֣ר בְּ/גִבְע֔וֹן וַ/עֲמָשָׂ֖א בָּ֣א לִ/פְנֵי/הֶ֑ם וְ/יוֹאָ֞ב חָג֣וּר מִדּ֣/וֹ לְבֻשׁ֗/וּ ו/על/ו חֲג֥וֹר חֶ֨רֶב֙ מְצֻמֶּ֤דֶת עַל מָתְנָי/ו֙ בְּ/תַעְרָ֔/הּ וְ/ה֥וּא יָצָ֖א וַ/תִּפֹּֽל־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/008.yaml
  text: When they were by the great stone that is in Gibeon[a], Amasa came before them. Now Joab was dressed in his military garment, and over it was a belt with a sword fastened to his waist in its sheath; and as he went out[c][b], it fell.
translation:
  language: de
  text: Als sie bei dem großen Stein waren, der in Gibeon liegt, kam Amasa auf sie zu[a]. Joab aber hatte sein Kriegsgewand[b] angelegt; darüber trug er einen Gürtel mit einem Schwert, das in seiner Scheide an seiner Hüfte befestigt war. Als er hinausging, fiel es[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „kam Amasa ihnen entgegen“. Wörtlich steht im Hebräischen: „kam vor sie“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „sein Gewand“ oder „das Gewand, das er trug“. Das hebräische Wort kann in diesem Zusammenhang eine militärische Kleidung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Mit „es“ ist wahrscheinlich das Schwert gemeint. Das hebräische Verb steht in einer grammatisch femininen Form, die zu dem hebräischen Wort für „Schwert“ passt.
    reason: referent_clarification
lexical_decisions:
- source_word: הֵם עִם הָאֶבֶן הַגְּדוֹלָה
  choice: Als sie bei dem großen Stein waren
  rationale: עִם kann bei einer Ortsangabe den Aufenthalt bei oder nahe einem Ort bezeichnen. „Bei“ gibt dies im Deutschen natürlich wieder.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: der in Gibeon liegt
  rationale: Der Relativsatz bestimmt den Standort des Steins; „liegt“ ist für einen markanten Stein eine natürliche deutsche Ortsangabe.
- source_word: וַעֲמָשָׂא בָּא לִפְנֵיהֶם
  choice: kam Amasa vor sie
  rationale: Die Wiedergabe bewahrt die räumliche Offenheit von לִפְנֵי („vor, vor das Angesicht von“), ohne eindeutig festzulegen, ob Amasa ihnen nur entgegentrat oder vor ihnen ankam.
- source_word: חָגוּר מִדּוֹ לְבֻשׁוֹ
  choice: hatte sein Kriegsgewand angelegt
  rationale: מַד bezeichnet ein besonderes Gewand und kann gerade im militärischen Zusammenhang eine Kriegstracht meinen. Die Formulierung gibt zugleich den durch חָגוּר ausgedrückten Zustand des Angekleidetseins idiomatisch wieder.
- source_word: וְעָלָיו חֲגוֹר
  choice: darüber trug er einen Gürtel
  rationale: Die Formulierung macht die Schichtung von Gewand und Gürtel verständlich und gibt חֲגוֹר als Gürtel beziehungsweise Gurt wieder.
- source_word: חֶרֶב מְצֻמֶּדֶת עַל מָתְנָיו בְּתַעְרָהּ
  choice: mit einem Schwert, das in seiner Scheide an seiner Hüfte befestigt war
  rationale: מְצֻמֶּדֶת bezeichnet das feste Anbringen; מָתְנַיִם meint Hüften/Lenden, und תַּעַר bezeichnet hier die Schwertscheide.
- source_word: וְהוּא יָצָא
  choice: Als er hinausging
  rationale: Die temporale Verknüpfung stellt den Vorgang als Begleitumstand des folgenden Fallens dar und hält die Bewegungsrichtung von יָצָא fest.
- source_word: וַתִּפֹּל
  choice: fiel es
  rationale: Das Pronomen lässt den im Hebräischen nicht ausdrücklich wiederholten Bezug bestehen; am wahrscheinlichsten ist das zuvor genannte Schwert gemeint.
