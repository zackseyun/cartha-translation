base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/007.yaml
  text: Joab’s men[a], the Kerethites, the Pelethites, and all the mighty men went out after him. They went out from Jerusalem to pursue Sheba son of Bichri.
translation:
  language: de
  text: Da zogen die Männer Joabs, die Keretiter, die Peletiter und alle Krieger hinter ihm her. Sie zogen von Jerusalem aus, um Scheba, den Sohn Bichris, zu verfolgen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ ... אַחֲרָיו
  choice: Da zogen ... hinter ihm her
  rationale: Die Wendung bezeichnet das Ausziehen in der Folge einer Person. „Hinter ihm her“ bewahrt die im Hebräischen bestehende Unbestimmtheit des Bezugs von „ihm“, während „Da“ den erzählerischen Anschluss wiedergibt.
- source_word: אַנְשֵׁי יוֹאָב
  choice: die Männer Joabs
  rationale: Die Status-constructus-Verbindung bezeichnet die Joab zugeordneten oder unterstellten Männer; der deutsche Genitiv ist natürlich und quellennah.
- source_word: הַכְּרֵתִי
  choice: die Keretiter
  rationale: Der Gruppenname wird nah am hebräischen Konsonantenbestand transliteriert, ohne seine genaue Funktion spekulativ festzulegen.
- source_word: הַפְּלֵתִי
  choice: die Peletiter
  rationale: Der Eigenname der gewöhnlich zusammen mit den Keretitern genannten Gruppe wird transliteriert.
- source_word: כָל הַגִּבֹּרִים
  choice: alle Kriegshelden
  rationale: גִּבּוֹרִים bezeichnet hier im militärischen Kontext kampferprobte, starke Männer. „Kriegshelden“ gibt diese Bedeutung würdig und verständlich wieder.
- source_word: מִירוּשָׁלִַם
  choice: aus Jerusalem
  rationale: Die Präposition מִן bezeichnet den Ausgangspunkt der Bewegung.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: um ... zu verfolgen
  rationale: רדף mit אחרי bezeichnet zielgerichtete Verfolgung; der deutsche Infinitivsatz gibt den Zweck des Ausziehens natürlich wieder.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Scheba, den Sohn Bichris
  rationale: Das hebräische Patronym wird in natürlicher deutscher Form wiedergegeben; der Akkusativ wird durch die Apposition klar markiert.
