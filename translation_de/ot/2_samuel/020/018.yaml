  text: וַ/תֹּ֖אמֶר לֵ/אמֹ֑ר דַּבֵּ֨ר יְדַבְּר֤וּ בָ/רִֽאשֹׁנָה֙ לֵ/אמֹ֔ר שָׁאֹ֧ל יְשָׁאֲל֛וּ בְּ/אָבֵ֖ל וְ/כֵ֥ן הֵתַֽמּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/018.yaml
  text: Then she said[a], “They used to say in former times[b], ‘Let them surely ask at Abel,’ and so they ended the matter.”
translation:
  language: de
  text: 'Dann sagte sie[a]: »Früher pflegte man zu sagen: ›Man soll gewiss in Abel[b] nachfragen‹, und so brachten sie die Sache zum Abschluss.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satzbau lässt auch folgende Gliederung zu: »Dann sagte sie: ›Früher sagte man mit Nachdruck: Man soll gewiss in Abel nachfragen; so brachte man es zum Abschluss.‹« Beide Verbverbindungen sind im Hebräischen betont; das letzte Verb kann auch mit »beenden« oder »vollenden« übersetzt werden.'
    reason: lexical_alternative
  - marker: b
    text: »Abel« ist hier die Kurzform von Abel-Bet-Maacha, der in diesem Zusammenhang belagerten Stadt.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר לֵאמֹר
  choice: Dann sagte sie
  rationale: Die Erzählform führt die fortgesetzte Rede der Frau ein; das erste לֵאמֹר wird im Deutschen natürlich durch die direkte Rede wiedergegeben.
- source_word: דַּבֵּר יְדַבְּרוּ
  choice: pflegte man zu sagen
  rationale: Infinitivus absolutus plus Imperfekt beschreibt hier am ehesten einen nachdrücklich bezeugten früheren Sprachgebrauch; die unbestimmte 3. Person Plural wird idiomatisch mit »man« wiedergegeben.
- source_word: בָרִאשֹׁנָה
  choice: Früher
  rationale: Bezeichnet einen früheren Brauch oder eine überlieferte Gepflogenheit, nicht zwingend den ersten Schritt eines Ablaufs.
- source_word: שָׁאֹל יְשָׁאֲלוּ
  choice: Man soll gewiss … nachfragen
  rationale: Die Verbindung aus Infinitivus absolutus und Imperfekt verstärkt die Aufforderung beziehungsweise Feststellung. »gewiss« bewahrt die Emphase, während »nachfragen« den Sinn von Rat oder Auskunft einholen natürlich ausdrückt.
- source_word: בְּאָבֵל
  choice: in Abel
  rationale: Die Präposition בְּ wird örtlich wiedergegeben; Abel ist hier die Kurzform des Stadtnamens Abel-Bet-Maacha.
- source_word: וְכֵן הֵתַמּוּ
  choice: und so brachten sie die Sache zum Abschluss
  rationale: Das Hifil von תמם bezeichnet das Zu-Ende-Bringen. Die Ergänzung »die Sache« macht den im Deutschen erforderlichen Gegenstandsbezug deutlich, ohne die mögliche Bedeutung auf eine bestimmte Art der Beilegung einzuengen.
theological_decisions: []
