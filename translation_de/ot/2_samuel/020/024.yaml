lexical_decisions:
- source_word: אֲדֹרָם
  choice: Adoram
  rationale: Der Personenname wird in einer im Deutschen üblichen, eng am Hebräischen orientierten Form wiedergegeben.
- source_word: עַל
  choice: war für … zuständig
  rationale: Die Präposition bezeichnet hier in einer Ämterliste die Aufsicht über einen Verwaltungsbereich; die Kopula wird aus dem hebräischen Nominalsatz ergänzt.
- source_word: הַמַּס
  choice: die Fronarbeit
  rationale: Der Ausdruck bezeichnet in diesem königlichen Verwaltungskontext verpflichtende Arbeitsleistungen für den Staat, nicht gewöhnliche Geldsteuern. „Fronarbeit“ ist im Deutschen knapp und verständlich; die Alternativen werden in der Fußnote genannt.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamensform wiedergegeben.
- source_word: בֶּן אֲחִילוּד
  choice: der Sohn Ahiluds
  rationale: Die hebräische Abstammungsangabe wird in natürlichem deutschem Stil als Genitivkonstruktion wiedergegeben.
- source_word: הַמַּזְכִּיר
  choice: der Kanzler
  rationale: Der Titel bezeichnet einen hohen königlichen Beamten, der für Aufzeichnungen und staatliche Angelegenheiten zuständig war. „Kanzler“ ist als deutsche Amtsbezeichnung prägnant, ohne ihn lediglich als Geschichtsschreiber darzustellen.
