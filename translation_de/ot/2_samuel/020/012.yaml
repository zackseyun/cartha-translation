  terminology: Eigennamen und Sachbegriffe sind stimmig. „Kleidungsstück“ bewahrt die Allgemeinheit von בֶּגֶד. „Wälzte sich ... im Blut“ ist eine vertretbare, bildnahe Wiedergabe von מִתְגֹּלֵל; die Fußnote bietet die idiomatischere Alternative, ohne sie als einzige Deutung auszugeben.
