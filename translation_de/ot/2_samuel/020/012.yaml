translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Das vorangestellte וַ wird mit „aber“ als leichter Gegensatz beziehungsweise Szenenwechsel wiedergegeben. Die Wiederholung von „stehen blieb“ bildet die hebräische Wiederaufnahme von עמד ab; der Satz wird zur besseren deutschen Lesbarkeit nach „über ihn“ getrennt.
