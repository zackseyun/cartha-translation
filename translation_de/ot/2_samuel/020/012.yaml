  text: וַ/עֲמָשָׂ֛א מִתְגֹּלֵ֥ל בַּ/דָּ֖ם בְּ/ת֣וֹךְ הַֽ/מְסִּלָּ֑ה וַ/יַּ֨רְא הָ/אִ֜ישׁ כִּֽי עָמַ֣ד כָּל הָ/עָ֗ם וַ/יַּסֵּב֩ אֶת עֲמָשָׂ֨א מִן הַֽ/מְסִלָּ֤ה הַ/שָּׂדֶה֙ וַ/יַּשְׁלֵ֤ךְ עָלָי/ו֙ בֶּ֔גֶד כַּ/אֲשֶׁ֣ר רָאָ֔ה כָּל הַ/בָּ֥א עָלָ֖י/ו וְ/עָמָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/012.yaml
  text: Amasa was wallowing in blood in the middle of the highway. When the man saw that all the people were stopping[a], he moved Amasa from the highway into the field and threw a garment over him, because he saw that everyone who came upon him stopped.
translation:
  language: de
  text: Amasa wälzte sich mitten auf der Straße im Blut.[a] Als der Mann sah, dass das ganze Volk stehen blieb, schaffte er Amasa von der Straße auf das Feld und warf ein Kleidungsstück über ihn, denn er sah, dass jeder, der zu ihm kam, stehen blieb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wand sich im Blut“. Das hebräische Verb bedeutet wörtlich, dass Amasa sich hin und her wälzte oder rollte, und beschreibt hier wohl seine Bewegung als tödlich Verwundeter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְגֹּלֵל
  choice: wälzte sich
  rationale: Das Hitpolel-Partizip von גלל bezeichnet ein Sichwälzen oder Hin-und-her-Rollen. „Wälzte sich“ bewahrt das konkrete Bewegungsbild, ohne ausdrücklich eine bestimmte Ursache oder Art der Bewegung hinzuzufügen.
- source_word: בַּדָּם
  choice: im Blut
  rationale: Der hebräische Ausdruck enthält den Artikel. „Im Blut“ ist im Deutschen natürlich und fügt nicht das im Ausgangstext unausgesprochene Possessiv „seinem“ hinzu.
- source_word: בְּתוֹךְ הַמְסִלָּה
  choice: mitten auf der Straße
  rationale: מְסִלָּה bezeichnet hier die öffentliche Fahr- oder Wegstrecke. „Mitten auf der Straße“ ist modernes, idiomatisches Deutsch und macht deutlich, warum Amasa den Verkehr aufhielt.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Der bestimmte Artikel verweist auf den aus dem Zusammenhang bekannten Mann.
- source_word: כִּי עָמַד כָּל הָעָם
  choice: dass das ganze Volk stehen blieb
  rationale: עמד bezeichnet hier das Anhalten angesichts Amasas auf der Straße. „Stehen blieb“ gibt dies im deutschen Erzählstil klar wieder.
- source_word: וַיַּסֵּב
  choice: schaffte er … von der Straße
  rationale: Der Hifil von סבב bezeichnet hier das Beiseiteschaffen Amasas. „Schaffte … von der Straße“ drückt die Verlagerung aus, ohne eine nicht genannte Art wie Ziehen oder Tragen festzulegen.
- source_word: מִן הַמְסִלָּה הַשָּׂדֶה
  choice: von der Straße auf das Feld
  rationale: Die Konstruktion bezeichnet die Bewegung weg von der Straße zum angrenzenden Feld; „auf das Feld“ ist im Deutschen die natürliche Richtungsangabe.
- source_word: בֶּגֶד
  choice: ein Kleidungsstück
  rationale: בֶּגֶד ist eine allgemeine Bezeichnung für Kleidung. „Kleidungsstück“ bleibt bewusst unspezifisch; „Mantel“ wäre enger als der hebräische Ausdruck.
- source_word: כָּל הַבָּא עָלָיו
  choice: jeder, der an ihm vorbeikam
  rationale: Im Zusammenhang sind die Menschen gemeint, die auf ihrem Weg zu Amasas Stelle gelangten. „An ihm vorbeikam“ gibt die Verkehrssituation natürlich wieder, ohne eine persönliche Annäherung an Amasa anzudeuten.
- source_word: וְעָמָד
  choice: stehen blieb
  rationale: Die Wiederholung von עמד greift das zuvor beschriebene Anhalten der Leute auf und wird entsprechend gleichlautend wiedergegeben.
