  to: Amasa wälzte sich mitten auf der Straße im Blut.[a] Als der Mann sah, dass das ganze Volk stehen blieb, schaffte er Amasa von der Straße auf das Feld und warf ein Kleidungsstück über ihn, denn er sah, dass jeder, der zu ihm kam, stehen blieb.
