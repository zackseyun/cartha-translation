base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/010.yaml
  text: But Amasa was not on guard against the sword that was in Joab’s hand[a], and he struck him with it in the belly, and his entrails spilled out to the ground; he did not strike him again, and he died. Then Joab and Abishai his brother pursued Sheba son of Bichri.
translation:
  language: de
  text: Amasa aber war nicht auf der Hut vor dem Schwert in Joabs Hand. Da schlug Joab ihm damit in den Bauch[a], und seine Eingeweide ergossen sich auf die Erde. Er schlug nicht noch einmal zu, und Amasa starb. Dann verfolgten Joab und sein Bruder Abischai Scheba, den Sohn Bichris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an die fünfte Rippe“. Wahrscheinlicher bezeichnet der hebräische Ausdruck hier allgemein den Bauch oder Unterleib.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמַר
  choice: achtete nicht auf
  rationale: Das Nifal von שׁמר bezeichnet hier Amasas fehlende Wachsamkeit gegenüber der Waffe. „Achtete nicht auf“ ist natürliches modernes Deutsch und lässt offen, ob er die Gefahr nicht bemerkte oder nicht ernst nahm.
- source_word: חֶרֶב
  choice: Schwert
  rationale: Die übliche und kontextuell passende Wiedergabe von חֶרֶב.
- source_word: בְּיַד יוֹאָב
  choice: in Joabs Hand
  rationale: Die Wendung ist hier konkret-räumlich und bezeichnet die von Joab gehaltene Waffe.
- source_word: וַיַּכֵּהוּ בָּהּ
  choice: Da stieß Joab es ihm
  rationale: נכה ist grundsätzlich „schlagen/treffen“. Im Zusammenhang mit einem Schwert und einer Bauchwunde gibt „stieß … es ihm“ die konkrete Handlung natürlich wieder, ohne eine zusätzliche Hiebtechnik festzulegen.
- source_word: אֶל הַחֹמֶשׁ
  choice: in den Bauch
  rationale: חֹמֶשׁ bezeichnet in diesen Erzählzusammenhängen wahrscheinlich die Bauch- beziehungsweise Unterleibsgegend. Die traditionelle Wiedergabe „an die fünfte Rippe“ bleibt als lexikalische Alternative in der Fußnote erhalten.
- source_word: וַיִּשְׁפֹּךְ מֵעָיו אַרְצָה
  choice: sodass seine Eingeweide auf die Erde quollen
  rationale: Die Formulierung bewahrt die drastische Körperlichkeit des Hebräischen in würdigem, verständlichem Deutsch. „Auf die Erde“ entspricht אַרְצָה.
- source_word: וְלֹא שָׁנָה לוֹ
  choice: Er versetzte ihm keinen zweiten Stoß
  rationale: Wörtlich wurde die Handlung an ihm nicht wiederholt. Der Kontext ergänzt als ausgelassene Handlung den Schwerthieb beziehungsweise -stoß; „keinen zweiten Stoß“ macht dies idiomatisch deutlich.
- source_word: וַיָּמֹת
  choice: Amasa starb
  rationale: Der Name ersetzt das im Deutschen potenziell mehrdeutige Pronomen und bewahrt die schlichte narrative Folge.
- source_word: רָדַף אַחֲרֵי
  choice: verfolgten
  rationale: Standardsprachliche Wiedergabe für militärische Verfolgung.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Scheba, den Sohn Bichris
  rationale: Die Personennamen werden nach gängiger deutscher biblischer Form wiedergegeben; die Abstammungsangabe wird idiomatisch flektiert.
