  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗ד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מֵ/אַחַ֖ר הַ/צֹּ֑אן לִֽ/הְי֣וֹת נָגִ֔יד עַל עַמִּ֖/י עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/008.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people, over Israel.'
translation:
  language: de
  text: 'Und nun sollst du zu meinem Diener David sagen: So spricht Jahwe der Heerscharen: Ich habe dich von der Weide[a], von hinter der Herde, geholt, um als Herrscher[b] über mein Volk, über Israel, zu dienen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Weideplatz“ beziehungsweise „vom Ort der Herde“. Das hebräische Wort kann Weideland oder einen Aufenthaltsort für Herden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Anführer“ oder „Fürst“. Das hebräische Wort bezeichnet einen zum Regieren eingesetzten Leiter, ohne zwingend den besonderen Titel „König“ zu verwenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl den Anschluss an das Vorhergehende als auch den Übergang zum nächsten Teil der Botschaft; im Deutschen natürlicher als das steifere „Nun also“.
- source_word: כֹּה תֹאמַר
  choice: sollst du ... sagen
  rationale: Gibt die Botenformel und ihren verpflichtenden Charakter in natürlichem modernem Deutsch wieder.
- source_word: לְעַבְּדִּי לְדָוִד
  choice: zu meinem Diener David
  rationale: „Diener“ entspricht hier Davids ehrenvoller Stellung gegenüber Gott; die Apposition wird im Deutschen ohne wiederholte Präposition natürlich formuliert.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die herkömmliche und prägnante deutsche Wiedergabe der hebräischen Botenformel.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen direkt wieder und lässt bei „Heerscharen“ offen, ob irdische oder himmlische Heere im Vordergrund stehen.
- source_word: לְקַחְתִּיךָ
  choice: Ich habe dich ... geholt
  rationale: Im Zusammenhang mit Davids Berufung aus seinem bisherigen Lebensbereich ist „geholt“ idiomatisch und wahrt Gottes aktives Erwählen.
- source_word: מִן הַנָּוֶה
  choice: von der Weide
  rationale: נָוֶה bezeichnet hier den Aufenthalts- oder Weideort der Herde; „Weide“ ist im Kontext klar und geläufig.
- source_word: מֵאַחַר הַצֹּאן
  choice: hinter der Herde weg
  rationale: Bewahrt das konkrete Bild des Hirten, der hinter seiner Herde hergeht, ohne es lediglich als „die Herde hüten“ auszudeuten.
- source_word: לִהְיוֹת נָגִיד
  choice: damit du Herrscher ... bist
  rationale: Gibt Zweck beziehungsweise Ergebnis der Berufung wieder. „Herrscher“ bezeichnet die eingesetzte Leitungsgewalt, ohne נָגִיד mit dem spezifischeren Königstitel gleichzusetzen.
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
  choice: über mein Volk, über Israel
  rationale: Erhält die wiederholte Präposition und damit Nachdruck und Rhythmus des hebräischen Satzes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich; „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von עֶבֶד als Bezeichnung Davids
  choice: Diener
  alternative: Sklave
  rationale: Hier bezeichnet das Wort Davids untergeordnete, zugleich ehrenvolle Stellung im Dienst Gottes; der soziale Status eines versklavten Menschen steht nicht im Vordergrund.
- issue: Wiedergabe von נָגִיד
  choice: Herrscher
  alternative: Anführer oder Fürst
  rationale: Das Wort bezeichnet einen von Gott eingesetzten Leiter mit Regierungsgewalt, ist aber nicht einfach mit dem formalen Titel „König“ identisch.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Wendung „über mein Volk, über Israel“ bleibt wegen des hebräischen Nachdrucks erhalten. „Hinter der Herde weg“ wahrt das konkrete Hirtenbild, während „Jahwe der Heerscharen“ den traditionellen Titel ohne unnötige Festlegung seines Bezugs wiedergibt.
