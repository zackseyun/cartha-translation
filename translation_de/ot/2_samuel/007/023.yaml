source:
  edition: WLC
  text: וּ/מִ֤י כְ/עַמְּ/ךָ֙ כְּ/יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁ֣ר הָלְכֽוּ אֱ֠לֹהִים לִ/פְדּֽוֹת ל֨/וֹ לְ/עָ֜ם וְ/לָ/שׂ֧וּם ל֣/וֹ שֵׁ֗ם וְ/לַ/עֲשׂ֨וֹת לָ/כֶ֜ם הַ/גְּדוּלָּ֤ה וְ/נֹֽרָאוֹת֙ לְ/אַרְצֶ֔/ךָ מִ/פְּנֵ֣י עַמְּ/ךָ֗ אֲשֶׁ֨ר פָּדִ֤יתָ לְּ/ךָ֙ מִ/מִּצְרַ֔יִם גּוֹיִ֖ם וֵ/אלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/023.yaml
  text: And who is like your people[a], like Israel, the one nation on the earth whom God went to redeem for himself as a people, to make a name for himself, and to do for you great and fearsome things for your land before your people, whom you redeemed for yourself from Egypt[b], from nations and their gods?
translation:
  language: de
  text: Und wer ist wie dein Volk, wie Israel, die eine Nation auf Erden, zu der Gott[a] hinging, um sie sich als Volk zu erlösen, sich einen Namen zu machen und für euch Großes und Furchtgebietendes[b] zu tun – für dein Land, vor deinem Volk, das du dir aus Ägypten erlöst hast, vor Nationen und ihren Göttern[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen sowohl die Gottesbezeichnung als auch das Verb formal im Plural. Im Zusammenhang ist wahrscheinlich der Gott Israels gemeint.
    reason: grammatical_ambiguity
  - marker: b
    text: 'Oder: „Großes und Ehrfurchtgebietendes“. Das hebräische Wort bezeichnet Taten, die Ehrfurcht, Schrecken oder Furcht hervorrufen.'
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Schluss ist sprachlich schwer verständlich. Wörtlich folgt auf „aus Ägypten“ etwa „Nationen und sein Gott/seine Götter“. Die im Haupttext wiedergegebene Zuordnung zu „vor“ ist kontextuell naheliegend; möglich sind auch Gliederungen wie „aus Ägypten, Nationen und Götter“ oder „aus Ägypten, die Nationen und seinen Gott“.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ כְּיִשְׂרָאֵל
  choice: Und wer ist wie dein Volk, wie Israel
  rationale: Die rhetorische Frage und die hervorgehobene Identifizierung Israels mit Gottes Volk bleiben erhalten.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: die eine Nation auf Erden
  rationale: Die Formulierung bewahrt אֶחָד und bringt im Kontext Israels einzigartige Stellung zum Ausdruck, ohne das Zahlwort durch eine reine Deutung zu ersetzen.
- source_word: אֲשֶׁר הָלְכוּ אֱלֹהִים
  choice: für die Gott hinging
  rationale: Der Kontext legt Israels Gott als Handelnden nahe; „hinging“ erhält das konkrete Bewegungsbild. Die auffällige grammatische Mehrzahl wird in einer Fußnote offengelegt.
- source_word: לִפְדּוֹת לוֹ לְעָם
  choice: um sie für sich als Volk zu erlösen
  rationale: „Erlösen“ gibt פדה im heilsgeschichtlichen Zusammenhang angemessen wieder; „für sich als Volk“ bewahrt Ziel und Besitzbeziehung.
- source_word: וְלָשׂוּם לוֹ שֵׁם
  choice: sich einen Namen zu machen
  rationale: Dies ist die natürliche deutsche Wiedergabe des hebräischen Idioms für den Erwerb von Ruhm und Ansehen.
- source_word: וְלַעֲשׂוֹת לָכֶם
  choice: und für euch … zu tun
  rationale: Das ausdrücklich im masoretischen Text stehende לָכֶם in der zweiten Person Plural wird beibehalten, obwohl die Anrede danach zum Singular wechselt.
- source_word: הַגְּדוּלָּה וְנֹרָאוֹת
  choice: Großes und Furchtgebietendes
  rationale: Die substantivierte Wiedergabe entspricht der uneinheitlichen hebräischen Form und bewahrt bei נוראות sowohl Ehrfurcht als auch Schrecken.
- source_word: לְאַרְצְךָ מִפְּנֵי עַמְּךָ
  choice: für dein Land, vor deinem Volk
  rationale: Die Präpositionalphrasen und der Wechsel zurück zur singularischen Anrede werden eng am masoretischen Text wiedergegeben.
- source_word: אֲשֶׁר פָּדִיתָ לְּךָ מִמִּצְרַיִם
  choice: das du dir aus Ägypten erlöst hast
  rationale: Die Wiederholung von פדה wird konsequent mit „erlösen“ wiedergegeben; לְּךָ erscheint als „dir“.
- source_word: גּוֹיִם וֵאלֹהָיו
  choice: Nationen und ihre Götter
  rationale: Die distributive Pluralwiedergabe ergibt im Deutschen den wahrscheinlichsten Zusammenhang. Die schwierige wörtliche Form mit singularischem Suffix wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Numerus und Bezug von אֱלֹהִים bei pluralischem Verb הָלְכוּ
  choice: „Gott“ als Bezeichnung für Israels Gott
  alternative: „Götter“
  rationale: Der Gebetszusammenhang handelt von dem einen Gott Israels, der sein Volk erlöst. Da das Verb jedoch tatsächlich im Plural steht, wird die formale Spannung nicht verschwiegen, sondern in Fußnote [a] genannt.
- issue: Wechsel zwischen pluralischer und singularischer Anrede
  choice: „für euch“, danach „dein/deinem/du/dir“
  alternative: Vereinheitlichung aller Pronomen auf Singular oder Plural
  rationale: Die unvermittelten Numeruswechsel gehören zum masoretischen Text und werden nicht durch Konjektur oder Harmonisierung beseitigt.
- issue: Schwierige Schlusswendung גּוֹיִם וֵאלֹהָיו
  choice: „Nationen und ihre Götter“
  alternative: „Nationen und seinen Gott“ oder „die Nationen und ihre Götter“ als Fortsetzung von „aus Ägypten“
  rationale: Die Hauptfassung gibt den wahrscheinlich gemeinten Bezug auf die vor Israel beseitigten Nationen und deren Götter idiomatisch wieder. Die grammatische Schwierigkeit und alternative Gliederungen bleiben in Fußnote [c] sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange Gebetssyntax des hebräischen Satzes bleibt erkennbar, wird aber durch Kommas und einen Gedankenstrich lesbar gegliedert. Unvermittelte Pronomenwechsel und grammatische Spannungen des masoretischen Textes werden nicht stillschweigend harmonisiert.
