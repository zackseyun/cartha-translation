base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/010.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], so that they may dwell in their own place and be disturbed no more. And the sons of wickedness shall no longer afflict them, as formerly.
translation:
  language: de
  text: Und ich werde meinem Volk Israel einen Ort zuweisen und es einpflanzen, sodass es an seinem Platz wohnen kann und nicht mehr beunruhigt wird. Und die Söhne des Unrechts[a] werden es nicht länger bedrücken wie früher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint sind Übeltäter oder böse Männer. Wörtlich: „Söhne des Unrechts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: ich werde … einen Ort bestimmen
  rationale: שׂים bedeutet grundlegend „setzen, stellen“; mit מָקוֹם bezeichnet es hier die Zuweisung eines Ortes. „Einen Ort bestimmen“ ist natürlich und bewahrt Gottes Initiative, ohne den Ort vorschnell als „Heimatland“ auszudeuten.
- source_word: לְעַמִּי לְיִשְׂרָאֵל
  choice: meinem Volk Israel
  rationale: Die appositionelle Doppelbezeichnung verbindet die Zugehörigkeit zu Gott („mein Volk“) mit dem Namen Israel.
- source_word: וּנְטַעְתִּיו
  choice: es dort einpflanzen
  rationale: Das maskuline Singularsuffix bezieht sich auf das kollektiv-singularische Volk Israel. „Einpflanzen“ erhält das landwirtschaftliche Bild dauerhafter Ansiedlung; „dort“ macht im Deutschen den Bezug auf den zuvor genannten Ort klar.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: damit es an seiner eigenen Stätte wohnen kann
  rationale: Der Singular folgt dem Kollektivum „Volk Israel“. תַּחְתָּיו bezeichnet hier idiomatisch das Wohnen am eigenen, zugewiesenen Platz und nicht räumliche Unterordnung. „Damit“ gibt den naheliegenden Folgesinn wieder, ohne eine scharfe grammatische Zweckmarkierung zu behaupten.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: und nicht mehr beunruhigt wird
  rationale: רגז kann Erschütterung, Unruhe oder Aufschrecken bezeichnen. Der passive deutsche Ausdruck erfasst im Zusammenhang die äußere Destabilisierung durch Feinde.
- source_word: בְנֵי עַוְלָה
  choice: die Söhne des Unrechts
  rationale: Die konkrete hebräische Wendung wird im Haupttext bewahrt. עַוְלָה kann „Unrecht, Verkehrtheit, Bosheit“ bedeuten; „Unrecht“ lässt die ethisch-rechtliche Breite bestehen. Die idiomatische Bedeutung wird in einer Fußnote erläutert.
- source_word: לְעַנּוֹתוֹ
  choice: es bedrücken
  rationale: ענה im Piel bedeutet hier feindselig bedrängen oder unterdrücken. „Bedrücken“ ist breit genug und passt zum kollektiven Objekt Israel.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: wie früher
  rationale: Die Wendung verweist knapp auf die frühere Zeit der Bedrängnis; „wie früher“ ist idiomatisches modernes Deutsch.
theological_decisions:
- issue: Kollektiv-singularisches Israel bei singularischen Verben und Suffixen
  choice: Das Volk Israel wird mit dem deutschen Neutrum „es“ aufgenommen.
  alternative: Pluralische Aufnahme mit „sie/ihnen“ oder durchgehende nationale Personifikation mit „ihn/er“.
  rationale: Anders als im Englischen lässt sich der hebräische Kollektivsingular im Deutschen natürlich mit „das Volk … es“ wiedergeben. So bleiben Numerus und Bezug transparent, ohne eine lehrmäßige Aussage einzutragen.
- issue: Bildsprache des Einpflanzens
  choice: Die Pflanzmetapher bleibt erhalten.
  alternative: Abstrakt „es fest ansiedeln“ oder „es fest gründen“.
  rationale: Das Bild drückt sichere und dauerhafte Ansiedlung aus. Seine Beibehaltung wahrt die poetisch-theologische Spannung zwischen göttlichem Handeln und geschichtlicher Sesshaftigkeit.
- issue: Idiom בְנֵי עַוְלָה
  choice: Im Haupttext wörtlich-nah „Söhne des Unrechts“, mit idiomatischer Erklärung in der Fußnote.
  alternative: „Übeltäter“, „böse Menschen“ oder „gewalttätige Männer“.
  rationale: Die hebräische Genitivwendung bezeichnet Männer, die vom Unrecht geprägt sind. Die wörtlich-nahe Form bewahrt Ausdruck und grammatisches Geschlecht; die Fußnote verhindert Missverständnisse.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am hebräischen Verheißungsstil, wird aber durch „damit“ und „dort“ für heutige Leser transparent. Die Wiederholung von „und“ erhält den fortschreitenden Charakter der Zusage.
