source:
  edition: WLC
  text: וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֣ה צְבָא֔וֹת אֱלֹהִ֖ים עַל יִשְׂרָאֵ֑ל וּ/בֵית֙ עַבְדְּ/ךָ֣ דָוִ֔ד יִהְיֶ֥ה נָכ֖וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/026.yaml
  text: And may your name be magnified forever[a], saying[b], ‘Yahweh of hosts is God over Israel,’ and may the house of your servant David be established before you.
translation:
  language: de
  text: 'Und möge dein Name für immer groß werden[a], sodass man sagt: »Jahwe der Heerscharen ist Gott über Israel.« Und das Haus[b] deines Dieners David möge vor dir fest bestehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Und möge dein Name für immer groß sein.«'
    reason: lexical_alternative
  - marker: b
    text: Mit »Haus« ist hier Davids Familie beziehungsweise Königsdynastie gemeint, nicht nur ein Gebäude.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִגְדַּל
  choice: Und möge ... groß werden
  rationale: Die Verbform hat im Gebetszusammenhang Wunschcharakter. „Möge ... groß werden“ gibt diesen volitiven Sinn wieder, ohne eine im Hebräischen nicht ausdrücklich markierte Passivform einzuführen.
- source_word: שִׁמְךָ
  choice: dein Name
  rationale: Die direkte Wiedergabe bewahrt die hebräische Ausdrucksweise, in der der Name zugleich für Ansehen und offenbarte Identität stehen kann.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Natürliche moderne Wiedergabe der zeitlich unbegrenzten Dauer.
- source_word: לֵאמֹר
  choice: sodass man sagt
  rationale: Die unpersönliche Formulierung macht den Anschluss des folgenden Bekenntnisses im Deutschen verständlich und bewahrt den Ziel- beziehungsweise Folgesinn, den der Kontext nahelegt.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „der Heerscharen“ bewahrt die traditionelle Breite des Titels und beschränkt ihn nicht auf menschliche Armeen.
- source_word: אֱלֹהִים עַל יִשְׂרָאֵל
  choice: ist Gott über Israel
  rationale: „Über“ gibt die hier naheliegende Aussage von Gottes Herrschaft und Hoheit wieder.
- source_word: וּבֵית עַבְדְּךָ דָוִד
  choice: Und das Haus deines Dieners David
  rationale: „Haus“ wahrt die Wortwahl und das Wortspiel des Kapitels; hier bezeichnet es Davids Familie beziehungsweise Dynastie.
- source_word: יִהְיֶה נָכוֹן
  choice: möge ... fest bestehen
  rationale: Die Formulierung erfasst Festigkeit, Dauer und Bestand und führt zugleich den Gebets- und Wunschcharakter des Satzes fort.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Die direkte Wiedergabe bewahrt sowohl den räumlichen Ausdruck als auch seinen relationalen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von „Haus“ in der Davidverheißung
  choice: „Haus“ im Haupttext beibehalten und den dynastischen Sinn in einer Fußnote erläutern
  alternative: Dynastie; Königshaus; Nachkommenschaft
  rationale: Das hebräische בַּיִת bedeutet wörtlich „Haus“, bezeichnet hier aber Davids bleibende Familie und Königslinie. Die Beibehaltung wahrt das zentrale Wortspiel in 2. Samuel 7.
- issue: Modus von יִהְיֶה im zweiten Satzteil
  choice: 'als Wunsch: „möge ... fest bestehen“'
  alternative: 'als Zusage: „wird ... fest bestehen“'
  rationale: Der unmittelbare Gebetszusammenhang und die parallele Wunschform am Versanfang sprechen dafür, auch diesen Satzteil als Bitte zu formulieren; die hebräische Form lässt jedoch formal auch eine Zukunftsaussage zu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gebetsform wird mit „möge“ kenntlich gemacht; „Heerscharen“ bleibt als etablierter, inhaltlich weiter Gottesbeiname erhalten. Alle Fußnotenmarker stehen unmittelbar bei dem Ausdruck, den sie erläutern.
