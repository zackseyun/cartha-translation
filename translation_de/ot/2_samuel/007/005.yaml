  text: לֵ֤ךְ וְ/אָֽמַרְתָּ֙ אֶל עַבְדִּ֣/י אֶל דָּוִ֔ד כֹּ֖ה אָמַ֣ר יְהוָ֑ה הַ/אַתָּ֛ה תִּבְנֶה לִּ֥/י בַ֖יִת לְ/שִׁבְתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/005.yaml
  text: 'Go and say to my servant David[a], ‘Thus says Yahweh: Would you build a house for me to dwell in?’'
translation:
  language: de
  text: 'Geh und sag zu meinem Diener David: »So spricht Jahwe: Du willst mir ein Haus bauen, damit ich darin wohne?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Bist du es, der mir ein Haus bauen wird, damit ich darin wohne?« Die hebräische Frage hebt »du« nachdrücklich hervor und ist rhetorisch.'
    reason: Die alternative Form macht die emphatische Funktion des ausdrücklich gesetzten Pronomens הַאַתָּה deutlicher, ohne mit „soll“ einen nicht ausdrücklich gegebenen Verpflichtungssinn einzutragen.
lexical_decisions:
- source_word: לֵךְ
  choice: Geh
  rationale: Der Qal-Imperativ 2. Person Maskulin Singular von הלך erteilt Nathan einen direkten Auftrag; „Geh“ gibt ihn knapp und natürlich wieder.
- source_word: וְאָמַרְתָּ
  choice: und sag
  rationale: Das mit waw angeschlossene Perfekt setzt nach dem Imperativ dessen Aufforderungscharakter fort. „Und sag“ bewahrt die Abfolge der beiden Befehle.
- source_word: עַבְדִּי אֶל דָּוִד
  choice: zu meinem Diener David
  rationale: עבד bezeichnet hier im königlich-bundestheologischen Zusammenhang den ehrenvollen Dienst Davids gegenüber Gott. Die deutsche Apposition ohne wiederholtes „zu“ ist natürlich.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: „So spricht“ wahrt die feierliche prophetische Botenformel; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: הַאַתָּה
  choice: Du willst …?
  rationale: Die vorangestellte ausdrückliche Anrede „du“ wird im Deutschen durch die Anfangsstellung und Betonbarkeit von „Du“ hervorgehoben. Zusammen mit dem Fragezeichen ergibt sich eine natürliche rhetorische Frage.
- source_word: תִּבְנֶה לִּי בַיִת
  choice: mir ein Haus bauen
  rationale: „Haus“ entspricht בית und bewahrt das zentrale Wortspiel des Kapitels zwischen Gottes Haus und Davids Haus; „Tempel“ wäre hier unnötig festlegend.
- source_word: לְשִׁבְתִּי
  choice: damit ich darin wohne
  rationale: Der Infinitiv mit Suffix drückt den Zweck des Hauses aus. „Darin“ stellt den Bezug auf das Haus im Deutschen eindeutig und idiomatisch her.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בַיִת
  choice: Haus
  alternative: Tempel
  rationale: Gemeint ist zwar ein Heiligtum, doch „Haus“ bewahrt die bewusste literarische und theologische Mehrdeutigkeit im weiteren Abschnitt.
- issue: Deutung der Frage הַאַתָּה תִּבְנֶה
  choice: rhetorische, auf „du“ zugespitzte Frage
  alternative: neutrale Frage nach Davids Bauabsicht
  rationale: Das selbstständige Pronomen אַתָּה nach der Fragepartikel hebt David nachdrücklich hervor. Die Übersetzung wahrt diese Spannung, ohne bereits ausdrücklich zu sagen, wer stattdessen bauen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel bleibt bewusst feierlich; der übrige Satz ist klar und mündlich gut verständlich. Die direkte rhetorische Frage bewahrt die Spannung des hebräischen Textes.
