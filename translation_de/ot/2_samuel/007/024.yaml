  text: וַ/תְּכ֣וֹנֵֽן לְ֠/ךָ אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/024.yaml
  text: And you established your people Israel for yourself to be your people forever[a], and you, Yahweh[b], became their God.
translation:
  language: de
  text: So hast du dir Israel als dein Volk für immer gefestigt; und du, Jahwe[a], bist ihr Gott geworden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier der Gottesname JHWH, der traditionell auch mit „der HERR“ wiedergegeben wird.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „warst ihr Gott“. Das Hebräische kann auch einen bestehenden Zustand bezeichnen; „bist ihr Gott geworden“ hebt hier den bundesstiftenden Zusammenhang hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכוֹנֵן
  choice: hast … fest gegründet
  rationale: Die Form von כון bezeichnet hier das Festmachen bzw. dauerhafte Begründen von Israels Stellung als Gottes Volk. „Fest gegründet“ bewahrt diesen Nachdruck und passt zum Bundeskontext.
- source_word: לְךָ … לְךָ לְעָם
  choice: dir … als dein Volk
  rationale: Die wiederholte Präposition לְךָ hebt Zugehörigkeit und Bestimmung hervor. Die deutsche Formulierung gibt die Bundeszugehörigkeit natürlich wieder, ohne die Wiederholung schwerfällig nachzuahmen.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: dein Volk Israel
  rationale: Die Verbindung aus Besitzangabe und Volksname wird direkt und idiomatisch wiedergegeben.
- source_word: עַד עוֹלָם
  choice: auf ewig
  rationale: Die Wendung bezeichnet unbegrenzte Dauer; „auf ewig“ ist klar, würdig und im Bundeskontext angemessen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: bist ihr Gott geworden
  rationale: היה mit ל kann das Eintreten in ein Verhältnis ausdrücken. Im Zusammenhang mit der Begründung Israels als Gottes Volk hebt „geworden“ die wechselseitige Bundesbeziehung hervor, während die stative Deutung möglich bleibt.
theological_decisions:
- issue: Wechselseitige Bundesformel
  choice: „als dein Volk … bist ihr Gott geworden“
  alternative: „als dein Volk … warst ihr Gott“
  rationale: Der Text verbindet Israels bleibende Zugehörigkeit zu Jahwe mit Jahwes Verhältnis zu Israel. „Geworden“ bringt den bundesstiftenden Zusammenhang zur Geltung, ohne die ebenfalls mögliche stative Wiedergabe zu verschweigen.
- issue: Wiedergabe des Tetragramms
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bewahrt die persönliche Namensform des hebräischen Textes; die traditionelle Titelersetzung wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in direkter Gebetsanrede. „So“ nimmt den fortführenden Charakter des einleitenden וַ auf; das Semikolon macht die beiden wechselseitigen Aussagen der Bundesformel sichtbar.
