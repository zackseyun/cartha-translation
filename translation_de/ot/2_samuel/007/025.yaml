id: 2SA.7.25
reference: 2 Samuel 7:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ הָקֵ֖ם עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/025.yaml
  text: And now[a], Yahweh God, confirm forever the word that you have spoken concerning your servant and concerning his house[b], and do as you have spoken.
translation:
  language: de
  text: 'Und nun, Jahwe, Gott: Lass das Wort, das du über deinen Diener und über sein Haus[a] gesprochen hast, für immer Bestand haben, und handle so, wie du gesprochen hast.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit seinem „Haus“ ist hier besonders Davids Königshaus, also seine Dynastie, gemeint.
    reason: lexical_alternative
  - marker: b
    text: Das „Wort“ ist in diesem Zusammenhang Gottes Zusage oder Verheißung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt den Übergang zur gegenwärtigen Bitte knapp und natürlich wieder.
- source_word: יְהוָה אֱלֹהִים
  choice: Jahwe, Gott
  rationale: Bewahrt den offenbarten Gottesnamen und gibt אֱלֹהִים als Anrede wieder; die Zeichensetzung verdeutlicht den Vokativ.
- source_word: הַדָּבָר
  choice: das Wort
  rationale: Bewahrt die konkrete hebräische Formulierung; im Zusammenhang bezeichnet das Wort zugleich Gottes Zusage, ohne diese Deutung in den Haupttext einzutragen.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: das du … gesprochen hast
  rationale: Bewahrt die Wiederholung des Verbs דבר und die fortdauernde Bedeutung der zuvor ergangenen Rede.
- source_word: עַל עַבְדְּךָ
  choice: über deinen Diener
  rationale: עַל bezeichnet hier den Gegenstand der göttlichen Rede; „über“ ist im modernen Deutschen natürlich und präzise.
- source_word: וְעַל בֵּיתוֹ
  choice: und über sein Haus
  rationale: „Haus“ erhält das leitende Wortspiel und die Bundesmetaphorik des Kapitels; gemeint ist hier besonders Davids Königshaus beziehungsweise Dynastie.
- source_word: הָקֵם
  choice: Lass … Bestand haben
  rationale: Der Hifil-Imperativ von קום bittet darum, dass Gott sein Wort feststehen und wirksam bleiben lässt. Die idiomatische Wendung passt besser zum Objekt „Wort“ als ein mechanisches „richte auf“.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Gibt die zeitlich unbegrenzte Dauer der hebräischen Wendung in natürlichem Deutsch wieder.
- source_word: וַעֲשֵׂה
  choice: und handle
  rationale: Gibt עשה im Zusammenhang idiomatisch wieder, ohne das interpretierende „erfülle“ einzusetzen.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: so, wie du gesprochen hast
  rationale: Bewahrt den ausdrücklichen Rückbezug auf Gottes eigene Rede und die Wiederholung von דבר.
theological_decisions:
- issue: Ob הַדָּבָר als „Wort“ oder als „Zusage/Verheißung“ wiederzugeben ist
  choice: das Wort
  alternative: die Zusage; die Verheißung
  rationale: Der Zusammenhang ist eindeutig verheißungsbezogen, doch der hebräische Text sagt zunächst „das Wort“. Die Hauptfassung bewahrt diese Ausdrucksweise; eine Fußnote nennt die kontextuelle Bedeutung.
- issue: Ob בֵּיתוֹ ausdrücklich als „Dynastie“ übersetzt werden soll
  choice: sein Haus
  alternative: sein Königshaus; seine Dynastie
  rationale: Das dynastische Verständnis ist in 2 Samuel 7 zentral. Dennoch ist „Haus“ ein bewusst wiederkehrender Schlüsselbegriff des Kapitels und trägt die Spannung zwischen Gebäude, Familie und Königshaus; die Fußnote erläutert den hier maßgeblichen Sinn.
- issue: Ob הָקֵם eine bloße Bestätigung oder die wirksame Verwirklichung des göttlichen Wortes bezeichnet
  choice: Lass … Bestand haben
  alternative: bestätige; richte auf; erfülle
  rationale: Die gewählte Formulierung lässt sowohl Festigung als auch dauerhafte Wirksamkeit anklingen, ohne die Bitte auf eine rein verbale Bestätigung oder bereits vollständig ausgelegte Erfüllung zu verengen.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Der Gottesname wird als „Jahwe“ wiedergegeben. Schlüsselbegriffe und die Wiederholung von „sprechen“ bleiben erhalten; schwerfällige wörtliche Syntax wird zugunsten einer klaren deutschen Satzführung vermieden.
