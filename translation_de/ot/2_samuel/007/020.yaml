  text: And what more can David say to you? You know your servant[a], Lord GOD.
translation:
  language: de
  text: Und was könnte David noch zu dir sagen? Du kennst deinen Diener, Herr Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַה יוֹסִיף דָּוִד עוֹד לְדַבֵּר אֵלֶיךָ
  choice: Und was könnte David noch zu dir sagen?
  rationale: Die Verbindung von יסף, עוֹד und dem Infinitiv bedeutet idiomatisch, noch weiterzureden bzw. noch mehr zu sagen. Der Konjunktiv „könnte“ gibt die rhetorische Frage in natürlichem Deutsch wieder; „Und“ bewahrt den Anschluss an das vorausgehende Gebet.
- source_word: וְאַתָּה יָדַעְתָּ
  choice: Du kennst ja
  rationale: Das betonte Pronomen wird beibehalten. Das Qal-Perfekt bezeichnet hier ein gegenwärtiges, feststehendes Wissen; „ja“ macht den begründenden und emphatischen Ton im Deutschen natürlich hörbar, ohne den Sinn zu erweitern.
- source_word: עַבְדְּךָ
  choice: deinen Diener
  rationale: In diesem königlichen Gebet ist עבד Davids demütige Selbstbezeichnung gegenüber Gott. „Diener“ ist im Deutschen kontextgemäß und wahrt die Beziehung der Unterordnung.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  rationale: Der zusammengesetzte Gottesname verbindet den Hoheitstitel אֲדֹנָי mit dem Eigennamen יהוה. „Herr Jahwe“ unterscheidet beide Bestandteile und vermeidet die unnatürliche Doppelung „Herr HERR“.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottesnamens אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  alternative: GOTT, der Herr; Herr HERR
  rationale: „Herr Jahwe“ gibt sowohl den Titel אֲדֹנָי als auch den Gottesnamen יהוה erkennbar wieder. Es vermeidet, den Eigennamen durch einen zweiten Titel zu ersetzen, und legt keine konfessionelle Sonderdeutung fest.
- issue: Bedeutungsumfang von Gottes Kenntnis des Dieners
  choice: Du kennst ja deinen Diener
  alternative: Du kennst deinen Diener ganz und gar
  rationale: Der hebräische Text sagt schlicht „kennen“ und enthält kein ausdrückliches Wort für Vollständigkeit. Eine Verstärkung wie „ganz und gar“ würde die mögliche theologische Aussage unnötig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Gebetssprache bleibt klar und unmittelbar; die Selbstbezeichnung „Diener“ und die direkte Gottesanrede werden bewahrt.
