  text: וְ/חַסְדִּ֖/י לֹא יָס֣וּר מִמֶּ֑/נּוּ כַּ/אֲשֶׁ֤ר הֲסִרֹ֨תִי֙ מֵ/עִ֣ם שָׁא֔וּל אֲשֶׁ֥ר הֲסִרֹ֖תִי מִ/לְּ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/015.yaml
  text: But my steadfast love will not depart from him[a], as I removed it from Saul[b], whom I removed from before you.
translation:
  language: de
  text: Doch meine beständige Liebe[a] wird nicht von ihm weichen, wie ich sie Saul entzogen habe, den ich von vor dir entfernt habe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „meine treue Liebe“ oder „meine Bundestreue“. Das hebräische Wort bezeichnet verlässliche, dauerhafte Liebe und Loyalität innerhalb einer verbindlichen Beziehung.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den ich von vor dir entfernt habe“. Gemeint ist Sauls Entfernung in Beziehung zu David; die Wendung kann besonders auf den Verlust seiner königlichen Stellung zielen, ist aber nicht rein räumlich festgelegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: meine beständige Liebe
  rationale: חֶסֶד bezeichnet hier verlässliche, dauerhafte Liebe und Loyalität im Rahmen der Beziehung und Verheißung Gottes. „Beständige Liebe“ ist verständlich, ohne den Ausdruck auf bloßes Erbarmen oder eine bestimmte dogmatische Formel zu verengen.
- source_word: יָסוּר
  choice: wird nicht … weichen
  rationale: סור kann „weichen“, „sich entfernen“ oder „abgewendet werden“ bedeuten. Mit „Liebe“ als Subjekt ist „nicht von ihm weichen“ im Deutschen natürlich und bewahrt das Bild der hebräischen Formulierung.
- source_word: מִמֶּנּוּ
  choice: von ihm
  rationale: Die Präposition מן mit Suffix bezeichnet die Trennung von dem angekündigten königlichen Nachkommen; „von ihm“ gibt dies knapp und idiomatisch wieder.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Die Konjunktion leitet den Vergleich mit Gottes Handeln an Saul ein.
- source_word: הֲסִרֹתִי מֵעִם שָׁאוּל
  choice: wie ich sie Saul entzogen habe
  rationale: Das erste הֲסִרֹתִי bezieht sich sinngemäß auf Gottes beständige Liebe. „Entzogen“ drückt die verursachte Trennung aus und macht im Deutschen das im Hebräischen vorausgesetzte Objekt durch „sie“ deutlich.
- source_word: אֲשֶׁר הֲסִרֹתִי מִלְּפָנֶיךָ
  choice: den ich vor dir weggenommen habe
  rationale: Die Wiedergabe hält an dem hebräischen Bild „von vor dir“ fest und vermeidet eine eindeutige Festlegung darauf, ob ausschließlich Sauls Königtum, seine Stellung gegenüber David oder seine Person gemeint ist.
theological_decisions:
- issue: Bedeutung von חֶסֶד im Zusammenhang der davidischen Verheißung
  choice: „beständige Liebe“ als Ausdruck verlässlicher göttlicher Zuwendung und Loyalität
  alternative: „Gnade“, „Barmherzigkeit“ oder „Bundestreue“
  rationale: Der Zusammenhang stellt Gottes bleibende Zuwendung zu Davids Nachkommen seinem Handeln an Saul gegenüber. „Beständige Liebe“ bewahrt die relationale und dauerhafte Bedeutung, ohne eine engere dogmatische Deutung in den Text einzutragen.
- issue: Bedeutung von מִלְּפָנֶיךָ („von vor dir“)
  choice: Das räumlich-relationale Bild mit „vor dir weggenommen“ bewahren
  alternative: „aus deiner Gegenwart entfernt“ oder deutend „als König vor dir abgesetzt“
  rationale: Die hebräische Wendung bezeichnet Sauls Entfernung in Beziehung zu David, legt die genaue Art dieser Entfernung hier aber nicht ausdrücklich fest. Die Übersetzung lässt diese Offenheit bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Vergleich, bleibt jedoch flüssig. „Weggenommen“ wahrt die offene Bildsprache, während die Fußnote die ungewöhnliche Formulierung erläutert.
