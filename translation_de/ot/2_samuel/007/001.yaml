  text: וַ/יְהִ֕י כִּי יָשַׁ֥ב הַ/מֶּ֖לֶךְ בְּ/בֵית֑/וֹ וַ/יהוָ֛ה הֵנִֽיחַ ל֥/וֹ מִ/סָּבִ֖יב מִ/כָּל אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/001.yaml
  text: When the king was living in his house[a], and Yahweh had given him rest on every side from all his enemies,
translation:
  language: de
  text: Als der König in seinem Haus[a] wohnte und Jahwe ihm ringsum Ruhe vor allen seinen Feinden verschafft hatte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Palast“. Wörtlich steht im Hebräischen „Haus“; diese Wiedergabe bewahrt zugleich das Wortspiel mit „Haus“ im weiteren Verlauf des Kapitels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Als
  rationale: Die hebräische Erzählformel leitet eine neue Szene und einen temporalen Nebensatz ein. „Als“ gibt dies in modernem Deutsch knapp und natürlich wieder, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes „Nun“ einzufügen.
- source_word: יָשַׁב
  choice: wohnte
  rationale: Das Verb bezeichnet hier den Zustand festen Wohnens, nicht den körperlichen Vorgang des Sitzens.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Titel wird beibehalten; der hebräische Text nennt David an dieser Stelle nicht beim Namen.
- source_word: בְּבֵיתוֹ
  choice: in seinem Haus
  rationale: „Haus“ entspricht der Grundbedeutung von בַּיִת und bewahrt zugleich das Wortspiel mit den verschiedenen Bedeutungen von „Haus“ im weiteren Kapitel.
- source_word: הֵנִיחַ לוֹ
  choice: ihm … Ruhe … verschafft hatte
  rationale: Der Hifil von נוח drückt aus, dass Jahwe dem König Ruhe beziehungsweise Sicherheit gewährte. Das Plusquamperfekt macht das zeitliche Verhältnis im deutschen Satz deutlich.
- source_word: מִסָּבִיב
  choice: ringsum
  rationale: Das Adverb gibt die umfassende Sicherheit von allen Seiten idiomatisch wieder.
- source_word: מִכָּל אֹיְבָיו
  choice: vor allen seinen Feinden
  rationale: Im Deutschen ist „Ruhe vor Feinden“ die natürliche Verbindung und gibt die Feinde als Ursache der zuvor bestehenden Bedrohung wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, um den im hebräischen Text ausdrücklich stehenden Gottesnamen sichtbar zu erhalten.
- issue: Bedeutungsumfang von בַּיִת bei der königlichen Residenz
  choice: Haus
  alternative: Palast
  rationale: Obwohl im Kontext eine königliche Residenz gemeint ist, bewahrt „Haus“ die hebräische Ausdrucksweise und die literarisch wie theologisch bedeutsame Mehrdeutigkeit im Kapitel, ohne sie auf „Palast“ zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt wie im hebräischen Text und im unmittelbaren Kontext als temporaler Nebensatz offen und endet daher mit einem Komma.
