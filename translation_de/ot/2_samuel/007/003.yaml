base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/003.yaml
  text: And Nathan said to the king[a], “Go, do all that is in your heart, for Yahweh is with you.”
translation:
  language: de
  text: 'Da sagte Nathan zum König: „Geh und tu alles, was du dir vorgenommen hast[a], denn Jahwe ist mit dir.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alles, was in deinem Herzen ist“. Das hebräische „Herz“ kann hier das innere Vorhaben, Wollen oder Denken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte“ gibt die zeitlich-fortschreitende Verknüpfung im modernen deutschen Erzählstil natürlich wieder.
- source_word: נָתָן
  choice: Nathan
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: אֶל הַמֶּלֶךְ
  choice: zum König
  rationale: Der hebräische Text verwendet das bestimmte Gattungswort „der König“ und nennt David in diesem Vers nicht ausdrücklich.
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: alles, was du im Herzen hast
  rationale: לֵבָב bezeichnet hier das innere Vorhaben, Wollen oder Denken. Die Formulierung bewahrt das hebräische Bild und bleibt auf Deutsch verständlich.
- source_word: לֵךְ עֲשֵׂה
  choice: Geh und tu
  rationale: Die beiden Imperative drücken ermutigende Zustimmung aus. Die Verbindung mit „und“ klingt im Deutschen natürlicher als eine unverbundene Folge und fügt dem Sinn nichts hinzu.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für Nathans Zuspruch ein; „denn“ gibt diese erklärende Funktion prägnant wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird in seiner im Deutschen geläufigen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עִמָּךְ
  choice: ist mit dir
  rationale: Die Wendung wahrt sowohl die unmittelbare Bedeutung von Gegenwart und Beistand als auch ihre theologische Aussagekraft, ohne sie erläuternd auszuweiten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen Gottes. „Jahwe“ bewahrt diesen Namen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Tragweite von „Jahwe ist mit dir“
  choice: Die Aussage bleibt ohne ausdrückliche Deutung als Gegenwart, Beistand oder Billigung stehen.
  alternative: Jahwe unterstützt dein Vorhaben.
  rationale: עִמָּךְ sagt wörtlich „mit dir“. Da Nathans erste Einschätzung im Fortgang der Erzählung korrigiert wird, darf die Übersetzung daraus keine uneingeschränkte göttliche Billigung des Bauvorhabens machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist knapp und ermutigend; die hebräische Herz-Metapher bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
