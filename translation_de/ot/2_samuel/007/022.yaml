id: 2SA.7.22
reference: 2 Samuel 7:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל כֵּ֥ן גָּדַ֖לְתָּ אֲדֹנָ֣/י יְהוִ֑ה כִּֽי אֵ֣ין כָּמ֗וֹ/ךָ וְ/אֵ֤ין אֱלֹהִים֙ זֽוּלָתֶ֔/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/022.yaml
  text: Therefore you are great[a], Lord GOD, for there is none like you, and there is no God besides you[b], according to all that we have heard with our ears.
translation:
  language: de
  text: Darum bist du groß, Herr Jahwe[a]; denn niemand ist wie du, und es gibt keinen Gott außer dir[b] – nach allem, was wir mit unseren Ohren gehört haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Herr JHWH“. „Jahwe“ gibt den Gottesnamen JHWH in einer verbreiteten deutschen Form wieder.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „keinen Gott neben dir“ beziehungsweise „keinen Gott abgesehen von dir“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Leitet die Folgerung aus den zuvor genannten Taten und Zusagen Gottes knapp und natürlich ein.
- source_word: גָּדַלְתָּ
  choice: bist du groß
  rationale: Das Qal-Perfekt kann hier den feststehenden beziehungsweise erkannten Zustand der Größe ausdrücken. Die Formulierung bewahrt den doxologischen Charakter, ohne ein Sich-Erweisen ausdrücklich in den Text einzutragen.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  rationale: Gibt sowohl den Titel אֲדֹנָי als auch den Gottesnamen יהוה wieder und vermeidet die missverständliche Doppelung „Herr HERR“.
- source_word: כִּי
  choice: denn
  rationale: Kennzeichnet den folgenden Satz als Begründung für das Bekenntnis zu Gottes Größe.
- source_word: אֵין כָּמוֹךָ
  choice: niemand ist wie du
  rationale: Natürliches modernes Deutsch für die hebräische Aussage der Unvergleichlichkeit.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: und es gibt keinen Gott außer dir
  rationale: 'זוּלָתֶךָ bezeichnet den Ausschluss jedes anderen Gottes: „außer dir“, „neben dir“ oder „abgesehen von dir“.'
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: nach allem, was wir mit unseren Ohren gehört haben
  rationale: Bewahrt sowohl den Bezug auf das empfangene Zeugnis als auch die betonte hebräische Wendung „mit unseren Ohren“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in der Verbindung אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  alternative: Gott, der HERR; Herr, HERR
  rationale: Die Übersetzung macht den im Hebräischen stehenden persönlichen Gottesnamen sichtbar und gibt zugleich אֲדֹנָי als „Herr“ wieder. Die Fußnote weist auf die hebräische Form hin, ohne eine bestimmte Aussprache als völlig sicher darzustellen.
- issue: Ausschließlichkeit der Gottesverehrung in אֵין אֱלֹהִים זוּלָתֶךָ
  choice: es gibt keinen Gott außer dir
  alternative: es gibt keinen anderen Gott als dich; es gibt keinen Gott neben dir
  rationale: Die direkte Ausschließlichkeitsaussage des Textes bleibt stehen, ohne sie durch spätere philosophische oder konfessionelle Formulierungen auszuweiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich vor dem Schlusssatz bildet dessen zusammenfassenden Bezug auf beide vorangehenden Aussagen ab. Die körperlich-konkrete Wendung „mit unseren Ohren“ bleibt erhalten.
