source:
  edition: WLC
  text: כִּ֣י יִמְלְא֣וּ יָמֶ֗י/ךָ וְ/שָֽׁכַבְתָּ֙ אֶת אֲבֹתֶ֔י/ךָ וַ/הֲקִימֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יֵצֵ֖א מִ/מֵּעֶ֑י/ךָ וַ/הֲכִינֹתִ֖י אֶת מַמְלַכְתּֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/012.yaml
  text: When your days are fulfilled and you lie down with your fathers[a], I will raise up your offspring after you, who will come from your own body[b], and I will establish his kingdom.
translation:
  language: de
  text: Wenn deine Tage erfüllt sind und du dich zu deinen Vorfahren legst[a], werde ich nach dir deinen Nachkommen hervortreten lassen, der aus deinem eigenen Leib hervorgehen wird[b], und ich werde seinem Königtum Bestand geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „sich zu seinen Vorfahren legen“ ist eine hebräische Umschreibung für das Sterben.
    reason: cultural_note
  - marker: b
    text: Wörtlich „aus deinem Inneren“; gemeint ist ein leiblicher Nachkomme. Das hebräische Wort für „Nachkomme“ bedeutet wörtlich „Same“ und kann sowohl die Nachkommenschaft insgesamt als auch einen einzelnen, repräsentativen Nachkommen bezeichnen.
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: כִּי יִמְלְאוּ יָמֶיךָ
  choice: Wenn deine Tage erfüllt sind
  rationale: כִּי leitet hier den künftigen Zeitpunkt ein; die Wendung bewahrt zugleich das hebräische Bild von den erfüllten Tagen und den feierlichen Ton.
- source_word: וְשָׁכַבְתָּ אֶת־אֲבֹתֶיךָ
  choice: und du dich zu deinen Vorfahren legst
  rationale: Die geläufige hebräische Umschreibung für Tod und Gemeinschaft mit den verstorbenen Ahnen wird bildhaft, aber in verständlichem modernem Deutsch wiedergegeben.
- source_word: וַהֲקִימֹתִי
  choice: werde ich … auftreten lassen
  rationale: Der Hifil von קום bezeichnet hier, dass Gott einen Nachfolger hervortreten lässt. „Auftreten lassen“ bewahrt das Motiv des Aufkommens, ohne den Ausdruck vorschnell als bloßes Einsetzen zu deuten.
- source_word: זַרְעֲךָ
  choice: deinen Nachkommen
  rationale: זֶרַע kann Nachkommenschaft kollektiv oder einen repräsentativen einzelnen Nachkommen bezeichnen. Der folgende maskuline Singular legt im Satz einen einzelnen Träger der Verheißung nahe, während die Fußnote die lexikalische Weite offenhält.
- source_word: אַחֲרֶיךָ
  choice: nach dir
  rationale: Die knappe Formulierung erhält sowohl den zeitlichen als auch den dynastischen Bezug.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: der aus deinem eigenen Leib hervorgehen wird
  rationale: Die wörtliche Rede von den „inneren Teilen“ bezeichnet die leibliche Abstammung; „aus deinem eigenen Leib“ gibt die Aussage natürlich und deutlich wieder.
- source_word: וַהֲכִינֹתִי
  choice: und ich werde … fest gründen
  rationale: Der Hifil von כון bedeutet fest machen, sichern oder gründen. „Fest gründen“ bildet diesen Aspekt deutlicher ab als das alleinige „gründen“.
- source_word: מַמְלַכְתּוֹ
  choice: sein Königtum
  rationale: מַמְלָכָה kann sowohl das Königreich als Herrschaftsbereich als auch die Königsherrschaft bezeichnen. „Königtum“ bewahrt diese dynastisch-herrschaftliche Weite besser als ein rein territoriales „Königreich“.
theological_decisions:
- issue: Reichweite von זַרְעֲךָ in der davidischen Verheißung
  choice: deinen Nachkommen
  alternative: deine Nachkommenschaft / deinen Samen
  rationale: Der Kontext spricht durch die maskulinen Singularformen von einem repräsentativen Nachkommen, doch זֶרַע kann zugleich kollektiv gebraucht werden. Die Übersetzung folgt der Satzgestalt, während die Fußnote die weitere dynastische Bedeutung offenhält und weder die unmittelbare noch eine weiterführende kanonische Erfüllung in den Vers hineininterpretiert.
- issue: Bedeutung von מַמְלַכְתּוֹ
  choice: sein Königtum
  alternative: sein Königreich
  rationale: „Königtum“ lässt Herrschaft, Amt und dynastische Ordnung anklingen, ohne die Aussage auf ein Gebiet zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll bewahrter hebräischer Bildsprache. „Vorfahren“ ist heute natürlicher und inklusiver als das wörtliche „Väter“. „Auftreten lassen“ vermeidet sowohl das missverständliche moderne „aufwecken“ als auch eine zu stark deutende Umschreibung. Die Satzstruktur bleibt feierlich, aber gut verständlich.
