revisions:
- from: Wenn deine Tage erfüllt sind und du dich zu deinen Vorfahren legst[a], werde ich nach dir deinen Nachkommen[b] auftreten lassen, der aus deinem eigenen Leib hervorgehen wird[c], und ich werde sein Königtum fest gründen.
  to: Wenn deine Tage erfüllt sind und du dich zu deinen Vorfahren legst[a], werde ich nach dir deinen Nachkommen hervortreten lassen, der aus deinem eigenen Leib hervorgehen wird[b], und ich werde seinem Königtum Bestand geben.
  rationale: 'Die Revision ersetzt die ungenaue Formulierung „auftreten lassen“ durch „hervortreten lassen“ und gibt die dauerhafte Sicherung des Königtums mit „Bestand geben“ wieder. Die Fußnoten werden auf zwei Anker gestrafft: Die Todesformel wird zurückhaltend erklärt, und die Anmerkung zur leiblichen Abstammung enthält zugleich die erforderliche lexikalische Mehrdeutigkeit von זֶרַע. Damit bleiben Singularbezug und mögliche kollektive Dimension offen.'
