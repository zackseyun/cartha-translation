    rationale: Der Hifil von קום bezeichnet hier Gottes Herbeiführen bzw. Erwecken eines Nachfolgers. „Auftreten lassen“ legt eher einen öffentlichen Auftritt nahe und ist dafür semantisch zu eng bzw. unpassend.
  - severity: medium
    issue: „fest gründen“ für וַהֲכִינֹתִי
    rationale: כון im Hifil bedeutet festigen, sichern oder Bestand geben. „Gründen“ kann eine erstmalige Einrichtung nahelegen; der Text verheißt die dauerhafte Sicherung der Königsherrschaft.
  - severity: low
    issue: Erklärung der Todesformel in Fußnote a
    rationale: Die Aussage „Gemeinschaft mit den verstorbenen Ahnen“ ist als Deutung weitergehend als die hebräische idiomatische Todesformel. Die Fußnote sollte sich auf deren Funktion als Umschreibung für das Sterben beschränken.
