  text: וְ/עַתָּ֗ה הוֹאֵל֙ וּ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֞ה אֲדֹנָ֤/י יְהוִה֙ דִּבַּ֔רְתָּ וּ/מִ/בִּרְכָ֣תְ/ךָ֔ יְבֹרַ֥ךְ בֵּֽית עַבְדְּ/ךָ֖ לְ/עוֹלָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/029.yaml
  text: And now[a], please be willing and bless the house of your servant, that it may continue before you forever. For you, Lord Yahweh, have spoken[c][b], and by your blessing the house of your servant will be blessed forever.
translation:
  language: de
  text: Und nun, sei bitte bereit, das Haus deines Dieners zu segnen, damit es für immer vor dir besteht. Denn du, Herr Yahweh[a], hast gesprochen, und durch deinen Segen wird das Haus deines Dieners für immer gesegnet sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: Adonai JHWH, eine Verbindung aus dem Titel „Herr“ und dem Gottesnamen Yahweh.'
    reason: alternative_reading
  - marker: b
    text: „Haus“ kann hier zugleich die Hausgemeinschaft und die Dynastie, also Davids bleibende Königslinie, bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל וּבָרֵךְ
  choice: sei bitte bereit, … zu segnen
  rationale: הוֹאֵל bittet um Gottes gnädige Bereitschaft beziehungsweise Zustimmung; zusammen mit dem folgenden Imperativ ergibt sich im Deutschen eine natürliche, ehrerbietige Bitte.
- source_word: בֵּית עַבְדְּךָ
  choice: das Haus deines Dieners
  rationale: „Haus“ bewahrt die Mehrdeutigkeit von Haus, Hausgemeinschaft und Dynastie sowie das Wortspiel des Kapitels.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: damit es für immer vor dir besteht
  rationale: „Besteht“ gibt das fortdauernde Sein vor Gott idiomatisch wieder, ohne ausdrücklich eine im Verb nicht enthaltene göttliche Gründung oder Bestätigung einzutragen.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  rationale: Die Verbindung aus Titel und Gottesnamen wird transparent als „Herr Yahweh“ wiedergegeben.
- source_word: דִּבַּרְתָּ
  choice: hast es zugesagt
  rationale: Im unmittelbaren Zusammenhang bezeichnet das Sprechen Gottes seine zuvor gegebene Verheißung; „zugesagt“ vermittelt diese gegenwärtig tragende Zusage natürlich.
- source_word: וּמִבִּרְכָתְךָ
  choice: und durch deinen Segen
  rationale: Die Präposition מִן bezeichnet hier am besten Quelle beziehungsweise Mittel des Gesegnetseins.
- source_word: יְבֹרַךְ ... לְעוֹלָם
  choice: wird … für immer gesegnet sein
  rationale: Das passive Imperfekt wird als zukünftiger, bleibender Zustand wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  alternative: Herr HERR; Herr, GOTT
  rationale: „Herr Yahweh“ erhält sowohl den Titel als auch den persönlichen Bundesnamen und vermeidet die missverständliche Doppelung „Herr HERR“.
- issue: Dynastische Bedeutung von בַּיִת
  choice: Haus
  alternative: Dynastie; Hausgemeinschaft
  rationale: Der Zusammenhang betrifft Davids Nachkommenschaft, doch die offene Bildsprache „Haus“ trägt mehrere Sinne und das zentrale Wortspiel des Kapitels; sie wird daher nicht auf „Dynastie“ verengt.
- issue: Aussagekraft von דִּבַּרְתָּ
  choice: hast es zugesagt
  alternative: hast gesprochen
  rationale: Die Übersetzung macht den Bezug auf Gottes Verheißung verständlich, ohne deren Inhalt über den Kontext hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die Anrede bleibt ehrerbietig, aber verständlich; „Haus“ bewahrt bewusst die literarische und theologische Mehrdeutigkeit.
