  text: כִּֽי אַתָּה֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל גָּלִ֜יתָה אֶת אֹ֤זֶן עַבְדְּ/ךָ֙ לֵ/אמֹ֔ר בַּ֖יִת אֶבְנֶה לָּ֑/ךְ עַל כֵּ֗ן מָצָ֤א עַבְדְּ/ךָ֙ אֶת לִבּ֔/וֹ לְ/הִתְפַּלֵּ֣ל אֵלֶ֔י/ךָ אֶת הַ/תְּפִלָּ֖ה הַ/זֹּֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/027.yaml
  text: For you[a], O Yahweh of hosts, God of Israel, have revealed this to your servant, saying[c][b], ‘I will build you a house.’ Therefore your servant has found it in his heart to pray this prayer to you.
translation:
  language: de
  text: 'Denn du, HERR der Heerscharen, Gott Israels, hast deinem Diener offenbart[a]: »Ich werde dir ein Haus[b] bauen.« Darum hat dein Diener den Mut gefunden[c], dieses Gebet an dich zu richten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »hast das Ohr deines Dieners entblößt«; eine hebräische Wendung für »hast deinem Diener etwas offenbart«.'
    reason: lexical_alternative
  - marker: b
    text: „Haus“ kann hier zugleich ein Haus im gewöhnlichen Sinn und ein Herrscherhaus, also eine Dynastie, bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »hat sein Herz gefunden«; gemeint ist, dass er den Mut oder die Entschlossenheit zum Gebet gefunden hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: HERR der Heerscharen
  rationale: Der Gottesname wird nach etablierter deutscher Bibelkonvention als HERR wiedergegeben; „der Heerscharen“ bewahrt den traditionellen, umfassenden Sinn des göttlichen Titels.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Gott Israels
  rationale: Direkte Wiedergabe der Status-constructus-Verbindung und der bundesgeschichtlichen Zuordnung.
- source_word: גָּלִיתָה אֶת אֹזֶן עַבְדְּךָ
  choice: hast deinem Diener offenbart
  rationale: Das wörtliche Bild „das Ohr deines Dieners entblößen“ ist eine hebräische Wendung für das Offenbaren oder Mitteilen; die deutsche Fassung gibt ihren Sinn natürlich wieder.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Im königlichen Gebet bezeichnet David damit demütig seine Stellung vor Gott; „Diener“ ist hier angemessener als „Sklave“.
- source_word: בַּיִת אֶבְנֶה לָּךְ
  choice: Ich werde dir ein Haus bauen
  rationale: „Haus“ bleibt bewusst mehrdeutig und kann im Kontext sowohl ein Gebäude als auch ein Herrscherhaus beziehungsweise eine Dynastie bezeichnen.
- source_word: מָצָא ... אֶת לִבּוֹ
  choice: hat den Mut gefunden
  rationale: Die hebräische Wendung lautet wörtlich „hat sein Herz gefunden“ und bezeichnet hier den gefundenen Mut oder die innere Entschlossenheit zum Gebet.
- source_word: לְהִתְפַּלֵּל אֵלֶיךָ אֶת הַתְּפִלָּה הַזֹּאת
  choice: dieses Gebet an dich zu richten
  rationale: Natürliches modernes Deutsch, das sowohl die Gebetshandlung als auch ihre Ausrichtung auf Gott ausdrückt.
theological_decisions:
- issue: Offenbarungsformel
  choice: hast deinem Diener offenbart
  alternative: hast das Ohr deines Dieners entblößt
  rationale: Die Hauptfassung vermittelt den idiomatischen Sinn klar; die Fußnote bewahrt das konkrete hebräische Bild.
- issue: Bedeutung von „Haus“
  choice: Haus
  alternative: Dynastie / Königshaus
  rationale: Die Übersetzung legt die im Kontext bedeutsame Mehrdeutigkeit nicht einseitig fest.
- issue: Wendung „sein Herz finden“
  choice: den Mut gefunden
  alternative: es über sich gebracht / sein Herz gefunden
  rationale: „Den Mut gefunden“ gibt die wahrscheinliche pragmatische Bedeutung verständlich wieder, während die Fußnote die formale Gestalt und mögliche Nuance der Entschlossenheit dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „du“ und die Bezeichnung „dein Diener“ entsprechen dem persönlichen Gebetsregister. „Heerscharen“ bleibt als geläufiger biblischer Titel erhalten; schwer verständliche hebräische Idiome werden im Haupttext sinngemäß und in Fußnoten wörtlich wiedergegeben.
