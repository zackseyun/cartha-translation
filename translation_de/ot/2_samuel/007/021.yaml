source:
  edition: WLC
  text: בַּ/עֲב֤וּר דְּבָֽרְ/ךָ֙ וּֽ/כְ/לִבְּ/ךָ֔ עָשִׂ֕יתָ אֵ֥ת כָּל הַ/גְּדוּלָּ֖ה הַ/זֹּ֑את לְ/הוֹדִ֖יעַ אֶת עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/021.yaml
  text: Because of your word and according to your heart[a], you have done all this greatness[c][b], to make your servant know it.
translation:
  language: de
  text: Um deines Wortes willen[a] und nach deinem Herzen[b] hast du all diese Größe[c] vollbracht, um sie deinem Knecht bekannt zu machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „wegen deines Wortes“; im Zusammenhang kann „Wort“ Gottes Zusage bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: nach deinem eigenen Willen oder Entschluss.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht im Hebräischen der Singular „all diese Größe“; sinngemäß ist auch „all diese großen Dinge“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: um … willen
  rationale: Die Wendung bezeichnet Grund oder Beweggrund. „Um … willen“ bewahrt diese Bedeutung und passt in würdiger, heutiger Gebetssprache gut zum folgenden „deines Wortes“.
- source_word: דְּבָרְךָ
  choice: deines Wortes
  rationale: דבר kann „Wort“, „Sache“ oder im Kontext auch „Zusage“ bedeuten. „Deines Wortes“ erhält die Bedeutungsbreite des Hebräischen, ohne die Aussage vorschnell auf „Verheißung“ festzulegen.
- source_word: וּכְלִבְּךָ
  choice: und nach deinem Herzen
  rationale: לב bezeichnet hier Gottes inneren Willen oder Entschluss. Die Übersetzung bewahrt das hebräische Bild und bleibt im Deutschen verständlich.
- source_word: עָשִׂיתָ
  choice: hast du … vollbracht
  rationale: Das Perfekt beschreibt eine vollendete Handlung mit gegenwärtiger Bedeutung. „Vollbracht“ verbindet sich im Deutschen natürlich mit „Größe“ und gibt עשה kontextgerecht wieder.
- source_word: אֵת כָּל הַגְּדוּלָּה הַזֹּאת
  choice: all diese Größe
  rationale: Der hebräische Text verwendet das abstrakte Substantiv im Singular. Die bewusst ungewöhnliche Formulierung fasst Gottes Handeln als eine zusammengehörige Offenbarung seiner Größe auf und vermeidet eine unbegründete Pluralisierung.
- source_word: לְהוֹדִיעַ
  choice: um … bekannt zu machen
  rationale: 'Der Hifil von ידע ist kausativ: jemanden etwas wissen beziehungsweise erkennen lassen. „Bekannt zu machen“ gibt diese Bedeutung in natürlichem Deutsch wieder.'
- source_word: עַבְדֶּךָ
  choice: deinem Knecht
  rationale: In diesem königlichen Gebet bezeichnet עבד Davids demütige Selbstbezeichnung vor Gott. „Knecht“ ist hier würdig und kontextgerecht; „Sklave“ würde einen im Zusammenhang nicht hervorgehobenen Aspekt in den Vordergrund rücken.
theological_decisions:
- issue: Bezug von „deines Wortes“ im Bundeskontext
  choice: Die breite Wiedergabe „deines Wortes“ bleibt im Haupttext erhalten.
  alternative: „deiner Zusage“ oder „dessen, was du gesagt hast“
  rationale: Der Zusammenhang legt Gottes Zusage an David nahe, doch das Hebräische sagt wörtlich „deines Wortes“. Die breitere Formulierung bewahrt den möglichen Bundesbezug, ohne ihn stärker auszudeuten als der Wortlaut.
- issue: Anthropomorphe Redeweise in „nach deinem Herzen“
  choice: Das Bild des Herzens wird beibehalten.
  alternative: „nach deinem Willen“ oder „gemäß deinem Entschluss“
  rationale: Der Text spricht von Gottes innerem Willen in der Bildsprache des Herzens. Diese sollte nicht stillschweigend in abstrakte theologische Sprache aufgelöst werden.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die hebräischen Bilder „Wort“ und „Herz“ sowie der auffällige Singular „Größe“ bleiben erhalten; die abschließende Kausativkonstruktion wird mit „bekannt zu machen“ idiomatisch wiedergegeben.
