base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/002.yaml
  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
translation:
  language: de
  text: 'Da sagte der König zu dem Propheten Nathan: „Sieh doch: Ich wohne in einem Haus aus Zedernholz, aber die Lade Gottes wohnt inmitten von Zeltbahnen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „inmitten der Zeltbahn“. Das hebräische Wort steht im Singular und bezeichnet eine Zeltbahn, einen Vorhang oder einen Zeltbehang; es kann hier die Zeltbehänge als Ganzes meinen.'
    reason: lexikalische und grammatische Alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Gibt den erzählenden Fortgang des hebräischen Wayyiqtol in natürlichem modernem Deutsch wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Bewahrt die bestimmte Amtsbezeichnung des Hebräischen, ohne den Namen David ergänzend einzutragen.
- source_word: נָתָן הַנָּבִיא
  choice: dem Propheten Nathan
  rationale: Natürliche deutsche Wiedergabe der appositionellen Bezeichnung; der Titel steht im Deutschen idiomatisch vor dem Namen.
- source_word: רְאֵה נָא
  choice: Sieh doch
  rationale: Die Partikel נָא mildert bzw. belebt die Aufforderung; „doch“ gibt dies idiomatisch wieder, ohne daraus eine eindringliche Bitte zu machen.
- source_word: אָנֹכִי יוֹשֵׁב
  choice: Ich wohne
  rationale: „Wohnen“ trifft hier den auf den Aufenthaltsort bezogenen Sinn von ישׁב; das selbstständige Pronomen wird durch das ausdrücklich gesetzte „Ich“ ausreichend wiedergegeben.
- source_word: בְּבֵית אֲרָזִים
  choice: in einem Haus aus Zedernholz
  rationale: Die Konstruktverbindung bezeichnet ein aus Zedernholz errichtetes oder damit ausgestattetes Haus; diese Formulierung ist klar und natürlich.
- source_word: וַאֲרוֹן הָאֱלֹהִים
  choice: aber die Lade Gottes
  rationale: Das waw trägt hier im Kontrast zu Davids Wohnhaus adversative Bedeutung; „aber“ macht diesen Gegensatz deutlich.
- source_word: יֹשֵׁב
  choice: wohnt
  rationale: Die Wiederholung desselben Verbs wie bei David erhält den pointierten Gegensatz des Hebräischen und vermeidet eine unnötige Abschwächung zu bloßem „stehen“.
- source_word: בְּתוֹךְ הַיְרִיעָה
  choice: hinter Zeltbahnen[a]
  rationale: יְרִיעָה bezeichnet eine Zeltbahn, einen Vorhang oder eine textile Zeltdecke. Der deutsche Plural kann die aus solchen Bahnen bestehende Umhüllung natürlich ausdrücken; die Fußnote hält die grammatisch singularische Alternative offen.
theological_decisions:
- issue: Aufenthaltsort der Lade
  choice: Die konkrete textile Behausung wird als „hinter Zeltbahnen“ wiedergegeben.
  alternative: „in einer Zeltbahn“ oder allgemeiner „in einem Zelt“
  rationale: Die Übersetzung bewahrt das konkrete Bild von יְרִיעָה und trägt keine spätere Tempeltheologie in den Vers ein; zugleich wird die im Hebräischen ungewöhnliche räumliche Formulierung nicht dogmatisch präzisiert.
- issue: Personifizierende Wiederholung von ישׁב
  choice: Sowohl David als auch die Lade „wohnen“.
  alternative: David „wohnt“, die Lade „steht“ oder „befindet sich“.
  rationale: Die Wiederholung ist ein bewusstes rhetorisches Element des Ausgangstextes. Sie bedeutet nicht, dass der Lade Eigenleben zugeschrieben wird, sondern stellt ihre jeweilige Behausung der des Königs gegenüber.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am hebräischen Kontrast, klingt aber natürlich. „Lade Gottes“ folgt dem etablierten bibelsprachlichen Ausdruck; „wohnt“ bewahrt die markante Verbwiederholung.
