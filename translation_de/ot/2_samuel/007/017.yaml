base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/017.yaml
  text: According to all these words and according to all this vision[a], so Nathan spoke to David.
translation:
  language: de
  text: Entsprechend all diesen Worten und entsprechend dieser ganzen Vision sprach Nathan zu David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Offenbarung“. Das hebräische Wort bezeichnet prophetische Offenbarung, die häufig in Form einer Schau empfangen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל
  choice: genau nach all
  rationale: Die Präposition כְּ bezeichnet hier die Übereinstimmung; zusammen mit כֹּל bringt „genau nach all“ die vollständige Entsprechung zum Ausdruck und lässt die Wiederholung des Hebräischen erkennen.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diesen Worten
  rationale: דְּבָרִים kann „Worte“, „Dinge“ oder „Angelegenheiten“ bedeuten. Da Nathan eine göttliche Botschaft weitergibt, passt „Worte“ am besten zum sprachlichen Inhalt.
- source_word: וּכְכֹל
  choice: und genau nach dieser ganzen
  rationale: Die Konjunktion und die wiederholte Entsprechungsformel bleiben erhalten, um den Parallelismus und den Nachdruck des Ausgangstextes wiederzugeben.
- source_word: הַחִזָּיוֹן הַזֶּה
  choice: dieser ganzen Vision
  rationale: חִזָּיוֹן bezeichnet eine prophetische Schau beziehungsweise Offenbarung. „Vision“ ist die direkteste deutsche Wiedergabe und bewahrt die im Text bezeichnete Offenbarungsweise.
- source_word: כֵּן
  choice: genau … redete
  rationale: כֵּן greift die vorausgehenden Vergleichsangaben zusammenfassend auf. Im Deutschen wird diese Funktion natürlich durch das vorangestellte „genau“ ausgedrückt, ohne ein schwerfälliges zusätzliches „so“ anzuhängen.
- source_word: דִּבֶּר
  choice: redete
  rationale: דִּבֶּר ist das gewöhnliche Verb für das Sprechen. „Redete“ entspricht dem würdigen deutschen Erzählstil und verbindet sich idiomatisch mit „zu David“.
- source_word: נָתָן
  choice: Nathan
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: אֶל דָּוִד
  choice: zu David
  rationale: אֶל bezeichnet die Ausrichtung der Rede auf David; „zu David“ ist dafür eine natürliche und genaue deutsche Formulierung.
theological_decisions:
- issue: Art der prophetischen Offenbarung in חִזָּיוֹן
  choice: Vision im Haupttext
  alternative: Offenbarung; prophetische Schau
  rationale: „Vision“ wahrt die konkrete Aussage des hebräischen Begriffs über die prophetische Offenbarungsweise, ohne sie zu verallgemeinern oder deutend zu erweitern.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die doppelte Übereinstimmungsformel des Hebräischen bleibt erkennbar; „genau“ gibt zugleich das zusammenfassende כֵּן idiomatisch wieder.
