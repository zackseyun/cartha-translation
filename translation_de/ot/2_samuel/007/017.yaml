  terminology: „Vision“ ist für חִזָּיוֹן die direkte, angemessene Wiedergabe. Die Fußnote bietet „Offenbarung“ als lexikalische Alternative, ohne die Hauptlesart zu verdrängen. Nathan und David entsprechen den üblichen deutschen Namensformen.
