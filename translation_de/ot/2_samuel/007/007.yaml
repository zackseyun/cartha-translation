  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל בְּנֵ֣י יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר צִוִּ֗יתִי לִ/רְע֛וֹת אֶת עַמִּ֥/י אֶת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לָ֛/מָּה לֹֽא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/007.yaml
  text: In all the places where I have walked among all the sons of Israel[a], did I ever speak a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, saying, ‘Why have you not built me a house of cedar?’
translation:
  language: de
  text: 'An allen Orten, an denen ich unter allen Israeliten umhergezogen bin: Habe ich jemals auch nur ein Wort zu einem der Stämme Israels[a], den ich beauftragt habe, mein Volk Israel zu weiden, gesagt: »Warum habt ihr mir kein Haus aus Zedernholz gebaut?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »einem der Stämme Israels«. Die Parallelstelle in 1. Chronik 17,6 hat »Richtern Israels«. Diese Lesart passt leichter zu dem folgenden Auftrag, das Volk zu weiden.'
    reason: Textvariante und die im masoretischen Text von Samuel bestehende syntaktisch-inhaltliche Spannung werden benannt, ohne die Lesart der Parallelstelle in den Haupttext zu übernehmen oder eine weitergehende Deutung festzulegen.
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: umhergezogen bin
  rationale: Das Hitpael von הלך bezeichnet hier Gottes bewegliche Gegenwart unter seinem Volk im Gegensatz zu einem festen Wohnhaus. »Umhergezogen« gibt diesen Sinn im Deutschen natürlicher wieder als das wörtlichere »gewandelt«.
- source_word: בְּכֹל אֲשֶׁר ... בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: Überall, wo ... unter allen Söhnen Israels
  rationale: »Überall, wo« nimmt die räumliche Bewegung des Verbs auf; »unter« bezeichnet Gottes Gegenwart inmitten des Volkes.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  rationale: Die traditionelle, formal genaue Wiedergabe bewahrt die maskuline Bundes- und Volksbezeichnung des Hebräischen.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: habe ich da jemals ... gesagt
  rationale: Die rhetorische Frage und der verstärkende Charakter der hebräischen Verbindung werden durch »da jemals« natürlich und nachdrücklich ausgedrückt.
- source_word: אַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: einem der Stämme Israels
  rationale: Der masoretische Text von Samuel liest eindeutig »Stämme«. Die abweichende Parallelüberlieferung und die Spannung zum folgenden Hirtenauftrag werden in der Fußnote offengelegt.
- source_word: אֲשֶׁר צִוִּיתִי לִרְעוֹת
  choice: die ich beauftragt hatte ... zu weiden
  rationale: »Weiden« bewahrt das Hirtenbild. Der Relativsatz bleibt entsprechend dem vorliegenden Samueltext auf die Stämme bezogen, auch wenn sachlich deren Leiter gemeint sein können.
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: mein Volk Israel
  rationale: Die deutsche Apposition bewahrt sowohl die Bundeszugehörigkeit als auch die Identifikation des Volkes.
- source_word: לָמָּה לֹא בְנִיתֶם לִי בֵּית אֲרָזִים
  choice: Warum habt ihr mir kein Haus aus Zedernholz gebaut?
  rationale: »Haus aus Zedernholz« ist im modernen Deutschen verständlich und gibt Material und Pracht des vorgesehenen festen Baus wieder. Das pluralische »ihr« entspricht der hebräischen Verbform.
theological_decisions:
- issue: Geschlechtlich markierte Bezeichnung des Bundesvolkes
  choice: Söhne Israels
  alternative: Israeliten / Volk Israel
  rationale: Die maskuline nationale Bezeichnung des hebräischen Textes wird formal bewahrt, ohne sie durch eine neutralisierende Formulierung zu ersetzen.
- issue: Spannung zwischen »Stämmen« und einem auf Leiter bezogenen Hirtenauftrag
  choice: einem der Stämme Israels
  alternative: einem der Richter beziehungsweise Führer Israels
  rationale: Die Hauptlesart folgt dem masoretischen Samueltext. Die Chronikparallele nennt dagegen »Richter« und erklärt den Leiterbezug leichter; diese Variante wird nicht in den Haupttext eingetragen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Moderne, würdige Standardsprache. »Umhergezogen« und »Haus aus Zedernholz« vermeiden altertümliche Wendungen; »Söhne Israels« und »weiden« erhalten zugleich die formale und bildhafte Prägung des hebräischen Textes.
