id: 2SA.7.18
reference: 2 Samuel 7:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔ד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִ֣י אָנֹכִ֞י אֲדֹנָ֤/י יְהוִה֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/018.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, Lord GOD, and what is my house, that you have brought me this far?”
translation:
  language: de
  text: 'Dann ging König David hinein, setzte sich vor Jahwe und sagte: »Wer bin ich, Herr Jahwe, und was ist mein Haus[a], dass du mich bis hierher gebracht hast?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Haus“ kann hier Davids Familie, Hausgemeinschaft oder entstehende Dynastie gemeint sein. Das Wort greift den wiederholten Gebrauch von „Haus“ in diesem Kapitel auf.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ging hinein
  rationale: Die Wendung gibt die konkrete Bewegung wieder, ohne einen im Vers nicht ausdrücklich genannten Ort zu ergänzen.
- source_word: וַיֵּשֶׁב
  choice: setzte sich
  rationale: Im erzählerischen Zusammenhang bezeichnet ישׁב hier das Einnehmen einer sitzenden Haltung, nicht das Wohnen oder Bleiben.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die knappe Formulierung bewahrt sowohl die Bedeutung der Gegenwart vor Gott als auch den im Hebräischen verwendeten Gottesnamen.
- source_word: מִי אָנֹכִי
  choice: Wer bin ich
  rationale: Dies ist im Deutschen die natürliche rhetorische Frage, mit der David seine Demut und sein Staunen ausdrückt.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  rationale: Die Wiedergabe unterscheidet den Herrentitel אֲדֹנָי vom Gottesnamen יהוה und bewahrt zugleich ihre Verbindung.
- source_word: וּמִי בֵיתִי
  choice: und was ist mein Haus
  rationale: Das hebräische מִי lautet wörtlich „wer“, doch bezogen auf „Haus“ entspricht „was“ dem natürlichen deutschen Ausdruck. „Haus“ bleibt wegen des prägenden Wortspiels im Kapitel erhalten.
- source_word: הֲבִיאֹתַנִי
  choice: du mich … gebracht hast
  rationale: 'Die Hifil-Form von בוא hat kausative Bedeutung: Gott hat David bis zu diesem Punkt gebracht.'
- source_word: עַד הֲלֹם
  choice: bis hierher
  rationale: Die Formulierung kann sowohl den erreichten Lebensweg als auch Davids gegenwärtige Stellung bezeichnen, ohne dies unnötig festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar als Gottes Bundesname wiedergegeben; die im Deutschen etablierte Form „Jahwe“ entspricht der hebräischen Namensform, ohne sie durch einen Titel zu ersetzen.
- issue: Bedeutung von „mein Haus“
  choice: „mein Haus“ im Haupttext beibehalten
  alternative: „meine Familie“, „meine Hausgemeinschaft“ oder „meine Dynastie“
  rationale: „Haus“ trägt in 2 Samuel 7 bewusst mehrere Bedeutungen und verbindet Davids Familie und Herrscherlinie mit der Verheißung eines bleibenden Hauses. Eine engere Wiedergabe würde dieses literarische und theologische Spannungsfeld auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht markierte Wendung „was ist mein Haus“ wurde bewusst beibehalten, um das zentrale Wortspiel des Kapitels nicht zu glätten.
