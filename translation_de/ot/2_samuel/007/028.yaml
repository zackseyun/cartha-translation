  text: וְ/עַתָּ֣ה אֲדֹנָ֣/י יְהוִ֗ה אַתָּה הוּא֙ הָֽ/אֱלֹהִ֔ים וּ/דְבָרֶ֖י/ךָ יִהְי֣וּ אֱמֶ֑ת וַ/תְּדַבֵּר֙ אֶֽל עַבְדְּ/ךָ֔ אֶת הַ/טּוֹבָ֖ה הַ/זֹּֽאת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/028.yaml
  text: And now[a], Lord GOD, you are God, and your words are true[b], and you have spoken this good thing to your servant.
translation:
  language: de
  text: 'Und nun, Herr Jahwe: Du bist Gott, und deine Worte sind wahr[a]. Du hast deinem Knecht dieses Gute gesagt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Worte werden wahr sein“; auch: „deine Worte sind zuverlässig“.'
    reason: Das hebräische Imperfekt יִהְיוּ kann zukünftig oder als Ausdruck fortdauernder Geltung verstanden werden; אֱמֶת umfasst Wahrheit und Verlässlichkeit.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Herr, Jahwe
  rationale: Die Anrede gibt sowohl אֲדֹנָי („Herr“) als auch den Gottesnamen יהוה wieder. Das Komma macht die doppelte Anrede im Deutschen natürlich verständlich.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: Du bist Gott
  rationale: Die hebräische emphatische Konstruktion bekräftigt Gottes Identität. „Du bist Gott“ ist im Deutschen natürlich und bewahrt die Aussage, ohne ein unidiomatisches „du bist der Gott“ zu erzwingen.
- source_word: דְבָרֶיךָ
  choice: deine Worte
  rationale: Der hebräische Ausdruck steht im Plural; „Worte“ bewahrt diese Form und vermeidet die interpretierende Verengung auf „Verheißung“.
- source_word: יִהְיוּ אֱמֶת
  choice: sind Wahrheit
  rationale: Obwohl יִהְיוּ formal auch zukünftig verstanden werden kann, bezeichnet die Aussage im Kontext die bleibende Wahrheit und Verlässlichkeit von Gottes Worten. Das prädikative Substantiv אֱמֶת wird mit „Wahrheit“ bewahrt.
- source_word: וַתְּדַבֵּר
  choice: du hast … zugesagt
  rationale: Das Verb bedeutet grundsätzlich „reden, sprechen“. In Verbindung mit „dieses Gute“ und der vorausgehenden göttlichen Zusage gibt „zugesagt“ die kontextuelle Funktion in natürlichem Deutsch wieder; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
- source_word: אֶל עַבְדְּךָ
  choice: deinem Knecht
  rationale: „Knecht“ entspricht der demütigen Selbstbezeichnung Davids gegenüber Gott und passt zum würdigen Gebetsregister.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: dieses Gute
  rationale: Die substantivierte Form bewahrt die Offenheit des hebräischen Ausdrucks, ohne ihn ausdrücklich als „Verheißung“, „Segen“ oder „Wohltat“ festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Herr, Jahwe
  alternative: Herr HERR; Herr, der HERR
  rationale: „Jahwe“ macht den im Ausgangstext stehenden Gottesnamen sichtbar, während „Herr“ אֲדֹנָי wiedergibt. So werden beide Elemente unterschieden und eine schwer verständliche Verdopplung vermieden.
- issue: Zeit- und Bedeutungswert von יִהְיוּ אֱמֶת
  choice: deine Worte sind Wahrheit
  alternative: deine Worte werden wahr sein; deine Worte sind zuverlässig
  rationale: Der hebräische Imperfekt kann formal zukünftig gelesen werden, im Kontext aber auch eine fortdauernde Geltung ausdrücken. Die Hauptfassung wahrt zudem das Substantiv „Wahrheit“; die Alternativen werden transparent gemacht.
- issue: Kontextuelle Wiedergabe von וַתְּדַבֵּר
  choice: du hast … zugesagt
  alternative: du hast … gesprochen
  rationale: „Zugesagt“ macht den Bezug auf Gottes vorausgehende Verheißung verständlich, ohne „dieses Gute“ selbst als „Verheißung“ umzudeuten. Da das Verb wörtlich „sprechen“ heißt, wird dies in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die direkte Gottesanrede wird großgeschrieben. „Knecht“ bewahrt den traditionellen, hier sachlich passenden Statusausdruck; „dieses Gute“ erhält die absichtliche Weite des Hebräischen.
