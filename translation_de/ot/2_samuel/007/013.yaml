source:
  edition: WLC
  text: ה֥וּא יִבְנֶה בַּ֖יִת לִ/שְׁמִ֑/י וְ/כֹנַנְתִּ֛י אֶת כִּסֵּ֥א מַמְלַכְתּ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/013.yaml
  text: He will build a house for my name[a], and I will establish the throne of his kingdom forever.
translation:
  language: de
  text: Er wird ein Haus für meinen Namen bauen[a], und ich werde den Thron seines Königtums für immer festigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Tempel für meinen Namen bauen“. Im Hebräischen steht „Haus“; damit bleibt das Wortspiel dieses Kapitels zwischen einem Heiligtum und einem Herrscherhaus erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Er
  rationale: Das selbstständige Personalpronomen der 3. Person Maskulin Singular bezeichnet ausdrücklich den angekündigten Nachkommen; eine zusätzliche Hervorhebung wie „er selbst“ ist im Deutschen nicht erforderlich.
- source_word: יִבְנֶה
  choice: wird … bauen
  rationale: Das Qal-Imperfekt bezeichnet im Zusammenhang der Verheißung eine zukünftige Handlung. Die Umschreibung mit „wird“ ist natürliches modernes Deutsch.
- source_word: בַּיִת
  choice: ein Haus
  rationale: „Haus“ gibt die Grundbedeutung wieder und bewahrt das Wortspiel des Kapitels zwischen Heiligtum und Dynastie. Der konkrete Bezug auf einen Tempel wird in der Fußnote genannt.
- source_word: לִשְׁמִי
  choice: meinem Namen
  rationale: Mit dem Verb „bauen“ gibt der Dativ die hebräische Verbindung לְ + „mein Name“ knapp und idiomatisch als Bestimmung bzw. Widmung wieder, ohne den theologischen Ausdruck auszudeuten.
- source_word: וְכֹנַנְתִּי
  choice: und ich werde … festigen
  rationale: Die Form hat in der Verheißungsfolge futurischen Sinn. „Festigen“ bringt das dauerhafte Sichern des Thrones präzise und in natürlichem Deutsch zum Ausdruck.
- source_word: אֶת כִּסֵּא
  choice: den Thron
  rationale: כִּסֵּא bezeichnet im königlichen Zusammenhang unmittelbar den Thron; der hebräische Akkusativmarker wird nicht eigens wiedergegeben.
- source_word: מַמְלַכְתּוֹ
  choice: seines Königtums
  rationale: מַמְלָכָה kann das Königreich, die Königsherrschaft oder das Königtum bezeichnen. „Thron seines Königtums“ bewahrt die königliche Abstraktion und vermeidet die mögliche räumliche Verengung von „Reich“.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die feste Wendung bezeichnet hier die unbegrenzte Dauer der davidischen Verheißung; „für immer“ gibt ihre volle zeitliche Kraft klar wieder.
theological_decisions:
- issue: Ob בַּיִת als „Haus“ oder deutend als „Tempel“ wiederzugeben ist
  choice: Haus
  alternative: Tempel
  rationale: Unmittelbar ist das von Salomo zu errichtende Heiligtum gemeint. Zugleich beruht die literarische und theologische Struktur des Kapitels auf der Mehrdeutigkeit von „Haus“ als Heiligtum und Dynastie. „Haus“ bewahrt diese Spannung.
- issue: Bedeutungsumfang von מַמְלַכְתּוֹ
  choice: seines Königtums
  alternative: seines Reiches
  rationale: Der Ausdruck kann sowohl Herrschaft als auch Herrschaftsbereich bezeichnen. „Königtum“ lässt den Schwerpunkt auf der davidischen Königsherrschaft liegen, ohne ausschließlich ein Territorium anzudeuten.
- issue: Zeitliche Kraft von עַד עוֹלָם in der davidischen Verheißung
  choice: für immer
  alternative: auf unabsehbare Zeit
  rationale: Im Bundes- und Verheißungszusammenhang trägt die Wendung den vollen Anspruch bleibender Dauer. Eine Abschwächung auf lediglich sehr lange Zeit wäre hier nicht gerechtfertigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung „meinem Namen ein Haus bauen“ ist idiomatisch und bewahrt den hebräischen Ausdruck, während die Fußnote den konkreten Tempelbezug erläutert.
