  text: וַ/יְהִ֖י בַּ/לַּ֣יְלָה הַ/ה֑וּא וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל נָתָ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/004.yaml
  text: But that night the word of Yahweh came to Nathan[a], saying,
translation:
  language: de
  text: Doch in jener Nacht erging das Wort Jahwes an Nathan:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Förmlicher: „Und es geschah in jener Nacht: Das Wort Jahwes erging an Nathan folgendermaßen:“'
    reason: Die Fußnote bewahrt die wiederholte hebräische Erzählungsformel וַיְהִי und gibt לֵאמֹר ausdrücklich wieder.
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Doch in jener Nacht
  rationale: Die Erzählungsformel führt das nächste Geschehen ein. „Doch“ macht im Deutschen den sachlich vorhandenen Gegensatz zu Nathans vorheriger Zustimmung deutlich; „in jener Nacht“ gibt die Zeitangabe natürlich und präzise wieder.
- source_word: וַיְהִי דְּבַר יְהוָה
  choice: erging das Wort Jahwes
  rationale: Die traditionelle prophetische Offenbarungsformel wird mit dem im Deutschen idiomatischen „erging das Wort …“ wiedergegeben. „Wort“ bewahrt gegenüber „Botschaft“ die Form und das Gewicht des hebräischen Ausdrucks.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. Die im Deutschen geläufige Form „Jahwe“ entspricht einer sachgerechten Umschrift des Tetragramms.
- source_word: אֶל נָתָן
  choice: an Nathan
  rationale: אֶל bezeichnet hier den Empfänger der Offenbarung; in Verbindung mit „das Wort erging“ ist „an Nathan“ modernes, idiomatisches Deutsch.
- source_word: לֵאמֹר
  choice: Doppelpunkt
  rationale: Der Infinitiv leitet die folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen, nicht den Titel אֲדֹנָי. Die Wiedergabe als „Jahwe“ bewahrt diese Unterscheidung.
- issue: Kontrast zur Zustimmung Nathans in Vers 3
  choice: Doch
  alternative: Und es geschah
  rationale: Das hebräische וַיְהִי kann als neutraler Erzählungsanschluss verstanden werden; im Kontext folgt jedoch eine göttliche Korrektur auf Nathans vorherige Zustimmung. „Doch“ bringt diesen Zusammenhang zum Ausdruck, ohne den Inhalt der Offenbarung vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige prophetische Formel „das Wort Jahwes erging an“ wahrt den biblischen Ton, während der Doppelpunkt die anschließende Rede natürlich einführt.
