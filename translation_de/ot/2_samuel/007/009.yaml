base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/009.yaml
  text: And I was with you wherever you went[a], and I cut off all your enemies from before you. And I will make for you a great name[b], like the name of the great ones who are on the earth.
translation:
  language: de
  text: Ich war mit dir, wohin du auch gingst, und ich rottete alle deine Feinde vor dir aus. Und ich werde dir einen großen Namen verschaffen, so groß wie der Name der Großen, die auf der Erde sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der großen Männer“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: Ich war mit dir
  rationale: Das Präteritum führt die Rückschau auf Gottes bisheriges Handeln fort; „mit dir“ bewahrt sowohl die räumliche als auch die unterstützende beziehungsweise bundesbezogene Nuance.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: wohin du auch gingst
  rationale: Die idiomatische Wendung bezeichnet umfassend alle Wege und Orte Davids; die deutsche Formulierung ist natürlich und erhält diesen umfassenden Sinn.
- source_word: וָאַכְרִתָה אֶת כָּל אֹיְבֶיךָ מִפָּנֶיךָ
  choice: ich rottete alle deine Feinde vor dir aus
  rationale: כרת bezeichnet hier das gewaltsame Abschneiden oder Vernichten. „Ausrotten“ erhält die Stärke des Verbs; „vor dir“ wahrt das räumliche Bild von מִפָּנֶיךָ.
- source_word: וְעָשִׂיתִי לְךָ שֵׁם גָּדוֹל
  choice: ich werde dir einen großen Namen machen
  rationale: Das Futur entspricht dem verheißenden Fortgang der Rede. Die Formulierung bewahrt den Benefaktiv mit לְךָ sowie das biblische Bild des „großen Namens“, das Ansehen und Ruhm einschließt.
- source_word: כְּשֵׁם הַגְּדֹלִים
  choice: wie den Namen der Großen
  rationale: Die Wiederholung von „Name“ erhält den hebräischen Parallelismus. „Die Großen“ lässt die substantivierte Bezeichnung für bedeutende beziehungsweise mächtige Menschen bestehen, ohne das Geschlecht unnötig festzulegen.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: die auf der Erde sind
  rationale: אָרֶץ kann „Land“ oder „Erde“ bedeuten; der umfassende Vergleich mit den weithin Berühmten spricht hier für „Erde“.
theological_decisions:
- issue: Zeitwert von וְעָשִׂיתִי innerhalb der göttlichen Verheißung
  choice: 'Futur: „ich werde dir einen großen Namen machen“'
  alternative: 'Perfekt beziehungsweise Vergangenheit: „ich habe dir einen großen Namen gemacht“'
  rationale: Obwohl die Verbform formal ein Qatal ist, wechselt die Rede von der Rückschau auf Gottes bisheriges Handeln zur Verheißung. Das deutsche Futur macht diesen promissorischen Fortgang deutlich, ohne die Form als bereits vollständig erfüllt darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Redefluss; zentrale biblische Bilder wie „mit dir sein“ und „einen großen Namen machen“ werden bewahrt, während idiomatische Wendungen verständlich wiedergegeben werden.
