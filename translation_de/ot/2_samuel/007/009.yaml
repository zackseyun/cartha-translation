review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge von Rückblick ("Ich war ...", "ich rottete ... aus") und Verheißung ("ich werde ...") sowie die umfassenden Angaben "wohin du auch gingst" und "alle deine Feinde" zutreffend wieder. "Vor dir" kann das hebräische מִפָּנֶיךָ als Bild des Beseitigens aus Davids Gegenwart bzw. Weg bewahren. Die Vergleichsformel sollte im Deutschen jedoch klarer ausdrücken, dass der verheißene Name dem Namen der Großen entsprechen soll.
  naturalness: '"Jemandem einen großen Namen machen" ist als bewusst biblisch geprägte Wendung verständlich, wirkt im heutigen Standarddeutsch aber deutlich kalkiert. "Einen großen Namen verschaffen" ist idiomatischer und bewahrt sowohl die Bedeutung von Ruhm/Ansehen als auch das Bild des "Namens". Die Ergänzung "so groß wie" macht die Vergleichskonstruktion flüssig und eindeutig.'
  terminology: '"Großer Name" bewahrt den wichtigen biblischen Ausdruck שֵׁם גָּדוֹל. "Die Großen" gibt הַגְּדֹלִים offen und ohne unnötige geschlechtliche oder soziale Einengung wieder. "Ausrotten" gibt die Härte von Hifil כרת wieder, kann aber im modernen Deutschen historische und politische Assoziationen tragen; im vorliegenden antiken Kriegs- und Königskontext ist es als Übersetzung von "abschneiden/vernichten" noch vertretbar.'
