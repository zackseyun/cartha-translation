  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת לְ֠/מִ/יּוֹם הַעֲלֹתִ֞/י אֶת בְּנֵ֤י יִשְׂרָאֵל֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָ/אֶֽהְיֶה֙ מִתְהַלֵּ֔ךְ בְּ/אֹ֖הֶל וּ/בְ/מִשְׁכָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/006.yaml
  text: For I have not dwelt in a house from the day I brought up the sons of Israel out of Egypt to this day[b][a], but I have been moving about in a tent and in a tabernacle.
translation:
  language: de
  text: Denn ich habe seit dem Tag, an dem ich die Israeliten[a] aus Ägypten heraufgeführt habe, bis zum heutigen Tag in keinem Haus gewohnt, sondern bin in einem Zelt und in einer Wohnstätte[b] umhergezogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“; traditionell auch: „die Kinder Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Stiftshütte“. Das hebräische Wort bezeichnet eine Wohnstätte und wird häufig für das tragbare Heiligtum Israels gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי בְּבַיִת
  choice: habe in keinem Haus gewohnt
  rationale: ישׁב bezeichnet hier das Wohnen bzw. seinen festen Aufenthalt haben. Die Negation wird im Deutschen natürlich mit „in keinem Haus“ ausgedrückt; „Haus“ bleibt entsprechend der unbestimmten hebräischen Form unbestimmt und wird nicht vorschnell als „Tempel“ gedeutet.
- source_word: לְמִיּוֹם הַעֲלֹתִי
  choice: seit dem Tag, an dem ich … heraufgeführt habe
  rationale: Die Wendung markiert den zeitlichen Ausgangspunkt. Der Hifil von עלה bewahrt mit „heraufführen“ die traditionelle räumliche Bildsprache des Exodus und die göttliche Handlung in der ersten Person.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht „Söhne Israels“; als feste Volksbezeichnung meint die Wendung hier das Volk Israel. „Die Israeliten“ ist im modernen Deutschen präzise, natürlich und ohne unnötige geschlechtliche Verengung.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Die Präposition bezeichnet den Ausgangsort; zusammen mit „heraufgeführt“ ergibt sich die natürliche deutsche Exodusformulierung.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Die übliche deutsche Entsprechung wahrt den bis in die Gegenwart der Rede reichenden Zeitraum.
- source_word: וָאֶהְיֶה מִתְהַלֵּךְ
  choice: Vielmehr bin ich … umhergezogen
  rationale: Die Konstruktion aus ויהי und Partizip beschreibt fortgesetzte Bewegung. „Vielmehr“ macht den sachlichen Gegensatz zum festen Haus deutlich, ohne ihn zu überzeichnen.
- source_word: בְּאֹהֶל
  choice: in einem Zelt
  rationale: אהל hat die Grundbedeutung „Zelt“ und ist hier formal unbestimmt.
- source_word: וּבְמִשְׁכָּן
  choice: und in einer Wohnstätte
  rationale: משׁכן bezeichnet seinem Wortlaut nach eine Wohnstätte bzw. Behausung. Diese Wiedergabe bewahrt die lexikalische Breite und vermeidet, das Wort ausschließlich als später etablierten Fachbegriff „Stiftshütte“ zu lesen.
theological_decisions:
- issue: Reichweite von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels / die Kinder Israels
  rationale: Die hebräische Form ist grammatisch maskulin und wörtlich genealogisch, fungiert aber als kollektive Volksbezeichnung. Die Hauptfassung gibt deshalb den gemeinten Referenten idiomatisch wieder; die Fußnote erhält die formnähere Alternative.
- issue: Kultischer Gehalt von מִשְׁכָּן
  choice: Wohnstätte
  alternative: Stiftshütte / Heiligtum
  rationale: Im Kontext ist die tragbare heilige Wohnstätte Gottes gemeint, doch das Lexem selbst bedeutet zunächst „Wohnstätte“. Die Hauptfassung lässt die Spannung zwischen allgemeiner Wortbedeutung und kultischem Kontext bestehen; die Fußnote nennt die traditionelle kultische Wiedergabe.
- issue: Verhältnis von אֹהֶל und מִשְׁכָּן
  choice: Zelt und Wohnstätte
  alternative: Zeltwohnung / Stiftshütte
  rationale: Die beiden hebräischen Substantive werden nicht zu einem einzigen Ausdruck verschmolzen. So bleibt offen, ob sie zwei Aspekte derselben tragbaren Behausung oder eine gekoppelte Bezeichnung darstellen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Gewohnt“ ist natürlicher als das gehobene „gewohnt/geweilt“ im Sinne von „dwelt“, während „heraufgeführt“ die biblische Exodusbildsprache erhält. Die Satzteilung verbessert die Lesbarkeit, ohne die inhaltliche Verbindung zu lösen.
