source:
  edition: WLC
  text: וַ/תִּקְטַן֩ ע֨וֹד זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֣/י יְהוִ֔ה וַ/תְּדַבֵּ֛ר גַּ֥ם אֶל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵֽ/רָח֑וֹק וְ/זֹ֛את תּוֹרַ֥ת הָ/אָדָ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/019.yaml
  text: And even this was too small in your eyes[a], Lord GOD; you have also spoken of your servant’s house for a long time to come, and this is the law of man[c][b], Lord GOD.
translation:
  language: de
  text: Und selbst dies war in deinen Augen noch zu gering, Herr, HERR. Du hast auch über das Haus[a] deines Dieners bis in die ferne Zukunft hinein[b] gesprochen. Und dies ist die Weisung des Menschen[c], Herr, HERR.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Haus« kann hier die Familie oder die Dynastie bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »bis in die Ferne«; gemeint ist das, was zeitlich weit vorausliegt.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Schlusssatz ist schwer zu deuten. Möglich sind auch: »Dies ist die Satzung für die Menschheit« oder »Dies ist das Gesetz/der Brauch des Menschen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן עוֹד זֹאת בְּעֵינֶיךָ
  choice: Und selbst dies war in deinen Augen noch zu gering
  rationale: Die Formulierung bewahrt sowohl das Bild »in deinen Augen« als auch die wertende Bedeutung von קטן. »Noch zu gering« bringt zum Ausdruck, dass Gott über die zuvor gegebene Verheißung hinausging.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr, HERR
  rationale: Die unterschiedliche Schreibung gibt den zusammengesetzten Gottesnamen wieder und vermeidet die missverständliche Doppelung »Herr, Herr«.
- source_word: וַתְּדַבֵּר גַּם אֶל בֵּית עַבְדְּךָ
  choice: Du hast auch über das Haus deines Dieners gesprochen
  rationale: אֶל bezeichnet hier den Gegenstand der Rede. »Haus« bleibt als Quellbegriff erhalten und kann Familie, Hausgemeinschaft oder Dynastie umfassen.
- source_word: לְמֵרָחוֹק
  choice: bis in ferne Zukunft
  rationale: Das räumliche Wort für Ferne wird hier natürlich als zeitliche Ferne verstanden und bezeichnet das, was weit vorausliegt.
- source_word: תּוֹרַת
  choice: Weisung
  rationale: תּוֹרָה kann Weisung, Unterweisung oder Gesetz bedeuten. »Weisung« hält das Bedeutungsspektrum offen und legt den schwierigen Satz nicht vorschnell auf einen Gesetzestext fest.
- source_word: הָאָדָם
  choice: des Menschen
  rationale: Der bestimmte Singular wird formal als Genitiv wiedergegeben. Dadurch bleibt offen, ob אָדָם den Menschen allgemein, die Menschheit oder einen einzelnen Menschen bezeichnet.
theological_decisions:
- issue: Deutung von וְזֹאת תּוֹרַת הָאָדָם
  choice: Und dies ist die Weisung des Menschen
  alternative: Und dies ist die Satzung für die Menschheit / Und dies ist das Gesetz oder der Brauch des Menschen
  rationale: Der hebräische Schlusssatz ist syntaktisch und semantisch umstritten. Die Hauptfassung bleibt eng bei den einzelnen Wörtern und wahrt die Genitivkonstruktion, statt sie eindeutig als Weisung »für« die Menschheit oder als messianische Aussage auszulegen.
- issue: Bedeutung von בֵּית עַבְדְּךָ
  choice: das Haus deines Dieners
  alternative: die Dynastie deines Dieners
  rationale: »Haus« bewahrt das für die Verheißung zentrale Wortspiel zwischen Gebäude, Familie und Herrscherhaus; die dynastische Bedeutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräischen Bilder »in deinen Augen« und »Haus« bleiben erhalten. Der bewusst etwas ungewöhnliche Ausdruck »Weisung des Menschen« spiegelt die schwierige und mehrdeutige hebräische Schlussklausel, ohne sie konfessionell oder dogmatisch festzulegen.
