id: 2SA.7.14
reference: 2 Samuel 7:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲנִי֙ אֶהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִהְיֶה לִּ֣/י לְ/בֵ֑ן אֲשֶׁר֙ בְּ/הַ֣עֲוֺת֔/וֹ וְ/הֹֽכַחְתִּי/ו֙ בְּ/שֵׁ֣בֶט אֲנָשִׁ֔ים וּ/בְ/נִגְעֵ֖י בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/014.yaml
  text: I will be a father to him[a], and he will be a son to me. When he commits iniquity, I will discipline him with the rod of men and with the blows of the sons of man.
translation:
  language: de
  text: Ich werde ihm Vater sein, und er wird mir Sohn sein. Wenn er sich vergeht, werde ich ihn mit der Rute von Menschen und mit den Schlägen der Menschenkinder[a] züchtigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „mit menschlichen Schlägen“. Wörtlich steht im Hebräischen: „mit den Schlägen der Menschenkinder“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: Ich werde ihm Vater sein
  rationale: Die relationale Konstruktion mit ל wird in einer im Deutschen verständlichen, zugleich formnahen Wendung wiedergegeben und nicht zu „Ich werde sein Vater sein“ geglättet.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: und er wird mir Sohn sein
  rationale: Die spiegelbildliche Form der Bundesformel bleibt erhalten; „mein Sohn sein“ wäre idiomatischer, würde aber die hebräische Parallelität stärker glätten.
- source_word: אֲשֶׁר בְּהַעֲוֺתוֹ
  choice: Wenn er sich vergeht
  rationale: אֲשֶׁר leitet hier den Umstand des schuldhaften Handelns ein. „Wenn“ wahrt den zeitlich-konditionalen Spielraum, während „sich vergehen“ die moralische Schuld natürlich und gewichtig ausdrückt.
- source_word: וְהֹכַחְתִּיו
  choice: werde ich ihn … züchtigen
  rationale: Der Hiphil von יכח bezeichnet korrigierendes Zurechtweisen; wegen der folgenden Rute und Schläge gibt „züchtigen“ hier die konkrete, disziplinierende Maßnahme prägnant wieder.
- source_word: בְּשֵׁבֶט אֲנָשִׁים
  choice: mit der Rute von Menschen
  rationale: Die formnahe Wiedergabe bewahrt das Bild der Rute und lässt offen, ob gewöhnliche menschliche Mittel oder Menschen als Werkzeuge der Züchtigung gemeint sind.
- source_word: וּבְנִגְעֵי בְּנֵי אָדָם
  choice: und mit den Schlägen der Menschenkinder
  rationale: „Schläge“ gibt נְגָעִים in diesem Strafkontext verständlich wieder. „Menschenkinder“ bewahrt die hebräische Wendung בני אדם; eine idiomatischere Lesart wird in der Fußnote genannt.
theological_decisions:
- issue: Reichweite der Sohnesverheißung innerhalb der davidischen Königslinie und ihre spätere messianische Verwendung
  choice: Der Vers wird in seinem unmittelbaren Bezug auf Davids königlichen Nachkommen wiedergegeben, ohne die Übersetzung ausdrücklich messianisch auszudeuten.
  alternative: Die Aussage im Haupttext unmittelbar und ausschließlich messianisch formulieren.
  rationale: Der unmittelbare Zusammenhang betrifft Davids Nachkommen und die davidische Königslinie. Die Sohn-Vater-Sprache kann später weiter aufgegriffen werden; diese theologische Spannung soll der Wortlaut offenhalten.
- issue: Bedingtheit beziehungsweise zeitlicher Eintritt des schuldhaften Handelns
  choice: „Wenn er sich vergeht“
  alternative: „Falls er sich vergeht“ oder „wann immer er sich vergeht“
  rationale: Das hebräische אֲשֶׁר legt hier keine ausdrücklich irreale Bedingung fest. „Wenn“ bewahrt die mögliche zeitliche wie konditionale Nuance, ohne die Aussage stärker zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst formnaher Wiedergabe der wechselseitigen Vater-Sohn-Formel. „Menschenkinder“ und „Rute von Menschen“ sind leicht markiert, bewahren aber Bildsprache und Mehrdeutigkeit des Hebräischen; die idiomatischere Alternative zur letzten Wendung steht in der Fußnote.
