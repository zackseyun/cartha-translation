id: 2SA.7.16
reference: 2 Samuel 7:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נֶאְמַ֨ן בֵּיתְ/ךָ֧ וּ/מַֽמְלַכְתְּ/ךָ֛ עַד עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽסְאֲ/ךָ֔ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/016.yaml
  text: And your house and your kingdom shall be made sure forever before me[b][a]; your throne shall be established forever.
translation:
  language: de
  text: Und dein Haus[b] und dein Königreich werden für immer vor dir[a] Bestand haben; dein Thron wird für immer fest stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „vor dir“; einige Textzeugen lesen „vor mir“.'
    reason: textual_variant
  - marker: b
    text: „Haus“ meint hier wahrscheinlich das Königshaus, also die Dynastie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶאְמַן
  choice: werden … Bestand haben
  rationale: Das Nifal von אמן bezeichnet hier Festigkeit, Verlässlichkeit und dauerhaften Bestand. Die deutsche Wendung ist natürlich und wahrt zugleich den Unterschied zu נָכוֹן im zweiten Satzteil.
- source_word: בֵּיתְךָ
  choice: dein Haus
  rationale: בַּיִת kann im Zusammenhang einer königlichen Verheißung das Herrscherhaus, also die Dynastie, bezeichnen. Der Ausgangsbegriff bleibt im Haupttext erhalten; die dynastische Bedeutung wird in einer Fußnote erläutert.
- source_word: וּמַמְלַכְתְּךָ
  choice: und dein Königreich
  rationale: Der Begriff bezeichnet Königtum beziehungsweise Königreich. „Königreich“ ist hier direkt, verständlich und passt zu „Haus“ und „Thron“.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte Dauer. Ihre Wiederholung wird entsprechend dem Hebräischen beibehalten.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: 'Der vorgelegte masoretische Konsonantentext hat die zweite Person Singular: „vor dir“. Die textlich bezeugte Alternative „vor mir“ wird in der Fußnote genannt.'
- source_word: כִּסְאֲךָ
  choice: dein Thron
  rationale: Die wörtliche Wiedergabe bezeichnet sowohl den Königssitz als auch metonymisch die Königsherrschaft.
- source_word: יִהְיֶה נָכוֹן
  choice: wird … fest stehen
  rationale: נָכוֹן mit היה drückt gesicherte Festigkeit aus. „Fest stehen“ ist idiomatisches modernes Deutsch und unterscheidet sich angemessen von וְנֶאְמַן im ersten Satzteil.
theological_decisions:
- issue: Dynastische Verheißung und mögliche messianische Bedeutung
  choice: Die Begriffe „Haus“, „Königreich“ und „Thron“ werden ohne ausdrückliche messianische Deutung beibehalten.
  alternative: „Haus“ als „Dynastie“ wiedergeben oder die messianische Erfüllung im Wortlaut ausdrücklich markieren.
  rationale: Der Vers verheißt zunächst Davids Königshaus dauerhaften Bestand. Eine weiterführende messianische Deutung bleibt möglich, soll aber nicht in den Wortlaut hineingetragen werden.
- issue: Textvariante bei לְפָנֶיךָ
  choice: „vor dir“ steht im Haupttext.
  alternative: „vor mir“ nach anderen Textzeugen und im unmittelbaren Kontext der Gottesrede.
  rationale: Die vorgelegte WLC-Lesart wird übersetzt; die bedeutende Variante bleibt durch eine Fußnote sichtbar, ohne die textliche Spannung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bestand haben“ und „fest stehen“ geben die beiden verwandten, aber unterschiedlichen hebräischen Festigkeitsbegriffe natürlich wieder. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
