base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/011.yaml
  text: and from the day that I appointed judges over my people Israel[a]. And I have given you rest from all your enemies. Yahweh also declares to you that Yahweh will make a house for you.
translation:
  language: de
  text: und seit dem Tag, an dem ich Richter über mein Volk Israel eingesetzt habe, habe ich dir Ruhe vor all deinen Feinden verschafft. Und Jahwe kündigt dir an, dass Jahwe dir ein Haus schaffen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Haus“ bezeichnet hier wahrscheinlich Davids Königshaus, also seine Dynastie. Zugleich klingt Davids Wunsch an, für Jahwe ein Haus, den Tempel, zu bauen.
    reason: Die Fußnote erläutert die beabsichtigte Mehrdeutigkeit von בַּיִת, ohne sie im Haupttext aufzulösen.
lexical_decisions:
- source_word: וּלְמִן הַיּוֹם
  choice: und seit dem Tag
  rationale: Die Wendung bezeichnet einen in der Vergangenheit liegenden Ausgangspunkt und führt den vorhergehenden Satz fort. „Seit dem Tag“ gibt diesen zeitlichen Verlauf im Deutschen natürlich wieder.
- source_word: צִוִּיתִי שֹׁפְטִים
  choice: ich Richter … eingesetzt habe
  rationale: צוה bedeutet grundsätzlich „befehlen“, bezeichnet in dieser Verbindung jedoch die Einsetzung beziehungsweise Beauftragung der Richter.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: über mein Volk Israel
  rationale: עַל bezeichnet hier den Bereich, über den die Richter Leitungs- und Rechtsprechungsgewalt ausübten.
- source_word: וַהֲנִיחֹתִי לְךָ מִכָּל אֹיְבֶיךָ
  choice: Ich habe dir Ruhe vor all deinen Feinden verschafft
  rationale: Der Hifil von נוח drückt aus, dass Gott Ruhe beziehungsweise Befreiung gewährt. „Ruhe verschafft“ ist idiomatisch und bewahrt Gottes aktives Handeln.
- source_word: וְהִגִּיד לְךָ יְהוָה
  choice: Auch kündigt dir Jahwe an
  rationale: נגד im Hifil bedeutet „mitteilen, kundtun, ankündigen“. Das Präsens stellt die Ankündigung als gegenwärtigen Sprechakt dar; „auch“ gibt die weiterführende Kraft des וְ wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי בַיִת יַעֲשֶׂה לְּךָ יְהוָה
  choice: dass Jahwe dir ein Haus bauen wird
  rationale: „Ein Haus bauen“ ist im Deutschen natürlich und bewahrt das hebräische Wortspiel zwischen einem Bauwerk und Davids künftigem Herrscherhaus. Die dynastische Bedeutung wird nicht in den Haupttext hineinerklärt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als „Jahwe“ bewahrt den im hebräischen Text verwendeten persönlichen Gottesnamen.
- issue: Bedeutung von בַּיִת in der Verheißung an David
  choice: Haus
  alternative: Dynastie / Königshaus
  rationale: „Haus“ erhält die literarische Spannung zwischen dem von David gewünschten Tempelbau und dem von Gott verheißenen Herrscherhaus. Eine unmittelbare Übersetzung mit „Dynastie“ würde die Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kleingeschriebene Beginn zeigt, dass der Vers syntaktisch an den vorhergehenden Vers anschließt. Die kurzen Hauptsätze folgen der masoretischen Gliederung und bleiben gut verständlich.
