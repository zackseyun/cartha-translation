base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/006.yaml
  text: So David sent word to Joab, “Send Uriah the Hittite to me.” And Joab sent Uriah to David.
translation:
  language: de
  text: 'Da ließ David Joab ausrichten: »Schick Uria, den Hetiter, zu mir.« Und Joab schickte Uria zu David.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל יוֹאָב
  choice: Da ließ David Joab sagen
  rationale: שׁלח bedeutet wörtlich »senden«. Da kein ausdrückliches Objekt genannt wird und unmittelbar der Wortlaut des Befehls folgt, gibt die idiomatische Wendung »ließ … sagen« die Übermittlung der Anweisung natürlich und präzise wieder.
- source_word: שְׁלַח אֵלַי
  choice: Schick … zu mir
  rationale: Der Imperativ von שׁלח und אֵלַי verlangen eine direkte Aufforderung. »Schick … zu mir« ist gegenwärtiges Standarddeutsch und fügt keine im Hebräischen nicht ausgedrückte Rückkehrnuance hinzu.
- source_word: אֶת אוּרִיָּה הַחִתִּי
  choice: Uria, den Hetiter
  rationale: Der Personenname wird in der etablierten deutschen Form »Uria« wiedergegeben; חִתִּי bezeichnet die ethnische Zugehörigkeit und wird standardsprachlich mit »Hetiter« übersetzt. אֶת markiert lediglich das bestimmte direkte Objekt.
- source_word: וַיִּשְׁלַח יוֹאָב אֶת אוּרִיָּה אֶל דָּוִד
  choice: Und Joab schickte Uria zu David
  rationale: Die erneute Verwendung von שׁלח wird mit »schickte« nachvollzogen; »Und« bewahrt den fortlaufenden hebräischen Erzählanschluss.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die direkte Rede bleibt knapp und befehlend; die Wiederholung von »schicken« bildet die Wiederholung des hebräischen Verbs ab.
