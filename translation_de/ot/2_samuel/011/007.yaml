base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/007.yaml
  text: When Uriah came to him[a], David asked about Joab's welfare, the welfare of the troops, and the welfare of the war.
translation:
  language: de
  text: Als Uria zu ihm kam, erkundigte sich David nach dem Wohlergehen Joabs, nach dem Wohlergehen des Heeres und nach dem Verlauf des Krieges.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: בוא bezeichnet hier das Kommen zu David; „kam“ gibt die schlichte Erzählbewegung natürlich wieder.
- source_word: אוּרִיָּה
  choice: Uria
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition als „Uria“ wiedergegeben.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: אֶל mit Pronominalsuffix bezeichnet die Bewegung auf David zu; „zu ihm“ bewahrt diesen einfachen Bezug.
- source_word: וַיִּשְׁאַל
  choice: erkundigte sich
  rationale: שׁאל leitet hier Davids Nachfrage nach der Lage ein. „Erkundigte sich nach“ ist im Deutschen idiomatisch und passt zur folgenden Konstruktion.
- source_word: לִשְׁלוֹם יוֹאָב
  choice: nach dem Wohlergehen Joabs
  rationale: שָׁלוֹם bezeichnet in dieser Verbindung den Zustand beziehungsweise das Wohlergehen. Die Wiedergabe bleibt nahe an der hebräischen Formulierung.
- source_word: הָעָם
  choice: das Heer
  rationale: עָם bedeutet häufig „Volk“, bezeichnet im militärischen Kontext aber die unter Joab stehende Streitmacht. „Heer“ macht den kontextuellen Bezug klar.
- source_word: לִשְׁלוֹם הַמִּלְחָמָה
  choice: nach dem Verlauf des Krieges
  rationale: Die wörtliche Verbindung „Wohlergehen des Krieges“ ist im Deutschen unverständlich. Gemeint ist, wie sich der Krieg beziehungsweise Feldzug entwickelt; „Verlauf“ gibt diesen Sinn natürlich wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die dreigliedrige Struktur der Nachfrage bleibt durch die wiederholte Präposition „nach“ erkennbar; beim letzten Glied wird die hebräische Wendung idiomatisch als „Verlauf des Krieges“ wiedergegeben.
