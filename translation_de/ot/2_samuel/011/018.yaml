  text: וַ/יִּשְׁלַ֖ח יוֹאָ֑ב וַ/יַּגֵּ֣ד לְ/דָוִ֔ד אֶת כָּל דִּבְרֵ֖י הַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/018.yaml
  text: Then Joab sent word and told David all the news of the battle[a].
translation:
  language: de
  text: Da sandte Joab David eine Nachricht und berichtete ihm alles über den Kampf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Einzelheiten des Kampfes“. Wörtlich steht im Hebräischen „alle Worte/Angelegenheiten des Kampfes“, eine Wendung für den vollständigen Bericht über das Kampfgeschehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte … eine Nachricht
  rationale: שׁלח bedeutet wörtlich „senden“. Zusammen mit dem folgenden Verb des Berichtens bezeichnet es hier idiomatisch das Übermitteln einer Nachricht; die deutsche Formulierung ist natürlich, ohne einen im Hebräischen nicht genannten Boten einzuführen.
- source_word: יוֹאָב
  choice: Joab
  rationale: Im Deutschen übliche Form des Personennamens.
- source_word: וַיַּגֵּד
  choice: berichtete
  rationale: נגד im Hifil bedeutet „mitteilen, berichten, kundtun“. „Berichtete“ passt zum militärischen Zusammenhang und gibt den Vorgang klar wieder.
- source_word: לְדָוִד
  choice: David … ihm
  rationale: Die Präposition לְ kennzeichnet den Empfänger. Im Deutschen wird David bereits beim Senden als Empfänger genannt und anschließend natürlich durch „ihm“ wieder aufgenommen.
- source_word: אֵת כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: alles über den Kampf
  rationale: דִּבְרֵי bedeutet wörtlich „Worte“ oder „Angelegenheiten“, bezeichnet hier aber den gesamten Inhalt beziehungsweise alle Einzelheiten des Kampfberichts. „Alles über den Kampf“ ist verständlich und bewahrt den umfassenden Sinn von כָּל.
- source_word: הַמִּלְחָמָה
  choice: den Kampf
  rationale: מִלְחָמָה kann „Krieg“ oder „Kampf/Schlacht“ bedeuten. Der unmittelbare Kontext handelt von einem bestimmten militärischen Gefecht, daher ist „Kampf“ hier passend.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da“ führt die Erzählung knapp fort; die beiden hebräischen Verben für Senden und Berichten bleiben erkennbar, werden jedoch idiomatisch verbunden.
