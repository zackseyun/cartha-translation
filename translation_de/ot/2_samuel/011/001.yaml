  text: וַ/יְהִי֩ לִ/תְשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מַּלְאֿכִ֗ים וַ/יִּשְׁלַ֣ח דָּוִ֡ד אֶת יוֹאָב֩ וְ/אֶת עֲבָדָ֨י/ו עִמּ֜/וֹ וְ/אֶת כָּל יִשְׂרָאֵ֗ל וַ/יַּשְׁחִ֨תוּ֙ אֶת בְּנֵ֣י עַמּ֔וֹן וַ/יָּצֻ֖רוּ עַל רַבָּ֑ה וְ/דָוִ֖ד יוֹשֵׁ֥ב בִּ/ירוּשָׁלִָֽם׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/001.yaml
  text: At the turn of the year[a], at the time when kings go out to battle, David sent Joab, his servants with him, and all Israel. They devastated the Ammonites and besieged Rabbah[b], but David remained in Jerusalem.
translation:
  language: de
  text: Als das Jahr sich wieder wendete,[a] zu der Zeit, in der die Könige ins Feld ziehen,[b] sandte David Joab aus, zusammen mit seinen Dienern und ganz Israel. Sie richteten unter den Ammonitern Verwüstungen an und belagerten Rabba. David aber blieb in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bei der Wiederkehr/Wende des Jahres“; wahrscheinlich ist die Feldzugssaison im Frühjahr gemeint.'
    reason: cultural_note
  - marker: b
    text: Die hier überlieferte Schreibung kann auch „wenn die Boten ausziehen“ gelesen werden. Der militärische Zusammenhang und die Parallele in 1. Chronik 20,1 stützen die Lesart „wenn die Könige ins Feld ziehen“.
    reason: alternative_reading
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: Als das Jahr sich gewendet hatte
  rationale: Die Wendung bewahrt das hebräische Bild vom Wenden beziehungsweise Wiederkehren des Jahres. Gemeint ist wahrscheinlich der Beginn der Feldzugssaison im Frühjahr, ohne dass die Jahreszeit im Haupttext ausdrücklich festgelegt wird.
- source_word: לְעֵת צֵאת הַמַּלְאכִים
  choice: zu der Zeit, in der die Könige ins Feld ziehen
  rationale: Der militärische Zusammenhang und die Parallele in 1. Chronik 20,1 stützen die traditionelle Lesart „Könige“. „Ins Feld ziehen“ gibt den im Kontext vorausgesetzten Zweck idiomatisch wieder. Die masoretisch überlieferte Form kann jedoch „Boten“ bedeuten; diese echte Textfrage wird in einer Fußnote bewahrt.
- source_word: וַיִּשְׁלַח
  choice: sandte … aus
  rationale: „Aussenden“ ist im militärischen Zusammenhang natürlich und entspricht dem hebräischen שלח, ohne Davids eigene Teilnahme anzudeuten.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: Die Grundbedeutung „Diener“ beziehungsweise „Bedienstete“ bleibt erhalten; eine engere Festlegung auf Offiziere oder Soldaten wäre interpretierend.
- source_word: כָּל יִשְׂרָאֵל
  choice: dem ganzen Heer Israels
  rationale: Wörtlich steht „ganz Israel“. Im Feldzugskontext bezeichnet die Wendung die aufgebotene Streitmacht; „das ganze Heer Israels“ macht diesen kontextuellen Sinn im Deutschen verständlich.
- source_word: וַיַּשְׁחִתוּ אֶת בְּנֵי עַמּוֹן
  choice: Sie verwüsteten das Gebiet der Ammoniter
  rationale: Der Hifil von שׁחת bezeichnet hier verheerendes, zerstörerisches Vorgehen. Da unmittelbar danach die Belagerung folgt, vermeidet „verwüsteten“ die unzutreffende Aussage einer vollständigen Vernichtung. „Ammoniter“ ist die natürliche deutsche Wiedergabe von „Söhne Ammons“; „das Gebiet“ verdeutlicht den im Feldzugskontext gemeinten Gegenstand der Verheerung.
- source_word: וַיָּצֻרוּ עַל רַבָּה
  choice: belagerten Rabba
  rationale: צור mit על bezeichnet das Einschließen beziehungsweise Belagern einer Stadt. „Rabba“ ist die übliche deutsche Form des Ortsnamens.
- source_word: וְדָוִד יוֹשֵׁב בִּירוּשָׁלִָם
  choice: David aber blieb in Jerusalem
  rationale: Das Partizip יוֹשֵׁב bedeutet wörtlich „saß“ oder „wohnte“. Im erzählerischen Gegensatz zum ausziehenden Heer drückt es aus, dass David in Jerusalem blieb; „aber“ bildet diesen Kontrast natürlich ab.
theological_decisions:
- issue: Lesart der Feldzugssaison in לְעֵת צֵאת הַמַּלְאכִים
  choice: in der die Könige ins Feld ziehen
  alternative: in der die Boten ausziehen
  rationale: Der unmittelbare militärische Zusammenhang und 1. Chronik 20,1 sprechen stark für „Könige“ und heben den erzählerischen Kontrast hervor, dass David selbst zurückblieb. Weil die masoretische Form in 2. Samuel „Boten“ gelesen werden kann, wird die Alternative nicht verschwiegen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die hebräische Zeitangabe bleibt bildhaft, während militärische Wendungen idiomatisch wiedergegeben werden. Der Kontrast zwischen dem ausziehenden Heer und dem in Jerusalem bleibenden David wird durch „aber“ hervorgehoben, ohne sein Verhalten im Vers bereits ausdrücklich zu bewerten.
