  text: וַ/תִּשְׁמַע֙ אֵ֣שֶׁת אֽוּרִיָּ֔ה כִּי מֵ֖ת אוּרִיָּ֣ה אִישָׁ֑/הּ וַ/תִּסְפֹּ֖ד עַל בַּעְלָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/026.yaml
  text: When Uriah’s wife heard that Uriah her husband was dead[a], she mourned for her husband.
translation:
  language: de
  text: Als Urias Frau hörte, dass ihr Mann Uria tot war[a], trauerte sie um ihren Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ihr Mann Uria gestorben war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: hörte
  rationale: Das qal von שׁמע bedeutet hier gewöhnlich „hören“. Im Erzählzusammenhang ist „hörte“ natürlich und weniger interpretierend als „erfuhr“.
- source_word: אֵשֶׁת אוּרִיָּה
  choice: Urias Frau
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen idiomatisch als Genitivverbindung wiedergegeben.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was die Frau hörte.
- source_word: מֵת
  choice: tot war
  rationale: Die Form bezeichnet den eingetretenen Todeszustand. Nach „hörte, dass“ gibt „tot war“ diesen unmittelbar wieder; „gestorben war“ ist ebenfalls möglich.
- source_word: אוּרִיָּה אִישָׁהּ
  choice: ihr Mann Uria
  rationale: Die Apposition identifiziert Uria ausdrücklich als ihren Mann. Diese Wortfolge ist im modernen Deutschen natürlich und bewahrt beide Angaben.
- source_word: וַתִּסְפֹּד
  choice: hielt sie die Totenklage
  rationale: ספד bezeichnet die rituelle oder ausdrücklich vollzogene Klage um einen Verstorbenen. „Die Totenklage halten“ ist präziser als das allgemeinere „trauern“.
- source_word: עַל
  choice: um
  rationale: Mit „die Totenklage halten“ gibt „um“ die auf den Verstorbenen gerichtete Klage idiomatisch wieder.
- source_word: בַּעְלָהּ
  choice: ihren Mann
  rationale: בַּעַל bedeutet im ehelichen Zusammenhang eindeutig „Ehemann/Mann“; hier ist „ihren Mann“ natürlich und ohne unnötig hierarchische Nebenbedeutung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hielt die Totenklage“ bewahrt den spezifischen Sinn des hebräischen Trauerverbs, ohne altertümlich zu wirken.
