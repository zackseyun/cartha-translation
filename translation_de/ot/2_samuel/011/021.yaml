  text: מִֽי הִכָּ֞ה אֶת אֲבִימֶ֣לֶךְ בֶּן יְרֻבֶּ֗שֶׁת הֲ/לֽוֹא אִשָּׁ֡ה הִשְׁלִ֣יכָה עָלָי/ו֩ פֶּ֨לַח רֶ֜כֶב מֵ/עַ֤ל הַֽ/חוֹמָה֙ וַ/יָּ֣מָת בְּ/תֵבֵ֔ץ לָ֥/מָּה נִגַּשְׁתֶּ֖ם אֶל הַֽ/חוֹמָ֑ה וְ/אָ֣מַרְתָּ֔ גַּ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/021.yaml
  text: Who struck down Abimelech son of Jerubbesheth? Was it not a woman who threw an upper millstone on him from the wall[a], so that he died at Thebez? Why did you go near the wall?’ Then you shall say[c][b], ‘Your servant Uriah the Hittite is dead also.’
translation:
  language: de
  text: '„Wer erschlug Abimelech, den Sohn Jerubbeschets[a]? War es nicht eine Frau, die von der Mauer einen Läuferstein auf ihn warf[b], sodass er in Tebez starb[c]? Warum seid ihr an die Mauer herangerückt?“ Dann sollst du sagen: ‚Auch dein Diener Uria, der Hetiter, ist tot.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Jerubbeschet“; in Richter 9,1 steht die Namensform „Jerubbaal“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ein Bruchstück eines Mühlsteins“; wahrscheinlich ist der obere, bewegliche Stein einer Handmühle gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Siehe Richter 9,53 zu dem hier erwähnten Geschehen.
    reason: cross_reference
lexical_decisions:
- source_word: הִכָּה
  choice: erschlug
  rationale: Das Verb bezeichnet hier einen tödlichen Schlag. „Erschlug“ bewahrt sowohl die konkrete Bedeutung des Schlagens als auch den tödlichen Ausgang.
- source_word: אֲבִימֶלֶךְ בֶּן־יְרֻבֶּשֶׁת
  choice: Abimelech, den Sohn Jerubbeschets
  rationale: Die Übersetzung folgt der Namensform des masoretischen Textes und gleicht sie nicht stillschweigend an Richter 9 an.
- source_word: הֲלוֹא
  choice: War es nicht
  rationale: Die verneinte Frage erwartet Zustimmung und behält so ihre rhetorische, vorwurfsvolle Kraft.
- source_word: פֶּלַח רֶכֶב
  choice: einen Läuferstein
  rationale: רֶכֶב bezeichnet wahrscheinlich den oberen, beweglichen Stein einer Handmühle. „Läuferstein“ ist sachlich präzise; die mögliche Deutung als Bruchstück wird in der Fußnote bewahrt.
- source_word: מֵעַל הַחוֹמָה
  choice: von der Mauer
  rationale: Die Formulierung gibt die Bewegung von der erhöhten Position auf der Mauer natürlich wieder.
- source_word: וַיָּמָת בְּתֵבֵץ
  choice: sodass er in Tebez starb
  rationale: „Sodass“ macht den im Zusammenhang klaren tödlichen Ausgang des Wurfs deutlich; בְּ wird beim Ortsnamen natürlich mit „in“ wiedergegeben.
- source_word: לָמָּה נִגַּשְׁתֶּם אֶל־הַחוֹמָה
  choice: Warum seid ihr an die Mauer herangerückt?
  rationale: „Heranrücken“ passt zum militärischen Zusammenhang und gibt das Annähern wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „so nah“ einzufügen.
- source_word: וְאָמַרְתָּ
  choice: Dann sollst du sagen
  rationale: Die Übersetzung verdeutlicht die zeitliche Folge und den Anweisungscharakter gegenüber dem Boten.
- source_word: גַּם עַבְדְּךָ אוּרִיָּה הַחִתִּי מֵת
  choice: Auch dein Diener Uria, der Hetiter, ist tot
  rationale: „Auch“ erhält die additive Kraft von גַּם; „Diener“ entspricht der höfischen Selbst- beziehungsweise Unterordnungsbezeichnung im königlichen Umfeld.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorischen Fragen und der militärische Ton bleiben erhalten. Die ungewöhnliche Namensform des hebräischen Textes wird nicht harmonisiert; die sachliche Unsicherheit bei der Bezeichnung des Mühlsteins wird in einer Fußnote offengelegt.
