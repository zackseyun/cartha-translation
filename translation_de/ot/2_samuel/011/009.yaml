base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/009.yaml
  text: But Uriah slept at the entrance of the king’s house with all the servants of his lord[d][c][b][a], and did not go down to his house.
translation:
  language: de
  text: Doch Urija schlief[a] am Eingang des Hauses des Königs[b] bei allen Dienern seines Herrn[c] und ging nicht hinunter in sein Haus[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »legte sich nieder« beziehungsweise »verbrachte die Nacht«. Das hebräische Verb kann sowohl das Hinlegen als auch das Schlafen bezeichnen; hier geht es darum, dass Urija dort über Nacht blieb.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »des Palastes«. Wörtlich: »des Hauses des Königs«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »seines Gebieters«. Gemeint ist David als Urijas Vorgesetzter.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »ging nicht nach Hause«. Wörtlich: »ging nicht hinunter in sein Haus«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: schlief
  rationale: Das Verb שׁכב kann »sich hinlegen« oder »schlafen« bedeuten. Im Zusammenhang berichtet es, dass Urija dort über Nacht blieb; »schlief« gibt dies knapp und natürlich wieder, ohne die lexikalische Alternative zu verschweigen.
- source_word: פֶּתַח
  choice: am Eingang
  rationale: פֶּתַח bezeichnet eine Öffnung, einen Eingang oder einen Türbereich. »Am Eingang« wahrt die räumliche Aussage, ohne eine bestimmte Tür als Gegenstand vorauszusetzen.
- source_word: בֵּית הַמֶּלֶךְ
  choice: des Königshauses
  rationale: Die Wendung bedeutet wörtlich »Haus des Königs«. »Königshaus« bleibt bildnah und ist im Zusammenhang als königlicher Wohn- und Amtssitz verständlich.
- source_word: אֵת כָּל עַבְדֵי אֲדֹנָיו
  choice: bei allen Dienern seines Herrn
  rationale: אֵת drückt hier die Gemeinschaft beziehungsweise den Aufenthaltsort bei den Dienern aus. »Bei« klingt im Deutschen räumlich natürlich. עֲבָדִים wird hier mit »Diener« wiedergegeben, da ihr rechtlicher Status nicht im Mittelpunkt steht.
- source_word: אֲדֹנָיו
  choice: seines Herrn
  rationale: אָדוֹן bezeichnet einen Herrn oder Gebieter. Gemeint ist David als Urijas Vorgesetzter; die Formulierung erhält das soziale Rangverhältnis, ohne einen Gottesnamen anzudeuten.
- source_word: וְלֹא יָרַד אֶל בֵּיתוֹ
  choice: und ging nicht hinunter in sein Haus
  rationale: יָרַד bedeutet »hinabgehen«. Die Wiedergabe bewahrt sowohl die Richtungsangabe als auch das konkrete בֵּיתוֹ (»sein Haus«), obwohl idiomatisches Deutsch auch »ging nicht nach Hause« zuließe.
