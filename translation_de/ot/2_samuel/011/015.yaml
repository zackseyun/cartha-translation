  text: וַ/יִּכְתֹּ֥ב בַּ/סֵּ֖פֶר לֵ/אמֹ֑ר הָב֣וּ אֶת אֽוּרִיָּ֗ה אֶל מוּל֙ פְּנֵ֤י הַ/מִּלְחָמָה֙ הַֽ/חֲזָקָ֔ה וְ/שַׁבְתֶּ֥ם מֵ/אַחֲרָ֖י/ו וְ/נִכָּ֥ה וָ/מֵֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/015.yaml
  text: He wrote in the letter[a], saying, "Set Uriah at the front of the hardest fighting, then withdraw from behind him so that he may be struck down and die."
translation:
  language: de
  text: 'Er schrieb in dem Brief: „Stellt Uria an die Front, wo der Kampf am heftigsten ist,[a] und zieht euch dann von ihm zurück, damit er getroffen wird und stirbt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an die Front des heftigsten Kampfes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Er schrieb
  rationale: Das Wayyiqtol führt die Erzählung mit einer aufeinanderfolgenden Handlung in der Vergangenheit fort; im natürlichen Deutschen muss das einleitende ו nicht eigens mit „und“ wiedergegeben werden.
- source_word: בַּסֵּפֶר
  choice: in dem Brief
  rationale: סֵפֶר bezeichnet hier die schriftliche Nachricht, die David durch Uria übermitteln ließ; im Kontext ist „Brief“ treffender als das allgemeinere „Buch“ oder „Schriftstück“.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Der quotative Infinitiv leitet den Wortlaut des Briefes ein. Im modernen Deutschen übernimmt ein Doppelpunkt diese Funktion natürlicher als „indem er sagte“.
- source_word: הָבוּ אֶת אוּרִיָּה
  choice: Stellt Uria
  rationale: Der Imperativ Plural weist mehreren Angesprochenen die Aufgabe zu, Uria an einer bestimmten Stelle im Kampf einzusetzen. Der direkte Objektmarker אֶת bleibt unübersetzt.
- source_word: אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה
  choice: an die Front, wo der Kampf am heftigsten ist
  rationale: Die idiomatische Wendung bezeichnet eine unmittelbar ausgesetzte Stellung im Bereich der schwersten Kampfhandlungen. Die Wiedergabe ist militärisch klar und zugleich natürlich verständlich.
- source_word: וְשַׁבְתֶּם מֵאַחֲרָיו
  choice: und zieht euch dann hinter ihm zurück
  rationale: שׁוּב bedeutet hier taktisch „sich zurückziehen“. „Hinter ihm“ bewahrt die räumliche Vorstellung und macht deutlich, dass seine Unterstützung abgezogen werden soll.
- source_word: וְנִכָּה
  choice: damit er getroffen wird
  rationale: Der Nifal von נכה bezeichnet, dass Uria einen Schlag beziehungsweise eine tödliche Verwundung erleidet. „Getroffen wird“ hält diesen Vorgang vom folgenden ausdrücklichen Sterben getrennt.
- source_word: וָמֵת
  choice: und stirbt
  rationale: Das eigenständige Verb wird beibehalten, damit die tödliche Absicht des Befehls und die hebräische Abfolge nicht in „getötet wird“ zusammengezogen werden.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt knapp und befehlend; die beiden Verben „getroffen wird und stirbt“ werden entsprechend dem Hebräischen getrennt wiedergegeben.
