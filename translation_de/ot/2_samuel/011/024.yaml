base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/024.yaml
  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
translation:
  language: de
  text: Die Bogenschützen schossen von der Mauer aus auf deine Knechte, und einige der Knechte des Königs kamen ums Leben[a]. Auch dein Knecht Uria, der Hetiter, ist tot[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Knechte des Königs kamen ums Leben“. Die hebräische Präposition kann hier partitativ („einige der“) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „starb“. Das Hebräische kann hier sowohl den eingetretenen Tod als auch den daraus folgenden Zustand hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ הַמּוֹרִים
  choice: Die Bogenschützen schossen
  rationale: Die Verbindung aus ירה („schießen“) und dem substantivisch gebrauchten Partizip bezeichnet hier idiomatisch Bogenschützen; die Wiedergabe erhält zugleich die Wiederholung von Täter und Handlung.
- source_word: אֶל עֲבָדֶיךָ
  choice: auf deine Knechte
  rationale: Bei „schießen“ ist „auf“ im Deutschen die natürliche Entsprechung für אֶל. „Knechte“ bewahrt die höfische Unterordnungssprache des Berichts besser als „Männer“.
- source_word: מֵעַל הַחוֹמָה
  choice: von oben von der Mauer
  rationale: מֵעַל bezeichnet den erhöhten Ausgangspunkt des Beschusses. Die Formulierung macht deutlich, dass die Schützen von der Mauer herab schossen.
- source_word: וַיָּמֻתוּ מֵעַבְדֵי הַמֶּלֶךְ
  choice: und einige von den Knechten des Königs kamen ums Leben
  rationale: 'Das מִן vor „Knechte des Königs“ lässt sich partitativ verstehen: Nicht alle, sondern ein Teil von ihnen starb. „Kamen ums Leben“ ist in einem militärischen Bericht natürlich und vermeidet die unmittelbare Wiederholung von „tot“.'
- source_word: וְגַם
  choice: Auch
  rationale: „Auch“ gibt die additive und zugleich steigernde Funktion wieder, mit der Urias Tod als weiterer, entscheidender Verlust genannt wird.
- source_word: עַבְדְּךָ אוּרִיָּה הַחִתִּי
  choice: dein Knecht Uria, der Hetiter
  rationale: „Dein Knecht“ wahrt die ehrerbietige Hofsprache; „Uria“ und „Hetiter“ entsprechen den im modernen Deutschen üblichen biblischen Namensformen.
- source_word: מֵת
  choice: ist tot
  rationale: Die hebräische Zustandsform bezeichnet unmittelbar Urias gegenwärtigen Zustand. „Ist tot“ bewahrt diese Form deutlicher als das ebenfalls mögliche erzählende „starb“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener höfischer Hofsprache. „Knecht“ wird wegen der wiederholten Anrede an den König beibehalten; Satzteilung hebt die berichtete Nachricht von Urias Tod hervor.
