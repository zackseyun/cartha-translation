  text: And he commanded the messenger[a], saying, “When you have finished telling the king all the news of the battle,”
translation:
  language: de
  text: 'Und er befahl dem Boten: „Wenn du dem König den ganzen Bericht über die Schlacht[a] erstattet hast,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle Worte/Angelegenheiten der Schlacht“, das heißt den vollständigen Bericht über die Schlacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Und er befahl
  rationale: צוה bezeichnet hier ein verbindliches Anweisen; „befahl“ bewahrt die autoritative Kraft und passt zum erzählenden Kontext.
- source_word: הַמַּלְאָךְ
  choice: dem Boten
  rationale: מַלְאָךְ bezeichnet in diesem militärischen Berichtszusammenhang eindeutig einen menschlichen Überbringer, nicht einen Engel.
- source_word: לֵאמֹר
  choice: Einführung direkter Rede durch Doppelpunkt
  rationale: Das formelhafte לֵאמֹר führt direkte Rede ein. Im natürlichen modernen Deutsch übernimmt der Doppelpunkt diese Funktion, ohne das schwerfällige „indem er sagte“.
- source_word: כְּכַלּוֹתְךָ
  choice: Wenn du … zu Ende erzählt hast
  rationale: Die Konstruktion aus כ und Infinitivus constructus mit Suffix bildet einen Temporalsatz; „wenn … zu Ende … hast“ gibt den Abschluss der Handlung wieder, ohne besondere Unmittelbarkeit hinzuzufügen.
- source_word: כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: den ganzen Bericht über die Schlacht
  rationale: דְּבָרִים kann Worte, Dinge, Angelegenheiten oder berichtete Vorgänge bezeichnen. Im Kontext eines militärischen Lageberichts ist „der ganze Bericht über die Schlacht“ idiomatisch und bewahrt den umfassenden Sinn von כָּל.
- source_word: לְדַבֵּר אֶל הַמֶּלֶךְ
  choice: dem König … erzählt
  rationale: Wörtlich steht „zum König zu reden“; zusammen mit den berichteten Vorgängen bezeichnet die Wendung hier das Übermitteln des vollständigen Schlachtberichts.
