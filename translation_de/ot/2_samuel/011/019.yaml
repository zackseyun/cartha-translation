    issue: „den ganzen Bericht … zu Ende erzählt hast“ ist stilistisch leicht unelegant.
    rationale: Das Verb „erzählen“ passt eher zu einer Erzählung als zu einem offiziellen militärischen Bericht. „Bericht erstatten“ ist natürlich, registergerecht und gibt die kommunikative Funktion von לְדַבֵּר אֶל־הַמֶּלֶךְ genauer wieder.
