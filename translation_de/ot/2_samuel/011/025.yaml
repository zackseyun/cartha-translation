source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל הַ/מַּלְאָ֗ךְ כֹּֽה תֹאמַ֤ר אֶל יוֹאָב֙ אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּֽי כָ/זֹ֥ה וְ/כָ/זֶ֖ה תֹּאכַ֣ל הֶ/חָ֑רֶב הַחֲזֵ֨ק מִלְחַמְתְּ/ךָ֧ אֶל הָ/עִ֛יר וְ/הָרְסָ֖/הּ וְ/חַזְּקֵֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/025.yaml
  text: Then David said to the messenger[a], “Thus you shall say to Joab, ‘Do not let this matter be evil in your eyes, for the sword devours one as well as another[c][b]. Strengthen your attack against the city and overthrow it.’ And encourage him.”
translation:
  language: de
  text: 'Da sagte David zu dem Boten: »So sollst du zu Joab sagen: ›Lass dir diese Sache nicht missfallen[a], denn das Schwert frisst bald diesen, bald jenen[b]. Verstärke deinen Kampf gegen die Stadt und reiße sie nieder.‹ Und sprich ihm Mut zu[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Diese Sache soll nicht böse in deinen Augen sein.«'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräische Redewendung: »Denn so und so frisst das Schwert.« Gemeint ist, dass das Schwert den einen wie den anderen tötet.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Und stärke ihn.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: der Bote
  rationale: Im Erzählzusammenhang bezeichnet das Wort einen menschlichen Überbringer der Nachricht, nicht ein himmlisches Wesen.
- source_word: כֹּה תֹאמַר
  choice: So sollst du ... sagen
  rationale: Bewahrt die Botenformel in natürlichem, gegenwärtigem Deutsch.
- source_word: אַל יֵרַע בְּעֵינֶיךָ אֶת הַדָּבָר הַזֶּה
  choice: Nimm dir diese Sache nicht zu Herzen
  rationale: Gibt die Funktion der hebräischen Wendung idiomatisch wieder, ohne Davids beschwichtigenden Ton abzuschwächen; die bildhafte Form steht in der Fußnote.
- source_word: כִּי כָזֹה וְכָזֶה תֹּאכַל הֶחָרֶב
  choice: denn das Schwert frisst bald diesen, bald jenen
  rationale: Erhält die eindringliche Metapher des fressenden Schwertes und gibt כָזֹה וְכָזֶה als wechselnde, unterschiedslos getroffene Personen wieder.
- source_word: הַחֲזֵק מִלְחַמְתְּךָ אֶל הָעִיר
  choice: Verstärke deinen Kampf gegen die Stadt
  rationale: Gibt den kausativen Imperativ von חזק und מִלְחָמָה formal nah wieder; gemeint ist die Intensivierung des Angriffs.
- source_word: וְהָרְסָהּ
  choice: und reiße sie nieder
  rationale: Das Verb bezeichnet das Niederreißen beziehungsweise Zerstören; das feminine Suffix bezieht sich auf die Stadt.
- source_word: וְחַזְּקֵהוּ
  choice: Und sprich ihm Mut zu
  rationale: Das maskuline Suffix verweist am natürlichsten auf Joab. Im zwischenmenschlichen Zusammenhang bedeutet חזק, ihn zu stärken oder zu ermutigen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Davids beschwichtigender Ton bleibt erhalten, ebenso die drastische Metapher vom fressenden Schwert. Die direkte Rede ist so gegliedert, dass »Und sprich ihm Mut zu« als Davids Anweisung an den Boten erkennbar bleibt.
