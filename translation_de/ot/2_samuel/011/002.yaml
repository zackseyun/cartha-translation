base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/002.yaml
  text: Then at evening time David arose from his bed and walked on the roof of the king’s house[a], and from the roof he saw a woman bathing[b]; and the woman was very beautiful in appearance.
translation:
  language: de
  text: Als es Abend wurde, stand David von seinem Bett auf und ging auf dem Dach des Königspalasts umher. Vom Dach aus sah er eine Frau, die sich wusch[b]. Die Frau war sehr schön anzusehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „die badete“. Das hebräische Wort kann Waschen oder Baden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְעֵת הָעֶרֶב
  choice: Als es Abend wurde
  rationale: Die zeitliche Szeneneinleitung wird in natürlichem Deutsch wiedergegeben; sie bewahrt sowohl den Eintritt des Abends als auch den Erzählfortgang.
- source_word: וַיָּקָם ... מֵעַל מִשְׁכָּבוֹ
  choice: stand David von seinem Lager auf
  rationale: מִשְׁכָּב bezeichnet eine Liegestatt oder einen Ort des Liegens. „Lager“ bleibt weiter als „Bett“ und passt zum würdigen Erzählregister.
- source_word: וַיִּתְהַלֵּךְ
  choice: ging ... umher
  rationale: Der Hitpael kann eine andauernde oder wiederholte Bewegung bezeichnen. „ging umher“ gibt dies knapp und idiomatisch wieder, ohne Davids Haltung als gemütliches Schlendern zu deuten.
- source_word: עַל גַּג בֵּית הַמֶּלֶךְ
  choice: auf dem Dach des Königshauses
  rationale: Dies folgt dem hebräischen Ausdruck „Haus des Königs“ eng. „Palast“ wäre kontextuell möglich, ist aber stärker deutend.
- source_word: וַיַּרְא אִשָּׁה רֹחֶצֶת
  choice: sah er eine Frau, die sich wusch
  rationale: Das Partizip bezeichnet die Frau während des Waschens. „sich wusch“ ist natürliches Deutsch und lässt offen, ob ein vollständiges Bad gemeint ist.
- source_word: מֵעַל הַגָּג
  choice: Vom Dach aus
  rationale: Die Formulierung kennzeichnet Davids Aussichtspunkt und erhält die räumliche Angabe ausdrücklich.
- source_word: טוֹבַת מַרְאֶה מְאֹד
  choice: von sehr schöner Gestalt
  rationale: Die Wendung beschreibt eine für den Anblick sehr schöne Erscheinung. „Gestalt“ wahrt den visuellen Bezug, ohne ihn auf einzelne Körpermerkmale einzuengen.
