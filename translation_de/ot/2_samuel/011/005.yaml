  text: The woman conceived[a], and she sent word and told David[b], “I am pregnant.”
translation:
  language: de
  text: 'Die Frau wurde schwanger[a]. Sie sandte zu David und ließ ihm ausrichten[b]: »Ich bin schwanger.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Frau empfing.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen: »sie sandte und teilte David mit«; das Objekt des Sendens wird nicht genannt. Gemeint ist eine an David übermittelte Nachricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: wurde schwanger
  rationale: Das Verb הרה bezeichnet das Schwangerwerden beziehungsweise Empfangen. »Wurde schwanger« gibt den ereignishaften Sinn im modernen Deutsch natürlich und unmittelbar wieder.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: אִשָּׁה kann je nach Zusammenhang »Frau« oder »Ehefrau« bedeuten. Hier wird auf Batseba zurückverwiesen, ohne ihre eheliche Beziehung in diesem Satz ausdrücklich hervorzuheben; daher entspricht »die Frau« dem Wortlaut am unmittelbarsten.
- source_word: וַתִּשְׁלַח
  choice: schickte ... eine Nachricht
  rationale: שׁלח bedeutet wörtlich »senden/schicken«. Zusammen mit dem folgenden Mitteilungsverb ist hier das Senden einer Nachricht gemeint; die Ergänzung macht diesen im Hebräischen impliziten Sinn im Deutschen verständlich.
- source_word: וַתַּגֵּד
  choice: ließ ihm sagen
  rationale: נגד im Hifil bedeutet »mitteilen, berichten, sagen«. Nach »schickte ... eine Nachricht« bildet »ließ ihm sagen« eine natürliche deutsche Verbindung und wahrt, dass die Mitteilung offenbar über einen Boten erfolgte.
- source_word: לְדָוִד
  choice: David
  rationale: Die Präposition לְ bezeichnet hier den Empfänger der Nachricht; der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: הָרָה אָנֹכִי
  choice: Ich bin schwanger
  rationale: Das prädikative הָרָה mit dem ausdrücklichen Pronomen אָנֹכִי bezeichnet den gegenwärtigen Zustand. »Ich bin schwanger« ist die direkte und natürliche deutsche Wiedergabe.
