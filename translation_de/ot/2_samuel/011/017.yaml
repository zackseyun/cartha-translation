base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/017.yaml
  text: The men of the city came out and fought against Joab[a], and some of the people among David’s servants fell[b]; Uriah the Hittite also died.
translation:
  language: de
  text: Die Männer der Stadt zogen aus[a] und kämpften gegen Joab. Dabei fielen einige von Davids Dienern[b]; auch Uria, der Hetiter, starb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kamen heraus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus dem Volk, von Davids Dienern“; die partitive Formulierung besagt, dass einige von Davids Dienern fielen. Im militärischen Zusammenhang sind Davids Gefolgsleute gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: zogen aus
  rationale: יצא bezeichnet das Hinausgehen beziehungsweise Ausrücken. „Zogen aus“ ist im militärischen Erzählzusammenhang natürlich und bewahrt die räumliche Perspektive, ohne sie unnötig festzulegen.
- source_word: אַנְשֵׁי הָעִיר
  choice: die Männer der Stadt
  rationale: Die Konstruktverbindung bedeutet wörtlich „Männer der Stadt“; im Zusammenhang sind männliche Kämpfer gemeint.
- source_word: וַיִּלָּחֲמוּ אֶת יוֹאָב
  choice: kämpften gegen Joab
  rationale: Die Wendung bezeichnet hier einen feindlichen Kampf gegen Joab und die von ihm geführten Truppen.
- source_word: וַיִּפֹּל
  choice: fielen
  rationale: „Fielen“ bewahrt die hebräische militärische Ausdrucksweise für im Kampf Getötete.
- source_word: מִן הָעָם מֵעַבְדֵי דָוִד
  choice: einige aus dem Volk, nämlich von Davids Dienern
  rationale: Die beiden mit מן gebildeten Angaben sind partitiv; die zweite präzisiert, dass die Gefallenen zu Davids Dienern gehörten. „Nämlich“ macht diese Beziehung im Deutschen verständlich, ohne die doppelte Formulierung zu tilgen.
- source_word: וַיָּמָת גַּם אוּרִיָּה הַחִתִּי
  choice: auch Uria, der Hetiter, starb
  rationale: „Auch“ gibt גם wieder und hebt hervor, dass Uria zu den Toten gehörte. „Hetiter“ ist die etablierte deutsche Volksbezeichnung.
