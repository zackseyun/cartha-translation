  source_fidelity: Die Übersetzung trifft den Handlungsablauf und die militärische Bedeutung der hebräischen Verben. Die Wendung „einige aus dem Volk, nämlich von Davids Dienern“ gibt jedoch die beiden partitivischen Präpositionalgruppen unnötig schwerfällig und mit einer im Deutschen missverständlichen erklärenden Apposition wieder.
