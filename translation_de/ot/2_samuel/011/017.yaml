  terminology: „Uria, der Hetiter“ folgt der etablierten deutschen Namens- und Volksbezeichnung. „Diener“ wahrt die textnahe Bezeichnung עבדי דוד; die Fußnote kann den militärischen Bezug als „Leute“ erläutern, sollte dann aber die Differenz zum Haupttext nicht verwischen.
