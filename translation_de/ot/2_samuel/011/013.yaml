base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/013.yaml
  text: David invited him[a], and he ate and drank before him, and he made him drunk. In the evening he went out to lie on his bed with the servants of his lord[d][c][b], but he did not go down to his house.
translation:
  language: de
  text: David rief ihn zu sich[a]. Uria aß und trank vor ihm[b], und David machte ihn betrunken. Am Abend ging er hinaus, um sich auf sein Lager bei den Dienern seines Herrn[c] zu legen. In sein Haus ging er jedoch nicht hinunter[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „David ließ ihn kommen“ oder „David ließ ihn rufen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vor ihm“, das heißt: in Davids Gegenwart.'
    reason: lexical_alternative
  - marker: c
    text: Mit „seinem Herrn“ ist David gemeint.
    reason: referent_clarification
  - marker: d
    text: 'Wörtlich: „ging er nicht zu seinem Haus hinunter“. Das Richtungsverb des hebräischen Textes wird beibehalten, statt nur „ging er nicht nach Hause“ zu übersetzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ דָוִד
  choice: David ließ ihn rufen
  rationale: קרא mit ל kann hier das Rufen beziehungsweise Herbeirufen einer Person bezeichnen. „Ließ ihn rufen“ ist im Deutschen natürlich und wahrt Davids Initiative, ohne die Situation vorschnell als gesellschaftliche Einladung zu bestimmen.
- source_word: לְפָנָיו
  choice: in seiner Gegenwart
  rationale: Die Wendung bedeutet wörtlich „vor ihm“ und bezeichnet hier, dass Uria in Davids Gegenwart aß und trank. Die gewählte Formulierung vermeidet das im Deutschen mögliche Missverständnis einer räumlichen Position unmittelbar vor David.
- source_word: וַיְשַׁכְּרֵהוּ
  choice: David machte ihn betrunken
  rationale: 'Der Hifil von שׁכר ist kausativ: David bewirkte, dass Uria betrunken wurde. Die ausdrückliche Wiederholung des Namens klärt den Subjektwechsel und macht Davids verantwortliches Handeln deutlich.'
- source_word: בָעֶרֶב
  choice: Am Abend
  rationale: Die Zeitangabe eröffnet die nächste Handlungsetappe und wird knapp sowie idiomatisch wiedergegeben.
- source_word: לִשְׁכַּב בְּמִשְׁכָּבוֹ
  choice: legte sich auf sein Lager
  rationale: שׁכב bezeichnet das Sich-Hinlegen; מִשְׁכָּב kann Bett, Lager oder Schlafplatz bedeuten. „Lager“ passt zu einem Schlafplatz bei den königlichen Dienern und legt nicht fest, dass Uria tatsächlich schlief.
- source_word: עִם עַבְדֵי אֲדֹנָיו
  choice: bei den Dienern seines Herrn
  rationale: אֲדֹנָיו bezeichnet Urias Herrn, im Kontext David. „Bei“ gibt die Gemeinschaft beziehungsweise räumliche Nähe natürlich wieder; „seines Herrn“ bewahrt die Beziehungsstruktur und die erzählerische Ironie.
- source_word: וְאֶל בֵּיתוֹ לֹא יָרָד
  choice: In sein Haus aber ging er nicht hinunter
  rationale: Das Richtungsverb ירד („hinuntergehen“) bleibt erhalten, weil es auch im Kontext eine Rolle spielt. „Aber“ bringt den sachlichen Gegensatz zu Davids Absicht im natürlichen deutschen Erzählstil zum Ausdruck.
