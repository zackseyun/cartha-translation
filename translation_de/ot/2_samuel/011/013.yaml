translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Zuordnung der handelnden Personen. Die Satzstruktur bleibt erzählerisch knapp; das konkrete Richtungsverb „hinuntergehen“ und die kausative Aussage über Davids Handeln werden bewahrt.
