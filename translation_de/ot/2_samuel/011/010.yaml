  text: וַ/יַּגִּ֤דוּ לְ/דָוִד֙ לֵ/אמֹ֔ר לֹֽא יָרַ֥ד אוּרִיָּ֖ה אֶל בֵּית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אוּרִיָּ֗ה הֲ/ל֤וֹא מִ/דֶּ֨רֶךְ֙ אַתָּ֣ה בָ֔א מַדּ֖וּעַ לֹֽא יָרַ֥דְתָּ אֶל בֵּיתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/010.yaml
  text: They told David[a], saying, “Uriah did not go down to his house.” So David said to Uriah[b], “Have you not come from a journey? Why did you not go down to your house?”
translation:
  language: de
  text: 'Man berichtete David: »Uria ist nicht zu seinem Haus hinuntergegangen.« Da sagte David zu Uria: »Kommst du nicht von einer Reise? Warum bist du nicht zu deinem Haus hinuntergegangen?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht zweimal »zu seinem/deinem Haus hinuntergehen«. Gemeint ist, nach Hause zu gehen, vermutlich vom höher gelegenen königlichen Bereich zur eigenen Wohnung.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: 'Man berichtete David:'
  rationale: Der unbestimmte Plural lässt die Berichtenden ungenannt; das deutsche unpersönliche »man« bildet dies natürlich ab. לֵאמֹר wird durch den Doppelpunkt als Einleitung direkter Rede wiedergegeben.
- source_word: לֹא יָרַד אוּרִיָּה אֶל בֵּיתוֹ
  choice: Uria ist nicht zu seinem Haus hinuntergegangen
  rationale: Das Perfekt wird im Bericht idiomatisch mit dem deutschen Perfekt wiedergegeben. »Hinuntergehen« bewahrt die konkrete Bewegungsrichtung und wird in der anschließenden Frage wiederholt.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: »Da« führt die auf den Bericht folgende Reaktion Davids flüssig und ohne zusätzliche kausale Deutung ein.
- source_word: הֲלוֹא מִדֶּרֶךְ אַתָּה בָא
  choice: Kommst du nicht gerade von einer Reise?
  rationale: הֲלוֹא markiert eine Frage, die Zustimmung erwartet. מִדֶּרֶךְ bezeichnet hier idiomatisch das Unterwegssein beziehungsweise eine Reise; »gerade« verdeutlicht den situationsbezogenen Ausgangspunkt, ohne eine Rückkehr ausdrücklich einzutragen.
- source_word: מַדּוּעַ לֹא יָרַדְתָּ אֶל בֵּיתֶךָ
  choice: Warum bist du nicht zu deinem Haus hinuntergegangen?
  rationale: Die Wiederholung von ירד und בית wird beibehalten, weil sie Davids Nachfragen prägt und für die Spannung der Erzählung bedeutsam ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wiederholung von »zum Haus hinuntergehen« bleibt sichtbar; die direkte Rede ist natürlich formuliert. Die Wendung מִדֶּרֶךְ wird im Haupttext idiomatisch als »von einer Reise« wiedergegeben.
