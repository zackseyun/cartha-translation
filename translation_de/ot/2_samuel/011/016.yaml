  source_fidelity: 'Die zeitliche Konstruktion („Als“) und Joabs gezielte Platzierung Urias geben den hebräischen Satzbau und Handlungsablauf zutreffend wieder. „Kampferprobt“ ist jedoch zu spezifisch: אַנְשֵׁי חַיִל bezeichnet hier starke bzw. tüchtige Krieger, sagt aber nicht ausdrücklich, dass sie kampferfahren sind. Die Formulierung „an dem, wie er wusste“ bildet den hebräischen Relativsatz klarer ab als „von dem er wusste, dass dort“.'
