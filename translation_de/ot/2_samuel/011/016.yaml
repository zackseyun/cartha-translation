  yaml_path: translation/ot/2_samuel/011/016.yaml
  text: So when Joab was watching the city[a], he stationed Uriah in the place where he knew the mighty men were.
translation:
  language: de
  text: Als Joab die Stadt beobachtete, stellte er Uria an den Ort, an dem, wie er wusste, starke Krieger[a] waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tapfere Männer“ oder „fähige Kämpfer“. Der hebräische Ausdruck bezeichnet hier starke, tüchtige oder tapfere Krieger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁמֹר ... אֶל־הָעִיר
  choice: Als Joab die Stadt beobachtete
  rationale: Die Konstruktion mit בְּ und Infinitiv bildet einen temporalen Nebensatz. שׁמר bezeichnet hier im Belagerungskontext das aufmerksame Beobachten der Stadt; die ungewöhnliche Präposition אֶל markiert den Bezugspunkt, ohne dass ihre Nuance im Deutschen überdehnt werden sollte.
- source_word: וַיִּתֵּן אֶת־אוּרִיָּה אֶל הַמָּקוֹם
  choice: wies er Uria einen Platz zu
  rationale: נתן bedeutet grundsätzlich „geben, setzen, stellen“. Im militärischen Zusammenhang geht es um Joabs gezielte Zuweisung einer Stellung; „einen Platz zuweisen“ gibt dies natürlich wieder, ohne mehr taktische Einzelheiten einzutragen.
- source_word: אֲשֶׁר יָדַע
  choice: von dem er wusste
  rationale: ידע wird in seiner gewöhnlichen Bedeutung „wissen“ wiedergegeben. Der Relativsatz bezieht sich syntaktisch auf den Platz.
- source_word: אַנְשֵׁי חַיִל
  choice: kampferprobte Männer
  rationale: חַיִל kann Stärke, Tüchtigkeit oder militärische Befähigung bezeichnen. Im Kontext sind gefährliche, fähige Kämpfer gemeint. „Kampferprobt“ vermittelt dies verständlich, ohne sie mit Davids besonderer Kriegergruppe gleichzusetzen.
- source_word: שָׁם
  choice: dort ... standen
  rationale: Das Ortsadverb wird ausdrücklich mit „dort“ wiedergegeben. „Standen“ ist im Kontext einer militärischen Stellung idiomatischer als das bloße „waren“, bleibt aber nahe am ausgesagten Vorhandensein.
