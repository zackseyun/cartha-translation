source:
  edition: WLC
  text: וַ/יַּעֲבֹ֣ר הָ/אֵ֗בֶל וַ/יִּשְׁלַ֨ח דָּוִ֜ד וַ/יַּאַסְפָ֤/הּ אֶל בֵּית/וֹ֙ וַ/תְּהִי ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֥לֶד ל֖/וֹ בֵּ֑ן וַ/יֵּ֧רַע הַ/דָּבָ֛ר אֲשֶׁר עָשָׂ֥ה דָוִ֖ד בְּ/עֵינֵ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/027.yaml
  text: When the mourning was over[a], David sent and brought her into his house, and she became his wife and bore him a son. But the thing that David had done was evil in the eyes of Yahweh.
translation:
  language: de
  text: Als die Trauerzeit vorüber war, ließ David sie holen und nahm sie in sein Haus auf. Sie wurde seine Frau und gebar ihm einen Sohn. Doch was David getan hatte, war böse in den Augen Jahwes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „missfiel Jahwe“. Wörtlicher heißt es: „war böse in den Augen Jahwes“; damit wird Gottes moralisches Urteil über Davids Tat ausgedrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵבֶל
  choice: die Trauerzeit
  rationale: Bezeichnet hier die gesellschaftlich-rituelle Trauerzeit nach Urias Tod; „Trauerzeit“ macht den zeitlichen Bezug im Deutschen klar.
- source_word: וַיַּעֲבֹר
  choice: vorüber war
  rationale: Gibt das wörtliche „vorübergehen“ mit einem zeitlichen Subjekt natürlich und präzise wieder.
- source_word: וַיִּשְׁלַח ... וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
  choice: ließ David sie holen und nahm sie in sein Haus auf
  rationale: 'Bewahrt beide Verben: David veranlasst ihr Kommen und nimmt sie anschließend in seinen Haushalt auf.'
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: Sie wurde seine Frau
  rationale: Die Konstruktion bezeichnet einen Wechsel ihres rechtlichen und gesellschaftlichen Status.
- source_word: וַתֵּלֶד לוֹ בֵּן
  choice: gebar ihm einen Sohn
  rationale: Knappe, idiomatische und gehobene Wiedergabe der hebräischen Konstruktion.
- source_word: וַיֵּרַע
  choice: war böse
  rationale: Bewahrt die ausdrückliche moralische Bewertung und schwächt sie nicht zu bloßem Missfallen ab.
- source_word: הַדָּבָר אֲשֶׁר עָשָׂה דָוִד
  choice: was David getan hatte
  rationale: Natürliches Deutsch für „die Sache, die David getan hatte“, ohne den umfassenden Bezug auf Davids Tat einzuengen.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Erhält das hebräische Bild für Gottes moralisches Urteil.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Im modernen Deutschen geläufige Umschrift des göttlichen Eigennamens; sie ersetzt den Namen nicht durch einen Titel.
theological_decisions:
- issue: Stärke der moralischen Bewertung von Davids Handeln
  choice: war böse in den Augen Jahwes
  alternative: missfiel Jahwe
  rationale: Das Hebräische formuliert eine eindeutige göttliche Verurteilung. Die gewählte Fassung erhält sowohl den moralischen Gehalt als auch das Bild „in den Augen“.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch den traditionellen Ersatztitel ersetzt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die abschließende adversative Wendung „Doch“ hebt den Gegensatz zwischen Davids äußerlich geordnetem Vorgehen und Jahwes moralischem Urteil hervor.
