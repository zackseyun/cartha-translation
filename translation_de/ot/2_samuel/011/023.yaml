source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מַּלְאָךְ֙ אֶל דָּוִ֔ד כִּֽי גָבְר֤וּ עָלֵ֨י/נוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּצְא֥וּ אֵלֵ֖י/נוּ הַ/שָּׂדֶ֑ה וַ/נִּהְיֶ֥ה עֲלֵי/הֶ֖ם עַד פֶּ֥תַח הַ/שָּֽׁעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/023.yaml
  text: The messenger said to David[a], “The men were stronger than we were, and they came out against us into the open field[b]; but we pressed them back as far as the entrance of the gate.”
translation:
  language: de
  text: 'Der Bote sagte zu David: „Die Männer waren uns überlegen und zogen gegen uns aufs freie Feld hinaus. Doch wir drängten sie bis an den Eingang des Tores zurück.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „wir waren über ihnen“; gemeint ist wahrscheinlich, dass Davids Männer zum Gegenangriff übergingen und sie zurückdrängten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: der Bote
  rationale: Im erzählerischen Zusammenhang bezeichnet das Wort einen menschlichen Überbringer einer militärischen Nachricht, nicht ein Engelwesen.
- source_word: גָבְרוּ עָלֵינוּ
  choice: waren uns überlegen
  rationale: גבר mit עַל bezeichnet hier das Überlegen- oder Stärkersein beziehungsweise das Gewinnen der Oberhand. Die Formulierung bewahrt den vergleichenden Sinn und klingt in einem militärischen Bericht natürlich.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Die schlichte Wiedergabe folgt dem Hebräischen; aus dem Zusammenhang ist ersichtlich, dass feindliche Kämpfer gemeint sind.
- source_word: וַיֵּצְאוּ אֵלֵינוּ הַשָּׂדֶה
  choice: zogen gegen uns aufs freie Feld hinaus
  rationale: Die Männer kommen aus der Stadt heraus, um die Truppen im Feld anzugreifen. „gegen uns“ gibt den feindlichen Bezug wieder, „aufs freie Feld hinaus“ die Bewegung aus der Stadt.
- source_word: וַנִּהְיֶה עֲלֵיהֶם
  choice: wir drängten sie … zurück
  rationale: Wörtlich steht hier etwa „wir waren über/gegen ihnen“. Im militärischen Zusammenhang bezeichnet die Wendung den Gegenangriff beziehungsweise das Zurückdrängen; die räumliche Grenze folgt mit „bis an den Eingang des Tores“.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: bis an den Eingang des Tores
  rationale: Die Wendung bezeichnet die räumliche Grenze des Zurückdrängens und gibt sowohl פֶּתַח („Eingang, Öffnung“) als auch שַׁעַר („Tor“) wieder.
