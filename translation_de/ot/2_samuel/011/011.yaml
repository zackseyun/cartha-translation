source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אוּרִיָּ֜ה אֶל דָּוִ֗ד הָ֠/אָרוֹן וְ/יִשְׂרָאֵ֨ל וִֽ/יהוּדָ֜ה יֹשְׁבִ֣ים בַּ/סֻּכּ֗וֹת וַ/אדֹנִ֨/י יוֹאָ֜ב וְ/עַבְדֵ֤י אֲדֹנִ֨/י עַל פְּנֵ֤י הַ/שָּׂדֶה֙ חֹנִ֔ים וַ/אֲנִ֞י אָב֧וֹא אֶל בֵּיתִ֛/י לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׁכַּ֣ב עִם אִשְׁתִּ֑/י חַיֶּ֨/ךָ֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ אִֽם אֶעֱשֶׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/011.yaml
  text: Uriah said to David[a], “The ark, and Israel and Judah, are staying in shelters, and my lord Joab and the servants of my lord are camped in the open field. Shall I then go to my house to eat and to drink and to lie with my wife? As surely as you live, and as your soul lives[c][b], I will not do this thing.”
translation:
  language: de
  text: 'Urija sagte zu David: „Die Lade sowie Israel und Juda sind in Hütten[a] untergebracht, und mein Herr Joab und die Diener meines Herrn lagern auf freiem Feld. Da sollte ich in mein Haus gehen, essen und trinken und bei meiner Frau liegen? So wahr du lebst und so wahr deine Seele lebt: Ich werde diese Sache nicht tun![b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Laubhütten“ beziehungsweise „in provisorischen Unterkünften“. Gemeint sind einfache Unterkünfte im Feldlager.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich lautet die hebräische Schwurformel: „So wahr du lebst und so wahr deine Seele lebt, wenn ich diese Sache tue!“ Das „wenn“ drückt nach dem Schwur eine nachdrückliche Verneinung aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: die Lade
  rationale: Der hebräische Text sagt mit bestimmtem Artikel schlicht „die Lade“. Die knappe Wiedergabe vermeidet eine im Vers nicht ausdrücklich vorhandene Erweiterung wie „Bundeslade“ oder „Lade Gottes“.
- source_word: יֹשְׁבִים בַּסֻּכּוֹת
  choice: wohnen in Laubhütten
  rationale: סֻכּוֹת bezeichnet Hütten beziehungsweise provisorische Unterkünfte. „Laubhütten“ wahrt den konkreten hebräischen Ausdruck; die Fußnote erklärt den militärischen Kontext.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Hier ist אֲדֹנִי eine respektvolle Bezeichnung für den menschlichen Vorgesetzten Joab, nicht der Gottesname.
- source_word: עַל פְּנֵי הַשָּׂדֶה חֹנִים
  choice: lagern auf freiem Feld
  rationale: Die Verbindung bezeichnet ein andauerndes Feldlager unter freiem Himmel. Diese Wiedergabe ist im Deutschen natürlich und bewahrt den Gegensatz zu Urijas Haus.
- source_word: וַאֲנִי אָבוֹא אֶל בֵּיתִי
  choice: Da sollte ich in mein Haus gehen
  rationale: Der formal nicht mit einem Fragewort eingeleitete Satz hat im Zusammenhang rhetorische Kraft. „Da sollte ich …?“ bringt Urijas entrüstete Ablehnung zum Ausdruck, ohne den Gedanken als bloße Zukunftsaussage wiederzugeben.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׁכַּב עִם אִשְׁתִּי
  choice: essen und trinken und bei meiner Frau liegen
  rationale: Die Reihung bleibt erhalten. „Bei meiner Frau liegen“ gibt den zurückhaltenden sexuellen Ausdruck würdig und verständlich wieder.
- source_word: חַיֶּךָ וְחֵי נַפְשֶׁךָ
  choice: So wahr du lebst und so wahr deine Seele lebt
  rationale: Die Wiedergabe erhält sowohl die feierliche Schwurformel als auch ihre auffällige Doppelung und gibt נֶפֶשׁ ausdrücklich mit „Seele“ wieder.
- source_word: אִם אֶעֱשֶׂה אֶת הַדָּבָר הַזֶּה
  choice: Ich werde so etwas nicht tun
  rationale: Nach der Schwurformel wirkt אִם elliptisch als starke Verneinung. Die ausdrückliche Negation ist im Deutschen nötig; „so etwas“ entspricht idiomatisch הַדָּבָר הַזֶּה.
theological_decisions:
- issue: Bezeichnung der Lade
  choice: die Lade
  alternative: die Bundeslade / die Lade Gottes
  rationale: Der bekannte sakrale Bezug wird nicht bestritten, doch die Übersetzung folgt der im Vers tatsächlich stehenden knappen Bezeichnung und fügt keinen theologischen Titel ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Satzverbindungen und die doppelte Schwurformel bleiben wegen ihrer rhetorischen Wirkung erhalten. „Urija“ folgt einer geläufigen deutschen Wiedergabe des hebräischen Namens; „Diener“ wahrt den hierarchischen militärischen Kontext.
