  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד מַלְאָכִ֜ים וַ/יִּקָּחֶ֗/הָ וַ/תָּב֤וֹא אֵלָי/ו֙ וַ/יִּשְׁכַּ֣ב עִמָּ֔/הּ וְ/הִ֥יא מִתְקַדֶּ֖שֶׁת מִ/טֻּמְאָתָ֑/הּ וַ/תָּ֖שָׁב אֶל בֵּיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/004.yaml
  text: So David sent messengers and took her[a], and she came to him, and he lay with her. Now she was purifying herself from her uncleanness. Then she returned to her house.
translation:
  language: de
  text: Da schickte David Boten und ließ sie holen.[a] Sie kam zu ihm, und er schlief mit ihr. (Sie reinigte sich von ihrer Unreinheit.) Danach kehrte sie in ihr Haus zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „nahm sie“. Der eingeschobene hebräische Satz kann auch verstanden werden: „Sie hatte sich von ihrer Unreinheit gereinigt.“ Gemeint ist wahrscheinlich die rituelle Reinigung nach der Menstruation.'
    reason: Bewahrt die wörtlichere Bedeutung von לקח sowie die mögliche vorzeitige Deutung der hebräischen Partizipialklausel. Die Erklärung bezeichnet die rituelle, nicht moralische Kategorie der Unreinheit.
lexical_decisions:
- source_word: וַיִּשְׁלַח ... מַלְאָכִים
  choice: schickte ... Boten
  rationale: Die übliche und natürliche Wiedergabe von שלח und מַלְאָכִים in einem erzählenden Kontext.
- source_word: וַיִּקָּחֶהָ
  choice: ließ sie holen
  rationale: Das hebräische לקח bedeutet wörtlich „nehmen“, kann hier aber idiomatisch ausdrücken, dass David sie durch seine Boten holen ließ. Die Fußnote bewahrt die wörtlichere, härtere Formulierung.
- source_word: וַתָּבֹוא אֵלָיו
  choice: Sie kam zu ihm
  rationale: Schlichte Wiedergabe der Bewegungsangabe, ohne einen zusätzlichen euphemistischen Sinn einzutragen.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: er schlief mit ihr
  rationale: Im heutigen Standarddeutsch ist dies die natürliche, würdevolle Entsprechung der hebräischen Wendung für Geschlechtsverkehr.
- source_word: וְהִיא מִתְקַדֶּשֶׁת מִטֻּמְאָתָהּ
  choice: Sie aber reinigte sich gerade von ihrer Unreinheit
  rationale: Der Hitpael von קדש bezeichnet hier eine rituelle Reinigung, nicht moralische Heiligung. „Unreinheit“ bewahrt die kultische Kategorie von טֻמְאָה; „gerade“ gibt den Hintergrundcharakter des Partizips wieder.
- source_word: וַתָּשָׁב אֶל בֵּיתָהּ
  choice: Danach kehrte sie in ihr Haus zurück
  rationale: Natürliche deutsche Erzählfolge; „Haus“ entspricht בית genauer als „Zuhause“.
theological_decisions:
- issue: Funktion und Zeitbezug der Reinheitsklausel
  choice: 'Als begleitende Hintergrundangabe wiedergegeben: „Sie aber reinigte sich gerade von ihrer Unreinheit.“'
  alternative: „Sie hatte sich von ihrer Unreinheit gereinigt.“
  rationale: Die hebräische Partizipialkonstruktion kann eine gleichzeitig beziehungsweise im Hintergrund verlaufende Handlung bezeichnen; ein vorzeitiges Verständnis ist ebenfalls möglich. Der Haupttext bewahrt den aspektuellen Hintergrund, während die Fußnote die andere plausible Deutung nennt. Die Formulierung bleibt bei ritueller Reinheit und trifft keine zusätzliche Aussage über Schuld oder Unschuld.
- issue: Davids Veranlassung ihres Kommens
  choice: „ließ sie holen“ im Haupttext, mit wörtlicherer Alternative in der Fußnote
  alternative: „nahm sie“
  rationale: Die Verbindung mit den zuvor ausgesandten Boten legt im Deutschen eine kausative Wiedergabe nahe. Zugleich darf die knappe und potenziell gewaltsame Färbung von לקח nicht verschwinden; daher wird „nahm sie“ ausdrücklich dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdevoller Erzählweise. Die kultische Terminologie bleibt erkennbar, ohne altertümlich zu klingen.
