source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח דָּוִ֔ד וַ/יִּדְרֹ֖שׁ לָֽ/אִשָּׁ֑ה וַ/יֹּ֗אמֶר הֲ/לוֹא זֹאת֙ בַּת שֶׁ֣בַע בַּת אֱלִיעָ֔ם אֵ֖שֶׁת אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/003.yaml
  text: So David sent and inquired about the woman, and someone said, “Is this not Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?”
translation:
  language: de
  text: 'Da schickte David jemanden hin und erkundigte sich nach der Frau. Man sagte: »Ist das nicht Batseba, die Tochter Eliams und die Frau Urijas, des Hetiters?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד
  choice: Da schickte David jemanden hin
  rationale: Das hebräische Verb »senden« hat hier kein ausdrückliches Objekt; im Deutschen ergänzt »jemanden« idiomatisch den impliziten Boten, ohne ihn näher zu bestimmen.
- source_word: וַיִּדְרֹשׁ לָאִשָּׁה
  choice: und erkundigte sich nach der Frau
  rationale: דרשׁ mit ל bezeichnet hier das Einholen von Auskunft über eine Person.
- source_word: וַיֹּאמֶר
  choice: Man sagte
  rationale: Das hebräische maskuline Singularverb nennt den Sprecher nicht. Die unpersönliche Wiedergabe bewahrt diese Unbestimmtheit und vermeidet, David selbst als Sprecher festzulegen.
- source_word: הֲלוֹא זֹאת
  choice: Ist das nicht
  rationale: Die Fragepartikel mit הֲלוֹא legt eine bejahende Antwort nahe; die deutsche rhetorische Frage bildet dies natürlich ab.
- source_word: בַּת שֶׁבַע
  choice: Batseba
  rationale: Gängige deutsche Namensform für den hebräischen Eigennamen.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: die Frau Urijas, des Hetiters
  rationale: Gibt sowohl die eheliche Beziehung als auch Urijas ethnische Bezeichnung knapp und eindeutig wieder.
theological_decisions:
- issue: Identität des Sprechers bei וַיֹּאמֶר
  choice: 'Unbestimmt: »Man sagte«'
  alternative: »Er sagte« beziehungsweise David als Sprecher
  rationale: Obwohl das Verb grammatisch Singular ist, fehlt ein genanntes Subjekt; der Kontext erlaubt einen nicht näher bezeichneten Auskunftgeber. Die Übersetzung sollte die Unbestimmtheit nicht zugunsten Davids auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist flüssig, während die rhetorische Frage und die dreifache Identifizierung der Frau erhalten bleiben.
