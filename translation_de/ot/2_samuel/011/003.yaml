  source_fidelity: 'Der Text gibt die Abfolge des Hebräischen zutreffend wieder: David sendet einen nicht näher bestimmten Boten und lässt sich nach der Frau erkundigen. Die Antwort wahrt mit „Man sagte“ die im Kontext nicht ausdrücklich benannte Identität des Sprechers, ohne David zum Sprecher zu machen. Die rhetorische Frage und die drei Identifikationsangaben – Batseba, Tochter Eliams, Frau Urijas des Hetiters – sind vollständig erhalten.'
  naturalness: Flüssiges modernes Standarddeutsch mit angemessen würdigem, erzählendem Register. „Da schickte David jemanden hin und erkundigte sich nach der Frau“ ist idiomatisch und macht die im Deutschen naheliegende Vermittlung durch einen Boten verständlich, ohne diesen näher zu bestimmen.
  terminology: „Batseba“, „Eliam“, „Urija“ (im Genitiv „Urijas“) und „Hetiter“ sind im Deutschen verständliche und etablierte biblische Formen. „Frau“ gibt אֵשֶׁת sachgerecht wieder. Keine theologischen oder sachlichen Zusatzdeutungen wurden eingeführt.
