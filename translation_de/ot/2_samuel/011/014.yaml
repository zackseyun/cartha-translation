source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יִּכְתֹּ֥ב דָּוִ֛ד סֵ֖פֶר אֶל יוֹאָ֑ב וַ/יִּשְׁלַ֖ח בְּ/יַ֥ד אוּרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/014.yaml
  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
translation:
  language: de
  text: Am Morgen schrieb David einen Brief an Joab und sandte ihn durch Uria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in der Hand Urias“; auch: „durch Uria“ oder „mit Uria“. Die Wendung bezeichnet hier die Überbringung durch Uria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Am Morgen
  rationale: Die hebräische Erzählungsfolge wird im Deutschen durch die vorangestellte Zeitangabe natürlich wiedergegeben; ein ausdrückliches „Und es geschah“ wäre hier unnötig schwerfällig.
- source_word: וַיִּכְתֹּב
  choice: schrieb
  rationale: Die schlichte, kontextgemäße Wiedergabe des üblichen Verbs für das Schreiben.
- source_word: סֵפֶר
  choice: einen Brief
  rationale: Das Wort kann allgemein ein Schriftstück bezeichnen; da David an Joab schreibt und die Nachricht überbringen lässt, ist „Brief“ hier die natürliche Funktionsentsprechung.
- source_word: אֶל יוֹאָב
  choice: an Joab
  rationale: Im Deutschen schreibt man einen Brief „an“ einen Empfänger.
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: „Sandte“ gibt das erzählende Verb klar und in einem würdigen, aber gegenwärtig verständlichen Register wieder.
- source_word: בְּיַד אוּרִיָּה
  choice: durch Uria
  rationale: Wörtlich steht „durch/in der Hand Urias“. Die deutsche Wiedergabe „durch Uria“ drückt seine Rolle als Überbringer natürlich aus und bewahrt die bittere Ironie, dass er selbst den Brief trägt.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Der Name אוּרִיָּה wird nach der in deutschen Bibeln etablierten Form „Uria“ wiedergegeben.
