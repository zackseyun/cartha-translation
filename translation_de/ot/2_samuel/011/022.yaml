  yaml_path: translation/ot/2_samuel/011/022.yaml
  text: So the messenger went and came and told David all that Joab had sent him to say[a].
translation:
  language: de
  text: Der Bote machte sich also auf den Weg, kam und berichtete David alles, was Joab ihm aufgetragen hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alles, was Joab ihn gesandt hatte“ – eine im Deutschen nicht ohne Weiteres nachbildbare Formulierung. Gemeint ist: alles, was Joab ihm zur Übermittlung aufgetragen hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: der Bote
  rationale: מַלְאָךְ bezeichnet hier im Zusammenhang der militärischen Nachrichtenübermittlung einen menschlichen Boten, nicht einen Engel.
- source_word: וַיֵּלֶךְ
  choice: ging also los
  rationale: הלך führt in der Wayyiqtol-Folge die Erzählung weiter. „Ging los“ gibt den Aufbruch in natürlichem modernem Deutsch wieder; „also“ markiert den erzählerischen Anschluss.
- source_word: וַיָּבֹא
  choice: kam zu David
  rationale: בוא bedeutet „kommen/ankommen“. Die Verbindung mit „zu David“ formuliert das im Hebräischen unmittelbar folgende Ziel der Mitteilung idiomatisch.
- source_word: וַיַּגֵּד לְדָוִד
  choice: berichtete ihm
  rationale: נגד im Hifil bedeutet „mitteilen/berichten“. Im militärischen Kontext ist „berichtete“ präzise; das Pronomen bezieht sich eindeutig auf David und vermeidet eine schwerfällige Wiederholung.
- source_word: אֵת כָּל אֲשֶׁר
  choice: alles, was
  rationale: Die Wendung bezeichnet den vollständigen Inhalt der Botschaft und wird im Deutschen natürlich mit „alles, was“ wiedergegeben.
- source_word: שְׁלָחוֹ יוֹאָב
  choice: was Joab ihm aufgetragen hatte
  rationale: Wörtlich steht „was Joab ihn gesandt hatte“. Im Kontext bezeichnet dies den Inhalt, den Joab durch den Boten übermitteln ließ. „Aufgetragen hatte“ macht diesen kommunikativen Sinn idiomatisch deutlich, während die Fußnote die formale Gestalt offenlegt.
