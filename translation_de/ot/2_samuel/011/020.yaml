  text: וְ/הָיָ֗ה אִֽם תַּעֲלֶה֙ חֲמַ֣ת הַ/מֶּ֔לֶךְ וְ/אָמַ֣ר לְ/ךָ֔ מַדּ֛וּעַ נִגַּשְׁתֶּ֥ם אֶל הָ/עִ֖יר לְ/הִלָּחֵ֑ם הֲ/ל֣וֹא יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יֹר֖וּ מֵ/עַ֥ל הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
translation:
  language: de
  text: 'Und wenn der Zorn des Königs aufsteigt und er zu dir sagt: »Warum seid ihr so nahe an die Stadt herangerückt, um zu kämpfen? Habt ihr nicht gewusst, was sie von der Mauer herabschießen würden[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was sie von oben von der Mauer herabwerfen würden«. Das hebräische Verb kann allgemein das Schleudern von Geschossen bezeichnen; im militärischen Zusammenhang liegt »schießen« nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Und wenn
  rationale: Die Wendung leitet innerhalb von Joabs Anweisung einen möglichen Fall ein; »Und wenn« bewahrt sowohl die narrative Verknüpfung als auch die Bedingung.
- source_word: תַּעֲלֶה חֲמַת הַמֶּלֶךְ
  choice: der Zorn des Königs aufsteigt
  rationale: חֵמָה bezeichnet heftigen Zorn, während עלה das Aufsteigen ausdrückt. Die bildhafte Formulierung bleibt im Deutschen verständlich und quellentreu.
- source_word: וְאָמַר לְךָ
  choice: und er zu dir sagt
  rationale: Im entworfenen Bedingungsfall lässt sich die hebräische Verbform natürlich mit deutschem Präsens wiedergeben.
- source_word: נִגַּשְׁתֶּם אֶל הָעִיר
  choice: seid ihr so nahe an die Stadt herangerückt
  rationale: נגשׁ bedeutet sich nähern oder heranrücken. »so nahe« macht den vorwurfsvollen Zusammenhang deutlich, ohne den Sinn unnötig auszubauen.
- source_word: לְהִלָּחֵם
  choice: um zu kämpfen
  rationale: Der Infinitiv bezeichnet hier den Zweck der Annäherung; »um zu kämpfen« ist natürlich und präzise.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Habt ihr nicht gewusst
  rationale: Die verneinte rhetorische Frage erwartet Zustimmung und wird in vergleichbarer Form bewahrt.
- source_word: אֵת אֲשֶׁר יֹרוּ
  choice: was sie … herabschießen würden
  rationale: ירה im Hifil kann »schießen« oder allgemeiner »schleudern/werfen« bedeuten. Im militärischen Kontext ist »schießen« die naheliegende Hauptwiedergabe; der Konjunktiv gibt die vorgestellte Gefahr wieder.
- source_word: מֵעַל הַחוֹמָה
  choice: von der Mauer herab
  rationale: מֵעַל bezeichnet die Bewegung von oben beziehungsweise von der Oberseite her; »von der Mauer herab« gibt dies idiomatisch wieder.
