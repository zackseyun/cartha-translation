base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/008.yaml
  text: Then David said to Uriah[a], “Go down to your house and wash your feet.” So Uriah went out from the king’s house[b], and a present from the king went out after him.
translation:
  language: de
  text: 'Da sagte David zu Uria: »Geh hinunter in dein Haus und wasch dir die Füße.[a]« Uria verließ das Haus des Königs, und ihm wurde ein Geschenk des Königs nachgeschickt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung lautet wörtlich: „Wasch dir die Füße.“ Sie kann Erfrischung nach dem Unterwegssein ausdrücken und hier zugleich nahelegen, dass Uria sich zu Hause niederlassen soll.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „eine Portion vom König“. Das hebräische Wort kann etwas bezeichnen, das jemandem geschickt oder gebracht wird, etwa eine Gabe oder einen Anteil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵד
  choice: Geh hinunter
  rationale: Bewahrt die Richtungsangabe des hebräischen Verbs ירד; vermutlich führt der Weg vom Königshaus zu Urias Haus.
- source_word: לְבֵיתְךָ
  choice: in dein Haus
  rationale: Gibt בית konkret wieder und klingt im Deutschen in Verbindung mit »hinuntergehen« natürlich.
- source_word: וּרְחַץ רַגְלֶיךָ
  choice: und wasch dir die Füße
  rationale: Bewahrt den konkreten hebräischen Ausdruck, ohne seine möglichen weitergehenden Anklänge im Haupttext festzulegen.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: das Haus des Königs
  rationale: Entspricht dem hebräischen Wortlaut genauer als »Palast« und bleibt verständlich.
- source_word: מַשְׂאַת הַמֶּלֶךְ
  choice: ein Geschenk des Königs
  rationale: מַשְׂאֵת bezeichnet hier etwas, das mitgegeben beziehungsweise nachgeschickt wird; möglich sind auch »Gabe« oder »Anteil«.
- source_word: אַחֲרָיו
  choice: hinter ihm
  rationale: Drückt anschaulich aus, dass die königliche Gabe Uria nachgetragen wurde.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der konkrete Ausdruck »die Füße waschen« und das wörtliche »Haus des Königs« bleiben erhalten; die etwas sperrige hebräische Konstruktion beim königlichen Geschenk wird natürlich als passiver Vorgang wiedergegeben.
