review_pass:
  verdict: revise
  source_fidelity: Der Haupttext gibt die Imperative und die Ortsangaben insgesamt treffend wieder. Die Wiedergabe von וַתֵּצֵא („ging hinaus/folgte“) als „wurde ... hergetragen“ fügt jedoch eine nicht im Text ausgedrückte Art des Transports hinzu und schwächt das Verb „hinausgehen“ ab. „Nachgeschickt“ gibt den erzählerischen Zusammenhang und אַחֲרָיו idiomatisch wieder, ohne die Art der Sendung festzulegen.
  naturalness: „Geh hinunter in dein Haus“ ist verständlich und im würdigen Register möglich. Der Schlusssatz wird mit „wurde ... hergetragen“ unnötig schwerfällig; „wurde ihm ... nachgeschickt“ ist modernes Standarddeutsch. Die bestehende Anmerkung a ist zudem sprachlich und sachlich missglückt, weil nicht die Wendung selbst „wörtlich eine Erfrischung bezeichnet“, sondern das Füßewaschen konkret genannt wird und als Erfrischung dienen kann.
  terminology: „Uria“, „Haus des Königs“, „die Füße waschen“ und „Geschenk des Königs“ sind angemessen. Als Alternative zu מַשְׂאֵת ist „Portion vom König“ vertretbar; die Anmerkung muss jedoch grammatisch berichtigt und präziser formuliert werden.
  issues:
  - severity: medium
    issue: „hinter ihm wurde ein Geschenk des Königs hergetragen“
    rationale: Das hebräische וַתֵּצֵא sagt, dass die königliche Gabe hinausging bzw. Uria folgte. „Hergetragen“ konkretisiert den Vorgang als Tragen zu einem deiktischen Ziel hin und ist daher weder die naheliegendste noch die neutrale Wiedergabe.
  - severity: medium
    issue: Fußnote a erklärt die Wendung unzutreffend
    rationale: „Die Füße waschen“ ist zunächst ein konkreter Ausdruck. Er kann der Erfrischung nach dem Unterwegssein dienen und im Kontext ein Sichzu-Hause-Niederlassen nahelegen; dies sollte nicht als angebliche wörtliche Bedeutung der ganzen Wendung beschrieben werden.
  - severity: high
    issue: Fußnote b enthält den sinnstörenden Text „etwas Beziehungsweise“
    rationale: Die Formulierung ist grammatisch defekt und erklärt die lexikalische Alternative nicht verständlich.
