revisions:
- from: 'Da sagte David zu Uria: »Geh hinunter in dein Haus und wasch dir die Füße.[a]« Uria verließ das Haus des Königs, und hinter ihm wurde ein Geschenk des Königs hergetragen.[b]'
  to: 'Da sagte David zu Uria: »Geh hinunter in dein Haus und wasch dir die Füße.[a]« Uria verließ das Haus des Königs, und ihm wurde ein Geschenk des Königs nachgeschickt.[b]'
  rationale: Die Überarbeitung vermeidet die zusätzliche Vorstellung des „Hertragens“, gibt die nachfolgende Sendung der königlichen Gabe idiomatisch wieder und berichtigt beide Anmerkungen. Die mögliche kontextuelle Nebenbedeutung der Fußwaschung wird als Möglichkeit ausgewiesen, nicht in den Haupttext eingetragen.
