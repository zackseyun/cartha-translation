base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/012.yaml
  text: Then David said to Uriah[a], “Stay here today also, and tomorrow I will send you away.” So Uriah stayed in Jerusalem that day and the next day.
translation:
  language: de
  text: 'Da sagte David zu Uria: »Bleib auch heute noch hier; morgen werde ich dich wegschicken.« So blieb Uria an jenem Tag und am folgenden Tag in Jerusalem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter; »Da« gibt die zeitliche Folge im modernen deutschen Erzählstil natürlich wieder.
- source_word: שֵׁב בָּזֶה
  choice: Bleib … hier
  rationale: ישׁב bezeichnet hier kein Sitzen oder Wohnen, sondern das vorübergehende Verbleiben am gegenwärtigen Ort.
- source_word: גַּם הַיּוֹם
  choice: auch heute noch
  rationale: »Auch« gibt גַּם wieder; »noch« verdeutlicht im Deutschen idiomatisch, dass Uria einen weiteren Tag bleiben soll.
- source_word: וּמָחָר אֲשַׁלְּחֶךָּ
  choice: morgen werde ich dich gehen lassen
  rationale: שׁלח bedeutet hier, Uria zu entlassen beziehungsweise abreisen zu lassen. Die Formulierung ist natürlich und vermeidet den möglichen Beiklang einer bloßen Botensendung.
- source_word: וַיֵּשֶׁב
  choice: So blieb
  rationale: Die Erzählform setzt die Handlung fort; »so« macht zugleich deutlich, dass Uria Davids Anweisung befolgte.
- source_word: בַּיּוֹם הַהוּא וּמִמָּחֳרָת
  choice: an jenem Tag und am folgenden Tag
  rationale: Die beiden Zeitangaben werden nah am Hebräischen und in natürlichem Standarddeutsch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und knapp gehalten; Uria folgt der im Deutschen üblichen Namensform.
