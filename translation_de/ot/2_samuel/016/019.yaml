  text: And secondly[a], whom should I serve? Should it not be before his son? As I served before your father, so I will be before you.
translation:
  language: de
  text: 'Und zweitens: Wem sollte ich dienen? Sollte ich nicht vor seinem Sohn dienen? Wie ich vor deinem Vater gedient habe, so werde ich vor dir sein.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: „vor seinem Sohn … vor deinem Vater … vor dir“. Das ist eine höfische Ausdrucksweise für Dienst in der Gegenwart eines Königs oder unter seiner Herrschaft.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהַשֵּׁנִית
  choice: Und zweitens
  rationale: Die Form leitet als Diskursmarker Huschais zweites Argument ein; „zweitens“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: לְמִי אֲנִי אֶעֱבֹד
  choice: Wem sollte ich dienen?
  rationale: עבד bezeichnet hier den loyalen Dienst am König; der Konjunktiv „sollte“ wahrt den rhetorischen Charakter der Frage.
- source_word: הֲלוֹא לִפְנֵי בְנוֹ
  choice: Etwa nicht seinem Sohn?
  rationale: הֲלוֹא erwartet Zustimmung. לִפְנֵי ist hier Teil einer höfischen Wendung für den Dienst vor beziehungsweise unter einem Herrscher; eine wörtliche Wiedergabe mit „vor“ wäre im heutigen Deutschen missverständlich.
- source_word: כַּאֲשֶׁר עָבַדְתִּי לִפְנֵי אָבִיךָ
  choice: Wie ich deinem Vater gedient habe
  rationale: Die natürliche deutsche Konstruktion „jemandem dienen“ vermittelt die höfische Bedeutung von עבד לפני ohne unnötige Fremdheit.
- source_word: כֵּן אֶהְיֶה לְפָנֶיךָ
  choice: so werde ich dir dienen
  rationale: Obwohl der hebräische Text mit היה wörtlich „so werde ich vor dir sein“ sagt, nimmt die Ellipse den zuvor genannten Dienst auf. Die explizite Wiedergabe ist im Deutschen klar und bewahrt den Parallelismus dem Sinn nach.
