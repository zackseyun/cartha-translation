base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/013.yaml
  text: So David and his men went on the road[a], while Shimei went along on the hillside opposite him, going along and cursing[c][b], and throwing stones opposite him and flinging dust.
translation:
  language: de
  text: So zogen David und seine Männer auf dem Weg weiter, während Schimi David gegenüber am Berghang entlangging, dabei fortwährend fluchte, ihn von gegenüber mit Steinen bewarf und Staub aufwirbelte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדָּרֶךְ
  choice: auf dem Weg
  rationale: דֶּרֶךְ bezeichnet hier konkret den Weg, auf dem David und seine Begleiter weiterziehen.
- source_word: בְּצֵלַע הָהָר
  choice: am Berghang
  rationale: צֵלַע bedeutet wörtlich „Seite“ oder „Flanke“; zusammen mit הָהָר ist „am Berghang“ eine natürliche topografische Wiedergabe.
- source_word: לְעֻמָּתוֹ
  choice: ihm gegenüber / von gegenüber
  rationale: Die zweimalige Wendung bezeichnet die räumliche Gegenüberstellung. Beide Vorkommen werden wiedergegeben, ohne die deutsche Formulierung unnötig zu versteifen.
- source_word: הֹלֵךְ ... הָלוֹךְ
  choice: ging ... entlang / Während er weiterging
  rationale: Die wiederholte Bewegungsform hebt den fortdauernden Verlauf hervor; die deutsche Wiederaufnahme bewahrt diese durative Wirkung.
- source_word: וַיְקַלֵּל
  choice: fluchte
  rationale: Das Piel von קלל bedeutet „fluchen, verfluchen“. Im Zusammenhang beschreibt es Schimis fortgesetzte feindselige Handlung.
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: bewarf ihn mit Steinen
  rationale: סקל kann auch „steinigen“ bedeuten, bezeichnet hier jedoch das Werfen von Steinen als feindselige Belästigung und nicht ausdrücklich eine förmliche Hinrichtung.
- source_word: וְעִפַּר בֶּעָפָר
  choice: schleuderte Staub auf
  rationale: Die figura etymologica mit עפר beschreibt das Aufwerfen oder Schleudern von Staub beziehungsweise loser Erde; „Staub aufschleudern“ ist anschaulich und idiomatisch.
- source_word: וַאֲנָשָׁיו
  choice: seine Männer
  rationale: אֲנָשִׁים bezeichnet hier Davids männliche Begleiter beziehungsweise Gefolgsleute.
- source_word: וַיֵּלֶךְ
  choice: zogen ... weiter
  rationale: הלך ist das gewöhnliche Verb für Gehen oder Ziehen; „weiterziehen“ macht im Erzählzusammenhang die fortgesetzte Bewegung deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fortdauernde Bewegung und beide Vorkommen von לְעֻמָּתוֹ werden erkennbar bewahrt; eine im Deutschen missverständliche gerichtliche Bedeutung von „steinigen“ wird vermieden.
