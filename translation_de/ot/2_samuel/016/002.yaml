base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/002.yaml
  text: Then the king said to Ziba[a], “What are these for?” And Ziba said, “The donkeys are for the king’s household to ride on, and the bread and summer fruit are for the young men to eat[c][b], and the wine is for the weary in the wilderness to drink.”
translation:
  language: de
  text: 'Da fragte der König Ziba: »Wofür sind diese?[a]« Ziba antwortete: »Die Esel sind für den Haushalt des Königs zum Reiten, das Brot und die Sommerfrüchte[b] für die jungen Männer[c] zum Essen und der Wein für die Erschöpften in der Wildnis zum Trinken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was willst du mit diesen?« Wörtlich etwa: »Was sind diese für dich?«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sommererzeugnisse«. Das hebräische Wort kann allgemein im Sommer geerntete Früchte oder Erzeugnisse bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Diener« beziehungsweise »Begleiter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֵלֶּה לָּךְ
  choice: Wozu hast du das alles mitgebracht?
  rationale: 'Die hebräische Wendung lautet wörtlich etwa: »Was sind diese für dich?« Im Zusammenhang fragt David nach dem Zweck der mitgebrachten Dinge. Die deutsche Fassung gibt diese Funktion natürlich wieder, ohne die Antwort vorwegzunehmen.'
- source_word: הַחֲמוֹרִים
  choice: die Esel
  rationale: Die geläufige und genaue moderne deutsche Bezeichnung.
- source_word: לְבֵית הַמֶּלֶךְ
  choice: für die Familie des Königs
  rationale: בַּיִת bezeichnet hier nicht ein Gebäude, sondern die zum König gehörende Personengruppe. »Familie« ist in diesem Zusammenhang verständlich; der weitere Hofstaat kann dabei mitgemeint sein.
- source_word: לִרְכֹּב
  choice: zum Reiten
  rationale: Der Infinitiv bezeichnet den Zweck der Esel; »zum Reiten« ist knapp und idiomatisch.
- source_word: הַלֶּחֶם
  choice: das Brot
  rationale: Bewahrt die konkrete Grundbedeutung; eine Verallgemeinerung zu »Nahrung« ist nicht erforderlich.
- source_word: הַקַּיִץ
  choice: die Sommerfrüchte
  rationale: Der Ausdruck bezeichnet im Sommer geerntete Früchte beziehungsweise Erzeugnisse, ohne hier eine bestimmte Fruchtart festzulegen.
- source_word: הַנְּעָרִים
  choice: die jungen Männer
  rationale: Bewahrt die primäre lexikalische Bedeutung. Je nach sozialem Kontext kann das Wort auch Diener oder Begleiter bezeichnen; diese Möglichkeit wird in einer Fußnote erhalten.
- source_word: הַיָּעֵף
  choice: die Erschöpften
  rationale: Der substantivierte Singular ist generisch beziehungsweise kollektiv gebraucht. Der deutsche Plural gibt natürlich die Menschen wieder, für die der Wein bestimmt ist.
- source_word: בַּמִּדְבָּר
  choice: in der Wildnis
  rationale: »Wildnis« deckt das unbewohnte, karge Gebiet ab, ohne ausschließlich eine Sandwüste nahezulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Rede. Die wiederholte Zweckkonstruktion des Hebräischen wird durch »zum Reiten«, »zum Essen« und »zum Trinken« bewahrt. Die Fußnotenmarker stehen jeweils unmittelbar an der betreffenden Formulierung.
