source:
  edition: WLC
  text: וּ/בָ֛א הַ/מֶּ֥לֶךְ דָּוִ֖ד עַד בַּֽחוּרִ֑ים וְ/הִנֵּ֣ה מִ/שָּׁם֩ אִ֨ישׁ יוֹצֵ֜א מִ/מִּשְׁפַּ֣חַת בֵּית שָׁא֗וּל וּ/שְׁמ/וֹ֙ שִׁמְעִ֣י בֶן גֵּרָ֔א יֹצֵ֥א יָצ֖וֹא וּ/מְקַלֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/005.yaml
  text: When King David came to Bahurim[a], behold, a man came out from there, from the clan of the house of Saul, whose name was Shimei son of Gera; he came out continually, cursing as he came.
translation:
  language: de
  text: Als König David nach Bahurim kam, siehe, da kam von dort ein Mann aus der Sippe des Hauses Saul heraus. Sein Name war Schimi, der Sohn Geras. Er kam fortwährend heraus und fluchte dabei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische verstärkt das Verb »herauskommen« durch die Verbindung eines Partizips mit einem Infinitivus absolutus. Dies kann eine fortgesetzte oder wiederholte Handlung ausdrücken; auch möglich: »Er kam immer wieder heraus und fluchte dabei.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַמֶּלֶךְ דָּוִד עַד בַּחוּרִים
  choice: Als König David nach Bahurim kam
  rationale: Das narrative וּבָא führt die Ankunft ein; die temporale Wiedergabe mit »als« verbindet sie im Deutschen natürlich mit der folgenden Szene. עַד bezeichnet hier das Erreichen des Ortes.
- source_word: וְהִנֵּה
  choice: sieh, da
  rationale: Die Wendung bewahrt die aufmerksamkeitslenkende, anschauliche Kraft von הִנֵּה, ohne altertümlich zu wirken.
- source_word: מִשָּׁם אִישׁ יוֹצֵא
  choice: da kam von dort ein Mann … heraus
  rationale: Das Partizip beschreibt den beim Eintreffen Davids wahrgenommenen Vorgang. »Herauskommen« gibt die räumliche Bedeutung von יצא wieder.
- source_word: מִמִּשְׁפַּחַת בֵּית שָׁאוּל
  choice: aus der Sippe des Hauses Saul
  rationale: מִשְׁפָּחָה bezeichnet hier eine größere Verwandtschaftsgruppe; »Haus Saul« wahrt zugleich den familiären und dynastischen Sinn von בֵּית.
- source_word: וּשְׁמוֹ שִׁמְעִי בֶן גֵּרָא
  choice: Er hieß Schimi, ein Sohn Geras
  rationale: Die deutsche Namensformel ist natürlich und gibt sowohl den Namen als auch die Abstammungsangabe vollständig wieder.
- source_word: יֹצֵא יָצוֹא
  choice: Er kam heraus und ging … immer weiter
  rationale: Die Verbindung aus Partizip und Infinitivus absolutus verstärkt beziehungsweise verstetigt den Vorgang. Die Formulierung gibt die anhaltende Bewegung idiomatisch wieder, ohne sie eindeutig als bloße Wiederholung festzulegen.
- source_word: וּמְקַלֵּל
  choice: fluchend
  rationale: Das Partizip bezeichnet das Fluchen als gleichzeitig andauernde Begleithandlung zur Bewegung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sieh, da« erhält die lebendige Erzählperspektive, während »ging … immer weiter« die ungewöhnliche hebräische Verbverstärkung lesbar wiedergibt. Die Namensformen »Schimi« und »Gera« folgen dem etablierten deutschen Bibelgebrauch.
