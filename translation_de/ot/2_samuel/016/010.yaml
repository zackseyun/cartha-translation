  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַה לִּ֥/י וְ/לָ/כֶ֖ם בְּנֵ֣י צְרֻיָ֑ה כי יְקַלֵּ֗ל ו/כי יְהוָה֙ אָ֤מַר ל/וֹ֙ קַלֵּ֣ל אֶת דָּוִ֔ד וּ/מִ֣י יֹאמַ֔ר מַדּ֖וּעַ עָשִׂ֥יתָה כֵּֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/010.yaml
  text: But the king said[a], “What have I to do with you, sons of Zeruiah? If he is cursing because Yahweh has said to him, ‘Curse David,’ then who can say, ‘Why have you done so?’”
translation:
  language: de
  text: 'Doch der König sagte: „Was habe ich mit euch zu schaffen, ihr Söhne Zerujas? Wenn er David verflucht, weil Jahwe ihm gesagt hat: ‚Verfluche David!‘, wer kann dann sagen: ‚Warum hast du das getan?‘“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn er verflucht David, weil Jahwe ihm gesagt hat: ‚Verfluche David!‘“ Die hebräischen Partikeln können hier auch eher erklärend als konditional verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: Was habe ich mit euch zu schaffen
  rationale: Die hebräische Wendung drückt Distanzierung und Zurückweisung aus, nicht eine wörtliche Frage nach Besitz oder Gemeinsamkeiten. Die gewählte Formulierung ist im Deutschen idiomatisch und bewahrt den scharfen Ton der Antwort.
- source_word: בְּנֵי צְרֻיָה
  choice: ihr Söhne Zerujas
  rationale: Die Anrede bezeichnet Joab und Abischai nach ihrer Mutter. Das eingefügte „ihr“ macht die direkte Anrede im Deutschen natürlich; „Zeruja“ entspricht der üblichen deutschen Namensform.
- source_word: יְקַלֵּל / קַלֵּל
  choice: flucht / Verfluche
  rationale: Das Verb bezeichnet hier das gegen David gerichtete Fluchen. Die verwandten deutschen Formen erhalten die lexikalische Verbindung zwischen der laufenden Handlung und dem zitierten Befehl.
- source_word: כִּי ... וְכִי
  choice: Wenn ... weil
  rationale: 'Die Partikelfolge ist syntaktisch mehrdeutig. Die Hauptfassung versteht die erste Partikel konditional und die zweite kausal: David stellt die Möglichkeit göttlicher Beauftragung in den Raum. Die erklärende Alternative wird in der Fußnote bewahrt.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die geläufige deutsche Transkription.
- source_word: אָמַר לוֹ
  choice: zu ihm gesagt hat
  rationale: Das deutsche Perfekt verbindet die vorausgehende Äußerung Jahwes natürlich mit dem gegenwärtigen Fluchen.
- source_word: וּמִי יֹאמַר
  choice: wer kann dann sagen
  rationale: Die rhetorische Frage betrifft nicht nur eine künftige Äußerung, sondern die Befugnis, ein möglicherweise von Jahwe angeordnetes Handeln infrage zu stellen. „Dann“ verdeutlicht die Folgerung der konditionalen Hauptfassung.
- source_word: מַדּוּעַ עָשִׂיתָה כֵּן
  choice: Warum hast du das getan?
  rationale: Die Formulierung gibt die direkte rhetorische Herausforderung knapp und in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Jahwes Beteiligung an Schimis Fluch
  choice: David stellt es als reale Möglichkeit dar, dass Jahwe Schimi ausdrücklich zum Fluchen aufgefordert hat.
  alternative: Die Aussage lediglich als göttliche Zulassung abschwächen oder ohne konditionale Rahmung als eindeutig feststehende Beauftragung formulieren.
  rationale: Der hebräische Text legt Jahwe die Aufforderung „Verfluche David!“ in den Mund, während die Partikeln eine konditionale oder erklärende Einordnung zulassen. Die Übersetzung bewahrt diese Spannung, ohne daraus eine weitergehende Lehre über Verursachung oder moralische Billigung abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; die idiomatische Zurückweisung vermeidet unnötigen Archaismus. Die echte syntaktische und theologische Mehrdeutigkeit wird durch die Fußnote offengehalten.
