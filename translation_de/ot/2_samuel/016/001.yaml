  text: וְ/דָוִ֗ד עָבַ֤ר מְעַט֙ מֵֽ/הָ/רֹ֔אשׁ וְ/הִנֵּ֥ה צִיבָ֛א נַ֥עַר מְפִי בֹ֖שֶׁת לִ/קְרָאת֑/וֹ וְ/צֶ֨מֶד חֲמֹרִ֜ים חֲבֻשִׁ֗ים וַ/עֲלֵי/הֶם֩ מָאתַ֨יִם לֶ֜חֶם וּ/מֵאָ֧ה צִמּוּקִ֛ים וּ/מֵ֥אָה קַ֖יִץ וְ/נֵ֥בֶל יָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/001.yaml
  text: When David had passed a little beyond the summit[a], behold, Ziba the servant of Mephibosheth was there to meet him, with a pair of saddled donkeys, and on them were two hundred loaves of bread, a hundred clusters of raisins, a hundred summer fruits[c][b], and a skin of wine.
translation:
  language: de
  text: Als David ein Stück über den Gipfel hinausgegangen war[a], siehe, da kam ihm Ziba, der Diener[b] Mefi-Boschets, entgegen. Er hatte ein Paar gesattelte Esel bei sich; darauf waren zweihundert Brote, hundert Bündel getrockneter Trauben, hundert Sommerfrüchte[c] und ein Schlauch Wein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »ein Stück am Gipfel vorbei«. Wörtlich steht im Hebräischen »ein Stück vom Kopf weg«; »Kopf« bezeichnet hier den Gipfel des Berges oder Hügels.'
    reason: lexical_alternative
  - marker: b
    text: »Diener« kann auch mit »junger Mann« oder »Begleiter« wiedergegeben werden; hier spricht der Zusammenhang für Zibas Stellung als Diener Mefi-Boschets.
    reason: lexical_alternative
  - marker: c
    text: Mit den »Sommerfrüchten« können insbesondere Feigen gemeint sein; der hebräische Ausdruck ist jedoch weiter gefasst.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מֵהָרֹאשׁ
  choice: ein Stück über den Gipfel hinaus
  rationale: רֹאשׁ bedeutet wörtlich »Kopf«, bezeichnet hier topografisch aber den Gipfel. Die Formulierung gibt die räumliche Bewegung natürlich wieder.
- source_word: וְהִנֵּה
  choice: siehe, da
  rationale: Die Wendung bewahrt das lebhafte, Aufmerksamkeit weckende Moment des hebräischen Erzählmarkers.
- source_word: נַעַר מְפִי בֹשֶׁת
  choice: der Diener Mefi-Boschets
  rationale: נַעַר kann »junger Mann«, »Diener« oder »Begleiter« bedeuten. Hier bezeichnet es am wahrscheinlichsten Zibas Stellung gegenüber Mefi-Boschet.
- source_word: צֶמֶד חֲמֹרִים
  choice: ein Paar ... Esel
  rationale: צֶמֶד bezeichnet ein zusammengehöriges Paar; »ein Paar Esel« ist im Deutschen klar und legt kein eigentliches Joch fest.
- source_word: חֲבֻשִׁים
  choice: gesattelte
  rationale: Das Partizip beschreibt hier zum Reiten oder Lastentragen ausgerüstete Esel; »gesattelt« ist die passende kontextuelle Wiedergabe.
- source_word: מָאתַיִם לֶחֶם
  choice: zweihundert Brote
  rationale: Die zählbare deutsche Form »Brote« gibt die Mengenangabe idiomatisch wieder.
- source_word: צִמּוּקִים
  choice: Rosinenbündel
  rationale: Das Wort bezeichnet getrocknete beziehungsweise zusammengepresste Trauben oder Rosinen. »Rosinenbündel« wahrt diese Bedeutung, ohne sicher »Kuchen« vorauszusetzen.
- source_word: קַיִץ
  choice: Sommerfrüchte
  rationale: Der Ausdruck bezeichnet Sommerobst und kann besonders Feigen meinen. Die breitere Wiedergabe vermeidet eine unnötige Verengung.
- source_word: נֵבֶל יָיִן
  choice: ein Schlauch Wein
  rationale: נֵבֶל bezeichnet hier einen Behälter aus Tierhaut; »ein Schlauch Wein« ist knapp, verständlich und sachlich passend.
