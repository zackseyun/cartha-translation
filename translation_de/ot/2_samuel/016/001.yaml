translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das erzählerische וְהִנֵּה wird bewusst mit »siehe, da« sichtbar gehalten; unklare Sachbegriffe werden im Haupttext verständlich wiedergegeben und in Fußnoten nicht enger bestimmt, als es das Hebräische erlaubt.
