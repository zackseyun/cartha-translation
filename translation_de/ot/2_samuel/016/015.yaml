  text: וְ/אַבְשָׁל֗וֹם וְ/כָל הָ/עָם֙ אִ֣ישׁ יִשְׂרָאֵ֔ל בָּ֖אוּ יְרוּשָׁלִָ֑ם וַ/אֲחִיתֹ֖פֶל אִתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/015.yaml
  text: Absalom and all the people[a], the men of Israel, came to Jerusalem, and Ahithophel was with him.
translation:
  language: de
  text: Absalom und das ganze Volk, die Männer Israels,[a] kamen nach Jerusalem; Ahitofel war bei ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das ganze Volk, jeder Mann Israels“; möglich ist auch: „das ganze Volk, die Männer Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלֹום
  choice: Absalom
  rationale: Der Name wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben. Das einleitende ו wird im Deutschen nicht eigens ausgedrückt, da der fortlaufende Erzählzusammenhang die Verknüpfung trägt.
- source_word: וְ/כָל הָ/עָם
  choice: und das ganze Volk
  rationale: עָם bezeichnet hier am natürlichsten die Gesamtheit der Menschen auf Absaloms Seite; „Heer“ wäre zu eng.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: Die kollektiv-appositionale Formulierung bewahrt den maskulinen und nationalen Ausdruck des Hebräischen. Die mögliche distributive Lesart wird in der Fußnote genannt.
- source_word: בָּאוּ יְרוּשָׁלִָם
  choice: kamen nach Jerusalem
  rationale: בוא wird hier idiomatisch als „kommen“ mit Jerusalem als Ziel wiedergegeben.
- source_word: וַ/אֲחִיתֹפֶל אִתּוֹ
  choice: Ahitofel war bei ihm
  rationale: Für den im Hebräischen verblosen Ausdruck wird im Deutschen „war“ ergänzt. Das Pronomen bezieht sich im Zusammenhang am ehesten auf Absalom.
theological_decisions: []
