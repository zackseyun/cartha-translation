  text: וַ/יְסַקֵּ֤ל בָּֽ/אֲבָנִים֙ אֶת דָּוִ֔ד וְ/אֶת כָּל עַבְדֵ֖י הַ/מֶּ֣לֶךְ דָּוִ֑ד וְ/כָל הָ/עָם֙ וְ/כָל הַ/גִּבֹּרִ֔ים מִ/ימִינ֖/וֹ וּ/מִ/שְּׂמֹאלֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/006.yaml
  text: And he threw stones at David and at all the servants of King David[a], while all the people and all the mighty men were at his right hand and at his left.
translation:
  language: de
  text: Und er bewarf David und alle Diener des Königs David mit Steinen[a], während das ganze Volk und alle Krieger zu seiner Rechten und zu seiner Linken waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er steinigte David und alle Diener des Königs David.“ Das hebräische Verb kann so wörtlich wiedergegeben werden; gemeint ist hier jedoch das feindselige Bewerfen mit Steinen, nicht ausdrücklich eine förmliche Hinrichtung durch Steinigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: er bewarf … mit Steinen
  rationale: Das Piel von סקל mit בָּאֲבָנִים bezeichnet hier das feindselige Werfen von Steinen auf jemanden. „Mit Steinen bewerfen“ gibt die konkrete Handlung natürlich wieder, ohne zwingend eine förmliche Hinrichtung durch Steinigung anzudeuten.
- source_word: עַבְדֵי
  choice: Diener
  rationale: עבד bezeichnet hier allgemein Personen im Dienst des Königs. „Diener“ wahrt die Bedeutungsbreite besser als „Sklaven“ und ist unmittelbarer als „Beamte“ oder „Gefolgsleute“.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: König Davids
  rationale: Im Deutschen verbindet der Genitiv „Diener König Davids“ den Königstitel idiomatisch mit dem Eigennamen und entspricht der hebräischen Wortgruppe.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: עַם hat die Grundbedeutung „Volk“ und meint hier die David begleitende Menschengruppe, die nicht auf Soldaten eingeengt werden sollte.
- source_word: הַגִּבֹּרִים
  choice: die Krieger
  rationale: גִּבֹּרִים bezeichnet in diesem Zusammenhang kampferprobte beziehungsweise tapfere Männer. „Krieger“ ist im heutigen Deutsch klarer als die traditionelle Wendung „Helden“ oder „starke Männer“.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: rechts und links von ihm
  rationale: Die Wendung bezeichnet die Aufstellung auf beiden Seiten. Das Suffix bezieht sich im Zusammenhang am ehesten auf David; die deutsche Formulierung bleibt natürlich und prägnant.
- source_word: וְכָל הָעָם וְכָל הַגִּבֹּרִים
  choice: während das ganze Volk und alle Krieger … gingen
  rationale: Der hebräische Nominalsatz beschreibt die begleitende Aufstellung, während Schimi warf. Das ergänzte „gingen“ macht die fortlaufende Szene im Deutschen verständlich, ohne die Aussage inhaltlich einzuengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt den Kontrast zwischen Schimis Angriff und Davids beidseitiger Begleitung. „Krieger“ vermittelt die militärische Bedeutung von גִּבֹּרִים ohne altertümliche Ausdrucksweise.
