base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/023.yaml
  text: The counsel of Ahithophel that he gave in those days was as if one inquired of God[a]; so was all the counsel of Ahithophel both to David and to Absalom.
translation:
  language: de
  text: Der Rat Ahitofels, den er in jenen Tagen gab, war wie wenn man Gott befragte[a]; so war jeder Rat Ahitofels, sowohl für David als auch für Abschalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie wenn man nach einem Wort Gottes fragte“. Der hebräische Vergleich hebt hervor, wie hoch Ahitofels Rat angesehen war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת אֲחִיתֹפֶל
  choice: Ahitofels Rat
  rationale: „Rat“ gibt die höfische Beratungssprache natürlich wieder und bewahrt die Wiederholung des hebräischen Substantivs.
- source_word: אֲשֶׁר יָעַץ
  choice: den er … gab
  rationale: Die Verbindung „Rat geben“ ist im Deutschen idiomatisch und entspricht dem hebräischen Verb für Beraten.
- source_word: בַּיָּמִים הָהֵם
  choice: in jenen Tagen
  rationale: Eine genaue, natürliche Wiedergabe der Zeitangabe.
- source_word: כַּאֲשֶׁר יִשְׁאַל בִּדְבַר הָאֱלֹהִים
  choice: als hätte man Gott befragt
  rationale: Die generische Aussage und der Vergleich werden gewahrt. Die Formulierung gibt das Einholen göttlicher Auskunft wieder, ohne Ahitofels Rat mit Offenbarung gleichzusetzen.
- source_word: כֵּן כָּל עֲצַת אֲחִיתֹפֶל
  choice: So wurde jeder Rat Ahitofels angesehen
  rationale: „So“ nimmt den Vergleich auf; „jeder Rat“ gibt כָּל distributiv und im Deutschen klar wieder. „Angesehen“ macht die im Kontext vorausgesetzte Wertschätzung verständlich.
- source_word: גַּם לְדָוִד גַּם לְאַבְשָׁלֹם
  choice: sowohl bei David als auch bei Abschalom
  rationale: „Sowohl … als auch“ spiegelt גַּם … גַּם; „bei“ bezeichnet natürlich die Geltung seines Rates für beide Königsfiguren.
theological_decisions:
- issue: Vergleich von Ahitofels Rat mit einer Gottesbefragung
  choice: „galt so viel, als hätte man Gott befragt“
  alternative: „war, wie wenn man nach einem Wort Gottes fragte“
  rationale: Der Text beschreibt die außergewöhnliche Autorität, die Ahitofels Rat zugeschrieben wurde, setzt ihn aber durch die Vergleichsform nicht ausdrücklich mit göttlicher Offenbarung gleich. Die gewählte Fassung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namen folgen den im Deutschen geläufigen biblischen Formen „Ahitofel“ und „Abschalom“. Der Satz bleibt eng am hebräischen Vergleich, vermeidet jedoch eine im Deutschen missverständliche Gleichsetzung mit inspirierter Offenbarung.
