  yaml_path: translation/ot/2_samuel/016/004.yaml
  text: Then the king said to Ziba, “Look, all that belongs to Mephibosheth is yours.” And Ziba said, “I bow down; may I find favor in your eyes, my lord the king.”
translation:
  language: de
  text: 'Da sagte der König zu Ziba: »Sieh, alles, was Mefi-Boschet gehört, gehört dir.« Ziba antwortete: »Ich werfe mich vor dir nieder. Möge ich Gunst finden in deinen Augen, mein Herr und König.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden Charakter der Partikel in knapper, natürlicher Form.
- source_word: לְךָ כֹּל אֲשֶׁר לִמְפִי בֹשֶׁת
  choice: alles, was Mefi-Boschet gehört, soll dir gehören
  rationale: Das erste לְךָ bezeichnet hier die königliche Zuweisung; »soll dir gehören« macht diesen performativen Sinn im Deutschen deutlich, ohne eine bereits bestehende Besitzlage zu behaupten.
- source_word: הִשְׁתַּחֲוֵיתִי
  choice: Ich werfe mich vor dir nieder
  rationale: Gibt die körperliche Huldigung gegenüber dem König konkret wieder; das hebräische Perfekt kann in dieser direkten Rede als vollzogene beziehungsweise performative Handlung verstanden werden.
- source_word: אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: Möge ich Gunst finden in deinen Augen
  rationale: Bewahrt die hebräische Höflichkeitsformel und ihr Bild, statt sie zu einer bloßen Dankesformel umzudeuten.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr und König
  rationale: Natürliches deutsches Anredegefüge, das beide Titel erhält.
