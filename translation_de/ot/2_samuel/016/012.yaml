source:
  edition: WLC
  text: אוּלַ֛י יִרְאֶ֥ה יְהוָ֖ה ב/עונ/י וְ/הֵשִׁ֨יב יְהוָ֥ה לִ/י֙ טוֹבָ֔ה תַּ֥חַת קִלְלָת֖/וֹ הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/012.yaml
  text: Perhaps Yahweh will look on my affliction[a], and Yahweh will repay me with good in place of his cursing this day.
translation:
  language: de
  text: Vielleicht wird Jahwe mein Elend[a] ansehen, und Jahwe wird mir für Schimis Fluch an diesem Tag Gutes erweisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, dem Ketiv (der schriftlichen Form) folgend: »meine Schuld«.'
    reason: textual_variant
lexical_decisions:
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Gibt Davids vorsichtige Hoffnung natürlich wieder, ohne Gewissheit auszudrücken.
- source_word: יִרְאֶה
  choice: wird … ansehen
  rationale: Bewahrt das konkrete Bild des Sehens und vermittelt im Zusammenhang zugleich aufmerksames Wahrnehmen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: ב/עונ/י
  choice: mein Elend
  rationale: Folgt der überlieferten Lesung und dem Kontext von Davids gegenwärtiger Erniedrigung; die abweichende schriftliche Form wird in der Fußnote erhalten.
- source_word: וְהֵשִׁיב יְהוָה לִי טוֹבָה
  choice: und mir … Gutes erweisen
  rationale: Drückt die positive göttliche Vergeltung in natürlichem Deutsch aus. Die erneute Nennung Jahwes kann im Deutschen durch das fortgeführte Subjekt wiedergegeben werden, ohne den Bezug zu verändern.
- source_word: תַּחַת
  choice: anstelle
  rationale: 'Kennzeichnet den Austausch: Gutes tritt an die Stelle des Fluchens.'
- source_word: קִלְלָתוֹ
  choice: seines Fluchens
  rationale: Bewahrt gegenüber „seinem Fluch“ stärker den Vorgangscharakter von Schimis fortgesetzten Schmähungen.
- source_word: הַיּוֹם הַזֶּה
  choice: heute
  rationale: Ist die natürliche moderne deutsche Wiedergabe der hervorgehobenen Zeitangabe.
theological_decisions:
- issue: Deutung von ב/עונ/י angesichts von Ketiv und Qere
  choice: mein Elend
  alternative: meine Schuld
  rationale: Die traditionelle Lesung und der unmittelbare Zusammenhang sprechen für Davids gegenwärtiges Leid. Die schriftliche Form kann jedoch „meine Schuld“ bedeuten; diese echte textliche und theologische Spannung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe am hebräischen Bild, ist aber idiomatisch; „Jahwe“ gibt das Tetragramm als Eigennamen wieder.
