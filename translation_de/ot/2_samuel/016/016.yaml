lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als nun
  rationale: Die Wendung führt das nächste Ereignis der Erzählung ein. „Als nun“ gibt sowohl den zeitlichen Anschluss als auch den Fortgang der Handlung in natürlichem Deutsch wieder.
- source_word: בָּא
  choice: kam
  rationale: Das gewöhnliche Bewegungsverb bezeichnet hier Huschais Ankunft bei Absalom.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Huschai, der Arkiter
  rationale: Der Personenname und die Herkunftsbezeichnung werden in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: רֵעֶה דָוִד
  choice: Davids Freund
  rationale: Die knappe Genitivverbindung bewahrt die persönliche und zugleich politisch bedeutsame Beziehung zu David.
- source_word: אֶל אַבְשָׁלוֹם
  choice: zu Absalom
  rationale: Die Präposition bezeichnet sowohl bei der Ankunft als auch beim anschließenden Reden die Hinwendung zu Absalom.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Natürliche deutsche Wiedergabe der üblichen Einleitung direkter Rede.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Es lebe der König!
  rationale: Die feste deutsche Akklamationsform gibt den Jussiv idiomatisch und mit seinem königlichen Zurufcharakter wieder.
- source_word: יְחִי הַמֶּלֶךְ (wiederholt)
  choice: Es lebe der König!
  rationale: Die Wiederholung des Hebräischen bleibt erhalten; sie verstärkt den öffentlichen Zuruf und bewahrt zugleich die erzählerische Mehrdeutigkeit von Huschais Loyalität.
theological_decisions:
- issue: Mehrdeutigkeit von Huschais Zuruf an Absalom
  choice: Der königliche Zuruf wird ohne deutende Ergänzung wiedergegeben.
  alternative: Ironie oder Täuschungsabsicht ausdrücklich in den Wortlaut aufnehmen.
  rationale: Der Vers selbst formuliert eine normale königliche Akklamation. Erst der weitere Zusammenhang macht Huschais strategische Absicht sichtbar; die Übersetzung soll diese Spannung nicht vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die doppelte Akklamation und ihre im Kontext bedeutsame Mehrdeutigkeit bleiben erhalten.
