  text: הֵשִׁיב֩ עָלֶ֨י/ךָ יְהוָ֜ה כֹּ֣ל דְּמֵ֣י בֵית שָׁא֗וּל אֲשֶׁ֤ר מָלַ֨כְתָּ֙ תחת/ו וַ/יִּתֵּ֤ן יְהוָה֙ אֶת הַ/מְּלוּכָ֔ה בְּ/יַ֖ד אַבְשָׁל֣וֹם בְּנֶ֑/ךָ וְ/הִנְּ/ךָ֙ בְּ/רָ֣עָתֶ֔/ךָ כִּ֛י אִ֥ישׁ דָּמִ֖ים אָֽתָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/008.yaml
  text: Yahweh has brought back upon you all the blood of the house of Saul[a], in whose place you reigned, and Yahweh has given the kingdom into the hand of Absalom your son. And look, you are in your calamity[c][b], because you are a man of bloodshed.
translation:
  language: de
  text: Jahwe hat all das Blut des Hauses Saul auf dich zurückkommen lassen[a], an Sauls Stelle du König geworden bist. Und Jahwe hat das Königtum in die Hand deines Sohnes Abschalom gegeben. Und nun bist du in deinem Unheil[b], denn du bist ein Mann des Blutes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „all die Blute des Hauses Saul“. Gemeint sein können das vergossene Blut, das Blutvergießen oder die Blutschuld des Hauses Saul.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Und nun bist du in deiner Bosheit.“ Das hebräische Wort kann sowohl moralisch Böses als auch Unheil oder Unglück bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: '„Ein Mann des Blutes“ bezeichnet einen Menschen, der von Blutvergießen, Gewalt oder Blutschuld geprägt ist; möglich ist daher auch: „ein Mann des Blutvergießens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב עָלֶיךָ
  choice: hat ... auf dich zurückkommen lassen
  rationale: Der Hifil von שוב bezeichnet ein Verursachen der Rückkehr. Die Formulierung bewahrt das konkrete Bild, dass das vergossene Blut auf David zurückkommt, ohne es vorschnell mit „vergelten“ auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כֹּל דְּמֵי בֵית שָׁאוּל
  choice: all das Blut des Hauses Saul
  rationale: Das hebräische Pluralwort „Blute“ kann Blutvergießen oder Blutschuld bezeichnen. Die gewählte Form bleibt nahe am Bild des Ausgangstextes; die Bedeutungsbreite wird in der Fußnote erläutert.
- source_word: אֲשֶׁר מָלַכְתָּ תַחְתָּיו
  choice: an dessen Stelle du König geworden bist
  rationale: תחתיו bezeichnet hier die Nachfolge an Sauls Stelle. „König geworden bist“ gibt den Eintritt in die Königsherrschaft im Deutschen natürlicher wieder als „regiert hast“.
- source_word: וַיִּתֵּן ... אֶת הַמְּלוּכָה בְּיַד
  choice: hat das Königtum in die Hand ... gegeben
  rationale: Die Wendung bewahrt das hebräische Bild der Übergabe in jemandes Hand und bezeichnet damit die Übertragung von Herrschaft und Verfügungsgewalt.
- source_word: וְהִנְּךָ
  choice: Nun steckst du
  rationale: הנה lenkt nachdrücklich die Aufmerksamkeit auf Davids gegenwärtige Lage. „Nun“ erfüllt diese Diskursfunktion in natürlichem modernem Deutsch; „steckst“ macht die örtlich formulierte Wendung „in deinem Unheil“ idiomatisch.
- source_word: בְּרָעָתֶךָ
  choice: in deinem eigenen Unheil
  rationale: רעה kann moralisches Böses oder erfahrenes Unheil bezeichnen. Im Kontext verweist Schimi auf die Katastrophe, die David getroffen hat. „eigenen“ gibt das Suffix wieder, ohne eindeutig festzulegen, ob es selbst verschuldetes oder lediglich ihn betreffendes Unheil ist.
- source_word: אִישׁ דָּמִים
  choice: ein Mann des Blutes
  rationale: Die hebräische Wendung wird bildhaft bewahrt. Sie kennzeichnet einen Menschen durch Blutvergießen, Gewalt oder Blutschuld; eine Fußnote erschließt das Idiom.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Charakter als Eigenname.
- issue: Bedeutung von בְּרָעָתֶךָ
  choice: in deinem eigenen Unheil
  alternative: in deiner eigenen Bosheit
  rationale: Der unmittelbare Zusammenhang spricht von der gegenwärtigen Not infolge Abschaloms Aufstand. Die Übersetzung gibt Schimis Deutung wieder, bestätigt seine Anklage aber nicht als Urteil des Erzählers; die lexikalische Mehrdeutigkeit bleibt in der Fußnote sichtbar.
- issue: Charakter von Schimis Aussage
  choice: als direkte Anschuldigung ohne erzählerische Bestätigung wiedergegeben
  alternative: als objektives göttliches Urteil formuliert
  rationale: Der Vers berichtet Schimis Rede. Die kraftvolle Behauptung bleibt erhalten, wird jedoch nicht durch erklärende Zusätze theologisch bestätigt oder relativiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Bilder „zurückkommen lassen“, „in die Hand geben“ und „Mann des Blutes“ bleiben erhalten, während Satzbau und Verbwahl natürlich deutsch gestaltet sind. Die Fußnoten markieren echte lexikalische Mehrdeutigkeiten, ohne Schimis Anklage als Erzählerurteil auszugeben.
