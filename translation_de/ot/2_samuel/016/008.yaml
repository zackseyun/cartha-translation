  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen hebräischen Bilder insgesamt zutreffend wieder: der Hifil von שוב als Veranlassung einer Rückkehr, die Übergabe des Königtums „in die Hand“ und אִישׁ דָּמִים als bildhafte Anklage. Die Bezugnahme von „an dessen Stelle“ ist im Deutschen jedoch syntaktisch mehrdeutig und legt wegen „Haus Saul“ nahe, David habe an die Stelle eines Hauses getreten. תַּחְתָּיו bezieht sich in diesem Kontext auf Saul; das sollte explizit werden. Außerdem verstärkt „eigenen“ bei „deinem eigenen Unheil“ den Text unnötig und kann den Eindruck selbstverschuldeter Not erwecken.'
