  text: וַ/יֹּ֤אמֶר אֲחִיתֹ֨פֶל֙ אֶל אַבְשָׁלֹ֔ם בּ֚וֹא אֶל פִּלַגְשֵׁ֣י אָבִ֔י/ךָ אֲשֶׁ֥ר הִנִּ֖יחַ לִ/שְׁמ֣וֹר הַ/בָּ֑יִת וְ/שָׁמַ֤ע כָּל יִשְׂרָאֵל֙ כִּֽי נִבְאַ֣שְׁתָּ אֶת אָבִ֔י/ךָ וְ/חָ֣זְק֔וּ יְדֵ֖י כָּל אֲשֶׁ֥ר אִתָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/021.yaml
  text: Ahithophel said to Absalom[a], “Go in to your father’s concubines, whom he left to keep the house, and all Israel will hear that you have become odious to your father[c][b], and the hands of all who are with you will be strengthened.”
translation:
  language: de
  text: 'Ahitofel sagte zu Absalom: »Schlaf mit den Nebenfrauen deines Vaters[a], die er zurückgelassen hat, um das Haus zu bewachen. Dann wird ganz Israel hören, dass du dich bei deinem Vater verhasst gemacht hast[b], und alle, die bei dir sind, werden neuen Mut fassen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Geh zu«. Die Wendung ist hier ein Euphemismus für Geschlechtsverkehr.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »dass du für deinen Vater stinkend geworden bist«; gemeint ist, dass Absalom für ihn zutiefst widerwärtig beziehungsweise verhasst geworden ist.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Dann werden die Hände aller, die bei dir sind, stark werden«; das heißt, sie werden ermutigt und entschlossener.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא אֶל
  choice: Geh zu
  rationale: Die Wendung ist hier ein sexueller Euphemismus. »Geh zu« bewahrt die verhüllende Ausdrucksweise des Hebräischen; die Fußnote erläutert den Sinn.
- source_word: פִּלַגְשֵׁי
  choice: Nebenfrauen
  rationale: »Nebenfrauen« bezeichnet verständlich Frauen mit anerkannter, aber gegenüber einer Hauptfrau nachrangiger Stellung im altorientalischen Haushalt.
- source_word: הִנִּיחַ לִשְׁמוֹר הַבָּיִת
  choice: die er zurückgelassen hat, um das Haus zu hüten
  rationale: Die Wiedergabe bildet die Infinitivkonstruktion ab und erhält den Sinn von שמר als Hüten beziehungsweise Bewachen des königlichen Hauses.
- source_word: וְשָׁמַע כָּל יִשְׂרָאֵל
  choice: Dann wird ganz Israel hören
  rationale: Das Waw leitet hier die erwartete Folge des Rates ein. »Ganz Israel« bezeichnet kollektiv das Volk.
- source_word: נִבְאַשְׁתָּ אֶת אָבִיךָ
  choice: dass du dich bei deinem Vater verhasst gemacht hast
  rationale: Das Verb bezeichnet wörtlich das Stinkend- oder Widerwärtigwerden und hier bildlich einen endgültigen Bruch. Die deutsche Wendung gibt die soziale und politische Abscheu natürlich wieder.
- source_word: וְחָזְקוּ יְדֵי
  choice: werden neuen Mut fassen
  rationale: Wörtlich werden die Hände stark; idiomatisch geht es darum, dass Absaloms Anhänger ermutigt und in ihrer Entschlossenheit bestärkt werden.
- source_word: כָּל אֲשֶׁר אִתָּךְ
  choice: alle, die zu dir halten
  rationale: Die Formulierung bezeichnet diejenigen auf Absaloms Seite, ohne sie enger als eine bestimmte politische oder militärische Gruppe festzulegen.
theological_decisions:
- issue: Sexueller Euphemismus im königlich-politischen Rat
  choice: Die verhüllende Formulierung »Geh zu deinen Nebenfrauen« wird im Haupttext bewahrt und in einer Fußnote eindeutig erklärt.
  alternative: »Schlaf mit den Nebenfrauen deines Vaters« beziehungsweise »Hab Geschlechtsverkehr mit ihnen«
  rationale: So bleiben zugleich der Euphemismus und die Schwere des als öffentliches Zeichen eines unwiderruflichen Bruchs gedachten Handelns erhalten, ohne es zu verschleiern oder unnötig drastisch auszudrücken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und politisch zugespitzt. Der sexuelle Euphemismus wird bewahrt, während schwer verständliche hebräische Bilder im Haupttext idiomatisch wiedergegeben und in Fußnoten offengelegt werden.
