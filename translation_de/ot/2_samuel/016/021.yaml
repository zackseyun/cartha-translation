  to: 'Ahitofel sagte zu Absalom: »Schlaf mit den Nebenfrauen deines Vaters[a], die er zurückgelassen hat, um das Haus zu bewachen. Dann wird ganz Israel hören, dass du dich bei deinem Vater verhasst gemacht hast[b], und alle, die bei dir sind, werden neuen Mut fassen[c].«'
