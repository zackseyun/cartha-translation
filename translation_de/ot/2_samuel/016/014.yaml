source:
  edition: WLC
  text: וַ/יָּבֹ֥א הַ/מֶּ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ עֲיֵפִ֑ים וַ/יִּנָּפֵ֖שׁ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/014.yaml
  text: The king and all the people who were with him arrived weary[b][a], and they refreshed themselves there.
translation:
  language: de
  text: Der König und das ganze Volk, das bei ihm war, kamen erschöpft an. Dort schöpfte er neue Kraft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dort erholte er sich.“ Das hebräische Verb steht im Singular; möglicherweise ist jedoch das gesamte Volk mitgemeint: „Dort schöpften sie neue Kraft.“'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kamen … an
  rationale: בוא bezeichnet hier das Erreichen eines Ortes. Wegen des zusammengesetzten Subjekts ist im natürlichen Deutschen der Plural erforderlich, auch wenn das Hebräische das Verb formal im Singular an den zuerst genannten „König“ anschließt.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die bestimmte Amtsbezeichnung wird beibehalten; obwohl im Kontext David gemeint ist, nennt der hebräische Text ihn hier nicht beim Namen.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: und das ganze Volk, das bei ihm war
  rationale: Die ausdrücklich vorhandene Relativkonstruktion wird vollständig und idiomatisch wiedergegeben.
- source_word: עֲיֵפִים
  choice: erschöpft
  rationale: Das pluralische Adjektiv beschreibt die körperliche Ermüdung des Königs und seiner Begleiter; „erschöpft“ ist gegenwärtiges, klares Deutsch.
- source_word: וַיִּנָּפֵשׁ
  choice: er schöpfte neue Kraft
  rationale: Die Singularform wird bewahrt und auf den König als hervorgehobenes Subjekt bezogen. Die Wendung gibt das Aufatmen beziehungsweise Sich-Erholen genauer wieder als bloßes „ruhte“.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb bezeichnet den Ort, an dem der König sich erholte.
theological_decisions: []
