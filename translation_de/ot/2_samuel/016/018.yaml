  text: וַ/יֹּ֣אמֶר חוּשַׁי֮ אֶל אַבְשָׁלֹם֒ לֹ֕א כִּי֩ אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה וְ/הָ/עָ֥ם הַ/זֶּ֖ה וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֑ל לא אֶהְיֶ֖ה וְ/אִתּ֥/וֹ אֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/018.yaml
  text: Hushai said to Absalom[a], “No, for the one whom Yahweh and this people and all the men of Israel have chosen—I will be his[c][b], and with him I will remain.”
translation:
  language: de
  text: 'Huschai sagte zu Abschalom: »Nein, denn dem, den Jahwe, dieses Volk und alle Männer Israels[a] erwählt haben, werde ich angehören[b], und bei ihm werde ich bleiben[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »jeder Mann Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Konsonantentext (Ketiv) hat hier לא, »nicht«; das masoretische Qere liest לו, »ihm«: »Ihm werde ich angehören.«'
    reason: textual_variant
  - marker: c
    text: 'Oder: »und bei ihm werde ich wohnen/sitzen«; das hebräische Verb kann je nach Zusammenhang auch diese Bedeutungen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: Nein! Denn
  rationale: Die Wortfolge weist zunächst Abschaloms Verdacht entschieden zurück und begründet dann Huschais Antwort. »Nein! Denn« bewahrt sowohl den Widerspruch als auch den erklärenden Anschluss.
- source_word: אֲשֶׁר בָּחַר
  choice: dem, den … erwählt haben
  rationale: Der Relativsatz bezeichnet eine konkrete Person. Das Perfekt בָּחַר wird als bereits vollzogene Wahl wiedergegeben; wegen des mehrteiligen Subjekts steht das deutsche Verb im Plural.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְהָעָם הַזֶּה
  choice: dieses Volk
  rationale: Die singularische Kollektivbezeichnung mit Demonstrativ wird im Deutschen direkt und natürlich als »dieses Volk« wiedergegeben.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: alle Männer Israels
  rationale: Die idiomatische deutsche Wendung gibt die umfassende, distributive Bedeutung wieder; die wörtlichere Form wird in einer Fußnote dokumentiert.
- source_word: לא אֶהְיֶה
  choice: werde ich angehören
  rationale: Im Zusammenhang ist eine Zugehörigkeits- beziehungsweise Loyalitätsaussage gemeint. Das überlieferte Verständnis liest לו, »ihm«, während der vorgelegte Konsonantentext לא, »nicht«, bietet; diese textliche Spannung wird in der Fußnote offengelegt.
- source_word: וְאִתּוֹ אֵשֵׁב
  choice: und bei ihm werde ich bleiben
  rationale: יָשַׁב kann wörtlich »sitzen« heißen, bezeichnet hier aber das Bleiben bei beziehungsweise im Dienst einer Person.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. Die Transliteration bewahrt, dass hier ein Name und nicht lediglich ein Titel steht.
- issue: Mehrdeutigkeit von Huschais Loyalitätserklärung
  choice: Die Aussage wird als Zugehörigkeit zu dem von Jahwe und Israel Erwählten übersetzt, ohne die dadurch entstehende mögliche Doppelbödigkeit aufzulösen.
  alternative: Die Aussage ausdrücklich und ausschließlich auf Abschalom beziehen.
  rationale: Huschais Formulierung kann von Abschalom auf sich bezogen werden, lässt sich im Erzählzusammenhang aber zugleich auf David beziehen. Die Übersetzung soll diese erzählerische und theologische Spannung erhalten.
- issue: Textform לא gegenüber לו vor אֶהְיֶה
  choice: Im Haupttext »werde ich angehören« nach dem kontextuell erwarteten לו; die abweichende Konsonantenform לא wird vermerkt.
  alternative: »werde ich nicht sein«
  rationale: Die Negation ergibt an dieser Stelle syntaktisch und im unmittelbaren Zusammenhang kaum einen sinnvollen Satz. Die traditionelle Lesung לו erklärt die Zugehörigkeitsaussage und verlangt nur die häufig verwechselten Buchstaben א/ו auseinanderzuhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und bestimmt. »Angehören« macht die im Hebräischen elliptische Loyalitätsformel verständlich, ohne Huschais bewusst doppeldeutige Bezugnahme auf den Erwählten vorschnell festzulegen.
