  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ אֶל חוּשַׁ֔י זֶ֥ה חַסְדְּ/ךָ֖ אֶת רֵעֶ֑/ךָ לָ֥/מָּה לֹֽא הָלַ֖כְתָּ אֶת רֵעֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/017.yaml
  text: Absalom said to Hushai[a], “Is this your loyalty to your friend? Why did you not go with your friend?”
translation:
  language: de
  text: 'Abschalom sagte zu Huschai: »Ist das deine Treue zu deinem Freund? Warum bist du nicht mit deinem Freund gegangen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַסְדְּךָ
  choice: deine Treue
  rationale: חֶסֶד kann Güte, beständige Liebe oder Loyalität bezeichnen. Hier wirft Abschalom Huschai mangelnde Verbundenheit mit David vor; »Treue« gibt den persönlichen und politischen Sinn natürlich wieder, ohne ausdrücklich eine bundestheologische Bedeutung einzutragen.
- source_word: רֵעֶךָ
  choice: deinem Freund
  rationale: רֵעַ bezeichnet einen Freund, Gefährten oder Vertrauten. Hier meint Abschalom David; »Freund« ist im Deutschen natürlich und bewahrt die Wiederholung des hebräischen Textes.
- source_word: לָמָּה לֹא הָלַכְתָּ אֶת רֵעֶךָ
  choice: Warum bist du nicht mit deinem Freund gegangen?
  rationale: הלך mit אֶת drückt hier das Mitgehen mit einer Person aus. Die Formulierung ist schlicht und entspricht der verbalen Einfachheit des Hebräischen.
- source_word: זֶה חַסְדְּךָ אֶת רֵעֶךָ
  choice: Ist das deine Treue zu deinem Freund?
  rationale: Der hebräische Nominalsatz wird im Zusammenhang als vorwurfsvolle rhetorische Frage verstanden. Im Deutschen wird die Kopula ergänzt; »zu deinem Freund« gibt die relationale Ausrichtung wieder.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das übliche hebräische Erzählverb wird mit »sagte« wiedergegeben; die Frageform ergibt sich aus der direkten Rede.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe rhetorische Schärfe und die zweimalige Nennung von »deinem Freund« bleiben erhalten. Keine Fußnote ist nötig, da »Treue« den kontextuellen Sinn von חֶסֶד klar und angemessen wiedergibt.
