  text: וַ/יַּטּ֧וּ לְ/אַבְשָׁל֛וֹם הָ/אֹ֖הֶל עַל הַ/גָּ֑ג וַ/יָּבֹ֤א אַבְשָׁלוֹם֙ אֶל פִּֽלַגְשֵׁ֣י אָבִ֔י/ו לְ/עֵינֵ֖י כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/022.yaml
  text: So they pitched the tent for Absalom on the roof[a], and Absalom went in to his father's concubines in the sight of all Israel.
translation:
  language: de
  text: Da schlug man für Absalom auf dem Dach das Zelt auf, und Absalom ging vor den Augen ganz Israels zu den Nebenfrauen seines Vaters ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Er hatte Geschlechtsverkehr mit ihnen.'
    reason: Die im Haupttext bewahrte hebräische Umschreibung wird für heutige Leser erläutert.
lexical_decisions:
- source_word: וַיַּטּוּ
  choice: schlug man … auf
  rationale: נטה bezeichnet hier das Aufspannen oder Aufstellen eines Zeltes. Die unpersönliche Form mit „man“ gibt die nicht näher genannten Handelnden im Deutschen natürlich wieder.
- source_word: הָאֹהֶל
  choice: das Zelt
  rationale: Der bestimmte Artikel wird bewahrt; gemeint ist das für die öffentlich sichtbare Handlung aufgestellte Zelt.
- source_word: עַל הַגָּג
  choice: auf dem Dach
  rationale: Die direkte Ortsangabe entspricht dem Hebräischen und wahrt den Zusammenhang öffentlicher Sichtbarkeit.
- source_word: וַיָּבֹא ... אֶל
  choice: ging … zu … ein
  rationale: Die traditionelle deutsche Wendung bewahrt den hebräischen Euphemismus für Geschlechtsverkehr, ohne ihn zu verharmlosen oder expliziter als die Vorlage zu formulieren.
- source_word: פִּלַגְשֵׁי אָבִיו
  choice: die Nebenfrauen seines Vaters
  rationale: „Nebenfrauen“ ist eine verständliche, sachlich passende Wiedergabe von פִּילֶגֶשׁ im königlichen und familiären Kontext.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: vor den Augen ganz Israels
  rationale: Die körperbildliche Ausdrucksweise der Vorlage wird erhalten und macht den öffentlichen Charakter der Tat deutlich.
theological_decisions:
- issue: Wiedergabe des sexuellen Euphemismus im Kontext von Absaloms Thronraub
  choice: ging … zu den Nebenfrauen seines Vaters ein
  alternative: hatte Geschlechtsverkehr mit den Nebenfrauen seines Vaters; schlief mit den Nebenfrauen seines Vaters
  rationale: Die gewählte Form erhält die verhüllende, zugleich eindeutig sexuelle Ausdrucksweise des Hebräischen und fügt weder klinische noch umgangssprachliche Direktheit hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt erzählerisch klar; der sexuelle Euphemismus der Vorlage wird im Haupttext bewahrt und in einer knappen Fußnote erklärt.
