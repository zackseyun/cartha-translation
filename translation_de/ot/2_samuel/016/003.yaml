  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ וְ/אַיֵּ֖ה בֶּן אֲדֹנֶ֑י/ךָ וַ/יֹּ֨אמֶר צִיבָ֜א אֶל הַ/מֶּ֗לֶךְ הִנֵּה֙ יוֹשֵׁ֣ב בִּ/ירוּשָׁלִַ֔ם כִּ֣י אָמַ֔ר הַ/יּ֗וֹם יָשִׁ֤יבוּ לִ/י֙ בֵּ֣ית יִשְׂרָאֵ֔ל אֵ֖ת מַמְלְכ֥וּת אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/003.yaml
  text: Then the king said[a], “And where is your master's son?” Ziba said to the king, “Look, he is staying in Jerusalem, for he said, ‘Today the house of Israel will restore to me the kingdom of my father.’”
translation:
  language: de
  text: 'Da sagte der König: »Und wo ist der Sohn deines Herrn?« Ziba antwortete dem König: »Sieh, er hält sich in Jerusalem auf[a], denn er sagte: ›Heute wird mir das Haus Israel das Königtum meines Vaters zurückgeben.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »er bleibt in Jerusalem«; das hebräische Partizip kann ein fortgesetztes Verweilen oder Wohnen bezeichnen, nicht nur wörtliches Sitzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Da sagte der König
  rationale: Das Narrativ-Waw führt die Handlung weiter; „da“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder. Das allgemeine Redeverb bleibt erhalten, obwohl der folgende Satz eine Frage ist.
- source_word: וְאַיֵּה
  choice: Und wo ist
  rationale: Gibt sowohl die Ortsfrage als auch die verbindende Konjunktion wieder.
- source_word: בֶּן אֲדֹנֶיךָ
  choice: der Sohn deines Herrn
  rationale: אדון bezeichnet hier Zibas menschlichen Herrn; „Herr“ bewahrt die soziale Beziehung, ohne einen göttlichen Titel anzudeuten.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die deiktische Partikel leitet Zibas Antwort mit einem Aufmerksamkeitssignal ein; „Sieh“ ist knapp, verständlich und weniger altertümlich als „Siehe“.
- source_word: יוֹשֵׁב
  choice: hält sich ... auf
  rationale: Das Partizip von ישׁב bezeichnet hier plausibel das Bleiben oder Verweilen an einem Ort, nicht notwendig ein körperliches Sitzen.
- source_word: כִּי
  choice: denn
  rationale: Leitet die von Ziba angeführte Begründung für den Aufenthalt in Jerusalem ein.
- source_word: יָשִׁיבוּ לִי
  choice: wird mir ... zurückgeben
  rationale: Der Hifil von שוב bedeutet „zurückbringen“ oder „zurückgeben“; die deutsche Formulierung wahrt den Gedanken einer Rückübertragung.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Bewahrt den korporativ-nationalen Ausdruck des Hebräischen, statt ihn zu „Israel“ zu verkürzen.
- source_word: מַמְלְכוּת אָבִי
  choice: das Königtum meines Vaters
  rationale: „Königtum“ kann sowohl die Königsherrschaft als auch das damit verbundene Reich bezeichnen und entspricht der dynastischen Aussage, ohne sie weiter auszulegen.
theological_decisions:
- issue: Zibas Bericht über die Absicht des Sohnes seines Herrn
  choice: Zibas Aussage wird als direkte berichtete Rede ohne wertende Zusätze wiedergegeben.
  alternative: Durch Wörter wie „angeblich“ oder „behauptete“ ausdrücklich Abstand von der Aussage nehmen.
  rationale: Der hebräische Vers berichtet Zibas Anschuldigung, bestätigt aber an dieser Stelle nicht ihre Wahrheit. Die Übersetzung fügt daher weder Zustimmung noch Skepsis hinzu und überlässt die Beurteilung dem Erzählzusammenhang.
- issue: Bedeutungsumfang von מַמְלָכָה
  choice: Königtum
  alternative: Königreich
  rationale: „Königtum“ bewahrt die mögliche Spannung zwischen Herrschaftsgewalt und Reichsgebiet, statt ausschließlich ein Territorium zu bezeichnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt eng an der hebräischen Satzfolge; „hält sich ... auf“ vermeidet das missverständliche wörtliche „sitzt“, während die Fußnote die Bedeutungsbreite offenlegt.
