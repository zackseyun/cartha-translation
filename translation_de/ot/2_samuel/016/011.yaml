  text: וַ/יֹּ֨אמֶר דָּוִ֤ד אֶל אֲבִישַׁי֙ וְ/אֶל כָּל עֲבָדָ֔י/ו הִנֵּ֥ה בְנִ֛/י אֲשֶׁר יָצָ֥א מִ/מֵּעַ֖/י מְבַקֵּ֣שׁ אֶת נַפְשִׁ֑/י וְ/אַ֨ף כִּֽי עַתָּ֜ה בֶּן הַ/יְמִינִ֗י הַנִּ֤חוּ ל/וֹ֙ וִֽ/יקַלֵּ֔ל כִּ֥י אָֽמַר ל֖/וֹ יְהוָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
translation:
  language: de
  text: 'Da sagte David zu Abischai und allen seinen Dienern: „Seht, mein Sohn, der aus meinem eigenen Leib hervorgegangen ist, trachtet mir nach dem Leben. Wie viel mehr erst dieser Benjaminiter! Lasst ihn in Ruhe und lasst ihn fluchen, denn Jahwe hat es ihm aufgetragen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „denn Jahwe hat zu ihm gesagt“. Der hebräische Text nennt nicht ausdrücklich, was Jahwe gesagt hat; aus dem Zusammenhang ergibt sich, dass David das Fluchen meint.'
    reason: Der Haupttext gibt den im Zusammenhang vorausgesetzten Sinn wieder, während die Fußnote die syntaktische Offenheit des hebräischen Wortlauts bewahrt.
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Der Ausdruck lenkt nachdrücklich die Aufmerksamkeit auf Davids Vergleich. „Seht“ bewahrt diese hinweisende Kraft in natürlichem Deutsch.
- source_word: בְנִי אֲשֶׁר יָצָא מִמֵּעַי
  choice: mein Sohn, der aus meinem eigenen Leib hervorgegangen ist
  rationale: Die Formulierung bewahrt das anschauliche hebräische Bild natürlicher Abstammung, ohne das für einen männlichen Sprecher missverständliche „aus meinem Schoß“ zu verwenden.
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  choice: trachtet mir nach dem Leben
  rationale: Diese geläufige deutsche Wendung gibt das hebräische Idiom für den Versuch, jemanden zu töten, präzise und würdig wieder.
- source_word: וְאַף כִּי עַתָּה
  choice: Wie viel mehr dann jetzt
  rationale: 'Die Wiedergabe erhält die steigernde Schlussfolgerung: Wenn schon Davids eigener Sohn ihm nach dem Leben trachtet, ist das Verhalten dieses Benjaminiters umso weniger überraschend.'
- source_word: בֶּן הַיְמִינִי
  choice: dieser Benjaminiter
  rationale: Der Ausdruck bezeichnet einen Angehörigen des Stammes Benjamin; „Benjaminiter“ ist die knappe und übliche deutsche Bezeichnung.
- source_word: הַנִּחוּ לוֹ
  choice: Lasst ihn in Ruhe
  rationale: Der Imperativ Plural richtet sich an Davids Begleiter und fordert sie auf, nicht einzugreifen.
- source_word: וִיקַלֵּל
  choice: und lasst ihn fluchen
  rationale: Die an den Imperativ anschließende Verbform gestattet Schimis Fluchen; die deutsche Formulierung gibt diesen Zusammenhang klar wieder.
- source_word: כִּי אָמַר לוֹ יְהוָה
  choice: denn Jahwe hat es ihm aufgetragen
  rationale: Die kontextbezogene Wiedergabe macht deutlich, dass sich Davids Aussage auf das Fluchen bezieht, und bewahrt zugleich seine direkte Zuschreibung an Gott. Eine Fußnote dokumentiert, dass der hebräische Wortlaut den Inhalt des Gesagten nicht ausdrücklich nennt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Ob Davids Aussage Schimis Fluchen einem direkten göttlichen Auftrag oder lediglich Gottes Zulassung beziehungsweise Vorsehung zuschreibt
  choice: 'Direkte Zuschreibung in Davids Rede: „Jahwe hat es ihm aufgetragen“'
  alternative: „Jahwe hat es zugelassen“ oder wörtlicher „Jahwe hat zu ihm gesagt“
  rationale: Davids Worte führen Schimis Handeln unmittelbar auf Jahwes Reden zurück. Die Übersetzung schwächt diese theologische Spannung nicht zu bloßer Zulassung ab; die Fußnote hält jedoch offen, dass der hebräische Satz den Inhalt des Gesagten nicht ausdrücklich nennt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt eindringlich und bewahrt sowohl das körperlich-konkrete Abstammungsbild als auch die theologische Spannung von Davids Aussage.
