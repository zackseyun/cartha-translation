  to: 'Da sagte David zu Abischai und allen seinen Dienern: „Seht, mein Sohn, der aus meinem eigenen Leib hervorgegangen ist, trachtet mir nach dem Leben. Wie viel mehr erst dieser Benjaminiter! Lasst ihn in Ruhe und lasst ihn fluchen, denn Jahwe hat es ihm aufgetragen.[a]“'
