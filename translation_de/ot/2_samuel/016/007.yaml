base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/007.yaml
  text: And Shimei said as he cursed him[a], “Get out, get out[b], man of bloodshed and worthless man!”
translation:
  language: de
  text: 'Und Schimi sagte, während er ihn verfluchte: »Verschwinde, verschwinde, du Mann der Blutschuld[a] und du nichtswürdiger Mann[b]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: »Mann der Blute« (Plural). Der Ausdruck kann Schuld an vergossenem Blut oder Blutvergießen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »böser Mann«. Der hebräische Ausdruck bezeichnet hier einen nichtswürdigen oder verkommenen Menschen; er muss nicht als Eigenname »Belial« verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כֹה אָמַר
  choice: Und so sagte
  rationale: Gibt die hebräische Einleitung der folgenden wörtlichen Rede natürlich und zugleich formnah wieder.
- source_word: שִׁמְעִי
  choice: Schimi
  rationale: Verwendet die im Deutschen gebräuchliche biblische Namensform.
- source_word: בְּ/קַֽלְל/וֹ
  choice: während er ihn verfluchte
  rationale: Die Präposition mit Infinitivus constructus und Suffix bezeichnet eine gleichzeitige Handlung; das Objekt »ihn« ist im hebräischen Suffix ausgedrückt.
- source_word: צֵא צֵא
  choice: Fort mit dir, fort mit dir
  rationale: Die Wiederholung steigert den abweisenden Befehl. Diese deutsche Wendung erfasst in direkter Anrede die Aufforderung, zu verschwinden, natürlicher als das räumlich engere »Geh hinaus«.
- source_word: אִישׁ הַ/דָּמִים
  choice: Mann der Blutschuld
  rationale: Der idiomatische Plural »Blute« bezeichnet hier Schuld an vergossenem Blut beziehungsweise Blutvergießen; »Blutschuld« bewahrt den Vorwurfscharakter, ohne David eine nicht ausdrücklich genannte Blutgier zuzuschreiben.
- source_word: וְ/אִישׁ הַ/בְּלִיָּעַל
  choice: du nichtswürdiger Mann
  rationale: בְּלִיַּעַל ist hier ein abwertender Ausdruck für moralische Nichtswürdigkeit und kein zwingender Eigenname. Das wiederholte »Mann« erhält den Parallelismus.
theological_decisions:
- issue: Bedeutung von אִישׁ הַדָּמִים
  choice: Mann der Blutschuld
  alternative: Mann des Blutvergießens / Blutmensch
  rationale: Die Wiedergabe lässt den Vorwurf von Schuld an vergossenem Blut erkennen, ohne ihn als objektives Urteil des Erzählers oder als Aussage über Blutdurst festzuschreiben.
- issue: Wiedergabe von בְּלִיַּעַל
  choice: nichtswürdiger Mann
  alternative: böser Mann / Mann Belials
  rationale: Im alttestamentlichen Sprachgebrauch liegt hier ein allgemeines Schimpfwort für einen charakterlich verkommenen oder nichtswürdigen Menschen vor. »Belial« würde spätere Personifizierung unnötig in den Text eintragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit der energischen direkten Anrede »Fort mit dir«. Die zweimalige Setzung von »du« ist im Deutschen natürlich und macht die beiden parallelen Beschimpfungen deutlich. Sämtliche Fußnotenmarker stehen unmittelbar an den betreffenden Ausdrücken.
