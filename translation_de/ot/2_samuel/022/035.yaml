  yaml_path: translation/ot/2_samuel/022/035.yaml
  text: He trains my hands for battle[b][a], and my arms can bend a bow of bronze.
translation:
  language: de
  text: Er trainiert meine Hände für den Kampf[a], und meine Arme biegen einen Bogen aus Bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den Krieg“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und ein Bogen aus Bronze wird von meinen Armen gebogen“; das Hebräische beschreibt, wie sich der Bogen unter der Kraft meiner Arme biegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלַמֵּד
  choice: trainiert
  rationale: Das Partizip von למד bezeichnet Lehren beziehungsweise Einüben. Im militärischen Zusammenhang gibt „trainiert“ die praktische Vorbereitung natürlich wieder.
- source_word: יָדַי
  choice: meine Hände
  rationale: Die konkrete Körpermetapher und der Parallelismus mit „meine Arme“ bleiben erhalten.
- source_word: לַמִּלְחָמָה
  choice: für den Kampf
  rationale: מלחמה kann sowohl „Kampf“ als auch „Krieg“ bezeichnen. Hier passt „Kampf“ natürlich zur persönlichen militärischen Ausbildung.
- source_word: וְנִחַת
  choice: spannen
  rationale: Das seltene Verb beschreibt hier das Biegen beziehungsweise Spannen des Bogens. Die aktive deutsche Form mit den Armen als Subjekt gibt den gemeinten Kraftakt idiomatisch wieder, ohne eine zusätzliche Fähigkeitsaussage ausdrücklich einzuführen.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: einen bronzenen Bogen
  rationale: קשת bezeichnet den Bogen; נחושה kennzeichnet ihn als aus Bronze beziehungsweise Kupfer bestehend und betont damit seine außergewöhnliche Festigkeit.
- source_word: זְרֹעֹתַי
  choice: meine Arme
  rationale: Die wörtliche Mehrzahl bewahrt das körperliche Bild und die Entsprechung zu „meine Hände“.
theological_decisions:
- issue: Göttliche Urheberschaft militärischer Fähigkeit
  choice: Der Vers führt die Kampffertigkeit und Kraft des Sprechers auf Gott zurück, ohne die Aussage zu verallgemeinern oder zu vergeistlichen.
  alternative: Deutung als allgemeine Befähigung der Glaubenden zum geistlichen Kampf
  rationale: Der unmittelbare Zusammenhang ist ein königliches Danklied über konkrete Rettung und Befähigung im Kampf. Die Übersetzung wahrt diesen historischen Sinn.
- issue: Aussage des seltenen Verbs וְנִחַת
  choice: Die Hauptfassung beschreibt, dass die Arme des Sprechers den bronzenen Bogen spannen.
  alternative: 'Passive Wiedergabe: „Ein bronzener Bogen wird von meinen Armen gespannt.“'
  rationale: Die hebräische Form und Satzfügung sind ungewöhnlich. Die aktive deutsche Fassung ist natürlich, während die Fußnote die mögliche passive Nuance bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkreten Körperbilder „Hände“ und „Arme“ bleiben erhalten; „bronzener Bogen“ ist knapp und idiomatisch. Die ungewöhnliche hebräische Formulierung in der zweiten Vershälfte wird im Haupttext natürlich wiedergegeben und in der Fußnote transparent gemacht.
