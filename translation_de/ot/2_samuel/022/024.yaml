source:
  edition: WLC
  text: וָ/אֶהְיֶ֥ה תָמִ֖ים ל֑/וֹ וָ/אֶשְׁתַּמְּרָ֖/ה מֵ/עֲוֺנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/024.yaml
  text: I was blameless before him[b][a], and I kept myself from my iniquity.
translation:
  language: de
  text: Ich war untadelig vor ihm[a] und hütete mich vor meiner Schuld[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aufrichtig bei ihm« bzw. »ungeteilt ihm gegenüber«. Das hebräische Wort betont auch Ganzheit und Lauterkeit, nicht nur das Freisein von Tadel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vor meiner Verfehlung« bzw. »vor meiner Sünde«. Das hebräische Wort kann je nach Zusammenhang Verfehlung, Schuld oder Sünde bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: Ich war
  rationale: Das Qal-W wayyiqtol von היה wird im poetischen Rückblick natürlich als Vergangenheit wiedergegeben; die Verknüpfung mit dem vorausgehenden Kontext muss im Deutschen nicht eigens durch »und« ausgedrückt werden.
- source_word: תָמִים
  choice: untadelig
  rationale: Das Adjektiv bezeichnet hier moralische Integrität beziehungsweise ungeteilte Lauterkeit. »Untadelig« bewahrt die starke Selbstaussage, ohne zwingend absolute Sündlosigkeit zu behaupten.
- source_word: לוֹ
  choice: vor ihm
  rationale: 'Das wörtliche »ihm/bei ihm« hat hier relational-evaluativen Sinn: in Gottes Gegenwart beziehungsweise in seinen Augen. »Vor ihm« ist dafür im Deutschen prägnant und idiomatisch.'
- source_word: וָאֶשְׁתַּמְּרָה
  choice: hütete mich
  rationale: Die reflexive Form von שׁמר bezeichnet ein Sich-in-Acht-Nehmen oder Sich-Bewahren. »Ich hütete mich« gibt diese reflexive Wachsamkeit natürlich wieder.
- source_word: מֵעֲוֺנִי
  choice: vor meiner Schuld
  rationale: עָוֹן kann Verfehlung, Schuld oder deren Folge bezeichnen. »Schuld« bewahrt die moralische Schwere und lässt die im Kontext mögliche Bedeutungsbreite bestehen; die Präposition wird mit dem idiomatischen Verb »sich hüten vor« verbunden.
theological_decisions:
- issue: Ob Davids Aussage sündlose Vollkommenheit beansprucht
  choice: Eine starke Aussage persönlicher Integrität vor Gott, ohne absolute Sündlosigkeit ausdrücklich festzulegen
  alternative: Ein Anspruch auf absolute moralische Vollkommenheit
  rationale: '»Untadelig« wahrt die Spannung der hebräischen Aussage: תָמִים kann Ganzheit und Lauterkeit bezeichnen, während der zweite Halbvers zugleich von »meiner Schuld« spricht. Die Übersetzung löst diese Spannung nicht dogmatisch auf.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus bleibt knapp; »untadelig« und »Schuld« bewahren die starke moralische Sprache sowie ihre semantische und theologische Spannung.
