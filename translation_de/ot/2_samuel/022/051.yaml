base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/051.yaml
  text: He gives great salvation to his king and shows covenant faithfulness to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: de
  text: Er schenkt seinem König große Rettung[a] und erweist David, seinem Gesalbten[b], und dessen Nachkommen für immer Bundestreue[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er macht die Rettungstaten für seinen König groß.“ Möglich ist ebenso: „Er schenkt seinem König große Befreiungen“ oder „große Siege“.'
    reason: lexical_alternative
  - marker: b
    text: „Sein Gesalbter“ kann auch als „sein Messias“ wiedergegeben werden. Hier ist zunächst David beziehungsweise der davidische König gemeint; zugleich klingt ein weiterführender messianischer Bezug an.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „beständige Liebe“ beziehungsweise „loyale Güte“. Das hebräische Wort bezeichnet häufig verlässliche Liebe und Treue im Rahmen einer verbindlichen Beziehung oder eines Bundes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מגדיל
  choice: schenkt … große
  rationale: Das Hifil-Partizip bedeutet wörtlich „groß machend“. Zusammen mit יְשׁוּעוֹת bezeichnet es, dass Gott seinem König machtvolle Rettung zuteilwerden lässt; „schenkt … große“ ist im Deutschen natürlich und bewahrt den kausativen Sinn.
- source_word: יְשׁוּעוֹת
  choice: Rettung
  rationale: Der Plural bezeichnet Rettungstaten, Befreiungen oder Siege. Der kollektive Singular „Rettung“ klingt im Deutschen würdig und idiomatisch; die formnähere Mehrzahl wird in der Fußnote erhalten.
- source_word: מַלְכּוֹ
  choice: seinem König
  rationale: Die Form bezeichnet eindeutig „seinen König“ und bewahrt die Beziehung zwischen dem HERRN und dem davidischen König.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: und erweist … Bundestreue
  rationale: חֶסֶד bezeichnet hier beständige, loyale Güte im Rahmen der göttlichen Zusage an David. „Bundestreue erweisen“ gibt diesen Beziehungs- und Verheißungscharakter prägnant wieder.
- source_word: לִמְשִׁיחוֹ
  choice: seinem Gesalbten
  rationale: מָשִׁיחַ bedeutet zunächst „Gesalbter“. Im unmittelbaren Zusammenhang ist David beziehungsweise der davidische König gemeint; die Formulierung lässt zugleich die messianische Tragweite offen.
- source_word: לְדָוִד
  choice: David
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: וּלְזַרְעוֹ
  choice: und seinen Nachkommen
  rationale: זֶרַע ist grammatisch ein kollektiver Singular und meint hier Davids fortdauernde Nachkommenschaft. „Nachkommen“ ist im modernen Deutsch natürlich, ohne den kollektiven Sinn unnötig einzuengen.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unabsehbare beziehungsweise dauerhafte Fortgeltung und wird idiomatisch mit „für immer“ übersetzt.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im Kontext der Davidverheißung
  choice: Bundestreue
  alternative: beständige Liebe; loyale Güte
  rationale: Der Schluss des Liedes betont Gottes verlässliche, zugewandte Treue gegenüber David und seiner Linie. „Bundestreue“ macht den Verheißungszusammenhang sichtbar, während die Fußnote die breitere Bedeutungsweite wahrt.
- issue: Wiedergabe von מְשִׁיחוֹ
  choice: seinem Gesalbten
  alternative: seinem Messias
  rationale: Historisch bezieht sich der Ausdruck zunächst auf David beziehungsweise den davidischen König. „Gesalbter“ wahrt diesen unmittelbaren Bezug und lässt die weiterführende messianische Bedeutung bestehen, ohne beide Ebenen gleichzusetzen.
- issue: Reichweite von זַרְעוֹ
  choice: seinen Nachkommen
  alternative: seinem Nachkommen; seinem Samen
  rationale: Das hebräische Wort ist ein kollektiver Singular und kann eine Nachkommenschaft als Einheit bezeichnen. Die deutsche Mehrzahl gibt den dynastischen Zusammenhang natürlich wieder, ohne mögliche weiterführende Bezüge dogmatisch festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die parallele Satzstruktur bleibt erhalten. „Bundestreue“ und „Gesalbter“ bewahren die theologische Dichte des hebräischen Textes, während die Fußnoten echte lexikalische Alternativen und die historische wie messianische Spannung dokumentieren.
