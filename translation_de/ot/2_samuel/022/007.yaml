  text: בַּ/צַּר לִ/י֙ אֶקְרָ֣א יְהוָ֔ה וְ/אֶל אֱלֹהַ֖/י אֶקְרָ֑א וַ/יִּשְׁמַ֤ע מֵ/הֵֽיכָל/וֹ֙ קוֹלִ֔/י וְ/שַׁוְעָתִ֖/י בְּ/אָזְנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/007.yaml
  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
translation:
  language: de
  text: In meiner Bedrängnis rief ich zu Jahwe; zu meinem Gott rief ich. Er hörte aus seinem Tempel[a] meine Stimme, und mein Hilferuf drang an seine Ohren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Tempel“ kann auch „Palast“ oder „Heiligtum“ bedeuten; gemeint ist hier möglicherweise Gottes himmlische Wohnung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: In meiner Bedrängnis
  rationale: Die Wendung bezeichnet eine Lage der Not oder Bedrängnis. Die gewählte Formulierung ist idiomatisch, würdevoll und bewahrt das Bild existenzieller Enge.
- source_word: אֶקְרָא ... אֶקְרָא
  choice: rufe ich zu ... rufe ich
  rationale: Die Wiederholung von קרא wird im Deutschen bewahrt. „Zu jemandem rufen“ passt bei beiden Ergänzungen natürlich und gibt den flehentlichen Ruf wieder, ohne ihn stärker auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name transliteriert und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Die Singularform mit Suffix der ersten Person wird direkt possessiv wiedergegeben.
- source_word: וַיִּשְׁמַע
  choice: Da hört er
  rationale: „Da“ bildet den erzählenden Anschluss des Wayyiqtol ab; das Präsens passt zum vorangehenden poetischen Präsens und macht die erfahrene Antwort Gottes anschaulich. Die formale Vergangenheitswiedergabe bleibt als mögliche Alternative zu beachten.
- source_word: מֵהֵיכָלוֹ
  choice: aus seinem Tempel
  rationale: הֵיכָל kann Tempel, Palast oder Heiligtum bezeichnen. „Tempel“ bewahrt den geläufigen sakralen Sinn; die Mehrdeutigkeit und der mögliche Bezug auf Gottes himmlische Wohnung werden in der Fußnote genannt.
- source_word: קוֹלִי
  choice: meine Stimme
  rationale: Direkte und natürliche Wiedergabe des Substantivs mit Suffix der ersten Person.
- source_word: שַׁוְעָתִי
  choice: mein Hilferuf
  rationale: שַׁוְעָה bezeichnet einen Ruf um Hilfe. „Hilferuf“ ist knapp, idiomatisch und erhält die Dringlichkeit.
- source_word: בְּאָזְנָיו
  choice: dringt an seine Ohren
  rationale: Die hebräische Wendung lautet wörtlich „in seinen Ohren“. Die deutsche Formulierung bewahrt das körperhafte Bild und vermittelt zugleich verständlich, dass der Ruf gehört wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Gottes Wohnung in הֵיכָל
  choice: Tempel
  alternative: Palast; Heiligtum
  rationale: Das Wort trägt sowohl sakrale als auch königliche Bedeutungsnuancen und kann hier Gottes himmlische Wohnung meinen. „Tempel“ ist im Haupttext verständlich, während die Fußnote die echte lexikalische Offenheit wahrt.
- issue: Zeitwert von וַיִּשְׁמַע
  choice: Da hört er
  alternative: Da hörte er
  rationale: Die Form ist formal ein hebräischer Erzähltempus und kann vergangen wiedergegeben werden. Im Lied steht sie jedoch nach präsentisch übersetzten Imperfektformen; das Präsens stellt Gottes Antwort lebendig dar, ohne die vergangene Erfahrung auszuschließen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit poetisch-würdigem Klang. Die Wiederholung von „rufe ich“ und das konkrete Bild der Ohren bleiben erhalten. Die Satzstellung folgt dem Parallelismus des hebräischen Liedes, ohne unnatürlich zu wirken.
