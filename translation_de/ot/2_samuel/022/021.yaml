id: 2SA.22.21
reference: 2 Samuel 22:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִגְמְלֵ֥/נִי יְהוָ֖ה כְּ/צִדְקָתִ֑/י כְּ/בֹ֥ר יָדַ֖/י יָשִׁ֥יב לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/021.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: de
  text: Jahwe hat an mir gemäß meiner Gerechtigkeit gehandelt[a]; entsprechend der Reinheit meiner Hände[b] hat er mir vergolten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat mich belohnt“. Das hebräische Verb kann bedeuten, dass jemand entsprechend seinem Verhalten behandelt oder ihm entsprechend vergolten wird.'
    reason: lexical_alternative
  - marker: b
    text: „Reinheit meiner Hände“ ist ein hebräisches Bild für Unschuld oder Lauterkeit im eigenen Handeln.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: hat an mir … gehandelt
  rationale: גמל bezeichnet hier ein Handeln an jemandem, das dessen Verhalten entspricht, und kann insbesondere Vergeltung oder Belohnung meinen. Die Formulierung bewahrt die semantische Breite; der positive Vergeltungssinn wird durch den Parallelismus deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְּצִדְקָתִי
  choice: gemäß meiner Gerechtigkeit
  rationale: צדקה bezeichnet hier Davids rechtes beziehungsweise aufrichtiges Verhalten. „Gerechtigkeit“ gibt den Ausdruck direkt wieder, ohne die Aussage auf absolute Sündlosigkeit oder verdienstliche Erlösung auszuweiten.
- source_word: כְּבֹר יָדַי
  choice: entsprechend der Reinheit meiner Hände
  rationale: בֹּר bezeichnet Reinheit oder Sauberkeit. Die konkrete Metapher der reinen Hände bleibt erhalten und verweist auf schuldloses beziehungsweise lauteres Handeln.
- source_word: יָשִׁיב לִי
  choice: hat er mir vergolten
  rationale: Der Hifil von שוב bedeutet hier, jemandem etwas seinem Verhalten entsprechend zurückzugeben. „Vergelten“ passt zum poetischen Parallelismus und lässt den im Kontext positiven Sinn zu, ohne ihn stärker als der Ausgangstext festzulegen.
theological_decisions:
- issue: Ob Davids Rede von seiner Gerechtigkeit als Behauptung absoluter Sündlosigkeit oder als Verdienst vor Gott formuliert werden soll
  choice: Die Ich-Aussage über Gerechtigkeit und reine Hände wird unverändert in ihrer Spannung bewahrt und auf Davids Verhalten bezogen.
  alternative: Die Aussage abschwächen oder ausdrücklich als Behauptung vollkommener Sündlosigkeit beziehungsweise verdienstlicher Erlösung deuten.
  rationale: Der hebräische Text spricht ausdrücklich von „meiner Gerechtigkeit“ und der „Reinheit meiner Hände“, legt aber keine umfassende Lehre über Sündlosigkeit oder Heil durch Verdienst dar.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der poetische Parallelismus und das konkrete Bild der reinen Hände bleiben erhalten. Das Perfekt stellt die besungene göttliche Rettung als vollzogenes Handeln dar.
