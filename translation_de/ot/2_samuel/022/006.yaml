  text: חֶבְלֵ֥י שְׁא֖וֹל סַבֻּ֑/נִי קִדְּמֻ֖/נִי מֹֽקְשֵׁי מָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/006.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: de
  text: 'Die Stricke des Scheols[a] umgaben mich;

    die Schlingen des Todes traten mir entgegen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: des Grabes; oder: des Totenreichs.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: begegneten mir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: Stricke
  rationale: חבל bezeichnet Stricke oder Seile. „Stricke“ bewahrt das poetische Bild des Umschließens und entspricht der parallelen Rede von den „Schlingen“.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration erhält die hebräische Bezeichnung für den Bereich der Toten und legt den Ausdruck nicht vorschnell auf „Grab“ oder „Totenreich“ fest.
- source_word: סַבֻּנִי
  choice: umgaben mich
  rationale: Die Form von סבב bedeutet „umgeben, umringen“. „Umgaben mich“ ist im Deutschen klar und natürlich.
- source_word: קִדְּמֻנִי
  choice: traten mir entgegen
  rationale: קדם kann hier das Entgegentreten oder Begegnen ausdrücken. Im Zusammenhang mit tödlichen Schlingen gibt „traten mir entgegen“ den bedrohlichen Charakter wieder, ohne das Bild weiter auszudeuten.
- source_word: מֹקְשֵׁי
  choice: Schlingen
  rationale: מוקש bezeichnet eine Schlinge oder Falle. „Schlingen“ bildet einen anschaulichen poetischen Parallelismus zu „Stricke“.
- source_word: מָוֶת
  choice: Tod
  rationale: Direkte Wiedergabe des hebräischen Substantivs; der Genitiv „des Todes“ bewahrt die poetische Personifikation.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: das Grab; das Totenreich
  rationale: „Scheol“ bewahrt die Mehrdeutigkeit zwischen Grab, Tod und dem Bereich der Toten und vermeidet eine vorschnelle theologische Festlegung.
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Die beiden parallelen Zeilen und die konkreten Bilder von Stricken und Schlingen bleiben erhalten; die Satzstellung ist natürliches Standarddeutsch.
