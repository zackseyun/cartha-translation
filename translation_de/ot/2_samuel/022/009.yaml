  text: עָלָ֤ה עָשָׁן֙ בְּ/אַפּ֔/וֹ וְ/אֵ֥שׁ מִ/פִּ֖י/ו תֹּאכֵ֑ל גֶּחָלִ֖ים בָּעֲר֥וּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/009.yaml
  text: Smoke went up from his nostrils[a], and consuming fire from his mouth; coals blazed from him.
translation:
  language: de
  text: Rauch stieg aus seinen Nüstern[a] auf, und verzehrendes Feuer kam aus seinem Mund; Kohlen loderten aus ihm hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in seinem Zorn“. Das hebräische Wort kann „Nase/Nüstern“ bezeichnen und wird zugleich idiomatisch für „Zorn“ gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: Rauch stieg … auf
  rationale: Das Verb bezeichnet eine Aufwärtsbewegung; „stieg … auf“ gibt das konkrete poetische Bild im modernen Deutschen natürlich wieder.
- source_word: בְּאַפּוֹ
  choice: aus seinen Nüstern
  rationale: אַף kann „Nase/Nüstern“ oder idiomatisch „Zorn“ bedeuten. Die Parallele zu „aus seinem Mund“ spricht hier für das konkrete Körperbild; bei der Bewegung des Rauchs wird die Präposition im Deutschen idiomatisch mit „aus“ wiedergegeben.
- source_word: וְאֵשׁ מִפִּיו תֹּאכֵל
  choice: und verzehrendes Feuer kam aus seinem Mund
  rationale: „Verzehrendes Feuer“ bewahrt die aktive Bedeutung des Verbs תֹּאכֵל und ergibt zusammen mit der Herkunftsangabe eine natürliche deutsche Formulierung. „Kam“ macht die im Hebräischen durch die Präpositionalphrase ausgedrückte Bewegung idiomatisch deutlich.
- source_word: גֶּחָלִים
  choice: Kohlen
  rationale: Die schlichte Wiedergabe vermeidet den Zusatz „glühend“, da das folgende Verb das Brennen bereits ausdrückt.
- source_word: בָּעֲרוּ
  choice: loderten
  rationale: „Loderten“ erhält die lebhafte, poetische Feuerbildsprache besser als das neutralere „brannten“.
- source_word: מִמֶּנּוּ
  choice: aus ihm hervor
  rationale: Die Präposition bezeichnet hier am ehesten die Quelle; „aus ihm hervor“ bewahrt das Bild des von Gott ausgehenden Feuers.
theological_decisions:
- issue: Anthropomorphe Rede von Gott in der Theophanie
  choice: Die konkrete Bildsprache mit „Nüstern“, „Mund“, Rauch und Feuer wird beibehalten.
  alternative: בְּאַפּוֹ abstrakt als „in seinem Zorn“ wiedergeben und damit das Körperbild abschwächen.
  rationale: Der poetische Text schildert Gottes Zorn und Macht durch eine Theophanie mit körperhaften Bildern. Die konkrete Wiedergabe wahrt den Parallelismus und legt die Metapher nicht vorschnell abstrakt aus.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die kräftige anthropomorphe Bildwelt bleibt erhalten; „Nüstern“ ist bildhaft, aber allgemein verständlich.
