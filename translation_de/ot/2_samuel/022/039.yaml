  yaml_path: translation/ot/2_samuel/022/039.yaml
  text: I consumed them and shattered them[a], and they did not rise[b]; they fell under my feet.
translation:
  language: de
  text: Ich verzehrte sie[a] und zerschmetterte sie[b]; sie standen nicht auf und fielen unter meine Füße.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich vernichtete sie.“ Das hebräische Verb bedeutet wörtlich „verzehren“ und kann im Zusammenhang des Kampfes „vernichten“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zerschlug sie“ oder „zerquetschte sie“. „Unter meine Füße“ gibt wörtlich die Unterwerfung unter die Füße des Siegers wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲכַלֵּם
  choice: Ich vernichtete sie
  rationale: אכל bedeutet wörtlich „essen, verzehren“, kann im feindlichen bzw. kriegerischen Zusammenhang aber „vernichten“ ausdrücken. „Vernichtete“ gibt den Sinn im modernen Deutschen natürlich wieder; die wörtliche Bildsprache wird in der Fußnote bewahrt.
- source_word: וָאֶמְחָצֵם
  choice: und zerschmetterte sie
  rationale: מחץ bezeichnet ein gewaltsames Zerschlagen oder Zerschmettern. Die Wiedergabe bewahrt die drastische poetische Kriegssprache und die Abfolge zweier Verben.
- source_word: וְלֹא יְקוּמוּן
  choice: und sie standen nicht wieder auf
  rationale: Die Formulierung gibt die ausgesagte Folge wieder, ohne die nicht ausdrücklich markierte modale Aussage „sie konnten nicht“ einzuführen. „Wieder“ macht im Deutschen den kontextuellen Sinn des Sich-Erhebens nach dem Niederschlag klar.
- source_word: וַיִּפְּלוּ
  choice: sie fielen
  rationale: נפל wird direkt und knapp mit „fallen“ wiedergegeben und erhält so die poetische Bewegung.
- source_word: תַּחַת רַגְלָי
  choice: mir zu Füßen
  rationale: Wörtlich steht „unter meinen Füßen“. „Mir zu Füßen“ ist eine natürliche deutsche Wendung, die das Bild völliger Unterwerfung bzw. Niederlage bewahrt; die genaue räumliche Formulierung steht in der Fußnote.
theological_decisions:
- issue: Gewaltsame Kriegsbilder in Davids Siegeslied
  choice: Die Ich-Aussage über die vollständige Vernichtung der Feinde bleibt ohne Abschwächung erhalten.
  alternative: Eine verallgemeinernde Abschwächung wie „Ich besiegte sie vollständig“.
  rationale: Der hebräische Text verwendet drastische poetische Verben der Vernichtung und Unterwerfung. Diese Spannung wird nicht durch eine mildere Paraphrase aufgelöst.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der Parallelismus und die Härte der Kriegssprache bleiben erhalten; ungewöhnlich wörtliche Bildsprache wird durch Fußnoten zugänglich gemacht.
