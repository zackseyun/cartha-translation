  text: who brings me out from my enemies[a]; you exalt me above those who rise against me[b]; you deliver me from the violent man.
translation:
  language: de
  text: der mich meinen Feinden entreißt[a]. Du erhebst mich über die, die sich gegen mich erheben; vor einem Gewalttäter rettest du mich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der mich von meinen Feinden herausführt“. Das vorangestellte „und“ des Hebräischen verbindet diese Aussage mit der vorausgehenden Beschreibung Gottes.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vor einem Mann der Gewalttaten“. Auch möglich: „vor einem gewalttätigen Mann“. Der hebräische Ausdruck steht im Singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצִיאִי
  choice: der mich … entreißt
  rationale: Das Hifil-Partizip von יצא bezeichnet wörtlich den, der jemanden herausführt. Im Zusammenhang feindlicher Bedrohung gibt „entreißt“ die bewirkende Befreiung in natürlichem, poetischem Deutsch wieder; die konkretere Alternative wird in der Fußnote genannt.
- source_word: מֵאֹיְבָי
  choice: meinen Feinden
  rationale: Die Präposition מִן bezeichnet hier die Trennung beziehungsweise Befreiung von den Feinden. Bei „entreißen“ wird diese Beziehung im Deutschen durch den Dativ ausgedrückt.
- source_word: וּמִקָּמַי
  choice: über alle, die sich gegen mich erheben
  rationale: Die substantivische Form von קום bewahrt das Bild von Menschen, die sich in feindlicher Absicht gegen den Sprecher erheben. „Alle“ macht die substantivische Mehrzahl im Deutschen flüssig, ohne eine zusätzliche Personengruppe einzuführen.
- source_word: תְּרוֹמְמֵנִי
  choice: Du erhebst mich über
  rationale: Die Form von רום drückt ein Hochheben beziehungsweise Erhöhen über die Gegner aus. „Erhebst“ erhält sowohl das vertikale Bild als auch den Gedanken des Sieges.
- source_word: מֵאִישׁ חֲמָסִים
  choice: vor einem Mann der Gewalt
  rationale: אִישׁ steht im Singular; חֲמָסִים ist eine intensive beziehungsweise qualitative Pluralform zu „Gewalt, Gewalttat“. Die bewusst markante Wendung „Mann der Gewalt“ bildet beides ab, ohne den Singular zu verallgemeinern.
- source_word: תַּצִּילֵנִי
  choice: rettest du mich
  rationale: נצל bezeichnet das Retten oder Befreien aus Gefahr. „Retten“ ist im modernen Deutschen klar, würdig und passt zur Bedrohung durch Gewalt.
