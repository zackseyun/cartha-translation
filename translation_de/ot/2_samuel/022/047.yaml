source:
  edition: WLC
  text: חַי יְהוָ֖ה וּ/בָר֣וּךְ צוּרִ֑/י וְ/יָרֻ֕ם אֱלֹהֵ֖י צ֥וּר יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/047.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be God, the rock of my salvation.
translation:
  language: de
  text: Jahwe lebt! Gepriesen sei mein Fels! Hoch erhoben sei Gott, der Fels meiner Rettung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann die ungewöhnliche hebräische Wortfolge auch heißen: „der Gott des Felsens meiner Rettung“; sinngemäß auch: „Gott, mein rettender Fels“.'
    reason: syntaktische und lexikalische Alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Jahwe lebt!
  rationale: Die prädikative Verbindung ohne ausdrückliche Kopula ist hier eine feierliche, doxologische Aussage. Der Ausruf gibt die poetische Kraft im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּבָרוּךְ
  choice: Gepriesen sei
  rationale: In diesem Lobpreis hat das Partizip akklamatorische beziehungsweise benediktive Kraft. „Gepriesen sei“ klingt im Deutschen würdig und idiomatisch.
- source_word: צוּרִי
  choice: mein Fels
  rationale: Die konkrete Gottesmetapher wird bewahrt; sie vermittelt Beständigkeit, Schutz und Sicherheit, ohne sie durch eine Deutung wie „Zuflucht“ zu ersetzen.
- source_word: וְיָרֻם
  choice: Hoch erhoben sei
  rationale: Die Jussivform drückt im parallelen Lobpreis einen Wunsch beziehungsweise eine Akklamation aus. „Hoch erhoben sei“ bewahrt diese Nuance.
- source_word: אֱלֹהֵי צוּר יִשְׁעִי
  choice: Gott, der Fels meiner Rettung
  rationale: Die Wiedergabe versteht „Gott“ und „Fels meiner Rettung“ entsprechend dem poetischen Parallelismus appositionell. Da die masoretische Form auch eine strengere Konstruktverbindung zulässt, wird diese Mehrdeutigkeit in der Fußnote offengelegt.
- source_word: יִשְׁעִי
  choice: meiner Rettung
  rationale: „Rettung“ erhält den breiten Sinn von יֶשַׁע und passt zum feierlichen Kontext; „Befreiung“ wäre inhaltlich enger.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ wahrt seinen Charakter als Eigenname.
- issue: Gottesmetapher צוּר
  choice: Fels
  alternative: Felsklippe; Zuflucht
  rationale: Die Metapher wird nicht erklärend aufgelöst, damit ihre poetische und theologische Spannweite erhalten bleibt.
- issue: Syntaktische Deutung von אֱלֹהֵי צוּר יִשְׁעִי
  choice: 'appositionell: „Gott, der Fels meiner Rettung“'
  alternative: „der Gott des Felsens meiner Rettung“; „Gott, mein rettender Fels“
  rationale: Der poetische Parallelismus und die wiederholte Felsmetapher sprechen für die appositionelle Lesart. Die ungewöhnliche hebräische Konstruktfolge bleibt jedoch tatsächlich mehrdeutig und wird deshalb nicht verschwiegen.
translation_notes:
  register: Moderner, würdiger Lobpreisstil mit kurzen Ausrufen. Die parallele Struktur und die wiederholte Felsmetapher bleiben erhalten; die ungewöhnliche Syntax des letzten Glieds wird im Haupttext lesbar wiedergegeben und in der Fußnote transparent gemacht.
