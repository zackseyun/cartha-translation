  text: עִם נָבָ֖ר תִּתָּבָ֑ר וְ/עִם עִקֵּ֖שׁ תִּתַּפָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/027.yaml
  text: With the pure you show yourself pure[a], but with the crooked you show yourself twisted.
translation:
  language: de
  text: Dem Reinen gegenüber zeigst du dich rein, doch dem Verkehrten gegenüber zeigst du dich verdreht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb ist selten und schwer zu deuten. Möglich sind auch Wiedergaben wie: »du erweist dich als verschlagen« oder »du handelst ihm entgegen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: der Reine
  rationale: Das seltene Adjektiv bezeichnet einen reinen oder lauteren Menschen. „Rein“ bewahrt die unmittelbare Verbindung zum folgenden Verb desselben Wortstamms.
- source_word: תִּתָּבָר
  choice: du zeigst dich rein
  rationale: Die reflexive Verbform und die poetische Entsprechung zum Adjektiv werden so natürlich und zugleich formnah wiedergegeben.
- source_word: עִקֵּשׁ
  choice: der Verkehrte
  rationale: Das Wort bezeichnet einen moralisch verdrehten, verkehrten Menschen. „Verkehrt“ bildet einen klaren Gegensatz zu „rein“ und ist im Deutschen auf Personen bezogen idiomatisch.
- source_word: תִּתַּפָּל
  choice: du zeigst dich verdreht
  rationale: Das seltene und schwierige Verb bezeichnet hier wahrscheinlich ein entsprechendes, widerständiges Verhalten gegenüber dem Verkehrten. „Verdreht“ erhält die befremdliche Bildsprache und die theologische Spannung des Hebräischen, statt sie durch eine Deutung wie „klug“ aufzulösen.
- source_word: עִם
  choice: mit
  rationale: 'Die Präposition bezeichnet die relationale Entsprechung: Gottes Verhalten zeigt sich im Umgang mit dem jeweils beschriebenen Menschen.'
theological_decisions:
- issue: Wie Gottes Verhalten gegenüber dem Verkehrten wiederzugeben ist, ohne die Spannung des hebräischen Ausdrucks zu beseitigen
  choice: du zeigst dich verdreht
  alternative: du erweist dich als überlegen / du handelst ihm entgegen
  rationale: Die negative und auffällige Wortwahl des seltenen hebräischen Verbs wird beibehalten. Der Vers beschreibt Gottes entsprechendes Handeln gegenüber dem Verkehrten; er behauptet nicht ausdrücklich moralische Verkehrtheit Gottes. Eine Fußnote macht Schwierigkeit und mögliche Sinnrichtungen transparent.
translation_notes:
  register: Moderne, würdevolle poetische Sprache. Die Wiederholung „rein … rein“ bildet das hebräische Wortspiel ab; „verkehrt … verdreht“ wahrt den zugespitzten Parallelismus und die echte Deutungsunsicherheit.
