  text: וַ/יָּ֧שֶׁב יְהוָ֛ה לִ֖/י כְּ/צִדְקָתִ֑/י כְּ/בֹרִ֖/י לְ/נֶ֥גֶד עֵינָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/025.yaml
  text: And Yahweh repaid me according to my righteousness[b][a], according to my cleanness before his eyes.
translation:
  language: de
  text: Und Jahwe vergalt mir entsprechend meiner Gerechtigkeit, entsprechend meiner Reinheit[a] vor seinen Augen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lauterkeit“. Das hebräische Wort bezeichnet Reinheit oder Unverdorbenheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: „in seinen Augen“ oder „in seinem Urteil“.'
    reason: idiomatic_clarification
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: vergalt
  rationale: Das Verb bezeichnet hier eine erwidernde oder vergeltende Handlung. „Vergalt“ gibt den Gedanken der Zumessung wieder, ohne ihn auf eine ausschließlich positive Belohnung einzuengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִי
  choice: mir
  rationale: Die Präposition kennzeichnet das indirekte Objekt und wird im Deutschen idiomatisch mit dem Dativ ausgedrückt.
- source_word: כְּצִדְקָתִי
  choice: entsprechend meiner Gerechtigkeit
  rationale: צדקה bezeichnet Gerechtigkeit beziehungsweise Rechtschaffenheit. „Entsprechend“ gibt die zumessende Bedeutung der Präposition כְּ natürlich wieder.
- source_word: כְּבֹרִי
  choice: entsprechend meiner Reinheit
  rationale: בֹּר bezeichnet Reinheit oder Lauterkeit. „Reinheit“ wahrt die bildhafte und moralische Bedeutungsbreite; „Hände“ wird nicht ergänzt, da dieses Wort im hebräischen Text dieses Verses fehlt.
- source_word: לְנֶגֶד עֵינָיו
  choice: vor seinen Augen
  rationale: Die konkrete hebräische Wendung bleibt erhalten und ist im Deutschen verständlich; gemeint ist idiomatisch „in seinen Augen“ beziehungsweise „in seinem Urteil“.
theological_decisions:
- issue: Davids Aussage über seine eigene Gerechtigkeit und Reinheit
  choice: Die uneingeschränkte Ich-Aussage wird beibehalten.
  alternative: Die Aussage als relative Bundestreue oder als Unschuld nur in einer bestimmten Angelegenheit erklärend umschreiben.
  rationale: Der hebräische Text formuliert die Behauptung unmittelbar. Eine Übersetzung soll die Spannung zu Davids bekannten Verfehlungen nicht durch eine deutende Abschwächung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Hebräischen wird durch die Wiederholung von „entsprechend“ bewahrt; die konkrete Wendung „vor seinen Augen“ bleibt im Haupttext stehen.
