  text: וַ/יִּרְכַּ֥ב עַל כְּר֖וּב וַ/יָּעֹ֑ף וַ/יֵּרָ֖א עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/011.yaml
  text: He rode on a cherub and flew[a]; he appeared on the wings of the wind.
translation:
  language: de
  text: Er ritt auf einem Cherub und flog; er erschien auf den Flügeln des Windes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde er auf den Flügeln des Windes gesehen“. Das hebräische Verb kann „erschien“ oder passiv „wurde gesehen“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: er ritt
  rationale: Das Qal von רכב bezeichnet hier das Reiten auf einem Träger; „ritt“ bewahrt das konkrete poetische Bild.
- source_word: עַל כְּרוּב
  choice: auf einem Kerub
  rationale: Die Präposition bezeichnet die tragende Position. כְּרוּב steht im Singular; „Kerub“ ist die etablierte deutsche Bezeichnung des himmlischen Wesens.
- source_word: וַיָּעֹף
  choice: und flog dahin
  rationale: עוף bedeutet „fliegen“. „flog dahin“ klingt im Deutschen natürlich und gibt die voranschreitende poetische Bewegung wieder, ohne das stärkere „schwebte“ oder „schoss“ einzutragen.
- source_word: וַיֵּרָא
  choice: wurde er sichtbar
  rationale: Die Nifal-Form von ראה kann „wurde gesehen“, „zeigte sich“ oder „erschien“ bedeuten. „wurde sichtbar“ bildet die passive Erscheinungsnuance ab und bleibt in modernem Deutsch verständlich.
- source_word: כַּנְפֵי
  choice: auf den Flügeln
  rationale: Der Konstruktplural von כָּנָף bedeutet wörtlich „Flügel“ und erhält das anschauliche Bild.
- source_word: רוּחַ
  choice: des Windes
  rationale: רוּחַ bezeichnet in diesem theophanischen Zusammenhang am natürlichsten den Wind; „Geist“ oder „Sturmwind“ wäre hier stärker deutend.
theological_decisions:
- issue: Konkrete Bildsprache der Gotteserscheinung
  choice: Das Reiten auf dem Kerub und die Flügel des Windes werden unverändert als poetische Bilder wiedergegeben.
  alternative: Die Bilder als abstrakte Aussage über Gottes Macht oder Gegenwart umschreiben.
  rationale: Der hebräische Vers schildert die Gotteserscheinung in konkreter poetischer Sprache. Eine erklärende Abstraktion würde die Bildkraft und die theologische Spannung abschwächen.
- issue: Bedeutung von וַיֵּרָא
  choice: „wurde er sichtbar“
  alternative: „erschien er“ oder „wurde er gesehen“
  rationale: Die gewählte Form bewahrt den medial-passiven Charakter der Nifal-Form, ohne festzulegen, ob der Akzent stärker auf dem Gesehenwerden oder auf dem Erscheinen liegt.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die Satzstellung im zweiten Halbvers hebt das Bild „auf den Flügeln des Windes“ hervor; die traditionelle Bildwelt wird ohne konfessionelle Ausdeutung bewahrt.
