  text: He sent from on high[a]; he took me[b]; he drew me out of many waters.
translation:
  language: de
  text: Er sandte aus der Höhe[a]; er nahm mich; er zog mich aus vielen Wassern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er streckte sich aus der Höhe herab.“ Wörtlich: „Er sandte aus der Höhe“; was er sandte, wird im Hebräischen nicht ausdrücklich genannt.'
