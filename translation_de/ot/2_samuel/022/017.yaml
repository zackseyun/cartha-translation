  - marker: b
    text: 'Auch: „aus großen Wassern“ oder „aus gewaltigen Wassern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: streckte … aus
  rationale: Das Verb bedeutet gewöhnlich »senden« und kann im Zusammenhang mit einem Körperteil auch »ausstrecken« bedeuten. Da das direkte Objekt hier unausgesprochen bleibt und unmittelbar die Rettung des Sprechers folgt, gibt »streckte … aus« das poetische Rettungsbild im Deutschen verständlich wieder.
- source_word: מִמָּרוֹם
  choice: aus der Höhe
  rationale: Die räumliche und poetische Aussage des Hebräischen bleibt erhalten, ohne sie ausdrücklich auf »Himmel« festzulegen.
- source_word: יִקָּחֵנִי
  choice: ergriff mich
  rationale: לקח heißt grundsätzlich »nehmen«. Im Bild einer von oben ausgestreckten Hand bezeichnet »ergriff mich« natürlich und prägnant den rettenden Zugriff.
- source_word: יַמְשֵׁנִי
  choice: zog mich
  rationale: Die Hifil-Form von משה bezeichnet hier das Herausziehen aus Wasser. Mit der anschließenden Herkunftsangabe ist »zog mich aus« im Deutschen idiomatisch.
- source_word: מִמַּיִם רַבִּים
  choice: aus vielen Wassern
  rationale: Die Wiedergabe folgt eng der Grundbedeutung »viele Wasser« und bewahrt das dichterische Bild; die möglichen qualitativen Nuancen »groß« oder »gewaltig« werden in der Fußnote genannt.
theological_decisions:
- issue: Göttliches Rettungshandeln aus der Höhe
  choice: Die poetische Ortsangabe »aus der Höhe« bleibt bestehen.
  alternative: »vom Himmel her«
  rationale: Der Vers schildert Gottes Eingreifen von oben, verwendet aber nicht ausdrücklich das Wort »Himmel«. Die offenere räumliche Bildsprache soll nicht unnötig verengt werden.
- issue: Unausgesprochenes Objekt von יִשְׁלַח
  choice: »seine Hand« wird zur verständlichen Darstellung des im Kontext vorausgesetzten rettenden Ausstreckens ergänzt und als Ergänzung kenntlich gemacht.
  alternative: »Er sandte aus der Höhe«
  rationale: Die streng wörtliche Alternative lässt im Deutschen offen, was gesandt wird, und wirkt unvollständig. Die Ergänzung »seine Hand« entspricht dem naheliegenden Körperbild, wird jedoch wegen ihres impliziten Charakters nicht stillschweigend behandelt.
translation_notes:
  register: Moderne, gehobene poetische Standardsprache. Der Parallelismus und die knappen Rettungsverben bleiben erhalten; die ungewöhnliche Wendung »viele Wasser« bewahrt bewusst das hebräische Bild.
