  text: וַ/יִּשְׁלַ֥ח חִצִּ֖ים וַ/יְפִיצֵ֑/ם בָּרָ֖ק ו/יהמ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/015.yaml
  text: He sent arrows and scattered them; lightning[a], and threw them into confusion.
translation:
  language: de
  text: Er sandte Pfeile und zerstreute sie; er sandte einen Blitz und verwirrte sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder für beide Wirkungsverben: »trieb sie in die Flucht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Er schoss
  rationale: שלח bedeutet grundsätzlich »senden«. In Verbindung mit Pfeilen ist »schoss« im Deutschen die natürliche Wiedergabe und bewahrt die martialische Bildsprache, ohne den Sinn zu verändern.
- source_word: חִצִּים
  choice: Pfeile
  rationale: Die übliche und konkrete Wiedergabe von חִצִּים.
- source_word: וַיְפִיצֵם
  choice: und zerstreute sie
  rationale: Die Kausativform bezeichnet das Auseinandertreiben oder Zerstreuen; das Suffix bezieht sich im Zusammenhang am ehesten auf die Feinde.
- source_word: בָּרָק
  choice: Blitze
  rationale: בָּרָק bezeichnet Blitz beziehungsweise Blitzstrahl. Der deutsche Plural ergibt parallel zu »Pfeile« eine natürliche, knappe poetische Zeile, obwohl die hebräische Form singularisch ist.
- source_word: וַיְהֻמֵּם
  choice: und brachte sie in Verwirrung
  rationale: Die Form von המם drückt aus, dass jemand in Verwirrung oder Bestürzung versetzt wird; die Wiedergabe erhält diese kausative Bedeutung, ohne sie auf »besiegen« oder »in die Flucht schlagen« zu verengen.
theological_decisions:
- issue: Bezug der pronominalen Suffixe in וַיְפִיצֵם und וַיְהֻמֵּם
  choice: »sie« bezieht sich auf die im weiteren Zusammenhang vorausgesetzten Feinde
  alternative: Den Bezug ausschließlich aus dem unmittelbaren Vers offenlassen
  rationale: Die männlichen Pluralsuffixe verlangen ein Bezugsobjekt; im Bild vom göttlichen Kriegshandeln sind die Gegner Davids der natürlichste Bezug. Die Übersetzung benennt sie jedoch nicht ausdrücklich und bewahrt damit die Knappheit des Hebräischen.
translation_notes:
  register: Knappe, würdevolle poetische Sprache. Die parallelen Bilder »Pfeile« und »Blitze« bleiben erhalten; die zwei unterschiedlichen Wirkungsverben werden nicht zu einer einzigen militärischen Aussage vereinheitlicht.
