base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/038.yaml
  text: I pursued my enemies and destroyed them[a], and I did not turn back until they were consumed.
translation:
  language: de
  text: Ich verfolgte meine Feinde und vernichtete sie; ich kehrte nicht um, bis sie aufgerieben waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis ich sie aufgerieben hatte« oder: »bis ich ihnen ein Ende gemacht hatte«. Die hebräische Infinitivkonstruktion kann entweder das Ende der Feinde oder das Handeln des Sprechers, das sie zu Ende bringt, hervorheben.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: אֶרְדְּפָה
  choice: Ich verfolgte
  rationale: Das Qal von רדף bezeichnet hier im militärischen Zusammenhang das Verfolgen eines Gegners. »Verfolgte« ist natürlich und präzise.
- source_word: אֹיְבַי
  choice: meine Feinde
  rationale: אֹיֵב mit dem Suffix der 1. Person Singular bedeutet unmittelbar »meine Feinde« und bewahrt die persönliche, kriegerische Aussage.
- source_word: וָאַשְׁמִידֵם
  choice: und vernichtete sie
  rationale: Das Hifil von שׁמד bedeutet zerstören oder vernichten. »Vernichtete« gibt die starke Aussage in würdigem, modernem Deutsch wieder.
- source_word: וְלֹא אָשׁוּב
  choice: ich kehrte nicht um
  rationale: שׁוב bezeichnet hier das Umkehren beziehungsweise Ablassen von der Verfolgung, nicht lediglich die Rückkehr an einen Ort.
- source_word: עַד כַּלּוֹתָם
  choice: bis sie völlig aufgerieben waren
  rationale: כלה kann Vollendung, Aufzehrung oder vollständige Beendigung ausdrücken. Im Kontext beschreibt die Wendung die vollständige Niederlage der Feinde; »völlig aufgerieben« ist im militärischen Zusammenhang idiomatisch und wahrt die Endgültigkeit.
