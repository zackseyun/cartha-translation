id: 2SA.22.50
reference: 2 Samuel 22:50
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל כֵּ֛ן אוֹדְ/ךָ֥ יְהוָ֖ה בַּ/גּוֹיִ֑ם וּ/לְ/שִׁמְ/ךָ֖ אֲזַמֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/050.yaml
  text: Therefore I will praise you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: de
  text: Darum will ich dich unter den Völkern preisen, Jahwe, und deinem Namen will ich lobsingen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung zieht eine Folgerung aus der zuvor geschilderten Rettung; »Darum« gibt diese Folgerungsbeziehung knapp und natürlich wieder.
- source_word: אוֹדְךָ
  choice: will ich dich preisen
  rationale: Die Hifil-Form von ידה kann »danken« oder »preisen« bedeuten. Im poetischen Parallelismus mit אֲזַמֵּר passt »preisen« besonders gut, ohne den Dankaspekt grundsätzlich auszuschließen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם bezeichnet hier die Völker außerhalb Israels. »Völker« ist im Deutschen idiomatisch und vermeidet die stärker religiös aufgeladene Bezeichnung »Heiden«.
- source_word: וּלְשִׁמְךָ
  choice: und deinem Namen
  rationale: Die Formulierung bewahrt das hebräische Bild vom Namen als Ausdruck der offenbarten Identität und des Ansehens Gottes.
- source_word: אֲזַמֵּר
  choice: will ich lobsingen
  rationale: Das Piel von זמר bezeichnet musikalisches Singen zum Lob. »Lobsingen« ist prägnant, würdevoll und bildet den poetischen Parallelismus ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als persönlichen Namen, statt ihn durch den traditionellen Titel »der HERR« zu ersetzen.
- issue: Bedeutung von ידה im Lobkontext
  choice: preisen
  alternative: danken
  rationale: Beide Bedeutungsnuancen sind möglich. Wegen des parallelen »lobsingen« wurde »preisen« gewählt; die Übersetzung macht aus dem Ausdruck jedoch keine engere lehrmäßige Aussage.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit dichterisch-würdigem Ton. Die Wortstellung erhält den Parallelismus, ohne im Deutschen unnötig altertümlich zu wirken.
