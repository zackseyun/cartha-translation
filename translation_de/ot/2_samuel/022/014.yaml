source:
  edition: WLC
  text: יַרְעֵ֥ם מִן שָׁמַ֖יִם יְהוָ֑ה וְ/עֶלְי֖וֹן יִתֵּ֥ן קוֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/014.yaml
  text: Yahweh thundered from heaven[a], and the Most High gave his voice.
translation:
  language: de
  text: 'Jahwe ließ es vom Himmel donnern,

    und der Höchste ließ seine Stimme erschallen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַרְעֵם
  choice: ließ es donnern
  rationale: Der Hifil von רעם bezeichnet hier das Hervorbringen von Donner. Die deutsche Wendung ist natürlich und bewahrt das Bild der Sturmtheophanie.
- source_word: מִן שָׁמַיִם
  choice: vom Himmel
  rationale: שָׁמַיִם kann Himmel oder Luftraum bezeichnen. Im Zusammenhang der Gotteserscheinung verbindet „vom Himmel“ den räumlichen mit dem theologischen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: וְעֶלְיוֹן
  choice: und der Höchste
  rationale: עֶלְיוֹן steht als Gottesbezeichnung parallel zu Jahwe. „Der Höchste“ erhält die superlativische Bedeutung und ist im Deutschen etabliert.
- source_word: יִתֵּן קוֹלוֹ
  choice: ließ seine Stimme erschallen
  rationale: Wörtlich heißt die Wendung „gab seine Stimme“. Die gewählte idiomatische Wiedergabe bewahrt den hörbaren, machtvollen Charakter und den poetischen Parallelismus, ohne die im Deutschen missverständliche Formulierung „gab seine Stimme“ zu übernehmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen unmittelbar. Die Wiedergabe als „Jahwe“ erhält den Eigennamen, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Verhältnis von יְהוָה und עֶלְיוֹן
  choice: Als parallele Bezeichnungen desselben Gottes wiedergegeben
  alternative: „der Höchste“ als eigenständige, nur lose angeschlossene Bezeichnung lesen
  rationale: Der Parallelismus verbindet beide Satzhälften eng. Die Übersetzung wahrt diese Entsprechung, ohne eine weitergehende dogmatische Aussage ausdrücklich in den Text einzutragen.
translation_notes:
  register: Poetisch und würdevoll, zugleich in modernem Standarddeutsch verständlich. Der Parallelismus der beiden Halbverse bleibt durch „donnern“ und „Stimme erschallen“ hörbar.
