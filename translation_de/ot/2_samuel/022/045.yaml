  text: The sons of foreigners come cringing to me[b][a]; at the hearing of the ear they obey me.
translation:
  language: de
  text: Fremde heucheln mir Gehorsam[a]; sobald sie hören[b], gehorchen sie mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unterwerfen sich mir« oder »schmeicheln mir«; das hebräische Verb kann ein widerwilliges oder nur vorgetäuschtes Sich-Fügen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »beim Hören des Ohres«; die Wendung bezeichnet eine unmittelbare Reaktion, sobald sie hören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: Menschen aus fremden Völkern
  rationale: Die hebräische Wendung bedeutet wörtlich »Söhne der Fremde« beziehungsweise »Söhne von Fremden«. Im heutigen Deutsch gibt »Menschen aus fremden Völkern« den Bezug auf ausländische Volksgruppen natürlich und würdig wieder, ohne das missverständliche deutsche Wort »Söhne« eng biologisch zu verstehen.
- source_word: יִתְכַּחֲשׁוּ לִי
  choice: unterwerfen sich mir
  rationale: Der Hitpael von כחש bezeichnet hier im Zusammenhang des Siegesliedes eine erzwungene, möglicherweise nur vorgetäuschte Unterwerfung. »Unterwerfen sich mir« trägt die kontextuelle Hauptaussage; die mögliche Unaufrichtigkeit oder Widerwilligkeit bleibt in der Fußnote erhalten.
- source_word: לִשְׁמֹעַ אֹזֶן
  choice: sobald sie davon hören
  rationale: Die wörtliche Wendung »beim Hören des Ohres« ist ein Idiom für eine unmittelbare Reaktion auf eine Nachricht. Die Wiedergabe ist im Deutschen natürlich und bewahrt den zeitlichen Nachdruck.
- source_word: יִשָּׁמְעוּ לִי
  choice: gehorchen sie mir
  rationale: שׁמע mit ל bezeichnet häufig nicht nur akustisches Hören, sondern Hören im Sinn von Beachten und Gehorchen. Im Kontext unterworfener fremder Völker ist »gehorchen« sachlich angemessen.
