source:
  edition: WLC
  text: מִ/נֹּ֖גַהּ נֶגְדּ֑/וֹ בָּעֲר֖וּ גַּחֲלֵי אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/013.yaml
  text: From the brightness before him[a], coals of fire blazed forth.
translation:
  language: de
  text: Aus dem Glanz vor ihm[a] flammten Feuerkohlen auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus dem Lichtschein vor ihm loderten brennende Kohlen auf.“'
    reason: Lexikalische Alternative für נֹגַהּ und idiomatische Wiedergabe von גַּחֲלֵי אֵשׁ.
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: Aus dem Glanz
  rationale: נֹגַהּ bezeichnet Glanz, Lichtschein oder strahlende Helligkeit. „Glanz“ ist im Deutschen knapp, würdig und für die theophanische Bildsprache passend; die Präposition מִן wird mit „aus“ als Herkunftsangabe wiedergegeben.
- source_word: נֶגְדּוֹ
  choice: vor ihm
  rationale: נֶגֶד mit dem Suffix der 3. Person Singular bezeichnet den Raum vor ihm. „Vor ihm“ bewahrt den räumlichen Sinn, ohne die Formulierung zu „in seiner Gegenwart“ auszudeuten.
- source_word: בָּעֲרוּ
  choice: flammten ... auf
  rationale: בער im Qal bedeutet „brennen“, „auflodern“ oder „in Flammen stehen“. „Aufflammen“ gibt die lebendige poetische Bewegung wieder; eine ausdrückliche göttliche Verursachung wird nicht ergänzt.
- source_word: גַּחֲלֵי אֵשׁ
  choice: Feuerkohlen
  rationale: Die Status-constructus-Verbindung bedeutet wörtlich „Kohlen des Feuers“. Das deutsche Kompositum „Feuerkohlen“ bewahrt das Bild prägnant und natürlich.
theological_decisions:
- issue: Theophanische Bildsprache und nicht ausdrücklich genanntes handelndes Subjekt
  choice: Die Feuerkohlen werden als aus dem Glanz vor ihm aufflammend dargestellt, ohne Gott ausdrücklich als Verursacher einzusetzen.
  alternative: „Sein Glanz setzte Feuerkohlen in Brand.“
  rationale: Der hebräische Vers ist knapp und poetisch. Die gewählte Fassung erhält Herkunft, Bildfolge und Spannung, ohne eine kausale Aussage hinzuzufügen, die im Wortlaut nicht ausdrücklich steht.
translation_notes:
  register: Modernes Standarddeutsch in dichterischem, würdigem Register. Die Wortstellung bleibt klar und bewahrt zugleich die kompakte Parallelität der hebräischen Theophanie.
