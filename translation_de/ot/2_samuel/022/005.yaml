  text: כִּ֥י אֲפָפֻ֖/נִי מִשְׁבְּרֵי מָ֑וֶת נַחֲלֵ֥י בְלִיַּ֖עַל יְבַעֲתֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/005.yaml
  text: For the waves of death surrounded me[b][a]; the torrents of worthlessness terrified me.
translation:
  language: de
  text: Denn die Wogen des Todes[a] umgaben mich; die Ströme des Verderbens[b] jagten mir Schrecken ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Brecher des Todes“ beziehungsweise „die Brandungswellen des Todes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Ströme Belials“, wenn בְלִיַּעַל als Eigenname verstanden wird; auch „Ströme der Bosheit“ ist möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Aussage ein und gibt die kausale Kraft im Deutschen natürlich wieder.
- source_word: אֲפָפֻנִי
  choice: umgaben mich
  rationale: Bewahrt das Bild des vollständigen Umschließens in klarer, heutiger Sprache.
- source_word: מִשְׁבְּרֵי
  choice: Wogen
  rationale: Bezeichnet Brandungswellen oder Brecher. „Wogen“ erhält das bedrohliche Wasserbild und klingt in deutscher Poesie natürlich; die präzisere Alternative „Brecher“ wird in der Fußnote genannt.
- source_word: מָוֶת
  choice: des Todes
  rationale: Direkte Wiedergabe; der Tod erscheint bildhaft als überwältigende Wassergewalt.
- source_word: נַחֲלֵי
  choice: Ströme
  rationale: Das Wort kann Bäche, Wadis oder reißende Wasserläufe bezeichnen. „Ströme“ passt zum poetischen Parallelismus und vermittelt die bedrohliche Wassermasse.
- source_word: בְלִיַּעַל
  choice: des Verderbens
  rationale: Gibt den abstrakten Sinn von Verderbtheit, Unheil oder ruinöser Bosheit idiomatisch wieder. Das im Deutschen unnatürliche „Wertlosigkeit“ wäre zu eng; die mögliche Lesung als Eigenname wird offengehalten.
- source_word: יְבַעֲתֻנִי
  choice: jagten mir Schrecken ein
  rationale: Drückt den intensiven, plötzlich hereinbrechenden Schrecken des hebräischen Verbs natürlich aus.
theological_decisions:
- issue: Ob בְלִיַּעַל als abstrakter Begriff oder als Eigenname zu verstehen ist
  choice: Im Haupttext als abstrakter Begriff „Verderben“ wiedergegeben
  alternative: „Belial“ als Eigenname; außerdem sind „Bosheit“ oder „Nichtswürdigkeit“ möglich
  rationale: Der poetische Parallelismus beschreibt bedrohliche Wassergewalten. Ein abstrakter Sinn ist hier gut belegt, während die Wiedergabe als Eigenname eine spätere Personifizierung nahelegen könnte, die der Vers nicht zwingend voraussetzt. Die echte Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Moderne, gehobene Standardsprache mit poetischem Rhythmus. Die parallelen Wasserbilder werden bewahrt, ohne altertümliche oder konfessionell geprägte Begriffe in den Haupttext einzutragen.
