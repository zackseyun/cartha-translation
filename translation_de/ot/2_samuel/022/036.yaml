  text: You gave me the shield of your salvation[a], and your gentleness made me great.
translation:
  language: de
  text: Du gabst mir den Schild deines Heils, und deine Sanftmut[a] machte mich groß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dein gnädiges Herabneigen«; der hebräische Ausdruck ist schwierig und kann davon sprechen, dass Gott sich gnädig herabneigt, um den Sprecher zu erhöhen. Möglich ist auch: »dein Erhören« oder »deine Hilfe«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן לִי
  choice: Du gabst mir
  rationale: Das Qal-Wayyiqtol von נתן bezeichnet hier eine schlichte vergangene Handlung; לִי wird im Deutschen natürlich als Dativ wiedergegeben.
- source_word: מָגֵן
  choice: Schild
  rationale: Das konkrete militärische Bild wird bewahrt und nicht zu „Schutz“ verallgemeinert.
- source_word: יִשְׁעֶךָ
  choice: deines Heils
  rationale: Die Genitivverbindung bleibt erhalten; „Heil“ umfasst hier Gottes Rettung und bewahrt zugleich die theologische Tragweite des Ausdrucks.
- source_word: וַעֲנֹתְךָ
  choice: deine Demut
  rationale: Die schwierige Form wird als Gottes demütige, gnädige Hinwendung zum Sprecher verstanden. „Demut“ erhält die überraschende Aussage und ihre theologische Spannung, ohne sie erklärend aufzulösen.
- source_word: תַּרְבֵּנִי
  choice: machte mich groß
  rationale: 'Das Hifil von רבה hat resultative Bedeutung: Gott verleiht dem Sprecher Größe beziehungsweise erhöht ihn. „Machte mich groß“ gibt dies direkt und idiomatisch wieder.'
theological_decisions:
- issue: Aussage von וַעֲנֹתְךָ über Gott
  choice: deine Demut
  alternative: deine Sanftmut; dein gnädiges Herabneigen; dein Erhören
  rationale: Der hebräische Ausdruck ist mehrdeutig. „Demut“ bewahrt die anstößig wirkende, aber kontextuell plausible Vorstellung, dass Gott sich gnädig zum Sprecher herabneigt und ihn dadurch erhöht. Die Fußnote hält andere Deutungen offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „Du“ und die poetischen Bilder bleiben erhalten; die ungewöhnliche Rede von Gottes „Demut“ wird nicht geglättet, sondern durch eine Fußnote erläutert.
