  text: For all his judgments were before me[a], and I did not turn away from his statutes.
translation:
  language: de
  text: Denn all seine Rechtsbestimmungen standen mir vor Augen, und davon wich ich nicht ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von ihr«. Das feminine Singularpronomen kann sich kollektiv auf die zuvor genannten Rechtsbestimmungen oder Satzungen beziehen; der genaue Bezug bleibt offen.'
    reason: Das hebräische Pronomen מִמֶּנָּה ist feminin Singular und sein Bezug ist neben den pluralischen Rechtsbegriffen grammatisch auffällig.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt den kausalen Zusammenhang im poetischen Fluss.
- source_word: כָל
  choice: alle
  rationale: Gibt die umfassende Bedeutung des hebräischen Quantors wieder.
- source_word: מִשְׁפָּטָיו
  choice: seine Rechtsentscheide
  rationale: Bewahrt den rechtlichen Sinn von מִשְׁפָּט und unterscheidet den Ausdruck von den parallel genannten Satzungen.
- source_word: לְנֶגְדִּי
  choice: standen mir vor Augen
  rationale: Gibt das Bild natürlicher wieder als das im Deutschen missverständliche »waren vor mir« und bezeichnet bleibende Aufmerksamkeit.
- source_word: וְחֻקֹּתָיו
  choice: und seine Satzungen
  rationale: Bezeichnet festgesetzte Ordnungen und erhält die begriffliche Unterscheidung zum ersten Rechtsbegriff.
- source_word: לֹא אָסוּר
  choice: wich ich nicht ab
  rationale: Gibt die Grundbedeutung von סוּר, sich abzuwenden oder abzuweichen, knapp und würdig wieder.
- source_word: מִמֶּנָּה
  choice: von seinen Satzungen
  rationale: Das feminine Singularpronomen ist formal auffällig. Im Haupttext wird sein naheliegender Bezug auf die unmittelbar vorausgehenden Satzungen verdeutlicht; die mögliche allgemeinere Rückbeziehung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Unterschiedliche Begriffe für Gottes Rechtsordnung
  choice: מִשְׁפָּטִים und חֻקּוֹת werden als »Rechtsentscheide« und »Satzungen« unterschieden.
  alternative: Beide Begriffe allgemein mit »Gebote« oder »Gesetze« wiedergeben.
  rationale: Der hebräische Parallelismus verwendet bewusst zwei verschiedene Rechtsbegriffe; ihre Unterscheidung sollte nicht theologisch eingeebnet werden.
- issue: Bezug des abschließenden Pronomens
  choice: Im Haupttext wird die Abwendung auf die unmittelbar genannten Satzungen bezogen.
  alternative: 'Das Pronomen kollektiv auf alle zuvor genannten Rechtsbestimmungen beziehen: »von ihnen wich ich nicht ab«.'
  rationale: Die feminine Singularform מִמֶּנָּה ist ungewöhnlich neben dem maskulinen Plural חֻקֹּתָיו. Der nächste sachliche Bezug ist dennoch »Satzungen«; wegen der grammatischen Spannung bleibt die allgemeinere Deutung als Fußnote erhalten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit poetischer Knappheit. »Rechtsentscheide« und »Satzungen« bleiben verständlich und bewahren zugleich die beiden unterschiedlichen hebräischen Rechtsbegriffe.
