base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/010.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: de
  text: Er neigte den Himmel und kam herab; dichtes Dunkel[a] war unter seinen Füßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dunkles Gewölk«. Das hebräische Wort עֲרָפֶל kann dichtes Dunkel oder dunkles Gewölk bezeichnen und steht häufig im Zusammenhang mit dem Erscheinen Gottes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: neigte
  rationale: נטה bezeichnet hier mit »Himmel« als Objekt ein Herabneigen oder Beugen. »Neigte« bewahrt das kosmische Bild und klingt im Deutschen natürlich und würdevoll.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: Die hebräische Pluralform bezeichnet idiomatisch den Himmel beziehungsweise die Himmelssphäre. Im Deutschen ist der kollektive Singular »den Himmel« in diesem Bild am natürlichsten.
- source_word: וַיֵּרַד
  choice: kam herab
  rationale: ירד beschreibt die Bewegung nach unten. »Kam herab« ist klares modernes Deutsch und erhält die räumliche Bildsprache der Theophanie.
- source_word: וַעֲרָפֶל
  choice: dunkles Gewölk
  rationale: עֲרָפֶל kann dichtes Dunkel oder dunkles Wolkengewölk bezeichnen, besonders im Zusammenhang mit einer Gotteserscheinung. »Dunkles Gewölk« hält sowohl die atmosphärische Dichte als auch die mögliche Wolkenvorstellung fest.
- source_word: תַּחַת
  choice: unter
  rationale: Die einfache räumliche Präposition wird direkt und idiomatisch mit »unter« wiedergegeben.
- source_word: רַגְלָיו
  choice: seinen Füßen
  rationale: Der Ausdruck bedeutet wörtlich »seine Füße«. Die konkrete anthropomorphe Bildsprache bleibt erhalten und wird nicht paraphrasiert.
theological_decisions:
- issue: Anthropomorphe und räumliche Bildsprache der Gotteserscheinung
  choice: Die Formulierungen »kam herab« und »unter seinen Füßen« werden beibehalten.
  alternative: 'Die Bildsprache abstrahieren, etwa: »Er offenbarte sich vom Himmel her.«'
  rationale: Der hebräische Text schildert die Gotteserscheinung poetisch in körperlich-räumlichen Bildern. Eine Abstraktion würde die Spannung zwischen Gottes Erhabenheit und seiner bildhaft beschriebenen Gegenwart auflösen.
translation_notes:
  register: Moderne, gehobene poetische Standardsprache. Der Parallelismus und die kraftvolle kosmische Bildsprache bleiben erhalten; »Gewölk« ist bewusst poetisch, aber weiterhin allgemein verständlich.
