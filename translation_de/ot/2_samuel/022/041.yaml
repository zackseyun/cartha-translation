  text: You gave me the necks of my enemies[a]; I destroyed those who hated me.
translation:
  language: de
  text: Du ließest meine Feinde mir den Rücken kehren[a]; die mich hassten, vernichtete ich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Du gabst mir den Nacken/Rücken meiner Feinde“ – ein Bild dafür, dass die Feinde sich abwenden und vor dem Sieger fliehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: meine Feinde
  rationale: אֹיֵב bezeichnet gewöhnlich einen Feind; das Suffix der 1. Person Singular wird mit „meine“ wiedergegeben.
- source_word: תַּתָּה לִּי עֹרֶף
  choice: du ließest … mir den Rücken kehren
  rationale: 'Wörtlich steht hier, dass Gott dem Sprecher den Nacken beziehungsweise Rücken seiner Feinde gab. Die natürliche deutsche Wendung gibt das Bild und seinen Sinn wieder: Die Feinde werden zur Flucht gezwungen.'
- source_word: מְשַׂנְאַי
  choice: die mich hassten
  rationale: Das substantivisch gebrauchte Partizip mit Suffix bezeichnet diejenigen, die den Sprecher hassten; die Vergangenheitsform fügt sich in den erzählenden Rückblick des Liedes ein.
- source_word: וָאַצְמִיתֵם
  choice: vernichtete ich
  rationale: Das Hifil von צמת bedeutet hier, jemanden zu vernichten oder ihm ein Ende zu machen. „Vernichtete“ bewahrt die Stärke des Verbs in würdigem, gegenwärtigem Deutsch.
