  text: וְ/אֶת עַ֥ם עָנִ֖י תּוֹשִׁ֑יעַ וְ/עֵינֶ֖י/ךָ עַל רָמִ֥ים תַּשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/028.yaml
  text: You save an afflicted people[b][a], but your eyes are on the haughty to bring them low.
translation:
  language: de
  text: Du rettest ein bedrängtes Volk[a], aber deine Augen sind auf die Hochmütigen[b] gerichtet; du erniedrigst sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein armes Volk“. Das hebräische Adjektiv kann Arme, Bedrängte, Unterdrückte oder Gedemütigte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Stolzen“ beziehungsweise „die Hohen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: Volk
  rationale: Das kollektive Singularwort bezeichnet hier eine Gruppe von Menschen; „Volk“ entspricht dem poetischen Sprachgebrauch und bleibt gegenüber „Nation“ angemessen offen.
- source_word: עָנִי
  choice: bedrängt
  rationale: Das Adjektiv kann arm, elend, bedrängt oder gedemütigt bedeuten. „Bedrängt“ erfasst die erfahrene Not, ohne die Aussage auf wirtschaftliche Armut oder eine innere Demutshaltung zu verengen.
- source_word: תּוֹשִׁיעַ
  choice: du rettest
  rationale: Der Hifil von ישׁע bezeichnet retten oder befreien. „Du rettest“ ist knapp, natürlich und bewahrt den weiten Sinn.
- source_word: עֵינֶיךָ
  choice: deine Augen
  rationale: Das konkrete hebräische Bild wird beibehalten; mit „richten sich gegen“ wird seine feindlich-gerichtliche Funktion im Satz idiomatisch verständlich.
- source_word: רָמִים
  choice: die Hochmütigen
  rationale: Die wörtlich „Hohen“ beziehungsweise „Erhabenen“ stehen hier im Gegensatz zu den Bedrängten. „Hochmütige“ gibt den naheliegenden negativen moralischen Sinn wieder; „Stolze“ bleibt als Fußnotenalternative erhalten.
- source_word: תַּשְׁפִּיל
  choice: um sie zu erniedrigen
  rationale: Der Hifil von שׁפל bedeutet niedrig machen, erniedrigen oder demütigen. Die finale Formulierung verbindet die beiden hebräischen Prädikate in natürlichem Deutsch, ohne die Zielrichtung von Gottes Blick abzuschwächen.
- source_word: וְאֶת
  choice: nicht gesondert wiedergegeben
  rationale: אֵת ist hier der Akkusativmarker; das vorangestellte וְ wird im folgenden adversativen Satzgefüge mitgedacht.
- source_word: וְ
  choice: aber
  rationale: Obwohl die Konjunktion formal „und“ lautet, macht der poetische Gegensatz zwischen Rettung und Erniedrigung eine adversative Wiedergabe im Deutschen natürlich.
theological_decisions:
- issue: Moralischer oder ausschließlich sozialer Gegensatz
  choice: Der Vers stellt Gottes Rettung der Bedrängten seinem Erniedrigen der Hochmütigen gegenüber.
  alternative: Der Vers kontrastiert ausschließlich wirtschaftlich Arme mit gesellschaftlich Hochgestellten.
  rationale: עָנִי kann soziale Not bezeichnen, während רָמִים sowohl Erhöhte als auch Stolze meinen kann. Die Übersetzung wahrt die moralisch-theologische Spannung, ohne mögliche soziale Bezüge auszuschließen.
- issue: Funktion der Augenmetapher
  choice: Gottes Augen richten sich gegen die Hochmütigen, um sie zu erniedrigen.
  alternative: Gott sieht die Hochmütigen lediglich an und erniedrigt sie anschließend.
  rationale: 'Das Hebräische lautet knapp: „deine Augen [sind] auf/gegen die Hohen; du erniedrigst“. Die gewählte Formulierung bewahrt das Bild und macht den Zusammenhang der beiden Aussagen deutlich, ohne ein zusätzliches Motiv einzutragen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Bildsprache. „Bedrängt“ vermeidet eine unnötige Verengung auf materielle Armut; die konkrete Rede von Gottes Augen bleibt erhalten. Alle Fußnotenmarker stehen unmittelbar bei den erklärten Ausdrücken.
