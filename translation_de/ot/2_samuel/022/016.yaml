  naturalness: »Wurden sichtbar« und »wurden bloßgelegt« sind idiomatisch und bewahren den poetischen Parallelismus. »Yahwehs Schelten« wirkt im modernen Standarddeutsch weniger natürlich als »Yahwehs Schelte«. »Atemhauch seiner Nase« ist als bewusst konkrete, poetische Bildsprache verständlich und bewahrt die hebräische Anthropomorphie.
  terminology: »Yahweh« gibt יהוה konsistent wieder. »Grundfesten der Welt« ist gegenüber »des Erdkreises« die natürlichere heutige Entsprechung für תֵּבֵל, ohne die in der Fußnote vermerkte Nuance »bewohnte Welt« auszuschließen. Die Fußnote zu b soll die hebräische Formulierung erläutern, ohne »Zorn« als im Kontext gleichwertige Hauptlesart nahezulegen.
