revisions:
- from: Da wurden die Rinnen des Meeres sichtbar, die Grundfesten des Erdkreises[a] wurden bloßgelegt – durch Yahwehs Schelten, durch den machtvollen Atem aus seiner Nase.[b]
  to: Da wurden die Rinnen des Meeres sichtbar, die Grundfesten der Welt[a] wurden bloßgelegt – durch Yahwehs Schelte, durch den Atemhauch seiner Nase.[b]
  rationale: Die Revision entfernt die nicht ausdrücklich im Hebräischen vorhandene Verstärkung »machtvollen«, ersetzt die weniger natürliche Nominalform »Schelten« durch »Schelte« und präzisiert die Fußnote. »Welt« ist die geläufige moderne Wiedergabe von תֵּבֵל; die spezifischere Nuance bleibt per Fußnote zugänglich. Die konkrete Bildsprache von Atem/Wind und Nase bleibt erhalten.
