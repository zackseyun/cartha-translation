  text: וַ/יֵּֽרָאוּ֙ אֲפִ֣קֵי יָ֔ם יִגָּל֖וּ מֹסְד֣וֹת תֵּבֵ֑ל בְּ/גַעֲרַ֣ת יְהוָ֔ה מִ/נִּשְׁמַ֖ת ר֥וּחַ אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/016.yaml
  text: Then the channels of the sea were seen[a]; the foundations of the world were laid bare at the rebuke of Yahweh[b], at the blast of the breath of his nostrils.
translation:
  language: de
  text: Da wurden die Rinnen des Meeres sichtbar, die Grundfesten der Welt[a] wurden bloßgelegt – durch Yahwehs Schelte, durch den Atemhauch seiner Nase.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Grundfesten der bewohnten Welt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »vom Atem des Windes seiner Nase«. Das hebräische Wort für »Nase« kann auch »Zorn« bedeuten.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: wurden sichtbar
  rationale: Das Nifal von ראה hat hier passive Bedeutung. »Wurden sichtbar« bewahrt diese Form und klingt im Deutschen natürlicher als »wurden gesehen«.
- source_word: אֲפִקֵי יָם
  choice: die Rinnen des Meeres
  rationale: אֲפִיקִים bezeichnet Rinnen, Wasserläufe oder Flussbetten. »Rinnen des Meeres« erhält das poetische Bild der durch die Gotteserscheinung freigelegten Tiefen, ohne es auf Quellen festzulegen.
- source_word: יִגָּלוּ
  choice: wurden bloßgelegt
  rationale: Das Nifal von גלה bedeutet, dass etwas aufgedeckt oder enthüllt wird. »Bloßgelegt« gibt die kraftvolle Bildsprache wieder und steht parallel zu »wurden sichtbar«.
- source_word: מֹסְדוֹת תֵּבֵל
  choice: die Grundfesten des Erdkreises
  rationale: מֹסְדוֹת sind Fundamente oder Grundfesten; תֵּבֵל bezeichnet in poetischer Sprache die Welt, besonders die bewohnte Welt. »Erdkreis« bewahrt den gehobenen kosmischen Ton.
- source_word: בְּגַעֲרַת יְהוָה
  choice: durch Yahwehs Schelten
  rationale: גְּעָרָה bezeichnet einen wirksamen, gebietenden Tadel. Das instrumentale »durch« macht deutlich, wodurch die kosmische Erschütterung hervorgerufen wird; der Gottesname wird als »Yahweh« wiedergegeben.
- source_word: מִנִּשְׁמַת רוּחַ אַפּוֹ
  choice: durch den machtvollen Atem aus seiner Nase
  rationale: נְשָׁמָה und רוּחַ bündeln hier die Vorstellung eines heftigen Atemstoßes. Die Wiedergabe erhält das anthropomorphe Bild von אַף als »Nase«, während »machtvoll« die verstärkende Verbindung von Atem und Windhauch idiomatisch ausdrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. »Yahweh« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bildsprache von אַפּוֹ
  choice: aus seiner Nase
  alternative: in seinem Zorn
  rationale: אַף kann sowohl »Nase« als auch übertragen »Zorn« bedeuten. Im Zusammenhang mit Atem und Wind steht das konkrete Körperbild im Vordergrund; die mögliche Zornbedeutung bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die parallelen Passivformen und die kosmische Bildsprache des Hebräischen bleiben erhalten; der Gedankenstrich markiert den Übergang von der Wirkung zu ihrer Ursache.
