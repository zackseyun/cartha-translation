translation:
  language: de
  text: Die Fremden verlieren den Mut und kommen zitternd aus ihren Festungen[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Fremden welken dahin.« Das hebräische Verb kann wörtlicher ein Verwelken oder Dahinschwinden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Verb ist hier schwer zu deuten. Möglich sind auch: »kommen geduckt hervor«, »kommen hinkend« oder, wörtlicher, »gürten sich«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »aus ihren befestigten Zufluchtsorten«; weniger wahrscheinlich: »aus ihren Gefängnissen« oder »aus ihren abgeschlossenen Räumen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: die Fremden
  rationale: Die Konstruktverbindung bedeutet wörtlich etwa »Söhne der Fremde/Fremder«, ist hier aber eine idiomatische Bezeichnung für fremde Völker bzw. Menschen. »Die Fremden« gibt dies im Deutschen natürlich und knapp wieder.
- source_word: יִבֹּלוּ
  choice: verlieren den Mut
  rationale: Das Verb נבל bezeichnet gewöhnlich ein Verwelken oder Dahinschwinden. Im poetisch-militärischen Zusammenhang ist wahrscheinlich das Schwinden von Lebenskraft oder Mut gemeint; die bildhaftere Bedeutung bleibt in der Fußnote erhalten.
- source_word: וְיַחְגְּרוּ
  choice: kommen zitternd
  rationale: Die Form ist an dieser Stelle schwierig. Obwohl חגר normalerweise »(sich) gürten« bedeutet, wird sie hier im Zusammenhang mit den unterworfenen Feinden häufig als Ausdruck furchtsamen Hervorkommens verstanden. Die konkurrierenden Deutungen werden in der Fußnote genannt.
- source_word: מִמִּסְגְּרוֹתָם
  choice: aus ihren Festungen
  rationale: מִסְגְּרוֹת bezeichnet abgeschlossene oder befestigte Orte. Im Kontext eines Siegesliedes passt »Festungen« gut; lexikalisch mögliche andere Deutungen werden in der Fußnote bewahrt.
