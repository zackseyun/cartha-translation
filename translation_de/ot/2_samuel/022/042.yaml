  verdict: revise
  source_fidelity: Der masoretische Text von 2 Samuel 22,42 liest יִשְׁעוּ, am naheliegendsten „sie blickten (sich) um/aus“. Die Wiedergabe „sie schrien um Hilfe“ folgt offenbar der abweichenden, stärker ausgeführten Form im Paralleltext Psalm 18,42 (יְׁשַׁוְּעוּ) und sollte hier nicht als Haupttext stehen. Die Ellipse vor „zu Jahwe“ kann im Deutschen beibehalten werden; sie ist im Hebräischen ebenfalls vorhanden. מֹשִׁיעַ bezeichnet einen vorhandenen Retter bzw. jemanden, der retten kann, nicht primär den vollzogenen Rettungsakt.
  naturalness: „Sie blickten sich um, doch niemand war da, der rettete; zu Jahwe, doch er antwortete ihnen nicht“ ist knapp, verständlich und dem poetischen Parallelismus angemessen. Die Ellipse „zu Jahwe“ wirkt in diesem Kontext bewusst verdichtet und natürlich.
  terminology: „Jahwe“ gibt יְהוָה korrekt in üblicher deutscher Form wieder. „Antwortete ihnen nicht“ entspricht עָנָם und vermeidet die enger deutende Wiedergabe „erhörte sie nicht“.
  issues:
