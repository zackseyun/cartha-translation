    rationale: וְאֵין מוֹשִׁיעַ bedeutet wörtlich, dass kein Retter bzw. niemand zum Retten vorhanden war. „Niemand war da, der rettete“ bewahrt diese Aussage besser als die Darstellung eines nicht näher bestimmten ausgebliebenen Rettungsakts.
  - severity: low
