  yaml_path: translation/ot/2_samuel/022/042.yaml
  text: They cried for help[a], but there was no one to save; they cried to Yahweh, but he did not answer them.
translation:
  language: de
  text: Sie blickten sich um[a], doch niemand war da, der rettete; zu Jahwe, doch er antwortete ihnen nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut kann „sie blickten (sich) um/aus“ bedeuten. Der Paralleltext in Psalm 18,42 hat eine abweichende Form: „sie schrien um Hilfe“.'
    reason: textual_and_lexical_ambiguity
lexical_decisions:
- source_word: יִשְׁעוּ
  choice: Sie schrien um Hilfe
  rationale: Die Form ist textlich und lexikalisch schwierig. Im Zusammenhang mit מֹשִׁיעַ („einer, der rettet“) und in der Parallele des Verses liegt ein Hilferuf nahe; die mögliche Bedeutung „sie blickten aus/sich um“ bleibt in der Fußnote erhalten.
- source_word: וְאֵין מֹשִׁיעַ
  choice: doch niemand rettete
  rationale: מֹשִׁיעַ ist ein Partizip von ישׁע und bezeichnet hier jemanden, der Rettung bringt. Die verbale Wiedergabe ist im Deutschen natürlich und vermeidet eine unnötige Titelform wie „Retter“ oder „Heiland“.
- source_word: אֶל יְהוָה
  choice: sie schrien zu Jahwe
  rationale: Im Hebräischen steht elliptisch nur „zu Jahwe“; das Verb des Rufens wird aus dem ersten Satzteil ergänzt, damit die parallele Aussage im Deutschen vollständig und verständlich ist. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְלֹא עָנָם
  choice: doch er antwortete ihnen nicht
  rationale: ענה bedeutet hier „antworten“. Das Subjekt ist der unmittelbar zuvor genannte Jahwe; „doch“ gibt den gegensätzlichen Ausgang des Hilferufs angemessen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt diesen Eigennamen in der im Deutschen üblichen Form, ohne ihn durch einen Titel zu ersetzen.
- issue: Jahwes ausbleibende Antwort
  choice: doch er antwortete ihnen nicht
  alternative: und er erhörte sie nicht
  rationale: Die direkte Wiedergabe wahrt die harte Aussage des Textes, ohne Gründe für das Schweigen Gottes zu ergänzen oder „antworten“ vorschnell als „erhören“ auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des hebräischen Verses bleibt erhalten; das im zweiten Halbvers ausgelassene Verb wird aus Verständlichkeitsgründen ergänzt.
