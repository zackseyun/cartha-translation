id: 2SA.22.4
reference: 2 Samuel 22:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מְהֻלָּ֖ל אֶקְרָ֣א יְהוָ֑ה וּ/מֵ/אֹיְבַ֖/י אִוָּשֵֽׁעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/004.yaml
  text: I call on Yahweh[a], who is worthy of praise, and I am saved from my enemies.
translation:
  language: de
  text: Ich rufe Jahwe an, der Lob verdient[a], und werde von meinen Feinden gerettet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „der gepriesen ist“ oder „der zu preisen ist“. Das hebräische Partizip bezeichnet Jahwe als den Gepriesenen beziehungsweise den, der gepriesen werden soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: der Lob verdient
  rationale: Das passive Partizip von הלל beschreibt Jahwe als den, der gepriesen wird beziehungsweise zu preisen ist. „Der Lob verdient“ gibt diesen prädikativen Sinn in natürlichem Deutsch wieder, ohne die Aussage unnötig auszudeuten.
- source_word: אֶקְרָא
  choice: ich rufe … an
  rationale: קרא mit dem Gottesnamen bezeichnet hier das betende Anrufen Jahwes; „anrufen“ ist dafür die natürliche deutsche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּמֵאֹיְבַי
  choice: und … von meinen Feinden
  rationale: Die Konjunktion verbindet die Satzteile, und die Präposition מִן bezeichnet, wovon der Sprecher gerettet wird.
- source_word: אִוָּשֵׁעַ
  choice: werde … gerettet
  rationale: Der Nifal-Imperfekt von ישׁע bezeichnet passiv das Gerettetwerden. Im Zusammenhang hat die Form einen gegenwärtig-allgemeinen beziehungsweise wiederholten Sinn; das deutsche Präsens bewahrt diesen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Zeit- und Aussagewert von אִוָּשֵׁעַ
  choice: werde … gerettet
  alternative: werde … gerettet werden
  rationale: Das hebräische Imperfekt kann je nach Zusammenhang gegenwärtig-wiederholt oder zukünftig verstanden werden. Der poetische Zusammenhang legt eine allgemeine Erfahrung des Beters nahe; die präsentische Übersetzung schließt den wiederholten Sinn ein, ohne eine ausschließlich zukünftige Erfüllung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist bewusst klar und mündlich verständlich; „Jahwe anrufen“ bewahrt den Gebetscharakter, während „Lob verdient“ die knappe hebräische Partizipialform idiomatisch wiedergibt.
