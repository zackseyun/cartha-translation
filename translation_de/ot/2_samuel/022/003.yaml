  text: אֱלֹהֵ֥י צוּרִ֖/י אֶחֱסֶה בּ֑/וֹ מָגִנִּ֞/י וְ/קֶ֣רֶן יִשְׁעִ֗/י מִשְׂגַּבִּ/י֙ וּ/מְנוּסִ֔/י מֹשִׁעִ֕/י מֵ/חָמָ֖ס תֹּשִׁעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/003.yaml
  text: my God[a], my rock, in whom I take refuge, my shield and the horn of my salvation, my stronghold and my refuge[c][b], my savior—you save me from violence.
translation:
  language: de
  text: mein Gott[a], mein Fels, bei dem ich Zuflucht suche, mein Schild und das Horn meiner Rettung[b], meine Festung und meine Zuflucht, mein Retter[c] – du rettest mich vor Gewalt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »Gott meines Felsens«; die hebräische Verbindung lässt auch diese Wiedergabe zu.'
    reason: lexical_alternative
  - marker: b
    text: Das »Horn« ist im Hebräischen ein Bild für Kraft und siegreiche Macht.
    reason: cultural_note
  - marker: c
    text: 'Oder: »mein Befreier«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי צוּרִי
  choice: mein Gott, mein Fels
  rationale: Die hebräische Verbindung kann formal als »Gott meines Felsens« verstanden werden. Die appositionale Wiedergabe ist im Deutschen natürlicher und fügt sich in die Reihe der Gottesbezeichnungen ein, ohne die formale Alternative zu verschweigen.
- source_word: אֶחֱסֶה בּוֹ
  choice: bei dem ich Zuflucht suche
  rationale: חסה bezeichnet das Suchen von Schutz oder Zuflucht; »bei dem« nimmt das auf Gott bezogene Suffix ausdrücklich auf und klingt in modernem Deutsch natürlich.
- source_word: מָגִנִּי
  choice: mein Schild
  rationale: Die konkrete Schutzmetapher wird direkt bewahrt.
- source_word: קֶרֶן יִשְׁעִי
  choice: das Horn meiner Rettung
  rationale: Die wörtliche Bildsprache von קֶרֶן bleibt erhalten; »Rettung« gibt יֶשַׁע in diesem Kontext klar und gegenwartsnah wieder.
- source_word: מִשְׂגַּבִּי
  choice: meine Festung
  rationale: מִשְׂגָּב bezeichnet einen sicheren, erhöhten Zufluchtsort. »Festung« vermittelt Schutz und Wehrhaftigkeit und bleibt von der folgenden »Zuflucht« unterscheidbar.
- source_word: וּמְנוּסִי
  choice: meine Zuflucht
  rationale: Das Wort bezeichnet einen Ort, zu dem man flieht; »Zuflucht« ist knapp und idiomatisch.
- source_word: מֹשִׁעִי
  choice: mein Retter
  rationale: Die substantivisch gebrauchte Form von ישׁע bezeichnet den, der rettet. »Retter« entspricht zugleich dem folgenden Verb »du rettest mich«.
- source_word: מֵחָמָס תֹּשִׁעֵנִי
  choice: du rettest mich vor Gewalt
  rationale: חָמָס wird als abstraktes »Gewalt« wiedergegeben, ohne nicht ausdrücklich genannte Gewalttäter einzuführen. Das hebräische Imperfekt wird im poetischen Zusammenhang als gegenwärtige beziehungsweise charakteristische Handlung formuliert.
theological_decisions:
- issue: Reihe metaphorischer Gottesbezeichnungen
  choice: Die konkreten Bilder »Fels«, »Schild«, »Horn« und »Festung« bleiben stehen.
  alternative: Die Bilder durch Deutungen wie »Beschützer« oder »Quelle meiner Kraft« ersetzen.
  rationale: Die Häufung körperlicher, räumlicher und militärischer Bilder prägt die Aussage des Verses. Eine abstrahierende Wiedergabe würde seine poetische und theologische Dichte vermindern.
- issue: Mehrdeutige Konstruktion אֱלֹהֵי צוּרִי
  choice: Appositionale Wiedergabe »mein Gott, mein Fels« mit Fußnote.
  alternative: Formal nähere Wiedergabe »Gott meines Felsens«.
  rationale: Die Apposition ist im Deutschen verständlicher und passt zur folgenden Titelfolge; die Fußnote bewahrt die grammatische Alternative.
- issue: Wiedergabe von מֹשִׁעִי
  choice: mein Retter
  alternative: mein Befreier
  rationale: »Retter« gibt die Wortwurzel ישׁע unmittelbar wieder und wird durch das folgende »du rettest mich« im Vers selbst erläutert, ohne eine spätere dogmatische Spezifizierung einzutragen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit der knappen Reihung des hebräischen Lobgesangs. Die traditionellen biblischen Bilder werden bewahrt; unnötig altertümliche Wörter und erklärende Erweiterungen werden vermieden.
