base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/002.yaml
  text: 'And he said: “The LORD is my rock and my fortress and my deliverer for me.”'
translation:
  language: de
  text: 'Und er sagte: »Der HERR ist mein Fels, meine Festung und mein Retter.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Gibt den Gottesnamen nach der im Deutschen etablierten Bibelkonvention wieder, ohne eine unsichere Vokalisierung in den Haupttext einzutragen.
- source_word: סַלְעִי
  choice: mein Fels
  rationale: Bewahrt das konkrete Schutzbild und die possessive Form des Hebräischen.
- source_word: מְצֻדָתִי
  choice: meine Festung
  rationale: Gibt den befestigten Zufluchtsort natürlich und bildkräftig wieder.
- source_word: מְפַלְטִי לִי
  choice: mein Retter
  rationale: מְפַלְטִי bezeichnet den, der rettet bzw. entkommen lässt; לִי verstärkt die persönliche Beziehung, die im idiomatischen deutschen »mein Retter« bereits ausgedrückt ist.
theological_decisions:
- issue: Wiedergabe des Tetragramms
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe ist verständlich und würdevoll; sie vermeidet zugleich, eine bestimmte Rekonstruktion der Aussprache festzulegen.
- issue: Explizite Wiedergabe von לִי
  choice: nicht zusätzlich zu »mein Retter« wiedergegeben
  alternative: »mein Retter für mich« oder »der mich rettet«
  rationale: Eine zusätzliche wörtliche Wiedergabe wäre im Deutschen schwerfällig und semantisch redundant. Der persönliche Bezug bleibt durch »mein« vollständig erhalten.
translation_notes:
  register: Poetisch, knapp und würdevoll. Die dreigliedrige Bildfolge bleibt erhalten; die deutschen Possessivformen werden entsprechend dem natürlichen Sprachgebrauch wiederholt.
