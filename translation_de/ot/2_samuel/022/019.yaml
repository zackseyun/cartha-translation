base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/019.yaml
  text: They confronted me in the day of my calamity[b][a], but Yahweh was my support.
translation:
  language: de
  text: Am Tag meines Unglücks traten sie mir entgegen[a], doch Jahwe[b] war mir eine Stütze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kamen sie mir zuvor“; auch: „stießen sie auf mich“.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text nennt hier den Gottesnamen JHWH; traditionell wird er mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: יְקַדְּמֻנִי
  choice: traten sie mir entgegen
  rationale: Das Piel von קדם mit Objekt bezeichnet hier im feindlichen Zusammenhang ein entgegentretendes, konfrontierendes Begegnen. Die Formulierung ist natürlich und bewahrt zugleich die mögliche räumliche Grundbedeutung.
- source_word: בְּיוֹם אֵידִי
  choice: Am Tag meines Unglücks
  rationale: בְּיוֹם ist eine zeitliche Angabe; אֵיד bezeichnet schweres Unglück, Verderben oder Unheil. „Unglück“ ist im Deutschen klar und lässt die genaue Art der Not offen.
- source_word: וַיְהִי
  choice: doch ... gab
  rationale: Das Waw verbindet formal die Sätze, drückt im Zusammenhang aber einen deutlichen Gegensatz zwischen dem feindlichen Angriff und Jahwes Beistand aus. „Doch“ macht diesen Zusammenhang natürlich sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִשְׁעָן לִי
  choice: gab mir Halt
  rationale: מִשְׁעָן bezeichnet etwas, worauf man sich stützt. Die idiomatische deutsche Wendung „gab mir Halt“ gibt das Bild verständlich wieder, ohne es unnötig auf einen konkreten Stab festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt dessen Funktion als Gottes persönlicher Name; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Art von Jahwes Hilfe
  choice: gab mir Halt
  alternative: war meine Stütze
  rationale: Beide Wiedergaben bewahren die Metapher von etwas, worauf man sich stützen kann. „Gab mir Halt“ klingt in modernem Deutsch natürlicher und behauptet keine über den Vers hinausgehende Art der Rettung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus bleibt knapp; „traten sie mir entgegen“ bewahrt die feindliche Konfrontation, während „gab mir Halt“ die Stützmetapher idiomatisch ausdrückt.
