id: 2SA.22.31
reference: 2 Samuel 22:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָ/אֵ֖ל תָּמִ֣ים דַּרְכּ֑/וֹ אִמְרַ֤ת יְהוָה֙ צְרוּפָ֔ה מָגֵ֣ן ה֔וּא לְ/כֹ֖ל הַ/חֹסִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is proven; he is a shield to all who take refuge in him.
translation:
  language: de
  text: 'Gott – sein Weg ist vollkommen;

    das Wort Jahwes ist geläutert.[a]

    Ein Schild ist er für alle,

    die bei ihm Zuflucht suchen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »geprüft« oder »bewährt«. Das hebräische Wort erinnert an Metall, das im Feuer geläutert wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Gott
  rationale: Der bestimmte Ausdruck bezeichnet Gott und steht hervorgehoben am Satzanfang. Der Gedankenstrich gibt diese thematische Hervorhebung im Deutschen natürlich wieder.
- source_word: תָּמִים
  choice: vollkommen
  rationale: Das Wort bezeichnet hier einen Weg ohne Fehler oder Mangel. »Vollkommen« passt zu Gottes Handeln und vermeidet die im Deutschen bei »untadelig« vorherrschende moralisch-forensische Färbung.
- source_word: דַּרְכּוֹ
  choice: sein Weg
  rationale: »Weg« bewahrt sowohl das poetische Bild als auch den Bezug auf Gottes Handlungsweise.
- source_word: אִמְרַת יְהוָה
  choice: das Wort Jahwes
  rationale: אִמְרָה kann Wort, Ausspruch oder Zusage bezeichnen. »Wort« lässt diese Bedeutungsbreite offen und fügt sich in den poetischen Parallelismus ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird im modernen deutschen Text als »Jahwe« wiedergegeben statt durch einen Titel ersetzt.
- source_word: צְרוּפָה
  choice: geläutert
  rationale: Die Form greift das Prüfen und Reinigen von Metall im Feuer auf. »Geläutert« bewahrt dieses konkrete Bild; daraus ergibt sich zugleich der Sinn, dass Jahwes Wort geprüft und zuverlässig ist.
- source_word: מָגֵן הוּא
  choice: Ein Schild ist er
  rationale: Die vorangestellte Prädikatsangabe erhält die poetische Betonung des Schutzbildes und klingt in gehobenem modernem Deutsch natürlich.
- source_word: לְכֹל הַחֹסִים בּוֹ
  choice: für alle, die bei ihm Zuflucht suchen
  rationale: חסה bezeichnet das Aufsuchen von Schutz. »Bei ihm Zuflucht suchen« bewahrt die konkrete Schutzmetaphorik und harmoniert mit dem Bild des Schildes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. »Jahwe« bewahrt ihn als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Metaphorische Bedeutung von צְרוּפָה
  choice: geläutert
  alternative: bewährt / geprüft
  rationale: Die wörtlichere Wiedergabe erhält das Bild der Metallläuterung und damit sowohl den Vorgang des Prüfens als auch das Ergebnis der erwiesenen Reinheit und Zuverlässigkeit.
translation_notes:
  register: Poetisches, würdiges Standarddeutsch mit kurzen Parallelzeilen. Der Gedankenstrich markiert die hervorgehobene Eröffnung; die Umstellung »Ein Schild ist er« erhält den Nachdruck des hebräischen Nominalsatzes.
