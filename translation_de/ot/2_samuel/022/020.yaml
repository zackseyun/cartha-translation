base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/020.yaml
  text: He brought me out into a broad place[a]; he rescued me[b], because he delighted in me.
translation:
  language: de
  text: Er brachte mich hinaus in die Weite[a]; er rettete mich, weil er Gefallen an mir hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in einen weiten Raum“. Das hebräische Bild stellt Freiheit und Erleichterung der Enge und Bedrängnis gegenüber.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil er Freude an mir hatte“ / „weil er Wohlgefallen an mir hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: Er führte mich hinaus
  rationale: Die Hifil-Form von יצא bedeutet, jemanden hinauszuführen bzw. herauszubringen. „Führte mich hinaus“ ist im Deutschen natürlich und bewahrt die Bewegung aus der Bedrängnis.
- source_word: לַמֶּרְחָב
  choice: ins Weite
  rationale: מֶרְחָב bezeichnet einen weiten, offenen Raum und steht bildhaft für Freiheit und Erleichterung im Gegensatz zu Enge und Bedrängnis.
- source_word: יְחַלְּצֵנִי
  choice: er rettete mich
  rationale: חלץ im Piel kann „herausziehen“, „befreien“ oder „retten“ bedeuten. „Rettete mich“ ist verständlich und entspricht dem Zusammenhang der Befreiung.
- source_word: כִּי
  choice: weil
  rationale: כִּי führt hier den Grund für die Rettung ein; „weil“ gibt diesen Zusammenhang im modernen Deutschen klar wieder.
- source_word: חָפֵץ בִּי
  choice: er Gefallen an mir hatte
  rationale: חפץ mit ב bezeichnet Wohlgefallen oder Freude an einer Person. Die Formulierung bewahrt die persönliche Zuwendung, ohne eine weitergehende Begründung in den Text einzutragen.
theological_decisions:
- issue: Grund der göttlichen Rettung
  choice: weil er Gefallen an mir hatte
  alternative: weil er Freude an mir hatte
  rationale: Der Vers selbst begründet Davids Rettung mit Gottes Wohlgefallen an ihm. Die Übersetzung lässt diese theologische Spannung stehen und deutet sie nicht als allgemeine Aussage über Verdienst oder dessen Voraussetzungen aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ins Weite“ erhält das räumliche Befreiungsbild in einer geläufigen deutschen Wendung; die Fußnoten nennen die engeren lexikalischen Alternativen.
