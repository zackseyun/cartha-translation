  text: ו/תגעש וַ/תִּרְעַשׁ֙ הָ/אָ֔רֶץ מוֹסְד֥וֹת הַ/שָּׁמַ֖יִם יִרְגָּ֑זוּ וַ/יִּֽתְגָּעֲשׁ֖וּ כִּֽי חָ֥רָה לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/008.yaml
  text: Then the earth reeled and quaked; the foundations of the heavens trembled and shook, because he was angry.
translation:
  language: de
  text: Da wankte und bebte die Erde; die Grundfesten des Himmels erzitterten und schwankten, weil sein Zorn entbrannt war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: bebte
  rationale: Das Verb רעש bezeichnet heftiges Beben oder Erschüttern; zusammen mit dem vorausgehenden Bewegungsverb ergibt „wankte und bebte“ im Deutschen eine natürliche, bildkräftige Doppelung.
- source_word: מוֹסְדוֹת הַשָּׁמַיִם
  choice: die Grundfesten des Himmels
  rationale: Die konkrete kosmische Bildsprache des Hebräischen wird bewahrt; „Grundfesten“ gibt die tragenden Fundamente treffend und würdig wieder.
- source_word: יִרְגָּזוּ וַיִּתְגָּעֲשׁוּ
  choice: erzitterten und schwankten
  rationale: Die beiden Verben schildern Erschütterung und heftige Bewegung. Die koordinierte Wiedergabe erhält die poetische Steigerung, ohne beide Verben gleich zu übersetzen.
- source_word: כִּי חָרָה לוֹ
  choice: weil sein Zorn entbrannt war
  rationale: Die hebräische Wendung bedeutet wörtlich, dass es ihm „entbrannte“, und bezeichnet aufflammenden Zorn. Die deutsche Formulierung bewahrt das Feuerbild und macht den impliziten Zorn natürlich ausdrücklich.
theological_decisions:
- issue: Göttlicher Zorn als Ursache der kosmischen Erschütterung
  choice: weil sein Zorn entbrannt war
  alternative: weil er zornig war
  rationale: Die gewählte Fassung bewahrt sowohl den kausalen Zusammenhang als auch die im hebräischen Verb חרה enthaltene Bildvorstellung des Entbrennens, ohne den Zorn abzuschwächen oder weiter auszudeuten.
translation_notes:
  register: Poetisch, kraftvoll und zugleich in modernem Standarddeutsch verständlich. Die parallelen Bewegungsverben und die kosmische Metaphorik bleiben erhalten; archaisierende Satzformen werden vermieden.
