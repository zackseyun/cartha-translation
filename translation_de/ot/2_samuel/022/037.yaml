  text: תַּרְחִ֥יב צַעֲדִ֖/י תַּחְתֵּ֑/נִי וְ/לֹ֥א מָעֲד֖וּ קַרְסֻלָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/037.yaml
  text: You widen my steps beneath me[b][a], and my ankles have not given way.
translation:
  language: de
  text: Du gibst meinen Schritten weiten Raum[a], und meine Knöchel wanken nicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Du machst meine Schritte weit unter mir.“ Gemeint ist, dass Gott sicheren und großzügigen Raum zum Gehen schafft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Knöchel gleiten nicht aus“ beziehungsweise „geben nicht nach“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: du gibst … weiten Raum
  rationale: Der Hifil von רחב bezeichnet das Schaffen von Weite. Die deutsche Wendung gibt den kausativen Sinn natürlich wieder und bewahrt das räumliche Bild.
- source_word: צַעֲדַי
  choice: meinen Schritten
  rationale: צעד bezeichnet den Schritt oder das Schreiten. Die direkte Körper- und Bewegungsmetaphorik des Hebräischen bleibt erhalten.
- source_word: תַּחְתֵּנִי
  choice: im Ausdruck „weiten Raum geben“ sinngemäß enthalten
  rationale: Wörtlich bedeutet die Form „unter mir“. Im Deutschen drückt die gewählte idiomatische Formulierung den sicheren, großzügigen Raum zum Auftreten aus; die wörtliche Struktur wird in Fußnote [a] dokumentiert.
- source_word: וְלֹא
  choice: und … nicht
  rationale: Die einfache Beiordnung des hebräischen Textes bleibt erhalten; eine Zweck- oder Folgerelation wird nicht ausdrücklich ergänzt.
- source_word: מָעֲדוּ
  choice: wanken nicht
  rationale: מעד kann ausgleiten, wanken oder nachgeben bedeuten. Bei den Knöcheln als Subjekt vermittelt „wanken“ körperliche Instabilität, ohne das Bild auf ein bestimmtes Missgeschick festzulegen.
- source_word: קַרְסֻלָּי
  choice: meine Knöchel
  rationale: Das seltene Substantiv bezeichnet die Knöchel beziehungsweise den Knöchelbereich; „Knöchel“ ist genauer als das allgemeinere „Füße“.
