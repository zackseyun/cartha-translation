  text: כִּ֥י שָׁמַ֖רְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹ֥א רָשַׁ֖עְתִּי מֵ/אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/022.yaml
  text: For I have kept the ways of Yahweh[a], and have not wickedly departed from my God.
translation:
  language: de
  text: 'Denn ich habe die Wege Jahwes bewahrt

    und bin nicht gottlos von meinem Gott abgekehrt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und entspricht dem erklärenden Zusammenhang des Liedes.
- source_word: שָׁמַרְתִּי
  choice: ich bin … geblieben
  rationale: שׁמר bedeutet grundsätzlich „bewahren, einhalten“. Zusammen mit „Wegen“ gibt „auf den Wegen … geblieben“ im Deutschen idiomatisch beständiges Festhalten an ihnen wieder.
- source_word: דַּרְכֵי
  choice: auf den Wegen
  rationale: Der Plural von דֶּרֶךְ bezeichnet hier die von Gott gewiesene Lebensführung; „Wege“ bewahrt das hebräische Bild.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Die gebräuchliche deutsche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: וְלֹא
  choice: und … nicht
  rationale: Verbindet die zweite Aussage als negative Parallele mit der ersten.
- source_word: רָשַׁעְתִּי
  choice: habe mich … abgewandt und schuldig gemacht
  rationale: Das Verb bezeichnet schuldhaftes oder gottloses Handeln. In Verbindung mit מִן bringt die Formulierung sowohl die moralische Schuld als auch die Abkehr von Gott zum Ausdruck.
- source_word: מֵאֱלֹהָי
  choice: von meinem Gott
  rationale: מִן bezeichnet am natürlichsten Trennung oder Entfernung; das Possessivsuffix wird mit „meinem“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen; „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von רָשַׁעְתִּי מֵאֱלֹהָי
  choice: habe mich nicht von meinem Gott abgewandt und schuldig gemacht
  alternative: habe nicht gottlos gegen meinen Gott gehandelt
  rationale: Die gewählte Fassung bewahrt sowohl den Schuldbegriff des Verbs als auch die durch מִן ausgedrückte Abkehr. Sie legt nicht einseitig entweder nur moralisches Fehlverhalten oder nur räumlich-bildhafte Trennung fest.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Der Parallelismus der beiden Vershälften und das Wegmotiv bleiben erkennbar; die ungewöhnliche hebräische Verbindung im zweiten Halbvers wird verständlich, ohne ihre moralisch-relationale Spannung zu verflachen.
