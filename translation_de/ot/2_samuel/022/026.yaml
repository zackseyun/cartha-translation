  text: עִם חָסִ֖יד תִּתְחַסָּ֑ד עִם גִּבּ֥וֹר תָּמִ֖ים תִּתַּמָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/026.yaml
  text: With the faithful you show yourself faithful; with the blameless warrior you show yourself blameless.
translation:
  language: de
  text: Dem Treuen erweist du dich treu, dem untadeligen Kämpfer erweist du dich untadelig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָסִיד
  choice: der Treue
  rationale: Das Wort bezeichnet hier einen Menschen, der von beständiger Treue und Verbundenheit geprägt ist; „der Treue“ erhält zugleich die Wortentsprechung zum folgenden Verb.
- source_word: תִּתְחַסָּד
  choice: erweist du dich treu
  rationale: Die reflexiv wirkende Verbform beschreibt, wie Gott sich dem Treuen gegenüber zeigt bzw. verhält. Die Formulierung bewahrt das hebräische Wortspiel mit חָסִיד.
- source_word: גִּבּוֹר תָּמִים
  choice: der untadelige Kämpfer
  rationale: גִּבּוֹר bezeichnet einen starken, kampffähigen Mann beziehungsweise Krieger; im Liedkontext ist „Kämpfer“ natürlich und vermeidet eine unnötige geschlechtliche Ergänzung. תָּמִים meint hier Integrität oder Untadeligkeit.
- source_word: תִּתַּמָּם
  choice: erweist du dich untadelig
  rationale: Die Wiedergabe bildet die parallele reflexive Aussage und das Wortspiel mit תָּמִים nach, ohne die theologische Spannung der Aussage aufzulösen.
theological_decisions:
- issue: Gottes entsprechendes Handeln gegenüber dem Menschen
  choice: „erweist du dich“
  alternative: „handelst du treu/untadelig“
  rationale: Die gewählte Form wahrt die Aussage, dass Gott sich dem jeweiligen Menschen in entsprechender Weise zeigt, ohne daraus ein starres Vergeltungsschema abzuleiten.
- issue: Bedeutung von תמים bei Gott
  choice: „untadelig“
  alternative: „vollkommen“ oder „lauter“
  rationale: „Untadelig“ bewahrt die direkte lexikalische Parallele zum untadeligen Kämpfer und vermeidet, die Aussage durch eine systematisch-theologische Deutung zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem Parallelismus und hörbarem Wortspiel. Die knappe poetische Struktur des hebräischen Liedverses bleibt erhalten.
