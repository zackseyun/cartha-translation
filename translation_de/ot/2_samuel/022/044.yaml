source:
  edition: WLC
  text: וַֽ/תְּפַלְּטֵ֔/נִי מֵ/רִיבֵ֖י עַמִּ֑/י תִּשְׁמְרֵ֨/נִי֙ לְ/רֹ֣אשׁ גּוֹיִ֔ם עַ֥ם לֹא יָדַ֖עְתִּי יַעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/044.yaml
  text: You delivered me from the strivings of my people[a]; you kept me as the head of nations[c][b]; a people I had not known served me.
translation:
  language: de
  text: Du hast mich aus den Auseinandersetzungen meines Volkes gerettet[a]; du bewahrst mich zum Haupt über Nationen[b]. Ein Volk, das ich nicht kannte, dient mir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus den Streitigkeiten meines Volkes“. Das Hebräische kann inneren Streit in Davids eigenem Volk oder Konflikte bezeichnen, an denen sein Volk beteiligt war.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du erhältst mich als Oberhaupt über Nationen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wird mir dienen“. Die hebräische Imperfektform kann in diesem poetischen Zusammenhang auch zukünftig verstanden werden.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַתְּפַלְּטֵנִי
  choice: Du hast mich … gerettet
  rationale: Das Hifil von פלט bezeichnet, jemanden entkommen zu lassen oder zu retten. „Gerettet“ gibt die göttliche Befreiung klar und natürlich wieder.
- source_word: מֵרִיבֵי עַמִּי
  choice: aus den Auseinandersetzungen meines Volkes
  rationale: רִיב kann Streit, Auseinandersetzung oder Rechtsstreit bezeichnen. Die gewählte Formulierung bleibt weit genug, um sowohl inneren Streit im eigenen Volk als auch Konflikte, an denen das Volk beteiligt ist, offenzulassen.
- source_word: תִּשְׁמְרֵנִי
  choice: du bewahrst mich
  rationale: שׁמר bedeutet bewahren, behüten oder erhalten. Das Präsens lässt den poetischen Imperfektcharakter erkennen und beschreibt Gottes fortdauerndes Erhalten Davids in seiner Stellung.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: als Haupt von Nationen
  rationale: רֹאשׁ bezeichnet bildlich den Vorrangigen oder Herrscher. „Haupt“ bewahrt die hebräische Metapher; לְ wird hier als Rollen- oder Ergebnisangabe verstanden.
- source_word: עַם לֹא יָדַעְתִּי
  choice: Ein Volk, das ich nicht kannte
  rationale: Das singularische Kollektiv עַם wird indefinit wiedergegeben. ידע bezeichnet hier vorherige Kenntnis oder Bekanntschaft, ohne dass eine speziellere Beziehung vorausgesetzt wird.
- source_word: יַעַבְדֻנִי
  choice: dient mir
  rationale: עבד kann in königlichem Zusammenhang politischen Dienst oder Unterordnung bezeichnen. „Dient mir“ erhält die lexikalische Offenheit und gibt den poetischen Imperfekt als gegenwärtigen beziehungsweise fortdauernden Sachverhalt wieder.
theological_decisions:
- issue: Königliche Herrschaft über fremde Nationen
  choice: Die Aussage wird zunächst im historischen Zusammenhang von Davids Rettung und Königtum wiedergegeben.
  alternative: Den Vers im Haupttext ausdrücklich messianisch deuten.
  rationale: Der unmittelbare Kontext ist Davids Lied über Gottes Rettung und die Festigung seiner Königsherrschaft. Eine weiterführende typologische oder messianische Lesart wird durch die Übersetzung weder ausgeschlossen noch in den Wortlaut hineingetragen.
- issue: Zeitbezug der poetischen Imperfektformen
  choice: Die fortdauernde Gegenwart wird im Haupttext mit „bewahrst“ und „dient“ ausgedrückt.
  alternative: Retrospektiv „bewahrtest“ und „diente“ oder vorausschauend „wirst bewahren“ und „wird dienen“.
  rationale: Die hebräischen Imperfektformen erlauben im poetischen Rückblick verschiedene Zeitnuancen. Das Präsens bewahrt den Eindruck eines anhaltenden Zustands; die Zukunftsmöglichkeit der letzten Form wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede Gottes und die poetische Parallelität bleiben erhalten. „Haupt von Nationen“ bewahrt bewusst die königliche Metapher des Hebräischen; die Zeitstufen der poetischen Verben werden nicht unnötig vereinheitlicht.
