base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/040.yaml
  text: You armed me with strength for battle[b][a]; you caused those who rose against me to bow beneath me.
translation:
  language: de
  text: Du hast mich mit Kraft zum Kampf gerüstet[a]; du hast die, die sich gegen mich erhoben, vor mir in die Knie gezwungen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du hast mich für den Kampf mit Kraft umgürtet.« Das hebräische Verb bezeichnet das Umgürten und damit das Ausrüsten oder Bereitmachen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Du hast meine Gegner unter mich gebeugt.« Das hebräische Verb kann ausdrücken, dass jemand zum Niederknien oder Sichbeugen gebracht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּזְרֵנִי
  choice: du hast mich … gerüstet
  rationale: Das Verb bezeichnet hier das Umgürten beziehungsweise Ausrüsten. „Gerüstet“ bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: חַיִל
  choice: mit Kraft
  rationale: חַיִל kann Kraft, Stärke, Tüchtigkeit oder militärische Macht bezeichnen. Im Zusammenhang der Befähigung zum Kampf trifft „Kraft“ den Sinn klar und knapp.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: מִלְחָמָה bezeichnet Krieg oder Kampf. „Zum Kampf“ passt idiomatisch zur Wendung „mit Kraft gerüstet“.
- source_word: תַּכְרִיעַ
  choice: du hast … gebeugt
  rationale: Der Hifil von כרע bedeutet, jemanden zum Beugen oder Niederknien zu bringen. „Gebeugt“ erhält das konkrete räumliche Bild.
- source_word: קָמַי
  choice: die, die sich gegen mich erhoben
  rationale: Die Form bezeichnet wörtlich die gegen den Sprecher Aufstehenden. Die Wiedergabe bewahrt sowohl die Bewegung als auch den feindlichen Sinn.
- source_word: תַּחְתֵּנִי
  choice: unter mich
  rationale: Die Präposition bedeutet wörtlich „unter mir/mich“. Mit dem kausativen Bewegungsverb ist „unter mich gebeugt“ im Deutschen präzise und verständlich.
