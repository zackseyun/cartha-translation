base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/043.yaml
  text: I crushed them like the dust of the earth[a]; like the mud of the streets I pounded them and trampled them down.
translation:
  language: de
  text: Ich zermalmte sie wie den Staub der Erde; wie den Schlamm der Straßen zerstieß ich sie und stampfte sie nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „breitete sie aus“. Das hebräische Verb kann auch das Breitschlagen oder Ausbreiten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Ich zermalmte sie
  rationale: Das Qal von שׁחק bezeichnet hier ein Zermalmen oder Feinreiben. „Zermalmte“ bewahrt die gewaltsame Bildsprache und führt natürlich zum Vergleich mit Staub.
- source_word: כַּעֲפַר אָרֶץ
  choice: zu Staub auf der Erde
  rationale: עָפָר kann Staub oder lockere Erde bezeichnen, אָרֶץ Erde beziehungsweise Erdboden. Die Formulierung gibt das Ergebnisbild idiomatisch wieder und vermeidet das im Deutschen missverständliche „Staub der Erde“.
- source_word: כְּטִיט חוּצוֹת
  choice: wie den Schlamm auf den Straßen
  rationale: טִיט bedeutet Schlamm oder Morast; חוּצוֹת bezeichnet Straßen oder öffentliche Plätze. „Schlamm auf den Straßen“ ist anschaulich und in modernem Deutsch natürlich.
- source_word: אֲדִקֵּם
  choice: zerstieß ich sie
  rationale: Das Hifil von דקק bezeichnet das Zerkleinern oder Zerstoßen. „Zerstieß“ erhält die Steigerung und vermeidet eine bloße Wiederholung von „zermalmte“.
- source_word: אֶרְקָעֵם
  choice: stampfte sie nieder
  rationale: רקע kann schlagen, breitklopfen oder ausbreiten bedeuten. Im Bild von Straßenschlamm passt „niederstampfen“ gut, ohne die lexikalische Spannweite zu verschweigen; die Alternative wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftiger poetischer Parallelität. Das erste Bild wird idiomatisch als Ergebnis („zu Staub“) formuliert; die mögliche Mehrdeutigkeit des Schlussverbs bleibt durch die Fußnote sichtbar.
