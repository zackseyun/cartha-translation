  text: וַ/יָּ֥שֶׁת חֹ֛שֶׁךְ סְבִיבֹתָ֖י/ו סֻכּ֑וֹת חַֽשְׁרַת מַ֖יִם עָבֵ֥י שְׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/012.yaml
  text: He made darkness a shelter around him[a], a massing of waters, thick clouds of the skies.
translation:
  language: de
  text: 'Er machte die Finsternis rings um sich zu Schutzhütten: eine Ballung von Wasser, dichtes Gewölk am Himmel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁת
  choice: Er machte … zu
  rationale: Das Verb bedeutet „setzen, stellen, machen“. Die Konstruktion „machte … zu“ gibt im Deutschen die Verbindung mit dem folgenden Bild natürlich wieder.
- source_word: חֹשֶׁךְ
  choice: die Finsternis
  rationale: Die übliche Entsprechung bewahrt hier das Bild der verhüllenden Dunkelheit bei der Gotteserscheinung.
- source_word: סְבִיבֹתָיו
  choice: rings um sich
  rationale: Gibt die räumliche Umschließung idiomatisch und mit poetischem Klang wieder.
- source_word: סֻכּוֹת
  choice: zu seinem Versteck
  rationale: Der hebräische Plural bezeichnet Hütten oder Schutzräume. Der deutsche Singular fasst ihre verhüllende Funktion kollektiv zusammen und vermeidet das missverständliche Bild mehrerer konkreter Hütten.
- source_word: חַשְׁרַת מַיִם
  choice: eine Ballung von Wasser
  rationale: Die seltene, unsichere Wendung bezeichnet wahrscheinlich eine Ansammlung oder dichte Masse von Wasser. „Ballung“ erhält das konkrete, verdichtete Sturmcloud-Bild, ohne vorschnell „Regenwolken“ einzusetzen.
- source_word: עָבֵי שְׁחָקִים
  choice: dichtes Gewölk am Himmel
  rationale: עָבִים bezeichnet dichte Wolken, שְׁחָקִים die Himmelshöhen. „Dichtes Gewölk am Himmel“ ist natürlich, würdig und poetisch.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Der Parallelismus und die dichte Gewitterbildsprache bleiben erhalten; seltene hebräische Ausdrücke werden nicht unnötig vereindeutigt.
