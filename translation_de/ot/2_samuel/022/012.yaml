  naturalness: Die Bildfolge ist in würdiger moderner Standardsprache gut verständlich. „Schutzhütten“ ist hier eine natürliche, konkrete und dem poetischen Sturmtheophanie-Bild angemessene Wiedergabe; der Doppelpunkt bewahrt die appositionelle Bildentfaltung.
  terminology: „Finsternis“, „Ballung von Wasser“ und „dichtes Gewölk am Himmel“ sind passend. „Schutzhütten“ wahrt den Schutzaspekt von סֻכּוֹת ohne die abweichende Bedeutung von „Versteck“ einzutragen.
