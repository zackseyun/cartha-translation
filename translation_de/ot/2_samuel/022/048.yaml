  text: הָ/אֵ֕ל הַ/נֹּתֵ֥ן נְקָמֹ֖ת לִ֑/י וּ/מוֹרִ֥יד עַמִּ֖ים תַּחְתֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/048.yaml
  text: the God who gives vengeance to me and brings peoples down under me.
translation:
  language: de
  text: der Gott, der mir Rache gewährt und Völker unter mich zwingt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: der Gott
  rationale: Gibt den bestimmten Ausdruck wörtlich und im Zusammenhang als Fortsetzung der Beschreibung Gottes wieder.
- source_word: הַנֹּתֵן נְקָמֹת לִי
  choice: der mir Rache gewährt
  rationale: Bewahrt die ungewöhnliche Richtung des hebräischen לִי („mir“) und glättet sie nicht zu „für mich“. Der Plural נְקָמוֹת kann im Deutschen idiomatisch kollektiv als „Rache“ erscheinen.
- source_word: וּמוֹרִיד עַמִּים תַּחְתֵּנִי
  choice: und Völker unter mich zwingt
  rationale: מוֹרִיד bedeutet wörtlich „herabführt/herunterbringt“; mit תַּחְתֵּנִי bezeichnet es die Unterwerfung von Völkern unter den Sprecher. „zwingt“ macht diesen Sinn in natürlichem Deutsch deutlich.
theological_decisions:
- issue: Richtung der von Gott gewährten Vergeltung
  choice: mir Rache gewährt
  alternative: für mich Rache übt
  rationale: Die Übersetzung erhält das hebräische לִי als „mir“ und vermeidet es, die mögliche Spannung vorschnell in eine stellvertretende Handlung Gottes „für mich“ aufzulösen.
- issue: Unterordnung der Völker
  choice: Völker unter mich zwingt
  alternative: Völker unter mich herabführt
  rationale: Die Formulierung gibt die königliche Unterwerfung wieder, ohne näher zu bestimmen, auf welche politische oder heilsgeschichtliche Weise sie erfolgt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Konstruktion ist knapp und parallel gebaut; „Rache gewährt“ bewahrt die fremdartige, aber verständliche Aussage des Hebräischen.
