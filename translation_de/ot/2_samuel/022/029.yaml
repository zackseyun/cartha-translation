  text: כִּֽי אַתָּ֥ה נֵירִ֖/י יְהוָ֑ה וַ/יהוָ֖ה יַגִּ֥יהַּ חָשְׁכִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/029.yaml
  text: For you are my lamp[a], O Yahweh[b], and Yahweh lights up my darkness.
translation:
  language: de
  text: Denn du bist meine Leuchte[a], Jahwe, und Jahwe erhellt meine Finsternis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meine Lampe“; auch möglich: „mein Licht“. Das Hebräische verwendet das konkrete Bild einer Lampe oder Leuchte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Aussage. „Denn“ bewahrt diesen Zusammenhang, ohne ihn enger als nötig festzulegen.
- source_word: אַתָּה
  choice: du
  rationale: Das betonte Personalpronomen der zweiten Person Singular gibt die unmittelbare Anrede natürlich wieder.
- source_word: נֵירִי
  choice: meine Leuchte
  rationale: נֵר bezeichnet konkret eine Lampe beziehungsweise Leuchte. „Leuchte“ bewahrt das anschauliche Bild und klingt im Deutschen würdig und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיהוָה
  choice: und Jahwe
  rationale: Die Wiederholung des Gottesnamens und die Verknüpfung der beiden Satzteile bleiben erhalten.
- source_word: יַגִּיהַּ
  choice: macht … hell
  rationale: Der Hifil von נגה drückt das Verursachen von Helligkeit aus. Die Formulierung ist idiomatisch und erhält die bildhafte, kausative Aussage.
- source_word: חָשְׁכִּי
  choice: meine Finsternis
  rationale: Das Substantiv mit Suffix bedeutet wörtlich „meine Finsternis“. Die Wiedergabe lässt offen, ob Bedrängnis, Gefahr oder innere Dunkelheit gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der hebräische Text nennt den Gottesnamen zweimal ausdrücklich. „Jahwe“ bewahrt den persönlichen Namen und die Wiederholung des Originals.
translation_notes:
  register: Moderne, würdige Standardsprache mit erhaltener poetischer Bildhaftigkeit. „Leuchte“ ist konkreter als „Licht“, im Deutschen jedoch natürlicher als die wörtlichere Form „Lampe“. Die knappe Parallelstruktur und die zweimalige Nennung Jahwes bleiben erhalten.
