base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/030.yaml
  text: For by you I can run against a troop[c][b][a]; by my God I can leap over a wall.
translation:
  language: de
  text: Denn mit dir kann ich gegen eine Truppe anrennen[a][b]; mit meinem Gott kann ich über eine Mauer springen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch dich“ beziehungsweise „mithilfe von dir“; die hebräische Präposition kann Begleitung oder Mittel ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Streifschar“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „einen Schutzwall“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und bewahrt den Zusammenhang in natürlichem deutschem Bibelstil.
- source_word: בְכָה
  choice: mit dir
  rationale: Die Präposition ב kann Begleitung oder Mittel bezeichnen. „Mit dir“ ist im Deutschen natürlich und wahrt diese Mehrdeutigkeit, wobei der Zusammenhang Gottes Befähigung erkennen lässt.
- source_word: אָרוּץ
  choice: kann ich … anrennen
  rationale: Das Qal-Imperfekt kann hier in poetischer Rede eine von Gott verliehene Fähigkeit ausdrücken. „Anrennen gegen“ gibt die militärische Bewegung prägnant wieder.
- source_word: גְּדוּד
  choice: eine Truppe
  rationale: גדוד bezeichnet eine Truppe oder Streifschar. „Truppe“ ist klar, gegenwärtig verständlich und passt zum militärischen Bild.
- source_word: בֵּאלֹהַי
  choice: mit meinem Gott
  rationale: Die parallele Präposition wird ebenso wie im ersten Halbvers wiedergegeben. „Mein Gott“ bewahrt den persönlichen Ton.
- source_word: אֲדַלֶּג
  choice: kann ich … springen
  rationale: Das Piel-Imperfekt von דלג bezeichnet Springen oder Überspringen; die Fähigkeitsform entspricht dem parallelen ersten Halbvers.
- source_word: שׁוּר
  choice: eine Mauer
  rationale: שׁוּר bezeichnet hier eine Mauer, wahrscheinlich im Zusammenhang einer Befestigung. „Mauer“ ist die direkte und allgemein verständliche Wiedergabe.
theological_decisions:
- issue: Göttliche Befähigung in militärischer Bildsprache
  choice: 'Die Imperfektformen werden als von Gott ermöglichte Fähigkeit wiedergegeben: „kann ich …“'
  alternative: 'Schlichte Handlungsaussage: „renne ich … springe ich“'
  rationale: Im poetischen Zusammenhang liegt die Aussage über eine durch Gott ermöglichte Fähigkeit nahe. Die Übersetzung macht dies sichtbar, ohne eine weitergehende dogmatische Folgerung einzutragen.
- issue: Bedeutung der Präposition ב
  choice: „mit dir / mit meinem Gott“
  alternative: „durch dich / durch meinen Gott“ oder „mithilfe von dir / mithilfe meines Gottes“
  rationale: „Mit“ bewahrt im Deutschen eher die mögliche Spannung zwischen Begleitung und Mittel. Der parallele Aufbau und „kann ich“ lassen zugleich die befähigende Rolle Gottes erkennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. „Anrennen“ erhält die kraftvolle militärische Bildsprache; die Wiederholung von „mit“ und „kann ich“ bildet die hebräischen Halbverse nach.
