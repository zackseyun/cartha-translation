  source_fidelity: Der Entwurf gibt die beiden hebräischen Imperfektformen angemessen als durch Gott ermöglichte Fähigkeit wieder ("kann ich"). „Mit dir / mit meinem Gott“ ist für בְּ als begleitende und zugleich instrumentale Präposition vertretbar und bewahrt die mögliche Ambiguität. „Gegen eine Truppe anrennen“ trifft die kriegerische Bildsprache von אָרוּץ גְּדוּד, und „über eine Mauer springen“ gibt אֲדַלֶּג שׁוּר direkt wieder.
