base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/018.yaml
  text: He rescued me from my strong enemy, from those who hated me, for they were too mighty for me.
translation:
  language: de
  text: Er rettete mich vor meinem starken Feind, vor denen, die mich hassten; denn sie waren mir zu mächtig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: Er rettete mich
  rationale: Das Hifil von נצל bezeichnet hier die Befreiung oder Rettung aus einer Bedrohung; das deutsche Präteritum entspricht dem erzählenden Rückblick des Liedes.
- source_word: מֵאֹיְבִי עָז
  choice: vor meinem starken Feind
  rationale: עָז bedeutet hier »stark« beziehungsweise »mächtig«. »Stark« gibt die unmittelbare Aussage schlicht wieder und bewahrt den Singular »Feind«.
- source_word: מִשֹּׂנְאַי
  choice: vor denen, die mich hassten
  rationale: Das substantivierte Partizip im Plural bezeichnet die Hassenden; die Relativsatzform klingt im modernen Deutsch natürlich und hält den Wechsel vom Singular zum Plural fest.
- source_word: כִּי אָמְצוּ מִמֶּנִּי
  choice: denn sie waren mir zu mächtig
  rationale: Die Wendung beschreibt die Überlegenheit der Gegner gegenüber dem Sprecher. »Mir zu mächtig« drückt den Vergleich und seine existenzielle Bedrohung idiomatisch aus.
theological_decisions: []
