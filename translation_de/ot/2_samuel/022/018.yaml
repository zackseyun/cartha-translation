  register: Dignisches, gut verständliches Standarddeutsch. Die Parallelität der beiden Rettungsangaben sowie der Wechsel vom einzelnen starken Feind zu mehreren Hassenden bleiben erhalten; keine Fußnote ist erforderlich.
