translation:
  language: de
  text: Gott ist meine starke Zuflucht, und er macht meinen Weg[a] vollkommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Konsonantentext lautet: „und er macht seinen Weg vollkommen“. Die Parallele in Psalm 18,33 stützt die Lesung „meinen Weg“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵל
  choice: Gott
  rationale: Der bestimmte Artikel gehört hier zur Gottesbezeichnung. Im natürlichen Deutschen genügt „Gott“; „der Gott“ wäre ohne ergänzende Bestimmung ungewöhnlich.
- source_word: מָעוּזִּי חָיִל
  choice: meine starke Zuflucht
  rationale: מָעוֹז bezeichnet einen schützenden Ort oder eine Quelle der Sicherheit und Stärke; חָיִל hebt hier die Kraft hervor. „Starke Zuflucht“ bewahrt beide Bedeutungsanteile, ohne das Bild unnötig auf eine militärische Festung festzulegen.
- source_word: וַיַּתֵּר
  choice: er macht
  rationale: Die seltene Verbform ist in diesem Zusammenhang schwierig. Zusammen mit dem prädikativen תָּמִים bezeichnet sie, dass Gott den Weg in einen unversehrten beziehungsweise untadeligen Zustand bringt. „Er macht“ gibt die Konstruktion knapp und ohne zusätzliche Deutung wieder.
- source_word: תָּמִים
  choice: untadelig
  rationale: Das Wort bezeichnet Ganzheit, Unversehrtheit oder Lauterkeit. „Untadelig“ bewahrt den ethischen Klang, ohne die neuzeitliche Vorstellung absoluter Fehlerlosigkeit nahezulegen, die „vollkommen“ hervorrufen könnte.
- source_word: דרכו
  choice: meinen Weg
  rationale: Die überlieferte Konsonantenform lässt sich als „seinen Weg“ lesen; die Parallele in Psalm 18,33 stützt jedoch „meinen Weg“. Diese Lesart ergibt im Zusammenhang den Sinn, dass Gott den Weg des Sprechers untadelig macht; die andere Möglichkeit wird in der Fußnote erhalten.
theological_decisions:
- issue: Pronominale Lesart des letzten Wortes
  choice: Gott macht den Weg des Sprechers untadelig.
  alternative: Gott macht seinen eigenen Weg untadelig.
  rationale: Die Konsonantenform im Samueltext kann „seinen Weg“ bedeuten, während die poetische Parallele in Psalm 18,33 „meinen Weg“ stützt. Der Haupttext folgt der kontextuell und paralleltextlich gut begründeten ersten Person, ohne die echte textliche Mehrdeutigkeit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Starke Zuflucht“ ist allgemein verständlich und bewahrt Schutz- und Kraftaspekt; „untadelig“ erhält die Aussage über Integrität, ohne sie mit absoluter Sündlosigkeit gleichzusetzen.
