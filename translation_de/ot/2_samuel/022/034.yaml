base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/034.yaml
  text: He makes my feet like the feet of deer[b][a], and sets me secure on my heights.
translation:
  language: de
  text: Er macht seine Füße wie die von Hirschkühen gleich[a] und lässt mich auf meinen Höhen stehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Konsonantenlesung lautet „seine Füße“; die Lesung (Qere) und die Parallele in Psalm 18,34 haben „meine Füße“.
    reason: textual_alternative
  - marker: b
    text: 'Oder: „stellt mich auf meine Höhen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: macht … gleich
  rationale: Das Piel-Partizip bezeichnet hier ein Gleichmachen beziehungsweise Ähnlichmachen. Die deutsche Wendung bewahrt den kausativen Sinn und passt natürlich zum Vergleich.
- source_word: רגלי/ו
  choice: seine Füße
  rationale: 'Die vorgelegte WLC-Lesart enthält das Suffix der 3. Person Singular: „seine Füße“. Obwohl der unmittelbare Zusammenhang und die Parallele in Psalm 18,34 „meine Füße“ nahelegen, wird die schwierige Lesart des angegebenen Ausgangstextes im Haupttext nicht stillschweigend geändert.'
- source_word: כָּאַיָּלוֹת
  choice: denen der Hirschkühe
  rationale: Das feminine Pluralwort bezeichnet weibliche Hirsche. „Hirschkühe“ ist im heutigen Deutsch genauer und verständlicher als das altertümliche „Hindinnen“; „denen“ ergänzt idiomatisch die gemeinten Füße.
- source_word: בָּמוֹתַי
  choice: auf meinen Höhen
  rationale: בָּמוֹת bezeichnet hier poetisch erhöhte Orte. „Höhen“ wahrt Bild und Possessivform, ohne den kultischen Fachausdruck „Höhenheiligtümer“ nahezulegen.
- source_word: יַעֲמִדֵנִי
  choice: lässt mich … stehen
  rationale: Der Hifil von עמד bedeutet „zum Stehen bringen, hinstellen“. Die Wiedergabe hält sich näher an den ausdrücklich bezeichneten Vorgang als eine interpretierende Ergänzung wie „sicher hinstellen“.
theological_decisions: []
translation_notes:
  register: Poetisch und würdevoll, dabei in modernem Standarddeutsch. Die auffällige Verschiebung von „seine Füße“ zu „mich/meinen“ bleibt als Schwierigkeit des vorgelegten hebräischen Textes sichtbar; die kontextuell naheliegende Lesart wird in der Fußnote genannt.
