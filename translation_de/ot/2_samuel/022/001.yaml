source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר דָּוִד֙ לַֽ/יהוָ֔ה אֶת דִּבְרֵ֖י הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/יוֹם֩ הִצִּ֨יל יְהוָ֥ה אֹת֛/וֹ מִ/כַּ֥ף כָּל אֹיְבָ֖י/ו וּ/מִ/כַּ֥ף שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/001.yaml
  text: And David spoke to Yahweh the words of this song on the day when Yahweh delivered him from the hand of all his enemies and from the hand of Saul[a].
translation:
  language: de
  text: David sprach zu Jahwe die Worte dieses Liedes an dem Tag, als Jahwe ihn aus der Hand all seiner Feinde und aus der Hand Sauls befreite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Verb דבר bedeutet gewöhnlich „sprechen“ oder „sagen“. „Sprach“ bewahrt die auffällige Formulierung, dass David die Worte eines Liedes sprach, statt sie zu „sang“ zu glätten.
- source_word: לַיהוָה / יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, um den im Hebräischen ausdrücklich stehenden Eigennamen zu bewahren.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: die Worte dieses Liedes
  rationale: Die Wiedergabe erhält sowohl דִּבְרֵי („Worte“) als auch הַשִּׁירָה („Lied“) und folgt der ausdrücklichen Formulierung des Hebräischen.
- source_word: בְּיוֹם
  choice: an dem Tag, als
  rationale: Die Wendung bezeichnet den Anlass des Liedes. „An dem Tag, als“ ist im Deutschen natürlich und erhält die zeitliche Form des Ausgangstextes.
- source_word: הִצִּיל
  choice: befreit hatte
  rationale: Das Hifil von נצל bezeichnet hier die Rettung aus feindlicher Gewalt. Das Plusquamperfekt verdeutlicht im deutschen Satz, dass die Befreiung dem Sprechen des Liedes vorausging.
- source_word: מִכַּף
  choice: aus der Hand
  rationale: Die wörtliche Metapher „aus der Hand“ bezeichnet den Macht- oder Gewaltbereich eines Feindes und ist auch im Deutschen verständlich.
- source_word: כָּל אֹיְבָיו
  choice: all seiner Feinde
  rationale: Dies gibt die umfassende Aussage des hebräischen Ausdrucks knapp und natürlich wieder.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Gebräuchliche deutsche Form des Personennamens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ erhält den Eigennamen, während „der HERR“ der traditionellen ehrfürchtigen Ersatzlesung folgen würde.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ungewöhnliche Wendung „sprach … die Worte dieses Liedes“ wird bewusst beibehalten; eine Fußnote ist nicht nötig, da der vollständige hebräische Ausdruck bereits im Haupttext sichtbar ist.
