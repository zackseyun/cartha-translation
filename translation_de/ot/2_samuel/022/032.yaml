  text: כִּ֥י מִי אֵ֖ל מִ/בַּלְעֲדֵ֣י יְהוָ֑ה וּ/מִ֥י צ֖וּר מִֽ/בַּלְעֲדֵ֥י אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/032.yaml
  text: For who is God besides Yahweh? And who is a rock besides our God?[a]
translation:
  language: de
  text: Denn wer ist Gott außer Jahwe? Und wer ist ein Fels außer unserem Gott?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und wer ist Fels außer unserem Gott?« Das hebräische Wort für »Fels« ist ein häufiges Bild und kann bisweilen beinahe wie eine Bezeichnung für Gott gebraucht werden.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Lobpreis ein und bewahrt den Zusammenhang natürlich.
- source_word: מִי
  choice: wer
  rationale: Gibt das Interrogativpronomen in den rhetorischen Fragen direkt wieder.
- source_word: אֵל
  choice: Gott
  rationale: Bezeichnet in diesem monotheistischen Zusammenhang den wahren Gott; die übliche deutsche Wiedergabe ist „Gott“.
- source_word: מִבַּלְעֲדֵי
  choice: außer
  rationale: 'Drückt den ausschließenden Sinn knapp und idiomatisch aus: Es gibt keinen Gott neben beziehungsweise unabhängig von Jahwe.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Form.
- source_word: וּמִי
  choice: Und wer
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch den poetischen Parallelismus.
- source_word: צוּר
  choice: ein Fels
  rationale: Erhält das konkrete hebräische Bild für Beständigkeit, Schutz und Stärke. Der unbestimmte Artikel entspricht der prädikativen Verwendung im deutschen Satz.
- source_word: אֱלֹהֵינוּ
  choice: unserem Gott
  rationale: Gibt das Substantiv mit dem Suffix der ersten Person Plural und nach „außer“ im Dativ idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: צוּר als gewöhnliches Bild oder nahezu titelartige Bezeichnung
  choice: ein Fels
  alternative: Fels
  rationale: Die Formulierung „ein Fels“ wahrt im Deutschen die prädikative Metapher. Da das Hebräische auch nahezu titelartig verstanden werden kann, wird die artikellose Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden knappen rhetorischen Fragen und ihr poetischer Parallelismus bleiben erhalten; das vertraute Felsbild wird nicht erklärend aufgelöst.
