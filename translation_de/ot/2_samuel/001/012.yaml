source:
  edition: WLC
  text: וַֽ/יִּסְפְּדוּ֙ וַ/יִּבְכּ֔וּ וַ/יָּצֻ֖מוּ עַד הָ/עָ֑רֶב עַל שָׁא֞וּל וְ/עַל יְהוֹנָתָ֣ן בְּנ֗/וֹ וְ/עַל עַ֤ם יְהוָה֙ וְ/עַל בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֥י נָפְל֖וּ בֶּ/חָֽרֶב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/012.yaml
  text: They mourned[a], wept, and fasted until evening for Saul, for Jonathan his son, for the people of Yahweh, and for the house of Israel[b], because they had fallen by the sword.
translation:
  language: de
  text: Sie hielten Totenklage, weinten und fasteten bis zum Abend um Saul, um seinen Sohn Jonatan, um das Volk Jahwes und um das Haus Israel, weil sie durch das Schwert gefallen waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְפְּדוּ
  choice: sie hielten Totenklage
  rationale: ספד bezeichnet die förmliche Klage um Verstorbene. „Totenklage halten“ gibt diesen spezifischen Sinn wieder und bleibt zugleich klar vom folgenden „weinen“ unterschieden.
- source_word: וַיִּבְכּוּ
  choice: weinten
  rationale: בכה bedeutet hier unmittelbar „weinen“ und bezeichnet den Ausdruck ihrer Trauer.
- source_word: וַיָּצֻמוּ
  choice: fasteten
  rationale: צום ist das übliche Verb für den bewussten Verzicht auf Nahrung, hier als Ausdruck der Trauer.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Die Wendung nennt den Endpunkt des Trauerns und Fastens; „bis zum Abend“ ist im Deutschen natürlich und genau.
- source_word: עַל
  choice: um
  rationale: Das wiederholte עַל führt diejenigen ein, denen die Trauer gilt. Im Deutschen ist „um jemanden trauern“ beziehungsweise in dieser Reihung „um“ idiomatisch.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: seinen Sohn Jonatan
  rationale: Das Suffix bezieht sich auf Saul. Die deutsche Wortfolge identifiziert Jonatan eindeutig als Sauls Sohn, ohne den Sinn zu erweitern.
- source_word: עַם יְהוָה
  choice: das Volk Jahwes
  rationale: Die Konstruktion bezeichnet das zu Jahwe gehörende Volk. Die Wiedergabe bewahrt sowohl den kollektiven als auch den bundesbezogenen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen יהוה. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: „Haus Israel“ bewahrt die traditionelle korporative Bezeichnung des hebräischen Ausdrucks und vermeidet eine unnötige Verengung auf einen bloßen Haushalt.
- source_word: כִּי
  choice: weil
  rationale: כִּי nennt hier den Grund für Totenklage, Weinen und Fasten; „weil“ stellt diesen Zusammenhang im modernen Deutschen deutlich her.
- source_word: נָפְלוּ
  choice: gefallen waren
  rationale: נפל ist im Zusammenhang des Krieges eine übliche Bezeichnung für den Tod. Das Plusquamperfekt macht deutlich, dass der Tod der Trauer vorausging.
- source_word: בֶּחָרֶב
  choice: durch das Schwert
  rationale: Die Formulierung erhält das konkrete Bild des hebräischen Textes und bezeichnet gewaltsamen Tod durch Waffengewalt, ohne zu „im Kampf“ zu verallgemeinern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den Tetragrammaton als Gottes Eigennamen verwendet, bewahrt „Jahwe“ den personalen Namen; „der HERR“ wäre die traditionelle Ersetzung durch einen Titel.
- issue: Verhältnis von „Volk Jahwes“ und „Haus Israel“
  choice: beide koordinierten Bezeichnungen beibehalten
  alternative: zu einer einzigen Bezeichnung zusammenziehen
  rationale: Der hebräische Text nennt beide Ausdrücke jeweils mit וְעַל. Auch wenn sie sich inhaltlich überschneiden können, soll diese Spannung nicht durch eine Zusammenfassung beseitigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Totenklage halten“ wahrt den feierlichen Trauerkontext und unterscheidet ספד von בכה; die wiederholte Präposition wird zur natürlichen deutschen Reihung mit „um“ erhalten.
