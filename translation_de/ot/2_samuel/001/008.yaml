base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/008.yaml
  text: He said to me[a], ‘Who are you?’ And I said to him, ‘I am an Amalekite.’
translation:
  language: de
  text: 'Er sagte zu mir: »Wer bist du?« Ich sagte zu ihm[a]: »Ich bin ein Amalekiter.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: »Und er sagte zu ihm.« Aus dem Zusammenhang ergibt sich jedoch der Sinn: »Ich sagte zu ihm«, denn der Mann berichtet seine eigene Antwort an Saul.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Er sagte zu mir
  rationale: Das Verb mit waw-consecutiv führt die Erzählung fort; לִי bezeichnet den Angeredeten als den berichtenden Mann. Im Deutschen kann das einleitende »und« für einen natürlichen Erzählfluss entfallen.
- source_word: מִי אָתָּה
  choice: Wer bist du?
  rationale: Die hebräische Nominalfrage wird im Deutschen idiomatisch mit der Kopula wiedergegeben.
- source_word: ויאמר אֵלָיו
  choice: Ich antwortete ihm
  rationale: Der masoretische Konsonantentext hat formal »und er sagte zu ihm«. Der unmittelbare Gesprächszusammenhang verlangt jedoch die Antwort des erzählenden Amalekiters an Saul; »antwortete« macht die Funktion der Rede natürlich deutlich. Die formale Abweichung wird in der Fußnote offengelegt.
- source_word: עֲמָלֵקִי אָנֹכִי
  choice: Ich bin ein Amalekiter
  rationale: Das Gentiliz bezeichnet die Zugehörigkeit zum Volk der Amalekiter; die hebräische Nominalklausel wird im Deutschen mit »bin« ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und natürlich formuliert; die auffällige Personenform des masoretischen Textes bleibt durch die Fußnote transparent.
