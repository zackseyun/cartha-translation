  text: וָ/אֶעֱמֹ֤ד עָלָי/ו֙ וַ/אֲמֹ֣תְתֵ֔/הוּ כִּ֣י יָדַ֔עְתִּי כִּ֛י לֹ֥א יִֽחְיֶ֖ה אַחֲרֵ֣י נִפְל֑/וֹ וָ/אֶקַּ֞ח הַ/נֵּ֣זֶר אֲשֶׁ֣ר עַל רֹאשׁ֗/וֹ וְ/אֶצְעָדָה֙ אֲשֶׁ֣ר עַל זְרֹע֔/וֹ וָ/אֲבִיאֵ֥/ם אֶל אֲדֹנִ֖/י הֵֽנָּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/010.yaml
  text: So I stood over him and put him to death[a], because I knew that he would not live after he had fallen. Then I took the crown that was on his head and the armlet that was on his arm[b], and I brought them here to my lord.
translation:
  language: de
  text: Da stand ich über ihm und tötete ihn[a], denn ich wusste, dass er nach seinem Fall nicht am Leben bleiben würde. Dann nahm ich die Krone von seinem Kopf und den Armreif von seinem Arm[b] und brachte beides hierher zu meinem Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: So berichtet es der Amalekiter David. Zum früheren Bericht über Sauls Tod siehe 1. Samuel 31,4–5.
    reason: cross_reference
  - marker: b
    text: 'Oder: »das Armband«. Das hebräische Wort bezeichnet ein Schmuckstück, das am Arm getragen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱמֹד עָלָיו
  choice: Da trat ich zu ihm, beugte mich über ihn
  rationale: Wörtlich etwa »da stellte ich mich über ihn«. Die Formulierung gibt in natürlichem Deutsch wieder, dass der Sprecher sich über den gefallenen Saul stellte beziehungsweise beugte, ohne das unidiomatische »stand auf ihm« nahezulegen.
- source_word: וַאֲמֹתְתֵהוּ
  choice: und tötete ihn
  rationale: Die Kausativform von מות besagt ausdrücklich, dass der Sprecher Sauls Tod herbeiführte. »Tötete ihn« ist klar, würdig und weniger amtssprachlich als »brachte ihn zu Tode«.
- source_word: כִּי יָדַעְתִּי כִּי לֹא יִחְיֶה
  choice: denn ich wusste, dass er … nicht am Leben bleiben würde
  rationale: Die beiden כִּי werden als begründendes »denn« und als Inhaltssatz mit »dass« wiedergegeben. »Nicht am Leben bleiben würde« bewahrt die Aussage, ohne sie zu »konnte nicht überleben« zu verstärken.
- source_word: אַחֲרֵי נִפְלוֹ
  choice: nach seinem Sturz
  rationale: Die Infinitivkonstruktion bezeichnet zeitlich das Geschehen nach Sauls Fall. »Sturz« lässt offen, ob vor allem sein Niederfallen oder seine tödliche Verwundung gemeint ist.
- source_word: הַנֵּזֶר
  choice: die Krone
  rationale: נֵזֶר bezeichnet hier den königlichen Kopfschmuck. »Krone« ist im modernen Deutsch verständlicher als »Diadem«.
- source_word: וְאֶצְעָדָה
  choice: den Armreif
  rationale: Das Schmuckstück wird ausdrücklich am Arm getragen. »Armreif« ist daher genauer als das meist auf das Handgelenk bezogene »Armband«.
- source_word: זְרֹעוֹ
  choice: seinem Arm
  rationale: זְרוֹעַ bedeutet allgemein »Arm«; eine Einengung auf den Unterarm ist nicht erforderlich.
- source_word: וָאֲבִיאֵם
  choice: und brachte beides
  rationale: Das Wayyiqtol setzt die vergangene Erzählfolge innerhalb der direkten Rede fort. Da im Deutschen Krone und Armreif als zwei Gegenstände zusammengefasst werden, ist »beides« idiomatisch.
- source_word: אֶל אֲדֹנִי הֵנָּה
  choice: hierher zu meinem Herrn
  rationale: אֲדֹנִי ist hier die ehrerbietige Anrede für David, nicht ein Gottesname. הֵנָּה bezeichnet das gegenwärtige Hier des Sprechers; »hierher« verbindet Ziel und Bewegung natürlich.
theological_decisions:
- issue: Erzählbehauptung über Sauls Tod
  choice: 'Die Aussage wird uneingeschränkt als Bericht des Amalekiters übersetzt: Er behauptet, Saul getötet zu haben.'
  alternative: Die Aussage im Blick auf 1. Samuel 31 als Prahlerei oder Lüge abzuschwächen beziehungsweise harmonisierend umzuformulieren.
  rationale: Der Vers gibt direkte Rede wieder. Die Spannung zum Bericht in 1. Samuel 31 gehört zur Erzählung und darf nicht durch die Übersetzung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die höfische Anrede »mein Herr« bleibt erhalten. Die Satzfolge folgt eng dem Hebräischen, während unnatürliche Wörtlichkeit vermieden wird.
