base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/011.yaml
  text: Then David took hold of his clothes and tore them[a], and so did all the men who were with him.
translation:
  language: de
  text: Da fasste David seine Kleider und zerriss sie[a]; ebenso taten es alle Männer, die bei ihm waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sein Gewand“; das folgende hebräische Verb hat jedoch ein pluralisches Objektssuffix („zerriss sie“).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזֵק
  choice: fasste
  rationale: Das Verb bezeichnet hier das Ergreifen des eigenen Gewandes vor dem Zerreißen. „Fasste“ gibt die körperliche Handlung knapp und natürlich wieder.
- source_word: בִּבְגָדוֹ
  choice: sein Gewand
  rationale: Das Hebräische steht im Singular und bezeichnet Davids Kleidungsstück. „Gewand“ bewahrt diese Form und passt zum würdevollen biblischen Erzählstil.
- source_word: וַיִּקְרָעֵם
  choice: zerriss es
  rationale: Der masoretische Text hat zwar formal ein pluralisches Suffix („sie“), während das Bezugswort „Gewand“ singularisch ist. Im Deutschen wird der inhaltliche Bezug natürlich mit „es“ wiedergegeben; die textliche Unstimmigkeit wird in einer Fußnote kenntlich gemacht.
- source_word: וְגַם
  choice: ebenso taten es
  rationale: Die additive Verbindung überträgt die zuvor geschilderte Handlung auf Davids Begleiter. „Ebenso taten es“ gibt die Ellipse im Deutschen klar und flüssig wieder.
- source_word: כָּל הָאֲנָשִׁים
  choice: alle Männer
  rationale: Das Substantiv bezeichnet hier ausdrücklich Männer und wird daher geschlechtsgenau wiedergegeben.
- source_word: אֲשֶׁר אִתּוֹ
  choice: die bei ihm waren
  rationale: Die Relativkonstruktion wird unmittelbar und idiomatisch ins Deutsche übertragen.
theological_decisions: []
