  source_fidelity: Der Haupttext gibt den exklamativ-klagenden Charakter von אֵיךְ angemessen mit „Wie“ wieder. „sind ... gefallen“ entspricht נָפְלוּ gut. „Helden“ ist für גִּבֹּרִים im poetischen Kontext möglich und wahrt die Bedeutung als kampfstarke Männer/Krieger. „die Waffen des Krieges ... verloren gegangen“ gibt וַיֹּאבְדוּ כְּלֵי מִלְחָמָה im Wesentlichen treffend wieder und lässt die konkrete wie die im Kontext mögliche bildliche Lesart offen.
