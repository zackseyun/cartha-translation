  terminology: „Helden“ und „Waffen des Krieges“ sind im gegebenen poetischen Register tragfähig. Die Fußnote zu „Kriegsgerät“ beziehungsweise „Rüstung“ erklärt die weitere Bedeutung von כְּלֵי מִלְחָמָה zutreffend. Die zweite Fußnote kennzeichnet die metaphorische Deutung ausdrücklich als Möglichkeit und schreibt sie dem Text nicht zwingend vor.
