  text: אֵ֚יךְ נָפְל֣וּ גִבּוֹרִ֔ים וַ/יֹּאבְד֖וּ כְּלֵ֥י מִלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/027.yaml
  text: How the mighty have fallen[b][a], and the weapons of war have perished!
translation:
  language: de
  text: Wie sind die Helden gefallen, und die Waffen des Krieges[a] verloren gegangen![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Kriegsgerät“ oder „die Rüstung“. Der hebräische Ausdruck kann militärische Ausrüstung allgemein bezeichnen, nicht nur Angriffswaffen.'
    reason: lexical_alternative
  - marker: b
    text: Die „Waffen des Krieges“ können bildlich Saul und Jonatan selbst als Israels kriegerische Stärke bezeichnen; die Wendung kann jedoch auch wörtlich verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie
  rationale: Leitet hier keine Frage, sondern einen klagenden Ausruf ein und bewahrt den wiederkehrenden poetischen Refrain.
- source_word: נָפְלוּ
  choice: sind ... gefallen
  rationale: Gibt das vollendete Geschehen mit fortwirkendem Ergebnis in natürlichem Deutsch wieder.
- source_word: גִבּוֹרִים
  choice: die Helden
  rationale: Bezeichnet in diesem Klagelied mächtige Männer beziehungsweise Krieger; „Helden“ ist knapp, würdevoll und lässt die poetische Weite bestehen.
- source_word: וַיֹּאבְדוּ
  choice: verloren gegangen
  rationale: אבד kann „zugrunde gehen“, „verloren gehen“ oder „vernichtet werden“ bedeuten. Die Wahl lässt sowohl eine buchstäbliche als auch eine bildliche Deutung zu.
- source_word: כְּלֵי מִלְחָמָה
  choice: die Waffen des Krieges
  rationale: Die Wendung bezeichnet wörtlich Gegenstände beziehungsweise Gerät des Krieges. Diese Wiedergabe ist poetisch, verständlich und kann hier sowohl konkret als auch metaphorisch gelesen werden.
theological_decisions:
- issue: Mögliche metaphorische Bezeichnung Sauls und Jonatans als Israels kriegerische Stärke
  choice: Die Metapher wird im Haupttext nicht ausdrücklich aufgelöst.
  alternative: Die Wendung ausschließlich auf buchstäblich verlorene oder vernichtete Kriegsausrüstung beziehen.
  rationale: Der hebräische Wortlaut erlaubt im Zusammenhang des Klagelieds sowohl die sachliche als auch die auf Saul und Jonatan bezogene bildliche Lesart.
translation_notes:
  register: Poetischer, würdevoller Klage-Ton in modernem Standarddeutsch. Die Wiederholung „Wie sind die Helden gefallen“ bleibt als Refrain erkennbar; die Mehrdeutigkeit der Schlusszeile wird nicht vereindeutigt.
