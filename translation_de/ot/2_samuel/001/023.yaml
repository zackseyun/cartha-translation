source:
  edition: WLC
  text: שָׁא֣וּל וִ/יהוֹנָתָ֗ן הַ/נֶּאֱהָבִ֤ים וְ/הַ/נְּעִימִם֙ בְּ/חַיֵּי/הֶ֔ם וּ/בְ/מוֹתָ֖/ם לֹ֣א נִפְרָ֑דוּ מִ/נְּשָׁרִ֣ים קַ֔לּוּ מֵ/אֲרָי֖וֹת גָּבֵֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
translation:
  language: de
  text: Saul und Jonatan waren in ihrem Leben geliebt und liebenswert und selbst im Tod nicht getrennt. Schneller als Adler[a] waren sie, stärker als Löwen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geier“. Das hebräische Wort kann einen Adler oder allgemeiner einen großen Greif- beziehungsweise Aasvogel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: Saul und Jonatan
  rationale: Die Personennamen folgen den im modernen deutschen Bibelgebrauch üblichen Formen.
- source_word: הַנֶּאֱהָבִים
  choice: geliebt
  rationale: Die passive beziehungsweise adjektivische Form von אהב bezeichnet Saul und Jonatan als Menschen, die geliebt wurden; „geliebt“ gibt dies klar und ohne zusätzliche Deutung wieder.
- source_word: וְהַנְּעִימִם
  choice: liebenswert
  rationale: נעים bezeichnet hier eine angenehme, erfreuliche oder liebenswerte Eigenschaft. „Liebenswert“ klingt im Deutschen natürlich und bewahrt den poetischen Lobton, ohne körperliche Schönheit oder moralische Vollkommenheit zu behaupten.
- source_word: בְּחַיֵּיהֶם
  choice: in ihrem Leben
  rationale: Die Präpositionalfügung bezeichnet den zeitlichen Bereich ihres Lebens und hält die poetische Gegenüberstellung zu „im Tod“ fest.
- source_word: וּבְמוֹתָם לֹא נִפְרָדוּ
  choice: selbst im Tod nicht getrennt
  rationale: „Nicht getrennt“ wahrt die passive beziehungsweise reflexive Nuance des Nifal von פרד. „Selbst“ macht den im hebräischen Parallelismus liegenden Kontrast im natürlichen Deutschen hörbar, ohne eine neue Aussage einzuführen.
- source_word: מִנְּשָׁרִים קַלּוּ
  choice: Schneller als Adler waren sie
  rationale: קלל bezeichnet im Vergleich die Schnelligkeit oder Leichtigkeit. נשר wird traditionell und in diesem poetischen Bild plausibel mit „Adler“ wiedergegeben, kann jedoch allgemeiner einen großen Greif- oder Aasvogel bezeichnen; diese Unsicherheit wird in einer Fußnote bewahrt.
- source_word: מֵאֲרָיוֹת גָּבֵרוּ
  choice: stärker als Löwen
  rationale: גבר drückt hier Kraft beziehungsweise Überlegenheit aus. „Stärker als Löwen“ ist idiomatisch, verständlich und erhält den parallelen Komparativ.
theological_decisions:
- issue: Der ehrende Ton von Davids Totenklage über Saul und Jonatan
  choice: Der Vers wird als uneingeschränkt ehrende poetische Würdigung wiedergegeben.
  alternative: Das Lob wegen Sauls früheren Versagens abschwächen oder es zu einer Aussage über moralische Vollkommenheit steigern.
  rationale: Der hebräische Text lobt Saul und Jonatan im Rahmen einer Totenklage gemeinsam. Die Übersetzung bewahrt diese positive Gedenkrede und zugleich die Spannung zur übrigen Saul-Erzählung, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Moderne, würdevolle und gut verständliche Sprache mit poetischer Satzstellung in der zweiten Vershälfte. Die Wiederholung von „waren sie“ wird vermieden, der Parallelismus von Adlern und Löwen bleibt jedoch klar erhalten. „Liebenswert“ ist natürlicher als das im heutigen Deutsch leicht missverständliche „angenehm“.
