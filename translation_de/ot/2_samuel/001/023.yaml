  terminology: Die Namen „Saul“ und „Jonatan“ entsprechen dem gängigen deutschen Bibelgebrauch. „Adler“ ist als traditionelle und im Kontext plausible Wiedergabe von נשר vertretbar; die Fußnote bewahrt die lexikalische Bandbreite sachgerecht. „Löwen“ und „stärker“ treffen den Vergleich mit אריות und גבר präzise.
