  source_fidelity: 'Der Entwurf gibt die hebräische Struktur und Aussage zuverlässig wieder: Saul und Jonatan werden als „geliebt“ und „liebenswert“ charakterisiert; die Gegenüberstellung von Leben und Tod sowie das Nichtgetrenntsein bleiben erhalten. Die Vergleiche ihrer Schnelligkeit mit Adlern und ihrer Stärke mit Löwen entsprechen dem Text. Das ergänzende „selbst“ macht den Kontrast idiomatisch hörbar, ohne den Sinn wesentlich festzulegen oder zu verändern.'
