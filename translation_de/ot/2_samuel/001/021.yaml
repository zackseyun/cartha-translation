base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/021.yaml
  text: Mountains of Gilboa[a], let there be no dew or rain upon you, nor fields of offerings; for there the shield of the mighty was defiled, the shield of Saul[b], not anointed with oil.
translation:
  language: de
  text: 'Ihr Berge von Gilboa: Weder Tau noch Regen komme über euch, auch keine Felder der Opfergaben[a]! Denn dort wurde der Schild der Helden befleckt, der Schild Sauls, nicht mit Öl gesalbt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwierig. Möglich sind auch: „keine ertragreichen Felder“, „keine Felder der Erstlingsgaben“ oder „keine Felder der Hebopfer“. Das Wort תְּרוּמוֹת bezeichnet häufig Gaben, die für Gott ausgesondert werden.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sein kann, dass Sauls Schild nun nicht mehr mit Öl eingerieben wurde, wie es zur Pflege und Vorbereitung eines Schildes üblich war; die Wendung muss sich nicht auf Saul als den „Gesalbten“ beziehen.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי בַגִּלְבֹּעַ
  choice: Ihr Berge von Gilboa
  rationale: Die direkte Anrede des Berglands wird im Deutschen durch „ihr“ deutlich und ohne das altertümliche „o“ natürlich wiedergegeben.
- source_word: אַל טַל וְאַל מָטָר עֲלֵיכֶם
  choice: Weder Tau noch Regen komme über euch
  rationale: Der deutsche Optativ mit „komme“ bewahrt den Charakter eines fluchartigen Wunsches und die direkte Anrede.
- source_word: וּשְׂדֵי תְרוּמֹת
  choice: und keine Felder für Opfergaben
  rationale: Die schwierige Wendung wird bewusst nicht zu „fruchtbare Felder“ geglättet. „Opfergaben“ erhält den häufigen kultischen Sinn von תְּרוּמוֹת; die syntaktische Ergänzung bleibt im Deutschen knapp.
- source_word: כִּי שָׁם
  choice: Denn dort
  rationale: Leitet natürlich den Grund für den vorausgehenden Fluchwunsch ein.
- source_word: נִגְעַל
  choice: wurde … befleckt
  rationale: „Befleckt“ gibt die Vorstellung von Verunreinigung und Schändung im Zusammenhang mit dem gefallenen Schild anschaulich wieder, ohne die mögliche Bildsprache unnötig auszubauen.
- source_word: מָגֵן גִּבּוֹרִים
  choice: der Schild der Helden
  rationale: „Helden“ entspricht dem gehobenen Ton des Klagelieds und kann hier kampferprobte Männer beziehungsweise Krieger bezeichnen.
- source_word: מָגֵן שָׁאוּל
  choice: der Schild Sauls
  rationale: 'Die appositionelle Wiederholung des hebräischen Verses bleibt erhalten: vom Schild der Helden wird auf Sauls Schild zugespitzt.'
- source_word: בְּלִי מָשִׁיחַ בַּשָּׁמֶן
  choice: nicht mit Öl gesalbt
  rationale: Die knappe Formulierung folgt dem Hebräischen und bezieht sich im unmittelbaren Satzbau auf den Schild. Sie vermeidet den nicht ausdrücklich vorhandenen Vergleich „als wäre er nicht gesalbt“.
theological_decisions:
- issue: Mögliche Deutung von מָשִׁיחַ als Titel „Gesalbter“
  choice: 'Als verbale Aussage über den Schild wiedergegeben: „nicht mit Öl gesalbt“'
  alternative: Auf Saul als den mit Öl gesalbten König beziehen
  rationale: Die Verbindung mit „mit Öl“ und der unmittelbare Bezug auf den Schild sprechen für das Einölen beziehungsweise Salben des Schildes. So wird weder ein messianischer Titel noch eine zusätzliche königstheologische Aussage in den Vers eingetragen.
translation_notes:
  register: Moderne, würdige Sprache mit dem gehobenen Ton eines Klagelieds. Der Optativ „komme“ und die Wiederholung von „Schild“ bewahren die poetische Form; schwer verständliche oder mehrdeutige Wendungen werden nicht stillschweigend geglättet.
