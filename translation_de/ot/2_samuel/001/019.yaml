base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/019.yaml
  text: Your glory[a], O Israel[b], lies slain on your heights! How the mighty have fallen!
translation:
  language: de
  text: Deine Zierde[a], Israel, liegt erschlagen auf deinen Höhen[b]! Wie sind die Helden gefallen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort צְבִי kann auch »Schönheit« oder »Pracht« bedeuten; manche verstehen es konkreter als »Gazelle«.
    reason: lexical_alternative
  - marker: b
    text: Oder »auf deinen Höhenheiligtümern«. Das hebräische Wort kann sowohl Anhöhen als auch kultische Höhenstätten bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּבִי
  choice: Deine Zierde
  rationale: צְבִי kann »Zierde«, »Schönheit« oder »Pracht« bezeichnen, konkret auch eine Gazelle. Im Klagekontext über Saul und Jonatan passt die bildliche Bedeutung als Israels Zierde am besten; das Possessivpronomen nimmt die direkte Anrede Israels auf.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bleibt unverändert und wird durch die Satzstellung als direkte Anrede kenntlich gemacht; ein altertümliches »o Israel« ist im modernen Deutschen nicht nötig.
- source_word: עַל בָּמוֹתֶיךָ
  choice: auf deinen Höhen
  rationale: Die Wendung bezeichnet hier topografisch Israels Anhöhen. »Höhen« bewahrt die poetische Weite, ohne unnötig kultische Höhenheiligtümer anzudeuten.
- source_word: חָלָל
  choice: liegt erschlagen
  rationale: חָלָל bezeichnet einen Erschlagenen. Die prädikative Wiedergabe ist idiomatisch und bringt den Zustand des Getötetseins deutlich zum Ausdruck.
- source_word: אֵיךְ נָפְלוּ גִבּוֹרִים
  choice: Wie sind die Helden gefallen!
  rationale: Die Formulierung wahrt den ausrufenden Klagecharakter und den wiederkehrenden Refrain. גִבּוֹרִים kann Mächtige, Krieger oder Helden meinen; »Helden« ist im deutschen Klagelied natürlich und bewahrt die poetische Breite.
theological_decisions: []
translation_notes:
