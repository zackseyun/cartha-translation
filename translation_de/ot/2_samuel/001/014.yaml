base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/014.yaml
  text: Then David said to him[b][a], “How were you not afraid to put out your hand to destroy Yahweh’s anointed?”
translation:
  language: de
  text: 'Da sagte David zu ihm: „Wie[a] konntest du keine Furcht davor haben, deine Hand gegen Jahwes Gesalbten[b] zu erheben und ihn zu töten?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum hattest du keine Furcht davor …?“ Das hebräische Wort bedeutet wörtlich „Wie?“ und drückt hier einen empörten Vorwurf aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Saul, der von Jahwe zum König gesalbt worden war.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das waw consecutivum führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge natürlich und knapp wieder.
- source_word: אֵיךְ
  choice: Wie
  rationale: „Wie“ bewahrt die hebräische Form der erstaunten, vorwurfsvollen Frage. Das ergänzte „konntest du“ macht diesen Vorwurf im heutigen Deutsch idiomatisch verständlich, ohne ihn zu einer bloßen Frage nach dem Grund umzudeuten.
- source_word: יָרֵאתָ
  choice: konntest du dich nicht fürchten
  rationale: Das Verb bezeichnet Furcht beziehungsweise ehrfürchtige Scheu. Die Formulierung erhält dieses Bedeutungsfeld und bringt zugleich den schockierten Vorwurf natürlich zum Ausdruck.
- source_word: לִשְׁלֹחַ יָדְךָ
  choice: deine Hand auszustrecken
  rationale: Die hebräische Wendung bezeichnet ein tätliches Vorgehen gegen jemanden. Die bildhafte Redeweise bleibt im Deutschen verständlich und wird deshalb beibehalten.
- source_word: לְשַׁחֵת
  choice: zu vernichten
  rationale: שׁחת hat ein breiteres Bedeutungsspektrum als „töten“ und bezeichnet hier ein zerstörerisches Handeln mit tödlichem Ausgang. „Vernichten“ wahrt diese Stärke und Breite.
- source_word: מְשִׁיחַ
  choice: Gesalbten
  rationale: Gemeint ist Saul als der zum König Gesalbte, nicht unmittelbar der spätere messianische Titel. „Gesalbter“ bewahrt den konkreten historischen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche Form der wissenschaftlichen Umschrift.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Seine Wiedergabe als „Jahwe“ bewahrt den Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מְשִׁיחַ in Bezug auf Saul
  choice: Jahwes Gesalbter
  alternative: Jahwes Messias
  rationale: Im erzählerischen Zusammenhang bezeichnet das Wort den von Jahwe zum König gesalbten Saul. „Messias“ könnte hier unbeabsichtigt spätere christologische Vorstellungen in den Text eintragen.
- issue: Vorwurfscharakter von אֵיךְ לֹא יָרֵאתָ
  choice: Wie konntest du dich nicht fürchten …?
  alternative: Warum hast du dich nicht gefürchtet …?
  rationale: Die gewählte Fassung wahrt das wörtliche Fragewort „Wie“ und lässt zugleich den erschrockenen Vorwurf erkennen, ohne ihn als nüchterne Ursachenfrage aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte hebräische Wendung „die Hand ausstrecken“ und die vorwurfsvolle Frageform bleiben erhalten; erläuterungsbedürftige Aspekte werden knapp in Fußnoten erklärt.
