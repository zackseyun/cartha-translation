  yaml_path: translation/ot/2_samuel/001/015.yaml
  text: Then David called one of the young men and said[a], “Come near; strike him down.” So he struck him, and he died.
translation:
  language: de
  text: 'Da rief David einen von den jungen Männern und sagte: »Tritt zu ihm und schlag ihn nieder!« Da schlug er ihn, und er starb.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief
  rationale: קרא bezeichnet hier das Herbeirufen oder Ansprechen; »rief« gibt die schlichte Erzählhandlung natürlich wieder.
- source_word: לְאַחַד מֵהַנְּעָרִים
  choice: einen von den jungen Männern
  rationale: נְעָרִים kann junge Männer, Diener oder Begleiter bezeichnen. Die direkte Wiedergabe bewahrt die Alters- bzw. Statusbezeichnung, ohne eine amtliche Funktion einzutragen.
- source_word: גַּשׁ
  choice: Komm her
  rationale: Der Imperativ von נגשׁ fordert zum Herantreten auf. »Komm her« ist in dieser unmittelbaren Befehlssituation natürliches modernes Deutsch.
- source_word: פְּגַע בּוֹ
  choice: erschlag ihn
  rationale: פגע mit ב kann gewaltsames Anfallen oder Zuschlagen bezeichnen. Im Hinrichtungskontext ist die Tötungsabsicht eindeutig; »erschlag ihn« wahrt zugleich den gewaltsamen Vollzug.
- source_word: וַיַּכֵּהוּ
  choice: Da schlug er ihn
  rationale: נכה bedeutet gewöhnlich »schlagen«. Die eigenständige Folgeaussage »und er starb« bleibt erhalten, statt Handlung und Ergebnis zusammenzuziehen.
- source_word: וַיָּמֹת
  choice: und er starb
  rationale: מות ist das gewöhnliche Verb für »sterben«; die Form führt die Erzählfolge fort.
