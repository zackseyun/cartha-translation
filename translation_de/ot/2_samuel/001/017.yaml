  text: וַ/יְקֹנֵ֣ן דָּוִ֔ד אֶת הַ/קִּינָ֖ה הַ/זֹּ֑את עַל שָׁא֖וּל וְ/עַל יְהוֹנָתָ֥ן בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/017.yaml
  text: Then David sang this lament over Saul and over Jonathan his son,[a]
translation:
  language: de
  text: Dann stimmte David dieses Klagelied über Saul und dessen Sohn Jonatan an:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „David erhob diese Klage“; Verb und verwandtes Substantiv bilden im Hebräischen eine feste Wendung für das Anstimmen einer Totenklage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: Dann stimmte … an
  rationale: Das Verb קונן bezeichnet das Anstimmen oder Vortragen einer Totenklage. Zusammen mit dem direkten Objekt הַקִּינָה gibt „stimmte … dieses Klagelied an“ die formelhafte Wendung natürlich wieder, ohne ausdrücklich Gesang zu behaupten.
- source_word: הַקִּינָה הַזֹּאת
  choice: dieses Klagelied
  rationale: קִינָה ist eine förmliche Klage, häufig um Verstorbene. „Klagelied“ ist im Deutschen klar, würdig und im gegebenen Zusammenhang natürlicher als die bloße „Klage“.
- source_word: עַל
  choice: über
  rationale: עַל kennzeichnet hier die Personen, denen die Totenklage gilt. „Über“ bewahrt diese Beziehung knapp und idiomatisch.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Im Deutschen übliche Namensform.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Im modernen deutschen Bibelgebrauch übliche Namensform.
- source_word: בְּנוֹ
  choice: dessen Sohn
  rationale: Das Suffix bezieht sich auf Saul. „Dessen“ macht diesen Bezug im Deutschen eindeutig, ohne eine im Hebräischen nicht vorhandene Betonung hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wendung „ein Klagelied anstimmen“ wahrt den performativen Charakter der hebräischen Konstruktion, vermeidet aber die zusätzliche Festlegung, David habe es gesungen.
