source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֥י/ו דָּוִ֛ד מֶה הָיָ֥ה הַ/דָּבָ֖ר הַגֶּד נָ֣א לִ֑/י וַ֠/יֹּאמֶר אֲשֶׁר נָ֨ס הָ/עָ֜ם מִן הַ/מִּלְחָמָ֗ה וְ/גַם הַרְבֵּ֞ה נָפַ֤ל מִן הָ/עָם֙ וַ/יָּמֻ֔תוּ וְ/גַ֗ם שָׁא֛וּל וִ/יהוֹנָתָ֥ן בְּנ֖/וֹ מֵֽתוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/004.yaml
  text: David said to him[a], “What happened? Please tell me.” He said, “The people fled from the battle, and many of the people also fell and died[c][b]; and Saul and Jonathan his son are also dead.”
translation:
  language: de
  text: 'David fragte ihn: »Was ist geschehen?[a] Bitte berichte mir!« Er antwortete: »Das Volk ist aus der Schlacht geflohen. Viele aus dem Volk sind gefallen und gestorben.[b] Auch Saul und sein Sohn Jonatan sind tot.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Was war die Sache?«'
    reason: lexical_alternative
  - marker: b
    text: »Fallen« ist im Hebräischen eine geläufige Wendung für das Niedergestrecktwerden im Kampf; das folgende »und gestorben« nennt das Ergebnis ausdrücklich.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Auch Saul und sein Sohn Jonatan sind gestorben.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה הָיָה הַדָּבָר
  choice: Was ist geschehen?
  rationale: Die Wendung lautet wörtlich etwa »Was war die Sache?«, fragt hier aber idiomatisch nach dem Verlauf beziehungsweise Ausgang der Ereignisse. »Was ist geschehen?« ist natürliches heutiges Deutsch und bewahrt die offene Frage.
- source_word: הַגֶּד נָא לִי
  choice: Bitte berichte mir!
  rationale: הַגֶּד ist der Imperativ »berichte/teile mit«, während נָא die Aufforderung höflich oder eindringlich abmildert. »Bitte berichte mir!« passt zu Davids Bitte um einen Lagebericht.
- source_word: אֲשֶׁר נָס הָעָם מִן הַמִּלְחָמָה
  choice: Das Volk ist aus der Schlacht geflohen
  rationale: נָס bedeutet »fliehen«. הָעָם bezeichnet hier kollektiv die am Kampf beteiligten Leute; »das Volk« hält sich eng an den Ausgangstext, ohne ausdrücklich »Truppen« einzutragen.
- source_word: וְגַם הַרְבֵּה נָפַל מִן הָעָם וַיָּמֻתוּ
  choice: Viele aus dem Volk sind gefallen und gestorben
  rationale: נפל ist im Zusammenhang einer Schlacht eine übliche Bezeichnung dafür, dass Menschen niedergestreckt werden. »Gefallen« bewahrt dieses Bild; »und gestorben« gibt zusätzlich das ausdrücklich folgende וַיָּמֻתוּ wieder, statt beide Verben zusammenzuziehen.
- source_word: וְגַם שָׁאוּל וִיהוֹנָתָן בְּנוֹ מֵתוּ
  choice: Auch Saul und sein Sohn Jonatan sind tot
  rationale: Die Formulierung gibt die abschließende Nachricht im Deutschen natürlich als gegenwärtigen Zustand wieder. »Sein Sohn« bleibt erhalten, weil es im Hebräischen ausdrücklich steht.
theological_decisions: []
