  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und berichtsartig. »Volk« wahrt die hebräische Ausdrucksweise, während Perfektformen einen natürlichen mündlichen Lagebericht ergeben.
