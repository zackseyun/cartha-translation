  text: וַ/יֹּ֣אמֶר דָּוִ֔ד אֶל הַ/נַּ֖עַר הַ/מַּגִּ֣יד ל֑/וֹ אֵ֣יךְ יָדַ֔עְתָּ כִּי מֵ֥ת שָׁא֖וּל וִ/יהֽוֹנָתָ֥ן בְּנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/005.yaml
  text: Then David said to the young man who told him, “How do you know that Saul and Jonathan his son are dead?”
translation:
  language: de
  text: 'Da sagte David zu dem jungen Mann, der ihm berichtete: „Woher weißt du, dass Saul und sein Sohn Jonatan tot sind?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte“ gibt die zeitliche Folge in natürlichem modernem Deutsch wieder.
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: נַעַר bezeichnet häufig einen Jugendlichen oder jungen Mann. Der Zusammenhang zeigt einen hinreichend erwachsenen Boten, weshalb „junger Mann“ hier angemessen ist.
- source_word: הַמַּגִּיד לוֹ
  choice: der ihm die Nachricht überbracht hatte
  rationale: Das attributive Partizip bezeichnet den jungen Mann als denjenigen, der David Bericht erstattete. Das Plusquamperfekt macht auf Deutsch natürlich deutlich, dass dieser Bericht der Frage vorausging.
- source_word: אֵיךְ
  choice: Woher
  rationale: Gefragt wird im Zusammenhang nicht nach der Methode des Wissens, sondern nach dessen Grundlage oder Quelle. „Woher weißt du“ ist dafür die idiomatische deutsche Wendung.
- source_word: יָדַעְתָּ
  choice: weißt du
  rationale: Obwohl im Hebräischen eine Perfektform steht, fragt David nach dem gegenwärtigen Wissensstand des Boten. Das deutsche Präsens ist hier natürlich und sachgerecht.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was der junge Mann weiß.
- source_word: מֵת
  choice: tot sind
  rationale: Die hebräische Singularform steht bei dem zusammengesetzten Subjekt Saul und Jonatan. Im Deutschen ist der Plural erforderlich; „tot sind“ gibt den resultierenden Zustand klar wieder.
- source_word: בְּנוֹ
  choice: sein Sohn
  rationale: Das Suffix bezieht sich auf Saul und bezeichnet Jonatan als dessen Sohn.
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: Saul und Jonatan
  rationale: Die Personennamen werden nach etablierten deutschen Bibelkonventionen wiedergegeben.
