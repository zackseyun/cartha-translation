  language: en
  yaml_path: translation/ot/2_samuel/001/018.yaml
  text: 'and said that the sons of Judah should be taught “The Bow.” Behold, it is written in the Book of Jashar:'
translation:
  language: de
  text: 'und sagte, man solle die Söhne Judas »Den Bogen«[a] lehren. Siehe, es steht im Buch Jaschar[b] geschrieben:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Umgang mit dem Bogen lehren. »Der Bogen« kann auch der Titel des folgenden Klagelieds sein.'
    reason: קָשֶׁת kann sowohl »Bogen« als Gegenstand des Unterrichts als auch eine Überschrift beziehungsweise einen Liedtitel bezeichnen.
  - marker: b
    text: 'Hebräisch: Buch des Jaschar; der Name kann »der Rechtschaffene« bedeuten.'
    reason: Der überlieferte Buchtitel ist nicht sicher erklärbar; die Fußnote bietet die mögliche Bedeutung, ohne den Titel im Text darauf festzulegen.
lexical_decisions:
- source_word: לְלַמֵּד
  choice: zu lehren
  rationale: Der Infinitiv bezeichnet den Auftrag, etwas zu lehren; im Deutschen wird der durch וַיֹּאמֶר eingeleitete Befehl natürlich mit »befahl« wiedergegeben.
- source_word: בְּנֵי יְהוּדָה
  choice: die Söhne Judas
  rationale: Bewahrt die formale Kollektivbezeichnung des Hebräischen; gemeint sind die Angehörigen Judas.
- source_word: קָשֶׁת
  choice: den »Bogen«
  rationale: Wörtlich »Bogen«; im Kontext wahrscheinlich der Titel des folgenden Klagelieds. Anführungszeichen machen diese Funktion sichtbar, ohne die lexikalische Bedeutung aufzugeben.
- source_word: סֵפֶר הַיָּשָׁר
  choice: Buch des Rechtschaffenen
  rationale: Übersetzt den hebräischen Titel semantisch, statt ihn als den wenig verständlichen Eigennamen »Jaschar« zu transliterieren.
theological_decisions:
- issue: Funktion von קָשֶׁת
  choice: als Titel »Bogen«
  alternative: als Hinweis auf das Erlernen des Bogenschießens
  rationale: Die unmittelbare Einführung des schriftlich überlieferten Klagelieds spricht für eine Titelangabe; die knappe hebräische Form bleibt jedoch grundsätzlich mehrdeutig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Siehe« bewahrt den markierenden Charakter von הִנֵּה. Der Doppelpunkt leitet das anschließende Lied ein.
