base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/003.yaml
  text: David said to him[a], “Where have you come from?” He said to him, “I have escaped from the camp of Israel.”
translation:
  language: de
  text: 'David sagte zu ihm: „Woher kommst du?“ Er antwortete ihm: „Ich bin aus dem Lager Israels entkommen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵי מִזֶּה
  choice: Woher
  rationale: Die Verbindung fragt idiomatisch nach dem Ausgangsort oder der Herkunft. „Woher“ gibt dies im modernen Deutschen knapp und natürlich wieder.
- source_word: תָּבוֹא
  choice: kommst du
  rationale: Das formale Imperfekt steht hier in einer direkten Frage nach dem Ort, von dem der Mann gerade gekommen ist. Das deutsche Präsens ist dafür idiomatisch und bewahrt die unmittelbare Wirkung der Rede.
- source_word: מִמַּחֲנֵה יִשְׂרָאֵל
  choice: aus dem Lager Israels
  rationale: מַחֲנֶה bezeichnet hier das militärische Lager. Der Genitiv „Israels“ erhält die hebräische Zuordnung und klingt im Deutschen natürlich.
- source_word: נִמְלָטְתִּי
  choice: Ich bin ... entkommen
  rationale: Der Nifal von מלט bezeichnet das erfolgreiche Entkommen aus einer Gefahr. Das deutsche Perfekt passt zur mündlichen Antwort und fügt keine näheren Umstände hinzu.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: sagte ... antwortete
  rationale: Das erste וַיֹּאמֶר wird mit „sagte“ wiedergegeben. Beim zweiten macht „antwortete“ die Gesprächsfolge im Deutschen natürlich deutlich, ohne den Inhalt zu verändern.
- source_word: דָּוִד
  choice: David
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibel- und Namenstradition wiedergegeben.
theological_decisions: []
