source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ דָּוִ֔ד דמי/ך עַל רֹאשֶׁ֑/ךָ כִּ֣י פִ֗י/ךָ עָנָ֤ה בְ/ךָ֙ לֵ/אמֹ֔ר אָנֹכִ֥י מֹתַ֖תִּי אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/016.yaml
  text: Then David said to him[a], “Your blood is on your own head, for your own mouth has testified against you, saying[b], ‘I myself killed Yahweh’s anointed.’”
translation:
  language: de
  text: 'Da sagte David zu ihm: „Dein Blut ist auf deinem eigenen Haupt[a]; denn dein eigener Mund hat gegen dich ausgesagt[b]: ‚Ich selbst habe den Gesalbten Jahwes getötet.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im urteilenden Sinn: „Dein Blut komme über dein eigenes Haupt.“ Die hebräische Wendung weist ihm selbst die Verantwortung für seinen Tod zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hat gegen dich Zeugnis abgelegt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: Da sagte David zu ihm
  rationale: Das Narrativ-Waw führt die Handlung fort; „Da“ gibt die zeitliche Folge in natürlichem modernem Deutsch wieder. אֵלָיו wird ausdrücklich mit „zu ihm“ übersetzt.
- source_word: דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: Dein Blut komme über dein eigenes Haupt
  rationale: Die hebräische Gerichtsformel weist dem Mann selbst die Verantwortung für seinen Tod zu. Der deutsche Ausdruck bewahrt sowohl das Bild als auch den urteilenden beziehungsweise jussivischen Ton.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für Davids Urteil ein.
- source_word: פִּיךָ
  choice: dein eigener Mund
  rationale: Die Metonymie des Körperteils bleibt erhalten und betont, dass der Mann sich durch seine eigene Aussage belastet hat.
- source_word: עָנָה בְךָ
  choice: hat gegen dich ausgesagt
  rationale: ענה mit ב hat hier einen forensischen Sinn. „Gegen dich ausgesagt“ ist klar, natürlich und erhält den rechtlichen Charakter.
- source_word: לֵאמֹר
  choice: '[Doppelpunkt vor dem Zitat]'
  rationale: Die hebräische Zitateinleitung wird im Deutschen idiomatisch durch einen Doppelpunkt wiedergegeben.
- source_word: אָנֹכִי
  choice: Ich selbst
  rationale: Das selbstständige Personalpronomen ist emphatisch; „selbst“ erhält die Betonung der selbstbelastenden Behauptung.
- source_word: מֹתַתִּי
  choice: habe … getötet
  rationale: Die Form bezeichnet das Verursachen des Todes. „Getötet“ ist direkt und entspricht dem behaupteten Tatbestand.
- source_word: מְשִׁיחַ יְהוָה
  choice: den Gesalbten Jahwes
  rationale: מְשִׁיחַ bezeichnet hier Saul als den zum König Gesalbten. Die Übersetzung bewahrt den Titel, ohne spätere christologische Bedeutungen in die Erzählung einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in der etablierten Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext gebraucht den Eigennamen. „Jahwe“ bewahrt ihn als Namen; „der HERR“ wäre eine traditionelle Ersetzung durch einen Titel.
- issue: Wiedergabe von מְשִׁיחַ im königlichen Zusammenhang
  choice: Gesalbter
  alternative: Messias
  rationale: Gemeint ist Saul in seiner Stellung als gesalbter König. „Gesalbter“ gibt die Funktion im unmittelbaren Kontext wieder und vermeidet eine unangezeigte spätere Bedeutungsverengung.
- issue: Modalität der Blutformel
  choice: Dein Blut komme über dein eigenes Haupt
  alternative: Dein Blut ist auf deinem eigenen Haupt
  rationale: Der nominale hebräische Satz lässt im Urteilskontext eine feststellende oder jussivisch-urteilende Nuance zu. Der Haupttext gibt den Urteilsspruch idiomatisch wieder; die Fußnote nennt die formal feststellende Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem forensischem Ton. „Haupt“ wurde in der festen Blutformel beibehalten, obwohl „Kopf“ im Alltagsdeutsch üblicher ist; so bleibt das hebräische Bild in einer für einen Urteilsspruch angemessenen Sprache erkennbar.
