  variant: modern standard German
source:
  edition: WLC
  text: מִ/דַּ֣ם חֲלָלִ֗ים מֵ/חֵ֨לֶב֙ גִּבּוֹרִ֔ים קֶ֚שֶׁת יְה֣וֹנָתָ֔ן לֹ֥א נָשׂ֖וֹג אָח֑וֹר וְ/חֶ֣רֶב שָׁא֔וּל לֹ֥א תָשׁ֖וּב רֵיקָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/022.yaml
  text: From the blood of the slain[a], from the fat of the mighty, Jonathan’s bow did not turn back[b], and Saul’s sword did not return empty.
translation:
  language: de
  text: Vom Blut der Erschlagenen, vom Fett[a] der Helden wich Jonatans Bogen nicht zurück[b], und Sauls Schwert kehrte nicht leer zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Fett“ kann hier auch das Beste oder den erlesensten Teil bezeichnen und verstärkt so das Bild des Erfolgs im Kampf.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zog sich nicht zurück“. Das hebräische Verb kann ein Zurückweichen oder Sich-zurückziehen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם חֲלָלִים
  choice: vom Blut der Erschlagenen
  rationale: מִן bezeichnet hier am ehesten die Trennung beziehungsweise das Zurückweichen vor etwas; die knappe Formulierung bewahrt das martialische Bild. חֲלָלִים meint im Zusammenhang eines Kampfes gewöhnlich die Erschlagenen.
- source_word: מֵחֵלֶב גִּבּוֹרִים
  choice: vom Fett der Helden
  rationale: חֵלֶב bedeutet wörtlich „Fett“ und kann zugleich das Beste oder Reichste bezeichnen. Die wörtliche, eindringliche Bildsprache bleibt erhalten. גִּבּוֹרִים wird dem gehobenen Ton der Totenklage entsprechend mit „Helden“ wiedergegeben.
- source_word: קֶשֶׁת יְהוֹנָתָן
  choice: Jonatans Bogen
  rationale: Die hebräische Genitivverbindung wird im Deutschen natürlich und knapp durch den vorangestellten Besitzernamen wiedergegeben.
- source_word: לֹא נָשׂוֹג אָחוֹר
  choice: wich nicht zurück
  rationale: נסוג mit אָחוֹר bezeichnet das Zurückweichen oder Sich-zurückziehen. Beim personifizierten Bogen drückt „wich nicht zurück“ dessen unverminderte Wirksamkeit aus und erhält zugleich die mögliche räumliche Bedeutung.
- source_word: וְחֶרֶב שָׁאוּל
  choice: und Sauls Schwert
  rationale: Die Genitivverbindung wird parallel zu „Jonatans Bogen“ idiomatisch als Besitzkonstruktion wiedergegeben.
- source_word: לֹא תָשׁוּב רֵיקָם
  choice: kehrte nicht leer zurück
  rationale: Die Wendung besagt, dass das Schwert nicht wirkungslos zurückkehrte. Die wörtliche Form bewahrt die poetische Personifikation und ist im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Gehobene, aber allgemein verständliche Sprache für eine poetische Totenklage. Der Parallelismus zwischen Jonatans Bogen und Sauls Schwert sowie die anschauliche, harte Bildsprache des Hebräischen bleiben erhalten.
