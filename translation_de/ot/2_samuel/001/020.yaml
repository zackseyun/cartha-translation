  text: אַל תַּגִּ֣ידוּ בְ/גַ֔ת אַֽל תְּבַשְּׂר֖וּ בְּ/חוּצֹ֣ת אַשְׁקְל֑וֹן פֶּן תִּשְׂמַ֨חְנָה֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים פֶּֽן תַּעֲלֹ֖זְנָה בְּנ֥וֹת הָ/עֲרֵלִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/020.yaml
  text: Do not tell it in Gath[a]; do not proclaim the news in the streets of Ashkelon, lest the daughters of the Philistines rejoice[b], lest the daughters of the uncircumcised exult.
translation:
  language: de
  text: Erzählt es nicht in Gat, verkündet die Nachricht nicht auf den Straßen Aschkelons, damit sich die Töchter der Philister nicht freuen, damit die Töchter der Unbeschnittenen[a] nicht jubeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '»Die Töchter der Unbeschnittenen« ist die wörtliche Wiedergabe einer bundesbezogenen Schmähbezeichnung für die Philister; auch: »die Töchter der unbeschnittenen Männer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּגִּידוּ
  choice: Erzählt es
  rationale: Das Verb נגד bedeutet hier »erzählen, melden, kundtun«. Das im Hebräischen unausgesprochene Objekt wird im Deutschen durch »es« aufgenommen und verweist aus dem Zusammenhang auf die Nachricht von Sauls und Jonatans Tod.
- source_word: תְּבַשְּׂרוּ
  choice: verkündet die Nachricht
  rationale: בשר im Piel bezeichnet das Überbringen oder öffentliche Verkünden einer Nachricht. Die Wiedergabe wahrt den öffentlichen Charakter und die Parallele zum ersten Verbot.
- source_word: בְּחוּצֹת אַשְׁקְלוֹן
  choice: auf den Straßen Aschkelons
  rationale: חוּצוֹת kann Straßen oder öffentliche Plätze einer Stadt bezeichnen. »Auf den Straßen« ist natürliches modernes Deutsch und erhält die öffentliche Szenerie.
- source_word: פֶּן
  choice: damit … nicht
  rationale: פֶּן leitet einen befürchteten Zweck oder eine unerwünschte Folge ein. »Damit … nicht« gibt diese Funktion in gegenwärtigem Deutsch klar wieder und bewahrt die zweifache poetische Warnung.
- source_word: תִּשְׂמַחְנָה
  choice: sich freuen
  rationale: שמח bezeichnet Freude oder Frohsein. Die geläufige Wendung passt zum ersten Glied der Steigerung.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: die Töchter der Philister
  rationale: Die wörtliche Wiedergabe bewahrt das poetische Bild der Frauen in den philistäischen Städten als Feiernde.
- source_word: תַּעֲלֹזְנָה
  choice: jubeln
  rationale: עלז drückt ausgelassene, triumphierende Freude aus. »Jubeln« ist würdig und verständlich und erhält die Intensivierung gegenüber »sich freuen«.
- source_word: בְּנוֹת הָעֲרֵלִים
  choice: die Töchter der Unbeschnittenen
  rationale: עֲרֵלִים bedeutet wörtlich »Unbeschnittene« und fungiert hier als polemische ethnisch-religiöse Bezeichnung. Die wörtliche Übersetzung erhält den Bezug auf die Bundesidentität, ohne ihn zu verallgemeinern.
theological_decisions:
- issue: Wiedergabe der bundesbezogenen Schmähbezeichnung עֲרֵלִים
  choice: die Unbeschnittenen
  alternative: die Heiden / die Unreinen
  rationale: Der hebräische Ausdruck bezieht sich ausdrücklich auf die fehlende Beschneidung. Die wörtliche Wiedergabe wahrt seine theologische und rhetorische Spannung und ersetzt ihn nicht durch eine allgemeinere religiöse oder kultische Wertung.
translation_notes:
  register: Moderne, würdige Klagesprache mit klarer Parallelstruktur. »Damit … nicht« vermeidet das im heutigen Deutsch gehobene und weniger allgemein verständliche »dass nicht etwa«, während »verkündet« und »jubeln« den poetischen Ton erhalten. Der Fußnotenmarker steht nach der erklärungsbedürftigen Verswendung.
