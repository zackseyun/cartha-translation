source:
  edition: WLC
  text: אֵ֚יךְ נָפְל֣וּ גִבֹּרִ֔ים בְּ/ת֖וֹךְ הַ/מִּלְחָמָ֑ה יְה֣וֹנָתָ֔ן עַל בָּמוֹתֶ֖י/ךָ חָלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/025.yaml
  text: How the mighty have fallen in the midst of the battle! Jonathan lies slain on your heights[a].
translation:
  language: de
  text: Wie sind die Helden mitten im Kampf gefallen! Jonatan liegt erschlagen auf deinen Höhen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf deinen Anhöhen“. Das hebräische Wort kann erhöhtes Gelände, andernorts aber auch Kultstätten bezeichnen; hier sind wahrscheinlich die Höhen Israels gemeint, die im Klagelied poetisch angeredet werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie
  rationale: Leitet einen klagenden Ausruf ein, keine Informationsfrage. „Wie“ bewahrt die poetische Kraft und den wiederkehrenden Kehrvers des Klagelieds.
- source_word: נָפְלוּ
  choice: sind … gefallen
  rationale: Das hebräische Perfekt bezeichnet das vollendete Geschehen; das deutsche Perfekt klingt hier natürlich und eindringlich.
- source_word: גִבֹּרִים
  choice: die Helden
  rationale: Bezeichnet tapfere, kampferprobte Männer. „Helden“ ist im poetischen Klagelied würdig und weniger eng als „Krieger“.
- source_word: בְּתוֹךְ הַמִּלְחָמָה
  choice: mitten im Kampf
  rationale: Gibt sowohl die räumlich-situative Bedeutung von בְּתוֹךְ als auch den unmittelbaren Zusammenhang des Kampfgeschehens knapp und idiomatisch wieder.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: עַל
  choice: auf
  rationale: Natürliche deutsche Wiedergabe der lokalen Präposition.
- source_word: בָּמוֹתֶיךָ
  choice: deinen Höhen
  rationale: Bewahrt das Bild erhöhten Geländes sowie den maskulinen Singularsuffix. Es vermeidet die vorschnelle kultische Festlegung, die „Kulthöhen“ nahelegen würde.
- source_word: חָלָל
  choice: liegt erschlagen
  rationale: Das Wort bezeichnet hier einen Getöteten. „liegt erschlagen“ macht die im nominalen hebräischen Ausdruck vorausgesetzte Aussage im Deutschen natürlich deutlich.
theological_decisions:
- issue: Bezug des Suffixes in „deinen Höhen“
  choice: Der Bezug bleibt im Vers offen; im Kontext liegt eine poetische Anrede an Israel beziehungsweise sein Bergland nahe.
  alternative: Die Höhen werden unmittelbar Jonatan zugeordnet.
  rationale: Das maskuline Singularsuffix wird formal mit „deinen“ erhalten. Eine ausdrückliche Ergänzung wie „Israels Höhen“ würde die im Einzelvers vorhandene grammatische Offenheit stärker auflösen als der hebräische Text.
translation_notes:
  register: Poetisch, klagend und würdevoll; zugleich in modernem Standarddeutsch gut verständlich. Die erste Zeile wahrt den Ausrufcharakter und den Kehrvers, die zweite den knappen, bildhaften Parallelismus.
