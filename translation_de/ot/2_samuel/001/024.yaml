  text: בְּנוֹת֙ יִשְׂרָאֵ֔ל אֶל שָׁא֖וּל בְּכֶ֑ינָה הַ/מַּלְבִּֽשְׁ/כֶ֤ם שָׁנִי֙ עִם עֲדָנִ֔ים הַֽ/מַּעֲלֶה֙ עֲדִ֣י זָהָ֔ב עַ֖ל לְבוּשְׁ/כֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/024.yaml
  text: Daughters of Israel[a], weep over Saul, who clothed you in scarlet with luxuries[b], who put ornaments of gold on your clothing.
translation:
  language: de
  text: Ihr Töchter Israels, weint um Saul, der euch in Scharlach mit Kostbarkeiten[a] kleidete, der goldenen Schmuck[b] an euren Gewändern anbrachte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Luxus“, „mit Annehmlichkeiten“, „mit Pracht“ oder „mit feiner Ausstattung“. Das seltene hebräische Wort ist in diesem Zusammenhang nicht eindeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „goldene Zierden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: Ihr Töchter Israels
  rationale: Bewahrt die direkte Anrede und das poetische hebräische Bild; „Frauen Israels“ wäre glättender.
- source_word: אֶל שָׁאוּל בְּכֶינָה
  choice: weint um Saul
  rationale: אֶל bezeichnet beim Klagen den Gegenstand der Trauer; „um Saul weinen“ ist natürliches modernes Deutsch.
- source_word: הַמַּלְבִּשְׁכֶם שָׁנִי
  choice: der euch in Scharlach kleidete
  rationale: Das substantivierte Partizip wird als Relativsatz wiedergegeben; שָׁנִי bezeichnet scharlachroten Stoff beziehungsweise die Farbe Scharlach.
- source_word: עִם עֲדָנִים
  choice: mit kostbarem Schmuck
  rationale: עֲדָנִים ist hier selten und kann Luxus, Köstlichkeiten, feine Ausstattung oder Schmuck bezeichnen. Im Zusammenhang mit Kleidung passt „kostbarer Schmuck“, ohne die Unsicherheit zu verschweigen.
- source_word: הַמַּעֲלֶה עֲדִי זָהָב
  choice: der goldene Zierden … legte
  rationale: עלה hat hier den kausativen Sinn des Anbringens oder Auflegens; עֲדִי זָהָב bezeichnet goldenen Schmuck beziehungsweise goldene Zier.
- source_word: עַל לְבוּשְׁכֶן
  choice: auf eure Gewänder
  rationale: Gibt Präposition und Kleidungsbegriff direkt, poetisch und verständlich wieder.
