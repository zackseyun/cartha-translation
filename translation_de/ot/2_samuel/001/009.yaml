base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/009.yaml
  text: And he said to me[a], ‘Please stand over me and put me to death, for anguish has seized me[b], though my life is still in me.’
translation:
  language: de
  text: 'Und er sagte zu mir: »Stell dich bitte über mich und töte mich, denn Qual[a] hat mich gepackt, denn noch ist mein ganzes Leben in mir[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »denn Krämpfe oder Zuckungen haben mich gepackt«. Das mit »Qual« wiedergegebene hebräische Wort ist selten; seine genaue Bedeutung ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »denn all mein Leben / meine ganze Seele ist noch in mir«. Das hebräische כִּי kann im Zusammenhang auch konzessiv verstanden werden.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: עֲמָד נָא עָלַי
  choice: Stell dich bitte über mich
  rationale: עָמַד bezeichnet das Stehen, und עַל gibt hier die Stellung über dem verwundet am Boden Liegenden an. »Bitte« gibt die flehentliche Partikel נָא wieder.
- source_word: וּמֹתְתֵנִי
  choice: und töte mich
  rationale: Die Kausativform von מות bedeutet hier unmittelbar, den Tod herbeizuführen. »Töte mich« ist klar, natürlich und dem Schlachtfeldkontext angemessen.
- source_word: אֲחָזַנִי
  choice: hat mich gepackt
  rationale: אָחַז bedeutet »ergreifen, packen« und beschreibt die überwältigende Wirkung des Zustands.
- source_word: הַשָּׁבָץ
  choice: Qual
  rationale: Das seltene Wort ist in seiner genauen Bedeutung unsicher. »Qual« wahrt diese Unbestimmtheit; mögliche körperliche Bedeutungen werden in der Fußnote genannt.
- source_word: כִּי כָל עוֹד נַפְשִׁי בִּי
  choice: obwohl mein Leben noch ganz in mir ist
  rationale: נֶפֶשׁ bezeichnet hier das noch vorhandene Leben. »Noch ganz in mir« bewahrt כָל und עוֹד, während »obwohl« den im Zusammenhang naheliegenden konzessiven Sinn ausdrückt.
- source_word: וַיֹּאמֶר אֵלַי
  choice: Und er sagte zu mir
  rationale: Die schlichte Erzählfolge des hebräischen Wayyiqtol wird direkt und natürlich wiedergegeben.
theological_decisions:
- issue: Verknüpfung des letzten כִּי-Satzes
  choice: obwohl mein Leben noch ganz in mir ist
  alternative: denn mein ganzes Leben ist noch in mir
  rationale: 'כִּי ist formal mehrdeutig und kann kausal verstanden werden; im Zusammenhang liegt jedoch ein konzessiver Sinn nahe: Trotz seiner Qual ist Saul noch am Leben. Die formale Alternative bleibt in der Fußnote sichtbar.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Bitte »töte mich« vermeidet einen unnötigen Euphemismus; die Unsicherheit des seltenen Krankheitsbegriffs und die Mehrdeutigkeit der Satzverknüpfung werden nicht stillschweigend aufgelöst.
