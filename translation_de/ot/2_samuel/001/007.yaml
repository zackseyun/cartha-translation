  text: He turned around and saw me[a], and he called to me, and I said, “Here I am.”
translation:
  language: de
  text: 'Er wandte sich um, sah mich und rief mir zu. Ich sagte: »Hier bin ich.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  choice: Er wandte sich um
  rationale: Die Verbindung bezeichnet wörtlich ein Sich-nach-hinten-Wenden; »sich umwenden« gibt den räumlichen Sinn im Deutschen natürlich und genau wieder.
- source_word: וַיִּרְאֵנִי
  choice: und sah mich
  rationale: ראה mit dem Suffix der ersten Person Singular bedeutet unmittelbar »sah mich«.
- source_word: וַיִּקְרָא אֵלַי
  choice: Dann rief er mich
  rationale: קרא mit אֶל bezeichnet das Rufen zu einer Person. Im Deutschen ist »jemanden rufen« hier natürlicher als das räumlich missverständliche »zu jemandem rufen«; »dann« bildet die fortschreitende Erzählfolge ab.
- source_word: וָאֹמַר
  choice: und ich sagte
  rationale: אמר bedeutet gewöhnlich »sagen«; die formal nähere Wiedergabe bewahrt die schlichte Erzählweise.
- source_word: הִנֵּנִי
  choice: Hier bin ich!
  rationale: Die feste Antwortformel drückt gegenwärtige Verfügbarkeit und Aufmerksamkeit aus; »Hier bin ich!« bewahrt zugleich ihren vertrauten biblischen Klang.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit schlichter narrativer Syntax. Die im Hebräischen idiomatische Wendung »hinter sich wenden« wird ohne unnötige Fußnote natürlich als »sich umwenden« wiedergegeben.
