  source_fidelity: Die Wiedergabe von וַיִּפֶן אַחֲרָיו mit „Er wandte sich um“ trifft den idiomatischen räumlichen Sinn zuverlässig. „sah mich“ und „Hier bin ich“ entsprechen dem hebräischen Wortlaut und der Antwortformel gut. Bei וַיִּקְרָא אֵלַי sollte jedoch die Präposition אֶל („zu/an mich“) erkennbar bleiben; „er rief mich“ kann im Deutschen eher ein Herbeirufen bzw. Bestellen bezeichnen.
