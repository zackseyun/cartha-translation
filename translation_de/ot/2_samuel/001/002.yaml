  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י וְ/הִנֵּה֩ אִ֨ישׁ בָּ֤א מִן הַֽ/מַּחֲנֶה֙ מֵ/עִ֣ם שָׁא֔וּל וּ/בְגָדָ֣י/ו קְרֻעִ֔ים וַ/אֲדָמָ֖ה עַל רֹאשׁ֑/וֹ וַ/יְהִי֙ בְּ/בֹא֣/וֹ אֶל דָּוִ֔ד וַ/יִּפֹּ֥ל אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/002.yaml
  text: On the third day[a], behold, a man came from the camp, from Saul, with his clothes torn and dirt on his head. And when he came to David[c][b], he fell to the ground and bowed down.
translation:
  language: de
  text: Am dritten Tag kam da ein Mann aus dem Lager, von Sauls Seite her[a]. Seine Kleider waren zerrissen, und er hatte Erde auf dem Kopf[b]. Als er zu David kam, fiel er zu Boden und warf sich vor ihm nieder[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von Saul her« beziehungsweise »aus Sauls Umfeld«. Die hebräische Wendung bezeichnet eine Verbindung mit Saul, aber nicht notwendigerweise eine direkte Entsendung durch ihn.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Erde auf seinem Kopf« – ein übliches Zeichen von Trauer oder Klage.'
    reason: cultural_note
  - marker: c
    text: 'Oder: »verneigte sich tief«. Das Verb kann je nach Zusammenhang tiefe Ehrerbietung, Unterordnung oder Huldigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: Am dritten Tag
  rationale: Die hebräische Erzählungsform führt das nächste Geschehen ein; die Zeitangabe wird ohne ein im Ausgangstext nicht ausdrücklich vorhandenes »nun« natürlich wiedergegeben.
- source_word: וְהִנֵּה
  choice: da
  rationale: »Da« erhält die lebhafte, präsentierende Funktion von הִנֵּה in idiomatischem modernem Deutsch, ohne die nicht ausdrücklich bezeichnete Nuance von Plötzlichkeit hinzuzufügen.
- source_word: אִישׁ בָּא מִן־הַמַּחֲנֶה
  choice: kam … ein Mann aus dem Lager
  rationale: Die singularische männliche Personenbezeichnung und die Herkunft aus dem militärischen Lager werden direkt und verständlich wiedergegeben.
- source_word: מֵעִם שָׁאוּל
  choice: von Sauls Seite her
  rationale: Die Verbindung mit עִם bezeichnet hier Zugehörigkeit, Nähe oder Gemeinschaft mit Saul; die Formulierung vermeidet die unbelegte Aussage, Saul habe den Mann geschickt.
- source_word: וּבְגָדָיו קְרֻעִים
  choice: Seine Kleider waren zerrissen
  rationale: Die Zustandsbeschreibung wird formal nah und in gegenwärtigem Standarddeutsch wiedergegeben.
- source_word: וַאֲדָמָה עַל־רֹאשׁוֹ
  choice: er hatte Erde auf dem Kopf
  rationale: אֲדָמָה bedeutet wörtlich Erde beziehungsweise Erdboden. Die deutsche Formulierung bewahrt das konkrete Trauerzeichen, ohne es durch das nur sinngemäße »Staub« zu ersetzen.
- source_word: בְּבֹאוֹ אֶל־דָּוִד
  choice: Als er zu David kam
  rationale: Der Infinitiv mit בְּ bezeichnet den zeitlichen Umstand und wird idiomatisch als Temporalsatz wiedergegeben.
- source_word: וַיִּפֹּל אַרְצָה
  choice: fiel er zu Boden
  rationale: Die Richtungsform אַרְצָה bezeichnet die Bewegung zum Boden hin.
- source_word: וַיִּשְׁתָּחוּ
  choice: warf sich vor ihm nieder
  rationale: Das Verb bezeichnet ein tiefes Sich-Niederbeugen oder Sich-Niederwerfen. Die Formulierung gibt die körperliche Ehrbezeugung wieder, ohne sie vorschnell als Anbetung festzulegen.
theological_decisions:
- issue: Bedeutung des Niederwerfens vor David
  choice: warf sich vor ihm nieder
  alternative: betete ihn an / huldigte ihm
  rationale: Der Kontext spricht für Ehrerbietung oder Unterordnung gegenüber David. Das hebräische Verb allein legt hier weder religiöse Anbetung noch eine bestimmte politische Deutung zwingend fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. »Da« bewahrt die präsentierende Funktion von וְהִנֵּה ohne archaisches »siehe«. Die Wiederholung der Satzverknüpfung mit »und« wurde maßvoll geglättet, während Abfolge, Trauerzeichen und körperliche Ehrerbietung erhalten bleiben.
