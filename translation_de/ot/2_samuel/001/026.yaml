source:
  edition: WLC
  text: צַר לִ֣/י עָלֶ֗י/ךָ אָחִ/י֙ יְה֣וֹנָתָ֔ן נָעַ֥מְתָּ לִּ֖/י מְאֹ֑ד נִפְלְאַ֤תָה אַהֲבָֽתְ/ךָ֙ לִ֔/י מֵ/אַהֲבַ֖ת נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/026.yaml
  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
translation:
  language: de
  text: Um dich bin ich voller Schmerz, mein Bruder Jonatan! Du warst mir sehr lieb. Deine Liebe zu mir war wunderbar, größer als die Liebe der Frauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mehr als die Liebe zu Frauen“ beziehungsweise „größer als die Liebe, die Frauen schenken“. Der poetische hebräische Vergleich legt die genaue Art und Bezugsrichtung der Liebe nicht ausdrücklich fest.'
    reason: Bewahrt die grammatische und inhaltliche Mehrdeutigkeit von מֵאַהֲבַת נָשִׁים.
lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  choice: Um dich bin ich voller Schmerz
  rationale: צַר לִי bezeichnet persönliche Bedrängnis oder tiefen Schmerz; עָלֶיךָ richtet diesen Schmerz auf Jonatan. Die Formulierung klingt im deutschen Klagelied natürlich, ohne die Wendung lediglich als Trauerformel zu verengen.
- source_word: אָחִי
  choice: mein Bruder
  rationale: Die wörtliche Bezeichnung bleibt erhalten und kann im Kontext zugleich die enge, brüderliche Verbundenheit ausdrücken.
- source_word: יְהוֹנָתָן
  choice: Jonatan
  rationale: Verwendet die im modernen deutschen Bibelgebrauch übliche Namensform.
- source_word: נָעַמְתָּ לִּי מְאֹד
  choice: Du warst mir sehr lieb
  rationale: נעם bezeichnet, dass jemand angenehm, erfreulich oder liebenswert ist. „Sehr lieb“ ist im Deutschen natürlich und gibt מְאֹד direkt wieder, ohne eine bestimmte moderne Beziehungskategorie festzulegen.
- source_word: נִפְלְאָתָה אַהֲבָתְךָ לִי
  choice: Deine Liebe zu mir war wunderbar
  rationale: נפלא bezeichnet etwas Außergewöhnliches oder Wunderbares. „Liebe zu mir“ gibt die Ausrichtung durch לִי idiomatisch wieder.
- source_word: מֵאַהֲבַת נָשִׁים
  choice: größer als die Liebe der Frauen
  rationale: מִן markiert den poetischen Vergleich. „Die Liebe der Frauen“ bewahrt die knappe Genitivverbindung, ohne ausdrücklich festzulegen, ob es um Liebe von Frauen, zu Frauen oder allgemein um Frauenliebe geht.
theological_decisions:
- issue: Deutung des Vergleichs mit der „Liebe der Frauen“
  choice: Der Vergleich bleibt wörtlich und hinsichtlich der genauen Bezugsrichtung offen.
  alternative: Den Ausdruck ausdrücklich als Liebe von Frauen, Liebe zu Frauen, eheliche Liebe oder sexuelle beziehungsweise nichtsexuelle Liebe bestimmen.
  rationale: Der hebräische Text preist Jonatans Liebe in einem poetischen Vergleich, legt deren genaue moderne Beziehungskategorie oder die Richtung des Genitivs jedoch nicht eindeutig fest. Die Übersetzung soll diese Spannung nicht auflösen.
translation_notes:
  register: Moderne, würdevolle Sprache mit leicht poetischem Klang. Der Ausruf im ersten Satz entspricht dem Charakter des Klagelieds; konfessionelle oder sexualethische Festlegungen werden vermieden.
