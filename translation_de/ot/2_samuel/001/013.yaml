source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶל הַ/נַּ֨עַר֙ הַ/מַּגִּ֣יד ל֔/וֹ אֵ֥י מִ/זֶּ֖ה אָ֑תָּה וַ/יֹּ֕אמֶר בֶּן אִ֛ישׁ גֵּ֥ר עֲמָלֵקִ֖י אָנֹֽכִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/013.yaml
  text: David said to the young man who told him[a], “Where are you from?” And he said, “I am the son of an Amalekite sojourner.”
translation:
  language: de
  text: 'David sagte zu dem jungen Mann, der ihm die Nachricht gebracht hatte: „Woher kommst du?“ Er antwortete: „Ich bin der Sohn eines Amalekiters, der als Fremder ansässig ist.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich bin der Sohn eines ansässigen Amalekiters.“ Das hebräische גֵּר bezeichnet einen Nichtansässigen bzw. Zugezogenen, der in einem anderen Gemeinwesen lebt. Die knappe Wortfolge kann die ethnische Bezeichnung unmittelbar mit dem Vater verbinden; sie kann auch die amalekitische Herkunft des Sprechers hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: נַעַר bezeichnet hier einen jungen männlichen Erwachsenen; „junger Mann“ ist natürlich und unterstellt keinen ausdrücklich genannten Dienerstatus.
- source_word: הַמַּגִּיד לוֹ
  choice: der ihm die Nachricht gebracht hatte
  rationale: Das Partizip von נגד kennzeichnet ihn als Überbringer des zuvor erzählten Berichts; die vorzeitige Form entspricht dem Erzählzusammenhang.
- source_word: אֵי מִזֶּה
  choice: Woher kommst du?
  rationale: Die hebräische Wendung fragt idiomatisch nach der Herkunft.
- source_word: בֶּן אִישׁ
  choice: der Sohn eines
  rationale: Die Konstruktion bedeutet wörtlich „Sohn eines Mannes“; im Deutschen genügt die natürliche Abstammungsangabe.
- source_word: גֵּר
  choice: Fremdling
  rationale: גֵּר bezeichnet einen nicht einheimischen Menschen, der auf Dauer oder zeitweilig in einem fremden Gemeinwesen lebt. „Fremdling“ bewahrt die besondere soziale Kategorie besser als das heute enger konnotierte „Einwanderer“, bedarf aber einer Fußnotenerklärung.
- source_word: עֲמָלֵקִי
  choice: amalekitisch
  rationale: Das Ethnikon bezeichnet die Zugehörigkeit zu den Amalekitern; als attributives Adjektiv ergibt es eine natürliche deutsche Formulierung.
- source_word: אָנֹכִי
  choice: Ich bin
  rationale: Das selbstständige Pronomen betont die Selbstidentifikation; im Deutschen ist die Kopula erforderlich.
theological_decisions:
- issue: Zuordnung von עֲמָלֵקִי in בֶּן אִישׁ גֵּר עֲמָלֵקִי
  choice: '„Sohn eines amalekitischen Fremdlings“: Der Vater wird als amalekitischer Fremdling bezeichnet.'
  alternative: '„Sohn eines Fremdlings, ein Amalekiter“: Die ethnische Bezeichnung kann stärker auf den Sprecher bezogen werden.'
  rationale: Die nächstliegende syntaktische Verbindung ordnet „amalekitisch“ dem unmittelbar vorausgehenden „Fremdling“ zu; die knappe hebräische Nominalfolge lässt jedoch eine weiter gefasste Zuordnung zur Abstammung beziehungsweise zum Sprecher zu. Diese Mehrdeutigkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fremdling“ ist gegenüber „Einwanderer“ weniger gegenwartsbezogen und bildet den rechtlich-sozialen Status von גֵּר genauer ab; die Fußnote erläutert die Bedeutung und wahrt die syntaktische Mehrdeutigkeit.
