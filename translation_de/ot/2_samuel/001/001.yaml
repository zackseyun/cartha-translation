  text: וַ/יְהִ֗י אַֽחֲרֵי֙ מ֣וֹת שָׁא֔וּל וְ/דָוִ֣ד שָׁ֔ב מֵ/הַכּ֖וֹת אֶת הָ/עֲמָלֵ֑ק וַ/יֵּ֧שֶׁב דָּוִ֛ד בְּ/צִקְלָ֖ג יָמִ֥ים שְׁנָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/001.yaml
  text: After the death of Saul[a], when David had returned from striking down the Amalekites, David stayed in Ziklag two days.
translation:
  language: de
  text: Nach Sauls Tod, als David zurückgekehrt war, nachdem er die Amalekiter geschlagen hatte, blieb David zwei Tage in Ziklag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: nicht eigens wiedergegeben
  rationale: Die Erzählformel führt die folgende Szene fort. Im modernen Deutschen wird ihre Funktion durch den einleitenden Zeitsatz natürlich ausgedrückt; ein zusätzliches „Und es geschah“ wäre unnötig schwerfällig.
- source_word: אַחֲרֵי מוֹת שָׁאוּל
  choice: Nach Sauls Tod
  rationale: Gibt die zeitliche Konstruktion knapp und idiomatisch wieder und bewahrt die nominale Formulierung des Hebräischen.
- source_word: וְדָוִד שָׁב
  choice: als David … zurückgekehrt war
  rationale: Das Plusquamperfekt kennzeichnet Davids Rückkehr als bereits abgeschlossen gegenüber seinem anschließenden Aufenthalt in Ziklag.
- source_word: מֵהַכּוֹת אֶת הָעֲמָלֵק
  choice: vom Kampf gegen die Amalekiter
  rationale: נכה bezeichnet hier gewaltsames Schlagen im militärischen Zusammenhang. „Kampf“ ist im Deutschen natürlich und vermeidet die unbelegte Aussage, das ganze Volk sei vollständig vernichtet worden; der singuläre Volksname „Amalek“ wird kollektiv als „die Amalekiter“ wiedergegeben.
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: Wegen der ausdrücklich auf zwei Tage begrenzten Dauer ist „blieb“ treffender als „wohnte“ oder das altertümliche „verweilte“.
- source_word: בְּצִקְלָג
  choice: in Ziklag
  rationale: Übliche deutsche Wiedergabe des Ortsnamens mit lokaler Präposition.
- source_word: יָמִים שְׁנָיִם
  choice: zwei Tage
  rationale: Die hebräische Zeitdauer wird im Deutschen ohne zusätzliche Präposition idiomatisch an „blieb“ angeschlossen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bewahrt die zeitliche Staffelung des Hebräischen, ohne die hebräische Erzählformel hölzern nachzuahmen. Die Wiederholung des Namens David entspricht der Hervorhebung im Ausgangstext.
