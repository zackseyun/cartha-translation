base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/006.yaml
  text: And the young man who told him said[a], “I happened to be on Mount Gilboa, and behold, Saul was leaning on his spear, and behold[c][b], the chariots and the horsemen were closing in on him.”
translation:
  language: de
  text: 'Da sagte der junge Mann, der ihm Bericht erstattete: »Ich war ganz zufällig im Gebirge Gilboa[a]. Da sah ich Saul, wie er sich auf seinen Speer stützte. Und da waren die Streitwagen und die Reiter dicht hinter ihm[b][c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf dem Berg Gilboa«. Das Hebräische kann hier den einzelnen Berg oder das Bergland bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Streitwagentruppe und die berittenen Kämpfer« beziehungsweise »die Streitwagen und die Kavallerie«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »hatten ihn eingeholt« beziehungsweise »setzten ihm hart nach«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: נַעַר bezeichnet hier am natürlichsten einen jungen Mann; »Junge« wäre möglicherweise zu jung verstanden, »Diener« würde einen sozialen Status eintragen.
- source_word: הַמַּגִּיד לוֹ
  choice: der ihm Bericht erstattete
  rationale: Das attributive Partizip von נגד kennzeichnet ihn als denjenigen, der David den Bericht überbrachte.
- source_word: נִקְרֹא נִקְרֵיתִי
  choice: Ich war ganz zufällig
  rationale: Infinitivus absolutus und finite Verbform verstärken den Gedanken eines zufälligen Zusammentreffens; »ganz zufällig« bildet die Intensivierung idiomatisch ab.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: auf dem Gebirge Gilboa
  rationale: הַר kann Berg oder Bergland bezeichnen. Beim Gilboa ist im Deutschen »Gebirge Gilboa« geografisch und sprachlich gut verständlich; die Alternative wird in der Fußnote genannt.
- source_word: וְהִנֵּה
  choice: Da sah ich / Und da waren
  rationale: הִנֵּה lenkt die Aufmerksamkeit lebhaft auf das Gesehene. Die kontextuell wechselnde Wiedergabe bewahrt diese Funktion in natürlichem modernem Deutsch.
- source_word: נִשְׁעָן עַל חֲנִיתוֹ
  choice: wie er sich auf seinen Speer stützte
  rationale: Das Nifal-Partizip von שׁען bezeichnet körperliches Abstützen; die reflexive deutsche Formulierung ist präzise und natürlich.
- source_word: הָרֶכֶב
  choice: die Streitwagen
  rationale: רֶכֶב kann kollektiv die Streitwagen beziehungsweise die Streitwagentruppe bezeichnen. Der Plural ist im Erzähltext am zugänglichsten.
- source_word: בַעֲלֵי הַפָּרָשִׁים
  choice: die Reiter
  rationale: Die ungewöhnliche Verbindung bezeichnet berittene Kämpfer. »Reiter« bewahrt die lexikalische Offenheit besser als das institutionellere »Kavallerie«.
- source_word: הִדְבִּקֻהוּ
  choice: waren schon dicht an ihn herangekommen
  rationale: Das Hifil von דבק kann Einholen, Erreichen oder dichtes Nachsetzen ausdrücken. Die Formulierung lässt offen, ob sie ihn bereits vollständig eingeholt hatten, und vermittelt zugleich die unmittelbare Bedrängnis.
