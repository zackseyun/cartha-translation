  - severity: low
    issue: „Schon“ verstärkt die Aussage unnötig
    rationale: Das hebräische Verb bezeichnet enges Aufschließen/Einholen; ein zusätzliches „schon“ ist möglich, aber nicht erforderlich und kann einen zeitlichen Akzent hinzufügen.
  - severity: low
    issue: Die Annäherung der Verfolger kann enger am Bild des Aufschließens formuliert werden
    rationale: „Waren dicht an ihn herangekommen“ ist verständlich, aber „waren dicht hinter ihm“ gibt die Bedrängnis durch die heranrückenden Streitwagen und Reiter knapper und idiomatischer wieder.
