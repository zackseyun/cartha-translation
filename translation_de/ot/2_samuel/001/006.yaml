translation_notes:
  register: Moderne, würdevolle Erzählsprache. Das zweimalige וְהִנֵּה wird nicht mit dem heute altertümlich wirkenden »siehe« wiedergegeben, sondern durch zwei anschauliche Aufmerksamkeitsmarker. Die Wiederholung bleibt funktional erkennbar. Sämtliche Fußnotenmarker stehen im Haupttext.
