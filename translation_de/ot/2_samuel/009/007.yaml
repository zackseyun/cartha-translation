source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ דָוִ֜ד אַל תִּירָ֗א כִּ֣י עָשֹׂה֩ אֶעֱשֶׂ֨ה עִמְּ/ךָ֥ חֶ֨סֶד֙ בַּֽ/עֲבוּר֙ יְהוֹנָתָ֣ן אָבִ֔י/ךָ וַ/הֲשִׁבֹתִ֣י לְ/ךָ֔ אֶֽת כָּל שְׂדֵ֖ה שָׁא֣וּל אָבִ֑י/ךָ וְ/אַתָּ֗ה תֹּ֥אכַל לֶ֛חֶם עַל שֻׁלְחָנִ֖/י תָּמִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/007.yaml
  text: David said to him[a], “Do not be afraid, for I will surely show you kindness for the sake of Jonathan your father, and I will restore to you all the land of Saul your father[c][b], and you shall always eat bread at my table.”
translation:
  language: de
  text: 'David sagte zu ihm: „Hab keine Angst, denn ich werde dir um deines Vaters Jonatan willen ganz gewiss Güte erweisen. Ich werde dir den gesamten Landbesitz deines Großvaters Saul zurückgeben[a], und du sollst immer an meinem Tisch essen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das ganze Feld deines Vaters Saul“. „Vater“ kann im Hebräischen auch einen Vorfahren bezeichnen; Saul war sein Großvater.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „du sollst immer Brot an meinem Tisch essen“; gemeint sind dauerhafte Versorgung und Tischgemeinschaft.'
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Hab keine Angst!
  rationale: Eine natürliche, direkte Wiedergabe des negativen Imperativs im modernen Deutsch.
- source_word: כִּי עָשֹׂה אֶעֱשֶׂה
  choice: Denn ich werde dir ganz gewiss … erweisen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Zusage; „ganz gewiss“ bildet diese Betonung idiomatisch ab.
- source_word: חֶסֶד
  choice: Güte
  rationale: Im Zusammenhang bezeichnet das Wort eine verlässliche, in einer persönlichen Bindung gründende Wohltat. „Güte“ ist verständlich und lässt die Nuancen von loyaler Liebe und Bundestreue offen.
- source_word: בַּעֲבוּר יְהוֹנָתָן אָבִיךָ
  choice: um deines Vaters Jonatan willen
  rationale: Bewahrt den relationalen Beweggrund und gibt die hebräische Formulierung würdig und präzise wieder.
- source_word: וַהֲשִׁבֹתִי לְךָ
  choice: Ich werde dir … zurückgeben
  rationale: Der Hifil von שוב bezeichnet hier die Rückgabe beziehungsweise Wiederherstellung von Besitz.
- source_word: כָּל שְׂדֵה שָׁאוּל
  choice: den gesamten Landbesitz … Sauls
  rationale: Das singularische שָׂדֶה kann kollektiv den Land- oder Grundbesitz bezeichnen; „Landbesitz“ trifft den Nachlasskontext besser als „Feld“.
- source_word: שָׁאוּל אָבִיךָ
  choice: deines Vorfahren Saul
  rationale: אָב kann einen männlichen Vorfahren bezeichnen. Saul ist hier Mefi-Boschets Großvater; „Vorfahre“ bewahrt den weiteren Bedeutungsumfang, ohne die tatsächliche Beziehung falsch darzustellen.
- source_word: תֹּאכַל לֶחֶם עַל שֻׁלְחָנִי תָּמִיד
  choice: du sollst immer an meinem Tisch essen
  rationale: Die Wendung „Brot essen“ bezeichnet die regelmäßige Teilnahme an Mahlzeiten und damit fortdauernde Versorgung und Tischgemeinschaft; natürliches Deutsch lässt „Brot“ unausgesprochen.
theological_decisions:
- issue: Bundes- und Loyalitätsnuance von חֶסֶד
  choice: „Güte“ im Haupttext
  alternative: „beständige Liebe“, „treue Liebe“ oder „Bundestreue“
  rationale: Davids konkrete Wohltat gründet in seiner Bindung an Jonatan. „Güte“ überträgt die Handlung verständlich, ohne die vielschichtige Beziehungs- und Treuenuance auf eine einzige theologische Deutung festzulegen.
- issue: Verwandtschaftsbezeichnung אָב für Saul
  choice: „Vorfahre“
  alternative: Wörtlich „Vater“; im genealogischen Zusammenhang „Großvater“
  rationale: Die hebräische Bezeichnung ist weiter als das deutsche „Vater“. Die Übersetzung wahrt diesen Umfang und vermeidet zugleich den sachlich falschen Eindruck, Saul sei Mefi-Boschets unmittelbarer Vater.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Rede. Die Verstärkung der Zusage wird durch „ganz gewiss“ erhalten. Archaische Formen werden vermieden; die relationalen und rechtlich-sozialen Aspekte bleiben erkennbar.
