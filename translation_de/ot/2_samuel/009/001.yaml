  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/כִ֣י יֶשׁ ע֔וֹד אֲשֶׁ֥ר נוֹתַ֖ר לְ/בֵ֣ית שָׁא֑וּל וְ/אֶעֱשֶׂ֤ה עִמּ/וֹ֙ חֶ֔סֶד בַּ/עֲב֖וּר יְהוֹנָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/001.yaml
  text: David said[a], “Is there still anyone left of the house of Saul, that I may show kindness to him for Jonathan’s sake?”
translation:
  language: de
  text: 'David sagte: „Ist noch jemand vom Haus Sauls übrig, dem ich um Jonatans willen Güte[a] erweisen kann?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „loyale Liebe erweisen“ beziehungsweise „Bundestreue zeigen“. Das hebräische Wort bezeichnet häufig loyale, beständige Güte und nicht nur ein freundliches Gefühl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: אמר ist das übliche hebräische Erzählverb für „sagen“. Trotz der folgenden Frage bleibt „sagte“ eine natürliche und genaue Redeeinleitung.
- source_word: הֲכִי יֶשׁ עוֹד
  choice: Ist noch jemand
  rationale: Die Fragepartikel und die Existenzformel mit עוֹד fragen danach, ob weiterhin jemand vorhanden ist. „Ist noch jemand“ gibt dies im modernen Deutschen knapp und idiomatisch wieder.
- source_word: אֲשֶׁר נוֹתַר
  choice: übrig
  rationale: נותר bezeichnet jemanden, der verblieben oder als Überlebender übrig geblieben ist. Die Formulierung bewahrt diesen Gedanken, ohne ihn ausdrücklich auszudeuten.
- source_word: לְבֵית שָׁאוּל
  choice: vom Haus Sauls
  rationale: בֵּית bezeichnet hier Familie beziehungsweise Dynastie, nicht ein Gebäude. „Vom Haus Sauls“ erhält diesen familiär-dynastischen Sinn.
- source_word: וְאֶעֱשֶׂה עִמּוֹ חֶסֶד
  choice: dem ich Güte erweisen kann
  rationale: עשה mit חֶסֶד ist eine feste Verbindung im Sinn von „Güte erweisen“. Das deutsche „kann“ gibt die beabsichtigte beziehungsweise gesuchte Möglichkeit in Davids Frage natürlich wieder, ohne die Aussage als bloße Zukunftsfeststellung zu formulieren.
- source_word: חֶסֶד
  choice: Güte
  rationale: חֶסֶד umfasst hier wohlwollendes Handeln mit dem Beiklang beständiger Loyalität. „Güte“ ist im Haupttext klar und würdig; die weiter reichende Bedeutung wird in der Fußnote bewahrt.
- source_word: בַּעֲבוּר יְהוֹנָתָן
  choice: um Jonatans willen
  rationale: בַּעֲבוּר nennt den Beweggrund. „Um Jonatans willen“ ist idiomatisch und zeigt, dass Davids Handeln in seiner Beziehung und Verpflichtung gegenüber Jonatan begründet ist.
theological_decisions:
- issue: Bedeutungsumfang von חֶסֶד bei Davids beabsichtigtem Handeln am Haus Sauls
  choice: Im Haupttext „Güte“
  alternative: „loyale Liebe“, „beständige Liebe“ oder „Bundestreue“
  rationale: Der Zusammenhang beschreibt ein wohltätiges Handeln, das in Davids Bindung an Jonatan verwurzelt ist. „Güte“ ist im Deutschen natürlich und überlädt den Haupttext nicht; eine Fußnote erhält den möglichen Beiklang loyaler beziehungsweise bundestreuer Zuwendung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Haus Sauls“ bewahrt die dynastisch-familiäre Ausdrucksweise; „um Jonatans willen“ ist bewusst gehoben, aber weiterhin allgemein verständlich.
