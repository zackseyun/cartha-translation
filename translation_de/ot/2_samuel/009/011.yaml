source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר צִיבָא֙ אֶל הַ/מֶּ֔לֶךְ כְּ/כֹל֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ אֶת עַבְדּ֔/וֹ כֵּ֖ן יַעֲשֶׂ֣ה עַבְדֶּ֑/ךָ וּ/מְפִיבֹ֗שֶׁת אֹכֵל֙ עַל שֻׁלְחָנִ֔/י כְּ/אַחַ֖ד מִ/בְּנֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/011.yaml
  text: Ziba said to the king[a], “According to all that my lord the king commands his servant[b], so your servant will do.” And Mephibosheth ate at my table like one of the king’s sons.
translation:
  language: de
  text: 'Ziba sagte zum König: »Alles, was mein Herr, der König, seinem Diener befiehlt, wird dein Diener tun.« Und Mefi-Boschet aß an meinem Tisch[a] wie einer der Söhne des Königs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem hebräischen Text: »an meinem Tisch«. Gemeint ist Davids Tisch. Alte Übersetzungen und viele moderne Bibeln geben hier sinngemäß »am Tisch des Königs« wieder.'
    reason: Der masoretische Text bewahrt die erste Person und damit einen auffälligen Perspektivwechsel, den die Übersetzung nicht stillschweigend glättet.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche neuhebräische Erzählformel wird im Deutschen natürlich mit dem Präteritum »sagte« wiedergegeben.
- source_word: כְּכֹל אֲשֶׁר ... כֵּן
  choice: Alles, was …, wird … tun
  rationale: Die korrelative Aussage wird idiomatisch verdichtet, wobei ihr umfassender Sinn und Zibas Gehorsamszusage erhalten bleiben.
- source_word: יְצַוֶּה
  choice: befiehlt
  rationale: Das Präsens gibt die geltende Verpflichtung in der höfischen Gehorsamsformel natürlich wieder.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr, der König
  rationale: Bewahrt die respektvolle höfische Anrede und klingt im modernen Deutschen würdig.
- source_word: עַבְדּוֹ / עַבְדֶּךָ
  choice: seinem Diener / dein Diener
  rationale: »Diener« entspricht hier der höfischen Selbstbezeichnung im königlichen Dienst; »Sklave« würde den sozialen Status unnötig in den Vordergrund rücken.
- source_word: וּמְפִיבֹשֶׁת
  choice: Und Mefi-Boschet
  rationale: Die Konjunktion eröffnet den abschließenden Satz; der Name wird in einer im Deutschen verständlichen, an die hebräische Form angelehnten Schreibweise wiedergegeben.
- source_word: אֹכֵל
  choice: aß
  rationale: Das Partizip beschreibt hier die bestehende Tischgemeinschaft; im deutschen Erzählzusammenhang bringt das Präteritum diese regelmäßige beziehungsweise fortdauernde Stellung natürlich zum Ausdruck.
- source_word: עַל שֻׁלְחָנִי
  choice: an meinem Tisch
  rationale: »An … Tisch essen« ist die natürliche deutsche Wendung. Die erste Person des masoretischen Textes wird trotz des auffälligen Perspektivwechsels bewahrt.
- source_word: כְּאַחַד מִבְּנֵי הַמֶּלֶךְ
  choice: wie einer von den Söhnen des Königs
  rationale: Bewahrt Vergleich, Zugehörigkeitsbezeichnung und königlichen Status ohne Mefi-Boschet ausdrücklich zu einem leiblichen Sohn zu erklären.
theological_decisions:
- issue: Sprecherperspektive bei »meinem Tisch«
  choice: Die erste Person »meinem Tisch« wird nach dem masoretischen Text beibehalten.
  alternative: »am Tisch des Königs« als geglättete Lesart beziehungsweise im Anschluss an alte Übersetzungen.
  rationale: Der hebräische Konsonanten- und Vokaltext bietet שֻׁלְחָנִי, »mein Tisch«. Der dadurch entstehende Wechsel von Zibas Rede zu Davids Perspektive ist schwierig, aber textlich echt und soll nicht stillschweigend harmonisiert werden; die Fußnote erläutert die Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Rede bleibt erkennbar, ohne altertümliche Formen wie »Euer Knecht« oder »soll tun« zu verwenden. Der textkritisch beziehungsweise erzählerisch schwierige Perspektivwechsel wird im Haupttext bewahrt und knapp erläutert.
