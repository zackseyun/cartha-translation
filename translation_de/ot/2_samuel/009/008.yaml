  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen Aussagen des Hebräischen zuverlässig wieder: die Geste der Unterwerfung, die bewusst ungewöhnliche Selbstbezeichnung »dein Diener«, die rhetorische שאל-Frage, das konkrete Bild des Sich-Zuwendens sowie das Selbsterniedrigungsbild vom »toten Hund«. »Wie mir« bildet אֲשֶׁר כָּמוֹנִי idiomatisch und treffend ab.'
