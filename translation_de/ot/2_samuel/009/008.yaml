base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/008.yaml
  text: And he bowed down and said[a], “What is your servant[b], that you have turned toward a dead dog like me?”
translation:
  language: de
  text: 'Da warf er sich nieder und sagte: »Was ist dein Diener, dass du dich einem toten Hund wie mir zugewandt hast?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Sich jemandem zuwenden« bedeutet hier, ihn gnädig zu beachten und sich seiner anzunehmen. »Ein toter Hund« ist ein drastisches Bild äußerster Selbsterniedrigung und vermeintlicher Wertlosigkeit.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: Da warf er sich nieder
  rationale: Das Hitpael von שׁחה bezeichnet hier eine körperliche Geste der Ehrerbietung und Unterordnung. »Sich niederwerfen« gibt die Intensität genauer wieder als bloßes »sich verbeugen«, ohne die Geste als Anbetung festzulegen.
- source_word: מֶה עַבְדֶּךָ
  choice: Was ist dein Diener
  rationale: Die ungewöhnliche hebräische Frage wird bewusst bewahrt; sie drückt starke Selbsterniedrigung aus. »Diener« passt zur höfischen Selbstbezeichnung besser als »Sklave«.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt beziehungsweise Anlass der rhetorischen Frage ein. Die deutsche Konstruktion »Was ist …, dass …?« bewahrt ihre Form und Funktion.
- source_word: פָנִיתָ אֶל
  choice: du dich … zugewandt hast
  rationale: Die Wendung bedeutet wörtlich »sich jemandem zuwenden« und vermittelt im Zusammenhang Davids gnädige Beachtung. Das konkrete Bild bleibt im Deutschen natürlich erhalten.
- source_word: הַכֶּלֶב הַמֵּת
  choice: einem toten Hund
  rationale: Die Wendung ist ein drastisches Bild äußerster Selbsterniedrigung und vermeintlicher Wertlosigkeit. Der unbestimmte Artikel entspricht dem natürlichen deutschen Gebrauch.
- source_word: אֲשֶׁר כָּמוֹנִי
  choice: wie mir
  rationale: Die knappe Vergleichsform gibt die Selbstbezeichnung Mephiboschets natürlich wieder und bewahrt ihre Härte.
