  yaml_path: translation/ot/2_samuel/009/004.yaml
  text: The king said to him, “Where is he?” Ziba said to the king, “Look, he is in the house of Machir son of Ammiel, in Lo-debar.”
translation:
  language: de
  text: 'Der König fragte ihn: „Wo ist er?“ Ziba antwortete dem König: „Er ist im Haus Machirs, des Sohnes Ammiëls, in Lo-Debar.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: nicht eigens wiedergegeben
  rationale: Die Partikel lenkt die Aufmerksamkeit auf die folgende Auskunft. Im natürlichen modernen Deutsch erfüllt die direkte Antwort „Er ist …“ diese Funktion bereits; „Siehe“ wäre hier unnötig feierlich, „Schau“ in dieser Gesprächssituation unidiomatisch.
- source_word: בֵּית מָכִיר
  choice: im Haus Machirs
  rationale: Gibt die hebräische Status-constructus-Verbindung knapp und natürlich wieder; gemeint ist Machirs Haushalt beziehungsweise Wohnhaus.
- source_word: בְּלוֹ דְבָר
  choice: in Lo-Debar
  rationale: Der Ortsname wird als Eigenname transliteriert und nicht aufgrund möglicher Wortspiele übersetzt.
