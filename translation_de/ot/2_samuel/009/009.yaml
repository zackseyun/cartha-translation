source:
  edition: WLC
  text: וַ/יִּקְרָ֣א הַ/מֶּ֗לֶךְ אֶל צִיבָ֛א נַ֥עַר שָׁא֖וּל וַ/יֹּ֣אמֶר אֵלָ֑י/ו כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה לְ/שָׁאוּל֙ וּ/לְ/כָל בֵּית֔/וֹ נָתַ֖תִּי לְ/בֶן אֲדֹנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
translation:
  language: de
  text: 'Da rief der König Ziba, Sauls Diener,[a] und sagte zu ihm: „Alles, was Saul und seinem ganzen Haus gehörte,[b] habe ich dem Sohn deines Herrn[c] gegeben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sauls junger Mann“ beziehungsweise „Sauls Gefolgsmann“. Das hebräische Wort bezeichnet hier wahrscheinlich einen Diener oder Bediensteten des königlichen Haushalts.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „was Saul und seinem ganzen Haus gehörte“. Mit „Haus“ können hier Sauls Haushalt, Familie und Besitz gemeint sein.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist Mefi-Boschet. Er war Sauls Enkel; „Sohn“ kann im Hebräischen auch einen Nachkommen bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: Diener
  rationale: נַעַר kann „Junger Mann“, „Bediensteter“ oder „Gefolgsmann“ bedeuten. Im Zusammenhang mit Sauls Haushalt bezeichnet es am ehesten Zibas Stellung als Diener oder Gefolgsmann.
- source_word: כֹּל אֲשֶׁר הָיָה לְשָׁאוּל
  choice: Alles, was Saul … gehörte
  rationale: Die hebräische Wendung bezeichnet Besitz. Die deutsche Formulierung gibt sie klar und natürlich wieder.
- source_word: וּלְכָל בֵּיתוֹ
  choice: und seinem ganzen Haus gehörte
  rationale: בַּיִת kann Haus, Hausgemeinschaft, Familie oder Besitzverband bezeichnen. „Ganzes Haus“ bewahrt die Bildsprache und lässt den kontextuell gemeinten Familienbesitz beziehungsweise Haushalt erkennen.
- source_word: נָתַתִּי
  choice: habe ich … gegeben
  rationale: Das Perfekt bezeichnet eine vollzogene Übertragung, deren Ergebnis fortbesteht. Das deutsche Perfekt passt zur direkten Rede und drückt die abgeschlossene Handlung natürlich aus.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: dem Sohn deines Herrn
  rationale: אֲדוֹן bezeichnet hier einen menschlichen Herrn beziehungsweise Haushaltsvorstand. „Sohn“ bewahrt die hebräische Verwandtschaftsbezeichnung, die hier weiter im Sinn von Nachkomme gebraucht wird.
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  choice: Da rief … und sagte
  rationale: Die Verbfolge führt die Erzählung weiter. „Da“ gibt diesen Fortgang in natürlichem, würdigem Deutsch wieder.
