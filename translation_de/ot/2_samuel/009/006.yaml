base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/006.yaml
  text: Mephibosheth son of Jonathan, son of Saul, came to David and fell on his face and bowed down. David said, “Mephibosheth,” and he said, “Here is your servant.”
translation:
  language: de
  text: 'Da kam Mefiboschet, der Sohn Jonatans, des Sohnes Sauls, zu David. Er warf sich mit dem Gesicht zur Erde nieder und verbeugte sich. David sagte: „Mefiboschet!“ Er antwortete: „Hier ist dein Diener.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: Er warf sich mit dem Gesicht zur Erde nieder
  rationale: Gibt die körperliche Geste des Niederfallens auf das Gesicht natürlich und anschaulich wieder.
- source_word: וַיִּשְׁתָּחוּ
  choice: und verbeugte sich
  rationale: Bewahrt die zweite, ehrerbietige Handlung neben dem Niederfallen, ohne sie mit Anbetung gleichzusetzen.
- source_word: הִנֵּה עַבְדֶּךָ
  choice: Hier ist dein Diener
  rationale: Gibt die Formel als unmittelbare, demütige Bereitschaftserklärung in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von וַיִּשְׁתָּחוּ im höfischen Zusammenhang
  choice: verbeugte sich
  alternative: betete an
  rationale: Der Kontext beschreibt die Ehrerbietung eines Untergebenen vor dem König; die hebräische Form bezeichnet nicht notwendig kultische Anbetung.
- issue: Selbstbezeichnung עַבְדֶּךָ
  choice: dein Diener
  alternative: dein Sklave
  rationale: Im höfischen Dialog ist „dein Diener“ die idiomatische deutsche Entsprechung und bewahrt die demütige Unterordnung, ohne den Ausdruck unnötig auf den rechtlichen Sklavenstatus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der doppelte Handlungsablauf des hebräischen Textes wird bewahrt; die Namensform „Mefiboschet“ folgt einer geläufigen deutschen Transliteration.
