base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/005.yaml
  text: So King David sent and took him from the house of Machir son of Ammiel[a], from Lo-debar.
translation:
  language: de
  text: Da schickte König David nach ihm und ließ ihn aus dem Haus Machirs, des Sohnes Ammiëls, aus Lo-Dabar holen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Da sandte König David und nahm ihn aus dem Haus Machirs, des Sohnes Ammiëls, aus Lo-Dabar.“ Die hebräische Folge „sandte“ und „nahm ihn“ wird im Haupttext idiomatisch mit „schickte nach ihm und ließ ihn … holen“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: schickte nach ihm
  rationale: שׁלח bedeutet zunächst „senden“. Zusammen mit dem folgenden „nahm ihn“ bezeichnet es hier idiomatisch, dass David nach dem Mann schicken ließ.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: König David
  rationale: Die hebräische Apposition „der König, David“ wird im Deutschen natürlich als Titel mit Namen wiedergegeben.
- source_word: וַיִּקָּחֵהוּ
  choice: ließ ihn … holen
  rationale: לקח heißt wörtlich „nehmen“. In Verbindung mit Davids Aussenden und der Herkunftsangabe ist „holen lassen“ im Deutschen die natürliche kausative Wiedergabe; die wörtlichere Struktur wird in der Fußnote genannt.
- source_word: מִבֵּית
  choice: aus dem Haus
  rationale: בַּיִת kann sowohl das Gebäude als auch den Haushalt bezeichnen. „Haus“ bewahrt diese mögliche Bedeutungsbreite.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: Machirs, des Sohnes Ammiëls
  rationale: Die Abstammungsangabe wird ausdrücklich bewahrt; die Namensformen folgen einer gut lesbaren deutschen Transliteration, wobei das Trema in Ammiël die getrennte Aussprache der Vokale anzeigt.
- source_word: מִלּוֹ דְבָר
  choice: aus Lo-Dabar
  rationale: Der Ausdruck ist im Kontext ein Ortsname. Die wiederholte Präposition מִן wird durch das zweite „aus“ entsprechend der hebräischen Struktur wiedergegeben.
