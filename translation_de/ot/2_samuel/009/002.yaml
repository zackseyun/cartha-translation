source:
  edition: WLC
  text: וּ/לְ/בֵ֨ית שָׁא֥וּל עֶ֨בֶד֙ וּ/שְׁמ֣/וֹ צִיבָ֔א וַ/יִּקְרְאוּ ל֖/וֹ אֶל דָּוִ֑ד וַ/יֹּ֨אמֶר הַ/מֶּ֧לֶךְ אֵלָ֛י/ו הַ/אַתָּ֥ה צִיבָ֖א וַ/יֹּ֥אמֶר עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/002.yaml
  text: The house of Saul had a servant whose name was Ziba[a], and they called him to David. And the king said to him, “Are you Ziba?” And he said, “Your servant.”
translation:
  language: de
  text: 'Zum Haus Sauls gehörte ein Diener namens Ziba. Man rief ihn zu David, und der König fragte ihn: »Bist du Ziba?« Er antwortete: »Dein Diener.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, ausdrücklich ergänzt: »Ich bin dein Diener.« Die hebräische Antwort ist verkürzt und lautet wörtlich: »Dein Diener.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבֵית שָׁאוּל
  choice: Zum Haus Sauls gehörte
  rationale: Die Präpositionalverbindung drückt hier Zugehörigkeit beziehungsweise Besitz aus. Diese Formulierung gibt das idiomatisch und ohne ein nicht ausdrücklich vorhandenes zeitliches »Nun« wieder.
- source_word: עֶבֶד
  choice: ein Diener
  rationale: עֶבֶד kann »Sklave« oder »Diener« bedeuten. Im Zusammenhang bezeichnet es einen dem Haus Sauls zugehörigen Bediensteten; »Diener« bewahrt die soziale Unterordnung, ohne den Status genauer festzulegen, als es der Kontext erlaubt.
- source_word: וּשְׁמוֹ צִיבָא
  choice: namens Ziba
  rationale: Eine natürliche deutsche Wiedergabe der hebräischen Namensformel.
- source_word: וַיִּקְרְאוּ לוֹ אֶל דָּוִד
  choice: Man rief ihn zu David
  rationale: Das unbestimmte Subjekt der 3. Person Plural wird im Deutschen idiomatisch mit »man« wiedergegeben. קרא mit Zielangabe bezeichnet hier das Rufen beziehungsweise Bestellen in Davids Gegenwart.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Titel bezieht sich im Erzählzusammenhang auf David.
- source_word: הַאַתָּה צִיבָא
  choice: Bist du Ziba?
  rationale: Die hebräische Fragepartikel mit dem Pronomen wird als natürliche deutsche Identitätsfrage wiedergegeben.
- source_word: עַבְדֶּךָ
  choice: Dein Diener
  rationale: Die knappe, elliptische Antwort wird wörtlich bewahrt; im höfischen Zusammenhang dient sie als ehrerbietige Bestätigung und Selbstbezeichnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Kürze der abschließenden höfischen Antwort bleibt erhalten; die Erzählverknüpfung wird ohne zusätzliches »Nun« wiedergegeben.
