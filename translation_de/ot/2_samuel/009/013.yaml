  yaml_path: translation/ot/2_samuel/009/013.yaml
  text: And Mephibosheth lived in Jerusalem[a], because he always ate at the king’s table[b]. Now he was lame in both his feet.
translation:
  language: de
  text: Und Mefi-Boschet wohnte in Jerusalem, denn er aß ständig am Tisch des Königs. Er war an beiden Füßen lahm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשֵׁב
  choice: wohnte
  rationale: Das Partizip von ישׁב bezeichnet in Verbindung mit einem Ortsnamen den Wohnsitz; „wohnte“ ist im Deutschen natürlich und präzise.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier die Begründung dafür an, dass Mefi-Boschet in Jerusalem wohnte. „Denn“ bewahrt den erzählerischen Anschluss und die kausale Beziehung.
- source_word: שֻׁלְחַן הַמֶּלֶךְ
  choice: am Tisch des Königs
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung idiomatisch wieder und bewahrt das Bild königlicher Versorgung und Tischgemeinschaft.
- source_word: תָּמִיד
  choice: ständig
  rationale: תָּמִיד bezeichnet fortdauernde beziehungsweise regelmäßige Wiederholung; „ständig“ passt natürlich zum gewohnheitsmäßigen Essen am königlichen Tisch.
- source_word: אֹכֵל
  choice: aß
  rationale: Das Partizip beschreibt hier eine gewohnheitsmäßige Handlung; zusammen mit „ständig“ gibt das Präteritum diesen Sinn im deutschen Erzählstil angemessen wieder.
- source_word: פִסֵּחַ
  choice: gelähmt
  rationale: Das Adjektiv bezeichnet eine Beeinträchtigung der Gehfähigkeit. „Gelähmt“ ist im heutigen Deutschen verständlich und weniger abwertend als ältere Bezeichnungen, ohne über die konkrete Angabe des Verses hinauszugehen.
- source_word: שְׁתֵּי רַגְלָיו
  choice: an beiden Füßen
  rationale: Dies gibt das hebräische „seine beiden Füße“ präzise wieder; „Füße“ ist genauer als das allgemeinere „Beine“.
- source_word: וְהוּא
  choice: Er war
  rationale: Das Waw leitet eine abschließende Zustandsangabe ein. Ein neuer deutscher Hauptsatz wirkt natürlich, ohne den additiven Zusammenhang inhaltlich zu verändern.
