    rationale: '„Wörtlich: an den Füßen beeinträchtigt“ ist eher eine interpretierende, moderne Umschreibung als eine wörtliche Wiedergabe. „An den Füßen lahm“ bildet die idiomatische lexikalische Alternative näher ab.'
