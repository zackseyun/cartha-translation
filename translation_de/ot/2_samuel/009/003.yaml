  text: וַ/יֹּ֣אמֶר הַ/מֶּ֗לֶךְ הַ/אֶ֨פֶס ע֥וֹד אִישׁ֙ לְ/בֵ֣ית שָׁא֔וּל וְ/אֶעֱשֶׂ֥ה עִמּ֖/וֹ חֶ֣סֶד אֱלֹהִ֑ים וַ/יֹּ֤אמֶר צִיבָא֙ אֶל הַ/מֶּ֔לֶךְ ע֛וֹד בֵּ֥ן לִ/יהוֹנָתָ֖ן נְכֵ֥ה רַגְלָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/003.yaml
  text: Then the king said[a], “Is there still anyone left of the house of Saul, that I may show him the kindness of God?” Ziba said to the king, “There is still a son of Jonathan[b], crippled in his feet.”
translation:
  language: de
  text: 'Da sagte der König: „Ist noch jemand vom Haus Sauls übrig, dem ich Gottes Güte[a] erweisen kann?“ Ziba sagte zum König: „Es gibt noch einen Sohn Jonatans; er hat eine Beeinträchtigung an den Füßen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gottes treue Güte“. Das hebräische Wort bezeichnet auch loyale, verlässliche Zuwendung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er ist an den Füßen lahm.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶפֶס עוֹד אִישׁ
  choice: Ist noch jemand … übrig?
  rationale: Die idiomatische Frage erkundigt sich danach, ob noch jemand aus Sauls Familie lebt. Die positive deutsche Frage gibt diesen Sinn natürlich wieder, ohne ein missverständliches doppeltes Negativ.
- source_word: לְבֵית שָׁאוּל
  choice: vom Haus Sauls
  rationale: „Haus“ bezeichnet hier Sauls Familie beziehungsweise Dynastie; die knappe Formulierung bewahrt dieses Bild.
- source_word: וְאֶעֱשֶׂה עִמּוֹ
  choice: dem ich … erweisen kann
  rationale: In Verbindung mit חֶסֶד ist „Güte erweisen“ idiomatisches Deutsch. „Kann“ gibt Davids Absicht in der Frage natürlich wieder.
- source_word: חֶסֶד אֱלֹהִים
  choice: Gottes Güte
  rationale: Die Formulierung wahrt den Genitiv und lässt offen, ob die Güte von Gott kommt, seinem Wesen entspricht oder als besondere, außerordentliche Güte gemeint ist. חֶסֶד schließt loyale, verlässliche Zuwendung ein.
- source_word: עוֹד בֵּן לִיהוֹנָתָן
  choice: Es gibt noch einen Sohn Jonatans
  rationale: Die Formulierung bewahrt den Nachdruck darauf, dass noch ein Nachkomme Jonatans lebt.
- source_word: נְכֵה רַגְלָיִם
  choice: an beiden Füßen gelähmt
  rationale: Der Dual רַגְלַיִם bezeichnet beide Füße; נְכֵה beschreibt eine körperliche Beeinträchtigung. Die Wendung ist klar, würdevoll und im heutigen Deutsch verständlich.
theological_decisions:
- issue: Bedeutung von חֶסֶד אֱלֹהִים
  choice: Gottes Güte
  alternative: Gottes Bundestreue; eine Gott entsprechende Güte; außergewöhnliche Güte
  rationale: Die hebräische Genitivverbindung ist mehrdeutig. Der Haupttext bewahrt diese Offenheit, während die Fußnote die in חֶסֶד liegende Nuance loyaler und verlässlicher Zuwendung nennt, ohne die Wendung auf eine einzige theologische Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haus Sauls“ erhält das biblische Familien- und Dynastiebild. Die Bezeichnung der Behinderung ist sachlich und respektvoll formuliert; die wörtlichere Alternative steht in der Fußnote.
