  text: וְ/לִ/מְפִיבֹ֥שֶׁת בֵּן קָטָ֖ן וּ/שְׁמ֣/וֹ מִיכָ֑א וְ/כֹל֙ מוֹשַׁ֣ב בֵּית צִיבָ֔א עֲבָדִ֖ים לִ/מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/012.yaml
  text: Mephibosheth had a young son[a], and his name was Mica[b]. And all who lived in the house of Ziba were servants to Mephibosheth.
translation:
  language: de
  text: Mefiboschet hatte einen jungen Sohn, und sein Name war Micha. Alle Bewohner des Hauses Zibas waren Mefiboschets Diener.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sklaven«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמְפִיבֹשֶׁת
  choice: Mefiboschet hatte
  rationale: 'Die hebräische Konstruktion mit ל bezeichnet hier Besitz: wörtlich etwa »Mefiboschet war ein Sohn zugehörig«. Im Deutschen wird dies natürlich mit »Mefiboschet hatte« wiedergegeben.'
- source_word: בֵּן קָטָן
  choice: einen jungen Sohn
  rationale: קָטָן bezeichnet hier das geringe Alter des Sohnes. »Junger Sohn« ist im Deutschen eindeutiger als »kleiner Sohn«, das auch die Körpergröße meinen könnte.
- source_word: וּשְׁמוֹ מִיכָא
  choice: und sein Name war Micha
  rationale: Die Formulierung bewahrt die einfache hebräische Satzstruktur. מִיכָא wird nach geläufiger deutscher Namenstradition als »Micha« wiedergegeben.
- source_word: וְכֹל מוֹשַׁב בֵּית צִיבָא
  choice: Alle Bewohner des Hauses Zibas
  rationale: מוֹשַׁב hat mit Wohnen beziehungsweise Wohnsitz zu tun und bezeichnet hier kollektiv die im Haus Zibas lebenden Menschen. »Bewohner« gibt diesen Bezug knapp und natürlich wieder.
- source_word: עֲבָדִים לִמְפִיבֹשֶׁת
  choice: waren Mefiboschets Diener
  rationale: עֶבֶד kann je nach sozialem und rechtlichem Zusammenhang »Diener« oder »Sklave« bedeuten. Der Vers hebt das Dienstverhältnis des gesamten Hauses hervor; »Diener« wahrt dies, ohne einen rechtlichen Status festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Besitzkonstruktion wird idiomatisch wiedergegeben, während die schlichte parataktische Erzählweise weitgehend erhalten bleibt. Die Namensformen »Mefiboschet«, »Micha« und »Ziba« folgen geläufigen deutschen Transliterationskonventionen.
