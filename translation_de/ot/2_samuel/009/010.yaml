base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/010.yaml
  text: You and your sons and your servants shall work the land for him[a], and you shall bring in the produce, and it shall be bread for your master's son, and he shall eat it. But Mephibosheth, your master's son, shall always eat bread at my table. Now Ziba had fifteen sons and twenty servants.
translation:
  language: de
  text: Du sollst für ihn das Land bestellen, du, deine Söhne und deine Sklaven, und sollst die Ernte einbringen. Und der Sohn deines Herrn soll Brot[a] haben und davon essen. Mefi-Boschet aber, der Sohn deines Herrn, soll stets an meinem Tisch Brot essen. Ziba hatte fünfzehn Söhne und zwanzig Sklaven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Brot“ kann hier auch allgemein „Nahrung“ oder „Lebensunterhalt“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַדְתָּ לּוֹ אֶת־הָאֲדָמָה
  choice: Du sollst für ihn das Land bestellen
  rationale: עבד bezeichnet mit אֲדָמָה konkret die landwirtschaftliche Bearbeitung des Bodens zugunsten Mefi-Boschets. „Das Land bestellen“ ist im Deutschen natürlich und präzise.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: deine Sklaven / Sklaven
  rationale: עֶבֶד bezeichnet hier Angehörige von Zibas gebundener häuslicher Arbeitskraft; „Sklaven“ macht diesen sozialen Status deutlicher als das allgemeinere „Diener“.
- source_word: וְהֵבֵאתָ
  choice: sollst die Ernte einbringen
  rationale: Das Objekt ist im Hebräischen unausgesprochen und ergibt sich aus dem Ackerbaukontext. „Die Ernte“ verdeutlicht den gemeinten Ertrag, ohne den Sinn wesentlich zu erweitern.
- source_word: וְהָיָה לְבֶן אֲדֹנֶיךָ לֶּחֶם וַאֲכָלוֹ
  choice: Dann soll der Sohn deines Herrn Brot haben und davon essen
  rationale: „Brot“ bewahrt das konkrete לֶחֶם, das in diesem Zusammenhang zugleich Nahrung oder Lebensunterhalt bezeichnen kann. „Davon“ gibt den hebräischen Objektsuffix natürlich wieder.
- source_word: יֹאכַל תָּמִיד לֶחֶם עַל שֻׁלְחָנִי
  choice: soll stets an meinem Tisch essen
  rationale: Die deutsche Wendung „an meinem Tisch essen“ gibt das Idiom natürlich wieder; לֶחֶם muss hier nicht nochmals ausdrücklich übersetzt werden, da „essen“ im Deutschen genügt und die fortdauernde Versorgung bezeichnet.
- source_word: וּלְצִיבָא חֲמִשָּׁה עָשָׂר בָּנִים וְעֶשְׂרִים עֲבָדִים
  choice: Ziba hatte fünfzehn Söhne und zwanzig Sklaven
  rationale: Der verblosen hebräischen Hintergrundangabe entspricht im Deutschen natürlich eine Konstruktion mit „hatte“.
theological_decisions: []
