  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber für einen natürlichen deutschen Lesefluss gegliedert. Der Kontrast vor Mefi-Boschet wird mit „aber“ bewahrt.
