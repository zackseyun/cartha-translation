- from: 'Er sagte: »Mein Herr und König, mein Diener hat mich getäuscht[a]. Denn dein Diener hatte gesagt: ›Ich will mir die Eselin satteln, auf ihr reiten und mit dem König ziehen‹; denn dein Diener ist gehbehindert.«'
  to: 'Er sagte: »Mein Herr, der König, mein Diener hat mich getäuscht[a]. Denn dein Diener hatte gesagt: ›Ich will mir den Esel satteln, auf ihm reiten und mit dem König mitgehen‹; denn dein Diener ist lahm.«'
  rationale: Die Revision korrigiert das grammatische Geschlecht von הַחֲמוֹר, gibt פִסֵּחַ konkret mit „lahm“ wieder und präzisiert die königliche Anrede. Die direkte Rede und die offene Bedeutung von רִמָּנִי bleiben erhalten. Die englische Audit-Fassung weicht in der Satzzuordnung vom bereitgestellten hebräischen Wortlaut ab; maßgeblich ist hier der Originaltext.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:06:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorgelegten hebräischen Text grundsätzlich gut und bewahrt im Unterschied zur englischen Audit-Fassung dessen direkte Anrede: Der Sprecher sagt dem König, sein Diener habe ihn getäuscht. Die Wiedergabe „Eselin“ ist jedoch nicht gedeckt: הַחֲמוֹר ist morphologisch maskulin („der Esel“). Das feminine Suffix in עָלֶיהָ rechtfertigt keine Umdeutung des Nomens.'
  naturalness: Die Satzgestaltung und die höfische Rede sind gut verständlich. „Mit dem König mitgehen“ ist im heutigen Standarddeutsch etwas unmittelbarer als „mit dem König ziehen“, ohne den Begleitsinn abzuschwächen. „Lahm“ benennt die konkret im Ausgangstext genannte Einschränkung präziser als das allgemeinere „gehbehindert“.
  terminology: „Mein Herr, der König“ bildet die höfische Formel אֲדֹנִי הַמֶּלֶךְ genauer ab als „mein Herr und König“. „Diener“ ist in beiden Vorkommen angemessen. Die Fußnote zu רִמָּנִי wahrt die lexikalische Spannweite und sollte beibehalten werden.
  issues:
  - severity: medium
    issue: „Eselin“ für הַחֲמוֹר
    rationale: Das hebräische Substantiv חֲמוֹר ist maskulin. Das feminine pronominale Suffix bei „auf ihr“ stellt eine im Hebräischen mögliche anaphorische Inkongruenz dar, macht aus dem ausdrücklich maskulinen Nomen aber keine Eselin.
  - severity: low
    issue: „gehbehindert“ ist weniger spezifisch als פִסֵּחַ
    rationale: פִסֵּחַ bezeichnet konkret „lahm“. Die modernere Umschreibung erweitert den Sinn zu einer allgemeinen Gehbehinderung.
  - severity: low
    issue: Höfische Anrede leicht geglättet
    rationale: „Mein Herr, der König“ erhält die Apposition der hebräischen Anrede und klingt zugleich im Deutschen natürlich.
