base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/027.yaml
  text: And he has slandered your servant to my lord the king[a], for your servant said, ‘I will saddle the donkey for myself so that I may ride on it and go with the king,’ because your servant is lame.
translation:
  language: de
  text: 'Er sagte: »Mein Herr, der König, mein Diener hat mich getäuscht[a]. Denn dein Diener hatte gesagt: ›Ich will mir den Esel satteln, auf ihm reiten und mit dem König mitgehen‹; denn dein Diener ist lahm.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hat mich hintergangen« beziehungsweise »hat mich betrogen«. Das hebräische Verb kann Täuschung oder treuloses Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמָּנִי
  choice: hat mich getäuscht
  rationale: Das Piel von רמה mit Suffix der 1. Person bezeichnet hier irreführendes oder treuloses Handeln. »Getäuscht« gibt die unmittelbare Aussage des vorliegenden hebräischen Textes wieder, ohne sie vorschnell auf die spätere Verleumdung einzuengen.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: Im Zusammenhang des königlichen Haushalts bezeichnet das Wort einen persönlichen Bediensteten; »Diener« ist im Deutschen natürlich und lässt den genauen Rechtsstatus offen.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr und König
  rationale: Die Formulierung bewahrt die ehrerbietige höfische Anrede in natürlichem Deutsch.
- source_word: אֶחְבְּשָׁה לִּי הַחֲמוֹר
  choice: Ich will mir die Eselin satteln
  rationale: Die Form der 1. Person drückt Absicht oder Entschluss aus. חבש bezeichnet hier das Satteln beziehungsweise Herrichten eines Reittiers; das feminine Pronomen im Folgesatz legt die Wiedergabe »Eselin« nahe.
- source_word: וְאֶרְכַּב עָלֶיהָ
  choice: auf ihr reiten
  rationale: Die knappe koordinierte Infinitivformulierung gibt die beabsichtigte Folge natürlich wieder und berücksichtigt das feminine Suffix.
- source_word: וְאֵלֵךְ אֶת הַמֶּלֶךְ
  choice: mit dem König ziehen
  rationale: הלך mit אֶת bezeichnet hier Begleitung. »Mit dem König ziehen« bewahrt diesen Sinn und passt zum erzählerischen Zusammenhang der Reise.
- source_word: פִסֵּחַ
  choice: gehbehindert
  rationale: Das Adjektiv bezeichnet eine Einschränkung beim Gehen. »Gehbehindert« ist präzise, verständlich und in modernem Deutsch weniger abwertend als ältere Bezeichnungen.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Die traditionelle ehrerbietige Selbstbezeichnung vor dem König wird beibehalten.
