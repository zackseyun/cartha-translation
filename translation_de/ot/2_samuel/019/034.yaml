  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und alle wesentlichen Elemente des Hebräischen zutreffend wieder: die fortlaufende Erzählung, den König als Sprecher, Barsillai als Adressaten, den hervorgehobenen Imperativ, die Begleitung beim Hinüberziehen sowie die Zusage dauerhafter Versorgung in Jerusalem. „Bei mir“ gibt עִמָּדִי angemessen wieder, ohne die Wendung unnötig auszudeuten.'
