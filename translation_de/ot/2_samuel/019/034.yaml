  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֶל בַּרְזִלָּ֑י אַתָּה֙ עֲבֹ֣ר אִתִּ֔/י וְ/כִלְכַּלְתִּ֥י אֹתְ/ךָ֛ עִמָּדִ֖/י בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/034.yaml
  text: And the king said to Barzillai[a], “You cross over with me, and I will provide for you with me in Jerusalem.”
translation:
  language: de
  text: 'Und der König sagte zu Barsillai: „Zieh du mit mir hinüber, und ich werde in Jerusalem bei mir für dich sorgen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und ... sagte
  rationale: Die Erzählform Wayyiqtol führt die Handlung fort; „Und“ bewahrt den hebräischen Erzählfluss, ohne eine genauere zeitliche Beziehung festzulegen.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Das bestimmte Substantiv bezeichnet im Kontext König David.
- source_word: אֶל בַּרְזִלָּי
  choice: zu Barsillai
  rationale: Die Präposition markiert den Adressaten der Rede; der Personenname wird in der im Deutschen geläufigen Form wiedergegeben.
- source_word: אַתָּה עֲבֹר
  choice: Zieh du ... hinüber
  rationale: Das selbstständige Pronomen betont den Angesprochenen und wird durch das nachgestellte „du“ erhalten. עבר bezeichnet hier im Reise- und Jordankontext das Hinüberziehen.
- source_word: אִתִּי
  choice: mit mir
  rationale: Die Wendung bezeichnet Begleitung.
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: und ich werde ... für dich sorgen
  rationale: כלכל bezeichnet hier das Versorgen beziehungsweise Bestreiten der Bedürfnisse. „Für dich sorgen“ ist natürliches modernes Deutsch und bewahrt den umfassenden Sinn.
- source_word: עִמָּדִי
  choice: bei mir
  rationale: Die Form bezeichnet das Bleiben in der Nähe beziehungsweise Gemeinschaft des Königs. „Bei mir“ vermeidet die im Deutschen schwerfällige Wiederholung von „mit mir“.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Ortsname mit der Präposition ב; direkte Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die nachdrückliche Stellung von אַתָּה wird mit „du“ erhalten; die doppelte Begleitungsformel wird idiomatisch als „mit mir“ und „bei mir“ wiedergegeben.
