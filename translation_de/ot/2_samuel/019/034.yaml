  terminology: „König“, „Barsillai“, „hinüberziehen“ und „für dich sorgen“ sind sachgerecht. Der Name entspricht der im deutschen Bibelgebrauch geläufigen Form. Für כלכל ist „für dich sorgen“ eine natürliche und ausreichend umfassende Wiedergabe; eine Fußnote ist nicht erforderlich.
