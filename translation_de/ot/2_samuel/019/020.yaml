base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/020.yaml
  text: And he said to the king[a], “Do not let my lord count me guilty, and do not remember how your servant did wrong on the day my lord the king went out from Jerusalem[b], so that the king should take it to heart.”
translation:
  language: de
  text: 'Und er sagte zum König: »Mein Herr möge mir keine Schuld anrechnen[a] und nicht daran denken, was dein Diener an dem Tag Unrechtes getan hat, als mein Herr, der König, aus Jerusalem hinauszog. Der König möge es sich nicht zu Herzen nehmen.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Mein Herr möge mir keine Verfehlung zurechnen.« Die hebräische Wendung ist in ihrer Form rechtlich-forensisch.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »es auf sein Herz legen«; gemeint ist, etwas ernst zu nehmen oder jemandem nachzutragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲשָׁב לִי עָוֺן
  choice: mir keine Schuld anrechnen
  rationale: Die Wendung bewahrt das forensische Bild des hebräischen »Schuld zurechnen« und klingt zugleich in modernem Deutsch natürlich.
- source_word: תִּזְכֹּר
  choice: daran denken
  rationale: Im Zusammenhang geht es nicht nur um bloßes Erinnern, sondern darum, die frühere Tat weiter im Sinn zu behalten; »daran denken« lässt wie das Hebräische offen, welche Folgen daraus gezogen werden.
- source_word: הֶעֱוָה
  choice: Unrechtes getan hat
  rationale: Dies gibt das schuldhafte, verkehrte Handeln klar und ohne altertümliche Ausdrucksweise wieder.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Hier handelt es sich um die ehrerbietige Selbstbezeichnung eines Untergebenen gegenüber dem König; »Diener« trifft diese höfische Funktion besser als »Sklave«.
- source_word: יָצָא ... מִירוּשָׁלָם
  choice: aus Jerusalem hinauszog
  rationale: Die Formulierung folgt dem räumlichen Bild des Hebräischen und passt zu Davids erzwungenem Weggang aus der Stadt.
- source_word: לָשׂוּם ... אֶל לִבּוֹ
  choice: es sich zu Herzen nehmen
  rationale: Die geläufige deutsche Redewendung entspricht dem hebräischen Bild, etwas auf beziehungsweise ans Herz zu legen, und bezeichnet hier das ernste Beherzigen oder Nachtragen.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die Anrede gilt dem menschlichen König und bewahrt den ehrerbietigen Ton sowie das Possessivpronomen.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die wiederholte königliche Titulatur des Hebräischen wird beibehalten, einschließlich des respektvollen Wechsels zur dritten Person.
theological_decisions:
- issue: Reichweite der Verneinung beim abschließenden Infinitiv לָשׂוּם
  choice: 'als eigenständige verneinte Bitte: »Der König möge es sich nicht zu Herzen nehmen«'
  alternative: 'als Zwecksatz: »sodass der König es sich zu Herzen nähme«'
  rationale: Der Infinitiv hängt sinngemäß von der vorausgehenden verneinten Bitte ab. Eine eigenständige deutsche Bitte macht die mitgemeinte Verneinung verständlich, ohne eine theologische Deutung einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die höfische Selbstbezeichnung »dein Diener«, die Anrede »mein Herr« und die wiederholte Bezeichnung »der König« erhalten den respektvollen Hofton. Der lange hebräische Satz wurde am Schluss geteilt, damit die implizite Verneinung im Deutschen eindeutig und natürlich bleibt.
