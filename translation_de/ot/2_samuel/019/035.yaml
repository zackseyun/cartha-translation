id: 2SA.19.35
reference: 2 Samuel 19:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר בַּרְזִלַּ֖י אֶל הַ/מֶּ֑לֶךְ כַּ/מָּ֗ה יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י כִּי אֶעֱלֶ֥ה אֶת הַ/מֶּ֖לֶךְ יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/035.yaml
  text: Barzillai said to the king[a], “How many are the days of the years of my life, that I should go up with the king to Jerusalem?”
translation:
  language: de
  text: 'Barzillai sagte zum König: »Wie viele Tage meiner Lebensjahre bleiben mir noch, dass ich mit dem König nach Jerusalem hinaufziehen sollte?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Wie viele sind die Tage meiner Lebensjahre, dass ich mit dem König nach Jerusalem hinaufziehen sollte?«'
    reason: Die Fußnote dokumentiert die ungewöhnlich geschichtete und im Deutschen weniger idiomatische Formulierung des Hebräischen.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche Erzählform von אמר wird im modernen deutschen Erzählstil natürlich mit »sagte« wiedergegeben.
- source_word: בַּרְזִלַּי
  choice: Barzillai
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אֶל הַמֶּלֶךְ
  choice: zum König
  rationale: Der hebräische Text nennt den Titel mit Artikel und fügt den Namen David nicht hinzu.
- source_word: כַּמָּה יְמֵי שְׁנֵי חַיַּי
  choice: Wie viele Tage meiner Lebensjahre bleiben mir noch
  rationale: Die Wiedergabe bewahrt die auffällige Verbindung von »Tagen«, »Jahren« und »Leben«, macht aber den im rhetorischen Zusammenhang gemeinten verbleibenden Lebenszeitraum im Deutschen verständlich.
- source_word: כִּי
  choice: dass
  rationale: »Dass« führt hier natürlich die Folgerung der rhetorischen Frage ein, ohne das Verhältnis unnötig genauer festzulegen.
- source_word: אֶעֱלֶה
  choice: ich … hinaufziehen sollte
  rationale: »Hinaufziehen« erhält das für den Weg nach Jerusalem typische Motiv des Aufstiegs; »sollte« gibt die modale Färbung der rhetorischen Frage wieder.
- source_word: אֶת הַמֶּלֶךְ
  choice: mit dem König
  rationale: אֶת bezeichnet hier im Zusammenhang die Begleitung des Königs; eine Wiedergabe als direktes Objekt wäre im Deutschen irreführend.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Verwendet wird die etablierte deutsche Form des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die rhetorische Frage bleibt als Frage erhalten; die ungewöhnliche Verbindung von Tagen, Jahren und Leben wird nicht eingeebnet, jedoch durch »bleiben mir noch« verständlicher formuliert.
