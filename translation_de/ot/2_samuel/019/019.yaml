source:
  edition: WLC
  text: וְ/עָבְרָ֣ה הָ/עֲבָרָ֗ה לַֽ/עֲבִיר֙ אֶת בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/לַ/עֲשׂ֥וֹת הַ/טּ֖וֹב ב/עינ/ו וְ/שִׁמְעִ֣י בֶן גֵּרָ֗א נָפַל֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ בְּ/עָבְר֖/וֹ בַּ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/019.yaml
  text: The ferryboat crossed over to bring the king’s household across and to do what was good in his sight[c][b][a], and Shimei son of Gera fell before the king as he was crossing the Jordan.
translation:
  language: de
  text: Die Fähre[a] setzte über, um den Haushalt des Königs[b] hinüberzubringen und zu tun, was ihm gefiel.[c] Schimi, der Sohn Geras, warf sich vor dem König nieder, als er den Jordan überquerte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Fährboot“; das hebräische Wort bezeichnet hier ein Mittel zur Überquerung des Flusses.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haushalt des Königs“ sind die Menschen seines Hauses beziehungsweise seines Gefolges gemeint, nicht das Palastgebäude.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „das Gute in seinen Augen zu tun“; gemeint ist, das zu tun, was ihm gut und recht erschien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲבָרָה
  choice: die Fähre
  rationale: Das seltene Substantiv bezeichnet hier wohl das Verkehrsmittel zur Flussüberquerung. „Fähre“ ist im Deutschen natürlich und lässt offen, um welchen Bootstyp es sich handelte.
- source_word: וְעָבְרָה
  choice: setzte über
  rationale: Das feminine Qal-Perfekt stimmt mit הָעֲבָרָה überein. Das Präteritum führt die Erzählung natürlich fort; „übersetzen“ ist bei einer Fähre idiomatisch.
- source_word: לַעֲבִיר אֶת בֵּית הַמֶּלֶךְ
  choice: um den Haushalt des Königs hinüberzubringen
  rationale: Der Hifil-Infinitiv bezeichnet das Hinüberbringen. בֵּית הַמֶּלֶךְ meint im Zusammenhang nicht das Palastgebäude, sondern die zum König gehörenden Menschen.
- source_word: וְלַעֲשׂוֹת הַטּוֹב בְּעֵינָיו
  choice: und zu tun, was ihm gefiel
  rationale: Die wörtliche Wendung „das Gute in seinen Augen tun“ ist ein hebräisches Idiom für ein Handeln, das jemandem gut oder recht erscheint. Die gewählte Form ist klar und bewahrt den Bezug auf das Urteil des Königs.
- source_word: נָפַל לִפְנֵי הַמֶּלֶךְ
  choice: warf sich vor dem König nieder
  rationale: Die Wendung beschreibt hier eine demütige, bittende Unterwerfung. „Warf sich … nieder“ gibt die konkrete Bewegung und ihre soziale Bedeutung natürlich wieder.
- source_word: בְּעָבְרוֹ בַּיַּרְדֵּן
  choice: als er den Jordan überquerte
  rationale: Der Infinitiv mit Suffix hat temporale Bedeutung. Das deutsche Pronomen bewahrt die formale Bezugsoffenheit des Hebräischen, wobei im Kontext am ehesten der König gemeint ist.
