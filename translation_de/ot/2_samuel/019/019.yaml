translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fähre“ und „setzte über“ bilden eine natürliche deutsche Verbindung. „Haushalt des Königs“ hält die Bildsprache von בַּיִת fest und wird durch die Fußnote gegen ein gegenständliches Verständnis abgesichert. Der letzte pronominale Bezug bleibt wie im Hebräischen formal offen.
