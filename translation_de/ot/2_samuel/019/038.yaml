base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/038.yaml
  text: Please let your servant return[a], that I may die in my own city, by the grave of my father and my mother. But here is your servant Kimham; let him cross over with my lord the king[b], and do for him what is good in your eyes.
translation:
  language: de
  text: Bitte lass deinen Diener zurückkehren, damit ich in meiner Stadt sterbe, beim Grab meines Vaters und meiner Mutter.[a] Doch hier ist dein Diener Kimham. Lass ihn mit meinem Herrn, dem König, hinüberziehen und tu für ihn, was in deinen Augen gut ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht für „beim Grab“: „mit dem Grab“. Gemeint ist wahrscheinlich, dass Barzillai am Begräbnisort seiner Familie sterben und bestattet werden möchte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „was dir gut erscheint“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשָׁב נָא
  choice: Bitte lass … zurückkehren
  rationale: Das Qal von שׁוּב bezeichnet hier die Rückkehr; נָא verleiht der Bitte einen höflichen, eindringlichen Ton.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Barzillai verwendet den Ausdruck als ehrerbietige Selbstbezeichnung gegenüber dem König; „Diener“ gibt diesen höfischen Gebrauch angemessen wieder.
- source_word: וְאָמֻת
  choice: damit ich … sterben kann
  rationale: Die mit וְ angeschlossene Verbform drückt im Zusammenhang den beabsichtigten Ausgang der erbetenen Rückkehr aus. „Sterben kann“ bezeichnet hier die Möglichkeit, daheim zu sterben, nicht bloß körperliches Vermögen.
- source_word: בְּעִירִי
  choice: in meiner Stadt
  rationale: Die schlichte Wiedergabe bewahrt die Possessivform des Hebräischen, ohne „Heimatstadt“ ausdrücklich in den Text hineinzutragen.
- source_word: עִם קֶבֶר אָבִי וְאִמִּי
  choice: beim Grab meines Vaters und meiner Mutter
  rationale: עִם bedeutet gewöhnlich „mit“, bezeichnet hier im Zusammenhang von Tod und Familiengrab jedoch wahrscheinlich die räumliche Nähe. „Beim Grab“ ist natürliches Deutsch und bewahrt diese Vorstellung.
- source_word: וְהִנֵּה
  choice: Doch hier ist
  rationale: הִנֵּה führt Kimham präsentierend ein; „doch“ macht zugleich den inhaltlichen Gegensatz zwischen Barzillais Rückkehr und Kimhams Mitreise deutlich.
- source_word: כִמְהָם
  choice: Kimham
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren Form transliteriert.
- source_word: יַעֲבֹר עִם
  choice: Er soll … hinüberziehen
  rationale: Das Imperfekt hat hier auffordernden Sinn. „Hinüberziehen“ erhält das Motiv des Überschreitens des Jordan.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meinem Herrn, dem König
  rationale: Die Formulierung wahrt die respektvolle höfische Anrede und macht durch die Apposition den deutschen Satzbau klar.
- source_word: וַעֲשֵׂה לוֹ
  choice: und tu für ihn
  rationale: עשה mit ל bezeichnet hier ein Handeln zugunsten Kimhams; „für ihn“ vermeidet die missverständliche Wiedergabe „tu ihm“.
- source_word: אֵת אֲשֶׁר טוֹב בְּעֵינֶיךָ
  choice: was in deinen Augen gut ist
  rationale: Die Wiedergabe erhält die anschauliche hebräische Wendung und bleibt im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit respektvollem höfischem Ton. Die bildhafte Wendung „in deinen Augen“ und das Motiv des Hinüberziehens bleiben erhalten; erläuterungsbedürftige hebräische Ausdrucksweisen werden knapp in Fußnoten ausgewiesen.
