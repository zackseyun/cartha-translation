  text: וְ/אַבְשָׁלוֹם֙ אֲשֶׁ֣ר מָשַׁ֣חְנוּ עָלֵ֔י/נוּ מֵ֖ת בַּ/מִּלְחָמָ֑ה וְ/עַתָּ֗ה לָ/מָ֥ה אַתֶּ֛ם מַחֲרִשִׁ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/011.yaml
  text: And Absalom[a], whom we anointed over us, died in battle. So now why are you silent about bringing the king back?
translation:
  language: de
  text: Absalom, den wir zum König über uns gesalbt haben, ist im Kampf gestorben. Warum schweigt ihr nun dazu, den König zurückzuholen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den König wieder einzusetzen.'
    reason: „Zurückholen“ kann hier zugleich die Wiederherstellung des Königs in seiner Herrschaft meinen.
lexical_decisions:
- source_word: וְאַבְשָׁלוֹם
  choice: Absalom aber
  rationale: Das Waw führt die Aussage weiter und kann hier im Deutschen natürlich mit einem nachgestellten „aber“ wiedergegeben werden; der leichte Gegensatz zur erhofften Rückkehr Davids bleibt erhalten, ohne überbetont zu werden.
- source_word: אֲשֶׁר מָשַׁחְנוּ עָלֵינוּ
  choice: den wir zum König über uns gesalbt hatten
  rationale: מָשַׁח bezeichnet die Salbung zur königlichen Herrschaft. „Zum König … gesalbt“ bewahrt diesen politisch-religiösen Vorgang und macht die im Deutschen sonst ungewohnte Verbindung mit „über uns“ verständlich.
- source_word: מֵת בַּמִּלְחָמָה
  choice: ist im Kampf gestorben
  rationale: Die abgeschlossene Handlung mit gegenwärtiger Bedeutung wird im Deutschen idiomatisch durch das Perfekt ausgedrückt. „Im Kampf“ gibt die feste hebräische Wendung natürlich wieder.
- source_word: וְעַתָּה לָמָה
  choice: Warum … nun
  rationale: „Nun“ nimmt die Folgerung aus Absaloms Tod auf; die deutsche Frageform macht ein zusätzliches „und“ entbehrlich.
- source_word: אַתֶּם מַחֲרִשִׁים
  choice: schweigt ihr
  rationale: Die Form von חרשׁ bezeichnet hier das Stillschweigen beziehungsweise das Ausbleiben einer entsprechenden Äußerung. Die Wiedergabe vermeidet das stärker deutende „zögert ihr“.
- source_word: לְהָשִׁיב אֶת־הַמֶּלֶךְ
  choice: dazu, den König zurückzuholen
  rationale: Der Hifil von שׁוב bedeutet, jemanden zurückkehren zu lassen beziehungsweise zurückzubringen. „Dazu“ verbindet den Infinitiv im Deutschen natürlich mit „schweigen“.
theological_decisions:
- issue: Bezeichnung von Absaloms Einsetzung durch מָשַׁח
  choice: zum König über uns gesalbt
  alternative: über uns zum König gemacht
  rationale: Obwohl Absaloms Königtum im Erzählzusammenhang umstritten ist, verwendet der hebräische Text das gewöhnliche Verb für königliche Salbung. Die Übersetzung bewahrt diese Aussage, ohne die Rechtmäßigkeit seiner Herrschaft zu bestätigen oder zu bestreiten.
- issue: Bedeutungsumfang von הֵשִׁיב beim König
  choice: den König zurückzuholen
  alternative: den König wieder einzusetzen
  rationale: Der Ausdruck kann sowohl die konkrete Rückkehr Davids als auch seine Wiederherstellung als regierender König einschließen. Der Haupttext bleibt beim räumlich konkreteren Sinn; die politische Nuance wird in der Fußnote sichtbar gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt gut verständlich, während „gesalbt“ die königliche und religiöse Färbung des hebräischen Ausdrucks bewahrt.
