  text: For your servant would only cross the Jordan a little way with the king[a]; why should the king repay me with this reward?
translation:
  language: de
  text: Denn dein Diener würde den König nur ein kurzes Stück über den Jordan begleiten. Warum sollte der König mir diese Belohnung gewähren?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mir diese Vergeltung vergelten“. Im Hebräischen stehen ein Verb und ein stammverwandtes Substantiv nebeneinander; die Formulierung betont den Gedanken der Gegenleistung bzw. Belohnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/מְעַט
  choice: Denn … nur ein kurzes Stück
  rationale: כִּי begründet Barsillais Ablehnung; מְעַט bezeichnet hier idiomatisch die kurze Strecke, auf der er den König begleiten will.
- source_word: יַעֲבֹר
  choice: will … begleiten
  rationale: Das Imperfekt bezeichnet im Kontext Barsillais beabsichtigte, begrenzte Begleitung. Zusammen mit אֶת הַיַּרְדֵּן und אֶת הַמֶּלֶךְ gibt „über den Jordan begleiten“ den Vorgang natürlich wieder.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: In der Anrede an den König ist dies eine konventionelle, demütige Selbstbezeichnung; „Sklave“ würde hier einen nicht hervorgehobenen sozialen Sinn in den Vordergrund rücken.
- source_word: אֶת הַ/יַּרְדֵּן אֶת הַ/מֶּלֶךְ
  choice: den König … über den Jordan begleiten
  rationale: Der Jordan ist das mit עבר verbundene Gewässer; das zweite אֶת bezeichnet die Begleitung des Königs. Die deutsche Wortstellung vermeidet die missverständliche Vorstellung, nur einen Teil des Flusses zu überqueren.
- source_word: וְ/לָמָּה
  choice: Warum sollte
  rationale: Die rhetorische Frage weist die angebotene königliche Vergütung höflich zurück.
- source_word: יִגְמְלֵ/נִי הַ/גְּמוּלָה הַ/זֹּאת
  choice: mich mit einer solchen Belohnung belohnen
  rationale: Die bewusste Wiederholung „Belohnung belohnen“ bildet die hebräische Verbindung aus Verb und stammverwandtem Substantiv ab und bewahrt ihren Nachdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Selbstbezeichnung „dein Diener“ bleibt erhalten; die absichtliche Wortwiederholung am Versende spiegelt die hebräische Klang- und Sinnfigur.
