base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/002.yaml
  text: And it was reported to Joab, “Look, the king is weeping and mourning over Absalom.”
translation:
  language: de
  text: 'Joab erhielt die Nachricht: »Der König weint und trauert um Absalom.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: wurde berichtet
  rationale: Das Hophal von נגד bezeichnet, dass Joab eine Nachricht mitgeteilt wurde. Die unpersönliche Passivform wahrt, dass der Überbringer nicht genannt wird.
- source_word: לְיוֹאָב
  choice: Joab
  rationale: Das deutsche Passiv mit »berichten« bezeichnet den Empfänger hier natürlich ohne die im Hebräischen verwendete Präposition.
- source_word: הִנֵּה
  choice: nicht eigens wiedergegeben
  rationale: Die Aufmerksamkeitspartikel leitet die unmittelbar folgende Meldung ein. Im heutigen Deutschen vermittelt die direkte Rede diese Hervorhebung bereits; »Sieh« oder »Siehe« wäre in diesem Berichtszusammenhang unnatürlich beziehungsweise altertümlich.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Titel wird beibehalten und nicht durch den Namen David ersetzt.
- source_word: בֹּכֶה
  choice: weint
  rationale: Das Partizip beschreibt eine andauernde Handlung. Das deutsche Präsens gibt diesen im Bericht gegenwärtigen Zustand natürlich wieder.
- source_word: וַיִּתְאַבֵּל
  choice: trauert
  rationale: Das Hitpael von אבל bezeichnet Trauer, besonders angesichts eines Todes. Im Zusammenhang wird die Verbform als Bestandteil der Meldung über den gegenwärtigen Zustand des Königs verstanden.
- source_word: עַל אַבְשָׁלֹם
  choice: um Absalom
  rationale: עַל kennzeichnet bei einem Verb des Trauerns die Person, der die Trauer gilt. »Um Absalom trauern« ist die natürliche deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur wahrt den berichtenden Charakter des Hebräischen; die direkte Rede macht die Nachricht unmittelbar, ohne die Aufmerksamkeitspartikel durch ein altertümliches »Siehe« zu überzeichnen.
