translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede und die Wiederholung von »in sein Haus« folgen der hebräischen Struktur; kleinere Ergänzungen wie »doch schon« verdeutlichen den rhetorischen Zusammenhang, ohne den Inhalt festzulegen.
