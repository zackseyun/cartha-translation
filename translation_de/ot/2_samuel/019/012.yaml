base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/012.yaml
  text: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
translation:
  language: de
  text: 'König David sandte zu Zadok und Abjatar, den Priestern, und ließ ihnen sagen: »Sprecht zu den Ältesten von Juda: Warum solltet ihr die Letzten sein, die den König in sein Haus zurückbringen? Denn die Botschaft ganz Israels hat den König in seinem Haus erreicht.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Anliegen / der Vorschlag ganz Israels ist zum König in sein Haus gelangt.« Das hebräische Wort דָּבָר kann hier eine Botschaft, einen Bericht, einen Vorschlag oder ein Anliegen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: König David
  rationale: Die appositionelle hebräische Wortfolge wird im natürlichen Deutschen als Titel mit Namen wiedergegeben.
- source_word: שָׁלַח אֶל ... לֵאמֹר
  choice: sandte zu ... und ließ ihnen sagen
  rationale: Die Formulierung bewahrt die Bedeutung des Sendens zu bestimmten Empfängern und gibt die hebräische Redeeinleitung idiomatisch wieder.
- source_word: צָדוֹק וְאֶבְיָתָר הַכֹּהֲנִים
  choice: Zadok und Abjatar, den Priestern
  rationale: Die Amtsbezeichnung wird als Apposition auf beide Männer bezogen.
- source_word: דַּבְּרוּ אֶל זִקְנֵי יְהוּדָה
  choice: Sprecht zu den Ältesten von Juda
  rationale: Dies bildet die direkte Aufforderung und die politische Leitungsfunktion der Ältesten eng am Hebräischen ab.
- source_word: לָמָּה תִהְיוּ אַחֲרֹנִים
  choice: Warum solltet ihr die Letzten sein
  rationale: Der deutsche Konjunktiv gibt den rhetorisch mahnenden Sinn des hebräischen Imperfekts natürlich wieder.
- source_word: לְהָשִׁיב אֶת הַמֶּלֶךְ
  choice: die den König ... zurückbringen
  rationale: Der Hifil von שוב bezeichnet hier das Veranlassen beziehungsweise Begleiten der Rückkehr Davids.
- source_word: אֶל בֵּיתוֹ
  choice: in sein Haus
  rationale: Haus wahrt die Breite von בַּיִת, das Wohnsitz oder Palast meinen kann, ohne die Bedeutung vorschnell auf Palast festzulegen.
- source_word: וּדְבַר כָּל יִשְׂרָאֵל
  choice: Die Botschaft ganz Israels
  rationale: דָּבָר ist hier weit gefasst und kann Botschaft, Anliegen, Vorschlag oder Bericht bezeichnen. Botschaft ist im Deutschen verständlich; die Fußnote hält die Mehrdeutigkeit offen.
- source_word: בָּא אֶל הַמֶּלֶךְ אֶל בֵּיתוֹ
  choice: ist doch schon zum König in sein Haus gelangt
  rationale: Das Perfekt bezeichnet einen bereits eingetretenen Sachverhalt. Die ungewöhnliche Richtungsform und die Wiederholung von Haus bleiben sichtbar.
