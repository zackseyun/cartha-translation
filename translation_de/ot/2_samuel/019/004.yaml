  text: So the people slipped into the city that day, as people who are ashamed slip away when they flee in battle.
translation:
  language: de
  text: So schlich sich das Volk an jenem Tag in die Stadt, wie sich Menschen davonschleichen, die beschämt aus der Schlacht fliehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְגַּנֵּב / יִתְגַּנֵּב
  choice: schlich sich … / sich … davonschleichen
  rationale: Das reflexiv gebrauchte Verb bezeichnet ein heimliches, unauffälliges Fortbewegen. Die wiederholte Wortwahl im Hebräischen wird durch denselben deutschen Verbstamm bewahrt; „davonschleichen“ passt im Vergleich zum Rückzug aus der Schlacht natürlich.
- source_word: הָעָם
  choice: das Volk / Menschen
  rationale: Beim ersten Vorkommen bezeichnet der Ausdruck Davids Leute als Kollektiv. Im allgemeinen Vergleich klingt „Menschen“ idiomatischer und gibt den generischen Sinn wieder.
- source_word: הַנִּכְלָמִים
  choice: beschämt
  rationale: Das Partizip beschreibt Menschen, die Scham oder Schande empfinden; „beschämt“ bewahrt diesen Zustand knapp und ohne zusätzliche Deutung.
- source_word: בְּנוּסָם בַּמִּלְחָמָה
  choice: wenn sie aus der Schlacht fliehen
  rationale: Die Konstruktion bezeichnet ihr Fliehen im Kampfgeschehen. „Aus der Schlacht“ macht im Deutschen die Richtung des Rückzugs deutlich, ohne den Grund der Flucht zu ergänzen.
