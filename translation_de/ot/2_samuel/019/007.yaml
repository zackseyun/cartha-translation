  source_fidelity: Die Übersetzung gibt die abhängigen Infinitive am Versanfang angemessen mit „indem du“ wieder und wahrt den kontrastierenden Parallelismus von lieben und hassen. „deutlich gezeigt“ trifft הִגַּדְתָּ im kontextuellen Sinn einer durch Davids Verhalten offenbarten Haltung. Die idiomatische Aussage, dass Heerführer und Diener für David nichts zählen, ist sachgerecht. Der kontrafaktische Vorwurf bezüglich Abschalom wird klar als solcher formuliert, und „recht in deinen Augen“ erhält die hebräische Bildlichkeit.
  naturalness: Modernes, flüssiges und zugleich würdiges Standarddeutsch. Die syntaktische Anbindung mit „indem“ ist aufgrund des vom Kontext abhängigen hebräischen Infinitivs besonders passend. „Heerführer und Diener“ sowie die Schlussformulierung sind im Kontext gut verständlich.
  terminology: „Heerführer“ ist im militärisch-politischen Kontext für שָׂרִים vertretbar; „Diener“ gibt עֲבָדִים ohne ungerechtfertigte Engführung wieder. Der Name „Abschalom“ entspricht der üblichen deutschen biblischen Schreibung. Die Fußnoten erläutern die idiomatische und die kontrafaktische Lesemöglichkeit angemessen.
