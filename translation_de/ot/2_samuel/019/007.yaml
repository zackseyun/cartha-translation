source:
  edition: WLC
  text: לְ/אַֽהֲבָה֙ אֶת שֹׂ֣נְאֶ֔י/ךָ וְ/לִ/שְׂנֹ֖א אֶת אֹהֲבֶ֑י/ךָ כִּ֣י הִגַּ֣דְתָּ הַ/יּ֗וֹם כִּ֣י אֵ֤ין לְ/ךָ֙ שָׂרִ֣ים וַ/עֲבָדִ֔ים כִּ֣י יָדַ֣עְתִּי הַ/יּ֗וֹם כִּ֠י לא אַבְשָׁל֥וֹם חַי֙ וְ/כֻלָּ֤/נוּ הַ/יּוֹם֙ מֵתִ֔ים כִּי אָ֖ז יָשָׁ֥ר בְּ/עֵינֶֽי/ךָ־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/007.yaml
  text: to love those who hate you and to hate those who love you[a]. For you have made it clear today that commanders and servants mean nothing to you; for I know today that if Absalom were alive and all of us were dead today[b], then it would be right in your eyes.
translation:
  language: de
  text: 'indem du die liebst, die dich hassen, und die hasst, die dich lieben. Denn heute hast du deutlich gezeigt, dass dir Heerführer und Diener nichts bedeuten[a]. Heute weiß ich nämlich: Wenn Abschalom noch lebte und wir alle heute tot wären[b], dann wäre es recht in deinen Augen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dass du heute erklärt hast, es gebe für dich keine Heerführer und Diener“. Gemeint ist, dass sie in deinen Augen nichts zählen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wenn doch Abschalom noch lebte und wir alle heute tot wären.“ Joab erhebt einen scharfen kontrafaktischen Vorwurf; er gibt keine wörtliche Äußerung Davids wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְאַהֲבָה
  choice: indem du … liebst
  rationale: Der Infinitiv mit לְ setzt den vorausgehenden Vorwurf syntaktisch fort. „Indem du“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: שֹׂנְאֶיךָ
  choice: die dich hassen
  rationale: Das substantivierte Partizip behält so seine verbale Kraft und wird nicht vorschnell als „Feinde“ gedeutet.
- source_word: וְלִשְׂנֹא
  choice: und … hasst
  rationale: Die parallele Formulierung bewahrt den scharfen rhetorischen Gegensatz zum Lieben.
- source_word: אֹהֲבֶיךָ
  choice: die dich lieben
  rationale: Diese Wiedergabe wahrt den unmittelbaren lexikalischen Gegensatz zu „die dich hassen“.
- source_word: הִגַּדְתָּ
  choice: hast du deutlich gezeigt
  rationale: Joab bezieht sich auf das, was Davids Verhalten erkennen ließ, nicht notwendig auf eine ausdrückliche mündliche Erklärung.
- source_word: שָׂרִים
  choice: Heerführer
  rationale: Im militärisch-politischen Zusammenhang sind Davids Befehlshaber gemeint; „Heerführer“ ist klarer als das allgemeinere „Fürsten“.
- source_word: עֲבָדִים
  choice: Diener
  rationale: Der Ausdruck bezeichnet hier Menschen im königlichen Dienst und sollte nicht unnötig auf Sklaverei verengt werden.
- source_word: אֵין לְךָ שָׂרִים וַעֲבָדִים
  choice: dass dir Heerführer und Diener nichts bedeuten
  rationale: Die Formulierung bezeichnet im Zusammenhang nicht ihre Nichtexistenz, sondern Joabs Vorwurf, David achte sie für nichts.
- source_word: יָדַעְתִּי
  choice: Heute weiß ich nämlich
  rationale: 'Das Perfekt hat hier gegenwärtige Aussagekraft: Aus Davids Verhalten zieht Joab an diesem Tag seine Schlussfolgerung.'
- source_word: לֹא אַבְשָׁלוֹם חַי וְכֻלָּנוּ הַיּוֹם מֵתִים
  choice: Wenn Abschalom noch lebte und wir alle heute tot wären
  rationale: Der Zusammenhang verlangt eine zugespitzte kontrafaktische Anschuldigung. Der deutsche Konditionalsatz macht diese Funktion verständlich, ohne sie als tatsächliche Aussage Davids auszugeben.
- source_word: יָשָׁר בְּעֵינֶיךָ
  choice: dann wäre es recht in deinen Augen
  rationale: Die bildhafte hebräische Wendung und ihr moralischer Beiklang bleiben erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Versanfang bleibt durch „indem“ syntaktisch an den vorausgehenden Zusammenhang gebunden. Die direkte, anklagende Schärfe von Joabs Rede sowie die hebräische Wendung „recht in deinen Augen“ wurden bewahrt.
