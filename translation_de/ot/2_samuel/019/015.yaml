  text: And he swayed the heart of every man of Judah as one man, and they sent word to the king, “Return, you and all your servants.”
translation:
  language: de
  text: 'Er gewann das Herz aller Männer Judas, sodass sie wie ein einziger Mann zusammenstanden. Da ließen sie dem König ausrichten: »Kehre zurück, du und alle deine Diener!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּט אֶת־לְבַב
  choice: Er gewann die Herzen
  rationale: Das Verb נטה bedeutet wörtlich „neigen“ oder „hinwenden“; im Zusammenhang bezeichnet es, dass er die Männer Judas für sich gewann. „Die Herzen gewinnen“ gibt dieses Bild in natürlichem modernem Deutsch wieder.
- source_word: כָּל־אִישׁ יְהוּדָה כְּאִישׁ אֶחָד
  choice: aller Männer Judas wie das Herz eines einzigen Mannes
  rationale: Die Formulierung bewahrt das Herzbild und bringt zugleich die im Hebräischen betonte Einmütigkeit der Männer Judas zum Ausdruck.
- source_word: וַיִּשְׁלְחוּ אֶל־הַמֶּלֶךְ
  choice: Da ließen sie dem König ausrichten
  rationale: Das hebräische „sie sandten zum König“ meint hier idiomatisch, dass sie ihm eine Botschaft übermitteln ließen.
- source_word: שׁוּב
  choice: Kehre zurück
  rationale: Der Imperativ wird direkt und würdevoll wiedergegeben.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: „Diener“ bewahrt die politische und höfische Bedeutung des hebräischen עבד, ohne sie enger als „Beamte“ oder „Soldaten“ festzulegen.
