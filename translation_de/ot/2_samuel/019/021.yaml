base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/021.yaml
  text: For your servant knows that I have sinned[a]. And look, I have come today as the first of all the house of Joseph[b] to come down to meet my lord the king.
translation:
  language: de
  text: 'Denn dein Diener weiß, dass ich gesündigt habe. Und sieh: Heute bin ich als Erster aus dem ganzen Haus Josefs[a] herabgekommen, um meinem Herrn, dem König, entgegenzugehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mit dem „Haus Josefs“ sind die von Josef abstammenden Stämme gemeint, besonders die nördlichen Stammesgruppen um Efraim und Manasse. Oder: „als Erster im ganzen Haus Josefs“; die hebräische Wendung kann auch so verstanden werden.'
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet Schimis Begründung für seine Bitte ein und gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: יָדַע עַבְדְּךָ
  choice: dein Diener weiß
  rationale: Der Perfekt bezeichnet hier einen gegenwärtigen Erkenntnisstand; „dein Diener“ wahrt die ehrerbietige höfische Selbstbezeichnung.
- source_word: חָטָאתִי
  choice: ich gesündigt habe
  rationale: Bewahrt das moralisch-religiöse Gewicht des Verbs חטא und formuliert das Eingeständnis vergangenen Fehlverhaltens idiomatisch.
- source_word: וְהִנֵּה
  choice: 'Und sieh:'
  rationale: Erhält die aufmerksamkeitslenkende Funktion in moderner, würdiger Sprache, ohne das altertümliche „siehe“ zu verwenden.
- source_word: רִאשׁוֹן לְכָל בֵּית יוֹסֵף
  choice: als Erster aus dem ganzen Haus Josef
  rationale: Gibt den prädikativen Rang und die Zugehörigkeit zur Gesamtgruppe natürlich wieder; die Präposition לְ lässt in dieser Konstruktion eine alternative Auffassung zu, die in der Anmerkung nicht eigens wiederholt werden muss, da „aus dem ganzen“ sie bereits ausdrückt.
- source_word: לָרֶדֶת
  choice: herabgekommen
  rationale: Bewahrt die topografische Bewegungsrichtung und verbindet den Infinitiv idiomatisch mit dem vorausgehenden Kommen.
- source_word: לִקְרַאת
  choice: entgegenzugehen
  rationale: Bezeichnet eine gezielte Bewegung auf den König zu und ist im Deutschen natürlicher und genauer als ein bloßes „zu treffen“.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meinem Herrn, dem König
  rationale: Bewahrt die ehrerbietige Anrede und macht die appositionelle Beziehung im Deutschen klar.
