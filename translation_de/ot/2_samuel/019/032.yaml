    rationale: Sie macht das Überqueren selbst zum Zweck des Handelns und bildet die im masoretischen Schlussteil bestehende syntaktische Schwierigkeit weniger präzise ab. Besser ist ein Hinweis auf die mögliche Zuordnung der Ortsangabe.
