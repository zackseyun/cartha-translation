  terminology: „Barzillai“, „der Gileaditer“, „Rogelim“ und „Jordan“ sind passend. „Verabschieden“ ist hier eine natürliche kontextuelle Wiedergabe von שלח im Sinn des Geleitgebens bzw. Entlassens.
