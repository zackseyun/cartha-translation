  source_fidelity: 'Die Hauptaussage wird zutreffend wiedergegeben: Barzillai kommt aus Rogelim herab, begleitet den König bei der Jordanüberquerung und nimmt am Jordan Abschied von ihm. Die vorzeitige Wiedergabe von יָרַד als Plusquamperfekt ist im Erzählzusammenhang gut begründbar. Der syntaktisch schwierige hebräische Schluss sollte weiterhin als solcher kenntlich bleiben.'
