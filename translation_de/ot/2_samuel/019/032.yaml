base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/032.yaml
  text: And Barzillai the Gileadite had come down from Rogelim[a], and he crossed the Jordan with the king to send him off at the Jordan.
translation:
  language: de
  text: Barzillai, der Gileaditer, war von Rogelim herabgekommen und begleitete den König über den Jordan, um ihn am Jordan zu verabschieden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Schluss ist syntaktisch schwierig. Die Ortsangabe „am Jordan“ kann enger mit dem Überqueren oder mit dem Verabschieden verbunden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזִלַּי
  choice: Barzillai
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: הַגִּלְעָדִי
  choice: der Gileaditer
  rationale: Das Herkunftsadjektiv bezeichnet Barzillai als Mann aus Gilead; die traditionelle Form ist knapp und im Deutschen verständlich.
- source_word: יָרַד מֵרֹגְלִים
  choice: war von Rogelim herabgekommen
  rationale: Das Qatal steht vor der folgenden Wayyiqtol-Handlung und kann hier vorzeitig wiedergegeben werden. »Herabkommen« wahrt die räumliche Perspektive des hebräischen Verbs.
- source_word: וַיַּעֲבֹר אֶת הַמֶּלֶךְ הַיַּרְדֵּן
  choice: Er begleitete den König über den Jordan
  rationale: עבר bezeichnet das Hinübergehen beziehungsweise Überschreiten. In Verbindung mit אֶת הַמֶּלֶךְ ist eine begleitende Bewegung gemeint; diese deutsche Fassung ist natürlich und bewahrt den Bezug zur Jordanüberquerung.
- source_word: לְשַׁלְּחוֹ
  choice: um ihm … das Geleit zu geben
  rationale: 'Der Infinitiv bezeichnet den Zweck der Begleitung: Barzillai geleitet den König und verabschiedet ihn auf seinem weiteren Weg. Die Formulierung ist im Deutschen idiomatischer als ein wörtliches »ihn zu senden«.'
- source_word: אֶת בַּיַּרְדֵּן
  choice: am Jordan
  rationale: Die abschließende Wendung lokalisiert das Geleit beziehungsweise den Abschied am Jordan. Der schwierige masoretische Wortlaut erlaubt jedoch auch eine engere Verbindung mit der Überquerung.
