source:
  edition: WLC
  text: בֶּן שְׁמֹנִ֣ים שָׁנָה֩ אָנֹכִ֨י הַ/יּ֜וֹם הַ/אֵדַ֣ע בֵּין ט֣וֹב לְ/רָ֗ע אִם יִטְעַ֤ם עַבְדְּ/ךָ֙ אֶת אֲשֶׁ֤ר אֹכַל֙ וְ/אֶת אֲשֶׁ֣ר אֶשְׁתֶּ֔ה אִם אֶשְׁמַ֣ע ע֔וֹד בְּ/ק֖וֹל שָׁרִ֣ים וְ/שָׁר֑וֹת וְ/לָ/מָּה֩ יִֽהְיֶ֨ה עַבְדְּ/ךָ֥ עוֹד֙ לְ/מַשָּׂ֔א אֶל אֲדֹנִ֖/י הַ/מֶּֽלֶךְ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/036.yaml
  text: I am eighty years old today[a]. Can I still distinguish between good and evil? Can your servant taste what I eat and what I drink? Can I still hear the voice of male singers and female singers? Why then should your servant still be a burden to my lord the king?
translation:
  language: de
  text: Ich bin heute achtzig Jahre alt. Kann ich noch zwischen Gut und Böse unterscheiden?[a] Kann dein Diener schmecken, was ich esse und was ich trinke? Kann ich noch die Stimmen der Sänger und Sängerinnen hören? Warum sollte dein Diener meinem Herrn, dem König, da noch zur Last fallen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kann ich noch das Gute vom Schlechten unterscheiden?“ Die hebräische Wendung kann moralisches wie auch praktisches Urteilsvermögen bezeichnen; im Zusammenhang mit dem hohen Alter und den nachlassenden Sinnen ist hier wohl allgemein die Fähigkeit zu unterscheiden gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: Ich bin heute achtzig Jahre alt
  rationale: Die hebräische Altersangabe wird in natürlichem modernem Deutsch wiedergegeben; הַיּוֹם bleibt als „heute“ erhalten.
- source_word: הַאֵדַע בֵּין טוֹב לְרָע
  choice: Kann ich noch zwischen Gut und Böse unterscheiden?
  rationale: ידע בין bezeichnet hier die Fähigkeit zu unterscheiden beziehungsweise zu urteilen. „Gut und Böse“ wahrt die feste hebräische Gegenüberstellung, ohne ihre im Alterskontext mögliche praktische Bedeutung festzulegen.
- source_word: אִם
  choice: Kann …?
  rationale: Das wiederholte אִם leitet im Zusammenhang rhetorische Fragen ein; im Deutschen ist die direkte Frage die natürliche Entsprechung.
- source_word: יִטְעַם
  choice: schmecken
  rationale: Das Verb bezeichnet unmittelbar das Schmecken und verweist hier auf die nachlassende Sinneswahrnehmung.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Es handelt sich um eine höfische Selbstbezeichnung gegenüber dem König; „Diener“ trifft diesen Gebrauch besser als „Sklave“.
- source_word: אֶת אֲשֶׁר אֹכַל וְאֶת אֲשֶׁר אֶשְׁתֶּה
  choice: was ich esse und was ich trinke
  rationale: Die Wiederholung der Relativkonstruktion und der Wechsel von der höfischen Selbstbezeichnung zur ersten Person bleiben erhalten.
- source_word: בְּקוֹל שָׁרִים וְשָׁרוֹת
  choice: die Stimmen der Sänger und Sängerinnen
  rationale: „Stimmen“ gibt קוֹל im Deutschen idiomatisch wieder; die ausdrücklich männliche und weibliche Form des Hebräischen bleibt sichtbar.
- source_word: לְמַשָּׂא
  choice: zur Last fallen
  rationale: Die deutsche Wendung gibt die metaphorische Bedeutung von „eine Last sein“ natürlich wieder.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: meinem Herrn, dem König
  rationale: Die höfische Anrede an den menschlichen König wird bewahrt; die Apposition wird im Deutschen durch Kommas kenntlich gemacht.
theological_decisions:
- issue: Bedeutung von טוֹב לְרָע
  choice: Gut und Böse
  alternative: gut und schlecht / das Gute vom Schlechten
  rationale: Die traditionelle und lexikalisch enge Gegenüberstellung wird im Haupttext erhalten. Die Fußnote weist darauf hin, dass der Kontext auch allgemeines oder praktisches Urteilsvermögen nahelegt, sodass keine ausschließlich moralische Deutung erzwungen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihe rhetorischer Fragen und die höfische Selbstbezeichnung „dein Diener“ wurden bewahrt. „Sänger und Sängerinnen“ bildet die im Hebräischen ausdrücklich genannten Geschlechter natürlich ab.
