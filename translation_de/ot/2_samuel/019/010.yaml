source:
  edition: WLC
  text: וַ/יְהִ֤י כָל הָ/עָם֙ נָד֔וֹן בְּ/כָל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מֶּ֜לֶךְ הִצִּילָ֣/נוּ מִ/כַּ֣ף אֹיְבֵ֗י/נוּ וְ/ה֤וּא מִלְּטָ֨/נוּ֙ מִ/כַּ֣ף פְּלִשְׁתִּ֔ים וְ/עַתָּ֛ה בָּרַ֥ח מִן הָ/אָ֖רֶץ מֵ/עַ֥ל אַבְשָׁלֽוֹם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/010.yaml
  text: And all the people were disputing throughout all the tribes of Israel[a], saying, “The king delivered us from the hand of our enemies, and he rescued us from the hand of the Philistines[c][b], but now he has fled from the land because of Absalom.”
translation:
  language: de
  text: 'Da stritt das ganze Volk in allen Stämmen Israels miteinander[a] und sagte: »Der König hat uns aus der Hand unserer Feinde befreit und uns aus der Hand der Philister gerettet[b]. Nun aber ist er wegen Absalom aus dem Land geflohen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da beriet das ganze Volk in allen Stämmen Israels miteinander« beziehungsweise »Da lag das ganze Volk … im Streit«. Das Hebräische bezeichnet eine verbreitete strittige Auseinandersetzung, nicht nur ein beiläufiges Gespräch.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »aus der Hand unserer Feinde« und »aus der Hand der Philister«. »Hand« steht hier bildhaft für Macht oder Gewalt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »vor Absalom«. Die hebräische Wendung kann das Wegfliehen vor ihm oder die durch ihn verursachte Flucht ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדוֹן
  choice: stritt … miteinander
  rationale: Das Nifal-Partizip bezeichnet hier eine anhaltende, landesweite Auseinandersetzung beziehungsweise strittige Beratung. Die Formulierung ist im Deutschen natürlich und stärker als ein bloßes Gespräch.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: in allen Stämmen Israels
  rationale: Die Wendung beschreibt die Ausbreitung der Auseinandersetzung über sämtliche Stämme Israels.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Die Einleitungsformel führt den Inhalt der gemeinsamen Äußerung ein; der grammatisch singularische Bezug auf das Kollektiv »das ganze Volk« wird im Deutschen gewahrt.
- source_word: הִצִּילָנוּ
  choice: hat uns … befreit
  rationale: Das Verb bezeichnet die Befreiung aus Gefahr oder fremder Gewalt und passt zum politisch-militärischen Zusammenhang.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: aus der Hand unserer Feinde
  rationale: Das hebräische Bild der Hand als Macht- oder Herrschaftsbereich bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: מִלְּטָנוּ
  choice: uns … gerettet
  rationale: Die Wiedergabe unterscheidet das Verb vom vorherigen הִצִּיל, ohne die inhaltliche Nähe beider Verben zu verwischen.
- source_word: מִכַּף פְּלִשְׁתִּים
  choice: aus der Hand der Philister
  rationale: Die parallele hebräische Wendung wird entsprechend parallel wiedergegeben.
- source_word: וְעַתָּה
  choice: Nun aber
  rationale: Die Formulierung macht den sachlichen Gegensatz zwischen den früheren Rettungstaten des Königs und seiner gegenwärtigen Flucht deutlich.
- source_word: בָּרַח
  choice: ist … geflohen
  rationale: Das deutsche Perfekt gibt die abgeschlossene Flucht mit ihrer fortdauernden gegenwärtigen Folge natürlich wieder.
- source_word: מִן הָאָרֶץ
  choice: aus dem Land
  rationale: אֶרֶץ bezeichnet hier das Gebiet beziehungsweise Land Israel, nicht die Erde allgemein.
- source_word: מֵעַל אַבְשָׁלוֹם
  choice: wegen Absalom
  rationale: Nach einem Verb des Fliehens bezeichnet die Präposition idiomatisch das Wegfliehen vor jemandem beziehungsweise den durch ihn verursachten Anlass. »Wegen Absalom« wahrt diese Bedeutungsbreite in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Parallelität der beiden Rettungsaussagen und das verständliche Bild »aus der Hand« bleiben erhalten. Die kollektive Rede des grammatisch singularischen »ganzen Volkes« wird mit »sagte« wiedergegeben.
