  text: וְ/הִנֵּ֛ה כָּל אִ֥ישׁ יִשְׂרָאֵ֖ל בָּאִ֣ים אֶל הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֣וּ אֶל הַ/מֶּ֡לֶךְ מַדּוּעַ֩ גְּנָב֨וּ/ךָ אַחֵ֜י/נוּ אִ֣ישׁ יְהוּדָ֗ה וַ/יַּעֲבִ֨רוּ אֶת הַ/מֶּ֤לֶךְ וְ/אֶת בֵּית/וֹ֙ אֶת הַ/יַּרְדֵּ֔ן וְ/כָל אַנְשֵׁ֥י דָוִ֖ד עִמּֽ/וֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/042.yaml
  text: And behold[a], all the men of Israel came to the king and said to the king, “Why have our brothers, the men of Judah, stolen you away and brought the king and his household across the Jordan[b], and all David’s men with him?”
translation:
  language: de
  text: 'Und siehe, alle Männer Israels[b] kamen zum König und sagten zu ihm: »Warum haben unsere Brüder, die Männer von Juda, dich weggenommen[a] und den König und seinen Haushalt über den Jordan gebracht und alle Männer Davids mit ihm?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann das hebräische Verb auch mit »gestohlen« wiedergegeben werden. Gemeint ist der Vorwurf, Juda habe den König ohne Beteiligung der übrigen Israeliten für sich beansprucht.
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische spricht kollektiv von »allen Männern Israels« und den »Männern von Juda«; gemeint sind die hier auftretenden Gruppen beziehungsweise ihre Vertreter.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt die aufmerksamkeitslenkende, vergegenwärtigende Funktion von הִנֵּה und den lebendigen Übergang der Erzählung.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: alle Männer Israels
  rationale: אִישׁ steht formal im Singular, bezeichnet hier aber kollektiv die Männer beziehungsweise Vertreter Israels; die maskuline Ausdrucksweise des Hebräischen bleibt sichtbar.
- source_word: בָּאִים
  choice: kamen
  rationale: Das Partizip wird im deutschen Erzählzusammenhang natürlich als Präteritum wiedergegeben.
- source_word: גְּנָבוּךָ
  choice: dich weggenommen
  rationale: 'Das Verb bedeutet gewöhnlich »stehlen«, wird hier aber metaphorisch und politisch gebraucht: Juda hat den König ohne Beteiligung der übrigen Israeliten für sich beansprucht. »Weggenommen« erhält den Vorwurf, ohne eine wörtliche Entführung nahezulegen.'
- source_word: אַחֵינוּ אִישׁ יְהוּדָה
  choice: unsere Brüder, die Männer von Juda
  rationale: Bewahrt die familiäre Sprache innerhalb Israels und gibt den kollektiv gebrauchten Singular אִישׁ idiomatisch wieder.
- source_word: וַיַּעֲבִרוּ
  choice: über den Jordan gebracht
  rationale: Gibt den kausativen Hifil-Stamm von עבר als »hinüberbringen« wieder.
- source_word: בֵּיתוֹ
  choice: sein Haus
  rationale: »Haus« bewahrt die Breite von בַּיִת, das hier den königlichen Haushalt beziehungsweise das Gefolge bezeichnen kann, ohne es unnötig auf die Kernfamilie einzuengen.
- source_word: וְכָל אַנְשֵׁי דָוִד עִמּוֹ
  choice: dazu alle Männer Davids, die bei ihm waren
  rationale: Bezieht Davids Männer natürlich in den Vorgang des Übersetzens ein und gibt עִמּוֹ ausdrücklich wieder; »dazu« wahrt den nachgetragenen Charakter der hebräischen Formulierung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Und siehe« erhält bewusst die erzählerische Hervorhebung des Hebräischen. Die direkte Rede bleibt anklagend, ohne den metaphorischen Vorwurf als tatsächliche Entführung misszuverstehen.
