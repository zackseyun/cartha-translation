  text: וַ/יָּ֣שָׁב הַ/מֶּ֔לֶךְ וַ/יָּבֹ֖א עַד הַ/יַּרְדֵּ֑ן וִ/יהוּדָ֞ה בָּ֣א הַ/גִּלְגָּ֗לָ/ה לָ/לֶ֨כֶת֙ לִ/קְרַ֣את הַ/מֶּ֔לֶךְ לְ/הַעֲבִ֥יר אֶת הַ/מֶּ֖לֶךְ אֶת הַ/יַּרְדֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/016.yaml
  text: Then the king returned and came as far as the Jordan[a], and Judah came to Gilgal to go to meet the king, to bring the king across the Jordan.
translation:
  language: de
  text: Da kehrte der König zurück und kam bis an den Jordan. Juda[a] war nach Gilgal gekommen, um dem König entgegenzugehen und den König über den Jordan zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Männer von Juda. Im Hebräischen steht »Juda« kollektiv für den Stamm beziehungsweise seine Angehörigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte zurück
  rationale: Das Qal wayyiqtol von שוב bezeichnet in der fortlaufenden Erzählung Davids Rückkehr nach seiner Flucht.
- source_word: וַיָּבֹא עַד הַיַּרְדֵּן
  choice: kam bis an den Jordan
  rationale: בוא mit עַד bezeichnet die Bewegung bis zu einem Ort oder einer Grenze, ohne hier bereits die Überquerung auszudrücken.
- source_word: וִיהוּדָה
  choice: Juda
  rationale: Der Eigenname steht kollektiv für den Stamm beziehungsweise seine Angehörigen. Die knappe Form des Hebräischen bleibt im Haupttext erhalten.
- source_word: בָּא
  choice: war … gekommen
  rationale: 'Das Qatal nach der vorausgehenden Wayyiqtol-Folge lässt sich als Hintergrundhandlung verstehen: Juda war bereits nach Gilgal gekommen, um dem König entgegenzugehen.'
- source_word: הַגִּלְגָּלָה
  choice: nach Gilgal
  rationale: Das lokale He bezeichnet eine Bewegung auf Gilgal zu; im Deutschen ist »nach Gilgal« die natürliche Wiedergabe.
- source_word: לָלֶכֶת לִקְרַאת
  choice: um … entgegenzugehen
  rationale: Die Infinitivverbindung drückt den Zweck des Kommens aus und wird idiomatisch mit »entgegengehen« wiedergegeben.
- source_word: לְהַעֲבִיר אֶת הַמֶּלֶךְ אֶת הַיַּרְדֵּן
  choice: um den König über den Jordan zu bringen
  rationale: 'Der Hifil von עבר hat kausative Bedeutung: Juda sollte dafür sorgen, dass der König den Jordan überquerte. Eine bestimmte Beförderungsart wird nicht vorausgesetzt.'
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Wiederholung von »der König« folgt der betonten Ausdrucksweise des hebräischen Textes; »war … gekommen« kennzeichnet Juda als Hintergrundhandlung.
