base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/009.yaml
  text: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
translation:
  language: de
  text: 'Da stand der König auf und setzte sich im Tor. Dem ganzen Volk wurde berichtet: »Seht, der König sitzt im Tor.« Da kam das ganze Volk vor den König. Israel aber[b] war geflohen, jeder Mann zu seinem Zelt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »jeder Mann zu seinen Zelten«; eine feste Wendung für die Rückkehr an den eigenen Wohnort oder in das jeweilige Stammesgebiet.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »Und Israel floh«. Die hebräische Konjunktion kann schlicht mit »und« wiedergegeben werden; »aber« verdeutlicht hier den Zusammenhangskontrast.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Da stand der König auf
  rationale: Das Qal-Wayyiqtol von קום führt die Erzählung mit dem nächsten Geschehen fort. »Stand … auf« ist im modernen Deutschen natürlich und gibt die Handlung genau wieder.
- source_word: וַיֵּשֶׁב בַּשָּׁעַר
  choice: und setzte sich ins Tor
  rationale: ישׁב bezeichnet hier das Einnehmen eines öffentlichen Sitzplatzes. »Ins Tor« wahrt die hebräische Präposition und verweist auf den Torbereich als öffentlichen Versammlungs- und Amtsort.
- source_word: הִגִּידוּ לֵאמֹר
  choice: Dem ganzen Volk wurde berichtet
  rationale: Die nicht näher bestimmte Mehrzahl des Verbs lässt sich im Deutschen natürlich unpersönlich wiedergeben. Die eigene deutsche Zeichensetzung macht ein zusätzliches »mit den Worten« entbehrlich.
- source_word: הִנֵּה
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel הִנֵּה lenkt den Blick auf die gegenwärtige, sichtbare Lage. »Seht« ist gegenwärtig, würdig und weniger altertümlich als »Siehe«.
- source_word: יוֹשֵׁב
  choice: sitzt
  rationale: Das Partizip beschreibt den gegenwärtigen Zustand des Königs. Das deutsche Präsens gibt diesen fortdauernden Aspekt idiomatisch wieder.
- source_word: וַיָּבֹא כָל הָעָם לִפְנֵי הַמֶּלֶךְ
  choice: Da kam das ganze Volk vor den König
  rationale: בוא mit לפני bedeutet hier, in die Gegenwart des Königs zu kommen. »Vor den König« bewahrt die räumliche und öffentliche Szene, ohne ein bestimmtes Zeremoniell vorauszusetzen.
- source_word: וְיִשְׂרָאֵל נָס
  choice: Israel aber war geflohen
  rationale: Das Qatal beschreibt gegenüber der unmittelbaren Handlung passend einen bereits eingetretenen Hintergrundzustand. »Aber« verdeutlicht den Zusammenhangskontrast, während eine Fußnote die schlichtere Wiedergabe der Konjunktion offenhält.
- source_word: אִישׁ לְאֹהָלָיו
  choice: jeder Mann zu seinem Zelt
  rationale: Die ausdrücklich maskuline distributive Wendung und ihr Zeltbild bleiben erhalten. Der kulturelle Sinn des idiomatischen Ausdrucks wird in einer Fußnote erläutert.
theological_decisions:
- issue: Maskuline distributive Wendung אִישׁ
  choice: jeder Mann
  alternative: jeder; alle
  rationale: Die Übersetzung bewahrt die ausdrücklich maskuline Singularform des Hebräischen, statt sie stillschweigend zu neutralisieren. Gemeint ist die einzelweise Zerstreuung der israelitischen Männer.
- issue: Verhältnis von וְיִשְׂרָאֵל נָס zum vorausgehenden Satz
  choice: Israel aber war geflohen
  alternative: Und Israel floh
  rationale: Die gewählte Fassung macht den zeitlichen Hintergrund und den sachlichen Kontrast verständlich, ohne die formal mögliche einfachere Anschlusslesart zu verbergen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Der öffentliche Torbereich bleibt wörtlich als »Tor« bezeichnet. Die direkte Rede ist knapp und gegenwärtig formuliert; idiomatische sowie grammatisch mehrdeutige Stellen werden nicht im Haupttext übererklärt, sondern durch Fußnoten transparent gemacht.
