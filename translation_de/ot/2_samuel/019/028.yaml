base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/028.yaml
  text: He slandered your servant to my lord the king, but my lord the king is like the angel of God; so do what is good in your eyes.
translation:
  language: de
  text: Er hat deinen Diener bei meinem Herrn, dem König, verleumdet. Mein Herr, der König, ist wie ein Engel Gottes; tu, was in deinen Augen gut ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְרַגֵּל
  choice: Er hat … verleumdet
  rationale: Das Verb רגל bezeichnet hier ein verleumderisches Anschwärzen beziehungsweise eine falsche Beschuldigung; „verleumdet“ gibt den Sinn im Deutschen knapp und natürlich wieder.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: wie ein Engel Gottes
  rationale: Die formale Wendung bewahrt das Bild des hebräischen Textes, ohne es als bloßen Vergleich mit einem menschlichen Boten umzudeuten.
- source_word: וַעֲשֵׂה הַטּוֹב בְּעֵינֶיךָ
  choice: Darum tu, was in deinen Augen gut ist
  rationale: Die idiomatische Formulierung „in deinen Augen“ wird bewahrt; „Darum“ bringt den folgernden Anschluss des waw im Kontext natürlich zum Ausdruck.
theological_decisions:
- issue: Bezeichnung מַלְאַךְ הָאֱלֹהִים
  choice: Engel Gottes
  alternative: Bote Gottes
  rationale: „Engel Gottes“ entspricht der üblichen Bedeutung und bewahrt die mögliche übermenschliche Konnotation; der Kontext beschreibt die Urteilskraft des Königs, ohne die Identität des Engels näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Selbstbezeichnung „dein Diener“ und die wiederholte Anrede „mein Herr, der König“ bleiben erhalten; die drei kurzen Sätze sorgen für natürliche Lesbarkeit.
