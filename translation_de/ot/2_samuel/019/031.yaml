  terminology: „Mefi-Boschet“ ist eine etablierte deutsche Namensform. „König“ und „mein Herr, der König“ geben Titel und höfische Anrede angemessen wieder. „Wohlbehalten“ trifft בְּשָׁלוֹם im Sinn einer sicheren, unversehrten Heimkehr; die Fußnote bewahrt die wörtlichere Alternative.
