  source_fidelity: 'Der Text gibt die hebräische Aussage zuverlässig wieder: Mefi-Boschet spricht zum König, räumt dem nicht genannten Gegenspieler zugestehend den gesamten Besitz ein und begründet dies mit der wohlbehaltenen Rückkehr des Königs in sein Haus. „Nachdem“ wahrt den zeitlichen Grundwert von אַחֲרֵי אֲשֶׁר; die im Kontext mitschwingende Begründung bleibt verständlich, ohne den Ausdruck einseitig umzudeuten.'
