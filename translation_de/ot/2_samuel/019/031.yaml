  text: וַ/יֹּ֤אמֶר מְפִיבֹ֨שֶׁת֙ אֶל הַ/מֶּ֔לֶךְ גַּ֥ם אֶת הַ/כֹּ֖ל יִקָּ֑ח אַ֠חֲרֵי אֲשֶׁר בָּ֞א אֲדֹנִ֥/י הַ/מֶּ֛לֶך בְּ/שָׁל֖וֹם אֶל בֵּיתֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/031.yaml
  text: Mephibosheth said to the king[a], “Let him even take it all, since my lord the king has come safely to his own house.”
translation:
  language: de
  text: 'Mefi-Boschet sagte zum König: „Er soll sogar alles nehmen, nachdem mein Herr, der König, wohlbehalten[a] in sein Haus zurückgekehrt ist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in Frieden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche hebräische Erzählform mit אמר wird im modernen deutschen Erzählstil natürlich mit „sagte“ wiedergegeben.
- source_word: מְפִיבֹשֶׁת
  choice: Mefi-Boschet
  rationale: Die Namensform folgt einer im Deutschen etablierten Transliteration.
- source_word: אֶל הַמֶּלֶךְ
  choice: zum König
  rationale: Der hebräische Text nennt den Titel mit Artikel und nicht den Eigennamen David.
- source_word: גַּם אֶת הַכֹּל יִקָּח
  choice: Er soll sogar alles nehmen
  rationale: Der Imperfekt hat hier auffordernd-zugestehende Kraft; „soll … nehmen“ gibt diese freiwillige Abtretung wieder. גַּם betont zusammen mit הַכֹּל die Gesamtheit.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: nachdem
  rationale: „Nachdem“ bewahrt den vorrangig zeitlichen Sinn der Wendung; im Zusammenhang schwingt zugleich eine Begründung für Mefi-Boschets Verzicht mit.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr, der König
  rationale: Die höfische Anrede bleibt erhalten und klingt im Deutschen natürlich und würdevoll.
- source_word: בְּשָׁלוֹם
  choice: wohlbehalten
  rationale: Die Wendung bezeichnet hier die sichere, unversehrte Heimkehr des Königs. Die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: בָּא ... אֶל בֵּיתוֹ
  choice: in sein Haus zurückgekehrt ist
  rationale: „Zurückgekehrt“ macht die im Kontext gemeinte Rückkehr des Königs deutlich; „in sein Haus“ bewahrt das konkrete hebräische Bild.
theological_decisions: []
