  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede klingt bestimmt und lässt die erkennbare Ungeduld des Königs hervortreten. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
