base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/030.yaml
  text: 'Then the king said to him[b][a], “Why do you keep speaking of your affairs? I have decided: you and Ziba shall divide the land.”'
translation:
  language: de
  text: 'Da sagte der König zu ihm: »Warum redest du noch weiter über deine Angelegenheit? Ich habe entschieden[b]: du und Ziba sollt den Landbesitz[a] unter euch aufteilen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Feld«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: »Ich habe gesagt« beziehungsweise »Ich sagte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... הַמֶּלֶךְ
  choice: Da sagte der König
  rationale: Das Narrativ-Waw führt die Handlung weiter; »Da« gibt die zeitliche Folge im modernen deutschen Erzählstil natürlich wieder.
- source_word: לָמָּה תְּדַבֵּר עוֹד דְּבָרֶיךָ
  choice: Warum redest du noch weiter über deine Angelegenheit?
  rationale: עוֹד bezeichnet weiteres beziehungsweise fortgesetztes Reden; דְּבָרֶיךָ kann »deine Worte«, »deine Angelegenheiten« oder kontextuell »deinen Fall« bedeuten. Der Singular »deine Angelegenheit« bezeichnet hier natürlich den vorgebrachten Streitfall, ohne ihn unnötig zu verrechtlichen.
- source_word: אָמַרְתִּי
  choice: Ich habe entschieden
  rationale: Wörtlich bedeutet die Form »ich habe gesagt/ich sagte«; im Kontext vollzieht der König mit seinem Ausspruch jedoch eine verbindliche Entscheidung. Eine Fußnote bewahrt die formale Alternative.
- source_word: אַתָּה וְצִיבָא תַּחְלְקוּ
  choice: Du und Ziba sollt ... unter euch aufteilen
  rationale: Der Imperfekt hat hier den verpflichtenden Charakter eines königlichen Urteils. »Sollt« gibt diese Autorität idiomatisch wieder; »unter euch« verdeutlicht das distributive Teilen, ohne festzulegen, dass beide exakt gleiche Anteile erhalten.
- source_word: הַשָּׂדֶה
  choice: den Landbesitz
  rationale: שָׂדֶה heißt wörtlich »Feld«, kann in diesem Besitzstreit aber den gesamten Grund- oder Landbesitz bezeichnen. »Landbesitz« passt zum Kontext und wahrt den Sachbezug; die wörtlichere Alternative steht in einer Fußnote.
