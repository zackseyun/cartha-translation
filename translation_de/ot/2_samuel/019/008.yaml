source:
  edition: WLC
  text: וְ/עַתָּה֙ ק֣וּם צֵ֔א וְ/דַבֵּ֖ר עַל לֵ֣ב עֲבָדֶ֑י/ךָ כִּי֩ בַ/יהוָ֨ה נִשְׁבַּ֜עְתִּי כִּי אֵינְ/ךָ֣ יוֹצֵ֗א אִם יָלִ֨ין אִ֤ישׁ אִתְּ/ךָ֙ הַ/לַּ֔יְלָה וְ/רָעָ֧ה לְ/ךָ֣ זֹ֗את מִ/כָּל הָ/רָעָה֙ אֲשֶׁר בָּ֣אָה עָלֶ֔י/ךָ מִ/נְּעֻרֶ֖י/ךָ עַד עָֽתָּה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/008.yaml
  text: Now get up[a], go out, and speak to the heart of your servants, for I swear by Yahweh that if you do not go out, not a man will stay with you tonight, and this will be worse for you than all the trouble that has come upon you from your youth until now.
translation:
  language: de
  text: 'Und nun steh auf, geh hinaus und rede deinen Dienern freundlich und ermutigend zu[a]. Denn ich schwöre bei Jahwe: Wenn du nicht hinausgehst, wird heute Nacht kein Einziger bei dir bleiben. Das wird für dich schlimmer sein als all das Unheil, das von deiner Jugend an bis heute über dich gekommen ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Rede zum Herzen deiner Diener.“ Gemeint ist freundliches, ermutigendes oder gewinnendes Zureden.'
    reason: Die Fußnote macht das bildhafte hebräische Idiom sichtbar, während der Haupttext seine Bedeutung in natürlichem Deutsch wiedergibt.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Wendung markiert einen dringlichen Übergang und knüpft zugleich an Joabs vorausgehende Worte an.
- source_word: קוּם צֵא
  choice: steh auf, geh hinaus
  rationale: Beide Imperative bleiben als konkrete, unmittelbar aufeinanderfolgende Aufforderungen erhalten.
- source_word: וְדַבֵּר עַל־לֵב
  choice: rede … freundlich und ermutigend zu
  rationale: Die hebräische Wendung lautet wörtlich „zum Herzen reden“ und bezeichnet hier ein freundliches, ermutigendes und zugleich gewinnendes Zureden. Eine rein wörtliche Wiedergabe wäre im heutigen Deutsch weniger klar.
- source_word: עֲבָדֶיךָ
  choice: deinen Dienern
  rationale: Im königlich-militärischen Zusammenhang bezeichnet עבד Davids Untergebene und Gefolgsleute; „Diener“ wahrt die damalige Beziehungssprache, ohne primär Sklaverei auszudrücken.
- source_word: כִּי בַיהוָה נִשְׁבַּעְתִּי
  choice: Denn ich schwöre bei Jahwe
  rationale: Die Formulierung gibt die feierliche Schwurerklärung direkt wieder und bewahrt den Gottesnamen יהוה als „Jahwe“.
- source_word: אֵינְךָ יוֹצֵא
  choice: Wenn du nicht hinausgehst
  rationale: Die verneinte Partizipialkonstruktion bezeichnet innerhalb der Schwurandrohung die Bedingung; im Deutschen ist ein Konditionalsatz die klarste Entsprechung.
- source_word: אִם יָלִין אִישׁ אִתְּךָ הַלַּיְלָה
  choice: wird heute Nacht kein Einziger bei dir bleiben
  rationale: Nach Schwurformeln kann אִם eine nachdrücklich verneinte Folge einleiten. לין bedeutet hier, über Nacht zu bleiben; „kein Einziger“ erhält die emphatische Aussage von אִישׁ.
- source_word: וְרָעָה לְךָ זֹאת מִכָּל־הָרָעָה
  choice: Das wird für dich schlimmer sein als all das Unheil
  rationale: Der Vergleich wird im Deutschen ausdrücklich mit „schlimmer … als“ formuliert. רעה meint hier erfahrenes Unglück oder Unheil, nicht moralische Bosheit.
- source_word: מִנְּעֻרֶיךָ עַד עָתָּה
  choice: von deiner Jugend an bis heute
  rationale: Die Formulierung bewahrt den umfassenden zeitlichen Rückblick auf Davids bisheriges Leben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm יהוה. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von רעה
  choice: Unheil
  alternative: Böses
  rationale: Im Zusammenhang geht es um die Notlagen und Katastrophen, die David widerfahren sind. Die Übersetzung vermeidet daher die unbeabsichtigte Aussage, moralisch Böses sei über ihn gekommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Dringlichkeit. Die kurzen Imperative und die feierliche Schwurformel bleiben erhalten; das hebräische Idiom wird verständlich wiedergegeben und in der Fußnote wörtlich dokumentiert.
