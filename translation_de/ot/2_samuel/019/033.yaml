source:
  edition: WLC
  text: וּ/בַרְזִלַּי֙ זָקֵ֣ן מְאֹ֔ד בֶּן שְׁמֹנִ֖ים שָׁנָ֑ה וְ/הֽוּא כִלְכַּ֤ל אֶת הַ/מֶּ֨לֶךְ֙ בְּ/שִׁיבָת֣/וֹ בְ/מַחֲנַ֔יִם כִּֽי אִ֛ישׁ גָּד֥וֹל ה֖וּא מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
translation:
  language: de
  text: Barsillai war sehr alt, achtzig Jahre alt. Er hatte den König versorgt, während dieser sich in Mahanajim aufhielt, denn Barsillai war ein sehr vermögender Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein sehr großer Mann“. Die hebräische Wendung kann einen sehr wohlhabenden, angesehenen oder einflussreichen Mann bezeichnen.'
    reason: Die hebräische Formulierung ist weiter als die im Kontext naheliegende Wiedergabe „sehr vermögend“ und lässt auch gesellschaftlichen Rang oder Einfluss anklingen.
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: war sehr alt
  rationale: Die prädikative Wendung wird natürlich und ohne Abschwächung wiedergegeben; מְאֹד verstärkt das Adjektiv.
- source_word: בֶּן שְׁמֹנִים שָׁנָה
  choice: nämlich achtzig Jahre
  rationale: Die hebräische Altersangabe bedeutet idiomatisch, dass Barsillai achtzig Jahre alt war. „Nämlich“ verbindet sie im Deutschen flüssig mit der vorausgehenden Aussage.
- source_word: כִלְכַּל אֶת הַמֶּלֶךְ
  choice: hatte den König versorgt
  rationale: כלכל bezeichnet hier das materielle Unterhalten beziehungsweise Bereitstellen des Lebensnotwendigen. Das Plusquamperfekt macht deutlich, dass diese Unterstützung bereits während Davids Aufenthalt erfolgt war.
- source_word: בְּשִׁיבָתוֹ בְמַחֲנַיִם
  choice: während dieser sich in Mahanajim aufhielt
  rationale: ישב bezeichnet hier den Aufenthalt. „Dieser“ bezieht sich entsprechend dem naheliegenden Bezug des hebräischen Suffixes eindeutig auf den unmittelbar zuvor genannten König.
- source_word: אִישׁ גָּדוֹל הוּא מְאֹד
  choice: Barsillai war ein sehr vermögender Mann
  rationale: Die Wendung lautet formal „ein sehr großer Mann“ und kann Reichtum, Rang oder Einfluss bezeichnen. Der Erzählzusammenhang, insbesondere Barsillais Versorgung des Königs, legt hier beträchtliches Vermögen nahe; die Fußnote bewahrt den weiteren Bedeutungsumfang.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Namens im letzten Satzteil verhindert eine unklare Zuordnung des Pronomens. Der Ortsname wird in der im Deutschen geläufigen Form „Mahanajim“ wiedergegeben.
