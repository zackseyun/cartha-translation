source:
  edition: WLC
  text: וַ/יַּעֲבֹ֧ר כָּל הָ/עָ֛ם אֶת הַ/יַּרְדֵּ֖ן וְ/הַ/מֶּ֣לֶךְ עָבָ֑ר וַ/יִּשַּׁ֨ק הַ/מֶּ֤לֶךְ לְ/בַרְזִלַּי֙ וַ/יְבָ֣רֲכֵ֔/הוּ וַ/יָּ֖שָׁב לִ/מְקֹמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/040.yaml
  text: All the people crossed the Jordan[a], and the king crossed over. Then the king kissed Barzillai and blessed him, and he returned to his own place.
translation:
  language: de
  text: Das ganze Volk überquerte den Jordan, und der König setzte ebenfalls über. Dann küsste der König Barsillai und segnete ihn; und er kehrte an seinen Ort zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Subjekt von „kehrte … zurück“ ist wahrscheinlich Barsillai; im Hebräischen steht jedoch nur „er“.
    reason: Mehrdeutiger Pronomenbezug im Ausgangstext.
lexical_decisions:
- source_word: וַיַּעֲבֹר כָּל הָעָם
  choice: Das ganze Volk überquerte
  rationale: עבר bezeichnet hier das Überqueren des Jordan; כָּל הָעָם wird umfassend als „das ganze Volk“ wiedergegeben und nicht auf Soldaten verengt.
- source_word: אֶת הַיַּרְדֵּן
  choice: den Jordan
  rationale: Die im Deutschen übliche Bezeichnung des Flusses ist ohne den Zusatz „Fluss“ eindeutig und natürlich.
- source_word: וְהַמֶּלֶךְ עָבָר
  choice: und der König setzte ebenfalls über
  rationale: „übersetzen“ gibt die Flussüberquerung treffend wieder; „ebenfalls“ macht die erneute Verwendung von עבר idiomatisch verständlich, ohne neue Sachinformation hinzuzufügen.
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְבַרְזִלַּי
  choice: Dann küsste der König Barsillai
  rationale: נשק bedeutet hier „küssen“ als Geste des Abschieds und der Zuneigung. Der Personenname folgt einer gebräuchlichen deutschen Transkription.
- source_word: וַיְבָרֲכֵהוּ
  choice: und segnete ihn
  rationale: Die direkte Wiedergabe mit „segnen“ bewahrt den ausdrücklichen Wortlaut von ברך und reduziert die Handlung nicht auf einen bloßen Abschiedsgruß.
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: und er kehrte an seinen Ort zurück
  rationale: Die Formulierung bewahrt sowohl das ungenannte männliche Subjekt als auch das offene מָקוֹם, ohne dieses vorschnell als „Heimat“ oder „Haus“ festzulegen.
theological_decisions:
- issue: Bezug des Subjekts in וַיָּשָׁב
  choice: Das Pronomen „er“ bleibt im Haupttext ohne ausdrückliche Namensnennung stehen.
  alternative: „Barsillai kehrte an seinen Ort zurück.“
  rationale: Im Zusammenhang ist Barsillai der wahrscheinlichste Bezug, doch der hebräische Text nennt das Subjekt nicht ausdrücklich. Die Übersetzung bewahrt diese grammatische Offenheit und erläutert den wahrscheinlichen Bezug in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. „Setzte … über“ vermeidet eine unbeholfene unmittelbare Wiederholung von „überquerte“, während „an seinen Ort“ die knappe, leicht offene Ausdrucksweise des Hebräischen bewahrt.
