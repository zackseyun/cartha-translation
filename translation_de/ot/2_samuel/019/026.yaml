base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/026.yaml
  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
translation:
  language: de
  text: 'Als er nach Jerusalem kam, um dem König zu begegnen, fragte ihn der König: „Warum bist du nicht mit mir gegangen, Mefiboschet?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Als
  rationale: Die hebräische Erzählungsformel leitet die neue Szene mit einem zeitlichen Nebensatz ein; im modernen Deutschen ist „Als“ natürlich und bewahrt den zeitlichen Zusammenhang.
- source_word: בָא
  choice: er … kam
  rationale: בוא bezeichnet hier das Kommen beziehungsweise Eintreffen in Jerusalem.
- source_word: יְרוּשָׁלַם
  choice: Jerusalem
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: לִקְרַאת
  choice: um … zu begegnen
  rationale: לקראת bezeichnet die Bewegung auf jemanden zu beziehungsweise eine Begegnung; „begegnen“ gibt dies knapp und natürlich wieder.
- source_word: הַמֶּלֶךְ
  choice: dem König / der König
  rationale: Der bestimmte Titel verweist im Zusammenhang auf David; die Wiederholung wird wie im Hebräischen zur Klarheit beibehalten.
- source_word: וַיֹּאמֶר לוֹ
  choice: fragte ihn
  rationale: Wörtlich steht „sagte zu ihm“; da unmittelbar eine Frage folgt, ist „fragte ihn“ im Deutschen die natürliche Wiedergabe der Sprechhandlung.
- source_word: לָמָּה
  choice: Warum
  rationale: Direkte und übliche deutsche Entsprechung des Frageworts.
- source_word: לֹא הָלַכְתָּ עִמִּי
  choice: bist du nicht mit mir gegangen
  rationale: הלך bedeutet grundsätzlich „gehen“. Die Formulierung bewahrt die Bewegungsrichtung des Hebräischen und klingt im Deutschen natürlich.
- source_word: מְפִיבֹשֶׁת
  choice: Mefi-Boschet
  rationale: Quellsprachennahe deutsche Umschrift des hebräischen Personennamens מְפִיבֹשֶׁת; der Bindestrich unterstützt die Lesbarkeit.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfügung ist flüssig, ohne die im Hebräischen ausdrücklich bezeichnete Bewegungsrichtung („gegangen“) zu verschieben. Keine Fußnote nötig, da die wörtliche Bedeutung im Haupttext natürlich wiedergegeben werden kann.
