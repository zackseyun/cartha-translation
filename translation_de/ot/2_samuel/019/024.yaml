  text: And the king said to Shimei[a], “You shall not die.” And the king swore to him.
translation:
  language: de
  text: 'Da sagte der König zu Schimi: „Du sollst nicht sterben.“[a] Und der König schwor ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch sinngemäß: „Du sollst nicht hingerichtet werden.“ Wörtlich heißt es im Hebräischen: „Du sollst nicht sterben.“ Im Zusammenhang kann dies als königliche Zusage verstanden werden, Schimi nicht hinrichten zu lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Wayyiqtol führt die nächste Handlung der Erzählung ein. „Da sagte“ gibt die Abfolge in natürlichem modernem Deutsch wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Ausdruck bezeichnet den aus dem Zusammenhang bekannten König.
- source_word: שִׁמְעִי
  choice: Schimi
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: לֹא תָמוּת
  choice: Du sollst nicht sterben
  rationale: Der verneinte Imperfekt kann hier eine feierliche königliche Zusicherung oder Verfügung ausdrücken. Die Wiedergabe bewahrt den wörtlichen Todesbezug und legt nicht ausdrücklich fest, ob eine Hinrichtung gemeint ist.
- source_word: וַיִּשָּׁבַע
  choice: Und ... schwor
  rationale: Der Nifal von שבע bedeutet „schwören“ beziehungsweise „einen Eid leisten“. „Schwor“ ist knapp und würdevoll.
- source_word: לוֹ
  choice: es ihm
  rationale: „Ihm“ nimmt Schimi als Empfänger des Schwurs auf; „es“ verweist im Deutschen idiomatisch auf die unmittelbar zuvor gegebene Zusicherung, ohne neuen Inhalt hinzuzufügen.
theological_decisions:
- issue: Umfang der königlichen Zusicherung
  choice: Die Formulierung „Du sollst nicht sterben“ bleibt im Haupttext bestehen.
  alternative: „Du sollst nicht hingerichtet werden“
  rationale: Der hebräische Wortlaut nennt das Sterben, während der Kontext eine Begnadigung von der Hinrichtung nahelegt. Die Übersetzung bewahrt diese Spannung, statt die kontextuelle Deutung in den Haupttext einzubauen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die leicht feierliche Wendung „Du sollst nicht sterben“ entspricht dem Charakter einer königlichen Zusicherung; die interpretierende Alternative wird in der Fußnote genannt.
