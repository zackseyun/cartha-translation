  text: וַ/יִּרְגַּ֣ז הַ/מֶּ֗לֶךְ וַ/יַּ֛עַל עַל עֲלִיַּ֥ת הַ/שַּׁ֖עַר וַ/יֵּ֑בְךְּ וְ/כֹ֣ה אָמַ֣ר בְּ/לֶכְתּ֗/וֹ בְּנִ֤/י אַבְשָׁלוֹם֙ בְּנִ֣/י בְנִ֣/י אַבְשָׁל֔וֹם מִֽי יִתֵּ֤ן מוּתִ/י֙ אֲנִ֣י תַחְתֶּ֔י/ךָ אַבְשָׁל֖וֹם בְּנִ֥/י בְנִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/001.yaml
  text: Then the king was deeply shaken[a], and he went up to the chamber over the gate and wept. As he went, he said, “My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son[b], my son!”
translation:
  language: de
  text: 'Da war der König zutiefst erschüttert. Er ging hinauf in den Raum über dem Tor und weinte. Während er ging, sagte er: »Mein Sohn Absalom! Mein Sohn, mein Sohn Absalom! Wäre ich doch an deiner Stelle gestorben, Absalom, mein Sohn, mein Sohn!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְגַּז
  choice: Da erbebte der König tief
  rationale: רגז kann körperliches Zittern ebenso wie heftige innere Erschütterung bezeichnen. »erbebte … tief« bewahrt die körperlich-emotionale Bildhaftigkeit im Trauerzusammenhang.
- source_word: עֲלִיַּת הַשַּׁעַר
  choice: den Raum über dem Tor
  rationale: עֲלִיָּה bezeichnet einen oberen Raum; die Formulierung macht seine Lage im oder über dem Torgebäude in natürlichem Deutsch deutlich.
- source_word: וַיֵּבְךְּ
  choice: und weinte
  rationale: »weinte« gibt בכה präzise und in einem würdigen, gegenwärtigen Register wieder.
- source_word: וְכֹה אָמַר בְּלֶכְתּוֹ
  choice: Während er ging, sagte er
  rationale: Die Übersetzung bewahrt die begleitende Handlung von בְּלֶכְתּוֹ und leitet den Wortlaut der Klage natürlich ein.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Alle Wiederholungen werden beibehalten, weil sie den erregten Rhythmus und die Eindringlichkeit der Totenklage tragen.
- source_word: מִי יִתֵּן
  choice: Wäre ich doch
  rationale: Die hebräische Wunschformel bedeutet wörtlich »Wer gäbe …?«; im Deutschen drückt der irreale Wunschsatz mit »doch« denselben schmerzlichen Wunsch idiomatisch aus.
- source_word: מוּתִי אֲנִי תַחְתֶּיךָ
  choice: an deiner Stelle gestorben
  rationale: תַחְתֶּיךָ bezeichnet hier stellvertretend »anstelle von dir«. Der irreale Vergangenheitswunsch entspricht dem Tod Absaloms, der bereits eingetreten ist.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Namensform wiedergegeben.
