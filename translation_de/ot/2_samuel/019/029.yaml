  to: Denn alle aus dem Haus meines Vaters hatten vor meinem Herrn, dem König, den Tod verdient.[a] Dennoch hast du deinen Diener unter diejenigen aufgenommen, die an deinem Tisch essen. Was für einen Anspruch habe ich also noch,[b] weiterhin zum König zu schreien?
