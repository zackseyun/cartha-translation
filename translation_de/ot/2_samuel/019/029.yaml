  text: כִּי֩ לֹ֨א הָיָ֜ה כָּל בֵּ֣ית אָבִ֗/י כִּ֤י אִם אַנְשֵׁי מָ֨וֶת֙ לַ/אדֹנִ֣/י הַ/מֶּ֔לֶךְ וַ/תָּ֨שֶׁת֙ אֶֽת עַבְדְּ/ךָ֔ בְּ/אֹכְלֵ֖י שֻׁלְחָנֶ֑/ךָ וּ/מַה יֶּשׁ לִ֥/י עוֹד֙ צְדָקָ֔ה וְ/לִ/זְעֹ֥ק ע֖וֹד אֶל הַ/מֶּֽלֶךְ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/029.yaml
  text: For all my father's house were nothing but men deserving death before my lord the king[a], yet you set your servant among those who eat at your table. So what further right do I have[b], that I should cry out any more to the king?
translation:
  language: de
  text: Denn alle aus dem Haus meines Vaters hatten vor meinem Herrn, dem König, den Tod verdient.[a] Dennoch hast du deinen Diener unter diejenigen aufgenommen, die an deinem Tisch essen. Was für einen Anspruch habe ich also noch,[b] weiterhin zum König zu schreien?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Männer des Todes«; gemeint sind Männer, die dem Tod verfallen waren oder die Hinrichtung verdient hatten.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für »Anspruch« kann auch »Gerechtigkeit« bedeuten. Hier bezeichnet es einen berechtigten Anspruch oder ein Recht gegenüber dem König.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא הָיָה ... כִּי אִם
  choice: Denn ... bestand ... aus nichts als
  rationale: Die Konstruktion drückt eine nachdrückliche Beschränkung aus. Die deutsche Formulierung gibt diese Kraft natürlich wieder.
- source_word: כָּל בֵּית אָבִי
  choice: das ganze Haus meines Vaters
  rationale: Die Wendung bezeichnet die gesamte Familie beziehungsweise Dynastie und bewahrt zugleich das hebräische Bild vom »Haus«.
- source_word: אַנְשֵׁי מָוֶת
  choice: Männer, die den Tod verdient hatten
  rationale: Die idiomatische Verbindung bezeichnet hier Menschen, die dem Tod beziehungsweise der Hinrichtung verfallen waren, nicht bereits Verstorbene.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: vor meinem Herrn, dem König
  rationale: Die Präposition beschreibt hier ihre Stellung im Urteil des Königs; »vor« gibt diese relationale beziehungsweise rechtliche Bedeutung wieder.
- source_word: וַתָּשֶׁת
  choice: Trotzdem hast du ... aufgenommen
  rationale: Das Verb bedeutet wörtlich »setzen/stellen«. »Aufgenommen« ist im Zusammenhang der Tischgemeinschaft natürlich; »trotzdem« macht den im einfachen waw liegenden sachlichen Gegensatz deutlich.
- source_word: עַבְדְּךָ
  choice: deinen Diener
  rationale: Es handelt sich um eine höfische Selbstbezeichnung der Unterordnung und nicht notwendig um eine Aussage über den rechtlichen Sklavenstatus.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: unter die ..., die an deinem Tisch essen
  rationale: Die Formulierung bewahrt das soziale Bild der privilegierten Tischgemeinschaft und klingt im Deutschen natürlich.
- source_word: וּמַה יֶּשׁ לִי עוֹד צְדָקָה
  choice: Welchen Rechtsanspruch habe ich da noch
  rationale: צְדָקָה bezeichnet hier im rechtlich-relationalen Zusammenhang einen berechtigten Anspruch, nicht in erster Linie persönliche moralische Gerechtigkeit.
- source_word: וְלִזְעֹק עוֹד אֶל הַמֶּלֶךְ
  choice: weiter an den König zu appellieren
  rationale: זעק bedeutet »aufschreien/um Hilfe rufen« und kann eine dringliche Bitte oder Beschwerde bezeichnen. »Appellieren« vermittelt hier die an den König gerichtete Eingabe idiomatisch.
theological_decisions:
- issue: Bedeutung von צְדָקָה
  choice: Rechtsanspruch
  alternative: Gerechtigkeit
  rationale: Der Kontext handelt von einem möglichen weiteren Anspruch gegenüber dem König. Die Wiedergabe vermeidet, die Aussage auf persönliche Tugend oder zugerechnete Gerechtigkeit umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Anrede und das Bild der königlichen Tischgemeinschaft bleiben erhalten; rechtlich missverständliche hebräische Wendungen werden im Haupttext verständlich und in den Fußnoten transparent wiedergegeben.
