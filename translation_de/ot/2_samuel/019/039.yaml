base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/039.yaml
  text: Then the king said[a], “Let Kimham cross over with me, and I will do for him what seems good in your eyes; and whatever you choose to lay on me, I will do for you.”
translation:
  language: de
  text: 'Da sagte der König: „Kimham soll mit mir hinübergehen. Ich werde für ihn tun, was in deinen Augen gut ist; und was immer du mir auferlegst[a], werde ich für dich tun.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was immer du von mir erbittest“. Der hebräische Ausdruck ist elliptisch; wörtlich etwa: „alles, was du auf mich wählst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Da sagte der König
  rationale: Das narrative Waw führt die Handlung weiter; „Da“ gibt die zeitliche Folge im modernen deutschen Erzählstil natürlich wieder.
- source_word: אִתִּי יַעֲבֹר כִּמְהָם
  choice: Kimham soll mit mir hinübergehen
  rationale: Der Imperfekt ist hier jussivisch gebraucht und drückt die Entscheidung beziehungsweise Einladung des Königs aus. „Hinübergehen“ bewahrt das im Zusammenhang wiederkehrende Bild vom Überschreiten des Jordan.
- source_word: כִּמְהָם
  choice: Kimham
  rationale: Der Personenname wird entsprechend gängiger deutscher Transliteration wiedergegeben.
- source_word: וַאֲנִי אֶעֱשֶׂה לּוֹ
  choice: Ich werde für ihn tun
  rationale: Die breite Bedeutung von עשה bleibt erhalten, ohne die Art der Wohltat näher festzulegen.
- source_word: אֶת הַטּוֹב בְּעֵינֶיךָ
  choice: was in deinen Augen gut ist
  rationale: Die hebräische Wendung bezeichnet, was der Angesprochene für gut oder angemessen hält; die Bildsprache wird im Deutschen verständlich bewahrt.
- source_word: וְכֹל אֲשֶׁר תִּבְחַר עָלַי
  choice: und was immer du mir auferlegst
  rationale: Die elliptische Verbindung von בחר mit עָלַי wird als Übernahme einer Verpflichtung verstanden. „Auferlegst“ bewahrt den Gedanken „auf mich“ und bleibt idiomatisch.
- source_word: אֶעֱשֶׂה לָּךְ
  choice: werde ich für dich tun
  rationale: Die abschließende Zusage wird eng am Hebräischen und zugleich natürlich auf Deutsch formuliert.
