base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/025.yaml
  text: And Mephibosheth son of Saul came down to meet the king[a]. He had not cared for his feet, nor trimmed his mustache, nor washed his clothes[c][b], from the day the king left until the day he came in peace.
translation:
  language: de
  text: Auch Mefi-Boschet, der Sohn Sauls, kam herab, um dem König entgegenzugehen. Er hatte seine Füße nicht gepflegt[a], seinen Schnurrbart nicht gestutzt[b] und seine Kleider nicht gewaschen – von dem Tag an, als der König fortging, bis zu dem Tag, an dem er wohlbehalten ankam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »seine Füße nicht gemacht«. Gemeint ist, dass er die übliche Pflege seiner Füße vernachlässigte; welche Handlung genau gemeint ist, bleibt offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seinen Schnurrbart nicht gepflegt«. Das hebräische Wort bezeichnet die Behaarung im Bereich der Oberlippe, nicht unbedingt den ganzen Bart.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »in Frieden kam«. Möglich ist auch: »in Frieden kam« oder »sicher ankam«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: kam herab
  rationale: Gibt die konkrete Abwärtsbewegung des hebräischen Verbs wieder, ohne die Erzählperspektive unnötig festzulegen.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: um dem König entgegenzugehen
  rationale: Die Wendung bezeichnet eine Bewegung auf jemanden zu, um ihn zu treffen; die deutsche Formulierung bewahrt diesen räumlichen Aspekt.
- source_word: וְלֹא עָשָׂה רַגְלָיו
  choice: Er hatte seine Füße nicht gepflegt
  rationale: Wörtlich steht »seine Füße nicht gemacht«. Da die genaue Pflegehandlung unklar ist, gibt »gepflegt« den Sinn wieder, ohne eine bestimmte Maßnahme hinzuzufügen.
- source_word: וְלֹא עָשָׂה שְׂפָמוֹ
  choice: seinen Schnurrbart nicht gestutzt
  rationale: שָׂפָם bezeichnet den Bereich der Oberlippenbehaarung. »Schnurrbart« ist präziser als »Bart«; »gestutzt« passt zur vernachlässigten Körperpflege im Kontext.
- source_word: וְאֶת בְּגָדָיו לֹא כִבֵּס
  choice: seine Kleider nicht gewaschen
  rationale: Entspricht direkt und natürlich der Bedeutung von כִבֵּס bei Kleidungsstücken.
- source_word: לְמִן הַיּוֹם לֶכֶת הַמֶּלֶךְ
  choice: von dem Tag an, als der König fortging
  rationale: Gibt die Zeitangabe und das unmarkierte Verb הלך in modernem, registerneutralem Deutsch wieder.
- source_word: עַד הַיּוֹם אֲשֶׁר בָּא בְשָׁלוֹם
  choice: bis zu dem Tag, an dem er wohlbehalten zurückkam
  rationale: בְשָׁלוֹם kann hier das sichere, unversehrte Eintreffen ausdrücken. »Zurückkam« ergibt sich aus dem Kontrast zum vorausgehenden Fortgehen, ohne einen Zielort wie »nach Hause« hinzuzufügen.
