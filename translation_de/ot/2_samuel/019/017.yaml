  text: וַ/יְמַהֵ֗ר שִׁמְעִ֤י בֶן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אֲשֶׁ֖ר מִ/בַּֽחוּרִ֑ים וַ/יֵּ֨רֶד֙ עִם אִ֣ישׁ יְהוּדָ֔ה לִ/קְרַ֖את הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/017.yaml
  text: Shimei son of Gera[a], the Benjaminite from Bahurim, hurried and went down with the men of Judah to meet King David.
translation:
  language: de
  text: Schimi, der Sohn Geras, der Benjaminiter aus Bahurim, beeilte sich und zog mit den Männern von Juda[a] hinab, um König David entgegenzugehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit dem Mann von Juda«; die Wendung wird hier kollektiv im Sinn von »mit den Männern von Juda« verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: beeilte sich
  rationale: Das Verb bezeichnet eiliges, dringliches Handeln. »Beeilte sich« ist natürliches modernes Deutsch und bewahrt den erzählerischen Sinn.
- source_word: שִׁמְעִי בֶן גֵּרָא
  choice: Schimi, der Sohn Geras
  rationale: Die Eigennamen werden in ihrer geläufigen deutschen Bibelform wiedergegeben; die hebräische Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: בֶּן הַיְמִינִי
  choice: der Benjaminiter
  rationale: Die Wendung bezeichnet hier am ehesten die Stammeszugehörigkeit und nicht einen weiteren unmittelbaren Vatersnamen.
- source_word: אֲשֶׁר מִבַּחוּרִים
  choice: aus Bahurim
  rationale: Die Relativkonstruktion nennt Schimis Herkunftsort; im Deutschen lässt sich dies knapp und natürlich als Apposition ausdrücken.
- source_word: וַיֵּרֶד
  choice: zog … hinab
  rationale: Die Wiedergabe bewahrt die konkrete topografische Bewegungsrichtung des hebräischen Verbs und klingt im deutschen Erzählstil natürlich.
- source_word: עִם אִישׁ יְהוּדָה
  choice: mit den Männern von Juda
  rationale: Obwohl אִישׁ formal im Singular steht, ist die Wendung im Zusammenhang kollektiv zu verstehen. Der Plural gibt den gemeinten Personenkreis idiomatisch wieder.
- source_word: לִקְרַאת
  choice: um … entgegenzugehen
  rationale: Die Konstruktion bezeichnet eine Bewegung mit dem Ziel einer Begegnung. »Entgegenzugehen« bildet sowohl Bewegung als auch Begegnungsabsicht ab.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: König David
  rationale: Die im Deutschen übliche Verbindung von Herrschertitel und Eigenname bewahrt beide Bestandteile natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. Die topografische Bewegungsangabe »hinab« und die kollektiv verstandene, formal singularische Wendung werden transparent bewahrt.
