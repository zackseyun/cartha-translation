base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/022.yaml
  text: But Abishai son of Zeruiah answered and said[a], “Should Shimei not be put to death for this, because he cursed Yahweh’s anointed?”
translation:
  language: de
  text: 'Doch Abischai, der Sohn Zerujas, antwortete: „Soll Schimi dafür[a] nicht getötet werden, weil er den Gesalbten Jahwes verflucht hat?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deswegen“ beziehungsweise „als Vergeltung dafür“. Die hebräische Wendung fragt, ob Schimis Tat seine Hinrichtung nach sich ziehen soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: antwortete
  rationale: Die feste hebräische Redeeinleitung wird im natürlichen Deutschen knapp mit „antwortete“ wiedergegeben; ein zusätzliches „und sagte“ wäre hier unnötig schwerfällig.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: Abischai, der Sohn Zerujas
  rationale: Die Namen werden in geläufiger deutscher Form wiedergegeben; die familiäre Zuordnung bleibt ausdrücklich erhalten.
- source_word: הֲתַחַת זֹאת
  choice: Soll ... dafür nicht
  rationale: „Dafür“ gibt die idiomatische Frage nach der Folge beziehungsweise Vergeltung für Schimis Tat prägnant wieder.
- source_word: לֹא יוּמַת
  choice: nicht getötet werden
  rationale: Der Hophal von מות bezeichnet ein Veranlassen des Todes und legt hier eine Hinrichtung nahe; die passive Form des Hebräischen bleibt gewahrt.
- source_word: שִׁמְעִי
  choice: Schimi
  rationale: Verwendet die im Deutschen geläufige biblische Namensform.
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion führt hier den Grund für Abischais Forderung an.
- source_word: קִלֵּל
  choice: verflucht hat
  rationale: Das Verb bezeichnet in diesem Zusammenhang Schimis schweren verbalen Fluch gegen David und nimmt die vorausgehende Erzählung auf.
- source_word: מְשִׁיחַ יְהוָה
  choice: den Gesalbten Jahwes
  rationale: Die Konstruktion bezeichnet den von JHWH gesalbten König; „Gesalbter“ bewahrt die amtliche und theologische Bedeutung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im hebräischen Text ausdrücklich stehende Bundesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מְשִׁיחַ in Bezug auf David
  choice: Gesalbter
  alternative: der gesalbte König
  rationale: „Gesalbter“ bewahrt die knappe, amtlich-theologische Bezeichnung des Hebräischen, ohne die Aussage über David weiter auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Redeeinleitung ist gegenüber der hebräischen Doppelverbform idiomatisch gestrafft; die rhetorische Frage und ihre rechtliche Schärfe bleiben erhalten.
