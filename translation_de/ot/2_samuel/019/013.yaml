id: 2SA.19.13
reference: 2 Samuel 19:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַחַ֣/י אַתֶּ֔ם עַצְמִ֥/י וּ/בְשָׂרִ֖/י אַתֶּ֑ם וְ/לָ֧/מָּה תִהְי֛וּ אַחֲרֹנִ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/013.yaml
  text: You are my brothers[a]; you are my own bone and flesh[c][b]. So why should you be the last to bring back the king?
translation:
  language: de
  text: Ihr seid meine Brüder[a], ihr seid mein Gebein und mein Fleisch[b]. Warum solltet ihr also die Letzten sein, die den König zurückholen?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „meine Verwandten“; wörtlich: „meine Brüder“.'
    reason: lexical_alternative
  - marker: b
    text: „Mein Gebein und mein Fleisch“ ist eine hebräische Wendung für enge Blutsverwandtschaft.
    reason: cultural_note
  - marker: c
    text: David bezeichnet sich hier in der dritten Person als „der König“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: meine Brüder
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird bewahrt. Im Zusammenhang spricht David die Ältesten Judas als seine nahen Stammes- und Blutsverwandten an; eine Fußnote erläutert die idiomatische Bedeutung.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: mein Gebein und mein Fleisch
  rationale: Die konkrete hebräische Wendung für enge Blutsverwandtschaft bleibt erhalten. „Gebein“ gibt עֶצֶם in dieser traditionellen, aber weiterhin verständlichen Körpermetaphorik präzise wieder.
- source_word: וְלָמָה
  choice: Warum ... also
  rationale: Das eingeschobene „also“ bringt die folgernde Kraft der Verbindung zum vorherigen Verwandtschaftsargument in natürlichem Deutsch zum Ausdruck.
- source_word: תִּהְיוּ אַחֲרֹנִים
  choice: solltet ihr ... die Letzten sein
  rationale: Die rhetorisch-mahnende Funktion des Imperfekts wird mit „solltet“ wiedergegeben; „die Letzten“ bewahrt den relativen Gedanken, hinter anderen zurückzubleiben.
- source_word: לְהָשִׁיב
  choice: zurückholen
  rationale: Der Hifil von שׁוב bezeichnet hier das Veranlassen der Rückkehr. Mit dem König als Objekt ist „zurückholen“ konkret und idiomatisch.
- source_word: אֶת־הַמֶּלֶךְ
  choice: den König
  rationale: Die dritte Person des hebräischen Textes wird bewahrt, statt sie erklärend in „mich“ umzuwandeln.
theological_decisions:
- issue: Davids Selbstbezeichnung in der dritten Person
  choice: den König
  alternative: mich, den König
  rationale: Die Quellenform und ihre rhetorische Distanz bleiben erhalten, ohne die Identität des Sprechers interpretierend in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend formnaher Wiedergabe. Die rhetorische Frage klingt natürlich; die konkrete Verwandtschaftsmetapher bleibt bewusst stehen und wird erläutert.
