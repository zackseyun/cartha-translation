base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/023.yaml
  text: And David said[a], “What have I to do with you, sons of Zeruiah, that you should be an adversary to me today? Shall any man be put to death in Israel today? For do I not know that today I am king over Israel?”
translation:
  language: de
  text: 'David aber sagte: »Was habe ich mit euch zu schaffen, ihr Söhne Zerujas, dass ihr mir heute zum Widersacher werdet[a]? Soll heute jemand in Israel hingerichtet werden? Weiß ich denn nicht, dass ich heute König über Israel bin?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »zu einem Widersacher«; das hier verwendete Wort שָׂטָן bedeutet in diesem Zusammenhang »Gegner« oder »Widersacher«, nicht den Eigennamen »Satan«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: Was habe ich mit euch zu schaffen
  rationale: Die idiomatische Wendung drückt Distanzierung und scharfe Zurückweisung aus. Die deutsche Formulierung gibt diese Funktion natürlich wieder, ohne das hebräische Idiom hölzern nachzubilden.
- source_word: בְּנֵי צְרוּיָה
  choice: ihr Söhne Zerujas
  rationale: Die konkrete Familienbezeichnung bleibt als direkte Anrede erhalten; das ergänzte »ihr« kennzeichnet die Anrede im Deutschen klar und natürlich.
- source_word: כִּי תִהְיוּ לִי הַיּוֹם לְשָׂטָן
  choice: dass ihr mir heute zu Widersachern werdet
  rationale: שָׂטָן ist hier ein Gattungsbegriff für einen Gegner oder Widersacher, kein Eigenname. »Zu Widersachern werden« bewahrt sowohl die Opposition gegen David als auch die Konstruktion mit היה und לְ.
- source_word: יוּמַת אִישׁ
  choice: Soll heute jemand … getötet werden?
  rationale: Die passive Kausativform bezeichnet das Veranlassen einer Tötung, im Zusammenhang eine Hinrichtung. »Getötet werden« erhält die passive Aussage; »jemand« gibt das generisch gebrauchte אִישׁ im modernen Deutschen natürlich wieder.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: Weiß ich denn nicht
  rationale: Die rhetorische Frage mit Negation bleibt als Frage erhalten; »denn« macht ihren erwarteten bejahenden Sinn im Deutschen hörbar, ohne sie in eine Behauptung umzuwandeln.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: König über Israel
  rationale: »Über« entspricht der Präposition עַל und betont Davids gegenwärtige königliche Herrschaft.
theological_decisions:
- issue: Bedeutung von שָׂטָן
  choice: Gattungsbegriff »Widersacher«
  alternative: Eigenname »Satan«
  rationale: Im historischen Erzählzusammenhang bezeichnet das Wort die menschliche Gegnerschaft der Söhne Zerujas gegen Davids Entscheidung. Der Eigenname »Satan« würde eine spätere dämonologische Bedeutung in den Text eintragen, die der unmittelbare Kontext nicht verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die beiden rhetorischen Fragen bewahren Davids entschiedenen Ton. »Jemand« ist hier idiomatischer als das missverständliche generische »ein Mann«.
