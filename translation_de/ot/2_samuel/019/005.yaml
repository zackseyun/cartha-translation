base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/005.yaml
  text: And the king covered his face[a], and the king cried out with a loud voice, “My son Absalom! Absalom, my son, my son!”
translation:
  language: de
  text: 'Und der König verhüllte sein Gesicht[a], und der König schrie mit lauter Stimme: »Mein Sohn Abschalom! Abschalom, mein Sohn, mein Sohn!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bedeckte sein Gesicht« beziehungsweise »hüllte sein Gesicht ein«. Das hebräische Verb bezeichnet hier das Verhüllen des Gesichts in Trauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאַט
  choice: verhüllte
  rationale: Das Verb bezeichnet hier ein Bedecken oder Einhüllen; »verhüllte« ist im Trauerkontext natürlich und lässt die genaue Art der Handlung offen.
- source_word: פָּנָיו
  choice: sein Gesicht
  rationale: Mit dem direkten Objektmarker ist die konkrete Bedeutung »sein Gesicht« gemeint, nicht die übertragene Bedeutung »seine Gegenwart«.
- source_word: וַיִּזְעַק
  choice: schrie
  rationale: Das Verb bezeichnet einen lauten, eindringlichen Ruf. »Schrie« bewahrt die Intensität, ohne den Ruf ausdrücklich als Wehklage zu deuten.
- source_word: קוֹל גָּדוֹל
  choice: mit lauter Stimme
  rationale: Die hebräische Wendung bedeutet wörtlich etwa »mit großer Stimme«; »mit lauter Stimme« gibt Form und Nachdruck idiomatisch wieder.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die maskuline Singularform mit Suffix der ersten Person bezeichnet Abschalom ausdrücklich als Davids Sohn und trägt die emotionale Wiederholung.
- source_word: אַבְשָׁלוֹם
  choice: Abschalom
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Namensform wird verwendet.
- source_word: Wiederholung von אַבְשָׁלוֹם / בְּנִי
  choice: »Mein Sohn Abschalom! Abschalom, mein Sohn, mein Sohn!«
  rationale: Alle Wiederholungen des Hebräischen bleiben erhalten, da sie die Intensität der Trauer ausdrücken; die Zeichensetzung gestaltet den Klageruf in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parataktische Wiederholung von »der König« wird im Deutschen durch das fortgeführte Subjekt geglättet; Handlung, Nachdruck und sämtliche Worte des Klagerufs bleiben erhalten.
