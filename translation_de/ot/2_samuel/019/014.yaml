source:
  edition: WLC
  text: וְ/לַֽ/עֲמָשָׂא֙ תֹּֽמְר֔וּ הֲ/ל֛וֹא עַצְמִ֥/י וּ/בְשָׂרִ֖/י אָ֑תָּה כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם לֹ֠א שַׂר צָבָ֞א תִּהְיֶ֧ה לְ/פָנַ֛/י כָּל הַ/יָּמִ֖ים תַּ֥חַת יוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/014.yaml
  text: And say to Amasa[a], ‘Are you not my bone and my flesh? May God do so to me, and more also, if you are not commander of the army before me all the days in place of Joab.’
translation:
  language: de
  text: 'Und zu Amasa sollt ihr sagen: »Bist du nicht mein Gebein und mein Fleisch? Gott soll mir dies und noch mehr antun, wenn du nicht an Joabs Stelle allezeit Heerführer vor mir sein wirst!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַעֲמָשָׂא תֹּמְרוּ
  choice: Und zu Amasa sollt ihr sagen
  rationale: Bewahrt die Anweisung in der 2. Person Plural und gibt Präposition und Satzanschluss natürlich wieder.
- source_word: הֲלוֹא
  choice: Bist du nicht
  rationale: Erhält die rhetorische Frage, die Zustimmung erwartet.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: mein Gebein und mein Fleisch
  rationale: Bewahrt das eindringliche hebräische Verwandtschaftsbild, statt es lediglich als »mein Verwandter« auszudeuten.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Gott soll mir dies und noch mehr antun
  rationale: Gibt die feierliche Schwurformel wieder, ohne die im Hebräischen unausgesprochene Strafe näher zu bestimmen.
- source_word: אִם לֹא
  choice: wenn du nicht
  rationale: Erhält im Zusammenhang der Schwurformel die hebräische Bedingungsstruktur; sinngemäß bekräftigt sie die folgende Zusage.
- source_word: שַׂר צָבָא
  choice: Heerführer
  rationale: Bezeichnet klar und knapp den obersten militärischen Befehlshaber.
- source_word: תִּהְיֶה לְפָנַי
  choice: vor mir sein wirst
  rationale: Bewahrt die räumlich formulierte, zugleich dienstliche Beziehung von לְפָנַי, ohne sie vollständig auszudeuten.
- source_word: כָּל הַיָּמִים
  choice: allezeit
  rationale: Gibt die fortdauernde Amtsstellung idiomatisch und würdig wieder; die wörtliche Form wird in der Fußnote genannt.
- source_word: תַּחַת יוֹאָב
  choice: anstelle Joabs
  rationale: תַּחַת bezeichnet hier eindeutig Ersatz beziehungsweise Nachfolge, nicht Unterordnung.
theological_decisions:
- issue: Numerus und Referenz von אֱלֹהִים in der Schwurformel
  choice: Gott
  alternative: Götter
  rationale: Obwohl die Form morphologisch plural ist, bezeichnet אֱלֹהִים in dieser festen israelitischen Schwurformel den einen Gott und wird syntaktisch singularisch gebraucht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Verwandtschaftsformel »mein Gebein und mein Fleisch« sowie die unbestimmte Selbstverfluchung des Schwurs bleiben bewusst erhalten; »allezeit« vermeidet zugleich eine schwerfällige wörtliche Formulierung.
