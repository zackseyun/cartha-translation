  text: וַ/תְּהִ֨י הַ/תְּשֻׁעָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא לְ/אֵ֖בֶל לְ/כָל הָ/עָ֑ם כִּֽי שָׁמַ֣ע הָ/עָ֗ם בַּ/יּ֤וֹם הַ/הוּא֙ לֵ/אמֹ֔ר נֶעֱצַ֥ב הַ/מֶּ֖לֶךְ עַל בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/003.yaml
  text: So the victory on that day was turned into mourning for all the people[a], because on that day the people heard it said[b], “The king is grieved over his son.”
translation:
  language: de
  text: 'So wurde der Sieg an jenem Tag für das ganze Volk zur Trauer[a], denn das Volk hörte an jenem Tag, wie gesagt wurde[b]: »Der König trauert um seinen Sohn.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »So wurde die Rettung an jenem Tag für das ganze Volk zur Trauer.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Das Volk hörte ... sagen.« Die hebräische Wendung leitet eine vernommene Meldung ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשֻׁעָה
  choice: der Sieg
  rationale: Im militärischen Zusammenhang bezeichnet תְּשׁוּעָה den erfolgreichen Ausgang beziehungsweise die im Kampf errungene Rettung. »Sieg« ist hier im Deutschen am natürlichsten; »Rettung« bleibt als sachlich mögliche Alternative in der Fußnote erhalten.
- source_word: וַתְּהִי ... לְאֵבֶל
  choice: wurde ... zur Trauer
  rationale: Die resultative Konstruktion beschreibt den Umschlag des Sieges in öffentliche Trauer. »Wurde ... zur Trauer« bildet diesen Gegensatz natürlich und relativ formnah ab.
- source_word: אֵבֶל
  choice: Trauer
  rationale: אֵבֶל bezeichnet hier die gemeinschaftlich erkennbare Trauer nach einem Todesfall, nicht nur ein inneres Gefühl.
- source_word: הָעָם
  choice: das Volk
  rationale: Obwohl im Kontext besonders Davids kämpfende Gefolgsleute gemeint sind, steht der allgemeine Ausdruck הָעָם. »Das Volk« wahrt diese Breite.
- source_word: כִּי שָׁמַע ... לֵאמֹר
  choice: denn ... hörte ..., wie gesagt wurde
  rationale: Die Verbindung von שׁמע und לאמר führt eine vernommene Meldung ein. Die deutsche Formulierung gibt den berichtenden Sinn idiomatisch wieder, ohne eine bestimmte ungenannte Sprechergruppe einzuführen.
- source_word: נֶעֱצַב
  choice: trauert
  rationale: Der Niphal von עצב bezeichnet hier das schmerzliche Betrübtsein des Königs. Im Zusammenhang mit dem Tod seines Sohnes ist »trauert« natürlich und prägnant.
- source_word: עַל בְּנוֹ
  choice: um seinen Sohn
  rationale: עַל bezeichnet bei עצב den Anlass beziehungsweise Gegenstand der Trauer; »um seinen Sohn trauern« ist die übliche deutsche Verbindung.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die Wiederholung von »an jenem Tag« und »das Volk« wurde entsprechend dem Hebräischen bewahrt. Die direkte Rede steht in deutschen Anführungszeichen.
