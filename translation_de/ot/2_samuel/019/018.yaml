base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/018.yaml
  text: and a thousand men from Benjamin with him[a], and Ziba, the servant of Saul’s house, with his fifteen sons and his twenty servants; they crossed the Jordan before the king.
translation:
  language: de
  text: Mit ihm waren tausend Männer aus Benjamin sowie Ziba, der Diener des Hauses Sauls, mit seinen fünfzehn Söhnen und seinen zwanzig Dienern. Sie überquerten den Jordan vor dem König.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Gegenwart des Königs« oder »dem König voraus«. Die hebräische Wendung kann sowohl die Anwesenheit beim König als auch eine Position vor ihm bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אִישׁ
  choice: tausend Männer
  rationale: Die übliche Zahlverbindung bezeichnet hier wahrscheinlich erwachsene männliche Gefolgsleute; die maskuline Aussage wird bewahrt.
- source_word: מִבִּנְיָמִן
  choice: aus Benjamin
  rationale: Die knappe Form bezeichnet Herkunft beziehungsweise Stammeszugehörigkeit und ist im Deutschen natürlich verständlich.
- source_word: צִיבָא
  choice: Ziba
  rationale: Der Personenname wird nach geläufiger deutscher Konvention transliteriert.
- source_word: נַעַר בֵּית שָׁאוּל
  choice: der Diener des Hauses Sauls
  rationale: נַעַר kann einen jungen Mann, Bediensteten oder Diener bezeichnen. Zibas bekannte Stellung im Haushalt Sauls spricht hier für »Diener«; »Haus« wahrt zugleich den haushaltlichen und dynastischen Bezug.
- source_word: וַחֲמֵשֶׁת עָשָׂר בָּנָיו
  choice: mit seinen fünfzehn Söhnen
  rationale: »Mit« macht die Zugehörigkeit zu Zibas Gefolge im Deutschen flüssig und eindeutig.
- source_word: וְעֶשְׂרִים עֲבָדָיו
  choice: und seinen zwanzig Dienern
  rationale: עֶבֶד kann »Diener« oder »Sklave« bedeuten. Hier steht die Zusammensetzung des Gefolges im Vordergrund, weshalb »Diener« kontextgemäß ist.
- source_word: וְצָלְחוּ
  choice: Sie überquerten
  rationale: In Verbindung mit dem Jordan bezeichnet das Verb das Hinübergehen beziehungsweise Überqueren.
- source_word: הַיַּרְדֵּן
  choice: den Jordan
  rationale: Die geläufige deutsche Bezeichnung benötigt den Zusatz »Fluss« nicht.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: vor dem König
  rationale: Die Wiedergabe bewahrt die räumliche Mehrdeutigkeit der hebräischen Wendung, die sowohl Gegenwart als auch Vorrang bezeichnen kann.
