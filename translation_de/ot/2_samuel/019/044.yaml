  text: וַ/יַּ֣עַן אִֽישׁ יִשְׂרָאֵל֩ אֶת אִ֨ישׁ יְהוּדָ֜ה וַ/יֹּ֗אמֶר עֶֽשֶׂר יָד֨וֹת לִ֣/י בַ/מֶּלֶךְ֮ וְ/גַם בְּ/דָוִד֮ אֲנִ֣י מִמְּ/ךָ֒ וּ/מַדּ֨וּעַ֙ הֱקִלֹּתַ֔/נִי וְ/לֹא הָיָ֨ה דְבָרִ֥/י רִאשׁ֛וֹן לִ֖/י לְ/הָשִׁ֣יב אֶת מַלְכִּ֑/י וַ/יִּ֨קֶשׁ֙ דְּבַר אִ֣ישׁ יְהוּדָ֔ה מִ/דְּבַ֖ר אִ֥ישׁ יִשְׂרָאֵֽל־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
translation:
  language: de
  text: 'Da antwortete der Mann Israels dem Mann Judas: „Ich habe zehn Anteile am König, und auch an David habe ich einen größeren Anspruch als du.[a] Warum hast du mich dann gering geachtet? Habe ich nicht zuerst vorgeschlagen, meinen König zurückzuholen?“ Doch die Worte der Männer Judas waren härter als die der Männer Israels.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Zehn Hände habe ich am König“; gemeint sind zehn Anteile oder Ansprüche, wohl entsprechend den zehn nördlichen Stämmen. Der folgende hebräische Satz ist verkürzt und kann auch heißen: „Auch an David habe ich mehr Anteil als du.“'
    reason: Kulturelle Erläuterung und lexikalische Alternative
  - marker: b
    text: 'Wörtlich: „Doch das Wort des Mannes Judas war härter als das Wort des Mannes Israels.“ Die Singularform ist hier kollektiv zu verstehen. Möglich ist auch: „Die Worte der Männer Judas waren heftiger als die der Männer Israels.“'
    reason: Lexikalische Alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  choice: 'der Mann Israels / der Mann Judas; im Schlusssatz: die Männer Judas / Israels'
  rationale: Der Singular bezeichnet zunächst repräsentativ den Sprecher der jeweiligen Gruppe. Im abschließenden Erzählerkommentar ist der kollektive Sinn im Deutschen mit dem Plural natürlicher.
- source_word: עֶשֶׂר יָדוֹת לִי בַמֶּלֶךְ
  choice: Ich habe zehn Anteile am König
  rationale: יָדוֹת bedeutet wörtlich „Hände“, bezeichnet hier aber idiomatisch Anteile beziehungsweise Ansprüche. „Zehn Anteile“ gibt den Bezug auf die zehn nördlichen Stämme verständlich wieder.
- source_word: וְגַם בְּדָוִד אֲנִי מִמְּךָ
  choice: und auch an David habe ich einen größeren Anspruch als du
  rationale: Die hebräische Formulierung ist elliptisch. Gemeint ist im Zusammenhang ein im Vergleich größerer Anteil oder Anspruch auf David, nicht allgemeine persönliche Überlegenheit.
- source_word: הֱקִלֹּתַנִי
  choice: hast du mich gering geachtet
  rationale: Das Hifil von קלל beschreibt, dass jemand als unbedeutend behandelt oder zurückgesetzt wird. „Gering geachtet“ ist natürlich und wahrt die Schärfe, ohne zu „verachtet“ zu steigern.
- source_word: וְלֹא הָיָה דְבָרִי רִאשׁוֹן לִי לְהָשִׁיב אֶת מַלְכִּי
  choice: Habe ich nicht zuerst vorgeschlagen, meinen König zurückzuholen?
  rationale: Die schwierige, elliptische Wendung beansprucht den Vorrang bei der Initiative zur Rückführung des Königs. „Vorgeschlagen“ gibt דְבָרִי kontextgemäß wieder; die Alternative „War nicht mein Wort das erste …?“ bleibt in der Fußnote sichtbar.
- source_word: מַלְכִּי
  choice: meinen König
  rationale: Das ausdrücklich vorhandene Suffix der ersten Person unterstreicht persönliche Loyalität und Anspruch und wird deshalb bewahrt.
- source_word: וַיִּקֶשׁ דְּבַר אִישׁ יְהוּדָה מִדְּבַר אִישׁ יִשְׂרָאֵל
  choice: Doch die Männer Judas antworteten schärfer als die Männer Israels
  rationale: קשׁה bezeichnet hier die größere Härte oder Heftigkeit der Rede. Eine verbale Formulierung klingt im modernen Deutschen natürlicher als „das Wort … war härter“, ohne den Sinn aufzulösen.
