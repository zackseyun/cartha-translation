base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/043.yaml
  text: Then every man of Judah answered the man of Israel[a], “Because the king is a close relative to me[b]. So why has this matter made you angry? Have we eaten at all at the king’s expense? Or has he given us any gift?”
translation:
  language: de
  text: 'Da antworteten alle Männer von Juda den Männern von Israel: „Der König steht uns doch nahe.[a] Warum seid ihr wegen dieser Sache zornig? Haben wir etwa auf Kosten des Königs gegessen? Oder ist uns irgendetwas zugewendet worden?“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Der König ist uns nahe.“ Gemeint sein kann besonders verwandtschaftliche oder stammesbezogene Nähe.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Oder ist uns etwas gebracht worden?“ Der hebräische Wortlaut des letzten Satzteils ist schwierig.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן כָּל אִישׁ יְהוּדָה
  choice: Da antworteten alle Männer von Juda
  rationale: Die hebräische Einzahl mit כָּל hat kollektiven Sinn. Im Deutschen gibt der Plural die Gruppe natürlich wieder; „Da“ führt die Reaktion im Erzählablauf fort.
- source_word: עַל אִישׁ יִשְׂרָאֵל
  choice: den Männern von Israel
  rationale: Auch „Mann Israels“ ist hier kollektiv gebraucht. Der deutsche Plural verdeutlicht den Streit zwischen den beiden Gruppen, ohne den Sinn zu verändern.
- source_word: כִּי קָרוֹב הַמֶּלֶךְ אֵלַי
  choice: Der König steht uns doch nahe
  rationale: קָרוֹב bezeichnet Nähe und kann hier verwandtschaftlich beziehungsweise stammesbezogen verstanden werden. Die offene Formulierung bewahrt diese Bedeutungsbreite; „doch“ gibt die begründende und einwendende Kraft von כִּי im Dialog wieder.
- source_word: וְלָמָּה זֶּה חָרָה לְךָ עַל הַדָּבָר הַזֶּה
  choice: Warum seid ihr wegen dieser Sache zornig?
  rationale: חָרָה ist ein Idiom für Zorn. Die singularischen Anreden beziehen sich kollektiv auf Israel und werden im Deutschen passend im Plural wiedergegeben.
- source_word: הֶאָכוֹל אָכַלְנוּ מִן הַמֶּלֶךְ
  choice: Haben wir etwa auf Kosten des Königs gegessen?
  rationale: Infinitivus absolutus und finites Verb verstärken die rhetorische Frage. „Etwa“ vermittelt die erwartete Verneinung; „auf Kosten des Königs“ gibt das Empfangen materieller Begünstigung idiomatisch wieder.
- source_word: אִם נִשֵּׂאת נִשָּׂא לָנוּ
  choice: Oder ist uns irgendetwas zugewendet worden?
  rationale: Der schwierige hebräische Wortlaut verwendet נשׂא und lässt Gegenstand beziehungsweise Art der Zuwendung unausgesprochen. Die Übersetzung wahrt Passivform und Unbestimmtheit, ohne ausdrücklich ein Geschenk oder den König als Handelnden einzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektiven hebräischen Singularformen werden im natürlichen deutschen Plural wiedergegeben. Die schwer deutbare Schlussklausel bleibt bewusst offen; weder „Geschenk“ noch der König als ausdrücklicher Geber wird in den Haupttext eingefügt.
