base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/006.yaml
  text: Then Joab came into the house to the king and said[a], “Today you have put to shame all your servants who today saved your life, and the lives of your sons and your daughters[c][b], and the lives of your wives and your concubines.”
translation:
  language: de
  text: 'Da kam Joab zum König ins Haus und sagte: »Heute hast du alle deine Diener beschämt, die heute dein Leben gerettet haben, das Leben deiner Söhne und Töchter sowie das Leben deiner Frauen und Nebenfrauen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Heute hast du die Gesichter aller deiner Diener beschämt, die heute dein Leben gerettet haben und das Leben deiner Söhne und Töchter, deiner Frauen und deiner Nebenfrauen.« Das hebräische Wort für »Leben« wird in der Aufzählung wiederholt.'
    reason: Die Fußnote dokumentiert die konkrete hebräische Wendung mit »Gesichter« sowie die wiederholte Verwendung von נֶפֶשׁ („Leben“), während der Haupttext idiomatisches modernes Deutsch verwendet.
lexical_decisions:
- source_word: הַבָּיִת
  choice: ins Haus
  rationale: Gibt den hebräischen Ausdruck wörtlich wieder; im Zusammenhang ist wahrscheinlich die königliche Residenz gemeint.
- source_word: הֹבַשְׁתָּ אֶת־פְּנֵי
  choice: hast du ... beschämt
  rationale: Das Hifil von בוש bezeichnet das Zufügen von Scham. Die konkrete hebräische Wendung mit »Gesicht« wird im Deutschen idiomatisch mit »jemanden beschämen« wiedergegeben.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: Bewahrt die Beziehung zum König, ohne den Personenkreis vorschnell auf Beamte oder Soldaten einzuengen.
- source_word: הַמְמַלְּטִים
  choice: die ... das Leben gerettet haben
  rationale: מלט bezeichnet hier die Rettung aus tödlicher Gefahr; »das Leben retten« ist im Deutschen natürlich und kontextgenau.
- source_word: נַפְשְׁךָ ... נֶפֶשׁ
  choice: dir ... das Leben
  rationale: נפש meint in diesem Zusammenhang das physische Leben, nicht eine vom Körper unterschiedene Seele. Die deutsche Konstruktion fasst die wiederholten hebräischen Angaben flüssig zusammen.
- source_word: פִּלַגְשֶׁיךָ
  choice: deine Nebenfrauen
  rationale: »Nebenfrauen« bezeichnet verständlich Frauen in einer anerkannten, jedoch gegenüber Ehefrauen rangniedrigeren Verbindung und vermeidet den heute teils fremd wirkenden Ausdruck »Konkubinen«.
theological_decisions:
- issue: Soziale und familiäre Bezeichnungen ohne moralische Wertung
  choice: Frauen und Nebenfrauen
  alternative: Ehefrauen und Konkubinen
  rationale: Die Übersetzung wahrt die im Text genannten unterschiedlichen gesellschaftlichen Stellungen, ohne sie zu beschönigen oder moralisch zu kommentieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung »zum König ins Haus« gibt die ungewöhnliche hebräische Wortfolge verständlich wieder, ohne »Haus« sicher als »Palast« festzulegen. Die Rede bleibt direkt und vorwurfsvoll.
