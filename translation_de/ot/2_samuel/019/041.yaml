base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/041.yaml
  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
translation:
  language: de
  text: Dann zog der König nach Gilgal hinüber, und Kimham zog mit ihm hinüber. Alle Leute aus Juda geleiteten den König hinüber[a], und auch die Hälfte des Volkes Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „brachten den König hinüber“ beziehungsweise „ließen den König hinübergehen“. Das hebräische Verb kann hier mit einem direkten Objekt eine veranlassende Bedeutung haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: zog … hinüber
  rationale: עבר bezeichnet hier im Zusammenhang die Bewegung über den Jordan. „Hinüberziehen“ ist natürliches Deutsch und hält den Bezug zur Flussüberquerung fest.
- source_word: הַגִּלְגָּלָה
  choice: nach Gilgal
  rationale: Das direktive ה am Ortsnamen bezeichnet die Richtung auf Gilgal zu; im Deutschen wird dies idiomatisch mit „nach“ wiedergegeben.
- source_word: וְכִמְהָן
  choice: und Kimham
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren Form transliteriert.
- source_word: עָבַר עִמּוֹ
  choice: zog mit ihm hinüber
  rationale: Die Wiederholung desselben Verbs erhält die erzählerische Verbindung zwischen dem Weg des Königs und dem Kimhams.
- source_word: וְכָל עַם יְהוּדָה
  choice: das ganze Volk von Juda
  rationale: עַם bezeichnet hier die Bevölkerung beziehungsweise die anwesende Volksgruppe Judas; „Volk von Juda“ ist transparent und wahrt die politische Unterscheidung zu Israel.
- source_word: וַיַּעַבְרוּ אֶת־הַמֶּלֶךְ
  choice: geleitete den König hinüber
  rationale: עבר mit direktem Objekt kann hier eine veranlassende beziehungsweise überführende Bedeutung haben. „Geleitete … hinüber“ gibt die aktive Begleitung des Königs natürlich wieder, ohne die Art der Hilfe näher festzulegen.
- source_word: וְגַם
  choice: ebenso
  rationale: „Ebenso“ fügt die zweite beteiligte Gruppe knapp und idiomatisch hinzu.
- source_word: חֲצִי עַם יִשְׂרָאֵל
  choice: die Hälfte des Volkes Israel
  rationale: Die quantitative Aussage und die im Vers bestehende Unterscheidung zwischen Juda und Israel bleiben erhalten.
theological_decisions: []
