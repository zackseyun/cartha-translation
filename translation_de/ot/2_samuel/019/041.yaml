  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung „hinüberziehen“ hält den Flussübergang im Blick; „geleitete … hinüber“ vermeidet zugleich eine unnötig mechanische Wiedergabe der möglichen Kausativbedeutung.
