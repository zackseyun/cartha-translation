base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/019.yaml
  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
translation:
  language: de
  text: 'Da befragte David Jahwe[a]: »Soll ich gegen die Philister hinaufziehen? Wirst du sie in meine Hand geben?« Jahwe antwortete David: »Zieh hinauf! Denn ich werde die Philister ganz gewiss in deine Hand geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Gottesname wird hier als »Jahwe« wiedergegeben. Hebräisch: JHWH.'
    reason: divine_name
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: Da befragte David Jahwe
  rationale: שׁאל mit ב bezeichnet hier das Einholen göttlicher Weisung. »befragte« ist im Deutschen natürlich und lässt die konkrete Form der Befragung offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, sodass der im Hebräischen ausdrücklich gebrauchte Gottesname erkennbar bleibt.
- source_word: הַאֶעֱלֶה אֶל־פְּלִשְׁתִּים
  choice: Soll ich gegen die Philister hinaufziehen?
  rationale: »hinaufziehen« bewahrt die militärische Verwendung von עלה; »gegen« gibt die feindliche Stoßrichtung von אֶל im Kontext idiomatisch wieder.
- source_word: הֲתִתְּנֵם בְּיָדִי
  choice: Wirst du sie in meine Hand geben?
  rationale: Die hebräische Siegesformel wird bildhaft und verständlich beibehalten; die Fußnote erläutert ihre Bedeutung.
- source_word: עֲלֵה
  choice: Zieh hinauf!
  rationale: Die Übersetzung wahrt die Wiederholung desselben Verbs aus Davids Frage und vermeidet die engere Festlegung auf »greif an«.
- source_word: כִּי נָתוֹן אֶתֵּן
  choice: Denn ich werde ... ganz gewiss ... geben
  rationale: Infinitivus absolutus und finite Verbform verstärken die Zusage; »ganz gewiss« bildet diese emphatische Gewissheit im modernen Deutsch ab.
- source_word: בְּיָדֶךָ
  choice: in deine Hand
  rationale: Die Formulierung bleibt parallel zu Davids Frage und bewahrt das hebräische Bild von gewährter Gewalt über den Feind.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Bundesnamen ausdrücklich. »Jahwe« macht den Eigennamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Art der göttlichen Befragung
  choice: befragte Jahwe
  alternative: suchte bei Jahwe Rat
  rationale: Die Übersetzung gibt das Einholen göttlicher Weisung wieder, ohne eine im Vers nicht genannte priesterliche oder rituelle Methode vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Wendung »hinaufziehen« sowie das Bild »in meine Hand geben« bleiben erhalten; die Syntax wurde für flüssige direkte Rede leicht geglättet.
