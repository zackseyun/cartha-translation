  text: וְ/אֵ֗לֶּה שְׁמ֛וֹת הַ/יִּלֹּדִ֥ים ל֖/וֹ בִּ/ירוּשָׁלִָ֑ם שַׁמּ֣וּעַ וְ/שׁוֹבָ֔ב וְ/נָתָ֖ן וּ/שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/014.yaml
  text: 'These are the names of those born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: de
  text: 'Und dies sind die Namen derer, die ihm in Jerusalem geboren wurden: Schammua, Schobab, Nathan und Salomo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Die Konjunktion und das Demonstrativum führen die Liste fort; im Deutschen klingt „Und dies sind“ natürlich und bewahrt den Anschluss an den Kontext.
- source_word: שְׁמוֹת
  choice: die Namen
  rationale: Der Status-constructus-Plural bezeichnet unmittelbar die Namen in der folgenden Aufzählung.
- source_word: הַיִּלֹּדִים
  choice: derer, die … geboren wurden
  rationale: Das passive Partizip bedeutet wörtlich „die Geborenen“. Die Formulierung bewahrt diese Offenheit, ohne „Söhne“ oder „Kinder“ ausdrücklich hinzuzufügen.
- source_word: לוֹ
  choice: ihm
  rationale: Die Präposition kennzeichnet hier die Elternschaft; „die ihm geboren wurden“ entspricht der genealogischen Ausdrucksweise.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präpositionalphrase gibt den Geburtsort an.
- source_word: שַׁמּוּעַ
  choice: Schammua
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: שׁוֹבָב
  choice: Schobab
  rationale: Direkte, im Deutschen übliche Transliteration des Personennamens.
- source_word: נָתָן
  choice: Nathan
  rationale: Etablierte deutsche Form des biblischen Personennamens.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Etablierte deutsche Form des biblischen Personennamens.
