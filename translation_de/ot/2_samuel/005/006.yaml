base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/006.yaml
  text: And the king and his men went to Jerusalem[a], to the Jebusites, the inhabitants of the land. And they said to David, “You will not come in here, for even the blind and the lame will turn you away,” saying[b], “David will not come in here.”
translation:
  language: de
  text: 'Und der König zog mit seinen Männern nach Jerusalem, zu den Jebusitern, die das Land bewohnten. Da sagte man zu David[a]: »Du wirst hier nicht hereinkommen; selbst die Blinden und die Lahmen werden dich abweisen.« Damit wollten sie sagen[b]: »David wird hier nicht hereinkommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen der Singular: »Da sagte er zu David.« Gemeint sein kann ein nicht genannter Sprecher oder die Gesamtheit der Jebusiter als Kollektiv.'
    reason: textual_variant
  - marker: b
    text: 'Der hebräische Wortlaut ist schwierig. Die Wendung kann wörtlich etwa verstanden werden als: »es sei denn, die Blinden und die Lahmen halten dich fern«; die genaue Satzfügung ist umstritten. Im Zusammenhang handelt es sich offenbar um eine Verhöhnung: Die Jebusiter hielten die Stadt für so sicher, dass ihrer Behauptung nach selbst Blinde und Lahme David abweisen könnten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: zog
  rationale: Das Verb bezeichnet im fortlaufenden Erzählstil ein Gehen oder Ziehen. »Zog« ist im militärischen Zusammenhang natürlich, ohne die ausdrücklichere Bedeutung von »marschierte« einzutragen.
- source_word: הַמֶּלֶךְ וַאֲנָשָׁיו
  choice: der König … mit seinen Männern
  rationale: אֲנָשָׁיו bedeutet wörtlich »seine Männer« und lässt offen, ob vor allem Krieger oder ein weiteres Gefolge gemeint sind.
- source_word: אֶל הַיְבֻסִי
  choice: zu den Jebusitern
  rationale: Der hebräische Singular ist hier kollektiv als Volksbezeichnung zu verstehen. אֶל wird grundlegend mit »zu« wiedergegeben; der feindliche Zusammenhang ergibt sich aus der Erzählung.
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: die das Land bewohnten
  rationale: Das singularische Partizip hat kollektive Bedeutung und beschreibt die Jebusiter als Bewohner des Landes.
- source_word: וַיֹּאמֶר
  choice: Da sagte man
  rationale: Der masoretische Text bietet einen Singular. Das unpersönliche deutsche »man« bewahrt diese Form besser als ein geglättetes »sie sagten« und lässt einen einzelnen Sprecher oder kollektive Rede offen.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Du wirst hier nicht hereinkommen
  rationale: Der Imperfekt trägt in der höhnischen Rede eine nachdrückliche Zukunftsaussage. »Hereinkommen« entspricht dem Zusammenhang einer befestigten Stadt.
- source_word: כִּי אִם הֱסִירְךָ הַעִוְרִים וְהַפִּסְחִים
  choice: die Blinden und die Lahmen werden dich abweisen
  rationale: Der hebräische Satzbau ist schwierig. Im Kontext liegt eine höhnische Behauptung nahe, selbst Blinde und Lahme könnten David fernhalten. Die Wiedergabe macht diesen Sinn verständlich, während eine Fußnote die wörtlichere Konstruktion nennt.
- source_word: לֵאמֹר ... לֹא יָבוֹא דָוִד הֵנָּה
  choice: 'Damit wollten sie sagen: »David wird hier nicht hereinkommen.«'
  rationale: Das zweite לֵאמֹר führt eine erläuternde Wiederholung der Herausforderung ein und bewahrt deren rhetorischen Nachdruck.
theological_decisions:
- issue: Abwertende Verwendung von Bezeichnungen für Behinderungen in der jebusitischen Verhöhnung
  choice: »die Blinden und die Lahmen« als konkrete Begriffe der berichteten Feindrede beibehalten
  alternative: »selbst die Schwächsten unter uns«
  rationale: Der Text berichtet eine spöttische Aussage der Jebusiter; eine verallgemeinernde Umschreibung würde die konkrete und anstößige Bildsprache des Ausgangstextes verdecken.
- issue: Identität des Sprechers bei וַיֹּאמֶר
  choice: unpersönlich »Da sagte man zu David«
  alternative: »Da sagten sie zu David« oder »Da sagte er zu David«
  rationale: So bleibt die Spannung zwischen dem grammatischen Singular und dem wahrscheinlich kollektiven jebusitischen Sprecher erhalten, ohne eine bestimmte Einzelperson einzuführen.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. »Zog« und »hereinkommen« passen zum militärischen und städtischen Kontext, bleiben aber allgemein verständlich. Das zweimalige »hereinkommen« erhält den Nachdruck der hebräischen Wiederholung.
