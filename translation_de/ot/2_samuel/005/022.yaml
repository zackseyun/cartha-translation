  text: And the Philistines came up again and spread out in the Valley of Rephaim[a].
translation:
  language: de
  text: Die Philister zogen noch einmal herauf und breiteten sich im Tal Refaïm aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bezogen im Tal Refaïm Stellung“. Das hebräische Verb beschreibt wahrscheinlich, wie die Philister sich über das Tal verteilten oder dort aufstellten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ עוֹד ... לַעֲלוֹת
  choice: zogen noch einmal herauf
  rationale: Die Verbindung von יסף, עוֹד und dem Infinitiv bezeichnet die Wiederholung des Hinaufziehens. „Noch einmal“ gibt die Wiederholung natürlich wieder; „heraufziehen“ bewahrt Bewegungsrichtung und militärischen Erzählton.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Die im Deutschen übliche Bezeichnung dieser Volksgruppe.
- source_word: וַיִּנָּטְשׁוּ
  choice: breiteten sich ... aus
  rationale: Im militärischen Zusammenhang bezeichnet das Verb wahrscheinlich, dass die Truppen sich über das Gelände verteilten beziehungsweise dort Stellung bezogen. Die Formulierung bleibt anschaulich und bewahrt die lexikalische Spannweite.
- source_word: בְּעֵמֶק רְפָאִים
  choice: im Tal Refaïm
  rationale: עֵמֶק bezeichnet ein Tal; רְפָאִים ist hier Bestandteil eines Ortsnamens und wird daher transliteriert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Noch einmal“ klingt im Erzählzusammenhang natürlicher als eine wörtliche Wiedergabe mit „fügten hinzu“. Die Schreibweise „Refaïm“ kennzeichnet die getrennte Aussprache der Vokale.
