base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/010.yaml
  text: And David went on[a], growing greater, and Yahweh, the God of hosts, was with him.
translation:
  language: de
  text: Und David gewann immer mehr an Größe[a], und Jahwe, der Gott der Heerscharen, war mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „David wurde immer mächtiger.“ Die hebräische Ausdrucksweise betont eine fortlaufende Zunahme an Größe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד הָלוֹךְ וְגָדוֹל
  choice: Und David wurde immer mächtiger
  rationale: Die Verbindung aus der finiten Form von הלך, dem Infinitivus absolutus הָלוֹךְ und וְגָדוֹל bezeichnet eine fortschreitende Zunahme. Im Kontext von Davids gefestigter Herrschaft gibt „wurde immer mächtiger“ den idiomatischen Sinn natürlich und prägnant wieder.
- source_word: דָּוִד
  choice: David
  rationale: Die im Deutschen übliche Form des Personennamens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Wiedergabe des im hebräischen Text ausdrücklich stehenden Gottesnamens, ohne ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: der Gott der Heerscharen
  rationale: „Heerscharen“ bewahrt die semantische Breite von צְבָאוֹת, ohne ausschließlich irdische oder himmlische Heere festzulegen.
- source_word: עִמּוֹ
  choice: war mit ihm
  rationale: Direkte Wiedergabe der Aussage von Gottes begleitender Gegenwart; das Pronomen bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen יהוה. „Jahwe“ macht diesen sichtbar, statt ihn durch einen traditionellen Ersatztitel wiederzugeben.
- issue: Bedeutungsumfang von צְבָאוֹת im Gottestitel
  choice: Heerscharen
  alternative: Heere
  rationale: „Heerscharen“ lässt offen, welche irdischen oder himmlischen Mächte gemeint sind, und vermeidet eine nicht ausdrücklich im Text enthaltene Eingrenzung.
- issue: Art von Davids Zunahme
  choice: wurde immer mächtiger
  alternative: wurde immer größer
  rationale: Im Zusammenhang mit Davids Königtum bezeichnet גָדוֹל wahrscheinlich zunehmende Macht und Bedeutung. Die Fußnote bewahrt die wörtlichere und weiter gefasste Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während die hebräische Verlaufsform idiomatisch wiedergegeben wird.
