  source_fidelity: Die hebräische Konstruktion וַיֵּלֶךְ ... הָלוֹךְ וְגָדוֹל ist eine verstärkende Verlaufsform und besagt, dass David fortwährend an Größe zunahm. „Immer mächtiger“ ist im Königskontext möglich, verengt גָּדוֹל („groß“) jedoch auf Macht. „Gewann immer mehr an Größe“ gibt den offenen, umfassenderen Sinn idiomatisch wieder.
