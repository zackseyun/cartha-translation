    rationale: „David ging weiter und wurde immer größer“ bildet die hebräische Form nicht wirklich wörtlicher ab und kann im Deutschen körperliches Wachstum nahelegen. Die sinnvolle Alternative sollte als solche gekennzeichnet werden.
