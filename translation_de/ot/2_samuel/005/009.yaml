base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/009.yaml
  text: So David lived in the stronghold and called it the City of David[a]. And David built all around from the Millo inward.
translation:
  language: de
  text: So wohnte David in der Festung und nannte sie Davidsstadt. David baute ringsum, vom Millo aus nach innen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die letzte Ortsangabe kann auch mit „vom Millo und nach innen“ oder „vom Millo in Richtung des Inneren“ wiedergegeben werden. Der Millo bezeichnet vermutlich eine bekannte Anlage oder einen Bereich mit Terrassenaufschüttungen in Jerusalem; seine genaue Beschaffenheit ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: wohnte
  rationale: ישׁב bezeichnet hier Davids dauerhaften Aufenthalt in der eroberten Festung; „wohnte“ ist natürlich und genau.
- source_word: בַּמְּצֻדָה
  choice: in der Festung
  rationale: מְצֻדָה bezeichnet einen befestigten, geschützten Ort. „Festung“ gibt den militärischen Charakter im Deutschen klar wieder.
- source_word: וַיִּקְרָא לָהּ
  choice: nannte sie
  rationale: קרא mit ל bezeichnet hier die Benennung eines Ortes; „nannte sie“ ist eine direkte und natürliche Wiedergabe.
- source_word: עִיר דָּוִד
  choice: Davidsstadt
  rationale: Die feste deutsche Ortsbezeichnung „Davidsstadt“ gibt den hebräischen Namen knapp und eindeutig wieder.
- source_word: וַיִּבֶן
  choice: baute
  rationale: בנה bedeutet grundsätzlich „bauen“. Der Text legt nicht ausdrücklich fest, ob David neu baute, wiederaufbaute oder befestigte.
- source_word: סָבִיב
  choice: ringsum
  rationale: סביב beschreibt die umlaufende Ausdehnung der Bautätigkeit; „ringsum“ ist idiomatisch und bewahrt diesen Sinn.
- source_word: מִן הַמִּלּוֹא
  choice: vom Millo
  rationale: מִלּוֹא ist ein unsicher bestimmbares topografisches oder bauliches Fachwort. Die Transliteration vermeidet eine nicht gesicherte Identifizierung.
- source_word: וָבָיְתָה
  choice: nach innen
  rationale: Die Form mit direktionalem ה bezeichnet wahrscheinlich die Richtung ins Innere. „Nach innen“ wahrt den räumlichen Sinn, ohne eine bestimmte bauliche Rekonstruktion vorauszusetzen.
