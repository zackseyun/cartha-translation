lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: und Elischama
  rationale: Die vorangestellte Konjunktion ו wird mit „und“ wiedergegeben; der Personenname אֱלִישָׁמָע folgt der im Deutschen üblichen biblischen Namensform „Elischama“.
- source_word: וְ/אֶלְיָדָע
  choice: Eljada
  rationale: Der Personenname אֶלְיָדָע wird in der geläufigen deutschen Form „Eljada“ wiedergegeben. Das hebräische ו wird im Deutschen innerhalb der Aufzählung durch die übliche Zeichensetzung vertreten.
- source_word: וֶ/אֱלִיפָלֶט
  choice: und Elifelet
  rationale: Die Konjunktion ו wird am letzten Glied der Aufzählung ausdrücklich mit „und“ wiedergegeben; אֱלִיפָלֶט erscheint in der etablierten deutschen Namensform „Elifelet“.
theological_decisions: []
translation_notes:
  register: Knappe, natürliche Fortsetzung einer Namensliste. Die wiederholten hebräischen Konjunktionen werden als idiomatische deutsche Aufzählung mit Komma und abschließendem „und“ gestaltet; die Eigennamen bleiben unübersetzt.
