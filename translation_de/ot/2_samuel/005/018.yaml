  text: וּ/פְלִשְׁתִּ֖ים בָּ֑אוּ וַ/יִּנָּטְשׁ֖וּ בְּ/עֵ֥מֶק רְפָאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/018.yaml
  text: And the Philistines came and spread out in the Valley of Rephaim[a].
translation:
  language: de
  text: Und die Philister kamen und breiteten sich im Tal Refaïm aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: stellten sich im Tal Refaïm zum Kampf auf.'
    reason: Lexikalische Alternative für וַיִּנָּטְשׁוּ; im militärischen Zusammenhang kann das Verb eine Aufstellung beziehungsweise Entfaltung der Truppen bezeichnen.
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Und die Philister
  rationale: Die Konjunktion ו wird als „Und“ wiedergegeben, um den Erzählfluss zu bewahren; פְלִשְׁתִּים ist die übliche Volksbezeichnung „Philister“.
- source_word: בָּאוּ
  choice: kamen
  rationale: Das Qal Perfekt von בוא bezeichnet hier im fortlaufenden Bericht ihr Kommen; „kamen“ ist natürlich und nah am Ausgangstext.
- source_word: וַ/יִּנָּטְשׁוּ
  choice: breiteten sich … aus
  rationale: Die Verbform von נטשׁ beschreibt in diesem militärischen Zusammenhang wahrscheinlich, wie sich die Philister über das Gelände verteilten. Die Formulierung ist verständlich, ohne die militärische Deutung übermäßig festzulegen.
- source_word: בְּ/עֵמֶק
  choice: im Tal
  rationale: ב ist hier lokal zu verstehen; עֵמֶק bedeutet „Tal“. Der deutsche Ortsname wird idiomatisch mit „im Tal“ gebildet.
- source_word: רְפָאִים
  choice: Refaïm
  rationale: Als Bestandteil des Ortsnamens wird רְפָאִים transliteriert statt übersetzt. Der Trema kennzeichnet, dass a und i getrennt gesprochen werden.
theological_decisions: []
