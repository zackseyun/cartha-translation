base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
translation:
  language: de
  text: 'Schon früher[a], als Saul König über uns war, warst du es, der Israel hinaus- und hineinführte.[b] Und Jahwe sagte zu dir: »Du sollst mein Volk Israel als Hirte führen, und du sollst Herrscher[c] über Israel sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »sowohl gestern als auch vorgestern«; eine hebräische Redewendung für »früher« oder »schon seit geraumer Zeit«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »der Israel hinausführte und hineinführte«; eine hebräische Wendung für die Führung des Volkes in seinen Unternehmungen, besonders im Krieg.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Anführer« beziehungsweise »Fürst«; das hebräische Wort ist nicht das gewöhnliche Wort für »König«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֶתְמוֹל גַּם שִׁלְשׁוֹם
  choice: Schon früher
  rationale: Die Wendung bedeutet wörtlich etwa »sowohl gestern als auch vorgestern«, ist hier aber idiomatisch im Sinn von »schon früher« beziehungsweise »seit geraumer Zeit« gebraucht.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ עָלֵינוּ
  choice: als Saul König über uns war
  rationale: Die Präposition ב mit dem Infinitiv bildet einen temporalen Nebensatz; die gewählte Formulierung ist im Deutschen klar und quellennah.
- source_word: אַתָּה הָיִיתָ
  choice: warst du es
  rationale: Das selbstständige Pronomen ist betont. Die deutsche Spaltsatzform bringt diesen Nachdruck natürlich zum Ausdruck.
- source_word: מוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: der Israel hinaus- und wieder hineinführte
  rationale: Die gegensätzlichen Bewegungsverben werden bildhaft bewahrt; »führen« macht zugleich verständlich, dass David Israel in seinen Unternehmungen, besonders im Krieg, anführte.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext ausdrücklich stehende Gottesname wird in seiner im Deutschen geläufigen Form wiedergegeben.
- source_word: תִרְעֶה
  choice: als Hirte führen
  rationale: Die königliche Hirtenmetapher bleibt erhalten, während die Formulierung für heutige Leser natürlicher klingt als das alleinstehende Verb »weiden«.
- source_word: נָגִיד
  choice: Herrscher
  rationale: Das Wort bezeichnet einen eingesetzten Führer oder Regenten und ist nicht das gewöhnliche hebräische Wort für »König«. »Herrscher« ist verständlich und wahrt diese Unterscheidung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der hebräische Text den Eigennamen verwendet, wird dieser als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Königliche Hirtenmetapher in תִרְעֶה
  choice: Du sollst mein Volk Israel als Hirte führen
  alternative: Du sollst mein Volk Israel weiden / regieren
  rationale: Die Wiedergabe erhält das theologisch bedeutsame Hirtenbild, ohne es auf bloße Verwaltung zu verengen oder im modernen Deutschen unnötig befremdlich klingen zu lassen.
- issue: Bedeutung von נָגִיד gegenüber מֶלֶךְ
  choice: Herrscher
  alternative: Anführer / Fürst
  rationale: Die Übersetzung bezeichnet Davids von Gott verliehene Leitungsstellung, setzt נָגִיד aber nicht stillschweigend mit dem im selben Vers gebrauchten Wort für »König« gleich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Betonung Davids, das Bewegungsbild des Hinaus- und Hineinführens sowie die königliche Hirtenmetapher werden bewahrt; idiomatische Wendungen werden zugleich verständlich formuliert.
