base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/020.yaml
  text: So David came to Baal-perazim[a], and there David struck them down. He said[b], “Yahweh has broken through my enemies before me like a breakthrough of waters.” Therefore he called the name of that place Baal-perazim.
translation:
  language: de
  text: 'David kam nach Baal-Perazim[a] und schlug sie dort nieder. Er sagte: »Jahwe hat meine Feinde vor mir durchbrochen, wie Wasser hervorbricht.«[b] Deshalb nannte er diesen Ort Baal-Perazim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Perazim klingt im Hebräischen etwa wie »Herr der Durchbrüche« oder »Ort der Durchbrüche«. Der Name greift Davids anschließende Aussage auf, dass Jahwe seine Feinde »durchbrochen« hat.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »wie Fluten hervorbrechen«. Im Hebräischen stehen für »durchbrochen«, das Hervorbrechen des Wassers und den Namen Baal-Perazim Wörter derselben Wortfamilie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: Baal-Perazim
  rationale: Der Ortsname wird transliteriert. Seine Wiederholung bewahrt zugleich den Zusammenhang mit dem hebräischen Wortspiel um פרץ, »durchbrechen«.
- source_word: וַיַּכֵּם
  choice: schlug sie
  rationale: נכה bezeichnet hier das Schlagen im Kampf. »Schlug sie« erhält die kriegerische Aussage, ohne ausdrücklich eine vollständige Vernichtung zu behaupten.
- source_word: פָּרַץ
  choice: hat … durchbrochen
  rationale: Das Verb bezeichnet ein gewaltsames Durchbrechen oder Hervorbrechen. Die Wiedergabe erhält die lexikalische Verbindung zum Vergleich mit Wasser und zum Ortsnamen Baal-Perazim.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֹיְבַי
  choice: meine Feinde
  rationale: Direkte und natürliche Wiedergabe des Nomens mit Suffix der ersten Person Singular.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Die Formulierung bildet die hebräische Wendung knapp ab und lässt offen, ob David seine führende Stellung oder lediglich das Geschehen in seiner Gegenwart hervorhebt.
- source_word: כְּפֶרֶץ מָיִם
  choice: wie Wasser durchbricht
  rationale: Die verbale Formulierung klingt im Deutschen natürlicher als ein abstraktes »wie ein Durchbruch von Wasser« und bewahrt durch »durchbricht« dennoch die zentrale Wortwiederholung.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: nannte er diesen Ort
  rationale: Idiomatiche moderne Wiedergabe der hebräischen Benennungsformel; der Sinn des Namengebens bleibt vollständig erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. »Jahwe« gibt diesen Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Handelnder beim Durchbruch
  choice: Jahwe hat die Feinde durchbrochen
  alternative: David durchbricht die Feinde mit Jahwes Hilfe
  rationale: Die Aussage nennt ausdrücklich Jahwe als Subjekt. Die Übersetzung erhält diese theologische Zuschreibung des Sieges, ohne die Spannung zu Davids unmittelbar zuvor geschildertem Handeln aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählweise. Der Ortsname bleibt transliteriert; das im Hebräischen zentrale Wortspiel wird im Haupttext durch die Wiederholung von »durchbrechen« und ergänzend in den Fußnoten sichtbar gemacht.
