  text: וַ/יֹּ֨אמֶר דָּוִ֜ד בַּ/יּ֣וֹם הַ/ה֗וּא כָּל מַכֵּ֤ה יְבֻסִי֙ וְ/יִגַּ֣ע בַּ/צִּנּ֔וֹר וְ/אֶת הַ/פִּסְחִים֙ וְ/אֶת הַ֣/עִוְרִ֔ים שנאו נֶ֣פֶשׁ דָּוִ֑ד עַל כֵּן֙ יֹֽאמְר֔וּ עִוֵּ֣ר וּ/פִסֵּ֔חַ לֹ֥א יָב֖וֹא אֶל הַ/בָּֽיִת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/008.yaml
  text: And David said on that day[a], “Whoever strikes the Jebusites and reaches the water shaft, and the lame and the blind, whom David’s soul hates.” Therefore they say[c][b], “The blind and the lame shall not come into the house.”
translation:
  language: de
  text: 'Und David sagte an jenem Tag: „Wer die Jebusiter schlägt und den Wasserschacht[a] erreicht – und die Lahmen und die Blinden, die Davids Seele hasst.“[b] Daher sagt man: „Ein Blinder oder Lahmer kommt nicht ins Haus.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „zur Wasserleitung“, „zur Rinne“ oder „zum Tunnel“. Das hebräische Wort bezeichnet wahrscheinlich einen Teil der Wasseranlage; seine genaue Bedeutung ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Satz ist hier syntaktisch schwer verständlich. Manche beziehen „die Lahmen und die Blinden“ auf den Spott der Jebusiter im vorhergehenden Vers; andere verstehen die Worte als Teil von Davids Herausforderung.
    reason: alternative_reading
  - marker: c
    text: Oder „in den Palast“. Mit dem „Haus“ kann in diesem Zusammenhang die königliche Residenz gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַכֵּה יְבֻסִי
  choice: Wer die Jebusiter schlägt
  rationale: כָּל mit dem Partizip bezeichnet hier idiomatisch eine unbestimmte Person in einer Herausforderung; das singularische Gentilizium יְבֻסִי ist kollektiv zu verstehen.
- source_word: וְיִגַּע בַּצִּנּוֹר
  choice: und bis zum Wasserschacht gelangt
  rationale: נגע bedeutet grundsätzlich „berühren/erreichen“; „gelangt“ ist im militärisch-topografischen Zusammenhang natürlich, während צִנּוֹר wahrscheinlich eine Wasseranlage bezeichnet, in seiner genauen Bedeutung aber unsicher bleibt.
- source_word: וְאֶת הַפִּסְחִים וְאֶת הַעִוְרִים
  choice: und die Lahmen und die Blinden
  rationale: Die substantivierten Adjektive und die Konjunktion werden eng am Hebräischen wiedergegeben; die schwierige syntaktische Einbindung wird nicht durch eine eindeutige Paraphrase aufgelöst.
- source_word: שנאו נֶפֶשׁ דָּוִד
  choice: die Davids Seele hasst
  rationale: Die ungewöhnliche Wendung „Davids Seele hasst“ wird wegen ihrer Intensität und Härte bewahrt; das Bezugspronomen wird für verständliches Deutsch ergänzt.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: Daher sagt man
  rationale: Die unbestimmte 3. Person Plural führt eine sprichwörtliche Redensart ein; im modernen Deutsch gibt „sagt man“ diese Funktion natürlich wieder.
- source_word: עִוֵּר וּפִסֵּחַ
  choice: Ein Blinder oder Lahmer
  rationale: Die singularischen Formen sind generisch. „Oder“ entspricht im Deutschen der negierten Zusammenfassung der beiden genannten Klassen, ohne den Sinn auf bestimmte Einzelpersonen zu begrenzen.
- source_word: לֹא יָבֹא אֶל הַבָּיִת
  choice: kommt nicht ins Haus
  rationale: Das Präsens passt zu einer sprichwörtlichen Aussage. בַּיִת bleibt als „Haus“ wiedergegeben, da „Palast“ zwar kontextuell möglich, aber nicht ausdrücklich bezeichnet ist.
theological_decisions:
- issue: Davids Hass auf „die Lahmen und die Blinden“
  choice: Die harte Aussage des masoretischen Textes bleibt stehen, ohne sie abzuschwächen oder zu einer allgemeinen theologischen Aussage über Menschen mit Behinderungen auszuweiten.
  alternative: Die Bezeichnungen vollständig als Zitat des jebusitischen Spotts aus Vers 6 verstehen oder den Satz so umformulieren, dass David kein Hass zugeschrieben wird.
  rationale: Der überlieferte hebräische Text ist syntaktisch schwierig, bietet aber keinen ausreichenden Grund, seine theologische und ethische Spannung stillschweigend zu beseitigen.
- issue: Bezug von „die Lahmen und die Blinden“ innerhalb der Herausforderung
  choice: Die komprimierte und unvollständige Syntax wird im Haupttext sichtbar bewahrt und in einer Fußnote erläutert.
  alternative: Die Wendung eindeutig als direktes Objekt von „schlägt“ oder ausschließlich als Wiederaufnahme des jebusitischen Spotts deuten.
  rationale: Beide Deutungen sind vertreten; eine glättende Festlegung würde die echte Mehrdeutigkeit des hebräischen Satzes verdecken.
- issue: Bedeutung von „Haus“
  choice: Haus
  alternative: Palast beziehungsweise königliche Residenz
  rationale: Der Kontext erlaubt einen Bezug auf Davids Residenz, doch בַּיִת ist lexikalisch weiter und sollte nicht ohne Kennzeichnung verengt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbruch mit Gedankenstrich und Auslassungspunkten bildet die auffällig komprimierte, offenbar unvollständige hebräische Herausforderung ab, ohne einen im Text nicht vorhandenen Nachsatz zu ergänzen. Die Fußnotenmarker stehen jeweils unmittelbar an der einschlägigen Stelle.
