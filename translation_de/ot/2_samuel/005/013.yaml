source:
  edition: WLC
  text: וַ/יִּקַּח֩ דָּוִ֨ד ע֜וֹד פִּֽלַגְשִׁ֤ים וְ/נָשִׁים֙ מִ/יר֣וּשָׁלִַ֔ם אַחֲרֵ֖י בֹּא֣/וֹ מֵ/חֶבְר֑וֹן וַ/יִּוָּ֥לְדּוּ ע֛וֹד לְ/דָוִ֖ד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/013.yaml
  text: And David took more concubines and wives in Jerusalem after he came from Hebron[a], and more sons and daughters were born to David.
translation:
  language: de
  text: Und David nahm sich noch weitere Nebenfrauen und Ehefrauen aus Jerusalem[a], nachdem er aus Hebron gekommen war. Und David wurden noch weitere Söhne und Töchter geboren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Jerusalem“. Wörtlich steht im Hebräischen „aus Jerusalem“; möglicherweise ist damit der Ort gemeint, an dem David sie nach seinem Umzug dorthin nahm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm sich
  rationale: לקח bezeichnet hier die Aufnahme von Frauen in Ehe beziehungsweise Nebenfrauenschaft. „Nahm sich“ ist im Deutschen natürlich und bewahrt die knappe Erzählweise.
- source_word: עוֹד
  choice: noch weitere
  rationale: Das Adverb bezeichnet in beiden Vorkommen eine Hinzufügung; „noch weitere“ gibt diesen Sinn eindeutig wieder.
- source_word: פִּלַגְשִׁים
  choice: Nebenfrauen
  rationale: Der Ausdruck bezeichnet Frauen mit einem gegenüber Ehefrauen nachgeordneten Status und bleibt so von „Frauen“ unterschieden.
- source_word: וְנָשִׁים
  choice: Frauen
  rationale: נָשִׁים kann „Frauen“ oder „Ehefrauen“ bedeuten. In Verbindung mit „Nebenfrauen“ sind Ehefrauen gemeint; das natürliche deutsche „Frauen“ bewahrt jedoch die lexikalische Form und ist im Kontext verständlich.
- source_word: מִירוּשָׁלִַם
  choice: aus Jerusalem
  rationale: Die Präposition מִן bedeutet formal „aus/von“. Diese Wiedergabe bewahrt die ungewöhnliche hebräische Formulierung, ohne sie stillschweigend als Ortsangabe „in Jerusalem“ aufzulösen.
- source_word: אַחֲרֵי בֹּאוֹ מֵחֶבְרוֹן
  choice: nachdem er aus Hebron gekommen war
  rationale: Die Formulierung gibt die zeitliche Abfolge und den Ausgangsort Hebron in natürlichem modernem Deutsch wieder.
- source_word: וַיִּוָּלְדוּ ... לְדָוִד
  choice: David wurden ... geboren
  rationale: Das passive Verb und die relationale לְ-Konstruktion werden mit der idiomatischen deutschen Geburtsformel wiedergegeben.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Die ausdrückliche Nennung beider Gruppen wird beibehalten und nicht zum allgemeineren „Kinder“ verkürzt.
theological_decisions:
- issue: Erzählende Darstellung von Davids Polygamie
  choice: Der Vorgang wird ohne moralischen Zusatz beschrieben.
  alternative: Durch wertende Zusätze Zustimmung oder Missbilligung ausdrücken.
  rationale: Der Vers berichtet Davids Handeln und die Geburten, enthält selbst aber kein ausdrückliches moralisches Urteil.
- issue: Mehrdeutigkeit der Ortsangabe מִירוּשָׁלִַם
  choice: Im Haupttext steht formal „aus Jerusalem“; die mögliche örtliche Bedeutung wird in einer Fußnote genannt.
  alternative: Im Haupttext glätten zu „in Jerusalem“.
  rationale: So bleibt die hebräische Präposition sichtbar, während zugleich die kontextuell mögliche Deutung transparent gemacht wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt erzählerisch knapp; „Nebenfrauen“ unterscheidet den im Hebräischen genannten Status von dem der Frauen. Die auffällige Präposition bei Jerusalem wird formal wiedergegeben und durch eine Fußnote erläutert.
