source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּי מָשְׁח֨וּ אֶת דָּוִ֤ד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וַ/יַּעֲל֥וּ כָל פְּלִשְׁתִּ֖ים לְ/בַקֵּ֣שׁ אֶת דָּוִ֑ד וַ/יִּשְׁמַ֣ע דָּוִ֔ד וַ/יֵּ֖רֶד אֶל הַ/מְּצוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/017.yaml
  text: When the Philistines heard that they had anointed David king over Israel[a], all the Philistines went up to seek David. When David heard of it, he went down to the stronghold.
translation:
  language: de
  text: Als die Philister hörten, dass David zum König über Israel gesalbt worden war, zogen alle Philister hinauf, um David zu suchen. Als David davon hörte, ging er hinunter in die Festung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in die Bergfeste. Das hebräische Wort bezeichnet einen befestigten Ort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: Philister
  rationale: Die im Deutschen übliche Bezeichnung für dieses Volk.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt dessen ein, was die Philister hörten.
- source_word: מָשְׁחוּ
  choice: gesalbt worden war
  rationale: Das Passiv gibt die nicht näher bezeichneten Handelnden natürlich wieder; das Plusquamperfekt macht deutlich, dass die Salbung dem Hören vorausging.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: zum König über Israel
  rationale: Die Formulierung gibt sowohl die Einsetzung zum König als auch seine Herrschaft über Israel wieder.
- source_word: וַיַּעֲלוּ
  choice: zogen ... hinauf
  rationale: Bewahrt die räumliche Aufwärtsbewegung des hebräischen Verbs, während „zogen“ im militärischen Zusammenhang natürlich klingt, ohne einen Angriff ausdrücklich vorwegzunehmen.
- source_word: כָל־פְּלִשְׁתִּים
  choice: alle Philister
  rationale: Gibt die umfassende Formulierung des Ausgangstextes unmittelbar wieder.
- source_word: לְבַקֵּשׁ אֶת־דָּוִד
  choice: um David zu suchen
  rationale: Bewahrt die breite Bedeutung von בקש und legt das feindliche Ziel nicht genauer als der Ausgangstext fest.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: Als David davon hörte
  rationale: „Davon“ ergänzt im Deutschen natürlich den im Hebräischen aus dem Zusammenhang erschlossenen Inhalt.
- source_word: וַיֵּרֶד
  choice: ging er hinunter
  rationale: Gibt die ausdrücklich bezeichnete Abwärtsbewegung schlicht und idiomatisch wieder.
- source_word: הַמְּצוּדָה
  choice: die Festung
  rationale: Das Wort bezeichnet einen befestigten, Schutz bietenden Ort; „Festung“ ist hier verständlich und vermeidet die zusätzliche topografische Festlegung von „Bergfeste“.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdevolle Erzählsprache. Die wiederholte Hörensformel und die Richtungsangaben „hinauf“ und „hinunter“ bleiben erhalten. Die feindliche Absicht der Philister wird nicht über das im Verb „suchen“ ausdrücklich Gesagte hinaus präzisiert.
