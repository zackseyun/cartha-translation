source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ כָּל שִׁבְטֵ֧י יִשְׂרָאֵ֛ל אֶל דָּוִ֖ד חֶבְר֑וֹנָ/ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר הִנְ/נ֛וּ עַצְמְ/ךָ֥ וּֽ/בְשָׂרְ/ךָ֖ אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/001.yaml
  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
translation:
  language: de
  text: 'Da kamen alle Stämme Israels zu David nach Hebron und sagten: „Sieh, wir sind dein Gebein und dein Fleisch[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dein Gebein und dein Fleisch“ ist eine hebräische Verwandtschaftsformel und bezeichnet enge Blutsverwandtschaft beziehungsweise die Zugehörigkeit zu derselben Familie oder Gemeinschaft.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Das Waw consecutivum führt die Erzählung weiter; „Da“ gibt die zeitlich-fortschreitende Erzählbewegung in natürlichem Deutsch wieder.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: alle Stämme Israels
  rationale: Die Formulierung bewahrt den kollektiven, gesamtisraelitischen Sinn.
- source_word: אֶל דָּוִד חֶבְרֹנָה
  choice: zu David nach Hebron
  rationale: אֶל bezeichnet die Bewegung zu David; die Richtungsendung an חֶבְרוֹנָה wird mit „nach Hebron“ ausdrücklich wiedergegeben.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: und sagten
  rationale: Die übliche hebräische Redeeinleitung wird ohne die im Deutschen schwerfällige Verdoppelung „sagten, indem sie sprachen“ idiomatisch wiedergegeben.
- source_word: הִנּוּ
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird mit einem gegenwärtigen, würdevollen und nicht archaischen deutschen Ausdruck wiedergegeben.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: dein Gebein und dein Fleisch
  rationale: Die Reihenfolge und das Verwandtschaftsbild des Hebräischen bleiben erhalten. „Gebein“ klingt würdevoll und ist als kollektiver Singular im Deutschen verständlicher als das konkrete „Knochen“.
- source_word: אֲנָחְנוּ
  choice: wir sind
  rationale: Die verblos formulierte hebräische Nominalklausel erfordert im Deutschen die Kopula „sind“.
theological_decisions:
- issue: Verwandtschaftsformel und ihre politisch-theologische Bedeutung
  choice: „wir sind dein Gebein und dein Fleisch“
  alternative: „wir sind deine Verwandten“ oder „wir sind dein eigenes Volk“
  rationale: Die wörtlich-nahe Wiedergabe bewahrt sowohl das Bild gemeinsamer Abstammung als auch dessen politische Tragweite für Davids Königtum, ohne die Aussage auf eine bloße politische Allianz oder eine auslegende Paraphrase zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Richtungsendung bei „Hebron“ ist direkt im Haupttext wiedergegeben; daher ist dazu keine Fußnote nötig. Das körperliche Verwandtschaftsbild bleibt bewusst erhalten.
