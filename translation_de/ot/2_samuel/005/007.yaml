lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: eroberte
  rationale: Das Verb לכד bezeichnet hier die militärische Einnahme eines befestigten Ortes. „Eroberte“ ist im modernen Deutschen präzise und natürlich; das narrative ו wird zusammen mit dem Tempuszusammenhang wiedergegeben.
- source_word: וַ
  choice: Doch
  rationale: Die Verknüpfung nimmt den Gegensatz zur selbstsicheren Aussage der Jebusiter im vorherigen Vers auf. „Doch“ macht diesen leichten Kontrast idiomatisch sichtbar.
- source_word: מְצֻדַת
  choice: Festung
  rationale: מְצוּדָה bezeichnet einen befestigten, schwer einnehmbaren Ort. „Festung“ ist verständlich, würdig und lässt die genaue Bauform offen.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der Ortsname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: הִיא
  choice: das ist
  rationale: Das selbstständige Pronomen dient hier der erklärenden Gleichsetzung der Festung Zion mit der Stadt Davids. „Das ist“ gibt diese appositionelle Funktion natürlich wieder.
- source_word: עִיר דָּוִד
  choice: die Stadt Davids
  rationale: Die Genitivverbindung wird transparent und in der geläufigen deutschen Bezeichnung wiedergegeben.
