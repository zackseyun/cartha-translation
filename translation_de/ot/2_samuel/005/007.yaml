  text: But David captured the stronghold of Zion[a], that is, the City of David.
translation:
  language: de
  text: Doch David eroberte die Festung Zions[a]; sie ist die Stadt Davids.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schutzburg Zions“. Das hebräische Wort bezeichnet einen befestigten, schwer einnehmbaren Ort.'
