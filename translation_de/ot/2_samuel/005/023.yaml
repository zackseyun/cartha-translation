base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/023.yaml
  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
translation:
  language: de
  text: 'Da befragte David Jahwe, und er sagte: »Zieh nicht hinauf. Umgehe sie und greif sie gegenüber den Balsambäumen[a] an.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Baka-Bäumen«; traditionell: »Maulbeerbäumen«. Welche Baumart das hebräische Wort genau bezeichnet, ist ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: befragte ... Jahwe
  rationale: שׁאל mit ב und dem Gottesnamen bezeichnet hier das Einholen göttlicher Weisung. »Jahwe befragen« ist im Deutschen prägnant und kontextgerecht.
- source_word: לֹא תַעֲלֶה
  choice: Zieh nicht hinauf
  rationale: Die verneinte Verbform fungiert in der direkten Rede als Anweisung. »Hinaufziehen« bewahrt sowohl das Bewegungsverb als auch seinen militärischen Klang.
- source_word: הָסֵב אֶל אַחֲרֵיהֶם
  choice: Geh ihnen in den Rücken
  rationale: Die Wendung beschreibt ein taktisches Umgehen bis hinter die feindliche Stellung; die deutsche Formulierung gibt das Ziel der Bewegung natürlich wieder.
- source_word: וּבָאתָ לָהֶם
  choice: greif sie ... an
  rationale: בוא mit ל hat im militärischen Zusammenhang eine feindliche Stoßrichtung. »Angreifen« macht den kontextuell gegebenen Sinn verständlich, ohne ein zusätzliches Ergebnis vorwegzunehmen.
- source_word: מִמּוּל
  choice: gegenüber
  rationale: Das Wort bezeichnet eine Position gegenüber oder vor einem Bezugspunkt und bleibt mit »gegenüber« räumlich offen.
- source_word: בְּכָאִים
  choice: Balsambäumen
  rationale: Die genaue Baumart ist unsicher. »Balsambäume« gibt eine verbreitete lexikalische Deutung wieder; andere Identifizierungen werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Bundesnamen in einer im modernen Deutschen etablierten Form wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Anweisung ist knapp und direkt formuliert; die Unsicherheit bei der Baumart bleibt durch die Fußnote sichtbar.
