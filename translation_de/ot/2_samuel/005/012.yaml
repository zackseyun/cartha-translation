  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/כִי֙ נִשֵּׂ֣א מַמְלַכְתּ֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/012.yaml
  text: And David knew that Yahweh had established him as king over Israel[a], and that he had exalted his kingdom for the sake of his people Israel.
translation:
  language: de
  text: Und David erkannte, dass Jahwe ihn als König über Israel eingesetzt hatte und dass er sein Königtum um seines Volkes Israel willen erhöht hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Pronomen „seines“ kann sich auch auf David statt auf Jahwe beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: erkannte
  rationale: ידע bezeichnet Wissen oder ein Zum-Erkennen-Kommen. Im erzählenden Zusammenhang gibt „erkannte“ die gewonnene Einsicht Davids natürlicher wieder als das statischere „wusste“.
- source_word: הֱכִינוֹ
  choice: ihn … eingesetzt hatte
  rationale: Der Hifil von כון bedeutet festmachen, begründen oder bestätigen. Bei der Einsetzung ins Königsamt vermittelt „eingesetzt“ die königliche Stellung idiomatisch; der Aspekt der Festigung bleibt durch den Kontext erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְמֶלֶךְ עַל־יִשְׂרָאֵל
  choice: als König über Israel
  rationale: לְ bezeichnet hier Amt oder Funktion, עַל den Herrschaftsbereich.
- source_word: נִשֵּׂא
  choice: erhöht hatte
  rationale: Die Form von נשׂא bezeichnet hier das Emporheben beziehungsweise Erhöhen. „Erhöht“ bewahrt die Bildlichkeit und passt zum königlichen Zusammenhang.
- source_word: מַמְלַכְתּוֹ
  choice: sein Königtum
  rationale: ממלכה kann Reich, Königsherrschaft oder Königtum bedeuten. „Königtum“ bezeichnet hier Davids von Jahwe gefestigte Herrschaft, ohne unnötig ein Territorium in den Vordergrund zu stellen.
- source_word: בַּעֲבוּר
  choice: um … willen
  rationale: 'Die Wendung drückt hier Zweck beziehungsweise Begünstigung aus: Die Erhöhung geschieht zugunsten Israels.'
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: seines Volkes Israel
  rationale: 'Die wahrscheinlichste Beziehung des Suffixes ist Jahwe: Israel ist sein Volk. Da das deutsche Pronomen grammatisch zugleich auf David bezogen werden kann, wird die echte Mehrdeutigkeit in einer Fußnote erläutert.'
theological_decisions:
- issue: Bezugswort des Suffixes in עַמּוֹ („sein Volk“)
  choice: 'Das Suffix wird im Haupttext auf Jahwe bezogen: „seines Volkes Israel“.'
  alternative: 'Das Suffix kann auf David bezogen werden: „Davids Volk Israel“.'
  rationale: Jahwe ist im unmittelbaren Satz das handelnde Subjekt, das David einsetzt und dessen Königtum erhöht; zudem ist Israel häufig als Jahwes Volk bezeichnet. Die hebräische Grammatik schließt den Bezug auf David jedoch nicht aus, weshalb diese Möglichkeit ausdrücklich erhalten bleibt.
- issue: Subjekt von נִשֵּׂא („erhöht hatte“)
  choice: Jahwe wird als fortgeführtes Subjekt verstanden.
  alternative: Die Form könnte isoliert als passiv beziehungsweise als Aussage über das Erhöhtsein des Königtums aufgefasst werden.
  rationale: Der Satzfluss führt Jahwe als Handelnden fort. Die vokalisierte Form und syntaktische Knappheit erlauben eine gewisse formale Spannung; die deutsche aktive Wiedergabe folgt dem wahrscheinlichsten Zusammenhang, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erkannte“ ist erzählerisch natürlich; „Königtum“ wahrt den Bezug auf die königliche Herrschaft. Der Gottesname erscheint als „Jahwe“. Die Fußnote bewahrt die Mehrdeutigkeit des hebräischen Pronomens.
