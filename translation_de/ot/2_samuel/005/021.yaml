id: 2SA.5.21
reference: 2 Samuel 5:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּעַזְבוּ שָׁ֖ם אֶת עֲצַבֵּי/הֶ֑ם וַ/יִּשָּׂאֵ֥/ם דָּוִ֖ד וַ/אֲנָשָֽׁי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/021.yaml
  text: And they left their idols there[b][a], and David and his men carried them away.
translation:
  language: de
  text: Und sie ließen dort ihre Götzenbilder[b] zurück, und David und seine Männer nahmen sie mit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 1. Chronik 14,12 wird zusätzlich berichtet, dass David befahl, die Götzenbilder zu verbrennen. Der hebräische Text von 2. Samuel sagt hier nur, dass David und seine Männer sie mitnahmen.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Kultbilder“. Das hebräische Wort bezeichnet hier Bilder, die religiös verehrt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: sie ließen … zurück
  rationale: עזב bedeutet hier, etwas beim Rückzug zurückzulassen. Die deutsche Verbklammer „ließen … zurück“ gibt den natürlichen Erzählsinn wieder.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb wird schlicht und unmittelbar mit „dort“ wiedergegeben.
- source_word: עֲצַבֵּיהֶם
  choice: ihre Götzenbilder
  rationale: Der Ausdruck bezeichnet hier kultisch verehrte Bilder der Philister. „Götzenbilder“ benennt sowohl ihren Bildcharakter als auch ihre religiöse Funktion; die allgemeinere Alternative „Kultbilder“ bleibt in der Fußnote sichtbar.
- source_word: וַיִּשָּׂאֵם
  choice: nahmen sie mit
  rationale: נשא kann „heben“, „tragen“ oder „wegnehmen“ bedeuten. Im Zusammenhang bezeichnet es das Mitnehmen der zurückgelassenen Bilder, ohne über ihren unmittelbaren Verbleib mehr auszusagen.
- source_word: דָּוִד וַאֲנָשָׁיו
  choice: David und seine Männer
  rationale: Die wörtliche und im militärischen Zusammenhang natürliche Wiedergabe bewahrt die Bezeichnung für Davids Begleiter, ohne sie enger als „Soldaten“ festzulegen.
theological_decisions:
- issue: Verhältnis zum Parallelbericht in 1. Chronik 14,12, der die Verbrennung der Bilder erwähnt
  choice: Den masoretischen Text von 2. Samuel mit „nahmen sie mit“ wiedergeben und die zusätzliche Angabe aus der Chronik nur in einer Fußnote nennen
  alternative: Den Vers harmonisierend so formulieren, als seien die Bilder hier ausdrücklich verbrannt worden
  rationale: Der hebräische Samueltext sagt lediglich, dass David und seine Männer die Bilder mitnahmen. Die in 1. Chronik genannte anschließende Verbrennung darf nicht in den Wortlaut dieses Verses hineingetragen werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die koordinierende Satzstruktur des Hebräischen bleibt erhalten; „nahmen sie mit“ ist idiomatisch und vermeidet eine Harmonisierung mit dem Chronikbericht.
