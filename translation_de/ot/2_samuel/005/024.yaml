base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/024.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
translation:
  language: de
  text: Und wenn du das Geräusch von Schritten in den Wipfeln der Balsambäume[a] hörst, dann handle entschlossen; denn dann ist Jahwe vor dir ausgezogen, um das Lager der Philister zu schlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Baka-Bäume“; welche Baumart das hebräische Wort genau bezeichnet, ist unsicher. Traditionell wurde es auch mit „Maulbeerbäume“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי בְשָׁמְעֲךָ
  choice: Und sobald du … hörst
  rationale: Die Konstruktion aus היה und dem Infinitiv mit ב leitet den künftigen Zeitpunkt für Davids Handeln ein. „Sobald“ gibt zugleich den zeitlichen Zusammenhang und die unmittelbare Reaktion natürlich wieder.
- source_word: קוֹל צְעָדָה
  choice: das Geräusch von Schritten
  rationale: קוֹל bezeichnet ein hörbares Geräusch, צְעָדָה das Schreiten bzw. die Schritte. Die Wiedergabe bleibt bildhaft und legt nicht stärker als der hebräische Text fest, wer marschiert.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: in den Wipfeln der Balsambäume
  rationale: רָאשִׁים bezeichnet hier die Baumwipfel. Die genaue Art der בְּכָאִים ist unsicher; „Balsambäume“ ist eine verbreitete, plausible Bezeichnung, deren Unsicherheit in der Fußnote kenntlich bleibt.
- source_word: אָז תֶּחֱרָץ
  choice: dann handle entschlossen
  rationale: חרץ fordert in diesem Zusammenhang entschiedenes, tatkräftiges Handeln. Die Formulierung bewahrt die Dringlichkeit, ohne die Bedeutung allein auf Schnelligkeit einzuengen.
- source_word: יָצָא יְהוָה לְפָנֶיךָ
  choice: ist Jahwe vor dir ausgezogen
  rationale: Das Perfekt bezeichnet die zu diesem Zeitpunkt bereits eingesetzte Handlung. „Vor dir ausgezogen“ wahrt das militärische Bild davon, dass Jahwe David vorausgeht.
- source_word: לְהַכּוֹת בְּמַחֲנֵה פְלִשְׁתִּים
  choice: um das Heer der Philister zu schlagen
  rationale: נכה bezeichnet hier das Schlagen im Kampf. מַחֲנֶה kann sowohl das Lager als auch das darin versammelte Heer meinen; im Zusammenhang des göttlichen Angriffs ist „Heer“ im Deutschen natürlich und sachgerecht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Jahwes vorausgehendes Handeln im Kampf
  choice: „ist Jahwe vor dir ausgezogen“ als bereits eingesetztes göttliches Handeln
  alternative: „wird Jahwe vor dir ausziehen“
  rationale: 'Das hebräische Perfekt wird in Bezug auf das hörbare Zeichen als zu diesem Zeitpunkt bereits vollzogener Beginn dargestellt. Dadurch bleibt die Spannung erhalten: David soll handeln, weil Jahwe schon vorausgegangen ist.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung folgt der zeitlichen und begründenden Struktur des Hebräischen; militärische Bildsprache und botanische Unsicherheit bleiben erhalten.
