  yaml_path: translation/ot/2_samuel/005/004.yaml
  text: David was thirty years old when he began to reign[b][a], and he reigned forty years.
translation:
  language: de
  text: David war dreißig Jahre alt, als er König wurde,[a] und er regierte vierzig Jahre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als er zu regieren begann«.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: war dreißig Jahre alt
  rationale: Die wörtliche hebräische Wendung »ein Sohn von dreißig Jahren« ist eine übliche Altersangabe und wird im modernen Deutschen sinngemäß und natürlich wiedergegeben.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die Präposition ב mit dem Infinitiv von מלך und dem Suffix der 3. Person Singular bezeichnet hier den Zeitpunkt des Regierungsantritts. »Als er König wurde« gibt dies knapp und idiomatisch wieder; möglich ist auch »als er zu regieren begann«.
- source_word: מָלָךְ
  choice: er regierte
  rationale: Das Verb מלך bezeichnet das Ausüben der Königsherrschaft; »regierte« ist in dieser Regierungsnotiz die natürliche deutsche Wiedergabe.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre
  rationale: Die Verbindung aus Zahlwort und Substantiv gibt die Dauer von Davids Herrschaft an.
- source_word: דָּוִד
  choice: David
  rationale: Der Personenname wird gemäß der etablierten deutschen biblischen Namensform wiedergegeben.
