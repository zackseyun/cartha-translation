base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and King David made a covenant with them at Hebron before Yahweh[b], and they anointed David king over Israel.
translation:
  language: de
  text: Da kamen alle Ältesten Israels zum König nach Hebron. König David schloss in Hebron vor Jahwe[b] einen Bund[a] mit ihnen, und sie salbten David zum König über Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „schnitt einen Bund“; eine hebräische Redewendung für das Schließen eines Bundes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in der Gegenwart Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Das narrative Wayyiqtol von בוא bezeichnet hier das Kommen zum anschließend genannten Ziel; „Da kamen“ bildet den Fortgang der Erzählung natürlich ab.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: alle Ältesten Israels
  rationale: Bewahrt sowohl die Gesamtheit durch כָּל als auch die Funktion der זקנים als führende Repräsentanten Israels.
- source_word: אֶל הַמֶּלֶךְ חֶבְרוֹנָה
  choice: zum König nach Hebron
  rationale: Die Richtungsendung an חֶבְרוֹנָה bezeichnet eine Bewegung nach Hebron; die deutsche Formulierung macht zugleich deutlich, dass ihr Ziel der dortige König war.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: schloss ... einen Bund
  rationale: Die hebräische Wendung bedeutet wörtlich „einen Bund schneiden“. „Einen Bund schließen“ ist die entsprechende natürliche deutsche Redewendung und erhält den feierlich-verbindlichen Sinn.
- source_word: לָהֶם
  choice: mit ihnen
  rationale: Im Zusammenhang mit כרת ברית bezeichnet die Präposition die Parteien, mit denen der Bund geschlossen wird.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ bewahrt die räumlich-rechtliche Bildsprache der Wendung und kann zugleich „in der Gegenwart“ bedeuten.
- source_word: וַיִּמְשְׁחוּ
  choice: sie salbten
  rationale: משׁח bezeichnet im königlichen Zusammenhang den konkreten Akt der Salbung und nicht lediglich eine allgemeine Einsetzung oder Weihe.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: zum König über Israel
  rationale: Die Formulierung gibt sowohl die Einsetzung zum König als auch den Herrschaftsbereich über Israel knapp und genau wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift „Jahwe“ gibt den im hebräischen Text stehenden Eigennamen erkennbar wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsgehalt von בְּרִית
  choice: Bund
  alternative: Vertrag oder Vereinbarung
  rationale: „Bund“ bewahrt in diesem königlich-politischen und vor Jahwe vollzogenen Zusammenhang die feierliche, bindende und theologisch gewichtige Bedeutung des hebräischen Begriffs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Hebron“ bleibt entsprechend dem hebräischen Text erhalten. Der Satzbau wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die erzählerische Abfolge und die feierliche Bundessprache bleiben gewahrt.
