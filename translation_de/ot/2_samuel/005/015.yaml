lexical_decisions:
- source_word: יִבְחָר
  choice: Jibhar
  rationale: Hebräischer Personenname; die Schreibweise mit J entspricht der üblichen deutschen Wiedergabe des anlautenden Jod in biblischen Namen.
- source_word: אֱלִישׁוּעַ
  choice: Elischua
  rationale: Hebräischer Personenname in einer Namensliste; nach gängiger deutscher Bibeltradition transliteriert. Der Schlusslaut Ajin wird in der gewöhnlichen deutschen Namensform nicht eigens wiedergegeben.
- source_word: נֶפֶג
  choice: Nefeg
  rationale: Hebräischer Personenname; die Form gibt die hebräischen Konsonanten und Vokale in einer für deutsche Leser natürlichen Schreibweise wieder.
- source_word: יָפִיעַ
  choice: Jafia
  rationale: Hebräischer Personenname; J gibt das anlautende Jod nach deutscher Konvention wieder, während das abschließende Ajin in der eingebürgerten Namensform nicht eigens markiert wird.
- source_word: וְ
  choice: und
  rationale: Die vorangestellte Konjunktion verbindet jeden Namen mit dem vorherigen Kontext beziehungsweise dem nächsten Listenelement. In natürlichem Deutsch wird sie in der Aufzählung durch Kommas und ein einziges „und“ vor dem letzten Namen wiedergegeben; die hebräische Wiederholung wird in einer Fußnote dokumentiert.
