base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/011.yaml
  text: And Hiram king of Tyre sent messengers to David[a], and cedar logs, and craftsmen of wood, and craftsmen of stone walling[b]; and they built a house for David.
translation:
  language: de
  text: Hiram, der König von Tyrus, sandte Boten zu David sowie Zedernholz, Holzhandwerker und Steinmetze für den Mauerbau[a]. Sie bauten David ein Haus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Maurer“. Die hebräische Wendung enthält sowohl „Stein“ als auch „Mauer/Wand“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen Palast“. Wörtlich steht hier „ein Haus“; im königlichen Zusammenhang kann damit ein Palast gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: Die übliche und im deutschen Erzählstil angemessene Wiedergabe von שׁלח.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: Hiram, der König von Tyrus
  rationale: Der Personenname und die Ortsbezeichnung folgen der herkömmlichen deutschen Namensform; die Apposition gibt die hebräische Statusangabe klar wieder.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Der Ausdruck kann gewöhnliche Boten oder diplomatische Gesandte bezeichnen. „Boten“ wahrt den weiteren Bedeutungsumfang.
- source_word: וַעֲצֵי אֲרָזִים
  choice: sowie Zedernholz
  rationale: Wörtlich handelt es sich um „Zedernbäume/-hölzer“, idiomatisch also um Bauholz aus Zedern. „Zedernholz“ ist im Deutschen natürlich und legt die genaue Form des gelieferten Holzes nicht unnötig fest.
- source_word: חָרָשֵׁי עֵץ
  choice: Holzhandwerker
  rationale: חָרָשׁ bezeichnet einen Fachhandwerker. „Holzhandwerker“ bleibt weiter als das möglicherweise zu enge „Zimmerleute“.
- source_word: חָרָשֵׁי אֶבֶן קִיר
  choice: Steinmetze für den Mauerbau
  rationale: Die schwierige Wortgruppe enthält ausdrücklich „Stein“ und „Mauer/Wand“. Die Formulierung bezeichnet verständlich Fachleute für steinerne Mauerarbeiten und bewahrt beide Bestandteile.
- source_word: וַיִּבְנוּ בַיִת לְדָוִד
  choice: Sie bauten David ein Haus
  rationale: Die pluralische Verbform bezieht sich naheliegend auf die genannten Handwerker. Der deutsche Dativ gibt לְדָוִד knapp und natürlich wieder; „Haus“ wahrt den Grundsinn von בַיִת.
theological_decisions:
- issue: Bedeutungsumfang von בַיִת im königlichen Zusammenhang
  choice: Haus
  alternative: Palast
  rationale: בַיִת bedeutet grundsätzlich „Haus“, kann im königlichen Kontext jedoch eine Palastresidenz meinen. Der Haupttext bewahrt den lexikalischen Grundsinn, während die kontextuelle Möglichkeit in einer Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung wird mit „sowie“ lesbar in den deutschen Satzbau eingebunden. Der zweite hebräische Erzählungssatz steht als eigener deutscher Satz, um die lange Reihung natürlich aufzulösen. Sämtliche Fußnotenmarker stehen an den tatsächlich erläuterten Ausdrücken.
