  text: וַ/יַּ֤עַשׂ דָּוִד֙ כֵּ֔ן כַּ/אֲשֶׁ֥ר צִוָּ֖/הוּ יְהוָ֑ה וַ/יַּךְ֙ אֶת פְּלִשְׁתִּ֔ים מִ/גֶּ֖בַע עַד בֹּאֲ/ךָ֥ גָֽזֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/025.yaml
  text: And David did so[a], just as Yahweh had commanded him[b], and he struck down the Philistines from Geba as far as Gezer.
translation:
  language: de
  text: David tat es so, wie Jahwe ihm geboten hatte, und schlug die Philister von Geba[a] bis zum Zugang nach Geser[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische masoretische Text lautet „Geba“. Einige Übersetzungen bieten aufgrund abweichender Textüberlieferung oder unter Berücksichtigung der Parallelstelle einen anderen Ortsnamen.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „bis zu deinem Kommen nach Geser“; gemeint ist der Zugang zu Geser oder dessen Umgebung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כֵּן
  choice: tat es so
  rationale: Die feste Verbindung bedeutet, dass David die zuvor erteilte Weisung ausführte. „Tat es so“ ist im Deutschen knapp, natürlich und rückbezüglich.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: wie ... ihm geboten hatte
  rationale: Die Formulierung wahrt die genaue Entsprechung zwischen dem göttlichen Auftrag und Davids Handeln; das Plusquamperfekt macht die zeitliche Vorordnung des Gebots deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den Namenscharakter des Tetragramms, statt es durch einen Titel zu ersetzen.
- source_word: וַיַּךְ
  choice: schlug
  rationale: Im militärischen Zusammenhang bezeichnet נכה das erfolgreiche Schlagen eines Gegners. „Schlug“ erhält das konkrete Bild und vermeidet sowohl das altertümliche „schlug nieder“ in gehobenem Sinn als auch eine unnötige Festlegung darauf, dass alle getötet wurden.
- source_word: פְּלִשְׁתִּים
  choice: die Philister
  rationale: Dies ist die etablierte deutsche Bezeichnung der Volksgruppe.
- source_word: מִגֶּבַע
  choice: von Geba
  rationale: Der masoretische Text nennt ausdrücklich Geba. Diese Lesart wird im Haupttext bewahrt, während die abweichende Überlieferungs- und Parallelstellenlage in einer Fußnote kenntlich gemacht wird.
- source_word: עַד בֹּאֲךָ גָזֶר
  choice: bis in die Nähe von Geser
  rationale: Wörtlich steht eine Wendung mit „deinem Kommen nach Geser“. Sie bezeichnet hier den räumlichen Endpunkt beziehungsweise den Zugang oder die Umgebung der Stadt. „Bis in die Nähe von Geser“ gibt diesen Sinn verständlich wieder, ohne zu behaupten, die Stadt selbst sei erreicht oder eingenommen worden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ wahrt diesen Befund und entspricht der gebräuchlichen deutschen Form, ohne den Namen durch einen Herrschaftstitel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Erzählweise. Die Satzstruktur folgt dem fortlaufenden hebräischen Bericht. „Bis in die Nähe von Geser“ bewahrt die räumliche Nuance des hebräischen Idioms; die Ortsnamen erscheinen in ihren etablierten deutschen Formen.
