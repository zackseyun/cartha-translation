  text: בְּ/חֶבְרוֹן֙ מָלַ֣ךְ עַל יְהוּדָ֔ה שֶׁ֥בַע שָׁנִ֖ים וְ/שִׁשָּׁ֣ה חֳדָשִׁ֑ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֗ךְ שְׁלֹשִׁ֤ים וְ/שָׁלֹשׁ֙ שָׁנָ֔ה עַ֥ל כָּל יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/005.yaml
  text: In Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.
translation:
  language: de
  text: In Hebron regierte er sieben Jahre und sechs Monate über Juda, und in Jerusalem regierte er dreiunddreißig Jahre über ganz Israel und Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֶבְרוֹן
  choice: In Hebron
  rationale: Die Präposition ב bezeichnet hier den Ort; »in Hebron« ist im modernen Deutschen die natürliche Wiedergabe.
- source_word: מָלַךְ
  choice: regierte er
  rationale: Das Verb beschreibt hier zusammenfassend die Dauer seiner Königsherrschaft, nicht nur den Herrschaftsantritt.
- source_word: עַל יְהוּדָה
  choice: über Juda
  rationale: עַל bezeichnet in Verbindung mit מלך das Volk beziehungsweise Herrschaftsgebiet, über das der König regiert.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: sieben Jahre und sechs Monate
  rationale: Die Zeitangabe wird in ihrer hebräischen Reihenfolge klar und idiomatisch wiedergegeben.
- source_word: וּבִירוּשָׁלַם
  choice: und in Jerusalem
  rationale: Konjunktion und Präposition führen den zweiten Ort seiner Königsherrschaft ein.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנָה
  choice: dreiunddreißig Jahre
  rationale: Die hebräische Zahl wird entsprechend dem üblichen modernen deutschen Zahlwort wiedergegeben.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: über ganz Israel und Juda
  rationale: Die Wiedergabe bewahrt sowohl den Gesamtumfang der Herrschaft als auch die im Hebräischen genannte Unterscheidung zwischen Israel und Juda.
theological_decisions: []
