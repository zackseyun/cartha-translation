  text: וּ/בָ֣אנוּ אֵלָ֗י/ו ב/אחת הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נִמְצָ֣א שָׁ֔ם וְ/נַ֣חְנוּ עָלָ֔י/ו כַּ/אֲשֶׁ֛ר יִפֹּ֥ל הַ/טַּ֖ל עַל הָ/אֲדָמָ֑ה וְ/לֹֽא נ֥וֹתַר בּ֛/וֹ וּ/בְ/כָל הָ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ גַּם אֶחָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/012.yaml
  text: Then we will come upon him in one of the places where he is found[a], and we will settle on him just as the dew falls on the ground; and not one will be left of him and of all the men who are with him—not even one.
translation:
  language: de
  text: Dann werden wir an einem der Orte, an denen er sich aufhält, über ihn kommen und uns auf ihn niederlassen[a], wie der Tau auf den Erdboden fällt. Von ihm und von all den Männern, die bei ihm sind, wird nicht ein Einziger übrig bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über ihn herfallen“. Das hebräische Verb bedeutet wörtlich „ruhen“ oder „sich niederlassen“ und beschreibt hier bildhaft, wie das Heer ihn überwältigend bedeckt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאנוּ אֵלָיו
  choice: Dann werden wir … über ihn kommen
  rationale: בוא mit אֶל bezeichnet zunächst das Kommen zu jemandem; im militärischen Zusammenhang ist es feindlich gemeint. „Über ihn kommen“ bewahrt sowohl die Bewegung als auch den Angriffssinn, ohne den folgenden eigenen Bildausdruck vorwegzunehmen.
- source_word: בְאַחַת הַמְּקוֹמוֹת אֲשֶׁר נִמְצָא שָׁם
  choice: an einem der Orte, an denen er sich aufhält
  rationale: Die Formulierung gibt den unbestimmten Aufenthaltsort Davids wieder. Das deutsche „sich aufhält“ ist hier natürlicher als das wörtliche „gefunden wird“, ohne zusätzliche Gewissheit oder Möglichkeit einzutragen.
- source_word: וְנַחְנוּ עָלָיו
  choice: und uns auf ihm niederlassen
  rationale: נוּחַ bedeutet „ruhen, sich niederlassen“. Die Wiedergabe erhält den bewussten Unterschied zum folgenden נפל („fallen“) und zugleich das Bild einer vollständig bedeckenden Übermacht.
- source_word: כַּאֲשֶׁר יִפֹּל הַטַּל עַל הָאֲדָמָה
  choice: wie der Tau auf den Erdboden fällt
  rationale: Die direkte Wiedergabe bewahrt das Bild des Taus, der den Boden umfassend und unausweichlich bedeckt.
- source_word: וְלֹא נוֹתַר … גַּם אֶחָד
  choice: wird nicht ein Einziger übrig bleiben
  rationale: Das Niphal von יתר bezeichnet das Übrigbleiben; גַּם אֶחָד verstärkt die Aussage bis hin zu einer einzigen Person.
- source_word: בּוֹ וּבְכָל הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: Von ihm und von all den Männern, die bei ihm sind
  rationale: Die Formulierung bezieht die Aussage sowohl auf David selbst als auch auf seine männlichen Begleiter beziehungsweise Kämpfer.
theological_decisions: []
