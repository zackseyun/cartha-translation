  text: וַ/יְהִ֕י כְּ/ב֥וֹא דָוִ֖ד מַחֲנָ֑יְמָ/ה וְ/שֹׁבִ֨י בֶן נָחָ֜שׁ מֵ/רַבַּ֣ת בְּנֵֽי עַמּ֗וֹן וּ/מָכִ֤יר בֶּן עַמִּיאֵל֙ מִ/לֹּ֣א דְבָ֔ר וּ/בַרְזִלַּ֥י הַ/גִּלְעָדִ֖י מֵ/רֹגְלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/027.yaml
  text: When David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, and Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim,
translation:
  language: de
  text: 'Als David nach Mahanajim kam, waren Schobi, der Sohn des Nahasch, aus Rabba der Ammoniter, Machir, der Sohn Ammiëls, aus Lo-Dabar und Barsillai, der Gileaditer, aus Rogelim da:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: Als … kam, waren … da
  rationale: Die Konstruktion leitet eine neue Erzählentwicklung ein und setzt mit כ plus Infinitiv einen zeitlichen Nebensatz. Die deutsche Fassung gibt dies natürlich wieder und führt zugleich zu der in Vers 28 fortgesetzten Aufzählung.
- source_word: מַחֲנָיְמָה
  choice: nach Mahanajim
  rationale: Das direktive He bezeichnet die Bewegung auf den Ort zu; im Deutschen ist „nach“ bei Ortsnamen idiomatisch.
- source_word: שֹׁבִי בֶן נָחָשׁ
  choice: Schobi, der Sohn des Nahasch
  rationale: Eigen- und Vatername werden nach gebräuchlicher deutscher Bibelnamenschreibung transliteriert; die Patronymik bleibt ausdrücklich erhalten.
- source_word: מֵרַבַּת בְּנֵי עַמּוֹן
  choice: aus Rabba der Ammoniter
  rationale: Rabba ist der Stadtname; „der Ammoniter“ gibt die ethnisch-geografische Zuordnung בני עמון knapp und natürlich wieder.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: Machir, der Sohn Ammiëls
  rationale: Die Namen werden transliteriert und die Patronymik formal bewahrt. Das Trema in „Ammiël“ verdeutlicht im Deutschen die getrennte Aussprache.
- source_word: מִלֹּא דְבָר
  choice: aus Lo-Dabar
  rationale: Der Ortsname wird in einer im Deutschen gut lesbaren transliterierten Form mit Bindestrich wiedergegeben.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Barsillai, der Gileaditer
  rationale: Das Gentilizium bezeichnet Barsillais regionale Herkunft beziehungsweise Zugehörigkeit und wird knapp substantivisch wiedergegeben.
- source_word: מֵרֹגְלִים
  choice: aus Rogelim
  rationale: Der Ortsname wird transliteriert; מן bezeichnet die Herkunft.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Da der hebräische Satz über die Versgrenze hinweg in Vers 28 fortgesetzt wird, endet der Vers mit einem Doppelpunkt. „Waren … da“ macht die im Hebräischen durch ויהי eröffnete und anschließend nur nominal fortgeführte Konstruktion im Deutschen verständlich, ohne die in Vers 28 folgende Handlung vorwegzunehmen.
