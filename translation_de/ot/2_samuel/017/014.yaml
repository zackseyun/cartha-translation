source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל טוֹבָ֗ה עֲצַת֙ חוּשַׁ֣י הָ/אַרְכִּ֔י מֵ/עֲצַ֖ת אֲחִיתֹ֑פֶל וַ/יהוָ֣ה צִוָּ֗ה לְ/הָפֵ֞ר אֶת עֲצַ֤ת אֲחִיתֹ֨פֶל֙ הַ/טּוֹבָ֔ה לְ/בַ/עֲב֗וּר הָבִ֧יא יְהוָ֛ה אֶל אַבְשָׁל֖וֹם אֶת הָ/רָעָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/014.yaml
  text: Then Absalom and all the men of Israel said[a], “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For Yahweh had ordained to frustrate the good counsel of Ahithophel[b], so that Yahweh might bring disaster on Absalom.
translation:
  language: de
  text: 'Da sagten Absalom und alle Männer Israels: »Der Rat Huschais, des Arkiter, ist besser als der Rat Ahitofels.« Denn Jahwe hatte bestimmt[a], den guten Rat Ahitofels zu vereiteln, damit Jahwe Unheil über Absalom bringe[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hatte befohlen«. Das hebräische Verb bedeutet häufig »befehlen«, beschreibt hier aber Jahwes wirksame Bestimmung hinsichtlich des Rats Ahitofels.'
    reason: lexical_alternative
  - marker: b
    text: »Unheil« gibt ein hebräisches Wort wieder, das auch »Böses«, »Unglück« oder »Verderben« bedeuten kann; hier bezeichnet es den Schaden, der Absalom im Gericht trifft.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagten
  rationale: Das singularische Verb steht vor einem zusammengesetzten Subjekt und wird im Deutschen sinngemäß im Plural wiedergegeben; »da« führt die Erzählung natürlich fort.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: und alle Männer Israels
  rationale: אִישׁ ist formal Singular, hier aber kollektiv gebraucht. Die Wiedergabe bewahrt die geschlechtsspezifische Formulierung des Hebräischen.
- source_word: טוֹבָה ... מֵעֲצַת
  choice: ist besser als der Rat
  rationale: Durch die Konstruktion mit מִן ist das Adjektiv komparativ zu verstehen.
- source_word: עֲצַת
  choice: Rat
  rationale: עֵצָה bezeichnet hier sowohl Beratung als auch den empfohlenen strategischen Plan; »Rat« wahrt diese Bedeutungsbreite.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Huschai, der Arkiter
  rationale: Die Namen und die Herkunftsbezeichnung werden in einer im Deutschen üblichen, quellennahen Form wiedergegeben.
- source_word: צִוָּה
  choice: hatte bestimmt
  rationale: Das Verb bedeutet gewöhnlich »befehlen«, bezeichnet hier jedoch Jahwes wirksame Festlegung hinsichtlich des Rats Ahitofels. »Bestimmt« ist im Kontext natürlich, ohne eine bestimmte dogmatische Systematik einzutragen.
- source_word: לְהָפֵר
  choice: zu vereiteln
  rationale: Der Hifil von פרר bezeichnet hier das Unwirksammachen beziehungsweise Durchkreuzen eines Rats.
- source_word: הַטּוֹבָה
  choice: den guten
  rationale: Die ausdrückliche Bewertung des Rats Ahitofels als gut bleibt erhalten, obwohl er vereitelt werden soll.
- source_word: לְבַעֲבוּר הָבִיא
  choice: damit ... bringe
  rationale: Die Konstruktion bezeichnet Zweck beziehungsweise beabsichtigtes Ergebnis; der deutsche Konjunktiv fügt sich in den abhängigen Finalsatz.
- source_word: הָרָעָה
  choice: Unheil
  rationale: רָעָה kann Böses, Unglück oder Unheil bedeuten. Hier geht es um den Untergang beziehungsweise Schaden, der Absalom im Gericht trifft, nicht ausdrücklich um moralisches Böses.
theological_decisions:
- issue: Wiedergabe von יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen; »Jahwe« bewahrt ihn als Eigennamen.
- issue: Göttliches Handeln in צִוָּה לְהָפֵר
  choice: hatte bestimmt, ... zu vereiteln
  alternative: hatte befohlen, ... zunichtezumachen
  rationale: Die Formulierung hält an der ausdrücklichen göttlichen Veranlassung fest, ohne sie durch eine konfessionell geprägte Deutung näher zu systematisieren.
- issue: Das von Jahwe gebrachte הָרָעָה
  choice: Unheil
  alternative: Böses
  rationale: Im Erzählzusammenhang bezeichnet das Wort die Verderben bringende Folge des Gerichts über Absalom. »Unheil« erhält den negativen Gehalt, ohne moralisches Übel als Bedeutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die doppelte Nennung Jahwes und die Spannung zwischen Ahitofels »gutem« Rat und dessen göttlicher Vereitelung bleiben bewusst erhalten. Sämtliche Fußnotenmarker stehen im Haupttext.
