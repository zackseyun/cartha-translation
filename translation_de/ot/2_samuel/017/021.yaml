base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/021.yaml
  text: After they had gone, they came up out of the well and went and told King David. They said to David, “Get up and cross over the water quickly, for this is what Ahithophel has advised against you.”
translation:
  language: de
  text: 'Nachdem sie weggegangen waren, stiegen sie aus dem Brunnen herauf, gingen zu König David und berichteten ihm. Sie sagten zu David: »Brecht auf und überquert schnell das Wasser, denn so hat Ahitofel gegen euch geraten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי לֶכְתָּם
  choice: Nachdem sie weggegangen waren
  rationale: Gibt die zeitliche Konstruktion natürlich wieder; das Subjekt von »sie« ergibt sich aus dem Kontext.
- source_word: וַיַּעֲלוּ מֵהַבְּאֵר
  choice: stiegen die beiden aus dem Brunnen herauf
  rationale: Das Verb bezeichnet das Heraufsteigen; »die beiden« macht das im Kontext gemeinte Botenpaar verständlich, ohne die Referenz umzudeuten.
- source_word: וַיַּגִּדוּ לַמֶּלֶךְ דָּוִד
  choice: gingen zu König David und berichteten ihm alles
  rationale: »Berichteten« trifft נגד im Erzählkontext. »Alles« ist im Deutschen idiomatisch, auch wenn das Objekt im Hebräischen unausgesprochen bleibt.
- source_word: קוּמוּ
  choice: Brecht auf
  rationale: Der Pluralimperativ fordert David samt Begleitern zum sofortigen Handeln auf; »Brecht auf« klingt hier natürlicher als das wörtliche »Steht auf«.
- source_word: וְעִבְרוּ מְהֵרָה אֶת־הַמַּיִם
  choice: und überquert schnell das Wasser
  rationale: Bewahrt die unspezifische Bezeichnung »das Wasser« des hebräischen Textes und den Dringlichkeitsakzent.
- source_word: כִּי כָכָה יָעַץ עֲלֵיכֶם אֲחִיתֹפֶל
  choice: denn diesen Rat hat Ahitofel gegen euch gegeben
  rationale: Gibt כָכָה als Rückverweis auf den zuvor übermittelten Plan und עֲלֵיכֶם als feindliche Ausrichtung wieder.
