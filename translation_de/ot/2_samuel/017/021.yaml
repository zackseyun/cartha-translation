  naturalness: Die Erzählung ist insgesamt natürlich. „Denn so hat Ahitofel gegen euch geraten“ ist im modernen Standarddeutsch idiomatischer und näher am hebräischen Ausdruck als „denn diesen Rat hat Ahitofel gegen euch gegeben“.
