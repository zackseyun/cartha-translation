  text: Israel und Absalom schlugen ihr Lager im Land Gilead auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַן
  choice: schlugen ihr Lager auf
  rationale: Das Verb חנה bezeichnet das Lagern beziehungsweise Aufschlagen eines Lagers. Die deutsche Wendung ist natürlich, gegenwärtig und bewahrt den militärischen Zusammenhang. Obwohl das Hebräische eine Singularform hat, verlangt das zusammengesetzte Subjekt im Deutschen den Plural.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Name bezeichnet hier kollektiv die Israeliten beziehungsweise die Absalom unterstützenden Streitkräfte. Die direkte Wiedergabe bewahrt die Ausdrucksweise und politische Perspektive des hebräischen Textes.
- source_word: וְאַבְשָׁלֹם
  choice: und Absalom
  rationale: Die Konjunktion verbindet Absalom mit Israel zu einem gemeinsamen Subjekt. Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אֶרֶץ הַגִּלְעָד
  choice: im Land Gilead
  rationale: אֶרֶץ mit einem Ortsnamen bezeichnet das Land oder Gebiet dieses Namens. »Im Land Gilead« ist transparent, idiomatisch und bewahrt die geografische Bezeichnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nah an der knappen hebräischen Erzählweise und erklärt »Israel« nicht interpretierend als Heer oder Truppen.
