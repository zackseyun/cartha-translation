  text: וְ/אָב֣וֹא עָלָ֗י/ו וְ/ה֤וּא יָגֵ֨עַ֙ וּ/רְפֵ֣ה יָדַ֔יִם וְ/הַֽחֲרַדְתִּ֣י אֹת֔/וֹ וְ/נָ֖ס כָּל הָ/עָ֣ם אֲשֶׁר אִתּ֑/וֹ וְ/הִכֵּיתִ֥י אֶת הַ/מֶּ֖לֶךְ לְ/בַדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/002.yaml
  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
translation:
  language: de
  text: Ich will ihn überfallen, wenn er müde und kraftlos[a] ist. Ich werde ihn in Schrecken versetzen, und das ganze Volk, das bei ihm ist, wird fliehen; dann werde ich den König allein erschlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „schwach an Händen“; eine Wendung für nachlassende Kraft oder Entschlossenheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבוֹא עָלָיו
  choice: Ich werde über ihn kommen
  rationale: בוא mit עַל bezeichnet hier ein feindliches Herankommen beziehungsweise Überfallen. Die Formulierung bewahrt das konkrete Bewegungsbild und lässt den militärischen Sinn aus dem Zusammenhang hervorgehen.
- source_word: יָגֵעַ
  choice: müde
  rationale: Das Adjektiv bezeichnet Ermüdung infolge von Anstrengung; „müde“ ist verständlich und trifft die Lage Davids auf der Flucht.
- source_word: וּרְפֵה יָדַיִם
  choice: kraftlos
  rationale: Die wörtliche Wendung „schwach an Händen“ bezeichnet verminderte Kraft oder Entschlossenheit. „Kraftlos“ gibt den Sinn natürlich wieder; die konkrete hebräische Bildsprache wird in der Fußnote kenntlich gemacht.
- source_word: וְהַחֲרַדְתִּי אֹתוֹ
  choice: Dann werde ich ihn in Schrecken versetzen
  rationale: 'Der Hifil von חרד ist kausativ: jemanden erschrecken beziehungsweise zum Zittern bringen. „In Schrecken versetzen“ wahrt diese kausative Bedeutung und passt zum Kampfzusammenhang.'
- source_word: וְנָס כָּל־הָעָם אֲשֶׁר אִתּוֹ
  choice: sodass das ganze Volk, das bei ihm ist, flieht
  rationale: Die einfache hebräische Reihung beschreibt hier naheliegend die Folge des Erschreckens. „Das ganze Volk, das bei ihm ist“ bewahrt sowohl כָּל als auch den Relativsatz.
- source_word: וְהִכֵּיתִי
  choice: ich werde ... erschlagen
  rationale: נכה kann „schlagen“ und in einem tödlichen Angriff „erschlagen“ bedeuten. Da der Plan ausdrücklich den König als einziges Angriffsziel nennt, ist die tödliche Bedeutung hier kontextuell deutlich.
- source_word: הַמֶּלֶךְ לְבַדּוֹ
  choice: den König allein
  rationale: Der bestimmte Titel „der König“ bleibt erhalten; לְבַדּוֹ hebt hervor, dass allein der König getroffen werden soll.
