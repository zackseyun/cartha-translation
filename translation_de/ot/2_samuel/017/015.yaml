base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/015.yaml
  text: Then Hushai said to Zadok and to Abiathar the priests[a], “This and that is what Ahithophel advised Absalom and the elders of Israel, and this and that is what I have advised.”
translation:
  language: de
  text: 'Da sagte Huschai zu den Priestern Zadok und Abjatar: „Dies und das hat Ahitofel Abschalom und den Ältesten Israels geraten, und dies und das habe ich geraten.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „So und so … und so und so“; eine hebräische Wendung, die den Inhalt des jeweiligen Rates zusammenfasst, ohne ihn Wort für Wort zu wiederholen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw consecutivum führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: חוּשַׁי
  choice: Huschai
  rationale: Gebräuchliche deutsche Transkription des hebräischen Personennamens.
- source_word: אֶל צָדוֹק וְאֶל אֶבְיָתָר הַכֹּהֲנִים
  choice: zu den Priestern Zadok und Abjatar
  rationale: Die Apposition wird im Deutschen natürlich vor die beiden Namen gestellt und eindeutig auf beide bezogen.
- source_word: כָּזֹאת וְכָזֹאת
  choice: dies und das
  rationale: Die hebräische Wendung verweist zusammenfassend auf den Inhalt einer Äußerung, ohne ihn nochmals wörtlich anzuführen. „Dies und das“ bewahrt diese Unbestimmtheit in verständlichem modernem Deutsch.
- source_word: יָעַץ
  choice: geraten
  rationale: Das Verb bezeichnet hier das Erteilen politischen beziehungsweise strategischen Rates; „raten“ ist prägnant und kontextgerecht.
- source_word: אֶת אַבְשָׁלֹם וְאֵת זִקְנֵי יִשְׂרָאֵל
  choice: Abschalom und den Ältesten Israels
  rationale: Beim deutschen Verb „jemandem etwas raten“ stehen die Empfänger im Dativ; so wird die Beziehung klar und idiomatisch wiedergegeben.
- source_word: יָעַצְתִּי אָנִי
  choice: habe ich geraten
  rationale: Die Stellung von „ich“ nach dem finiten Hilfsverb trägt im parallelen Satz eine natürliche Kontrastbetonung und entspricht dem ausdrücklich gesetzten hebräischen Pronomen.
