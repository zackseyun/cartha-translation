base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/020.yaml
  text: Absalom’s servants came to the woman at the house and said[a], “Where are Ahimaaz and Jonathan?” The woman said to them, “They crossed over the brook of water.” They searched, but did not find them, so they returned to Jerusalem.
translation:
  language: de
  text: 'Absaloms Diener kamen zur Frau ins Haus und fragten: »Wo sind Ahimaaz und Jonatan?« Die Frau antwortete ihnen: »Sie sind über den Wasserlauf[a] gegangen.« Sie suchten nach ihnen, fanden sie aber nicht und kehrten nach Jerusalem zurück.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über den Bach“ beziehungsweise „über den Wasserkanal“. Die hebräische Wendung ist ungewöhnlich; welche Art von Wasserlauf genau gemeint ist, bleibt unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אַבְשָׁלוֹם
  choice: Absaloms Diener
  rationale: עֶבֶד kann je nach Zusammenhang Sklave, Diener oder Beauftragter bedeuten. Hier handelt es sich um Männer in Absaloms Dienst; „Diener“ ist kontextgerecht, ohne einen rechtlichen Sklavenstatus zu behaupten.
- source_word: הָאִשָּׁה הַבַּיְתָה
  choice: zu der Frau beim Haus
  rationale: הָאִשָּׁה bezeichnet die bereits erwähnte Frau; die Richtungsendung an הַבַּיְתָה zeigt die Bewegung zum Haus hin an. Die Formulierung gibt beides wieder, ohne ausdrücklich zu behaupten, die Männer seien in das Haus eingetreten.
- source_word: אַיֵּה אֲחִימַעַץ וִיהוֹנָתָן
  choice: Wo sind Ahimaaz und Jonatan?
  rationale: Das Fragewort bezeichnet den Aufenthaltsort; wegen der beiden genannten Personen steht im Deutschen der Plural. „Jonatan“ entspricht der geläufigen modernen deutschen Namensform.
- source_word: עָבְרוּ
  choice: Sie sind … gegangen
  rationale: עבר bezeichnet ein Hinübergehen oder Passieren. Zusammen mit „über den Wasserlauf“ ergibt sich im Deutschen natürlich die Bedeutung, dass sie diesen überschritten hätten.
- source_word: מִיכַל הַמָּיִם
  choice: über den Wasserlauf
  rationale: Die ungewöhnliche hebräische Wortverbindung bezeichnet wahrscheinlich einen Bach, Wasserlauf oder Wasserkanal. „Wasserlauf“ wahrt die räumliche Aussage, ohne die Art des Gewässers zu eng festzulegen.
- source_word: וַיְבַקְשׁוּ וְלֹא מָצָאוּ
  choice: Sie suchten nach ihnen, fanden sie aber nicht
  rationale: בקשׁ bedeutet hier, nach den beiden Männern zu suchen. Die im Hebräischen unausgesprochenen Objekte werden im Deutschen aus dem Zusammenhang ergänzt; „aber“ gibt den Gegensatz zwischen Suche und erfolglosem Ergebnis idiomatisch wieder.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: und kehrten nach Jerusalem zurück
  rationale: שׁוב bedeutet „zurückkehren“. Die schlichte Verknüpfung mit „und“ bewahrt die hebräische Erzählfolge, ohne eine ausdrücklichere Kausalbeziehung einzutragen.
