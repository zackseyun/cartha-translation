source:
  edition: WLC
  text: וַ/אֲחִיתֹ֣פֶל רָאָ֗ה כִּ֣י לֹ֣א נֶעֶשְׂתָה֮ עֲצָת/וֹ֒ וַ/יַּחֲבֹ֣שׁ אֶֽת הַ/חֲמ֗וֹר וַ/יָּ֜קָם וַ/יֵּ֤לֶךְ אֶל בֵּית/וֹ֙ אֶל עִיר֔/וֹ וַ/יְצַ֥ו אֶל בֵּית֖/וֹ וַ/יֵּחָנַ֑ק וַ/יָּ֕מָת וַ/יִּקָּבֵ֖ר בְּ/קֶ֥בֶר אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/023.yaml
  text: When Ahithophel saw that his counsel had not been followed[a], he saddled the donkey, arose, and went to his house in his city. He gave orders to his household, then hanged himself and died[c][b]; and he was buried in his father's tomb.
translation:
  language: de
  text: Als Ahitofel sah, dass sein Rat nicht ausgeführt worden war[a], sattelte er den Esel, stand auf und ging zu seinem Haus in seiner Stadt. Er gab seinem Haushalt Anweisungen[b], dann erhängte er sich[c] und starb. Und er wurde im Grab seines Vaters begraben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass seinem Rat nicht gefolgt worden war“. Wörtlich: „dass sein Rat nicht getan worden war“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er brachte sein Haus in Ordnung.“ Wörtlicher heißt es, dass er seinem Haus beziehungsweise seinem Haushalt Anweisungen gab.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „er erwürgte sich“. Das Verb kann einen Tod durch Erhängen oder Erdrosseln bezeichnen; im Zusammenhang ist Ahitofels Suizid gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָתוֹ
  choice: sein Rat
  rationale: עֵצָה bezeichnet Rat, Ratschlag oder Plan. „Rat“ bewahrt hier sowohl den beratenden als auch den strategischen Sinn.
- source_word: נֶעֶשְׂתָה
  choice: nicht ausgeführt worden war
  rationale: Wörtlich wurde der Rat „nicht getan“; im politischen Zusammenhang ist gemeint, dass er nicht umgesetzt wurde. „Nicht ausgeführt“ bleibt nahe am hebräischen Ausdruck.
- source_word: וַיַּחֲבֹשׁ אֶת־הַחֲמוֹר
  choice: sattelte er den Esel
  rationale: חבש bezeichnet bei einem Esel das Satteln beziehungsweise Vorbereiten zum Ritt. Der bestimmte Artikel wird als „den Esel“ wiedergegeben; ein Possessivpronomen steht nicht im Hebräischen.
- source_word: וַיָּקָם
  choice: stand auf
  rationale: Die gewöhnliche erzählende Bedeutung wird direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: אֶל־בֵּיתוֹ אֶל־עִירוֹ
  choice: zu seinem Haus in seiner Stadt
  rationale: Die Wiedergabe bewahrt beide Ortsangaben und versteht die zweite als nähere Bestimmung der ersten.
- source_word: וַיְצַו אֶל־בֵּיתוֹ
  choice: Er gab seinem Haushalt Anweisungen
  rationale: Die Formulierung bleibt bei der expliziten Bedeutung „Anweisungen geben“ und versteht בֵּיתוֹ als Hausgemeinschaft. Die idiomatische Deutung, er habe seine Angelegenheiten geordnet, wird in der Fußnote offengehalten.
- source_word: וַיֵּחָנַק
  choice: erhängte er sich
  rationale: Der Kontext legt eine reflexive Handlung und damit Suizid nahe. Das Verb kann jedoch auch ein Sich-Erwürgen beziehungsweise Ersticken bezeichnen; diese lexikalische Breite wird in der Fußnote genannt.
- source_word: בְּקֶבֶר אָבִיו
  choice: im Grab seines Vaters
  rationale: קֶבֶר kann „Grab“ oder „Grabstätte“ bedeuten. Die Wiedergabe erhält den ausdrücklichen Bezug auf seinen Vater.
theological_decisions:
- issue: Handlungsart und Reflexivität bei וַיֵּחָנַק
  choice: „erhängte er sich“ als kontextuell naheliegende Beschreibung des Suizids
  alternative: „er erwürgte sich“ oder formal „er wurde erwürgt“
  rationale: Die Erzählfolge zeigt, dass Ahitofel seinen Tod selbst herbeiführt; dennoch wird die mögliche Bedeutungsbreite des Verbs nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer erzählender Satzfolge. Die hebräischen Wiederholungen und Ortsangaben werden soweit möglich bewahrt, ohne unnatürliche Archaismen zu verwenden.
