base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/018.yaml
  text: But a young man saw them and told Absalom[a], so the two of them went quickly and came to the house of a man in Bahurim, who had a well in his courtyard, and they went down there.
translation:
  language: de
  text: Doch ein junger Mann sah sie und berichtete Absalom davon. Da machten sich die beiden hastig auf den Weg und kamen zum Haus eines Mannes in Bahurim. Dieser hatte in seinem Hof einen Brunnen, und sie stiegen dort hinab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie stiegen in den Brunnen hinab.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: ein junger Mann
  rationale: נַעַר kann je nach Zusammenhang einen Jungen, jungen Mann oder Diener bezeichnen. Hier handelt die Person selbstständig als Beobachter und Bote; »junger Mann« legt weder Alter noch Stellung unnötig eng fest.
- source_word: וַיַּגֵּד לְאַבְשָׁלֹם
  choice: berichtete Absalom davon
  rationale: נגד im Hifil bedeutet »mitteilen« oder »berichten«. »Berichtete Absalom davon« ist im Deutschen natürlich und macht den im Hebräischen aus dem Zusammenhang erschlossenen Inhalt nicht unnötig ausdrücklich.
- source_word: שְׁנֵיהֶם
  choice: die beiden
  rationale: Die Form bezeichnet ausdrücklich zwei Personen. »Die beiden« gibt dies knapp und idiomatisch wieder.
- source_word: מְהֵרָה
  choice: schnell
  rationale: Das adverbial gebrauchte Wort bezeichnet Eile; »schnell« bewahrt die Dringlichkeit in natürlichem Deutsch.
- source_word: בֵּית אִישׁ
  choice: zum Haus eines Mannes
  rationale: Die hebräische Genitivverbindung wird direkt und verständlich wiedergegeben, ohne den ungenannten Mann näher zu bestimmen.
- source_word: בְּבַחוּרִים
  choice: in Bahurim
  rationale: Bahurim ist ein Ortsname; die Wiedergabe mit »in« entspricht der hebräischen Ortsangabe und klingt im Deutschen natürlich.
- source_word: בְאֵר
  choice: Brunnen
  rationale: בְּאֵר bezeichnet gewöhnlich einen Brunnen. Obwohl aufgrund der Möglichkeit des Hinabsteigens auch »Zisterne« erwogen werden kann, sollte die reguläre lexikalische Bedeutung beibehalten werden.
- source_word: בַּחֲצֵרוֹ
  choice: in seinem Hof
  rationale: חָצֵר bezeichnet hier den umschlossenen Hofbereich des Hauses. »Hof« ist die klare, geläufige deutsche Entsprechung.
- source_word: וַיֵּרְדוּ שָׁם
  choice: sie stiegen dort hinab
  rationale: Die Formulierung bewahrt das hebräische שָׁם (»dort«) und damit die leichte grammatische Offenheit, während der Zusammenhang den Brunnen als Ziel des Hinabsteigens nahelegt.
