translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die Satzfolge bleibt nah an der hebräischen Ereigniskette; zur besseren deutschen Lesbarkeit wird der Relativanschluss durch »Dieser« als neuer Satz wiedergegeben.
