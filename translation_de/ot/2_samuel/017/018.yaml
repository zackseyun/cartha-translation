  - severity: low
    issue: Die Fußnote beginnt mit einem unnötigen einleitenden Apostroph und formuliert die Alternative etwas holprig.
    rationale: Eine direkte, idiomatische Formulierung verbessert die Lesbarkeit, ohne die Funktion der lexikalischen Alternative zu verändern.
