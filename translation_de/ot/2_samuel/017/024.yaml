  text: Then David came to Mahanaim, and Absalom crossed the Jordan, he and all the men of Israel with him.
translation:
  language: de
  text: David kam nach Mahanajim. Absalom überquerte den Jordan, zusammen mit allen Männern Israels.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: kam
  rationale: Das Qal Perfekt von בוא bezeichnet hier Davids Ankunft am genannten Ziel. „Kam“ ist im deutschen Erzählstil natürlich und gibt die Bewegung zum Ort angemessen wieder.
- source_word: מַחֲנָיְמָה
  choice: nach Mahanajim
  rationale: Das direktionale He am Ortsnamen bezeichnet eine Bewegung auf den Ort zu; im Deutschen wird dies idiomatisch mit „nach“ ausgedrückt.
- source_word: עָבַר אֶת־הַיַּרְדֵּן
  choice: überquerte den Jordan
  rationale: עבר mit dem als direktes Objekt markierten Flussnamen bezeichnet das Überschreiten des Jordans. „Überquerte“ ist präzise und modern.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen steht ausdrücklich und leitet die appositionelle Fügung „er und …“ ein. Die Wiedergabe bewahrt diese Hervorhebung, ohne sie zu verstärken.
- source_word: כָל־אִישׁ יִשְׂרָאֵל
  choice: alle Männer Israels
  rationale: אִישׁ steht nach כָל kollektiv und grammatisch maskulin. Im Zusammenhang sind die Absalom folgenden Männer beziehungsweise seine Streitmacht gemeint; „alle Männer Israels“ bewahrt die Formulierung, ohne sie zu „das ganze Volk“ zu erweitern.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: Die Präposition mit pronominalem Suffix bezeichnet eindeutig Begleitung.
- source_word: וְ
  choice: Satzfolge / aber
  rationale: Das erste ו setzt die Erzählung fort und kann im Deutschen durch die unmittelbare Satzfolge wiedergegeben werden. Beim zweiten ו verdeutlicht „aber“ den gleichzeitigen Wechsel von David zu Absalom, ohne einen starken Gegensatz einzutragen.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger deutscher Erzählstil. Zwei Hauptsätze vermeiden eine schwerfällige Reihung. Die traditionelle deutsche Namensform „Mahanajim“ wird verwendet; der ausdrückliche Nachtrag „er und alle Männer Israels mit ihm“ bewahrt die hebräische Struktur.
