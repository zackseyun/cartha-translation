base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/009.yaml
  text: Look[a], right now he is hidden in one of the pits or in one of the other places. And when some of them fall at the first attack, whoever hears it will say[b], ‘There has been a slaughter among the people who follow Absalom.’
translation:
  language: de
  text: 'Sieh, gerade jetzt hält er sich in einer der Gruben[a] oder an einem anderen Ort verborgen. Und wenn er gleich zu Beginn über sie herfällt, wird jeder, der es hört, sagen: »Unter dem Volk, das Absalom folgt, hat es eine Niederlage[b] gegeben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einer der Vertiefungen“; das hebräische Wort kann Gruben, Senken oder ähnliche Verstecke im Gelände bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein schwerer Schlag“; das hebräische Wort bezeichnet hier eine schwere militärische Niederlage oder ein Niederschlagen, nicht eine Seuche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה עַתָּה
  choice: Sieh, gerade jetzt
  rationale: Die Wendung lenkt lebhaft die Aufmerksamkeit auf die unmittelbar gegenwärtige Lage; „Sieh“ ist würdig und gegenwärtig, „gerade jetzt“ bewahrt den Nachdruck.
- source_word: נֶחְבָּא
  choice: hält er sich … verborgen
  rationale: Die Form beschreibt Davids verborgenen Zustand, ohne genauer festzulegen, wie oder durch wen er verborgen wurde.
- source_word: בְּאַחַת הַפְּחָתִים
  choice: in einer der Gruben
  rationale: פְּחָתִים bezeichnet Gruben, Vertiefungen oder natürliche Geländemulden, die als Verstecke dienen können.
- source_word: בְּאַחַד הַמְּקוֹמֹת
  choice: an einem anderen Ort
  rationale: Die allgemeine Ortsangabe steht als Alternative zu den zuvor genannten Gruben; „anderen“ macht diesen Kontrast im Deutschen natürlich deutlich.
- source_word: כִּנְפֹל בָּהֶם בַּתְּחִלָּה
  choice: wenn dann gleich beim ersten Angriff einige von ihnen fallen
  rationale: Im militärischen Zusammenhang geht es wahrscheinlich um erste Verluste unter Absaloms Leuten. „Beim ersten Angriff“ gibt den kontextuellen Sinn von „am Anfang“ wieder.
- source_word: הַשֹּׁמֵעַ
  choice: jeder, der davon hört
  rationale: Das substantivierte Partizip hat generischen Sinn und wird so idiomatisch wiedergegeben.
- source_word: מַגֵּפָה
  choice: Blutbad
  rationale: Das Wort bezeichnet hier keine Seuche, sondern ein schweres militärisches Niederschlagen mit zahlreichen Opfern.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי אַבְשָׁלֹם
  choice: die Leute, die Absalom folgen
  rationale: אַחֲרֵי bezeichnet hier Gefolgschaft beziehungsweise militärisch-politische Loyalität, nicht bloß eine räumliche Position.
