revisions:
- from: 'Sieh, gerade jetzt hält er sich in einer der Gruben[a] oder an einem anderen Ort verborgen. Wenn dann gleich beim ersten Angriff einige von ihnen fallen, wird jeder, der davon hört, sagen: »Unter den Leuten, die Absalom folgen, hat es ein Blutbad[b] gegeben.«'
  to: 'Sieh, gerade jetzt hält er sich in einer der Gruben[a] oder an einem anderen Ort verborgen. Und wenn er gleich zu Beginn über sie herfällt, wird jeder, der es hört, sagen: »Unter dem Volk, das Absalom folgt, hat es eine Niederlage[b] gegeben.«'
  rationale: Die Revision stellt den Singularbezug von „wenn er ... über sie herfällt“ wieder her und übersetzt damit die unmittelbare militärische Drohung, die Huschai David zuschreibt. Die Meldung über Absaloms Gefolgsleute bleibt als erwartete Wirkung dieser ersten Attacke erhalten. „Niederlage“ ist im Haupttext idiomatisch und weniger interpretativ als „Blutbad“; die Fußnote bewahrt die lexikalische Spannweite.
