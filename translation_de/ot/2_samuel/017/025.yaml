source:
  edition: WLC
  text: וְ/אֶת עֲמָשָׂ֗א שָׂ֧ם אַבְשָׁלֹ֛ם תַּ֥חַת יוֹאָ֖ב עַל הַ/צָּבָ֑א וַ/עֲמָשָׂ֣א בֶן אִ֗ישׁ וּ/שְׁמ/וֹ֙ יִתְרָ֣א הַ/יִּשְׂרְאֵלִ֔י אֲשֶׁר בָּא֙ אֶל אֲבִיגַ֣ל בַּת נָחָ֔שׁ אֲח֥וֹת צְרוּיָ֖ה אֵ֥ם יוֹאָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/025.yaml
  text: And Absalom set Amasa over the army in place of Joab. Now Amasa was the son of a man whose name was Ithra the Israelite[a], who had gone in to Abigail the daughter of Nahash, sister of Zeruiah, Joab’s mother.
translation:
  language: de
  text: Und Absalom setzte Amasa anstelle Joabs über das Heer. Amasa war der Sohn eines Mannes namens Jitra, des Israeliten[a]. Dieser war zu Abigal, der Tochter Nahaschs, eingegangen; sie war die Schwester Zerujas, der Mutter Joabs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Jitra, der Israelit«. In 1. Chronik 2,17 steht: »Jeter, der Ismaelit«.'
    reason: textual_variant
lexical_decisions:
- source_word: שָׂם ... עַל הַצָּבָא
  choice: setzte ... über das Heer
  rationale: Gibt die Einsetzung in eine militärische Leitungsstellung nah am hebräischen Ausdruck und zugleich idiomatisch wieder.
- source_word: תַּחַת יוֹאָב
  choice: anstelle Joabs
  rationale: תַּחַת bezeichnet hier den Ersatz Joabs als Heerführer, nicht eine räumliche Unterordnung.
- source_word: בֶן אִישׁ וּשְׁמוֹ יִתְרָא
  choice: der Sohn eines Mannes namens Jitra
  rationale: Bewahrt die unbestimmte Bezeichnung אִישׁ und fügt den folgenden Namenssatz natürlich ins Deutsche ein.
- source_word: הַיִּשְׂרְאֵלִי
  choice: des Israeliten
  rationale: Folgt dem masoretischen Text; die abweichende Lesart in 1. Chronik 2,17 wird in einer Fußnote dokumentiert.
- source_word: אֲשֶׁר בָּא אֶל
  choice: Dieser war zu ... eingegangen
  rationale: Bewahrt den verhüllenden hebräischen Ausdruck für geschlechtlichen Verkehr, ohne ihn durch eine explizite Deutung zu ersetzen.
- source_word: אֲבִיגַל בַּת נָחָשׁ
  choice: Abigal, der Tochter des Nahasch
  rationale: Gibt die Abstammungsangabe direkt wieder; die Namensformen entsprechen gebräuchlicher deutscher Bibeltransliteration.
- source_word: אֲחוֹת צְרוּיָה אֵם יוֹאָב
  choice: sie war die Schwester Zerujas, der Mutter Joabs
  rationale: Die Auflösung in einen eigenen Satzteil macht die verwandtschaftlichen Beziehungen im Deutschen eindeutig, ohne zusätzliche Information einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung »zu ... eingegangen« erhält den biblischen Euphemismus. Der längere Verwandtschaftssatz wurde behutsam gegliedert, damit die Bezüge verständlich bleiben.
