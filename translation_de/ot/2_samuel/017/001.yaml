  text: וַ/יֹּ֥אמֶר אֲחִיתֹ֖פֶל אֶל אַבְשָׁלֹ֑ם אֶבְחֲרָ֣ה נָּ֗א שְׁנֵים עָשָׂ֥ר אֶ֨לֶף֙ אִ֔ישׁ וְ/אָק֛וּמָה וְ/אֶרְדְּפָ֥ה אַחֲרֵי דָוִ֖ד הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/001.yaml
  text: Then Ahithophel said to Absalom[a], “Please let me choose twelve thousand men, and let me arise and pursue David tonight.”
translation:
  language: de
  text: 'Da sagte Ahitofel zu Absalom: „Lass mich doch zwölftausend Mann auswählen; dann will ich noch in dieser Nacht aufbrechen und David verfolgen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Wayyiqtol führt die Handlung weiter; „Da“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Der Personenname folgt der im Deutschen gebräuchlichen biblischen Schreibweise.
- source_word: אֶל אַבְשָׁלֹם
  choice: zu Absalom
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu“ ist die natürliche deutsche Entsprechung.
- source_word: אֶבְחֲרָה נָּא
  choice: Lass mich doch … auswählen
  rationale: Der Kohortativ mit נָא drückt eine nachdrückliche, aber höflich vorgetragene Bitte beziehungsweise einen Vorschlag aus. „Lass mich doch“ bewahrt diesen Ton idiomatisch.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: zwölftausend Mann
  rationale: אִישׁ heißt wörtlich „Mann“. Die kollektive deutsche Wendung „zwölftausend Mann“ ist im militärischen Zusammenhang natürlich, ohne ausdrücklich „Soldaten“ in den Text einzutragen.
- source_word: וְאָקוּמָה
  choice: dann will ich … aufbrechen
  rationale: קוּם bedeutet grundsätzlich „aufstehen/sich erheben“, bezeichnet hier aber den Beginn unmittelbaren Handelns. „Aufbrechen“ vermittelt die kontextuelle Bewegung natürlich; „will ich“ erhält den kohortativen Vorschlagscharakter.
- source_word: וְאֶרְדְּפָה אַחֲרֵי דָוִד
  choice: und David verfolgen
  rationale: רדף mit אַחֲרֵי bezeichnet das Verfolgen einer Person. Im Deutschen enthält „David verfolgen“ bereits die Bedeutung von אַחֲרֵי.
- source_word: הַלָּיְלָה
  choice: noch in dieser Nacht
  rationale: Der bestimmte Ausdruck bezeichnet die unmittelbar bevorstehende beziehungsweise gegenwärtige Nacht. „Noch in dieser Nacht“ macht die Dringlichkeit deutlich, ohne sie über das Hebräische hinaus zu steigern.
