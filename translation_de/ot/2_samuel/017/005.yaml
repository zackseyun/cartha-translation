  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם קְרָ֣א נָ֔א גַּ֖ם לְ/חוּשַׁ֣י הָ/אַרְכִּ֑י וְ/נִשְׁמְעָ֥ה מַה בְּ/פִ֖י/ו גַּם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/005.yaml
  text: Then Absalom said[a], “Please call Hushai the Archite also, and let us hear what he too has to say.”
translation:
  language: de
  text: 'Da sagte Absalom: „Ruf bitte auch Huschai, den Arkiter, und wir wollen hören, was auch er zu sagen hat.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw consecutivum führt die Erzählung weiter; „Da sagte“ gibt die zeitlich-fortschreitende Funktion in natürlichem Deutsch wieder.
- source_word: קְרָא נָא
  choice: Ruft bitte
  rationale: Der Imperativ mit נָא trägt eine höflich-bittende Nuance. Da mehrere Angesprochene vorausgesetzt werden können und anschließend „wir“ steht, ist der Plural im Deutschen sachgerecht.
- source_word: גַּם לְחוּשַׁי
  choice: auch den … Huschai
  rationale: גַּם kennzeichnet Huschai als weiteren Ratgeber neben Ahitofel; „auch“ bewahrt diesen additiven Sinn.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: den Arkiter Huschai
  rationale: Der Personenname wird in der etablierten deutschen Form „Huschai“ wiedergegeben; הָאַרְכִּי ist eine Herkunftsbezeichnung und wird als „Arkiter“ übersetzt.
- source_word: וְנִשְׁמְעָה
  choice: damit wir hören
  rationale: Die Kohortativform drückt einen Vorschlag beziehungsweise eine beabsichtigte Folge aus. „Damit wir hören“ verbindet die Aufforderung im Deutschen natürlich mit ihrem Zweck.
- source_word: מַה בְּפִיו
  choice: was … zu sagen hat
  rationale: Wörtlich steht „was in seinem Mund ist“. Die deutsche Wendung gibt den hebräischen Ausdruck idiomatisch wieder, ohne den Inhalt näher festzulegen.
- source_word: גַּם הוּא
  choice: auch er
  rationale: Die zweite גַּם-Konstruktion hebt Huschai als zusätzliche Person hervor, deren Rat gehört werden soll.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt knapp und höflich; die Wiederholung des additiven Gedankens („auch … auch er“) wird entsprechend dem Hebräischen bewahrt. Keine Fußnote ist nötig, da das hebräische Idiom im Deutschen unmittelbar und genau wiedergegeben werden kann.
