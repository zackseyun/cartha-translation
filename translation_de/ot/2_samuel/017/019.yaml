  text: וַ/תִּקַּ֣ח הָ/אִשָּׁ֗ה וַ/תִּפְרֹ֤שׂ אֶת הַ/מָּסָךְ֙ עַל פְּנֵ֣י הַ/בְּאֵ֔ר וַ/תִּשְׁטַ֥ח עָלָ֖י/ו הָֽ/רִפ֑וֹת וְ/לֹ֥א נוֹדַ֖ע דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/019.yaml
  text: Then the woman took a covering and spread it over the mouth of the well[a], and scattered crushed grain on it[b], and the matter was not known.
translation:
  language: de
  text: Da nahm die Frau eine Decke, breitete sie über die Öffnung des Brunnens und streute Schrot darauf. Und nichts wurde bekannt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: אִשָּׁה kann »Frau« oder »Ehefrau« bedeuten; hier ist die bereits im Zusammenhang genannte Frau des Hauses gemeint, ohne dass ihre eheliche Beziehung hervorgehoben wird.
- source_word: הַמָּסָךְ
  choice: eine Decke
  rationale: מָסָךְ bezeichnet eine Abdeckung, einen Vorhang oder Sichtschutz. »Decke« ist hier ein natürlicher, nicht materialspezifischer Ausdruck für den Gegenstand, mit dem der Brunnen verdeckt wird.
- source_word: עַל פְּנֵי הַבְּאֵר
  choice: über die Öffnung des Brunnens
  rationale: Wörtlich steht »über das Angesicht/die Oberfläche des Brunnens«; gemeint ist in diesem Zusammenhang dessen obere Öffnung.
- source_word: וַתִּשְׁטַח
  choice: streute
  rationale: שטח bedeutet »ausbreiten«. Bei zerkleinertem Getreide gibt »streute« die konkrete Handlung idiomatisch wieder.
- source_word: הָרִפוֹת
  choice: Schrot
  rationale: רִפוֹת bezeichnet zerstoßenes oder grob zerkleinertes Getreide. »Schrot« ist im Deutschen knapp, sachlich und verständlich.
- source_word: וְלֹא נוֹדַע דָּבָר
  choice: So wurde nichts davon bekannt
  rationale: Die hebräische Wendung lautet wörtlich etwa »und keine Sache wurde bekannt«. Die deutsche Fassung bewahrt die passive Aussage und bezieht sie natürlich auf das Versteck.
theological_decisions: []
