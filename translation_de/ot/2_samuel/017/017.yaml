base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/017.yaml
  text: Jonathan and Ahimaaz were standing at En-rogel[a], and a female servant would go and tell them, and they would go and tell King David[b], for they could not be seen entering the city.
translation:
  language: de
  text: Jonatan und Ahimaaz hielten sich bei En-Rogel auf[a]. Eine Dienerin[b] ging hin und berichtete ihnen; dann gingen sie hin und berichteten es König David. Denn sie konnten nicht in die Stadt gehen, ohne gesehen zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „standen bei En-Rogel“; gemeint ist hier wahrscheinlich, dass sie dort blieben oder stationiert waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Sklavin“. Das hebräische Wort bezeichnet eine weibliche Dienerin oder Sklavin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדִים
  choice: hielten sich … auf
  rationale: Das Partizip bedeutet wörtlich „standen“, bezeichnet hier aber natürlich den fortdauernden Aufenthalt beziehungsweise ihre dortige Stationierung.
- source_word: בְּעֵין רֹגֵל
  choice: bei En-Rogel
  rationale: Der Ortsname wird transliteriert; בְּ bezeichnet hier den Standort bei diesem Ort.
- source_word: הַשִּׁפְחָה
  choice: eine Dienerin
  rationale: שִׁפְחָה bezeichnet ausdrücklich eine weibliche Dienerin beziehungsweise Sklavin. „Dienerin“ ist im heutigen Deutsch klar und vermeidet eine unnötige Festlegung auf ihren genauen Rechtsstatus.
- source_word: וְהָלְכָה … וְהֵם יֵלְכוּ וְהִגִּידוּ
  choice: ging hin … dann gingen sie hin und berichteten
  rationale: Die deutschen Vergangenheitsformen geben die organisierte Nachrichtenkette natürlich wieder; „dann“ macht die im Hebräischen angelegte Abfolge deutlich.
- source_word: וְהִגִּידָה לָהֶם
  choice: berichtete ihnen alles
  rationale: נגד im Hifil bedeutet „mitteilen/berichten“. „Alles“ ist als natürliches deutsches Objekt aus dem Zusammenhang erschlossen, nicht als eigenständiges hebräisches Wort vorhanden.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: König David
  rationale: Dies ist die natürliche deutsche Verbindung von Titel und Eigenname.
- source_word: לְהֵרָאוֹת לָבוֹא הָעִירָה
  choice: sich nicht sehen lassen, wenn sie in die Stadt kamen
  rationale: Die idiomatische Formulierung bewahrt den Sinn des passivischen „gesehen werden“ und den Richtungssinn von עִירָה, ohne die beabsichtigte Heimlichkeit übermäßig auszudeuten.
