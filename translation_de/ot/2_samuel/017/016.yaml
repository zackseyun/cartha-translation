source:
  edition: WLC
  text: וְ/עַתָּ֡ה שִׁלְח֣וּ מְהֵרָה֩ וְ/הַגִּ֨ידוּ לְ/דָוִ֜ד לֵ/אמֹ֗ר אַל תָּ֤לֶן הַ/לַּ֨יְלָה֙ בְּ/עַֽרְב֣וֹת הַ/מִּדְבָּ֔ר וְ/גַ֖ם עָב֣וֹר תַּעֲב֑וֹר פֶּ֚ן יְבֻלַּ֣ע לַ/מֶּ֔לֶךְ וּ/לְ/כָל הָ/עָ֖ם אֲשֶׁ֥ר אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/016.yaml
  text: Now send quickly and tell David[a], saying, ‘Do not stay tonight at the fords of the wilderness, but be sure to cross over, lest the king and all the people who are with him be swallowed up.’
translation:
  language: de
  text: 'Nun schickt schnell Boten und richtet David aus: »Bleib heute Nacht nicht in den Steppen der Wüste[a], sondern setz unbedingt über, damit nicht der König und das ganze Volk, das bei ihm ist, verschlungen werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Ebenen/Niederungen der Wüste«. Im Zusammenhang mit dem unmittelbar folgenden Übersetzen wird die Wendung auch auf ein Übergangsgebiet bezogen.'
    reason: Die Landschaftsbezeichnung עֲרָבוֹת kann Ebenen, Steppen oder Niederungen meinen; der Kontext legt zwar ein Übergangsgebiet nahe, bezeichnet aber nicht ausdrücklich Furten.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun
  rationale: Leitet die dringende Folgerung und das unmittelbar erforderliche Handeln natürlich ein.
- source_word: שִׁלְחוּ מְהֵרָה
  choice: schickt schnell jemanden los
  rationale: Der Imperativ Plural richtet sich an die Boten; das im Deutschen ergänzte „jemanden“ macht den transitiven Gebrauch von „schicken“ verständlich, ohne einen bestimmten Boten einzuführen.
- source_word: וְהַגִּידוּ לְדָוִד לֵאמֹר
  choice: und lasst David ausrichten
  rationale: Gibt die hebräische Botenformel in natürlichem modernem Deutsch wieder, ohne das schwerfällige „indem ihr sagt“ nachzuahmen.
- source_word: אַל תָּלֶן הַלַּיְלָה
  choice: Bleib heute Nacht nicht
  rationale: לון bezeichnet das Übernachten oder Verweilen über Nacht; die Form ist Singular und richtet sich nun an David.
- source_word: בְּעַרְבוֹת הַמִּדְבָּר
  choice: in den Steppen der Wüste
  rationale: עֲרָבוֹת bezeichnet gewöhnlich Ebenen, Steppen oder Niederungen. „Steppen der Wüste“ bewahrt die Landschaftsbezeichnung; die kontextuell mögliche Deutung als Übergangs- oder Furtgebiet wird in der Fußnote genannt.
- source_word: וְגַם עָבוֹר תַּעֲבוֹר
  choice: sondern setz unbedingt über
  rationale: Der Infinitivus absolutus vor der finiten Verbform verstärkt die Aufforderung. „Unbedingt“ gibt diesen Nachdruck idiomatisch wieder; „setz über“ passt zum unmittelbar vorausgesetzten Gewässerübergang.
- source_word: פֶּן
  choice: damit nicht
  rationale: Gibt die warnende, unerwünschte mögliche Folge in klarem modernem Deutsch wieder.
- source_word: יְבֻלַּע
  choice: verschlungen werden
  rationale: Bewahrt das eindringliche Bild des passiven בלע, das im Gefahr- oder Kriegskontext zugleich Vernichtung beziehungsweise Überwältigung ausdrücken kann.
- source_word: לַמֶּלֶךְ וּלְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: der König und das ganze Volk bei ihm
  rationale: Erhält Davids Titel und gibt עָם weiter als „Volk“ statt enger als „Truppen“ wieder.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem erzählerischem Ton. Der Wechsel von den pluralischen Befehlen an die Boten zur singularischen Warnung an David bleibt erkennbar. Das starke hebräische Bild „verschlungen werden“ wurde nicht zu „vernichtet werden“ abgeflacht.
