  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt kompakt; das einleitende »Dazu« verbindet den Vers mit der im vorherigen Vers begonnenen Liste. Lexikalische Unsicherheiten bei den alten Milcherzeugnissen und beim Kollektivwort für Kleinvieh werden in Fußnoten offengelegt.
