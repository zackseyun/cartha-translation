  text: וּ/דְבַ֣שׁ וְ/חֶמְאָ֗ה וְ/צֹאן֙ וּ/שְׁפ֣וֹת בָּקָ֔ר הִגִּ֧ישׁוּ לְ/דָוִ֛ד וְ/לָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ לֶ/אֱכ֑וֹל כִּ֣י אָמְר֔וּ הָ/עָ֗ם רָעֵ֛ב וְ/עָיֵ֥ף וְ/צָמֵ֖א בַּ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/029.yaml
  text: and honey and curds and sheep and cheese from the herd they brought near for David and for the people who were with him to eat[a], for they said[c][b], “The people are hungry and weary and thirsty in the wilderness.”
translation:
  language: de
  text: 'Dazu brachten sie David und den Leuten, die bei ihm waren, Honig, Dickmilch[a], Schafe[b] und Käse aus Kuhmilch[c] zu essen. Denn sie sagten: »Die Leute sind in der Wildnis hungrig, erschöpft und durstig.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Butter« beziehungsweise »Rahm«. Das hebräische Wort bezeichnet allgemein ein Milcherzeugnis; hier ist wahrscheinlich Dickmilch oder ein ähnliches geronnenes Milchprodukt gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Kleinvieh«. Das hebräische Wort kann als Sammelbezeichnung Schafe und Ziegen umfassen.'
    reason: lexical_alternative
  - marker: c
    text: Die Bedeutung der hebräischen Wendung ist nicht völlig sicher; gemeint ist offenbar ein aus Rindermilch hergestelltes Erzeugnis, wahrscheinlich Käse.
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: דְבַשׁ
  choice: Honig
  rationale: Die gewöhnliche Bedeutung ist »Honig«; ein süßer Sirup ist zwar möglich, im Zusammenhang mit den Lebensmitteln aber weniger naheliegend.
- source_word: חֶמְאָה
  choice: Dickmilch
  rationale: Das Wort bezeichnet hier wahrscheinlich ein eingedicktes oder geronnenes Milchprodukt und nicht Butter im heutigen Sinn.
- source_word: צֹאן
  choice: Schafe
  rationale: Das Kollektivwort kann Kleinvieh einschließlich Schafen und Ziegen bezeichnen; »Schafe« ist eine knappe, natürliche Wiedergabe, während die weitere Bedeutung in einer Fußnote erhalten bleibt.
- source_word: שְׁפוֹת בָּקָר
  choice: Käse aus Kuhmilch
  rationale: Die schwierige Wendung bezeichnet wahrscheinlich ein aus Rindermilch gewonnenes Erzeugnis. Die Wiedergabe ist verständlich und wahrt die Verbindung zum Rindvieh, ohne ein genaueres Herstellungsverfahren zu behaupten.
- source_word: הִגִּישׁוּ
  choice: brachten sie
  rationale: Im Zusammenhang mit Versorgungsgütern gibt »bringen« das Herbeibringen beziehungsweise Darreichen natürlich wieder.
- source_word: לְדָוִד וְלָעָם אֲשֶׁר אִתּוֹ
  choice: David und den Leuten, die bei ihm waren
  rationale: Die beiden Empfänger und der Relativsatz werden klar und nah am Hebräischen wiedergegeben.
- source_word: לֶאֱכֹל
  choice: zu essen
  rationale: Der Infinitiv bezeichnet den Zweck der herbeigebrachten Lebensmittel.
- source_word: כִּי אָמְרוּ
  choice: Denn sie sagten
  rationale: כִּי leitet hier die Begründung für das Bringen der Lebensmittel ein.
- source_word: רָעֵב וְעָיֵף וְצָמֵא
  choice: hungrig, erschöpft und durstig
  rationale: Die dreigliedrige Beschreibung bleibt erhalten; »erschöpft« gibt עָיֵף im Zusammenhang der Flucht idiomatisch wieder.
- source_word: בַּמִּדְבָּר
  choice: in der Wildnis
  rationale: מִדְבָּר bezeichnet häufig unbewohntes, karges Land und nicht zwingend eine Sandwüste.
