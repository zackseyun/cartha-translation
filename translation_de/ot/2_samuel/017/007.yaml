  text: וַ/יֹּ֥אמֶר חוּשַׁ֖י אֶל אַבְשָׁל֑וֹם לֹֽא טוֹבָ֧ה הָ/עֵצָ֛ה אֲשֶׁר יָעַ֥ץ אֲחִיתֹ֖פֶל בַּ/פַּ֥עַם הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/007.yaml
  text: Then Hushai said to Absalom[a], “The counsel that Ahithophel has given this time is not good.”
translation:
  language: de
  text: 'Da sagte Huschai zu Abschalom: „Der Rat, den Ahitofel diesmal[a] gegeben hat, ist nicht gut.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei dieser Gelegenheit“.'
    reason: Lexikalische Alternative für בַּפַּעַם הַזֹּאת.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Wayyiqtol führt die Handlung weiter; „Da sagte“ gibt diese Abfolge in natürlichem modernem Deutsch wieder.
- source_word: חוּשַׁי
  choice: Huschai
  rationale: Die im Deutschen geläufige Form des Personennamens.
- source_word: אֶל־אַבְשָׁלוֹם
  choice: zu Abschalom
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; „zu“ ist die natürliche deutsche Entsprechung. Der Personenname folgt der geläufigen deutschen Form.
- source_word: לֹא טוֹבָה
  choice: ist nicht gut
  rationale: Die prädikative Wendung wird unmittelbar wiedergegeben; „gut“ bewahrt die breite Wertung des Hebräischen, ohne sie auf „klug“ oder „zweckmäßig“ einzuengen.
- source_word: הָעֵצָה
  choice: der Rat
  rationale: עֵצָה bezeichnet hier den politisch-strategischen Rat. „Rat“ ist im Deutschen natürlicher als „Ratschlag“ und bewahrt den gehobenen Erzählton.
- source_word: אֲשֶׁר יָעַץ
  choice: den … gegeben hat
  rationale: Die idiomatische Verbindung „Rat geben“ vermeidet die im Deutschen unnatürliche etymologische Wiederholung „einen Rat raten“ und gibt die abgeschlossene Handlung wieder.
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Die im Deutschen geläufige Form des Personennamens.
- source_word: בַּפַּעַם הַזֹּאת
  choice: diesmal
  rationale: Die Wendung bedeutet idiomatisch „diesmal“ beziehungsweise „bei dieser Gelegenheit“; „diesmal“ ist knapp und im Zusammenhang eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Satzstruktur bewahrt die hebräische Bewertung des Rates, ohne zusätzliche strategische oder theologische Deutung einzutragen. Der Fußnotenmarker steht bei „diesmal“, also bei der tatsächlich erläuterten Wendung.
