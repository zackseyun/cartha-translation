  text: וַ/יִּישַׁ֥ר הַ/דָּבָ֖ר בְּ/עֵינֵ֣י אַבְשָׁלֹ֑ם וּ/בְ/עֵינֵ֖י כָּל זִקְנֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/004.yaml
  text: The proposal seemed good in the eyes of Absalom and in the eyes of all the elders of Israel[a].
translation:
  language: de
  text: Der Vorschlag fand Absaloms Zustimmung und die Zustimmung aller Ältesten Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Die Sache war recht in den Augen Absaloms und in den Augen aller Ältesten Israels.«'
    reason: Bewahrt als Alternative sowohl die Bildsprache von בְּעֵינֵי als auch die mögliche Nuance „recht/richtig“ von וַיִּישַׁר und gibt הַדָּבָר allgemeiner als „die Sache“ wieder.
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: fand … Zustimmung
  rationale: Das Verb ישר bezeichnet hier zusammen mit בְּעֵינֵי idiomatisch eine positive Beurteilung beziehungsweise Zustimmung, nicht abstrakte moralische Rechtschaffenheit.
- source_word: הַדָּבָר
  choice: der Vorschlag
  rationale: Im Erzählzusammenhang ist damit der unmittelbar zuvor erteilte Rat Ahitofels gemeint. „Vorschlag“ macht diesen Bezug im Deutschen klar.
- source_word: בְּעֵינֵי … וּבְעֵינֵי
  choice: Absaloms Zustimmung und die Zustimmung …
  rationale: Die deutsche Wendung gibt den Sinn des zweimaligen hebräischen Idioms „in den Augen von“ natürlich wieder; die Wiederholung von „Zustimmung“ wahrt zugleich die Betonung beider Gruppen.
- source_word: אַבְשָׁלֹם
  choice: Absalom
  rationale: Im Deutschen übliche Form des Personennamens.
- source_word: כָּל
  choice: aller
  rationale: Gibt den umfassenden Quantor direkt wieder.
- source_word: זִקְנֵי
  choice: Ältesten
  rationale: Bezeichnet hier anerkannte führende beziehungsweise beratende Männer Israels, nicht lediglich alte Männer.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Im Deutschen etablierte Form des Volksnamens.
