source:
  edition: WLC
  text: וַ/יָּ֣קָם דָּוִ֗ד וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּעַבְר֖וּ אֶת הַ/יַּרְדֵּ֑ן עַד א֣וֹר הַ/בֹּ֗קֶר עַד אַחַד֙ לֹ֣א נֶעְדָּ֔ר אֲשֶׁ֥ר לֹא עָבַ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/022.yaml
  text: Then David arose[a], and all the people who were with him, and they crossed the Jordan. By morning light, not one was missing who had not crossed the Jordan.
translation:
  language: de
  text: Da brach David mit dem ganzen Volk, das bei ihm war, auf, und sie überquerten den Jordan. Bis zum Morgenlicht[a] hatten alle den Jordan überquert; kein Einziger fehlte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beim Morgenlicht“. Die hebräische Wendung kann den Zeitpunkt bezeichnen, bis zu dem die Überquerung abgeschlossen war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: brach … auf
  rationale: Das Qal von קום bedeutet zunächst „sich erheben/aufstehen“, leitet hier aber den gemeinsamen nächtlichen Aufbruch und die anschließende Überquerung ein. „brach … auf“ gibt diese narrative Bewegung im heutigen Deutsch natürlich wieder.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: mit dem ganzen Volk, das bei ihm war
  rationale: עָם bezeichnet die gesamte David begleitende Gruppe und wird daher inklusiv mit „Volk“ statt enger mit „Männer“ wiedergegeben.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: und sie überquerten den Jordan
  rationale: עבר mit direktem Objekt bezeichnet hier schlicht das Überqueren des Flusses.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: Bis zum Morgenlicht
  rationale: 'Die Wiedergabe bewahrt das Lichtbild von אוֹר und lässt die zeitliche Nuance von עַד erkennen: Die Überquerung war spätestens beim Morgenlicht abgeschlossen.'
- source_word: עַד אַחַד לֹא נֶעְדָּר
  choice: kein Einziger fehlte
  rationale: Die betonte hebräische Wendung sagt aus, dass niemand aus der Gruppe fehlte; „kein Einziger“ erhält den Nachdruck.
- source_word: אֲשֶׁר לֹא עָבַר אֶת הַיַּרְדֵּן
  choice: hatten alle den Jordan überquert
  rationale: Die wörtliche doppelte Verneinung („keiner fehlte, der nicht überquert hatte“) wäre im Deutschen missverständlich. Die positive Form gibt ihren Sinn klar wieder, während „kein Einziger fehlte“ den Nachdruck des Ausgangstextes erhält.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Erzählregister. Die schwer verständliche hebräische Verneinung wurde transparent entfaltet, ohne ihren Nachdruck oder die Aussage vollständiger Überquerung abzuschwächen.
