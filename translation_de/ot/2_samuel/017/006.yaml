base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/006.yaml
  text: When Hushai came to Absalom[a], Absalom said to him, “Ahithophel has spoken in this way. Should we do as he says? If not, you speak.”
translation:
  language: de
  text: 'Als Huschai zu Abschalom kam, sagte Abschalom zu ihm: »So hat Ahitofel geraten. Sollen wir seinen Rat ausführen? Wenn nicht, dann rede du!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: Das narrative Wayyiqtol von בוא führt die Handlung fort; mit אֶל אַבְשָׁלוֹם ist »zu Abschalom kam« im Deutschen natürlich.
- source_word: חוּשַׁי
  choice: Huschai
  rationale: Der Personenname wird in einer im Deutschen geläufigen, quellenahen Form wiedergegeben.
- source_word: אַבְשָׁלוֹם
  choice: Abschalom
  rationale: Der Personenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: sagte
  rationale: Die hebräische Redeeinleitung wird idiomatisch zusammengezogen; ein zusätzliches »und sprach folgendermaßen« wäre unnötig schwerfällig.
- source_word: כַּדָּבָר הַזֶּה דִּבֶּר
  choice: So hat … geraten
  rationale: דבר bezeichnet hier den Inhalt der unmittelbar zuvor gegebenen Beratung. »So hat … geraten« gibt den Bezug und die Funktion der Äußerung natürlich wieder.
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Der Personenname wird in einer üblichen deutschen Transkriptionsform wiedergegeben.
- source_word: הֲנַעֲשֶׂה
  choice: Sollen wir … ausführen?
  rationale: Die Fragepartikel mit dem Imperfekt der ersten Person Plural drückt eine gemeinsame Beratung über das weitere Handeln aus.
- source_word: אֶת דְּבָרוֹ
  choice: seinen Rat
  rationale: Wörtlich steht »sein Wort«; im Kontext ist damit Ahitofels zuvor vorgetragener Ratschlag gemeint. »Seinen Rat ausführen« ist präzise und idiomatisch.
- source_word: אִם אַיִן
  choice: Wenn nicht
  rationale: Die knappe hebräische Wendung bildet die gegensätzliche Bedingung und lässt sich ebenso knapp wiedergeben.
- source_word: אַתָּה דַבֵּר
  choice: dann rede du!
  rationale: Das selbstständige Pronomen אַתָּה betont Huschai. Die deutsche Nachstellung von »du« erhält diesen Kontrast.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper erzählerischer Syntax. Die direkte Rede bleibt entschieden und bewahrt durch »du« den ausdrücklich gesetzten Kontrast des Hebräischen.
