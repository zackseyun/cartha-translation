  source_fidelity: Der deutsche Text gibt die erzählerische Abfolge und die Rede präzise wieder. »So hat Ahitofel geraten« vermittelt כַּדָּבָר הַזֶּה דִּבֶּר idiomatisch im Kontext eines zuvor unterbreiteten Rats. »Sollen wir seinen Rat ausführen?« trifft den deliberativen Charakter von הֲנַעֲשֶׂה und die kontextuelle Bedeutung von דְּבָרוֹ. »Wenn nicht, dann rede du!« wahrt den Kontrast und Nachdruck des selbstständigen אַתָּה.
