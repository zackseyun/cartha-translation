  source_fidelity: 'Die Wiedergabe von וְאָשִׁיבָה als „zurückbringen“ und von כָל־הָעָם als „das ganze Volk“ ist zutreffend. Die Mittelwendung ist im Hebräischen elliptisch und syntaktisch umstritten. Der Entwurf stellt jedoch mit „Wenn alle zurückkehren, wird der Mann ... nicht mehr da sein“ eine zeitliche Abfolge her, die den kontextuell gemeinten Zusammenhang umkehrt: Die Beseitigung bzw. das Nichtmehrdasein des gesuchten Mannes ist der Grund für die Rückkehr der Übrigen. Die Fußnote soll die Unsicherheit dieser Stelle weiterhin offenlegen.'
