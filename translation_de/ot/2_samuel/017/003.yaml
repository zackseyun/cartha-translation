  text: וְ/אָשִׁ֥יבָה כָל הָ/עָ֖ם אֵלֶ֑י/ךָ כְּ/שׁ֣וּב הַ/כֹּ֔ל הָ/אִישׁ֙ אֲשֶׁ֣ר אַתָּ֣ה מְבַקֵּ֔שׁ כָּל הָ/עָ֖ם יִהְיֶ֥ה שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/003.yaml
  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
translation:
  language: de
  text: Und ich werde das ganze Volk zu dir zurückbringen.[a] Wenn der Mann, den du suchst, nicht mehr da ist, werden alle zurückkehren, und das ganze Volk wird Frieden haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut des folgenden Satzteils ist schwierig; wörtlich etwa: „wie die Rückkehr aller – der Mann, den du suchst“. Gemeint ist offenbar: Ist der eine gesuchte Mann beseitigt, werden alle anderen zurückkehren.'
    reason: Die Fußnote bewahrt die syntaktische Unsicherheit des hebräischen Textes und erklärt die im Haupttext sinngemäß wiedergegebene Ellipse.
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: Und ich werde … zurückbringen
  rationale: 'Der Hifil von שׁוב ist kausativ: Ahitofel will bewirken, dass das Volk zurückkehrt. „Zurückbringen“ gibt dies im politischen und militärischen Zusammenhang konkret wieder.'
- source_word: כָל הָעָם
  choice: das ganze Volk
  rationale: עָם bezeichnet hier die Gesamtheit der Menschen, die zurückgewonnen werden sollen. „Volk“ bewahrt die Breite des hebräischen Ausdrucks und legt sich nicht unnötig auf „Heer“ fest.
- source_word: אֵלֶיךָ
  choice: zu dir
  rationale: Dies entspricht der schlichten Richtungsangabe des hebräischen Textes und klingt im modernen Deutschen natürlich.
- source_word: כְּשׁוּב הַכֹּל
  choice: Wenn alle zurückkehren
  rationale: Die hebräische Konstruktion ist syntaktisch schwierig und offenbar elliptisch. Die Wiedergabe nimmt den Gedanken der Rückkehr aller auf, ohne die unklare Satzverknüpfung im Haupttext hölzern nachzubilden.
- source_word: הָאִישׁ אֲשֶׁר אַתָּה מְבַקֵּשׁ
  choice: der Mann, den du suchst
  rationale: Die Formulierung bewahrt den bestimmten Singular und die direkte Relativkonstruktion; gemeint ist David als das eine Ziel des Anschlags.
- source_word: יִהְיֶה שָׁלוֹם
  choice: wird Frieden haben
  rationale: שָׁלוֹם bezeichnet hier den Zustand von Frieden und Wohlergehen nach dem Ende des Konflikts. Die deutsche Wendung ist idiomatisch und wahrt den politisch-sozialen Sinn.
theological_decisions:
- issue: Das Schicksal des gesuchten Mannes in der elliptischen Mittelwendung
  choice: „wird … nicht mehr da sein“ gibt die im Kontext vorausgesetzte Beseitigung des gesuchten Mannes zurückhaltend wieder.
  alternative: 'Eine strengere, aber schwer verständliche Wiedergabe wäre: „wie die Rückkehr aller – der Mann, den du suchst“; auch „wenn nur der Mann, den du suchst, tot ist“ wäre möglich, würde die Ellipse jedoch stärker ausdeuten.'
  rationale: Der Zusammenhang mit Vers 2 zeigt, dass David getötet werden soll. Die gewählte Formulierung macht den beabsichtigten Gegensatz verständlich, nennt den Tod aber nicht ausdrücklich, da er in diesem Vers im masoretischen Text nicht ausdrücklich steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und erzählerisch; die schwer verständliche hebräische Mittelwendung wird im Haupttext behutsam erschlossen und in der Fußnote transparent gemacht.
