  text: וְ/ה֣וּא גַם בֶּן חַ֗יִל אֲשֶׁ֥ר לִבּ֛/וֹ כְּ/לֵ֥ב הָ/אַרְיֵ֖ה הִמֵּ֣ס יִמָּ֑ס כִּֽי יֹדֵ֤עַ כָּל יִשְׂרָאֵל֙ כִּי גִבּ֣וֹר אָבִ֔י/ךָ וּ/בְנֵי חַ֖יִל אֲשֶׁ֥ר אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/010.yaml
  text: Even the valiant man whose heart is like a lion’s heart will utterly melt[a], for all Israel knows that your father is a mighty man[b], and that the men with him are valiant men.
translation:
  language: de
  text: Auch ein tapferer Mann, dessen Herz dem Herzen eines Löwen gleicht, wird völlig den Mut verlieren[a]. Denn ganz Israel weiß, dass dein Vater ein mächtiger Krieger ist und dass die Männer, die bei ihm sind, tapfere Männer sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wird zerschmelzen, zerschmelzen«; die hebräische Verstärkung bedeutet: Er wird völlig oder ganz gewiss den Mut verlieren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חַיִל
  choice: der tapfere Mann
  rationale: Die Wendung bezeichnet einen durch Mut und militärische Tüchtigkeit gekennzeichneten Mann. »Der tapfere Mann« gibt den Singular natürlich wieder.
- source_word: לִבּוֹ כְּלֵב הָאַרְיֵה
  choice: dessen Herz wie das Herz eines Löwen ist
  rationale: Die ausdrückliche Vergleichsfigur des Hebräischen bleibt erhalten, ohne sie zum Adjektiv »löwenherzig« zu verdichten.
- source_word: הִמֵּס יִמָּס
  choice: wird völlig den Mut verlieren
  rationale: Infinitivus absolutus und finites Verb verstärken מסס. Die Übersetzung gibt die emphatische Wirkung in natürlichem Deutsch wieder; die wörtliche Schmelzmetapher wird in der Fußnote genannt.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet hier die Begründung der vorhergehenden Aussage ein.
- source_word: יֹדֵעַ כָּל יִשְׂרָאֵל
  choice: ganz Israel weiß
  rationale: Die partizipiale Form bezeichnet eine allgemein feststehende Kenntnis.
- source_word: גִבּוֹר
  choice: ein mächtiger Krieger
  rationale: Im militärischen Zusammenhang bezeichnet das Wort David als starken, kampferprobten Mann; »Krieger« macht diesen Bezug im Deutschen deutlich.
- source_word: וּבְנֵי חַיִל אֲשֶׁר אִתּוֹ
  choice: die Männer bei ihm tapfer sind
  rationale: Die idiomatische Wendung »Söhne der Tüchtigkeit/Stärke« wird natürlich als Eigenschaft der Männer wiedergegeben und bewahrt die lexikalische Verbindung zum ersten בֶּן חַיִל.
