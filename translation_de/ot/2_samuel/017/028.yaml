translation:
  language: de
  text: Bettzeug, Schalen und Gefäße aus Ton sowie Weizen, Gerste, Mehl, geröstetes Getreide, Bohnen[a], Linsen und geröstetes Getreide.
  philosophy: optimal-equivalence
  footnotes:
