lexical_decisions:
- source_word: מִשְׁכָּב
  choice: Schlafzeug
  rationale: Das Substantiv bezeichnet etwas oder einen Platz zum Liegen und ist hier kollektiv gebraucht. „Schlafzeug“ passt zu einer Versorgungsliste und vermeidet die unbegründete Festlegung auf vollständige Betten.
- source_word: סַפּוֹת
  choice: Schalen
  rationale: In der Liste bezeichnet der Ausdruck wahrscheinlich Gebrauchsgefäße wie Schalen oder Becken; „Schalen“ ist natürlich und hinreichend offen.
- source_word: כְלִי יוֹצֵר
  choice: Töpfergefäße
  rationale: Wörtlich sind es „Gefäße eines Töpfers“. „Töpfergefäße“ bewahrt sowohl die konkrete Gegenstandsbezeichnung als auch den Bezug zur Herstellung aus Ton.
- source_word: חִטִּים
  choice: Weizen
  rationale: Die übliche und eindeutige deutsche Bezeichnung des genannten Getreides.
- source_word: שְׂעֹרִים
  choice: Gerste
  rationale: Die übliche und eindeutige deutsche Bezeichnung des genannten Getreides.
- source_word: קֶמַח
  choice: Mehl
  rationale: Der Ausdruck bezeichnet gemahlenes Getreide; „Mehl“ ist das klare moderne Äquivalent.
- source_word: קָלִי
  choice: Röstkorn
  rationale: Das Wort bezeichnet durch Rösten zubereitetes Getreide. „Röstkorn“ ist knapp, verständlich und lässt sich bei beiden Vorkommen gleich wiedergeben.
- source_word: פּוֹל
  choice: Bohnen
  rationale: Das Wort bezeichnet wahrscheinlich Acker- oder Saubohnen; die allgemeinere Wiedergabe im Haupttext wird durch eine Fußnote präzisiert.
- source_word: עֲדָשִׁים
  choice: Linsen
  rationale: Die übliche deutsche Bezeichnung der genannten Hülsenfrucht.
- source_word: קָלִי
  choice: Röstkorn
  rationale: Das zweite Vorkommen wird wie das erste übersetzt, damit die auffällige Wiederholung des hebräischen Textes erhalten bleibt.
