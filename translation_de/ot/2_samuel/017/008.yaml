    rationale: Die hebräische Wendung bezeichnet einen bitteren, grimmigen beziehungsweise erbitterten Gemütszustand. „Grimmig“ vermittelt die gefährliche Intensität idiomatisch; die wörtliche Formulierung bleibt in der Anmerkung erhalten.
  - severity: low
    issue: „erfahrener“ ergänzt bei „Kriegsmann“ eine im Ausgangstext nicht explizierte Nuance.
    rationale: אִישׁ מִלְחָמָה charakterisiert David als Mann des Krieges bzw. Kriegsmann, ohne das Adjektiv „erfahren“ zu enthalten.
