  text: וַ/יֹּ֣אמֶר חוּשַׁ֗י אַתָּ֣ה יָ֠דַעְתָּ אֶת אָבִ֨י/ךָ וְ/אֶת אֲנָשָׁ֜י/ו כִּ֧י גִבֹּרִ֣ים הֵ֗מָּה וּ/מָרֵ֥י נֶ֨פֶשׁ֙ הֵ֔מָּה כְּ/דֹ֥ב שַׁכּ֖וּל בַּ/שָּׂדֶ֑ה וְ/אָבִ֨י/ךָ֙ אִ֣ישׁ מִלְחָמָ֔ה וְ/לֹ֥א יָלִ֖ין אֶת הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
translation:
  language: de
  text: 'Huschai sagte: »Du kennst deinen Vater und seine Männer: Sie sind starke Kämpfer und grimmig[a], wie eine Bärin auf freiem Feld, die ihrer Jungen beraubt ist. Außerdem ist dein Vater ein Kriegsmann; er wird die Truppen nicht übernachten lassen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bitter an der Seele“; auch: „erbittert“ oder „wild entschlossen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er wird nicht bei den Truppen übernachten.“ Das hebräische Wort bedeutet gewöhnlich „Volk“, bezeichnet hier aber wohl Davids Kampfverband; die masoretische Verbform lässt sich kausativ verstehen: „nicht übernachten lassen“.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: גִבֹּרִים
  choice: starke Kämpfer
  rationale: Der Ausdruck bezeichnet kraftvolle, kampftüchtige Männer. „Starke Kämpfer“ gibt die militärische Bedeutung in natürlichem modernem Deutsch wieder.
- source_word: מָרֵי נֶפֶשׁ
  choice: in ihrer Seele erbittert
  rationale: Die Wiedergabe bewahrt das hebräische Seelenbild und die intensive Gemütslage, ohne sie ausschließlich als Zorn oder Wildheit festzulegen.
- source_word: כְּדֹב שַׁכּוּל
  choice: wie eine Bärin …, die ihrer Jungen beraubt ist
  rationale: Das Bild beschreibt eine durch den Verlust ihrer Jungen gefährlich gewordene Bärin. Die feminine Form wird im Deutschen ausdrücklich wiedergegeben.
- source_word: בַּשָּׂדֶה
  choice: auf freiem Feld
  rationale: Die Wendung bezeichnet hier das offene Gelände und klingt im Deutschen natürlicher als das rein wörtliche „im Feld“.
- source_word: אִישׁ מִלְחָמָה
  choice: ein erfahrener Kriegsmann
  rationale: Die idiomatische Wendung charakterisiert David als einen mit der Kriegführung vertrauten Mann; „erfahren“ macht die kontextuelle Aussage verständlich.
- source_word: לֹא יָלִין אֶת־הָעָם
  choice: er wird nicht bei den Truppen übernachten
  rationale: לין bezeichnet das Übernachten; עָם meint im militärischen Zusammenhang Davids mitziehende Kampftruppe. Die hebräische Konstruktion lässt daneben eine kausative Auffassung zu, die in der Fußnote genannt wird.
- source_word: יָדַעְתָּ
  choice: Du kennst
  rationale: Beim Vater und seinen Männern ist das deutsche „kennen“ idiomatischer als „wissen“ und gibt die persönliche Vertrautheit passend wieder.
- source_word: אֲנָשָׁיו
  choice: seine Männer
  rationale: Die direkte Wiedergabe wahrt die allgemeine Bezeichnung, während der Zusammenhang ihre militärische Rolle erkennen lässt.
