review_pass:
  verdict: revise
  source_fidelity: Die Schlusswendung וְלֹא יָלִין אֶת־הָעָם hat im masoretisch vokalisierten Text eine kausative Form und ein direktes Objekt. Der Haupttext „er wird nicht bei den Truppen übernachten“ gibt dagegen die in vielen Übersetzungen vertretene, syntaktisch weniger unmittelbare Auffassung wieder. Die kausative Deutung muss im Haupttext stehen; die andere Auffassung kann als Alternative vermerkt werden.
  naturalness: „In ihrer Seele erbittert“ ist im modernen Standarddeutsch schwerfällig und klingt semantisch eher nach dauerhaftem Groll als nach der hier gemeinten bedrohlichen Erregung. „Grimmig“ ist natürlich und kontextgerecht; die wörtliche hebräische Bildlichkeit kann die Fußnote dokumentieren.
  terminology: „Huschai“, „starke Kämpfer“, „Bärin“, „Kriegsmann“ und „Truppen“ sind angemessen. „Erfahrener“ bei איש מלחמה ist eine plausible Kontextentfaltung, aber nicht ausdrücklich im hebräischen Wortlaut enthalten und wird daher weggelassen.
  issues:
  - severity: high
    issue: Die Fußnote b bietet die grammatisch naheliegende kausative Bedeutung als bloße Alternative an, während der Haupttext die weniger unmittelbare Lesart bevorzugt.
    rationale: יַּלִין ist hier masoretisch als Hifil vokalisiert; אֶת־הָעָם markiert „das Volk/die Truppe“ als Objekt. Der Haupttext sollte daher ausdrücken, dass David seine Truppe nicht übernachten lassen wird.
  - severity: medium
