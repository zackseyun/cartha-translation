  source_fidelity: 'Die Grundstruktur und die drastische Belagerungshyperbel werden zutreffend wiedergegeben. „Sich in eine Stadt zurückziehen“, „Seile“ und „[die Stadt] schleifen“ entsprechen dem hebräischen Sinn gut. Für עַד הַנָּחַל ist „bis zum Wadi“ jedoch präziser als „bis ins Bachtal“: Der Ausdruck bezeichnet primär einen Wasserlauf beziehungsweise dessen Bett oder eine Schlucht, nicht notwendig ein Tal.'
