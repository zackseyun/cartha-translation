base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/013.yaml
  text: And if he withdraws into a city[a], then all Israel will bring ropes to that city[b], and we will drag it to the wadi until not even a small stone is found there.
translation:
  language: de
  text: Und wenn er sich in eine Stadt zurückzieht, wird ganz Israel Seile zu jener Stadt bringen, und wir werden sie bis zum Wadi schleifen, bis dort nicht einmal ein Steinchen zu finden ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Wadi ist ein meist trockenes oder nur zeitweise wasserführendes Flussbett bzw. eine Schlucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף
  choice: sich zurückzieht
  rationale: Das Nifal von אסף bezeichnet hier im militärischen Zusammenhang Davids Rückzug in eine Stadt. Die reflexive Formulierung gibt den Sinn natürlich wieder, ohne das im Hebräischen nicht ausdrücklich genannte Motiv „Zuflucht suchen“ einzutragen.
- source_word: וְהִשִּׂיאוּ
  choice: soll … bringen
  rationale: Mit חֲבָלִים als Objekt bezeichnet die Form das Herbeibringen beziehungsweise Herantragen der Seile; „bringen“ ist im Deutschen klar und idiomatisch.
- source_word: חֲבָלִים
  choice: Seile
  rationale: Das konkrete Bild verlangt kräftige Seile, mit denen die Stadt in der übertreibenden Darstellung fortgeschleift werden soll.
- source_word: וְסָחַבְנוּ אֹתוֹ
  choice: wir werden sie … schleifen
  rationale: סחב bedeutet „schleifen“ oder „fortschleppen“. Das deutsche Pronomen „sie“ bezieht sich sinngemäß und grammatisch natürlich auf „die Stadt“, auch wenn der hebräische Suffix formal maskulin ist.
- source_word: הַנַּחַל
  choice: Bachtal
  rationale: נחל kann sowohl den Wasserlauf als auch sein Tal beziehungsweise Rinnsalbett bezeichnen. „Bachtal“ bewahrt diese geografische Breite und ist gewöhnlichen deutschen Lesern verständlicher als „Wadi“.
- source_word: גַּם צְרוֹר
  choice: auch nicht ein Steinchen
  rationale: צְרוֹר bezeichnet hier einen kleinen Stein. Die Formulierung erhält die steigernde, hyperbolische Aussage, dass von der Stadt nicht einmal das Geringste übrig bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drastische militärische Hyperbel des hebräischen Textes bleibt erhalten. „Bachtal“ vermeidet einen erklärungsbedürftigen Fachausdruck und bildet zugleich die Bedeutungsbreite von נחל angemessen ab.
