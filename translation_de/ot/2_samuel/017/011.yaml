source:
  edition: WLC
  text: כִּ֣י יָעַ֗צְתִּי הֵ֠אָסֹף יֵאָסֵ֨ף עָלֶ֤י/ךָ כָל יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע כַּ/ח֥וֹל אֲשֶׁר עַל הַ/יָּ֖ם לָ/רֹ֑ב וּ/פָנֶ֥י/ךָ הֹלְכִ֖ים בַּ/קְרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/011.yaml
  text: But I advise that all Israel be surely gathered to you[a], from Dan to Beersheba, as numerous as the sand that is by the sea, and that you yourself go into battle.
translation:
  language: de
  text: 'Doch ich rate: Ganz Israel soll sich unbedingt bei dir versammeln, von Dan bis Beerscheba, so zahlreich wie der Sand am Meer; und du selbst sollst in den Kampf ziehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und dein Angesicht geht im Kampf“; gemeint ist, dass Absalom persönlich mit in den Kampf zieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Doch
  rationale: Die Partikel leitet im Kontext Huschais Gegenentwurf zu Ahitofels Rat ein; „Doch“ gibt diese adversative Funktion natürlich wieder.
- source_word: יָעַצְתִּי
  choice: ich rate
  rationale: Das Verb יעץ bezeichnet das Erteilen eines Rates. Das Präsens entspricht hier der Funktion der direkten Rede.
- source_word: הֵאָסֹף יֵאָסֵף
  choice: soll sich unbedingt versammeln
  rationale: Infinitivus absolutus und finite Form desselben Verbs verstärken die Aussage. „Unbedingt“ bewahrt den Nachdruck in idiomatischem Deutsch.
- source_word: עָלֶיךָ
  choice: bei dir
  rationale: Mit אסף bezeichnet על das Sammeln bei beziehungsweise um einen Anführer; „bei dir“ ist natürlich und lässt die räumlich-militärische Vorstellung bestehen.
- source_word: כָל יִשְׂרָאֵל
  choice: Ganz Israel
  rationale: Die kollektive Wendung bezeichnet in der zugespitzten Rede das gesamte Israel beziehungsweise dessen Streitmacht.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: von Dan bis Beerscheba
  rationale: Die bekannte geografische Merismusformel bezeichnet die ganze Ausdehnung Israels und wird formal bewahrt.
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: so zahlreich wie der Sand am Meer
  rationale: Die Formulierung gibt den Vergleich und die ausdrücklich bezeichnete große Menge natürlich wieder, ohne das Bild zu verlieren.
- source_word: וּפָנֶיךָ הֹלְכִים
  choice: und du selbst sollst … ziehen
  rationale: Wörtlich steht „und dein Angesicht gehend“; פָּנִים bezeichnet hier idiomatisch die persönliche Anwesenheit Absaloms. „Du selbst“ wahrt den emphatischen Sinn.
- source_word: בַּקְרָב
  choice: in den Kampf
  rationale: קְרָב bezeichnet hier Kampf oder Schlacht. Mit dem Bewegungsverb ist „in den Kampf ziehen“ idiomatisches modernes Deutsch.
