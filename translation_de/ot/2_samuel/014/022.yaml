base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/022.yaml
  text: Then Joab fell with his face to the ground[a], bowed down, and blessed the king. Joab said, “Today your servant knows that I have found favor in your eyes, my lord the king, because the king has done the word of his servant.”
translation:
  language: de
  text: 'Da fiel Joab mit dem Gesicht zu Boden, warf sich nieder und segnete den König. Joab sagte: »Heute weiß dein Diener, dass ich Gunst in deinen Augen gefunden habe, mein Herr, der König, denn der König hat die Bitte seines Dieners erfüllt.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Wort seines Dieners getan«.'
    reason: Die Fußnote bewahrt die konkrete hebräische Ausdrucksweise hinter der idiomatischen Wiedergabe »die Bitte ... erfüllt«.
lexical_decisions:
- source_word: וַיִּפֹּל ... אֶל־פָּנָיו אַרְצָה
  choice: fiel ... mit dem Gesicht zur Erde
  rationale: Die Wendung bewahrt die konkrete Körperhaltung des hebräischen Ausdrucks und klingt zugleich in modernem Deutsch natürlich.
- source_word: וַיִּשְׁתַּחוּ
  choice: warf sich nieder
  rationale: Das Verb bezeichnet hier die ehrerbietige Niederwerfung vor einem menschlichen König. Diese Wiedergabe vermeidet die sakralisierende Deutung »betete an«.
- source_word: וַיְבָרֶךְ אֶת־הַמֶּלֶךְ
  choice: segnete den König
  rationale: »Segnete« gibt ברך eng wieder; der Zusammenhang lässt zugleich Joabs ehrerbietigen Dank erkennen, ohne ihn ausdrücklich in den Text einzutragen.
- source_word: יָדַע עַבְדְּךָ
  choice: weiß dein Diener
  rationale: Das Perfekt bezeichnet hier Joabs nun gewonnene Gewissheit. Die Formulierung wahrt außerdem die höfische Selbstbezeichnung in der dritten Person.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: ich Gunst in deinen Augen gefunden habe
  rationale: Die geläufige hebräische Bildsprache bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr, der König
  rationale: Die Anrede bewahrt sowohl die persönliche Ehrerbietung als auch den königlichen Titel.
- source_word: אֲשֶׁר
  choice: denn
  rationale: Die Relativpartikel führt hier den Grund an, aus dem Joab seine Gunst beim König erkennt.
- source_word: עָשָׂה ... אֶת־דְּבַר עַבְדּוֹ
  choice: hat die Bitte seines Dieners erfüllt
  rationale: Wörtlich steht »hat das Wort seines Dieners getan«. Im Zusammenhang bezeichnet »Wort« Joabs Anliegen; »die Bitte erfüllt« vermittelt diesen Sinn in natürlichem Deutsch. Die wörtliche Gestalt wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Ehrerbietung gegenüber einem menschlichen König
  choice: »warf sich nieder« und »mein Herr, der König«
  alternative: »betete den König an« beziehungsweise »mein Gebieter, der König«
  rationale: Die Szene schildert höfische Huldigung, nicht notwendig religiöse Anbetung. Die Übersetzung wahrt die starke Ehrerbietung, ohne das Handeln zu sakralisieren.
- issue: Bedeutung von »das Wort seines Dieners tun«
  choice: »die Bitte seines Dieners erfüllt«
  alternative: »das Wort seines Dieners getan«
  rationale: Der Kontext legt nahe, dass der König Joabs Anliegen stattgegeben hat. Die idiomatische Wiedergabe macht dies verständlich, während die Fußnote die ungewöhnliche und etwas offenere Form des Hebräischen bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher höfischer Sprache. Die wiederholte Bezeichnung »der König« und Joabs Selbstbezeichnung »dein Diener« bleiben als Merkmale des Hofstils erhalten.
