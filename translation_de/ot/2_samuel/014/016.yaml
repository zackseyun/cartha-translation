base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/016.yaml
  text: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
translation:
  language: de
  text: Denn der König wird seine Magd[a] anhören und mich aus der Hand des Mannes retten, der mich und meinen Sohn gemeinsam aus dem Erbteil Gottes[b] vertilgen will.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »seine Magd« beziehungsweise »seine Dienerin«; eine demütige weibliche Selbstbezeichnung gegenüber dem König.'
    reason: lexical_alternative
  - marker: b
    text: »Das Erbteil Gottes« kann den von Gott zugeteilten Erbbesitz innerhalb Israels oder Gottes eigenes Erbe, also sein Volk beziehungsweise Land, bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die zuvor geäußerte Zuversicht der Frau und schließt natürlich an den Kontext an.
- source_word: יִשְׁמַע
  choice: wird … anhören
  rationale: שׁמע kann »hören«, »anhören« oder »erhören« bedeuten. »Anhören« passt zur Bitte an den König, ohne bereits ausdrücklich zu behaupten, dass er ihr stattgeben werde.
- source_word: לְהַצִּיל
  choice: und … retten
  rationale: Der Hifil von נצל bezeichnet das Befreien oder Retten aus der Gewalt eines anderen. Die Beiordnung gibt im Deutschen die beabsichtigte Folge des Anhörens natürlich wieder.
- source_word: אֲמָתוֹ
  choice: seine Magd
  rationale: Das hebräische Substantiv ist ausdrücklich feminin und dient hier als demütige Selbstbezeichnung der Frau gegenüber dem König.
- source_word: מִכַּף הָאִישׁ
  choice: aus der Hand des Mannes
  rationale: Die körperhafte hebräische Wendung für Macht oder Gewalt bleibt verständlich und wird deshalb bewahrt.
- source_word: לְהַשְׁמִיד
  choice: der … vertilgen will
  rationale: Der Infinitiv bezeichnet die Absicht des Mannes. »Vertilgen« bringt die drohende vollständige Beseitigung von Mutter und Sohn samt Familienlinie zum Ausdruck.
- source_word: יַחַד
  choice: gemeinsam
  rationale: Das Adverb betont, dass Mutter und Sohn beide von derselben Vernichtung bedroht sind.
- source_word: מִנַּחֲלַת אֱלֹהִים
  choice: aus dem Erbteil Gottes
  rationale: »Erbteil« bewahrt den Bezug auf den von Gott gewährten Anteil beziehungsweise die Zugehörigkeit innerhalb Israels; der Genitiv bleibt bewusst mehrdeutig.
theological_decisions:
- issue: Bedeutung von נַחֲלַת אֱלֹהִים (»Erbteil Gottes«)
  choice: Die formal mehrdeutige Wendung »Erbteil Gottes« wird im Text beibehalten.
  alternative: »das von Gott zugeteilte Erbe« oder »Gottes eigenes Erbe«
  rationale: Im Kontext geht es wahrscheinlich um den von Gott gewährten Erbanteil und den Fortbestand einer Familie in Israel. Der hebräische Genitiv kann jedoch auch Gottes eigenen Besitz bezeichnen; diese Spannung soll nicht im Haupttext aufgelöst werden.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die höfische Selbsterniedrigung wird durch »Magd« erkennbar gehalten; »anhören« vermeidet eine vorschnelle Festlegung auf »erhören«. Die Satzstruktur bleibt eng am Hebräischen, ist aber im Deutschen flüssig.
