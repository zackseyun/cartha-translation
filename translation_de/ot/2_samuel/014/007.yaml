revisions:
- from: 'Und sieh: Die ganze Sippe hat sich gegen deine Dienerin erhoben und gesagt: »Gib den heraus, der seinen Bruder erschlagen hat! Wir wollen ihn für das Leben seines Bruders, den er getötet hat, töten und damit auch den Erben vernichten.« So würden sie meine letzte Glut[a] auslöschen und meinem Mann weder Namen noch Nachkommenschaft[b] auf der Erde lassen.'
  to: 'Sieh: Die ganze Sippe hat sich gegen deine Dienerin erhoben und gesagt: »Gib den heraus, der seinen Bruder geschlagen hat, damit wir ihn für das Leben seines Bruders, den er getötet hat, töten; und auch den Erben werden wir vernichten.« So würden sie meine verbliebene Glut[a] auslöschen und meinem Mann weder Namen noch Nachkommenschaft[b] auf der Erde lassen.'
  rationale: Die Revision stellt die Abfolge „geschlagen“ – „getötet“ wieder her, gibt die Vernichtung des Erben ohne zusätzliche Kausalverknüpfung wieder und hält sich bei der Kohlemetapher an „verblieben“. Die Fußnoten wurden entsprechend präzisiert, ohne den Bildsinn konfessionell oder narrativ enger festzulegen.
