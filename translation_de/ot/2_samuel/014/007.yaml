source:
  edition: WLC
  text: וְ/הִנֵּה֩ קָ֨מָה כָֽל הַ/מִּשְׁפָּחָ֜ה עַל שִׁפְחָתֶ֗/ךָ וַ/יֹּֽאמְרוּ֙ תְּנִ֣י אֶת מַכֵּ֣ה אָחִ֗י/ו וּ/נְמִתֵ֨/הוּ֙ בְּ/נֶ֤פֶשׁ אָחִי/ו֙ אֲשֶׁ֣ר הָרָ֔ג וְ/נַשְׁמִ֖ידָה גַּ֣ם אֶת הַ/יּוֹרֵ֑שׁ וְ/כִבּ֗וּ אֶת גַּֽחַלְתִּ/י֙ אֲשֶׁ֣ר נִשְׁאָ֔רָה לְ/בִלְתִּ֧י שום לְ/אִישִׁ֛/י שֵׁ֥ם וּ/שְׁאֵרִ֖ית עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/007.yaml
  text: And look[a], the whole family has risen up against your servant and said, ‘Give up the one who struck his brother, so that we may put him to death for the life of his brother whom he killed; and we will destroy the heir also.’ Thus they would quench my remaining ember[b], leaving my husband neither name nor remnant on the face of the earth.
translation:
  language: de
  text: 'Sieh: Die ganze Sippe hat sich gegen deine Dienerin erhoben und gesagt: »Gib den heraus, der seinen Bruder geschlagen hat, damit wir ihn für das Leben seines Bruders, den er getötet hat, töten; und auch den Erben werden wir vernichten.« So würden sie meine verbliebene Glut[a] auslöschen und meinem Mann weder Namen noch Nachkommenschaft[b] auf der Erde lassen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »meine verbliebene glühende Kohle«. Das Bild bezeichnet die verbleibende Hoffnung auf den Fortbestand ihrer Familie beziehungsweise Familienlinie.'
    reason: lexical_alternative
  - marker: b
    text: »Name und Nachkommenschaft« bezeichnet den Fortbestand des Namens, des Andenkens und der Familienlinie ihres Mannes.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Die präsentierende und Aufmerksamkeit lenkende Funktion wird in natürlichem modernem Deutsch bewahrt, ohne das altertümliche »siehe«.
- source_word: כָל הַמִּשְׁפָּחָה
  choice: die ganze Sippe
  rationale: מִשְׁפָּחָה bezeichnet hier die größere Verwandtschaftsgruppe, die gemeinsam gegen die Frau vorgeht; »Sippe« ist präziser als die leicht auf die Kernfamilie beschränkte »Familie«.
- source_word: שִׁפְחָתֶךָ
  choice: deine Dienerin
  rationale: Die feminine Selbstbezeichnung in ehrerbietiger Rede vor dem König wird ausdrücklich erhalten.
- source_word: קָמָה ... עַל
  choice: hat sich gegen ... erhoben
  rationale: Die deutsche Wendung gibt das feindselige Vorgehen der Verwandtschaft wieder, nicht bloß ein Aufstehen.
- source_word: תְּנִי
  choice: Gib ... heraus
  rationale: Im rechtlichen Konflikt wird die Auslieferung des Sohnes verlangt; »herausgeben« vermittelt dies idiomatisch.
- source_word: מַכֵּה אָחִיו
  choice: der seinen Bruder erschlagen hat
  rationale: Das Partizip von נכה bezeichnet den, der seinen Bruder schlug; im gegebenen Kontext führte der Schlag zum Tod. »Erschlagen« wahrt diese Verbindung, ohne vorsätzliches Morden zu unterstellen.
- source_word: וּנְמִתֵהוּ בְּנֶפֶשׁ אָחִיו
  choice: Wir wollen ihn für das Leben seines Bruders ... töten
  rationale: Die kohortative Absicht und die Vergeltungsformel Leben für Leben bleiben sichtbar.
- source_word: וְנַשְׁמִידָה גַּם אֶת הַיּוֹרֵשׁ
  choice: und damit auch den Erben vernichten
  rationale: '»Auch« macht den entlarvenden Zusatz deutlich: Neben der Vergeltung würde zugleich der noch lebende Erbe beseitigt. »Damit« gibt die sachliche Folge im Deutschen wieder, ohne eine eigenständige zusätzliche Tötung zu behaupten.'
- source_word: וְכִבּוּ אֶת גַּחַלְתִּי אֲשֶׁר נִשְׁאָרָה
  choice: So würden sie meine letzte Glut auslöschen
  rationale: Das Bild der noch verbliebenen glühenden Kohle für den letzten überlebenden Nachkommen wird bewahrt. »Letzte Glut« ist im Deutschen natürlich und bildkräftig.
- source_word: שֵׁם וּשְׁאֵרִית
  choice: Namen noch Nachkommenschaft
  rationale: »Name« wahrt das kulturell gewichtige Motiv des fortbestehenden Namens; »Nachkommenschaft« gibt שְׁאֵרִית im Kontext der bedrohten Familienlinie verständlich wieder.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: auf der Erde
  rationale: Die räumliche Wendung wird knapp und idiomatisch wiedergegeben.
theological_decisions:
- issue: Verhältnis von Blutrache und Erbenvernichtung
  choice: Die Vergeltungsforderung und ihre Folge für den Erben werden beide ohne moralische Harmonisierung wiedergegeben.
  alternative: Die Worte ausschließlich als rechtmäßige Hinrichtung oder ausschließlich als Vorwand zum Erbschaftsraub auszulegen.
  rationale: Der hebräische Wortlaut lässt die Familie Vergeltung für den getöteten Bruder fordern und zugleich offen aussprechen, dass dadurch der Erbe vernichtet wird. Die Spannung soll stehen bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eindringlich; die weibliche Höflichkeitsform »deine Dienerin« und die Glut-Metapher werden ausdrücklich bewahrt. Archaismen wie »siehe«, »Magd« und »Erdenrest« werden vermieden.
