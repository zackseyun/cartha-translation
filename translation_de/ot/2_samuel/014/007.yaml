review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Sinn des Verses insgesamt zuverlässig wieder, einschließlich der feindlichen Erhebung der Verwandtschaft, der Vergeltungsforderung und der Metapher von der verbleibenden Kohle. Zwei Nuancen sollten jedoch korrigiert werden: מַכֵּה אָחִיו ist zunächst „der seinen Bruder geschlagen hat“ und wird erst im Relativsatz als derjenige bestimmt, „den er getötet hat“; außerdem verbindet וְנַשְׁמִידָה die Vernichtung des Erben schlicht koordinierend, nicht ausdrücklich als durch die Tötung bewirkte Folge („damit“).'
  naturalness: „Sippe“, „deine Dienerin“, „herausgeben“ und „auf der Erde“ sind in modernem Standarddeutsch verständlich und im würdigen Register passend. „Verbliebene Glut“ bewahrt die hebräische Metapher genauer als „letzte Glut“, ohne unnatürlich zu wirken.
  terminology: „Dienerin“ erhält die weibliche, demütige Selbstbezeichnung. „Erbe“ und „Nachkommenschaft“ sind sachgerecht. Die Fußnoten sollten die Metapher als Bild für die verbleibende Familienlinie erklären, aber nicht enger als ausschließlich „ihren letzten Sohn“ festlegen, da das Bild im Wortlaut selbst weiter gefasst bleibt.
  issues:
