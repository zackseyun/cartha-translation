    issue: Das anfängliche Partizip wird vorzeitig als „erschlagen hat“ wiedergegeben.
    rationale: מַכֵּה אָחִיו bedeutet wörtlich „der seinen Bruder geschlagen hat“; erst אֲשֶׁר הָרָג („den er getötet hat“) benennt den Tod. Die deutsche Fassung sollte diese Abfolge bewahren und die doppelte Todesaussage vermeiden.
  - severity: low
    issue: „Damit auch den Erben vernichten“ setzt eine kausale Folgerung stärker als der hebräische Text.
    rationale: וְנַשְׁמִידָה גַּם אֶת־הַיּוֹרֵשׁ lautet koordinierend „und wir werden auch den Erben vernichten“. Die Folgewirkung ist im Kontext plausibel, sollte aber nicht durch „damit“ grammatisch festgelegt werden.
  - severity: low
    issue: „Letzte Glut“ verstärkt „verbliebene Kohle“ zu „letzte“.
    rationale: Die Bildrede impliziert zwar die Bedrohung der letzten Hoffnung der Linie, doch נִשְׁאָרָה bedeutet ausdrücklich „verblieben“. Diese Formulierung erhält die Metapher präziser.
