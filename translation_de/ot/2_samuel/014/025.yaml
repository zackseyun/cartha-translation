base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/025.yaml
  text: In all Israel there was not a man as handsome as Absalom[a], so highly praised; from the sole of his foot to the crown of his head there was no blemish in him.
translation:
  language: de
  text: In ganz Israel gab es keinen Mann, der so schön war wie Absalom. Er wurde überaus gerühmt. Von seiner Fußsohle bis zu seinem Scheitel war kein Makel an ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er war außerordentlich zu rühmen.“ Die hebräische Wendung לְהַלֵּל מְאֹד kann Absaloms außergewöhnliche Lobwürdigkeit oder das außergewöhnliche Maß des Lobes bezeichnen, das er wegen seines Erscheinungsbildes erhielt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאַבְשָׁלוֹם
  choice: wie Absalom
  rationale: Die Verbindung aus Konjunktion und כְּ stellt Absalom als Vergleichsmaßstab heraus. Im Deutschen lässt sich dies innerhalb der superlativischen Vergleichskonstruktion natürlich mit „wie Absalom“ wiedergeben, ohne ein nicht ausdrücklich vorhandenes zeitliches „nun“ einzuführen.
- source_word: לֹא הָיָה אִישׁ יָפֶה בְּכָל יִשְׂרָאֵל
  choice: In ganz Israel gab es keinen Mann, der so schön war
  rationale: Die Verneinung mit dem anschließenden Vergleich bezeichnet eine unübertroffene Schönheit. Die deutsche Relativsatzkonstruktion gibt diesen Sinn klar und idiomatisch wieder.
- source_word: יָפֶה
  choice: schön
  rationale: יָפֶה bezeichnet hier das ansprechende äußere Erscheinungsbild. „Schön“ ist im heutigen Standarddeutsch auch auf einen Mann anwendbar und stilistisch würdiger als „gutaussehend“.
- source_word: לְהַלֵּל מְאֹד
  choice: so überaus gerühmt wurde
  rationale: Der Infinitiv mit מְאֹד drückt das außergewöhnliche Maß des Lobes aus. Die passive Form wahrt den Bezug auf die öffentliche Anerkennung seines Erscheinungsbildes, ohne das Lob selbst zur Erzählerwertung zu machen.
- source_word: מִכַּף רַגְלוֹ
  choice: Von seiner Fußsohle
  rationale: כַּף bezeichnet in Verbindung mit רֶגֶל idiomatisch die Fußsohle.
- source_word: וְעַד קָדְקֳדוֹ
  choice: bis zu seinem Scheitel
  rationale: קָדְקֹד bezeichnet den Scheitel beziehungsweise den höchsten Teil des Kopfes. „Scheitel“ bewahrt die gehobene, knappe Körper-Merismusformel.
- source_word: לֹא הָיָה בוֹ מוּם
  choice: war kein Makel an ihm
  rationale: מוּם bezeichnet einen körperlichen Fehler oder Makel. „Makel“ erhält den leicht gehobenen Ton und lässt den körperlichen Bezug im Kontext bestehen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt körperbezogen und vermeidet sowohl altertümliche Wendungen als auch umgangssprachliches „gutaussehend“. Der zweite Satz bewahrt die hebräische Spannweite von der Fußsohle bis zum Scheitel.
