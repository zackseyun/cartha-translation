  to: 'Absalom sagte zu Joab: »Sieh, ich habe dir sagen lassen: ›Komm her, damit ich dich zum König schicken kann, um ihm zu sagen: Warum bin ich aus Geschur gekommen? Es wäre besser für mich, wenn ich noch dort wäre.[a]‹ Nun lass mich das Angesicht des Königs sehen[b]; und wenn Schuld an mir ist, soll er mich töten.«'
