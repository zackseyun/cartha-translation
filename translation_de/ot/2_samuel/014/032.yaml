base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
translation:
  language: de
  text: 'Absalom sagte zu Joab: »Sieh, ich habe dir sagen lassen: ›Komm her, damit ich dich zum König schicken kann, um ihm zu sagen: Warum bin ich aus Geschur gekommen? Es wäre besser für mich, wenn ich noch dort wäre.[a]‹ Nun lass mich das Angesicht des Königs sehen[b]; und wenn Schuld an mir ist, soll er mich töten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Besser für mich, noch bin ich dort.« Der hebräische Satz ist verkürzt.'
    reason: lexical_alternative
  - marker: b
    text: »Das Angesicht des Königs sehen« ist eine hebräische Wendung dafür, vor dem König zu erscheinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Der moderne Aufmerksamkeitsruf bewahrt die hinweisende Kraft des hebräischen Diskursmarkers, ohne altertümlich zu klingen.
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: ich habe nach dir geschickt
  rationale: Im Zusammenhang ist das Senden einer Aufforderung an Joab gemeint; die deutsche Wendung gibt dies natürlich wieder.
- source_word: בֹּא הֵנָּה
  choice: Komm her
  rationale: Gibt Imperativ und Ortsadverb direkt und idiomatisch wieder.
- source_word: וְאֶשְׁלְחָה אֹתְךָ אֶל הַמֶּלֶךְ
  choice: damit ich dich zum König schicken kann
  rationale: Die Kohortativform bezeichnet hier den Zweck der Aufforderung.
- source_word: לָמָּה בָּאתִי מִגְּשׁוּר
  choice: Warum bin ich aus Geschur gekommen?
  rationale: Bewahrt die aktive erste Person des Hebräischen und den Gegenwartsbezug von Absaloms Klage.
- source_word: טוֹב לִי עוֹד אֲנִי שָׁם
  choice: Es wäre besser für mich, wenn ich noch dort wäre
  rationale: Die elliptische Vergleichsaussage wird in natürlichem Deutsch ergänzt; »noch« bewahrt עוֹד.
- source_word: וְעַתָּה
  choice: Nun aber
  rationale: Kennzeichnet den rhetorischen Übergang von der Klage zur Forderung, ohne einen nicht ausdrücklich vorhandenen Kausalzusammenhang einzuführen.
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  choice: will ich das Angesicht des Königs sehen
  rationale: Bewahrt das hebräische Bild und gibt den entschiedenen, volitiven Sinn der Form wieder.
- source_word: עָוֺן
  choice: Schuld
  rationale: Passt zum rechtlich gefärbten Zusammenhang und lässt sowohl Vergehen als auch daraus erwachsende Schuld anklingen.
- source_word: וֶהֱמִתָנִי
  choice: soll er mich töten
  rationale: Gibt die kausative Form direkt und würdevoll wieder, ohne eine bestimmte Hinrichtungsform vorauszusetzen.
