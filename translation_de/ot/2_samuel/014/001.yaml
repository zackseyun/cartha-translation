source:
  edition: WLC
  text: וַ/יֵּ֖דַע יוֹאָ֣ב בֶּן צְרֻיָ֑ה כִּֽי לֵ֥ב הַ/מֶּ֖לֶךְ עַל אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/001.yaml
  text: Joab son of Zeruiah knew that the king’s heart was toward Absalom[a].
translation:
  language: de
  text: Joab, der Sohn Zerujas, erkannte, dass das Herz des Königs auf Absalom gerichtet war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Das Herz des Königs war auf Absalom.« Der knappe hebräische Ausdruck kann auch bedeuten: »Der König sehnte sich nach Absalom.« Manche verstehen ihn dagegen als: »Das Herz des Königs war gegen Absalom.« Der folgende Zusammenhang spricht eher für eine positive Neigung.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: erkannte
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Erkannte“ gibt ידע hier natürlich als Wahrnehmung einer bestehenden inneren Haltung wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „Nun“ einzufügen.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: Joab, der Sohn Zerujas
  rationale: Die Konstruktverbindung wird in natürlichem Deutsch wiedergegeben; die Eigennamen folgen der geläufigen deutschen biblischen Schreibweise.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Joab erkannte.
- source_word: לֵב הַמֶּלֶךְ
  choice: das Herz des Königs
  rationale: „Herz“ bewahrt die hebräische Redeweise für innere Haltung, Willen und Zuneigung, statt sie auf „Gedanken“ oder „Gefühle“ einzuengen.
- source_word: עַל
  choice: Absalom zugeneigt war
  rationale: Die knappe Verbindung von לֵב und עַל bezeichnet hier eine Ausrichtung auf Absalom. „Zugeneigt“ ist im Deutschen lesbar und entspricht dem folgenden Kontext, legt sich aber weniger stark als „sehnte sich nach“ auf eine bestimmte Gefühlsregung fest.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Der Personenname wird in der etablierten deutschen Form wiedergegeben.
theological_decisions:
- issue: Mehrdeutigkeit der Haltung des Königs gegenüber Absalom
  choice: das Herz des Königs war Absalom zugeneigt
  alternative: das Herz des Königs war auf Absalom gerichtet / der König sehnte sich nach Absalom / das Herz des Königs war gegen Absalom
  rationale: Der hebräische Ausdruck ist elliptisch und nennt die genaue Art der Ausrichtung nicht. Der Zusammenhang, in dem Joab Absaloms Rückkehr vorbereitet, spricht für eine positive Neigung. Die Fußnote hält dennoch die sprachliche Kürze und die abweichende negative Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Herz-Metapher bleibt erhalten; die Satzstellung ist natürlich, und ein nicht ausdrücklich vorhandenes einleitendes „Nun“ wird vermieden.
