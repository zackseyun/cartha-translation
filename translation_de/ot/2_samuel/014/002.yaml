  text: וַ/יִּשְׁלַ֤ח יוֹאָב֙ תְּק֔וֹעָ/ה וַ/יִּקַּ֥ח מִ/שָּׁ֖ם אִשָּׁ֣ה חֲכָמָ֑ה וַ/יֹּ֣אמֶר אֵ֠לֶי/הָ הִֽתְאַבְּלִי נָ֞א וְ/לִבְשִׁי נָ֣א בִגְדֵי אֵ֗בֶל וְ/אַל תָּס֨וּכִי֙ שֶׁ֔מֶן וְ/הָיִ֕ית כְּ/אִשָּׁ֗ה זֶ֚ה יָמִ֣ים רַבִּ֔ים מִתְאַבֶּ֖לֶת עַל מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/002.yaml
  text: So Joab sent to Tekoa and took from there a wise woman[a], and he said to her, “Please pretend to be mourning, and please put on mourning clothes, and do not anoint yourself with oil[d][c][b], but be like a woman who has been mourning for the dead many days.”
translation:
  language: de
  text: 'Da schickte Joab nach Tekoa und ließ von dort eine kluge Frau holen. Er sagte zu ihr: »Tu bitte so, als würdest du trauern[a], zieh Trauerkleider an und salbe dich nicht mit Öl[b]. Verhalte dich wie eine Frau, die schon seit vielen Tagen um einen Toten trauert.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Trauere bitte« oder »Gib dich bitte als Trauernde«. Das hebräische Verb bedeutet »trauern«; aus dem Zusammenhang wird jedoch deutlich, dass Joab ihr aufträgt, für den geplanten Auftritt die Rolle einer Trauernden anzunehmen.'
    reason: lexical_alternative
  - marker: b
    text: Auf Öl zu verzichten war ein übliches Zeichen der Trauer; das Einölen gehörte sonst zur Körperpflege und konnte Erfrischung oder festliche Freude ausdrücken.
    reason: cultural_note
lexical_decisions:
- source_word: תְּקוֹעָה
  choice: Tekoa
  rationale: Der Ortsname wird in seiner im Deutschen gebräuchlichen biblischen Form transliteriert.
- source_word: וַיִּקַּח מִשָּׁם
  choice: ließ von dort … holen
  rationale: Wörtlich steht »nahm von dort«. Im Zusammenhang bedeutet die Wendung, dass Joab die Frau aus Tekoa zu sich holen ließ; die deutsche Fassung gibt diesen Handlungssinn natürlich wieder.
- source_word: אִשָּׁה חֲכָמָה
  choice: eine kluge Frau
  rationale: חֲכָמָה kann Weisheit, Klugheit oder besondere Befähigung bezeichnen. »Kluge Frau« bewahrt die semantische Breite und passt zu ihrer Aufgabe, einen überzeugenden Appell vorzutragen.
- source_word: הִתְאַבְּלִי נָא
  choice: Tu bitte so, als würdest du trauern
  rationale: Das Verb bedeutet zunächst »trauern«. Da Joab ihr eine Rolle für einen geplanten Auftritt zuweist, wird die kontextuelle Bedeutung des vorgetäuschten Trauerns im Haupttext deutlich gemacht; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: בִגְדֵי אֵבֶל
  choice: Trauerkleider
  rationale: Die knappe deutsche Zusammensetzung gibt die wörtlichen »Kleider der Trauer« idiomatisch und verständlich wieder.
- source_word: וְאַל תָּסוּכִי שֶׁמֶן
  choice: salbe dich nicht mit Öl
  rationale: סוך bezeichnet das Auftragen von Öl auf den Körper. »Sich mit Öl salben« ist sachlich genau und in gehobenem, aber verständlichem Deutsch natürlich.
- source_word: זֶה יָמִים רַבִּים מִתְאַבֶּלֶת עַל מֵת
  choice: die schon seit vielen Tagen um einen Toten trauert
  rationale: Die Formulierung gibt den andauernden Zustand des Partizips, die längere Zeitspanne und den unbestimmten Singular מֵת wieder, ohne ihn auf eine bestimmte Person festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist natürlich formuliert; das wiederholte hebräische נָא wird durch ein einziges höfliches »bitte« wiedergegeben, um im Deutschen unnötige Schwerfälligkeit zu vermeiden.
