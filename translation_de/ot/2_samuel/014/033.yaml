base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/033.yaml
  text: Then Joab came to the king and told him[a], and he called for Absalom. So he came to the king and bowed himself with his face to the ground before the king[b], and the king kissed Absalom.
translation:
  language: de
  text: Da kam Joab zum König und berichtete ihm. Darauf ließ der König Absalom rufen.[a] Absalom kam zum König und warf sich vor ihm mit dem Gesicht zur Erde nieder, vor dem König. Und der König küsste Absalom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapper: »Und er rief nach Absalom.« Das Subjekt wird im Hebräischen nicht eigens genannt; dem Zusammenhang nach ist der König gemeint.'
    reason: lexical_and_grammatical_alternative
  - marker: b
    text: Der Kuss dürfte Versöhnung oder wiederhergestellte Gunst ausdrücken; der Text selbst sagt jedoch nur, dass der König Absalom küsste.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: Das häufige narrative Verb בוא beschreibt hier die Bewegung Joabs beziehungsweise Absaloms zum König; »kam« ist im Deutschen natürlich und textnah.
- source_word: וַיַּגֵּד לוֹ
  choice: berichtete ihm
  rationale: נגד im Hifil bezeichnet ein Mitteilen oder Berichten. »Berichtete ihm« passt zum höfischen Zusammenhang, ohne den nicht genannten Inhalt zu ergänzen.
- source_word: וַיִּקְרָא אֶל אַבְשָׁלוֹם
  choice: ließ der König Absalom rufen
  rationale: קרא אל kann »zu jemandem rufen« oder im höfischen Zusammenhang »jemanden rufen lassen« bedeuten. Der Kontext legt den König als handelnde Person nahe; die Fußnote weist auf die knappe und hinsichtlich des Subjekts weniger ausdrückliche hebräische Form hin.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: warf sich vor ihm nieder
  rationale: Die Form von שׁחה bezeichnet eine ehrerbietige Niederwerfung. Der folgende Ausdruck erklärt die vollständige Prostration, sodass diese Wiedergabe zugleich verständlich und präzise ist.
- source_word: עַל אַפָּיו אַרְצָה
  choice: mit dem Gesicht zur Erde
  rationale: Der Ausdruck bedeutet wörtlich etwa »auf seinem Gesicht erdwärts« und beschreibt Absaloms Körperhaltung bei der Niederwerfung.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: vor dem König
  rationale: Die Wiedergabe erhält die ausdrückliche Wiederholung des Königs im Hebräischen, obwohl bereits »vor ihm« steht.
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְאַבְשָׁלוֹם
  choice: der König küsste Absalom
  rationale: נשׁק bezeichnet hier einen wirklichen Kuss. Die direkte Wiedergabe vermeidet es, seine erzählerische Bedeutung bereits im Haupttext festzulegen.
theological_decisions:
- issue: Bedeutung des Kusses des Königs
  choice: Die Handlung wird wörtlich als Kuss wiedergegeben.
  alternative: Den Kuss ausdrücklich als Versöhnung oder Wiederherstellung der königlichen Gunst bezeichnen.
  rationale: Der Kuss dürfte Versöhnung oder wiedergewährte Gunst signalisieren; der hebräische Text nennt jedoch nur die Handlung. Die Übersetzung bewahrt diese Zurückhaltung und damit die Spannung des weiteren Erzählverlaufs.
- issue: Handelnde Person beim Rufen Absaloms
  choice: Der König wird aufgrund des Zusammenhangs als Subjekt genannt, die sprachliche Kürze des Hebräischen aber in einer Fußnote offengelegt.
  alternative: Joab als Subjekt verstehen oder das Subjekt im Deutschen durch eine Passivform unbestimmt lassen.
  rationale: Die anschließende Audienz und die gängige Funktion des königlichen Rufens sprechen für den König. Da das Hebräische das Subjekt nicht mit einem eigenen Substantiv wiederholt, wird die verbleibende formale Mehrdeutigkeit nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählfolge bleibt knapp; die Wiederholung »vor dem König« bewahrt die hebräische Hervorhebung. Interpretierende Zusätze zur Bedeutung des Kusses stehen nur in der Fußnote.
