- from: 'Wenn er sein Haupthaar schneiden ließ – jeweils nach Ablauf eines Jahres ließ er es schneiden[a], weil es ihm zu schwer wurde –, dann wog er sein Haupthaar: zweihundert Schekel nach dem königlichen Gewichtsmaß.[b]'
  to: 'Wenn er sein Kopfhaar schnitt – jeweils nach Ablauf eines Jahres[a] schnitt er es, weil es ihm zu schwer war –, wog er sein Kopfhaar: zweihundert Schekel nach dem königlichen Gewichtsmaß.[b]'
  rationale: Die Revision entfernt die nicht im Ausgangstext enthaltene kausative Aussage, dass Absalom sein Haar durch andere schneiden ließ, und gibt die Aussage über die Schwere des Haares ohne zusätzliche Veränderungsnuance wieder. Die Zeitangabe und die Erläuterung des königlichen Gewichtsstandards bleiben mitsamt ihren Fußnoten erhalten.
