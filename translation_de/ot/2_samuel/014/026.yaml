base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/026.yaml
  text: 'Whenever he cut the hair of his head—at the end of every year he would cut it[a], because it was heavy on him—when he cut it, he weighed the hair of his head: two hundred shekels by the king’s stone.'
translation:
  language: de
  text: 'Wenn er sein Kopfhaar schnitt – jeweils nach Ablauf eines Jahres[a] schnitt er es, weil es ihm zu schwer war –, wog er sein Kopfhaar: zweihundert Schekel nach dem königlichen Gewichtsmaß.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich lässt die hebräische Zeitangabe auch die allgemeinere Wiedergabe „von Zeit zu Zeit“ zu; hier ist wahrscheinlich ein jährlicher Abstand gemeint.
    reason: textual_ambiguity
  - marker: b
    text: 'Schekel sind hier eine Gewichtseinheit. Hebräisch wörtlich: „nach dem Stein des Königs“, das heißt nach dem königlichen Standardgewicht.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבְגַלְּחוֹ אֶת־רֹאשׁוֹ
  choice: Wenn er sein Haupthaar schneiden ließ
  rationale: Die Infinitivkonstruktion bezeichnet hier einen wiederkehrenden Zeitpunkt. Das wörtliche Objekt „seinen Kopf“ ist im Deutschen sinngemäß als „sein Haupthaar“ wiederzugeben; „schneiden ließ“ passt zum höfischen Kontext, ohne eine vollständige Rasur vorauszusetzen.
- source_word: וְהָיָה מִקֵּץ יָמִים לַיָּמִים
  choice: jeweils nach Ablauf eines Jahres
  rationale: Die idiomatische Zeitangabe bezeichnet im Kontext einen regelmäßig wiederkehrenden jährlichen Abstand. „Jeweils“ macht den iterativen Charakter deutlich.
- source_word: אֲשֶׁר יְגַלֵּחַ
  choice: ließ er es schneiden
  rationale: Das Imperfekt beschreibt eine gewohnheitsmäßige Handlung. Das Pronomen bezieht sich natürlich auf das zuvor genannte Haupthaar.
- source_word: כִּי־כָבֵד עָלָיו
  choice: weil es ihm zu schwer wurde
  rationale: כבד על bezeichnet, dass etwas auf jemandem schwer lastet. „Zu schwer wurde“ gibt den Anlass für das Schneiden im natürlichen Deutschen wieder.
- source_word: וְשָׁקַל אֶת־שְׂעַר רֹאשׁוֹ
  choice: dann wog er sein Haupthaar
  rationale: Die Formulierung bewahrt die ausdrückliche Angabe des Kopfhaars und stellt die wiederkehrende Abfolge verständlich dar.
- source_word: מָאתַיִם שְׁקָלִים
  choice: zweihundert Schekel
  rationale: Schekel bezeichnet hier eine Gewichtseinheit, nicht Geld; dies wird in einer Fußnote klargestellt.
- source_word: בְּאֶבֶן הַמֶּלֶךְ
  choice: nach dem königlichen Gewichtsmaß
  rationale: אבן bedeutet wörtlich „Stein“, bezeichnet hier jedoch einen Gewichtsstein und damit den königlichen Gewichtsstandard. Die funktionale Wiedergabe ist im Haupttext verständlicher; der Wortlaut wird in der Fußnote erläutert.
