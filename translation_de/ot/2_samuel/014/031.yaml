base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/031.yaml
  text: Then Joab arose and went to Absalom’s house and said to him[a], “Why have your servants set my field on fire?”
translation:
  language: de
  text: 'Da machte sich Joab auf, ging zu Absalom ins Haus und sagte zu ihm: „Warum haben deine Diener mein Feld in Brand gesteckt?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: Da machte sich Joab auf
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da“ markiert die Folge, und „machte sich auf“ gibt die idiomatische Verbindung von Aufstehen und anschließendem Gehen natürlich wieder.
- source_word: וַיָּבֹא אֶל אַבְשָׁלוֹם הַבָּיְתָה
  choice: ging zu Absalom ins Haus
  rationale: Das direktionale He in הַבָּיְתָה bezeichnet die Bewegung zum beziehungsweise ins Haus. Die Formulierung lässt, wie der hebräische Wortlaut, offen, ob ausdrücklich Absaloms eigenes Haus gemeint ist.
- source_word: לָמָּה
  choice: Warum
  rationale: Direkte und idiomatische Wiedergabe der Frage nach dem Grund.
- source_word: הִצִּיתוּ
  choice: haben … in Brand gesteckt
  rationale: Der Hifil-Stamm bezeichnet das Entzünden beziehungsweise Inbrandsetzen und bewahrt so den kausativen Sinn.
- source_word: עֲבָדֶךָ
  choice: deine Diener
  rationale: Das Substantiv steht formal im Singular, wird durch das pluralische Verb jedoch kollektiv verstanden. „Diener“ passt zum sozialen und höfischen Kontext, ohne unnötig die stärkere Nuance von „Sklaven“ festzulegen.
- source_word: הַחֶלְקָה אֲשֶׁר לִי
  choice: mein Feld
  rationale: חֶלְקָה bezeichnet ein abgegrenztes Stück Land; der Relativsatz אֲשֶׁר לִי kennzeichnet es als Joabs Besitz. „Mein Feld“ ist im Deutschen knapp und natürlich.
- source_word: בָּאֵשׁ
  choice: in Brand
  rationale: Das Beth bezeichnet hier das Mittel („mit Feuer“). In Verbindung mit „stecken“ ist „in Brand“ die idiomatische deutsche Entsprechung.
theological_decisions: []
