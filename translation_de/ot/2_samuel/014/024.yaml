  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ יִסֹּ֣ב אֶל בֵּית֔/וֹ וּ/פָנַ֖/י לֹ֣א יִרְאֶ֑ה וַ/יִּסֹּ֤ב אַבְשָׁלוֹם֙ אֶל בֵּית֔/וֹ וּ/פְנֵ֥י הַ/מֶּ֖לֶךְ לֹ֥א רָאָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/024.yaml
  text: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
translation:
  language: de
  text: 'Doch der König sagte: „Er soll sich seinem Haus zuwenden und mein Angesicht nicht sehen.[a]“ Da wandte sich Absalom seinem Haus zu und sah das Angesicht des Königs nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mein Angesicht sehen“ beziehungsweise „das Angesicht des Königs sehen“ ist im Hebräischen eine Wendung, die bedeuten kann, in jemandes Gegenwart zu kommen oder eine Audienz zu erhalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסֹּב / וַיִּסֹּב (סבב)
  choice: soll … zurückkehren / kehrte … zurück
  rationale: Das Verb bezeichnet hier mit אֶל־בֵּיתוֹ die Bewegung weg vom Zugang zum König und hin zum eigenen Haus. „Zurückkehren“ klingt im Deutschen natürlich und bewahrt die Wiederholung in Befehl und Ausführung.
- source_word: בֵּיתוֹ
  choice: sein eigenes Haus
  rationale: „Haus“ gibt בַּיִת unmittelbar wieder; „eigenes“ verdeutlicht den Possessivsuffix und den Gegensatz zum Aufenthaltsort beziehungsweise zur Gegenwart des Königs.
- source_word: וּפָנַי לֹא יִרְאֶה
  choice: und mein Angesicht nicht sehen
  rationale: Die konkrete Wendung mit פָּנִים bleibt erhalten, da sie im Hebräischen den persönlichen Zugang beziehungsweise eine Audienz bezeichnet und im zweiten Satz bewusst wiederholt wird.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: und sah das Angesicht des Königs nicht
  rationale: Die wörtliche Wiederholung der Anordnung bewahrt die rhetorische Betonung des verweigerten persönlichen Zugangs.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Standardentsprechung für מֶלֶךְ.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: וַיֹּאמֶר
  choice: Doch … sagte
  rationale: Das narrative Waw kann kontextabhängig eine Abfolge oder einen leichten Gegensatz ausdrücken. „Doch“ hebt hervor, dass der König trotz Absaloms Rückkehr weiterhin den Zugang verweigert.
theological_decisions:
- issue: Wörtliche Wiedergabe der Wendung „mein Angesicht sehen / das Angesicht des Königs sehen“ oder erklärende Wiedergabe als Zugang beziehungsweise Audienz
  choice: Die hebräische Wendung im Haupttext wörtlich bewahren
  alternative: „Er soll nicht vor mich treten“ / „er wurde nicht zum König vorgelassen“
  rationale: Die wörtliche Form wahrt die gezielte Wiederholung und die Bildsprache des Ausgangstextes, ohne die sozialen und politischen Folgen stärker festzulegen, als der Text es tut. Eine Fußnote erklärt den idiomatischen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Angesicht“ ist bewusst etwas gehobener als „Gesicht“, da es die feste biblische Wendung und ihre Wiederholung gut trägt; die Fußnote sichert die unmittelbare Verständlichkeit.
