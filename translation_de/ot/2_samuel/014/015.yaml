  text: וְ֠/עַתָּה אֲשֶׁר בָּ֜אתִי לְ/דַבֵּ֨ר אֶל הַ/מֶּ֤לֶךְ אֲדֹנִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּ֥י יֵֽרְאֻ֖/נִי הָ/עָ֑ם וַ/תֹּ֤אמֶר שִׁפְחָֽתְ/ךָ֙ אֲדַבְּרָה נָּ֣א אֶל הַ/מֶּ֔לֶךְ אוּלַ֛י יַעֲשֶׂ֥ה הַ/מֶּ֖לֶךְ אֶת דְּבַ֥ר אֲמָתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/015.yaml
  text: And now I have come to speak this matter to my lord the king[a], because the people have frightened me. And your servant said, ‘Please let me speak to the king[b]; perhaps the king will do the word of his servant.’
translation:
  language: de
  text: 'Und nun bin ich gekommen, um zu meinem Herrn, dem König, über diese Sache zu sprechen, weil das Volk mir Angst gemacht hat.[a] Da sagte deine Dienerin: »Ich möchte doch zum König sprechen; vielleicht wird der König tun, was seine Dienerin sagt.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »weil das Volk mich in Angst versetzt hat«. Das hebräische Verb hat hier verursachende Bedeutung; gemeint ist nicht: »weil das Volk mich fürchtet«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »das Wort seiner Dienerin tun«, das heißt, ihrer Aussage oder Bitte entsprechend handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die Verknüpfung durch ו als auch den zeitlich-folgernden Übergang עַתָּה.
- source_word: אֲשֶׁר בָּאתִי לְדַבֵּר
  choice: bin ich gekommen, um … zu reden
  rationale: Gibt die Bewegung mit anschließendem Zweck wieder und bezeichnet den gegenwärtigen Anlass ihres Kommens.
- source_word: אֶל הַמֶּלֶךְ אֲדֹנִי
  choice: mit meinem Herrn, dem König
  rationale: Bewahrt die ehrerbietige Anrede und formuliert sie in natürlicher deutscher Apposition.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: über diese Sache
  rationale: דָּבָר bezeichnet hier die vorgetragene Angelegenheit, nicht lediglich ein einzelnes gesprochenes Wort.
- source_word: כִּי יֵרְאֻנִי הָעָם
  choice: weil das Volk mir Angst gemacht hat
  rationale: Die Kausativbedeutung des Verbs wird ausdrücklich wiedergegeben; nicht das Volk fürchtet die Frau, sondern es versetzt sie in Angst.
- source_word: וַתֹּאמֶר שִׁפְחָתְךָ
  choice: Da sagte deine Dienerin
  rationale: Die weibliche Selbstbezeichnung und der demütige höfische Sprachgebrauch bleiben sichtbar.
- source_word: אֲדַבְּרָה נָּא אֶל הַמֶּלֶךְ
  choice: Ich will doch mit dem König reden
  rationale: Der Kohortativ mit נָא drückt einen höflich abgemilderten Entschluss aus; „doch“ vermittelt diese Nuance im Deutschen, ohne einen ausdrücklich genannten Adressaten für „lass mich“ einzuführen.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Bewahrt die Unsicherheit beziehungsweise vorsichtige Hoffnung der Sprecherin.
- source_word: יַעֲשֶׂה הַמֶּלֶךְ אֶת דְּבַר אֲמָתוֹ
  choice: wird der König tun, was seine Dienerin sagt
  rationale: Hält an der allgemeinen Bedeutung von עָשָׂה fest und gibt דְּבַר idiomatisch wieder, ohne es enger als „Bitte gewähren“ auszulegen.
