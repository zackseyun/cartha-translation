  register: Modernes, würdiges Standarddeutsch mit verständlicher höfischer Rede. Die weiblichen Selbstbezeichnungen שִׁפְחָה und אָמָה werden beide als „Dienerin“ wiedergegeben, da der Zusammenhang keinen sicheren Bedeutungsunterschied verlangt.
