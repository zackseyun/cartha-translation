  text: וַ/תֹּ֨אמֶר֙ שִׁפְחָ֣תְ/ךָ֔ יִֽהְיֶה נָּ֛א דְּבַר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לִ/מְנוּחָ֑ה כִּ֣י כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים כֵּ֣ן אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ לִ/שְׁמֹ֨עַ֙ הַ/טּ֣וֹב וְ/הָ/רָ֔ע וַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ יְהִ֥י עִמָּֽ/ךְ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/017.yaml
  text: Then your servant said[a], ‘Please let the word of my lord the king bring rest, for my lord the king is like the angel of God, to hear the good and the evil[b]. And may Yahweh your God be with you.’
translation:
  language: de
  text: 'Da sagte deine Dienerin: »Möge doch das Wort meines Herrn, des Königs, Ruhe bringen! Denn mein Herr, der König, ist wie der Engel Gottes[a], das Gute und das Böse zu hören[b]. Und möge Jahwe, dein Gott, mit dir sein!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie ein Engel Gottes«; das hebräische Wort kann auch allgemeiner »Bote Gottes« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das Gute und das Böse zu hören«; gemeint sein kann, Gut und Böse zu unterscheiden oder darüber zu urteilen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחָתְךָ
  choice: deine Dienerin
  rationale: Die feminine Form wird im Deutschen natürlich und ausdrücklich wiedergegeben; zugleich bleibt die höfische Selbsterniedrigung der Sprecherin erhalten.
- source_word: יִהְיֶה נָּא
  choice: Möge doch ...
  rationale: Der Jussiv mit נָא drückt eine ehrerbietige Bitte aus; „möge doch“ bewahrt sowohl den Wunschcharakter als auch den höflichen Ton.
- source_word: דְּבַר אֲדֹנִי הַמֶּלֶךְ
  choice: das Wort meines Herrn, des Königs
  rationale: דבר bleibt als „Wort“ erhalten, obwohl im Zusammenhang auch der königliche Ausspruch oder Entscheid gemeint sein kann.
- source_word: לִמְנוּחָה
  choice: Ruhe bringen
  rationale: Die Wendung gibt den Zweck beziehungsweise die Wirkung des königlichen Wortes natürlich wieder und bewahrt das Bild von Ruhe und Entlastung.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: wie der Engel Gottes
  rationale: מלאך kann „Bote“ oder „Engel“ bedeuten. In dieser ehrenden Vergleichsformel liegt die übermenschliche Bedeutung „Engel“ nahe; die mögliche allgemeinere Lesart wird in der Fußnote bewahrt.
- source_word: לִשְׁמֹעַ הַטּוֹב וְהָרָע
  choice: wenn es darum geht, das Gute und das Böse zu hören
  rationale: „Hören“ bildet das hebräische שמע formal ab, während die einleitende Wendung den deutschen Satzfluss herstellt. Die richterliche Bedeutung des Unterscheidens wird nicht in den Haupttext eingetragen, sondern erläutert.
- source_word: וַיהוָה אֱלֹהֶיךָ
  choice: Jahwe, dein Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die persönliche Zuordnung „dein Gott“ bleibt erhalten.
- source_word: יְהִי עִמָּךְ
  choice: möge ... mit dir sein
  rationale: Dies ist eine natürliche deutsche Wiedergabe des benediktorischen Jussivs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מלאך im Vergleich mit dem König
  choice: Engel
  alternative: Bote
  rationale: Der Zusammenhang legt einen Vergleich mit einem übermenschlichen Boten Gottes nahe. Da das Lexem beide Bedeutungen tragen kann, wird „Bote“ als echte Alternative in der Fußnote genannt.
- issue: Bedeutung von „das Gute und das Böse hören“
  choice: die wörtliche Bildsprache im Haupttext bewahren
  alternative: zwischen Gut und Böse unterscheiden beziehungsweise darüber urteilen
  rationale: Die hebräische Formulierung kann gerichtliches Wahrnehmen und Urteilen bezeichnen. Die Übersetzung bewahrt ihre auffällige Bildsprache, während die idiomatische Bedeutung in der Fußnote erklärt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit höfisch-ehrerbietigem Ton. Die feminine Sprecherrolle wird sichtbar gemacht. Der parallele Titel „mein Herr, der König“ und die ungewöhnliche hebräische Wendung vom Hören des Guten und Bösen bleiben bewusst erhalten.
