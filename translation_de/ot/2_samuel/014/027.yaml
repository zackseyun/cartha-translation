base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/027.yaml
  text: Three sons and one daughter were born to Absalom[a], and her name was Tamar. She was a woman beautiful in appearance.
translation:
  language: de
  text: Absalom wurden drei Söhne und eine Tochter geboren. Sie hieß Tamar. Sie war eine sehr schöne Frau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Frau von schönem Aussehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  choice: Absalom wurden … geboren
  rationale: Der Nifal von ילד bezeichnet hier das Geborenwerden; לְ markiert die Elternschaft. Die deutsche Konstruktion gibt dies natürlich und präzise wieder.
- source_word: שְׁלוֹשָׁה בָנִים וּבַת אַחַת
  choice: drei Söhne und eine Tochter
  rationale: בָנִים bezeichnet ausdrücklich Söhne; die Zahlenangaben werden direkt wiedergegeben.
- source_word: וּשְׁמָהּ תָּמָר
  choice: Sie hieß Tamar
  rationale: Die feminine Endung bezieht sich auf die unmittelbar zuvor genannte Tochter. „Sie hieß“ ist die natürliche moderne deutsche Entsprechung von „ihr Name war“.
- source_word: הִיא הָיְתָה אִשָּׁה יְפַת מַרְאֶה
  choice: Sie war eine sehr schöne Frau
  rationale: יְפַת מַרְאֶה beschreibt eine Frau als äußerlich schön. Die gewählte Formulierung ist im Deutschen natürlich; die wörtlichere Ausdrucksweise wird in der Fußnote bewahrt.
