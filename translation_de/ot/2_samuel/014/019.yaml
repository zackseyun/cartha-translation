base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/019.yaml
  text: Then the king said[a], “Is the hand of Joab with you in all this?” And the woman answered and said, “As your soul lives, my lord the king, no one can turn to the right or to the left from anything that my lord the king has spoken, for your servant Joab himself commanded me[b], and he himself put all these words into the mouth of your female servant.”
translation:
  language: de
  text: 'Da sagte der König: „Hat Joab bei all dem seine Hand im Spiel?[a]“ Die Frau antwortete: „So wahr du lebst, mein Herr, der König:[b] Niemand kann nach rechts oder links von dem abweichen, was mein Herr, der König, gesagt hat.[c] Denn dein Diener Joab selbst hat mir befohlen, und er selbst hat deiner Dienerin all diese Worte in den Mund gelegt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ist Joabs Hand bei dir in all dem?“ Gemeint ist, ob Joab an der Sache beteiligt ist oder dahintersteht.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „So wahr deine Seele lebt.“ Dies ist eine hebräische Schwurformel.'
    reason: lexical_alternative
  - marker: c
    text: „Nach rechts oder links abweichen“ ist ein hebräisches Idiom dafür, von dem Gesagten abzuweichen, ihm zu widersprechen oder ihm auszuweichen.
    reason: cultural_note
lexical_decisions:
- source_word: הֲיָד יוֹאָב אִתָּךְ בְּכָל־זֹאת
  choice: Hat Joab bei all dem seine Hand im Spiel?
  rationale: Die deutsche Wendung bewahrt das konkrete Bild der „Hand“ und gibt zugleich natürlich wieder, dass der König nach Joabs Beteiligung oder Einfluss fragt.
- source_word: חֵי נַפְשְׁךָ
  choice: So wahr du lebst
  rationale: Dies ist die natürliche deutsche Entsprechung der hebräischen Schwurformel; die wörtliche Bezugnahme auf die „Seele“ wird in einer Fußnote kenntlich gemacht.
- source_word: אִם־אִישׁ לְהֵמִין וּלְהַשְׂמִיל
  choice: Niemand kann nach rechts oder links … abweichen
  rationale: Die Verneinung wird dem Sinn der Schwurformel entsprechend wiedergegeben, während das hebräische Richtungsbild erhalten bleibt.
- source_word: עַבְדְּךָ יוֹאָב
  choice: dein Diener Joab
  rationale: Im höfischen Zusammenhang ist „Diener“ die angemessene moderne Wiedergabe der Status- und Loyalitätsbezeichnung.
- source_word: צִוָּנִי
  choice: hat mir befohlen
  rationale: Das Verb bezeichnet einen verbindlichen Befehl und zeigt Joabs leitende Rolle deutlich.
- source_word: שָׂם בְּפִי שִׁפְחָתְךָ אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: hat deiner Dienerin all diese Worte in den Mund gelegt
  rationale: Die Wiedergabe bewahrt sowohl das anschauliche hebräische Idiom als auch die feminine Selbstbezeichnung der Frau.
