translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „deine“ entspricht der hebräischen Rede an den König. Die Satzgliederung wahrt den erzählerischen Ablauf, während „zwischen ihnen eingriff“ die konkrete Funktion des wörtlichen „Retters“ im Kampf verständlich macht.
