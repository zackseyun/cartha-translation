base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/006.yaml
  text: And your servant had two sons[a], and the two of them fought in the field, and there was no one to separate them[b]; then the one struck the other and killed him.
translation:
  language: de
  text: Deine Dienerin hatte zwei Söhne. Die beiden kämpften auf dem Feld, und niemand war da, der zwischen ihnen eingriff[b]. Da schlug der eine den anderen und tötete ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Wörtlich: „und es gab keinen Retter zwischen ihnen“, also niemanden, der eingriff und sie voneinander trennte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁפְחָתְךָ
  choice: Deine Dienerin
  rationale: שִׁפְחָה bezeichnet eine weibliche Dienerin oder Sklavin und dient hier gegenüber dem König als demütige Selbstbezeichnung. „Deine Dienerin“ ist im Deutschen natürlich, würdevoll und geschlechtsspezifisch.
- source_word: שְׁנֵי בָנִים
  choice: zwei Söhne
  rationale: בָנִים bezeichnet hier ausdrücklich männliche Nachkommen.
- source_word: וַיִּנָּצוּ שְׁנֵיהֶם
  choice: Die beiden gerieten ... in einen Kampf
  rationale: נצה bezeichnet in diesem Zusammenhang eine handgreifliche Auseinandersetzung; die Formulierung gibt die Eskalation natürlich wieder.
- source_word: בַּשָּׂדֶה
  choice: draußen auf dem Feld
  rationale: Die Ortsangabe wird klar und idiomatisch wiedergegeben; „draußen“ unterstreicht den vom folgenden Satz vorausgesetzten Mangel an Helfern, ohne den Sinn zu verändern.
- source_word: וְאֵין מַצִּיל בֵּינֵיהֶם
  choice: niemand war da, der zwischen ihnen eingriff
  rationale: מַצִּיל bedeutet wörtlich einen Retter oder Befreier. Im Kontext ist jemand gemeint, der eingreift und die Kämpfenden auseinanderbringt.
- source_word: וַיַּכּוֹ הָאֶחָד אֶת הָאֶחָד
  choice: Da schlug der eine den anderen
  rationale: נכה bedeutet „schlagen“; die Wiedergabe lässt Art und Zahl der Schläge offen.
- source_word: וַיָּמֶת אֹתוֹ
  choice: und tötete ihn
  rationale: 'Die ungewöhnliche Konstruktion mit מות und Objekt hat kausativen Sinn: Er verursachte den Tod des anderen.'
