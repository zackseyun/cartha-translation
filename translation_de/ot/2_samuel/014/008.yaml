  text: Then the king said to the woman[a], “Go to your house, and I will give orders concerning you.”
translation:
  language: de
  text: 'Da sagte der König zu der Frau: »Geh nach Hause! Ich werde in deiner Sache Anweisungen erteilen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich werde zu deinen Gunsten Anweisungen erteilen« beziehungsweise »Ich werde wegen dir Anordnungen erlassen.« Die hebräische Präposition lässt mehrere Nuancen zu; gemeint ist, dass der König Anweisungen zu ihrem Anliegen erteilen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das konsekutive Waw führt die Erzählung weiter; »Da sagte« gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Im Zusammenhang ist die Frau aus Tekoa gemeint; »Frau« ist hier die sachlich passende Bedeutung.
- source_word: לְכִי
  choice: Geh
  rationale: Der feminine Singular des Imperativs von הלך richtet sich unmittelbar an die Frau.
- source_word: לְבֵיתֵךְ
  choice: nach Hause
  rationale: בַּיִת bezeichnet Haus beziehungsweise Zuhause; die idiomatische deutsche Richtungsangabe lautet hier »nach Hause«.
- source_word: וַאֲנִי
  choice: Ich werde
  rationale: Das ausdrücklich gesetzte Pronomen hebt den König als den Handelnden hervor. Im Deutschen wird dies durch das vorangestellte »Ich« ausreichend ausgedrückt.
- source_word: אֲצַוֶּה
  choice: Anordnungen ... geben
  rationale: Das Piel von צוה bedeutet »befehlen, Anweisungen oder Anordnungen geben«; im Mund eines Königs bringt »Anordnungen geben« die amtliche Vollmacht natürlich zum Ausdruck.
- source_word: עָלָיִךְ
  choice: in deiner Sache
  rationale: Die Präposition עַל kann mit צוה die Person oder Angelegenheit bezeichnen, auf die sich eine Anordnung bezieht. »In deiner Sache« wahrt diesen Bezug, ohne eindeutig einen bloß begünstigenden oder belastenden Sinn festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist natürlich formuliert; »nach Hause« vermeidet das im heutigen Deutsch steife »in dein Haus«. Die Mehrdeutigkeit der abschließenden Präpositionalverbindung wird im Haupttext nicht unnötig zugespitzt und in der Fußnote offengelegt.
