  footnotes:
  - marker: a
    text: 'Wörtlich: »und das Angesicht des Königs sah er nicht«. Die hebräische Wendung kann bedeuten, dass Absalom keinen persönlichen Zugang zum König beziehungsweise keine Audienz bei ihm hatte.'
