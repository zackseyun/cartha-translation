lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: ישׁב kann »sitzen, wohnen, bleiben« bedeuten. Im Zusammenhang beschreibt das Verb Absaloms fortgesetzten Aufenthalt in Jerusalem; »blieb« gibt dies natürlich wieder.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Die im Deutschen übliche biblische Namensform.
- source_word: בִּירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Direkte Wiedergabe der Ortsangabe mit der Präposition בְּ.
- source_word: שְׁנָתַיִם יָמִים
  choice: zwei volle Jahre
  rationale: Die wörtliche Verbindung »zwei Jahre, Tage« bezeichnet idiomatisch den vollständigen Zeitraum; »zwei volle Jahre« bringt diese zeitliche Bestimmung verständlich zum Ausdruck.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: ohne vor den König treten zu dürfen
  rationale: 'Wörtlich heißt es: »und das Angesicht des Königs sah er nicht«. Im höfischen Zusammenhang meint die Wendung, dass Absalom keinen persönlichen Zugang beziehungsweise keine Audienz beim König erhielt.'
