  yaml_path: translation/ot/2_samuel/014/023.yaml
  text: So Joab arose and went to Geshur[a], and brought Absalom to Jerusalem.
translation:
  language: de
  text: Da machte sich Joab auf, ging nach Geschur und brachte Absalom nach Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: machte sich auf
  rationale: Das Verb קום bezeichnet hier im fortschreitenden Erzählzusammenhang das Aufstehen zum Handeln. Die deutsche Wendung „machte sich auf“ gibt den Handlungsbeginn natürlich und würdig wieder, ohne ein bloß körperliches Aufstehen in den Vordergrund zu rücken.
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: הלך bedeutet in diesem einfachen Erzählzusammenhang „gehen“. „Ging“ ist unmittelbar und fügt keine im Hebräischen nicht ausdrücklich enthaltene Reisenüance hinzu.
- source_word: גְּשׁוּרָה
  choice: nach Geschur
  rationale: Das Richtungs-He bezeichnet die Bewegung auf Geschur zu; im Deutschen wird dies idiomatisch mit „nach Geschur“ ausgedrückt.
- source_word: וַיָּבֵא
  choice: brachte
  rationale: Der Hifil von בוא bedeutet „kommen lassen, bringen“. Das kontextuell mögliche „zurückbringen“ wird nicht verwendet, weil der Begriff „zurück“ im hebräischen Verb selbst nicht ausdrücklich steht.
- source_word: אֶת אַבְשָׁלוֹם
  choice: Absalom
  rationale: Die Akkusativpartikel markiert den Eigennamen als direktes Objekt; verwendet wird die im Deutschen etablierte Namensform „Absalom“.
- source_word: יְרוּשָׁלִָם
  choice: nach Jerusalem
  rationale: Obwohl keine eigene Präposition steht, macht die deutsche Fügung mit „bringen“ das im Satz ausgedrückte Ziel idiomatisch durch „nach“ kenntlich.
- source_word: וַ
  choice: Da / und
  rationale: Die aufeinanderfolgenden Waw-Konsekutivformen führen die Handlung weiter. Am Versanfang gibt „Da“ den folgernden Erzählanschluss natürlich wieder; innerhalb des Satzes verbindet „und“ die Handlungen.
