  text: וַ/יִּשְׁלַ֨ח אַבְשָׁל֜וֹם אֶל יוֹאָ֗ב לִ/שְׁלֹ֤חַ אֹת/וֹ֙ אֶל הַ/מֶּ֔לֶךְ וְ/לֹ֥א אָבָ֖ה לָ/ב֣וֹא אֵלָ֑י/ו וַ/יִּשְׁלַ֥ח עוֹד֙ שֵׁנִ֔ית וְ/לֹ֥א אָבָ֖ה לָ/בֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/029.yaml
  text: So Absalom sent for Joab to send him to the king[a], but he was not willing to come to him. So he sent again a second time, but he was not willing to come.
translation:
  language: de
  text: Da ließ Absalom Joab rufen, damit dieser ihn zum König schickte. Doch Joab wollte nicht zu ihm kommen. Da ließ Absalom ihn noch ein zweites Mal rufen, doch er wollte nicht kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח אַבְשָׁלוֹם אֶל יוֹאָב
  choice: Da ließ Absalom Joab rufen
  rationale: שׁלח mit אֶל bezeichnet wörtlich ein Senden zu Joab; im Kontext wird idiomatisch ausgedrückt, dass Absalom nach Joab schicken und ihn rufen ließ.
- source_word: לִשְׁלֹחַ אֹתוֹ אֶל הַמֶּלֶךְ
  choice: damit dieser ihn zum König schickte
  rationale: Der Infinitiv bezeichnet den Zweck. Die Pronomen werden durch „dieser“ und „ihn“ eindeutig auf Joab beziehungsweise Absalom bezogen, ohne Joabs vermittelnde Rolle weiter auszudeuten.
- source_word: וְלֹא אָבָה לָבוֹא אֵלָיו
  choice: Doch Joab wollte nicht zu ihm kommen
  rationale: אָבָה bedeutet „willig sein, einwilligen“. „wollte nicht“ bewahrt die lexikalische Aussage und ist weniger stark als „weigerte sich“. Joab wird zur Klärung des im Deutschen missverständlichen Pronomens ausdrücklich genannt.
- source_word: וַיִּשְׁלַח עוֹד שֵׁנִית
  choice: Da ließ Absalom ihn noch ein zweites Mal rufen
  rationale: „noch ein zweites Mal“ bildet sowohl עוֹד als auch שֵׁנִית ab. Das erneute Nennen Absaloms klärt das Subjekt; „ihn“ bezieht sich natürlich auf Joab.
- source_word: וְלֹא אָבָה לָבוֹא
  choice: doch er wollte nicht kommen
  rationale: Die wiederholte Formulierung erhält die parallele Struktur des Hebräischen; beim zweiten Mal fehlt אֵלָיו, daher steht schlicht „kommen“.
