base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/030.yaml
  text: Then he said to his servants[a], “Look, Joab’s field is next to mine, and he has barley there. Go and set it on fire.” So Absalom’s servants set the field on fire.
translation:
  language: de
  text: 'Da sagte er zu seinen Dienern: „Seht, Joabs Feld ist gleich nebenan, und darauf steht Gerste. Geht hin und steckt es in Brand!“ Da steckten Abschaloms Diener das Feld in Brand.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקַת
  choice: Feld
  rationale: Im Zusammenhang bezeichnet das Wort ein landwirtschaftlich genutztes Grundstück, auf dem Gerste steht; „Feld“ ist dafür die natürliche deutsche Entsprechung.
- source_word: אֶל יָדִי
  choice: liegt neben meinem
  rationale: Die Wendung lautet wörtlich „an meiner Hand“, bezeichnet hier aber die unmittelbare Nachbarschaft zu Abschaloms eigenem Feld.
- source_word: שְׂעֹרִים
  choice: Gerste
  rationale: Der hebräische Plural bezeichnet hier Gerste als Feldfrucht; im Deutschen steht dafür gewöhnlich der Singular als Stoff- bzw. Sammelbezeichnung.
- source_word: וְהוּצִיתִהָ
  choice: steckt es in Brand
  rationale: Der Hifil von יצת drückt das Entzünden aus. Das Pronomen bezieht sich auf „Feld“, das im Deutschen sächlich ist.
- source_word: וַיַּצִּתוּ
  choice: steckten … in Brand
  rationale: Die Wiederholung derselben Wendung bewahrt den Zusammenhang zwischen Befehl und Ausführung.
- source_word: עֲבָדָיו / עַבְדֵי אַבְשָׁלוֹם
  choice: seinen Dienern / Abschaloms Diener
  rationale: עבד kann Diener oder Sklaven bezeichnen; der Erzählzusammenhang legt die genaue Rechtsstellung nicht fest, daher vermeidet „Diener“ eine unnötige Präzisierung.
- source_word: רְאוּ
  choice: Seht
  rationale: Der Imperativ lenkt die Aufmerksamkeit der Diener auf das angrenzende Feld und klingt in direkter Rede natürlich.
- source_word: לְכוּ
  choice: Geht hin
  rationale: Die Bewegungsaufforderung wird vor dem eigentlichen Befehl ausdrücklich wiedergegeben.
