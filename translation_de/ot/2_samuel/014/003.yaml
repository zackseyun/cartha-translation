  yaml_path: translation/ot/2_samuel/014/003.yaml
  text: Then go to the king and speak to him in this way[a]. And Joab put the words in her mouth.
translation:
  language: de
  text: Dann geh zum König und rede so mit ihm.[a] Und Joab legte ihr die Worte in den Mund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Joab legte ihr die Worte in den Mund“ bedeutet, dass Joab ihr vorgab, was sie sagen sollte.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאת
  choice: Dann geh
  rationale: Das Qal-Perfekt 2. Person feminin Singular mit ו steht in einer Anweisungsfolge und hat hier auffordernde Bedeutung. „Dann geh“ gibt sowohl die Abfolge als auch den an die Frau gerichteten Auftrag natürlich wieder.
- source_word: אֶל־הַמֶּלֶךְ
  choice: zum König
  rationale: אֶל bezeichnet die Bewegung auf ein Ziel zu; „zum König“ entspricht dem unmittelbaren Sinn.
- source_word: וְדִבַּרְתְּ אֵלָיו
  choice: und rede … mit ihm
  rationale: דבר mit אֶל bedeutet gewöhnlich „mit jemandem reden/zu jemandem sprechen“. Die deutsche Wortstellung verbindet die Wendung natürlich mit der folgenden Angabe der Redeweise.
- source_word: כַּדָּבָר הַזֶּה
  choice: so
  rationale: Die Wendung bezeichnet hier Art beziehungsweise Inhalt der von Joab vorgegebenen Rede. „so“ ist knapp, natürlich und bewahrt den demonstrativen Sinn.
- source_word: וַיָּשֶׂם
  choice: legte
  rationale: שׂים bedeutet „setzen, legen, tun“. In der deutschen Redewendung „Worte in den Mund legen“ ist „legte“ die idiomatische Entsprechung.
- source_word: אֶת־הַדְּבָרִים
  choice: die Worte
  rationale: Der Plural bezeichnet die konkrete Rede, die Joab der Frau vorgab. „die Worte“ bewahrt diesen konkreten Bezug.
- source_word: בְּפִיהָ
  choice: in den Mund
  rationale: Die wörtliche Bildsprache des Hebräischen entspricht der auch im Deutschen verständlichen Redewendung „jemandem Worte in den Mund legen“.
