  verdict: revise
  source_fidelity: 'Die Grundübersetzung gibt die zentralen Elemente zutreffend wieder: den Vorwurf des Planens gegen Gottes Volk, die Vergleichsform in כְּאָשֵׁם und das Zurückholen des Verbannten. Die possessive Endung in נִדְּחוֹ sollte jedoch nicht durch „von ihm Verbannten“ als Urheberschaft der Verbannung ausgelegt werden; „seinen Verbannten“ wahrt die knappe hebräische Beziehung. Außerdem sollte die kausale Verknüpfung von וּמִדַּבֵּר deutlicher durch „Denn“ wiedergegeben werden.'
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. „Denn indem der König dieses Wort ausspricht“ bildet die mittel-/kausalbezogene Konstruktion natürlich ab und vermeidet eine nicht erforderliche Perfektfestlegung.
  terminology: „Volk Gottes“, „Schuldiger“, „zurückgeholt“ und „Verbannter“ sind sachgerecht. „Seinen Verbannten“ bewahrt die possessive Beziehung des hebräischen Suffixes, ohne zu behaupten, der König habe die Verbannung selbst veranlasst.
  issues:
