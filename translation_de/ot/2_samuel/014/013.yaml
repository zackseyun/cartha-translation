base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/013.yaml
  text: Then the woman said[a], “Why then have you planned such a thing against the people of God? For in speaking this word, the king is like one who is guilty[b], because the king has not brought back his banished one.”
translation:
  language: de
  text: 'Da sagte die Frau: »Warum hast du dann so etwas gegen das Volk Gottes geplant?[a] Denn indem der König dieses Wort ausspricht, steht er selbst wie ein Schuldiger da,[b] weil der König seinen Verbannten nicht zurückgeholt hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Warum hast du dir dann so etwas gegen das Volk Gottes ausgedacht?«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »ist der König wie ein Schuldiger«; sein eigener Urteilsspruch lässt ihn wegen der unterlassenen Rückholung seines Verbannten als schuldig dastehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָשַׁבְתָּה
  choice: geplant
  rationale: Das Verb kann »denken«, »ersinnen« oder »planen« bedeuten. »Geplant« gibt hier den Vorwurf eines absichtlichen Vorgehens wieder, ohne die mögliche Bedeutungsbreite zu verschweigen.
- source_word: עַל עַם אֱלֹהִים
  choice: gegen das Volk Gottes
  rationale: In Verbindung mit חָשַׁב und im anklagenden Kontext bezeichnet עַל die nachteilige Ausrichtung des Handelns.
- source_word: וּמִדַּבֵּר הַמֶּלֶךְ הַדָּבָר הַזֶּה
  choice: Indem der König dieses Wort ausgesprochen hat
  rationale: 'Die Präposition מִן vor dem Infinitiv wird als begleitend beziehungsweise mittelbezogen verstanden: Durch seinen eigenen Urteilsspruch belastet sich der König selbst.'
- source_word: כְּאָשֵׁם
  choice: steht er selbst wie ein Schuldiger da
  rationale: Das כְּ wahrt den Vergleich. Die Formulierung macht natürlich verständlich, dass der eigene Ausspruch den König in die Stellung eines Schuldigen versetzt, ohne den Vergleich in eine uneingeschränkte direkte Feststellung umzudeuten.
- source_word: לְבִלְתִּי הָשִׁיב
  choice: weil ... nicht zurückgeholt hat
  rationale: Die Konstruktion nennt den Grund des Vorwurfs; der Hifil von שׁוב bedeutet hier konkret »zurückbringen/zurückholen«.
- source_word: נִדְּחוֹ
  choice: den von ihm Verbannten
  rationale: Das substantivierte passive Partizip bezeichnet einen fortgetriebenen oder verbannten Menschen. Das Possessivsuffix kann Zugehörigkeit oder die Beziehung zum Urheber der Verbannung ausdrücken; die Formulierung nimmt hier den naheliegenden Kontextbezug auf, während die Fußnote die knappere Alternative nennt.
theological_decisions:
- issue: Reichweite von »Volk Gottes«
  choice: Die ausdrückliche Bundesbezeichnung »Volk Gottes« bleibt erhalten.
  alternative: Israel; Absalom und das Königshaus
  rationale: Der hebräische Text nennt das Volk Gottes. Der Zusammenhang bezieht den Vorwurf auf Absalom und das Königshaus, doch die Übersetzung soll die umfassendere rhetorische Aussage nicht darauf verengen.
- issue: Art des Schuldvorwurfs
  choice: Der König steht »wie ein Schuldiger« da.
  alternative: Der König ist schuldig.
  rationale: Die Vergleichspartikel כְּ wird beibehalten. So bleibt die Spannung gewahrt, dass Davids eigener Urteilsspruch ihn als schuldig erscheinen lässt, ohne die rhetorische Vergleichsform zu beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt pointiert und verständlich; der Vergleich in כְּאָשֵׁם sowie die rhetorische Weite von »Volk Gottes« werden nicht eingeebnet. Alle Fußnotenmarker stehen im Haupttext.
