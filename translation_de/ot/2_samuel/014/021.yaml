source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל יוֹאָ֔ב הִנֵּה נָ֥א עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֵ֛ךְ הָשֵׁ֥ב אֶת הַ/נַּ֖עַר אֶת אַבְשָׁלֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/021.yaml
  text: Then the king said to Joab[a], “Behold now, I have done this thing. Go, bring back the young man Absalom.”
translation:
  language: de
  text: 'Da sagte der König zu Joab: »Sieh, ich habe diese Sache nun getan.[a] Geh und hol den jungen Mann Absalom zurück.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß auch: „Sieh, ich habe dir diese Bitte nun gewährt.“ Wörtlicher lautet das Hebräische: „Ich habe diese Sache getan.“'
    reason: Die allgemeine hebräische Wendung bezeichnet im Zusammenhang wohl die Gewährung der Bitte, legt diese Deutung lexikalisch aber nicht ausdrücklich fest.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Titel wird entsprechend dem Hebräischen beibehalten, statt den Eigennamen einzusetzen.
- source_word: הִנֵּה נָא
  choice: Sieh … nun
  rationale: „Sieh“ bewahrt die aufmerksamkeitslenkende Funktion von הִנֵּה; „nun“ gibt die durch נָא vermittelte aktuelle beziehungsweise leicht nachdrückliche Nuance wieder, ohne das altertümliche „siehe“ zu verwenden.
- source_word: עָשִׂיתִי אֶת־הַדָּבָר הַזֶּה
  choice: ich habe diese Sache getan
  rationale: Die Formulierung folgt der bewusst allgemeinen hebräischen Wendung. Der Zusammenhang legt zwar das Gewähren einer Bitte nahe, doch diese Deutung wird nicht stillschweigend in den Haupttext eingetragen.
- source_word: וְלֵךְ
  choice: Geh
  rationale: Der Imperativ wird knapp und natürlich wiedergegeben. Die Verbindung zum folgenden Auftrag ist im Deutschen auch ohne ausdrücklich übersetztes „und“ klar.
- source_word: הָשֵׁב
  choice: hol … zurück
  rationale: 'Der Hifil von שׁוב ist hier kausativ: Joab soll Absaloms Rückkehr veranlassen. „Hol … zurück“ gibt dies idiomatisch wieder.'
- source_word: הַנַּעַר
  choice: den jungen Mann
  rationale: נַעַר kann je nach Zusammenhang einen Jungen, jungen Mann oder Diener bezeichnen. Da Absalom erwachsen ist, wahrt „junger Mann“ die altersrelative und zugleich väterlich geprägte Bezeichnung.
- source_word: אֶת אַבְשָׁלוֹם
  choice: Absalom
  rationale: Der Eigenname wird in der im Deutschen gebräuchlichen Form wiedergegeben und als Apposition zu „den jungen Mann“ beibehalten.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. „Sieh“ vermeidet das altertümliche „siehe“, während die leicht markierte Formulierung „diese Sache getan“ die Offenheit des hebräischen Ausdrucks bewahrt.
