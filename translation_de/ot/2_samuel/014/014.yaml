source:
  edition: WLC
  text: כִּי מ֣וֹת נָמ֔וּת וְ/כַ/מַּ֨יִם֙ הַ/נִּגָּרִ֣ים אַ֔רְצָ/ה אֲשֶׁ֖ר לֹ֣א יֵאָסֵ֑פוּ וְ/לֹֽא יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְ/חָשַׁב֙ מַֽחֲשָׁב֔וֹת לְ/בִלְתִּ֛י יִדַּ֥ח מִמֶּ֖/נּוּ נִדָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/014.yaml
  text: For we must surely die and are like water poured out on the ground[a], which cannot be gathered up again. Yet God does not take away life[b], but devises plans so that the banished one will not remain banished from him.
translation:
  language: de
  text: Denn wir müssen sterben und sind wie Wasser, das auf die Erde gegossen wurde und nicht wieder gesammelt werden kann. Doch Gott nimmt kein Leben hinweg[a], sondern er ersinnt Wege, damit ein Verstoßener nicht von ihm verstoßen bleibt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch Gott bevorzugt niemanden.“ Der hebräische Satz ist schwierig und wird unterschiedlich verstanden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „damit ein Verstoßener nicht von ihm fortgetrieben wird.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Bitte ein und bewahrt den argumentativen Zusammenhang.
- source_word: מוֹת נָמוּת
  choice: wir müssen sterben
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb betont die Gewissheit und Unausweichlichkeit des Todes; die deutsche Formulierung gibt dies natürlich wieder.
- source_word: וְכַמַּיִם הַנִּגָּרִים אַרְצָה
  choice: und sind wie Wasser, das auf die Erde gegossen wurde
  rationale: Das Bild bezeichnet vergossenes Wasser und hebt zusammen mit dem Folgesatz dessen Unwiederbringlichkeit hervor.
- source_word: אֲשֶׁר לֹא יֵאָסֵפוּ
  choice: das ... nicht wieder gesammelt werden kann
  rationale: Das Nifal bezeichnet hier das ausbleibende beziehungsweise unmögliche Wiedersammeln; „wieder“ verdeutlicht die im Bild liegende Unumkehrbarkeit.
- source_word: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: Doch Gott nimmt kein Leben hinweg
  rationale: Die schwierige Wendung wird im Zusammenhang von Tod, Verbannung und Wiederaufnahme auf die Wegnahme des Lebens bezogen. „Leben“ gibt נֶפֶשׁ hier als lebende Person beziehungsweise deren Leben wieder; eine abweichende Deutung wird in der Fußnote bewahrt.
- source_word: וְחָשַׁב מַחֲשָׁבוֹת
  choice: sondern er ersinnt Wege
  rationale: Die stammverwandte Verbindung bezeichnet bewusstes Planen. „Wege ersinnen“ ist idiomatisch und passt zum Ziel der Wiederaufnahme, ohne die Aussage auf einen einzelnen konkreten Plan festzulegen.
- source_word: לְבִלְתִּי יִדַּח
  choice: damit ... nicht ... verstoßen bleibt
  rationale: Das Nifal von נדח kann das Verstoßenwerden oder den daraus entstandenen Zustand bezeichnen. „Verstoßen bleibt“ bringt im Kontext die beabsichtigte Aufhebung dieses Zustands zum Ausdruck.
- source_word: מִמֶּנּוּ נִדָּח
  choice: ein Verstoßener ... von ihm
  rationale: Die gedrängte hebräische Wortstellung wird in natürlichem Deutsch entfaltet. Das Pronomen „ihm“ bleibt wie im Ausgangstext erhalten und wird nicht ausdrücklich auf Gott oder den König festgelegt.
theological_decisions:
- issue: Deutung von וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: Doch Gott nimmt kein Leben hinweg
  alternative: Doch Gott bevorzugt niemanden
  rationale: Die gewählte Deutung fügt sich in den unmittelbaren Gedankengang von der Unumkehrbarkeit des menschlichen Todes und Gottes Handeln zugunsten des Verstoßenen ein. Da die hebräische Wendung syntaktisch und semantisch schwierig ist, wird die Deutung im Sinn von Unparteilichkeit ausdrücklich als Alternative dokumentiert.
- issue: Bezug von מִמֶּנּוּ
  choice: von ihm
  alternative: von Gott / vom König
  rationale: Das maskuline Singularpronomen kann im Redegang auf Gott bezogen werden, während die Anwendung der weisen Frau zugleich auf David und den verbannten Absalom zielt. Die Übersetzung bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt dem argumentativen und bildhaften Charakter des Hebräischen nahe, vermeidet jedoch unnatürliche wörtliche Nachbildungen. Die beiden echten Auslegungsunsicherheiten werden durch korrekt platzierte Fußnotenmarker offengelegt.
