base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/005.yaml
  text: The king said to her[a], “What is the matter?” She said, “Indeed, I am a widow[b], and my husband has died.”
translation:
  language: de
  text: 'Der König fragte sie: »Was fehlt dir?[a]« Sie antwortete: »Gewiss, ich bin eine Witwe[b]; mein Mann ist gestorben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Was ist dir?«; auch: »Was bedrückt dich?«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ach, ich bin eine Witwe.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָּךְ
  choice: Was fehlt dir?
  rationale: Die hebräische Wendung bedeutet wörtlich etwa »Was ist dir?« und fragt idiomatisch nach der Not oder dem Anliegen der Frau. »Was fehlt dir?« ist im modernen Deutschen natürlich und bewahrt den persönlichen Bezug des Suffixes.
- source_word: אֲבָל
  choice: Ach
  rationale: Die Partikel ist hier nicht ohne Weiteres adversativ. Im Zusammenhang kann sie die nachdrückliche beziehungsweise klagende Einleitung der Aussage markieren. »Ach« gibt den Klagecharakter natürlich wieder; die asseverative Deutung bleibt in der Fußnote sichtbar.
- source_word: אִשָּׁה אַלְמָנָה
  choice: ich bin eine Witwe
  rationale: Die Verbindung aus »Frau« und »verwitwet/Witwe« wird im Deutschen idiomatisch mit »eine Witwe« wiedergegeben, ohne Bedeutungsverlust.
- source_word: וַיָּמָת אִישִׁי
  choice: mein Mann ist gestorben
  rationale: אִישִׁי bezeichnet in diesem Zusammenhang den Ehemann. Das deutsche Perfekt gibt das eingetretene Sterben und dessen fortdauernde Folge für die Sprecherin natürlich wieder.
- source_word: הַמֶּלֶךְ
  choice: Der König
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: וַתֹּאמֶר
  choice: Sie antwortete
  rationale: Da ihre Rede unmittelbar auf die Frage des Königs folgt, gibt »antwortete« die erzählerische Funktion im Deutschen natürlich wieder, ohne zusätzliche Information einzuführen.
