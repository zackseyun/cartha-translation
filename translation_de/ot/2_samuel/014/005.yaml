translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und knapp gehalten. »Ach« bewahrt die mögliche klagende Färbung von אֲבָל, während die Fußnote die ebenfalls mögliche bekräftigende Lesart nennt.
