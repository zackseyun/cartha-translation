    rationale: Der hebräische Schwur lautet wörtlich „wenn ein Haar deines Sohnes zu Boden fällt“; „auch nur etwas von einem Haar“ steht nicht im Text. Die Anmerkung erläutert die Schwurformel und gehört daher unmittelbar nach „Yahweh lebt“.
