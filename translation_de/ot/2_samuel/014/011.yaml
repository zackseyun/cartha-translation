  text: וַ/תֹּאמֶר֩ יִזְכָּר נָ֨א הַ/מֶּ֜לֶךְ אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ מ/הרבית גֹּאֵ֤ל הַ/דָּם֙ לְ/שַׁחֵ֔ת וְ/לֹ֥א יַשְׁמִ֖ידוּ אֶת בְּנִ֑/י וַ/יֹּ֨אמֶר֙ חַי יְהוָ֔ה אִם יִפֹּ֛ל מִ/שַּׂעֲרַ֥ת בְּנֵ֖/ךְ אָֽרְצָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/011.yaml
  text: Then she said[a], “Please let the king remember Yahweh your God, so that the avenger of blood may not continue to destroy, and they may not destroy my son.” And he said, “As Yahweh lives[b], not one hair of your son shall fall to the ground.”
translation:
  language: de
  text: 'Da sagte sie: „Der König möge doch Yahwehs, deines Gottes, gedenken, damit der Bluträcher nicht weiter Verderben anrichtet und sie meinen Sohn nicht vernichten.“ Er sagte: „So wahr Yahweh lebt[a]: Kein Haar deines Sohnes soll zu Boden fallen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräische Schwurformel: Wörtlich: „Wenn ein Haar deines Sohnes zu Boden fällt.“ Nach „So wahr Yahweh lebt“ dient dies als nachdrückliche Verneinung und sagt vollständigen Schutz zu.'
    reason: Das hebräische אִם hat nach der Schwurformel verneinende Schwurkraft; die Anmerkung erläutert dieses Idiom, ohne einen unzutreffenden wörtlichen Wortlaut zu behaupten.
lexical_decisions:
- source_word: יִזְכָּר נָא
  choice: Der König möge doch ... denken
  rationale: Der Jussiv mit נָא formuliert eine ehrerbietige Bitte; „möge doch“ wahrt sowohl Höflichkeit als auch Nachdruck.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, deinen Gott
  rationale: Der Gottesname wird als „Yahweh“ wiedergegeben; das Suffix der zweiten Person bleibt ausdrücklich erhalten.
- source_word: מֵהַרְבּוֹת גֹּאֵל הַדָּם לְשַׁחֵת
  choice: verhindern, dass der Bluträcher immer weiter Verderben anrichtet
  rationale: Die schwierige Verbindung aus מן, dem Hifil-Infinitiv von רבה und לְשַׁחֵת bezeichnet hier die Fortsetzung beziehungsweise Ausweitung des zerstörerischen Handelns. Die Wiedergabe ist idiomatisch, ohne den iterativen Aspekt einzuebnen.
- source_word: גֹּאֵל הַדָּם
  choice: Bluträcher
  rationale: Der Ausdruck bezeichnet den zur Blutrache berechtigten beziehungsweise verpflichteten Verwandten und ist im Deutschen als biblisch-rechtlicher Begriff verständlich.
- source_word: וְלֹא יַשְׁמִידוּ אֶת־בְּנִי
  choice: und sie meinen Sohn vernichten
  rationale: Die nicht näher bestimmten Handelnden des hebräischen Plurals bleiben durch „sie“ unbestimmt; „vernichten“ gibt die starke Bedeutung von שׁמד wieder.
- source_word: חַי יְהוָה
  choice: So wahr Yahweh lebt
  rationale: Die geläufige deutsche Schwurformel bewahrt Feierlichkeit und Funktion des hebräischen Ausdrucks.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת בְּנֵךְ אָרְצָה
  choice: Kein Haar deines Sohnes soll zu Boden fallen
  rationale: אִם dient nach der Schwurformel als nachdrückliche Verneinung. Die deutsche idiomatische Form wahrt das Bild vollständigen Schutzes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Text nennt das Tetragramm unmittelbar. „Yahweh“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Reichweite der königlichen Zusage
  choice: bildhafte Zusicherung vollständigen Schutzes
  alternative: wörtlich-konditionales Verständnis von אִם
  rationale: Nach der Schwurformel חַי יְהוָה hat אִם verneinende Schwurkraft; die Zusage wird daher als emphatische Verneinung formuliert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfliche Bitte der Frau und die feierliche Schwurformel des Königs bleiben erkennbar. Der rechtliche Begriff „Bluträcher“ wird beibehalten; die syntaktisch schwierige Wendung מֵהַרְבּוֹת ... לְשַׁחֵת wird natürlich und mit ihrem fortdauernden Aspekt wiedergegeben.
