base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/004.yaml
  text: Then the woman from Tekoa spoke to the king[a]. She fell with her face to the ground and bowed down, and she said, “Save me[b], O king!”
translation:
  language: de
  text: 'Da sagte die Frau aus Tekoa zum König[a]. Sie fiel auf ihr Gesicht zu Boden, warf sich nieder und sagte: »Rette mich[b], König!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die tekoitische Frau«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »Rette doch, König!« Das Objekt »mich« ist in der Bitte sinngemäß enthalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקֹעִית
  choice: die Frau aus Tekoa
  rationale: Das adjektivische Herkunftswort bezeichnet eine Frau aus Tekoa; diese Wiedergabe ist im modernen Deutsch natürlicher als »die tekoitische Frau«.
- source_word: וַתֹּאמֶר ... אֶל הַמֶּלֶךְ
  choice: sagte ... zum König
  rationale: אָמַר bedeutet gewöhnlich »sagen«. Die Formulierung bewahrt die direkte Erzählweise des Hebräischen und klingt im Deutschen natürlich.
- source_word: וַתִּפֹּל עַל אַפֶּיהָ אַרְצָה
  choice: Sie fiel mit dem Gesicht zur Erde nieder
  rationale: Die Wendung beschreibt das Niederfallen auf das Gesicht und bringt Haltung und Richtung der Bewegung deutlich zum Ausdruck.
- source_word: וַתִּשְׁתָּחוּ
  choice: verbeugte sich
  rationale: Das Verb bezeichnet ehrerbietiges Sich-Niederbeugen oder Sich-Niederwerfen. Im Zusammenhang ist »verbeugte sich« verständlich und vermeidet eine unnötig kultische Festlegung.
- source_word: הוֹשִׁיעָה
  choice: Hilf mir
  rationale: Der Imperativ von יָשַׁע ist hier der dringende Ruf an den König, rettend einzugreifen. »Hilf mir« ist eine natürliche deutsche Bitte; das im Hebräischen unausgesprochene Objekt wird aus dem Kontext ergänzt.
- source_word: הַמֶּלֶךְ
  choice: mein König
  rationale: Der bestimmte Ausdruck steht als ehrerbietige direkte Anrede. »Mein König« gibt diese im Deutschen idiomatisch wieder, ohne den hebräischen Artikel mechanisch als »der König« zu übersetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Anrede bleibt gehoben, aber verständlich; die beiden aufeinanderfolgenden Handlungen des Niederfallens und Verbeugens werden als gesonderte Verben bewahrt.
