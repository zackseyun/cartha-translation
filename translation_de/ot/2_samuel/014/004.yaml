  naturalness: »Sie fiel mit dem Gesicht zur Erde nieder« ist verständlich, aber weniger idiomatisch als »Sie fiel auf ihr Gesicht zu Boden«. Für die zweite Geste ist »warf sich nieder« im Kontext einer demütigen Bitte präziser als das vergleichsweise schwache »verbeugte sich«. »König« als Anrede ist modernes, würdiges Deutsch ohne die zusätzliche Possessivform.
  terminology: Tekoa ist korrekt wiedergegeben. »Rette mich« entspricht dem rettenden Charakter von הוֹשִׁיעָה genauer als das allgemeinere »Hilf mir«. Die Anrede »König« wahrt den hebräischen Vokativ, ohne »mein« einzutragen.
