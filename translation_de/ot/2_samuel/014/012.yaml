  text: Then the woman said[a], “Please let your servant speak a word to my lord the king.” And he said, “Speak.”
translation:
  language: de
  text: 'Da sagte die Frau: „Bitte lass deine Dienerin[a] ein Wort zu meinem Herrn, dem König, sagen.“ Er sagte: „Sprich.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deine Magd“; eine demütige Selbstbezeichnung gegenüber dem König.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Da“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Im Kontext bezeichnet der Ausdruck schlicht die Frau, die mit dem König spricht.
- source_word: תְּדַבֶּר נָא
  choice: Bitte lass ... sagen
  rationale: Die Imperfekt-/Jussivform mit נָא formuliert eine höfliche, ehrerbietige Bitte an den König.
- source_word: שִׁפְחָתְךָ
  choice: deine Dienerin
  rationale: Die feminine Selbstbezeichnung wird im Deutschen natürlich und ausdrücklich bewahrt; zugleich vermittelt sie die demütige höfische Redeweise.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: zu meinem Herrn, dem König
  rationale: אָדוֹן ist hier eine menschliche Ehrenanrede. Die Apposition „dem König“ macht die Beziehung der beiden Bezeichnungen im Deutschen klar.
- source_word: דָּבָר
  choice: ein Wort
  rationale: Die knappe hebräische Wendung wird formal bewahrt und ist als höfliche Bitte auch im Deutschen verständlich.
- source_word: וַיֹּאמֶר
  choice: Er sagte
  rationale: Die einfache narrative Fortsetzung leitet unmittelbar die Antwort des Königs ein.
- source_word: דַּבֵּרִי
  choice: Sprich!
  rationale: Der feminine Singularimperativ wird knapp und direkt wiedergegeben; die feminine Anrede ergibt sich im Deutschen aus dem Kontext, nicht aus der Verbform.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit höfischer Ehrerbietung. „Dienerin“ bewahrt das feminine Geschlecht und klingt gegenwärtiger als „Magd“. Das im Deutschen eingefügte „noch“ macht den Anschluss an die vorausgehende Rede natürlich, ohne den Sinn zu verändern.
