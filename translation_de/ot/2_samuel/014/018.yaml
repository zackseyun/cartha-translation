base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/018.yaml
  text: Then the king answered and said to the woman[a], “Please do not hide from me anything that I ask you.” And the woman said, “Please speak[b], my lord the king.”
translation:
  language: de
  text: 'Da antwortete der König und sagte zu der Frau: „Verschweige mir bitte nichts von dem, wonach ich dich frage.“ Die Frau sagte: „Mein Herr, der König, möge bitte sprechen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: antwortete ... und sagte
  rationale: Die beiden hebräischen Erzählverben werden transparent wiedergegeben; die im Deutschen leicht formelhafte Doppelung bewahrt die Struktur des Ausgangstextes.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Gemeint ist die Frau aus Tekoa; eine eheliche Bedeutung liegt hier nicht vor.
- source_word: אַל נָא תְכַחֲדִי מִמֶּנִּי דָּבָר
  choice: Verschweige mir bitte nichts
  rationale: „Verschweigen“ gibt das Zurückhalten einer Auskunft idiomatisch wieder; „bitte“ bewahrt die höflich-eindringliche Partikel נָא, und „nichts“ entspricht dem indefiniten דָּבָר im negierten Satz.
- source_word: אֲשֶׁר אָנֹכִי שֹׁאֵל אֹתָךְ
  choice: wonach ich dich frage
  rationale: Die Formulierung ist natürliches modernes Deutsch und wahrt den unmittelbaren Gegenwartsbezug des Partizips שֹׁאֵל.
- source_word: יְדַבֶּר נָא אֲדֹנִי הַמֶּלֶךְ
  choice: Mein Herr und König möge bitte sprechen
  rationale: Der Jussiv in der dritten Person wird als ehrerbietige höfische Anrede bewahrt. „Herr und König“ gibt die Titelfolge natürlich wieder, ohne die Sprecherin selbst als zweites Objekt der Anrede erscheinen zu lassen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Distanz der Frau wird durch den Jussiv „möge ... sprechen“ bewahrt; der König redet sie unmittelbar und bestimmt, aber durch „bitte“ nicht schroff an.
