  text: וַ/תֹּ֜אמֶר הָ/אִשָּׁ֤ה הַ/תְּקוֹעִית֙ אֶל הַ/מֶּ֔לֶךְ עָלַ֞/י אֲדֹנִ֥/י הַ/מֶּ֛לֶךְ הֶ/עָוֺ֖ן וְ/עַל בֵּ֣ית אָבִ֑/י וְ/הַ/מֶּ֥לֶךְ וְ/כִסְא֖/וֹ נָקִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/009.yaml
  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
translation:
  language: de
  text: 'Da sagte die Frau aus Tekoa zum König: »Auf mir, mein Herr und König, liegt die Schuld[a], und auf dem Haus meines Vaters; der König aber und sein Thron sind frei von Schuld.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »das Unrecht«, »die Verfehlung« beziehungsweise »die daraus entstehende Haftung«; das hebräische Wort kann sowohl das schuldhafte Tun als auch die Schuld und deren Folgen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקוֹעִית
  choice: die Frau aus Tekoa
  rationale: Das Herkunftsadjektiv bezeichnet die Frau nach ihrem Heimatort. »Die Frau aus Tekoa« klingt im modernen Deutschen natürlicher als »die tekoitische Frau« und bewahrt die geografische Angabe.
- source_word: עָלַי
  choice: Auf mir
  rationale: Die vorangestellte Wendung ist betont. »Auf mir« erhält die knappe Selbstübernahme der Verantwortung.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr und König
  rationale: Die Formulierung gibt die höfische Anrede respektvoll und in natürlichem Deutsch wieder, ohne den königlichen Titel abzuschwächen.
- source_word: הֶעָוֺן
  choice: die Schuld
  rationale: עָוֹן kann Vergehen, Schuld oder die daraus entstehende Haftung beziehungsweise Folge bezeichnen. Im rechtlichen Zusammenhang trifft »Schuld« die Verantwortlichkeit, ohne sie vorschnell auf Strafe einzuengen.
- source_word: וְעַל בֵּית אָבִי
  choice: und auf dem Haus meines Vaters
  rationale: Die Übersetzung bewahrt das hebräische Familien- und Sippenidiom »Haus meines Vaters« und dessen rechtliche Tragweite.
- source_word: וְהַמֶּלֶךְ וְכִסְאוֹ
  choice: der König aber und sein Thron
  rationale: 'Das »aber« macht den im Zusammenhang klaren Gegensatz sichtbar: Die Frau übernimmt die Haftung, während König und Thron davon ausgenommen sein sollen. »Thron« bleibt als Bezeichnung königlicher Herrschaft und Dynastie erhalten.'
- source_word: נָקִי
  choice: frei von Schuld
  rationale: Die prädikative Wendung hat hier forensischen Sinn. »Frei von Schuld« bezeichnet die Entlastung in dieser Angelegenheit und vermeidet die weitergehende Aussage allgemeiner moralischer Unschuld.
theological_decisions:
- issue: Entlastung des Königs und seines Thrones
  choice: der König aber und sein Thron sollen frei von Schuld sein
  alternative: der König aber und sein Thron sollen unschuldig sein
  rationale: Die Aussage betrifft die rechtliche beziehungsweise moralische Haftung in dieser Sache, nicht eine umfassende Sündlosigkeit oder moralische Vollkommenheit des Königs. »Frei von Schuld« bewahrt diese Begrenzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt höfisch, aber gut verständlich. Die betonte Anfangsstellung »Auf mir« sowie das Rechts- und Verantwortungsmotiv des hebräischen Textes werden bewahrt.
