  text: וַ/יֹּ֖אמֶר הַ/מֶּ֑לֶךְ הַֽ/מְדַבֵּ֤ר אֵלַ֨יִ/ךְ֙ וַֽ/הֲבֵאת֣/וֹ אֵלַ֔/י וְ/לֹֽא יֹסִ֥יף ע֖וֹד לָ/גַ֥עַת בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/010.yaml
  text: And the king said[a], “Whoever speaks to you, bring him to me, and he will never touch you again.”
translation:
  language: de
  text: 'Da sagte der König: »Wer auch immer zu dir spricht, den bring zu mir; dann wird er dich nicht noch einmal antasten.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dich nicht länger antasten«. Das hebräische Verb bedeutet wörtlich »berühren«, kann hier aber auch feindseliges Vorgehen oder Schädigung meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die bestimmte Form wird im Deutschen regulär mit »der König« wiedergegeben.
- source_word: הַמְדַבֵּר אֵלַיִךְ
  choice: wer auch immer dir etwas sagt
  rationale: Das substantivierte Partizip bezeichnet hier offen jeden, der sich in dieser Sache an die Frau wendet. »Dir etwas sagt« klingt im Deutschen natürlicher als das isolierte »zu dir spricht«, ohne den Inhalt näher festzulegen.
- source_word: וַהֲבֵאתוֹ אֵלַי
  choice: den bring zu mir
  rationale: 'Der Hifil von בוא hat kausative Bedeutung: Die betreffende Person soll zum König gebracht werden. Das vorangestellte »den« nimmt idiomatisch den offenen Relativsatz auf.'
- source_word: לֹא יֹסִיף עוֹד
  choice: nicht noch einmal
  rationale: יסף mit עוד verneint eine weitere beziehungsweise erneute Handlung. Die deutsche Wendung bewahrt den Wiederholungsaspekt knapp und natürlich.
- source_word: לָגַעַת בָּךְ
  choice: dich antasten
  rationale: נגע bedeutet wörtlich »berühren«. »Antasten« bewahrt das Bild, lässt im Schutz- und Rechtskontext aber zugleich feindseliges Vorgehen oder Schädigung anklingen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. »Antasten« ist verständlich und erhält gegenüber einer eindeutigen Wiedergabe wie »schaden« die Bedeutungsbreite des hebräischen Verbs; die Fußnote erläutert den kontextuellen Sinn.
