base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
translation:
  language: de
  text: Um der Sache eine andere Wendung zu geben,[a] hat dein Diener Joab dies getan. Doch mein Herr ist so weise wie der Engel Gottes[b] und weiß alles, was im Land vor sich geht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »um das Gesicht der Sache zu wenden«. Gemeint sein kann, der Sache eine andere Wendung zu geben, sie anders darzustellen oder ihre Behandlung zu verändern.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann »Bote« oder »Engel« bedeuten. Auch die Wiedergabe »eines Engels Gottes« ist sinngemäß möglich, wenn der Vergleich allgemein verstanden wird.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »alles, was auf der Erde ist«. Im Zusammenhang ist wahrscheinlich das Land beziehungsweise das Herrschaftsgebiet des Königs gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַעֲבוּר
  choice: Um … zu
  rationale: Die Präposition mit Infinitiv bezeichnet hier den Zweck; die deutsche Infinitivkonstruktion gibt dies natürlich und präzise wieder.
- source_word: סַבֵּב אֶת־פְּנֵי הַדָּבָר
  choice: der Sache eine andere Wendung geben
  rationale: Die hebräische Wendung spricht wörtlich davon, das »Gesicht der Sache« zu wenden. Die gewählte deutsche Formulierung bewahrt das Bild des Wendens, ohne unnatürlich zu klingen, und lässt offen, ob Verlauf, Darstellung oder Behandlung der Sache verändert werden soll.
- source_word: עָשָׂה ... אֶת־הַדָּבָר הַזֶּה
  choice: hat … dies getan
  rationale: Eine knappe, idiomatische Wiedergabe, die im Deutschen die unnötige Wiederholung von »Sache« vermeidet.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Die höfische Selbstbezeichnung wird mit der im Deutschen passenden ehrerbietigen Form wiedergegeben.
- source_word: וַאדֹנִי
  choice: Doch mein Herr
  rationale: Das Waw leitet hier den Übergang von der Erklärung zum Lob des Königs ein und kann im Zusammenhang leicht kontrastiv verstanden werden.
- source_word: חָכָם כְּחָכְמַת
  choice: ist weise mit der Weisheit
  rationale: Die Formulierung bewahrt sowohl das Adjektiv »weise« als auch das unmittelbar folgende Substantiv »Weisheit« und bildet den ausdrücklichen Vergleich nach.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: des Engels Gottes
  rationale: Die definite hebräische Status-constructus-Verbindung wird formal nah wiedergegeben. מַלְאָךְ kann je nach Zusammenhang »Bote« oder »Engel« bedeuten; hier bezeichnet die Vergleichsformel einen übermenschlich einsichtigen Gottesboten.
- source_word: לָדַעַת אֶת כָּל אֲשֶׁר בָּאָרֶץ
  choice: und weiß alles, was im Land vor sich geht
  rationale: Der Infinitiv beschreibt die daraus folgende beziehungsweise dazu befähigende Erkenntnis. »Was … vor sich geht« ist im Deutschen die natürliche kontextuelle Wiedergabe der Angelegenheiten im Herrschaftsgebiet, ohne dem König Allwissenheit zuzuschreiben.
theological_decisions:
- issue: Aussage über die Weisheit des Engels Gottes
  choice: Als ehrerbietiger Vergleich außergewöhnlicher Einsicht wiedergegeben
  alternative: Als Aussage über eine göttliche oder allwissende Natur Davids verstehen
  rationale: Der Text vergleicht die Weisheit des Königs mit der Weisheit des Engels Gottes. Er setzt David weder ontologisch mit einem himmlischen Wesen gleich noch schreibt er ihm ausdrücklich absolute Allwissenheit zu.
- issue: Bestimmtheit von מַלְאַךְ הָאֱלֹהִים
  choice: »des Engels Gottes«
  alternative: »eines Engels Gottes« beziehungsweise »eines Boten Gottes«
  rationale: Durch den bestimmten zweiten Bestandteil ist die gesamte hebräische Constructus-Verbindung grammatisch bestimmt. Die Fußnote bewahrt zugleich die lexikalische und referenzielle Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfischen Anreden »dein Diener« und »mein Herr« bleiben erhalten. Der schwer verständliche hebräische Ausdruck vom »Gesicht der Sache« wird im Haupttext behutsam idiomatisch wiedergegeben und in der Fußnote wörtlich dokumentiert.
