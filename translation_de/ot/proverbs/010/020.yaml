  terminology: „Gerechter“ und „Gottlose“ sind im Weisheitskontext etablierte und sachgerechte Bezeichnungen. „Erlesenes Silber“ trifft die Qualitätsnuance von נִבְחָר. Die Fußnote wahrt die lexikalische Offenheit von כִּמְעָט, ohne eine dogmatische Aussage über den Wert von Personen zu machen.
