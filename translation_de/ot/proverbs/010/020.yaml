  source_fidelity: 'Die Übersetzung gibt den hebräischen Parallelismus und die Bilder präzise wieder: לְשׁוֹן als „Zunge“, כֶּסֶף נִבְחָר als „erlesenes Silber“, לֵב als „Herz“ und כִּמְעָט idiomatisch als „ist wenig wert“. Die im Hebräischen knappe bzw. elliptische Wertprädikation wird nicht überdehnt.'
