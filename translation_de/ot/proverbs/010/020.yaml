id: PRO.10.20
reference: Proverbs 10:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֶּ֣סֶף נִ֭בְחָר לְשׁ֣וֹן צַדִּ֑יק לֵ֖ב רְשָׁעִ֣ים כִּ/מְעָֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/020.yaml
  text: The tongue of the righteous is choice silver[a]; the heart of the wicked is of little worth.
translation:
  language: de
  text: Die Zunge des Gerechten ist erlesenes Silber; das Herz der Gottlosen ist wenig wert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist gering“ beziehungsweise „ist beinahe nichts“. Das knappe hebräische כִּמְעָט kann geringen Wert oder Beinahe-Nichtigkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  choice: Silber
  rationale: Die konkrete Bedeutung „Silber“ bewahrt das Wertbild des Spruchs besser als das abstraktere „Geld“.
- source_word: נִבְחָר
  choice: erlesen
  rationale: Das Partizip bezeichnet hier ausgewählte, hochwertige Qualität; „erlesen“ ist im Deutschen bei einem kostbaren Stoff natürlich und würdevoll.
- source_word: לְשׁוֹן
  choice: Zunge
  rationale: Die wörtliche Körpermetapher ist im Deutschen verständlich und steht metonymisch für das Reden.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet den gerechten Menschen typologisch; der deutsche Singular erhält die Form des hebräischen Ausdrucks.
- source_word: לֵב
  choice: Herz
  rationale: „Herz“ bewahrt das hebräische Menschenbild, in dem Denken, Wollen und moralische Gesinnung eingeschlossen sind, sowie den Gegensatz zur „Zunge“.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: Der substantivierte Plural bezeichnet die moralische Gruppe kollektiv; „Gottlose“ ist eine etablierte, kontextgemäße Wiedergabe von רְשָׁעִים.
- source_word: כִּמְעָט
  choice: ist wenig wert
  rationale: Die knappe Wendung bezeichnet im Wertvergleich geringe Bedeutung beziehungsweise geringen Wert; die deutsche Formulierung macht das im Hebräischen elliptische Prädikat idiomatisch deutlich.
theological_decisions:
- issue: Bedeutungsumfang von רְשָׁעִים
  choice: Gottlose
  alternative: Böse / Frevler
  rationale: „Gottlose“ bezeichnet hier eine moralisch schuldige Personengruppe und darf nicht auf bloße Religionslosigkeit verengt werden; die Übersetzung folgt etabliertem biblischem Sprachgebrauch, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Bewertung des Herzens
  choice: ist wenig wert
  alternative: ist wie nichts / ist gering
  rationale: Der Parallelismus legt eine Wertung nahe, doch die Aussage wird nicht zu einer umfassenden Lehre über den ontologischen Wert von Menschen ausgeweitet; bewertet wird im Spruch das Herz beziehungsweise die innere Gesinnung der Gottlosen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrten Körper- und Wertmetaphern. Der Parallelismus bleibt knapp; die im Hebräischen elliptische zweite Aussage wird für natürliches Deutsch leicht ergänzt.
