  text: כִּ/שְׂח֣וֹק לִ֭/כְסִיל עֲשׂ֣וֹת זִמָּ֑ה וְ֝/חָכְמָ֗ה לְ/אִ֣ישׁ תְּבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/023.yaml
  text: Doing wickedness is like a joke to a fool[a], but wisdom is for a man of understanding.
translation:
  language: de
  text: Eine Schandtat zu begehen ist für einen Toren wie ein Vergnügen; Weisheit aber ist es für einen verständigen Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für einen Toren ist es ein Vergnügen, einen bösen Plan auszuführen.“ Das hebräische Wort für „Schandtat“ kann auch einen bösen Plan oder eine schamlose, empörende Tat bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׂחוֹק
  choice: wie ein Spiel
  rationale: כְּ kennzeichnet den Vergleich; שְׂחוֹק kann Lachen, Vergnügen oder spielerische Unterhaltung bezeichnen. „Wie ein Spiel“ drückt natürlich aus, dass der Tor die böse Tat als unterhaltsam und belanglos behandelt.
- source_word: לִכְסִיל
  choice: für einen Toren
  rationale: 'לְ bezeichnet hier die Zuordnung beziehungsweise Sichtweise: So erscheint das Handeln dem Toren.'
- source_word: עֲשׂוֹת
  choice: zu begehen
  rationale: Der Infinitiv constructus ist substantivisch gebraucht. In Verbindung mit „Schandtat“ ist „begehen“ im Deutschen idiomatisch und bewahrt den Handlungssinn.
- source_word: זִמָּה
  choice: eine Schandtat
  rationale: זִמָּה bezeichnet einen bösen Plan oder eine schamlose, empörende Tat und kann in anderen Zusammenhängen sexuelle Verfehlung meinen. „Schandtat“ wahrt hier die starke moralische Wertung, ohne den Sinn unnötig auf Sexualität zu verengen.
- source_word: וְחָכְמָה
  choice: Weisheit aber
  rationale: Das Waw ist im antithetischen Parallelismus sinnvoll adversativ wiederzugeben. Die Nachstellung von „aber“ klingt im Deutschen würdig und knapp.
- source_word: לְאִישׁ תְּבוּנָה
  choice: für einen verständigen Mann
  rationale: Wörtlich steht „für/zu einem Mann von Einsicht“. Da im zweiten Halbvers das Prädikat fehlt, lässt „für“ die genaue Beziehung bewusst offen und bewahrt die knappe Ellipse.
theological_decisions:
- issue: Generisch-maskuline Ausdrucksweise in אִישׁ
  choice: verständiger Mann
  alternative: verständiger Mensch
  rationale: אִישׁ ist ausdrücklich maskulin Singular und wird in diesem Weisheitsspruch repräsentativ gebraucht. „Mann“ bildet die Form des Hebräischen ab, ohne die allgemeine Geltung des Spruchs einzuschränken.
- issue: Elliptische Beziehung zwischen Weisheit und dem verständigen Mann
  choice: Weisheit aber für einen verständigen Mann
  alternative: dem verständigen Mann macht Weisheit Freude
  rationale: Der hebräische zweite Halbvers nennt kein ausdrückliches Prädikat. Die gewählte knappe Form erhält diese Offenheit, statt aus dem Parallelismus ausdrücklich „Freude“ oder „Vergnügen“ zu ergänzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, sprichwortartiger Struktur. „Tor“ und „Weisheit“ bewahren den würdigen Weisheitsbuch-Ton; die Ellipse des zweiten Halbverses bleibt erhalten.
