  variant: modern standard German
source:
  edition: WLC
  text: מָע֣וֹז לַ֭/תֹּם דֶּ֣רֶךְ יְהוָ֑ה וּ֝/מְחִתָּ֗ה לְ/פֹ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/029.yaml
  text: The way of Yahweh is a stronghold for the blameless[b][a], but destruction for those who do evil.
translation:
  language: de
  text: Der Weg Jahwes ist eine Festung für den Lauteren,[a] aber Verderben für die, die Unrecht tun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den, der untadelig lebt“. „Der Weg Jahwes“ kann sowohl seine Art zu handeln als auch den Weg bezeichnen, den er den Menschen vorgibt.'
    reason: lexical_alternative
  - marker: b
    text: „Verderben“ kann hier auch „Untergang“ oder „Schrecken“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוֹז
  choice: Festung
  rationale: Das Wort bezeichnet einen Ort oder eine Quelle von Schutz und Stärke. „Festung“ bewahrt das konkrete Bild und bildet einen klaren Gegensatz zu „Verderben“.
- source_word: לַתֹּם
  choice: für den, der integer lebt
  rationale: תֹּם bezeichnet Unversehrtheit, Lauterkeit oder Integrität. Die persönliche Wiedergabe entspricht dem Gegensatz zu den Menschen, die Unrecht tun; „integer lebt“ vermeidet zugleich die mögliche Vorstellung absoluter Sündlosigkeit.
- source_word: דֶּרֶךְ יְהוָה
  choice: der Weg Jahwes
  rationale: 'Die enge Wiedergabe bewahrt die mögliche Doppelbedeutung: Jahwes eigenes Handeln und der von ihm vorgegebene Lebensweg.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ transliteriert und nicht durch einen Titel ersetzt.
- source_word: וּמְחִתָּה
  choice: aber Verderben
  rationale: מְחִתָּה kann Verderben, Untergang, Schrecken oder Bestürzung bezeichnen. „Verderben“ passt zur antithetischen Aussage; das ו wird wegen des scharfen Gegensatzes mit „aber“ wiedergegeben.
- source_word: לְפֹעֲלֵי אָוֶן
  choice: für die, die Unrecht tun
  rationale: Die Formulierung bewahrt den tätigen Sinn von פֹעֲלֵי und gibt אָוֶן in diesem ethischen Zusammenhang verständlich als „Unrecht“ wieder.
theological_decisions:
- issue: Bedeutungsumfang von „der Weg Jahwes“
  choice: Die mehrdeutige Genitivverbindung bleibt erhalten.
  alternative: Entweder ausschließlich Jahwes Handlungsweise oder ausschließlich der von Jahwe gebotene Weg.
  rationale: Der hebräische Ausdruck kann beide Nuancen tragen. Eine Festlegung würde die Aussage unnötig verengen.
- issue: Bedeutung von תֹּם
  choice: Als integre Lebensführung wiedergegeben.
  alternative: „der Schuldlose“ oder „der Vollkommene“
  rationale: Die Aussage beschreibt moralische Lauterkeit, ohne ausdrücklich absolute Sündlosigkeit zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Festung“ erhält die kräftige Schutzmetapher; „integer lebt“ ist gegenwärtig verständlich und gibt die ethische Ganzheit von תֹּם wieder. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Satzteilen.
