base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/014.yaml
  text: Wise men store up knowledge[c][b][a], but the mouth of a fool is near ruin.
translation:
  language: de
  text: Die Weisen bewahren Erkenntnis,[a] aber der Mund eines Narren ist dem Verderben nahe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Bewahren“ kann auch mit „aufspeichern“, „wie einen Schatz hüten“ oder „verbergen“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich ist die zweite Satzhälfte ein knapper Nominalsatz: „und der Mund eines Narren – nahes Verderben“. Auch möglich: „… aber dem Mund eines Narren ist Verderben nahe.“ Das einleitende Bindewort kann statt „aber“ auch „und“ bedeuten; der Zusammenhang spricht für einen Gegensatz.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: חֲכָמִים
  choice: die Weisen
  rationale: Das substantivierte maskuline Pluraladjektiv bezeichnet sprichwörtlich weise Menschen. „Die Weisen“ ist im Deutschen natürlich und bewahrt die knappe Gegenüberstellung.
- source_word: יִצְפְּנוּ
  choice: bewahren
  rationale: צפן kann „verbergen“, „aufbewahren“ oder „aufspeichern“ bedeuten. Hier ist das umsichtige Sammeln und Bewahren von Erkenntnis gemeint; „bewahren“ gibt dies ohne den Beiklang arglistigen Verheimlichens wieder.
- source_word: דָעַת
  choice: Erkenntnis
  rationale: דעת bezeichnet in den Sprüchen Wissen bzw. Erkenntnis. „Erkenntnis“ passt zum weisheitlichen Zusammenhang und klingt im Deutschen würdig und geläufig.
- source_word: וּפִי
  choice: aber der Mund
  rationale: Das Waw kann schlicht mit „und“ wiedergegeben werden, doch der Parallelismus stellt Weise und Narr kontrastierend gegenüber. Daher macht „aber“ die wahrscheinliche Beziehung der Satzhälften deutlich.
- source_word: אֱוִיל
  choice: eines Narren
  rationale: אֱוִיל bezeichnet in der Weisheitsliteratur einen törichten, oft moralisch uneinsichtigen Menschen. Der Singular ist repräsentativ und wird mit „eines Narren“ bewahrt.
- source_word: מְחִתָּה
  choice: Verderben
  rationale: Das Substantiv kann Verderben, Zerstörung, Schrecken oder Bestürzung bezeichnen. Im Zusammenhang mit dem Mund des Narren und der Nähe der Folge bezeichnet „Verderben“ am ehesten drohendes Unheil, ohne die Mehrdeutigkeit unnötig zu verengen.
- source_word: קְרֹבָה
  choice: bringt … nahe
  rationale: Wörtlich steht das feminine Prädikatsadjektiv „nahe“ zu מְחִתָּה. Die deutsche Fassung „bringt Verderben nahe“ versteht die knappe Nominalkonstruktion idiomatisch als Folge des törichten Redens; die wörtlichere Zuordnung bleibt in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Knappes, antithetisches Sprichwort in modernem, würdigem Standarddeutsch. Die ungewöhnlich verdichtete zweite hebräische Satzhälfte wird verständlich wiedergegeben, während die mögliche statische Lesart in der Fußnote erhalten bleibt.
