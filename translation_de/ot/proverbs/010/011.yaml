  variant: modern standard German
source:
  edition: WLC
  text: מְק֣וֹר חַ֭יִּים פִּ֣י צַדִּ֑יק וּ/פִ֥י רְ֝שָׁעִ֗ים יְכַסֶּ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/011.yaml
  text: The mouth of the righteous is a fountain of life[a], but the mouth of the wicked conceals violence.
translation:
  language: de
  text: Der Mund eines Gerechten ist eine Quelle des Lebens, doch der Mund der Gottlosen verbirgt Gewalt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „doch Gewalt bedeckt den Mund der Gottlosen“. Das Hebräische lässt beim Verb „bedecken/verbergen“ unterschiedliche Auffassungen des Satzes zu; vergleiche Sprüche 10,6.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: מְקוֹר
  choice: Quelle
  rationale: Das Substantiv bezeichnet eine Quelle beziehungsweise einen Quellort. „Quelle“ bewahrt das Bild lebensspendenden Wassers und ist im modernen Deutschen natürlich.
- source_word: חַיִּים
  choice: des Lebens
  rationale: Die hebräische Pluralform bezeichnet hier idiomatisch das Leben; im Deutschen entspricht dem die abstrakte Singularform.
- source_word: פִּי צַדִּיק
  choice: der Mund eines Gerechten
  rationale: Die konkrete Metapher „Mund“ bleibt erhalten. Der artikellose hebräische Singular צַדִּיק wird als repräsentative Einzelperson wiedergegeben, ohne ein männliches Geschlecht ausdrücklich hinzuzufügen.
- source_word: וּפִי רְשָׁעִים
  choice: doch der Mund der Gottlosen
  rationale: „Doch“ gibt den Gegensatz des Parallelismus wieder. „Mund“ steht im Hebräischen im Singular, während „Gottlose“ pluralisch ist; diese auffällige kollektive Form wird bewahrt.
- source_word: יְכַסֶּה
  choice: verbirgt
  rationale: Das Verb bedeutet grundsätzlich „bedecken“ und kann übertragen „verbergen“ heißen. Im Zusammenhang mit dem Mund der Gottlosen ist „verbirgt“ verständlich, ohne die zugrunde liegende Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: חָמָס
  choice: Gewalt
  rationale: Das Wort bezeichnet Gewalt sowie gewaltsames Unrecht. „Gewalt“ ist prägnant und erhält den scharfen moralischen Gegensatz.
theological_decisions:
- issue: Bezug von יְכַסֶּה חָמָס
  choice: Der Mund der Gottlosen verbirgt Gewalt.
  alternative: Gewalt bedeckt den Mund der Gottlosen.
  rationale: Der masoretisch vokalisierte Verbalsatz legt „der Mund ... verbirgt Gewalt“ nahe. Wegen der möglichen syntaktischen und semantischen Spannung sowie der Parallelstelle in Sprüche 10,6 wird die alternative Auffassung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Bildsprache. „Gerechter“ und „Gottlose“ entsprechen dem prägnanten Weisheitsstil; die ungewöhnliche Verbindung von singularischem „Mund“ und pluralischen „Gottlosen“ folgt bewusst dem Hebräischen.
