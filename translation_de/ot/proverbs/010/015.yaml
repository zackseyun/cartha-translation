source:
  edition: WLC
  text: ה֣וֹן עָ֭שִׁיר קִרְיַ֣ת עֻזּ֑/וֹ מְחִתַּ֖ת דַּלִּ֣ים רֵישָֽׁ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/015.yaml
  text: A rich man's wealth is his fortified city[b][a]; the ruin of the poor is their poverty.
translation:
  language: de
  text: Der Reichtum eines reichen Mannes ist seine befestigte Stadt[a]; der Untergang[b] der Armen ist ihre Armut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Stadt seiner Stärke«; auch möglich: »seine starke Stadt«.'
    reason: lexical_alternative
  - marker: b
    text: »Untergang« kann auch mit »Zerstörung« oder – hier weniger wahrscheinlich – mit »Schrecken« beziehungsweise »Bestürzung« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: Reichtum
  rationale: Bezeichnet materiellen Besitz bzw. Vermögen und bildet den direkten Gegensatz zur Armut im zweiten Halbvers.
- source_word: עָשִׁיר
  choice: eines reichen Mannes
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular; die Formulierung bewahrt Numerus und Genus sowie die Zugehörigkeitsbeziehung.
- source_word: קִרְיַת עֻזּוֹ
  choice: seine befestigte Stadt
  rationale: Wörtlich etwa »Stadt seiner Stärke«; »befestigte Stadt« gibt das Bild eines Ortes wieder, der Schutz und Sicherheit bietet.
- source_word: מְחִתַּת
  choice: Untergang
  rationale: Das Wort kann Zerstörung, Zusammenbruch, Schrecken oder Bestürzung bezeichnen. Im wirtschaftlichen Parallelismus bezeichnet »Untergang« treffend das Verderben bzw. die ruinöse Lage.
- source_word: דַּלִּים
  choice: der Armen
  rationale: Bezeichnet arme, mittellose oder sozial schwache Menschen; »die Armen« ist knapp und kontextgemäß.
- source_word: רֵישָׁם
  choice: ihre Armut
  rationale: Die Form bezeichnet ihre Armut bzw. Mittellosigkeit und bewahrt die pointierte Wiederaufnahme der betroffenen Personengruppe.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der knappe antithetische Parallelismus des hebräischen Spruchs bleibt erhalten; die Metapher der befestigten Stadt wird natürlich wiedergegeben, ohne die Aussage über Reichtum und Armut theologisch zu erweitern.
