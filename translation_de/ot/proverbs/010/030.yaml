id: PRO.10.30
reference: Proverbs 10:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: צַדִּ֣יק לְ/עוֹלָ֣ם בַּל יִמּ֑וֹט וּ֝/רְשָׁעִ֗ים לֹ֣א יִשְׁכְּנוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/030.yaml
  text: The righteous will never be shaken[a], but the wicked will not dwell in the land.
translation:
  language: de
  text: Der Gerechte wird niemals wanken, aber die Frevler werden nicht im Land[a] wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Erde“. Das hebräische Wort אֶרֶץ kann sowohl ein bestimmtes Land als auch die Erde im weiteren Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv im Singular bezeichnet einen gerechten Menschen in allgemeingültiger, repräsentativer Weise. „Der Gerechte“ bewahrt die knappe Form des Spruchs.
- source_word: לְעוֹלָם … בַּל
  choice: niemals
  rationale: Die Verbindung aus der Zeitangabe „für immer“ und der poetischen Verneinung drückt hier eine dauerhafte Negation aus; „niemals“ gibt dies im Deutschen natürlich und prägnant wieder.
- source_word: יִמּוֹט
  choice: wanken
  rationale: Das Nifal von מוט bezeichnet das Erschüttert- oder Instabilwerden. „Wanken“ erhält das Bild fester Beständigkeit, ohne es zur völligen Vernichtung zu verstärken.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: Das substantivierte Adjektiv im Plural bezeichnet Menschen, die moralisch böse handeln. „Die Frevler“ ist knapp, würdig und vermeidet eine unnötige dogmatische Einengung.
- source_word: יִשְׁכְּנוּ
  choice: werden … wohnen
  rationale: Das Verb שכן bedeutet wohnen, sich niederlassen oder ansässig sein. „Wohnen“ bewahrt den Gedanken dauerhafter Beheimatung.
- source_word: אֶרֶץ
  choice: Land
  rationale: אֶרֶץ kann ein bestimmtes Land oder allgemeiner die Erde bezeichnen. „Land“ passt zum Motiv sicheren Wohnens und lässt mögliche territoriale Resonanzen erkennen; die weitere Bedeutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutungsumfang von אֶרֶץ
  choice: Land
  alternative: Erde
  rationale: Der Spruch stellt die bleibende Festigkeit des Gerechten dem fehlenden dauerhaften Wohnort der Frevler gegenüber. „Land“ wahrt den möglichen Bezug auf ein konkretes oder verheißenes Land, während „Erde“ als allgemeingültige Lesart ebenfalls sprachlich möglich bleibt und deshalb in der Fußnote genannt wird.
translation_notes:
  register: Moderne, knappe und würdevolle Spruchsprache. Der Parallelismus und das Stabilitätsbild des Hebräischen bleiben erhalten; die Mehrdeutigkeit von אֶרֶץ wird nicht stillschweigend aufgelöst.
