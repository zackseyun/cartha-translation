  text: בְּ/שִׂפְתֵ֣י נָ֭בוֹן תִּמָּצֵ֣א חָכְמָ֑ה וְ֝/שֵׁ֗בֶט לְ/גֵ֣ו חֲסַר לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/013.yaml
  text: On the lips of a discerning man wisdom is found[a], but a rod is for the back of one who lacks sense.
translation:
  language: de
  text: Auf den Lippen eines Verständigen findet sich Weisheit, aber ein Stock ist für den Rücken dessen bestimmt, dem es an Verstand fehlt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem es an Herz fehlt“; im Hebräischen ist das Herz hier der Sitz von Einsicht und Urteilsvermögen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/שִׂפְתֵי
  choice: Auf den Lippen
  rationale: Die Präposition ב bezeichnet hier idiomatisch den Ort, an dem Weisheit im Reden hervortritt. Die deutsche Wendung bewahrt das hebräische Bild.
- source_word: נָבוֹן
  choice: eines Verständigen
  rationale: נָבוֹן bezeichnet einen Menschen mit Einsicht und Urteilsvermögen. Die substantivierte Form ist im Deutschen natürlich und bewahrt den grammatisch maskulinen Singular des Spruchs.
- source_word: תִּמָּצֵא
  choice: findet sich
  rationale: Das Nifal-Imperfekt formuliert eine allgemeine, sprichwörtliche Wahrheit. Das deutsche Präsens gibt diesen gnomischen Sinn angemessen wieder.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist die übliche und kontextgerechte Wiedergabe des zentralen Begriffs der Sprüche.
- source_word: וְ/שֵׁבֶט
  choice: aber der Stock
  rationale: Die Konjunktion verbindet gegensätzliche Aussagen und wird deshalb adversativ mit „aber“ wiedergegeben. שֵׁבֶט bezeichnet hier einen Stock als Mittel der Züchtigung oder Bestrafung.
- source_word: לְ/גֵו
  choice: ist für den Rücken bestimmt
  rationale: גֵו meint hier den Rücken als die Stelle, die mit dem Stock geschlagen wird. „Bestimmt“ ergänzt die im Hebräischen nominale Aussage idiomatisch, ohne ihren Sinn zu verändern.
- source_word: חֲסַר לֵב
  choice: dem es an Verstand fehlt
  rationale: Wörtlich bedeutet die hebräische Wendung „dem es an Herz fehlt“. Da das Herz in diesem Zusammenhang als Sitz von Einsicht und Urteilsvermögen gilt, gibt „Verstand“ den idiomatischen Sinn verständlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und das konkrete Bild von Lippen, Stock und Rücken bleiben erhalten; die hebräische Herz-Redewendung wird im Haupttext verständlich wiedergegeben und in der Fußnote offengelegt.
