source:
  edition: WLC
  text: מִשְׁלֵ֗י שְׁלֹ֫מֹ֥ה בֵּ֣ן חָ֭כָם יְשַׂמַּח אָ֑ב וּ/בֵ֥ן כְּ֝סִ֗יל תּוּגַ֥ת אִמּֽ/וֹפ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/001.yaml
  text: 'The proverbs of Solomon: a wise son makes a father glad[a], but a foolish son is the grief of his mother.'
translation:
  language: de
  text: 'Sprüche Salomos:


    Ein weiser Sohn macht den Vater froh, aber ein törichter Sohn ist der Kummer seiner Mutter.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aber ein törichter Sohn bereitet seiner Mutter Kummer.“'
    reason: Die hebräische Nominalfügung תּוּגַת אִמּוֹ kann formal als „der Kummer seiner Mutter“ oder idiomatischer als Aussage über das Verursachen von Kummer wiedergegeben werden.
lexical_decisions:
- source_word: מִשְׁלֵי
  choice: Sprüche
  rationale: Der Konstruktplural von מָשָׁל dient hier als Sammlungsüberschrift. „Sprüche“ ist im Deutschen die natürliche und etablierte Entsprechung.
- source_word: שְׁלֹמֹה
  choice: Salomos
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben; der Genitiv bildet die hebräische Konstruktverbindung ab.
- source_word: בֵּן
  choice: Sohn
  rationale: Das hebräische Substantiv steht ausdrücklich im maskulinen Singular und wird nicht zu „Kind“ verallgemeinert.
- source_word: חָכָם
  choice: weise
  rationale: Im Sprüchebuch bezeichnet חָכָם moralische und lebenspraktische Weisheit und bildet den passenden Gegensatz zu כְּסִיל.
- source_word: יְשַׂמַּח
  choice: macht … froh
  rationale: 'Der Hifil von שׂמח hat kausative Bedeutung: Der Sohn bewirkt Freude. Die Formulierung ist gegenwärtig, klar und nah an dieser Verbform.'
- source_word: אָב
  choice: den Vater
  rationale: Im Hebräischen fehlt ein Possessivsuffix. Der generische bestimmte Artikel klingt im Deutschen natürlich und vermeidet, ausdrücklich „seinen Vater“ hinzuzufügen.
- source_word: וּבֵן
  choice: aber ein … Sohn
  rationale: Das Waw wird wegen des antithetischen Parallelismus mit „aber“ wiedergegeben, wodurch der Gegensatz der beiden Vershälften deutlich wird.
- source_word: כְּסִיל
  choice: töricht
  rationale: כְּסִיל bezeichnet in der Weisheitsliteratur nicht bloß geringe Intelligenz, sondern moralische und lebenspraktische Torheit. „Töricht“ bewahrt diesen würdevollen weisheitlichen Ton.
- source_word: תּוּגַת
  choice: der Kummer
  rationale: Das Substantiv bezeichnet Kummer oder Gram. Die nominale Wiedergabe bildet die knappe hebräische Konstruktverbindung möglichst unmittelbar ab.
- source_word: אִמּוֹ
  choice: seiner Mutter
  rationale: Das ausdrückliche Suffix der 3. Person maskulin Singular wird im Deutschen mit dem Possessivpronomen wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappem, würdigem Spruchstil. Der antithetische Parallelismus und der Wechsel zwischen „den Vater“ ohne ausdrückliches Possessiv und „seiner Mutter“ mit hebräisch belegtem Possessivsuffix bleiben erkennbar.
