id: PRO.10.2
reference: Proverbs 10:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא י֭וֹעִילוּ אוֹצְר֣וֹת רֶ֑שַׁע וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/002.yaml
  text: Treasures of wickedness do not profit[b][a], but righteousness delivers from death.
translation:
  language: de
  text: Schätze aus Unrecht[a] nützen nichts, doch Gerechtigkeit[b] rettet vor dem Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Schätze des Unrechts“; gemeint sein können durch Unrecht erworbene Reichtümer.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Rechtschaffenheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֭וֹעִילוּ
  choice: nützen nichts
  rationale: Das Hifil von יעל bezeichnet Nutzen oder Vorteil. „Nützen nichts“ ist knapp, natürlich und wahrt die prägnante Form des Spruchs.
- source_word: אוֹצְר֣וֹת
  choice: Schätze
  rationale: Im Konstruktzusammenhang sind angesammelte Wertgegenstände beziehungsweise Reichtümer gemeint, nicht in erster Linie Vorratshäuser.
- source_word: רֶ֑שַׁע
  choice: aus Unrecht
  rationale: Die hebräische Konstruktverbindung lautet formal „Schätze des Unrechts“. „Aus Unrecht“ lässt sowohl ihre Prägung durch Unrecht als auch den naheliegenden Erwerb durch Unrecht anklingen, ohne die Beziehung endgültig festzulegen.
- source_word: וּ֝/צְדָקָ֗ה
  choice: doch Gerechtigkeit
  rationale: Das Waw markiert im antithetischen Parallelismus einen Gegensatz und wird daher mit „doch“ wiedergegeben. „Gerechtigkeit“ bewahrt die Breite von צְדָקָה zwischen gerechtem Handeln und persönlicher Rechtschaffenheit.
- source_word: תַּצִּ֥יל
  choice: rettet
  rationale: Das Hifil von נצל bedeutet retten, entreißen oder befreien. „Rettet“ ist im Deutschen klar und kräftig, ohne die Art der Rettung näher festzulegen.
- source_word: מִ/מָּֽוֶת
  choice: vor dem Tod
  rationale: Bei „retten“ ist „vor dem Tod“ die natürliche deutsche Verbindung. Sie erhält die mögliche wörtliche wie auch weisheitliche Bedeutung, nämlich Bewahrung vor tödlicher Gefahr.
theological_decisions:
- issue: Bedeutungsumfang von צְדָקָה
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ ist der etablierte, theologisch offene Ausdruck und kann hier gerechtes, redliches Leben bezeichnen. Die Fußnote hält die stärker charakterbezogene Lesart „Rechtschaffenheit“ sichtbar.
- issue: Art der Rettung vor dem Tod
  choice: rettet vor dem Tod
  alternative: bewahrt vor tödlicher Gefahr
  rationale: Die unverkürzte Aussage des Hebräischen bleibt stehen. Sie wird weder ausschließlich auf alltägliche Lebensbewahrung noch auf eine bestimmte heilsgeschichtliche Lehre eingeengt.
translation_notes:
  register: Knappes, einprägsames Sprichwort in modernem Standarddeutsch. Der antithetische Aufbau und die theologische Offenheit der Aussage bleiben erhalten.
