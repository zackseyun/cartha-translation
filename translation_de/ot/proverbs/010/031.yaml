  text: פִּֽי צַ֭דִּיק יָנ֣וּב חָכְמָ֑ה וּ/לְשׁ֥וֹן תַּ֝הְפֻּכ֗וֹת תִּכָּרֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/031.yaml
  text: The mouth of the righteous bears wisdom as fruit[b][a], but the tongue of perversity will be cut off.
translation:
  language: de
  text: Der Mund eines Gerechten bringt Weisheit hervor[a], doch die Zunge, die Verkehrtes redet[b], wird abgeschnitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »lässt Weisheit sprossen«. Das hebräische Verb weckt das Bild vom Sprossen oder Fruchttragen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »die Zunge der Verkehrtheiten«. Der hebräische Plural kann wiederholtes oder vielfältiges verdrehtes Reden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: Mund
  rationale: Das konkrete Bild des Mundes als Quelle der Rede bleibt erhalten und bildet den Gegenpol zur »Zunge« im zweiten Satzteil.
- source_word: צַדִּיק
  choice: eines Gerechten
  rationale: Der substantivisch gebrauchte Singular bezeichnet hier einen Vertreter der Gruppe der Gerechten; die deutsche Form bewahrt Zahl und Weisheitsstil des Hebräischen.
- source_word: יָנוּב
  choice: lässt … als Frucht wachsen
  rationale: Das Verb bezeichnet das Sprossen oder Hervorbringen von Frucht. Die Wiedergabe erhält das organische Bild und klingt im Deutschen natürlich.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Das abstrakte Substantiv wird ohne erklärende Erweiterung direkt wiedergegeben.
- source_word: לְשׁוֹן
  choice: Zunge
  rationale: Die konkrete Metonymie für das Reden bleibt erhalten und entspricht dem »Mund« des ersten Satzteils.
- source_word: תַּהְפֻּכוֹת
  choice: die Verkehrtes redet
  rationale: Der hebräische Plural bezeichnet verdrehte, verkehrte Äußerungen oder Verkehrtheit. Die verbale Formulierung macht die Beziehung zur Zunge im Deutschen klar, ohne sie auf bloßen Irrtum oder ausdrücklich auf Täuschung einzuengen.
- source_word: תִּכָּרֵת
  choice: wird abgeschnitten
  rationale: Die passive, scharfe Bildsprache des Niphal von כרת bleibt erhalten; eine Deutung allein als »zum Schweigen gebracht« wäre enger als der Ausgangstext.
theological_decisions:
- issue: Reichweite des Gerichtsbildes »wird abgeschnitten«
  choice: Das konkrete Bild wird ohne nähere Bestimmung beibehalten.
  alternative: »wird zum Schweigen gebracht« oder »wird beseitigt«
  rationale: Der Vers erklärt nicht, ob ausschließlich das Ende der verkehrten Rede, die Entfernung der Zunge oder das Gericht über den Redenden gemeint ist. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Körperbilder »Mund« und »Zunge« sowie das Frucht- und Abschneidebild werden bewahrt; ungebräuchliche Abstrakta wie »Verkehrtheiten« stehen nur als wörtlichere Alternative in der Fußnote.
