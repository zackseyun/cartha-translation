  text: קֹ֣רֵֽץ עַ֭יִן יִתֵּ֣ן עַצָּ֑בֶת וֶ/אֱוִ֥יל שְׂ֝פָתַ֗יִם יִלָּבֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/010.yaml
  text: Whoever winks the eye causes grief[a], and a fool of lips will come to ruin.
translation:
  language: de
  text: Wer mit dem Auge zwinkert, verursacht Kummer, und ein törichter Schwätzer kommt zu Fall.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Tor der Lippen“. Die hebräische Wendung bezeichnet wahrscheinlich einen Toren, der durch seine Rede kenntlich ist. Die Bedeutung des seltenen Verbs „kommt zu Fall“ ist unsicher; möglich sind auch Wiedergaben wie „geht zugrunde“ oder „wird zu Fall gebracht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵץ עַיִן
  choice: Wer mit den Augen zwinkert
  rationale: Das Partizip bezeichnet allgemein einen Menschen, der durch ein Augenzwinkern verstohlene oder irreführende Signale gibt. Die deutsche Wendung ist natürlich und bewahrt das Bild des hebräischen Ausdrucks.
- source_word: יִתֵּן
  choice: verursacht
  rationale: נתן bedeutet grundsätzlich „geben“, hat zusammen mit עַצָּבֶת hier aber den idiomatischen Sinn „Kummer bereiten/verursachen“.
- source_word: עַצָּבֶת
  choice: Kummer
  rationale: Das Wort kann Schmerz, Betrübnis oder Kummer bezeichnen. „Kummer“ lässt die emotionale und zwischenmenschliche Dimension offen, ohne den Ausdruck auf körperlichen Schmerz zu verengen.
- source_word: וֶאֱוִיל שְׂפָתַיִם
  choice: und ein Lippen-Tor
  rationale: Die ungewöhnliche Zusammensetzung bewahrt das hebräische Bild eines Toren, dessen Torheit sich in seinem Reden zeigt. Der Bindestrich macht sie im Deutschen als charakterisierende Bezeichnung lesbar.
- source_word: יִלָּבֵט
  choice: kommt zu Fall
  rationale: Die seltene und schwierige Verbform bezeichnet wahrscheinlich Sturz, Zusammenbruch oder Verderben. „Kommt zu Fall“ gibt den Ergebnissinn wieder, ohne die unsichere Bildlichkeit zu stark festzulegen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Lippen-Tor“ ist bewusst etwas markant, um die ungewöhnliche hebräische Formulierung und ihre Aussage über sprachlich erkennbare Torheit zu bewahren.
