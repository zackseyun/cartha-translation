id: PRO.10.16
reference: Proverbs 10:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: פְּעֻלַּ֣ת צַדִּ֣יק לְ/חַיִּ֑ים תְּבוּאַ֖ת רָשָׁ֣ע לְ/חַטָּֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/016.yaml
  text: The labor of the righteous leads to life[c][b][a]; the produce of the wicked leads to sin.
translation:
  language: de
  text: Die Arbeit des Gerechten führt zum Leben[a]; der Ertrag[b] des Frevlers führt zur Sünde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dient dem Leben“ beziehungsweise „hat Leben zur Folge“. Die hebräische Präposition kann Zweck, Ziel oder Ergebnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Einkünfte“, „Ernte“ oder „Gewinn“.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann in Opferzusammenhängen auch „Sündopfer“ bedeuten; hier ist jedoch „Sünde“ gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּעֻלַּת
  choice: Arbeit
  rationale: Das Substantiv kann die Arbeit selbst, ihre Leistung oder ihren Lohn bezeichnen. „Arbeit“ wahrt hier die breite Bedeutung und bildet einen natürlichen Gegensatz zum „Ertrag“ im zweiten Satzteil.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Das substantivisch gebrauchte Singularadjektiv bezeichnet den gerechten Menschen als repräsentativen Typus. Die knappe Form entspricht dem Stil der Sprüche.
- source_word: לְחַיִּים
  choice: führt zum Leben
  rationale: Die Präposition לְ kann Ziel, Zweck oder Ergebnis ausdrücken. „Führt zum Leben“ gibt diese Richtung idiomatisch wieder, ohne streng zwischen Zweck und Folge zu entscheiden.
- source_word: תְּבוּאַת
  choice: Ertrag
  rationale: Das Wort bezeichnet Ernte, Ertrag oder Einkünfte. „Ertrag“ bewahrt die bildhafte Weite und kann sowohl das Hervorgebrachte als auch den Gewinn einer Tätigkeit meinen.
- source_word: רָשָׁע
  choice: des Frevlers
  rationale: Der substantivisch gebrauchte Singular bezeichnet den schuldhaft bösen Menschen als Gegenbild zum Gerechten. „Frevler“ ist im Deutschen prägnant und für den Weisheitsstil angemessen.
- source_word: לְחַטָּאת
  choice: führt zur Sünde
  rationale: חַטָּאת bedeutet hier im weisheitlichen Gegensatz zu „Leben“ am ehesten „Sünde“. Die Formulierung spiegelt zudem die resultative beziehungsweise zielgerichtete Aussage des ersten Satzteils.
theological_decisions:
- issue: Bedeutung von חַטָּאת
  choice: Sünde
  alternative: Sündopfer
  rationale: חַטָּאת kann in kultischen Zusammenhängen ein Sündopfer bezeichnen. Hier fehlt jedoch ein Opferkontext; der Gegensatz zwischen dem Leben des Gerechten und dem Ergebnis des Frevlers spricht für die moralische Bedeutung „Sünde“.
- issue: Ziel oder Ergebnis bei לְ
  choice: führt zu
  alternative: dient zu / ist bestimmt für
  rationale: Die hebräische Präposition lässt sowohl Ziel als auch Ergebnis anklingen. „Führt zu“ hält die Aussage offen genug und macht die moralische Richtung beider Lebensweisen deutlich, ohne einen mechanischen Ursache-Wirkungs-Zusammenhang festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, paralleler Spruchstruktur. „Der Gerechte“ und „der Frevler“ geben die repräsentativen Singularformen des Hebräischen wieder; „führt zu“ macht die mögliche Ziel- oder Ergebnisbedeutung verständlich, ohne die hebräische Spannung vorschnell aufzulösen.
