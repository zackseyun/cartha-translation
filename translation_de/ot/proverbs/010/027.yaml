id: PRO.10.27
reference: Proverbs 10:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה תּוֹסִ֣יף יָמִ֑ים וּ/שְׁנ֖וֹת רְשָׁעִ֣ים תִּקְצֹֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/027.yaml
  text: The fear of Yahweh adds days[a], but the years of the wicked will be cut short.
translation:
  language: de
  text: Die Furcht Jahwes verlängert das Leben,[a] doch die Jahre der Gottlosen werden verkürzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fügt Tage hinzu“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: Furcht
  rationale: Die Wendung bezeichnet im Kontext der Weisheitsliteratur ehrfürchtige Gottesfurcht. „Furcht“ bewahrt das Gewicht und die vertraute hebräische Ausdrucksweise besser als das abschwächende „Respekt“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תּוֹסִיף יָמִים
  choice: verlängert das Leben
  rationale: Wörtlich steht „fügt Tage hinzu“. Die idiomatische deutsche Wiedergabe drückt die gemeinte Verlängerung der Lebenszeit natürlich aus; die konkrete Formulierung wird in der Fußnote dokumentiert.
- source_word: וּ/שְׁנוֹת
  choice: doch die Jahre
  rationale: Das Waw verbindet formal die Satzhälften, während der antithetische Parallelismus im Deutschen eine kontrastierende Wiedergabe mit „doch“ nahelegt.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: „Gottlose“ ist ein knapper, im Kontext der biblischen Weisheitsliteratur geläufiger Ausdruck für Menschen, deren Lebensführung moralisch verwerflich und gegen Gott gerichtet ist.
- source_word: תִּקְצֹרְנָה
  choice: werden verkürzt
  rationale: Das feminine Pluralverb stimmt mit „Jahre“ überein und besagt, dass diese kurz werden beziehungsweise verkürzt sind. Die deutsche Passivform erhält den Kontrast zur verlängerten Lebenszeit.
theological_decisions:
- issue: Charakter der Aussage über ein langes beziehungsweise verkürztes Leben
  choice: Die Aussage bleibt als unqualifizierter Weisheitsspruch stehen, ohne sie ausdrücklich zu einer ausnahmslosen Garantie zu erklären.
  alternative: Den Vers als bedingungslose Zusage für jeden Gottesfürchtigen und als ausnahmslose Vorhersage eines frühen Todes für jeden Gottlosen auslegen.
  rationale: Der Wortlaut formuliert ein allgemeines weisheitliches Muster. Die Übersetzung bewahrt dessen pointierte Aussage, ohne eine systematische Erklärung einzufügen oder die Spannung zu anderen biblischen Erfahrungen aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die Furcht Jahwes“ bewahrt den theologischen Ausdruck; „verlängert das Leben“ ist gegenüber dem wörtlichen „fügt Tage hinzu“ im Deutschen natürlicher, während die Fußnote die hebräische Bildsprache offenlegt.
