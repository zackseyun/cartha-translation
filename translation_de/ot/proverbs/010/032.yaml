id: PRO.10.32
reference: Proverbs 10:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׂפְתֵ֣י צַ֭דִּיק יֵדְע֣וּ/ן רָצ֑וֹן וּ/פִ֥י רְ֝שָׁעִ֗ים תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/032.yaml
  text: The lips of the righteous know what is acceptable[b][a], but the mouth of the wicked speaks perversity.
translation:
  language: de
  text: Die Lippen des Gerechten wissen, was gefällt[a]; aber der Mund der Frevler bringt Verkehrtes hervor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was Zustimmung findet«, »was wohlgefällig ist« oder »Gunst«. Das hebräische Wort kann Wohlgefallen, Gunst oder das Annehmbare und Passende bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich nur: »aber der Mund der Frevler — Verkehrtheiten/verkehrte Dinge«. »Bringt … hervor« ist zum besseren Verständnis ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: die Lippen
  rationale: Die konkrete Körperteilbezeichnung bewahrt das poetische Bild und den Parallelismus mit »Mund«.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Der Singular ist generisch gebraucht. Die substantivierte Form gibt ihn knapp und geschlechtsübergreifend im repräsentativen Sinn wieder.
- source_word: יֵדְעוּן
  choice: wissen
  rationale: Die Übersetzung wahrt die Grundbedeutung des Verbs; der Zusammenhang legt ein Wissen darum nahe, was in der Rede gefällt, ohne dies ausdrücklich zu paraphrasieren.
- source_word: רָצוֹן
  choice: was gefällt
  rationale: Das Substantiv kann Wohlgefallen, Gunst oder das Annehmbare bezeichnen. Im Zusammenhang bezeichnet es am ehesten das, was in der Rede wohlgefällig beziehungsweise passend ist; die Fußnote erhält die weitere Bedeutungsbreite.
- source_word: וּפִי
  choice: aber der Mund
  rationale: »Mund« bewahrt den konkreten Parallelismus; das deutsche »aber« macht den im Zusammenhang klaren Gegensatz natürlich sichtbar.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Der hebräische Plural bezeichnet die Klasse moralisch schuldiger, verwerflich handelnder Menschen. »Frevler« ist in der Weisheitsliteratur prägnant und würdevoll.
- source_word: תַּהְפֻּכוֹת
  choice: Verkehrtes
  rationale: Das Wort bezeichnet Verdrehungen oder verkehrte Dinge. Die substantivierte Form erhält die Unbestimmtheit des hebräischen Ausdrucks und vermeidet eine unnötige Einengung auf bloßen Betrug.
