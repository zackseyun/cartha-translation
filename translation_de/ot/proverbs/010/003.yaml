source:
  edition: WLC
  text: לֹֽא יַרְעִ֣יב יְ֭הוָה נֶ֣פֶשׁ צַדִּ֑יק וְ/הַוַּ֖ת רְשָׁעִ֣ים יֶהְדֹּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/003.yaml
  text: Yahweh will not let the righteous person go hungry[a], but he drives away the craving of the wicked.
translation:
  language: de
  text: Jahwe lässt einen Gerechten nicht hungern, doch das Verlangen der Frevler stößt er zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doch das Unheil der Frevler stößt er zurück.“ Das hebräische Substantiv kann als „Verlangen/Begehren“ oder als „Verderben/Unheil“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יַרְעִיב
  choice: lässt … nicht hungern
  rationale: Das Hifil von רעב bezeichnet das Verursachen von Hunger. Die deutsche Wendung gibt den kausativen Sinn natürlich wieder, ohne ihn zu „verhungern lassen“ zu verschärfen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נֶפֶשׁ צַדִּיק
  choice: einen Gerechten
  rationale: נֶפֶשׁ bezeichnet hier den lebenden Menschen, nicht eigens eine vom Körper getrennte „Seele“. Im Deutschen bringt die substantivische Personenbezeichnung den Sinn knapp und natürlich zum Ausdruck.
- source_word: הַוַּת
  choice: das Verlangen
  rationale: Im Gegensatz zum Hungern liegt die Bedeutung „Verlangen/Begehren“ nahe. Da das Substantiv auch als „Verderben/Unheil“ verstanden werden kann, wird diese echte Mehrdeutigkeit in der Fußnote bewahrt.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: „Frevler“ ist eine knappe, würdige Bezeichnung für Menschen, die schuldhaft und gottwidrig handeln; der Plural des Hebräischen bleibt erhalten.
- source_word: יֶהְדֹּף
  choice: weist er zurück
  rationale: Das Verb bedeutet wegstoßen, abweisen oder zurückdrängen. „weist … zurück“ erhält dieses Bild und passt sowohl zum Verlangen als auch zur alternativen Deutung „Unheil“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen. Die Übersetzung bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נֶפֶשׁ
  choice: als Bezeichnung des ganzen Menschen, in „einen Gerechten“ aufgenommen
  alternative: die Seele des Gerechten
  rationale: Der Vers macht keine ausdrückliche anthropologische Unterscheidung zwischen Seele und Körper; gemeint ist der Gerechte als lebender Mensch.
- issue: Bedeutung von הַוַּת רְשָׁעִים
  choice: das Verlangen der Frevler
  alternative: das Verderben/Unheil der Frevler
  rationale: Der Gegensatz zum Hungern spricht für „Verlangen“, doch der lexikalisch mögliche Unheils-Sinn darf nicht stillschweigend ausgeschlossen werden und erscheint deshalb in der Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdig-knapper Spruchform. Die Satzstellung „weist er zurück“ hebt den Gegensatz hervor. Der Fußnotenmarker steht unmittelbar bei der tatsächlich mehrdeutigen zweiten Vershälfte.
