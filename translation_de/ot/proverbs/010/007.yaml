  text: זֵ֣כֶר צַ֭דִּיק לִ/בְרָכָ֑ה וְ/שֵׁ֖ם רְשָׁעִ֣ים יִרְקָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/007.yaml
  text: The memory of the righteous is a blessing[a], but the name of the wicked will rot.
translation:
  language: de
  text: Die Erinnerung an einen Gerechten ist ein Segen[a], aber der Name der Frevler wird verrotten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Gedenken an einen Gerechten dient zum Segen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵכֶר
  choice: Erinnerung
  rationale: Das Substantiv bezeichnet Erinnerung oder Gedenken. »Erinnerung« ist modernes, natürliches Deutsch und bildet einen treffenden Gegensatz zu »Name«.
- source_word: צַדִּיק
  choice: einen Gerechten
  rationale: Das Adjektiv wird substantivisch gebraucht und bezeichnet allgemein einen gerechten Menschen. Der Singular des Hebräischen bleibt gewahrt.
- source_word: לִבְרָכָה
  choice: ist ein Segen
  rationale: Wörtlich steht »zum Segen« beziehungsweise »für einen Segen«. Die prädikative Wiedergabe ist im Deutschen natürlich und bewahrt die knappe Wertung des Spruchs.
- source_word: שֵׁם
  choice: Name
  rationale: »Name« ist die direkte Entsprechung und lässt die mitgemeinten Aspekte von Ruf und Nachwirkung offen.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Das substantivierte Pluraladjektiv bezeichnet Menschen, die moralisch schuldig und böse handeln. »Frevler« ist in der Weisheitsliteratur prägnant und vermeidet eine unnötige religiöse Verengung.
- source_word: יִרְקָב
  choice: wird verrotten
  rationale: Das Verb bezeichnet konkret das Faulen oder Verrotten. Die Wiedergabe erhält das drastische Bild, statt es zu »vergehen« abzuschwächen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen Parallelstruktur eines Weisheitsspruchs. Das konkrete Bild des Verrottens und die Spannung zwischen Erinnerung und Name bleiben erhalten.
