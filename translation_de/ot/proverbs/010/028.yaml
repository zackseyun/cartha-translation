source:
  edition: WLC
  text: תּוֹחֶ֣לֶת צַדִּיקִ֣ים שִׂמְחָ֑ה וְ/תִקְוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/028.yaml
  text: The expectation of the righteous is joy[a], but the hope of the wicked will perish.
translation:
  language: de
  text: Die Erwartung[a] der Gerechten bringt Freude, aber die Hoffnung der Frevler vergeht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hoffnung“. Im ersten und zweiten Halbvers stehen im Hebräischen verschiedene, bedeutungsnahe Wörter für erwartungsvolles Hoffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: Erwartung
  rationale: Das Substantiv bezeichnet erwartungsvolles, hoffendes Warten. „Erwartung“ bewahrt die lexikalische Variation gegenüber תִקְוָה im zweiten Halbvers.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Der substantivierte Plural bezeichnet Menschen, die gerecht leben; die knappe Form entspricht dem sprichwörtlichen Gegensatz zu den Frevlern.
- source_word: שִׂמְחָה
  choice: Freude
  rationale: „Freude“ gibt die geläufige Bedeutung prägnant und idiomatisch wieder.
- source_word: תִקְוַת
  choice: Hoffnung
  rationale: Das Substantiv bedeutet gewöhnlich „Hoffnung“ und bildet den Gegenpol zur Erwartung der Gerechten.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: „Frevler“ bezeichnet in würdigem, verständlichem Deutsch Menschen, deren Verhalten von Bosheit und Schuld geprägt ist, und erhält den Gegensatz zu den Gerechten.
- source_word: תֹּאבֵד
  choice: vergeht
  rationale: Die Form von אבד bedeutet, dass die Hoffnung zugrunde geht, verschwindet oder zunichtewird. „Vergeht“ ist natürlich und bezieht das Verb eindeutig auf die Hoffnung.
theological_decisions:
- issue: Bezug dessen, was im zweiten Halbvers vergeht
  choice: Die Hoffnung der Frevler vergeht.
  alternative: Der Halbvers könnte weitergehend als Hinweis verstanden werden, dass auch die Frevler selbst zusammen mit ihren Hoffnungen zugrunde gehen.
  rationale: Das feminine Singularverb stimmt grammatisch mit תִקְוַת („Hoffnung“) überein. Daher macht die Übersetzung keine ausdrückliche Aussage über das endgültige Schicksal der Frevler, die über den Satzbau hinausginge.
- issue: Verhältnis von Erwartung und Freude im ersten Halbvers
  choice: „führt zur Freude“
  alternative: „ist Freude“ oder „wird Freude sein“
  rationale: Der knappe hebräische Nominalsatz lässt das Verhältnis offen. „Führt zur Freude“ gibt die resultative Aussage natürlich wieder, ohne Erwartung und Freude schlicht gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, sprichwörtlicher Antithese. „Erwartung“ und „Hoffnung“ bilden die lexikalische Variation des Hebräischen ab; „Gerechte“ und „Frevler“ bewahren den für die Weisheitsliteratur typischen moralischen Klassengegensatz.
