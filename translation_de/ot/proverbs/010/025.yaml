source:
  edition: WLC
  text: כַּ/עֲב֣וֹר ס֭וּפָה וְ/אֵ֣ין רָשָׁ֑ע וְ֝/צַדִּ֗יק יְס֣וֹד עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/025.yaml
  text: When the storm passes[a], the wicked are no more[b], but the righteous are an everlasting foundation.
translation:
  language: de
  text: Wenn der Sturm vorüberzieht[a], sind die Bösen nicht mehr da[b]; die Gerechten aber sind ein Fundament für alle Zeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wenn der Wirbelsturm vorüberzieht“ oder „Während der Sturm vorüberzieht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und kein Böser ist da“. Gemeint ist, dass die Bösen verschwinden oder umkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעֲבוֹר
  choice: Zieht ... vorüber
  rationale: Die Präposition כ mit dem Infinitiv von עבר kann hier eine temporale oder vergleichende Beziehung ausdrücken. Die vorangestellte deutsche Verbkonstruktion gibt den zeitlichen Sinn knapp und sprichwortartig wieder; die mögliche Nuance „während/wie“ wird in der Fußnote offengehalten.
- source_word: סוּפָה
  choice: Sturm
  rationale: סוּפָה bezeichnet einen heftigen Sturm oder Wirbelsturm. „Sturm“ ist im heutigen Deutsch klar und bewahrt das eindrückliche Bild, ohne es unnötig einzuengen.
- source_word: וְאֵין רָשָׁע
  choice: sind die Bösen nicht mehr da
  rationale: Wörtlich steht im Hebräischen im Singular „und kein Böser ist da“. Die deutsche Fassung bringt den resultativen Sinn des Verschwindens idiomatisch zum Ausdruck; eine Fußnote dokumentiert die Form des Ausgangstextes.
- source_word: וְצַדִּיק
  choice: die Gerechten aber
  rationale: Das adversative „aber“ verdeutlicht den Gegensatz im Parallelismus. Der hebräische Singular ist sprichwörtlich-repräsentativ; der deutsche Plural bezeichnet entsprechend die Personengruppe, ohne die Aussage auf Männer zu beschränken.
- source_word: יְסוֹד
  choice: Fundament
  rationale: „Fundament“ gibt die Bedeutung von יְסוֹד direkt wieder und erhält die Metapher der tragenden, beständigen Grundlage.
- source_word: עוֹלָם
  choice: für alle Zeit
  rationale: In Verbindung mit „Fundament“ bezeichnet עוֹלָם wahrscheinlich unbegrenzte oder sehr lange Dauer. „Für alle Zeit“ ist natürliches, starkes Deutsch; die ebenfalls mögliche Bedeutung „Welt“ wird wegen der echten lexikalischen Mehrdeutigkeit in einer Fußnote genannt.
theological_decisions:
- issue: Repräsentativer maskuliner Singular in der Weisheitsliteratur
  choice: Die Personengruppen werden mit „die Bösen“ und „die Gerechten“ wiedergegeben.
  alternative: „der Böse … der Gerechte“
  rationale: Die hebräischen Singularformen formulieren eine allgemeine Wahrheit über Menschengruppen und beschränken die Aussage nicht auf männliche Personen. Der deutsche Plural bewahrt diese repräsentative Funktion.
- issue: Bedeutung von עוֹלָם
  choice: 'Zeitliche Dauer: „für alle Zeit“'
  alternative: 'Räumlich-kosmische Zuordnung: „der Welt“'
  rationale: Der Zusammenhang stellt die Vergänglichkeit der Bösen der bleibenden Festigkeit der Gerechten gegenüber, was die zeitliche Deutung nahelegt. Da עוֹלָם jedoch auch „Welt“ bedeuten kann und dadurch die Aussage „Fundament der Welt“ möglich bleibt, wird diese Lesart nicht ausgeschlossen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, sprichwortartiger Satzstellung. Der Parallelismus und die Fundament-Metapher bleiben erhalten; semantische Mehrdeutigkeiten werden nicht stillschweigend eingeebnet.
