source:
  edition: WLC
  text: מְגוֹרַ֣ת רָ֭שָׁע הִ֣יא תְבוֹאֶ֑/נּוּ וְ/תַאֲוַ֖ת צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/024.yaml
  text: What the wicked dreads will come upon him[b][a], but the desire of the righteous will be granted.
translation:
  language: de
  text: Was der Frevler fürchtet, kommt über ihn[a]; doch der Wunsch der Gerechten wird erfüllt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Die Furcht des Frevlers – sie kommt über ihn.“ Das hebräische Wort kann sowohl die Furcht als auch das Gefürchtete bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: „er wird geben“ oder „er wird gewähren“. Wer handelt, bleibt unausgesprochen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְגוֹרַת
  choice: was … fürchtet
  rationale: Das Substantiv kann die Furcht selbst oder das Gefürchtete bezeichnen. Die Relativkonstruktion gibt hier den konkreten Gegenstand der Furcht klar und idiomatisch wieder.
- source_word: רָשָׁע
  choice: der Frevler
  rationale: Das substantivierte Adjektiv bezeichnet im Spruch einen repräsentativen bösen Menschen. „Frevler“ bewahrt die knappe Gegenüberstellung zu den Gerechten.
- source_word: הִיא תְבוֹאֶנּוּ
  choice: kommt über ihn
  rationale: Das feminine Pronomen nimmt מְגוֹרַת auf; בוא mit dem pronominalen Suffix bezeichnet, dass das Gefürchtete ihn erreicht oder über ihn kommt.
- source_word: וְתַאֲוַת
  choice: doch der Wunsch
  rationale: תַּאֲוָה bedeutet Wunsch, Verlangen oder Sehnsucht. „Doch“ macht den im antithetischen Parallelismus liegenden Gegensatz natürlich sichtbar, obwohl וְ formal auch mit „und“ wiedergegeben werden kann.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Das substantivierte Pluraladjektiv bezeichnet die Gruppe der gerecht Handelnden; die geläufige Wendung „die Gerechten“ erhält den allgemeinen Charakter des Spruchs.
- source_word: יִתֵּן
  choice: wird erfüllt
  rationale: Das aktive Verb bedeutet wörtlich „er wird geben/gewähren“, nennt sein Subjekt jedoch nicht. Die passive Formulierung wahrt diese Offenheit und gibt die Erfüllung des Wunsches idiomatisch wieder.
theological_decisions:
- issue: Unausgesprochenes Subjekt von יִתֵּן
  choice: Der Geber bleibt durch die Passivform „wird erfüllt“ unausgesprochen.
  alternative: „Gott wird ihn erfüllen“ oder wörtlicher „er wird ihn gewähren“.
  rationale: Der hebräische Text nennt Gott nicht ausdrücklich. Göttliches Handeln kann im Kontext der Weisheitsliteratur mitgemeint sein, soll aber nicht gegen die grammatische Offenheit ausdrücklich eingesetzt werden.
translation_notes:
  register: Knappe, spruchhafte Standardsprache. „Frevler“ ist würdevoll und bildet einen klaren moralischen Gegensatz zu „den Gerechten“, ohne einen ausdrücklich theologischen Bezug in רָשָׁע hineinzulesen.
