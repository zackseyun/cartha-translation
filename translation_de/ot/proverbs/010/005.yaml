id: PRO.10.5
reference: Proverbs 10:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֹגֵ֣ר בַּ֭/קַּיִץ בֵּ֣ן מַשְׂכִּ֑יל נִרְדָּ֥ם בַּ֝/קָּצִ֗יר בֵּ֣ן מֵבִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/005.yaml
  text: He who gathers in summer is a prudent son[b][a], but he who sleeps during harvest is a son who brings shame.
translation:
  language: de
  text: Wer im Sommer sammelt, ist ein verständiger Sohn[a]; wer aber während der Ernte schläft, ist ein Sohn, der Schande bringt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort „Sohn“ steht im maskulinen Singular. In den Sprüchen kann es stellvertretend gebraucht sein, bewahrt aber zugleich die Form der Unterweisung eines Sohnes.
    reason: cultural_note
lexical_decisions:
- source_word: אֹגֵר
  choice: sammelt
  rationale: Das Partizip bezeichnet das Einsammeln der Erzeugnisse. „Sammelt“ gibt die Tätigkeit direkt wieder, ohne wie „lagert ein“ das Ergebnis stärker zu spezifizieren.
- source_word: בַּקַּיִץ
  choice: im Sommer
  rationale: Die knappe Zeitangabe bezeichnet die geeignete Jahreszeit für das landwirtschaftliche Sammeln und ist im Deutschen idiomatisch.
- source_word: בֵּן
  choice: Sohn
  rationale: Das Hebräische steht ausdrücklich im maskulinen Singular und bewahrt die für die Sprüche typische Vater-Sohn-Unterweisungsform; die mögliche repräsentative Funktion wird in der Fußnote erläutert.
- source_word: מַשְׂכִּיל
  choice: verständig
  rationale: Das Wort bezeichnet praktische Einsicht, die sich in klugem, zeitgerechtem Handeln zeigt. „Verständig“ ist im Deutschen natürlich und weniger missverständlich als „klug handelnd“.
- source_word: נִרְדָּם
  choice: schläft
  rationale: Das Nifal-Partizip beschreibt denjenigen, der zur unpassenden Zeit schläft; die einfache Präsensform passt zur knappen Spruchform.
- source_word: בַּקָּצִיר
  choice: während der Ernte
  rationale: Die Formulierung macht deutlich, dass gerade in der entscheidenden Arbeitszeit geschlafen wird.
- source_word: מֵבִישׁ
  choice: der Schande bringt
  rationale: 'Das Hifil-Partizip hat kausative Bedeutung: Der Sohn verursacht Schande. Die Relativkonstruktion bewahrt diese Nuance besser als das bloße Adjektiv „schändlich“.'
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper, parallel gebauter Spruchform. Die landwirtschaftlichen Zeitangaben und der Gegensatz zwischen verständigem Handeln und beschämender Untätigkeit bleiben unmittelbar erkennbar.
