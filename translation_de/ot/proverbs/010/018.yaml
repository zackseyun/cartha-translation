source:
  edition: WLC
  text: מְכַסֶּ֣ה שִׂ֭נְאָה שִׂפְתֵי שָׁ֑קֶר וּ/מוֹצִ֥א דִ֝בָּ֗ה ה֣וּא כְסִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/018.yaml
  text: Lying lips conceal hatred[b][a], and whoever spreads slander is a fool.
translation:
  language: de
  text: Lügenlippen verbergen Hass[a], und wer üble Nachrede verbreitet[b], ist ein Narr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer Hass verbirgt, hat Lügenlippen.“ Die knappe hebräische Wortstellung lässt auch diese Zuordnung von Subjekt und Aussage zu.'
    reason: syntactic_alternative
  - marker: b
    text: 'Wörtlicher: „wer einen schlechten Bericht hervorbringt“. Gemeint kann allgemein das Äußern oder Weitertragen eines schädigenden Berichts sein, nicht nur eine nachweislich falsche Verleumdung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: verbergen
  rationale: Das Partizip von כסה bezeichnet ein Bedecken oder Verbergen. „Verbergen“ gibt hier natürlich wieder, dass Hass durch unwahre Rede verborgen gehalten wird.
- source_word: שִׂנְאָה
  choice: Hass
  rationale: Das Substantiv bezeichnet Hass oder Feindschaft; „Hass“ ist die knappe und unmittelbare deutsche Entsprechung.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: Lügenlippen
  rationale: Die Wendung bedeutet wörtlich „Lippen der Lüge/Falschheit“. „Lügenlippen“ bewahrt das Körperbild und klingt in einem knappen Weisheitsspruch würdig und verständlich.
- source_word: וּמוֹצִא
  choice: und wer … verbreitet
  rationale: Das Hifil-Partizip von יצא bedeutet wörtlich „herausbringen“. In Verbindung mit דבה bezeichnet es das Äußern oder Weitertragen eines schädlichen Berichts; „verbreitet“ gibt diese Handlung idiomatisch wieder.
- source_word: דִבָּה
  choice: üble Nachrede
  rationale: דבה bezeichnet einen schlechten, schädigenden Bericht und kann verleumderische Rede meinen. „Üble Nachrede“ erhält den negativen Rufschädigungscharakter, ohne zwingend zu behaupten, der Bericht sei nachweislich falsch.
- source_word: הוּא כְסִיל
  choice: ist ein Narr
  rationale: כסיל ist in den Sprüchen ein fester Weisheitsbegriff für einen moralisch uneinsichtigen Menschen. „Narr“ bewahrt diesen kategorialen und nicht bloß intellektuellen Sinn.
theological_decisions: []
translation_notes:
  register: Knappes, parallel gebautes Sprichwort in modernem Standarddeutsch. „Lügenlippen“ bewahrt das hebräische Bild; „Narr“ hält den in den Sprüchen wiederkehrenden moralischen Weisheitsbegriff fest.
