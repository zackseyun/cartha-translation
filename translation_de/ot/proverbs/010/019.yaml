  text: בְּ/רֹ֣ב דְּ֭בָרִים לֹ֣א יֶחְדַּל פָּ֑שַׁע וְ/חֹשֵׂ֖ךְ שְׂפָתָ֣י/ו מַשְׂכִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/019.yaml
  text: When words are many[a], transgression does not cease[b], but whoever restrains his lips is prudent.
translation:
  language: de
  text: Bei vielen Worten bleibt Verfehlung nicht aus,[a] doch wer seine Lippen zurückhält, handelt verständig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „In der Fülle der Worte hört Verfehlung nicht auf.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב דְּבָרִים
  choice: Bei vielen Worten
  rationale: Die Verbindung bezeichnet die große Menge des Gesagten. „Bei vielen Worten“ gibt den Umstand knapp, natürlich und sprichwörtlich wieder.
- source_word: לֹא יֶחְדַּל
  choice: bleibt … nicht aus
  rationale: Das negierte Verb חדל bedeutet wörtlich „hört nicht auf“ beziehungsweise „fehlt nicht“. Die deutsche Wendung „bleibt nicht aus“ vermittelt idiomatisch, dass Verfehlung bei übermäßigem Reden unweigerlich vorkommt, ohne die Aussage näher zu bestimmen.
- source_word: פָּשַׁע
  choice: Verfehlung
  rationale: Das Substantiv bezeichnet eine schuldhafte Übertretung oder Auflehnung. „Verfehlung“ bewahrt das moralische Gewicht und klingt im heutigen Deutsch natürlicher als „Übertretung“.
- source_word: וְחֹשֵׂךְ
  choice: doch wer … zurückhält
  rationale: Das Partizip bezeichnet jemanden, der etwas zurückhält oder zügelt. Das verbindende ו wird wegen des deutlichen Gegensatzes der beiden Vershälften mit „doch“ wiedergegeben.
- source_word: שְׂפָתָיו
  choice: seine Lippen
  rationale: Die wörtliche Körpermetapher für beherrschtes Reden ist auch im Deutschen verständlich und bewahrt das Bild des Hebräischen.
- source_word: מַשְׂכִּיל
  choice: handelt verständig
  rationale: Das Hifil-Partizip von שׂכל kann einsichtiges, kluges oder umsichtiges Handeln bezeichnen. „Handelt verständig“ erhält den handlungsbezogenen Sinn und passt zum Verhalten, das der zweite Halbvers beschreibt.
theological_decisions: []
translation_notes:
  register: Knappes, einprägsames Sprichwort in modernem Standarddeutsch. Die parallele Gegenüberstellung und das hebräische Bild der zurückgehaltenen Lippen bleiben erhalten; „wer“ formuliert die Aussage allgemein und ohne unnötige geschlechtliche Festlegung.
