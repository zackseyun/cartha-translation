  text: כַּ/חֹ֤מֶץ לַ/שִּׁנַּ֗יִם וְ/כֶ/עָשָׁ֥ן לָ/עֵינָ֑יִם כֵּ֥ן הֶ֝/עָצֵ֗ל לְ/שֹׁלְחָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/026.yaml
  text: Like vinegar to the teeth and smoke to the eyes[a], so is the sluggard to those who send him.
translation:
  language: de
  text: Wie Essig für die Zähne und Rauch für die Augen, so ist der Faule für diejenigen, die ihn schicken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֹמֶץ
  choice: Essig
  rationale: Das Substantiv bezeichnet eine saure Flüssigkeit, häufig Essig. „Essig“ gibt den scharfen, unangenehmen Sinneseindruck im Deutschen natürlich wieder.
- source_word: לַשִּׁנַּיִם
  choice: für die Zähne
  rationale: Die Präposition ל bezeichnet hier die Beziehung beziehungsweise Wirkung. „Für die Zähne“ fügt sich natürlich in die deutsche Vergleichsform.
- source_word: עָשָׁן
  choice: Rauch
  rationale: Direkte lexikalische Entsprechung; das Bild setzt die Reizung der Augen durch Rauch voraus.
- source_word: לָעֵינַיִם
  choice: für die Augen
  rationale: Parallel zu „für die Zähne“ bezeichnet die Form den betroffenen Bereich und bewahrt den Parallelismus.
- source_word: כֵּן
  choice: so ist
  rationale: Die Vergleichspartikel leitet die Anwendung der beiden Bilder ein; „so ist“ ergänzt die im Hebräischen ausgelassene Kopula idiomatisch.
- source_word: הֶעָצֵל
  choice: der Faule
  rationale: Das substantivierte Adjektiv bezeichnet einen gewohnheitsmäßig trägen Menschen. „Der Faule“ ist verständlich, knapp und bewahrt den Charaktertyp der Spruchliteratur.
- source_word: לְשֹׁלְחָיו
  choice: für die, die ihn schicken
  rationale: Das Partizip mit dem Suffix der 3. Person Singular meint diejenigen, die ihn aussenden. Die Formulierung erhält sowohl deren Mehrzahl als auch den männlichen Singular als Objekt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, bildhafter Spruchstruktur. Der Parallelismus des Hebräischen bleibt erhalten; auf eine Fußnote zu „saurem Wein“ wird verzichtet, da „Essig“ die übliche und hinreichend genaue deutsche Wiedergabe ist.
