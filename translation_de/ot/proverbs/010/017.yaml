id: PRO.10.17
reference: Proverbs 10:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֹ֣רַח לְ֭/חַיִּים שׁוֹמֵ֣ר מוּסָ֑ר וְ/עוֹזֵ֖ב תּוֹכַ֣חַת מַתְעֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/017.yaml
  text: Whoever keeps discipline is on the path to life[a], but whoever forsakes reproof leads others astray.
translation:
  language: de
  text: Wer an Unterweisung festhält, ist auf dem Weg zum Leben[a]; wer aber Zurechtweisung verwirft, führt andere in die Irre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist ein Weg zum Leben“. Der knappe hebräische Satz lässt „Weg zum Leben“ auch als Prädikatsausdruck verstehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח
  choice: Weg
  rationale: אֹרַח bezeichnet einen Weg oder Lebenswandel. „Weg“ bewahrt das in den Sprüchen häufige Bild für die moralische Lebensrichtung.
- source_word: לְחַיִּים
  choice: zum Leben
  rationale: Die Präposition לְ bezeichnet hier am ehesten Richtung oder Ziel. „Zum Leben“ gibt diese Zielrichtung knapp und idiomatisch wieder.
- source_word: שׁוֹמֵר
  choice: festhält
  rationale: Das Partizip bezeichnet ein fortdauerndes Bewahren oder Beachten. In Verbindung mit Unterweisung drückt „festhält“ beständige Orientierung daran natürlich aus.
- source_word: מוּסָר
  choice: Unterweisung
  rationale: מוּסָר umfasst in der Weisheitsliteratur erziehende Anleitung, Schulung und korrigierende Disziplin. „Unterweisung“ ist im modernen Deutsch verständlich und vermeidet die mögliche Verengung von „Zucht“ auf Bestrafung.
- source_word: וְעוֹזֵב
  choice: wer aber … verwirft
  rationale: Die Konjunktion stellt einen Gegensatz her. עזב bedeutet verlassen oder aufgeben; „verwirft“ bringt hier die bewusste Abkehr von Korrektur prägnant zum Ausdruck.
- source_word: תּוֹכַחַת
  choice: Zurechtweisung
  rationale: תּוֹכַחַת bezeichnet korrigierenden Tadel oder eine Zurechtweisung. Die gewählte Formulierung wahrt sowohl den verbalen als auch den erzieherischen Charakter.
- source_word: מַתְעֶה
  choice: führt andere in die Irre
  rationale: 'Das Hifil-Partizip von תעה ist kausativ: Es bezeichnet das Irreführen, nicht lediglich eigenes Irren. „Andere“ macht das im Hebräischen unausgedrückte Objekt im Deutschen verständlich.'
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und das Wegbild bleiben erhalten; missverständliches oder altertümliches „Zucht“ wird durch das breiter verständliche „Unterweisung“ wiedergegeben.
