  text: שִׂ֭נְאָה תְּעוֹרֵ֣ר מְדָנִ֑ים וְ/עַ֥ל כָּל פְּ֝שָׁעִ֗ים תְּכַסֶּ֥ה אַהֲבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/012.yaml
  text: Hatred stirs up conflicts[b][a], but love covers all transgressions.
translation:
  language: de
  text: Hass schürt Streit, aber Liebe deckt alle Vergehen zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Und über alle Vergehen deckt Liebe zu.“ Die Metapher des Zudeckens kann besagen, dass Liebe Vergehen nicht aufdeckt oder weiterträgt; sie verwendet nicht ausdrücklich das Wort „vergeben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂנְאָה
  choice: Hass
  rationale: Das abstrakte Substantiv steht als Subjekt und bildet den direkten, natürlichen Gegensatz zu „Liebe“.
- source_word: תְּעוֹרֵר
  choice: schürt
  rationale: Die Polel-Form bezeichnet ein aktives Hervorrufen oder Anfachen; „schürt“ ist im Deutschen idiomatisch und passt besonders zu Streit.
- source_word: מְדָנִים
  choice: Streit
  rationale: Das pluralische hebräische Wort bezeichnet Auseinandersetzungen und Zwistigkeiten. Das deutsche Kollektivum „Streit“ gibt den Sinn knapp und natürlich wieder.
- source_word: וְ/עַל
  choice: aber … zu
  rationale: Die Präposition עַל gehört zur Wendung „über alle Vergehen zudecken“, während וְ im antithetischen Parallelismus natürlich mit „aber“ wiedergegeben wird.
- source_word: כָּל
  choice: alle
  rationale: Die umfassende Quantifizierung des hebräischen Textes bleibt erhalten.
- source_word: פְּשָׁעִים
  choice: Vergehen
  rationale: Das Wort bezeichnet schuldhafte Übertretungen oder Auflehnung. „Vergehen“ bewahrt das moralische Gewicht, ohne den sozialen Kontext enger festzulegen.
- source_word: תְּכַסֶּה
  choice: deckt … zu
  rationale: Die konkrete Metapher des Bedeckens wird bewahrt. Die trennbare Form „deckt … zu“ ist in diesem Satz natürlich und bildet zusammen mit עַל die hebräische Vorstellung ab.
- source_word: אַהֲבָה
  choice: Liebe
  rationale: Die direkte deutsche Entsprechung erhält den ethischen Gegensatz zu „Hass“.
theological_decisions:
- issue: Bedeutung von „Liebe deckt alle Vergehen zu“
  choice: 'Die Metapher des Zudeckens bleibt stehen: Liebe stellt Vergehen nicht heraus und facht den daraus entstehenden Streit nicht weiter an.'
  alternative: „Liebe vergibt alle Sünden“ oder „Liebe verbirgt jedes Unrecht ungeachtet der Gerechtigkeit“.
  rationale: Der hebräische Text spricht ausdrücklich vom Bedecken, nicht mit einem eindeutigen Verb für Vergeben. Die Wiedergabe bewahrt deshalb die Spannung und legt weder eine spezielle Aussage über Sühne hinein noch fordert sie dazu auf, Unrecht grundsätzlich zu vertuschen.
translation_notes:
  register: Knappe, einprägsame Spruchform in modernem Standarddeutsch. „Hass“, „Streit“, „Liebe“ und „Vergehen“ sind allgemein verständlich; die konkrete Metapher „zudecken“ bleibt erhalten.
