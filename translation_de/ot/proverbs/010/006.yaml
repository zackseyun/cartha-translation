  text: בְּ֭רָכוֹת לְ/רֹ֣אשׁ צַדִּ֑יק וּ/פִ֥י רְ֝שָׁעִ֗ים יְכַסֶּ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/006.yaml
  text: Blessings are on the head of the righteous, but the mouth of the wicked covers violence.
translation:
  language: de
  text: 'Segen ruht auf dem Haupt des Gerechten,

    aber der Mund der Gottlosen bedeckt Gewalttat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aber Gewalttat bedeckt den Mund der Gottlosen.“'
    reason: Die hebräische Syntax lässt beide Zuordnungen zu. Die alternative Lesung wird zudem durch den ähnlichen zweiten Halbvers in Sprüche 10,11 gestützt.
lexical_decisions:
- source_word: בְּרָכוֹת
  choice: Segen
  rationale: Der hebräische Plural bezeichnet Segensgaben bzw. reichen Segen; im Deutschen gibt der gebräuchliche Kollektivsingular „Segen“ dies natürlich und würdig wieder.
- source_word: לְרֹאשׁ
  choice: ruht auf dem Haupt
  rationale: Die Präposition bezeichnet hier die Lage bzw. Zuwendung auf das Haupt hin. „Ruht auf“ macht den verblosen hebräischen Satz im Deutschen idiomatisch, ohne eine zusätzliche Ursache einzutragen.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Die traditionelle und sachlich genaue Wiedergabe bezeichnet einen Menschen, dessen Handeln dem Rechten entspricht.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: Der Plural bezeichnet schuldige, moralisch verwerflich handelnde Menschen. „Gottlose“ ist im weisheitlichen Register geläufig, ohne den Ausdruck bloß auf theoretischen Atheismus zu beschränken.
- source_word: יְכַסֶּה
  choice: bedeckt
  rationale: Die Grundbedeutung ist „bedecken“. Die Übersetzung bewahrt die ungewöhnliche und möglicherweise bewusst mehrdeutige Aussage, statt sie eindeutig als „verbirgt“ bzw. „verheimlicht“ auszulegen.
- source_word: חָמָס
  choice: Gewalttat
  rationale: Das Wort umfasst Gewalt, Unrecht und gewaltsames Fehlverhalten. Der Singular „Gewalttat“ erhält die knappe Bildsprache.
theological_decisions:
- issue: Beziehung zwischen dem Mund der Gottlosen und der Gewalttat
  choice: „der Mund der Gottlosen bedeckt Gewalttat“
  alternative: „Gewalttat bedeckt den Mund der Gottlosen“
  rationale: Der masoretisch vokalisierte Text macht „der Mund“ zum Subjekt und „Gewalttat“ zum Objekt. Die alternative Deutung kann durch den parallelen Wortlaut in Sprüche 10,11 und mögliche poetische Symmetrie nahegelegt werden, wird hier aber nicht in den Haupttext übernommen.
- issue: Bedeutung von „bedeckt“
  choice: Die konkrete Metapher bleibt stehen.
  alternative: „verbirgt/verheimlicht“
  rationale: Eine interpretierende Wiedergabe als Verheimlichen wäre möglich, würde die semantische Offenheit des hebräischen Verbs jedoch einschränken.
translation_notes:
  register: Moderne, verständliche Standardsprache mit bewusst würdigem Weisheitsstil. „Haupt“ statt „Kopf“ erhält das Segensbild und den poetischen Parallelismus; „bedeckt“ bewahrt die Härte und Mehrdeutigkeit des Originals.
