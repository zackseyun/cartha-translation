  text: חֲכַם לֵ֭ב יִקַּ֣ח מִצְוֺ֑ת וֶ/אֱוִ֥יל שְׂ֝פָתַ֗יִם יִלָּבֵֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/008.yaml
  text: A wise-hearted man accepts commands[a], but a foolish man of lips will come to ruin.
translation:
  language: de
  text: Wer ein weises Herz hat, nimmt Gebote an; ein geschwätziger Narr wird zu Fall kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »ein Narr der Lippen wird niedergeworfen«. Das letzte Verb ist selten und in seiner genauen Bedeutung unsicher; es kann bedeuten, dass jemand zu Fall kommt, niedergeworfen wird oder zugrunde geht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: wer ein weises Herz hat
  rationale: Die Wendung bedeutet wörtlich »weise des Herzens«. Die deutsche Formulierung bewahrt das Herzbild und macht zugleich deutlich, dass das Herz im Hebräischen auch Denken und Wollen umfasst.
- source_word: יִקַּח
  choice: nimmt … an
  rationale: Das Verb bedeutet grundsätzlich »nehmen«; zusammen mit »Geboten« bezeichnet es hier deren bereitwillige Annahme.
- source_word: מִצְוֺת
  choice: Gebote
  rationale: Das Wort bezeichnet verbindliche Anweisungen. »Gebote« bewahrt deren autoritativen Charakter und ist in einem biblischen Weisheitsspruch natürlich.
- source_word: אֱוִיל
  choice: töricht
  rationale: Das Substantiv bezeichnet einen moralisch und praktisch törichten Menschen. Die attributive Wiedergabe in der deutschen Relativkonstruktion erhält den Gegensatz, ohne die Aussage zu einem bloßen Schimpfwort zu machen.
- source_word: שְׂפָתַיִם
  choice: Lippen
  rationale: 'Die wörtliche Bildsprache wird bewahrt: Der törichte Mensch wird durch seine Rede charakterisiert.'
- source_word: יִלָּבֵט
  choice: kommt zu Fall
  rationale: Das seltene und schwierige Verb bezeichnet wahrscheinlich das Niedergeworfenwerden oder den daraus folgenden Untergang. »Kommt zu Fall« klingt natürlich und lässt beide Bedeutungsnuancen anklingen.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil mit bewahrtem hebräischem Herz- und Lippenbild. Die parallelen Relativsätze vermeiden eine unnötige geschlechtliche Festlegung, die das generische maskuline Singularprofil des hebräischen Weisheitsspruchs im Deutschen missverständlich verengen würde.
