  source_fidelity: Der erste Halbvers gibt חֲכַם־לֵב und die Annahme von מִצְוֺת zutreffend wieder. Im zweiten Halbvers ist jedoch nicht von »törichten Lippen« die Rede, sondern von einem אֱוִיל, der durch seine Lippen bzw. sein Reden gekennzeichnet ist. »Kommt zu Fall« ist als Wiedergabe des seltenen יִלָּבֵט vertretbar; die Fußnote muss die Unsicherheit idiomatisch und präzise beschreiben.
  naturalness: »Wer ein weises Herz hat« und »nimmt Gebote an« sind klares, würdiges modernes Standarddeutsch. »Wer aber törichte Lippen hat« ist zwar formal verständlich, klingt jedoch unnatürlich und legt die Torheit den Lippen statt der Person bei. »Ein geschwätziger Narr« ist idiomatisch und gibt die durch die Rede geprägte Person wieder.
  terminology: »Gebote« ist für מִצְוֺת angemessen. »Narr« gibt אֱוִיל im Weisheitskontext natürlich wieder, ohne den Ausdruck zu einer bloßen Beschimpfung abzuschwächen. »Geschwätzig« entfaltet die hebräische Verbindung mit »Lippen« leicht interpretierend, aber sachgerecht; die Fußnote hält die wörtlichere und unsichere Alternative offen.
