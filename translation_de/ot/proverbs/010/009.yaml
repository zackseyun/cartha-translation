base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/009.yaml
  text: Whoever walks in integrity walks securely[a], but he who makes his ways crooked will be found out.
translation:
  language: de
  text: Wer seinen Weg in Lauterkeit geht, geht sicher; wer aber seine Wege krumm macht, wird erkannt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird bekannt«, »wird offenbar« oder »wird entlarvt«. Das Hebräische kann bedeuten, dass derjenige, der seine Wege krumm macht, erkannt wird, oder dass sein Verhalten aufgedeckt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: Wer … lebt
  rationale: Das Partizip bezeichnet allgemein und sprichwörtlich die beständige Lebensführung. »Lebt« gibt diese übertragene Bedeutung im Deutschen natürlich wieder; die Wegmetaphorik bleibt im zweiten Halbvers und durch »geht« erhalten.
- source_word: בַּתֹּם
  choice: in Lauterkeit
  rationale: תֹּם bezeichnet Ganzheit, Redlichkeit und charakterliche Integrität. »Lauterkeit« bewahrt die substantivische Form und vermeidet den möglicherweise absolut klingenden Ausdruck »untadelig«.
- source_word: יֵלֶךְ
  choice: geht
  rationale: Die wörtliche Bewegungsmetapher wird beibehalten und bildet mit der allgemeinen Lebensführung im ersten Satzteil eine natürliche deutsche Wendung.
- source_word: בֶּטַח
  choice: sicher
  rationale: בֶּטַח bezeichnet Sicherheit oder Geborgenheit. »Sicher« kann sowohl objektiven Schutz als auch unbedrohtes Vorankommen ausdrücken, ohne den Akzent einseitig auf ein subjektives Selbstvertrauen zu legen.
- source_word: וּמְעַקֵּשׁ
  choice: wer aber … krümmt
  rationale: Das Partizip von עקשׁ bezeichnet das Krümmen, Verdrehen oder Verkehrtmachen. »Krümmt« bewahrt das anschauliche Gegenbild zur geraden, lauteren Lebensführung.
- source_word: דְּרָכָיו
  choice: seine Wege
  rationale: Der Plural und die hebräische Wegmetaphorik für Lebensführung und Verhalten bleiben unmittelbar erhalten.
- source_word: יִוָּדֵעַ
  choice: wird erkannt
  rationale: Der Nifal von ידע kann »bekannt/erkannt werden« und im Zusammenhang auch »aufgedeckt/entlarvt werden« bedeuten. Die knappe Wiedergabe bewahrt diese Offenheit; die Fußnote nennt die naheliegenden Alternativen.
theological_decisions:
- issue: Art der zugesagten Sicherheit
  choice: Die Aussage bleibt allgemein als »geht sicher« formuliert.
  alternative: Eine ausdrückliche Zusage völliger äußerer Unversehrtheit.
  rationale: Der Vers nennt weder die genaue Art noch den Umfang der Sicherheit. Die Übersetzung soll daher keine umfassende Leidensfreiheit oder eine ausschließlich innere Zuversicht hineinlesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in knapper Spruchform. »Lauterkeit« ist gehoben, aber allgemein verständlich und entspricht dem ethischen Gewicht des hebräischen Ausdrucks. Das Semikolon bildet den antithetischen Parallelismus ab.
