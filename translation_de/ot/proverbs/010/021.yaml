id: PRO.10.21
reference: Proverbs 10:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׂפְתֵ֣י צַ֭דִּיק יִרְע֣וּ רַבִּ֑ים וֶֽ֝/אֱוִילִ֗ים בַּ/חֲסַר לֵ֥ב יָמֽוּתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/021.yaml
  text: The lips of the righteous feed many[b][a], but fools die for lack of sense.
translation:
  language: de
  text: Die Lippen des Gerechten nähren viele[a], doch Narren sterben aus Mangel an Einsicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »weiden« beziehungsweise »versorgen«; das hebräische Verb kann auch das Hüten oder Weiden einer Herde bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »durch Mangel an Herz«. Das Herz steht im Hebräischen häufig für Verstand, Urteilsfähigkeit oder Einsicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: Die Lippen des
  rationale: Die wörtliche Körpermetapher bleibt erhalten; zugleich werden die Lippen im Spruch als Bild für das Reden verstanden.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet hier einen repräsentativen gerechten Menschen. Der Singular und die prägnante Form des Hebräischen bleiben gewahrt.
- source_word: יִרְעוּ
  choice: nähren
  rationale: Das Verb רעה kann weiden, hüten oder ernähren bedeuten. Bei »Lippen« als Subjekt gibt »nähren« die Wirkung lebensfördernder Rede natürlich wieder und bewahrt die Metapher.
- source_word: רַבִּים
  choice: viele
  rationale: Die substantivische Bedeutung »viele« wird ohne die im Hebräischen unausgesprochene Ergänzung »Menschen« wiedergegeben.
- source_word: אֱוִילִים
  choice: Narren
  rationale: Der Ausdruck bezeichnet in der Weisheitsliteratur nicht bloß Unwissende, sondern uneinsichtige und moralisch verstockte Menschen. »Narren« ist dafür die treffende, etablierte Bezeichnung.
- source_word: בַּחֲסַר לֵב
  choice: aus Mangel an Einsicht
  rationale: Wörtlich steht »bei/durch Mangel an Herz«. Das Herz bezeichnet im Hebräischen häufig Verstand, Urteilsfähigkeit und Einsicht; die gewählte Formulierung gibt diesen idiomatischen Sinn in modernem Deutsch wieder.
- source_word: יָמוּתוּ
  choice: sterben
  rationale: Die Grundbedeutung des Verbs wird beibehalten, statt sie abschwächend als bloßes Scheitern oder Verderben wiederzugeben. Das Präsens passt zum allgemeinen Charakter des Spruchs.
theological_decisions:
- issue: Reichweite des Todesbegriffs
  choice: sterben
  alternative: zugrunde gehen
  rationale: Der hebräische Text sagt ausdrücklich »sterben«. Ob darüber hinaus leiblicher Tod, allgemeiner Untergang oder beides mitschwingt, wird nicht dogmatisch festgelegt.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der Parallelismus und das Bild der Lippen bleiben erhalten; die ungewöhnliche Hirtenmetapher wird mit »nähren« verständlich wiedergegeben und in der Fußnote transparent gemacht.
