id: PRO.10.4
reference: Proverbs 10:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רָ֗אשׁ עֹשֶׂ֥ה כַף רְמִיָּ֑ה וְ/יַ֖ד חָרוּצִ֣ים תַּעֲשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/004.yaml
  text: A slack hand makes one poor[a], but the hand of the diligent makes rich.
translation:
  language: de
  text: 'Eine nachlässige Hand macht arm[a],

    aber die Hand der Fleißigen macht reich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Eine betrügerische Hand macht arm.« רְמִיָּה kann an anderen Stellen Betrug oder Täuschung bezeichnen; im Zusammenhang dieses Arbeitsspruchs liegt jedoch die Bedeutung »nachlässig« oder »träge« näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשׁ
  choice: arm
  rationale: Das Wort bezeichnet hier das Ergebnis nachlässiger Arbeit und steht im antithetischen Parallelismus zu »reich«. Die prädikative Wendung »macht arm« gibt die Aussage im Deutschen klar und knapp wieder.
- source_word: עֹשֶׂה
  choice: macht
  rationale: Das Partizip von עשה drückt hier aus, dass die beschriebene Handlungsweise ein Ergebnis herbeiführt. »Macht« bewahrt diese kausative Wirkung und die Parallelität zur zweiten Vershälfte.
- source_word: כַף
  choice: Hand
  rationale: Obwohl כַף genauer die Handfläche bezeichnen kann, steht das Wort hier für die Hand als Werkzeug der Arbeit. »Hand« ist im Deutschen das natürliche Bild.
- source_word: רְמִיָּה
  choice: nachlässig
  rationale: Im Zusammenhang eines Spruchs über Arbeit bezeichnet das Wort am ehesten mangelnden Eifer oder säumiges Handeln. »Nachlässig« ist modernes, verständliches Deutsch und vermeidet die heute missverständliche Färbung von »lässig«.
- source_word: יָד
  choice: Hand
  rationale: Die konkrete Körpermetapher wird in der zweiten Vershälfte wiederholt und trägt den antithetischen Parallelismus.
- source_word: חָרוּצִים
  choice: der Fleißigen
  rationale: Die substantivierte Mehrzahl bezeichnet Menschen, die sich durch Eifer und Beharrlichkeit bei der Arbeit auszeichnen. Der Genitiv bewahrt das hebräische Bild »Hand der Fleißigen«.
- source_word: תַּעֲשִׁיר
  choice: macht reich
  rationale: 'Der Hifil von עשר ist kausativ: reich machen. Die Formulierung entspricht der ersten Vershälfte und erhält die ausgewogene Gegenüberstellung von arm und reich.'
theological_decisions: []
translation_notes:
  register: Knappe, würdige Spruchsprache in modernem Standarddeutsch. Die zweimalige Nennung der »Hand« erhält das konkrete hebräische Bild und den antithetischen Parallelismus; »nachlässig« ist gegenüber dem missverständlichen »lässig« vorzuziehen.
