  source_fidelity: 'Die Übersetzung gibt die antithetische Struktur und die kausative Aussage des Hebräischen zuverlässig wieder: eine nachlässige Hand führt zu Armut, die Hand der Fleißigen zu Reichtum. »Hand der Fleißigen« bewahrt das Bild und die pluralische Personenbezeichnung חָרוּצִים. Die resultative Wiedergabe von רָאשׁ durch »macht arm« ist idiomatisch und sachgerecht.'
  naturalness: Klares, modernes Standarddeutsch in knapper Spruchform. Die Wiederholung von »Hand« ist stilistisch beabsichtigt und entspricht dem Parallelismus. »Eine nachlässige Hand macht arm« ist natürlich; »die Hand der Fleißigen macht reich« ist ebenso verständlich und prägnant.
  terminology: »Nachlässig« trifft רְמִיָּה im arbeitsbezogenen Kontext gut, ohne die im Wort mögliche Bedeutung »Betrug/Täuschung« zu unterschlagen. Die Fußnote dokumentiert diese lexikalische Alternative angemessen. »Fleißige« und »reich machen« entsprechen dem Register und dem Sinn von חָרוּצִים bzw. תַּעֲשִׁיר.
