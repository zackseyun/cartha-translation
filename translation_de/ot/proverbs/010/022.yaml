  text: The blessing of the LORD makes rich, and he adds no sorrow with it.
translation:
  language: de
  text: Der Segen des HERRN macht reich, und er fügt keinen Kummer dazu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכַּת יְהוָה
  choice: Der Segen des HERRN
  rationale: Die Status-constructus-Verbindung wird natürlich und formal nah wiedergegeben; das Tetragramm erscheint nach verbreiteter deutscher Bibeltradition als HERR.
- source_word: תַעֲשִׁיר
  choice: macht reich
  rationale: Die Hifil-Form von עשר bezeichnet das Reichmachen bzw. das Schenken von Wohlstand.
- source_word: עֶצֶב
  choice: Kummer
  rationale: Das Wort kann schmerzliche Mühe, Beschwernis oder Kummer bezeichnen; „Kummer“ bewahrt die Breite im gegebenen Gegensatz zum Segen.
- source_word: עִמָּהּ
  choice: hinzu
  rationale: Wörtlich „mit ihr“; im Deutschen verbindet „hinzufügen“ die Wendung idiomatisch mit dem vorausgehenden Segen.
theological_decisions:
- issue: Subjekt von יוֹסִף
  choice: „er“ bezieht sich auf den HERRN
  alternative: '„sie“ bezieht sich auf den Segen: „und er bringt keinen Kummer mit sich“'
  rationale: Das maskuline Verb bzw. das unausgedrückte maskuline Subjekt legt den HERRN als Subjekt nahe, während das feminine Suffix in עִמָּהּ auf den Segen zurückweist. Die alternative syntaktische Auffassung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des hebräischen Spruchs bleibt erhalten; „HERR“ folgt der etablierten typografischen Wiedergabe des Gottesnamens.
