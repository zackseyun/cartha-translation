- from: Der Segen des HERRN macht reich, und er fügt keinen Kummer hinzu.[a]
  to: Der Segen des HERRN macht reich, und er fügt keinen Kummer dazu.
  rationale: Die Revision beseitigt die sachlich unzutreffende Fußnote zur grammatischen Subjektzuordnung und gibt die an den Segen rückverweisende Präpositionalverbindung idiomatisch mit „dazu“ wieder. Die knappe Spruchform und die im englischen Audit Trail gewählte Lesart mit dem HERRN als Subjekt bleiben erhalten.
