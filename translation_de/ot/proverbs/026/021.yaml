translation:
  language: de
  text: Wie Kohle die Glut und Holz das Feuer anfacht, so facht ein streitsüchtiger Mann Streit an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Streit schürt“ oder „einen Streit entfacht“. Das hebräische Verb bezeichnet das Anfachen oder Schüren; im Zusammenhang führt es das Bild von Kohle, Glut, Holz und Feuer weiter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּחָם
  choice: Kohle
  rationale: Bezeichnet Kohle beziehungsweise Holzkohle als Brennstoff. „Kohle“ ist im Deutschen knapp und bildet zusammen mit „Glut“ die Unterscheidung der beiden hebräischen Begriffe ab.
- source_word: גֶחָלִים
  choice: Glut
  rationale: Der Plural bezeichnet glühende Kohlen beziehungsweise Glut. Das deutsche Kollektivum „Glut“ klingt natürlich und vermeidet eine Wiederholung von „Kohle“.
- source_word: עֵצִים
  choice: Holz
  rationale: Das hebräische Kollektiv bezeichnet Holz; die schlichte Wiedergabe bewahrt die knappe Parallelstruktur.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Direkte und natürliche Entsprechung.
- source_word: אִישׁ
  choice: Mann
  rationale: Gibt den grammatisch maskulinen Singular des hebräischen Spruchworts genau wieder.
- source_word: מדונים
  choice: streitsüchtig
  rationale: Die wörtliche Wendung „Mann der Streitigkeiten“ beschreibt eine habituelle Neigung zum Streit; „streitsüchtig“ ist prägnant und idiomatisch.
- source_word: חַרְחַר
  choice: anfacht
  rationale: Das Verb bezeichnet das Entfachen beziehungsweise Aufflammenlassen. „Anfacht“ erhält die durch Kohle, Glut, Holz und Feuer aufgebaute Metapher.
- source_word: רִיב
  choice: Streit
  rationale: Bezeichnet Streit, Auseinandersetzung oder Zwist. „Streit“ ist im modernen Deutsch klar und passt zur sprichwörtlichen Kürze.
