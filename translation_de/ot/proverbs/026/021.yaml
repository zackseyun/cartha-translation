  source_fidelity: 'Die wesentlichen Lexeme sind zutreffend wiedergegeben: פֶּחָם als „Kohle“ (im Sinn von Holzkohle), גֶחָלִים als „Glut“, עֵצִים als „Holz“, und חַרְחַר רִיב als „Streit anzufachen“. Die Vergleichsstruktur des Hebräischen ist jedoch elliptisch; die Formulierung „– so ist ein … Mann, der …“ macht den Mann eher zu einer Gleichsetzung als zum funktionalen dritten Glied der Analogie. Eine explizite deutsche Wie-so-Konstruktion gibt die Vergleichsaussage klarer wieder.'
