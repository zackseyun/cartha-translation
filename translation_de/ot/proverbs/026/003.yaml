  text: שׁ֣וֹט לַ֭/סּוּס מֶ֣תֶג לַ/חֲמ֑וֹר וְ֝/שֵׁ֗בֶט לְ/גֵ֣ו כְּסִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/003.yaml
  text: A whip for the horse[a], a bridle for the donkey[b], and a rod for the back of fools.
translation:
  language: de
  text: Eine Peitsche[a] für das Pferd, ein Zaum[b] für den Esel und eine Rute für den Rücken der Toren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Geißel“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch enger als „Gebiss“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹט
  choice: Peitsche
  rationale: Bezeichnet ein Werkzeug zum Antreiben oder Züchtigen eines Tieres. „Peitsche“ ist im modernen Deutsch die natürliche und präzise Entsprechung.
- source_word: לַסּוּס
  choice: für das Pferd
  rationale: Die Präposition ל kennzeichnet hier Bestimmung oder Eignung; der bestimmte Artikel wird in der sprichwörtlichen Verallgemeinerung beibehalten.
- source_word: מֶתֶג
  choice: Zaum
  rationale: Das Wort bezeichnet das dem Lenken und Beherrschen dienende Zaumzeug. „Zaum“ gibt dies natürlich wieder, ohne die Bedeutung unnötig auf das Gebissstück einzuengen.
- source_word: לַחֲמוֹר
  choice: für den Esel
  rationale: Moderne, allgemein verständliche Wiedergabe mit Beibehaltung des bestimmten Artikels.
- source_word: וְשֵׁבֶט
  choice: und eine Rute
  rationale: שֵׁבֶט bezeichnet hier ein Schlag- oder Züchtigungsinstrument. „Rute“ bewahrt diese disziplinierende Bedeutung und passt zum weisheitlichen Sprachgebrauch.
- source_word: לְגֵו
  choice: für den Rücken
  rationale: גֵּו bezeichnet den Rücken beziehungsweise Körper als die Stelle, die geschlagen wird; „Rücken“ ist hier konkret und idiomatisch.
- source_word: כְּסִילִים
  choice: der Toren
  rationale: Der Plural meint Menschen, die im moralischen Sinn der Sprüche töricht sind. Der Genitiv bewahrt die hebräische Konstruktion „Rücken der Toren“.
theological_decisions: []
