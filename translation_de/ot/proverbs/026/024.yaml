id: PRO.26.24
reference: Proverbs 26:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ב/שפת/ו יִנָּכֵ֣ר שׂוֹנֵ֑א וּ֝/בְ/קִרְבּ֗/וֹ יָשִׁ֥ית מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/024.yaml
  text: A hater disguises himself with his lips[b][a], but within himself he sets deceit.
translation:
  language: de
  text: Wer hasst, verstellt sich mit seinen Lippen[a], doch in seinem Innern[b] legt er Täuschung zurecht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gibt sich mit seinen Lippen anders, als er ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: in seinem Inneren oder in seiner Mitte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִשְׂפָתוֹ
  choice: mit seinen Lippen
  rationale: Das ב ist hier instrumental zu verstehen. Die konkrete hebräische Bildsprache bleibt erhalten und bezeichnet die Worte als Mittel der Verstellung.
- source_word: יִנָּכֵר
  choice: verstellt sich
  rationale: Der Niphal von נכר bezeichnet hier ein Sich-fremd-Machen beziehungsweise das Verbergen der eigenen Haltung. „Verstellt sich“ gibt diesen reflexiven Sinn im Deutschen natürlich wieder, ohne die Aussage auf eine rein äußerliche Verkleidung zu verengen.
- source_word: שֹׂנֵא
  choice: wer hasst
  rationale: Das substantivierte Partizip bezeichnet einen Menschen, der hasst. Die Relativkonstruktion ist im heutigen Deutsch natürlicher als „ein Hasser“ und enger am Wortlaut als „ein Feind“.
- source_word: וּבְקִרְבּוֹ
  choice: in seinem Innern
  rationale: קֶרֶב meint das Innere eines Menschen. Die Wiedergabe bewahrt den Gegensatz zwischen den äußeren Lippen und dem inneren Bereich, ohne den Ausdruck interpretierend mit „Herz“ gleichzusetzen.
- source_word: יָשִׁית
  choice: legt … zurecht
  rationale: שׁית bedeutet „setzen, legen“. „Legt … zurecht“ bewahrt die Vorstellung eines absichtlichen inneren Platzierens und klingt im Deutschen natürlicher als „setzt Täuschung“.
- source_word: מִרְמָה
  choice: Täuschung
  rationale: מִרְמָה bezeichnet Täuschung, Falschheit oder Arglist. „Täuschung“ passt zum verstellten Reden und lässt offen, wie weit die innere Absicht bereits in Verrat oder konkreten Betrug übergeht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus zwischen äußerer Rede und innerer Täuschung bleibt sichtbar. „Wer hasst“ vermeidet das im Deutschen ungewöhnlich harte Substantiv „Hasser“; „legt … zurecht“ erhält zugleich die bewusste Tätigkeit des hebräischen Verbs.
