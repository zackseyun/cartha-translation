id: PRO.26.5
reference: Proverbs 26:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עֲנֵ֣ה כְ֭סִיל כְּ/אִוַּלְתּ֑/וֹ פֶּן יִהְיֶ֖ה חָכָ֣ם בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/005.yaml
  text: Answer a fool according to his folly[b][a], lest he be wise in his own eyes.
translation:
  language: de
  text: Antworte einem Toren gemäß seiner Torheit[a], damit er sich nicht selbst für weise hält.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Antworte einem Toren so, wie es seiner Torheit entspricht.“ Gemeint ist eine seiner Torheit angemessene Antwort, nicht die Nachahmung seines törichten Verhaltens.'
    reason: lexical_alternative
  - marker: b
    text: Dieser Spruch steht bewusst in Spannung zu Sprüche 26,4. Weisheit erkennt, wann Schweigen und wann eine Erwiderung angebracht ist.
    reason: cross_reference
lexical_decisions:
- source_word: עֲנֵה
  choice: Antworte
  rationale: Der Imperativ von ענה fordert hier zu einer Erwiderung auf. „Antworte“ ist knapp, natürlich und bewahrt die formale Entsprechung zum vorhergehenden Spruch.
- source_word: כְסִיל
  choice: einem Toren
  rationale: כְסִיל ist ein feststehender Begriff der Weisheitsliteratur für einen moralisch und verstandesmäßig uneinsichtigen Menschen. „Tor“ bewahrt diese Kategorie in würdigem, weiterhin verständlichem Deutsch.
- source_word: כְאִוַּלְתּוֹ
  choice: gemäß seiner Torheit
  rationale: Das vorangestellte כ bezeichnet Entsprechung oder Angemessenheit. Die Formulierung bleibt eng am Hebräischen und bewahrt die beabsichtigte Spannung zu Vers 4, ohne zu behaupten, man solle selbst töricht antworten.
- source_word: פֶּן
  choice: damit … nicht
  rationale: פֶּן leitet einen verneinten Zweck- oder Verhütungssatz ein. „Damit … nicht“ gibt diesen Zusammenhang in natürlichem modernem Deutsch wieder.
- source_word: יִהְיֶה חָכָם בְּעֵינָיו
  choice: er sich nicht selbst für weise hält
  rationale: Die hebräische Wendung „weise in seinen Augen sein“ bezeichnet die eigene Einschätzung. Die idiomatische deutsche Wiedergabe macht deutlich, dass der Tor sich selbst für weise hält, nicht dass er tatsächlich weise wird.
theological_decisions:
- issue: Spannung zu Sprüche 26,4
  choice: Die Wendung „gemäß seiner Torheit“ bleibt im Haupttext bewusst offen und erhält die Spannung zwischen beiden benachbarten Sprüchen.
  alternative: „Antworte ihm, wie seine Torheit es verdient“ oder „Antworte ihm auf eine seiner Torheit angemessene Weise“
  rationale: Vers 4 warnt davor, sich beim Antworten dem Toren anzugleichen; Vers 5 fordert eine seiner Torheit entsprechende Erwiderung, damit seine Selbsttäuschung nicht bestehen bleibt. Die Übersetzung soll diese situationsbezogene Weisheit nicht zu einer starren Regel vereinfachen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Tor“ und „Torheit“ bewahren die traditionelle Begrifflichkeit der Weisheitsliteratur; die Satzfügung bleibt zugleich klar und alltagssprachlich verständlich.
