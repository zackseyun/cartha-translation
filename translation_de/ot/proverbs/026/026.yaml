id: PRO.26.26
reference: Proverbs 26:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תִּכַּסֶּ֣ה שִׂ֭נְאָה בְּ/מַשָּׁא֑וֹן תִּגָּלֶ֖ה רָעָת֣/וֹ בְ/קָהָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/026.yaml
  text: Though hatred is covered with deceit[b][a], his evil will be exposed in the assembly.
translation:
  language: de
  text: Auch wenn Hass durch Täuschung[a] verdeckt wird, kommt seine Bosheit in der Versammlung[b] ans Licht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Arglist“ oder „durch Betrug“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in der Gemeinde“. Das hebräische Wort bezeichnet eine versammelte Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכַּסֶּה
  choice: verdeckt wird
  rationale: Die Nifal-Form bezeichnet hier das Verhüllen bzw. Verbergen des Hasses. Das deutsche Passiv bewahrt diese Aussageweise und passt zur allgemeinen Wahrheit des Spruchs.
- source_word: שִׂנְאָה
  choice: Hass
  rationale: Das Substantiv bezeichnet Hass oder feindselige Gesinnung; „Hass“ ist im modernen Deutschen knapp und natürlich.
- source_word: בְּמַשָּׁאוֹן
  choice: durch Täuschung
  rationale: 'Das seltene Substantiv bezeichnet betrügerisches oder arglistiges Verhalten. Die Präposition בְּ wird instrumental verstanden: Täuschung ist das Mittel, durch das der Hass verdeckt wird.'
- source_word: תִּגָּלֶה
  choice: kommt … ans Licht
  rationale: Die Nifal-Form drückt aus, dass etwas enthüllt oder offenbar wird. Die geläufige deutsche Wendung gibt den Gegensatz zum Verdecken klar und würdig wieder.
- source_word: רָעָתוֹ
  choice: seine Bosheit
  rationale: רָעָה umfasst moralisch Böses, Schlechtigkeit und schädliche Absicht. „Bosheit“ stellt hier den Bezug zur feindseligen Person natürlich her, ohne die Aussage auf eine einzelne Tat zu beschränken.
- source_word: בְקָהָל
  choice: in der Versammlung
  rationale: קָהָל bezeichnet eine zusammengekommene Gemeinschaft. „Versammlung“ bewahrt den konkreten gemeinschaftlichen Rahmen besser als das allgemeinere „öffentlich“.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich sprichwörtlich-würdiges Deutsch. Die nicht ausdrücklich markierte, aber im Parallelismus naheliegende konzessionale Beziehung wird mit „Auch wenn“ wiedergegeben; der Wechsel von „Hass“ zu „seine Bosheit“ bleibt erhalten.
