  verdict: approve
  source_fidelity: 'Der Entwurf gibt die beiden Nifalformen sachgerecht wieder: Der Hass wird mittels Täuschung/Arglist verborgen, und die Bosheit des betreffenden Menschen wird in der Versammlung offenbar. Die mit „Auch wenn“ ausgedrückte konzessive Verbindung ist im deutschen Spruchstil natürlich und entspricht dem antithetischen Sinnzusammenhang, ohne eine unzulässige zusätzliche Aussage einzutragen.'
  naturalness: „Auch wenn Hass durch Täuschung verdeckt wird, kommt seine Bosheit in der Versammlung ans Licht“ ist modernes, idiomatisches und zugleich angemessen knappes Deutsch. Die Wendung „ans Licht kommen“ trifft die Bedeutung von תִּגָּלֶה besonders gut.
  terminology: „Hass“, „Täuschung“, „Bosheit“ und „Versammlung“ sind quellentreu und registergerecht. „Versammlung“ bewahrt bei קָהָל den konkreten gemeinschaftlichen Rahmen und vermeidet eine konfessionell verengende Lesart. Die Fußnoten bieten passende lexikalische Alternativen; ihre Marker stehen an den jeweiligen Bezugswörtern.
