  text: חָכָ֣ם עָצֵ֣ל בְּ/עֵינָ֑י/ו מִ֝/שִּׁבְעָ֗ה מְשִׁ֣יבֵי טָֽעַם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/016.yaml
  text: A sluggard is wiser in his own eyes than seven who answer with discernment[a].
translation:
  language: de
  text: Ein Fauler hält sich selbst für weiser als sieben, die eine verständige Antwort geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als sieben, die mit Einsicht antworten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: weiser
  rationale: Das prädikative Adjektiv steht in einer Vergleichskonstruktion mit מִן; daher ist im Deutschen der Komparativ „weiser“ sachgerecht und natürlich.
- source_word: עָצֵל
  choice: ein Fauler
  rationale: Das Substantiv bezeichnet einen Menschen, dessen Verhalten von Trägheit geprägt ist. „Ein Fauler“ ist knapp, sprichwörtlich und in modernem Standarddeutsch verständlich.
- source_word: בְּעֵינָיו
  choice: hält sich selbst für
  rationale: Die hebräische Wendung „in seinen Augen“ bezeichnet hier die eigene Einschätzung. Die idiomatische deutsche Formulierung macht den reflexiven Sinn deutlich, ohne den Inhalt zu erweitern.
- source_word: מִשִּׁבְעָה
  choice: als sieben
  rationale: מִן kennzeichnet den Vergleich; „als sieben“ gibt diese Konstruktion direkt wieder.
- source_word: מְשִׁיבֵי
  choice: die ... Antwort geben können
  rationale: Das Partizip bezeichnet Personen, die antworten beziehungsweise eine Antwort zu geben wissen. Die Formulierung bewahrt sowohl den handelnden als auch den befähigenden Sinn.
- source_word: טָעַם
  choice: verständige
  rationale: טַעַם bezeichnet hier nicht Geschmack, sondern Verstand, Urteilskraft oder Einsicht. „Verständige“ ergibt zusammen mit „Antwort“ eine natürliche deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Knappes, pointiertes Sprichwort in modernem, würdigem Standarddeutsch. Die idiomatische Wiedergabe von בְּעֵינָיו vermeidet eine unnatürliche Formulierung, während die Fußnote die engere Struktur und die Bedeutungsalternative bei טָעַם sichtbar hält.
