  text: רָאִ֗יתָ אִ֭ישׁ חָכָ֣ם בְּ/עֵינָ֑י/ו תִּקְוָ֖ה לִ/כְסִ֣יל מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/012.yaml
  text: Do you see a man wise in his own eyes? There is more hope for a fool than for him[a].
translation:
  language: de
  text: Siehst du einen Mann, der in seinen eigenen Augen weise ist? Für einen Toren gibt es mehr Hoffnung als für ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hast du einen Mann gesehen, der in seinen eigenen Augen weise ist?“ Das hebräische Perfekt kann hier als rhetorische Beobachtung oder Frage wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָ
  choice: Siehst du
  rationale: Das Qal-Perfekt 2. Person Singular von ראה leitet hier eine rhetorische Beobachtung beziehungsweise Frage ein. Das deutsche Präsens gibt diese sprichwörtliche Frage natürlich wieder; die formal näherliegende Perfektwiedergabe wird in der Fußnote genannt.
- source_word: אִישׁ
  choice: einen Mann
  rationale: Das hebräische Substantiv bezeichnet hier einen einzelnen männlichen Beispielträger; die konkrete maskuline Form bleibt erhalten.
- source_word: חָכָם
  choice: weise
  rationale: Das prädikativ gebrauchte Adjektiv ist der übliche Begriff der Weisheitsliteratur und bildet den ironischen Gegensatz zu כְּסִיל.
- source_word: בְּעֵינָיו
  choice: in seinen eigenen Augen
  rationale: Die hebräische Wendung bezeichnet die eigene Selbsteinschätzung. „In seinen eigenen Augen“ bewahrt das Bild und verdeutlicht den reflexiven Sinn.
- source_word: תִּקְוָה
  choice: Hoffnung
  rationale: Das Substantiv bezeichnet Hoffnung beziehungsweise Aussicht; „Hoffnung“ ist im sprichwörtlichen Vergleich prägnant und idiomatisch.
- source_word: לִכְסִיל
  choice: für einen Toren
  rationale: כְּסִיל ist in den Sprüchen die feste Bezeichnung für einen moralisch und geistig uneinsichtigen Menschen. „Tor“ bewahrt diese weisheitliche Kategorie.
- source_word: מִמֶּנּוּ
  choice: als für ihn
  rationale: 'Die Präposition מִן hat hier vergleichende Funktion: Der Tor besitzt mehr Hoffnung als der Mann, der sich selbst für weise hält.'
theological_decisions: []
