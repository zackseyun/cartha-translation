  text: אַל תַּ֣עַן כְּ֭סִיל כְּ/אִוַּלְתּ֑/וֹ פֶּֽן תִּשְׁוֶה לּ֥/וֹ גַם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/004.yaml
  text: Do not answer a fool according to his folly[b][a], lest you also become like him.
translation:
  language: de
  text: Antworte einem Toren nicht nach seiner Torheit[a], sonst wirst du ihm selbst gleich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf törichte Weise“. Die hebräische Wendung kann davor warnen, beim Antworten die törichte Art des Toren nachzuahmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Sprüche 26,5 enthält die ergänzende Aufforderung: „Antworte einem Toren nach seiner Torheit.“ Beide Sprüche verlangen situationsgerechte Weisheit; die Spannung zwischen ihnen bleibt bewusst bestehen.'
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּעַן
  choice: Antworte … nicht
  rationale: אַל mit dem Imperfekt drückt ein Verbot aus. Die deutsche Satzklammer gibt dies natürlich und ohne zusätzliche Verstärkung wieder.
- source_word: כְּסִיל
  choice: einem Toren
  rationale: כְּסִיל bezeichnet in der Weisheitsliteratur einen moralisch und geistig uneinsichtigen Menschen, nicht bloß jemanden mit geringer Intelligenz. „Tor“ ist die prägnante, würdige deutsche Entsprechung.
- source_word: כְאִוַּלְתּוֹ
  choice: nach seiner Torheit
  rationale: Das Präfix כ bezeichnet hier eine Entsprechung. Die Formulierung bewahrt die Mehrdeutigkeit, ob eine Antwort gemeint ist, die die törichte Art des Toren nachahmt, oder eine Antwort, die sich auf seine Torheit einstellt; dadurch bleibt auch die Spannung zu Vers 5 erhalten.
- source_word: פֶּן
  choice: damit … nicht
  rationale: פֶּן leitet eine zu vermeidende Folge ein. „Damit … nicht“ ist im heutigen Deutsch natürlicher als das gehobene „auf dass nicht“ oder „sonst“.
- source_word: תִּשְׁוֶה לּוֹ
  choice: du … wirst wie er
  rationale: שׁוה mit ל bezeichnet hier Gleichheit oder Ähnlichkeit. Die Wendung warnt idiomatisch davor, dem Toren selbst ähnlich zu werden.
- source_word: גַם אָתָּה
  choice: du … auch
  rationale: גַם betont, dass auch der Angesprochene dem Toren gleich werden kann. Die deutsche Stellung klingt natürlich und erhält diese Hervorhebung.
theological_decisions:
- issue: Auslegungsspannung zum unmittelbar folgenden Spruch in Sprüche 26,5
  choice: Die offene Formulierung „nach seiner Torheit“ wird beibehalten.
  alternative: „auf törichte Weise“ oder „wie seine Torheit es verdient“
  rationale: Der hebräische Wortlaut legt nicht eindeutig fest, in welchem Sinn die Antwort der Torheit entsprechen würde. Die Übersetzung soll die bewusste Spannung zum folgenden Vers nicht durch eine einengende Deutung beseitigen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit knapper, sprichwortartiger Form. „Tor“ und „Torheit“ bewahren den traditionellen Weisheitsbegriff und die Wortverbindung des Hebräischen, ohne die Aussage konfessionell oder interpretierend zu verengen.
