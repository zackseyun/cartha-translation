  variant: modern standard German
source:
  edition: WLC
  text: כַּ/שֶּׁ֤לֶג בַּ/קַּ֗יִץ וְ/כַ/מָּטָ֥ר בַּ/קָּצִ֑יר כֵּ֤ן לֹא נָאוֶ֖ה לִ/כְסִ֣יל כָּבֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/001.yaml
  text: Like snow in summer and like rain at harvest[a], so honor is not fitting for a fool.
translation:
  language: de
  text: Wie Schnee im Sommer und wie Regen zur Erntezeit, so passt Ehre nicht zu einem Toren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּשֶּׁלֶג
  choice: Wie Schnee
  rationale: Das Präfix כ־ kennzeichnet einen Vergleich. „Wie Schnee“ gibt das Bild knapp und natürlich wieder.
- source_word: בַּקַּיִץ
  choice: im Sommer
  rationale: Bezeichnet die heiße, trockene Jahreszeit; „im Sommer“ ist die natürliche deutsche Entsprechung.
- source_word: וְכַמָּטָר
  choice: und wie Regen
  rationale: Bewahrt die parallele Struktur des zweiten Vergleichsbildes.
- source_word: בַּקָּצִיר
  choice: zur Erntezeit
  rationale: קָצִיר bezeichnet die Ernte beziehungsweise Erntezeit. „Zur Erntezeit“ verdeutlicht den jahreszeitlichen Rahmen und klingt im Deutschen idiomatisch.
- source_word: כֵּן
  choice: so
  rationale: Leitet die Folgerung aus den beiden Vergleichsbildern ein und erhält die prägnante Spruchform.
- source_word: לֹא נָאוֶה
  choice: passt … nicht
  rationale: נָאוֶה bezeichnet, was angemessen oder schicklich ist. Die Wendung „passt nicht zu“ ist modern, klar und bewahrt das Urteil über die Unangemessenheit.
- source_word: לִכְסִיל
  choice: zu einem Toren
  rationale: כְּסִיל ist ein feststehender Begriff der Weisheitsliteratur für einen Menschen, der sich der Weisheit verschließt. „Tor“ bewahrt diese moralisch-weisheitliche Bedeutung besser als das stärker intellektuell klingende „Dummkopf“.
- source_word: כָּבוֹד
  choice: Ehre
  rationale: Im vorliegenden gesellschaftlichen Zusammenhang meint כָּבוֹד Ansehen oder erwiesene Ehre, nicht göttliche Herrlichkeit.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller deutscher Spruchstil mit klarer Parallelstruktur. „Tor“ wurde als traditionsnaher, in der Weisheitsliteratur sachlich passender Begriff beibehalten; die Prädikatswendung „passt nicht zu“ sorgt zugleich für unmittelbare Verständlichkeit.
