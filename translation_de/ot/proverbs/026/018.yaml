  source_fidelity: 'Die Grundbedeutungen sind zutreffend wiedergegeben: כְּמִתְלַהְלֵהַּ bezeichnet einen gefährlich irrational Handelnden, זִקִּים feurige bzw. brennende Geschosse, חִצִּים Pfeile und וָמָוֶת wörtlich „Tod“. Das Verb יָרָה ist in dieser Projektilreihe am besten mit „abschießen“ wiederzugeben; „schleudern“ ist möglich, schwächt aber besonders bei „Pfeile“ die naheliegende Schussbedeutung.'
