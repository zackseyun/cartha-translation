  terminology: „Brandgeschosse“ ist modernes, verständliches Deutsch und erhält die Projektilvorstellung. „Wahnsinniger“ ist für das Bild eines irrational und gefährlich Handelnden angemessen, ohne eine medizinische Diagnose behaupten zu wollen. „Tod“ soll als markante Abstraktion stehen bleiben.
