  text: כְּֽ֭/מִתְלַהְלֵהַּ הַ/יֹּרֶ֥ה זִקִּ֗ים חִצִּ֥ים וָ/מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/018.yaml
  text: Like a madman who shoots firebrands[a], arrows, and death[b],
translation:
  language: de
  text: Wie ein Wahnsinniger, der Brandgeschosse[a], Pfeile und Tod abschießt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Feuerbrände“ oder „glühende Geschosse“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמִתְלַהְלֵהַּ
  choice: Wie ein Wahnsinniger
  rationale: Das Präfix כְּ leitet einen Vergleich ein. Die Form von הלל bezeichnet hier ein irrationales, rasendes Verhalten. „Wahnsinniger“ gibt die gefährliche Unberechenbarkeit des Bildes knapp und anschaulich wieder.
- source_word: הַיֹּרֶה
  choice: der … schleudert
  rationale: ירה kann das Abschießen oder Schleudern von Geschossen bezeichnen. „Schleudert“ lässt sich im Deutschen natürlich auf Brandgeschosse, Pfeile und in der zugespitzten Bildsprache auch auf „Tod“ beziehen.
- source_word: זִקִּים
  choice: Brandgeschosse
  rationale: Das Wort bezeichnet hier brennende Gegenstände beziehungsweise feurige Geschosse. „Brandgeschosse“ ist im modernen Deutsch klarer als „Feuerbrände“ und wahrt die Projektilvorstellung.
- source_word: חִצִּים
  choice: Pfeile
  rationale: Dies ist die gewöhnliche und im Kontext eindeutige Bedeutung.
- source_word: וָמָוֶת
  choice: und Tod
  rationale: Die wörtliche, markante Abstraktion bleibt erhalten. So wird nicht entschieden, ob „Tod“ als letztes Geschoss, als Folge oder als poetische Zusammenfassung der tödlichen Gefahr zu verstehen ist.
