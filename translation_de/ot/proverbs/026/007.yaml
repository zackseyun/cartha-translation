source:
  edition: WLC
  text: דַּלְי֣וּ שֹׁ֭קַיִם מִ/פִּסֵּ֑חַ וּ֝/מָשָׁ֗ל בְּ/פִ֣י כְסִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/007.yaml
  text: Like the legs that hang limp from a lame man[a], so is a proverb in the mouth of fools.
translation:
  language: de
  text: Wie die Beine eines Lahmen schlaff herabhängen, so ist ein Spruch im Mund von Toren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Beine eines Lahmen baumeln; ebenso ein Spruch im Mund von Toren.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְיוּ
  choice: schlaff hängen … herab
  rationale: Das Verb bezeichnet ein schlaffes Herabhängen oder Baumeln. Die Wiedergabe erhält das anschauliche Bild, ohne lediglich allgemeine Schwäche auszudrücken.
- source_word: שֹׁקַיִם
  choice: Beine
  rationale: Der Ausdruck kann genauer Unterschenkel oder Schenkel bezeichnen; „Beine“ ist im Deutschen natürlich und für das Bild hinreichend genau.
- source_word: מִפִּסֵּחַ
  choice: eines Gelähmten
  rationale: Die Präposition kann Herkunft beziehungsweise Zugehörigkeit anzeigen. Der Genitiv gibt idiomatisch wieder, dass es um die Beine eines gehbehinderten Menschen geht.
- source_word: וּמָשָׁל
  choice: so ist ein Spruch
  rationale: Das bloße „und“ leitet die zweite Hälfte des Vergleichs ein. „So ist“ macht diese vergleichende Funktion im Deutschen natürlich deutlich.
- source_word: מָשָׁל
  choice: Spruch
  rationale: מָשָׁל bezeichnet hier einen Weisheits- oder Lehrspruch. „Spruch“ vermeidet die im Deutschen mögliche Verengung von „Sprichwort“ auf eine allgemein geläufige Redensart.
- source_word: בְּפִי
  choice: im Mund von
  rationale: Die konkrete hebräische Metapher wird bewahrt und bezeichnet das Aussprechen beziehungsweise Vortragen des Spruchs.
- source_word: כְסִילִים
  choice: Toren
  rationale: „Toren“ bewahrt die für die Weisheitsliteratur typische moralisch-geistige Kategorie und passt zum würdevollen Register; der Plural des Ausgangstextes bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher Körpermetaphorik. „Gelähmter“ gibt פִּסֵּחַ traditionell und knapp wieder; gemeint ist ein Mensch, dessen Gehfähigkeit eingeschränkt ist. Die alternative Fußnote bewahrt die Möglichkeit, דַּלְיוּ stärker als „baumeln“ und die beiden Vershälften als knappe Parallele zu lesen.
