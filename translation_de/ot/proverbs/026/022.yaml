  text: דִּבְרֵ֣י נִ֭רְגָּן כְּ/מִֽתְלַהֲמִ֑ים וְ֝/הֵ֗ם יָרְד֥וּ חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/022.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
translation:
  language: de
  text: Die Worte eines Verleumders sind wie Leckerbissen[a], und sie gehen hinab in die innersten Kammern des Bauches[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „feine Bissen“ beziehungsweise „Dinge, die gierig verschlungen werden“. Das hebräische Wort ist selten und umstritten; eine ältere Überlieferung verstand es als „Wunden“.'
    reason: lexical_alternative
  - marker: b
    text: Die „innersten Kammern des Bauches“ sind ein hebräisches Bild für das tiefste Innere eines Menschen.
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Die Worte
  rationale: Der Status constructus im Plural wird natürlich und formnah mit „die Worte“ wiedergegeben.
- source_word: נִרְגָּן
  choice: eines Verleumders
  rationale: Das Substantiv bezeichnet in den Sprüchen jemanden, der heimlich nachteilige und entzweiende Rede verbreitet. „Verleumder“ ist im modernen Standarddeutsch verständlich, auch wenn das heimliche Flüstern weniger ausdrücklich hervortritt.
- source_word: כְּמִתְלַהֲמִים
  choice: wie Leckerbissen
  rationale: Die seltene und umstrittene Form wird entsprechend dem Bild von begierig aufgenommener Rede als schmackhafte Bissen verstanden. Die lexikalische Unsicherheit bleibt in Fußnote [a] sichtbar.
- source_word: וְהֵם
  choice: und sie
  rationale: Das ausdrückliche Pronomen wird beibehalten und bezieht sich auf die Worte selbst.
- source_word: יָרְדוּ
  choice: gehen hinab
  rationale: Das konkrete Bild des Hinabgehens wird in der zeitlosen Aussage des Spruchs im Präsens wiedergegeben.
- source_word: חַדְרֵי בָטֶן
  choice: die innersten Kammern des Leibes
  rationale: Die konkrete hebräische Metapher von den „Kammern des Bauches/Leibes“ bleibt erhalten; „Leib“ klingt im Deutschen natürlicher und würdevoller als „Bauch“, ohne das Körperbild aufzulösen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Körpermetaphorik. Die seltene Wendung כְּמִתְלַהֲמִים wird im Haupttext verständlich wiedergegeben, während die echte lexikalische Unsicherheit in der Fußnote offengelegt wird.
