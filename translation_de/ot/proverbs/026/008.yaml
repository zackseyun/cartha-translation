translation_notes:
  register: Modernes, würdiges Standarddeutsch mit allgemein verständlicher Satzstruktur. »Tor« bewahrt den prägnanten weisheitlichen Begriff; die lexikalische Unsicherheit des Bildes wird nicht im Haupttext aufgelöst, sondern durch die Fußnote offengehalten.
