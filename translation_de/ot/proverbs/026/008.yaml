  text: Like one who binds a stone in a sling[a], so is one who gives honor to a fool.
translation:
  language: de
  text: Wie das Festbinden eines Steins in einer Schleuder[a], so ist es, einem Toren Ehre zu erweisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Wie wenn man einen Stein auf einen Steinhaufen legt, so ist es, wenn man einem Toren Ehre erweist.« Das hier verwendete hebräische Wort ist in seiner Bedeutung unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּצְרוֹר
  choice: Wie wenn man … festbindet
  rationale: Die Form wird am besten verbal von צרר, »binden, festbinden«, verstanden. Die finite deutsche Form gibt den allgemeinen Vergleich natürlich wieder und bewahrt das konkrete Bild.
- source_word: אֶבֶן
  choice: einen Stein
  rationale: אֶבֶן bezeichnet gewöhnlich einen Stein; im vermuteten Schleuderbild ist dies die naheliegende, unmarkierte Wiedergabe.
- source_word: בְּמַרְגֵּמָה
  choice: in einer Schleuder
  rationale: Das seltene und lexikalisch unsichere Substantiv kann im Zusammenhang als »Schleuder« verstanden werden. Diese Deutung ergibt das Bild eines festgebundenen und damit zweckwidrig eingesetzten Steins; die mögliche Bedeutung »Steinhaufen« wird in der Fußnote bewahrt.
- source_word: כֵּן
  choice: so ist es
  rationale: כֵּן führt die Anwendung des vorausgehenden Vergleichs ein. »So ist es« bildet diese ausdrückliche Entsprechung in natürlichem Deutsch ab.
- source_word: נוֹתֵן
  choice: wenn man … erweist
  rationale: Das Partizip bezeichnet allgemein jeden, der so handelt. Die unpersönliche Form »man« gibt diesen generischen Sinn knapp und geschlechtsneutral wieder.
- source_word: לִכְסִיל
  choice: einem Toren
  rationale: כְּסִיל bezeichnet in den Sprüchen einen moralisch uneinsichtigen und verstockten Menschen. »Tor« ist im weisheitlichen Kontext prägnant und würdevoll.
- source_word: כָּבוֹד
  choice: Ehre
  rationale: כָּבוֹד meint hier gesellschaftliche Achtung oder Auszeichnung. »Ehre erweisen« ist eine klare und idiomatische deutsche Wiedergabe.
