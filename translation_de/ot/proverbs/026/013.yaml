  yaml_path: translation/ot/proverbs/026/013.yaml
  text: The sluggard says[a], “There is a lion in the road! A lion in the public squares!”
translation:
  language: de
  text: 'Der Faule sagt: »Ein Löwe ist auf dem Weg! Ein Löwe ist auf den öffentlichen Plätzen[a]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf den Straßen«. Das hebräische Wort bezeichnet genauer breite, öffentliche Flächen oder Plätze innerhalb einer Ortschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצֵל
  choice: der Faule
  rationale: Das substantivierte Adjektiv bezeichnet in den Sprüchen einen Menschen, dessen Verhalten von Trägheit geprägt ist. »Der Faule« ist im Deutschen natürlich und bewahrt den Charaktertyp des Spruches.
- source_word: אָמַר
  choice: sagt
  rationale: Obwohl die hebräische Form formal ein Qatal ist, beschreibt sie im sprichwörtlichen Kontext ein typisches, wiederkehrendes Verhalten. Das deutsche Präsens gibt diesen allgemeinen Sinn angemessen wieder.
- source_word: שַׁחַל / אֲרִי
  choice: Löwe / Löwe
  rationale: Beide hebräischen Wörter bezeichnen einen Löwen. Dieselbe deutsche Wiedergabe bewahrt den synonymen Parallelismus und die übertreibende Wiederholung der Ausrede.
- source_word: בַּדָּרֶךְ
  choice: auf dem Weg
  rationale: Die Wendung bezeichnet den Aufenthaltsort auf einem begangenen Weg. »Auf dem Weg« ist im modernen Deutschen die natürliche örtliche Formulierung.
- source_word: בֵּין הָרְחֹבוֹת
  choice: mitten auf den öffentlichen Plätzen
  rationale: רְחֹבוֹת sind breite, offene öffentliche Räume innerhalb einer Ortschaft, besonders Plätze. בֵּין kann hier die Lage inmitten solcher Orte ausdrücken; »mitten auf« gibt diesen Sinn verständlich wieder, ohne das missverständliche wörtliche »zwischen den Plätzen«.
theological_decisions: []
translation_notes:
  register: Moderner, knapper und würdevoller Spruchstil. Die zweimalige Nennung des Löwen und die Ausrufezeichen erhalten die komische Übertreibung der vorgeschobenen Gefahr.
