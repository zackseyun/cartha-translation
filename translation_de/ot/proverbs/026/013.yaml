    issue: „mitten“ verstärkt die Ortsangabe.
    rationale: Für בֵּין ist im gegebenen Parallelismus keine ausdrückliche Betonung des Zentrums der Plätze erforderlich. Das neutralere „auf den öffentlichen Plätzen“ lässt den räumlichen Sinn offen und bleibt näher am Hebräischen.
  - severity: low
    issue: Fußnotenanker steht am Ende des gesamten Zitats.
    rationale: Da die Anmerkung ausschließlich die Wiedergabe von הָרְחֹבוֹת betrifft, sollte der Anker unmittelbar bei „öffentlichen Plätzen“ stehen.
