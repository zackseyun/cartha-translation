  yaml_path: translation/ot/proverbs/026/011.yaml
  text: Like a dog returning to its vomit[a], so a fool repeats his folly.
translation:
  language: de
  text: Wie ein Hund zu seinem Erbrochenen zurückkehrt, so wiederholt ein Narr seine Torheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wie ein Hund zu seinem Erbrochenen zurückkehrt, so ein Narr, der seine Torheit wiederholt.“ Das Hebräische verwendet in beiden Satzhälften Partizipien und zeichnet so ein kennzeichnendes, wiederkehrendes Verhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֶלֶב
  choice: Wie ein Hund
  rationale: Das Präfix כְּ kennzeichnet den Vergleich. „Wie ein Hund“ gibt den Beginn des Gleichnisses natürlich und unmittelbar wieder.
- source_word: שָׁב עַל קֵאוֹ
  choice: der zu seinem Erbrochenen zurückkehrt
  rationale: Das Partizip שָׁב zeichnet ein charakteristisches, wiederkehrendes Verhalten. עַל wird im Deutschen nach „zurückkehren“ idiomatisch mit „zu“ wiedergegeben; קֵאוֹ bezeichnet das Erbrochene des Hundes.
- source_word: כְּסִיל
  choice: ein Dummkopf
  rationale: כְּסִיל bezeichnet in den Sprüchen einen unbelehrbaren, moralisch wie praktisch törichten Menschen. „Dummkopf“ ist gegenwärtig und verständlich, ohne die Aussage auf geringe Intelligenz zu beschränken.
- source_word: שׁוֹנֶה בְאִוַּלְתּוֹ
  choice: der seine Torheit wiederholt
  rationale: שׁוֹנֶה bezeichnet hier das Wiederholen beziehungsweise erneute Tun. Die Präposition בְ wird mit „wiederholt“ idiomatisch in eine direkte Objektkonstruktion überführt; „seine Torheit“ bewahrt das Suffix und den moralischen Gehalt von אִוֶּלֶת.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit der knappen, bildhaften Wirkung eines Sprichworts. Die parallelen Partizipialkonstruktionen werden soweit möglich durch zwei Relativsätze gespiegelt; die Kopula „ist“ macht den Vergleich im Deutschen syntaktisch vollständig.
