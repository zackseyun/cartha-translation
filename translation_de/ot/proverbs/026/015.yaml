  text: טָ֘מַ֤ן עָצֵ֣ל יָ֭ד/וֹ בַּ/צַּלָּ֑חַת נִ֝לְאָ֗ה לַֽ/הֲשִׁיבָ֥/הּ אֶל פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/015.yaml
  text: A sluggard buries his hand in the dish[b][a]; he is too weary to bring it back to his mouth.
translation:
  language: de
  text: Der Faule vergräbt seine Hand in der Schüssel[a]; er ist zu müde, sie wieder zum Mund zu führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »versteckt seine Hand in der Schüssel«. Das hebräische Verb kann »verbergen«, »verstecken« oder »vergraben« bedeuten; »vergräbt« bewahrt das übertriebene Bild des Spruchs. Für »Schüssel« sind auch »Schale« oder »Platte« möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  choice: vergräbt
  rationale: Das Verb bedeutet »verbergen«, »verstecken« oder »vergraben«. »Vergräbt« bewahrt das übertriebene, anschauliche Bild des Spruchs.
- source_word: עָצֵל
  choice: der Faule
  rationale: Das substantivierte Adjektiv bezeichnet im Sprüchebuch den typischen trägen Menschen. »Der Faule« ist im Deutschen knapp, sprichwörtlich und allgemein verständlich.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Direkte Wiedergabe des Singulars mit Suffix der 3. Person maskulin Singular.
- source_word: בַּצַּלָּחַת
  choice: in der Schüssel
  rationale: Das Substantiv bezeichnet ein Gefäß für Speisen, etwa eine Schüssel oder Platte. »Schüssel« passt natürlich zum dargestellten Essen, ohne die Form unnötig genau festzulegen.
- source_word: נִלְאָה
  choice: er ist zu müde
  rationale: Die Form bezeichnet Ermüdung oder Erschöpfung. Zusammen mit dem folgenden Infinitiv gibt »zu müde« den im Kontext gemeinten, bewusst überzeichneten Unwillen zur Bewegung idiomatisch wieder.
- source_word: לַהֲשִׁיבָהּ
  choice: sie wieder ... zu führen
  rationale: Der Hifil von שוב bezeichnet das Zurückbringen. Das feminine Suffix bezieht sich grammatisch auf die Hand; »wieder ... zu führen« gibt die Rückbewegung zum Mund natürlich wieder.
- source_word: אֶל פִּיו
  choice: zum Mund
  rationale: Wörtliche und im Deutschen idiomatische Wiedergabe der Zielangabe; der possessive Bezug ist bereits durch »seine Hand« und das Subjekt eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem, sprichwörtlichem Rhythmus. Die groteske Übertreibung des hebräischen Bildes bleibt erhalten.
