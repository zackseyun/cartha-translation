source:
  edition: WLC
  text: ח֭וֹחַ עָלָ֣ה בְ/יַד שִׁכּ֑וֹר וּ֝/מָשָׁ֗ל בְּ/פִ֣י כְסִילִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/009.yaml
  text: Like a thorn that comes up in the hand of a drunkard[b][a], so is a proverb in the mouth of fools.
translation:
  language: de
  text: Wie ein Dorn, der in der Hand eines Betrunkenen emporsteigt[a][b], so ist ein Sprichwort im Mund von Toren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie ein Dornbusch in der Hand eines Betrunkenen, so ist ein Sprichwort im Mund von Toren.“'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bedeutet wörtlich „steigt auf“ oder „geht hinauf“. Das ungewöhnliche Bild kann einen Dorn meinen, der angehoben oder geschwungen wird oder auf andere Weise in die Hand des Betrunkenen gerät; der genaue Vorgang bleibt offen.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹחַ
  choice: Dorn
  rationale: Das Substantiv kann einen Dorn oder eine dornige Pflanze bezeichnen. „Dorn“ gibt das scharfe, gefährliche Bild knapp und natürlich wieder; die pflanzliche Alternative wird in einer Fußnote bewahrt.
- source_word: עָלָה
  choice: emporsteigt
  rationale: Das Verb bedeutet wörtlich „hinaufgehen/aufsteigen“. „Emporsteigt“ bewahrt die ungewöhnliche Bewegung des hebräischen Bildes, ohne eindeutig festzulegen, ob der Dorn angehoben, geschwungen oder auf andere Weise in der Hand wirksam wird.
- source_word: בְיַד
  choice: in der Hand eines
  rationale: Die konkrete Wendung wird direkt wiedergegeben und bildet ein anschauliches Gegenstück zu „im Mund von“.
- source_word: שִׁכּוֹר
  choice: Betrunkenen
  rationale: Das substantivisch gebrauchte Wort bezeichnet einen betrunkenen Menschen. Die Formulierung ist im modernen Standarddeutsch natürlich und legt nicht zusätzlich fest, ob gewohnheitsmäßige Trunksucht gemeint ist.
- source_word: מָשָׁל
  choice: Sprichwort
  rationale: Im Buch der Sprüche bezeichnet das Wort eine sprichwörtliche oder lehrhafte Aussage. „Sprichwort“ wahrt hier den Gattungsbezug und die Pointe des Vergleichs.
- source_word: בְּפִי
  choice: im Mund von
  rationale: Die konkrete Körpermetapher wird erhalten und entspricht parallel dem Bild „in der Hand“.
- source_word: כְסִילִים
  choice: Toren
  rationale: Der Weisheitsbegriff bezeichnet moralisch und geistlich uneinsichtige, verstockte Menschen, nicht bloß Personen mit geringer Intelligenz. „Toren“ ist dafür eine prägnante und würdige Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener Bildhaftigkeit. Die etwas ungewöhnliche Verbindung „in der Hand ... emporsteigt“ spiegelt die Mehrdeutigkeit des Hebräischen, statt sie durch eine eindeutige Deutung wie „schwingt“ oder „sticht“ aufzulösen.
