source:
  edition: WLC
  text: מְקַצֶּ֣ה רַ֭גְלַיִם חָמָ֣ס שֹׁתֶ֑ה שֹׁלֵ֖חַ דְּבָרִ֣ים בְּ/יַד כְּסִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/006.yaml
  text: One who sends messages by the hand of a fool cuts off his feet and drinks violence[a].
translation:
  language: de
  text: Wer Botschaften durch einen Toren sendet, schneidet sich die Füße ab und trinkt Gewalt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Worte“ statt „Botschaften“. Das hebräische Wort kann beides bedeuten; hier geht es wahrscheinlich um eine Mitteilung, die einem Boten anvertraut wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקַצֶּה
  choice: schneidet … ab
  rationale: Das Piel-Partizip bezeichnet ein gewaltsames Abschneiden oder Verstümmeln. Die konkrete, drastische Bildsprache des hebräischen Spruchs bleibt erhalten.
- source_word: רַגְלַיִם
  choice: sich die Füße
  rationale: Die Dualform bezeichnet die Füße beziehungsweise Beine. Das reflexive „sich“ macht im Deutschen natürlich verständlich, dass der Absender sich selbst schädigt, ohne ein betontes „seine eigenen“ einzuführen.
- source_word: חָמָס
  choice: Gewalt
  rationale: Das Wort kann Gewalt, Unrecht oder zugefügten Schaden bezeichnen. „Gewalt“ bewahrt die Härte und Konkretheit des Bildes.
- source_word: שֹׁתֶה
  choice: trinkt
  rationale: 'Die wörtliche Metapher des Trinkens bleibt erhalten: Der Betreffende nimmt den schädlichen Ausgang gleichsam in sich auf.'
- source_word: שֹׁלֵחַ
  choice: Wer … sendet
  rationale: Die deutsche Relativkonstruktion gibt die allgemeine, sprichwörtliche Aussage des Partizips natürlich wieder.
- source_word: דְּבָרִים
  choice: Botschaften
  rationale: דְּבָרִים bedeutet grundsätzlich „Worte“ oder „Dinge/Angelegenheiten“; in Verbindung mit dem Senden durch die Hand eines Boten bezeichnet es hier wahrscheinlich anvertraute Mitteilungen.
- source_word: בְּיַד
  choice: durch die Hand
  rationale: Die konkrete hebräische Wendung für Vermittlung beziehungsweise Beauftragung wird bewahrt und bleibt im Deutschen verständlich.
- source_word: כְּסִיל
  choice: eines Toren
  rationale: Der Ausdruck bezeichnet in der Weisheitsliteratur einen moralisch und praktisch uneinsichtigen Menschen. „Tor“ ist dafür im würdevollen deutschen Sprichwortstil treffend.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Sprichwortstil. Die schockierende Selbstverletzungsmetapher und das ungewöhnliche Bild „Gewalt trinken“ werden bewusst nicht geglättet. „Durch die Hand“ wahrt die konkrete Ausdrucksweise des Hebräischen.
