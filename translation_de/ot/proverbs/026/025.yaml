  yaml_path: translation/ot/proverbs/026/025.yaml
  text: When he makes his voice gracious[a], do not trust him[b], for seven abominations are in his heart.
translation:
  language: de
  text: Wenn er seine Stimme freundlich klingen lässt[a], vertraue ihm nicht; denn sieben[b] Gräuel sind in seinem Herzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn er seine Stimme freundlich macht“; auch: „wenn er freundlich redet“ oder „wenn er sich freundlich anhört“.'
    reason: lexical_alternative
  - marker: b
    text: „Sieben“ kann in der Weisheitsliteratur zugleich Fülle oder Vollständigkeit ausdrücken; die Zahl wird im Text beibehalten.
    reason: cultural_note
lexical_decisions:
- source_word: יְחַנֵּן קוֹלוֹ
  choice: seine Stimme freundlich klingen lässt
  rationale: Das Piel von חנן bezeichnet hier zusammen mit „seine Stimme“ ein bewusst gewinnendes oder freundliches Klingen der Rede. Die Formulierung bewahrt das konkrete Bild des Hebräischen und ist zugleich natürliches modernes Deutsch.
- source_word: אַל תַּאֲמֶן בּוֹ
  choice: vertraue ihm nicht
  rationale: אמן im Hifil mit ב bezeichnet hier Vertrauen in eine Person. „Vertraue ihm nicht“ gibt Syntax und Zusammenhang genauer wieder als das engere „glaube ihm nicht“.
- source_word: שֶׁבַע
  choice: sieben
  rationale: Die ausdrücklich genannte Zahl bleibt erhalten. In der Weisheitsliteratur kann sieben zugleich Fülle oder Vollständigkeit andeuten.
- source_word: תּוֹעֵבוֹת
  choice: Gräuel
  rationale: תּוֹעֵבָה ist ein starkes Wort für moralisch Abscheuliches. „Gräuel“ bewahrt diese Intensität und den biblischen Klang, ohne die Aussage abzuschwächen.
- source_word: בְּלִבּוֹ
  choice: in seinem Herzen
  rationale: „Herz“ bewahrt das hebräische Bild für das innere Denken, Wollen und Beabsichtigen des Menschen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Redeweise von der „Stimme“ und das biblische Bild des „Herzens“ bleiben erhalten; „freundlich klingen lässt“ macht zugleich den absichtsvoll gewinnenden Ton der Rede verständlich.
