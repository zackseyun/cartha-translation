  text: כַּ/צִּפּ֣וֹר לָ֭/נוּד כַּ/דְּר֣וֹר לָ/ע֑וּף כֵּ֥ן קִֽלְלַ֥ת חִ֝נָּ֗ם לא תָבֹֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/002.yaml
  text: Like a sparrow in its wandering[a], like a swallow in its flying[c][b], so an undeserved curse does not come to rest.
translation:
  language: de
  text: 'Wie ein Vogel umherflattert,

    wie eine Schwalbe dahinfliegt,[a]

    so kommt ein grundloser Fluch nicht an.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Schwalbe“ wiedergegebene hebräische Wort kann möglicherweise auch einen Mauersegler bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „kommt nicht“. Im Bildzusammenhang kann gemeint sein, dass der Fluch sein Ziel nicht erreicht, sich nicht niederlässt oder nicht wirksam wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּצִּפּוֹר
  choice: Wie ein Vogel
  rationale: צִפּוֹר bezeichnet einen Vogel, häufig einen kleinen Vogel, ohne dass hier zoologisch sicher „Spatz“ festgelegt werden muss. Das Präfix כַּ־ leitet den Vergleich ein.
- source_word: לָנוּד
  choice: umherflattert
  rationale: נוּד beschreibt unstete, umherziehende Bewegung. „Umherflattern“ gibt im Zusammenhang mit einem Vogel sowohl die Bewegung als auch das fehlende Niederlassen natürlich wieder.
- source_word: כַּדְּרוֹר
  choice: wie eine Schwalbe
  rationale: דְּרוֹר wird traditionell als „Schwalbe“ verstanden; die mögliche zoologische Alternative „Mauersegler“ wird in einer Fußnote offengehalten.
- source_word: לָעוּף
  choice: dahinfliegt
  rationale: עוּף bedeutet „fliegen“. „Dahinfliegt“ bildet einen natürlichen poetischen Parallelismus zu „umherflattert“.
- source_word: כֵּן
  choice: so
  rationale: כֵּן führt knapp und sprichwortartig die Folgerung aus den beiden Vergleichen ein.
- source_word: קִלְלַת חִנָּם
  choice: ein grundloser Fluch
  rationale: Die Verbindung bedeutet wörtlich einen Fluch „ohne Grund“ beziehungsweise „ohne Anlass“. „Grundlos“ ist prägnant und bewahrt den Gedanken eines nicht gerechtfertigten Fluches.
- source_word: לֹא תָבֹא
  choice: kommt nicht an
  rationale: בוא bedeutet wörtlich „kommen“. „Kommt nicht an“ bewahrt diese Grundbedeutung und nimmt zugleich das Bild eines Vogels auf, der sich nicht niederlässt; außerdem kann es ausdrücken, dass der Fluch sein Ziel nicht erreicht.
theological_decisions:
- issue: Wirksamkeit eines grundlosen Fluches
  choice: 'Die Aussage bleibt bildhaft: Ein grundloser Fluch „kommt nicht an“.'
  alternative: Explizit formulieren, dass er sich nicht erfüllt oder keine Wirkung hat.
  rationale: Der hebräische Text sagt lediglich „kommt nicht“ und lässt offen, ob Ankunft, Niederlassen oder Wirksamwerden im Vordergrund steht. Die Übersetzung soll daraus keine umfassendere Lehraussage über Flüche machen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Der dreigliedrige Parallelismus wird durch Zeilenumbrüche sichtbar gemacht. „Kommt nicht an“ hält die Mehrdeutigkeit des hebräischen Verbs zwischen Ankunft und Wirkung besser offen als eine rein erklärende Wiedergabe.
