    rationale: Die hebräische Ellipse ist zulässig, doch im Deutschen wirkt „so der Faule in seinem Bett“ weniger vollständig. Die Wiederholung von „dreht sich“ expliziert nur die grammatisch vorausgesetzte Handlung.
