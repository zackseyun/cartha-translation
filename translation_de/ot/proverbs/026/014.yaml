  source_fidelity: Die Vergleichsstruktur und das Bild sind richtig erfasst. עַל צִירָהּ bezeichnet jedoch die Bewegung der Tür um/auf ihrem Drehpunkt, nicht eine Bewegung „in ihrer Angel“. Die Wiederaufnahme von „dreht sich“ im zweiten deutschen Glied macht die im Hebräischen elliptische, aber semantisch vorausgesetzte Bewegung idiomatisch deutlich, ohne sie näher auszudeuten.
  naturalness: „Wie sich eine Tür um ihre Angel dreht, so dreht sich ein Fauler in seinem Bett“ ist modernes, klares Standarddeutsch und bewahrt die knappe Sprichwortform. „In ihrer Angel“ ist weniger idiomatisch und räumlich ungenau.
  terminology: „Angel“ gibt צִיר in diesem Kontext treffend wieder. „Ein Fauler“ ist eine geläufige, generische Wiedergabe von עָצֵל und erhält den weisheitlichen Charakter ohne unnötige interpretative Zuspitzung.
  issues:
