  text: As a door turns on its hinge[a], so a sluggard on his bed.
translation:
  language: de
  text: Wie sich eine Tür um ihre Angel dreht, so dreht sich ein Fauler in seinem Bett.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדֶּלֶת
  choice: die Tür
  rationale: Der bestimmte Artikel wird beibehalten; im Deutschen kann „die Tür“ in einem Sprichwort natürlich eine Gattung bezeichnen.
- source_word: תִּסּוֹב
  choice: sich … dreht
  rationale: Die Form von סבב bezeichnet hier die wiederholte Drehbewegung der Tür. Die reflexive deutsche Wendung ist natürlich und bewahrt das Bild.
- source_word: עַל צִירָהּ
  choice: in ihrer Angel
  rationale: צִיר bezeichnet den Drehpunkt beziehungsweise die Angel einer Tür. Im Deutschen dreht sich eine Tür idiomatisch „in ihrer Angel“.
- source_word: וְעָצֵל
  choice: so der Faule
  rationale: עָצֵל ist die typische weisheitliche Bezeichnung für einen gewohnheitsmäßig trägen Menschen. „Der Faule“ ist verständlich und gibt den generischen bestimmten Artikel wieder; „so“ macht die im Hebräischen knapp nebeneinandergestellten Vergleichsglieder im Deutschen deutlich.
- source_word: עַל מִטָּתוֹ
  choice: in seinem Bett
  rationale: מִטָּה bezeichnet hier das Bett als Schlafplatz. Deutsch verwendet bei der Bewegung des Sich-Umdrehens idiomatisch „im Bett“ statt wörtlich „auf seinem Bett“.
theological_decisions: []
translation_notes:
  register: Knappes, einprägsames Sprichwort in modernem Standarddeutsch. Die ergänzte Vergleichsform „Wie … so …“ verdeutlicht die im hebräischen Parallelismus angelegte Analogie, ohne sie inhaltlich auszudeuten.
