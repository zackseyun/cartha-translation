  text: Like one who grabs a dog by the ears is a passerby who gets involved in a quarrel not his own[a].
translation:
  language: de
  text: Wer im Vorübergehen sich in einen Streit einmischt, der ihn nichts angeht, ist wie jemand, der einen Hund bei den Ohren packt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sich über einen Streit ereifert, der ihn nichts angeht“. Die hebräische Verbform ist selten und kann entweder das Einmischen oder ein zorniges Sich-Ereifern bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיק
  choice: der … packt
  rationale: Das Hifil-Partizip von חזק bezeichnet hier ein festes Ergreifen. „Packt“ gibt das anschauliche und gefährliche Zupacken natürlich wieder.
- source_word: בְּאָזְנֵי
  choice: bei den Ohren
  rationale: Die Präposition bezeichnet zusammen mit „Ohren“ die Stelle, an der der Hund gepackt wird; „bei den Ohren“ ist dafür die natürliche deutsche Wendung.
- source_word: כָלֶב
  choice: einen Hund
  rationale: Die konkrete Einzahl des hebräischen Vergleichs bleibt erhalten.
- source_word: עֹבֵר
  choice: ein Vorübergehender
  rationale: Das substantivisch gebrauchte Qal-Partizip bezeichnet jemanden, der gerade vorbeigeht und ursprünglich nicht beteiligt ist.
- source_word: מִתְעַבֵּר
  choice: sich … einmischt
  rationale: Das schwierige Hitpael von עבר bezeichnet im Zusammenhang wahrscheinlich das eigenmächtige Eingreifen in einen fremden Streit. „Sich einmischt“ ist im Deutschen idiomatisch und wahrt den tadelnden Ton.
- source_word: עַל רִיב
  choice: in einen Streit
  rationale: Die Verbindung wird dem deutschen Sprachgebrauch entsprechend mit „sich in einen Streit einmischen“ wiedergegeben.
- source_word: לֹא לוֹ
  choice: der ihn nichts angeht
  rationale: Die Wendung bringt knapp und natürlich zum Ausdruck, dass der Streit nicht zu seinem eigenen Anliegen gehört.
