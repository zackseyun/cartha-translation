  text: A lying tongue hates those it crushes[c][b][a], and a flattering mouth causes ruin.
translation:
  language: de
  text: Eine Lügenzunge hasst die, die sie zerschlagen hat[a], und ein schmeichelnder Mund richtet Verderben an[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Zerschlagenen«; auch: »die von ihr Verwundeten« oder »Unterdrückten«. Das Hebräische bezeichnet ihre Opfer als Menschen, die zerschlagen oder niedergedrückt worden sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »ein glatter Mund«. Gemeint ist schmeichelnde oder täuschend gefällige Rede. Oder: »bewirkt den Sturz« beziehungsweise »führt zum Zusammenbruch«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן שֶׁקֶר
  choice: eine Lügenzunge
  rationale: Die Verbindung bedeutet wörtlich »Zunge der Lüge/Falschheit«. »Lügenzunge« ist im Deutschen verständlich und bewahrt die Personifikation.
- source_word: יִשְׂנָא
  choice: hasst
  rationale: Das Yiqtol formuliert hier eine allgemeine, sprichwörtliche Wahrheit; daher steht im Deutschen das Präsens.
- source_word: דַכָּיו
  choice: die, die sie zermalmt
  rationale: Die Form bezeichnet einen oder mehrere Zermalmte beziehungsweise Unterdrückte. Die Wiedergabe macht den naheliegenden Bezug zur Lügenzunge deutlich, ohne die Gewaltsamkeit des Ausdrucks abzuschwächen.
- source_word: וּפֶה חָלָק
  choice: und ein glatter Mund
  rationale: Die wörtliche Metapher »glatter Mund« bleibt erhalten; im Zusammenhang bezeichnet sie schmeichelnde oder täuschend gefällige Rede.
- source_word: יַעֲשֶׂה
  choice: bewirkt
  rationale: Das Verb »tun/machen« drückt zusammen mit מִדְחֶה das Hervorbringen einer schädlichen Folge aus. »Bewirkt« ist knapp und idiomatisch.
- source_word: מִדְחֶה
  choice: den Sturz
  rationale: Das seltene Substantiv bezeichnet Sturz, Zusammenbruch oder Verderben. »Sturz« wahrt das konkrete Bild und lässt dessen genaue Ausprägung offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und die Personifikation der schädlichen Rede bleiben erhalten. »Glatter Mund« bewahrt bewusst das hebräische Bild und wird in der Fußnote erläutert.
