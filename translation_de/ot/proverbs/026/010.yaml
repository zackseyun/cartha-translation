  yaml_path: translation/ot/proverbs/026/010.yaml
  text: Like an archer who wounds everyone is one who hires a fool or hires passersby[a][b].
translation:
  language: de
  text: Wie ein Schütze, der jeden verwundet,[a] so ist der, der einen Toren anstellt oder beliebige Vorübergehende anstellt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist hier berüchtigt schwer verständlich. „Wie ein Schütze, der jeden verwundet“ folgt einer alten Auslegung. Wörtlichere Deutungen des Anfangs lauten etwa: „Ein Großer bringt alles hervor“; sie ergeben im Zusammenhang jedoch einen weniger klaren Sinn.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „einen Toren anstellt und jeden Vorübergehenden anstellt“. Gemeint ist offenbar wahlloses Anstellen, durch das Schaden entsteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב
  choice: ein Schütze
  rationale: Der hebräische Konsonantentext ist an dieser Stelle äußerst schwierig. Die traditionsreiche Deutung als Schütze ergibt zusammen mit dem folgenden Partizip ein verständliches Bild für wahllos verursachten Schaden; die gewöhnliche Bedeutung „groß“ führt hier zu einem kaum verständlichen Satz.
- source_word: מְחוֹלֵל
  choice: der … verwundet
  rationale: Im Bild des Schützen bezeichnet das Partizip eine verletzende Handlung. „Verwundet“ ist im Deutschen natürlich und lässt offen, ob die Verletzung tödlich ist.
- source_word: כֹּל
  choice: jeden
  rationale: Im Zusammenhang mit einem Schützen ist das umfassende Objekt am plausibelsten auf Menschen bezogen. „Jeden“ bringt den wahllosen Charakter der Handlung knapp zum Ausdruck.
- source_word: וְשֹׂכֵר
  choice: ist, wer … anstellt
  rationale: Die Verknüpfung wird als Vergleich zwischen dem Schützen und dem leichtfertigen Arbeitgeber wiedergegeben. Das im Deutschen ergänzte „ist, wer“ macht diese Beziehung verständlich.
- source_word: כְּסִיל
  choice: einen Toren
  rationale: „Tor“ ist die geläufige, würdige Wiedergabe des Weisheitsbegriffs כסיל und bewahrt dessen moralische wie verstandesbezogene Dimension.
- source_word: וְשֹׂכֵר
  choice: oder … anstellt
  rationale: Die Wiederholung des Partizips stellt wahrscheinlich eine zweite Form desselben wahllosen Anstellens vor. „Oder“ gibt diese Alternative idiomatisch wieder, ohne die mögliche koordinierende Lesart zu verschweigen.
- source_word: עֹבְרִים
  choice: irgendwelche Vorübergehenden
  rationale: Das Wort bezeichnet Menschen, die vorübergehen. „Irgendwelche“ verdeutlicht, dass beliebige, zufällig angetroffene Personen angestellt werden, und damit den wahllosen Charakter des Handelns.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in knapper sprichwörtlicher Form. „Schütze“ vermeidet die im Hebräischen nicht ausdrücklich genannte Spezifizierung als Bogenschütze; „anstellt“ passt zum beruflichen Kontext und ist natürlicher als „mietet“.
