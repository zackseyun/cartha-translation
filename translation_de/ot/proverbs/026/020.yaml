base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/020.yaml
  text: For lack of wood[a], the fire goes out, and where there is no whisperer, strife grows quiet.
translation:
  language: de
  text: Fehlt es an Holz, erlischt das Feuer; und wo niemand Klatsch verbreitet[a], legt sich der Streit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wo kein Einflüsterer ist“. Das hebräische Wort bezeichnet jemanden, der heimlich oder murmelnd schädigendes Gerede verbreitet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶפֶס עֵצִים
  choice: Fehlt es an Holz
  rationale: Die Verbindung bezeichnet das Fehlen von Brennmaterial. Die deutsche Formulierung ist natürlich, knapp und bewahrt den ursächlichen Zusammenhang.
- source_word: תִּכְבֶּה אֵשׁ
  choice: erlischt das Feuer
  rationale: Das Verb כבה bezeichnet hier das Ausgehen eines Feuers. „Erlischt“ gibt die intransitive Aussage prägnant und in gehobenem, aber geläufigem Deutsch wieder.
- source_word: וּבְאֵין
  choice: und wo niemand
  rationale: Die Wendung drückt parallel zum ersten Halbvers die Abwesenheit einer Person aus. „Wo niemand“ ist im Deutschen idiomatisch und erhält die allgemeingültige Aussage.
- source_word: נִרְגָּן
  choice: Gerüchte verbreitet
  rationale: Das Substantiv bezeichnet einen Menschen, der murmelnd oder heimlich schädigendes Gerede weiterträgt. Die verbale Wiedergabe ist im modernen Deutsch verständlicher als seltene Personenbezeichnungen wie „Ohrenbläser“ und legt den Begriff nicht ausschließlich auf Verleumdung fest.
- source_word: יִשְׁתֹּק מָדוֹן
  choice: legt sich der Streit
  rationale: שתק bedeutet still oder ruhig werden. „Der Streit legt sich“ bewahrt das Bild des Abklingens, ohne zwingend ein endgültiges Ende zu behaupten.
