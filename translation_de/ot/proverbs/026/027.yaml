  text: כֹּֽרֶה שַּׁ֭חַת בָּ֣/הּ יִפֹּ֑ל וְ/גֹ֥לֵ֥ל אֶ֝בֶן אֵלָ֥י/ו תָּשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/027.yaml
  text: Whoever digs a pit will fall into it[a], and he who rolls a stone, it will come back on him.
translation:
  language: de
  text: Wer eine Grube gräbt, wird hineinfallen, und wer einen Stein wälzt, auf den wird er zurückrollen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּרֶה
  choice: Wer … gräbt
  rationale: Das substantivisch gebrauchte Qal-Partizip bezeichnet allgemein jeden, der so handelt; die deutsche Wer-Konstruktion gibt diesen sprichwörtlichen Sinn natürlich wieder.
- source_word: שַּׁחַת
  choice: eine Grube
  rationale: „Grube“ ist die übliche und bildkräftige Wiedergabe und lässt offen, ob sie ausdrücklich als Falle angelegt wurde.
- source_word: בָּהּ יִפֹּל
  choice: wird hineinfallen
  rationale: Das Suffix bezieht sich auf die Grube; „hineinfallen“ ist im Deutschen idiomatisch. Das Futur gibt die vorhersehbare Folge des Handelns wieder.
- source_word: וְגֹלֵל אֶבֶן
  choice: und wer einen Stein wälzt
  rationale: Das zweite substantivische Partizip steht parallel zum ersten. „Wälzt“ bewahrt das konkrete Bild eines in Bewegung gesetzten schweren Steins.
- source_word: אֵלָיו תָּשׁוּב
  choice: auf den wird er zurückrollen
  rationale: Das feminine Verb bezieht sich auf אֶבֶן; im Deutschen nimmt „er“ das maskuline „Stein“ wieder auf. „Auf den“ bewahrt die Vorstellung, dass der Stein schädlich auf den Handelnden zurückkommt.
theological_decisions: []
