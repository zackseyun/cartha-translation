  source_fidelity: Die Übersetzung gibt beide substantivisch gebrauchten Partizipien angemessen generisch mit „Wer …“ wieder. „Grube“ entspricht שׁחת, „wird hineinfallen“ bewahrt die prädiktive/regelmäßige Folge von יִפֹּל, und der rückkehrende Stein ist durch das maskuline Pronomen korrekt auf „Stein“ bezogen. „Auf den wird er zurückrollen“ bildet אֵלָיו תָּשׁוּב als schädliche Rückwirkung treffend ab, ohne die Bildsprache zu überdeuten.
  naturalness: Modernes, klares Standarddeutsch mit passendem sprichwörtlichem Rhythmus. Die Voranstellung „auf den“ ist leicht gehoben, aber in diesem Weisheitsspruch natürlich und präzise.
