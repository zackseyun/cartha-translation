source:
  edition: WLC
  text: כֶּ֣סֶף סִ֭יגִים מְצֻפֶּ֣ה עַל חָ֑רֶשׂ שְׂפָתַ֖יִם דֹּלְקִ֣ים וְ/לֶב רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/023.yaml
  text: Like silver dross overlaid on earthenware are fervent lips with an evil heart[a].
translation:
  language: de
  text: Wie Silberschlacke, die auf ein Tongefäß aufgetragen ist, sind glühende Lippen[a] und ein böses Herz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »brennende Lippen«; das hebräische Partizip bezeichnet wörtlich etwas Brennendes oder Glühendes und beschreibt hier Rede, die besonders warm, eifrig oder eindringlich klingt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף סִיגִים
  choice: Silberschlacke
  rationale: Die Wortverbindung bezeichnet den unreinen Rückstand der Silberverarbeitung, nicht reines Silber. »Silberschlacke« bewahrt den Kontrast zwischen glänzendem Schein und wertlosem Stoff.
- source_word: מְצֻפֶּה
  choice: die … überzieht
  rationale: Das passive Partizip bezeichnet eine aufgebrachte Deckschicht. Die verbale Formulierung klingt im Deutschen natürlich und lässt erkennen, dass lediglich die Oberfläche bedeckt ist.
- source_word: עַל חָרֶשׂ
  choice: einen Tonscherben
  rationale: חָרֶשׂ kann Tonware beziehungsweise eine Tonscherbe bezeichnen. »Tonscherben« bildet den billigen, zerbrechlichen Untergrund anschaulich ab, ohne ein bestimmtes Gefäß vorauszusetzen.
- source_word: שְׂפָתַיִם
  choice: Lippen
  rationale: Die wörtliche Körpermetapher ist auch im Deutschen verständlich und richtet den Blick auf den äußeren sprachlichen Ausdruck.
- source_word: דֹּלְקִים
  choice: glühende
  rationale: Das Partizip ruft wörtlich Hitze beziehungsweise Brennen hervor. »Glühende« bewahrt dieses Bild und kann zugleich intensiv, herzlich oder eifrig klingende Rede bezeichnen, ohne sie vorschnell als Schmeichelei festzulegen.
- source_word: וְלֶב רָע
  choice: und ein böses Herz
  rationale: Die koordinierende Wiedergabe bewahrt das hebräische וְ und die Spannung zwischen dem warm wirkenden Reden und der inneren Bosheit. »Herz« bezeichnet dabei die innere Haltung und Absicht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Bildsprache und die Parallelität des hebräischen Spruchs bleiben erhalten; die ungewöhnliche Formulierung »glühende Lippen« wird durch eine Fußnote erläutert.
