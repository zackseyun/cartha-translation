  text: So is the man who deceives his neighbor and says[b][a], “Am I not only joking?”
translation:
  language: de
  text: 'So ist es mit einem Mann, der seinen Nächsten[a] täuscht und sagt: »Scherze ich nicht nur?[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Mitmenschen“, „seinen Freund“ oder „seinen Gefährten“. Das hebräische רֵעַ kann je nach Zusammenhang einen Nächsten, Freund oder anderen Menschen aus dem sozialen Umfeld bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Spiele ich nicht?“ Das hebräische Wort kann Spielen oder Scherzen bezeichnen; hier dient es als verharmlosende Ausrede für die Täuschung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: So ist
  rationale: Leitet den Vergleich mit dem Bild im vorhergehenden Vers ein und wahrt dessen analogische Kraft.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Gibt den unbestimmten maskulinen Singular direkt wieder; im Spruch bezeichnet er einen exemplarischen Einzelfall.
- source_word: רִמָּה
  choice: täuscht
  rationale: Bewahrt den moralischen Gehalt einer vorsätzlichen Irreführung, ohne eine speziellere Form des Betrugs festzulegen.
- source_word: רֵעֵהוּ
  choice: seinen Mitmenschen
  rationale: Deckt in natürlichem Deutsch den breiten Bezug von רֵעַ auf einen anderen Menschen im sozialen Nahbereich ab, ohne eine Freundschaft vorauszusetzen.
- source_word: וְאָמַר
  choice: und sagt
  rationale: Das Präsens passt zur allgemeinen Charakterisierung in einem Spruch; die waw-Verbindung wird schlicht mit »und« wiedergegeben.
- source_word: הֲלֹא
  choice: doch
  rationale: Das Modalwort gibt in der deutschen Aussage die rhetorische, Zustimmung erwartende und sich rechtfertigende Wirkung von הֲלֹא idiomatisch wieder.
- source_word: מְשַׂחֵק
  choice: Spaß gemacht
  rationale: שׂחק kann Spielen, Scherzen oder Spotten bezeichnen. Die Formulierung erfasst hier die nachträgliche Verharmlosung der Täuschung, ohne die lexikalische Spannweite im Haupttext auszubreiten.
- source_word: אֲנִי
  choice: ich
  rationale: Das ausdrücklich gesetzte Pronomen bleibt erhalten und trägt zur Selbstrechtfertigung des Sprechers bei.
theological_decisions:
- issue: Reichweite von רֵעַ
  choice: Mitmensch
  alternative: Nachbar; Freund; Gefährte
  rationale: Der Kontext legt keine bestimmte soziale Beziehung fest. »Mitmensch« bewahrt die ethische Breite, während die engeren Möglichkeiten in der Fußnote genannt werden.
- issue: Form der Selbstrechtfertigung
  choice: Aussage mit »doch nur«
  alternative: 'Rhetorische Frage: »Habe ich nicht nur gescherzt?«'
  rationale: Das Hebräische ist formal eine rhetorische Frage. Im modernen Deutschen vermittelt die entschuldigende Aussage mit »doch nur« denselben pragmatischen Ton natürlicher; die formale Alternative wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die direkte Rede klingt bewusst wie eine alltägliche Ausrede. Der Vergleichsanschluss an Vers 18 bleibt durch »So ist« sichtbar; die eigenständige Lektüre des Verses setzt daher den vorangehenden Kontext voraus.
