  text: כָּל בָּ֭אֶי/הָ לֹ֣א יְשׁוּב֑וּ/ן וְ/לֹֽא יַ֝שִּׂ֗יגוּ אָרְח֥וֹת חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/019.yaml
  text: All who go in to her do not return, nor do they regain the paths of life.
translation:
  language: de
  text: Alle, die zu ihr hineingehen, kehren nicht zurück und erreichen die Pfade des Lebens nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֶיהָ
  choice: die zu ihr hineingehen
  rationale: Gibt die Bewegung „zu ihr hinein“ im Kontext ihres Hauses natürlich wieder und bewahrt zugleich die mögliche sexuelle Nebenbedeutung.
- source_word: יְשׁוּבוּן
  choice: kehren nicht zurück
  rationale: Entspricht der Grundbedeutung von שׁוב und erhält die nachdrückliche Aussage des hebräischen Verses.
- source_word: יַשִּׂיגוּ
  choice: gelangen nicht wieder auf
  rationale: שׂג kann „erreichen, erlangen“ bedeuten. In Verbindung mit Wegen und dem vorherigen „zurückkehren“ formuliert „gelangen nicht wieder auf“ idiomatisch das erneute Erreichen dieser Pfade, ohne die Aussage abzuschwächen.
- source_word: אָרְחוֹת חַיִּים
  choice: die Pfade des Lebens
  rationale: Bewahrt das poetische Wegbild und gibt den Plural sowie die Lebensmetaphorik eng am Hebräischen wieder.
theological_decisions:
- issue: Reichweite der Aussage, dass die Hineingehenden nicht zurückkehren
  choice: Als uneingeschränkte weisheitliche Warnung im Wortlaut wiedergegeben
  alternative: Durch Zusätze wie „nur selten“ oder „gewöhnlich nicht“ abschwächen
  rationale: Der hebräische Text formuliert absolut. Die Übersetzung soll die Spannung dieser sprichwörtlichen Aussage bewahren und sie nicht durch eine systematische Deutung relativieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem poetischem Parallelismus. „Hineingehen“ ist verständlich und lässt die kontextuelle Doppeldeutigkeit bestehen; „Pfade des Lebens“ erhält das Weisheitsbild.
