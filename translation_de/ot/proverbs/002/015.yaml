  text: deren Pfade krumm sind und die auf ihren Wegen verdreht sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: deren … und die
  rationale: Das Relativpronomen knüpft an die männliche Mehrzahl des vorausgehenden Verses an. Die zweiteilige deutsche Konstruktion gibt beide parallelen Aussagen natürlich wieder.
- source_word: אָרְחֹתֵיהֶם
  choice: ihre Pfade
  rationale: אֹרַח bezeichnet einen Pfad oder übertragen den Lebenswandel. „Pfade“ bewahrt das konkrete Wegbild.
- source_word: עִקְּשִׁים
  choice: krumm
  rationale: Das Adjektiv bezeichnet etwas Verdrehtes oder moralisch Verkehrtes. „Krumm“ erhält zugleich die räumliche Metapher und ihren ethischen Sinn.
- source_word: וּנְלוֹזִים
  choice: abirren
  rationale: Die Form bezeichnet ein Abweichen oder Sich-Abwenden. Das verbale „abirren“ klingt im Deutschen natürlicher als eine substantivnahe Wiedergabe und bewahrt das Wegmotiv.
- source_word: בְּמַעְגְּלוֹתָם
  choice: auf ihren Wegen
  rationale: מַעְגָּל bezeichnet Bahn, Pfad oder Weg. „Auf ihren Wegen“ ist idiomatisch und bildet mit „Pfade“ eine natürliche poetische Parallele.
