  text: כִּֽי יְשָׁרִ֥ים יִשְׁכְּנוּ אָ֑רֶץ וּ֝/תְמִימִ֗ים יִוָּ֥תְרוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/021.yaml
  text: For the upright will dwell in the land[a], and the blameless will remain in it.
translation:
  language: de
  text: Denn die Aufrichtigen werden im Land[a] wohnen, und die Untadeligen werden darin bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Erde“. Das hebräische Wort אָרֶץ kann sowohl „Land“ als auch „Erde“ bedeuten. Hier wurde „Land“ gewählt, weil der Zusammenhang das Bleiben in beziehungsweise das Entferntwerden aus einem Lebensraum betont.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet hier die vorausgehende Aufforderung beziehungsweise Verheißung und stellt in natürlichem Deutsch den logischen Zusammenhang her.
- source_word: יְשָׁרִים
  choice: die Aufrichtigen
  rationale: Das Adjektiv bezeichnet Menschen, die moralisch gerade und rechtschaffen sind. „Die Aufrichtigen“ gibt diesen ethischen Sinn wieder, ohne den Ausdruck mit einem spezifischeren Begriff für „Gerechte“ gleichzusetzen.
- source_word: יִשְׁכְּנוּ
  choice: werden wohnen
  rationale: Das Verb שכן bezeichnet beständiges Wohnen oder Ansässigsein. „Werden wohnen“ wahrt den dauerhaften Charakter und passt zum würdevollen Ton der Weisheitsliteratur.
- source_word: אָרֶץ
  choice: im Land
  rationale: אָרֶץ kann sowohl „Land“ als auch „Erde“ bedeuten. Im Gegensatz zum Entferntwerden im folgenden Vers bezeichnet „Land“ anschaulich den bewohnbaren Lebensraum, ohne die mögliche weitere Bedeutung zu leugnen.
- source_word: וּתְמִימִים
  choice: und die Untadeligen
  rationale: תְמִימִים beschreibt Menschen von Integrität, Ganzheit und untadeligem Wandel. „Die Untadeligen“ ist im Deutschen verständlich und bildet eine passende Parallele zu „die Aufrichtigen“.
- source_word: יִוָּתְרוּ
  choice: werden bleiben
  rationale: Der Niphal von יתר bedeutet, übrig gelassen zu werden oder zu verbleiben. „Werden bleiben“ drückt hier die fortdauernde Anwesenheit natürlich aus, ohne ausdrücklich festzulegen, durch wen sie bewahrt werden.
- source_word: בָהּ
  choice: darin
  rationale: Das Suffix verweist auf אָרֶץ zurück. „Darin“ erhält diesen Rückbezug knapp und idiomatisch.
theological_decisions:
- issue: Bedeutungsumfang von אָרֶץ
  choice: Land
  alternative: Erde
  rationale: Der Zusammenhang von Bleiben und Entferntwerden legt einen konkreten bewohnbaren Lebensraum nahe. „Land“ bewahrt diesen Sinn und mögliche Anklänge an die Landverheißung, ohne den Vers auf eine enge territoriale Lehre festzulegen; „Erde“ bleibt lexikalisch möglich und wird deshalb in der Fußnote genannt.
- issue: Bedeutung des Niphal יִוָּתְרוּ
  choice: werden bleiben
  alternative: werden übrig gelassen werden
  rationale: Die passive Form kann ein Übriggelassen- oder Bewahrtwerden andeuten. Die Übersetzung „werden bleiben“ gibt das Ergebnis wieder und lässt offen, ob der Schwerpunkt auf göttlicher Bewahrung oder schlicht auf fortdauernder Anwesenheit liegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit einem würdevollen, für Weisheitsliteratur angemessenen Ton. Der Parallelismus des Hebräischen bleibt erhalten; „wohnen“ und „bleiben“ geben die beiden unterschiedlichen Verben wieder.
