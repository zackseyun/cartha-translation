  text: indem du dein Ohr der Weisheit zuwendest, dein Herz zur Einsicht neigst,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַקְשִׁיב
  choice: indem du … zuwendest
  rationale: Der Hifil-Infinitiv von קשׁב bezeichnet ein bewusstes Aufmerksam-Machen bzw. Hinhören. Die Formulierung wahrt die syntaktische Abhängigkeit vom vorigen Vers und klingt im Deutschen natürlich.
- source_word: לַחָכְמָה
  choice: der Weisheit
  rationale: Die Präposition ל bezeichnet hier die Richtung beziehungsweise den Gegenstand der Aufmerksamkeit.
- source_word: אָזְנֶךָ
  choice: dein Ohr
  rationale: Der hebräische Singular mit Suffix wird beibehalten und bewahrt das konkrete Bild des aufmerksamen Hörens.
- source_word: תַּטֶּה
  choice: neigst
  rationale: נטה kann »neigen«, »wenden« oder »ausstrecken« bedeuten. »Neigst« erhält das poetische Bild und den Parallelismus.
- source_word: לִבְּךָ
  choice: dein Herz
  rationale: לֵב bezeichnet den inneren Menschen einschließlich Denken, Wollen und Empfinden. »Herz« bewahrt diese Bedeutungsbreite besser als »Verstand«.
- source_word: לַתְּבוּנָה
  choice: zur Einsicht
  rationale: תְּבוּנָה bezeichnet in den Sprüchen verständige Einsicht beziehungsweise Urteilsvermögen. »Einsicht« ist prägnant und bildet ein natürliches Begriffspaar mit »Weisheit«.
