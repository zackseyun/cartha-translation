  terminology: „Weisheit“, „Herz“ und „Einsicht“ sind für חכמה, לב und תבונה treffend. „Einsicht“ bildet im Deutschen ein idiomatisches und semantisch angemessenes Paar mit „Weisheit“, ohne die Bedeutung auf bloßes intellektuelles Wissen zu verengen.
