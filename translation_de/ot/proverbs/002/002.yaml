  source_fidelity: Die Übersetzung gibt die vom vorigen Vers abhängige Infinitivkonstruktion sachgerecht mit „indem“ wieder. „Dein Ohr der Weisheit zuwendest“ vermittelt die gezielte Ausrichtung des Hifil von קשב; „dein Herz zur Einsicht neigst“ entspricht dem Bild von נטה und bewahrt den Parallelismus. Singularformen und die maskuline Anrede des Hebräischen sind korrekt berücksichtigt.
