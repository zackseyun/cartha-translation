  text: לִ֭/נְצֹר אָרְח֣וֹת מִשְׁפָּ֑ט וְ/דֶ֖רֶךְ חסיד/ו יִשְׁמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/008.yaml
  text: to guard the paths of justice[a], and he watches over the way of his faithful ones.
translation:
  language: de
  text: um die Pfade des Rechts zu behüten, und er bewahrt den Weg seiner Getreuen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Ketiv (geschriebene Form) lautet singularisch: »seines Getreuen«; die Qere-Lesung wird pluralisch verstanden: »seiner Getreuen«. Das Wort bezeichnet Menschen, die von Treue, Loyalität und Frömmigkeit geprägt sind.'
    reason: Text- und Bedeutungsvariante bei חסיד/ו.
lexical_decisions:
- source_word: לִנְצֹר
  choice: zu behüten
  rationale: Der Infinitiv schließt als Zweck- bzw. Folgeangabe an den vorherigen Zusammenhang an. »Behüten« gibt den schützenden Sinn von נצר wieder und passt natürlich zu »Pfade«.
- source_word: אָרְחוֹת
  choice: die Pfade
  rationale: Das Substantiv bezeichnet Wege oder Pfade. »Pfade« bewahrt den bildhaften Charakter und die Variation gegenüber dem folgenden דֶרֶךְ.
- source_word: מִשְׁפָּט
  choice: des Rechts
  rationale: Hier bezeichnet מִשְׁפָּט die sittlich und rechtlich gerechte Ordnung. »Recht« ist im Deutschen in der Verbindung »Pfade des Rechts« prägnant und lässt sowohl den juridischen als auch den ethischen Aspekt anklingen.
- source_word: וְדֶרֶךְ
  choice: und ... den Weg
  rationale: »Weg« ist die natürliche Entsprechung und erhält die hebräische Abwechslung zwischen den pluralischen »Pfaden« und dem singularischen »Weg«.
- source_word: חסיד/ו
  choice: seiner Getreuen
  rationale: חסיד bezeichnet einen Menschen, der sich durch Treue, Loyalität und Frömmigkeit auszeichnet. Die pluralische Wiedergabe folgt der masoretisch überlieferten Lesetradition bzw. dem im Kontext naheliegenden kollektiven Sinn; die abweichende singularische Konsonantenform wird in der Fußnote kenntlich gemacht.
- source_word: יִשְׁמֹר
  choice: er bewahrt
  rationale: שׁמר bezeichnet schützendes Bewahren oder Hüten. »Bewahrt« vermeidet die unmittelbare Wiederholung von »behüten«, ohne den Schutzgedanken aufzugeben; das Subjekt ist aus dem Kontext Gott.
theological_decisions:
- issue: Unausgesprochenes Subjekt von יִשְׁמֹר
  choice: Gott als das aus dem Zusammenhang fortgeführte Subjekt (»er«)
  alternative: ein unbestimmtes oder allgemeines Subjekt
  rationale: In Sprüche 2,6–8 ist der HERR der Handelnde, der Weisheit gibt, Hilfe bereithält und schützt. Vers 8 führt diese Aussage fort, ohne das Subjekt erneut zu nennen.
- issue: Numerus und Bedeutung von חסיד/ו
  choice: 'pluralisch: »seiner Getreuen«'
  alternative: 'singularisch: »seines Getreuen«; außerdem möglich: »seines Frommen« bzw. »seiner Frommen«'
  rationale: Die Textüberlieferung lässt zwischen einer singularischen Konsonantenform und einer pluralisch verstandenen Lesung unterscheiden. Der Haupttext folgt der geläufigen pluralischen Lesetradition, während die Fußnote die echte textliche und lexikalische Mehrdeutigkeit bewahrt. »Getreue« bringt Loyalität und Frömmigkeit zum Ausdruck, ohne einen späteren kirchlichen Fachbegriff wie »Heilige« einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wegmetaphorik und der Wechsel zwischen »Pfade« und »Weg« bleiben erhalten. Der Versanfang bleibt als Infinitivkonstruktion formuliert, weil er syntaktisch an den vorherigen Vers anschließt.
