id: PRO.2.5
reference: Proverbs 2:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָ֗ז תָּ֭בִין יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת אֱלֹהִ֣ים תִּמְצָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/005.yaml
  text: Then you will understand the fear of Yahweh and find the knowledge of God[a].
translation:
  language: de
  text: Dann wirst du die Furcht vor Jahwe verstehen und die Erkenntnis Gottes finden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das Zeitadverb bezeichnet zugleich die Folge der in den vorangehenden Versen genannten Bedingungen; „Dann“ bewahrt diese zeitlich-logische Funktion knapp und natürlich.
- source_word: תָּבִין
  choice: wirst du … verstehen
  rationale: Das Qal-Imperfekt 2. Person Singular von בין bezeichnet das Erlangen von Verständnis oder Einsicht. „verstehen“ ist im Deutschen natürlich und erhält die Verbindung zum Weisheitskontext.
- source_word: יִרְאַת יְהוָה
  choice: die Furcht vor Jahwe
  rationale: Die Konstruktverbindung bezeichnet eine auf Jahwe gerichtete, ehrfürchtige Furcht. „Furcht“ wahrt die volle Spannung des Weisheitsbegriffs und schwächt ihn nicht auf bloße Achtung ab; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְדַעַת אֱלֹהִים
  choice: und die Erkenntnis Gottes
  rationale: דַּעַת bedeutet Erkenntnis bzw. Wissen; אֱלֹהִים bezeichnet hier Gott. „Erkenntnis Gottes“ bewahrt die knappe Genitivkonstruktion und ihre mögliche Bedeutungsweite.
- source_word: תִּמְצָא
  choice: finden
  rationale: Das Qal-Imperfekt 2. Person Singular von מצא bedeutet gewöhnlich „finden“ und hält zugleich den Bezug zum vorausgehenden Suchen aufrecht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von יִרְאַת יְהוָה
  choice: Furcht vor Jahwe
  alternative: Ehrfurcht vor Jahwe
  rationale: „Furcht“ erhält sowohl das Moment ehrfürchtiger Hinwendung als auch den stärkeren Bedeutungsgehalt des hebräischen יִרְאָה; „Ehrfurcht“ allein könnte die Spannung einengen.
- issue: Genitiv in דַעַת אֱלֹהִים
  choice: Erkenntnis Gottes
  alternative: Erkenntnis von Gott
  rationale: Die formale Genitivwendung lässt offen, welche Beziehungsnuancen mitschwingen. Im unmittelbaren Parallelismus ist vor allem die Erkenntnis gemeint, die Gott zum Gegenstand hat; die knappe Form sollte nicht weiter ausgedeutet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die feste Weisheitsformel bleibt in ihrer kräftigen, theologisch offenen Ausdrucksweise erhalten; der Parallelismus „verstehen … finden“ wird bewahrt.
