  verdict: revise
  source_fidelity: 'Die Grundbedeutungen sind zutreffend: אָז wird folgernd mit „Dann“ wiedergegeben, und die vier Akkusativobjekte zu „verstehen“ erfassen die hebräische Reihung. Die fehlende Konjunktion vor כָּל מַעְגַּל טוֹב lässt eine knappe bzw. zusammenfassende Beziehung offen, verlangt im Deutschen jedoch keine syntaktisch unhaltbare Apposition.'
  naturalness: '„Dann wirst du Gerechtigkeit, Recht und Geradheit verstehen, jeden guten Pfad“ ist im modernen Standarddeutsch nicht idiomatisch konstruiert: Der nachgestellte Akkusativ lässt sich nicht natürlich als Apposition zu den abstrakten Begriffen lesen. „Geradheit“ ist zwar etymologisch nachvollziehbar, wirkt aber ungebräuchlich. „Aufrichtigkeit“ ist eine natürliche, angemessene Wiedergabe.'
  terminology: „Gerechtigkeit“ für צֶדֶק und „Recht“ für מִשְׁפָּט bewahren sinnvoll die Unterscheidung. „Aufrichtigkeit“ für מֵישָׁרִים gibt die ethische Bildlichkeit des Geraden idiomatisch wieder, ohne sie theologisch einzuengen. „Pfad“ bewahrt die Weisheitsmetapher.
  issues:
