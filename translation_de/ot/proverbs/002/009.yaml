base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/009.yaml
  text: Then you will understand righteousness and justice and equity[a], every good path.
translation:
  language: de
  text: Dann wirst du Gerechtigkeit, Recht, Aufrichtigkeit und jeden guten Pfad verstehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das temporale beziehungsweise folgernde Adverb verbindet die Aussage mit den vorausgehenden Bedingungen und wird im Deutschen natürlich mit „Dann“ wiedergegeben.
- source_word: תָּבִין
  choice: wirst du … verstehen
  rationale: Das Qal-Imperfekt von בין bezeichnet das Verstehen oder Unterscheidenlernen; „verstehen“ ist klar und lässt die Bedeutungsbreite im Weisheitskontext bestehen.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: Der Begriff bezeichnet hier das ethisch Rechte. „Gerechtigkeit“ bewahrt sein moralisches Gewicht, ohne ihn mit dem folgenden מִשְׁפָּט gleichzusetzen.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: מִשְׁפָּט kann gerichtliches Urteil, gerechte Ordnung oder Recht bezeichnen. „Recht“ unterscheidet den Ausdruck im Deutschen knapp von צֶדֶק.
- source_word: מֵישָׁרִים
  choice: Geradheit
  rationale: Der Plural beruht auf der Vorstellung des Geraden und bezeichnet übertragen moralische Aufrichtigkeit beziehungsweise lauteres Handeln. „Geradheit“ erhält dieses Bild und die Abgrenzung von den beiden vorangehenden Begriffen.
- source_word: כָּל
  choice: jeden
  rationale: Vor dem singularischen מַעְגַּל ist die distributive Wiedergabe „jeden“ im Deutschen natürlich.
- source_word: מַעְגַּל
  choice: Pfad
  rationale: Das Wort bezeichnet eine Spur oder Bahn und in den Sprüchen bildlich den Lebensweg. „Pfad“ bewahrt die Metapher.
- source_word: טוֹב
  choice: guten
  rationale: Das Adjektiv beschreibt den Pfad umfassend als moralisch und praktisch gut, ohne die Bedeutung unnötig einzuengen.
theological_decisions:
- issue: Beziehung der Schlussphrase כָּל מַעְגַּל טוֹב zur vorausgehenden Dreiergruppe
  choice: 'Die Schlussphrase wird nach einem Komma als zusammenfassende beziehungsweise appositionelle Entfaltung wiedergegeben: „…, jeden guten Pfad.“'
  alternative: 'Sie könnte als zusätzliches Objekt mit ergänztem „und“ übersetzt werden: „… und jeden guten Pfad.“'
  rationale: Im Hebräischen steht vor כָּל keine Konjunktion. Das Komma bewahrt die knappe Reihung und lässt offen, ob die Schlussphrase zusammenfasst oder ein weiteres Objekt bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Weisheitsmetapher „Pfad“ bleibt erhalten; die knappe hebräische Reihung wird nicht durch zusätzliche Verknüpfungen geglättet.
