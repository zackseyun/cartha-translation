  text: וּ֭/רְשָׁעִים מֵ/אֶ֣רֶץ יִכָּרֵ֑תוּ וּ֝/בוֹגְדִ֗ים יִסְּח֥וּ מִמֶּֽ/נָּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/022.yaml
  text: But the wicked will be cut off from the land[b][a], and the treacherous will be uprooted from it.
translation:
  language: de
  text: Doch die Frevler werden aus dem Land ausgerottet[a], und die Treulosen werden daraus herausgerissen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Erde abgeschnitten“. Das hebräische Wort für „Land“ kann auch „Erde“ bedeuten; das Verb bedeutet wörtlich „abgeschnitten werden“.'
    reason: lexikalische Alternativen
  - marker: b
    text: 'Oder: „daraus weggerissen“. Das hebräische Verb bezeichnet eine gewaltsame Entfernung.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die moralisch schuldig und böse handeln. „Frevler“ ist im Deutschen knapp, würdevoll und für die Weisheitsliteratur passend.
- source_word: מֵאֶרֶץ
  choice: aus dem Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der unmittelbare Gegensatz zu den Aufrichtigen, die nach Vers 21 im Land bleiben, spricht hier für „Land“.
- source_word: יִכָּרֵתוּ
  choice: werden … ausgerottet
  rationale: Das Nifal von כרת bezeichnet ein Abgeschnitten- oder Beseitigtwerden. „Ausgerottet“ gibt die gewaltsame und endgültig wirkende Entfernung im natürlichen Deutschen wieder.
- source_word: בוֹגְדִים
  choice: die Treulosen
  rationale: Das Partizip von בגד bezeichnet Menschen, die treulos oder verräterisch handeln. „Die Treulosen“ bewahrt den charakterisierenden, fortdauernden Sinn.
- source_word: יִסְּחוּ
  choice: werden … herausgerissen
  rationale: Das Verb נסח bezeichnet ein gewaltsames Wegziehen oder Herausreißen. „Herausgerissen“ erhält diese Kraft und passt zur Ortsangabe.
- source_word: מִמֶּנָּה
  choice: daraus
  rationale: Das feminine Suffix verweist auf אֶרֶץ zurück. „Daraus“ ist idiomatisches Deutsch und vermeidet die schwerfällige Wiederholung „aus ihm“.
- source_word: וּ … וּ
  choice: Doch … und
  rationale: Die erste Konjunktion steht im Gegensatz zu Vers 21 und wird daher adversativ mit „Doch“ wiedergegeben; die zweite verbindet die parallelen Aussagen mit „und“.
theological_decisions:
- issue: Bedeutung von אֶרֶץ im weisheitlichen Zusammenhang
  choice: Land
  alternative: Erde
  rationale: Die Verse 21–22 stellen das Bleiben der Aufrichtigen im Land der Entfernung der Frevler aus demselben Gebiet gegenüber. „Land“ wahrt diesen unmittelbaren literarischen Zusammenhang, ohne eine umfassendere Aussage über die ganze Erde auszuschließen oder vorauszusetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Der Parallelismus und die starke Bildsprache der beiden Verben bleiben erhalten; die Mehrdeutigkeit von אֶרֶץ wird in der Fußnote ausgewiesen.
