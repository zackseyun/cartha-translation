  text: to rescue you from the strange woman[c][b][a], from the foreign woman whose words are smooth.
translation:
  language: de
  text: um dich vor einer fremden Frau zu bewahren, vor einer Außenstehenden[a], die mit schmeichelnden Worten[b] spricht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Bezeichnungen „fremde Frau“ und „Außenstehende“ stehen parallel. Sie können im Sprüchebuch eine Frau außerhalb der anerkannten sozialen oder ehelichen Ordnung bezeichnen; nicht zwingend ist allein ethnische Herkunft gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „die ihre Worte glatt gemacht hat“. Das Bild bezeichnet glatte, schmeichelnde oder verführerische Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: um dich ... zu retten
  rationale: 'Der Hifil-Infinitiv von נצל mit Suffix der 2. Person maskulin Singular bezeichnet hier den Zweck beziehungsweise die Wirkung der Weisheit: Sie rettet aus einer drohenden Gefahr.'
- source_word: מֵאִשָּׁה זָרָה
  choice: vor der fremden Frau
  rationale: זָרָה bedeutet zunächst „fremd“ und bezeichnet im Sprüchebuch häufig eine Frau außerhalb legitimer ehelicher oder sozialer Bindungen. Die wörtlichere Form bewahrt die Mehrdeutigkeit, ohne vorschnell „Ehebrecherin“ oder „verbotene Frau“ festzulegen.
- source_word: מִנָּכְרִיָּה
  choice: vor der Unbekannten
  rationale: נָכְרִיָּה bezeichnet eine Fremde beziehungsweise Außenstehende und steht parallel zu זָרָה. „Unbekannte“ vermeidet eine rein ethnische Deutung und lässt die zweite Bezeichnung als poetische Intensivierung derselben Figur erkennen.
- source_word: אֲמָרֶיהָ הֶחֱלִיקָה
  choice: die mit glatten Worten redet
  rationale: הֶחֱלִיקָה ist formal ein Hifil Perfekt Singular („sie hat glatt gemacht“) und bezieht sich auf ihre Worte. Die deutsche Formulierung erhält das Bild glatter, verführerischer Rede und klingt zugleich natürlich.
theological_decisions:
- issue: Identität der als זָרָה / נָכְרִיָּה bezeichneten Frau
  choice: Keine ausdrückliche Festlegung auf ethnische Fremdheit oder Ehebruch
  alternative: „Ausländerin“, „Ehebrecherin“ oder „verbotene Frau“
  rationale: Die hebräischen Begriffe tragen sowohl die Vorstellung des Fremd- beziehungsweise Außenseiterseins als auch im Kontext der Sprüche eine moralisch-sexuelle Warnfunktion. Der Haupttext soll diese Spannung nicht durch eine engere Deutung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „vor ... vor ...“ bewahrt den hebräischen Parallelismus; das Relativgefüge gibt die bildhafte Redeweise verständlich wieder.
