  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי תָב֣וֹא חָכְמָ֣ה בְ/לִבֶּ֑/ךָ וְ֝/דַ֗עַת לְֽ/נַפְשְׁ/ךָ֥ יִנְעָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/010.yaml
  text: For wisdom will enter your heart[b][a], and knowledge will be pleasant to your soul.
translation:
  language: de
  text: Denn Weisheit wird in dein Herz kommen[a], und Erkenntnis wird deiner Seele angenehm sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn Weisheit in dein Herz kommt.“'
    reason: alternative_reading
  - marker: b
    text: „Seele“ kann hier auch „Selbst“ oder „Leben“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: כִּי führt hier am natürlichsten die Begründung bzw. Erläuterung der vorausgehenden Aufforderungs- und Verheißungsfolge ein. Die mögliche zeitliche Deutung wird in Fußnote [a] bewahrt.
- source_word: תָבוֹא
  choice: wird … kommen
  rationale: בוא bedeutet kommen bzw. hineingehen. Mit בְלִבֶּךָ ist die deutsche Wendung „in dein Herz kommen“ natürlich und nah am hebräischen Bild.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und kontextgerechte Wiedergabe des zentralen Begriffs חָכְמָה im Sprüchebuch.
- source_word: בְלִבֶּךָ
  choice: in dein Herz
  rationale: „Herz“ bewahrt die hebräische Rede vom inneren Menschen einschließlich Denken und Wollen, ohne den Ausdruck auf „Verstand“ zu verengen.
- source_word: וְדַעַת
  choice: und Erkenntnis
  rationale: „Erkenntnis“ gibt דַּעַת in diesem Weisheitskontext präzise wieder und unterscheidet den Begriff von Einsicht und Verständnis.
- source_word: לְנַפְשְׁךָ
  choice: deiner Seele
  rationale: נֶפֶשׁ kann Seele, Selbst, Leben oder Person bezeichnen. „Seele“ erhält hier die poetische Entsprechung zu „Herz“ und die anthropologische Bildwelt des Hebräischen.
- source_word: יִנְעָם
  choice: wird … angenehm sein
  rationale: נעם bezeichnet Angenehmsein, Lieblichkeit oder Wohltun. „angenehm sein“ wahrt die prädikative Form und vermeidet eine stärkere Deutung wie „wird dich erfreuen“.
theological_decisions:
- issue: Hebräische Anthropologie in לֵב und נֶפֶשׁ
  choice: „Herz“ und „Seele“ im Haupttext beibehalten
  alternative: „Inneres“ und „Selbst“ beziehungsweise „Verstand“ und „Leben“
  rationale: Die traditionellen deutschen Begriffe bewahren die literarische und theologische Bildwelt des hebräischen Textes, ohne eine spätere dogmatische Trennung von Körper und Seele in den Vers hineinzulesen.
- issue: Funktion von כִּי und Zeitbezug des Verses
  choice: Begründend mit „Denn“ und futurisch übersetzen
  alternative: 'Zeitlich-konditional: „Wenn Weisheit in dein Herz kommt“'
  rationale: Im Zusammenhang lässt sich כִּי gut als Erklärung der vorausgehenden Aussage verstehen; zugleich ist die zeitliche Deutung grammatisch und kontextuell möglich und wird deshalb ausdrücklich in Fußnote [a] erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrtem poetischem Parallelismus. „Denn“ stellt den Zusammenhang zum Vorhergehenden her; die Wortstellung bleibt natürlich, aber quellennah. Sämtliche Fußnotenmarker stehen im Haupttext.
