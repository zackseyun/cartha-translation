  source_fidelity: 'Der Text gibt die hebräische Satzstruktur und die Schlüsselbegriffe zuverlässig wieder: כִּי als begründendes „Denn“, תבוא als zukünftiges „wird ... kommen“, חכמה als „Weisheit“, דעת als „Erkenntnis“ und ינעם als „wird ... angenehm sein“. Die hebräischen Bilder „Herz“ und „Seele“ bleiben erhalten. Die mögliche temporale Lesart von כִּי wird angemessen in der Fußnote vermerkt, ohne sie im Haupttext vorzuziehen.'
