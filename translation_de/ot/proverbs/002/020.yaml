  variant: modern standard German
source:
  edition: WLC
  text: לְמַ֗עַן תֵּ֭לֵךְ בְּ/דֶ֣רֶךְ טוֹבִ֑ים וְ/אָרְח֖וֹת צַדִּיקִ֣ים תִּשְׁמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/020.yaml
  text: so that you may walk in the way of the good and keep to the paths of the righteous[a][b].
translation:
  language: de
  text: damit du auf dem Weg der Guten[a] gehst und auf den Pfaden der Gerechten bleibst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem Weg guter Menschen“. Das hebräische Adjektiv steht im maskulinen Plural und wird substantivisch für eine Personengruppe gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Pfade der Gerechten bewahrst“. Das hebräische Verb kann „bewahren“, „hüten“ oder „beachten“ bedeuten; hier ist wahrscheinlich gemeint, dass man auf diesen Pfaden bleibt und an ihnen festhält.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das beabsichtigte Ergebnis der vorausgehenden Unterweisung ein und entspricht idiomatischem modernem Deutsch.
- source_word: תֵּלֵךְ
  choice: du ... gehst
  rationale: Der Qal-Imperfekt 2. Person maskulin Singular von הלך steht nach לְמַעַן; der deutsche Nebensatz mit „damit“ gibt die Zweck- beziehungsweise Ergebnisbedeutung natürlich wieder.
- source_word: בְּדֶרֶךְ
  choice: auf dem Weg
  rationale: דֶּרֶךְ bezeichnet wörtlich einen Weg und bildlich die Lebensführung. „Auf dem Weg gehen“ bewahrt das Bild in natürlichem Deutsch.
- source_word: טוֹבִים
  choice: der Guten
  rationale: Das maskuline Pluraladjektiv wird substantivisch für eine Personengruppe gebraucht. „der Guten“ bewahrt die moralische Kategorie, ohne das Geschlecht unnötig ausdrücklich zu machen.
- source_word: וְאָרְחוֹת
  choice: und auf den Pfaden
  rationale: Der Plural bezeichnet Pfade oder Bahnen, häufig bildlich den Lebenswandel. „Pfade“ erhält die poetische Abwechslung gegenüber „Weg“.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Das substantivierte Pluraladjektiv bezeichnet Menschen, die gerecht beziehungsweise rechtschaffen leben. „die Gerechten“ ist im Weisheitskontext klar und vertraut.
- source_word: תִּשְׁמֹר
  choice: bleibst
  rationale: שׁמר kann „bewahren“, „hüten“, „beachten“ oder „sich an etwas halten“ bedeuten. Bei „Pfaden“ gibt „auf ... bleiben“ den kontextuellen Sinn eines beharrlichen Lebenswandels natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Wegbilder des hebräischen Verses bleiben erhalten; „bleibst“ vermeidet zugleich die im Deutschen missverständliche Vorstellung, die Pfade selbst vor einer Gefahr schützen zu müssen.
