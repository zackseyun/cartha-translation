  source_fidelity: Der Relativsatz gibt das substantivische Partizip הָעֹזְבִים angemessen im Anschluss an den vorherigen Vers wieder. „verlassen“ trifft die bewusste Abkehr, „Pfade der Aufrichtigkeit“ wahrt die ethische Bedeutung von יֹשֶׁר, und „um auf den Wegen der Finsternis zu gehen“ gibt den hebräischen Infinitivsatz samt Wegmetapher und Parallelismus zuverlässig wieder.
  naturalness: Der Text ist flüssiges, würdevolles modernes Standarddeutsch. Die Verbindung „auf den Wegen … gehen“ ist idiomatisch; die Differenzierung von „Pfade“ und „Wege“ ist möglich, ohne künstlich zu wirken.
  terminology: „Aufrichtigkeit“ ist für יֹשֶׁר als moralische Geradheit vertretbar, auch wenn „Rechtschaffenheit“ eine mögliche Nuancierung wäre. „Finsternis“ bewahrt die absichtlich nicht weiter ausgelegte moralische Bildsprache. Die Fußnote bietet eine sinnvolle lexikalische Alternative, ohne den Haupttext zu überfrachten.
