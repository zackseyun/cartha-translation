  variant: modern standard German
source:
  edition: WLC
  text: הַ֭/עֹ֣זְבִים אָרְח֣וֹת יֹ֑שֶׁר לָ֝/לֶ֗כֶת בְּ/דַרְכֵי חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/013.yaml
  text: who abandon the paths of uprightness to walk in the ways of darkness,[a]
translation:
  language: de
  text: die die Pfade der Aufrichtigkeit verlassen, um auf den Wegen der Finsternis zu gehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die die Pfade dessen verlassen, was recht ist.“'
    reason: Lexikalische Alternative für יֹשֶׁר; sie gibt den ethischen Sinn idiomatischer, aber weniger knapp wieder.
lexical_decisions:
- source_word: הָעֹזְבִים
  choice: die … verlassen
  rationale: Das substantivisch gebrauchte Partizip bezeichnet die im Zusammenhang beschriebenen Menschen. „Verlassen“ ist natürliches modernes Deutsch und bewahrt den Gedanken einer bewussten Abkehr.
- source_word: אָרְחוֹת
  choice: die Pfade
  rationale: Das Weisheitswort bezeichnet bildhaft den Lebensweg. „Pfade“ erhält die Metapher und unterscheidet אָרְחוֹת passend von דַרְכֵי.
- source_word: יֹשֶׁר
  choice: der Aufrichtigkeit
  rationale: Das Wort bezeichnet moralische Geradheit beziehungsweise Rechtschaffenheit. „Aufrichtigkeit“ bewahrt den ethischen Sinn, ohne die Wegmetapher erklärend aufzulösen.
- source_word: לָלֶכֶת
  choice: um … zu gehen
  rationale: Der Infinitiv bezeichnet hier das Gehen als Bild für die Lebensführung. Die deutsche Zweckkonstruktion gibt לָ־ natürlich wieder.
- source_word: בְּדַרְכֵי
  choice: auf den Wegen
  rationale: Bei der deutschen Wegmetapher ist „auf“ idiomatischer als ein formales „in“; der Plural und die bildhafte Lebensführung bleiben erhalten.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: „Finsternis“ bewahrt sowohl das konkrete Bild als auch dessen moralische Konnotation, ohne es ausdrücklich als Bosheit auszudeuten.
theological_decisions:
- issue: Moralische Metapher der Finsternis
  choice: Das Bild wird als „Finsternis“ beibehalten und im Haupttext nicht als „Böses“ erklärt.
  alternative: Bosheit; das Böse
  rationale: Der hebräische Text vermittelt die moralische Abweichung durch die Gegenüberstellung von Aufrichtigkeit und Finsternis. Eine explizite Wiedergabe als „Böses“ würde das Bild interpretierend auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Wegbilder bleiben erhalten; „Pfade“ und „Wege“ bilden die beiden unterschiedlichen hebräischen Begriffe ab. Der Vers ist als Relativsatz formuliert, da er syntaktisch an Sprüche 2,12 anschließt.
