  text: My son[a], if you receive my words and store up my commandments with you[b],
translation:
  language: de
  text: Mein Sohn[a], wenn du meine Worte annimmst und meine Gebote bei dir aufbewahrst[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mein Kind“. Im Hebräischen steht die maskuline Singularform „mein Sohn“, die in den Sprüchen die übliche Anrede väterlicher Unterweisung ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie einen Schatz aufbewahrst“. Das hebräische Verb kann das sorgfältige Aufbewahren zum sicheren Verwahren bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die maskuline Singularform ist die übliche Anrede väterlicher Weisheitsunterweisung und wird im Haupttext genau wiedergegeben.
- source_word: אִם
  choice: wenn
  rationale: Leitet den Bedingungssatz ein; im Deutschen gibt „wenn“ die offene Bedingung hier natürlich wieder.
- source_word: תִּקַּח
  choice: annimmst
  rationale: Das Verb bedeutet wörtlich „nehmen“, bezeichnet bei Worten jedoch idiomatisch deren bereitwillige Aufnahme.
- source_word: אֲמָרָי
  choice: meine Worte
  rationale: Gibt die pluralische Bezeichnung für die gesprochenen Worte beziehungsweise Aussprüche schlicht und würdig wieder.
- source_word: וּמִצְוֺתַי
  choice: und meine Gebote
  rationale: „Gebote“ bewahrt das verbindliche Gewicht von מִצְוָה und entspricht gängigem biblischem Deutsch.
- source_word: תִּצְפֹּן
  choice: verwahrst
  rationale: Das Verb bezeichnet das sichere Aufbewahren oder Zurücklegen; „verwahren“ erhält dieses Bild in natürlichem Deutsch.
- source_word: אִתָּךְ
  choice: bei dir
  rationale: Entspricht unmittelbar „bei/mit dir“ und vermeidet die interpretierende Erweiterung „in dir“.
theological_decisions:
- issue: Geschlechtsspezifische Anrede in der Weisheitsunterweisung
  choice: Mein Sohn
  alternative: Mein Kind
  rationale: Der hebräische Text steht im maskulinen Singular und verwendet die literarische Form väterlicher Unterweisung. Die genaue Form bleibt im Haupttext erhalten; die mögliche allgemeinere Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Weisheitston. Die Anrede bleibt geschlechtsgenau; die parallelen Verben „annimmst“ und „verwahrst“ geben Aufnahme und sorgfältige Bewahrung klar wieder.
