  yaml_path: translation/ot/proverbs/002/011.yaml
  text: Discretion will watch over you[a]; understanding will guard you.
translation:
  language: de
  text: Besonnenheit wird über dich wachen[a], Einsicht wird dich behüten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Umsicht wird dich bewahren; Urteilsvermögen wird dich schützen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזִמָּה
  choice: Besonnenheit
  rationale: Das Substantiv bezeichnet im positiven Weisheitskontext von Sprüche umsichtiges, wohlüberlegtes Denken. „Besonnenheit“ ist im Deutschen natürlich und vermeidet die andernorts mögliche negative Bedeutung „Plan/Intrige“.
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: wird über dich wachen
  rationale: שׁמר mit עַל drückt schützendes Wachen über eine Person aus. Die Wendung bewahrt die Präposition und klingt idiomatisch.
- source_word: תְּבוּנָה
  choice: Einsicht
  rationale: Der Weisheitsbegriff bezeichnet die Fähigkeit, Zusammenhänge zu verstehen und richtig zu unterscheiden. „Einsicht“ ist prägnant und im Deutschen gut verständlich.
- source_word: תִנְצְרֶכָּה
  choice: wird dich behüten
  rationale: נצר bedeutet bewahren, schützen oder behüten. „Behüten“ erhält den Schutzgedanken und bildet eine natürliche Parallele zu „über dich wachen“, ohne dasselbe Verb zu wiederholen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der poetische Parallelismus und die personifizierte Schutzwirkung von Besonnenheit und Einsicht bleiben erhalten.
