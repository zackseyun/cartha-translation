  text: לְ֭/הַצִּ֣ילְ/ךָ מִ/דֶּ֣רֶךְ רָ֑ע מֵ֝/אִ֗ישׁ מְדַבֵּ֥ר תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/012.yaml
  text: to deliver you from the evil way[a], from the man who speaks perverse things,
translation:
  language: de
  text: um dich vor dem bösen Weg zu retten, vor einem Mann, der Verkehrtes redet,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: um dich … zu retten
  rationale: Der Hifil-Infinitiv von נצל mit Suffix der 2. Person Singular bezeichnet hier den Zweck bzw. die Wirkung der Weisheit. „Retten“ gibt den Schutz vor einer Gefahr natürlich wieder.
- source_word: מִדֶּרֶךְ רָע
  choice: vor dem bösen Weg
  rationale: דֶּרֶךְ bezeichnet einen Weg und in den Sprüchen häufig bildlich eine Lebensführung. רָע kennzeichnet ihn moralisch als böse; die Formulierung bewahrt sowohl das Wegbild als auch die ethische Bedeutung.
- source_word: מֵאִישׁ
  choice: vor einem Mann
  rationale: אִישׁ ist maskulin Singular und hier ohne Artikel; „einem Mann“ gibt die generische, nicht näher bestimmte Gestalt quellennah wieder. Die wiederholte Präposition markiert ein zweites Ziel der Rettung.
- source_word: מְדַבֵּר
  choice: der … redet
  rationale: Das Partizip beschreibt ein kennzeichnendes Verhalten. Ein deutscher Relativsatz ist dafür natürlich.
- source_word: תַּהְפֻּכוֹת
  choice: Verkehrtes
  rationale: Das Substantiv bezeichnet Verdrehungen oder Verkehrtheiten, besonders eine moralisch verdrehte Rede. Das substantivierte „Verkehrtes“ ist idiomatisch und erhält die inhaltliche Offenheit des Plurals.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von אִישׁ
  choice: vor einem Mann
  alternative: vor einem Menschen
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin Singular und zeichnet einen repräsentativen männlichen Übeltäter. Die Übersetzung bewahrt diese Form, ohne daraus eine weitergehende Lehraussage abzuleiten.
- issue: Verhältnis von רָע zu דֶּרֶךְ
  choice: vor dem bösen Weg
  alternative: vor dem Weg des Bösen
  rationale: רָע kann hier als Eigenschaft des Weges verstanden werden; zugleich ist eine substantivische Deutung möglich. Der Haupttext folgt der knappen und natürlichen adjektivischen Lesart, während die Fußnote die echte Mehrdeutigkeit erhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das traditionelle Wegbild der Weisheitsliteratur bleibt erhalten; „Verkehrtes reden“ ist verständlich und gibt die moralische Verdrehung der Rede wieder.
