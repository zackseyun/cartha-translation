  source_fidelity: Der Haupttext gibt den hebräischen Zweckinfinitiv und die beiden durch מִן eingeleiteten Gefahren treffend wieder. „Böser Weg“ wahrt sowohl das konkrete Wegbild als auch dessen ethische Metaphorik; „ein Mann“ entspricht dem artikellosen maskulinen Singular. „der Verkehrtes redet“ ist eine natürliche Wiedergabe von מְדַבֵּר תַּהְפֻּכוֹת.
