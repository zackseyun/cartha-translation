base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/003.yaml
  text: yes[a], if you call out for understanding and lift up your voice for discernment,
translation:
  language: de
  text: Ja[a], wenn du nach Einsicht rufst und deine Stimme nach Verständnis erhebst,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ja, wenn du nach Verständnis rufst und deine Stimme nach Einsicht erhebst.“ Die beiden hebräischen Weisheitsbegriffe sind bedeutungsnah; ihre deutschen Wiedergaben können vertauscht werden, ohne dass sich der Gesamtsinn wesentlich ändert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Ja, wenn
  rationale: Die Wortverbindung führt die Bedingung aus dem vorhergehenden Vers mit rhetorischer Verstärkung fort. „Ja, wenn“ bewahrt sowohl den bedingenden Sinn als auch den Nachdruck.
- source_word: בִּינָה
  choice: Einsicht
  rationale: Das Wort bezeichnet im Weisheitskontext verstehende Einsicht. „Einsicht“ ist im modernen Deutsch natürlich und lässt sich vom folgenden, bedeutungsnahen Begriff unterscheiden.
- source_word: תִקְרָא
  choice: rufst
  rationale: קרא bezeichnet hier einen vernehmlichen, eindringlichen Ruf und nicht das Benennen. „Rufen“ gibt diesen Sinn knapp und idiomatisch wieder.
- source_word: תְּבוּנָה
  choice: Verständnis
  rationale: תבונה überschneidet sich semantisch mit בינה, ohne völlig mit ihm identisch zu sein. „Verständnis“ wahrt den Parallelismus und eine leichte begriffliche Abstufung.
- source_word: תִּתֵּן קוֹלֶךָ
  choice: deine Stimme erhebst
  rationale: Die hebräische Wendung bedeutet wörtlich etwa „deine Stimme gibst“ und beschreibt lautes oder eindringliches Sprechen. Die deutsche Wendung „die Stimme erheben“ bewahrt das Bild und klingt würdig und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und das Bild des eindringlichen Rufens bleiben erhalten; die beiden bedeutungsnahen Weisheitsbegriffe werden nicht miteinander gleichgesetzt.
