  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird zutreffend erfasst: כִּי ist begründend, das Haus der Frau ist auf den Tod hinabgesunken, und מַעְגְּלֹתֶיהָ steht parallel für ihre Pfade. רְפָאִים bezeichnet hier die Verstorbenen bzw. poetisch die Schatten, nicht das Volk der Rephaim. Das hebräische Perfekt von שָׁחָה wird mit „ist … hinabgesunken“ genauer wiedergegeben.'
  naturalness: Die Verbellipse „und ihre Pfade zu den Toten“ ist im modernen Standarddeutsch nicht als vollständiger Satz natürlich verständlich. Das im Hebräischen elliptisch mitgeführte Prädikat muss im Deutschen behutsam ergänzt werden. „führen zu“ gibt die implizierte Bewegungsrichtung idiomatisch wieder.
  terminology: „Tod“, „Haus“, „Pfade“ und „die Toten“ sind angemessen. In der Fußnote ist „Totengeister“ weniger passend, da es im Deutschen leicht Geisterwesen nahelegt und damit die poetische Bezeichnung überdeutet. „Schatten“ bewahrt die lexikalische und poetische Alternative ausreichend.
