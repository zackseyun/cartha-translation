    rationale: „Ihre Pfade zu den Toten“ enthält im Deutschen kein finites oder sinnvoll mitgeltendes Prädikat. Die hebräische Ellipse kann nicht ohne Verständlichkeitsverlust formal nachgebildet werden.
  - severity: low
    issue: Tempus des ersten Verbs
    rationale: שָׁחָה ist formal ein Perfekt. „Ist zum Tod hinabgesunken“ bildet den erreichten, verheerenden Zustand genauer ab als das präsentische „sinkt … hinab“.
  - severity: low
    issue: Fußnotenalternative „Totengeister“
    rationale: Diese Wiedergabe kann eine über die Textstelle hinausgehende Aussage über Geisterwesen suggerieren. Die poetische Alternative „Schatten“ genügt.
