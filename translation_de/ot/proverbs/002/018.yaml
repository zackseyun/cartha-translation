  text: כִּ֤י שָׁ֣חָה אֶל מָ֣וֶת בֵּיתָ֑/הּ וְ/אֶל רְ֝פָאִ֗ים מַעְגְּלֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/018.yaml
  text: For her house sinks down to death[a], and her paths to the dead.
translation:
  language: de
  text: Denn ihr Haus ist zum Tod hinabgesunken, und ihre Pfade führen zu den Toten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu den Schatten«; eine poetische Bezeichnung für die Verstorbenen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die Warnung im Zusammenhang ein und bewahrt den erklärenden Charakter.
- source_word: שָׁחָה
  choice: sinkt … hinab
  rationale: Gibt die bildhafte Abwärtsbewegung zum Tod wieder, ohne das Verb als bloßes »führen« umzudeuten.
- source_word: אֶל מָוֶת
  choice: zum Tod
  rationale: Bewahrt die vom Hebräischen ausgedrückte Richtung auf den Tod hin.
- source_word: בֵּיתָהּ
  choice: ihr Haus
  rationale: Erhält das konkrete Bild des Hauses; eine weiter gefasste Deutung als Haushalt wird nicht in den Haupttext eingetragen.
- source_word: רְפָאִים
  choice: die Toten
  rationale: Bezeichnet hier im weisheitlich-poetischen Zusammenhang die Verstorbenen beziehungsweise Bewohner des Totenreichs, nicht das gleichnamige Volk. Die poetischere Alternative wird in der Fußnote genannt.
- source_word: מַעְגְּלֹתֶיהָ
  choice: ihre Pfade
  rationale: Gibt die Wege beziehungsweise Lebensbahnen wieder und passt zum poetischen Parallelismus.
theological_decisions:
- issue: Bedeutung von רְפָאִים im weisheitlich-poetischen Zusammenhang
  choice: die Toten
  alternative: die Schatten; die Totengeister
  rationale: Die verständliche Wiedergabe »die Toten« vermeidet sowohl eine ethnische Fehldeutung als auch spekulative Aussagen über das Jenseits; die besondere poetische Bedeutung bleibt durch die Fußnote sichtbar.
- issue: Fehlendes Verb im zweiten Versglied
  choice: 'Verbellipse beibehalten: »und ihre Pfade zu den Toten«'
  alternative: »und ihre Pfade führen zu den Toten«
  rationale: Das Hebräische setzt die Aussage des ersten Versglieds elliptisch fort. Die deutsche Fassung bewahrt diese knappe poetische Struktur, ohne ein nicht ausdrücklich vorhandenes Verb hinzuzufügen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Parallelstruktur. »sinkt … hinab« erhält das anschauliche Bild der Bewegung zum Tod; die Ellipse im zweiten Versglied bleibt bewusst bestehen.
