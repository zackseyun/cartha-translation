id: PRO.2.6
reference: Proverbs 2:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי יְ֭הוָה יִתֵּ֣ן חָכְמָ֑ה מִ֝/פִּ֗י/ו דַּ֣עַת וּ/תְבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/006.yaml
  text: For Yahweh gives wisdom[c][b][a]; from his mouth come knowledge and understanding.
translation:
  language: de
  text: Denn Jahwe gibt Weisheit; aus seinem Mund kommen Erkenntnis und Einsicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verständnis« statt »Einsicht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aufforderung. »Denn« gibt diesen erklärenden Zusammenhang im Deutschen natürlich wieder; »weil« wäre in einem selbstständig zitierten Vers syntaktisch weniger passend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יִתֵּן
  choice: gibt
  rationale: Das Imperfekt formuliert hier eine allgemeingültige Aussage im Stil eines Sprichworts; daher steht im Deutschen das Präsens.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist die übliche und kontextgerechte Wiedergabe des Schlüsselbegriffs im Buch der Sprüche.
- source_word: מִפִּיו
  choice: aus seinem Mund kommen
  rationale: Die Präpositionalfügung bedeutet wörtlich »aus seinem Mund«. Das im Hebräischen ausgesparte Verb wird im Deutschen aus dem ersten Satzglied sinngemäß ergänzt, während das Bild von Gottes Reden erhalten bleibt.
- source_word: דַּעַת
  choice: Erkenntnis
  rationale: »Erkenntnis« bezeichnet hier nicht bloß gespeicherte Information, sondern aus Weisheit hervorgehendes Erkennen und passt zum Sprachgebrauch der Weisheitsliteratur.
- source_word: וּתְבוּנָה
  choice: und Einsicht
  rationale: »Einsicht« gibt die Fähigkeit zu verständigem Unterscheiden natürlich und knapp wieder; auch »Verständnis« wäre möglich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration »Jahwe« bewahrt seinen Charakter als Eigenname, ohne ihn durch den traditionellen Ersatztitel aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und das konkrete Bild »aus seinem Mund« bleiben erhalten; der gnomenhafte Charakter wird durch das Präsens ausgedrückt.
