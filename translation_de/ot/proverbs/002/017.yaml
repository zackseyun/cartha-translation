source:
  edition: WLC
  text: הַ֭/עֹזֶבֶת אַלּ֣וּף נְעוּרֶ֑י/הָ וְ/אֶת בְּרִ֖ית אֱלֹהֶ֣י/הָ שָׁכֵֽחָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/017.yaml
  text: who abandons the companion of her youth and forgets the covenant of her God[a][b].
translation:
  language: de
  text: 'die den Gefährten ihrer Jugend verlässt[a]

    und den Bund ihres Gottes vergisst[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Mann ihrer Jugend“. Das hebräische Wort bezeichnet einen engen Gefährten und meint hier wahrscheinlich ihren Ehepartner.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Bund ihres Gottes“ ist wahrscheinlich der Ehebund gemeint, der unter Gottes Autorität oder vor ihm als Zeugen geschlossen wurde. Die Formulierung kann zugleich an ihre umfassendere Bundesverpflichtung gegenüber Gott erinnern.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֹזֶבֶת
  choice: die … verlässt
  rationale: Das feminine Qal-Partizip beschreibt die zuvor genannte Frau. „Verlässt“ gibt das Zurücklassen oder Aufgeben natürlich und treffend wieder.
- source_word: אַלּוּף
  choice: Gefährten
  rationale: אַלּוּף bezeichnet einen engen Vertrauten oder Gefährten und meint hier im Zusammenhang wahrscheinlich den Ehemann. „Gefährte“ bewahrt jedoch die Bedeutungsbreite des Hebräischen.
- source_word: נְעוּרֶיהָ
  choice: ihrer Jugend
  rationale: Die knappe deutsche Wendung entspricht der hebräischen Genitivverbindung und bezeichnet den Gefährten aus ihrer Jugendzeit.
- source_word: בְּרִית
  choice: Bund
  rationale: „Bund“ bewahrt das rechtliche, relationale und theologische Gewicht von בְּרִית.
- source_word: אֱלֹהֶיהָ
  choice: ihres Gottes
  rationale: Der feminine Possessivsuffix wird ausdrücklich wiedergegeben und unterstreicht ihre persönliche Bindung und Verantwortung.
- source_word: שָׁכֵחָה
  choice: vergisst
  rationale: 'Obwohl im Hebräischen eine Perfektform steht, passt im charakterisierenden Spruchkontext das deutsche Präsens. Gemeint ist hier mehr als ein bloßes Versehen: die Missachtung einer bindenden Verpflichtung.'
theological_decisions:
- issue: Bezeichnet בְּרִית אֱלֹהֶיהָ speziell den Ehebund oder allgemeiner ihre Bundesverpflichtung gegenüber Gott?
  choice: „den Bund ihres Gottes“, mit wahrscheinlichem Bezug auf den unter Gottes Autorität oder Zeugenschaft geschlossenen Ehebund
  alternative: „ihren Ehebund vor Gott“ oder allgemeiner „Gottes Bund“
  rationale: Der Parallelismus mit dem „Gefährten ihrer Jugend“ legt den Ehebund nahe. Die wörtlich weitere Formulierung des Hebräischen wird dennoch beibehalten, damit auch der mögliche Bezug auf ihre umfassendere Verpflichtung gegenüber Gott offenbleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Relativanschluss setzt den vorhergehenden Vers fort. Die parallele Zweizeilenstruktur und die theologische Offenheit des hebräischen Ausdrucks bleiben erhalten.
