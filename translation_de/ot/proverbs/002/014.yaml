  text: הַ֭/שְּׂמֵחִים לַ/עֲשׂ֥וֹת רָ֑ע יָ֝גִ֗ילוּ בְּֽ/תַהְפֻּכ֥וֹת רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/014.yaml
  text: who rejoice to do evil[a], and exult in the perversities of evil[b],
translation:
  language: de
  text: 'die sich freuen, Böses zu tun,

    und über böse Verkehrtheiten jubeln[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »über Verkehrtheiten des Bösen«; auch möglich: »über böse Verdrehungen« oder »über verkehrte böse Taten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: die sich freuen
  rationale: Das Partizip charakterisiert weiterhin die in den vorangehenden Versen beschriebenen Menschen. »Sich freuen« gibt שמח natürlich und unmittelbar wieder.
- source_word: לַעֲשׂוֹת
  choice: zu tun
  rationale: Der Infinitiv von עשה wird direkt wiedergegeben, ohne durch »treiben« oder »begehen« eine Gewohnheit beziehungsweise strafrechtliche Färbung einzutragen.
- source_word: רָע
  choice: Böses
  rationale: Das substantivierte Adjektiv bewahrt hier den moralischen Gehalt von רע und ergibt mit »tun« eine natürliche deutsche Verbindung.
- source_word: יָגִילוּ
  choice: jubeln
  rationale: »Jubeln« vermittelt die gesteigerte, ausgelassene Freude von גיל und unterscheidet das Wort zugleich vom vorherigen שמח.
- source_word: בְּתַהְפֻּכוֹת
  choice: über ... Verkehrtheit
  rationale: »Verkehrtheit« erfasst das Verdrehte und moralisch Verfehlte des seltenen Pluralworts. Die Präposition ב bezeichnet hier am natürlichsten den Anlass der Freude.
- source_word: רָע
  choice: böse
  rationale: Das zweite רע bestimmt die Verkehrtheit moralisch näher. Die attributive Wiedergabe ist im Deutschen natürlicher als das wörtlich kompakte »Verkehrtheiten des Bösen«.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Verben »sich freuen« und »jubeln« spiegeln die Steigerung im Hebräischen; »Verkehrtheit« bewahrt dessen abstrakte moralische Bildsprache. Der Fußnotenmarker steht unmittelbar bei der auslegungsbedürftigen Wendung.
