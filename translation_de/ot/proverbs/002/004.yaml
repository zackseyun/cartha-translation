  text: if you seek it like silver and search for it like hidden treasures[b][a],
translation:
  language: de
  text: wenn du nach ihr suchst wie nach Silber und ihr nachspürst wie nach verborgenen Schätzen[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie nach vergrabenen Schätzen“. Das hebräische Wort kann Kostbarkeiten bezeichnen, die im Boden oder auf andere Weise verborgen sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Leitet im fortlaufenden Bedingungssatz die Voraussetzung ein; im Deutschen ist „wenn“ hier die natürliche Entsprechung.
- source_word: תְּבַקְשֶׁנָּה
  choice: du nach ihr suchst
  rationale: בקשׁ bezeichnet zielgerichtetes Suchen. Das feminine Suffix wird als „ihr“ erhalten und verweist auf die zuvor genannte Einsicht beziehungsweise Weisheit.
- source_word: כַכָּסֶף
  choice: wie nach Silber
  rationale: Die Vergleichspartikel כ wird mit „wie“ wiedergegeben; wegen des deutschen Verbs „suchen“ ist „nach Silber“ idiomatisch.
- source_word: וְכַמַּטְמוֹנִים
  choice: wie verborgenen Schätzen
  rationale: מַטְמוֹנִים bezeichnet verborgene oder verwahrte Kostbarkeiten; „verborgene Schätze“ bewahrt Wert und Verborgenheit, ohne die Art des Verstecks festzulegen.
- source_word: תַּחְפְּשֶׂנָּה
  choice: ihr nachspürst
  rationale: חפשׂ bezeichnet sorgfältiges, intensives Suchen. „Nachspüren“ variiert den Ausdruck natürlich und behält das feminine Bezugswort bei.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Rückverweisung des Hebräischen wird bewusst mit „ihr“ bewahrt; sie nimmt die in den vorhergehenden Versen genannte Einsicht beziehungsweise Weisheit auf. Die parallele Suchbewegung der beiden Vershälften bleibt erhalten.
