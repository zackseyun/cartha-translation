  text: ו/צפן לַ֭/יְשָׁרִים תּוּשִׁיָּ֑ה מָ֝גֵ֗ן לְ/הֹ֣לְכֵי תֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/007.yaml
  text: He stores up sound wisdom for the upright[b][a]; he is a shield to those who walk in integrity.
translation:
  language: de
  text: Für die Aufrichtigen hält er tragfähige Einsicht[a] bereit; er ist ein Schild für alle, die ihren Weg in Lauterkeit[b] gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „umsichtige Weisheit“, „kluges Urteilsvermögen“ oder „Gelingen“. Das hebräische Wort bezeichnet Einsicht und Weisheit, die sich in der Praxis bewähren; je nach Zusammenhang kann es auch Erfolg meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Rechtschaffenheit“, „Unbescholtenheit“ oder „Ganzheit“. Das hebräische Wort kann Lauterkeit, Ganzheit und Unbescholtenheit der Lebensführung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָפַן
  choice: hält … bereit
  rationale: צפן bezeichnet das Aufbewahren oder Zurücklegen. „Hält … bereit“ bewahrt den Gedanken einer für späteren Nutzen verwahrten Gabe und klingt im modernen Deutschen natürlich.
- source_word: לַיְשָׁרִים
  choice: den Aufrichtigen
  rationale: יְשָׁרִים bezeichnet Menschen, die in moralischer Hinsicht gerade und rechtschaffen sind. „Die Aufrichtigen“ gibt den substantivierten Plural prägnant wieder.
- source_word: תּוּשִׁיָּה
  choice: Weisheit, die zum Ziel führt
  rationale: תּוּשִׁיָּה kann tragfähige Einsicht, praktische Umsicht, Gelingen oder wirksame Weisheit bezeichnen. Die Formulierung verbindet den Weisheitsaspekt mit dessen praktischer Wirksamkeit, ohne die Bedeutungsbreite auf bloßen Erfolg zu verengen.
- source_word: מָגֵן
  choice: ein Schild
  rationale: Das konkrete Schutzbild des hebräischen Nomens wird beibehalten und nicht zu einem abstrakten Begriff wie „Schutz“ abgeflacht.
- source_word: לְהֹלְכֵי
  choice: für die, die … ihren Weg gehen
  rationale: Das Partizip von הלך beschreibt hier die beständige Lebensführung. Die deutsche Wendung erhält das hebräische Bild des Gehens als Lebenswandel.
- source_word: תֹם
  choice: Lauterkeit
  rationale: תֹם umfasst Ganzheit, Unbescholtenheit und charakterliche Integrität. „Lauterkeit“ bezeichnet ungeteilte Redlichkeit, ohne Sündlosigkeit zu behaupten.
theological_decisions:
- issue: Verhältnis der beiden Vershälften
  choice: 'Gott ist auch in der zweiten Vershälfte das vorausgesetzte Subjekt: „ein Schild ist er“.'
  alternative: 'Die zweite Hälfte könnte elliptisch verstanden werden: „Ein Schild ist [aufbewahrt] für die, die in Lauterkeit ihren Weg gehen.“'
  rationale: Der unmittelbare Zusammenhang handelt von Gottes Wirken, und die prädikative Lesart von מָגֵן ergibt einen natürlichen Parallelismus. Die knappe hebräische Konstruktion bleibt durch die vorangestellte Formulierung „ein Schild ist er“ erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Schildmetapher und das biblische Bild des Weges als Lebensführung bleiben erhalten. Die seltenere Bedeutung von תּוּשִׁיָּה wird im Haupttext verständlich entfaltet und in der Fußnote mit ihren echten Alternativen dokumentiert.
