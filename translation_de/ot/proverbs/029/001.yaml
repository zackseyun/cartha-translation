source:
  edition: WLC
  text: אִ֣ישׁ תּ֭וֹכָחוֹת מַקְשֶׁה עֹ֑רֶף פֶּ֥תַע יִ֝שָּׁבֵ֗ר וְ/אֵ֣ין מַרְפֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/001.yaml
  text: A man often reproved[a], who stiffens his neck, will suddenly be broken beyond healing.
translation:
  language: de
  text: Ein Mann, der oft zurechtgewiesen wird und seinen Nacken verhärtet, wird plötzlich zerbrochen werden, und es gibt keine Heilung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Mann vieler Zurechtweisungen, der seinen Nacken verhärtet, wird plötzlich zerbrochen werden, und es gibt kein Heilmittel.“'
    reason: Die knappe hebräische Verbindung אִישׁ תּוֹכָחוֹת kann wörtlicher als „ein Mann vieler Zurechtweisungen“ verstanden werden; מַרְפֵּא kann auch „Heilmittel“ oder „Abhilfe“ bedeuten.
lexical_decisions:
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das maskuline Singularnomen bezeichnet in diesem Weisheitsspruch einen beispielhaften Einzelnen. „Ein Mann“ entspricht der hebräischen Form und ist im sprichwörtlichen Zusammenhang zugleich verallgemeinernd.
- source_word: תּוֹכָחוֹת
  choice: der oft zurechtgewiesen wird
  rationale: Der Plural bezeichnet wiederholte Zurechtweisungen. Die Relativkonstruktion gibt den idiomatischen Sinn im Deutschen natürlich wieder.
- source_word: מַקְשֶׁה עֹרֶף
  choice: den Nacken verhärtet
  rationale: Die Wendung bezeichnet hartnäckigen Widerstand. Die Übersetzung bewahrt das anschauliche Körperbild des Hebräischen, ohne es durch „starrsinnig“ aufzulösen.
- source_word: פֶּתַע
  choice: plötzlich
  rationale: Das Adverb hebt die Unvermitteltheit des kommenden Zusammenbruchs hervor.
- source_word: יִשָּׁבֵר
  choice: wird zerbrochen werden
  rationale: Die passive Form und das Bild des Zerbrechens bleiben erhalten; „zerbrochen“ gibt die Schwere und Endgültigkeit hier angemessen wieder.
- source_word: וְאֵין מַרְפֵּא
  choice: und es gibt keine Heilung
  rationale: Dies entspricht eng dem Wortlaut und lässt offen, ob מַרְפֵּא konkret Heilung oder allgemeiner Abhilfe bezeichnet.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Nackenmetapher und die passive Form werden bewahrt; der Satz bleibt für heutige Leser verständlich.
