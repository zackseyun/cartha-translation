  text: יֹדֵ֣עַ צַ֭דִּיק דִּ֣ין דַּלִּ֑ים רָ֝שָׁ֗ע לֹא יָבִ֥ין דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/007.yaml
  text: A righteous man knows the case of the poor[b][a]; a wicked man does not understand knowledge.
translation:
  language: de
  text: Ein Gerechter kennt das Recht der Armen[a]; ein Frevler hat keine Einsicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Rechtssache der Armen“. Das hebräische Wort kann einen Rechtsfall, eine Rechtssache, das Recht oder die Gerechtigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „versteht Erkenntnis nicht“. Gemeint sein kann auch: „hat dafür kein Verständnis“, mit Rückbezug auf den ersten Satzteil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹדֵעַ
  choice: kennt
  rationale: Das Partizip von ידע bezeichnet hier ein Kennen bzw. Wahrnehmen. „Kennt“ wahrt den unmittelbaren Wortsinn, ohne die mögliche Folgerung „kümmert sich um“ in den Text einzutragen.
- source_word: צַדִּיק
  choice: ein Gerechter
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular und zeichnet einen repräsentativen Menschentyp. „Ein Gerechter“ ist knapp, würdig und bildet den Gegensatz zu „ein Frevler“ ab.
- source_word: דִּין
  choice: Rechtsanspruch
  rationale: דִּין kann Rechtsfall, Rechtssache, Anspruch oder Recht bedeuten. „Rechtsanspruch“ gibt im Zusammenhang mit den Armen die rechtlich-soziale Dimension wieder, ohne den Ausdruck auf bloßes Mitgefühl zu reduzieren.
- source_word: דַּלִּים
  choice: der Armen
  rationale: דַּלִּים bezeichnet arme, geringe oder sozial schwache Menschen. „Die Armen“ ist im Deutschen natürlich und schließt ihre gesellschaftliche Verletzlichkeit ein.
- source_word: רָשָׁע
  choice: ein Frevler
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular. „Frevler“ ist eine etablierte, würdige Bezeichnung für einen schuldhaft gottlosen bzw. bösen Menschen und entspricht strukturell „ein Gerechter“.
- source_word: יָבִין
  choice: versteht
  rationale: בין bedeutet verstehen, einsehen oder unterscheiden. „Versteht“ stellt den sachlichen Gegensatz zu „kennt“ klar heraus.
- source_word: דָּעַת
  choice: Erkenntnis
  rationale: Das hebräische Abstraktum bedeutet „Wissen/Erkenntnis“. Die formal nahe Wendung „versteht keine Erkenntnis“ bewahrt die auffällige Kürze und mögliche Mehrdeutigkeit des Hebräischen, statt den Rückbezug auf den ersten Halbvers ausdrücklich zu ergänzen.
theological_decisions:
- issue: Beziehung zwischen sozialer Gerechtigkeit und Erkenntnis
  choice: Der zweite Halbvers bleibt als „versteht keine Erkenntnis“ knapp und offen.
  alternative: „versteht nichts davon“ oder „hat dafür kein Verständnis“
  rationale: Solche Alternativen würden den zweiten Halbvers eindeutig auf den Rechtsanspruch der Armen beziehen. Das ist wahrscheinlich mitgemeint, doch der hebräische Wortlaut verwendet das allgemeine דָּעַת und lässt zugleich eine umfassendere Aussage über die Erkenntnisfähigkeit des Frevlers zu.
translation_notes:
  register: Modernes, knappes und sprichwortartiges Standarddeutsch. Die parallele Gegenüberstellung „ein Gerechter … ein Frevler“ bleibt erhalten. „Rechtsanspruch“ ist gegenwärtig verständlich und trägt den forensisch-sozialen Gehalt von דִּין; eine Fußnote bewahrt die übrigen sachgerechten Möglichkeiten. Die ungewöhnliche Formulierung im zweiten Halbvers wird nicht stillschweigend geglättet.
