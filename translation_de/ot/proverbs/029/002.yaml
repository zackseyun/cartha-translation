base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/002.yaml
  text: When the righteous increase[a], the people rejoice; but when a wicked man rules, the people groan.
translation:
  language: de
  text: Wenn die Gerechten sich mehren[a], freut sich das Volk; doch wenn ein böser Mensch herrscht, stöhnt das Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn es viele Gerechte gibt, freut sich das Volk.“ Die hebräische Infinitivkonstruktion kann entweder die Zunahme oder die große Zahl betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: wenn ... sich mehren
  rationale: Die Präposition בְּ mit dem Infinitiv constructus von רבה bildet hier eine temporale Aussage. „Sich mehren“ gibt die Zunahme prägnant und in einem würdigen deutschen Sprichwortstil wieder; die ebenfalls mögliche Betonung auf einer großen Anzahl wird in der Fußnote bewahrt.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Das substantivierte Adjektiv im Plural bezeichnet die Gruppe der gerecht Handelnden. „Die Gerechten“ ist knapp, idiomatisch und lässt den kategorischen Charakter stehen.
- source_word: יִשְׂמַח
  choice: freut sich
  rationale: שׂמח bezeichnet Freude oder Frohsein. „Freut sich“ ist im heutigen Deutsch natürlich und bildet einen klaren Gegensatz zum Stöhnen im zweiten Halbvers.
- source_word: הָעָם / עָם
  choice: das Volk
  rationale: עם meint hier die Bevölkerung als Kollektiv. Die Wiederholung von „das Volk“ wahrt den Parallelismus und macht deutlich, dass in beiden Vershälften dieselbe Gemeinschaft gemeint ist.
- source_word: וּבִמְשֹׁל
  choice: doch wenn ... herrscht
  rationale: בְּ mit dem Infinitiv constructus von משׁל ist wiederum temporal. „Doch“ gibt den antithetischen Zusammenhang natürlich wieder, obwohl וְ formal auch schlicht mit „und“ übersetzt werden kann.
- source_word: רָשָׁע
  choice: ein Gottloser
  rationale: Das substantivierte Adjektiv im maskulinen Singular bezeichnet einen moralisch schuldigen, bösen Menschen. „Ein Gottloser“ ist im deutschen Weisheits- und Bibelregister prägnant und bewahrt die persönliche Einzahl des Herrschenden, ohne eine bestimmte Person zu benennen.
- source_word: יֵאָנַח
  choice: stöhnt
  rationale: Der Nifal von אנח bezeichnet Seufzen oder Stöhnen aus Bedrängnis. „Stöhnt“ bringt die Belastung des Volkes unter böser Herrschaft kräftig und verständlich zum Ausdruck.
