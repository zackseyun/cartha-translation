  text: A fool lets out all his spirit[a], but a wise man holds it back.
translation:
  language: de
  text: Ein Tor lässt seinem ganzen Geist freien Lauf[a], ein Weiser aber hält ihn zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Tor lässt seinem ganzen Zorn freien Lauf; ein Weiser aber beruhigt ihn.“ Das hebräische Wort für „Geist“ kann hier auch innere Erregung oder Temperament bezeichnen. Die schwierige Schlusswendung kann je nach Deutung das Zurückhalten, Beruhigen oder ein Handeln erst später bzw. zuletzt ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רוּחוֹ
  choice: seinem ganzen Geist
  rationale: Die Wiedergabe bewahrt sowohl die umfassende Aussage von כָּל als auch das breite Bedeutungsspektrum von רוּחַ. Im Zusammenhang kann damit besonders die innere Erregung oder das Temperament gemeint sein, doch „Geist“ legt den Sinn nicht vorschnell darauf fest.
- source_word: יוֹצִיא
  choice: lässt … freien Lauf
  rationale: Der Hifil von יצא bezeichnet hier das Herauslassen dessen, was im Inneren ist. Die deutsche Wendung ist natürlich und erhält das Bild einer ungehinderten Äußerung.
- source_word: כְסִיל
  choice: ein Tor
  rationale: „Tor“ ist die geläufige, würdige Bezeichnung für den moralisch und praktisch unverständigen Menschen der Weisheitsliteratur.
- source_word: חָכָם
  choice: ein Weiser
  rationale: Die substantivierte maskuline Singularform wird entsprechend der sprichwörtlichen Gegenüberstellung wiedergegeben.
- source_word: בְּאָחוֹר יְשַׁבְּחֶנָּה
  choice: beruhigt ihn und hält ihn zurück
  rationale: Die schwierige Verbindung kann sowohl das Beruhigen bzw. Stillen als auch das Zurückhalten ausdrücken. Die kombinierte Formulierung gibt beide im Hebräischen möglichen Nuancen wieder, ohne die Spannung einseitig aufzulösen.
