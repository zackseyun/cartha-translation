id: PRO.29.13
reference: Proverbs 29:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רָ֤שׁ וְ/אִ֣ישׁ תְּכָכִ֣ים נִפְגָּ֑שׁוּ מֵ֤אִיר עֵינֵ֖י שְׁנֵי/הֶ֣ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/013.yaml
  text: A poor man and an oppressor meet together[b][a]; Yahweh gives light to the eyes of both of them.
translation:
  language: de
  text: Ein Armer und ein Unterdrücker[a] begegnen einander; Jahwe gibt den Augen beider Licht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa „ein Mann der Bedrückungen“. Die schwierige hebräische Wendung kann einen ausbeuterischen oder unterdrückerischen Menschen bezeichnen; sie wurde auch als „ein Betrüger“ oder „ein Wucherer“ verstanden.
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „den Augen Licht geben“ kann bedeuten, Sehkraft oder Leben zu schenken, am Leben zu erhalten oder zu erleuchten.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  choice: ein Armer
  rationale: Das Substantiv bezeichnet einen armen oder bedürftigen Menschen. Die singularische, männliche Form und die knappe sprichwörtliche Gegenüberstellung bleiben erhalten.
- source_word: אִישׁ תְּכָכִים
  choice: ein Unterdrücker
  rationale: Die schwierige Wendung bezeichnet wahrscheinlich einen Menschen, der andere durch bedrückende Forderungen oder ausbeuterische Geschäfte bedrängt. „Unterdrücker“ gibt diesen wahrscheinlichen Sinn verständlich wieder, ohne die Unsicherheit zu verschweigen.
- source_word: נִפְגָּשׁוּ
  choice: begegnen einander
  rationale: Der Niphal von פגשׁ bedeutet gewöhnlich „begegnen“ oder „aufeinandertreffen“. „Begegnen einander“ bewahrt das konkrete Bild und lässt offen, ob zugleich ihre gemeinsame Abhängigkeit von Gott gemeint ist.
- source_word: מֵאִיר
  choice: gibt … Licht
  rationale: Der Hiphil von אור bedeutet „Licht geben“ oder „hell machen“. In Verbindung mit den Augen kann die Wendung Sehkraft, Leben, Erhaltung oder Erkenntnis bezeichnen; die bildhafte Formulierung bewahrt diese Bedeutungsbreite.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: den Augen beider
  rationale: Die knappe deutsche Form gibt die hebräische Genitivverbindung wieder und betont, dass beide Personen gleichermaßen von Jahwe abhängig sind.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
theological_decisions:
- issue: Bedeutung des zweiten Versteils
  choice: Jahwe gibt sowohl dem Armen als auch dem Unterdrücker Licht für die Augen.
  alternative: Jahwe schenkt beiden ausdrücklich körperliche Sehkraft oder erleuchtet beide moralisch beziehungsweise geistlich.
  rationale: Der hebräische Wortlaut nennt Jahwe als den, der „den Augen beider Licht gibt“. Das kann Sehkraft, Leben, lebenserhaltende Kraft oder Erleuchtung meinen. Die Übersetzung bewahrt das Bild und entscheidet nicht unnötig zwischen diesen Möglichkeiten.
translation_notes:
  register: Knappe, würdige und allgemein verständliche Spruchsprache. „Ein Armer“ wahrt die singularische Gegenüberstellung; „gibt den Augen beider Licht“ erhält bewusst das mehrdeutige hebräische Bild.
