id: PRO.29.4
reference: Proverbs 29:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מֶ֗לֶךְ בְּ֭/מִשְׁפָּט יַעֲמִ֣יד אָ֑רֶץ וְ/אִ֖ישׁ תְּרוּמ֣וֹת יֶֽהֶרְסֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/004.yaml
  text: By justice a king establishes a land[b][a], but a man of bribes tears it down.
translation:
  language: de
  text: Ein König gibt einem Land durch Recht Bestand, aber ein Mann[b], der Bestechungsgeschenke annimmt[a], reißt es nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann der hebräische Ausdruck auch „ein Mann der Abgaben/Beiträge“ oder „ein Mann der Gaben“ bedeuten. Im Zusammenhang sind wahrscheinlich korrumpierende Zahlungen gemeint, daher „Bestechungsgeschenke“.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „ein Mann“; der Ausdruck ist hier repräsentativ beziehungsweise allgemein gebraucht.
    reason: cultural_note
lexical_decisions:
- source_word: מֶלֶךְ
  choice: ein König
  rationale: Der unbestimmte Ausdruck entspricht dem allgemeinen, sprichwörtlichen Charakter des Satzes; es ist kein bestimmter König gemeint.
- source_word: בְּמִשְׁפָּט
  choice: durch Recht
  rationale: מִשְׁפָּט bezeichnet hier gerechtes Urteil und eine gerechte Rechtsordnung. „Durch Recht“ ist knapp, würdevoll und lässt beide Aspekte mitschwingen.
- source_word: יַעֲמִיד
  choice: gibt … Bestand
  rationale: Der Hifil von עמד drückt hier aus, dass etwas fest und dauerhaft gemacht wird. Die deutsche Wendung gibt den stabilisierenden Sinn im Zusammenhang der Herrschaft natürlich wieder.
- source_word: אָרֶץ
  choice: einem Land
  rationale: Gemeint ist im Regierungskontext ein Herrschaftsgebiet oder Gemeinwesen, nicht die gesamte Erde. Der unbestimmte Artikel wahrt die allgemeine Aussage des Sprichworts.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Die grammatisch maskuline Einzahl wird quellentreu wiedergegeben; der Ausdruck steht hier zugleich repräsentativ für eine Person beziehungsweise einen Machthaber.
- source_word: תְּרוּמוֹת
  choice: Bestechungsgeschenke
  rationale: Das Wort bezeichnet gewöhnlich Abgaben, Beiträge oder Gaben. Im negativen Gegensatz zu gerechter Herrschaft liegt die Deutung als korrumpierende Geschenke nahe; eine Fußnote bewahrt die echte lexikalische Mehrdeutigkeit.
- source_word: יֶהֶרְסֶנָּה
  choice: reißt es nieder
  rationale: הרס bezeichnet das Niederreißen oder Zerstören. Die Formulierung bewahrt das konkrete Bild; „es“ nimmt „Land“ als Gemeinwesen wieder auf.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. „Gibt … Bestand“ bildet den stabilisierenden Gegensatz zu „reißt … nieder“ ab. Die Ergänzung „annimmt“ macht die im deutschen Satz erforderliche Beziehung zu den Bestechungsgeschenken deutlich, ohne die lexikalische Unsicherheit zu verschweigen.
