  text: אִֽישׁ אַ֭ף יְגָרֶ֣ה מָד֑וֹן וּ/בַ֖עַל חֵמָ֣ה רַב פָּֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/022.yaml
  text: An angry man stirs up strife[b][a], and a hot-tempered man abounds in transgression.
translation:
  language: de
  text: Ein zorniger Mensch[a] schürt Streit, und wer hitzköpfig ist[b], begeht viele Vergehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »ein Mann des Zorns«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: »ein Herr des Zorns«; gemeint ist jemand, der zu heftigem Zorn neigt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »ist reich an Vergehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אַף
  choice: ein zorniger Mensch
  rationale: Die hebräische Wendung bedeutet wörtlich »ein Mann des Zorns« und bezeichnet einen Menschen, der vom Zorn geprägt ist. »Ein zorniger Mensch« ist im modernen Deutsch natürlich und gibt den charakteristischen Wesenszug wieder.
- source_word: יְגָרֶה
  choice: schürt
  rationale: Das Verb bezeichnet das Anfachen oder Hervorrufen. »Schürt« verbindet sich idiomatisch mit »Streit« und bewahrt das anschauliche Bild.
- source_word: מָדוֹן
  choice: Streit
  rationale: Das Substantiv bezeichnet Streit, Zwietracht oder Auseinandersetzung. »Streit« ist knapp, allgemein verständlich und dem Weisheitsspruch angemessen.
- source_word: בַעַל חֵמָה
  choice: wer hitzköpfig ist
  rationale: Wörtlich steht eine idiomatische Wendung wie »Herr der Zornglut«, die einen dauerhaft zu heftigem Zorn neigenden Menschen bezeichnet. Die Formulierung »wer hitzköpfig ist« gibt diese Disposition natürlich wieder und vermeidet die schwerfällige Wiederholung von »Mensch«.
- source_word: רַב פָּשַׁע
  choice: begeht viele Vergehen
  rationale: Die knappe hebräische Verbindung besagt, dass die betreffende Person durch zahlreiche Vergehen gekennzeichnet ist. Die verbale Formulierung ist im Deutschen klar; die alternative, formal nähere Wiedergabe »ist reich an Vergehen« bleibt in der Fußnote erhalten.
- source_word: פָּשַׁע
  choice: Vergehen
  rationale: Das Wort kann Übertretung, Auflehnung oder schuldhaftes Vergehen bezeichnen. »Vergehen« wahrt den moralischen Ernst, ohne die mögliche Bedeutung vorschnell auf politische Rebellion oder einen bestimmten theologischen Sündenbegriff festzulegen.
theological_decisions:
- issue: Bedeutungsumfang von פָּשַׁע
  choice: Vergehen
  alternative: Übertretung; Auflehnung; Sünde
  rationale: Der Kontext beschreibt die vielen schuldhaften Taten eines hitzköpfigen Menschen. »Vergehen« lässt den weiteren hebräischen Bedeutungsumfang offen und vermeidet eine unnötige dogmatische Zuspitzung.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die parallelen hebräischen Charakterbezeichnungen werden idiomatisch wiedergegeben; die markanten wörtlichen Bilder und die knappe Mehrdeutigkeit der Schlusswendung bleiben in den Fußnoten sichtbar.
