  text: בִּ֭/דְבָרִים לֹא יִוָּ֣סֶר עָ֑בֶד כִּֽי יָ֝בִ֗ין וְ/אֵ֣ין מַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/019.yaml
  text: A servant is not corrected by words alone[a], for though he understands[b], there is no response.
translation:
  language: de
  text: Mit Worten allein lässt sich ein Sklave[a] nicht zurechtbringen; denn obwohl er versteht, bleibt eine Antwort[b] aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort עֶבֶד kann je nach Zusammenhang „Sklave“, „Knecht“ oder „Diener“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „doch er antwortet nicht“. Gemeint sein kann sowohl eine mündliche Antwort als auch eine entsprechende Reaktion oder Handlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְבָרִים
  choice: mit Worten allein
  rationale: 'Die Präposition ב bezeichnet hier das Mittel. „Allein“ ist sinngemäß ergänzt, um den Gegensatz des Spruchs auszudrücken: Bloße Worte bewirken die Zurechtbringung nicht.'
- source_word: יִוָּסֶר
  choice: lässt sich … nicht zurechtbringen
  rationale: Das Nifal von יסר bezeichnet, dass jemand erzogen, diszipliniert oder korrigiert wird. „Zurechtbringen“ gibt die praktische Wirkung wieder, ohne die Aussage auf körperliche Strafe einzuengen.
- source_word: עָבֶד
  choice: Sklave
  rationale: עבד kann je nach Zusammenhang einen Diener oder einen unfreien beziehungsweise gebundenen Sklaven bezeichnen. „Sklave“ macht das hier vorausgesetzte Abhängigkeits- und Autoritätsverhältnis deutlich.
- source_word: כִּי יָבִין
  choice: denn obwohl er versteht
  rationale: 'כִּי leitet die Begründung ein; im Zusammenhang entsteht zugleich ein konzessiver Sinn: Er versteht zwar, doch eine Reaktion bleibt aus.'
- source_word: וְאֵין מַעֲנֶה
  choice: bleibt eine Antwort aus
  rationale: Die hebräische Nominalkonstruktion lautet wörtlich „und es gibt keine Antwort“. Die unpersönliche Formulierung bewahrt die Offenheit zwischen einer ausbleibenden mündlichen Antwort und fehlender entsprechender Reaktion.
theological_decisions: []
