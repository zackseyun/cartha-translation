source:
  edition: WLC
  text: גַּאֲוַ֣ת אָ֭דָם תַּשְׁפִּילֶ֑/נּוּ וּ/שְׁפַל ר֝֗וּחַ יִתְמֹ֥ךְ כָּבֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/023.yaml
  text: A man's pride will bring him low[a], but one who is lowly in spirit will obtain honor.
translation:
  language: de
  text: Der Hochmut eines Menschen erniedrigt ihn; wer aber demütigen Geistes ist, erlangt Ehre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hält an der Ehre fest“ beziehungsweise „gewinnt Ehre“. Das hebräische Verb kann „ergreifen“, „festhalten“ oder „erlangen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּאֲוַת
  choice: Hochmut
  rationale: Das Substantiv bezeichnet stolze Selbsterhöhung beziehungsweise Überheblichkeit. „Hochmut“ ist im deutschen Weisheitsstil natürlich und bildet einen klaren Gegensatz zur Demut im zweiten Halbvers.
- source_word: אָדָם
  choice: eines Menschen
  rationale: Der Singular bezeichnet hier einen repräsentativen einzelnen Menschen. Die Formulierung bleibt allgemein, ohne den Bezug kollektiv umzudeuten.
- source_word: תַּשְׁפִּילֶנּוּ
  choice: erniedrigt ihn
  rationale: 'Der Hifil von שׁפל hat kausative Bedeutung: niedrig machen, erniedrigen. Das Präsens gibt den allgemeingültigen Charakter des Spruchs im Deutschen idiomatisch wieder.'
- source_word: וּשְׁפַל רוּחַ
  choice: wer aber demütigen Geistes ist
  rationale: Die Wiedergabe bewahrt die innere Disposition des wörtlichen Ausdrucks „niedrig an Geist“, formuliert sie jedoch in natürlichem, würdigem Deutsch. „aber“ macht den hebräischen Gegensatz deutlich.
- source_word: יִתְמֹךְ
  choice: erlangt
  rationale: תמך kann „ergreifen“, „festhalten“ oder „stützen“ bedeuten. Mit „Ehre“ als Objekt bezeichnet es hier wahrscheinlich das Erlangen beziehungsweise Innehaben von Ehre; wegen der echten lexikalischen Spannweite werden Alternativen in einer Fußnote genannt.
- source_word: כָּבוֹד
  choice: Ehre
  rationale: Im Kontext der Sprüche bezeichnet כבוד gesellschaftliches Ansehen oder Ehre und steht im Gegensatz zur Erniedrigung.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Das gnomenhafte Präsens entspricht dem allgemeingültigen Aussagecharakter des hebräischen Imperfekts. Die semantische Offenheit von יִתְמֹךְ wird nicht stillschweigend beseitigt, sondern durch die Fußnote kenntlich gemacht.
