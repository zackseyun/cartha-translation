source:
  edition: WLC
  text: בְּ/פֶ֤שַֽׁע אִ֣ישׁ רָ֣ע מוֹקֵ֑שׁ וְ֝/צַדִּ֗יק יָר֥וּן וְ/שָׂמֵֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/006.yaml
  text: In the transgression of an evil man there is a snare[b][a], but the righteous sings for joy and rejoices.
translation:
  language: de
  text: Im Vergehen eines bösen Menschen liegt eine Falle[a], doch der Gerechte jubelt[b] und freut sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Durch das Vergehen eines bösen Menschen entsteht eine Falle.“ Das Hebräische kann entweder betonen, dass die Falle im Vergehen selbst liegt, oder dass das Vergehen sie herbeiführt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „singt vor Freude“. Das hebräische Verb kann einen freudigen Ruf oder jubelnden Gesang bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: Im Vergehen
  rationale: 'Die Verbindung von ב mit פֶּשַׁע wird zunächst lokal bzw. als enge Zuordnung wiedergegeben: Die Falle liegt im Vergehen selbst. Eine instrumentale Deutung bleibt in der Fußnote erhalten.'
- source_word: אִישׁ רָע
  choice: eines bösen Menschen
  rationale: Die Wendung bezeichnet einen moralisch bösen Menschen. „Mensch“ klingt im heutigen Deutsch natürlich und lässt die für Spruchweisheit typische allgemeine Aussage hervortreten, ohne die maskuline Form des Hebräischen unnötig zu betonen.
- source_word: מוֹקֵשׁ
  choice: eine Falle
  rationale: „Falle“ bewahrt das konkrete Bild des hebräischen Wortes und kann zugleich die Verstrickung bzw. die schädliche Folge des Vergehens bezeichnen.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv wird als typische Gestalt der Weisheitsliteratur wiedergegeben und bildet den knappen Gegensatz zum bösen Menschen.
- source_word: יָרוּן
  choice: jubelt
  rationale: Das Verb bezeichnet einen hörbaren, freudigen Ausruf oder Gesang. „Jubelt“ gibt diese laut geäußerte Freude idiomatisch wieder; die mögliche Nuance des Singens wird in der Fußnote genannt.
- source_word: וְשָׂמֵחַ
  choice: und freut sich
  rationale: Die partizipiale Form fügt dem hörbaren Jubel den anhaltenden Zustand der Freude hinzu. Die Doppelung bleibt entsprechend dem hebräischen Parallelismus erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwörtlicher Satzstruktur. Der Kontrast zwischen dem bösen Menschen und dem Gerechten sowie die zweifache Freudenäußerung des Hebräischen bleiben erhalten.
