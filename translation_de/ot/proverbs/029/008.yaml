  variant: modern standard German
source:
  edition: WLC
  text: אַנְשֵׁ֣י לָ֭צוֹן יָפִ֣יחוּ קִרְיָ֑ה וַ֝/חֲכָמִ֗ים יָשִׁ֥יבוּ אָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/008.yaml
  text: Mockers inflame a city[b][a], but wise men turn away anger.
translation:
  language: de
  text: Spötter bringen eine Stadt in Aufruhr[a], doch Weise wenden den Zorn ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Spötter setzen eine Stadt in Brand.« Das hebräische Verb kann bildhaft das Anfachen eines Feuers oder das Schüren von Unruhe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לָצוֹן
  choice: Spötter
  rationale: Die Konstruktverbindung bedeutet wörtlich »Männer des Spottes«. »Spötter« gibt den in den Sprüchen bezeichneten Menschentyp knapp und natürlich wieder.
- source_word: יָפִיחוּ
  choice: bringen … in Aufruhr
  rationale: Das Hifil von פוח zeichnet hier bildhaft ein Anfachen oder Entflammen. Im Zusammenhang mit einer Stadt bezeichnet es am ehesten das Schüren öffentlicher Unruhe; die Fußnote bewahrt das Brandbild als mögliche Wiedergabe.
- source_word: קִרְיָה
  choice: eine Stadt
  rationale: קִרְיָה bezeichnet eine Stadt oder Ortschaft. »Stadt« entspricht dem gesellschaftlichen Rahmen des Spruchs.
- source_word: חֲכָמִים
  choice: Weise
  rationale: Das maskuline Pluraladjektiv bezeichnet weise Menschen beziehungsweise weise Männer. Das substantivierte »Weise« ist im Deutschen knapp, würdig und bildet einen natürlichen Gegensatz zu »Spötter«.
- source_word: יָשִׁיבוּ
  choice: wenden … ab
  rationale: Das Hifil von שוב bedeutet »zurückwenden, abwenden«. Mit »Zorn« als Objekt bewahrt »abwenden« die Bewegungsrichtung des hebräischen Verbs.
- source_word: אָף
  choice: den Zorn
  rationale: אָף bedeutet wörtlich »Nase«, wird aber regelmäßig für Zorn gebraucht. »Zorn« passt zur kräftigen Sprache des Verses, ohne das Objekt näher zu bestimmen, als es der hebräische Text tut.
theological_decisions:
- issue: Wessen Zorn abgewendet wird
  choice: Das unbestimmte »den Zorn« bleibt erhalten.
  alternative: »ihren Zorn« oder »Gottes Zorn«
  rationale: Der hebräische Text nennt keinen Besitzer des Zorns. Eine Festlegung auf den Zorn der Stadtbevölkerung, der Spötter oder Gottes würde die offene Aussage unnötig einschränken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper sprichwörtlicher Gegenüberstellung. »In Aufruhr bringen« gibt die wahrscheinliche gesellschaftliche Wirkung idiomatisch wieder; die Fußnote erhält das zugrunde liegende Feuerbild und die lexikalische Mehrdeutigkeit.
