source:
  edition: WLC
  text: אַנְשֵׁ֣י דָ֭מִים יִשְׂנְאוּ תָ֑ם וִֽ֝/ישָׁרִ֗ים יְבַקְשׁ֥וּ נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/010.yaml
  text: Men of blood hate the blameless[a], but the upright seek his life.
translation:
  language: de
  text: Menschen, die Blut vergießen, hassen den Untadeligen; und die Aufrichtigen suchen sein Leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Aufrichtigen kümmern sich um sein Leben« oder »bemühen sich, ihn zu schützen«. Das Hebräische kann hier auch in einem positiven Sinn verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי דָמִים
  choice: Menschen, die Blut vergießen
  rationale: Die Wendung bezeichnet wörtlich »Männer des Blutes/Blutvergießens«. Die gewählte Form gibt den hebräischen Sinn in natürlichem, modernem Deutsch wieder, ohne ihn unnötig auf Mordlust oder einen einzelnen Gewaltakt einzuengen.
- source_word: יִשְׂנְאוּ
  choice: hassen
  rationale: Direkte und übliche Wiedergabe des hebräischen Verbs.
- source_word: תָם
  choice: den Untadeligen
  rationale: Das Wort bezeichnet hier einen Menschen von unversehrter, schuldloser oder untadeliger Lebensführung. »Untadelig« passt zum Sprachgebrauch der Weisheitsliteratur und bleibt von »aufrichtig« im zweiten Halbvers unterschieden.
- source_word: וִישָׁרִים
  choice: die Aufrichtigen
  rationale: Das in der Weisheitsliteratur häufige Wort bezeichnet moralisch geradlinige Menschen. Die substantivierte Pluralform bewahrt die Aussage über diese Personengruppe.
- source_word: יְבַקְשׁוּ
  choice: suchen
  rationale: Das Verb bedeutet grundsätzlich »suchen«. Hier lässt die Verbindung mit »sein Leben« sowohl eine bedrohliche als auch eine fürsorgliche Deutung zu; deshalb wird sie nicht durch ein eindeutigeres Verb aufgelöst.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נֶפֶשׁ kann »Leben«, »Selbst« oder »Person« bedeuten. »Sein Leben« bleibt nahe am Wortlaut und erhält die Mehrdeutigkeit der Wendung.
theological_decisions:
- issue: 'Mehrdeutigkeit des zweiten Halbverses: Suchen die Aufrichtigen das Leben des Untadeligen in feindlicher Absicht, oder kümmern sie sich darum und wollen es bewahren?'
  choice: die Aufrichtigen suchen sein Leben
  alternative: die Aufrichtigen kümmern sich um sein Leben / suchen ihn zu schützen
  rationale: Der hebräische Ausdruck יְבַקְשׁוּ נַפְשׁוֹ ist formal mehrdeutig. Die Hauptübersetzung bewahrt diese Spannung; die Fußnote nennt die positive, fürsorgliche Deutungsmöglichkeit, ohne sie in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Menschen, die Blut vergießen« vermeidet das unnatürliche »Männer des Blutes«; die bewusst knappe Formulierung »suchen sein Leben« hält dagegen die echte Mehrdeutigkeit des hebräischen zweiten Halbverses offen.
