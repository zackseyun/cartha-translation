  text: A rod and reproof give wisdom[a], but a boy left to himself brings shame to his mother.
translation:
  language: de
  text: Rute und Zurechtweisung geben Weisheit, doch ein sich selbst überlassener[a] Junge macht seiner Mutter Schande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Junge, den man gewähren lässt“ oder „ein Junge, dem keine Grenzen gesetzt werden“. Das hebräische Wort bedeutet wörtlich etwa „losgelassen“ oder „gehen gelassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: Rute
  rationale: Das Wort bezeichnet einen Stab oder eine Rute und hat hier im Zusammenhang der Erziehung eine disziplinierende Bedeutung. „Rute“ bewahrt das konkrete Bild, ohne es allgemein als „Strafe“ wiederzugeben.
- source_word: וְתוֹכַחַת
  choice: und Zurechtweisung
  rationale: תוֹכַחַת bezeichnet tadelnde oder korrigierende Rede. „Zurechtweisung“ ist im modernen Deutschen verständlich und ergänzt die konkrete Rute um die verbale Seite der Erziehung.
- source_word: יִתֵּן חָכְמָה
  choice: geben Weisheit
  rationale: Die schlichte Wiedergabe bewahrt die knappe Ausdrucksweise des hebräischen Spruchs. Das zusammengesetzte Subjekt erlaubt im Deutschen den Plural „geben“.
- source_word: נַעַר
  choice: Junge
  rationale: נַעַר kann ein Kind, einen Jugendlichen oder jungen Mann bezeichnen. Der Erziehungszusammenhang und der Bezug auf seine Mutter sprechen hier für „Junge“, wobei die maskuline Einzahl erhalten bleibt.
- source_word: מְשֻׁלָּח
  choice: sich selbst überlassen
  rationale: Das passive Partizip von שלח bedeutet wörtlich etwa „losgelassen“ oder „gehen gelassen“. Im Kontext bezeichnet es einen Jungen, dem keine Grenzen gesetzt werden; „sich selbst überlassen“ gibt dieses Bild idiomatisch wieder, ohne die mögliche Nuance fehlender Aufsicht oder Zucht auszublenden.
- source_word: מֵבִישׁ
  choice: macht … Schande
  rationale: Die Hifil-Form drückt das Verursachen von Scham oder Schande aus. „Macht seiner Mutter Schande“ ist eine natürliche deutsche Wendung und erhält den kausativen Sinn.
- source_word: אִמּוֹ
  choice: seiner Mutter
  rationale: Das Suffix der dritten Person maskulin Singular bezieht sich auf den Jungen; der Dativ ergibt sich aus der deutschen Wendung „jemandem Schande machen“.
