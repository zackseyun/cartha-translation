translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen Parallelstruktur eines Sprichworts. „Rute“ erhält das konkrete antike Erziehungsbild; „Zurechtweisung“ bleibt klarer und gebräuchlicher als das gehobenere „Zucht“. Der Fußnotenmarker steht unmittelbar nach der Aussage, auf deren mehrdeutigen Ausdruck er sich bezieht.
