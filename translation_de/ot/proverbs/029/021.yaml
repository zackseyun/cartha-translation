  naturalness: „Wer seinen Sklaven von Jugend an verwöhnt, dem wird er am Ende ein Sohn sein“ ist modernes, gut verständliches Deutsch mit dem knappen Spruchcharakter des Originals. Der Dativ „dem“ macht die im Deutschen erforderliche Beziehung zum Herrn deutlich, ohne eine förmliche Adoption zu behaupten.
