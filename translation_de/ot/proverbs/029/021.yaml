  text: מְפַנֵּ֣ק מִ/נֹּ֣עַר עַבְדּ֑/וֹ וְ֝/אַחֲרִית֗/וֹ יִהְיֶ֥ה מָנֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/021.yaml
  text: Whoever pampers his servant from youth[a], in the end he will become a son.
translation:
  language: de
  text: Wer seinen Sklaven von Jugend an verwöhnt, dem wird er am Ende ein Sohn sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort מָנוֹן (manon) kommt nur hier vor und ist in seiner Bedeutung unsicher. Es wird als »Sohn« oder als »einer, der wie ein Sohn auftritt«, verstanden: Der verwöhnte Sklave könnte dann am Ende die Stellung eines Sohnes beanspruchen. Andere deuten das Wort allgemeiner als »Ärger«, »Aufsässigkeit« oder ein schlimmes Ende.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְפַנֵּק
  choice: verwöhnt
  rationale: Das Piel-Partizip bezeichnet eine verzärtelnde, nachsichtige Behandlung. »Verwöhnt« gibt den im Spruch vorausgesetzten negativen Beiklang knapp und natürlich wieder.
- source_word: מִנֹּעַר
  choice: von Jugend an
  rationale: Die Wendung bezeichnet den Beginn in jungen Jahren; »von Jugend an« ist idiomatisch und bleibt nahe an der zeitlichen Aussage des Hebräischen.
- source_word: עַבְדּוֹ
  choice: seinen Sklaven
  rationale: עֶבֶד kann Diener oder Sklave bedeuten. Hier steht der Betreffende unter der dauerhaften Hausgewalt eines Herrn; »Sklave« macht diesen antiken sozialen Status sichtbar, ohne ihn zu beschönigen.
- source_word: וְאַחֲרִיתוֹ
  choice: am Ende
  rationale: אַחֲרִית bezeichnet hier den späteren Ausgang beziehungsweise das schließliche Ergebnis des beschriebenen Verhaltens.
- source_word: יִהְיֶה מָנוֹן
  choice: dem wird er … wie ein Sohn sein
  rationale: מָנוֹן ist ein nur hier belegtes und textlich schwer zu deutendes Wort. Die Hauptzeile folgt der Deutung als »Sohn« beziehungsweise »einer mit der Stellung oder dem Auftreten eines Sohnes«; »wie ein Sohn« vermeidet die überpräzise Behauptung einer förmlichen Adoption.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Spruchstil mit klarer Wenn-dann-ähnlicher Struktur. Die historisch konkrete Bezeichnung »Sklave« bleibt erhalten. Die schwer auflösbare Schlussaussage wird im Text lesbar formuliert und ihre echte lexikalische Unsicherheit in der Fußnote offengelegt.
