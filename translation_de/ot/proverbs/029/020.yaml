source:
  edition: WLC
  text: חָזִ֗יתָ אִ֭ישׁ אָ֣ץ בִּ/דְבָרָ֑י/ו תִּקְוָ֖ה לִ/כְסִ֣יל מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/020.yaml
  text: Do you see a man who is hasty in his words? There is more hope for a fool than for him[a].
translation:
  language: de
  text: Siehst du einen Mann, der vorschnell redet? Für einen Toren besteht mehr Hoffnung als für ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hast du einen Mann gesehen, der vorschnell redet? Für einen Toren besteht mehr Hoffnung als für ihn.« Die Perfektform am Anfang kann als rhetorische Beobachtung oder als direkte Frage in der Vergangenheit wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזִיתָ
  choice: Siehst du
  rationale: Das Qal-Perfekt in der 2. Person Singular kann hier als rhetorische Beobachtung verstanden werden. Die Präsensfrage gibt diese sprichwörtliche, unmittelbar ansprechende Wirkung im modernen Deutsch natürlich wieder; die formal nähere Vergangenheitsform wird in der Fußnote genannt.
- source_word: אִישׁ
  choice: einen Mann
  rationale: Das hebräische Substantiv bezeichnet hier ausdrücklich einen einzelnen Mann. Die Wiedergabe bewahrt Singular und Geschlechtsbezug des Ausgangstextes.
- source_word: אָץ בִּדְבָרָיו
  choice: der vorschnell redet
  rationale: אָץ bezeichnet unangemessene Eile; zusammen mit „seinen Worten“ geht es um übereiltes Sprechen. „Vorschnell redet“ ist im Deutschen natürlicher als eine wörtliche Formulierung wie „in seinen Worten hastig ist“ und bewahrt den Sinn.
- source_word: תִּקְוָה
  choice: Hoffnung
  rationale: Das Substantiv bezeichnet hier die Aussicht auf Besserung oder einen günstigen Ausgang. „Hoffnung“ ist die übliche und kontextgemäße deutsche Entsprechung.
- source_word: לִכְסִיל
  choice: für einen Toren
  rationale: כְּסִיל ist ein zentraler Weisheitsbegriff für einen moralisch wie verständig uneinsichtigen Menschen. „Tor“ bewahrt diese ethische Dimension und den würdevollen sprichwörtlichen Ton.
- source_word: מִמֶּנּוּ
  choice: als für ihn
  rationale: Die Präposition מִן hat hier vergleichende Funktion. Das Deutsche ergänzt den Vergleich idiomatisch als „mehr Hoffnung als für ihn“, wobei „ihn“ auf den vorschnell redenden Mann zurückverweist.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, prägnantem Sprichwortton. Die etwas unnatürliche hebräische Wortfolge „hastig in seinen Worten“ wird sinngenau als „vorschnell redet“ wiedergegeben; die rhetorische Mehrdeutigkeit der eröffnenden Verbform bleibt durch die Fußnote sichtbar.
