  text: חֶרְדַּ֣ת אָ֭דָם יִתֵּ֣ן מוֹקֵ֑שׁ וּ/בוֹטֵ֖חַ בַּ/יהוָ֣ה יְשֻׂגָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/025.yaml
  text: The fear of man lays a snare[b][a], but whoever trusts in Yahweh will be set on high.
translation:
  language: de
  text: Menschenfurcht wird zur Falle[a], doch wer auf Jahwe vertraut, wird in Sicherheit sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Menschenfurcht gibt eine Falle.“ Gemeint ist, dass die Furcht vor Menschen selbst zur Falle wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird geschützt sein“; wörtlich: „wird in eine unzugängliche Höhe gebracht“ und ist dadurch sicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְדַּת אָדָם
  choice: Menschenfurcht
  rationale: Die Verbindung bezeichnet Furcht oder angstvolles Erschrecken vor Menschen. „Menschenfurcht“ ist im Deutschen knapp, natürlich und bewahrt den allgemeinen Bezug auf andere Menschen.
- source_word: יִתֵּן מוֹקֵשׁ
  choice: stellt eine Falle
  rationale: Wörtlich heißt die Wendung „gibt eine Falle“. „Stellt eine Falle“ gibt das Bild des Hebräischen idiomatisch wieder, ohne die Metapher aufzulösen.
- source_word: וּבוֹטֵחַ
  choice: doch wer vertraut
  rationale: Das substantivisch gebrauchte Partizip hat allgemeinen, fortdauernden Sinn. „Wer vertraut“ ist eine natürliche geschlechtsübergreifende Wiedergabe.
- source_word: בַּיהוָה
  choice: auf Jahwe
  rationale: Die Präposition mit בטח wird im Deutschen idiomatisch als „auf jemanden vertrauen“ wiedergegeben; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: יְשֻׂגָּב
  choice: wird sicher geborgen
  rationale: Das passive Verb bezeichnet, dass jemand unerreichbar hoch und dadurch geschützt ist. Die Wiedergabe nennt die daraus folgende Sicherheit; eine Fußnote bewahrt das konkrete Höhenbild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht diesen Namen im Haupttext sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Menschenfurcht und Gottvertrauen
  choice: Den Gegensatz ohne ergänzende Erklärung stehen lassen
  alternative: Die Menschenfurcht ausdrücklich als Ursache des Scheiterns deuten
  rationale: Der Spruch stellt Furcht vor Menschen und Vertrauen auf Jahwe gegenüber. Die Übersetzung bewahrt diesen pointierten Gegensatz, ohne eine weitergehende Lehraussage einzutragen.
- issue: Bedeutung von יְשֻׂגָּב
  choice: wird sicher geborgen
  alternative: wird hoch emporgehoben
  rationale: Das Verb verbindet das Bild unerreichbarer Höhe mit Schutz. Der Haupttext gibt die Schutzbedeutung natürlich wieder; die Fußnote erhält die bildhafte wörtliche Alternative.
translation_notes:
  register: Moderne, knappe und würdige Spruchsprache. „Menschenfurcht“ hält die erste Zeile prägnant; „sicher geborgen“ ist allgemein verständlich, während die Fußnote das konkrete hebräische Höhenbild dokumentiert.
