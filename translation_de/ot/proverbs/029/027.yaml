  text: תּוֹעֲבַ֣ת צַ֭דִּיקִים אִ֣ישׁ עָ֑וֶל וְ/תוֹעֲבַ֖ת רָשָׁ֣ע יְשַׁר דָּֽרֶךְ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/027.yaml
  text: An unjust man is an abomination to the righteous[b][a], and one whose way is upright is an abomination to the wicked.
translation:
  language: de
  text: Ein ungerechter Mann ist den Gerechten ein Gräuel[a], und wer auf geradem Weg ist[b], ist dem Gottlosen ein Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „abscheulich“. Das hebräische Wort bezeichnet etwas, das starke Abscheu hervorruft.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „aufrichtig/gerade an Weg“; gemeint ist ein Mensch mit aufrichtigem Lebenswandel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: ein Gräuel
  rationale: Das Konstruktusnomen bezeichnet etwas, das starke moralische Abscheu hervorruft. „Ein Gräuel“ bewahrt diese Intensität und ist im Deutschen als biblisch geprägte, aber verständliche Wendung geläufig.
- source_word: צַדִּיקִים
  choice: den Gerechten
  rationale: Das substantivierte Adjektiv im Plural bezeichnet Menschen, die gerecht handeln. Der Dativ ergibt sich aus der idiomatischen deutschen Fügung „jemandem ein Gräuel sein“.
- source_word: אִישׁ עָוֶל
  choice: ein ungerechter Mann
  rationale: אִישׁ ist ein maskulines Singularnomen, während עָוֶל hier den Mann als von Unrecht geprägt kennzeichnet. Die Wiedergabe wahrt die grammatische Form und bleibt natürlich.
- source_word: רָשָׁע
  choice: dem Gottlosen
  rationale: Das substantivierte Adjektiv im Singular bezeichnet hier repräsentativ den schuldhaft bösen Menschen. „Der Gottlose“ ist eine geläufige Weisheitsliteratur-Bezeichnung und bildet den Gegensatz zu den Gerechten ab.
- source_word: יְשַׁר דָּרֶךְ
  choice: wer einen geraden Weg geht
  rationale: Die knappe hebräische Verbindung bedeutet wörtlich etwa „gerade an Weg“ und beschreibt einen Menschen mit aufrichtigem Lebenswandel. Die deutsche Formulierung erhält das Wegbild, ohne unnatürlich zu klingen.
- source_word: דָּרֶךְ
  choice: Weg
  rationale: „Weg“ bewahrt das für die Weisheitsliteratur typische Bild für Lebensführung und Verhalten, statt es erklärend zu „Lebenswandel“ aufzulösen.
theological_decisions:
- issue: Geschlechtsspezifische repräsentative Sprache in אִישׁ עָוֶל
  choice: „ein ungerechter Mann“
  alternative: „ein ungerechter Mensch“ oder „wer Unrecht tut“
  rationale: Der hebräische Text verwendet ausdrücklich das maskuline Singularnomen אִישׁ. „Mann“ bildet diese Form ab; der allgemeine sprichwörtliche Geltungsanspruch wird dadurch nicht auf Männer beschränkt.
- issue: Bezeichnung des רָשָׁע
  choice: „der Gottlose“
  alternative: „der Böse“ oder „der Frevler“
  rationale: Die Bezeichnung bleibt eine moralisch-religiöse Kategorie und vermeidet eine rein abstrakte Personifizierung des Bösen. Zugleich wird der Singular des Ausgangstextes gewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem Parallelismus. „Ein Gräuel sein“ und das Bild vom geraden Weg halten die kräftige Bildsprache des hebräischen Weisheitsspruchs fest; die Fußnoten erläutern die beiden bewusst bildhaften Wendungen.
