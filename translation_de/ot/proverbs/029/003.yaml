  text: אִֽישׁ אֹהֵ֣ב חָ֭כְמָה יְשַׂמַּ֣ח אָבִ֑י/ו וְ/רֹעֶ֥ה ז֝וֹנ֗וֹת יְאַבֶּד הֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/003.yaml
  text: A man who loves wisdom makes his father glad[a], but one who keeps company with prostitutes destroys wealth.
translation:
  language: de
  text: Ein Mann, der Weisheit liebt, macht seinem Vater Freude; wer sich aber mit Prostituierten abgibt[a], bringt sein Vermögen durch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „wer Prostituierte hütet/weidet“; die hebräische Wendung meint, dass jemand mit ihnen Umgang pflegt oder sie häufig aufsucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Ein Mann
  rationale: Das maskuline Singularsubstantiv bezeichnet in der Spruchform einen beispielhaften Einzelnen. „Ein Mann“ entspricht der Form des hebräischen Textes und klingt im Deutschen natürlich.
- source_word: אֹהֵב חָכְמָה
  choice: der Weisheit liebt
  rationale: Das Partizip beschreibt eine anhaltende Haltung oder charakteristische Eigenschaft. חָכְמָה bedeutet hier allgemein „Weisheit“ und wird nicht auf Belehrung verengt.
- source_word: יְשַׂמַּח אָבִיו
  choice: macht seinem Vater Freude
  rationale: Die Piel-Form drückt aus, dass der Sohn beim Vater Freude bewirkt. Die Formulierung bewahrt diesen kausativen Sinn in natürlichem modernem Deutsch; אָבִיו bezeichnet ausdrücklich „seinen Vater“.
- source_word: וְרֹעֶה זֹנוֹת
  choice: wer sich aber mit Prostituierten abgibt
  rationale: רֹעֶה hat wörtlich den Bildbereich des Hütens oder Weidens, bezeichnet in dieser Verbindung jedoch den Umgang mit beziehungsweise das häufige Aufsuchen von Prostituierten. „Sich mit … abgeben“ gibt den idiomatischen Sinn verständlich wieder, ohne die soziale und sexuelle Verbindung zu verharmlosen.
- source_word: זֹנוֹת
  choice: Prostituierten
  rationale: Das feminine Pluralwort bezeichnet Frauen, die Prostitution ausüben. „Prostituierte“ ist präzise, gegenwärtig und vermeidet unnötig abwertende oder altertümliche Ausdrücke.
- source_word: יְאַבֶּד הוֹן
  choice: bringt sein Vermögen durch
  rationale: Die Piel-Form bezeichnet das Zugrunderichten oder Verlorengehenlassen. Bei Vermögen ist „durchbringen“ eine natürliche deutsche Wendung für ruinösen Verbrauch; das im Deutschen ergänzte Possessivpronomen macht den im Zusammenhang vorausgesetzten Bezug deutlich.
