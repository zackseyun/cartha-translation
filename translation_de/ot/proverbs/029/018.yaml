id: PRO.29.18
reference: Proverbs 29:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/אֵ֣ין חָ֭זוֹן יִפָּ֣רַֽע עָ֑ם וְ/שֹׁמֵ֖ר תּוֹרָ֣ה אַשְׁרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/018.yaml
  text: Where there is no vision[a], a people cast off restraint[d][c][b]; but the one who keeps the law—happy is he.
translation:
  language: de
  text: Wo es keine Offenbarung[a] gibt, wird ein Volk zügellos[b]; wer aber die Weisung[c] bewahrt, ist glücklich[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »prophetische Schau« oder »Vision«. Gemeint ist Offenbarung von Gott, nicht lediglich menschliche Planung oder ehrgeizige Zielsetzung.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »verwildert« oder »lebt ohne Hemmungen«.'
    reason: lexical_alternative
  - marker: c
    text: Oder »das Gesetz« beziehungsweise »die Unterweisung«.
    reason: lexical_alternative
  - marker: d
    text: 'Oder »ist gesegnet«; wörtlicher: »glücklich ist er«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: Wo es keine … gibt
  rationale: 'Die Verbindung aus ב und אֵין beschreibt einen allgemeinen Umstand: »wo/wenn … nicht vorhanden ist«. Die gewählte Form ist im Deutschen natürlich und erhält den allgemeingültigen Charakter des Spruchs.'
- source_word: חָזוֹן
  choice: Offenbarung
  rationale: חָזוֹן bezeichnet hier eine von Gott gewährte prophetische Schau beziehungsweise Offenbarung, nicht menschliche Zukunftspläne. »Offenbarung« macht diesen Bezug im heutigen Deutsch klar; die traditionellere Wiedergabe »Vision« steht in der Fußnote.
- source_word: יִפָּרַע
  choice: wird … zügellos
  rationale: Das Nifal von פרע bezeichnet ein Losgelöst- oder Ungehemmtsein. »Wird zügellos« gibt die gesellschaftliche Entgrenzung knapp wieder; die früher verbreitete Wiedergabe »kommt um« ist hier lexikalisch nicht angemessen.
- source_word: עָם
  choice: ein Volk
  rationale: Das singularische Kollektivwort wird allgemein verstanden. Der unbestimmte Artikel hält den Spruch auf jedes Volk anwendbar.
- source_word: וְשֹׁמֵר
  choice: wer aber … bewahrt
  rationale: Das Partizip bezeichnet einen Menschen, dessen Handeln ihn kennzeichnet. Das adversative »aber« bringt den Gegensatz der beiden Spruchhälften zum Ausdruck.
- source_word: תּוֹרָה
  choice: die Weisung
  rationale: תּוֹרָה kann Gesetz, Lehre oder verbindliche Unterweisung bezeichnen. »Weisung« wahrt sowohl den unterweisenden als auch den verpflichtenden Sinn, ohne den Ausdruck unnötig auf ein modernes Gesetzbuch zu verengen.
- source_word: אַשְׁרֵהוּ
  choice: ist glücklich
  rationale: Die Seligpreisungsformel bezeichnet den beglückwünschenswerten, guten Stand eines Menschen. Die deutsche Wer-Konstruktion gibt den repräsentativen Singular natürlich wieder.
theological_decisions:
- issue: Bezug von חָזוֹן auf göttliche Offenbarung
  choice: »Offenbarung« bezeichnet eine von Gott kommende prophetische Mitteilung.
  alternative: »Vision« im Sinn menschlicher Zielvorstellungen oder gesellschaftlicher Zukunftspläne.
  rationale: Der hebräische Ausdruck חָזוֹן gehört zum Wortfeld prophetischer Offenbarung. Der Spruch beschreibt daher die Folgen fehlender göttlicher Weisung und formuliert nicht bloß einen Grundsatz über strategische Planung.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: »Weisung« erhält den Charakter verbindlicher göttlicher Unterweisung.
  alternative: »Gesetz« als stärker rechtlich oder als ausschließlicher Verweis auf das mosaische Gesetz verstandene Wiedergabe.
  rationale: Der unmittelbare Gegensatz zu חָזוֹן legt offenbarte Weisung nahe, doch der hebräische Ausdruck lässt sich hier nicht sicher auf eine engere rechtliche Bedeutung beschränken.
- issue: Singular und Geschlecht in אַשְׁרֵהוּ
  choice: Die Formulierung »wer …, ist glücklich« bewahrt den individuellen, repräsentativen Singular in natürlichem Deutsch.
  alternative: »Glücklich ist er« als formale Abbildung des maskulinen Pronominalsuffixes.
  rationale: Das hebräische Maskulinum hat in diesem allgemeinen Weisheitsspruch repräsentative Funktion. Die deutsche Wer-Konstruktion neutralisiert nicht den Numerus, vermeidet aber eine unnötig markierte oder missverständliche Geschlechtsfestlegung.
translation_notes:
  register: Moderner, knapper und würdiger Spruchstil. Die beiden parallelen Satzhälften bleiben deutlich erkennbar. »Offenbarung« verhindert das heute naheliegende Missverständnis von »Vision« als Organisationsziel; »Weisung« wahrt die in תּוֹרָה liegende Verbindung von Lehre und Verbindlichkeit.
