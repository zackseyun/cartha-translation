  source_fidelity: 'Die Übersetzung gibt den hebräischen Sinn zuverlässig wieder: חָזוֹן ist zutreffend als göttliche bzw. prophetische „Offenbarung“ verstanden; יִפָּרַע bezeichnet das Zügellos- bzw. Ungebundensein des Volkes, nicht dessen Untergang. Die Gegenüberstellung mit dem Bewahren der תּוֹרָה und dem beglückwünschenswerten Zustand des einzelnen Bewahrenden bleibt erhalten.'
  naturalness: „Wo es keine Offenbarung gibt, wird ein Volk zügellos; wer aber die Weisung bewahrt, ist glücklich“ ist modernes, idiomatisches Deutsch und wahrt zugleich den knappen Weisheitsspruch-Register. Die Wer-Konstruktion ist im Deutschen besonders natürlich.
  terminology: „Offenbarung“ verhindert zu Recht ein modernes, nicht im hebräischen Wort liegendes Verständnis von „Vision“ als bloßem Leitbild. „Weisung“ ist für תּוֹרָה sachgerecht, da es sowohl verbindliche Unterweisung als auch normative Geltung offenhält. Die Fußnoten bieten die wesentlichen lexikalischen Alternativen und sind korrekt an den jeweiligen Stellen verankert.
