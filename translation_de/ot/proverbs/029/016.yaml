source:
  edition: WLC
  text: בִּ/רְב֣וֹת רְ֭שָׁעִים יִרְבֶּה פָּ֑שַׁע וְ֝/צַדִּיקִ֗ים בְּֽ/מַפַּלְתָּ֥/ם יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/016.yaml
  text: When the wicked increase[a], transgression increases; but the righteous will look upon their downfall.
translation:
  language: de
  text: Wenn die Frevler zahlreicher werden, nimmt das Unrecht zu; doch die Gerechten werden ihren Sturz[a] sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihren Untergang. Das hebräische Wort kann einen Fall, Sturz oder Untergang bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: Wenn ... zahlreicher werden
  rationale: Die Präposition ב mit dem Infinitivus constructus von רבה bildet eine temporale beziehungsweise begleitende Angabe. Die Formulierung gibt idiomatisch wieder, dass die Zahl der Frevler wächst.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die moralisch schuldig handeln. „Frevler“ ist in deutscher Weisheitsliteratur knapp und würdevoll, ohne die stärker konfessionell geprägte Wiedergabe „Gottlose“ vorauszusetzen.
- source_word: יִרְבֶּה
  choice: nimmt ... zu
  rationale: Das Qal-Imperfekt von רבה greift das Verb des ersten Satzteils auf. „Nimmt zu“ bewahrt die inhaltliche Wiederholung in natürlichem Deutsch.
- source_word: פָּשַׁע
  choice: das Unrecht
  rationale: Das Wort kann Übertretung, Vergehen oder Auflehnung bezeichnen. „Unrecht“ ist hier als Sammelbegriff natürlich und lässt sowohl gesellschaftliche Vergehen als auch schuldhafte Auflehnung anklingen.
- source_word: וְצַדִּיקִים
  choice: doch die Gerechten
  rationale: Das ו verbindet die Satzteile mit erkennbarem Gegensatz. „Doch“ macht diesen Kontrast im Deutschen deutlich; „die Gerechten“ entspricht dem substantivierten Plural.
- source_word: בְּמַפַּלְתָּם
  choice: ihren Sturz
  rationale: מַפָּלָה bezeichnet Fall, Sturz oder Untergang; das Suffix der dritten Person Plural bezieht sich syntaktisch und im Parallelismus am ehesten auf die Frevler. Im Deutschen verlangt „sehen“ hier keine ausdrückliche Wiedergabe der Präposition ב.
- source_word: יִרְאוּ
  choice: werden ... sehen
  rationale: ראה bedeutet schlicht „sehen“. Die direkte Wiedergabe vermeidet zusätzliche Nuancen wie Schadenfreude, Genugtuung oder bloßes Miterleben.
theological_decisions:
- issue: Bezug des Suffixes in בְּמַפַּלְתָּם
  choice: „ihren“ bezieht sich auf die Frevler im ersten Satzteil.
  alternative: Das Suffix könnte unbestimmter auf diejenigen bezogen werden, die zu Fall kommen.
  rationale: Die Frevler sind der nächstliegende ausdrückliche Bezugspunkt; auch der Gegensatz zwischen ihrer Zunahme und dem, was die Gerechten schließlich sehen werden, stützt diese Lesart.
- issue: Haltung der Gerechten gegenüber dem Sturz der Frevler
  choice: Neutral mit „sehen“ wiedergegeben.
  alternative: „mit ansehen“ oder „triumphierend betrachten“ könnte eine stärkere Beteiligung beziehungsweise Genugtuung nahelegen.
  rationale: Der hebräische Text nennt lediglich das Sehen und sagt nichts ausdrücklich über die innere Haltung der Gerechten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der für Weisheitsliteratur üblichen Bezeichnung „Frevler“. Der Satz ist knapp gehalten und bewahrt den Gegensatz der beiden Vershälften sowie die verbale Entsprechung zwischen dem Mehrwerden der Frevler und der Zunahme des Unrechts.
