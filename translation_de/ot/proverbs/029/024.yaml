  text: Whoever shares with a thief hates his own life[b][a]; he hears a curse and does not disclose it.
translation:
  language: de
  text: Wer mit einem Dieb gemeinsame Sache macht, hasst sein eigenes Leben[a]; er hört einen Fluch[b] und sagt nichts aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Wer sich an der Tat eines Diebes beteiligt und verschweigt, was er weiß, schadet damit sich selbst.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „eine eidliche Beschwörung“ oder „einen Flucheid“. Das hebräische Wort kann einen Eid bezeichnen, der einen Fluch einschließt, wahrscheinlich in einer Rechtssituation, in der ein Zeuge zum Reden verpflichtet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹלֵק עִם גַּנָּב
  choice: mit einem Dieb gemeinsame Sache macht
  rationale: חוֹלֵק bezeichnet das Teilen oder die Beteiligung mit jemandem. Die deutsche Wendung gibt im Zusammenhang die Mittäterschaft beziehungsweise Teilhabe am Diebesgut natürlich wieder, ohne den genauen Umfang der Beteiligung festzulegen.
- source_word: שׂוֹנֵא נַפְשׁוֹ
  choice: hasst sein eigenes Leben
  rationale: נֶפֶשׁ kann hier das Leben oder die eigene Person bezeichnen. „Sein eigenes Leben“ bewahrt die starke hebräische Formulierung und macht den selbstschädigenden Charakter des Handelns deutlich, ohne „Seele“ im engeren Sinn einzutragen.
- source_word: אָלָה
  choice: eine Verfluchung
  rationale: אָלָה kann einen Fluch, einen mit Fluch verbundenen Eid oder eine feierliche Beschwörung bezeichnen. „Verfluchung“ hält den Fluchaspekt im Haupttext fest; die wahrscheinliche rechtliche Funktion wird in der Fußnote erläutert.
- source_word: יִשְׁמַע
  choice: er hört
  rationale: Das Verb bedeutet schlicht „hören“. Die Übersetzung bewahrt diese Zurückhaltung, statt bereits im Haupttext „wird unter Eid gestellt“ daraus zu machen.
- source_word: וְלֹא יַגִּיד
  choice: und sagt nichts aus
  rationale: Der Hifil von נגד bedeutet mitteilen, kundtun oder berichten. „Sagt nichts aus“ passt zum wahrscheinlichen Rechtszusammenhang und bleibt zugleich als gewöhnliche deutsche Formulierung verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gemeinsame Sache machen“ ist allgemein verständlich und gibt die verbrecherische Beteiligung idiomatisch wieder. Die zugespitzte Aussage „hasst sein eigenes Leben“ bleibt bewusst erhalten; die rechtliche Deutung der zweiten Vershälfte wird nicht stärker festgelegt, als der hebräische Wortlaut erlaubt.
