  text: גֶּ֭בֶר מַחֲלִ֣יק עַל רֵעֵ֑/הוּ רֶ֝֗שֶׁת פּוֹרֵ֥שׂ עַל פְּעָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/005.yaml
  text: A man who flatters his neighbor spreads a net for his steps[a][b].
translation:
  language: de
  text: Ein Mann, der seinem Nächsten schmeichelt,[a] breitet ihm ein Netz vor die Füße aus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinem Freund“, „seinem Gefährten“ oder „seinem Mitmenschen“. Das hebräische Wort kann einen Freund, Gefährten, Nächsten oder Mitmenschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „über seinen Schritten“ oder „über seinen Füßen“. Das Bild zeigt ein Netz, das jemandem in den Weg gelegt wird. Das Fürwort bezieht sich wahrscheinlich auf den geschmeichelten Nächsten; grammatisch kann es auch auf den Schmeichler bezogen werden: „vor seinen eigenen Füßen“.'
    reason: ambiguity
lexical_decisions:
- source_word: גֶּבֶר
  choice: Ein Mann
  rationale: Das Substantiv bezeichnet grammatisch und lexikalisch einen Mann. Die konkrete Form bleibt erhalten, ohne die allgemeine Geltung des Spruchs auszuschließen.
- source_word: מַחֲלִיק
  choice: der … schmeichelt
  rationale: Das Hifil-Partizip von חלק bezeichnet hier bildlich glatte, schmeichelnde Rede. „Schmeichelt“ gibt die idiomatische Bedeutung knapp und natürlich wieder.
- source_word: עַל רֵעֵהוּ
  choice: seinem Mitmenschen
  rationale: רֵעַ kann einen Nächsten, Freund, Gefährten oder sozialen Mitmenschen bezeichnen. „Mitmensch“ bewahrt die Breite des Ausdrucks; die Präposition עַל wird entsprechend der idiomatischen Verbindung mit dem Verb nicht separat abgebildet.
- source_word: רֶשֶׁת
  choice: ein Netz
  rationale: Das Wort bezeichnet ein zum Fangen ausgespanntes Netz und erhält das konkrete Fallenbild.
- source_word: פּוֹרֵשׂ
  choice: breitet … aus
  rationale: Das Partizip von פרש bedeutet „ausbreiten/ausspannen“. „Ein Netz ausbreiten“ ist verständlich und bleibt eng am hebräischen Bild.
- source_word: עַל פְּעָמָיו
  choice: vor dessen Schritten
  rationale: פְּעָמִים meint Schritte beziehungsweise Füße. „Vor dessen Schritten“ macht das Bild einer im Weg ausgelegten Falle natürlich verständlich. „Dessen“ verdeutlicht, dass sich das Suffix am wahrscheinlichsten auf den geschmeichelten Mitmenschen bezieht.
theological_decisions:
- issue: Bezug des Suffixes in עַל פְּעָמָיו
  choice: auf den geschmeichelten Mitmenschen („dessen Schritten“)
  alternative: auf den Schmeichler selbst („seinen eigenen Schritten“)
  rationale: Der unmittelbare Sinn des Fallenbildes spricht am ehesten dafür, dass die Schmeichelei dem Angesprochenen eine Falle stellt. Da die hebräische Form grammatisch auch anders bezogen werden kann, wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau wahrt die knappe Parallelität des hebräischen Spruchs; „Mitmensch“ ist breit verständlich und vermeidet eine unnötige Verengung auf einen engen Freundeskreis.
