  terminology: „Sohn“ erhält den maskulinen Singular des Hebräischen. „Seele“ ist als traditionelle und weiterhin verständliche Wiedergabe von נפש vertretbar; die Fußnote nennt die wesentlichen Bedeutungsalternativen. Die Fußnotenanker stehen jeweils bei dem erläuterten deutschen Ausdruck.
