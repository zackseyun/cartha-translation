id: PRO.29.17
reference: Proverbs 29:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יַסֵּ֣ר בִּ֭נְ/ךָ וִֽ/ינִיחֶ֑/ךָ וְ/יִתֵּ֖ן מַעֲדַנִּ֣ים לְ/נַפְשֶֽׁ/ךָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/017.yaml
  text: Discipline your son[a], and he will give you rest[b]; he will give delights to your soul.
translation:
  language: de
  text: Weise deinen Sohn zurecht, dann wird er dir Ruhe verschaffen und deiner Seele[b] Freuden[a] schenken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Annehmlichkeiten“, „Wonnen“ oder „köstliche Dinge“. Das hebräische Wort bezeichnet etwas Angenehmes oder Erfreuliches.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für „Seele“ kann hier auch das Leben oder das innere Selbst bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֵּר
  choice: Weise … zurecht
  rationale: Der Piel-Imperativ von יסר bezeichnet aktive, erzieherische Korrektur. „Zurechtweisen“ ist im heutigen Deutsch klar und vermeidet die vorwiegend körperliche oder altertümliche Wirkung von „züchtigen“.
- source_word: בִּנְךָ
  choice: deinen Sohn
  rationale: Das Hebräische bezeichnet ausdrücklich den Sohn im maskulinen Singular; diese Form wird nicht zu „Kind“ verallgemeinert.
- source_word: וִינִיחֶךָ
  choice: dann wird er dir Ruhe verschaffen
  rationale: 'Die Hifil-Form von נוח hat kausativen Sinn: Der Sohn wird bewirken, dass der Angesprochene Ruhe oder Erleichterung findet. „Ruhe verschaffen“ gibt dies natürlich wieder.'
- source_word: וְיִתֵּן
  choice: und … schenken
  rationale: נתן bedeutet grundsätzlich „geben“. Im Deutschen verbindet „schenken“ sich idiomatisch mit „Freuden“ und bewahrt den Gedanken des Gebens.
- source_word: מַעֲדַנִּים
  choice: Freuden
  rationale: Das Substantiv bezeichnet erfreuliche, angenehme oder köstliche Dinge. „Freuden“ ist im Kontext natürlich, ohne den Ausdruck unnötig auf Speisen oder Luxus festzulegen.
- source_word: לְנַפְשֶׁךָ
  choice: deiner Seele
  rationale: נפש kann Seele, Leben oder das eigene innere Selbst bezeichnen. „Seele“ erhält die Bildsprache und die innere Dimension des hebräischen Ausdrucks.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zurechtweisen“ vermeidet die im heutigen Sprachgebrauch naheliegende Verengung von „züchtigen“ auf körperliche Bestrafung. Die Satzfolge mit „dann“ macht die im Hebräischen ausgedrückte Folgebeziehung klar; „Freuden schenken“ bewahrt zugleich den poetischen Parallelismus.
