  text: מֹ֭שֵׁל מַקְשִׁ֣יב עַל דְּבַר שָׁ֑קֶר כָּֽל מְשָׁרְתָ֥י/ו רְשָׁעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/012.yaml
  text: If a ruler listens to a lying word, all his servants become wicked.
translation:
  language: de
  text: Wenn ein Herrscher einer Lüge Gehör schenkt, sind alle seine Diener böse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֹשֵׁל
  choice: Herrscher
  rationale: Bezeichnet allgemein einen Regierenden oder Machthaber; „Herrscher“ bewahrt den politischen und autoritativen Sinn ohne unnötige Spezifizierung.
- source_word: מַקְשִׁיב עַל דְּבַר שָׁקֶר
  choice: auf Lügen hört
  rationale: מַקְשִׁיב bezeichnet aufmerksames Hören bzw. Gehörschenken. דְּבַר שָׁקֶר ist wörtlich ein „Wort der Lüge/Falschheit“; die idiomatische deutsche Wendung erfasst wiederholte oder grundsätzlich akzeptierte falsche Aussagen.
- source_word: מְשָׁרְתָיו
  choice: seine Diener
  rationale: Gemeint sind Personen, die dem Herrscher dienen bzw. ihn als Amtsleute umgeben. „Diener“ bleibt nahe am hebräischen Ausdruck und ist allgemein verständlich.
- source_word: רְשָׁעִים
  choice: böse
  rationale: Das Wort bezeichnet moralisch schuldhafte, gottlose oder verbrecherische Menschen. In der prädikativen Form „werden … böse“ klingt modernes Deutsch natürlich und vermeidet das heute markierte Substantiv „Frevler“.
theological_decisions:
- issue: Zustandsaussage oder korrumpierende Folge
  choice: „werden … böse“ als Folge des Verhaltens des Herrschers
  alternative: „sind … böse“ als rein feststellende Zustandsaussage
  rationale: Im Hebräischen steht kein ausdrückliches Verb für „werden“; der nominale Nachsatz kann formal „alle seine Diener sind böse“ heißen. Die Wenn-dann-Struktur des Spruchs legt jedoch eine kausale bzw. korrumpierende Wirkung nahe. „Werden“ macht diese im Kontext naheliegende Beziehung verständlich, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, knappes und sprichwortartiges Standarddeutsch. Die Formulierung ist würdig und unmittelbar verständlich; die Parallelität von Herrscher und Dienern bleibt erhalten.
