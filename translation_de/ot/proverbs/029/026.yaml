source:
  edition: WLC
  text: רַ֭בִּים מְבַקְשִׁ֣ים פְּנֵי מוֹשֵׁ֑ל וּ֝/מֵ/יְהוָ֗ה מִשְׁפַּט אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/026.yaml
  text: Many seek the face of a ruler, but from the LORD comes a man's justice.
translation:
  language: de
  text: Viele suchen die Gunst eines Herrschers, doch vom HERRN erhält jeder sein Recht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »doch vom HERRN kommt das Urteil über jeden Menschen.«'
    reason: מִשְׁפַּט אִישׁ kann sowohl das einem Menschen zukommende Recht als auch das Urteil über ihn bezeichnen; die Fußnote bewahrt diese echte Bedeutungsbreite.
lexical_decisions:
- source_word: מְבַקְשִׁים פְּנֵי מוֹשֵׁל
  choice: suchen die Gunst eines Herrschers
  rationale: Die Wendung »das Angesicht suchen« bezeichnet hier idiomatisch den Versuch, Zugang, Wohlwollen oder eine günstige Entscheidung bei einem Machthaber zu erlangen. »die Gunst suchen« gibt den Sinn in natürlichem modernem Deutsch wieder.
- source_word: מִשְׁפַּט אִישׁ
  choice: jeder sein Recht
  rationale: מִשְׁפַּט kann das einem Menschen zustehende Recht bzw. gerechte Urteil bezeichnen; אִישׁ ist distributiv zu verstehen. Die Formulierung wahrt den Bezug auf den einzelnen Menschen, ohne das Ergebnis unnötig als stets günstigen Richterspruch festzulegen.
- source_word: מֵיְהוָה
  choice: vom HERRN
  rationale: Die traditionelle deutsche Wiedergabe des Tetragramms als »HERR« ist würdig, geläufig und entspricht der konsultierten Fassung.
theological_decisions:
- issue: Quelle des Rechts gegenüber menschlicher Herrschaft
  choice: »doch vom HERRN erhält jeder sein Recht«
  alternative: »aber vom HERRN kommt das Urteil über einen Menschen«
  rationale: Der Kontrast zwischen gesuchter menschlicher Gunst und der letztlichen Herkunft von Recht bzw. Urteil bei JHWH bleibt erhalten. Die Übersetzung legt nicht fest, auf welche Weise Gott dieses Recht herbeiführt.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich sprichworthaft-würdiges Deutsch. Das körperhafte hebräische Idiom »das Angesicht suchen« wird sinnvoll idiomatisch wiedergegeben; der knappe Gegensatz des Originals bleibt gewahrt.
