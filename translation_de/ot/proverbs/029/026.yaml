  source_fidelity: 'Die Übersetzung gibt den Parallelismus und Kontrast des Hebräischen zutreffend wieder: Viele bemühen sich um das Wohlwollen eines menschlichen Machthabers; das einem einzelnen Menschen zukommende Recht bzw. die letztliche Rechtsentscheidung kommt von JHWH. »Gunst suchen« ist eine angemessene idiomatische Entfaltung von »das Angesicht eines Herrschers suchen«. »jeder sein Recht« gibt die generische/distributive Funktion von אִישׁ natürlich wieder, ohne den Vers auf einen günstigen Urteilsausgang festzulegen.'
  naturalness: Der Satz ist knapp, gut verständlich und in modernem Standarddeutsch sprichworthaft formuliert. Die Gegenüberstellung mit »doch« funktioniert idiomatisch. »HERRN« ist in dieser Registerlage geläufig.
  terminology: »HERR« ist eine etablierte deutsche Wiedergabe des Tetragramms. »Recht« deckt מִשְׁפָּט im Kontext angemessen ab; die Fußnote nennt mit »Urteil über jeden Menschen« die relevante alternative Auslegungsmöglichkeit, ohne sie in den Haupttext zu erzwingen.
