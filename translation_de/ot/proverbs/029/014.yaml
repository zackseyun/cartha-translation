  - severity: low
    issue: Die erste Fußnotenalternative „die Armen treu richtet“ ist im Deutschen unidiomatisch.
    rationale: „Treu richten“ ist keine natürliche moderne Verbindung. Eine parallele Formulierung mit „Recht sprechen“ ist klarer.
