  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Begriffe zutreffend wieder: ein allgemein gefasster König, Rechtsprechung zugunsten bzw. in Bezug auf Arme, die Dauer seines Thrones und die Nifal-Bedeutung von כון. „Wahrhaftig richtet“ ist jedoch als deutsche Entsprechung von בֶּאֱמֶת nicht optimal: Es kann vor allem die Aufrichtigkeit des Richters hervorheben und klingt in Verbindung mit „richten“ unidiomatisch. „Wahrheitsgemäß Recht spricht“ bildet den Bezug auf Wahrheit zuverlässig ab und lässt die im Fußnotenhinweis genannten Nuancen offen.'
  naturalness: „Den Armen wahrheitsgemäß Recht spricht“ ist modernes, verständliches Standarddeutsch und juristisch passend. Es ist idiomatischer als „die Armen wahrhaftig richtet“. Der Gedankenstrich passt zur knapp-parallelen Form des Spruchs.
  terminology: „Recht sprechen“ wahrt den gerichtlichen Sinn von שׁוֹפֵט. „Die Armen“/„den Armen“ gibt דַּלִּים sachgerecht wieder. „Thron“, „für immer“ und „fest stehen“ sind treffend. Die Fußnote sollte die Alternativen ebenfalls mit „Recht sprechen“ formulieren, damit sie natürlich und semantisch vergleichbar bleiben.
