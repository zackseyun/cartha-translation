  yaml_path: translation/ot/proverbs/029/014.yaml
  text: A king who judges the poor with truth—his throne will be established forever[a].
translation:
  language: de
  text: Ein König, der den Armen wahrheitsgemäß Recht spricht – sein Thron wird für immer fest stehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Armen treu Recht spricht“ oder „den Armen gerecht Recht spricht“. Der hebräische Ausdruck kann Wahrheit, Wahrhaftigkeit, Treue oder Gerechtigkeit im Rechtsprechen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: Ein König
  rationale: Der artikellose Ausdruck bezeichnet hier allgemein einen König; die konkrete königliche Bildwelt bleibt erhalten.
- source_word: שׁוֹפֵט
  choice: der … richtet
  rationale: Das Partizip beschreibt den König näher und bewahrt den gerichtlichen Sinn des Verbs.
- source_word: בֶּאֱמֶת
  choice: wahrhaftig
  rationale: Die Wiedergabe hält die Verbindung zu Wahrheit und Wahrhaftigkeit offen, ohne die Bedeutung ausschließlich auf Gerechtigkeit oder Treue einzuengen.
- source_word: דַּלִּים
  choice: die Armen
  rationale: דַּלִּים bezeichnet sozial Niedrige, Arme oder Schwache; im Zusammenhang königlicher Rechtsprechung ist „die Armen“ die geläufigste konkrete Wiedergabe.
- source_word: כִּסְאוֹ
  choice: sein Thron
  rationale: Die Übersetzung bewahrt das konkrete Bild des Thrones und zugleich dessen metonymischen Bezug auf die Herrschaft.
- source_word: לָעַד
  choice: für immer
  rationale: Die Wendung bezeichnet bleibende Dauer; „für immer“ entspricht dem hebräischen Ausdruck, wobei der weisheitliche Gattungsrahmen die Aussage prägt.
- source_word: יִכּוֹן
  choice: wird … fest stehen
  rationale: Das Nifal von כון bezeichnet das Gefestigt- oder Bestandhaben; „fest stehen“ ist im Deutschen natürlich und passt zum Bild des Thrones.
theological_decisions:
- issue: Aussagekraft von לָעַד in der Weisheitsliteratur
  choice: „für immer“ als Aussage dauerhafter, beständiger Königsherrschaft
  alternative: „lange Zeit“ oder „auf Dauer“
  rationale: Die direkte Dauerangabe des Hebräischen wird bewahrt, ohne daraus über den sprichwörtlichen Aussagecharakter hinaus eine technische metaphysische Garantie abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet die knappe Folgerungsstruktur des Spruchs ab; „richtet“ wahrt den gerichtlichen Kontext, und die Fußnote erhält die Bedeutungsbreite von בֶּאֱמֶת.
