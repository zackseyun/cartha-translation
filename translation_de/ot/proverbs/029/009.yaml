  text: אִֽישׁ חָכָ֗ם נִ֭שְׁפָּט אֶת אִ֣ישׁ אֱוִ֑יל וְ/רָגַ֥ז וְ֝/שָׂחַ֗ק וְ/אֵ֣ין נָֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/009.yaml
  text: If a wise man has a dispute with a foolish man[a], whether he rages or laughs[b], there is no rest.
translation:
  language: de
  text: Wenn ein weiser Mann mit einem törichten Mann streitet[a] – ob es nun zum Zorn oder zum Lachen[b] kommt –, gibt es keine Ruhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn ein weiser Mann mit einem Toren streitet, mag der Tor sich ereifern oder lachen; Ruhe kehrt nicht ein.“ Der hebräische Text sagt nicht ausdrücklich, ob der Weise oder der Tor sich ereifert beziehungsweise lacht; viele verstehen aus dem Zusammenhang den Toren als Subjekt.'
    reason: alternative_reading
  - marker: b
    text: „Lachen“ kann hier spöttisches Lachen oder Hohn bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חָכָם
  choice: ein weiser Mann
  rationale: Die Wiedergabe bewahrt die ausdrücklich maskuline Singularform und zugleich den sprichwörtlich-repräsentativen Charakter.
- source_word: נִשְׁפָּט אֶת
  choice: mit … streitet
  rationale: Das Nifal von שׁפט bezeichnet hier am ehesten eine rechtliche oder sonstige Auseinandersetzung. „Streitet mit“ ist natürliches heutiges Deutsch, ohne den Kontext unnötig auf ein Gerichtsverfahren festzulegen.
- source_word: אִישׁ אֱוִיל
  choice: einem törichten Mann
  rationale: „Töricht“ gibt אֱוִיל im weisheitlichen Sinn wieder und erhält die formale Entsprechung zu „weiser Mann“.
- source_word: וְרָגַז
  choice: ob er sich ereifert
  rationale: רגז beschreibt heftige Erregung oder Zorn. Das unbestimmte Pronomen bewahrt die im Hebräischen offene Zuordnung des Handelnden.
- source_word: וְשָׂחַק
  choice: oder lacht
  rationale: „Lacht“ wahrt die Grundbedeutung von שׂחק; ein spöttischer Unterton ist im Zusammenhang möglich und wird in der Fußnote genannt.
- source_word: וְאֵין נָחַת
  choice: kommt keine Ruhe auf
  rationale: Die idiomatische Formulierung gibt das Fehlen von Ruhe, Beruhigung oder einer befriedenden Lösung natürlich wieder.
theological_decisions:
- issue: Subjekt von „sich ereifert“ und „lacht“
  choice: Die grammatische Mehrdeutigkeit bleibt durch „er“ erhalten.
  alternative: Die Handlungen ausdrücklich dem törichten Mann zuordnen.
  rationale: Der hebräische Text nennt das Subjekt nicht erneut. Obwohl viele den Toren als Subjekt verstehen, soll diese kontextuelle Deutung nicht stillschweigend in den Haupttext eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Formulierung „weiser Mann … törichter Mann“ folgt der Gestalt des hebräischen Spruchs. Die Gedankenstriche machen die Mittelwendung lesbar, ohne die syntaktische Mehrdeutigkeit aufzulösen.
