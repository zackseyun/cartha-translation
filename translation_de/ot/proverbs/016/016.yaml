source:
  edition: WLC
  text: קְֽנֹה חָכְמָ֗ה מַה טּ֥וֹב מֵ/חָר֑וּץ וּ/קְנ֥וֹת בִּ֝ינָ֗ה נִבְחָ֥ר מִ/כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/016.yaml
  text: To acquire wisdom—how much better than gold! And to acquire understanding is to be chosen over silver.
translation:
  language: de
  text: Erwirb Weisheit – wie viel besser ist das als Gold! Und Einsicht zu erwerben ist Silber vorzuziehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְנֹה / וּקְנוֹת
  choice: zu erwerben
  rationale: Der Infinitiv drückt den Erwerb von Weisheit beziehungsweise Einsicht aus; die Wiederholung wird zur Wahrung des Parallelismus beibehalten.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und kontextgerechte Wiedergabe des hebräischen Begriffs.
- source_word: חָרוּץ
  choice: Gold
  rationale: Bezeichnet hier kostbares Gold und steht parallel zu Silber.
- source_word: בִּינָה
  choice: Einsicht
  rationale: Gibt das Vermögen zu unterscheiden und zu verstehen prägnant wieder.
- source_word: נִבְחָר
  choice: ist ... vorzuziehen
  rationale: Das passive Partizip bezeichnet etwas, das gewählt beziehungsweise bevorzugt wird; die deutsche Formulierung ist natürlich und bewahrt den Wertvergleich.
- source_word: כָּסֶף
  choice: Silber
  rationale: Direkte Wiedergabe und Parallele zu Gold.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Ausruf und der parallele Satzbau machen den gesteigerten Wert von Weisheit und Einsicht gegenüber Edelmetallen deutlich, ohne den Weisheitsspruch konfessionell auszudeuten.
