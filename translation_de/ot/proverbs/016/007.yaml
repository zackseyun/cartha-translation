id: PRO.16.7
reference: Proverbs 16:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בִּ/רְצ֣וֹת יְ֭הוָה דַּרְכֵי אִ֑ישׁ גַּם א֝וֹיְבָ֗י/ו יַשְׁלִ֥ם אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/007.yaml
  text: When a man's ways please Yahweh[a], he makes even his enemies be at peace with him.
translation:
  language: de
  text: Wenn die Wege eines Menschen Jahwe gefallen, lässt Jahwe sogar dessen Feinde mit ihm Frieden halten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְצוֹת
  choice: Wenn … gefallen
  rationale: Die Präposition ב mit dem Infinitivus constructus von רצה bildet hier einen temporalen beziehungsweise umstandsbezogenen Nebensatz. „Wenn … gefallen“ gibt die Aussage im Deutschen natürlich und knapp wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דַּרְכֵי אִישׁ
  choice: die Wege eines Menschen
  rationale: „Wege“ bezeichnet hier Lebensführung und Verhalten. אִישׁ steht generisch; „eines Menschen“ wahrt diesen allgemeinen Sinn in natürlichem modernem Deutsch.
- source_word: גַּם
  choice: sogar
  rationale: „Sogar“ bringt die steigernde und hervorhebende Funktion von גַּם passend zum Ausdruck.
- source_word: אֹיְבָיו
  choice: dessen Feinde
  rationale: Das Demonstrativpronomen macht eindeutig, dass es sich um die Feinde des zuvor genannten Menschen handelt.
- source_word: יַשְׁלִם אִתּוֹ
  choice: lässt … mit ihm Frieden halten
  rationale: Der Hifil von שלם bezeichnet hier am wahrscheinlichsten das Bewirken eines friedlichen Verhältnisses; אִתּוֹ bezeichnet die Beziehung „mit ihm“. Die Formulierung bewahrt den kausativen Sinn, ohne zwingend eine förmliche Versöhnung oder einen Friedensschluss vorauszusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname hält den Unterschied zwischen dem Tetragramm und göttlichen Titeln sichtbar.
- issue: Generischer Sinn von אִישׁ
  choice: eines Menschen
  alternative: eines Mannes
  rationale: Im Spruch ist kein bestimmter männlicher Mensch gemeint. „Mensch“ gibt die repräsentative, allgemeinmenschliche Bedeutung wieder, ohne den Aussagebereich einzuengen.
- issue: Reichweite der von Gott bewirkten Friedlichkeit
  choice: lässt … Frieden halten
  alternative: versöhnt … mit ihm
  rationale: Der hebräische Kausativ spricht davon, dass Gott ein friedliches Verhältnis bewirkt. „Versöhnen“ würde stärker eine vorherige persönliche Entzweiung und deren Beilegung festlegen, als der Text verlangt.
translation_notes:
  register: Knappe, würdige Spruchsprache in modernem Standarddeutsch. Die Wiederholung von „Jahwe“ vermeidet eine mögliche Unklarheit beim Subjekt von יַשְׁלִם; „dessen“ und „mit ihm“ beziehen sich eindeutig auf den Menschen.
