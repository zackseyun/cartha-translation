  terminology: „Unheil“ bewahrt bei רָעָה die Spannung zwischen bösem Tun und dessen schädlicher Wirkung; die Fußnote nennt „Böses“ zutreffend als Alternative. „Sengendes Feuer“ gibt צָרָבֶת plausibel wieder. Die Fußnote zu b sollte die Vergleichspartikel ausdrücklich nennen und nicht so formuliert sein, als fehle im Hebräischen lediglich ein Verb.
