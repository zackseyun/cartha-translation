base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/027.yaml
  text: A worthless man digs up evil[b][a], and on his lips is a scorching fire.
translation:
  language: de
  text: 'Ein ruchloser Mann gräbt Unheil aus[a],

    und auf seinen Lippen ist es wie sengendes Feuer[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gräbt Böses aus“. Das hebräische Wort kann sowohl moralisch Böses als auch Unheil oder Schaden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen verkürzt: „und auf seinen Lippen wie sengendes Feuer“; „wie“ kennzeichnet den Vergleich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Mann
  rationale: Das singularische maskuline Substantiv bezeichnet hier den Vertreter eines bestimmten Menschentyps; „Mann“ gibt Form und Aussage des Hebräischen genau wieder.
- source_word: בְּלִיַּעַל
  choice: nichtswürdig
  rationale: Der Ausdruck kennzeichnet in diesem Weisheitsspruch moralische Verworfenheit und ist hier kein Eigenname. „Nichtswürdig“ bewahrt diese wertende Bedeutung in würdiger, verständlicher Sprache.
- source_word: כֹּרֶה
  choice: gräbt … aus
  rationale: Das Partizip von כרה bedeutet wörtlich „graben“. „Ausgraben“ erhält das konkrete Bild und kann im Deutschen zugleich das Hervorbringen oder Aufspüren von Unheil bezeichnen.
- source_word: רָעָה
  choice: Unheil
  rationale: Das Wort kann sowohl moralisch Böses als auch verursachten Schaden oder Verderben bezeichnen. „Unheil“ passt natürlich zum Bild des Ausgrabens und lässt die zerstörerische Dimension offen; die moralische Alternative wird in der Fußnote genannt.
- source_word: שפתיו
  choice: seinen Lippen
  rationale: Die wörtliche Körpermetapher „seine Lippen“ wird beibehalten, statt sie erklärend zu „seinen Worten“ aufzulösen.
- source_word: כְּאֵשׁ צָרָבֶת
  choice: wie sengendes Feuer
  rationale: כְּ markiert ausdrücklich einen Vergleich. Das seltene צָרָבֶת bezeichnet etwas Brennendes oder Sengendes; „sengendes Feuer“ bewahrt Bild und zerstörerische Intensität.
- source_word: וְעַל
  choice: und auf
  rationale: Konjunktion und Präposition werden unmittelbar wiedergegeben; „auf seinen Lippen“ entspricht der hebräischen Bildsprache.
theological_decisions:
- issue: Bedeutung von רָעָה
  choice: Unheil
  alternative: Böses
  rationale: Der Kontext erlaubt sowohl eine Betonung moralischer Bosheit als auch des angerichteten Verderbens. Die Übersetzung entscheidet sich aus idiomatischen Gründen für „Unheil“, hält die echte Bedeutungsbreite jedoch in einer Fußnote fest.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewahrter hebräischer Bildsprache. Das ergänzte „ist es“ macht den elliptischen zweiten Halbvers im Deutschen verständlich, ohne den Vergleich mit Feuer in eine Identitätsaussage umzudeuten.
