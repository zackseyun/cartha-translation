id: PRO.16.29
reference: Proverbs 16:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִ֣ישׁ חָ֭מָס יְפַתֶּ֣ה רֵעֵ֑/הוּ וְ֝/הוֹלִיכ֗/וֹ בְּ/דֶ֣רֶךְ לֹא טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/029.yaml
  text: A violent man entices his neighbor and leads him in a way that is not good[a][b].
translation:
  language: de
  text: Ein gewalttätiger Mann lockt seinen Nächsten[a] und führt ihn auf einen Weg, der nicht gut ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinen Freund« oder »seinen Gefährten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »auf einem nicht guten Weg«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Mann
  rationale: Das grammatisch maskuline Singularwort bezeichnet hier eine beispielhafte männliche Person; »Mann« bewahrt diese Form.
- source_word: חָמָס
  choice: gewalttätig
  rationale: In der Verbindung אִישׁ חָמָס ist ein Mann gemeint, der von Gewalt oder Brutalität geprägt ist. Das Adjektiv ist im Deutschen natürlich und erhält die moralische Schärfe.
- source_word: יְפַתֶּה
  choice: lockt
  rationale: Der Piel von פתה kann zum Mitgehen verleiten, überreden oder täuschen bedeuten. »lockt« gibt die verführerische Einflussnahme wieder, ohne ausdrücklich Täuschung oder einen sexuellen Sinn festzulegen.
- source_word: רֵעֵהוּ
  choice: seinen Nächsten
  rationale: רֵעַ kann den Nächsten, Freund oder Gefährten bezeichnen. »seinen Nächsten« bewahrt den weiten zwischenmenschlichen Sinn; die Alternativen werden in einer Fußnote genannt.
- source_word: וְהוֹלִיכוֹ
  choice: und führt ihn
  rationale: 'Der Hifil von הלך hat kausative Bedeutung: jemanden gehen lassen beziehungsweise führen. »führt ihn« ist idiomatisch und erhält diese Kraft.'
- source_word: בְּדֶרֶךְ
  choice: auf einen Weg
  rationale: דֶּרֶךְ bezeichnet einen Weg oder übertragen einen Lebenswandel. Nach dem deutschen Richtungsverb »führt« ist »auf einen Weg« natürlich und bewahrt zugleich das Wegbild.
- source_word: לֹא טוֹב
  choice: der nicht gut ist
  rationale: Die hebräische Formulierung lautet bewusst »nicht gut«. Diese Wiedergabe verschärft sie nicht interpretierend zu »böse« oder »schlecht«.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchweisheitsstil. Das Wegbild und die zurückhaltende moralische Wertung »nicht gut« bleiben erhalten; die mögliche Bedeutungsbreite von רֵעַ wird nicht stillschweigend verengt.
