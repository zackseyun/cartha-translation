source:
  edition: WLC
  text: חֲמַת מֶ֥לֶךְ מַלְאֲכֵי מָ֑וֶת וְ/אִ֖ישׁ חָכָ֣ם יְכַפְּרֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/014.yaml
  text: The wrath of a king is messengers of death[b][a], but a wise man will appease it.
translation:
  language: de
  text: Der Zorn eines Königs ist Boten des Todes[a]; doch ein weiser Mann besänftigt ihn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Boten des Todes“. Das hebräische Wort für „Boten“ kann auch „Engel“ bedeuten; hier sind wahrscheinlich Beauftragte des Königs gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb stammt aus derselben Wortwurzel, die oft mit „Sühne schaffen“ wiedergegeben wird. Hier bedeutet es, den Zorn zu besänftigen oder abzuwenden.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: Zorn
  rationale: Das Substantiv bezeichnet heftigen, brennenden Zorn. „Zorn“ wahrt den gewichtigen Ton und passt zur tödlichen Gefahr im Parallelglied.
- source_word: מֶלֶךְ
  choice: König
  rationale: Die konkrete Bedeutung ist „König“. Sie bewahrt das Bild des königlichen Hofes und der Macht eines Monarchen.
- source_word: מַלְאֲכֵי מָוֶת
  choice: Boten des Todes
  rationale: מַלְאָךְ kann einen menschlichen Boten oder einen Engel bezeichnen. Im Zusammenhang königlicher Macht sind am ehesten Beauftragte gemeint, die ein Todesurteil vollstrecken. Die Nominalfügung und der Plural des Hebräischen bleiben erhalten.
- source_word: וְאִישׁ חָכָם
  choice: doch ein weiser Mann
  rationale: Das וְ wird wegen des inhaltlichen Gegensatzes adversativ mit „doch“ wiedergegeben. „Ein weiser Mann“ entspricht der maskulinen Einzahl und bezeichnet sprichwörtlich eine repräsentative Person.
- source_word: יְכַפְּרֶנָּה
  choice: besänftigt ihn
  rationale: Das Piel von כפר kann je nach Zusammenhang Sühne, Abwendung oder Beschwichtigung ausdrücken. Hier ist der Zorn des Königs das Objekt; daher gibt „besänftigt“ den nichtkultischen Sinn natürlich wieder. „Ihn“ bezieht sich im Deutschen auf den grammatisch maskulinen „Zorn“.
theological_decisions:
- issue: Ob כפר kultisch als „Sühne schaffen“ oder nichtkultisch als Beschwichtigung wiederzugeben ist
  choice: 'Nichtkultisch: „besänftigt ihn“'
  alternative: „schafft dafür Sühne“ / „wendet ihn ab“
  rationale: Der unmittelbare Kontext handelt von königlichem Zorn, nicht von Opfer oder Heiligtum. „Besänftigt“ bewahrt den Sinn der Abwendung von Zorn, ohne eine kultische Aussage in den Vers hineinzutragen; die Verbindung zur Sühneterminologie wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich erhält die zugespitzte hebräische Nominalkonstruktion, ohne den Plural „Boten“ einzuebnen oder ein im Ausgangstext nicht vorhandenes Verb einzufügen. Das Semikolon markiert die beiden parallel-kontrastierenden Vershälften.
