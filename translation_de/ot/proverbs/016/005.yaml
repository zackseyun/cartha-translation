  text: תּוֹעֲבַ֣ת יְ֭הוָה כָּל גְּבַהּ לֵ֑ב יָ֥ד לְ֝/יָ֗ד לֹ֣א יִנָּקֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/005.yaml
  text: Everyone who is proud in heart is an abomination to Yahweh; hand to hand[a], he will certainly not go unpunished.
translation:
  language: de
  text: Jeder, der hochmütigen Herzens ist, ist Jahwe ein Gräuel; Hand an Hand[a] wird er nicht ungestraft bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch »Hand zu Hand«. Die Wendung kann eine Bekräftigung bedeuten (»gewiss«, »darauf ist Verlass«), möglicherweise aber auch: »selbst wenn sie sich die Hände reichen«, also sich verbünden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: ein Gräuel
  rationale: Das Substantiv bezeichnet etwas, das moralisch und religiös zutiefst verabscheuungswürdig ist. „Ein Gräuel“ bewahrt diese starke Wertung und ist in würdigem modernem Deutsch verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כָּל גְּבַהּ לֵב
  choice: Jeder, der stolzen Herzens ist
  rationale: כָּל hat hier distributive Bedeutung; גְּבַהּ לֵב beschreibt wörtlich ein hohes Herz und idiomatisch eine innerlich stolze oder überhebliche Haltung.
- source_word: יָד לְיָד
  choice: Hand an Hand
  rationale: Die schwer deutbare hebräische Wendung bleibt im Haupttext sichtbar. „Hand an Hand“ bildet ihre Form natürlich im Deutschen ab, ohne sich zwischen Bekräftigung und Zusammenschluss zu entscheiden.
- source_word: לֹא יִנָּקֶה
  choice: bleibt er gewiss nicht unbestraft
  rationale: Das Nifal von נקה bezeichnet hier das Entgehen von Strafe beziehungsweise das Straflosbleiben. Die Formulierung gibt die klare Verneinung und den gerichtlichen Sinn wieder; „gewiss“ lässt die mögliche Bekräftigungsfunktion der vorangehenden Wendung anklingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Deutung von יָד לְיָד
  choice: Die Wendung im Haupttext als „Hand an Hand“ bewahren und ihre möglichen Bedeutungen in einer Fußnote nennen.
  alternative: Direkt mit „gewiss“ beziehungsweise „darauf ist Verlass“ übersetzen oder als „auch wenn sie sich verbünden“ verstehen.
  rationale: Die Wendung ist tatsächlich mehrdeutig. Eine transparente Wiedergabe vermeidet, die Bekräftigungs- oder Bündnisdeutung stillschweigend als allein richtig festzulegen.
translation_notes:
  register: Natürliches, würdiges Standarddeutsch. „Stolzen Herzens“ und „ein Gräuel“ sind leicht gehoben, bewahren aber die knappe Spruchform und die starke moralische Aussage des Hebräischen. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
