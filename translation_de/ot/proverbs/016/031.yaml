source:
  edition: WLC
  text: עֲטֶ֣רֶת תִּפְאֶ֣רֶת שֵׂיבָ֑ה בְּ/דֶ֥רֶךְ צְ֝דָקָ֗ה תִּמָּצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/031.yaml
  text: Gray hair is a crown of glory[b][a]; it is found in the way of righteousness.
translation:
  language: de
  text: Graues Haar ist eine Krone der Ehre[a]; auf dem Weg der Gerechtigkeit[b] findet es sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Graues Haar gilt hier als ehrenvoll, wenn es mit einem gerechten Leben verbunden ist. Der Spruch formuliert eine allgemeine Weisheitsregel, keine ausnahmslose Zusage, dass jeder gerechte Mensch ein hohes Alter erreicht.
    reason: cultural_note
  - marker: b
    text: 'Oder: „auf dem Pfad der Gerechtigkeit“. Das hebräische Bild bezeichnet einen Lebensweg, der von Gerechtigkeit geprägt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: Krone
  rationale: Das Substantiv bezeichnet eine Krone oder einen kranzartigen Schmuck. „Krone“ bewahrt das Bild eines sichtbaren Ehrenzeichens und ist im Deutschen natürlich.
- source_word: תִּפְאֶרֶת
  choice: Ehre
  rationale: Das Wort kann Herrlichkeit, Pracht, Schönheit oder Ehre bezeichnen. Im Zusammenhang mit grauem Haar gibt „Ehre“ den anerkennenden Sinn der Genitivverbindung natürlich wieder, ohne das Bild der Krone aufzulösen.
- source_word: שֵׂיבָה
  choice: graues Haar
  rationale: Der Ausdruck bezeichnet konkret graues Haar und kann darüber hinaus für das Alter stehen. Die konkrete Wiedergabe erhält das anschauliche Bild des Hebräischen.
- source_word: בְּדֶרֶךְ
  choice: auf dem Weg
  rationale: Die Verbindung bezeichnet wörtlich einen Weg und idiomatisch den Lebenswandel. „Auf dem Weg“ bewahrt die Metapher und ist in modernem Deutsch verständlich.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Hier bezeichnet das Wort einen moralisch rechten, aufrichtigen Lebenswandel. „Gerechtigkeit“ wahrt den zentralen hebräischen Begriff und lässt dessen ethische Weite bestehen.
- source_word: תִּמָּצֵא
  choice: wird es gefunden
  rationale: Die Nifal-Form von מצא bedeutet „wird gefunden“. Die formnahe Wiedergabe bewahrt die Offenheit, ob graues Haar auf diesem Lebensweg angetroffen wird oder ihm charakteristisch zugehört.
theological_decisions:
- issue: Aussagekraft des zweiten Versglieds
  choice: Der Spruch stellt graues Haar als ehrenvoll dar und verbindet es mit einem gerechten Lebensweg, ohne daraus eine ausnahmslose Garantie langen Lebens zu machen.
  alternative: Gerechtigkeit garantiere jedem Menschen ein langes Leben; oder jedes hohe Alter sei unabhängig vom Lebenswandel ehrenvoll.
  rationale: Weisheitssprüche formulieren gewöhnlich allgemeine Lebenswahrheiten, keine mechanischen Zusagen. Die wörtlich offene Formulierung „wird es gefunden“ erhält diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nahe am pointierten Parallelismus des Hebräischen; „Krone der Ehre“ und „Weg der Gerechtigkeit“ erhalten dessen Bilder, während die Fußnoten die idiomatische und sprichwörtliche Aussage erläutern.
