  text: לִ/פְנֵי שֶׁ֥בֶר גָּא֑וֹן וְ/לִ/פְנֵ֥י כִ֝שָּׁל֗וֹן גֹּ֣בַהּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/018.yaml
  text: Pride comes before destruction[a], and a haughty spirit before a fall.
translation:
  language: de
  text: Vor dem Verderben kommt Hochmut[a], und vor dem Sturz ein überheblicher Geist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Vor dem Verderben Hochmut und vor dem Straucheln Höhe des Geistes.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier zeitlich das, was einem Ereignis vorausgeht; „vor“ gibt dies knapp und idiomatisch wieder.
- source_word: שֶׁבֶר
  choice: Verderben
  rationale: Das Substantiv bezeichnet in diesem weisheitlichen Zusammenhang nicht einen wörtlichen Bruch, sondern Ruin beziehungsweise Untergang. „Verderben“ wahrt den gewichtigen, allgemeinen Sinn.
- source_word: גָּאוֹן
  choice: Hochmut
  rationale: Obwohl das Wort andernorts Hoheit oder Erhabenheit bezeichnen kann, verlangt die Parallelität mit dem folgenden Unheil hier die negative Bedeutung „Hochmut“.
- source_word: וְלִפְנֵי
  choice: und vor
  rationale: Die Wiederholung von „vor“ erhält die ausgewogene Parallelstruktur des hebräischen Spruchs.
- source_word: כִּשָּׁלוֹן
  choice: Sturz
  rationale: Das Wort bezeichnet ein Straucheln oder Zu-Fall-Kommen. „Sturz“ ist im Deutschen prägnant und lässt sowohl den bildlichen als auch den übertragenen Sinn erkennen.
- source_word: גֹּבַהּ רוּחַ
  choice: ein überheblicher Geist
  rationale: Die Wendung bedeutet wörtlich „Höhe des Geistes“. „Ein überheblicher Geist“ vermittelt die gemeinte innere Selbstüberhöhung und bewahrt zugleich den Ausdruck „Geist“.
theological_decisions:
- issue: Moralische Wertung von גָּאוֹן und גֹּבַהּ רוּחַ
  choice: Beide Ausdrücke werden negativ als „Hochmut“ und „überheblicher Geist“ wiedergegeben.
  alternative: „Hoheit“ beziehungsweise „Höhe des Geistes“
  rationale: Der synonyme Parallelismus verbindet beide Haltungen mit Verderben und Sturz und legt deshalb in diesem Kontext eindeutig die negative ethische Bedeutung nahe, ohne darüber hinaus eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ergänzte Verb „kommt“ macht den im Hebräischen verblosen Satz natürlich verständlich. Die parallele Satzform und das anthropologische Wort „Geist“ bleiben erhalten.
