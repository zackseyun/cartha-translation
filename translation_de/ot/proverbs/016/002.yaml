base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/002.yaml
  text: All a man's ways are pure in his own eyes[b][a], but Yahweh weighs the spirits.
translation:
  language: de
  text: Alle Wege eines Mannes sind rein in seinen eigenen Augen[a], doch Jahwe wägt die Geister[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle Wege eines Mannes sind lauter in seinen Augen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „doch Jahwe prüft die Geister“; sinngemäß: „doch Jahwe beurteilt die inneren Haltungen“ oder „die Beweggründe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Alle
  rationale: Der Quantor bezieht sich auf die Gesamtheit der im Plural genannten Wege.
- source_word: דַּרְכֵי אִישׁ
  choice: Wege eines Mannes
  rationale: דֶּרֶךְ bezeichnet in der Weisheitsliteratur häufig Lebensführung und Handlungsweise. אִישׁ ist ein generisch gebrauchter maskuliner Singular; die Formulierung bewahrt diese Ausdrucksweise, ohne die allgemeine Geltung des Spruchs einzuschränken.
- source_word: זַךְ
  choice: rein
  rationale: Das Adjektiv bezeichnet Reinheit oder Lauterkeit und beschreibt hier die moralische Selbsteinschätzung.
- source_word: בְּעֵינָיו
  choice: in seinen eigenen Augen
  rationale: Die hebräische Wendung bezeichnet die Beurteilung aus der eigenen Perspektive; „eigenen“ macht den reflexiven Sinn im Deutschen deutlich.
- source_word: וְתֹכֵן
  choice: doch … wägt
  rationale: תכן kann messen oder wägen bedeuten. „Wägt“ erhält das Bild einer genauen göttlichen Beurteilung; „doch“ gibt den Gegensatz der beiden Vershälften natürlich wieder.
- source_word: רוּחוֹת
  choice: die Geister
  rationale: Der Plural bezeichnet hier am ehesten das Innere beziehungsweise die inneren Haltungen der Menschen. Die formnahe Wiedergabe bewahrt die Breite und Bildhaftigkeit des hebräischen Ausdrucks.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Anthropologische Bedeutung von רוּחוֹת
  choice: die inneren Geister beziehungsweise Haltungen der Menschen, die Jahwe beurteilt
  alternative: Beweggründe; innere Haltungen; Atemzüge oder Winde
  rationale: Im Gegensatz zwischen menschlicher Selbstbeurteilung und göttlicher Prüfung bezieht sich רוּחוֹת am wahrscheinlichsten auf das menschliche Innere. „Beweggründe“ wäre verständlicher, aber enger und stärker deutend.
- issue: Generischer maskuliner Singular אִישׁ
  choice: eines Mannes
  alternative: eines Menschen; menschliche Wege
  rationale: Die Übersetzung bildet den grammatisch maskulinen Singular des Hebräischen ab; der Spruch bleibt seinem Sinn nach allgemein auf Menschen bezogen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe antithetische Form des Spruchs und das Bild des Wägens bleiben erhalten. „Geister“ ist bewusst formnah; die Fußnote erschließt den wahrscheinlichen anthropologischen Sinn, ohne ihn im Haupttext einzuengen.
