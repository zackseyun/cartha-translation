  text: Besser wenig mit Gerechtigkeit als großer Ertrag ohne Recht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב מְעַט
  choice: Besser wenig
  rationale: Gibt die knappe hebräische Vergleichsformel natürlich und prägnant wieder.
- source_word: בִּצְדָקָה
  choice: mit Gerechtigkeit
  rationale: Bewahrt den weiten ethisch-rechtlichen Sinn von צְדָקָה, ohne ihn auf persönliche Frömmigkeit oder bloße Ehrlichkeit einzuengen.
- source_word: מֵרֹב תְּבוּאוֹת
  choice: als großer Ertrag
  rationale: תְּבוּאוֹת bezeichnet Erträge beziehungsweise Einkünfte; der deutsche Singular als Sammelbegriff ist idiomatisch und erhält den wirtschaftlichen Bezug.
- source_word: בְּלֹא מִשְׁפָּט
  choice: ohne Recht
  rationale: מִשְׁפָּט umfasst Recht, gerechtes Urteil und rechtmäßiges Handeln. „Ohne Recht“ wahrt die prägnante Gegenüberstellung zu „Gerechtigkeit“.
theological_decisions:
- issue: Verhältnis von צְדָקָה und מִשְׁפָּט
  choice: Gerechtigkeit / Recht
  alternative: Rechtschaffenheit / Gerechtigkeit
  rationale: 'Die gewählte Wortpaarung erhält die begriffliche Nähe und zugleich die unterschiedliche Akzentsetzung: gerechtes Verhalten einerseits, rechtmäßige Ordnung beziehungsweise Praxis andererseits, ohne eine konfessionelle Deutung einzutragen.'
translation_notes:
  register: Knappe, sprichwortartige Satzform in modernem, würdigem Standarddeutsch. Die fehlende Kopula des Hebräischen wird im Deutschen ebenso knapp wiedergegeben.
