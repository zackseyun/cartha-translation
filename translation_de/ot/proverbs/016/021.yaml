source:
  edition: WLC
  text: לַ/חֲכַם לֵ֭ב יִקָּרֵ֣א נָב֑וֹן וּ/מֶ֥תֶק שְׂ֝פָתַ֗יִם יֹסִ֥יף לֶֽקַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/021.yaml
  text: The wise of heart is called discerning[a], and sweetness of lips increases learning.
translation:
  language: de
  text: Wer ein weises Herz hat, gilt als verständig, und angenehme Worte fördern die Unterweisung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: erhöhen die Überzeugungskraft. Das hebräische Wort kann empfangene Belehrung, Unterweisung oder die Wirkung überzeugender Lehre bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲכַם לֵב
  choice: Wer ein weises Herz hat
  rationale: Die Formulierung gibt die hebräische Verbindung von Weisheit und Herz bildhaft wieder, klingt im heutigen Deutschen aber natürlicher als „der Weise an Herz“.
- source_word: יִקָּרֵא
  choice: gilt als
  rationale: Das Nifal von קרא bezeichnet hier, wie jemand genannt beziehungsweise angesehen wird. „Gilt als“ passt zum allgemeinen Charakter eines Sprichworts.
- source_word: נָבוֹן
  choice: verständig
  rationale: נבון bezeichnet einen Menschen mit Einsicht und Urteilsvermögen. „Verständig“ bewahrt diesen Sinn prägnant.
- source_word: וּמֶתֶק שְׂפָתַיִם
  choice: und angenehme Worte
  rationale: Wörtlich steht „Süße der Lippen“. Da „Lippen“ metonymisch für das Reden stehen, vermittelt „angenehme Worte“ die poetische Aussage in natürlichem modernem Deutsch.
- source_word: יֹסִיף
  choice: fördern
  rationale: Das Hifil von יסף bedeutet „hinzufügen, vermehren“. Im Zusammenhang mit Unterweisung gibt „fördern“ die bewirkte Zunahme idiomatisch wieder.
- source_word: לֶקַח
  choice: die Unterweisung
  rationale: לקח kann empfangene Lehre, Unterweisung oder die Wirkung überzeugender Rede bezeichnen. „Unterweisung“ hält den Weisheits- und Lehrkontext offen, ohne den Ausdruck auf bloßen Wissenszuwachs zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem Sprichwortcharakter. Die hebräische Herzmetapher bleibt erhalten; die wörtliche „Süße der Lippen“ wird idiomatisch als „angenehme Worte“ wiedergegeben.
