revisions:
- from: Besser ist, wer nur langsam zornig wird,[a] als ein Krieger, und wer seinen Geist beherrscht,[b] als einer, der eine Stadt erobert.
  to: Besser ist, wer langsam zum Zorn ist,[a] als ein Starker, und wer seinen Geist beherrscht,[b] als einer, der eine Stadt erobert.
  rationale: Die Revision entfernt die nicht im Hebräischen enthaltene Einschränkung »nur«, gibt das Idiom אֶרֶךְ אַפַּיִם mit der im Deutschen geläufigen Wendung »langsam zum Zorn« wieder und vermeidet mit »ein Starker« eine unnötige Festlegung von גִּבּוֹר auf die Rolle eines Kriegers. Die Wiedergabe von רוּחוֹ als »seinen Geist« und die Fußnotenanker bleiben erhalten.
