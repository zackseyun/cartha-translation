  text: ט֤וֹב אֶ֣רֶךְ אַ֭פַּיִם מִ/גִּבּ֑וֹר וּ/מֹשֵׁ֥ל בְּ֝/רוּח֗/וֹ מִ/לֹּכֵ֥ד עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/032.yaml
  text: Better is one who is slow to anger than a mighty man[b][a], and one who rules his spirit than one who captures a city.
translation:
  language: de
  text: Besser ist, wer langsam zum Zorn ist,[a] als ein Starker, und wer seinen Geist beherrscht,[b] als einer, der eine Stadt erobert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »lang an den Nasenlöchern«; ein hebräisches Idiom für »langsam zum Zorn« oder »geduldig«.
    reason: lexical_alternative
  - marker: b
    text: Oder »sein Temperament« oder sinngemäß »sich selbst«.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Besser ist
  rationale: Das Adjektiv leitet hier die für Weisheitssprüche typische Vergleichsform ein; die beiden מִן-Konstruktionen liefern jeweils den Vergleichspunkt.
- source_word: אֶרֶךְ אַפַּיִם
  choice: wer nur langsam zornig wird
  rationale: Die wörtliche Wendung »lang an den Nasenlöchern« ist ein hebräisches Idiom für Langmut beziehungsweise dafür, nicht schnell in Zorn zu geraten. Die gewählte Formulierung gibt den Sinn klar und gegenwartsnah wieder.
- source_word: מִגִּבּוֹר
  choice: als ein Krieger
  rationale: גִּבּוֹר bezeichnet einen starken oder tapferen Mann und hat häufig militärischen Klang. Im Zusammenhang mit der Eroberung einer Stadt bringt »Krieger« diesen Vergleich prägnant zur Geltung.
- source_word: וּמֹשֵׁל
  choice: und wer … beherrscht
  rationale: Das Partizip beschreibt eine beständige Fähigkeit oder Eigenschaft. »Beherrscht« ist im Deutschen bei der Lenkung der eigenen inneren Regungen natürlich und bewahrt zugleich den Gedanken des Herrschens.
- source_word: בְּרוּחוֹ
  choice: seinen Geist
  rationale: רוּחַ kann Geist, Atem, Wind oder innere Haltung und Regung bezeichnen. »Seinen Geist« bleibt nahe am Hebräischen und lässt die genaue anthropologische Bedeutung bewusst offen.
- source_word: מִלֹּכֵד עִיר
  choice: als einer, der eine Stadt erobert
  rationale: לכד bezeichnet das Einnehmen oder Erobern, besonders im militärischen Zusammenhang. Die Formulierung bewahrt das anschauliche Gegenbild zwischen innerer Selbstbeherrschung und äußerem Sieg.
theological_decisions:
- issue: Anthropologische Bedeutung von רוּחַ im Weisheitskontext
  choice: »seinen Geist« als Bezeichnung der inneren Haltung, Regungen oder Antriebskraft eines Menschen
  alternative: »sich selbst« als umfassendere Paraphrase oder »sein Temperament« als engere Deutung
  rationale: Der Spruch stellt die Herrschaft über das Innere der militärischen Eroberung gegenüber. »Geist« bewahrt die Bedeutungsbreite des hebräischen Ausdrucks, ohne ihn nur auf Zorn oder Temperament einzuengen.
translation_notes:
  register: Moderner, würdevoller Spruchstil mit klarer Parallelstruktur. »Nur langsam zornig wird« ist allgemein verständlich; »seinen Geist beherrscht« wahrt die Bild- und Bedeutungsbreite des Ausgangstextes. Die maskulinen Einzelformen folgen der grammatischen Gestalt des hebräischen Spruchs und sind als allgemeine Personenbezeichnungen zu verstehen.
