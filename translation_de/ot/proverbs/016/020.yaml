base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/020.yaml
  text: Whoever gives careful attention to a matter will find good[b][a], and blessed is he who trusts in Yahweh.
translation:
  language: de
  text: Wer eine Sache mit Einsicht bedenkt[a], wird Gutes finden; und glücklich ist, wer auf Jahwe vertraut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer in einer Sache klug handelt, wird Gutes finden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל עַל־דָּבָר
  choice: eine Sache mit Einsicht bedenkt
  rationale: Das Hifil-Partizip von שׂכל kann einsichtiges, umsichtiges Handeln oder verständiges Beachten bezeichnen. Mit עַל־דָּבָר gibt die Formulierung eine aktive, kluge Beschäftigung mit einer Sache wieder, ohne die mögliche Handlungsnuance völlig auszuschließen.
- source_word: יִמְצָא טוֹב
  choice: wird Gutes finden
  rationale: מצא bedeutet gewöhnlich „finden“; טוֹב bleibt bewusst weit und kann Gutes, Wohlergehen oder Nutzen umfassen, ohne auf materiellen Erfolg verengt zu werden.
- source_word: וּבוֹטֵחַ בַּיהוָה
  choice: und … wer auf Jahwe vertraut
  rationale: Das Partizip בּוֹטֵחַ ist allgemein gebraucht. Im Deutschen ist „auf jemanden vertrauen“ idiomatisch. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אַשְׁרָיו
  choice: glücklich ist, wer
  rationale: אַשְׁרֵי bezeichnet den begünstigten, glücklichen beziehungsweise gesegneten Zustand eines Menschen. Die inklusive Relativkonstruktion gibt den generischen maskulinen Singular natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אַשְׁרָיו
  choice: glücklich ist, wer
  alternative: gesegnet ist, wer
  rationale: Die Form bezeichnet hier einen Zustand des Wohlergehens unter Gottes Gunst, ohne ausdrücklich ein Segenshandeln zu formulieren. „Glücklich“ wahrt den weisheitlichen Makarismus und meint mehr als ein bloßes Gefühl.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper sprichwörtlicher Parallelstruktur. „Sache“ bewahrt die Bedeutungsbreite von דָּבָר; „Gutes“ lässt Art und Umfang des verheißenen Wohlergehens offen.
