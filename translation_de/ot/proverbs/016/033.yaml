base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/033.yaml
  text: The lot is cast into the lap[a], but its every decision is from Yahweh.
translation:
  language: de
  text: In den Schoß wird das Los geworfen, doch jede Entscheidung darüber[a] kommt von Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Urteil“ beziehungsweise „Rechtsspruch“. Das hebräische Wort kann einen rechtlichen Beiklang haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֵיק
  choice: in den Schoß
  rationale: חֵיק bezeichnet den Schoß, den Brustbereich oder den Bausch eines Gewandes. „In den Schoß“ bewahrt das konkrete Bild des Ortes, an den das Los geworfen wurde, und ist im Deutschen verständlich.
- source_word: יוּטַל
  choice: wird … geworfen
  rationale: Die passive Hophal-Form bezeichnet, dass das Los geworfen wird. Die deutsche Passivkonstruktion bildet Form und Vorgang knapp ab.
- source_word: הַגּוֹרָל
  choice: das Los
  rationale: גּוֹרָל bezeichnet ein Los, das zur Zuteilung oder Entscheidungsfindung verwendet wird. „Das Los“ ist die direkte und sachlich offene Entsprechung.
- source_word: וּמֵיְהוָה
  choice: doch … kommt von Jahwe
  rationale: 'Das ו verbindet die Satzhälften und trägt hier im Zusammenhang einen kontrastierenden Sinn: Menschen werfen das Los, doch dessen Entscheidung hat ihren Ursprung bei Jahwe. „Kommt von“ gibt die Präposition מִן natürlich wieder.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כָּל
  choice: jede
  rationale: כָּל vor einem singularischen Substantiv hat hier distributiven Sinn und bezieht jede einzelne durch das Los herbeigeführte Entscheidung ein.
- source_word: מִשְׁפָּטוֹ
  choice: seiner Entscheidungen
  rationale: מִשְׁפָּט kann Entscheidung, Urteil oder Rechtsspruch bedeuten. Im Zusammenhang bezeichnet es die durch das Los zustande kommende Entscheidung; der pronominale Suffix wird mit „seiner“ bewahrt.
theological_decisions:
- issue: Göttliche Souveränität im Verhältnis zu einem scheinbar zufälligen Vorgang
  choice: Der menschliche Vorgang des Loswerfens wird der Aussage gegenübergestellt, dass jede Entscheidung des Loses von Jahwe kommt.
  alternative: Der Vers könnte ausschließlich auf heilige Losverfahren bezogen oder als allgemeine Aussage über Gottes Vorsehung bei allen Zufallsereignissen ausgelegt werden.
  rationale: Der hebräische Wortlaut nennt ausdrücklich das Werfen des Loses und Jahwe als Ursprung seines מִשְׁפָּט. Die Übersetzung erhält diese Spannung, ohne den Geltungsbereich über die Aussage des Spruchs hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellte Ortsangabe bewahrt die knappe, pointierte Parallelstruktur des hebräischen Spruchs; „Schoß“ erhält dessen konkretes antikes Bild.
