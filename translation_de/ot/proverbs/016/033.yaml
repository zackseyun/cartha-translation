  naturalness: „In den Schoß wird das Los geworfen“ ist idiomatisch und angemessen knapp. „Doch jede Entscheidung darüber“ ist im modernen Standarddeutsch klarer und bewahrt den Bezug auf das geworfene Los, ohne einen künstlichen Plural zu erzeugen.
