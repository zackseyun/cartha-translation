source:
  edition: WLC
  text: נֶ֣פֶשׁ עָ֭מֵל עָ֣מְלָה לּ֑/וֹ כִּֽי אָכַ֖ף עָלָ֣י/ו פִּֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/026.yaml
  text: The appetite of a laborer labors for him[c][b][a], for his mouth presses him on.
translation:
  language: de
  text: Der Hunger des Arbeiters arbeitet für ihn[a][b], denn sein Mund treibt ihn an[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Seele / das Verlangen des Arbeiters«. Das hebräische Wort kann »Seele«, »Leben«, »Verlangen« oder »Hunger« bedeuten; der Hinweis auf seinen Mund spricht hier für »Hunger«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »für sich selbst«. Wörtlich steht im Hebräischen »für ihn«; die Aussage kann jedoch reflexiv verstanden werden.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »setzt ihn unter Druck«, »drängt ihn« oder »zwingt ihn«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: Hunger
  rationale: נֶפֶשׁ kann »Seele«, »Leben«, »Verlangen« oder den körperlichen Appetit bezeichnen. Der Bezug auf »seinen Mund« legt hier »Hunger« nahe; dieses Wort ist im Deutschen natürlicher als »Appetit« und macht den Antrieb zur Arbeit deutlich.
- source_word: עָמֵל
  choice: Arbeiter
  rationale: Das Wort bezeichnet einen Menschen, der arbeitet oder sich abmüht. »Arbeiter« ist knapp und bewahrt zusammen mit »arbeitet« die Wiederholung desselben hebräischen Wortstamms.
- source_word: עָמְלָה
  choice: arbeitet
  rationale: Die Wiedergabe mit »arbeitet« erhält das Wortspiel mit »Arbeiter«. Die feminine Verbform stimmt mit נֶפֶשׁ überein, das hier als »Hunger« wiedergegeben wird.
- source_word: לּוֹ
  choice: für ihn
  rationale: Die Form bedeutet unmittelbar »für ihn«. Eine reflexive Deutung als »für sich selbst« ist möglich, wird aber nicht stillschweigend in den Haupttext aufgenommen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung ein. »Denn« ist in einem deutschen Spruch knapp und idiomatisch.
- source_word: אָכַף
  choice: treibt … an
  rationale: Das Verb bezeichnet Druck oder Zwang. »Treibt … an« vermittelt verständlich, dass das körperliche Bedürfnis den Arbeiter zur Arbeit drängt.
- source_word: עָלָיו
  choice: ihn
  rationale: Die Präposition wird in der idiomatischen deutschen Verbindung »ihn antreiben« aufgenommen, statt wörtlich mit »auf/gegen ihn« wiedergegeben zu werden.
- source_word: פִּיהוּ
  choice: sein Mund
  rationale: Der hebräische Text nennt wörtlich »seinen Mund« und personifiziert ihn als antreibende Kraft. Dieses konkrete Bild bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit sprichwörtlich knapper Satzstruktur. Die Wiederholung »Arbeiter arbeitet« ist bewusst beibehalten, weil sie das hebräische Wortspiel zwischen עָמֵל und עָמְלָה abbildet. »Mund« bleibt als konkrete Personifikation stehen; die Mehrdeutigkeit von נֶפֶשׁ und לּוֹ wird in den Fußnoten offengehalten.
