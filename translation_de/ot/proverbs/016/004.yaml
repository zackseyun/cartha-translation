id: PRO.16.4
reference: Proverbs 16:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֤ל פָּעַ֣ל יְ֭הוָה לַֽ/מַּעֲנֵ֑/הוּ וְ/גַם רָ֝שָׁ֗ע לְ/י֣וֹם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/004.yaml
  text: Yahweh has made everything for its purpose[b][a], even the wicked for the day of disaster.
translation:
  language: de
  text: Alles hat Jahwe zu seinem Zweck gemacht[a], sogar den Gottlosen für den Tag des Unheils[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für sich selbst« beziehungsweise »für seinen Zweck«. Die hebräische Wendung ist mehrdeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »für den Tag der Katastrophe«. Mit »Unheil« ist hier Verderben oder Gericht gemeint, nicht moralische Bosheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Alles
  rationale: Das substantivisch gebrauchte כֹּל bezeichnet umfassend »alles« und lässt sich im modernen Deutschen knapp und natürlich so wiedergeben.
- source_word: פָּעַל
  choice: hat geschaffen
  rationale: פָּעַל kann »tun, wirken, machen« bedeuten. Mit Jahwe als Subjekt und »alles« als Objekt bringt »geschaffen« sein zielgerichtetes Hervorbringen natürlich zum Ausdruck, ohne die Aussage auf den ursprünglichen Schöpfungsakt zu beschränken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לַמַּעֲנֵהוּ
  choice: zu seinem Zweck
  rationale: Die schwierige Wendung bezeichnet hier wahrscheinlich den zugehörigen Zweck oder das entsprechende Ziel. Das maskuline Suffix kann sich auf das kollektiv aufgefasste כֹּל beziehen; »seinem« bewahrt diese grammatische Mehrdeutigkeit im Deutschen besser als eine ausdrückliche Festlegung auf Gottes eigenen Zweck.
- source_word: וְגַם
  choice: sogar
  rationale: Die Verbindung erweitert die umfassende Aussage nachdrücklich auf den überraschenden Sonderfall des Gottlosen.
- source_word: רָשָׁע
  choice: den Gottlosen
  rationale: Das substantivierte Adjektiv steht im generischen Singular und bezeichnet einen gottlosen beziehungsweise schuldigen Menschen als Typus.
- source_word: לְיוֹם רָעָה
  choice: für den Tag des Unheils
  rationale: רָעָה bezeichnet hier Unheil, Not oder Verderben, nicht moralische Bosheit. »Tag des Unheils« bewahrt die traditionelle Bildsprache und kann einen Gerichtstag bezeichnen, ohne dies ausdrücklich festzulegen.
theological_decisions:
- issue: Bezeichnet לַמַּעֲנֵהוּ den eigenen Zweck jedes Geschaffenen oder Gottes Zweck beziehungsweise Gott selbst?
  choice: »zu seinem Zweck« lässt den Bezug des Suffixes im Haupttext bewusst offen.
  alternative: »für sich selbst« oder »für seinen Zweck« mit eindeutigem Bezug auf Jahwe
  rationale: Das Hebräische ist in dieser schwierigen Wendung mehrdeutig. Eine eindeutige Festlegung würde die Aussage stärker systematisieren, als der Wortlaut verlangt.
- issue: Behauptet der Vers, Gott habe moralische Bosheit geschaffen?
  choice: Der Gottlose wird auf den Tag des Unheils bezogen; רָעָה wird als »Unheil« verstanden.
  alternative: »für einen Tag des Bösen«
  rationale: Im Ausdruck »Tag des/der רָעָה« bezeichnet das Wort natürlich eine Katastrophe oder ein Gericht. So bleibt die starke Aussage über Gottes souveräne Zweckordnung bestehen, ohne רָעָה fälschlich als moralisches Böses zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Parallelismus des hebräischen Spruchs bleibt erhalten. »Jahwe« gibt den Gottesnamen wieder; »Gottloser« ist im Weisheitskontext verständlich und prägnant.
