id: PRO.16.22
reference: Proverbs 16:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מְק֣וֹר חַ֭יִּים שֵׂ֣כֶל בְּעָלָ֑י/ו וּ/מוּסַ֖ר אֱוִלִ֣ים אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/022.yaml
  text: Understanding is a fountain of life to its possessor[b][a], but the discipline of fools is folly.
translation:
  language: de
  text: Einsicht ist eine Quelle des Lebens für den, der sie besitzt; doch die Zurechtweisung der Toren ist Torheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Zurechtweisung« kann auch mit »Unterweisung«, »Erziehung« oder »Zucht« wiedergegeben werden. Die hebräische Formulierung lässt offen, ob die Toren diese Zurechtweisung empfangen oder selbst erteilen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹר
  choice: Quelle
  rationale: Das Substantiv bezeichnet eine Quelle oder einen Ursprung. »Quelle« bewahrt das konkrete Bild lebensspendenden Wassers und klingt im Deutschen natürlich.
- source_word: חַיִּים
  choice: Leben
  rationale: Die morphologische Pluralform wird im Hebräischen gewöhnlich als abstrakte Bezeichnung für »Leben« gebraucht.
- source_word: שֵׂכֶל
  choice: Einsicht
  rationale: Das Wort bezeichnet in den Sprüchen praktische Klugheit, verständiges Urteilsvermögen oder Einsicht. »Einsicht« ist klar und bildet einen treffenden Gegensatz zur Torheit.
- source_word: בְּעָלָיו
  choice: für den, der sie besitzt
  rationale: Wörtlich steht »für ihren Besitzer«. Die gewählte Formulierung gibt den Singularbezug präzise und in natürlichem modernem Deutsch wieder.
- source_word: מוּסַר
  choice: Zurechtweisung
  rationale: Das Wort umfasst Unterweisung, Erziehung, Zucht und korrigierende Maßregelung. »Zurechtweisung« bringt hier den korrigierenden Sinn zum Ausdruck, ohne die genaue Beziehung zu den Toren festzulegen.
- source_word: אֱוִלִים
  choice: Toren
  rationale: Die traditionelle, im Weisheitskontext weiterhin verständliche Bezeichnung meint moralisch und geistlich uneinsichtige Menschen, nicht bloß Personen mit geringer Intelligenz.
- source_word: אִוֶּלֶת
  choice: Torheit
  rationale: Das Abstraktum bezeichnet die für Toren charakteristische Uneinsichtigkeit. »Torheit« sorgt zudem für einen prägnanten sprichwörtlichen Schluss.
theological_decisions:
- issue: Beziehung zwischen מוּסַר und »den Toren«
  choice: Die mehrdeutige Genitivverbindung wird als »die Zurechtweisung der Toren« bewahrt.
  alternative: »Die Zurechtweisung, die Toren erhalten, ist Torheit« oder »was Toren als Unterweisung weitergeben, ist Torheit«
  rationale: Der hebräische Wortlaut legt nicht eindeutig fest, ob es um Zurechtweisung geht, die Toren empfangen, die von ihnen ausgeht oder die ihnen eigentümlich ist. Die Übersetzung soll diese Spannung nicht vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Form. »Toren« und »Torheit« bewahren die feste Begrifflichkeit der Weisheitsliteratur; die übrige Syntax ist bewusst gegenwärtig und leicht verständlich.
