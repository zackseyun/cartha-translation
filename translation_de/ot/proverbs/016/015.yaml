  text: בְּ/אוֹר פְּנֵי מֶ֥לֶךְ חַיִּ֑ים וּ֝/רְצוֹנ֗/וֹ כְּ/עָ֣ב מַלְקֽוֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/015.yaml
  text: In the light of a king’s face there is life[b][a], and his favor is like a cloud of spring rain.
translation:
  language: de
  text: Im Licht des Angesichts eines Königs ist Leben,[a] und seine Gunst ist wie eine Wolke mit Spätregen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist: Die freundliche Miene und das Wohlwollen des Königs schenken Leben und Segen.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: »wie eine Wolke des Spätregens«. Der Spätregen war der für die Reifung der Ernte wichtige Regen gegen Ende der Regenzeit, gewöhnlich im Frühjahr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אוֹר
  choice: Im Licht
  rationale: Bewahrt das konkrete hebräische Bild und gibt die Präposition ב idiomatisch und natürlich wieder.
- source_word: פְּנֵי
  choice: des Angesichts
  rationale: Gibt das wörtliche Bild des »Gesichts« würdevoll wieder und lässt zugleich die gemeinte wohlwollende Miene erkennen, ohne sie in den Haupttext einzutragen.
- source_word: מֶלֶךְ
  choice: eines Königs
  rationale: Direkte und im Deutschen natürliche Wiedergabe des unbestimmten hebräischen Ausdrucks.
- source_word: חַיִּים
  choice: ist Leben
  rationale: Die verblos formulierte hebräische Aussage wird knapp nachgebildet; der idiomatische Plural bezeichnet Leben bzw. Lebenskraft.
- source_word: וּ/רְצוֹנ/וֹ
  choice: und seine Gunst
  rationale: רָצוֹן bezeichnet hier das Wohlwollen und die Zustimmung des Königs; »Gunst« passt zum königlichen Kontext.
- source_word: כְּ/עָב
  choice: ist wie eine Wolke
  rationale: Gibt den Vergleich mit כ und das konkrete Bild von עָב natürlich wieder.
- source_word: מַלְקוֹשׁ
  choice: die Frühlingsregen bringt
  rationale: מַלְקוֹשׁ ist der für die Reifung der Ernte wichtige späte Saisonregen. Die verbale Formulierung macht die Beziehung zwischen Wolke und Regen im Deutschen klar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete Bild vom Licht des königlichen Angesichts bleibt erhalten; »Frühlingsregen« erschließt die landwirtschaftliche Bedeutung, während die formale Alternative in der Fußnote dokumentiert wird.
