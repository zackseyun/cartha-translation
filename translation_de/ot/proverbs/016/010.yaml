source:
  edition: WLC
  text: קֶ֤סֶם עַֽל שִׂפְתֵי מֶ֑לֶךְ בְּ֝/מִשְׁפָּ֗ט לֹ֣א יִמְעַל פִּֽי/ו׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/010.yaml
  text: A divine verdict is on the lips of a king[b][a]; his mouth does not betray justice.
translation:
  language: de
  text: Ein Orakelspruch liegt auf den Lippen eines Königs[a]; sein Mund spricht beim Rechtsprechen nicht treulos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort kann auch „Wahrsagung“ bedeuten; hier ist wegen des Zusammenhangs mit königlicher Rechtsprechung „Orakelspruch“ gewählt. Möglich ist auch: „ein göttlicher Rechtsspruch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei der Urteilsfindung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶסֶם
  choice: Orakelspruch
  rationale: Das Substantiv bezeichnet häufig Wahrsagung oder einen Orakelspruch. Hier steht es im Zusammenhang königlicher Rechtsprechung; „Orakelspruch“ bewahrt den besonderen, autoritativen Klang, ohne ausdrücklich eine göttliche Herkunft festzulegen.
- source_word: עַל שִׂפְתֵי מֶלֶךְ
  choice: liegt auf den Lippen eines Königs
  rationale: Die nominale Ortsangabe wird als natürlicher deutscher Satz wiedergegeben. Der unbestimmte Ausdruck „eines Königs“ erhält den allgemeinen Charakter des Spruchs.
- source_word: בְּמִשְׁפָּט
  choice: beim Rechtsprechen
  rationale: Die Präposition bezeichnet hier plausibel den Bereich oder Vorgang gerichtlicher Entscheidung. Die Formulierung macht den juristischen Zusammenhang im Deutschen deutlich.
- source_word: לֹא יִמְעַל
  choice: handelt … nicht treulos
  rationale: מעל bezeichnet treuloses, pflichtwidriges oder verräterisches Handeln. „Nicht treulos handeln“ erhält diese ethische Schärfe und vermeidet eine zu enge Festlegung auf bloßes Irren.
- source_word: פִּיו
  choice: sein Mund
  rationale: Die konkrete Körpermetapher bleibt erhalten und bildet wie im Hebräischen eine leichte Variation zu „Lippen“ im ersten Halbvers.
theological_decisions:
- issue: Ob קֶסֶם negativ als Wahrsagung oder kontextbezogen als autoritativer Orakelspruch zu verstehen ist
  choice: Orakelspruch
  alternative: Wahrsagung; göttlicher Rechtsspruch
  rationale: Der Parallelismus mit der Rechtsprechung legt hier eine positiv oder zumindest neutral dargestellte königliche Aussage nahe. „Orakelspruch“ bewahrt zugleich die ungewöhnliche, auch andernorts mit Wahrsagung verbundene Wortwahl. „Göttlicher Rechtsspruch“ würde die Herkunft des Spruchs stärker bestimmen, als der hebräische Ausdruck allein es verlangt.
- issue: Ob die Aussage tatsächliches oder ideales königliches Verhalten beschreibt
  choice: Die knappe indikativische Form bleibt ohne erklärenden Zusatz stehen.
  alternative: Eine ausdrücklich normative Wiedergabe wie „soll nicht treulos handeln“
  rationale: Das Hebräische formuliert mit לֹא und Imperfekt, ohne die Spannung zwischen allgemeiner Feststellung, Erwartung und Norm ausdrücklich aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Bildsprache von Lippen und Mund sowie die spannungsreiche Orakelterminologie des Hebräischen bleiben erhalten.
