  text: יֵ֤שׁ דֶּ֣רֶךְ יָ֭שָׁר לִ/פְנֵי אִ֑ישׁ וְ֝/אַחֲרִיתָ֗/הּ דַּרְכֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/025.yaml
  text: There is a way that seems right before a man, but its end is the ways of death.
translation:
  language: de
  text: Es gibt einen Weg, der einem Menschen richtig erscheint, dessen Ende aber Wege des Todes sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשׁ דֶּרֶךְ
  choice: Es gibt einen Weg
  rationale: Gibt die hebräische Existenzkonstruktion knapp und unmittelbar wieder.
- source_word: יָשָׁר לִפְנֵי אִישׁ
  choice: der einem Menschen gerade erscheint
  rationale: „Gerade“ bewahrt das Bild von יָשָׁר; „erscheint“ vermittelt idiomatisch, dass der Weg aus der Sicht des Menschen als richtig beziehungsweise untadelig gilt. Das unbestimmte אִישׁ wird allgemein mit „einem Menschen“ wiedergegeben.
- source_word: וְאַחֲרִיתָהּ
  choice: doch am Ende
  rationale: אַחֲרִית bezeichnet den Ausgang beziehungsweise das Ende des Weges; „doch“ bringt den im Zusammenhang klaren Gegensatz natürlich zum Ausdruck.
- source_word: דַּרְכֵי מָוֶת
  choice: sind es Wege des Todes
  rationale: Der auffällige Wechsel vom singularischen Weg zum Plural „Wege“ wird bewahrt; „des Todes“ entspricht der hebräischen Genitivverbindung und lässt deren Bildkraft bestehen.
theological_decisions:
- issue: Verhältnis von menschlicher Einschätzung und tödlichem Ausgang
  choice: Die subjektive Geradheit des Weges wird dem objektiven Ausgang im Tod gegenübergestellt.
  alternative: Den Weg ausdrücklich als moralisch „richtig“ oder als bloß „scheinbar richtig“ bezeichnen.
  rationale: Die Übersetzung bewahrt die Spannung des hebräischen Textes, ohne näher festzulegen, ob Selbsttäuschung, begrenzte Einsicht oder moralischer Irrtum im Vordergrund steht.
translation_notes:
  register: Knapp, sprichwortartig und würdevoll. Der Singular-Plural-Wechsel („einen Weg“ / „Wege“) bleibt als bedeutungsvolle Unebenheit des Ausgangstextes erhalten.
