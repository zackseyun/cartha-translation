  text: גֹּ֣ל אֶל יְהוָ֣ה מַעֲשֶׂ֑י/ךָ וְ֝/יִכֹּ֗נוּ מַחְשְׁבֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/003.yaml
  text: Commit your works to Yahweh[b][a], and your plans will be established.
translation:
  language: de
  text: Vertraue Jahwe dein Tun an[a], und deine Pläne[b] werden Bestand haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wälze deine Werke auf Jahwe.« Die bildhafte Wendung bedeutet, ihm das eigene Tun anzuvertrauen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gedanken« beziehungsweise »Absichten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל אֶל
  choice: Vertraue … an
  rationale: Das Verb bedeutet wörtlich »rollen«; zusammen mit der Richtungsangabe bezeichnet die Wendung hier, die eigenen Unternehmungen Jahwe anzuvertrauen. Die deutsche Formulierung gibt das Idiom natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מַעֲשֶׂיךָ
  choice: was du tust
  rationale: Der Ausdruck umfasst Taten, Vorhaben und Unternehmungen. Die natürliche deutsche Wendung bewahrt diese Breite und vermeidet eine mögliche Verengung von »Werke«.
- source_word: וְיִכֹּנוּ
  choice: dann werden … Bestand haben
  rationale: Das Nifal von כון bezeichnet, dass etwas gefestigt oder beständig gemacht wird. »Bestand haben« ist im Deutschen klar und wahrt den resultativen Sinn.
- source_word: מַחְשְׁבֹתֶיךָ
  choice: deine Pläne
  rationale: Das Wort kann Gedanken, Absichten oder Pläne bezeichnen. Im Zusammenhang mit dem eigenen Tun passt »Pläne« am besten, ohne die weiteren Bedeutungen auszuschließen.
theological_decisions:
- issue: Verhältnis von menschlichem Handeln und göttlicher Festigung
  choice: Die eigenen Unternehmungen werden Jahwe anvertraut; darauf folgt die Zusage, dass die Pläne Bestand haben.
  alternative: Der Vers könnte als Garantie für den Erfolg jedes beliebigen Vorhabens oder als Aussage verstanden werden, Gott lege sämtliche Pläne unabhängig von der menschlichen Antwort fest.
  rationale: Der hebräische Weisheitsspruch verbindet Aufforderung und Folge, entfaltet aber weder eine vollständige Lehre der Vorsehung noch eine pauschale Erfolgsgarantie. Die Übersetzung lässt diese theologische Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt erhalten; das hebräische Bild des Wälzens wird zugunsten eines natürlichen deutschen Idioms in der Fußnote erläutert.
