  text: בְּ/חֶ֣סֶד וֶ֭/אֱמֶת יְכֻפַּ֣ר עָוֺ֑ן וּ/בְ/יִרְאַ֥ת יְ֝הוָ֗ה ס֣וּר מֵ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/006.yaml
  text: By steadfast love and faithfulness iniquity is atoned for[b][a], and by the fear of Yahweh one turns away from evil.
translation:
  language: de
  text: Durch Güte und Treue[a] wird Schuld gesühnt[b], und durch die Furcht Jahwes wendet man sich vom Bösen ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Durch beständige Liebe und Wahrheit“. Das hebräische Wortpaar kann loyale Güte und Verlässlichkeit bezeichnen; אֱמֶת kann jedoch auch „Wahrheit“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb steht im Passiv und nennt nicht, wer die Schuld sühnt. Der Spruch lässt offen, ob Gottes Handeln, die Bedeutung von Güte und Treue oder beides im Vordergrund steht.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחֶסֶד
  choice: durch Güte
  rationale: חֶסֶד umfasst beständige, loyale Liebe, Güte und verlässliche Zuwendung. „Güte“ ist hier im Deutschen natürlich und weit genug, um sowohl die zwischenmenschliche als auch die auf Gottes Handeln bezogene Lesart offenzuhalten; ב wird instrumental mit „durch“ wiedergegeben.
- source_word: וֶאֱמֶת
  choice: und Treue
  rationale: אֱמֶת kann „Wahrheit“, „Verlässlichkeit“ oder „Treue“ bedeuten. In der festen Verbindung mit חֶסֶד hebt „Treue“ die verlässliche Haltung hervor, ohne die Alternative „Wahrheit“ auszuschließen.
- source_word: יְכֻפַּר
  choice: wird … gesühnt
  rationale: Der Pual von כפר bezeichnet Sühne beziehungsweise die Beseitigung von Schuld. Die deutsche Passivform bewahrt, dass der hebräische Text den Handelnden nicht nennt.
- source_word: עָוֺן
  choice: Schuld
  rationale: עָוֺן kann Vergehen, Schuld oder deren Folgen bezeichnen. „Schuld“ ist im Deutschen würdig und verständlich und bewahrt sowohl den moralischen als auch den rechtlich-sühnetheologischen Aspekt.
- source_word: וּבְיִרְאַת יְהוָה
  choice: und durch die Furcht Jahwes
  rationale: יִרְאָה bezeichnet in der Weisheitsliteratur ehrfürchtige Gottesfurcht. Das instrumentale ב wird parallel zum ersten Versglied mit „durch“ wiedergegeben; der Gottesname erscheint in seiner im Deutschen üblichen Form „Jahwe“.
- source_word: סוּר
  choice: wendet man sich … ab
  rationale: Die Form drückt eine allgemeine, sprichwörtliche Aussage aus. Das unpersönliche „man“ gibt diesen generischen Sinn in natürlichem Deutsch wieder.
- source_word: מֵרָע
  choice: vom Bösen
  rationale: רָע bezeichnet hier im Zusammenhang mit der Furcht Jahwes moralisch Böses, nicht bloß Unglück oder Schaden.
theological_decisions:
- issue: Ob menschliches Verdienst oder Gottes Handeln als Ursache der Sühne gemeint ist
  choice: Die unpersönliche Passivform „wird Schuld gesühnt“ bleibt ohne genannten Handelnden.
  alternative: Man könnte ausdrücklich Gottes Güte und Treue als Ursache verstehen oder menschliche Güte und Treue als Mittel zur Erlangung von Vergebung auffassen.
  rationale: Das hebräische יְכֻפַּר nennt den Handelnden nicht. Die Übersetzung löst die echte theologische Spannung weder zugunsten ausschließlich göttlichen Handelns noch zugunsten menschlichen Verdienstes auf.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Yahweh; Jehova
  rationale: „Jahwe“ gibt den persönlichen Gottesnamen in der im modernen Deutschen üblichen Transkriptionsform wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer sprichwörtlicher Parallelstruktur. „Güte“, „Treue“, „Schuld“ und „sühnen“ sind allgemein verständlich und bewahren zugleich die ethische und theologische Dichte des Hebräischen.
