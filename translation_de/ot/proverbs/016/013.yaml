id: PRO.16.13
reference: Proverbs 16:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רְצ֣וֹן מְ֭לָכִים שִׂפְתֵי צֶ֑דֶק וְ/דֹבֵ֖ר יְשָׁרִ֣ים יֶאֱהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/013.yaml
  text: Righteous lips are the delight of kings[b][a], and he loves one who speaks what is upright.
translation:
  language: de
  text: Gerechte Worte finden das Wohlgefallen der Könige[a]; wer Aufrichtiges sagt, den liebt der König.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gerechte Worte stehen bei Königen in Gunst.“ Das hebräische Wort kann Wohlgefallen, Gefallen oder Gunst bezeichnen; der Ausdruck für „gerechte Worte“ lautet wörtlich „Lippen der Gerechtigkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht das Verb im Singular: „… den liebt er“. Gemeint sein kann der König als allgemeiner Einzelfall, nachdem zuvor von Königen im Plural die Rede war.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: רְצוֹן
  choice: Wohlgefallen
  rationale: Das Substantiv bezeichnet Gefallen, Gunst oder das, was willkommen ist. „Wohlgefallen finden“ gibt hier natürlich wieder, dass Könige an gerechter Rede Gefallen haben, ohne die Bedeutung auf bloße Freude einzuengen.
- source_word: מְלָכִים
  choice: der Könige
  rationale: Der konkrete Plural „Könige“ bewahrt den gesellschaftlichen Bezug auf königliche Herrscher.
- source_word: שִׂפְתֵי צֶדֶק
  choice: gerechte Worte
  rationale: Wörtlich steht „Lippen der Gerechtigkeit“. „Gerechte Worte“ überträgt die Metonymie im Deutschen natürlich und hält sowohl die moralische als auch die rechtliche Färbung von צֶדֶק offen.
- source_word: וְדֹבֵר
  choice: wer … sagt
  rationale: Das substantivisch gebrauchte Partizip bezeichnet allgemein einen Menschen, der entsprechend redet. Die deutsche Wer-Konstruktion gibt diesen generischen Sinn klar wieder.
- source_word: יְשָׁרִים
  choice: Aufrichtiges
  rationale: Der substantivisch gebrauchte Plural bezeichnet gerade, redliche oder richtige Dinge, die ausgesprochen werden. „Aufrichtiges“ ist idiomatisch und betont die Lauterkeit der Rede.
- source_word: יֶאֱהָב
  choice: den liebt der König
  rationale: Das Verb steht eindeutig in der dritten Person Singular. „Der König“ macht den im zweiten Halbvers generisch verstandenen singularischen Herrscher im Deutschen ausdrücklich, statt die Form zu einem Plural anzugleichen.
theological_decisions:
- issue: Wechsel vom pluralischen „Könige“ zum singularischen Verb יֶאֱהָב
  choice: Im zweiten Halbvers wird der generische Singular „der König“ verwendet.
  alternative: „… den lieben sie“ oder „… den liebt er“
  rationale: Ein pluralisches Verb wäre grammatisch glatt, würde aber die eindeutige Singularform des Hebräischen beseitigen. Ein bloßes „er“ hätte im Deutschen keinen klaren singularischen Bezug. Der generische Ausdruck „der König“ bewahrt den Numeruswechsel verständlich und ohne zusätzliche Lehrentscheidung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die metonymischen „Lippen“ werden im Haupttext als „Worte“ wiedergegeben und in der Fußnote offengelegt. Der auffällige Numeruswechsel des Hebräischen bleibt durch den generischen Singular „der König“ sichtbar.
