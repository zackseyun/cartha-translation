  text: לֵ֣ב אָ֭דָם יְחַשֵּׁ֣ב דַּרְכּ֑/וֹ וַֽ֝/יהוָ֗ה יָכִ֥ין צַעֲדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/009.yaml
  text: A man's heart plans his way[a], but Yahweh establishes his steps.
translation:
  language: de
  text: Das Herz eines Menschen plant seinen Weg, doch Jahwe gibt seinen Schritten festen Halt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doch Jahwe lenkt seine Schritte“. Das hebräische Verb kann „festigen“, „sichern“ oder, im Zusammenhang, „lenken“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: Herz
  rationale: Im Hebräischen bezeichnet לֵב den inneren Menschen als Ort des Denkens, Wollens und Planens. „Herz“ bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: אָדָם
  choice: eines Menschen
  rationale: Der singularische Ausdruck wird hier allgemein und repräsentativ gebraucht. „Eines Menschen“ gibt diesen generischen Sinn im modernen Deutschen natürlich wieder.
- source_word: יְחַשֵּׁב
  choice: plant
  rationale: Die Piel-Form bezeichnet hier bewusstes Planen oder Entwerfen. „Plant“ ist knapp und entspricht dem Stil eines Sprichworts.
- source_word: דַּרְכּוֹ
  choice: seinen Weg
  rationale: דֶּרֶךְ kann den buchstäblichen Weg und übertragen den Lebensweg oder Handlungsverlauf bezeichnen. „Weg“ erhält diese Bildhaftigkeit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: יָכִין
  choice: macht … fest
  rationale: Die Hifil-Form von כון bedeutet „fest machen“, „begründen“ oder „sicher hinstellen“. „Macht … fest“ bewahrt den kausativen Grundsinn, ohne ihn auf bloße Führung oder vollständige Vorherbestimmung einzuengen.
- source_word: צַעֲדוֹ
  choice: seine Schritte
  rationale: Obwohl die Form im Hebräischen singularisch ist, kann sie kollektiv die Schritte oder Bewegungen eines Menschen bezeichnen. Der deutsche Plural ist idiomatisch und erhält das konkrete Wegbild.
theological_decisions:
- issue: Göttliche Souveränität und menschliches Planen
  choice: Der Mensch plant wirklich seinen Weg, doch Jahwe macht seine Schritte fest.
  alternative: Jahwe lenkt seine Schritte; Jahwe bestimmt seine Schritte.
  rationale: Die Übersetzung erhält die Spannung zwischen menschlicher Absicht und Jahwes entscheidendem Wirken. „Lenkt“ könnte den Sinn auf Führung verengen, während „bestimmt“ stärker deterministisch klingt, als das Verb für sich genommen verlangt.
translation_notes:
  register: Knappes, würdiges und modernes Standarddeutsch. Die parallelen Bilder „Weg“ und „Schritte“ sowie die sprichwörtliche Gegenüberstellung bleiben erhalten.
