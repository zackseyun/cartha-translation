id: PRO.16.24
reference: Proverbs 16:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: צוּף דְּ֭בַשׁ אִמְרֵי נֹ֑עַם מָת֥וֹק לַ֝/נֶּפֶשׁ וּ/מַרְפֵּ֥א לָ/עָֽצֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/024.yaml
  text: Pleasant words are a honeycomb[b][a], sweet to the soul and healing to the bones.
translation:
  language: de
  text: Angenehme Worte sind Wabenhonig[a], süß für die Seele[b] und heilsam für die Knochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Honig aus der Wabe“; der hebräische Ausdruck kann die Wabe beziehungsweise den darin enthaltenen Honig bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Leben“, „Person“ oder „Selbst“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּף דְּבַשׁ
  choice: Wabenhonig
  rationale: Die Verbindung bezeichnet Honig aus der Wabe beziehungsweise die honiggefüllte Wabe. „Wabenhonig“ ist im modernen Deutschen verständlich und bewahrt das konkrete Bild.
- source_word: אִמְרֵי נֹעַם
  choice: angenehme Worte
  rationale: אִמְרֵי bezeichnet Worte oder Aussprüche; נֹעַם meint Annehmlichkeit, Lieblichkeit oder Wohlgefälligkeit. „Angenehme Worte“ gibt dies klar wieder, ohne die Aussage auf moralisch „gütige“ oder speziell „gnädige“ Rede festzulegen.
- source_word: מָתוֹק
  choice: süß
  rationale: Die wörtliche Geschmacksangabe führt das Honigbild fort und entspricht dem poetischen Parallelismus.
- source_word: לַנֶּפֶשׁ
  choice: für die Seele
  rationale: נֶפֶשׁ kann Seele, Leben, Person oder das eigene Selbst bezeichnen. „Seele“ bewahrt hier gegenüber den „Knochen“ die anthropologische Bildsprache; die Bedeutungsbreite wird in einer Fußnote offengehalten.
- source_word: וּמַרְפֵּא
  choice: und heilsam
  rationale: מַרְפֵּא bezeichnet Heilung, Gesundheit oder ein Heilmittel. Das Adjektiv „heilsam“ ergibt im Deutschen eine natürliche Parallelkonstruktion mit „süß“.
- source_word: לָעָצֶם
  choice: für die Knochen
  rationale: Der hebräische Singular kann kollektiv gebraucht sein. Der deutsche Plural ist in dieser körperlichen Metapher idiomatisch und bewahrt das konkrete Bild.
theological_decisions: []
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Der knappe Parallelismus und die sinnliche Bildsprache des Hebräischen bleiben erhalten; die Mehrdeutigkeit von נֶפֶשׁ und des Honigbildes wird nicht im Haupttext aufgelöst, sondern in Fußnoten kenntlich gemacht.
