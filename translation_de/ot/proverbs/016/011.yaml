  text: פֶּ֤לֶס וּ/מֹאזְנֵ֣י מִ֭שְׁפָּט לַֽ/יהוָ֑ה מַ֝עֲשֵׂ֗/הוּ כָּל אַבְנֵי כִֽיס׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/011.yaml
  text: A just balance and scales belong to Yahweh[a]; all the weights in the bag are his work.
translation:
  language: de
  text: Eine gerechte Waage und gerechte Waagschalen gehören Yahweh; alle Gewichtssteine im Beutel sind sein Werk.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּלֶס
  choice: Waage
  rationale: Bezeichnet ein Wiegegerät; „Waage“ ist im Deutschen die natürliche und sachlich passende Wiedergabe.
- source_word: וּמֹאזְנֵי מִשְׁפָּט
  choice: und Waagschalen der Gerechtigkeit
  rationale: מֹאזְנַיִם bezeichnet die Waage beziehungsweise ihre beiden Schalen; die konstruktive Verbindung mit מִשְׁפָּט bleibt als „der Gerechtigkeit“ erhalten und wahrt die markante hebräische Formulierung.
- source_word: לַיהוָה
  choice: gehören Yahweh
  rationale: Das ל drückt hier am ehesten Zugehörigkeit aus; der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: מַעֲשֵׂהוּ
  choice: sind sein Werk
  rationale: Bewahrt die breite Bedeutung von etwas, das von ihm gemacht oder geordnet ist, ohne die Aussage auf bloße materielle Herstellung zu verengen.
- source_word: כָּל אַבְנֵי כִיס
  choice: alle Gewichtssteine im Beutel
  rationale: Wörtlich sind es „alle Steine des Beutels“; im Handelskontext handelt es sich um die im Beutel aufbewahrten steinernen Gewichte. „Gewichtssteine“ erhält sowohl Bild als auch Funktion.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt unmittelbar den Tetragrammaton; „Yahweh“ gibt den persönlichen Bundesnamen wieder.
- issue: Aussage über gerechte Maße und Gewichte
  choice: Gerechte Maßstäbe gehören zu Yahwehs Ordnung und Autorität.
  alternative: Der Vers sage lediglich, Gott habe die physischen Gewichtssteine hergestellt.
  rationale: מִשְׁפָּט stellt das Wiegen ausdrücklich in den Bereich der Gerechtigkeit. Zugleich bleibt „sein Werk“ bewusst weit formuliert und wird nicht durch eine zusätzliche Auslegung ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kompakte Parallelstruktur und die ungewöhnliche Verbindung „Waagschalen der Gerechtigkeit“ bewahren die Bildkraft und Spannung des Hebräischen.
