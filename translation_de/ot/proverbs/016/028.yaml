  text: אִ֣ישׁ תַּ֭הְפֻּכוֹת יְשַׁלַּ֣ח מָד֑וֹן וְ֝/נִרְגָּ֗ מַפְרִ֥יד אַלּֽוּף׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/028.yaml
  text: A perverse man stirs up strife[c][b][a], and a whisperer separates close friends.
translation:
  language: de
  text: Ein Mann voller Verkehrtheit stiftet Streit[a], und ein Verleumder[b] entzweit enge Freunde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Ein Mann der Verkehrtheiten lässt Streit los.« Das hebräische Wort kann Verkehrtheit, Verdrehungen oder verkehrtes Verhalten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ein Klatschredner« oder »einer, der hinter dem Rücken anderer redet«. Das hebräische Wort bezeichnet verdeckte, beziehungsschädigende Rede und muss nicht zwingend eine nachweislich falsche Anschuldigung meinen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »einen vertrauten Gefährten«; das hebräische Wort steht im Singular. Der deutsche Plural bringt die allgemeine Aussage des Spruchs idiomatisch zum Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ein Mann
  rationale: Bewahrt den maskulinen Singular der hebräischen Form; der Spruch hat zugleich beispielhaften, allgemein anwendbaren Charakter.
- source_word: תַּהְפֻּכוֹת
  choice: der alles verdreht
  rationale: Das abstrakte Pluralwort bezeichnet Verkehrtheit, Verdrehungen oder verkehrtes Verhalten. Die verbale deutsche Wendung ist natürlich und bewahrt die inhaltliche Breite, ohne sie auf sexuelle oder dogmatische »Perversion« einzuengen.
- source_word: יְשַׁלַּח
  choice: entfacht
  rationale: Wörtlich bedeutet das Verb »aussenden« oder »loslassen«; zusammen mit »Streit« bezeichnet es idiomatisch das Ingangsetzen eines Konflikts.
- source_word: מָדוֹן
  choice: Streit
  rationale: Gibt den Weisheitsbegriff für Zwietracht und zwischenmenschliche Auseinandersetzung knapp und geläufig wieder.
- source_word: נִרְגָּן
  choice: ein heimlicher Zuträger
  rationale: Bezeichnet jemanden, der leise oder verdeckt abträgliche Dinge weitererzählt. »Heimlicher Zuträger« erhält sowohl das Verdeckte als auch die beziehungsschädigende Rede.
- source_word: מַפְרִיד
  choice: entzweit
  rationale: Gibt die charakteristische, trennende Wirkung der Handlung im Beziehungszusammenhang prägnant wieder.
- source_word: אַלּוּף
  choice: einen engen Freund
  rationale: Der Ausdruck meint hier einen vertrauten Gefährten oder engen Freund. Der Singular des hebräischen Textes bleibt erhalten.
