  source_fidelity: 'Die Grundstruktur und die zentralen Begriffe sind zutreffend wiedergegeben: איש als „Mann“, מדון als „Streit“, ישלח in der Wirkung als Auslösen von Streit und מפריד als Entzweien. „Der alles verdreht“ ist jedoch stärker und umfassender als das hebräische abstrakte Pluralwort תַּהְפֻּכוֹת; „voller Verkehrtheit“ wahrt dessen Charakter als Kennzeichnung der Person. Für נִרְגָּן ist „heimlicher Zuträger“ im Deutschen nicht die treffendste Bezeichnung für verdeckte, beziehungsschädigende Rede.'
  naturalness: „Heimlicher Zuträger“ klingt im heutigen Standarddeutsch ungebräuchlich und kann vor allem einen Informanten meinen. „Verleumder“ ist geläufig und passt als mögliche Wiedergabe, während die Fußnote die weiter gefasste Nuance des heimlichen Klatschens bzw. Hinterbringens sichert. Die Pluralform „enge Freunde“ ist im Deutschen bei diesem allgemeinen Spruch idiomatisch und gibt die soziale Trennwirkung klar wieder.
  terminology: „Verkehrtheit“ vermeidet die heute leicht sexualisierte Assoziation von „Perversion“ und bleibt nah am hebräischen Wortfeld. „Verleumder“ ist als Haupttext vertretbar, sollte aber durch eine Fußnote gegen die engeren Konnotationen der deutschen Vokabel abgesichert werden. „Enge Freunde“ gibt אַלּוּף im sozialen Kontext verständlich wieder.
