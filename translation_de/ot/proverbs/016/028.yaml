translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper sprichwörtlicher Form. Der männliche Singular und die Zweigliedrigkeit des hebräischen Verses bleiben erhalten; schwerfällige Wörtlichkeit und altertümliche Wörter wie »Ohrenbläser« werden vermieden.
