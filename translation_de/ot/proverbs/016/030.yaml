id: PRO.16.30
reference: Proverbs 16:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עֹצֶ֣ה עֵ֭ינָי/ו לַ/חְשֹׁ֣ב תַּהְפֻּכ֑וֹת קֹרֵ֥ץ שְׂ֝פָתָ֗י/ו כִּלָּ֥ה רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/030.yaml
  text: He who shuts his eyes to devise perverse things[a], who purses his lips[b], has completed evil.
translation:
  language: de
  text: Wer die Augen schließt, um Verkehrtes zu planen, und die Lippen zusammenpresst[a], hat das Böse zu Ende gebracht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Lippen zusammenzieht“. Das hebräische Verb kann auch eine andere zusammenziehende Gebärde bezeichnen; hier sind ausdrücklich die Lippen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hat das Böse vollendet“ beziehungsweise „hat Böses vollbracht“. Das hebräische Verb betont, dass etwas bis zum Ende ausgeführt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹצֶה
  choice: schließt
  rationale: Das Partizip bezeichnet hier das Schließen der Augen. „Schließt“ ist im Deutschen natürlich und bewahrt die im Hebräischen beschriebene Gebärde.
- source_word: עֵינָיו
  choice: die Augen
  rationale: Direkte Wiedergabe des Nomens mit männlichem Singularsuffix; im deutschen Relativsatz ist der Bezug auf „wer“ eindeutig.
- source_word: לַחְשֹׁב
  choice: um … zu planen
  rationale: חשב kann „denken“, „berechnen“ oder „planen“ bedeuten. Mit תַּהְפֻּכוֹת als Objekt liegt hier vorsätzliches Planen nahe.
- source_word: תַּהְפֻּכוֹת
  choice: Verkehrtes
  rationale: Der Plural bezeichnet moralisch Verdrehte(s), verkehrte Handlungen oder Pläne. Das substantivierte „Verkehrtes“ erhält den weiten Sinn, ohne eine bestimmte Art von Tat festzulegen.
- source_word: קֹרֵץ
  choice: zusammenpresst
  rationale: קרץ kann eine zusammenziehende Gebärde bezeichnen. Da hier ausdrücklich die Lippen das Objekt sind, gibt „zusammenpresst“ die konkrete Handlung genauer wieder als „zwinkert“.
- source_word: שְׂפָתָיו
  choice: die Lippen
  rationale: Wörtliche und natürliche Wiedergabe des direkten Objekts mit männlichem Singularsuffix.
- source_word: כִּלָּה
  choice: hat … zu Ende gebracht
  rationale: Das Piel von כלה betont das Vollenden beziehungsweise Zu-Ende-Bringen. Die Form wird als abgeschlossene Handlung wiedergegeben.
- source_word: רָעָה
  choice: das Böse
  rationale: רָעָה kann moralisches Böses, Unheil oder eine böse Tat bezeichnen. „Das Böse“ bewahrt in diesem ethischen Zusammenhang die Breite des Ausdrucks.
theological_decisions:
- issue: Verhältnis von innerem Plan, Gebärde und vollendeter Tat
  choice: Die abschließende Verbform wird als „hat das Böse zu Ende gebracht“ wiedergegeben.
  alternative: „vollbringt Böses“ oder „ist fest entschlossen, Böses zu tun“
  rationale: Der hebräische Text verbindet das Planen und die Gebärden mit כִּלָּה, das Vollendung ausdrückt. Die Übersetzung deutet dies nicht bloß als Entschluss um und lässt die zugespitzte Aussage des Spruchs stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Gebärden bleiben konkret, während „Verkehrtes“ und „das Böse“ die knappe, bewusst weite Ausdrucksweise des hebräischen Weisheitsspruchs bewahren.
