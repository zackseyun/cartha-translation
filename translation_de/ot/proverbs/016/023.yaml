source:
  edition: WLC
  text: לֵ֣ב חָ֭כָם יַשְׂכִּ֣יל פִּ֑י/הוּ וְ/עַל שְׂ֝פָתָ֗י/ו יֹסִ֥יף לֶֽקַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/023.yaml
  text: The heart of a wise man gives insight to his mouth[b][a], and adds learning to his lips.
translation:
  language: de
  text: Das Herz eines Weisen macht seinen Mund verständig[a] und fügt seinen Lippen Belehrung[b] hinzu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „macht seinen Mund klug“. Das hebräische Verb bezeichnet hier, dass das Herz den Mund verständig oder einsichtig macht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Überzeugungskraft“. Das hebräische Wort kann „Belehrung“, „Unterweisung“ oder „Lehre“ bezeichnen und kann im Zusammenhang auch auf gewinnende oder überzeugende Rede bezogen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: Herz
  rationale: Das hebräische Wort bezeichnet das innere Zentrum des Denkens, Urteilens und Wollens. „Herz“ bewahrt das hebräische Menschenbild und ist im Deutschen verständlich.
- source_word: חָכָם
  choice: eines Weisen
  rationale: Das substantivisch gebrauchte Adjektiv steht im maskulinen Singular. Die Formulierung gibt diese Form knapp und sprichwortgemäß wieder.
- source_word: יַשְׂכִּיל פִּיהוּ
  choice: lässt seinen Mund verständig reden
  rationale: Der Hifil von שׂכל drückt hier aus, dass das weise Herz den Mund zu einsichtigem, verständigem Reden befähigt. Die Formulierung gibt die kausative Bedeutung in natürlichem Deutsch wieder und bewahrt zugleich das konkrete Bild des Mundes.
- source_word: וְעַל שְׂפָתָיו
  choice: und … seinen Lippen
  rationale: „Lippen“ bewahrt den konkreten poetischen Parallelismus zu „Mund“. Die Präposition עַל wird entsprechend der deutschen Verbindung mit „verleihen“ nicht eigens abgebildet.
- source_word: יֹסִיף
  choice: verleiht
  rationale: Wörtlich bezeichnet das Verb ein Hinzufügen oder Vermehren. In Verbindung mit „Überzeugungskraft“ drückt „verleiht“ das Hinzukommen dieser Wirkung idiomatisch aus.
- source_word: לֶקַח
  choice: Überzeugungskraft
  rationale: לֶקַח kann Belehrung, Lehre oder das Vermögen bezeichnen, andere durch Worte zu gewinnen. Im unmittelbaren Zusammenhang mit den Lippen ist „Überzeugungskraft“ eine kontextuell gut begründete Wiedergabe; die stärker lexikalische Alternative „Belehrung“ bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem hebräischem Bildpaar „Herz – Mund – Lippen“. Die knappe Zweigliedrigkeit des Spruchs bleibt erhalten; verbalisiert wird nur dort, wo es für natürliches Deutsch nötig ist.
