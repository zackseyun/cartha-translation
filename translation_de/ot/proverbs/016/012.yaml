id: PRO.16.12
reference: Proverbs 16:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תּוֹעֲבַ֣ת מְ֭לָכִים עֲשׂ֣וֹת רֶ֑שַׁע כִּ֥י בִ֝/צְדָקָ֗ה יִכּ֥וֹן כִּסֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/012.yaml
  text: It is an abomination for kings to do wickedness[a], for a throne is established by righteousness.
translation:
  language: de
  text: Unrecht zu tun ist für Könige abscheulich; denn durch Gerechtigkeit[a] wird ein Thron gefestigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Recht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: abscheulich
  rationale: Das Wort bezeichnet etwas moralisch Verabscheuungswürdiges. Die prädikative Formulierung ist im heutigen Deutsch natürlicher als das traditionellere »ein Gräuel« und bewahrt dennoch das starke moralische Urteil.
- source_word: מְלָכִים
  choice: Könige
  rationale: Der gewöhnliche Plural wird direkt wiedergegeben und bezeichnet Könige als Herrschergruppe allgemein.
- source_word: עֲשׂוֹת
  choice: zu tun
  rationale: Der Infinitiv von עשה wird knapp und quellennah wiedergegeben.
- source_word: רֶשַׁע
  choice: Unrecht
  rationale: Das Substantiv bezeichnet schuldhaftes, böses oder verbrecherisches Handeln. »Unrecht« klingt im Deutschen natürlich mit »tun« und passt zum Kontext königlicher Amtsführung, ohne die moralische Dimension auf bloße Rechtswidrigkeit zu beschränken.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der ersten Aussage ein und entspricht dem knappen Spruchstil.
- source_word: בִצְדָקָה
  choice: durch Gerechtigkeit
  rationale: Die Präposition bezeichnet hier Mittel oder Grundlage. »Gerechtigkeit« bewahrt sowohl die moralische Rechtschaffenheit als auch den Gedanken gerechten Regierens.
- source_word: יִכּוֹן
  choice: wird gefestigt
  rationale: Der Niphal von כון bezeichnet das Festgemacht- oder Beständigwerden. »Wird gefestigt« gibt das Bild eines stabilen Königtums idiomatisch wieder.
- source_word: כִּסֵּא
  choice: ein Thron
  rationale: Der Singular ist sprichwörtlich-generisch; der unbestimmte Artikel gibt diese Allgemeingültigkeit im Deutschen natürlich wieder.
theological_decisions:
- issue: Bedeutungsumfang von צְדָקָה im königlichen Kontext
  choice: Gerechtigkeit
  alternative: Recht
  rationale: »Gerechtigkeit« erhält die umfassende moralische Qualität, auf der legitime Herrschaft beruht. »Recht« hebt im unmittelbaren Herrschaftskontext stärker gerechtes Regieren und Rechtsprechung hervor und wird deshalb als mögliche Wiedergabe in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwörtlicher Satzstruktur. »Abscheulich« vermeidet das heute altertümlich wirkende »ein Gräuel«, ohne die Schärfe von תּוֹעֲבַת abzuschwächen. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die Alternative bezieht.
