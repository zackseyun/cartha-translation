id: PRO.16.1
reference: Proverbs 16:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְ/אָדָ֥ם מַֽעַרְכֵי לֵ֑ב וּ֝/מֵ/יְהוָ֗ה מַעֲנֵ֥ה לָשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/001.yaml
  text: The plans of the heart belong to man[b][a], but the answer of the tongue is from Yahweh.
translation:
  language: de
  text: Die Pläne des Herzens liegen beim Menschen[a][b], doch die Antwort der Zunge kommt von Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Die Anordnungen/Vorbereitungen des Herzens sind Sache des Menschen.“'
    reason: lexical_alternative
  - marker: b
    text: „Mensch“ steht im Hebräischen in der Einzahl und bezeichnet hier repräsentativ jeden Menschen.
    reason: cultural_note
lexical_decisions:
- source_word: לְאָדָם
  choice: liegen beim Menschen
  rationale: Die Präposition לְ bezeichnet hier Zugehörigkeit oder Zuständigkeit. Die Formulierung gibt die verblos formulierte erste Vershälfte natürlich wieder und bewahrt den Gegensatz zu מֵ („von“) in der zweiten Hälfte.
- source_word: מַעַרְכֵי
  choice: Pläne
  rationale: Das von ערך abgeleitete Substantiv bezeichnet Anordnungen oder Vorbereitungen. In Verbindung mit „Herz“ sind damit innere Überlegungen und Planungen gemeint; „Pläne“ ist im Deutschen knapp und idiomatisch.
- source_word: לֵב
  choice: Herz
  rationale: לֵב bezeichnet das Innere des Menschen, einschließlich Denken, Wollen und Absicht. „Herz“ erhält das hebräische Bild und den charakteristischen Sprachgebrauch der Weisheitsliteratur.
- source_word: וּמֵיְהוָה
  choice: doch ... kommt von Jahwe
  rationale: Obwohl וְ grundsätzlich „und“ heißen kann, stellt der Parallelismus die menschliche Planung dem Ursprung der gesprochenen Antwort bei Jahwe gegenüber. „Doch“ macht diesen Gegensatz natürlich kenntlich, ohne ihn zu überdeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen verwendete Eigenname erhalten bleibt.
- source_word: מַעֲנֵה
  choice: Antwort
  rationale: Das Substantiv bezeichnet eine Antwort oder Erwiderung. „Antwort“ ist die direkte und im Zusammenhang passende Wiedergabe.
- source_word: לָשׁוֹן
  choice: Zunge
  rationale: „Zunge“ gibt das konkrete hebräische Bild wieder und dient zugleich als Metonymie für das gesprochene Wort.
theological_decisions:
- issue: Menschliches Planen und göttliche Souveränität im Parallelismus
  choice: Der Mensch trägt Pläne im Herzen, doch die ausgesprochene Antwort kommt von Jahwe.
  alternative: Der Vers könnte allgemeiner als Gegensatz zwischen menschlichen Plänen und Gottes Kontrolle über sämtliche Ergebnisse verstanden werden; er kann auch betonen, dass selbst die eigene Rede des Menschen von Jahwe bestimmt ist.
  rationale: Die Übersetzung hält sich an die konkrete Gegenüberstellung von „Plänen des Herzens“ und „Antwort der Zunge“. Sie bewahrt damit die Spannung zwischen menschlichem Planen und göttlichem Wirken, ohne daraus ein umfassendes deterministisches System abzuleiten.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch. Der poetische Parallelismus sowie die Bilder „Herz“ und „Zunge“ bleiben erhalten; „liegen beim“ bildet die hebräische Zuordnungsform natürlich ab.
