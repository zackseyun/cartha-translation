source:
  edition: WLC
  text: ט֣וֹב שְׁפַל ר֭וּחַ אֶת עניים מֵֽ/חַלֵּ֥ק שָׁ֝לָ֗ל אֶת גֵּאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/019.yaml
  text: Better to be lowly in spirit with the poor than to divide plunder with the proud[a].
translation:
  language: de
  text: Besser, demütigen Geistes mit den Armen zu sein, als Beute mit den Stolzen zu teilen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »demütigen Geistes mit den Bedrängten« beziehungsweise »mit den Demütigen«. Das hebräische Wort עניים kann je nach Zusammenhang Arme, Bedrängte oder Demütige bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Besser
  rationale: Leitet die vergleichende Wertung des Spruchs ein und bewahrt in knapper Form den sprichwörtlichen Stil.
- source_word: שְׁפַל רוּחַ
  choice: demütigen Geistes zu sein
  rationale: Gibt die innere Haltung der Niedrigkeit oder Demut wieder, ohne sie unnötig psychologisch einzuengen.
- source_word: אֶת עניים
  choice: bei den Armen
  rationale: אֶת wird hier assoziativ verstanden. »Bei« bezeichnet die Zugehörigkeit zu den Armen und bildet den Gegensatz zum Teilen der Beute mit den Stolzen; עניים kann auch Bedrängte oder Demütige bezeichnen.
- source_word: מֵחַלֵּק
  choice: als … zu teilen
  rationale: Das präfigierte מִן kennzeichnet nach טוֹב den Vergleich; die deutsche Infinitivkonstruktion bildet ihn natürlich ab.
- source_word: שָׁלָל
  choice: Beute
  rationale: Bezeichnet erbeutete Güter und ist im modernen Deutschen klar und idiomatisch.
- source_word: אֶת גֵּאִים
  choice: mit den Stolzen
  rationale: אֶת ist wiederum assoziativ; »die Stolzen« steht als unmittelbarer Gegenpol zu demütigem Geist.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller Spruchstil in modernem Standarddeutsch. Die etwas gehobene Wendung »demütigen Geistes« bewahrt die ausdrückliche Verbindung von שְׁפַל mit רוּחַ; »bei den Armen« klingt natürlicher als »mit den Armen« und hält die soziale Zuordnung offen.
