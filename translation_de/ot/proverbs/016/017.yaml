  text: מְסִלַּ֣ת יְ֭שָׁרִים ס֣וּר מֵ/רָ֑ע שֹׁמֵ֥ר נַ֝פְשׁ֗/וֹ נֹצֵ֥ר דַּרְכּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/017.yaml
  text: The highway of the upright turns away from evil[b][a]; he who guards his life watches over his way.
translation:
  language: de
  text: Die Straße der Aufrichtigen führt vom Bösen weg[a]. Wer sein Leben[b] bewahrt, gibt auf seinen Weg acht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Die Straße der Aufrichtigen ist die Abwendung vom Bösen.« Die hebräische Formulierung ist eine knappe Nominalkonstruktion.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »נַפְשׁוֹ (nafšô)«, wörtlich »sein Leben/seine Seele«; gemeint ist hier wahrscheinlich sein Leben oder seine eigene Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְסִלַּת
  choice: Straße
  rationale: מְסִלָּה bezeichnet eine gebahnte beziehungsweise erhöhte Straße und ist markierter als ein allgemeiner »Weg«. »Straße« bewahrt dieses Bild in natürlichem Deutsch.
- source_word: יְשָׁרִים
  choice: die Aufrichtigen
  rationale: Das Wort bezeichnet Menschen, die moralisch gerade und rechtschaffen handeln. »Die Aufrichtigen« gibt diesen ethischen Sinn wieder, ohne es mit einem anderen hebräischen Begriff für Gerechtigkeit gleichzusetzen.
- source_word: סוּר מֵרָע
  choice: führt vom Bösen weg
  rationale: Die Infinitivverbindung beschreibt, worin die Straße der Aufrichtigen besteht. Die verbale Formulierung gibt die Abwendung vom Bösen natürlich wieder; die zugrunde liegende Nominalkonstruktion bleibt in der Fußnote sichtbar.
- source_word: רָע
  choice: das Böse
  rationale: Im Zusammenhang des Sprüchebuchs ist vor allem moralisch Böses gemeint, nicht lediglich Schaden oder etwas Unangenehmes.
- source_word: שֹׁמֵר נַפְשׁוֹ
  choice: wer sein Leben bewahrt
  rationale: נֶפֶשׁ meint hier wahrscheinlich das Leben beziehungsweise die eigene Person, nicht eine vom Körper getrennte »Seele«. »Sein Leben bewahrt« erhält zugleich den Gedanken des Schutzes.
- source_word: נֹצֵר דַּרְכּוֹ
  choice: gibt auf seinen Weg acht
  rationale: נצר bezeichnet aufmerksames Hüten oder Bewahren. Die Formulierung unterscheidet das Verb sprachlich von שׁמר und erhält »Weg« als weisheitliches Bild für die Lebensführung.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im weisheitlichen Zusammenhang
  choice: Leben beziehungsweise die ganze eigene Person
  alternative: Seele
  rationale: Der Spruch verbindet die aufmerksame Lebensführung mit der Bewahrung der eigenen Person. »Leben« vermeidet eine vom hebräischen Text nicht verlangte Aussage über eine Trennung von Leib und Seele.
- issue: Verhältnis von Straße und Abwendung vom Bösen
  choice: Die Straße führt vom Bösen weg
  alternative: Die Straße ist die Abwendung vom Bösen
  rationale: Die knappe hebräische Nominalfügung lässt sowohl eine identifizierende als auch eine beschreibende Wiedergabe zu. Der Haupttext formuliert idiomatisch und bewahrt die alternative Struktur in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Straße« erhält das ausgeprägte Verkehrswegebild von מְסִלָּה; »gibt auf seinen Weg acht« klingt gegenwärtig und wahrt zugleich den Parallelismus der beiden Halbverse.
