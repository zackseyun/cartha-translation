id: PRO.11.18
reference: Proverbs 11:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רָשָׁ֗ע עֹשֶׂ֥ה פְעֻלַּת שָׁ֑קֶר וְ/זֹרֵ֥עַ צְ֝דָקָ֗ה שֶׂ֣כֶר אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/018.yaml
  text: A wicked man earns deceptive wages[b][a], but one who sows righteousness receives a true reward.
translation:
  language: de
  text: Ein Gottloser erarbeitet trügerischen Lohn[a], wer aber Gerechtigkeit sät, empfängt sicheren Lohn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollbringt ein Werk der Falschheit“. Der hebräische Ausdruck kann eine betrügerische Tat, trügerischen Gewinn oder Arbeit bezeichnen, deren Ertrag sich als nichtig erweist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Lohn der Wahrheit“; auch: „verlässlichen Lohn“ oder „echten Lohn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
  choice: ein Gottloser
  rationale: Das substantivierte Adjektiv bezeichnet im Spruch einen einzelnen gottlosen bzw. schuldigen Menschen stellvertretend für eine allgemeine Personengruppe. „Ein Gottloser“ ist knapp, idiomatisch und bewahrt die moralisch-religiöse Färbung.
- source_word: עֹשֶׂה פְעֻלַּת שָׁקֶר
  choice: erarbeitet trügerischen Lohn
  rationale: Die Verbindung bedeutet wörtlich etwa „verrichtet ein Werk der Falschheit“. פְעֻלָּה kann jedoch auch den Ertrag bzw. Lohn der Arbeit bezeichnen. Die gewählte Formulierung wahrt diesen Bezug und die Pointe, dass der vermeintliche Gewinn täuscht oder sich als nichtig erweist.
- source_word: שָׁקֶר
  choice: trügerisch
  rationale: Das Wort umfasst Falschheit, Täuschung und Unzuverlässigkeit. „Trügerisch“ lässt offen, ob der Lohn durch Betrug erworben wurde oder sich selbst als unzuverlässig und leer erweist.
- source_word: וְזֹרֵעַ
  choice: wer aber … sät
  rationale: Das וְ markiert im antithetischen Parallelismus sinnvoll einen Gegensatz. Die substantivische Partizipialform wird im Deutschen natürlich als „wer … sät“ wiedergegeben.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: צְדָקָה bezeichnet normgerechtes, gerechtes Handeln und kann zugleich eine umfassende moralisch-religiöse Qualität ausdrücken. „Gerechtigkeit“ ist im Deutschen die natürliche und traditionsfähige Entsprechung, ohne den Begriff auf soziale Rechtspflege zu verengen.
- source_word: שֶׂכֶר אֱמֶת
  choice: sicheren Lohn
  rationale: Wörtlich steht „Lohn der Wahrheit“. Im Gegensatz zum trügerischen Ertrag bezeichnet die Wendung einen echten, verlässlichen Lohn. „Sicher“ gibt diese idiomatische Bedeutung knapp wieder; die wörtlichere Möglichkeit wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutungsumfang von צְדָקָה
  choice: Gerechtigkeit
  alternative: gerechtes Handeln; Rechtschaffenheit
  rationale: Der hebräische Ausdruck umfasst sowohl rechtes Verhalten als auch eine breitere moralische Qualität. „Gerechtigkeit“ erhält diesen theologischen und ethischen Bedeutungsraum, ohne eine bestimmte konfessionelle Deutung einzutragen.
- issue: Art des in שֶׂכֶר אֱמֶת zugesagten Lohns
  choice: Die Aussage bleibt allgemein und bezeichnet einen echten, verlässlichen Lohn.
  alternative: eine ausdrücklich diesseitige Vergütung oder eine ausdrücklich jenseitige Belohnung
  rationale: Der Vers bestimmt weder Zeitpunkt noch konkrete Gestalt des Lohns. Die Übersetzung vermeidet daher eine nicht im Text ausgesprochene heilsgeschichtliche oder materielle Festlegung.
translation_notes:
  register: Moderner, würdiger Spruchstil mit klarer antithetischer Parallelstruktur. „Erarbeitet“ hält die Verbindung von Tätigkeit und Ertrag fest; die beiden Vorkommen von „Lohn“ machen den Gegensatz im Deutschen hörbar. Sämtliche Fußnotenmarker stehen im Haupttext.
