source:
  edition: WLC
  text: כֵּן צְדָקָ֥ה לְ/חַיִּ֑ים וּ/מְרַדֵּ֖ף רָעָ֣ה לְ/מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/019.yaml
  text: So righteousness leads to life[a], but he who pursues evil, to his own death.
translation:
  language: de
  text: So führt Gerechtigkeit zum Leben, wer aber dem Bösen nachjagt, steuert auf seinen Tod zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So ist Gerechtigkeit auf Leben ausgerichtet“; auch möglich: „Ja, Gerechtigkeit führt zum Leben.“ Der erste Satzteil hat im Hebräischen kein ausdrückliches Verb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: So
  rationale: Das Adverb zieht eine folgernde oder bekräftigende Schlussfolgerung. „So“ ist im Deutschen knapp, natürlich und lässt beide Nuancen anklingen.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Der Begriff bezeichnet hier im weisheitlichen Zusammenhang umfassende moralische Rechtschaffenheit und steht im Gegensatz zum Bösen. „Gerechtigkeit“ bewahrt zugleich die soziale Bedeutungsdimension des hebräischen Wortes.
- source_word: לְחַיִּים
  choice: führt zum Leben
  rationale: Die Präposition לְ bezeichnet Ziel oder Ergebnis. Da der hebräische erste Satzteil kein ausdrückliches Verb enthält, wird die resultative Beziehung im Deutschen mit „führt“ wiedergegeben.
- source_word: וּמְרַדֵּף
  choice: wer aber … nachjagt
  rationale: Das Partizip ist substantivisch und bezeichnet jemanden, der etwas anhaltend verfolgt. Das verbindende וּ wird wegen des antithetischen Parallelismus adversativ mit „aber“ wiedergegeben.
- source_word: רָעָה
  choice: dem Bösen
  rationale: Im Gegensatz zu Gerechtigkeit ist רָעָה hier ethisch als das Böse zu verstehen, nicht primär als Unglück oder Schaden.
- source_word: לְמוֹתוֹ
  choice: zu seinem eigenen Tod
  rationale: Wörtlich steht „zu seinem Tod“. „Eigenen“ hebt idiomatisch den Bezug des Suffixes auf denjenigen hervor, der dem Bösen nachjagt, ohne eine zusätzliche Ursache ausdrücklich einzutragen.
theological_decisions:
- issue: Bedeutung von צְדָקָה im weisheitlichen Zusammenhang
  choice: Gerechtigkeit als umfassende moralische Rechtschaffenheit, die zum Leben führt
  alternative: Gerechtigkeit im engeren Sinn sozialer Fairness
  rationale: Der antithetische Parallelismus stellt Gerechtigkeit dem Verfolgen des Bösen gegenüber. Daher ist der breitere ethische Sinn wahrscheinlich, ohne die soziale Dimension des Ausdrucks auszuschließen.
- issue: Verhältnis von Verhalten und Folge
  choice: Die beiden לְ-Verbindungen werden als Ziel- beziehungsweise Ergebnisangaben wiedergegeben
  alternative: 'Rein statische Wiedergabe: „Gerechtigkeit ist zum Leben … zum Tod“'
  rationale: „Führt zum“ macht die im Parallelismus liegende Folgerichtung natürlich verständlich. Die Fußnote hält jedoch offen, dass der erste hebräische Satzteil verblos ist und auch statischer verstanden werden kann.
translation_notes:
  register: Knappes, würdiges Sprichwort in modernem Standarddeutsch. Die Ellipse des zweiten Satzteils bleibt erhalten („… zu seinem eigenen Tod“), um den hebräischen Parallelismus abzubilden; die genuine Mehrdeutigkeit des verblosen ersten Satzteils wird in der Fußnote bewahrt.
