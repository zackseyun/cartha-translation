source:
  edition: WLC
  text: בְּ/אֵ֣ין תַּ֭חְבֻּלוֹת יִפָּל עָ֑ם וּ֝/תְשׁוּעָ֗ה בְּ/רֹ֣ב יוֹעֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/014.yaml
  text: Without guidance a people falls[a], but in an abundance of counselors there is deliverance.
translation:
  language: de
  text: Ohne Führung kommt ein Volk zu Fall, doch bei vielen Ratgebern gibt es Rettung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wo es an Führung fehlt, kommt ein Volk zu Fall; doch bei einer Vielzahl von Ratgebern gibt es Sicherheit/Sieg.“'
    reason: 'Lexikalische Alternativen: תְּשׁוּעָה kann neben „Rettung“ auch „Sicherheit“ oder „Sieg“ bedeuten; בְּאֵין lässt sich auch als „Wo es an … fehlt“ wiedergeben.'
lexical_decisions:
- source_word: בְּ/אֵין
  choice: Ohne
  rationale: Die Verbindung aus ב und אֵין bezeichnet das Fehlen von etwas. „Ohne“ ist im Deutschen knapp und natürlich.
- source_word: תַּחְבֻּלוֹת
  choice: Führung
  rationale: Das Wort kann Lenkung, kluge Führung oder strategische Beratung bezeichnen. „Führung“ bewahrt die bildhafte Vorstellung des Lenkens und vermeidet eine unnötige Einengung auf militärische Strategie.
- source_word: יִפָּל
  choice: kommt … zu Fall
  rationale: Die Wendung gibt das wörtliche Bild von נפל („fallen“) idiomatisch wieder und lässt zugleich Zusammenbruch oder Untergang anklingen.
- source_word: עָם
  choice: ein Volk
  rationale: Die artikellose Form formuliert eine allgemeine Aussage; „ein Volk“ entspricht diesem sprichwörtlichen Sinn.
- source_word: וּ/תְשׁוּעָה
  choice: doch … gibt es Rettung
  rationale: תְּשׁוּעָה kann Rettung, Sicherheit oder Sieg bedeuten. „Rettung“ wahrt die Bedeutungsbreite besser als die militärisch engere Wiedergabe „Sieg“.
- source_word: בְּ/רֹב יוֹעֵץ
  choice: bei vielen Ratgebern
  rationale: רֹב bezeichnet eine große Zahl; יוֹעֵץ steht formal im Singular, wird hier aber kollektiv verstanden. Die deutsche Formulierung ist natürlich und erhält den Gegensatz zur fehlenden Führung.
theological_decisions: []
