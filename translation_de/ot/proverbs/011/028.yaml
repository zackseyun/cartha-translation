source:
  edition: WLC
  text: בּוֹטֵ֣חַ בְּ֭/עָשְׁר/וֹ ה֣וּא יִפֹּ֑ל וְ֝/כֶ/עָלֶ֗ה צַדִּיקִ֥ים יִפְרָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/028.yaml
  text: Whoever trusts in his wealth will fall[a], but the righteous will flourish like leaves.
translation:
  language: de
  text: Wer auf seinen Reichtum vertraut, wird fallen; doch die Gerechten werden wie Laub gedeihen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wie ein Blatt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ
  choice: vertraut
  rationale: Das Partizip von בטח bezeichnet das Setzen von Vertrauen oder Zuversicht auf etwas; „vertraut“ gibt die moralische Aussage natürlich und präzise wieder.
- source_word: בְּעָשְׁרוֹ
  choice: auf seinen Reichtum
  rationale: עֹשֶׁר bedeutet Reichtum oder Wohlstand. Mit „auf … vertrauen“ ist im Deutschen der Akkusativ idiomatisch.
- source_word: הוּא יִפֹּל
  choice: wird fallen
  rationale: Das selbstständige Pronomen hebt im Hebräischen den Betreffenden hervor; die deutsche Satzform macht den Bezug bereits deutlich. Das Imperfekt beschreibt die typische Folge.
- source_word: וְכֶעָלֶה
  choice: wie grünes Laub
  rationale: עָלֶה steht formal im Singular („Blatt“), kann im Bild jedoch kollektiv verstanden werden. „Grünes Laub“ vermittelt das Pflanzenbild und den Gegensatz zu Fall und Untergang; die wörtlichere Möglichkeit wird in der Fußnote genannt.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Das substantivierte maskuline Pluraladjektiv bezeichnet Menschen, die gerecht sind; „die Gerechten“ ist knapp, würdig und im Deutschen geläufig.
- source_word: יִפְרָחוּ
  choice: werden gedeihen
  rationale: פרח kann sprossen, blühen oder gedeihen bedeuten. „Gedeihen“ passt natürlich zum Laubbild und bewahrt den umfassenden Sinn des Aufblühens.
theological_decisions:
- issue: Generische Bedeutung der maskulinen Singularform im ersten Halbvers
  choice: Wer auf seinen Reichtum vertraut
  alternative: Der auf seinen Reichtum vertraut / Wer auf Reichtum vertraut
  rationale: Die maskuline Singularform ist in der Spruchweisheit allgemein gemeint. „Wer“ gibt diese generische Reichweite natürlich wieder; „seinen“ bewahrt zugleich die grammatische Orientierung des Ausgangstextes.
- issue: Zahl und Charakter des Vergleichs mit עָלֶה
  choice: wie grünes Laub
  alternative: wie ein Blatt
  rationale: Das hebräische Substantiv ist Singular, doch das Bild kann repräsentativ oder kollektiv sein und steht bei dem pluralischen „die Gerechten“. Die Übersetzung bewahrt das Bild üppigen Pflanzenwachstums, während die formal nähere Lesart in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem spruchweisheitlichem Ton. Der Kontrast zwischen dem Fall dessen, der auf Reichtum vertraut, und dem pflanzlichen Gedeihen der Gerechten bleibt knapp und parallel.
