  text: יָ֣ד לְ֭/יָד לֹא יִנָּ֣קֶה רָּ֑ע וְ/זֶ֖רַע צַדִּיקִ֣ים נִמְלָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/021.yaml
  text: Hand to hand[a], the evil will not go unpunished, but the offspring of the righteous will escape.
translation:
  language: de
  text: 'Hand zu Hand[a]: Der Böse bleibt nicht ungestraft, doch die Nachkommen der Gerechten entkommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Hand zu Hand“; eine hebräische Wendung, die wahrscheinlich „ganz gewiss“ bedeutet oder besondere Bekräftigung ausdrückt.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד לְיָד
  choice: Hand auf Hand
  rationale: Die wörtliche Bildform der schwer eindeutig zu bestimmenden hebräischen Wendung bleibt im Haupttext erhalten. Im Deutschen ist „Hand auf Hand“ verständlich, ohne die Wendung vorschnell ausschließlich als „gewiss“ zu deuten.
- source_word: יִנָּקֶה
  choice: bleibt nicht ungestraft
  rationale: Das Nifal von נקה bezeichnet hier, von Strafe frei zu sein beziehungsweise ungestraft zu bleiben. Die deutsche Formulierung ist idiomatisch und bewahrt den moralisch-rechtlichen Sinn.
- source_word: רָּע
  choice: der Böse
  rationale: Das maskuline Singularadjektiv wird substantivisch gebraucht und bezeichnet einen bösen Menschen. „Der Böse“ bildet Form und knappen Spruchstil natürlich ab, ohne das zusätzliche Substantiv „Mann“ einzuführen.
- source_word: וְזֶרַע
  choice: doch die Nachkommen
  rationale: זֶרַע bezeichnet hier die Nachkommenschaft. „Doch“ gibt den inhaltlichen Gegensatz zwischen dem Bösen und den Gerechten wieder; der deutsche Plural „Nachkommen“ ist natürlicher als „Same“ oder „Nachkommenschaft“.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Das substantivierte Pluraladjektiv wird mit der geläufigen und knappen deutschen Bezeichnung „die Gerechten“ wiedergegeben.
- source_word: נִמְלָט
  choice: werden entkommen
  rationale: Das Nifal von מלט kann Entkommen oder Rettung bezeichnen. „Entkommen“ lässt offen, ob Gericht, Unheil oder das Schicksal des Bösen als Gefahr gemeint ist.
theological_decisions:
- issue: Substantivisches רָּע im maskulinen Singular
  choice: der Böse
  alternative: ein böser Mensch
  rationale: Die gewählte Form bewahrt den repräsentativen maskulinen Singular und fügt dem hebräischen Adjektiv kein ausdrücklich vorhandenes Substantiv hinzu.
- issue: Deutung der Wendung יָד לְיָד
  choice: Das hebräische Bild im Haupttext bewahren
  alternative: Ganz gewiss
  rationale: Die Wendung ist in ihrer genauen Funktion umstritten. Die bildhafte Wiedergabe vermeidet eine stille Festlegung; die wahrscheinliche emphatische Bedeutung wird in der Fußnote genannt.
- issue: Art des Entkommens in נִמְלָט
  choice: entkommen
  alternative: gerettet werden
  rationale: Der Vers nennt weder ausdrücklich den Handelnden noch die konkrete Gefahr. „Entkommen“ bewahrt diese Offenheit, während „gerettet werden“ stärker eine äußere Rettungsinstanz hervorheben könnte.
translation_notes:
  register: Knappes, würdevolles modernes Standarddeutsch im Stil eines Weisheitsspruchs. Der Doppelpunkt markiert den Übergang von der vorangestellten emphatischen Wendung zur Aussage. Die schwer eindeutige hebräische Bildsprache bleibt sichtbar und wird durch eine Fußnote erläutert.
