  text: צִדְקַ֣ת תָּ֭מִים תְּיַשֵּׁ֣ר דַּרְכּ֑/וֹ וּ֝/בְ/רִשְׁעָת֗/וֹ יִפֹּ֥ל רָשָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/005.yaml
  text: The righteousness of the blameless makes his way straight[b][a], but the wicked falls by his wickedness.
translation:
  language: de
  text: Die Gerechtigkeit des Untadeligen macht seinen Weg gerade[a], doch der Böse fällt durch seine Bosheit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »lenkt seinen Pfad« oder »ebnet seinen Weg«. Das hebräische Verb vermittelt das Bild, einen Weg gerade zu machen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in seiner Bosheit«. Die hebräische Wendung kann sowohl den Bereich seines Handelns als auch das Mittel bezeichnen, durch das er zu Fall kommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: Gerechtigkeit
  rationale: Die Konstruktform von צְדָקָה bezeichnet hier das rechte, aufrichtige Verhalten. »Gerechtigkeit« wahrt den in der Weisheitsliteratur geläufigen ethischen Begriff.
- source_word: תָּמִים
  choice: des Untadeligen
  rationale: תָּמִים bezeichnet moralische Lauterkeit und Ganzheit, nicht notwendigerweise absolute Sündlosigkeit. »Untadelig« gibt diesen Sinn prägnant wieder.
- source_word: תְּיַשֵּׁר
  choice: macht … gerade
  rationale: Der Piel-Stamm von ישר bedeutet, etwas gerade oder eben zu machen. Die Formulierung bewahrt das hebräische Wegbild.
- source_word: דַּרְכּוֹ
  choice: seinen Weg
  rationale: »Weg« ist das natürliche deutsche Gegenstück zum weisheitlichen Bild für Lebensführung und Lebenslauf.
- source_word: וּבְרִשְׁעָתוֹ
  choice: durch seine Bosheit
  rationale: Die Präposition ב kann instrumental oder lokal verstanden werden. »Durch« stellt die eigene Bosheit als Ursache oder Mittel des Falls dar, ohne die mögliche Lesart »in« zu verschweigen.
- source_word: יִפֹּל
  choice: fällt
  rationale: Das Imperfekt formuliert hier eine allgemeine, sprichwörtliche Wahrheit; das deutsche Präsens gibt diese gnomische Aussage natürlich wieder.
- source_word: רָשָׁע
  choice: der Gottlose
  rationale: Das substantivierte Adjektiv bezeichnet den schuldhaft bösen Menschen als weisheitlichen Typus. »Der Gottlose« ist knapp und im biblischen Register etabliert.
theological_decisions:
- issue: Generischer Gebrauch der maskulinen Singularformen
  choice: 'Maskulinen Singular beibehalten: »des Untadeligen«, »seinen«, »der Gottlose«, »seine«'
  alternative: Pluralische oder geschlechtsneutrale Wiedergabe
  rationale: Der hebräische Spruch stellt zwei repräsentative Personen im maskulinen Singular gegenüber. Die deutsche Fassung erhält diese grammatische und rhetorische Struktur.
- issue: Verhältnis zwischen Bosheit und Fall
  choice: 'Instrumentale Wiedergabe: »durch seine Bosheit«'
  alternative: 'Lokale Wiedergabe: »in seiner Bosheit«'
  rationale: Das Hebräische lässt sowohl den Bereich als auch das Mittel des Falls anklingen. Im Haupttext wird die moralische Kausalität ausgedrückt; die echte Mehrdeutigkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter Wegmetapher und der antithetischen Kürze des hebräischen Spruchs. Der maskuline Singular folgt der Form des Ausgangstextes.
