source:
  edition: WLC
  text: בְּ/פֶ֗ה חָ֭נֵף יַשְׁחִ֣ת רֵעֵ֑/הוּ וּ֝/בְ/דַ֗עַת צַדִּיקִ֥ים יֵחָלֵֽצוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/009.yaml
  text: With his mouth the godless man destroys his neighbor[b][a], but by knowledge the righteous are delivered.
translation:
  language: de
  text: Mit seinem Mund richtet der Gottlose seinen Mitmenschen zugrunde[a], doch durch Erkenntnis werden die Gerechten gerettet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Heuchler richtet mit seinem Mund seinen Mitmenschen zugrunde.“ Das hebräische Wort kann einen gottlosen, frevelhaften oder heuchlerischen Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „doch durch Erkenntnis entkommen die Gerechten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶה
  choice: Mit seinem Mund
  rationale: Die Präposition ב bezeichnet hier das Mittel. Die Formulierung bewahrt das konkrete Bild des Mundes als Werkzeug schädlicher Rede und klingt im Deutschen natürlich.
- source_word: חָנֵף
  choice: der Gottlose
  rationale: חָנֵף kann einen gottlosen, frevelhaften oder heuchlerischen Menschen bezeichnen. Im Gegensatz zu den Gerechten steht hier die umfassende moralisch-religiöse Verderbtheit im Vordergrund, nicht nur Unaufrichtigkeit.
- source_word: יַשְׁחִת
  choice: richtet … zugrunde
  rationale: Der Hifil von שׁחת bedeutet hier ‚verderben, vernichten, zugrunde richten‘. Die deutsche Wendung gibt die starke zerstörerische Wirkung wieder, ohne zwingend eine körperliche Tötung auszudrücken.
- source_word: רֵעֵהוּ
  choice: seinen Mitmenschen
  rationale: רֵעַ kann Nachbar, Gefährte, Freund oder Mitmensch bedeuten. ‚Mitmensch‘ hält die soziale Beziehung weit und vermeidet die im heutigen Deutschen oft räumliche Verengung von ‚Nachbar‘.
- source_word: וּבְדַעַת
  choice: doch durch Erkenntnis
  rationale: ו markiert den Gegensatz, ב das Mittel. ‚Erkenntnis‘ bewahrt den zentralen Weisheitsbegriff דַּעַת und bezeichnet mehr als bloßen Informationsbesitz.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Das substantivierte maskuline Pluraladjektiv bezeichnet die ethisch-religiöse Gruppe der Gerechten und wird entsprechend knapp wiedergegeben.
- source_word: יֵחָלֵצוּ
  choice: werden … gerettet
  rationale: Der Nifal von חלץ drückt hier Entrinnen oder Gerettetwerden aus. Die passive Form wahrt die Offenheit darüber, wer rettet und aus welcher konkreten Gefahr die Gerechten befreit werden.
theological_decisions:
- issue: Bedeutungsumfang von חָנֵף
  choice: der Gottlose
  alternative: der Heuchler; der Frevler
  rationale: Der Begriff kann Heuchelei einschließen, bezeichnet im Weisheitskontext jedoch umfassender moralisch-religiöse Verkehrtheit. ‚Gottlose‘ erhält den Kontrast zu den Gerechten, ohne den Sinn auf vorgetäuschte Frömmigkeit zu beschränken.
- issue: Subjekt des zweiten Halbverses
  choice: Die Gerechten sind das Subjekt von יֵחָלֵצוּ und werden durch Erkenntnis gerettet.
  alternative: Andere Menschen werden durch die Erkenntnis der Gerechten gerettet.
  rationale: Die nächstliegende hebräische Syntax nimmt צַדִּיקִים als Subjekt des pluralischen Verbs. Eine Deutung ihrer Erkenntnis als Mittel zur Rettung anderer ist grammatisch weniger unmittelbar.
- issue: Art der Rettung
  choice: Die konkrete Gefahr und der Handelnde der Rettung bleiben ungenannt.
  alternative: Ausdrückliche Rettung vor der Rede des Gottlosen oder ausdrückliche göttliche Rettung.
  rationale: Der Parallelismus legt einen Zusammenhang mit der zerstörerischen Rede nahe, benennt ihn aber nicht ausdrücklich. Auch Gott wird nicht als handelndes Subjekt genannt; diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der prägnante Gegensatz und die Bildlichkeit des hebräischen Spruchs bleiben erhalten. ‚Mitmensch‘ gibt die semantische Breite von רֵעַ im heutigen Deutsch besser wieder als das häufig räumlich verstandene ‚Nachbar‘.
