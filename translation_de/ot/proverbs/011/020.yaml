source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה עִקְּשֵׁי לֵ֑ב וּ֝/רְצוֹנ֗/וֹ תְּמִ֣ימֵי דָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/020.yaml
  text: The crooked in heart are an abomination to Yahweh[b][a], but those blameless in their way are his delight.
translation:
  language: de
  text: Menschen mit verkehrtem Herzen sind Jahwe ein Gräuel, doch diejenigen, die auf untadeligem Weg gehen, gefallen ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Untadeligen des Weges“; gemeint sind Menschen, deren Lebensführung ungeteilt und rechtschaffen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: ein Gräuel
  rationale: Die Wendung bewahrt die starke moralische Abscheu des hebräischen Substantivs und die knappe Form des Spruchs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner geläufigen wissenschaftlichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עִקְּשֵׁי לֵב
  choice: Menschen mit einem verkehrten Herzen
  rationale: „Verkehrt“ gibt die moralische Verkrümmung wieder; „Herz“ bewahrt das hebräische Bild für das innere Zentrum von Denken, Wollen und moralischer Ausrichtung.
- source_word: וּרְצוֹנוֹ
  choice: ist sein Wohlgefallen
  rationale: Das Substantiv kann Wohlgefallen, Gefallen oder Gunst bezeichnen. „Sein Wohlgefallen“ erhält den nominalen Gegensatz zu „ein Gräuel“.
- source_word: תְּמִימֵי דָרֶךְ
  choice: wer einen untadeligen Weg geht
  rationale: Die natürliche deutsche Formulierung deutet „Weg“ als Lebensführung, ohne das hebräische Wegbild aufzugeben; תָּמִים bezeichnet dabei Ganzheit, Lauterkeit beziehungsweise Untadeligkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Anthropologische Bedeutung von לֵב
  choice: Herz
  alternative: Inneres
  rationale: „Herz“ wahrt das biblische Bild und umfasst hier nicht nur Gefühle, sondern auch Denken, Wollen und moralische Gesinnung.
- issue: Bedeutungsumfang von רָצוֹן
  choice: Wohlgefallen
  alternative: Gunst
  rationale: Der Kontext stellt Gottes Abscheu seinem positiven Gefallen gegenüber. „Wohlgefallen“ bildet diesen Kontrast ab, ohne die mögliche Nuance göttlicher Gunst völlig auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und die Bilder „Herz“ und „Weg“ bleiben erhalten; der elliptische hebräische Nominalstil wird für natürliche Lesbarkeit behutsam entfaltet.
