id: PRO.11.2
reference: Proverbs 11:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּֽא זָ֭דוֹן וַ/יָּבֹ֣א קָל֑וֹן וְֽ/אֶת צְנוּעִ֥ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/002.yaml
  text: When arrogance comes[a], disgrace comes also, but with the humble is wisdom.
translation:
  language: de
  text: Kommt Überheblichkeit, kommt auch Schande; bei den Bescheidenen aber ist Weisheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wo Vermessenheit hinkommt, da kommt Schmach; bei den Demütigen aber ist Weisheit.“'
    reason: Lexikalische Alternativen für זָדוֹן, קָלוֹן und צְנוּעִים; die Hauptfassung betont Überheblichkeit und Bescheidenheit, während die Alternative die stärkeren Nuancen Vermessenheit, Schmach und Demut sichtbar macht.
lexical_decisions:
- source_word: בָּא
  choice: kommt
  rationale: Das Qal-Perfekt beschreibt in diesem allgemein gültigen Weisheitsspruch einen typischen Zusammenhang; deutsches Präsens gibt dies natürlich wieder.
- source_word: זָדוֹן
  choice: Überheblichkeit
  rationale: Das Substantiv bezeichnet anmaßenden, vermessenen Stolz. „Überheblichkeit“ ist im heutigen Deutsch eindeutig negativ und bildet einen klaren Gegensatz zu den Bescheidenen.
- source_word: וַיָּבֹא
  choice: kommt auch
  rationale: Die Form führt die sprichwörtliche Folge fort. „Kommt auch“ bewahrt die enge Verknüpfung, ohne sie ausdrücklich als starre zeitliche Abfolge festzulegen.
- source_word: קָלוֹן
  choice: Schande
  rationale: Das Wort bezeichnet entehrende, öffentlich wahrnehmbare Beschämung; „Schande“ gibt diesen Sinn knapp und würdig wieder.
- source_word: וְאֶת
  choice: bei ... aber
  rationale: Die Konstruktion drückt Zugehörigkeit oder Begleitung aus. „Bei“ ist im Deutschen natürlich; „aber“ macht den im Parallelismus angelegten Gegensatz sichtbar.
- source_word: צְנוּעִים
  choice: den Bescheidenen
  rationale: Das Wort bezeichnet zurückhaltende, nicht anmaßende Menschen. „Bescheiden“ wahrt die mögliche Nuance von Zurückhaltung und vermeidet, den Begriff ausschließlich als soziale Niedrigkeit zu deuten.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist die übliche und kontextgerechte Wiedergabe. Der nominale Satz bleibt in der knappen Form „ist Weisheit“ erhalten.
theological_decisions: []
translation_notes:
  register: Knapper, antithetischer Weisheitsspruch in modernem, würdigem Standarddeutsch. Die parallele Wiederholung von „kommt“ bildet die hebräische Struktur nach; der Hauptsatz bewahrt den allgemeinen, sprichwörtlichen Charakter.
