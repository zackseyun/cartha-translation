  source_fidelity: Die Übersetzung gibt die beiden parallelen Umstands-/Zeitangaben von בְּטוּב und וּבַאֲבֹד idiomatisch wieder. „Wenn es den Gerechten gut geht“ trifft das Wohlergehen, ohne es auf materiellen Wohlstand zu beschränken; „zugrunde gehen“ gibt אבד angemessen wieder. Die Stadt als personifiziertes, allgemeingültiges Subjekt sowie der kontrastierende öffentliche Jubel bleiben erhalten.
  naturalness: Flüssiges modernes Standarddeutsch mit einem angemessen knappen, sprichwörtlichen Ton. Die Wiederholung von „wenn“ macht die Parallelität verständlich, ohne die Aussage zu überladen. „Erschallt Jubel“ ist leicht gehoben, aber im Spruchstil natürlich.
  terminology: „Gerechte“ und „Frevler“ bilden einen treffenden moralischen Kontrast und vermeiden eine unzulässige juristische oder konfessionelle Einengung. „Jubel“ gibt רִנָּה als hörbaren, in diesem Kontext freudigen Ausruf angemessen wieder.
