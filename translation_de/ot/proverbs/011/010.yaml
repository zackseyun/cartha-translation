source:
  edition: WLC
  text: בְּ/ט֣וּב צַ֭דִּיקִים תַּעֲלֹ֣ץ קִרְיָ֑ה וּ/בַ/אֲבֹ֖ד רְשָׁעִ֣ים רִנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/010.yaml
  text: In the prosperity of the righteous a city rejoices[b][a], and in the perishing of the wicked there is shouting.
translation:
  language: de
  text: Wenn es den Gerechten gut geht, freut sich eine Stadt[a]; und wenn die Frevler zugrunde gehen, erschallt Jubel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Beim Wohlergehen der Gerechten freut sich eine Stadt.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ertönt ein Jubelruf“. Das hebräische Wort bezeichnet einen laut vernehmbaren, meist freudigen Ruf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוּב
  choice: Wenn es ... gut geht
  rationale: Die Verbindung aus ב und טוּב bezeichnet hier den Anlass oder Umstand des Wohlergehens. Die idiomatische Wendung gibt den Sinn wieder, ohne ihn auf materiellen Wohlstand zu verengen.
- source_word: צַדִּיקִים
  choice: den Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die sich recht verhalten; „die Gerechten“ bewahrt die für die Sprüche zentrale moralische Kategorie.
- source_word: תַּעֲלֹץ
  choice: freut sich
  rationale: עלץ bezeichnet lebhafte, jubelnde Freude. „Freut sich“ ist natürlich und verständlich; der Jubelcharakter wird zusätzlich durch den parallelen zweiten Halbvers hörbar.
- source_word: קִרְיָה
  choice: eine Stadt
  rationale: Das artikellose קִרְיָה wird als allgemeingültige, sprichwörtliche Aussage mit „eine Stadt“ wiedergegeben.
- source_word: וּבַאֲבֹד
  choice: und wenn ... zugrunde gehen
  rationale: Die Präposition mit dem Infinitiv constructus führt parallel zum ersten Halbvers einen zeitlichen beziehungsweise anlassbezogenen Umstand ein. „Zugrunde gehen“ lässt offen, auf welche Weise ihr Ende eintritt.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: Das substantivierte Adjektiv bezeichnet schuldhaft und moralisch verwerflich Handelnde. „Frevler“ bildet einen knappen, würdigen Gegenbegriff zu „Gerechten“.
- source_word: רִנָּה
  choice: erschallt Jubel
  rationale: רִנָּה bezeichnet einen weithin hörbaren Ruf, häufig einen Freuden- oder Jubelruf. „Erschallt Jubel“ wahrt sowohl die akustische als auch die freudige Nuance.
theological_decisions:
- issue: Freude über den Untergang der Frevler
  choice: Die scharfe Aussage bleibt unverändert als öffentliche Reaktion der Stadt stehen.
  alternative: Die Freude ausdrücklich als Freude über wiederhergestellte Gerechtigkeit erklären.
  rationale: Der hebräische Text nennt keine Begründung und mildert die Spannung nicht; eine erklärende Ergänzung würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-sprichwörtlichem Klang. Die parallele Wenn-Struktur bildet die beiden Halbverse klar ab; „Frevler“ hält den moralischen Gegensatz knapp und vermeidet eine unnötige juristische Verengung.
