id: PRO.11.4
reference: Proverbs 11:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא יוֹעִ֣יל ה֭וֹן בְּ/י֣וֹם עֶבְרָ֑ה וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/004.yaml
  text: Wealth is of no use on the day of wrath[c][b][a], but righteousness delivers from death.
translation:
  language: de
  text: Reichtum nützt nichts am Tag des Zorns[a], doch Gerechtigkeit rettet vor dem Tod[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '»Der Tag des Zorns« kann allgemein eine Zeit des Gerichts oder schweren Unheils bezeichnen; der Spruch legt dies nicht näher fest. Möglich ist auch: »an einem Tag des Zorns«.'
    reason: alternative_reading
  - marker: b
    text: »Gerechtigkeit« kann in Weisheitstexten auch Rechtschaffenheit, gerechtes Handeln oder rechtes Verhalten bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: Reichtum
  rationale: Das Wort bezeichnet materiellen Besitz oder Wohlstand. »Reichtum« ist im modernen Deutschen natürlich und bewahrt die allgemeine Bedeutung.
- source_word: יוֹעִיל
  choice: nützt nichts
  rationale: Das Hifil von יעל bedeutet »nützen«, »Vorteil bringen« oder »von Nutzen sein«. Die Formulierung gibt die Verneinung knapp und idiomatisch wieder.
- source_word: בְּיוֹם עֶבְרָה
  choice: am Tag des Zorns
  rationale: Die Präposition בְּ kennzeichnet den Zeitpunkt; עֶבְרָה bezeichnet Zorn oder heftigen Grimm. Die bestimmte Wendung wird beibehalten, ohne den Tag näher heilsgeschichtlich festzulegen.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: צְדָקָה kann Gerechtigkeit, Rechtschaffenheit oder rechtes Handeln bezeichnen. »Gerechtigkeit« wahrt die Breite des Begriffs und ist in einem Weisheitsspruch verständlich.
- source_word: תַּצִּיל
  choice: rettet
  rationale: Das Hifil von נצל bedeutet retten, entreißen oder befreien. »Rettet« ist prägnant und bildet den Gegensatz zur Nutzlosigkeit des Reichtums klar ab.
- source_word: מִמָּוֶת
  choice: vor dem Tod
  rationale: Wörtlich steht »vom Tod«. Im Deutschen ist »vor dem Tod retten« die natürliche Verbindung und bewahrt den direkten Sinn.
theological_decisions:
- issue: Bedeutung von »Tag des Zorns«
  choice: Ein entscheidender Zeitpunkt des Zorns beziehungsweise Gerichts, ohne nähere Festlegung
  alternative: Ein Tag menschlicher Katastrophe oder ausdrücklich der endzeitliche Tag des göttlichen Gerichts
  rationale: Der hebräische Wortlaut lässt sowohl einen allgemeinen Zeitpunkt des Gerichts oder Unheils als auch eine weitergehende eschatologische Deutung zu. Die Übersetzung legt sich nicht auf ein späteres Lehrschema fest.
- issue: Aussage »Gerechtigkeit rettet vor dem Tod«
  choice: Der Spruch stellt Gerechtigkeit innerhalb der Weisheitstheologie als lebensrettend dar
  alternative: Rechtes Verhalten bewahrt praktisch vor tödlichen Folgen oder bundesgemäße Gerechtigkeit führt zu göttlicher Rettung
  rationale: Der Satz soll nicht in eine spätere technische Erlösungs- oder Rechtfertigungslehre überführt werden. Seine zugespitzte Aussage bleibt stehen.
translation_notes:
  register: Moderner, würdevoller Weisheitsstil mit knapper antithetischer Parallelität. Die traditionelle Wendung »Tag des Zorns« bleibt erhalten, wird aber durch die Fußnote nicht auf eine bestimmte eschatologische Deutung verengt.
