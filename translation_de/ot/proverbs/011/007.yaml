- from: Wenn ein gottloser Mensch stirbt, vergeht seine Hoffnung, und die Erwartung, die auf Kraft beruht,[a] geht zugrunde.
  to: Wenn ein gottloser Mensch stirbt, vergeht seine Hoffnung, und die Erwartung auf Kraft[a] geht zugrunde.
