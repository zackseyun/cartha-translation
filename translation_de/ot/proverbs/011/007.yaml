source:
  edition: WLC
  text: בְּ/מ֤וֹת אָדָ֣ם רָ֭שָׁע תֹּאבַ֣ד תִּקְוָ֑ה וְ/תוֹחֶ֖לֶת אוֹנִ֣ים אָבָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/007.yaml
  text: When a wicked man dies[a], his hope perishes, and the expectation of wealth comes to nothing.
translation:
  language: de
  text: Wenn ein gottloser Mensch stirbt, vergeht seine Hoffnung, und die Erwartung auf Kraft[a] geht zugrunde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Erwartung der Starken geht zugrunde“. Das hebräische Wort ist schwierig und kann Kraft oder Macht, starke Menschen oder möglicherweise Vermögen/Reichtum bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמוֹת
  choice: Wenn … stirbt
  rationale: Die Präposition ב mit dem Infinitivus constructus von מות bildet einen Temporalsatz; diese Wiedergabe ist im Deutschen natürlich und genau.
- source_word: אָדָם רָשָׁע
  choice: ein gottloser Mensch
  rationale: אָדָם bezeichnet hier einen einzelnen Menschen als weisheitliche Beispielgestalt. „Mensch“ bewahrt den individuellen Bezug, während „gottlos“ den in den Sprüchen üblichen moralisch-religiösen Gegensatz von רָשָׁע zum Gerechten ausdrückt.
- source_word: תֹּאבַד תִּקְוָה
  choice: vergeht seine Hoffnung
  rationale: אבד bezeichnet Untergang oder Verlust; „vergeht“ passt zum Todeskontext und zum gehobenen deutschen Spruchstil.
- source_word: וְתוֹחֶלֶת
  choice: und die Erwartung
  rationale: תוחלת steht parallel zu תקוה, bleibt aber durch „Erwartung“ als nahes, nicht identisches Synonym erkennbar.
- source_word: אוֹנִים
  choice: die auf Kraft beruht
  rationale: Die schwierige Form wird primär auf אוֹן im Sinn von Kraft oder Macht bezogen. Die relationale Formulierung macht den deutschen Satz verständlich, ohne den Ausdruck auf Körperkraft, Reichtum oder mächtige Personen einzuengen.
- source_word: אָבָדָה
  choice: geht zugrunde
  rationale: Das zweite אבד wird zur Wahrung der Parallelität mit einem verwandten, aber nicht identischen deutschen Ausdruck wiedergegeben.
theological_decisions:
- issue: Wiedergabe von אָדָם
  choice: Mensch
  alternative: Mann
  rationale: Der hebräische Ausdruck bezeichnet eine einzelne menschliche Person, ohne dass das Geschlecht für die Aussage entscheidend ist. „Mensch“ ist im modernen Deutschen natürlich und erweitert den Geltungsbereich nicht über den Quelltext hinaus.
- issue: Deutung von אוֹנִים
  choice: Kraft
  alternative: die Starken; Vermögen/Reichtum
  rationale: Die Form ist lexikalisch unsicher. Der Bezug auf Kraft beziehungsweise Macht liegt nahe; die mögliche personale Deutung wird in der Fußnote bewahrt. „Reichtum“ wäre stärker interpretierend und wird deshalb nicht in den Haupttext aufgenommen.
translation_notes:
  register: Moderner, würdiger Spruchstil mit klarer Parallelstruktur. „Gottlos“ ist in der deutschen Weisheitssprache geläufig; die ungewöhnliche Wendung zur Kraft bewahrt die Unsicherheit des hebräischen Ausdrucks und wird durch die Fußnote erläutert.
