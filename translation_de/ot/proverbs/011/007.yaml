review_pass:
  verdict: revise
  source_fidelity: Die erste Vershälfte ist treffend wiedergegeben. Für וְתוֹחֶלֶת אוֹנִים ist „Kraft/Macht“ als mögliche Grunddeutung vertretbar; die Formulierung „die auf Kraft beruht“ legt jedoch eine im Hebräischen nicht ausdrücklich enthaltene Begründungsrelation fest. Die lexikalische Schwierigkeit und die mögliche personale Deutung sollen im Haupttext möglichst offen bleiben und in der Fußnote erläutert werden.
  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. „Die Erwartung auf Kraft“ ist etwas weniger idiomatisch als „Hoffnung auf Kraft“, bewahrt aber die vom Hebräischen gesetzte Variation zwischen Hoffnung und Erwartung. Die revidierte Fassung ist klarer als die Relativkonstruktion.
  terminology: „Gottloser Mensch“ gibt רָשָׁע im weisheitlichen und moralischen Register angemessen wieder. „Hoffnung“ und „Erwartung“ bilden die Parallelität von תִּקְוָה und תּוֹחֶלֶת nachvollziehbar ab. Die Fußnote wahrt die relevante Alternative „der Starken“ und ergänzt die im englischen Audit belegte, ebenfalls mögliche Deutung im Bereich Vermögen/Reichtum, ohne sie als Haupttext festzulegen.
  issues:
  - severity: medium
    issue: Die Wendung „die auf Kraft beruht“ expliziert die syntaktisch-semantische Beziehung von תּוֹחֶלֶת zu אוֹנִים.
    rationale: Der hebräische Nominalausdruck benennt keine ausdrückliche Kausalrelation. „Beruht auf“ kann die Erwartung als durch Kraft begründet darstellen, während auch eine Erwartung auf Kraft, die Erwartung der Starken oder eine auf Vermögen bezogene Deutung möglich ist.
  - severity: low
    issue: Die Fußnote nennt die mögliche Deutung im Sinn von Vermögen/Reichtum nicht.
    rationale: Die englische Prüfspur dokumentiert diese lexikalische Möglichkeit. Ihre Nennung hilft, die Schwierigkeit von אוֹנִים transparent zu machen, ohne eine umstrittene Lesart zu bevorzugen.
