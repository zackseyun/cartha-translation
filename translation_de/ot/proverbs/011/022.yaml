  text: נֶ֣זֶם זָ֭הָב בְּ/אַ֣ף חֲזִ֑יר אִשָּׁ֥ה יָ֝פָ֗ה וְ/סָ֣רַת טָֽעַם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/022.yaml
  text: Like a gold ring in a pig’s snout is a beautiful woman who lacks discretion[a].
translation:
  language: de
  text: Wie ein goldener Ring im Rüssel eines Schweins ist eine schöne Frau, der es an Urteilsvermögen fehlt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie ein goldener Nasenring im Rüssel eines Schweins ist eine schöne Frau ohne gesunden Menschenverstand.“'
    reason: Lexikalische Alternative für נֶזֶם und וְסָרַת טָעַם.
lexical_decisions:
- source_word: נֶזֶם
  choice: Ring
  rationale: נֶזֶם bezeichnet einen Schmuckring, häufig einen Nasenring. Da der folgende Ausdruck ihn ausdrücklich im Rüssel verortet, ist „Ring“ natürlich und ausreichend präzise.
- source_word: זָהָב
  choice: golden
  rationale: Die Materialangabe wird idiomatisch als Adjektiv wiedergegeben und bewahrt den Kontrast zwischen kostbarem Schmuck und Schwein.
- source_word: בְּאַף חֲזִיר
  choice: im Rüssel eines Schweins
  rationale: אַף bezeichnet hier konkret die Nase; bei einem Schwein ist „Rüssel“ die natürliche deutsche Bezeichnung und erhält das anschauliche Bild.
- source_word: אִשָּׁה יָפָה
  choice: eine schöne Frau
  rationale: Ohne ehelichen Kontext bedeutet אִשָּׁה hier „Frau“; יָפָה bezeichnet ihre körperliche Schönheit.
- source_word: וְסָרַת טָעַם
  choice: der es an Urteilsvermögen fehlt
  rationale: Die Wendung beschreibt wörtlich eine Frau, die sich von טַעַם abgewandt hat. Im weisheitlichen Zusammenhang meint טַעַם vernünftiges Urteilen, Einsicht oder guten Sinn; „Urteilsvermögen“ gibt diese moralisch-intellektuelle Dimension klar wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der knappe Vergleich und sein bewusst scharfer Kontrast bleiben erhalten; die deutsche Satzstellung macht deutlich, dass das fehlende Urteilsvermögen die schöne Frau charakterisiert.
