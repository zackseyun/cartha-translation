  text: נֶֽפֶשׁ בְּרָכָ֥ה תְדֻשָּׁ֑ן וּ֝/מַרְוֶ֗ה גַּם ה֥וּא יוֹרֶֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/025.yaml
  text: A generous person will be enriched[b][a], and whoever refreshes others will himself be refreshed.
translation:
  language: de
  text: Wer großzügig ist, wird reichlich versorgt,[a] und wer anderen Erfrischung schenkt, wird selbst erfrischt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Eine Seele des Segens wird fett gemacht.“ Das hebräische Bild bezeichnet Fülle, gute Versorgung und Gedeihen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Wer tränkt, wird auch selbst getränkt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ בְּרָכָה
  choice: wer großzügig ist
  rationale: Die Verbindung bezeichnet idiomatisch einen Menschen, der für andere zum Segen wird. Die deutsche Formulierung gibt diese ethische Bedeutung natürlich wieder, ohne נֶפֶשׁ unnötig als einen vom Menschen getrennten Seelenteil zu verstehen.
- source_word: תְדֻשָּׁן
  choice: wird reichlich versorgt
  rationale: Das Pual von דשׁן zeichnet ein Bild von Fülle, Gedeihen und guter Versorgung. „Reichlich versorgt“ bewahrt den Gedanken empfangener Fülle, vermeidet aber die im heutigen Deutsch missverständliche wörtliche Rede vom Fettwerden.
- source_word: וּמַרְוֶה
  choice: wer andere erquickt
  rationale: Das Hiphil-Partizip von רוה meint wörtlich jemanden, der tränkt beziehungsweise zu trinken gibt. „Andere erquickt“ vermittelt die übertragene Bedeutung und lässt zugleich das Wasserbild anklingen.
- source_word: גַּם הוּא יוֹרֶא
  choice: wird auch selbst erquickt
  rationale: 'Die traditionelle Lesart versteht die Form im parallelen zweiten Halbvers reziprok: Wer anderen Erquickung verschafft, empfängt sie ebenfalls. „Auch selbst“ gibt die Hervorhebung von גַּם הוּא wieder.'
theological_decisions:
- issue: Art der zugesagten Fülle
  choice: Die Aussage bleibt allgemein und bezeichnet reichliche Versorgung beziehungsweise Gedeihen.
  alternative: Eine ausdrückliche Verheißung materiellen Reichtums.
  rationale: Das hebräische Bild umfasst Fülle und Wohlergehen, legt aber nicht eindeutig ausschließlich finanziellen Wohlstand fest. Die Übersetzung vermeidet daher eine Verengung auf Geld oder Besitz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des hebräischen Spruchs bleibt erhalten. „Erquicken“ ist leicht gehoben, aber allgemein verständlich und bewahrt das zugrunde liegende Bild des Tränkens besser als rein abstrakte Alternativen.
