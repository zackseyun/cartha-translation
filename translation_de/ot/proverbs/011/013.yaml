- from: Wer als Verleumder umherzieht, verrät Vertrauliches[a]; wer aber einen zuverlässigen Geist hat[b], hält eine Sache verborgen.
  to: Wer Klatsch verbreitet, verrät ein Geheimnis; wer aber treuen Geistes ist, behält eine Sache für sich.
  rationale: Die Revision ersetzt die zu spezifische Bezeichnung „Verleumder“ durch die weiter gefasste, kontextgerechte Formulierung „Klatsch verbreitet“. Die zweite Zeile wird näher am hebräischen Ausdruck und zugleich idiomatischer formuliert. Die bisherigen Fußnoten entfallen, weil die revidierte Übersetzung keine erläuterungsbedürftige lexikalische Alternative mehr in den Text auslagert und „treuen Geistes“ bereits die wörtlich relevante Formulierung bietet.
