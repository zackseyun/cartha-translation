  text: הוֹלֵ֣ךְ רָ֭כִיל מְגַלֶּה סּ֑וֹד וְ/נֶאֱמַן ר֝֗וּחַ מְכַסֶּ֥ה דָבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/013.yaml
  text: A gossip reveals a secret[b][a], but one who is faithful in spirit conceals a matter.
translation:
  language: de
  text: Wer Klatsch verbreitet, verrät ein Geheimnis; wer aber treuen Geistes ist, behält eine Sache für sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹלֵךְ רָכִיל
  choice: Wer als Verleumder umherzieht
  rationale: Die Wendung bewahrt das Bild des Umhergehens und bezeichnet jemanden, der schädigendes Gerede weiterträgt. „Verleumder“ ist im Deutschen würdig und sprichworttauglich, kann jedoch über nachweislich falsche Aussagen hinaus auch den ehrverletzenden Zuträger bezeichnen.
- source_word: מְגַלֶּה
  choice: verrät
  rationale: Bei vertraulichen Informationen gibt „verrät“ das Bekanntmachen idiomatisch wieder und lässt zugleich den Treuebruch im Parallelismus hervortreten.
- source_word: סּוֹד
  choice: Vertrauliches
  rationale: סוד kann Geheimnis, vertrauliche Mitteilung oder vertrauten Rat bezeichnen. „Vertrauliches“ hält den Bezug allgemein und passt natürlich zum Verraten.
- source_word: נֶאֱמַן רוּחַ
  choice: wer einen zuverlässigen Geist hat
  rationale: Die Übersetzung erhält ausdrücklich רוּחַ („Geist“) und gibt נֶאֱמַן als innere Zuverlässigkeit wieder, ohne die Wendung lediglich zu „ein vertrauenswürdiger Mensch“ zu glätten.
- source_word: מְכַסֶּה
  choice: hält … verborgen
  rationale: Die Formulierung vermittelt die bildliche Bedeutung von „bedecken“ als Nichtoffenlegen, ohne im Deutschen ein missverständliches „deckt eine Sache zu“ zu verwenden.
- source_word: דָבָר
  choice: eine Sache
  rationale: דָבָר ist bewusst weit und kann Sache, Angelegenheit oder Wort bedeuten. „Eine Sache“ bewahrt diese Allgemeinheit.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Spruchstil mit klarer Gegenüberstellung. Das hebräische Bild des Umherziehens sowie der ausdrückliche Bezug auf den „Geist“ bleiben erhalten; die Verben sind für heutiges Deutsch idiomatisch gefasst.
