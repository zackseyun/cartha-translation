  text: פְּֽרִי צַ֭דִּיק עֵ֣ץ חַיִּ֑ים וְ/לֹקֵ֖חַ נְפָשׂ֣וֹת חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/030.yaml
  text: The fruit of the righteous is a tree of life[a], and he who wins souls is wise.
translation:
  language: de
  text: Die Frucht des Gerechten ist ein Baum des Lebens, und wer Menschen gewinnt[a], ist weise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wer Menschen (oder Leben) nimmt“. Die hebräische Wendung ist nicht eindeutig; sie kann im Kontext das Gewinnen von Menschen meinen, kann aber auch offener als „nehmen“ verstanden werden. Grammatisch ist auch möglich: „Und ein Weiser nimmt Menschen (oder Leben).“'
    reason: Lexikalische und syntaktische Alternative im hebräischen Text.
lexical_decisions:
- source_word: פְּרִי
  choice: Frucht
  rationale: „Frucht“ bewahrt das Bild und kann sowohl Ertrag als auch Wirkung des Lebenswandels bezeichnen.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Das substantivierte Adjektiv steht im Hebräischen im Singular und bezeichnet repräsentativ einen gerechten Menschen.
- source_word: עֵץ חַיִּים
  choice: ein Baum des Lebens
  rationale: Die Formulierung bewahrt den in den Sprüchen und in Genesis anklingenden festen Bildausdruck, ohne ihn vorschnell als bloß „lebensspendend“ aufzulösen.
- source_word: וְלֹקֵחַ
  choice: und wer … gewinnt
  rationale: Das Partizip von לקח bedeutet wörtlich „nehmen“. In Verbindung mit Personen kann „gewinnen“ das Gewinnen von Menschen beziehungsweise Einfluss auf sie ausdrücken; die wörtlichere, offenere Lesart wird in der Fußnote erhalten.
- source_word: נְפָשׂוֹת
  choice: Menschen
  rationale: נפשׁ bezeichnet hier nicht zwingend eine vom Körper getrennte „Seele“, sondern kann Menschen, Personen oder Leben meinen. „Menschen“ ist im modernen Deutsch verständlich und vermeidet eine unnötige anthropologische Festlegung.
- source_word: חָכָם
  choice: ist weise
  rationale: Das Adjektiv wird prädikativ wiedergegeben; die knappe Form entspricht dem Spruchstil.
theological_decisions:
- issue: Bedeutung von „Menschen gewinnen“ im Weisheitskontext
  choice: Als weises Gewinnen von Menschen beziehungsweise Einfluss auf sie wiedergegeben, ohne ausdrücklich Bekehrung oder Evangelisation zu meinen.
  alternative: '„Wer Menschen/Leben nimmt, ist weise“; grammatisch auch: „Ein Weiser gewinnt Menschen.“'
  rationale: Der hebräische Wortlaut verwendet „nehmen“ mit נפשות und legt keine spezifisch spätere christliche Kategorie fest. Zugleich bleibt die syntaktische Zuordnung von חָכָם grundsätzlich offen; die Hauptfassung folgt der traditionellen prädikativen Deutung, während die Fußnote die lexikalische Spannung wahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Satzform. „Baum des Lebens“ wahrt die biblische Bildsprache; „Menschen“ ist gegenüber „Seelen“ im heutigen Deutsch semantisch genauer, während die Fußnote die Mehrdeutigkeit offenlegt.
