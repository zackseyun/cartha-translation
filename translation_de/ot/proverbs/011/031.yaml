source:
  edition: WLC
  text: הֵ֣ן צַ֭דִּיק בָּ/אָ֣רֶץ יְשֻׁלָּ֑ם אַ֝֗ף כִּֽי רָשָׁ֥ע וְ/חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/031.yaml
  text: Look[a], if the righteous is repaid on earth, how much more the wicked and the sinner.
translation:
  language: de
  text: 'Gewiss[a]: Dem Gerechten wird auf der Erde vergolten – wie viel mehr dem Gottlosen und dem Sünder!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Siehe: Dem Gerechten wird im Land vergolten.“ Das Hebräische kann auch förmlicher wiedergegeben werden: „Siehe, dem Gerechten wird auf der Erde/im Land vergolten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Der Ausdruck lenkt nachdrücklich die Aufmerksamkeit auf die folgende Aussage. „Sieh“ bewahrt diese Wirkung in würdigem, verständlichem Deutsch; auch „Gewiss“ ist möglich.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv bezeichnet hier einen repräsentativen gerechten Menschen und wird mit der im Deutschen üblichen Weisheitsliteratur-Formulierung wiedergegeben.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Der allgemeine Weisheitsspruch legt „Erde“ nahe, doch die Alternative „im Land“ bleibt in der Fußnote erhalten.
- source_word: יְשֻׁלָּם
  choice: seinen Lohn empfängt
  rationale: Das Pual von שלם bezeichnet, dass jemand das ihm Entsprechende vergolten oder zugeteilt bekommt. „Seinen Lohn empfängt“ ist natürliches Deutsch, wobei „Lohn“ hier nicht ausschließlich positive Belohnung meint; die Fußnote verdeutlicht die breitere Bedeutung.
- source_word: אַף כִּי
  choice: wie viel mehr
  rationale: Die Verbindung kennzeichnet einen Schluss vom geringeren auf den stärkeren Fall und wird im Deutschen idiomatisch mit „wie viel mehr“ ausgedrückt.
- source_word: רָשָׁע
  choice: der Gottlose
  rationale: „Der Gottlose“ ist eine etablierte, würdige Wiedergabe des substantivierten Adjektivs in der Weisheitsliteratur und bezeichnet den moralisch schuldigen Menschen, nicht bloß jemanden ohne religiöse Überzeugung.
- source_word: וְחוֹטֵא
  choice: und der Sünder
  rationale: Das substantivierte Partizip bezeichnet einen Menschen, der durch Sünde gekennzeichnet ist, und wahrt die hebräische Paarung mit „der Gottlose“.
theological_decisions:
- issue: Art der Vergeltung für den Gerechten
  choice: Die Formulierung lässt offen, ob der Gerechte Belohnung, leidvolle Zurechtweisung oder allgemein die ihm entsprechende Vergeltung erfährt.
  alternative: „Der Gerechte wird auf der Erde belohnt“ oder „Der Gerechte wird auf der Erde bestraft“.
  rationale: Das hebräische Verb legt nicht eindeutig ausschließlich positive Belohnung oder ausschließlich Strafe fest. Diese Spannung darf nicht durch eine engere Deutung beseitigt werden.
- issue: Bedeutungsumfang von אֶרֶץ
  choice: „auf der Erde“ als allgemeiner Lebensbereich des Menschen
  alternative: „im Land“, möglicherweise mit besonderem Bezug auf Israel
  rationale: Der sprichwörtliche Zusammenhang begünstigt eine allgemeine Aussage, doch der hebräische Ausdruck bleibt mehrdeutig; daher wird die Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die a-fortiori-Struktur bleibt deutlich. Die Fußnote bewahrt sowohl die emphatische Alternative für הֵן als auch die Mehrdeutigkeit von אֶרֶץ und den breiten Sinn der Vergeltung.
