base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/011.yaml
  text: By the blessing of the upright a city is exalted[b][a], but by the mouth of the wicked it is torn down.
translation:
  language: de
  text: Durch den Segen der Aufrichtigen kommt eine Stadt zu Ansehen[a], doch durch den Mund der Frevler wird sie niedergerissen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Durch den Segen der Aufrichtigen erhebt sich eine Stadt«; wörtlich im Bild des Emporsteigens bzw. Erhöhtwerdens.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Bild »durch den Mund der Frevler« hebt die zerstörerische Macht böser Rede hervor.
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/בִרְכַּת
  choice: Durch den Segen
  rationale: 'Die Präposition בְּ bezeichnet hier wahrscheinlich das Mittel: Der Segen beziehungsweise das segensreiche Wirken der Aufrichtigen fördert die Stadt.'
- source_word: יְשָׁרִים
  choice: der Aufrichtigen
  rationale: יְשָׁרִים bezeichnet Menschen von geradem, rechtschaffenem Charakter. „Aufrichtige“ bewahrt das Bild und ist in deutscher Weisheitsliteratur natürlich.
- source_word: תָּרוּם
  choice: kommt … zu Ansehen
  rationale: Das Verb רוּם bedeutet wörtlich „hoch sein/werden“. Im Blick auf eine Stadt bezeichnet es hier wahrscheinlich gesellschaftliches Gedeihen oder hohes Ansehen; die Formulierung gibt dies in verständlichem Deutsch wieder, ohne das Höhenbild ganz auf eine materielle Bedeutung festzulegen.
- source_word: קָרֶת
  choice: eine Stadt
  rationale: קָרֶת bezeichnet eine Stadt oder Ortschaft; „Stadt“ ist die übliche und dem gesellschaftlichen Umfang des Spruchs angemessene Wiedergabe.
- source_word: וּ/בְ/פִי
  choice: doch durch den Mund
  rationale: וּ markiert den Gegensatz, בְּ das Mittel. „Mund“ bewahrt das hebräische Bild für die zerstörerische Macht der Rede.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: רְשָׁעִים bezeichnet in den Sprüchen moralisch schuldige, gottlose Menschen. „Frevler“ ist prägnant, würdig und stärker ethisch geprägt als das allgemeinere „Böse“.
- source_word: תֵּהָרֵס
  choice: wird sie niedergerissen
  rationale: Der Niphal von הרס bezeichnet das Niedergerissen- oder Zerstörtwerden. Das Passiv und das bauliche Gegenbild zur Erhöhung bleiben erhalten; „sie“ bezieht sich eindeutig auf die Stadt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Spruchstruktur. Der parallele Gegensatz „durch den Segen … / durch den Mund …“ und das hebräische Mundbild bleiben erhalten; die bildhafte Erhöhung wird im Haupttext idiomatisch als Gewinn an Ansehen ausgedrückt und in der Fußnote wörtlicher dokumentiert.
