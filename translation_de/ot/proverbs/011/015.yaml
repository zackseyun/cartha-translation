    rationale: Ohne Erläuterung bezeichnet »Handschlag« gewöhnlich eine Begrüßungs- oder allgemeine Einigungsgeste. Das hebräische Idiom bezieht sich spezifisch auf das Einschlagen der Hände zur Bekräftigung einer Bürgschaft beziehungsweise Verpflichtung.
