id: PRO.11.15
reference: Proverbs 11:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רַע יֵ֭רוֹעַ כִּי עָ֣רַב זָ֑ר וְ/שֹׂנֵ֖א תֹקְעִ֣ים בּוֹטֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/015.yaml
  text: He will surely suffer harm who becomes surety for a stranger[b][a], but whoever hates striking hands is secure.
translation:
  language: de
  text: Wer für einen Fremden bürgt, erleidet gewiss Schaden; wer aber das Einschlagen der Hände[a] hasst, ist sicher.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Einschlagen der Hände« – eine Geste, mit der eine Zusage oder Bürgschaft bekräftigt wurde.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »Wer Bürgschaften verabscheut, ist sicher.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע יֵרוֹעַ
  choice: wird gewiss Schaden erleiden
  rationale: Die Verbindung warnt nachdrücklich vor einem schlimmen Ausgang; sie bezeichnet hier nicht moralische Bosheit, sondern drohenden Schaden.
- source_word: כִּי
  choice: wer …
  rationale: Im Zusammenhang kennzeichnet die Partikel denjenigen beziehungsweise den Umstand, auf den die Warnung zutrifft; die deutsche Wer-Konstruktion gibt den sprichwörtlichen Satz natürlich wieder, ohne ein ausdrückliches »wenn« einzuführen.
- source_word: עָרַב
  choice: bürgt
  rationale: Das Verb bezeichnet das persönliche Einstehen als Bürge für die Verpflichtung eines anderen.
- source_word: זָר
  choice: für einen Fremden
  rationale: Gemeint ist ein Außenstehender beziehungsweise eine nicht nahestehende Person, nicht zwingend ein Ausländer.
- source_word: שֹׂנֵא
  choice: hasst
  rationale: Die starke Formulierung des Hebräischen wird bewahrt und drückt entschiedene Abneigung aus.
- source_word: תֹקְעִים
  choice: den Handschlag
  rationale: Das Wort verweist verkürzt auf das Einschlagen der Hände als Geste, mit der eine Bürgschaft oder Zusage bekräftigt wurde. Der Singular ist im Deutschen idiomatisch.
- source_word: בּוֹטֵחַ
  choice: ist sicher
  rationale: Das Prädikat bezeichnet Sicherheit vor dem unmittelbar zuvor beschriebenen finanziellen Risiko.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Spruchsprache in modernem Standarddeutsch. »Bürgen« wahrt den rechtlich-finanziellen Sinn; »Handschlag« erhält das konkrete Bild, dessen historische Bedeutung in der Fußnote erläutert wird.
