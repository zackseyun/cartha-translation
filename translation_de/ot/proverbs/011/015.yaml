revisions:
- from: Wer für einen Fremden bürgt, wird gewiss Schaden erleiden; doch wer den Handschlag[a] hasst, ist sicher.[b]
  to: Wer für einen Fremden bürgt, erleidet gewiss Schaden; wer aber das Einschlagen der Hände[a] hasst, ist sicher.[b]
  rationale: Die Änderung ersetzt das mehrdeutige »Handschlag« durch die dem hebräischen תֹקְעִים entsprechende konkrete Geste. Dadurch bleibt das Bild erhalten, während die Fußnote den geschichtlichen und rechtlichen Zusammenhang knapp erklärt. Der übrige Wortlaut ist quellentreu und für modernes Standarddeutsch geeignet.
