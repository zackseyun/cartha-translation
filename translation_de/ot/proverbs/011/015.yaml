review_pass:
  verdict: revise
  source_fidelity: 'Die erste Zeile gibt רַע יֵרוֹעַ und עָרַב זָר treffend wieder: Wer für einen Außenstehenden bürgt, muss mit ernsthaftem Schaden rechnen. Auch die zweite Zeile bewahrt die starke Haltung von שֹׂנֵא und die Sicherheit von בּוֹטֵחַ. »Handschlag« allein kann im heutigen Deutsch jedoch leicht als gewöhnliche Begrüßung verstanden werden und verdeckt die im Hebräischen gemeinte Bekräftigung einer Verpflichtung.'
  naturalness: Die Spruchform ist knapp und idiomatisch. »Das Einschlagen der Hände« ist zwar bewusst konkret und leicht archaisch, wird aber durch die Fußnote verständlich und ist für die historische Rechtsgeste genauer als »Handschlag«.
  terminology: »Bürgt« bewahrt die rechtlich-finanzielle Bedeutung von עָרַב. »Fremden« ist hier passend, da זָר einen nicht nahestehenden Außenstehenden meint, nicht notwendigerweise einen ethnischen Ausländer. Die alternative Deutung als Ablehnung von Bürgschaften bleibt als Fußnote sinnvoll.
  issues:
