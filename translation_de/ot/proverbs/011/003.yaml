source:
  edition: WLC
  text: תֻּמַּ֣ת יְשָׁרִ֣ים תַּנְחֵ֑/ם וְ/סֶ֖לֶף בּוֹגְדִ֣ים ו/שד/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/003.yaml
  text: The integrity of the upright guides them[b][a], but the crookedness of the treacherous destroys them.
translation:
  language: de
  text: Die Lauterkeit der Aufrichtigen leitet sie, doch die Verkehrtheit der Treulosen richtet sie zugrunde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »doch die Verdrehtheit der Treulosen vernichtet sie.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֻּמַּת
  choice: Lauterkeit
  rationale: Das von תם abgeleitete Substantiv bezeichnet hier charakterliche Ganzheit und moralische Integrität. »Lauterkeit« gibt dies würdig und verständlich wieder, ohne Sündlosigkeit zu unterstellen.
- source_word: יְשָׁרִים
  choice: die Aufrichtigen
  rationale: יָשָׁר bezeichnet im Weisheitskontext moralisch gerade, rechtschaffene Menschen. »Die Aufrichtigen« bewahrt zugleich den bildhaften Gegensatz zur Verdrehtheit.
- source_word: תַּנְחֵם
  choice: leitet sie
  rationale: Der Hifil von נחה bedeutet führen oder leiten. »Leitet sie« bezeichnet hier die ethische Orientierung, die aus einem lauteren Charakter hervorgeht.
- source_word: סֶלֶף
  choice: Verdrehtheit
  rationale: סֶלֶף bezeichnet Verdrehung oder moralische Verkehrtheit. »Verdrehtheit« erhält das konkrete Bild und bildet einen klaren Gegensatz zu den »Aufrichtigen«.
- source_word: בּוֹגְדִים
  choice: die Treulosen
  rationale: Das Partizip bezeichnet Menschen, die vertragsbrüchig, untreu oder verräterisch handeln. »Die Treulosen« eignet sich für die allgemeine Weisheitsaussage besser als das engere »Verräter«.
- source_word: וְשָׁדָם
  choice: richtet sie zugrunde
  rationale: 'Die Form wird im Kontext als Aussage des Zerstörens oder Zugrunderichtens verstanden. Die deutsche Wendung ist natürlich und bewahrt die zugespitzte Folge: Die eigene Verdrehtheit bringt die Treulosen ins Verderben.'
theological_decisions: []
translation_notes:
  register: Moderne, würdige Weisheitssprache mit ausgewogenem Parallelismus. »Lauterkeit« vermeidet die mögliche Übertreibung von »Makellosigkeit«; »Verdrehtheit« bewahrt den hebräischen Bildkontrast zu den »Aufrichtigen«.
