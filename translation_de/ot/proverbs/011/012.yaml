source:
  edition: WLC
  text: בָּז לְ/רֵעֵ֥/הוּ חֲסַר לֵ֑ב וְ/אִ֖ישׁ תְּבוּנ֣וֹת יַחֲרִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/012.yaml
  text: Whoever despises his neighbor lacks sense[c][b][a], but a man of understanding keeps silent.
translation:
  language: de
  text: Wer seinen Mitmenschen[a] verachtet, dem fehlt es an Verstand[b]; doch ein verständiger Mann[c] schweigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »seinen Nächsten«, »seinen Freund« oder »seinen Gefährten«.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »dem fehlt es an Herz«; »Herz« bezeichnet hier das Vermögen zu urteilen und zu verstehen.'
    reason: lexical_alternative
  - marker: c
    text: Das Hebräische verwendet die maskuline Singularform »Mann« in einem repräsentativen Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: verachtet
  rationale: Das Partizip bezeichnet anhaltendes geringschätziges Verhalten. »verachtet« ist knapp, natürlich und erhält den moralischen Gegensatz des Spruchs.
- source_word: לְרֵעֵהוּ
  choice: seinen Mitmenschen
  rationale: רֵעַ kann »Nächster«, »Freund« oder »Gefährte« bedeuten. »Mitmensch« bewahrt hier den breiten sozialen Bezug, ohne eine enge Freundschaft vorauszusetzen.
- source_word: חֲסַר לֵב
  choice: dem fehlt es an Verstand
  rationale: Wörtlich steht »ohne Herz« bzw. »dem es an Herz fehlt«. לֵב bezeichnet in diesem Zusammenhang das Vermögen zu urteilen und zu verstehen; die idiomatische Wiedergabe vermittelt dies im heutigen Deutsch.
- source_word: וְאִישׁ תְּבוּנוֹת
  choice: doch ein verständiger Mann
  rationale: אִישׁ ist grammatisch maskulin und wird im Spruch repräsentativ gebraucht. Das formal pluralische תְּבוּנוֹת bezeichnet hier Einsicht oder Urteilsvermögen; »verständiger Mann« ist eine natürliche deutsche Wiedergabe.
- source_word: יַחֲרִישׁ
  choice: schweigt
  rationale: Das Verb bezeichnet Schweigen oder Sich-still-Verhalten. Im Gegensatz zur Verachtung bringt »schweigt« die bewusste Zurückhaltung knapp zum Ausdruck.
theological_decisions:
- issue: Repräsentativ-maskuline Sprache in וְאִישׁ
  choice: ein verständiger Mann
  alternative: ein verständiger Mensch / wer verständig ist
  rationale: Die Übersetzung bewahrt die maskuline Singularform des Hebräischen, ohne ihren allgemeinen, sprichwörtlichen Anwendungsbereich auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Gegensatz wird durch »doch« klar markiert; die knappe Form eines Weisheitsspruchs bleibt erhalten. »Mitmensch« vermeidet eine unnötige Verengung auf Freundschaft, während die Fußnote die Bedeutungsbreite dokumentiert.
