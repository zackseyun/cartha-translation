translation:
  language: de
  text: Eine liebenswürdige Frau erlangt Ehre[a], und gewalttätige Männer erlangen Reichtum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Eine Frau von Anmut hält an der Ehre fest … und gewalttätige Männer halten am Reichtum fest.« Das hebräische Verb bedeutet in beiden Satzhälften wörtlich etwa »halten, stützen«; hier hat es wahrscheinlich den Sinn von »sich etwas sichern, etwas erlangen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת חֵן
  choice: eine gütige Frau
  rationale: Die Wendung bezeichnet wörtlich eine »Frau der Gunst/Gnade«. »Gütig« gibt hier eine charakterliche Qualität natürlich wieder, ohne חֵן auf äußerlichen Charme zu verengen.
- source_word: תִּתְמֹךְ
  choice: erlangt
  rationale: תמך bedeutet grundsätzlich »halten, stützen, festhalten«. Im Parallelismus bezeichnet es wahrscheinlich das Erlangen oder Sichern dessen, worauf man Zugriff gewinnt.
- source_word: כָּבוֹד
  choice: Ehre
  rationale: In der Weisheitsliteratur bezeichnet כָּבוֹד häufig gesellschaftliche Ehre oder Ansehen; »Ehre« passt zum Kontrast mit materiellem Reichtum.
- source_word: עָרִיצִים
  choice: gewalttätige Männer
  rationale: Das Wort bezeichnet gewalttätige, rücksichtslose oder unterdrückerische Menschen. »Gewalttätige Männer« bewahrt die konkrete Härte des Ausdrucks, ohne ihn unnötig auf politische Tyrannen zu beschränken.
- source_word: יִתְמְכוּ
  choice: erlangen
  rationale: Dasselbe Verb wie im ersten Versglied wird parallel ebenfalls mit »erlangen« wiedergegeben; dadurch bleibt die formale und gedankliche Entsprechung sichtbar.
- source_word: עֹשֶׁר
  choice: Reichtum
  rationale: Das Substantiv bezeichnet materiellen Wohlstand; »Reichtum« ist die klare und übliche deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Parallelismus des hebräischen Spruchs bleibt erhalten; »aber« macht den inhaltlichen Gegensatz deutlich, der im Hebräischen nur durch die Verbindung der beiden Satzhälften ausgedrückt ist.
