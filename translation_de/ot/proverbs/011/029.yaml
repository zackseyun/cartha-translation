source:
  edition: WLC
  text: עוֹכֵ֣ר בֵּ֭ית/וֹ יִנְחַל ר֑וּחַ וְ/עֶ֥בֶד אֱ֝וִ֗יל לַ/חֲכַם לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/029.yaml
  text: Whoever troubles his own house will inherit wind[b][a], and the fool will be a servant to the wise of heart.
translation:
  language: de
  text: Wer seinem Haus Unheil bringt, wird Wind erben[a], und ein Narr wird dem, der weisen Herzens ist, zum Diener werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Haus“ kann hier auch den eigenen Haushalt oder die eigene Familie bezeichnen. „Wind erben“ ist ein Bild dafür, dass am Ende nichts Greifbares oder Bleibendes bleibt.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹכֵר
  choice: ins Unglück stürzt
  rationale: Das Partizip bezeichnet jemanden, der Unheil oder schwere Not über andere bringt. Die Wendung gibt den aktiven, folgenreichen Sinn wieder, ohne zwingend völlige Zerstörung zu behaupten.
- source_word: בֵּיתוֹ
  choice: sein eigenes Haus
  rationale: „Haus“ bewahrt das hebräische Bild und kann zugleich den Haushalt oder die Familie bezeichnen; „eigenes“ hebt den selbstschädigenden Gegensatz hervor.
- source_word: יִנְחַל
  choice: wird … erben
  rationale: 'Die übliche Bedeutung „erben/in Besitz nehmen“ erhält die Ironie des Spruchs: Als Ertrag bleibt nur Wind.'
- source_word: רוּחַ
  choice: Wind
  rationale: Die konkrete Metapher steht hier für etwas Unbeständiges, Nichtiges oder Vergebliches und sollte nicht im Haupttext auf eine einzige Deutung reduziert werden.
- source_word: וְעֶבֶד
  choice: wird … dienen
  rationale: Die nominale Wendung beschreibt, dass der Narr in ein Dienstverhältnis gerät. Das verbale „dienen“ klingt im Deutschen natürlich und vermeidet die mögliche Überzeichnung durch „Sklave“.
- source_word: אֱוִיל
  choice: ein Narr
  rationale: Das verbreitete Weisheitswort bezeichnet einen moralisch und praktisch uneinsichtigen Menschen; „Narr“ ist prägnant und sprichwörtlich.
- source_word: לַחֲכַם־לֵב
  choice: dem …, der weisen Herzens ist
  rationale: Die Formulierung bewahrt das hebräische Bild des Herzens als Sitz von Einsicht und Urteilskraft und bleibt in gehobenem modernem Deutsch verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrten hebräischen Bildern. Die ungewöhnliche Erbmetapher und „weisen Herzens“ bleiben erhalten; die Fußnote erläutert die beiden eng miteinander verbundenen Mehrdeutigkeiten knapp.
