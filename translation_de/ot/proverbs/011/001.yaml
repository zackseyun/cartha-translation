base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/001.yaml
  text: Dishonest scales are an abomination to Yahweh[a], but a full weight is his delight.
translation:
  language: de
  text: Eine betrügerische Waage ist für Jahwe ein Gräuel, doch ein vollständiger Gewichtsstein[a] gefällt ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein vollständiger Stein“; gemeint ist ein unverkürzter und genauer Gewichtsstein, der im Handel als Normgewicht diente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹאזְנֵי מִרְמָה
  choice: eine betrügerische Waage
  rationale: Die hebräische Genitivverbindung bezeichnet eine zum Betrug dienende beziehungsweise falsch anzeigende Waage. Die singularische Kollektivform ist im Deutschen natürlich und bewahrt das Bild des Handels.
- source_word: תּוֹעֲבַת
  choice: ein Gräuel
  rationale: Das Wort bezeichnet etwas, das entschieden verabscheuungswürdig ist. „Gräuel“ wahrt die starke moralische Wertung und den würdevollen biblischen Ton.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶבֶן שְׁלֵמָה
  choice: ein vollständiges Gewicht
  rationale: אֶבֶן bedeutet wörtlich „Stein“, bezeichnet hier aber einen beim Wiegen verwendeten Gewichtsstein. שְׁלֵמָה hebt dessen Vollständigkeit und damit seine unverfälschte Norm hervor; die Fußnote erläutert das konkrete Bild.
- source_word: רְצוֹנוֹ
  choice: gefällt ihm
  rationale: Das Substantiv kann Wohlgefallen, Gunst oder Gefallen bezeichnen. Die verbale Wiedergabe ist natürliches modernes Deutsch und bildet einen klaren Gegensatz zu „ist für Jahwe ein Gräuel“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ gibt diesen Namen unmittelbar wieder, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung von רְצוֹנוֹ
  choice: gefällt ihm
  alternative: findet seine Gunst; ist sein Wohlgefallen
  rationale: Die Form kann sowohl Gottes Wohlgefallen als auch seine Gunst ausdrücken. Im antithetischen Parallelismus bezeichnet sie am ehesten seine positive Bewertung; „gefällt ihm“ wahrt diese Aussage, ohne eine weitergehende Heilsvorstellung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchton. Der scharfe Gegensatz zwischen betrügerischem Messen und verlässlichem Normgewicht bleibt erhalten.
