  text: צִדְקַ֣ת יְ֭שָׁרִים תַּצִּילֵ֑/ם וּ֝/בְ/הַוַּ֗ת בֹּגְדִ֥ים יִלָּכֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/006.yaml
  text: The righteousness of the upright rescues them[a], but the treacherous are caught by their own desire.
translation:
  language: de
  text: Die Gerechtigkeit der Aufrichtigen rettet sie, doch die Treulosen werden durch ihre eigene Begierde[a] gefangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch die Treulosen werden in ihrem Unheil gefangen“ beziehungsweise „durch ihr Verderben“. Das hebräische Substantiv kann sowohl verderbliches Begehren oder Gier als auch Unheil oder Verderben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: Gerechtigkeit
  rationale: Die Konstruktform von צְדָקָה bezeichnet hier die moralische Rechtschaffenheit beziehungsweise das rechte Handeln; „Gerechtigkeit“ wahrt zugleich den Leitbegriff der Weisheitsliteratur.
- source_word: יְשָׁרִים
  choice: der Aufrichtigen
  rationale: Das Wort bezeichnet moralisch geradlinige Menschen. „Aufrichtige“ ist im heutigen Deutsch verständlich und bewahrt die ethische Personengruppe des Spruchs.
- source_word: תַּצִּילֵם
  choice: rettet sie
  rationale: Der Hifil von נצל bedeutet entreißen, befreien oder retten. „Rettet“ ist knapp und natürlich, ohne den praktischen Sinn des Spruchs unnötig einzuengen.
- source_word: וּבְהַוַּת
  choice: in ihrer eigenen Gier
  rationale: הַוָּה kann ein verderbliches Begehren, aber auch Unheil oder Verderben bezeichnen. Die Hauptfassung versteht das ב als den Bereich beziehungsweise das Mittel, in dem die Treulosen gefangen werden, und gibt die innere, selbstverstrickende Begierde mit „Gier“ wieder. „Eigenen“ verdeutlicht den im Zusammenhang naheliegenden Rückbezug, obwohl kein eigenes Possessivsuffix steht.
- source_word: בֹּגְדִים
  choice: die Treulosen
  rationale: בגד bezeichnet treulos oder verräterisch Handelnde. „Treulose“ ist im Deutschen eine natürliche Charakterbezeichnung und legt den Ausdruck weder ausschließlich politisch noch ausschließlich kultisch aus.
- source_word: יִלָּכֵדוּ
  choice: verfangen sich
  rationale: Der Nifal von לכד bezeichnet das Gefangen- oder Ergriffenwerden. Zusammen mit „Gier“ vermittelt „verfangen sich“ idiomatisch das Bild des Sichverstrickens, ohne die passive Betroffenheit aufzuheben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper antithetischer Spruchform. Die traditionelle Weisheitsterminologie „Gerechtigkeit“ und „Aufrichtige“ bleibt erhalten; „Treulose“ und „verfangen sich“ sind zugleich allgemein verständlich. Die echte Mehrdeutigkeit von הַוָּה wird in der Fußnote bewahrt.
