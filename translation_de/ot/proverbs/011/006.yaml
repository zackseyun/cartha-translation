revisions:
- from: Die Gerechtigkeit der Aufrichtigen rettet sie, doch die Treulosen verfangen sich in ihrer eigenen Gier.[a]
  to: Die Gerechtigkeit der Aufrichtigen rettet sie, doch die Treulosen werden durch ihre eigene Begierde[a] gefangen.
  rationale: Die Revision stellt die passive Bildlichkeit von יִלָּכֵדוּ mit „werden ... gefangen“ wieder her, verwendet für die gewählte Lesart von הַוָּה das weniger einengende „Begierde“ und setzt den Fußnotenanker direkt an die mehrdeutige Wendung. Die lexikalische Alternative bleibt ausdrücklich erhalten.
