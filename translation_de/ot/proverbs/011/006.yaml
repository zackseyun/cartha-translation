review_pass:
  verdict: revise
  source_fidelity: Die erste Satzhälfte gibt צִדְקַת יְשָׁרִים תַּצִּילֵם treffend wieder. In der zweiten Hälfte ist die Mehrdeutigkeit von הַוָּה korrekt durch die Fußnote berücksichtigt. Das Nifal יִלָּכֵדוּ bezeichnet jedoch primär ein Gefangenwerden bzw. Gefasstwerden; „verfangen sich“ macht daraus zu deutlich eine reflexive Eigenhandlung. Eine passivische Formulierung bewahrt das Bild und die Grammatik genauer.
  naturalness: „Die Gerechtigkeit der Aufrichtigen rettet sie“ ist natürliches, würdiges Standarddeutsch. „Die Treulosen werden durch ihre eigene Begierde gefangen“ ist idiomatisch genug für den knappen Weisheitsspruch und klarer quellennah als „verfangen sich in ihrer eigenen Gier“.
  terminology: „Gerechtigkeit“, „Aufrichtige“ und „Treulose“ sind als ethische Kategorien der Weisheitsliteratur angemessen. „Begierde“ gibt die mögliche Bedeutung von הַוָּה neutraler wieder als das stärker wertende und engere „Gier“, ohne die im Fußnotenapparat dokumentierte Alternative „Unheil/Verderben“ auszuschließen.
  issues:
