    issue: „verfangen sich“ schwächt die passive Form von יִלָּכֵדוּ ab.
    rationale: יִלָּכֵדוּ ist Nifal Plural von לכד und bedeutet „werden gefangen/gefasst“. Die reflexive deutsche Wendung legt eine eigenaktive Verstrickung nahe, die der hebräische Wortlaut nicht ausdrücklich aussagt.
  - severity: low
    issue: „Gier“ ist gegenüber der mehrdeutigen hebräischen Vokabel unnötig eng und wertend.
    rationale: הַוָּה kann Begierde/Verlangen, aber auch Unheil oder Verderben bezeichnen. „Begierde“ wahrt die gewählte Lesart, ohne sie übermäßig zu spezifizieren.
  - severity: low
    issue: Der Fußnotenanker steht am Satzende statt unmittelbar bei der mehrdeutigen Wendung.
    rationale: Ein Anschluss an „Begierde“ macht deutlich, dass die Anmerkung ausschließlich die Übersetzung von בְּהַוַּת betrifft.
