  text: יֵ֣שׁ מְ֭פַזֵּר וְ/נוֹסָ֥ף ע֑וֹד וְ/חוֹשֵׂ֥ךְ מִ֝/יֹּ֗שֶׁר אַךְ לְ/מַחְסֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/024.yaml
  text: There is one who scatters[a], yet gains still more; and one who withholds more than is right, but only to poverty.
translation:
  language: de
  text: Mancher teilt großzügig aus und bekommt immer noch mehr; ein anderer hält mehr zurück, als recht ist,[a] und erleidet nur Mangel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hält zurück, was recht wäre“. Die hebräische Wendung מִיֹּשֶׁר ist schwierig; sie kann ein Zurückhalten über das angemessene Maß hinaus oder das Vorenthalten dessen bezeichnen, was Recht und Fairness verlangen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Mancher … ein anderer
  rationale: Die Konstruktion stellt allgemeine Menschentypen gegenüber. Die deutsche Paarung „Mancher … ein anderer“ gibt diese sprichwörtliche Verallgemeinerung natürlich wieder.
- source_word: מְפַזֵּר
  choice: teilt großzügig aus
  rationale: Das Partizip bedeutet wörtlich „zerstreut“. Im Zusammenhang bezeichnet das Bild freigebiges Austeilen; die Wiedergabe macht den gemeinten Sinn verständlich, ohne ihn auf Almosen zu verengen.
- source_word: וְנוֹסָף עוֹד
  choice: und bekommt immer noch mehr
  rationale: Die Form bezeichnet weiteres Hinzukommen beziehungsweise Zunehmen. Diese Fassung bewahrt das paradoxe Ergebnis der Freigebigkeit.
- source_word: וְחוֹשֵׂךְ
  choice: ein anderer hält … zurück
  rationale: Das Verb bezeichnet Zurückhalten oder Vorenthalten und bildet den klaren Gegensatz zum großzügigen Austeilen.
- source_word: מִיֹּשֶׁר
  choice: mehr …, als recht ist
  rationale: Die schwierige Wendung mit מִן und יֹשֶׁר kann ein Zurückhalten über das angemessene Maß hinaus bezeichnen. Die Übersetzung bewahrt den ethischen Bezug auf das Rechte und Angemessene.
- source_word: אַךְ
  choice: nur
  rationale: Die Partikel hebt die ausschließliche und ironische Folge hervor.
- source_word: לְמַחְסוֹר
  choice: erleidet … Mangel
  rationale: Das Substantiv bezeichnet Mangel, Bedürftigkeit oder Entbehrung. „Mangel“ ist breit genug, um die wirtschaftliche und allgemeine Aussage des Spruchs zu erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwörtlich knapper Gegenüberstellung. „Teilt großzügig aus“ erschließt die Metapher des Zerstreuens, während die Fußnote die echte Mehrdeutigkeit der schwierigen Wendung מִיֹּשֶׁר dokumentiert.
