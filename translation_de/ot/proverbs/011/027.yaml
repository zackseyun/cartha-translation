  text: שֹׁ֣חֵֽר ט֭וֹב יְבַקֵּ֣שׁ רָצ֑וֹן וְ/דֹרֵ֖שׁ רָעָ֣ה תְבוֹאֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/027.yaml
  text: Whoever diligently seeks good seeks favor[c][b][a], but evil comes to the one who searches for it.
translation:
  language: de
  text: Wer sich eifrig um das Gute bemüht, sucht Wohlwollen[a]; wer aber nach Bösem trachtet, den trifft es.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb, das mit »sich eifrig bemüht« wiedergegeben ist, kann auch die Nuance »früh suchen« haben. »Wohlwollen« kann Annahme oder Gunst bei Gott, bei Menschen oder bei beiden meinen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »den wird Unheil treffen«. Das hebräische Wort kann sowohl Böses als auch daraus erwachsendes Unheil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחֵר
  choice: sich eifrig bemüht
  rationale: Das Partizip bezeichnet ein ernsthaftes, eifriges Suchen; die deutsche Wendung gibt diese Intensität natürlich wieder, ohne die ebenfalls mögliche zeitliche Nuance »früh suchen« in den Haupttext zu zwingen.
- source_word: טוֹב
  choice: das Gute
  rationale: Das Adjektiv wird substantivisch gebraucht und bezeichnet in breitem moralischem und praktischem Sinn das, was gut ist.
- source_word: יְבַקֵּשׁ
  choice: sucht
  rationale: Die geläufige Bedeutung »suchen« bewahrt die Aussage des zweiten Verbs im ersten Versglied, ohne sie unnötig zu präzisieren.
- source_word: רָצוֹן
  choice: Wohlwollen
  rationale: Das Wort kann Gunst, Annahme oder Wohlwollen bezeichnen. »Wohlwollen« ist im modernen Deutschen verständlich und lässt offen, ob es von Gott, von Menschen oder von beiden ausgeht.
- source_word: וְדֹרֵשׁ
  choice: wer aber nach … trachtet
  rationale: Das Waw wird wegen des antithetischen Parallelismus mit »aber« wiedergegeben. »Nach etwas trachten« drückt hier zielgerichtetes Suchen aus.
- source_word: רָעָה
  choice: Böses
  rationale: Der Ausdruck kann moralisch Böses ebenso wie daraus entstehendes Unheil bezeichnen. »Böses« erhält diese Spannung besser als eine ausschließlich moralische oder ausschließlich leidbezogene Festlegung.
- source_word: תְבוֹאֶנּוּ
  choice: über den kommt es
  rationale: Das maskuline Objektsuffix bedeutet »ihn/über ihn«, während »es« das zuvor genannte Böse wieder aufnimmt. Die Formulierung bewahrt den Gedanken, dass das gesuchte Böse beziehungsweise Unheil den Suchenden selbst trifft.
theological_decisions:
- issue: Ursprung des mit רָצוֹן bezeichneten Wohlwollens
  choice: Der Ursprung bleibt unbestimmt.
  alternative: Ausdrückliche Festlegung auf Gottes Gunst oder auf menschliches Wohlwollen.
  rationale: Der hebräische Text nennt keinen Geber. Die offene Formulierung erhält die Breite der Aussage und vermeidet eine konfessionelle oder dogmatische Einengung.
- issue: Bedeutungsumfang von רָעָה
  choice: »Böses« mit möglicher Folgebezeichnung »Unheil«
  alternative: Ausschließlich »Bosheit« oder ausschließlich »Unheil« beziehungsweise »Unglück«.
  rationale: Im ersten Zusammenhang kann das Wort das moralisch Böse bezeichnen, im Folgesatz zugleich das Böse oder Unheil, das den Suchenden ereilt. Diese Spannung soll erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in knapper Spruchform. Die antithetische Parallelstruktur wird durch »aber« deutlich gemacht; altertümliche Wendungen werden vermieden.
