  text: צַ֭דִּיק מִ/צָּרָ֣ה נֶחֱלָ֑ץ וַ/יָּבֹ֖א רָשָׁ֣ע תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/008.yaml
  text: The righteous is rescued from trouble[a], and the wicked comes in his place.
translation:
  language: de
  text: Der Gerechte wird aus der Not gerettet, und der Gottlose tritt an seine Stelle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und der Gottlose kommt an seine Stelle.“ Das Hebräische kann einen Austausch ausdrücken: Der Gottlose gerät möglicherweise in die Not, aus der der Gerechte gerettet wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv bezeichnet im Hebräischen eine einzelne, exemplarische gerechte Person. „Der Gerechte“ bewahrt Singular und maskuline Form und entspricht dem prägnanten Stil der Weisheitsliteratur.
- source_word: מִצָּרָה
  choice: aus der Not
  rationale: Die Präposition מִן bezeichnet hier die Befreiung aus einer bedrängenden Lage; צָרָה umfasst Not, Bedrängnis und Unglück. „Aus der Not“ ist natürlich und lässt die Art der Bedrängnis offen.
- source_word: נֶחֱלָץ
  choice: wird gerettet
  rationale: Die Niphal-Form von חלץ drückt hier passiv aus, dass jemand herausgezogen oder befreit wird. „Wird gerettet“ gibt diesen Aspekt klar wieder, ohne Eigenleistung anzudeuten.
- source_word: וַיָּבֹא
  choice: tritt
  rationale: בוא bedeutet grundsätzlich „kommen/eintreten“. Zusammen mit תַּחְתָּיו ergibt „tritt an seine Stelle“ im Deutschen eine natürliche, knappe Wiedergabe des Eintretens an die Stelle des Gerechten.
- source_word: רָשָׁע
  choice: der Gottlose
  rationale: Das substantivierte Adjektiv bildet den ethisch-religiösen Gegenpol zum Gerechten. „Der Gottlose“ ist im deutschen Sprichwort- und Weisheitsstil verständlich und bewahrt die repräsentative Einzahl.
- source_word: תַּחְתָּיו
  choice: an seine Stelle
  rationale: תַּחַת mit Suffix kann „anstelle von ihm“ beziehungsweise „an seiner Stelle“ bedeuten. Die Formulierung bewahrt den Gedanken des Platzwechsels, ohne ausdrücklich festzulegen, wie konkret dieselbe Not auf den Gottlosen übergeht.
theological_decisions:
- issue: Umkehrung beziehungsweise Stellvertretung im Spruch
  choice: Der Gottlose tritt an die Stelle des aus der Not geretteten Gerechten.
  alternative: Der Gottlose gerät ausdrücklich in genau dieselbe Not, aus der der Gerechte gerettet wurde.
  rationale: תַּחְתָּיו legt einen Austausch oder eine Umkehrung nahe, benennt aber den Vorgang und Zeitpunkt nicht näher. Die Übersetzung hält die Spannung offen; die Fußnote verdeutlicht die mögliche konkrete Substitution.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der knappen Parallelstruktur eines Weisheitsspruchs. „Gottloser“ wird hier als herkömmlicher Gegenbegriff zu „Gerechter“ verwendet; die Übersetzung konkretisiert weder Art noch Zeitpunkt der Not.
