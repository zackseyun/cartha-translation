id: PRO.11.26
reference: Proverbs 11:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מֹ֣נֵֽעַ בָּ֭ר יִקְּבֻ֣/הוּ לְא֑וֹם וּ֝/בְרָכָ֗ה לְ/רֹ֣אשׁ מַשְׁבִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/026.yaml
  text: The one who withholds grain—the people curse him[b][a], but blessing is on the head of the one who sells it.
translation:
  language: de
  text: Wer Getreide zurückhält, den verflucht das Volk[a]; doch Segen kommt auf das Haupt dessen, der es verkauft.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Bevölkerung“ beziehungsweise „die Leute“; das hebräische Wort kann ein Volk oder die Öffentlichkeit als Ganze bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der es verteilt“ beziehungsweise „der Getreide bereitstellt“; das hebräische Partizip kann die Versorgung mit Getreide hervorheben, bezeichnet hier aber wahrscheinlich dessen Verkauf im Gegensatz zum Zurückhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹנֵעַ
  choice: Wer … zurückhält
  rationale: Das substantivisch gebrauchte Partizip beschreibt allgemein einen Menschen, der Getreide dem Markt beziehungsweise der Versorgung entzieht.
- source_word: בָּר
  choice: Getreide
  rationale: בָּר bezeichnet hier Getreide allgemein, nicht zwingend eine bestimmte Getreideart.
- source_word: יִקְּבֻהוּ
  choice: den verflucht
  rationale: Die Form von נקב hat hier den Sinn, einen Fluch gegen jemanden auszusprechen; „verfluchen“ gibt dies unmittelbar wieder.
- source_word: לְאֹם
  choice: das Volk
  rationale: לְאֹם kann ein Volk, eine Bevölkerungsgruppe oder kollektiv die Öffentlichkeit bezeichnen; „das Volk“ ist im sozialen Zusammenhang des Spruchs natürlich und bewahrt die lexikalische Breite.
- source_word: וּבְרָכָה
  choice: doch Segen
  rationale: Das Waw bedeutet formal „und“; „doch“ macht den antithetischen Parallelismus im Deutschen natürlich erkennbar.
- source_word: לְרֹאשׁ
  choice: kommt auf das Haupt
  rationale: Die konkrete hebräische Vorstellung, dass Segen auf das Haupt eines Menschen kommt beziehungsweise dort liegt, bleibt erhalten.
- source_word: מַשְׁבִּיר
  choice: dessen, der es verkauft
  rationale: Das Hifil-Partizip von שׁבר bezeichnet in diesem Versorgungskontext den, der Getreide bereitstellt, gewöhnlich indem er es verkauft; das Pronomen „es“ greift „Getreide“ natürlich wieder auf.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchstil. Der antithetische Parallelismus und das konkrete Bild des Segens auf dem Haupt bleiben erhalten.
