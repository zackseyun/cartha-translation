  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die knappe parallele Nominalstruktur des Hebräischen treffend wieder: תַּאֲוַת mit „Verlangen“, אַךְ טוֹב mit „nur Gutes“, תִּקְוַת mit „Hoffnung“ und עֶבְרָה mit „Zorn“. Besonders der letzte Satzteil legt weder Gottes Zorn noch den eigenen Zorn der Gottlosen fest und bewahrt damit die textliche Offenheit.'
  naturalness: „Das Verlangen der Gerechten ist nur Gutes; die Hoffnung der Gottlosen ist Zorn“ ist verständliches, würdiges modernes Standarddeutsch und bewahrt die prägnante Spruchform. Die substantivierten Adjektive sind in diesem Register natürlich.
  terminology: „Gerechte“, „Gottlose“, „Hoffnung“ und „Zorn“ sind etablierte und angemessene Wiedergaben. „Gottlose“ kann den weiteren moralisch-religiösen Gehalt von רְשָׁעִים im weisheitlichen Kontrast gut tragen, ohne eine zusätzliche Lehrentscheidung einzuführen.
