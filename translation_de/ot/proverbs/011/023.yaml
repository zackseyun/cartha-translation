id: PRO.11.23
reference: Proverbs 11:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תַּאֲוַ֣ת צַדִּיקִ֣ים אַךְ ט֑וֹב תִּקְוַ֖ת רְשָׁעִ֣ים עֶבְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/023.yaml
  text: The desire of the righteous is only good[b][a], but the hope of the wicked is wrath.
translation:
  language: de
  text: Das Verlangen der Gerechten ist nur Gutes; die Hoffnung[a] der Gottlosen ist Zorn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Erwartung«.'
    reason: lexikalische Alternative für תִּקְוָה
  - marker: b
    text: 'Oder: »Grimm«. Im Hebräischen wird nicht ausdrücklich gesagt, wessen Zorn gemeint ist. Gemeint sein kann der Zorn der Gottlosen oder der Zorn, der über sie kommt.'
    reason: Mehrdeutigkeit von עֶבְרָה und des nicht genannten Trägers des Zorns
lexical_decisions:
- source_word: תַּאֲוַת
  choice: Verlangen
  rationale: Das Substantiv bezeichnet ein Verlangen oder Sehnen. »Verlangen« ist im Deutschen natürlich, knapp und lässt sowohl die Ausrichtung als auch den erhofften Ausgang anklingen.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Das substantivierte Adjektiv im Plural bezeichnet Menschen, die gerecht handeln. »der Gerechten« bewahrt die knappe moralische Gegenüberstellung des hebräischen Textes.
- source_word: אַךְ
  choice: nur
  rationale: Die Partikel wirkt hier einschränkend und wird direkt mit »nur« wiedergegeben.
- source_word: טוֹב
  choice: Gutes
  rationale: Das substantivierte »Gutes« gibt טוֹב knapp wieder und klingt in der deutschen Satzkonstruktion natürlicher als das bloße Adjektiv »gut«.
- source_word: תִּקְוַת
  choice: Hoffnung
  rationale: Das Wort kann »Hoffnung« oder »Erwartung« bedeuten. »Hoffnung« ist die geläufige Wiedergabe; die mögliche Alternative wird in einer Fußnote genannt.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: Das substantivierte Adjektiv bezeichnet moralisch schuldige oder gottlose Menschen. »der Gottlosen« ist eine etablierte, würdevolle Entsprechung und bildet den Gegensatz zu »der Gerechten«.
- source_word: עֶבְרָה
  choice: Zorn
  rationale: Das Substantiv bezeichnet heftigen Zorn oder Grimm. »Zorn« wahrt die Kürze und das Gewicht der Aussage, ohne festzulegen, wessen Zorn gemeint ist.
theological_decisions:
- issue: Sinn und Bezug des letzten Satzteils
  choice: Die Hoffnung der Gottlosen »ist Zorn«; der Träger oder Urheber des Zorns bleibt ungenannt.
  alternative: 'Die Hoffnung der Gottlosen endet im Zorn Gottes; oder: Ihre Hoffnung besteht in ihrem eigenen Grimm.'
  rationale: 'Der hebräische Text nennt weder ausdrücklich Gott als den Zornigen noch ein Verb wie »enden«. Die knappe Nominalaussage bewahrt deshalb die echte Mehrdeutigkeit: Gemeint sein kann der Zorn der Gottlosen oder der Zorn, der über sie kommt.'
- issue: Sinn des ersten Satzteils
  choice: Die formale Aussage »Das Verlangen der Gerechten ist nur Gutes« bleibt erhalten.
  alternative: 'Das Verlangen der Gerechten richtet sich nur auf Gutes; oder: Es führt nur zum Guten.'
  rationale: Der hebräische Nominalsatz kann die sittliche Ausrichtung des Verlangens oder dessen Ausgang hervorheben. Die gewählte knappe Form vermeidet es, diese Spannung durch ein ergänztes Verb vorzeitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der knappen Parallelstruktur eines Weisheitsspruchs. Die Nominalsätze bewahren die Prägnanz und die inhaltliche Offenheit des Hebräischen.
