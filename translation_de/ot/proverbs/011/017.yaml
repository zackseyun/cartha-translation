source:
  edition: WLC
  text: גֹּמֵ֣ל נַ֭פְשׁ/וֹ אִ֣ישׁ חָ֑סֶד וְ/עֹכֵ֥ר שְׁ֝אֵר֗/וֹ אַכְזָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/017.yaml
  text: A kind man benefits himself[a], but a cruel man troubles his own flesh.
translation:
  language: de
  text: Ein gütiger Mann tut sich selbst Gutes, doch ein Grausamer bringt sein eigenes Fleisch[a] ins Unglück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seinen eigenen Leib; möglicherweise auch: seine Blutsverwandten.'
    reason: שְׁאֵר kann Fleisch beziehungsweise Leib, aber auch Blutsverwandte bezeichnen.
lexical_decisions:
- source_word: גֹּמֵל
  choice: tut … Gutes
  rationale: Das Partizip bezeichnet hier ein wohltätiges Handeln beziehungsweise das Erweisen von Gutem. Die Wendung ist im Deutschen natürlich und steht klar im Gegensatz zum Unheil des zweiten Halbverses.
- source_word: נַפְשׁוֹ
  choice: sich selbst
  rationale: נֶפֶשׁ kann Seele, Leben oder die eigene Person bezeichnen. Im Zusammenhang dieses Weisheitsspruchs ist die reflexive Bedeutung am wahrscheinlichsten.
- source_word: אִישׁ חָסֶד
  choice: ein gütiger Mann
  rationale: Die Verbindung bezeichnet einen Mann, dessen Wesen von Güte und wohlwollender Treue geprägt ist. „Gütig“ gibt dies knapp und ohne unnötige bundestheologische Festlegung wieder; „Mann“ bewahrt die grammatisch maskuline Form des Hebräischen.
- source_word: עֹכֵר
  choice: bringt … ins Unglück
  rationale: עכר bedeutet, Unheil oder Schwierigkeiten über jemanden zu bringen. Die deutsche Wendung erhält diesen verursachenden Sinn und den Gegensatz zu „tut … Gutes“.
- source_word: שְׁאֵרוֹ
  choice: sein eigenes Fleisch
  rationale: שְׁאֵר kann Fleisch, Leib oder Blutsverwandtschaft bezeichnen. In der Parallele zu נַפְשׁוֹ liegt die eigene Person beziehungsweise der eigene Leib nahe; „eigenes Fleisch“ bewahrt zugleich die Bildsprache und die lexikalische Mehrdeutigkeit.
- source_word: אַכְזָרִי
  choice: ein Grausamer
  rationale: Das Adjektiv wird substantivisch gebraucht. „Ein Grausamer“ bildet im Deutschen einen knappen, spruchhaften Gegenpol zu „ein gütiger Mann“.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller und gut verständlicher Spruchstil. Die antithetische Parallelstruktur und das konkrete Bild „eigenes Fleisch“ bleiben erhalten.
