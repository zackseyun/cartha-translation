source:
  edition: WLC
  text: אַל יְקַנֵּ֣א לִ֭בְּ/ךָ בַּֽ/חַטָּאִ֑ים כִּ֥י אִם בְּ/יִרְאַת יְ֝הוָ֗ה כָּל הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/017.yaml
  text: Do not let your heart envy sinners[a], but be in the fear of Yahweh all day long.
translation:
  language: de
  text: Dein Herz soll Sünder nicht beneiden, sondern den ganzen Tag in der Furcht Jahwes sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht im zweiten Satzteil kein ausdrückliches Verb; möglich ist auch: „sondern soll den ganzen Tag in der Furcht Jahwes bleiben.“'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אַל יְקַנֵּא
  choice: sei nicht neidisch
  rationale: Die prohibitive Partikel אַל mit dem Verb קנא wird als verneinte Aufforderung wiedergegeben. „Neidisch sein“ bezeichnet hier das begehrliche Schielen auf Sünder und ist im modernen Deutsch natürlich.
- source_word: לִבְּךָ
  choice: dein Herz
  rationale: Das Bild des Herzens als Zentrum der inneren Haltung bleibt erhalten und wird nicht zu „du“ oder „dein Denken“ verflacht.
- source_word: בַּחַטָּאִים
  choice: auf Sünder
  rationale: „Sünder“ gibt die moralische Bezeichnung direkt wieder; die mit קנא idiomatische deutsche Verbindung lautet „neidisch auf“.
- source_word: כִּי אִם
  choice: sondern
  rationale: 'Die Partikelfolge stellt der untersagten Haltung eine positive Gegenhaltung gegenüber: nicht dies, sondern jenes.'
- source_word: בְּיִרְאַת יְהוָה
  choice: in der Furcht Jahwes
  rationale: Die für die Weisheitsliteratur zentrale Wendung „Furcht Jahwes“ bleibt erhalten, ohne sie auf bloße Ehrfurcht abzuschwächen. Das ב wird mit „in“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die Formulierung bewahrt den zeitlichen Umfang des hebräischen Ausdrucks und klingt in modernem Deutsch natürlich.
theological_decisions:
- issue: Ergänzung des fehlenden Verbs im zweiten Satzteil
  choice: „sei“ als minimale Ergänzung wiederholen
  alternative: „bleibe“ oder „verharre“ in der Furcht Jahwes
  rationale: Der zweite Satzteil ist im Hebräischen ohne ausdrückliches Verb. Die Wiederholung von „sei“ macht den Satz im Deutschen verständlich, ohne zusätzlich die im Verb „bleiben“ oder „verharren“ liegende Vorstellung einer bereits bestehenden Haltung festzuschreiben.
- issue: Wiedergabe von יִרְאַת יְהוָה
  choice: „Furcht Jahwes“
  alternative: „Ehrfurcht vor Jahwe“
  rationale: „Furcht Jahwes“ bewahrt die theologisch gewichtige und spannungsreiche biblische Ausdrucksweise; „Ehrfurcht“ könnte ihren Bedeutungsumfang vorschnell einengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter Herz-Metaphorik und der traditionellen biblischen Wendung „Furcht Jahwes“. Die leichte Wiederholung von „sei“ spiegelt die knappe Gegenüberstellung des hebräischen Spruchs.
