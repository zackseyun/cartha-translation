  text: אַף הִ֭יא כְּ/חֶ֣תֶף תֶּֽאֱרֹ֑ב וּ֝/בוֹגְדִ֗ים בְּ/אָדָ֥ם תּוֹסִֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/028.yaml
  text: Indeed[a], she lies in wait like a robber[b], and she increases the treacherous among men.
translation:
  language: de
  text: Ja, sie lauert wie ein Räuber[a] und vermehrt die Treulosen unter den Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie eine Wegelagerin“. Das seltene hebräische Wort חֶתֶף ist schwer zu deuten; es kann auch allgemeiner auf gewaltsames Ergreifen oder einen plötzlichen Überfall zielen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Ja
  rationale: Die Partikel wirkt hier bekräftigend; „Ja“ gibt diesen Nachdruck im Deutschen knapp und natürlich wieder.
- source_word: הִיא
  choice: sie
  rationale: Das feminine Pronomen verweist auf die Frau im unmittelbaren Zusammenhang und bleibt ausdrücklich erhalten.
- source_word: כְּחֶתֶף
  choice: wie ein Räuber
  rationale: חֶתֶף ist selten und in seiner Bedeutung unsicher. Zusammen mit „lauert“ liegt die Bezeichnung eines gewaltsamen Angreifers oder Räubers nahe.
- source_word: תֶּאֱרֹב
  choice: lauert
  rationale: ארב bezeichnet das verborgene Warten auf eine Gelegenheit zum Angriff; „lauert“ gibt das Bild prägnant wieder.
- source_word: וּבוֹגְדִים
  choice: die Treulosen
  rationale: בוגדים bezeichnet Menschen, die treulos oder hinterhältig handeln. „die Treulosen“ wahrt die breite moralische Bedeutung.
- source_word: בְּאָדָם
  choice: unter den Menschen
  rationale: אָדָם wird hier kollektiv für die Menschheit gebraucht; „unter den Menschen“ ist im modernen Deutschen natürlich und sachlich genau.
- source_word: תּוֹסִף
  choice: vermehrt
  rationale: Die Hifil-Form von יסף drückt hier aus, dass sie die Zahl der Treulosen größer werden lässt.
