  text: בְּ/אָזְנֵ֣י כְ֭סִיל אַל תְּדַבֵּ֑ר כִּֽי יָ֝ב֗וּז לְ/שֵׂ֣כֶל מִלֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/009.yaml
  text: Do not speak in the hearing of a fool[b][a], for he will despise the wisdom of your words.
translation:
  language: de
  text: Rede nicht vor einem Tor[a], denn er wird den guten Sinn deiner Worte[b] verachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in den Ohren eines Toren«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Einsicht deiner Worte«; auch »die Weisheit deiner Worte« ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אָזְנֵי
  choice: wo … es hört
  rationale: Die Wendung bedeutet wörtlich »in den Ohren von« und bezeichnet hier das Reden in jemandes Hörbereich. Die deutsche Formulierung bewahrt den Bezug auf das Hören, ohne unnatürlich zu klingen.
- source_word: כְסִיל
  choice: ein Tor
  rationale: Das in den Sprüchen häufige Weisheitswort bezeichnet einen moralisch und geistig uneinsichtigen Menschen, nicht bloß jemanden mit geringer Intelligenz. »Tor« ist dafür die prägnante, etablierte deutsche Entsprechung.
- source_word: אַל תְּדַבֵּר
  choice: Rede nicht
  rationale: Die Verbindung aus אַל und Imperfekt formuliert ein Verbot. »Rede nicht« gibt es knapp und spruchgemäß wieder.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für das Verbot ein. »Denn« bildet diesen Zusammenhang idiomatisch und knapp ab.
- source_word: יָב֗וּז
  choice: er wird … verachten
  rationale: Das Verb bezeichnet geringschätzige, verächtliche Zurückweisung. Das Futur gibt die hier angekündigte Folge der Handlung angemessen wieder.
- source_word: לְ/שֵׂכֶל
  choice: die Einsicht
  rationale: שֵׂכֶל kann Einsicht, Verständigkeit oder guten Sinn bezeichnen. »Einsicht« wahrt die begriffliche Offenheit, ohne den Ausdruck vorschnell mit umfassender »Weisheit« gleichzusetzen; לְ markiert nach בזה das Objekt der Verachtung.
- source_word: מִלֶּֽי/ךָ
  choice: deiner Worte
  rationale: Die Form bedeutet wörtlich »deine Worte« und steht in einer Genitivverbindung mit »Einsicht«. Die Übersetzung erhält diese konkrete Ausdrucksweise.
