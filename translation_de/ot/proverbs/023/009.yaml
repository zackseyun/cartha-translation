translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Der Satzbau bleibt spruchhaft; die ungewöhnliche, aber verständliche Verbindung »die Einsicht deiner Worte« bewahrt die Bild- und Bedeutungsstruktur des Hebräischen.
