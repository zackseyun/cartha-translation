  text: וְ/שַׂמְתָּ֣ שַׂכִּ֣ין בְּ/לֹעֶ֑/ךָ אִם בַּ֖עַל נֶ֣פֶשׁ אָֽתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/002.yaml
  text: and put a knife to your throat if you are a man of appetite[a].
translation:
  language: de
  text: und setz dir ein Messer an die Kehle, wenn du ein Mensch mit starkem Appetit bist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wenn du zum Essen sehr leicht verführt wirst“ oder „wenn du ein Vielfraß bist“. Die hebräische Wendung lautet wörtlich „ein Besitzer/Herr von Verlangen“ und bezeichnet in diesem Zusammenhang einen Menschen, der stark von seinem Appetit oder Begehren bestimmt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׂמְתָּ
  choice: und setz
  rationale: Das Waw mit dem Qal-Perfekt in der zweiten Person Singular führt die Unterweisung aus dem vorherigen Vers fort und hat hier auffordernden Sinn. „Setz“ ist im Deutschen knapp und natürlich.
- source_word: שַׂכִּין
  choice: ein Messer
  rationale: Das Substantiv bezeichnet ein Messer. Die direkte Wiedergabe bewahrt das drastische Bild der Warnung.
- source_word: בְּ/לֹעֶךָ
  choice: dir … an die Kehle
  rationale: לֹעַ bezeichnet Kehle oder Rachen. In Verbindung mit שׂים entspricht „ein Messer an die Kehle setzen“ dem natürlichen deutschen Sprachgebrauch, während „in die Kehle“ hier unnötig wörtlich und missverständlich wäre.
- source_word: אִם
  choice: wenn
  rationale: Die Bedingung beschreibt den Fall, in dem die drastische Selbstdisziplin nötig ist. Im Deutschen klingt „wenn“ in dieser allgemeinen Mahnung natürlicher als „falls“, ohne den bedingenden Sinn aufzugeben.
- source_word: בַּעַל נֶפֶשׁ
  choice: vom Verlangen beherrscht
  rationale: Die ungewöhnliche Verbindung lautet wörtlich etwa „Besitzer/Herr einer Seele beziehungsweise eines Verlangens“. Im Zusammenhang eines Festmahls bezeichnet sie jemanden, den starker Appetit oder starkes Begehren antreibt. Die Formulierung gibt die idiomatische Aussage natürlich wieder, ohne sie ausschließlich auf Völlerei festzulegen.
- source_word: אָתָּה
  choice: du … wirst
  rationale: Das selbstständige Pronomen hebt die angesprochene Person ausdrücklich hervor und ist in der deutschen Verbform samt Pronomen wiedergegeben.
