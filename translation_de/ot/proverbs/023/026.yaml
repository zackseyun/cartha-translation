  yaml_path: translation/ot/proverbs/023/026.yaml
  text: My son[a], give me your heart, and let your eyes delight in my ways.
translation:
  language: de
  text: Mein Sohn, gib mir dein Herz, und deine Augen sollen an meinen Wegen Gefallen haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine abweichende Lesung versteht: „und deine Augen sollen meine Wege aufmerksam beobachten.“ Die vorliegende hebräische Lesung kann wohlwollendes Gefallen und Zustimmung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: gib
  rationale: Der Imperativ von נתן fordert unmittelbar zum Geben auf; „gib“ ist im Deutschen direkt und natürlich.
- source_word: בְנִי
  choice: Mein Sohn
  rationale: Die Anrede mit Suffix der 1. Person Singular ist ausdrücklich maskulin und wird formgetreu wiedergegeben.
- source_word: לִבְּךָ
  choice: dein Herz
  rationale: „Herz“ bezeichnet hier den inneren Menschen einschließlich Denken, Wollen und Zuneigung; das deutsche Bild bleibt verständlich und bewahrt die Aussageweite.
- source_word: לִי
  choice: mir
  rationale: Die Präposition bezeichnet den Empfänger. „Gib mir dein Herz“ ist die natürliche deutsche Wortstellung.
- source_word: וְעֵינֶיךָ
  choice: und deine Augen sollen
  rationale: Die Formulierung gibt die volitive Nuance des verbundenen zweiten Satzes in idiomatischem Deutsch wieder.
- source_word: דְּרָכַי
  choice: meine Wege
  rationale: דרך kann Wege sowie die Lebensführung bezeichnen. „Meine Wege“ bewahrt das Bild und passt zur Weisheitsunterweisung.
- source_word: תרצנה
  choice: an … Gefallen haben
  rationale: Die masoretische Lesung wird von רצה her als wohlwollendes Gefallen oder Zustimmung verstanden. Die Wendung erhält den Bezug zu den Augen und drückt mehr als bloßes Beobachten aus.
theological_decisions:
- issue: Bedeutung von תרצנה
  choice: an meinen Wegen Gefallen haben
  alternative: meine Wege aufmerksam beobachten
  rationale: Die Konsonantenfolge und die Überlieferung lassen eine Deutung als wohlwollendes Gefallen im Sinn von רצה zu; zugleich ist eine aufmerksame Betrachtung als alternative Auffassung bezeugt. Die Hauptfassung wahrt die affektive und willentliche Dimension, ohne die Alternative zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die väterliche Anrede und das Bild vom Herzen bleiben erhalten; die zweite Satzhälfte klingt bewusst als eindringliche Aufforderung.
