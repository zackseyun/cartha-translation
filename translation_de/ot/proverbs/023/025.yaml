source:
  edition: WLC
  text: יִֽשְׂמַח אָבִ֥י/ךָ וְ/אִמֶּ֑/ךָ וְ֝/תָגֵ֗ל יֽוֹלַדְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/025.yaml
  text: Let your father and your mother be glad[a], and let her who gave birth to you rejoice.
translation:
  language: de
  text: Mögen dein Vater und deine Mutter sich freuen, und möge die, die dich geboren hat, jubeln.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמַח
  choice: mögen … sich freuen
  rationale: Der Qal-Jussiv drückt hier einen Wunsch bzw. eine Aufforderung aus. Die Konstruktion mit „mögen“ bewahrt diesen Sinn, ohne eine bloße Zukunftsaussage oder eine Pflicht zu formulieren.
- source_word: אָבִיךָ וְאִמֶּךָ
  choice: dein Vater und deine Mutter
  rationale: Die Possessivformen und die einfache Koordination werden direkt und natürlich wiedergegeben.
- source_word: וְתָגֵל
  choice: und möge … jubeln
  rationale: Der Qal-Jussiv von גיל bezeichnet lebhafte Freude. „jubeln“ hebt sich wie im Hebräischen vom vorherigen „sich freuen“ ab.
- source_word: יוֹלַדְתֶּךָ
  choice: die, die dich geboren hat
  rationale: Das feminine Partizip mit Suffix bezeichnet die Frau, die den Angesprochenen geboren hat, und nimmt damit die Mutter nochmals in poetischer Parallelität auf.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweifache Wunschform und die abgestufte Freude der beiden hebräischen Verben bleiben erhalten; die Wiederholung „die, die“ ist grammatisch eindeutig und gibt die substantivierte feminine Form transparent wieder.
