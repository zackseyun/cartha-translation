base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/023.yaml
  text: Buy truth[a], and do not sell wisdom, instruction[c][b], and understanding.
translation:
  language: de
  text: Kaufe Wahrheit[a] und verkaufe Weisheit, Unterweisung[b] und Einsicht[c] nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erwirb Wahrheit“. Das hebräische Verb kann „kaufen“ oder allgemeiner „erwerben, sich verschaffen“ bedeuten; wegen des folgenden „verkaufe … nicht“ liegt das Handelsbild nahe.'
    reason: lexical_alternative
  - marker: b
    text: „Unterweisung“ kann auch mit „Erziehung“, „Zucht“ oder „Zurechtweisung“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: „Einsicht“ kann auch „Verständnis“ oder „Unterscheidungsvermögen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  choice: Wahrheit
  rationale: Der Ausdruck bezeichnet Wahrheit, Verlässlichkeit oder Treue. Im Zusammenhang der Weisheitsmahnung ist „Wahrheit“ die natürliche, umfassende Wiedergabe, die sowohl die sachliche als auch die sittliche Dimension offenhält.
- source_word: קְנֵה
  choice: Kaufe
  rationale: Das Verb kann „kaufen“ oder allgemeiner „erwerben“ bedeuten. „Kaufe“ bewahrt das beabsichtigte Handelsbild und den pointierten Gegensatz zu „verkaufe … nicht“.
- source_word: וְאַל תִּמְכֹּר
  choice: und verkaufe sie nicht
  rationale: Die negative Aufforderung wird direkt wiedergegeben. Das ergänzte Pronomen „sie“ ist im Deutschen für einen natürlichen Satzfluss sinnvoll und nimmt zunächst „Wahrheit“ auf; der folgende Doppelpunkt lässt Weisheit, Unterweisung und Einsicht als nähere Entfaltung des zu Erwerbenden und Festzuhaltenden erscheinen.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: „Weisheit“ ist die etablierte und sachgerechte Wiedergabe des zentralen Begriffs in den Sprüchen; er umfasst lebenspraktische, sittliche und auf Gott bezogene Lebenskunst.
- source_word: מוּסָר
  choice: Unterweisung
  rationale: Der Begriff kann Unterweisung, Erziehung, Zucht oder korrigierende Disziplin bezeichnen. „Unterweisung“ ist im modernen Deutsch verständlich und wahrt die pädagogische Breite, ohne den Ausdruck auf Bestrafung zu verengen.
- source_word: בִינָה
  choice: Einsicht
  rationale: Der Begriff bezeichnet Verständnis, Unterscheidungsvermögen oder Einsicht. „Einsicht“ passt idiomatisch zur Reihe mit Weisheit und Unterweisung und bewahrt die praktische Erkenntnisdimension.
theological_decisions:
- issue: Beziehung der nachgestellten Begriffe zu „kaufen“ und „nicht verkaufen“
  choice: Ein Doppelpunkt stellt „Weisheit, Unterweisung und Einsicht“ als Entfaltung dessen dar, was erworben und nicht preisgegeben werden soll.
  alternative: „Kaufe Wahrheit und verkaufe nicht Weisheit, Unterweisung und Einsicht“ oder eine unverbundene Nachstellung ohne verdeutlichende Zeichensetzung.
  rationale: Der hebräische Satz ist äußerst knapp und lässt die syntaktische Zuordnung der nachgestellten Nomina offen. Die gewählte Fassung gibt den wahrscheinlichen Gesamtappell idiomatisch wieder, ohne die Begriffe als käufliche Waren im wörtlichen Sinn oder als voneinander getrennte Aufforderungen auszulegen.
translation_notes:
  register: Knappes, einprägsames Sprichwort in modernem, würdigem Standarddeutsch. Das Handelsbild bleibt erhalten. Der Doppelpunkt macht die appositionsartige Nachstellung der drei Weisheitsbegriffe lesbar, ohne die Dichte des hebräischen Satzes unnötig auszubauen.
