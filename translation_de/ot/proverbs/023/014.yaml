source:
  edition: WLC
  text: אַ֭תָּה בַּ/שֵּׁ֣בֶט תַּכֶּ֑/נּוּ וְ֝/נַפְשׁ֗/וֹ מִ/שְּׁא֥וֹל תַּצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/014.yaml
  text: You shall strike him with the rod[b][a], and you will deliver his life from Sheol.
translation:
  language: de
  text: Du schlägst ihn mit dem Stock, und sein Leben[a] rettest du vor dem Totenreich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Seele«. Das hebräische Wort nefesch kann je nach Zusammenhang »Leben«, »Selbst« oder »Seele« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch Scheol: der Bereich der Toten; auch mit »Grab« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשֵּׁבֶט
  choice: mit dem Stock
  rationale: שֵׁבֶט bezeichnet einen Stock, Stab oder ein Zepter. Im Zusammenhang elterlicher Züchtigung gibt „Stock“ das konkrete Werkzeug natürlich und ohne Abschwächung wieder.
- source_word: תַּכֶּנּוּ
  choice: du schlägst ihn
  rationale: Das Hifil von נכה bedeutet hier direkt „schlagen“. Die Wiedergabe bewahrt die ausdrücklich körperliche Handlung, ohne sie durch „züchtigen“ interpretierend zu verallgemeinern.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נֶפֶשׁ kann je nach Zusammenhang „Leben“, „Selbst“ oder „Seele“ bezeichnen. In Verbindung mit der Rettung vor dem Totenreich liegt „Leben“ nahe, während eine Fußnote die echte lexikalische Alternative „Seele“ erhält.
- source_word: מִשְּׁאוֹל
  choice: vor dem Totenreich
  rationale: שְׁאוֹל bezeichnet den Bereich der Toten. „Totenreich“ bewahrt diesen hebräischen Vorstellungshorizont besser als das engere „Grab“ und ist für heutige deutschsprachige Leser unmittelbar verständlich.
- source_word: תַּצִּיל
  choice: rettest du
  rationale: Das Hifil von נצל bedeutet „retten, entreißen“. „Retten“ ist im Deutschen natürlich, feierlich und passt zur Konstruktion mit „vor“.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ in Verbindung mit dem Totenreich
  choice: sein Leben
  alternative: seine Seele
  rationale: Der Spruch spricht von der Bewahrung vor einem Weg, der in Tod oder Verderben führt. „Sein Leben“ gibt den idiomatischen Sinn gut wieder, ohne aus dem Vers eine bestimmte Lehre über das Verhältnis von Leib und Seele abzuleiten; die Fußnote erhält die Alternative.
- issue: Bedeutung von שְׁאוֹל
  choice: Totenreich
  alternative: Grab; Scheol
  rationale: „Totenreich“ lässt die Aussage auf den Bereich der Toten bezogen und verengt sie nicht auf eine einzelne Grabstätte. Zugleich vermeidet es, Scheol mit einer später ausgeformten Vorstellung der Hölle gleichzusetzen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der hebräische Satzbau wird durch die betonte Wiederaufnahme „sein Leben … rettest du“ erkennbar gehalten, ohne unnatürlich zu wirken. Die konkrete Aussage über körperliche Züchtigung wird weder abgeschwächt noch über den Wortlaut hinaus verschärft.
