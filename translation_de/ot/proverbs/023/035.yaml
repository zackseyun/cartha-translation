  text: הִכּ֥וּ/נִי בַל חָלִיתִי֮ הֲלָמ֗וּ/נִי בַּל יָ֫דָ֥עְתִּי מָתַ֥י אָקִ֑יץ א֝וֹסִ֗יף אֲבַקְשֶׁ֥/נּוּ עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/035.yaml
  text: “They struck me[a], but I was not hurt; they beat me, but I did not know it[b]. When shall I awake? I will seek it again.”
translation:
  language: de
  text: „Sie haben mich geschlagen, doch es tat mir nicht weh[a]; sie haben mich verprügelt, doch ich habe nichts davon gemerkt. Wann werde ich aufwachen? Ich werde ihn wieder suchen[b].“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doch ich wurde nicht verletzt“. Das hebräische Verb kann hier Krankheit, Schwäche, Verletzung oder Schmerz bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit „ihn“ ist dem Zusammenhang nach sehr wahrscheinlich der Wein gemeint.
    reason: cross_reference
lexical_decisions:
- source_word: הִכּוּנִי
  choice: Sie haben mich geschlagen
  rationale: נכה bezeichnet allgemein das Schlagen. „Geschlagen“ gibt die körperliche Gewalt natürlich wieder und lässt für das zweite Verb eine stärkere Formulierung zu.
- source_word: בַל חָלִיתִי
  choice: doch es tat mir nicht weh
  rationale: חלה kann krank, schwach, verletzt oder von Schmerz betroffen sein bedeuten. Im Zusammenhang der Schläge drückt die Wendung am natürlichsten die alkoholbedingte Schmerzunempfindlichkeit aus, ohne den Bedeutungsumfang als eindeutige Verletzungsfreiheit festzulegen.
- source_word: הֲלָמוּנִי
  choice: sie haben mich verprügelt
  rationale: הלם bezeichnet heftiges Schlagen. „Verprügelt“ unterscheidet das Verb vom vorherigen נכה und bewahrt die Steigerung im Parallelismus.
- source_word: בַל יָדָעְתִּי
  choice: doch ich habe nichts davon gemerkt
  rationale: ידע bedeutet grundsätzlich „wissen/kennen“, bezeichnet hier aber im Kontext des Rausches fehlende Wahrnehmung. Die deutsche Wendung gibt diesen Sinn idiomatisch wieder.
- source_word: מָתַי אָקִיץ
  choice: Wann werde ich aufwachen?
  rationale: קיץ bezeichnet das Erwachen. Die wörtliche Bildsprache bleibt erhalten; eine Deutung wie „wieder zu mir kommen“ würde stärker interpretieren.
- source_word: אוֹסִיף אֲבַקְשֶׁנּוּ עוֹד
  choice: Dann suche ich ihn wieder
  rationale: יסף zusammen mit עוד drückt Wiederholung aus, und בקש bedeutet „suchen/verlangen nach“. Das maskuline Suffix wird als „ihn“ wiedergegeben, damit sein grammatisches Geschlecht sichtbar bleibt; aus dem Kontext ist sehr wahrscheinlich der Wein gemeint.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede klingt wie die benommene Selbstaussage eines Betrunkenen. „Verprügelt“ ist bewusst kräftig, aber allgemeinverständlich; „ihn“ bewahrt die Form des hebräischen maskulinen Suffixes und wird durch die Fußnote kontextuell erläutert.
