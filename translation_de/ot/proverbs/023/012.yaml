id: PRO.23.12
reference: Proverbs 23:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָבִ֣יאָ/ה לַ/מּוּסָ֣ר לִבֶּ֑/ךָ וְ֝/אָזְנֶ֗/ךָ לְ/אִמְרֵי דָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/012.yaml
  text: Apply your heart to instruction[a], and your ear to words of knowledge.
translation:
  language: de
  text: Richte dein Herz auf Unterweisung[a] und dein Ohr auf Worte der Erkenntnis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Bring dein Herz zur Zucht und dein Ohr zu Aussprüchen der Erkenntnis.'
    reason: Die hebräischen Ausdrücke können wörtlicher mit »bringen«, »Zucht« und »Aussprüche« wiedergegeben werden; מוּסָר schließt neben Unterweisung auch erziehende Disziplin und Korrektur ein.
lexical_decisions:
- source_word: הָבִיאָה
  choice: Richte … auf
  rationale: Die Imperativform bedeutet wörtlich »bring«. Im Deutschen gibt »richte dein Herz auf« die beabsichtigte, aktive Hinwendung natürlich wieder, ohne die Aufforderung abzuschwächen.
- source_word: לַמּוּסָר
  choice: auf Unterweisung
  rationale: מוּסָר umfasst Unterweisung, Erziehung, Zucht und Korrektur. In der Parallele zu den »Worten der Erkenntnis« steht hier der lehrende Sinn im Vordergrund; »Unterweisung« bewahrt zugleich den formenden Charakter.
- source_word: לִבֶּךָ
  choice: dein Herz
  rationale: לֵב bezeichnet im Hebräischen das innere Zentrum von Denken, Wollen und Empfinden. »Herz« erhält das Bild und ist im Deutschen verständlich.
- source_word: וְאָזְנֶךָ
  choice: und dein Ohr
  rationale: Der hebräische Text verwendet den Singular. Dieser lässt sich auch im Deutschen idiomatisch beibehalten und entspricht der poetischen Parallele zu »dein Herz«.
- source_word: לְאִמְרֵי
  choice: auf Worte
  rationale: אִמְרֵי ist der Konstruktplural von »Wort/Ausspruch«. »Worte« ist natürlich und gibt die Form knapp wieder.
- source_word: דָעַת
  choice: der Erkenntnis
  rationale: דַּעַת bedeutet Wissen oder Erkenntnis. »Erkenntnis« entspricht dem weisheitlichen Zusammenhang und klingt in der Verbindung »Worte der Erkenntnis« idiomatischer als »Worte des Wissens«.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der poetische Parallelismus zwischen »Herz« und »Ohr« sowie die Singularformen bleiben erhalten; die Hauptfassung ist natürlich formuliert, während die Fußnote die wörtlichere und strengere Nuance ausweist.
