  text: Who has woe? Who has sorrow? Who has strife? Who has complaining? Who has wounds for nothing? Who has redness of eyes?[a][b][c]
translation:
  language: de
  text: Wer hat Leid? Wer hat Kummer? Wer hat Streit? Wer hat Klage?[a] Wer hat Wunden ohne Grund?[b] Wer hat gerötete Augen?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: kummervolles Reden. Das hebräische Wort kann auch Rede, Klage oder sorgendes Sinnen bezeichnen.'
