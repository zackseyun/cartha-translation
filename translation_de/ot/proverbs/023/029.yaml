    reason: lexical_alternative
  - marker: c
    text: 'Oder: blutunterlaufene Augen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֥וֹי
  choice: Weh
  rationale: Das knappe Substantiv bewahrt den Charakter eines Not- und Klagerufs und bildet im Deutschen mit dem folgenden »Ach« ein verständliches Wortpaar.
- source_word: אֲב֡וֹי
  choice: Ach
  rationale: Der Klageruf wird bewusst vom vorangehenden »Weh« unterschieden; »Weh und Ach« gibt die hebräische Laut- und Sinnparallele knapp wieder.
- source_word: מדונים
  choice: Streit
  rationale: Das Wort bezeichnet streitbare Auseinandersetzungen; das deutsche Sammelwort »Streit« klingt in der rhetorischen Reihe natürlicher als ein abstraktes Pluralwort.
- source_word: שִׂ֗יחַ
  choice: Klagen
  rationale: Das mehrdeutige Wort kann Rede, Klage oder kummervolles Sinnen bezeichnen. »Klagen« passt zum unmittelbaren Zusammenhang, ohne undeutliches oder betrunkenes Reden in den Text hineinzulesen.
- source_word: פְּצָעִ֣ים
  choice: Wunden
  rationale: Die konkrete Bezeichnung körperlicher Verletzungen wird direkt und anschaulich wiedergegeben.
- source_word: חִנָּ֑ם
  choice: ohne Grund
  rationale: Die Formulierung gibt den Gedanken grundloser, unnötiger oder vergeblich erlittener Verletzungen wieder und lässt die genaue Nuance offen.
- source_word: חַכְלִל֥וּת עֵינָֽיִם
  choice: gerötete Augen
  rationale: Die Wendung beschreibt hier eine auffällige Verfärbung der Augen; »gerötete Augen« bleibt nah am Ausdruck und ist im modernen Deutschen natürlich.
- source_word: לְ/מִי
  choice: Wer hat
  rationale: Das wörtliche »für wen?« wird als idiomatische deutsche Besitzfrage wiedergegeben. Die sechsmalige Wiederholung erhält den eindringlichen Rhythmus.
theological_decisions: []
translation_notes:
  register: Kurze, wiederholte Fragen bewahren den eindringlichen Rhythmus des hebräischen Spruchs. Das geläufige Paar »Weh« und »Ach« gibt die beiden verwandten Klagerufe knapp, würdig und für heutige Leser verständlich wieder.
