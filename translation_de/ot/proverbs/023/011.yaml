translation:
  language: de
  text: Denn ihr Erlöser[a] ist stark; er selbst wird ihre Sache gegen dich führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr Löser«, »ihr Sippenlöser« oder »ihr Rechtsbeistand«. Das hebräische Wort bezeichnet einen Angehörigen, der für ein Familienmitglied eintritt, es auslöst, schützt oder ihm zu seinem Recht verhilft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet das vorausgehende Verbot und bewahrt den kausalen Zusammenhang natürlich im Deutschen.
- source_word: גֹאֲלָם
  choice: ihr Erlöser
  rationale: גאל bezeichnet den verpflichteten Angehörigen oder Beistand, der auslöst, schützt und Recht verschafft. »Erlöser« erhält die rechtliche und theologische Tragweite; die familienrechtliche Bedeutung wird in der Fußnote erläutert.
- source_word: חָזָק
  choice: stark
  rationale: Die direkte Wiedergabe betont seine Macht und Fähigkeit, für die Schutzlosen einzutreten.
- source_word: הוּא
  choice: er selbst
  rationale: Das selbstständige Pronomen hebt den Handelnden hervor; »er selbst« gibt diese Betonung im Deutschen hörbar wieder.
- source_word: יָרִיב אֶת רִיבָם
  choice: wird ihre Sache führen
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv beschreibt das Austragen eines Rechtsstreits. Die deutsche Wendung ist natürlich und bewahrt das juristische Bild.
- source_word: אִתָּךְ
  choice: gegen dich
  rationale: Im Zusammenhang des Rechtsstreits bezeichnet die Präposition die Gegenpartei.
theological_decisions:
- issue: Wiedergabe der גֹאֵל-Bezeichnung im weisheitlichen Zusammenhang
  choice: Erlöser
  alternative: Löser; Sippenlöser; Rechtsbeistand
  rationale: »Erlöser« bewahrt die umfassende Vorstellung eines mächtigen Auslösers, Beschützers und Rechtswahrers, ohne die Bedeutung auf nur eine Funktion zu verengen. Die mögliche familienrechtliche Nuance bleibt durch die Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Parallelismus und das Rechtsbild des Hebräischen bleiben erhalten; »er selbst« bildet die Hervorhebung durch הוּא ab.
