source:
  edition: WLC
  text: עֵ֭ינֶי/ךָ יִרְא֣וּ זָר֑וֹת וְ֝/לִבְּ/ךָ֗ יְדַבֵּ֥ר תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/033.yaml
  text: Your eyes will see strange things[b][a], and your heart will speak perverse things.
translation:
  language: de
  text: Deine Augen werden seltsame Dinge sehen[a], und dein Herz wird Verkehrtes reden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: fremde Frauen. Das hebräische Wort kann in manchen Zusammenhängen fremde oder unerlaubte Frauen bezeichnen; hier kann es allgemeiner die seltsamen oder verzerrten Wahrnehmungen im Rausch meinen.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: Verdrehtes. Das hebräische Wort bezeichnet Verkehrtes, Verdrehungen oder verkehrte Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ
  choice: deine Augen
  rationale: Die Dualform mit Suffix der 2. Person Singular wird im Deutschen natürlich als Plural wiedergegeben.
- source_word: יִרְאוּ
  choice: werden sehen
  rationale: Das Qal-Imperfekt bezeichnet im Zusammenhang der Warnung die eintretende Folge des Rausches.
- source_word: זָרוֹת
  choice: seltsame Dinge
  rationale: Das substantivierte feminine Pluralwort kann Fremdes oder Seltsames und in manchen Zusammenhängen fremde beziehungsweise unerlaubte Frauen bezeichnen. Im Kontext des Rausches wahrt „seltsame Dinge“ die allgemeinere Bedeutung, ohne die echte Mehrdeutigkeit zu verdecken.
- source_word: וְלִבְּךָ
  choice: und dein Herz
  rationale: „Herz“ bezeichnet im Hebräischen den inneren Menschen einschließlich Denken und Wollen. Die Wiedergabe behält das Bild des Ausgangstextes bei.
- source_word: יְדַבֵּר
  choice: wird reden
  rationale: Das Piel-Imperfekt steht parallel zu „werden sehen“ und beschreibt eine weitere Folge des Rausches. „Reden“ klingt mit dem unbestimmten Objekt „Verkehrtes“ im Deutschen natürlich.
- source_word: תַּהְפֻּכוֹת
  choice: Verkehrtes
  rationale: Das Substantiv bezeichnet Verdrehungen oder Verkehrtheiten, besonders im Denken und Reden. „Verkehrtes“ bewahrt sowohl den moralischen als auch den sprachlichen Gehalt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der parallele Zukunftsbezug beider Verben und das hebräische Herzbild bleiben erhalten; die Mehrdeutigkeit von זָרוֹת wird im Haupttext nicht einseitig auf Frauen festgelegt.
