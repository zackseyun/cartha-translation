  text: שְׁמַע אַתָּ֣ה בְנִ֣/י וַ/חֲכָ֑ם וְ/אַשֵּׁ֖ר בַּ/דֶּ֣רֶךְ לִבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/019.yaml
  text: Listen[a], my son, and be wise, and direct your heart in the way.
translation:
  language: de
  text: Hör zu[a], mein Sohn, und sei weise; richte dein Herz auf den Weg aus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Höre“.'
    reason: 'Lexikalische Alternative: שׁמע kann schlichtes Hören bezeichnen, meint im Imperativ hier aber auch aufmerksames, beherzigendes Hören.'
  - marker: b
    text: 'Oder, die räumliche Nuance von בַּדֶּרֶךְ enger aufnehmend: „Lenke dein Herz auf dem Weg“.'
    reason: Der hebräische Ausdruck kann das Ausrichten des Herzens auf den Weg beziehungsweise sein Führen auf dem Weg verbinden. Die Hauptfassung ist im Deutschen idiomatischer, ohne den Weg näher zu bestimmen.
lexical_decisions:
- source_word: שְׁמַע
  choice: Hör zu
  rationale: Der Imperativ fordert nicht nur akustisches Hören, sondern aufmerksames, folgebereites Zuhören. „Hör zu“ gibt diese Bedeutung in natürlichem modernem Deutsch wieder.
- source_word: בְנִי
  choice: mein Sohn
  rationale: Die Anrede ist ausdrücklich maskulin singular und entspricht der Vater-Sohn-Unterweisung im Sprüchebuch; sie wird daher nicht neutralisiert.
- source_word: וַחֲכָם
  choice: und werde weise
  rationale: Der Imperativ von חכם kann sowohl zum Weisesein als auch zum Weisewerden auffordern. „Werde weise“ bringt den durch die Unterweisung angestoßenen Vorgang im Deutschen natürlich zum Ausdruck.
- source_word: וְאַשֵּׁר
  choice: lenke
  rationale: Der Piel-Imperativ bezeichnet hier das Geraderichten oder zielbewusste Führen. „Lenke“ ist mit „dein Herz“ idiomatisch und bewahrt den Gedanken bewusster Ausrichtung.
- source_word: בַּדֶּרֶךְ
  choice: auf dem Weg
  rationale: דֶּרֶךְ bezeichnet einen Weg und metaphorisch die Lebensführung. „Auf dem Weg“ bewahrt sowohl das Wegbild als auch die im Hebräischen nicht näher bestimmte Richtung.
- source_word: לִבֶּךָ
  choice: dein Herz
  rationale: לֵב umfasst Denken, Wollen und Begehren. „Herz“ erhält das konkrete, literarisch und theologisch bedeutsame Bild, ohne es auf „Verstand“ oder „Inneres“ zu verengen.
theological_decisions:
- issue: Geschlechtsspezifische Anrede in der Weisheitsunterweisung
  choice: mein Sohn
  alternative: mein Kind
  rationale: Das Hebräische ist grammatisch maskulin singular. Auch wenn die Weisheitslehre über den unmittelbar Angesprochenen hinaus gelten kann, soll die konkrete Form der Anrede nicht neutralisiert werden.
- issue: Ausrichtung des Herzens auf dem Lebensweg
  choice: lenke dein Herz auf dem Weg
  alternative: richte dein Herz auf den Weg
  rationale: Die gewählte Fassung lässt die Beziehung zwischen dem Lenken und dem Weg ähnlich offen wie der hebräische Ausdruck. Die Alternative könnte stärker so verstanden werden, als sei der Weg selbst ausschließlich das Ziel der Ausrichtung.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die direkte Vater-Sohn-Anrede und das traditionelle Herz-Weg-Bild bleiben erhalten; das Semikolon gliedert die eng verbundenen Aufforderungen lesefreundlich.
