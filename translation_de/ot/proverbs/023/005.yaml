base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/005.yaml
  text: Will you let your eyes fly to it[a], and it is gone? For it surely makes wings for itself; like an eagle, it flies to the heavens.
translation:
  language: de
  text: Lässt du deinen Blick darauf fliegen, und schon ist es nicht mehr da? Denn ganz gewiss macht es sich Flügel; wie ein Adler[a] fliegt es zum Himmel empor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie ein Geier«; das hebräische Wort néscher kann allgemeiner einen großen Greifvogel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָעוּף
  choice: Lässt du … fliegen
  rationale: Die Kausativform von עוף bedeutet wörtlich »fliegen lassen«. Die Wiedergabe bewahrt das lebhafte Flugbild und verbindet es mit den Flügeln im zweiten Vershälftenteil.
- source_word: עֵינֶיךָ
  choice: deinen Blick
  rationale: Wörtlich steht »deine Augen«. Im Deutschen bezeichnet »den Blick fliegen lassen« die gemeinte Ausrichtung des Sehens natürlicher, ohne das Bild des Fliegens aufzugeben.
- source_word: בּוֹ
  choice: darauf
  rationale: Das Pronomen verweist im Zusammenhang auf den zuvor genannten Reichtum. »Darauf« entspricht der hebräischen Präposition und vermeidet in einem Einzelvers eine unnötige Festlegung des grammatischen Geschlechts.
- source_word: וְאֵינֶנּוּ
  choice: ist es schon nicht mehr da
  rationale: Die Wendung bedeutet wörtlich »und es ist nicht«. »Schon nicht mehr da« bringt das plötzliche Verschwinden idiomatisch zum Ausdruck.
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: ganz gewiss macht
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam die Aussage; »ganz gewiss« gibt diese Nachdrücklichkeit wieder.
- source_word: לּוֹ
  choice: sich
  rationale: Der Dativ bezeichnet hier, dass der Reichtum sich selbst Flügel verschafft. Das reflexive »sich« ist im Deutschen knapp und klar.
- source_word: כְנָפַיִם
  choice: Flügel
  rationale: Direkte Entsprechung, die das zentrale poetische Bild bewahrt.
- source_word: כְנֶשֶׁר
  choice: wie ein Adler
  rationale: נשר bezeichnet einen großen Greifvogel und wird traditionell und bildlich passend als »Adler« wiedergegeben; die mögliche zoologische Alternative wird in einer Fußnote erhalten.
- source_word: וְעָף
  choice: fliegt es
  rationale: 'Die finite Form schildert anschaulich das Ergebnis: Der Reichtum entzieht sich im Flug.'
- source_word: הַשָּׁמָיִם
  choice: zum Himmel empor
  rationale: שמים bezeichnet hier den sichtbaren Himmel. »Zum Himmel empor« gibt Richtung und poetische Höhe natürlich wieder, ohne den Ausdruck als Aussage über das Jenseits zu deuten.
