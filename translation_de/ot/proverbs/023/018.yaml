source:
  edition: WLC
  text: כִּ֭י אִם יֵ֣שׁ אַחֲרִ֑ית וְ֝/תִקְוָתְ/ךָ֗ לֹ֣א תִכָּרֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/018.yaml
  text: For surely there is a future[a], and your hope will not be cut off.
translation:
  language: de
  text: Denn gewiss gibt es eine Zukunft[a], und deine Hoffnung wird nicht abgeschnitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Ausgang“ bzw. „ein Ende“. Das hebräische Wort אַחֲרִית kann ein Ende, den späteren Ausgang oder die Zukunft bezeichnen. Hier steht „Zukunft“, weil der Zusammenhang von positiver Erwartung geprägt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn gewiss
  rationale: Die Wendung leitet hier eine nachdrückliche Zusicherung ein und knüpft zugleich begründend an den vorherigen Vers an. „Denn gewiss“ bewahrt beide Funktionen; eine bedingte Wiedergabe mit „wenn“ wäre irreführend.
- source_word: יֵשׁ
  choice: gibt es
  rationale: Die Existenzpartikel wird im modernen Deutschen natürlich mit „es gibt“ wiedergegeben.
- source_word: אַחֲרִית
  choice: eine Zukunft
  rationale: Das Wort kann Ende, Ausgang, spätere Folge oder Zukunft bezeichnen. Im Zusammenhang der positiven Erwartung passt „Zukunft“ am besten, ohne die möglichen Bedeutungsnuancen zu verschweigen.
- source_word: וְתִקְוָתְךָ
  choice: und deine Hoffnung
  rationale: תִּקְוָה bezeichnet Hoffnung oder Erwartung. „Hoffnung“ ist hier natürlich und entspricht der positiven Zusicherung.
- source_word: לֹא תִכָּרֵת
  choice: wird nicht abgeschnitten
  rationale: Die Wiedergabe erhält das hebräische Bild des Abschneidens. Im Deutschen ist die Verbindung mit „Hoffnung“ verständlich, wenn auch bewusst bildhaft.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe am hebräischen Bild und bewahrt bei אַחֲרִית die echte Bedeutungsbreite durch eine Fußnote.
