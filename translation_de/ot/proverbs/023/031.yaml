  text: אַל תֵּ֥רֶא יַיִן֮ כִּ֪י יִתְאַ֫דָּ֥ם כִּֽי יִתֵּ֣ן ב/כיס עֵינ֑/וֹ יִ֝תְהַלֵּ֗ךְ בְּ/מֵישָׁרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/031.yaml
  text: Do not look at wine when it is red[a], when it sparkles in the cup[b], when it goes down smoothly.
translation:
  language: de
  text: Schau den Wein nicht an, wenn er rot schimmert, wenn er im Becher funkelt[a], wenn er sanft hinuntergleitet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn er sein Auge im Becher gibt“; eine bildhafte hebräische Wendung für das anziehende Aussehen des Weins.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wenn er geradewegs dahingeht“. Gemeint ist wahrscheinlich, dass der Wein leicht oder angenehm hinuntergeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֵּרֶא
  choice: Schau … nicht an
  rationale: אַל mit dem Imperfekt formuliert ein Verbot. ראה bezeichnet hier nicht bloß das Wahrnehmen, sondern das aufmerksame, begehrliche Anschauen.
- source_word: יַיִן
  choice: Wein
  rationale: Die übliche und direkte Wiedergabe des allgemeinen hebräischen Wortes für Wein.
- source_word: כִּי יִתְאַדָּם
  choice: wenn er sich rot färbt
  rationale: כִּי leitet in der poetischen Folge am natürlichsten den Zeitpunkt beziehungsweise Umstand ein. Die Hitpael-Form von אדם beschreibt, wie der Wein rot erscheint oder seine rote Farbe zeigt.
- source_word: כִּי יִתֵּן בַכּוֹס עֵינוֹ
  choice: wenn er im Becher funkelt
  rationale: Wörtlich gibt der Wein „sein Auge“ im Becher. Das bildhafte Funkeln gibt seine anziehende sichtbare Erscheinung in natürlichem Deutsch wieder; die ungewöhnliche hebräische Wendung wird in der Fußnote bewahrt.
- source_word: יִתְהַלֵּךְ בְּמֵישָׁרִים
  choice: wenn er glatt hinuntergleitet
  rationale: Die Verbindung beschreibt hier wahrscheinlich, wie leicht und angenehm der Wein beim Trinken hinuntergeht. „Hinuntergleitet“ bewahrt das Bewegungsbild, während „glatt“ die adverbiale Bedeutung von בְּמֵישָׁרִים im Kontext ausdrückt.
