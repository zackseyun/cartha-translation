  source_fidelity: 'Die Hauptfassung gibt אַל תִּיגַע לְהַעֲשִׁיר idiomatisch und treffend wieder. Der zweite Halbvers ist im Hebräischen komprimiert: מִבִּינָתְךָ kann bei חֲדָל als das, wovon man ablassen soll, oder in einer kausal bzw. instrumentalen Nuance verstanden werden. „Hör auf, dich auf deinen eigenen Verstand zu verlassen“ ist eine vertretbare, kontextuell gut begründete Erschließung, ohne den Wortlaut als einzig mögliche Lesart auszugeben. Die Fußnote bewahrt sowohl die näher am Hebräischen bleibende als auch die kausale Alternative.'
