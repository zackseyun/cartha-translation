  terminology: „Sich abmühen“ vermittelt die erschöpfende Anstrengung von יגע angemessen; „reich zu werden“ ist für den zielgerichteten Infinitiv idiomatisch. „Verstand“ ist für בינה in diesem Zusammenhang möglich und verständlich. „Deinen eigenen“ macht das Possessivsuffix idiomatisch sichtbar, ohne eine zusätzliche Lehraussage einzutragen.
