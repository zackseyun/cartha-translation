  text: אַל תִּיגַ֥ע לְֽ/הַעֲשִׁ֑יר מִֽ/בִּינָתְ/ךָ֥ חֲדָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/004.yaml
  text: Do not wear yourself out to get rich[a]; stop relying on your own understanding.
translation:
  language: de
  text: Mühe dich nicht ab, reich zu werden[a]; hör auf, dich auf deinen eigenen Verstand zu verlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mühe dich nicht ab, reich zu werden; lass von deinem eigenen Verstand ab.“ Der hebräische zweite Halbvers ist knapp und kann auch verstanden werden als: „Aufgrund deiner Einsicht lass davon ab.“'
    reason: Lexikalische und syntaktische Alternative; die Beziehung von מִבִּינָתְךָ zu חֲדָל ist mehrdeutig.
lexical_decisions:
- source_word: אַל תִּיגַע
  choice: Mühe dich nicht ab
  rationale: Die Verbindung aus אַל und der Verbform von יגע formuliert ein Verbot und bezeichnet ermüdende, aufreibende Anstrengung. „Sich abmühen“ gibt dies im Deutschen natürlich wieder, ohne körperliche Erschöpfung zwingend vorauszusetzen.
- source_word: לְהַעֲשִׁיר
  choice: reich zu werden
  rationale: Der Hifil-Infinitiv von עשר bezeichnet hier das Ziel der Anstrengung. „Reich zu werden“ ist präzise und im Deutschen idiomatisch.
- source_word: מִבִּינָתְךָ חֲדָל
  choice: hör auf, dich auf deinen eigenen Verstand zu verlassen
  rationale: חדל bedeutet „aufhören, ablassen“, während בינה „Verstand, Einsicht“ bezeichnet. Die Präposition מִן markiert, wovon abzulassen ist. Die gewählte Fassung erschließt die knappe hebräische Wendung in natürlichem Deutsch; die wörtlichere, mehrdeutige Alternative wird in der Fußnote bewahrt.
theological_decisions:
- issue: Aussagekraft des zweiten Halbverses
  choice: Die Warnung richtet sich gegen das Vertrauen auf den eigenen Verstand beim Streben nach Reichtum.
  alternative: „Lass von deinem eigenen Verstand ab“ beziehungsweise „Aufgrund deiner Einsicht lass davon ab“.
  rationale: Der hebräische Ausdruck ist knapp und lässt den genauen Bezug offen. Die Hauptfassung bietet die im Zusammenhang naheliegende Bedeutung, ohne Weisheit an sich abzuwerten; die Fußnote bewahrt die sprachliche Mehrdeutigkeit und die theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchweisheits-Ton. Der Singular der Anrede bleibt erhalten; „eigene“ verdeutlicht das hebräische Possessivsuffix, ohne eine konfessionelle Deutung einzutragen.
