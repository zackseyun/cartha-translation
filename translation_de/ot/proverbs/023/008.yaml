  text: פִּֽתְּ/ךָ אָכַ֥לְתָּ תְקִיאֶ֑/נָּה וְ֝/שִׁחַ֗תָּ דְּבָרֶ֥י/ךָ הַ/נְּעִימִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/008.yaml
  text: You will vomit up the morsel you have eaten[a], and you will waste your pleasant words.
translation:
  language: de
  text: Den Bissen, den du gegessen hast, wirst du wieder erbrechen, und deine angenehmen Worte[a] wirst du verschwendet haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine freundlichen Worte“; auch möglich: „deine lieblichen Worte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְּךָ
  choice: den Bissen, den du gegessen hast
  rationale: פַּת bezeichnet ein Stück oder einen Bissen Brot beziehungsweise Nahrung. „Bissen“ bewahrt das knappe Bild, ohne Brot unnötig festzulegen; das Suffix der 2. Person Singular wird im Relativsatz natürlich wiedergegeben.
- source_word: תְקִיאֶנָּה
  choice: wirst du wieder erbrechen
  rationale: Das Verb קיא bezeichnet deutlich das Erbrechen. „wieder“ gibt idiomatisch wieder, dass der zuvor gegessene Bissen herauskommt; das feminine Objektsuffix bezieht sich auf פַּת.
- source_word: וְשִׁחַתָּ
  choice: hast du verschwendet
  rationale: שׁחת kann verderben, zunichtemachen oder vergeuden bezeichnen. Im Zusammenhang sind die freundlichen Worte erfolglos aufgewendet worden; das deutsche Perfekt gibt die im hebräischen Perfekt liegende Rückschau auf dieses Ergebnis natürlich wieder.
- source_word: דְּבָרֶיךָ הַנְּעִימִים
  choice: deine angenehmen Worte
  rationale: Die Wendung bezeichnet angenehme, freundliche oder wohlgefällige Rede. „angenehme Worte“ bleibt nah am Wortlaut und lässt die genaue Färbung offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Bildsprache. Der Tempusunterschied zwischen dem zukünftigen Erbrechen und der rückblickend als vergeblich erkannten Rede wird bewahrt.
