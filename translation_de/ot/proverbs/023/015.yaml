  text: My son[a], if your heart is wise, my heart also will rejoice.
translation:
  language: de
  text: Mein Sohn, wenn dein Herz weise ist, freut sich mein Herz – auch ich selbst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die wörtliche und im Kontext natürliche Anrede wird beibehalten; der hebräische Text verwendet den maskulinen Singular.
- source_word: אִם
  choice: wenn
  rationale: „Wenn“ gibt die reale Bedingung im modernen Deutschen natürlicher wieder als „falls“, ohne sie zeitlich als „sobald“ festzulegen.
- source_word: חָכַם לִבֶּךָ
  choice: dein Herz weise ist
  rationale: Das Perfekt des stativen Verbs bezeichnet hier im Bedingungssatz einen Zustand. „Herz“ bewahrt das hebräische Bild für das innere Denken und Wollen.
- source_word: יִשְׂמַח לִבִּי
  choice: freut sich mein Herz
  rationale: Das Imperfekt kann die aus der Bedingung folgende Reaktion ausdrücken. Das Präsens ist in einem deutschen Wenn-Satz idiomatisch und bewahrt die poetische Entsprechung von „dein Herz“ und „mein Herz“.
- source_word: גַם אֲנִי
  choice: auch mein Herz
  rationale: Die Formulierung gibt den additiven Nachdruck von גַם wieder. Das ausdrücklich gesetzte אֲנִי („ich“) verstärkt die persönliche Beteiligung und wird in der Fußnote als mögliche pointiertere Wiedergabe kenntlich gemacht.
