review_pass:
  verdict: revise
  source_fidelity: Der Text gibt die situative Einleitung כִּי, die Mahlzeit mit einem Machthaber und die emphatische Aufforderung בִּין תָּבִין grundsätzlich treffend wieder. Das hebräische אֶת אֲשֶׁר לְפָנֶיךָ ist absichtlich offen und kann das vorgesetzte Essen wie auch das vorliegende Umfeld meinen; diese Offenheit sollte erhalten bleiben.
  naturalness: „Wenn du dich zum Essen mit einem Herrscher setzt“ ist verständlich, aber die Stellung von „mit einem Herrscher“ klingt im Deutschen leicht angehängt. „Wenn du mit einem Herrscher zu Tisch sitzt“ ist idiomatischer und wahrt den Mahlzeitenkontext. „Achte genau auf“ ist möglich, aber „bedenke wohl“ bildet die emphatische Aufforderung zum einsichtigen Erwägen präziser und natürlich ab.
  terminology: „Herrscher“ ist für מוֹשֵׁל angemessen und wertneutral. „Zu Tisch sitzen“ ist eine moderne, klare Wiedergabe von לִלְחוֹם im Kontext einer Mahlzeit. Die Fußnote sollte nicht eine alternative Übersetzung der Aufforderung anbieten, während der Haupttext bereits eine andere Aufforderungsnuance hat; sinnvoller ist ein Hinweis auf die mögliche konkrete Referenz von „was vor dir ist“.
