    rationale: „Wenn du dich zum Essen mit einem Herrscher setzt“ kann nahelegen, dass das Sichsetzen mit dem Herrscher geschieht, wirkt aber stilistisch etwas schwerfällig. „Wenn du mit einem Herrscher zu Tisch sitzt“ ist im modernen Standarddeutsch flüssiger.
  - severity: medium
    issue: „Achte genau auf“ verengt בִּין תָּבִין auf bloßes Beobachten.
    rationale: Die Konstruktion Infinitivus absolutus plus Verb von בין fordert nachdrückliches Unterscheiden bzw. verständiges Erwägen. „Bedenke wohl“ bewahrt stärker die kognitive und warnende Dimension, ohne den folgenden Kontext vorwegzunehmen.
  - severity: low
    issue: Die vorhandene Fußnote ist als lexikalische Alternative uneinheitlich.
    rationale: Sie bietet „bedenke genau“ als Alternative zu „achte genau auf“, obwohl die Hauptaussage besser direkt so formuliert werden kann. Die relevante textliche Erläuterung betrifft vielmehr die offene Reichweite von „was vor dir ist“.
  revised_text: Wenn du mit einem Herrscher zu Tisch sitzt, bedenke wohl, was vor dir ist.[a]
