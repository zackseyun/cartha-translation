revisions:
- from: Wenn du dich zum Essen mit einem Herrscher setzt, achte genau auf das, was vor dir ist.[a]
  to: Wenn du mit einem Herrscher zu Tisch sitzt, bedenke wohl, was vor dir ist.[a]
  rationale: Die Revision verbessert die idiomatische deutsche Satzführung und gibt die nachdrückliche Aufforderung בִּין תָּבִין mit „bedenke wohl“ genauer wieder. Sie erhält die vom Hebräischen und vom englischen Audit Trail bezeugte Mehrdeutigkeit von „was vor dir ist“; die Fußnote erläutert diese Ambiguität, statt eine im Haupttext vermeidbare Alternativformulierung anzubieten.
