  language: en
  yaml_path: translation/ot/proverbs/023/001.yaml
  text: When you sit down to dine with a ruler[a], carefully consider what is before you.
translation:
  language: de
  text: Wenn du mit einem Herrscher zu Tisch sitzt, bedenke wohl, was vor dir ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische kann sich unmittelbar auf die vor dem Gast stehenden Speisen beziehen, lässt aber auch die weitere Situation anklingen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier keine Begründung, sondern eine typische Situation der Weisheitsunterweisung ein. „Wenn“ gibt diesen bedingten bzw. situativen Sinn natürlich wieder.
- source_word: תֵשֵׁב
  choice: du dich … setzt
  rationale: ישׁב bezeichnet hier das Sichsetzen zur Mahlzeit. Die reflexive deutsche Formulierung ist idiomatisch und bewahrt die konkrete Handlung.
- source_word: לִלְחוֹם
  choice: zum Essen
  rationale: Der Infinitiv von לחם bezeichnet in dieser Konstruktion die Teilnahme an einer Mahlzeit. „Zum Essen“ ist im modernen Deutschen natürlicher als „zu speisen“, ohne den Sinn abzuschwächen.
- source_word: אֶת־מוֹשֵׁל
  choice: mit einem Herrscher
  rationale: מוֹשֵׁל bezeichnet einen Menschen, der Herrschaft oder Autorität ausübt. Im Zusammenhang des Essens wird אֶת idiomatisch als Begleitung mit „mit“ wiedergegeben.
- source_word: בִּין תָּבִין
  choice: achte genau
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aufforderung. „Achte genau“ vermittelt sowohl die geforderte sorgfältige Wahrnehmung als auch die emphatische Kraft; der weitere Verszusammenhang zielt auf wachsame Einschätzung.
- source_word: אֶת אֲשֶׁר לְפָנֶיךָ
  choice: auf das, was vor dir ist
  rationale: Die Formulierung lässt sowohl das unmittelbar vorgesetzte Essen als auch die gesamte Situation vor dem Gast anklingen. Die offene Wiedergabe erhält diese Mehrdeutigkeit.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die offene Formulierung „was vor dir ist“ bewahrt die konkrete und zugleich mögliche übertragene Bedeutung des Hebräischen.
