base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/010.yaml
  text: Do not move an ancient boundary marker[a], and do not enter the fields of orphans,
translation:
  language: de
  text: Verrücke kein altes Grenzzeichen[a] und betrete nicht die Felder von Waisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verrücke keine seit alters bestehende Grenze und begib dich nicht auf die Felder der Vaterlosen.“'
    reason: 'Lexikalische Alternative: גְּבוּל kann abstrakter „Grenze“ bedeuten; עוֹלָם kann die lange Überlieferung der Grenze hervorheben; יְתוֹמִים bezeichnet besonders Vaterlose.'
lexical_decisions:
- source_word: תַּסֵּג
  choice: verrücke
  rationale: Das Verb נסג bezeichnet hier das Verschieben einer Grundstücksgrenze und damit einen widerrechtlichen Eingriff in fremden Besitz. „Verrücke“ gibt diesen konkreten Vorgang knapp und idiomatisch wieder.
- source_word: גְּבוּל
  choice: Grenzstein
  rationale: גְּבוּל kann „Grenze“ oder „Grenzgebiet“ bedeuten; im Zusammenhang mit dem Verb נסג ist konkret die Markierung einer Grundstücksgrenze gemeint. „Grenzstein“ macht den rechtlichen und gegenständlichen Sinn im Deutschen verständlich.
- source_word: עוֹלָם
  choice: uralt
  rationale: עוֹלָם bezeichnet hier eine seit langer Zeit bestehende, überlieferte Grenze, nicht metaphysische Ewigkeit. „Uralt“ bewahrt diesen zeitlichen Sinn in natürlichem Deutsch.
- source_word: וּ/בִ/שְׂדֵי
  choice: und ... in die Felder
  rationale: Die Präposition בְּ erhält mit dem Bewegungsverb תָּבֹא eine direktionale Bedeutung. „In die Felder“ ist daher die natürliche deutsche Wiedergabe.
- source_word: יְתוֹמִים
  choice: Waisen
  rationale: יָתוֹם bezeichnet besonders ein Kind, das den Vater verloren hat und deshalb sozial schutzlos ist. „Waisen“ ist die geläufige moderne Bezeichnung; die präzisere Alternative „Vaterlose“ wird in der Fußnote genannt.
- source_word: תָּבֹא
  choice: dringe ... ein
  rationale: Wörtlich bedeutet das Verb „kommen/hineingehen“. In dieser Warnung vor dem Betreten oder widerrechtlichen Aneignen fremder Felder bringt „eindringen“ den bedrohlichen Eingriff zum Ausdruck, ohne die Art des Übergriffs weiter festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Verbote bleibt erhalten; „Grenzstein“ konkretisiert den im hebräischen Grundstückskontext vorausgesetzten Grenzmarker, während die Fußnote die wörtlichere abstrakte Lesart bewahrt.
