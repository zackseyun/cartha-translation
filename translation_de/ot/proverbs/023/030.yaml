  yaml_path: translation/ot/proverbs/023/030.yaml
  text: For those who linger over wine[a], for those who come to search out mixed wine.
translation:
  language: de
  text: Für die, die lange beim Wein sitzen, für die, die kommen, um Mischwein zu suchen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gewürzten Wein“ beziehungsweise „ein gemischtes Getränk“. Das hebräische Wort bezeichnet einen zubereiteten Mischtrank, ohne die Zutaten näher zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֲרִים עַל הַיַּיִן
  choice: lange beim Wein sitzen
  rationale: Das Partizip von אחר bezeichnet hier ein langes Verweilen. Die deutsche Wendung ist natürlich und bringt im Kontext den anhaltenden Weingenuss zum Ausdruck, ohne die Aussage unnötig auszudeuten.
- source_word: בָּאִים
  choice: kommen
  rationale: Die Grundbedeutung des Verbs wird beibehalten; der folgende Infinitiv gibt den Zweck des Kommens an.
- source_word: לַחְקֹר
  choice: um … zu erproben
  rationale: חקר bedeutet untersuchen oder genau erkunden. Im Zusammenhang mit einem Getränk gibt „erproben“ das absichtliche Kennenlernen beziehungsweise Prüfen wieder und klingt natürlicher als „erforschen“.
- source_word: מִמְסָךְ
  choice: Mischwein
  rationale: Das Substantiv bezeichnet ein zubereitetes beziehungsweise gemischtes Weingetränk; die genaue Art der Beimischung bleibt offen.
