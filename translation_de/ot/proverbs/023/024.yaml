  text: גול יגול אֲבִ֣י צַדִּ֑יק יולד חָ֝כָ֗ם ו/ישמח בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/024.yaml
  text: The father of a righteous man will greatly rejoice[b][a]; he who fathers a wise son will be glad in him.
translation:
  language: de
  text: Der Vater eines Gerechten wird sich sehr freuen[a]; wer einen Weisen zeugt[b], wird sich über ihn freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »sich freuend wird er sich freuen«. Die Verdoppelung des Verbs verstärkt die Freude.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wer einen weisen Sohn zeugt«. Das Wort »Sohn« steht in dieser Vershälfte nicht ausdrücklich im Hebräischen, ist aber durch den familiären Zusammenhang nahegelegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גול יגול
  choice: freut sich sehr
  rationale: Die Verbindung aus Infinitivus absolutus und finiter Verbform verstärkt die Aussage. „Freut sich sehr“ gibt diese Intensivierung im Deutschen natürlich wieder.
- source_word: אֲבִי צַדִּיק
  choice: der Vater eines Gerechten
  rationale: Die Status-constructus-Verbindung bezeichnet den Vater eines einzelnen gerechten Menschen; die maskuline Singularform und der familiäre Zusammenhang bleiben erhalten.
- source_word: צַדִּיק
  choice: ein Gerechter
  rationale: „Gerechter“ ist die übliche und prägnante Wiedergabe der moralischen Bezeichnung und bewahrt den maskulinen Singular des Hebräischen.
- source_word: יולד
  choice: wer … gezeugt hat
  rationale: Das Partizip von ילד bezeichnet hier im Blick auf den Vater das Zeugen eines Kindes. Die deutsche Formulierung ist eindeutig und passt zum Parallelismus.
- source_word: חָכָם
  choice: einen Weisen
  rationale: Das Hebräische nennt ausdrücklich nur „einen Weisen“, nicht nochmals „Sohn“. Die Übersetzung bewahrt diese sprachliche Kürze, während der Zusammenhang die Sohnbeziehung erkennen lässt.
- source_word: וישמח בו
  choice: freut sich über ihn
  rationale: שמח bezeichnet Freude; בּוֹ verweist auf den Weisen als Anlass beziehungsweise Gegenstand dieser Freude. „Sich über ihn freuen“ ist dafür idiomatisches modernes Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Präsens gibt den allgemeinen Erfahrungs- und Weisheitssatz natürlich wieder. Der Parallelismus und die im Hebräischen vorhandene Spannung zwischen dem ausdrücklich genannten Vater und dem nur implizit als Sohn verstandenen Weisen bleiben erhalten.
