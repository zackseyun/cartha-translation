  yaml_path: translation/ot/proverbs/023/034.yaml
  text: And you will be like one lying down in the heart of the sea[a], like one lying down on the top of the mast.
translation:
  language: de
  text: Und du wirst sein wie jemand, der im Herzen des Meeres liegt, wie jemand, der oben in der Takelage[a] liegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Spitze eines Mastes“. Das seltene hebräische Wort kann sich auf Seile, Takelage oder verwandte Schiffsausrüstung beziehen; „Mast“ ist eine traditionelle, im Zusammenhang mögliche Deutung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: Und du wirst sein
  rationale: Das Qal-Perfekt mit וְ hat im Zusammenhang der Warnung zukunftsbezogene beziehungsweise folgernde Bedeutung und bewahrt die direkte Anrede.
- source_word: כְּשֹׁכֵב / וּכְשֹׁכֵב
  choice: wie einer, der … liegt
  rationale: Das Partizip von שׁכב bezeichnet hier das Liegen. Die Wiedergabe wahrt beide Vergleiche, ohne daraus ausdrücklich Schlaf zu machen.
- source_word: בְּלֶב יָם
  choice: im Herzen des Meeres
  rationale: לֵב bezeichnet wörtlich das „Herz“ und übertragen die Mitte. Die Formulierung erhält das anschauliche hebräische Bild und ist im Deutschen verständlich.
- source_word: בְּרֹאשׁ
  choice: oben im
  rationale: רֹאשׁ kann „Kopf“, „Spitze“ oder „oberster Teil“ bedeuten. Zusammen mit „Tauwerk“ bezeichnet „oben im“ natürlich den gefährlich hohen Ort.
- source_word: חִבֵּל
  choice: Tauwerk
  rationale: Das seltene nautische Wort wird mit חבל „Seil, Strick“ verbunden und kann Schiffstakelage beziehungsweise Tauwerk bezeichnen. „Tauwerk“ wahrt den nautischen Bezug, ohne die lexikalische Unsicherheit vorschnell auf „Mast“ festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Vergleichs und das Bild vom „Herzen des Meeres“ bleiben erhalten; die unsichere nautische Bezeichnung wird im Text nicht überpräzisiert und in der Fußnote erläutert.
