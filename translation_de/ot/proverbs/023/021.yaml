source:
  edition: WLC
  text: כִּי סֹבֵ֣א וְ֭/זוֹלֵל יִוָּרֵ֑שׁ וּ֝/קְרָעִ֗ים תַּלְבִּ֥ישׁ נוּמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/021.yaml
  text: For the drunkard and the glutton will come to poverty[a], and drowsiness will clothe one with rags.
translation:
  language: de
  text: Denn ein Säufer und ein Vielfraß verarmen, und Schläfrigkeit kleidet einen Menschen in Lumpen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֹבֵא
  choice: Säufer
  rationale: Das Substantiv bezeichnet einen gewohnheitsmäßig starken Trinker. „Säufer“ ist knapp, verständlich und bewahrt die moralische Charakterisierung des Spruchs.
- source_word: זוֹלֵל
  choice: Vielfraß
  rationale: Im Zusammenhang bezeichnet das Wort einen maßlosen, selbstgenügsamen Esser. „Vielfraß“ entspricht der unmittelbaren Verbindung mit dem Säufer und ist im Deutschen idiomatisch.
- source_word: יִוָּרֵשׁ
  choice: verarmen
  rationale: Das Nifal von ירש beschreibt hier das Armwerden als Folge des maßlosen Lebens, nicht den wörtlichen Verlust eines Landbesitzes.
- source_word: קְרָעִים
  choice: Lumpen
  rationale: Der Plural bezeichnet zerrissene oder zerlumpte Kleidung. „Lumpen“ gibt das anschauliche Bild schändlicher Armut natürlich wieder.
- source_word: תַּלְבִּישׁ
  choice: kleidet
  rationale: Das Hifil bedeutet „bekleiden“. Die wörtliche Metapher, nach der Schläfrigkeit jemanden mit Lumpen kleidet, bleibt damit erhalten.
- source_word: נוּמָה
  choice: Schläfrigkeit
  rationale: Das Substantiv kann Schläfrigkeit oder Schlummer bezeichnen. „Schläfrigkeit“ ist modernes Standarddeutsch und lässt im Kontext die Vorstellung träger Untätigkeit erkennen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Satzstruktur. Die personifizierende Kleidungsmetapher des Hebräischen bleibt direkt erhalten; „einen Menschen“ macht das unbestimmte Objekt im Deutschen natürlich, ohne es auf eine bestimmte Personengruppe einzugrenzen.
