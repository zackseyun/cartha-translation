source:
  edition: WLC
  text: כִּ֤י כְּמוֹ שָׁעַ֥ר בְּ/נַפְשׁ֗/וֹ כֶּ֫ן ה֥וּא אֱכֹ֣ל וּ֭/שְׁתֵה יֹ֣אמַר לָ֑/ךְ וְ֝/לִבּ֗/וֹ בַּל עִמָּֽ/ךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/007.yaml
  text: 'For as he calculates within himself[a], so he is: “Eat and drink,” he says to you, but his heart is not with you.'
translation:
  language: de
  text: Denn wie er bei sich rechnet[a], so ist er. »Iss und trink!«, sagt er zu dir, doch sein Herz ist nicht bei dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn wie er bei sich denkt, so ist er.« Das hebräische Verb kann das Denken bezeichnen, legt aber genauer ein Abwägen, Berechnen oder Abschätzen nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die Warnung im Zusammenhang und hat hier erklärende Funktion.
- source_word: כְּמוֹ ... כֵּן
  choice: wie ... so
  rationale: Die korrelative Vergleichskonstruktion wird im Deutschen knapp und formnah wiedergegeben.
- source_word: שָׁעַר
  choice: rechnet
  rationale: Das Verb bezeichnet ein inneres Abschätzen oder Berechnen; im Zusammenhang geht es um einen Gastgeber, der insgeheim die Kosten abwägt.
- source_word: בְּנַפְשׁוֹ
  choice: bei sich
  rationale: נֶפֶשׁ bezeichnet hier das innere Selbst. »Bei sich« drückt den verborgenen inneren Vorgang natürlich aus, ohne einen technischen Seelenbegriff einzuführen.
- source_word: כֵּן הוּא
  choice: so ist er
  rationale: Die knappe sprichwörtliche Aussage bleibt erhalten und stellt dem äußeren Reden das wirkliche Wesen des Mannes gegenüber.
- source_word: אֱכֹל וּשְׁתֵה
  choice: Iss und trink!
  rationale: Die beiden Imperative werden als direkte Einladung wiedergegeben; das Ausrufezeichen macht ihren einladenden Wortlaut deutlich, ohne den Sinn zu erweitern.
- source_word: יֹאמַר לָךְ
  choice: sagt er zu dir
  rationale: Das Präsens entspricht dem allgemeinen, sprichwörtlichen Charakter der Aussage.
- source_word: וְלִבּוֹ בַּל עִמָּךְ
  choice: doch sein Herz ist nicht bei dir
  rationale: Das verbindende וְ wird wegen des deutlichen Gegensatzes adversativ übersetzt. Das Bild vom Herzen und die relationale Wendung »bei dir« bleiben erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Die bildhafte Rede vom Herzen bleibt bewahrt; die mögliche Bedeutungsbreite des seltenen Verbs שָׁעַר wird in der Fußnote offengehalten.
