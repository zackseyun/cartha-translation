  text: אַל תִּלְחַ֗ם אֶת לֶ֭חֶם רַ֣ע עָ֑יִן וְ/אַל תתאו לְ/מַטְעַמֹּתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/006.yaml
  text: Do not eat the bread of a man with an evil eye[a], and do not crave his delicacies.
translation:
  language: de
  text: Iss nicht das Brot eines missgünstigen Menschen[a], und begehre nicht seine Köstlichkeiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Brot eines bösen Auges“. Die hebräische Wendung bezeichnet einen missgünstigen, geizigen oder widerwillig gebenden Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּלְחַם
  choice: iss
  rationale: In Verbindung mit לֶחֶם bezeichnet das Verb hier das Essen; „iss“ gibt den schlichten Sinn unmittelbar wieder und vermeidet eine Verwechslung mit dem gleichlautenden Verb für „kämpfen“.
- source_word: לֶחֶם
  choice: Brot
  rationale: „Brot“ bewahrt das konkrete hebräische Bild, auch wenn es im Zusammenhang allgemein für Speise oder Mahlzeit stehen kann.
- source_word: רַע עָיִן
  choice: eines Menschen mit bösem Blick
  rationale: Die Formulierung erhält das hebräische Augen-Bild, ohne die Wendung vorschnell auf nur eine Eigenschaft einzuengen; eine Fußnote erläutert den idiomatischen Sinn.
- source_word: תתאו
  choice: begehre
  rationale: Das Verb bezeichnet ein starkes Verlangen. „Begehre“ ist knapp, würdig und richtet die Warnung auch auf das innere Verlangen.
- source_word: לְמַטְעַמֹּתָיו
  choice: seine Köstlichkeiten
  rationale: Das Wort meint wohlschmeckende, besonders verlockende Speisen; „Köstlichkeiten“ ist im modernen Deutschen verständlich und erhält diesen Reiz.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Verbform „Iss nicht … und begehre nicht …“ bewahrt die knappe Mahnung; das fremdartige hebräische Bild bleibt im Haupttext stehen und wird in der Fußnote verständlich erläutert.
