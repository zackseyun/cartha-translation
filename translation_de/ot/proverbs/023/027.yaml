id: PRO.23.27
reference: Proverbs 23:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי שׁוּחָ֣ה עֲמֻקָּ֣ה זוֹנָ֑ה וּ/בְאֵ֥ר צָ֝רָ֗ה נָכְרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/027.yaml
  text: For a prostitute is a deep pit[a], and a foreign woman is a narrow well.
translation:
  language: de
  text: Denn eine Prostituierte ist eine tiefe Grube, und eine fremde Frau[a] ist ein enger Brunnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine andere Frau«; sinngemäß wird auch »eine Ehebrecherin« übersetzt.'
    reason: Bewahrt die Bedeutungsbreite von נָכְרִיָּה zwischen Fremdheit beziehungsweise Nichtzugehörigkeit und der kontextuell naheliegenden sexuellen Untreue.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorangehenden Warnung ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: שׁוּחָה עֲמֻקָּה
  choice: eine tiefe Grube
  rationale: Bewahrt das konkrete Bild einer tiefen, gefährlichen Vertiefung, ohne es bereits als Falle auszudeuten.
- source_word: זוֹנָה
  choice: Prostituierte
  rationale: Gibt die konkrete Bedeutung modern und sachlich wieder und vermeidet sowohl veraltete als auch unnötig grobe Bezeichnungen.
- source_word: וּבְאֵר צָרָה
  choice: und … ein enger Brunnen
  rationale: בְּאֵר bezeichnet gewöhnlich einen Brunnen; צָרָה beschreibt ihn als eng oder beengt und vermittelt so das Bild, dass ein Entkommen schwierig ist.
- source_word: נָכְרִיָּה
  choice: eine fremde Frau
  rationale: Bewahrt den lexikalischen Sinn und zugleich die für die Spruchliteratur charakteristische Mehrdeutigkeit zwischen einer auswärtigen, nicht zum eigenen Haus gehörenden und moralisch problematisch dargestellten Frau.
theological_decisions:
- issue: Wiedergabe von נָכְרִיָּה in der Warnsprache der Weisheitsliteratur
  choice: eine fremde Frau
  alternative: eine andere Frau; eine Ehebrecherin
  rationale: Der hebräische Ausdruck bezeichnet zunächst eine fremde oder außenstehende Frau, trägt im Kontext der Sprüche jedoch sexuelle und moralische Untertöne. Die Hauptübersetzung hält am Wortlaut fest; die Fußnote nennt mögliche kontextuelle Deutungen, ohne den Ausdruck vorschnell auf Ehebruch festzulegen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die parallelen Bilder »tiefe Grube« und »enger Brunnen« bleiben konkret erhalten; »Prostituierte« ist bewusst sachlich statt archaisch oder derb formuliert.
