source:
  edition: WLC
  text: אַל תְּהִ֥י בְ/סֹֽבְאֵי יָ֑יִן בְּ/זֹלֲלֵ֖י בָשָׂ֣ר לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/020.yaml
  text: Do not be among heavy drinkers of wine[a], among gluttonous eaters of meat,
translation:
  language: de
  text: Halte dich nicht zu denen, die zu viel Wein trinken, und zu denen, die maßlos Fleisch essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise: »die für sich selbst Fleisch verschlingen«; das abschließende hebräische Wort לָמוֹ ist syntaktisch schwierig und kann auch lediglich die vorangehende Aussage verstärken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Halte dich nicht zu
  rationale: Die Verneinung אַל mit der Jussivform von היה spricht ein Verbot aus. Im Zusammenhang bezeichnet »sein bei« die Zugehörigkeit oder den Umgang mit einer Gruppe; »Halte dich nicht zu« gibt dies natürlich und prägnant wieder.
- source_word: בְסֹבְאֵי יָיִן
  choice: zu denen, die sich mit Wein betrinken
  rationale: בְ bezeichnet hier die Gemeinschaft mit anderen. סבא meint übermäßiges Trinken, nicht bloß den Konsum von Wein. Die verbale Formulierung bewahrt den Bezug auf das gewohnheitsmäßige Verhalten, ohne eine altertümliche Personenbezeichnung zu verwenden.
- source_word: בְזֹלֲלֵי בָשָׂר
  choice: zu denen, die sich an Fleisch überessen
  rationale: זלל bezeichnet maßloses oder ungezügeltes Essen; בָשָׂר ist hier Fleisch als Speise. »Sich an Fleisch überessen« gibt die Tätigkeit verständlich und ohne unnötige Verallgemeinerung wieder.
- source_word: לָמוֹ
  choice: nicht gesondert wiedergegeben
  rationale: Das abschließende לָמוֹ ist syntaktisch schwierig und kann idiomatisch oder verstärkend zur vorangehenden Wendung gehören. Eine ausdrückliche Wiedergabe im Haupttext würde eine unsichere Deutung festlegen; die Möglichkeit wird daher in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Formulierung mit »zu denen« bildet die hebräische Struktur ab; die Umschreibungen benennen das maßlose Verhalten statt die Personen mit stigmatisierenden Substantiven zu etikettieren.
