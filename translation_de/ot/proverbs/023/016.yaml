review_pass:
  verdict: revise
  source_fidelity: 'Der Hauptsinn wird zutreffend wiedergegeben: Das hebräische Subjekt כִּלְיוֹתַי („meine Nieren“) ist idiomatisch als „mein Innerstes“ übertragen, und die Zukunftsnuance von תַעְלֹזְנָה bleibt erhalten. Die temporale Verbindung von בְּדַבֵּר ist mit „wenn“ angemessen. Für מֵישָׁרִים ist jedoch „aufrichtig“ nicht ganz präzise genug, da es im heutigen Deutsch primär persönliche Ehrlichkeit bzw. Unverstelltheit ausdrücken kann, während der hebräische Ausdruck das Gerade, Rechte bzw. sittlich Richtige bezeichnet.'
  naturalness: „Deine Lippen aufrichtig reden“ ist verständlich, wirkt im modernen Standarddeutsch aber etwas ungewohnt. „Wenn deine Lippen reden, was recht ist“ ist idiomatischer und bewahrt zugleich die poetische Nennung der Lippen.
  terminology: „Mein Innerstes“ ist eine geeignete, nicht überdeutende Wiedergabe der hebräischen Nieren-Metapher. „Was recht ist“ gibt die ethische und bildliche Bedeutung von מֵישָׁרִים klarer wieder als „aufrichtig“.
  issues:
