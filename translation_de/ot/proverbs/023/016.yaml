  text: וְ/תַעְלֹ֥זְנָה כִלְיוֹתָ֑/י בְּ/דַבֵּ֥ר שְׂ֝פָתֶ֗י/ךָ מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/016.yaml
  text: and my inmost being will rejoice when your lips speak what is upright[a][b].
translation:
  language: de
  text: Und mein Innerstes wird jubeln, wenn deine Lippen reden, was recht ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Meine Nieren werden jubeln.“ Die Nieren stehen im Hebräischen bildhaft für das tiefste Innere und die innersten Empfindungen.'
    reason: cultural_note
lexical_decisions:
- source_word: וְתַעְלֹזְנָה
  choice: wird jubeln
  rationale: Das Verb עלז bezeichnet lebhafte, überschwängliche Freude. „Wird jubeln“ bewahrt diese Intensität und die Zukunftsform.
- source_word: כִלְיוֹתָי
  choice: mein Innerstes
  rationale: Wörtlich steht „meine Nieren“. Im Hebräischen bezeichnen sie bildhaft das tiefste Innere beziehungsweise den Sitz innerer Empfindungen; „mein Innerstes“ gibt den Sinn im heutigen Deutsch verständlich wieder.
- source_word: בְּדַבֵּר
  choice: wenn … reden
  rationale: Die Präposition ב mit dem Infinitiv construct ist hier temporal zu verstehen. Die Wiedergabe mit „wenn“ entspricht natürlichem Deutsch.
- source_word: שְׂפָתֶיךָ
  choice: deine Lippen
  rationale: Das konkrete poetische Bild des hebräischen Textes bleibt erhalten und ist im Deutschen verständlich.
- source_word: מֵישָׁרִים
  choice: aufrichtig
  rationale: Der Ausdruck bezeichnet Geradheit beziehungsweise das moralisch Rechte. Adverbiales „aufrichtig reden“ ist natürliches Deutsch und bewahrt die ethische Bedeutung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Bild „deine Lippen“. Die anatomische Metapher „meine Nieren“ wird im Haupttext verständlich übertragen und in der Fußnote offengelegt.
