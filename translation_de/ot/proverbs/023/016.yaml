    issue: „aufrichtig reden“ für מֵישָׁרִים
    rationale: Die Formulierung kann vor allem die Aufrichtigkeit des Sprechenden bezeichnen. Der hebräische Ausdruck zielt hier auf das, was gerade, richtig oder recht ist. Eine Objektkonstruktion verdeutlicht dies natürlicher und genauer.
  revised_text: Und mein Innerstes wird jubeln, wenn deine Lippen reden, was recht ist.[a]
