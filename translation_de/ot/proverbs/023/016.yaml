- from: Und mein Innerstes wird jubeln, wenn deine Lippen aufrichtig reden.[a]
  to: Und mein Innerstes wird jubeln, wenn deine Lippen reden, was recht ist.[a]
  rationale: Die Revision ersetzt die potenziell mehrdeutige und leicht unidiomatische Wendung „deine Lippen aufrichtig reden“ durch „deine Lippen reden, was recht ist“. Dadurch wird die ethische Bedeutung von מֵישָׁרִים präziser wiedergegeben, ohne die konkrete poetische Bildsprache des hebräischen Textes aufzugeben. Die Fußnote bleibt sachlich und legt die kulturelle Metapher offen.
