  text: שְׁמַ֣ע לְ֭/אָבִי/ךָ זֶ֣ה יְלָדֶ֑/ךָ וְ/אַל תָּ֝ב֗וּז כִּֽי זָקְנָ֥ה אִמֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/022.yaml
  text: Listen to your father[a], who fathered you[b], and do not despise your mother when she is old.
translation:
  language: de
  text: Höre auf deinen Vater, der dich gezeugt hat, und verachte deine Mutter nicht, wenn sie alt geworden ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil sie alt geworden ist“. Das hebräische כִּי kann hier auch begründend verstanden werden; wahrscheinlich bezeichnet es jedoch den Umstand beziehungsweise Zeitpunkt, in dem die Mahnung besonders gilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע לְאָבִיךָ
  choice: Höre auf deinen Vater
  rationale: Der Imperativ שׁמע mit ל fordert hier nicht nur akustisches Hören, sondern aufmerksames Beachten und Gehorchen. „Auf jemanden hören“ gibt dies im modernen Deutschen natürlich wieder.
- source_word: זֶה יְלָדֶךָ
  choice: der dich gezeugt hat
  rationale: Das Demonstrativpronomen זֶה hebt den eben genannten Vater hervor und leitet sinngemäß die nähere Bestimmung ein. „Der“ ist im Deutschen idiomatisch; ילד bezeichnet beim männlichen Subjekt das Zeugen.
- source_word: וְאַל־תָּבוּז
  choice: und verachte … nicht
  rationale: בוז bezeichnet Geringschätzung oder Verachtung. Die knappe Wiedergabe wahrt die Stärke der Mahnung.
- source_word: כִּי זָקְנָה אִמֶּךָ
  choice: wenn sie alt geworden ist
  rationale: כִּי bezeichnet hier am besten den zeitlichen beziehungsweise situativen Umstand. Das Perfekt זָקְנָה beschreibt das eingetretene Altwerden und den daraus entstandenen Zustand.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gezeugt“ ist präzise und in diesem weisheitlichen Kontext verständlich; „Höre auf“ bewahrt den Aufforderungscharakter. Die mögliche zeitliche oder kausale Deutung von כִּי wird nicht stillschweigend beseitigt, sondern in der Fußnote offengelegt.
