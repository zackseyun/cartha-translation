  source_fidelity: Die Übersetzung gibt die Imperativaufforderung שְׁמַע לְאָבִיךָ idiomatisch als „Höre auf deinen Vater“ wieder. Die demonstrativ hervorgehobene nähere Bestimmung זֶה יְלָדֶךָ wird natürlich und sachlich zutreffend durch „der dich gezeugt hat“ ausgedrückt. „Verachte … nicht“ trifft die Bedeutung von בוז, und „wenn sie alt geworden ist“ bildet die wahrscheinlich situativ-zeitliche Funktion von כִּי sowie den erreichten Zustand des Perfekts זָקְנָה angemessen ab.
