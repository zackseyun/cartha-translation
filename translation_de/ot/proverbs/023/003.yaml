  text: אַל תִּ֭תְאָו לְ/מַטְעַמּוֹתָ֑י/ו וְ֝/ה֗וּא לֶ֣חֶם כְּזָבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/003.yaml
  text: Do not crave his delicacies[a], for they are deceptive food.
translation:
  language: de
  text: Begehre seine Köstlichkeiten nicht, denn sie sind trügerische Speisen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „und es ist Brot der Lügen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתְאָו
  choice: Begehre … nicht
  rationale: Die Verneinung אַל mit der Verbform drückt ein Verbot aus; תִּתְאָו bezeichnet starkes Verlangen. „Begehre … nicht“ ist knapp, würdig und gibt die innere Begierde wieder.
- source_word: לְמַטְעַמּוֹתָיו
  choice: seine Köstlichkeiten
  rationale: Das Wort bezeichnet schmackhafte, erlesene Speisen. „Köstlichkeiten“ ist im heutigen Deutsch natürlich und bewahrt deren verlockenden Charakter.
- source_word: וְהוּא
  choice: denn sie sind
  rationale: Das hebräische Pronomen steht im Singular („er/es“), nimmt hier aber die Speisen als kollektive Größe auf. Im Deutschen ist der Pluralbezug auf „Köstlichkeiten“ natürlich; „denn“ macht deutlich, dass der zweite Satzteil den Grund für die Warnung nennt.
- source_word: לֶחֶם
  choice: Speise
  rationale: לֶחֶם kann neben „Brot“ allgemein Nahrung oder Speise bezeichnen. „Speise“ passt zum Zusammenhang der aufgetragenen Köstlichkeiten und erhält einen würdigen Ton.
- source_word: כְּזָבִים
  choice: trügerische
  rationale: Der Plural „Lügen/Täuschungen“ bestimmt die Speise näher. „Trügerisch“ vermittelt idiomatisch, dass das angebotene Essen beziehungsweise die damit verbundene Gastfreundschaft nicht so harmlos ist, wie sie erscheint.
