source:
  edition: WLC
  text: אַל תִּמְנַ֣ע מִ/נַּ֣עַר מוּסָ֑ר כִּֽי תַכֶּ֥/נּוּ בַ֝/שֵּׁ֗בֶט לֹ֣א יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/013.yaml
  text: Do not withhold discipline from a boy[a], for if you strike him with the rod[b], he will not die.
translation:
  language: de
  text: Enthalte einem Jungen[a] Erziehung nicht vor; denn wenn du ihn mit der Rute[b] schlägst, wird er nicht sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einem Kind« oder »einem jungen Menschen«. Das hebräische Wort kann einen Jungen oder allgemeiner einen jungen Menschen bezeichnen; der Haupttext bewahrt die maskuline Singularform des Spruchs.'
    reason: lexical_alternative
  - marker: b
    text: Der Spruch behauptet, dass das Schlagen mit der Rute an sich nicht tödlich ist. Er ist weder eine pauschale Billigung missbräuchlicher Gewalt noch eine ausnahmslose Garantie für jeden Einzelfall.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Entziehe ... nicht
  rationale: Die Verbindung aus Verneinung und Verb formuliert ein Verbot; „jemandem etwas entziehen“ gibt das Zurückhalten von Erziehung im Deutschen knapp und natürlich wieder.
- source_word: מִנַּעַר
  choice: einem Jungen
  rationale: נַעַר bezeichnet je nach Zusammenhang einen Jungen, ein Kind oder einen jungen Menschen. „Junge“ bewahrt hier die maskuline Singularform und passt zum Erziehungskontext.
- source_word: מוּסָר
  choice: Erziehung
  rationale: מוּסָר umfasst im Sprüchebuch Unterweisung, Zurechtweisung und disziplinierende Erziehung. „Erziehung“ ist im modernen Deutsch verständlich und breit genug, während der folgende Satz die körperliche Züchtigung konkret benennt.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung der vorausgehenden Mahnung ein.
- source_word: תַכֶּנּוּ
  choice: du ihn ... schlägst
  rationale: נכה bezeichnet konkret das Schlagen. Die direkte Wiedergabe vermeidet sowohl eine Abschwächung zu „zurechtweisen“ als auch die stärkere Festlegung durch „verprügeln“.
- source_word: בַשֵּׁבֶט
  choice: mit der Rute
  rationale: שֵׁבֶט kann Stab, Rute, Zepter oder Stamm bedeuten. Im Zusammenhang körperlicher Erziehung ist „Rute“ die etablierte und sachlich passende Bedeutung.
- source_word: לֹא יָמוּת
  choice: wird er nicht sterben
  rationale: Die einfache verneinte Verbform wird ohne erklärende Ergänzung wiedergegeben und bewahrt die zugespitzte Aussage des Spruchs.
theological_decisions:
- issue: Geschlecht und Bedeutungsumfang von נַעַר
  choice: Im Haupttext „Junge“
  alternative: „Kind“ oder „junger Mensch“
  rationale: Das hebräische Substantiv und die folgenden Bezüge stehen im maskulinen Singular. Die Fußnote hält den weiteren möglichen Bedeutungsumfang fest, ohne die Form des Haupttextes zu neutralisieren.
- issue: Aussage über körperliche Züchtigung
  choice: Die Aussage „wird er nicht sterben“ unverändert direkt wiedergeben
  alternative: „wird er daran nicht sterben“ oder eine abschwächende Umschreibung
  rationale: Der hebräische Text formuliert eine knappe sprichwörtliche Versicherung. Eine Einschränkung im Haupttext würde die Spannung voreilig auflösen; die notwendige sachliche Einordnung steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen Mahnform eines Weisheitsspruchs. „Erziehung“ bildet das breitere מוּסָר ab; „Rute“ und „schlägst“ erhalten das konkrete und für heutige Leser anstößige Bild, statt es zu beschönigen.
