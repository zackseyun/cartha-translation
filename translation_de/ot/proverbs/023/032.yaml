base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/032.yaml
  text: In the end it bites like a snake[c][b][a], and it stings like a viper.
translation:
  language: de
  text: Am Ende[a] beißt er wie eine Schlange und sticht wie eine Viper[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sein Ende“. Gemeint ist die schließliche Auswirkung des Weins, von dem im Zusammenhang die Rede ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Otter“. Das hebräische Wort bezeichnet eine Giftschlange.'
    reason: lexical_alternative
  - marker: c
    text: Das letzte hebräische Verb ist schwer zu bestimmen. Traditionell wird es mit „sticht“ wiedergegeben; vorgeschlagen werden auch „stößt zu“ oder „verspritzt Gift“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִיתוֹ
  choice: Am Ende
  rationale: Das Substantiv אַחֲרִית mit Suffix bezeichnet hier das spätere Ende beziehungsweise die schließliche Auswirkung des zuvor beschriebenen Weins. Die adverbiale Wiedergabe ist im Deutschen natürlich und bewahrt den zeitlich-folgenhaften Sinn.
- source_word: כְּנָחָשׁ
  choice: wie eine Schlange
  rationale: נָחָשׁ ist die gewöhnliche Bezeichnung für eine Schlange. „Schlange“ ist im heutigen Deutsch natürlicher als das gehobenere „Schlangentier“ oder eine stärker symbolisch klingende Wiedergabe.
- source_word: יִשָּׁךְ
  choice: beißt er
  rationale: Das Verb נשׁך bedeutet „beißen“. Das Präsens entspricht dem allgemeinen, sprichwörtlichen Charakter. Das Pronomen „er“ nimmt im Kontext den Wein auf.
- source_word: וּכְצִפְעֹנִי
  choice: und … wie eine Viper
  rationale: צִפְעֹנִי bezeichnet eine Giftschlange. „Viper“ ist eine klare, gegenwärtige deutsche Bezeichnung; „Otter“ ist ebenfalls möglich.
- source_word: יַפְרִשׁ
  choice: sticht
  rationale: Das Verb ist lexikalisch schwierig. „Sticht“ folgt der traditionellen kontextbezogenen Deutung als verletzende Wirkung einer Giftschlange, ohne eine unsichere genaue Bewegungsart festzulegen; andere Deutungen werden in der Fußnote genannt.
