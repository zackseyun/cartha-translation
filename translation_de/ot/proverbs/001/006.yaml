translation:
  language: de
  text: um einen Spruch und eine Bildrede[a] zu verstehen, die Worte der Weisen und ihre Rätsel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Deutung“. Das hebräische Wort kann eine pointierte oder bildhafte Ausdrucksweise und in manchen Zusammenhängen auch einen deutenden Ausdruck bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre rätselhaften Aussprüche“. Gemeint sein können auch schwer verständliche Aussagen, über die man nachdenken muss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִין
  choice: um … zu verstehen
  rationale: Der Infinitiv mit לְ setzt die Zweckangaben der vorausgehenden Verse fort. Die deutsche Konstruktion „um … zu verstehen“ gibt diese Funktion natürlich wieder.
- source_word: מָשָׁל
  choice: einen Spruch
  rationale: מָשָׁל bezeichnet im Buch der Sprüche typischerweise einen Weisheits- oder Spruchtext. „Spruch“ passt zum deutschen Buchtitel und lässt zugleich die weitere Bedeutungsbreite des hebräischen Wortes offen.
- source_word: מְלִיצָה
  choice: eine kunstvolle Rede
  rationale: Das seltene Wort kann eine pointierte, kunstvoll formulierte Äußerung und möglicherweise auch eine deutende Ausdrucksweise bezeichnen. „Kunstvolle Rede“ bewahrt den gehobenen sprachlichen Aspekt, ohne den Ausdruck auf „Deutung“ festzulegen.
- source_word: דִּבְרֵי
  choice: die Worte
  rationale: Die direkte Wiedergabe des Constructus pluralis erhält die klare Verbindung mit „der Weisen“.
- source_word: חֲכָמִים
  choice: der Weisen
  rationale: Das substantivierte Adjektiv bezeichnet weise Menschen allgemein. „Der Weisen“ ist geschlechtsübergreifend verständlich und weniger interpretierend als „Weisheitslehrer“.
- source_word: חִידֹתָם
  choice: ihre Rätsel
  rationale: חִידָה bezeichnet Rätsel oder schwer verständliche, zum Nachdenken auffordernde Aussagen. „Ihre Rätsel“ gibt auch das pronominale Suffix unmittelbar wieder.
