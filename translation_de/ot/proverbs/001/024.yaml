  yaml_path: translation/ot/proverbs/001/024.yaml
  text: Because I called and you refused[a], I stretched out my hand and no one paid attention,
translation:
  language: de
  text: Weil ich rief und ihr euch weigertet, weil ich meine Hand ausstreckte und niemand aufmerksam zuhörte[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „darauf achtete“. Das hebräische Partizip bezeichnet aufmerksames Zuhören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Weil
  rationale: Leitet den Grund für die folgende Gerichtsankündigung ein und gibt die kausale Bedeutung natürlich wieder.
- source_word: קָרָאתִי
  choice: ich rief
  rationale: Das Verb bezeichnet hier den öffentlichen oder auffordernden Ruf der Weisheit; „rief“ ist direkt und passt zum poetischen Kontext.
- source_word: וַתְּמָאֵנוּ
  choice: und ihr euch weigertet
  rationale: מאן bedeutet „sich weigern, ablehnen“. Die reflexive Form ist im modernen Deutsch natürlich und bewahrt die bewusste Zurückweisung.
- source_word: נָטִיתִי יָדִי
  choice: meine Hand ausstreckte
  rationale: Die konkrete Geste des Hebräischen bleibt erhalten, ohne ihre mögliche Bedeutung als Einladung, Appell oder Warnung festzulegen.
- source_word: וְאֵין מַקְשִׁיב
  choice: und niemand aufmerksam zuhörte
  rationale: Das Partizip von קשב bezeichnet aufmerksames Hören. Die Vergangenheitsform fügt sich natürlich in die deutsche Satzfolge ein, während „aufmerksam zuhörte“ den lexikalischen Nachdruck wahrt.
theological_decisions: []
translation_notes:
  register: Poetisch, würdevoll und in modernem Standarddeutsch. Das zweite „ich“ wird wie im Hebräischen syntaktisch mitgeführt, wodurch die knappe Parallelstruktur erhalten bleibt. Das abschließende Komma zeigt, dass der Begründungssatz im folgenden Vers fortgesetzt wird.
