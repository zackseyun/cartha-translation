  text: אִם יֹאמְרוּ֮ לְכָ֪/ה אִ֫תָּ֥/נוּ נֶאֶרְבָ֥ה לְ/דָ֑ם נִצְפְּנָ֖ה לְ/נָקִ֣י חִנָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/011.yaml
  text: If they say[a], “Come with us, let us lie in wait for blood[b]; let us ambush the innocent without cause,”
translation:
  language: de
  text: 'Wenn sie sagen: „Komm mit uns! Wir wollen auf Blut lauern[a] und dem Unschuldigen grundlos nachstellen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „auf Blut“. Die knappe hebräische Wendung bezeichnet hier gewaltsames Blutvergießen oder Mord.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann wörtlicher „uns verbergen“ bedeuten; in diesem Zusammenhang meint es verborgenes Warten, um jemanden zu überfallen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֹאמְרוּ
  choice: Wenn sie sagen
  rationale: Die konditionale Einleitung der väterlichen Warnung wird unmittelbar und natürlich wiedergegeben.
- source_word: לְכָה אִתָּנוּ
  choice: Komm mit uns!
  rationale: Die Aufforderung lädt den Angesprochenen ausdrücklich zur Beteiligung an der Gruppe ein.
- source_word: נֶאֶרְבָה לְדָם
  choice: Wir wollen auf Blut lauern
  rationale: Die knappe, bedrohliche Bildsprache des Hebräischen und der Gedanke eines vorsätzlich geplanten Überfalls bleiben erhalten.
- source_word: נִצְפְּנָה
  choice: auflauern
  rationale: Das Verb kann wörtlicher ein Sichverbergen bezeichnen; im Parallelismus geht es um verborgenes Warten mit der Absicht eines Überfalls.
- source_word: לְנָקִי
  choice: dem Unschuldigen
  rationale: Das substantivierte Adjektiv kennzeichnet das Opfer ausdrücklich als schuldlos.
- source_word: חִנָּם
  choice: grundlos
  rationale: Das Adverb bringt knapp zum Ausdruck, dass es für den Angriff keinen rechtfertigenden Anlass gibt.
theological_decisions:
- issue: Moralische Kennzeichnung des Opfers
  choice: dem Unschuldigen
  alternative: dem Schuldlosen; einem Unschuldigen
  rationale: Die Übersetzung bewahrt die ethische Aussage des Verses, dass sich die geplante Gewalt gegen einen Menschen richtet, der keinen Anlass dazu gegeben hat, ohne darüber hinausgehende Lehrinhalte einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlich knappe Wendung „auf Blut lauern“ bleibt als bewusst bedrohliches Bild erhalten und wird in einer Fußnote erläutert; die parallelen Verben des hebräischen Textes werden nicht zu einer einzigen Handlung eingeebnet.
