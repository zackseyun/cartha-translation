  text: בְּ/רֹ֥אשׁ הֹמִיּ֗וֹת תִּ֫קְרָ֥א בְּ/פִתְחֵ֖י שְׁעָרִ֥ים בָּ/עִ֗יר אֲמָרֶ֥י/הָ תֹאמֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/021.yaml
  text: 'At the head of the noisy streets she cries out[c][b][a]; at the entrances of the gates in the city she speaks her words:'
translation:
  language: de
  text: 'An der Spitze des lärmenden Treibens ruft sie laut[a]; an den Torzugängen in der Stadt[b] spricht sie ihre Worte[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »An den vordersten lärmenden Orten ruft sie.« Der hebräische Ausdruck kann den vordersten oder besonders hervorgehobenen Bereich des öffentlichen Getümmels bezeichnen; auch eine erhöhte Lage ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: Die Stadttore waren zentrale öffentliche Treffpunkte. Dort fanden Handel, Rechtsprechung und andere Angelegenheiten des städtischen Lebens statt.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: »sagt sie ihre Worte«; gemeint ist, dass sie öffentlich das Wort ergreift.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹאשׁ הֹמִיּוֹת
  choice: Wo die belebten Straßen beginnen
  rationale: רֹאשׁ bezeichnet den Kopf, Anfang oder vordersten Teil; הֹמִיּוֹת meint von Lärm und geschäftigem Treiben geprägte Orte. Die Wiedergabe wahrt den räumlichen Sinn und klingt im Deutschen natürlich, ohne eine Anhöhe vorauszusetzen.
- source_word: תִּקְרָא
  choice: ruft sie laut
  rationale: קרא bedeutet hier öffentlich rufen oder ausrufen. Das ergänzte „laut“ bringt die im Kontext vorausgesetzte Hörbarkeit idiomatisch zum Ausdruck.
- source_word: בְּפִתְחֵי שְׁעָרִים בָּעִיר
  choice: an den Zugängen der Stadttore
  rationale: פֶּתַח bezeichnet Öffnung oder Zugang, שַׁעַר das Stadttor. Die Zusammensetzung „Stadttore“ gibt בָּעִיר knapp und natürlich wieder.
- source_word: אֲמָרֶיהָ תֹאמֵר
  choice: spricht sie ihre Worte
  rationale: Die ungewöhnliche Verbindung aus dem Substantiv „ihre Worte“ und dem Verb „sagen“ wird bewusst relativ nah am Hebräischen wiedergegeben; „spricht“ vermeidet das unnatürliche deutsche „sagt ihre Worte“.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: Die Weisheit wird mit „sie“ bezeichnet.
  alternative: Eine unpersönliche Wiedergabe wie „sie/es ruft“ vermeiden.
  rationale: Verbformen und Suffixe stehen im Hebräischen im Femininum Singular und führen die personifizierte Weisheit des Zusammenhangs fort, ohne darüber hinausgehende christologische oder konfessionelle Deutungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt signalisiert wie im Kontext den Beginn der folgenden direkten Rede. Die Formulierung bleibt bildhaft und öffentlich-räumlich, ohne die Mehrdeutigkeit von רֹאשׁ vollständig auf eine einzige räumliche Vorstellung festzulegen.
