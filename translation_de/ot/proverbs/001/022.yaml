  yaml_path: translation/ot/proverbs/001/022.yaml
  text: How long[a], O simple ones[b], will you love simplicity? How long will scoffers delight in scoffing and fools hate knowledge?
translation:
  language: de
  text: Wie lange noch, ihr Unerfahrenen, wollt ihr die Unerfahrenheit lieben?[a] Wie lange noch werden die Spötter am Spott Gefallen finden und die Toren Erkenntnis hassen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie lange, ihr Einfältigen, wollt ihr Einfalt lieben?“ Das Hebräische verwendet ein Wortspiel zwischen der Bezeichnung der Menschen und ihrer Haltung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתָיִם / פֶתִי
  choice: Unerfahrenen / Unerfahrenheit
  rationale: Die verwandten deutschen Wörter bilden das hebräische Wortspiel nach. „Unerfahrene“ bezeichnet hier beeinflussbare, sittlich noch ungefestigte Menschen, nicht bloß Personen mit geringer Intelligenz.
- source_word: תְּאֵהֲבוּ
  choice: wollt ihr … lieben
  rationale: In der tadelnden Frage gibt die Form eine fortdauernde, willentlich festgehaltene Haltung wieder; „wollt ihr … lieben“ klingt im Deutschen natürlich und bewahrt den vorwurfsvollen Ton.
- source_word: לֵצִים / לָצוֹן
  choice: Spötter / Spott
  rationale: Die verwandten Begriffe erhalten die lexikalische Verbindung des Hebräischen und bezeichnen in den Sprüchen Menschen, die Weisheit und Zurechtweisung hochmütig verhöhnen.
- source_word: חָמְדוּ
  choice: haben Gefallen an
  rationale: Das Verb kann „begehren“ oder „Verlangen haben“ bedeuten. In Verbindung mit Spott bezeichnet es hier die lustvolle Hinwendung dazu; „Gefallen haben“ ist idiomatisch, ohne die Haltung abzuschwächen.
- source_word: כְסִילִים
  choice: Toren
  rationale: „Toren“ bewahrt die wiederkehrende ethisch-geistliche Kategorie der Weisheitsliteratur und bezeichnet nicht lediglich mangelnde Intelligenz.
- source_word: יִשְׂנְאוּ
  choice: hassen
  rationale: Die starke Aussage des hebräischen Verbs bleibt unverändert erhalten.
- source_word: דָעַת
  choice: Erkenntnis
  rationale: „Erkenntnis“ ist im Kontext der Sprüche eine natürliche Wiedergabe für Wissen, das mit Weisheit und rechter Einsicht verbunden ist.
theological_decisions:
- issue: Bezeichnungen der Menschentypen in der Weisheitsliteratur
  choice: Die wiederkehrenden moralischen Kategorien „Unerfahrene“, „Spötter“ und „Toren“ bleiben unterscheidbar.
  alternative: Allgemeine psychologische Umschreibungen wie „Naive“, „Menschen, die sich lustig machen“, und „Unvernünftige“.
  rationale: Der Vers beschreibt ethisch-geistliche Haltungen und nicht bloß Temperamente oder intellektuelle Fähigkeiten. Die kategorialen Bezeichnungen wahren die Spannung und die Begriffswelt der Sprüche.
- issue: Geltungsbereich von עַד מָתַי („wie lange noch“)
  choice: Die Frage wird vor dem zweiten Parallelglied wiederholt und auf Spötter wie Toren bezogen.
  alternative: Nur die erste Anrede ausdrücklich als Frage wiedergeben und die beiden folgenden Aussagen grammatisch selbstständig anschließen.
  rationale: Die Wiederholung macht im Deutschen den naheliegenden Geltungsbereich der einleitenden Frage deutlich und erhält den dreigliedrigen Tadel, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Toren“ ist bewusst als etablierter Ausdruck der Weisheitsliteratur gewählt; „Unerfahrene“ vermeidet sowohl die heute oft positive Bedeutung von „Einfalt“ als auch eine rein intellektuelle Abwertung.
