  text: יִשְׁמַ֣ע חָ֭כָם וְ/י֣וֹסֶף לֶ֑קַח וְ֝/נָב֗וֹן תַּחְבֻּל֥וֹת יִקְנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/005.yaml
  text: Let the wise man hear and increase in learning[b][a], and the discerning man acquire guidance.
translation:
  language: de
  text: Der Weise höre zu und erweitere seine Kenntnisse[a]; der Verständige erwerbe kundige Anleitung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Weiser wird zuhören und seine Kenntnisse erweitern.“ Die hebräischen Imperfektformen können auch beschreibend verstanden werden; hier sind sie dem lehrhaften Zusammenhang entsprechend als Aufforderung wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: Der hebräische Ausdruck kann auch „kluge Beratung“, „umsichtige Führung“ oder „Strategien“ bedeuten und bezieht sich wörtlich auf Lenkung bzw. Steuerkunst.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: höre zu
  rationale: Das Imperfekt der 3. Person Singular wird im lehrhaften Zusammenhang auffordernd verstanden. „Zuhören“ gibt die beabsichtigte aufmerksame Aufnahme natürlicher wieder als das bloße „hören“.
- source_word: חָכָם
  choice: der Weise
  rationale: Die substantivisch gebrauchte maskuline Singularform wird als repräsentative Gestalt der Weisheitslehre wiedergegeben.
- source_word: וְיֹסֶף
  choice: und erweitere
  rationale: Das Verb יסף bedeutet „hinzufügen, vermehren“. Zusammen mit לֶקַח bezeichnet es eine Zunahme an Gelerntem; „seine Kenntnisse erweitern“ ist dafür im Deutschen idiomatisch.
- source_word: לֶקַח
  choice: seine Kenntnisse
  rationale: לֶקַח kann das Empfangene, die Lehre oder den Lerngewinn bezeichnen. „Kenntnisse“ passt natürlich zum Verb „erweitern“, ohne den Ausdruck auf formalen Unterricht zu beschränken.
- source_word: נָבוֹן
  choice: der Verständige
  rationale: Die Form bezeichnet einen Menschen mit Einsicht und Unterscheidungsvermögen. „Der Verständige“ wahrt die parallele substantivische Singularform.
- source_word: תַּחְבֻּלוֹת
  choice: kluge Orientierung
  rationale: Das Wort kann sachkundige Führung, Beratung, planvolles Lenken oder bildlich „Steuerung“ bezeichnen. „Kluge Orientierung“ hält diese Bedeutungsbreite offen und passt zum Weisheitskontext.
- source_word: יִקְנֶה
  choice: gewinne
  rationale: קנה bedeutet hier „erwerben, erlangen“. „Gewinnen“ ist in Verbindung mit abstrakter Orientierung natürlich und bewahrt den Gedanken eines aktiven Erwerbs.
theological_decisions:
- issue: Auffordernde oder beschreibende Deutung der Imperfektformen
  choice: 'Auffordernd: „höre … erweitere … gewinne“'
  alternative: 'Beschreibend: „wird zuhören … wird erweitern … wird gewinnen“'
  rationale: Der einleitende Lehrzusammenhang legt eine jussivisch-auffordernde Lesart nahe; die grammatisch mögliche beschreibende Deutung wird jedoch in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Singular („der Weise … der Verständige“) bleibt erhalten. Die Formulierungen sind idiomatisch, ohne die Bild- und Bedeutungsbreite von תַּחְבֻּלוֹת auf eine taktische oder militärische Lesart festzulegen.
