base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/017.yaml
  text: For the net is spread in vain in the sight of any bird[a].
translation:
  language: de
  text: Denn vergeblich wird das Netz vor den Augen jedes Vogels[a] ausgebreitet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jeder, der einen Flügel besitzt“; gemeint ist ein Vogel bzw. ein geflügeltes Wesen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorangehende Warnung; „Denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder.
- source_word: חִנָּם
  choice: vergeblich
  rationale: Hier bezeichnet das Adverb die Zwecklosigkeit des offen sichtbaren Ausbreitens eines Netzes.
- source_word: מְזֹרָה
  choice: wird … ausgebreitet
  rationale: Die passive Form von זרה beschreibt im Zusammenhang das Ausbreiten eines Fangnetzes; die deutsche Passivkonstruktion bewahrt Form und Bild.
- source_word: הָרָשֶׁת
  choice: das Netz
  rationale: רֶשֶׁת bezeichnet hier eindeutig ein Fangnetz; „Netz“ ist die klare und übliche deutsche Entsprechung.
- source_word: בְּעֵינֵי
  choice: vor den Augen
  rationale: Die Wendung wird bewusst bildnah wiedergegeben und bezeichnet, dass das Ausbreiten sichtbar geschieht.
- source_word: כָל
  choice: jedes
  rationale: Das hebräische כָל mit dem folgenden singularischen Ausdruck hat generische, umfassende Bedeutung.
- source_word: בַּעַל כָּנָף
  choice: Vogel
  rationale: Wörtlich „Besitzer eines Flügels“ ist eine bildhafte Bezeichnung für einen Vogel beziehungsweise ein geflügeltes Wesen; „Vogel“ passt natürlich zum Fangnetzbild.
