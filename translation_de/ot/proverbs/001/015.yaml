  text: בְּנִ֗/י אַל תֵּלֵ֣ךְ בְּ/דֶ֣רֶךְ אִתָּ֑/ם מְנַ֥ע רַ֝גְלְ/ךָ֗ מִ/נְּתִיבָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/015.yaml
  text: My son[a], do not walk in the way with them; keep your foot from their path.
translation:
  language: de
  text: Mein Sohn, geh nicht mit ihnen auf ihrem Weg; halte deinen Fuß von ihrem Pfad fern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die Anrede mit Suffix der 1. Person Singular wird direkt und natürlich wiedergegeben; die maskuline Singularform und der väterliche Unterweisungsrahmen bleiben erhalten.
- source_word: אַל תֵּלֵךְ
  choice: geh nicht
  rationale: אַל mit der folgenden Verbform drückt ein Verbot aus. „Geh nicht“ ist im heutigen Deutsch idiomatischer als „wandle nicht“ und kann hier sowohl räumlich als auch bildlich verstanden werden.
- source_word: בְּדֶרֶךְ אִתָּם
  choice: mit ihnen auf ihrem Weg
  rationale: דֶּרֶךְ bezeichnet einen konkreten Weg oder bildlich die Lebensführung. Die Formulierung bewahrt beide Bedeutungsebenen und gibt אִתָּם ausdrücklich mit „mit ihnen“ wieder.
- source_word: מְנַע רַגְלְךָ
  choice: halte deinen Fuß … fern
  rationale: Der Imperativ von מנע fordert bewusstes Zurückhalten. Die deutsche Konstruktion ist natürlich und wahrt den im Hebräischen singularischen „Fuß“.
- source_word: מִנְּתִיבָתָם
  choice: von ihrem Pfad
  rationale: נְתִיבָה bezeichnet einen Pfad oder eine Bahn. „Pfad“ erhält die bildhafte Parallelität zu דֶּרֶךְ, ohne beide Begriffe gleichzusetzen.
