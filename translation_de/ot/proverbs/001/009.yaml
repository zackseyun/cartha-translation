source:
  edition: WLC
  text: כִּ֤י לִוְיַ֤ת חֵ֓ן הֵ֬ם לְ/רֹאשֶׁ֑/ךָ וַ֝/עֲנָקִ֗ים לְ/גַרְגְּרֹתֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/009.yaml
  text: for they are a graceful wreath for your head and necklaces for your neck[a][b].
translation:
  language: de
  text: Denn sie sind ein anmutiger Kranz für deinen Kopf und Schmuckketten für deinen Hals[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Kranz der Gunst« für deinen Kopf.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ketten« für deinen Hals.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die Aufforderung in Vers 8 ein und entspricht dem argumentativen Zusammenhang natürlich.
- source_word: לִוְיַת
  choice: Kranz
  rationale: Bezeichnet etwas Gewundenes oder Geflochtenes; zusammen mit »Kopf« ist »Kranz« eine natürliche, bildhafte Wiedergabe.
- source_word: חֵן
  choice: anmutiger
  rationale: Beschreibt den Kranz als reizvoll und schön. »Anmutig« bewahrt diesen Sinn, ohne חֵן hier unnötig theologisch als »Gnade« festzulegen.
- source_word: הֵם
  choice: sie sind
  rationale: Das Pronomen verweist auf die Unterweisung des Vaters und die Weisung der Mutter in Vers 8; im Deutschen ist die Kopula erforderlich.
- source_word: לְרֹאשֶׁךָ
  choice: für deinen Kopf
  rationale: Gibt die Zuordnung durch ל eng wieder und klingt in Verbindung mit »Kranz« idiomatisch.
- source_word: וַעֲנָקִים
  choice: und Schmuckketten
  rationale: Bewahrt den hebräischen Plural und bringt zugleich den ornamentalen Charakter zum Ausdruck. Das schlichtere »Ketten« bleibt als Alternative in der Fußnote erhalten.
- source_word: לְגַרְגְּרֹתֶיךָ
  choice: für deinen Hals
  rationale: »Hals« ist im Zusammenhang mit Schmuck die natürliche deutsche Entsprechung; »Kehle« wäre zwar wörtlicher möglich, klänge hier jedoch unpassend.
theological_decisions: []
