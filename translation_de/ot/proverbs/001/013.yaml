  text: כָּל ה֣וֹן יָקָ֣ר נִמְצָ֑א נְמַלֵּ֖א בָתֵּ֣י/נוּ שָׁלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/013.yaml
  text: We will find all precious wealth[b][a]; we will fill our houses with plunder.
translation:
  language: de
  text: Wir werden allen kostbaren Besitz[a] finden; wir werden unsere Häuser mit Beute[b] füllen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wertvollen Besitz“ oder „kostbare Reichtümer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Raubgut“; das hebräische Wort bezeichnet Güter, die als Beute genommen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: allerlei
  rationale: Gibt den umfassenden, prahlerischen Sinn im Deutschen natürlich wieder, ohne das Hebräische distributiv als „jeden“ zu verengen.
- source_word: הוֹן יָקָר
  choice: kostbaren Besitz
  rationale: הוֹן bezeichnet materiellen Besitz beziehungsweise Vermögen; יָקָר hebt dessen hohen Wert hervor. Die Verbindung ist verständlich und bewahrt beide Bedeutungsbestandteile.
- source_word: נִמְצָא
  choice: wir werden … finden
  rationale: Die Verbform wird im Zusammenhang als erste Person Plural mit zukunftsbezogener Aussage verstanden; „finden“ gibt die Grundbedeutung von מצא wieder.
- source_word: נְמַלֵּא
  choice: werden wir … füllen
  rationale: Die selbstsichere, zukunftsbezogene Aussage der Verführer wird im Deutschen mit „werden“ wiedergegeben.
- source_word: בָתֵּינוּ
  choice: unsere Häuser
  rationale: Die konkrete Bedeutung von בַּיִת bleibt erhalten und zeichnet das Bild von Häusern, die mit geraubten Gütern angefüllt werden.
- source_word: שָׁלָל
  choice: Beute
  rationale: „Beute“ bezeichnet im modernen Deutschen klar Güter, die durch Raub oder Gewalt erlangt wurden, und passt zum kriminellen Zusammenhang.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die vorangestellte Wendung „unsere Häuser“ setzt einen natürlichen Akzent auf das Ergebnis der versprochenen Bereicherung; das Semikolon bewahrt die enge Parallelität der beiden Aussagen.
