source:
  edition: WLC
  text: חָ֭כְמוֹת בַּ/ח֣וּץ תָּרֹ֑נָּה בָּ֝/רְחֹב֗וֹת תִּתֵּ֥ן קוֹלָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/020.yaml
  text: Wisdom cries aloud in the street[a]; in the squares she raises her voice.
translation:
  language: de
  text: Die Weisheit ruft laut auf der Straße[a]; auf den Plätzen erhebt sie ihre Stimme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „Die Weisheit ruft auf der Straße; auf den Plätzen erhebt sie ihre Stimme.“'
    reason: Lexikalische Alternative für das intensive תָּרֹנָּה.
lexical_decisions:
- source_word: חָכְמוֹת
  choice: die Weisheit
  rationale: Die formal plurale Form bezeichnet hier die personifizierte Weisheit als Singular, wie die folgenden femininen Singularformen zeigen.
- source_word: בַּחוּץ
  choice: auf der Straße
  rationale: Gemeint ist der öffentliche Raum außerhalb des Hauses; im Deutschen ist „auf der Straße“ natürlich und passt zum Parallelismus mit den Plätzen.
- source_word: תָּרֹנָּה
  choice: ruft laut
  rationale: רנן bezeichnet ein weithin hörbares Rufen oder Jubeln. Im Zusammenhang der öffentlichen Mahnrede gibt „ruft laut“ die Intensität wieder, ohne einen freudigen Gesang vorauszusetzen.
- source_word: בָּרְחֹבוֹת
  choice: auf den Plätzen
  rationale: Das Wort bezeichnet breite öffentliche Räume oder Plätze einer Ortschaft. „Auf den Plätzen“ ist prägnant und idiomatisch.
- source_word: תִּתֵּן קוֹלָהּ
  choice: erhebt sie ihre Stimme
  rationale: Wörtlich steht „sie gibt ihre Stimme“. Die gewählte deutsche Wendung gibt diesen Sinn natürlich wieder und bewahrt das nachdrückliche öffentliche Sprechen.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Die Weisheit wird als feminine Einzelfigur dargestellt.
  alternative: Die Aussage rein abstrakt als allgemeines Vorhandensein von Weisheit wiederzugeben.
  rationale: Die femininen Singularformen stellen die Weisheit literarisch als öffentlich redende Gestalt dar. Diese Personifikation wird bewahrt, ohne sie über den Text hinaus mit einer bestimmten theologischen Person gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die öffentliche Szenerie und der poetische Parallelismus bleiben erhalten; die feminine Personifikation ist durch Artikel, Subjekt und Pronomen klar erkennbar.
