source:
  edition: WLC
  text: לָ/דַ֣עַת חָכְמָ֣ה וּ/מוּסָ֑ר לְ֝/הָבִ֗ין אִמְרֵ֥י בִינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/002.yaml
  text: to know wisdom and instruction[a], to understand words of insight[b],
translation:
  language: de
  text: 'um Weisheit und Unterweisung[a] kennenzulernen,

    um einsichtsvolle Worte[b] zu verstehen,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erziehung“ beziehungsweise „Zucht“. Das hebräische Wort מוּסָר umfasst neben Belehrung auch korrigierende und formende Erziehung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Worte der Einsicht“; auch: „verständige Aussprüche“ oder „Aussprüche des Unterscheidungsvermögens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: kennenzulernen
  rationale: Der mit לְ gebildete Infinitiv bezeichnet im Zusammenhang des Prologs den Zweck. „Kennenlernen“ gibt hier den Erwerb von Weisheit und Unterweisung natürlicher wieder als das statische „kennen“.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und sachgerechte Wiedergabe in den Sprüchen; gemeint ist praktische und sittliche Lebensweisheit, nicht bloß Intelligenz.
- source_word: מוּסָר
  choice: Unterweisung
  rationale: Der Begriff umfasst Lehre, erzieherische Zucht und Korrektur. „Unterweisung“ eignet sich im programmatischen Auftakt als breiter Oberbegriff; die korrigierende Seite wird in der Fußnote kenntlich gemacht.
- source_word: לְהָבִין
  choice: zu verstehen
  rationale: Der zweite Zweckinfinitiv steht parallel zu לָדַעַת. „Verstehen“ ist im modernen Deutsch klar und bewahrt die Struktur des Hebräischen.
- source_word: אִמְרֵי
  choice: Worte
  rationale: Der Konstruktplural bezeichnet Äußerungen oder Aussprüche. „Worte“ ist natürlich und umfassend; „Aussprüche“ bleibt als engere Alternative möglich.
- source_word: בִינָה
  choice: einsichtsvolle
  rationale: Die attributive Wiedergabe „einsichtsvolle Worte“ bildet die hebräische Konstruktverbindung idiomatisch ab und vermeidet die schwerfällige Formulierung „Worte der Einsicht“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Zweckinfinitive werden mit zweimaligem „um … zu“ sichtbar gemacht. Der Zeilenumbruch bewahrt den poetischen Parallelismus; die Formulierung bleibt als Fortsetzung der Überschrift in Vers 1 syntaktisch offen.
