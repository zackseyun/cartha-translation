id: PRO.1.7
reference: Proverbs 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה רֵאשִׁ֣ית דָּ֑עַת חָכְמָ֥ה וּ֝/מוּסָ֗ר אֱוִילִ֥ים בָּֽזוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/007.yaml
  text: The fear of Yahweh is the beginning of knowledge[b][a]; fools despise wisdom and discipline.
translation:
  language: de
  text: Die Furcht Jahwes[a] ist der Anfang der Erkenntnis; Weisheit und Erziehung[b] verachten die Toren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die Ehrfurcht vor Jahwe“ oder „die Scheu vor Jahwe“. Der hebräische Ausdruck umfasst Ehrfurcht, Scheu und gehorsame Unterordnung vor Gott.
    reason: lexical_alternative
  - marker: b
    text: Oder „Unterweisung“ oder „Zurechtweisung“. Das hebräische Wort bezeichnet formende Erziehung, die auch Korrektur einschließen kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: Furcht
  rationale: Die wörtliche und in der Weisheitsliteratur gewichtige Wiedergabe bewahrt die Verbindung von Ehrfurcht, Scheu und gehorsamer Unterordnung, ohne den Ausdruck auf ein bloßes Gefühl zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Umschrift des Gottesnamens gibt das Tetragramm als persönlichen Namen wieder statt es durch einen Titel zu ersetzen.
- source_word: רֵאשִׁית
  choice: Anfang
  rationale: „Anfang“ bewahrt sowohl den Gedanken des Ausgangspunkts als auch den einer grundlegenden Voraussetzung, ohne die Aussage stärker auszudeuten.
- source_word: דָּעַת
  choice: Erkenntnis
  rationale: „Erkenntnis“ ist in diesem weisheitlichen Zusammenhang natürlich und umfasst mehr als bloßen Informationsbesitz.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und sachlich passende Wiedergabe in den Sprüchen.
- source_word: מוּסָר
  choice: Zucht
  rationale: „Zucht“ bezeichnet hier formende Unterweisung, die Ermahnung und Korrektur einschließt; eine Fußnote nennt verständlichere Teilbedeutungen.
- source_word: אֱוִילִים
  choice: die Toren
  rationale: Die traditionelle, prägnante Bezeichnung bewahrt die moralische und nicht nur intellektuelle Wertung des hebräischen Weisheitsbegriffs.
- source_word: בָּזוּ
  choice: verachten
  rationale: Das Verb drückt entschiedene Geringschätzung und Zurückweisung aus; „verachten“ gibt diese Stärke idiomatisch wieder.
theological_decisions:
- issue: Bedeutung der „Furcht Jahwes“ in der Weisheitstheologie
  choice: Die wörtliche Wendung „Furcht Jahwes“ bleibt im Haupttext stehen.
  alternative: „Ehrfurcht vor Jahwe“ oder „Scheu vor Jahwe“
  rationale: Der hebräische Ausdruck verbindet Ehrfurcht und Scheu mit einer Haltung gehorsamer Unterordnung. Eine ausschließlich deutende Wiedergabe würde diese theologische Spannung einengen.
- issue: Verhältnis von רֵאשִׁית zur Erkenntnis
  choice: „der Anfang der Erkenntnis“
  alternative: „die Grundlage der Erkenntnis“ oder „das Wichtigste an der Erkenntnis“
  rationale: „Anfang“ lässt offen, ob besonders der Ausgangspunkt oder zugleich das grundlegende Prinzip gemeint ist, und bewahrt damit die Bedeutungsbreite des Ausgangstextes.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit der knappen Parallelstruktur eines Weisheitsspruchs. „Zucht“ ist bewusst traditionsnah und semantisch umfassend gewählt, wird aber wegen möglicher heutiger Missverständnisse in der Fußnote erläutert.
