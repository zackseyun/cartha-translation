  text: לֹא אָב֥וּ לַ/עֲצָתִ֑/י נָ֝אֲצ֗וּ כָּל תּוֹכַחְתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/030.yaml
  text: They were unwilling to accept my counsel[b][a]; they despised all my reproof.
translation:
  language: de
  text: Sie wollten meinen Rat nicht annehmen[a]; sie verachteten jede meiner Zurechtweisungen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie weigerten sich, auf meinen Rat zu hören.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle meine Mahnungen“ beziehungsweise „alle meine Rügen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אָבוּ
  choice: sie wollten … nicht
  rationale: Die Verbindung drückt nicht bloß eine ausgebliebene Handlung, sondern fehlende Bereitschaft beziehungsweise Weigerung aus. „Sie wollten … nicht“ gibt diese volitionale Nuance natürlich wieder.
- source_word: לַעֲצָתִי
  choice: meinen Rat annehmen
  rationale: עֵצָה bedeutet „Rat“ oder „Ratschlag“. Nach „wollten … nicht“ ergänzt „annehmen“ idiomatisch die im Hebräischen vorausgesetzte Reaktion, ohne den Sinn wesentlich zu erweitern.
- source_word: נָאֲצוּ
  choice: sie verachteten
  rationale: Das Verb bezeichnet eine von Geringschätzung geprägte Zurückweisung. „Verachteten“ bewahrt die starke wertende Aussage.
- source_word: כָּל תּוֹכַחְתִּי
  choice: jede meiner Zurechtweisungen
  rationale: תּוֹכַחַת kann Zurechtweisung, Rüge oder Korrektur bezeichnen. Die distributive Formulierung mit „jede“ ist im Deutschen natürlich und gibt כָּל vor dem singularischen Kollektivbegriff angemessen wieder.
theological_decisions: []
