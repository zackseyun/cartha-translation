  text: כִּ֣י רַ֭גְלֵי/הֶם לָ/רַ֣ע יָר֑וּצוּ וִֽ֝/ימַהֲר֗וּ לִ/שְׁפָּךְ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/016.yaml
  text: For their feet run to evil[b][a], and they hurry to shed blood.
translation:
  language: de
  text: Denn ihre Füße laufen zum Bösen[a], und sie eilen, Blut zu vergießen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „zum Bösen“; gemeint sein kann auch „um Böses zu tun“ oder „dem Bösen entgegen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Warnung. „Denn“ gibt diese erklärende Funktion im Deutschen knapp und natürlich wieder.
- source_word: רַגְלֵיהֶם
  choice: ihre Füße
  rationale: Die Körperteilmetapher des Hebräischen bleibt erhalten und veranschaulicht ihren Drang zur bösen Tat.
- source_word: לָרַע
  choice: zum Bösen
  rationale: Die knappe Verbindung aus Präposition und substantiviertem Adjektiv bewahrt die Offenheit zwischen Zielrichtung und bösem Handeln, auch wenn sie im Deutschen leicht ungewöhnlich klingt.
- source_word: יָרוּצוּ
  choice: laufen
  rationale: Die Grundbedeutung und das Bewegungsbild werden bewahrt; im Zusammenhang drückt das Verb zugleich Eile und Bereitwilligkeit aus.
- source_word: וִימַהֲרוּ
  choice: und sie eilen
  rationale: „Eilen“ gibt die beschleunigte, zielgerichtete Bewegung wieder und bildet eine natürliche Steigerung zu „laufen“.
- source_word: לִשְׁפָּךְ
  choice: zu vergießen
  rationale: In Verbindung mit „Blut“ ist „Blut vergießen“ die übliche und genaue deutsche Wiedergabe.
- source_word: דָּם
  choice: Blut
  rationale: Die direkte Wiedergabe erhält die hebräische Wendung für gewaltsames Blutvergießen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das anschauliche Bild der laufenden Füße und die knappe Parallelstruktur des Hebräischen bleiben erhalten.
