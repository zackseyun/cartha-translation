translation:
  language: de
  text: Wirf dein Los in unsere Mitte[a]; wir alle werden einen gemeinsamen Geldbeutel haben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wirf dein Los zu uns.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Ein Geldbeutel wird für uns alle sein.“'
    reason: literal_rendering
lexical_decisions:
- source_word: גּוֹרָלְךָ
  choice: dein Los
  rationale: גּוֹרָל bezeichnet wörtlich ein Los und kann den dadurch zugewiesenen Anteil meinen. „Dein Los“ bewahrt das Bild der Aufforderung, sich der Gruppe und ihrem gemeinsamen Anteil anzuschließen.
- source_word: תַּפִּיל
  choice: Wirf … hinein
  rationale: Der Hifil von נפל bedeutet wörtlich „fallen lassen“; zusammen mit גּוֹרָל geht es um das Werfen des Loses. „Wirf … hinein“ gibt das konkrete Bild und die freiwillige Beteiligung natürlich wieder.
- source_word: בְּתוֹכֵנוּ
  choice: bei uns
  rationale: Die Wendung bedeutet „in unserer Mitte“. Im Deutschen ist „bei uns hineinwerfen“ in diesem Zusammenhang natürlicher als die räumlich engere Wiedergabe „in unsere Mitte“.
- source_word: כִּיס
  choice: Geldbeutel
  rationale: כִּיס bezeichnet einen Beutel beziehungsweise eine Börse für Geld. „Geldbeutel“ macht den finanziellen Sinn im heutigen Deutsch eindeutig.
- source_word: אֶחָד
  choice: einen gemeinsamen
  rationale: אֶחָד bedeutet „einer“. Im Zusammenhang mit dem Besitz aller bringt „einen gemeinsamen Geldbeutel“ die Einheit des Beutels idiomatisch zum Ausdruck; die wörtlichere Form bleibt in der Fußnote erhalten.
- source_word: יִהְיֶה לְכֻלָּנוּ
  choice: werden wir alle haben
  rationale: Wörtlich lautet die Konstruktion „wird für uns alle sein“. „Werden wir alle haben“ gibt den gemeinsamen Besitz klar und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem Ton. Das Bild des geworfenen Loses bleibt erhalten; „Geldbeutel“ verdeutlicht, dass כִּיס hier einen Behälter für den gemeinsamen Geldbestand bezeichnet.
