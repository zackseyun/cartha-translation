- from: Darum[a] werden sie von der Frucht ihres Weges essen und sich an ihren eigenen Plänen satt essen.[b]
  to: Darum[a] werden sie von der Frucht ihres Weges essen und von ihren eigenen Plänen satt werden.[b]
  rationale: Die Revision ersetzt allein die im Deutschen missverständliche Wendung „sich an … satt essen“ durch „von … satt werden“. Damit bleiben die Präposition מִן, das Sättigungsbild und die ironische Folge ihrer eigenen Überlegungen sichtbar. Die zweite Fußnote wird auf tatsächliche, quellentreue Alternativen beschränkt.
