  source_fidelity: 'Die Satzfolge und die Bilder des Hebräischen sind im Wesentlichen getroffen: Das folgernde „Darum“, „Frucht ihres Weges“ und die Zukunftsformen geben den Sinn angemessen wieder. Bei וּמִמֹּעֲצֹתֵיהֶם יִשְׂבָּעוּ ist jedoch „sich an ihren eigenen Plänen satt essen“ im Deutschen semantisch und idiomatisch problematisch: Man isst sich nicht an Plänen satt. Das Hebräische sagt, dass sie von/aus ihren eigenen Ratschlägen bzw. Plänen satt werden; die metaphorische Spannung kann im Deutschen mit „von … satt werden“ bewahrt werden.'
  naturalness: „Darum werden sie von der Frucht ihres Weges essen“ ist würdevoll und verständlich. „Von ihren eigenen Plänen satt werden“ ist zugleich natürlicher als „sich an … satt essen“ und bewahrt die absichtlich bildhafte, ironische Verbindung.
  terminology: „Weg“ entspricht dem weisheitlichen Bild von דֶּרֶךְ. „Pläne“ ist für מֹעֲצוֹת hier eine vertretbare moderne Wiedergabe; „Ratschläge“ bleibt als Alternative sinnvoll. Die Fußnoten sollen die Alternativen korrekt und idiomatisch wiedergeben.
