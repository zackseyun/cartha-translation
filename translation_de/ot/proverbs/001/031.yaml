base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/031.yaml
  text: So they will eat from the fruit of their way[b][a], and be filled with their own counsels.
translation:
  language: de
  text: Darum[a] werden sie von der Frucht ihres Weges essen und von ihren eigenen Plänen satt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Und sie werden … essen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und von ihren eigenen Ratschlägen satt werden“; auch: „und sich an ihren eigenen Plänen sättigen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאכְלוּ
  choice: Darum werden sie … essen
  rationale: 'Das einleitende וְ wird im Zusammenhang folgernd verstanden: Was folgt, ist die Konsequenz ihrer zuvor beschriebenen Weigerung. Das Futur bewahrt den noch ausstehenden Vollzug.'
- source_word: מִפְּרִי דַרְכָּם
  choice: von der Frucht ihres Weges
  rationale: Die Präposition מִן und das Bild von der Frucht bleiben erhalten. „Weg“ ist im Sprüchebuch die geläufige Metapher für Lebensführung und Verhalten.
- source_word: וּמִמֹּעֲצֹתֵיהֶם
  choice: an ihren eigenen Plänen
  rationale: מֹעֵצוֹת kann Ratschläge, Überlegungen, Entschlüsse oder Pläne bezeichnen. „Pläne“ ist hier natürlich und wahrt den Bezug auf das von ihnen selbst Erdachte; „eigenen“ verdeutlicht das Possessivsuffix.
- source_word: יִשְׂבָּעוּ
  choice: sich … satt essen
  rationale: Das Verb bezeichnet das Sattwerden beziehungsweise Gesättigtsein. Die deutsche Wendung führt das Bild des Essens natürlich fort und bewahrt seinen bitter-ironischen Sinn.
theological_decisions:
- issue: Bild gerechter Folgen im Weisheitsgericht
  choice: Der Vers beschreibt, dass Menschen die Folgen ihres selbst gewählten Weges erfahren.
  alternative: Eine streng formale Wiedergabe könnte den folgernden Zusammenhang nur durch „und“ andeuten.
  rationale: Die Bilder vom Essen der Frucht und vom Sattwerden stellen eine angemessene Folge der eigenen Lebensführung dar, ohne eine weitergehende dogmatische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Weisheitsmetaphern „Frucht“, „Weg“, „essen“ und „satt“ bleiben bewusst sichtbar; die ungewöhnliche Verbindung von Sättigung und eigenen Plänen bewahrt die ironische Spannung des Hebräischen.
