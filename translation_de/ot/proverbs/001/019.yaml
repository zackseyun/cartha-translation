review_pass:
  verdict: revise
  source_fidelity: 'Der Haupttext gibt die Struktur und den Sinn des Hebräischen zutreffend wieder: כֵּן eröffnet die zusammenfassende Aussage, אָרְחוֹת bleibt als Wegmetapher erhalten, und נֶפֶשׁ ist hier angemessen mit „Leben“ übersetzt. Die Bezugnahme des Singularverbs auf den Gewinn ist im Kontext gut möglich; „Dieser Gewinn“ macht diesen im Deutschen sonst weniger eindeutigen Bezug verständlich.'
  naturalness: „So sind die Wege aller, die nach unredlichem Gewinn trachten“ ist modernes, würdiges und gut verständliches Standarddeutsch. Auch „nimmt denen das Leben, die ihn besitzen“ ist idiomatisch, wenn auch bewusst nah an der possessiven Bildlichkeit des Ausgangstextes.
  terminology: „Unredlicher Gewinn“ trifft den im Kontext moralisch verwerflichen beziehungsweise gewaltsam erstrebten בָּצַע angemessen, ohne die Aussage unnötig zu spezifizieren. „Leben“ für נֶפֶשׁ ist hier vorzuziehen. Die Fußnote sollte jedoch die Alternative nicht zu „von ihr beherrscht werden“ umdeuten, da בְּעָלָיו ausdrücklich Besitzer/Eigentümer bezeichnet und nicht von der Gier Beherrschte.
  issues:
  - severity: medium
    issue: Die Fußnote gibt mit „Die Gier nimmt denen das Leben, die von ihr beherrscht werden“ keine hinreichend quellennahe Alternative wieder.
    rationale: Als mögliche Deutung kann der zweite Satzteil auf die Gewinnsucht beziehungsweise Habgier bezogen werden. בְּעָלָיו bedeutet dabei aber weiterhin „seine/ihre Besitzer“ bzw. „diejenigen, die sie besitzen“; „von ihr beherrscht werden“ fügt ein anderes Verhältnis hinzu und ersetzt die Besitzmetapher.
  revised_text: 'So sind die Wege aller, die nach unredlichem Gewinn trachten[a]: Dieser Gewinn nimmt denen das Leben, die ihn besitzen.'
