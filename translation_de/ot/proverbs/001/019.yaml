  text: כֵּ֗ן אָ֭רְחוֹת כָּל בֹּ֣צֵֽעַ בָּ֑צַע אֶת נֶ֖פֶשׁ בְּעָלָ֣י/ו יִקָּֽח־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/019.yaml
  text: Such are the paths of everyone who gains unjust profit[a]; it takes away the life of its possessors.
translation:
  language: de
  text: 'So sind die Wege aller, die nach unredlichem Gewinn trachten[a]: Dieser Gewinn nimmt denen das Leben, die ihn besitzen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So sind die Wege aller, die gewinngierig sind: Sie nimmt denen das Leben, die sie besitzen.“'
    reason: 'Lexikalische Alternative: בֹּצֵעַ בָּצַע kann stärker die Gewinnsucht als den unredlichen Gewinn bezeichnen. Dann kann auch das Subjekt des zweiten Satzteils auf diese Gewinnsucht bezogen werden; das possessive Verhältnis in בְּעָלָיו bleibt dabei erhalten.'
lexical_decisions:
- source_word: כֵּן
  choice: So sind
  rationale: Leitet die zusammenfassende Folgerung aus dem zuvor geschilderten Verhalten ein und bewahrt die hinweisende Kraft des Hebräischen.
- source_word: אָרְחוֹת
  choice: die Wege
  rationale: Bewahrt das konkrete Wegbild der Weisheitsliteratur; im modernen Deutschen klingt „Wege“ natürlicher als „Pfade“.
- source_word: כָּל
  choice: aller, die
  rationale: Gibt zusammen mit dem folgenden Partizip den umfassenden, personenbezogenen Sinn natürlich wieder.
- source_word: בֹּצֵעַ בָּצַע
  choice: die nach unredlichem Gewinn trachten
  rationale: Die Verbindung aus Partizip und stammverwandtem Substantiv bezeichnet gewinnsüchtiges Streben mit moralisch verwerflichem, im Kontext auch gewaltsamem Charakter. „Unredlicher Gewinn“ hält sowohl das Erwerbsstreben als auch dessen Unrecht fest.
- source_word: נֶפֶשׁ
  choice: das Leben
  rationale: Bezeichnet hier am ehesten das konkrete Leben, das durch die Gier nach Gewinn zugrunde geht, nicht eine vom Körper getrennte Seele.
- source_word: בְּעָלָיו
  choice: denen, die ihn besitzen
  rationale: Das Suffix wird auf den unredlichen Gewinn bezogen. Die Formulierung bewahrt das Besitzverhältnis, ohne das im Deutschen schwerfällige „seinen Besitzern“ zu verwenden.
- source_word: יִקָּח
  choice: nimmt ... das Leben
  rationale: Der maskuline Singular kann „Gewinn“ als Subjekt haben. Die Wendung gibt die zerstörerische Bedeutung im Zusammenhang klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Wegbild bleibt erhalten. „Dieser Gewinn“ verdeutlicht den im Hebräischen nur durch Verbform und Suffix nahegelegten Rückbezug, während die Fußnote die genuine Alternative „Gewinngier“ offenhält.
