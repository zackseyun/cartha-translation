  rationale: Der Konstruktplural von מָשָׁל bezeichnet hier die Sammlung von Weisheitssprüchen. „Sprüche“ entspricht dem Bedeutungsumfang, ist im Deutschen als Buchtitel etabliert und passt zur Funktion als Überschrift.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Wiedergabe des Personennamens in der üblichen deutschen Form.
- source_word: בֶן
  choice: Sohn
  rationale: בֶן bezeichnet in dieser königlichen Überschrift am naheliegendsten das unmittelbare Vater-Sohn-Verhältnis.
- source_word: דָּוִד
  choice: David
  rationale: Wiedergabe des Personennamens in der üblichen deutschen Form.
- source_word: מֶלֶךְ
  choice: König
  rationale: Das Substantiv steht als nähere Bestimmung zu Salomo. Die deutsche Genitivfügung „des Königs von Israel“ macht diese Beziehung natürlich und eindeutig.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Übliche deutsche Form des Eigennamens für das Volk beziehungsweise Königreich.
