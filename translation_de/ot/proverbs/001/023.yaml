  text: תָּשׁ֗וּבוּ לְֽ/ת֫וֹכַחְתִּ֥/י הִנֵּ֤ה אַבִּ֣יעָה לָ/כֶ֣ם רוּחִ֑/י אוֹדִ֖יעָה דְבָרַ֣/י אֶתְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/023.yaml
  text: Turn at my rebuke[a]; behold, I will pour out my spirit to you[b]; I will make my words known to you.
translation:
  language: de
  text: Kehrt um auf meine Zurechtweisung hin![a] Siehe, ich will meinen Geist über euch ausgießen[b]; ich will euch meine Worte kundtun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kehrt zu meiner Zurechtweisung zurück!“; auch möglich: „Kehrt um, wenn ich euch zurechtweise!“'
    reason: lexical_alternative
  - marker: b
    text: „Meinen Geist“ kann hier auch „meine innere Haltung“ oder „meine Gedanken“ bedeuten. Manche erkennen darin darüber hinaus einen Anklang an Gottes Geist; im unmittelbaren Zusammenhang spricht jedoch die personifizierte Weisheit.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשׁוּבוּ
  choice: Kehrt um
  rationale: Die Form von שׁוב fordert zu einer Richtungsänderung als Antwort auf die Weisheit auf. „Kehrt um“ bewahrt das konkrete Bild und den moralischen Ernst, ohne den Ausdruck auf einen ausschließlich fachtheologischen Bußbegriff festzulegen.
- source_word: לְתוֹכַחְתִּי
  choice: bei meiner Zurechtweisung
  rationale: תּוֹכַחַת bezeichnet Zurechtweisung, Rüge oder Korrektur. Die Präposition ל verbindet die Umkehr mit der Zurechtweisung als Anlass beziehungsweise Antwort darauf.
- source_word: הִנֵּה
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel hebt die folgende Zusage hervor. „Seht“ ist im heutigen Deutsch verständlich und behält den feierlichen Signalcharakter.
- source_word: אַבִּיעָה
  choice: ich will … hervorströmen lassen
  rationale: נבע bezeichnet ein Hervorquellen oder Hervorströmen. Diese Wiedergabe erhält das anschauliche Bild einer reichen Mitteilung und passt syntaktisch zu „meinen Geist“.
- source_word: רוּחִי
  choice: meinen Geist
  rationale: רוּחַ kann Geist, Atem oder innere Haltung bezeichnen. „Meinen Geist“ wahrt die Mehrdeutigkeit; die Kleinschreibung vermeidet eine ausdrückliche Gleichsetzung mit Gottes Heiligem Geist, da im unmittelbaren Zusammenhang die personifizierte Weisheit spricht.
- source_word: אוֹדִיעָה
  choice: ich will … kundtun
  rationale: Die Hifil-Form von ידע bedeutet „wissen lassen“ beziehungsweise „bekannt machen“. „Kundtun“ gibt den kausativen Sinn prägnant und in einem würdigen Weisheitsstil wieder.
- source_word: דְבָרַי
  choice: meine Worte
  rationale: דָּבָר bezeichnet Wort, Aussage oder Sache. „Meine Worte“ erhält den sprachlichen und lehrenden Charakter der Rede der Weisheit.
- source_word: לָכֶם ... אֶתְכֶם
  choice: euch … euch
  rationale: Beide Formen richten die Aussagen unmittelbar an dieselbe Mehrzahl von Hörenden; die deutsche Dativ- beziehungsweise Akkusativform folgt den jeweiligen Verben natürlich.
theological_decisions:
- issue: Bedeutung von „meinen Geist“ in der Rede der Weisheit
  choice: Der eigene Geist beziehungsweise die innere Gedanken- und Willenswelt der personifizierten Weisheit, ohne abschließende Verengung
  alternative: Eine Vorausdeutung oder Anspielung auf Gottes Geist beziehungsweise den Heiligen Geist
  rationale: Im unmittelbaren literarischen Zusammenhang spricht die personifizierte Weisheit. Der hebräische Text identifiziert רוּחִי nicht ausdrücklich mit Gottes Geist. Die Übersetzung bewahrt jedoch den Ausdruck „Geist“ und damit mögliche weiterführende kanonische Resonanzen, ohne sie in den Vers hineinzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die direkte Anrede bleiben erhalten. „Seht“ markiert den hervorgehobenen Neueinsatz; „hervorströmen lassen“ bewahrt das Quellbild des hebräischen Verbs.
