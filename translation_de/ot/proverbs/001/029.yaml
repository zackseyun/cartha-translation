source:
  edition: WLC
  text: תַּ֭חַת כִּי שָׂ֣נְאוּ דָ֑עַת וְ/יִרְאַ֥ת יְ֝הֹוָ֗ה לֹ֣א בָחָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/029.yaml
  text: Because they hated knowledge and did not choose the fear of Yahweh[b][a],
translation:
  language: de
  text: 'Weil sie Erkenntnis hassten

    und die Furcht Jahwes[a] nicht wählten,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Furcht Jahwes“ ist eine feste Wendung der Weisheitsliteratur und bezeichnet ehrfürchtige Gottesfurcht, nicht bloß Schrecken. Im Hebräischen steht der Gottesname יהוה (JHWH).
    reason: lexical_and_divine_name_clarification
lexical_decisions:
- source_word: תַּחַת כִּי
  choice: Weil
  rationale: Die Verbindung leitet den Grund für das im Zusammenhang angekündigte Gericht ein. „Weil“ gibt diese kausale Funktion im Deutschen natürlich wieder.
- source_word: שָׂנְאוּ
  choice: sie hassten
  rationale: Das Verb bedeutet in seiner Grundbedeutung „hassen“. Die starke Aussage des Hebräischen wird nicht zu „ablehnen“ oder „verachten“ abgeschwächt.
- source_word: דָעַת
  choice: Erkenntnis
  rationale: In den Sprüchen bezeichnet דַּעַת nicht bloß angesammeltes Wissen, sondern einsichtsvolle, sittlich relevante Erkenntnis. „Erkenntnis“ bewahrt diesen weisheitlichen Sinn.
- source_word: יִרְאַת יְהוָה
  choice: die Furcht Jahwes
  rationale: Die feste weisheitliche Wendung wird möglichst direkt wiedergegeben. „Furcht“ bewahrt das Spannungsfeld von ehrfürchtiger Scheu, Achtung und ernstem Bewusstsein vor Gott, statt es auf „Ehrfurcht“ zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen יהוה. „Jahwe“ gibt ihn im modernen Standarddeutsch als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לֹא בָחָרוּ
  choice: nicht erwählten
  rationale: בחר bezeichnet eine bewusste Wahl. „Erwählten“ erhält den willentlichen Akzent und passt idiomatisch zu „die Furcht Jahwes“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Ersetzung durch „der HERR“ wird als mögliche Übersetzungstradition in der Fußnote genannt.
- issue: Bedeutungsumfang von יִרְאַת יְהוָה
  choice: die Furcht Jahwes
  alternative: die Ehrfurcht vor Jahwe
  rationale: „Furcht“ erhält die theologische Spannung der hebräischen Weisheitsformel. Sie umfasst ehrfürchtige Scheu und gehorsame Ausrichtung, darf aber nicht auf bloßen Schrecken reduziert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Zweizeiligkeit und die starke Ausdrucksweise des Hebräischen bleiben erhalten. „Erkenntnis“ und „Furcht Jahwes“ bewahren den charakteristischen Wortschatz der Weisheitsliteratur.
