  text: כִּ֤י מְשׁוּבַ֣ת פְּתָיִ֣ם תַּֽהַרְגֵ֑/ם וְ/שַׁלְוַ֖ת כְּסִילִ֣ים תְּאַבְּדֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/032.yaml
  text: For the turning away of the simple will kill them[a], and the complacency of fools will destroy them.
translation:
  language: de
  text: Denn die Abkehr der Unerfahrenen wird sie töten,[a] und die Selbstsicherheit der Toren wird sie vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn das Abirren der Unerfahrenen wird sie töten, und die Sorglosigkeit der Toren wird sie vernichten.“'
    reason: 'Die Substantive מְשׁוּבָה und שַׁלְוָה haben hier jeweils eine nahe Bedeutungsbreite: Abkehr beziehungsweise Abirren sowie selbstsichere Ruhe beziehungsweise Sorglosigkeit.'
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die begründende Erklärung zur vorausgehenden Warnung knapp und natürlich ein.
- source_word: מְשׁוּבַת
  choice: Abkehr
  rationale: Bezeichnet das Sichabwenden beziehungsweise Abweichen; „Abkehr“ wahrt diese aktive Bedeutung, ohne einen späteren dogmatischen Fachbegriff einzutragen.
- source_word: פְּתָיִם
  choice: Unerfahrenen
  rationale: Bezeichnet im Sprüchebuch leichtgläubige, noch nicht gefestigte Menschen. „Unerfahrene“ ist verständlich und vermeidet die mögliche Verwechslung von „Einfältigen“ mit bloß geringer Intelligenz.
- source_word: תַּהַרְגֵם
  choice: wird sie töten
  rationale: Gibt das direkte und starke Verb הרג sowie den Pluralbezug unverblümt wieder.
- source_word: וְשַׁלְוַת
  choice: und die Selbstsicherheit
  rationale: שַׁלְוָה kann Ruhe, ungestörte Sicherheit oder sorglose Behaglichkeit bezeichnen. Im Zusammenhang des Nicht-Hörens bringt „Selbstsicherheit“ die gefährliche, selbstzufriedene Ruhe zum Ausdruck, ohne die Grundbedeutung Sicherheit aufzugeben.
- source_word: כְּסִילִים
  choice: der Toren
  rationale: Der etablierte Weisheitsbegriff bezeichnet moralisch uneinsichtige und verhärtete Menschen, nicht lediglich intellektuell Schwache.
- source_word: תְּאַבְּדֵם
  choice: wird sie vernichten
  rationale: Gibt die kausative Piel-Form von אבד stark wieder und bildet einen passenden Parallelismus zu „wird sie töten“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappem Parallelismus. Die Weisheitsbegriffe werden nicht als Aussagen über bloße Intelligenz wiedergegeben; die lexikalische Spannung bei מְשׁוּבָה und שַׁלְוָה bleibt durch die Fußnote sichtbar.
