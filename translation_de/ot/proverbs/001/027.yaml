  text: בְּ/בֹ֤א כ/שאוה פַּחְדְּ/כֶ֗ם וְֽ֭/אֵידְ/כֶם כְּ/סוּפָ֣ה יֶאֱתֶ֑ה בְּ/בֹ֥א עֲ֝לֵי/כֶ֗ם צָרָ֥ה וְ/צוּקָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/027.yaml
  text: when your dread comes like a storm[a], and your calamity arrives like a whirlwind, when distress and anguish come upon you.
translation:
  language: de
  text: wenn euer Schrecken wie ein Unwetter kommt und euer Unglück wie ein Wirbelsturm hereinbricht, wenn Not und Bedrängnis über euch kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹא
  choice: wenn ... kommt
  rationale: Die Präposition ב mit dem Infinitivus constructus von בוא leitet einen Temporalsatz ein; die deutsche Wiedergabe ist natürlich und wahrt die zeitliche Beziehung.
- source_word: כְשָׁאוָה
  choice: wie ein verheerender Sturm
  rationale: Das Substantiv bezeichnet zerstörerisches Unheil beziehungsweise ein krachend hereinbrechendes Verderben. Im Parallelismus mit סוּפָה gibt die Sturmmetapher die Wucht anschaulich wieder; „verheerend“ bewahrt den Aspekt der Verwüstung.
- source_word: פַּחְדְּכֶם
  choice: das, wovor ihr euch fürchtet
  rationale: פַּחַד kann sowohl die Furcht als auch deren Gegenstand bezeichnen. Im Zusammenhang mit einem kommenden Ereignis ist die gegenständliche Wiedergabe im Deutschen klar und wahrt die mögliche Bedeutungsnuance.
- source_word: וְאֵידְכֶם
  choice: und euer Unglück
  rationale: אֵיד bezeichnet Unheil, Unglück oder Verderben. „Unglück“ ist verständlich, würdig und passt zu einem hereinbrechenden Ereignis.
- source_word: כְסוּפָה
  choice: wie ein Wirbelsturm
  rationale: סוּפָה bezeichnet einen heftigen Sturmwind oder Wirbelsturm. Die Wahl erhält das starke poetische Bild und den Parallelismus.
- source_word: יֶאֱתֶה
  choice: hereinbricht
  rationale: Das seltenere Verb bedeutet „kommen“ oder „eintreffen“. „Hereinbricht“ ist im Deutschen bei plötzlich eintretendem Unheil idiomatisch und vermittelt die im Kontext liegende Wucht, ohne die Grundbedeutung aufzugeben.
- source_word: עֲלֵיכֶם
  choice: über euch
  rationale: עַל beschreibt hier, dass Bedrängnis die Angesprochenen trifft; „über euch kommen“ ist eine natürliche deutsche Verbindung.
- source_word: צָרָה
  choice: Bedrängnis
  rationale: צָרָה bezeichnet Not, Bedrängnis oder Drangsal. „Bedrängnis“ bewahrt sowohl äußere Not als auch den Gedanken des Bedrängtseins.
- source_word: וְצוּקָה
  choice: und Angst
  rationale: צוּקָה bezeichnet Enge, Druck und daraus entstehende Angst beziehungsweise Qual. „Angst“ unterscheidet den Ausdruck von צָרָה und wahrt zugleich die semantische Nähe des poetischen Wortpaars.
