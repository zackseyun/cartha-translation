  text: בְּנִ֡/י אִם יְפַתּ֥וּ/ךָ חַ֝טָּאִ֗ים אַל תֹּבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/010.yaml
  text: My son[a], if sinners entice you[b], do not consent.
translation:
  language: de
  text: Mein Sohn[a], wenn Sünder dich locken, willige nicht ein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Mein Sohn« gibt die maskuline Singularform des Hebräischen wieder; es handelt sich um eine väterliche Anrede in einer Weisheitsunterweisung.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Gib nicht nach« beziehungsweise »Sei nicht dazu bereit«. Das hebräische Verb bedeutet, bereit zu sein oder einzuwilligen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die Anrede bewahrt die maskuline Singularform und den väterlich-lehrenden Ton des hebräischen Weisheitstextes.
- source_word: אִם
  choice: wenn
  rationale: Die konditionale Partikel leitet hier eine mögliche Situation ein; im natürlichen Deutschen passt »wenn« besser als »falls«, ohne die Bedingung abzuschwächen.
- source_word: יְפַתּוּךָ
  choice: dich verführen wollen
  rationale: Das Piel von פתה bezeichnet ein verlockendes oder irreführendes Überreden. Die deutsche Wendung gibt sowohl die versuchte Einflussnahme als auch ihren moralisch negativen Charakter wieder, ohne eine sexuelle Bedeutung festzulegen.
- source_word: חַטָּאִים
  choice: Sünder
  rationale: Das substantivierte maskuline Pluralwort bezeichnet Menschen, die durch sündiges Handeln gekennzeichnet sind; »Sünder« ist die direkte und geläufige Entsprechung.
- source_word: אַל תֹּבֵא
  choice: willige nicht ein
  rationale: Die Verbindung aus Verbotspartikel und אבה warnt davor, bereitwillig zuzustimmen oder nachzugeben. »Willige nicht ein« ist im Deutschen präzise und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Die direkte Anrede und der knappe Imperativ bleiben erhalten.
