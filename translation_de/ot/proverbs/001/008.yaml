base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/008.yaml
  text: Hear[a], my son, your father's instruction[b], and do not forsake your mother's teaching.
translation:
  language: de
  text: Höre, mein Sohn, auf die Unterweisung[a] deines Vaters, und verlass nicht die Weisung[b] deiner Mutter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erziehung“ beziehungsweise „Zurechtweisung“; מוּסָר umfasst neben Belehrung auch formende und korrigierende Anleitung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Lehre“, auch „Gesetz“; תּוֹרָה bezeichnet hier die autoritative Weisung der Mutter und nicht zwingend ein formales Gesetzbuch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Höre … auf
  rationale: Der Imperativ fordert zu aufmerksamem Hören auf und kann Gehorsam einschließen. Die deutsche Verbindung „auf jemanden hören“ bewahrt beide Aspekte, ohne ausdrücklich „gehorche“ zu sagen.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die ausdrücklich maskuline Anrede im Singular und die familiäre Weisheitsrede werden genau wiedergegeben.
- source_word: מוּסַר
  choice: Unterweisung
  rationale: Das Wort umfasst Belehrung, Erziehung, Zurechtweisung und einübende Disziplin. „Unterweisung“ ist im Zusammenhang natürlich und lässt den erzieherischen Gehalt erkennen, ohne ihn auf Strafe zu verengen.
- source_word: אָבִיךָ
  choice: deines Vaters
  rationale: Die deutsche Genitivverbindung gibt die hebräische Konstruktverbindung knapp und idiomatisch wieder.
- source_word: וְאַל
  choice: und … nicht
  rationale: Die Konjunktion und die verneinte Aufforderung werden als direkte Koordination wiedergegeben.
- source_word: תִּטֹּשׁ
  choice: verwirf nicht
  rationale: Das Verb bezeichnet das Verlassen oder Aufgeben. „Verwirf nicht“ bringt hier die bewusste Abkehr von der mütterlichen Weisung natürlich und mit dem nötigen Gewicht zum Ausdruck.
- source_word: תּוֹרַת
  choice: Weisung
  rationale: Im häuslichen Weisheitskontext meint תּוֹרָה autoritative Anleitung, nicht notwendig ein formales Gesetzbuch. „Weisung“ erhält diese Autorität und zugleich die Nähe zu Lehre und Unterweisung.
- source_word: אִמֶּךָ
  choice: deiner Mutter
  rationale: Die Genitivverbindung ist idiomatisch und wahrt den Parallelismus zu „deines Vaters“.
theological_decisions:
- issue: Geschlechtsspezifische Anrede in der Weisheitsliteratur
  choice: mein Sohn
  alternative: mein Kind
  rationale: Der hebräische Text redet ausdrücklich einen Sohn in der maskulinen Einzahl an. Diese literarische und familiäre Rahmung wird nicht neutralisiert.
- issue: Bedeutung von תּוֹרָה im häuslichen Zusammenhang
  choice: Weisung
  alternative: Gesetz; Lehre
  rationale: Hier bezeichnet der Ausdruck die autoritative Weisung der Mutter. „Weisung“ vermeidet die unbegründete Einengung auf das mosaische Gesetz, ohne den verpflichtenden Charakter abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Höre … auf“ ist unmittelbar und verständlich; „Unterweisung“ und „Weisung“ bewahren den gehobenen Ton der Weisheitsliteratur, ohne altertümlich zu wirken. Der Parallelismus von Vater und Mutter bleibt erhalten.
