base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/018.yaml
  text: But they lie in wait for their own blood[b][a]; they set an ambush for their own lives.
translation:
  language: de
  text: Doch sie lauern auf ihr eigenes Blut[a]; sie legen sich gegen ihr eigenes Leben auf die Lauer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „Blut“. Das konkrete Bild zeigt, dass ihre Gewalttat auf sie selbst zurückfällt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie verbergen sich um ihres eigenen Lebens willen“. Das hebräische Verb bedeutet zunächst „verbergen“; im Zusammenhang ist wahrscheinlich das verborgene Lauern im Hinterhalt gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵם
  choice: Doch sie
  rationale: Die Verbindung mit dem ausdrücklich gesetzten Pronomen hebt im Zusammenhang den Gegensatz zur Warnung des vorigen Verses hervor.
- source_word: לְדָמָם
  choice: auf ihr eigenes Blut
  rationale: „Blut“ bewahrt das konkrete hebräische Bild; „eigenes“ verdeutlicht die rückbezügliche Ironie des Possessivsuffixes.
- source_word: יֶאֱרֹבוּ
  choice: lauern
  rationale: Das Verb bezeichnet das Auflauern beziehungsweise das Liegen im Hinterhalt und lässt sich hier knapp und natürlich wiedergeben.
- source_word: יִצְפְּנוּ
  choice: sich auf die Lauer legen
  rationale: Das Verb bedeutet grundsätzlich „verbergen“; im Parallelismus bezeichnet es wahrscheinlich das verborgene Warten im Hinterhalt, bleibt aber vom ersten Verb sprachlich unterschieden.
- source_word: לְנַפְשֹׁתָם
  choice: für ihr eigenes Leben
  rationale: נֶפֶשׁ meint hier angesichts drohender Gewalttat das Leben; „eigenes“ bringt erneut die Ironie zum Ausdruck, dass sie sich selbst gefährden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und die bittere Ironie des Hebräischen werden gewahrt; die beiden Verben bleiben voneinander unterschieden.
