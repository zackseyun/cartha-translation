translation:
  language: de
  text: Doch ihr habt meinen ganzen Rat missachtet[a] und meine Zurechtweisung nicht annehmen wollen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unbeachtet gelassen“ oder „beiseitegeschoben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und meine Zurechtweisung wolltet ihr nicht“; sinngemäß auch: „und meine Zurechtweisung habt ihr abgelehnt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְרְעוּ
  choice: Doch ihr habt … missachtet
  rationale: פרע bezeichnet hier im Parallelismus das bewusste Außerachtlassen oder Beiseiteschieben. „Missachtet“ ist modernes, klares Deutsch und liegt zwischen dem möglicherweise zu schwachen „vernachlässigt“ und dem stärkeren „verworfen“. Das einleitende ו wird im Zusammenhang natürlich mit „Doch“ wiedergegeben.
- source_word: כָל
  choice: meinen ganzen
  rationale: כָל bedeutet „ganz/alle“. Beim singularischen „Rat“ ist „meinen ganzen Rat“ die natürliche deutsche Form.
- source_word: עֲצָתִי
  choice: meinen ganzen Rat
  rationale: עֵצָה meint Rat, Beratung oder weise Anleitung. „Rat“ ist verständlich, würdevoll und lässt offen, ob einzelne Ratschläge oder die gesamte Weisungsrede gemeint sind.
- source_word: וְתוֹכַחְתִּי
  choice: meine Zurechtweisung
  rationale: תּוֹכַחַת bezeichnet in den Sprüchen eine korrigierende Rüge oder Mahnung. „Zurechtweisung“ bewahrt sowohl den korrigierenden als auch den ernsten Ton.
- source_word: לֹא אֲבִיתֶם
  choice: wolltet … nicht annehmen
  rationale: אָבָה bezeichnet Bereitschaft oder Einwilligung; mit der Verneinung wird bewusste Unwilligkeit ausgedrückt. „Wolltet … nicht annehmen“ bewahrt diesen Willensaspekt und ergänzt im Deutschen das vom Zusammenhang geforderte Verb.
