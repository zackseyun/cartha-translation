lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Auch ich
  rationale: Bewahrt sowohl den additiven beziehungsweise vergeltenden Zug von גַּם als auch die Betonung durch das ausdrücklich gesetzte Pronomen אֲנִי.
- source_word: בְּאֵידְכֶם
  choice: über euer Unglück
  rationale: אֵיד bezeichnet schweres Unglück, Verderben oder Unheil. Mit „lachen“ ist „über“ im Deutschen idiomatisch; „Unglück“ ist klar, würdig und ausreichend stark.
- source_word: אֶשְׂחָק
  choice: werde … lachen
  rationale: Gibt die Grundbedeutung des Qal von שׂחק ohne Abschwächung oder zusätzliche Steigerung wieder.
- source_word: אֶלְעַג
  choice: ich werde spotten
  rationale: לעג bezeichnet Spotten oder Verhöhnen. „spotten“ erhält die scharfe Parallele zu „lachen“ in natürlichem Deutsch.
- source_word: בְּבֹא
  choice: wenn … kommt
  rationale: Die Präposition ב mit dem Infinitivus constructus von בוא bildet eine temporale Aussage; „wenn … kommt“ ist die natürliche deutsche Wiedergabe.
- source_word: פַחְדְּכֶם
  choice: das, wovor euch graut
  rationale: פחד kann den Schrecken beziehungsweise die Furcht oder das gefürchtete Ereignis bezeichnen. Wegen des Verbs „kommen“ bringt die Formulierung den möglichen Ereignisbezug natürlich zum Ausdruck, während die Fußnote die lexikalische Mehrdeutigkeit festhält.
theological_decisions:
- issue: Ton der personifizierten Weisheit gegenüber den Unverständigen
  choice: Die Verben werden unverhüllt mit „lachen“ und „spotten“ wiedergegeben.
  alternative: Abschwächungen wie „lächeln“ oder Umdeutungen wie „sich freuen“
  rationale: Der hebräische Text verwendet starke Ausdrücke für Lachen und Spott im Zusammenhang einer gerichtlichen Warnung. Die Spannung wird weder beschönigt noch über die lexikalische Aussage hinaus gesteigert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Die parallelen Zukunftsaussagen und die Härte der Warnung bleiben erhalten; die Mehrdeutigkeit von פחד wird im Haupttext natürlich und in der Fußnote ausdrücklich wiedergegeben.
