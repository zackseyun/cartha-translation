translation:
  language: de
  text: Auch ich werde über euer Unglück lachen; ich werde spotten, wenn euer Schrecken kommt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn das kommt, wovor euch graut“. Das hebräische Wort kann sowohl die Furcht oder den Schrecken selbst als auch das gefürchtete Ereignis bezeichnen.'
