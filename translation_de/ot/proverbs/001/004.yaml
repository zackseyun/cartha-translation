  text: to give prudence to the simple[a], knowledge and discretion to the young man.
translation:
  language: de
  text: um den Unerfahrenen Klugheit zu geben, dem jungen Mann[a] Erkenntnis und Besonnenheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem jungen Menschen“ oder „einer jungen Person“. Das Hebräische steht im maskulinen Singular („dem jungen Mann“), der in der Weisheitsunterweisung auch repräsentativ gebraucht sein kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָתֵת
  choice: um … zu geben
  rationale: Der Infinitiv mit ל setzt die Zweckangabe der vorangehenden Verse fort. Die deutsche Konstruktion „um … zu geben“ macht diesen Zusammenhang natürlich und klar.
- source_word: לִפְתָאיִם
  choice: den Unerfahrenen
  rationale: פְתָאִים bezeichnet leicht beeinflussbare, noch unkundige Menschen, nicht Personen mit geringer Intelligenz. „Unerfahrene“ gibt den Sinn im heutigen Deutsch verständlich wieder.
- source_word: עָרְמָה
  choice: Klugheit
  rationale: עָרְמָה meint hier positiv eine umsichtige, lebenspraktische Klugheit, kann in anderen Zusammenhängen aber auch List bezeichnen. „Klugheit“ wahrt den positiven Sinn, ohne unnötig negative Konnotationen einzutragen.
- source_word: לְנַעַר
  choice: dem jungen Mann
  rationale: נַעַר ist maskulin singular und bezeichnet hier einen jungen Mann. Die Form wird im Haupttext bewahrt; ihre mögliche repräsentative Funktion wird in der Fußnote erläutert.
- source_word: דַּעַת
  choice: Erkenntnis
  rationale: דַּעַת bezeichnet im weisheitlichen Zusammenhang Wissen beziehungsweise Erkenntnis. „Erkenntnis“ fügt sich würdig und natürlich in das Vokabular der Sprüche ein.
- source_word: וּמְזִמָּה
  choice: und Besonnenheit
  rationale: מְזִמָּה bezeichnet hier überlegtes Planen und umsichtiges Urteilen. „Besonnenheit“ ist im modernen Deutsch positiv, idiomatisch und für gewöhnliche Leser verständlicher als das mehrdeutige „Diskretion“.
theological_decisions:
- issue: Maskuliner Singular in der Weisheitsunterweisung
  choice: dem jungen Mann
  alternative: dem jungen Menschen; der Jugend
  rationale: Der hebräische Text verwendet mit נַעַר einen maskulinen Singular. Der Haupttext bewahrt diese Form, ohne auszuschließen, dass der junge Mann in der Weisheitsunterweisung repräsentativ gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers setzt syntaktisch die Zweckangabe aus dem Zusammenhang fort. „Unerfahrene“ vermeidet die heute missverständliche Bezeichnung „Einfältige“, während „Besonnenheit“ die positive Bedeutung überlegten Handelns ausdrückt.
