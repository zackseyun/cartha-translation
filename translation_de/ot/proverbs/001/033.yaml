source:
  edition: WLC
  text: וְ/שֹׁמֵ֣עַֽ לִ֭/י יִשְׁכָּן בֶּ֑טַח וְ֝/שַׁאֲנַ֗ן מִ/פַּ֥חַד רָעָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/033.yaml
  text: But whoever listens to me will dwell securely and be at ease[a], without fear of disaster.
translation:
  language: de
  text: Wer aber auf mich hört, wird sicher wohnen und unbesorgt sein, ohne Angst vor Unheil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשֹׁמֵעַ לִי
  choice: Wer aber auf mich hört
  rationale: Das Partizip bezeichnet fortdauerndes, folgebereites Hören. „Wer“ gibt den generischen Bezug natürlich wieder; „aber“ macht den Gegensatz zum vorangehenden Schicksal derer deutlich, die Weisheit ablehnen.
- source_word: יִשְׁכָּן
  choice: wird … wohnen
  rationale: שׁכן bezeichnet das Wohnen beziehungsweise Sich-Niederlassen und bewahrt hier den Gedanken eines beständigen, geschützten Aufenthalts.
- source_word: בֶּטַח
  choice: sicher
  rationale: Das Wort bezeichnet Sicherheit und Geborgenheit; „sicher wohnen“ ist im Deutschen natürlich und inhaltlich präzise.
- source_word: וְשַׁאֲנַן
  choice: und unbesorgt sein
  rationale: Die Form bezeichnet einen ruhigen, ungestörten Zustand. „Unbesorgt“ passt zum positiven Zusammenhang und vermeidet die andernorts mögliche negative Bedeutung „selbstzufrieden“.
- source_word: מִפַּחַד רָעָה
  choice: ohne Angst vor Unheil
  rationale: מן bezeichnet hier Freiheit beziehungsweise Abstand von Furcht. רעה meint im Kontext drohendes Unglück oder Unheil, nicht ausdrücklich moralisches Böses.
theological_decisions:
- issue: Generischer Bezug des maskulinen Partizips
  choice: Wer … hört
  alternative: Der auf mich hört
  rationale: Das grammatisch maskuline Partizip ist in der Weisheitsunterweisung allgemein auf Menschen bezogen. „Wer“ bewahrt diesen umfassenden Sinn ohne unnötige geschlechtliche Einschränkung.
- issue: Personifizierte Weisheit als Sprecherin
  choice: Die erste Person „mich“ bleibt ohne erklärenden Zusatz stehen.
  alternative: auf mich, die Weisheit
  rationale: Der Zusammenhang weist die personifizierte Weisheit als Sprecherin aus. Eine ausdrückliche Ergänzung im Vers würde über den hebräischen Wortlaut hinausgehen.
- issue: Art der zugesagten Sicherheit
  choice: Die bildhafte Zusage wird ohne systematische Einschränkung oder Verabsolutierung wiedergegeben.
  alternative: Eine ausdrücklich nur geistliche oder ausnahmslos äußerliche Sicherheit
  rationale: Der Vers verspricht Sicherheit und Freiheit von der Angst vor Unheil. Die Übersetzung bewahrt diese Spannung, ohne eine nicht ausgesprochene dogmatische Präzisierung einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist klar und mündlich verständlich; „sicher wohnen“ hält zugleich die konkrete Wohn- und Ruhevorstellung des Hebräischen fest.
