  text: נִ֭בְלָעֵ/ם כִּ/שְׁא֣וֹל חַיִּ֑ים וּ֝/תְמִימִ֗ים כְּ/י֣וֹרְדֵי בֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/012.yaml
  text: Let us swallow them alive like Sheol[a], and whole like those who go down to the pit[b];
translation:
  language: de
  text: Lasst uns sie lebendig verschlingen wie das Totenreich[a] und unversehrt[b] wie die, die in die Grube hinabsteigen;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „wie Scheol“ oder „wie das Grab“. Das hebräische Wort bezeichnet das Totenreich.
    reason: lexical_alternative
  - marker: b
    text: Oder „ganz“ oder „vollständig“. Das hebräische Wort kann hier Vollständigkeit oder Unversehrtheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָעֵם
  choice: Lasst uns sie verschlingen
  rationale: Der Qal-Kohortativ der 1. Person Plural mit Suffix der 3. Person Plural drückt die Aufforderung beziehungsweise Absicht der Sprecher aus. „Verschlingen“ bewahrt das drastische Bild des hebräischen Verbs בלע.
- source_word: כִּשְׁאוֹל
  choice: wie das Totenreich
  rationale: שְׁאוֹל bezeichnet hier den Bereich der Toten und wird als alles verschlingende Macht vorgestellt. „Totenreich“ erhält dieses Bild im Deutschen verständlicher als eine bloße Wiedergabe mit „Grab“.
- source_word: חַיִּים
  choice: lebendig
  rationale: 'Das Wort beschreibt den Zustand der Opfer beim Verschlungenwerden: Sie sollen verschlungen werden, während sie noch leben.'
- source_word: וּתְמִימִים
  choice: vollständig
  rationale: תמים bezeichnet in diesem Zusammenhang eher Ganzheit oder Unversehrtheit als moralische Schuldlosigkeit. „Vollständig“ bewahrt diese körperlich-bildhafte Bedeutung, ohne sie auf eine ethische Aussage festzulegen.
- source_word: כְּיוֹרְדֵי בוֹר
  choice: wie die, die in die Grube hinabsteigen
  rationale: Die partizipiale Wendung bezeichnet Menschen, die in den Bereich des Todes hinabsteigen. „Grube“ bewahrt das konkrete poetische Bild von בור.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: das Totenreich
  alternative: Scheol; das Grab; der Tod
  rationale: „Totenreich“ vermittelt den hebräischen Vorstellungsbereich, ohne שְׁאוֹל auf ein einzelnes Grab oder allein auf das abstrakte Ereignis des Todes zu verengen. Die Fußnote nennt die traditionelle Transliteration.
- issue: Bedeutung von תְמִימִים im Zusammenhang
  choice: vollständig
  alternative: unversehrt; als Ganze; schuldlos
  rationale: Der unmittelbare Zusammenhang beschreibt einen gewaltsamen Überfall und das Verschlingen der Opfer. Daher ist die Bedeutung körperlicher Ganzheit wahrscheinlicher als eine moralische Bewertung; die verbleibende Bedeutungsbreite wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Aufforderungsform „Lasst uns“ gibt den Kohortativ unmittelbar wieder. Die parallele, drastische Bildsprache von Totenreich und Grube bleibt erhalten; das abschließende Semikolon entspricht dem Fortgang des Satzes in den folgenden Vers.
