id: PRO.1.3
reference: Proverbs 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ֭/קַחַת מוּסַ֣ר הַשְׂכֵּ֑ל צֶ֥דֶק וּ֝/מִשְׁפָּ֗ט וּ/מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/003.yaml
  text: to receive instruction in wise dealing[a], righteousness, justice[c][b], and equity.
translation:
  language: de
  text: um Unterweisung[a] in klugem Handeln[b], Gerechtigkeit, Recht und Aufrichtigkeit[c] anzunehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Erziehung“ beziehungsweise „Zucht“; das hebräische Wort meint formende Unterweisung, die auch Korrektur einschließen kann.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist praktische Klugheit im Handeln und in der Lebensführung, nicht nur verstandesmäßiges Verstehen.
    reason: lexical_alternative
  - marker: c
    text: Oder „Geradheit“ beziehungsweise „Fairness“.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחַת
  choice: anzunehmen
  rationale: Der Infinitiv führt die Zweckangaben aus Sprüche 1,2–3 fort. Obwohl das Verb wörtlich „nehmen“ bedeutet, ist bei Unterweisung idiomatisch „annehmen“ gemeint.
- source_word: מוּסַר
  choice: Unterweisung
  rationale: Das Wort umfasst Unterweisung, erzieherische Zucht und Korrektur. „Unterweisung“ gibt hier den umfassenden pädagogisch-ethischen Sinn wieder, ohne den Ausdruck unnötig auf Strafe zu verengen.
- source_word: הַשְׂכֵּל
  choice: kluges Handeln
  rationale: Der Ausdruck bezeichnet praktische Einsicht und Geschick im weisen Lebensvollzug, nicht nur verstandesmäßiges Begreifen.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: Das Wort bezeichnet hier das Rechte beziehungsweise ethische Gerechtigkeit und bleibt damit vom folgenden משפט unterscheidbar.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Im Zusammenhang der ethischen Dreiergruppe bezeichnet das Wort gerechtes Urteil und eine rechte soziale Ordnung. „Recht“ ist knapp und unterscheidet sich im Deutschen von „Gerechtigkeit“.
- source_word: מֵישָׁרִים
  choice: Aufrichtigkeit
  rationale: Der Plural bezeichnet bildlich Geradheit und ethisch aufrichtiges, faires Verhalten. „Aufrichtigkeit“ bewahrt dieses Bildfeld besser als das stärker juristisch klingende „Billigkeit“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Infinitivkonstruktion schließt unmittelbar an die Zweckreihe des vorangehenden Kontextes an. Die drei ethischen Begriffe bleiben als unterscheidbare, aber semantisch verwandte Größen erhalten.
