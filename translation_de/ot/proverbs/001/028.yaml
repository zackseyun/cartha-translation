base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/028.yaml
  text: Then they will call on me[a], but I will not answer; they will seek me diligently, but they will not find me.
translation:
  language: de
  text: Dann werden sie nach mir rufen, doch ich werde nicht antworten; sie werden mich eifrig suchen[a], doch sie werden mich nicht finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie werden mich früh suchen“. Das hebräische Verb kann sowohl frühes als auch eifriges Suchen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das Temporaladverb kennzeichnet die Folge der vorausgehenden Warnung; „Dann“ gibt die zeitlich-folgernde Beziehung knapp und natürlich wieder.
- source_word: יִקְרָאֻנְנִי
  choice: sie werden nach mir rufen
  rationale: קרא bezeichnet hier den Hilferuf an eine Person in der Erwartung einer Antwort. „Nach mir rufen“ ist im Deutschen natürlich und bewahrt die Zielrichtung des Rufens.
- source_word: וְלֹא אֶעֱנֶה
  choice: doch ich werde nicht antworten
  rationale: Das hebräische ו ist formal additiv, wirkt zusammen mit der Verneinung hier jedoch deutlich kontrastiv; „doch“ bringt diesen Gegensatz idiomatisch zum Ausdruck.
- source_word: יְשַׁחֲרֻנְנִי
  choice: sie werden mich eindringlich suchen
  rationale: Das Piel von שׁחר kann frühes, eifriges oder ernstliches Suchen bezeichnen. „Eindringlich suchen“ hebt im Kontext die Dringlichkeit hervor, ohne die lexikalische Alternative des frühen Suchens zu verschweigen.
- source_word: וְלֹא יִמְצָאֻנְנִי
  choice: doch sie werden mich nicht finden
  rationale: מצא bedeutet schlicht „finden“; „doch“ gibt wie im parallelen ersten Satzglied den scharfen Gegensatz zwischen Suchen und ausbleibendem Finden wieder.
theological_decisions:
- issue: Identität der Sprecherin im Kontext
  choice: Die Ich-Rede bleibt als Rede der personifizierten Weisheit im unmittelbaren literarischen Zusammenhang stehen.
  alternative: Die Sprecherin im Haupttext ausdrücklich christologisch oder unmittelbar mit Gott identifizieren.
  rationale: Sprüche 1 stellt die Weisheit personifiziert redend dar. Die Übersetzung wahrt diese literarische Gestalt und lässt weiterführende typologische oder theologische Deutungen offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Halbverse und die kontrastive Härte der Aussage bleiben erhalten; die seltenere Bedeutungsnuance von שׁחר wird in einer Fußnote bewahrt.
