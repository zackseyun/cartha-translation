  yaml_path: translation/ot/proverbs/022/027.yaml
  text: If you have nothing with which to pay[a], why should he take your bed from under you?
translation:
  language: de
  text: Wenn du nichts hast, womit du bezahlen kannst, warum sollte man dir dein Bett unter dir[a] wegnehmen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unter dir“. Gemeint ist anschaulich das Bett oder Lager, auf dem du liegst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֵין לְךָ
  choice: Wenn du nichts hast
  rationale: Die hebräische Konstruktion mit אֵין und לְךָ drückt Nichtbesitz aus; die deutsche Formulierung gibt dies natürlich als Bedingung wieder.
- source_word: לְשַׁלֵּם
  choice: womit du bezahlen kannst
  rationale: Der Infinitiv von שׁלם bezeichnet hier das Begleichen einer Schuld; die Formulierung bewahrt den Bezug auf fehlende Zahlungsmittel.
- source_word: לָמָּה יִקַּח
  choice: warum sollte man … wegnehmen?
  rationale: לָמָּה leitet eine rhetorische Frage ein. Das Subjekt der 3. Person Singular bleibt im Hebräischen unausgesprochen; das unpersönliche „man“ wahrt diese Offenheit, während „wegnehmen“ im Deutschen die Entfernung des Bettes aus seiner Lage natürlich ausdrückt.
- source_word: מִשְׁכָּבְךָ
  choice: dein Bett
  rationale: Das Substantiv bezeichnet konkret den Ort oder Gegenstand, auf dem man liegt. „Bett“ ist im heutigen Deutsch klar und bewahrt das konkrete Bild.
- source_word: מִתַּחְתֶּיךָ
  choice: unter dem Leib
  rationale: Wörtlich steht „unter dir“. „Unter dem Leib“ macht im Deutschen anschaulich, dass das Bett weggenommen wird, während der Schuldner darauf liegt, ohne den Gegenstand zu verallgemeinern.
