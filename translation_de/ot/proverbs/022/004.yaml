  text: עֵ֣קֶב עֲ֭נָוָה יִרְאַ֣ת יְהוָ֑ה עֹ֖שֶׁר וְ/כָב֣וֹד וְ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/004.yaml
  text: The reward of humility and the fear of Yahweh is wealth and honor and life[a].
translation:
  language: de
  text: Der Lohn für Demut und die Furcht vor Jahwe ist Reichtum, Ehre und Leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, weniger wahrscheinlich: »Der Lohn der Demut ist die Furcht vor Jahwe, Reichtum, Ehre und Leben.«'
    reason: alternative_reading
lexical_decisions:
- source_word: עֵקֶב
  choice: Lohn für
  rationale: Das Wort kann Folge, Ergebnis oder Vergeltung beziehungsweise Lohn bezeichnen. Hier leitet es die segensreichen Folgen der genannten Haltungen ein; »Lohn für« gibt den sprichwörtlichen Zusammenhang natürlich wieder.
- source_word: עֲנָוָה
  choice: Demut
  rationale: »Demut« ist die klare und im heutigen Standarddeutsch geläufige Wiedergabe für Niedrigkeit beziehungsweise demütige Haltung, ohne unnötig Passivität anzudeuten.
- source_word: יִרְאַת יְהוָה
  choice: die Furcht vor Jahwe
  rationale: Die feste Weisheitsformel bezeichnet ehrfürchtige Gottesfurcht. »Furcht« wahrt dabei mehr von der semantischen und theologischen Spannung als die abschwächende Paraphrase »Ehrfurcht«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, sodass der im Hebräischen stehende Eigenname erhalten bleibt und nicht durch einen Titel ersetzt wird.
- source_word: עֹשֶׁר
  choice: Reichtum
  rationale: Das Substantiv bezeichnet materiellen Wohlstand; »Reichtum« ist eine direkte und natürliche deutsche Entsprechung.
- source_word: כָבוֹד
  choice: Ehre
  rationale: Im Kontext dieses Weisheitsspruchs geht es um Ansehen beziehungsweise Ehre im menschlichen Lebensbereich, nicht primär um göttliche Herrlichkeit.
- source_word: חַיִּים
  choice: Leben
  rationale: Obwohl das hebräische Wort formal im Plural steht, bezeichnet es gewöhnlich abstrakt »Leben«. »Langes Leben« wäre möglicherweise mitgemeint, steht aber nicht ausdrücklich im Text.
theological_decisions:
- issue: Syntaktisches Verhältnis zwischen »Demut« und »Furcht vor Jahwe«
  choice: Beide werden als zusammengehörige Haltungen verstanden, deren Lohn Reichtum, Ehre und Leben sind.
  alternative: »Der Lohn der Demut ist die Furcht vor Jahwe, dazu Reichtum, Ehre und Leben.«
  rationale: Die knappe hebräische Wortfolge ist mehrdeutig. Die koordinierte Lesart fügt sich am natürlichsten in den Aufbau des Spruchs und lässt die abschließende Dreiergruppe als Folgen beider Haltungen erkennen. Die mögliche appositionelle Lesart wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Form. Die traditionelle Weisheitswendung »Furcht vor Jahwe« bleibt erhalten. Der Plural »sind« richtet sich natürlich nach der Aufzählung »Reichtum, Ehre und Leben«.
