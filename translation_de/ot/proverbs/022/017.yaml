base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/017.yaml
  text: Incline your ear and hear the words of the wise[a], and set your heart on my knowledge.
translation:
  language: de
  text: Neige dein Ohr und höre die Worte der Weisen; wende dein Herz meiner Erkenntnis[a] zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meiner Lehre“. Wörtlich steht im Hebräischen „meiner Erkenntnis/meinem Wissen“. Gemeint sein kann entweder die Erkenntnis des Sprechers selbst oder, in übertragener Bedeutung, die Lehre, die diese Erkenntnis vermittelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַט אָזְנְךָ
  choice: Neige dein Ohr
  rationale: Die bildhafte Aufforderung wird mit dem Singular des Hebräischen bewahrt und bezeichnet bewusstes, aufmerksames Zuhören.
- source_word: וּשְׁמַע
  choice: und höre
  rationale: Die eigenständige Aufforderung bleibt neben dem Neigen des Ohres erhalten; „höre“ gibt שׁמע hier unmittelbar wieder.
- source_word: דִּבְרֵי חֲכָמִים
  choice: die Worte der Weisen
  rationale: Die Formulierung bewahrt sowohl den Plural „Worte“ als auch die nicht ausdrücklich geschlechtsspezifische Bezeichnung „Weise“.
- source_word: וְלִבְּךָ תָּשִׁית
  choice: richte dein Herz
  rationale: „Herz“ bewahrt das hebräische Bild für Denken, Wollen und innere Ausrichtung; „richte“ gibt die zielgerichtete Bedeutung von תָּשִׁית natürlich wieder.
- source_word: לְדַעְתִּי
  choice: auf mein Wissen
  rationale: Die Wiedergabe erhält das Nomen „Wissen“ und das Suffix der ersten Person. Die mögliche übertragene Bedeutung „meine Lehre“ wird wegen der echten Mehrdeutigkeit in einer Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Bildsprache von Ohr und Herz sowie die knappe Folge der Aufforderungen bleiben erhalten. Das Semikolon macht die Zweiteilung des Verses lesbar, ohne eine zusätzliche Deutung einzutragen.
