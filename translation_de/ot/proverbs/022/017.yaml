  to: Neige dein Ohr und höre die Worte der Weisen; wende dein Herz meiner Erkenntnis[a] zu.
  rationale: Die Änderung ersetzt allein die im Deutschen wenig natürliche Wortverbindung „auf mein Wissen“ durch eine idiomatische Zielkonstruktion. Die erste Person, das Substantivische von דעת und die im Kontext mögliche Lesart „Lehre“ bleiben erhalten; die Fußnote dokumentiert die Auslegungsalternative, ohne sie im Haupttext festzulegen.
