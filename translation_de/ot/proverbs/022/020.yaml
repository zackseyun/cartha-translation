  text: הֲ/לֹ֤א כָתַ֣בְתִּי לְ֭/ךָ שלשום בְּ/מ֖וֹעֵצֹ֣ת וָ/דָֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/020.yaml
  text: Have I not written for you thirty sayings of counsel and knowledge?[a][b]
translation:
  language: de
  text: Habe ich nicht für dich dreißig Aussprüche über Rat und Erkenntnis geschrieben?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Habe ich dir nicht schon früher über Rat und Erkenntnis geschrieben?“ Das hier traditionell auch mit „früher“ wiedergegebene hebräische Wort ist schwierig; viele verstehen es stattdessen als „dreißig“, möglicherweise als Hinweis auf eine Sammlung von dreißig Aussprüchen.'
    reason: alternative_reading
  - marker: b
    text: Traditionelle Übersetzungen geben den schwierigen hebräischen Ausdruck teilweise mit „Vortreffliches“ wieder statt mit „dreißig Aussprüche“. Dem liegt eine andere Deutung der Form zugrunde.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Habe ich nicht
  rationale: Die Partikel leitet eine rhetorische Frage ein, auf die eine bejahende Antwort erwartet wird. Die deutsche Form bewahrt sowohl den Fragecharakter als auch diese Erwartung.
- source_word: כָתַבְתִּי
  choice: aufgeschrieben
  rationale: Das Qal-Perfekt in der 1. Person Singular bezeichnet eine abgeschlossene Schreibhandlung. Im Deutschen gibt das Perfekt zusammen mit „nicht“ die rhetorische Frage natürlich wieder; „aufschreiben“ passt zu einer für den Lernenden zusammengestellten Unterweisung.
- source_word: לְךָ
  choice: für dich
  rationale: Die Präposition ל kann Richtung oder Nutzen bezeichnen. Im Lehrzusammenhang hebt „für dich“ hervor, dass die Worte zum Nutzen des Angesprochenen niedergeschrieben wurden.
- source_word: שלשום
  choice: dreißig Aussprüche
  rationale: Die überlieferte Form ist schwierig. Im Zusammenhang wird sie häufig als Zahlwort „dreißig“ verstanden, das auf eine Sammlung von Lehrworten verweist. „Aussprüche“ ergänzt das im Deutschen erforderliche Bezugswort aus dem literarischen Kontext, ohne die Unsicherheit zu verschweigen.
- source_word: בְּמוֹעֵצוֹת
  choice: mit Rat
  rationale: Das Substantiv עֵצָה bezeichnet Rat, Beratung oder einen Plan. Die Präposition ב wird hier begleitend beziehungsweise inhaltlich verstanden; „mit Rat“ bleibt nah an der knappen hebräischen Formulierung.
- source_word: וָדָעַת
  choice: und Erkenntnis
  rationale: דַּעַת bedeutet im Weisheitswortschatz „Wissen“ oder „Erkenntnis“. „Erkenntnis“ wahrt den gehobenen, aber allgemein verständlichen Ton und die Verbindung mit „Rat“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter rhetorischer Frage. „Aussprüche“ ist eine kontextbedingte Ergänzung zu „dreißig“; die konkurrierenden Deutungen des schwierigen hebräischen Ausdrucks werden in den Fußnoten offengehalten.
