source:
  edition: WLC
  text: טֽוֹב עַ֭יִן ה֣וּא יְבֹרָ֑ךְ כִּֽי נָתַ֖ן מִ/לַּחְמ֣/וֹ לַ/דָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/009.yaml
  text: He who has a generous eye will be blessed[a], for he gives some of his bread to the poor.
translation:
  language: de
  text: Wer großzügig ist[a], wird gesegnet; denn er gibt dem Armen von seinem Brot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wer ein gutes Auge hat«. Ein »gutes Auge« ist im Hebräischen ein Bild für Großzügigkeit und Freigebigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב עַיִן
  choice: wer großzügig ist
  rationale: Wörtlich steht hier »wer ein gutes Auge hat«. Die Wendung bezeichnet einen Menschen, der anderen bereitwillig und großzügig gibt. Die idiomatische Übersetzung gibt den gemeinten Sinn in natürlichem Deutsch wieder; die Fußnote bewahrt das hebräische Bild.
- source_word: יְבֹרָךְ
  choice: wird gesegnet
  rationale: Die passive Verbform bezeichnet den Segen, den der großzügige Mensch empfängt. Das Futur passt zum allgemeinen Folgesatz eines Sprichworts, ohne den Segnenden ausdrücklich zu benennen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für die vorangehende Aussage ein. »Denn« ist in diesem Zusammenhang knapp und natürlich.
- source_word: נָתַן
  choice: er gibt
  rationale: Obwohl die hebräische Form formal ein Perfekt ist, beschreibt sie im Spruchkontext das kennzeichnende Handeln des großzügigen Menschen. Das deutsche Präsens bringt diesen allgemeinen, wiederkehrenden Sinn zum Ausdruck.
- source_word: מִלַּחְמוֹ
  choice: von seinem Brot
  rationale: 'Die Formulierung bewahrt sowohl das konkrete Bild des Brotes als auch die partitive Bedeutung der Präposition: Er gibt etwas aus seinem eigenen Vorrat.'
- source_word: לַדָּל
  choice: dem Armen
  rationale: דַּל bezeichnet hier einen wirtschaftlich schwachen, bedürftigen Menschen. Der Singular »dem Armen« entspricht der Form des hebräischen Textes.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich spruchhaft-würdevolles Deutsch. Das hebräische Idiom wird im Haupttext sinngemäß wiedergegeben und in der Fußnote transparent gemacht; die konkrete Brot-Metapher und die passive Aussage über den Segen bleiben erhalten.
