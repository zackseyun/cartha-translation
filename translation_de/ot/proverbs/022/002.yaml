  text: עָשִׁ֣יר וָ/רָ֣שׁ נִפְגָּ֑שׁוּ עֹשֵׂ֖ה כֻלָּ֣/ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/002.yaml
  text: The rich and the poor meet together[a]; Yahweh is the maker of them all.
translation:
  language: de
  text: Reiche und Arme begegnen einander[a]; Jahwe hat sie alle geschaffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Reiche und Arme haben dies gemeinsam: Jahwe hat sie alle geschaffen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר וָרָשׁ
  choice: Reiche und Arme
  rationale: Die substantivierten Adjektive bezeichnen die beiden sozialen Gruppen in allgemeinem Sinn. Der deutsche Plural gibt diese repräsentative Aussage knapp und natürlich wieder.
- source_word: נִפְגָּשׁוּ
  choice: begegnen einander
  rationale: Das Nifal von פגשׁ bezeichnet hier ein gegenseitiges Begegnen oder Zusammentreffen. „Begegnen einander“ bewahrt das konkrete Bild und den reziproken Sinn, ohne die mögliche sprichwörtliche Folgerung bereits in den Haupttext einzutragen.
- source_word: עֹשֵׂה כֻלָּם
  choice: hat sie alle geschaffen
  rationale: Das substantivisch gebrauchte Partizip von עשה stellt Jahwe als den Urheber aller Genannten dar. Im Deutschen gibt die finite Form die Aussage natürlich wieder; „geschaffen“ macht im Zusammenhang mit Gottes Wirken den gemeinten Ursprung deutlicher als das missverständliche „gemacht“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen transliterierten Form wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Aussagekraft des ersten Versteils
  choice: Der Haupttext bewahrt das konkrete Bild, dass Reiche und Arme einander begegnen, und verbindet beide mit Jahwe als ihrem gemeinsamen Schöpfer.
  alternative: '„Reiche und Arme haben dies gemeinsam: Jahwe hat sie alle geschaffen.“'
  rationale: נִפְגָּשׁוּ bedeutet zunächst „einander begegnen/zusammentreffen“, kann im knappen Spruchstil aber auf eine gemeinsame Wirklichkeit hinweisen. Die Übersetzung legt diese weitergehende Deutung nicht zwingend fest, sondern nennt sie in der Fußnote.
translation_notes:
  register: Knappes, würdiges und allgemein verständliches modernes Standarddeutsch. Der parallele Gegensatz zwischen Reichen und Armen sowie die theologische Pointe des zweiten Versteils bleiben klar erhalten.
