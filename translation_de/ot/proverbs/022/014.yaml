source:
  edition: WLC
  text: שׁוּחָ֣ה עֲ֭מֻקָּה פִּ֣י זָר֑וֹת זְע֥וּם יְ֝הוָ֗ה יפול שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/014.yaml
  text: The mouth of forbidden women is a deep pit[a]; he who is under Yahweh’s wrath will fall there.
translation:
  language: de
  text: Der Mund verbotener Frauen[a] ist eine tiefe Grube; wer unter dem Zorn Jahwes steht, wird dort hineinfallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fremder Frauen“, „ausländischer Frauen“ oder „ehebrecherischer Frauen“. Der hebräische Ausdruck bezeichnet in den Sprüchen häufig Frauen, die außerhalb legitimer sexueller beziehungsweise bundesgemäßer Grenzen stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּחָה עֲמֻקָּה
  choice: eine tiefe Grube
  rationale: Die Wortgruppe bezeichnet konkret eine tiefe Grube und bewahrt das Bild von Gefahr und Gefangenschaft.
- source_word: פִּי
  choice: der Mund
  rationale: Die wörtliche Wiedergabe erhält das hebräische Bild; verführerische Rede kann dabei mitschwingen, ohne ausdrücklich ergänzt zu werden.
- source_word: זָרוֹת
  choice: verbotener Frauen
  rationale: In den Sprüchen bezeichnet der Ausdruck häufig Frauen außerhalb legitimer sexueller beziehungsweise bundesgemäßer Grenzen. „Verboten“ gibt diesen Sinn wieder, ohne ihn ausschließlich auf Ehebruch oder ethnische Fremdheit festzulegen.
- source_word: זְעוּם
  choice: unter dem Zorn ... steht
  rationale: Das passive Partizip bezeichnet jemanden, der Gegenstand göttlichen Unwillens ist. Die Formulierung ist im Deutschen natürlich und wahrt den Zustandscharakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יפול שָׁם
  choice: wird dort hineinfallen
  rationale: Das Imperfekt drückt hier die sprichwörtliche Folge aus. „Hineinfallen“ macht im Deutschen den Rückbezug auf die Grube natürlich deutlich, ohne das Bild zu erweitern.
theological_decisions:
- issue: Bedeutung von זָרוֹת im Weisheitskontext
  choice: verbotene Frauen
  alternative: fremde Frauen; ausländische Frauen; ehebrecherische Frauen
  rationale: Der Ausdruck ist mehrdeutig, bezeichnet in den Sprüchen jedoch gewöhnlich Frauen außerhalb legitimer sexueller Grenzen. Die gewählte Form wahrt die moralisch-relationale Bedeutung, ohne sie auf ethnische Herkunft oder ausschließlich auf Ehebruch zu verengen.
- issue: Bedeutung von זְעוּם יְהוָה
  choice: wer unter dem Zorn Jahwes steht
  alternative: wer von Jahwe verflucht ist; wen Jahwe verabscheut
  rationale: Die Übersetzung gibt den Menschen als Gegenstand von Jahwes Entrüstung wieder, ohne die Wendung unnötig zu „verflucht“ oder „verabscheut“ zuzuspitzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache des Hebräischen bleibt erhalten; „dort hineinfallen“ stellt den deutschen Richtungsbezug idiomatisch her. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
