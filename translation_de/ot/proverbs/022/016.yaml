source:
  edition: WLC
  text: עֹ֣שֵֽׁק דָּ֭ל לְ/הַרְבּ֣וֹת ל֑/וֹ נֹתֵ֥ן לְ֝/עָשִׁ֗יר אַךְ לְ/מַחְסֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/016.yaml
  text: One who oppresses the poor to increase his own wealth[a], or gives to the rich[b], will come only to poverty.
translation:
  language: de
  text: Wer den Armen unterdrückt, um sich selbst zu bereichern,[a] oder dem Reichen gibt, gerät nur in Armut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer den Armen unterdrückt, um sich selbst zu bereichern, und dem Reichen gibt, gerät nur in Armut.“ Das Hebräische kann zwei vergleichbare Handlungen oder ein zusammengehöriges Verhaltensmuster beschreiben.'
    reason: alternative_reading
  - marker: b
    text: „Armut“ kann auch mit „Mangel“ oder „Not“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׁק
  choice: Wer … unterdrückt
  rationale: Das substantivisch gebrauchte Qal-Partizip bezeichnet allgemein einen Menschen, der andere bedrängt oder ausbeutet. Die deutsche Wer-Konstruktion gibt diesen allgemeinen, charakteristischen Sinn natürlich wieder.
- source_word: דָּל
  choice: den Armen
  rationale: דָּל kann einen armen, sozial niedrigen oder schwachen Menschen bezeichnen. Der wirtschaftliche Zusammenhang legt hier „den Armen“ nahe.
- source_word: לְהַרְבּוֹת לוֹ
  choice: um sich selbst zu bereichern
  rationale: Die Infinitivkonstruktion bezeichnet Zweck oder Ergebnis; לוֹ bedeutet wörtlich „für ihn“. Im Zusammenhang wird dies am natürlichsten als Gewinn zugunsten des Unterdrückers verstanden. Die Formulierung macht den impliziten wirtschaftlichen Zuwachs verständlich, ohne den Sinn unnötig auszuweiten.
- source_word: נֹתֵן לְעָשִׁיר
  choice: oder dem Reichen gibt
  rationale: Das zweite Qal-Partizip steht knapp neben dem ersten. „Oder“ stellt die beiden Handlungen als vergleichbare Wege zu demselben Ergebnis dar; die mögliche kumulative Lesart mit „und“ wird in der Fußnote offengehalten.
- source_word: אַךְ
  choice: nur
  rationale: 'אַךְ wirkt hier einschränkend und nachdrücklich: Das Ergebnis ist nichts als Mangel beziehungsweise Armut.'
- source_word: לְמַחְסוֹר
  choice: gerät … in Armut
  rationale: מַחְסוֹר bezeichnet Mangel, Not oder Armut. „In Armut geraten“ ist im Deutschen eine natürliche Wiedergabe des wirtschaftlichen Ergebnisses.
theological_decisions:
- issue: Syntaktisches Verhältnis der beiden Partizipien
  choice: 'Der Vers nennt zwei vergleichbare, selbstschädigende Handlungen: den Armen zur eigenen Bereicherung unterdrücken oder dem Reichen geben.'
  alternative: Der Vers beschreibt eine einzige Person, die sowohl den Armen unterdrückt als auch dem Reichen gibt; das gesamte Verhaltensmuster führt in Armut.
  rationale: Der hebräische Satz ist stark verdichtet und lässt die Verknüpfung unausgesprochen. Die Hauptfassung mit „oder“ ist im Deutschen klar, während die Fußnote die ebenso mögliche kumulative Lesart bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Die Formulierung vermeidet konfessionelle Festlegungen und kennzeichnet die syntaktische sowie lexikalische Mehrdeutigkeit in den Fußnoten.
