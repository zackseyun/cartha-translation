  text: אִ֭וֶּלֶת קְשׁוּרָ֣ה בְ/לֶב נָ֑עַר שֵׁ֥בֶט מ֝וּסָ֗ר יַרְחִיקֶ֥/נָּה מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/015.yaml
  text: Folly is bound up in the heart of a boy[a]; the rod of discipline will drive it far from him.
translation:
  language: de
  text: Torheit haftet im Herzen eines Jungen[a]; die Rute der Zurechtweisung wird sie weit von ihm fernhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Torheit ist an das Herz eines jungen Menschen gebunden.“'
    reason: 'Lexikalische Alternative: נַעַר kann eine breitere Altersspanne bezeichnen; קְשׁוּרָה bedeutet „gebunden/angebunden“.'
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: Torheit
  rationale: Das Substantiv bezeichnet in der Weisheitsliteratur nicht bloß mangelnde Einsicht, sondern moralische und praktische Unvernunft. „Torheit“ ist dafür die prägnante, traditionsfähige und zugleich verständliche Entsprechung.
- source_word: קְשׁוּרָה
  choice: ist … festgebunden
  rationale: Das passive Partizip beschreibt etwas, das eng angebunden oder fest verknüpft ist. „Festgebunden“ bewahrt das konkrete Bild und vermittelt die tiefe Verhaftung der Torheit im Inneren.
- source_word: בְלֶב
  choice: im Herzen
  rationale: Das Herz bezeichnet im Hebräischen das Zentrum von Denken, Wollen und Begehren. Die wörtliche Wiedergabe bewahrt das Menschenbild und die Metapher des Ausgangstextes.
- source_word: נָעַר
  choice: eines Jungen
  rationale: נָעַר kann je nach Kontext einen Knaben, Jungen oder jungen Mann bezeichnen. Hier passt „Junge“ zum männlichen Singular und zum Zusammenhang erzieherischer Zucht, ohne das Alter zu eng festzulegen.
- source_word: שֵׁבֶט
  choice: die Rute
  rationale: Das Wort bezeichnet einen Stab beziehungsweise eine Rute und trägt hier das konkrete Bild eines Mittels der Zurechtweisung. „Rute“ erhält diese körperlich-konkrete Bildsprache.
- source_word: מוּסָר
  choice: der Zucht
  rationale: מוּסָר umfasst erziehende Unterweisung, Korrektur und disziplinierende Zurechtweisung. In der festen Verbindung „Rute der Zucht“ gibt „Zucht“ den korrektiven Aspekt knapp und würdig wieder, auch wenn das Wort im heutigen Deutsch gehoben wirkt.
- source_word: יַרְחִיקֶנָּה
  choice: wird sie weit … entfernen
  rationale: Der Hifil von רחק bedeutet, etwas weit weg sein zu lassen beziehungsweise weit zu entfernen. Die Formulierung erhält sowohl die kausative Bedeutung als auch das im Hebräischen ausdrücklich enthaltene Moment der Entfernung.
- source_word: מִמֶּנּוּ
  choice: von ihm
  rationale: Die Präposition mit männlichem Suffix bezeichnet die Trennung vom Jungen; „von ihm“ gibt dies unmittelbar wieder.
theological_decisions:
- issue: Konkrete Bildsprache körperlicher Züchtigung
  choice: Die Wendung „die Rute der Zucht“ bleibt im Haupttext erhalten.
  alternative: Nur abstrakt mit „Erziehung“, „Disziplin“ oder „Zurechtweisung“ wiedergeben.
  rationale: Der hebräische Text nennt ausdrücklich שֵׁבֶט, eine Rute beziehungsweise einen Stab. Eine abstrakte Wiedergabe würde die ethische Spannung des Spruchs abschwächen und ein konkretes Bild des Ausgangstextes auslassen. Der Genitiv „der Zucht“ macht zugleich den erzieherisch-korrektiven Zusammenhang deutlich, ohne über den Vers hinaus eine allgemeine Lehre zu formulieren.
- issue: Geschlechtsbezogene Wiedergabe von נָעַר
  choice: „eines Jungen“
  alternative: „eines Kindes“ oder „eines jungen Menschen“
  rationale: Das Ausgangswort steht im männlichen Singular und bezeichnet hier wahrscheinlich einen männlichen Heranwachsenden. Die Übersetzung bewahrt diese Form, statt sie ohne textlichen Anlass zu neutralisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Bildsprache. „Rute der Zucht“ ist bewusst konkret und leicht gehoben; die Formulierung vermeidet sowohl eine modernisierende Abschwächung als auch zusätzliche konfessionelle Deutung.
