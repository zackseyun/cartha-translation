review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die generische Partizipialkonstruktion („Wer ... sät“), die Folgeaussage („wird ... ernten“) und die Bildsprache des masoretischen Textes zuverlässig wieder. „Unrecht“ für עַוְלָה und „Unheil“ für אָוֶן sind im Kontext angemessen. Die Schlussklausel bewahrt mit „die Rute seines Zorns“ die offene hebräische Genitivverbindung, ohne ihre genaue Funktion übermäßig auszudeuten; „wird ein Ende haben“ entspricht יִכְלֶה gut.
  naturalness: Modernes, verständliches Standarddeutsch in einer knappen, sprichwortartigen Form. Die Formulierung „Rute seines Zorns“ ist im heutigen Deutsch markiert, aber als bewusst beibehaltene Metapher und aufgrund der semantischen Offenheit des Hebräischen vertretbar. „Wird ein Ende haben“ ist idiomatisch und klar.
  terminology: „Unrecht“, „Unheil“, „Rute“ und „Zorn“ sind treffende, registergerechte Wiedergaben. Die Fußnoten bieten sinnvolle lexikalische Alternativen und erläutern die schwierige Schlusswendung, ohne eine konfessionell geprägte Deutung festzuschreiben. Die Anker stehen jeweils bei der betreffenden Übersetzungseinheit.
