source:
  edition: WLC
  text: זוֹרֵ֣עַ עַ֭וְלָה יקצור אָ֑וֶן וְ/שֵׁ֖בֶט עֶבְרָת֣/וֹ יִכְלֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/008.yaml
  text: Whoever sows injustice will reap trouble[b][a], and the rod of his fury will come to an end.
translation:
  language: de
  text: Wer Unrecht sät, wird Unheil ernten[a], und die Rute seines Zorns wird ein Ende haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unglück“, „Mühsal“ oder „Verderben“. Das hebräische Wort kann eine schädliche Folge oder das daraus entstehende Leid bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und die Rute seines Zorns wird zu Ende gehen“. Gemeint sein kann, dass die zornige Gewalt oder Macht des Unrechttuenden aufhört.'
    reason: alternative_reading
lexical_decisions:
- source_word: זוֹרֵעַ
  choice: Wer … sät
  rationale: Das maskuline Qal-Partizip formuliert eine allgemeingültige Weisheit. „Wer … sät“ gibt diesen generischen Sinn natürlich wieder und bewahrt das landwirtschaftliche Bild.
- source_word: עַוְלָה
  choice: Unrecht
  rationale: Das Substantiv bezeichnet moralisches Unrecht beziehungsweise ungerechtes Handeln. „Unrecht“ ist im heutigen Deutsch klar und gewichtig, ohne den Sinn unnötig einzuengen.
- source_word: יקצור
  choice: wird … ernten
  rationale: Das Imperfekt beschreibt hier die zu erwartende Folge des Säens. Die Zukunftsform bewahrt den Zusammenhang von Handlung und Konsequenz.
- source_word: אָוֶן
  choice: Unheil
  rationale: Das Wort kann Unheil, Mühsal, Verderben oder schädliche Folge bezeichnen. Als Ertrag des Unrechts hebt „Unheil“ die verderbliche Konsequenz hervor, ohne festzulegen, ob äußeres Unglück oder persönliches Leid gemeint ist.
- source_word: וְשֵׁבֶט
  choice: und die Rute
  rationale: שֵׁבֶט kann Rute, Stab oder Zepter bedeuten. „Rute“ bewahrt hier am deutlichsten das Bild eines Instruments schlagender beziehungsweise unterdrückender Macht.
- source_word: עֶבְרָתוֹ
  choice: seines Zorns
  rationale: Das Substantiv עֶבְרָה bezeichnet heftigen Zorn oder Grimm. „Zorn“ ist modernes, würdevolles Deutsch und vermeidet eine unbelegte Umdeutung zu Hochmut.
- source_word: יִכְלֶה
  choice: wird ein Ende haben
  rationale: כלה bedeutet hier zu Ende gehen, aufhören oder vergehen. „Wird ein Ende haben“ gibt den Abschluss der zornigen Gewalt eng am Hebräischen und zugleich verständlich wieder.
theological_decisions:
- issue: Bezug und Sinn der Schlussklausel וְשֵׁבֶט עֶבְרָתוֹ יִכְלֶה
  choice: Die zornige beziehungsweise gewaltsame Macht des Unrechttuenden, bildlich als seine „Rute“ bezeichnet, wird ein Ende haben.
  alternative: Die Rute, die seinen Zorn vollstreckt, wird verbraucht beziehungsweise zunichtewerden.
  rationale: Der punktierte hebräische Text lautet wörtlich „die Rute seines Zorns“. Die Übersetzung bewahrt dieses spannungsreiche Bild und behauptet nicht genauer, ob die Rute für seine Macht, sein Gewaltmittel oder die Ausübung seines Zorns steht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, sprichwortartiger Satzform. Die Metaphern von Saat und Ernte sowie von der Rute bleiben erhalten; die ungewohnte Genitivverbindung „Rute seines Zorns“ wird wegen ihrer inhaltlichen Offenheit nicht paraphrasierend aufgelöst.
