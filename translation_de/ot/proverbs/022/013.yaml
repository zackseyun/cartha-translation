translation:
  language: de
  text: 'Der Faule sagt: »Draußen ist ein Löwe! Mitten auf den Straßen[a] werde ich getötet[b]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf den Plätzen«. Das hebräische Wort kann breite Straßen oder öffentliche Plätze bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »werde ich ermordet« oder »werde ich erschlagen«. Das hebräische Verb bezeichnet gewaltsames Töten; »getötet« gibt es im Kontext allgemein und natürlich wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצֵל
  choice: der Faule
  rationale: Das substantivierte Adjektiv bezeichnet in den Sprüchen einen Menschen, dessen Verhalten von Faulheit geprägt ist. »Der Faule« ist im Deutschen eine natürliche sprichwörtliche Typenbezeichnung.
- source_word: אֲרִי
  choice: Löwe
  rationale: Die unmittelbare lexikalische Bedeutung ist »Löwe«; im Kontext dient er als vorgeschobene oder übertriebene Gefahr.
- source_word: בַחוּץ
  choice: draußen
  rationale: Das Wort bezeichnet den Bereich außerhalb des Hauses. »Draußen« gibt den knappen Ausruf natürlich wieder.
- source_word: בְּתוֹךְ רְחֹבוֹת
  choice: mitten auf den Straßen
  rationale: בְּתוֹךְ bedeutet »inmitten/mitten in«, während רְחֹבוֹת breite öffentliche Straßen oder Plätze bezeichnen kann. Die Formulierung bewahrt die räumliche Eindringlichkeit und bleibt im Deutschen idiomatisch.
- source_word: אֵרָצֵחַ
  choice: werde ich ermordet
  rationale: Der Niphal des Verbs רצח bezeichnet hier gewaltsames Getötetwerden. »Ermordet« erhält die stärkere lexikalische Färbung gegenüber dem allgemeineren »getötet«.
- source_word: אָמַר עָצֵל
  choice: Der Faule sagt
  rationale: Obwohl im Hebräischen kein Artikel steht, bezeichnet die sprichwörtliche Aussage einen repräsentativen Typus; der bestimmte Artikel ist dafür im Deutschen natürlich.
theological_decisions: []
translation_notes:
  register: Moderne, knappe und sprichwörtlich zugespitzte Standardsprache. Die beiden Ausrufe spiegeln die dramatisierende Ausrede des Faulen. Der Fußnotenmarker steht unmittelbar nach dem gesamten Zitat, da er Alternativen zu zwei Ausdrücken im zweiten Ausruf erläutert.
