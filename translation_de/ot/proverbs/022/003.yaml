source:
  edition: WLC
  text: עָר֤וּם רָאָ֣ה רָעָ֣ה ו/יסתר וּ֝/פְתָיִ֗ים עָבְר֥וּ וְֽ/נֶעֱנָֽשׁוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/003.yaml
  text: A prudent man sees danger and hides himself[b][a], but the simple pass on and suffer for it.
translation:
  language: de
  text: Ein Umsichtiger sieht die Gefahr[a] und bringt sich in Sicherheit; die Unerfahrenen aber gehen weiter und büßen dafür.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „das Unheil“, „das Böse“ oder „das drohende Unglück“. Das hebräische Wort kann sowohl moralisch Böses als auch schädliches Unheil bezeichnen; hier steht eine erkannte Bedrohung im Vordergrund.
    reason: lexical_alternative
  - marker: b
    text: Oder „werden bestraft“ beziehungsweise „tragen die Folgen“. Das hebräische Verb kann eine Strafe, aber auch das Erleiden der Folgen des eigenen Weges bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּם
  choice: ein Umsichtiger
  rationale: Das Wort bezeichnet im Sprüchebuch meist einen Menschen, der Gefahren vorausschauend und klug einschätzt. „Umsichtiger“ gibt diesen positiven Weisheitssinn wieder, ohne die mögliche negative Färbung von „listig“ in den Vordergrund zu stellen.
- source_word: רָאָה
  choice: sieht
  rationale: Die Vergangenheitsform dient hier einer allgemeinen sprichwörtlichen Aussage; im Deutschen ist dafür das Präsens natürlich. Das konkrete Bild des Sehens bleibt erhalten.
- source_word: רָעָה
  choice: Gefahr
  rationale: Das Substantiv kann moralisch Böses oder erfahrbares Unheil bezeichnen. Im Zusammenhang ist eine drohende schädliche Lage gemeint, die der Umsichtige erkennt; „Gefahr“ macht diesen praktischen Sinn verständlich, während die weitere Bedeutungsbreite in der Fußnote erhalten bleibt.
- source_word: ו/יסתר
  choice: bringt sich in Sicherheit
  rationale: Die Verbform beschreibt ein schützendes Sich-Verbergen beziehungsweise Zurückziehen. Die Wendung ist im modernen Deutschen natürlicher als „verbirgt sich“ und bewahrt den Gedanken der rechtzeitigen Schutzsuche.
- source_word: פְתָיִם
  choice: die Unerfahrenen
  rationale: Der Weisheitsbegriff bezeichnet leicht beeinflussbare, noch nicht urteilsfähige Menschen. „Unerfahrene“ ist heute verständlich und vermeidet die missverständliche Gleichsetzung mit geringer Intelligenz, die „Einfältige“ nahelegen kann.
- source_word: עָבְרוּ
  choice: gehen weiter
  rationale: Das Verb schildert, dass sie ihren Weg ohne Ausweich- oder Schutzmaßnahme fortsetzen. „Gehen weiter“ gibt die Bewegung und den Gegensatz zur Vorsicht knapp wieder.
- source_word: וְנֶעֱנָשׁוּ
  choice: müssen dafür büßen
  rationale: Die Form kann Bestrafung oder das Erleiden nachteiliger Folgen ausdrücken. „Dafür büßen“ lässt sowohl eine Strafe als auch die Folgen des unbesonnenen Handelns anklingen, ohne den Zusammenhang vorschnell festzulegen.
theological_decisions:
- issue: Ob וְנֶעֱנָשׁוּ eine ausdrücklich verhängte Strafe oder allgemein erlittene Folgen bezeichnet
  choice: müssen dafür büßen
  alternative: werden bestraft / tragen die Folgen
  rationale: Die deutsche Formulierung hält die im hebräischen Ausdruck vorhandene Spannung zwischen Strafcharakter und folgerichtiger Schädigung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Struktur. „Ein Umsichtiger“ und „die Unerfahrenen“ bilden den weisheitlichen Gegensatz ab; das generische Maskulinum des hebräischen Singulars wird nicht unnötig auf einen ausdrücklich männlichen Menschen verengt.
