  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die beiden parallelen Warnungen sowie die männlichen Einzelfiguren des hebräischen Sprichworts bleiben erkennbar; die deutschen Verben geben den im Kontext gemeinten sozialen Umgang idiomatisch wieder.
