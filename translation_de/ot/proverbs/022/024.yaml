  text: אַל תִּ֭תְרַע אֶת בַּ֣עַל אָ֑ף וְ/אֶת אִ֥ישׁ חֵ֝מוֹת לֹ֣א תָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/024.yaml
  text: Do not befriend a man given to anger[b][a], and do not go with a man of wrath.
translation:
  language: de
  text: Freunde dich nicht mit einem zornigen Mann an,[a] und verkehre nicht mit einem Mann voller Wut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schließe dich keinem zornigen Mann an.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Komm nicht mit einem Mann voller Wut“; gemeint ist, mit ihm Umgang zu haben oder sich in seine Gesellschaft zu begeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְרַע
  choice: freunde dich … an
  rationale: Die Hitpael-Form bezeichnet hier ein enges Sichzugesellen beziehungsweise das Anknüpfen einer Freundschaft. „Sich anfreunden“ gibt die relationale Aussage im Deutschen natürlich wieder.
- source_word: בַּעַל אָף
  choice: ein zorniger Mann
  rationale: בַּעַל mit einem Abstraktum bezeichnet einen Menschen, der von der genannten Eigenschaft geprägt ist. אָף bedeutet wörtlich „Nase“, idiomatisch jedoch „Zorn“.
- source_word: אִישׁ חֵמוֹת
  choice: ein Mann voller Wut
  rationale: Die Wendung beschreibt einen Mann, der von heftiger Wut beziehungsweise Zornesausbrüchen geprägt ist. Die Wiedergabe erhält die nachdrückliche Charakterisierung und zugleich den Parallelismus.
- source_word: תָבֽוֹא
  choice: verkehre
  rationale: בוא bedeutet grundsätzlich „kommen/eintreten“, bezeichnet in dieser Verbindung und parallel zu תִּתְרַע jedoch das Eintreten in die Gesellschaft eines Menschen beziehungsweise den Umgang mit ihm.
- source_word: אַל ... לֹא
  choice: nicht … und … nicht
  rationale: Die beiden parallelen Verneinungen werden ausdrücklich wiedergegeben, damit Aufbau und warnender Nachdruck des hebräischen Verses erhalten bleiben.
- source_word: אִישׁ
  choice: Mann
  rationale: Das maskuline Singularwort wird als sprichwörtlich repräsentative Einzelperson wiedergegeben, ohne es geschlechtsneutral umzuformen.
