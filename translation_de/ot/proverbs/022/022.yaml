  text: Do not rob the poor because he is poor[b][a], and do not crush the afflicted at the gate.
translation:
  language: de
  text: Beraube den Armen nicht, weil er arm ist,[a] und unterdrücke den Elenden nicht am Stadttor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Unterdrücke den Armen nicht …“ Das zugrunde liegende Verb bezeichnet gewaltsame oder unrechtmäßige Wegnahme; im Zusammenhang kann damit auch Ausbeutung gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Stadttor war ein Ort, an dem Rechtsfälle verhandelt und öffentliche Urteile gefällt wurden; sinngemäß also: vor Gericht.'
    reason: cultural_note
lexical_decisions:
- source_word: תִּגְזָל
  choice: beraube
  rationale: גזל bezeichnet häufig gewaltsame oder unrechtmäßige Wegnahme. „Berauben“ gibt dies im Deutschen prägnant wieder und passt zum Ausnutzen eines Schutzlosen.
- source_word: דָּל
  choice: den Armen
  rationale: דָּל kann einen sozial oder wirtschaftlich Niedriggestellten, Armen oder Schwachen bezeichnen. „Den Armen“ ist hier natürlich und bewahrt die Wiederholung im folgenden Begründungssatz.
- source_word: כִּי דַל הוּא
  choice: weil er arm ist
  rationale: כִּי ist hier kausal. Die Formulierung bewahrt sowohl den Gedanken, dass gerade die Armut zum Anlass des Unrechts genommen wird, als auch die rhetorische Wiederholung von דָּל.
- source_word: תְּדַכֵּא
  choice: zerschmettere
  rationale: דכא im Piel vermittelt ein starkes Bild des Zermalmens oder Niederdrückens. „Zerschmettern“ wahrt die Bildkraft und moralische Schärfe des Hebräischen.
- source_word: עָנִי
  choice: den Elenden
  rationale: עָנִי überschneidet sich mit „arm“, betont aber auch Bedrängnis, Leid und Schutzlosigkeit. „Den Elenden“ unterscheidet den Ausdruck von דָּל, ohne den sozialen Zusammenhang aufzugeben.
- source_word: בַשָּׁעַר
  choice: am Tor
  rationale: Die Wendung bezeichnet wörtlich das Tor, besonders das Stadttor als Ort öffentlicher Rechtsprechung. Die kulturell-rechtliche Bedeutung wird in einer Fußnote erläutert.
theological_decisions:
- issue: Verhältnis von Armut und Unrecht in כִּי דַל הוּא
  choice: „weil er arm ist“ als kausale Aussage beibehalten
  alternative: „nur weil er arm ist“ oder eine Deutung als allgemeines Verbot der Unterdrückung
  rationale: Der hebräische Wortlaut lässt die zugespitzte Aussage stehen, dass die Armut selbst zum Anlass des Raubes wird. Ein ergänztes „nur“ wäre erklärend, aber nicht ausdrücklich vorhanden.
- issue: Gerichtlicher Sinn von בַשָּׁעַר
  choice: das konkrete Bild „am Tor“ im Haupttext bewahren
  alternative: „vor Gericht“
  rationale: „Vor Gericht“ erschließt den wahrscheinlichen institutionellen Sinn, beseitigt aber das kulturelle Bild des Stadttors. Die Fußnote hält beide Ebenen zusammen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der direkten Mahnform des Weisheitsspruchs. „Berauben“ und „zerschmettern“ erhalten die starke Bildsprache; „am Tor“ wahrt den historischen Ausdruck und wird durch die Fußnote verständlich gemacht.
