  text: כִּֽי נָ֭עִים כִּֽי תִשְׁמְרֵ֣/ם בְּ/בִטְנֶ֑/ךָ יִכֹּ֥נוּ יַ֝חְדָּ֗ו עַל שְׂפָתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/018.yaml
  text: For it is pleasant if you keep them within you[b][a], if they are established together on your lips.
translation:
  language: de
  text: Denn es ist angenehm, wenn du sie in deinem Inneren[a] bewahrst; sie werden zusammen auf deinen Lippen bereitstehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in deinem Bauch“; im Hebräischen ist damit der innere Mensch gemeint.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „sie werden zusammen auf deinen Lippen fest verankert sein“. Das Verb kann sowohl die feste Verankerung als auch die Bereitschaft zum Aussprechen betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Das erste כִּי begründet die vorausgehende Aufforderung und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: נָעִים
  choice: angenehm
  rationale: Das Adjektiv bezeichnet etwas Angenehmes oder Wohltuendes; „angenehm“ wahrt den schlichten Ton der Weisheitsliteratur.
- source_word: כִּי
  choice: wenn
  rationale: Das zweite כִּי leitet hier den Umstand beziehungsweise die Bedingung ein, unter der die Aussage gilt.
- source_word: תִשְׁמְרֵם
  choice: du sie … bewahrst
  rationale: שׁמר kann „bewahren“, „hüten“ oder „behalten“ bedeuten. „Bewahren“ umfasst hier das innere Festhalten der Weisheitsworte.
- source_word: בְּבִטְנֶךָ
  choice: in deinem Inneren
  rationale: Wörtlich steht „in deinem Bauch“; gemeint ist im hebräischen Sprachgebrauch der innere Mensch. „In deinem Inneren“ gibt dies verständlich wieder, ohne vorschnell mit „Herz“ zu deuten.
- source_word: יִכֹּנוּ
  choice: bereitstehen
  rationale: Die Nifalform von כון kann festes Gegründetsein oder Bereitschaft ausdrücken. Im Zusammenhang mit den Lippen bezeichnet „bereitstehen“ Worte, die sicher verfügbar und aussprechbar sind.
- source_word: יַחְדָּו
  choice: zusammen
  rationale: Das Adverb bezeichnet die Worte in ihrer Gesamtheit beziehungsweise gemeinsam.
- source_word: עַל שְׂפָתֶיךָ
  choice: auf deinen Lippen
  rationale: Die wörtliche Wendung ist auch im Deutschen verständlich und bezeichnet Worte, die zum Aussprechen bereit sind.
theological_decisions:
- issue: Bedeutung von יִכֹּנוּ im Zusammenhang mit den Lippen
  choice: bereitstehen
  alternative: fest gegründet sein
  rationale: Der Kontext legt die Verfügbarkeit zum Sprechen nahe, doch der Grundsinn des Verbs kann ebenso die feste Verankerung betonen. Die Fußnote hält beide Aspekte offen.
- issue: Syntaktisches Verhältnis der beiden Verbalsätze
  choice: Beide Aussagen werden mit „und“ in den von „wenn“ eröffneten Zusammenhang einbezogen.
  alternative: 'Nach „bewahrst“ könnte ein Semikolon stehen und יִכֹּנוּ als selbstständige Folgerung wiedergegeben werden: „sie werden … bereitstehen“.'
  rationale: Die asyndetische hebräische Folge lässt sowohl eine eng koordinierte Bedingung als auch eine anschließende Folgerung zu. Die gewählte Fassung ist im Deutschen natürlich und entspricht der naheliegenden inhaltlichen Parallelität, ohne die alternative Satzgliederung dogmatisch auszuschließen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit ruhigem, würdigem Weisheitston. Die körperbezogene hebräische Redewendung wird im Haupttext idiomatisch wiedergegeben und in der Fußnote erläutert.
