id: PRO.22.23
reference: Proverbs 22:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי יְ֭הוָה יָרִ֣יב רִיבָ֑/ם וְ/קָבַ֖ע אֶת קֹבְעֵי/הֶ֣ם נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/023.yaml
  text: For Yahweh will plead their case and rob of life those who rob them[a].
translation:
  language: de
  text: Denn Jahwe wird ihre Rechtssache führen und denen, die sie berauben, das Leben rauben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn Jahwe wird für ihre Sache streiten und ihren Plünderern das Leben nehmen.“'
    reason: 'Lexikalische Alternative: ריב kann sowohl einen Rechtsstreit als auch allgemeiner ein Streiten für eine Sache bezeichnen; קבע kann mit „berauben“, „plündern“ oder „wegnehmen“ wiedergegeben werden.'
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Warnung und klingt im deutschen Spruchstil natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יָרִיב רִיבָם
  choice: wird ihre Rechtssache führen
  rationale: Verb und verwandtes Substantiv entwerfen ein rechtliches Bild. „Rechtssache führen“ bewahrt diesen forensischen Sinn, ohne festzulegen, ob Jahwe als Anwalt oder als streitende Partei gedacht ist.
- source_word: וְקָבַע ... קֹבְעֵיהֶם
  choice: und denen, die sie berauben, ... rauben
  rationale: Die Wiederholung von „rauben“ bildet die Wiederholung derselben hebräischen Wurzel קבע ab und macht die vergeltende Entsprechung hörbar.
- source_word: נָפֶשׁ
  choice: das Leben
  rationale: נֶפֶשׁ bezeichnet hier das Leben, das den Räubern genommen wird, nicht ausdrücklich eine vom Körper getrennte Seele.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname bleibt im Text sichtbar, statt durch den traditionellen Ersatztitel wiedergegeben zu werden.
- issue: Art des göttlichen Eingreifens
  choice: ihre Rechtssache führen
  alternative: für ihre Sache streiten
  rationale: Die gewählte Fassung erhält die rechtliche Bedeutung von ריב, während die Fußnote auf den weiteren Sinn des Streitens oder Eintretens hinweist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „das Leben rauben“ ist idiomatisch und bewahrt zugleich das hebräische Wortspiel zwischen dem Handeln der Bedrücker und Jahwes vergeltendem Handeln.
