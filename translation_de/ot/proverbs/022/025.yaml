  text: lest you learn his ways and take a snare for yourself[a][b].
translation:
  language: de
  text: damit du dich nicht an seine Art gewöhnst und dir selbst eine Falle stellst[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an seinen Weg“ beziehungsweise „an seine Lebensweise“. Das hebräische Wort steht im Singular und kann das gewohnte Verhalten eines Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und eine Falle für dein Leben/deine Seele nimmst“. Das hebräische Wort für „Leben/Seele“ meint hier wahrscheinlich die Person selbst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: damit … nicht
  rationale: Die Konjunktion leitet hier die befürchtete negative Folge der im vorigen Vers gewarnten Verbindung ein. „Damit … nicht“ gibt den warnenden Zusammenhang im Deutschen natürlich wieder.
- source_word: תֶּאֱלַף
  choice: du dich … gewöhnst
  rationale: Das Qal von אלף kann „lernen“ oder „sich an etwas gewöhnen“ bedeuten. In Verbindung mit der Art eines Menschen bezeichnet es plausibel die durch Umgang entstehende Gewöhnung; „lernen“ wäre hier im Deutschen weniger idiomatisch.
- source_word: ארחת/ו (אָרְחֹתוֹ)
  choice: seine Art
  rationale: Das singularische Bildwort bezeichnet den Weg beziehungsweise die gewohnte Lebens- und Verhaltensweise eines Menschen. „Seine Art“ ist natürliches Deutsch und bewahrt den Bezug auf sein charakteristisches Verhalten.
- source_word: וְלָקַחְתָּ
  choice: und … zuziehst
  rationale: Wörtlich bedeutet das Verb „nehmen“. Mit „eine Falle“ und reflexivem Bezug drückt „sich etwas zuziehen“ im Deutschen natürlich aus, dass man die gefährliche Folge auf sich nimmt, ohne die Metapher aufzulösen.
- source_word: מוֹקֵשׁ
  choice: eine Falle
  rationale: מוֹקֵשׁ bezeichnet eine Falle oder Schlinge und wird in der Weisheitsliteratur häufig bildlich für eine verderbliche Gefahr gebraucht. „Falle“ ist gegenwärtig, verständlich und bildhaft.
- source_word: לְנַפְשֶׁךָ
  choice: dir selbst
  rationale: נֶפֶשׁ kann je nach Zusammenhang „Leben“, „Person“, „Selbst“ oder „Seele“ bedeuten. Hier bezeichnet die Wendung wahrscheinlich den Betroffenen selbst; „dir selbst“ gibt diesen reflexiven Sinn natürlich wieder.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ
  choice: 'als Bezeichnung der ganzen Person: „dir selbst“'
  alternative: „für dein Leben“ oder „für deine Seele“
  rationale: Der Kontext warnt vor persönlicher Selbstgefährdung und macht keine technische Aussage über die Beschaffenheit der Seele. Die Alternativen werden dennoch in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchton. Der Satz bleibt als abhängige Warnfolge an Vers 24 angeschlossen. Die idiomatische Formulierung „sich an seine Art gewöhnen“ gibt den Bedeutungsumfang von אלף wieder; „eine Falle zuziehen“ bewahrt das hebräische Gefahrenbild.
