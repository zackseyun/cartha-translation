base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/029.yaml
  text: Do you see a man skillful in his work? He will stand before kings[b][a]; he will not stand before obscure men.
translation:
  language: de
  text: Siehst du einen Mann, der in seiner Arbeit geschickt[a] ist? Er wird vor Königen stehen; vor unbedeutenden Leuten[b] wird er nicht stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zügig“ beziehungsweise „tatkräftig“. Das hebräische Adjektiv kann Schnelligkeit und Bereitschaft, im Zusammenhang mit Arbeit aber auch Können und Gewandtheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet hier Menschen ohne Bekanntheit, Ansehen oder besondere Stellung.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזִיתָ
  choice: Siehst du
  rationale: Das Qal Perfekt 2. Person maskulin Singular leitet rhetorisch eine Beobachtung ein. Das deutsche Präsens gibt diese sprichwörtliche Frage natürlich wieder.
- source_word: אִישׁ
  choice: einen Mann
  rationale: Das Hebräische bezeichnet ausdrücklich einen einzelnen Mann; die repräsentative maskuline Einzahl bleibt erhalten.
- source_word: מָהִיר
  choice: geschickt
  rationale: Das Adjektiv kann Schnelligkeit oder Bereitschaft bezeichnen, meint bei der Arbeit jedoch wahrscheinlich Befähigung und Gewandtheit. „Geschickt“ wahrt diesen lobenden Sinn, ohne den Ausdruck auf bloßes Arbeitstempo zu verengen.
- source_word: בִּמְלַאכְתּוֹ
  choice: seine Arbeit … verrichtet
  rationale: מְלָאכָה umfasst Arbeit, Tätigkeit, Beruf oder Handwerk. Die Formulierung ist im Deutschen natürlich und bleibt hinsichtlich der Art der Arbeit offen.
- source_word: לִפְנֵי מְלָכִים
  choice: vor Königen
  rationale: Die Wendung bezeichnet das Auftreten beziehungsweise den Dienst in der Gegenwart von Herrschern und bewahrt zugleich das hebräische Bild.
- source_word: יִתְיַצָּב
  choice: wird … stehen
  rationale: Der Hitpael von יצב bedeutet, seinen Platz einzunehmen oder sich hinzustellen. „Stehen“ bewahrt Bild und Parallelismus.
- source_word: בַּל
  choice: nicht
  rationale: Die poetische Negationspartikel wird zusammen mit der deutschen Futurform als „wird … nicht stehen“ wiedergegeben.
- source_word: לִפְנֵי חֲשֻׁכִּים
  choice: vor unbedeutenden Leuten
  rationale: חֲשֻׁכִּים bedeutet wörtlich etwa „Dunkle/Obskure“ und bezeichnet hier Menschen ohne gesellschaftliches Ansehen. „Unbedeutende Leute“ vermittelt den sozialen Kontrast, ohne moralische Finsternis oder Armut hineinzulesen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem sprichwörtlichem Ton. Die Wiederholung von „stehen“ erhält den hebräischen Parallelismus; „Leute“ vermeidet im zweiten Halbvers eine unnatürliche Formulierung, ohne den gesellschaftlichen Gegensatz abzuschwächen.
