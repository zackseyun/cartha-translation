id: PRO.22.1
reference: Proverbs 22:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נִבְחָ֣ר שֵׁ֭ם מֵ/עֹ֣שֶׁר רָ֑ב מִ/כֶּ֥סֶף וּ֝/מִ/זָּהָ֗ב חֵ֣ן טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/001.yaml
  text: A name is to be chosen rather than great wealth[c][b][a], and favor is better than silver and gold.
translation:
  language: de
  text: Ein Name ist großem Reichtum vorzuziehen[a]; Gunst ist besser als Silber und Gold.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Name“ meint hier auch den Ruf oder das Ansehen eines Menschen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Anmut“ oder „Wohlwollen“. Das hebräische Wort kann gewinnende Anmut oder günstige Zuwendung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְחָר
  choice: ist eher zu wählen
  rationale: Das Nifal-Partizip von בחר steht prädikativ und drückt hier im Zusammenspiel mit dem vergleichenden מ eine vorzuziehende Wahl aus. „Ist eher zu wählen“ bewahrt diese sprichwörtliche Wertung.
- source_word: שֵׁם
  choice: Name
  rationale: Wörtlich „Name“; gemeint ist im Weisheitskontext zugleich der öffentliche Ruf. Die Wiedergabe „Name“ erhält das hebräische Bild, ohne die Bedeutung vorschnell einzuengen.
- source_word: מֵעֹשֶׁר רָב
  choice: als großer Reichtum
  rationale: Das מ markiert den Vergleich, עֹשֶׁר רָב bezeichnet großen beziehungsweise reichen Besitz. „Großer Reichtum“ ist natürlich und inhaltlich genau.
- source_word: חֵן
  choice: Ansehen
  rationale: חֵן kann Gunst, Wohlwollen, Anmut oder gewinnende Wirkung bezeichnen. Parallel zu „Name“ bezeichnet es hier wahrscheinlich die günstige Einschätzung durch andere; „Ansehen“ gibt diesen sozialen Bezug idiomatisch wieder.
- source_word: מִכֶּסֶף וּמִזָּהָב
  choice: als Silber und Gold
  rationale: Die zweite Vergleichsphrase nennt kostbare Güter konkret. „Silber und Gold“ bewahrt Wortlaut und Bild.
- source_word: טוֹב
  choice: ist besser
  rationale: Obwohl טוֹב für sich „gut“ bedeutet, verlangt die elliptische Vergleichskonstruktion im Deutschen den Komparativ „besser“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Parallelstruktur. Der wörtliche Ausdruck „Name“ bleibt erhalten und wird durch eine Fußnote erläutert; die mögliche Bedeutungsbreite von חֵן wird nicht eingeebnet.
