source:
  edition: WLC
  text: צִנִּ֣ים פַּ֭חִים בְּ/דֶ֣רֶךְ עִקֵּ֑שׁ שׁוֹמֵ֥ר נַ֝פְשׁ֗/וֹ יִרְחַ֥ק מֵ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/005.yaml
  text: Thorns and snares are in the way of the crooked[c][b][a]; he who guards his life keeps far from them.
translation:
  language: de
  text: Dornen und Schlingen[a] liegen auf dem Weg eines Verkehrten[b]; wer sein Leben[c] bewahrt, hält sich von ihnen fern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fallen“.'
    reason: lexical_alternative
  - marker: b
    text: „Eines Verkehrten“ kann auch mit „eines Verdreh­ten“ oder „eines Verschlagenen“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „seine Seele“; hier ist wahrscheinlich das eigene Leben beziehungsweise die eigene Person gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנִּים
  choice: Dornen
  rationale: Das Substantiv bezeichnet am ehesten spitze, dornige Hindernisse. „Dornen“ bewahrt das anschauliche Bild einer gefahrvollen Lebensbahn und bildet mit „Schlingen“ ein natürliches Begriffspaar.
- source_word: פַּחִים
  choice: Schlingen
  rationale: Das Wort bezeichnet Fangvorrichtungen, Fallen oder Schlingen. „Schlingen“ erhält den bildhaften Charakter verborgener Gefahren in der Weisheitsliteratur.
- source_word: בְּדֶרֶךְ
  choice: auf dem Weg
  rationale: דֶּרֶךְ kann einen tatsächlichen Weg wie auch den Lebenswandel bezeichnen. Die deutsche Formulierung bewahrt diese bildhafte Doppeldeutigkeit.
- source_word: עִקֵּשׁ
  choice: eines Verkehrten
  rationale: Das Adjektiv beschreibt einen moralisch verdrehten, falschen oder verschlagenen Menschen. „Verkehrt“ bewahrt die räumlich-moralische Bildlichkeit und passt zum „Weg“, ohne eine bestimmte Art von Fehlverhalten festzulegen.
- source_word: שׁוֹמֵר נַפְשׁוֹ
  choice: wer sein Leben bewahrt
  rationale: Die Partizipialkonstruktion formuliert eine allgemeine Weisheitsregel. נֶפֶשׁ bedeutet hier im Zusammenhang der Gefahrenabwehr am ehesten „Leben“ beziehungsweise die eigene Person, während „Seele“ als wörtlichere Möglichkeit in der Fußnote erhalten bleibt.
- source_word: יִרְחַק מֵהֶם
  choice: hält sich von ihnen fern
  rationale: Das Imperfekt beschreibt die typische Haltung oder Folge umsichtigen Handelns. Das pluralische Pronomen verweist am natürlichsten auf Dornen und Schlingen.
theological_decisions:
- issue: Bezug von נַפְשׁוֹ
  choice: sein Leben
  alternative: seine Seele / sich selbst
  rationale: Im Kontext des Sich-Fernhaltens von Gefahren bezeichnet נֶפֶשׁ wahrscheinlich das zu schützende Leben oder Selbst. Die Wiedergabe entscheidet keine anthropologische Unterscheidung zwischen Leib und Seele, sondern wahrt die konkrete Aussage der Selbsterhaltung.
- issue: Generische Personenbezeichnung
  choice: wer sein Leben bewahrt
  alternative: derjenige, der sein Leben bewahrt
  rationale: Das hebräische maskuline Singularpronomen steht in einem allgemeinen Spruch. Das deutsche „wer“ gibt diese allgemeine Geltung natürlich wieder; das Possessivpronomen bleibt entsprechend im generischen Maskulinum.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Die Wegmetapher sowie die Spannung zwischen konkreten Hindernissen und Gefahren des Lebenswandels bleiben erhalten.
