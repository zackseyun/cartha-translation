source:
  edition: WLC
  text: אֹהֵ֥ב טהור לֵ֑ב חֵ֥ן שְׂ֝פָתָ֗י/ו רֵעֵ֥/הוּ מֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/011.yaml
  text: He who loves purity of heart[b][a], and whose speech is gracious—the king is his friend.
translation:
  language: de
  text: Wer Reinheit des Herzens liebt[c] und freundlich redet[a] – der König ist sein Freund.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »dessen Lippen Anmut haben«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ein König ist sein Freund«.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »Wer einen Menschen mit reinem Herzen liebt«.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֵב
  choice: Wer … liebt
  rationale: Das substantivisch gebrauchte Qal-Partizip bezeichnet verallgemeinernd einen Menschen; die deutsche Wer-Konstruktion gibt den sprichwörtlichen Charakter natürlich wieder.
- source_word: טהור לֵב
  choice: Reinheit des Herzens
  rationale: Die Wendung bezeichnet im gewählten Verständnis die innere Lauterkeit. Die alternative syntaktische Deutung als »einen Menschen mit reinem Herzen« wird in Fußnote [c] offengehalten.
- source_word: חֵן שְׂפָתָיו
  choice: freundlich redet
  rationale: Wörtlich ist von der »Anmut« beziehungsweise dem gewinnenden Wesen seiner Lippen die Rede. Die Hauptfassung gibt die metonymische Bedeutung in natürlichem Deutsch wieder, ohne sie auf bloße Höflichkeit zu verengen.
- source_word: רֵעֵהוּ
  choice: sein Freund
  rationale: רֵעַ bezeichnet hier einen Freund oder vertrauten Gefährten; »sein Freund« passt am klarsten zur nominalen Schlussaussage.
- source_word: מֶלֶךְ
  choice: der König
  rationale: Obwohl das hebräische Substantiv keinen Artikel trägt, kann es in der Sentenz den König als typische Herrschergestalt bezeichnen. Die ebenso mögliche Wiedergabe »ein König« steht in Fußnote [b].
theological_decisions:
- issue: Bezug von טהור לֵב
  choice: 'Als abstrakte Eigenschaft: »Reinheit des Herzens«'
  alternative: 'Als Personenbezeichnung: »einen Menschen mit reinem Herzen«'
  rationale: Die knappe hebräische Wortfolge lässt beide syntaktischen Deutungen zu. Die Hauptfassung folgt dem in diesem Zusammenhang verbreiteten Verständnis, während die Fußnote die echte Mehrdeutigkeit bewahrt.
- issue: Bestimmtheit von מֶלֶךְ
  choice: »der König«
  alternative: »ein König«
  rationale: Das artikellose Hebräisch kann in einem Spruch generisch verstanden werden. Im Deutschen ist sowohl die typische Herrschergestalt mit bestimmtem Artikel als auch ein unbestimmter König möglich; daher wird die Alternative ausdrücklich genannt.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Der Gedankenstrich bildet die zugespitzte nominale Schlussaussage des hebräischen Spruchs ab. Alle sachlich relevanten Mehrdeutigkeiten werden in den Fußnoten offengehalten.
