source:
  edition: WLC
  text: אַל תְּהִ֥י בְ/תֹֽקְעֵי כָ֑ף בַּ֝/עֹרְבִ֗ים מַשָּׁאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/026.yaml
  text: Do not be among those who strike hands[a], among those who become surety for debts.
translation:
  language: de
  text: Gehöre nicht zu denen, die in die Hand schlagen[a], zu denen, die für Schulden bürgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: die die Handfläche schlagen. Die Geste bezeichnet hier das Eingehen bzw. Bekräftigen einer Bürgschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Gehöre nicht
  rationale: Die Verbindung aus Verneinungspartikel und Qal-Imperfekt von היה formuliert eine Mahnung. „Gehöre nicht“ gibt die Zugehörigkeit zur folgenden Personengruppe im Deutschen natürlich wieder.
- source_word: בְתֹקְעֵי כָף
  choice: zu denen, die mit Handschlag bürgen
  rationale: Wörtlich bezeichnet die Wendung Menschen, die die Handfläche schlagen; im Zusammenhang ist dies die Geste, mit der eine Bürgschaft bekräftigt wird. Die Wiedergabe wahrt das konkrete Bild und macht dessen Funktion verständlich.
- source_word: בַּעֹרְבִים
  choice: zu denen, die … einstehen
  rationale: Das Partizip von ערב bezeichnet hier Personen, die Bürgschaft oder Sicherheit leisten. „Für … einstehen“ ist gegenwärtiges, verständliches Deutsch und vermeidet das altertümlich wirkende „Bürge werden“.
- source_word: מַשָּׁאוֹת
  choice: Schulden
  rationale: Das Wort bezeichnet hier finanzielle Lasten beziehungsweise Verpflichtungen, für die jemand haftet. „Schulden“ passt klar in den Kontext der Bürgschaft.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erhalten; das antike Rechtsbild des Handschlags wird im Haupttext bewahrt und durch die Fußnote erläutert.
