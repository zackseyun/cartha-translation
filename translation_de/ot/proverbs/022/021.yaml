  text: לְ/הוֹדִֽיעֲ/ךָ֗ קֹ֭שְׁטְ אִמְרֵ֣י אֱמֶ֑ת לְ/הָשִׁ֥יב אֲמָרִ֥ים אֱ֝מֶ֗ת לְ/שֹׁלְחֶֽי/ךָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/021.yaml
  text: to make known to you the certainty of words of truth[b][a], so that you may return words of truth to those who sent you.
translation:
  language: de
  text: um dir die Verlässlichkeit der Worte der Wahrheit[a] erkennen zu lassen, damit du denen, die dich gesandt haben, Worte der Wahrheit zurückgeben kannst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Wahrheit der Worte der Wahrheit. Das hebräische Wort קֹשְׁט kann auch „Wahrheit“, „Richtigkeit“ oder „Zuverlässigkeit“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: damit du denen, die dich gesandt haben, mit wahrheitsgemäßen Worten antworten kannst.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְהוֹדִיעֲךָ
  choice: um dir … erkennen zu lassen
  rationale: Der Hifil-Infinitiv von ידע mit Suffix der 2. Person Singular hat kausative Bedeutung. Die Formulierung bewahrt diese Bedeutung und klingt im Deutschen natürlicher als „um dir bekannt zu machen“.
- source_word: קֹשְׁט
  choice: Verlässlichkeit
  rationale: Das Substantiv bezeichnet Wahrheit, Richtigkeit oder Zuverlässigkeit. „Verlässlichkeit“ hebt die zuverlässige Geltung der Aussagen hervor und wahrt zugleich den lexikalischen Unterschied zu אֱמֶת.
- source_word: אִמְרֵי אֱמֶת
  choice: Worte der Wahrheit
  rationale: Die Genitivverbindung wird formal und verständlich wiedergegeben. Sie kann sowohl wahre als auch wahrheitsgemäße Worte bezeichnen.
- source_word: לְהָשִׁיב
  choice: als Antwort zurückbringen
  rationale: Der Hifil von שוב trägt das Bild des Zurückbringens, kann im Zusammenhang aber auch „antworten“ bedeuten. Die Formulierung verbindet das hebräische Bild mit dem gemeinten Antwortgeschehen.
- source_word: אֲמָרִים אֱמֶת
  choice: Worte der Wahrheit
  rationale: Die Wiedergabe nimmt die eng verwandte Formulierung aus der ersten Vershälfte auf und bewahrt die Wiederholung von אֱמֶת.
- source_word: לְשֹׁלְחֶיךָ
  choice: denen, die dich gesandt haben
  rationale: Das Partizip im Plural mit Suffix bezeichnet die Absender beziehungsweise Auftraggeber. Der Relativsatz ist im modernen Deutschen klar und natürlich.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Standarddeutschstil. Der Vers bleibt als syntaktische Fortsetzung des vorausgehenden Zusammenhangs mit „um“ eröffnet. Die ungewöhnliche Wendung „Worte der Wahrheit als Antwort zurückbringen“ bewahrt das hebräische Rückkehrbild, während die Fußnote die idiomatische Deutung als Antworten nennt.
