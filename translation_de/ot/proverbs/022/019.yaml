  terminology: „Jahwe“ gibt יהוה konsistent als Gottesnamen wieder. „Unterwiesen“ passt im Kontext von Weisheitssprüchen, ohne eine konfessionelle Deutung einzutragen. Die Fußnoten erläutern die Kontextualisierung und die Emphase sachlich.
