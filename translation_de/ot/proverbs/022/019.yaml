base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/019.yaml
  text: So that your trust may be in Yahweh[a], I have made known to you today, even to you.
translation:
  language: de
  text: Damit du auf Jahwe vertraust, habe ich dich heute unterwiesen[a] – ja, dich selbst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »habe ich dich heute wissen/erkennen lassen«. Im Zusammenhang ist die Unterweisung durch die vorangehenden Weisheitssprüche gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auch dich«. Das Hebräische hebt den Angesprochenen durch ein zusätzliches Pronomen ausdrücklich hervor.'
    reason: ambiguity
lexical_decisions:
- source_word: לִהְיוֹת בַּיהוָה מִבְטַחֶךָ
  choice: Damit du auf Jahwe vertraust
  rationale: Der mit ל eingeleitete Infinitiv bezeichnet hier den Zweck. Die nominale Wendung »dein Vertrauen sei auf Jahwe« wird im Deutschen natürlich als verbaler Zwecksatz wiedergegeben; ב bezeichnet den, auf den sich das Vertrauen richtet.
- source_word: הוֹדַעְתִּיךָ
  choice: habe ich dich … unterwiesen
  rationale: Der Hifil von ידע bedeutet »wissen/erkennen lassen, kundtun«. Das Objektsuffix bezeichnet ausdrücklich den Angesprochenen; »unterwiesen« ergibt im Zusammenhang der Lehrsprüche natürliches Deutsch, ohne ein im Hebräischen unausgesprochenes Sachobjekt in den Haupttext einzufügen.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die direkte temporale Entsprechung ist im modernen Deutsch klar und natürlich.
- source_word: אַף אָתָּה
  choice: ja, dich selbst
  rationale: אַף verstärkt zusammen mit dem selbstständigen Pronomen den bereits im Verb bezeichneten Adressaten. Die Wiedergabe bewahrt diese auffällige emphatische Wiederholung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Ziel der Weisheitsunterweisung
  choice: Damit du auf Jahwe vertraust
  alternative: Damit dein Vertrauen auf Jahwe sei
  rationale: Die Aussage lässt das Vertrauen auf Jahwe als Zweck der Unterweisung stehen und fügt keine nähere konfessionelle Deutung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Zwecksatz ist idiomatisch formuliert; die emphatische und im Deutschen ungewöhnliche Wiederholung des Angesprochenen bleibt bewusst erhalten.
