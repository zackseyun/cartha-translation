  source_fidelity: Die Übersetzung gibt den Zwecksatz לִהְיוֹת angemessen mit „Damit“ wieder und überträgt מִבְטַחֶךָ idiomatisch als Verbalsatz „du … vertraust“. „auf Jahwe“ entspricht der durch בְּ bezeichneten Vertrauensbeziehung. הוֹדַעְתִּיךָ wird mit „habe ich dich … unterwiesen“ kontextgemäß wiedergegeben; die Fußnote wahrt den näheren kausativen Grundwert „wissen/erkennen lassen“. Die Zeitangabe „heute“ und die emphatische Wiederaufnahme des Adressaten in אַף אָתָּה sind erhalten.
