  variant: modern standard German
source:
  edition: WLC
  text: עֵינֵ֣י יְ֭הוָה נָ֣צְרוּ דָ֑עַת וַ֝/יְסַלֵּ֗ף דִּבְרֵ֥י בֹגֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/012.yaml
  text: The eyes of Yahweh preserve knowledge[c][b][a], but he overturns the words of the treacherous.
translation:
  language: de
  text: Die Augen Jahwes bewahren Erkenntnis[a], doch er vereitelt die Worte des Treulosen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hüten“ beziehungsweise „schützen“. Das hebräische Verb kann bewahren, hüten oder beschützen bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „stürzt die Worte des Verräters um“ beziehungsweise „macht sie zunichte“. Das hebräische Verb kann ein Verdrehen, Umstürzen oder Vereiteln bezeichnen; בֹגֵד kann auch mit „Verräter“ oder „Untreuer“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי יְהוָה
  choice: Die Augen Jahwes
  rationale: Die wörtliche Wiedergabe bewahrt das anthropomorphe Bild von Gottes wachsamer Gegenwart; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: נָצְרוּ
  choice: bewahren
  rationale: Das Verb bezeichnet ein Hüten, Bewahren oder Beschützen. „Bewahren“ erhält den Gegensatz zum vereitelnden Handeln im zweiten Halbvers.
- source_word: דָעַת
  choice: Erkenntnis
  rationale: Im Kontext der Sprüche bezeichnet דָעַת nicht bloß gespeicherte Information, sondern wahre, einsichtsvolle Erkenntnis; das geläufige Weisheitsvokabular bleibt erhalten.
- source_word: וַיְסַלֵּף
  choice: vereitelt
  rationale: סלף kann „verdrehen“, „umstürzen“ oder „zunichtemachen“ bedeuten. Bei „Worte“ als Objekt drückt „vereitelt“ natürlich aus, dass Jahwe die Aussagen oder Vorhaben des Treulosen unwirksam macht, ohne die Bildrichtung unnötig festzulegen.
- source_word: דִּבְרֵי
  choice: die Worte
  rationale: „Worte“ ist hier die naheliegende Bedeutung und bewahrt den Bezug auf die Äußerungen des Treulosen; die weiter gefasste Bedeutung „Angelegenheiten“ bleibt kontextuell möglich.
- source_word: בֹגֵד
  choice: des Treulosen
  rationale: Das substantivierte Partizip bezeichnet jemanden, der treulos oder verräterisch handelt. Der Singular des Hebräischen bleibt erhalten, ohne den Bereich der Treulosigkeit näher festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Gegenstand des göttlichen Bewahrens
  choice: Erkenntnis
  alternative: Menschen mit Erkenntnis
  rationale: Der grammatische Wortlaut nennt „Erkenntnis“ als Objekt. Eine Deutung auf kundige oder aufrichtige Menschen wird nicht in den Haupttext eingetragen.
- issue: Wirkung auf die Worte des Treulosen
  choice: vereitelt
  alternative: verdreht
  rationale: „Vereitelt“ stellt Jahwes Widerstand gegen treulose Rede heraus, ohne zu suggerieren, Gott verfälsche selbst deren Inhalt. Die lexikalische Möglichkeit einer bildhaften Aussage vom Verdrehen oder Umstürzen wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, parallel gebauter Spruchform. Das konkrete Bild „Die Augen Jahwes“ sowie der Singular „des Treulosen“ bleiben erhalten.
