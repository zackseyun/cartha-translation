id: PRO.22.6
reference: Proverbs 22:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חֲנֹ֣ךְ לַ֭/נַּעַר עַל פִּ֣י דַרְכּ֑/וֹ גַּ֥ם כִּֽי יַ֝זְקִ֗ין לֹֽא יָס֥וּר מִמֶּֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/006.yaml
  text: Train up a boy according to his way[b][a]; even when he grows old he will not turn from it.
translation:
  language: de
  text: Erziehe einen Jungen seinem Weg entsprechend[a][b]; selbst wenn er alt wird, wird er nicht davon abweichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder stärker deutend: „Erziehe einen Jungen auf dem Weg, den er gehen soll.“ Wörtlicher heißt es im Hebräischen: „seinem Weg entsprechend“. Auch eine Erziehung, die seiner Eigenart und Lebensphase entspricht, kann gemeint sein.'
    reason: alternative_reading
  - marker: b
    text: „Junge“ gibt ein maskulines hebräisches Wort im Singular wieder, das hier beispielhaft für einen jungen Menschen steht. Der Spruch formuliert eine allgemeine Lebensregel, keine ausnahmslose Garantie.
    reason: cultural_note
lexical_decisions:
- source_word: חֲנֹךְ
  choice: Erziehe
  rationale: Das Verb חנך kann ein Einführen, Anleiten oder Weihen bezeichnen. Im erzieherischen Zusammenhang dieses Weisheitsspruchs gibt „Erziehe“ den prägenden und anleitenden Sinn natürlich wieder, ohne die Aussage auf eine förmliche Weihe einzuengen.
- source_word: לַנַּעַר
  choice: einen Jungen
  rationale: נַעַר bezeichnet hier im maskulinen Singular einen Jungen beziehungsweise jungen Menschen. „Einen Jungen“ wahrt die konkrete grammatische Form; zugleich erläutert eine Fußnote den allgemeinen Aussagecharakter des Spruchs.
- source_word: עַל־פִּי
  choice: entsprechend
  rationale: Die Wendung עַל־פִּי bedeutet idiomatisch „gemäß“, „entsprechend“ oder „im Einklang mit“. „Seinem Weg entsprechend“ ist im Deutschen verständlich und bleibt nahe an der offenen Formulierung des Hebräischen.
- source_word: דַרְכּוֹ
  choice: seinem Weg
  rationale: Der hebräische Text sagt wörtlich „seinem Weg“. Die Wiedergabe bewahrt die Mehrdeutigkeit, ob der angemessene Weg, ein seiner Eigenart entsprechender Weg oder sein eigener eingeschlagener Weg gemeint ist.
- source_word: גַּם כִּי
  choice: selbst wenn
  rationale: Die Verbindung hat hier einen konzessiv-temporalen Sinn. „Selbst wenn“ bewahrt dabei etwas mehr Offenheit zwischen zeitlichem „auch wenn/auch im Alter“ und konzessivem „selbst wenn“.
- source_word: יַזְקִין
  choice: er alt wird
  rationale: Die Form von זקן bezeichnet das Erreichen hohen Alters. „Alt wird“ ist natürliches modernes Deutsch und gibt den Vorgang wieder.
- source_word: לֹא יָסוּר
  choice: wird er nicht abweichen
  rationale: סור bedeutet abweichen, sich abwenden oder verlassen. „Nicht davon abweichen“ ist idiomatisch und lässt den Rückbezug auf den zuvor genannten Weg erkennen.
- source_word: מִמֶּנָּה
  choice: davon
  rationale: Das feminine Suffix bezieht sich grammatisch auf דֶּרֶךְ. Im Deutschen stellt „davon“ den sachlichen Rückbezug auf „Weg“ natürlich her.
theological_decisions:
- issue: Deutung der umstrittenen Wendung „seinem Weg entsprechend“
  choice: Die offene, quelltextnahe Formulierung „seinem Weg entsprechend“ bleibt im Haupttext erhalten.
  alternative: „auf dem Weg, den er gehen soll“ oder „seiner Eigenart entsprechend“
  rationale: Das Hebräische bestimmt nicht ausdrücklich, ob der sittlich richtige Weg, ein dem jungen Menschen angemessener Weg oder sein eigener Weg gemeint ist. Eine eindeutige Auslegung im Haupttext würde die echte Mehrdeutigkeit beseitigen.
- issue: Geltungsweise des Weisheitsspruchs
  choice: Der Satz wird als allgemeiner Weisheitsspruch wiedergegeben.
  alternative: Eine ausnahmslose Zusage für jeden einzelnen Erziehungsfall
  rationale: Die sprichwörtliche Form beschreibt eine allgemeine Lebensregel. Der Wortlaut selbst enthält keine ausdrückliche Qualifikation, doch eine Fußnote verhindert, dass die Gattung fälschlich als ausnahmslose Garantie verstanden wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Satzstruktur. Die ungewöhnliche, aber verständliche Wendung „seinem Weg entsprechend“ wurde bewusst beibehalten, um die Mehrdeutigkeit des Ausgangstextes nicht stillschweigend aufzulösen.
