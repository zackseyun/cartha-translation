  text: עָ֭שִׁיר בְּ/רָשִׁ֣ים יִמְשׁ֑וֹל וְ/עֶ֥בֶד לֹ֝וֶ֗ה לְ/אִ֣ישׁ מַלְוֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/007.yaml
  text: The rich rules over the poor[a], and the borrower is a servant to the lender.
translation:
  language: de
  text: Der Reiche herrscht über die Armen, und wer sich etwas leiht, ist dem, der ihm leiht, ein Sklave.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשִׁיר
  choice: der Reiche
  rationale: Das substantivierte Adjektiv bezeichnet allgemein einen reichen Menschen beziehungsweise den sozial Reichen im Gegensatz zu den Armen.
- source_word: בְּרָשִׁים
  choice: über die Armen
  rationale: Bei מָשַׁל bezeichnet בְּ den Bereich beziehungsweise die Menschen, über die Herrschaft ausgeübt wird; im Deutschen ist „über … herrschen“ idiomatisch.
- source_word: יִמְשׁוֹל
  choice: herrscht
  rationale: Das Imperfekt formuliert hier eine allgemeine Beobachtung in sprichwörtlicher Gegenwart, nicht notwendig eine Aussage über die Zukunft.
- source_word: וְעֶבֶד
  choice: wird zum Sklaven
  rationale: עֶבֶד kann „Sklave“ oder „Diener“ bedeuten. „Sklave“ bewahrt die Schärfe des Bildes wirtschaftlicher Abhängigkeit; „wird“ gibt im Deutschen die durch das Leihen entstehende Abhängigkeit natürlich wieder, obwohl im Hebräischen keine Kopula steht.
- source_word: לֹוֶה
  choice: wer sich etwas leiht
  rationale: Das substantivisch gebrauchte Qal-Partizip bezeichnet den Leihenden. Die Umschreibung ist in modernem Deutsch natürlicher als „der Borger“ und bleibt näher am Vorgang als „der Schuldner“.
- source_word: לְאִישׁ מַלְוֶה
  choice: dessen, der ihm leiht
  rationale: Wörtlich steht „einem Mann, der leiht“. Die deutsche Formulierung erhält die direkte Wortbeziehung zwischen Leihendem und Verleihendem und vermeidet den stärker fachsprachlichen Ausdruck „Kreditgeber“.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Gegenwartssprache mit sprichwörtlichem Charakter. Der harte soziale Gegensatz und das starke Bild des Sklavendaseins bleiben erhalten; die Aussage wird weder als Gebot noch als ausnahmslose moralische Billigung der Verhältnisse umgedeutet.
