  text: גָּ֣רֵֽשׁ לֵ֭ץ וְ/יֵצֵ֣א מָד֑וֹן וְ֝/יִשְׁבֹּ֗ת דִּ֣ין וְ/קָלֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/010.yaml
  text: Drive out a scoffer[a], and strife will go out[b]; judgment and disgrace will cease.
translation:
  language: de
  text: Vertreibe den Spötter[a], dann zieht die Zwietracht aus; Streit[b] und Schande hören auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Verächter“. Das hebräische Wort bezeichnet in den Sprüchen einen Menschen, der Weisheit und Zurechtweisung hochmütig verspottet.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Rechtssache“, „Rechtsstreit“ oder „Gericht“ bedeuten. Hier steht es parallel zu „Zwietracht“ und bezeichnet wahrscheinlich eine Auseinandersetzung.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: Vertreibe
  rationale: Der maskuline Singularimperativ von גרש bezeichnet ein entschiedenes Fortjagen oder Ausstoßen. „Vertreibe“ bewahrt diese Kraft und klingt im Deutschen natürlich.
- source_word: לֵץ
  choice: den Spötter
  rationale: לץ ist in der Weisheitsliteratur ein feststehender Ausdruck für einen Menschen, der Weisheit und Zurechtweisung hochmütig verspottet. „Spötter“ gibt dies knapp und idiomatisch wieder.
- source_word: מָדוֹן
  choice: Zwietracht
  rationale: מדון bezeichnet Streit, Hader oder Zwietracht. „Zwietracht“ unterscheidet den Ausdruck im Deutschen von dem folgenden דִּין und bezeichnet treffend den durch den Spötter verursachten Unfrieden.
- source_word: וְיֵצֵא
  choice: dann zieht … aus
  rationale: Das Imperfekt beschreibt hier die erwartete Folge des Imperativs. „Zieht … aus“ bewahrt zugleich das räumliche Bild des hebräischen יצא und bildet einen anschaulichen Gegenpart zu „Vertreibe“.
- source_word: דִּין
  choice: Streit
  rationale: דִּין kann Gericht, Rechtssache oder Auseinandersetzung bedeuten. Im Parallelismus mit מדון ist hier wahrscheinlich der konkrete Streitfall oder das Streiten gemeint; „Streit“ lässt diesen Konfliktsinn erkennen, ohne einen förmlichen Rechtsfall auszuschließen.
- source_word: קָלוֹן
  choice: Schande
  rationale: קלון bezeichnet Schande, Unehre oder öffentliche Beschämung. „Schande“ ist prägnant und bewahrt das soziale Gewicht des Ausdrucks.
- source_word: וְיִשְׁבֹּת
  choice: hören auf
  rationale: שבת bedeutet aufhören oder ein Ende nehmen. Die idiomatische deutsche Wendung gibt das erwartete Ergebnis klar wieder.
