  text: אַל תַּ֭סֵּג גְּב֣וּל עוֹלָ֑ם אֲשֶׁ֖ר עָשׂ֣וּ אֲבוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/028.yaml
  text: Do not move an ancient boundary marker that your fathers made[a][b].
translation:
  language: de
  text: Verrücke nicht die alte Grenze, die deine Väter festgelegt haben.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verschiebe nicht die alte Grenzmarke, die deine Väter aufgestellt haben.“'
    reason: lexical_alternative
  - marker: b
    text: „Deine Väter“ kann hier in weiterem Sinn deine Vorfahren bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: nicht
  rationale: אַל mit der Präfixkonjugation formuliert ein Verbot; im Deutschen wird dies natürlich mit dem verneinten Imperativ „Verrücke nicht“ wiedergegeben.
- source_word: תַּסֵּג
  choice: Verrücke
  rationale: נסג bezeichnet hier das unrechtmäßige Verschieben einer bestehenden Grenze. „Verrücken“ bewahrt diesen konkreten Sinn und lässt anders als „entfernen“ offen, ob die Grenzmarkierung ganz beseitigt wird.
- source_word: גְּבוּל
  choice: Grenze
  rationale: גְּבוּל bezeichnet eine Grenze oder Grenzlinie und kann in diesem Zusammenhang die sie kennzeichnende Grenzmarke einschließen. „Grenze“ bleibt formnah und ist mit „verrücken“ im Deutschen verständlich.
- source_word: עוֹלָם
  choice: uralt
  rationale: עוֹלָם meint hier nicht metaphysische Ewigkeit, sondern eine seit alter Zeit bestehende Grenze. „Uralt“ gibt dies knapp und idiomatisch wieder.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen leitet den näher bestimmenden Relativsatz ein und richtet sich im Deutschen nach dem femininen Bezugswort „Grenze“.
- source_word: עָשׂוּ
  choice: gezogen haben
  rationale: עשה bedeutet grundsätzlich „machen/tun“. Bezogen auf eine Grenze ist „eine Grenze ziehen“ natürliches Deutsch und bezeichnet deren Festlegung, ohne eine bestimmte Art von Grenzstein vorauszusetzen.
- source_word: אֲבוֹתֶיךָ
  choice: deine Väter
  rationale: Die maskuline Pluralform mit Suffix der zweiten Person Singular wird formgetreu als „deine Väter“ wiedergegeben; je nach Kontext kann sie weiter gefasst die Vorfahren bezeichnen.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die ungewöhnlichere Verbindung „eine Grenze verrücken“ hält die konkrete Bildwelt des Hebräischen offen; Fußnote [a] bietet die ausdrücklich gegenständliche Deutung als Grenzmarke.
