id: PRO.3.13
reference: Proverbs 3:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַשְׁרֵ֣י אָ֭דָם מָצָ֣א חָכְמָ֑ה וְ֝/אָדָ֗ם יָפִ֥יק תְּבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/013.yaml
  text: Blessed is the man who finds wisdom[a], and the man who obtains understanding.
translation:
  language: de
  text: Glücklich ist der Mensch, der Weisheit findet, und der Mensch, der Einsicht gewinnt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die idiomatische Pluralform eröffnet einen Weisheitsspruch und bezeichnet einen beneidenswert guten Zustand. „Glücklich ist“ ist im heutigen Deutsch natürlich und bewahrt den Charakter einer Seligpreisung, ohne einen ausdrücklich göttlichen Segensakt in den Wortlaut einzutragen.
- source_word: אָדָם
  choice: der Mensch
  rationale: אָדָם bezeichnet hier generisch einen einzelnen Menschen. „Der Mensch“ wahrt Singular, Wiederholung und umfassende Geltung, ohne im Deutschen fälschlich nur einen männlichen Erwachsenen nahezulegen.
- source_word: מָצָא
  choice: findet
  rationale: Das Qatal lässt sich in diesem allgemeinen Weisheitsspruch idiomatisch als präsentische, allgemeingültige Aussage wiedergeben.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist die etablierte und kontextgerechte Wiedergabe des zentralen Weisheitsbegriffs in den Sprüchen.
- source_word: וְאָדָם
  choice: und der Mensch
  rationale: Die ausdrückliche Wiederholung erhält den parallelen Bau der beiden Vershälften.
- source_word: יָפִיק
  choice: gewinnt
  rationale: Im Parallelismus zu „findet“ bezeichnet das Verb das Erlangen beziehungsweise Hervorbringen von Einsicht. „Gewinnt“ gibt den Erwerb im Deutschen knapp und natürlich wieder, ohne den möglichen aktiven Beiklang ganz auszublenden.
- source_word: תְּבוּנָה
  choice: Einsicht
  rationale: Der Begriff meint verständiges Unterscheidungs- und Erkenntnisvermögen. „Einsicht“ bildet ein natürliches Begriffspaar mit „Weisheit“ und ist präziser als das breitere „Verständnis“.
theological_decisions:
- issue: Generischer Personenbezug von אָדָם
  choice: der Mensch
  alternative: der Mann
  rationale: Das hebräische אָדָם ist hier repräsentativ und auf jeden Menschen bezogen. Im modernen Deutschen gibt „der Mensch“ sowohl diese inklusive Reichweite als auch den Singular und die poetische Wiederholung formgetreu wieder; „der Mann“ würde leicht als geschlechtlich eingeschränkt verstanden.
translation_notes:
  register: Moderner, würdiger Weisheitsstil mit klarer zweiteiliger Parallelstruktur. Die Wiederholung von „der Mensch“ folgt dem Hebräischen bewusst; eine Fußnote ist nicht nötig, da die generische Bedeutung im deutschen Haupttext unmittelbar erkennbar ist.
