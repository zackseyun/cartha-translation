source:
  edition: WLC
  text: אִם תִּשְׁכַּ֥ב לֹֽא תִפְחָ֑ד וְ֝/שָׁכַבְתָּ֗ וְֽ/עָרְבָ֥ה שְׁנָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/024.yaml
  text: If you lie down[a], you will not be afraid; when you lie down, your sleep will be pleasant.
translation:
  language: de
  text: Wenn du dich hinlegst, wirst du dich nicht fürchten; legst du dich hin, wird dein Schlaf angenehm sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die Partikel leitet eine bedingte oder situative Aussage ein. „Wenn“ bewahrt ihre Grundbedeutung und passt zugleich zu einer allgemein gültigen Zusage.
- source_word: תִּשְׁכַּב
  choice: du dich hinlegst
  rationale: שׁכב bezeichnet hier im Zusammenhang mit Schlaf das Sich-Hinlegen. Die Formulierung ist natürlich und bleibt nahe am Hebräischen.
- source_word: לֹא תִפְחָד
  choice: wirst du dich nicht fürchten
  rationale: Die negierte Imperfektform drückt eine zugesicherte Folge aus, nicht ein Verbot oder eine Aufforderung.
- source_word: וְשָׁכַבְתָּ
  choice: legst du dich hin
  rationale: Die Verbform führt den Gedanken situativ beziehungsweise folgernd weiter. Die deutsche Voranstellung ohne wiederholtes „und“ gibt den Sinn natürlich wieder und erhält die Wiederholung des hebräischen Verbs.
- source_word: וְעָרְבָה
  choice: wird angenehm sein
  rationale: ערב bedeutet hier „angenehm, wohltuend“ und kann auch mit „süß“ wiedergegeben werden. „Angenehm“ ist im modernen Deutschen in Verbindung mit Schlaf klar und idiomatisch.
- source_word: שְׁנָתֶךָ
  choice: dein Schlaf
  rationale: Das Substantiv bezeichnet hier den Schlaf beziehungsweise die Erfahrung des Schlafens; „Schlaf“ ist die klare moderne Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchweisheitsstil. Die Wiederholung von שׁכב bleibt sichtbar; auf eine Fußnote wird verzichtet, da „süßer Schlaf“ eine lexikalische Alternative zu „angenehmer Schlaf“ ist, die den Sinn nicht wesentlich erweitert.
