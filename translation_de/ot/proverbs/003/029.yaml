  text: אַל תַּחֲרֹ֣שׁ עַל רֵעֲ/ךָ֣ רָעָ֑ה וְ/הֽוּא יוֹשֵׁ֖ב לָ/בֶ֣טַח אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/029.yaml
  text: Do not devise harm against your neighbor while he dwells securely with you[a].
translation:
  language: de
  text: Plane nichts Böses gegen deinen Nächsten, während er bei dir in Sicherheit wohnt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Plane kein Unheil gegen deinen Nächsten, während er vertrauensvoll bei dir wohnt.«'
    reason: „Unheil“ gibt die schädigende Seite von רָעָה wieder; „vertrauensvoll“ bringt die mögliche Nuance von לָבֶטַח zur Geltung, ohne sie als alleinige Hauptbedeutung festzulegen.
lexical_decisions:
- source_word: תַּחֲרֹשׁ
  choice: plane
  rationale: Das Verb חרשׁ bezeichnet in dieser Verbindung das absichtliche Planen oder Aushecken, nicht wörtlich das Pflügen.
- source_word: עַל
  choice: gegen
  rationale: Die Präposition bezeichnet hier die feindselige Ausrichtung des Vorhabens auf die betroffene Person.
- source_word: רֵעֲךָ
  choice: deinen Mitmenschen
  rationale: רֵעַ kann Nachbar, Gefährte oder Freund bedeuten. »Mitmensch« bewahrt hier die breite soziale und ethische Bedeutung, ohne räumliche Nachbarschaft oder persönliche Freundschaft vorauszusetzen.
- source_word: רָעָה
  choice: Böses
  rationale: רָעָה umfasst sowohl moralisches Unrecht als auch konkret beabsichtigten Schaden. »Böses« erhält diese Bedeutungsbreite.
- source_word: יוֹשֵׁב
  choice: wohnt
  rationale: Das Partizip von ישׁב bezeichnet hier ein andauerndes Wohnen oder Verweilen.
- source_word: לָבֶטַח
  choice: arglos
  rationale: בֶּטַח bezeichnet Sicherheit und kann in diesem Zusammenhang die vertrauensvolle, nichts Böses erwartende Haltung des Mitmenschen hervorheben; die räumlichere Wiedergabe »in Sicherheit« bleibt als Alternative in der Fußnote erhalten.
- source_word: אִתָּךְ
  choice: bei dir
  rationale: Die Präposition bezeichnet Nähe oder Gemeinschaft. »Bei dir« ist im modernen Deutschen natürlich und lässt sowohl räumliche als auch soziale Nähe zu.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Die Formulierung ist knapp und imperativisch; »arglos« macht den Vertrauensbruch im Kontext deutlich, ohne die mögliche Bedeutung »in Sicherheit« auszuschließen.
