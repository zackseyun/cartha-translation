id: PRO.3.7
reference: Proverbs 3:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תְּהִ֣י חָכָ֣ם בְּ/עֵינֶ֑י/ךָ יְרָ֥א אֶת יְ֝הוָ֗ה וְ/ס֣וּר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/007.yaml
  text: Do not be wise in your own eyes[c][b][a]; fear Yahweh and turn away from evil.
translation:
  language: de
  text: Sei nicht weise in deinen eigenen Augen[a]; fürchte Jahwe[b] und wende dich vom Bösen ab[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Werde nicht weise in deinen eigenen Augen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Hab Ehrfurcht vor Jahwe.“ Das hebräische Verb kann ehrfürchtige Furcht und heilige Scheu vor Gott bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Halte dich vom Bösen fern.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Sei nicht
  rationale: Die Verneinung אַל mit dem Jussiv von היה formuliert ein Verbot. „Sei nicht“ gibt die knappe hebräische Konstruktion natürlich wieder; „werde nicht“ bleibt als mögliche Nuance in der Fußnote erhalten.
- source_word: חָכָם בְּעֵינֶיךָ
  choice: weise in deinen eigenen Augen
  rationale: Die bildhafte hebräische Wendung bezeichnet Weisheit nach dem eigenen Urteil. Die nahe Wiedergabe bewahrt das Bild und ist im Deutschen verständlich.
- source_word: יְרָא
  choice: fürchte
  rationale: Der Imperativ kann Furcht, Ehrfurcht und verehrende Scheu vor Gott ausdrücken. „Fürchte“ bewahrt die volle Bedeutungsweite und das gewichtige Motiv der Weisheitsliteratur.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְסוּר מֵרָע
  choice: und wende dich vom Bösen ab
  rationale: סור bezeichnet ein bewusstes Sich-Entfernen oder Abwenden. „Vom Bösen“ bewahrt hier den allgemeinen moralischen Sinn von רָע.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes. „Jahwe“ gibt ihn als Namen wieder, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Bedeutungsumfang von ירא gegenüber Gott
  choice: fürchte
  alternative: habe Ehrfurcht vor
  rationale: „Fürchte“ lässt die Spannung zwischen Furcht, Ehrfurcht und heiliger Scheu bestehen, statt das Wort ausschließlich auf respektvolle Verehrung einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anschauliche Wendung „in deinen eigenen Augen“ bleibt erhalten; die parallelen Aufforderungen sind knapp und direkt formuliert.
