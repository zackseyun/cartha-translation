  source_fidelity: 'Der Entwurf gibt die hebräische Abfolge und den Sinn präzise wieder: אַל תְּהִי als Verbot („Sei nicht“), חָכָם בְּעֵינֶיךָ als Weisheit nach eigener Einschätzung, יְרָא als gewichtiger Imperativ gegenüber Jahwe und וְסוּר מֵרָע als Abwendung vom Bösen. Die dem Imperativ folgende koordinierte Aufforderung bleibt erhalten.'
