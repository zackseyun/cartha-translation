id: PRO.3.21
reference: Proverbs 3:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ֭נִ/י אַל יָלֻ֣זוּ מֵ/עֵינֶ֑י/ךָ נְצֹ֥ר תֻּ֝שִׁיָּ֗ה וּ/מְזִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/021.yaml
  text: My son[a], do not let them depart from your eyes[b]; guard sound wisdom and discretion.
translation:
  language: de
  text: Mein Sohn, lass sie[a] nicht aus deinen Augen weichen; bewahre praktische Weisheit[b] und Besonnenheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das „sie“ verweist auf die im Zusammenhang genannten Weisheitslehren oder Eigenschaften. Auch möglich: „Lass sie dir nicht aus dem Blick geraten.“'
    reason: Referenzklärung und lexikalische Alternative
  - marker: b
    text: 'Auch: „gesundes Urteilsvermögen“, „Umsicht“ oder „Tatkraft“. Gemeint ist Weisheit, die sich im Handeln bewährt.'
    reason: Lexikalische Bedeutungsbreite
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die ausdrücklich maskuline Anrede im Vater-Sohn-Lehrrahmen des Sprüchebuchs wird beibehalten.
- source_word: אַל יָלֻזוּ
  choice: lass sie nicht … weichen
  rationale: Die Verneinung mit der Verbform ergibt eine Aufforderung. Das maskuline Pluralpronomen bleibt sinngemäß erhalten, obwohl sein Bezug aus dem Umfeld erschlossen werden muss.
- source_word: מֵעֵינֶיךָ
  choice: aus deinen Augen
  rationale: Die hebräische Bildsprache wird bewahrt und bezeichnet, dass etwas nicht aus der Aufmerksamkeit geraten soll.
- source_word: נְצֹר
  choice: bewahre
  rationale: Der Imperativ fordert dazu auf, die genannten Eigenschaften sorgfältig festzuhalten und zu schützen.
- source_word: תֻּשִׁיָּה
  choice: praktische Weisheit
  rationale: Das Wort bezeichnet hier tragfähige, wirksame Weisheit beziehungsweise gesundes Urteilsvermögen; die Formulierung verbindet Einsicht mit praktischer Handlungsfähigkeit.
- source_word: וּמְזִמָּה
  choice: und Besonnenheit
  rationale: Im positiven Kontext der Weisheitslehre bezeichnet das Wort überlegtes, vorausschauendes Denken, nicht hinterlistiges Planen.
theological_decisions:
- issue: Geschlechtsspezifische Anrede
  choice: Mein Sohn
  alternative: Mein Kind
  rationale: Das Hebräische spricht ausdrücklich einen einzelnen männlichen Sohn an. Diese konkrete Lehrsituation wird nicht verallgemeinert.
- issue: Unausgesprochener Bezug des Plurals
  choice: Das Pronomen „sie“ bleibt ohne ergänztes Substantiv stehen.
  alternative: Die zuvor genannten Weisheitslehren oder Eigenschaften ausdrücklich einsetzen
  rationale: Der hebräische Text lässt den Bezug aus dem Zusammenhang erschließen. Eine ausdrückliche Ergänzung würde eine vorhandene syntaktische Offenheit unnötig festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Vater-Sohn-Anrede und das Augen-Bild des Hebräischen bleiben erhalten; „praktische Weisheit“ macht die zugleich gedankliche und handlungsbezogene Bedeutung von תֻּשִׁיָּה verständlich.
