  text: וְ/יִמָּלְא֣וּ אֲסָמֶ֣י/ךָ שָׂבָ֑ע וְ֝/תִיר֗וֹשׁ יְקָבֶ֥י/ךָ יִפְרֹֽצוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/010.yaml
  text: then your barns will be filled with abundance[a], and your vats will burst with new wine.
translation:
  language: de
  text: Dann werden deine Speicher bis zum Überfluss gefüllt, und deine Kelterbecken werden von jungem Wein überquellen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann das Verb auch „hervorbrechen“ oder „durchbrechen“ bedeuten. Hier beschreibt es anschaulich die überreiche Fülle des jungen Weins.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלְאוּ
  choice: werden … gefüllt
  rationale: Das Nifal bezeichnet hier ein Gefülltwerden beziehungsweise den daraus entstehenden vollen Zustand; die Zukunftsform entspricht dem Zusammenhang.
- source_word: אֲסָמֶיךָ
  choice: deine Speicher
  rationale: אֹסֶם bezeichnet einen Vorratsraum für landwirtschaftliche Erzeugnisse. „Speicher“ ist präzise und im modernen Deutschen natürlicher als das enger gefasste „Scheunen“.
- source_word: שָׂבָע
  choice: bis zum Überfluss
  rationale: Das Substantiv bezeichnet Sättigung, Fülle oder reichliches Genüge. Die Wendung gibt die Vorstellung vollständiger, überreicher Füllung idiomatisch wieder.
- source_word: תִירוֹשׁ
  choice: junger Wein
  rationale: תִּירוֹשׁ bezeichnet frischen beziehungsweise jungen Wein und wird dadurch vom allgemeineren Begriff für Wein unterschieden.
- source_word: יְקָבֶיךָ
  choice: deine Kelterbecken
  rationale: יֶקֶב bezeichnet im Zusammenhang der Weinbereitung die Kelter beziehungsweise das Auffangbecken. „Kelterbecken“ bewahrt das konkrete Bild eines sich füllenden Behälters.
- source_word: יִפְרֹצוּ
  choice: werden … überquellen
  rationale: פרץ trägt die kräftige Vorstellung des Hervorbrechens oder Durchbrechens. Im Zusammenhang mit gefüllten Kelterbecken bezeichnet es bildhaft ein Überquellen aufgrund großer Fülle.
theological_decisions:
- issue: Art der verheißenen Fülle
  choice: Die konkrete landwirtschaftliche Bildwelt von gefüllten Speichern und überquellenden Kelterbecken bleibt erhalten.
  alternative: Die Aussage als bloß allgemeine oder ausschließlich geistliche Segensverheißung wiedergeben.
  rationale: Der hebräische Text nennt greifbare Ernteerträge. Die Übersetzung deutet nicht vorab, ob und wie diese Weisheitsverheißung allgemein, symbolisch oder ausnahmslos zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die konkrete landwirtschaftliche Bildsprache des Hebräischen wurden bewahrt; „bis zum Überfluss“ und „überquellen“ ergeben zugleich eine natürliche deutsche Formulierung.
