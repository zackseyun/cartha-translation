  text: וּ/מְצָא חֵ֖ן וְ/שֵֽׂכֶל ט֑וֹב בְּ/עֵינֵ֖י אֱלֹהִ֣ים וְ/אָדָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/004.yaml
  text: Then you will find favor and good sense in the eyes of God and man[a].
translation:
  language: de
  text: So finde Gunst und gute Einsicht in den Augen Gottes und der Menschen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „Mensch“ im Singular; gemeint sind die Menschen beziehungsweise die Menschheit im Gegenüber zu Gott.
    reason: lexikalische Alternative und Erläuterung des kollektiven Sinns
lexical_decisions:
- source_word: וּמְצָא
  choice: Dann wirst du … finden
  rationale: Die Form kann unmittelbar als Aufforderung („und finde“) gelesen werden; im Zusammenhang mit den vorangehenden Mahnungen bezeichnet sie zugleich deren erwartete Folge. Die deutsche Zukunftsform mit „Dann“ gibt diesen Folgesinn natürlich wieder, ohne einen sicheren Erfolg unabhängig vom vorausgehenden Verhalten zu behaupten.
- source_word: חֵן
  choice: Gunst
  rationale: חֵן bezeichnet hier wohlwollende Annahme beziehungsweise Ansehen. „Gunst“ passt zur Wendung „in den Augen“ und vermeidet die in diesem Zusammenhang stärker theologisch geprägte Wiedergabe „Gnade“.
- source_word: וְשֵׂכֶל טוֹב
  choice: und gute Einsicht
  rationale: שֵׂכֶל kann Einsicht, verständiges Handeln oder den daraus erwachsenden guten Erfolg beziehungsweise Ruf bezeichnen. „Gute Einsicht“ bewahrt den kognitiv-ethischen Kern und lässt die im Hebräischen vorhandene Bedeutungsbreite eher offen als „Erfolg“ oder „Ansehen“.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die wörtliche und auch im Deutschen verständliche Redewendung bewahrt das hebräische Bild der Beurteilung und Wertschätzung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der Kontext meint den einen Gott; daher ist die Singularübersetzung eindeutig.
- source_word: וְאָדָם
  choice: und der Menschen
  rationale: אָדָם steht im Singular, bezeichnet hier aber die menschliche Seite im Gegensatz zu Gott. Der deutsche Plural „der Menschen“ gibt diesen umfassenden Sinn idiomatisch und ohne männliche Einschränkung wieder.
theological_decisions:
- issue: Der Aussagecharakter von וּמְצָא zwischen Aufforderung und Folge
  choice: Dann wirst du … finden
  alternative: und finde
  rationale: Die hebräische Imperativform knüpft formal an die vorangehenden Aufforderungen an, funktioniert in der Weisheitsunterweisung jedoch zugleich als Folgerung beziehungsweise verheißene Auswirkung. Die gewählte Fassung folgt diesem Zusammenhang; die Spannung wird in der Begründung ausdrücklich festgehalten.
- issue: Der repräsentative Sinn von אָדָם
  choice: der Menschen
  alternative: des Menschen
  rationale: Gemeint ist nicht ein bestimmter Mann, sondern menschliche Beurteilung im Gegenüber zu Gottes Beurteilung. „Der Menschen“ drückt dies im heutigen Standarddeutsch klar aus und importiert keine geschlechtsspezifische Aussage.
- issue: Bedeutungsbreite von שֵׂכֶל טוֹב
  choice: gute Einsicht
  alternative: gutes Ansehen / guten Erfolg / gesunden Menschenverstand
  rationale: Der Ausdruck kann sowohl verständige Haltung als auch deren günstige Wahrnehmung oder Wirkung bezeichnen. „Gute Einsicht“ hält den Weisheitsbezug fest, ohne die Stelle ausschließlich auf sozialen Ruf oder Erfolg festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Wendung „in den Augen“ bleibt erhalten. „Gute Einsicht“ ist bewusst etwas gehobener als „gesunder Menschenverstand“, bleibt jedoch allgemein verständlich und bewahrt die Bedeutungsweite des hebräischen Ausdrucks.
