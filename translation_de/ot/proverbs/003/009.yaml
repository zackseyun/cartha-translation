  source_fidelity: 'Die Grundbedeutung ist zutreffend: כַּבֵּד fordert dazu auf, Jahwe Ehre zu erweisen; הוֹן bezeichnet Vermögen/Besitz, und תְּבוּאָה den landwirtschaftlichen Ertrag. „Was du erntest“ gibt den Ertrag zwar verständlich wieder, verschiebt jedoch die Nominalkonstruktion „von allem deinem Ertrag“ in eine verbal-paraphrasierende Form. „Der erste Ertrag von allem“ ist zudem im Deutschen semantisch weniger klar als ein erster Anteil des gesamten Ertrags.'
  naturalness: „Ehre Jahwe mit deinem Vermögen“ ist natürliches, würdiges modernes Standarddeutsch. „Mit dem ersten Anteil deines gesamten Ertrags“ ist idiomatisch und verdeutlicht, dass רֵאשִׁית nicht notwendig den zeitlich allerersten einzelnen Ernteertrag, sondern den ersten Anteil der Gesamternte bezeichnet.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Vermögen“ ist für הוֹן passend. Für מֵרֵאשִׁית כָּל־תְּבוּאָתֶךָ ist „erster Anteil deines gesamten Ertrags“ genauer als „erster Ertrag von allem, was du erntest“. Die Fußnote sollte keine im hebräischen Wortlaut nicht ausdrücklich genannte Wertung („besonders wertvoll“) als Teil der Bedeutung behaupten.
