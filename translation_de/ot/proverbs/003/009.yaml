  text: כַּבֵּ֣ד אֶת יְ֭הוָה מֵ/הוֹנֶ֑/ךָ וּ֝/מֵ/רֵאשִׁ֗ית כָּל תְּבוּאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/009.yaml
  text: Honor Yahweh with your wealth and with the firstfruits of all your produce[a][b].
translation:
  language: de
  text: Ehre Jahwe mit deinem Vermögen[a] und mit dem ersten Anteil deines gesamten Ertrags[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von deinem Vermögen“; die hebräische Präposition kann nach „ehren“ sowohl das Mittel als auch die Quelle bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der „erste Anteil“ bezeichnet den ersten Teil der Ernte, der Gott zu Ehren dargebracht wurde.
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  choice: Ehre
  rationale: Der Piel-Imperativ von כבד bedeutet hier, jemandem Ehre zu erweisen. „Ehre“ ist knapp, idiomatisch und bewahrt den Charakter der Aufforderung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Wiedergabe des Tetragramms.
- source_word: מֵהוֹנֶךָ
  choice: mit deinem Vermögen
  rationale: הוֹן bezeichnet materiellen Besitz oder Wohlstand. „Vermögen“ ist im modernen Deutsch breit verständlich; die Präposition מִן kann nach „ehren“ instrumental als „mit“ wiedergegeben werden.
- source_word: וּמֵרֵאשִׁית
  choice: und mit dem ersten Ertrag
  rationale: רֵאשִׁית bezeichnet den Anfang beziehungsweise den ersten Anteil. Im landwirtschaftlichen Zusammenhang ist „erster Ertrag“ verständlich und erhält den zeitlichen sowie kultischen Bezug, ohne eine Gabe ausdrücklich in den Text einzufügen.
- source_word: כָּל
  choice: von allem
  rationale: כָּל umfasst hier die Gesamtheit des folgenden landwirtschaftlichen Ertrags. Die Formulierung „von allem“ ist in der deutschen Satzstruktur natürlich.
- source_word: תְּבוּאָתֶךָ
  choice: was du erntest
  rationale: תְּבוּאָה bezeichnet Ertrag, Erntegut oder landwirtschaftlichen Zuwachs. Die verbale Wendung ist für heutige Leser klar und bewahrt den landwirtschaftlichen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Im hebräischen Text steht der persönliche Gottesname. Die Transliteration „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Charakter des ersten Ertrags
  choice: erster Ertrag
  alternative: Erstlingsgaben; das Beste
  rationale: Der Text nennt wörtlich den „Anfang/ersten Anteil“ des Ertrags. „Erster Ertrag“ bewahrt dies, während „Erstlingsgaben“ den Gabecharakter ausdrücklich macht und „das Beste“ die kultische Bedeutung stärker auslegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung vermeidet veraltete Ausdrücke wie „Erstlinge“ im Haupttext, erhält aber durch „erster Ertrag“ den konkreten landwirtschaftlichen und kultischen Bezug.
