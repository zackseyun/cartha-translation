id: PRO.3.34
reference: Proverbs 3:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם לַ/לֵּצִ֥ים הֽוּא יָלִ֑יץ ו/ל/עניים יִתֶּן חֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/034.yaml
  text: Surely he scoffs at scoffers[a], but gives favor[b] to the humble[c].
translation:
  language: de
  text: Gewiss, über Spötter spottet er[a], doch den Demütigen[c] schenkt er Gunst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über Spötter macht er sich lustig“. Im Hebräischen steht für „Spötter“ und „spottet“ dieselbe Wortwurzel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gnade“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „den Armen“, „den Elenden“ oder „den Bedrängten“. Das Wort kann Menschen bezeichnen, die in ihrer Haltung demütig oder aufgrund ihrer Lebensumstände niedrig gestellt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Gewiss
  rationale: אִם hat hier wahrscheinlich bekräftigende statt konditionale Funktion; ein entsprechender Nachsatz fehlt, und der antithetische Spruch beschreibt ein charakteristisches Handeln.
- source_word: לַלֵּצִים … יָלִיץ
  choice: über Spötter spottet er
  rationale: Die Wiederholung derselben hebräischen Wurzel wird durch „Spötter/spottet“ bewahrt; „über“ bezeichnet idiomatisch die Zielrichtung des Spottens.
- source_word: הוּא
  choice: er
  rationale: Das ausdrückliche Pronomen bleibt erhalten; sein Bezug auf Gott ergibt sich aus dem Zusammenhang, ohne dass ein Gottesname ergänzt wird.
- source_word: וְלַעֲנִיִּים
  choice: doch den Demütigen
  rationale: Im Gegensatz zu den Spöttern bezeichnet der Ausdruck hier wahrscheinlich Menschen von demütiger oder niedriger Haltung; mögliche soziale und leidvolle Bedeutungsnuancen werden in der Fußnote offengehalten.
- source_word: יִתֶּן
  choice: schenkt er
  rationale: Das Imperfekt beschreibt im Spruchstil charakteristisches Handeln; das deutsche Präsens gibt diesen allgemeinen Sinn natürlich wieder.
- source_word: חֵן
  choice: Gunst
  rationale: חֵן kann „Gunst“ oder „Gnade“ bedeuten. „Gunst“ passt unmittelbar in den Weisheitskontext und vermeidet eine unnötige dogmatische Festlegung.
theological_decisions:
- issue: Bezug des Pronomens הוּא
  choice: Das Subjekt bleibt „er“; Gott ist aus dem Zusammenhang zu verstehen.
  alternative: „Gott“ oder „der HERR“ ausdrücklich ergänzen.
  rationale: Der hebräische Vers enthält ein Pronomen, keinen Gottesnamen. Die Übersetzung wahrt diese Form und überlässt die Identifizierung dem Kontext.
- issue: Bedeutung von עֲנִיִּים
  choice: „die Demütigen“
  alternative: „die Armen“, „die Elenden“ oder „die Bedrängten“
  rationale: Der Gegensatz zu den Spöttern legt eine Haltung der Demut nahe, doch das Wort kann zugleich soziale Niedrigkeit oder Bedrängnis bezeichnen; diese Mehrdeutigkeit wird durch eine Fußnote erhalten.
- issue: Funktion von אִם
  choice: 'Bekräftigend: „Gewiss“'
  alternative: 'Konditional: „Wenn“'
  rationale: Da kein eigenständiger konditionaler Nachsatz folgt und die beiden Halbverse einander antithetisch entsprechen, ist die bekräftigende Lesart syntaktisch und spruchliterarisch vorzuziehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe antithetische Form des Spruchs und das hebräische Wortspiel werden bewahrt. „Gewiss“ wirkt bekräftigend, ohne altertümlich zu klingen; „Gunst schenken“ ist verständlich und vermeidet eine unnötige konfessionelle Aufladung.
