  text: רִ֭פְאוּת תְּהִ֣י לְ/שָׁרֶּ֑/ךָ וְ֝/שִׁקּ֗וּי לְ/עַצְמוֹתֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/008.yaml
  text: It will be healing to your body and refreshment to your bones[a][b].
translation:
  language: de
  text: Das wird Heilung für deinen Leib[a] und Erfrischung für deine Knochen[b] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deinen Nabel«. Das hebräische Wort kann speziell den Nabel bezeichnen; hier steht es wahrscheinlich weiter gefasst für das körperliche Wohlergehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Feuchtigkeit« oder »Nahrung für deine Knochen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִפְאוּת
  choice: Heilung
  rationale: Das Substantiv bezeichnet Heilung beziehungsweise die Wiederherstellung der Gesundheit. »Heilung« bewahrt den ergebnisbezogenen und zugleich körperlichen Sinn.
- source_word: תְּהִי
  choice: Das wird … bringen
  rationale: Die feminine Verbform stimmt mit רִפְאוּת überein. Im Zusammenhang bezeichnet sie am natürlichsten die erwartete Folge der vorangehenden Aufforderung.
- source_word: לְשָׁרֶּךָ
  choice: deinem Leib
  rationale: שֹׁר wird traditionell als »Nabel« verstanden, kann hier aber wahrscheinlich umfassender auf die körperliche Verfassung bezogen sein. »Leib« gibt diesen Sinn in würdigem, verständlichem Deutsch wieder, ohne die konkrete Alternative zu verschweigen.
- source_word: וְשִׁקּוּי
  choice: und … Erquickung
  rationale: Das Wort ist vom Tränken beziehungsweise Befeuchten her gebildet. »Erquickung« bewahrt das Bild einer belebenden, stärkenden Versorgung und passt zum Parallelismus mit »Heilung«.
- source_word: לְעַצְמוֹתֶיךָ
  choice: deinen Gebeinen
  rationale: Die konkrete Körpermetapher wird beibehalten. »Gebeine« klingt in einer Weisheitsspruchform würdig und bezeichnet wie das hebräische »Knochen« auch das innere Gerüst und die Lebenskraft.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur formuliert die Folge der vorangehenden Mahnung natürlich aus. »Leib« vermeidet eine unbeabsichtigt enge anatomische Festlegung; die echte lexikalische Alternative »Nabel« bleibt in der Fußnote erhalten. Die beiden Fußnotenmarker stehen unmittelbar nach den jeweils betroffenen Wendungen.
