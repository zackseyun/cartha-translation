source:
  edition: WLC
  text: יְקָ֣רָה הִ֭יא מ/פניים וְ/כָל חֲ֝פָצֶ֗י/ךָ לֹ֣א יִֽשְׁווּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/015.yaml
  text: She is more precious than jewels[a], and none of your delights can compare with her.
translation:
  language: de
  text: Sie ist kostbarer als Edelsteine[a], und nichts von allem, was du begehrst, kommt ihr gleich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Korallen“ beziehungsweise „Perlen“; welches kostbare Material das hebräische Wort genau bezeichnet, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקָרָה
  choice: kostbarer
  rationale: Das Adjektiv bezeichnet hohen Wert; zusammen mit der Vergleichspräposition מִן wird der Komparativ „kostbarer als“ im Deutschen natürlich wiedergegeben.
- source_word: הִיא
  choice: sie
  rationale: Das feminine Singularpronomen verweist im Zusammenhang auf die personifizierte Weisheit und bewahrt diese Personifikation.
- source_word: מִפְּנִינִים
  choice: als Edelsteine
  rationale: פְּנִינִים bezeichnet wertvolle Schmuck- oder Edelsteine; die genaue Art ist unsicher. „Edelsteine“ bewahrt diese lexikalische Offenheit.
- source_word: וְכָל חֲפָצֶיךָ
  choice: und nichts von allem, was du begehrst
  rationale: Die wörtliche Verbindung „und alle deine begehrenswerten Dinge“ steht mit einem verneinten Verb. Die gewählte distributive Form ist idiomatisch und lässt חֲפָצֶיךָ sowohl auf begehrte als auch auf begehrenswerte Dinge bezogen verstehen.
- source_word: לֹא יִשְׁווּ בָהּ
  choice: kommt ihr gleich
  rationale: שוה bedeutet hier „gleich sein, ebenbürtig sein“. Der Singular „nichts“ verlangt im Deutschen „kommt“; „ihr gleichkommen“ ist eine natürliche Vergleichsformulierung.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Das feminine „sie“ wird beibehalten.
  alternative: Das sachliche Pronomen „sie“ lediglich als grammatischen Rückverweis auf „Weisheit“ ohne hervorgehobene Personifikation verstehen.
  rationale: Der hebräische Kontext stellt die Weisheit als weibliche Gestalt dar; die Übersetzung wahrt diese Darstellung, ohne sie christologisch oder konfessionell weiter zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kostbarer“ und „kommt ihr gleich“ bewahren den poetischen Vergleich; die Formulierung bleibt für heutige Leser leicht verständlich.
