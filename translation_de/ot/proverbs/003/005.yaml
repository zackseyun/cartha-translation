source:
  edition: WLC
  text: בְּטַ֣ח אֶל יְ֭הוָה בְּ/כָל לִבֶּ֑/ךָ וְ/אֶל בִּֽ֝ינָתְ/ךָ֗ אַל תִּשָּׁעֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/005.yaml
  text: Trust in Yahweh with all your heart[a], and do not lean on your own understanding.
translation:
  language: de
  text: Vertraue auf Jahwe von ganzem Herzen[a] und stütze dich nicht auf deinen eigenen Verstand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit deinem ganzen Herzen“. Im Hebräischen umfasst das Herz auch Denken, Wollen und Entscheiden.'
    reason: anthropologische und formale Bedeutungsnuance
lexical_decisions:
- source_word: בְּטַח אֶל
  choice: Vertraue auf
  rationale: Der Imperativ fordert unmittelbar zu vertrauensvoller Hinwendung auf. „Auf jemanden vertrauen“ ist im Deutschen idiomatisch und gibt die Verbindung von בטח mit אֶל natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen JHWH; „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּכָל לִבֶּךָ
  choice: von ganzem Herzen
  rationale: Diese geläufige deutsche Wendung drückt die umfassende Beteiligung des inneren Menschen aus. „Herz“ bleibt dabei weiter als bloßes Gefühl und umfasst im hebräischen Denken auch Wille und Denken.
- source_word: בִּינָתְךָ
  choice: deinen eigenen Verstand
  rationale: בִּינָה bezeichnet Verständnis, Einsicht oder Urteilsvermögen. „Verstand“ ist hier knapp und allgemein verständlich; „eigenen“ macht den im Possessivsuffix und im Gegensatz zu Jahwe liegenden Bezug natürlich deutlich.
- source_word: אַל תִּשָּׁעֵן
  choice: stütze dich nicht
  rationale: Die Konstruktion ist ein Verbot. Das Nifal von שׁען bezeichnet wörtlich, dass man sich auf etwas stützt; die deutsche Formulierung bewahrt dieses Bild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der persönliche Gottesname. Seine Wiedergabe als „Jahwe“ bewahrt den Unterschied zwischen Name und Titel.
- issue: Verhältnis von Gottvertrauen und menschlichem Verstand
  choice: Das bildhafte Verbot bleibt ohne erklärenden Zusatz stehen.
  alternative: Vertraue nicht auf deinen Verstand.
  rationale: Der Vers verwirft nicht ausdrücklich jedes Denken, sondern untersagt, sich darauf als tragende Grundlage zu stützen. Die Metapher erhält diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Gegensatz zwischen umfassendem Vertrauen auf Jahwe und dem Sichstützen auf den eigenen Verstand bleibt klar; die hebräische Stützmetapher wird bewahrt.
