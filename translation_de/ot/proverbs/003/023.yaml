base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/023.yaml
  text: Then you will walk securely on your way[a], and your foot will not stumble.
translation:
  language: de
  text: Dann wirst du sicher deinen Weg[a] gehen, und dein Fuß wird nicht anstoßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Sicherheit“. Der hebräische Ausdruck bezeichnet ein sicheres, gefahrloses Gehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das temporale Adverb kennzeichnet die Folge aus der vorausgehenden Unterweisung; „Dann“ gibt dies knapp und natürlich wieder.
- source_word: תֵּלֵךְ
  choice: gehst du
  rationale: הלך bedeutet „gehen“ oder „wandeln“. „Gehst du“ ist im modernen Deutsch natürlich und bewahrt zusammen mit „Weg“ die Wegmetaphorik der Weisheitsliteratur.
- source_word: לָבֶטַח
  choice: sicher
  rationale: Der Ausdruck bezeichnet Sicherheit beziehungsweise Gefahrlosigkeit. „Sicher“ gibt den adverbialen Sinn wieder, ohne ihn auf ein bloß subjektives Selbstvertrauen einzuengen.
- source_word: דַּרְכֶּךָ
  choice: deinen Weg
  rationale: דֶּרֶךְ kann Weg, Pfad oder Lebensweg bedeuten. „Deinen Weg“ lässt die konkrete und die übertragene Bedeutung zugleich offen.
- source_word: וְרַגְלְךָ
  choice: und dein Fuß
  rationale: Das Hebräische verwendet den Singular mit Suffix der zweiten Person; der Singular passt auch im Deutschen zum Bild des Gehens.
- source_word: לֹא תִגּוֹף
  choice: wird nicht stolpern
  rationale: נגף bezeichnet hier das Anstoßen des Fußes beziehungsweise das dadurch verursachte Stolpern. „Wird nicht stolpern“ ist klar und idiomatisch.
theological_decisions: []
