source:
  edition: WLC
  text: עֵץ חַיִּ֣ים הִ֭יא לַ/מַּחֲזִיקִ֣ים בָּ֑/הּ וְֽ/תֹמְכֶ֥י/הָ מְאֻשָּֽׁר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/018.yaml
  text: She is a tree of life to those who take hold of her[b][a], and those who hold her fast are blessed.
translation:
  language: de
  text: Sie ist ein Baum des Lebens für alle, die sie ergreifen, und alle, die an ihr festhalten,[a] sind glücklich zu preisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sie stützen“ oder „die sie aufrechterhalten“. Das hebräische Verb kann „stützen“, „aufrechterhalten“ oder „festhalten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵץ חַיִּים
  choice: ein Baum des Lebens
  rationale: Die hebräische Status-constructus-Verbindung bedeutet wörtlich „Baum des Lebens“. Der unbestimmte Artikel bewahrt das Bild, ohne den Ausdruck ausdrücklich mit dem einzigartigen Baum des Lebens in Eden gleichzusetzen.
- source_word: הִיא
  choice: Sie ist
  rationale: Das feminine Singularpronomen verweist auf die im Zusammenhang personifizierte Weisheit. „Sie“ erhält diese literarische Personifikation.
- source_word: לַמַּחֲזִיקִים בָּהּ
  choice: für alle, die sie ergreifen
  rationale: חזק bezeichnet hier ein kräftiges Ergreifen oder Festhalten. „ergreifen“ ist im Deutschen anschaulich und natürlich und bewahrt den Bezug auf die personifizierte Weisheit.
- source_word: וְתֹמְכֶיהָ
  choice: die an ihr festhalten
  rationale: תמך kann „stützen“, „aufrechterhalten“ oder „festhalten“ bedeuten. Im Parallelismus mit „ergreifen“ ist „an ihr festhalten“ gut verständlich, lässt die mögliche Nuance des Stützens jedoch in einer Fußnote erkennen.
- source_word: מְאֻשָּׁר
  choice: glücklich zu preisen
  rationale: Das Wort bezeichnet einen beneidenswerten Zustand des Wohlergehens. „glücklich zu preisen“ gibt diesen objektiven Weisheitssinn genauer wieder als das rein gefühlsbezogene „glücklich“ und vermeidet, dass „vom Glück begünstigt“ Zufall nahelegt.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Feminine Personenbezeichnungen („Sie“, „sie“, „ihr“) beibehalten
  alternative: Die Weisheit unpersönlich als „sie“ nur grammatisch oder durch „diese“ wiedergeben
  rationale: Die femininen Formen des Hebräischen greifen die im Kontext als Frau personifizierte Weisheit auf. Die Übersetzung erhält dieses literarische Merkmal, ohne darüber hinausgehende dogmatische Aussagen einzutragen.
- issue: Anklang an den Baum des Lebens
  choice: „ein Baum des Lebens“
  alternative: „der Baum des Lebens“ oder „ein lebensspendender Baum“
  rationale: Der hebräische Ausdruck bewahrt sowohl das Lebensmotiv als auch einen möglichen kanonischen Anklang, identifiziert die Weisheit hier aber nicht ausdrücklich mit einem bestimmten Baum. Der unbestimmte Artikel vermeidet eine Überpräzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Personifikation der Weisheit bleibt sichtbar. „Glücklich zu preisen“ entspricht dem weisheitlichen Sprachgebrauch, ohne bloß ein subjektives Glücksgefühl oder zufälliges Glück auszudrücken.
