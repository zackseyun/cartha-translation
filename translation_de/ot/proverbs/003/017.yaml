  text: דְּרָכֶ֥י/הָ דַרְכֵי נֹ֑עַם וְֽ/כָל נְתִ֖יבוֹתֶ֣י/הָ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/017.yaml
  text: Her ways are ways of pleasantness[a], and all her paths are peace.
translation:
  language: de
  text: Ihre Wege sind Wege der Lieblichkeit, und alle ihre Pfade sind Frieden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wohlergehen“ oder „Ganzheit“. Das hebräische Wort schalom hat einen weiteren Bedeutungsumfang als das deutsche „Frieden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיהָ
  choice: ihre Wege
  rationale: דֶּרֶךְ bezeichnet einen Weg und kann zugleich bildlich eine Lebensführung meinen. „Ihre Wege“ bewahrt beide Ebenen; das feminine Suffix verweist im Kontext auf die Weisheit.
- source_word: דַרְכֵי
  choice: Wege der
  rationale: Die Wiederholung desselben Nomens wird beibehalten („Ihre Wege sind Wege ...“), um die hebräische Betonung und poetische Form zu wahren.
- source_word: נֹעַם
  choice: Freude
  rationale: נֹעַם bezeichnet Annehmlichkeit, Lieblichkeit oder etwas Erfreuliches. „Freude“ ist hier natürlich und verständlich, ohne die positive Qualität der Wege auf bloßes Vergnügen zu verengen.
- source_word: וְכָל
  choice: und alle
  rationale: Die Wiedergabe erhält die umfassende Aussage des zweiten Versglieds.
- source_word: נְתִיבוֹתֶיהָ
  choice: ihre Pfade
  rationale: נְתִיבָה bezeichnet einen Pfad oder gebahnten Weg und steht poetisch parallel zu דֶּרֶךְ. „Pfade“ bewahrt die Bildsprache und variiert natürlich gegenüber „Wege“.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen und Ganzheit. „Frieden“ ist die etablierte, prägnante Wiedergabe; eine Fußnote weist auf den weiteren Bedeutungsumfang hin.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrter poetischer Parallelität und Wiederholung. Das feminine Pronomen bleibt erhalten, da es sich im Kontext auf die personifizierte Weisheit bezieht.
