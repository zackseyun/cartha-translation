  text: אֹ֣רֶךְ יָ֭מִים בִּֽ/ימִינָ֑/הּ בִּ֝/שְׂמֹאולָ֗/הּ עֹ֣שֶׁר וְ/כָבֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/016.yaml
  text: Length of days is in her right hand[a]; in her left hand are riches and honor.
translation:
  language: de
  text: Langes Leben liegt in ihrer rechten Hand[a]; in ihrer linken Hand sind Reichtum und Ehre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Länge der Tage«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: Langes Leben
  rationale: Die Wendung bedeutet wörtlich »Länge der Tage«. »Langes Leben« gibt das hebräische Idiom im modernen Deutschen natürlich und präzise wieder; die wörtlichere Form wird in der Fußnote genannt.
- source_word: בִּימִינָהּ
  choice: in ihrer rechten Hand
  rationale: Die Präposition ב wird hier räumlich als »in« verstanden. Das feminine Suffix verweist im Zusammenhang auf die personifizierte Weisheit.
- source_word: בִּשְׂמֹאולָהּ
  choice: in ihrer linken
  rationale: Die Formulierung wahrt die Parallelität zur rechten Hand; »Hand« kann im zweiten Halbvers idiomatisch ausgelassen werden, ohne den Sinn zu verändern.
- source_word: עֹשֶׁר
  choice: Reichtum
  rationale: »Reichtum« ist eine natürliche, dem gehobenen poetischen Register angemessene Wiedergabe und bildet mit »Ehre« ein stimmiges Paar.
- source_word: כָבוֹד
  choice: Ehre
  rationale: Im Kontext der Weisheitsliteratur bezeichnet das Wort hier vor allem Ansehen und Ehre, nicht spezifisch göttliche Herrlichkeit.
theological_decisions:
- issue: Bezug der femininen Suffixe
  choice: Die femininen Formen beziehen sich auf die im Kontext personifizierte Weisheit.
  alternative: Die Formen als Hinweis auf ein eigenständiges weibliches göttliches Wesen deuten.
  rationale: Der unmittelbare literarische Zusammenhang stellt die Weisheit als Frau dar. Die Übersetzung bewahrt diese Personifikation, ohne daraus eine weitergehende ontologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelität. Die Personifikation der Weisheit und das Bild ihrer beiden Hände bleiben erhalten.
