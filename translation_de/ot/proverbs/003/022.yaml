  - severity: low
    issue: Die Fußnote zu חֵן nennt »Schmuck« als Alternative.
    rationale: חֵן bedeutet hier eher »Anmut«, »Gunst« oder »Charme«; »Schmuck« ist nicht die unmittelbare Bedeutung des Wortes, sondern allenfalls eine kontextuelle Assoziation des Halsbildes.
