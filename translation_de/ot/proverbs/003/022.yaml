- from: Dann werden sie Leben für dich sein und Anmut für deinen Hals.[a][b]
  to: Dann werden sie deiner Seele Leben und deinem Hals Anmut sein.[a][b]
  rationale: Die Revision stellt die im Hebräischen parallelen Wendungen »deiner Seele« und »deinem Hals« wieder her, ohne den Bedeutungsumfang von נֶפֶשׁ einseitig festzulegen. Die Fußnote zu חֵן wurde auf tatsächliche lexikalische Alternativen beschränkt.
