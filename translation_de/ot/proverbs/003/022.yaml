  text: וְ/יִֽהְי֣וּ חַיִּ֣ים לְ/נַפְשֶׁ֑/ךָ וְ֝/חֵ֗ן לְ/גַרְגְּרֹתֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/022.yaml
  text: and they will be life to your soul and grace to your neck[a][b].
translation:
  language: de
  text: Dann werden sie deiner Seele Leben und deinem Hals Anmut sein.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch nefesch; je nach Zusammenhang kann das Wort »Leben«, »Person«, »Selbst« oder »Seele« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gunst« oder »Charme«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: Dann werden sie … sein
  rationale: Das Qal-Imperfekt mit וְ wird im Zusammenhang als Folgeaussage verstanden und verweist auf die zuvor genannten Größen Weisheit und Besonnenheit.
- source_word: חַיִּים
  choice: Leben
  rationale: Die formal plurale Form dient häufig als abstrakte Bezeichnung für »Leben«; der deutsche Singular ist natürlich und sachgemäß.
- source_word: לְנַפְשֶׁךָ
  choice: für dich
  rationale: נֶפֶשׁ bezeichnet hier die Person beziehungsweise ihr Leben als Ganzes. »Für dich« gibt diesen umfassenden Sinn in natürlichem Deutsch wieder, ohne ihn auf eine vom Körper getrennte Seele einzuengen.
- source_word: וְחֵן
  choice: und Anmut
  rationale: חֵן kann Gunst, Anmut oder anziehende Wirkung bezeichnen. Beim Bild des Halsschmucks bringt »Anmut« den ästhetischen Aspekt besonders klar zum Ausdruck.
- source_word: לְגַרְגְּרֹתֶיךָ
  choice: für deinen Hals
  rationale: Das seltene Wort bezeichnet den Hals- oder Kehlbereich; im Kontext ist der Hals als Ort eines schmückenden Gegenstands gemeint.
theological_decisions:
- issue: Bedeutungsumfang von נֶפֶשׁ
  choice: »für dich« im Haupttext
  alternative: »für deine Seele« oder »für dein Leben«
  rationale: Die Wiedergabe bewahrt den ganzheitlichen Personenbezug und vermeidet eine unbeabsichtigte anthropologische Festlegung; die wörtlicheren Möglichkeiten werden in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Folgebeziehung zum vorherigen Vers wird mit »Dann« ausgedrückt. Das knappe Bild vom Leben für die Person und von Anmut als Halsschmuck bleibt erhalten.
