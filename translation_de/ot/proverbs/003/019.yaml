  yaml_path: translation/ot/proverbs/003/019.yaml
  text: Yahweh founded the earth by wisdom[a]; he established the heavens by understanding.
translation:
  language: de
  text: Jahwe gründete die Erde durch Weisheit[a]; er stellte den Himmel durch Einsicht fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Weisheit“ … „mit Einsicht“. Die hebräische Präposition kann ein Mittel oder eine Begleitung ausdrücken; hier passt „durch“ am besten zur Vorstellung vom Schöpfungshandeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Transliteration des göttlichen Namens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: בְּחָכְמָה
  choice: durch Weisheit
  rationale: Die Präposition ב bezeichnet hier am ehesten das Mittel; „durch“ ist im Deutschen natürlich und bewahrt zugleich die mögliche Begleitbedeutung für die Fußnote.
- source_word: יָסַד
  choice: gründete
  rationale: Das Verb bezeichnet das Gründen beziehungsweise Legen eines Fundaments und erhält so das Bild des Bauens bei der Schöpfung.
- source_word: אָרֶץ
  choice: die Erde
  rationale: Im kosmischen Zusammenhang ist die Erde, nicht ein bestimmtes Land, gemeint.
- source_word: כּוֹנֵן
  choice: stellte … fest
  rationale: Die Wendung gibt das feste Aufrichten oder Beständigmachen wieder und unterscheidet sich passend von „gründete“.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: Das deutsche Kollektivsingular ist in der festen kosmischen Paarung „Erde und Himmel“ natürlich und gibt den hebräischen Begriff sachgerecht wieder.
- source_word: בִּתְבוּנָה
  choice: durch Einsicht
  rationale: „Einsicht“ gibt תְּבוּנָה als verständiges Erkennen wieder und wahrt die begriffliche Unterscheidung von חָכְמָה „Weisheit“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen in der heute üblichen deutschen Form, ohne ihn durch einen Titel zu ersetzen.
- issue: Rolle von Weisheit und Einsicht bei der Schöpfung
  choice: instrumentale Formulierung „durch“
  alternative: begleitende Formulierung „mit“
  rationale: Die Präposition ב kann Mittel oder Begleitung ausdrücken. In diesem Schöpfungszusammenhang liegt das Mittel nahe; die echte sprachliche Alternative wird jedoch in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache mit knappem poetischem Parallelismus. „Gründete“ und „stellte … fest“ erhalten die beiden verwandten, aber nicht identischen Schöpfungsbilder.
