id: PRO.3.6
reference: Proverbs 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/כָל דְּרָכֶ֥י/ךָ דָעֵ֑/הוּ וְ֝/ה֗וּא יְיַשֵּׁ֥ר אֹֽרְחֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/006.yaml
  text: In all your ways acknowledge him[a], and he will make your paths straight.
translation:
  language: de
  text: Erkenne ihn auf all deinen Wegen, und er wird deine Pfade ebnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und er wird deine Pfade gerade machen«; auch verstanden als: »und er wird dich auf deinen Pfaden führen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל
  choice: auf all
  rationale: 'Die Verbindung aus בְּ und כָּל bezeichnet umfassend den Bereich des Handelns. Im Deutschen lautet die natürliche Verbindung mit »Wegen«: »auf all deinen Wegen«.'
- source_word: דְּרָכֶיךָ
  choice: deinen Wegen
  rationale: דֶּרֶךְ kann einen wirklichen Weg oder bildlich die Lebensführung bezeichnen. »Wege« bewahrt diese Breite und unterscheidet den Ausdruck von אֹרְחוֹתֶיךָ im zweiten Versglied.
- source_word: דָעֵהוּ
  choice: Erkenne ihn
  rationale: 'Der Imperativ von יָדַע mit Objektsuffix meint hier mehr als bloßes Wissen: Gott soll im gesamten Lebensvollzug erkannt und berücksichtigt werden. »Erkenne ihn« bleibt nahe am Hebräischen und bewahrt die relationale Tiefe, ohne sie durch eine engere Deutung aufzulösen.'
- source_word: וְהוּא
  choice: und er
  rationale: Die Konjunktion mit dem ausdrücklich gesetzten Pronomen hebt Gott als den Handelnden hervor. »Und er« gibt dies im Deutschen schlicht und natürlich wieder.
- source_word: יְיַשֵּׁר
  choice: wird … ebnen
  rationale: Das Piel von יָשַׁר bedeutet gerade beziehungsweise eben machen. In Verbindung mit »Pfade« gibt »ebnen« das hebräische Wegbild natürlich wieder; die Alternative »gerade machen« ist wörtlicher.
- source_word: אֹרְחֹתֶיךָ
  choice: deine Pfade
  rationale: אֹרַח bezeichnet einen Pfad oder eine Bahn, wörtlich wie bildlich. »Pfade« erhält das Bild und unterscheidet das Wort von דְּרָכֶיךָ (»Wege«).
theological_decisions:
- issue: Art der göttlichen Führung in der Zusage
  choice: er wird deine Pfade ebnen
  alternative: er wird deine Pfade gerade machen / dich auf deinen Pfaden führen
  rationale: Der hebräische Ausdruck beschreibt Gottes Handeln als ein Gerade- oder Ebenmachen des Lebensweges, nicht lediglich als das Erteilen von Richtungsanweisungen. »Ebnen« bewahrt das Bild in idiomatischem Deutsch; die Fußnote nennt die wörtlichere Wiedergabe und die verbreitete deutende Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus zwischen »Wegen« und »Pfaden« sowie das hebräische Wegbild bleiben erhalten. »Erkenne ihn« wahrt bewusst die relationale und praktische Bedeutungsweite von יָדַע.
