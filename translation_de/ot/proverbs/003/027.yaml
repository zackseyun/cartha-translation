source:
  edition: WLC
  text: אַל תִּמְנַע ט֥וֹב מִ/בְּעָלָ֑י/ו בִּ/הְי֨וֹת לְ/אֵ֖ל ידי/ך לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/027.yaml
  text: Do not withhold good from those to whom it is due when it is in your power to do it[a][b].
translation:
  language: de
  text: Enthalte denen, denen es zusteht, nichts Gutes vor, wenn es in deiner Macht steht, es zu tun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn es in der Macht deiner Hand steht, es zu tun“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Enthalte … nicht vor
  rationale: Die hebräische Verbotsform mit מנע fordert dazu auf, etwas nicht zurückzuhalten; die deutsche Wendung „jemandem etwas vorenthalten“ gibt dies natürlich und präzise wieder.
- source_word: טוֹב
  choice: Gutes
  rationale: Das Hebräische bleibt bewusst weit und kann materielle Hilfe, Wohltat oder sonstigen Nutzen bezeichnen. „Gutes“ bewahrt diese Offenheit.
- source_word: מִבְּעָלָיו
  choice: denen …, denen es zusteht
  rationale: Wörtlich sind die „Besitzer“ beziehungsweise Anspruchsberechtigten des Guten gemeint. Die gewählte idiomatische Form drückt einen berechtigten Anspruch aus, ohne ihn auf rechtlich geschuldete Leistungen zu verengen.
- source_word: בִּהְיוֹת לְאֵל יָדֶךָ
  choice: wenn es in deiner Macht steht
  rationale: Die Wendung spricht bildhaft von der Macht beziehungsweise Fähigkeit der Hand. Die deutsche Form gibt den idiomatischen Sinn klar wieder.
- source_word: לַעֲשׂוֹת
  choice: es zu tun
  rationale: Das allgemeine Verb עשה bedeutet „tun/machen“; das Pronomen nimmt die zuvor genannte gute Tat sinngemäß auf.
theological_decisions:
- issue: Reichweite der Verpflichtung gegenüber den „Besitzern“ des Guten
  choice: denen es zusteht
  alternative: seinen Besitzern
  rationale: Der Vers bezeichnet die Empfänger als Personen mit einem Anspruch auf das Gute, lässt aber offen, ob dieser Anspruch rechtlich, moralisch oder situationsbedingt ist. Die Übersetzung wahrt diese Spannung und formuliert keine engere Lehrposition.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt sprichwortartig knapp; „Gutes“ und „zusteht“ bewahren die inhaltliche Weite des Hebräischen.
