id: PRO.3.11
reference: Proverbs 3:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מוּסַ֣ר יְ֭הוָה בְּנִ֣/י אַל תִּמְאָ֑ס וְ/אַל תָּ֝קֹ֗ץ בְּ/תוֹכַחְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/011.yaml
  text: My son[a], do not despise Yahweh’s discipline, and do not loathe his reproof.
translation:
  language: de
  text: Mein Sohn, verachte Jahwes Erziehung nicht und verabscheue seine Zurechtweisung nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Werde seiner Zurechtweisung nicht überdrüssig.“ Das hebräische Verb kann neben Abscheu auch Überdruss oder Ungeduld ausdrücken.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: מוּסַר
  choice: Erziehung
  rationale: Das Wort bezeichnet in der Weisheitsliteratur formende und korrigierende Unterweisung. „Erziehung“ gibt diesen umfassenden Sinn natürlicher wieder als das heute oft vorwiegend strafend verstandene „Züchtigung“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen gebräuchliche Umschrift.
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die hebräische Anrede steht im maskulinen Singular und gehört zur väterlichen Lehrrede der Weisheitsliteratur.
- source_word: אַל תִּמְאָס
  choice: verachte … nicht
  rationale: מָאַס bezeichnet ablehnende Geringschätzung; „verachten“ bewahrt die innere Haltung, die über ein bloßes Zurückweisen hinausgeht.
- source_word: תָּקֹץ
  choice: verabscheue … nicht
  rationale: קוּץ kann Abscheu, Widerwillen, Ungeduld oder Überdruss ausdrücken. „Verabscheuen“ wahrt die starke emotionale Abwehr und den Parallelismus zu „verachten“; die Bedeutung „überdrüssig werden“ wird in der Fußnote genannt.
- source_word: בְּתוֹכַחְתּוֹ
  choice: seine Zurechtweisung
  rationale: תּוֹכַחַת bezeichnet tadelnde oder korrigierende Ansprache. „Zurechtweisung“ unterscheidet diesen konkreteren Aspekt von der umfassenderen „Erziehung“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Umschrift „Jahwe“ bewahrt ihn als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe väterliche Anrede und der parallele Aufbau des hebräischen Spruchs bleiben erhalten; altertümliches oder vorwiegend strafend klingendes Vokabular wird vermieden.
