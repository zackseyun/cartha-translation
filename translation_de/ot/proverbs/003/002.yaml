  text: for they will add to you length of days and years of life and peace[a].
translation:
  language: de
  text: Denn sie werden dir langes Leben, Lebensjahre und Frieden[a] hinzufügen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wohlergehen« oder »Unversehrtheit«. Das hebräische Wort schalom kann umfassendes Wohlergehen bezeichnen, nicht nur die Abwesenheit von Konflikten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Ermahnung ein und verbindet den Vers im Deutschen natürlich mit dem Kontext.
- source_word: אֹרֶךְ יָמִים
  choice: ein langes Leben
  rationale: Gibt die hebräische Wendung verständlich und idiomatisch wieder; das wörtlichere »Länge der Tage« wäre im modernen Deutschen weniger natürlich.
- source_word: וּשְׁנוֹת חַיִּים
  choice: viele Lebensjahre
  rationale: Bewahrt die poetische Entfaltung des ersten Ausdrucks und vermeidet die im Deutschen schwerfällige Formulierung »Jahre des Lebens«.
- source_word: וְשָׁלוֹם
  choice: und Frieden
  rationale: »Frieden« ist die knappe, vertraute Wiedergabe von שָׁלוֹם; dessen weiterer Sinn von Wohlergehen und Ganzsein wird in der Fußnote erhalten.
- source_word: יוֹסִיפוּ
  choice: werden … schenken
  rationale: Das Hifil von יסף bedeutet wörtlich »hinzufügen«. Mit den genannten Lebensgütern und לָךְ drückt »schenken« im Deutschen die Wirkung natürlich aus, ohne die Aussage abzuschwächen.
- source_word: לָךְ
  choice: dir
  rationale: Kennzeichnet die Person, der diese Güter hinzugefügt beziehungsweise geschenkt werden.
