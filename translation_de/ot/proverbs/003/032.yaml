  text: For the crooked person is an abomination to Yahweh[a], but his counsel is with the upright.
translation:
  language: de
  text: Denn wer krumme Wege geht, ist Jahwe ein Gräuel, doch mit den Aufrichtigen hat er vertrauten Umgang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doch sein Geheimnis ist bei den Aufrichtigen“ oder „doch sein vertrauter Rat ist bei den Aufrichtigen“. Das hebräische Wort kann vertrauten Umgang, vertraulichen Rat oder ein Geheimnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Mahnung ein und entspricht dem Zusammenhang eines Weisheitsspruchs.
- source_word: תוֹעֲבַת
  choice: ein Gräuel
  rationale: Bewahrt das starke moralische Gewicht des hebräischen Substantivs und ist in gehobenem, verständlichem Deutsch geläufig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: נָלוֹז
  choice: wer krumme Wege geht
  rationale: Das Wort bezeichnet einen moralisch Verdrehten oder Abweichenden; die Formulierung macht das Bild im Deutschen natürlich und erhält den Gegensatz zu den Aufrichtigen.
- source_word: וְאֶת
  choice: doch mit
  rationale: Die hebräische Verbindung ist im antithetischen Parallelismus kontrastiv zu verstehen; die Präposition ergibt sich aus der deutschen Wiedergabe der folgenden Wendung.
- source_word: יְשָׁרִים
  choice: den Aufrichtigen
  rationale: Bewahrt den moralischen Gegensatz zwischen dem Krummen und den geradlinig Lebenden.
- source_word: סוֹדוֹ
  choice: seinen vertrauten Rat
  rationale: סוֹד kann vertrauliche Beratung, Geheimnis oder engen vertrauten Umgang bezeichnen. Diese Wiedergabe erhält die kommunikative und relationale Dimension, ohne sie vollständig auf eine einzige Bedeutung festzulegen.
theological_decisions:
- issue: Bedeutung von סוֹד im Verhältnis zu den Aufrichtigen
  choice: Jahwe teilt mit den Aufrichtigen seinen vertrauten Rat
  alternative: Sein Geheimnis ist bei den Aufrichtigen; er pflegt vertraute Gemeinschaft mit den Aufrichtigen
  rationale: Der hebräische Ausdruck umfasst sowohl vertrauliche Mitteilung als auch Nähe im vertrauten Kreis. Der Haupttext formuliert idiomatisch, während die Fußnote die echte Bedeutungsbreite offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der bildhafte Gegensatz zwischen krummem Verhalten und Aufrichtigkeit bleibt erhalten; die Mehrdeutigkeit von סוֹד wird im Haupttext nicht unnötig verengt und in der Fußnote ausdrücklich ausgewiesen.
