  text: for her profit is better than the profit of silver[b][a], and her yield than gold.
translation:
  language: de
  text: Denn der Gewinn, den sie bringt, ist besser als der Gewinn aus Silber[a], und ihr Ertrag besser als Gold[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als der Handel mit Silber“. Das Hebräische verwendet hier ausdrücklich die Sprache von Handel und Gewinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als Feingold“ beziehungsweise „als kostbares Gold“. Das hebräische Wort kann besonders wertvolles oder geläutertes Gold bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Seligpreisung des Menschen ein, der Weisheit findet.
- source_word: טוֹב
  choice: besser
  rationale: Das Adjektiv bedeutet grundsätzlich „gut“, erhält aber durch die Vergleichskonstruktion mit מִן den Sinn „besser“.
- source_word: סַחְרָהּ
  choice: der Gewinn, den sie bringt
  rationale: Bewahrt die wirtschaftliche Bildsprache und bezieht das feminine Suffix natürlich auf die personifizierte Weisheit.
- source_word: מִסְּחַר כָּסֶף
  choice: als der Gewinn aus Silber
  rationale: Gibt nicht nur den Wertstoff Silber wieder, sondern erhält den im Hebräischen ausdrücklich wiederholten Handels- und Gewinnbegriff.
- source_word: וּמֵחָרוּץ
  choice: als Gold
  rationale: חָרוּץ bezeichnet hier kostbares beziehungsweise geläutertes Gold; „Gold“ ist im Haupttext klar und lässt die mögliche Nuance in der Fußnote offen.
- source_word: תְּבוּאָתָהּ
  choice: ihr Ertrag
  rationale: Gibt das Bild dessen wieder, was die Weisheit hervorbringt oder einträgt, und bildet eine natürliche Parallele zu „Gewinn“.
