source:
  edition: WLC
  text: מְאֵרַ֣ת יְ֭הוָה בְּ/בֵ֣ית רָשָׁ֑ע וּ/נְוֵ֖ה צַדִּיקִ֣ים יְבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/033.yaml
  text: Yahweh’s curse is on the house of the wicked[b][a], but he blesses the dwelling of the righteous.
translation:
  language: de
  text: Der Fluch Jahwes liegt auf dem Haus des Gottlosen[a], doch die Wohnstätte[b] der Gerechten segnet er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „ist im Haus des Gottlosen“. Die hebräische Präposition kann „in“ oder im Zusammenhang eines Fluches sinngemäß „auf“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Heim“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֵרַת
  choice: Fluch
  rationale: Das Substantiv bezeichnet einen Fluch beziehungsweise einen verfluchten Zustand; „Fluch“ ist im Deutschen knapp und unmittelbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּבֵית
  choice: liegt auf dem Haus
  rationale: Die Präposition ב kann hier örtlich mit „im“ verstanden werden; zusammen mit „Fluch“ vermittelt „liegt auf“ idiomatisch, dass der Fluch auf dem Haus beziehungsweise Haushalt ruht.
- source_word: רָשָׁע
  choice: des Gottlosen
  rationale: Der morphologische Singular ist in diesem Weisheitsspruch generisch; die substantivierte Form bewahrt Zahl und moralische Kategorie.
- source_word: וּנְוֵה
  choice: doch die Wohnstätte
  rationale: נָוֶה bezeichnet Wohnstätte, Heim oder Behausung. „Doch“ gibt den klaren Gegensatz der beiden Vershälften wieder.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Das substantivierte Adjektiv im Plural bezeichnet die moralische Gruppe der Gerechten.
- source_word: יְבָרֵךְ
  choice: segnet er
  rationale: Das Imperfekt drückt hier am natürlichsten eine allgemeingültige, sprichwörtliche Aussage aus; die Nachstellung des Subjekts bewahrt den Fokus auf der Wohnstätte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ ist die gebräuchliche wissenschaftliche Rekonstruktion des Eigennamens und vermeidet die Ersetzung durch einen Titel.
- issue: Generischer Singular רָשָׁע
  choice: des Gottlosen
  alternative: der Frevler / eines gottlosen Menschen
  rationale: Der Singular bezeichnet repräsentativ den gottlosen Menschen. „Des Gottlosen“ erhält den Singular und führt kein zusätzliches Geschlecht über die grammatische Form hinaus ein.
- issue: Implizites Subjekt von יְבָרֵךְ
  choice: segnet er
  alternative: wird gesegnet
  rationale: Das grammatische Subjekt des Verbs ist Jahwe aus der ersten Vershälfte. Die aktive Wiedergabe macht diese syntaktische Beziehung sichtbar, ohne eine zusätzliche Aussage einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit sprichwörtlicher Kürze. „Wohnstätte“ ist leicht gehoben, bewahrt aber den konkreten Gegensatz zu „Haus“. Die beiden Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Formulierung.
