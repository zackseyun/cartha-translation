base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/026.yaml
  text: For Yahweh will be your confidence[a], and he will keep your foot from being caught.
translation:
  language: de
  text: Denn Jahwe wird deine Zuversicht sein[a] und deinen Fuß davor bewahren, gefangen zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe wird an deiner Seite sein.“ Die hebräische Wendung kann auch räumlich-körperlich verstanden werden; hier ist jedoch wahrscheinlich die bildliche Bedeutung „Zuversicht“ oder „Sicherheit“ gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Ermutigung und stellt den erklärenden Zusammenhang knapp und natürlich her.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen Form wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: יִהְיֶה בְכִסְלֶךָ
  choice: wird deine Zuversicht sein
  rationale: כֶּסֶל kann wörtlich die Lende oder Seite bezeichnen, hier aber auch bildlich Zuversicht oder Sicherheit. Der Schutzgedanke im zweiten Versglied spricht im Kontext für die übertragene Bedeutung, ohne die wörtlichere Möglichkeit auszuschließen.
- source_word: וְשָׁמַר
  choice: und … bewahren
  rationale: שׁמר bezeichnet das Hüten, Bewachen oder Bewahren. Die gewählte Formulierung ist im Deutschen natürlich und passt zur folgenden Gefährdung.
- source_word: רַגְלְךָ
  choice: deinen Fuß
  rationale: Der Singular des hebräischen Textes bleibt erhalten und bewahrt das anschauliche Bild.
- source_word: מִלָּכֶד
  choice: davor … sich zu verfangen
  rationale: Die Form von לכד bezeichnet das Gefangen- oder Ergriffenwerden. „Sich verfangen“ verbindet sich idiomatisch mit „Fuß“ und erhält das Bild einer Falle, ohne ein im Hebräischen nicht ausdrücklich genanntes Substantiv einzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname Gottes. „Jahwe“ bewahrt ihn als Namen; „der HERR“ wäre die traditionelle Ersetzung durch einen Titel.
- issue: Bedeutung von בְכִסְלֶךָ
  choice: deine Zuversicht
  alternative: an deiner Seite
  rationale: Die bildliche Deutung als Zuversicht oder Sicherheit passt zum parallelen Schutz vor dem Gefangenwerden. Da die Wendung auch räumlich-körperlich verstanden werden kann, wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und bildhaft; der Singular „Fuß“ sowie die Spannung zwischen Zuversicht und räumlicher Nähe werden bewahrt.
