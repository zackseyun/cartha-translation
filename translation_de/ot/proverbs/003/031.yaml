base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/031.yaml
  text: Do not envy a violent man[a], and do not choose any of his ways.
translation:
  language: de
  text: Beneide keinen gewalttätigen Mann[a] und wähle keinen seiner Wege.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sei nicht eifersüchtig auf einen gewalttätigen Mann.“ Das hebräische Verb kann je nach Zusammenhang Neid oder Eifersucht ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Beneide nicht / Beneide keinen
  rationale: אַל mit dem Imperfekt formuliert ein Verbot. Im Deutschen ergibt die Verbindung mit dem Akkusativobjekt idiomatisch „Beneide keinen …“.
- source_word: בְּאִישׁ
  choice: Mann
  rationale: אִישׁ bezeichnet hier einen einzelnen Mann als exemplarischen Typus; die Präposition בְּ wird durch die deutsche Rektion von „beneiden“ nicht eigens wiedergegeben.
- source_word: חָמָס
  choice: gewalttätig
  rationale: חָמָס umfasst Gewalt, Unrecht und rücksichtslose Gewalttätigkeit. In der Verbindung אִישׁ חָמָס bezeichnet es einen von Gewalt geprägten Mann.
- source_word: וְאַל תִּבְחַר
  choice: und wähle nicht
  rationale: Die zweite verbietende Formulierung steht parallel zur ersten; „und“ bewahrt diese enge Verbindung.
- source_word: בְּכָל דְּרָכָיו
  choice: keinen seiner Wege
  rationale: Wörtlich steht „in allen/irgendwelchen seiner Wege“. Unter der Verneinung bringt „keinen seiner Wege“ den umfassenden Sinn natürlich zum Ausdruck und bewahrt die Wegmetapher für Lebensführung und Verhalten.
theological_decisions: []
translation_notes:
  register: Moderne, knappe und würdige Spruchsprache. Die maskuline Einzelfigur des hebräischen Textes und die Metapher der „Wege“ bleiben erhalten.
