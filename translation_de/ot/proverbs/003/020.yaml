source:
  edition: WLC
  text: בְּ֭/דַעְתּ/וֹ תְּהוֹמ֣וֹת נִבְקָ֑עוּ וּ֝/שְׁחָקִ֗ים יִרְעֲפוּ טָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/020.yaml
  text: By his knowledge the depths were split open[b][a], and the clouds drip dew.
translation:
  language: de
  text: Durch seine Erkenntnis brachen die Tiefen[a] auf, und die Wolken träufeln Tau herab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die tiefen Wasser«; auch: »die Urfluten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und die Himmel träufeln Tau herab«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַעְתּוֹ
  choice: Durch sein Wissen
  rationale: Die Präposition ב bezeichnet hier das Mittel, und דַּעַת bedeutet »Wissen« bzw. »Erkenntnis«. »Durch sein Wissen« gibt den instrumentalen Sinn natürlich und präzise wieder.
- source_word: תְּהוֹמוֹת
  choice: die Tiefen
  rationale: Der Plural bezeichnet die tiefen oder urzeitlichen Wassermassen. »Die Tiefen« bewahrt das kosmische Bild und klingt im modernen Deutsch würdig und verständlich.
- source_word: נִבְקָעוּ
  choice: wurden aufgebrochen
  rationale: Der Nifal drückt aus, dass die Tiefen gespalten beziehungsweise geöffnet wurden. »Wurden aufgebrochen« erhält die kraftvolle Bildsprache, ohne den Vorgang unnötig festzulegen.
- source_word: וּשְׁחָקִים
  choice: und die Wolken
  rationale: שְׁחָקִים kann die hohen Himmelsregionen oder die Wolken bezeichnen. Wegen des folgenden Träufelns von Tau ist »Wolken« im unmittelbaren Zusammenhang am anschaulichsten; die Alternative »Himmel« bleibt in der Fußnote erhalten.
- source_word: יִרְעֲפוּ
  choice: träufeln
  rationale: Das Verb bezeichnet sanftes Tropfen oder Herabträufeln. »Träufeln« passt zur feinen Feuchtigkeit des Taus und erhält den poetischen Charakter.
- source_word: טָל
  choice: Tau
  rationale: »Tau« ist die direkte und im Kontext eindeutige Wiedergabe.
theological_decisions:
- issue: Kosmische Bildsprache von Schöpfung und Vorsehung
  choice: Der Vers beschreibt Gottes Wissen als das Mittel, durch das die Welt geordnet wurde, und verwendet dazu Bilder der Tiefen und der tauenden Wolken.
  alternative: Die Aussage kann stärker auf Gottes fortdauernde Lenkung der Natur und des Wetters bezogen werden.
  rationale: Der Zusammenhang in Sprüche 3,19–20 weist auf die Ordnung der Schöpfung, schließt aber Gottes fortdauerndes Wirken nicht aus. Die Übersetzung bewahrt diese Spannung und legt keine technische Kosmologie fest.
translation_notes:
  register: Modernes Standarddeutsch in würdig-poetischem Register. Die Satzstruktur folgt der hebräischen Parallelität; »aufgebrochen« und »träufeln« bewahren die anschaulichen Verben des Ausgangstextes.
