  rationale: Die Revision verbessert die idiomatische deutsche Wiedergabe des Nifal und ergänzt bei „träufeln“ das im Deutschen natürliche „herab“. Sie erhält die hebräische Parallelität, die zeitliche Bildspannung zwischen dem Aufbrechen der Tiefen und dem fortdauernden Träufeln sowie die kosmische Mehrdeutigkeit des Verses.
