source:
  edition: WLC
  text: אַל תרוב עִם אָדָ֣ם חִנָּ֑ם אִם לֹ֖א גְמָלְ/ךָ֣ רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/030.yaml
  text: Do not contend with a man without cause[b][a], if he has done you no harm.
translation:
  language: de
  text: Streite nicht grundlos mit einem Menschen[a], wenn er dir nichts Böses getan hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mensch“ bezeichnet hier allgemein eine Person.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Fange keinen grundlosen Rechtsstreit mit einem Menschen an, wenn er dir kein Unrecht getan hat.“ Das hebräische Verb kann sowohl gewöhnlichen Streit als auch eine rechtliche Auseinandersetzung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: nicht
  rationale: אַל mit der Präfixkonjugation formuliert ein Verbot; im Deutschen wird dies natürlich mit dem Imperativ und „nicht“ wiedergegeben.
- source_word: תרוב
  choice: Streite
  rationale: ריב kann einen persönlichen Streit, eine Auseinandersetzung oder einen Rechtsstreit bezeichnen. „Streiten“ bewahrt hier die Breite besser als das engere „verklagen“.
- source_word: עִם
  choice: mit
  rationale: Die Präposition bedeutet gewöhnlich „mit“ und verbindet sich im Deutschen idiomatisch mit „streiten“.
- source_word: אָדָם
  choice: einem Menschen
  rationale: אָדָם bezeichnet hier in einem allgemein geltenden Weisheitsspruch eine einzelne Person. „Mensch“ gibt den generischen Bezug natürlich wieder, ohne das Hebräische auf einen erwachsenen Mann einzuengen.
- source_word: חִנָּם
  choice: grundlos
  rationale: חִנָּם bedeutet „ohne Grund/Anlass“. „Grundlos“ ist knapp, modern und bringt die ungerechtfertigte Auseinandersetzung zum Ausdruck.
- source_word: אִם לֹא
  choice: wenn ... nichts
  rationale: Die hebräische Bedingung wird formal als „wenn nicht“ ausgedrückt. In Verbindung mit רָעָה ist „wenn er dir nichts Böses getan hat“ natürliches Deutsch; möglich ist auch ein konditionales „es sei denn“.
- source_word: גְמָלְךָ
  choice: dir ... getan hat
  rationale: גמל bezeichnet ein Handeln oder Vergelten gegenüber jemandem. Mit רָעָה entspricht „jemandem Böses tun“ der deutschen Idiomatik.
- source_word: רָעָה
  choice: nichts Böses
  rationale: רָעָה kann Böses, Unrecht oder Schaden bedeuten. „Böses“ wahrt die ethische und mögliche konkrete Bedeutungsbreite.
theological_decisions:
- issue: Reichweite des Verbots
  choice: Das Verbot betrifft grundlosen Streit; die Bedingung wird nicht als Aufforderung zum Streit bei erlittenem Unrecht formuliert.
  alternative: „Streite nicht ..., es sei denn, er hat dir Böses getan.“
  rationale: Der hebräische Bedingungssatz lässt sich als Einschränkung lesen, legitimiert aber nicht ausdrücklich Vergeltung. Die gewählte Form bewahrt den Wortlaut, ohne eine zusätzliche Erlaubnis einzutragen.
translation_notes:
  register: Moderner, würdevoller Weisheitsstil. Der knappe Imperativ folgt der hebräischen Satzstruktur, während „grundlos“ und „nichts Böses getan“ natürliches Standarddeutsch bieten.
