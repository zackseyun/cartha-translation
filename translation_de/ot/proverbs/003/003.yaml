  text: חֶ֥סֶד וֶ/אֱמֶ֗ת אַֽל יַעַ֫זְבֻ֥/ךָ קָשְׁרֵ֥/ם עַל גַּרְגְּרוֹתֶ֑י/ךָ כָּ֝תְבֵ֗/ם עַל ל֥וּחַ לִבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/003.yaml
  text: Let steadfast love and faithfulness not forsake you[a]; bind them around your neck; write them on the tablet of your heart.
translation:
  language: de
  text: Lass beständige Liebe und Treue dich nicht verlassen.[a] Binde sie dir um den Hals; schreibe sie auf die Tafel deines Herzens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Güte und Wahrheit“. Das hebräische Wortpaar bezeichnet oft loyale Liebe und Verlässlichkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: Liebe
  rationale: חֶסֶד bezeichnet hier beständige, loyale und gütige Zuwendung. Im festen Wortpaar mit אֱמֶת gibt „Liebe“ den relationalen Kern natürlich wieder; die Fußnote weist auf die Bedeutungsbreite hin.
- source_word: אֱמֶת
  choice: Treue
  rationale: אֱמֶת meint in dieser Verbindung nicht nur abstrakte Wahrheit, sondern Verlässlichkeit und Beständigkeit. „Treue“ passt daher zum ethisch-relationalen Zusammenhang.
- source_word: אַל יַעַזְבֻךָ
  choice: sollen dich nicht verlassen
  rationale: Die Konstruktion mit אַל und Jussiv formuliert eine Mahnung. Diese Wiedergabe bewahrt Liebe und Treue als personifiziertes Subjekt und klingt im Deutschen natürlich.
- source_word: קָשְׁרֵם
  choice: Binde sie dir
  rationale: Der Imperativ bezeichnet ein bewusstes Festbinden und bewahrt das konkrete, metaphorische Bild.
- source_word: עַל גַּרְגְּרוֹתֶיךָ
  choice: um den Hals
  rationale: Obwohl das Substantiv den Hals- oder Kehlbereich bezeichnen kann, verlangt das Bild des Bindens im Deutschen idiomatisch „um den Hals“.
- source_word: כָּתְבֵם
  choice: schreibe sie
  rationale: Die direkte Wiedergabe setzt das Bild bewusster Verinnerlichung fort, ohne es erklärend aufzulösen.
- source_word: עַל לוּחַ לִבֶּךָ
  choice: auf die Tafel deines Herzens
  rationale: „Tafel“ bewahrt die konkrete Schreibfläche des hebräischen Bildes; „deines Herzens“ bezeichnet den inneren Menschen.
theological_decisions:
- issue: Wiedergabe des Wortpaars חֶסֶד וֶאֱמֶת
  choice: Liebe und Treue
  alternative: Güte und Wahrheit; beständige Liebe und Treue
  rationale: Das Wortpaar trägt relationale Bedeutungen von loyaler Zuwendung und Verlässlichkeit. „Liebe und Treue“ ist knapp, würdig und im heutigen Deutsch verständlich, ohne den Ausdruck auf eine bestimmte Bundestheologie festzulegen; die Fußnote bewahrt lexikalische Alternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelität der beiden Imperative und die Bilder von Hals und Herzen bleiben erhalten. Das traditionelle „Tafel des Herzens“ wird mit Artikel natürlich formuliert.
