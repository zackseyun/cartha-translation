  text: בְּ֭נִ/י תּוֹרָתִ֣/י אַל תִּשְׁכָּ֑ח וּ֝/מִצְוֺתַ֗/י יִצֹּ֥ר לִבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/001.yaml
  text: My son[a], do not forget my instruction[b], and let your heart keep my commandments.
translation:
  language: de
  text: Mein Sohn, vergiss meine Weisung[a] nicht, und bewahre meine Gebote[b] in deinem Herzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Unterweisung“. Das hebräische Wort Tora bezeichnet hier Weisung oder Unterweisung, nicht notwendig das Gesetz im engeren rechtlichen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hüte meine Gebote“. Das Verb bezeichnet ein sorgfältiges Bewahren oder Wachen über etwas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die maskuline Singularform mit Suffix der ersten Person ist eine direkte Anrede im Rahmen der väterlichen Weisheitsunterweisung und wird geschlechtsgenau wiedergegeben.
- source_word: תּוֹרָתִי
  choice: meine Weisung
  rationale: תּוֹרָה bezeichnet hier die richtunggebende Unterweisung des Weisheitslehrers, nicht notwendig das Gesetz im engeren Sinn. „Weisung“ wahrt sowohl den lehrenden als auch den verbindlichen Charakter.
- source_word: אַל תִּשְׁכָּח
  choice: vergiss … nicht
  rationale: Die negative Jussivkonstruktion formuliert ein Verbot beziehungsweise eine eindringliche Aufforderung; diese Wortstellung ist im Deutschen natürlich und bewahrt ihre Kraft.
- source_word: וּמִצְוֺתַי
  choice: meine Gebote
  rationale: מִצְוֺת bezeichnet verbindliche Anordnungen. „Gebote“ erhält deren autoritatives Gewicht und passt zum weisheitlichen Kontext.
- source_word: יִצֹּר
  choice: bewahre
  rationale: נצר bedeutet sorgfältig hüten oder bewahren. „Bewahre“ bringt den Gedanken achtsamer innerer Verwahrung deutlicher zum Ausdruck als das allgemeinere „halte“.
- source_word: לִבֶּךָ
  choice: dein Herz
  rationale: Das Herz ist im Hebräischen das Zentrum von Denken, Wollen und Empfinden. Die konkrete Formulierung bleibt erhalten, ohne sie auf „Verstand“ zu verengen.
theological_decisions:
- issue: Geschlechtsspezifische Anrede in der Weisheitsunterweisung
  choice: Die maskuline Singularanrede wird als „Mein Sohn“ beibehalten.
  alternative: Mein Kind
  rationale: Der hebräische Text spricht ausdrücklich einen Sohn an und entspricht der literarischen Form väterlicher Weisheitsunterweisung. Eine Neutralisierung würde ein Merkmal des Ausgangstextes beseitigen.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: „Weisung“ als Unterweisung mit verbindlichem Anspruch
  alternative: „Gesetz“ oder „Lehre“
  rationale: Der unmittelbare Zusammenhang ist die Unterweisung durch den Weisheitslehrer. „Gesetz“ könnte den Ausdruck vorschnell auf das mosaische Gesetz verengen, während „Lehre“ den richtunggebenden Anspruch weniger deutlich ausdrückt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und das Bild des bewahrenden Herzens bleiben erhalten; „Weisung“ vermeidet eine unnötige Verengung von תּוֹרָה.
