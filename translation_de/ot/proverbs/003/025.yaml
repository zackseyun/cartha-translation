- from: Fürchte dich nicht vor plötzlichem Schrecken und nicht vor der Verwüstung durch Gottlose, wenn sie kommt.[a]
  to: Fürchte dich nicht vor plötzlichem Schrecken und vor der Verwüstung der Gottlosen,[a] wenn sie kommt.
