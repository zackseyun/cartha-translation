  text: אַל תִּ֭ירָא מִ/פַּ֣חַד פִּתְאֹ֑ם וּ/מִ/שֹּׁאַ֥ת רְ֝שָׁעִ֗ים כִּ֣י תָבֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/025.yaml
  text: Do not fear sudden terror[a], or the ruin of the wicked when it comes[b],
translation:
  language: de
  text: Fürchte dich nicht vor plötzlichem Schrecken und vor der Verwüstung der Gottlosen,[a] wenn sie kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung »Verwüstung der Gottlosen« lässt offen, ob die Gottlosen die Verwüstung verursachen oder von ihr betroffen sind. Für »Verwüstung« sind auch »Zerstörung« oder »Unheil« möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: Die Negationspartikel mit der Verbform von ירא drückt ein Verbot aus; die reflexive deutsche Wendung ist natürlich und bewahrt die knappe Aufforderung.
- source_word: מִפַּחַד פִּתְאֹם
  choice: vor plötzlichem Schrecken
  rationale: Nach ירא bezeichnet מן den Gegenstand der Furcht. פַּחַד meint Schrecken oder Grauen, und פִּתְאֹם kennzeichnet ihn als plötzlich beziehungsweise unerwartet.
- source_word: וּמִשֹּׁאַת
  choice: und nicht vor der Verwüstung
  rationale: Das zweite מן setzt die Konstruktion mit dem negierten Verb fort. שֹׁאָה bezeichnet verheerendes Unheil, Verwüstung oder Zerstörung; »Verwüstung« gibt die starke Bedeutung in natürlichem Deutsch wieder.
- source_word: רְשָׁעִים
  choice: durch Gottlose
  rationale: Die kompakte Genitivverbindung lässt offen, wie die Gottlosen zur Verwüstung stehen. »Durch Gottlose« gibt eine mögliche, im Kontext gut verständliche Beziehung wieder, während die Fußnote die andere wesentliche Deutung ausdrücklich festhält.
- source_word: כִּי תָבֹא
  choice: wenn sie kommt
  rationale: כִּי ist hier am besten temporal zu verstehen. Das feminine Verb bezieht sich auf שֹׁאָה; das deutsche Pronomen »sie« nimmt entsprechend »Verwüstung« auf.
theological_decisions:
- issue: Beziehung zwischen der Verwüstung und den Gottlosen
  choice: Verwüstung durch Gottlose
  alternative: Verwüstung, die über Gottlose kommt
  rationale: Der hebräische Constructus שֹׁאַת רְשָׁעִים bestimmt die Beziehung nicht ausdrücklich. Der Haupttext muss im Deutschen eine Verbindung formulieren; die Fußnote bewahrt die echte syntaktische und theologische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Formulierung »vor … und nicht vor …« macht den Geltungsbereich des Verbots deutlich. Die echte Mehrdeutigkeit der knappen hebräischen Genitivverbindung wird im Haupttext lesbar wiedergegeben und in der Fußnote bewahrt.
