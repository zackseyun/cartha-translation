  verdict: revise
  source_fidelity: Der Entwurf gibt die Aufforderung, den plötzlichen Schrecken, die zeitliche Wendung »wenn sie kommt« sowie die feminine Rückbeziehung auf »Verwüstung« zutreffend wieder. Die Wiedergabe »durch Gottlose« legt jedoch im Haupttext fest, dass die Gottlosen Verursacher der Verwüstung sind. Der hebräische Constructus שֹׁאַת רְשָׁעִים bestimmt diese Beziehung nicht eindeutig; die Fußnote kann eine im Haupttext bereits getroffene Festlegung nicht vollständig neutralisieren.
  naturalness: »Fürchte dich nicht vor plötzlichem Schrecken« ist natürliches, würdiges modernes Standarddeutsch. »Verwüstung der Gottlosen« ist als knappe, quellennähere Genitivverbindung verständlich; die notwendige Erläuterung der Mehrdeutigkeit gehört in eine Fußnote.
  terminology: »Schrecken« entspricht פַּחַד, »Verwüstung« ist eine tragfähige Wiedergabe von שֹׁאָה, und »Gottlose« entspricht רְשָׁעִים. Die relationale Mehrdeutigkeit von שֹׁאַת רְשָׁעִים muss im deutschen Haupttext offen bleiben.
