  text: כָּ֭בוֹד חֲכָמִ֣ים יִנְחָ֑לוּ וּ֝/כְסִילִ֗ים מֵרִ֥ים קָלֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/035.yaml
  text: The wise will inherit honor, but fools lift up disgrace.
translation:
  language: de
  text: Die Weisen werden Ehre erben, doch Toren heben Schande empor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּבוֹד
  choice: Ehre
  rationale: Bezeichnet hier gesellschaftliches Ansehen bzw. Würde; „Ehre“ gibt den Gegensatz zu „Schande“ klar und idiomatisch wieder.
- source_word: חֲכָמִים
  choice: die Weisen
  rationale: Die substantivierte Bezeichnung meint Menschen, die Weisheit besitzen und entsprechend handeln.
- source_word: יִנְחָלוּ
  choice: werden … erben
  rationale: Bewahrt das Bild des Erlangens eines Erbteils und den zukunftsbezogenen bzw. folgernden Sinn der Verbform.
- source_word: כְסִילִים
  choice: Toren
  rationale: Gibt die im Sprüchebuch moralisch geprägte Unvernunft wieder; „Toren“ ist würdevoll und stärker als bloß „Dumme“.
- source_word: מֵרִים קָלוֹן
  choice: heben Schande empor
  rationale: Folgt der überlieferten Konsonanten- und Vokalgestalt eng und bewahrt das auffällige Bild, ohne es zu „ernten“, „tragen“ oder „davontragen“ umzudeuten.
theological_decisions:
- issue: Aussage über das Tun bzw. Ergehen der Toren
  choice: „Toren heben Schande empor“
  alternative: „Toren tragen Schande davon“ oder „Schande erhöht die Toren“
  rationale: Der masoretische Text ist grammatisch auffällig, da מֵרִים formal singularisch ist, während „Toren“ im Plural steht. Die gewählte Fassung folgt der traditionellen Satzgliederung und dem erkennbaren Verb „emporheben“, ohne die Spannung durch eine Konjektur oder eine stärker deutende Zielformulierung aufzulösen.
translation_notes:
  register: Modernes, knappes und würdevolles Sprichwortdeutsch. Der Parallelismus und die Bildsprache des Hebräischen bleiben erhalten; „Toren“ entspricht dem weisheitlichen Register.
