id: PRO.3.12
reference: Proverbs 3:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י אֶ֥ת אֲשֶׁ֣ר יֶאֱהַ֣ב יְהוָ֣ה יוֹכִ֑יחַ וּ֝/כְ/אָ֗ב אֶת בֵּ֥ן יִרְצֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/012.yaml
  text: For Yahweh reproves the one he loves[b][a], as a father the son in whom he delights.
translation:
  language: de
  text: Denn wen Jahwe liebt, den weist er zurecht[a], wie ein Vater den Sohn, an dem er Freude hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „korrigiert“ oder „tadelt“. Das hebräische Verb bezeichnet besonders Zurechtweisung oder Korrektur; im Zusammenhang gehört dies zum umfassenderen Gedanken der Erziehung durch Jahwe.'
    reason: lexikalische Alternative
  - marker: b
    text: 'Auch möglich: „und wie ein Vater einen Sohn, dem er wohlgesinnt ist“. Die knappe hebräische Formulierung kann Wohlgefallen, Freude oder begünstigende Zuwendung ausdrücken.'
    reason: alternative Lesart
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorangehende Mahnung; „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: אֶת אֲשֶׁר יֶאֱהַב
  choice: wen … liebt
  rationale: Die deutsche Korrelativkonstruktion „wen …, den …“ gibt den persönlichen Singular und die Objektfunktion der hebräischen Relativkonstruktion klar und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יוֹכִיחַ
  choice: weist … zurecht
  rationale: Das Hifil von יכח bezeichnet hier tadelndes Zurechtweisen oder Korrigieren. „Zurechtweisen“ bewahrt diesen engeren Sinn, während der Zusammenhang von Erziehung beziehungsweise Zucht in den Nachbarversen bestehen bleibt.
- source_word: וּכְאָב
  choice: wie ein Vater
  rationale: Die Präposition כ kennzeichnet den Vergleich. Das vorangestellte ו kann im Deutschen in dieser elliptischen Vergleichskonstruktion unausgedrückt bleiben, ohne den Sinn zu verändern.
- source_word: בֵּן
  choice: den Sohn
  rationale: Die ausdrücklich männliche Vater-Sohn-Bildsprache des Hebräischen bleibt erhalten; ein Besitzpronomen steht im Ausgangstext nicht.
- source_word: יִרְצֶה
  choice: an dem er Freude hat
  rationale: רצה bezeichnet hier wohlwollendes Gefallen beziehungsweise Gunst. Die Formulierung drückt die positive Zuneigung aus und lässt zugleich die mögliche Nuance des Begünstigens offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als Gottes Eigennamen. „Jahwe“ macht dies transparent, ohne den Namen durch einen Hoheitstitel zu ersetzen.
- issue: Geschlechtsspezifische Eltern-Kind-Bildsprache
  choice: wie ein Vater den Sohn
  alternative: wie Eltern ihr Kind
  rationale: Der Ausgangstext nennt ausdrücklich Vater und Sohn. Die Übersetzung bewahrt dieses konkrete Bild, ohne es zu verallgemeinern.
- issue: Art des göttlichen erzieherischen Handelns
  choice: weist … zurecht
  alternative: züchtigt / erzieht
  rationale: Das Verb selbst hebt Zurechtweisung oder Korrektur hervor. Die breitere Vorstellung göttlicher Erziehung ist im Kontext vorhanden, soll aber nicht vollständig in dieses einzelne Verb hineingelesen werden.
- issue: Beziehung zwischen Zurechtweisung und väterlichem Wohlgefallen
  choice: wie ein Vater den Sohn, an dem er Freude hat
  alternative: und wie ein Vater einen Sohn, dem er wohlgesinnt ist
  rationale: Die knappe hebräische Vergleichskonstruktion lässt das Verb „zurechtweisen“ im zweiten Glied unausgesprochen und kann hinsichtlich רצה als Freude, Wohlgefallen oder Gunst verstanden werden. Die Hauptfassung wahrt den Vergleich und die liebevolle Spannung zwischen Korrektur und Wohlgefallen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die korrelative Form „wen …, den …“ ist allgemein verständlich und bildet die hebräische Objektkonstruktion natürlich ab. Die konkrete Vater-Sohn-Metaphorik und die positive Spannung zwischen Liebe, Zurechtweisung und Wohlgefallen bleiben erhalten.
