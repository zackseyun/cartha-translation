  text: אַל תֹּ֘אמַ֤ר ל/רעי/ך לֵ֣ךְ וָ֭/שׁוּב וּ/מָחָ֥ר אֶתֵּ֗ן וְ/יֵ֣שׁ אִתָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/028.yaml
  text: Do not say to your neighbor[a], “Go, and come back[b], and tomorrow I will give,” when you have it with you.
translation:
  language: de
  text: 'Sag nicht zu deinem Nächsten: „Geh und komm wieder[a]; morgen gebe ich es dir“, obwohl du es bei dir hast.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kehr zurück“.'
    reason: lexical_alternative
  - marker: b
    text: Der letzte Satzteil besagt, dass der Angesprochene bereits geben kann und die Hilfe deshalb nicht aufschieben soll.
    reason: cultural_note
lexical_decisions:
- source_word: רֵעַ
  choice: Nächster
  rationale: Das Wort bezeichnet hier einen Menschen aus dem sozialen Umfeld, nicht zwingend einen engen Freund. „Nächster“ bewahrt die ethische Weite und klingt in einem Weisheitsspruch natürlich und würdig.
- source_word: לֵךְ
  choice: Geh
  rationale: Der schlichte Imperativ wird direkt und ohne zusätzliche Verstärkung wiedergegeben.
- source_word: שׁוּב
  choice: komm wieder
  rationale: In direkter Rede ist „komm wieder“ im modernen Deutschen natürlicher als das förmlichere „kehr zurück“.
- source_word: מָחָר
  choice: morgen
  rationale: Das gewöhnliche Zeitadverb lässt sich unmittelbar mit „morgen“ wiedergeben.
- source_word: אֶתֵּן
  choice: gebe ich es dir
  rationale: „Geben“ entspricht dem hebräischen Verb. Das im Hebräischen aus dem Zusammenhang erschlossene Objekt und der Empfänger werden im Deutschen pronominal ausgedrückt, damit die direkte Rede natürlich und vollständig klingt.
- source_word: יֵשׁ אִתָּךְ
  choice: wenn du es bei dir hast
  rationale: Die Formulierung bewahrt das Bild, dass das Benötigte bereits bei der angesprochenen Person vorhanden und verfügbar ist, ohne es enger als „in deiner Hand“ zu deuten.
- source_word: אַל
  choice: Sag nicht
  rationale: Die hebräische Verneinung formuliert ein Verbot; „Sag nicht“ gibt dieses ohne zusätzliche Verstärkung wieder.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit der knappen, mahnenden Form eines Weisheitsspruchs. „Nächster“ ist würdig und ethisch weit, ohne den Bezug auf einen engen Freund zu verengen.
