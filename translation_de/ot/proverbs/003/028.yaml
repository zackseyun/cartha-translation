  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: רֵעַ mit „Nächster“, die beiden Imperative, die Ankündigung für morgen und die gegenwärtige Verfügbarkeit des zu Gebenden. Das im Hebräischen unausgedrückte Objekt darf im Deutschen zur grammatischen und dialogischen Verständlichkeit mit „es“ aufgenommen werden. Die einleitende Konjunktion vor וְיֵשׁ אִתָּךְ trägt jedoch hier einen deutlich adversativen/konzessiven Sinn: Das Aufschieben wird gerade trotz der vorhandenen Mittel getadelt. „Wenn“ kann dies zu sehr als bloße Bedingung auffassen.'
