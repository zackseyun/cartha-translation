  terminology: „Nächster“ ist für רֵעַ in diesem weisheitlichen Ethikkontext eine geeignete, traditionsbewusste und dennoch verständliche Wahl; es legt keine intime Freundschaft nahe. Es sind keine besonderen theologischen Fachbegriffe betroffen.
