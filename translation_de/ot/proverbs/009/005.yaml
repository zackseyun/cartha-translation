  variant: modern standard German
source:
  edition: WLC
  text: לְ֭כוּ לַחֲמ֣וּ בְֽ/לַחֲמִ֑/י וּ֝/שְׁת֗וּ בְּ/יַ֣יִן מָסָֽכְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/005.yaml
  text: Come[a], eat of my bread[b], and drink of the wine I have mixed.
translation:
  language: de
  text: Kommt[a], esst von meinem Brot und trinkt von dem Wein, den ich gemischt habe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geht, esst von meinem Brot.“ Das hebräische Verb bedeutet wörtlich „geht“, wirkt hier im Zusammenhang der Einladung jedoch wie der Zuruf „Kommt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den ich zubereitet habe“. Gemeint ist gemischter Wein, wahrscheinlich mit Wasser oder Gewürzen zubereitet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Kommt
  rationale: Das Verb bedeutet wörtlich „geht“, dient im Kontext der Einladung aber als auffordernder Zuruf. „Kommt“ gibt diese pragmatische Funktion im Deutschen natürlich wieder; die wörtliche Alternative wird in der Fußnote bewahrt.
- source_word: לַחֲמוּ
  choice: esst
  rationale: Das von לחם II abgeleitete Verb bedeutet hier im Parallelismus zu „trinkt“ eindeutig „essen“.
- source_word: בְלַחֲמִי
  choice: von meinem Brot
  rationale: Die Präposition ב bezeichnet hier die Teilhabe an der angebotenen Speise. „Von meinem Brot“ bewahrt diesen partitivischen Zug und klingt im Deutschen natürlich.
- source_word: וּשְׁתוּ
  choice: und trinkt
  rationale: Der koordinierte Imperativ wird schlicht wiedergegeben und erhält den poetischen Parallelismus.
- source_word: בְּיַיִן
  choice: von dem Wein
  rationale: Die Präposition wird wie in der ersten Vershälfte partitivisch wiedergegeben; so bleibt die formale und poetische Entsprechung zwischen Essen und Trinken sichtbar.
- source_word: מָסָכְתִּי
  choice: den ich gemischt habe
  rationale: Das Verb bezeichnet das Mischen beziehungsweise Zubereiten von Wein, vermutlich mit Wasser oder Gewürzen. „Gemischt“ ist die präziseste Wiedergabe, ohne die Art der Beimischung festzulegen.
theological_decisions:
- issue: Bedeutung des von der Weisheit angebotenen Mahls
  choice: Das konkrete Bild von Brot und gemischtem Wein bleibt ohne allegorische Ausdeutung stehen.
  alternative: Das Mahl ausdrücklich sakramental oder allgemein als Belehrung deuten.
  rationale: Der hebräische Text schildert die personifizierte Weisheit, die zu einem bereiteten Mahl einlädt. Weitergehende theologische Bezüge sind möglich, werden jedoch vom Vers nicht ausdrücklich festgelegt und daher nicht in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Einladungsstil. Die parallele Struktur „esst … und trinkt …“ sowie die konkrete Mahlbildsprache bleiben erhalten.
