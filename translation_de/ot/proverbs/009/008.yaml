source:
  edition: WLC
  text: אַל תּ֣וֹכַח לֵ֭ץ פֶּן יִשְׂנָאֶ֑/ךָּ הוֹכַ֥ח לְ֝/חָכָ֗ם וְ/יֶאֱהָבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/008.yaml
  text: Do not rebuke a scoffer[a], lest he hate you; rebuke a wise man[b], and he will love you.
translation:
  language: de
  text: Weise einen Spötter nicht zurecht, sonst wird er dich hassen; weise einen Weisen[a] zurecht, und er wird dich lieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »einen Weisen«; der maskuline Singular steht in den Sprüchen stellvertretend für einen weisen Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: nicht
  rationale: אַל mit der Verbform drückt ein Verbot aus; die deutsche Imperativkonstruktion mit »nicht« gibt dies natürlich und ohne zusätzliche Verstärkung wieder.
- source_word: תּוֹכַח / הוֹכַח (יכח)
  choice: weise … zurecht
  rationale: יכח bezeichnet hier tadelnde oder korrigierende Zurechtweisung. »Zurechtweisen« bewahrt die deutliche, verbale Konfrontation und funktioniert idiomatisch in beiden parallelen Satzhälften.
- source_word: לֵץ
  choice: Spötter
  rationale: לֵץ bezeichnet in den Sprüchen einen Menschen, dessen Haltung von hochmütigem, abweisendem Spott geprägt ist. »Spötter« ist die natürliche deutsche Entsprechung und meint mehr als gelegentliches Spotten.
- source_word: פֶּן
  choice: sonst
  rationale: פֶּן leitet eine befürchtete Folge ein, die vermieden werden soll. »Sonst« gibt diesen warnenden Folgezusammenhang im modernen Deutschen knapp wieder.
- source_word: יִשְׂנָאֶךָּ
  choice: wird er dich hassen
  rationale: Die Imperfektform nach פֶּן bezeichnet die zu erwartende negative Folge; im Deutschen wird dies natürlich mit Futur wiedergegeben.
- source_word: לְחָכָם
  choice: einen Weisen
  rationale: Das Hebräische hat ein maskulines substantiviertes Adjektiv im Singular und zeichnet einen repräsentativen Typus. »Einen Weisen« bewahrt Form und Weisheitssprache, ohne das zusätzliche Substantiv »Mann« einzuführen.
- source_word: וְיֶאֱהָבֶךָּ
  choice: und er wird dich lieben
  rationale: Die Imperfektform bezeichnet die erwartete Folge der Zurechtweisung; das deutsche Futur bildet diesen Zusammenhang klar ab.
theological_decisions:
- issue: Maskuliner Singular in der Weisheitsunterweisung
  choice: einen Weisen[a]
  alternative: einen weisen Menschen / die Weisen
  rationale: Der maskuline Singular des Hebräischen bleibt als repräsentative Typenbezeichnung sichtbar. Eine Fußnote erklärt seine allgemeine Reichweite, ohne die grammatische Form im Haupttext einzuebnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer antithetischer Parallelstruktur. Die Wiederholung von »weise … zurecht« bildet das wiederholte hebräische Verb ab; »sonst« vermeidet das heute gehobene oder altertümlich wirkende »damit nicht« beziehungsweise »auf dass nicht«.
