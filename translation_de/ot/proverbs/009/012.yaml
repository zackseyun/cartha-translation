source:
  edition: WLC
  text: אִם חָ֭כַמְתָּ חָכַ֣מְתָּ לָּ֑/ךְ וְ֝/לַ֗צְתָּ לְֽ/בַדְּ/ךָ֥ תִשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/012.yaml
  text: If you are wise[a], you are wise for yourself; if you scoff, you alone will bear it.
translation:
  language: de
  text: Wenn du weise bist, bist du weise zu deinem eigenen Nutzen; wenn du spottest, wirst du es allein tragen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wirst du die Folgen allein tragen“. Im Hebräischen steht nur „wirst du tragen“; was getragen wird, bleibt unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet einen Bedingungssatz ein und bewahrt die konditionale Aussage des hebräischen Weisheitsspruchs.
- source_word: חָכַמְתָּ ... חָכַמְתָּ לָּךְ
  choice: du weise bist, bist du weise zu deinem eigenen Nutzen
  rationale: Die Wiederholung von חכם bleibt zur Hervorhebung erhalten. לָךְ bezeichnet hier idiomatisch den persönlichen Nutzen; die explizite Wiedergabe vermeidet im Deutschen die missverständliche Formulierung „für dich selbst weise“.
- source_word: וְלַצְתָּ
  choice: wenn du spottest
  rationale: Das Verb לוץ bezeichnet in den Sprüchen hochmütiges, verächtliches Spotten. Die verbale Form des Ausgangstextes bleibt erhalten.
- source_word: לְבַדְּךָ
  choice: allein
  rationale: Gibt die ausschließliche persönliche Verantwortung natürlich und betont wieder.
- source_word: תִשָּׂא
  choice: wirst du es tragen
  rationale: נשא bedeutet hier „tragen“. Das im Hebräischen unausgesprochene Objekt wird durch „es“ grammatisch ergänzt, ohne die Art der Last ausdrücklich festzulegen.
theological_decisions:
- issue: Persönliche Folge von Weisheit beziehungsweise Spott
  choice: Die Gegenüberstellung von persönlichem Nutzen und allein zu tragender Last wird bewahrt.
  alternative: Die Last ausdrücklich als Strafe oder Folgen des Spottes bestimmen.
  rationale: Der hebräische Text lässt das Objekt von תִשָּׂא unausgesprochen; eine genauere theologische Bestimmung würde die genuine Offenheit des Satzes einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Wiederholung von „weise“ und die knappe Antithese des hebräischen Spruchs bleiben erhalten; „zu deinem eigenen Nutzen“ gibt den Sinn von לָךְ verständlich wieder.
