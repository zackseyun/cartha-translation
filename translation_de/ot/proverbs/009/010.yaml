id: PRO.9.10
reference: Proverbs 9:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תְּחִלַּ֣ת חָ֭כְמָה יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/010.yaml
  text: The beginning of wisdom is the fear of Yahweh[a], and the knowledge of the Holy One is understanding.
translation:
  language: de
  text: Der Anfang der Weisheit ist die Furcht vor Jahwe, und Erkenntnis des Heiligen[a] ist Einsicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort steht im Plural und kann wörtlich „Heilige“ bedeuten. Wegen des Parallelismus mit „Jahwe“ wird es hier meist auf Gott bezogen und daher mit „des Heiligen“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּחִלַּת
  choice: Der Anfang
  rationale: Die Konstruktform bezeichnet hier am natürlichsten den Anfang oder Ausgangspunkt; die Formulierung bewahrt zugleich den möglichen Gedanken einer Grundlage, ohne ihn ausdrücklich einzutragen.
- source_word: חָכְמָה
  choice: der Weisheit
  rationale: „Weisheit“ ist in den Sprüchen die angemessene Leitbezeichnung für moralische, geistliche und praktische Lebensklugheit.
- source_word: יִרְאַת
  choice: die Furcht vor
  rationale: „Furcht“ bewahrt die Spannung zwischen ehrfürchtigem Respekt und wirklicher Gottesfurcht besser als die engeren Wiedergaben „Ehrfurcht“ oder „Scheu“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens erhält den Namen, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: וְדַעַת
  choice: und Erkenntnis
  rationale: Die nominale Formulierung entspricht dem hebräischen Parallelismus; „Erkenntnis“ bezeichnet hier nicht bloß Faktenwissen, sondern ein wirkliches Erkennen.
- source_word: קְדֹשִׁים
  choice: des Heiligen
  rationale: Obwohl die Form grammatisch Plural ist, spricht der Parallelismus mit „Jahwe“ stark für Gott als singularischen Bezug. Die formale Mehrzahl bleibt in der Fußnote sichtbar.
- source_word: בִּינָה
  choice: ist Einsicht
  rationale: „Einsicht“ gibt die in den Sprüchen gemeinte Fähigkeit zu verständigem Unterscheiden prägnant wieder und erhält die nominale Gleichsetzung.
theological_decisions:
- issue: Bezug von קְדֹשִׁים
  choice: 'Singularischer Gottesbezug: „des Heiligen“'
  alternative: 'Pluralischer Bezug: „der Heiligen“ beziehungsweise „heiliger Wesen“'
  rationale: Der synonyme Parallelismus setzt die Erkenntnis des mit Jahwe verbundenen Heiligen der Furcht vor Jahwe an die Seite und legt damit einen Gottesbezug nahe. Da die hebräische Wortform tatsächlich im Plural steht, wird diese Spannung durch eine Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe zweiteilige Satzstruktur und der nominale Parallelismus des Hebräischen bleiben erhalten; „Jahwe“ gibt den Gottesnamen in der im Deutschen üblichen Form wieder.
