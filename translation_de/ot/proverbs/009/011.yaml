  text: כִּי בִ֭/י יִרְבּ֣וּ יָמֶ֑י/ךָ וְ/יוֹסִ֥יפוּ לְּ֝/ךָ֗ שְׁנ֣וֹת חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/011.yaml
  text: For by me your days will be multiplied[a], and years of life will be added to you.
translation:
  language: de
  text: Denn durch mich[a] mehren sich deine Tage, und Lebensjahre werden dir hinzugefügt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch „in mir“; die hebräische Präposition kann hier mehrere eng verwandte Bedeutungen haben. Im Zusammenhang liegt „durch mich“ nahe: Die Weisheit ist das Mittel, durch das das Leben verlängert wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung ein und entspricht dem erklärenden Fluss des Spruches.
- source_word: בִי
  choice: durch mich
  rationale: 'Die Präposition ב mit dem Suffix der 1. Person Singular bezeichnet hier im Zusammenhang am ehesten das Mittel: Die personifizierte Weisheit ist es, durch die das Leben verlängert wird. Die mögliche Mehrdeutigkeit wird in der Fußnote bewahrt.'
- source_word: יִרְבּוּ
  choice: mehren sich
  rationale: Das Verb רבה bedeutet „zahlreich werden, zunehmen“. Mit „deine Tage“ als Subjekt gibt „mehren sich“ das hebräische Bild knapp und natürlich wieder.
- source_word: יָמֶיךָ
  choice: deine Tage
  rationale: Die wörtliche Wendung bezeichnet die Lebensdauer und ist auch im Deutschen verständlich und idiomatisch.
- source_word: וְיוֹסִיפוּ
  choice: werden hinzugefügt
  rationale: Die passive deutsche Form bildet den Ergebnissinn der Hifil-Konstruktion mit לְךָ angemessen ab und vermeidet ein unbestimmtes handelndes Subjekt.
- source_word: לְךָ
  choice: dir
  rationale: Der Dativ bezeichnet die Person, der die zusätzlichen Jahre zukommen.
- source_word: שְׁנוֹת חַיִּים
  choice: Lebensjahre
  rationale: Das deutsche Kompositum gibt die Genitivverbindung „Jahre des Lebens“ präzise, knapp und natürlich wieder.
theological_decisions: []
