  variant: modern standard German
source:
  edition: WLC
  text: לִ/קְרֹ֥א לְ/עֹֽבְרֵי דָ֑רֶךְ הַֽ֝/מְיַשְּׁרִ֗ים אֹֽרְחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/015.yaml
  text: 'to call to those passing by on the road[a], who are going straight on their paths:'
translation:
  language: de
  text: 'um denen zuzurufen, die auf dem Weg vorübergehen und auf ihren Pfaden geradeaus gehen[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ihre Pfade gerade machen« beziehungsweise »gerade halten«. Das hebräische Partizip kann entweder das Geradeausgehen oder das Gerademachen und Geradhalten des eigenen Weges betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרֹא
  choice: zuzurufen
  rationale: Der Infinitiv bezeichnet im Satzzusammenhang den Zweck. »Zuzurufen« gibt den öffentlichen, vernehmbaren Ruf der Frau natürlich wieder.
- source_word: לְעֹבְרֵי דָרֶךְ
  choice: denen, die auf dem Weg vorübergehen
  rationale: Die Form bezeichnet Menschen, die unterwegs vorbeigehen; die Wiedergabe bewahrt sowohl den verbalen Charakter als auch das konkrete Wegmotiv.
- source_word: דָרֶךְ
  choice: Weg
  rationale: Hier ist die von den Vorübergehenden benutzte Strecke gemeint. »Weg« ist im Deutschen natürlich und lässt zugleich die Bildsprache der Weisheitsliteratur anklingen.
- source_word: הַמְיַשְּׁרִים
  choice: geradeaus gehen
  rationale: Das Partizip von ישר kann das Geradeausgehen oder das Gerademachen beziehungsweise Geradhalten des eigenen Weges bezeichnen. Der Haupttext gibt den unmittelbaren Reisevorgang wieder; die kausative Lesart bleibt in der Fußnote erhalten.
- source_word: אֹרְחוֹתָם
  choice: auf ihren Pfaden
  rationale: אֹרַח bezeichnet einen Pfad oder Lebensweg. »Pfade« erhält das Reisebild und ermöglicht zugleich den in der Weisheitsliteratur mitschwingenden übertragenen Sinn.
theological_decisions:
- issue: Möglicher moralischer Nebensinn des geraden Weges
  choice: Die Formulierung bleibt bildhaft und wird nicht ausdrücklich moralisch gedeutet.
  alternative: »die rechtschaffen leben«
  rationale: Der unmittelbare Kontext beschreibt Vorübergehende auf ihren Wegen; eine explizite moralische Deutung würde die echte Spannung zwischen räumlicher und übertragener Bedeutung voreilig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als abhängiger Satzteil mit Doppelpunkt gestaltet, entsprechend seinem Zusammenhang. Das verbindende »und« macht die aufeinander bezogenen Partizipialgruppen im Deutschen flüssig, ohne den Sinn zu erweitern.
