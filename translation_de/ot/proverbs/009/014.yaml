source:
  edition: WLC
  text: וְֽ֭/יָשְׁבָה לְ/פֶ֣תַח בֵּיתָ֑/הּ עַל כִּ֝סֵּ֗א מְרֹ֣מֵי קָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/014.yaml
  text: and sits at the doorway of her house[a], on a seat at the heights of the city,
translation:
  language: de
  text: Sie sitzt am Eingang ihres Hauses, auf einem Sitz auf den Anhöhen der Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf einem Thron an den hoch gelegenen Orten der Stadt«. Das hebräische Wort für »Sitz« kann auch einen Thron bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבָה
  choice: Sie sitzt
  rationale: Das Qal Perfekt 3. Person feminin Singular beschreibt im poetischen Zusammenhang anschaulich eine gegenwärtige, fortdauernde Szene; deutsches Präsens gibt dies natürlich wieder.
- source_word: לְפֶתַח
  choice: am Eingang
  rationale: פֶּתַח bezeichnet eine Öffnung oder einen Eingang. »Am Eingang« ist im modernen Deutschen natürlich und bewahrt das konkrete Ortsbild.
- source_word: בֵּיתָהּ
  choice: ihres Hauses
  rationale: בַּיִת bezeichnet hier den konkreten Aufenthaltsort; »Haus« ist daher genauer als das emotionaler gefärbte »Zuhause«.
- source_word: עַל כִּסֵּא
  choice: auf einem Sitz
  rationale: כִּסֵּא kann Sitz, Stuhl oder Thron bedeuten. Da der unmittelbare Zusammenhang keine königliche Deutung verlangt, bleibt die neutralere Bedeutung »Sitz« im Haupttext erhalten.
- source_word: מְרֹמֵי קָרֶת
  choice: hoch über der Stadt
  rationale: Die constructus-Verbindung bezeichnet die Höhen beziehungsweise hoch gelegenen Orte der Stadt. Die Formulierung ist natürlich, wahrt die räumliche Erhöhung und vermeidet die im Deutschen kultisch missverständliche Wendung »Höhen der Stadt«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz setzt die personifizierte Torheit aus dem Zusammenhang als Subjekt fort. Die Schlussformulierung wird idiomatisch wiedergegeben, ohne die mögliche Thron-Bedeutung von כִּסֵּא zu verschweigen.
