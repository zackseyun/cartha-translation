  text: Stolen water is sweet[a], and bread of secrecy is pleasant.
translation:
  language: de
  text: Gestohlenes Wasser schmeckt süß, und Brot im Verborgenen[a] schmeckt gut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Brot der Verborgenheiten«; auch möglich: »Brot an verborgenen Orten«. Der knappe hebräische Ausdruck kann sich auf verborgenes oder heimlich verzehrtes Brot beziehen, ohne dies näher zu bestimmen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: מַיִם
  choice: Wasser
  rationale: Das morphologisch plurale Substantiv wird im Hebräischen häufig als Stoffbezeichnung gebraucht; im Deutschen ist daher der Singular »Wasser« natürlich.
- source_word: גְּנוּבִים
  choice: gestohlenes
  rationale: Das passive Partizip von גנב bezeichnet etwas durch Diebstahl Erlangtes; »gestohlenes« gibt dies unmittelbar wieder.
- source_word: יִמְתָּקוּ
  choice: schmeckt süß
  rationale: Das Verb מתק bedeutet »süß sein«. Im Zusammenhang mit Wasser gibt »schmeckt süß« die sinnliche Aussage idiomatisch wieder.
- source_word: לֶחֶם
  choice: Brot
  rationale: »Brot« bewahrt das konkrete Bild und den Parallelismus mit »Wasser«, statt es zum allgemeineren »Nahrung« auszuweiten.
- source_word: סְתָרִים
  choice: heimliches
  rationale: Der komprimierte Plural von סתר bezeichnet Verborgenheit oder geheime Umstände. »Heimliches Brot« bewahrt die knappe Mehrdeutigkeit besser als die ergänzende Formulierung »heimlich gegessenes Brot«.
- source_word: יִנְעָם
  choice: schmeckt köstlich
  rationale: נעם bezeichnet Angenehmsein oder Wohlgefallen. »Schmeckt köstlich« ist im Zusammenhang mit Brot natürlich und bildet einen klangvollen Parallelismus zu »schmeckt süß«, ohne den positiven Reiz der Aussage abzuschwächen.
theological_decisions:
- issue: Der verführerische Reiz des Verbotenen
  choice: Die positive Geschmacksbeschreibung bleibt ohne erklärenden moralischen Zusatz stehen.
  alternative: Die Aussage ausdrücklich als Täuschung oder als Behauptung der törichten Frau kennzeichnen.
  rationale: Im unmittelbaren Kontext ist dies die verführerische Rede der Frau Torheit; der Vers selbst formuliert den Reiz jedoch zugespitzt und ohne ausdrückliche Widerlegung. Ein moralischer Zusatz würde die literarische Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes, verständliches und zugleich sprichworthaft-würdevolles Deutsch. Die parallele Satzstruktur und die konkrete Bildsprache bleiben erhalten; die Fußnote macht die Verdichtung und Mehrdeutigkeit von סְתָרִים sichtbar.
