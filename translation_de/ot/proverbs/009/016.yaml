  text: מִי פֶ֭תִי יָסֻ֣ר הֵ֑נָּה וַ/חֲסַר לֵ֝֗ב וְ/אָ֣מְרָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/016.yaml
  text: Whoever is simple[a], let him turn in here! And to him who lacks sense she says,
translation:
  language: de
  text: '„Wer unerfahren ist, kehre hier ein!“ Und zu dem, dem es an Verstand fehlt[a], sagt sie:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem es an Herz fehlt“. In den Sprüchen steht das „Herz“ häufig für Einsicht, Urteilsvermögen oder inneres Gespür.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי פֶתִי
  choice: Wer unerfahren ist
  rationale: מִי leitet hier zusammen mit פֶתִי eine allgemeine Einladung ein. „Unerfahren“ bezeichnet in den Sprüchen einen leicht beeinflussbaren, noch nicht zur Weisheit gefestigten Menschen und vermeidet die heute abwertende oder intellektualisierende Wirkung von „einfältig“.
- source_word: יָסֻר הֵנָּה
  choice: kehre hier ein
  rationale: Die Verbform hat hier auffordernden Sinn. „Hier einkehren“ bewahrt sowohl die Richtungsänderung von סור als auch im Kontext die Einladung, sich an den Ort der Sprecherin zu begeben.
- source_word: חֲסַר לֵב
  choice: dem es an Verstand fehlt
  rationale: Die hebräische Wendung bedeutet wörtlich, dass es jemandem an „Herz“ fehlt; לֵב bezeichnet hier Urteilsvermögen und Einsicht. Die deutsche Wiedergabe vermittelt diesen idiomatischen Sinn, während die Fußnote das Bild des Originals bewahrt.
- source_word: וְאָמְרָה לּוֹ
  choice: Und zu dem … sagt sie
  rationale: Das feminine Subjekt ergibt sich aus dem Kontext. Das Präsens ist als Einleitung der unmittelbar folgenden Rede im deutschen Spruchkontext natürlich; לּוֹ wird ausdrücklich mit „zu dem“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Einladung bleibt knapp und pointiert; der Doppelpunkt zeigt an, dass die Rede im folgenden Vers fortgesetzt wird.
