id: PRO.9.2
reference: Proverbs 9:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: טָבְחָ֣ה טִ֭בְחָ/הּ מָסְכָ֣ה יֵינָ֑/הּ אַ֝֗ף עָֽרְכָ֥ה שֻׁלְחָנָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/002.yaml
  text: She has slaughtered her meat[a]; she has mixed her wine[b]; she has also set her table.
translation:
  language: de
  text: Sie hat ihr Vieh geschlachtet[a], ihren Wein gemischt[b] und auch ihren Tisch gedeckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Schlachttiere“; das hebräische Substantiv kann die für das Festmahl geschlachteten Tiere beziehungsweise das zubereitete Fleisch bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das heißt, sie hat den Wein durch Mischen zubereitet, wahrscheinlich entsprechend dem damaligen Festbrauch.
    reason: cultural_note
lexical_decisions:
- source_word: טָבְחָה
  choice: hat … geschlachtet
  rationale: Das Qal Perfekt 3. Person Feminin Singular von טבח bezeichnet das Schlachten eines Tieres für eine Mahlzeit. „Geschlachtet“ bewahrt die konkrete Vorbereitungshandlung.
- source_word: טִבְחָהּ
  choice: ihr Vieh
  rationale: Das Substantiv bezeichnet das für das Festmahl geschlachtete Tier beziehungsweise das daraus gewonnene Fleisch. In Verbindung mit „geschlachtet“ gibt „ihr Vieh“ die konkrete Handlung im Deutschen natürlich wieder, ohne den Ausdruck zum allgemeinen „Festmahl“ auszuweiten.
- source_word: מָסְכָה
  choice: hat … gemischt
  rationale: מסך bezeichnet hier das Mischen beziehungsweise Zubereiten von Wein, wahrscheinlich mit Wasser und/oder Gewürzen nach damaligem Festbrauch. „Gemischt“ bleibt eng am hebräischen Ausdruck.
- source_word: יֵינָהּ
  choice: ihren Wein
  rationale: Die einfache Possessivkonstruktion bezeichnet den Wein, den sie für das Mahl zubereitet hat.
- source_word: אַף
  choice: auch
  rationale: אַף fügt der Reihe abgeschlossener Vorbereitungen eine weitere Handlung hinzu; „auch“ gibt diese kumulative Funktion natürlich wieder.
- source_word: עָרְכָה
  choice: hat … gedeckt
  rationale: ערך bedeutet „ordnen, zurechtlegen“. Beim Tisch ist „den Tisch decken“ die natürliche deutsche Entsprechung und bewahrt das Bild der Vorbereitung eines Mahls.
- source_word: שֻׁלְחָנָהּ
  choice: ihren Tisch
  rationale: Die konkrete Festtafel der personifizierten Weisheit bleibt erhalten und wird nicht allegorisch ausgedeutet.
theological_decisions:
- issue: Weibliche personifizierte Gestalt im Weisheitsgedicht
  choice: Das feminine Subjekt wird im Vers mit „Sie“ wiedergegeben, ohne im Vers selbst ausdrücklich „die Weisheit“ einzusetzen.
  alternative: „Die Weisheit hat ihr Vieh geschlachtet …“
  rationale: Die hebräischen Verben stehen im Feminin Singular; der unmittelbare Zusammenhang identifiziert das Subjekt als personifizierte Weisheit. Das Pronomen bewahrt die poetische Fortführung und vermeidet einen erklärenden Zusatz oder eine darüber hinausgehende lehrmäßige Festlegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Klang. Die drei abgeschlossenen Vorbereitungshandlungen werden in einem flüssigen Satz verbunden; die konkrete Bildsprache des Festmahls bleibt erhalten.
