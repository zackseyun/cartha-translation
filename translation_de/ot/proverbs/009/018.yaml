source:
  edition: WLC
  text: וְֽ/לֹא יָ֭דַע כִּֽי רְפָאִ֣ים שָׁ֑ם בְּ/עִמְקֵ֖י שְׁא֣וֹל קְרֻאֶֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/018.yaml
  text: But he does not know that the dead are there[a], that her guests are in the depths of Sheol.
translation:
  language: de
  text: Doch er weiß nicht, dass dort die Toten sind[a], dass ihre Gäste in den Tiefen des Scheol sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Schatten“. Das hebräische Wort רְפָאִים bezeichnet hier die Verstorbenen im Scheol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Doch ... nicht
  rationale: Die Verbindung leitet einen scharfen Gegensatz zur verführerischen Einladung des vorherigen Verses ein; „Doch“ gibt diesen adversativen Sinn natürlich wieder.
- source_word: יָדַע
  choice: er weiß nicht
  rationale: Das Qatal beschreibt hier im Zusammenhang einen gegenwärtigen Zustand der Unwissenheit.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt dessen ein, was der Verführte nicht weiß.
- source_word: רְפָאִים
  choice: die Totengeister
  rationale: Das Wort bezeichnet hier nicht das gleichnamige Volk, sondern die Verstorbenen beziehungsweise Schattenwesen im Totenreich. „Totengeister“ bewahrt diese besondere Bedeutung deutlicher als das allgemeine „Toten“.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf den zuvor beschriebenen Ort und seine verborgene Verbindung mit dem Totenreich.
- source_word: בְּעִמְקֵי
  choice: in den Tiefen
  rationale: Die Wiedergabe bewahrt das räumliche Bild des tief gelegenen Totenreichs und klingt im Deutschen natürlich.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration erhält den hebräischen Begriff für das Totenreich, ohne ihn mit „Grab“ zu verengen oder mit „Hölle“ dogmatisch zu überbestimmen.
- source_word: קְרֻאֶיהָ
  choice: ihre Gäste
  rationale: Das passive Partizip bezeichnet die von der Frau Eingeladenen. „Gäste“ ist im Kontext der Einladung idiomatisch und knapp.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Grab; Totenreich; Hölle
  rationale: „Scheol“ bewahrt den alttestamentlichen Begriff und seine Spannung, ohne eine engere spätere Vorstellung einzutragen.
- issue: Wiedergabe von רְפָאִים
  choice: Totengeister
  alternative: Tote; Schatten; Refaïter
  rationale: Im Kontext sind die Bewohner des Scheol gemeint, nicht die ethnische Gruppe. „Totengeister“ wahrt die besondere Bildsprache; die allgemeinere Übersetzung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzparallelität des Hebräischen bleibt erhalten; „Scheol“ wird als bedeutungstragender hebräischer Begriff bewahrt.
