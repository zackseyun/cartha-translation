source:
  edition: WLC
  text: יֹ֤סֵ֨ר לֵ֗ץ לֹקֵ֣חַֽ ל֣/וֹ קָל֑וֹן וּ/מוֹכִ֖יחַ לְ/רָשָׁ֣ע מוּמֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/007.yaml
  text: Whoever corrects a scoffer gets dishonor for himself[c][b][a], and whoever rebukes a wicked man gets a blemish for himself.
translation:
  language: de
  text: Wer einen Spötter zurechtweist, zieht sich Schande zu[a]; wer einen Frevler tadelt, trägt einen Makel davon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „holt sich Schmach“ beziehungsweise „nimmt Schande auf sich“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seinen Makel“. Das Pronomen kann auf den Tadelnden oder auf den Frevler bezogen werden; möglicherweise ist die Beschimpfung oder Schädigung gemeint, die der Tadelnde durch den Frevler erfährt.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: יֹסֵר
  choice: Wer … zurechtweist
  rationale: Das Partizip formuliert eine allgemeingültige Aussage. „Zurechtweisen“ gibt יסר im Parallelismus mit „tadeln“ als verbale Korrektur wieder, ohne eine körperliche Züchtigung anzudeuten.
- source_word: לֵץ
  choice: einen Spötter
  rationale: לֵץ bezeichnet in den Sprüchen einen hochmütigen Menschen, der Weisheit verächtlich zurückweist. „Spötter“ bewahrt den abwertend-spöttischen Sinn und ist im heutigen Deutsch verständlich.
- source_word: לֹקֵחַ לוֹ קָלוֹן
  choice: zieht sich Schande zu
  rationale: Die Verbindung von לקח mit לוֹ drückt hier aus, dass jemand etwas für sich selbst erlangt beziehungsweise auf sich zieht. „Schande“ bezeichnet passend den öffentlichen Ehrverlust.
- source_word: וּמוֹכִיחַ
  choice: wer … tadelt
  rationale: Das Hifil-Partizip von יכח bezeichnet ein rügendes Zurechtweisen. „Tadeln“ erhält die begriffliche Nähe zur ersten Vershälfte, ohne sie wörtlich zu wiederholen.
- source_word: לְרָשָׁע
  choice: einen Frevler
  rationale: רָשָׁע bezeichnet einen schuldigen, bösen oder gottlos handelnden Menschen. „Frevler“ ist knapp, würdig und lässt den moralisch-rechtlichen Gehalt bestehen.
- source_word: מוּמוֹ
  choice: trägt einen Makel davon
  rationale: מוּם bedeutet gewöhnlich „Makel“ oder „Fehler“. Im Zusammenhang bezeichnet es wahrscheinlich die Beschimpfung oder Schädigung, die dem Tadelnden widerfährt. Die freie Wendung ergibt natürliches Deutsch; die schwer zuzuordnende Suffixform wird in der Fußnote offengelegt.
theological_decisions:
- issue: Bezug des pronominalen Suffixes in מוּמוֹ
  choice: Im Haupttext als ein vom Tadelnden davongetragener „Makel“ wiedergegeben.
  alternative: Wörtlich „seinen Makel“, wobei sich „seinen“ entweder auf den Tadelnden oder auf den Frevler beziehen kann; bei letzterem wäre an dessen Beschimpfung oder an den Makel des Umgangs mit ihm zu denken.
  rationale: Der knappe hebräische Ausdruck ist syntaktisch und semantisch mehrdeutig. Der Haupttext gibt den wahrscheinlichen Aussagezusammenhang wieder, während die Fußnote die echte Unbestimmtheit bewahrt, ohne sie lehrmäßig festzulegen.
translation_notes:
  register: Modernes, knappes und sprichwortartiges Standarddeutsch. Das Semikolon bildet den hebräischen Parallelismus ab. „Spötter“ und „Frevler“ sind maskuline Singularformen mit allgemeiner, nicht auf Männer beschränkter Aussage.
