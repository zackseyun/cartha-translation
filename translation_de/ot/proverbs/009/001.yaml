id: PRO.9.1
reference: Proverbs 9:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חָ֭כְמוֹת בָּנְתָ֣ה בֵיתָ֑/הּ חָצְבָ֖ה עַמּוּדֶ֣י/הָ שִׁבְעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/001.yaml
  text: Wisdom has built her house[a]; she has hewn out her seven pillars.
translation:
  language: de
  text: Die Weisheit[a] hat ihr Haus gebaut; sie hat ihre sieben Säulen ausgehauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort חָכְמוֹת steht der Form nach im Plural, wird hier aber mit femininen Verben im Singular verbunden und bezeichnet daher die personifizierte „Weisheit“.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמוֹת
  choice: die Weisheit
  rationale: Obwohl das hebräische Wort der Form nach im Plural steht, wird es hier durch feminine Verben im Singular als personifizierte Einzahl gekennzeichnet. „Die Weisheit“ gibt dies im Deutschen natürlich wieder.
- source_word: בָּנְתָה
  choice: hat ... gebaut
  rationale: Das Perfekt stellt den Bau als vollendete Handlung dar; das deutsche Perfekt ist hier natürlich und bewahrt diesen Aspekt.
- source_word: בֵיתָהּ
  choice: ihr Haus
  rationale: Die konkrete Bedeutung „Haus“ entspricht dem anschließenden architektonischen Bild der Säulen besser als „Haushalt“ oder „Heim“.
- source_word: חָצְבָה
  choice: hat ... ausgehauen
  rationale: Das Verb bezeichnet das Hauen oder Behauen, besonders von Stein. „Ausgehauen“ erhält das konkrete und kraftvolle Baubild.
- source_word: עַמּוּדֶיהָ
  choice: ihre ... Säulen
  rationale: „Säulen“ ist der natürliche deutsche Architekturbegriff und vermittelt Festigkeit und Größe des Bildes.
- source_word: שִׁבְעָה
  choice: sieben
  rationale: Die Zahl wird direkt wiedergegeben. Eine mögliche symbolische Bedeutung von Vollständigkeit wird nicht in den Haupttext hineingetragen.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: חָכְמוֹת wird als personifizierter Singular „die Weisheit“ mit femininen Bezügen wiedergegeben.
  alternative: Ausdrücklicher als „Frau Weisheit“ oder „Dame Weisheit“ übersetzen.
  rationale: Die femininen Singularformen im Hebräischen stellen die Weisheit als weibliche Personifikation dar. „Frau Weisheit“ wäre jedoch eine interpretierende Ergänzung, die im Vers nicht ausdrücklich steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die architektonische Bildsprache und die weibliche Personifikation bleiben erhalten; die Satzstruktur folgt dem poetischen Parallelismus des Hebräischen.
