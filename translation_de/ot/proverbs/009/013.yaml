source:
  edition: WLC
  text: אֵ֣שֶׁת כְּ֭סִילוּת הֹֽמִיָּ֑ה פְּ֝תַיּ֗וּת וּ/בַל יָ֥דְעָה מָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/013.yaml
  text: The woman Folly is loud[a]; she is simple and knows nothing.
translation:
  language: de
  text: Frau Torheit ist laut; sie ist einfältig und weiß gar nichts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und weiß nicht was«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת כְּסִילוּת
  choice: Frau Torheit
  rationale: Die Verbindung bedeutet wörtlich »Frau der Torheit«. Im Zusammenhang wird die Torheit als Frau personifiziert; »Frau Torheit« bewahrt diese Personifikation und bildet eine natürliche Entsprechung zu Frau Weisheit, ohne einen im Hebräischen nicht ausdrücklich vorhandenen Titel wie »Dame« einzuführen.
- source_word: הֹמִיָּה
  choice: ist laut
  rationale: Das Wort beschreibt lärmendes, ungestümes oder aufdringliches Auftreten. »Ist laut« ist knapp, gegenwärtig und lässt offen, auf welche Weise sich ihre Lärmhaftigkeit äußert.
- source_word: פְּתַיּוּת
  choice: sie ist einfältig
  rationale: Das abstrakte Nomen bezeichnet Einfalt oder Naivität. Da der hebräische Satz kein ausdrückliches Verb enthält und die Eigenschaft der Frau beschreibt, wird im Deutschen idiomatisch ein Adjektiv mit »sie ist« verwendet. »Einfältig« wahrt die begriffliche Verbindung zu den Einfältigen im Sprüchebuch.
- source_word: וּבַל
  choice: und … nicht
  rationale: Die Verbindung fügt mit einer verneinten Aussage ein weiteres Merkmal hinzu. Das schlichte »und« erhält die additive Struktur, ohne einen stärkeren Gegensatz einzutragen.
- source_word: יָדְעָה מָּה
  choice: weiß gar nichts
  rationale: Wörtlich lautet die abrupte Wendung »weiß nicht was«. Im Zusammenhang ist sie eine nachdrückliche Aussage völliger Unwissenheit; »weiß gar nichts« gibt diese Wirkung in natürlichem Deutsch wieder, während die wörtliche Form in der Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die weibliche Personifikation sowie die pointierte Dreigliedrigkeit der Charakterisierung bleiben erhalten.
