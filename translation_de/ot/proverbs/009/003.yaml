  text: שָֽׁלְחָ֣ה נַעֲרֹתֶ֣י/הָ תִקְרָ֑א עַל גַּ֝פֵּ֗י מְרֹ֣מֵי קָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/003.yaml
  text: 'She has sent out her young women[b][a]; she calls from the heights of the city:'
translation:
  language: de
  text: 'Sie hat ihre jungen Frauen[a] ausgesandt; sie ruft von den Höhen der Stadt[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre jungen Dienerinnen“. Das Hebräische bezeichnet junge weibliche Personen; im Zusammenhang können Begleiterinnen oder Dienerinnen gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf den Gipfeln der Höhen der Stadt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלְחָה
  choice: hat … ausgesandt
  rationale: Das Qal Perfekt 3. Person Singular feminin bezeichnet eine abgeschlossene Handlung der personifizierten Weisheit; das deutsche Perfekt fügt sich natürlich in die vorbereitenden Handlungen des Zusammenhangs ein.
- source_word: נַעֲרֹתֶיהָ
  choice: ihre jungen Frauen
  rationale: Der Ausdruck bezeichnet junge weibliche Personen und kann im Kontext Dienerinnen oder Begleiterinnen meinen. „Junge Frauen“ bewahrt Alter und Geschlecht, ohne einen Dienerstatus ausdrücklich festzulegen.
- source_word: תִקְרָא
  choice: sie ruft
  rationale: Das Qal Imperfekt 3. Person Singular feminin beschreibt hier den öffentlichen Ruf der Weisheit; „ruft“ gibt das Verb direkt und ohne unnötige Verstärkung wieder.
- source_word: עַל גַּפֵּי מְרֹמֵי קָרֶת
  choice: von den Höhen der Stadt
  rationale: Die hebräische Wendung ist wörtlich etwa „auf den Höhen der Erhebungen der Stadt“. Die gebündelte deutsche Formulierung bewahrt den Sinn eines weithin sichtbaren, erhöhten Ortes und vermeidet schwer verständliche Doppelung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personifizierte Weisheit bleibt durch die femininen Formen erkennbar; der Doppelpunkt hält den Ruf für den folgenden Vers offen.
