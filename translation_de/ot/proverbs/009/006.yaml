  verdict: revise
  source_fidelity: Die Wiedergabe von פְתָאִים als »die Unerfahrenen« ist als formales Objekt zwar möglich, legt im Deutschen jedoch zu stark nahe, dass andere Personen verlassen werden sollen. Im Kontext richtet Weisheit ihre Einladung gerade an die Unbedarften; die Aufforderung meint daher wahrscheinlich, Unbedarftheit bzw. den unbedarften Zustand hinter sich zu lassen. Die Fußnote erkennt dies an, aber der Haupttext bleibt ohne diese Klärung missverständlich. וְאִשְׁרוּ bezeichnet das Gehen auf einem rechten Weg; »geht … voran« ist möglich, doch das zusätzliche »voran« ist nicht erforderlich.
  naturalness: '»Verlasst die Unerfahrenen« klingt im modernen Deutsch sozial und persönlich: Man soll unerfahrene Menschen zurücklassen. »Lasst die Unbedarftheit hinter euch« ist idiomatisch, knapp und vermittelt die kontextuelle Aussage klar. »Geht den Weg der Einsicht« ist eine natürliche deutsche Gestaltung des Wegbildes.'
  terminology: »Unbedarftheit« gibt die in den Sprüchen gemeinte Naivität bzw. mangelnde Urteilsfähigkeit treffender wieder als bloße fehlende Erfahrung. »Einsicht« ist für בִּינָה passend. Die Fußnote hält die wörtliche pluralische Form und die daraus folgende Auslegungsfrage transparent.
  issues:
