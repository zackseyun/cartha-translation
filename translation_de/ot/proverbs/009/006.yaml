  text: Leave the simple[a], and live; and walk in the way of understanding.
translation:
  language: de
  text: Lasst die Unbedarftheit hinter euch und lebt; geht den Weg der Einsicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht: »Verlasst die Unbedarften« (hebräisch ein Plural). Da Weisheit hier gerade die Unbedarften anredet, ist wahrscheinlich gemeint, ihre Unbedarftheit oder diesen Zustand hinter sich zu lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ
  choice: Verlasst
  rationale: Der Imperativ Plural fordert zu einer entschiedenen Trennung auf. »Verlasst« gibt die Grundbedeutung von עזב direkt und in heutigem Deutsch wieder.
- source_word: פְתָאיִם
  choice: die Unerfahrenen
  rationale: Das maskuline Pluralnomen bezeichnet in den Sprüchen leicht beeinflussbare, noch nicht urteilsfähige Menschen. »Unerfahrene« ist verständlich und weniger abwertend als »Einfältige« oder »Naive«; die syntaktische Form als direktes Objekt bleibt erhalten.
- source_word: וִחְיוּ
  choice: und lebt
  rationale: Der koordinierte Imperativ wird knapp und unmittelbar wiedergegeben. Eine finale Wiedergabe wie »damit ihr lebt« wäre möglich, würde die grammatische Form jedoch stärker auslegen.
- source_word: וְאִשְׁרוּ
  choice: geht … voran
  rationale: Der Imperativ von אשר bezeichnet hier das Geradeausgehen beziehungsweise Voranschreiten. »Geht … voran« klingt natürlich und bewahrt das Bild eines Weges als Lebensführung.
- source_word: בְּדֶרֶךְ
  choice: auf dem Weg
  rationale: דרך kann einen tatsächlichen Weg und bildlich eine Lebensführung bezeichnen. Im Deutschen ist bei Bewegung »auf dem Weg« idiomatisch.
- source_word: בִּינָה
  choice: der Einsicht
  rationale: בינה meint unterscheidendes Verstehen und Urteilsvermögen. »Einsicht« ist im Deutschen prägnant und für die Weisheitssprache der Sprüche passend.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch. Die drei Aufforderungen und das Wegbild des Hebräischen bleiben erhalten. Die auffällige wörtliche Form »Verlasst die Unerfahrenen« wird nicht stillschweigend zu »Legt eure Unerfahrenheit ab« geglättet, sondern in einer Fußnote erläutert.
