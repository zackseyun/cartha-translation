base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/009.yaml
  text: Give to a wise man[a], and he will become wiser still; teach a righteous man[b], and he will add learning.
translation:
  language: de
  text: Gib einem Weisen[a], und er wird noch weiser werden; lehre einen Gerechten[b], und er wird dazulernen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausführlicher: »Gib einem Weisen Unterweisung.« Im Hebräischen bleibt das Objekt von »gib« unausgesprochen.'
    reason: lexical_alternative
  - marker: b
    text: »Ein Gerechter« steht im Hebräischen im maskulinen Singular und bezeichnet hier beispielhaft einen gerechten Menschen; diese Ausdrucksweise ist für das Buch der Sprüche typisch.
    reason: cultural_note
lexical_decisions:
- source_word: תֵּן
  choice: Gib
  rationale: Der Imperativ von נתן bedeutet grundsätzlich »geben«. Das Objekt bleibt im Hebräischen unausgesprochen; die knappe Wiedergabe bewahrt diese Ellipse.
- source_word: לְחָכָם
  choice: einem Weisen
  rationale: חָכָם bezeichnet einen weisen Menschen. Die substantivierte Form »ein Weiser« ist im Deutschen natürlich und erhält den repräsentativen maskulinen Singular.
- source_word: וְיֶחְכַּם עוֹד
  choice: und er wird noch weiser werden
  rationale: Das Verb חכם bezeichnet hier ein weiteres Zunehmen an Weisheit; עוֹד verstärkt dies im Sinn von »noch, weiter«.
- source_word: הוֹדַע
  choice: lehre
  rationale: Der Hifil-Imperativ von ידע heißt wörtlich »lass wissen/mach bekannt«. Im Zusammenhang der Weisheitsunterweisung gibt »lehre« die pädagogische Bedeutung natürlich wieder.
- source_word: לְצַדִּיק
  choice: einen Gerechten
  rationale: צַדִּיק bedeutet »gerecht« beziehungsweise »ein Gerechter« und steht parallel zu »einem Weisen«.
- source_word: וְיוֹסֶף לֶקַח
  choice: und er wird an Erkenntnis zunehmen
  rationale: יסף bezeichnet Hinzufügen oder Zunehmen; לֶקַח meint in den Sprüchen aufgenommene Lehre, Einsicht oder Lerngewinn. »An Erkenntnis zunehmen« ist idiomatisches Deutsch und wahrt den Gedanken des Wachstums.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Ellipse des ersten Satzteils bleibt im Haupttext erhalten; die Fußnote erläutert den sinngemäß vorausgesetzten Gegenstand. Die parallele Struktur und der repräsentative Singular des Hebräischen werden bewahrt.
