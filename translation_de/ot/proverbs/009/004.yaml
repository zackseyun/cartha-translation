  text: מִי פֶ֭תִי יָסֻ֣ר הֵ֑נָּה חֲסַר לֵ֝֗ב אָ֣מְרָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/004.yaml
  text: Whoever is simple[a], let him turn in here! To him who lacks sense she says,
translation:
  language: de
  text: '„Wer unerfahren ist, kehre hier ein!“ Zu dem, der keine Einsicht hat[a], sagt sie:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem es an Herz fehlt“. Das Herz steht im Hebräischen häufig für Einsicht und Urteilsvermögen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי פֶתִי
  choice: Wer unerfahren ist
  rationale: פֶתִי bezeichnet im Sprüchebuch einen unerfahrenen, leicht beeinflussbaren Menschen, nicht notwendig jemanden mit geringer Intelligenz. Die Formulierung gibt den unbestimmten, allgemein einladenden Sinn von מִי wieder.
- source_word: יָסֻר הֵנָּה
  choice: kehre hier ein
  rationale: Der Jussiv drückt eine Einladung aus. „Hier einkehren“ bewahrt sowohl die Bewegung zum Ort der Rufenden als auch im Zusammenhang den Gedanken des Eintretens in ihr Haus.
- source_word: חֲסַר לֵב
  choice: dem es an Einsicht fehlt
  rationale: Die Wendung bedeutet wörtlich, dass jemandem das „Herz“ fehlt; לֵב bezeichnet hier nach hebräischem Sprachgebrauch Einsicht und Urteilsvermögen. „Einsicht“ vermeidet eine irreführende anatomische oder rein emotionale Deutung.
- source_word: אָמְרָה לּוֹ
  choice: Zu dem … sagt sie
  rationale: Das feminine Verb bezieht sich im Kontext auf die personifizierte Weisheit. Das Präsens hält den gegenwärtigen Ruf lebendig; לּוֹ nimmt den allgemein bezeichneten Einzelnen auf.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unerfahren“ vermeidet die heute oft abwertende oder intellektuell missverständliche Wiedergabe „einfältig“. Die etwas feierliche Jussivform „kehre … ein“ entspricht dem öffentlichen Einladungsruf der Weisheit.
