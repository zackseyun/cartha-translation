id: PRO.17.20
reference: Proverbs 17:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עִקֶּשׁ לֵ֭ב לֹ֣א יִמְצָא ט֑וֹב וְ/נֶהְפָּ֥ךְ בִּ֝/לְשׁוֹנ֗/וֹ יִפּ֥וֹל בְּ/רָעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/020.yaml
  text: A crooked heart does not find good, and one who is twisted in his tongue falls into trouble.
translation:
  language: de
  text: Wer ein verkehrtes Herz hat, findet nichts Gutes, und wer eine verdrehte Zunge hat, fällt ins Unglück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִקֶּשׁ לֵב
  choice: wer ein verkehrtes Herz hat
  rationale: Die hebräische Verbindung bezeichnet einen Menschen mit innerlich verkehrter, moralisch verdrehter Gesinnung. Die personale Formulierung ist im Deutschen natürlich und wahrt das Bild des Herzens.
- source_word: לֹא יִמְצָא טוֹב
  choice: findet nichts Gutes
  rationale: Gibt die Verneinung und das substantivierte טוֹב knapp wieder; die Aussage kann sowohl erfahrenes Wohlergehen als auch Gutes allgemein umfassen.
- source_word: וְנֶהְפָּךְ בִּלְשׁוֹנוֹ
  choice: und wer eine verdrehte Zunge hat
  rationale: נֶהְפָּךְ beschreibt hier eine in der Sprache verdrehte beziehungsweise verkehrte Person. Das Zungenbild bleibt erhalten, ohne die Mehrdeutigkeit auf bloße Lüge einzuengen.
- source_word: יִפּוֹל בְּרָעָה
  choice: fällt ins Unglück
  rationale: רָעָה kann Böses, Unheil oder Unglück bezeichnen. Im Zusammenhang mit יִפּוֹל ist „ins Unglück fallen“ idiomatisch und bewahrt den Folge- beziehungsweise Gerichtssinn, ohne ihn näher festzulegen.
theological_decisions:
- issue: Reichweite von „findet nichts Gutes“
  choice: Die allgemeine, sprichwörtliche Aussage bleibt ohne dogmatische Präzisierung stehen.
  alternative: „hat keinen Erfolg“ oder „erlangt kein Wohlergehen“
  rationale: טוֹב ist semantisch weiter als Erfolg oder materielles Wohlergehen; die offene Formulierung erhält die moralische und erfahrungsbezogene Spannung.
- issue: Art des drohenden Übels
  choice: „Unglück“ ohne ausdrückliche Zuschreibung an göttliches Gericht
  alternative: „Verderben“ oder „Böses“
  rationale: Der Vers nennt weder den unmittelbaren Urheber noch die genaue Art der רָעָה. Die Übersetzung soll diese Offenheit nicht konfessionell oder systematisch auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit parallelem Satzbau. Die Bilder „Herz“ und „Zunge“ bleiben erhalten; „verkehrt“ und „verdreht“ bilden die verwandte, aber nicht identische hebräische Ausdrucksweise ab.
