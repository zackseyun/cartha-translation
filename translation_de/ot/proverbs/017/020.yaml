  source_fidelity: Die Übersetzung gibt die beiden parallelen hebräischen Personenbeschreibungen sowie die Folgeaussagen zuverlässig wieder. „Verkehrtes Herz“ entspricht עִקֶּשׁ לֵב; „findet nichts Gutes“ wahrt die offene Reichweite von טוֹב. „Eine verdrehte Zunge hat“ ist eine natürliche deutsche Bildübertragung von נֶהְפָּךְ בִּלְשׁוֹנוֹ, ohne das Gemeinte unzulässig auf Lüge oder Verleumdung zu verengen. „Fällt ins Unglück“ trifft יִפּוֹל בְּרָעָה angemessen.
