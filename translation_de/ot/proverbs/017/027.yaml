  text: חוֹשֵׂ֣ךְ אֲ֭מָרָי/ו יוֹדֵ֣עַ דָּ֑עַת ו/קר ר֝֗וּחַ אִ֣ישׁ תְּבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/027.yaml
  text: Whoever restrains his words has knowledge[b][a], and a man of understanding is cool in spirit.
translation:
  language: de
  text: Wer seine Worte zurückhält, besitzt Erkenntnis, und ein verständiger Mann[b] ist kühlen Geistes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist ruhigen Geistes“. Wörtlich spricht das Hebräische von einem „kühlen Geist“ und verwendet damit ein Temperaturbild für Selbstbeherrschung.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „ein Mann der Einsicht“. Die maskuline Singularform wird hier sprichwörtlich für einen Menschen gebraucht, der durch Einsicht geprägt ist.'
    reason: cultural_note
lexical_decisions:
- source_word: חוֹשֵׂךְ אֲמָרָיו
  choice: seine Worte zurückhält
  rationale: Das Partizip חוֹשֵׂךְ bezeichnet hier das bewusste Zurückhalten der Rede. Die Formulierung ist im Deutschen natürlich und bewahrt den Gedanken der Selbstbeherrschung.
- source_word: יוֹדֵעַ דָּעַת
  choice: besitzt Erkenntnis
  rationale: Die wörtliche Verbindung „kennt Erkenntnis“ ist im Deutschen unidiomatisch. „Besitzt Erkenntnis“ gibt die Charakterisierung als wissender, einsichtiger Mensch klar wieder.
- source_word: וְקַר רוּחַ
  choice: ist von kühlem Geist
  rationale: קַר bedeutet wörtlich „kühl“ oder „kalt“ und beschreibt zusammen mit רוּחַ bildhaft eine beherrschte innere Haltung. Die Wiedergabe erhält bewusst das Temperaturbild des Hebräischen.
- source_word: אִישׁ תְּבוּנָה
  choice: ein verständiger Mann
  rationale: Die hebräische Verbindung bezeichnet einen Mann, der durch Einsicht oder Urteilsvermögen geprägt ist. „Verständiger Mann“ bildet sowohl die ausdrücklich maskuline Form אִישׁ als auch den sprichwörtlich allgemeinen Charakter der Aussage ab.
theological_decisions:
- issue: Geschlechtsspezifische Formulierung im Weisheitsspruch
  choice: ein verständiger Mann
  alternative: ein verständiger Mensch / wer verständig ist
  rationale: Der Ausgangstext verwendet ausdrücklich das maskuline Singularnomen אִישׁ. Dieses wird im Haupttext beibehalten, ohne auszuschließen, dass der Spruch als allgemeine Lebensweisheit gilt; die Fußnote erläutert die sprichwörtliche Verwendung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Halbvers ist idiomatisch formuliert; im zweiten bleibt das markante hebräische Bild vom „kühlen Geist“ erhalten. Die Satzstruktur bildet den Parallelismus des Spruchs nach.
