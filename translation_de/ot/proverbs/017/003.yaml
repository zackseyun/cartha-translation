source:
  edition: WLC
  text: מַצְרֵ֣ף לַ֭/כֶּסֶף וְ/כ֣וּר לַ/זָּהָ֑ב וּ/בֹחֵ֖ן לִבּ֣וֹת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/003.yaml
  text: The crucible is for silver[a], and the furnace for gold[b], but Yahweh tests hearts.
translation:
  language: de
  text: Der Schmelztiegel ist für Silber da und der Ofen für Gold; und Jahwe prüft die Herzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH, der Gottesname; traditionell „der HERR“.
    reason: Die Fußnote erläutert die Wiedergabe des Tetragramms als „Jahwe“ und nennt die verbreitete Ersatzlesung.
lexical_decisions:
- source_word: מַצְרֵף
  choice: Schmelztiegel
  rationale: Das Wort bezeichnet ein Gefäß oder Gerät zum Läutern von Metall. „Schmelztiegel“ bewahrt das metallurgische Bild und ist im heutigen Deutsch verständlich.
- source_word: לַכֶּסֶף
  choice: für Silber
  rationale: Die Präposition ל bezeichnet hier Zweck oder Zuordnung. Der artikellose Ausdruck entspricht dem allgemeinen Charakter des Spruchs.
- source_word: כּוּר
  choice: Ofen
  rationale: Gemeint ist ein Ofen zum Schmelzen oder Läutern von Metall. „Ofen“ ist knapp und bildet mit „Schmelztiegel“ eine natürliche Parallele.
- source_word: לַזָּהָב
  choice: für Gold
  rationale: Die Präposition ל drückt Zweck oder Zuordnung aus; „für Gold“ gibt die allgemeine Aussage idiomatisch wieder.
- source_word: וּבֹחֵן
  choice: doch … prüft
  rationale: Das Partizip von בחן bezeichnet ein Prüfen, das Beschaffenheit oder Echtheit erkennen lässt. „Prüft“ erhält den Bezug zum Läutern der Metalle; „doch“ macht den im Parallelismus angelegten Gegensatz im Deutschen deutlich, ohne ihn inhaltlich auszubauen.
- source_word: לִבּוֹת
  choice: die Herzen
  rationale: „Herzen“ bewahrt das hebräische Bild für das innere Wesen des Menschen, einschließlich Denken, Wollen und Absichten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als Namen; die traditionelle Ersatzlesung wird in einer Fußnote genannt.
- issue: Aussage von בחן über das menschliche Innere
  choice: die Herzen prüft
  alternative: die Herzen untersucht
  rationale: „Prüft“ wahrt die Verbindung zur Erprobung und Läuterung von Metallen, ohne das Handeln Gottes auf eine rein psychologische Untersuchung oder ein gerichtliches Urteil zu verengen.
- issue: Verhältnis der beiden Vershälften
  choice: doch
  alternative: und
  rationale: Das hebräische ו kann schlicht mit „und“ wiedergegeben werden. Im Parallelismus entsteht jedoch ein Vergleich beziehungsweise Gegensatz zwischen menschlichen Läuterungsgeräten und Jahwe als dem Prüfer der Herzen; „doch“ bringt diese Beziehung natürlich zum Ausdruck, während die wörtlichere Möglichkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des hebräischen Spruchs bleibt erhalten. „Ist … da“ ergänzt die im Hebräischen nominal und elliptisch formulierte Zuordnung idiomatisch; die Voranstellung von „die Herzen“ hebt die entscheidende Entsprechung hervor.
