  text: ט֤וֹב פַּ֣ת חֲ֭רֵבָה וְ/שַׁלְוָה בָ֑/הּ מִ֝/בַּ֗יִת מָלֵ֥א זִבְחֵי רִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/001.yaml
  text: Better is a dry crust with peace than a house full of sacrificial feasts with strife[a].
translation:
  language: de
  text: Besser ein trockenes Stück Brot und Ruhe dabei als ein Haus voller Opfermahlzeiten[a] und Streit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Opfer“; das hebräische Wort kann sowohl die Opfer selbst als auch die damit verbundenen reichlichen Festmahlzeiten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Besser ... als
  rationale: Gibt die knappe hebräische Vergleichsformel natürlich und sprichwortartig wieder.
- source_word: פַּת חֲרֵבָה
  choice: ein trockenes Stück Brot
  rationale: פַּת bezeichnet ein Stück beziehungsweise einen Bissen Brot; חֲרֵבָה hebt die karge, trockene Beschaffenheit hervor. Diese Wiedergabe vermeidet die engere Vorstellung einer Brotkruste.
- source_word: וְשַׁלְוָה בָהּ
  choice: und Ruhe dabei
  rationale: שַׁלְוָה bezeichnet Ruhe, Ungestörtheit oder friedliche Gelassenheit. „Dabei“ nimmt das Suffix בָהּ idiomatisch auf, ohne seinen Bezug unnötig festzulegen.
- source_word: מִבַּיִת מָלֵא
  choice: als ein Haus voller
  rationale: Das vergleichende מִן wird mit „als“ wiedergegeben; das konkrete Bild des Hauses bleibt erhalten.
- source_word: זִבְחֵי
  choice: Opfermahlzeiten
  rationale: Der Plural von זֶבַח kann Opfer oder die damit verbundenen Mahlzeiten bezeichnen. Im Zusammenhang mit einem vollen Haus bringt „Opfermahlzeiten“ sowohl den kultischen Hintergrund als auch den Gedanken üppiger Speisen zum Ausdruck.
- source_word: רִיב
  choice: Streit
  rationale: Bezeichnet zwischenmenschlichen Konflikt und bildet den prägnanten Gegenpol zu „Ruhe“.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller Sprichwortstil in modernem Standarddeutsch. Die Parallelität und der Gegensatz zwischen karger Nahrung mit Ruhe und Fülle mit Streit bleiben erhalten.
