  yaml_path: translation/ot/proverbs/017/016.yaml
  text: Why is there a price in the hand of a fool to buy wisdom when he has no heart for it?[a]
translation:
  language: de
  text: Wozu hat ein Narr Geld in der Hand, um Weisheit zu kaufen, wenn er keinen Verstand hat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und kein Herz“. Das „Herz“ kann im Hebräischen auch das innere Vermögen des Verstehens, Urteilens und Wollens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה זֶּה
  choice: Wozu
  rationale: Die rhetorische Frage zielt auf die Nutzlosigkeit beziehungsweise Zwecklosigkeit des Kaufmittels beim Narren. „Wozu“ gibt dies im Deutschen knapp und natürlich wieder, ohne das Demonstrativpronomen זֶה unidiomatisch nachzubilden.
- source_word: מְחִיר
  choice: Geld
  rationale: Das Wort bezeichnet hier den Kaufpreis beziehungsweise die zum Kauf verfügbaren Mittel. Im Zusammenhang mit „in der Hand“ und „kaufen“ ist „Geld“ im Deutschen anschaulich und idiomatisch.
- source_word: בְּיַד
  choice: in der Hand
  rationale: Die konkrete Bildsprache des Hebräischen bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: כְּסִיל
  choice: ein Narr
  rationale: „Narr“ ist die etablierte, würdige Bezeichnung für den moralisch und geistig uneinsichtigen Menschen in der biblischen Weisheitsliteratur.
- source_word: לִקְנוֹת
  choice: um … zu kaufen
  rationale: Der Infinitiv bezeichnet im Zusammenhang mit מְחִיר einen Kauf und setzt das kommerzielle Bild unmittelbar fort.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und sachlich treffende Wiedergabe für die moralische und praktische Weisheit im Buch der Sprüche.
- source_word: וְלֶב אָיִן
  choice: obwohl ihm der Verstand fehlt
  rationale: Wörtlich steht „und kein Herz“. לֵב bezeichnet im Hebräischen auch das innere Vermögen zu verstehen, zu urteilen und zu wollen. „Verstand“ macht den hier maßgeblichen Sinn für heutige Leser deutlich; „obwohl“ drückt den adversativen Zusammenhang natürlich aus, ohne die Spannung aufzulösen.
