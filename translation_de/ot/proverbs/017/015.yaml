id: PRO.17.15
reference: Proverbs 17:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מַצְדִּ֣יק רָ֭שָׁע וּ/מַרְשִׁ֣יעַ צַדִּ֑יק תּוֹעֲבַ֥ת יְ֝הוָ֗ה גַּם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/015.yaml
  text: The one who acquits the wicked and the one who condemns the righteous—both alike are an abomination to Yahweh[a].
translation:
  language: de
  text: Wer einen Schuldigen freispricht und wer einen Gerechten schuldig spricht – beide sind Jahwe ein Gräuel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer einen Gottlosen für gerecht erklärt und wer einen Gerechten für schuldig erklärt – beide sind Jahwe ein Gräuel.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצְדִּיק
  choice: freispricht
  rationale: Das Hifil-Partizip von צדק ist im Parallelismus forensisch gebraucht. „Freisprechen“ gibt die richterliche Erklärung zugunsten einer Person in klarem, heutigem Deutsch wieder, ohne die mögliche dogmatische Aufladung von „rechtfertigen“ einzutragen.
- source_word: רָשָׁע
  choice: einen Schuldigen
  rationale: רָשָׁע bezeichnet einen moralisch schuldigen bzw. gesetzesbrecherischen Menschen. Im gerichtlichen Zusammenhang ist „einen Schuldigen“ natürlich; die Fußnote bewahrt die breitere Wiedergabe „einen Gottlosen“.
- source_word: וּמַרְשִׁיעַ
  choice: und wer … schuldig spricht
  rationale: Das Hifil-Partizip von רשע bedeutet im gerichtlichen Gebrauch, jemanden für schuldig zu erklären. „Schuldig sprechen“ bildet den präzisen Gegenpol zu „freisprechen“.
- source_word: צַדִּיק
  choice: einen Gerechten
  rationale: צַדִּיק bezeichnet hier einen Menschen, der im Recht ist, und trägt zugleich ethischen Klang. „Einen Gerechten“ bewahrt diese forensisch-moralische Spannweite besser als das engere „einen Unschuldigen“.
- source_word: תּוֹעֲבַת
  choice: ein Gräuel
  rationale: תּוֹעֵבָה ist ein starkes Wort für etwas, das Jahwe verabscheut. „Ein Gräuel“ bewahrt Stärke und biblische Würde und bleibt im modernen Standarddeutsch verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ transliteriert und nicht durch einen Titel ersetzt.
- source_word: גַּם שְׁנֵיהֶם
  choice: beide
  rationale: Die Wendung schließt beide genannten Personen gleichermaßen in das Urteil ein. Im Deutschen bringt „beide“ diese Betonung knapp und natürlich zum Ausdruck.
theological_decisions:
- issue: Forensischer oder allgemein moralischer Sinn der Verben צדק und רשע
  choice: 'Gerichtssprache: „freispricht“ und „schuldig spricht“'
  alternative: 'Allgemeiner: „für gerecht erklärt“ und „für gottlos erklärt“ bzw. „als gerecht/gottlos behandelt“'
  rationale: Die beiden Hifil-Partizipien bilden einen gerichtlichen Gegensatz. Die forensische Wiedergabe bewahrt den unmittelbaren Sinn der Aussage über Rechtsverdrehung, ohne spätere dogmatische Bedeutungen von „rechtfertigen“ in den Vers hineinzulesen.
translation_notes:
  register: Knapper, würdiger Spruchstil in modernem Standarddeutsch. Der Gedankenstrich markiert den Übergang von den beiden parallelen Fällen zum gemeinsamen Gottesurteil. „Jahwe“ gibt den Gottesnamen wieder; „Gräuel“ erhält die starke moralische Wertung des Hebräischen.
