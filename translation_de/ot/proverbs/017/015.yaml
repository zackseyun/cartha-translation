  source_fidelity: 'Die Übersetzung gibt den forensischen Parallelismus der beiden Hifil-Partizipien zutreffend wieder: einen Schuldigen freisprechen gegenüber einen Gerechten schuldig sprechen. „Schuldiger“ ist im gerichtlichen Kontext für רָשָׁע vertretbar, auch wenn das hebräische Wort zugleich die weitergehende moralische Nuance „gottlos/wicked“ tragen kann; diese ist sinnvoll in der Fußnote vermerkt. „Beide sind Jahwe ein Gräuel“ entspricht der starken abschließenden Bewertung samt der Betonung auf beide Beteiligten.'
  naturalness: Der Satz ist idiomatisches, modernes Standarddeutsch und bewahrt den knappen, gewichtigen Spruchstil. Die Konstruktion „Wer … und wer … – beide …“ sowie der Gedankenstrich funktionieren natürlich. „Ein Gräuel“ ist verständlich und angemessen stark.
  terminology: „Jahwe“ gibt יהוה konsistent wieder. „Freisprechen“ und „schuldig sprechen“ bilden im Deutschen einen klaren juristischen Gegensatz. „Gerechter“ bewahrt die ethisch-forensische Offenheit von צַדִּיק. Die Fußnote bietet eine echte lexikalische Alternative, ohne eine konfessionelle Deutung einzutragen.
