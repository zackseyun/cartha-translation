  text: עֲטֶ֣רֶת זְ֭קֵנִים בְּנֵ֣י בָנִ֑ים וְ/תִפְאֶ֖רֶת בָּנִ֣ים אֲבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/006.yaml
  text: Grandchildren are the crown of the aged[b][a], and the glory of children is their fathers.
translation:
  language: de
  text: Enkel[a] sind die Krone der Alten[b], und die Ehre der Kinder sind ihre Väter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Kinder von Kindern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der alten Männer“. Das hebräische Wort bezeichnet hier alte Menschen und nicht notwendigerweise Älteste in einem Leitungsamt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: Krone
  rationale: Das Substantiv bezeichnet eine Krone oder einen Kranz als Sinnbild von Ehre und Auszeichnung. „Krone“ bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: זְקֵנִים
  choice: die Alten
  rationale: Gemeint sind alte Menschen, nicht Amtsträger oder Mitglieder eines Ältestenkreises. „Die Alten“ ist knapp und bewahrt die substantivische Form des Hebräischen.
- source_word: בְּנֵי בָנִים
  choice: Enkel
  rationale: Die wörtliche Wendung „Kinder von Kindern“ bezeichnet idiomatisch die Enkel. „Enkel“ ist die natürliche moderne deutsche Entsprechung.
- source_word: תִפְאֶרֶת
  choice: Ruhm
  rationale: Das Wort kann Herrlichkeit, Pracht, Zierde oder Ruhm bezeichnen. „Ruhm“ bewahrt den gehobenen Ton und entspricht dem parallelen Ehrenbild der „Krone“.
- source_word: בָּנִים
  choice: Kinder
  rationale: Der grammatisch maskuline Plural kann in diesem allgemeinen familiären Weisheitsspruch Kinder insgesamt bezeichnen. „Kinder“ gibt diesen umfassenden Bezug im Deutschen natürlich wieder.
- source_word: אֲבוֹתָם
  choice: ihre Väter
  rationale: Der hebräische Ausdruck nennt ausdrücklich die Väter. Die Wiedergabe behält diese geschlechtsspezifische Familienbezeichnung bei, statt sie zu „Eltern“ zu verallgemeinern.
theological_decisions:
- issue: Geschlechtsspezifische Familienbegriffe in einem allgemeinen Weisheitsspruch
  choice: בָּנִים wird mit „Kinder“, אֲבוֹתָם dagegen ausdrücklich mit „ihre Väter“ wiedergegeben.
  alternative: Beide Begriffe könnten formal maskulin als „Söhne“ und „ihre Väter“ oder verallgemeinernd als „Kinder“ und „ihre Eltern“ übersetzt werden.
  rationale: Der Spruch formuliert eine allgemeine Aussage über die Ehre zwischen den Generationen. בָּנִים kann dabei repräsentativ „Kinder“ meinen, während אֲבוֹתָם ausdrücklich die Väter bezeichnet. So wird weder der allgemeine Sinn unnötig eingeschränkt noch die konkrete maskuline Bezeichnung eingeebnet.
translation_notes:
  register: Moderner, würdevoller Spruchstil mit bewahrtem Parallelismus und den zentralen Bildern „Krone“ und „Ruhm“. „Die Alten“ ist bewusst allgemein und nicht amtlich verstanden.
