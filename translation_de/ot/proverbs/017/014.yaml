  text: פּ֣וֹטֵֽר מַ֭יִם רֵאשִׁ֣ית מָד֑וֹן וְ/לִ/פְנֵ֥י הִ֝תְגַּלַּ֗ע הָ/רִ֥יב נְטֽוֹשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/014.yaml
  text: The beginning of strife is like letting out water[b][a]; so abandon the quarrel before it breaks out.
translation:
  language: de
  text: Der Beginn eines Streits ist wie das Freilassen von Wasser[a]; gib den Streit auf, bevor er losbricht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Einer, der Wasser freilässt, [ist] der Beginn eines Streits.« Das Bild kann das Öffnen einer Bresche in einem Damm oder Wasserlauf nahelegen: Ist das Wasser einmal freigesetzt, lässt es sich nur schwer aufhalten.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit »losbricht« wiedergegebene hebräische Verb ist schwierig. Möglich sind auch Bedeutungen wie »hervorbricht«, »offen zutage tritt« oder »eskaliert«.
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹטֵר מַיִם
  choice: Wer Wasser freilässt
  rationale: Das Partizip פּוֹטֵר bezeichnet ein Öffnen oder Freigeben. Zusammen mit מַיִם entsteht das konkrete Bild von Wasser, das durch eine Öffnung oder Bresche entweicht und sich danach nur schwer aufhalten lässt.
- source_word: רֵאשִׁית מָדוֹן
  choice: setzt Streit in Gang
  rationale: רֵאשִׁית bezeichnet den Anfang oder ersten Abschnitt, מָדוֹן streitigen Konflikt. Die deutsche Wendung gibt die syntaktisch knappe Bildaussage natürlich wieder, ohne die Aussage zu einer ausdrücklichen Gleichsetzung zu erweitern.
- source_word: וְלִפְנֵי
  choice: darum ... bevor
  rationale: Die Konjunktion verbindet Bild und Mahnung folgernd; לִפְנֵי markiert den Zeitpunkt, zu dem der Streit noch aufgegeben werden soll.
- source_word: הִתְגַּלַּע
  choice: losbricht
  rationale: Das schwierige Verb kann ein Hervorbrechen, Offenbarwerden oder Sichentblößen bezeichnen. »Losbricht« passt zur Wassermetapher und bezeichnet den Übergang zu offenem, schwer beherrschbarem Streit.
- source_word: הָרִיב
  choice: der Zank
  rationale: רִיב bezeichnet einen Streit oder Rechtsstreit. »Zank« vermeidet eine unnatürliche unmittelbare Wiederholung von »Streit« und passt hier zum zwischenmenschlichen Konflikt.
- source_word: נְטוֹשׁ
  choice: lass ... ab
  rationale: Der Imperativ fordert dazu auf, den Streit fahrenzulassen beziehungsweise nicht weiterzuführen. »Lass vom Zank ab« ist deutlich, idiomatisch und bewahrt den auffordernden Charakter.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Spruchsprache mit einem konkreten, unmittelbar verständlichen Wasserbild. Die beiden Konfliktbegriffe מָדוֹן und רִיב werden differenziert als »Streit« und »Zank« wiedergegeben. Die Unsicherheit des seltenen Verbs הִתְגַּלַּע wird in einer Fußnote offengehalten.
