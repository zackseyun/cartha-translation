  text: A wicked man takes a bribe from the bosom to pervert the paths of justice[a][b].
translation:
  language: de
  text: Ein Frevler nimmt Bestechungsgeld aus dem Schoß[a], um die Wege des Rechts zu beugen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus dem Gewandbausch«. Das hebräische Wort bezeichnet den Schoß oder Busen und kann den durch das Gewand gebildeten, zum Verbergen geeigneten Bereich meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um den Lauf des Rechts zu verdrehen«; wörtlich steht hier die Mehrzahl »Wege«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: Bestechungsgeschenk
  rationale: Das Substantiv bezeichnet hier eine unerlaubte Gabe, die ein Urteil oder Verhalten beeinflussen soll. »Bestechungsgeschenk« ist im Deutschen eindeutig und bewahrt zugleich den Gabe-Charakter des hebräischen Wortes.
- source_word: מֵחֵיק
  choice: aus dem Bausch des Gewandes
  rationale: חֵיק bezeichnet den Brust- oder Schoßbereich und kann besonders den durch das Gewand gebildeten Bausch meinen, in dem etwas verborgen übergeben wird. Die konkrete Wendung bewahrt das hebräische Bild und lässt die Heimlichkeit erkennen, ohne sie bloß abstrakt wiederzugeben.
- source_word: רָשָׁע
  choice: ein Frevler
  rationale: Das substantivierte Adjektiv bezeichnet einen schuldhaft bösen oder rechtswidrig handelnden Menschen. »Ein Frevler« gibt die singularische, sprichwörtlich-repräsentative Form knapp und würdig wieder.
- source_word: יִקָּח
  choice: nimmt
  rationale: לקח bedeutet grundsätzlich »nehmen«. Im Zusammenhang ist das Annehmen einer Bestechung gemeint; »nimmt« bleibt nahe am Ausgangstext und ist im Deutschen verständlich.
- source_word: לְהַטּוֹת
  choice: um … zu beugen
  rationale: Der Infinitiv von נטה bezeichnet hier das Abbiegen oder Abbringen vom rechten Verlauf. »Beugen« passt zum Rechtskontext und erhält das räumliche Bild der abgelenkten Pfade.
- source_word: אָרְחוֹת
  choice: Pfade
  rationale: Das Wort bezeichnet Wege oder Pfade. »Pfade« bewahrt die im Spruch verwendete Wegmetapher und die Pluralform.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: מִשְׁפָּט kann Gericht, Urteil, Recht oder Gerechtigkeit bezeichnen. Im Zusammenhang mit Bestechung meint es die gerechte Rechtsordnung beziehungsweise Rechtsprechung; »Recht« erhält diese Bedeutungsbreite knapp.
- source_word: אָרְחוֹת מִשְׁפָּט
  choice: die Pfade des Rechts
  rationale: Die Formulierung bewahrt die hebräische Pluralmetapher. Gemeint sind die Wege, auf denen Recht beziehungsweise gerechtes Urteil zustande kommt.
