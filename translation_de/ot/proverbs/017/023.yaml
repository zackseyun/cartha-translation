translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter Wegmetapher. »Frevler« ist leicht gehoben, im Weisheitsspruch jedoch prägnant und natürlich. Die ungewöhnliche konkrete Wendung »aus dem Bausch des Gewandes« erhält bewusst das Bild einer verdeckten Übergabe; die Fußnote erläutert es.
