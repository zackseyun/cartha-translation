  text: A rebuke goes deeper into a man of understanding than a hundred blows into a fool[a].
translation:
  language: de
  text: Eine Zurechtweisung dringt bei einem Verständigen tiefer ein, als wenn man einen Narren hundertmal schlägt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine Zurechtweisung wirkt bei einem Verständigen stärker als hundert Schläge bei einem Narren.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּחַת
  choice: dringt tiefer … ein
  rationale: Das Verb נחת bezeichnet hier ein Hinab- oder Eindringen und im Zusammenhang die tiefere Wirkung einer Zurechtweisung. Die Formulierung bewahrt zugleich den Vergleich mit der folgenden מִן-Konstruktion.
- source_word: גְּעָרָה
  choice: eine Zurechtweisung
  rationale: Das Substantiv bezeichnet eine deutliche verbale Rüge oder Korrektur. „Zurechtweisung“ ist im modernen Standarddeutsch verständlich, würdig und passt zum Stil der Weisheitsliteratur.
- source_word: בְמֵבִין
  choice: in einen verständigen Mann
  rationale: מֵבִין ist ein maskulines Partizip im Singular und bezeichnet einen Menschen, der versteht beziehungsweise Einsicht besitzt. „Verständiger Mann“ erhält die grammatische Form und den sprichwörtlich-repräsentativen Charakter.
- source_word: מֵהַכּוֹת
  choice: als hundert Schläge in
  rationale: Das vorangestellte מִן kennzeichnet den Vergleich; der Infinitiv von נכה bezeichnet das Schlagen. Die gewählte Fassung gibt den Sinn knapp und bildhaft wieder, ohne die Wirkung ausdrücklich in den Text hineinzulesen.
- source_word: כְּסִיל
  choice: einen Narren
  rationale: כְּסִיל ist in den Sprüchen ein fester Weisheitsbegriff für einen moralisch und geistig uneinsichtigen Menschen. „Narr“ bewahrt diesen Bedeutungsumfang besser als eine rein intellektuelle Bezeichnung.
- source_word: מֵאָה
  choice: hundert
  rationale: Die Zahl verstärkt den Gegensatz in zugespitzter, sprichwörtlicher Weise und wird direkt wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Struktur. Die Bildlichkeit des Eindringens und Schlagens sowie die maskuline Singularform des hebräischen מֵבִין bleiben erhalten.
