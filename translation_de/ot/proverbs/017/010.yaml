review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Kernbegriffe und den Vergleich korrekt wieder: גְּעָרָה als „Zurechtweisung“, מֵבִין als verständige Person, כְּסִיל als „Narr“ und die hyperbolische Zahl „hundert“. Die Wendung „hundert Schläge in einen Narren“ bildet die hebräische Konstruktion jedoch zu mechanisch nach. הַכּוֹת כְּסִיל מֵאָה bedeutet „einen Narren hundertmal schlagen“ bzw. in freierer Bildsprache „hundert Schläge bei einem Narren“, nicht Schläge, die „in“ ihn eindringen.'
  naturalness: „In einen verständigen Mann eindringen“ und besonders „hundert Schläge in einen Narren“ sind im modernen Standarddeutsch unnatürlich und erzeugen eine unbeabsichtigte Parallelisierung des Eindringens mit den Schlägen. „Bei einem Verständigen tiefer eindringen“ ist idiomatisch und bewahrt das Bild sowie den Vergleich.
  terminology: „Zurechtweisung“ und „Narr“ passen zum Register der Sprüche. „Verständiger“ ist eine natürliche substantivierte Wiedergabe des maskulinen Singulars; der generische, sprichwörtliche Charakter bleibt erhalten.
  issues:
