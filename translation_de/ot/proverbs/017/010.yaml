    issue: Unidiomatische und sachlich missverständliche Präposition im zweiten Vergleichsglied
    rationale: „Hundert Schläge in einen Narren“ lässt die Schläge wie etwas erscheinen, das in den Narren eindringt. Das hebräische Infinitivgefüge bezeichnet vielmehr das hundertmalige Schlagen eines Narren.
  - severity: low
    issue: Unnatürliche Rektion im ersten Vergleichsglied
    rationale: „In einen verständigen Mann eindringen“ ist hier weniger idiomatisch als „bei einem Verständigen tiefer eindringen“ und belastet die knappe Spruchform unnötig.
  revised_text: Eine Zurechtweisung dringt bei einem Verständigen tiefer ein, als wenn man einen Narren hundertmal schlägt.[a]
