  source_fidelity: Der Vergleichssinn von פָּגוֹשׁ … וְאַל wird mit „Lieber … als …“ zutreffend wiedergegeben. „Narr“ und „seiner Torheit“ entsprechen כְּסִיל und אִוַּלְתּוֹ angemessen. Für שַׁכּוּל ist „der man die Jungen geraubt hat“ jedoch etwas zu eng, da das Hebräische zunächst den Zustand des Beraubt- bzw. Verwaistseins bezeichnet und keine bestimmte Art des Verlusts festlegt.
  naturalness: Die knappe Vergleichsform ist idiomatisches modernes Standarddeutsch. „Die ihrer Jungen beraubt ist“ ist dabei zugleich natürlich und präziser als die kausative Form „der man die Jungen geraubt hat“.
  terminology: „Bärin“ ist angesichts des Bildes einer ihrer Jungen beraubten Mutter sachgerecht. „Narr“ bewahrt den weisheitlichen, ethisch geprägten Charakter von כְּסִיל; „Torheit“ ist als Entsprechung von אִוַּלְתּוֹ etabliert.
