  text: פָּג֬וֹשׁ דֹּ֣ב שַׁכּ֣וּל בְּ/אִ֑ישׁ וְ/אַל כְּ֝סִ֗יל בְּ/אִוַּלְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/012.yaml
  text: Better to meet a bear robbed of her cubs than a fool in his folly.
translation:
  language: de
  text: Lieber einer Bärin begegnen, die ihrer Jungen beraubt ist, als einem Narren in seiner Torheit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּגוֹשׁ
  choice: begegnen
  rationale: 'Der Infinitiv absolutus hat hier auffordernden bzw. vergleichenden Sinn: Es ist eher hinzunehmen, einer gefährlichen Bärin zu begegnen. Die knappe deutsche Vergleichsform mit „Lieber“ gibt diese Funktion natürlich wieder.'
- source_word: דֹּב שַׁכּוּל
  choice: einer Bärin, der man die Jungen geraubt hat
  rationale: דֹּב kann grammatisch Bär oder Bärin bezeichnen; der Kontext des Verlusts von Jungen legt eine Bärin nahe. שַׁכּוּל bezeichnet den Verlust bzw. die Beraubung der Jungen, nicht bloß eine räumliche Trennung.
- source_word: כְּסִיל
  choice: Narren
  rationale: Bezeichnet im Sprüchebuch nicht bloß mangelnde Intelligenz, sondern einen unvernünftigen, moralisch unbelehrbaren Menschen; „Narr“ bewahrt diese weisheitliche Bedeutung.
- source_word: אִוַּלְתּוֹ
  choice: seiner Torheit
  rationale: Die Wiedergabe wahrt die enge Wortverbindung zu „Narr“ und lässt offen, ob seine törichte Haltung oder ihr konkreter Ausbruch im Blick steht.
theological_decisions:
- issue: Vergleich zwischen tierischer Gefahr und menschlicher Torheit
  choice: 'Die zugespitzte Aussage bleibt uneingeschränkt stehen: Die Begegnung mit einem Narren in seiner Torheit ist schlimmer als die mit einer ihrer Jungen beraubten Bärin.'
  alternative: Die Aussage als bloße Warnung vor unvernünftigem Verhalten abschwächen.
  rationale: Der hebräische Vergleich ist bewusst drastisch und stellt die zerstörerische Gefahr der Torheit heraus; eine Abschwächung würde die weisheitliche Spannung auflösen.
translation_notes:
  register: Knappes, bildkräftiges und würdiges Standarddeutsch. Die Konstruktion mit „Lieber … als …“ gibt den idiomatischen Sinn wieder, ohne das Bild zu erklären oder abzuschwächen.
