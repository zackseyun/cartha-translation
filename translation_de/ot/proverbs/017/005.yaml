base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/005.yaml
  text: Whoever mocks the poor insults his Maker[c][b][a]; he who rejoices at calamity will not go unpunished.
translation:
  language: de
  text: Wer den Armen verspottet[a], schmäht dessen Schöpfer[b]; wer sich über Unglück freut, bleibt nicht ungestraft[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verhöhnt“ beziehungsweise „über den Armen spottet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den, der ihn gemacht hat“.'
    reason: source_form
  - marker: c
    text: 'Oder: „wird nicht für unschuldig erklärt werden“ beziehungsweise „wird nicht freigesprochen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹעֵג
  choice: verspottet
  rationale: Das Partizip bezeichnet spöttisches, verächtliches Reden. „Verspottet“ gibt diese aktive Geringschätzung knapp und natürlich wieder.
- source_word: לָרָשׁ
  choice: den Armen
  rationale: רָשׁ bezeichnet einen armen oder mittellosen Menschen. Der bestimmte Singular passt zur allgemeinen, sprichwörtlichen Aussage des Hebräischen.
- source_word: חֵרֵף
  choice: schmäht
  rationale: Das Verb bedeutet, jemanden mit Verachtung zu behandeln oder zu verhöhnen. „Schmäht“ bewahrt den starken Vorwurfscharakter, ohne den Ausdruck vorschnell kultisch als „lästern“ festzulegen.
- source_word: עֹשֵׂהוּ
  choice: dessen Schöpfer
  rationale: Wörtlich steht hier „der ihn gemacht hat“. Das Suffix verweist am natürlichsten auf den Armen; „dessen Schöpfer“ erhält sowohl diesen Rückbezug als auch die Aussage über Gott als Schöpfer.
- source_word: שָׂמֵחַ
  choice: sich freut
  rationale: Die Form beschreibt eine Haltung der Freude. Die reflexive deutsche Wendung ist idiomatisch und entspricht dem sprichwörtlichen Charakter.
- source_word: לְאֵיד
  choice: über Unglück
  rationale: אֵיד bezeichnet hereinbrechendes Unglück, Verderben oder eine Katastrophe. „Unglück“ ist im Deutschen breit genug, um die allgemeine Aussage nicht unnötig einzuengen.
- source_word: לֹא יִנָּקֶה
  choice: bleibt nicht ungestraft
  rationale: Der Niphal von נקה kann ausdrücken, dass jemand nicht straffrei ausgeht beziehungsweise nicht als unschuldig gilt. „Bleibt nicht ungestraft“ vermittelt die moralisch-gerichtliche Folge in natürlichem Deutsch.
theological_decisions:
- issue: Bezug von „dessen Schöpfer“
  choice: Der Schöpfer des Armen ist gemeint; wer den Armen verspottet, schmäht damit Gott.
  alternative: Allgemeiner „den Schöpfer“ ohne ausdrücklichen possessiven Rückbezug.
  rationale: Das Suffix in עֹשֵׂהוּ weist grammatisch am ehesten auf den Armen zurück. Die Übersetzung bewahrt so die im Text begründete Würde des Armen, ohne die Aussage auszubauen.
- issue: Bedeutung der abschließenden Gerichtsformel
  choice: „bleibt nicht ungestraft“
  alternative: „wird nicht für unschuldig gelten“ oder „wird nicht freigesprochen“
  rationale: Die hebräische Form lässt sowohl die Vorstellung des Nicht-straffrei-Ausgehens als auch die des Nicht-für-unschuldig-Erklärtwerdens anklingen. Der Haupttext verwendet die im deutschen Sprichwortstil natürlichste Form; die Fußnote hält die gerichtliche Alternative offen.
- issue: Generische Personenbezeichnung
  choice: Zweimaliges „wer“ ohne zusätzliches Personalpronomen
  alternative: „Derjenige, der …“ oder eine grammatisch maskuline Personenbezeichnung.
  rationale: Die hebräischen maskulinen Singularformen sind hier generisch. Das deutsche „wer“ bewahrt den allgemeinen Singular und liest sich zugleich natürlich, ohne den Geltungsbereich auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in knapper Spruchform. Der parallele Satzbau mit zweimaligem „wer“ bildet die beiden hebräischen Aussagen klar ab. „Schmäht“ ist bewusst stärker als „beleidigt“, aber weniger kultisch festgelegt als „lästert“.
