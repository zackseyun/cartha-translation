source:
  edition: WLC
  text: לֹא נָאוָ֣ה לְ/נָבָ֣ל שְׂפַת יֶ֑תֶר אַ֝֗ף כִּֽי לְ/נָדִ֥יב שְׂפַת שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/007.yaml
  text: Excellent speech is not fitting for a fool[b][a]; how much less are lying lips for a noble man.
translation:
  language: de
  text: Treffliche Rede[a] passt nicht zu einem Toren – wie viel weniger lügende Lippen zu einem Edlen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hochtrabende Rede“. Der hebräische Ausdruck kann gehobene, übermäßige oder großsprecherische Rede bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einem Fürsten“ oder „einem Freigebigen“. Das hebräische Wort kann sich auf einen Menschen von vornehmem Rang oder edlem Charakter beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוָה
  choice: passt nicht zu
  rationale: Die Wendung bezeichnet, was angemessen oder schicklich ist. „Passt nicht zu“ ist gegenwärtiges, natürliches Deutsch und bewahrt den Gedanken der Unangemessenheit.
- source_word: נָבָל
  choice: einem Toren
  rationale: In der Weisheitsliteratur bezeichnet נָבָל einen sittlich wie geistig uneinsichtigen Menschen. „Tor“ ist die knappe, traditionsnahe Gattungsbezeichnung und meint mehr als bloß geringe Intelligenz.
- source_word: שְׂפַת יֶתֶר
  choice: Treffliche Rede
  rationale: Wörtlich steht „Lippe/Rede des יתר“. יתר kann Überlegenheit, Erhabenheit oder Übermaß bezeichnen. „Treffliche Rede“ gibt im Zusammenhang gehobene oder vorzügliche Rede wieder, ohne die mögliche Nuance hochtrabender Rede auszuschließen; diese wird in der Fußnote genannt.
- source_word: אַף כִּי
  choice: wie viel weniger
  rationale: 'Die idiomatische Wendung kennzeichnet einen steigernden Schluss: Wenn schon das Erste unpassend ist, gilt dies erst recht für das Zweite.'
- source_word: נָדִיב
  choice: einem Edlen
  rationale: נָדִיב kann einen Menschen von hohem Rang oder von edler, freigebiger Gesinnung bezeichnen. „Edler“ lässt den sozialen und charakterlichen Sinn offen und bildet einen prägnanten Gegensatz zum Toren.
- source_word: שְׂפַת שָׁקֶר
  choice: lügende Lippen
  rationale: Die Wiedergabe bewahrt das konkrete Bild des hebräischen „Lippe der Lüge/Falschheit“ und klingt im Deutschen idiomatisch und sprichwortartig.
theological_decisions: []
translation_notes:
  register: Knappes, parallel gebautes Weisheitswort in modernem, würdigem Standarddeutsch. Der Gedankenstrich macht den steigernden Vergleich gut erfassbar; „Tor“ und „Edler“ erhalten den pointierten Gegensatz der Personenbezeichnungen.
