source:
  edition: WLC
  text: אָדָ֣ם חֲסַר לֵ֭ב תּוֹקֵ֣עַ כָּ֑ף עֹרֵ֥ב עֲ֝רֻבָּ֗ה לִ/פְנֵ֥י רֵעֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/018.yaml
  text: A man lacking sense shakes hands[c][b][a], pledging security before his neighbor.
translation:
  language: de
  text: Ein Mensch ohne Verstand gibt den Handschlag[a] und übernimmt vor seinem Mitmenschen eine Bürgschaft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „schlägt die Hand“. Gemeint ist der Handschlag, mit dem eine Verpflichtung oder Bürgschaft bekräftigt wurde.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „verbürgt sich“. „Vor seinem Mitmenschen“ kann auch „in Gegenwart seines Mitmenschen“ bedeuten; dessen genaue Rolle bleibt offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: Ein Mensch
  rationale: Das singularische אָדָם bezeichnet hier die einzelne, beispielhafte Person eines Weisheitsspruchs. „Ein Mensch“ gibt die allgemeine Aussage im modernen Deutschen natürlich wieder.
- source_word: חֲסַר לֵב
  choice: ohne Verstand
  rationale: Wörtlich bedeutet die Wendung „ohne Herz“. In der hebräischen Weisheitsliteratur steht „Herz“ häufig für Einsicht, Urteilsvermögen und vernünftige Besonnenheit; „ohne Verstand“ gibt diesen idiomatischen Sinn verständlich wieder.
- source_word: תּוֹקֵעַ כָּף
  choice: gibt den Handschlag
  rationale: Die Wendung bezeichnet wörtlich das Schlagen der Hand und meint den Handschlag als bekräftigende Geste beim Eingehen einer Verpflichtung. Die Formulierung wahrt das konkrete Bild, ohne einen gewöhnlichen Begrüßungshandschlag nahezulegen.
- source_word: עֹרֵב עֲרֻבָּה
  choice: übernimmt … eine Bürgschaft
  rationale: Das verwandte Verb und Substantiv bezeichnen nachdrücklich das Eintreten als Bürge beziehungsweise die Übernahme einer Sicherheit. „Eine Bürgschaft übernehmen“ ist im Deutschen klar und rechtlich-finanziell passend.
- source_word: לִפְנֵי רֵעֵהוּ
  choice: vor seinem Mitmenschen
  rationale: לִפְנֵי bedeutet am ehesten „vor/in Gegenwart von“. „Vor seinem Mitmenschen“ erhält diese räumlich-soziale Formulierung, ohne festzulegen, ob der Mitmensch Begünstigter, Gläubiger oder Zeuge ist.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Parallelismus bleibt knapp; die Rechts- und Finanzsprache wird ohne unnötigen Fachjargon wiedergegeben. Die Mehrdeutigkeit von לִפְנֵי רֵעֵהוּ wird nicht zugunsten einer bestimmten Beziehung zwischen den Beteiligten aufgelöst.
