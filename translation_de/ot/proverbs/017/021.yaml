  text: יֹלֵ֣ד כְּ֭סִיל לְ/ת֣וּגָה ל֑/וֹ וְ/לֹֽא יִ֝שְׂמַ֗ח אֲבִ֣י נָבָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/021.yaml
  text: He who fathers a fool does so to his own grief[b][a], and the father of a fool has no joy.
translation:
  language: de
  text: Wer einen Toren zeugt, hat Kummer davon[a]; und der Vater eines Niederträchtigen[b] freut sich nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wer einen Toren zeugt, [zeugt ihn] sich zum Kummer.“ Die hebräische Formulierung ist sehr knapp.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet hier einen moralisch gemeinen oder schändlichen Menschen, nicht bloß jemanden mit geringer Einsicht.
    reason: cultural_note
lexical_decisions:
- source_word: יֹלֵד
  choice: Wer … zeugt
  rationale: Das substantivisch gebrauchte Qal-Partizip bezeichnet hier denjenigen, der ein Kind zeugt. Wegen der Parallele zu „Vater“ ist die väterliche Bedeutung gemeint.
- source_word: כְּסִיל
  choice: einen Toren
  rationale: כְּסִיל ist ein typischer Weisheitsbegriff für einen uneinsichtigen, moralisch wie verstandesmäßig verkehrten Menschen. „Tor“ bewahrt diesen weiteren Sinn besser als eine rein intellektuelle Bezeichnung.
- source_word: לְתוּגָה לוֹ
  choice: dem bringt es Kummer
  rationale: Die knappe hebräische Fügung bezeichnet den Kummer, der dem Zeugenden daraus erwächst. Die deutsche Formulierung gibt diese Folge natürlich wieder, ohne das im Hebräischen nur implizite Objekt ausdrücklich festzulegen.
- source_word: וְלֹא יִשְׂמַח
  choice: hat keine Freude
  rationale: Das Imperfekt formuliert eine allgemeine, sprichwörtliche Folge. „Hat keine Freude“ entspricht dem verneinten Sichfreuen in idiomatischem Deutsch.
- source_word: אֲבִי נָבָל
  choice: der Vater eines Niederträchtigen
  rationale: Die Constructusverbindung bezeichnet den Vater eines נָבָל. „Niederträchtiger“ hebt dessen moralisch verwerflichen und schändlichen Charakter hervor und unterscheidet den Ausdruck sachgerecht von כְּסִיל.
theological_decisions:
- issue: Unterscheidung zwischen כְּסִיל und נָבָל
  choice: „Tor“ im ersten Halbvers, „Niederträchtiger“ im zweiten
  alternative: beide Wörter mit „Tor“ wiedergeben
  rationale: Die beiden hebräischen Wörter überlappen, sind aber nicht identisch. נָבָל trägt besonders die Bedeutung moralischer Gemeinheit und Schändlichkeit; die unterschiedliche Wiedergabe bewahrt diese Spannung, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwörtlicher Knappheit. „Zeugen“ erhält die väterliche Perspektive der Parallelstruktur; „Niederträchtiger“ bewahrt die ethische Schärfe von נָבָל.
