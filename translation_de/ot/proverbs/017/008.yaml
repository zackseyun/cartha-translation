  variant: modern standard German
source:
  edition: WLC
  text: אֶֽבֶן חֵ֣ן הַ֭/שֹּׁחַד בְּ/עֵינֵ֣י בְעָלָ֑י/ו אֶֽל כָּל אֲשֶׁ֖ר יִפְנֶ֣ה יַשְׂכִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/008.yaml
  text: A bribe is a charm-stone in the eyes of its owner[a]; wherever he turns[b], he prospers.
translation:
  language: de
  text: Eine Bestechungsgabe ist in den Augen ihres Besitzers ein Glücksstein[a]; wohin er sich auch wendet, hat er Erfolg[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „ein Stein der Gunst“; auch „ein kostbarer Stein“ oder „ein Zauberstein“.
    reason: lexical_alternative
  - marker: b
    text: Oder „gelingt es ihm“. Das hebräische Verb kann erfolgreiches beziehungsweise umsichtiges Handeln und den daraus folgenden Erfolg bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן חֵן
  choice: Glücksstein
  rationale: Die Wendung bedeutet wörtlich „Stein der Gunst“. „Glücksstein“ bewahrt das Bild eines Steins und vermittelt zugleich, dass der Besitzer der Bestechungsgabe eine erfolgbringende Wirkung zuschreibt. Die echte lexikalische Spannweite bleibt in der Fußnote erhalten.
- source_word: הַשֹּׁחַד
  choice: Bestechungsgabe
  rationale: Das Substantiv bezeichnet gewöhnlich eine Gabe, mit der jemand bestochen werden soll, nicht bloß ein neutrales Geschenk. „Bestechungsgabe“ ist im Deutschen präzise und lässt sich hier natürlicher mit „Besitzer“ verbinden als das abstraktere „Bestechung“.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die geläufige deutsche Wendung gibt das hebräische Perspektividiom unmittelbar wieder und macht deutlich, dass die Einschätzung diejenige des Besitzers ist.
- source_word: בְעָלָיו
  choice: ihres Besitzers
  rationale: Das Suffix bezieht sich auf die Bestechungsgabe. „Besitzer“ wahrt den Gedanken des Verfügens über sie, ohne die mögliche soziale Nebenbedeutung von „Herr“ einzutragen.
- source_word: אֶל כָּל אֲשֶׁר יִפְנֶה
  choice: wohin er sich auch wendet
  rationale: Die Formulierung gibt die umfassende, idiomatische Bedeutung des hebräischen Ausdrucks natürlich wieder und kann sowohl Richtungen als auch Unternehmungen einschließen.
- source_word: יַשְׂכִּיל
  choice: hat er Erfolg
  rationale: Im Hifil kann שכל erfolgreich oder umsichtig handeln und daraus folgend Erfolg haben bedeuten. Hier steht der praktische Erfolg der Bestechungsgabe im Vordergrund; die mögliche Nuance des Gelingens bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Beschreibt der Vers den Erfolg von Bestechung oder billigt er sie?
  choice: Die Aussage wird als Wahrnehmung des Besitzers und als nüchterne Beobachtung formuliert, ohne eine moralische Zustimmung hinzuzufügen.
  alternative: Durch einen Zusatz ausdrücklich erklären, dass Bestechung verurteilt wird.
  rationale: Der hebräische Text nennt Bestechung beim Namen und beschreibt ihre vermeintliche beziehungsweise praktische Wirksamkeit, enthält in diesem Vers aber keine ausdrückliche moralische Bewertung. Eine solche Ergänzung würde die Spannung des Spruchs vorschnell auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchstil. Die Bildsprache des Steins und die Perspektivformel „in den Augen“ bleiben erhalten; die Satzstellung folgt natürlichem Deutsch.
