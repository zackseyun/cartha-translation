  text: גַּ֤ם אֱוִ֣יל מַ֭חֲרִישׁ חָכָ֣ם יֵחָשֵׁ֑ב אֹטֵ֖ם שְׂפָתָ֣י/ו נָבֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/028.yaml
  text: Even a fool who keeps silent is considered wise; one who closes his lips[a], discerning.
translation:
  language: de
  text: Selbst ein Narr gilt als weise, wenn er schweigt; wer seine Lippen verschließt, gilt als verständig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: Selbst
  rationale: 'Die Partikel hat hier überraschend-konzessive Kraft: Sogar ein Narr kann unter der genannten Bedingung als weise gelten.'
- source_word: אֱוִיל
  choice: Narr
  rationale: Der Ausdruck bezeichnet in der Weisheitsliteratur einen Menschen, dem es an Einsicht und moralischer Urteilskraft fehlt. „Narr“ ist dafür eine prägnante, im Deutschen etablierte Wiedergabe.
- source_word: מַחֲרִישׁ
  choice: wenn er schweigt
  rationale: Das Partizip beschreibt das Unterlassen des Redens. Die konditionale Formulierung gibt im Deutschen natürlich wieder, unter welcher Voraussetzung der Narr als weise gilt.
- source_word: חָכָם יֵחָשֵׁב
  choice: gilt als weise
  rationale: Das Niphal von חשׁב bezeichnet hier das Eingeschätzt- oder Angesehenwerden. „Gilt als“ bewahrt den passiven, auf den äußeren Eindruck bezogenen Sinn.
- source_word: אֹטֵם
  choice: wer … verschließt
  rationale: Das Partizip bezeichnet wörtlich das Verschließen. Die konkrete Bildsprache wird beibehalten und bringt zugleich bewusste Zurückhaltung beim Reden zum Ausdruck.
- source_word: שְׂפָתָיו
  choice: seine Lippen
  rationale: Die wörtliche Körpermetapher des Hebräischen wird erhalten.
- source_word: נָבוֹן
  choice: verständig
  rationale: Das Wort bezeichnet einen einsichtigen, urteilsfähigen Menschen. „Verständig“ passt zum gehobenen, aber allgemein verständlichen Register eines Spruchs und steht sinnvoll neben „weise“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwörtlicher Form. Die konkrete Wendung „seine Lippen verschließt“ und die parallele Struktur des Hebräischen bleiben erhalten; die Ellipse im zweiten Halbvers wird durch die Fußnote kenntlich gemacht.
