  text: Whoever loves transgression loves strife[a]; he who makes his door high seeks destruction.
translation:
  language: de
  text: Wer Auflehnung liebt, liebt Streit; wer seinen Eingang[a] hoch macht, sucht Verderben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer seine Tür“ oder „sein Tor hoch macht, sucht Untergang.“ Das hebräische Wort kann Eingang, Türöffnung oder Tor bezeichnen. Das Bild kann auf überhebliche Selbsterhöhung, prunkvolles Bauen oder eine Gefahr anspielen; der Haupttext legt keine dieser Deutungen fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: liebt
  rationale: Das Qal-Partizip bezeichnet Liebe beziehungsweise bewusstes Gefallen an etwas. „Liebt“ bewahrt die zugespitzte Wiederholung beider Satzglieder.
- source_word: פֶּשַׁע
  choice: Auflehnung
  rationale: Das Substantiv bezeichnet einen willentlichen Bruch mit einer Ordnung und kann Rebellion oder Übertretung meinen. „Auflehnung“ gibt die bewusste Widersetzlichkeit stärker wieder als das allgemeinere „Vergehen“.
- source_word: מַצָּה
  choice: Streit
  rationale: Das Wort bezeichnet Auseinandersetzung oder Zwietracht. „Streit“ ist im heutigen Deutsch knapp, natürlich und für die allgemeine Aussage des Spruchs passend.
- source_word: מַגְבִּיהַּ
  choice: hoch baut
  rationale: Die Hifil-Form bedeutet „hoch machen/erhöhen“. Zusammen mit „Eingang“ gibt „hoch baut“ das konkrete bauliche Bild in natürlichem Deutsch wieder, ohne seine mögliche bildliche Bedeutung festzulegen.
- source_word: פִּתְחוֹ
  choice: seinen Eingang
  rationale: פֶּתַח bezeichnet eine Öffnung, einen Eingang oder eine Türöffnung. „Eingang“ lässt offen, ob eine Türöffnung oder ein größeres Tor gemeint ist.
- source_word: מְבַקֶּשׁ
  choice: sucht
  rationale: Das Partizip bedeutet gewöhnlich „suchen“. Die wörtliche Wiedergabe erhält die sprichwörtliche Ironie, dass das Verhalten den Untergang geradezu herbeiführt.
- source_word: שָׁבֶר
  choice: Zusammenbruch
  rationale: שֶׁבֶר kann Bruch, Einsturz, Unglück oder Verderben bezeichnen. „Zusammenbruch“ bewahrt sowohl den konkreten Bezug zum Bauwerk als auch die übertragene Bedeutung eines schweren Verderbens.
theological_decisions:
- issue: Deutung des hoch gebauten Eingangs
  choice: Das konkrete Bild bleibt im Haupttext stehen und wird nicht ausdrücklich als Hochmut gedeutet.
  alternative: „Wer sich selbst erhöht, sucht sein Verderben.“
  rationale: Der hebräische Text nennt tatsächlich den Eingang beziehungsweise die Türöffnung. Er kann auf überhebliche Selbsterhöhung, prunkvolles Bauen oder eine bauliche Gefahr anspielen; eine einzige Deutung sollte nicht in den Haupttext eingetragen werden.
translation_notes:
  register: Modernes, knappes und würdiges Sprichwortdeutsch. Die Wiederholung „liebt … liebt“ bildet die hebräische Parallelstruktur ab. Das konkrete und mehrdeutige Bild des zweiten Satzglieds bleibt erhalten.
