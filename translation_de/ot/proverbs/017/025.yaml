  source_fidelity: 'Der Entwurf gibt die beiden nominalen Prädikate des Hebräischen treffend wieder: Der „törichte Sohn“ entspricht בֵּן כְּסִיל, „Kummer“ ist für כַּעַס im Kontext gut vertretbar, und „Bitterkeit“ bewahrt die naheliegende, zugleich lexikalisch nicht völlig unstrittige Deutung von מֶמֶר. „Der Frau, die ihn geboren hat“ gibt לְיוֹלַדְתּוֹ sachgerecht und ohne unnötige Einengung wieder.'
  naturalness: „Ein törichter Sohn bereitet seinem Vater Kummer und der Frau, die ihn geboren hat, Bitterkeit“ ist verständliches, würdevolles modernes Standarddeutsch. Das ergänzte Verb „bereitet“ trägt beide Glieder klar und angemessen.
