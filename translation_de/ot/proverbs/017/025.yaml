source:
  edition: WLC
  text: כַּ֣עַס לְ֭/אָבִי/ו בֵּ֣ן כְּסִ֑יל וּ֝/מֶ֗מֶר לְ/יוֹלַדְתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/025.yaml
  text: A foolish son is grief to his father[b][a], and bitterness to the woman who bore him.
translation:
  language: de
  text: Ein törichter Sohn bereitet seinem Vater Kummer[a] und der Frau, die ihn geboren hat, Bitterkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verdruss“ oder „Zorn“. Das hebräische Wort kann verschiedene Formen schmerzlicher Erregung bezeichnen; hier ist wahrscheinlich der Kummer des Vaters gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Das seltene hebräische Wort kann auch bitteren Schmerz oder tiefe Verbitterung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעַס
  choice: Kummer
  rationale: Das Substantiv kann Zorn, Verdruss oder schmerzlichen Kummer bezeichnen. Im Parallelismus mit מֶמֶר steht hier wahrscheinlich die belastende Wirkung des törichten Sohnes auf den Vater im Vordergrund.
- source_word: לְאָבִיו
  choice: seinem Vater
  rationale: Die Präposition לְ bezeichnet hier die betroffene Person. Zusammen mit dem ergänzten Verb „bereitet“ ergibt sich natürliches Deutsch.
- source_word: בֵּן כְּסִיל
  choice: ein törichter Sohn
  rationale: כְּסִיל ist in den Sprüchen ein weisheitlicher Begriff für moralische und praktische Torheit, nicht bloß für mangelnde Intelligenz. „Töricht“ bewahrt diesen Sinn.
- source_word: וּמֶמֶר
  choice: und … Bitterkeit
  rationale: Das seltene Substantiv wird hier am plausibelsten als Bitterkeit oder bitterer Schmerz verstanden und bildet einen sinngleichen Parallelismus zu כַּעַס.
- source_word: לְיוֹלַדְתּוֹ
  choice: der Frau, die ihn geboren hat
  rationale: Die substantivierte Partizipialform bezeichnet wörtlich diejenige, die ihn geboren hat. Die Formulierung bewahrt das anschauliche mütterliche Bild des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das im Hebräischen fehlende Verb wurde mit „bereitet“ ergänzt, um den zweiteiligen Parallelismus natürlich und klar wiederzugeben; es gilt für beide Satzhälften.
