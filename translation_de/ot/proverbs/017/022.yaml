  text: A joyful heart promotes healing[a], but a crushed spirit dries up the bones.
translation:
  language: de
  text: Ein fröhliches Herz fördert die Heilung[a], aber ein niedergeschlagener Geist trocknet die Knochen aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tut gut wie eine Arznei“. Das hebräische Wort גֵּהָה kann Heilung, Genesung oder Heilmittel/Arznei bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב שָׂמֵחַ
  choice: ein fröhliches Herz
  rationale: „Herz“ bewahrt das hebräische Bild für den inneren Menschen; „fröhlich“ gibt die Freude in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: יֵיטִב
  choice: fördert
  rationale: Die Hifil-Form bezeichnet ein Gutestun beziehungsweise eine förderliche Wirkung. Zusammen mit גֵּהָה drückt „fördert“ den Zusammenhang idiomatisch aus, ohne eine sichere Heilwirkung zu behaupten.
- source_word: גֵּהָה
  choice: die Heilung
  rationale: Das seltene Substantiv kann Heilung, Genesung oder ein Heilmittel bezeichnen. „Heilung“ wahrt im Haupttext den breiten Vorgangssinn.
- source_word: רוּחַ נְכֵאָה
  choice: ein niedergeschlagener Geist
  rationale: רוּחַ meint hier die innere Lebenskraft oder Verfassung. נְכֵאָה bezeichnet einen gebeugten, zerschlagenen Zustand; „niedergeschlagen“ ist verständlich und wahrt den Gegensatz zum fröhlichen Herzen.
- source_word: תְּיַבֶּשׁ
  choice: lässt … verdorren
  rationale: Die Piel-Form bezeichnet ein intensives Austrocknen. „Verdorren lassen“ erhält das körperlich-konkrete und zugleich bildhafte Moment in natürlichem Deutsch.
- source_word: גָּרֶם
  choice: die Gebeine
  rationale: Der Singular wird kollektiv verstanden. „Gebeine“ wahrt die anthropologische Bildsprache des Hebräischen und klingt in einem Weisheitsspruch würdig.
