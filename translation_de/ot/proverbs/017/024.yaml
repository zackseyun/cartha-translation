  source_fidelity: 'Der Haupttext gibt die zentrale räumlich-bildhafte Gegenüberstellung treffend wieder: Weisheit ist dem Verständigen unmittelbar gegenwärtig, während die Augen des Toren sich in äußerster Ferne befinden. „steht … vor Augen“ ist eine idiomatische deutsche Entsprechung für אֶת־פְּנֵי und bewahrt zugleich das Sehbild. „am Ende der Erde“ entspricht dem singularischen בִּקְצֵה אָרֶץ; die Fußnote hält die mögliche Bedeutung „Land“ offen.'
