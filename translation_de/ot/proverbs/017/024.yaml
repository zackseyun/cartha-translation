  terminology: „Weisheit“, „Verständiger“ und „Tor“ sind für den Weisheitskontext konsistent und sachgerecht. Die Wiedergabe personifiziert Weisheit nicht stärker, als der hebräische Text es verlangt. Die Fußnotenanker stehen an den jeweils passenden Textstellen.
