id: PRO.17.24
reference: Proverbs 17:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֶת פְּנֵ֣י מֵבִ֣ין חָכְמָ֑ה וְ/עֵינֵ֥י כְ֝סִ֗יל בִּ/קְצֵה אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/024.yaml
  text: Wisdom is before the face of a discerning man[c][b][a], but the eyes of a fool are at the ends of the earth.
translation:
  language: de
  text: Weisheit steht dem Verständigen vor Augen[a], doch die Augen eines Toren sind am Ende der Erde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Weisheit ist vor dem Gesicht eines Verständigen“; möglich ist ebenso: „Weisheit ist beim Verständigen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am Ende des Landes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת פְּנֵי
  choice: steht … vor Augen
  rationale: Die Verbindung bezeichnet hier am besten etwas, das dem Verständigen unmittelbar gegenwärtig und zugänglich ist. „Vor Augen stehen“ bewahrt das konkrete Bild des Gesichts beziehungsweise Sehens und klingt zugleich natürlich auf Deutsch.
- source_word: מֵבִין
  choice: dem Verständigen
  rationale: Das substantivierte Partizip bezeichnet einen Menschen, der durch Einsicht und Urteilsvermögen gekennzeichnet ist. Die maskuline Singularform bleibt als sprichwörtlicher Repräsentant erhalten.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Das abstrakte Substantiv ist Subjekt des ersten Satzteils. Die Wiedergabe setzt keine eigenständige Personifikation voraus.
- source_word: וְעֵינֵי
  choice: doch die Augen
  rationale: Das Waw wird wegen des deutlichen Gegensatzes zwischen dem Verständigen und dem Toren adversativ mit „doch“ wiedergegeben.
- source_word: כְסִיל
  choice: eines Toren
  rationale: Das Wort bezeichnet in den Sprüchen regelmäßig einen Menschen, dessen Torheit sowohl mangelnde Einsicht als auch eine verfehlte Haltung umfasst. „Tor“ ist die geläufige, würdevolle deutsche Entsprechung.
- source_word: בִּקְצֵה אָרֶץ
  choice: am Ende der Erde
  rationale: Die räumliche Übertreibung stellt den abschweifenden Blick des Toren der nahen, verfügbaren Weisheit gegenüber. Die ungewöhnliche Bildhaftigkeit des Hebräischen wird bewahrt, ohne ein nicht ausdrücklich vorhandenes Tätigkeitsverb wie „schweifen“ in den Haupttext einzufügen.
theological_decisions:
- issue: Geschlecht des sprichwörtlichen Subjekts
  choice: dem Verständigen
  alternative: einem verständigen Menschen / wer verständig ist
  rationale: Die grammatisch maskuline Einzahl wird als sprichwörtlicher Typus wiedergegeben, ohne die Aussage auf einen bestimmten Mann zu beschränken oder den Ausgangstext unnötig zu neutralisieren.
- issue: Personifikation der Weisheit
  choice: Weisheit steht dem Verständigen vor Augen
  alternative: Die Weisheit steht als personifizierte Gestalt vor dem Verständigen
  rationale: Der Vers verlangt keine theologisch aufgeladene Personifikation. Die Formulierung lässt die poetische Hervorhebung der Weisheit bestehen, ohne ihr ausdrücklich personale Eigenschaften zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vor Augen stehen“ erhält das Sehbild des ersten Halbverses und schafft eine natürliche Verbindung zum ausdrücklichen Hinweis auf die Augen im zweiten Halbvers. Die auffällige Ortsangabe „am Ende der Erde“ bleibt als bewusste poetische Übertreibung erhalten.
