  verdict: revise
  source_fidelity: 'Die wesentlichen Begriffe sind zutreffend wiedergegeben: עֶבֶד als „Sklave“ bewahrt die soziale Umkehrung, מַשְׂכִּיל als „einsichtig“ ist angemessen, und „Brüder“ gibt אַחִים geschlechtsgenau wieder. Bei יַחֲלֹק נַחֲלָה ist jedoch im Kontext die Beteiligung des Sklaven am Erbe gemeint. „das Erbe teilen“ kann im Deutschen vorrangig bedeuten, dass er das Erbe unter anderen aufteilt, und ist deshalb missverständlich.'
  naturalness: Der Spruch ist knapp, würdig und modernes Standarddeutsch. Die Formulierung „Anteil am Erbe erhalten“ ist in diesem Kontext idiomatischer und verdeutlicht ohne unnötige Auslegung, dass der Sklave als Miterbe beteiligt wird.
  terminology: „Sklave“, „einsichtig“, „Schande bringt“ und „Brüder“ sind terminologisch tragfähig. Die Alternativfußnote zu Geschwistern wird sprachlich korrigiert; sie darf die maskuline Hauptlesart nicht ersetzen.
  issues:
  - severity: medium
    issue: „wird er das Erbe teilen“ ist im Deutschen mehrdeutig
    rationale: Es kann nahelegen, der Sklave nehme die Verteilung des Erbes vor. Das hebräische יַחֲלֹק נַחֲלָה bezeichnet hier wahrscheinlicher, dass er zusammen mit den Brüdern einen Erbanteil erhält.
  - severity: low
    issue: Fußnote b enthält eine grammatisch unvollständige Alternativform
    rationale: Nach „Oder allgemeiner:“ muss „Geschwister“ statt „Geschwistern“ stehen.
