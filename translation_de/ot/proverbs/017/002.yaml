  text: עֶֽבֶד מַשְׂכִּ֗יל יִ֭מְשֹׁל בְּ/בֵ֣ן מֵבִ֑ישׁ וּ/בְ/ת֥וֹךְ אַ֝חִ֗ים יַחֲלֹ֥ק נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/002.yaml
  text: A prudent servant will rule over a son who brings shame[b][a], and among brothers he will share the inheritance.
translation:
  language: de
  text: Ein einsichtiger Sklave[a] wird über einen Sohn herrschen, der Schande bringt; unter Brüdern[b] wird er Anteil am Erbe erhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Diener. Das hebräische Wort kann beides bezeichnen; »Sklave« hebt hier die soziale Umkehrung hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder allgemeiner: Geschwister. Im Hebräischen steht die maskuline Bezeichnung »Brüder«, wahrscheinlich für die Familienerben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: Sklave
  rationale: Das Wort bezeichnet einen rechtlich und sozial untergeordneten Menschen. »Sklave« bewahrt die für den Spruch entscheidende Umkehrung, dass ein Einsichtiger aus niedrigem Stand über einen beschämenden Sohn aufsteigen kann.
- source_word: מַשְׂכִּיל
  choice: einsichtig
  rationale: Das Partizip bezeichnet jemanden, der verständig und mit praktischem Erfolg handelt. »Einsichtig« passt zur Weisheitssprache der Sprüche, ohne den Ausdruck auf bloße Intelligenz zu verengen.
- source_word: יִמְשֹׁל בְּבֵן
  choice: wird über einen Sohn herrschen
  rationale: Das Verb bezeichnet Herrschaft oder Autorität; die Präposition markiert hier den, über den diese ausgeübt wird. Der unbestimmte »Sohn« entspricht dem allgemeinen Charakter eines Sprichworts.
- source_word: מֵבִישׁ
  choice: der Schande bringt
  rationale: Die Partizipialform beschreibt einen Sohn, der Schande verursacht, vermutlich für seine Familie. Die verbale deutsche Form erhält diesen aktiven Sinn.
- source_word: וּבְתוֹךְ אַחִים
  choice: und unter Brüdern
  rationale: Die Wendung bezeichnet seine Aufnahme in den Kreis der Brüder beziehungsweise Familienerben. Die maskuline Verwandtschaftsbezeichnung des Hebräischen bleibt erhalten.
- source_word: יַחֲלֹק נַחֲלָה
  choice: wird er das Erbe teilen
  rationale: חלק kann das Teilen beziehungsweise Zuteilen und im Kontext auch den Empfang eines Anteils bezeichnen. Die Formulierung wahrt diese Bedeutungsbreite besser als eine ausschließlich empfangsorientierte Wiedergabe.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung
  choice: Brüder
  alternative: Geschwister
  rationale: אַחִים ist eine maskuline Pluralform. »Brüder« bildet den Wortlaut und den damaligen Zusammenhang männlicher Erben genauer ab; eine mögliche weitere Bezugnahme auf Familienangehörige wird in der Fußnote erwähnt.
- issue: Soziale Stellung von עֶבֶד
  choice: Sklave
  alternative: Diener
  rationale: Die Pointe beruht auf der Umkehrung des gewöhnlichen sozialen und erbrechtlichen Rangs. »Sklave« macht den gebundenen und untergeordneten Status sichtbar, ohne die Aussage konfessionell auszudeuten.
- issue: Art der Beteiligung am Erbe
  choice: das Erbe teilen
  alternative: einen Anteil am Erbe erhalten
  rationale: Der hebräische Ausdruck lässt sowohl den Vorgang des Teilens als auch die Teilhabe durch den Empfang eines Anteils anklingen. Der Haupttext bewahrt diese Spannung, die Fußnote nennt die kontextuell naheliegende Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Satzstruktur. Das Semikolon macht die beiden parallelen Aussagen sichtbar. »Einsichtig« und »Schande bringt« sind allgemein verständlich und bewahren zugleich die verbale Aussagekraft des Hebräischen.
