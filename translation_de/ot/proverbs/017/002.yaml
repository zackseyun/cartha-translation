revisions:
- from: Ein einsichtiger Sklave[a] wird über einen Sohn herrschen, der Schande bringt; und unter Brüdern[b] wird er das Erbe teilen.[c]
  to: Ein einsichtiger Sklave[a] wird über einen Sohn herrschen, der Schande bringt; unter Brüdern[b] wird er Anteil am Erbe erhalten.
  rationale: Die Revision ersetzt die im Deutschen missverständliche Wendung „das Erbe teilen“ durch „Anteil am Erbe erhalten“. Damit wird die im Kontext gemeinte Teilhabe am Erbe klar wiedergegeben. Die entbehrliche semantische Fußnote entfällt; Fußnote b wird grammatisch berichtigt.
