  text: מֵשִׁ֣יב רָ֭עָה תַּ֣חַת טוֹבָ֑ה לֹא תמיש רָ֝עָ֗ה מִ/בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/013.yaml
  text: Whoever repays evil for good[a], evil will not depart from his house.
translation:
  language: de
  text: Wer Gutes mit Bösem vergilt, aus dessen Haus wird das Böse nicht weichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus dessen Haus wird das Unheil nicht weichen.“ Das zweite „Böse“ (רָעָה) kann sowohl moralisches Böses als auch Unheil oder Unglück bezeichnen; der Haupttext bewahrt die Wiederholung im Hebräischen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵשִׁיב
  choice: vergilt
  rationale: Das Partizip im Hifil von שׁוב bezeichnet hier eine erwidernde Gegenleistung. „Vergilt“ gibt diesen reziproken Sinn natürlich wieder.
- source_word: רָעָה
  choice: Böses
  rationale: Beim ersten Vorkommen bezeichnet das Wort schuldhaftes, schädigendes Handeln und bewahrt als „Böses“ die moralische Dimension.
- source_word: תַּחַת
  choice: mit
  rationale: Die Präposition bezeichnet hier Austausch beziehungsweise Erwiderung. In der deutschen Verbindung „etwas mit etwas vergelten“ wird dieser Sinn idiomatisch durch „mit“ ausgedrückt.
- source_word: טוֹבָה
  choice: Gutem
  rationale: Die breite Bedeutung „Gutes, Wohltat, Nutzen“ bleibt erhalten; „Gutem“ verengt den Spruch nicht auf eine bestimmte Art von Wohltat.
- source_word: לֹא תמיש
  choice: wird … nicht weichen
  rationale: Die Form von מוש bezeichnet hier ein Nicht-Entfernen beziehungsweise Nicht-Weggehen. „Nicht weichen“ gibt den bleibenden, anhaltenden Charakter würdig und verständlich wieder.
- source_word: רָעָה
  choice: das Böse
  rationale: Beim zweiten Vorkommen kann das Wort sowohl moralisches Böses als auch Unheil bezeichnen. Die Wiederholung von „Böses“ wahrt die markante hebräische Entsprechung; die mögliche Folge-Bedeutung wird in der Fußnote genannt.
- source_word: מִבֵּיתוֹ
  choice: von dessen Haus
  rationale: בַּיִת kann Haus, Haushalt oder Familie meinen. „Haus“ bleibt quellennah und lässt den weiteren häuslichen beziehungsweise familiären Bereich offen.
- source_word: implicit subject of participle
  choice: Wer
  rationale: Das substantivisch gebrauchte Partizip hat generischen Sinn. „Wer“ ist im modernen Deutschen knapp und natürlich.
theological_decisions:
- issue: Bedeutung des zweiten רָעָה
  choice: Die Wiederholung wird im Haupttext mit „das Böse“ erhalten.
  alternative: „Unheil“ oder „Unglück“ als ausdrückliche schädliche Folge.
  rationale: Der hebräische Ausdruck lässt sowohl moralisches Böses als auch Unheil zu. Der Haupttext bewahrt die lexikalische Wiederholung und damit die Spannung; die alternative Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Struktur. Die Formulierung vermeidet archaisches „der da“ und bewahrt durch „Böses … das Böse“ die hebräische Wiederholung.
