base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/026.yaml
  text: Also[a], to punish a righteous man is not good[b], nor to strike nobles for their uprightness.
translation:
  language: de
  text: Auch einen Gerechten zu bestrafen ist nicht gut; ebenso wenig ist es gut, Vornehme[b] wegen ihrer Aufrichtigkeit[a] zu schlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entgegen dem Recht“. Die hebräische Wendung kann entweder den Grund des Schlagens bezeichnen („wegen ihrer Aufrichtigkeit“) oder adverbial verstanden werden („entgegen dem, was recht ist“).'
    reason: lexical_alternative
  - marker: b
    text: „Vornehme“ kann auch mit „Fürsten“ oder „Führende“ wiedergegeben werden; das hebräische Wort kann Menschen von hohem Rang bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Gibt die additive Bedeutung des hebräischen Ausdrucks natürlich wieder, ohne ihn unnötig zu verstärken.
- source_word: עֲנוֹשׁ
  choice: zu bestrafen
  rationale: Bezeichnet allgemein das Verhängen einer Strafe; „mit einer Geldstrafe belegen“ wäre zu eng.
- source_word: לַצַּדִּיק
  choice: einen Gerechten
  rationale: Bewahrt den repräsentativen Singular und bezeichnet einen Menschen, der gerecht beziehungsweise im Recht ist.
- source_word: לֹא טוֹב
  choice: ist nicht gut
  rationale: Entspricht der schlichten wertenden Formulierung des Hebräischen und bleibt im Deutschen verständlich und gewichtig.
- source_word: לְהַכּוֹת
  choice: zu schlagen
  rationale: Gibt die breite Grundbedeutung des Verbs wieder, ohne eine bestimmte Form oder Schwere körperlicher Gewalt festzulegen.
- source_word: נְדִיבִים
  choice: Vornehme
  rationale: Der Ausdruck kann Menschen von hohem Rang bezeichnen. „Vornehme“ bewahrt diese soziale Bedeutung, ohne eine konkrete Amtsstellung vorauszusetzen.
- source_word: עַל יֹשֶׁר
  choice: wegen ihrer Aufrichtigkeit
  rationale: 'Versteht עַל als Angabe des Grundes: Die Vornehmen werden aufgrund ihres rechtschaffenen Verhaltens geschlagen. Die ebenfalls mögliche adverbiale Deutung „entgegen dem Recht“ wird in der Fußnote bewahrt.'
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenparallelismus der beiden Infinitivkonstruktionen wird durch „ebenso wenig“ verdeutlicht; die sachliche Untertreibung „nicht gut“ bleibt erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
