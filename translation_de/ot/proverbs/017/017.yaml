  text: בְּ/כָל עֵ֭ת אֹהֵ֣ב הָ/רֵ֑עַ וְ/אָ֥ח לְ֝/צָרָ֗ה יִוָּלֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/017.yaml
  text: A friend loves at all times[a], and a brother is born for adversity.
translation:
  language: de
  text: Ein Freund liebt zu jeder Zeit, und ein Bruder wird für die Not geboren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכָל־עֵת
  choice: zu jeder Zeit
  rationale: Die Verbindung aus ב, כָּל und עֵת bezeichnet einen umfassenden zeitlichen Geltungsbereich. „Zu jeder Zeit“ ist natürliches, prägnantes Deutsch und bewahrt den allgemeinen Anspruch des Spruchs.
- source_word: אֹהֵב
  choice: liebt
  rationale: Das Qal-Partizip beschreibt hier ein kennzeichnendes, fortdauerndes Verhalten. „Liebt“ gibt dies direkt und ohne unnötige Umschreibung wieder.
- source_word: הָרֵעַ
  choice: ein Freund
  rationale: Der Artikel kennzeichnet im Spruchstil wahrscheinlich eine allgemeine Personengruppe, nicht eine bestimmte Person. „Ein Freund“ vermittelt diesen generischen Sinn und die Beziehungsnähe besser als „Nachbar“ oder das weniger natürliche „Gefährte“.
- source_word: וְאָח
  choice: und ein Bruder
  rationale: אָח bedeutet gewöhnlich „Bruder“ und kann zugleich verwandtschaftliche oder bruderähnliche Solidarität anklingen lassen. Die direkte Wiedergabe erhält die Bildsprache und den Parallelismus.
- source_word: לְצָרָה
  choice: für die Not
  rationale: צָרָה bezeichnet Not, Bedrängnis oder Unglück. „Not“ ist im Deutschen knapp, würdig und für einen Spruch idiomatisch; die Präposition „für“ bewahrt die mögliche Zweck- oder Bestimmungsnuance von ל.
- source_word: יִוָּלֵד
  choice: wird … geboren
  rationale: Der Niphal von ילד bedeutet am natürlichsten „geboren werden“. Die wörtliche Wiedergabe erhält die zugespitzte Metapher, ohne sie als bloßes „Dasein“ oder „Sich-Erweisen“ aufzulösen.
theological_decisions:
- issue: Verhältnis der beiden Halbverse und Sinn von „für die Not geboren“
  choice: Die knappe Zweck-/Bestimmungsformulierung bleibt im Haupttext erhalten.
  alternative: „In der Not wird er zum Bruder“ oder „ein Bruder ist für Zeiten der Not geboren“
  rationale: Der hebräische Wortlaut kann ausdrücken, dass ein Bruder für die Not bestimmt ist, lässt aber auch die Vorstellung anklingen, dass sich Bruderschaft gerade in der Not verwirklicht. Eine deutende Umformulierung würde diese Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in knapper, würdiger Spruchform. Die Parallelstruktur und das Geburtsbild des Hebräischen bleiben erhalten; die echte Mehrdeutigkeit von לְצָרָה wird in einer Fußnote kenntlich gemacht.
