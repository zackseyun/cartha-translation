source:
  edition: WLC
  text: אַךְ מְרִ֥י יְבַקֶּשׁ רָ֑ע וּ/מַלְאָ֥ךְ אַ֝כְזָרִ֗י יְשֻׁלַּח בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/011.yaml
  text: A rebellious man seeks only evil[a], and a cruel messenger will be sent against him.
translation:
  language: de
  text: Ein Rebell sucht nur Böses, und ein grausamer Bote[a] wird gegen ihn gesandt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein grausamer Engel“. Das hebräische Wort kann sowohl „Bote“ als auch „Engel“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: nur
  rationale: 'Die Partikel wirkt hier einschränkend und bezieht sich auf „Auflehnung“: Der böse Mensch sucht nichts anderes.'
- source_word: מְרִי
  choice: Auflehnung
  rationale: Das Substantiv bezeichnet Widersetzlichkeit oder Rebellion. „Auflehnung“ ist im Deutschen natürlich und bewahrt den abstrakten Charakter des hebräischen Ausdrucks.
- source_word: יְבַקֶּשׁ
  choice: sucht
  rationale: Das Piel von בקש bedeutet hier „suchen“ beziehungsweise „anstreben“.
- source_word: רָע
  choice: ein böser Mensch
  rationale: 'Das nachgestellte Adjektiv ist substantivisch als Subjekt zu verstehen. Diese Analyse entspricht der hebräischen Wortstellung: Ein Böser sucht nur Auflehnung.'
- source_word: מַלְאָךְ
  choice: Bote
  rationale: Das Wort kann einen menschlichen Boten oder einen Engel bezeichnen. „Bote“ wahrt im Haupttext die allgemeinere Bedeutung.
- source_word: אַכְזָרִי
  choice: grausam
  rationale: Das Adjektiv beschreibt den gesandten Boten als hart, erbarmungslos oder grausam; „grausam“ ist die direkte und verständliche Wiedergabe.
- source_word: יְשֻׁלַּח
  choice: wird gesandt
  rationale: Die Pual-Form ist passiv. Das Präsens eignet sich im Deutschen für die allgemeingültige Folge, die der Spruch beschreibt.
- source_word: בּוֹ
  choice: gegen ihn
  rationale: Im feindlichen beziehungsweise strafenden Zusammenhang bezeichnet die Präposition die gegen die Person gerichtete Sendung.
theological_decisions:
- issue: Ob מַלְאָךְ einen menschlichen Boten oder einen übernatürlichen Engel bezeichnet
  choice: Bote
  alternative: Engel
  rationale: Der Vers bestimmt die Art des Gesandten nicht ausdrücklich. „Bote“ vermeidet eine unbelegte Festlegung auf ein himmlisches Wesen; die ebenfalls mögliche Deutung „Engel“ wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des Spruchs bleibt erhalten. Anders als die englische Konsultationsfassung wird רָע aufgrund der hebräischen Syntax als substantivisches Subjekt („ein böser Mensch“) und מְרִי als Objekt („Auflehnung“) wiedergegeben.
