  text: An evildoer listens to wicked lips[a]; a liar gives ear to a destructive tongue.
translation:
  language: de
  text: Ein Übeltäter hört auf böse Lippen[a]; ein Lügner schenkt einer zerstörerischen Zunge Gehör.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Übeltäter hört auf Lippen des Unrechts; die Falschheit schenkt einer Zunge des Verderbens Gehör.“ Das Hebräische lässt auch eine wörtlichere Wiedergabe zu, in der „Falschheit“ abstrakt und nicht als „ein Lügner“ verstanden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרַע
  choice: ein Übeltäter
  rationale: Die substantivische Form bezeichnet einen Menschen, der Böses tut. „Übeltäter“ ist knapp, verständlich und bewahrt die moralische Schärfe.
- source_word: מַקְשִׁיב עַל
  choice: hört auf
  rationale: קשׁב bezeichnet aufmerksames Hören; עַל markiert hier das, worauf gehört wird. „Hört auf“ gibt zudem die zustimmende oder bereitwillige Hinwendung wieder.
- source_word: שְׂפַת אָוֶן
  choice: böse Lippen
  rationale: „Lippen“ bleibt als Bild für Rede erhalten. אָוֶן kann Unheil, Frevel oder Bosheit bezeichnen; „böse“ passt hier zur moralisch verderbten Rede, ohne das Bild aufzulösen.
- source_word: שֶׁקֶר
  choice: ein Lügner
  rationale: Wörtlich steht „Lüge/Falschheit“. Parallel zu מֵרַע lässt sich das Wort substantivisch als Bezeichnung eines von Lüge geprägten Menschen verstehen; die abstrakte Lesart bleibt in der Fußnote erhalten.
- source_word: מֵזִין
  choice: schenkt … Gehör
  rationale: Der Hifil von אזן bedeutet „das Ohr neigen, aufmerksam hören“. Die deutsche Wendung ist natürlich und bildet die poetische Variation gegenüber „hört auf“ nach.
- source_word: לְשׁוֹן הַוֺּת
  choice: einer verderbenbringenden Zunge
  rationale: „Zunge“ bleibt als Metonymie für Rede erhalten. הַוּוֹת bezeichnet Verderben, Unheil oder ruinöse Wirkungen; „verderbenbringend“ macht die schädliche Kraft der Rede deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Körpermetaphern „Lippen“ und „Zunge“ sowie der parallele Aufbau des hebräischen Spruchs bleiben erhalten; die echte Mehrdeutigkeit von שֶׁקֶר wird durch die Fußnote sichtbar gemacht.
