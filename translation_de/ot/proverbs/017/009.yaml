source:
  edition: WLC
  text: מְֽכַסֶּה פֶּ֭שַׁע מְבַקֵּ֣שׁ אַהֲבָ֑ה וְ/שֹׁנֶ֥ה בְ֝/דָבָ֗ר מַפְרִ֥יד אַלּֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/009.yaml
  text: Whoever covers over an offense seeks love[c][b][a], but he who repeats a matter separates close friends.
translation:
  language: de
  text: Wer ein Vergehen zudeckt[a], sucht Liebe; wer aber eine Sache wieder aufgreift[b], entzweit enge Freunde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „ein Vergehen bedeckt“. Das hebräische Bild des Zudeckens wird beibehalten; ausdrücklich „vergeben“ steht hier nicht.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „eine Sache wiederholt“ oder „wieder auf eine Sache zurückkommt“. Gemeint ist wahrscheinlich, ein Vergehen erneut zur Sprache zu bringen, statt es ruhen zu lassen.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch im Singular: „einen engen Vertrauten“. Der Plural gibt den allgemeinen Sinn des Spruchs im Deutschen natürlicher wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: zudeckt
  rationale: Das Partizip von כסה bezeichnet wörtlich ein Bedecken oder Verbergen. „Zudeckt“ bewahrt das hebräische Bild und lässt im Zusammenhang erkennen, dass ein Vergehen nicht bloßgestellt oder immer wieder vorgehalten wird, ohne den Ausdruck vorschnell mit „vergibt“ gleichzusetzen.
- source_word: פֶּשַׁע
  choice: ein Vergehen
  rationale: פשע kann Übertretung oder Auflehnung bezeichnen. Im zwischenmenschlichen Zusammenhang des Spruchs gibt „Vergehen“ das begangene Unrecht klar und in gegenwärtigem Deutsch wieder.
- source_word: מְבַקֵּשׁ
  choice: sucht
  rationale: „Sucht“ entspricht der Grundbedeutung des Partizips und bewahrt die knappe moralische Logik des Spruchs.
- source_word: אַהֲבָה
  choice: Liebe
  rationale: „Liebe“ ist die direkte und hinreichend breite Entsprechung; sie sollte nicht unnötig auf Freundschaft oder Zuneigung eingeengt werden.
- source_word: שֹׁנֶה
  choice: wieder aufgreift
  rationale: שנה bedeutet wiederholen oder erneut tun. In Verbindung mit „einer Sache“ bezeichnet es wahrscheinlich das erneute Aufgreifen eines bereits behandelten Vorfalls. Die Formulierung ist im Deutschen natürlicher als „eine Sache wiederholt“ und wahrt dennoch den Wiederholungsaspekt.
- source_word: בְדָבָר
  choice: eine Sache
  rationale: דבר kann Wort, Sache oder Angelegenheit bedeuten. „Eine Sache“ bleibt bewusst weit und passt zum erneuten Aufgreifen eines Vorfalls.
- source_word: מַפְרִיד
  choice: entzweit
  rationale: Das Hifil-Partizip bezeichnet das Herbeiführen einer Trennung. „Entzweit“ bringt die zwischenmenschliche Folge in idiomatischem Deutsch prägnant zum Ausdruck.
- source_word: אַלּוּף
  choice: enge Freunde
  rationale: אַלּוּף bezeichnet hier einen engen Vertrauten oder Gefährten. Der deutsche Plural gibt den allgemeinen, sprichwörtlichen Sinn natürlich wieder; der hebräische Ausdruck steht formal im Singular.
theological_decisions: []
translation_notes:
  register: Knappe, ausgewogene Spruchform in modernem Standarddeutsch. „Zudeckt“ erhält die anschauliche Metapher; „wieder aufgreift“ vermeidet eine unnatürliche deutsche Wendung, ohne die Mehrdeutigkeit des Hebräischen zu verdecken. Das Semikolon bildet den antithetischen Parallelismus ab.
