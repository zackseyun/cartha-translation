base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/022.yaml
  text: Even if you grind a fool in a mortar with a pestle among crushed grain[a], his foolishness will not depart from him.
translation:
  language: de
  text: Selbst wenn du einen Narren im Mörser mit dem Stößel inmitten von zerstoßenem Getreide[a] zerstampfst, wird seine Torheit nicht von ihm weichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Wort bezeichnet wahrscheinlich zerstoßenes oder gestampftes Getreide; traditionell auch »Grütze«.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Selbst wenn
  rationale: 'Die Partikel leitet hier eine steigernde, konzessive Bedingung ein: Nicht einmal diese äußerste Maßnahme würde den Narren verändern.'
- source_word: תִּכְתּוֹשׁ
  choice: zerstampfst
  rationale: Das Verb bezeichnet kräftiges Stoßen oder Zerkleinern, besonders im Mörser. »Zerstampfen« passt präzise zum genannten Stößel.
- source_word: אֱוִיל
  choice: Narren
  rationale: Der geläufige Begriff der Weisheitsliteratur bezeichnet einen moralisch und geistig uneinsichtigen Menschen, nicht bloß jemanden mit geringer Intelligenz.
- source_word: מַּכְתֵּשׁ
  choice: Mörser
  rationale: Gemeint ist das Gefäß, in dem Getreide oder Gewürze mit einem Stößel zerkleinert werden.
- source_word: רִיפוֹת
  choice: zerkleinertem Getreide
  rationale: Das seltene Substantiv bezeichnet wahrscheinlich zerstoßenes oder gestampftes Getreide. Die Formulierung hält das konkrete Bild verständlich, ohne eine zu enge Getreideart festzulegen.
- source_word: עֱלִי
  choice: Stößel
  rationale: Dies ist im Deutschen die genaue und übliche Bezeichnung für das Werkzeug, das zusammen mit einem Mörser gebraucht wird.
- source_word: תָסוּר מֵעָלָיו
  choice: wird nicht von ihm weichen
  rationale: Die hebräische Wendung beschreibt, dass etwas eine Person nicht verlässt. »Von ihm weichen« bewahrt den sprichwörtlichen, würdevollen Ton.
- source_word: אִוַּלְתּוֹ
  choice: seine Torheit
  rationale: Das abstrakte Substantiv bezeichnet die tief verwurzelte törichte Haltung des Narren. »Torheit« stellt zudem die erkennbare Verbindung zu »Narr« her.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klar erkennbarem Sprichwortcharakter. Die drastische Bildsprache des Hebräischen und die Aussage über die hartnäckige Torheit des Narren bleiben ungemildert erhalten.
