  register: Modernes, knappes und würdiges Standarddeutsch mit sprichwörtlichem Satzbau. Die Ellipse im zweiten Halbvers wird wie im Hebräischen beibehalten; „soll dich loben“ ist dort sinngemäß mitzulesen.
