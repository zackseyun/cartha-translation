id: PRO.27.2
reference: Proverbs 27:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהַלֶּלְ/ךָ֣ זָ֣ר וְ/לֹא פִ֑י/ךָ נָ֝כְרִ֗י וְ/אַל שְׂפָתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/002.yaml
  text: Let another praise you[a], and not your own mouth; a stranger[b], and not your own lips.
translation:
  language: de
  text: Ein anderer[a] soll dich loben, nicht dein eigener Mund; ein Fremder[b], nicht deine eigenen Lippen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort זָר kann auch „ein Fremder“ oder „ein Außenstehender“ bedeuten. Hier betont es im Gegensatz zum eigenen Mund vor allem: jemand anderes als man selbst.'
    reason: lexical_alternative
  - marker: b
    text: Hier steht mit נָכְרִי ein anderes hebräisches Wort als im ersten Versglied; es kann „Fremder“ oder „Auswärtiger“ bedeuten. Die Übersetzung bewahrt diesen Wechsel im poetischen Parallelismus.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלֶּלְךָ
  choice: soll dich loben
  rationale: Die Verbform hat hier auffordernden Sinn. „Soll dich loben“ gibt die sprichwörtliche Mahnung im heutigen Deutsch natürlich wieder.
- source_word: זָר
  choice: ein anderer
  rationale: Im Gegensatz zum eigenen Mund bezeichnet זָר hier vor allem jemand anderen bzw. einen Außenstehenden. „Ein anderer“ stellt den Gegensatz zur Selbstempfehlung klar heraus, ohne eine ethnische Bedeutung aufzudrängen.
- source_word: פִּיךָ
  choice: dein eigener Mund
  rationale: Wörtlich steht „dein Mund“. „Eigener“ verdeutlicht knapp den im Kontext angelegten Gegensatz zwischen fremdem Lob und Selbstlob.
- source_word: נָכְרִי
  choice: ein Fremder
  rationale: נָכְרִי kann einen Fremden oder Auswärtigen bezeichnen. „Ein Fremder“ bewahrt die Bedeutungsnuance und zugleich die Variation gegenüber זָר im ersten Halbvers.
- source_word: שְׂפָתֶיךָ
  choice: deine eigenen Lippen
  rationale: Die Wiedergabe erhält das hebräische Bild und den Parallelismus zu „dein eigener Mund“.
- source_word: וְלֹא ... וְאַל
  choice: nicht ... nicht
  rationale: Beide Verneinungen untersagen in den parallelen Vershälften das Selbstlob. Die knappe Wiederholung entspricht natürlichem deutschem Sprichwortstil.
theological_decisions: []
