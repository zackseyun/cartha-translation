  text: כְּ֭/צִפּוֹר נוֹדֶ֣דֶת מִן קִנָּ֑/הּ כֵּֽן אִ֝֗ישׁ נוֹדֵ֥ד מִ/מְּקוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/008.yaml
  text: Like a bird that wanders from its nest[a], so is a man who wanders from his place.
translation:
  language: de
  text: Wie ein Vogel, der sein Nest verlässt, so ist ein Mann, der seinen Ort verlässt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „von seinem Ort“. „Ort“ kann das Zuhause, den angestammten Platz oder den angemessenen Wirkungsbereich meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִפּוֹר
  choice: Wie ein Vogel
  rationale: צִפּוֹר bezeichnet allgemein einen Vogel, häufig einen kleinen Vogel, ohne eine bestimmte Art festzulegen.
- source_word: נוֹדֶדֶת / נוֹדֵד
  choice: der … umherirrt
  rationale: Die beiden Partizipien derselben Wurzel נוד werden parallel wiedergegeben. „Umherirren“ vermittelt sowohl das unstete Umherziehen als auch die Entfernung vom angestammten Ort.
- source_word: מִן קִנָּהּ
  choice: fern von seinem Nest
  rationale: קֵן bedeutet „Nest“. Das deutsche Possessivpronomen richtet sich grammatisch nach dem maskulinen „Vogel“.
- source_word: כֵּן
  choice: so ist
  rationale: Die Formulierung bewahrt die ausdrückliche Vergleichsstruktur des hebräischen Spruchs.
- source_word: אִישׁ
  choice: ein Mann
  rationale: אִישׁ ist hier maskuliner Singular und bezeichnet einen einzelnen Mann in einer allgemein anwendbaren Sentenz.
- source_word: מִמְּקוֹמוֹ
  choice: fern von seinem Ort
  rationale: מָקוֹם ist breiter als „Haus“ oder „Heimat“ und kann den eigenen, angestammten oder angemessenen Ort bezeichnen. „Ort“ wahrt diese Offenheit.
theological_decisions:
- issue: Repräsentativ maskuline Sprache bei אִישׁ
  choice: ein Mann
  alternative: ein Mensch / jemand
  rationale: Die Übersetzung bewahrt die ausdrücklich maskuline Einzelfigur des Hebräischen, ohne die allgemeine Anwendbarkeit des Sprichworts einzuschränken.
- issue: Bedeutungsumfang von מְקוֹמוֹ
  choice: seinem Ort
  alternative: seinem Zuhause / dem Ort, an den er gehört
  rationale: Der hebräische Ausdruck lässt offen, ob Wohnort, Heimat, angestammter Platz oder gesellschaftliche Stellung gemeint ist; diese Spannung wird nicht auf eine Deutung verengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Parallelität zwischen den beiden Vershälften. „Umherirren“ ist idiomatischer als „umherwandern“ und bewahrt den warnenden Unterton; die Fußnote hält den neutraleren Bewegungssinn und die Bedeutungsbreite von מָקוֹם offen.
