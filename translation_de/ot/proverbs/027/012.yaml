id: PRO.27.12
reference: Proverbs 27:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עָר֤וּם רָאָ֣ה רָעָ֣ה נִסְתָּ֑ר פְּ֝תָאיִ֗ם עָבְר֥וּ נֶעֱנָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/012.yaml
  text: A prudent man sees danger and hides himself[a], but the simple pass on and suffer for it.
translation:
  language: de
  text: Der Kluge sieht die Gefahr und verbirgt sich; die Unerfahrenen aber gehen weiter und müssen dafür leiden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden bestraft“. Das hebräische Verb kann sowohl das Erleiden einer Strafe als auch das Tragen nachteiliger Folgen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּם
  choice: der Kluge
  rationale: Das Wort bezeichnet in den Sprüchen meist einen Menschen mit kluger Umsicht. Die substantivierte maskuline Singularform bewahrt die repräsentative Form des Hebräischen, ohne den negativen Beiklang von „listig“ einzutragen.
- source_word: רָאָה
  choice: sieht
  rationale: Das Perfekt beschreibt hier sprichwörtlich ein typisches Verhalten; im Deutschen gibt das Präsens diesen allgemeinen Sinn natürlich wieder.
- source_word: רָעָה
  choice: die Gefahr
  rationale: Das Substantiv kann Böses, Unheil oder Unglück bezeichnen. Hier ist drohendes Unheil gemeint, das erkannt und gemieden werden kann; „Gefahr“ bringt diesen Zusammenhang klar zum Ausdruck.
- source_word: נִסְתָּר
  choice: verbirgt sich
  rationale: Der Nifal bezeichnet das Sichverbergen beziehungsweise das Zurückziehen vor drohendem Unheil und wird hier knapp und reflexiv wiedergegeben.
- source_word: פְּתָאיִם
  choice: die Unerfahrenen
  rationale: Der Weisheitsbegriff bezeichnet unkundige, unkritische und leicht beeinflussbare Menschen. „Unerfahrene“ ist verständlich und vermeidet den unnötig abwertenden Klang von „Einfältige“.
- source_word: עָבְרוּ
  choice: gehen weiter
  rationale: Im Gegensatz zum Klugen setzen sie ihren Weg fort, ohne Vorsichtsmaßnahmen zu ergreifen. „Gehen weiter“ bildet diese Bewegung idiomatisch ab.
- source_word: נֶעֱנָשׁוּ
  choice: müssen dafür leiden
  rationale: Der Nifal von ענשׁ kann Bestrafung oder das Erleiden nachteiliger Folgen ausdrücken. Die Formulierung wahrt diese Bedeutungsbreite, ohne vorschnell ein förmliches Strafgericht festzulegen.
theological_decisions:
- issue: Ob נֶעֱנָשׁוּ ausdrücklich eine Bestrafung oder allgemeiner leidvolle Folgen bezeichnet
  choice: müssen dafür leiden
  alternative: werden bestraft
  rationale: Der Zusammenhang betont die Folgen mangelnder Vorsicht, während das Verb zugleich einen Strafsinn zulässt. Der Haupttext lässt die Art der Folge offen; die Fußnote bewahrt die engere Alternative.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Sprichwortdeutsch. Der Parallelismus und der Gegensatz zwischen vorausschauender Klugheit und unbedachtem Weitergehen bleiben erhalten.
