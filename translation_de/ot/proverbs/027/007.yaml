source:
  edition: WLC
  text: נֶ֣פֶשׁ שְׂ֭בֵעָה תָּב֣וּס נֹ֑פֶת וְ/נֶ֥פֶשׁ רְ֝עֵבָ֗ה כָּל מַ֥ר מָתֽוֹק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/007.yaml
  text: A satisfied person despises honey[b][a], but to a hungry person every bitter thing is sweet.
translation:
  language: de
  text: Wer satt ist, tritt Honig mit Füßen[a][b]; doch wer hungrig ist, dem ist alles Bittere süß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Eine satte Seele tritt Honig mit Füßen; doch einer hungrigen Seele ist alles Bittere süß.“ „Seele“ bezeichnet hier idiomatisch den Menschen im Blick auf sein Verlangen oder seinen Appetit.'
    reason: lexical_alternative
  - marker: b
    text: „Honig“ kann genauer Wabenhonig oder herabtropfenden Honig bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: wer … ist
  rationale: נֶפֶשׁ bezeichnet hier idiomatisch den Menschen im Blick auf sein Verlangen beziehungsweise seinen Appetit. Die deutsche Wendung mit „wer“ gibt den personenbezogenen Sinn natürlich wieder.
- source_word: שְׂבֵעָה
  choice: satt
  rationale: Das Wort bezeichnet einen gefüllten, gesättigten Zustand. „Satt“ stellt im Deutschen den unmittelbaren Gegensatz zu „hungrig“ her.
- source_word: תָּבוּס
  choice: tritt … mit Füßen
  rationale: Die konkrete Bildsprache des Verbs „treten, zertreten“ bleibt erhalten und drückt zugleich Geringschätzung oder Zurückweisung aus.
- source_word: נֹפֶת
  choice: Honig
  rationale: Das Wort bezeichnet Honig, möglicherweise genauer Wabenhonig oder herabtropfenden Honig. „Honig“ ist im Haupttext klar und natürlich; die genauere Bedeutung wird in einer Fußnote genannt.
- source_word: רְעֵבָה
  choice: hungrig
  rationale: Die schlichte Bezeichnung des Hungers wird ohne unnötige Steigerung wiedergegeben.
- source_word: כָּל
  choice: alles
  rationale: In Verbindung mit dem substantivierten Adjektiv gibt „alles Bittere“ die umfassende sprichwörtliche Aussage idiomatisch wieder.
- source_word: מַר
  choice: das Bittere
  rationale: Das Adjektiv wird substantivisch gebraucht und bezeichnet alles, was bitter ist.
- source_word: מָתוֹק
  choice: süß
  rationale: Die prädikative Aussage wird direkt wiedergegeben; Zusätze wie „schmeckt“ oder „erscheint“ wären interpretierend.
