  text: Know well the condition of your flock[b][a]; set your heart on the herds.
translation:
  language: de
  text: Achte genau auf den Zustand deiner Herde[a]; richte dein Herz auf die Herden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Erkenne genau das Angesicht deiner Herde.“ Gemeint ist, ihren Zustand sorgfältig zu kennen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet Gruppen von Herdentieren und kann je nach Zusammenhang auch mit „Viehherden“ oder „Tiergruppen“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: Achte genau
  rationale: Der Infinitivus absolutus verstärkt die Aufforderung. „Achte genau“ gibt den Nachdruck natürlich wieder und passt zur fürsorglichen Beobachtung des Viehs.
- source_word: פְּנֵי
  choice: auf den Zustand
  rationale: Wörtlich steht „das Angesicht“, doch die Wendung bezeichnet hier den erkennbaren Zustand der Tiere.
- source_word: צֹאנְךָ
  choice: deiner Herde
  rationale: צֹאן bezeichnet kollektiv vor allem Kleinvieh, also Schafe und Ziegen. „Herde“ ist im Deutschen natürlich und wahrt den kollektiven Sinn.
- source_word: שִׁית
  choice: richte
  rationale: Das Verb bedeutet „setzen, stellen, richten“. Zusammen mit „Herz“ ergibt „richte dein Herz auf“ eine verständliche, bildhafte Aufforderung.
- source_word: לִבְּךָ
  choice: dein Herz
  rationale: „Herz“ umfasst im Hebräischen Aufmerksamkeit, Absicht und Sorge. Die Beibehaltung wahrt das Menschenbild und den poetischen Ton des Ausgangstextes.
- source_word: לַעֲדָרִים
  choice: auf die Herden
  rationale: עֲדָרִים bezeichnet Tiergruppen beziehungsweise Herden. Die Wiederaufnahme von „Herden“ ist im Deutschen klar und vermeidet eine unbelegte Festlegung auf eine bestimmte Viehart.
