  text: Take his garment[a], for he has put up security for a stranger[b]; and hold it in pledge for a foreign woman.
translation:
  language: de
  text: Nimm sein Gewand, denn er hat für einen Fremden gebürgt; und nimm von ihm wegen einer fremden Frau[a] ein Pfand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Fremde Frau“ kann eine ausländische oder eine Frau außerhalb der eigenen Gemeinschaft bezeichnen; im Sprüchebuch kann der Ausdruck je nach Zusammenhang auch auf eine sozial oder sexuell unerlaubte Beziehung anspielen.
    reason: lexical_alternative
  - marker: b
    text: 'Die zweite Vershälfte ist im Hebräischen sehr knapp. Das maskuline Suffix kann den Mann meinen; entsprechend lässt sich auch übersetzen: „Nimm ihn wegen einer fremden Frau als Pfand.“ Die Wiedergabe „nimm von ihm … ein Pfand“ formuliert diese rechtliche Bildsprache im Deutschen verständlicher.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: קַח
  choice: Nimm
  rationale: Der Imperativ von לקח bezeichnet eine direkte Aufforderung zum Nehmen; „Nimm“ ist im Deutschen knapp, natürlich und dem sprichwörtlichen Stil angemessen.
- source_word: בִּגְדוֹ
  choice: sein Gewand
  rationale: בגד bezeichnet ein Kleidungsstück, häufig ein als Pfand geeignetes Obergewand. „Gewand“ bewahrt die sachliche Breite des hebräischen Ausdrucks.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung der Aufforderung ein. „Denn“ erhält die knappe Form des Spruchs.
- source_word: עָרַב
  choice: hat … gebürgt
  rationale: ערב bezeichnet hier das Eintreten als Bürge für die Verpflichtung eines anderen. „Bürgen“ gibt den rechtlich-finanziellen Sinn idiomatisch wieder.
- source_word: זָר
  choice: einen Fremden
  rationale: זָר meint hier jemanden außerhalb des eigenen vertrauten oder verwandtschaftlichen Kreises. „Fremder“ bewahrt die soziale Distanz, auf der die Warnung beruht.
- source_word: וּבְעַד
  choice: weil er für … eingestanden ist
  rationale: בְּעַד bezeichnet das Handeln zugunsten oder anstelle einer anderen Person. In Verbindung mit dem parallelen Gedanken wird es natürlich als Eintreten für jemanden wiedergegeben.
- source_word: נָכְרִיָּה
  choice: eine fremde Frau
  rationale: נָכְרִיָּה kann eine ausländische beziehungsweise nicht zum eigenen Kreis gehörende Frau bezeichnen und trägt im Sprüchebuch teils auch die Konnotation einer unerlaubten Beziehung. Die breitere Wiedergabe vermeidet eine vorschnelle Festlegung.
- source_word: חַבְלֵהוּ
  choice: behalte es als Pfand
  rationale: חבל bezeichnet im rechtlichen Zusammenhang das Nehmen oder Festhalten eines Pfandes. Das maskuline Suffix kann auf das zuvor genannte Gewand bezogen oder als Hinweis auf den Mann verstanden werden; der Haupttext führt das Pfandmotiv idiomatisch mit dem Gewand fort, während die Alternative in einer Fußnote erhalten bleibt.
