source:
  edition: WLC
  text: אַֽל תִּ֭תְהַלֵּל בְּ/י֣וֹם מָחָ֑ר כִּ֤י לֹא תֵ֝דַ֗ע מַה יֵּ֥לֶד יֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/001.yaml
  text: Do not boast about tomorrow[a], for you do not know what a day may bring.
translation:
  language: de
  text: Rühme dich nicht des morgigen Tages, denn du weißt nicht, was ein Tag hervorbringen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „was ein Tag gebären wird“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַלֵּל
  choice: Rühme dich
  rationale: 'Der Hitpael von הלל hat hier reflexiven Sinn: sich selbst rühmen bzw. sich selbstbewusst brüsten. „Rühme dich nicht“ ist im Deutschen prägnant, würdevoll und idiomatisch.'
- source_word: בְּיוֹם מָחָר
  choice: des morgigen Tages
  rationale: Die Wendung bezeichnet den kommenden Tag als Gegenstand des Rühmens. „Des morgigen Tages“ bewahrt die knappe sprichwörtliche Form und entspricht dem biblischen Ausdruck, ohne den Sinn auf bloßes Reden „über morgen“ zu verengen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung des Verbots ein; „denn“ passt natürlich zum deutschen Spruchstil.
- source_word: לֹא תֵדַע
  choice: du weißt nicht
  rationale: ידע bezeichnet hier fehlendes Wissen, nicht ausdrücklich eine grundsätzliche Unfähigkeit. Die direkte Wiedergabe wahrt diese Aussage.
- source_word: מַה יֵּלֶד יוֹם
  choice: was ein Tag hervorbringen wird
  rationale: ילד bedeutet wörtlich „gebären“ und wird hier bildlich für das gebraucht, was ein Tag entstehen lässt. „Hervorbringen“ erhält das Bild stärker als „bringen“ und klingt im Deutschen dennoch natürlich.
theological_decisions: []
translation_notes:
  register: Knapper, einprägsamer Spruchstil in modernem, würdigem Standarddeutsch. Die Genitivwendung „des morgigen Tages“ ist leicht gehoben, aber geläufig und erhält die formale Prägnanz des Hebräischen; das Geburtsbild wird im Haupttext durch „hervorbringen“ angedeutet und in der Fußnote offengelegt.
