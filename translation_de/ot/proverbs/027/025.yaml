  variant: modern standard German
source:
  edition: WLC
  text: גָּלָ֣ה חָ֭צִיר וְ/נִרְאָה דֶ֑שֶׁא וְ֝/נֶאֶסְפ֗וּ עִשְּׂב֥וֹת הָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/025.yaml
  text: The hay is removed[a], and the new growth appears[c][b], and the grasses of the mountains are gathered.
translation:
  language: de
  text: Ist das Gras verschwunden[a], zeigt sich das frische Grün[b], und die Kräuter der Berge[c] werden eingesammelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ist das Gras abgeräumt“ oder „ist das Gras freigelegt“. Das hebräische Verb kann ein Aufdecken, Entfernen oder Verschwinden ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „das junge Gras“ oder „der frische Pflanzenwuchs“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „die Gräser“ oder „die Pflanzen der Berge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלָה
  choice: ist … verschwunden
  rationale: Das Verb bedeutet grundlegend „aufgedeckt/entblößt werden“, kann hier aber das Verschwinden beziehungsweise Abräumen des Grases bezeichnen. „Ist … verschwunden“ bewahrt die im Hebräischen mögliche Zustandsveränderung, ohne ausdrücklich einen nicht genannten Handelnden einzuführen.
- source_word: חָצִיר
  choice: Gras
  rationale: חָצִיר bezeichnet Gras beziehungsweise als Futter dienenden Bewuchs. „Gras“ ist gegenüber „Heu“ näher am unbestimmten Ausgangsbegriff, da getrocknetes Heu nicht ausdrücklich bezeichnet wird.
- source_word: נִרְאָה
  choice: zeigt sich
  rationale: Die Nifalform bedeutet „wird gesehen/erscheint“. „Zeigt sich“ ist natürliches Deutsch und bildet das Sichtbarwerden neuer Vegetation ab.
- source_word: דֶשֶׁא
  choice: frische Grün
  rationale: דֶשֶׁא bezeichnet frischen, grünen Pflanzenwuchs. „Das frische Grün“ ist verständlich, vermeidet eine unnötige Wiederholung von „Gras“ und lässt die Art des Bewuchses offen.
- source_word: נֶאֶסְפוּ
  choice: werden eingesammelt
  rationale: Die passive Form bedeutet „werden gesammelt/eingebracht“. „Eingesammelt“ passt zum landwirtschaftlichen Zusammenhang, ohne die speziellere Bedeutung „geerntet“ festzulegen.
- source_word: עִשְּׂבוֹת
  choice: Kräuter
  rationale: עֵשֶׂב bezeichnet krautartige Pflanzen, Gewächse oder Grünfutter. „Kräuter“ hält die lexikalische Unterscheidung von חָצִיר und דֶשֶׁא sichtbar; eine Fußnote weist auf weitere natürliche Möglichkeiten hin.
- source_word: הָרִים
  choice: der Berge
  rationale: הָרִים ist der Plural von „Berg“. „Der Berge“ gibt den Ausdruck direkt wieder, ohne das Gelände zu „Hügeln“ abzuschwächen.
theological_decisions: []
