source:
  edition: WLC
  text: רֵֽעֲ/ךָ֨ ו/רעה אָבִ֡י/ךָ אַֽל תַּעֲזֹ֗ב וּ/בֵ֥ית אָחִ֗י/ךָ אַל תָּ֭בוֹא בְּ/י֣וֹם אֵידֶ֑/ךָ ט֥וֹב שָׁכֵ֥ן קָ֝ר֗וֹב מֵ/אָ֥ח רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/010.yaml
  text: Do not forsake your friend or your father’s friend[a], and do not go to your brother’s house in the day of your calamity[b]; a nearby neighbor is better than a distant brother.
translation:
  language: de
  text: Verlass weder deinen Freund noch den Freund deines Vaters,[a] und geh am Tag deines Unglücks nicht in das Haus deines Bruders.[b] Ein naher Nachbar ist besser als ein Bruder in der Ferne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deinen Freund und den Freund deines Vaters“. Die hebräische Verbindung kann im Deutschen auch mit „oder“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: „Bruder“ kann hier auch weiter gefasst einen nahen Verwandten oder Sippenangehörigen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעֲךָ
  choice: deinen Freund
  rationale: רֵעַ bezeichnet einen Freund, Gefährten oder Vertrauten. Zusammen mit dem Freund des Vaters steht hier die persönliche, verlässliche Beziehung im Vordergrund, nicht bloß Nachbarschaft.
- source_word: וְרֵעַ אָבִיךָ
  choice: noch den Freund deines Vaters
  rationale: Die hebräische Konjunktion ו verbindet beide Objekte mit demselben Verbot. Die deutsche Konstruktion „weder … noch“ gibt dies natürlich und eindeutig wieder, ohne die Verbindung als alternatives „oder“ festzulegen.
- source_word: אַל תַּעֲזֹב
  choice: Verlass … nicht
  rationale: עזב kann das Aufgeben oder Im-Stich-Lassen einer Beziehung bezeichnen. „Verlassen“ bewahrt das relationale Gewicht und klingt im modernen Deutsch würdig und natürlich.
- source_word: וּבֵית אָחִיךָ אַל תָּבוֹא
  choice: und geh … nicht in das Haus deines Bruders
  rationale: בוא bedeutet kommen, gehen oder hineingehen. „In das Haus … gehen“ bewahrt das konkrete Bild und deutet zugleich das Aufsuchen des Bruders in der Not an.
- source_word: בְּיוֹם אֵידֶךָ
  choice: am Tag deines Unglücks
  rationale: אֵיד bezeichnet schweres Unglück, Verderben oder eine Katastrophe. „Unglück“ ist gegenwärtig, verständlich und lässt die Art der Not offen.
- source_word: טוֹב
  choice: besser
  rationale: Das wörtliche „gut“ erhält durch מִן vergleichende Funktion; im Deutschen ist daher „besser als“ idiomatisch erforderlich.
- source_word: שָׁכֵן קָרוֹב
  choice: ein Nachbar in der Nähe
  rationale: שָׁכֵן bedeutet „Nachbar“, קָרוֹב „nah“. Die Formulierung hebt die räumliche Erreichbarkeit hervor und vermeidet, „nahestehend“ ausschließlich emotional zu verstehen.
- source_word: מֵאָח רָחוֹק
  choice: als ein Bruder in der Ferne
  rationale: אָח wird als „Bruder“ beibehalten, während רָחוֹק durch „in der Ferne“ die räumliche oder praktische Unerreichbarkeit ausdrückt.
theological_decisions:
- issue: Umfang der Verwandtschaftsbezeichnung אָח
  choice: „Bruder“ im Haupttext beibehalten
  alternative: „Verwandter“ oder „Sippenangehöriger“
  rationale: אָח kann im Hebräischen auch einen weiteren Verwandten bezeichnen. Das konkrete Bild des Bruders trägt jedoch die Spannung zwischen erwartbarer familiärer Hilfe und tatsächlich verfügbarer Hilfe am klarsten; die weitere Bedeutung wird in einer Fußnote offengehalten.
- issue: Verhältnis von Freund und Vaterfreund unter dem Verbot
  choice: Beide durch „weder … noch“ demselben Verbot zuordnen
  alternative: „deinen Freund oder den Freund deines Vaters“ beziehungsweise „deinen Freund und den Freund deines Vaters“
  rationale: Die hebräische Konjunktion erlaubt im Deutschen unterschiedliche Verknüpfungen. „Weder … noch“ bewahrt beide genannten Beziehungen als Gegenstände des einen Verbots, ohne eine künstliche Wahl zwischen ihnen einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Die parallelen Ortsangaben „in der Nähe“ und „in der Ferne“ erhalten den räumlichen Kontrast. Die Zeichensetzung setzt die Fußnotenmarker unmittelbar an die jeweils erläuterte Wendung.
