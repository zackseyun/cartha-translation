  text: וְ/דֵ֤י חֲלֵ֬ב עִזִּ֗ים לְֽ֭/לַחְמְ/ךָ לְ/לֶ֣חֶם בֵּיתֶ֑/ךָ וְ֝/חַיִּ֗ים לְ/נַעֲרוֹתֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/027.yaml
  text: And there will be enough goats' milk for your food[a], for the food of your household[b], and sustenance for your servant girls.
translation:
  language: de
  text: Und es gibt genug Ziegenmilch für deine Nahrung[a], für die Nahrung deines Haushalts und Lebensunterhalt[b] für deine Dienerinnen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier und beim folgenden Ausdruck „Brot“; gemeint ist wahrscheinlich Nahrung oder Versorgung im weiteren Sinn.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Leben“. Gemeint ist hier wahrscheinlich das, was das Leben erhält.
    reason: lexical_alternative
  - marker: c
    text: Oder „jungen Frauen“. Das hebräische Wort kann junge Frauen oder weibliche Bedienstete bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֵי
  choice: Dann gibt es genug
  rationale: דַּי bezeichnet eine ausreichende Menge. Die existenzielle Formulierung ist im Deutschen natürlich; „dann“ führt hier die Folge der in den vorhergehenden Versen beschriebenen Fürsorge weiter.
- source_word: חֲלֵב עִזִּים
  choice: Ziegenmilch
  rationale: Die Verbindung bezeichnet Milch von Ziegen; das deutsche Kompositum ist die geläufige und genaue Wiedergabe.
- source_word: לְלַחְמְךָ / לְלֶחֶם בֵּיתֶךָ
  choice: für deine Nahrung / für die Nahrung deines Hauses
  rationale: לֶחֶם bedeutet wörtlich „Brot“, kann jedoch allgemein Nahrung oder Verpflegung bezeichnen. Da Milch hier als Versorgung dient, gibt „Nahrung“ den kontextuellen Sinn wieder. בַּיִת meint dabei das Haus als Hausgemeinschaft.
- source_word: וְחַיִּים
  choice: und als Lebensunterhalt
  rationale: חַיִּים bedeutet wörtlich „Leben“, bezeichnet hier aber im Zusammenhang der Versorgung das, wovon man lebt. „Lebensunterhalt“ bewahrt den Bezug zum Leben und ist zugleich idiomatisch.
- source_word: לְנַעֲרוֹתֶיךָ
  choice: für deine Mägde
  rationale: נַעֲרָה kann eine junge Frau oder eine weibliche Bedienstete bezeichnen. Im Kontext der Versorgung eines Haushalts ist „Mägde“ wahrscheinlich, ohne die lexikalische Alternative zu verschweigen.
