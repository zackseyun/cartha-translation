  text: מְבָ֘רֵ֤ךְ רֵעֵ֨/הוּ בְּ/ק֣וֹל גָּ֭דוֹל בַּ/בֹּ֣קֶר הַשְׁכֵּ֑ים קְ֝לָלָ֗ה תֵּחָ֥שֶׁב לֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/014.yaml
  text: Whoever blesses his neighbor with a loud voice[a], rising early in the morning[c][b], it will be counted to him as a curse.
translation:
  language: de
  text: Wer seinen Nächsten früh am Morgen mit lauter Stimme segnet, dem wird dies als Fluch angerechnet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wenn „ihm“ auf den Nächsten bezogen wird: „Für seinen Nächsten gilt es als Fluch.“ Gemeint ist wohl ironisch, dass ein aufdringlich lauter Segensgruß am frühen Morgen wie ein Fluch wirkt.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: מְבָרֵךְ
  choice: segnet
  rationale: Das Piel-Partizip von ברך bezeichnet hier das Aussprechen eines Segens. „segnet“ bewahrt den konkreten Gegensatz zu „Fluch“, ohne die Handlung auf einen bloßen Gruß oder auf Lob einzuengen.
- source_word: רֵעֵהוּ
  choice: seinen Mitmenschen
  rationale: רֵעַ kann Freund, Gefährte oder Nächster bezeichnen. „Mitmensch“ lässt den genauen Grad der persönlichen Nähe offen und klingt im heutigen Deutschen natürlicher als das räumlich leicht missverständliche „Nachbar“.
- source_word: בְּקוֹל גָּדוֹל
  choice: mit lauter Stimme
  rationale: Die konkrete hebräische Wendung wird natürlich und anschaulich wiedergegeben; die störende Lautstärke bleibt hervorgehoben.
- source_word: בַּבֹּקֶר הַשְׁכֵּים
  choice: früh am Morgen
  rationale: הַשְׁכֵּים unterstreicht das frühe Handeln. Die idiomatische deutsche Wendung vermittelt Zeitpunkt und auffällige Frühe knapp, ohne ein im Hebräischen nicht ausdrücklich genanntes Subjekt für das Aufstehen einzuführen.
- source_word: קְלָלָה
  choice: als Fluch
  rationale: Die Grundbedeutung „Fluch“ wird beibehalten und bildet den beabsichtigten scharfen Gegensatz zu „segnet“.
- source_word: תֵּחָשֶׁב לוֹ
  choice: dem wird es … angerechnet
  rationale: Die passive Bedeutung des Niphal von חשב bleibt erhalten. Die Formulierung bewahrt die Ambiguität, ob es dem laut Segnenden zugerechnet oder für ihn beziehungsweise von dem Betroffenen als Fluch angesehen wird; eine Fußnote nennt die andere mögliche Zuordnung.
theological_decisions:
- issue: Bezug von לוֹ bei תֵּחָשֶׁב לוֹ
  choice: '„dem wird es als Fluch angerechnet“: Bezug auf den laut Segnenden'
  alternative: '„von ihm wird es als Fluch angesehen“ beziehungsweise „für ihn gilt es als Fluch“: Bezug auf den gesegneten Mitmenschen'
  rationale: Das maskuline Suffix kann im Zusammenhang unterschiedlich bezogen werden. Die Hauptfassung folgt der naheliegenden grammatischen Rückbindung an den Handelnden, während die Fußnote die verbreitete kontextuelle Deutung aus der Perspektive des früh gestörten Empfängers wahrt.
translation_notes:
  register: Moderne, knappe Weisheitssprache mit bewusst bewahrtem Gegensatz zwischen „segnet“ und „Fluch“. „Mitmensch“ vermeidet eine unnötige Festlegung auf Freundschaft oder räumliche Nachbarschaft. Die Satzstellung ist idiomatisch deutsch und hält die pointierte Schlusswendung fest.
