    rationale: רֵעֵהוּ bezeichnet einen konkreten anderen Menschen im sozialen Nahbereich. „Seinen Nächsten“ ist im modernen Deutschen verständlich, natürlich und als breite Entsprechung zu Freund, Gefährte oder Nächster besser geeignet.
