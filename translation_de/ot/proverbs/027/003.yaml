  text: כֹּֽבֶד אֶ֭בֶן וְ/נֵ֣טֶל הַ/ח֑וֹל וְ/כַ֥עַס אֱ֝וִ֗יל כָּבֵ֥ד מִ/שְּׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/003.yaml
  text: A stone is heavy[a], and sand is weighty, but a fool’s anger is heavier than both of them.
translation:
  language: de
  text: Die Schwere eines Steins und die Last des Sandes – der Zorn eines Narren ist schwerer als beides.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Stein ist schwer, und Sand ist eine Last; doch der Ärger eines Narren wiegt schwerer als beides.“ Das Hebräische verwendet im ersten und im dritten Satzteil eng verwandte Wörter für Schwere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּבֶד אֶבֶן
  choice: Ein Stein ist schwer
  rationale: Das hebräische Substantiv כֹּבֶד bezeichnet Schwere oder Gewicht. Die prädikative deutsche Formulierung ist natürlich und bewahrt zugleich das Bild sowie die Wortfeldverbindung zu כָּבֵד.
- source_word: נֵטֶל הַחוֹל
  choice: Sand ist eine Last
  rationale: נֵטֶל bezeichnet eine Last bzw. etwas zu Tragendes. Die Wiedergabe erhält den nominalen Charakter und macht deutlich, dass die Masse des Sandes belastend ist.
- source_word: כַעַס אֱוִיל
  choice: der Ärger eines Narren
  rationale: כַעַס kann Ärger, Verdruss oder Zorn bezeichnen. „Ärger“ bewahrt hier die mögliche Spannung zwischen dem Zorn des Narren und der Belastung, die er anderen bereitet, ohne die Bedeutung einseitig festzulegen.
- source_word: כָּבֵד מִשְּׁנֵיהֶם
  choice: wiegt schwerer als beides
  rationale: כָּבֵד wird durch מִן vergleichend gebraucht. „wiegt schwerer“ greift das konkrete Gewichtsbild auf; „beides“ bezieht Stein und Sand zusammen ein.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Die konkrete Gewichtsvorstellung bleibt erhalten; „Ärger“ lässt die lexikalische Bandbreite von כַעַס erkennen.
