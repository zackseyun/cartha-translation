id: PRO.27.24
reference: Proverbs 27:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י לֹ֣א לְ/עוֹלָ֣ם חֹ֑סֶן וְ/אִם נֵ֝֗זֶר לְ/ד֣וֹר דור־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/024.yaml
  text: For wealth does not last forever[b][a], nor a crown from generation to generation.
translation:
  language: de
  text: Denn Reichtum[a] bleibt nicht für immer, und auch eine Krone[b] bleibt nicht von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Vermögen“, „Vorrat“ oder „Stärke“; hier spricht der Zusammenhang am ehesten für materiellen Reichtum.
    reason: lexical_alternative
  - marker: b
    text: 'Auch „Diadem“, möglicherweise „Weihe“. Der zweite Halbvers lautet sehr knapp und könnte wörtlicher als rhetorische Frage verstanden werden: „und ob eine Krone von Generation zu Generation [besteht]?“'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung ein und gibt die erklärende Funktion des Spruchs natürlich wieder.
- source_word: חֹסֶן
  choice: Reichtum
  rationale: Das Wort kann Stärke, Vorrat oder Vermögen bezeichnen; im Zusammenhang von Herden, Ertrag und Versorgung in Vers 23–27 steht materieller Besitz im Vordergrund.
- source_word: לֹא לְעוֹלָם
  choice: bleibt nicht für immer
  rationale: Gibt die Aussage über fehlende Dauerhaftigkeit in natürlichem modernem Deutsch wieder.
- source_word: וְאִם
  choice: und auch … nicht
  rationale: אִם bedeutet gewöhnlich „wenn/ob“, steht hier aber elliptisch nach der vorangehenden Verneinung. Die Wiedergabe führt den negativen Parallelismus verständlich fort, ohne die Krone als dauerhaft erscheinen zu lassen.
- source_word: נֵזֶר
  choice: Krone
  rationale: Bewahrt das konkrete Bild für Herrschaft, Rang oder dynastischen Status. Das Wort kann auch „Diadem“ oder „Weihe“ bezeichnen.
- source_word: לְדוֹר דּוֹר
  choice: von Generation zu Generation
  rationale: Die Wiederholung von דּוֹר bezeichnet die fortlaufende Abfolge der Generationen; die deutsche Wendung erhält diesen Sinn.
theological_decisions:
- issue: Bedeutung von נֵזֶר im Parallelismus
  choice: Krone als Bild für Herrschaft oder herausgehobenen Rang
  alternative: Diadem; Weihe
  rationale: Der Parallelismus nennt Reichtum und hohen Status als Größen, deren Fortbestand nicht gesichert ist. „Krone“ erhält das konkrete Bild, ohne es ausschließlich königlich oder kultisch festzulegen.
- issue: Elliptische Konstruktion וְאִם nach der Verneinung
  choice: 'Fortführung der Verneinung: „und auch … nicht“'
  alternative: 'Wörtlicher und offener: „und ob eine Krone von Generation zu Generation [besteht]?“'
  rationale: Im Zusammenhang ist eine rhetorische beziehungsweise negativ korrelative Lesart am wahrscheinlichsten. Die Hauptfassung macht diese Aussage idiomatisch verständlich; die formale Mehrdeutigkeit wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem spruchweisheitlichem Ton. Die Wiederholung von „bleibt“ löst die hebräische Ellipse verständlich auf; „von Generation zu Generation“ bewahrt den generationenübergreifenden Horizont.
