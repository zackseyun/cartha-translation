  text: דֶּ֣לֶף ט֭וֹרֵד בְּ/י֣וֹם סַגְרִ֑יר וְ/אֵ֥שֶׁת מדונים נִשְׁתָּוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/015.yaml
  text: A constant dripping on a day of heavy rain[a], and a quarrelsome wife, are alike.
translation:
  language: de
  text: Ständiges Tropfen an einem Regentag[a] und eine streitsüchtige Ehefrau sind einander gleich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: an einem Tag mit anhaltendem oder heftigem Regen.'
    reason: Das seltene Wort סַגְרִיר kann regnerisches Wetter, anhaltenden Regen oder heftigen, treibenden Regen bezeichnen.
lexical_decisions:
- source_word: דֶּלֶף טוֹרֵד
  choice: ständiges Tropfen
  rationale: דֶּלֶף bezeichnet eindringendes beziehungsweise herabtropfendes Wasser; das Partizip טוֹרֵד hebt die fortdauernde, lästige Wiederholung hervor. „Ständiges Tropfen“ bewahrt dieses Bild in natürlichem Deutsch, ohne ein Dach ausdrücklich zu ergänzen.
- source_word: בְּיוֹם סַגְרִיר
  choice: an einem Tag mit Dauerregen
  rationale: Die Wendung bezeichnet einen von anhaltendem beziehungsweise heftigem Regen geprägten Tag. „Dauerregen“ verbindet die Wettersituation mit dem Motiv der zermürbenden Beständigkeit, ohne den Ausdruck auf einen Sturm festzulegen.
- source_word: אֵשֶׁת מִדְיָנִים
  choice: eine streitsüchtige Frau
  rationale: Die Konstruktion bedeutet wörtlich „eine Frau der Streitigkeiten“. „Streitsüchtig“ ist gegenwärtiges, verständliches Deutsch und erhält die pointierte Charakterisierung.
- source_word: נִשְׁתָּוָה
  choice: gleichen einander
  rationale: Das Verb drückt Gleichheit beziehungsweise Vergleichbarkeit aus. Die deutsche Pluralform macht die Gleichsetzung der beiden genannten Größen idiomatisch deutlich, ohne eine weitergehende Identität zu behaupten.
