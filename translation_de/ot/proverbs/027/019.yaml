  text: כַּ֭/מַּיִם הַ/פָּנִ֣ים לַ/פָּנִ֑ים כֵּ֤ן לֵֽב הָ֝/אָדָ֗ם לָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/019.yaml
  text: As in water face reflects face[b][a], so the heart of man reflects man.
translation:
  language: de
  text: Wie im Wasser ein Gesicht dem Gesicht entspricht[b], so entspricht das Herz des Menschen dem Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden Vorkommen von אָדָם können allgemein „Mensch“ bedeuten. Die knappe Verhältnisangabe „Herz des Menschen zu Mensch“ kann das Herz als Entsprechung bzw. Ausdruck des Menschen verstehen; sie wird auch auf die Beziehung eines Menschen zu einem anderen bezogen.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Wie Wasser, das Gesicht zum Gesicht, so das Herz des Menschen zum Menschen.“ Im Hebräischen steht kein Verb; „entspricht“ ist aus dem Vergleich ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמַּיִם
  choice: Wie im Wasser
  rationale: Das Präfix כַּ leitet den Vergleich ein. Das Deutsche benötigt hier idiomatisch „im Wasser“, weil das Gesicht beziehungsweise sein Bild darin sichtbar wird.
- source_word: הַפָּנִים לַפָּנִים
  choice: ein Gesicht das Gesicht widerspiegelt
  rationale: Der hebräische Ausdruck lautet wörtlich „das Gesicht zum Gesicht“ und enthält kein Verb. „widerspiegelt“ erschließt die durch das Wasser nahegelegte Vergleichsbeziehung, ohne die Bildsprache aufzugeben.
- source_word: כֵּן
  choice: so
  rationale: „so“ bildet mit „wie“ die natürliche deutsche Entsprechung der hebräischen Vergleichsformel.
- source_word: לֵב
  choice: das Herz
  rationale: „Herz“ bewahrt das zentrale Bild des Hebräischen und bezeichnet hier den inneren Menschen mit Denken, Haltung und Beweggründen.
- source_word: הָאָדָם ... לָאָדָם
  choice: des Menschen ... den Menschen
  rationale: „Mensch“ gibt אָדָם in seinem allgemeinen Sinn wieder. Das ergänzte „widerspiegelt“ führt den Vergleich parallel fort; die knappe hebräische Verhältnisangabe mit ל bleibt jedoch mehrdeutig und wird deshalb in einer Fußnote erläutert.
theological_decisions:
- issue: Bezug von „Herz des Menschen“ auf „den Menschen“
  choice: Das Herz des Menschen spiegelt den Menschen wider.
  alternative: Ein Mensch spiegelt sich im Herzen eines anderen.
  rationale: Die gewählte Fassung versteht das Herz als Ausdruck oder Spiegel des Menschen selbst und folgt damit eng der Parallelität zum Spiegelbild im Wasser. Da לָאָדָם auch eine Beziehung zu einem anderen Menschen bezeichnen kann, wird diese verbreitete Deutung nicht ausgeschlossen, sondern als Alternative angegeben.
- issue: Generische Bedeutung von אָדָם
  choice: Mensch
  alternative: Menschheit
  rationale: Der Singular „Mensch“ bewahrt die Form des hebräischen Spruchs und ist im modernen Deutschen natürlich generisch, ohne das Geschlecht stärker festzulegen als der Kontext.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit der würdevollen Bildsprache eines Weisheitsspruchs. Die auffällige Wiederholung von „Gesicht“ und „Mensch“ hält die hebräische Parallelstruktur sichtbar; die Fußnoten bewahren die grammatische Ellipse und die sachliche Mehrdeutigkeit.
