  variant: modern standard German
source:
  edition: WLC
  text: אַכְזְרִיּ֣וּת חֵ֭מָה וְ/שֶׁ֣טֶף אָ֑ף וּ/מִ֥י יַ֝עֲמֹד לִ/פְנֵ֥י קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/004.yaml
  text: Wrath is cruel[a], and anger is a flood, but who can stand before jealousy?
translation:
  language: de
  text: Grausam ist der Zorn, und der Ärger eine Flut; doch wer kann vor der Eifersucht[a] bestehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Neid“. Das hebräische Wort קִנְאָה kann je nach Zusammenhang Eifersucht oder Neid bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכְזְרִיּוּת
  choice: grausam
  rationale: Das Substantiv bezeichnet Grausamkeit oder Härte. In dem verblosen Satz wird es prädikativ wiedergegeben; das klingt im Deutschen natürlich und bewahrt die Aussage.
- source_word: חֵמָה
  choice: Zorn
  rationale: Das Wort bezeichnet heftigen, glühenden Zorn. „Zorn“ erhält die Intensität und unterscheidet den Ausdruck vom folgenden אָף.
- source_word: שֶׁטֶף
  choice: eine Flut
  rationale: Das Substantiv bezeichnet eine überströmende Flut oder einen reißenden Strom. „Eine Flut“ bewahrt das knappe, eindrückliche Bild.
- source_word: אָף
  choice: Ärger
  rationale: Die idiomatische Bedeutung ist Zorn oder Ärger. „Ärger“ vermeidet eine Wiederholung von „Zorn“, ohne die parallelen Begriffe gleichzusetzen.
- source_word: וּמִי
  choice: doch wer
  rationale: Die Verbindung leitet die steigernde Gegenüberstellung ein. „Doch wer“ gibt den rhetorischen Kontrast im Deutschen prägnant wieder.
- source_word: יַעֲמֹד
  choice: kann bestehen
  rationale: Das Verb bedeutet „stehen“ oder „standhalten“. „Kann bestehen“ bewahrt das Bild des Standhaltens und die rhetorische Aussage über menschliches Vermögen.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bedeutet wörtlich „vor“ beziehungsweise „angesichts“. „Vor“ erhält die räumliche Metapher.
- source_word: קִנְאָה
  choice: Eifersucht
  rationale: Der Begriff kann je nach Zusammenhang Eifersucht, Neid oder Eifer bezeichnen. Im Kontext zerstörerischer Leidenschaften passt „Eifersucht“ gut; die echte Alternative „Neid“ wird in der Fußnote bewahrt.
theological_decisions: []
