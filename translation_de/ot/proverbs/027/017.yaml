  text: Iron sharpens iron[a], and a man sharpens the face of his friend.
translation:
  language: de
  text: 'Eisen schärft Eisen,

    und ein Mann schärft das Gesicht seines Freundes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Eisen schärft Eisen, und ein Mann schärft den anderen.« Wörtlich heißt es im Hebräischen: »schärft das Gesicht seines Freundes«. Gemeint sein kann, dass ein Mensch den anderen fördert oder schärft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל בְּבַרְזֶל
  choice: Eisen schärft Eisen
  rationale: בַּרְזֶל bezeichnet eindeutig Eisen; das Präfix בְּ kennzeichnet hier Mittel oder wechselseitigen Kontakt. Die knappe deutsche Form bewahrt Bild und Parallelismus.
- source_word: יָחַד / יַחַד
  choice: schärft
  rationale: Die Hifil-Form bedeutet in diesem Zusammenhang »scharf machen, schärfen«. Die Wiederholung desselben Verbs in beiden Vershälften bleibt erhalten.
- source_word: וְאִישׁ
  choice: und ein Mann
  rationale: אִישׁ ist grammatisch maskulin und bezeichnet hier exemplarisch einen Mann. Die konkrete Form des hebräischen Spruchs wird nicht stillschweigend verallgemeinert.
- source_word: פְּנֵי
  choice: das Angesicht
  rationale: Wörtlich steht »das Angesicht/Gesicht«. »Angesicht« bewahrt das konkrete, leicht fremdartige Bild und lässt offen, ob Ausdruck, Auftreten oder die Person selbst gemeint ist.
- source_word: רֵעֵהוּ
  choice: seines Freundes
  rationale: רֵעַ kann Freund, Gefährte oder Mitmensch bedeuten. »Freund« passt zum persönlichen Zusammenhang, ohne dem Ausdruck eine besondere Lehrbedeutung aufzuerlegen.
theological_decisions:
- issue: Exemplarische maskuline Ausdrucksweise in der Weisheitsliteratur
  choice: ein Mann
  alternative: ein Mensch / einer den anderen
  rationale: Der hebräische Text verwendet ausdrücklich אִישׁ. Die Übersetzung erhält diese Form, obwohl die Aussage als Weisheitsspruch über den konkreten männlichen Wortlaut hinaus anwendbar ist.
- issue: Bedeutung des geschärften »Angesichts«
  choice: das Angesicht seines Freundes
  alternative: seinen Freund / den Charakter seines Freundes
  rationale: Die Metapher kann persönliche Förderung, geistige Schärfung oder eine Wirkung auf Auftreten und Ausdruck bezeichnen. Die wörtlich-nahe Wiedergabe entscheidet diese Mehrdeutigkeit nicht vorschnell.
translation_notes:
  register: Knapper, würdevoller Spruchstil in modernem Standarddeutsch. »Angesicht« ist bewusst gehobener als »Gesicht«, da es die ungewöhnliche hebräische Metapher besser trägt; die Fußnote erschließt die geläufigere sinngemäße Lesart.
