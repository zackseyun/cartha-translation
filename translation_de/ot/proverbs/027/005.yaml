  text: ט֭וֹבָה תּוֹכַ֣חַת מְגֻלָּ֑ה מֵֽ/אַהֲבָ֥ה מְסֻתָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/005.yaml
  text: Open rebuke is better than hidden love[a].
translation:
  language: de
  text: Offene Zurechtweisung ist besser als verborgene Liebe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verheimlichte Liebe“. Das Hebräische kann Liebe meinen, die nicht gezeigt oder ausgesprochen wird, nicht unbedingt fehlende Liebe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָה
  choice: ist besser
  rationale: Mit der anschließenden Vergleichspräposition מִן hat das Adjektiv hier idiomatisch komparative Bedeutung.
- source_word: תּוֹכַחַת
  choice: Zurechtweisung
  rationale: Das Substantiv bezeichnet eine ausdrücklich geäußerte Korrektur oder Rüge. „Zurechtweisung“ bewahrt die Schärfe, ohne unnötig altertümlich zu wirken.
- source_word: מְגֻלָּה
  choice: offene
  rationale: Das Partizip bedeutet wörtlich „aufgedeckt/offengelegt“. „Offene“ bezeichnet eine unverdeckte, klar ausgesprochene Zurechtweisung, ohne zwingend Öffentlichkeit zu behaupten.
- source_word: מִן
  choice: als
  rationale: Die Präposition markiert nach טוֹבָה den Vergleich und wird im Deutschen idiomatisch mit „als“ wiedergegeben.
- source_word: אַהֲבָה
  choice: Liebe
  rationale: Die direkte und übliche Wiedergabe erhält die allgemeine Bedeutung des hebräischen Substantivs.
- source_word: מְסֻתָּרֶת
  choice: verborgene
  rationale: Das Partizip bezeichnet etwas Verborgenes oder Verheimlichtes. „Verborgene Liebe“ wahrt die mögliche Bedeutung einer vorhandenen, aber nicht sichtbaren oder nicht geäußerten Liebe.
theological_decisions:
- issue: Bedeutung der verborgenen Liebe
  choice: Die Formulierung bleibt mehrdeutig und kann Liebe bezeichnen, die nicht gezeigt oder ausgesprochen wird.
  alternative: Eine heimliche oder bewusst verheimlichte Liebe.
  rationale: Der hebräische Ausdruck entscheidet nicht eindeutig, weshalb die Übersetzung keine bestimmte moralische oder romantische Deutung festlegt.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die sprichwörtliche Parallelstruktur und die Mehrdeutigkeit des Schlussausdrucks bleiben erhalten.
