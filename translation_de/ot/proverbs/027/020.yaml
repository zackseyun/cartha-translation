id: PRO.27.20
reference: Proverbs 27:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שְׁא֣וֹל ו/אבדה לֹ֣א תִשְׂבַּ֑עְנָה וְ/עֵינֵ֥י הָ֝/אָדָ֗ם לֹ֣א תִשְׂבַּֽעְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/020.yaml
  text: Sheol and Abaddon are never satisfied[b][a], and the eyes of man are never satisfied.
translation:
  language: de
  text: Scheol und Abaddon[a] werden niemals satt, und die Augen des Menschen[b] werden niemals satt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Verderben«. Der hebräische Ausdruck kann das Verderben selbst oder den Ort beziehungsweise den personhaft vorgestellten Bereich des Verderbens bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Der Mensch« ist hier allgemein gemeint und bezeichnet Menschen insgesamt.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration bewahrt den hebräischen Begriff für das Totenreich und vermeidet eine Verengung auf »Grab« oder eine Gleichsetzung mit späteren Vorstellungen von »Hölle«.
- source_word: אבדה
  choice: Abaddon
  rationale: Die Transliteration wahrt den orts- beziehungsweise personhaft wirkenden Parallelbegriff zu »Scheol«. Die Bedeutung »Verderben« bleibt in einer Fußnote sichtbar.
- source_word: לֹא תִשְׂבַּעְנָה
  choice: werden niemals satt
  rationale: Die Wendung gibt das Bild des unstillbaren Aufnehmens natürlich wieder. Ihre identische Wiederholung erhält den ausgewogenen Parallelismus des Hebräischen.
- source_word: עֵינֵי הָאָדָם
  choice: die Augen des Menschen
  rationale: Die wörtliche Bildsprache der Augen als Ausdruck menschlichen Begehrens bleibt erhalten; »des Menschen« gibt den generischen Singular im modernen Deutschen natürlich wieder.
theological_decisions:
- issue: Generische Bedeutung von הָאָדָם
  choice: des Menschen
  alternative: der Menschen / der Menschheit
  rationale: Der bestimmte Singular bezeichnet hier den Menschen allgemein. Die gewählte Form bewahrt den Singular und ist im Deutschen zugleich auf Menschen insgesamt beziehbar; eine Fußnote stellt den generischen Sinn klar.
- issue: Verständnis von שְׁאוֹל und אבדה
  choice: Scheol und Abaddon als parallele Bezeichnungen aus dem Bereich von Tod und Verderben
  alternative: Grab und Verderben
  rationale: Die Transliteration vermeidet, die hebräischen Begriffe auf spätere dogmatische Kategorien festzulegen, und bewahrt zugleich ihre poetische Parallelität.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die zweimalige Formulierung »werden niemals satt« bewahrt bewusst die hebräische Wiederholung und den sprichwörtlichen Rhythmus.
