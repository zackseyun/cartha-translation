  text: נֶ֭אֱמָנִים פִּצְעֵ֣י אוֹהֵ֑ב וְ֝/נַעְתָּר֗וֹת נְשִׁיק֥וֹת שׂוֹנֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/006.yaml
  text: Faithful are the wounds of a friend[a], but the kisses of an enemy are excessive.
translation:
  language: de
  text: Treu gemeint sind die Wunden eines Freundes, doch überreich sind die Küsse eines Feindes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische ist schwierig; möglich ist eine Bedeutung wie »reichlich« oder »überreich«. Die übermäßigen Küsse eines Feindes können im Zusammenhang als unaufrichtig oder täuschend verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱמָנִים
  choice: treu gemeint
  rationale: Das Adjektiv bezeichnet Verlässlichkeit oder Vertrauenswürdigkeit. »Treu gemeint« gibt im Deutschen natürlich wieder, dass die schmerzhaften Verletzungen durch einen Freund aus redlicher, verlässlicher Absicht kommen.
- source_word: פִּצְעֵי
  choice: Wunden
  rationale: Das Substantiv bezeichnet Wunden oder Verletzungen und bewahrt hier das eindrückliche Bild für schmerzhafte, aber gut gemeinte Zurechtweisung.
- source_word: אוֹהֵב
  choice: eines Freundes
  rationale: Das Partizip bedeutet wörtlich »eines Liebenden« beziehungsweise »eines Menschen, der liebt«. Im weisheitlichen Gegensatz zu שׂוֹנֵא ist »Freund« die natürliche deutsche Wiedergabe.
- source_word: וְנַעְתָּרוֹת
  choice: doch überreich sind
  rationale: Die schwierige Form wird hier in ihrem naheliegenden quantitativen Sinn als »überreich, übermäßig zahlreich« verstanden. »Überreich« wahrt zugleich den Verdacht, dass die Küsse übertrieben und daher unaufrichtig sind, ohne diese Deutung in den Haupttext einzutragen.
- source_word: נְשִׁיקוֹת
  choice: die Küsse
  rationale: Die direkte Bedeutung ist »Küsse«; im Zusammenhang stehen sie für demonstrative Zeichen der Zuneigung.
- source_word: שׂוֹנֵא
  choice: eines Feindes
  rationale: Das Partizip bedeutet wörtlich »eines Hassenden«. »Feind« bildet im Deutschen den klaren und natürlichen Gegenpol zu »Freund«.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Spruchform in modernem Standarddeutsch. Die vorangestellte Wendung »Treu gemeint« nimmt die hebräische Wortstellung auf, bleibt aber verständlicher als das im Deutschen missverständliche »Treu sind die Wunden«. Der Gegensatz zwischen schmerzlicher Freundestreue und demonstrativer Feindeszuneigung bleibt zugespitzt; die lexikalische Unsicherheit der zweiten Vershälfte wird in der Fußnote offengelegt.
