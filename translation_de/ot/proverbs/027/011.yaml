  text: חֲכַ֣ם בְּ֭נִ/י וְ/שַׂמַּ֣ח לִבִּ֑/י וְ/אָשִׁ֖יבָה חֹרְפִ֣/י דָבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/011.yaml
  text: Be wise[a], my son, and make my heart glad[b], that I may answer the one who reproaches me.
translation:
  language: de
  text: Sei weise[a], mein Sohn, und erfreue mein Herz, damit ich dem, der mich schmäht, antworten kann.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Werde weise, mein Sohn.“ Der hebräische Imperativ kann sowohl den Zustand als auch das Streben nach Weisheit hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „damit ich dem, der mich schmäht, ein Wort zurückgeben kann“ – das heißt: „damit ich ihm antworten kann“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם
  choice: Sei weise
  rationale: Der maskuline Singular-Imperativ von חכם fordert den Sohn zur Weisheit auf. „Sei weise“ ist knapp und natürlich; „Werde weise“ bleibt als mögliche Nuance in der Fußnote erhalten.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: בן mit Suffix der 1. Person Singular bedeutet wörtlich „mein Sohn“. Die konkrete Anrede des hebräischen Weisheitslehrers wird beibehalten.
- source_word: וְשַׂמַּח לִבִּי
  choice: und erfreue mein Herz
  rationale: Der Hifil-Imperativ von שׂמח ist kausativ, und לִבִּי bezeichnet das Herz des Sprechers. Die Wiedergabe bewahrt sowohl die Kausalität als auch das konkrete Bild.
- source_word: וְאָשִׁיבָה ... דָבָר
  choice: damit ich ... antworten kann
  rationale: Der Kohortativ von שוב steht mit דָבָר in der Wendung „ein Wort zurückgeben“, also „antworten“. „Damit“ gibt hier den naheliegenden Zweck beziehungsweise die Folge der vorausgehenden Aufforderung wieder.
- source_word: חֹרְפִי
  choice: dem, der mich schmäht
  rationale: Das aktive Partizip von חרף mit Suffix der 1. Person Singular bezeichnet jemanden, der den Sprecher schmäht oder verhöhnt. Die Formulierung erhält den persönlichen und fortdauernden Charakter.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem, knappem Weisheitsstil. Die direkte Vater-Sohn-Anrede und das hebräische Bild vom erfreuten Herzen bleiben erhalten; die idiomatische Wendung „ein Wort zurückgeben“ wird im Haupttext natürlich als „antworten“ wiedergegeben.
