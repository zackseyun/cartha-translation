  text: צֹפְנֶ֥י/הָ צָֽפַן ר֑וּחַ וְ/שֶׁ֖מֶן יְמִינ֣/וֹ יִקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/016.yaml
  text: Whoever restrains her restrains the wind[a], and his right hand grasps oil.
translation:
  language: de
  text: Wer sie zurückhält, hält den Wind zurück, und seine rechte Hand greift nach Öl.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher könnte die zweite Vershälfte lauten: »und seine rechte Hand ruft Öl«. Der hebräische Text ist hier schwierig; die Wiedergabe im Haupttext folgt dem wahrscheinlichen Sinn des Sprichworts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹפְנֶיהָ
  choice: wer sie zurückhält
  rationale: Die Partizipialform mit Suffix der 3. Person feminin Singular bezieht sich im Zusammenhang auf die streitsüchtige Frau aus Vers 15. Obwohl צפן gewöhnlich »verbergen« oder »aufbewahren« bedeutet, legt der Vergleich mit dem Wind hier den Sinn »zurückhalten, im Zaum halten« nahe.
- source_word: צָפַן
  choice: hält … zurück
  rationale: 'Die Wiederholung desselben deutschen Verbs bewahrt das hebräische Wortspiel und macht die Parallele deutlich: Sie zurückhalten zu wollen ist so aussichtslos, wie den Wind zurückzuhalten.'
- source_word: רוּחַ
  choice: den Wind
  rationale: Das konkrete Bild handelt von etwas, das sich nicht beherrschen lässt; daher ist hier »Wind« und nicht »Geist« gemeint.
- source_word: וְשֶׁמֶן
  choice: Öl
  rationale: »Öl« ist die direkte Entsprechung. »Olivenöl« wäre kulturgeschichtlich wahrscheinlich, steht aber nicht ausdrücklich im hebräischen Text.
- source_word: יְמִינוֹ
  choice: mit seiner rechten Hand
  rationale: Die ausdrücklich genannte rechte Hand bleibt als körperliches Bild erhalten. Die deutsche Präpositionalfügung klingt natürlicher als »seine rechte Hand« als handelndes Subjekt.
- source_word: יִקְרָא
  choice: versucht er, … festzuhalten
  rationale: קרא bedeutet gewöhnlich »rufen«; an dieser Stelle ist der hebräische Text jedoch äußerst schwierig. Die sinngemäße Wiedergabe fügt sich in das Bild eines vergeblichen Versuchs, etwas Unfassbares beziehungsweise Glitschiges festzuhalten. Die wörtlichere Lesart wird in der Fußnote offengelegt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, sprichwortartiger Parallelstruktur. Die Bezugnahme auf die Frau aus dem vorhergehenden Vers bleibt durch »sie« erhalten. Die schwierige zweite Vershälfte wird im Haupttext sinngemäß und in der Fußnote formal näher wiedergegeben.
