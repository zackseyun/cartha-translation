  terminology: „zurückhält“, „Wind“, „rechte Hand“ und „Öl“ sind modernstandardsprachlich, registergerecht und terminologisch passend. Die feminine Rückverweisung mit „sie“ bleibt ohne unnötige Ausdeutung erhalten.
