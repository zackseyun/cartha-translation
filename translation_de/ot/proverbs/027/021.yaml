source:
  edition: WLC
  text: מַצְרֵ֣ף לַ֭/כֶּסֶף וְ/כ֣וּר לַ/זָּהָ֑ב וְ֝/אִ֗ישׁ לְ/פִ֣י מַהֲלָלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/021.yaml
  text: The crucible is for silver[a], and the furnace for gold, and a man is tested by his praise.
translation:
  language: de
  text: Der Schmelztiegel ist für Silber da und der Ofen für Gold; ein Mann wird an seinem Lob geprüft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Mann wird an dem geprüft, was er lobt«; auch möglich: »Ein Mann wird durch das Lob geprüft, das er erhält.«'
    reason: Die hebräische Wendung kann sowohl das Lob bezeichnen, das ein Mensch ausspricht, als auch das Lob, das ihm gespendet wird.
lexical_decisions:
- source_word: מַצְרֵף
  choice: Schmelztiegel
  rationale: Bezeichnet ein Gefäß zum Läutern von Metall. »Schmelztiegel« gibt das konkrete Bild präzise und im modernen Deutsch verständlich wieder.
- source_word: לַכֶּסֶף
  choice: für Silber
  rationale: 'Die Präposition bezeichnet hier Zweck oder Eignung: Der Schmelztiegel dient der Bearbeitung von Silber.'
- source_word: כּוּר
  choice: Ofen
  rationale: Gemeint ist ein Schmelz- beziehungsweise Läuterofen. Im parallelen Bild ist das knappe »Ofen« natürlich und eindeutig.
- source_word: לַזָּהָב
  choice: für Gold
  rationale: Parallel zu »für Silber« bezeichnet die Wendung das Metall, für dessen Läuterung der Ofen bestimmt ist.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das hebräische Substantiv ist maskulin Singular. Die Wiedergabe bewahrt die konkrete Form des Spruchs, ohne seine allgemein-menschliche Anwendbarkeit auszuschließen.
- source_word: לְפִי
  choice: an … geprüft
  rationale: Die Wendung bedeutet wörtlich »nach dem Mund von« und hier sinngemäß »nach Maßgabe von« oder »anhand von«. Die Formulierung »an … geprüft« verbindet diesen Maßstab natürlich mit dem vorausgehenden Läuterungsbild.
- source_word: מַהֲלָלוֹ
  choice: seinem Lob
  rationale: Das Wort kann das von einem Menschen ausgesprochene Lob, seine Lobwürdigkeit beziehungsweise seinen Ruf oder das ihm gespendete Lob bezeichnen. »Seinem Lob« erhält die knappe Mehrdeutigkeit des Hebräischen.
theological_decisions:
- issue: Mehrdeutigkeit des letzten Satzglieds
  choice: ein Mann aber wird an seinem Lob geprüft
  alternative: 'Ein Mann wird an dem geprüft, was er lobt; oder: Ein Mann wird durch das Lob geprüft, das er erhält.'
  rationale: לְפִי מַהֲלָלוֹ lässt offen, ob das Lob vom Mann ausgeht oder ihm gilt. Der Haupttext legt sich nicht auf eine dieser Auslegungen fest; die Fußnote nennt die wichtigsten Verständnisweisen ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Metallurgie bleibt anschaulich; das Semikolon macht den Vergleich deutlich, ohne eine im Hebräischen nicht ausdrücklich vorhandene Deutung einzufügen.
