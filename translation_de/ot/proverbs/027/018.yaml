id: PRO.27.18
reference: Proverbs 27:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נֹצֵ֣ר תְּ֭אֵנָה יֹאכַ֣ל פִּרְיָ֑/הּ וְ/שֹׁמֵ֖ר אֲדֹנָ֣י/ו יְכֻבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/018.yaml
  text: Whoever tends a fig tree will eat its fruit[b][a], and he who watches over his master will be honored.
translation:
  language: de
  text: Wer einen Feigenbaum pflegt, wird seine Frucht essen; und wer auf seinen Herrn achtet,[a] wird geehrt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer seinen Herrn behütet“ beziehungsweise „wer treu für seinen Herrn sorgt“. Das hebräische Wort bezeichnet aufmerksames Bewahren und muss nicht nur körperlichen Schutz meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  choice: pflegt
  rationale: Das Partizip bezeichnet Bewahren oder Hüten; bei einem Feigenbaum ist im Deutschen „pflegt“ die natürliche Wiedergabe für beständige, sorgfältige Fürsorge.
- source_word: תְּאֵנָה
  choice: Feigenbaum
  rationale: Gemeint ist der Baum, nicht nur die Feige als Frucht; so bleibt das konkrete landwirtschaftliche Bild erhalten.
- source_word: יֹאכַל
  choice: wird … essen
  rationale: Das Imperfekt beschreibt hier die regelmäßig zu erwartende Folge in sprichwörtlicher Form.
- source_word: פִּרְיָהּ
  choice: seine Frucht
  rationale: Das feminine Suffix bezieht sich auf den Feigenbaum; im Deutschen entspricht dem grammatisch maskulinen „Feigenbaum“ das Pronomen „seine“.
- source_word: שֹׁמֵר
  choice: auf … achtet
  rationale: Das Partizip bedeutet bewahren, hüten oder aufmerksam beachten. „Auf seinen Herrn achten“ bezeichnet hier treue, aufmerksame Zuwendung, ohne die Bedeutung auf körperlichen Schutz oder bloßen Dienst einzuengen.
- source_word: אֲדֹנָיו
  choice: seinen Herrn
  rationale: אָדוֹן bezeichnet einen Herrn oder Gebieter. „Herrn“ gibt die soziale Rangbeziehung würdig und idiomatisch wieder, ohne einen göttlichen Bezug festzulegen.
- source_word: יְכֻבָּד
  choice: wird geehrt werden
  rationale: Die Pual-Form von כבד bezeichnet das Empfangen von Ehre; die passive Wiedergabe entspricht der hebräischen Form und dem erwarteten Ergebnis treuer Aufmerksamkeit.
theological_decisions:
- issue: Bezug von אֲדֹנָיו („seinen Herrn“)
  choice: Ein menschlicher Herr oder Vorgesetzter in einer Weisheitsanalogie über treue Aufmerksamkeit
  alternative: Der Herr, also Gott, als weiterführende Anwendung
  rationale: Der hebräische Ausdruck enthält kein Merkmal, das einen göttlichen Bezug verlangt. Der Parallelismus mit der Pflege eines Feigenbaums legt zunächst eine gewöhnliche soziale Beziehung nahe; eine theologische Anwendung wird dadurch nicht ausgeschlossen, aber nicht in den Wortlaut eingetragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Sprichwortton. Die beiden parallelen Ursache-Folge-Aussagen bleiben erhalten. „Herr“ ist hier relational und nicht als Gottesbezeichnung festgelegt.
