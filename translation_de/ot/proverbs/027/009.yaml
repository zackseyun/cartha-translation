  yaml_path: translation/ot/proverbs/027/009.yaml
  text: Oil and incense make the heart glad[a], and the sweetness of a friend comes from the counsel of the soul.
translation:
  language: de
  text: Öl und Räucherwerk erfreuen das Herz; ebenso kommt die Annehmlichkeit eines Freundes von Rat aus tiefster Seele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Annehmlichkeit eines Freundes ist besser als eigener Rat.“ Die zweite Vershälfte ist im Hebräischen sehr knapp formuliert und lässt sich unterschiedlich verstehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁמֶן
  choice: Öl
  rationale: Die direkte Wiedergabe bewahrt das konkrete Bild; im Zusammenhang kann wohlriechendes Salböl mitgemeint sein.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: Der Ausdruck bezeichnet duftendes Räucherwerk und bildet mit Öl ein anschauliches Paar angenehmer Düfte.
- source_word: יְשַׂמַּח לֵב
  choice: erfreuen das Herz
  rationale: Dies gibt die kausative Verbform und das hebräische Bild vom Herzen als Zentrum des inneren Empfindens natürlich wieder.
- source_word: מֶתֶק רֵעֵהוּ
  choice: die wohltuende Nähe eines Freundes
  rationale: מֶתֶק bedeutet wörtlich Süße beziehungsweise Annehmlichkeit. Im Deutschen vermittelt „wohltuende Nähe“ die bildhafte angenehme Wirkung des Freundes, ohne körperliche Süße nahezulegen.
- source_word: מֵעֲצַת נָפֶשׁ
  choice: die aus dem Rat seiner Seele kommt
  rationale: מִן wird als Herkunftsangabe verstanden, עֵצָה als Rat und נֶפֶשׁ als Seele beziehungsweise inneres Selbst. Die ungewöhnlich knappe Formulierung wird bewusst nicht zu „aufrichtigem Rat“ geglättet.
theological_decisions:
- issue: Bezug und Funktion von מֵעֲצַת נָפֶשׁ
  choice: 'Herkunftsangabe: Die wohltuende Wirkung des Freundes kommt aus dem Rat seiner Seele.'
  alternative: 'Vergleich: Die Annehmlichkeit eines Freundes ist besser als der eigene Rat.'
  rationale: Die hebräische zweite Zeile ist syntaktisch sehr knapp. Die Hauptfassung nimmt מִן in seiner gewöhnlichen Herkunftsbedeutung, während die Fußnote die plausible vergleichende Deutung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Duftbild der ersten Vershälfte bleibt konkret; die ungewöhnliche Rede vom „Rat seiner Seele“ bewahrt die Mehrdeutigkeit der hebräischen zweiten Vershälfte. Der Fußnotenmarker steht im Haupttext.
