  text: כְּבָשִׂ֥ים לִ/לְבוּשֶׁ֑/ךָ וּ/מְחִ֥יר שָׂ֝דֶ֗ה עַתּוּדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/026.yaml
  text: Lambs are for your clothing[a], and goats are the price of a field.
translation:
  language: de
  text: Lämmer sind für deine Kleidung da, und Ziegenböcke sind der Kaufpreis für ein Feld.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּבָשִׂים
  choice: Lämmer
  rationale: Das Substantiv bezeichnet junge Schafe beziehungsweise Lämmer. „Lämmer“ gibt die naheliegende lexikalische Bedeutung wieder und passt zum Bild der Versorgung durch die Herde.
- source_word: לִלְבוּשֶׁךָ
  choice: für deine Kleidung
  rationale: Die Präposition לְ drückt hier Zweck oder Verwendung aus; das Suffix der 2. Person Singular wird mit „deine“ wiedergegeben.
- source_word: וּמְחִיר
  choice: und … sind der Kaufpreis
  rationale: מְחִיר bezeichnet Preis oder Kaufpreis. Die im Hebräischen fehlende Kopula wird im Deutschen ergänzt; „Kaufpreis“ verdeutlicht die wirtschaftliche Funktion der Tiere.
- source_word: שָׂדֶה
  choice: für ein Feld
  rationale: שָׂדֶה bedeutet hier unmittelbar „Feld“; der unbestimmte Artikel entspricht dem sprichwortartigen Kontext.
- source_word: עַתּוּדִים
  choice: Ziegenböcke
  rationale: Das hebräische Wort bezeichnet spezifisch männliche Ziegen. „Ziegenböcke“ bewahrt diese Präzision natürlich und verständlich.
theological_decisions: []
translation_notes:
  register: Knappes, parallel gebautes Sprichwort in modernem, würdigem Standarddeutsch. Die beiden verblosen hebräischen Nominalsätze werden mit „sind“ wiedergegeben; „sind … da“ macht den Zweckbezug der ersten Hälfte idiomatisch deutlich, ohne die landwirtschaftliche Bildsprache auszudeuten.
