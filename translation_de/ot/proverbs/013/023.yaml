  text: רָב אֹ֭כֶל נִ֣יר רָאשִׁ֑ים וְ/יֵ֥שׁ נִ֝סְפֶּ֗ה בְּ/לֹ֣א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/023.yaml
  text: The fallow ground of the poor[b][a] yields abundant food, but some are swept away for lack of justice.
translation:
  language: de
  text: Der frisch gepflügte Acker[a] der Armen bringt reichlich Nahrung hervor, doch mancher wird hinweggerafft, weil das Recht fehlt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „das umgebrochene Land“, „das Ackerland“ oder „der Neubruch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die knappe hebräische Formulierung kann auch unpersönlicher wiedergegeben werden: „Doch manches wird ohne Recht hinweggerafft.“'
    reason: alternative_reading
lexical_decisions:
- source_word: רָב אֹכֶל
  choice: reichlich Nahrung
  rationale: רָב bezeichnet hier die große Menge, אֹכֶל allgemein Nahrung beziehungsweise essbaren Ertrag. Die Formulierung bleibt breit genug für den landwirtschaftlichen Zusammenhang.
- source_word: נִיר
  choice: frisch gepflügter Acker
  rationale: Das Wort bezeichnet zur Bearbeitung umgebrochenes beziehungsweise pflügbares Land. Die gewählte Formulierung ist im heutigen Deutsch verständlicher als das fachsprachliche „Neubruch“ und vermeidet den möglichen Eindruck, unbearbeitetes Brachland trage von selbst Frucht.
- source_word: רָאשִׁים
  choice: der Armen
  rationale: Die ungewöhnliche Form wird im Kontext traditionell und sachlich überzeugend auf arme Menschen bezogen. „der Armen“ ist knapp und natürlich.
- source_word: וְיֵשׁ נִסְפֶּה
  choice: doch mancher wird hinweggerafft
  rationale: וְיֵשׁ führt im Zusammenhang einen Gegensatz ein; das singularische נִסְפֶּה wird mit „mancher“ wiedergegeben. „Hinweggerafft“ bewahrt die passive, eindringliche Bildlichkeit, ohne die Art des Verderbens festzulegen.
- source_word: בְּלֹא מִשְׁפָּט
  choice: weil das Recht fehlt
  rationale: מִשְׁפָּט kann Recht, Gerechtigkeit oder gerichtliche Entscheidung bezeichnen. Die Formulierung gibt das Fehlen gerechter Ordnung als Ursache wieder, ohne den Ausdruck auf ein bestimmtes Verfahren zu beschränken.
theological_decisions:
- issue: Bezug und Aussage des zweiten Halbverses
  choice: Der zweite Halbvers spricht von einem Menschen, der zugrunde geht, weil Recht beziehungsweise Gerechtigkeit fehlt.
  alternative: 'Die knappe Formulierung kann unpersönlich verstanden werden: Etwas, etwa der Ertrag, wird ohne Recht oder gerechte Ordnung vernichtet.'
  rationale: Das maskuline singularische Partizip נִסְפֶּה legt einen menschlichen Bezug nahe, während die Konstruktion mit יֵשׁ und das fehlende ausdrückliche Subjekt eine unpersönlichere Wiedergabe zulassen. Die Hauptfassung bewahrt die sozialethische Spannung; die Fußnote macht die grammatische Offenheit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Frisch gepflügter Acker“ vermittelt das landwirtschaftliche Bild allgemeinverständlich; „hinweggerafft“ erhält die kraftvolle Bildsprache des hebräischen Passivs. Die Satzstellung wurde für natürliches Deutsch geglättet, ohne die Spannung zwischen reichem Ertrag und fehlendem Recht aufzulösen.
