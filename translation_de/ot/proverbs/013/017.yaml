  yaml_path: translation/ot/proverbs/013/017.yaml
  text: A wicked messenger falls into trouble[b][a], but a faithful envoy brings healing.
translation:
  language: de
  text: Ein böser Bote fällt ins Unglück[a], doch ein zuverlässiger Gesandter[b] bringt Heilung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fällt in Unheil/Böses“. Das hebräische Wort kann sowohl moralisch Böses als auch erfahrenes Unheil oder Unglück bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Beauftragter“ oder „Botschafter“. Im Hebräischen stehen in den beiden Vershälften zwei verschiedene Wörter für einen Boten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָךְ
  choice: Bote
  rationale: Im sozialen Kontext der Sprüche bezeichnet das Wort hier einen menschlichen Überbringer, nicht ein himmlisches Wesen. „Bote“ ist die natürliche und umfassende deutsche Entsprechung.
- source_word: רָשָׁע
  choice: gottlos
  rationale: Das Adjektiv kennzeichnet den Boten moralisch. „Gottlos“ gibt den ethischen Gehalt im weisheitlichen Sprachgebrauch würdig und verständlich wieder.
- source_word: יִפֹּל
  choice: stürzt
  rationale: Das Imperfekt formuliert eine allgemeine sprichwörtliche Wahrheit. Das Präsens ist dafür im Deutschen idiomatisch; „stürzt“ bewahrt zudem das Bild des Fallens.
- source_word: בְּרָע
  choice: ins Unglück
  rationale: רָע kann hier das Unheil beziehungsweise die schädliche Folge bezeichnen, die den Boten trifft. „Ins Unglück“ passt zum Verb des Fallens und zum Gegensatz der Heilung, ohne die mögliche Bedeutung „Böses/Unheil“ zu verschweigen.
- source_word: צִיר
  choice: Gesandter
  rationale: Das Wort bezeichnet häufig einen beauftragten oder offiziellen Übermittler. „Gesandter“ unterscheidet es im Deutschen von מַלְאָךְ („Bote“) und erhält den Parallelismus.
- source_word: אֱמוּנִים
  choice: zuverlässig
  rationale: Die Form bezeichnet Treue, Verlässlichkeit oder Vertrauenswürdigkeit. „Zuverlässig“ beschreibt in diesem Zusammenhang klar, dass der Gesandte seinen Auftrag treu erfüllt.
- source_word: מַרְפֵּא
  choice: Heilung
  rationale: Das Substantiv bezeichnet Heilung, Genesung oder Wiederherstellung. „Heilung“ bewahrt die bildhafte Weite und bildet den positiven Gegensatz zum Unglück.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Satzform. Die unterschiedlichen hebräischen Bezeichnungen für den Überbringer werden durch „Bote“ und „Gesandter“ sichtbar gemacht; die Ergänzung „bringt“ gibt den verblosen zweiten Satz natürlich wieder.
