source:
  edition: WLC
  text: אוֹר צַדִּיקִ֥ים יִשְׂמָ֑ח וְ/נֵ֖ר רְשָׁעִ֣ים יִדְעָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/009.yaml
  text: The light of the righteous rejoices[a], but the lamp of the wicked goes out.
translation:
  language: de
  text: Das Licht der Gerechten freut sich[a], doch die Lampe der Frevler erlischt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist froh“. Das hebräische Verb bedeutet gewöhnlich „sich freuen“ oder „froh sein“. Weil „Licht“ das Subjekt ist, verstehen es manche hier dem Zusammenhang nach im Sinn von „strahlt hell“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: Licht
  rationale: אוֹר bezeichnet gewöhnlich Licht oder Helligkeit. „Licht“ ist hier die natürliche Entsprechung und steht im poetischen Kontrast zur „Lampe“ im zweiten Versglied.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Das substantivisch gebrauchte Adjektiv im Plural bezeichnet die moralische Gruppe der Gerechten. Der Genitiv gibt die hebräische Zuordnung knapp und würdig wieder.
- source_word: יִשְׂמָח
  choice: freut sich
  rationale: Das Verb שׂמח bedeutet gewöhnlich „sich freuen“ oder „froh sein“. Die Wiedergabe bewahrt die Personifikation des Lichts, ohne die kontextuell mögliche Deutung „strahlt hell“ in den Haupttext einzutragen.
- source_word: נֵר
  choice: Lampe
  rationale: נֵר bezeichnet eine Lampe, typischerweise eine Öllampe, nicht speziell eine Kerze. „Lampe“ wahrt zudem den Unterschied zu „Licht“ im ersten Versglied.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Das substantivisch gebrauchte Adjektiv im Plural bezeichnet Menschen, die schuldhaft und gottlos handeln. „Frevler“ ist in deutscher Weisheitsliteratur knapp und bildet einen klaren Gegenpol zu „Gerechten“.
- source_word: יִדְעָךְ
  choice: erlischt
  rationale: Das Verb bezeichnet das Erlöschen beziehungsweise Ausgehen eines Lichts. „Erlischt“ ist idiomatisch, präzise und lässt offen, ob eine äußere Ursache im Blick ist.
- source_word: וְ
  choice: doch
  rationale: Obwohl die Konjunktion formal meist „und“ bedeutet, verbindet sie hier antithetische Versglieder. „Doch“ bringt diesen Gegensatz in natürlichem Deutsch zum Ausdruck.
