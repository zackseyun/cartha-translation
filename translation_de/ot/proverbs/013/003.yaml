source:
  edition: WLC
  text: נֹצֵ֣ר פִּ֭י/ו שֹׁמֵ֣ר נַפְשׁ֑/וֹ פֹּשֵׂ֥ק שְׂ֝פָתָ֗י/ו מְחִתָּה לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/003.yaml
  text: Whoever guards his mouth preserves his life[b][a]; whoever opens wide his lips comes to ruin.
translation:
  language: de
  text: Wer seinen Mund hütet, bewahrt sein Leben[a]; wer seine Lippen weit aufreißt, dem wird es zum Verderben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch wörtlich „seine nefesch“. Das Wort kann je nach Zusammenhang auch „Seele“ oder „sich selbst“ bedeuten; hier ist am ehesten das eigene Leben gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „für den ist es Verderben“ oder „der bringt Verderben über sich“. Die hebräische Wendung ist knapp und lässt mehrere eng verwandte Wiedergaben zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  choice: hütet
  rationale: Das Partizip bezeichnet wachsames Bewahren. „Hütet“ klingt im Deutschen natürlich und bringt die bewusste Zurückhaltung beim Reden zum Ausdruck.
- source_word: פִּיו
  choice: seinen Mund
  rationale: Die konkrete Bildsprache des hebräischen Singulars mit Suffix bleibt erhalten.
- source_word: שֹׁמֵר
  choice: bewahrt
  rationale: Das Verb bedeutet grundsätzlich „bewahren, behüten“. In Verbindung mit „sein Leben“ bezeichnet es hier die Folge beherrschten Redens, ohne diese Beziehung übermäßig auszudeuten.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נֶפֶשׁ meint in diesem Weisheitskontext am natürlichsten das Leben beziehungsweise die eigene Person, nicht speziell eine vom Körper getrennte Seele.
- source_word: פֹּשֵׂק
  choice: weit aufreißt
  rationale: Das Verb beschreibt ein weites Öffnen. „Weit aufreißt“ bewahrt das kräftige konkrete Bild ungezügelten Redens.
- source_word: שְׂפָתָיו
  choice: seine Lippen
  rationale: Die wörtliche Wiedergabe erhält den Parallelismus von „Mund“ und „Lippen“.
- source_word: מְחִתָּה לוֹ
  choice: dem droht Verderben
  rationale: Die knappe Nominalkonstruktion bezeichnet Verderben oder Untergang für die betreffende Person. „Dem droht Verderben“ ist idiomatisch und wahrt die elliptische Aussage, ohne eindeutig festzulegen, ob das Verderben bereits eintritt oder als Folge bevorsteht.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ
  choice: Leben
  alternative: Seele; sich selbst
  rationale: „Leben“ passt zum weisheitlichen Zusammenhang und vermeidet eine unnötige anthropologische Festlegung auf eine immaterielle Seele.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Der antithetische Parallelismus sowie die konkrete Bildsprache von Mund und Lippen bleiben erhalten.
