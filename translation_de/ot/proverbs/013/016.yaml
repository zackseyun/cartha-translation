  text: כָּל עָ֭רוּם יַעֲשֶׂ֣ה בְ/דָ֑עַת וּ֝/כְסִ֗יל יִפְרֹ֥שׂ אִוֶּֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/016.yaml
  text: Every prudent man acts with knowledge[a], but a fool displays folly.
translation:
  language: de
  text: Jeder Kluge handelt mit Einsicht, doch ein Narr breitet seine Torheit aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »stellt seine Torheit zur Schau« beziehungsweise »legt seine Torheit offen«. Das hebräische Verb bezeichnet ein Ausbreiten oder Sichtbarmachen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Jeder
  rationale: Die distributive Wiedergabe entspricht dem allgemeinen, sprichwortartigen Charakter des Satzes.
- source_word: עָרוּם
  choice: Kluge
  rationale: Das Wort bezeichnet in den Sprüchen meist einen Menschen mit praktischer Einsicht und Umsicht; »klug« ist hier positiv und im Deutschen natürlich.
- source_word: יַעֲשֶׂה בְדָעַת
  choice: handelt mit Bedacht
  rationale: Die Verbindung beschreibt ein Handeln, das von Wissen und Einsicht bestimmt ist. »Mit Bedacht« gibt dies idiomatisch wieder, ohne das Wissen auf bloße Informationskenntnis zu verengen.
- source_word: וּכְסִיל
  choice: doch ein Narr
  rationale: »Doch« macht den im Parallelismus angelegten Gegensatz deutlich; »Narr« bewahrt den charakteristischen Weisheitsbegriff.
- source_word: יִפְרֹשׂ
  choice: breitet … aus
  rationale: Die konkrete Bildlichkeit des Verbs »ausbreiten/offen hinlegen« bleibt erhalten und lässt offen, ob der Narr seine Torheit absichtlich vorzeigt oder sie durch sein Verhalten sichtbar macht.
- source_word: אִוֶּלֶת
  choice: Torheit
  rationale: »Torheit« ist die prägnante, traditionelle und weiterhin verständliche Wiedergabe des abstrakten Weisheitsbegriffs.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Spruchstil mit knappem antithetischem Parallelismus. Das generische Maskulinum der hebräischen Einzelfiguren wird durch »jeder Kluge« und »ein Narr« sachgerecht bewahrt; gemeint sind jeweils Menschen allgemein.
