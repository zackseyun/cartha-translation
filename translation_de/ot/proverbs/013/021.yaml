source:
  edition: WLC
  text: חַ֭טָּאִים תְּרַדֵּ֣ף רָעָ֑ה וְ/אֶת צַ֝דִּיקִ֗ים יְשַׁלֶּם טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/021.yaml
  text: Disaster pursues sinners, but good repays the righteous.
translation:
  language: de
  text: Unheil verfolgt die Sünder, doch den Gerechten vergilt das Gute.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָה
  choice: Unheil
  rationale: Das hebräische Wort bezeichnet hier wahrscheinlich das widerfahrende Böse, also Unglück oder Unheil; „Unheil“ bewahrt zugleich die knappe Personifikation des Spruchs.
- source_word: תְּרַדֵּף
  choice: verfolgt
  rationale: 'Gibt die intensive Verbform anschaulich und unmittelbar wieder: Das Unheil setzt den Sündern nach.'
- source_word: חַטָּאִים
  choice: die Sünder
  rationale: Direkte und im Deutschen geläufige Wiedergabe der Personenbezeichnung.
- source_word: צַדִּיקִים
  choice: den Gerechten
  rationale: Bewahrt den weisheitlichen Gegensatz zwischen Sündern und Menschen, die gerecht handeln.
- source_word: יְשַׁלֶּם
  choice: vergilt
  rationale: Das Verb bedeutet „bezahlen, vergelten, erstatten“. „Vergilt“ erhält den Gedanken einer entsprechenden Rückgabe, ohne ihn bloß als allgemeines Belohnen abzuschwächen.
- source_word: טוֹב
  choice: das Gute
  rationale: Die substantivierte Wiedergabe wahrt die knappe Personifikation und die mögliche Bedeutungsbreite von Gutem, Wohlergehen und günstiger Folge.
theological_decisions:
- issue: Handelndes Subjekt im zweiten Halbvers
  choice: „das Gute“ bleibt ausdrücklich Subjekt von „vergilt“
  alternative: „den Gerechten wird Gutes vergolten“ oder „Gott belohnt die Gerechten mit Gutem“
  rationale: Im masoretischen Text steht טוֹב als Subjekt nahe; Gott wird nicht ausdrücklich genannt. Die ungewöhnliche Personifikation soll deshalb nicht theologisch vereindeutigt werden.
- issue: Art des weisheitlichen Zusammenhangs
  choice: knappe, allgemeine Aussage ohne ergänzende Einschränkung
  alternative: ausdrückliche Kennzeichnung als bloße Tendenz oder als ausnahmsloses Vergeltungsgesetz
  rationale: Der Spruch formuliert pointiert, erklärt aber weder Mechanismus noch Zeitpunkt. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Knapper, würdiger Parallelismus in modernem Standarddeutsch. „Unheil“ und „das Gute“ spiegeln die personifizierten Gegenpole; „vergilt“ ist bewusst präziser als „belohnt“ und natürlicher als „zahlt zurück“.
