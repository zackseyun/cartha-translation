  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des Hebräischen präzise wieder: רָעָה ist als Subjekt von תְּרַדֵּף („Unheil verfolgt“) getroffen; im zweiten Halbvers bleibt טוֹב als nicht weiter bestimmtes, personifiziertes Subjekt von יְשַׁלֵּם erhalten. „vergilt“ bildet die Vergeltungsbedeutung von יְשַׁלֵּם angemessen ab, ohne Gott als Handelnden einzutragen. Er stimmt zudem mit dem englischen POB-Audittext überein.'
  naturalness: „Unheil verfolgt die Sünder, doch den Gerechten vergilt das Gute“ ist klares, modernes Standarddeutsch mit bewusst knapper, sprichwörtlicher Wortstellung. Die Voranstellung von „den Gerechten“ ist poetisch-natürlich und unterstützt den Parallelismus.
  terminology: „Sünder“, „Gerechten“, „Unheil“ und „das Gute“ sind registergerecht und wahren die weisheitliche Gegenüberstellung. Insbesondere vermeidet „das Gute“ eine unzulässige dogmatische Festlegung auf Gott oder eine bloße Umschreibung als Belohnung.
