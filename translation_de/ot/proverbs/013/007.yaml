source:
  edition: WLC
  text: יֵ֣שׁ מִ֭תְעַשֵּׁר וְ/אֵ֣ין כֹּ֑ל מִ֝תְרוֹשֵׁ֗שׁ וְ/ה֣וֹן רָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/007.yaml
  text: There is one who pretends to be rich[a], yet has nothing; another pretends to be poor, yet has great wealth.
translation:
  language: de
  text: Mancher gibt sich reich[a] und hat doch gar nichts; ein anderer gibt sich arm und besitzt doch großen Reichtum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mancher macht sich reich und hat doch gar nichts; ein anderer macht sich arm und besitzt doch großen Reichtum.“ Die reflexiven hebräischen Verben können sowohl die Selbstdarstellung als auch eine tatsächliche Bereicherung beziehungsweise Verarmung bezeichnen. Der Haupttext folgt wegen der zugespitzten Ironie des Spruchs dem Sinn der äußeren Darstellung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Mancher
  rationale: Die Existenzpartikel leitet eine allgemeine Beobachtung ein. „Mancher“ gibt den sentenzartigen Charakter im Deutschen natürlich wieder.
- source_word: מִתְעַשֵּׁר
  choice: gibt sich reich
  rationale: Der Hitpael von עשר kann das Sich-reich-Darstellen oder das Sich-Bereichern bezeichnen. Der Gegensatz zu völliger Besitzlosigkeit legt hier die Darstellung nach außen nahe.
- source_word: וְאֵין כֹּל
  choice: und hat doch gar nichts
  rationale: אֵין mit כֹּל bezeichnet völligen Mangel. „doch“ macht den impliziten Gegensatz deutlich, „gar nichts“ wahrt die Verstärkung.
- source_word: מִתְרוֹשֵׁשׁ
  choice: gibt sich arm
  rationale: Die reflexive Form kann das Sich-arm-Darstellen oder das Sich-arm-Machen ausdrücken. Parallel zum ersten Halbvers wird im Haupttext die Bedeutung der Selbstdarstellung gewählt.
- source_word: וְהוֹן רָב
  choice: und besitzt doch großen Reichtum
  rationale: הוֹן bezeichnet Vermögen oder Reichtum, רָב dessen große Fülle. „besitzt“ formuliert die im nominalen hebräischen Satz ausgesagte Zugehörigkeit natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, ausgewogener Spruchform. Die Wiederholung „gibt sich“ bildet den hebräischen Parallelismus ab; „doch“ verdeutlicht jeweils den scharfen Gegensatz.
