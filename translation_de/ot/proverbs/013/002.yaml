  text: מִ/פְּרִ֣י פִי אִ֭ישׁ יֹ֣אכַל ט֑וֹב וְ/נֶ֖פֶשׁ בֹּגְדִ֣ים חָמָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/002.yaml
  text: From the fruit of a man's mouth he eats good[b][a], but the soul of the treacherous feeds on violence.
translation:
  language: de
  text: Von der Frucht seines Mundes isst ein Mensch Gutes; doch das Verlangen der Treulosen richtet sich auf Gewalt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „doch die Seele der Treulosen — Gewalt“. Die hebräische zweite Vershälfte hat kein Verb. נֶפֶשׁ kann hier auch „Seele“, „Begierde“ oder „Appetit“ bedeuten; möglich ist daher auch der Sinn: „Die Seele der Treulosen verzehrt Gewalt.“'
    reason: lexical_alternative_and_elliptical_clause
lexical_decisions:
- source_word: מִפְּרִי
  choice: Von der Frucht
  rationale: Bewahrt das konkrete Bild von der „Frucht“ als Ertrag oder Folge des Redens; מִן bezeichnet hier den Ursprung dessen, was der Mensch empfängt.
- source_word: פִי אִישׁ
  choice: seines Mundes … ein Mensch
  rationale: „Mund“ erhält die hebräische Metonymie für das Reden. אִישׁ bezeichnet in diesem allgemeinen Weisheitsspruch einen Menschen; das Possessivpronomen stellt den natürlichen deutschen Bezug her.
- source_word: יֹאכַל טוֹב
  choice: isst … Gutes
  rationale: Der Imperfekt beschreibt eine allgemeingültige beziehungsweise gewohnheitsmäßige Folge. „Isst“ bewahrt die Verbindung zum Bild der Frucht, während „Gutes“ die inhaltliche Weite von טוֹב erhält.
- source_word: נֶפֶשׁ
  choice: Verlangen
  rationale: נֶפֶשׁ kann Seele, Leben, Person, Begierde oder Appetit bezeichnen. In der knappen Gegenüberstellung mit „Gewalt“ ist „Verlangen“ im Deutschen verständlich, ohne die Aussage auf körperlichen Hunger zu verengen; die wörtlichere Möglichkeit wird in der Fußnote genannt.
- source_word: בֹּגְדִים
  choice: der Treulosen
  rationale: Das Partizip bezeichnet Menschen, die treulos, verräterisch oder hinterhältig handeln. „Treulose“ gibt diese charakterisierende und allgemein gehaltene Bedeutung natürlich wieder.
- source_word: חָמָס
  choice: Gewalt
  rationale: חָמָס bezeichnet Gewalt sowie gewaltsames Unrecht. „Gewalt“ ist hier prägnant und lässt die moralische Schwere des Ausdrucks bestehen.
theological_decisions:
- issue: Die zweite Vershälfte enthält kein ausdrückliches Verb und lässt das Verhältnis zwischen נֶפֶשׁ und חָמָס offen.
  choice: „das Verlangen der Treulosen richtet sich auf Gewalt“
  alternative: „die Seele der Treulosen [isst] Gewalt“ oder „die Seele der Treulosen ist Gewalt“
  rationale: Die gewählte Fassung versteht נֶפֶשׁ als Begehren und ergänzt eine Zielbeziehung, die im Deutschen idiomatisch ist. Da der hebräische Nominalsatz äußerst knapp und mehrdeutig bleibt, werden die näher am Wortlaut liegenden Deutungen in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache von Frucht, Mund und Essen bleibt erhalten; die Ellipse und die Bedeutungsbreite der zweiten Vershälfte werden nicht stillschweigend beseitigt, sondern in der Fußnote transparent gemacht.
