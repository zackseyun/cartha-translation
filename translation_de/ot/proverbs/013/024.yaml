source:
  edition: WLC
  text: חוֹשֵׂ֣ךְ שִׁ֭בְט/וֹ שׂוֹנֵ֣א בְנ֑/וֹ וְ֝/אֹהֲב֗/וֹ שִֽׁחֲר֥/וֹ מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/024.yaml
  text: Whoever withholds his rod hates his son[b][a], but whoever loves him diligently seeks discipline.
translation:
  language: de
  text: Wer seine Rute zurückhält[a], hasst seinen Sohn; wer ihn aber liebt, bemüht sich mit Nachdruck um seine Zurechtweisung.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Rute schont“. Das hebräische Verb kann „zurückhalten“, „vorenthalten“ oder „schonen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung enthält das Bild des frühen Suchens und meint ein eifriges, gewissenhaftes oder nachdrückliches Bemühen um Zurechtweisung.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹשֵׂךְ
  choice: zurückhält
  rationale: Das Partizip von חשׂך bezeichnet ein Vorenthalten oder Zurückhalten. „Zurückhält“ bewahrt die aktive Aussage des Hebräischen und vermeidet den im heutigen Deutschen möglicherweise positiv klingenden Eindruck von „schonen“.
- source_word: שִׁבְטוֹ
  choice: seine Rute
  rationale: שֵׁבֶט bezeichnet einen Stab, eine Rute oder ein Zepter. Im Zusammenhang elterlicher Zurechtweisung bleibt „Rute“ das direkte und konkrete Bild des Ausgangstextes.
- source_word: שׂוֹנֵא
  choice: hasst
  rationale: Das Verb bedeutet hier ausdrücklich „hassen“. Die schroffe Formulierung wird als Teil der zugespitzten Gegenüberstellung des Spruchs nicht abgeschwächt.
- source_word: בְנוֹ
  choice: seinen Sohn
  rationale: Der hebräische Text nennt ausdrücklich den Sohn. Die geschlechtsspezifische Form wird beibehalten, ohne die mögliche allgemeine Anwendung des Spruchs in den Text hineinzuschreiben.
- source_word: וְאֹהֲבוֹ
  choice: wer ihn aber liebt
  rationale: Die partizipiale Wendung wird idiomatisch wiedergegeben; „ihn“ nimmt wie das hebräische Objektsuffix auf den Sohn Bezug.
- source_word: שִׁחֲרוֹ
  choice: bemüht sich mit Nachdruck um
  rationale: Die Piel-Form von שׁחר hat wörtlich eine mit frühem Suchen verbundene Bildlichkeit und bezeichnet idiomatisch eifriges, gewissenhaftes oder nachdrückliches Bemühen. Die gewählte Formulierung gibt diese Zielstrebigkeit in natürlichem Deutsch wieder.
- source_word: מוּסָר
  choice: Zurechtweisung
  rationale: מוּסָר umfasst im Sprüchebuch erzieherische Unterweisung, Korrektur und disziplinierende Maßnahme. „Zurechtweisung“ betont hier passend zur Rute den korrigierenden Aspekt, ohne den Begriff auf körperliche Strafe zu verengen.
theological_decisions:
- issue: Ob das Bild körperlicher Züchtigung abgeschwächt werden soll
  choice: Das konkrete Bild der „Rute“ bleibt erhalten, während מוּסָר mit dem breiteren Begriff „Zurechtweisung“ wiedergegeben wird.
  alternative: „Rute“ durch eine allgemeine Formulierung wie „Korrektur“, „Grenzen“ oder „Führung“ ersetzen.
  rationale: Der hebräische Text verwendet ausdrücklich שֵׁבֶט und verbindet elterliche Liebe mit aktiver Zurechtweisung. Die Übersetzung darf dieses spannungsreiche Bild weder beseitigen noch den umfassenderen Begriff מוּסָר auf körperliche Bestrafung reduzieren.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die zugespitzte Antithese und das konkrete Bild der Rute bleiben erhalten; eine altertümliche oder ausschließlich körperlich verstandene Wortwahl wie „Züchtigung“ wird vermieden.
