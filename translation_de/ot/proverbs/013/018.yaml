id: PRO.13.18
reference: Proverbs 13:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רֵ֣ישׁ וְ֭/קָלוֹן פּוֹרֵ֣עַ מוּסָ֑ר וְ/שׁוֹמֵ֖ר תּוֹכַ֣חַת יְכֻבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/018.yaml
  text: Poverty and disgrace come to one who ignores discipline[b][a], but whoever heeds reproof will be honored.
translation:
  language: de
  text: Armut und Schande treffen den, der Erziehung verwirft; wer aber Zurechtweisung beherzigt, wird geehrt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֵישׁ
  choice: Armut
  rationale: Das Substantiv bezeichnet Armut oder Mangel; „Armut“ ist im modernen Standarddeutsch klar und natürlich.
- source_word: קָלוֹן
  choice: Schande
  rationale: Das Wort bezeichnet öffentliche Beschämung oder Ehrverlust; „Schande“ bewahrt die soziale Dimension und den würdevollen Spruchton.
- source_word: פּוֹרֵעַ
  choice: der … verwirft
  rationale: Das Partizip von פרע bezeichnet hier das Vernachlässigen, Sich-Entziehen oder Abwerfen von Zucht. „Verwirft“ bringt die aktive Zurückweisung knapp zum Ausdruck, ohne den Satz unnötig auszudeuten.
- source_word: מוּסָר
  choice: Erziehung
  rationale: In den Sprüchen umfasst מוּסָר erzieherische Unterweisung, Korrektur und Zucht. „Erziehung“ ist heute verständlich und vermeidet die mögliche Verengung von „Disziplin“ auf Selbstbeherrschung oder Strafe.
- source_word: שׁוֹמֵר
  choice: beherzigt
  rationale: Wörtlich bedeutet das Partizip „bewahrt“ oder „hütet“. Im Zusammenhang bezeichnet es, eine Zurechtweisung aufmerksam anzunehmen und festzuhalten; „beherzigt“ gibt diese Bedeutung idiomatisch wieder.
- source_word: תּוֹכַחַת
  choice: Zurechtweisung
  rationale: Das Substantiv bezeichnet eine tadelnde oder korrigierende Äußerung. „Zurechtweisung“ ist verständlich, würdig und unterscheidet sich sachgerecht von מוּסָר.
- source_word: יְכֻבָּד
  choice: wird geehrt
  rationale: Die Pual-Form von כבד drückt aus, dass jemand Ehre oder Ansehen empfängt. „Wird geehrt“ bewahrt Form und gesellschaftliche Folgewirkung.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Weisheitsspruch mit knapper antithetischer Parallelstruktur. Die Übersetzung bleibt nahe an der hebräischen Aussage, formuliert aber beide Halbverse natürlich auf Deutsch. „Erziehung“ und „Zurechtweisung“ halten die verwandten, jedoch nicht identischen Begriffe auseinander.
