  text: תּוֹחֶ֣לֶת מְ֭מֻשָּׁכָה מַחֲלָה לֵ֑ב וְ/עֵ֥ץ חַ֝יִּ֗ים תַּאֲוָ֥ה בָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/012.yaml
  text: Hope deferred makes the heart sick[a], but a desire fulfilled is a tree of life.
translation:
  language: de
  text: 'Hoffnung, die sich hinzieht, macht das Herz krank[a]; doch ein erfülltes Verlangen ist ein Baum des Lebens.


    [a] Wörtlicher: »Hingezogene Hoffnung ist Krankheit des Herzens, und ein Verlangen, das eingetroffen ist, ist ein Baum des Lebens.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Hingezogene Hoffnung ist Krankheit des Herzens, und ein Verlangen, das eingetroffen ist, ist ein Baum des Lebens.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: Hoffnung
  rationale: Das Substantiv bezeichnet eine hoffnungsvolle Erwartung. »Hoffnung« ist im Deutschen natürlich und bildet einen klaren Gegenpol zum erfüllten Verlangen.
- source_word: מְמֻשָּׁכָה
  choice: die sich hinzieht
  rationale: Das Partizip bedeutet wörtlich »hingezogen« beziehungsweise »verlängert«. Die Formulierung gibt die quälende Dauer idiomatisch wieder, ohne ausdrücklich einen menschlichen Verursacher der Verzögerung vorauszusetzen.
- source_word: מַחֲלָה לֵב
  choice: macht das Herz krank
  rationale: Die hebräische Nominalkonstruktion lautet wörtlich »Krankheit des Herzens«. Die prädikative Wiedergabe ist klares modernes Deutsch und bewahrt das Körperbild.
- source_word: וְעֵץ חַיִּים
  choice: doch … ein Baum des Lebens
  rationale: Das einfache ו verbindet hier antithetische Vershälften. »Doch« macht den sachlichen Gegensatz im Deutschen deutlich; das biblisch bedeutsame Bild »Baum des Lebens« bleibt erhalten.
- source_word: תַּאֲוָה
  choice: Verlangen
  rationale: Das Wort kann Wunsch, Verlangen oder Begehren bezeichnen. »Verlangen« wahrt seine Intensität, ohne ihm in diesem Zusammenhang eine negative moralische Wertung aufzuerlegen.
- source_word: בָאָה
  choice: erfüllt
  rationale: Wörtlich ist das Verlangen »gekommen« beziehungsweise »eingetroffen«. »Erfüllt« drückt die gemeinte Verwirklichung eines Verlangens in natürlichem Deutsch aus.
theological_decisions:
- issue: Wiedergabe der Konjunktion ו vor עֵץ חַיִּים
  choice: doch
  alternative: und
  rationale: Obwohl ו formal »und« bedeutet, stehen die beiden Vershälften in einem klaren Gegensatz. »Doch« vermittelt diese antithetische Parallelität, ohne den theologischen Gehalt zu erweitern.
- issue: Bildsprache עֵץ חַיִּים
  choice: Baum des Lebens
  alternative: Lebensbaum
  rationale: »Baum des Lebens« bewahrt die wiederkehrende biblische Formulierung und lässt ihre literarischen und theologischen Bezüge offen, statt das Bild auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Der Parallelismus und die Bildsprache bleiben erhalten; die erste Vershälfte wird für idiomatisches Deutsch verbal formuliert. Der Gedankenstrich wurde vermieden, damit die knappe Spruchstruktur durch das Semikolon sichtbar bleibt.
