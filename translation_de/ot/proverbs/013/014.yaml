id: PRO.13.14
reference: Proverbs 13:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תּוֹרַ֣ת חָ֭כָם מְק֣וֹר חַיִּ֑ים לָ֝/ס֗וּר מִ/מֹּ֥קְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/014.yaml
  text: The instruction of a wise man is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: de
  text: Die Unterweisung eines Weisen[a] ist eine Quelle des Lebens, damit man den Fallen des Todes ausweicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen der maskuline Singular „eines Weisen“; diese Einzelfigur kann im Sprüchebuch repräsentativ gemeint sein.
    reason: cultural_note
  - marker: b
    text: 'Oder: „sodass man den Fallen des Todes ausweicht“. Das Hebräische kann hier Zweck oder Folge ausdrücken.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: תּוֹרַת
  choice: Unterweisung eines
  rationale: תּוֹרָה bezeichnet hier im weisheitlichen Zusammenhang nicht ein Gesetzbuch, sondern die vermittelnde Lehre beziehungsweise Unterweisung.
- source_word: חָכָם
  choice: Weisen
  rationale: Der grammatisch maskuline Singular wird formnah wiedergegeben; im Sprüchebuch kann eine solche Einzelfigur zugleich repräsentativ gemeint sein.
- source_word: מְקוֹר
  choice: Quelle
  rationale: מָקוֹר bezeichnet eine Wasserquelle beziehungsweise einen Quellort und bewahrt hier das poetische Bild lebensspendenden Wassers.
- source_word: חַיִּים
  choice: des Lebens
  rationale: Die morphologische Pluralform חַיִּים bezeichnet idiomatisch das Leben.
- source_word: לָסוּר
  choice: damit man … ausweicht
  rationale: Der Infinitiv mit ל kann Zweck oder Folge ausdrücken. Die deutsche Formulierung gibt die Abwendung von einer Gefahr natürlich wieder, ohne die Unterweisung selbst zum grammatischen Handelnden zu machen.
- source_word: מִמֹּקְשֵׁי
  choice: den Fallen … ausweicht
  rationale: מוֹקֵשׁ bezeichnet eine Falle oder Schlinge; „Fallen“ erhält das konkrete Gefahrenbild, während „ausweichen“ die Präposition מִן und das Verb סוּר zusammen natürlich wiedergibt.
- source_word: מָוֶת
  choice: des Todes
  rationale: Die Genitivverbindung bewahrt die knappe und bildhafte Aussage des Hebräischen.
theological_decisions:
- issue: Bezug und Funktion des Infinitivs לָסוּר
  choice: „damit man den Fallen des Todes ausweicht“ als Zweckangabe
  alternative: „sodass man den Fallen des Todes ausweicht“ als Folgeangabe
  rationale: Die Konstruktion lässt Zweck und Ergebnis zu. Der Haupttext wählt die im Zusammenhang gut passende Zwecklesart; die mögliche Ergebnisnuance wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unterweisung“ hält den pädagogischen Weisheitskontext fest; „Quelle des Lebens“ bewahrt das poetische Bild. Die unpersönliche Form „man“ macht den impliziten Adressaten natürlich kenntlich, ohne ihn näher zu bestimmen.
