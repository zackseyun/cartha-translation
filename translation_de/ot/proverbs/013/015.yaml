base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/015.yaml
  text: Good sense gives favor[b][a], but the way of the treacherous is hard.
translation:
  language: de
  text: Gute Einsicht bringt Wohlwollen[a], doch der Weg der Treulosen ist hart[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gute Einsicht verschafft Anerkennung.« Das hebräische Verb bedeutet wörtlich »gibt«, kann hier aber ausdrücken, dass Wohlwollen entsteht oder erlangt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der Weg der Treulosen ist unwegsam.« Das letzte hebräische Wort kann etwas Festes, Dauerhaftes, Raues oder Unnachgiebiges bezeichnen; seine genaue Bedeutung an dieser Stelle ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂכֶל טוֹב
  choice: gute Einsicht
  rationale: Die Wortgruppe bezeichnet gutes Verständnis beziehungsweise gesundes Urteilsvermögen. »Gute Einsicht« ist knapp, würdevoll und bewahrt den Weisheitsbezug.
- source_word: יִתֶּן
  choice: bringt
  rationale: Das Verb bedeutet wörtlich »gibt«. Im Deutschen drückt »bringt« natürlich aus, dass gute Einsicht Wohlwollen hervorruft oder erlangt, ohne den Kausalzusammenhang zu überdeuten.
- source_word: חֵן
  choice: Wohlwollen
  rationale: Gemeint ist hier wohl günstige Aufnahme oder Anerkennung im zwischenmenschlichen Bereich, nicht ausdrücklich theologische Gnade.
- source_word: דֶרֶךְ
  choice: Weg
  rationale: »Weg« bewahrt das in den Sprüchen geläufige Bild für Lebensführung und Verhalten.
- source_word: בֹּגְדִים
  choice: der Treulosen
  rationale: Das substantivierte Partizip bezeichnet Menschen, die treulos, hinterhältig oder verräterisch handeln. »Treulose« hält diese charakterliche und moralische Bedeutung offen.
- source_word: אֵיתָן
  choice: hart
  rationale: Im Kontrast zur ersten Vershälfte wird das Wort am ehesten negativ als hart, rau oder schwer begehbar verstanden. »Hart« ist prägnant und erhält die Bildsprache.
theological_decisions:
- issue: Bedeutung von אֵיתָן in der zweiten Vershälfte
  choice: hart
  alternative: beständig / unnachgiebig / unwegsam
  rationale: Das Wort kann andernorts Dauerhaftigkeit oder Festigkeit bezeichnen. Hier legt der Gegensatz eine belastende oder raue Beschaffenheit des Weges nahe; die Fußnote wahrt die echte lexikalische Spannweite.
translation_notes:
  register: Modernes Standarddeutsch in knapper, sprichwortartiger Form. Die Parallelstruktur und das Wegbild bleiben erhalten; ungebräuchliche oder konfessionell geprägte Ausdrücke werden vermieden.
