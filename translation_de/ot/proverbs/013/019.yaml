id: PRO.13.19
reference: Proverbs 13:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תַּאֲוָ֣ה נִ֭הְיָה תֶּעֱרַ֣ב לְ/נָ֑פֶשׁ וְ/תוֹעֲבַ֥ת כְּ֝סִילִ֗ים ס֣וּר מֵ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/019.yaml
  text: A desire fulfilled is sweet to the soul[a], but to turn away from evil is an abomination to fools.
translation:
  language: de
  text: Ein erfüllter Wunsch ist der Seele süß[a], doch sich vom Bösen abzuwenden ist den Toren ein Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Wunsch, der Wirklichkeit wird, ist der Seele angenehm.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוָה
  choice: Wunsch
  rationale: Das Substantiv bezeichnet ein Begehren oder Verlangen. „Wunsch“ ist im Deutschen weit genug, um die allgemeine Lebensbeobachtung des Spruchs wiederzugeben, ohne sie durch „Begierde“ unnötig negativ zu färben.
- source_word: נִהְיָה
  choice: erfüllt
  rationale: Das Nifal-Partizip von היה beschreibt den Wunsch als eingetreten oder verwirklicht. „Erfüllt“ bildet mit „Wunsch“ eine natürliche deutsche Verbindung und gibt den erreichten Zustand wieder.
- source_word: תֶּעֱרַב
  choice: ist süß
  rationale: Das Verb ערב bedeutet hier „angenehm/süß sein“. „Ist süß“ bewahrt das konkrete Bild der hebräischen Weisheitssprache und bleibt verständlich.
- source_word: לְנָפֶשׁ
  choice: der Seele
  rationale: נפש bezeichnet hier das empfindende innere Selbst beziehungsweise die Person. „Der Seele“ erhält die bildhafte und emotionale Tiefe des Ausdrucks.
- source_word: וְתוֹעֲבַת
  choice: doch … ist … ein Gräuel
  rationale: Die Konjunktion verbindet gegensätzliche Aussagen und wird daher mit „doch“ wiedergegeben. „Gräuel“ bewahrt die starke Wertung von תועבה.
- source_word: כְּסִילִים
  choice: den Toren
  rationale: כסילים sind im Buch der Sprüche moralisch und geistig uneinsichtige Menschen. „Toren“ ist die etablierte, ethisch geprägte Bezeichnung der deutschen Weisheitssprache.
- source_word: סוּר
  choice: sich … abzuwenden
  rationale: Der Infinitiv bezeichnet die bewusste Abkehr. Die reflexive Formulierung ist im Deutschen natürlich und bewahrt den willentlichen moralischen Sinn.
- source_word: מֵרָע
  choice: vom Bösen
  rationale: רע bezeichnet in diesem Weisheitszusammenhang das moralisch Böse, nicht bloß Schaden oder Unglück.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der bildhaften Wendung „der Seele süß“. „Toren“ und „Gräuel“ bewahren den prägnanten Registerton der Weisheitsliteratur, ohne eine konfessionelle Deutung einzutragen.
