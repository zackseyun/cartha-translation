  source_fidelity: Die Gegenüberstellung von träger, unerfüllter Begierde und der erfüllten נֶפֶשׁ der Fleißigen ist zutreffend erfasst. „Hunger“ verengt נֶפֶשׁ jedoch auf körperlichen Hunger, während das Wort hier allgemeiner den Wunsch bzw. das Verlangen bezeichnet. Die explizite Wiedergabe dieses Begriffs in beiden Halbversen bewahrt zudem den hebräischen Parallelismus besser.
