  text: מִתְאַוָּ֣ה וָ֭/אַיִן נַפְשׁ֣/וֹ עָצֵ֑ל וְ/נֶ֖פֶשׁ חָרֻצִ֣ים תְּדֻשָּֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/004.yaml
  text: The sluggard craves[a], but has nothing; but the appetite of the diligent will be richly satisfied.
translation:
  language: de
  text: Der Faule begehrt, doch er bekommt nichts; das Verlangen der Fleißigen aber wird reichlich befriedigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird fett gemacht“ – ein hebräisches Bild für Fülle und reichliche Erfüllung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְאַוָּה
  choice: hat Verlangen
  rationale: Das Hitpael-Partizip von אוה bezeichnet ein anhaltendes Begehren. „Hat Verlangen“ gibt dies natürlich wieder, ohne die Art des Begehrens näher festzulegen.
- source_word: וָאַיִן
  choice: und bekommt doch nichts
  rationale: Die Existenzverneinung bedeutet wörtlich „und da ist nichts“. Im Zusammenhang bezeichnet sie das Ausbleiben dessen, wonach der Faule verlangt; „doch“ macht den Gegensatz im Deutschen deutlich.
- source_word: נַפְשׁוֹ
  choice: implizit im Verlangen des Faulen
  rationale: נֶפֶשׁ kann hier den begehrenden Menschen beziehungsweise seinen Hunger oder sein Verlangen bezeichnen. Eine ausdrückliche Wiedergabe als „Seele“ wäre im modernen Deutschen missverständlich; die Aussage ist in „hat Verlangen“ enthalten.
- source_word: עָצֵל
  choice: der Faule
  rationale: Das substantivierte Adjektiv bezeichnet den gewohnheitsmäßig trägen Menschen. „Der Faule“ ist im Deutschen knapp, verständlich und für den Spruchstil passend.
- source_word: וְנֶפֶשׁ
  choice: der Hunger … aber
  rationale: Im zweiten Halbvers bezeichnet נֶפֶשׁ den Hunger beziehungsweise das Verlangen der Fleißigen. „Hunger“ bewahrt das körperliche Bild, das mit dem Sattwerden korrespondiert.
- source_word: חָרֻצִים
  choice: der Fleißigen
  rationale: Das substantivierte Adjektiv im Plural bezeichnet Menschen, die sich durch Fleiß und Tatkraft auszeichnen.
- source_word: תְּדֻשָּׁן
  choice: wird reichlich gestillt
  rationale: Das Pual von דשׁן bedeutet bildhaft „fett gemacht werden“ und steht für Fülle und volle Befriedigung. „Reichlich gestillt“ überträgt das Bild idiomatisch, ohne es auf materiellen Wohlstand zu verengen.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Spruchstil mit klarer Gegenüberstellung. „Der Faule“ und „die Fleißigen“ sind allgemein und geschlechtsübergreifend zu verstehen. Das wiederholte נֶפֶשׁ wird kontextbezogen wiedergegeben, um im Deutschen eine missverständliche Aussage über die immaterielle Seele zu vermeiden.
