  terminology: „Der Faule“ und „die Fleißigen“ sind passende, registergerechte Wiedergaben. „Verlangen“ gibt נֶפֶשׁ in diesem Kontext weiter und neutraler als das körperlich eingeengte „Hunger“ wieder. Die Fußnote soll das Bild des „Fettgemachtwerdens“ als Ausdruck überreicher Erfüllung erläutern, ohne es auf Sättigung zu beschränken.
