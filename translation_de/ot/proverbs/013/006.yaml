  text: צְ֭דָקָה תִּצֹּ֣ר תָּם דָּ֑רֶךְ וְ֝/רִשְׁעָ֗ה תְּסַלֵּ֥ף חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/006.yaml
  text: Righteousness guards the blameless in the way[a], but wickedness overturns sin.
translation:
  language: de
  text: Gerechtigkeit behütet den, dessen Weg untadelig ist; doch Bosheit bringt die Sünde[a] zu Fall.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Doch Bosheit bringt den Sünder zu Fall. Das hebräische Wort חַטָּאת kann hier auch einen sündigen Menschen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Das Substantiv bezeichnet hier die sittliche Rechtschaffenheit, die schützend wirkt. „Gerechtigkeit“ ist in der Weisheitsliteratur die prägnante und theologisch wie ethisch offene Entsprechung.
- source_word: תִּצֹּר
  choice: behütet
  rationale: נצר bedeutet bewahren, hüten oder schützen. „Behütet“ gibt die schützende Wirkung natürlich und würdig wieder.
- source_word: תָּם דָּרֶךְ
  choice: wer auf seinem Weg untadelig ist
  rationale: Die knappe hebräische Verbindung beschreibt einen Menschen, dessen Lebensweg beziehungsweise Lebensführung untadelig ist. Die Relativkonstruktion ist im modernen Deutschen verständlich, ohne „untadelig“ als Sündlosigkeit zu überdehnen.
- source_word: וְרִשְׁעָה
  choice: doch Bosheit
  rationale: Das ו wird wegen des Gegensatzes adversativ mit „doch“ wiedergegeben. „Bosheit“ bezeichnet hier die sittlich verkehrte Haltung oder Handlungsweise.
- source_word: תְּסַלֵּף
  choice: bringt … zu Fall
  rationale: Die Piel-Form von סלף kann verdrehen, verkehren oder zu Fall bringen bedeuten. „Bringt … zu Fall“ vermittelt hier die zerstörerische Umkehrung und funktioniert sowohl mit „Sünde“ als auch mit der alternativen personenbezogenen Deutung.
- source_word: חַטָּאת
  choice: die Sünde
  rationale: Das feminine Substantiv kann „Sünde“ bezeichnen und in bestimmten Zusammenhängen auch auf einen sündigen Menschen bezogen werden. Die Hauptübersetzung wahrt mit „Sünde“ die formnahe, spannungsreiche Lesart; die personenbezogene Deutung steht in der Fußnote.
theological_decisions:
- issue: Deutung von חַטָּאת im zweiten Halbvers
  choice: „Sünde“ im Haupttext
  alternative: „Sünder“ beziehungsweise „sündiger Mensch“
  rationale: Der hebräische Wortlaut ist knapp und lässt eine abstrakte sowie eine personenbezogene Auffassung zu. Der Haupttext bleibt bei der direkten Wiedergabe „Sünde“, während die Fußnote die im antithetischen Parallelismus naheliegende Deutung als sündiger Mensch bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Das Bild des Lebenswegs bleibt erhalten; die ungewöhnliche Spannung der zweiten Vershälfte wird nicht stillschweigend aufgelöst.
