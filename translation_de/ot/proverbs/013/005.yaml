  source_fidelity: Die erste Vershälfte gibt דבר שקר und ישנא zutreffend wieder. In der zweiten Vershälfte ist „macht sich verhasst“ als idiomatische Wiedergabe von יבאיש vertretbar, schwächt jedoch die Bedeutung „anstößig/abscheulich werden bzw. machen“ etwas ab. „gerät in Schande“ legt für ויחפיר ein widerfahrendes, intransitives Geschehen fest, während die Hifilform auch aktiv „bringt Schande“ bzw. „handelt beschämend“ bedeuten kann. Der Haupttext sollte diese aktivere, im Deutschen natürliche Möglichkeit abbilden und die Auslegungsvariante in der Anmerkung sichern.
  naturalness: „Ein Gerechter“ und „ein Gottloser“ sind in einem knappen Weisheitsspruch gutes modernes Standarddeutsch. „Lügenwort“ ist verständlich, aber leicht künstlich; als bewusste konkrete Entsprechung zu „Wort der Lüge“ ist es noch vertretbar. Die Verbindung „macht sich verhasst und gerät in Schande“ klingt zwar natürlich, ist semantisch für das zweite Verb zu einseitig.
  terminology: „Gerechter“ und „Gottloser“ entsprechen den etablierten Weisheitskategorien צדّיק und רשע. Sie führen keine konfessionelle Zuspitzung ein. Die Fußnote soll die sachlich mögliche Lesart als widerwärtiges und beschämendes Handeln ebenso wie die Lesart von Verhasstwerden/Beschämtwerden offenhalten.
