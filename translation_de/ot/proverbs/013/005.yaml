  text: דְּבַר שֶׁ֭קֶר יִשְׂנָ֣א צַדִּ֑יק וְ֝/רָשָׁ֗ע יַבְאִ֥ישׁ וְ/יַחְפִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/005.yaml
  text: A righteous man hates a lying word[b][a], but a wicked man acts shamefully and disgracefully.
translation:
  language: de
  text: Ein Gerechter hasst ein Lügenwort[a]; ein Gottloser aber macht sich verhasst und bringt Schande.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hasst die Falschheit“. Wörtlich steht im Hebräischen: „ein Wort der Lüge/Falschheit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „handelt abscheulich und schändlich“; auch möglich: „wird verhasst und beschämt“. Die beiden letzten Verben können das anstößige und beschämende Handeln des Gottlosen oder sein Verhasstwerden und Beschämtwerden beschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר שֶׁקֶר
  choice: ein Lügenwort
  rationale: Die Constructusverbindung bedeutet wörtlich „ein Wort der Lüge/Falschheit“. „Lügenwort“ bewahrt das konkrete singularische „Wort“ und bezeichnet im Deutschen knapp eine lügnerische Äußerung.
- source_word: יִשְׂנָא
  choice: hasst
  rationale: Die direkte Wiedergabe des Qal von שׂנא bringt die entschiedene moralische Abneigung des Spruchs zum Ausdruck.
- source_word: צַדִּיק
  choice: ein Gerechter
  rationale: Das substantivierte maskuline Singularadjektiv bezeichnet die beispielhafte Gestalt des Gerechten. Die Formulierung ist prägnant und wahrt die Parallelität zum Gottlosen.
- source_word: רָשָׁע
  choice: ein Gottloser
  rationale: Das substantivierte maskuline Singularadjektiv steht als sprichwörtlicher Gegenpol zu צַדִּיק. „Gottloser“ ist im Weisheitskontext die geläufige moralisch-religiöse Bezeichnung, ohne den Ausdruck auf bloße Religionslosigkeit zu verengen.
- source_word: יַבְאִישׁ
  choice: macht sich verhasst
  rationale: Das Hifil von באש gehört zum Bedeutungsfeld „stinken, anstößig oder widerwärtig werden bzw. machen“. „Macht sich verhasst“ gibt die bildlich-soziale Wirkung natürlich wieder, ohne die zugrunde liegende Geruchsmetapher zur alleinigen Deutung zu machen.
- source_word: וְיַחְפִּיר
  choice: und gerät in Schande
  rationale: Das Verb kann das Beschämtwerden beziehungsweise Schande, aber auch schändliches oder beschämendes Handeln bezeichnen. Die gewählte intransitive Fassung bildet zusammen mit „macht sich verhasst“ eine Aussage über das Ergehen des Gottlosen; die aktive Deutung bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Ergehen oder Verhalten des Gottlosen in der zweiten Vershälfte
  choice: Die beiden Verben werden primär als Beschreibung dessen wiedergegeben, was aus dem Gottlosen wird beziehungsweise was ihm widerfährt.
  alternative: „Ein Gottloser aber handelt abscheulich und schändlich“ oder „verbreitet Abscheu und Schande“.
  rationale: Die hebräischen Verbformen lassen sowohl eine Beschreibung des verwerflichen Handelns als auch des dadurch entstehenden Ansehens und der erfahrenen Schande zu. Der Haupttext entscheidet sich für eine natürliche stativ-resultative Lesart; die Fußnote bewahrt die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen antithetischen Form eines Weisheitsspruchs. „Lügenwort“ ist leicht gehoben, aber transparent; „Gerechter“ und „Gottloser“ bewahren die traditionellen Weisheitskategorien, ohne zusätzliche Lehrbegriffe einzuführen.
