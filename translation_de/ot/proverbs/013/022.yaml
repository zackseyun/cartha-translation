source:
  edition: WLC
  text: ט֗וֹב יַנְחִ֥יל בְּנֵֽי בָנִ֑ים וְ/צָפ֥וּן לַ֝/צַּדִּ֗יק חֵ֣יל חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/022.yaml
  text: A good man leaves an inheritance to his grandchildren[b][a], but the wealth of a sinner is stored up for the righteous.
translation:
  language: de
  text: Ein guter Mensch hinterlässt seinen Enkelkindern[a] ein Erbe, doch das Vermögen eines Sünders ist für den Gerechten aufbewahrt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Kindern der Kinder«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zurückgelegt« beziehungsweise »verborgen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: ein guter Mensch
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet im Spruch einen guten Menschen. Die Wiedergabe ist im modernen Deutschen natürlich und lässt den allgemein-menschlichen Geltungsbereich des Spruchs erkennen, ohne die grammatische Form des Hebräischen unnötig nachzuahmen.
- source_word: יַנְחִיל
  choice: hinterlässt ... ein Erbe
  rationale: Der Hifil von נחל bedeutet, jemanden erben zu lassen beziehungsweise etwas als Erbe zu geben. Die deutsche Wendung gibt diesen kausativen Sinn idiomatisch wieder.
- source_word: בְּנֵי בָנִים
  choice: seinen Enkelkindern
  rationale: Die wörtliche Wendung »Kinder der Kinder« bezeichnet die Enkelgeneration. Das Possessivpronomen ist im Deutschen für die hier vorausgesetzte Familienbeziehung natürlich.
- source_word: וְצָפוּן
  choice: doch ... ist ... aufbewahrt
  rationale: Das passive Partizip von צפן kann »aufbewahrt«, »zurückgelegt« oder »verborgen« bedeuten. »Aufbewahrt« wahrt den Zustandssinn und passt zum Gegensatz der beiden Spruchhälften.
- source_word: לַצַּדִּיק
  choice: für den Gerechten
  rationale: Die Präposition kennzeichnet den Begünstigten; das substantivierte Adjektiv bleibt als singularischer Typus des Gerechten erhalten.
- source_word: חֵיל
  choice: Vermögen
  rationale: חֵיל bezeichnet hier angesichts von Erbe und Besitz die materiellen Mittel beziehungsweise den Reichtum eines Menschen. »Vermögen« ist präzise und in diesem Zusammenhang idiomatisch.
- source_word: חוֹטֵא
  choice: eines Sünders
  rationale: Das substantivisch gebrauchte Partizip bezeichnet typisierend einen Menschen, der sündigt. Der deutsche Genitiv fügt sich natürlich in die Nominalgruppe ein.
theological_decisions:
- issue: Generisches Maskulinum beim substantivierten Adjektiv טוֹב
  choice: ein guter Mensch
  alternative: ein guter Mann / der Gute
  rationale: Die hebräische maskuline Singularform dient in der Spruchweisheit als typisierende Personenbezeichnung. »Mensch« bewahrt die allgemeine Aussage, ohne den Spruch sachlich auf Männer zu beschränken; der ausdrücklich maskuline Gegenbegriff »der Gerechte« bleibt entsprechend der festen theologischen und sprichwörtlichen deutschen Ausdrucksweise erhalten.
- issue: Aussage über den Übergang des Vermögens eines Sünders
  choice: ist für den Gerechten aufbewahrt
  alternative: ist für den Gerechten verborgen / zurückgelegt
  rationale: Der Text beschreibt knapp einen zugunsten des Gerechten bestehenden Zustand, ohne Zeitpunkt, Mittel oder handelnde Person des Vermögensübergangs zu nennen. Die Übersetzung ergänzt daher weder eine unmittelbare Vergeltung noch einen bestimmten göttlichen Mechanismus.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper sprichwörtlicher Gegenüberstellung. »Enkelkinder« und »Vermögen« sind allgemein verständlich; die Fußnoten bewahren die konkrete hebräische Ausdrucksweise und die Bedeutungsbreite von צפן.
