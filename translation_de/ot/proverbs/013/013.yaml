base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/013.yaml
  text: Whoever despises a word will be ruined by it[c][b][a], but he who fears the commandment will be rewarded.
translation:
  language: de
  text: Wer ein Wort[a] verachtet, wird dadurch zugrunde gehen[b]; wer aber ein Gebot fürchtet, der wird belohnt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Sache“ beziehungsweise „eine Angelegenheit“. Das hebräische דָבָר kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird dafür büßen“ beziehungsweise „erleidet dadurch Schaden“. Die hebräische Wendung bezeichnet eine schädliche Folge, ihre genaue Nuance ist jedoch unsicher.'
    reason: textual_or_semantic_difficulty
  - marker: c
    text: 'Wörtlicher: „dem wird vergolten“ oder „der wird entlohnt“. Im Zusammenhang ist eine positive Vergeltung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: verachtet
  rationale: Das Partizip bezeichnet jemanden, der etwas geringschätzt oder mit Verachtung behandelt. „Verachtet“ bewahrt die moralische Schärfe und klingt im Deutschen natürlich.
- source_word: לְדָבָר
  choice: ein Wort
  rationale: דָבָר kann „Wort“, „Angelegenheit“ oder „Sache“ bedeuten. „Ein Wort“ erhält die sprachliche Gestalt und die sprichwörtliche Offenheit des Hebräischen; die weitere Bedeutung wird in einer Fußnote genannt.
- source_word: יֵחָבֶל לוֹ
  choice: zieht sich damit Verderben zu
  rationale: Die schwierige Wendung beschreibt eine nachteilige Folge für den Verächter, bis hin zum Verderben. Die reflexive deutsche Form gibt לוֹ wieder und lässt das verachtete Wort als Anlass der Folge erkennen, ohne die genaue Art des Schadens enger festzulegen.
- source_word: וִירֵא
  choice: wer … fürchtet
  rationale: Die Form von ירא bezeichnet Furcht, hier im Sinn ehrfürchtiger Scheu vor der Verbindlichkeit des Gebots. „Fürchtet“ bewahrt das Leitwort der Weisheitsliteratur und schwächt es nicht zu bloßer Achtung ab.
- source_word: מִצְוָה
  choice: ein Gebot
  rationale: מִצְוָה bedeutet unmittelbar „Gebot“ oder „Befehl“. Der unbestimmte Artikel entspricht dem artikellosen Hebräisch und erhält den allgemeinen Charakter des Spruchs.
- source_word: הוּא יְשֻׁלָּם
  choice: der wird belohnt
  rationale: Das betonte הוּא wird durch das aufnehmende „der“ hörbar gemacht. Das Pual von שלם bedeutet „vergolten/entlohnt werden“; im positiven Gegensatz des Verses ist „belohnt werden“ die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Ehrfürchtige Furcht vor dem Gebot
  choice: „ein Gebot fürchtet“
  alternative: „Ehrfurcht vor einem Gebot hat“
  rationale: Die direkte Wiedergabe erhält die theologisch bedeutsame Spannung des hebräischen ירא. Eine Umschreibung mit „Ehrfurcht“ wäre idiomatischer, würde den Ausdruck jedoch deutend abschwächen.
- issue: Allgemeine Personenbezeichnung im Weisheitsspruch
  choice: Generisches „wer … der“
  alternative: „Ein Mann, der …, er …“
  rationale: Die hebräischen maskulinen Singularformen haben hier sprichwörtlich-allgemeine Funktion. Die deutsche Wer-Konstruktion schließt alle angesprochenen Personen natürlich ein, während „der“ zugleich den Nachdruck des ausdrücklichen הוּא bewahrt.
- issue: Art der Vergeltung im zweiten Halbvers
  choice: positive Vergeltung als „belohnt“
  alternative: 'formal breiter: „dem wird vergolten“'
  rationale: שלם bezeichnet an sich Vergeltung oder Entlohnung, ohne deren Art allein festzulegen. Der antithetische Zusammenhang stellt sie hier jedoch als positive Folge der Gebotsfurcht dar; die wörtlich breitere Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Parallelstruktur. Das Semikolon bildet die hebräische Gegenüberstellung ab. „Fürchtet“ ist bewusst markant und bewahrt die Ausdrucksweise der Weisheitsliteratur; die Fußnoten sichern die echten lexikalischen und semantischen Alternativen.
