  text: בֵּ֣ן חָ֭כָם מ֣וּסַר אָ֑ב וְ֝/לֵ֗ץ לֹא שָׁמַ֥ע גְּעָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/001.yaml
  text: A wise son accepts a father's discipline[b][a], but a scoffer does not listen to rebuke.
translation:
  language: de
  text: Ein weiser Sohn nimmt väterliche Erziehung an[a], doch ein Spötter[b] hört nicht auf Zurechtweisung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein weiser Sohn hört auf väterliche Erziehung.“ Im ersten Satzteil ist das Verb nur sinngemäß zu ergänzen; das hebräische „hören“ kann auch aufmerksames Annehmen oder Befolgen bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Spottender“. Gemeint ist jemand, der Weisung und Zurechtweisung hochmütig zurückweist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  choice: Sohn
  rationale: Das hebräische Substantiv steht im maskulinen Singular und bezeichnet in der Spruchweisheit einen repräsentativen Fall; die geschlechtsspezifische Form wird daher beibehalten.
- source_word: חָכָם
  choice: weise
  rationale: In der Weisheitsliteratur bezeichnet das Adjektiv praktische Lebensklugheit und moralische Einsicht; „weise“ ist die natürliche deutsche Entsprechung.
- source_word: מוּסַר
  choice: Erziehung
  rationale: Das Wort meint in den Sprüchen formende Unterweisung, Einübung und Korrektur. „Erziehung“ gibt diese Breite im Zusammenhang einer Vater-Sohn-Beziehung verständlich wieder.
- source_word: אָב
  choice: väterlich
  rationale: Die hebräische Genitivverbindung enthält kein ausdrückliches Possessivsuffix. „Väterliche Erziehung“ ist im Deutschen natürlich und vermeidet die Präzisierung auf „seines Vaters“.
- source_word: לֵץ
  choice: Spötter
  rationale: Das Wort bezeichnet in den Sprüchen einen Menschen, der sich hochmütig über Weisung und Korrektur hinwegsetzt. „Spötter“ bewahrt diesen etablierten Weisheitstypus.
- source_word: שָׁמַע
  choice: nimmt … an / hört … auf
  rationale: Das Verb kann hören, zuhören oder im Sinne bereitwilliger Aufnahme und Befolgung verstanden werden. Im ersten, elliptischen Satzteil bringt „nimmt … an“ die naheliegende Bedeutung zum Ausdruck; im zweiten ist „hört nicht auf“ eine natürliche Wiedergabe der ausdrücklichen Verweigerung.
- source_word: גְּעָרָה
  choice: Zurechtweisung
  rationale: Das Substantiv bezeichnet einen tadelnden, korrigierenden Ausspruch. „Zurechtweisung“ ist klar und hält den Bezug zur erzieherischen Korrektur fest.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, spruchhafter Gegenüberstellung. „Doch“ markiert den Kontrast, ohne ihn zu verstärken. Die Parallelität bleibt erhalten, während die im ersten Halbvers fehlende Verbform für gutes Deutsch sinngemäß ergänzt wird.
