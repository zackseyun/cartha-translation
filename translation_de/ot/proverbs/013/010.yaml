source:
  edition: WLC
  text: רַק בְּ֭/זָדוֹן יִתֵּ֣ן מַצָּ֑ה וְ/אֶת נ֖וֹעָצִ֣ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/010.yaml
  text: Only by arrogance comes strife[a], but wisdom is with those who take counsel.
translation:
  language: de
  text: Nur durch Überheblichkeit entsteht Streit[a], doch bei denen, die sich beraten lassen, ist Weisheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Übermut bringt nur Streit hervor; doch bei denen, die Rat annehmen, ist Weisheit.'
    reason: Die Stellung von רַק lässt auch die Deutung zu, dass »nur« das Ergebnis einschränkt; außerdem kann נוֹעָצִים als »die Rat annehmen« wiedergegeben werden.
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: 'Das restriktive רַק steht am Anfang und bezieht sich am naheliegendsten auf die folgende Wendung בְּזָדוֹן: »Nur durch Überheblichkeit«. Die alternative Zuordnung »Überheblichkeit bringt nur Streit« bleibt in der Fußnote erhalten.'
- source_word: בְּזָדוֹן
  choice: durch Überheblichkeit
  rationale: זָדוֹן bezeichnet anmaßenden Stolz, Vermessenheit oder Übermut. »Überheblichkeit« ist im modernen Deutschen verständlich und gibt die konfliktfördernde Selbstüberhöhung wieder; בְּ wird instrumental mit »durch« ausgedrückt.
- source_word: יִתֵּן
  choice: entsteht
  rationale: יִתֵּן bedeutet wörtlich »gibt«, doch »gibt Streit« wäre hier unnatürlich. »Entsteht« gibt idiomatisch wieder, dass Streit durch Überheblichkeit hervorgerufen wird.
- source_word: מַצָּה
  choice: Streit
  rationale: מַצָּה bezeichnet Streit, Zank oder Auseinandersetzung. »Streit« ist knapp, geläufig und für den sprichwörtlichen Stil geeignet.
- source_word: וְאֶת
  choice: doch bei
  rationale: Die Verbindung leitet den kontrastierenden zweiten Halbvers ein; אֶת hat hier die Bedeutung »bei/mit«. »Doch bei« macht sowohl den Gegensatz als auch die lokale beziehungsweise relationale Aussage deutlich.
- source_word: נוֹעָצִים
  choice: denen, die sich beraten lassen
  rationale: Das Nifal-Partizip von יעץ kann Menschen bezeichnen, die beraten werden, Rat annehmen oder sich miteinander beraten. »Sich beraten lassen« bewahrt den passiv-reflexiven Zug und ist natürliches Deutsch.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: חָכְמָה ist der zentrale Weisheitsbegriff der Sprüche; »Weisheit« wahrt diese terminologische und literarische Verbindung.
