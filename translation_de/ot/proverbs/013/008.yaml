  text: כֹּ֣פֶר נֶֽפֶשׁ אִ֣ישׁ עָשְׁר֑/וֹ וְ֝/רָ֗שׁ לֹא שָׁמַ֥ע גְּעָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/008.yaml
  text: A man's wealth is the ransom of his life[a], but a poor man does not hear a rebuke.
translation:
  language: de
  text: Der Reichtum eines Mannes ist das Lösegeld für sein Leben; doch ein Armer hört keine Zurechtweisung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doch ein Armer hört keine Drohung“ oder „keinen scharfen Verweis“. Wahrscheinlich ist gemeint, dass ein Armer nicht Ziel einer Erpressung oder Lösegeldforderung wird, weil er nichts zahlen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּפֶר
  choice: Lösegeld
  rationale: Das Wort bezeichnet eine Ausgleichs- oder Lösegeldzahlung, durch die drohender Verlust oder eine Strafe abgewendet wird. „Lösegeld“ bewahrt hier den konkreten wirtschaftlich-rechtlichen Sinn.
- source_word: נֶפֶשׁ
  choice: Leben
  rationale: Im Kontext der Weisheitsliteratur bezeichnet נֶפֶשׁ hier das Leben der Person, nicht ausdrücklich eine vom Körper getrennte Seele.
- source_word: אִישׁ
  choice: eines Mannes
  rationale: Die grammatisch maskuline Einzahl wird entsprechend der hebräischen Form und dem traditionellen Spruchstil wiedergegeben.
- source_word: עָשְׁרוֹ
  choice: sein Reichtum
  rationale: עֹשֶׁר bezeichnet Reichtum oder Vermögen. „Reichtum“ bildet den Gegensatz zum Armen klar und idiomatisch ab.
- source_word: רָשׁ
  choice: ein Armer
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet einen armen oder bedürftigen Mann und wahrt die maskuline Einzahl sowie den Gegensatz der beiden Vershälften.
- source_word: לֹא שָׁמַע
  choice: hört keine
  rationale: Die Wiedergabe mit „hört“ bewahrt das hebräische Bild und legt nicht vorschnell fest, ob es um das bloße Vernehmen oder um das Beachten geht.
- source_word: גְּעָרָה
  choice: Zurechtweisung
  rationale: Das Substantiv bezeichnet eine scharfe Zurechtweisung oder einen Tadel, kann hier im Zusammenhang jedoch auch den Ton einer Drohung annehmen. Die Grundbedeutung bleibt im Haupttext erhalten; die kontextuelle Möglichkeit wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper spruchhafter Parallelstruktur. Die ungewöhnliche Aussage der zweiten Vershälfte wird nicht erklärend geglättet; ihre mögliche soziale Pointe steht in der Fußnote.
