  - severity: low
    issue: „sich mit Toren einlässt“ ist semantisch etwas markierter als der hebräische Ausdruck für Umgang/Gemeinschaft.
    rationale: Die Formulierung ist nicht falsch, kann jedoch ein weitergehendes, womöglich einmaliges oder anrüchiges Sich-Einlassen nahelegen. Eine neutrale Umschreibung wahrt die Parallele zur ersten Zeile besser.
