  text: הלוך אֶת חֲכָמִ֣ים ו/חכם וְ/רֹעֶ֖ה כְסִילִ֣ים יֵרֽוֹעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/020.yaml
  text: Whoever walks with the wise will become wise[a], but a companion of fools will suffer harm.
translation:
  language: de
  text: Wer mit Weisen umgeht, wird weise; wer mit Toren Umgang pflegt, dem wird es schlecht ergehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird Schaden erleiden“, „wird zu Schaden kommen“ oder „wird zugrunde gehen“. Das hebräische Verb kann eine Schädigung oder allgemein einen schlimmen Ausgang bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ אֶת חֲכָמִים
  choice: Wer mit Weisen umgeht
  rationale: Der Ausdruck bezeichnet in sprichwörtlicher Form jemanden, der mit Weisen seinen Weg geht und Gemeinschaft mit ihnen pflegt. „Mit Weisen umgehen“ bewahrt den Gedanken dauerhafter Gemeinschaft in natürlichem Deutsch.
- source_word: וַחֲכָם
  choice: wird weise
  rationale: 'Die Form beschreibt hier am besten die Folge des Umgangs mit Weisen: Der Betreffende gewinnt selbst Weisheit.'
- source_word: וְרֹעֶה כְסִילִים
  choice: wer sich aber mit Toren einlässt
  rationale: רֹעֶה bezeichnet in diesem Zusammenhang nicht wörtlich einen Hirten, sondern jemanden, der Gemeinschaft mit anderen pflegt. „Sich mit … einlassen“ bildet den warnenden Gegensatz zur Gemeinschaft mit Weisen ab.
- source_word: יֵרוֹעַ
  choice: dem wird es schlecht ergehen
  rationale: Das Nifal von רעע bezeichnet ein schädliches oder ungünstiges Ergehen. Die Übersetzung bleibt bewusst allgemein und legt nicht zwingend vollständigen Untergang nahe.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Spruchform. Der parallele Gegensatz zwischen dem Umgang mit Weisen und der Gemeinschaft mit Toren bleibt erhalten; die semantische Spannweite des Schlussverbs wird in der Fußnote offengelegt.
