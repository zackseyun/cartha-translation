source:
  edition: WLC
  text: ה֭וֹן מֵ/הֶ֣בֶל יִמְעָ֑ט וְ/קֹבֵ֖ץ עַל יָ֣ד יַרְבֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/011.yaml
  text: Wealth from vanity dwindles[b][a], but whoever gathers little by little increases it.
translation:
  language: de
  text: Reichtum aus Vergänglichem schwindet; wer aber nach und nach sammelt[b], vermehrt ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Wörtlich etwa »an/bei der Hand«; die Wendung meint hier wahrscheinlich schrittweises Sammeln, also in kleinen Beträgen oder durch stetige Arbeit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: Reichtum
  rationale: Das Substantiv bezeichnet materiellen Besitz oder Vermögen. »Reichtum« ist im Deutschen natürlich, umfassend und für den sprichwörtlichen Zusammenhang passend.
- source_word: מֵהֶבֶל
  choice: aus Nichtigkeit
  rationale: הֶבֶל bezeichnet wörtlich Hauch oder Dunst und übertragen Nichtigkeit, Leere oder Vergänglichkeit. »Aus Nichtigkeit« bewahrt die ungewöhnliche Bildsprache und legt nicht einseitig fest, ob übereilter, unredlicher oder anderweitig haltloser Erwerb gemeint ist.
- source_word: יִמְעָט
  choice: schwindet
  rationale: Das Verb bedeutet »weniger/klein werden«. »Schwindet« ist eine natürliche und prägnante deutsche Wiedergabe für abnehmenden Reichtum.
- source_word: וְקֹבֵץ
  choice: wer aber … sammelt
  rationale: Das Partizip bezeichnet allgemein einen Menschen, der sammelt. Die Konstruktion mit »wer« gibt diesen generischen Sinn idiomatisch wieder; »aber« verdeutlicht den Gegensatz der beiden Vershälften.
- source_word: עַל יָד
  choice: nach und nach
  rationale: Die Wendung lautet wörtlich etwa »an/bei der Hand«, bezeichnet hier jedoch wahrscheinlich ein schrittweises Sammeln. »Nach und nach« ist im Deutschen idiomatisch, ohne die kleine Menge jedes einzelnen Zuwachses unnötig festzulegen.
- source_word: יַרְבֶּה
  choice: vermehrt ihn
  rationale: Die Hifil-Form bedeutet »vermehren, zahlreich machen«. Das Pronomen »ihn« bezieht sich eindeutig auf den zuvor genannten Reichtum.
theological_decisions: []
translation_notes:
  register: Moderne, knappe und würdige Spruchsprache. Die erste Vershälfte behält bewusst die fremdartige und mehrdeutige Metaphorik des Hebräischen bei; die zweite gibt die wahrscheinlich idiomatische Bedeutung verständlich wieder.
