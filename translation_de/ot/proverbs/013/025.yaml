review_pass:
  verdict: revise
  source_fidelity: Die erste Zeile gibt die gnomenhafte Aussage und die Sättigung (לְשֹׂבַע) zutreffend wieder. In der zweiten Zeile ist „muss“ jedoch nicht im Hebräischen angelegt; תֶּחְסָר bezeichnet, dass der Bauch der Frevler Mangel hat bzw. leidet, ohne eine modal-notwendige Aussage zu machen. Für נַפְשׁוֹ ist im Essenskontext „Verlangen/Appetit“ die natürlichere deutsche Wiedergabe; die weiter gefasste Bedeutung „Seele“ sollte als Alternative erhalten bleiben.
  naturalness: „bis seine Seele satt ist“ ist im heutigen Standarddeutsch weniger natürlich und kann unnötig körperlich-seelisch dualistisch klingen. „bis sein Verlangen gestillt ist“ ist idiomatisch und wahrt den hier kontextuell naheliegenden Sinn. „Der Bauch der Frevler leidet Mangel“ erhält die bildhafte Parallelität und ist ohne das zusätzliche „muss“ knapp und verständlich.
  terminology: „Gerechter“ und „Frevler“ passen zum würdigen, modernen Weisheitsspruchregister. „Verlangen“ gibt נֶפֶשׁ in diesem Kontext angemessen wieder; die Fußnote dokumentiert „Seele“ sowie weitere mögliche Bedeutungen, ohne eine dogmatische Festlegung vorzunehmen.
  issues:
  - severity: medium
    issue: Das Modalverb „muss“ in „muss Mangel leiden“ ist nicht quellenbasiert.
    rationale: Die hebräische Verbform תֶּחְסָר sagt Mangel/Entbehrung aus, nicht Notwendigkeit oder Zwang. Das Modalverb verändert daher die Aussage.
  - severity: low
    issue: „seine Seele satt“ ist in modernem Deutsch für den Essenskontext markiert.
    rationale: נֶפֶשׁ kann zwar „Seele“ bedeuten, meint hier aber wahrscheinlich das Verlangen bzw. den Appetit. Eine kontextnahe Hauptlesart mit einer Fußnotenalternative ist natürlicher und genauer.
  revised_text: Ein Gerechter isst, bis sein Verlangen gestillt ist[a]; doch der Bauch der Frevler leidet Mangel.
