base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/025.yaml
  text: A righteous man eats to the satisfaction of his soul[a], but the belly of the wicked lacks.
translation:
  language: de
  text: Ein Gerechter isst, bis sein Verlangen gestillt ist[a]; doch der Bauch der Frevler leidet Mangel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis seine Seele satt ist“. Das hebräische Wort נֶפֶשׁ (nefesch) kann je nach Zusammenhang „Seele“, „Leben“, „Person“ oder „Verlangen/Appetit“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: Ein Gerechter
  rationale: Das substantivierte maskuline Singularadjektiv bezeichnet exemplarisch einen gerechten Menschen; die knappe Form entspricht dem Stil der Weisheitsliteratur.
- source_word: אֹכֵל
  choice: isst
  rationale: Das Partizip beschreibt eine allgemeingültige, gewohnheitsmäßige Handlung; im Deutschen gibt das Präsens den Spruchcharakter natürlich wieder.
- source_word: לְשֹׂבַע
  choice: bis … satt ist
  rationale: Die Wendung bezeichnet das Erreichen von Sättigung oder Genüge. Diese idiomatische Formulierung bewahrt den Gedanken ausreichender Versorgung.
- source_word: נַפְשׁוֹ
  choice: seine Seele
  rationale: נֶפֶשׁ kann Seele, Leben, Person oder Appetit bezeichnen. Die Hauptübersetzung wahrt den anthropologischen Ausdruck und seine mögliche Bedeutungsweite; die kontextnahe Alternative wird in der Fußnote genannt.
- source_word: וּבֶטֶן
  choice: doch der Bauch
  rationale: בֶּטֶן bezeichnet hier den Bauch als Sitz des körperlichen Hungers. Das kontextuell gegensätzliche ו wird mit „doch“ wiedergegeben.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Der substantivierte Plural bezeichnet schuldhaft böse Menschen als Gruppe. „Frevler“ ist in deutscher Weisheitsliteratur knapp, würdig und präzise.
- source_word: תֶּחְסָר
  choice: muss Mangel leiden
  rationale: Das Verb bezeichnet Fehlen, Entbehren oder Mangelhaben. Die Formulierung macht im Deutschen natürlich deutlich, dass der Bauch unversorgt bleibt, ohne die Aussage über ihre Ursache näher auszulegen.
