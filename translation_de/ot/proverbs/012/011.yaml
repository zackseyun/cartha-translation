source:
  edition: WLC
  text: עֹבֵ֣ד אַ֭דְמָת/וֹ יִֽשְׂבַּֽע לָ֑חֶם וּ/מְרַדֵּ֖ף רֵיקִ֣ים חֲסַר לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/011.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues empty things lacks sense.
translation:
  language: de
  text: Wer seinen Acker bestellt, wird Brot genug haben; wer aber nichtigen Dingen[a] nachjagt, dem fehlt es an Verstand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nichtsnutzigen Menschen“. Der hebräische Ausdruck kann sich auf nichtige Dinge oder auf Menschen beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵד
  choice: bearbeitet
  rationale: Das Partizip von עבד bezeichnet hier die landwirtschaftliche Arbeit. „Bearbeitet“ ist im Deutschen bei Land natürlich und schließt dessen Bestellung ein.
- source_word: אַדְמָתוֹ
  choice: sein Land
  rationale: אַדָמָה kann Erdboden, Ackerboden oder Land bezeichnen. „Sein Land“ ist in diesem landwirtschaftlichen Weisheitsspruch idiomatisch und wahrt den Besitzbezug des Suffixes.
- source_word: יִשְׂבַּע לָחֶם
  choice: wird sich an Brot satt essen
  rationale: Die Wendung bedeutet wörtlich, mit Brot gesättigt zu werden. Diese Wiedergabe bewahrt das konkrete Bild und drückt ausreichende Versorgung als Ergebnis fleißiger Arbeit aus.
- source_word: וּמְרַדֵּף
  choice: wer aber … nachjagt
  rationale: Das Waw bildet im parallelen Spruch einen Gegensatz und wird daher mit „aber“ wiedergegeben. „Nachjagt“ bezeichnet natürlich und eindringlich das beharrliche Verfolgen eines unnützen Ziels.
- source_word: רֵיקִים
  choice: leeren Dingen
  rationale: רֵיקִים bedeutet wörtlich „Leere/Leere [Plural]“ und kann unpersönlich auf nichtige, gehaltlose Bestrebungen oder persönlich auf nichtsnutzige Menschen bezogen werden. Im Haupttext steht die im Kontext naheliegende sachliche Deutung; die personale Alternative bleibt in der Fußnote erhalten.
- source_word: חֲסַר לֵב
  choice: dem fehlt es an Verstand
  rationale: Die hebräische Wendung lautet wörtlich „ohne Herz“, wobei לֵב hier Einsicht und Urteilsvermögen bezeichnet. Die deutsche Formulierung gibt das Idiom klar und würdig wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Die antithetische Parallelstruktur und das konkrete Bild des Brotes bleiben erhalten; die echte Mehrdeutigkeit von רֵיקִים wird nicht aufgelöst, sondern durch die Fußnote sichtbar gemacht.
