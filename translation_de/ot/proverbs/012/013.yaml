  text: בְּ/פֶ֣שַׁע שְׂ֭פָתַיִם מוֹקֵ֣שׁ רָ֑ע וַ/יֵּצֵ֖א מִ/צָּרָ֣ה צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/013.yaml
  text: In the transgression of the lips there is a snare for an evil man[b][a], but the righteous comes out of trouble.
translation:
  language: de
  text: Durch das Vergehen der Lippen gerät der Böse in eine Falle[a][b], doch der Gerechte kommt aus der Bedrängnis heraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Lippen“ steht hier bildlich für das Reden oder die gesprochenen Worte.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Im Vergehen der Lippen liegt eine Falle für den Bösen.“ Das Hebräische ist knapp; das Vergehen der Lippen kann als das Mittel verstanden werden, durch das der Böse gefangen wird, oder als der Bereich, in dem die Falle liegt.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: Im Vergehen
  rationale: Die Präposition בְּ kann hier einen Bereich oder ein Mittel bezeichnen. „Im Vergehen“ bewahrt die knappe Bildsprache und legt die genaue Beziehung zur Falle nicht vorschnell fest.
- source_word: שְׂפָתַיִם
  choice: der Lippen
  rationale: Wörtlich steht „Lippen“; als Körperteilmetonymie bezeichnet das Wort das Reden beziehungsweise gesprochene Worte. Das Bild bleibt im Haupttext erhalten.
- source_word: מוֹקֵשׁ
  choice: eine Falle
  rationale: „Falle“ gibt das konkrete Bild von מוֹקֵשׁ im heutigen Deutsch klar und natürlich wieder.
- source_word: רָע
  choice: den Bösen
  rationale: Das substantivierte Adjektiv bezeichnet hier einen bösen Menschen. Der maskuline Singular entspricht der repräsentativen Einzelfigur des hebräischen Weisheitsspruchs.
- source_word: וַיֵּצֵא
  choice: kommt ... heraus
  rationale: Die konkrete Grundbedeutung „hinausgehen/herauskommen“ wird bewahrt, statt sie stärker deutend mit „entkommt“ wiederzugeben.
- source_word: מִצָּרָה
  choice: aus der Bedrängnis
  rationale: צָרָה bezeichnet Not, Bedrängnis oder schwere Bedrückung. „Bedrängnis“ passt zur gehobenen, aber verständlichen Sprache des Spruchs.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv bezeichnet einen gerechten Menschen und bildet den prägnanten Gegensatz zu „dem Bösen“.
theological_decisions:
- issue: Repräsentative maskuline Einzelfiguren in der Weisheitsliteratur
  choice: den Bösen … der Gerechte
  alternative: einen bösen Menschen … einen gerechten Menschen
  rationale: Der hebräische Spruch stellt zwei repräsentative Typen im maskulinen Singular gegenüber. Die gewählte Form wahrt diesen Kontrast, ohne die Aussage auf bestimmte Einzelpersonen zu beschränken.
- issue: Verhältnis zwischen sündiger Rede und Falle
  choice: Im Vergehen der Lippen liegt eine Falle für den Bösen
  alternative: Durch das Vergehen der Lippen gerät der Böse in eine Falle
  rationale: Die hebräische Formulierung ist äußerst knapp; בְּ kann Bereich oder Mittel ausdrücken. Der Haupttext wahrt diese Spannung, während die Fußnote die stärker kausale Deutung nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache von Lippen, Falle und Herauskommen bleibt erhalten; die ungewöhnliche hebräische Knappheit wird in lesbares Deutsch überführt, ohne ihre syntaktische Mehrdeutigkeit aufzulösen.
