  yaml_path: translation/ot/proverbs/012/027.yaml
  text: A lazy man does not roast his game[b][a], but diligence is a man’s precious wealth.
translation:
  language: de
  text: 'Wer träge ist, brät seine Jagdbeute nicht[a];

    doch der kostbare Besitz eines Menschen ist Fleiß.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bei weiter gefasstem Verständnis des Verbs: „Wer träge ist, fängt seine Beute nicht.“ Das Verb bedeutet gewöhnlich „ansengen, rösten“, kann hier jedoch auch im Sinn von Erlangen oder Zubereiten verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲרֹךְ
  choice: brät
  rationale: 'Das Verb bezeichnet gewöhnlich das Ansengen oder Rösten am Feuer. Zusammen mit צֵידוֹ ergibt „brät seine Jagdbeute“ ein konkretes Bild: Der Träge bringt selbst das Erlangte nicht nutzbringend zu Ende.'
- source_word: רְמִיָּה
  choice: wer träge ist
  rationale: רְמִיָּה kann Täuschung, häufiger in diesem sprichwörtlichen Gegensatz jedoch Trägheit oder Nachlässigkeit bezeichnen. Die Umschreibung gibt die substantivische Personenbezeichnung natürlich wieder, ohne dem Hebräischen ausdrücklich „Mann“ hinzuzufügen.
- source_word: צֵידוֹ
  choice: seine Jagdbeute
  rationale: צַיִד bezeichnet Jagdbeute beziehungsweise Wild. „Jagdbeute“ passt sowohl zum Rösten als auch zur alternativen, weiteren Deutung des Verbs.
- source_word: הוֹן
  choice: Reichtum
  rationale: הוֹן bezeichnet Vermögen oder Reichtum. „Reichtum“ bewahrt das starke ökonomische Bild des hebräischen Spruchs.
- source_word: אָדָם
  choice: für einen Menschen
  rationale: אָדָם bezeichnet hier den Menschen allgemein. Die Formulierung ist im modernen Deutschen natürlich und erhält den generischen Sinn.
- source_word: יָקָר
  choice: kostbarer
  rationale: יָקָר drückt hohen Wert oder Kostbarkeit aus und bestimmt in der gewählten Deutung den Reichtum näher.
- source_word: חָרוּץ
  choice: Fleiß
  rationale: חָרוּץ kann einen Fleißigen oder die Eigenschaft des Fleißes bezeichnen. Die abstrakte Wiedergabe bildet den klaren Gegensatz zu רְמִיָּה und respektiert zugleich die knappe Nominalkonstruktion.
theological_decisions:
- issue: Generischer Bezug von אָדָם im Weisheitsspruch
  choice: für einen Menschen
  alternative: eines Mannes
  rationale: Der Ausdruck ist allgemein menschlich gemeint; keine Lehrfrage hängt an einem ausdrücklich männlichen Verständnis. „Mensch“ entspricht dem Lexem und vermeidet eine unnötige Verengung.
- issue: Deutung des knappen zweiten Halbverses
  choice: Fleiß ist für einen Menschen kostbarer Reichtum
  alternative: der Besitz eines fleißigen Menschen ist kostbar
  rationale: Die hebräische Nominalfolge lässt mehrere syntaktische Zuordnungen zu. Die Hauptfassung folgt dem Kontrast zwischen Trägheit und Fleiß und versteht Fleiß selbst als wertvollen Reichtum; die alternative Zuordnung wird in der Fußnote offengelegt.
translation_notes:
  register: Moderner, würdiger Spruchstil mit klarer Zweizeiligkeit. „Wer träge ist“ klingt natürlich und macht den allgemeinen Bezug deutlich; „kostbarer Reichtum“ bewahrt die zugespitzte Bildsprache des Originals.
