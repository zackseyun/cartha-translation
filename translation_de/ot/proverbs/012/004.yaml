  text: אֵֽשֶׁת חַ֭יִל עֲטֶ֣רֶת בַּעְלָ֑/הּ וּ/כְ/רָקָ֖ב בְּ/עַצְמוֹתָ֣י/ו מְבִישָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/004.yaml
  text: A wife of noble character is her husband's crown[b][a], but one who brings shame is like rot in his bones.
translation:
  language: de
  text: Eine tüchtige Frau[a] ist die Krone ihres Mannes; doch eine Frau, die Schande bringt, ist wie Fäulnis in seinen Knochen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »eine fähige Frau«, »eine starke Frau« oder »eine hervorragende Frau«. Das hebräische Wort חַיִל umfasst Stärke, Wert, Befähigung und Vortrefflichkeit.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild von der Fäulnis in den Knochen beschreibt tiefen inneren Verfall und eine Schande, die den Menschen von innen her zersetzt.
    reason: cultural_note
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: eine tüchtige Frau
  rationale: אֵשֶׁת bezeichnet im Zusammenhang mit »ihrem Mann« eine Ehefrau. חַיִל umfasst Stärke, Tüchtigkeit, Befähigung, Wert und Vortrefflichkeit. »Tüchtige Frau« ist knapp und natürlich, ohne den Ausdruck ausschließlich auf moralischen Charakter, Besitz oder kriegerische Tapferkeit festzulegen.
- source_word: עֲטֶרֶת
  choice: Krone
  rationale: Das Bild bezeichnet eine Krone oder einen Ehrenkranz und stellt die Frau als Ehre ihres Mannes dar. »Krone« bewahrt die geläufige Metapher.
- source_word: בַּעְלָהּ
  choice: ihres Mannes
  rationale: Der Kontext macht die eheliche Bedeutung klar; der hebräische Possessivausdruck wird im Deutschen idiomatisch wiedergegeben.
- source_word: וּכְרָקָב
  choice: doch … wie Fäulnis
  rationale: Das Präfix וּ leitet hier den sprichwörtlichen Gegensatz ein und wird daher mit »doch« wiedergegeben. רָקָב bezeichnet Fäulnis oder Verfall; das konkrete Bild bleibt erhalten.
- source_word: בְּעַצְמוֹתָיו
  choice: in seinen Knochen
  rationale: Die wörtliche Wendung bewahrt das eindringliche Bild eines tief im Inneren wirkenden Verfalls.
- source_word: מְבִישָׁה
  choice: eine, die Schande bringt
  rationale: Das feminine Hifil-Partizip bezeichnet eine Frau, die Schande verursacht. Die verbale Wiedergabe erhält diesen aktiven Sinn und bezieht sich klar auf die Frau im ersten Halbvers.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Parallelismus und beide Körper- beziehungsweise Ehrenbilder des Hebräischen bleiben erhalten. »Tüchtig« ist hier im umfassenden Sinn von fähig, kraftvoll und vortrefflich gebraucht.
