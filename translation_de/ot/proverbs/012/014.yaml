  text: מִ/פְּרִ֣י פִי אִ֭ישׁ יִשְׂבַּע ט֑וֹב וּ/גְמ֥וּל יְדֵי אָ֝דָ֗ם ישוב לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/014.yaml
  text: From the fruit of a man's mouth he is satisfied with good[b][a], and the recompense of a man's hands returns to him.
translation:
  language: de
  text: Von der Frucht seines Mundes wird ein Mensch mit Gutem gesättigt,[a] und der Ertrag seiner Hände kehrt zu ihm zurück.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Von der Frucht des Mundes eines Menschen wird er mit Gutem gesättigt.“ Die Frucht des Mundes bezeichnet das, was die eigenen Worte hervorbringen.'
    reason: metaphor_clarification
  - marker: b
    text: 'Oder: „und die Vergeltung für das Tun seiner Hände kehrt zu ihm zurück.“ Das hebräische Wort kann den Ertrag oder die entsprechende Folge des eigenen Handelns bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּרִי פִי אִישׁ
  choice: Von der Frucht seines Mundes
  rationale: Bewahrt das hebräische Bild von der Frucht der Rede. „Ein Mensch“ wird im Deutschen in den Hauptsatz gestellt, wodurch der Genitiv natürlich als „seines Mundes“ erscheint.
- source_word: יִשְׂבַּע טוֹב
  choice: wird ein Mensch mit Gutem gesättigt
  rationale: שׂבע bezeichnet Sattwerden oder Erfülltwerden; das Futur formuliert hier die allgemeine Folge im Spruchstil. „Gutes“ lässt die Breite von טוֹב zwischen Wohlergehen, Nutzen und Gutem bestehen.
- source_word: וּגְמוּל יְדֵי אָדָם
  choice: und was seine Hände ihm einbringen
  rationale: גְמוּל kann die Vergeltung, den Ertrag oder das bezeichnen, was das eigene Tun hervorbringt. Die Formulierung erhält den Gedanken der entsprechenden Folge, ohne ihn auf Lohn oder auf das Werk selbst zu verengen.
- source_word: יָשׁוּב לוֹ
  choice: kehrt zu ihm zurück
  rationale: Gibt die Grundbedeutung von שׁוב wieder und bewahrt das anschauliche Motiv, dass die Folgen des eigenen Handelns zum Handelnden zurückkehren.
theological_decisions:
- issue: Generische maskuline Einzahl אִישׁ und אָדָם
  choice: ein Mensch / seine Hände / zu ihm
  alternative: ein Mann / die Hände eines Menschen
  rationale: Beide hebräischen Wörter bezeichnen hier in einem allgemein gültigen Spruch einen einzelnen Menschen stellvertretend. „Mensch“ wahrt den Singular und macht die allgemeine Geltung im heutigen Deutsch deutlich, ohne den Aussagebereich auf Männer zu beschränken.
- issue: Bedeutungsumfang von גְמוּל
  choice: was seine Hände ihm einbringen
  alternative: die Vergeltung seiner Hände / der Lohn seiner Hände / das Werk seiner Hände
  rationale: Der Ausdruck kann sowohl den Ertrag als auch die entsprechende Folge einer Tat hervorheben. Die gewählte Wiedergabe bewahrt diese Spannung und passt zum Parallelismus zwischen der Frucht des Mundes und dem Tun der Hände.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache von „Frucht“, „Händen“ und „zurückkehren“ bleibt erhalten; der zweite Halbvers ist für natürliche Verständlichkeit leicht entfaltet.
