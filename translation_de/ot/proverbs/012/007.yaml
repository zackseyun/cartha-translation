  text: הָפ֣וֹךְ רְשָׁעִ֣ים וְ/אֵינָ֑/ם וּ/בֵ֖ית צַדִּיקִ֣ים יַעֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/007.yaml
  text: The wicked are overthrown and are no more[b][a], but the house of the righteous will stand.
translation:
  language: de
  text: Die Bösen werden gestürzt und sind nicht mehr[a]; doch das Haus[b] der Gerechten wird bestehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und sie sind nicht“.'
    reason: lexical_alternative
  - marker: b
    text: „Haus“ kann hier auch den Hausstand oder die Familie der Gerechten bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפוֹךְ
  choice: werden umgestürzt
  rationale: Der Infinitivus absolutus steht hier elliptisch beziehungsweise resultativ. Die finite deutsche Passivform gibt den Sinn natürlich wieder, ohne das ungenannte handelnde Subjekt festzulegen.
- source_word: רְשָׁעִים
  choice: die Bösen
  rationale: Das substantivierte Adjektiv bezeichnet moralisch böse Menschen. „Die Bösen“ ist im Deutschen knapp, verständlich und für einen Weisheitsspruch angemessen.
- source_word: וְאֵינָם
  choice: und sind nicht mehr
  rationale: Wörtlich heißt die Wendung „und sie sind nicht“. „Sie sind nicht mehr“ gibt im Deutschen idiomatisch ihr Verschwinden beziehungsweise Ende wieder, ohne die Art ihres Untergangs näher zu bestimmen.
- source_word: וּבֵית
  choice: doch das Haus
  rationale: בַּיִת kann sowohl das Haus als auch den Hausstand oder die Familie bezeichnen. „Haus“ wahrt diese Bildbreite; „doch“ macht den im Zusammenhang klaren Gegensatz idiomatisch sichtbar.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Das substantivierte Pluraladjektiv bezeichnet Menschen, die gerecht sind. „Der Gerechten“ bewahrt die ethische Kategorie des hebräischen Weisheitstextes.
- source_word: יַעֲמֹד
  choice: wird bestehen
  rationale: Das Verb bedeutet grundsätzlich „stehen“ und bezeichnet hier im Gegensatz zum Umsturz dauerhaftes Fortbestehen. „Wird bestehen“ ist natürliches Deutsch und bewahrt diesen Stabilitätsgedanken.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger und knapper Spruchstil. Die parallele Gegenüberstellung von Untergang und Bestand bleibt erhalten; die Mehrdeutigkeit von „Haus“ wird nicht im Haupttext aufgelöst.
