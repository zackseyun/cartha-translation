  text: The words of the wicked are an ambush for blood[b][a], but the mouth of the upright delivers them.
translation:
  language: de
  text: Die Worte der Frevler lauern auf Blut[a]; doch der Mund der Aufrichtigen rettet sie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „sind ein Lauern auf Blut“; auch möglich: „sind ein Hinterhalt auf Blut“. „Blut“ kann für tödliche Gewalt oder Blutvergießen stehen.'
    reason: lexical_alternative
  - marker: b
    text: „Sie“ hat im Hebräischen keinen ausdrücklich genannten Bezug. Es kann allgemein die von solcher Gewalt Bedrohten meinen; manche verstehen die Aussage als auf die Aufrichtigen selbst bezogen.
    reason: referential_ambiguity
lexical_decisions:
- source_word: דִּבְרֵי רְשָׁעִים
  choice: Die Worte der Frevler
  rationale: Die Konstruktverbindung bezeichnet die Äußerungen moralisch böser Menschen. „Frevler“ bildet den knappen ethischen Gegensatz zu den „Aufrichtigen“ würdig und idiomatisch ab.
- source_word: אֱרָב דָּם
  choice: sind ein Hinterhalt, um Blut zu vergießen
  rationale: „Hinterhalt“ bewahrt das Bild des Auflauerns. Die finale Wendung macht das knappe hebräische „Blut“ im Deutschen als Ziel tödlicher Gewalt verständlich, ohne die Metapher aufzugeben.
- source_word: וּפִי
  choice: doch der Mund
  rationale: „Mund“ erhält das hebräische Körperbild und den poetischen Parallelismus mit „Worte“; „doch“ kennzeichnet den deutlichen Gegensatz.
- source_word: יְשָׁרִים
  choice: der Aufrichtigen
  rationale: Das substantivierte Adjektiv bezeichnet moralisch geradlinige Menschen; „Aufrichtige“ ist im Kontext der Weisheitsliteratur natürlich und präzise.
- source_word: יַצִּילֵם
  choice: rettet sie
  rationale: Der Hifil von נצל bedeutet „retten, entreißen“. Das maskuline Pluralsuffix wird ausdrücklich wiedergegeben, während sein genauer Bezug offenbleibt.
theological_decisions:
- issue: Bezug des Objektsuffixes in יַצִּילֵם
  choice: „rettet sie“ mit unbestimmtem Bezug
  alternative: „rettet sie selbst“ beziehungsweise objektlos „bringt Rettung“
  rationale: Die Morphologie enthält ein Objekt im maskulinen Plural, nennt dessen Bezug aber nicht ausdrücklich. Die Übersetzung bewahrt diese Spannung, statt eine reflexive Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Spruchform. Die Bilder „Hinterhalt“ und „Mund“ bleiben erhalten; die schwer verständliche Verbindung mit „Blut“ wird behutsam idiomatisiert. Sämtliche Fußnotenmarker stehen im Haupttext.
