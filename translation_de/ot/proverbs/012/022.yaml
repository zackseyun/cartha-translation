source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה שִׂפְתֵי שָׁ֑קֶר וְ/עֹשֵׂ֖י אֱמוּנָ֣ה רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/022.yaml
  text: Lying lips are an abomination to Yahweh[a], but those who act faithfully are his delight.
translation:
  language: de
  text: Lügnerische Lippen sind Jahwe ein Gräuel, doch an Menschen, die treu handeln[a], hat er Gefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die zuverlässig handeln“, „die wahrhaftig handeln“ oder „die sich als treu erweisen“.'
    reason: אֱמוּנָה umfasst hier Treue, Zuverlässigkeit, Wahrhaftigkeit und Vertrauenswürdigkeit; die Verbindung mit עֹשֵׂי lässt mehrere natürliche deutsche Wiedergaben zu.
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: ein Gräuel
  rationale: Das Substantiv bezeichnet etwas moralisch oder religiös Abscheuliches. „Ein Gräuel“ bewahrt die starke Wertung und ist im Deutschen als biblisch geprägter, weiterhin verständlicher Ausdruck geläufig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: lügnerische Lippen
  rationale: Die Wendung bedeutet wörtlich „Lippen der Lüge/Falschheit“. „Lügnerische Lippen“ erhält das Körperbild und klingt zugleich natürlich.
- source_word: וְעֹשֵׂי
  choice: doch an Menschen, die … handeln
  rationale: Das substantivierte Partizip bezeichnet Menschen, die etwas tun. Das adversative „doch“ macht den im Parallelismus angelegten Gegensatz im Deutschen deutlich.
- source_word: אֱמוּנָה
  choice: treu
  rationale: Das Wort kann Treue, Verlässlichkeit, Wahrhaftigkeit oder Zuverlässigkeit bezeichnen. In Verbindung mit „tun/handeln“ gibt „treu handeln“ die ethische Haltung knapp wieder, ohne die Bedeutungsbreite vollständig auf eine einzige Nuance festzulegen.
- source_word: רְצוֹנוֹ
  choice: an … hat er Gefallen
  rationale: רָצוֹן kann Wohlgefallen, Gunst oder Freude bezeichnen. Die verbale deutsche Wendung ist idiomatisch und bildet einen klaren Gegenpol zu „sind … ein Gräuel“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Transliteration „Jahwe“ bewahrt den Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem sprichwörtlichem Rhythmus. Das Bild der Lippen und die scharfe moralische Gegenüberstellung des hebräischen Parallelismus bleiben erhalten.
