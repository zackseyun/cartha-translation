  text: אֱוִ֗יל בַּ֭/יּוֹם יִוָּדַ֣ע כַּעְס֑/וֹ וְ/כֹסֶ֖ה קָל֣וֹן עָרֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/016.yaml
  text: A fool’s anger is known at once[b][a], but a prudent man covers shame.
translation:
  language: de
  text: Der Ärger eines Narren wird sofort offenbar[a], aber ein Kluger verbirgt die Schande[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird noch am selben Tag offenbar«; wörtlich: »am Tag«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »hält eine Beleidigung / Entehrung verborgen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִיל
  choice: ein Narr
  rationale: Bezeichnet in der Weisheitsliteratur einen moralisch und praktisch törichten Menschen, nicht bloß jemanden mit geringer Intelligenz.
- source_word: בַּיּוֹם
  choice: sofort
  rationale: Wörtlich »am Tag«; im sprichwörtlichen Zusammenhang drückt die Wendung wahrscheinlich aus, dass der Ärger unverzüglich sichtbar wird. Die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: יִוָּדַע
  choice: wird bekannt
  rationale: Das Nifal von ידע bezeichnet hier ein Bekannt- oder Erkennbarwerden und bewahrt in dieser Wiedergabe die passive Ausdrucksweise.
- source_word: כַּעְסוֹ
  choice: sein Ärger
  rationale: כעס kann Ärger, Verdruss oder Zorn bezeichnen. »Ärger« ist breit genug und passt zum Gegensatz zwischen offenbarer Erregung und kluger Zurückhaltung.
- source_word: וְכֹסֶה
  choice: aber ... verbirgt
  rationale: כסה bedeutet »bedecken, verbergen«. »Verbirgt« ist im modernen Deutschen natürlich; das ו wird wegen des inhaltlichen Gegensatzes mit »aber« wiedergegeben.
- source_word: קָלוֹן
  choice: die Schmach
  rationale: Das Wort kann Schmach, Schande, Entehrung oder einen beschämenden Affront bezeichnen. »Schmach« wahrt diese Spannung, ohne vorschnell nur die Beleidigung oder nur die eigene Schande festzulegen.
- source_word: עָרוּם
  choice: ein Kluger
  rationale: Das Adjektiv bezeichnet in den Sprüchen meist positive Umsicht oder Klugheit. Die substantivierte maskuline Einzahl entspricht der repräsentativen Form des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdiges Sprichwortdeutsch. Die parallele Gegenüberstellung bleibt erhalten; die Mehrdeutigkeit von קָלוֹן wird im Haupttext und in der Fußnote nicht unnötig eingeengt.
