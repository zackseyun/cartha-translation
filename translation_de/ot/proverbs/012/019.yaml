source:
  edition: WLC
  text: שְֽׂפַת אֱ֭מֶת תִּכּ֣וֹן לָ/עַ֑ד וְ/עַד אַ֝רְגִּ֗יעָה לְשׁ֣וֹן שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/019.yaml
  text: A truthful lip is established forever[b][a], but a lying tongue lasts only a moment.
translation:
  language: de
  text: Wahrhaftige Lippen haben für immer Bestand,[a] aber eine verlogene Zunge nur für einen Augenblick.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Eine Lippe der Wahrheit steht für immer fest.«'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck ist schwierig; im Zusammenhang bezeichnet er wahrscheinlich eine sehr kurze Zeit und steht im Gegensatz zur dauerhaften Wahrheit.
    reason: textual_difficulty
lexical_decisions:
- source_word: שְׂפַת אֱמֶת
  choice: wahrhaftige Lippen
  rationale: Die hebräische Einzahl bedeutet wörtlich »Lippe der Wahrheit« und steht sinnbildlich für wahrhaftiges Reden. Im Deutschen ist der Plural »Lippen« in dieser sprichwörtlichen Aussage natürlicher, ohne das konkrete Bild aufzugeben.
- source_word: תִּכּוֹן
  choice: haben Bestand
  rationale: Das Nifal von כון bezeichnet Feststehen, Gefestigtsein oder dauerhaften Bestand. Die präsentische Formulierung gibt den allgemeingültigen Charakter des Spruchs natürlich wieder.
- source_word: לָעַד
  choice: für immer
  rationale: Die Wendung bezeichnet dauerhafte Beständigkeit und bildet den Gegenpol zum kurzen Augenblick der zweiten Zeile.
- source_word: וְעַד
  choice: aber ... nur
  rationale: Das formal mit »und/bis« verbundene zweite Glied steht im antithetischen Parallelismus. Die deutsche Wiedergabe macht diesen Gegensatz deutlich.
- source_word: אַרְגִּיעָה
  choice: für einen Augenblick
  rationale: 'Die schwierige Form wird im Kontext am plausibelsten temporal verstanden: Die Lüge besteht nur ganz kurz. Die knappe deutsche Wendung bewahrt den Gegensatz zu »für immer«.'
- source_word: לְשׁוֹן שָׁקֶר
  choice: eine verlogene Zunge
  rationale: »Zunge« erhält das konkrete hebräische Bild für das Reden; »verlogen« gibt den Genitiv »der Falschheit/Lüge« idiomatisch als Eigenschaft wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrten Körpermetaphern. Der sprichwörtliche Parallelismus wird durch »für immer ... nur für einen Augenblick« klar und knapp wiedergegeben.
