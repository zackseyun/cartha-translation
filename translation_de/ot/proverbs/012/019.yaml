  source_fidelity: 'Die Übersetzung gibt den antithetischen Parallelismus und die zentrale Gegenüberstellung korrekt wieder: אמת bzw. wahrhaftiges Reden hat dauerhaften Bestand, während die לשון שקר nur äußerst kurz besteht. Die Ergänzung von „haben“ im ersten und das elliptisch mitverstandene Verb im zweiten Glied sind im Deutschen idiomatisch. Der Wechsel von der hebräischen Einzahl „Lippe“ zu „Lippen“ ist eine natürliche deutsche Generalisierung und verändert den Sinn nicht.'
  naturalness: „Wahrhaftige Lippen haben für immer Bestand, aber eine verlogene Zunge nur für einen Augenblick“ ist knapp, verständlich und in modernem würdigem Standarddeutsch sprichwörtlich formuliert. Die bewusste Ellipse im zweiten Satzglied trägt den poetischen Parallelismus gut.
