  text: אָדָ֣ם עָ֭רוּם כֹּ֣סֶה דָּ֑עַת וְ/לֵ֥ב כְּ֝סִילִ֗ים יִקְרָ֥א אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/023.yaml
  text: A prudent man conceals knowledge[b][a], but the heart of fools proclaims folly.
translation:
  language: de
  text: Ein kluger Mensch hält sein Wissen zurück,[a] doch das Herz der Toren verkündet Torheit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bedeckt sein Wissen“. Das hebräische Wort kann auch „schlau“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Doch das Herz der Toren ruft Torheit aus.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: Mensch
  rationale: Das singularische אָדָם bezeichnet hier einen einzelnen Menschen als typische Gestalt der Weisheitslehre. „Mensch“ ist im heutigen Deutsch natürlich und geschlechtsübergreifend, ohne den individuellen Bezug aufzulösen.
- source_word: עָרוּם
  choice: klug
  rationale: Im Sprüchebuch bezeichnet עָרוּם häufig positiv einen besonnenen, umsichtig handelnden Menschen. „Klug“ gibt diesen Sinn im Kontrast zu den Toren verständlich wieder; die mögliche Nuance „schlau“ bleibt in der Fußnote sichtbar.
- source_word: כֹּסֶה
  choice: hält … zurück
  rationale: Das Partizip bedeutet wörtlich „bedeckt/verhüllt“. Im Zusammenhang beschreibt es, dass ein kluger Mensch sein Wissen nicht unbedacht zur Schau stellt. „Hält sein Wissen zurück“ drückt diese kontrollierte Zurückhaltung natürlich aus, ohne ein dauerhaftes Verheimlichen zu behaupten.
- source_word: דָּעַת
  choice: Wissen
  rationale: „Wissen“ ist die direkte und im Deutschen natürliche Entsprechung des zentralen Weisheitsbegriffs דָּעַת.
- source_word: לֵב
  choice: Herz
  rationale: „Herz“ bewahrt das hebräische Bild für das innere Denk- und Willenszentrum und erhält die markante Personifikation des zweiten Halbverses.
- source_word: כְּסִילִים
  choice: Toren
  rationale: „Toren“ ist ein etablierter, würdevoller Begriff für die moralisch und geistlich uneinsichtigen Menschen im Sprüchebuch und passt zur gehobenen, aber verständlichen Sprache einer Bibelübersetzung.
- source_word: יִקְרָא
  choice: ruft … aus
  rationale: יִקְרָא bedeutet grundsätzlich „ruft“. „Ruft … aus“ bewahrt das Sprachbild und vermittelt zugleich das öffentliche Bekanntmachen.
- source_word: אִוֶּלֶת
  choice: Torheit
  rationale: „Torheit“ entspricht dem zentralen Weisheitsbegriff אִוֶּלֶת und bildet im Deutschen einen treffenden Wortklang mit „Toren“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus bleibt erhalten. „Hält … zurück“ vermeidet den möglichen negativen Beiklang von „verheimlicht“, während die Fußnote die konkrete hebräische Bildsprache dokumentiert. Alle Fußnotenmarker stehen an den jeweils einschlägigen Textstellen.
