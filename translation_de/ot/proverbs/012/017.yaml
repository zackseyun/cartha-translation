  register: Modernes, würdiges Standarddeutsch. Die erste Vershälfte ist flüssig formuliert; in der zweiten bleibt die markante verblose Ellipse des Hebräischen erhalten. Das Semikolon verdeutlicht den antithetischen Parallelismus.
