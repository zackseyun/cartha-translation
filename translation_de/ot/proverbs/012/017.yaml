id: PRO.12.17
reference: Proverbs 12:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יָפִ֣יחַ אֱ֭מוּנָה יַגִּ֣יד צֶ֑דֶק וְ/עֵ֖ד שְׁקָרִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/017.yaml
  text: He who breathes out truth declares righteousness[a], but a false witness[b], deceit.
translation:
  language: de
  text: Wer Wahrheit[a] ausspricht, verkündet, was recht ist[b]; ein falscher Zeuge aber Täuschung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Treue“ beziehungsweise „Zuverlässigkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gerechtigkeit“ beziehungsweise „Recht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפִיחַ
  choice: ausspricht
  rationale: Der Hifil von נפח bezeichnet wörtlich ein Aus- oder Hervorhauchen und idiomatisch das Äußern von Worten. „Ausspricht“ gibt den Redeakt natürlich wieder, ohne im Deutschen eine befremdliche oder negativ klingende Metapher zu erzwingen.
- source_word: אֱמוּנָה
  choice: Wahrheit
  rationale: Im Gegensatz zum falschen Zeugen bezeichnet אֱמוּנָה hier verlässliche, wahrheitsgemäße Rede. „Wahrheit“ bringt den forensischen Kontrast knapp zum Ausdruck; „Treue“ beziehungsweise „Zuverlässigkeit“ bleibt als echte Bedeutungsalternative in der Fußnote erhalten.
- source_word: יַגִּיד
  choice: verkündet
  rationale: Der Hifil von נגד bedeutet „bekannt machen“, „mitteilen“ oder „verkünden“. „Verkündet“ wahrt den bestimmten, öffentlichen Charakter der Aussage.
- source_word: צֶדֶק
  choice: was recht ist
  rationale: צֶדֶק umfasst in diesem rechtlich-ethischen Zusammenhang sowohl Richtigkeit und Gerechtigkeit als auch gerechtes Handeln. „Was recht ist“ ist modernes, verständliches Deutsch und vermeidet eine unnötige Verengung.
- source_word: עֵד שְׁקָרִים
  choice: ein falscher Zeuge
  rationale: Die hebräische Verbindung lautet wörtlich „ein Zeuge von Lügen“ und bezeichnet idiomatisch einen Zeugen, dessen Aussage falsch ist. „Ein falscher Zeuge“ ist die übliche und präzise deutsche Wiedergabe.
- source_word: מִרְמָה
  choice: Täuschung
  rationale: Das Schlusswort steht ohne ausdrückliches Verb und bildet eine knappe Ellipse. „Täuschung“ bewahrt diese zugespitzte Form und bezeichnet irreführende, betrügerische Rede.
theological_decisions: []
