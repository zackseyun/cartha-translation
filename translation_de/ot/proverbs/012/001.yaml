id: PRO.12.1
reference: Proverbs 12:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֹהֵ֣ב מ֭וּסָר אֹ֣הֵֽב דָּ֑עַת וְ/שֹׂנֵ֖א תוֹכַ֣חַת בָּֽעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/001.yaml
  text: Whoever loves discipline loves knowledge[a], but he who hates reproof is stupid.
translation:
  language: de
  text: Wer Unterweisung liebt, liebt Erkenntnis; wer aber Zurechtweisung hasst, ist dumm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stumpfsinnig“ oder „brutisch“. Das hebräische Wort kann einen stumpfen, unverständigen oder tierähnlichen Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: Wer … liebt
  rationale: Das Partizip wird allgemein und sprichwörtlich gebraucht. „Wer … liebt“ gibt diese generische Aussage im modernen Deutschen natürlich wieder.
- source_word: מוּסָר
  choice: Zucht
  rationale: Das Wort bezeichnet im Buch der Sprüche formende Unterweisung, Erziehung und korrigierende Disziplin. „Zucht“ bewahrt diese Verbindung in knapper, würdevoller Spruchsprache, ohne bloße Bestrafung auszudrücken.
- source_word: דָּעַת
  choice: Erkenntnis
  rationale: „Erkenntnis“ ist eine geläufige Wiedergabe für das im Weisheitskontext erworbene und lebensprägende Wissen.
- source_word: וְשֹׂנֵא
  choice: wer aber … hasst
  rationale: Das Waw verbindet hier die gegensätzlichen Hälften des antithetischen Spruchs; „aber“ macht diesen Kontrast im Deutschen deutlich.
- source_word: תוֹכַחַת
  choice: Zurechtweisung
  rationale: Das Substantiv bezeichnet tadelnde oder korrigierende Ansprache. „Zurechtweisung“ ist verständlich und lässt den korrektiven Sinn klar hervortreten.
- source_word: בָּעַר
  choice: unvernünftig
  rationale: Das Adjektiv charakterisiert einen Menschen als stumpf, unverständig oder tiergleich. „Unvernünftig“ ist im Deutschen natürlich und bewahrt die scharfe negative Wertung, während die stärkeren Bildnuancen in der Fußnote erscheinen.
theological_decisions: []
translation_notes:
  register: Knappe, antithetische Spruchform in modernem Standarddeutsch. Die parallele Wiederholung von „liebt“ bleibt erhalten. „Zucht“ ist bewusst im Sinn formender, korrigierender Erziehung gebraucht; „Zurechtweisung“ verdeutlicht den stärker verbalen Charakter des zweiten Begriffs.
