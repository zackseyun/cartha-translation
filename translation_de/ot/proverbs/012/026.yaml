id: PRO.12.26
reference: Proverbs 12:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יָתֵ֣ר מֵ/רֵעֵ֣/הוּ צַדִּ֑יק וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תַּתְעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/026.yaml
  text: The righteous person is a guide to his neighbor[b][a], but the way of the wicked leads them astray.
translation:
  language: de
  text: Der Gerechte gibt seinem Nächsten[a] Orientierung[b], doch der Weg der Frevler führt sie in die Irre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinem Freund« beziehungsweise »seinem Gefährten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Ausdruck ist schwer zu deuten. Möglich ist auch: »Der Gerechte ist seinem Nächsten überlegen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: יָתֵר
  choice: gibt … Orientierung
  rationale: 'Die Bedeutung der Form ist an dieser Stelle umstritten. Im antithetischen Parallelismus zu »führt … in die Irre« liegt eine aktive Aussage nahe: Der Gerechte hilft seinem Mitmenschen, den richtigen Weg zu erkennen. Die Übersetzung gibt diese richtungsweisende Funktion natürlich wieder, ohne die schwierige Form als eindeutig auszugeben.'
- source_word: מֵרֵעֵהוּ
  choice: seinem Nächsten
  rationale: רֵעַ kann einen Nächsten, Freund oder Gefährten bezeichnen. »Nächster« wahrt den breiten sozialen Bezug; die Präposition מ wird im Zusammenhang mit der schwierigen Verbkonstruktion nicht gesondert wiedergegeben.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv bezeichnet in der Weisheitsliteratur typologisch einen Menschen, der recht handelt. »Der Gerechte« ist im Deutschen prägnant und traditionsnah.
- source_word: וְדֶרֶךְ
  choice: doch der Weg
  rationale: Das einfache ו wird wegen des antithetischen Parallelismus adversativ mit »doch« wiedergegeben.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: »Frevler« bezeichnet im weisheitlichen Kontext Menschen, die sich schuldhaft und gottwidrig verhalten, und bildet einen klaren Gegenpol zum Gerechten.
- source_word: תַּתְעֵם
  choice: führt sie in die Irre
  rationale: Die Hifil-Form von תעה mit Pluralsuffix drückt ein Verursachen des Irrgehens aus. Die deutsche Wendung bewahrt sowohl das Bild des Weges als auch den kausativen Sinn.
theological_decisions:
- issue: Bezug und Wirkung des Gerechten im ersten Halbvers
  choice: Der Gerechte gibt seinem Nächsten Orientierung
  alternative: Der Gerechte ist seinem Nächsten überlegen
  rationale: 'Der schwierige hebräische Ausdruck erlaubt keine sichere Festlegung. Die Hauptübersetzung folgt dem wahrscheinlichen Kontrast: Der Gerechte orientiert, während der Weg der Frevler fehlleitet. Die traditionelle komparative Deutung wird in einer Fußnote bewahrt, damit die genuine Mehrdeutigkeit nicht verdeckt wird.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem weisheitlichem Ton. »Orientierung geben« ist idiomatisch und nimmt den Gegensatz zur Irreführung auf. Die textlich-lexikalische Unsicherheit des ersten Halbverses wird ausdrücklich in der Fußnote offengehalten.
