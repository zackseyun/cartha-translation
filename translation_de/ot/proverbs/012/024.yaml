  naturalness: „Die nachlässige“ ist nicht idiomatisch; als substantiviertes Adjektiv müsste es zumindest großgeschrieben werden, bliebe jedoch ohne erkennbares Bezugsnomen unerquicklich. Die personale Umschreibung „wer nachlässig ist“ ist modernes, klares Standarddeutsch und gibt die spruchhafte Konsequenz natürlich wieder.
  terminology: „Fleißige“, „herrschen“ und „Zwangsarbeit“ sind angemessen. Die kulturgeschichtliche Erläuterung zu מַס ist sachlich; „Frondienst“ kann als erklärende historische Bezeichnung stehen bleiben.
