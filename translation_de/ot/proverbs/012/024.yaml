source:
  edition: WLC
  text: יַד חָרוּצִ֥ים תִּמְשׁ֑וֹל ו֝/רְמִיָּ֗ה תִּהְיֶ֥ה לָ/מַֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/024.yaml
  text: The hand of the diligent will rule[b][a], but the slack will be put to forced labor.
translation:
  language: de
  text: Die Hand der Fleißigen wird herrschen, wer nachlässig ist[a], wird aber zu Zwangsarbeit[b] herangezogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Nachlässigkeit“. Das hebräische Wort kann Nachlässigkeit oder Trägheit bezeichnen; die personale Formulierung gibt die im Spruch gemeinte Folge für nachlässige Menschen wieder.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet einen verpflichtenden Arbeitsdienst, auch Frondienst genannt.
    reason: cultural_note
lexical_decisions:
- source_word: יַד
  choice: Hand
  rationale: Das konkrete Bild der Hand bleibt erhalten; zugleich steht die Hand als Metonymie für das Handeln und die Arbeitskraft eines Menschen.
- source_word: חָרוּצִים
  choice: der Fleißigen
  rationale: Die substantivische Wiedergabe bezeichnet Menschen, die sich durch Fleiß und Tatkraft auszeichnen, und bildet den beabsichtigten Gegensatz zu רְמִיָּה.
- source_word: תִּמְשׁוֹל
  choice: wird herrschen
  rationale: Das Verb משׁל bezeichnet Herrschen oder Regieren. „Wird herrschen“ gibt die verheißene Stellung von Einfluss und Autorität knapp wieder.
- source_word: רְמִיָּה
  choice: die nachlässige
  rationale: Das feminine Wort kann hier als elliptische Bezeichnung einer „nachlässigen Hand“ verstanden werden; dadurch bleibt die Parallelität zur ersten Vershälfte sichtbar. Die ebenfalls mögliche abstrakte Deutung „Nachlässigkeit“ wird in einer Fußnote genannt.
- source_word: תִּהְיֶה לָמַס
  choice: muss Zwangsarbeit leisten
  rationale: Die Konstruktion bezeichnet das Geraten unter verpflichtenden Arbeitsdienst. Die deutsche Formulierung ist natürlich und bringt die Unterordnung als Folge der Nachlässigkeit zum Ausdruck.
- source_word: מַס
  choice: Zwangsarbeit
  rationale: מַס bezeichnet hier einen auferlegten Arbeitsdienst beziehungsweise Frondienst, nicht lediglich eine Geldabgabe.
theological_decisions: []
translation_notes:
  register: Moderne, knappe Spruchsprache mit dem konkreten Bild der „Hand“. „Herrschen“ bewahrt die direkte Aussage des hebräischen Verbs; „Zwangsarbeit leisten“ ist allgemein verständlicher als das fachsprachliche „Frondienst leisten“.
