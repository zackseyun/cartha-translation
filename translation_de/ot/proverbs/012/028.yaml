  text: בְּ/אֹֽרַח צְדָקָ֥ה חַיִּ֑ים וְ/דֶ֖רֶךְ נְתִיבָ֣ה אַל מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/028.yaml
  text: In the path of righteousness is life[a], and in its pathway there is no death.
translation:
  language: de
  text: Auf dem Pfad der Gerechtigkeit ist Leben[a], und auf ihrem Weg gibt es keinen Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ihr Pfad ist Unsterblichkeit“. So kann die schwierige zweite Vershälfte des Hebräischen auch verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹרַח
  choice: Auf dem Pfad
  rationale: אֹרַח bezeichnet einen Pfad, Weg oder Lebenslauf. Die Präposition ב wird im Deutschen bei der Wegmetapher natürlich mit „auf“ wiedergegeben.
- source_word: צְדָקָה
  choice: der Gerechtigkeit
  rationale: צְדָקָה umfasst Gerechtigkeit und rechtschaffenes Handeln. „Gerechtigkeit“ bewahrt in diesem Weisheitskontext die ethische Weite des Begriffs.
- source_word: חַיִּים
  choice: Leben
  rationale: Die morphologische Pluralform חַיִּים bezeichnet idiomatisch das Leben; der deutsche Singular ist sachgemäß und natürlich.
- source_word: וְדֶרֶךְ נְתִיבָה
  choice: und auf ihrem Weg
  rationale: Die komprimierte Verbindung der beiden Wegbegriffe דֶרֶךְ und נְתִיבָה wird als Rückbezug auf den Pfad der Gerechtigkeit verstanden. „Weg“ erhält den poetischen Parallelismus, ohne im Deutschen schwerfällig zwei nahezu synonyme Substantive zu häufen.
- source_word: אַל־מָוֶת
  choice: gibt es keinen Tod
  rationale: אַל wird hier als Verneinung verstanden. Die Formulierung bewahrt den deutlichen Gegensatz zwischen Leben und Tod und gibt die wahrscheinlichste kontextuelle Deutung wieder.
theological_decisions:
- issue: Deutung der schwierigen zweiten Vershälfte וְדֶרֶךְ נְתִיבָה אַל־מָוֶת
  choice: „und auf ihrem Weg gibt es keinen Tod“
  alternative: „und ihr gebahnter Weg ist Unsterblichkeit“
  rationale: Der masoretische Wortlaut ist knapp und syntaktisch schwierig. Der Haupttext versteht אַל als Negation und die Wegangabe als Rückbezug auf die Gerechtigkeit; dadurch bleibt der Gegensatz von Leben und Tod erhalten. Die alternative Deutung als Aussage über Unsterblichkeit wird wegen der echten textlichen und interpretatorischen Unsicherheit in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Wegmetapher bleibt erhalten; die schwierige hebräische Syntax wird lesbar wiedergegeben, ohne ihre alternative Deutung zu verschweigen.
