  text: יוֹדֵ֣עַ צַ֭דִּיק נֶ֣פֶשׁ בְּהֶמְתּ֑/וֹ וְֽ/רַחֲמֵ֥י רְ֝שָׁעִ֗ים אַכְזָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/010.yaml
  text: A righteous man knows the life of his animal[a], but the compassion of the wicked is cruel.
translation:
  language: de
  text: Ein Gerechter kümmert sich um das Wohlergehen seines Tieres, aber das Erbarmen der Gottlosen ist grausam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹדֵעַ
  choice: kennt
  rationale: Das Partizip von ידע bezeichnet Wissen und Verstehen. „Kennt“ bewahrt den lexikalischen Kern; der Zusammenhang lässt zugleich auf aufmerksame Fürsorge schließen.
- source_word: צַדִּיק
  choice: ein Gerechter
  rationale: Das maskuline Singularsubstantiv bezeichnet einen gerechten Menschen. „Ein Gerechter“ erhält die grammatische Form und klingt in einem Weisheitsspruch würdig und natürlich.
- source_word: נֶפֶשׁ
  choice: das Leben
  rationale: נֶפֶשׁ kann Leben, Selbst, Seele oder Lebenskraft bezeichnen. Beim Tier gibt „Leben“ die konkrete lebendige Existenz wieder, ohne vorschnell auf „Bedürfnisse“ einzuengen oder missverständliche Vorstellungen von „Seele“ aufzurufen.
- source_word: בְּהֶמְתּוֹ
  choice: seines Tieres
  rationale: בְּהֵמָה bezeichnet ein Tier, häufig ein Haus- oder Nutztier. „Seines Tieres“ bleibt hinreichend weit und entspricht dem Singular mit Possessivsuffix.
- source_word: רַחֲמֵי
  choice: das Erbarmen
  rationale: Der Plural constructus von רַחֲמִים bezeichnet Mitleid, Erbarmen oder entsprechende Regungen und Taten. Der deutsche Kollektivsingular „das Erbarmen“ ist idiomatisch und bewahrt den ethischen Gegensatz.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: „Die Gottlosen“ ist eine etablierte, prägnante Wiedergabe der moralisch schuldigen beziehungsweise bösen Menschen in der Weisheitsliteratur.
- source_word: אַכְזָרִי
  choice: grausam
  rationale: Das Adjektiv bedeutet grausam, erbarmungslos oder unbarmherzig. „Grausam“ gibt die scharfe Pointe des Gegensatzes direkt wieder.
theological_decisions:
- issue: Maskuliner Singular als sprichwörtliches Subjekt
  choice: ein Gerechter
  alternative: ein gerechter Mensch; die Gerechten
  rationale: Der hebräische Text steht im maskulinen Singular und formuliert einen allgemeinen Weisheitssatz. Die Übersetzung erhält diese Form, ohne die allgemeine Geltung des Spruchs einzuschränken.
- issue: Paradoxe Aussage über das Erbarmen der Gottlosen
  choice: aber das Erbarmen der Gottlosen ist grausam
  alternative: selbst das Mitleid der Bösen ist erbarmungslos
  rationale: 'Die pointierte Spannung des Hebräischen wird nicht erklärend aufgelöst: Was bei den Gottlosen als Erbarmen erscheint oder gelten mag, ist tatsächlich grausam.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Parallelstruktur. „Ein Gerechter“ und „die Gottlosen“ bewahren den weisheitlichen Registerton; die Fußnote erläutert die ungewöhnliche, bewusst quellennähere Formulierung „das Leben seines Tieres“.
