source:
  edition: WLC
  text: מִ֭רְמָה בְּ/לֶב חֹ֣רְשֵׁי רָ֑ע וּֽ/לְ/יֹעֲצֵ֖י שָׁל֣וֹם שִׂמְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/020.yaml
  text: Deceit is in the heart of those who devise evil[b][a], but joy belongs to those who counsel peace.
translation:
  language: de
  text: Im Herzen derer, die Böses planen, ist Betrug; doch Freude haben alle, die zum Frieden raten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Frieden“ kann hier auch Wohlergehen oder umfassende Unversehrtheit einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִרְמָה
  choice: Betrug
  rationale: Das Substantiv bezeichnet Täuschung oder betrügerische Absicht. „Betrug“ ist knapp, verständlich und bezeichnet hier die innere moralische Haltung.
- source_word: בְּלֶב
  choice: im Herzen
  rationale: „Herz“ bezeichnet im Hebräischen das innere Denken und Wollen; die traditionelle Körpermetapher ist auch im modernen Deutschen verständlich.
- source_word: חֹרְשֵׁי רָע
  choice: die Böses planen
  rationale: Das Partizip von חרשׁ meint in diesem Zusammenhang das planende Ausdenken von Schädlichem, nicht bloß das Tun des Bösen.
- source_word: וּלְיֹעֲצֵי שָׁלוֹם
  choice: doch ... alle, die zum Frieden raten
  rationale: Das לְ kennzeichnet die kontrastierte Personengruppe; יעץ bezeichnet Ratgeben. „Zum Frieden raten“ klingt im Deutschen natürlich und bewahrt den verbalen Sinn.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ ist die naheliegende Wiedergabe, wobei das hebräische Wort auch Wohlergehen und Unversehrtheit einschließen kann.
- source_word: שִׂמְחָה
  choice: Freude haben
  rationale: Der verblosen hebräischen Aussage wird im Deutschen eine Kopula beziehungsweise Besitzkonstruktion beigegeben. „Freude haben“ gibt לְ ... שִׂמְחָה idiomatisch wieder, ohne eine kausale Aussage einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Gegenüberstellung von bösem Planen und friedlichem Raten sowie von Betrug und Freude bleibt erhalten.
