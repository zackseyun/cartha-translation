id: PRO.12.12
reference: Proverbs 12:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חָמַ֣ד רָ֭שָׁע מְצ֣וֹד רָעִ֑ים וְ/שֹׁ֖רֶשׁ צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/012.yaml
  text: A wicked man desires the prey of evil men[b][a], but the root of the righteous yields fruit.
translation:
  language: de
  text: Ein Frevler begehrt die Beute der Bösen[a], doch die Wurzel der Gerechten trägt Frucht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Frevler begehrt das Netz der Bösen.“ Das seltene hebräische Wort מְצוֹד kann ein Netz oder eine Falle, aber auch den Fang beziehungsweise die Beute bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Die Wurzel der Gerechten gibt.“ „Trägt Frucht“ verdeutlicht den wahrscheinlich gemeinten botanischen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמַד
  choice: begehrt
  rationale: Das Verb bezeichnet ein starkes Verlangen. „Begehrt“ bewahrt diese Intensität, ohne die Bedeutung über den durch den Kontext gegebenen negativen Sinn hinaus einzuengen.
- source_word: רָשָׁע
  choice: ein Frevler
  rationale: Das substantivierte Adjektiv steht im generischen Singular. „Ein Frevler“ bezeichnet verständlich einen Menschen, dessen Handeln moralisch verwerflich ist, und bewahrt die knappe Spruchform.
- source_word: מְצוֹד
  choice: die Beute
  rationale: Das seltene Substantiv ist lexikalisch unsicher und kann mit Fang, Netz, Falle oder dem Gefangenen beziehungsweise Erbeuteten zusammenhängen. „Beute“ ergibt im Zusammenhang einen sinnvollen Gegenstand des Begehrens und lässt den Gegensatz zum eigenen Fruchtbringen der Gerechten hervortreten.
- source_word: רָעִים
  choice: der Bösen
  rationale: Das substantivierte maskuline Pluraladjektiv bezeichnet böse Menschen. „Der Bösen“ ist im Deutschen knapp und bewahrt die Parallelität der Personengruppen.
- source_word: שֹׁרֶשׁ
  choice: die Wurzel
  rationale: Das botanische Bild des hebräischen Textes wird unmittelbar bewahrt.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Das substantivierte Pluraladjektiv bezeichnet diejenigen, die gerecht sind. „Der Gerechten“ ist idiomatisch und entspricht der traditionellen Weisheitssprache, ohne konfessionelle Zusätze.
- source_word: יִתֵּן
  choice: trägt Frucht
  rationale: Wörtlich bedeutet das Verb „gibt“. Da kein Objekt genannt wird und die Wurzel das Subjekt ist, gibt „trägt Frucht“ den wahrscheinlich vorausgesetzten botanischen Sinn natürlich wieder; die Ergänzung wird in einer Fußnote offengelegt.
theological_decisions: []
translation_notes:
  register: Moderne, knappe und würdevolle Spruchsprache. Der Gegensatz zwischen fremder Beute und der eigenen fruchtbaren Wurzel bleibt erhalten; die beiden echten lexikalischen beziehungsweise idiomatischen Unsicherheiten werden durch Fußnoten sichtbar gemacht.
