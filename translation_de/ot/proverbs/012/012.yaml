  source_fidelity: 'Die Übersetzung gibt die Grundstruktur und den Gegensatz des hebräischen Spruchs zutreffend wieder: der generische Singular רָשָׁע als „Ein Frevler“, das starke Begehren חָמַד, die unsichere Wendung מְצוֹד רָעִים als „die Beute der Bösen“ und die produktive Wurzel der Gerechten. Die lexikalische Unsicherheit von מְצוֹד wird angemessen durch die Fußnote kenntlich gemacht, ohne eine umstrittene Deutung als sicher auszugeben.'
  naturalness: „Ein Frevler begehrt die Beute der Bösen, doch die Wurzel der Gerechten trägt Frucht“ ist idiomatisches, verständliches modernes Standarddeutsch in einem knappen und würdevollen Weisheitsspruchregister. „Frevler“ ist leicht gehoben, aber weder unverständlich noch unnötig archaisch und passt zur Gattung.
  terminology: „Gerechte“ und „Böse“ sind für den weisheitlichen und ethischen Gegensatz sachgemäß. „Trägt Frucht“ ist eine natürliche explizierende Wiedergabe von יִתֵּן bei „Wurzel“; die Fußnote legt die wörtlichere Form transparent offen. Die Fußnotenanker sind vollständig und korrekt zugeordnet.
