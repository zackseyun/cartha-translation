id: PRO.12.15
reference: Proverbs 12:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דֶּ֣רֶךְ אֱ֭וִיל יָשָׁ֣ר בְּ/עֵינָ֑י/ו וְ/שֹׁמֵ֖עַ לְ/עֵצָ֣ה חָכָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/015.yaml
  text: The way of a fool is right in his own eyes[b][a], but he who listens to counsel is wise.
translation:
  language: de
  text: Der Weg eines Narren ist in seinen eigenen Augen richtig[a]; wer aber auf Rat hört, ist weise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische „in seinen eigenen Augen“ ist eine Redewendung für das eigene Urteil. Sinngemäß: „Ein Narr hält seinen Weg für richtig.“'
    reason: cultural_note
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: Weg
  rationale: „Weg“ bewahrt das in der Weisheitsliteratur geläufige Bild für Lebensführung und Verhalten, ohne es auf eine einzige Bedeutung einzuengen.
- source_word: אֱוִיל
  choice: Narr
  rationale: Das Wort bezeichnet im Sprüchebuch einen Menschen, dem es in moralischer wie verstandesmäßiger Hinsicht an Weisheit fehlt. „Narr“ gibt diese weisheitliche Kategorie würdig und prägnant wieder.
- source_word: יָשָׁר
  choice: richtig
  rationale: Im Zusammenhang mit „in seinen eigenen Augen“ geht es um die subjektive Einschätzung als richtig oder korrekt, nicht vorrangig um Geradheit oder objektive Rechtschaffenheit.
- source_word: בְּעֵינָיו
  choice: in seinen eigenen Augen
  rationale: Die hebräische Redewendung wird bildgetreu wiedergegeben; „eigenen“ verdeutlicht im Deutschen den Bezug auf das persönliche Urteil.
- source_word: וְשֹׁמֵעַ
  choice: wer aber … hört
  rationale: Das Partizip beschreibt allgemein einen Menschen, der sich durch Zuhören auszeichnet. „Aber“ bringt den antithetischen Zusammenhang des Spruchs natürlich zum Ausdruck.
- source_word: לְעֵצָה
  choice: auf Rat
  rationale: „Auf Rat hören“ ist im modernen Deutschen idiomatisch und bezeichnet die Bereitschaft, überlegte Beratung anzunehmen.
- source_word: חָכָם
  choice: ist weise
  rationale: Die prädikative Wiedergabe entspricht dem Satzbau und stellt die Weisheit des Hörenden dem Narren gegenüber.
theological_decisions:
- issue: Generisches grammatisches Maskulinum im Einzelspruch
  choice: „eines Narren … seinen“
  alternative: „Wer töricht ist, hält den eigenen Weg …“
  rationale: Die männlichen Singularformen des Hebräischen werden als repräsentative, allgemein geltende Form bewahrt, ohne die Aussage ausdrücklich auf Männer zu beschränken.
- issue: Subjektive Richtigkeit oder objektive Rechtschaffenheit
  choice: „in seinen eigenen Augen richtig“
  alternative: „gerade/rechtschaffen“
  rationale: Die Formulierung lässt klar erkennen, dass der Weg nach dem eigenen Urteil des Narren richtig ist; sie behauptet nicht, dass er tatsächlich rechtschaffen sei.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe antithetische Form des hebräischen Spruchs und sein Weg-Bild bleiben erhalten; die idiomatische Bedeutung wird in der Fußnote erläutert.
