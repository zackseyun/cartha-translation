  variant: modern standard German
source:
  edition: WLC
  text: לֹא יְאֻנֶּ֣ה לַ/צַּדִּ֣יק כָּל אָ֑וֶן וּ֝/רְשָׁעִ֗ים מָ֣לְאוּ רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/021.yaml
  text: No harm will happen to the righteous, but the wicked are filled with trouble.
translation:
  language: de
  text: Kein Unheil widerfährt dem Gerechten, doch die Frevler werden von Unglück erfüllt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: von Bösem erfüllt.'
    reason: Das hebräische רָע kann sowohl Unglück beziehungsweise Not als auch moralisch Böses bezeichnen.
lexical_decisions:
- source_word: יְאֻנֶּה
  choice: widerfährt
  rationale: Das Verb bezeichnet hier, dass jemandem etwas zustößt oder ihn etwas trifft; „widerfährt“ gibt dies natürlich und würdig wieder.
- source_word: אָוֶן
  choice: Unheil
  rationale: Im Kontext bezeichnet das Wort eher schädliches Unglück als moralische Schuld. „Unheil“ wahrt zugleich seine negative, gewichtige Bedeutung.
- source_word: צַּדִּיק
  choice: der Gerechte
  rationale: Die substantivierte Einzahl entspricht dem hebräischen Weisheitsspruch und bezeichnet den Menschen, der recht handelt.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: „Frevler“ bezeichnet Menschen, die schuldhaft und gottlos handeln, ohne den Ausdruck auf eine einzelne Art des Fehlverhaltens einzuengen.
- source_word: רָע
  choice: Unglück
  rationale: Im antithetischen Parallelismus zu „Unheil“ liegt die Bedeutung Not oder Unglück nahe; die mögliche Bedeutung „Böses“ wird in der Fußnote erhalten.
theological_decisions:
- issue: Sprichwörtliche Aussage über das Ergehen des Gerechten
  choice: Die uneingeschränkte Form des hebräischen Weisheitsspruchs bleibt erhalten.
  alternative: Durch Zusätze wie „letztlich“ oder „dauerhaft“ die Aussage systematisch einschränken.
  rationale: Solche Zusätze stehen nicht im Ausgangstext und würden die Spannung zu anderen biblischen Aussagen über das Leiden Gerechter vorzeitig auflösen.
- issue: Bedeutung von רָע
  choice: Im Haupttext wird die leidbezogene Bedeutung „Unglück“ gewählt.
  alternative: „Böses“, mit stärker moralischer Bedeutung.
  rationale: Der Parallelismus mit אָוֶן („Unheil“) unterstützt die Bedeutung Unglück oder Not; die echte lexikalische Mehrdeutigkeit wird jedoch ausdrücklich vermerkt.
translation_notes:
  register: Knapper, einprägsamer Weisheitsstil in modernem Standarddeutsch. „Widerfährt“ und „Frevler“ sind würdig und allgemein verständlich; die antithetische Satzstruktur des Hebräischen bleibt erhalten.
