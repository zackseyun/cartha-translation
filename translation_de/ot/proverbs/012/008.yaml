id: PRO.12.8
reference: Proverbs 12:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְֽ/פִי שִׂ֭כְל/וֹ יְהֻלַּל אִ֑ישׁ וְ/נַעֲוֵה לֵ֝֗ב יִהְיֶ֥ה לָ/בֽוּז־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/008.yaml
  text: A man is praised according to his insight[b][a], but one with a twisted heart will be despised.
translation:
  language: de
  text: Ein Mensch wird seiner Einsicht entsprechend gelobt,[a] doch wer ein verdrehtes Herz hat,[b] wird verachtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Mensch wird im Maß seiner Klugheit gelobt.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »wer verdrehten Herzens ist«; gemeint ist eine moralisch verkehrte innere Gesinnung.'
    reason: cultural_note
lexical_decisions:
- source_word: לְפִי
  choice: seiner … entsprechend
  rationale: Die Wendung bedeutet wörtlich »nach dem Mund von«, dient hier aber als Maßstabsangabe. »Entsprechend« bewahrt den Sinn, dass sich das Lob nach dem Maß der Einsicht richtet.
- source_word: שִׂכְלוֹ
  choice: seiner Einsicht
  rationale: שֵׂכֶל bezeichnet Einsicht, Klugheit oder verständiges Urteilsvermögen. »Einsicht« erhält sowohl die gedankliche als auch die praktische Dimension.
- source_word: יְהֻלַּל
  choice: wird … gelobt
  rationale: Die Pual-Form bezeichnet das Empfangen von Lob. Das deutsche Präsens gibt die allgemeingültige Aussage des Spruchs natürlich wieder.
- source_word: אִישׁ
  choice: Ein Mensch
  rationale: אִישׁ ist grammatisch maskulin, steht hier jedoch als allgemeine Bezeichnung für eine Person. »Ein Mensch« gibt diesen repräsentativen Gebrauch im modernen Deutschen natürlich wieder.
- source_word: נַעֲוֵה
  choice: verdrehtes
  rationale: Das Wort beschreibt etwas Verkrümmtes oder Verkehrtes und bezeichnet hier bildlich eine moralisch entstellte innere Haltung. »Verdreht« bewahrt das Bild, ohne unnötig altertümlich zu wirken.
- source_word: לֵב
  choice: Herz
  rationale: לֵב umfasst im Hebräischen Denken, Wollen und innere Gesinnung. »Herz« bewahrt die biblische Ausdrucksweise und verengt den Sinn nicht auf den Verstand oder die Gefühle.
- source_word: יִהְיֶה לָבוּז
  choice: wird verachtet
  rationale: Die Konstruktion bedeutet, zum Gegenstand der Verachtung zu werden. »Wird verachtet« ist knapp, idiomatisch und erhält die resultative Bedeutung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Spruchstruktur bleibt erhalten; die hebräische Nominalwendung »verdrehten Herzens« wird im Haupttext zugunsten natürlicher Verständlichkeit mit »wer ein verdrehtes Herz hat« wiedergegeben.
