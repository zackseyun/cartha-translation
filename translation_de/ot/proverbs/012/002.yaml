source:
  edition: WLC
  text: ט֗וֹב יָפִ֣יק רָ֭צוֹן מֵ/יְהוָ֑ה וְ/אִ֖ישׁ מְזִמּ֣וֹת יַרְשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/002.yaml
  text: A good man obtains favor from Yahweh[b][a], but a man of schemes he condemns.
translation:
  language: de
  text: 'Ein guter Mensch erlangt Gunst von Jahwe[a],

    doch einen Mann voller Ränke[b] spricht Jahwe schuldig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „gewinnt Jahwes Wohlwollen“ oder „findet bei Jahwe Wohlgefallen“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch allgemein „Pläne“ oder „Absichten“ bezeichnen; der Gegensatz und der folgende Schuldspruch legen hier arglistige oder böse Pläne nahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: ein guter Mensch
  rationale: Das substantivierte Adjektiv bezeichnet einen Menschen nach seiner moralischen Beschaffenheit. „Ein guter Mensch“ ist im heutigen Deutsch natürlich und bewahrt die breite Aussage, ohne sie auf eine einzelne Tugend einzuengen.
- source_word: יָפִיק
  choice: erlangt
  rationale: In Verbindung mit רָצוֹן bezeichnet das Hifil idiomatisch das Erlangen oder Gewinnen göttlicher Gunst. „Erlangt“ ist knapp und dem spruchhaften Stil angemessen.
- source_word: רָצוֹן
  choice: Gunst
  rationale: Das Wort bezeichnet hier Zustimmung, Wohlwollen oder Wohlgefallen. „Gunst“ gibt die göttliche Zuwendung prägnant wieder.
- source_word: מֵיְהוָה
  choice: bei Jahwe
  rationale: Die Präposition kennzeichnet Jahwe als Ursprung der Gunst. Die deutsche Wendung „Gunst bei jemandem erlangen“ ist idiomatisch; die Herkunft der Gunst bleibt aus dem Zusammenhang deutlich.
- source_word: אִישׁ
  choice: einen Mann
  rationale: Das hebräische Substantiv ist ausdrücklich maskulin und wird daher entsprechend wiedergegeben. Der Akkusativ ergibt sich aus seiner Funktion als vorangestelltes Objekt des folgenden Verbs.
- source_word: מְזִמּוֹת
  choice: voller Ränke
  rationale: Das Wort kann je nach Kontext neutral oder positiv „Pläne/Überlegungen“ bedeuten. Im Gegensatz zum Guten und zusammen mit dem Schuldspruch ist hier jedoch eine negative Bedeutung wahrscheinlich. „Ränke“ bringt den arglistigen Charakter knapp zum Ausdruck.
- source_word: יַרְשִׁיעַ
  choice: spricht er schuldig
  rationale: Das Hifil von רשע bedeutet, jemanden für schuldig beziehungsweise gottlos zu erklären. „Spricht … schuldig“ bewahrt den rechtlichen Aussagegehalt genauer als das allgemeinere „verurteilt“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Unausgesprochenes Subjekt von יַרְשִׁיעַ
  choice: Das Subjekt wird mit „er“ aus dem ersten Versglied weitergeführt.
  alternative: „Jahwe“ im zweiten Versglied ausdrücklich wiederholen oder passiv formulieren
  rationale: Obwohl im zweiten Versglied kein Subjekt eigens genannt wird, ist Jahwe aus dem ersten Versglied als Subjekt naheliegend. Das Pronomen erhält zugleich die knappe hebräische Parallelstruktur, ohne den Gottesnamen ergänzend zu wiederholen.
- issue: Moralische Färbung von מְזִמּוֹת
  choice: 'negative Bedeutung: „Ränke“'
  alternative: 'neutraler: „Pläne“ oder „Absichten“'
  rationale: Das Wort selbst kann auch neutral oder positiv gebraucht werden. Hier legen jedoch der Gegensatz zu טוֹב und das Verb des Schuldigsprechens eine arglistige oder böse Bedeutung nahe; die Fußnote wahrt die grundsätzliche Bedeutungsbreite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in knapper Spruchform. Die Zeilenteilung bildet den antithetischen Parallelismus ab. Das vorangestellte Objekt „einen Mann voller Ränke“ bewahrt die hebräische Hervorhebung; „spricht er schuldig“ erhält den forensischen Klang des Verbs.
