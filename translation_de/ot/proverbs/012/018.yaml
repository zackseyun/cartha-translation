source:
  edition: WLC
  text: יֵ֣שׁ בּ֭וֹטֶה כְּ/מַדְקְר֣וֹת חָ֑רֶב וּ/לְשׁ֖וֹן חֲכָמִ֣ים מַרְפֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/018.yaml
  text: There is one who speaks rashly like the thrusts of a sword[b][a], but the tongue of the wise brings healing.
translation:
  language: de
  text: Mancher redet unbedacht, als stäche er mit einem Schwert zu, doch die Zunge der Weisen bringt Heilung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „doch die Zunge der Weisen ist Heilung“; auch: „ist ein Heilmittel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Mancher
  rationale: Die Existenzformel führt einen bestimmten Menschentyp ein. „Mancher“ gibt dies im Deutschen knapp und sprichwörtlich wieder.
- source_word: בּוֹטֶה
  choice: redet unbedacht
  rationale: Das Partizip bezeichnet unbeherrschtes, vorschnelles Reden. „Redet unbedacht“ ist natürlich und bewahrt die moralische Wertung, ohne das Bild unnötig einzuengen.
- source_word: כְּמַדְקְרוֹת חָרֶב
  choice: wie mit Schwertstichen
  rationale: Die Wendung bezeichnet stechende beziehungsweise durchbohrende Hiebe eines Schwertes. Der Plural und die verletzende Bildwirkung bleiben erhalten.
- source_word: וּלְשׁוֹן
  choice: doch die Zunge
  rationale: „Zunge“ bewahrt die hebräische Metapher für das Reden; „doch“ macht den deutlichen Gegensatz idiomatisch sichtbar.
- source_word: חֲכָמִים
  choice: der Weisen
  rationale: Der Plural bezeichnet weise Menschen allgemein. Die substantivierte Form ist knapp, inklusiv und dem würdevollen Spruchstil angemessen.
- source_word: מַרְפֵּא
  choice: bringt Heilung
  rationale: Das Substantiv kann „Heilung“ oder „Heilmittel“ bedeuten. Die verbale Fügung klingt im Deutschen natürlich und bringt die heilende Wirkung weiser Rede zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Das Gegensatzpaar von verletzender und heilender Rede sowie die Metapher „Zunge“ bleiben erhalten.
