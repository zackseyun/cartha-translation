source:
  edition: WLC
  text: מַחְשְׁב֣וֹת צַדִּיקִ֣ים מִשְׁפָּ֑ט תַּחְבֻּל֖וֹת רְשָׁעִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/005.yaml
  text: The thoughts of the righteous are justice[b][a]; the counsels of the wicked are deceit.
translation:
  language: de
  text: Die Gedanken der Gerechten sind gerecht[a]; die Pläne der Bösen sind Betrug[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „Recht“; das Wort kann auch „Gerechtigkeit“ oder „Urteil“ bedeuten. Die adjektivische Wiedergabe „gerecht“ ist im Deutschen idiomatischer.
    reason: lexical_alternative
  - marker: b
    text: Das mit „Pläne“ wiedergegebene Wort kann auch „Überlegungen“, „Ratschläge“ oder „Strategien“ bezeichnen; für „Betrug“ sind auch „Täuschung“ oder „Trug“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: Gedanken
  rationale: Das Substantiv kann Gedanken, Absichten oder Pläne bezeichnen. „Gedanken“ wahrt die innere, moralische Dimension und lässt die mögliche Bedeutung „Pläne“ in der Fußnote offen.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die gerecht handeln. „Die Gerechten“ ist knapp, würdig und bewahrt den repräsentativen Plural.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Das hebräische Substantiv bezeichnet hier Recht, Gerechtigkeit oder ein gerechtes Urteil. Das nominale Prädikat „sind Recht“ bildet die Form und den Gegensatz zu „Betrug“ möglichst unmittelbar ab, auch wenn die Wendung im Deutschen bewusst sprichwortartig verdichtet klingt.
- source_word: תַּחְבֻּלוֹת
  choice: Pläne
  rationale: Das Wort kann überlegte Pläne, strategische Überlegungen oder Ratschläge bezeichnen. „Pläne“ ist im modernen Deutschen verständlich, ohne die negative Wertung schon vor dem Prädikat „Betrug“ vorwegzunehmen.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: Das substantivierte Adjektiv bezeichnet moralisch schuldige oder böse Menschen. „Frevler“ ist in weisheitlicher Sprache prägnant und bildet einen klaren Gegensatz zu „den Gerechten“.
- source_word: מִרְמָה
  choice: Betrug
  rationale: Das Substantiv bezeichnet Täuschung, Trug oder betrügerisches Handeln. „Betrug“ ist direkt und bewahrt als Nomen die Parallelität zu „Recht“.
theological_decisions:
- issue: Nominales Prädikat מִשְׁפָּט
  choice: „sind Recht“ als verdichtete nominale Aussage
  alternative: „sind gerecht“ oder „entsprechen dem Recht“
  rationale: Die Übersetzung bewahrt die hebräische Gegenüberstellung der beiden Substantive „Recht“ und „Betrug“, ohne die Aussage auf bloße subjektive Aufrichtigkeit oder auf ein bestimmtes Rechtsurteil einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen und bewusst verdichteten Satzform eines Sprichworts. Das Semikolon bildet den antithetischen Parallelismus ab; „sind Recht“ ist markierter als gewöhnliche Prosa, bewahrt aber die nominale Struktur und die Spannung des Hebräischen.
