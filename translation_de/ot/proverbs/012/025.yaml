base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/025.yaml
  text: Anxiety in a man's heart weighs it down[b][a], but a good word makes it glad.
translation:
  language: de
  text: Sorge im Herzen eines Menschen drückt ihn nieder[a], doch ein gutes Wort erfreut ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beugt ihn nieder“. Das hebräische Verb zeichnet das Bild von jemandem, der niedergedrückt wird und sich beugt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּאָגָה
  choice: Sorge
  rationale: Das Substantiv bezeichnet bedrückende, ängstliche Sorge. „Sorge“ ist im Deutschen natürlich und weit genug, ohne bereits eine klinische Angststörung anzudeuten.
- source_word: בְלֶב אִישׁ
  choice: im Herzen eines Menschen
  rationale: „Herz“ bewahrt die hebräische Vorstellung vom inneren Menschen. אִישׁ steht hier als repräsentativer Singular; „eines Menschen“ gibt dies im modernen Deutschen geschlechtsübergreifend und ohne Bedeutungsverlust wieder.
- source_word: יַשְׁחֶנָּה
  choice: drückt ihn nieder
  rationale: Die Verbform beschreibt ein Niederbeugen oder Herabdrücken. „Drückt ihn nieder“ bewahrt das Bild und bezieht die Wirkung idiomatisch auf den Menschen, dessen Inneres von Sorge belastet wird. Die ungewöhnlichen femininen Suffixe des Hebräischen lassen ihren grammatischen Bezug nicht völlig eindeutig erkennen.
- source_word: וְדָבָר טוֹב
  choice: doch ein gutes Wort
  rationale: דָבָר kann Wort, Aussage oder Botschaft bedeuten. „Ein gutes Wort“ hält diese Weite offen; „doch“ macht den Gegensatz der parallelen Vershälften im Deutschen deutlich.
- source_word: יְשַׂמְּחֶנָּה
  choice: macht ihm Freude
  rationale: Der Piel-Stamm bezeichnet das Erfreuen oder Frohmachen. Die Formulierung ist natürlich und gibt die verursachende Bedeutung wieder, ohne die Aussage zu überdehnen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper sprichwörtlicher Parallelstruktur. „Mensch“ gibt den repräsentativen Singular inklusiv wieder; die Metapher des Herzens bleibt erhalten.
