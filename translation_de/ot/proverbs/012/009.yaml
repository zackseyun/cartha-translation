source:
  edition: WLC
  text: ט֣וֹב נִ֭קְלֶה וְ/עֶ֣בֶד ל֑/וֹ מִ֝/מְּתַכַּבֵּ֗ד וַ/חֲסַר לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/009.yaml
  text: Better is one who is lightly esteemed and has a servant than one who honors himself and lacks bread[a].
translation:
  language: de
  text: Besser ist, wer gering geachtet wird und einen Diener hat, als wer sich selbst wichtig macht und kein Brot hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als wer sich selbst Ehre erweist und nicht genug Brot hat.“ Das hebräische Wort kann bedeuten, dass jemand sich selbst als angesehen oder wichtig darstellt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Besser ist
  rationale: Im vergleichenden Spruch bedeutet טוֹב idiomatisch „besser“. Die Ergänzung von „ist“ gibt den verblosen hebräischen Satz natürlich wieder.
- source_word: נִקְלֶה
  choice: wer gering geachtet wird
  rationale: Das Nifal-Partizip bezeichnet jemanden, der als unbedeutend gilt oder wenig Ansehen genießt. Die Formulierung bewahrt den gesellschaftlichen Ehraspekt, ohne ihn zu „verachtet“ zu verschärfen.
- source_word: וְעֶבֶד לוֹ
  choice: und einen Diener hat
  rationale: Wörtlich steht „und ein Diener ihm“. Gemeint ist, dass die Person trotz geringen Ansehens über reale Mittel verfügt. „Diener“ passt zum sozialen Vergleich; „hat“ ist idiomatisch ergänzt.
- source_word: מִמְּתַכַּבֵּד
  choice: als wer sich selbst wichtigmacht
  rationale: Das Hitpael-Partizip von כבד beschreibt reflexiv, dass jemand sich als gewichtig, angesehen oder wichtig darstellt. „Sich selbst wichtigmachen“ gibt die wahrscheinliche Nuance sozialer Selbstdarstellung natürlich wieder; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: וַחֲסַר לָחֶם
  choice: und kein Brot hat
  rationale: לֶחֶם kann konkret Brot oder allgemeiner Nahrung bezeichnen. „Kein Brot hat“ bewahrt das konkrete hebräische Bild und drückt den Mangel an Lebensnotwendigem klar aus.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Der gesellschaftliche Gegensatz zwischen geringem Ansehen bei tatsächlichem Auskommen und äußerer Selbstdarstellung bei wirklichem Mangel bleibt erhalten.
