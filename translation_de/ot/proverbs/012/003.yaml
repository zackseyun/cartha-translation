id: PRO.12.3
reference: Proverbs 12:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא יִכּ֣וֹן אָדָ֣ם בְּ/רֶ֑שַׁע וְ/שֹׁ֥רֶשׁ צַ֝דִּיקִ֗ים בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/003.yaml
  text: A man is not established by wickedness[b][a], but the root of the righteous will not be moved.
translation:
  language: de
  text: Durch Bosheit gewinnt kein Mensch festen Bestand; die Wurzel der Gerechten aber wird nicht wanken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wird nicht erschüttert; das Bild bezeichnet festen, dauerhaften Bestand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכּוֹן
  choice: gewinnt … festen Bestand
  rationale: Das Nifal von כון bezeichnet Festigung, sicheren Bestand oder dauerhaftes Gegründetsein. Die deutsche Wendung gibt den resultativen Sinn natürlich wieder und passt zur allgemeingültigen Aussage eines Spruchs.
- source_word: אָדָם
  choice: kein Mensch
  rationale: אָדָם bezeichnet hier im sprichwörtlichen Singular einen Menschen allgemein. „Mensch“ bewahrt den individuellen Bezug und ist im modernen Deutschen ohne unnötige geschlechtliche Verengung idiomatisch.
- source_word: בְּרֶשַׁע
  choice: durch Bosheit
  rationale: 'Die Präposition בְּ wird hier am besten instrumental verstanden: Bosheit ist kein Mittel, durch das ein Mensch dauerhaften Bestand erlangt.'
- source_word: שֹׁרֶשׁ
  choice: die Wurzel
  rationale: Das konkrete Bild der Wurzel bleibt erhalten; es vermittelt Festigkeit, Lebenskraft und Dauer.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Das substantivierte Pluraladjektiv bezeichnet die Gruppe der Menschen, die gerecht sind. Der Genitiv fügt sich natürlich in das Wurzelbild ein.
- source_word: בַּל
  choice: nicht
  rationale: Die poetische Verneinung wird im Deutschen schlicht und nachdrücklich mit „nicht“ wiedergegeben, ohne eine zusätzliche absolute Aussage wie „niemals“ einzutragen.
- source_word: יִמּוֹט
  choice: wird nicht wanken
  rationale: מוט bezeichnet Bewegtwerden, Wanken oder Schwanken. „Wanken“ bewahrt das Bild dauerhafter Standfestigkeit und klingt zugleich würdig und verständlich.
theological_decisions:
- issue: Allgemeiner menschlicher Bezug von אָדָם im sprichwörtlichen Singular
  choice: „kein Mensch“ als allgemein auf jeden einzelnen Menschen bezogene Formulierung
  alternative: „kein Mann“
  rationale: Der Zusammenhang trifft eine allgemeine Aussage über moralische und dauerhafte Stabilität. Das hebräische אָדָם kann den Menschen als solchen bezeichnen; „Mensch“ gibt diesen Umfang im Deutschen präzise und natürlich wieder, ohne den Text auf männliche Personen zu beschränken.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Spruchstil. Der Parallelismus und das konkrete Bild der Wurzel bleiben erhalten; „Bosheit“ gibt רֶשַׁע als moralische Verkehrtheit wieder.
