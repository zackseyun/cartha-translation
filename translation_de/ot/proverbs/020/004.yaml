  text: מֵ֭/חֹרֶף עָצֵ֣ל לֹא יַחֲרֹ֑שׁ ישאל בַּ/קָּצִ֣יר וָ/אָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/004.yaml
  text: Because of winter[a], the lazy man does not plow; at harvest he seeks[b], and there is nothing.
translation:
  language: de
  text: Wegen des Winters[a] pflügt der Faule nicht; zur Erntezeit bittet er[b], doch nichts ist da.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Im Winter“. Die hebräische Präposition kann zeitlich („im Winter“) oder kausal („wegen des Winters“) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sucht er“ oder „fragt er“. Das hebräische Verb kann „fragen“ oder „bitten“ und in diesem Zusammenhang auch „suchen“ beziehungsweise um Ertrag bitten bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵחֹרֶף
  choice: Wegen des Winters
  rationale: 'Die Präposition מִן kann hier kausal verstanden werden: Der Winter beziehungsweise die kalte Jahreszeit hält den Faulen vom Pflügen ab oder dient ihm als Vorwand. Die ebenfalls mögliche temporale Deutung wird nicht ausgeschlossen.'
- source_word: עָצֵל
  choice: der Faule
  rationale: Das substantivierte Adjektiv bezeichnet in der Weisheitsliteratur einen gewohnheitsmäßig trägen Menschen. Die maskuline Singularform und ihr repräsentativer Charakter bleiben erhalten.
- source_word: לֹא יַחֲרֹשׁ
  choice: pflügt … nicht
  rationale: חרשׁ bezeichnet hier konkret das landwirtschaftliche Pflügen. Das Präsens gibt den sprichwörtlich-allgemeinen Charakter natürlich wieder.
- source_word: ישאל
  choice: sucht er
  rationale: שׁאל bedeutet gewöhnlich „fragen“ oder „bitten“, kann im Kontext aber auf das Suchen beziehungsweise Erbitten von Ertrag zielen. „sucht“ lässt das im Hebräischen fehlende Objekt offen.
- source_word: בַּקָּצִיר
  choice: zur Erntezeit
  rationale: Die Wendung bezeichnet den Zeitpunkt, an dem die Folge des unterlassenen Pflügens sichtbar wird.
- source_word: וָאָיִן
  choice: doch es ist nichts da
  rationale: אָיִן ist eine knappe Existenzverneinung. Die Wiedergabe lässt wie das Hebräische offen, was genau fehlt; „doch“ macht den im Zusammenhang liegenden Gegensatz im Deutschen deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch mit sprichwörtlichem Rhythmus. Die kausale Deutung von מֵחֹרֶף steht im Haupttext; die mögliche temporale Nuance ist im Deutschen teilweise weiterhin hörbar, wird aber nicht eigens durch eine Fußnote markiert. Das nicht genannte Objekt des Suchens beziehungsweise Bittens bleibt bewusst unausgesprochen.
