source:
  edition: WLC
  text: אַל תֹּאמַ֥ר אֲשַׁלְּמָה רָ֑ע קַוֵּ֥ה לַֽ֝/יהוָ֗ה וְ/יֹ֣שַֽׁע לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/022.yaml
  text: Do not say[a], “I will repay evil”; wait for Yahweh[c][b], and he will save you.
translation:
  language: de
  text: 'Sag nicht: „Ich werde Böses vergelten.“ Warte hoffnungsvoll auf Jahwe[a], und er wird dich retten[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hoffe auf Jahwe“; das hebräische Verb bezeichnet ein erwartungsvolles, zuversichtliches Warten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „er wird dich befreien“; im Zusammenhang kann auch mitschwingen, dass er dir zum Recht verhilft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Sag nicht
  rationale: אַל mit der Verbform drückt ein Verbot aus; „Sag nicht“ gibt die direkte, knappe Mahnung natürlich wieder.
- source_word: אֲשַׁלְּמָה רָע
  choice: Ich werde Böses vergelten
  rationale: שׁלם im Piel bezeichnet hier das heimzahlende Vergelten; רָע bleibt mit „Böses“ bewusst moralisch und semantisch weit gefasst.
- source_word: קַוֵּה
  choice: Warte hoffnungsvoll
  rationale: קוה verbindet Warten mit zuversichtlicher Erwartung. „Warte hoffnungsvoll“ bewahrt beide Bedeutungsanteile in verständlichem Deutsch.
- source_word: לַיהוָה
  choice: auf Jahwe
  rationale: Die Präposition ל markiert hier den, auf den sich das erwartungsvolle Warten richtet; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וְיֹשַׁע לָךְ
  choice: und er wird dich retten
  rationale: Das Hiphil von ישׁע bezeichnet Retten oder Befreien. Die deutsche Konstruktion mit direktem Objekt gibt לָךְ idiomatisch als „dich“ wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von וְיֹשַׁע לָךְ
  choice: er wird dich retten
  alternative: er wird dich befreien / dir zum Recht verhelfen
  rationale: „Retten“ erhält den breiten Bedeutungsumfang von ישׁע und legt weder ausschließlich eine äußere Befreiung noch eine rechtliche Rechtfertigung fest.
- issue: Verhältnis von menschlicher Vergeltung und göttlichem Handeln
  choice: Die Aufforderung zum hoffnungsvollen Warten steht ohne ergänzende Erklärung neben der Verheißung göttlicher Rettung.
  alternative: Ausdrückliche Deutung als Verbot jeder Vergeltung oder als Zusage konkreter göttlicher Vergeltung
  rationale: Der hebräische Text untersagt die selbst angekündigte Vergeltung und verheißt Rettung, erklärt aber nicht näher, auf welche Weise Jahwe handelt. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, klares Standarddeutsch mit knapper sprichwörtlicher Form und würdigem Ton. „Vergelten“ erhält den Gedanken der erwidernden Heimzahlung; „Böses“ lässt offen, ob die erlittene Tat als Unrecht, Schaden oder moralisch Böses im Vordergrund steht.
