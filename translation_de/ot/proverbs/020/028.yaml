  yaml_path: translation/ot/proverbs/020/028.yaml
  text: Steadfast love and faithfulness preserve a king[c][b][a], and by steadfast love his throne is upheld.
translation:
  language: de
  text: Beständige Liebe und Treue bewahren einen König, und durch beständige Liebe stützt er seinen Thron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: beständige Liebe
  rationale: Die Wendung verbindet wohlwollende Zuwendung mit verlässlicher Loyalität und bewahrt zugleich die Wiederholung des hebräischen Wortes in beiden Satzhälften.
- source_word: אֱמֶת
  choice: Treue
  rationale: In der Verbindung mit חֶסֶד bezeichnet das Wort hier eher Verlässlichkeit und Treue als abstrakte Wahrheit.
- source_word: יִצְּרוּ
  choice: bewahren
  rationale: Das Verb נצר bedeutet schützen, hüten oder bewahren; „bewahren“ gibt hier die erhaltende Wirkung der genannten Tugenden natürlich wieder.
- source_word: מֶלֶךְ
  choice: einen König
  rationale: Das artikellose Substantiv ist in diesem Weisheitsspruch am besten allgemein und unbestimmt zu verstehen.
- source_word: וְסָעַד
  choice: und … wird gestützt
  rationale: סעד bezeichnet das Stützen oder Aufrechterhalten. Die passive deutsche Form lässt den Thron als das Gestützte klar hervortreten.
- source_word: בַּחֶסֶד
  choice: durch beständige Liebe
  rationale: 'Die Präposition בְּ ist hier instrumental: Beständige Liebe ist das Mittel, durch das der Thron gestützt wird.'
- source_word: כִּסְאוֹ
  choice: sein Thron
  rationale: Die konkrete Metapher des Thrones samt Possessivsuffix wird beibehalten; gemeint ist zugleich die königliche Herrschaft.
