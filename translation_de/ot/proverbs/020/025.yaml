  text: מוֹקֵ֣שׁ אָ֭דָם יָ֣לַע קֹ֑דֶשׁ וְ/אַחַ֖ר נְדָרִ֣ים לְ/בַקֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/025.yaml
  text: It is a snare for a man to rashly dedicate something as holy, and only afterward to consider his vows.
translation:
  language: de
  text: 'Es ist für einen Menschen eine Falle, vorschnell zu sagen: „Heilig!“, und erst nach dem Ablegen von Gelübden zu prüfen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹקֵשׁ
  choice: Falle
  rationale: Das Substantiv bezeichnet eine Schlinge beziehungsweise Falle und wird hier bildlich für eine selbst herbeigeführte Gefahr gebraucht.
- source_word: יָלַע
  choice: vorschnell … weihen
  rationale: Das seltene und textlich schwierige Verb wird im Kontext als unbedachtes, übereiltes Aussprechen beziehungsweise Vollziehen einer Heiligung verstanden. Die Übersetzung wahrt den Sinn der Warnung, ohne eine bestimmte Sprechformel einzuführen.
- source_word: קֹדֶשׁ
  choice: etwas als heilig
  rationale: Das Wort bedeutet hier wohl »Heiliges« beziehungsweise »für heilig erklärt/geweiht«. Das ergänzte »etwas« ergibt im Deutschen einen natürlichen Satz und benennt keinen Gegenstand, den der hebräische Text offenlässt.
- source_word: נְדָרִים
  choice: Gelübden
  rationale: Der Plural bezeichnet religiös bindende Gelübde.
- source_word: לְבַקֵּר
  choice: darüber nachzudenken
  rationale: Das Verb kann »prüfen, untersuchen, nachforschen« bedeuten. Im Zusammenhang ist die nachträgliche Prüfung oder Überlegung gemeint.
theological_decisions:
- issue: Verhältnis von Heiligung und Gelübden
  choice: Die Zeile warnt davor, etwas vorschnell zu weihen und die Tragweite der Gelübde erst danach zu prüfen.
  alternative: Die Zeile könnte enger als Warnung vor dem übereilten Ausruf »Heilig!« verstanden werden.
  rationale: Die gewählte Fassung folgt der syntaktisch und sachlich naheliegenden Verbindung mit dem Gelübdekontext, ohne ein bestimmtes Ritual oder eine wörtliche Formel vorauszusetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Parallelismus und die knappe Spruchform bleiben erhalten; »für den Menschen« gibt אָדָם allgemein und geschlechtsübergreifend wieder.
