  yaml_path: translation/ot/proverbs/020/007.yaml
  text: A righteous man walks in his integrity[b][a]; blessed are his children after him.
translation:
  language: de
  text: Ein Gerechter lebt in seiner Lauterkeit[a]; glücklich sind seine Kinder[b] nach ihm!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wandelt in seiner Lauterkeit“; gemeint ist seine beständige Lebensführung.'
    reason: metaphor_clarification
  - marker: b
    text: Hebräisch „Söhne“; das Wort kann hier allgemein Kinder beziehungsweise Nachkommen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְהַלֵּךְ
  choice: geht seinen Weg
  rationale: Das Hitpael-Partizip von הלך bezeichnet hier die beständige Lebensführung. „Geht seinen Weg“ bewahrt das hebräische Weg-Motiv und klingt zugleich natürlich im modernen Deutschen.
- source_word: בְּתֻמּוֹ
  choice: in Lauterkeit
  rationale: תֹּם/תֻּם bezeichnet charakterliche Ganzheit, Redlichkeit und Unbescholtenheit. „Lauterkeit“ gibt den ethischen Sinn knapp und würdig wieder.
- source_word: צַדִּיק
  choice: ein Gerechter
  rationale: Die maskuline Singularform bezeichnet in der sprichwörtlichen Aussage einen gerechten Menschen. „Ein Gerechter“ wahrt Form und prägnanten Weisheitsstil des Hebräischen.
- source_word: אַשְׁרֵי
  choice: wohl
  rationale: אַשְׁרֵי ist ein Ausruf, der Menschen als glücklich, beneidenswert oder begünstigt bezeichnet. Die Wendung „wohl …!“ erhält den Ausrufcharakter und legt nicht einseitig fest, ob ein Gefühl oder göttlicher Segen im Vordergrund steht.
- source_word: בָנָיו
  choice: seinen Kindern
  rationale: בָּנִים bedeutet formal „Söhne“, kann aber Nachkommen beziehungsweise Kinder beider Geschlechter bezeichnen. Im vorliegenden familiären Zusammenhang ist „Kinder“ die natürliche Wiedergabe.
- source_word: אַחֲרָיו
  choice: nach ihm
  rationale: Die direkte Wiedergabe bewahrt die knappe Formulierung und ihre mögliche zeitliche beziehungsweise generationale Bedeutung.
theological_decisions:
- issue: Repräsentative maskuline Ausdrucksweise im Weisheitsspruch
  choice: ein Gerechter
  alternative: ein gerechter Mensch
  rationale: Der hebräische Text steht im maskulinen Singular und formuliert einen repräsentativen Weisheitssatz. Die maskuline Form wird beibehalten, ohne den Grundsatz auf Männer zu beschränken.
- issue: Art des Wohlergehens der Kinder
  choice: wohl seinen Kindern
  alternative: gesegnet sind seine Kinder
  rationale: אַשְׁרֵי beschreibt einen beglückwünschenswerten oder beneidenswert guten Zustand, sagt aber nicht ausdrücklich, auf welche Weise er herbeigeführt wird. „Wohl“ vermeidet eine unnötige Festlegung auf einen ausdrücklich ausgesprochenen göttlichen Segen.
translation_notes:
  register: Knapper, würdiger Weisheitsstil in modernem Standarddeutsch. Das Weg-Motiv bleibt in natürlicher deutscher Form erhalten; „wohl …!“ gibt den hebräischen Ausruf wieder.
