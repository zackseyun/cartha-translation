  text: אַל תֶּֽאֱהַ֣ב שֵׁ֭נָה פֶּן תִּוָּרֵ֑שׁ פְּקַ֖ח עֵינֶ֣י/ךָ שְֽׂבַֽע לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/013.yaml
  text: Do not love sleep[a], lest you become poor; open your eyes[b], and you will have your fill of bread.
translation:
  language: de
  text: Liebe den Schlaf nicht, sonst verarmst du.[a] Öffne deine Augen, dann wirst du dich an Brot satt essen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sonst wirst du mittellos“. Das hebräische Verb kann das Verarmen oder den Verlust von Besitz bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Öffne deine Augen; werde satt an Brot.“ Das Hebräische hat formal zwei Aufforderungen; die Übersetzung gibt die zweite als Folge wieder.'
    reason: syntax_and_lexical_alternative
lexical_decisions:
- source_word: אַל תֶּאֱהַב שֵׁנָה
  choice: Liebe den Schlaf nicht
  rationale: Die hebräische Verneinung mit der folgenden Verbform drückt ein Verbot aus. Die direkte Formulierung bewahrt Bild und Nachdruck des Spruchs.
- source_word: פֶּן תִּוָּרֵשׁ
  choice: sonst verarmst du
  rationale: פֶּן kündigt eine zu vermeidende Folge an. Das Nifal von ירשׁ bezeichnet hier das Verarmen beziehungsweise den Verlust der Lebensgrundlage; „sonst verarmst du“ ist knapp und natürlich.
- source_word: פְּקַח עֵינֶיךָ
  choice: Öffne deine Augen
  rationale: Die konkrete Aufforderung wird wörtlich bewahrt. Im Zusammenhang meint sie zugleich Wachheit und tätigen Fleiß, ohne das Bild darauf zu verengen.
- source_word: שְׂבַע לָחֶם
  choice: dann kannst du dich an Brot satt essen
  rationale: שְׂבַע ist formal ein Imperativ („werde satt“), kann nach der vorausgehenden Aufforderung aber die daraus folgende Sättigung ausdrücken. „Brot“ bewahrt das hebräische Bild für Nahrung und Lebensunterhalt.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit der knappen, bildhaften Form eines Weisheitsspruchs. „Liebe den Schlaf nicht“ bewahrt die pointierte Personifizierung; „satt essen“ macht die im Deutschen sonst ungewohnte Verbindung von Sättigung und Brot natürlich verständlich.
