review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und Bildsprache des Hebräischen grundsätzlich treffend wieder. „sonst verarmst du“ ist eine angemessene kontextuelle Wiedergabe von תִּוָּרֵשׁ. Die Schlusshälfte sollte jedoch nicht mit „kannst du“ formuliert werden: Das Modalverb schwächt die im Spruch ausgedrückte Folge unnötig ab. Eine resultative Zukunftsform ist im Deutschen klar und wahrt den Sinn der beiden hebräischen Imperative.'
  naturalness: „Liebe den Schlaf nicht“ und „Öffne deine Augen“ sind natürliches, knappes Standarddeutsch im Register eines Weisheitsspruchs. „dann wirst du dich an Brot satt essen“ ist idiomatischer und stärker als „dann kannst du dich an Brot satt essen“.
  terminology: „Brot“ bewahrt das hebräische Bild (לָחֶם), das hier zugleich Nahrung beziehungsweise Lebensunterhalt nahelegt. Es besteht kein Anlass für eine theologische oder konfessionelle Präzisierung.
  issues:
  - severity: medium
    issue: Das Modalverb „kannst“ in der letzten Zeile schwächt die Aussage ab.
    rationale: שְׂבַע ist formal ein Imperativ („werde satt“). Im sprichwörtlichen Zusammenhang kann die Folge im Deutschen resultativ wiedergegeben werden, aber „kannst“ macht daraus lediglich eine Möglichkeit. „wirst“ bringt die erwartete Folge klarer zum Ausdruck.
  - severity: low
    issue: Die Fußnote b bezeichnet die Wiedergabe als „zweite Aufforderung“, obwohl der deutsche Haupttext eine Folgerung formuliert.
    rationale: Die Anmerkung sollte ausdrücklich sagen, dass der hebräische Wortlaut formal zwei Imperative enthält und die Übersetzung den zweiten als Folge ausdrückt.
