source:
  edition: WLC
  text: רַ֣ע רַ֭ע יֹאמַ֣ר הַ/קּוֹנֶ֑ה וְ/אֹזֵ֥ל ל֝֗/וֹ אָ֣ז יִתְהַלָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/014.yaml
  text: “Bad[a], bad,” says the buyer; but when he goes away, then he boasts.
translation:
  language: de
  text: »Schlecht, schlecht!«[a], sagt der Käufer; doch wenn er weggegangen ist, rühmt er sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Nichts wert, nichts wert!« oder »Taugt nichts, taugt nichts!« Das Hebräische wiederholt »schlecht«, um zu betonen, wie der Käufer den Wert der Ware herunterredet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע רַע
  choice: »Schlecht, schlecht!«
  rationale: Die knappe Wiederholung bewahrt die nachdrückliche Herabsetzung der Ware beim Feilschen. Die direkte Rede macht deutlich, dass dies die Behauptung des Käufers ist.
- source_word: יֹאמַר
  choice: sagt
  rationale: Das Imperfekt bezeichnet hier passend eine allgemeine, sprichwörtliche Handlung in der Gegenwart.
- source_word: הַקּוֹנֶה
  choice: der Käufer
  rationale: Im Handels- und Verhandlungskontext ist dies die natürliche und genaue Wiedergabe von קנה.
- source_word: וְאֹזֵל לוֹ
  choice: doch wenn er weggegangen ist
  rationale: Die Form führt die Szene bis zum Fortgehen des Käufers weiter. »Doch« gibt den inhaltlichen Gegensatz zwischen öffentlicher Herabsetzung und anschließendem Prahlen wieder; לוֹ wird als idiomatischer Bestandteil der Wendung nicht eigens abgebildet.
- source_word: אָז
  choice: —
  rationale: Die zeitliche Abfolge ist im deutschen Nebensatz »wenn er weggegangen ist« bereits natürlich ausgedrückt; ein zusätzliches »dann« wäre möglich, aber stilistisch entbehrlich.
- source_word: יִתְהַלָּל
  choice: rühmt er sich
  rationale: Der Hitpael von הלל bezeichnet hier selbstgefälliges Rühmen über das erzielte Geschäft. Die reflexive Form bleibt nahe an der hebräischen Ausdrucksweise.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Form. Die direkte Rede und ihre Wiederholung bewahren den zugespitzten Ton einer Preisverhandlung.
