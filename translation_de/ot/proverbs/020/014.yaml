  source_fidelity: 'Die Übersetzung gibt die hebräische Satzfolge und den Sinn zuverlässig wieder: Die emphatische Wiederholung רַע רַע ist als direkte Rede erhalten, הַקּוֹנֶה treffend mit »der Käufer«, und יִתְהַלָּל idiomatisch als »rühmt er sich« wiedergegeben. Das adversative »doch« ist im sprichwörtlichen Kontrast gut begründet. Die Auslassung eines expliziten »dann« für אָז ist im Deutschen syntaktisch vertretbar, weil die zeitliche Folge klar bleibt.'
