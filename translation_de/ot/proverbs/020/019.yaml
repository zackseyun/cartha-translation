  text: One who reveals secrets goes about as a gossip[b][a]; do not associate with one who opens his lips wide.
translation:
  language: de
  text: Wer Geheimnisse preisgibt, geht umher und verbreitet üble Nachrede[a]; gib dich nicht mit einem ab, der den Mund zu weit aufmacht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geht als Verleumder umher“. Das hebräische רָכִיל bezeichnet jemanden, der umhergeht und schädliche Berichte oder Klatsch verbreitet.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „einem, der seine Lippen öffnet“. Gemeint ist jemand, der zu bereitwillig oder zu viel redet.'
    reason: idiom_clarification
lexical_decisions:
- source_word: גּוֹלֶה סּוֹד
  choice: Geheimnisse preisgibt
  rationale: Das Partizip גּוֹלֶה bezeichnet das Aufdecken oder Bekanntmachen, סוֹד eine vertrauliche Mitteilung, geheime Beratung oder ein Geheimnis. „Geheimnisse preisgibt“ gibt die Warnung vor dem Bruch von Vertraulichkeit klar und natürlich wieder.
- source_word: הוֹלֵךְ רָכִיל
  choice: zieht als Verleumder umher
  rationale: הוֹלֵךְ bewahrt das Bild des Umherziehens; רָכִיל bezeichnet jemanden, der schädliche Berichte oder üble Nachrede verbreitet. „Verleumder“ erhält den schädigenden Ernst des Ausdrucks, ohne ihn auf bloße Gesprächigkeit zu reduzieren.
- source_word: וּלְפֹתֶה שְׂפָתָיו
  choice: mit einem, der seine Lippen aufsperrt
  rationale: Die hebräische Wendung verbindet פֹתֶה mit „seinen Lippen“ und zeichnet einen Menschen, der seinen Mund allzu bereitwillig öffnet. Die bildhafte deutsche Formulierung bleibt quellennah; eine Fußnote erklärt die gemeinte Redseligkeit.
- source_word: לֹא תִתְעָרָב
  choice: lass dich nicht ein
  rationale: Der Hitpael von ערב bedeutet hier, sich mit jemandem zu vermischen, sich mit ihm abzugeben oder Umgang mit ihm zu pflegen. „Lass dich nicht ein“ ist im Deutschen natürlich und bewahrt den warnenden Imperativ.
