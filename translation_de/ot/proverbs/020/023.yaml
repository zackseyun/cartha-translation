id: PRO.20.23
reference: Proverbs 20:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה אֶ֣בֶן וָ/אָ֑בֶן וּ/מֹאזְנֵ֖י מִרְמָ֣ה לֹא טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/023.yaml
  text: Unequal weights are an abomination to Yahweh[a], and deceitful scales are not good.
translation:
  language: de
  text: Zweierlei Gewichtssteine[a] sind Jahwe ein Gräuel, und betrügerische Waagen sind nicht gut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Stein und Stein“; gemeint sind unterschiedlich bemessene Gewichtssteine, die beim Handel zum Betrug verwendet werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: ein Gräuel
  rationale: Das Substantiv bezeichnet etwas moralisch Abscheuliches. „Ein Gräuel“ bewahrt die starke ethische Wertung und ist im Deutschen bibelsprachlich vertraut, ohne unverständlich zu sein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: אֶבֶן וָאָבֶן
  choice: zweierlei Gewichtssteine
  rationale: Wörtlich steht „Stein und Stein“. Gemeint sind verschieden bemessene Gewichtssteine, die betrügerisch beim Handel eingesetzt werden. „Zweierlei Gewichtssteine“ gibt das Idiom verständlich wieder und erhält das konkrete Bild.
- source_word: וּמֹאזְנֵי מִרְמָה
  choice: und betrügerische Waagen
  rationale: מֹאזְנֵי bezeichnet Waagen beziehungsweise Balkenwaagen, מִרְמָה Täuschung oder Betrug. Die Formulierung ist natürlich und bewahrt den Gedanken absichtlich verfälschter Messung.
- source_word: לֹא טוֹב
  choice: sind nicht gut
  rationale: Die bewusst zurückhaltende hebräische Verneinung wird wörtungsnah erhalten und nicht zu „sind böse“ oder „sind verwerflich“ verstärkt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und folgt der üblichen deutschen Transkription.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Handelssprache des hebräischen Textes und die gemessene Formulierung „nicht gut“ bleiben erhalten.
