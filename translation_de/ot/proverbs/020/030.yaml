  text: חַבֻּר֣וֹת פֶּ֭צַע תמריק בְּ/רָ֑ע וּ֝/מַכּ֗וֹת חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/030.yaml
  text: The bruises of a wound cleanse away evil[b][a], and blows cleanse the innermost parts of the belly.
translation:
  language: de
  text: Wundstriemen scheuern das Böse weg[a], und Schläge reinigen die innersten Bereiche des Leibes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wundstriemen läutern vom Bösen“; das hebräische Verb kann reinigen, blank scheuern oder läutern bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Kammern des Bauches“; eine hebräische Wendung für das tiefste Innere eines Menschen.'
    reason: cultural_note
lexical_decisions:
- source_word: חַבֻּרוֹת פֶּצַע
  choice: Wundstriemen
  rationale: חַבֻּרוֹת bezeichnet durch Schläge verursachte Striemen oder Blutergüsse; פֶּצַע verstärkt das Bild als Verletzung. Das deutsche Kompositum bewahrt beide Bestandteile knapp und anschaulich.
- source_word: תמריק
  choice: scheuern … weg
  rationale: Die Hifil-Form von מרק kann reinigen, blank scheuern oder läutern bedeuten. „scheuern … weg“ erhält das kräftige körperliche Bild und drückt zugleich die Beseitigung des Bösen aus.
- source_word: בְּרָע
  choice: das Böse
  rationale: רָע bezeichnet hier das moralisch Böse. Trotz der Präposition ב wird es im Zusammenhang als das verstanden, woran die reinigende Wirkung geschieht.
- source_word: וּמַכּוֹת
  choice: und Schläge
  rationale: מַכּוֹת sind konkrete Schläge; die direkte Wiedergabe erhält den Parallelismus und die Härte des Bildes.
- source_word: חַדְרֵי בָטֶן
  choice: die Kammern des Leibes
  rationale: Wörtlich sind die „Kammern des Bauches/Leibes“ gemeint, eine hebräische Wendung für das tiefste Innere des Menschen. „Leib“ bewahrt die Körpermetapher in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Deutung der Bilder von Verletzung und Schlägen
  choice: Der Vers beschreibt, dass schmerzhafte Züchtigung das Böse beseitigen und bis ins tiefste Innere wirken kann.
  alternative: Die Aussage könnte allgemeiner die läuternde Wirkung von Leiden bezeichnen, ohne speziell Züchtigung zu meinen.
  rationale: Striemen und Schläge legen im Kontext der Sprüche korrigierende Züchtigung nahe. Die Übersetzung lässt jedoch die konkrete Bildsprache stehen und macht daraus keine allgemeine Lehre über jedes Leiden.
- issue: Ergänzung des Verbs im zweiten Halbvers
  choice: „reinigen“ wird aus dem ersten Halbvers sinngemäß ergänzt.
  alternative: Der zweite Halbvers könnte als verbloser Ausdruck wiedergegeben oder mit einem allgemeineren Verb wie „dringen“ ergänzt werden.
  rationale: Der hebräische Parallelismus lässt die Wirkung des ersten Verbs im zweiten Glied mitlaufen. Die Ergänzung „reinigen“ macht dies auf Deutsch verständlich, ohne eine neue Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige Körpermetaphorik bleibt erhalten; „Wundstriemen“ und „scheuern … weg“ geben die Härte des hebräischen Bildes natürlich wieder. Die Fußnotenmarker [a] und [b] stehen jeweils unmittelbar bei der erklärungsbedürftigen Formulierung.
