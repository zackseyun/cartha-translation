id: PRO.20.24
reference: Proverbs 20:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מֵ/יהוָ֥ה מִצְעֲדֵי גָ֑בֶר וְ֝/אָדָ֗ם מַה יָּבִ֥ין דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/024.yaml
  text: A man's steps are from Yahweh[b][a]; how then can a man understand his way?
translation:
  language: de
  text: Von Jahwe[a] kommen die Schritte eines Mannes[b]; wie kann ein Mensch da seinen Weg verstehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Von Jahwe“ bezeichnet Herkunft oder Ursprung: Die Schritte eines Menschen gehen von Jahwe aus. Der knappe hebräische Ausdruck kann dabei auch Gottes Lenkung oder Bestimmung einschließen.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische verwendet hier zunächst das Wort für „Mann“, danach das allgemeinere Wort für „Mensch“; die Aussage gilt repräsentativ für Menschen allgemein.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵ/יהוָה
  choice: Von Jahwe
  rationale: Die Präposition מִן bezeichnet hier Herkunft bzw. Ursprung. Die Voranstellung bleibt erhalten; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: מִצְעֲדֵי
  choice: die Schritte
  rationale: Das Substantiv bezeichnet Schritte bzw. Bewegungen und steht bildlich für den Lebensweg. „Schritte“ bewahrt dieses Bild in natürlichem Deutsch.
- source_word: גָבֶר
  choice: eines Mannes
  rationale: גֶּבֶר bezeichnet einen Mann, hier mit allgemeingültiger, repräsentativer Aussage. Die konkret maskuline Ausdrucksweise des Hebräischen bleibt erhalten.
- source_word: וְאָדָם
  choice: wie kann ein Mensch da
  rationale: אָדָם bezeichnet hier den Menschen allgemein. Das einleitende וְ wird im rhetorischen Zusammenhang durch „da“ wiedergegeben und verbindet die Frage folgernd mit der ersten Aussage.
- source_word: מַה יָּבִין
  choice: wie kann ... verstehen
  rationale: מַה bildet mit dem Verb eine rhetorische Frage, die die Begrenztheit menschlichen Verstehens ausdrückt. „Wie kann“ ist dafür im Deutschen idiomatisch.
- source_word: דַּרְכּוֹ
  choice: seinen Weg
  rationale: דֶּרֶךְ bezeichnet wörtlich und übertragen einen Weg. Die Wiedergabe bewahrt die Wegmetaphorik und den Bezug auf den Lebensverlauf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von göttlicher Bestimmung und menschlichem Verstehen
  choice: „Von Jahwe kommen“ als Herkunftsaussage
  alternative: „Jahwe lenkt/bestimmt“
  rationale: Die Formulierung wahrt die Aussage, dass die Schritte ihren Ursprung bei Jahwe haben, ohne die im knappen hebräischen Nominalsatz nicht ausdrücklich bezeichnete Art der Lenkung näher festzulegen.
- issue: Generisch gebrauchte Personenbezeichnungen גבר und אדם
  choice: „eines Mannes … ein Mensch“
  alternative: „eines Menschen … ein Mensch“
  rationale: Die Übersetzung erhält den Unterschied zwischen dem ausdrücklich männlichen גֶּבֶר und dem allgemeineren אָדָם. Zugleich erläutert die Fußnote die allgemeingültige Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Spruchform, die Wegmetaphorik und die rhetorische Spannung zwischen göttlichem Ursprung und begrenztem menschlichem Verstehen bleiben erhalten.
