  text: מְזָרֶ֣ה רְ֭שָׁעִים מֶ֣לֶךְ חָכָ֑ם וַ/יָּ֖שֶׁב עֲלֵי/הֶ֣ם אוֹפָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/026.yaml
  text: A wise king winnows the wicked and drives the wheel over them.
translation:
  language: de
  text: Ein weiser König worfelt die Bösen und lässt das Rad über sie rollen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְזָרֶה
  choice: worfelt
  rationale: Das Partizip bezeichnet das Worfeln bzw. Ausscheiden von Spreu und Korn und bewahrt hier das Bild entschlossener Aussonderung.
- source_word: רְשָׁעִים
  choice: die Bösen
  rationale: Die substantivierte Bezeichnung meint schuldige bzw. gottlose Menschen; „die Bösen“ ist im Deutschen klar und sprichworttauglich.
- source_word: מֶלֶךְ חָכָם
  choice: Ein weiser König
  rationale: Entspricht Wortstellung und Aussage des Hebräischen in natürlichem Deutsch.
- source_word: וַיָּשֶׁב
  choice: lässt … hinweggehen
  rationale: Das Hifil von שׁוב kann hier kausativ „zurück-/wieder führen“ beziehungsweise „darüber hinweggehen lassen“ bedeuten. Im Bild des Dreschens bezeichnet es das Führen des Rades über die Ausgesonderten.
- source_word: אוֹפָן
  choice: Dreschrad
  rationale: אוֹפָן bedeutet grundsätzlich „Rad“; der Kontext des Worfelns legt das Rad eines Dreschgeräts nahe. Das Kompositum macht das landwirtschaftliche Bild für heutige Leser verständlich.
theological_decisions:
- issue: Art und Schärfe des königlichen Gerichts
  choice: Das konkrete Bild von Worfeln und Dreschrad bleibt erhalten.
  alternative: 'Abstrakt: „Ein weiser König sondert die Bösen aus und bestraft sie streng.“'
  rationale: Der Vers beschreibt gerechtes königliches Vorgehen durch ein drastisches landwirtschaftliches Bild. Eine abstrakte Wiedergabe würde dessen Spannung und Härte abschwächen und zugleich die konkrete Strafart stärker festlegen, als der Bildspruch es tut.
translation_notes:
  register: Knapp, bildkräftig und würdevoll. „worfelt“ ist ein traditioneller, aber weiterhin verständlicher landwirtschaftlicher Ausdruck; „Dreschrad“ erschließt das zweite Bildelement ohne erläuternde Fußnote.
