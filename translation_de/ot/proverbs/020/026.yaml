review_pass:
  verdict: revise
  source_fidelity: Der erste Halbvers ist treffend wiedergegeben. Im zweiten Halbvers bezeichnet וַיָּשֶׁב im Bildzusammenhang das Herbeiführen bzw. Führen des Rades über die Betroffenen. „lässt ... hinweggehen“ bleibt dafür zu unverbindlich und gibt die Bewegung eines Rades nicht klar wieder. „Dreschrad“ ist als kontextuelle Konkretisierung möglich, doch das Hebräische sagt ausdrücklich nur „Rad“ (אוֹפָן).
  naturalness: „Ein weiser König worfelt die Bösen“ ist knapp und idiomatisch genug für den Spruchstil. „lässt das Rad über sie rollen“ ist im modernen Standarddeutsch bildhaft, verständlich und präziser als „lässt ... hinweggehen“.
  terminology: „Die Bösen“ kann רְשָׁעִים angemessen wiedergeben, ohne die Aussage konfessionell zu verengen. „Rad“ bewahrt die lexikalische Offenheit von אוֹפָן; der Dreschkontext wird durch das Gesamtbild aus Worfeln und Rad deutlich.
  issues:
  - severity: medium
    issue: Die Wiedergabe „lässt das Dreschrad über sie hinweggehen“ schwächt und verwischt die im Hebräischen dargestellte Bewegung des Rades.
    rationale: וַיָּשֶׁב und אוֹפָן bilden ein konkretes, hartes Bild des über die Bösen geführten/rollenden Rades. „rollen“ stellt diese Bildbewegung klar dar; „hinweggehen“ klingt für ein Rad unnatürlich.
  - severity: low
    issue: „Dreschrad“ legt die Funktion des Rades stärker fest als der hebräische Einzelbegriff.
    rationale: Der landwirtschaftliche Kontext stützt die Deutung, aber אוֹפָן bedeutet zunächst „Rad“. Die allgemeinere Wiedergabe erhält die sprachliche Offenheit des Ausgangstextes.
  revised_text: Ein weiser König worfelt die Bösen und lässt das Rad über sie rollen.
