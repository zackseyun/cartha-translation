source:
  edition: WLC
  text: לְֽקַח בִּ֭גְד/וֹ כִּי עָ֣רַב זָ֑ר וּ/בְעַ֖ד נכרים חַבְלֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/016.yaml
  text: Take his garment[a], for he has put up security for a stranger[b]; and hold him in pledge for foreigners.
translation:
  language: de
  text: Nimm ihm sein Gewand, denn er hat für einen Fremden gebürgt[a]; nimm von ihm ein Pfand, weil er für Fremde gebürgt hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „bürgen“ ist gemeint, für die Schuld oder Verpflichtung eines anderen einzustehen.
    reason: cultural_note
  - marker: b
    text: Die hebräische Formulierung ist knapp. Sie kann das bereits genannte Gewand als Sicherheit im Blick haben oder dazu auffordern, von dem Mann selbst ein Pfand zu nehmen.
    reason: alternative_reading
lexical_decisions:
- source_word: לְקַח
  choice: Nimm
  rationale: Der Qal-Imperativ fordert unmittelbar zum Nehmen auf. In Verbindung mit בִּגְדוֹ gibt „Nimm ihm sein Gewand“ den deutschen Dativ des Besitzers natürlich wieder.
- source_word: בִּגְדוֹ
  choice: sein Gewand
  rationale: בֶּגֶד bezeichnet allgemein ein Kleidungsstück; „Gewand“ wahrt diese Breite, ohne es unnötig auf Mantel oder Obergewand festzulegen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet die vorausgehende Aufforderung. „Denn“ entspricht dem kausalen Zusammenhang und dem knappen Spruchstil.
- source_word: עָרַב
  choice: hat … gebürgt
  rationale: Das Verb bezeichnet hier das Eintreten als Bürge für die Verpflichtung eines anderen. „Bürgen“ ist der klare, gegenwärtige deutsche Rechts- und Alltagsausdruck.
- source_word: זָר
  choice: für einen Fremden
  rationale: זָר bezeichnet hier einen außerhalb des vertrauten Kreises stehenden Menschen. „Fremder“ erhält diese soziale Distanz, ohne eine bestimmte ethnische Bedeutung festzuschreiben.
- source_word: וּבְעַד
  choice: weil … für
  rationale: בְּעַד kann das Handeln zugunsten oder um jemandes willen bezeichnen. Im Zusammenhang wird die erneute Begründung der Pfändung im Deutschen mit „weil er für … einstand“ verständlich ausgedrückt.
- source_word: נכרים
  choice: Fremde
  rationale: Die überlieferte Form im vorgelegten WLC-Text ist pluralisch und bezeichnet Außenstehende beziehungsweise Fremde. Die deutsche Wiedergabe bewahrt den Plural.
- source_word: חַבְלֵהוּ
  choice: pfände ihn
  rationale: Der Imperativ von חבל gehört hier in den Bereich von Pfand und Sicherheit; das maskuline Objektsuffix wird mit „ihn“ wiedergegeben. „Pfänden“ wahrt die knappe rechtlich-wirtschaftliche Bildsprache, während die Fußnote die mögliche sachliche Entfaltung nennt.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Spruchstil mit knappen Imperativen. „Pfände ihn“ bewahrt die Härte und Kürze des Hebräischen; die weniger wörtliche rechtliche Deutung steht in der Fußnote. Die beiden Ausdrücke für sozial Außenstehende werden im Deutschen beide mit „Fremder/Fremde“ wiedergegeben, da eine erzwungene Unterscheidung zwischen „Fremden“ und „Ausländern“ die Aussage ethnisch verengen könnte.
