- from: Nimm ihm sein Gewand, denn er hat für einen Fremden gebürgt[a]; pfände ihn, weil er für Fremde einstand.[b]
  to: Nimm ihm sein Gewand, denn er hat für einen Fremden gebürgt[a]; nimm von ihm ein Pfand, weil er für Fremde gebürgt hat.[b]
  rationale: Die Revision ersetzt die im modernen Deutsch missverständliche Formulierung „pfände ihn“ durch die idiomatische, im Kontext semantisch genaue Wiedergabe „nimm von ihm ein Pfand“. Die zweite Begründung wird mit „gebürgt hat“ explizit gemacht, um die hebräische Ellipse verständlich wiederzugeben. Die Fußnotenanker stehen nun unmittelbar bei den jeweils erläuterten Ausdrücken; Fußnote b beschreibt die verbleibende Kürze beziehungsweise Bezugsambiguität, ohne den Haupttext zu verdoppeln.
