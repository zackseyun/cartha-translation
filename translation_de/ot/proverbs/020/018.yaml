source:
  edition: WLC
  text: מַ֭חֲשָׁבוֹת בְּ/עֵצָ֣ה תִכּ֑וֹן וּ֝/בְ/תַחְבֻּל֗וֹת עֲשֵׂ֣ה מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/018.yaml
  text: Plans are established by counsel[a]; wage war with strategy.
translation:
  language: de
  text: Pläne werden durch Beratung gefestigt; führe Krieg mit kluger Strategie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit kluger Führung« oder »mit umsichtiger Planung«; das hebräische Wort kann sachkundige Lenkung bezeichnen und geht bildlich auf das Steuern zurück.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲשָׁבוֹת
  choice: Pläne
  rationale: Das Substantiv bezeichnet hier beabsichtigte Vorhaben, nicht bloß Gedanken. »Pläne« passt zum praktischen Zusammenhang und zur Kriegsführung im zweiten Halbvers.
- source_word: בְּעֵצָה
  choice: durch Beratung
  rationale: 'Die Präposition bezeichnet das Mittel: Pläne gewinnen durch eingeholten Rat festen Bestand. »Beratung« ist im modernen Deutsch natürlich und bewahrt den Weisheitscharakter.'
- source_word: תִכּוֹן
  choice: werden … gefestigt
  rationale: Das Nifal von כון bedeutet, fest gegründet oder beständig gemacht zu werden. Die deutsche Pluralform folgt idiomatisch dem pluralischen Subjekt.
- source_word: וּבְתַחְבֻּלוֹת
  choice: mit kluger Strategie
  rationale: תַּחְבֻּלוֹת bezeichnet sachkundige Lenkung beziehungsweise strategisches Vorgehen und trägt ursprünglich das Bild des Steuerns. Im ausdrücklich militärischen Zusammenhang gibt »Strategie« den Sinn prägnant wieder; »klug« macht den Aspekt der kundigen Lenkung sichtbar.
- source_word: עֲשֵׂה
  choice: führe
  rationale: עשה mit מִלְחָמָה ist eine feste Verbindung im Sinn von Krieg führen. Die idiomatische deutsche Wiedergabe lautet daher »führe Krieg«.
- source_word: מִלְחָמָה
  choice: Krieg
  rationale: Das Wort bezeichnet Krieg oder Kriegsführung allgemein; »Krieg« bewahrt die unmittelbare Kraft des hebräischen Ausdrucks.
theological_decisions: []
