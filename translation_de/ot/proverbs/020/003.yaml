  text: כָּב֣וֹד לָ֭/אִישׁ שֶׁ֣בֶת מֵ/רִ֑יב וְ/כָל אֱ֝וִ֗יל יִתְגַּלָּֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/003.yaml
  text: It is an honor for a man to keep away from strife[a], but every fool bursts out in quarrel.
translation:
  language: de
  text: Es ehrt einen Mann, sich aus Streit herauszuhalten; doch jeder Narr lässt sich auf einen Streit ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hier verwendete hebräische Verb ist selten und in seiner Bedeutung unsicher. Es kann auch heißen: „bricht in Streit aus“ oder, wörtlicher, etwa: „stellt sich herausfordernd zur Schau“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּבוֹד
  choice: Ehre / es ehrt
  rationale: Das Substantiv bezeichnet hier ehrenhaftes Ansehen. Die verbale deutsche Wendung „Es ehrt …“ gibt die prädikative Konstruktion natürlich und prägnant wieder.
- source_word: לָאִישׁ
  choice: einen Mann
  rationale: אִישׁ ist morphologisch maskulin Singular. „Einen Mann“ wahrt diese Form und lässt zugleich den für Sprüche typischen beispielhaften Sinn erkennen.
- source_word: שֶׁבֶת מֵרִיב
  choice: sich aus Streit herauszuhalten
  rationale: In der Verbindung mit מִן bezeichnet שֶׁבֶת hier das Unterlassen beziehungsweise Fernbleiben. „Sich … herauszuhalten“ ist im Deutschen idiomatisch und bildet zugleich den Gegensatz zum zweiten Halbvers.
- source_word: רִיב
  choice: Streit
  rationale: רִיב kann Streit, Auseinandersetzung oder Rechtsstreit bezeichnen. Der allgemeine Ausdruck „Streit“ passt zur sentenzhaften Aussage.
- source_word: אֱוִיל
  choice: Narr
  rationale: „Narr“ bewahrt den moralischen und charakterlichen Gehalt des weisheitlichen Gegenbegriffs, ohne ihn auf mangelnde Intelligenz zu reduzieren.
- source_word: יִתְגַּלָּע
  choice: lässt sich auf einen Streit ein
  rationale: Die seltene Hitpael-Form ist lexikalisch unsicher. Im Gegensatz zum Heraushalten aus Streit bezeichnet sie wahrscheinlich ein Sich-Einlassen oder Losbrechen in einer Auseinandersetzung. Die gewählte Formulierung ist zurückhaltend und idiomatisch; Alternativen werden in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Spruchsprache mit klarer antithetischer Struktur. „Es ehrt einen Mann“ ist natürliches Standarddeutsch; „Narr“ markiert den etablierten ethisch-weisheitlichen Typus.
