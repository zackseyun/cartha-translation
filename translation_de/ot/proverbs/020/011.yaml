  text: Even a youth makes himself known by his deeds[a], whether his work is pure and upright.
translation:
  language: de
  text: 'Selbst ein junger Mensch gibt sich durch seine Taten zu erkennen[a]: ob sein Handeln lauter und rechtschaffen ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Selbst ein junger Mensch wird an seinen Taten erkannt: ob sein Handeln lauter und rechtschaffen ist.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Schon
  rationale: „Schon“ gibt hier natürlich den hervorhebenden Gedanken wieder, dass selbst bei einem jungen Menschen der Charakter am Verhalten erkennbar wird.
- source_word: בְּמַעֲלָלָיו
  choice: durch seine Taten
  rationale: מַעֲלָל bezeichnet Handlungen oder Taten, häufig mit moralischer Färbung; die Präposition בְּ kennzeichnet hier das Mittel, an dem sich jemand zu erkennen gibt.
- source_word: יִתְנַכֶּר
  choice: gibt sich zu erkennen
  rationale: Die reflexive Form wird bewahrt und als Offenbarwerden des eigenen Charakters durch das Verhalten verstanden. Die ebenfalls mögliche passive Wiedergabe wird in der Fußnote genannt.
- source_word: נָעַר
  choice: ein junger Mensch
  rationale: נַעַר kann einen Jungen oder allgemein einen jungen Menschen bezeichnen. Die gewählte Form vermeidet eine unnötig enge Altersfestlegung und bleibt im modernen Deutsch allgemein verständlich.
- source_word: זַךְ
  choice: lauter
  rationale: זַךְ bedeutet rein, unverdorben oder unschuldig. „Lauter“ überträgt die moralische Qualität hier idiomatisch auf das Handeln.
- source_word: יָשָׁר
  choice: aufrichtig
  rationale: יָשָׁר bezeichnet Geradheit und moralische Rechtschaffenheit. „Aufrichtig“ bildet mit „lauter“ ein natürliches deutsches Begriffspaar.
- source_word: פָּעֳלוֹ
  choice: sein Handeln
  rationale: פֹּעַל kann Werk, Tat oder Tätigkeit bedeuten. „Handeln“ fasst hier die Lebensführung zusammen und vermeidet eine schwerfällige Wiederholung von „Taten“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die reflexive Aussage des hebräischen Verbs steht im Haupttext; die mögliche passive Deutung bleibt in der Fußnote erhalten. Der Doppelpunkt bildet den prüfenden Sinn der mit אִם … וְאִם eingeleiteten Schlusswendung ab.
