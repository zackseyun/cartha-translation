base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/001.yaml
  text: Wine is a mocker[a], strong drink a brawler, and whoever is led astray by it is not wise.
translation:
  language: de
  text: Der Wein ist ein Spötter, berauschendes Getränk ist laut; wer dadurch in die Irre geht, ist nicht weise.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵץ
  choice: Spötter
  rationale: Das Substantiv bezeichnet gewöhnlich einen Spötter. Als Prädikatsnomen zu »Wein« bewahrt es die anschauliche Personifikation des Hebräischen.
- source_word: הַיַּיִן
  choice: der Wein
  rationale: Die übliche Entsprechung für יין; der hebräische Artikel lässt sich in diesem deutschen Spruch natürlich wiedergeben.
- source_word: הֹמֶה
  choice: ein Lärmer
  rationale: Das Partizip bezeichnet jemanden oder etwas, das lärmt, tost oder ungestüm ist. »Ein Lärmer« wahrt parallel zu »Spötter« die Personifikation, ohne die Bedeutung unnötig auf körperliche Gewalt festzulegen.
- source_word: שֵׁכָר
  choice: berauschendes Getränk
  rationale: Der Ausdruck bezeichnet ein alkoholisches beziehungsweise berauschendes Getränk neben Wein. Diese Wiedergabe ist im heutigen Deutsch verständlich und vermeidet die mögliche moderne Verengung von »starkes Getränk« auf hohen Alkoholgehalt.
- source_word: שֹׁגֶה
  choice: sich irreführen lässt
  rationale: Das Verb bezeichnet das Irregehen oder Sich-Verirren. Im Zusammenhang beschreibt es, wie das Getränk einen Menschen praktisch und moralisch vom rechten Weg abbringt; die Formulierung bewahrt zugleich die bildhafte Wirkung des personifizierten Getränks.
- source_word: בּוֹ
  choice: davon
  rationale: Das singularische Suffix verweist auf das zuvor genannte berauschende Getränk beziehungsweise den Rauschtrank als zusammengefasste Größe. »Davon« ist natürliches Deutsch und wahrt den Bezug, ohne künstlich zwischen den beiden parallelen Getränkebezeichnungen zu entscheiden.
- source_word: לֹא יֶחְכָּם
  choice: ist nicht weise
  rationale: Das Imperfekt formuliert hier eine allgemeine, sprichwörtliche Wahrheit. »Ist nicht weise« gibt diese gnomenhafte Aussage knapp und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Struktur. Die parallele Personifikation wird durch »Spötter« und »Lärmer« bewahrt; das Semikolon macht die beiden parallelen Aussagen deutlich.
