    rationale: Das Wort ist im modernen Standarddeutsch ungebräuchlich und wirkt künstlich. Das hebräische Partizip bezeichnet Lärm bzw. ungestüme Bewegung; „ist laut“ gibt dies natürlich wieder, ohne eine nicht ausdrücklich vorliegende körperliche Gewalttätigkeit einzutragen.
  - severity: low
    issue: „sich davon irreführen lässt“ für שֹׁגֶה בּוֹ
    rationale: Die Wendung deutet stärker auf ein passives Irreführen durch einen Akteur. Das Verb bezeichnet zunächst Irregehen bzw. in die Irre gehen. Eine direktere Formulierung bewahrt die Ambiguität besser.
  - severity: low
