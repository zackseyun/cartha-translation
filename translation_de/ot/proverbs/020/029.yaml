  text: תִּפְאֶ֣רֶת בַּחוּרִ֣ים כֹּחָ֑/ם וַ/הֲדַ֖ר זְקֵנִ֣ים שֵׂיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/029.yaml
  text: The glory of young men is their strength[a], and the splendor of old men is gray hair.
translation:
  language: de
  text: Die Zierde junger Männer ist ihre Kraft[a], und die Würde alter Männer ist graues Haar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Schönheit junger Männer ist ihre Kraft, und die Ehre alter Männer ist graues Haar.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְאֶרֶת
  choice: Ruhm
  rationale: Das Substantiv bezeichnet Schönheit, Ehre oder etwas, worauf man stolz sein kann. „Ruhm“ gibt hier die ehrenvolle Auszeichnung wieder und bildet einen passenden poetischen Gegenpol zu „Zierde“.
- source_word: בַּחוּרִים
  choice: junge Männer
  rationale: Der Ausdruck bezeichnet ausdrücklich junge männliche Personen. „Junge Männer“ ist im heutigen Deutsch klar, natürlich und geschlechtsgenau.
- source_word: כֹּחָם
  choice: ihre Kraft
  rationale: כֹּחַ bezeichnet Kraft, Stärke oder Macht; im Kontext ist die körperliche Lebenskraft der Jugend gemeint. „Kraft“ ist unmittelbar und idiomatisch.
- source_word: הֲדַר
  choice: Zierde
  rationale: Das Wort umfasst Pracht, Ehre, Würde und schmückende Schönheit. „Zierde“ passt zur konkreten Erscheinung des grauen Haares und bewahrt die positive Wertung des Alters.
- source_word: זְקֵנִים
  choice: alte Männer
  rationale: Der Parallelismus stellt Altersgruppen gegenüber, nicht Amtsträger. Daher ist „alte Männer“ genauer als „Älteste“.
- source_word: שֵׂיבָה
  choice: graues Haar
  rationale: Das Substantiv bezeichnet graues Haar beziehungsweise das dadurch sichtbar gewordene Alter. Die Wiedergabe erhält das konkrete Bild des hebräischen Spruchs.
theological_decisions: []
translation_notes:
  register: Knappes, gehobenes und zugleich allgemein verständliches Sprichwortdeutsch. Der parallele Satzbau und die geschlechtsspezifische Gegenüberstellung des Hebräischen bleiben erhalten; die mehrdeutigen Wertbegriffe תִּפְאֶרֶת und הֲדַר werden in der Fußnote durch eine alternative Wiedergabe sichtbar gemacht.
