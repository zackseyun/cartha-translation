source:
  edition: WLC
  text: אֹ֣זֶן שֹׁ֭מַעַת וְ/עַ֣יִן רֹאָ֑ה יְ֝הוָ֗ה עָשָׂ֥ה גַם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/012.yaml
  text: The hearing ear and the seeing eye—Yahweh made both of them[a].
translation:
  language: de
  text: Das hörende Ohr und das sehende Auge – Jahwe hat sie beide gemacht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Ohr, das hört, und das Auge, das sieht – Jahwe hat sie beide gemacht.«'
    reason: Lexikalisch-syntaktische Alternative für die attributiven Partizipien שֹׁמַעַת und רֹאָה.
lexical_decisions:
- source_word: אֹזֶן שֹׁמַעַת
  choice: das hörende Ohr
  rationale: Das Partizip שֹׁמַעַת beschreibt das Ohr attributiv. Die knappe Form wahrt den Parallelismus und die konkrete Aussage des Hebräischen.
- source_word: עַיִן רֹאָה
  choice: das sehende Auge
  rationale: Die parallele Partizipialkonstruktion wird ebenso attributiv wiedergegeben; dadurch bleiben Aufbau und poetische Ausgewogenheit des Spruchs erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird in seiner im Deutschen üblichen Form wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: עָשָׂה
  choice: hat … gemacht
  rationale: Das Qal Perfekt bezeichnet hier Gottes vollzogene Schöpfertätigkeit. »Gemacht« gibt das allgemeine Verb direkt wieder, ohne es enger als »erschaffen« auszulegen.
- source_word: גַם שְׁנֵיהֶם
  choice: sie beide
  rationale: Die Verbindung betont, dass beide genannten Organe von Jahwe gemacht wurden. »Sie beide« ist eine natürliche deutsche Wiedergabe von גַם mit »die zwei von ihnen«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Vers verwendet den Eigennamen Gottes. »Jahwe« bewahrt diesen Namenscharakter, während »der HERR« ihn durch einen Titel ersetzen würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die substantivischen Singularformen und der symmetrische Parallelismus des hebräischen Spruchs bleiben erhalten; der Gedankenstrich markiert die abschließende Aussage über Jahwe.
