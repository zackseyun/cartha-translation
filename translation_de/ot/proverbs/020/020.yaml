  text: מְ֭קַלֵּל אָבִ֣י/ו וְ/אִמּ֑/וֹ יִֽדְעַ֥ךְ נֵ֝ר֗/וֹ ב/אישון חֹֽשֶׁךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/020.yaml
  text: Whoever curses his father or his mother—his lamp will be put out in deepest darkness[a][b].
translation:
  language: de
  text: Wer seinen Vater und seine Mutter verflucht – dessen Lampe wird in tiefster Finsternis erlöschen[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in der Pupille der Finsternis“; eine hebräische Wendung für tiefste oder schwärzeste Dunkelheit.'
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „dessen Lampe wird in völliger Finsternis ausgelöscht.“ Die Lampe kann bildlich für das Leben, das Wohlergehen oder die Zukunft eines Menschen stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקַלֵּל
  choice: Wer … flucht
  rationale: Das substantivisch gebrauchte Partizip formuliert einen allgemeinen Fall. „Jemandem fluchen“ bewahrt den Sinn einer gegen die Eltern gerichteten Verfluchung und klingt im modernen Deutschen natürlich.
- source_word: אָבִיו וְאִמּוֹ
  choice: seinem Vater oder seiner Mutter
  rationale: 'Obwohl וְ formal „und“ bedeutet, bezeichnet die Paarformel hier idiomatisch jeden der beiden Elternteile: Schon das Verfluchen des Vaters oder der Mutter fällt unter den Spruch. Die Einzelbezeichnungen bleiben gegenüber dem zusammenfassenden „Eltern“ erhalten.'
- source_word: יִדְעַךְ
  choice: erlischt
  rationale: Das Verb bezeichnet das Erlöschen eines Lichtes oder einer Lampe. Das intransitive „erlischt“ wahrt, dass kein handelnder Urheber genannt wird, und erhält die knappe Bildsprache.
- source_word: נֵרוֹ
  choice: dessen Lampe
  rationale: נֵר bedeutet konkret „Lampe“. Das Bild wird nicht vorschnell als Leben, Wohlergehen oder Zukunft ausgedeutet. Das Relativpronomen „dessen“ stellt im Deutschen den eindeutigen Rückbezug her.
- source_word: בְאִישׁוֹן חֹשֶׁךְ
  choice: in tiefster Finsternis
  rationale: Die wörtliche Wendung „in der Pupille der Finsternis“ ist ein hebräisches Bild für besonders tiefe oder schwarze Dunkelheit. „Tiefste Finsternis“ gibt diese verstärkende Bedeutung würdig und verständlich wieder.
theological_decisions:
- issue: Bedeutung der erlöschenden Lampe
  choice: Das Bild bleibt im Haupttext unausgelegt.
  alternative: Die Lampe ausdrücklich mit Leben, Wohlergehen, Nachkommenschaft oder Zukunft gleichsetzen.
  rationale: Der Vers nennt die Lampe, erklärt ihre symbolische Reichweite jedoch nicht. Eine konkrete Festlegung würde die genuine Mehrdeutigkeit der Weisheitsmetapher unnötig verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Spruchform. Der Gedankenstrich markiert die Folge, ohne dem Hebräischen eine ausdrücklich kausale Verknüpfung hinzuzufügen.
