base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/002.yaml
  text: The terror of a king is like the growling of a young lion[c][b][a]; whoever provokes him to anger sins against his own life.
translation:
  language: de
  text: Der Schrecken eines Königs gleicht dem Knurren eines jungen Löwen.[a] Wer ihn zum Zorn reizt,[b] versündigt sich an seinem eigenen Leben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Brüllen eines jungen Löwen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „wer ihn erzürnt“; gemeint ist, den Zorn des Königs zu erregen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „versündigt sich an sich selbst“ beziehungsweise „an seiner eigenen Seele“. Das hebräische Wort nefesch kann je nach Zusammenhang „Leben“, „Selbst“ oder „Seele“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַהַם
  choice: Knurren
  rationale: Das Substantiv bezeichnet den bedrohlichen Laut eines Löwen. „Knurren“ gibt die warnende Wirkung natürlich wieder; „Brüllen“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: כְּפִיר
  choice: junger Löwe
  rationale: Das hebräische Wort bezeichnet gewöhnlich einen jungen, kräftigen Löwen und ist genauer als das allgemeine „Löwe“.
- source_word: אֵימַת מֶלֶךְ
  choice: der Schrecken eines Königs
  rationale: Die Genitivverbindung bezeichnet hier am ehesten den Schrecken, den ein König hervorruft. Die knappe Formulierung bewahrt zugleich die Ausdrucksweise des Hebräischen.
- source_word: מִתְעַבְּרוֹ
  choice: wer ihn zum Zorn reizt
  rationale: Die Form beschreibt im Zusammenhang das Hervorrufen beziehungsweise Erregen des königlichen Zorns. Die Wiedergabe ist im Deutschen klar, ohne das Bild unnötig auszubauen.
- source_word: חוֹטֵא
  choice: versündigt sich
  rationale: Die moralische Aussage des Verbs חטא bleibt erhalten; eine bloß pragmatische Wiedergabe wie „gefährdet“ oder „verwirkt“ wäre schwächer.
- source_word: נַפְשׁוֹ
  choice: an seinem eigenen Leben
  rationale: נפש kann „Leben“, „Selbst“ oder „Seele“ bezeichnen. Im Kontext der Gefahr durch königlichen Zorn steht wahrscheinlich das eigene Leben im Vordergrund; „eigenen“ bewahrt den reflexiven Nachdruck.
theological_decisions:
- issue: Moralische oder nur pragmatische Tragweite von חוֹטֵא נַפְשׁוֹ
  choice: „versündigt sich an seinem eigenen Leben“
  alternative: „gefährdet/verwirkt sein Leben“
  rationale: Die gewählte Formulierung bewahrt sowohl das moralische Verb „sündigen“ als auch die selbstschädigende Folge, ohne den Spruch auf bloße Klugheit oder auf eine Aussage über die unsterbliche Seele festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus bleibt knapp und sprichwortartig; „zum Zorn reizen“ und „sich an seinem eigenen Leben versündigen“ sind verständlich, ohne die moralische Spannung des hebräischen Textes abzuschwächen.
