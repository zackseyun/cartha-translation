source:
  edition: WLC
  text: מַ֣יִם עֲ֭מֻקִּים עֵצָ֣ה בְ/לֶב אִ֑ישׁ וְ/אִ֖ישׁ תְּבוּנָ֣ה יִדְלֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/005.yaml
  text: Counsel in a man's heart is like deep water[b][a], but a man of understanding draws it out.
translation:
  language: de
  text: Ein Ratschluss im Herzen eines Menschen[b] ist wie tiefes Wasser[a]; doch ein verständiger Mensch schöpft ihn heraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: tiefe Wasser.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht hier und im zweiten Satzteil jeweils „Mann“; die männliche Form wird in diesem Sprichwort stellvertretend für Menschen gebraucht.
    reason: cultural_note
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  choice: tiefes Wasser
  rationale: Die hebräische Wendung steht im Plural („tiefe Wasser“). Im Deutschen bewahrt der kollektive Singular „tiefes Wasser“ das Bild verborgener, schwer erreichbarer Tiefe und klingt in diesem Vergleich natürlich; die wörtliche Pluralform wird in einer Fußnote genannt.
- source_word: עֵצָה
  choice: Plan
  rationale: עֵצָה kann Rat, Plan, Vorhaben oder Absicht bezeichnen. Da sie hier im Herzen eines Menschen verborgen liegt und herausgeschöpft wird, gibt „Plan“ die innere Überlegung beziehungsweise Absicht klar und natürlich wieder, ohne sie auf erteilten Rat einzuengen.
- source_word: בְלֶב אִישׁ
  choice: im Herzen eines Menschen
  rationale: לֵב bezeichnet im Hebräischen häufig das innere Denken, Wollen und Erwägen, nicht nur Gefühle. „Herz“ erhält das biblische Bild; „Mensch“ gibt das sprichwörtlich-repräsentative אִישׁ im heutigen Deutschen angemessen wieder.
- source_word: וְאִישׁ תְּבוּנָה
  choice: doch ein verständiger Mensch
  rationale: 'תְּבוּנָה bezeichnet Verständnis, Einsicht und Urteilsvermögen. Das adversative „doch“ macht den sachlichen Gegensatz deutlich: Der Plan liegt tief verborgen, ein verständiger Mensch vermag ihn jedoch hervorzuholen.'
- source_word: יִדְלֶנָּה
  choice: schöpft ihn heraus
  rationale: Das Verb דלה bezeichnet das Heraufholen beziehungsweise Schöpfen, etwa von Wasser aus einem Brunnen. „Schöpft ihn heraus“ erhält das Wasserbild und bezeichnet zugleich das Ergründen einer verborgenen Absicht. Das Präsens entspricht dem allgemeinen Charakter eines Sprichworts.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem sprichwörtlichem Ton. Der Vergleich mit tiefem Wasser und das dazugehörige Verb „schöpfen“ bleiben als zusammenhängendes Bild erhalten. „Plan“ vermeidet die im heutigen Deutschen naheliegende Verengung von „Rat“ auf einen Ratschlag, den jemand einem anderen erteilt.
