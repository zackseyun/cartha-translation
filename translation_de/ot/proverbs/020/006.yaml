  yaml_path: translation/ot/proverbs/020/006.yaml
  text: Many a man proclaims his own loyalty[b][a], but who can find a faithful man?
translation:
  language: de
  text: Viele Menschen rühmen ihre eigene Güte[a]; doch wer findet einen zuverlässigen Menschen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Viele Menschen verkünden ihre eigene Loyalität.“ Das hebräische Wort kann „Güte“, „Loyalität“ oder „beständige Liebe“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen treuen Menschen“. Das hebräische Wort bezeichnet Treue, Zuverlässigkeit oder Vertrauenswürdigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָב אָדָם
  choice: Viele Menschen
  rationale: Die Verbindung aus רָב und אָדָם bezeichnet distributiv eine große Zahl von Menschen. Die Formulierung ist im modernen Deutschen natürlich und bewahrt den allgemeinmenschlichen Sinn.
- source_word: יִקְרָא
  choice: rühmen sich
  rationale: קרא bedeutet grundsätzlich „rufen/ausrufen“. Im Zusammenhang mit der eigenen Tugend bezeichnet es ein öffentliches Geltendmachen; „sich rühmen“ gibt den Gedanken der Selbstdarstellung idiomatisch wieder.
- source_word: אִישׁ חַסְדּוֹ
  choice: ihrer Güte
  rationale: חֶסֶד kann Güte, loyale Verbundenheit oder beständige Liebe bezeichnen. Hier geht es um eine Tugend, die jemand für sich selbst beansprucht. „Güte“ ist knapp und natürlich; die mögliche Bedeutung „Loyalität“ wird in der Fußnote bewahrt.
- source_word: וְאִישׁ אֱמוּנִים
  choice: einen Menschen, auf den Verlass ist
  rationale: אֱמוּנִים bezeichnet Treue, Zuverlässigkeit oder Vertrauenswürdigkeit. Die deutsche Wendung ist verständlich und gibt die praktische Zuverlässigkeit wieder, ohne die Aussage auf religiösen Glauben einzuengen.
- source_word: מִי יִמְצָא
  choice: wer findet
  rationale: Die rhetorische Frage hebt die Seltenheit eines wirklich zuverlässigen Menschen hervor. Das schlichte Präsens entspricht dem sprichwörtlichen Stil.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Spruchstil. Der Parallelismus stellt selbst behauptete Güte der seltenen, tatsächlich bewährten Zuverlässigkeit gegenüber. Die generische Aussage wird mit „Menschen“ wiedergegeben; die Fußnoten erhalten die wesentlichen Bedeutungsalternativen.
