source:
  edition: WLC
  text: אֶ֣בֶן וָ֭/אֶבֶן אֵיפָ֣ה וְ/אֵיפָ֑ה תּוֹעֲבַ֥ת יְ֝הוָ֗ה גַּם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/010.yaml
  text: A differing weight and a differing measure—both of them are an abomination to Yahweh[a].
translation:
  language: de
  text: Zweierlei Gewichte und zweierlei Hohlmaße – beides ist Jahwe ein Gräuel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Stein und Stein, Efa und Efa“. Gemeint sind voneinander abweichende Gewichtssteine und Hohlmaße, die beim Handel unredlich eingesetzt werden.'
    reason: Die Fußnote dokumentiert die konkrete hebräische Ausdrucksweise und erläutert den idiomatischen Handelssinn.
lexical_decisions:
- source_word: אֶבֶן וָאֶבֶן
  choice: zweierlei Gewichte
  rationale: אֶבֶן bedeutet wörtlich „Stein“, bezeichnet im Handelszusammenhang aber einen Gewichtsstein. Die Wiederholung meint zwei voneinander abweichende Standards; „zweierlei Gewichte“ gibt diesen idiomatischen Sinn knapp und verständlich wieder.
- source_word: אֵיפָה וְאֵיפָה
  choice: zweierlei Hohlmaße
  rationale: Das Efa ist ein Hohlmaß, besonders für trockene Waren. Die Wiederholung weist auf unterschiedliche Messstandards hin. „Hohlmaße“ erhält die Art des Maßes, ohne die ethische Aussage durch eine heute wenig bekannte Maßeinheit zu verdunkeln.
- source_word: תּוֹעֲבַת
  choice: ein Gräuel
  rationale: „Gräuel“ bewahrt die starke moralische Missbilligung des hebräischen Ausdrucks und ist in modernem, gehobenem Standarddeutsch weiterhin verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: גַּם שְׁנֵיהֶם
  choice: beides
  rationale: Das Wort fasst beide genannten Formen unredlicher Bemessung zusammen und betont, dass beide Jahwe verabscheuungswürdig sind.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Wiedergabe „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Explizite Benennung betrügerischer Absicht
  choice: Die Unehrlichkeit wird durch „zweierlei“ angedeutet, aber nicht zusätzlich im Haupttext ausgesprochen.
  alternative: falsche Gewichte und falsche Maße
  rationale: Die parallele Wiederholung bezeichnet im Handelskontext voneinander abweichende Standards und impliziert Betrug. Da das Hebräische jedoch kein ausdrückliches Wort für „falsch“ oder „betrügerisch“ enthält, bleibt diese Folgerung in der Fußnote erläutert.
translation_notes:
  register: Knappe, sprichwortartige und würdige Formulierung in modernem Standarddeutsch. „Zweierlei“ erhält die Parallelität des Hebräischen; „Hohlmaße“ ist genauer als das allgemeinere „Maße“. Der Gedankenstrich bildet die pointierte Schlusswertung ab.
