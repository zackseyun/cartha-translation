  source_fidelity: 'Die Übersetzung gibt die Abfolge und Bildsprache des Hebräischen präzise wieder: Das „Brot der Lüge“ ist zunächst süß/angenehm, danach wird der Mund mit Kies gefüllt. „Doch hinterher“ bildet die durch וְאַחַר markierte, kontrastierende Folge natürlich ab. Die passive Zukunftsform bei יִמָּלֵא ist angemessen.'
