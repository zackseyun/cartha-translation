  text: עָרֵ֣ב לָ֭/אִישׁ לֶ֣חֶם שָׁ֑קֶר וְ֝/אַחַ֗ר יִמָּֽלֵא פִ֥י/הוּ חָצָֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/017.yaml
  text: Bread of deceit is sweet to a man[b][a], but afterward his mouth is filled with gravel.
translation:
  language: de
  text: Brot der Lüge[a] schmeckt einem Mann süß, doch hinterher wird sein Mund mit Kies gefüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brot der Falschheit“; gemeint sein kann Brot beziehungsweise Lebensunterhalt, der durch Lüge oder Betrug erlangt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵב
  choice: schmeckt … süß
  rationale: Das Wort bezeichnet etwas Angenehmes oder Süßes. Zusammen mit „Brot“ bewahrt „schmeckt … süß“ das anschauliche Geschmacksbild und den ironischen Gegensatz zum Kies.
- source_word: לָאִישׁ
  choice: einem Mann
  rationale: Die hebräische Form ist ein maskuliner Singular. Die konkrete Formulierung wird beibehalten, ohne ihre sprichwörtliche Anwendbarkeit einzuschränken.
- source_word: לֶחֶם שָׁקֶר
  choice: Brot der Lüge
  rationale: Die knappe hebräische Verbindung wird formal und bildhaft wiedergegeben. Sie kann Brot bezeichnen, das mit Lüge oder Betrug zusammenhängt, insbesondere dadurch erlangten Lebensunterhalt; die Fußnote hält diese Bedeutungsweite offen.
- source_word: וְאַחַר
  choice: doch hinterher
  rationale: „Hinterher“ gibt die zeitliche Folge wieder; „doch“ macht den im Spruch angelegten scharfen Gegensatz natürlich deutlich.
- source_word: יִמָּלֵא
  choice: wird … gefüllt
  rationale: Das Niphal-Imperfekt wird resultativ und zukünftig wiedergegeben und bewahrt dabei die passive Form des Hebräischen.
- source_word: פִיהוּ
  choice: sein Mund
  rationale: Die konkrete Körpermetapher ist für die sinnliche Wirkung und die Verbindung der beiden Vershälften wesentlich.
- source_word: חָצָץ
  choice: Kies
  rationale: Das Substantiv bezeichnet kleine Steine beziehungsweise Kies. „Kies“ vermittelt knapp und drastisch die schmerzhafte Umkehr des zunächst süßen Brotes.
theological_decisions: []
translation_notes:
  register: Knappe, bildhafte Spruchsprache in modernem Standarddeutsch. Die ungewöhnliche, aber verständliche Wendung „Brot der Lüge“ bewahrt die Offenheit und Prägnanz des hebräischen Ausdrucks; die Fußnote erläutert die naheliegende idiomatische Deutung.
