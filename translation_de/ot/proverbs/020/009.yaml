  text: Who can say[a], “I have made my heart pure; I am clean from my sin” ?
translation:
  language: de
  text: 'Wer kann sagen[a]: »Ich habe mein Herz gereinigt; ich bin rein von meiner Sünde«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit stärkerer Betonung der Selbstreinigung: »Wer sagt: ›Ich habe mein Herz gereinigt; ich habe mich von meiner Sünde gereinigt‹?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יֹאמַר
  choice: Wer kann sagen
  rationale: מִי bedeutet »wer«, und יֹאמַר ist die übliche Form von »sagen«. Das ergänzte »kann« gibt im modernen Deutschen die rhetorische Kraft der Frage natürlich wieder, ohne den erwarteten verneinenden Sinn ausdrücklich vorwegzunehmen.
- source_word: זִכִּיתִי
  choice: ich habe … rein gemacht
  rationale: Die Piel-Form von זכה bezeichnet hier das Reinmachen beziehungsweise Reinhalten. Die Wiedergabe bewahrt den aktiven, auf das Herz gerichteten Sinn.
- source_word: לִבִּי
  choice: mein Herz
  rationale: »Herz« bewahrt die biblische Bezeichnung für das innere moralische und willentliche Zentrum des Menschen; eine Verengung auf »Verstand« oder »Gefühl« wird vermieden.
- source_word: טָהַרְתִּי
  choice: ich bin rein
  rationale: Die Form bezeichnet das Reinsein beziehungsweise Reinwerden. Die Zustandsaussage »ich bin rein« ist im Deutschen knapp und entspricht dem Parallelismus, ohne eine nicht ausdrücklich markierte reflexive Handlung einzutragen.
- source_word: מֵחַטָּאתִי
  choice: von meiner Sünde
  rationale: חַטָּאת bezeichnet hier die eigene Sünde; מִן drückt Trennung oder Freiheit davon aus. Die bewusst knappe Wendung hält die enge Verbindung zum hebräischen Wortlaut fest.
theological_decisions:
- issue: Anspruch auf innere Reinheit und Freiheit von Sünde
  choice: Die Frage wird als rhetorische Frage wiedergegeben, die einen umfassenden Anspruch auf ein reines Herz und Reinheit von der eigenen Sünde zur Prüfung stellt.
  alternative: Die Frage könnte lediglich als offene Beobachtung über seltene moralische Lauterkeit verstanden werden.
  rationale: Der Parallelismus formuliert einen weitreichenden Reinheitsanspruch. »Wer kann sagen« lässt die erwartete Antwort erkennen, fügt aber keine über den Text hinausgehende dogmatische Aussage hinzu.
- issue: Eigenes Reinmachen und erreichter Reinheitszustand
  choice: Die erste Zeile bewahrt die aktive Aussage über das Reinmachen des Herzens, die zweite den behaupteten Zustand des Reinseins.
  alternative: Beide Verben könnten vereinheitlichend als reflexive Selbstreinigung wiedergegeben werden.
  rationale: Die unterschiedliche verbale Gestalt der beiden Aussagen soll erkennbar bleiben; dadurch wird die Spannung zwischen eigenem Handeln und behauptetem Zustand nicht eingeebnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt knapp; »Herz«, »rein« und »Sünde« bewahren die zentrale Bild- und Begriffssprache des hebräischen Textes. Das Fußnotenzeichen [a] steht unmittelbar bei der fraglichen idiomatischen Erweiterung »kann«.
