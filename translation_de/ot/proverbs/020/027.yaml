source:
  edition: WLC
  text: נֵ֣ר יְ֭הוָה נִשְׁמַ֣ת אָדָ֑ם חֹ֝פֵ֗שׂ כָּל חַדְרֵי בָֽטֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/027.yaml
  text: The spirit of man is the lamp of Yahweh[b][a], searching all the innermost chambers of the belly.
translation:
  language: de
  text: Der Geist des Menschen ist Jahwes Lampe[a]; sie durchforscht alle Kammern des Bauches[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Atem des Menschen ist Jahwes Lampe.“'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „alle Kammern des Bauches“; gemeint sind die verborgensten Bereiche im Inneren eines Menschen.
    reason: cultural_note
lexical_decisions:
- source_word: נֵר
  choice: Leuchte
  rationale: נֵר bezeichnet konkret eine Lampe bzw. Leuchte. „Leuchte“ bewahrt das Bild des Erhellens und Aufdeckens und fügt sich im Deutschen natürlich in die prädikative Metapher ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: נִשְׁמַת
  choice: Geist
  rationale: נְשָׁמָה kann „Atem“, „Lebenshauch“ oder „Geist“ bedeuten. „Geist“ gibt hier die innere, belebende Dimension des Menschen wieder, ohne den Ausdruck enger als „Gewissen“ zu deuten; „Atem“ bleibt als echte lexikalische Alternative in der Fußnote erhalten.
- source_word: אָדָם
  choice: des Menschen
  rationale: אָדָם ist hier generisch und singularisch. „Des Menschen“ bewahrt den repräsentativen Singular und ist im modernen Deutschen geschlechtsübergreifend verständlich.
- source_word: חֹפֵשׂ
  choice: durchforscht
  rationale: Das Partizip bezeichnet ein fortdauerndes, gründliches Suchen oder Prüfen. „Durchforscht“ verbindet die prüfende Bewegung mit dem Bild einer Leuchte, die Verborgenes aufdeckt.
- source_word: כָּל
  choice: alle
  rationale: „Alle“ gibt den umfassenden Geltungsbereich unmittelbar wieder.
- source_word: חַדְרֵי
  choice: Kammern
  rationale: Das Wort bezeichnet Räume oder Kammern. Die konkrete räumliche Metapher bleibt erhalten, statt sie im Haupttext vollständig durch eine abstrakte Deutung zu ersetzen.
- source_word: בָטֶן
  choice: des Leibes
  rationale: בֶּטֶן bezeichnet wörtlich Bauch, Leib oder Körperinneres und steht hier idiomatisch für das tiefste Innere eines Menschen. „Leib“ bewahrt das körperliche Bild in würdiger, verständlicher Sprache; die idiomatische Bedeutung wird in einer Fußnote erläutert.
theological_decisions:
- issue: Anthropologische Bedeutung von נִשְׁמַת אָדָם
  choice: Der menschliche Geist bzw. Lebenshauch ist Jahwes Leuchte, durch die das verborgene Innere erforscht wird.
  alternative: Der Atem eines Menschen ist Jahwes Leuchte; oder der Ausdruck wird spezifisch als Gewissen verstanden.
  rationale: Der hebräische Ausdruck lässt „Atem/Lebenshauch“ und „Geist“ zu, nennt aber das Gewissen nicht ausdrücklich. Der Haupttext wahrt die weitere anthropologische Aussage, während die Fußnote die konkrete Alternative „Atem“ sichtbar hält.
- issue: Bezug des Partizips חֹפֵשׂ
  choice: Das Durchforschen wird von der als Leuchte beschriebenen menschlichen Geistkraft ausgesagt.
  alternative: Jahwe selbst wird als unausgesprochenes Subjekt des Durchforschens verstanden.
  rationale: Das maskuline Partizip kann grammatisch an נֵר („Leuchte/Lampe“) anknüpfen. Die deutsche Formulierung mit „sie“ greift daher die Leuchte auf, ohne eine zusätzliche Aussage über das Gewissen einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache von Leuchte und inneren Kammern bleibt erhalten; ungebräuchliche Wörtlichkeit wird nur dort geglättet, wo „Bauch“ im Haupttext missverständlich oder unnötig grob wirken könnte.
