  text: מֶ֗לֶךְ יוֹשֵׁ֥ב עַל כִּסֵּא דִ֑ין מְזָרֶ֖ה בְ/עֵינָ֣י/ו כָּל רָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/008.yaml
  text: A king sitting on a throne of judgment winnows all evil with his eyes[a][b].
translation:
  language: de
  text: Ein König, der auf dem Thron des Gerichts sitzt, sondert mit seinen Augen alles Böse aus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „worfelt“. Das hebräische Verb beschreibt das Trennen von Korn und Spreu und kann hier auch mit „zerstreut“ oder „siebt aus“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jeden Bösen“. Der hebräische Ausdruck kann allgemein das Böse oder, dem Zusammenhang nach, Menschen bezeichnen, die Böses tun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: Ein König
  rationale: Die artikellose Form bezeichnet hier generisch einen König und nicht einen bestimmten Herrscher.
- source_word: יוֹשֵׁב
  choice: der … sitzt
  rationale: Das Partizip beschreibt eine anhaltende beziehungsweise charakteristische Haltung und bewahrt das anschauliche Bild.
- source_word: עַל כִּסֵּא דִין
  choice: auf dem Thron des Gerichts
  rationale: „Thron“ erhält den königlichen Rahmen; „des Gerichts“ gibt die richterliche Funktion von דִין wieder.
- source_word: מְזָרֶה
  choice: sondert … aus
  rationale: Das Verb bezeichnet ursprünglich das Worfeln, bei dem Brauchbares und Wertloses voneinander getrennt werden. „Aussondern“ überträgt dieses Bild verständlich auf das richterliche Erkennen und Entfernen des Bösen.
- source_word: בְעֵינָיו
  choice: mit seinen Augen
  rationale: 'Die instrumentale Wendung bleibt nah am hebräischen Bild: Der prüfende Blick des Königs deckt das Böse auf und scheidet es aus.'
- source_word: כָּל רָע
  choice: alles Böse
  rationale: רָע kann abstrakt das Böse oder kontextuell böse Menschen bezeichnen. „Alles Böse“ bewahrt zunächst die größere Bedeutungsbreite.
theological_decisions:
- issue: Bezug von כָּל רָע
  choice: alles Böse
  alternative: jeden Bösen / alle Übeltäter
  rationale: Der hebräische Ausdruck lässt offen, ob das Böse allgemein oder konkret böse Menschen gemeint sind. Der Haupttext wahrt diese Offenheit; die Fußnote nennt die personenbezogene Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sondert … aus“ hält die landwirtschaftliche Trennmetapher verständlich präsent; die genauere Bildform „worfelt“ steht in der Fußnote. Die ungewöhnlich konkrete Wendung „mit seinen Augen“ wurde bewusst beibehalten.
