  text: נַ֭חֲלָה מבחלת בָּ/רִאשֹׁנָ֑ה וְ֝/אַחֲרִיתָ֗/הּ לֹ֣א תְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/021.yaml
  text: An inheritance gained hastily at first will not be blessed in the end[a].
translation:
  language: de
  text: Ein Erbe, das anfangs übereilt erworben wird,[a] ist am Ende nicht gesegnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das gleich zu Beginn schnell erworben wird“. Das zugrunde liegende hebräische Wort kann Schnelligkeit, verfrühten Erwerb oder gierige Hast betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה
  choice: Erbe
  rationale: Das Substantiv bezeichnet ererbten Besitz oder ein Erbteil. „Erbe“ ist im Deutschen die natürliche und sachlich passende Wiedergabe.
- source_word: מבחלת
  choice: übereilt erworben
  rationale: Die schwierige Form wird gewöhnlich im Sinn eines hastigen, verfrühten oder von Gier geprägten Erwerbs verstanden. „Übereilt erworben“ wahrt den negativen Unterton, ohne die genaue Art des Fehlverhaltens festzulegen.
- source_word: בָּרִאשֹׁנָה
  choice: anfangs
  rationale: Die Zeitangabe bezeichnet die Anfangsphase und bildet einen knappen, sprichwortartigen Gegensatz zu „am Ende“.
- source_word: וְאַחֲרִיתָהּ
  choice: am Ende
  rationale: Wörtlich geht es um „sein Ende“ beziehungsweise den späteren Ausgang. „Am Ende“ gibt den abschließenden Ausgang idiomatisch wieder.
- source_word: לֹא תְבֹרָךְ
  choice: ist … nicht gesegnet
  rationale: Die Form von ברך bezeichnet das Ausbleiben von Segen. Diese Wiedergabe bewahrt die theologische Weite und verengt den Sinn nicht auf materiellen Erfolg.
theological_decisions:
- issue: Art der Warnung des Spruchs
  choice: Ein übereilt erworbenes Erbe steht in seinem endgültigen Ausgang nicht unter Segen; der genaue Wirkmechanismus bleibt offen.
  alternative: Der Satz bezeichnet entweder ausdrücklich Gottes Gericht über Habgier oder ausschließlich die praktischen Folgen von Ungeduld.
  rationale: Der hebräische Text spricht allgemein vom Ausbleiben des Segens. Die Übersetzung legt weder ausdrücklich göttliche Bestrafung noch bloß natürliche Folgen als alleinige Deutung fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Spruchform. Der Gegensatz zwischen „anfangs“ und „am Ende“ bleibt deutlich erhalten.
