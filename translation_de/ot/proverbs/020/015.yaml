source:
  edition: WLC
  text: יֵ֣שׁ זָ֭הָב וְ/רָב פְּנִינִ֑ים וּ/כְלִ֥י יְ֝קָ֗ר שִׂפְתֵי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/015.yaml
  text: There is gold[a], and an abundance of pearls, but lips of knowledge are a precious vessel.
translation:
  language: de
  text: Gold gibt es und Perlen[a] in Menge, doch Lippen voller Erkenntnis sind ein kostbares Gefäß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Korallen“, „Rubine“ beziehungsweise allgemeiner „Edelsteine“; was פְּנִינִים genau bezeichnet, ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: gibt es
  rationale: Die deutsche Existenzwendung gibt die einleitende Feststellung natürlich und knapp wieder.
- source_word: זָהָב
  choice: Gold
  rationale: Direkte und eindeutige Wiedergabe des Materialbegriffs.
- source_word: וְרָב
  choice: und … in Menge
  rationale: רָב bezeichnet hier die große Menge der folgenden Kostbarkeiten; „in Menge“ ist im Deutschen idiomatisch und bewahrt die knappe poetische Form.
- source_word: פְּנִינִים
  choice: Perlen
  rationale: „Perlen“ ist eine vertretbare traditionelle Wiedergabe; da die genaue Art der Kostbarkeit unsicher ist, werden Alternativen in einer Fußnote genannt.
- source_word: וּכְלִי יְקָר
  choice: doch … ein kostbares Gefäß
  rationale: כְלִי kann Gefäß, Gerät oder Gegenstand bedeuten. „Kostbares Gefäß“ bewahrt das konkrete Bild; „doch“ macht den im Zusammenhang naheliegenden Gegensatz zwischen materiellen Kostbarkeiten und erkenntnisreicher Rede deutlich.
- source_word: שִׂפְתֵי דָעַת
  choice: Lippen voller Erkenntnis
  rationale: Die Formulierung gibt die hebräische Genitivverbindung in natürlichem, bildhaftem Deutsch wieder, ohne sie zu einer ausführlichen Aussage über das Reden aufzulösen.
theological_decisions: []
translation_notes:
  register: Knappe, poetische Weisheitssprache in modernem Standarddeutsch. Das konkrete Bild vom „kostbaren Gefäß“ und die Personifikation der Lippen bleiben erhalten.
