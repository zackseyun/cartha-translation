  text: הַ֭/נְּמָלִים עַ֣ם לֹא עָ֑ז וַ/יָּכִ֖ינוּ בַ/קַּ֣יִץ לַחְמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/025.yaml
  text: The ants are a people not strong[a], yet they prepare their food in the summer.
translation:
  language: de
  text: Die Ameisen sind ein Volk, das nicht stark ist, und doch bereiten sie im Sommer ihre Nahrung[a] vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihr Brot“; „Brot“ bezeichnet hier im weiteren Sinn Nahrung oder Vorrat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּמָלִים
  choice: die Ameisen
  rationale: Der bestimmte Plural bezeichnet die Ameisen als Gattung; im Deutschen ist „die Ameisen“ natürlich und quellennah.
- source_word: עַם
  choice: ein Volk
  rationale: Die bildhafte Bezeichnung der Ameisen als „Volk“ bleibt erhalten und wird nicht zu „Tiere“ oder „Geschöpfe“ verflacht.
- source_word: לֹא עָז
  choice: das nicht stark ist
  rationale: Die Negation des Adjektivs עָז wird unmittelbar wiedergegeben; „nicht stark“ ist weniger ausdeutend als „schwach“.
- source_word: וַיָּכִינוּ
  choice: und doch bereiten sie … vor
  rationale: Das Hifil von כון bedeutet hier „bereitmachen/vorbereiten“. „Doch“ macht den konzessiven Zusammenhang im Deutschen deutlich, ohne den Gegensatz inhaltlich aufzulösen.
- source_word: בַקַּיִץ
  choice: im Sommer
  rationale: Die Präposition mit Artikel bezeichnet die Jahreszeit, in der die Vorbereitung erfolgt; „im Sommer“ ist die idiomatische deutsche Form.
- source_word: לַחְמָם
  choice: ihre Nahrung
  rationale: לֶחֶם kann neben „Brot“ allgemein Nahrung oder Speise bezeichnen. Bei Ameisen gibt „Nahrung“ den kontextuellen Sinn natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Metapher „ein Volk“ und die zurückhaltende Formulierung „nicht stark“ bleiben erhalten; der Gegensatz wird mit „und doch“ natürlich markiert.
