  text: A lizard you can catch with your hands[a], yet it is in kings’ palaces.
translation:
  language: de
  text: Eine Eidechse[a] kannst du mit den Händen fangen, und doch ist sie in Königspalästen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Spinne“. Das seltene hebräische Wort שְׂמָמִית ist in seiner Bedeutung unsicher. Viele traditionelle Übersetzungen geben es mit „Spinne“ wieder; andere verstehen darunter eine Eidechse oder einen Gecko. Die Verbform kann auch gelesen werden: „Sie greift mit ihren Händen [zu]“ oder „sie hält sich mit ihren Händen fest“.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂמָמִית
  choice: Eidechse
  rationale: Das seltene hebräische Wort ist in seiner Bedeutung unsicher. Im Zusammenhang passt ein kleines, an Wänden lebendes Reptil gut; „Eidechse“ bleibt allgemeiner als das möglicherweise zu spezifische „Gecko“. Die traditionelle Wiedergabe „Spinne“ wird in der Fußnote bewahrt.
- source_word: בְּיָדַיִם
  choice: mit den Händen
  rationale: Die Präposition bezeichnet hier das Mittel; die Wendung gibt das konkrete Bild in natürlichem Deutsch wieder.
- source_word: תְּתַפֵּשׂ
  choice: kannst du … fangen
  rationale: Die Verbform ist zweite Person Singular und spricht einen allgemeinen Beobachter direkt an. „Fangen“ gibt das Ergreifen idiomatisch wieder; „kannst“ verdeutlicht die im Kontext ausgesagte leichte Zugänglichkeit, ohne die Aussage unpersönlich zu machen.
- source_word: וְהִיא
  choice: und doch ist sie
  rationale: Die Verbindung stellt die Fangbarkeit und Unscheinbarkeit des Tieres seiner überraschenden Anwesenheit in königlichen Palästen gegenüber. „Und doch“ macht diesen Kontrast natürlich deutlich.
- source_word: בְּהֵיכְלֵי מֶלֶךְ
  choice: in Königspalästen
  rationale: Der Ausdruck bezeichnet allgemein Paläste von Königen. Das deutsche Kompositum ist knapp, idiomatisch und bewahrt den sprichwörtlichen Charakter.
theological_decisions: []
