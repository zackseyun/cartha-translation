  text: אַל תּ֥וֹסְףְּ עַל דְּבָרָ֑י/ו פֶּן יוֹכִ֖יחַ בְּ/ךָ֣ וְ/נִכְזָֽבְתָּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/006.yaml
  text: Do not add to his words[a], lest he rebuke you and you be proved a liar.
translation:
  language: de
  text: Füge seinen Worten nichts hinzu, sonst weist er dich zurecht und du wirst als Lügner entlarvt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und du als Lügner dastehst“; auch: „und du als falsch erwiesen wirst“.'
    reason: Lexikalische Alternativen für וְנִכְזָבְתָּ, dessen Nifalform sowohl das Erweisen als falsch als auch das Entlarven als Lügner ausdrücken kann.
lexical_decisions:
- source_word: אַל תּוֹסְףְּ
  choice: Füge … nichts hinzu
  rationale: אַל mit der Imperfektform drückt ein Verbot aus; יסף im Hifil bedeutet hier, etwas hinzuzufügen. Die deutsche Formulierung gibt beides knapp und idiomatisch wieder.
- source_word: עַל דְּבָרָיו
  choice: seinen Worten … hinzu
  rationale: דְּבָרָיו bedeutet wörtlich „seine Worte“. In Verbindung mit יסף wird עַל im Deutschen idiomatisch durch die Konstruktion „etwas … hinzufügen“ wiedergegeben.
- source_word: פֶּן
  choice: sonst
  rationale: פֶּן leitet eine unerwünschte Folge ein. „Sonst“ ist im heutigen Deutsch natürlicher als „damit nicht“, ohne die Warnfunktion abzuschwächen.
- source_word: יוֹכִיחַ בְּךָ
  choice: weist er dich zurecht
  rationale: יכח im Hifil kann zurechtweisen, tadeln oder als falsch erweisen bedeuten. Mit der Personenangabe בְּךָ passt hier „dich zurechtweisen“ klar und natürlich.
- source_word: וְנִכְזָבְתָּ
  choice: und du wirst als Lügner entlarvt
  rationale: Das Nifal von כזב bezeichnet hier, dass jemand als falsch beziehungsweise als Lügner erwiesen wird. „Als Lügner entlarvt“ bewahrt die passive, aufdeckende Wirkung und die moralische Schärfe.
theological_decisions:
- issue: Bezug des Suffixes in דְּבָרָיו („seinen Worten“)
  choice: Das Pronomen bleibt als „seinen“ stehen und bezieht sich im Zusammenhang auf Gott.
  alternative: Explizit „Gottes Worten“ zu übersetzen oder den Bezug allgemeiner auf die Worte eines Sprechers zu verstehen.
  rationale: Vers 5 spricht unmittelbar zuvor von jedem Wort Gottes. Daher ist Gott der naheliegende Bezug; die pronominale Wiedergabe bewahrt jedoch die Form des Hebräischen und macht die kontextuelle Verknüpfung nicht unnötig explizit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Warnung bleibt knapp; „sonst“ vermeidet unnötig altertümliches Deutsch. Das Pronomen „seinen“ bewahrt den hebräischen Wortlaut und den Rückbezug auf Gott in Vers 5.
