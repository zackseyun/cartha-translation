source:
  edition: WLC
  text: דּ֭וֹר טָה֣וֹר בְּ/עֵינָ֑י/ו וּ֝/מִ/צֹּאָת֗/וֹ לֹ֣א רֻחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/012.yaml
  text: There is a generation that is pure in its own eyes[b][a], yet is not washed from its filth.
translation:
  language: de
  text: Eine Generation hält sich selbst für rein[a], doch sie ist nicht von ihrem Unrat[b] gewaschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Eine Generation ist rein in ihren eigenen Augen“.'
    reason: Die Fußnote bewahrt die konkrete hebräische Augen-Wendung hinter der idiomatischen Übersetzung.
  - marker: b
    text: Das hebräische Wort kann „Unrat“, „Kot“ oder „Exkremente“ bedeuten; das Bild ist bewusst drastisch.
    reason: Die Bedeutungsbreite und Stärke des zugrunde liegenden Ausdrucks sollen sichtbar bleiben.
lexical_decisions:
- source_word: דּוֹר
  choice: Generation
  rationale: Das Wort bezeichnet eine Generation oder eine durch bestimmte Merkmale gekennzeichnete Gruppe. „Generation“ bewahrt hier das wiederkehrende rhetorische Muster der Verse 11–14.
- source_word: טָהוֹר
  choice: rein
  rationale: Das Adjektiv kann kultische wie moralische Reinheit bezeichnen. „Rein“ erhält diese Bedeutungsbreite und bildet den direkten Gegensatz zum Nichtgewaschensein.
- source_word: בְּעֵינָיו
  choice: hält sich selbst für
  rationale: Die wörtliche Wendung „in seinen eigenen Augen“ bezeichnet die eigene Einschätzung. Die idiomatische deutsche Formulierung gibt diesen Sinn natürlich wieder, ohne die Aussage als objektive Reinheit erscheinen zu lassen.
- source_word: וּמִצֹּאָתוֹ
  choice: von ihrem Unrat
  rationale: צֹאָה bezeichnet Unrat, Kot oder Exkremente. „Unrat“ bewahrt das bewusst drastische Schmutzbild, klingt im Deutschen jedoch würdig und lässt zugleich seine übertragene moralische Kraft erkennen.
- source_word: לֹא רֻחָץ
  choice: ist sie nicht gewaschen
  rationale: Die passive Form lässt den Handelnden offen. Die Formulierung bewahrt das Waschbild und den Gegensatz zwischen behaupteter Reinheit und tatsächlicher Unreinheit.
theological_decisions:
- issue: Art der Reinheit
  choice: Die Bildsprache wird weder ausschließlich kultisch noch ausschließlich moralisch festgelegt.
  alternative: Die Aussage ausdrücklich nur auf rituelle oder nur auf moralische Reinheit beziehen.
  rationale: Reinheits- und Waschvokabular kann beide Bereiche anklingen lassen. Der Zusammenhang legt eine moralische Anwendung nahe, doch der hebräische Wortlaut bewahrt eine weitere Spannung.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die kollektive „Generation“ wird mit dem femininen Singularpronomen aufgenommen. Das drastische hebräische Bild bleibt erhalten, ohne unnötig klinisch oder vulgär zu klingen.
