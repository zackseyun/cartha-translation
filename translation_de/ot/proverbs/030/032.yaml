  source_fidelity: Der Entwurf gibt die beiden Bedingungssätze, die Selbsterhöhung (התנשא), das objektlos gebrauchte זמם und das konkrete Bild „Hand zum Mund“ im Wesentlichen zutreffend wieder. „Etwas ausgeheckt“ wahrt, anders als „Böses ausgeheckt“, die im Hebräischen offene Objektstelle, trägt aber den möglichen negativen Beiklang des Verbs.
  naturalness: „Hand auf den Mund!“ ist verständlich, wirkt im heutigen Standarddeutsch jedoch als stark verkürzte Nominalform etwas abgehackt. Ein expliziter Imperativ ist ebenso knapp, bewahrt das Bild und klingt natürlicher. „Dich selbst erhöht“ ist nicht falsch, aber das reflexive „dich erhöht“ ist idiomatischer und ohne Bedeutungsverlust.
  terminology: „Töricht gehandelt“, „dich erhöht“ und „etwas ausgeheckt“ passen zum sprichworthaften, würdigen Register. Es wird kein im Grundtext fehlendes Objekt wie „Böses“ ergänzt. Keine theologischen Fachbegriffe oder Namensfragen sind betroffen.
