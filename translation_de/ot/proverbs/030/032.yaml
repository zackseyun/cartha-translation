source:
  edition: WLC
  text: אִם נָבַ֥לְתָּ בְ/הִתְנַשֵּׂ֑א וְ/אִם זַ֝מּ֗וֹתָ יָ֣ד לְ/פֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/032.yaml
  text: If you have acted foolishly by exalting yourself[a], or if you have plotted[b], put your hand over your mouth.
translation:
  language: de
  text: 'Wenn du töricht gehandelt hast, indem du dich erhöht hast, oder wenn du etwas ausgeheckt hast: Leg die Hand auf den Mund!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָבַלְתָּ
  choice: töricht gehandelt hast
  rationale: Das Verb bezeichnet törichtes, sittlich verfehltes Handeln; die Formulierung bewahrt den praktischen und moralischen Ton des Spruchs.
- source_word: בְהִתְנַשֵּׂא
  choice: indem du dich selbst erhöht hast
  rationale: Der Hitpael-Infinitiv von נשׂא drückt hier reflexive Selbsterhöhung aus; die Konstruktion kann die Art bzw. den Umstand des törichten Handelns bezeichnen.
- source_word: זַמּוֹתָ
  choice: etwas ausgeheckt hast
  rationale: זמם bedeutet planen, ersinnen oder aushecken und hat häufig einen negativen Beiklang. »Etwas« macht die deutsche Wendung natürlich, ohne ein im Hebräischen nicht ausdrücklich genanntes »Böses« als Objekt einzufügen.
- source_word: יָד לְפֶה
  choice: Hand auf den Mund!
  rationale: Die knappe, wörtlich bildhafte Wendung fordert dazu auf, zu schweigen und sich zurückzuhalten; die deutsche Form bewahrt sowohl Kürze als auch Bildlichkeit.
- source_word: אִם ... וְאִם
  choice: Wenn ... oder wenn
  rationale: Die beiden Konditionalsätze nennen verwandte alternative Fälle; »oder wenn« ist im modernen Deutsch natürlich und gibt diese Beziehung klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichworthafter Zuspitzung im abschließenden Imperativ. Die Mehrdeutigkeit von זמם zwischen neutralem Planen und negativem Aushecken wird durch die kontextuell passende, aber objektlose Wendung »etwas ausgeheckt« erhalten; ein ausdrückliches »Böses« wird nicht ergänzt.
