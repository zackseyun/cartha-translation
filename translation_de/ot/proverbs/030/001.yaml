  text: דִּבְרֵ֤י אָג֥וּר בִּן יָקֶ֗ה הַ/מַּ֫שָּׂ֥א נְאֻ֣ם הַ֭/גֶּבֶר לְ/אִֽיתִיאֵ֑ל לְ/אִ֖יתִיאֵ֣ל וְ/אֻכָֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/001.yaml
  text: 'The words of Agur son of Jakeh[a], the oracle: the declaration of the man to Ithiel[b], to Ithiel and Ucal.'
translation:
  language: de
  text: 'Die Worte Agurs, des Sohnes Jakes[a], der Ausspruch: der Spruch des Mannes an Itiël[b], an Itiël und Ukal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Die Worte Agurs, des Sohnes Jakes, aus Massa«, wenn הַמַּשָּׂא als Orts- oder Stammesname und nicht als »der Ausspruch« verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: 'Oder möglicherweise: »Ich habe mich abgemüht, o Gott; ich habe mich abgemüht, o Gott, und bin erschöpft«, wenn die Schlusssequenz anders vokalisiert und als Verbalaussage statt als die Namen Itiël und Ukal gelesen wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Die Worte
  rationale: Die Status-constructus-Form leitet Worte oder eine Sammlung von Äußerungen ein. »Die Worte« ist direkt und lässt die Gattung offen.
- source_word: אָגוּר
  choice: Agur
  rationale: Der Personenname wird transliteriert.
- source_word: בִּן יָקֶה
  choice: des Sohnes Jakes
  rationale: בִּן bezeichnet hier die Abstammung; der Personenname יָקֶה wird in einer im Deutschen natürlichen Genitivkonstruktion als »Jakes« wiedergegeben.
- source_word: הַמַּשָּׂא
  choice: der Ausspruch
  rationale: מַשָּׂא kann eine gewichtige, auch prophetische Äußerung bezeichnen. »Ausspruch« ist würdig und weniger festlegend als »Weissagung«; die mögliche Deutung als Orts- oder Stammesname wird in der Fußnote bewahrt.
- source_word: נְאֻם
  choice: die feierliche Erklärung
  rationale: Das formelhafte Substantiv bezeichnet eine feierliche Äußerung. »Feierliche Erklärung« wahrt den gehobenen Ton und unterscheidet den Ausdruck sprachlich von מַשָּׂא.
- source_word: הַגֶּבֶר
  choice: des Mannes
  rationale: גֶּבֶר bezeichnet einen Mann und kann Stärke mitschwingen lassen; »des Mannes« vermeidet es, diese mögliche Nuance zu überbetonen.
- source_word: לְאִיתִיאֵל
  choice: an Itiël
  rationale: Die Präposition לְ bezeichnet hier am ehesten den Adressaten. Die Wiederholung des Namens wird entsprechend dem hebräischen Text beibehalten.
- source_word: וְאֻכָל
  choice: und Ukal
  rationale: Die masoretische Punktierung versteht die Form als Eigennamen. Die stark abweichende mögliche vokalische Deutung als Verbalaussage wird in einer Fußnote genannt.
theological_decisions:
- issue: Deutung von הַמַּשָּׂא
  choice: Als Gattungsbezeichnung »der Ausspruch« verstanden.
  alternative: Als Eigenname »Massa« beziehungsweise als Herkunftsbezeichnung verstanden.
  rationale: Der Artikel und die Verwendung des Wortes für gewichtige Aussprüche stützen die Gattungsbezeichnung. Da die Deutung als Orts- oder Stammesname sprachlich möglich und traditionsreich ist, bleibt sie in einer Fußnote sichtbar.
- issue: Deutung der Schlusswörter לְאִיתִיאֵל לְאִיתִיאֵל וְאֻכָל
  choice: 'Der masoretischen Vokalisierung folgend als Namen und Adressaten gelesen: »an Itiël, an Itiël und Ukal«.'
  alternative: Durch abweichende Vokalisierung als Aussage über Ermüdung oder Erschöpfung vor Gott gelesen.
  rationale: Der Haupttext folgt der überlieferten masoretischen Punktierung, ohne die erheblich anderslautende und sprachlich mögliche Alternativlesart zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe und schwierige Überschriftsyntax des Hebräischen bleibt erkennbar; der Doppelpunkt macht das Verhältnis der beiden Bezeichnungen lesbar, ohne die syntaktische Spannung aufzulösen. Die Schreibungen »Itiël« und »Ukal« verdeutlichen die Namen und unterstützen die deutsche Aussprache.
