  text: עַ֤יִן תִּֽלְעַ֣ג לְ/אָב֮ וְ/תָב֪וּז לִֽ/יקֲּהַ֫ת אֵ֥ם יִקְּר֥וּ/הָ עֹרְבֵי נַ֑חַל וְֽ/יֹאכְל֥וּ/הָ בְנֵי נָֽשֶׁר׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/017.yaml
  text: The eye that mocks a father and despises obedience to a mother—the ravens of the valley will peck it out[c][b][a], and the young of the eagle will eat it.
translation:
  language: de
  text: Ein Auge, das einen Vater verspottet und den Gehorsam gegenüber einer Mutter verachtet[a] – die Raben des Bachtals[b] werden es herauspicken, und die Jungen des Adlers[c] werden es fressen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Weisung einer Mutter“ beziehungsweise „das Hören auf eine Mutter“. Das seltene hebräische Wort meint wahrscheinlich den Gehorsam oder die Beachtung, die einer Mutter gebührt.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann ein Bachtal, ein Wadi, eine Schlucht oder ein Bachbett bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort נשר kann einen Adler oder einen Geier bezeichnen; traditionell wird es mit „Adler“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: Ein Auge
  rationale: Der Singular bezeichnet sprichwörtlich das Auge als Ausdruck einer verächtlichen Haltung. Der unbestimmte Artikel bewahrt den allgemeinen Charakter und vermeidet eine im Hebräischen nicht ausdrücklich markierte Bestimmtheit.
- source_word: תִּלְעַג
  choice: verspottet
  rationale: לעג bezeichnet höhnisches, verächtliches Spotten; „verspottet“ ist im Deutschen prägnant und würdevoll.
- source_word: לְאָב
  choice: einen Vater
  rationale: Im Hebräischen steht kein Possessivsuffix. „Einen Vater“ bewahrt diese generische Form, ohne stillschweigend „seinen Vater“ einzufügen.
- source_word: וְתָבוּז
  choice: und … verachtet
  rationale: בוז drückt Geringschätzung oder Verachtung aus; „verachtet“ gibt die moralische Schärfe natürlich wieder.
- source_word: לִיקֲּהַת אֵם
  choice: den Gehorsam gegenüber einer Mutter
  rationale: יקהת ist selten und in seiner genauen Bedeutung umstritten. Im Zusammenhang liegt das einer Mutter geschuldete Hören beziehungsweise der Gehorsam nahe; die Fußnote hält alternative Deutungen offen.
- source_word: יִקְּרוּהָ
  choice: werden es aushacken
  rationale: נקר bezeichnet hier das Aushacken beziehungsweise Auspicken eines Auges durch Vögel. „Aushacken“ ist anschaulich und im Deutschen idiomatisch.
- source_word: עֹרְבֵי נַחַל
  choice: die Raben im Bachtal
  rationale: נחל kann Bach, Wadi, Schlucht oder das dazugehörige Tal beziehungsweise Bachbett bezeichnen. „Bachtal“ ist verständlich und bewahrt sowohl Gewässer- als auch Geländeaspekt.
- source_word: וְיֹאכְלוּהָ
  choice: werden es fressen
  rationale: אכל ist das gewöhnliche Verb für essen; bei Tieren ist „fressen“ die natürliche deutsche Entsprechung und bewahrt die drastische Bildsprache.
- source_word: בְנֵי נָשֶׁר
  choice: die Jungen des Adlers
  rationale: Wörtlich steht „Söhne/Junge des נשר“. „Jungen des Adlers“ bildet die Konstruktion nach; die mögliche Bedeutung „Geier“ wird in der Fußnote genannt.
