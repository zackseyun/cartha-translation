  text: כִּ֤י בַ֣עַר אָנֹכִ֣י מֵ/אִ֑ישׁ וְ/לֹֽא בִינַ֖ת אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/002.yaml
  text: For I am more brutish than anyone[a], and I do not have human understanding.
translation:
  language: de
  text: Denn ich bin unverständiger als jeder Mensch[a] und habe keinen menschlichen Verstand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn ich bin zu unverständig, um ein Mensch zu sein, und habe nicht den Verstand eines Menschen.“'
    reason: Lexikalisch-syntaktische Alternative für בַּעַר אָנֹכִי מֵאִישׁ und die parallele Formulierung im zweiten Satzteil.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die begründende beziehungsweise erläuternde Aussage des Sprechers ein und bewahrt so den Zusammenhang mit dem vorangehenden Vers.
- source_word: בַעַר
  choice: unvernünftiger
  rationale: Das Wort bezeichnet einen unverständigen, stumpfen oder tierähnlich vernunftlosen Zustand. „Unvernünftiger“ gibt die starke Selbsterniedrigung verständlich wieder, ohne im Deutschen vorrangig moralische Rohheit anzudeuten.
- source_word: אָנֹכִי
  choice: ich bin
  rationale: Das ausdrücklich gesetzte Personalpronomen hebt den Sprecher hervor; im Deutschen verlangt das prädikative Adjektiv hier die Kopula.
- source_word: מֵאִישׁ
  choice: als jeder andere Mensch
  rationale: מִן kann den Vergleich markieren. Die idiomatische deutsche Formulierung gibt den im Kontext naheliegenden umfassenden Vergleich wieder; die alternative Analyse als „zu …, um ein Mensch zu sein“ bleibt in der Fußnote erhalten.
- source_word: וְלֹא
  choice: und … keinen
  rationale: Verbindet die beiden Selbstaussagen schlicht miteinander und gibt die Verneinung in natürlicher deutscher Satzform wieder.
- source_word: בִינַת
  choice: Verstand
  rationale: Bezeichnet Einsicht, Verständnis oder Unterscheidungsvermögen. „Verstand“ passt zum Weisheitskontext und zur possessiven Konstruktion.
- source_word: אָדָם
  choice: menschlichen
  rationale: אָדָם ist hier allgemein anthropologisch gebraucht; das Adjektiv vermittelt diesen Bezug im Deutschen ohne männliche Einengung.
- source_word: לִי
  choice: habe
  rationale: Die hebräische Dativkonstruktion bezeichnet Besitz und wird idiomatisch mit „haben“ wiedergegeben.
theological_decisions:
- issue: Allgemeiner anthropologischer Sinn von אָדָם
  choice: menschlichen Verstand
  alternative: den Verstand eines Mannes
  rationale: Der Zusammenhang spricht von menschlichem Verstehen allgemein, nicht ausschließlich von Männern. Die gewählte Form bewahrt den umfassenden Sinn.
- issue: Deutung der Verbindung בַעַר … מֵאִישׁ
  choice: unvernünftiger als jeder andere Mensch
  alternative: zu dumm, um ein Mensch zu sein
  rationale: Die Hauptfassung versteht מִן vergleichend. Da die Konstruktion auch als Aussage gelesen werden kann, der Sprecher sei für den Anspruch, ein Mensch zu sein, zu unverständig, wird diese echte Mehrdeutigkeit nicht aufgelöst, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unvernünftig“ ist deutlich, aber weniger umgangssprachlich als „dumm“ und weniger missverständlich als „tierisch“ oder „roh“. Die Fußnote bewahrt die schärfere alternative Lesart.
