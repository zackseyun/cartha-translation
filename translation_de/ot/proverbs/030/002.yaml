  - severity: low
    issue: „unvernünftiger“ ist für בַּעַר weniger präzise.
    rationale: Im heutigen Deutsch bezeichnet „unvernünftig“ häufig unangemessenes oder irrationales Handeln. „Unverständig“ bewahrt den hier gemeinten Mangel an Einsicht und Verständnis im Weisheitskontext besser.
