source:
  edition: WLC
  text: תַּ֣חַת שָׁ֭לוֹשׁ רָ֣גְזָה אֶ֑רֶץ וְ/תַ֥חַת אַ֝רְבַּ֗ע לֹא תוּכַ֥ל שְׂאֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/021.yaml
  text: 'Under three things the earth trembles[a], and under four it cannot bear up:'
translation:
  language: de
  text: Unter drei Dingen erbebt die Erde, und unter vier kann sie es nicht ertragen:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kann sie es nicht tragen« beziehungsweise »kann sie nicht standhalten«. Das hebräische Verb kann sowohl das Tragen als auch das Ertragen oder Aushalten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: unter
  rationale: Bewahrt das räumliche Lastbild des Hebräischen und ist in der deutschen Zahlenspruchformel verständlich; zugleich kann die Wendung sinngemäß den Anlass bezeichnen.
- source_word: שָׁלוֹשׁ
  choice: drei Dingen
  rationale: Das Hebräische nennt nur die Zahl; »Dingen« wird für eine natürliche deutsche Formulierung ergänzt und durch die folgenden Aufzählungspunkte nahegelegt.
- source_word: רָגְזָה
  choice: erbebt
  rationale: Gibt das Erzittern oder die heftige Erregung der personifizierten Erde anschaulich wieder, ohne ausdrücklich ein tatsächliches Erdbeben zu behaupten.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Der umfassende Ausdruck passt zur Personifikation und zum Gewicht des Weisheitsspruchs besser als das enger mögliche »Land«.
- source_word: וְתַחַת
  choice: und unter
  rationale: Erhält den Parallelismus und die wiederholte Lastmetapher der beiden Satzhälften.
- source_word: אַרְבַּע
  choice: vier
  rationale: Vollendet die hebräische Steigerungsformel »drei ... vier«; »Dingen« ist aus der ersten Satzhälfte mitzudenken.
- source_word: לֹא תוּכַל
  choice: kann sie nicht
  rationale: Die feminine Verbform bezieht sich auf אֶרֶץ; das Pronomen »sie« macht diesen Bezug im Deutschen klar.
- source_word: שְׂאֵת
  choice: es ertragen
  rationale: Der Infinitiv von נָשָׂא kann tragen, aushalten oder ertragen bedeuten. »Es ertragen« ist idiomatisch und bewahrt den Gedanken einer nicht mehr tragbaren Belastung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Zahlenspruchformel und das Bild der unter einer Last erbebenden Erde bleiben erhalten; die Ergänzung »Dingen« dient ausschließlich der natürlichen deutschen Syntax.
