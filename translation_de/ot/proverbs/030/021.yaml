  terminology: „Erde“ entspricht hier dem umfassenden, personifizierten Sinn von אֶרֶץ. „Ertragen“ ist für den Infinitiv von נָשָׂא eine gut vertretbare Hauptlesart; die Fußnote nennt angemessen die Alternativen des Tragens und Standhaltens.
