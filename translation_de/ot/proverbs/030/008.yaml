  text: שָׁ֤וְא וּֽ/דְבַר כָּזָ֡ב הַרְחֵ֬ק מִמֶּ֗/נִּי רֵ֣אשׁ וָ֭/עֹשֶׁר אַל תִּֽתֶּן לִ֑/י הַ֝טְרִיפֵ֗/נִי לֶ֣חֶם חֻקִּֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/008.yaml
  text: Keep falsehood and lying words far from me[a]; give me neither poverty nor riches[b]; feed me with the bread allotted to me.
translation:
  language: de
  text: Halte Falschheit und verlogene Rede von mir fern[a]. Gib mir weder Armut noch Reichtum; versorge mich mit dem Brot, das mir zugemessen ist[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lügenworte“ statt „verlogene Rede“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „das Brot meines festgesetzten Anteils“; auch möglich: „meinen Anteil an Brot“ oder „mein tägliches Brot“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: Falschheit
  rationale: Im Parallelismus mit דְבַר כָּזָב bezeichnet das Wort hier am ehesten moralische oder sprachliche Unwahrheit. „Falschheit“ bewahrt diese ethische Bedeutung, ohne sie auf bloße Nichtigkeit oder Vergänglichkeit zu verengen.
- source_word: דְבַר כָּזָב
  choice: verlogene Rede
  rationale: Die Wendung bedeutet wörtlich etwa „Wort der Lüge“. „Verlogene Rede“ ist im heutigen Deutsch natürlich, kann als Sammelbegriff verstanden werden und gibt den Bezug auf täuschendes Sprechen wieder.
- source_word: הַרְחֵק מִמֶּנִּי
  choice: Halte … von mir fern
  rationale: Der Hifil-Imperativ von רחק fordert dazu auf, etwas auf Abstand zu bringen. Die gewählte Formulierung ist als Bitte natürlich und bewahrt die räumliche Metapher.
- source_word: רֵאשׁ
  choice: Armut
  rationale: Das Substantiv bezeichnet Armut beziehungsweise Bedürftigkeit. „Armut“ bildet den klaren Gegenpol zu „Reichtum“.
- source_word: עֹשֶׁר
  choice: Reichtum
  rationale: Die übliche Bedeutung ist materieller Wohlstand oder Reichtum; „Reichtum“ erhält den wirtschaftlichen Gegensatz zu „Armut“.
- source_word: אַל תִּתֶּן לִי
  choice: Gib mir weder … noch …
  rationale: Die hebräische Verneinung bezieht sich auf beide Gegenbegriffe. Die deutsche Korrelativkonstruktion gibt dies eindeutig und idiomatisch wieder.
- source_word: הַטְרִיפֵנִי
  choice: versorge mich mit
  rationale: Der Hifil von טרף bezeichnet hier das Gewähren beziehungsweise Zuteilen von Nahrung. „Versorge mich mit“ klingt im modernen Deutsch natürlich und hält den Gedanken göttlicher Versorgung fest.
- source_word: לֶחֶם חֻקִּי
  choice: das Brot, das mir zugemessen ist
  rationale: Wörtlich steht „Brot meines festgesetzten Anteils“. Die Übersetzung bewahrt sowohl das konkrete Bild des Brotes als auch den Gedanken eines bestimmten, angemessenen Anteils, ohne die später vertraute Formulierung „tägliches Brot“ einzutragen.
theological_decisions:
- issue: Deutung von לֶחֶם חֻקִּי als Bitte um Versorgung
  choice: Bitte um den zugemessenen Anteil an Nahrung zwischen Mangel und Überfluss
  alternative: „mein tägliches Brot“ als Bitte um den täglichen Bedarf
  rationale: Der unmittelbare Zusammenhang stellt Armut und Reichtum gegenüber und bittet um eine begrenzte, angemessene Versorgung. „Zugemessen“ wahrt diesen Weisheitsgedanken, ohne mögliche tägliche Versorgung auszuschließen oder neutestamentliche Sprache ausdrücklich einzutragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Gebetston. Der Parallelismus und die knappe Dreiteilung des hebräischen Verses bleiben erkennbar; die Satzteilung erhöht die Lesbarkeit, ohne die Gedankenfolge zu verändern.
