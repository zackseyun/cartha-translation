  text: כָּל אִמְרַ֣ת אֱל֣וֹהַּ צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לַֽ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/005.yaml
  text: Every word of God is proven; he is a shield to those who take refuge in him.
translation:
  language: de
  text: Jede Aussage Gottes ist bewährt; er ist ein Schild für alle, die bei ihm Zuflucht suchen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִמְרַת אֱלוֹהַּ
  choice: Jede Aussage Gottes
  rationale: אִמְרָה bezeichnet hier einen Ausspruch bzw. eine Aussage; „jede“ gibt כָּל in der Verbindung natürlich und umfassend wieder.
- source_word: צְרוּפָה
  choice: ist bewährt
  rationale: Das Partizip von צרף entstammt dem Bild des Läuterns und Prüfens von Metall. „Bewährt“ hält den Gedanken des Erprobten und als zuverlässig Erwiesenen fest, ohne ihn auf bloße moralische Reinheit zu verengen.
- source_word: מָגֵן
  choice: ein Schild
  rationale: Direkte Wiedergabe der Schutzmetapher.
- source_word: לַחֹסִים בּוֹ
  choice: für alle, die bei ihm Zuflucht suchen
  rationale: חסה bedeutet, Schutz bzw. Zuflucht bei jemandem zu suchen. „Bei ihm“ gibt die personale Ausrichtung von בּוֹ idiomatisch wieder; „alle“ macht die substantivierte Mehrzahl im Deutschen natürlich sichtbar.
theological_decisions:
- issue: Reichweite und Charakter der göttlichen Aussage
  choice: „Jede Aussage Gottes ist bewährt“
  alternative: „Jedes Wort Gottes ist rein“
  rationale: Die gewählte Fassung bewahrt das Prüfungs- und Läuterungsbild von צְרוּפָה und formuliert die Zuverlässigkeit göttlicher Rede, ohne eine weitergehende Lehrformel in den Vers einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der parallele Aufbau der beiden Vershälften und die Schutzmetapher bleiben klar erhalten.
