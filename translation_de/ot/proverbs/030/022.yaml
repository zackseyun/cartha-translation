source:
  edition: WLC
  text: תַּֽחַת עֶ֭בֶד כִּ֣י יִמְל֑וֹךְ וְ֝/נָבָ֗ל כִּ֣י יִֽשְׂבַּֽע לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/022.yaml
  text: under a servant when he becomes king[a], and a fool when he is filled with bread[b],
translation:
  language: de
  text: unter einem Sklaven, wenn er König wird[a], und unter einem Toren, wenn er sich an Brot satt isst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn er herrscht“.'
    reason: lexical_alternative
  - marker: b
    text: „Brot“ kann hier auch allgemeiner für „Nahrung“ stehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: unter
  rationale: Die Präposition bezeichnet innerhalb der Aufzählung in Verse 21–23 die Verhältnisse, unter denen die Erde erbebt. „Unter“ bewahrt die knappe hebräische Konstruktion; beim zweiten Glied wird es für natürliches und eindeutiges Deutsch wiederholt.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Das Wort kann einen Diener oder Sklaven bezeichnen. Hier ist der niedrige, unfreie gesellschaftliche Stand für die geschilderte Umkehrung wesentlich, weshalb „Sklave“ präziser ist.
- source_word: כִּי
  choice: wenn
  rationale: כִּי führt in beiden Gliedern den jeweiligen Umstand ein. „Wenn“ gibt diese zeitlich-konditionale Beziehung im Deutschen natürlich wieder.
- source_word: יִמְלֹךְ
  choice: König wird
  rationale: Das Verb kann sowohl das Königwerden als auch das Herrschen bezeichnen. „König wird“ hebt die im Spruch gemeinte gesellschaftliche Umkehrung anschaulich hervor, ohne die lexikalische Alternative zu verschweigen.
- source_word: נָבָל
  choice: Tor
  rationale: In der Weisheitsliteratur bezeichnet נָבָל einen sittlich und sozial uneinsichtigen Menschen, nicht bloß geringe Intelligenz. „Tor“ ist dafür eine knappe, im biblischen Weisheitsstil geläufige Bezeichnung.
- source_word: יִשְׂבַּע
  choice: sich satt isst
  rationale: Das Verb bedeutet, satt oder gesättigt zu sein. Die idiomatische Wendung „sich satt isst“ bewahrt das konkrete Bild und verbindet sich natürlich mit „Brot“.
- source_word: לָחֶם
  choice: Brot
  rationale: „Brot“ gibt die konkrete Bedeutung wieder. Das Wort kann zugleich allgemein für Nahrung stehen; diese mögliche weitere Bedeutung wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Da der Vers den in Vers 21 begonnenen Satz fortsetzt, beginnt er syntaktisch mit „unter“. Die Wiederholung von „unter“ vor dem zweiten Glied dient der Klarheit im Deutschen.
