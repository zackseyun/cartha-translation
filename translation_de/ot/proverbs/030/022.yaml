  source_fidelity: 'Die Übersetzung gibt die beiden hebräischen Glieder sachgerecht wieder: תַּחַת als die vom übergeordneten Satz in V. 21 abhängige Einleitung „unter“, עֶבֶד treffend als „Sklave“, יִמְלֹךְ als „König wird“ und נָבָל als „Tor“. „wenn er sich an Brot satt isst“ gibt יִשְׂבַּע לָחֶם idiomatisch und ohne unnötige Ausdeutung wieder. Die Wiederholung von „unter“ im zweiten Glied ist im Deutschen eine zulässige, klarheitsfördernde Ergänzung der elliptischen hebräischen Reihung.'
  naturalness: Modernes, verständliches und zugleich dem Weisheitsspruch angemessen würdiges Standarddeutsch. Der mit „unter“ beginnende Satzteil bleibt bewusst als Fortsetzung von V. 21 erkennbar.
  terminology: „Sklave“ wahrt den für die sozialen Umkehrungen des Spruchs relevanten unfreien Status besser als das unverbindlichere „Diener“. „Tor“ ist als weisheitliche Bezeichnung für נָבָל etabliert und trifft nicht lediglich mangelnde Intelligenz. Die Fußnoten nennen echte lexikalische Spielräume, ohne den Text zu überladen.
