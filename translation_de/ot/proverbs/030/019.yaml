source:
  edition: WLC
  text: דֶּ֤רֶךְ הַ/נֶּ֨שֶׁר בַּ/שָּׁמַיִם֮ דֶּ֥רֶךְ נָחָ֗שׁ עֲלֵ֫י צ֥וּר דֶּֽרֶךְ אֳנִיָּ֥ה בְ/לֶב יָ֑ם וְ/דֶ֖רֶךְ גֶּ֣בֶר בְּ/עַלְמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/019.yaml
  text: the way of an eagle in the sky[a], the way of a snake on a rock, the way of a ship in the heart of the sea[c][b], and the way of a man with a young woman.
translation:
  language: de
  text: der Weg des Adlers am Himmel[a], der Weg einer Schlange auf einem Felsen, der Weg eines Schiffes mitten im Meer[b] und der Weg eines Mannes mit einer jungen Frau.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann neben „Adler“ auch einen anderen großen Greifvogel oder Geier bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „im Herzen des Meeres“, eine bildhafte Bezeichnung für die Mitte des Meeres.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „mit einer Jungfrau“. Das hebräische Wort bezeichnet eine junge Frau und stellt ihre Jungfräulichkeit nicht ausdrücklich fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: Weg
  rationale: Das viermal wiederholte Leitwort bezeichnet sowohl eine Bewegungsbahn als auch eine Art und Weise; „Weg“ bewahrt diese Bedeutungsbreite.
- source_word: הַנֶּשֶׁר
  choice: Adler
  rationale: „Adler“ ist die geläufige konkrete Wiedergabe; das hebräische Wort kann jedoch auch einen anderen großen Greifvogel beziehungsweise Geier bezeichnen.
- source_word: בַּשָּׁמַיִם
  choice: am Himmel
  rationale: Gemeint ist hier der sichtbare Himmel als Raum des Vogelflugs; „am Himmel“ ist im Deutschen natürlich und anschaulich.
- source_word: נָחָשׁ
  choice: Schlange
  rationale: „Schlange“ ist die klare moderne Bezeichnung und vermeidet die unnötig literarischen oder symbolischen Nebenklänge von „Schlangentier“ oder „Serpent“.
- source_word: עֲלֵי צוּר
  choice: auf dem Felsen
  rationale: Die Formulierung gibt die Bewegung auf einer harten Felsfläche knapp und quellennah wieder.
- source_word: אֳנִיָּה
  choice: Schiff
  rationale: Das Wort bezeichnet ein Wasserfahrzeug; im Zusammenhang mit dem Meer ist „Schiff“ die natürliche Wahl.
- source_word: בְלֶב יָם
  choice: mitten im Meer
  rationale: Wörtlich steht „im Herzen des Meeres“. Die idiomatische Wiedergabe „mitten im Meer“ vermittelt die räumliche Bedeutung in natürlichem Deutsch; die Bildform wird in einer Fußnote genannt.
- source_word: גֶּבֶר
  choice: Mann
  rationale: Das hebräische Substantiv bezeichnet hier ausdrücklich einen erwachsenen männlichen Menschen.
- source_word: בְּעַלְמָה
  choice: mit einer jungen Frau
  rationale: עַלְמָה bezeichnet eine junge Frau im heiratsfähigen Alter, ohne für sich allein Jungfräulichkeit ausdrücklich festzustellen. Die Präposition wird relational als „mit“ wiedergegeben, wobei die Mehrdeutigkeit der Beziehung bestehen bleibt.
theological_decisions:
- issue: Bedeutung von וְדֶרֶךְ גֶּבֶר בְּעַלְמָה
  choice: der Weg eines Mannes mit einer jungen Frau
  alternative: der Weg eines Mannes bei/in einer jungen Frau; der Weg eines Mannes mit einer Jungfrau
  rationale: Die Wendung steht in einer Reihe schwer nachzuverfolgender oder erstaunlicher „Wege“. „Mit“ lässt offen, ob Anziehung, Werbung, Beziehung oder sexuelle Vereinigung anklingt, und legt den suggestiven hebräischen Ausdruck nicht unnötig fest. „Junge Frau“ bildet die lexikalische Bedeutung von עַלְמָה ab, ohne Jungfräulichkeit auszuschließen oder zwingend zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die viergliedrige Wiederholung von „der Weg“ bleibt als rhetorisches Gerüst erhalten. Die Formulierung ist Teil eines fortlaufenden Satzes und beginnt daher entsprechend der Vorlage kleingeschrieben.
