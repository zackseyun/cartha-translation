base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/009.yaml
  text: lest I become full and deny you and say[b][a], “Who is Yahweh?” or lest I become poor and steal and profane the name of my God.
translation:
  language: de
  text: 'Damit ich nicht satt werde, dich verleugne und sage: »Wer ist Jahwe?« oder verarme, stehle und den Namen meines Gottes entweihe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »den Namen meines Gottes ergreifen«. Die ungewöhnliche hebräische Wendung kann auch bedeuten: »sich am Namen meines Gottes vergreifen« oder »den Namen meines Gottes missbrauchen«.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: פֶּן ... וּפֶן
  choice: Sonst könnte ich ... Oder ich könnte
  rationale: Die Konstruktion führt zwei befürchtete Folgen der vorausgehenden Bitte ein. Die Formulierung gibt den warnenden, möglichen Charakter im natürlichen Deutschen wieder.
- source_word: אֶשְׂבַּע
  choice: ich satt werde
  rationale: Das Verb bezeichnet das Satt- oder Gesättigtsein und bewahrt hier das konkrete Bild eines Lebens im Überfluss.
- source_word: וְכִחַשְׁתִּי
  choice: dich verleugnen
  rationale: Das Verb kann Falschheit, Leugnen oder Lossagen ausdrücken. Im Zusammenhang mit der folgenden Frage nach Jahwe bezeichnet es die Verleugnung Gottes; das im Hebräischen unausgesprochene Objekt wird aus dem Gebetszusammenhang ergänzt.
- source_word: מִי יְהוָה
  choice: Wer ist Jahwe?
  rationale: Die wörtliche rhetorische Frage drückt selbstsichere Missachtung Gottes aus. Der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: אִוָּרֵשׁ
  choice: ich verarme
  rationale: Die Nifalform bezeichnet hier das Verarmen beziehungsweise das Geraten in Not und steht parallel zum Sattwerden.
- source_word: וְגָנַבְתִּי
  choice: stehlen
  rationale: Die direkte, allgemein verständliche Wiedergabe entspricht dem einfachen hebräischen Verb.
- source_word: וְתָפַשְׂתִּי שֵׁם אֱלֹהָי
  choice: den Namen meines Gottes entweihen
  rationale: Wörtlich steht eine ungewöhnliche Verbindung mit »ergreifen/fassen«. Im Zusammenhang bezeichnet sie wahrscheinlich, Gottes Namen durch das eigene Tun zu verunehren; die Fußnote bewahrt die lexikalische Unsicherheit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. »Jahwe« gibt diesen im Haupttext als Namen wieder, ohne die rhetorische Frage umzudeuten.
- issue: Deutung von וְתָפַשְׂתִּי שֵׁם אֱלֹהָי
  choice: den Namen meines Gottes entweihen
  alternative: den Namen meines Gottes missbrauchen / ergreifen
  rationale: »Entweihen« lässt offen, ob die Verunehrung durch die Tat selbst oder durch einen damit verbundenen Gebrauch des Gottesnamens geschieht. Die alternative, stärker wörtliche Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die parallelen Gefahren von Überfluss und Armut bleiben knapp und ausgewogen formuliert; die rhetorische Frage wird unverändert bewahrt.
