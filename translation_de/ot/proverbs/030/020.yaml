  terminology: „Ehebruch begeht“ ist sachlich, präzise und weder archaisch noch unnötig etikettierend. „Nichts Unrechtes getan“ gibt אָוֶן angemessen wieder. Die Alternativfußnote mit „kein Unrecht begangen“ ist eine zulässige, etwas formellere nahe Wiedergabe.
