id: PRO.30.20
reference: Proverbs 30:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֵּ֤ן דֶּ֥רֶךְ אִשָּׁ֗ה מְנָ֫אָ֥פֶת אָ֭כְלָה וּ/מָ֣חֲתָה פִ֑י/הָ וְ֝/אָמְרָ֗ה לֹֽא פָעַ֥לְתִּי אָֽוֶן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/020.yaml
  text: 'So is the way of an adulterous woman: she eats and wipes her mouth and says[b][a], “I have done no wrong.”'
translation:
  language: de
  text: 'So ist es auch bei einer Frau, die Ehebruch begeht: Sie isst, wischt sich den Mund ab[a] und sagt: »Ich habe nichts Unrechtes getan.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild vom Essen und Abwischen des Mundes stellt beiläufiges Verbergen dar, als hätte die Tat keine erkennbare Spur hinterlassen.
    reason: cultural_note
  - marker: b
    text: 'Oder wörtlicher: »Ich habe kein Unrecht begangen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן דֶּרֶךְ
  choice: So ist es auch bei
  rationale: Die Wendung leitet den Vergleich mit dem zuvor beschriebenen unbegreiflichen Weg ein. Die natürliche deutsche Formulierung gibt den Sinn von דֶּרֶךְ als Verhaltensweise oder Vorgang wieder, ohne unnötig auf das konkrete Bild eines Pfades festgelegt zu sein.
- source_word: אִשָּׁה מְנָאָפֶת
  choice: einer Frau, die Ehebruch begeht
  rationale: Das Partizip bezeichnet eine Frau, die Ehebruch begeht. Die verbale Formulierung ist im heutigen Deutsch klar und vermeidet eine unnötig etikettierende Substantivierung.
- source_word: אָכְלָה
  choice: Sie isst
  rationale: Das hebräische Perfekt schildert hier eine für den Vergleich typische Handlung anschaulich; das deutsche Präsens entspricht dem sprichwörtlich-allgemeinen Charakter.
- source_word: וּמָחֲתָה פִיהָ
  choice: wischt sich den Mund ab
  rationale: Dies gibt das konkrete Bild des hebräischen Ausdrucks natürlich wieder. Das reflexive Pronomen ist im Deutschen idiomatisch erforderlich.
- source_word: וְאָמְרָה
  choice: und sagt
  rationale: Das Präsens setzt die anschauliche, typische Handlungsfolge fort.
- source_word: לֹא פָעַלְתִּי אָוֶן
  choice: Ich habe nichts Unrechtes getan
  rationale: אָוֶן kann Unrecht, Bosheit oder Frevel bezeichnen. »Nichts Unrechtes« ist modernes, natürliches Deutsch und bewahrt die moralische Aussage, während das Perfekt die vollendete Handlung von פָעַלְתִּי wiedergibt.
theological_decisions: []
