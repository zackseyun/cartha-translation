  source_fidelity: Die Übersetzung gibt den Vergleichsanschluss von כֵּן sowie דֶּרֶךְ als typische Verhaltensweise idiomatisch wieder. אִשָּׁה מְנָאָפֶת ist zutreffend als Frau, die Ehebruch begeht, wiedergegeben. Die präsentischen Verben bilden die sprichwörtlich-typische Handlungsfolge angemessen ab; die abschließende Selbstrechtfertigung bewahrt Sinn und Aspekt von לֹא פָעַלְתִּי אָוֶן.
