  text: דּ֤וֹר חֲרָב֣וֹת שִׁנָּי/ו֮ וּֽ/מַאֲכָל֪וֹת מְֽתַלְּעֹ֫תָ֥י/ו לֶ/אֱכֹ֣ל עֲנִיִּ֣ים מֵ/אֶ֑רֶץ וְ֝/אֶבְיוֹנִ֗ים מֵ/אָדָֽם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/014.yaml
  text: a generation whose teeth are swords[a], and whose fangs are knives[b], to devour the poor from the earth and the needy from among mankind.
translation:
  language: de
  text: Eine Generation, deren Zähne Schwerter und deren Reißzähne Messer sind, um die Armen von der Erde[a] und die Bedürftigen unter den Menschen[b] zu verschlingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Land“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vom Menschen“; אָדָם bezeichnet hier Menschen allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: eine Generation
  rationale: Das Wort bezeichnet eine Generation oder eine bestimmte Art von Menschen. Die knappe Nominalform bewahrt die zugespitzte Kennzeichnung innerhalb der Spruchreihe.
- source_word: חֲרָבוֹת
  choice: Schwerter
  rationale: Die übliche Bedeutung des Plurals bewahrt das konkrete und gewaltsame Bild.
- source_word: שִׁנָּיו
  choice: deren Zähne
  rationale: Das maskuline Singularsuffix bezieht sich kollektiv auf דּוֹר; im Deutschen stellt das Relativpronomen den Bezug natürlich her.
- source_word: מַאֲכָלוֹת
  choice: Messer
  rationale: Im Parallelismus mit Schwertern bezeichnet das Wort Schneidwerkzeuge; „Messer“ ist klar und wahrt das Bild.
- source_word: מְתַלְּעֹתָיו
  choice: deren Reißzähne
  rationale: Das Substantiv bezeichnet Kiefer- oder Fangzähne. „Reißzähne“ vermittelt im Deutschen die räuberische Bildsprache, ohne das Bild aufzulösen.
- source_word: לֶאֱכֹל
  choice: zu verschlingen
  rationale: Wörtlich bedeutet das Verb „essen“; in der Metapher für die gewaltsame Vernichtung Schutzloser gibt „verschlingen“ seine intensive, räuberische Kraft wieder.
- source_word: עֲנִיִּים
  choice: die Armen
  rationale: Hier steht die wirtschaftliche und gesellschaftliche Schutzlosigkeit im Vordergrund; „die Armen“ ist die klare, gebräuchliche Wiedergabe.
- source_word: מֵאֶרֶץ
  choice: von der Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Der Parallelismus mit dem allgemein menschlichen Ausdruck מֵאָדָם begünstigt hier den weiteren Sinn „Erde“, ohne die Alternative auszuschließen.
- source_word: אֶבְיוֹנִים
  choice: die Bedürftigen
  rationale: Die Wiedergabe unterscheidet den Ausdruck von עֲנִיִּים und erhält die leichte Bedeutungsvariation des Parallelismus.
- source_word: מֵאָדָם
  choice: aus der Menschheit
  rationale: אָדָם bezeichnet hier Menschen allgemein, nicht einen einzelnen Mann. „Menschheit“ gibt diesen generischen Bezug im heutigen Deutsch präzise wieder.
theological_decisions:
- issue: Generischer menschlicher Bezug von אָדָם
  choice: Menschheit
  alternative: Mensch; Menschenwelt
  rationale: Der Ausdruck bezieht sich allgemein auf die Menschheit und nicht geschlechtsspezifisch auf einen Mann. Die Übersetzung wahrt diesen Umfang, ohne eine besondere Lehrdeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Spruchform. Die drastische Metaphorik des Hebräischen bleibt erhalten; „Reißzähne“ macht die räuberische Bildwirkung natürlich verständlich. Die Fußnoten stehen an den jeweils sachlich zugehörigen Ausdrücken.
