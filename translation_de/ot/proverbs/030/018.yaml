  text: שְׁלֹשָׁ֣ה הֵ֭מָּה נִפְלְא֣וּ מִמֶּ֑/נִּי ו/ארבע לֹ֣א יְדַעְתִּֽי/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/018.yaml
  text: 'Three things are too wonderful for me[a]; four I do not understand:'
translation:
  language: de
  text: 'Drei Dinge sind zu wunderbar für mich[a], und vier verstehe ich nicht:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formaler: „Drei sind zu wunderbar für mich, und vier kenne ich nicht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה
  choice: Drei Dinge
  rationale: Die maskuline Kardinalzahl eröffnet die typische Zahlenreihe. Im Deutschen wird das im Hebräischen mitgedachte Bezugswort natürlich mit „Dinge“ ergänzt.
- source_word: הֵמָּה
  choice: sind
  rationale: Das selbstständige Pronomen betont das Subjekt („sie“). In der natürlichen deutschen Formulierung wird diese Funktion durch den Satzbau aufgenommen, ohne ein zusätzliches „sie“ einzufügen.
- source_word: נִפְלְאוּ
  choice: zu wunderbar
  rationale: Das Verb von פלא bezeichnet etwas Außergewöhnliches, Staunenswertes oder das Begreifen Übersteigendes. Zusammen mit מִמֶּנִּי wahrt „zu wunderbar für mich“ sowohl das Staunen als auch die Unergründlichkeit.
- source_word: מִמֶּנִּי
  choice: für mich
  rationale: Wörtlich etwa „von mir weg“ beziehungsweise „über mich hinaus“. In Verbindung mit נִפְלְאוּ bezeichnet es etwas, das die Erkenntnisfähigkeit des Sprechers übersteigt.
- source_word: וְאַרְבַּע
  choice: und vier
  rationale: Die Konjunktion und die Steigerung der hebräischen x/x+1-Zahlenformel werden ausdrücklich beibehalten.
- source_word: לֹא יְדַעְתִּים
  choice: verstehe ich nicht
  rationale: Formal bedeutet die Form „ich kenne/weiß sie nicht“. Im Zusammenhang geht es um das Erfassen oder Begreifen; „verstehe ich nicht“ gibt diesen Sinn idiomatisch wieder, wobei das Objektsuffix durch „vier“ aufgenommen wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die gestufte Zahlenformel und das Spannungsfeld zwischen Staunen und Nichtbegreifen bleiben erhalten.
