id: PRO.30.33
reference: Proverbs 30:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י מִ֪יץ חָלָ֡ב י֘וֹצִ֤יא חֶמְאָ֗ה וּֽ/מִיץ אַ֭ף י֣וֹצִיא דָ֑ם וּ/מִ֥יץ אַ֝פַּ֗יִם י֣וֹצִיא רִֽיב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/033.yaml
  text: For churning milk produces butter[a], and pressing the nose produces blood[b], and pressing anger produces strife.
translation:
  language: de
  text: Denn das Pressen der Milch bringt Butter[a] hervor, das Pressen der Nase bringt Blut hervor, und das Pressen des Zorns bringt Streit hervor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dickmilch“ beziehungsweise „geronnene Milch“. Das hebräische Wort bezeichnet allgemein ein durch Bearbeiten oder Gerinnen entstandenes Milchprodukt.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen besteht ein Wortspiel: Das Wort für „Nase“ kann auch „Zorn“ bedeuten. Außerdem steht in allen drei Aussagen dasselbe Wort für „Pressen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die begründende Erklärung zur vorausgehenden Mahnung ein und bewahrt den kausalen Zusammenhang.
- source_word: מִיץ
  choice: das Pressen
  rationale: Gibt den dreimal wiederholten Ausdruck einheitlich wieder und bewahrt so den zugespitzten Parallelismus, auch wenn die Verbindung mit Milch im Deutschen ungewohnt klingt.
- source_word: חָלָב
  choice: Milch
  rationale: Direkte und kontextuell eindeutige Wiedergabe.
- source_word: יוֹצִיא
  choice: bringt … hervor
  rationale: Gibt die kausative Bedeutung der Hifil-Form wieder und lässt sich in allen drei parallelen Aussagen verwenden.
- source_word: חֶמְאָה
  choice: Butter
  rationale: Traditionelle und im Bild des Verarbeitens von Milch gut verständliche Wiedergabe; das hebräische Wort kann jedoch auch ein anderes eingedicktes oder geronnenes Milchprodukt bezeichnen.
- source_word: אַף
  choice: Nase
  rationale: Hier verlangt das Hervortreten von Blut die konkrete körperliche Bedeutung.
- source_word: דָם
  choice: Blut
  rationale: Direkte und eindeutige Wiedergabe.
- source_word: אַפַּיִם
  choice: Zorn
  rationale: Die Form bezeichnet wörtlich die Nasenflügel beziehungsweise die Nase, wird aber idiomatisch für Zorn gebraucht. Die Sinnbedeutung wird im Text wiedergegeben und das hebräische Wortspiel in einer Fußnote erklärt.
- source_word: רִיב
  choice: Streit
  rationale: Natürliche, prägnante Wiedergabe für Auseinandersetzung oder Zwist im sprichwörtlichen Zusammenhang.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst strengem Parallelismus. Die ungewöhnliche Formulierung „Pressen der Milch“ erhält die dreifache Wiederholung des hebräischen Ausdrucks; die im Deutschen nicht nachbildbare Doppeldeutigkeit von „Nase/Zorn“ wird in der Fußnote offengelegt.
