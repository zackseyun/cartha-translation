  text: דּ֭וֹר מָה רָמ֣וּ עֵינָ֑י/ו וְ֝/עַפְעַפָּ֗י/ו יִנָּשֵֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/013.yaml
  text: There is a generation—how lofty are its eyes[a], and its eyelids are raised high.
translation:
  language: de
  text: Ein Geschlecht – wie hoch sind seine Augen, und seine Lider sind erhoben[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Geschlecht – wie hoch seine Augen sind und wie hoch seine Lider erhoben sind!“'
    reason: Alternative deutsche Wiedergabe der exklamativen Satzfügung; sie bewahrt die parallele Höhenmetaphorik ohne zusätzliche Intensivierung.
lexical_decisions:
- source_word: דּוֹר
  choice: Ein Geschlecht
  rationale: דּוֹר bezeichnet hier kollektiv eine Generation beziehungsweise eine Art von Menschen. „Ein Geschlecht“ bewahrt die knappe, ausrufartige Einführung und den kollektiven Singular.
- source_word: מָה
  choice: wie
  rationale: 'מָה ist hier exklamativ und bezeichnet den Grad: „wie hoch“.'
- source_word: רָמוּ
  choice: hoch
  rationale: Die Form von רום bezeichnet räumliche beziehungsweise übertragene Höhe. „hoch“ erhält das Bild erhobener, hochmütiger Augen, ohne die moralische Deutung ausdrücklich in den Text einzusetzen.
- source_word: עֵינָיו
  choice: seine Augen
  rationale: Das Suffix steht im maskulinen Singular und bezieht sich auf das kollektive דּוֹר. Der deutsche Singular bewahrt diese grammatische Gestaltung.
- source_word: וְעַפְעַפָּיו
  choice: und seine Lider
  rationale: עַפְעַפַּיִם bezeichnet konkret die Augenlider. „Lider“ bewahrt das poetische Körperbild und vermeidet eine deutende Wiedergabe wie „Blick“.
- source_word: יִנָּשֵׂאוּ
  choice: erheben sich
  rationale: Der Nifal von נשׂא kann hier als „werden erhoben“ beziehungsweise „erheben sich“ verstanden werden. Die reflexiv anmutende deutsche Form ist natürlich und hält das Bild der emporgehobenen Lider fest.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzform. „Geschlecht“ wird im biblisch-literarischen Sinn von Generation beziehungsweise Menschengruppe gebraucht; die konkrete Augenmetaphorik bleibt erhalten.
