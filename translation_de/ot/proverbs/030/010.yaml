source:
  edition: WLC
  text: אַל תַּלְשֵׁ֣ן עֶ֭בֶד אֶל אדנ/ו פֶּֽן יְקַלֶּלְ/ךָ֥ וְ/אָשָֽׁמְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/010.yaml
  text: Do not slander a servant to his master[a], lest he curse you and you become guilty.
translation:
  language: de
  text: Verleumde einen Sklaven nicht bei seinem Herrn, sonst verflucht er dich und du wirst schuldig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּלְשֵׁן
  choice: verleumde
  rationale: Das seltene Verb bezeichnet ein gegen jemanden gerichtetes Reden, besonders eine verleumderische oder böswillige Anschuldigung. „Verleumden“ gibt den moralisch negativen Sinn prägnant wieder.
- source_word: עֶבֶד
  choice: Sklaven
  rationale: עֶבֶד kann Diener oder Sklave bedeuten. Hier weist die Beziehung zu „seinem Herrn“ auf einen sozial abhängigen Menschen hin; „Sklave“ macht diese Verwundbarkeit transparent.
- source_word: אֶל אֲדֹנָיו
  choice: bei seinem Herrn
  rationale: Die Verbindung bezeichnet den Herrn als Adressaten der verleumderischen Rede. Im Deutschen ist „jemanden bei jemandem verleumden“ idiomatisch und bewahrt diese Relation.
- source_word: פֶּן
  choice: sonst
  rationale: פֶּן leitet die unerwünschte mögliche Folge der Warnung ein. „Sonst“ ist in einem modernen deutschen Spruch knapp und natürlich.
- source_word: יְקַלֶּלְךָ
  choice: verflucht er dich
  rationale: Das Piel von קלל bezeichnet hier ein Verfluchen und nicht bloß eine Beleidigung. Die Wiedergabe erhält die Schwere der angedrohten Reaktion.
- source_word: וְאָשָׁמְתָּ
  choice: und du wirst schuldig
  rationale: אשם bezeichnet das Schuldigwerden beziehungsweise das Auf-sich-Laden von Schuld. „Du wirst schuldig“ ist verständlich und lässt offen, auf welche Weise der Fluch und die Schuldfolge zusammenhängen.
theological_decisions:
- issue: Zusammenhang zwischen dem Fluch des Sklaven und der Schuld des Verleumders
  choice: 'Die beiden Folgen werden ohne erklärende Ergänzung nebeneinandergestellt: „verflucht er dich und du wirst schuldig“.'
  alternative: „damit sein Fluch dich nicht als schuldig erweist“ oder eine andere kausale Deutung.
  rationale: Der hebräische Text verbindet die Aussagen lediglich mit וְ und erläutert nicht, ob der Fluch Schuld bewirkt, offenlegt oder eine göttliche Ahndung nach sich zieht. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Knappes, würdiges und modernes Standarddeutsch im Stil eines Weisheitsspruchs. „Herr“ bezeichnet hier den menschlichen Herrn beziehungsweise Besitzer und ist nicht theologisch gemeint.
