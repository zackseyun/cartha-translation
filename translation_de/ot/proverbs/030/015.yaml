base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/015.yaml
  text: 'The leech has two daughters: “Give[a], give.” Three things are never satisfied; four never say[c][b], “Enough.”'
translation:
  language: de
  text: 'Der Blutegel[a] hat zwei Töchter: »Gib, gib!«[b] Drei werden niemals satt, vier sagen nie: »Genug!«[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann der hebräische Satzanfang lauten: »Für den Blutegel gibt es zwei Töchter.« Die Präposition kennzeichnet wahrscheinlich den Blutegel als Thema des Satzes.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Ruf »Gib, gib!« kann als Forderung der beiden Töchter nach immer mehr verstanden werden. Sinngemäß wäre auch möglich: »Mehr, mehr!«'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Vier sagen nicht: Es reicht.« Das letzte hebräische Wort wird hier als Ausdruck dafür verstanden, dass etwas genügt; gewöhnlich bedeutet es »Reichtum« oder »Vermögen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲלוּקָה
  choice: Der Blutegel
  rationale: עֲלוּקָה bezeichnet einen Blutegel. Das vorangestellte ל markiert hier wahrscheinlich das Thema; im natürlichen Deutschen wird die Wendung als Subjekt ausgedrückt.
- source_word: שְׁתֵּי בָנוֹת
  choice: hat zwei Töchter
  rationale: Der hebräische Satz ist verblos. „Hat“ ergänzt im Deutschen die notwendige Satzverbindung, während „Töchter“ das anschauliche Bild wörtlich bewahrt.
- source_word: הַב הַב
  choice: Gib, gib!
  rationale: Der doppelte, imperativartige Ruf verlangt nachdrücklich weiteres Geben. Die knappe Wiederholung des Hebräischen bleibt erhalten; „Mehr, mehr!“ wäre bereits deutender.
- source_word: שָׁלֹשׁ הֵנָּה לֹא תִשְׂבַּעְנָה
  choice: Drei werden niemals satt
  rationale: Die Formulierung gehört zum Zahlenspruch, dessen Aufzählung im folgenden Vers weitergeführt wird. „Werden niemals satt“ gibt die Verneinung von שׂבע idiomatisch und prägnant wieder.
- source_word: אַרְבַּע לֹא אָמְרוּ הוֹן
  choice: 'vier sagen nie: »Genug!«'
  rationale: הוֹן wird im Zusammenhang als Ausruf der Genügsamkeit beziehungsweise des Ausreichens verstanden, nicht in seiner häufigeren nominalen Bedeutung „Reichtum“.
