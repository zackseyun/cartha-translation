  text: זַרְזִ֣יר מָתְנַ֣יִם אוֹ תָ֑יִשׁ וּ֝/מֶ֗לֶךְ אַלְק֥וּם עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/031.yaml
  text: a strutting rooster[a], a he-goat[b], and a king against whom there is no rising up.
translation:
  language: de
  text: ein stolz schreitender Hahn[a] oder ein Ziegenbock und ein König, gegen den sich niemand erhebt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Bezeichnung ist selten und unsicher. Möglich sind auch „Windhund“, „Schlachtross“ oder allgemeiner „ein an den Hüften gegürtetes Tier“.
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Schlusswendung ist schwer zu deuten. Möglich ist auch: „ein König, dessen Heer bei ihm ist“.'
    reason: alternative_reading
lexical_decisions:
- source_word: זַרְזִיר מָתְנַיִם
  choice: stolz schreitender Hahn
  rationale: Die seltene und unsichere Wendung bezeichnet vermutlich ein Tier mit straffer, eindrucksvoller Haltung. „Hahn“ ist im Zusammenhang eine plausible Deutung; „stolz schreitend“ gibt die stattliche Bewegung wieder, ohne die wörtlich genannten „Hüften/Lenden“ unnatürlich ins Deutsche zu übertragen.
- source_word: אוֹ
  choice: oder
  rationale: Die masoretische Vokalisierung bedeutet ausdrücklich „oder“. Diese auffällige Verknüpfung wird bewahrt, statt sie stillschweigend zu „und“ zu glätten.
- source_word: תָיִשׁ
  choice: Ziegenbock
  rationale: Das hebräische Wort bezeichnet spezifisch eine männliche Ziege.
- source_word: מֶלֶךְ
  choice: König
  rationale: Direkte Wiedergabe der gewöhnlichen Bezeichnung für einen Herrscher.
- source_word: אַלְקוּם עִמּוֹ
  choice: gegen den sich niemand erhebt
  rationale: Die schwierige Schlusswendung wird als Aussage darüber verstanden, dass niemand gegen den König aufsteht. Die sprachliche Unsicherheit und eine wichtige alternative Deutung werden in der Fußnote offengelegt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anschauliche Bewegung der Reihe bleibt erhalten; zugleich werden die seltene Tierbezeichnung, die ungewöhnliche Konjunktion „oder“ und die mehrdeutige Schlusswendung nicht eingeebnet.
