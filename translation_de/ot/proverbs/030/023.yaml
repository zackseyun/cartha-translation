  text: under a hated woman when she is married[a], and a female servant when she inherits from her mistress.
translation:
  language: de
  text: unter einer verhassten Frau, wenn sie heiratet, und unter einer Sklavin, wenn sie ihre Herrin beerbt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn sie den Platz ihrer Herrin einnimmt“. Das hebräische Verb bedeutet häufig „erben“ oder „in Besitz nehmen“; hier kann damit auch gemeint sein, dass die Sklavin die Stellung ihrer Herrin übernimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: unter
  rationale: Die Präposition führt im Zusammenhang von Vers 21–23 den Zustand ein, unter dem die Erde erbebt. „Unter“ bewahrt dieses Bild und den Anschluss an den vorausgehenden Satz.
- source_word: שְׂנוּאָה
  choice: verhasste Frau
  rationale: Das passive Partizip bezeichnet eine Frau, die gehasst oder entschieden abgelehnt wird. „Verhasst“ gibt die Stärke des hebräischen Ausdrucks wieder.
- source_word: כִּי
  choice: wenn
  rationale: כִּי bezeichnet in beiden Satzgliedern die eintretende Situation; das deutsche „wenn“ gibt diesen zeitlich-situativen Sinn natürlich wieder.
- source_word: תִבָּעֵל
  choice: sie heiratet
  rationale: Der Nifal von בעל bezeichnet hier das Verheiratetwerden beziehungsweise den Eintritt in den Ehestand. „Sie heiratet“ ist im modernen Deutschen natürlich und bewahrt den Zustandswechsel, ohne einen Mann ausdrücklich in den Text einzuführen.
- source_word: שִׁפְחָה
  choice: Sklavin
  rationale: Das Wort bezeichnet eine weibliche Person in rechtlich und sozial abhängiger, unfreier Stellung. „Sklavin“ macht diesen Status deutlicher als das heute leicht verharmlosende „Magd“.
- source_word: תִירַשׁ
  choice: beerbt
  rationale: ירש bedeutet gewöhnlich „erben“ oder „in Besitz nehmen“. Mit dem direkten Objekt גְּבִרְתָּהּ lässt sich die Form knapp als „ihre Herrin beerbt“ wiedergeben; die mögliche Bedeutung einer Übernahme von Stellung oder Besitz wird in der Fußnote offengehalten.
- source_word: גְּבִרְתָּהּ
  choice: ihre Herrin
  rationale: Der Ausdruck bezeichnet die weibliche Hausherrin beziehungsweise sozial übergeordnete Frau; „ihre Herrin“ ist in diesem Verhältnis die prägnante deutsche Entsprechung.
