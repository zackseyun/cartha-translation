base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/027.yaml
  text: The locusts have no king[a], yet all of them march out in ranks.
translation:
  language: de
  text: Die Heuschrecken haben keinen König, und doch ziehen sie alle in geordneten Scharen aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie ziehen alle in Abteilungen aus“, das heißt, in Gruppen oder gegliederten Verbänden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: König
  rationale: Die direkte und natürliche Entsprechung bewahrt den Vergleich mit einem menschlichen Herrscher.
- source_word: אֵין לָאַרְבֶּה
  choice: Die Heuschrecken haben keinen
  rationale: Die hebräische Existenzkonstruktion mit ל wird im Deutschen idiomatisch als Besitz ausgedrückt.
- source_word: אַרְבֶּה
  choice: die Heuschrecken
  rationale: Das morphologisch singularische Substantiv ist hier kollektiv gebraucht; der deutsche Plural gibt den Schwarm natürlich wieder.
- source_word: וַיֵּצֵא
  choice: und doch ziehen … aus
  rationale: Der Singular stimmt mit dem Kollektivum überein. Der Plural folgt im Deutschen dem kollektiven Sinn; „doch“ macht den im Kontext liegenden Gegensatz deutlich.
- source_word: חֹצֵץ
  choice: in geordneten Scharen
  rationale: Das Partizip bezeichnet ein gegliedertes beziehungsweise in Abteilungen angeordnetes Ausziehen. Die Formulierung gibt die geordnete Bewegung wieder, ohne eine streng militärische Formation zu behaupten.
- source_word: כֻּלּוֹ
  choice: sie alle
  rationale: Das Suffix steht formal beim kollektiven Singular, bezeichnet sinngemäß jedoch die Gesamtheit der Heuschrecken.
