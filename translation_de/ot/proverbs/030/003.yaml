  text: וְ/לֹֽא לָמַ֥דְתִּי חָכְמָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים אֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/003.yaml
  text: And I have not learned wisdom[a], nor do I know the knowledge of the Holy One.
translation:
  language: de
  text: Ich habe keine Weisheit gelernt, und die Erkenntnis des Heiligen kenne ich nicht[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Erkenntnis von Heiligen“ oder „die Erkenntnis heiliger Wesen“. Die hebräische Form ist pluralisch; in den Sprüchen kann sie jedoch Gott als den Heiligen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָמַדְתִּי
  choice: habe … gelernt
  rationale: Das Perfekt 1. Person Singular bezeichnet die nicht erworbene Unterweisung; das deutsche Perfekt gibt den gegenwärtig fortwirkenden Zustand natürlich wieder.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist in den Sprüchen die übliche Bezeichnung für praktische, sittliche und geistige Weisheit.
- source_word: דַעַת
  choice: Erkenntnis
  rationale: „Erkenntnis“ ist im Deutschen für דַעַת in einer auf Gott bezogenen Genitivverbindung idiomatisch und bewahrt den Bezug zum folgenden Verb ידע.
- source_word: קְדֹשִׁים
  choice: des Heiligen
  rationale: Obwohl die hebräische Form morphologisch pluralisch ist, kann sie in der Weisheitsliteratur Gott bezeichnen; Sprüche 9,10 bietet eine enge Parallele. Die echte Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: אֵדָע
  choice: erlangt
  rationale: Das Verb ידע wird zusammen mit dem vorangestellten Objekt als Aussage über fehlende Erkenntnis verstanden. „Erkenntnis … erlangt“ ergibt natürliches modernes Deutsch und wahrt den Parallelismus, ohne ein unidiomatisches „Erkenntnis wissen“ zu erzeugen.
theological_decisions:
- issue: Bezeichnet קְדֹשִׁים Gott im Singular oder Heilige im Plural?
  choice: 'Singularer Gottesbezug: „des Heiligen“'
  alternative: 'Plural: „der Heiligen“ beziehungsweise „heiliger Wesen“'
  rationale: Die Parallele in Sprüche 9,10 spricht für einen Gottesbezug, doch die hebräische Pluralform lässt auch eine kollektive Deutung zu. Daher steht die wahrscheinlichere Lesart im Text und die alternative Lesart in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist knapp und bekenntnishaft. Die Wiederholung des hebräischen Verbs „wissen/erkennen“ lässt sich im Deutschen neben dem Substantiv „Erkenntnis“ nicht wörtlich und zugleich natürlich wiedergeben; „Erkenntnis … erlangt“ bewahrt den Sinn.
