  text: שְׁלֹשָׁ֣ה הֵ֭מָּה מֵיטִ֣יבֵי צָ֑עַד וְ֝/אַרְבָּעָ֗ה מֵיטִ֥בֵי לָֽכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/029.yaml
  text: 'There are three that are stately in stride[a], even four that are stately in walking:'
translation:
  language: de
  text: 'Drei sind es, die stattlich schreiten,

    ja, vier, die stattlich gehen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלֹשָׁה הֵמָּה
  choice: Drei sind es
  rationale: Gibt die hebräische Einleitungsformel eines Zahlenspruchs natürlich wieder und bewahrt zugleich deren prägnante Form.
- source_word: מֵיטִיבֵי צָעַד
  choice: die stattlich schreiten
  rationale: Die Partizipialform von יטב bezeichnet hier nicht moralische Güte, sondern ein besonders gutes oder beeindruckendes Schreiten. „Stattlich schreiten“ bewahrt die konkrete Bewegungsart und den würdevollen Eindruck.
- source_word: וְאַרְבָּעָה
  choice: ja, vier
  rationale: Das Waw markiert in der Zahlenspruchformel die steigernde Fortführung von drei zu vier; „ja“ bildet diese Klimax idiomatisch ab.
- source_word: מֵיטִבֵי לָכֶת
  choice: die eindrucksvoll einhergehen
  rationale: „Einhergehen“ gibt הלך konkret und mit einer zum Kontext passenden gehobenen Färbung wieder. „Eindrucksvoll“ vermeidet eine mechanische Wiederholung und drückt erneut das gelungene, bemerkenswerte Sichbewegen aus.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Parallelität und die steigernde Zahlenspruchformel bleiben erhalten; „stattlich“ und „eindrucksvoll“ beziehen sich auf die Erscheinung der Bewegung, nicht auf moralische Güte.
