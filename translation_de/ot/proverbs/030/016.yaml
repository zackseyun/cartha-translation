source:
  edition: WLC
  text: שְׁאוֹל֮ וְ/עֹ֪צֶ֫ר רָ֥חַם אֶ֭רֶץ לֹא שָׂ֣בְעָה מַּ֑יִם וְ֝/אֵ֗שׁ לֹא אָ֥מְרָה הֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/016.yaml
  text: Sheol[a], and a barren womb; earth, never satisfied with water; and fire, which never says[c][b], “Enough.”
translation:
  language: de
  text: 'das Totenreich[a] und ein verschlossener Mutterleib[b], die Erde, die vom Wasser nicht satt wird, und das Feuer, das niemals sagt: »Genug!«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Scheol«; das heißt: der Bereich der Toten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »der Verschluss des Mutterleibs«; gemeint ist ein Mutterleib, der keine Kinder hervorbringt.'
    reason: lexical_alternative
  - marker: c
    text: Das letzte hebräische Wort ist schwer zu deuten. Häufig versteht man es als »Genug!«; vorgeschlagen wurden auch Bedeutungen wie »Reichtum« oder »Besitz«.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: das Totenreich
  rationale: Der Ausdruck bezeichnet den Bereich der Toten und nicht nur ein einzelnes Grab. »Totenreich« gibt den hebräischen Begriff im heutigen Deutschen verständlich wieder; die Transliteration »Scheol« bleibt in der Fußnote als Alternative erhalten.
- source_word: עֹצֶר רָחַם
  choice: ein verschlossener Mutterleib
  rationale: Die Wendung bedeutet wörtlich etwa »Verschluss des Mutterleibs« und bezeichnet einen Mutterleib, der keine Kinder hervorbringt. Die bildhafte Formulierung wird bewahrt, ohne die Bedeutung auf das abstraktere »Unfruchtbarkeit« zu reduzieren.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: In der Reihe elementarer, unersättlicher Größen ist die Erde allgemein gemeint, nicht ein bestimmtes Land.
- source_word: לֹא שָׂבְעָה מַּיִם
  choice: die vom Wasser nicht satt wird
  rationale: Die Formulierung bildet das Verb »satt werden« eng und zugleich natürlich ab und bewahrt den personifizierenden Charakter der Dichtung.
- source_word: אֵשׁ
  choice: das Feuer
  rationale: Direkte und idiomatische Entsprechung.
- source_word: לֹא אָמְרָה הוֹן
  choice: 'das niemals sagt: »Genug!«'
  rationale: »Genug!« passt zum Parallelismus der unersättlichen Dinge und zur verbreiteten Deutung des schwierigen Schlussworts. »Niemals« bringt den sprichwörtlich-allgemeinen Sinn natürlich zum Ausdruck; die Unsicherheit wird in der Fußnote offengelegt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Reihung. Der Vers setzt die in Vers 15 begonnene Aufzählung fort; deshalb beginnt er ohne ergänzendes Prädikat. »Mutterleib« wahrt das konkrete Bild, während die Fußnote die idiomatische Bedeutung erklärt. Die schwierige Schlussform wird im Text kontextgemäß wiedergegeben, ihre echte lexikalische Unsicherheit jedoch ausdrücklich dokumentiert.
