  source_fidelity: 'Die Übersetzung gibt die vier Glieder der hebräischen Aufzählung sachgerecht wieder: שְׁאוֹל als »Totenreich«, עֹצֶר רָחַם als bildhaft »verschlossener Mutterleib«, die vom Wasser nicht gesättigte Erde und das nie »Genug!« sagende Feuer. Die schwierige Deutung von הוֹן wird nicht als sicher ausgegeben, sondern in der Fußnote angemessen kenntlich gemacht.'
