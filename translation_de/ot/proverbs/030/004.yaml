  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. Die Änderung zu „in ein Gewand gewickelt“ macht das dritte Bild klarer und natürlicher, ohne seine Konkretheit oder seinen poetischen Charakter abzuschwächen.
  terminology: „Himmel“, „Wind“, „hohlen Händen“, „Enden der Erde“ und „sein Sohn“ sind sachgerecht. Die Fußnoten bewahren sowohl die formale Pluralität von שָׁמַיִם als auch die textlich nicht festgelegte Identität des Sohnes und die Auslegungsbreite des Schlusses.
