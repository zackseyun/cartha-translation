  to: Wer ist zum Himmel[a] hinaufgestiegen und wieder herabgekommen? Wer hat den Wind in seinen hohlen Händen gesammelt? Wer hat das Wasser in ein Gewand gewickelt? Wer hat alle Enden der Erde aufgerichtet? Wie heißt er, und wie heißt sein Sohn?[b] Wenn du es weißt![c]
  rationale: 'Nur die Wiedergabe von צָרַר מַיִם בַּשִּׂמְלָה wird behutsam angepasst: „gewickelt“ vermittelt das im Hebräischen enthaltene Bild des Einhüllens bzw. Zusammenbindens mit einem Gewand idiomatischer als „gebunden“. Alle übrigen Formulierungen und Fußnoten können bestehen bleiben.'
