reference: Proverbs 30:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִ֤י עָלָֽה שָׁמַ֨יִם וַ/יֵּרַ֡ד מִ֤י אָֽסַף ר֨וּחַ בְּ/חָפְנָ֡י/ו מִ֤י צָֽרַר מַ֨יִם בַּ/שִּׂמְלָ֗ה מִ֭י הֵקִ֣ים כָּל אַפְסֵי אָ֑רֶץ מַה שְּׁמ֥/וֹ וּ/מַֽה שֶּׁם בְּ֝נ֗/וֹ כִּ֣י תֵדָֽע־׀־׀־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/004.yaml
  text: Who has gone up to heaven and come down? Who has gathered the wind in his hands? Who has wrapped the waters in a garment? Who has established all the ends of the earth? What is his name[a], and what is his son's name[c][b], surely you know!
translation:
  language: de
  text: Wer ist zum Himmel[a] hinaufgestiegen und wieder herabgekommen? Wer hat den Wind in seinen hohlen Händen gesammelt? Wer hat das Wasser in ein Gewand gewickelt? Wer hat alle Enden der Erde aufgerichtet? Wie heißt er, und wie heißt sein Sohn?[b] Wenn du es weißt![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „zu den Himmeln“. Das hebräische Wort שָׁמַיִם hat eine formal plurale Form.'
    reason: lexical_alternative
  - marker: b
    text: In christlicher Auslegung wurde „sein Sohn“ häufig christologisch verstanden; der hebräische Text selbst identifiziert den Sohn jedoch nicht ausdrücklich.
    reason: theological_tension
  - marker: c
    text: 'Auch möglich: „Du weißt es doch!“ Die hebräische Wendung kann als ironische Herausforderung oder als bekräftigende Aussage verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה ... וַיֵּרַד
  choice: ist ... hinaufgestiegen und wieder herabgekommen
  rationale: Die deutschen Perfektformen geben die abgeschlossene Verbfolge in der rhetorischen Frage natürlich wieder; „wieder“ verdeutlicht die Gegenbewegung, ohne die Aussage inhaltlich zu erweitern.
- source_word: שָׁמַיִם
  choice: Himmel
  rationale: Der Singular ist im modernen Deutschen die idiomatische Bezeichnung für den Himmelsraum; der formal plurale Ausdruck wird in einer Fußnote kenntlich gemacht.
- source_word: אָסַף רוּחַ בְּחָפְנָיו
  choice: den Wind in seinen hohlen Händen gesammelt
  rationale: רוּחַ bezeichnet im kosmischen Zusammenhang am ehesten den Wind. חָפְנָיו meint die gewölbten beziehungsweise hohlen Hände; diese Wiedergabe bewahrt das anschauliche Bild genauer als das missverständliche „Fäuste“.
- source_word: צָרַר מַיִם בַּשִּׂמְלָה
  choice: das Wasser in ein Gewand gebunden
  rationale: צָרַר bezeichnet das Zusammenbinden oder Bündeln; שִׂמְלָה ist ein Gewand oder Mantel. Die Formulierung bleibt bildhaft und zugleich verständlich.
- source_word: הֵקִים כָּל אַפְסֵי אָרֶץ
  choice: alle Enden der Erde aufgerichtet
  rationale: הֵקִים kann „aufrichten“, „hinstellen“ oder „fest gründen“ bedeuten. „Aufgerichtet“ bewahrt das kosmische Schöpfungsbild und den gehobenen Ton.
- source_word: מַה שְּׁמוֹ וּמַה שֶּׁם בְּנוֹ
  choice: Wie heißt er, und wie heißt sein Sohn?
  rationale: Die natürliche deutsche Namensfrage gibt beide hebräischen Teilsätze knapp wieder und behält „Sohn“ ausdrücklich bei.
- source_word: כִּי תֵדָע
  choice: Wenn du es weißt!
  rationale: Die konditionale Wiedergabe bringt die ironische Herausforderung prägnant zum Ausdruck. Da כִּי hier auch anders nuanciert werden kann, wird die Alternative in einer Fußnote bewahrt.
theological_decisions:
- issue: Identität des „Sohnes“
  choice: Die Bezeichnung „sein Sohn“ bleibt ohne nähere Identifizierung stehen.
  alternative: Die Wendung ausdrücklich christologisch auf Christus beziehen.
  rationale: Der hebräische Text nennt den Sohn, identifiziert ihn jedoch nicht. Die Übersetzung bewahrt daher die mögliche theologische Resonanz, ohne eine spätere Deutung in den Wortlaut einzutragen.
- issue: Aussagekraft des Schlusssatzes
  choice: 'Als ironische Bedingung und Herausforderung: „Wenn du es weißt!“'
  alternative: 'Als bekräftigende Aussage: „Du weißt es doch!“'
  rationale: Der Zusammenhang rhetorischer Fragen legt eine herausfordernde Lesart nahe; die Partikel כִּי lässt jedoch auch eine bekräftigende Nuance zu, die deshalb in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rhetorischer Reihung. Die kosmischen Bilder bleiben konkret; altertümliche oder konfessionell festgelegte Formulierungen werden vermieden.
