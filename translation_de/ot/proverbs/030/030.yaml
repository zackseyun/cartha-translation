translation:
  language: de
  text: der Löwe[a], mächtig unter den Tieren, der vor nichts zurückweicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Löwe, mächtig unter den Tieren“. Das Hebräische verwendet eine poetische Bezeichnung für den Löwen und lässt offen, ob ein einzelner Löwe oder der Löwe als typischer Vertreter seiner Art gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  choice: der Löwe
  rationale: לַיִשׁ ist eine poetische Bezeichnung für den Löwen. Obwohl im Hebräischen kein bestimmter Artikel steht, bezeichnet „der Löwe“ im Deutschen natürlich und sprichwörtlich den Löwen als typischen Vertreter seiner Art.
- source_word: גִּבּוֹר
  choice: mächtig
  rationale: גִּבּוֹר bezeichnet Stärke, Macht oder besondere Tüchtigkeit. „Mächtig“ bewahrt den gehobenen, knappen Ton, ohne das Wort unnötig militärisch zu deuten.
- source_word: בַּבְּהֵמָה
  choice: unter den Tieren
  rationale: בְּהֵמָה ist hier kollektiv und bezeichnet die Tierwelt. Die Präposition ב drückt die Stellung innerhalb dieser Gruppe aus; „unter den Tieren“ gibt dies im Deutschen klar wieder.
- source_word: וְלֹא יָשׁוּב
  choice: der … nicht zurückweicht
  rationale: שׁוּב bedeutet wörtlich „umkehren“ oder „zurückkehren“ und beschreibt hier, dass der Löwe sich nicht zurückzieht. „Nicht zurückweichen“ bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: מִפְּנֵי כֹל
  choice: vor niemandem
  rationale: מִפְּנֵי bezeichnet hier das Zurückweichen angesichts eines Gegenübers; כֹל hat umfassende Bedeutung. Im Kontext der Tiere gibt „vor niemandem“ die furchtlose, uneingeschränkte Aussage idiomatisch wieder.
