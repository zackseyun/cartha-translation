  text: שְׁ֭תַּיִם שָׁאַ֣לְתִּי מֵ/אִתָּ֑/ךְ אַל תִּמְנַ֥ע מִ֝מֶּ֗/נִּי בְּ/טֶ֣רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/007.yaml
  text: 'Two things I have asked of you[a]; do not withhold them from me before I die:'
translation:
  language: de
  text: 'Zwei Dinge habe ich von dir erbeten[a]; verweigere sie mir nicht, bevor ich sterbe:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Zwei habe ich von dir erbeten.« Das Wort »Dinge« ist im Hebräischen nur sinngemäß enthalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתַּיִם
  choice: Zwei Dinge
  rationale: Das feminine Zahlwort »zwei« steht elliptisch für zwei Bitten oder Anliegen. »Dinge« wird für natürliches Deutsch ergänzt; der folgende Vers benennt beide.
- source_word: שָׁאַלְתִּי
  choice: habe ich … erbeten
  rationale: Das Qal-Perfekt bezeichnet eine bereits vorgebrachte, weiterhin geltende Bitte. Das deutsche Perfekt passt zur Gebetssituation; »erbeten« bringt das begehrte Gewähren deutlicher zum Ausdruck als bloßes »gefragt«.
- source_word: מֵאִתָּךְ
  choice: von dir
  rationale: Die Präpositionalverbindung bezeichnet die Person, von der die erbetene Gabe erwartet wird. »Von dir erbeten« ist im Deutschen idiomatisch.
- source_word: אַל תִּמְנַע
  choice: verweigere … nicht
  rationale: אַל mit der Imperfektform drückt hier eine direkte Bitte beziehungsweise ein Verbot aus. מנע bedeutet etwas zurückzuhalten oder nicht zu gewähren; »verweigern« ist in diesem Satz natürlich und bewahrt den Sinn.
- source_word: מִמֶּנִּי
  choice: mir
  rationale: Beim deutschen Verb »verweigern« wird die betroffene Person idiomatisch im Dativ ausgedrückt; das Pronomen »sie« nimmt die zwei erbetenen Dinge auf.
- source_word: בְּטֶרֶם אָמוּת
  choice: bevor ich sterbe
  rationale: Die temporale Verbindung setzt den Tod des Sprechers als Grenze für die Erfüllung seiner Bitte. »Bevor ich sterbe« ist klar, modern und genau.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung wahrt die Hervorhebung der Zahl zwei; der Doppelpunkt zeigt, dass die beiden Bitten im folgenden Vers genannt werden.
