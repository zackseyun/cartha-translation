source:
  edition: WLC
  text: דּ֭וֹר אָבִ֣י/ו יְקַלֵּ֑ל וְ/אֶת אִ֝מּ֗/וֹ לֹ֣א יְבָרֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/011.yaml
  text: There is a generation that curses its father and does not bless its mother[a][b].
translation:
  language: de
  text: Es gibt eine Generation, die ihren Vater verflucht und ihre Mutter nicht segnet.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen im Hebräischen männliche Singularsuffixe: „seinen Vater … seine Mutter“. Im Deutschen beziehen sich „ihren“ und „ihre“ grammatisch auf das feminine Kollektivwort „Generation“.'
    reason: lexical_alternative
  - marker: b
    text: '„Nicht segnet“ kann in diesem Zusammenhang auch bedeuten: „nicht gut von ihr spricht“ oder „sie nicht ehrt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: Generation
  rationale: דּוֹר bezeichnet eine Generation oder eine durch gemeinsame Merkmale gekennzeichnete Gruppe. „Generation“ bewahrt hier den wiederkehrenden Aufbau von Sprüche 30,11–14.
- source_word: אָבִיו
  choice: ihren Vater
  rationale: Das hebräische Suffix steht in der 3. Person Maskulinum Singular. Im Deutschen richtet sich das Possessivpronomen natürlich nach dem femininen Kollektivsubstantiv „Generation“.
- source_word: יְקַלֵּל
  choice: verflucht
  rationale: Das Piel von קלל bezeichnet hier ein Verfluchen oder schweres Verächtlichmachen. „Verflucht“ gibt die Schärfe der Aussage direkt wieder.
- source_word: וְאֶת
  choice: und
  rationale: וְ wird mit „und“ wiedergegeben; אֶת ist der hebräische Akkusativmarker und erhält im Deutschen keine eigene Entsprechung.
- source_word: אִמּוֹ
  choice: ihre Mutter
  rationale: Wie bei אָבִיו wird das singularische Possessivverhältnis bewahrt und das Pronomen im Deutschen grammatisch auf „Generation“ bezogen.
- source_word: לֹא יְבָרֵךְ
  choice: nicht segnet
  rationale: ברך bedeutet im Piel gewöhnlich „segnen“. Die direkte Wiedergabe erhält den bewussten Gegensatz zu „verflucht“, auch wenn im Zusammenhang zugleich anerkennendes Reden und Ehren mitschwingt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Einleitung „Es gibt“ macht die nominal eröffnete Aussage im Deutschen natürlich; der Relativsatz bewahrt den Charakter einer beschriebenen Menschengruppe und die Parallelität des hebräischen Verses.
