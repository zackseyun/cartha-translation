  text: Rock badgers are a people not mighty[a], yet they make their home in the crag.
translation:
  language: de
  text: Die Klippschliefer sind ein Volk ohne große Kraft, und doch richten sie ihre Wohnung im Felsen ein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁפַנִּים
  choice: Klippschliefer
  rationale: Das hebräische Wort bezeichnet sehr wahrscheinlich Schliefer. „Klippschliefer“ ist im modernen Deutschen die präzise und verständliche Tierbezeichnung und passt zum felsigen Lebensraum des Verses.
- source_word: עַם
  choice: ein Volk
  rationale: Die wörtliche Gruppenbezeichnung „Volk“ bewahrt die auffällige, sprichwörtliche Ausdrucksweise des Hebräischen, obwohl sie hier auf Tiere bezogen ist.
- source_word: לֹא עָצוּם
  choice: ohne große Kraft
  rationale: Die Formulierung gibt den Mangel an Stärke oder Macht natürlich wieder, ohne die Aussage zu übersteigern.
- source_word: וַיָּשִׂימוּ
  choice: bauen sie
  rationale: Das Verb bedeutet grundsätzlich „setzen, anbringen“. In Verbindung mit „Haus“ gibt „bauen“ den gemeinten Vorgang im Deutschen idiomatisch wieder; das Präsens entspricht dem allgemeingültigen Charakter des Spruchs.
- source_word: בַסֶּלַע
  choice: im Fels
  rationale: „Fels“ bewahrt den Singular und bezeichnet knapp den schützenden felsigen Ort.
- source_word: בֵּיתָם
  choice: ihr Haus
  rationale: „Haus“ entspricht der konkreten hebräischen Metapher und bleibt auch für den Unterschlupf der Tiere gut verständlich.
