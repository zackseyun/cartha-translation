  yaml_path: translation/ot/proverbs/030/024.yaml
  text: 'Four are small on the earth[a], yet they are exceedingly wise:'
translation:
  language: de
  text: 'Vier sind klein auf der Erde, und doch sind sie überaus weise[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »weise, weise gemacht«; eine nachdrückliche Wendung im Sinn von »sehr weise« oder »überaus weise«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה
  choice: Vier
  rationale: Die bloße Kardinalzahl bewahrt die knappe Form des hebräischen Zahlenspruchs; ein ergänztes »Es gibt« ist im Deutschen nicht nötig.
- source_word: קְטַנֵּי אָרֶץ
  choice: klein auf der Erde
  rationale: Die Wendung bezeichnet wörtlich die »Kleinen der Erde« beziehungsweise solche, die auf der Erde klein sind. Die Übersetzung wahrt die adjektivische Aussage, ohne das im Kontext erschließbare Wort »Tiere« vorwegzunehmen.
- source_word: וְהֵמָּה
  choice: und doch sind sie
  rationale: Das selbstständige Pronomen hebt das Subjekt hervor; zusammen mit der Konjunktion bringt es hier den Gegensatz zwischen Kleinheit und Weisheit zum Ausdruck.
- source_word: חֲכָמִים מְחֻכָּמִים
  choice: überaus weise
  rationale: Die Verbindung aus »weise« und einem Pual-Partizip derselben Wurzel ist eine emphatische Formulierung. »Überaus weise« gibt ihre verstärkende Wirkung in natürlichem Deutsch wieder.
