source:
  edition: WLC
  text: צַדִּ֣יק הָ/רִאשׁ֣וֹן בְּ/רִיב֑/וֹ יבא רֵ֝עֵ֗/הוּ וַ/חֲקָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/017.yaml
  text: The first to present his case seems right[a], until his neighbor comes and examines him.
translation:
  language: de
  text: Wer als Erster seinen Fall darlegt, scheint im Recht zu sein[a] – bis der andere kommt und ihn prüft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Der Erste in seinem Streit ist im Recht – bis der andere kommt und ihn prüft.«'
    reason: Die Form צַדִּיק kann ausdrücklich »ist gerecht« beziehungsweise »ist im Recht« bedeuten; der zweite Halbvers zeigt jedoch, dass dieses erste Urteil noch überprüft werden muss.
lexical_decisions:
- source_word: צַדִּיק
  choice: scheint im Recht zu sein
  rationale: Das Adjektiv bedeutet gewöhnlich »gerecht« oder »im Recht«. Im Zusammenhang eines Rechtsstreits bezeichnet es hier die zunächst überzeugende Rechtsposition; »scheint« macht die durch den zweiten Halbvers relativierte Ersteinschätzung natürlich verständlich.
- source_word: הָרִאשׁוֹן
  choice: Wer als Erster
  rationale: Gemeint ist die Partei, die in einem Streitfall zuerst zu Wort kommt. Die deutsche Formulierung bildet den vergleichenden Aufbau des Spruchs knapp und idiomatisch ab.
- source_word: בְּרִיבוֹ
  choice: seinen Fall darlegt
  rationale: רִיב kann einen Streit, eine Auseinandersetzung oder einen Rechtsfall bezeichnen. »seinen Fall darlegt« gibt den forensischen Zusammenhang verständlich wieder, ohne ihn auf ein förmliches Gerichtsverfahren einzuengen.
- source_word: יבא
  choice: kommt
  rationale: Das Verb bedeutet wörtlich »kommt«. Seine Stellung im hebräischen Konsonantentext ist textlich beziehungsweise syntaktisch schwierig; die Übersetzung folgt der üblichen Lesung, nach der das Kommen zur zweiten Partei gehört.
- source_word: רֵעֵהוּ
  choice: der andere
  rationale: רֵעַ kann »Nächster«, »Gefährte« oder die jeweilige Gegenpartei bedeuten. Im Streitkontext ist »der andere« im Deutschen natürlich und vermeidet die irreführende Vorstellung eines freundschaftlichen Verhältnisses.
- source_word: וַחֲקָרוֹ
  choice: und ihn prüft
  rationale: חקר bedeutet »gründlich untersuchen«, »erforschen« oder »befragen«. »prüft« bewahrt die Breite des Ausdrucks und lässt sowohl eine kritische Befragung als auch die Prüfung der vorgebrachten Behauptungen zu.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Spruchsprache. Der Gedankenstrich markiert die pointierte Wende des hebräischen Parallelismus. Die rechtliche Färbung bleibt erkennbar, ohne unnötig technische Gerichtssprache wie »Kreuzverhör« zu verwenden.
