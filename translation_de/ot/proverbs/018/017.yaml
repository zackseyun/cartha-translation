  verdict: approve
  source_fidelity: 'Die Übersetzung trifft den Sinn des masoretischen Textes gut: Der zuerst auftretende Streitbeteiligte wirkt zunächst im Recht; erst das Auftreten und Prüfen durch die Gegenpartei relativiert diesen Eindruck. „seinen Fall darlegt“ gibt die forensisch-streitige Nuance von בְּרִיבוֹ idiomatisch wieder, ohne ein formelles Gerichtsverfahren vorauszusetzen. Die syntaktisch nicht ganz einfache Stellung von יבא wird sachgerecht im zweiten Halbvers mit „bis der andere kommt“ wiedergegeben.'
  naturalness: „Wer als Erster seinen Fall darlegt, scheint im Recht zu sein – bis der andere kommt und ihn prüft“ ist natürliches modernes Standarddeutsch und bewahrt die knappe, pointierte Spruchform. Der Gedankenstrich unterstützt die Wendung des Sprichworts, ohne den Sinn zu verändern.
  terminology: „im Recht“ ist für צַדִּיק im Streitkontext treffend; „scheint“ vermittelt angemessen die vom zweiten Halbvers enthüllte Vorläufigkeit. „Fall“, „der andere“ und „prüft“ sind registergerecht und weder unnötig technisch noch zu allgemein. Die Fußnote stellt die mögliche stärker zuständliche Wiedergabe von צַדִּיק transparent dar.
