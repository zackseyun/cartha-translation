  text: אִ֣ישׁ רֵ֭עִים לְ/הִתְרֹעֵ֑עַ וְ/יֵ֥שׁ אֹ֝הֵ֗ב דָּבֵ֥ק מֵ/אָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/024.yaml
  text: A man of many companions may come to ruin[a], but there is a friend who sticks closer than a brother.
translation:
  language: de
  text: Ein Mann mit vielen Gefährten kann zugrunde gehen[a], doch es gibt einen Freund, der einem nähersteht als ein Bruder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Mann mit vielen Gefährten muss sich freundlich erweisen.“ Das hebräische Verb לְהִתְרֹעֵעַ ist schwierig und wird unterschiedlich verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: Ein Mann
  rationale: Gibt den maskulinen Singular des Hebräischen genau und in natürlichem Deutsch wieder.
- source_word: רֵעִים
  choice: viele Gefährten
  rationale: „Gefährten“ wahrt den Unterschied zu dem ausdrücklich loyalen „Freund“ im zweiten Halbvers und kann einen weiteren, weniger engen Bekanntenkreis bezeichnen.
- source_word: לְהִתְרֹעֵעַ
  choice: kann zugrunde gehen
  rationale: Das schwierige Verb wird hier im Sinn von Schaden, Zerbrechen oder Verderben verstanden. „Kann“ erhält den sprichwörtlichen Charakter, ohne ein ausnahmsloses Schicksal zu behaupten; die andere verbreitete Deutung steht in der Fußnote.
- source_word: וְיֵשׁ
  choice: doch es gibt
  rationale: „Doch“ macht den inhaltlichen Gegensatz zwischen zahlreichen Gefährten und einem verlässlich nahen Freund deutlich.
- source_word: אֹהֵב
  choice: einen Freund
  rationale: Das substantivierte Partizip bezeichnet hier idiomatisch einen liebenden beziehungsweise zugewandten Freund.
- source_word: דָּבֵק
  choice: der einem näher bleibt
  rationale: Die Form von דבק beschreibt beständige enge Verbundenheit. „Näher bleibt“ klingt im Deutschen natürlich und bewahrt sowohl Nähe als auch Treue.
- source_word: מֵאָח
  choice: als ein Bruder
  rationale: 'Die Präposition wird komparativ verstanden: Die Verbundenheit des Freundes übertrifft sogar die eines Bruders.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gegenüberstellung von vielen „Gefährten“ und einem eng verbundenen „Freund“ bleibt erhalten; die echte lexikalische Unsicherheit des ersten Halbverses wird nicht verdeckt.
