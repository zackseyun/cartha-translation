source:
  edition: WLC
  text: גַּ֭ם מִתְרַפֶּ֣ה בִ/מְלַאכְתּ֑/וֹ אָ֥ח ה֝֗וּא לְ/בַ֣עַל מַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/009.yaml
  text: Even one who is slack in his work is brother to a master of destruction[a].
translation:
  language: de
  text: Auch wer bei seiner Arbeit nachlässig ist, ist ein Bruder des Verderbers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist ein Bruder dessen, der Verderben anrichtet“. Die hebräische Wendung kann einen Verderber bezeichnen oder allgemeiner einen Menschen, der durch zerstörerisches Handeln gekennzeichnet ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Das Wort führt die zugespitzte Gleichstellung additiv und nachdrücklich ein. „Auch“ klingt im Deutschen natürlich und bewahrt diese Funktion.
- source_word: מִתְרַפֶּה
  choice: wer … nachlässig ist
  rationale: Das Hitpael-Partizip von רפה bezeichnet jemanden, der sich bei seiner Tätigkeit gehen lässt beziehungsweise nachlässig handelt, nicht bloß jemanden, dem die Fähigkeit fehlt.
- source_word: בִמְלַאכְתּוֹ
  choice: bei seiner Arbeit
  rationale: מְלָאכָה bezeichnet Arbeit, Tätigkeit oder Aufgabe. „Bei seiner Arbeit“ gibt den Bereich der Nachlässigkeit idiomatisch wieder.
- source_word: אָח הוּא
  choice: ist ein Bruder
  rationale: Die konkrete Verwandtschaftsmetapher beschreibt Wesensnähe beziehungsweise Zusammengehörigkeit und wird nicht zu einem abstrakten Vergleich abgeschwächt.
- source_word: לְבַעַל מַשְׁחִית
  choice: des Verderbers
  rationale: בַּעַל mit מַשְׁחִית bezeichnet hier einen von zerstörerischem Handeln geprägten Menschen. „Verderber“ ist prägnant und bewahrt den möglichen Personenbezug; die alternative, stärker eigenschaftsbezogene Deutung wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Die Verwandtschaftsmetapher des Hebräischen bleibt erhalten; „nachlässig“ vermeidet die Engführung auf bloße Trägheit.
