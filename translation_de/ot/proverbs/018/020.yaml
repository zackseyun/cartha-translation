  text: מִ/פְּרִ֣י פִי אִ֭ישׁ תִּשְׂבַּ֣ע בִּטְנ֑/וֹ תְּבוּאַ֖ת שְׂפָתָ֣י/ו יִשְׂבָּֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/020.yaml
  text: From the fruit of a man's mouth his stomach is satisfied[a]; he is satisfied by the produce of his lips.
translation:
  language: de
  text: Von der Frucht des Mundes eines Mannes wird sein Bauch satt[a]; vom Ertrag seiner Lippen wird er satt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Durch die Frucht des Mundes eines Mannes wird sein Bauch gefüllt; durch den Ertrag seiner Lippen wird er gefüllt.“'
    reason: 'Lexikalische Alternative: מִן kann Mittel statt Quelle bezeichnen, und שׂבע kann hier mit „gefüllt werden“ wiedergegeben werden.'
lexical_decisions:
- source_word: מִפְּרִי
  choice: Von der Frucht
  rationale: מִן bezeichnet hier Quelle oder Mittel. „Von der Frucht“ bewahrt das Bild und lässt diese Bedeutungsbreite bestehen.
- source_word: פִי
  choice: des Mundes
  rationale: Die wörtliche Wiedergabe erhält das Sprachbild und den Parallelismus zu „Lippen“.
- source_word: אִישׁ
  choice: eines Mannes
  rationale: Das grammatisch maskuline Singularwort wird entsprechend der Ausgangsform wiedergegeben; der sprichwörtlich allgemeine Charakter bleibt aus dem Kontext erkennbar.
- source_word: תִּשְׂבַּע / יִשְׂבָּע
  choice: wird … satt
  rationale: שׂבע bedeutet „satt werden/sein, gesättigt werden“. Die identische Wiedergabe an beiden Stellen bewahrt die markante Wiederholung; das Präsens gibt die allgemeine Aussage des Sprichworts wieder.
- source_word: בִּטְנוֹ
  choice: sein Bauch
  rationale: בֶּטֶן bezeichnet hier den Bauch beziehungsweise das Innere. „Bauch“ hält das konkrete Körperbild aufrecht und klingt im modernen Deutschen natürlich.
- source_word: תְּבוּאַת
  choice: vom Ertrag
  rationale: תְּבוּאָה bezeichnet Ertrag oder Ernteertrag. „Ertrag“ bewahrt die landwirtschaftliche Bildwelt und passt zu „Frucht“.
- source_word: שְׂפָתָיו
  choice: seiner Lippen
  rationale: Die wörtliche Wiedergabe erhält die Metonymie für das Reden und den Parallelismus mit „Mund“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der konkrete Parallelismus von Mund/Lippen und Frucht/Ertrag sowie die Wiederholung des Verbs שׂבע bleiben erhalten.
