  text: מִ֭דְיָנִים יַשְׁבִּ֣ית הַ/גּוֹרָ֑ל וּ/בֵ֖ין עֲצוּמִ֣ים יַפְרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/018.yaml
  text: The lot puts an end to disputes[a], and separates between the mighty.
translation:
  language: de
  text: Das Los beendet Streitigkeiten und trennt Mächtige voneinander.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Los schlichtet Streitigkeiten und entscheidet zwischen Mächtigen.«'
    reason: 'Lexikalische Alternative: Im Zusammenhang kann das konkrete »beenden/trennen« die Wirkung einer verbindlichen Entscheidung zwischen streitenden Parteien ausdrücken.'
lexical_decisions:
- source_word: מִדְיָנִים
  choice: Streitigkeiten
  rationale: Der Plural bezeichnet Auseinandersetzungen oder strittige, gegebenenfalls rechtliche Konflikte. »Streitigkeiten« ist im modernen Deutsch natürlich und lässt beide Bereiche offen.
- source_word: יַשְׁבִּית
  choice: beendet
  rationale: 'Der Hifil von שבת hat hier kausative Bedeutung: etwas zum Aufhören bringen. »Beendet« gibt dies knapp und passend zum Spruchstil wieder.'
- source_word: הַגּוֹרָל
  choice: das Los
  rationale: גורל bezeichnet das zur Entscheidungsfindung verwendete Los. »Das Los« ist die übliche knappe Wiedergabe.
- source_word: וּבֵין
  choice: voneinander
  rationale: בין bezeichnet hier die beteiligten Seiten. In Verbindung mit »trennen« gibt »voneinander« die hebräische Beziehung idiomatisch wieder.
- source_word: עֲצוּמִים
  choice: Mächtige
  rationale: Das substantivierte Adjektiv meint starke oder einflussreiche Personen. »Mächtige« bewahrt die knappe Form, ohne ein Geschlecht ausdrücklich festzulegen.
- source_word: יַפְרִיד
  choice: trennt
  rationale: Der Hifil von פרד bedeutet grundsätzlich »trennen« oder »auseinanderbringen«. »Trennt« bewahrt das konkrete hebräische Bild; die im Zusammenhang mögliche Bedeutung einer Entscheidung zwischen Parteien wird in der Fußnote genannt.
