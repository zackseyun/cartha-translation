  text: מִגְדַּל עֹ֭ז שֵׁ֣ם יְהוָ֑ה בּֽ/וֹ יָר֖וּץ צַדִּ֣יק וְ/נִשְׂגָּֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/010.yaml
  text: The name of Yahweh is a strong tower[c][b][a]; the righteous runs into it and is set securely on high.
translation:
  language: de
  text: Der Name Jahwes ist ein starker Turm[a]; der Gerechte läuft hinein und steht sicher in der Höhe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch JHWH; traditionell: »der HERR«.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »und ist geschützt« beziehungsweise »und wird unerreichbar gemacht«. Das hebräische Verb verbindet die Vorstellung einer hohen, unzugänglichen Lage mit Sicherheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: ein starker Turm
  rationale: Wörtlich »ein Turm der Stärke«; die adjektivische Wiedergabe ist im Deutschen natürlich und bewahrt das Bild eines erhöhten Schutzbaus.
- source_word: שֵׁם
  choice: Name
  rationale: Die direkte Wiedergabe erhält sowohl den konkreten Wortlaut als auch die mögliche Bedeutung von offenbartem Wesen und Ansehen, ohne sie auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt; die im Deutschen geläufige Form ist »Jahwe«.
- source_word: בּוֹ
  choice: hinein
  rationale: Das Suffix bezieht sich im Bild am natürlichsten auf den Turm; mit »laufen« gibt »hinein« die Zufluchtbewegung idiomatisch wieder.
- source_word: יָרוּץ
  choice: läuft
  rationale: Die Grundbedeutung »laufen« hält das konkrete und dringliche Bild fest, ohne ausdrücklich »fliehen« einzutragen.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte maskuline Singular wird knapp und sprichwörtlich wiedergegeben; die Form kann repräsentative Bedeutung haben.
- source_word: וְנִשְׂגָּב
  choice: und ist sicher in der Höhe
  rationale: Die Wiedergabe verbindet die räumliche Vorstellung einer unzugänglichen Höhe mit der daraus folgenden Sicherheit und vermeidet die mögliche, hier weniger passende Deutung »wird erhöht«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Eigennamen; die traditionelle Ersatzlesung wird in einer Fußnote genannt.
- issue: Repräsentative Bedeutung von צַדִּיק
  choice: der Gerechte
  alternative: ein gerechter Mensch
  rationale: »Der Gerechte« bewahrt Numerus, grammatisches Geschlecht und den knappen Charakter des Spruchs, ohne »Mann« hinzuzufügen; zugleich bleibt die repräsentative Allgemeingültigkeit offen.
- issue: Bedeutung von נִשְׂגָּב
  choice: ist sicher in der Höhe
  alternative: ist geschützt / wird unerreichbar gemacht
  rationale: Das Nifal kann Erhöhung beziehungsweise Unzugänglichkeit und damit Schutz bezeichnen. Die gewählte Form erhält beide Seiten des Bildes, ohne lediglich den abstrakten Folgesinn »ist sicher« zu setzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Satzgestalt. Das konkrete Schutzbild bleibt erhalten; »der Gerechte« ist als repräsentativer Singular verständlich. Alle Fußnotenmarker stehen an der jeweils einschlägigen Textstelle.
