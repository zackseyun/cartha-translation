  - severity: low
    issue: Der Marker der lexikalischen Anmerkung zu נִשְׂגָּב steht erst nach dem ganzen Satz.
    rationale: Er sollte unmittelbar an der betreffenden Verbgruppe stehen, damit sein Bezug eindeutig ist.
