  naturalness: „Der Gerechte läuft hinein“ ist als sprichwörtlich verdichtete Bildsprache verständlich. „und steht sicher in der Höhe“ ist im modernen, würdigen Deutsch natürlicher als „und ist sicher in der Höhe“ und bewahrt das räumliche Schutzbild.
  terminology: „Jahwe“ ist eine im Deutschen etablierte Wiedergabe von יהוה. „Der Gerechte“ gibt den substantivierten maskulinen Singular angemessen wieder, ohne mit „Mann“ einen nicht ausdrücklich vorhandenen Personenbegriff hinzuzufügen. Die Fußnote zum Gottesnamen sollte die traditionelle deutsche Ersatzwiedergabe als Alternative klar markieren.
