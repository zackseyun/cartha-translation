source:
  edition: WLC
  text: לִ/פְנֵי שֶׁ֭בֶר יִגְבַּ֣הּ לֵב אִ֑ישׁ וְ/לִ/פְנֵ֖י כָב֣וֹד עֲנָוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/012.yaml
  text: Before destruction a man's heart is haughty[a], and before honor comes humility.
translation:
  language: de
  text: Vor dem Untergang wird das Herz eines Menschen hochmütig, und der Ehre geht Demut voraus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי
  choice: vor / vorausgehen
  rationale: Die Präposition bezeichnet in beiden Vershälften eine zeitliche beziehungsweise sachliche Abfolge. Die idiomatische Wendung „geht … voraus“ gibt dieselbe Beziehung in der zweiten Hälfte natürlich wieder.
- source_word: שֶׁבֶר
  choice: Untergang
  rationale: Das Substantiv bezeichnet hier nicht einen wörtlichen Bruch, sondern den Zusammenbruch beziehungsweise das Verderben eines Menschen. „Untergang“ ist im sprichwörtlichen Warnzusammenhang klar und prägnant.
- source_word: יִגְבַּהּ
  choice: wird … hochmütig
  rationale: Wörtlich wird das Herz „hoch“. In Verbindung mit לֵב bezeichnet dies Hochmut; die deutsche Wiedergabe macht die bildhafte Redewendung verständlich, ohne ihren ethischen Gehalt abzuschwächen.
- source_word: לֵב אִישׁ
  choice: das Herz eines Menschen
  rationale: אִישׁ steht in diesem allgemeinen Spruch für einen Menschen. Die Formulierung bewahrt das konkrete Bild des Herzens und gibt den generischen Sinn im heutigen Deutsch eindeutig wieder.
- source_word: כָבוֹד
  choice: Ehre
  rationale: Gemeint ist hier ehrenvolles Ansehen beziehungsweise Erhöhung, nicht speziell göttliche Herrlichkeit. „Ehre“ bildet den passenden Gegensatz zum vorausgehenden Untergang.
- source_word: עֲנָוָה
  choice: Demut
  rationale: Das Nomen bezeichnet eine demütige, niedrige Haltung. „Demut“ ist die präzise und geläufige deutsche Entsprechung.
theological_decisions:
- issue: Generisches אִישׁ in einer allgemeinen Weisheitsaussage
  choice: eines Menschen
  alternative: eines Mannes
  rationale: Das maskuline Singularwort bezeichnet hier keinen ausdrücklich männlichen Personenkreis, sondern den Menschen allgemein. „Eines Menschen“ erhält diesen generischen Aussageumfang, ohne den Spruch auf Männer einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Struktur. Die parallele Abfolge der beiden Vershälften bleibt erhalten; die zweite Hälfte wird durch die idiomatische deutsche Konstruktion „geht … voraus“ natürlich formuliert.
