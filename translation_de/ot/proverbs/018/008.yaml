base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/008.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
translation:
  language: de
  text: Die Worte eines Zuträgers sind wie köstliche Bissen[a], und sie dringen hinab in die innersten Kammern des Bauches[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie feine Leckerbissen“. Der seltene hebräische Ausdruck kann auch als „wie Wunden“ oder „wie gierig Verschlungenes“ verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: „Die innersten Kammern des Bauches“ ist ein hebräisches Bild für das tiefste Innere eines Menschen.
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Die Worte eines
  rationale: Der Status constructus im Plural bedeutet wörtlich „die Worte von“; die deutsche Genitivkonstruktion ist natürlich und formnah.
- source_word: נִרְגָּן
  choice: Verleumders
  rationale: Das Substantiv bezeichnet jemanden, der heimlich oder zersetzend über andere redet. „Verleumder“ ist im modernen Standarddeutsch verständlich und bewahrt den schädigenden Charakter der Rede, ohne die Wendung unnötig auszubauen.
- source_word: כְּמִתְלַהֲמִים
  choice: wie köstliche Bissen
  rationale: Die seltene Form ist lexikalisch umstritten. Im Zusammenhang mit dem Hinabsinken in den Leib liegt das Bild begehrter, wohlschmeckender Bissen nahe; abweichende Deutungen werden in der Fußnote erhalten.
- source_word: וְהֵם
  choice: und sie
  rationale: Die Konjunktion mit dem selbstständigen Pronomen greift die „Worte“ wieder auf; „und sie“ bildet dies direkt ab.
- source_word: יָרְדוּ
  choice: sinken hinab
  rationale: Das Perfekt beschreibt im Spruch eine allgemeingültige Beobachtung und wird daher im deutschen Präsens wiedergegeben. „Hinabsinken“ erhält die räumliche Bewegung des hebräischen Bildes.
- source_word: חַדְרֵי בָטֶן
  choice: die innersten Kammern des Leibes
  rationale: Wörtlich steht „Kammern/Räume des Bauches“. „Kammern des Leibes“ bewahrt die konkrete Metapher, während „innersten“ ihre Bedeutung als tiefstes Inneres verständlich macht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anschauliche Körpermetapher des Hebräischen bleibt erhalten; die umstrittene Bedeutung des seltenen Ausdrucks wird nicht im Haupttext aufgelöst, sondern durch die Fußnote offengelegt.
