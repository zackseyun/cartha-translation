  text: תַּחֲנוּנִ֥ים יְדַבֶּר רָ֑שׁ וְ֝/עָשִׁ֗יר יַעֲנֶ֥ה עַזּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/023.yaml
  text: The poor man speaks with pleas[a], but the rich man answers harshly.
translation:
  language: de
  text: Der Arme redet flehentlich, doch der Reiche antwortet schroff.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחֲנוּנִים
  choice: flehentlich
  rationale: Das Pluralnomen bezeichnet inständige Bitten um Gunst oder Erbarmen und beschreibt hier adverbial die Art des Redens. »Flehentlich« gibt dies im modernen Deutschen natürlich und prägnant wieder.
- source_word: יְדַבֶּר
  choice: redet
  rationale: Das Piel von דבר bedeutet hier schlicht »reden/sprechen«. Das Präsens entspricht dem allgemeinen Charakter des Spruchs.
- source_word: רָשׁ
  choice: der Arme
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet einen armen Menschen. Der bestimmte Singular bewahrt die repräsentative Gegenüberstellung des Hebräischen.
- source_word: וְעָשִׁיר
  choice: doch der Reiche
  rationale: Die Konjunktion markiert im antithetischen Parallelismus einen Gegensatz. »Doch« macht diesen Kontrast idiomatisch deutlich, während »der Reiche« den repräsentativen Singular spiegelt.
- source_word: יַעֲנֶה
  choice: antwortet
  rationale: Das Qal von ענה bedeutet hier direkt »antworten« und bezeichnet die Reaktion auf das flehentliche Reden.
- source_word: עַזּוֹת
  choice: schroff
  rationale: Die feminine Pluralform wird adverbial gebraucht und beschreibt eine harte, unnachgiebige oder dreiste Art zu antworten. »Schroff« bewahrt diese negative soziale Härte, ohne zusätzliche Worte in den Text einzutragen.
theological_decisions: []
translation_notes:
  register: Moderner, knapper und würdevoller Spruchstil. Die antithetische Struktur und der repräsentative Singular des Hebräischen bleiben erhalten; die adverbialen Wiedergaben vermeiden im Deutschen unnatürliche Nominalformulierungen.
