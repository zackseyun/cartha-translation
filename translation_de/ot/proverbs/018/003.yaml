  text: When wickedness comes[a], contempt also comes, and with dishonor comes reproach.
translation:
  language: de
  text: Wenn ein böser Mensch kommt[a], kommt auch Verachtung; und mit Schande kommt Schmach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn Bosheit kommt, kommt auch Verachtung; und mit Schande kommt Schmach.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: Wenn … kommt
  rationale: Die Präposition ב mit dem Infinitiv von בוא bezeichnet hier einen zeitlichen Umstand. „Wenn … kommt“ ist im Deutschen natürlich und bewahrt die knappe Form des Spruchs.
- source_word: רָשָׁע
  choice: ein böser Mensch
  rationale: Das substantivierte maskuline Singularwort bezeichnet hier am naheliegendsten einen Menschen, der durch Bosheit gekennzeichnet ist. Die Formulierung ist modern und verständlich, ohne „gottlos“ als zusätzliche religiöse Bestimmung einzutragen.
- source_word: בָּא
  choice: kommt
  rationale: Die Wiederholung von בוא wird durch die Wiederholung von „kommt“ sichtbar gemacht und erhält den Nachdruck und Parallelismus des Hebräischen.
- source_word: גַם
  choice: auch
  rationale: Das additive גַם zeigt, dass die Verachtung zusammen mit dem bösen Menschen auftritt.
- source_word: בּוּז
  choice: Verachtung
  rationale: „Verachtung“ gibt das abstrakte Substantiv treffend wieder und unterscheidet es von den beiden Begriffen im zweiten Halbvers.
- source_word: קָלוֹן
  choice: Schande
  rationale: קָלוֹן bezeichnet entehrende beziehungsweise öffentlich beschämende Schande. „Schande“ ist knapp, geläufig und für den Parallelismus geeignet.
- source_word: חֶרְפָּה
  choice: Schmach
  rationale: חֶרְפָּה kann Schmach, Beschimpfung oder entehrenden Vorwurf bezeichnen. „Schmach“ bewahrt den öffentlichen und relationalen Aspekt und bleibt von „Schande“ unterscheidbar.
theological_decisions:
- issue: Personale oder abstrakte Wiedergabe von רָשָׁע
  choice: ein böser Mensch
  alternative: Bosheit
  rationale: Die hebräische Form ist am unmittelbarsten als substantiviertes Adjektiv im maskulinen Singular zu verstehen und bezeichnet daher einen bösen Menschen. Da das Wort in übertragener Lesart auch abstrakt wiedergegeben werden kann, wird diese Möglichkeit in der Fußnote erhalten, statt den Haupttext darauf festzulegen.
translation_notes:
  register: Knappe, würdige Spruchsprache in modernem Standarddeutsch. Die Wiederholung von „kommt“ bildet die Wiederholung der hebräischen Wurzel בוא ab; „Schande“ und „Schmach“ halten die benachbarten, aber nicht identischen Begriffe auseinander.
