  text: לְֽ֭/תַאֲוָה יְבַקֵּ֣שׁ נִפְרָ֑ד בְּ/כָל תּ֝וּשִׁיָּ֗ה יִתְגַּלָּֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/001.yaml
  text: Whoever isolates himself seeks his own desire[b][a]; he breaks out against all sound judgment.
translation:
  language: de
  text: Wer sich absondert, geht seinem eigenen Verlangen nach; gegen alle tragfähige Einsicht lehnt er sich auf.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wer sich absondert, sucht Verlangen; mit aller bewährten Weisheit gerät er in Streit.“ Der hebräische Wortlaut der zweiten Zeile ist schwierig, besonders das seltene Verb, das hier mit „lehnt er sich auf“ wiedergegeben wird.'
    reason: alternative_reading
  - marker: b
    text: „Tragfähige Einsicht“ kann auch mit „bewährte Weisheit“, „gesundes Urteil“ oder „gesunder Menschenverstand“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְתַאֲוָה
  choice: sein eigenes Verlangen
  rationale: תַּאֲוָה bezeichnet Verlangen, Begehren oder Sehnen. Die Präposition לְ gibt hier wahrscheinlich Ziel oder Beweggrund an; „sein eigenes“ macht den im knappen Spruch implizierten Selbstbezug verständlich, ohne „selbstsüchtig“ ausdrücklich in den Text einzutragen.
- source_word: יְבַקֵּשׁ
  choice: sucht
  rationale: Das Piel von בקש bedeutet regelmäßig „suchen“ oder „erstreben“. „Sucht“ gibt die Form unmittelbar und idiomatisch wieder.
- source_word: נִפְרָד
  choice: wer sich absondert
  rationale: Das Nifal-Partizip von פרד kann einen Abgesonderten oder jemanden bezeichnen, der sich absondert. Die gewählte generische Form passt zur Aussageweise eines Sprichworts und bewahrt, eher als „Einzelgänger“, die verbale Bedeutung.
- source_word: בְּכָל
  choice: gegen jede
  rationale: Die Funktion von בְ ist in der stark verdichteten zweiten Zeile unsicher. Zusammen mit dem seltenen Verb ist eine adversative Beziehung wahrscheinlich; „gegen jede“ ergibt im Deutschen einen natürlichen Anschluss.
- source_word: תּוּשִׁיָּה
  choice: vernünftige Einsicht
  rationale: תּוּשִׁיָּה bezeichnet in der Weisheitsliteratur tragfähige Weisheit, Einsicht oder guten Rat. „Vernünftige Einsicht“ ist verständlich und lässt sowohl praktisches Urteilsvermögen als auch solide Weisheit anklingen.
- source_word: יִתְגַּלָּע
  choice: lehnt er sich auf
  rationale: Das seltene Hitpael ist lexikalisch und textlich schwierig. Im Zusammenhang bezeichnet es wahrscheinlich ein feindseliges Hervorbrechen oder Sich-Widersetzen. „Lehnt er sich auf“ gibt den Widerstand idiomatisch wieder, während die Fußnote die Unsicherheit offenlegt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Spruchton. Die ungewöhnliche Formulierung „bricht gegen … hervor“ wurde zugunsten des natürlichen „lehnt er sich auf“ vermieden; die echte Unsicherheit des seltenen hebräischen Verbs und der Präposition bleibt durch die Fußnoten sichtbar.
