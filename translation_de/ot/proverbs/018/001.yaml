- from: Wer sich absondert, sucht sein eigenes Verlangen; gegen jede vernünftige Einsicht lehnt er sich auf.[a][b]
  to: Wer sich absondert, geht seinem eigenen Verlangen nach; gegen alle tragfähige Einsicht lehnt er sich auf.[a][b]
