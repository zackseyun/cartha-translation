  text: לֹֽא יַחְפֹּ֣ץ כְּ֭סִיל בִּ/תְבוּנָ֑ה כִּ֝֗י אִֽם בְּ/הִתְגַּלּ֥וֹת לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/002.yaml
  text: A fool does not delight in understanding[a], but only in revealing his heart.
translation:
  language: de
  text: Ein Dummkopf hat kein Gefallen an Einsicht, sondern nur daran, sein Herz offenzulegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das „Herz“ bezeichnet hier die Gedanken, Absichten und Neigungen im Inneren eines Menschen, nicht nur seine Gefühle. Möglich ist auch: „sondern will nur offenlegen, was in seinem Herzen ist.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: hat kein Gefallen an
  rationale: חפץ bezeichnet Begehren oder Gefallenhaben. Die Wendung gibt die willentliche Abneigung natürlich und prägnant wieder.
- source_word: כְּסִיל
  choice: Dummkopf
  rationale: כְּסִיל ist in den Sprüchen ein fester Weisheitsbegriff für einen moralisch und geistig uneinsichtigen Menschen; „Dummkopf“ ist gegenwärtiges, allgemein verständliches Deutsch und bezeichnet hier nicht bloß geringe Intelligenz.
- source_word: תְבוּנָה
  choice: Einsicht
  rationale: תְבוּנָה bezeichnet im weisheitlichen Zusammenhang verständiges Erfassen und Urteilsvermögen; „Einsicht“ ist knapp und idiomatisch.
- source_word: כִּי אִם
  choice: sondern nur
  rationale: Die Verbindung drückt nach der Verneinung einen ausschließenden Gegensatz aus.
- source_word: בְּהִתְגַּלּוֹת
  choice: daran, … offenzulegen
  rationale: Der Infinitiv von גלה bezeichnet das Aufdecken oder Offenlegen. Die Wiedergabe bewahrt das Bild des Enthüllens und klingt im Deutschen natürlich.
- source_word: לִבּוֹ
  choice: sein Herz
  rationale: לֵב meint den inneren Menschen einschließlich Gedanken, Absichten und Neigungen. „Herz“ bewahrt die hebräische Ausdrucksweise, ohne den Sinn einseitig auf Gefühle oder Verstand zu beschränken.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der knappen Gegenüberstellung eines Weisheitsspruchs. „Dummkopf“ vermeidet das heute teils altertümliche „Tor“, während „Herz“ die biblisch-hebräische Bildsprache bewahrt.
