  text: פִּֽי כְ֭סִיל מְחִתָּה ל֑/וֹ וּ֝/שְׂפָתָ֗י/ו מוֹקֵ֥שׁ נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/007.yaml
  text: A fool’s mouth is his ruin[b][a], and his lips are a snare to his life.
translation:
  language: de
  text: 'Der Mund eines Toren ist sein Verderben,

    und seine Lippen sind eine Falle für sein Leben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Falle seiner Seele“; das hebräische Wort kann hier auch „sein Leben“ oder „ihn selbst“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: Mund
  rationale: Bewahrt das konkrete hebräische Bild; der Mund steht hier für das Reden als dessen Quelle.
- source_word: כְסִיל
  choice: Tor
  rationale: „Tor“ ist im Deutschen ein etablierter Weisheitsbegriff und bezeichnet moralische wie praktische Uneinsichtigkeit, nicht bloß geringe Intelligenz.
- source_word: מְחִתָּה
  choice: Verderben
  rationale: Das Wort kann Zerstörung oder Untergang bezeichnen. „Verderben“ gibt die schädliche Folge des eigenen Redens würdig und idiomatisch wieder.
- source_word: לוֹ
  choice: wird ihm zum
  rationale: Die hebräische Konstruktion bedeutet wörtlich etwa „ist Verderben für ihn“. „Wird ihm zum Verderben“ bildet die persönliche Ausrichtung natürlich ab, ohne sie als bloßen Besitz auszudrücken.
- source_word: וּשְׂפָתָיו
  choice: und seine Lippen
  rationale: Erhält die konkrete Körpermetapher und den Parallelismus zu „Mund“.
- source_word: מוֹקֵשׁ
  choice: eine Falle
  rationale: „Falle“ ist im heutigen Deutsch unmittelbar verständlich und bewahrt das Bild einer Gefahr, in die der Tor durch sein eigenes Reden gerät.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נֶפֶשׁ bezeichnet hier wahrscheinlich das Leben oder die eigene Person, nicht speziell eine vom Körper getrennte Seele.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Spruchsprache mit bewahrtem Parallelismus und konkreter Bildlichkeit. „Tor“ hält den weisheitlichen, moralischen Gehalt fest; „Falle“ ist geläufiger als „Schlinge“.
