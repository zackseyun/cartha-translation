  terminology: „Tor“, „Verderben“, „Lippen“ und „Falle“ geben die hebräischen Weisheits- und Bildbegriffe angemessen wieder. „Leben“ für נפשׁ ist hier kontextuell gut begründet, ohne eine enge anthropologische Bedeutung von „Seele“ festzulegen.
