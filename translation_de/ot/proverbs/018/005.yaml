  text: שְׂאֵ֣ת פְּנֵי רָשָׁ֣ע לֹא ט֑וֹב לְ/הַטּ֥וֹת צַ֝דִּ֗יק בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/005.yaml
  text: To show partiality to the wicked is not good[b][a], nor to deprive the righteous of justice.
translation:
  language: de
  text: Es ist nicht gut, einen Schuldigen zu begünstigen[a] und einen Gerechten im Gericht zu benachteiligen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Gesicht eines Schuldigen erheben«; eine hebräische Wendung für parteiische Begünstigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »einen Gerechten im Urteil abweisen«. Das hebräische Verb bedeutet wörtlich »abwenden« oder »beugen« und bezeichnet hier eine Benachteiligung im Rechtsverfahren.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאֵת פְּנֵי
  choice: für … Partei zu ergreifen
  rationale: Die Wendung bedeutet wörtlich »das Gesicht erheben« und bezeichnet hier eine parteiliche Begünstigung. Die gewählte Formulierung gibt das hebräische Idiom in natürlichem Deutsch wieder.
- source_word: רָשָׁע
  choice: einen Schuldigen
  rationale: Im gerichtlichen Zusammenhang kann רָשָׁע denjenigen bezeichnen, der schuldig beziehungsweise im Unrecht ist. »Schuldiger« wahrt hier den juristischen Gegensatz zu צַדִּיק, ohne ihn auf eine bestimmte Straftat einzuengen.
- source_word: לֹא טוֹב
  choice: Es ist nicht gut
  rationale: Die schlichte Wertung des Hebräischen bleibt erhalten; sie drückt im Spruchzusammenhang klare moralische Missbilligung aus.
- source_word: לְהַטּוֹת
  choice: das Recht zu verweigern
  rationale: Das Verb bedeutet grundsätzlich »abbiegen, abwenden« und bezeichnet im Rechtskontext, dass ein Urteil zum Nachteil einer Person gebeugt wird. Die Formulierung gibt die praktische Folge verständlich wieder.
- source_word: צַדִּיק
  choice: einem Gerechten
  rationale: צַדִּיק kann sowohl einen moralisch Gerechten als auch den im konkreten Rechtsfall im Recht Befindlichen bezeichnen. »Gerechter« bewahrt diese moralisch-rechtliche Bedeutungsbreite.
- source_word: בַּמִּשְׁפָּט
  choice: im Gericht
  rationale: מִשְׁפָּט bezeichnet hier den Bereich des richterlichen Verfahrens beziehungsweise Urteils. »Im Gericht« macht diesen juristischen Rahmen knapp und idiomatisch deutlich.
theological_decisions:
- issue: Moralische oder forensische Bedeutung von רָשָׁע und צַדִּיק
  choice: »Schuldiger« und »Gerechter«
  alternative: »Frevler« und »Unschuldiger« beziehungsweise »Gottloser« und »Gerechter«
  rationale: Der Vers steht ausdrücklich im Rechtszusammenhang, doch die Begriffe tragen zugleich eine breitere moralische Färbung. Die asymmetrische Wiedergabe vermeidet sowohl eine rein religiöse Einengung von רָשָׁע als auch die vollständige Reduktion von צַדִּיק auf juristische Unschuld; die Fußnote macht dessen Spannweite sichtbar.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die parallele Rechtsaussage wird knapp wiedergegeben; die Fußnoten bewahren das konkrete hebräische Bild und die Mehrdeutigkeit der zweiten Vershälfte.
