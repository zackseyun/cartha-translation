  source_fidelity: 'Die Grundbedeutung ist zutreffend: Das hebräische Sprichwort verurteilt sowohl die Begünstigung eines רָשָׁע als auch die Benachteiligung eines צַדִּיק im Rechtsverfahren. »Schuldiger« ist im forensischen Kontext möglich, während »Gerechter« die bewusst breite moralisch-rechtliche Bedeutung von צַדִּיק bewahrt. »Das Recht zu verweigern« trifft die Folge, ist gegenüber לְהַטּוֹת („abwenden, beugen“) jedoch etwas stärker explizierend.'
  naturalness: Der Satz ist klar und modernes Standarddeutsch. »Einen Schuldigen zu begünstigen« ist idiomatischer und präziser als »für einen Schuldigen Partei zu ergreifen«, da es die im hebräischen Idiom bezeichnete ungebührliche Vorzugsbehandlung unmittelbar ausdrückt. »Einen Gerechten im Gericht zu benachteiligen« gibt die zweite Halbzeile natürlich wieder.
  terminology: Die Begriffe »Schuldiger«, »Gerechter« und »Gericht« sind im Kontext angemessen. Die Fußnote zur ersten Wendung sollte die hebräische Bildlichkeit genauer erklären; die bisherige zweite Fußnote enthält mit »das Recht ... zu beugen« eine im Deutschen unnatürliche und vom hebräischen Objekt abweichende Formulierung.
