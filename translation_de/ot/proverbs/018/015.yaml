source:
  edition: WLC
  text: לֵ֣ב נָ֭בוֹן יִקְנֶה דָּ֑עַת וְ/אֹ֥זֶן חֲ֝כָמִ֗ים תְּבַקֶּשׁ דָּֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/015.yaml
  text: An understanding heart acquires knowledge[b][a], and the ear of the wise seeks knowledge.
translation:
  language: de
  text: Ein verständiges Herz erwirbt Erkenntnis, und das Ohr der Weisen sucht Erkenntnis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Ohr der Weisen“ ist ein bildlicher Ausdruck für ihre Bereitschaft, aufmerksam zuzuhören und Belehrung anzunehmen.
    reason: cultural_note
lexical_decisions:
- source_word: לֵב
  choice: Herz
  rationale: Im hebräischen Weisheitsdenken bezeichnet לֵב das innere Organ des Denkens, Urteilens und Wollens. „Herz“ bewahrt das Bild des Ausgangstextes und ist im Deutschen verständlich.
- source_word: נָבוֹן
  choice: verständig
  rationale: Das Adjektiv beschreibt ein Herz, das Einsicht und Unterscheidungsvermögen besitzt. „Verständig“ ist prägnant, würdevoll und passt zur Weisheitssprache.
- source_word: יִקְנֶה
  choice: erwirbt
  rationale: קנה bezeichnet hier das Erlangen oder Aneignen. „Erwirbt“ vermittelt zielgerichtetes Gewinnen, ohne zwingend einen Kauf auszudrücken.
- source_word: דָּעַת
  choice: Erkenntnis
  rationale: דַּעַת meint in den Sprüchen wissende Einsicht. „Erkenntnis“ ist im deutschen Weisheitskontext natürlich; die Wiederholung in beiden Vershälften bewahrt den Parallelismus.
- source_word: אֹזֶן
  choice: Ohr
  rationale: Das konkrete Körperbild steht sinnbildlich für aufmerksame Aufnahmebereitschaft. Die wörtliche Wiedergabe erhält den Parallelismus mit „Herz“.
- source_word: חֲכָמִים
  choice: der Weisen
  rationale: Der maskuline Plural ist hier allgemein auf weise Menschen bezogen. Die substantivierte Form „die Weisen“ ist im Deutschen generisch und fügt sich natürlich in „das Ohr der Weisen“ ein.
- source_word: תְּבַקֶּשׁ
  choice: sucht
  rationale: בקש im Piel drückt aktives Suchen aus. „Sucht“ ist knapp und bewahrt die Entsprechung zu „erwirbt“.
theological_decisions: []
