  source_fidelity: 'Die Übersetzung gibt die beiden hebräischen Satzglieder vollständig und in ihrer Parallelstruktur wieder: לֵב נָבוֹן als „verständiges Herz“, יִקְנֶה als „erwirbt“, die zweimalige Wiederholung von דָּעַת als „Erkenntnis“ sowie das konkrete Bild von אֹזֶן als „Ohr“. „Sucht“ trifft den aktiven Sinn von תְּבַקֶּשׁ. Die Singularform „Ohr“ und der Genitiv „der Weisen“ entsprechen dem hebräischen Ausdruck, ohne dessen Bildlichkeit aufzulösen.'
