id: PRO.18.21
reference: Proverbs 18:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מָ֣וֶת וְ֭/חַיִּים בְּ/יַד לָשׁ֑וֹן וְ֝/אֹהֲבֶ֗י/הָ יֹאכַ֥ל פִּרְיָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/021.yaml
  text: Death and life are in the power of the tongue[b][a], and those who love it will eat its fruit.
translation:
  language: de
  text: Tod und Leben liegen in der Macht der Zunge[a], und wer sie liebt, wird ihre Frucht essen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Tod und Leben sind in der Hand der Zunge.“'
    reason: lexical_alternative
  - marker: b
    text: „Wer sie liebt“ meint wahrscheinlich, wer die Zunge gern oder häufig gebraucht; ein solcher Mensch erfährt die Folgen seiner Worte, sei es zum Tod oder zum Leben.
    reason: cultural_note
lexical_decisions:
- source_word: מָוֶת וְחַיִּים
  choice: Tod und Leben
  rationale: Die abstrakten Substantive bilden im Hebräischen ein pointiertes Gegensatzpaar; חַיִּים ist trotz seiner Pluralform idiomatisch als Singular „Leben“ wiedergegeben.
- source_word: בְּיַד
  choice: liegen in der Macht
  rationale: Wörtlich steht „in der Hand“. Die deutsche Wendung „in der Macht“ gibt die idiomatische Bedeutung von Verfügungsgewalt beziehungsweise wirksamer Kontrolle natürlich wieder.
- source_word: לָשׁוֹן
  choice: der Zunge
  rationale: Das konkrete Körperbild bleibt erhalten und bezeichnet metonymisch das Reden und dessen Wirkung.
- source_word: אֹהֲבֶיהָ
  choice: wer sie liebt
  rationale: Das feminine Pronomen verweist am natürlichsten auf die Zunge. Die knappe Form bewahrt die Offenheit, ob die Freude am Reden, am Gebrauch der Zunge oder an ihrer Macht gemeint ist.
- source_word: יֹאכַל
  choice: wird … essen
  rationale: Das Bild bezeichnet eine eintretende Folge. Der deutsche Singular entspricht der distributiven Formulierung „wer sie liebt“.
- source_word: פִּרְיָהּ
  choice: ihre Frucht
  rationale: Die landwirtschaftliche Metapher für Ergebnis oder Folgen wird unverändert bewahrt.
theological_decisions:
- issue: Bezug und Bedeutung von „wer sie liebt“
  choice: Das Pronomen bleibt auf „die Zunge“ bezogen, ohne die Art dieser Liebe im Haupttext näher festzulegen.
  alternative: „Wer gern redet“ oder „wer ihre Macht liebt“.
  rationale: Der hebräische Wortlaut ist knapper und semantisch weiter als diese deutenden Alternativen; die Spannung zwischen tödlichen und lebensfördernden Folgen soll bestehen bleiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, sprichwörtlich knappem Klang. Die Metaphern „Zunge“, „Hand/Macht“ und „Frucht“ werden soweit möglich bewahrt; die Fußnotenmarker stehen jeweils unmittelbar beim erklärten Ausdruck.
