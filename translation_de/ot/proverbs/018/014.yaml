review_pass:
  verdict: approve
  source_fidelity: Der Entwurf gibt die beiden hebräischen Satzglieder und ihren Kontrast treffend wieder. „Der Geist eines Menschen“ entspricht רוּחַ אִישׁ in seinem sprichwörtlich-repräsentativen Sinn. „Kann ihn in seiner Krankheit tragen“ vermittelt idiomatisch die Aussage, dass der Geist den Menschen in seiner Krankheit aufrechterhält; die Possessivbeziehung von מַחֲלֵהוּ bleibt gewahrt. Die rhetorische Frage mit „wer kann ihn ertragen?“ trifft מִי יִשָּׂאֶנָּה angemessen.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Wiederholung von „Geist“ bewahrt die prägnante Parallelstruktur des Spruchs. Die Voranstellung „einen zerschlagenen Geist“ mit Gedankenstrich ist im Deutschen natürlich und verstärkt die rhetorische Frage, ohne den Sinn zu verändern.
  terminology: „Geist“ ist für רוּחַ im Kontext innerer Widerstandskraft passend und erhält die lexikalische Wiederholung. „Zerschlagen“ ist eine tragfähige Wiedergabe von נְכֵאָה; die Fußnote nennt mit „gebrochenen“ und „niedergeschlagenen“ sinnvolle Alternativen. Es werden keine konfessionell einengenden Deutungen eingeführt.
