source:
  edition: WLC
  text: רֽוּחַ אִ֭ישׁ יְכַלְכֵּ֣ל מַחֲלֵ֑/הוּ וְ/ר֥וּחַ נְ֝כֵאָ֗ה מִ֣י יִשָּׂאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/014.yaml
  text: A man's spirit can sustain him in sickness[b][a], but a crushed spirit—who can bear it?
translation:
  language: de
  text: Der Geist eines Menschen kann ihn in seiner Krankheit tragen; doch einen zerschlagenen Geist[a] – wer kann ihn ertragen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „einen gebrochenen“ oder „einen niedergeschlagenen Geist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: Geist
  rationale: Das Wort bezeichnet hier die innere Lebenskraft oder seelische Verfassung eines Menschen. „Geist“ bewahrt die Wiederholung und den Gegensatz zwischen tragfähigem und zerschlagenem Inneren.
- source_word: אִישׁ
  choice: eines Menschen
  rationale: Das maskuline Singularwort wird im Spruch repräsentativ gebraucht. „Eines Menschen“ gibt diesen allgemeinen Sinn im modernen Deutschen natürlich wieder.
- source_word: יְכַלְכֵּל
  choice: kann ihn … tragen
  rationale: Das Verb bedeutet versorgen, stützen oder aufrechterhalten. Die Formulierung bringt zum Ausdruck, dass die innere Kraft einen Menschen durch seine Krankheit hindurchtragen kann.
- source_word: מַחֲלֵהוּ
  choice: ihn in seiner Krankheit
  rationale: Wörtlich steht „seine Krankheit“. Im Deutschen macht die Wendung deutlich, dass der Geist den Kranken während seiner Krankheit aufrechterhält, ohne zu behaupten, die Krankheit selbst werde gestützt.
- source_word: נְכֵאָה
  choice: zerschlagen
  rationale: Das Adjektiv beschreibt einen getroffenen, gebrochenen oder niedergedrückten Zustand. „Zerschlagen“ ist bildkräftig und wahrt die Schwere des Gegensatzes.
- source_word: מִי יִשָּׂאֶנָּה
  choice: wer kann ihn ertragen?
  rationale: Die rhetorische Frage verwendet נשׂא im Sinn von tragen oder ertragen. Das deutsche Pronomen richtet sich grammatisch nach „Geist“; „ertragen“ lässt die Belastung eines zerschlagenen Inneren hervortreten.
theological_decisions: []
