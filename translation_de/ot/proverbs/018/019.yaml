  text: אָ֗ח נִפְשָׁ֥ע מִ/קִּרְיַת עֹ֑ז ו/מדונים כִּ/בְרִ֥יחַ אַרְמֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/019.yaml
  text: A brother offended is harder to win than a fortified city[b][a], and quarrels are like the bars of a citadel.
translation:
  language: de
  text: Ein gekränkter Bruder[a] ist schwerer zurückzugewinnen als eine befestigte Stadt, und Streitigkeiten sind wie der Riegel einer Zitadelle.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Bruder, dem Unrecht geschehen ist«. Das hebräische Wort kann sowohl die Kränkung als auch das erlittene Unrecht beziehungsweise den daraus entstandenen Beziehungsbruch hervorheben. Der hebräische Satz ist knapp und lässt »ist schwerer zurückzugewinnen« unausgesprochen.'
    reason: lexical_and_ellipsis
  - marker: b
    text: 'Oder: »wie der Riegel eines Palastes«. Das hebräische Wort kann sowohl einen Palast als auch einen befestigten Herrschersitz bezeichnen; das Bild der Sicherung spricht hier für »Zitadelle«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: Bruder
  rationale: Die Grundbedeutung ist »Bruder«; sie bewahrt das konkrete Beziehungsbild des hebräischen Spruchs, ohne es unnötig zu »Verwandter« oder »Gefährte« zu verallgemeinern.
- source_word: נִפְשָׁע
  choice: gekränkt
  rationale: Das Partizip von פשע bezeichnet hier wahrscheinlich einen Bruder, an dem ein Beziehungsbruch oder Unrecht geschehen ist. »Gekränkt« ist im Deutschen natürlich und lässt offen, ob eine persönliche Verletzung oder ein schwereres Unrecht gemeint ist.
- source_word: מִקִּרְיַת עֹז
  choice: als eine befestigte Stadt
  rationale: Die Präposition מִן ist vergleichend gebraucht; קִרְיַת עֹז bezeichnet wörtlich eine »Stadt der Stärke«, also eine befestigte, schwer zugängliche Stadt.
- source_word: וּמְדֹנִים
  choice: und Streitigkeiten
  rationale: Der Plural bezeichnet Streit, Zwist oder Auseinandersetzungen. »Streitigkeiten« ist gegenwärtig, verständlich und wahrt den Plural.
- source_word: כִּבְרִיחַ
  choice: wie der Riegel
  rationale: בְּרִיחַ ist ein Balken oder Riegel zum Sichern eines Tores. Der Singular des Hebräischen bleibt erhalten.
- source_word: אַרְמוֹן
  choice: einer Zitadelle
  rationale: Das Wort kann einen Palast oder einen befestigten Herrschersitz bezeichnen. Wegen der Bilder von befestigter Stadt und Torriegel passt »Zitadelle« im unmittelbaren Zusammenhang am besten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Spruchsprache. Die im Hebräischen vorausgesetzte Vergleichsaussage wird mit »ist schwerer zurückzugewinnen« ausdrücklich gemacht, damit der Vers im Deutschen verständlich ist; die Kürze und Spannung des Bildes bleiben erhalten.
