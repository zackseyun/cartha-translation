  text: מַ֣יִם עֲ֭מֻקִּים דִּבְרֵ֣י פִי אִ֑ישׁ נַ֥חַל נֹ֝בֵ֗עַ מְק֣וֹר חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/004.yaml
  text: The words of a man's mouth are deep waters[b][a]; the fountain of wisdom is a flowing brook.
translation:
  language: de
  text: Die Worte aus dem Mund eines Mannes[b] sind tiefe Wasser[a]; die Quelle der Weisheit ist ein sprudelnder Bach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Worte aus dem Mund eines Mannes sind tiefe Wasser, ein sprudelnder Bach, eine Quelle der Weisheit.« Der hebräische Satz kann so verstanden werden, dass beide Wasserbilder die Worte selbst beschreiben, statt dass die zweite Zeile eine eigenständige Aussage über die Weisheit macht.'
    reason: alternative_reading
  - marker: b
    text: »Mann« gibt das hebräische אִישׁ wieder, ein maskulines Wort im Singular, das hier im sprichwörtlichen Stil einen einzelnen Sprecher bezeichnet.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  choice: tiefe Wasser
  rationale: Die konkrete Wassermetapher bleibt erhalten; »tiefgründig« würde das Bild bereits auslegen.
- source_word: דִּבְרֵי פִי אִישׁ
  choice: die Worte aus dem Mund eines Mannes
  rationale: Gibt die hebräische Genitivverbindung natürlich wieder. אִישׁ ist ein maskulines Singularwort und bezeichnet hier im sprichwörtlichen Stil einen einzelnen Sprecher.
- source_word: נַחַל נֹבֵעַ
  choice: ein strömender Bach
  rationale: נַחַל kann einen Bach oder Wasserlauf bezeichnen; das Partizip נֹבֵעַ beschreibt hervorquellendes beziehungsweise fließendes Wasser. »Strömender Bach« bewahrt das bewegte Wasserbild ohne Übertreibung.
- source_word: מְקוֹר חָכְמָה
  choice: die Quelle der Weisheit
  rationale: מְקוֹר bezeichnet eine Quelle oder einen Ursprung. »Quelle« erhält hier sowohl das konkrete Wasserbild als auch dessen übertragene Bedeutung.
theological_decisions: []
