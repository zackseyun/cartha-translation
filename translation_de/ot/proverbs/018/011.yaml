id: PRO.18.11
reference: Proverbs 18:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֣וֹן עָ֭שִׁיר קִרְיַ֣ת עֻזּ֑/וֹ וּ/כְ/חוֹמָ֥ה נִ֝שְׂגָּבָ֗ה בְּ/מַשְׂכִּיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/011.yaml
  text: A rich man's wealth is his strong city[a], and like a high wall in his imagination.
translation:
  language: de
  text: Der Reichtum eines reichen Mannes ist seine befestigte Stadt, und in seiner Vorstellung[a] ist er wie eine hohe Mauer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »in seinem Denken« oder »in seiner Wahrnehmung«. Das hebräische Wort bezeichnet ein Bild und kann hier ein inneres Bild oder eine Sichtweise meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: Reichtum
  rationale: Bezeichnet materiellen Reichtum beziehungsweise Besitz; »Reichtum« ist im Deutschen natürlich und wahrt die allgemeine Aussage des Spruchs.
- source_word: עָשִׁיר
  choice: eines reichen Mannes
  rationale: Das Adjektiv wird substantivisch gebraucht und steht im Hebräischen im maskulinen Singular. Die Formulierung gibt diese Gestalt wieder und kennzeichnet die Aussage zugleich als allgemeinen Fall.
- source_word: קִרְיַת עֻזּוֹ
  choice: seine befestigte Stadt
  rationale: Wörtlich etwa »Stadt seiner Stärke«. »Befestigte Stadt« bewahrt das Bild einer Stadt, die Schutz und Sicherheit bietet, und klingt im modernen Deutsch natürlich.
- source_word: וּכְחוֹמָה נִשְׂגָּבָה
  choice: wie eine hohe Mauer
  rationale: נִשְׂגָּבָה bezeichnet hier Höhe beziehungsweise Erhabenheit und kann dadurch Unzugänglichkeit nahelegen. »Hohe Mauer« erhält das Bild, ohne die Schutzwirkung stärker auszudeuten, als der Wortlaut verlangt.
- source_word: בְּמַשְׂכִּיתוֹ
  choice: in seiner Vorstellung
  rationale: Das Substantiv kann ein Bild, eine Darstellung oder ein inneres Bild beziehungsweise eine Sichtweise bezeichnen. »In seiner Vorstellung« bringt den subjektiven Charakter zum Ausdruck, ohne ausdrücklich Hochmut oder Selbsttäuschung zu unterstellen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Metaphern der befestigten Stadt und der hohen Mauer bleiben erhalten; der zweite Teilsatz wird durch die Wiederaufnahme mit »er« syntaktisch verdeutlicht. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
