source:
  edition: WLC
  text: מָצָ֣א אִ֭שָּׁה מָ֣צָא ט֑וֹב וַ/יָּ֥פֶק רָ֝צ֗וֹן מֵ/יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/022.yaml
  text: He who finds a wife finds a good thing and obtains favor from Yahweh[a].
translation:
  language: de
  text: Wer eine Ehefrau findet, findet Gutes und erlangt Gunst von Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann אִשָּׁה auch »Frau« bedeuten; im Zusammenhang ist wahrscheinlich eine Ehefrau gemeint. Das Hebräische verwendet eine maskuline Singularform in repräsentativ-sprichwörtlichem Sinn.
    reason: lexikalische und grammatische Alternative
lexical_decisions:
- source_word: מָצָא
  choice: findet
  rationale: Das Qal-Perfekt formuliert hier eine allgemeine, sprichwörtliche Wahrheit; das deutsche Präsens gibt diesen gnomischen Sinn natürlich wieder.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: Das Wort kann sowohl »Frau« als auch »Ehefrau« bedeuten. Im Zusammenhang ist die Ehe gemeint; »eine Frau finden« ist im Deutschen ebenfalls als Finden einer Ehefrau verständlich und bewahrt die lexikalische Weite.
- source_word: טוֹב
  choice: Gutes
  rationale: Das Adjektiv wird substantivisch gebraucht. »Gutes« bildet die knappe hebräische Form natürlicher und genauer ab als »eine gute Sache«.
- source_word: וַיָּפֶק
  choice: erlangt
  rationale: Der Hifil trägt hier den Sinn, etwas zu erhalten oder zu gewinnen. »Erlangt« passt zum parallelen »findet« und wahrt den gehobenen Spruchstil.
- source_word: רָצוֹן
  choice: Wohlgefallen
  rationale: In Verbindung mit Gott bezeichnet רָצוֹן seine Gunst beziehungsweise wohlwollende Annahme. »Wohlgefallen« bewahrt den theologischen Beziehungsgehalt.
- source_word: מֵיְהוָה
  choice: von Jahwe
  rationale: Die Präposition מִן bezeichnet die Herkunft; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: implicit subject of מָצָא
  choice: Wer
  rationale: Das Hebräische hat ein implizites maskulines Singularsubjekt mit repräsentativ-sprichwörtlicher Funktion. Deutsches »wer« gibt die allgemeine Aussage idiomatisch wieder; der folgende Ausdruck »eine Frau« macht die eheliche Perspektive deutlich.
theological_decisions:
- issue: Wiedergabe des impliziten maskulinen Subjekts
  choice: Wer eine Frau findet
  alternative: Ein Mann, der eine Frau findet
  rationale: Die maskuline Perspektive ergibt sich aus dem Objekt »eine Frau« und dem ehelichen Sinn. »Wer« entspricht zugleich dem allgemeinen Charakter des Spruchs, ohne seine Aussage unnötig auf eine ausdrücklich benannte Personengruppe zu verengen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אִשָּׁה
  choice: eine Frau
  alternative: eine Ehefrau
  rationale: Der eheliche Sinn ist in diesem Spruch wahrscheinlich und wird im Deutschen durch »eine Frau finden« nahegelegt. Die kürzere Wiedergabe bewahrt jedoch die formale Mehrdeutigkeit des hebräischen Wortes.
translation_notes:
  register: Knapper, würdevoller Spruchstil in modernem Standarddeutsch. Die Parallelität von »findet« und »erlangt« bleibt erhalten; »Gutes« bildet die substantivische Kürze von טוֹב ab.
