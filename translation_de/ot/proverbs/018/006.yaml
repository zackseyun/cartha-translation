  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Körpermetaphorik und knappem Spruchstil. „Tor“ hält die traditionelle Sprache der Weisheitsliteratur aufrecht, ohne altertümliche Satzformen zu verwenden.
