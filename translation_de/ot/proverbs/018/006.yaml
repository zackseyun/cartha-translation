  source_fidelity: 'Die Übersetzung gibt beide Kola eng am Hebräischen wieder: „Lippen“ und „Mund“ bewahren die parallelen Metonymien für das Reden; „geraten in Streit“ entspricht יָבֹאוּ בְרִיב als Beteiligung an einem Konflikt; „ruft nach Schlägen“ gibt יִקְרָא לְמַהֲלֻמוֹת treffend wieder. Die Aussage, dass das Reden des Toren Konflikt und Schläge auf sich zieht, wird nicht überdeutet.'
