source:
  edition: WLC
  text: שִׂפְתֵ֣י כְ֭סִיל יָבֹ֣אֽוּ בְ/רִ֑יב וּ֝/פִ֗י/ו לְֽ/מַהֲלֻמ֥וֹת יִקְרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/006.yaml
  text: A fool’s lips enter into strife[b][a], and his mouth calls for blows.
translation:
  language: de
  text: Die Lippen eines Toren geraten in Streit[a], und sein Mund ruft nach Schlägen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: kommen in einen Streit hinein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: lädt Schläge ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: Lippen
  rationale: Das konkrete Bild „Lippen“ bleibt als Metonymie für das Reden erhalten und bildet den poetischen Parallelismus zu „Mund“.
- source_word: כְסִיל
  choice: Tor
  rationale: „Tor“ ist im Deutschen der etablierte Begriff der Weisheitsliteratur für einen moralisch und praktisch uneinsichtigen Menschen; gemeint ist nicht bloß geringe Intelligenz.
- source_word: יָבֹאוּ בְרִיב
  choice: geraten in Streit
  rationale: Die Wendung gibt das Eintreten beziehungsweise Hineingeraten in eine Auseinandersetzung natürlich wieder, ohne sie unnötig kausal umzudeuten.
- source_word: פִיו
  choice: sein Mund
  rationale: Die wörtliche Körpermetapher bewahrt den Parallelismus mit „Lippen“ und die bildhafte Darstellung des Redens.
- source_word: לְמַהֲלֻמוֹת
  choice: nach Schlägen
  rationale: Das Substantiv bezeichnet Schläge beziehungsweise Hiebe; „Schläge“ ist im Kontext klar und idiomatisch.
- source_word: יִקְרָא
  choice: ruft nach
  rationale: Die Formulierung wahrt das Bild des Rufens und lässt zugleich erkennen, dass das törichte Reden körperliche Vergeltung provoziert.
