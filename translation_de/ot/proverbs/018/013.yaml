id: PRO.18.13
reference: Proverbs 18:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מֵשִׁ֣יב דָּ֭בָר בְּ/טֶ֣רֶם יִשְׁמָ֑ע אִוֶּ֥לֶת הִיא ל֝֗/וֹ וּ/כְלִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/013.yaml
  text: He who answers a matter before he hears it[a], it is folly and shame to him.
translation:
  language: de
  text: Wer auf eine Sache[a] antwortet, bevor er sie angehört hat – für den ist das Torheit und Schande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „ein Wort“ beziehungsweise „einen Fall“. Das hebräische דָּבָר kann „Wort“, „Sache“ oder „Fall“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵשִׁיב
  choice: antwortet
  rationale: Das Hifil-Partizip von שׁוב wird hier idiomatisch im Sinn von „antworten“ oder „erwidern“ gebraucht. „antwortet“ ist knapp und entspricht dem Spruchstil.
- source_word: דָּבָר
  choice: eine Sache
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Fall“ bedeuten. „Sache“ wahrt die breite Anwendbarkeit auf Gespräche, Streitfragen und Entscheidungen; die Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
- source_word: בְּטֶרֶם
  choice: bevor
  rationale: Gibt die zeitliche Bedeutung klar und idiomatisch wieder.
- source_word: יִשְׁמָע
  choice: sie gehört hat
  rationale: שׁמע bezeichnet hier das Hören beziehungsweise Anhören der Sache. Das deutsche Perfekt nach „bevor“ macht natürlich deutlich, dass erst vollständig gehört werden soll, ohne den Sinn zu verändern.
- source_word: אִוֶּלֶת
  choice: Torheit
  rationale: „Torheit“ ist die etablierte, prägnante Wiedergabe dieses zentralen Weisheitsbegriffs und umfasst sowohl mangelnde Einsicht als auch verkehrtes Verhalten.
- source_word: הִיא
  choice: das ist
  rationale: Das Demonstrativpronomen „das“ greift im Deutschen natürlich das zuvor beschriebene Verhalten auf; die Kopula gibt den hebräischen Nominalsatz wieder.
- source_word: לוֹ
  choice: für den
  rationale: Die auf das Relativpronomen abgestimmte Formulierung gibt den persönlichen Bezug des ל wieder und klingt im modernen Deutschen natürlicher als „ihm“ in dieser Satzstellung.
- source_word: וּכְלִמָּה
  choice: und Schande
  rationale: „Schande“ bewahrt die Bedeutung von öffentlicher Beschämung beziehungsweise Entehrung und die knappe Paarung mit „Torheit“.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Spruchstil mit knapper antithetischer Wirkung. Der Gedankenstrich markiert den Übergang von der Handlung zu ihrer Bewertung. Die substantivische Paarung „Torheit und Schande“ bleibt erhalten.
