  variant: modern standard German
source:
  edition: WLC
  text: מַתָּ֣ן אָ֭דָם יַרְחִ֣יב ל֑/וֹ וְ/לִ/פְנֵ֖י גְדֹלִ֣ים יַנְחֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/016.yaml
  text: A man's gift makes room for him[b][a], and brings him before great men.
translation:
  language: de
  text: Das Geschenk eines Menschen verschafft ihm Raum[a] und führt ihn vor die Großen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „macht ihm weiten Raum“ beziehungsweise „öffnet ihm den Weg“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind hochgestellte oder einflussreiche Menschen.
    reason: lexical_clarification
lexical_decisions:
- source_word: מַתָּן
  choice: Geschenk
  rationale: Das Substantiv bezeichnet ein Geschenk oder eine Gabe. „Geschenk“ vermeidet im Deutschen die mögliche Bedeutung einer angeborenen Begabung und passt zum sozialen Zusammenhang des Spruchs.
- source_word: אָדָם
  choice: eines Menschen
  rationale: אָדָם steht hier im Singular und wird allgemein gebraucht. „eines Menschen“ gibt diese generische Bedeutung natürlich und ohne unnötige geschlechtliche Festlegung wieder.
- source_word: יַרְחִיב לוֹ
  choice: verschafft ihm Raum
  rationale: Der Hifil von רחב bedeutet wörtlich „weit machen“. Die Formulierung bewahrt das räumliche Bild und lässt offen, ob Zugang, Gelegenheit oder gesellschaftlicher Spielraum gemeint ist.
- source_word: וְלִפְנֵי גְדֹלִים
  choice: vor die Großen
  rationale: לִפְנֵי bezeichnet die Gegenwart beziehungsweise das Angesicht von jemandem; גְדֹלִים meint hier hochgestellte, einflussreiche oder bedeutende Personen. „die Großen“ ist knapp und bewahrt die bildhafte gesellschaftliche Bezeichnung.
- source_word: יַנְחֶנּוּ
  choice: führt ihn
  rationale: Der Hifil von נחה bedeutet „führen“ oder „leiten“. „führt ihn“ bildet den Vorgang genauer ab als eine rein resultative Umschreibung.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Spruchstil. Die konkrete Raummetapher des Hebräischen bleibt erhalten; „die Großen“ ist bewusst knapp und bezeichnet gesellschaftlich bedeutende Personen.
