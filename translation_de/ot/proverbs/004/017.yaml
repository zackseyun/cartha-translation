  text: כִּ֣י לָ֭חֲמוּ לֶ֣חֶם רֶ֑שַׁע וְ/יֵ֖ין חֲמָסִ֣ים יִשְׁתּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/017.yaml
  text: For they eat the bread of wickedness[b][a], and drink the wine of violence.
translation:
  language: de
  text: Denn sie essen das Brot der Bosheit[a] und trinken den Wein der Gewalt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nähren sich vom Brot der Bosheit“. Das hier verwendete Verb kann „essen“, „verzehren“ oder „sich nähren“ bedeuten; „essen“ entspricht am deutlichsten der Parallele zu „trinken“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Wein der Gewalttaten“. Der hebräische Plural kann mehrere Gewalttaten bezeichnen oder die Vorstellung von Gewalt verstärken beziehungsweise zusammenfassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorangehende Warnung; „Denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder.
- source_word: לָחֲמוּ
  choice: sie essen
  rationale: Das seltenere Verb לחם II bedeutet hier „essen, verzehren“ und steht parallel zu „trinken“. „Sie essen“ ist die unmittelbarste Wiedergabe.
- source_word: לֶחֶם
  choice: das Brot
  rationale: Das konkrete Bild „Brot“ wird beibehalten, da es bewusst mit „Wein“ parallel steht.
- source_word: רֶשַׁע
  choice: Bosheit
  rationale: „Bosheit“ bezeichnet hier die moralische Verkehrtheit und bewahrt die prägnante Genitivverbindung „Brot der Bosheit“.
- source_word: וְיֵין
  choice: und … den Wein
  rationale: Die Konjunktion verbindet die beiden parallelen Satzglieder; im Deutschen wird das nachgestellte Verb in natürlicher Wortfolge vor das Objekt gesetzt.
- source_word: חֲמָסִים
  choice: Gewalttaten
  rationale: Der hebräische Plural wird sichtbar bewahrt und kann konkrete oder kollektiv verstandene Gewalttaten bezeichnen, ohne ihn vorschnell zum abstrakten Singular einzuebnen.
- source_word: יִשְׁתּוּ
  choice: trinken
  rationale: Das Verb wird mit dem bereits im ersten Satzglied genannten Subjekt „sie“ koordiniert und erhält so eine natürliche deutsche Parallelstruktur.
theological_decisions: []
