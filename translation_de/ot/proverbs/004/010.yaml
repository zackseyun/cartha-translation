source:
  edition: WLC
  text: שְׁמַ֣ע בְּ֭נִ/י וְ/קַ֣ח אֲמָרָ֑/י וְ/יִרְבּ֥וּ לְ֝/ךָ֗ שְׁנ֣וֹת חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/010.yaml
  text: Hear[a], my son, and receive my words[c][b], and the years of your life will be many.
translation:
  language: de
  text: Höre, mein Sohn, und nimm meine Worte an; deine Lebensjahre werden zahlreich sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und deine Lebensjahre werden sich mehren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Höre
  rationale: Der Imperativ bedeutet sowohl hören als auch aufmerksam auf eine Weisung hören. „Höre“ bewahrt die knappe, feierliche Anrede.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die maskuline Singularform und der väterliche Lehrrahmen des Sprüchebuchs werden direkt wiedergegeben.
- source_word: וְקַח
  choice: und nimm … an
  rationale: לקח bezeichnet hier das aufnehmende Annehmen der Worte. Das trennbare Verb „annehmen“ ist im Deutschen natürlicher als ein bloßes „nehmen“.
- source_word: אֲמָרָי
  choice: meine Worte
  rationale: Die einfache und im Weisheitskontext passende Wiedergabe lässt offen, ob einzelne Aussprüche oder die gesamte Unterweisung gemeint sind.
- source_word: וְיִרְבּוּ לְךָ שְׁנוֹת חַיִּים
  choice: dann werden dir viele Lebensjahre zuteil
  rationale: Die Formulierung gibt das Vermehren beziehungsweise Viele-Werden der Lebensjahre sowie das dativische לְךָ in natürlichem Deutsch wieder. „Dann“ macht den im Satz angelegten Folgezusammenhang idiomatisch sichtbar, ohne ihn als mechanische Garantie näher auszudeuten.
theological_decisions:
- issue: Geschlechtsspezifische Anrede in der Weisheitsunterweisung
  choice: mein Sohn
  alternative: mein Kind
  rationale: Das Hebräische ist ausdrücklich maskulin Singular und gehört zum literarischen Rahmen väterlicher Unterweisung. Eine geschlechtsneutrale Glättung würde diese Form abschwächen.
- issue: Verhältnis zwischen Annahme der Weisung und langem Leben
  choice: dann werden dir viele Lebensjahre zuteil
  alternative: und deine Lebensjahre werden sich mehren
  rationale: Die resultative Beziehung bleibt erhalten, ohne zusätzliche Aussagen über die Art oder ausnahmslose Geltung dieser Weisheitsverheißung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt knapp und eindringlich; „Lebensjahre“ entspricht dem hebräischen Ausdruck natürlich. Das Semikolon bildet den Übergang von Aufforderung zu Folge ab.
