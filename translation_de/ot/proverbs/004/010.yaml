review_pass:
  verdict: revise
  source_fidelity: Die Anrede und die beiden Imperative geben שְׁמַע בְּנִי וְקַח אֲמָרַי treffend wieder. Im Schlusssatz verschiebt „werden dir ... zuteil“ jedoch den Sinn in Richtung einer Zuteilung bzw. Gewährung, während das Hebräische aussagt, dass die Lebensjahre selbst zahlreich werden bzw. sich mehren. Das zusätzliche „dann“ ist als Folgerelation zwar naheliegend, aber nicht nötig.
  naturalness: „Höre, mein Sohn, und nimm meine Worte an“ ist natürliches, würdiges modernes Standarddeutsch. „Deine Lebensjahre werden zahlreich sein“ ist klar und angemessen; es vermeidet die leicht unidiomatische und semantisch stärker gefärbte Wendung „Lebensjahre werden zuteil“.
  terminology: „Mein Sohn“ wahrt die maskuline Singularanrede. „Worte“ und „Lebensjahre“ sind für den Weisheitskontext passend und sachgerecht.
  issues:
  - severity: medium
    issue: „werden dir viele Lebensjahre zuteil“
    rationale: Die Wendung legt eine nicht im hebräischen Wortlaut ausgedrückte Zuteilung oder Gewährung nahe. וְיִרְבּוּ ... שְׁנוֹת חַיִּים beschreibt vielmehr das Viel-Werden bzw. Sich-Mehren der Lebensjahre.
  - severity: low
    issue: „dann“
    rationale: Die Folgebeziehung ist im Weisheitsspruch plausibel, doch das Hebräische verbindet schlicht mit וְ. Ohne „dann“ bleibt die knappe Verbindung enger am Ausgangstext.
  revised_text: Höre, mein Sohn, und nimm meine Worte an; deine Lebensjahre werden zahlreich sein.[a]
