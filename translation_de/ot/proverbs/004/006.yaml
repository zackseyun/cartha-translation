source:
  edition: WLC
  text: אַל תַּעַזְבֶ֥/הָ וְ/תִשְׁמְרֶ֑/ךָּ אֱהָבֶ֥/הָ וְ/תִצְּרֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/006.yaml
  text: Do not forsake her[a], and she will keep you; love her, and she will guard you.
translation:
  language: de
  text: Verlass sie[a] nicht, und sie wird dich behüten; liebe sie, und sie wird dich bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die Weisheit, die in diesem Abschnitt als Frau dargestellt wird.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תַּעַזְבֶהָ
  choice: Verlass sie nicht
  rationale: אַל mit der Präformativkonjugation formuliert ein Verbot; עזב bedeutet hier „verlassen/preisgeben“. „Verlass sie nicht“ ist natürlich und bewahrt den relationalen Nachdruck.
- source_word: וְתִשְׁמְרֶךָּ
  choice: dann wird sie dich behüten
  rationale: שׁמר bezeichnet bewahrendes Achten und Hüten. Das deutsche „behüten“ gibt diesen fürsorglich-schützenden Sinn wieder; „dann“ macht die hier naheliegende Folgebeziehung idiomatisch deutlich, ohne sie als mechanische Bedingung zu überzeichnen.
- source_word: אֱהָבֶהָ
  choice: liebe sie
  rationale: אהב ist das gewöhnliche Verb für „lieben“. Die schlichte, direkte Formulierung erhält sowohl den Imperativ als auch die weibliche Personifikation.
- source_word: וְתִצְּרֶךָּ
  choice: dann wird sie dich beschützen
  rationale: נצר trägt hier den Sinn von schützendem Bewahren. „Beschützen“ unterscheidet die zweite Aussage leicht von „behüten“ und bildet die parallele Steigerung natürlich ab.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: Die femininen Pronomen „sie“ werden beibehalten.
  alternative: Die Weisheit als sächliches Abstraktum behandeln oder das Substantiv „Weisheit“ wiederholen.
  rationale: Die hebräischen femininen Suffixe beziehen sich im Kontext auf die als Frau dargestellte Weisheit. Die Beibehaltung bewahrt das literarische Bild, ohne daraus eine weitergehende dogmatische Aussage abzuleiten.
- issue: Verhältnis von Aufforderung und Verheißung
  choice: 'Die Waw-Sätze werden als naheliegende Folge wiedergegeben: „dann wird sie …“.'
  alternative: 'Rein koordinierend: „und sie wird …“.'
  rationale: Nach den Aufforderungen drücken die folgenden Verbformen sinnvoll eine verheißene Folge aus. „Dann“ ist im Deutschen klar und natürlich, lässt den weisheitlichen Charakter der Aussage jedoch bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzform und die weibliche Personifikation bleiben erhalten; „behüten“ und „beschützen“ geben die verwandten, aber leicht unterschiedlichen Schutzverben wieder.
