  text: תִּתֵּ֣ן לְ֭/רֹאשְׁ/ךָ לִוְיַת חֵ֑ן עֲטֶ֖רֶת תִּפְאֶ֣רֶת תְּמַגְּנֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/009.yaml
  text: She will place on your head a graceful wreath[b][a]; she will bestow on you a crown of beauty.
translation:
  language: de
  text: Sie setzt dir einen anmutigen Kranz[a] auf den Kopf; sie schenkt dir eine prächtige Krone[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Kranz der Anmut“; חֵן kann auch „Gunst“ oder „Wohlgefallen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „eine Krone der Pracht“; auch „eine Krone der Schönheit“ ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן
  choice: sie setzt
  rationale: Das Qal-Imperfekt 3. Person Singular feminin bezieht sich im Zusammenhang auf die personifizierte Weisheit. Mit der Ortsangabe „auf den Kopf“ gibt „setzt“ die konkrete Handlung natürlicher wieder als das allgemeinere „gibt“.
- source_word: לְרֹאשְׁךָ
  choice: dir … auf den Kopf
  rationale: Die Präposition ל wird im Zusammenhang mit einem Kopfschmuck idiomatisch als „auf“ wiedergegeben; das Suffix der 2. Person Singular maskulin erscheint im deutschen Dativpronomen „dir“.
- source_word: לִוְיַת
  choice: Kranz
  rationale: Das Substantiv bezeichnet einen als Schmuck getragenen Kranz oder eine Girlande. „Kranz“ ist im Deutschen klar, bildhaft und natürlich.
- source_word: חֵן
  choice: anmutigen
  rationale: חֵן kann Anmut, Wohlgefallen oder Gunst bezeichnen. Im Verhältnis zu „Kranz“ vermittelt das Adjektiv „anmutig“ den schmückenden Sinn, ohne die mögliche substantivische Lesart zu verdecken; diese wird in der Fußnote genannt.
- source_word: עֲטֶרֶת
  choice: Krone
  rationale: „Krone“ ist die geläufige und sachlich passende Wiedergabe des bezeichneten kostbaren Kopfschmucks.
- source_word: תִּפְאֶרֶת
  choice: prächtige
  rationale: Das Wort umfasst Schönheit, Pracht, Herrlichkeit und Ehre. Im parallelen Bild des Kopfschmucks gibt „prächtig“ die sichtbare Pracht natürlich wieder; die engere Alternative „Schönheit“ bleibt in der Fußnote erhalten.
- source_word: תְּמַגְּנֶךָּ
  choice: sie schenkt dir
  rationale: Die Form bezeichnet hier im Parallelismus das Überreichen oder Zuteilen der Krone. „Schenkt dir“ ist verständlich und würdevoll und vermeidet die in diesem Zusammenhang unpassende Deutung „sie beschirmt dich“.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdig-poetischem Klang. Die parallelen Bilder von Kranz und Krone bleiben erhalten; auf das heute markierte „Haupt“ wird zugunsten von „Kopf“ verzichtet.
