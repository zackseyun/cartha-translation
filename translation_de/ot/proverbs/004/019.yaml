source:
  edition: WLC
  text: דֶּ֣רֶךְ רְ֭שָׁעִים כָּֽ/אֲפֵלָ֑ה לֹ֥א יָ֝דְע֗וּ בַּ/מֶּ֥ה יִכָּשֵֽׁלוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/019.yaml
  text: The way of the wicked is like deep darkness[b][a]; they do not know what makes them stumble.
translation:
  language: de
  text: Der Weg der Gottlosen ist wie tiefes Dunkel[a]; sie wissen nicht, worüber sie stolpern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie dichtes Dunkel« oder »wie Finsternis«. Das hebräische Wort bezeichnet besonders tiefes, dichtes Dunkel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wodurch sie zu Fall kommen« bzw. »was sie stolpern lässt«. Der hebräische Ausdruck kann sowohl das Hindernis als auch die Ursache des Stolperns bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: Weg
  rationale: Bewahrt die in der Weisheitsliteratur geläufige Metapher für Lebensführung und Verhalten.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Gibt die substantivische Pluralform für moralisch schuldige Menschen knapp und im gehobenen Weisheitsstil wieder, ohne das Wort auf einzelne Taten zu verengen.
- source_word: כָּאֲפֵלָה
  choice: wie tiefes Dunkel
  rationale: Das Präfix כְּ bezeichnet den Vergleich; אֲפֵלָה meint besonders dichtes, bedrückendes Dunkel und ist stärker als gewöhnliche Dunkelheit.
- source_word: לֹא יָדְעוּ
  choice: sie wissen nicht
  rationale: Entspricht direkt dem hebräischen Ausdruck und lässt sowohl Unwissenheit als auch mangelnde Einsicht anklingen.
- source_word: בַּמֶּה יִכָּשֵׁלוּ
  choice: worüber sie stolpern
  rationale: Gibt die Präposition בְּ mit dem Fragewort möglichst unmittelbar wieder und bewahrt das konkrete Bild des Stolperns; die mögliche instrumental-kausale Deutung wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und die Weg-Dunkelheits-Metaphorik bleiben erhalten; die Mehrdeutigkeit der Schlusswendung wird nicht im Haupttext aufgelöst, sondern durch eine Fußnote offengehalten.
