source:
  edition: WLC
  text: כִּֽי חַיִּ֣ים הֵ֭ם לְ/מֹצְאֵי/הֶ֑ם וּֽ/לְ/כָל בְּשָׂר֥/וֹ מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/022.yaml
  text: For they are life to those who find them[a], and healing to all their flesh.
translation:
  language: de
  text: Denn sie sind Leben für alle, die sie finden, und Heilung für den ganzen Leib eines jeden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Heilung für sein ganzes Fleisch«. Das hebräische Suffix steht in der Einzahl und bezieht sich jeweils auf einen Menschen, der die Worte findet.'
    reason: lexikalische Alternative und Erläuterung des Numeruswechsels
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Mahnung ein und gibt den erklärenden Zusammenhang des hebräischen Textes natürlich wieder.
- source_word: חַיִּים
  choice: Leben
  rationale: Die formal plurale Form bezeichnet hier idiomatisch das Leben als Ganzes; der deutsche Singular ist dafür die natürliche Entsprechung.
- source_word: הֵם
  choice: sie sind
  rationale: Das Pronomen verweist auf die unmittelbar zuvor genannten Worte beziehungsweise Weisungen; im Deutschen wird die Kopula ausdrücklich gesetzt.
- source_word: לְמֹצְאֵיהֶם
  choice: für alle, die sie finden
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die die Worte finden. Die Wiedergabe ist verständlich und bewahrt das pluralische Objekt »sie«.
- source_word: וּלְכָל בְּשָׂרוֹ
  choice: für den ganzen Leib eines jeden
  rationale: כָּל mit בָּשָׂר meint die gesamte leibliche Person. »Eines jeden« bringt den distributiven generischen Singular des hebräischen Suffixes zum Ausdruck, ohne im Deutschen einen unklaren Pronomenbezug zu erzeugen.
- source_word: מַרְפֵּא
  choice: Heilung
  rationale: Das Substantiv bezeichnet Heilung beziehungsweise Genesung; »Heilung« wahrt den resultativen Sinn, ohne ein konkretes Heilmittel in den Text hineinzulesen.
theological_decisions:
- issue: Generischer maskuliner Singular im Spruchwort
  choice: »für den ganzen Leib eines jeden«
  alternative: »für ihren ganzen Leib«
  rationale: Das hebräische Suffix steht in der maskulinen Einzahl und betrachtet die zuvor genannten Finder distributiv als einzelne Person. Die gewählte Form bewahrt diesen Wechsel, bleibt aber idiomatisches Deutsch.
- issue: Wörtliche oder sinngemäße Wiedergabe von בָּשָׂר
  choice: »Leib« im Haupttext
  alternative: »Fleisch«
  rationale: בָּשָׂר bedeutet wörtlich »Fleisch«, bezeichnet hier jedoch den gesamten körperlichen Menschen. »Leib« vermittelt diesen Sinn im heutigen Deutsch klarer; die wörtliche Form bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelität von »Leben« und »Heilung« bleibt erhalten; die distributive Formulierung löst den hebräischen Wechsel vom Plural zum generischen Singular nicht stillschweigend auf.
