id: PRO.4.5
reference: Proverbs 4:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: קְנֵ֣ה חָ֭כְמָה קְנֵ֣ה בִינָ֑ה אַל תִּשְׁכַּ֥ח וְ/אַל תֵּ֝֗ט מֵֽ/אִמְרֵי פִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/005.yaml
  text: Acquire wisdom[a]; acquire understanding. Do not forget[b], and do not turn away from the words of my mouth.
translation:
  language: de
  text: Erwirb Weisheit[a], erwirb Einsicht. Vergiss es nicht und weiche nicht ab von den Worten meines Mundes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erlange Weisheit“ beziehungsweise „Verschaffe dir Weisheit“. Das hebräische Verb kann je nach Zusammenhang auch „kaufen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wende dich nicht ab von den Worten meines Mundes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְנֵה
  choice: Erwirb
  rationale: Der Imperativ von קנה bezeichnet hier das bewusste Erlangen eines wertvollen Gutes. „Erwirb“ bewahrt diesen Nachdruck, ohne den Vorgang unnötig auf einen Kauf zu beschränken; die Wiederholung bildet die hebräische Rhetorik ab.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und kontextgerechte Wiedergabe von חכמה in den Sprüchen; gemeint ist praktische und sittliche Lebensweisheit.
- source_word: בִינָה
  choice: Einsicht
  rationale: בינה bezeichnet Verständnis beziehungsweise Unterscheidungsvermögen. „Einsicht“ ist im Deutschen natürlich und wahrt gegenüber „Weisheit“ eine erkennbare Bedeutungsnuance.
- source_word: אַל תִּשְׁכַּח
  choice: Vergiss es nicht
  rationale: שכח bedeutet primär „vergessen“. Das im Deutschen nötige Pronomen bezieht sich zusammenfassend auf die zuvor geforderte Weisheit und Einsicht, ohne die mögliche Nebenbedeutung des Vernachlässigens in den Haupttext einzutragen.
- source_word: וְאַל תֵּט
  choice: und weiche nicht ab
  rationale: נטה kann hier das Abweichen oder Sich-Abwenden von einer vorgegebenen Weisung bezeichnen. „Weiche nicht ab“ erhält das Bild des Verlassens eines gewiesenen Weges.
- source_word: מֵאִמְרֵי פִי
  choice: von den Worten meines Mundes
  rationale: Die wörtlich-bildhafte Wendung hebt die mündlich erteilte Unterweisung hervor und lässt sich im Deutschen würdig und verständlich bewahren.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die eindringliche Wiederholung von „Erwirb“ und das hebräische Bild „Worte meines Mundes“ bleiben erhalten. Die Satzstellung wurde nur so weit angepasst, wie es für verständliches Deutsch nötig ist.
