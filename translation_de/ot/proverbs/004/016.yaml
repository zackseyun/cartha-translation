source:
  edition: WLC
  text: כִּ֤י לֹ֣א יִֽ֭שְׁנוּ אִם לֹ֣א יָרֵ֑עוּ וְֽ/נִגְזְלָ֥ה שְׁ֝נָתָ֗/ם אִם לֹ֥א יכשולו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/016.yaml
  text: For they do not sleep unless they have done evil[a], and their sleep is taken away unless they make someone stumble.
translation:
  language: de
  text: Denn sie schlafen nicht, solange sie nichts Böses getan haben, und ihr Schlaf wird ihnen geraubt, solange sie niemanden zu Fall gebracht haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »solange sie nicht selbst zu Fall gekommen sind«. Die knappe hebräische Form kann entweder als Verursachen des Sturzes eines anderen oder als eigenes Straucheln verstanden werden; der Zusammenhang spricht eher für die Schädigung anderer.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Warnung ein und bewahrt den kausalen Zusammenhang.
- source_word: לֹא יִשְׁנוּ אִם לֹא
  choice: sie schlafen nicht, solange sie nicht
  rationale: Gibt die wiederkehrende Bedingung natürlich wieder, ohne das Verb ausdrücklich als »nicht schlafen können« auszulegen.
- source_word: יָרֵעוּ
  choice: Böses getan haben
  rationale: Das Hifil von רעע bezeichnet hier allgemein böses oder schädigendes Handeln. Da kein Objekt genannt wird, bleibt die Formulierung bewusst allgemein; das Perfekt bezeichnet im Deutschen die Handlung, die dem Schlaf vorausgehen muss.
- source_word: וְנִגְזְלָה שְׁנָתָם
  choice: ihr Schlaf wird ihnen geraubt
  rationale: Bewahrt das Passiv und die kräftige Metapher von גזל, klingt dabei im modernen Deutschen würdig und verständlich.
- source_word: יכשולו
  choice: jemanden zu Fall gebracht haben
  rationale: Der Zusammenhang mit dem Bösestun legt nahe, dass die Frevler andere ins Straucheln oder Verderben bringen. »Zu Fall bringen« bewahrt die Bildsprache und lässt sowohl tatsächliche als auch übertragene Schädigung zu; die mögliche intransitive Lesart wird in der Fußnote genannt.
theological_decisions:
- issue: Moralische Reichweite von יָרֵעוּ ohne genanntes Objekt
  choice: Allgemeines Bösestun
  alternative: anderen Schaden zufügen
  rationale: Der hebräische Text nennt kein Opfer. Die Übersetzung vermeidet daher eine unnötige Eingrenzung; erst der parallele zweite Satz beschreibt den möglichen Schaden an einem anderen.
- issue: Bedeutung von יכשולו
  choice: 'Im Zusammenhang kausativ verstanden: jemanden zu Fall bringen'
  alternative: 'Intransitiv verstanden: selbst zu Fall kommen'
  rationale: Der Parallelismus mit dem Bösestun und die Logik des Spruchs sprechen dafür, dass die Bösen erst Ruhe finden, nachdem sie anderen geschadet haben. Da die knappe hebräische Form auch intransitiv verstanden werden kann, bleibt diese Möglichkeit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Satzführung. Die Wiederholung von »solange« bildet den hebräischen Parallelismus ab; »geraubt« und »zu Fall gebracht« erhalten die anschauliche Sprache des Originals.
