  text: אַל יַלִּ֥יזוּ מֵ/עֵינֶ֑י/ךָ שָׁ֝מְרֵ֗/ם בְּ/ת֣וֹךְ לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/021.yaml
  text: Do not let them depart from your eyes[b][a]; keep them within your heart.
translation:
  language: de
  text: Lass sie nicht aus deinen Augen weichen[a]; bewahre sie im Innern deines Herzens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lass sie nicht aus deinem Blick geraten.“'
    reason: lexical_alternative
  - marker: b
    text: Mit „Herz“ ist hier der innere Mensch gemeint – der Bereich des Denkens, Wollens und Empfindens.
    reason: cultural_note
lexical_decisions:
- source_word: אַל
  choice: Lass … nicht
  rationale: Die Verneinung אַל leitet hier ein Verbot ein. „Lass … nicht“ ist im modernen Deutschen natürlich und passt zur Verbform der dritten Person Plural.
- source_word: יַלִּיזוּ
  choice: weichen
  rationale: Das Verb לוז bezeichnet hier ein Abweichen oder Sich-Entfernen. „Weichen“ bewahrt die konkrete Vorstellung, dass die Worte nicht aus dem Blickfeld geraten sollen.
- source_word: מֵעֵינֶיךָ
  choice: aus deinen Augen
  rationale: Die wörtliche Wendung erhält das hebräische Bild. Gemeint ist, die Worte beständig im Blick und in der Aufmerksamkeit zu behalten.
- source_word: שָׁמְרֵם
  choice: bewahre sie
  rationale: Der Imperativ von שׁמר kann hüten, bewahren oder festhalten bedeuten. „Bewahre sie“ ist natürlich und umfasst sowohl sorgsames Hüten als auch inneres Festhalten.
- source_word: בְּתוֹךְ
  choice: im Innern
  rationale: Die Wendung bezeichnet das Innere oder die Mitte von etwas. „Im Innern“ gibt die räumliche Bildsprache deutlicher wieder als ein schlichtes „in“.
- source_word: לְבָבֶךָ
  choice: deines Herzens
  rationale: לֵבָב bezeichnet im Hebräischen den inneren Menschen, einschließlich Denken, Wollen und Empfinden. „Herz“ bewahrt die biblische Metapher, ohne sie einseitig auf Gefühl oder Verstand festzulegen.
theological_decisions: []
