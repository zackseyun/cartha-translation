source:
  edition: WLC
  text: וְ/אֹ֣רַח צַ֭דִּיקִים כְּ/א֣וֹר נֹ֑גַהּ הוֹלֵ֥ךְ וָ֝/א֗וֹר עַד נְכ֥וֹן הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/018.yaml
  text: But the path of the righteous is like the light of dawn[b][a], going on and shining until the day is fully established.
translation:
  language: de
  text: 'Doch der Pfad der Gerechten ist wie das Morgenlicht: Es leuchtet immer heller, bis der volle Tag erreicht ist.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wie glänzendes Licht, das fortschreitend leuchtet, bis der Tag fest steht“.'
    reason: Die Fußnote bewahrt die konkreteren lexikalischen Werte von נֹגַהּ, הוֹלֵךְ וָאוֹר und נְכוֹן, während der Haupttext die fortschreitende Helligkeit in natürlichem Deutsch wiedergibt.
lexical_decisions:
- source_word: וְ/אֹרַח
  choice: Doch der Pfad
  rationale: אֹרַח bezeichnet einen Pfad oder Weg. Das vorangestellte וְ wird wegen des Gegensatzes zum Weg der Frevler im vorhergehenden Vers natürlich mit „Doch“ wiedergegeben.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: Das substantivierte Adjektiv im Plural bezeichnet die Menschen, die recht handeln. „Die Gerechten“ bewahrt die prägnante ethisch-theologische Kategorie des Sprüchebuchs.
- source_word: כְּ/אוֹר נֹגַהּ
  choice: wie das Morgenlicht
  rationale: כְּ kennzeichnet den Vergleich, אוֹר bedeutet „Licht“, und נֹגַהּ bezeichnet Glanz oder strahlende Helligkeit. Da das Bild bis zum vollen Tag fortschreitet, gibt „Morgenlicht“ den gemeinten Lichtglanz am Tagesbeginn natürlich wieder, ohne die wörtlich mögliche Bedeutung „glänzendes Licht“ zu verschweigen.
- source_word: הוֹלֵךְ וָ/אוֹר
  choice: Es leuchtet immer heller
  rationale: 'Die Verbindung bedeutet wörtlich etwa „gehend und leuchtend“ und ist eine hebräische Verlaufsformel: Das Leuchten schreitet fort beziehungsweise nimmt zu. „Es leuchtet immer heller“ drückt diesen Verlauf im heutigen Deutsch klar und bildhaft aus.'
- source_word: עַד נְכוֹן הַ/יּוֹם
  choice: bis der volle Tag erreicht ist
  rationale: עַד markiert den Endpunkt. נְכוֹן, von כון, bezeichnet etwas Feststehendes oder vollständig Eingetretenes. Im Bild vom zunehmenden Tageslicht ist damit der voll entwickelte Tag gemeint; die Formulierung wahrt zugleich den Endpunktcharakter.
theological_decisions:
- issue: Ethisch-theologische Bedeutung von צַדִּיקִים
  choice: die Gerechten
  alternative: rechtschaffene Menschen
  rationale: „Die Gerechten“ bewahrt die feste moralische Kategorie des hebräischen Weisheitstextes, ohne sie durch spätere konfessionelle Vorstellungen näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Pfad“ erhält die poetische Wegmetapher, während „Es leuchtet immer heller“ die hebräische Verlaufsformel verständlich und idiomatisch wiedergibt.
