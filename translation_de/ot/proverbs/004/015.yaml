  text: פְּרָעֵ֥/הוּ אַל תַּעֲבָר בּ֑/וֹ שְׂטֵ֖ה מֵ/עָלָ֣י/ו וַ/עֲבֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/015.yaml
  text: Avoid it[a]; do not pass through it[b]. Turn away from it and pass on.
translation:
  language: de
  text: Meide ihn[a]; betritt ihn nicht. Wende dich von ihm ab und geh weiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Halte dich von ihm fern.“ Das hebräische Verb ist selten und fordert hier dazu auf, den Weg der Bösen konsequent zu meiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָעֵהוּ
  choice: Meide ihn
  rationale: Das seltene Verb bezeichnet hier das bewusste Fernbleiben vom Weg der Bösen. „Meide ihn“ ist im modernen Deutschen klar, knapp und bewahrt den räumlichen Bezug auf den zuvor genannten Weg.
- source_word: אַל תַּעֲבָר בּוֹ
  choice: betritt ihn nicht
  rationale: עבר mit ב bezeichnet hier das Gehen auf beziehungsweise durch einen Weg. „Betritt ihn nicht“ gibt das Verbot im Deutschen natürlich wieder und vermeidet die missverständliche Vorstellung, man solle den Weg lediglich nicht überqueren.
- source_word: שְׂטֵה מֵעָלָיו
  choice: Wende dich von ihm ab
  rationale: שטה fordert zum Abbiegen oder Abweichen auf; מֵעָלָיו bezeichnet die Entfernung von dem Weg. Die gewählte Formulierung vermittelt die bewusste Abkehr idiomatisch.
- source_word: וַעֲבוֹר
  choice: und geh weiter
  rationale: Der abschließende Imperativ fordert dazu auf, nicht stehen zu bleiben oder den bösen Weg einzuschlagen, sondern daran vorbei weiterzugehen. „Geh weiter“ bildet den Handlungsfortgang natürlich ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, eindringlichen Imperativen. Das grammatische Maskulinum „ihn“ nimmt den zuvor genannten „Weg“ auf. Die räumliche Wegmetapher bleibt erhalten.
