source:
  edition: WLC
  text: אַֽל תֵּט יָמִ֥ין וּ/שְׂמֹ֑אול הָסֵ֖ר רַגְלְ/ךָ֣ מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/027.yaml
  text: Do not turn to the right or to the left[b][a]; remove your foot from evil.
translation:
  language: de
  text: Weiche weder nach rechts noch nach links ab[a]; halte deinen Fuß vom Bösen fern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wende dich weder nach rechts noch nach links.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Entferne deinen Fuß vom Bösen.“'
    reason: literal_rendering
lexical_decisions:
- source_word: תֵּט
  choice: weiche … ab
  rationale: Die mit אַל gebildete Verneinung fordert dazu auf, den geraden Weg nicht zu verlassen. „Abweichen“ gibt das Bild des hebräischen נטה im Zusammenhang mit den beiden Richtungsangaben natürlich und präzise wieder.
- source_word: יָמִין וּשְׂמֹאול
  choice: weder nach rechts noch nach links
  rationale: Die gepaarten Richtungsangaben bezeichnen ein Abweichen in die eine oder andere Richtung. Die deutsche Verbindung „weder … noch“ macht die umfassende Verneinung idiomatisch deutlich und bewahrt den Parallelismus.
- source_word: הָסֵר
  choice: halte … fern
  rationale: Der Imperativ fordert dazu auf, den Fuß vom Bösen wegzunehmen beziehungsweise von ihm entfernt zu halten. „Fernhalten“ ist im Deutschen mit „Fuß“ natürlich und bewahrt zugleich das konkrete Wegbild.
- source_word: רַגְלְךָ
  choice: deinen Fuß
  rationale: Der Singular des Ausgangstextes bleibt erhalten; zugleich wird die körperliche Metapher für Weg und Lebensführung nicht erklärend aufgelöst.
- source_word: מֵרָע
  choice: vom Bösen
  rationale: Im weisheitlichen Zusammenhang ist רַע breit moralisch zu verstehen. „Das Böse“ bewahrt diese Offenheit, ohne den Ausdruck auf Bosheit oder schädliche Folgen einzuengen.
theological_decisions: []
