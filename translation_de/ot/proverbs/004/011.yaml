base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/011.yaml
  text: I have instructed you in the way of wisdom[a]; I have led you in paths of uprightness.
translation:
  language: de
  text: Ich habe dich auf dem Weg der Weisheit unterwiesen; ich habe dich auf Pfaden der Aufrichtigkeit[a] geführt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geradheit«. Das hebräische Wort kann sowohl konkrete Geradheit als auch moralische Aufrichtigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֶרֶךְ חָכְמָה
  choice: auf dem Weg der Weisheit
  rationale: „Weg“ bewahrt das für die Sprüche charakteristische Bild eines Lebensweges; die Präposition בְּ wird natürlich mit „auf“ wiedergegeben.
- source_word: הֹרֵתִיךָ
  choice: ich habe dich … unterwiesen
  rationale: Das Hifil von ירה bezeichnet hier Lehren oder Unterweisen. „Unterwiesen“ gibt den pädagogischen Zusammenhang wieder, ohne das Wegbild durch „gewiesen“ mit dem folgenden Führungsverb zu vermischen.
- source_word: הִדְרַכְתִּיךָ
  choice: ich habe dich … geführt
  rationale: Das Hifil von דרך bezeichnet das Führen oder Leiten auf einem Weg. „Geführt“ ist im Deutschen natürlich und erhält die Bewegungsmetaphorik.
- source_word: בְּמַעְגְּלֵי
  choice: auf Pfaden
  rationale: מַעְגָּל bezeichnet Bahn, Spur oder Pfad. Der Plural wird bewahrt, und „Pfade“ steht als passende poetische Parallele zu „Weg“.
- source_word: יֹשֶׁר
  choice: Aufrichtigkeit
  rationale: Das Wort umfasst sowohl konkrete Geradheit als auch moralische Rechtschaffenheit. „Aufrichtigkeit“ vermittelt im Kontext der Weisheitslehre den ethischen Sinn; die bildhafte Alternative wird in der Fußnote bewahrt.
