base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/025.yaml
  text: Let your eyes look straight ahead[a], and your eyelids be directed before you.
translation:
  language: de
  text: Deine Augen sollen geradeaus blicken, und deine Lider sollen geradeaus gerichtet sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und deine Lider sollen sich gerade nach vorn richten.« Das hebräische Verb bezeichnet das Geradeaus-Ausrichten und kann je nach Auffassung aktiv oder stativisch wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ
  choice: deine Augen
  rationale: Der hebräische Plural mit Suffix der 2. Person Singular wird im Deutschen natürlich als »deine Augen« wiedergegeben.
- source_word: לְנֹכַח
  choice: geradeaus
  rationale: Die Präpositionalverbindung bezeichnet das unmittelbar vor einer Person Liegende; »geradeaus« gibt sowohl die räumliche Ausrichtung als auch den Zusammenhang zielgerichteten Handelns wieder.
- source_word: יַבִּיטוּ
  choice: sollen … blicken
  rationale: נבט bedeutet »blicken, hinschauen«. Die Soll-Konstruktion gibt den auffordernden Sinn des Verses in würdigem, natürlichem Deutsch wieder.
- source_word: וְעַפְעַפֶּיךָ
  choice: und deine Lider
  rationale: Das konkrete Bild der Augenlider bleibt als poetische Parallele zu den Augen erhalten; eine Verflachung zu »Blick« oder »Augen« wird vermieden.
- source_word: יַיְשִׁרוּ
  choice: sollen gerade … schauen
  rationale: Das Verb aus der Wurzel ישר trägt den Gedanken des Geradeseins beziehungsweise Geraderichtens. In Verbindung mit den Lidern drückt »gerade … schauen« die Ausrichtung des Blicks verständlich aus, ohne das Bild aufzugeben.
- source_word: נֶגְדֶּךָ
  choice: vor dich
  rationale: Die Form bezeichnet den Bereich unmittelbar vor der angesprochenen Person; »vor dich« ist knapp und passt zum parallelen »geradeaus«.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche Weisheitssprache mit bewahrtem poetischem Parallelismus. Die wiederholte Soll-Konstruktion trägt den mahnenden Charakter; »Lider« erhält das konkrete hebräische Körperbild.
