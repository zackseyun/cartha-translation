  text: שִׁמְע֣וּ בָ֭נִים מ֣וּסַר אָ֑ב וְ֝/הַקְשִׁ֗יבוּ לָ/דַ֥עַת בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/001.yaml
  text: Hear[a], sons, a father's instruction, and pay attention to know understanding.
translation:
  language: de
  text: Hört[a], ihr Söhne, auf die Unterweisung eines Vaters, und gebt acht, um Einsicht zu gewinnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kinder“. Im Hebräischen steht „Söhne“; so bleibt die für das Sprüchebuch typische Unterweisung von Vater zu Sohn sichtbar.'
    reason: lexikalische Alternative und geschlechtsspezifische Ausgangsform
lexical_decisions:
- source_word: שִׁמְעוּ (שׁמע)
  choice: Hört
  rationale: Der Imperativ Plural fordert zu aufmerksamem Hören auf und bewahrt die knappe, eindringliche Eröffnung des hebräischen Weisheitsspruchs.
- source_word: בָנִים
  choice: ihr Söhne
  rationale: Das ausdrücklich maskuline Pluralwort und die für das Sprüchebuch typische Vater-Sohn-Rahmung bleiben erhalten; „ihr“ macht die deutsche Anrede natürlich.
- source_word: מוּסַר
  choice: Unterweisung
  rationale: Das Wort umfasst belehrende, formende Zucht und Korrektur. „Unterweisung“ passt zum didaktischen Zusammenhang, ohne den Bedeutungsbereich auf Strafe zu verengen.
- source_word: אָב
  choice: eines Vaters
  rationale: Die hebräische Konstruktverbindung ist unbestimmt. Diese Wiedergabe vermeidet die unbegründete Festlegung auf „meines Vaters“.
- source_word: וְהַקְשִׁיבוּ (קשׁב)
  choice: und gebt acht
  rationale: Der zweite Imperativ bezeichnet konzentrierte Aufmerksamkeit und wird gegenüber dem ersten Aufruf zum Hören lexikalisch unterschieden.
- source_word: לָדַעַת (ידע)
  choice: damit ihr … erkennt
  rationale: Der Infinitiv mit ל kann Ziel oder Zweck ausdrücken. „Damit“ gibt diese Beziehung in natürlichem Deutsch wieder, ohne sie übermäßig auszudeuten.
- source_word: בִּינָה
  choice: Einsicht
  rationale: Der zentrale Weisheitsbegriff bezeichnet verstehendes Unterscheidungsvermögen. „Einsicht“ ist im Deutschen idiomatischer als die wörtlichere Verbindung „Verständnis erkennen“.
theological_decisions:
- issue: Geschlechtsspezifische Anrede in der Weisheitsunterweisung
  choice: Söhne
  alternative: Kinder
  rationale: Der hebräische Text verwendet ausdrücklich den maskulinen Plural und bewahrt damit die Vater-Sohn-Szene. Eine mögliche weitere repräsentative Geltung wird in der Fußnote genannt, nicht in den Haupttext eingetragen.
- issue: Bedeutungsumfang von מוּסַר
  choice: Unterweisung
  alternative: Zucht / Erziehung / Zurechtweisung
  rationale: Der unmittelbare Zusammenhang betont die Vermittlung von Weisheit. „Unterweisung“ lässt den formenden Charakter erkennen, ohne das Wort ausschließlich disziplinarisch oder strafend zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Imperative werden knapp und hörbar unterschieden. „Einsicht erkennen“ bewahrt bewusst etwas von der hebräischen Verbindung ידע בינה, klingt jedoch im Deutschen gehoben und weisheitlich.
