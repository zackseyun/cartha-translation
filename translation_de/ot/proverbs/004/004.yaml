  text: וַ/יֹּרֵ֗/נִי וַ/יֹּ֥אמֶר לִ֗/י יִֽתְמָךְ דְּבָרַ֥/י לִבֶּ֑/ךָ שְׁמֹ֖ר מִצְוֺתַ֣/י וֶֽ/חְיֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/004.yaml
  text: Then he taught me and said to me[a], “Let your heart hold fast my words[b]; keep my commandments and live.”
translation:
  language: de
  text: 'Er lehrte mich und sagte zu mir: »Dein Herz[a] soll meine Worte festhalten. Bewahre meine Gebote und lebe!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort »Herz« umfasst hier auch Denken, Willen und Verstehen, nicht nur Gefühle.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּרֵנִי
  choice: Er lehrte mich
  rationale: Die Hifil-Form von ירה bedeutet hier »lehren« oder »unterweisen«. »Er lehrte mich« ist natürlich und bewahrt den pädagogischen Zusammenhang.
- source_word: וַיֹּאמֶר לִי
  choice: und sagte zu mir
  rationale: Entspricht der gewöhnlichen Bedeutung von אמר mit indirektem Objekt und leitet die direkte Rede ohne Zusatzdeutung ein.
- source_word: יִתְמָךְ
  choice: halte … fest
  rationale: תמך bezeichnet Halten, Stützen oder Festhalten. Mit »dein Herz« als Subjekt drückt »festhalten« die dauerhafte innere Aneignung der Worte aus.
- source_word: דְּבָרַי
  choice: meine Worte
  rationale: Eine direkte, umfassende Wiedergabe; »Aussprüche« wäre enger und »Unterweisung« stärker deutend.
- source_word: לִבֶּךָ
  choice: dein Herz
  rationale: Bewahrt das hebräische Bild für das innere Zentrum des Menschen, das Denken, Wollen und Verstehen einschließt.
- source_word: שְׁמֹר
  choice: Bewahre
  rationale: שמר kann »bewahren«, »hüten« oder »halten/befolgen« bedeuten. »Bewahre« verbindet die sorgfältige Beachtung mit der vorausgehenden Aufforderung, die Worte festzuhalten.
- source_word: מִצְוֺתַי
  choice: meine Gebote
  rationale: מצוה bezeichnet eine autoritative Weisung beziehungsweise ein Gebot. »Gebote« ist im Deutschen klar und würdig.
- source_word: וֶחְיֵה
  choice: und lebe!
  rationale: Gibt den Imperativ mit der beigeordneten Konjunktion knapp wieder, ohne ausdrücklich zwischen Aufforderung, Folge und Zweck zu entscheiden.
theological_decisions:
- issue: Verhältnis zwischen dem Bewahren der Gebote und dem Leben
  choice: »Bewahre meine Gebote und lebe!«
  alternative: »Bewahre meine Gebote, damit du lebst« oder »dann wirst du leben«
  rationale: Das hebräische ו verbindet zwei Imperative. Die knappe Beiordnung wahrt die Offenheit zwischen fortgesetzter Aufforderung und resultativem Sinn, statt eine eindeutige Zweck- oder Verheißungsaussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; »halte … fest« und »Bewahre« geben die parallelen, aber nicht völlig identischen Verben natürlich wieder.
