base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/003.yaml
  text: For I was a son to my father[b][a], tender and an only child before my mother.
translation:
  language: de
  text: Denn ich war meines Vaters Sohn, zart und in den Augen meiner Mutter der Einzige.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vor meiner Mutter«. Oder: »Denn ich war der Sohn meines Vaters, zart und meiner Mutter einziger Sohn.« Das hebräische Wort kann auch »der Einzige«, »ein Einziger«, »einzigartig« oder in manchen Zusammenhängen »besonders geliebt« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die väterliche Unterweisung im Zusammenhang ein und bewahrt den erklärenden Sinn.
- source_word: בֵן הָיִיתִי לְאָבִי
  choice: ich war meinem Vater ein Sohn
  rationale: Gibt die relationale ל-Konstruktion eng und im Deutschen noch verständlich wieder; »Sohn« bewahrt die ausdrücklich männliche Bezeichnung.
- source_word: רַךְ
  choice: noch zart
  rationale: Bezeichnet hier wahrscheinlich jugendliche Zartheit beziehungsweise Schutzbedürftigkeit; »noch« macht diesen zeitlichen Sinn natürlich verständlich, ohne ein bestimmtes Alter festzulegen.
- source_word: וְיָחִיד
  choice: und … der Einzige
  rationale: Bewahrt die Mehrdeutigkeit von יָחִיד zwischen »einzig«, »einziger Sohn« und möglicherweise »besonders geliebt«, ohne ausdrücklich »Einzelkind« zu behaupten.
- source_word: לִפְנֵי אִמִּי
  choice: vor meiner Mutter
  rationale: Erhält die hebräische Wendung לִפְנֵי und bezeichnet hier die Stellung in den Augen beziehungsweise in der Gegenwart der Mutter.
theological_decisions:
- issue: Bedeutung von יָחִיד
  choice: der Einzige
  alternative: ihr einziger Sohn; ihr einziges Kind; ihr besonders Geliebter
  rationale: Der hebräische Ausdruck legt Einzigkeit nahe, lässt aber offen, ob biologische Einzigkeit, besondere Stellung oder auch Geliebtheit im Vordergrund steht. Die Hauptfassung löst diese Spannung nicht vorschnell auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht gehobene Formulierung »meinem Vater ein Sohn« spiegelt bewusst die hebräische Relationskonstruktion; die Fußnote erläutert die genuine Mehrdeutigkeit von יָחִיד.
