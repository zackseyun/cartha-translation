  text: כִּ֤י לֶ֣קַח ט֭וֹב נָתַ֣תִּי לָ/כֶ֑ם תּֽ֝וֹרָתִ֗/י אַֽל תַּעֲזֹֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/002.yaml
  text: For I have given you good instruction[a]; do not forsake my teaching.
translation:
  language: de
  text: Denn ich habe euch gute Unterweisung gegeben; verlasst meine Lehre nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die Aufforderung im Zusammenhang ein und gibt die verbindende Kraft natürlich wieder.
- source_word: לֶקַח טוֹב
  choice: gute Unterweisung
  rationale: לֶקַח bezeichnet hier den vermittelten Lehrstoff bzw. die Unterweisung; טוֹב bewertet sie als gut. Die Formulierung passt zum Weisheitskontext und unterscheidet den Ausdruck von תּוֹרָתִי.
- source_word: נָתַתִּי לָכֶם
  choice: ich gebe euch
  rationale: Das hebräische Perfekt kann in einer gegenwärtigen Lehrrede eine vollzogene bzw. wirksam dargebotene Gabe bezeichnen. Das deutsche Präsens klingt bei einer fortlaufenden väterlichen Unterweisung natürlich und bewahrt ihre aktuelle Geltung.
- source_word: תּוֹרָתִי
  choice: meine Lehre
  rationale: תּוֹרָה bezeichnet in diesem väterlichen Weisheitskontext autoritative Lehre oder Weisung, ohne notwendig ein kodifiziertes Gesetz zu meinen.
- source_word: אַל תַּעֲזֹבוּ
  choice: verlasst … nicht
  rationale: Die verneinte Aufforderung verlangt bleibendes Festhalten. „Verlassen“ ist gegenwärtiges, verständliches Deutsch und trägt hier mehr Gewicht als ein bloß räumliches „weggehen“.
theological_decisions:
- issue: Wiedergabe von תּוֹרָתִי im Weisheitskontext
  choice: meine Lehre
  alternative: mein Gesetz / meine Weisung
  rationale: Der Vater spricht von seiner autoritativen Unterweisung. „Lehre“ wahrt diesen Sinn, ohne seine Worte vorschnell mit dem mosaischen Gesetz gleichzusetzen; die allgemeinere Bedeutung von Tora bleibt erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweite Person Plural des hebräischen Textes wird mit „euch/verlasst“ bewahrt. Keine Fußnote ist nötig, da „Lehre“ den kontextuellen Sinn von תּוֹרָה im Haupttext angemessen wiedergibt.
