source:
  edition: WLC
  text: בְּֽ֭/לֶכְתְּ/ךָ לֹא יֵצַ֣ר צַעֲדֶ֑/ךָ וְ/אִם תָּ֝ר֗וּץ לֹ֣א תִכָּשֵֽׁל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/012.yaml
  text: When you walk[a], your step will not be hindered; and if you run, you will not stumble.
translation:
  language: de
  text: Wenn du gehst, wird dein Schritt nicht eingeengt sein[a], und wenn du läufst, wirst du nicht stolpern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird dein Schritt nicht behindert werden“. Das hebräische Verb vermittelt die Vorstellung, eingeengt oder beschränkt zu sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתְּךָ
  choice: Wenn du gehst
  rationale: Der Infinitiv von הלך mit ב und dem Suffix der 2. Person maskulin Singular hat hier temporale Bedeutung. „Wenn du gehst“ gibt dies natürlich und nah am Hebräischen wieder.
- source_word: יֵצַר
  choice: wird … nicht eingeengt sein
  rationale: Das Verb bezeichnet ein Eng- oder Beschränktsein. Die Wiedergabe bewahrt das konkrete Bild eines Schrittes, dem kein enger Raum gesetzt wird, und lässt zugleich die übertragene Bedeutung von ungehindertem Vorankommen erkennen.
- source_word: צַעֲדֶךָ
  choice: dein Schritt
  rationale: Der hebräische Singular mit Suffix wird formal bewahrt. „Schritt“ trägt das Wegmotiv des Zusammenhangs.
- source_word: וְאִם
  choice: und wenn
  rationale: וְ verbindet die Satzteile, während אִם eine Bedingung ausdrückt. Im Deutschen kann „wenn“ diese konditionale Aussage natürlich wiedergeben.
- source_word: תָּרוּץ
  choice: du läufst
  rationale: רץ bedeutet gewöhnlich „laufen“; eine Abschwächung zu „eilen“ oder eine Steigerung zu „rennen“ ist kontextuell nicht erforderlich.
- source_word: תִכָּשֵׁל
  choice: wirst du nicht stolpern
  rationale: Das Nifal von כשל bezeichnet das Stolpern oder Straucheln. „Stolpern“ erhält sowohl das konkrete Wegbild als auch seine mögliche übertragene Bedeutung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Bewegungsbilder „gehen“, „laufen“ und „stolpern“ sowie der Singular „Schritt“ bleiben erhalten. Die etwas bildhafte Formulierung „nicht eingeengt“ folgt bewusst der konkreten hebräischen Metapher; die Fußnote bietet die idiomatischere Alternative.
