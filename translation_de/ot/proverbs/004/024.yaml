source:
  edition: WLC
  text: הָסֵ֣ר מִ֭מְּ/ךָ עִקְּשׁ֣וּת פֶּ֑ה וּ/לְז֥וּת שְׂ֝פָתַ֗יִם הַרְחֵ֥ק מִמֶּֽ/ךָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/024.yaml
  text: Put away crookedness of mouth from you[a], and put devious lips far from you.
translation:
  language: de
  text: Entferne von dir Verkehrtheit des Mundes[a], und halte verdrehte Lippen fern von dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen verkehrten Mund«. Beide hebräischen Substantive bezeichnen Rede, die moralisch verdreht oder entstellt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: Entferne
  rationale: Der kausative Imperativ fordert dazu auf, etwas bewusst zu beseitigen; »Entferne« gibt diese aktive Aufforderung knapp und natürlich wieder.
- source_word: מִמְּךָ
  choice: von dir
  rationale: Die Präposition mit dem Suffix der zweiten Person Singular bezeichnet die Trennung vom Angesprochenen und betont seine persönliche Verantwortung.
- source_word: עִקְּשׁוּת
  choice: jede Verkehrtheit
  rationale: Das abstrakte Substantiv bezeichnet moralische Verdrehtheit oder Verkehrtheit. Die Wiedergabe als Abstraktum bewahrt die Form des Hebräischen; »jede« ermöglicht im Deutschen eine natürliche Verbindung mit »des Mundes«.
- source_word: פֶּה
  choice: Mund
  rationale: Die wörtliche Körpermetapher bleibt erhalten und bildet den poetischen Parallelismus zu den »Lippen«.
- source_word: וּלְזוּת
  choice: verdrehte
  rationale: Das Substantiv bezeichnet Verzerrtheit oder Abwegigkeit, besonders im Reden. Die adjektivische Wiedergabe ist idiomatisches Deutsch und erhält das Bild moralisch verdrehter Rede.
- source_word: שְׂפָתַיִם
  choice: Lippen
  rationale: Die konkrete Körpermetapher und der Parallelismus zu »Mund« werden bewahrt.
- source_word: הַרְחֵק
  choice: halte … fern
  rationale: Der kausative Imperativ bedeutet, etwas auf Abstand zu bringen oder zu halten. »Halte … fern« ist im Deutschen natürlich und gibt die Verstärkung gegenüber dem ersten Imperativ wieder.
- source_word: מִמֶּךָ
  choice: von dir
  rationale: Die Form bezeichnet erneut die Trennung vom Angesprochenen; zusammen mit »fern« ergibt sich eine klare und idiomatische Formulierung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Körpermetaphern »Mund« und »Lippen« sowie der parallele Aufbau der beiden Vershälften bleiben erhalten; die abstrakte Form der ersten Aussage wird soweit möglich bewahrt.
