  text: פַּ֭לֵּס מַעְגַּ֣ל רַגְלֶ֑/ךָ וְֽ/כָל דְּרָכֶ֥י/ךָ יִכֹּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/026.yaml
  text: Level the path of your feet[a], and all your ways will be established.
translation:
  language: de
  text: Ebne die Bahn deiner Füße[a], und alle deine Wege werden fest sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wäge die Bahn deiner Füße ab“; das hebräische Verb kann auch das sorgfältige Abwägen oder Erwägen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּ֭לֵּס
  choice: Ebne
  rationale: Der Piel-Imperativ von פלס kann das Ebnen bzw. Herrichten eines Weges bezeichnen, daneben auch das Abwägen oder sorgfältige Prüfen. „Ebne“ bewahrt hier das konkrete Wegbild und lässt zugleich die übertragene Aufforderung zu umsichtigem Handeln erkennen.
- source_word: מַעְגַּ֣ל
  choice: Bahn
  rationale: מַעְגָּל bezeichnet eine Spur, Bahn oder einen Pfad und kann im Weisheitskontext für den Lebenslauf stehen. „Bahn“ passt natürlich zur Aufforderung „Ebne“ und vermeidet die unmittelbare Wiederholung von „Weg“.
- source_word: רַגְלֶ֑ךָ
  choice: für deine Füße
  rationale: Die Form ist morphologisch singularisch („dein Fuß“), wird im Deutschen innerhalb des Gehbildes jedoch idiomatisch und natürlich mit dem Plural „deine Füße“ wiedergegeben.
- source_word: וְֽכָל
  choice: und alle
  rationale: Die einfache Verbindung mit וְ wird ohne zusätzliche Folgerungsmarkierung wiedergegeben; ein stärker deutendes „dann“ wird nicht eingefügt.
- source_word: דְּרָכֶ֥יךָ
  choice: deine Wege
  rationale: דֶּרֶךְ bezeichnet sowohl konkrete Wege als auch die Lebensführung. „Wege“ erhält diese Doppelbedeutung und unterscheidet sich zugleich von „Bahn“ im ersten Satzteil.
- source_word: יִכֹּֽנוּ
  choice: werden fest gegründet sein
  rationale: Der Nifal von כון bezeichnet das Feststehen, Gefestigt- oder Beständigsein. „Fest gegründet sein“ bringt den resultativen Stabilitätsgedanken zum Ausdruck, ohne die mögliche Bedeutung als passivisches bzw. zuständliches Verb auf eine bestimmte Ursache festzulegen.
theological_decisions:
- issue: Verhältnis zwischen Aufforderung und Ergebnis
  choice: Die Satzverbindung bleibt mit „und“ offen.
  alternative: „Dann werden alle deine Wege feststehen“ als ausdrücklich konditionale oder folgernde Deutung.
  rationale: Das Hebräische verbindet beide Glieder mit וְ, ohne eine eigene Folgerungspartikel. Die Übersetzung sollte den Zusammenhang erkennen lassen, ihn aber nicht stärker kausal oder als automatische Verheißung formulieren als der Ausgangstext.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrtem Weg- und Lebensbild. „Ebne die Bahn“ ist anschaulich und verständlich; die Fußnote erhält die echte lexikalische Mehrdeutigkeit des Verbs.
