  text: הַחֲזֵ֣ק בַּ/מּוּסָ֣ר אַל תֶּ֑רֶף נִ֝צְּרֶ֗/הָ כִּי הִ֥יא חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/013.yaml
  text: Hold fast to instruction; do not let go. Guard her[a], for she is your life.
translation:
  language: de
  text: Halte an der Unterweisung[a] fest; lass sie nicht los. Bewahre sie, denn sie ist dein Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Unterweisung“ (hebräisch musar) kann auch „Erziehung“, „Zucht“ oder „Zurechtweisung“ bedeuten; gemeint ist eine Unterweisung, die den Menschen formt und korrigiert.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק בַּמּוּסָר
  choice: Halte an der Unterweisung fest
  rationale: Der Imperativ von חזק bezeichnet hier ein festes Ergreifen beziehungsweise beharrliches Festhalten. מוּסָר umfasst im Sprüchebuch belehrende und erzieherisch zurechtweisende Unterweisung; „Unterweisung“ bewahrt diese Spannweite besser als das engere „Lehre“.
- source_word: אַל תֶּרֶף
  choice: lass sie nicht los
  rationale: רפה bezeichnet in diesem Zusammenhang das Lockern oder Lösen des zuvor vorausgesetzten Griffs. Die deutsche Formulierung führt das Bild des Festhaltens natürlich weiter; das feminine Pronomen nimmt „Unterweisung“ auf.
- source_word: נִצְּרֶהָ
  choice: Bewahre sie
  rationale: נצר bedeutet schützen, hüten oder bewahren. „Bewahre“ gibt den aktiven Schutzgedanken wieder und passt idiomatisch zu der abstrakten, zugleich literarisch hervorgehobenen Unterweisung.
- source_word: כִּי הִיא חַיֶּיךָ
  choice: denn sie ist dein Leben
  rationale: Das feminine הִיא verweist auf מוּסָר; im Deutschen wird dieser Bezug durch „sie“ ebenfalls sichtbar. Das formal plurale חַיִּים bezeichnet idiomatisch das Leben in seiner Gesamtheit und wird daher singularisch wiedergegeben.
theological_decisions:
- issue: Unterweisung als Leben
  choice: Die Gleichsetzung „sie ist dein Leben“ bleibt uneingeschränkt stehen.
  alternative: „Sie erhält dein Leben“ oder „sie führt zum Leben“.
  rationale: Der hebräische Nominalsatz setzt die Unterweisung unmittelbar mit dem Leben des Angeredeten gleich. Eine kausale oder instrumentale Umschreibung würde die pointierte Aussage abschwächen und eine Deutung hinzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappen Imperativen. Die Wiederaufnahme durch „sie“ ist im Deutschen grammatisch natürlich und bewahrt zugleich die im Hebräischen angelegte Hervorhebung der Unterweisung. Das Semikolon bildet die enge Verbindung der ersten beiden Aufforderungen ab.
