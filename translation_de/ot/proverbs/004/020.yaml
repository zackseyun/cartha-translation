  text: בְּ֭נִ/י לִ/דְבָרַ֣/י הַקְשִׁ֑יבָ/ה לַ֝/אֲמָרַ֗/י הַט אָזְנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/020.yaml
  text: My son[a], pay attention to my words[b]; incline your ear to my sayings.
translation:
  language: de
  text: Mein Sohn, achte auf meine Worte; neige dein Ohr meinen Aussprüchen zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Bild „das Ohr zuneigen“ bedeutet: aufmerksam und sorgfältig zuhören.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die männliche Anrede im Singular entspricht der Vater-Sohn-Situation des unmittelbaren literarischen Zusammenhangs und wird nicht neutralisiert.
- source_word: לִדְבָרַי
  choice: auf meine Worte
  rationale: דברים bezeichnet hier die Worte beziehungsweise die Unterweisung des Sprechers; die Formulierung ist im modernen Deutsch natürlich.
- source_word: הַקְשִׁיבָה
  choice: achte
  rationale: Der Hifil-Imperativ von קשׁב fordert zu bewusstem, aufmerksamem Hören auf; „achte auf“ gibt diese aktive Aufmerksamkeit idiomatisch wieder.
- source_word: לַאֲמָרַי
  choice: meinen Aussprüchen
  rationale: „Aussprüche“ bewahrt gegenüber „Worte“ die lexikalische Variation des hebräischen Parallelismus und passt zum würdevollen Weisheitsstil.
- source_word: הַט
  choice: neige … zu
  rationale: Der Imperativ von נטה wird mit „Ohr“ metaphorisch gebraucht. Die Wiedergabe erhält das Bild des bewussten Hinwendens zum Hören.
- source_word: אָזְנֶךָ
  choice: dein Ohr
  rationale: Der hebräische Singular wird beibehalten; „dein Ohr neigen“ ist im Deutschen verständlich und bewahrt die Bildsprache.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus wird durch die Variation „Worte / Aussprüche“ und die Bildsprache des zugeneigten Ohres bewahrt.
