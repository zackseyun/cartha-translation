source:
  edition: WLC
  text: בְּ/אֹ֣רַח רְ֭שָׁעִים אַל תָּבֹ֑א וְ/אַל תְּ֝אַשֵּׁ֗ר בְּ/דֶ֣רֶךְ רָעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/014.yaml
  text: Do not enter the path of the wicked[a], and do not walk in the way of evil men.
translation:
  language: de
  text: Betritt nicht den Pfad der Frevler und schreite nicht auf dem Weg böser Männer voran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geh nicht weiter“ beziehungsweise „geh nicht geradeaus“. Das hebräische Verb kann ein Weitergehen, Voranschreiten oder Geradeausgehen bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: אֹרַח
  choice: Pfad
  rationale: „Pfad“ bewahrt das konkrete Wegbild und unterscheidet אֹרַח zugleich vom דֶּרֶךְ des zweiten Halbverses.
- source_word: רְשָׁעִים
  choice: Frevler
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die schuldig und gottlos handeln. „Frevler“ ist im weisheitlichen Zusammenhang prägnant und würdevoll.
- source_word: אַל תָּבֹא
  choice: Betritt nicht
  rationale: בוא bezeichnet hier mit dem Pfadbild das Eintreten in eine Lebensweise. „Betritt nicht“ gibt dieses Bild im Deutschen unmittelbar wieder.
- source_word: תְּאַשֵּׁר
  choice: geh … nicht weiter
  rationale: Die Piel-Form kann das Weitergehen, Voranschreiten oder Geradeausgehen bezeichnen. „Geh … nicht weiter“ ist natürliches Deutsch und erhält die Bewegungsvorstellung.
- source_word: דֶּרֶךְ
  choice: Weg
  rationale: דֶּרֶךְ bezeichnet konkret einen Weg und bildlich eine Lebensführung. „Weg“ ist hier die naheliegende deutsche Entsprechung.
- source_word: רָעִים
  choice: böser Männer
  rationale: Das maskuline substantivierte Pluraladjektiv bezeichnet böse Menschen. „Böser Männer“ bildet die maskuline Form ab, ohne dem Ausdruck eine engere Gruppe hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des maskulinen Plurals רָעִים
  choice: böser Männer
  alternative: böser Menschen; der Bösen; der Übeltäter
  rationale: Die Übersetzung bewahrt die grammatisch maskuline Personenbezeichnung des Hebräischen. Der Spruch kann dabei als allgemeine Lebensunterweisung verstanden werden; die Formulierung legt nicht fest, dass nur Männer moralisch gemeint wären.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Die parallelen Wegbilder werden durch „Pfad“ und „Weg“ erhalten; die Wortstellung des zweiten Halbverses ist zugunsten natürlichen Deutschen angepasst.
