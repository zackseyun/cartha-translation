source:
  edition: WLC
  text: רֵאשִׁ֣ית חָ֭כְמָה קְנֵ֣ה חָכְמָ֑ה וּ/בְ/כָל קִ֝נְיָנְ/ךָ֗ קְנֵ֣ה בִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/007.yaml
  text: 'The beginning of wisdom is this: acquire wisdom[a], and with all you acquire[b], acquire understanding.'
translation:
  language: de
  text: 'Der Anfang der Weisheit ist: Erwirb Weisheit[a], und mit allem, was du erwirbst[b], erwirb Einsicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weisheit steht an erster Stelle; darum erwirb Weisheit.“ Das hebräische Wort für „Anfang“ kann hier auch das Vorrangige oder Wichtigste bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: „mit deinem ganzen Erwerb“; auch möglich: „mit deinem ganzen Besitz“. Im Hebräischen besteht ein Wortspiel zwischen „erwirb“ und „Erwerb“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: der Anfang
  rationale: רֵאשִׁית bezeichnet gewöhnlich Anfang, Erstes oder Vorrangiges. „Der Anfang“ bewahrt die knappe hebräische Formulierung und lässt den folgenden Imperativ erklären, worin dieser Anfang besteht.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und sachgerechte Wiedergabe in den Sprüchen; gemeint ist praktische, sittliche und lebensgestaltende Weisheit, nicht bloße Intelligenz. Die Wiederholung bleibt zur Betonung erhalten.
- source_word: קְנֵה
  choice: erwirb
  rationale: Der Imperativ kann „kaufen“, „erwerben“ oder „sich verschaffen“ bedeuten. „Erwirb“ drückt zielgerichtetes Erlangen aus und bewahrt zugleich das Wortspiel mit קִנְיָן.
- source_word: וּבְכָל קִנְיָנְךָ
  choice: und mit allem, was du erwirbst
  rationale: Die Formulierung wahrt die mögliche Bedeutung von קִנְיָן als Erwerb oder Besitz, ohne sie auf Geld einzuengen, und gibt den Gleichklang mit קְנֵה im Deutschen möglichst wieder.
- source_word: בִינָה
  choice: Einsicht
  rationale: בִינָה bezeichnet in der Weisheitsliteratur verstehende Unterscheidungsfähigkeit. „Einsicht“ klingt im Deutschen natürlicher als die abstraktere Alternative „Verständnis“ und erfasst den praktischen Sinn.
theological_decisions:
- issue: Mehrdeutigkeit von רֵאשִׁית
  choice: '„Der Anfang der Weisheit ist: Erwirb Weisheit“'
  alternative: „Weisheit steht an erster Stelle; darum erwirb Weisheit“
  rationale: Der Haupttext erhält die Grundbedeutung „Anfang“ und die zugespitzte Spannung der Aussage. Die ebenfalls mögliche Bedeutung „das Vorrangige“ wird in der Fußnote ausdrücklich bewahrt, ohne die Mehrdeutigkeit dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper spruchhafter Syntax. „Erwirb“ bewahrt den gehobenen, aber allgemein verständlichen Ton und ermöglicht die teilweise Wiedergabe des hebräischen Wortspiels; „Einsicht“ ist im Kontext der Weisheitsliteratur idiomatisch.
