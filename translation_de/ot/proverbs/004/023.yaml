source:
  edition: WLC
  text: מִֽ/כָּל מִ֭שְׁמָר נְצֹ֣ר לִבֶּ֑/ךָ כִּֽי מִ֝מֶּ֗/נּוּ תּוֹצְא֥וֹת חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/023.yaml
  text: Guard your heart more than all guarding[b][a], for from it are the springs of life.
translation:
  language: de
  text: Mehr als alles, was du bewachst, behüte dein Herz,[a] denn aus ihm strömt das Leben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Mehr als alles Bewachen behüte dein Herz“; gemeint ist höchste Wachsamkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn von ihm gehen die Quellen (oder: Ausgänge) des Lebens aus.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל מִשְׁמָר
  choice: Mehr als alles, was du bewachst
  rationale: Die Verbindung hat vergleichende beziehungsweise steigernde Kraft und bezeichnet alles, worauf man sonst sorgsam achtet. Die Formulierung bewahrt zudem das Wortfeld des Bewachens, ohne im Deutschen unnatürlich zu klingen.
- source_word: נְצֹר
  choice: behüte
  rationale: Der Imperativ fordert zu aktivem, sorgfältigem Schutz auf. „Behüte“ ist im Deutschen würdig und idiomatisch und passt besonders gut zum Herzen.
- source_word: לִבֶּךָ
  choice: dein Herz
  rationale: „Herz“ bezeichnet im hebräischen Denken die Mitte des inneren Lebens, einschließlich Denken, Wollen und Empfinden; es wird deshalb nicht auf „Gefühle“ verengt.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für die vorangehende Aufforderung ein.
- source_word: מִמֶּנּוּ
  choice: aus ihm
  rationale: Das Suffix bezieht sich auf das Herz. „Aus ihm“ gibt die Herkunftsbeziehung im Deutschen natürlich wieder.
- source_word: תּוֹצְאוֹת חַיִּים
  choice: strömt das Leben
  rationale: תּוֹצְאוֹת kann Ausgänge, Hervorgänge oder Quellen bezeichnen. Die verbale Wiedergabe drückt verständlich aus, dass das Leben aus dem Herzen hervorgeht, und erhält das Bild einer ausströmenden Quelle, ohne das schwerfällige „Ausgänge des Lebens“ zu verwenden.
theological_decisions:
- issue: Anthropologische Bedeutung von „Herz“
  choice: „Herz“ als umfassende Mitte des inneren Lebens beibehalten
  alternative: „Verstand“, „Gefühle“ oder „Inneres“
  rationale: Der hebräische Begriff umfasst Denken, Wollen und Empfinden. Die wörtliche Wiedergabe erhält diese Weite und vermeidet eine konfessionelle oder psychologische Verengung.
- issue: Bildgehalt von תּוֹצְאוֹת חַיִּים
  choice: Als aus dem Herzen strömendes Leben wiedergeben
  alternative: „Ausgänge des Lebens“, „Quellen des Lebens“ oder „Folgen für das Leben“
  rationale: Der Ausdruck lässt mehrere verwandte Vorstellungen zu. Der Haupttext vermittelt das Herkunfts- und Strömungsbild; die Fußnote hält die lexikalische Spannweite offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Weisheitston. Die Wiederaufnahme des Wortfelds „bewachen/behüten“ spiegelt die hebräische Wortwirkung, während die zweite Vershälfte idiomatisch formuliert ist. Alle Fußnotenmarker stehen im Haupttext.
