  text: Prize her highly[a], and she will exalt you[b]; she will honor you when you embrace her.
translation:
  language: de
  text: Halte sie hoch[a], und sie wird dich erhöhen; sie wird dich ehren, wenn du sie umarmst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schätze sie hoch“, „pflege sie“ oder „erhebe sie“. Das seltene Verb kann ausdrücken, dass man die Weisheit wertschätzt, hegt oder erhebt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil du sie umarmst“. Das hebräische כִּי kann hier kausal („weil“) oder im Zusammenhang temporal bzw. konditional („wenn“) verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַלְסְלֶהָ
  choice: Halte sie hoch
  rationale: Das seltene Verb סלסל kann hier das Hochschätzen, Pflegen oder Erheben der personifizierten Weisheit ausdrücken. „Halte sie hoch“ bewahrt diese Bedeutungsweite und vermeidet die unmittelbare Wiederholung von „erhöhen“.
- source_word: וּתְרוֹמְמֶךָ
  choice: dann wird sie dich erhöhen
  rationale: רומם bezeichnet das Erheben beziehungsweise die Verleihung eines höheren Ranges. Das feminine Subjekt ist die personifizierte Weisheit; „erhöhen“ erhält den würdevollen, bildhaften Sinn.
- source_word: תְכַבֵּדְךָ
  choice: sie wird dich ehren
  rationale: Das Piel von כבד bedeutet hier, jemandem Ehre zu verleihen. „Ehren“ ist im modernen Deutschen natürlich und überzeichnet die Aussage nicht.
- source_word: כִּי
  choice: weil
  rationale: כִּי hat seinen gewöhnlichen kausalen Sinn „weil/denn“. Anders als eine rein temporale Wiedergabe bewahrt „weil“ die im Hebräischen naheliegende Begründung; die mögliche temporale Auffassung wird in der Fußnote genannt.
- source_word: תְחַבְּקֶנָּה
  choice: du sie umarmst
  rationale: חבק bedeutet „umarmen“. Die Form führt das feminine Bild der Weisheit fort und bezeichnet eine enge, persönliche Bindung an sie.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die weiblichen Pronomen bewahren die Personifikation der Weisheit aus dem Zusammenhang. Die parallelen Verben „hochhalten/erhöhen“ und „ehren/umarmen“ bleiben knapp und poetisch.
