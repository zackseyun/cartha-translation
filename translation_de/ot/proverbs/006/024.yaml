base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/024.yaml
  text: to keep you from the evil woman[b][a], from the smooth tongue of the foreign woman.
translation:
  language: de
  text: um dich vor der bösen Frau zu bewahren, vor der schmeichelnden Zunge[a] der fremden Frau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der glatten Zunge“; wörtlich: „der Glätte der Zunge“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Ausländerin“; manche verstehen dies hier genauer als „der Ehebrecherin“.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: um dich … zu bewahren
  rationale: Der Infinitiv mit לְ bezeichnet hier den Zweck beziehungsweise die Folge des vorangehenden Gedankens. „Bewahren“ gibt den schützenden Sinn natürlich und würdig wieder.
- source_word: מֵאֵשֶׁת רָע
  choice: vor der bösen Frau
  rationale: אֵשֶׁת kann „Frau“ oder „Ehefrau“ bedeuten; im Zusammenhang ist „Frau“ weniger einengend. רָע bezeichnet hier moralische Bosheit.
- source_word: מֵחֶלְקַת לָשׁוֹן
  choice: vor der glatten Zunge
  rationale: חֶלְקַת vermittelt das Bild von Glätte und bezeichnet zusammen mit „Zunge“ einschmeichelnde oder verführerische Rede. Die bildhafte Formulierung bleibt im Haupttext erhalten.
- source_word: נָכְרִיָּה
  choice: der fremden Frau
  rationale: Das Wort bezeichnet grundsätzlich eine fremde beziehungsweise nicht zugehörige Frau. „Fremd“ bewahrt diese lexikalische Weite, ohne die Bedeutung vorschnell auf „Ehebrecherin“ zu verengen.
theological_decisions:
- issue: Deutung von נָכְרִיָּה in der Weisheitsliteratur
  choice: Im Haupttext als „fremde Frau“ wiedergeben
  alternative: „Ehebrecherin“ oder „eine andere Frau“
  rationale: Der Kontext kann eine sexuell verführerische und möglicherweise ehebrecherische Frau meinen, doch das hebräische Wort selbst ist weiter. Die Übersetzung bewahrt diese Spannung; die engere Deutung wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Der parallele Satzbau und das hebräische Bild der „glatten Zunge“ bleiben erhalten.
