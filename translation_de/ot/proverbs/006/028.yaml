translation:
  language: de
  text: Kann ein Mann auf glühenden Kohlen gehen, ohne dass seine Füße verbrennen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn ein Mann auf glühenden Kohlen geht, werden dann seine Füße nicht verbrennen?“ Das Hebräische beginnt mit אִם („wenn“); hier leitet das Wort, parallel zum vorherigen Vers, eine rhetorische Frage ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kann
  rationale: אִם bedeutet gewöhnlich „wenn“, leitet hier aber im Zusammenhang mit Sprüche 6,27 eine rhetorische Frage ein. „Kann“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: יְהַלֵּךְ
  choice: gehen
  rationale: Die Form von הלך bezeichnet hier das Gehen beziehungsweise Sich-Fortbewegen; „gehen“ passt natürlich zum Bild.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das hebräische Substantiv ist maskulin Singular und bezeichnet in diesem Weisheitsspruch einen exemplarischen Mann; die konkrete Form bleibt erhalten.
- source_word: עַל הַגֶּחָלִים
  choice: über glühende Kohlen
  rationale: עַל bezeichnet hier die Bewegung auf der Oberfläche der Kohlen. גֶּחָלִים sind glühende Kohlen oder Glutstücke; „glühende Kohlen“ macht das im Hebräischen vorausgesetzte Bild klar.
- source_word: וְרַגְלָיו
  choice: seine Füße
  rationale: Der hebräische Ausdruck steht im Plural mit einem Suffix der dritten Person maskulin Singular.
- source_word: לֹא תִכָּוֶינָה
  choice: ohne dass … verbrennen
  rationale: כוה im Nifal bedeutet „verbrannt/versengt werden“. In Verbindung mit der rhetorischen Frage gibt „ohne dass seine Füße verbrennen“ die hebräische Verneinung idiomatisch wieder.
