translation:
  language: de
  text: Du bist durch die Worte deines Mundes in die Falle geraten[a]; du bist durch die Worte deines Mundes gefangen worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du bist durch die Worte deines Mundes verstrickt.“ Die hebräischen Perfektformen können einen eingetretenen Zustand mit fortdauernder Wirkung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹקַשְׁתָּ
  choice: bist du … in die Falle geraten
  rationale: Das Nifal von יקש bezeichnet das Geraten in eine Falle. Die Wendung bewahrt das konkrete Fallenbild und klingt zugleich natürlich im modernen Deutschen.
- source_word: בְאִמְרֵי
  choice: durch die Worte
  rationale: Die Präposition ב bezeichnet hier das Mittel oder die Ursache; „durch“ gibt diesen instrumentalen Sinn klar wieder. אִמְרֵי wird im sprichwörtlichen Zusammenhang angemessen mit „Worte“ übersetzt.
- source_word: פִיךָ
  choice: deines Mundes
  rationale: Die konkrete hebräische Redeweise bleibt erhalten und wahrt zudem die wörtliche Wiederholung im Parallelismus.
- source_word: נִלְכַּדְתָּ
  choice: bist du … gefangen worden
  rationale: Das Nifal von לכד bedeutet, gefangen oder ergriffen zu werden. „Gefangen worden“ bildet mit dem vorausgehenden Fallenbild einen natürlichen, verstärkenden Parallelismus.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die zweimalige Formulierung „durch die Worte deines Mundes“ wurde beibehalten, um den markanten synonymen Parallelismus des Hebräischen wiederzugeben.
