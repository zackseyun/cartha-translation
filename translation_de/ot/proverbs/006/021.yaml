  yaml_path: translation/ot/proverbs/006/021.yaml
  text: Bind them on your heart continually[b][a]; tie them around your neck.
translation:
  language: de
  text: Binde sie dir stets aufs Herz und lege sie dir um den Hals.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָשְׁרֵם
  choice: Binde sie
  rationale: Der Qal-Imperativ mit Objektsuffix bezeichnet ein konkretes Festbinden und bewahrt so das körperhafte Bild.
- source_word: עַל לִבְּךָ
  choice: dir … aufs Herz
  rationale: „Herz“ bewahrt die hebräische Vorstellung vom inneren Menschen einschließlich Denken und Wollen; die deutsche Wendung klingt natürlich und bildhaft.
- source_word: תָמִיד
  choice: für immer
  rationale: Das Adverb bezeichnet hier bleibende, ununterbrochene Geltung. „Für immer“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: עָנְדֵם
  choice: trage sie
  rationale: Das Verb kann das Anlegen beziehungsweise Tragen eines Schmuckstücks bezeichnen. „Trage“ unterscheidet den zweiten Imperativ vom ersten und lässt das Hals-Schmuck-Bild natürlich erkennen.
- source_word: עַל גַּרְגְּרֹתֶךָ
  choice: um deinen Hals
  rationale: Das seltene Wort bezeichnet den Hals- beziehungsweise Kehlbereich; bei etwas Angelegtem ist „um deinen Hals“ die idiomatische deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Körperbilder bleiben erhalten; der zweite Halbvers wird idiomatisch als Bild eines am Hals getragenen Schmuckstücks wiedergegeben.
