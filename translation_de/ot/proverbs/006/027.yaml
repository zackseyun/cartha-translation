  text: Can a man carry fire in his bosom and his clothes not be burned?[a]
translation:
  language: de
  text: Kann ein Mann Feuer in seinem Gewandbausch[a] tragen, ohne dass seine Kleider verbrennen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an seiner Brust« beziehungsweise »in seinem Schoß«. Das hebräische Wort bezeichnet den Brust- oder Schoßbereich, einschließlich des Gewandbauschs, in dem man etwas dicht am Körper tragen konnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְתֶּה
  choice: tragen
  rationale: Das Verb חתה bezeichnet das Aufnehmen beziehungsweise Zusammenscharren, hier von Feuer. Im Zusammenhang zielt das Bild darauf, Feuer aufzunehmen und dicht am Körper zu halten; »tragen« gibt dies in natürlichem Deutsch wieder.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das hebräische Substantiv ist maskulin Singular und bezeichnet im Kontext des Weisheitsspruchs einen Mann; die Formulierung bewahrt zugleich den Bezug zum unmittelbar vorausgehenden Kontext.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Direkte und natürliche deutsche Entsprechung.
- source_word: בְּחֵיקוֹ
  choice: in seinem Gewandbausch
  rationale: חֵיק bezeichnet den Brust- oder Schoßbereich, besonders den durch das Gewand gebildeten Bausch, in dem etwas körpernah gehalten werden konnte. »Gewandbausch« macht das konkrete Bild verständlich, ohne es auf Brust oder Schoß einzuengen.
- source_word: וּבְגָדָיו
  choice: seine Kleider
  rationale: »Kleider« ist eine natürliche moderne Entsprechung für בְּגָדִים und passt zum Bild des brennenden Gewandes.
- source_word: לֹא תִשָּׂרַפְנָה
  choice: ohne dass seine Kleider verbrennen
  rationale: Die rhetorische Frage erwartet eine verneinende Antwort. Die deutsche Konstruktion mit »ohne dass« gibt die hebräische Verbindung mit וְלֹא idiomatisch wieder; »verbrennen« bewahrt die starke Aussage von שׂרף.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Frage und das konkrete Gefahrenbild bleiben erhalten; »Gewandbausch« ist leicht erklärungsbedürftig, bildet die antike Trageweise jedoch genauer ab als das heute missverständliche »Busen«.
