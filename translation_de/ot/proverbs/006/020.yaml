  text: נְצֹ֣ר בְּ֭נִ/י מִצְוַ֣ת אָבִ֑י/ךָ וְ/אַל תִּ֝טֹּ֗שׁ תּוֹרַ֥ת אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/020.yaml
  text: Keep[a], my son, your father's commandment, and do not forsake your mother's instruction.
translation:
  language: de
  text: Bewahre, mein Sohn, das Gebot deines Vaters, und gib die Weisung deiner Mutter nicht auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצֹר
  choice: Bewahre
  rationale: Der Imperativ von נצר bezeichnet sorgfältiges Hüten und Festhalten. „Bewahre“ erhält diesen schützenden Bedeutungsanteil und passt natürlich zu einer elterlichen Weisung.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die ausdrücklich maskuline Singularform mit Suffix der ersten Person wird genau wiedergegeben und wahrt die persönliche Anrede des Weisheitslehrers.
- source_word: מִצְוַת
  choice: das Gebot
  rationale: מִצְוָה bezeichnet ein Gebot beziehungsweise einen verbindlichen Auftrag. „Gebot“ bewahrt dessen Gewicht und bildet einen passenden Parallelismus zu „Weisung“.
- source_word: אָבִיךָ
  choice: deines Vaters
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen natürlich durch den Genitiv wiedergegeben.
- source_word: תִּטֹּשׁ
  choice: verwirf nicht
  rationale: נטש bedeutet verlassen, aufgeben oder preisgeben. Im Zusammenhang mit einer Lehre bringt „verwirf nicht“ die bewusste Abkehr idiomatisch und mit angemessenem Ernst zum Ausdruck.
- source_word: תּוֹרַת
  choice: die Weisung
  rationale: תּוֹרָה meint hier im Rahmen elterlicher Weisheitsunterweisung keine kodifizierte Gesetzessammlung, sondern richtungsgebende Lehre. „Weisung“ wahrt zugleich die Verbindlichkeit und den pädagogischen Zusammenhang.
- source_word: אִמֶּךָ
  choice: deiner Mutter
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen idiomatisch durch den Genitiv wiedergegeben und erhält den Parallelismus zu „deines Vaters“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau sowie die gleichrangige Nennung der väterlichen und mütterlichen Autorität bleiben erhalten. „Bewahre“ und „verwirf nicht“ geben den positiven und negativen Imperativ prägnant wieder.
