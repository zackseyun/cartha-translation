  register: Moderne, würdige Standardsprache. Die rechtliche Bedeutung der Bürgschaft wird ausdrücklich benannt, während das konkrete Bild des Handschlags erhalten bleibt. Das abschließende Komma trägt dem Satzfortgang in Sprüche 6,2 Rechnung.
