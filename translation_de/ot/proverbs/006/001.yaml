base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/001.yaml
  text: My son[a], if you have gone surety for your neighbor, if you have struck your hands in pledge to a stranger[b],
translation:
  language: de
  text: Mein Sohn, wenn du für deinen Nächsten Bürge geworden bist[a] und für einen Fremden die Hand eingeschlagen hast[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für deinen Freund“ beziehungsweise „für deinen Gefährten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „deine Hände für einen Fremden eingeschlagen hast“; die Wendung bezeichnet die Bekräftigung einer übernommenen Verpflichtung durch Handschlag.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die direkte Anrede eines Vaters oder Weisheitslehrers an einen männlichen Sohn wird natürlich und formgetreu wiedergegeben.
- source_word: אִם
  choice: wenn
  rationale: Leitet hier einen angenommenen Bedingungsfall ein; im fortlaufenden deutschen Satz klingt „wenn“ natürlicher als „falls“.
- source_word: עָרַבְתָּ
  choice: Bürge geworden bist
  rationale: Das Verb bezeichnet das Eintreten als Bürge für die Schuld oder Verpflichtung eines anderen und bewahrt damit den rechtlich-finanziellen Sinn.
- source_word: לְרֵעֶךָ
  choice: für deinen Nächsten
  rationale: רֵעַ kann einen Freund, Gefährten oder Mitmenschen bezeichnen. „Nächster“ wahrt diese relationale Breite, ohne zwingend enge Freundschaft vorauszusetzen.
- source_word: תָּקַעְתָּ ... כַּפֶּיךָ
  choice: den Handschlag gegeben hast
  rationale: Die wörtliche Wendung vom Schlagen der Hand bezeichnet einen Handschlag, mit dem eine Bürgschaft oder Verpflichtung bekräftigt wurde.
- source_word: לַזָּר
  choice: einem Fremden
  rationale: זָר bezeichnet einen Fremden oder Außenstehenden; der Dativ gibt die hebräische Präposition im deutschen Zusammenhang natürlich wieder.
theological_decisions: []
