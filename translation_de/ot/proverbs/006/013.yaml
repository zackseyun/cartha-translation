  text: winking with his eyes[a], signaling with his feet[b], pointing with his fingers.
translation:
  language: de
  text: Er zwinkert mit den Augen, gibt mit dem Fuß Zeichen[a] und deutet mit den Fingern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „scharrt mit dem Fuß“; das seltene hebräische Verb bezeichnet hier wohl ein heimliches Zeichen, doch die genaue Bewegung ist ungewiss.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weist mit den Fingern an“. Das hebräische Verb kann auch „anweisen“ oder „lehren“ bedeuten; hier legt die Reihe von Körpergesten ein Deuten nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵץ בְּעֵינָיו
  choice: zwinkert mit den Augen
  rationale: Das Partizip bezeichnet hier am ehesten eine verstohlene Geste der Augen. „Zwinkert“ ist im Deutschen natürlich und passt zu den heimlichen Körpersignalen im Kontext.
- source_word: מֹלֵל בְּרַגְלוֹ
  choice: gibt mit dem Fuß Zeichen
  rationale: מֹלֵל ist selten und die genaue Bewegung unsicher. Im Parallelismus bezeichnet es offenbar ein körperliches Signal; die Wiedergabe wahrt diese Funktion, ohne die Bewegung genauer festzulegen. Der Singular „Fuß“ entspricht der hebräischen Form.
- source_word: מֹרֶה בְּאֶצְבְּעֹתָיו
  choice: deutet mit den Fingern
  rationale: מֹרֶה kann „weisen“, „anweisen“ oder „lehren“ bedeuten. Zusammen mit „Fingern“ und den übrigen Gesten ist „deutet“ die natürliche körperliche Bedeutung und lässt offen, ob auf etwas gezeigt oder ein Zeichen gegeben wird.
