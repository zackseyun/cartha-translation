  text: it prepares its food in summer[b][a]; it gathers its provisions at harvest.
translation:
  language: de
  text: 'Sie bereitet im Sommer ihre Nahrung[a] vor;

    bei der Ernte sammelt sie ihre Nahrung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihr Brot“; gemeint ist hier wohl ihre Nahrung im weiteren Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין
  choice: bereitet … vor
  rationale: Der Hifil von כון bezeichnet hier das Bereitmachen. „Bereitet … vor“ ist im Zusammenhang mit der Vorsorge der Ameise natürlich und nah am Hebräischen.
- source_word: בַּקַּיִץ
  choice: im Sommer
  rationale: Die Präposition בְּ bezeichnet hier den Zeitraum der Handlung; „im Sommer“ ist die knappe, idiomatische Wiedergabe.
- source_word: לַחְמָהּ
  choice: ihre Nahrung
  rationale: לֶחֶם bedeutet häufig „Brot“, kann aber umfassender Nahrung beziehungsweise Lebensunterhalt bezeichnen. Bei einer Ameise gibt „Nahrung“ den gemeinten Sinn natürlich wieder; die wörtlichere Bedeutung wird in einer Fußnote bewahrt.
- source_word: אָגְרָה
  choice: sammelt
  rationale: אגר bezeichnet das Sammeln, besonders mit Blick auf einen Vorrat. „Sammelt“ erhält die konkrete Tätigkeit, ohne den Aspekt des Einlagerns stärker auszudrücken, als es der Vers verlangt.
- source_word: בַקָּצִיר
  choice: zur Erntezeit
  rationale: קָצִיר bezeichnet die Ernte beziehungsweise Erntezeit. „Zur Erntezeit“ macht den zeitlichen Bezug im Deutschen klar.
- source_word: מַאֲכָלָהּ
  choice: ihren Vorrat
  rationale: מַאֲכָל bezeichnet etwas Essbares oder Nahrung. Im Zusammenhang mit אָגְרָה bringt „Vorrat“ den Zweck des Gesammelten natürlich zum Ausdruck und wahrt zugleich die lexikalische Abwechslung zwischen den beiden Halbversen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Spruchstil. Das feminine Pronomen „sie“ nimmt die Ameise aus Vers 6 auf; der Parallelismus der beiden Halbverse bleibt erhalten.
