  - severity: low
    issue: „Vorrat“ interpretiert מַאֲכָלָהּ stärker als „Nahrung“.
    rationale: Das Substantiv bezeichnet Nahrung bzw. Essbares. Der Vorratsaspekt ergibt sich aus dem Sammeln und muss nicht im Objekt selbst ergänzt werden.
