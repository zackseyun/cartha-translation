source:
  edition: WLC
  text: שֶׁשׁ הֵ֭נָּה שָׂנֵ֣א יְהוָ֑ה וְ֝/שֶׁ֗בַע תועבות נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/016.yaml
  text: 'There are six things that Yahweh hates[a], seven that are an abomination to him:'
translation:
  language: de
  text: Sechs Dinge hasst Jahwe, sieben sind ihm ein Gräuel:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und sieben: Gräuel seiner Seele“, das heißt: sieben Dinge, die ihm zutiefst zuwider sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁשׁ הֵנָּה
  choice: Sechs Dinge
  rationale: Die hebräische Wendung eröffnet einen Zahlenspruch. „Dinge“ ist im Deutschen aus den nachfolgend aufgezählten Gegenständen zu ergänzen und ergibt eine natürliche, knappe Formulierung.
- source_word: שָׂנֵא
  choice: hasst
  rationale: Das Verb bezeichnet Hass beziehungsweise starke Abneigung; „hasst“ bewahrt seine unmittelbare Stärke.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְשֶׁבַע
  choice: sieben
  rationale: Dies ist das zweite Glied der für hebräische Zahlensprüche typischen Steigerungsformel x / x+1. Die knappe Wiedergabe erhält die poetische Spannung.
- source_word: תועבות
  choice: ein Gräuel
  rationale: Das Substantiv bezeichnet etwas entschieden Abscheuliches. Die deutsche Verbindung „jemandem ein Gräuel sein“ gibt die Aussage idiomatisch und mit angemessener Stärke wieder.
- source_word: נַפְשׁוֹ
  choice: ihm
  rationale: Wörtlich steht „seiner Seele“; נֶפֶשׁ bezeichnet hier idiomatisch die Person selbst. „Ihm“ ist im modernen Deutsch natürlich, während die wörtliche Form in der Fußnote dokumentiert wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Unterschied zwischen Eigenname und Titel.
- issue: Anthropomorphe Wendung „Gräuel seiner Seele“
  choice: sieben sind ihm ein Gräuel
  alternative: sieben sind seiner Seele ein Gräuel
  rationale: „Seele“ dient im Hebräischen hier als Bezeichnung der Person selbst. Die Haupttextfassung vermittelt den Sinn natürlich, ohne eine besondere Leib-Seele-Lehre in die Wendung hineinzulesen; die wörtliche Struktur bleibt in der Fußnote sichtbar.
translation_notes:
  register: Knapper, würdevoller moderner Standardstil. Die Form des hebräischen Zahlenspruchs „sechs … sieben“ sowie die starke Wertung „hasst / Gräuel“ bleiben erhalten.
