  yaml_path: translation/ot/proverbs/006/007.yaml
  text: which has no chief[a], officer, or ruler,
translation:
  language: de
  text: die weder Anführer[a] noch Aufseher noch Herrscher hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Befehlshaber«; die drei Begriffe können auch mit »Leiter, Amtsträger oder Herrscher« wiedergegeben werden.'
    reason: Die Bezeichnungen für die verschiedenen Autoritätsrollen überschneiden sich teilweise in ihrer Bedeutung, bleiben im Hebräischen aber voneinander unterschieden.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen bezieht sich auf die Ameise im vorhergehenden Vers und übernimmt deren grammatisches Geschlecht.
- source_word: אֵין לָהּ
  choice: weder … noch … noch … hat
  rationale: Die hebräische Existenzkonstruktion mit ל und femininem Suffix wird im Deutschen natürlich als Besitz ausgedrückt; die dreigliedrige Verneinung macht deutlich, dass keine der genannten Autoritäten vorhanden ist.
- source_word: קָצִין
  choice: Anführer
  rationale: קָצִין bezeichnet eine leitende Person. »Anführer« ist allgemein verständlich und bleibt von מֹשֵׁל unterschieden.
- source_word: שֹׁטֵר
  choice: Aufseher
  rationale: שֹׁטֵר bezeichnet einen Amtsträger mit ordnender oder beaufsichtigender Funktion. »Aufseher« passt zum Arbeitskontext der Ameise und unterscheidet sich von »Anführer« und »Herrscher«.
- source_word: וּמֹשֵׁל
  choice: noch Herrscher
  rationale: מֹשֵׁל bezeichnet jemanden, der herrscht oder regiert. Im Deutschen wird das verbindende ו innerhalb der verneinten Aufzählung idiomatisch mit »noch« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Relativform wahrt den Bezug zur Ameise aus Vers 6. Die dreifache Konstruktion »weder … noch … noch« bildet die verneinte Reihe natürlich ab; das abschließende Komma berücksichtigt, dass der Satz in Vers 8 weitergeführt wird.
