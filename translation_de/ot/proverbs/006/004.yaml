  text: אַל תִּתֵּ֣ן שֵׁנָ֣ה לְ/עֵינֶ֑י/ךָ וּ֝/תְנוּמָ֗ה לְ/עַפְעַפֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/004.yaml
  text: Do not give sleep to your eyes[a], nor slumber to your eyelids.
translation:
  language: de
  text: Gönne deinen Augen keinen Schlaf und deinen Lidern keinen Schlummer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und deinen Lidern kein Eindösen“. Das hebräische Wort bezeichnet leichten Schlaf oder das Einnicken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: Gönne … keinen
  rationale: אַל mit Imperfekt formuliert ein Verbot; נתן bedeutet wörtlich „geben“. Die deutsche Wendung „jemandem etwas gönnen“ bewahrt das Bild des Gewährens und klingt in dieser Mahnung natürlich.
- source_word: שֵׁנָה
  choice: Schlaf
  rationale: Die gewöhnliche konkrete Bedeutung ist „Schlaf“; der Kontext verlangt keine übertragene Wiedergabe.
- source_word: לְעֵינֶיךָ
  choice: deinen Augen
  rationale: ל kennzeichnet hier den Empfänger dessen, was gewährt wird. Der Dativ entspricht der hebräischen Konstruktion idiomatisch.
- source_word: וּתְנוּמָה
  choice: und … keinen Schlummer
  rationale: תְּנוּמָה bezeichnet leichten Schlaf oder Eindösen. „Schlummer“ unterscheidet den Ausdruck von שֵׁנָה und erhält den poetischen Parallelismus; nach dem vorausgehenden „keinen“ führt „und … keinen“ die Verneinung natürlich fort.
- source_word: לְעַפְעַפֶּיךָ
  choice: deinen Lidern
  rationale: עַפְעַף bezeichnet die Augenlider. „Lider“ ist prägnant und bewahrt den Parallelismus der Körperteile.
theological_decisions: []
translation_notes:
  register: Moderne, gehobene Standardsprache mit bewusst bewahrtem poetischem Parallelismus. „Gönne … keinen“ gibt das hebräische Bild des Gebens beziehungsweise Gewährens idiomatisch wieder; „Schlummer“ bleibt verständlich, wirkt jedoch dichterisch.
