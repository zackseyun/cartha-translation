  text: אָדָ֣ם בְּ֭לִיַּעַל אִ֣ישׁ אָ֑וֶן ה֝וֹלֵ֗ךְ עִקְּשׁ֥וּת פֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/012.yaml
  text: A worthless man[a], a man of wickedness, walks with a perverse mouth.
translation:
  language: de
  text: Ein nichtsnutziger Mensch, ein Mann des Unrechts, geht mit verdrehter Rede umher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „geht umher mit Verkehrtheit des Mundes“; auch: „mit einem verdrehten Mund“.'
    reason: Die hebräische Wendung verwendet das konkrete Bild des Mundes für verdrehtes oder unaufrichtiges Sprechen.
lexical_decisions:
- source_word: אָדָם
  choice: Mensch
  rationale: Bezeichnet hier eine einzelne Person als negatives Beispiel. „Mensch“ wahrt den persönlichen Singular und bildet mit אִישׁ eine natürliche deutsche Parallelstruktur.
- source_word: בְּלִיַּעַל
  choice: nichtsnutzig
  rationale: Das Wort kennzeichnet den Menschen als moralisch wertlos und verdorben. Eine Wiedergabe als Eigenname „Belial“ würde hier eine spätere Personifizierung nahelegen, die der Spruch nicht verlangt.
- source_word: אִישׁ
  choice: Mann
  rationale: „Mann“ erhält den singularischen und männlichen Ausdruck des Hebräischen sowie den Parallelismus mit אָדָם.
- source_word: אָוֶן
  choice: Unrecht
  rationale: Im Zusammenhang bezeichnet das Wort moralisch verwerfliches Handeln. „Unrecht“ ist natürliches modernes Deutsch und lässt die Bandbreite zwischen Bosheit und Frevel offen.
- source_word: הוֹלֵךְ
  choice: geht umher
  rationale: Das Partizip beschreibt sein fortgesetztes Auftreten beziehungsweise Verhalten. „Geht umher“ bewahrt die Bewegungsmetapher, ohne sie vorschnell nur als Lebensführung auszulegen.
- source_word: עִקְּשׁוּת
  choice: verkehrte
  rationale: Das Substantiv bezeichnet Verdrehung oder Verkehrtheit. In Verbindung mit „Reden“ gibt „verkehrte“ die moralische und kommunikative Schieflage idiomatisch wieder.
- source_word: פֶּה
  choice: Reden
  rationale: Wörtlich steht „Mund“, gemeint ist jedoch das daraus hervorgehende Sprechen. „Reden“ ergibt im Deutschen eine natürliche Wendung; die konkrete hebräische Ausdrucksweise wird in der Fußnote dokumentiert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus „Mensch … Mann“ bleibt erhalten; die ungewöhnliche hebräische Mund-Wendung wird im Haupttext idiomatisch und in der Fußnote formal wiedergegeben.
