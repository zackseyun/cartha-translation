  naturalness: „Ein nichtsnutziger Mensch, ein Mann des Unrechts“ ist in einem sprichwörtlich-weisheitlichen Register verständlich. „geht mit verdrehter Rede umher“ ist modernes, würdiges Deutsch und bewahrt zugleich die Bewegungsmetapher. Es klingt weniger künstlich als „führt verkehrte Reden“.
  terminology: „Nichtsnutziger“ ist für בְּלִיַּעַל tragfähig, ohne die spätere Personifikation „Belial“ einzutragen. „Mann des Unrechts“ gibt אִישׁ אָוֶן angemessen wieder. „Verdrehte Rede“ gibt die kommunikative Funktion von עִקְּשׁוּת פֶּה wieder; die Fußnote hält das konkrete Bild des „Mundes“ fest.
