  text: כִּֽי קִנְאָ֥ה חֲמַת גָּ֑בֶר וְ/לֹֽא יַ֝חְמ֗וֹל בְּ/י֣וֹם נָקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/034.yaml
  text: For jealousy is a man's fury, and he will show no mercy on the day of vengeance.
translation:
  language: de
  text: Denn Eifersucht ist der Grimm eines Mannes, und am Tag der Rache schont er nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִנְאָה
  choice: Eifersucht
  rationale: Im Kontext des betrogenen Ehemanns bezeichnet das Wort Eifersucht; diese Wiedergabe entspricht der konkreten Beziehungssituation.
- source_word: חֲמַת גָּבֶר
  choice: entfacht den Zorn eines Mannes
  rationale: חֵמָה bezeichnet heftigen Zorn beziehungsweise Grimm. Die prädikatslose hebräische Wortgruppe ist knapp und mehrdeutig; die verbale deutsche Fassung gibt den natürlichen Sinn wieder, ohne Eifersucht und Zorn gleichzusetzen.
- source_word: יַחְמוֹל
  choice: kennt er keine Schonung
  rationale: Das Verb bedeutet schonen, Mitleid haben oder sich erbarmen. Die idiomatische Formulierung bewahrt die Aussage, dass er bei der Vergeltung nicht nachsichtig sein wird.
- source_word: בְּיוֹם נָקָם
  choice: am Tag der Rache
  rationale: נָקָם bezeichnet Rache beziehungsweise Vergeltung. „Tag der Rache“ wahrt die Bildsprache und lässt offen, wann und wie die Vergeltung erfolgt.
theological_decisions:
- issue: Beschreibung menschlicher Vergeltung
  choice: Die Aussage wird als Beschreibung der Reaktion des eifersüchtigen Mannes wiedergegeben.
  alternative: Den Vers als Billigung oder göttliche Anordnung der Rache formulieren.
  rationale: Der hebräische Text beschreibt im Zusammenhang die unerbittliche Reaktion des betrogenen Ehemanns; er enthält hier weder einen ausdrücklichen göttlichen Auftrag noch eine moralische Bewertung dieser Rache.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Entfacht“ löst die knappe hebräische Nominalfügung natürlich auf; „kennt er keine Schonung“ ist verständlich und bewahrt den unerbittlichen Ton.
