  source_fidelity: Die erste Wortgruppe gibt לֵב חֹרֵשׁ מַחְשְׁבוֹת אָוֶן treffend als ein Herz wieder, das bewusst moralisch verwerfliche Pläne entwirft. Die Körperteilmetaphorik und die parallele Reihung bleiben erhalten. „dem Bösen entgegenlaufen“ kann im Deutschen jedoch auch bedeuten, dem Bösen entgegenzutreten oder ihm entgegenzugehen; diese mögliche Konnotation widerspricht der im Hebräischen ausgedrückten Bewegung hin zum Bösen. „zum Bösen laufen“ bildet die Zielrichtung eindeutig ab.
  naturalness: „Ein Herz, das böse Pläne schmiedet“ ist idiomatisches, würdiges modernes Standarddeutsch. „Füße, die schnell zum Bösen laufen“ ist klar und natürlich; es bewahrt sowohl die Hast als auch das konkrete Bild des Laufens.
