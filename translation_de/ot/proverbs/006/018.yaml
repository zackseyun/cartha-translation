lexical_decisions:
- source_word: לֵב
  choice: Herz
  rationale: Bewahrt das hebräische Bild für das innere Denken und Wollen, ohne es auf den Verstand zu verengen.
- source_word: חֹרֵשׁ
  choice: schmiedet
  rationale: Gibt den übertragenen Sinn „ersinnen/planen“ in einer natürlichen deutschen Verbindung mit „Pläne“ wieder.
- source_word: מַחְשְׁבוֹת
  choice: Pläne
  rationale: Bezeichnet hier bewusst entworfene Vorhaben und passt idiomatisch zum Verb.
- source_word: אָוֶן
  choice: böse
  rationale: Bringt den moralischen Sinn von Unrecht und Bosheit zum Ausdruck; die Alternative „Unheil“ bewahrt zugleich die mögliche Schadenskomponente.
- source_word: רַגְלַיִם
  choice: Füße
  rationale: Erhält die konkrete Körperteilmetaphorik der Aufzählung.
- source_word: מְמַהֲרוֹת
  choice: eilig
  rationale: Gibt die in der Partizipialform ausgedrückte Hast und Bereitschaft knapp wieder.
- source_word: לָרוּץ
  choice: entgegenlaufen
  rationale: Bewahrt die Laufbewegung; zusammen mit „dem Bösen“ ergibt sich eine natürliche deutsche Formulierung.
- source_word: לָרָעָה
  choice: dem Bösen entgegen
  rationale: Gibt die Zielrichtung der Präposition wieder, ohne das im Hebräischen nicht ausdrücklich stehende „tun“ hinzuzufügen.
