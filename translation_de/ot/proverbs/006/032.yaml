  text: נֹאֵ֣ף אִשָּׁ֣ה חֲסַר לֵ֑ב מַֽשְׁחִ֥ית נַ֝פְשׁ֗/וֹ ה֣וּא יַעֲשֶֽׂ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/032.yaml
  text: He who commits adultery with a woman lacks sense[a]; he who does it destroys himself.
translation:
  language: de
  text: Wer mit einer Frau Ehebruch begeht, dem fehlt es an Verstand[a]; wer das tut, richtet sich selbst zugrunde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem fehlt das Herz“; gemeint ist: Ihm fehlt Einsicht oder Urteilsvermögen. אִשָּׁה kann hier auch „Ehefrau“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹאֵף
  choice: die Ehe bricht
  rationale: Das Partizip bezeichnet jemanden, der Ehebruch begeht. Die deutsche Wendung „die Ehe brechen“ gibt die Handlung natürlich und prägnant wieder.
- source_word: אִשָּׁה
  choice: mit einer Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. „Mit einer Frau“ bewahrt die lexikalische Offenheit; dass es sich um Ehebruch handelt, ergibt sich aus נֹאֵף.
- source_word: חֲסַר לֵב
  choice: dem fehlt der Verstand
  rationale: Wörtlich bedeutet die Wendung „ohne Herz“. Im Kontext der Sprüche bezeichnet לֵב das Denk- und Urteilsvermögen; die gewählte Formulierung ist im modernen Deutsch klar und würdig.
- source_word: מַשְׁחִית
  choice: richtet … zugrunde
  rationale: Das Hifil-Partizip drückt das Verursachen von Verderben oder Vernichtung aus. „Zugrunde richten“ bewahrt die Schärfe des hebräischen Ausdrucks und klingt im Deutschen natürlich.
- source_word: נַפְשׁוֹ
  choice: sich selbst
  rationale: נֶפֶשׁ bezeichnet hier die eigene Person beziehungsweise das eigene Leben, nicht ausdrücklich eine vom Körper getrennte Seele. Die reflexive Wiedergabe trifft den Sinn knapp.
- source_word: הוּא יַעֲשֶׂנָּה
  choice: wer es tut
  rationale: Das feminine Objektsuffix verweist auf die betreffende Handlung. „Wer es tut“ bildet den generischen Charakter des Satzes idiomatisch ab.
theological_decisions:
- issue: Bedeutungsumfang von נַפְשׁוֹ
  choice: sich selbst
  alternative: sein Leben / seine Seele
  rationale: Der Vers spricht von der Selbstzerstörung des Ehebrechers, ohne eine besondere anthropologische Lehre über eine immaterielle Seele festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, spruchhaft knappem Ton. Die maskuline Ausgangsfigur wird durch das generische „wer“ natürlich wiedergegeben; die moralische Aussage und die mögliche Bedeutung „Ehefrau“ bleiben erkennbar.
