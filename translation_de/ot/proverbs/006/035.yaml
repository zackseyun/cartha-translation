  text: לֹא יִ֭שָּׂא פְּנֵ֣י כָל כֹּ֑פֶר וְ/לֹֽא יֹ֝אבֶ֗ה כִּ֣י תַרְבֶּה שֹֽׁחַד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/035.yaml
  text: He will accept no ransom[a] and will not be persuaded, no matter how large the bribe.
translation:
  language: de
  text: Er nimmt keine Ausgleichszahlung an und lässt sich nicht umstimmen, auch wenn du das Bestechungsgeld noch so sehr vermehrst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יִשָּׂא פְּנֵי
  choice: Er nimmt … nicht an
  rationale: Die Wendung bedeutet hier, dass er sich durch die angebotene Zahlung nicht günstig stimmen lässt. Die idiomatische deutsche Formulierung gibt dies im Zusammenhang natürlich wieder.
- source_word: כָל כֹּפֶר
  choice: kein Sühnegeld
  rationale: כֹּפֶר bezeichnet eine Zahlung, die Folgen abwenden oder einen Geschädigten versöhnen soll. „Sühnegeld“ bewahrt diesen Zweck deutlicher als das engere „Lösegeld“; die allgemeinere Möglichkeit „Entschädigung“ wird in der Fußnote genannt.
- source_word: לֹא יֹאבֶה
  choice: lässt sich nicht umstimmen
  rationale: Das Verb bezeichnet fehlende Bereitschaft oder Zustimmung. Im Kontext eines Zahlungsangebots drückt „lässt sich nicht umstimmen“ den volitionalen Sinn aus, ohne emotionale Zufriedenheit zu unterstellen.
- source_word: כִּי תַרְבֶּה שֹׁחַד
  choice: auch wenn du das Bestechungsgeld noch so sehr erhöhst
  rationale: Die Formulierung erhält den konzessiven Sinn, die zweite Person Singular und den Singular von שֹׁחַד. „Noch so sehr“ gibt idiomatisch wieder, dass selbst eine starke Erhöhung nichts bewirkt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sühnegeld“ wahrt den rechtlich-versöhnenden Charakter des hebräischen Begriffs; „lässt sich nicht umstimmen“ erhält die Willenskomponente des Verbs.
