  text: נֶֽגַע וְ/קָל֥וֹן יִמְצָ֑א וְ֝/חֶרְפָּת֗/וֹ לֹ֣א תִמָּחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/033.yaml
  text: He will find injury and disgrace[b][a], and his reproach will not be wiped away.
translation:
  language: de
  text: Verletzung und Schande werden ihn treffen[a], und seine Schmach wird nicht ausgelöscht werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wunde und Entehrung“; נֶגַע kann auch konkreten körperlichen Schaden bezeichnen, während קָלוֹן öffentliche Schande oder Entehrung meint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Seine Schande wird nicht getilgt werden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: Verletzung
  rationale: Das Substantiv kann einen Schlag, eine Wunde oder allgemeiner eine schädigende Heimsuchung bezeichnen. „Verletzung“ hält die mögliche körperliche Bedeutung offen, ohne auf Krankheit oder eine bestimmte Art von Wunde festzulegen.
- source_word: קָלוֹן
  choice: Schande
  rationale: Das Wort bezeichnet öffentliche Entehrung und Schmach. „Schande“ ist im heutigen Deutsch klar, würdevoll und im Zusammenhang passend.
- source_word: יִמְצָא
  choice: werden ihn treffen
  rationale: Wörtlich bedeutet das Verb „finden“. Hier beschreibt es idiomatisch, dass die genannten Folgen über den Mann kommen; „werden ihn treffen“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: חֶרְפָּתוֹ
  choice: seine Schmach
  rationale: חֶרְפָּה bezeichnet Schmach, Beschimpfung oder anhaltende öffentliche Entehrung. „Schmach“ bewahrt den öffentlichen und bleibenden Charakter und unterscheidet den Ausdruck von קָלוֹן.
- source_word: לֹא תִמָּחֶה
  choice: wird nicht ausgelöscht werden
  rationale: Die Niphal-Form von מחה bezeichnet das Wegwischen, Austilgen oder Auslöschen. „Nicht ausgelöscht werden“ bewahrt das Bild einer bleibenden Schmach.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Die Formulierung gibt die kommende Folge des Ehebruchs wieder, ohne festzulegen, ob נֶגַע ausschließlich körperliche Gewalt oder allgemeiner schädigende Folgen meint.
