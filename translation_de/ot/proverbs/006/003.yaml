base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/003.yaml
  text: 'Do this[a], then, my son, and deliver yourself, for you have come into the palm of your neighbor: go, humble yourself[c][b], and press your plea with your neighbors.'
translation:
  language: de
  text: 'Tu das nun, mein Sohn, und befreie dich, denn du bist in die Hand deines Nächsten geraten: Geh, demütige dich[a] und bestürme deine Nächsten[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wirf dich nieder“ oder „unterwirf dich“. Das seltene hebräische Wort kann ein Sich-Niedrigmachen bis hin zum Niederwerfen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht hier formal „deine Nächsten“ im Plural. Wegen des Singulars zuvor kann sinngemäß auch „deinen Nächsten“ beziehungsweise „deinen Freund“ gemeint sein.
    reason: textual_variant
lexical_decisions:
- source_word: עֲשֵׂה זֹאת אֵפוֹא
  choice: Tu das nun
  rationale: Der Imperativ mit Demonstrativ wird direkt wiedergegeben; אֵפוֹא markiert hier Folgerung und Dringlichkeit. „nun“ fügt sich natürlich in die eindringliche Mahnung.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die maskuline Singularanrede entspricht dem hebräischen Wortlaut und dem Stil der Weisheitsliteratur.
- source_word: וְהִנָּצֵל
  choice: und befreie dich
  rationale: Der Niphal-Imperativ bezeichnet das Sich-Entziehen oder Loskommen; die reflexive deutsche Form bewahrt Aufforderung und Dringlichkeit.
- source_word: כִּי בָאתָ
  choice: denn du bist … geraten
  rationale: כִּי begründet die Aufforderung. Das Perfekt beschreibt eine bereits eingetretene Lage; „geraten“ gibt das idiomatisch wieder.
- source_word: בְכַף רֵעֶךָ
  choice: in die Hand deines Nächsten
  rationale: כַּף bedeutet wörtlich „Handfläche“, steht hier aber bildlich für Gewalt oder Verfügungsbereich. Die im Deutschen geläufige Wendung „in die Hand geraten“ bewahrt Bild und Sinn.
- source_word: לֵךְ
  choice: Geh
  rationale: Der schlichte Imperativ leitet die sofort auszuführenden Schritte ein.
- source_word: הִתְרַפֵּס
  choice: wirf dich vor ihm nieder
  rationale: Das seltene Hitpael bezeichnet wahrscheinlich ein Sich-Niedrigmachen oder Niederwerfen. Diese Wiedergabe erhält die kräftige Bildlichkeit, ohne bloß eine innere Demut anzunehmen.
- source_word: וּרְהַב
  choice: und bestürme
  rationale: Das Verb bezeichnet hier wahrscheinlich ein hartnäckiges, nachdrückliches Drängen. „bestürme“ ist knapp, natürlich und lässt den im Hebräischen unausgesprochenen Inhalt der Bitte offen.
- source_word: רֵעֶיךָ
  choice: deine Nächsten
  rationale: Der masoretische Text hat formal den Plural. Er wird im Haupttext bewahrt, obwohl der vorherige Ausdruck im Singular steht und vielfach auch hier ein singularischer Sinn angenommen wird.
