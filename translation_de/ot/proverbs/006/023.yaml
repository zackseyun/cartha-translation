source:
  edition: WLC
  text: כִּ֤י נֵ֣ר מִ֭צְוָה וְ/ת֣וֹרָה א֑וֹר וְ/דֶ֥רֶךְ חַ֝יִּ֗ים תּוֹכְח֥וֹת מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/023.yaml
  text: For the commandment is a lamp[a], and the instruction is light[b], and the reproofs of discipline are the way of life.
translation:
  language: de
  text: Denn das Gebot ist eine Leuchte, und die Weisung ist Licht; Zurechtweisungen zur Erziehung sind der Weg zum Leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Weg des Lebens“ oder „der Lebensweg“. Die hebräische Verbindung kann den Weg bezeichnen, der zum Leben führt, oder den Lebensweg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Ermahnung ein und ist im Deutschen dafür natürlich.
- source_word: נֵר
  choice: Leuchte
  rationale: Bewahrt das konkrete Bild eines Licht spendenden Gegenstands und unterscheidet es vom abstrakten אוֹר („Licht“).
- source_word: מִצְוָה
  choice: Gebot
  rationale: Gibt den verbindlichen Charakter der elterlichen Anweisung im Weisheitskontext wieder.
- source_word: תּוֹרָה
  choice: Weisung
  rationale: Bezeichnet hier wahrscheinlich autoritative Unterweisung, ohne den Ausdruck unnötig auf ein Gesetzeskorpus einzuengen.
- source_word: אוֹר
  choice: Licht
  rationale: Entspricht dem natürlichen Sinn und ergänzt das Bild der Leuchte.
- source_word: תּוֹכְחוֹת מוּסָר
  choice: Zurechtweisungen, die erziehen
  rationale: Gibt sowohl die verbale Korrektur von תּוֹכְחוֹת als auch die formende, erzieherische Dimension von מוּסָר in natürlichem Deutsch wieder.
- source_word: דֶרֶךְ חַיִּים
  choice: der Weg zum Leben
  rationale: Drückt die im Weisheitskontext naheliegende Zielrichtung aus, lässt jedoch die mögliche Bedeutung eines Lebenswegs nicht unerwähnt.
theological_decisions:
- issue: Bedeutung von תּוֹרָה im Weisheitskontext
  choice: Weisung
  alternative: Gesetz; Lehre
  rationale: Der Zusammenhang handelt von autoritativer elterlicher Unterweisung. „Weisung“ bewahrt deren Verbindlichkeit, ohne speziell das mosaische Gesetz vorauszusetzen.
- issue: Bedeutung von דֶרֶךְ חַיִּים
  choice: der Weg zum Leben
  alternative: der Weg des Lebens; ein Lebensweg
  rationale: Die Zielrichtung auf Leben ist im Kontext plausibel; da die hebräische Verbindung auch einen vom Leben geprägten Weg bezeichnen kann, wird die Alternative in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. „Leuchte“ und „Licht“ bewahren den Bildkontrast; „Zurechtweisungen, die erziehen“ vermeidet die im Deutschen sperrige wörtliche Verbindung „Zurechtweisungen der Zucht“.
