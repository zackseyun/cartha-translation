  text: Perversity is in his heart[a]; he devises evil at all times; he sends out strife.
translation:
  language: de
  text: In seinem Herzen ist Verkehrtheit; zu jeder Zeit plant er Böses; er verbreitet Streit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er sendet Streit aus“; gemeint ist, dass er Konflikte verursacht oder verbreitet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּהְפֻּכוֹת
  choice: Verkehrtheit
  rationale: Das abstrakte Pluralwort bezeichnet moralische Verdrehung beziehungsweise eine verkehrte Gesinnung. „Verkehrtheit“ bewahrt diesen abstrakten Sinn, während die Formulierung „Sein Herz ist voller …“ die verblosen hebräischen Worte natürlich wiedergibt.
- source_word: בְּלִבּוֹ
  choice: Sein Herz ist voller
  rationale: Die Präpositionalgruppe beschreibt den inneren Sitz der Verkehrtheit. Die deutsche Prädikativkonstruktion ist natürlich und gibt die innere Haltung wieder, ohne sie näher auszudeuten.
- source_word: חֹרֵשׁ רָע
  choice: plant er Böses
  rationale: חֹרֵשׁ bedeutet wörtlich unter anderem „pflügen“, bezeichnet hier aber idiomatisch das planvolle Ausdenken böser Taten. „Böses planen“ ist klar, gegenwärtig und bewahrt den vorsätzlichen Sinn.
- source_word: בְּכָל־עֵת
  choice: zu jeder Zeit
  rationale: Die Wendung bezeichnet ein fortwährendes, gewohnheitsmäßiges Handeln und bleibt in dieser Form eng am hebräischen Ausdruck.
- source_word: מְדָנִים
  choice: Streit
  rationale: Das Wort bezeichnet Auseinandersetzungen und Konflikte. „Streit“ ist im Deutschen knapp, verständlich und kann den kollektiven Charakter des hebräischen Plurals idiomatisch ausdrücken.
- source_word: יְשַׁלֵּחַ
  choice: sät
  rationale: Die Piel-Form bedeutet wörtlich „aussenden“ beziehungsweise „verbreiten“. In Verbindung mit „Streit“ gibt „sät“ die verursachende und verbreitende Wirkung als natürliche deutsche Redewendung wieder; die wörtlichere Ausdrucksweise wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die drei hebräischen Aussagen bleiben durch Semikolons klar voneinander abgegrenzt. „Verkehrtheit“ bewahrt den weisheitlichen Ausdruck moralischer Verdrehung; „Streit säen“ ist natürliches Deutsch, während die Fußnote die konkrete hebräische Bildsprache offenlegt.
