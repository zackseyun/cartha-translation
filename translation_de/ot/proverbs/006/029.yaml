base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/029.yaml
  text: So is the one who goes in to his neighbor’s wife[b][a]; everyone who touches her will not go unpunished.
translation:
  language: de
  text: 'So ergeht es dem, der zur Frau seines Nächsten geht: Keiner, der sie berührt[b], bleibt ungestraft[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird nicht freigesprochen“ beziehungsweise „gilt nicht als schuldlos“.'
    reason: lexical_alternative
  - marker: b
    text: „Sie berührt“ meint hier wahrscheinlich unerlaubten sexuellen Kontakt, nicht eine bloß zufällige körperliche Berührung.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: So ergeht es
  rationale: Leitet die Anwendung des Vergleichs aus dem vorherigen Vers ein und stellt den sprichwörtlichen Zusammenhang natürlich her.
- source_word: הַבָּא
  choice: dem, der … eingeht
  rationale: Das substantivierte Partizip bezeichnet den Handelnden; „eingehen zu“ bewahrt im Ehebruchskontext die zurückhaltende sexuelle Bedeutung von בוא אל, ohne sie auszudeuten.
- source_word: אֶל אֵשֶׁת רֵעֵהוּ
  choice: zur Frau seines Nächsten
  rationale: „Nächster“ gibt die relationale und ethische Bedeutung von רֵעַ wieder; die Formulierung bleibt nah am Hebräischen.
- source_word: לֹא יִנָּקֶה
  choice: bleibt ungestraft
  rationale: Das Nifal von נקה bezeichnet hier das Freikommen von Strafe beziehungsweise das Freigesprochenwerden. Die Verneinung wird im Deutschen natürlich durch „Keiner … bleibt ungestraft“ ausgedrückt.
- source_word: כָּל
  choice: Keiner
  rationale: כָּל wird zusammen mit der Verneinung distributiv wiedergegeben und bewahrt den universalen Geltungsanspruch.
- source_word: הַנֹּגֵעַ בָּהּ
  choice: der sie berührt
  rationale: „Berührt“ erhält die wörtliche, rhetorisch zurückhaltende Ausdrucksweise; der Kontext legt unerlaubten sexuellen Kontakt nahe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wendung „zu jemandem eingehen“ erhält den verhüllenden Charakter des hebräischen Ausdrucks; die Fußnoten bewahren dessen rechtliche und sexuelle Bedeutungsnuancen.
