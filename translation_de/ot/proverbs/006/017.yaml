lexical_decisions:
- source_word: עֵינַיִם רָמוֹת
  choice: hochmütige Augen
  rationale: Die wörtliche Körperteilmetapher bleibt erhalten; רָמוֹת bezeichnet hier nicht körperliche Höhe, sondern arrogante Überheblichkeit.
- source_word: לְשׁוֹן שָׁקֶר
  choice: eine verlogene Zunge
  rationale: „Zunge“ bewahrt die hebräische Reihe von Körperteilen als Werkzeugen des Bösen. „Verlogen“ gibt die attributive Verbindung mit שָׁקֶר in natürlichem Deutsch wieder.
- source_word: יָדַיִם
  choice: Hände
  rationale: Die wörtliche Mehrzahl erhält die Bildsprache und den Parallelismus des Verses.
- source_word: שֹׁפְכוֹת
  choice: die … vergießen
  rationale: Der Relativsatz gibt die partizipiale, kennzeichnende Handlung idiomatisch wieder.
- source_word: דָּם נָקִי
  choice: unschuldiges Blut
  rationale: Die feste deutsche Wendung entspricht dem Hebräischen und bezeichnet das Blut eines Menschen, der in der betreffenden Sache ohne Schuld ist.
