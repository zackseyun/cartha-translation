  source_fidelity: 'Die Übersetzung gibt die drei hebräischen Glieder vollständig und in ihrer Reihenfolge wieder: עֵינַיִם רָמוֹת als „hochmütige Augen“, לְשׁוֹן שָׁקֶר als „eine verlogene Zunge“ und יָדַיִם שֹׁפְכוֹת דָּם נָקִי als „Hände, die unschuldiges Blut vergießen“. Die Körperteilmetaphorik, die pluralischen Formen bei „Augen“ und „Hände“ sowie der charakterisierende Partizipialausdruck werden angemessen bewahrt.'
