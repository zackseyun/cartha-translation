  text: מְעַ֣ט שֵׁ֭נוֹת מְעַ֣ט תְּנוּמ֑וֹת מְעַ֓ט חִבֻּ֖ק יָדַ֣יִם לִ/שְׁכָּֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/010.yaml
  text: A little sleep[a], a little slumber, a little folding of the hands to lie down—
translation:
  language: de
  text: Ein wenig schlafen, ein wenig schlummern, ein wenig die Hände falten, um sich hinzulegen —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְעַט
  choice: ein wenig
  rationale: Die dreimalige Wiederholung wird beibehalten und gibt den knappen, sprichwörtlichen Rhythmus natürlich wieder.
- source_word: שֵׁנוֹת
  choice: schlafen
  rationale: Obwohl die hebräische Form formal ein Plural ist, entspricht der Infinitiv im Deutschen idiomatisch der als Tätigkeit verstandenen Aussage und bildet mit den folgenden Wendungen eine natürliche Reihe.
- source_word: תְּנוּמוֹת
  choice: schlummern
  rationale: Das Wort bezeichnet leichten Schlaf oder Dösen; „schlummern“ wahrt die poetische Parallelität zu „schlafen“ und bleibt verständlich.
- source_word: חִבֻּק יָדַיִם
  choice: die Hände falten
  rationale: Wörtlich steht ein „Umfassen der Hände“. Die deutsche idiomatische Wendung bewahrt das Bild einer Ruhe- oder Untätigkeitshaltung.
- source_word: לִשְׁכָּב
  choice: um dazuliegen
  rationale: Der Infinitiv bezeichnet das Liegen beziehungsweise Sich-Niederlegen. „um dazuliegen“ verbindet es als Zweck mit dem Händefalten, ohne es mit dem zuvor genannten Schlafen gleichzusetzen.
theological_decisions: []
translation_notes:
  register: Knappes, rhythmisches und würdiges Standarddeutsch. Die dreifache Wiederholung von „ein wenig“ und der offene Gedankenstrich zum folgenden Vers bleiben erhalten. Keine Fußnote ist nötig, da die hebräische Bildsprache im Haupttext unmittelbar wiedergegeben wird.
