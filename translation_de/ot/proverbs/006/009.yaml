  verdict: revise
  source_fidelity: Der Vers gibt die zwei rhetorischen Fragen, die direkte Anrede עָצֵל und den Bezug auf das Aufstehen aus dem eigenen Schlaf zuverlässig wieder. „Willst du noch liegen“ ist als vorwurfsvolle deutsche Frage idiomatisch, bringt jedoch gegenüber dem hebräischen Imperfekt eine leichte voluntative Färbung mit sich; „wirst du noch liegen“ ist quellenäher und ebenso natürlich.
  naturalness: Die Fassung ist klar und modern. „Von deinem Schlaf aufstehen“ klingt im heutigen Standarddeutsch jedoch weniger idiomatisch als „aus deinem Schlaf aufstehen“. Die Anrede steht am Satzende zudem flüssiger.
  terminology: „Du Fauler“ trifft den im Sprüchebuch typischen Begriff für einen durch Faulheit geprägten Menschen gut. Die Fußnotenalternative „du Träger“ ist dagegen sachlich falsch, da „Träger“ gewöhnlich eine Person bezeichnet, die etwas trägt; als Alternative kommt „du Träge“ bzw. „fauler Mensch“ infrage.
