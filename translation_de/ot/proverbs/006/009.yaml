  - severity: low
    issue: „Willst du noch liegen“ kann Absicht nahelegen.
    rationale: Das hebräische Imperfekt fragt hier nach der fortdauernden Lage; „wirst du noch liegen“ bildet dies ohne zusätzliche voluntative Nuance direkter ab.
