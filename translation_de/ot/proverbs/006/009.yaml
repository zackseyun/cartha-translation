base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/009.yaml
  text: How long[a], sluggard, will you lie there? When will you rise from your sleep?
translation:
  language: de
  text: Wie lange wirst du noch liegen, du Fauler[a]? Wann wirst du aus deinem Schlaf aufstehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du Träge“; wörtlich eine männliche Einzahl, die hier einen durch Faulheit geprägten Menschen bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Wie lange
  rationale: Die idiomatische deutsche Frage nach der Dauer bewahrt den vorwurfsvollen Ton des Hebräischen.
- source_word: עָצֵל
  choice: du Fauler
  rationale: Bezeichnet im Buch der Sprüche einen Menschen, dessen Verhalten von Faulheit geprägt ist. Die direkte Anrede im generischen Maskulinum entspricht Form und Ton des hebräischen Textes; eine Fußnote nennt eine weniger substantivierende Alternative.
- source_word: תִּשְׁכָּב
  choice: willst du noch liegen
  rationale: Das Verb bedeutet „liegen“ bzw. „sich hinlegen“. „Noch“ macht im Deutschen die durch עַד מָתַי vorausgesetzte Fortdauer natürlich deutlich, ohne den Sinn wesentlich zu erweitern.
- source_word: מָתַי
  choice: Wann
  rationale: Direkte und natürliche Wiedergabe des einfachen Frageadverbs.
- source_word: תָּקוּם
  choice: wirst du ... aufstehen
  rationale: Im Zusammenhang mit dem Schlaf bezeichnet קום das Aufstehen; diese Wiedergabe ist im modernen Deutsch natürlicher als „dich erheben“.
- source_word: מִשְּׁנָתֶךָ
  choice: von deinem Schlaf
  rationale: Gibt das Substantiv „Schlaf“ samt Präposition und Suffix der zweiten Person Singular direkt wieder.
