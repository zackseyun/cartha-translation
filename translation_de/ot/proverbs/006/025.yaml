  text: Do not desire her beauty in your heart[b][a], and do not let yourself be captured by her eyelashes.
translation:
  language: de
  text: Begehre ihre Schönheit nicht in deinem Herzen[a], und lass dich nicht von ihren Wimpern einfangen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sei in deinem Herzen nicht begierig nach ihrer Schönheit.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und lass sie dich nicht mit ihren Augenlidern/Wimpern nehmen“; gemeint ist die verführerische Wirkung ihrer Augen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמֹד
  choice: begehre
  rationale: חמד bezeichnet ein starkes inneres Begehren und kann auch „begehren“ im Sinn von „begehrlich verlangen“ bedeuten. „Begehre“ bewahrt die Breite des hebräischen Ausdrucks, ohne ihn im Haupttext ausdrücklich auf sexuelle Begierde zu verengen.
- source_word: יָפְיָהּ
  choice: ihre Schönheit
  rationale: יֹפִי bedeutet „Schönheit“ oder „Anmut“. „Ihre Schönheit“ ist direkt, natürlich und entspricht dem konkreten Gegenstand des Begehrens.
- source_word: בִּלְבָבֶךָ
  choice: in deinem Herzen
  rationale: לֵבָב bezeichnet hier das innere Denken, Wollen und Begehren. Die traditionelle und im Deutschen verständliche Wendung „in deinem Herzen“ bewahrt das hebräische Menschenbild und den inneren Charakter der Warnung.
- source_word: תִּקָּחֲךָ
  choice: lass dich … einfangen
  rationale: לקח bedeutet wörtlich „nehmen“. Im Kontext schildert es, wie die angesprochene Person durch verführerische Wirkung vereinnahmt oder gefangen wird. „Lass dich nicht … einfangen“ gibt die Warnung idiomatisch wieder und erhält das Bild des Ergriffenwerdens.
- source_word: בְּעַפְעַפֶּיהָ
  choice: von ihren Wimpern
  rationale: עַפְעַף kann Augenlid oder Wimper bezeichnen. „Wimpern“ vermittelt im heutigen Deutschen die konkrete verführerische Augenwirkung natürlicher als „Augenlider“, ohne abstrakt zu „Blicken“ zu paraphrasieren; בְּ wird als Mittel bzw. Ursache mit „von“ wiedergegeben.
