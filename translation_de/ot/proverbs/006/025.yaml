translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der Parallelismus des hebräischen Weisheitsspruchs bleiben erhalten. Das konkrete Augenbild wird im Haupttext mit „Wimpern“ wiedergegeben; die wörtlichere Formulierung mit „Augenlidern“ steht in der Fußnote.
