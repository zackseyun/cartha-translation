translation:
  language: de
  text: Dann wird deine Armut kommen wie jemand, der umherzieht[a], und dein Mangel wie ein Mann mit einem Schild[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wie einer, der umhergeht“; auch möglich: „wie ein Wanderer“ oder „wie ein Landstreicher“.'
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß auch: „wie ein bewaffneter Mann“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: Dann kommt
  rationale: Das Qal-Perfekt bezeichnet hier in der Folge der Warnung die eintretende Konsequenz. Das deutsche Präsens wirkt in einer sprichwörtlichen Aussage natürlich und lebendig.
- source_word: כִמְהַלֵּךְ
  choice: wie ein Herumstreifender
  rationale: Das Partizip von הלך bedeutet wörtlich einen Umhergehenden. „Herumstreifender“ bewahrt diese Bildsprache, ohne die im Hebräischen nicht ausdrücklich genannte Heimlichkeit eines „Schleichers“ festzulegen.
- source_word: רֵאשֶׁךָ
  choice: deine Armut
  rationale: Das seltene Substantiv bezeichnet Armut oder Mittellosigkeit. „Armut“ ist im modernen Deutsch klar und bildet mit „Mangel“ einen passenden Parallelismus.
- source_word: וּמַחְסֹרְךָ
  choice: und dein Mangel
  rationale: מַחְסוֹר bezeichnet einen Mangel oder ein Fehlen des Nötigen. Die knappe Wiedergabe erhält den synonymen Parallelismus.
- source_word: כְּאִישׁ
  choice: wie ein Mann
  rationale: אִישׁ bezeichnet in diesem Vergleich eine männliche Gestalt; die konkrete Bildhaftigkeit bleibt erhalten.
- source_word: מָגֵן
  choice: mit einem Schild
  rationale: מָגֵן bedeutet gewöhnlich „Schild“. Die formnahe Wiedergabe wahrt die konkrete, bedrohliche Gestalt, statt sie deutend zu „bewaffnet“ zu verallgemeinern.
