source:
  edition: WLC
  text: לֹא יָב֣וּזוּ לַ֭/גַּנָּב כִּ֣י יִגְנ֑וֹב לְ/מַלֵּ֥א נַ֝פְשׁ֗/וֹ כִּ֣י יִרְעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/030.yaml
  text: People do not despise a thief if he steals to satisfy himself when he is hungry[a][b].
translation:
  language: de
  text: Einen Dieb verachtet man nicht, wenn er stiehlt, um sich zu sättigen[a], weil er Hunger hat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um seinen Appetit zu stillen“; wörtlich: „um seine Seele zu füllen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wenn er hungrig ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָב֣וּזוּ
  choice: verachtet man nicht
  rationale: בוז bezeichnet Verachtung oder Geringschätzung. Die unpersönliche Form mit „man“ gibt den generischen Plural des Hebräischen im Deutschen natürlich wieder.
- source_word: לַגַּנָּב
  choice: einen Dieb
  rationale: Obwohl das hebräische Substantiv bestimmt ist, bezeichnet es hier sprichwörtlich einen repräsentativen Fall; der unbestimmte Singular ist dafür im Deutschen idiomatisch.
- source_word: כִּי יִגְנ֑וֹב
  choice: wenn er stiehlt
  rationale: כִּי führt hier den Umstand ein, unter dem die Aussage gilt. „Wenn“ bewahrt den konditional-situativen Sinn, ohne den Diebstahl als allgemeine Begründung der fehlenden Verachtung darzustellen.
- source_word: לְמַלֵּ֥א נַפְשׁוֹ
  choice: um sich zu sättigen
  rationale: Wörtlich steht „um seine נפש zu füllen“. Im Zusammenhang mit Hunger bezeichnet die Wendung das Stillen des eigenen körperlichen Bedürfnisses; „sich sättigen“ ist natürlich und wahrt den reflexiven Bezug.
- source_word: נַפְשׁוֹ
  choice: sich
  rationale: נֶפֶשׁ kann Selbst, Leben, Seele oder Verlangen/Appetit bezeichnen. Der reflexive Ausdruck hält die Bedeutung offen; die wörtliche und appetitbezogene Möglichkeit wird in der Fußnote genannt.
- source_word: כִּי יִרְעָב
  choice: weil er Hunger hat
  rationale: Die abschließende כִּי-Klausel nennt am wahrscheinlichsten den Grund für die Handlung. Die mögliche situative Wiedergabe „wenn er hungrig ist“ bleibt als Alternative erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch in knapper Spruchform. Die Satzstellung hebt „einen Dieb“ wie im Hebräischen hervor. Die Formulierung beschreibt die gesellschaftliche Beurteilung eines aus Hunger begangenen Diebstahls, ohne ihn ausdrücklich moralisch zu billigen.
