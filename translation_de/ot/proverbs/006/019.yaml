  text: יָפִ֣יחַ כְּ֭זָבִים עֵ֣ד שָׁ֑קֶר וּ/מְשַׁלֵּ֥חַ מְ֝דָנִ֗ים בֵּ֣ין אַחִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/019.yaml
  text: a false witness who breathes out lies[b][a], and one who sends out strife among brothers.
translation:
  language: de
  text: ein falscher Zeuge, der Lügen ausstößt,[a] und wer Streit unter Brüdern verbreitet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Unwahrheiten aussagt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »zwischen Brüdern«; gemeint sein können leibliche Brüder oder, weiter gefasst, eng verbundene Mitglieder einer Gemeinschaft.'
    reason: cultural_note
lexical_decisions:
- source_word: יָפִיחַ
  choice: ausstößt
  rationale: Das Hifil von פוח bezeichnet wörtlich das Ausströmenlassen von Atem und wird hier bildhaft für das Äußern von Worten gebraucht. »Ausstoßen« bewahrt dieses eindringliche Bild.
- source_word: כְּזָבִים
  choice: Lügen
  rationale: Der Plural bezeichnet Unwahrheiten oder Täuschungen; »Lügen« ist im heutigen Deutsch klar, natürlich und moralisch prägnant.
- source_word: עֵד שָׁקֶר
  choice: ein falscher Zeuge
  rationale: Die Verbindung bedeutet wörtlich »Zeuge der Falschheit«. »Falscher Zeuge« bewahrt den rechtlichen und moralischen Sinn und entspricht einer geläufigen deutschen Wendung.
- source_word: וּמְשַׁלֵּחַ
  choice: und wer … verbreitet
  rationale: Das Partizip von שלח bedeutet grundsätzlich »aussenden«. In Verbindung mit Streit bezeichnet es dessen aktive Verbreitung; »verbreitet« gibt diese Wirkung natürlich wieder, ohne das Bild durch »säen« zu ersetzen.
- source_word: מְדָנִים
  choice: Streit
  rationale: Das Substantiv bezeichnet Streitigkeiten, Zwist oder Auseinandersetzungen. »Streit« ist verständlich, knapp und bewahrt die konkrete zwischenmenschliche Spannung.
- source_word: בֵּין אַחִים
  choice: unter Brüdern
  rationale: Die hebräische Wendung lautet wörtlich »zwischen Brüdern«. Bei einer unbestimmten Mehrzahl klingt »unter Brüdern« im Deutschen natürlicher und bewahrt zugleich die maskuline Beziehungsbezeichnung des Ausgangstextes.
theological_decisions:
- issue: Reichweite der Bezeichnung אַחִים
  choice: Brüdern
  alternative: Geschwistern; Angehörigen derselben Gemeinschaft
  rationale: Der hebräische Ausdruck ist maskuliner Plural und kann sowohl leibliche Brüder als auch eng verbundene Mitglieder einer Gemeinschaft bezeichnen. Der Haupttext bewahrt die konkrete Ausgangsform; die mögliche weitere Bedeutung wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Lügen ausstößt« bewahrt die kräftige hebräische Atemmetapher; »Streit verbreitet« gibt die aktive, konfliktfördernde Bedeutung idiomatisch wieder. Die Kleinschreibung am Anfang berücksichtigt, dass Vers 19 die Aufzählung aus den vorhergehenden Versen fortsetzt.
