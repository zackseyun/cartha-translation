base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/022.yaml
  text: When you walk[a], it will guide you; when you lie down, it will watch over you; and when you awake, it will speak with you.
translation:
  language: de
  text: Wenn du unterwegs bist, wird sie dich führen; wenn du dich hinlegst, wird sie über dich wachen; und wenn du aufwachst, wird sie mit dir sprechen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּהִתְהַלֶּכְךָ
  choice: wenn du unterwegs bist
  rationale: Die Präposition ב mit dem Infinitivkonstrukt der Hitpael-Form von הלך und dem Suffix der 2. Person maskulin Singular ist temporal. „Unterwegs bist“ gibt sowohl das Gehen als auch das weitere Sich-Bewegen im Alltag natürlich wieder.
- source_word: תַּנְחֶה אֹתָךְ
  choice: wird sie dich führen
  rationale: Die Hifil-Form von נחה bedeutet „führen“ oder „leiten“. „Führen“ ist im Deutschen klar und passt zum Bild der Weisheitslehre, die den Lebensweg bestimmt.
- source_word: בְּשָׁכְבְּךָ
  choice: wenn du dich hinlegst
  rationale: Die temporale Konstruktion mit שכב bezeichnet zunächst das Sich-Hinlegen, nicht erst den Schlaf. Die reflexive deutsche Form ist idiomatisch und präzise.
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: wird sie über dich wachen
  rationale: שמר mit על bezeichnet schützendes Bewachen. „Über dich wachen“ bewahrt diesen Schutzgedanken und klingt in modernem Standarddeutsch natürlich.
- source_word: וַהֲקִיצוֹתָ
  choice: wenn du aufwachst
  rationale: Die Form von יקץ bezeichnet das Erwachen und setzt die zeitliche Folge von Unterwegssein, Hinlegen und Aufwachen fort.
- source_word: הִיא
  choice: sie
  rationale: Das ausdrücklich feminine Pronomen nimmt die feminine „Weisung“ (תורה) aus Vers 20 auf. Anders als im Englischen lässt sich dieses Genus im Deutschen natürlich bewahren, ohne eine zusätzliche Personifikation einzuführen.
- source_word: תְשִׂיחֶךָ
  choice: wird sie zu dir sprechen
  rationale: שׂיח kann sprechen, sich unterhalten oder sinnen bedeuten. Mit femininem Subjekt und Personenbezug gibt „zu dir sprechen“ die kommunikative, weiterführende Begleitung der Weisung am klarsten wieder.
theological_decisions:
- issue: Feminines Subjekt und mögliche Personifikation der Weisung
  choice: Das feminine Pronomen wird mit „sie“ wiedergegeben und auf die „Weisung“ im unmittelbaren Kontext bezogen.
  alternative: Unpersönlich mit „sie wird dir Rat geben“ oder mit einem sächlichen Bezugswort formulieren.
  rationale: Das Hebräische setzt ausdrücklich הִיא („sie“), dessen nächster passender Bezug die feminine תורה („Weisung“) in Vers 20 ist. Das deutsche Genus erlaubt eine formnahe und zugleich natürliche Wiedergabe. Eine darüber hinausgehende Identifikation mit einer eigenständigen Weisheitsgestalt wird nicht behauptet.
- issue: Bedeutungsumfang von תְשִׂיחֶךָ
  choice: „wird sie zu dir sprechen“
  alternative: „wird sie sich mit dir unterhalten“ oder „wird sie dein Sinnen sein“
  rationale: Die Verbwurzel שׂיח besitzt einen breiten Bedeutungsbereich. Im Parallelismus beschreibt sie am ehesten die fortdauernde persönliche Begleitung durch die Weisung; „zu dir sprechen“ wahrt diese Aussage, ohne den Text zu einer bloßen inneren Meditation oder förmlichen Belehrung zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die dreigliedrige Tagesfolge und die wiederholte Zukunftsform bleiben erhalten. „Unterwegs bist“ vermeidet das im Deutschen potenziell zu enge Bild bloßen Fußgehens und lässt zugleich die lebenspraktische Dimension des Hitpael erkennen.
