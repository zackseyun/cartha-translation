source:
  edition: WLC
  text: עַל כֵּ֗ן פִּ֭תְאֹם יָב֣וֹא אֵיד֑/וֹ פֶּ֥תַע יִ֝שָּׁבֵ֗ר וְ/אֵ֣ין מַרְפֵּֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/015.yaml
  text: Therefore his disaster will come suddenly[a]; in an instant he will be broken[b], and there will be no healing.
translation:
  language: de
  text: Darum wird sein Verderben plötzlich kommen; im Nu wird er zerbrochen werden, und es gibt keine Heilung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und es gibt keine Abhilfe.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung bezeichnet die Folge aus der vorausgehenden Beschreibung; „Darum“ ist knapp, natürlich und bewahrt die schlussfolgernde Funktion.
- source_word: פִּתְאֹם
  choice: plötzlich
  rationale: Das Adverb bezeichnet unvermitteltes Eintreten und wird direkt und idiomatisch wiedergegeben.
- source_word: יָבֹוא אֵידוֹ
  choice: sein Verderben wird kommen
  rationale: אֵיד kann Unheil, Verderben oder Untergang bezeichnen. „Verderben“ passt zur Weisheitsliteratur und lässt sowohl das hereinbrechende Unheil als auch dessen zerstörerischen Ausgang anklingen.
- source_word: פֶּתַע
  choice: im Nu
  rationale: Die zweite Bezeichnung der Plötzlichkeit wird variiert wiedergegeben, sodass die poetische Steigerung erhalten bleibt.
- source_word: יִשָּׁבֵר
  choice: wird er zerbrochen werden
  rationale: Die passive Form und das Bild des Zerbrechens bleiben erhalten; eine engere Deutung als Zusammenbruch oder Vernichtung wird nicht festgelegt.
- source_word: וְאֵין מַרְפֵּא
  choice: und es gibt keine Heilung
  rationale: „Heilung“ bewahrt das konkrete Bild von Wiederherstellung und entspricht dem Bedeutungsfeld von מַרְפֵּא; zugleich kann die Wendung sinngemäß das Fehlen jeder Abhilfe bezeichnen.
theological_decisions: []
translation_notes:
