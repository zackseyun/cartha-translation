  text: לֵֽךְ אֶל נְמָלָ֥ה עָצֵ֑ל רְאֵ֖ה דְרָכֶ֣י/הָ וַ/חֲכָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/006.yaml
  text: Go to the ant[a], you sluggard[b]; consider her ways and become wise.
translation:
  language: de
  text: Geh zur Ameise, du Fauler; sieh dir ihre Wege an und werde weise.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ אֶל
  choice: Geh zu
  rationale: Der direkte Imperativ mit Richtungsangabe wird im modernen Deutschen natürlich und kraftvoll mit „Geh zu“ wiedergegeben.
- source_word: נְמָלָה
  choice: zur Ameise
  rationale: Der bestimmte Singular stellt die Ameise als beispielhafte Gattung dar; „zur Ameise“ entspricht idiomatischem Deutsch.
- source_word: עָצֵל
  choice: du Fauler
  rationale: Die substantivierte Personenbezeichnung bewahrt die direkte, tadelnde Anrede des maskulinen Singulars. „Faulpelz“ wäre umgangssprachlicher und „Träger“ im heutigen Deutsch missverständlich.
- source_word: רְאֵה
  choice: sieh dir … an
  rationale: Das Verb bedeutet wörtlich „sieh“, fordert hier aber zu aufmerksamer Beobachtung auf. Die deutsche Wendung „sieh dir … an“ bewahrt das Bild des Sehens und vermittelt diesen prüfenden Sinn.
- source_word: דְרָכֶיהָ
  choice: ihre Wege
  rationale: „Wege“ bildet den Plural ab und bezeichnet im weisheitlichen Sprachgebrauch Verhaltensweisen oder Lebensführung. Das feminine Pronomen entspricht sowohl dem grammatischen Geschlecht im Hebräischen als auch dem Deutschen.
- source_word: וַחֲכָם
  choice: und werde weise
  rationale: Die Form ist eine Aufforderung; „werde weise“ bringt den durch die Beobachtung angestrebten Lern- und Veränderungsprozess natürlicher zum Ausdruck als das eher statische „sei weise“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige und leicht verständliche Weisheitssprache. Die knappe imperativische Struktur und der scharfe persönliche Tadel des Hebräischen bleiben erhalten; wegen der im Deutschen ebenfalls femininen „Ameise“ ist keine erläuternde Fußnote zum Pronomen nötig.
