  source_fidelity: 'Der deutsche Text gibt die hebräischen Imperative und die Abfolge treffend wieder: „Geh zur Ameise“ entspricht לֵךְ אֶל־נְמָלָה, „du Fauler“ der direkten Anrede עָצֵל, und „sieh dir ihre Wege an und werde weise“ bildet רְאֵה דְרָכֶיהָ וַחֲכָם angemessen ab. Die feminine Bezugnahme ist sowohl im Hebräischen als auch im Deutschen unproblematisch.'
