id: PRO.6.26
reference: Proverbs 6:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י בְעַד אִשָּׁ֥ה זוֹנָ֗ה עַֽד כִּכַּ֫ר לָ֥חֶם וְ/אֵ֥שֶׁת אִ֑ישׁ נֶ֖פֶשׁ יְקָרָ֣ה תָצֽוּד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/026.yaml
  text: For because of a prostitute one is reduced to a loaf of bread[c][b][a], but a married woman hunts a precious life.
translation:
  language: de
  text: Denn wegen einer Prostituierten verarmt man bis auf einen Laib Brot[a]; eine verheiratete Frau[b] aber macht Jagd auf ein kostbares Leben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und in der hebräischen Kürze: „Denn wegen einer Prostituierten bis zu einem Laib Brot.“ Häufig wird dies so verstanden, dass der Betroffene bis zur äußersten Armut herunterkommt. Möglich ist auch die Deutung, dass eine Prostituierte schon für einen Laib Brot zu haben ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Frau eines Mannes“; im Zusammenhang ist eine verheiratete Frau gemeint, mit der ein anderer Mann Ehebruch begeht.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „eine kostbare Seele“ beziehungsweise „einen kostbaren Menschen“. Das hebräische Wort kann „Leben“, „Seele“, „Selbst“ oder „Person“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Warnung ein und gibt den kausalen Zusammenhang im Deutschen natürlich wieder.
- source_word: בְעַד
  choice: wegen
  rationale: 'Bezeichnet hier Ursache beziehungsweise Folge: Der Umgang mit der Prostituierten führt zu dem beschriebenen Verlust.'
- source_word: אִשָּׁה זוֹנָה
  choice: eine Prostituierte
  rationale: זוֹנָה bezeichnet hier eine Frau, die Prostitution ausübt; „Prostituierte“ ist klar, gegenwärtig und nicht altertümlich.
- source_word: עַד כִּכַּר לָחֶם
  choice: verarmt man bis auf einen Laib Brot
  rationale: Die hebräische Wendung ist stark verkürzt und enthält kein ausdrückliches Verb. Die Übersetzung macht die wahrscheinlich gemeinte Verarmung verständlich, bewahrt aber mit „bis auf einen Laib Brot“ das konkrete Bild.
- source_word: וְאֵשֶׁת אִישׁ
  choice: eine verheiratete Frau aber
  rationale: Wörtlich steht „die Frau eines Mannes“. „Verheiratete Frau“ ist im Deutschen natürlich und bewahrt den Gegensatz, ohne sie im Haupttext ausdrücklich als Ehebrecherin zu bezeichnen.
- source_word: נֶפֶשׁ יְקָרָה
  choice: ein kostbares Leben
  rationale: נֶפֶשׁ kann „Leben“, „Person“, „Selbst“ oder „Seele“ bedeuten. Im Zusammenhang der Warnung vor tödlicher Gefahr passt „Leben“ am besten; „kostbar“ gibt יְקָרָה unmittelbar wieder.
- source_word: תָצוּד
  choice: macht Jagd auf
  rationale: Bewahrt das anschauliche Bild des Jagens beziehungsweise Fangens und gibt die feminine Singularform passend zum Subjekt wieder.
theological_decisions:
- issue: Reichweite von נֶפֶשׁ
  choice: Leben
  alternative: Seele
  rationale: Der Vers warnt vor dem Verlust des ganzen Lebens, möglicherweise bis hin zum Tod. „Leben“ trägt diese Bedeutung, ohne eine spezielle Lehre über die Seele in den Text einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Die Ellipse der ersten Vershälfte wird im Haupttext behutsam erschlossen; die echte Deutungsunsicherheit bleibt in der Fußnote sichtbar. Das Jagdbild der zweiten Hälfte wird bewusst erhalten.
