id: PRO.6.31
reference: Proverbs 6:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֭/נִמְצָא יְשַׁלֵּ֣ם שִׁבְעָתָ֑יִם אֶת כָּל ה֖וֹן בֵּית֣/וֹ יִתֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/031.yaml
  text: Yet if he is found[a], he must repay sevenfold; he must give all the wealth of his house.
translation:
  language: de
  text: Wird er aber ertappt, muss er siebenfach[a] Ersatz leisten; den ganzen Besitz seines Hauses muss er hergeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „siebenmal“. Der hebräische Ausdruck kann eine siebenfache Ersatzleistung oder eine Rückzahlung in Höhe des Siebenfachen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִמְצָא
  choice: Wird er aber ertappt
  rationale: Das adversative וְ führt nach dem im vorherigen Vers erwähnten Verständnis für den hungrigen Dieb zur Folge seiner Entdeckung über. Das Nifal von מצא bedeutet hier idiomatisch, dass er ertappt bzw. entdeckt wird; die vorangestellte Verbform lässt die konditionale Beziehung im Deutschen natürlich erkennen.
- source_word: יְשַׁלֵּם
  choice: muss er … Ersatz leisten
  rationale: Das Piel von שלם bezeichnet hier die geschuldete Wiedergutmachung oder Rückzahlung. „Ersatz leisten“ gibt den rechtlich-verpflichtenden Sinn in gegenwärtigem Deutsch wieder.
- source_word: שִׁבְעָתָיִם
  choice: siebenfach
  rationale: Die Zahlform bezeichnet eine siebenfache bzw. siebenmalige Ersatzleistung. „Siebenfach“ ist knapp und wahrt die mögliche Mehrdeutigkeit hinsichtlich der genauen Berechnungsweise.
- source_word: אֶת כָּל הוֹן בֵּיתוֹ
  choice: den ganzen Besitz seines Hauses
  rationale: הוֹן bezeichnet Vermögen, Habe oder Besitz. Die Formulierung bewahrt die Zugehörigkeitsbeziehung des Hebräischen, ohne sie unnötig als bloßen Hausrat einzuengen.
- source_word: יִתֵּן
  choice: muss er hergeben
  rationale: נתן bedeutet wörtlich „geben“. In diesem Zusammenhang drückt „hergeben“ die konkrete und umfassende Herausgabe des Vermögens aus; „muss“ macht die parallele Verpflichtung deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper weisheitlicher Satzstruktur. „Ertappt“ ist allgemein verständlich und kontextgerecht; „Ersatz leisten“ wahrt den rechtlichen Ton. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Zahlform.
