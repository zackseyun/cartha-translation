base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/005.yaml
  text: Rescue yourself like a gazelle from the hand[c][b][a], and like a bird from the hand of the fowler.
translation:
  language: de
  text: Reiß dich los[a] wie eine Gazelle[b] aus der Hand[c] und wie ein Vogel aus der Hand des Fallenstellers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Befreie dich“ oder „Entkomme“. Der hebräische Imperativ drängt dazu, sich unverzüglich zu befreien.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet gewöhnlich eine Gazelle; traditionell wird es mitunter mit „Reh“ wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist offenbar die Hand des Fallenstellers beziehungsweise Jägers, der erst im parallelen zweiten Satzteil ausdrücklich genannt wird.
    reason: ellipsis_clarification
lexical_decisions:
- source_word: הִנָּצֵל
  choice: Reiß dich los
  rationale: Der Niphal-Imperativ in der 2. Person Singular fordert nachdrücklich dazu auf, sich aus einer Bindung oder Gewalt zu befreien. „Reiß dich los“ gibt Dringlichkeit und reflexiven Sinn im heutigen Deutsch anschaulich wieder.
- source_word: כִּצְבִי
  choice: wie eine Gazelle
  rationale: צְבִי bezeichnet gewöhnlich eine Gazelle; das vorangestellte כ kennzeichnet den Vergleich. „Gazelle“ ist genauer als das allgemeinere „Hirsch“ und heute verständlicher als „Reh“ in traditioneller Wiedergabe.
- source_word: מִיָּד
  choice: aus der Hand
  rationale: יָד bedeutet wörtlich „Hand“ und kann zugleich Gewalt oder Verfügungsgewalt ausdrücken. Die konkrete Formulierung erhält das Jagdbild und den Parallelismus des Hebräischen.
- source_word: וּכְצִפּוֹר
  choice: und wie ein Vogel
  rationale: צִפּוֹר ist eine allgemeine Bezeichnung für einen Vogel, häufig einen kleinen Vogel, ohne eine bestimmte Art wie den Sperling festzulegen.
- source_word: מִיַּד יָקוּשׁ
  choice: aus der Hand des Fallenstellers
  rationale: יָקוּשׁ bezeichnet jemanden, der Fallen oder Schlingen legt. „Fallensteller“ ist im Deutschen verständlich, passt sowohl zum Vogelbild als auch zum weiteren Jagdkontext und bewahrt den handelnden Menschen statt ihn durch das Fanggerät zu ersetzen.
theological_decisions: []
translation_notes:
  register: Modernes, eindringliches Standarddeutsch mit würdigem Ton. „Reiß dich los“ wahrt die Dringlichkeit des Imperativs; „aus der Hand“ erhält bewusst das konkrete hebräische Bild und dessen Parallelismus. Die Ellipse im ersten Vergleich bleibt im Haupttext bestehen und wird lediglich in der Fußnote erläutert.
