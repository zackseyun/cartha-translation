  text: עֹבֵ֣ר בַּ֭/שּׁוּק אֵ֣צֶל פִּנָּ֑/הּ וְ/דֶ֖רֶךְ בֵּיתָ֣/הּ יִצְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/008.yaml
  text: passing through the street near her corner[a], and he steps toward her house.
translation:
  language: de
  text: Er geht die Straße entlang, nahe ihrer Ecke, und schreitet auf ihr Haus zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er geht die Marktstraße entlang, nahe ihrer Ecke, und nimmt den Weg zu ihrem Haus.“'
    reason: שׁוּק kann auch „Marktstraße“ bzw. eine öffentliche Marktstraße bezeichnen; וְדֶרֶךְ בֵּיתָהּ lässt sich stärker nominal als „den Weg zu ihrem Haus“ wiedergeben.
lexical_decisions:
- source_word: עֹבֵר
  choice: geht … vorbei
  rationale: Das Qal-Partizip schildert die Bewegung als Teil der beobachteten Szene; die deutsche Präsensform gibt dies natürlich wieder.
- source_word: בַּשּׁוּק
  choice: auf der Straße
  rationale: שׁוּק bezeichnet hier eine öffentliche Straße; ein möglicher Bezug zur Marktstraße bleibt in der Fußnote erhalten.
- source_word: אֵצֶל פִּנָּהּ
  choice: nahe ihrer Ecke
  rationale: Die Formulierung bewahrt sowohl die räumliche Nähe als auch die im Hebräischen ausgedrückte Zuordnung der Ecke zu der Frau.
- source_word: וְדֶרֶךְ בֵּיתָהּ
  choice: auf ihr Haus zu
  rationale: Die Wendung bezeichnet seinen Weg beziehungsweise seine Bewegungsrichtung zum Haus der Frau und wird im Deutschen idiomatisch direktional wiedergegeben.
- source_word: יִצְעָד
  choice: schreitet
  rationale: צעד bezeichnet ein bewusstes Schreiten oder Setzen von Schritten; „schreitet“ erhält das konkrete Bewegungsbild.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt anschaulich und knapp; die mögliche Marktbedeutung von שׁוּק sowie die alternative Fassung der Wegangabe werden nicht in den Haupttext gedrängt, sondern in der Fußnote bewahrt.
