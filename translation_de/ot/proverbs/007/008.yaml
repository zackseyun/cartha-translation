  source_fidelity: Der Haupttext gibt die Abfolge des hebräischen Partizips עֹבֵר und des finiten Verbs יִצְעָד angemessen im Präsens wieder. Die Richtung auf das Haus der Frau zu ist sachgerecht. Allerdings kann „auf der Straße nahe ihrer Ecke vorbei“ im Deutschen nahelegen, dass er an der Straße vorbeigeht, statt dass er sich auf der Straße bei ihrer Ecke bewegt. Eine geringfügige Umstellung beseitigt diese Mehrdeutigkeit und bewahrt die räumliche Aussage von בַּשּׁוּק אֵצֶל פִּנָּהּ.
  naturalness: „Er geht die Straße entlang, nahe ihrer Ecke“ ist modernes, natürliches Standarddeutsch und stellt klar die Bewegung innerhalb der Straße dar. „Schreitet auf ihr Haus zu“ bleibt knapp, würdevoll und anschaulich.
  terminology: „Straße“ ist für שׁוּק im Kontext gut vertretbar; die mögliche Nuance „Marktstraße“ bleibt in der Fußnote kenntlich. „Ecke“, „Haus“ und „schreitet“ geben die hebräischen Ausdrücke angemessen wieder. Die Fußnote wird sprachlich geglättet und auf die tatsächlich relevanten Alternativen beschränkt.
