  to: Er geht die Straße entlang, nahe ihrer Ecke, und schreitet auf ihr Haus zu.[a]
  rationale: Die Umstellung von „auf der Straße … vorbei“ zu „die Straße entlang“ klärt die deutsche Satzstruktur, ohne die Bedeutung zu verändern. Die Fußnote bleibt an der gesamten alternativen Formulierung verankert und dokumentiert sowohl die mögliche Marktnuance von שׁוּק als auch die nominalere Wiedergabe von דֶרֶךְ.
