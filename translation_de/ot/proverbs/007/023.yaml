source:
  edition: WLC
  text: עַ֤ד יְפַלַּ֪ח חֵ֡ץ כְּֽבֵד֗/וֹ כְּ/מַהֵ֣ר צִפּ֣וֹר אֶל פָּ֑ח וְ/לֹֽא יָ֝דַ֗ע כִּֽי בְ/נַפְשׁ֥/וֹ הֽוּא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/023.yaml
  text: until an arrow pierces his liver[a], like a bird rushing into a snare, and he does not know that it will cost him his life.
translation:
  language: de
  text: bis ein Pfeil seine Leber durchbohrt – wie ein Vogel, der in die Schlinge eilt und nicht weiß, dass es um sein Leben geht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »dass es sein Leben betrifft«; das Hebräische ist knapp und elliptisch. Im Zusammenhang bezeichnet die Wendung die tödliche Gefahr beziehungsweise dass dies sein Leben kostet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: bis
  rationale: Der zeitliche Anschluss führt die Bewegung aus dem vorherigen Vers bis zu ihrem tödlichen Ausgang weiter.
- source_word: יְפַלַּח
  choice: durchbohrt
  rationale: Das Piel von פלח bezeichnet hier ein gewaltsames Durchdringen; »durchbohren« bewahrt das konkrete Bild.
- source_word: חֵץ
  choice: Pfeil
  rationale: Die übliche und kontextuell passende Bezeichnung des Geschosses.
- source_word: כְּבֵדוֹ
  choice: seine Leber
  rationale: כָּבֵד bezeichnet konkret die Leber. Das ungewöhnlich eindringliche Körperbild wird nicht zu »Herz« oder »Inneres« verallgemeinert.
- source_word: כְמַהֵר צִפּוֹר
  choice: wie ein Vogel, der … eilt
  rationale: Die Form drückt das hastige, ahnungslose Hineingeraten des Vogels in die Gefahr aus; »eilt« ist knapp, natürlich und würdevoll.
- source_word: אֶל־פָּח
  choice: in die Schlinge
  rationale: פָּח ist eine Fangvorrichtung, besonders für Vögel; »Schlinge« erhält das konkrete Bild.
- source_word: וְלֹא יָדַע
  choice: Er weiß nicht
  rationale: Die unmittelbare Wiedergabe wahrt die präsentische Anschaulichkeit der sprichwörtlichen Warnung.
- source_word: כִּי בְנַפְשׁוֹ הוּא
  choice: dass es um sein Leben geht
  rationale: Die hebräische Wendung ist elliptisch und lässt sich wörtlich als »dass es für/gegen sein Leben ist« erfassen. Die gewählte Formulierung bleibt näher an dieser Offenheit als eine eindeutige Auslegung wie »es wird ihn das Leben kosten«.
theological_decisions:
- issue: Tragweite der elliptischen Schlusswendung כִּי בְנַפְשׁוֹ הוּא
  choice: dass es um sein Leben geht
  alternative: dass es ihn das Leben kosten wird
  rationale: Die Übersetzung macht die Lebensgefahr verständlich, legt die elliptische Präposition בְּ aber nicht unnötig auf eine einzige idiomatische Deutung fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit dichter, würdevoller Bildsprache. Der Gedankenstrich markiert den abrupten Wechsel vom jungen Mann zum Vergleich mit dem Vogel; ein neuer Satz lässt die abschließende Warnung klar hervortreten.
