  text: 'Sie packte ihn und küsste ihn; mit dreister Miene sagte sie zu ihm:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶחֱזִיקָה בּוֹ
  choice: Sie packte ihn
  rationale: החזיק mit ב bezeichnet hier ein entschiedenes Ergreifen oder Festhalten. „Packte“ gibt die unvermittelte, offensive Handlung natürlich und knapp wieder.
- source_word: וְנָשְׁקָה לּוֹ
  choice: und küsste ihn
  rationale: נשק im Qal bedeutet gewöhnlich „küssen“. Die einfache direkte Form entspricht der hebräischen Erzählfolge.
- source_word: הֵעֵזָה פָנֶיהָ
  choice: Unverfroren
  rationale: Die Wendung beschreibt wörtlich ein Verhärten beziehungsweise Kühnmachen des Gesichts und bezeichnet dreiste, unverschämte Unbefangenheit. „Unverfroren“ bewahrt den Bezug auf fehlende Scham idiomatisch, ohne eine zusätzliche moralische Wertung über den Kontext hinaus einzutragen.
- source_word: וַתֹּאמַר לוֹ
  choice: sagte sie zu ihm
  rationale: Das ausdrückliche לּוֹ wird mit „zu ihm“ wiedergegeben; die nachgestellte Redeeinleitung klingt im Deutschen nach dem vorangestellten Adverb natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Packte“ vermittelt die energische Körperhandlung; „unverfroren“ gibt das hebräische Gesichtsidiom natürlich wieder. Der Doppelpunkt führt wie im Kontext zur folgenden direkten Rede.
