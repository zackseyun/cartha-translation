  yaml_path: translation/ot/proverbs/007/002.yaml
  text: Keep my commandments and live[a], and my instruction as the pupil of your eye.
translation:
  language: de
  text: Bewahre meine Gebote und lebe; bewahre meine Weisung wie deinen Augapfel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie die Pupille deiner Augen“. Das hebräische Bild bezeichnet etwas, das mit größter Sorgfalt geschützt werden soll.'
    reason: Die Fußnote macht das konkrete hebräische Körperbild sichtbar, während der Haupttext die entsprechende natürliche deutsche Redewendung verwendet.
lexical_decisions:
- source_word: שְׁמֹר
  choice: Bewahre
  rationale: Das Imperativverb שׁמר umfasst Bewahren, Hüten und Befolgen. „Bewahre“ passt zu Geboten und nimmt zugleich die fürsorgliche Wachsamkeit des zweiten Versglieds auf.
- source_word: מִצְוֺתַי
  choice: meine Gebote
  rationale: מִצְוָה bezeichnet hier verbindliche Anweisungen; „Gebote“ ist im Deutschen natürlich und bewahrt den Plural mit dem Suffix der ersten Person.
- source_word: וֶחְיֵה
  choice: und lebe
  rationale: Die knappe Beiordnung des Hebräischen bleibt erhalten. Zugleich kann die Wendung wie im Ausgangstext sowohl als Aufforderung als auch mit anklingender Folge verstanden werden.
- source_word: וְתוֹרָתִי
  choice: und meine Weisung
  rationale: תּוֹרָה bezeichnet im Kontext der Sprüche die Unterweisung des Weisheitslehrers und nicht ausschließlich Gesetz im engeren Sinn. „Weisung“ bewahrt sowohl lehrende als auch verbindliche Aspekte.
- source_word: כְּאִישׁוֹן עֵינֶיךָ
  choice: wie deinen Augapfel
  rationale: 'Die feste deutsche Wendung „wie seinen Augapfel hüten“ vermittelt die Bedeutung des hebräischen Bildes natürlich: etwas äußerst Empfindliches und Kostbares sorgfältig schützen. Das Possessivpronomen steht entsprechend dem hebräischen Suffix in der zweiten Person.'
theological_decisions:
- issue: Bedeutung von תּוֹרָה im Weisheitskontext
  choice: Weisung
  alternative: Gesetz; Unterweisung; Lehre
  rationale: „Weisung“ vermeidet eine vorschnelle Beschränkung auf das mosaische Gesetz, ohne den verbindlichen Charakter der väterlichen Weisheitslehre abzuschwächen.
- issue: Verhältnis zwischen Gebotsbewahrung und Leben
  choice: und lebe
  alternative: damit du lebst; so wirst du leben
  rationale: Die Übersetzung wahrt die imperative Form und die hebräische Beiordnung, ohne das Verhältnis ausdrücklich nur als Zweck oder Folge festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute Redewendung „wie deinen Augapfel“ ist allgemein verständlich; „Weisung“ entspricht dem Sprachregister der Weisheitsliteratur. Der Fußnotenmarker [a] steht unmittelbar beim betreffenden Ausdruck.
