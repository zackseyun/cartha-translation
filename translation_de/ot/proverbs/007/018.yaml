base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/018.yaml
  text: Come[a], let us drink our fill of love until morning[b]; let us delight ourselves with love.
translation:
  language: de
  text: Komm, lass uns bis zum Morgen Liebkosungen in vollen Zügen genießen; lass uns an Liebesfreuden unsere Freude haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָה
  choice: Komm
  rationale: Der Imperativ von הלך dient hier idiomatisch als auffordernde Einladung; „Komm“ gibt den verführerischen Ruf im Deutschen natürlich wieder.
- source_word: נִרְוֶה
  choice: wir wollen uns … berauschen
  rationale: רוה bezeichnet das Satttrinken beziehungsweise Gesättigtwerden. Mit „sich an etwas berauschen“ bleibt das Bild des Trinkens erhalten und klingt im erotischen Zusammenhang natürlich.
- source_word: דֹדִים
  choice: Liebkosungen
  rationale: Der Plural kann in erotischen Zusammenhängen Liebe, Liebesbezeugungen oder Zärtlichkeiten bezeichnen. „Liebkosungen“ wahrt die konkrete sinnliche Bedeutung, ohne expliziter zu werden als der Kontext.
- source_word: עַד הַבֹּקֶר
  choice: bis zum Morgen
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: נִתְעַלְּסָה
  choice: wir wollen uns … erfreuen
  rationale: Der Hitpael von עלס drückt genussvolle, ausgelassene Freude aus. „Uns erfreuen“ bewahrt die reflexive Form und den gehobenen Ton.
- source_word: בָּאֳהָבִים
  choice: an der Liebe
  rationale: Der seltene Plural bezeichnet hier im Kontext erotische Liebe beziehungsweise Liebesgenüsse. Die allgemeinere Wiedergabe „Liebe“ erhält die poetische Offenheit, während der Zusammenhang die sinnliche Bedeutung erkennen lässt.
