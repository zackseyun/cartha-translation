review_pass:
  verdict: revise
  source_fidelity: Der Aufforderungscharakter von לְכָה und die beiden kohortativen Formen sind zutreffend erfasst. „Sich an Liebkosungen berauschen“ verschiebt jedoch נִרְוֶה („uns sättigen / uns volltrinken“) zur Vorstellung des Betrunkenseins. Die Wiedergabe sollte das Bild des reichlichen Genießens bzw. der Sättigung bewahren. דֹדִים und אֳהָבִים stehen im erotischen Kontext; „Liebkosungen“ und „Liebesfreuden“ geben die sinnliche Bedeutung wieder, ohne unnötig zu explizieren.
  naturalness: „Lass uns“ ist als deutsche Entsprechung der gemeinsamen Aufforderung unmittelbarer und natürlicher als das zweimalige „wir wollen“. „Liebkosungen in vollen Zügen genießen“ ist modernes, poetisch passendes Deutsch und bewahrt die Intensität des hebräischen Trink-/Sättigungsbildes idiomatisch.
  terminology: „Liebkosungen“ ist für דֹדִים gut geeignet. Für בָּאֳהָבִים ist „Liebesfreuden“ im Kontext angemessener als die abstraktere „Liebe“ und wahrt zugleich die poetische, nicht technisch explizite Ausdrucksweise. Es werden keine dogmatischen Deutungen eingeführt.
