  text: קָשְׁרֵ֥/ם עַל אֶצְבְּעֹתֶ֑י/ךָ כָּ֝תְבֵ֗/ם עַל ל֥וּחַ לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/003.yaml
  text: Tie them on your fingers[a]; write them on the tablet of your heart.
translation:
  language: de
  text: Binde sie an deine Finger; schreibe sie auf die Tafel deines Herzens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָשְׁרֵם
  choice: Binde sie
  rationale: Der Imperativ von קשר mit Suffix bedeutet konkret „sie binden/festbinden“. „Binde sie“ bewahrt das anschauliche Bild und klingt im Deutschen natürlich.
- source_word: עַל אֶצְבְּעֹתֶיךָ
  choice: an deine Finger
  rationale: Bei einem befestigenden Verb gibt „an“ die räumliche Beziehung im Deutschen idiomatisch wieder; der Plural „Finger“ folgt dem Hebräischen.
- source_word: כָּתְבֵם
  choice: schreibe sie
  rationale: Der Imperativ von כתב mit Suffix wird unmittelbar wiedergegeben und erhält den Parallelismus zum ersten Satzteil.
- source_word: עַל לוּחַ
  choice: auf die Tafel
  rationale: לוּחַ bezeichnet eine Schreibtafel. „Auf die Tafel“ bewahrt das konkrete Schreibbild; der Akkusativ entspricht im Deutschen der gerichteten Handlung des Schreibens.
- source_word: לִבֶּךָ
  choice: deines Herzens
  rationale: „Herz“ erhält die biblische Metapher und lässt den im Hebräischen umfassenden Bezug auf Denken, Wollen und Empfinden bestehen.
theological_decisions:
- issue: Bildhafte Verinnerlichung der Weisung
  choice: Die konkreten Bilder des Bindens an die Finger und des Schreibens auf die Tafel des Herzens bleiben erhalten.
  alternative: „Behalte sie stets vor Augen und präge sie dir tief ein.“
  rationale: Eine erklärende Paraphrase würde die literarische und mögliche bundestheologische Resonanz verengen. Die Bildsprache vermittelt bleibende Nähe und innere Einprägung, ohne beides ausdrücklich gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe imperativische Parallelismus des hebräischen Verses bleibt erhalten. Keine Fußnote nötig, da „binden“ die lexikalische Spannweite von קשר im Deutschen angemessen wiedergibt.
