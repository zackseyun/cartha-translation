  text: זִבְחֵ֣י שְׁלָמִ֣ים עָלָ֑/י הַ֝/יּ֗וֹם שִׁלַּ֥מְתִּי נְדָרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/014.yaml
  text: Peace offerings were due from me[a]; today I have paid my vows.
translation:
  language: de
  text: Ich war verpflichtet, Heilsopfer darzubringen[a]; heute habe ich meine Gelübde erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinschaftsopfer“. Der hebräische Ausdruck bezeichnet Opfer des Friedens oder Wohlergehens, von deren Fleisch nach der Opferhandlung gegessen werden konnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי שְׁלָמִים
  choice: Heilsopfer
  rationale: Die Wendung bezeichnet Opfer des Friedens beziehungsweise Wohlergehens. „Heilsopfer“ ist im Deutschen ein prägnanter kultischer Begriff und bleibt näher am Hebräischen als die stärker deutende Wiedergabe „Gemeinschaftsopfer“.
- source_word: עָלַי
  choice: hatte ich darzubringen
  rationale: Wörtlich steht „auf mir“. Im Zusammenhang mit Opferpflichten drückt die Formulierung aus, dass die Sprecherin diese Opfer zu leisten hatte; die deutsche Wendung gibt diesen Sinn natürlich wieder, ohne bereits den später verfügbaren Fleischanteil in den Text einzutragen.
- source_word: הַיּוֹם
  choice: heute
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: שִׁלַּמְתִּי
  choice: habe ich … erfüllt
  rationale: Das Piel von שׁלם bedeutet bei Gelübden, sie zu erfüllen beziehungsweise einzulösen. „Erfüllt“ ist im Deutschen die natürliche Verbindung mit „Gelübde“ und wahrt die kultische Aussage.
- source_word: נְדָרָי
  choice: meine Gelübde
  rationale: Der Plural mit Suffix der ersten Person Singular wird direkt und ohne erklärenden Zusatz wiedergegeben.
theological_decisions:
- issue: Kultische Sprache im Mund der verführerischen Frau
  choice: Die ausdrückliche Sprache von Opfer und Gelübde bleibt erhalten.
  alternative: Die Aussage als bloßen Hinweis auf vorhandenes Essen umschreiben.
  rationale: Der Vers verbindet legitime Gottesdienstsprache mit der Verführungsszene. Diese Spannung darf weder moralistisch geglättet noch durch eine rein alltägliche Umschreibung verdeckt werden.
- issue: Bedeutung von עָלַי
  choice: Als Verpflichtung zum Darbringen wiedergegeben.
  alternative: „Bei mir“ im Sinn von verfügbarem Opferfleisch oder wörtlich „auf mir“.
  rationale: Die Verpflichtungsbedeutung passt zur anschließenden Erfüllung der Gelübde und ergibt im Deutschen einen klaren Satz; der Kontext kann zugleich erkennen lassen, dass nach dem Opfer Fleisch für ein Mahl vorhanden war.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die kultischen Fachbegriffe bleiben erkennbar; die Satzstellung hebt wie im Hebräischen die Heilsopfer hervor.
