  source_fidelity: 'Die Übersetzung gibt die hebräische Aussage vollständig wieder: נַפְתִּי ist im Duftstoffkontext treffend mit „habe … beduftet“ wiedergegeben, מִשְׁכָּבִי mit „mein Bett“, und die drei Aromata Myrrhe, אֲהָלִים und Zimt sind vollständig erhalten. „Adlerholz“ ist für אֲהָלִים eine sachlich präzise moderne Bezeichnung für das wohlriechende Holz; die Fußnote wahrt die traditionelle Benennung und beugt dem Missverständnis mit der Aloe-Pflanze vor.'
