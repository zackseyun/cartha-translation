  text: נַ֥פְתִּי מִשְׁכָּבִ֑/י מֹ֥ר אֲ֝הָלִ֗ים וְ/קִנָּמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/017.yaml
  text: I have perfumed my bed with myrrh[a], aloes, and cinnamon.
translation:
  language: de
  text: Ich habe mein Bett mit Myrrhe, Adlerholz[a] und Zimt beduftet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Aloenholz“; das hebräische Wort bezeichnet ein wohlriechendes Holz, das für Duftstoffe verwendet wurde, nicht die heute gewöhnlich so genannte Aloe-Pflanze.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתִּי
  choice: habe … beduftet
  rationale: Das Verb bezeichnet hier das Auftragen aromatischer Stoffe. „Beduftet“ gibt im Deutschen sowohl die Handlung als auch ihren Zweck natürlich wieder; „besprengt“ wäre formaler, ließe den Duftaspekt aber weniger deutlich hervortreten.
- source_word: מִשְׁכָּבִי
  choice: mein Bett
  rationale: מִשְׁכָּב bezeichnet einen Ort zum Liegen, also Bett oder Lager. Im Zusammenhang der Verführung ist „mein Bett“ klar und idiomatisch.
- source_word: מֹר
  choice: Myrrhe
  rationale: Die übliche und präzise deutsche Bezeichnung für das aromatische Harz.
- source_word: אֲהָלִים
  choice: Adlerholz
  rationale: Gemeint ist ein wohlriechendes Holz, das für Duftstoffe verwendet wurde, nicht die heute gewöhnlich als Aloe bezeichnete Pflanze. „Adlerholz“ vermeidet dieses Missverständnis; die traditionelle Alternative wird in der Fußnote genannt.
- source_word: וְקִנָּמוֹן
  choice: und Zimt
  rationale: קִנָּמוֹן bezeichnet das Gewürz Zimt; die Konjunktion verbindet den letzten Bestandteil der Duftstoffliste.
theological_decisions: []
