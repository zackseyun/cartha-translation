  text: וָ/אֵ֤רֶא בַ/פְּתָאיִ֗ם אָ֘בִ֤ינָה בַ/בָּנִ֗ים נַ֣עַר חֲסַר לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/007.yaml
  text: and I saw among the simple[a]; I discerned among the young men a youth lacking sense.
translation:
  language: de
  text: Da sah ich unter den Unerfahrenen, erkannte unter den jungen Männern einen Jugendlichen ohne Einsicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ohne Herz“. Das Herz gilt hier als Sitz von Verstand, Urteilsvermögen und moralischer Einsicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Da sah ich
  rationale: Das Qal-Wayyiqtol der 1. Person Singular führt die Beobachtung erzählerisch fort. „Da sah ich“ gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: בַפְּתָאיִם
  choice: unter den Unerfahrenen
  rationale: פְּתָאיִם bezeichnet im Sprüchebuch Menschen, die unerfahren, leicht beeinflussbar und noch nicht weise sind. „Unerfahrene“ vermeidet die heute oft abwertende Verengung von „Einfältige“ auf geringe Intelligenz.
- source_word: אָבִינָה
  choice: bemerkte
  rationale: Die Form von בין bezeichnet hier ein unterscheidendes Wahrnehmen. „Bemerkte“ hebt den prüfenden Blick hervor und unterscheidet sich zugleich vom vorhergehenden „sah“.
- source_word: בַבָּנִים
  choice: unter den jungen Männern
  rationale: Wörtlich steht „unter den Söhnen“; im Zusammenhang bezeichnet בָּנִים jedoch eine Gruppe junger Männer im öffentlichen Raum.
- source_word: נַעַר
  choice: einen jungen Mann
  rationale: נַעַר kann je nach Kontext einen Jungen oder jungen Mann bezeichnen. Hier handelt die Person selbstständig auf der Straße; „junger Mann“ ist daher natürlich und sachlich passend.
- source_word: חֲסַר לֵב
  choice: dem es an Einsicht fehlte
  rationale: Die Wendung bedeutet wörtlich „ohne Herz“, wobei לֵב im hebräischen Weisheitsdenken auch Urteilsvermögen, Verstand und moralische Einsicht umfasst. „An Einsicht fehlen“ bewahrt diese Verbindung von intellektueller und moralischer Urteilskraft.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Weisheitsliteratur-Ton. Die parallelen Wahrnehmungsverben werden durch „sah“ und „bemerkte“ unterschieden; unnötig abwertende Bezeichnungen für den Unerfahrenen werden vermieden.
