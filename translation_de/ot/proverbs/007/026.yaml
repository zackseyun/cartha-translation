base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/026.yaml
  text: For she has cast down many wounded[a], and all her slain are mighty.
translation:
  language: de
  text: 'Denn viele Erschlagene hat sie zu Fall gebracht,[a]

    und zahlreich sind alle ihre Erschlagenen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn viele Verwundete hat sie zu Fall gebracht«; חֲלָלִים kann auch tödlich Getroffene bzw. Verwundete bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und mächtig sind alle ihre Erschlagenen«; das hebräische Wort kann »zahlreich« oder »stark/mächtig« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Warnung ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: רַבִּים
  choice: viele
  rationale: Gibt die gewöhnliche Mengenangabe knapp und idiomatisch wieder.
- source_word: חֲלָלִים
  choice: Verwundete
  rationale: Das Wort kann Verwundete oder Erschlagene bezeichnen. »Verwundete« erhält gegenüber הֲרֻגֶיהָ eine mögliche poetische Steigerung, ohne die lexikalische Mehrdeutigkeit zu verdecken.
- source_word: הִפִּילָה
  choice: hat sie zu Fall gebracht
  rationale: Der Hifil von נפל bezeichnet das Verursachen eines Falls; die Wendung ist im Deutschen anschaulich und natürlich.
- source_word: וַעֲצֻמִים
  choice: zahlreich
  rationale: עָצוּם kann je nach Kontext »stark/mächtig« oder »zahlreich« bedeuten. In der parallelen Aussage über die Menge ihrer Opfer ergibt »zahlreich« einen natürlichen Sinn, während die Alternative in einer Fußnote bewahrt wird.
- source_word: כָּל
  choice: alle
  rationale: Bewahrt den umfassenden Ausdruck des hebräischen Textes.
- source_word: הֲרֻגֶיהָ
  choice: die sie erschlagen hat
  rationale: 'Gibt das passive Partizip mit weiblichem Possessivsuffix in verständlichem modernem Deutsch wieder: wörtlich ihre Erschlagenen.'
