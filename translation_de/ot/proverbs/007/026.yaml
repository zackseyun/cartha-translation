  source_fidelity: Die syntaktische Gliederung wird im Entwurf grundsätzlich getroffen. חֲלָלִים bezeichnet jedoch vorrangig tödlich Getroffene bzw. Erschlagene; »Verwundete« ist möglich, aber als Haupttext weniger präzise. Die zweite Zeile bezieht sich auf »alle ihre Erschlagenen«, nicht auf »alle, die sie erschlagen hat« in einer Weise, die das Kollektivprädikat »zahlreich« semantisch verwischt.
  naturalness: »Zahlreich sind alle, die sie erschlagen hat« ist im Deutschen unidiomatisch bzw. logisch missverständlich, weil einzelne Personen nicht jeweils »zahlreich« sein können. »Zahlreich sind alle ihre Erschlagenen« gibt die kollektive Aussage klar und in würdigem, modernem Spruchstil wieder.
  terminology: »Erschlagene« gibt חֲלָלִים und הֲרֻגֶיהָ in dieser kriegerisch-bildhaften Aussage angemessen wieder. Die lexikalische Möglichkeit »Verwundete« für das erste Wort sowie »stark/mächtig« für עֲצֻמִים werden in Fußnoten transparent bewahrt.
  issues:
