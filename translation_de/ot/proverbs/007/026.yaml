    issue: Die Hauptübersetzung »Verwundete« für חֲלָלִים ist weniger quellentreu als »Erschlagene«.
    rationale: Das Wort kann im Kontext von Gewalteinwirkung stehen, bezeichnet aber gewöhnlich Durchbohrte bzw. Getötete und wird durch הֲרֻגֶיהָ in der zweiten Zeile nicht zu bloß Verletzten abgeschwächt.
  - severity: high
