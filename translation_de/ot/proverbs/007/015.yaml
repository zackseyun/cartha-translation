  yaml_path: translation/ot/proverbs/007/015.yaml
  text: Therefore I came out to meet you[a], to seek your face, and I have found you.
translation:
  language: de
  text: Darum bin ich hinausgegangen, um dir zu begegnen, um dich zu suchen[a] – und ich habe dich gefunden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um dein Angesicht zu suchen“. Das hebräische Verb kann auch frühzeitiges oder beharrliches Suchen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung bezeichnet den Grund für das folgende Handeln. „Darum“ ist knapp, natürlich und bewahrt den kausalen Zusammenhang.
- source_word: יָצָאתִי
  choice: bin ich hinausgegangen
  rationale: Das Verb bedeutet „hinausgehen“. Das Perfekt entspricht natürlicher deutscher direkter Rede und stellt die Handlung als bereits vollzogen dar.
- source_word: לִקְרָאתֶךָ
  choice: dir entgegen
  rationale: Die Konstruktion bezeichnet die Bewegung auf jemanden zu, gewöhnlich mit dem Ziel der Begegnung. „Dir entgegen“ gibt dieses räumliche und persönliche Moment prägnant wieder.
- source_word: לְשַׁחֵר
  choice: eifrig zu suchen
  rationale: Das Verb bezeichnet ein ernsthaftes, eifriges Suchen und kann auch die Nuance frühen Suchens tragen. „Eifrig“ macht die Intensität im Deutschen hörbar; die weitere Bedeutungsbreite wird in der Fußnote bewahrt.
- source_word: פָּנֶיךָ
  choice: dich
  rationale: Wörtlich steht „dein Angesicht“. Im Deutschen ist „jemandes Angesicht suchen“ deutlich bibelsprachlich; das idiomatische „dich suchen“ vermittelt hier den gemeinten persönlichen Gegenstand der Suche. Die wörtliche Ausdrucksweise wird in der Fußnote genannt.
- source_word: וָאֶמְצָאֶךָּ
  choice: und ich habe dich gefunden
  rationale: 'Die Form führt die Handlung fort: „und ich fand dich“. Das deutsche Perfekt klingt in direkter Rede natürlich und betont zugleich das gegenwärtige Ergebnis der Suche.'
