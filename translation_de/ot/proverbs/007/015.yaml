  terminology: Keine theologisch belasteten Begriffe. „Angesicht“ wird in der Fußnote als wörtliche hebräische Formulierung sachgerecht dokumentiert. Die Fußnote sollte die Bedeutungsbreite von שָׁחַר als Alternative, nicht als Eigenschaft der Hauptübersetzung, ausweisen.
