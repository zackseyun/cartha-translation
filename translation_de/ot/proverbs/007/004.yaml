base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/004.yaml
  text: Say to wisdom[a], “You are my sister,” and call understanding your kinswoman,
translation:
  language: de
  text: 'Sag zur Weisheit: »Du bist meine Schwester« und nenne die Einsicht deine Vertraute[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Bekannte«, »Verwandte« oder »enge Freundin«. Das hebräische Wort bezeichnet eine bekannte oder nahestehende Person und kann je nach Zusammenhang auch einen Verwandten meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר לַחָכְמָה
  choice: Sag zur Weisheit
  rationale: Der Imperativ אֱמֹר fordert zum Sprechen auf, und ל kennzeichnet die Weisheit als Adressatin. »Sag zur Weisheit« ist natürlich und bewahrt ihre Personifikation.
- source_word: אֲחֹתִי אָתְּ
  choice: Du bist meine Schwester
  rationale: Die wörtliche Verwandtschaftsbezeichnung und das feminine Pronomen werden beibehalten. Die familiäre Nähe ist im Zusammenhang bedeutsam.
- source_word: וּמוֹדָע
  choice: deine Verwandte
  rationale: מוֹדָע bezeichnet eine nahestehende, bekannte Person und kann je nach Zusammenhang auch einen Verwandten meinen. »Verwandte« wahrt hier den familiären Parallelismus zu »Schwester« und passt zur personifizierten femininen »Einsicht«.
- source_word: לַבִּינָה
  choice: die Einsicht
  rationale: בִּינָה bezeichnet in den Sprüchen verständige Einsicht beziehungsweise Unterscheidungsvermögen. »Einsicht« bildet im Deutschen eine natürliche begriffliche und poetische Paarung mit »Weisheit«.
- source_word: תִקְרָא
  choice: nenne
  rationale: Die Verbform hat im parallelen Mahnspruch auffordernde Kraft. Bei einer Bezeichnung wie »Verwandte« ist »nennen« im Deutschen idiomatischer als »rufen«.
theological_decisions: []
