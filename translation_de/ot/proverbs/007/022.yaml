  text: ה֤וֹלֵ֥ךְ אַחֲרֶ֗י/הָ פִּ֫תְאֹ֥ם כְּ֭/שׁוֹר אֶל טָ֣בַח יָב֑וֹא וּ֝/כְ/עֶ֗כֶס אֶל מוּסַ֥ר אֱוִֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/022.yaml
  text: He goes after her at once[a], like an ox going to the slaughter, and like a fetter to the discipline of a fool.
translation:
  language: de
  text: Sogleich folgt er ihr, wie ein Rind, das zur Schlachtung geht, und wie eine Fessel zur Zurechtweisung eines Narren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die zweite Vershälfte ist im Hebräischen schwer verständlich. Das hier mit „Fessel“ wiedergegebene Wort kann anders gedeutet werden; manche übersetzen die Zeile sinngemäß etwa: „wie ein Hirsch, der in eine Schlinge tritt“, oder: „wie Fußfesseln zur Zurechtweisung eines Narren“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ אַחֲרֶיהָ
  choice: folgt er ihr
  rationale: Die Verbindung bezeichnet hier das Hinterhergehen beziehungsweise Folgen; die deutsche Formulierung ist natürlich und bewahrt die anschauliche Bewegung.
- source_word: פִּתְאֹם
  choice: sogleich
  rationale: Das Adverb hebt die unvermittelte, unbedachte Reaktion hervor. „Sogleich“ gibt sowohl die Plötzlichkeit als auch die sofortige Folgsamkeit wieder.
- source_word: כְּשׁוֹר
  choice: wie ein Rind
  rationale: שׁוֹר bezeichnet ein Stück Rindvieh und kann je nach Kontext Ochse oder Stier meinen. „Rind“ vermeidet eine nicht ausdrücklich markierte Festlegung und trägt das Bild eines ahnungslos zur Schlachtung geführten Tieres.
- source_word: אֶל טָבַח יָבֹא
  choice: das zur Schlachtung geht
  rationale: Wörtlich steht „zur Schlachtung kommt“. Im Deutschen gibt „zur Schlachtung geht“ die Zielrichtung idiomatisch und bildhaft wieder.
- source_word: וּכְעֶכֶס
  choice: und wie ein Gefesselter
  rationale: עֶכֶס ist in dieser schwierigen Zeile textlich beziehungsweise lexikalisch umstritten. Die Wiedergabe als gefesselte Person folgt der Deutung als Fessel und ergibt zusammen mit dem folgenden Ausdruck einen möglichen deutschen Satz, ohne die Unsicherheit zu verschweigen.
- source_word: אֶל מוּסַר
  choice: zur Züchtigung
  rationale: מוּסָר umfasst Erziehung, Zurechtweisung und strafende Disziplin. In diesem Gerichtskontext bringt „Züchtigung“ die schmerzhafte korrigierende Maßnahme knapp zum Ausdruck.
- source_word: אֱוִיל
  choice: eines Narren
  rationale: Das Wort bezeichnet in der Weisheitsliteratur einen moralisch und geistlich uneinsichtigen Menschen. Der Genitiv bewahrt die schwer bestimmbare Zuordnung des hebräischen Ausdrucks.
theological_decisions:
- issue: Art des drohenden Verderbens
  choice: Das Bild bleibt konkret als Schlachtung und Züchtigung stehen.
  alternative: Die Bilder ausdrücklich als Tod, Gericht oder moralische Folgen auslegen.
  rationale: Der Vers arbeitet mit Vergleichen und deutet deren genaue theologische Reichweite nicht aus; eine explizite Auslegung würde die Bildspannung unnötig festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sogleich“ und „Züchtigung“ sind leicht gehoben, bleiben aber verständlich und passen zum prägnanten Ton der Weisheitsdichtung. Die unsichere zweite Vergleichszeile wird im Haupttext lesbar formuliert und in der Fußnote ausdrücklich als textlich beziehungsweise lexikalisch schwierig ausgewiesen.
