  - severity: low
    issue: „Züchtigung“ verengt מוּסָר
    rationale: מוּסָר kann auch Zurechtweisung, Erziehung oder Disziplin bezeichnen. Im schwierigen Kontext sollte eine weniger spezifisch körperliche Wiedergabe gewählt werden.
