  text: וְ/הִנֵּ֣ה אִ֭שָּׁה לִ/קְרָאת֑/וֹ שִׁ֥ית ז֝וֹנָ֗ה וּ/נְצֻ֥רַת לֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/010.yaml
  text: And look—a woman came to meet him[a], dressed like a prostitute and cunning of heart.
translation:
  language: de
  text: Und siehe, da kam ihm eine Frau entgegen, in der Aufmachung einer Prostituierten und verschlagenen Herzens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit verborgenem Herzen“, „mit verborgenen Absichten“ oder „mit bewahrtem/abgeschirmtem Herzen“. Das Hebräische lautet wörtlich etwa „bewahrten/abgeschirmten Herzens“ und kann auf verborgene Absichten anspielen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh da
  rationale: Die Wendung führt die Szene anschaulich und unmittelbar ein. „Sieh da“ bewahrt diese hinweisende Kraft in würdigem, verständlichem Deutsch.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: Im Zusammenhang ist eine zunächst nicht näher bezeichnete Frau gemeint; „Frau“ ist daher die natürliche Entsprechung.
- source_word: לִקְרָאתוֹ
  choice: kam ihm entgegen
  rationale: Die Formulierung bezeichnet eine Bewegung auf eine Begegnung zu. „Kam ihm entgegen“ gibt dies idiomatisch und knapp wieder.
- source_word: שִׁית זוֹנָה
  choice: gekleidet wie eine Prostituierte
  rationale: שִׁית bezeichnet hier Kleidung oder Aufmachung; die Wiedergabe vermittelt die äußere Erscheinung natürlich, ohne einen altertümlichen Ausdruck zu verwenden.
- source_word: וּנְצֻרַת לֵב
  choice: mit verschlossenem Herzen
  rationale: Die Form von נצר trägt die Grundvorstellung des Bewahrten, Abgeschirmten oder Verborgenen. Die Wiedergabe erhält das Bild und seine Mehrdeutigkeit, während die Fußnote die im Kontext naheliegende Bedeutung verborgener oder listiger Absichten nennt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh da“ sorgt für die lebendige Szeneneröffnung; „mit verschlossenem Herzen“ bewahrt bewusst die ungewöhnliche hebräische Metapher und ihre mögliche Spannung zwischen innerer Verschlossenheit und listig verborgenen Absichten.
