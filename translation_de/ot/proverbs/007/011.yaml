  yaml_path: translation/ot/proverbs/007/011.yaml
  text: She is loud and rebellious; her feet do not stay at home.
translation:
  language: de
  text: Sie ist laut und widerspenstig; ihre Füße bleiben nicht zu Hause.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֹמִיָּה
  choice: laut
  rationale: Das Partizip beschreibt sie als lärmend bzw. geräuschvoll; „laut“ ist im Deutschen knapp, natürlich und trifft den Kontext.
- source_word: וְסֹרָרֶת
  choice: und widerspenstig
  rationale: Das Wort bezeichnet aufbegehrendes, unlenksames Verhalten. „Widerspenstig“ bewahrt diese Charakterisierung, ohne sie konfessionell oder psychologisch auszuweiten.
- source_word: בְּבֵיתָהּ לֹא יִשְׁכְּנוּ רַגְלֶיהָ
  choice: ihre Füße bleiben nicht zu Hause
  rationale: Die wörtliche Körperteilrede bleibt erhalten. „Zu Hause“ gibt die idiomatische Bedeutung von „in ihrem Haus“ natürlich wieder; das Verb beschreibt ein Bleiben bzw. Verweilen.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Der Parallelismus und die bildhafte Rede von den Füßen bleiben gewahrt.
