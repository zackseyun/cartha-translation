base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/005.yaml
  text: to keep you from the forbidden woman[a], from the foreign woman whose words are smooth.
translation:
  language: de
  text: um dich vor der verbotenen Frau zu bewahren, vor der fremden Frau, deren Worte glatt sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deren Worte schmeicheln“ beziehungsweise „die mit ihren Worten schmeichelt“. Wörtlich: „die ihre Worte glatt gemacht hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: um dich … zu bewahren
  rationale: Der Infinitiv mit ל bezeichnet hier den Zweck der im vorherigen Vers genannten Weisung. „Bewahren“ gibt den schützenden Sinn von שמר natürlich und würdevoll wieder.
- source_word: מֵאִשָּׁה זָרָה
  choice: vor der verbotenen Frau
  rationale: זָרָה bedeutet wörtlich „fremd“, bezeichnet in diesem Sprüche-Kontext jedoch eine Frau außerhalb der rechtmäßigen sexuellen Bindung. „Verbotene Frau“ vermittelt diese moralische Funktion, ohne sie enger als ausdrücklich „Ehebrecherin“ festzulegen.
- source_word: מִנָּכְרִיָּה
  choice: vor der Fremden
  rationale: נָכְרִיָּה trägt den Sinn „fremd/auswärtig“. „die Fremde“ wahrt die lexikalische Unterscheidung zum ersten Ausdruck und vermeidet zugleich die unnötig ethnische Festlegung „Ausländerin“.
- source_word: אֲמָרֶיהָ
  choice: deren Worte
  rationale: Der Konstruktplural bezeichnet ihre Worte oder Äußerungen; der Relativanschluss ist im Deutschen flüssig und bewahrt den Bezug zum folgenden Verb.
- source_word: הֶחֱלִיקָה
  choice: glatt sind
  rationale: Der Hifil von חלק bedeutet wörtlich „glatt machen“ und bezeichnet bildlich schmeichelnde, verführerische Rede. Die Ergebnisformulierung „deren Worte glatt sind“ erhält das hebräische Bild; die idiomatische Bedeutung wird in der Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Frauenbezeichnungen bleiben unterschieden; eine ausschließlich ethnische Deutung von נָכְרִיָּה wird vermieden. Das Bild der glatten Rede bleibt im Haupttext erhalten und wird in der Fußnote erklärt.
