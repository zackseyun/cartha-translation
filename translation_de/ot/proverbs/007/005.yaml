  source_fidelity: Die Zweckkonstruktion „um dich ... zu bewahren“ gibt לִשְׁמָרְךָ treffend wieder. Die beiden parallelen Bezeichnungen זָרָה und נָכְרִיָּה bleiben unterschieden, ohne die im Sprüchebuch kontextuell mitgemeinte sexuelle bzw. soziale Außenseiterstellung unzulässig auf eine bestimmte Kategorie festzulegen. „Glatte Worte“ bewahrt das Bild von הֶחֱלִיקָה; die Fußnote erläutert den schmeichelnden Sinn und die wörtliche Kausativform angemessen.
