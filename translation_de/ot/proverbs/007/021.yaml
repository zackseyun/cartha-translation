base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/021.yaml
  text: She persuades him with her abundant persuasion[a]; with the smoothness of her lips she compels him.
translation:
  language: de
  text: Sie überredet ihn mit ihrem vielen Zureden; mit der Glätte ihrer Lippen treibt sie ihn weiter[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mit ihrem vielen Zureden bringt sie ihn zum Abweichen; mit der Glätte ihrer Lippen drängt sie ihn weiter.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִטַּתּוּ
  choice: bringt sie ihn dazu, ihr zu folgen
  rationale: Das Hifil von נטה bezeichnet hier, dass sie ihn durch ihre Rede zum Einlenken beziehungsweise Abweichen bringt. Die Formulierung ist im Deutschen natürlich und lässt die im Kontext erkennbare Verführung anklingen, ohne dem Verb ausdrücklich eine sexuelle Bedeutung aufzuerlegen.
- source_word: בְּרֹב לִקְחָהּ
  choice: durch ihre eindringlichen Worte
  rationale: רֹב bezeichnet die Fülle oder große Menge, לֶקַח hier persuasive Rede. Die Wendung gibt das reichliche, nachdrückliche Zureden idiomatisch wieder; die wörtlichere Möglichkeit „durch ihr vieles Zureden“ bleibt in der Fußnote erhalten.
- source_word: בְּחֵלֶק שְׂפָתֶיהָ
  choice: mit ihren schmeichelnden Lippen
  rationale: חֵלֶק bezeichnet in dieser Verbindung die Glätte beziehungsweise Schmeichelei der Rede; שְׂפָתֶיהָ wird als „Lippen“ beibehalten, um das konkrete poetische Bild des Hebräischen zu bewahren.
- source_word: תַּדִּיחֶנּוּ
  choice: treibt sie ihn fort
  rationale: Das Hifil von נדח kann antreiben, forttreiben oder abdrängen bedeuten. „Treibt sie ihn fort“ wahrt die kräftige Bewegungsmetapher und vermeidet, die moralische Deutung „führt ihn in die Irre“ unmittelbar in das Verb einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. „Eindringliche Worte“ ist idiomatischer als das substantivische „vieles Zureden“; die Fußnote bewahrt die formalere Wiedergabe und die mögliche Abweichungsnuance von נטה. Das Lippenbild und die starke Bewegungsmetapher des zweiten Halbverses bleiben erhalten.
