  text: My son[a], keep my words, and treasure up my commandments with you.
translation:
  language: de
  text: Mein Sohn, bewahre meine Worte und hebe meine Gebote bei dir auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verwahre meine Gebote bei dir“ oder „birg meine Gebote bei dir“. Das hebräische Verb kann bedeuten, etwas sorgfältig aufzubewahren oder zum Schutz zu verbergen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die maskuline Singularform mit Suffix der 1. Person Singular ist eine direkte väterliche Anrede; „Mein Sohn“ entspricht Form und literarischem Rahmen.
- source_word: שְׁמֹר
  choice: bewahre
  rationale: Das Verb bezeichnet hier das aufmerksame Festhalten an der Weisheitsunterweisung und lässt sowohl Bewahren als auch Befolgen anklingen.
- source_word: אֲמָרָי
  choice: meine Worte
  rationale: Der Plural bezeichnet die Unterweisungen des Sprechers; „Worte“ ist im Deutschen breit verständlich und quellengetreu.
- source_word: וּמִצְוֺתַי
  choice: und meine Gebote
  rationale: „Gebote“ erhält das verbindliche moralische Gewicht von מִצְוָה, ohne den Ausdruck unnötig zu spezifizieren.
- source_word: תִּצְפֹּן
  choice: hebe … auf
  rationale: צפן kann das sorgfältige Lagern, Verwahren oder Verbergen zum Schutz bezeichnen. „Aufheben“ gibt in diesem Zusammenhang das bewusste Bewahren natürlich wieder.
- source_word: אִתָּךְ
  choice: bei dir
  rationale: Die Wendung bedeutet wörtlich „bei dir“ und lässt offen, ob Nähe, Besitz oder inneres Bewahren im Vordergrund steht.
