  text: דַּרְכֵ֣י שְׁא֣וֹל בֵּיתָ֑/הּ יֹ֝רְד֗וֹת אֶל חַדְרֵי מָֽוֶת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/027.yaml
  text: Her house is the way to Sheol[b][a], going down to the chambers of death.
translation:
  language: de
  text: Ihr Haus sind Wege zum Totenreich[a], die hinabführen in die Kammern des Todes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Scheol, das Reich der Toten; auch „Grab“. Das Hebräische hat „Wege“ im Plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי
  choice: auf Wegen
  rationale: Der hebräische Konstruktplural wird im Deutschen natürlich als „auf Wegen“ wiedergegeben. So bleibt die grammatische Übereinstimmung mit dem femininen Pluralpartizip יֹרְדוֹת erkennbar, ohne den Ausdruck künstlich zu glätten.
- source_word: שְׁאוֹל
  choice: ins Totenreich
  rationale: „Totenreich“ bezeichnet den Bereich der Toten umfassender als „Grab“ und ist für heutige deutschsprachige Leser unmittelbar verständlich. Es vermeidet zugleich die anachronistische Gleichsetzung mit der später ausgeprägten Vorstellung der Hölle.
- source_word: בֵּיתָהּ
  choice: Ihr Haus
  rationale: Das konkrete „Haus“ der Frau ist im Kontext primär; zugleich trägt es die bildhafte Bedeutung des Ortes, den der Verführte betritt.
- source_word: יֹרְדוֹת
  choice: hinab
  rationale: Das feminine Pluralpartizip beschreibt die Wege als hinabführend. Zusammen mit „führt auf Wegen“ gibt „hinab“ sowohl die Richtung als auch die fortlaufende Bewegung idiomatisch wieder.
- source_word: אֶל
  choice: in die
  rationale: Die deutsche Richtungsangabe „hinab in die Kammern“ gibt die Bewegung auf ein räumlich vorgestelltes Ziel natürlich wieder.
- source_word: חַדְרֵי
  choice: die Kammern
  rationale: „Kammern“ bewahrt das poetische Bild innerer Räume und den düsteren, feierlichen Ton besser als das neutralere „Zimmer“.
- source_word: מָוֶת
  choice: des Todes
  rationale: Der gewöhnliche Genitiv bewahrt die verdichtete hebräische Metapher, ohne den Tod ausdrücklich zu personifizieren.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Totenreich
  alternative: Scheol; Grab
  rationale: „Totenreich“ bewahrt die Vorstellung vom Bereich der Toten, ohne sie auf eine Grabstätte zu verengen oder mit einer späteren Höllenlehre gleichzusetzen. „Scheol“ wäre formnäher, erforderte aber für viele Leser eine Erklärung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit poetisch-ernstem Ton. Die ungewöhnliche Pluralform „auf Wegen“ bleibt erhalten, während „führt“ den deutschen Satz idiomatisch zusammenhält. Der Fußnotenmarker steht unmittelbar nach „Totenreich“.
