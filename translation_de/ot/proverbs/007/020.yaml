base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/020.yaml
  text: He took a bag of money in his hand[a]; he will come home at the full moon.
translation:
  language: de
  text: Er hat den Geldbeutel mitgenommen; am Vollmond[a] kommt er nach Hause.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am festgesetzten Tag“. Das hebräische Wort ist schwer zu deuten und wird mitunter auch als „Neumond“ verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְרוֹר הַכֶּסֶף
  choice: Geldbeutel
  rationale: צְרוֹר bezeichnet ein verschnürtes Bündel oder einen Beutel; zusammen mit כֶּסֶף, das hier Geld meint, ist „Geldbeutel“ eine natürliche und präzise Wiedergabe.
- source_word: לָקַח בְּיָדוֹ
  choice: hat … mitgenommen
  rationale: Die wörtliche Wendung „nahm … in seine Hand“ bedeutet im Zusammenhang, dass er den Geldbeutel auf die Reise mitnahm. Die deutsche Formulierung gibt diesen Sinn natürlich wieder.
- source_word: לְיוֹם הַכֵּסֶא
  choice: am Vollmond
  rationale: Die Zeitangabe bezeichnet wahrscheinlich den Vollmond beziehungsweise den entsprechenden Tag im Mondmonat. Da die Bedeutung von כֵּסֶא umstritten ist, werden andere Deutungen in einer Fußnote genannt.
- source_word: יָבֹא בֵיתוֹ
  choice: kommt er nach Hause
  rationale: Die hebräische Formulierung lautet wörtlich „wird er in sein Haus kommen“; „kommt er nach Hause“ entspricht dem natürlichen deutschen Sprachgebrauch und bewahrt den Zukunftsbezug im Kontext.
