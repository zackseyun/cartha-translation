source:
  edition: WLC
  text: כִּ֤י אֵ֣ין הָ/אִ֣ישׁ בְּ/בֵית֑/וֹ הָ֝לַ֗ךְ בְּ/דֶ֣רֶךְ מֵ/רָחֽוֹק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/019.yaml
  text: For the man is not at his house[a]; he has gone on a journey far away.
translation:
  language: de
  text: Denn der Mann ist nicht in seinem Haus[a]; er ist auf eine Reise in die Ferne gegangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Mein Mann ist nicht zu Hause.« Wörtlicher heißt es im Hebräischen: »Der Mann ist nicht in seinem Haus«; damit bezeichnet die Frau ihren Ehemann auf indirekte Weise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die beruhigende Zusicherung der Frau im Kontext ein und bewahrt die kausale Funktion.
- source_word: אֵין
  choice: ist nicht
  rationale: Bezeichnet zusammen mit der Ortsangabe die Abwesenheit des Mannes; diese Wiedergabe ist im Deutschen klar und natürlich.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Bewahrt die indirekte hebräische Bezeichnung. Gemeint ist im Kontext ihr Ehemann, doch diese Deutung wird nicht stillschweigend in den Haupttext eingesetzt.
- source_word: בְּבֵיתוֹ
  choice: in seinem Haus
  rationale: Gibt sowohl die Ortsangabe als auch das Possessivsuffix ausdrücklich wieder, statt sie zu dem idiomatischeren »zu Hause« zu verkürzen.
- source_word: הָלַךְ
  choice: ist … gegangen
  rationale: 'Das deutsche Perfekt bezeichnet eine vollzogene Abreise mit fortdauernder Relevanz: Der Mann bleibt abwesend.'
- source_word: בְּדֶרֶךְ
  choice: auf eine Reise
  rationale: Der Weg-Ausdruck bezeichnet hier idiomatisch das Unterwegssein beziehungsweise eine Reise.
- source_word: מֵרָחוֹק
  choice: in die Ferne
  rationale: Bewahrt die räumliche Vorstellung großer Entfernung, ohne sie lediglich als zeitliche Länge der Reise wiederzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Formulierung »der Mann … in seinem Haus« folgt bewusst der indirekten Ausdrucksweise und dem Possessiv des Hebräischen; die zweite Satzhälfte ist idiomatisch als Reise in große Entfernung formuliert.
