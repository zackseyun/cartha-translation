  text: אַל יֵ֣שְׂטְ אֶל דְּרָכֶ֣י/הָ לִבֶּ֑/ךָ אַל תֵּ֝תַע בִּ/נְתִיבוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/025.yaml
  text: Do not let your heart turn aside to her ways; do not wander into her paths.
translation:
  language: de
  text: Lass dein Herz sich nicht ihren Wegen zuwenden; verirre dich nicht auf ihren Pfaden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל יֵשְׂטְ ... לִבֶּךָ
  choice: Dein Herz soll sich nicht … zuwenden
  rationale: Gibt die verneinte Aufforderung und die innere Hinwendung des Herzens natürlich wieder, ohne den Gedanken auf bloß äußeres Handeln zu verengen.
- source_word: אֶל דְּרָכֶיהָ
  choice: ihren Wegen
  rationale: Bewahrt das Wegbild und den femininen Rückbezug auf die zuvor beschriebene Frau.
- source_word: אַל תֵּתַע
  choice: verirre dich nicht
  rationale: Das Verb תעה bezeichnet ein Umherirren oder Abirren; „verirre dich nicht“ erhält sowohl die räumliche Metapher als auch den warnenden Sinn.
- source_word: בִּנְתִיבוֹתֶיהָ
  choice: auf ihre Pfade
  rationale: „Pfade“ bildet נתיבות konkret und poetisch ab; im Deutschen ist bei einer Bewegung beziehungsweise einem Sichverirren „auf“ idiomatisch.
theological_decisions:
- issue: Verhältnis von innerer Ausrichtung und äußerem Weg
  choice: Die erste Zeile spricht ausdrücklich vom Herzen, die zweite vom Sichverirren auf ihren Pfaden.
  alternative: Beide Teilsätze als rein äußeres Abweichen wiedergeben.
  rationale: Die Bildspannung des Hebräischen zwischen innerer Hinwendung und tatsächlichem Abirren bleibt erhalten, ohne sie theologisch weiter auszudeuten.
translation_notes:
  register: Moderne, würdevolle Weisheitssprache mit parallelem Satzbau. „Pfade“ bewahrt den poetischen Charakter, während „zuwenden“ und „verirre dich nicht“ unmittelbar verständlich bleiben.
