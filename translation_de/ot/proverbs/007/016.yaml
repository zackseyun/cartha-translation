  text: Mein Bett habe ich mit Decken ausgelegt, mit gemusterten Stoffen aus ägyptischem Leinen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit gestreiften Stoffen, Leinen aus Ägypten.“ Die hebräischen Begriffe für die Textilien sind selten und ihre genaue Bedeutung ist unsicher; sie können besonders gemusterte oder kunstvoll bearbeitete Stoffe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבַדִּים
  choice: Decken
  rationale: Das seltene Substantiv bezeichnet hier ausgebreitete, wohl schmückende Bettdecken oder Überwürfe. „Decken“ ist verständlich und vermeidet die irreführende Festlegung auf Fußbodenteppiche.
- source_word: רָבַדְתִּי
  choice: habe ich … bedeckt
  rationale: Das Verb beschreibt das Ausbreiten oder schichtweise Auflegen. Zusammen mit „Decken“ ergibt „bedeckt“ eine natürliche deutsche Formulierung für die bereits getroffene Vorbereitung.
- source_word: עַרְשִׂי
  choice: mein Lager
  rationale: Das Wort kann Bett oder Ruhestatt bezeichnen. „Lager“ wirkt im Deutschen würdevoll und passt zum sinnlich-luxuriösen Zusammenhang, ohne ein Sitzmöbel nahezulegen.
- source_word: חֲטֻבוֹת
  choice: buntem
  rationale: Der seltene Ausdruck wird im Textilzusammenhang wahrscheinlich von bearbeiteten, gemusterten oder farbigen Stoffen gebraucht. „Bunt“ vermittelt den dekorativen Charakter, ohne eine bestimmte Technik wie Stickerei festzuschreiben.
- source_word: אֵטוּן
  choice: Leinen
  rationale: Der seltene Textilbegriff kann feinen Faden, Garn, Leinen oder Stoff bezeichnen. In Verbindung mit dem ägyptischen Ursprung ist „Leinen“ eine traditionelle und kontextuell plausible Wiedergabe; die Unsicherheit wird in der Fußnote kenntlich gemacht.
- source_word: מִצְרָיִם
  choice: ägyptischem
  rationale: Das Herkunftsverhältnis „aus Ägypten“ wird im Deutschen idiomatisch adjektivisch wiedergegeben und weist auf kostbares Importmaterial hin.
