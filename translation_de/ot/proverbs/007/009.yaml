  text: בְּ/נֶֽשֶׁף בְּ/עֶ֥רֶב י֑וֹם בְּ/אִישׁ֥וֹן לַ֝֗יְלָה וַ/אֲפֵלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/009.yaml
  text: at twilight[a], in the evening of the day, in the black of night and darkness.
translation:
  language: de
  text: in der Dämmerung, am Abend des Tages, im tiefsten Dunkel der Nacht[a] und in der Finsternis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in der Pupille der Nacht“; ein hebräisches Bild für die dunkelste Zeit der Nacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶשֶׁף
  choice: Dämmerung
  rationale: Das Wort bezeichnet eine Zeit schwachen Lichts, am Morgen oder Abend. Der Zusammenhang mit Abend und Nacht legt hier die Abenddämmerung nahe; „Dämmerung“ bewahrt zugleich die grundsätzliche Offenheit des Ausdrucks.
- source_word: עֶרֶב יוֹם
  choice: am Abend des Tages
  rationale: Die Wiedergabe beider Substantive erhält die stufenweise zeitliche Verdichtung des Hebräischen, auch wenn die Formulierung im Deutschen bewusst leicht markiert klingt.
- source_word: אִישׁוֹן לַיְלָה
  choice: im tiefsten Dunkel der Nacht
  rationale: אִישׁוֹן bedeutet wörtlich „Pupille“ und bezeichnet in dieser Verbindung bildhaft den dunkelsten Teil der Nacht. Die deutsche Formulierung gibt den Sinn verständlich wieder, ohne das im Deutschen schwer verständliche Bild in den Haupttext zu übernehmen.
- source_word: וַאֲפֵלָה
  choice: Dunkel
  rationale: אֲפֵלָה bezeichnet Dunkelheit oder Finsternis. Zusammen mit אִישׁוֹן לַיְלָה entsteht eine kumulative Beschreibung tiefer nächtlicher Dunkelheit; im Deutschen wird sie zu einer natürlichen, kompakten Wendung verbunden.
- source_word: בְּ ... בְּ ... בְּ
  choice: in ... am ... im ...
  rationale: Die dreifache Präposition markiert aufeinanderfolgende Zeitangaben. Unterschiedliche, idiomatische deutsche Präpositionen bewahren die stufenweise Bewegung in die Nacht, ohne unnatürliche Wiederholung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wendung „am Abend des Tages“ erhält den gestuften Aufbau des hebräischen Verses; die Schlussformulierung ist idiomatisch verdichtet. Der Fußnotenmarker steht unmittelbar nach der betroffenen Wendung.
