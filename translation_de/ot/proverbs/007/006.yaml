lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die begründende bzw. erläuternde Schilderung ein und wahrt den Anschluss an den vorausgehenden Gedankengang.
- source_word: בְּחַלּוֹן בֵּיתִי
  choice: am Fenster meines Hauses
  rationale: Gibt die lokale Bedeutung der Präposition natürlich wieder und entspricht der gewöhnlichen Bedeutung von חַלּוֹן und בַּיִת.
- source_word: בְּעַד
  choice: durch
  rationale: Bezeichnet hier die Blickrichtung durch beziehungsweise hinter einer Öffnung hindurch.
- source_word: אֶשְׁנַבִּי
  choice: mein Gitter
  rationale: Bewahrt das konkrete Bild einer vergitterten beziehungsweise mit einem Gitter versehenen Fensteröffnung und unterscheidet den Ausdruck von חַלּוֹן.
- source_word: נִשְׁקָפְתִּי
  choice: schaute ich hinaus
  rationale: Gibt das Beobachten von einem erhöhten oder geschützten Standort aus wieder, ohne eine stärkere Intensität wie bei „spähen“ einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Zeilengliederung und der Parallelismus zwischen „Fenster“ und „Gitter“ bleiben erhalten; „schaute … hinaus“ ist idiomatisch und nicht unnötig dramatisierend.
