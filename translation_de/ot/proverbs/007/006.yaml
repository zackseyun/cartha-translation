  text: For at the window of my house[a], through my lattice, I looked out,
translation:
  language: de
  text: Denn am Fenster meines Hauses schaute ich durch mein Gitter[a] hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: durch mein Gitterfenster. Das hebräische Wort bezeichnet ein Gitter oder eine vergitterte Fensteröffnung.'
