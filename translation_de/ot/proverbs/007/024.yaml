  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ֝/הַקְשִׁ֗יבוּ לְ/אִמְרֵי פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/024.yaml
  text: And now[a], sons, listen to me, and pay attention to the words of my mouth.
translation:
  language: de
  text: Und nun, ihr Söhne,[a] hört auf mich und achtet auf die Worte meines Mundes!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Kinder“. Im Hebräischen steht „Söhne“, eine maskuline Pluralform, die in der Weisheitsunterweisung als Anrede gebraucht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Verbindung aus Konjunktion und Zeitadverb markiert einen Übergang und leitet eine erneute Mahnung ein; „Und nun“ bewahrt diesen Zusammenhang.
- source_word: בָנִים
  choice: ihr Söhne
  rationale: Das Hebräische hat eine maskuline Pluralform, die in der Weisheitsunterweisung als Anrede der Lernenden dient. Die direkte Anrede wird formgetreu wiedergegeben.
- source_word: שִׁמְעוּ לִי
  choice: hört auf mich
  rationale: שׁמע mit ל bezeichnet aufmerksames Hören auf eine Person. „Hört auf mich“ ist im Deutschen natürlich und bringt zugleich den auffordernden Charakter zum Ausdruck.
- source_word: וְהַקְשִׁיבוּ
  choice: und achtet auf
  rationale: Die Hifil-Form von קשׁב fordert zu besonderer Aufmerksamkeit auf. „Achtet auf“ ist klar, gegenwärtig und passt zur folgenden Präpositionalergänzung.
- source_word: לְאִמְרֵי
  choice: die Worte
  rationale: Der Konstruktplural kann „Worte“, „Aussprüche“ oder „Äußerungen“ bedeuten. In Verbindung mit „meines Mundes“ ist „Worte“ die natürlichste deutsche Entsprechung.
- source_word: פִי
  choice: meines Mundes
  rationale: Die wörtliche Wendung bewahrt das poetische Bild und betont die unmittelbar ausgesprochene Unterweisung.
theological_decisions:
- issue: Geschlechtsspezifische Anrede in der Weisheitsunterweisung
  choice: ihr Söhne
  alternative: ihr Kinder
  rationale: Der Ausgangstext verwendet den maskulinen Plural „Söhne“. Diese Form wird im Haupttext bewahrt, ohne auszuschließen, dass die Weisheitsunterweisung über die unmittelbar Angeredeten hinaus repräsentative Geltung hat.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Aufforderungen und das poetische Bild „Worte meines Mundes“ bleiben erhalten.
