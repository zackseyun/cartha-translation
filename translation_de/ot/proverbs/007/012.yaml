source:
  edition: WLC
  text: פַּ֤עַם בַּ/ח֗וּץ פַּ֥עַם בָּ/רְחֹב֑וֹת וְ/אֵ֖צֶל כָּל פִּנָּ֣ה תֶאֱרֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/012.yaml
  text: In the street[a], now in the squares[b], and beside every corner she lies in wait.
translation:
  language: de
  text: Bald ist sie draußen, bald auf den Plätzen, und an jeder Ecke lauert sie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „liegt sie auf der Lauer“. Das hebräische Verb bezeichnet ein verborgenes, auf einen Überfall gerichtetes Warten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעַם ... פַּעַם
  choice: Bald ... bald
  rationale: Die Wiederholung bezeichnet den Wechsel zwischen Orten. „Bald ... bald“ gibt diese rasche, wechselnde Bewegung im Deutschen natürlich wieder.
- source_word: בַּחוּץ
  choice: draußen
  rationale: חוּץ bezeichnet hier den öffentlichen Bereich außerhalb des Hauses. „Draußen“ bewahrt die räumliche Weite des Ausdrucks, ohne ihn unnötig auf eine einzelne Straße einzuengen.
- source_word: בָּרְחֹבוֹת
  choice: auf den Plätzen
  rationale: רְחֹבוֹת bezeichnet breite, offene öffentliche Flächen einer Stadt; „Plätze“ ist im modernen Deutsch klar und unterscheidet sie von allgemein „draußen“.
- source_word: וְאֵצֶל כָּל פִּנָּה
  choice: und an jeder Ecke
  rationale: אֵצֶל drückt Nähe aus, während פִּנָּה die Ecke bezeichnet. „An jeder Ecke“ ist die natürliche deutsche Ortsangabe.
- source_word: תֶאֱרֹב
  choice: lauert sie
  rationale: ארב bezeichnet heimliches, auf Beute oder einen Angriff gerichtetes Warten. „Lauern“ erhält diese bedrohliche, räuberische Nuance knapp und idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „Bald ... bald“ bildet den Ortswechsel lebendig ab; „lauert“ bewahrt die warnende und bedrohliche Bildsprache des Kontextes.
