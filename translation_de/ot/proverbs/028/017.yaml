  text: אָ֭דָם עָשֻׁ֣ק בְּ/דַם נָפֶשׁ עַד בּ֥וֹר יָ֝נ֗וּס אַל יִתְמְכוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/017.yaml
  text: A man burdened with the blood of a life will flee as far as the pit[b][a]; let no one support him.
translation:
  language: de
  text: Ein Mensch, belastet durch das Blut eines Menschen,[a] flieht bis zur Grube;[b] niemand soll ihm beistehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „bedrückt/belastet durch das Blut eines Lebens“. Gemeint ist die Blutschuld für den Tod eines Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bis zum Grab“. Das hebräische Wort für „Grube“ kann hier auf ein tödliches Ende hinweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: Ein Mensch
  rationale: Das Substantiv bezeichnet hier einen einzelnen Menschen als beispielhaften Fall. „Mensch“ ist im modernen Deutschen natürlich und vermeidet eine unnötige Festlegung auf das Geschlecht.
- source_word: עָשֻׁק
  choice: belastet
  rationale: Das Partizip kann „bedrückt“ oder „unter Druck stehend“ bedeuten. In Verbindung mit Blut bezeichnet es hier die drückende Last beziehungsweise Haftung aufgrund vergossenen Blutes; „belastet“ bewahrt dieses Bild, ohne die Wendung vollständig als „blutschuldig“ auszudeuten.
- source_word: בְּדַם נָפֶשׁ
  choice: mit dem Blut eines anderen
  rationale: Wörtlich steht „mit/durch das Blut eines Lebens/einer Person“. Die Formulierung hält das konkrete Blutbild fest und macht zugleich verständlich, dass es um das Blut eines getöteten Menschen geht.
- source_word: עַד בּוֹר
  choice: bis zur Grube
  rationale: בּוֹר kann eine Grube, Zisterne oder ein Gefängnis bezeichnen und bildlich auf Grab oder tödliches Ende weisen. „Grube“ bewahrt die Mehrdeutigkeit des Bildes.
- source_word: יָנוּס
  choice: flieht
  rationale: Das Verb bezeichnet das Fliehen oder Davonlaufen. Das Präsens entspricht dem sprichwortartigen, allgemeingültigen Charakter des Verses.
- source_word: אַל יִתְמְכוּ בוֹ
  choice: niemand soll ihn unterstützen
  rationale: Der verneinte Jussiv im Plural richtet sich unbestimmt an mögliche Helfer. Die deutsche Formulierung gibt das Verbot idiomatisch wieder und bewahrt den Gedanken des Beistehens oder Aufrechterhaltens.
theological_decisions:
- issue: Bezeichnet die Blutwendung ausdrücklich juristische oder religiöse Blutschuld?
  choice: Das konkrete Bild „mit dem Blut eines anderen belastet“ bleibt im Haupttext erhalten.
  alternative: „mit Blutschuld beladen“ oder „wegen eines Mordes schuldig“
  rationale: Der Zusammenhang legt Schuld am Tod eines Menschen nahe, doch der hebräische Text verwendet das konkrete Bild vom Blut. Die gewählte Fassung wahrt dieses Bild und erklärt die naheliegende Bedeutung in der Fußnote, ohne Einzelheiten wie Mord, Vorsatz oder ein bestimmtes Rechtsverfahren hinzuzufügen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der kurze, mahnende Parallelismus bleibt erhalten; die ungewöhnliche Blutmetapher wird im Haupttext nicht durch eine rein abstrakte Schuldformel ersetzt.
