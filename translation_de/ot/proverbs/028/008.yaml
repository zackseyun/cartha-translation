source:
  edition: WLC
  text: מַרְבֶּ֣ה ה֭וֹנ/וֹ בְּ/נֶ֣שֶׁךְ ו/ב/תרבית לְ/חוֹנֵ֖ן דַּלִּ֣ים יִקְבְּצֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/008.yaml
  text: Whoever increases his wealth by interest and profit gathers it for one who is gracious to the poor[a][b].
translation:
  language: de
  text: Wer sein Vermögen durch Zins und Aufschlag[a] vermehrt, sammelt es für einen, der sich der Armen erbarmt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch Wucherzins und Gewinn«. Die beiden hebräischen Begriffe bezeichnen zusätzlichen Ertrag aus dem Verleihen und können einen ausbeuterischen Beiklang haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der großzügig zu den Armen ist« beziehungsweise »der den Armen Gunst erweist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבֶּה
  choice: vermehrt
  rationale: Das Hifil-Partizip von רבה bezeichnet das Vergrößern oder Vermehren; »vermehrt« gibt die fortgesetzte Anhäufung von Vermögen prägnant wieder.
- source_word: הוֹנוֹ
  choice: sein Vermögen
  rationale: הוֹן bezeichnet Besitz, Reichtum oder Vermögen. »Vermögen« ist im wirtschaftlichen Zusammenhang natürlich und umfasst mehr als Bargeld.
- source_word: בְּנֶשֶׁךְ
  choice: durch Zins
  rationale: נֶשֶׁךְ bezeichnet einen auf ein Darlehen erhobenen Zins und kann wegen seiner Verbindung mit der Wortvorstellung des »Beißens« einen ausbeuterischen Beiklang tragen. »Zins« benennt die Praxis klar; die Fußnote wahrt die mögliche negative Nuance.
- source_word: וּבְתַרְבִּית
  choice: und Aufschlag
  rationale: תַּרְבִּית bezeichnet eine Vermehrung beziehungsweise einen zusätzlich geforderten Betrag, besonders beim Verleihen. »Aufschlag« unterscheidet den Ausdruck vom vorangehenden Zins und hält den Bezug auf zusätzlichen Darlehensgewinn fest.
- source_word: לְחוֹנֵן
  choice: für einen, der sich erbarmt
  rationale: Das Partizip von חנן bedeutet, jemandem Gunst oder Erbarmen zu erweisen. »Sich erbarmen« bewahrt diesen Sinn und passt idiomatisch zur Verbindung mit den Armen.
- source_word: דַּלִּים
  choice: der Armen
  rationale: דַּלִּים kann Arme, Geringe oder Schwache bezeichnen. Der Zusammenhang von Vermögen und Darlehensgewinn legt hier »die Armen« nahe.
- source_word: יִקְבְּצֶנּוּ
  choice: sammelt es
  rationale: קבץ bedeutet sammeln oder zusammentragen; das pronominale Suffix verweist auf das Vermögen zurück. Die Formulierung erhält die Ironie, dass der Vermehrende letztlich für einen anderen sammelt.
theological_decisions: []
