source:
  edition: WLC
  text: בּוֹטֵ֣חַ בְּ֭/לִבּ/וֹ ה֣וּא כְסִ֑יל וְ/הוֹלֵ֥ךְ בְּ֝/חָכְמָ֗ה ה֣וּא יִמָּלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/026.yaml
  text: Whoever trusts in his own heart is a fool[b][a], but he who walks in wisdom will escape.
translation:
  language: de
  text: Wer auf sein eigenes Herz[a] vertraut, ist ein Narr; wer aber in Weisheit seinen Weg geht, wird entkommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Herz“ bezeichnet oft den inneren Menschen und schließt Denken, Urteilsvermögen und Willen ein, nicht nur Gefühle.
    reason: cultural_note
  - marker: b
    text: 'Oder: „wird gerettet werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ
  choice: vertraut
  rationale: Das Partizip von בטח bezeichnet das Setzen von Vertrauen oder Zuversicht auf jemanden oder etwas. „Vertraut“ gibt die Warnung vor Selbstvertrauen natürlich und präzise wieder.
- source_word: בְּלִבּוֹ
  choice: auf sein eigenes Herz
  rationale: לֵב bezeichnet im Hebräischen den inneren Menschen einschließlich Denken, Urteil und Willen. „Eigenes“ verdeutlicht den possessiven und hier selbstbezogenen Sinn, ohne das Bild des Herzens aufzugeben.
- source_word: כְסִיל
  choice: ein Narr
  rationale: כְסִיל ist ein fester Begriff der Weisheitsliteratur für einen Menschen, dessen Torheit sowohl sittliche als auch verstandesmäßige Züge trägt. „Narr“ bewahrt diese weisheitliche Kategorie.
- source_word: וְהוֹלֵךְ בְּחָכְמָה
  choice: wer aber in Weisheit seinen Weg geht
  rationale: הלך bezeichnet hier bildhaft die Lebensführung. Die Formulierung bewahrt das Motiv des Gehens und klingt im modernen Deutschen natürlicher als das wörtliche „in Weisheit geht“.
- source_word: יִמָּלֵט
  choice: wird entkommen
  rationale: Der Niphal von מלט kann „entkommen“ oder „gerettet werden“ bedeuten. „Wird entkommen“ passt zur knappen Spruchform und legt nicht näher fest, wodurch oder durch wen die Rettung geschieht.
- source_word: הוּא ... הוּא
  choice: ist ... wer aber
  rationale: Die ausdrücklichen Pronomen heben im Hebräischen beide gegenübergestellten Personen hervor. Im Deutschen wird dieser Kontrast idiomatisch durch die parallelen Wer-Sätze und „aber“ ausgedrückt.
theological_decisions:
- issue: Bedeutungsumfang von „Herz“
  choice: Das Bild „Herz“ wird beibehalten und durch eine Fußnote erläutert.
  alternative: „auf sich selbst“ oder „auf den eigenen Verstand“
  rationale: Das hebräische „Herz“ umfasst Denken, Urteilen und Wollen, nicht nur Gefühle. Eine interpretierende Ersetzung würde diesen anthropologischen Bedeutungsumfang verengen.
- issue: Bedeutung von יִמָּלֵט
  choice: „wird entkommen“ im Haupttext
  alternative: „wird gerettet werden“
  rationale: Beide Bedeutungen sind sprachlich möglich. Die aktive deutsche Form wahrt die unmittelbare Aussage des Spruchs, während die Fußnote die passive Rettungsnuance offenhält und eine unnötige theologische Festlegung vermeidet.
- issue: Generische maskuline Personenbezeichnung
  choice: „ein Narr“ als generische Bezeichnung innerhalb der geschlechtsübergreifenden Wer-Konstruktion
  alternative: „ein törichter Mensch“
  rationale: כְסִיל ist grammatisch maskulin Singular und eine etablierte Personenkategorie der Weisheitsliteratur. Die Wer-Konstruktion ist im Deutschen allgemein anwendbar; „Narr“ erhält zugleich die Prägnanz des hebräischen Begriffs.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Spruchstil. Das hebräische Weg-Motiv bleibt in einer natürlichen deutschen Form erhalten; unnötig altertümliche Wendungen werden vermieden.
