translation:
  language: de
  text: Wie ein brüllender Löwe und ein heranstürmender Bär ist ein böser Herrscher über ein armes Volk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein hungriger Bär“ beziehungsweise „ein heranstürmender Bär“. Das hebräische Partizip beschreibt eine aggressive Bedrohung und kann entweder die heftige Bewegung oder den räuberischen Hunger hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרִי
  choice: Löwe
  rationale: Die allgemeine Tierbezeichnung wird im Deutschen natürlich mit „Löwe“ wiedergegeben; eine Einschränkung auf einen jungen Löwen ist hier nicht erforderlich.
- source_word: נֹהֵם
  choice: brüllender
  rationale: Das Partizip bezeichnet die bedrohliche Lautäußerung des Löwen; „brüllend“ ist im Deutschen anschaulich und idiomatisch.
- source_word: דֹב
  choice: Bär
  rationale: Die direkte und übliche deutsche Entsprechung.
- source_word: שׁוֹקֵק
  choice: heranstürmender
  rationale: Das Partizip vermittelt eine aggressive, heftige Bewegung. „Heranstürmend“ bewahrt das dynamische Bedrohungsbild; mögliche Deutungen im Sinn räuberischen Hungers werden in der Fußnote genannt.
- source_word: מֹשֵׁל
  choice: Herrscher
  rationale: Das substantivisch gebrauchte Partizip bezeichnet jemanden, der Herrschaft ausübt; „Herrscher“ ist knapp, würdig und kontextgerecht.
- source_word: רָשָׁע
  choice: gottloser
  rationale: „Gottlos“ ist eine geläufige deutsche Wiedergabe des weisheitlichen Moralbegriffs und bezeichnet hier den ethisch schuldhaften Herrscher, ohne das Bild abzuschwächen.
- source_word: עַל
  choice: über
  rationale: Die Präposition bezeichnet im Herrschaftskontext Autorität über ein Volk; die mögliche feindselige Wirkung bleibt durch den Vergleich deutlich.
- source_word: עַם
  choice: Volk
  rationale: Der Ausdruck meint die unter einer Herrschaft stehende Bevölkerung; „Volk“ entspricht dem sozialen und politischen Zusammenhang.
- source_word: דָּל
  choice: armes
  rationale: Das Adjektiv bezeichnet Armut und damit verbundene soziale Schwäche. „Arm“ ist die klare Grundbedeutung und lässt die Verletzlichkeit des Volkes erkennen.
