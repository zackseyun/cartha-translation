  text: נָ֣סוּ וְ/אֵין רֹדֵ֣ף רָשָׁ֑ע וְ֝/צַדִּיקִ֗ים כִּ/כְפִ֥יר יִבְטָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/001.yaml
  text: The wicked flee when no one is pursuing[a], but the righteous are confident like a young lion.
translation:
  language: de
  text: Der Böse flieht, obwohl ihn niemand verfolgt[a]; die Gerechten aber sind kühn wie ein junger Löwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Der Böse flieht, wenn niemand ihn verfolgt; die Gerechten aber sind zuversichtlich wie ein junger Löwe.“ Das Hebräische lässt bei der Verknüpfung des ersten Satzteils und bei יִבְטָח („vertrauen, sicher oder zuversichtlich sein“) mehrere nahe Nuancen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסוּ
  choice: flieht
  rationale: Das Verb נוס bezeichnet das Fliehen. Trotz der hebräischen Perfektform gibt das deutsche Präsens den allgemeingültigen, sprichwörtlichen Sinn natürlich wieder; der generische Singular richtet sich nach רָשָׁע.
- source_word: וְאֵין רֹדֵף
  choice: obwohl ihn niemand verfolgt
  rationale: אֵין mit Partizip stellt fest, dass kein Verfolger da ist. „Obwohl“ macht den paradoxen Gegensatz deutlich, ohne einen tatsächlich Verfolgenden vorauszusetzen.
- source_word: רָשָׁע
  choice: der Böse
  rationale: Das maskuline Singularwort bezeichnet hier sprichwörtlich einen moralischen Typus, keine bestimmte Person. „Der Böse“ bewahrt den generischen Singular und den ethischen Gegensatz zu den Gerechten.
- source_word: וְצַדִּיקִים
  choice: die Gerechten aber
  rationale: Das substantivierte Adjektiv steht im Plural und bezeichnet die Gruppe derer, die gerecht sind. „Aber“ gibt den in וְ liegenden Gegensatz idiomatisch wieder.
- source_word: כִּכְפִיר
  choice: wie ein junger Löwe
  rationale: כְּפִיר bezeichnet spezifischer einen jungen Löwen, nicht nur allgemein einen Löwen. Die Wiedergabe bewahrt dieses Bild, ohne „Löwenjunges“ zu sagen, was hier zu kindlich klänge.
- source_word: יִבְטָח
  choice: sind kühn
  rationale: בטח kann „vertrauen“, „sicher sein“ oder „zuversichtlich sein“ bedeuten. Im Vergleich mit einem jungen Löwen bezeichnet es hier unerschrockene Sicherheit; „kühn“ bildet zugleich den Kontrast zum Fliehen knapp und natürlich ab. Das Deutsche verlangt beim pluralischen Subjekt eine Pluralform.
theological_decisions:
- issue: Moralische Typen im generischen Singular und Plural
  choice: רָשָׁע als „der Böse“ und צַדִּיקִים als „die Gerechten“ wiedergeben
  alternative: „ein gottloser Mensch … gerechte Menschen“ oder „der Schuldige … die Gerechten“
  rationale: Der Spruch stellt moralische Gruppen beziehungsweise Typen gegenüber, nicht bestimmte männliche Einzelpersonen. Die gewählte Form bewahrt den Wechsel vom hebräischen Singular zum Plural, ohne die Aussage auf Männer zu beschränken.
- issue: Bedeutung von בטח im Löwenvergleich
  choice: „sind kühn“
  alternative: „sind zuversichtlich“, „fühlen sich sicher“ oder „vertrauen“
  rationale: Der Kontext beschreibt die furchtlose Haltung der Gerechten, sagt aber nicht ausdrücklich, wem oder worauf sie vertrauen. Daher wird kein theologisches Vertrauensobjekt ergänzt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Das Semikolon wahrt die Zweigliedrigkeit. „Junger Löwe“ erhält die spezifische Bedeutung von כְּפִיר; „kühn“ ist bewusst prägnant, während die Fußnote die semantische Breite offenhält.
