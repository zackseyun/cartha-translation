  text: בְּ/ק֣וּם רְ֭שָׁעִים יִסָּתֵ֣ר אָדָ֑ם וּ֝/בְ/אָבְדָ֗/ם יִרְבּ֥וּ צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/028.yaml
  text: When the wicked rise[a], a man hides himself, but when they perish[b], the righteous increase.
translation:
  language: de
  text: Wenn Gottlose sich erheben, verbirgt sich[a] ein Mensch[b]; doch wenn sie zugrunde gehen, mehren sich die Gerechten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird ein Mensch verborgen“. Die hebräische Verbform kann passiv („wird verborgen“) oder reflexiv beziehungsweise medial („verbirgt sich“) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: „Ein Mensch“ gibt das hebräische adam wieder, das in Sprüchen allgemein für einen Menschen stehen kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקוּם
  choice: wenn ... sich erheben
  rationale: ב mit dem Infinitiv von קום bildet eine temporale Aussage. „Sich erheben“ bewahrt sowohl das Bild des Aufstehens als auch die mögliche gesellschaftliche oder politische Bedeutung, ohne diese ausdrücklich festzulegen.
- source_word: רְשָׁעִים
  choice: Gottlose
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die durch ihr unrechtes beziehungsweise gottloses Handeln gekennzeichnet sind. „Gottlose“ ist in der deutschen Weisheitsliteratur prägnant und etabliert.
- source_word: יִסָּתֵר
  choice: verbirgt sich
  rationale: Der Nifal von סתר kann passiv oder medial/reflexiv verstanden werden. Im Zusammenhang ist die reflexive Wiedergabe natürlich; die echte grammatische Alternative bleibt in einer Fußnote erhalten.
- source_word: אָדָם
  choice: ein Mensch
  rationale: אָדָם bezeichnet hier im allgemeinen sprichwörtlichen Sinn einen einzelnen Menschen. „Ein Mensch“ erhält den Singular und vermeidet eine unnötige geschlechtliche Festlegung.
- source_word: וּבְאָבְדָם
  choice: doch wenn sie zugrunde gehen
  rationale: וּ plus ב mit Infinitiv und Suffix bildet die parallele temporale Aussage. „Doch“ bringt den Gegensatz der beiden Vershälften zum Ausdruck; „zugrunde gehen“ gibt אבד wieder, ohne zwingend nur den Tod zu bezeichnen.
- source_word: יִרְבּוּ
  choice: mehren sich
  rationale: רבה bezeichnet das Zahlreicherwerden oder zunehmende Hervortreten. „Mehren sich“ ist knapp und lässt offen, ob vor allem zahlenmäßiges Wachstum oder größere öffentliche Präsenz gemeint ist.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Das substantivierte Pluraladjektiv bezeichnet Menschen, die durch Gerechtigkeit gekennzeichnet sind. „Die Gerechten“ entspricht dem üblichen Sprachgebrauch der Weisheitsliteratur.
