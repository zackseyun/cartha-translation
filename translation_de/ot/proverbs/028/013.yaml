  text: מְכַסֶּ֣ה פְ֭שָׁעָי/ו לֹ֣א יַצְלִ֑יחַ וּ/מוֹדֶ֖ה וְ/עֹזֵ֣ב יְרֻחָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/013.yaml
  text: Whoever covers his transgressions will not prosper[b][a], but he who confesses and forsakes them will be shown mercy.
translation:
  language: de
  text: Wer seine Verfehlungen zudeckt[a], wird keinen Erfolg haben; wer sie aber bekennt und von ihnen ablässt, dem wird Erbarmen zuteil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verbirgt“ beziehungsweise „verheimlicht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird Erbarmen finden“. Das Hebräische verwendet eine Passivform und nennt den Handelnden nicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: zudeckt
  rationale: Das Partizip von כסה bezeichnet ein Bedecken beziehungsweise Verbergen. „Zudeckt“ bewahrt das konkrete Bild und lässt zugleich den moralischen Sinn des Verheimlichens erkennen.
- source_word: פְשָׁעָיו
  choice: seine Verfehlungen
  rationale: פשע bezeichnet schuldhafte Übertretungen und kann auch den Aspekt der Auflehnung tragen. „Verfehlungen“ ist im modernen Deutschen verständlich und stärker als bloße „Fehler“, ohne den Ausdruck auf einen bestimmten juristischen oder konfessionellen Begriff festzulegen.
- source_word: יַצְלִיחַ
  choice: wird keinen Erfolg haben
  rationale: Das Hifil von צלח bezeichnet Gelingen oder Erfolg. Diese Wiedergabe ist natürlich und wahrt die allgemeine Aussage des Weisheitsspruchs, ohne sie auf materiellen Wohlstand zu verengen.
- source_word: וּמוֹדֶה
  choice: bekennt
  rationale: ידה kann in diesem Zusammenhang das Eingestehen beziehungsweise Bekennen von Schuld bezeichnen. Zusammen mit dem Verlassen der Verfehlungen ist „bekennt“ die prägnanteste Wiedergabe.
- source_word: וְעֹזֵב
  choice: lässt
  rationale: עזב bedeutet verlassen oder aufgeben. „Sie lässt“ ist hier knapp und idiomatisch und beschreibt, dass jemand an den bekannten Verfehlungen nicht festhält.
- source_word: יְרֻחָם
  choice: dem wird Erbarmen zuteil
  rationale: Die passive Form von רחם besagt, dass jemand Erbarmen beziehungsweise Mitgefühl erfährt. Die Formulierung erhält das Passiv und nennt keinen Handelnden, da auch der hebräische Text ihn nicht ausdrücklich nennt.
- source_word: implicit object after וּמוֹדֶה וְעֹזֵב
  choice: sie
  rationale: Das im Hebräischen ausgelassene Objekt wird aus „seine Verfehlungen“ ergänzt. Das Pronomen ist im Deutschen für eine natürliche und eindeutige Formulierung erforderlich.
- source_word: masculine singular participles/pronouns
  choice: Wer ... seine ... wer ... dem
  rationale: Die generischen maskulinen Singularformen werden durch die im Deutschen natürliche Wer-Konstruktion wiedergegeben. Sie hält den Singular fest, ohne ein zusätzliches Geschlecht ausdrücklich einzutragen.
theological_decisions:
- issue: Der Handelnde beim Erweisen des Erbarmens bleibt im Passiv unausgesprochen
  choice: dem wird Erbarmen zuteil
  alternative: Gott wird sich seiner erbarmen; er wird Erbarmen finden
  rationale: Der Zusammenhang legt Gottes Erbarmen nahe, doch יְרֻחָם nennt den Handelnden nicht. Das unpersönliche Passiv bewahrt diese Offenheit und macht Gott nicht gegen den Wortlaut ausdrücklich zum Subjekt.
translation_notes:
  register: Moderner, würdevoller Standardstil mit der knappen Parallelstruktur eines Weisheitsspruchs. „Erbarmen zuteilwerden“ ist leicht gehoben, aber allgemein verständlich und ermöglicht es, das hebräische Passiv ohne ausdrückliche Nennung des Handelnden zu bewahren.
