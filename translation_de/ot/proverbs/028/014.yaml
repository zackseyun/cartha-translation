  text: אַשְׁרֵ֣י אָ֭דָם מְפַחֵ֣ד תָּמִ֑יד וּ/מַקְשֶׁ֥ה לִ֝בּ֗/וֹ יִפּ֥וֹל בְּ/רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/014.yaml
  text: Blessed is the man who is always fearful[b][a], but whoever hardens his heart will fall into calamity.
translation:
  language: de
  text: Glücklich ist der Mensch, der sich beständig fürchtet[a]; wer aber sein Herz verhärtet, wird ins Unglück fallen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sich allezeit fürchtet“. Im Hebräischen wird nicht ausdrücklich gesagt, wen oder was er fürchtet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird ins Unheil/Böse fallen“. Das hebräische Wort kann Böses, Unheil, Not oder Unglück bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die hebräische Glückpreisungsform bezeichnet einen beneidenswerten, gesegneten Zustand. „Glücklich ist“ ist im modernen Deutschen natürlich und bewahrt den weisheitlichen Charakter.
- source_word: אָדָם
  choice: der Mensch
  rationale: אָדָם bezeichnet hier in einem allgemein gültigen Weisheitsspruch den Menschen. Das deutsche „der Mensch“ wahrt Singular und generischen Sinn ohne unnötige geschlechtliche Verengung.
- source_word: מְפַחֵד תָּמִיד
  choice: der sich beständig fürchtet
  rationale: פחד bezeichnet Furcht oder Sichfürchten, und תָּמִיד deren fortwährenden Charakter. Die Formulierung lässt das im Hebräischen nicht genannte Objekt bewusst offen und paraphrasiert die Furcht nicht vorschnell als Vorsicht.
- source_word: וּמַקְשֶׁה לִבּוֹ
  choice: wer aber sein Herz verhärtet
  rationale: Der Hifil von קשה mit לֵב als Objekt beschreibt ein willentliches Hart- oder Unnachgiebigwerden. „Sein Herz verhärten“ ist im Deutschen transparent und idiomatisch.
- source_word: יִפּוֹל
  choice: wird … fallen
  rationale: Das Imperfekt drückt hier die sprichwörtliche Folge aus. Die Zukunftsform gibt diesen Konsequenzcharakter natürlich wieder.
- source_word: בְּרָעָה
  choice: ins Unglück
  rationale: רָעָה kann Böses, Unheil, Not oder Unglück bezeichnen. Im Zusammenhang ist wahrscheinlich das verderbliche Unheil gemeint, in das der Hartherzige gerät; „ins Unglück fallen“ ist zugleich idiomatisches Deutsch.
theological_decisions:
- issue: Gegenstand und Art der lobenswerten Furcht
  choice: Die Furcht wird lexikalisch wiedergegeben, ohne einen Gegenstand zu ergänzen.
  alternative: „der den HERRN beständig fürchtet“ oder „der stets vorsichtig ist“
  rationale: Der hebräische Text nennt kein Objekt. „Den HERRN“ wäre theologisch naheliegend, aber eine Ergänzung; „vorsichtig“ würde die Kraft von פחד abschwächen. Die offene Formulierung bewahrt die Mehrdeutigkeit zwischen ehrfürchtiger, moralischer Wachsamkeit und allgemeiner Furcht.
- issue: Bedeutung von רָעָה als Folge der Herzensverhärtung
  choice: Als widerfahrendes Unglück beziehungsweise Unheil verstanden.
  alternative: 'Als moralisch Böses verstanden: „wird ins Böse fallen“'
  rationale: Die Konstruktion נפל ב־ und der antithetische Zusammenhang sprechen hier eher für eine verhängnisvolle Folge als für das Begehen des Bösen; die weitere Bedeutungsbreite bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Parallelstruktur. „Glücklich ist“ klingt gegenwärtiger als „Wohl dem“, während „sein Herz verhärten“ die vertraute und quellennah formulierte Bildsprache bewahrt.
