source:
  edition: WLC
  text: מֵסִ֣יר אָ֭זְנ/וֹ מִ/שְּׁמֹ֣עַ תּוֹרָ֑ה גַּֽם תְּ֝פִלָּת֗/וֹ תּוֹעֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/009.yaml
  text: Whoever turns his ear away from hearing the law—even his prayer is an abomination[a].
translation:
  language: de
  text: Wer sein Ohr davor verschließt, auf die Weisung[a] zu hören – selbst sein Gebet ist ein Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gesetz“ oder „Lehre“. Das hebräische Wort Tora bezeichnet verbindliche Weisung und kann hier mehr umfassen als einzelne Rechtsvorschriften.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: abwendet
  rationale: Das Hifil-Partizip beschreibt ein charakteristisches, willentliches Abwenden. Die allgemeine Aussage wird im Deutschen natürlich mit „wer … abwendet“ wiedergegeben.
- source_word: אָזְנוֹ
  choice: sein Ohr
  rationale: Die konkrete Körpermetapher des Hebräischen bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: מִשְּׁמֹעַ
  choice: auf … zu hören
  rationale: Die Präposition mit Infinitiv bezeichnet das Hören, von dem sich jemand abwendet. „Auf … hören“ gibt dabei sowohl Wahrnehmen als auch Beachten idiomatisch wieder.
- source_word: תּוֹרָה
  choice: Weisung
  rationale: תּוֹרָה bezeichnet hier autoritative Unterweisung und kann über einzelne Rechtsvorschriften hinausreichen. „Weisung“ bewahrt sowohl den verbindlichen als auch den lehrenden Sinn; „Gesetz“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: גַּם
  choice: selbst
  rationale: 'גַּם verstärkt die überraschende Folgerung: Nicht nur die Verweigerung ist verwerflich, sondern selbst das Gebet eines solchen Menschen.'
- source_word: תְּפִלָּתוֹ
  choice: sein Gebet
  rationale: Dies ist die direkte und kontextgemäße Bedeutung des Substantivs.
- source_word: תּוֹעֵבָה
  choice: ein Gräuel
  rationale: „Gräuel“ bewahrt die starke moralisch-religiöse Wertung des hebräischen Ausdrucks und dessen geläufige biblische Prägung.
theological_decisions:
- issue: Bedeutungsumfang von תּוֹרָה im Weisheitskontext
  choice: „Weisung“ als Gottes verbindliche Unterweisung
  alternative: „Gesetz“ oder „Lehre“
  rationale: Der Vers verurteilt die Weigerung, autoritative Unterweisung anzuhören. „Weisung“ vermeidet eine unbegründete Verengung auf einzelne Gesetzesvorschriften, ohne den verpflichtenden Charakter abzuschwächen; die Alternativen werden offengelegt.
- issue: Bezug von תּוֹעֵבָה
  choice: Das Gebet desjenigen, der die Weisung zurückweist, wird ausdrücklich als Gräuel bezeichnet
  alternative: Eine abgeschwächte Wiedergabe wie „ist verwerflich“
  rationale: Der starke Ausgangstext soll weder abgeschwächt noch durch eine Erklärung darüber ergänzt werden, unter welchen weiteren Umständen das Gebet beurteilt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ohr-Metapher und die zugespitzte Parallelstruktur des hebräischen Spruchs bleiben erhalten; der Gedankenstrich markiert die nachdrückliche Folgerung.
