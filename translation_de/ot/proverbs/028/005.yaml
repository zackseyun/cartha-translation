source:
  edition: WLC
  text: אַנְשֵׁי רָ֭ע לֹא יָבִ֣ינוּ מִשְׁפָּ֑ט וּ/מְבַקְשֵׁ֥י יְ֝הוָ֗ה יָבִ֥ינוּ כֹֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/005.yaml
  text: Evil men do not understand justice[a], but those who seek Yahweh understand all things.
translation:
  language: de
  text: Böse Menschen verstehen das Recht nicht; doch diejenigen, die Jahwe suchen, verstehen alles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Zusammenhang ist umfassendes sittliches Urteilsvermögen gemeint, besonders in Fragen des Rechts; nicht unbegrenztes Wissen über alles.
    reason: Erläuterung des kontextuellen Umfangs von כֹל („alles“), ohne die umfassende Formulierung im Haupttext abzuschwächen.
lexical_decisions:
- source_word: אַנְשֵׁי רָע
  choice: Böse Menschen
  rationale: Die hebräische Genitivverbindung bedeutet wörtlich „Menschen des Bösen“. „Böse Menschen“ ist im heutigen Deutsch natürlich und gibt die ethische Charakterisierung prägnant wieder.
- source_word: יָבִינוּ
  choice: verstehen
  rationale: בין bezeichnet Verstehen und Unterscheidungsvermögen. „Verstehen“ passt in beiden Vershälften und bewahrt ihre sprachliche Entsprechung.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: מִשְׁפָּט bezeichnet hier die gerechte Ordnung beziehungsweise das, was recht ist, nicht nur einen einzelnen Urteilsspruch. „Das Recht“ bewahrt den substantivischen Ausdruck und den ethischen Bezug.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: die, die Jahwe suchen
  rationale: Das Partizip bezeichnet Menschen, die dadurch gekennzeichnet sind, dass sie Jahwe suchen. Die Formulierung ist natürlich und lässt den fortdauernden Charakter erkennen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כֹל
  choice: alles
  rationale: Das absolut gebrauchte כֹל heißt schlicht „alles“. Die uneingeschränkte Formulierung des Spruchs bleibt im Haupttext erhalten; der Zusammenhang legt umfassendes sittliches Urteilsvermögen nahe.
theological_decisions:
- issue: Reichweite von „verstehen alles“
  choice: Die umfassende Formulierung bleibt stehen und wird im Zusammenhang als weitreichendes sittliches Urteilsvermögen erläutert.
  alternative: Wörtliche Allwissenheit oder eine im Haupttext ausdrücklich auf moralische Fragen begrenzte Aussage.
  rationale: Der Parallelismus stellt das fehlende Verständnis für das Recht dem umfassenden Verständnis derer gegenüber, die Jahwe suchen. „Alles“ bewahrt die Spannung und Kraft der Weisheitsaussage, ohne daraus eine Lehre menschlicher Allwissenheit abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Parallelstruktur. Das Semikolon bildet die beiden gegensätzlichen Vershälften ab; „doch“ markiert den Kontrast. Der Gottesname erscheint als „Jahwe“.
