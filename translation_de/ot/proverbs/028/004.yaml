source:
  edition: WLC
  text: עֹזְבֵ֣י ת֭וֹרָה יְהַֽלְל֣וּ רָשָׁ֑ע וְ/שֹׁמְרֵ֥י ת֝וֹרָ֗ה יִתְגָּ֥רוּ בָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/004.yaml
  text: Those who forsake the law praise the wicked[b][a], but those who keep the law contend with them.
translation:
  language: de
  text: Wer sich von der Weisung[a] abwendet, lobt den Frevler; wer aber an der Weisung festhält, tritt ihnen entgegen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unterweisung“ oder „Lehre“. Das hebräische Wort kann besonders in Weisheitstexten verbindliche moralische Unterweisung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „legt sich mit ihnen an“ beziehungsweise „kämpft gegen sie“. Das hebräische Verb bezeichnet ein entschiedenes Eintreten in eine Auseinandersetzung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹזְבֵי
  choice: wer sich … abwendet
  rationale: Das qalische Partizip bezeichnet Menschen, die etwas verlassen oder aufgeben. „Sich von … abwenden“ gibt die bewusste moralische Abkehr im heutigen Deutsch natürlich wieder.
- source_word: תּוֹרָה
  choice: Weisung
  rationale: תּוֹרָה bezeichnet hier autoritative Unterweisung. „Weisung“ bewahrt im Weisheitskontext die Breite von Lehre und verbindlicher Anweisung, ohne den Ausdruck vorschnell auf ein Gesetzeskorpus zu verengen.
- source_word: יְהַלְלוּ
  choice: lobt
  rationale: Das Piel von הלל bedeutet hier „loben“ oder „rühmen“. „Lobt“ ist unmittelbar verständlich und erhält die zugespitzte Aussage, dass Abkehr von der Weisung zur Billigung des Frevlers führt.
- source_word: רָשָׁע
  choice: den Frevler
  rationale: Das substantivierte maskuline Singularwort bezeichnet einen repräsentativen gottlosen oder schuldigen Menschen. „Den Frevler“ wahrt den sprichwörtlich-generischen Singular und den moralischen Ernst.
- source_word: שֹׁמְרֵי
  choice: wer … festhält
  rationale: שמר kann bewahren, beachten oder einhalten bedeuten. „An der Weisung festhalten“ bildet einen klaren Gegensatz zur Abwendung und schließt sowohl Treue als auch Befolgung ein.
- source_word: יִתְגָּרוּ
  choice: tritt … entgegen
  rationale: Das Hitpael von גרה bezeichnet ein Sich-Einlassen auf Auseinandersetzung oder Widerstand. „Entgegentreten“ ist im Deutschen lebendig und adversativ, ohne körperliche Gewalt einzutragen.
- source_word: בָם
  choice: ihnen
  rationale: Die Präposition ב bezeichnet mit diesem Verb die Personen, gegen die sich die Auseinandersetzung richtet. „Ihnen entgegentreten“ ist idiomatisch und bewahrt den pluralischen Rückverweis.
theological_decisions:
- issue: Bezugswort des pluralischen „ihnen“ im zweiten Halbvers
  choice: Der pluralische Rückverweis bleibt offen und bezieht sich auf die im ersten Halbvers bezeichnete Gruppe der Frevler beziehungsweise der von der Weisung Abgewandten.
  alternative: Das Pronomen ausschließlich auf den singularisch genannten „Frevler“ oder ausschließlich auf diejenigen beziehen, die die Weisung verlassen.
  rationale: Das Hebräische wechselt von dem repräsentativen Singular רָשָׁע zu einem pluralischen Pronomen. Die Übersetzung erhält diesen kompakten Wechsel, statt ein einzelnes Bezugsverständnis festzuschreiben.
translation_notes:
  register: Modernes, knappes und würdiges Sprichwortdeutsch. Die paarige „wer … wer aber“-Struktur bildet die beiden hebräischen Partizipgruppen idiomatisch ab. „Weisung“ wird gegenüber „Gesetz“ bevorzugt, um die im Weisheitskontext echte Bedeutungsbreite von תּוֹרָה zu erhalten.
