    rationale: Das Hebräische sagt wörtlich „ein Mann bösen Auges“. „Blick“ bezeichnet im Deutschen vor allem den konkreten Ausdruck oder die Blickrichtung und verwischt die idiomatische Charakterbeschreibung (besonders Geiz bzw. Missgunst).
  - severity: low
    issue: Unvollständige Alternativformulierung in der Fußnote
    rationale: „Ein geiziger“ ist ohne Substantiv elliptisch und in einer erklärenden Fußnote unnötig holprig.
