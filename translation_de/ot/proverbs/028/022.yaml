  yaml_path: translation/ot/proverbs/028/022.yaml
  text: A man with an evil eye hastens after wealth[a], and does not know that poverty will come upon him.
translation:
  language: de
  text: Ein Mann mit bösem Auge hastet dem Reichtum nach[a] und weiß nicht, dass Mangel über ihn kommen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein geiziger“ beziehungsweise „habgieriger Mann“; wörtlich: „ein Mann mit bösem Auge“. Die hebräische Wendung bezeichnet eine selbstsüchtige, missgünstige Haltung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבֳהָל לַהוֹן
  choice: hastet dem Reichtum nach
  rationale: Das Nifal-Partizip von בהל bezeichnet einen hastigen, überstürzten Zustand oder ein entsprechendes Handeln; לַהוֹן gibt das Ziel dieses Strebens an. Die Formulierung bewahrt sowohl die Eile als auch die Ausrichtung auf Reichtum.
- source_word: אִישׁ
  choice: Ein Mann
  rationale: Das hebräische Substantiv steht im maskulinen Singular. Die Wiedergabe wahrt die konkrete Form und den knappen Spruchstil.
- source_word: רַע עָיִן
  choice: mit bösem Blick
  rationale: Wörtlich liegt eine idiomatische Verbindung aus ‚böse‘ und ‚Auge‘ vor. Sie bezeichnet eine missgünstige, geizige oder habgierige Haltung. Die bildhafte Wendung bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
- source_word: וְלֹא יֵדַע
  choice: und weiß nicht
  rationale: Die schlichte Koordination des Hebräischen bleibt gewahrt; das Imperfekt beschreibt hier sein fehlendes Erkennen der kommenden Folge.
- source_word: חֶסֶר
  choice: Mangel
  rationale: חֶסֶר bezeichnet Mangel, Entbehrung oder Bedürftigkeit. ‚Mangel‘ bleibt näher am lexikalischen Umfang als das enger wirtschaftlich gefasste ‚Armut‘.
- source_word: יְבֹאֶנּוּ
  choice: über ihn kommen wird
  rationale: Das Verb בוא mit Objektsuffix beschreibt, dass der Mangel ihn erreicht. Die deutsche Wendung gibt den warnenden Ton natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Syntax. Das hebräische Bild vom bösen Auge wird bewahrt, aber im Deutschen als „böser Blick“ leicht idiomatisiert; eine Fußnote erklärt seine Bedeutungsbreite.
