source:
  edition: WLC
  text: עֹבֵ֣ד אַ֭דְמָת/וֹ יִֽשְׂבַּֽע לָ֑חֶם וּ/מְרַדֵּ֥ף רֵ֝קִ֗ים יִֽשְׂבַּֽע רִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/019.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues worthless things will have his fill of poverty.
translation:
  language: de
  text: Wer seinen Acker bearbeitet, wird genug Brot haben; wer aber wertlosen Dingen[a] nachjagt, wird genug Armut haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „leeren Dingen“. Das Hebräische kann auch leere oder nichtsnutzige Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵד
  choice: bearbeitet
  rationale: Das Partizip bezeichnet hier beständige Arbeit am eigenen Boden. „Bearbeitet“ ist natürlich, landwirtschaftlich passend und weniger eng als „pflügt“.
- source_word: אַדְמָתוֹ
  choice: seinen Acker
  rationale: אֲדָמָה bezeichnet Boden oder Land. Im Zusammenhang landwirtschaftlicher Arbeit gibt „Acker“ das konkrete Bild im Deutschen klar und idiomatisch wieder.
- source_word: יִשְׂבַּע לָחֶם
  choice: wird sich an Brot satt essen
  rationale: Die Formulierung bewahrt sowohl das konkrete Bild des Brotes als auch die Bedeutung von שׂבע („satt werden“) und ermöglicht die ironische Wiederholung in der zweiten Vershälfte.
- source_word: וּמְרַדֵּף
  choice: wer aber … nachjagt
  rationale: Das Waw trägt im antithetischen Parallelismus kontrastierende Kraft. „Nachjagt“ bildet das aktive, anhaltende Verfolgen anschaulich ab.
- source_word: רֵקִים
  choice: leeren Dingen
  rationale: רֵקִים ist formal mehrdeutig und kann leere, nichtige oder wertlose Dinge beziehungsweise Personen bezeichnen. „Leeren Dingen“ wahrt diese Bildlichkeit und vermeidet eine unnötig eindeutige Auslegung; die mögliche personale Lesart steht in der Fußnote.
- source_word: יִשְׂבַּע רִישׁ
  choice: wird sich an Armut satt essen
  rationale: Die Wiederholung von שׂבע wird bewusst parallel wiedergegeben. Die ungewöhnliche, ironische Wendung bewahrt die prägnante Spannung des hebräischen Spruchs.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchton. Der parallele Satzbau und die ironische Wiederholung von „satt essen“ werden erhalten. Das Semikolon macht den Gegensatz der beiden Vershälften sichtbar.
