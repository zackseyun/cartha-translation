id: PRO.28.16
reference: Proverbs 28:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נָגִ֗יד חֲסַ֣ר תְּ֭בוּנוֹת וְ/רַ֥ב מַעֲשַׁקּ֑וֹת שנאי בֶ֝֗צַע יַאֲרִ֥יךְ יָמִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/016.yaml
  text: A ruler lacking understanding is great in acts of oppression[b][a], but one who hates unjust gain will prolong his days.
translation:
  language: de
  text: Ein Herrscher, dem es an Einsicht fehlt, verübt viel Unterdrückung[a]; wer aber unrechtmäßigen Gewinn[b] hasst, wird lange leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »ist groß an Unterdrückungen«; auch möglich: »verübt viel Erpressung«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »habgierigen Gewinn« oder »unredlich erworbenen Gewinn«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָגִיד
  choice: Herrscher
  rationale: Das Wort bezeichnet eine Person in leitender oder herrschender Stellung. »Herrscher« ist im Deutschen allgemein genug und vermeidet die engere monarchische Bedeutung von »Fürst«.
- source_word: חֲסַר תְּבוּנוֹת
  choice: dem es an Einsicht fehlt
  rationale: Die Wendung bezeichnet einen Mangel an Urteilsvermögen und verständiger Einsicht. Die Relativkonstruktion ist natürliches modernes Deutsch und bewahrt den Sinn der Weisheitssprache.
- source_word: וְרַב מַעֲשַׁקּוֹת
  choice: verübt viel Unterdrückung
  rationale: Wörtlich steht etwa »und groß/reich an Unterdrückungen«. Die verbale Wiedergabe macht die wiederholte unterdrückerische Handlungsweise im Deutschen verständlich, ohne sie auf Erpressung im engeren Sinn festzulegen.
- source_word: שׂנֵא בֶצַע
  choice: wer aber unrechtmäßigen Gewinn hasst
  rationale: בֶצַע bezeichnet Gewinn mit einer moralisch anstößigen, habgierigen oder unrechtmäßig erworbenen Färbung. »Unrechtmäßiger Gewinn« bringt diese Wertung klar zum Ausdruck; das Partizip wird als allgemeine Personenbezeichnung wiedergegeben.
- source_word: יַאֲרִיךְ יָמִים
  choice: wird lange leben
  rationale: Die hebräische Wendung bedeutet wörtlich »wird Tage verlängern« und ist ein festes Idiom für ein langes Leben. Die deutsche Wiedergabe vermittelt den Sinn natürlich und eindeutig.
theological_decisions:
- issue: Art des Zusammenhangs zwischen den beiden Vershälften
  choice: Kontrast durch »aber«
  alternative: bloße Reihung mit »und«
  rationale: Die hebräische Gegenüberstellung kontrastiert den uneinsichtigen, unterdrückenden Herrscher mit demjenigen, der unrechten Gewinn hasst. »Aber« macht diesen im Spruch angelegten Gegensatz deutlich, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Halbvers wird zur besseren Verständlichkeit verbal formuliert; der zweite gibt das hebräische Idiom für langes Leben idiomatisch wieder. Die beiden Fußnoten bewahren die wichtigsten lexikalischen Alternativen.
