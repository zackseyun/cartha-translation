source:
  edition: WLC
  text: נוֹתֵ֣ן לָ֭/רָשׁ אֵ֣ין מַחְס֑וֹר וּ/מַעְלִ֥ים עֵ֝ינָ֗י/ו רַב מְאֵרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/027.yaml
  text: Whoever gives to the poor will have no lack[a], but he who hides his eyes will have many curses.
translation:
  language: de
  text: Wer dem Armen gibt, wird keinen Mangel haben; wer aber seine Augen verschließt[a], auf den kommen viele Flüche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Augen verbirgt« / »seinen Blick abwendet« – ein Bild für das absichtliche Ignorieren des Armen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹתֵן
  choice: Wer … gibt
  rationale: Das qalische Partizip hat in diesem Spruch allgemeingültige, sprichwörtliche Kraft. Die deutsche Wer-Konstruktion gibt dies natürlich wieder.
- source_word: לָרָשׁ
  choice: dem Armen
  rationale: רָשׁ bezeichnet einen armen oder mittellosen Menschen. Der generische Singular des Hebräischen bleibt im Deutschen erhalten.
- source_word: אֵין מַחְסוֹר
  choice: wird keinen Mangel haben
  rationale: Die verneinte Existenzformel bezeichnet das Ausbleiben von Mangel. Die Zukunftsform bringt die sprichwörtliche Folge zum Ausdruck, ohne die Art der Versorgung näher festzulegen.
- source_word: וּמַעְלִים עֵינָיו
  choice: wer aber seine Augen verschließt
  rationale: Das Hifil-Partizip von עלם mit »Augen« zeichnet bildhaft das absichtliche Wegsehen beziehungsweise Ignorieren eines Bedürftigen. »Seine Augen verschließt« bewahrt das Bild und ist im Deutschen idiomatisch verständlich.
- source_word: רַב מְאֵרוֹת
  choice: auf den kommen viele Flüche
  rationale: Die hebräische verblosen Wendung lautet knapp »viele Flüche«. Die gewählte Ergänzung formuliert die daraus folgende Betroffenheit idiomatisch, ohne ein ausdrücklich im Hebräischen nicht vorhandenes Verb wie »empfangen« einzusetzen.
theological_decisions: []
