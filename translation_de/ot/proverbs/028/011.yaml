  text: חָכָ֣ם בְּ֭/עֵינָי/ו אִ֣ישׁ עָשִׁ֑יר וְ/דַ֖ל מֵבִ֣ין יַחְקְרֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/011.yaml
  text: A rich man is wise in his own eyes[a], but a poor man who has understanding searches him out.
translation:
  language: de
  text: Ein reicher Mann ist in seinen eigenen Augen weise, doch ein armer, verständiger Mann erforscht ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »untersucht ihn genau«, »spürt ihn aus« oder »durchschaut ihn«. Das hebräische Verb kann ein gründliches Suchen, Untersuchen oder Ergründen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם בְּעֵינָיו
  choice: hält sich selbst für weise
  rationale: Die hebräische Wendung bedeutet wörtlich »weise in seinen eigenen Augen« und bezeichnet die eigene, hier offenkundig fragwürdige Selbsteinschätzung. Die idiomatische deutsche Formulierung gibt diesen Sinn natürlich wieder.
- source_word: אִישׁ עָשִׁיר
  choice: ein reicher Mann
  rationale: Die Verbindung aus Substantiv und Adjektiv bezeichnet direkt einen reichen Mann; Numerus und grammatisches Geschlecht bleiben erhalten.
- source_word: וְדַל
  choice: doch ein armer Mann
  rationale: Das Waw verbindet die beiden Spruchhälften kontrastiv. »Doch« macht diesen Gegensatz im Deutschen deutlich; דַל bezeichnet hier einen Menschen mit geringen Mitteln.
- source_word: מֵבִין
  choice: mit Verstand
  rationale: Das Partizip von בין bezeichnet einen verständigen, urteilsfähigen Menschen. »Mit Verstand« ist knapp, natürlich und erhält die attributive Funktion.
- source_word: יַחְקְרֶנּוּ
  choice: durchschaut ihn
  rationale: חקר kann suchen, erforschen oder genau prüfen bedeuten. Im Zusammenhang bezeichnet es wahrscheinlich das prüfende Eindringen hinter die Selbsteinschätzung des Reichen; »durchschaut ihn« gibt dies idiomatisch wieder, ohne die mögliche Untersuchungsnuance in der Fußnote zu verschweigen.
