  text: גֶּ֣בֶר רָ֭שׁ וְ/עֹשֵׁ֣ק דַּלִּ֑ים מָטָ֥ר סֹ֝חֵ֗ף וְ/אֵ֣ין לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/003.yaml
  text: A poor man who oppresses the lowly is like a sweeping rain that leaves no food[a].
translation:
  language: de
  text: Ein armer Mann, der die Schwachen unterdrückt, ist wie ein reißender Regen, der kein Brot übrig lässt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und da ist kein Brot“. „Brot“ kann hier allgemein für Nahrung oder Lebensunterhalt stehen.'
    reason: Erläuterung der möglichen bildlichen bzw. metonymischen Bedeutung von „Brot“ bei Beibehaltung des wörtlichen Begriffs im Haupttext.
lexical_decisions:
- source_word: גֶּבֶר
  choice: Mann
  rationale: Das Substantiv bezeichnet hier einen männlichen Menschen als beispielhafte Gestalt des Spruchs; „Mann“ gibt die grammatische und sachliche Form direkt wieder.
- source_word: רָשׁ
  choice: arm
  rationale: Das Adjektiv bezeichnet einen Menschen, dem materielle Mittel fehlen; „arm“ ist die klare und natürliche deutsche Entsprechung.
- source_word: עֹשֵׁק
  choice: der … unterdrückt
  rationale: Das Partizip beschreibt fortdauerndes Ausbeuten oder Unterdrücken. Der Relativsatz ergibt im Deutschen eine natürliche Syntax.
- source_word: דַּלִּים
  choice: die Schwachen
  rationale: דַּל kann Armut, geringe Stellung und mangelnde Macht bezeichnen. „die Schwachen“ wahrt gegenüber רָשׁ („arm“) die lexikalische Unterscheidung und betont ihre Schutzlosigkeit.
- source_word: מָטָר סֹחֵף
  choice: ein Regen, der alles wegschwemmt
  rationale: סֹחֵף bezeichnet die fortreißende, zerstörerische Wirkung des Regens. Die deutsche Formulierung bildet das anschaulich und natürlich ab; „alles“ verdeutlicht die umfassende Wirkung, ohne ein bestimmtes zerstörtes Gut hinzuzufügen.
- source_word: וְאֵין לָחֶם
  choice: sodass keine Nahrung übrig bleibt
  rationale: Wörtlich steht „und da ist kein Brot“. Im Bild bezeichnet „Brot“ wahrscheinlich Nahrung oder Lebensunterhalt allgemein; die resultative Verknüpfung macht den Zusammenhang im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchton. Die zugespitzte Spannung, dass ein armer Mann andere Schutzlose unterdrückt, bleibt erhalten.
