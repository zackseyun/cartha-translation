  text: בְּ/פֶ֣שַֽׁע אֶ֭רֶץ רַבִּ֣ים שָׂרֶ֑י/הָ וּ/בְ/אָדָ֥ם מֵבִ֥ין יֹ֝דֵ֗עַ כֵּ֣ן יַאֲרִֽיךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/002.yaml
  text: Because of a land's transgression[a], its rulers are many, but by a man of understanding and knowledge[b], stability endures.
translation:
  language: de
  text: Wegen des Frevels eines Landes sind seine Herrscher zahlreich; doch durch einen verständigen und kundigen Menschen wird es lange erhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut der zweiten Vershälfte ist schwierig. Näher an der Form lautet er etwa: »Doch durch einen Menschen, der versteht und weiß, verlängert er es so.« Subjekt und Bezug von »es« sind nicht ausdrücklich genannt. Die Übersetzung versteht »es« im Zusammenhang als das Land beziehungsweise seinen Fortbestand; möglich ist auch die Deutung, dass durch verständige Einsicht eine geordnete Lage dauerhaft bewahrt wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: Wegen des Frevels
  rationale: Die Präposition בְּ ist hier kausal zu verstehen. »Frevel« bewahrt den moralisch-rechtlichen Ernst von פֶּשַׁע, das Vergehen, Treuebruch oder Auflehnung bezeichnen kann.
- source_word: אֶרֶץ
  choice: eines Landes
  rationale: אֶרֶץ bezeichnet hier im allgemeinen Spruchzusammenhang ein politisches Gemeinwesen beziehungsweise Land.
- source_word: רַבִּים שָׂרֶיהָ
  choice: sind seine Herrscher zahlreich
  rationale: שָׂר kann Fürst, Amtsträger oder Herrscher bedeuten. Die formnahe Wiedergabe lässt offen, ob an viele gleichzeitige Machthaber oder an häufige Herrscherwechsel gedacht ist.
- source_word: וּבְאָדָם
  choice: doch durch einen … Menschen
  rationale: »Doch« macht den Gegensatz der beiden Vershälften deutlich. אָדָם ist hier eine generische Singularbezeichnung; »Mensch« gibt sie im Deutschen natürlich und ohne unnötige geschlechtliche Festlegung wieder.
- source_word: מֵבִין יֹדֵעַ
  choice: verständigen und kundigen
  rationale: 'Die beiden Partizipien werden getrennt wiedergegeben: בין bezeichnet verständiges Unterscheiden, ידע Wissen beziehungsweise Sachkunde.'
- source_word: כֵּן
  choice: die Ordnung
  rationale: כֵּן bedeutet gewöhnlich »so«; in diesem schwierigen Zusammenhang kann es substantivisch beziehungsweise idiomatisch auf einen gefestigten, geordneten Zustand weisen. »Die Ordnung« macht diese Deutung kenntlich, ohne den Gedanken zur umfassenderen »Stabilität« auszuweiten.
- source_word: יַאֲרִיךְ
  choice: hat … lange Bestand
  rationale: Das Hifil von ארך bezeichnet Verlängern oder langes Fortbestehen. Die deutsche Wendung gibt den resultativen Sinn natürlich wieder.
theological_decisions:
- issue: Bezug und Sinn von כֵּן יַאֲרִיךְ
  choice: »hat die Ordnung lange Bestand«
  alternative: »so verlängert er es« / »so besteht es lange«
  rationale: Der hebräische zweite Halbvers ist syntaktisch und semantisch unsicher. Die gewählte Fassung folgt der im Parallelismus naheliegenden Aussage, dass verständige Einsicht einem Gemeinwesen dauerhafte Ordnung verleiht, während die Fußnote die formnähere Unbestimmtheit offenlegt.
translation_notes:
  register: Moderne, würdige Spruchsprache. Der Parallelismus bleibt knapp; die ungewöhnliche hebräische Schlusswendung wird im Haupttext verständlich wiedergegeben und in der Fußnote als echte Auslegungsunsicherheit ausgewiesen.
