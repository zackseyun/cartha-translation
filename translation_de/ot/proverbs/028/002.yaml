  source_fidelity: 'Die erste Vershälfte ist treffend wiedergegeben. In der zweiten Hälfte ist »die Ordnung« als Subjekt jedoch eine zu starke explizite Deutung: כֵּן bedeutet gewöhnlich »so/auf diese Weise«, und ein Substantiv »Ordnung« steht im Hebräischen nicht. Der Bezug des nicht ausgedrückten Objekts beziehungsweise der genaue Satzbau von כֵּן יַאֲרִיךְ bleibt umstritten.'
  naturalness: Die Sprache ist modern, knapp und spruchhaft. »Frevel« ist würdig und verständlich; »verständigen und kundigen Menschen« ist idiomatisch. Die revidierte Fassung bleibt natürlich, ohne eine nicht im Ausgangstext genannte »Ordnung« einzuführen.
  terminology: »Frevel«, »Land«, »Herrscher«, »verständig« und »kundig« sind für die hebräischen Ausdrücke angemessen. »Mensch« gibt אָדָם als generische Singularbezeichnung gut wieder. Die Formulierung »wird es lange erhalten« lässt den Bezug auf das Land bzw. dessen Fortbestand offen, statt כֵּן mit »Ordnung« gleichzusetzen.
  issues:
