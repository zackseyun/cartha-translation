  text: מַשְׁגֶּ֤ה יְשָׁרִ֨ים בְּ/דֶ֥רֶךְ רָ֗ע בִּ/שְׁחוּת֥/וֹ הֽוּא יִפּ֑וֹל וּ֝/תְמִימִ֗ים יִנְחֲלוּ טֽוֹב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/010.yaml
  text: Whoever leads the upright astray in an evil way will himself fall into his own pit[a], but the blameless will inherit good.
translation:
  language: de
  text: Wer Aufrichtige auf einem bösen Weg irreführt, wird selbst in seine eigene Grube fallen[a]; doch die Lauteren werden Gutes erben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird in seinem eigenen Verderben zugrunde gehen“ oder „wird seinem eigenen Untergang verfallen“. Das hebräische Wort kann eine Grube, aber auch Verderben oder Untergang bezeichnen; der Haupttext bewahrt das Bild einer Falle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁגֶּה
  choice: Wer … irreführt
  rationale: Das Hifil-Partizip von שׁגה bezeichnet jemanden, der andere zum Irren beziehungsweise Abirren bringt. Die deutsche Wer-Konstruktion gibt die allgemeine Aussage des Partizips natürlich wieder.
- source_word: יְשָׁרִים
  choice: Aufrichtige
  rationale: Das Wort bezeichnet im weisheitlichen Sprachgebrauch Menschen, deren Haltung und Lebensführung moralisch gerade und rechtschaffen sind. „Aufrichtige“ bewahrt diesen ethischen Sinn.
- source_word: בְּדֶרֶךְ רָע
  choice: auf einen bösen Weg
  rationale: דֶּרֶךְ bezeichnet wörtlich einen Weg und bildlich die Lebensführung. Im Zusammenhang mit dem kausativen „irreführen“ formuliert das Deutsche das Ziel idiomatisch mit „auf einen … Weg“, ohne die Wegmetapher aufzugeben.
- source_word: בִּשְׁחוּתוֹ
  choice: in seine eigene Grube
  rationale: שְׁחוּת kann eine Grube, aber auch Verderben oder Untergang bezeichnen. „Grube“ erhält das konkrete Bild der selbstverschuldeten Falle; das Suffix der 3. Person Singular wird durch „seine eigene“ ausdrücklich wiedergegeben.
- source_word: הוּא יִפּוֹל
  choice: wird selbst … fallen
  rationale: Das ausdrücklich gesetzte Pronomen הוּא hebt hervor, dass gerade der Verführer selbst fällt. „selbst“ bildet diese Betonung im Deutschen ab.
- source_word: וּתְמִימִים
  choice: doch die Lauteren
  rationale: תָּמִים bezeichnet hier Menschen von ungeteilter Integrität. „Lautere“ ist eine verständliche ethische Bezeichnung; „doch“ bringt den inhaltlichen Gegensatz der mit ו verbundenen zweiten Vershälfte zum Ausdruck.
- source_word: יִנְחֲלוּ
  choice: werden … erben
  rationale: נחל bedeutet als Besitz oder Erbe empfangen. „erben“ bewahrt die prägnante Besitz- und Erbvorstellung des Hebräischen.
- source_word: טוֹב
  choice: Gutes
  rationale: Das substantivisch gebrauchte טוֹב bleibt bewusst weit gefasst. „Gutes“ vermeidet eine unnötige Verengung auf materiellen Wohlstand oder eine bestimmte Form des Segens.
theological_decisions:
- issue: Bild des gerechten Ergehens in בִּשְׁחוּתוֹ
  choice: Das konkrete Bild „in seine eigene Grube“ bleibt im Haupttext erhalten.
  alternative: „an seinem eigenen Verderben“ oder „in seinen eigenen Untergang“
  rationale: Der Spruch beschreibt eine Umkehrung des beabsichtigten Unheils, legt aber die konkrete Art des Gerichts nicht fest. Das Grubenbild bewahrt die poetische Spannung und vermeidet eine dogmatische Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Weg- und Grubenmetaphorik. Die parallele Gegenüberstellung von „Aufrichtigen“ und „Lauteren“ bleibt erkennbar, ohne die unterschiedlichen hebräischen Begriffe gleichzusetzen.
