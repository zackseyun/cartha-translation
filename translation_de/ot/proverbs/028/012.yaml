  text: בַּ/עֲלֹ֣ץ צַ֭דִּיקִים רַבָּ֣ה תִפְאָ֑רֶת וּ/בְ/ק֥וּם רְ֝שָׁעִ֗ים יְחֻפַּ֥שׂ אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/012.yaml
  text: When the righteous rejoice[a], there is great glory, but when the wicked rise, people hide themselves.
translation:
  language: de
  text: Wenn die Gerechten jubeln, herrscht großer Glanz; doch wenn die Frevler sich erheben, hält sich der Mensch verborgen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verbergen sich die Menschen«. Wörtlicher: »wird der Mensch verborgen«; das Hebräische gebraucht die Einzahl allgemein für Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹץ
  choice: Wenn … jubeln
  rationale: Die Präposition ב mit dem Infinitiv von עלץ bezeichnet hier einen Zeitpunkt. »Jubeln« gibt die freudige, öffentlich wahrnehmbare Bedeutung natürlich wieder.
- source_word: צַדִּיקִים
  choice: die Gerechten
  rationale: Das substantivierte Adjektiv im Plural bezeichnet Menschen, die gerecht handeln; die traditionelle Wendung ist im Deutschen klar und prägnant.
- source_word: רַבָּה תִפְאָרֶת
  choice: herrscht großer Glanz
  rationale: תִפְאָרֶת kann Glanz, Ehre oder Herrlichkeit bezeichnen. »Großer Glanz« bewahrt das öffentliche und erhöhte Bild; »herrscht« formuliert die prädikative Aussage idiomatisch, ohne ihren Sinn auszuweiten.
- source_word: וּבְקוּם
  choice: doch wenn … sich erheben
  rationale: ו markiert hier den Gegensatz, und ב mit dem Infinitiv von קום ist temporal. »Sich erheben« bewahrt das Bild des Aufkommens beziehungsweise Erstarkens, ohne politische Macht ausdrücklich in den Text einzutragen.
- source_word: רְשָׁעִים
  choice: die Frevler
  rationale: Das substantivierte Pluralwort bezeichnet moralisch schuldige, böse handelnde Menschen. »Frevler« ist in einem Weisheitsspruch würdig und deutlicher personenbezogen als das abstraktere »die Bösen«.
- source_word: יְחֻפַּשׂ
  choice: hält sich … verborgen
  rationale: 'Die Pual-Form hat passiven Sinn: »wird verborgen«. Die deutsche reflexive Form gibt die kontextuelle Folge natürlich wieder, ohne die zugrunde liegende Vorstellung des Verborgenseins aufzugeben.'
- source_word: אָדָם
  choice: der Mensch
  rationale: Die singularische Gattungsbezeichnung meint den Menschen beziehungsweise gewöhnliche Menschen allgemein. »Der Mensch« wahrt sowohl Numerus als auch generischen Sinn.
theological_decisions:
- issue: Generischer Singular אָדָם und passive Verbform
  choice: hält sich der Mensch verborgen
  alternative: verbergen sich die Menschen / wird ein Mensch verborgen
  rationale: Der hebräische Text verbindet den generischen Singular אָדָם mit einer Passivform. Die Hauptfassung erhält den Singular und gibt die im Zusammenhang naheliegende Reaktion idiomatisch wieder; die Fußnote macht die formnähere und die pluralisch-generische Wiedergabe sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen Zweigliedrigkeit eines Weisheitsspruchs. »Glanz« vermeidet das heute häufig rein theologisch verstandene »Herrlichkeit«, während »sich erheben« die mögliche gesellschaftliche oder politische Dimension offenhält.
