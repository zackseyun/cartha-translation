  text: הַֽכֵּר פָּנִ֥ים לֹא ט֑וֹב וְ/עַל פַּת לֶ֝֗חֶם יִפְשַׁע גָּֽבֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/021.yaml
  text: To show partiality is not good[c][b][a], yet for a piece of bread a man will transgress.
translation:
  language: de
  text: Parteiisch zu sein ist nicht gut[a]; doch für einen Bissen Brot[b] vergeht sich ein Mann[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Gesichter erkennen«; dies ist eine hebräische Redewendung für parteiisches Handeln oder unfaire Begünstigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »für ein Stück Brot«. Gemeint ist ein sehr geringer Vorteil.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort bedeutet »Mann« und wird hier in einem allgemeinen sprichwörtlichen Sinn gebraucht.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֵּר פָּנִים
  choice: jemanden zu bevorzugen
  rationale: Die Wendung bedeutet wörtlich »Gesichter erkennen«, ist hier aber ein Idiom für parteiische Bevorzugung. Die gewählte Formulierung gibt den ethischen Sinn in natürlichem modernem Deutsch wieder.
- source_word: לֹא טוֹב
  choice: ist nicht gut
  rationale: Die direkte Wiedergabe bewahrt das breite moralische Urteil des Hebräischen, ohne es auf einen ausschließlich rechtlichen Zusammenhang zu verengen.
- source_word: וְעַל
  choice: doch schon für
  rationale: »Doch« bringt den Gegensatz zwischen dem Grundsatz im ersten Halbvers und dem tatsächlichen Fehlverhalten im zweiten zum Ausdruck; »schon« hebt den geringfügigen Anlass hervor.
- source_word: פַּת לֶחֶם
  choice: ein Stück Brot
  rationale: Die Wendung bezeichnet eine kleine Menge Brot und unterstreicht, wie geringer Gewinn zu einem Vergehen verleiten kann.
- source_word: יִפְשַׁע
  choice: vergeht sich
  rationale: Das Verb פשע bezeichnet ein schuldhaftes Übertreten oder Aufbegehren. »Sich vergehen« bewahrt sein moralisches Gewicht, ohne im Deutschen unnötig fachsprachlich zu klingen.
- source_word: גָּבֶר
  choice: ein Mann
  rationale: Das maskuline Singularwort wird entsprechend seiner Form wiedergegeben; im Spruch steht der Mann zugleich beispielhaft für menschliches Verhalten.
theological_decisions:
- issue: Generisches Maskulinum in der sprichwörtlichen Aussage
  choice: ein Mann
  alternative: ein Mensch
  rationale: גָּבֶר bezeichnet ausdrücklich einen Mann, wird hier jedoch in einer allgemeinen sprichwörtlichen Aussage gebraucht. Die Übersetzung erhält die geschlechtliche Form des Ausgangstextes; eine Fußnote erläutert ihre beispielhafte Funktion.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Zweigliedrigkeit des Spruchs bleibt erhalten; das Semikolon macht den adversativen Zusammenhang sichtbar.
