  text: טֽוֹב רָ֭שׁ הוֹלֵ֣ךְ בְּ/תֻמּ֑/וֹ מֵ/עִקֵּ֥שׁ דְּ֝רָכַ֗יִם וְ/ה֣וּא עָשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/006.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his ways[a], though he is rich.
translation:
  language: de
  text: Besser ist ein Armer, der in Lauterkeit lebt, als einer, dessen Wege krumm sind, auch wenn er reich ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Besser ist ein Armer, der in seiner Lauterkeit geht, als einer, der krumm ist auf seinen Wegen, und er ist reich.“ Der letzte Satzteil bezieht sich auf den Menschen mit den krummen Wegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Besser ist
  rationale: 'Am Anfang des Spruchs leitet טוֹב zusammen mit dem folgenden מִן einen sprichwörtlichen Vergleich ein: „Besser ist … als …“.'
- source_word: רָשׁ
  choice: ein Armer
  rationale: רָשׁ bezeichnet einen armen oder mittellosen Menschen. Die substantivierte maskuline Form entspricht dem repräsentativen männlichen Singular des Hebräischen.
- source_word: הוֹלֵךְ
  choice: lebt
  rationale: Wörtlich bedeutet das Partizip „geht“. In der Weisheitsliteratur bezeichnet das Gehen häufig die Lebensführung; „lebt“ gibt diesen ethischen Sinn in natürlichem modernem Deutsch wieder.
- source_word: בְּתֻמּוֹ
  choice: in Lauterkeit
  rationale: תֹּם bezeichnet Ganzheit, Redlichkeit oder Lauterkeit. „Lauterkeit“ wahrt die moralische Aussage, ohne Sündlosigkeit zu behaupten.
- source_word: מֵעִקֵּשׁ
  choice: als einer, dessen … krumm sind
  rationale: Das מִן markiert den zweiten Teil des Vergleichs; עִקֵּשׁ bezeichnet einen verkehrten oder moralisch krummen Menschen. Die deutsche Formulierung verbindet das Adjektiv natürlich mit den nachfolgenden „Wegen“.
- source_word: דְּרָכַיִם
  choice: Wege
  rationale: Das formal dualische beziehungsweise pluralische Wort bezeichnet bildhaft die Lebenswege oder das Verhalten eines Menschen. „Wege“ erhält das hebräische Bild.
- source_word: וְהוּא עָשִׁיר
  choice: auch wenn er reich ist
  rationale: Wörtlich lautet die Wendung „und er ist reich“. Im Vergleich hat sie einen konzessiven Sinn und bezieht sich auf den Menschen mit den krummen Wegen; „auch wenn“ macht diese Beziehung im Deutschen verständlich.
theological_decisions:
- issue: Verhältnis von Reichtum und moralischer Verkehrtheit
  choice: Der Reichtum wird als Umstand des Menschen mit den krummen Wegen wiedergegeben, nicht als Ursache oder Beweis seiner Verkehrtheit.
  alternative: Die Schlusswendung könnte streng formal mit „und er ist reich“ übersetzt werden.
  rationale: Der Vers stellt Lauterkeit trotz Armut über Reichtum bei verkehrter Lebensführung; er verurteilt nicht Reichtum an sich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In Lauterkeit lebt“ gibt die ethische Bedeutung des hebräischen Bildes vom Gehen natürlich wieder; „Wege“ im zweiten Satzteil bewahrt dieses Bild zugleich sichtbar.
