  text: גּוֹזֵ֤ל אָ֘בִ֤י/ו וְ/אִמּ֗/וֹ וְ/אֹמֵ֥ר אֵֽין פָּ֑שַׁע חָבֵ֥ר ה֝֗וּא לְ/אִ֣ישׁ מַשְׁחִֽית׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/024.yaml
  text: Whoever robs his father and his mother and says[a], “It is no transgression,” is a companion of a destructive man.
translation:
  language: de
  text: 'Wer seinen Vater und seine Mutter beraubt und sagt: »Das ist kein Vergehen«, ist ein Gefährte eines Menschen, der Verderben anrichtet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist einem Verderber verbunden«; auch: »ist ein Gefährte eines Verderbers«.'
    reason: Die Verbindung חָבֵר … לְ bezeichnet Gemeinschaft oder Zugehörigkeit. מַשְׁחִית kann als »Verderber« oder durch eine verbale Umschreibung wiedergegeben werden.
lexical_decisions:
- source_word: גּוֹזֵל
  choice: beraubt
  rationale: Das Partizip von גזל bezeichnet gewaltsame oder widerrechtliche Wegnahme. »Beraubt« gibt den Ernst des Handelns deutlicher wieder als das neutralere »bestiehlt«.
- source_word: אָבִיו וְאִמּוֹ
  choice: seinen Vater und seine Mutter
  rationale: Der hebräische Text nennt beide Elternteile einzeln; diese Form und ihre rhetorische Wirkung bleiben erhalten.
- source_word: וְאֹמֵר
  choice: und sagt
  rationale: Die einfache Beiordnung entspricht der hebräischen Verbindung aus Konjunktion und Partizip und klingt im Deutschen natürlich.
- source_word: אֵין פָּשַׁע
  choice: Das ist kein Vergehen
  rationale: פֶּשַׁע kann Vergehen, Übertretung oder Auflehnung bezeichnen. »Vergehen« bewahrt sowohl die moralische als auch eine mögliche rechtliche Dimension, ohne den Ausdruck auf »Sünde« oder »Verbrechen« einzuengen.
- source_word: חָבֵר
  choice: der Gefährte
  rationale: חָבֵר bezeichnet jemanden, der mit einem anderen verbunden oder ihm zugesellt ist. »Gefährte« drückt die moralische Gemeinschaft aus, ohne die persönliche Zuneigung zu unterstellen, die »Freund« nahelegen könnte.
- source_word: לְאִישׁ מַשְׁחִית
  choice: eines Menschen, der Verderben anrichtet
  rationale: מַשְׁחִית ist eine kausative Partizipialform für jemanden, der zerstört, zugrunde richtet oder Verderben bringt. Die Umschreibung ist im heutigen Deutsch natürlicher als »eines Verderbers« und lässt die Art des angerichteten Schadens offen.
- source_word: הוּא
  choice: ist
  rationale: Das Pronomen dient in der Nominalklausel zur Hervorhebung beziehungsweise als Kopulaträger; im Deutschen wird dies natürlich durch »ist« ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Nennung von Vater und Mutter sowie die knappe Selbstrechtfertigung bleiben erhalten. »Gefährte« ist bewusst etwas gehoben, aber allgemein verständlich.
