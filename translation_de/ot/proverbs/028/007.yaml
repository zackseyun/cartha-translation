source:
  edition: WLC
  text: נוֹצֵ֣ר תּ֭וֹרָה בֵּ֣ן מֵבִ֑ין וְ/רֹעֶה זֽ֝וֹלְלִ֗ים יַכְלִ֥ים אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/007.yaml
  text: Whoever keeps the law is a discerning son[b][a], but he who associates with gluttons shames his father.
translation:
  language: de
  text: Wer die Weisung[a] bewahrt, ist ein verständiger Sohn; wer sich aber zu Prassern[b] hält[c], macht seinem Vater Schande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gesetz“ beziehungsweise „die Tora“. Das hebräische Wort kann sowohl göttliche Weisung als auch verbindliche Unterweisung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann neben „Prassern“ allgemeiner auch Verschwender oder ausschweifend lebende Menschen bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „[Er] hütet Prasser“. Das hebräische Verb verwendet ein Hirtenbild und meint hier idiomatisch, mit solchen Menschen Umgang zu haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹצֵר
  choice: bewahrt
  rationale: Das Partizip bezeichnet treues Bewahren, Beachten oder Befolgen. „Bewahrt“ verbindet die Vorstellung des Hütens mit der praktischen Befolgung.
- source_word: תּוֹרָה
  choice: die Weisung
  rationale: Im Sprüchebuch bezeichnet תּוֹרָה häufig verbindliche Unterweisung. „Weisung“ wahrt diese Breite besser als das enger klingende „Gesetz“.
- source_word: בֵּן מֵבִין
  choice: ein verständiger Sohn
  rationale: בֵּן ist ausdrücklich maskulin; מֵבִין bezeichnet jemanden, der Einsicht und Urteilsvermögen besitzt. Die deutsche Wendung ist natürlich und bleibt nah an der hebräischen Aussage.
- source_word: וְרֹעֶה
  choice: wer sich aber … hält
  rationale: Das Verb bedeutet wörtlich „hüten/weiden“, wird hier jedoch idiomatisch für den Umgang oder die Gemeinschaft mit bestimmten Menschen gebraucht. „Sich zu jemandem halten“ gibt die soziale Bindung natürlich wieder.
- source_word: זֹלְלִים
  choice: Prassern
  rationale: Das Wort bezeichnet Menschen, die sich maßlosem Essen und einem ausschweifenden, verschwenderischen Lebensstil hingeben. „Prasser“ erfasst sowohl den konkreten Exzess als auch den negativen Weisheitston.
- source_word: יַכְלִים אָבִיו
  choice: macht seinem Vater Schande
  rationale: Der Hifil von כלם drückt aus, dass jemand Scham oder Schande verursacht. Die deutsche Wendung gibt die kausative Bedeutung klar und idiomatisch wieder.
theological_decisions:
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz; Tora
  rationale: Der Kontext legt verbindliche Unterweisung nahe, bestimmt aber nicht eindeutig das mosaische Gesetz als ausschließlichen Bezug. „Weisung“ erhält diese Offenheit, ohne die Autorität des Gemeinten abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des hebräischen Spruchs bleibt erhalten. „Prasser“ ist markant, aber allgemein verständlich und vermittelt den missbilligenden Ton des Originals.
