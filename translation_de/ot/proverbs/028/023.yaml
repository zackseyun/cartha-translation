source:
  edition: WLC
  text: מ֘וֹכִ֤יחַ אָדָ֣ם אַ֭חֲרַי חֵ֣ן יִמְצָ֑א מִֽ/מַּחֲלִ֥יק לָשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/023.yaml
  text: Whoever rebukes a man will afterward find favor[a], more than one who flatters with the tongue.
translation:
  language: de
  text: Wer einen Menschen zurechtweist, wird später mehr Gunst finden als jemand, der schmeichelt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹכִיחַ
  choice: zurechtweist
  rationale: Das Hifil-Partizip von יכח bezeichnet hier ein tadelndes, auf Korrektur zielendes Zurechtweisen. Die Wahl bewahrt den deutlichen Gegensatz zur Schmeichelei, ohne unnötig schroff zu klingen.
- source_word: אָדָם
  choice: einen Menschen
  rationale: אָדָם bezeichnet hier den einzelnen Menschen, der zurechtgewiesen wird. „Einen Menschen“ gibt den generischen Sinn im modernen Standarddeutsch natürlich wieder.
- source_word: אַחֲרַי
  choice: später
  rationale: 'Im Zusammenhang ist die adverbiale Bedeutung „später/nachher“ am wahrscheinlichsten: Die Gunst stellt sich erst nach der Zurechtweisung ein. Die formale Möglichkeit „nach mir“ wird in einer Fußnote offengehalten.'
- source_word: חֵן יִמְצָא
  choice: wird … Gunst finden
  rationale: חֵן bezeichnet Wohlwollen oder Gunst; ימצא beschreibt das erwartete Ergebnis in allgemeingültiger, sprichwörtlicher Form.
- source_word: מִמַּחֲלִיק לָשׁוֹן
  choice: mehr … als einer, der mit seiner Zunge schmeichelt
  rationale: Das vergleichende מִן wird mit „mehr … als“ wiedergegeben. מחליק („glatt machen“) bezeichnet im Zusammenhang schmeichelndes Reden; „mit seiner Zunge“ bewahrt das hebräische Bild.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die Bildsprache der „Zunge“ bleibt erhalten; „Gunst finden“ bewahrt die knappe Weisheitssprache des Hebräischen.
