  naturalness: „… als einer, der mit seiner Zunge schmeichelt“ ist im modernen Standarddeutsch unnötig schwerfällig und klingt wörtlich nachgebildet. „… als jemand, der schmeichelt“ ist idiomatisch und bewahrt den Gegensatz. „Wird später mehr Gunst finden“ ist als weisheitliche Zukunftsaussage möglich.
