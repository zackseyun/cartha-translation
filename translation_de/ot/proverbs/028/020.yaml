source:
  edition: WLC
  text: אִ֣ישׁ אֱ֭מוּנוֹת רַב בְּרָכ֑וֹת וְ/אָ֥ץ לְ֝/הַעֲשִׁ֗יר לֹ֣א יִנָּקֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/020.yaml
  text: A faithful man will abound with blessings[a], but one who hastens to become rich will not go unpunished.
translation:
  language: de
  text: Ein zuverlässiger Mensch wird reich an Segnungen sein, doch wer schnell reich werden will, wird nicht ungestraft bleiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wird nicht für unschuldig erklärt / wird nicht freigesprochen.'
    reason: Lexikalische Alternative für לֹא יִנָּקֶה; die hebräische Formulierung kann sowohl die Straflosigkeit als auch einen forensischen Freispruch bezeichnen.
lexical_decisions:
- source_word: אִישׁ אֱמוּנוֹת
  choice: ein treuer Mensch
  rationale: Die hebräische Verbindung bedeutet wörtlich etwa „ein Mensch der Treue/Verlässlichkeit“. „Ein treuer Mensch“ gibt die charakterliche Zuverlässigkeit natürlich und mit generischer Bedeutung wieder.
- source_word: רַב בְּרָכוֹת
  choice: empfängt Segen in Fülle
  rationale: Die verblos formulierte Aussage bezeichnet eine Fülle von Segnungen. Die deutsche Wendung bewahrt den allgemeinen, sprichwörtlichen Sinn, ohne den Segen auf materiellen Wohlstand zu verengen.
- source_word: וְאָץ לְהַעֲשִׁיר
  choice: doch wer hastig reich werden will
  rationale: אָץ bezeichnet hastiges oder ungeduldiges Drängen; der Infinitiv לְהַעֲשִׁיר meint hier das Reichwerden. Die Formulierung bildet einen klaren Gegensatz zur beständigen Treue des ersten Halbverses.
- source_word: לֹא יִנָּקֶה
  choice: wird nicht ungestraft bleiben
  rationale: Das Nifal von נקה kann bedeuten, nicht straflos auszugehen beziehungsweise nicht für unschuldig erklärt zu werden. „Nicht ungestraft bleiben“ ist im Kontext eine klare und idiomatische Wiedergabe; die forensische Alternative wird in der Fußnote bewahrt.
theological_decisions:
- issue: Art des verheißenen Segens
  choice: Das allgemeine Wort „Segen“ bleibt erhalten.
  alternative: Den Segen ausdrücklich als materiellen Wohlstand oder Reichtum verstehen.
  rationale: Der hebräische Plural בְּרָכוֹת legt die Art des Segens nicht fest. Gerade der Gegensatz zum hastigen Reichwerden spricht dagegen, ihn stillschweigend auf materiellen Gewinn zu beschränken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem sprichwörtlichem Ton. „Mensch“ gibt die generische Aussage natürlich wieder; „hastig reich werden“ bewahrt die Warnung vor ungeduldigem Erwerbsstreben.
