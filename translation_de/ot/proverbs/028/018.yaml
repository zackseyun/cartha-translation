base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/018.yaml
  text: Whoever walks in integrity will be delivered[b][a], but one crooked in his ways will fall at once.
translation:
  language: de
  text: Wer in Lauterkeit lebt, wird bewahrt[a]; wer jedoch krumme Wege geht, wird auf einmal fallen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird gerettet“ oder „wird befreit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in einem“; wahrscheinlich im Sinn von „plötzlich“ oder „auf einen Schlag“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ תָּמִים
  choice: in Lauterkeit lebt
  rationale: הלך bezeichnet in der Weisheitsliteratur häufig die Lebensführung. Die natürliche deutsche Wendung „lebt“ gibt diese übertragene Bedeutung wieder; „in Lauterkeit“ bewahrt den Gedanken moralischer Ganzheit, ohne sündlose Vollkommenheit zu unterstellen.
- source_word: יִוָּשֵׁעַ
  choice: wird gerettet
  rationale: Das Nifal von ישׁע bezeichnet Rettung, Befreiung oder Bewahrung. „Wird gerettet“ erhält die passive Form und die lexikalische Breite; der Kontext des Weisheitsspruchs legt keine ausschließlich heilsgeschichtliche Bedeutung fest.
- source_word: נֶעְקַשׁ דְּרָכַיִם
  choice: wer aber auf krummen Wegen geht
  rationale: נעקשׁ bezeichnet moralische Verkehrtheit, während דרכים die bildhafte Rede von Wegen beziehungsweise Lebensweisen trägt. Die deutsche Formulierung erhält dieses Wegmotiv und gibt die prädikative hebräische Fügung natürlich wieder.
- source_word: יִפּוֹל
  choice: wird fallen
  rationale: נפל bedeutet konkret „fallen“ und kann im Weisheitskontext den Untergang einschließen. Die direkte Wiedergabe erhält das Bild, ohne dessen Folge näher auszudeuten.
- source_word: בְּאֶחָת
  choice: mit einem Mal
  rationale: Wörtlich steht „in einem/einer“. Die wahrscheinlich adverbiale Wendung bezeichnet ein plötzliches Geschehen beziehungsweise einen einzigen Schlag. „Mit einem Mal“ ist idiomatisches modernes Deutsch; die unsichere Einzelheit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Bedeutungsumfang von יִוָּשֵׁעַ im Weisheitsspruch
  choice: „wird gerettet“ mit Fußnote zu „befreit“ und „bewahrt“
  alternative: „wird bewahrt“
  rationale: Der Kontext spricht zunächst allgemein von Rettung oder Bewahrung im Leben und verlangt keine ausschließliche Deutung auf das ewige Heil. Zugleich gehört „retten“ zum echten Bedeutungsumfang des Verbs; die Fußnote hält die kontextuellen Möglichkeiten offen.
- issue: Generisch maskuline Einzelform
  choice: geschlechtsübergreifende deutsche Wer-Sätze ohne zusätzliches Pronomen
  alternative: „Der ...; der aber ...“
  rationale: Die hebräischen maskulinen Singularformen haben hier repräsentative Kraft. Die Wer-Sätze geben die allgemeine Aussage natürlich wieder, ohne den Geltungsbereich einzuschränken oder den Inhalt zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lauterkeit“ ist gehoben, aber allgemein verständlich und vermeidet die mögliche Fehlvorstellung völliger Sündlosigkeit bei „untadelig“. Die parallelen Bilder von Lebensführung, krummen Wegen und Fallen bleiben erhalten; die beiden Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Aussage.
