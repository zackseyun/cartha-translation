id: PRO.28.25
reference: Proverbs 28:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רְחַב נֶ֭פֶשׁ יְגָרֶ֣ה מָד֑וֹן וּ/בוֹטֵ֖חַ עַל יְהוָ֣ה יְדֻשָּֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/025.yaml
  text: A greedy person stirs up strife[b][a], but the one who trusts in Yahweh will be enriched.
translation:
  language: de
  text: Wer unersättlich ist,[a] schürt Streit; wer aber auf Jahwe vertraut, wird gedeihen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wer weit/breit an Seele ist«; gemeint sein kann ein Mensch mit maßlosem Verlangen, besonders ein Habgieriger; möglicherweise auch ein Hochmütiger.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »wird fett gemacht« – ein hebräisches Bild für Fülle, Wohlergehen und Gedeihen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְחַב נֶפֶשׁ
  choice: wer unersättlich ist
  rationale: Wörtlich »weit/breit an Seele«, hier eine bildhafte Bezeichnung für ein maßloses, stets nach mehr verlangendes Begehren. »Unersättlich« gibt dieses Bild natürlich wieder, ohne die mögliche Nuance vorschnell allein auf Geldgier oder Stolz einzuengen.
- source_word: יְגָרֶה
  choice: schürt
  rationale: Die Hifil-Form bezeichnet das Hervorrufen oder Anfachen. »Schürt« verbindet sich im Deutschen prägnant mit »Streit« und passt zum zugespitzten Stil des Spruchs.
- source_word: מָדוֹן
  choice: Streit
  rationale: Das Wort bezeichnet Zwietracht, Auseinandersetzung oder Streit. »Streit« ist knapp, geläufig und sachlich weit genug.
- source_word: וּבֹטֵחַ
  choice: wer aber … vertraut
  rationale: Das Partizip beschreibt einen Menschen durch seine beständige Haltung. Wegen des gegensätzlichen Parallelismus wird ו adversativ mit »aber« wiedergegeben.
- source_word: עַל יְהוָה
  choice: auf Jahwe
  rationale: Die deutsche Verbindung »auf jemanden vertrauen« entspricht der hebräischen Konstruktion und bewahrt mit »Jahwe« den im Text stehenden Gottesnamen.
- source_word: יְדֻשָּׁן
  choice: wird gedeihen
  rationale: Die Passivform bedeutet wörtlich »wird fett gemacht« und ist ein Bild für Fülle, Wohlergehen und Gedeihen. »Wird gedeihen« vermittelt die positive Bildaussage, ohne sie ausschließlich als materiellen Reichtum auszulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art des verheißenen Wohlergehens
  choice: wird gedeihen
  alternative: wird reich werden / wird reichlich versorgt werden
  rationale: Das Bild des Fettwerdens kann Fülle und Wohlergehen einschließlich materieller Versorgung bezeichnen, legt aber keine ausschließlich finanzielle Zusage fest. Die allgemeinere Wiedergabe bewahrt diese Offenheit.
- issue: Personenbezeichnung im ersten Halbvers
  choice: wer unersättlich ist
  alternative: der habgierige Mann / der Hochmütige
  rationale: Die maskuline Singularform ist in der Spruchweisheit repräsentativ. Die deutsche Wer-Konstruktion gibt die allgemeine Aussage natürlich wieder und vermeidet eine unbegründete Einschränkung auf Männer; die Deutung als Hochmut bleibt eine mögliche, aber nicht zwingende lexikalische Alternative.
translation_notes:
  register: Knapper, würdevoller Spruchstil in modernem Standarddeutsch. Die parallelen Wer-Sätze machen den Gegensatz klar; »unersättlich« und »gedeihen« bewahren die Bildfelder des Hebräischen, während die Fußnoten die wörtlichen Formulierungen und echten Deutungsalternativen offenlegen.
