review_pass:
  verdict: approve
  source_fidelity: Der Haupttext gibt das hebräische Verbot mit אַל + Imperfekt idiomatisch wieder. »deine Kraft« trifft חֵילֶךָ in seiner bewusst breiten Bedeutung. »den Frauen« bewahrt den Plural von נָשִׁים, ohne ihn unzulässig auf Ehefrauen oder eine bestimmte Frauengruppe einzuengen. Die schwierige Wendung לַמְחוֹת מְלָכִין wird mit »dem, was Könige vernichtet« als sachlich-abstrakte, im Deutschen verständliche Deutung wiedergegeben; die Fußnote legt die wesentlichen möglichen Konstruktionen offen.
  naturalness: Das Deutsch ist modernes Standarddeutsch, knapp und dem Weisheitsspruch angemessen. Die Wiederholung von »nicht« macht die Parallelstruktur klar. »deine Wege … dem, was Könige vernichtet« ist bildhaft und leicht markiert, aber als absichtlich quellennahes Sprichwortdeutsch natürlich genug.
  terminology: »Kraft«, »Frauen«, »Wege« und »Könige« sind konsistent und quellentreu. Die Anmerkung zu »Kraft« wahrt die Bandbreite von חַיִל. Die Anmerkung zur Schlusswendung kennzeichnet die grammatische und semantische Unsicherheit angemessen, ohne eine konfessionelle oder überbestimmte Deutung einzutragen.
