source:
  edition: WLC
  text: אַל תִּתֵּ֣ן לַ/נָּשִׁ֣ים חֵילֶ֑/ךָ וּ֝/דְרָכֶ֗י/ךָ לַֽ/מְח֥וֹת מְלָכִֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/003.yaml
  text: Do not give your strength to women[b][a], or your ways to that which destroys kings.
translation:
  language: de
  text: Gib deine Kraft[a] nicht den Frauen und deine Wege nicht dem, was Könige vernichtet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Kraft« kann hier auch Tatkraft, Lebenskraft, Vermögen oder verfügbare Mittel einschließen.
    reason: lexical_alternative
  - marker: b
    text: 'Die schwierige hebräische Wendung kann auch wiedergegeben werden: »und deine Wege nicht denen, die Könige vernichten« oder abstrakter: »nicht dem Verderben der Könige«.'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: Gib … nicht
  rationale: Die Verbindung aus אַל und Imperfekt/Jussiv drückt ein Verbot aus. Die deutsche Form bewahrt zugleich die Grundbedeutung von נתן, »geben«.
- source_word: לַנָּשִׁים
  choice: den Frauen
  rationale: נָשִׁים ist Plural und bezeichnet hier Frauen, nicht ausdrücklich Ehefrauen. Die Übersetzung engt den Bezug daher nicht ein.
- source_word: חֵילֶךָ
  choice: deine Kraft
  rationale: חַיִל kann Kraft, Leistungsfähigkeit, Vermögen oder Mittel bezeichnen. »Kraft« bildet den persönlichen und zugleich umfassenden Sinn am besten ab; die weitere Bedeutungsbreite wird in einer Fußnote genannt.
- source_word: וּדְרָכֶיךָ
  choice: und deine Wege
  rationale: דֶּרֶךְ kann Weg, Lebensführung oder Verhaltensweise meinen. Der Plural und die Bildsprache des Hebräischen bleiben erhalten.
- source_word: לַמְחוֹת מְלָכִין
  choice: dem, was Könige vernichtet
  rationale: מחה bezeichnet ein Auslöschen oder Vernichten. Die unpersönliche deutsche Fassung vermeidet es, ohne klare Grundlage bestimmte Personen als Subjekt einzuführen, und gibt die schwierige hebräische Konstruktion verständlich wieder.
theological_decisions:
- issue: Reichweite der Warnung vor Frauen
  choice: Die allgemeine Formulierung des Hebräischen bleibt stehen, ohne daraus eine Aussage über das Wesen aller Frauen zu machen.
  alternative: Die Warnung ausdrücklich auf fremde Ehefrauen, Polygamie oder sexuelle Ausschweifung beschränken.
  rationale: Der Vers nennt schlicht »Frauen«. Der Zusammenhang königlicher Weisheitslehre warnt vor einer Preisgabe von Kraft und Lebensführung; eine engere oder pauschal abwertende Deutung soll nicht in die Übersetzung eingetragen werden.
- issue: Bedeutungsumfang von חֵילֶךָ
  choice: Kraft im umfassenden Sinn persönlicher Stärke und verfügbarer Mittel
  alternative: Ausschließlich Vermögen oder ausschließlich sexuelle Potenz
  rationale: Das hebräische Wort besitzt einen breiten Bedeutungsumfang. »Kraft« wahrt diese Offenheit besser als eine engere Festlegung.
- issue: Deutung von לַמְחוֹת מְלָכִין
  choice: 'unpersönlich: »dem, was Könige vernichtet«'
  alternative: 'persönlich: »denen, die Könige vernichten«; oder abstrakt: »dem Verderben der Könige«'
  rationale: Die grammatisch schwierige Wendung lässt mehrere Konstruktionen zu. Die gewählte Fassung ist im Deutschen klar, ohne bestimmte menschliche Akteure vorauszusetzen; die Alternativen werden in der Fußnote offengelegt.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die parallele Satzstruktur und das Bild der »Wege« bleiben erhalten; schwer verständliche grammatische Alternativen werden nicht in den Haupttext gedrängt, sondern transparent in der Fußnote ausgewiesen.
