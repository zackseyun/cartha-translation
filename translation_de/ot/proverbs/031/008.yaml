  text: פְּתַח פִּ֥י/ךָ לְ/אִלֵּ֑ם אֶל דִּ֝֗ין כָּל בְּנֵ֥י חֲלֽוֹף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/008.yaml
  text: Open your mouth for the mute[a], for the cause of all the passing away.
translation:
  language: de
  text: Öffne deinen Mund für den Stummen, für die Rechtssache all derer, die dahinschwinden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für das Recht aller Mittellosen“, „für alle, die dem Untergang entgegengehen“ oder „für alle Söhne der Vergänglichkeit“. Die hebräische Wendung ist schwierig, besonders das seltene Wort חֲלוֹף (chalof).'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  choice: Öffne deinen Mund
  rationale: Die konkrete hebräische Wendung wird bewahrt; sie ist auch im Deutschen verständlich und hat hier den Sinn einer eindringlichen Aufforderung, sich zu Wort zu melden.
- source_word: לְאִלֵּם
  choice: für den Stummen
  rationale: אִלֵּם bezeichnet einen Menschen, der nicht sprechen kann. Der Singular kann hier stellvertretend eine Gruppe bezeichnen; die knappe Form bewahrt das Bild des Ausgangstextes.
- source_word: אֶל־דִּין
  choice: für die Rechtssache
  rationale: דִּין hat hier einen rechtlichen beziehungsweise forensischen Bezug. „Rechtssache“ bezeichnet das Anliegen, für das jemand eintritt, ohne den Ausdruck allgemein zu „Gerechtigkeit“ zu erweitern.
- source_word: כָּל בְּנֵי חֲלוֹף
  choice: all derer, die dahinschwinden
  rationale: בְּנֵי bezeichnet idiomatisch eine Personengruppe. Das seltene und schwierige חֲלוֹף wird von der Vorstellung des Vergehens oder Dahinschwindens her wiedergegeben; die Unsicherheit wird in der Fußnote offengelegt.
theological_decisions:
- issue: Identität der mit בְּנֵי חֲלוֹף bezeichneten Menschen
  choice: Keine bestimmte soziale oder theologische Gruppe festgelegt; wiedergegeben als „all derer, die dahinschwinden“
  alternative: „aller Mittellosen“, „aller dem Untergang Geweihten“ oder wörtlicher „aller Söhne der Vergänglichkeit“
  rationale: Das seltene חֲלוֹף lässt mehrere Deutungen zu. Die Übersetzung hält die Vorstellung des Vergehens offen und vermeidet es, den Ausdruck ausschließlich auf Armut, Tod oder gesellschaftliche Entrechtung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Aufforderung „Öffne deinen Mund“ bleibt erhalten; „Rechtssache“ wahrt den rechtlichen Klang. Die ungewöhnliche Schlusswendung wird lesbar formuliert, ohne ihre echte lexikalische Unsicherheit zu verdecken.
