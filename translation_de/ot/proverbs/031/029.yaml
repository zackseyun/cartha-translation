  text: רַבּ֣וֹת בָּ֭נוֹת עָ֣שׂוּ חָ֑יִל וְ֝/אַ֗תְּ עָלִ֥ית עַל כֻּלָּֽ/נָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/029.yaml
  text: Many daughters have done nobly[b][a], but you surpass them all.
translation:
  language: de
  text: Viele Frauen haben sich tüchtig erwiesen,[a] doch du übertriffst sie alle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Viele Töchter haben sich als tüchtig erwiesen.“ Das hebräische Wort für „Töchter“ kann hier Frauen allgemein bezeichnen; das Wort für „tüchtig“ umfasst auch Stärke, Tatkraft, Tapferkeit und hervorragende Befähigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: Viele
  rationale: Die adjektivische Form bedeutet „viele“ oder „zahlreiche“. „Viele“ ist im modernen Deutschen natürlich und prägnant.
- source_word: בָּנוֹת
  choice: Frauen
  rationale: Wörtlich bedeutet das Wort „Töchter“, kann hier im poetischen Sprachgebrauch jedoch Frauen allgemein bezeichnen. Im Deutschen wäre „Viele Töchter“ leicht als leibliche Töchter misszuverstehen; „Frauen“ gibt den gemeinten Bezug natürlich wieder.
- source_word: עָשׂוּ חָיִל
  choice: haben sich tüchtig erwiesen
  rationale: Die Verbindung bezeichnet erfolgreiches, kraftvolles oder hervorragendes Handeln. „Sich tüchtig erweisen“ wahrt die praktische Bewährung und die positive Wertung, ohne חַיִל einseitig auf Tapferkeit, Wohlstand oder gesellschaftlichen Rang festzulegen.
- source_word: וְאַתְּ
  choice: doch du
  rationale: Die Konjunktion erhält durch den Zusammenhang einen deutlich kontrastierenden Sinn. „Doch du“ gibt diesen Gegensatz idiomatisch wieder und hebt die direkt angesprochene Frau hervor.
- source_word: עָלִית עַל כֻּלָּנָה
  choice: übertriffst sie alle
  rationale: Das Verb bedeutet wörtlich „hinaufsteigen“, mit עַל hier jedoch idiomatisch „übertreffen“ oder „überragen“. Die deutsche Formulierung gibt den Vergleich klar und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und der poetische Vergleich bleiben erhalten. Der Haupttext vermeidet das im Deutschen missverständliche „Töchter“, während die Fußnote sowohl die wörtliche Bildsprache als auch die Bedeutungsbreite von חַיִל dokumentiert.
