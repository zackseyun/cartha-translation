  text: יִ֭שְׁתֶּה וְ/יִשְׁכַּ֣ח רִישׁ֑/וֹ וַ֝/עֲמָל֗/וֹ לֹ֣א יִזְכָּר עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/007.yaml
  text: Let him drink and forget his poverty[a], and remember his trouble no more.
translation:
  language: de
  text: Er soll trinken und seine Armut vergessen und nicht mehr an sein Elend[a] denken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Mühsal. Das hebräische Wort kann Arbeit und Mühe, Beschwernis oder Elend bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁתֶּה
  choice: Er soll trinken
  rationale: Der Imperfekt hat im Zusammenhang eine auffordernde beziehungsweise zulassende Bedeutung. „Er soll trinken“ gibt diese Nuance im modernen Deutschen natürlich wieder.
- source_word: וְיִשְׁכַּח
  choice: und … vergessen
  rationale: Die Verbindung mit dem Imperfekt führt die volitive Aussage fort und lässt zugleich eine Zweck- oder Folgebeziehung anklingen, ohne sie ausdrücklich festzulegen.
- source_word: רִישׁוֹ
  choice: seine Armut
  rationale: רִישׁ bezeichnet Armut oder einen verarmten Zustand. „Armut“ ist die direkte und idiomatische deutsche Entsprechung.
- source_word: וַעֲמָלוֹ
  choice: sein Elend
  rationale: עָמָל kann Mühsal, Beschwernis oder Elend bezeichnen. In diesem Zusammenhang erfasst „Elend“ die belastende Lebenslage, ohne den Sinn auf körperliche Arbeit zu verengen.
- source_word: לֹא יִזְכָּר עוֹד
  choice: nicht mehr an … denken
  rationale: Die Verbindung von זכר mit der Verneinung und עוֹד bezeichnet das Aufhören des Erinnerns. Die deutsche Wendung „nicht mehr an … denken“ ist natürlich und wahrt diesen Sinn.
