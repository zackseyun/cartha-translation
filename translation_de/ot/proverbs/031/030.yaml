  text: שֶׁ֣קֶר הַ֭/חֵן וְ/הֶ֣בֶל הַ/יֹּ֑פִי אִשָּׁ֥ה יִרְאַת יְ֝הוָ֗ה הִ֣יא תִתְהַלָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/030.yaml
  text: Charm is deceitful[a], and beauty is fleeting[c][b], but a woman who fears Yahweh shall be praised.
translation:
  language: de
  text: Anmut ist trügerisch, und Schönheit ist ein Hauch; doch eine Frau[a], die Jahwe fürchtet – sie wird gerühmt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Ehefrau«; das hebräische Wort kann je nach Zusammenhang »Frau« oder »Ehefrau« bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Oder reflexiv: »sie rühmt sich« beziehungsweise »sie wird sich rühmen«; der Zusammenhang spricht jedoch eher für »sie wird gerühmt werden«.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁקֶר
  choice: trügerisch
  rationale: Das Substantiv bezeichnet Lüge, Falschheit oder Täuschung. Als Prädikat zu »Anmut« gibt »trügerisch« die wertende Aussage im heutigen Deutsch natürlich wieder.
- source_word: הַחֵן
  choice: Anmut
  rationale: Gemeint ist hier die gewinnende äußere Ausstrahlung oder Attraktivität. »Anmut« bewahrt den Bezug zur Erscheinung, ohne den theologischen Sinn von »Gnade« einzutragen.
- source_word: הֶבֶל
  choice: ein Hauch
  rationale: Das Wort bezeichnet grundlegend Atem, Hauch oder Dunst und kann Vergänglichkeit wie auch Nichtigkeit ausdrücken. Die Bildsprache bleibt erhalten, statt sie auf nur eine Folgerung festzulegen.
- source_word: הַיֹּפִי
  choice: Schönheit
  rationale: Dies ist die direkte und im Kontext natürliche Wiedergabe des Begriffs für Schönheit oder äußere Attraktivität.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: Das hebräische Wort kann »Frau« oder »Ehefrau« bedeuten. Die allgemein formulierte Weisheitsaussage spricht vorrangig für »Frau«; die andere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: יִרְאַת יְהוָה
  choice: die Jahwe fürchtet
  rationale: Die attributive Wendung »Jahwe fürchtend« wird als natürlicher deutscher Relativsatz wiedergegeben und bewahrt das weisheitliche Motiv der Gottesfurcht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, damit der im hebräischen Text ausdrücklich stehende Eigenname erkennbar bleibt.
- source_word: הִיא
  choice: sie
  rationale: Das selbstständige Pronomen hebt gerade diese Frau hervor. Der Gedankenstrich und das ausdrückliche »sie« bewahren diesen Nachdruck.
- source_word: תִתְהַלָּל
  choice: soll gerühmt werden
  rationale: Der Hitpael kann reflexiv oder passivähnlich verstanden werden. Im Zusammenhang des abschließenden Lobes liegt die passivähnliche Aufforderung beziehungsweise Würdigung nahe; »soll gerühmt werden« bringt dies idiomatisch zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. »Jahwe« erhält den Charakter als Eigenname und vermeidet, ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von תִתְהַלָּל im Schlusssatz
  choice: 'passivähnlich: »sie soll gerühmt werden«'
  alternative: 'reflexiv: »sie darf sich rühmen« oder »sie rühmt sich«'
  rationale: Der Stamm lässt eine reflexive Deutung zu, doch der Zusammenhang des Gedichts, besonders die anschließende Aufforderung, sie für ihre Werke zu loben, stützt die passivähnliche Lesart. Die echte sprachliche Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelität der beiden ersten Aussagen bleibt erhalten; »ein Hauch« bewahrt das konkrete hebräische Bild. Der Gedankenstrich und das wiederaufgenommene Pronomen geben die Hervorhebung durch הִיא wieder.
