revisions:
- from: Kraft und Würde sind ihr Gewand, und sie lacht über den kommenden Tag.[a]
  to: Kraft und Würde sind ihr Gewand, und sie lacht dem kommenden Tag entgegen.[a]
  rationale: Die Revision beseitigt eine im Deutschen naheliegende Lesart des Verspottens und gibt die auf die Zukunft gerichtete Zuversicht natürlicher wieder. Der zeitliche Ausdruck bleibt bewusst singularisch; die Fußnote erhält die mögliche Bedeutung „letzter Tag“ und damit die vorhandene Ambiguität.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:36:12Z'
review_pass:
  verdict: revise
  source_fidelity: „Kraft und Würde“ gibt עֹז וְהָדָר treffend wieder; „ihr Gewand“ bewahrt die Metapher. Die Singularform von לְיוֹם אַחֲרוֹן wird mit „dem kommenden Tag“ angemessen erhalten. Die Präposition לְ ist jedoch besser als Ausrichtung auf den kommenden Tag wiederzugeben als mit „über“, das im Deutschen leicht ein spöttisches Lachen über den Tag nahelegt.
  naturalness: „Sie lacht über den kommenden Tag“ ist zwar grammatisch möglich, klingt im modernen Deutsch aber eher so, als verlache sie den Tag. „Sie lacht dem kommenden Tag entgegen“ ist idiomatisch und vermittelt die zuversichtliche, furchtlose Haltung des Verses.
  terminology: „Kraft“, „Würde“ und „Gewand“ sind registergerecht und theologisch unproblematisch. Die Fußnote soll die lexikalische Offenheit von אַחֲרוֹן („später/letzter“) bewahren, ohne eine endzeitliche Deutung festzulegen.
  issues:
  - severity: medium
    issue: Die Wendung „lacht über den kommenden Tag“ ist semantisch missverständlich.
    rationale: Im Deutschen bezeichnet „über etwas lachen“ häufig das Verspotten oder Belachen eines Gegenstands. Das hebräische לְ bei שׂחק erlaubt hier natürlicher eine auf die Zukunft gerichtete, zuversichtliche Haltung. „Dem kommenden Tag entgegenlachen“ wahrt Bildlichkeit, Singular und Sinnrichtung.
  - severity: low
    issue: Die Fußnote bezeichnet „über“ als wörtliche Wiedergabe.
    rationale: Die Präposition לְ bedeutet nicht spezifisch „über“. Eine Formulierung mit „entgegen“ gibt die Richtungsnuance vorsichtiger wieder und lässt „später/letzter“ als mögliche Bedeutung von אַחֲרוֹן bestehen.
  revised_text: Kraft und Würde sind ihr Gewand, und sie lacht dem kommenden Tag entgegen.[a]
  revised_footnotes:
  - marker: a
    text: 'Auch: „Sie lacht über die Zukunft“; wörtlich: „Sie lacht einem späteren/letzten Tag entgegen.“'
    reason: alternative_reading
  revision_rationale: Die Revision beseitigt eine im Deutschen naheliegende Lesart des Verspottens und gibt die auf die Zukunft gerichtete Zuversicht natürlicher wieder. Der zeitliche Ausdruck bleibt bewusst singularisch; die Fußnote erhält die mögliche Bedeutung „letzter Tag“ und damit die vorhandene Ambiguität.
