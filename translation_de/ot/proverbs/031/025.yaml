  text: עֹז וְ/הָדָ֥ר לְבוּשָׁ֑/הּ וַ֝/תִּשְׂחַ֗ק לְ/י֣וֹם אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/025.yaml
  text: Strength and dignity are her clothing[a], and she laughs at the days to come.
translation:
  language: de
  text: Kraft und Würde sind ihr Gewand, und sie lacht dem kommenden Tag entgegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Sie lacht über die Zukunft“; wörtlich: „Sie lacht einem späteren/letzten Tag entgegen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹז
  choice: Kraft
  rationale: עֹז bezeichnet Kraft oder Stärke. „Kraft“ ist hier eine natürliche, prägnante Charakterbeschreibung und bildet mit „Würde“ ein klanglich stimmiges Paar.
- source_word: הָדָר
  choice: Würde
  rationale: הָדָר kann Glanz, Hoheit, Ehre oder würdevolle Ausstrahlung bezeichnen. Im Zusammenhang der tüchtigen Frau gibt „Würde“ ihre ehrenvolle Haltung wieder, ohne königlichen Prunk nahezulegen.
- source_word: לְבוּשָׁהּ
  choice: sind ihr Gewand
  rationale: Das Substantiv „Kleidung/Gewand“ mit Suffix der 3. Person feminin Singular wird metaphorisch gebraucht. Der deutsche Singular „Gewand“ erlaubt beim zusammengesetzten Subjekt idiomatisch den Plural „sind“ und bewahrt das Bild des Bekleidetseins.
- source_word: וַתִּשְׂחַק
  choice: sie lacht
  rationale: שׂחק bedeutet hier „lachen“. Die wörtliche, lebendige Formulierung bringt ihre furchtlose Zuversicht deutlicher zum Ausdruck als das abgeschwächte „lächeln“.
- source_word: לְיוֹם אַחֲרוֹן
  choice: über den kommenden Tag
  rationale: Wörtlich steht eine singularische Wendung für einen späteren, letzten oder künftigen Tag. „Der kommende Tag“ bewahrt Singular und zeitliche Offenheit, klingt im Deutschen natürlich und vermeidet eine vorschnelle ausschließlich endzeitliche Festlegung.
theological_decisions:
- issue: Möglicher endzeitlicher Sinn von אַחֲרוֹן
  choice: „der kommende Tag“ als offener zeitlicher Zukunftsbezug
  alternative: „der letzte Tag“ mit möglichem endzeitlichem Sinn; allgemeiner auch „die Zukunft“
  rationale: Der Weisheitskontext hebt die Zuversicht der Frau angesichts dessen hervor, was bevorsteht. אַחֲרוֹן kann jedoch „später“ oder „letzter“ bedeuten. Deshalb hält „der kommende Tag“ den Kontext fest, während die Fußnote die echte lexikalische und mögliche theologische Spannung sichtbar macht.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Kleidungsmetapher und das kräftige Verb „lachen“ bleiben erhalten; die ungewöhnliche singularische Zeitangabe wird nicht unnötig pluralisiert.
