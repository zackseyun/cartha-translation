translation:
  language: de
  text: Sie breitet ihre Hand dem Armen entgegen aus[a] und streckt ihre Hände dem Bedürftigen entgegen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie öffnet dem Armen ihre Hand.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und reicht dem Bedürftigen ihre Hände.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפָּהּ
  choice: ihre Hand
  rationale: כַּף bezeichnet häufig die Handfläche bzw. die hohle Hand. Im Deutschen wirkt „die Hand öffnen“ natürlicher als „die Handfläche öffnen“ und bewahrt zugleich das konkrete Bild freigebiger Zuwendung.
- source_word: פָּרְשָׂה
  choice: öffnet
  rationale: פרשׂ bedeutet ausbreiten oder ausstrecken. In Verbindung mit כַּף gibt „öffnet“ die Geste der Großzügigkeit idiomatisch wieder; „breitet aus“ bleibt als lexikalische Alternative erhalten.
- source_word: לֶעָנִי
  choice: für den Armen
  rationale: עָנִי kann arm, bedrängt oder sozial schwach bedeuten. Hier legt die konkrete Hilfe den wirtschaftlich-sozialen Sinn „arm“ nahe. „Für“ macht den helfenden Zweck im Deutschen natürlich deutlich, ohne die Zuwendung auf eine bloße Übergabe zu verengen.
- source_word: יָדֶיהָ
  choice: ihre Hände
  rationale: Die Form bezeichnet hier beide Hände und wird direkt und bildhaft wiedergegeben.
- source_word: שִׁלְּחָה
  choice: streckt … entgegen
  rationale: Das Piel von שלח kann aussenden oder ausstrecken bedeuten. Mit „Hände“ und einem Empfänger bezeichnet es eine aktive, helfende Zuwendung; „entgegenstrecken“ ist im Deutschen anschaulich und würdevoll.
- source_word: לָאֶבְיוֹן
  choice: dem Bedürftigen
  rationale: אֶבְיוֹן bezeichnet einen Menschen, dem es am Nötigen fehlt. „Bedürftiger“ wahrt die begriffliche Unterscheidung zu עָנִי („Armer“) im ersten Halbvers.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Der Parallelismus zwischen „Armen“ und „Bedürftigen“ sowie zwischen „Hand“ und „Händen“ bleibt sichtbar; die beiden Gesten werden natürlich, aber quellenah formuliert.
