  yaml_path: translation/ot/proverbs/031/002.yaml
  text: What[a], my son? And what, son of my womb? And what, son of my vows?
translation:
  language: de
  text: Was, mein Sohn? Und was, Sohn meines Leibes? Und was, Sohn meiner Gelübde?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß kann man ergänzen: „Was soll ich sagen, mein Sohn? Und was soll ich sagen, Sohn meines Leibes? Und was soll ich sagen, Sohn meiner Gelübde?“ Im Hebräischen steht zur eindringlichen Wirkung dreimal nur „Was?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Was
  rationale: Das dreimalige Fragewort wird knapp und unverändert wiedergegeben. So bleiben die eindringliche, rhetorische Wirkung und die Ellipse des Hebräischen erhalten.
- source_word: בְּרִי
  choice: mein Sohn
  rationale: בַּר mit Suffix der 1. Person Singular bezeichnet hier den Sohn der redenden Mutter. Die geschlechtsspezifische und familiäre Anrede bleibt erhalten.
- source_word: בַּר
  choice: Sohn
  rationale: Die konsequente Wiedergabe als „Sohn“ bewahrt die dreigliedrige poetische Anrede und neutralisiert die maskuline Form nicht.
- source_word: בִּטְנִי
  choice: meines Leibes
  rationale: בֶּטֶן kann Bauch, Leib oder Mutterleib bezeichnen. Im Deutschen ist „Sohn meines Leibes“ eine natürliche, würdige Wendung, die in diesem mütterlichen Zusammenhang die Herkunft aus ihrem Mutterleib ausdrückt.
- source_word: נְדָרָי
  choice: meiner Gelübde
  rationale: נֶדֶר bezeichnet ein Gelübde. Der Plural mit Suffix wird wörtlich wiedergegeben, ohne den nicht genannten Inhalt oder Anlass dieser Gelübde näher festzulegen.
theological_decisions:
- issue: Aussagekraft der dreifachen rhetorischen Anrede
  choice: 'Drei knappe, elliptische Fragen: „Was …? Was …? Was …?“'
  alternative: 'Sinngemäß ergänzt: „Was soll ich dir sagen …?“'
  rationale: Der hebräische Text nennt kein Verb. Die knappe Form erhält seine emotionale Spannung und vermeidet es, eine bestimmte Ergänzung verbindlich in den Haupttext einzutragen.
- issue: Geschlechtsspezifische Sohnesbezeichnung
  choice: „mein Sohn“ / „Sohn meines Leibes“ / „Sohn meiner Gelübde“
  alternative: „mein Kind“ / „Kind meines Leibes“ / „Kind meiner Gelübde“
  rationale: Das dreimal verwendete בַּר ist maskulin und meint einen Sohn. Diese Form wird bewahrt.
- issue: Beziehung zwischen dem Sohn und den Gelübden
  choice: Die offene Formulierung „Sohn meiner Gelübde“ bleibt stehen.
  alternative: Ausdeutung als ein aufgrund eines Gelübdes erbetener oder Gott geweihter Sohn
  rationale: Der Text erläutert weder Inhalt noch Anlass der Gelübde. Eine genauere heilsgeschichtliche oder kultische Deutung würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, poetisch verdichtete Dreierform und die Ellipse des Ausgangstextes werden bewusst erhalten; die Fußnote erschließt die naheliegende sinngemäße Ergänzung.
