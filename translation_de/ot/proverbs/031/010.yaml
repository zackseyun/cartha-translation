  text: אֵֽשֶׁת חַ֭יִל מִ֣י יִמְצָ֑א וְ/רָחֹ֖ק מִ/פְּנִינִ֣ים מִכְרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/010.yaml
  text: A wife of noble character—who can find? Her value is far beyond jewels[a][b][c].
translation:
  language: de
  text: Eine tüchtige Frau – wer findet sie? Ihr Wert übertrifft den von Edelsteinen bei Weitem.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine tüchtige Ehefrau“; das hebräische Wort kann „Frau“ oder „Ehefrau“ bedeuten. Der Zusammenhang von Haushalt und Familie spricht hier besonders für „Ehefrau“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann kostbare Steine oder Schmuckstücke bezeichnen; auch „Perlen“, „Korallen“ oder traditionell „Rubine“ werden vorgeschlagen. Die genaue Art ist unsicher.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „Ihr Wert ist weit entfernt von Edelsteinen“, das heißt: Er liegt weit über ihrem Wert.'
    reason: translation_clarity
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: eine tüchtige Frau
  rationale: Die Verbindung bezeichnet eine Frau von Kraft, Fähigkeit, Tatkraft und hohem Wert. „Tüchtig“ ist im Deutschen idiomatisch, würdevoll und umfasst im folgenden Haushaltskontext praktische Kompetenz sowie charakterliche Stärke; אֵשֶׁת kann je nach Kontext auch ausdrücklich „Ehefrau“ bedeuten.
- source_word: מִי יִמְצָא
  choice: wer findet sie?
  rationale: Das Imperfekt steht in einer rhetorischen Frage und hebt die Seltenheit einer solchen Frau hervor. Die knappe Gegenwartsform entspricht dem hebräischen Ausdruck, ohne die Modalität unnötig auf „kann“ festzulegen.
- source_word: וְרָחֹק ... מִכְרָהּ
  choice: Ihr Wert übertrifft ... bei Weitem
  rationale: 'Wörtlich ist ihr Wert beziehungsweise Preis „fern von“ den Kostbarkeiten. Die gewählte deutsche Vergleichsform gibt den Sinn natürlicher wieder: Ihr Wert liegt weit über ihrem Wertmaßstab.'
- source_word: פְּנִינִים
  choice: Edelsteine
  rationale: Der genaue kostbare Stoff ist unsicher; vorgeschlagen werden unter anderem Perlen, Korallen und Rubine. „Edelsteine“ bewahrt den allgemeinen Sinn wertvoller Kostbarkeiten, ohne eine nicht gesicherte Identifizierung festzuschreiben.
- source_word: מִכְרָהּ
  choice: ihr Wert
  rationale: Das Wort bezeichnet Preis beziehungsweise Wert. „Wert“ erhält den Vergleich, vermeidet aber im Deutschen den reduktiven Eindruck, die Frau werde als Handelsware bewertet.
theological_decisions:
- issue: Reichweite von אֵשֶׁת im Kontext
  choice: Frau
  alternative: Ehefrau
  rationale: Die Grundbedeutung lässt sowohl „Frau“ als auch „Ehefrau“ zu. Der anschließende Haushalts- und Familienkontext begünstigt „Ehefrau“, doch „Frau“ bewahrt die lexikalische Offenheit und ist auch im Deutschen für die dargestellte verheiratete Frau natürlich.
- issue: Charakterisierung durch חַיִל
  choice: tüchtig
  alternative: von edlem Charakter / stark / vortrefflich
  rationale: חַיִל bündelt Stärke, Befähigung, Tatkraft und Wert. „Tüchtig“ bildet diese Mehrdimensionalität im Kontext besser ab als eine ausschließlich moralische oder militärische Festlegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, sprichwörtlicher Satzführung. „Tüchtig“ wird hier nicht bloß im Sinn häuslicher Geschäftigkeit verwendet, sondern als umfassende Bezeichnung für Kraft, Befähigung, Tatkraft und charakterlichen Wert. Die Gedankenstrichkonstruktion erhält den rhetorischen Nachdruck.
