  naturalness: Die vorgeschlagene Fassung ist modernes, würdiges Deutsch. „Sie erwägt ein Feld und erwirbt es“ ist knapp, idiomatisch und bildet die hebräische Reihung gut ab. Der Marker zur idiomatischen Wendung soll unmittelbar bei „Ertrag ihrer Hände“ stehen, nicht bei „Weinberg“.
  terminology: „Feld“, „erwirbt“, „Ertrag ihrer Hände“ und „Weinberg“ sind angemessene und natürliche Wiedergaben. Die Fußnote zu זממה/לקח wird sprachlich und sachlich korrigiert; insbesondere ist „plant wegen eines Feldes“ keine tragfähige deutsche Wiedergabe der hebräischen Konstruktion.
