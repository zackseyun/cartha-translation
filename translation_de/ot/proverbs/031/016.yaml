  rationale: Die Revision ersetzt die zu spezifische Wendung „nimmt es in Besitz“ durch „erwirbt es“, bereinigt die irreführende Alternativübersetzung in Fußnote a und setzt den kulturellen Fußnotenanker an die tatsächlich erläuterte hebräische Idiomatik. Die Aussage und die offene Frage nach der konkreten Erwerbsart bleiben erhalten.
