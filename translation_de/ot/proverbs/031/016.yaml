  text: She considers a field and acquires it[b][a]; from the fruit of her hands she plants a vineyard.
translation:
  language: de
  text: Sie erwägt ein Feld[a] und erwirbt es; aus dem Ertrag ihrer Hände[b] pflanzt sie einen Weinberg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie fasst ein Feld ins Auge und nimmt es.“ Die hebräischen Verben bezeichnen zielgerichtetes Erwägen oder Planen und anschließendes Nehmen beziehungsweise Erwerben; ein Kauf wird nicht ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von der Frucht ihrer Hände“; gemeint ist der Ertrag oder Erlös ihrer Arbeit.'
    reason: cultural_note
lexical_decisions:
- source_word: זָמְמָה
  choice: sie überlegt
  rationale: Das Verb bezeichnet hier zielgerichtetes Erwägen oder Planen. „Sie überlegt“ gibt die bewusste Abwägung natürlich wieder, ohne bloßes Begehren oder einen bereits feststehenden Plan vorauszusetzen.
- source_word: שָׂדֶה
  choice: ein Feld
  rationale: שָׂדֶה bezeichnet gewöhnlich ein Feld beziehungsweise landwirtschaftlich nutzbares Land; „Feld“ ist direkt und im Deutschen natürlich.
- source_word: וַתִּקָּחֵהוּ
  choice: und nimmt es in Besitz
  rationale: לקח bedeutet grundsätzlich „nehmen“ oder „erwerben“. Im wirtschaftlichen Zusammenhang bezeichnet „in Besitz nehmen“ den Erwerb, ohne ausdrücklich einen Kauf zu behaupten.
- source_word: מִפְּרִי כַפֶּיהָ
  choice: vom Ertrag ihrer Hände
  rationale: Wörtlich steht „von der Frucht ihrer Hände“. „Ertrag ihrer Hände“ bewahrt das Bild weitgehend und macht zugleich verständlich, dass das Ergebnis beziehungsweise der Erlös ihrer Arbeit gemeint ist.
- source_word: נטע
  choice: pflanzt sie
  rationale: Der überlieferte Konsonantentext kann formal als maskuline Form gelesen werden, doch der fortlaufende Kontext hat die Frau als handelndes Subjekt; die deutsche Syntax gibt dies entsprechend feminin wieder.
- source_word: כָּרֶם
  choice: einen Weinberg
  rationale: כָּרֶם ist die übliche Bezeichnung für einen Weinberg.
theological_decisions: []
