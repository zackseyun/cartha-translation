    rationale: „und ihre Hände arbeiten mit Freude“ verschiebt das Subjekt von der Frau auf ihre Hände. Der hebräische Verbform entsprechend ist die Frau Subjekt; ihre Hände stehen als instrumentale Körperteilbezeichnung.
