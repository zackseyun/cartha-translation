base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/013.yaml
  text: She seeks wool and flax[a], and works with willing hands.
translation:
  language: de
  text: Sie sucht Wolle und Flachs und arbeitet bereitwillig mit ihren Händen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und arbeitet gern mit ihren Händen“ oder „und arbeitet mit Freude mit ihren Händen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרְשָׁה
  choice: sucht
  rationale: Das Verb bezeichnet ein aktives Suchen oder Sichbemühen. „Sucht“ bewahrt diese Aussage, ohne festzulegen, ob sie die Materialien auswählt, beschafft oder erst ausfindig macht.
- source_word: צֶמֶר
  choice: Wolle
  rationale: Das Substantiv bezeichnet eindeutig Wolle als Ausgangsmaterial für Textilarbeit.
- source_word: וּפִשְׁתִּים
  choice: und Flachs
  rationale: Der hebräische Ausdruck nennt Flachs als Pflanze beziehungsweise Rohmaterial. „Leinen“ würde bereits stärker das verarbeitete Erzeugnis bezeichnen.
- source_word: וַתַּעַשׂ
  choice: und arbeitet
  rationale: Das breite Verb עשה bedeutet „tun“ oder „machen“. Im Zusammenhang der Verarbeitung von Wolle und Flachs gibt „arbeitet“ die produktive Tätigkeit natürlich wieder.
- source_word: בְּחֵפֶץ
  choice: mit Freude
  rationale: חֵפֶץ kann Wohlgefallen, Freude, Wunsch oder Bereitwilligkeit ausdrücken. „Mit Freude“ ist im Deutschen idiomatisch und bewahrt die positive innere Haltung, ohne bloß äußeren Fleiß zu behaupten.
- source_word: כַּפֶּיהָ
  choice: mit ihren Händen
  rationale: כף bezeichnet wörtlich die Handfläche, steht hier aber natürlich für die Hände als Werkzeuge ihrer Arbeit.
