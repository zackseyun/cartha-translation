  verdict: revise
  source_fidelity: 'Die Übersetzung trifft die Grundbedeutung: דָּרְשָׁה bezeichnet ihr aktives Suchen nach Wolle und Flachs; וַתַּעַשׂ beschreibt ihre Arbeit, und כַּפֶּיהָ meint idiomatisch ihre Hände. Für בְּחֵפֶץ ist „bereitwillig“ eine präzise, kontextgerechte Wiedergabe, die sowohl positive Bereitschaft als auch Freude einschließt.'
