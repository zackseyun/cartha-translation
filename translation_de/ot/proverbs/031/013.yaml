  terminology: „Wolle“ und „Flachs“ sind korrekt und entsprechen den genannten Rohmaterialien. „Hände“ ist hier gegenüber dem wörtlichen „Handflächen“ idiomatisch richtig. Die Fußnote sollte keine Umdeutung zu einem Satz mit „ihre Hände“ als Subjekt nahelegen, da das Hebräische die Frau als Subjekt von „arbeitet“ hat.
