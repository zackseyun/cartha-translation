source:
  edition: WLC
  text: צ֭וֹפִיָּה הֲלִיכ֣וֹת בֵּיתָ֑/הּ וְ/לֶ֥חֶם עַ֝צְל֗וּת לֹ֣א תֹאכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/027.yaml
  text: She watches over the ways of her household[b][a], and does not eat the bread of idleness.
translation:
  language: de
  text: Sie achtet auf die Abläufe ihres Haushalts[a] und isst nicht das Brot der Faulheit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie beobachtet die Wege/Gänge ihres Hauses“; gemeint sein können die Abläufe oder Angelegenheiten ihres Haushalts.'
    reason: lexical_alternative
  - marker: b
    text: „Das Brot der Faulheit“ ist ein hebräisches Bild für ein Leben in Trägheit oder für unproduktive Bequemlichkeit.
    reason: cultural_note
lexical_decisions:
- source_word: צוֹפִיָּה
  choice: sie achtet auf
  rationale: Das feminine Qal-Partizip bezeichnet eine fortdauernde, aufmerksame Beobachtung. „Sie achtet auf“ gibt diese gewohnheitsmäßige Wachsamkeit in natürlichem Deutsch wieder.
- source_word: הֲלִיכוֹת
  choice: die Vorgänge
  rationale: Das Substantiv bezeichnet wörtlich die „Gänge“ oder „Wege“. Im Zusammenhang sind die Abläufe und Tätigkeiten des Hauses gemeint; „Vorgänge“ bewahrt die konkrete Bewegungsnuance besser als das stärker abstrahierende „Angelegenheiten“.
- source_word: בֵּיתָהּ
  choice: in ihrem Haushalt
  rationale: בַּיִת kann sowohl das Haus als Gebäude als auch die Hausgemeinschaft bezeichnen. Hier legt die Aufsicht über dessen Abläufe den funktionalen Sinn „Haushalt“ nahe.
- source_word: לֶחֶם
  choice: Brot
  rationale: Die wörtliche Bedeutung „Brot“ bewahrt das hebräische Bild dessen, wovon jemand lebt oder sich nährt.
- source_word: עַצְלוּת
  choice: Faulheit
  rationale: Das Wort bezeichnet Trägheit oder Faulheit. „Faulheit“ ist gegenwärtig, verständlich und erhält die moralische Wertung des Ausdrucks.
- source_word: לֹא תֹאכֵל
  choice: isst nicht
  rationale: Das Imperfekt beschreibt im sprichwörtlichen Zusammenhang ein kennzeichnendes Verhalten, nicht primär eine zukünftige Handlung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Struktur und das konkrete Bild vom „Brot der Faulheit“ bleiben erhalten; die schwer wörtlich übertragbare Wendung „Gänge ihres Hauses“ wird im Haupttext verständlich als „Vorgänge in ihrem Haushalt“ wiedergegeben und in der Fußnote erläutert.
