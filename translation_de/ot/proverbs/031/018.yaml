source:
  edition: WLC
  text: טָ֭עֲמָה כִּי ט֣וֹב סַחְרָ֑/הּ לֹֽא יִכְבֶּ֖ה ב/ליל נֵרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/018.yaml
  text: She perceives that her merchandise is good[b][a]; her lamp does not go out at night.
translation:
  language: de
  text: Sie erkennt, dass ihr Handel gut ist[a][b]; nachts erlischt ihre Lampe nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Sie schmeckt, dass …“; „schmecken“ bezeichnet hier eine durch Erfahrung gewonnene Einschätzung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Handelsware“ oder „ihr Gewinn“ ist gut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָעֲמָה
  choice: sie erkennt
  rationale: Das Verb bedeutet wörtlich „schmecken“, kann aber eine durch Erfahrung gewonnene Wahrnehmung oder Einsicht bezeichnen. „Sie erkennt“ gibt diesen Sinn im Deutschen natürlich wieder, ohne ein buchstäbliches Kosten nahezulegen.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier am natürlichsten den Inhalt dessen ein, was sie erkennt.
- source_word: טוֹב
  choice: gut
  rationale: „Gut“ bewahrt die breite Bedeutung des hebräischen Adjektivs; im Handelszusammenhang kann dabei auch Erfolg oder Gewinn mitschwingen, ohne ausdrücklich festgelegt zu werden.
- source_word: סַחְרָהּ
  choice: ihr Handel
  rationale: Das Substantiv kann Handel, Handelsware oder den daraus erzielten Gewinn bezeichnen. „Ihr Handel“ ist im Kontext verständlich und lässt die wirtschaftliche Nuance offen.
- source_word: לֹא יִכְבֶּה
  choice: erlischt … nicht
  rationale: „Erlöschen“ ist die natürliche deutsche Bezeichnung dafür, dass eine Lampe ausgeht, und passt zum bildhaften, würdigen Register.
- source_word: בַלַּיְלָה
  choice: nachts
  rationale: „Nachts“ ist eine knappe und natürliche moderne deutsche Zeitangabe.
- source_word: נֵרָהּ
  choice: ihre Lampe
  rationale: Das hebräische Wort bezeichnet konkret eine Lampe und bewahrt so das häusliche Bild des Verses.
