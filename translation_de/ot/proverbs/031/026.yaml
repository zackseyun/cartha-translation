id: PRO.31.26
reference: Proverbs 31:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: פִּ֭י/הָ פָּתְחָ֣ה בְ/חָכְמָ֑ה וְ/תֽוֹרַת חֶ֝֗סֶד עַל לְשׁוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/026.yaml
  text: She opens her mouth with wisdom[b][a], and the instruction of kindness is on her tongue.
translation:
  language: de
  text: Sie öffnet ihren Mund mit Weisheit, und die Weisung[a] der Güte[b] ist auf ihrer Zunge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Unterweisung« beziehungsweise »Lehre«. Das hebräische Wort תּוֹרָה kann auch »Gesetz« bedeuten, bezeichnet hier aber wahrscheinlich allgemeiner Anleitung oder Lehre.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »beständige Liebe«, »Barmherzigkeit« oder »treue Liebe«. Die Verbindung kann auch als »gütige Unterweisung« oder »Weisung zur Güte« verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיהָ
  choice: ihren Mund
  rationale: Die konkrete hebräische Wendung bleibt erhalten; im Deutschen wird sie selbstverständlich als Bild für das Sprechen verstanden.
- source_word: פָּתְחָה
  choice: öffnet
  rationale: Das Perfekt beschreibt im poetischen Zusammenhang ein kennzeichnendes Verhalten; dafür ist das deutsche Präsens passend.
- source_word: בְחָכְמָה
  choice: mit Weisheit
  rationale: Die Formulierung bewahrt den instrumentalen beziehungsweise begleitenden Sinn der Präposition und klingt zugleich natürlich.
- source_word: וְתוֹרַת
  choice: die Weisung
  rationale: תּוֹרָה bezeichnet hier eher Unterweisung oder Lehre als ein einzelnes Gesetz. »Weisung« wahrt den anleitenden Sinn und bleibt knapp.
- source_word: חֶסֶד
  choice: Güte
  rationale: In diesem zwischenmenschlichen Weisheitskontext bezeichnet חֶסֶד wohl eine wohlwollende, verlässliche Haltung. »Güte« ist dafür im Deutschen natürlich, ohne mögliche Aspekte wie Treue oder Erbarmen auszuschließen.
- source_word: תּוֹרַת חֶסֶד
  choice: die Weisung der Güte
  rationale: Die nominale Verbindung des Hebräischen bleibt sichtbar. Die Formulierung lässt offen, ob Güte den Inhalt, die Art oder die Haltung der Weisung bezeichnet.
- source_word: עַל לְשׁוֹנָהּ
  choice: ist auf ihrer Zunge
  rationale: Das hebräische Bild wird eng und im Deutschen verständlich wiedergegeben; es bezeichnet ihre bereite und kennzeichnende Rede.
theological_decisions:
- issue: Bedeutungsverhältnis in תּוֹרַת חֶסֶד
  choice: Weisung der Güte
  alternative: gütige Unterweisung; Weisung zur Güte
  rationale: Die hebräische Genitivverbindung legt nicht eindeutig fest, ob die Weisung von Güte geprägt ist oder Güte zum Gegenstand hat. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Wahrung der hebräischen Bildsprache. »Weisung der Güte« ist bewusst leicht gehoben und erhält die Mehrdeutigkeit der hebräischen Nominalverbindung.
