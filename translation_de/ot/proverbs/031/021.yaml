  text: לֹא תִירָ֣א לְ/בֵיתָ֣/הּ מִ/שָּׁ֑לֶג כִּ֥י כָל בֵּ֝יתָ֗/הּ לָבֻ֥שׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/021.yaml
  text: She does not fear snow for her household[a], for all her household are clothed in scarlet.
translation:
  language: de
  text: Sie fürchtet keinen Schnee für ihren Haushalt, denn alle in ihrem Haus sind in Scharlach gekleidet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn alle in ihrem Haus tragen doppelte Kleidung“. Manche verstehen das hebräische Wort שָׁנִים hier im Sinn von doppelter Kleidung statt von Scharlach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: fürchtet … nicht
  rationale: Das Qal-Imperfekt bezeichnet hier ihre anhaltende Furchtlosigkeit; die deutsche Konstruktion mit „keinen Schnee“ gibt dies natürlich wieder.
- source_word: לְבֵיתָהּ
  choice: für ihr Haus
  rationale: בַּיִת kann sowohl das Haus als auch die Hausgemeinschaft bezeichnen. „Haus“ bewahrt diese im Hebräischen vorhandene Bedeutungsbreite und ist im Deutschen in diesem Sinn verständlich.
- source_word: מִשָּׁלֶג
  choice: keinen Schnee
  rationale: מִן bezeichnet den Anlass möglicher Sorge. In Verbindung mit „fürchten“ ist „keinen Schnee fürchten“ idiomatisches Deutsch.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für ihre Furchtlosigkeit ein.
- source_word: לָבֻשׁ
  choice: ist … gekleidet
  rationale: Das hebräische Prädikat steht formal im Singular und stimmt damit mit dem kollektiv gebrauchten „ganzes Haus“ überein.
- source_word: שָׁנִים
  choice: Scharlach
  rationale: Die gewöhnliche lexikalische Bedeutung ist „Scharlach“ beziehungsweise scharlachfarbener Stoff. Die kontextuell erwogene Deutung als doppelte Kleidung wird in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haus“ erhält die mögliche Doppelbedeutung von Wohnhaus und Hausgemeinschaft; die singularische Formulierung folgt zugleich der hebräischen Grammatik.
