  text: פְּתַח פִּ֥י/ךָ שְׁפָט צֶ֑דֶק וְ֝/דִ֗ין עָנִ֥י וְ/אֶבְיֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/009.yaml
  text: Open your mouth[a], judge righteously, and plead the cause of the poor and needy.
translation:
  language: de
  text: Öffne deinen Mund[a], urteile gerecht und verhilf den Armen und Bedürftigen zu ihrem Recht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Erhebe deine Stimme.'
    reason: Das hebräische Bild „den Mund öffnen“ ist eine Aufforderung, offen und nachdrücklich zu sprechen.
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  choice: Tu deinen Mund auf
  rationale: Die wörtliche Wiedergabe bewahrt das hebräische Bild; zugleich ist die Wendung im Deutschen als nachdrückliche Aufforderung zum Reden verständlich.
- source_word: שְׁפָט צֶדֶק
  choice: urteile gerecht
  rationale: שְׁפָט ist ein richterlicher Imperativ, während צֶדֶק hier adverbial die gerechte Art des Urteilens bezeichnet. „Urteile gerecht“ ist präzise und natürlich.
- source_word: וְדִין
  choice: und verhilf … zu ihrem Recht
  rationale: דין kann das Führen, Vertreten oder Entscheiden einer Rechtssache bezeichnen. Im Parallelismus fordert die Wendung dazu auf, zugunsten Schutzbedürftiger Recht durchzusetzen; die deutsche Formulierung wahrt diesen gerichtlichen Sinn.
- source_word: עָנִי וְאֶבְיוֹן
  choice: den Armen und Bedürftigen
  rationale: עָנִי bezeichnet hier sozial Bedrängte oder Arme, אֶבְיוֹן besonders Bedürftige. Die Paarung gibt beide eng verwandten, aber nicht völlig identischen Begriffe verständlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild vom geöffneten Mund bleibt im Haupttext erhalten; die gerichtliche Sprache wird klar und ohne unnötigen Fachjargon wiedergegeben.
