  text: יָ֭דֶי/הָ שִׁלְּחָ֣ה בַ/כִּישׁ֑וֹר וְ֝/כַפֶּ֗י/הָ תָּ֣מְכוּ פָֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/019.yaml
  text: She stretches out her hands to the distaff[a], and her palms hold the spindle.
translation:
  language: de
  text: Sie streckt ihre Hände nach dem Spinnrocken[a] aus, und ihre Handflächen halten die Spindel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie legt ihre Hände an den Spinnrocken, und ihre Handflächen greifen die Spindel.“'
    reason: 'Lexikalische Alternative: שׁלח mit ב kann hier auch das Anlegen beziehungsweise Hinführen der Hände ausdrücken; תמך kann stärker als „ergreifen“ verstanden werden.'
lexical_decisions:
- source_word: יָדֶיהָ
  choice: ihre Hände
  rationale: Die Dualform mit Suffix der 3. Person Singular feminin bezeichnet hier natürlich beide Hände der beschriebenen Frau.
- source_word: שִׁלְּחָה
  choice: streckt … aus
  rationale: Die Piel-Form von שׁלח beschreibt hier eine zielgerichtete Bewegung der Hände. „Ausstrecken“ bewahrt das konkrete Bild und ist im Deutschen idiomatisch.
- source_word: בַכִּישׁוֹר
  choice: nach dem Spinnrocken
  rationale: כִּישׁוֹר bezeichnet ein Gerät zum Spinnen, wahrscheinlich den Spinnrocken. Die Präposition wird im Zusammenhang mit „ausstrecken“ richtungsbezogen als „nach“ wiedergegeben; zugleich wird das Gerät von פָלֶךְ unterschieden.
- source_word: וְכַפֶּיהָ
  choice: und ihre Handflächen
  rationale: כַּף bezeichnet genauer die Handfläche beziehungsweise die hohle Hand. „Handflächen“ erhält das körperliche Bild und die poetische Variation gegenüber „Hände“.
- source_word: תָּמְכוּ
  choice: halten
  rationale: תמך kann „stützen“, „halten“ oder „ergreifen“ bedeuten. „Halten“ passt knapp und natürlich zur Handhabung des Spinngeräts, ohne die genaue Bewegung stärker festzulegen als der Ausgangstext.
- source_word: פָלֶךְ
  choice: die Spindel
  rationale: פָלֶךְ bezeichnet ein Spinngerät, gewöhnlich die Spindel. Diese Wiedergabe erhält das Bild der Textilarbeit und unterscheidet das Gerät vom Spinnrocken im ersten Halbvers.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bezeichnungen „Spinnrocken“ und „Spindel“ bewahren das konkrete Bild traditioneller Textilarbeit; die parallele Unterscheidung von „Hände“ und „Handflächen“ folgt der hebräischen Bildsprache.
