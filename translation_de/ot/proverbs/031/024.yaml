source:
  edition: WLC
  text: סָדִ֣ין עָ֭שְׂתָה וַ/תִּמְכֹּ֑ר וַ֝/חֲג֗וֹר נָתְנָ֥ה לַֽ/כְּנַעֲנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/024.yaml
  text: She makes linen garments and sells them[c][b][a], and supplies belts to the merchant.
translation:
  language: de
  text: Sie fertigt Leinengewänder[a] an und verkauft sie; Gürtel[b] liefert sie dem Händler.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Leinentücher“ oder „feine Leinenkleider“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Schärpen“, die um die Hüfte getragen werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „dem Kanaaniter“; hier ist wahrscheinlich ein Händler oder Kaufmann gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָדִין
  choice: Leinengewänder
  rationale: Das Substantiv bezeichnet ein Erzeugnis aus Leinen, möglicherweise ein Tuch oder ein Kleidungsstück. Im Zusammenhang ihrer Handelstätigkeit gibt „Leinengewänder“ ein verkäufliches Fertigprodukt natürlich wieder, ohne die mögliche Bedeutung „Leinentuch“ zu verschweigen.
- source_word: עָשְׂתָה
  choice: fertigt … an
  rationale: Die Perfektform steht innerhalb der poetischen Schilderung ihrer typischen Tätigkeiten. Das deutsche Präsens gibt diesen gewohnheitsmäßigen Sinn passend wieder; „anfertigen“ betont die Herstellung.
- source_word: וַתִּמְכֹּר
  choice: und verkauft sie
  rationale: Die Verbfolge setzt die Beschreibung ihrer regelmäßigen Tätigkeit fort. Das Pronomen „sie“ nimmt im Deutschen natürlich die Leinengewänder wieder auf.
- source_word: חֲגוֹר
  choice: Gürtel
  rationale: Das Wort bezeichnet etwas, das um die Hüfte getragen wird. „Gürtel“ ist im modernen Deutsch klar und neutral; je nach Form sind auch „Schärpen“ möglich.
- source_word: נָתְנָה
  choice: liefert
  rationale: Wörtlich bedeutet das Verb „gibt“. Im eindeutig geschäftlichen Zusammenhang bezeichnet es hier plausibel das Liefern oder Überlassen von Handelsware.
- source_word: לַכְּנַעֲנִי
  choice: dem Händler
  rationale: Wörtlich steht „dem Kanaaniter“. In diesem Handelszusammenhang kann die Bezeichnung jedoch beruflich beziehungsweise metonymisch „Händler“ bedeuten; diese Wiedergabe ist für heutige Leser unmittelbar verständlich.
theological_decisions:
- issue: Ethnische oder berufliche Deutung von כְּנַעֲנִי
  choice: Im Haupttext steht „Händler“.
  alternative: 'Wörtlich: „Kanaaniter“.'
  rationale: Der unmittelbare Zusammenhang von Herstellung, Verkauf und Lieferung spricht stark für die berufliche Bedeutung. Die wörtliche ethnische Bezeichnung bleibt in der Fußnote sichtbar, damit die genuine lexikalische Spannung nicht verloren geht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Präsens beschreibt die charakteristischen, wiederkehrenden Tätigkeiten der Frau. Der knappe Parallelismus und die Umstellung im zweiten Satzteil bewahren den poetischen Ton des Hebräischen.
