  text: lest he drink and forget what has been decreed[b][a], and pervert the justice due to all the afflicted.
translation:
  language: de
  text: Sonst könnte er trinken, das Festgesetzte[a] vergessen und das Recht aller Bedrängten[b] beugen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Vorschrift«; »was vorgeschrieben ist«.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch wörtlich: »Söhne der Bedrängnis«; gemeint sind Menschen, die Not leiden oder unterdrückt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: damit … nicht
  rationale: Leitet eine befürchtete Folge beziehungsweise eine Warnung ein und knüpft den Vers natürlich an den vorausgehenden Zusammenhang an.
- source_word: יִשְׁתֶּה וְיִשְׁכַּח
  choice: er nicht trinkt und … vergisst
  rationale: Gibt die beiden koordinierten, zu vermeidenden Handlungen schlicht und unmittelbar wieder.
- source_word: מְחֻקָּק
  choice: das Festgesetzte
  rationale: Bewahrt den passiven Sinn dessen, was festgesetzt oder vorgeschrieben wurde, ohne den Ausdruck vorschnell auf ein einzelnes Gesetz einzuengen.
- source_word: וִישַׁנֶּה
  choice: beugt
  rationale: Das Piel von שנה bezeichnet hier im richterlichen Zusammenhang eine unrechtmäßige Veränderung; die deutsche Wendung „das Recht beugen“ gibt diese rechtlich-ethische Wertung natürlich wieder.
- source_word: דִּין
  choice: das Recht
  rationale: Der Ausdruck bezeichnet hier Rechtsprechung, Rechtsanspruch oder gerechtes Urteil. „Das Recht“ lässt diese Bedeutungsbreite im Deutschen weitgehend offen.
- source_word: כָּל בְּנֵי עֹנִי
  choice: aller Bedrängten
  rationale: Die wörtliche Wendung „Söhne der Bedrängnis“ bezeichnet Menschen, die von Not, Leid oder Unterdrückung geprägt sind. „Bedrängte“ ist verständlich und weniger eng als ausschließlich „Arme“.
theological_decisions: []
