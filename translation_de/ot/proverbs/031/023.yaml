source:
  edition: WLC
  text: נוֹדָ֣ע בַּ/שְּׁעָרִ֣ים בַּעְלָ֑/הּ בְּ֝/שִׁבְתּ֗/וֹ עִם זִקְנֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/023.yaml
  text: Her husband is known in the gates[b][a], when he sits among the elders of the land.
translation:
  language: de
  text: Ihr Mann ist in den Toren bekannt[a][b], wenn er unter den Ältesten des Landes sitzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „In den Toren“ meint den öffentlichen Ort, an dem rechtliche, politische und gemeinschaftliche Angelegenheiten verhandelt wurden.
    reason: cultural_note
  - marker: b
    text: 'Oder: „anerkannt“ beziehungsweise „angesehen“. Wörtlich steht im Hebräischen: „bekannt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדָע
  choice: ist bekannt
  rationale: Das Nifal-Partizip von ידע bezeichnet hier das Bekannt- bzw. Anerkanntsein. „Ist bekannt“ bewahrt den passiv-stativen Sinn, ohne die im Kontext mögliche Wertschätzung ausdrücklich festzulegen.
- source_word: בַּשְּׁעָרִים
  choice: in den Toren
  rationale: Die Wendung bezeichnet wörtlich die Tore, die zugleich öffentlicher Ort für rechtliche, politische und gemeinschaftliche Angelegenheiten waren. Das Bild des Hebräischen bleibt im Text erhalten und wird in einer Fußnote erläutert.
- source_word: בַּעְלָהּ
  choice: ihr Mann
  rationale: בעל kann je nach Zusammenhang Besitzer, Herr oder Ehemann bedeuten. Im Porträt der tüchtigen Frau ist „ihr Mann“ der eindeutige kontextuelle Sinn.
- source_word: בְּשִׁבְתּוֹ
  choice: wenn er ... sitzt
  rationale: Die Präposition ב mit Infinitivus constructus und Suffix wird hier natürlich als temporaler Begleitumstand wiedergegeben.
- source_word: עִם
  choice: unter
  rationale: Obwohl עִם grundsätzlich „mit“ bedeutet, drückt „unter“ im Deutschen idiomatisch seine Zugehörigkeit zur versammelten Gruppe der Ältesten aus.
- source_word: זִקְנֵי אָרֶץ
  choice: den Ältesten des Landes
  rationale: Die Wiedergabe folgt dem Wortlaut und verengt אֶרֶץ nicht ohne textliche Grundlage auf „Stadt“.
theological_decisions: []
