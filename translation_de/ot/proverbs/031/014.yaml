  text: הָ֭יְתָה כָּ/אֳנִיּ֣וֹת סוֹחֵ֑ר מִ֝/מֶּרְחָ֗ק תָּבִ֥יא לַחְמָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/014.yaml
  text: She is like merchant ships[a]; from far away she brings her food.
translation:
  language: de
  text: Sie ist wie Handelsschiffe; von weit her bringt sie ihre Nahrung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Brot“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: Sie ist
  rationale: Das Qal Perfekt 3. Person Feminin Singular von היה beschreibt hier im Zusammenhang eines sprichwörtlichen Porträts eine charakteristische, fortdauernde Eigenschaft. Daher ist das deutsche Präsens angemessen.
- source_word: כָּאֳנִיּוֹת סוֹחֵר
  choice: wie Handelsschiffe
  rationale: כְּ kennzeichnet den Vergleich; אֳנִיּוֹת bedeutet „Schiffe“, und סוֹחֵר bestimmt sie als Schiffe des Handels. „Handelsschiffe“ ist im Deutschen knapp und natürlich.
- source_word: מִמֶּרְחָק
  choice: aus der Ferne
  rationale: Die Verbindung aus מִן und מֶרְחָק bezeichnet die Herkunft aus großer Entfernung. „Aus der Ferne“ gibt dies in würdigem, gegenwärtigem Deutsch wieder.
- source_word: תָּבִיא
  choice: bringt … herbei
  rationale: Das Hifil von בוא bedeutet „bringen“. Das trennbare Verb „herbeibringen“ verdeutlicht hier idiomatisch, dass sie die Versorgung von einem entfernten Ort beschafft.
- source_word: לַחְמָהּ
  choice: ihre Nahrung
  rationale: לֶחֶם bezeichnet wörtlich „Brot“, kann aber weiter gefasst für Nahrung oder Lebensmittel stehen. Im Zusammenhang der Versorgung des Haushalts ist „Nahrung“ passend; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdiger Bildsprache. Der Vergleich mit dem Plural „Handelsschiffe“ und die räumliche Aussage „aus der Ferne“ bleiben eng am hebräischen Text.
