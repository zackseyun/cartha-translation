  text: וַ/תָּ֤קָם בְּ/ע֬וֹד לַ֗יְלָה וַ/תִּתֵּ֣ן טֶ֣רֶף לְ/בֵיתָ֑/הּ וְ֝/חֹ֗ק לְ/נַעֲרֹתֶֽי/הָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/015.yaml
  text: She rises while it is still night and gives food to her household and portions to her servant girls[a].
translation:
  language: de
  text: Noch in der Nacht steht sie auf und gibt ihrem Haushalt zu essen und ihren Dienerinnen einen festgesetzten Anteil[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und ihren Dienerinnen eine festgelegte Zuteilung«. Das hebräische Wort kann einen vorgeschriebenen Anteil oder eine feste Zuweisung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: steht sie auf
  rationale: Das Qal-Wayyiqtol von קום wird im Rahmen der sprichwörtlichen Charakterbeschreibung idiomatisch im Präsens wiedergegeben.
- source_word: בְּעוֹד לַיְלָה
  choice: Noch in der Nacht
  rationale: Die Formulierung bewahrt die zeitliche Aussage des Hebräischen, ohne sie präziser als »vor Tagesanbruch« festzulegen.
- source_word: וַתִּתֵּן
  choice: und gibt
  rationale: נתן ist das gewöhnliche Verb für »geben«; die direkte Wiedergabe passt zum beschreibenden Präsens.
- source_word: טֶרֶף
  choice: zu essen
  rationale: טֶרֶף kann wörtlich »Beute« bedeuten, bezeichnet hier im häuslichen Versorgungskontext jedoch Nahrung.
- source_word: לְבֵיתָהּ
  choice: ihrem Haushalt
  rationale: בַּיִת bezeichnet hier nicht nur das Gebäude, sondern die darin lebende Hausgemeinschaft.
- source_word: וְחֹק
  choice: den ihnen zustehenden Anteil
  rationale: חֹק bezeichnet eine festgesetzte Zuteilung oder einen gebührenden Anteil. Die Formulierung lässt offen, ob besonders an eine Lebensmittelration oder allgemeiner an eine festgelegte Zuweisung gedacht ist.
- source_word: לְנַעֲרֹתֶיהָ
  choice: ihren Dienerinnen
  rationale: נַעֲרוֹת bezeichnet hier junge Frauen im Dienst des Haushalts; »Dienerinnen« ist natürlich, würdevoll und weniger missverständlich als »Mädchen«.
theological_decisions: []
