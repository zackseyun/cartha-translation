  yaml_path: translation/ot/proverbs/031/001.yaml
  text: 'The words of King Lemuel[b][a], an oracle that his mother taught him:'
translation:
  language: de
  text: 'Die Worte Lemuels, des Königs: ein Ausspruch[a], den seine Mutter ihm lehrte[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Worte Lemuels, des Königs von Massa, die seine Mutter ihm lehrte.“ Das hebräische Wort מַשָּׂא kann „Ausspruch“ bedeuten oder als Ortsname „Massa“ verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Das mit „lehrte“ wiedergegebene Verb kann auch „unterwies“, „ermahnte“ oder „erzog“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Die Worte
  rationale: Die Konstruktus-Pluralform von דָּבָר leitet die Überschrift einer Sammlung ein. „Die Worte“ gibt die hebräische Form direkt und im Deutschen natürlich wieder.
- source_word: לְמוּאֵל
  choice: Lemuël
  rationale: Der Personenname wird in einer im Deutschen lesbaren Form transliteriert; das Trema zeigt die getrennte Aussprache der Vokale an.
- source_word: מֶלֶךְ
  choice: des Königs
  rationale: מֶלֶךְ bezeichnet Lemuël als König. Die deutsche Apposition im Genitiv fügt sich natürlich in die Überschrift ein.
- source_word: מַשָּׂא
  choice: ein Ausspruch
  rationale: מַשָּׂא kann einen gewichtigen, besonders prophetischen Ausspruch bezeichnen. „Ausspruch“ bewahrt einen würdigen, relativ offenen Sinn; die mögliche Deutung als Ortsname „Massa“ wird in der Fußnote genannt.
- source_word: אֲשֶׁר
  choice: den
  rationale: Das Relativpronomen bezieht sich im Deutschen auf den maskulinen „Ausspruch“ und verbindet ihn mit dem folgenden Satz.
- source_word: יִסְּרַתּוּ
  choice: ihn lehrte
  rationale: Das Verb יסר umfasst unterweisen, zurechtweisen und erziehen. Im Zusammenhang mütterlicher Weisheitsunterweisung ist „lehrte“ natürlich, ohne die weitergehenden Bedeutungsnuancen zu leugnen.
- source_word: אִמּוֹ
  choice: seine Mutter
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der dritten Person Singular maskulin.
theological_decisions:
- issue: Deutung von מַשָּׂא
  choice: „ein Ausspruch“ als Gattungsbezeichnung
  alternative: „Lemuël, König von Massa“ mit Massa als Ortsname
  rationale: Die masoretische Vokalisierung und ein geläufiger Gebrauch des Wortes stützen die Gattungsbezeichnung, doch die geografische Lesart ist sprachlich möglich und wird deshalb ausdrücklich bewahrt.
- issue: Bedeutungsumfang von יסר
  choice: „lehrte“ im Haupttext
  alternative: „unterwies“, „ermahnte“, „züchtigte“ oder „erzog“
  rationale: Der unmittelbare Kontext führt eine von der Mutter vermittelte Weisheitsrede ein. „Lehrte“ trifft diese Funktion gut; eine Fußnote bewahrt den weiteren Bedeutungsumfang des Verbs.
translation_notes:
  register: Moderne, würdige Überschriftensprache. Der Gedankenstrich macht die appositionelle Struktur verständlich, ohne die knappe Form des Hebräischen unnötig auszubauen. Die Fußnotenmarker stehen beide unmittelbar nach dem Versschluss und sind in der Reihenfolge [a], [b] angeordnet.
