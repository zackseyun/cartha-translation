  yaml_path: translation/ot/proverbs/031/031.yaml
  text: Give her of the fruit of her hands[b][a], and let her works praise her in the gates.
translation:
  language: de
  text: Gebt ihr vom Ertrag ihrer Hände, und an den Stadttoren sollen ihre Werke sie preisen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Ihre Taten sollen für sie sprechen.“ Im Hebräischen werden ihre Werke so dargestellt, als legten sie selbst öffentlich Zeugnis für ihren Wert ab.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in den Toren“. Die Stadttore waren im alten Israel öffentliche Orte der Rechtsprechung, Beratung und Anerkennung.'
    reason: cultural_note
lexical_decisions:
- source_word: תְּנוּ לָהּ
  choice: Gebt ihr
  rationale: Der pluralische Imperativ von נתן mit indirektem Objekt wird direkt und natürlich wiedergegeben.
- source_word: מִפְּרִי יָדֶיהָ
  choice: vom Ertrag ihrer Hände
  rationale: מִן bezeichnet hier Herkunft oder Anteil; פְּרִי wird als „Ertrag“ wiedergegeben, während „ihrer Hände“ das konkrete hebräische Bild für ihre Arbeit bewahrt.
- source_word: וִיהַלְלוּהָ
  choice: und … sollen sie preisen
  rationale: Die mit וְ verbundene Imperfektform hat im Anschluss an den Imperativ auffordernden beziehungsweise volitiven Sinn. „Sollen … preisen“ erhält diesen Sinn, ohne ihn als bloße Zukunftsaussage festzulegen.
- source_word: מַעֲשֶׂיהָ
  choice: ihre Werke
  rationale: מַעֲשֶׂה bezeichnet Werke, Taten oder das Hervorgebrachte. „Werke“ bewahrt die knappe Parallele zum Ertrag ihrer Hände und die Personifikation.
- source_word: בַשְּׁעָרִים
  choice: an den Stadttoren
  rationale: Die Tore waren im alten Israel öffentliche Orte des Rechts, der Beratung und der Anerkennung. „Stadttore“ macht den kulturell gemeinten Ort für heutige Leser verständlich.
theological_decisions:
- issue: Wer oder was die Frau öffentlich lobt
  choice: Die Werke selbst werden als die Lobenden dargestellt.
  alternative: Die Menschen an den Stadttoren loben sie wegen ihrer Werke.
  rationale: Das grammatische Subjekt מַעֲשֶׂיהָ („ihre Werke“) steht nach dem Verb und trägt die personifizierende Aussage. Eine Umdeutung auf menschliche Beobachter würde das Bild abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache von „Ertrag ihrer Hände“ bleibt erhalten; „Stadttore“ verdeutlicht den historischen Schauplatz, ohne die öffentliche Dimension zu verflachen.
