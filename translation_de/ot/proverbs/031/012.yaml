source:
  edition: WLC
  text: גְּמָלַ֣תְ/הוּ ט֣וֹב וְ/לֹא רָ֑ע כֹּ֝֗ל יְמֵ֣י חַיֶּֽי/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/012.yaml
  text: She does him good[a], and not harm, all the days of her life.
translation:
  language: de
  text: Sie tut ihm Gutes[a] und nichts Böses, alle Tage ihres Lebens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie vergilt ihm Gutes und nichts Böses.“ Das hebräische Verb kann auch bedeuten, jemandem etwas zu vergelten oder ihn entsprechend zu behandeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמָלַתְהוּ
  choice: sie tut ihm
  rationale: Das Verb גמל kann bedeuten, jemandem etwas zu erweisen, ihn entsprechend zu behandeln oder ihm etwas zu vergelten. Zusammen mit טוֹב ergibt „sie tut ihm Gutes“ im Deutschen eine natürliche und quellennah bleibende Wiedergabe, ohne den Gedanken einer vorausgehenden Leistung einzutragen.
- source_word: טוֹב
  choice: Gutes
  rationale: טוֹב wird hier substantivisch gebraucht. „Gutes“ gibt den positiven Nutzen beziehungsweise die gute Behandlung knapp und idiomatisch wieder.
- source_word: וְלֹא רָע
  choice: und nichts Böses
  rationale: רָע kann sowohl Böses als auch Schaden oder Unglück bezeichnen. „Nichts Böses“ wahrt die breite Bedeutung und bildet im Deutschen einen klaren Gegensatz zu „Gutes“.
- source_word: כֹּל יְמֵי
  choice: alle Tage
  rationale: Die formnahe Wendung erhält den distributiven Sinn und den poetischen Rhythmus des Hebräischen.
- source_word: חַיֶּיהָ
  choice: ihres Lebens
  rationale: Das formal plurale חַיִּים bezeichnet idiomatisch das Leben beziehungsweise die Lebenszeit einer Person; im Deutschen steht dafür der Singular.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, leicht poetischem Satzrhythmus. Die traditionelle Wendung „alle Tage ihres Lebens“ bewahrt die Form des hebräischen Zeit Ausdrucks; die Fußnote hält die Bedeutungsbreite von גמל offen.
