  text: בָּ֣טַח בָּ֭/הּ לֵ֣ב בַּעְלָ֑/הּ וְ֝/שָׁלָ֗ל לֹ֣א יֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/011.yaml
  text: The heart of her husband trusts in her, and he will lack no gain.
translation:
  language: de
  text: Das Herz ihres Mannes vertraut auf sie, und es wird ihm an Gewinn nicht fehlen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּטַח ... לֵב
  choice: Das Herz ... vertraut
  rationale: Gibt die hebräische Konstruktion eng und zugleich natürlich wieder; „Herz“ bezeichnet hier das innere Vertrauen und Urteil des Mannes.
- source_word: בַּעְלָהּ
  choice: ihres Mannes
  rationale: Im ehelichen Kontext ist „ihr Mann“ die natürliche moderne Wiedergabe; das Possessivsuffix wird bewahrt.
- source_word: שָׁלָל
  choice: Gewinn
  rationale: Das Wort bedeutet häufig „Beute“, kann hier aber im wirtschaftlichen Bild den Ertrag oder Vorteil bezeichnen, der dem Haushalt nicht fehlt. „Gewinn“ bewahrt diesen Sinn, ohne ein gewaltsames Plündern nahezulegen.
- source_word: לֹא יֶחְסָר
  choice: es wird ihm ... nicht fehlen
  rationale: Gibt den negierten Imperfekt als zukunftsbezogene beziehungsweise allgemeine Folge seines Vertrauens wieder; das ergänzte „ihm“ macht den deutschen Bezug verständlich.
theological_decisions:
- issue: Art des durch die Frau vermittelten Vorteils
  choice: Gewinn
  alternative: Beute
  rationale: Der Vers lobt die verlässliche, tüchtige Ehefrau. „Gewinn“ passt zum häuslich-wirtschaftlichen Zusammenhang, während die wörtlich mögliche Wiedergabe „Beute“ im Deutschen leicht einen ungewollt kriegerischen oder räuberischen Sinn erzeugt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele hebräische Satzstruktur bleibt erkennbar; auf erklärende Zusätze und konfessionelle Deutungen wird verzichtet.
