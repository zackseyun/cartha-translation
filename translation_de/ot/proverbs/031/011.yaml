  source_fidelity: 'Die Übersetzung gibt die hebräische Aussage sachgerecht wieder: לֵב בַּעְלָהּ als „Das Herz ihres Mannes“, בָּטַח בָּהּ als „vertraut auf sie“ und die Folgeaussage וְשָׁלָל לֹא יֶחְסָר als fehlender Mangel an „Gewinn“. „Gewinn“ ist im wirtschaftlich-haushälterischen Kontext eine vertretbare, idiomatische Wiedergabe von שָׁלָל und entspricht der englischen Audit-Fassung.'
