base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/004.yaml
  text: It is not for kings[a], O Lemuel, it is not for kings to drink wine, nor for rulers to desire strong drink,
translation:
  language: de
  text: Königen ziemt es nicht, Lemuel, Königen ziemt es nicht, Wein zu trinken, und Herrschern ziemt es nicht, nach berauschendem Getränk zu verlangen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, möglicherweise wörtlicher: »und für Herrscher: Wo ist berauschendes Getränk?« Die hebräische Wendung ist knapp und kann Herrscher darstellen, die nach berauschendem Getränk suchen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל לַמְלָכִים
  choice: Königen ziemt es nicht
  rationale: Die Negation אַל mit der Präpositionalfügung לַמְלָכִים bezeichnet hier, was für Könige nicht angemessen ist. Die Formulierung bewahrt den mahnenden Ton und lässt sich im Deutschen natürlich wiederholen.
- source_word: לְמוֹאֵל
  choice: Lemuel
  rationale: Der Name steht als direkte Anrede; im Deutschen ist dafür kein zusätzlicher Anredepartikel nötig.
- source_word: שְׁתוֹ יָיִן
  choice: Wein zu trinken
  rationale: Die Konstruktion bezeichnet das Trinken von Wein und ergänzt die Aussage darüber, was Königen nicht ziemt.
- source_word: וּלְרוֹזְנִים
  choice: und Herrschern nicht
  rationale: רוֹזְנִים bezeichnet hochgestellte Regierende oder Würdenträger. „Herrscher“ ist modern und erhält den Parallelismus zu den Königen.
- source_word: או שֵׁכָר
  choice: nach berauschendem Getränk zu verlangen
  rationale: Die knappe und schwierige Wendung kann als Suchen oder Verlangen nach berauschendem Getränk verstanden werden. Die sinngemäße Wiedergabe ergibt einen verständlichen Parallelismus; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung von „Königen ziemt es nicht“ bildet den poetischen Nachdruck des Hebräischen ab; die Deutung der umstrittenen Schlusswendung wird nicht verschwiegen.
