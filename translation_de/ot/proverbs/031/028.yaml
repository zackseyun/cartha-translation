source:
  edition: WLC
  text: קָ֣מוּ בָ֭נֶי/הָ וַֽ/יְאַשְּׁר֑וּ/הָ בַּ֝עְלָ֗/הּ וַֽ/יְהַֽלְלָ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/028.yaml
  text: 'Her children rise up and call her blessed[a]; her husband also[b], and he praises her:'
translation:
  language: de
  text: 'Ihre Kinder[a] stehen auf und preisen sie glücklich[b]; auch ihr Mann lobt sie:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihre Söhne“. Das hebräische Wort kann speziell die Söhne oder allgemeiner die Kinder bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „nennen sie glücklich“ oder „preisen sie selig“. Das hebräische Verb bezeichnet hier das Urteil, dass jemand glücklich oder begünstigt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָמוּ
  choice: stehen auf
  rationale: Das Qal Perfekt von קום bezeichnet konkret das Aufstehen oder Sich-Erheben. „Stehen auf“ bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: בָנֶיהָ
  choice: ihre Kinder
  rationale: בנים kann sowohl speziell „Söhne“ als auch allgemein „Kinder“ bezeichnen. Im Zusammenhang der Würdigung innerhalb der Familie gibt „Kinder“ den möglichen umfassenden Sinn angemessen wieder; die engere Bedeutung wird in einer Fußnote genannt.
- source_word: וַיְאַשְּׁרוּהָ
  choice: preisen sie glücklich
  rationale: Das Piel von אשר bedeutet, jemanden als glücklich, begünstigt oder gesegnet zu bezeichnen. „Glücklich preisen“ gibt diesen feststellenden Lobpreis wieder, ohne ihn mit dem gewöhnlichen Verb „segnen“ gleichzusetzen.
- source_word: בַּעְלָהּ
  choice: ihr Mann
  rationale: בעל kann in anderen Zusammenhängen „Herr“ oder „Besitzer“ bedeuten, bezeichnet hier im familiären Kontext jedoch eindeutig den Ehemann.
- source_word: וַיְהַלְלָהּ
  choice: lobt sie
  rationale: Das Piel von הלל bedeutet „loben“ oder „rühmen“. „Lobt sie“ ist direkt, würdig und idiomatisch.
- source_word: ו
  choice: auch; und
  rationale: Die Konjunktionen verbinden zunächst die Handlungen der Kinder und fügen dann den Mann als weiteren Lobenden hinzu. Im Deutschen macht „auch“ diese additive Beziehung natürlich deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt bleibt erhalten, weil der folgende Vers den Inhalt des Lobes wiedergibt. Die knappe hebräische Fügung beim Mann wird mit dem additiven „auch“ natürlich wiedergegeben, ohne eine im zweiten Satzteil nicht ausdrücklich wiederholte Handlung einzufügen.
