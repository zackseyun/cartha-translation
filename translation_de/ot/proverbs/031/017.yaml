  text: She girds her waist with strength and makes her arms strong[a].
translation:
  language: de
  text: Sie gürtet ihre Hüften mit Kraft und stärkt ihre Arme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie gürtet ihre Lenden mit Kraft.“ Das Hebräische bewahrt ein konkretes körperliches Bild für Bereitschaft und Tatkraft.'
