lexical_decisions:
- source_word: חָגְרָה
  choice: gürtet
  rationale: Das Verb bezeichnet konkret das Umgürten oder Festbinden. „Gürtet“ bewahrt das körperliche Bild der Bereitschaft; das Präsens entspricht dem deutschen Spruchstil.
- source_word: בְעֹז
  choice: mit Kraft
  rationale: עֹז bezeichnet Kraft oder Stärke; die Präposition בְּ hat hier instrumentalen Sinn.
- source_word: מָתְנֶיהָ
  choice: ihre Hüften
  rationale: מָתְנַיִם bezeichnet den Hüft- beziehungsweise Lendenbereich. „Hüften“ ist heute verständlich und bewahrt das konkrete Körperbild besser als eine abstrakte Umschreibung.
- source_word: וַתְּאַמֵּץ
  choice: stärkt
  rationale: Die Piel-Form bezeichnet das Kräftigen oder Festmachen. „Stärkt“ gibt dies knapp und idiomatisch wieder.
- source_word: זְרֹעוֹתֶיהָ
  choice: ihre Arme
  rationale: Das Substantiv bezeichnet die Arme und hebt hier körperliche Tatkraft und Arbeitsfähigkeit hervor.
