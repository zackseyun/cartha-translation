  text: תְּנוּ שֵׁכָ֣ר לְ/אוֹבֵ֑ד וְ֝/יַיִן לְ/מָ֣רֵי נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/006.yaml
  text: Give strong drink to one who is perishing[b][a], and wine to those bitter in soul.
translation:
  language: de
  text: Gebt dem, der zugrunde geht,[a] berauschendes Getränk und denen, deren Seele verbittert ist,[b] Wein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem, der dem Tod nahe ist“. Das hebräische Partizip kann allgemein jemanden bezeichnen, der zugrunde geht, dem Untergang geweiht oder dem Tod nahe ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „den an der Seele Verbitterten“; gemeint sind Menschen in tiefem innerem Leid oder Elend.'
    reason: cultural_note
lexical_decisions:
- source_word: תְּנוּ
  choice: Gebt
  rationale: Der pluralische Imperativ von נתן wird direkt und natürlich mit „Gebt“ wiedergegeben.
- source_word: שֵׁכָר
  choice: berauschendes Getränk
  rationale: Das Wort bezeichnet ein alkoholisches Getränk, insbesondere außer Wein. „Berauschendes Getränk“ bewahrt die allgemeine Bedeutung, ohne eine bestimmte Getränkeart festzulegen.
- source_word: לְאוֹבֵד
  choice: dem, der zugrunde geht
  rationale: Das Partizip von אבד kann einen Menschen bezeichnen, der zugrunde geht, dem Untergang nahe oder dem Tod nahe ist. Die gewählte Formulierung erhält diese Bedeutungsbreite.
- source_word: וְיַיִן
  choice: und Wein
  rationale: Die einfache Verbindung und die gewöhnliche Bedeutung von יין werden unmittelbar wiedergegeben.
- source_word: לְמָרֵי נָפֶשׁ
  choice: denen, deren Seele verbittert ist
  rationale: Die Formulierung gibt das hebräische Bild „die an der Seele Verbitterten“ in verständlichem Deutsch wieder und wahrt zugleich den Bezug auf tiefes inneres Leid.
- source_word: נָפֶשׁ
  choice: Seele
  rationale: Hier bezeichnet נֶפֶשׁ das innere Leben beziehungsweise den Sitz des Leids. „Seele“ bewahrt die Bildsprache des hebräischen Ausdrucks.
theological_decisions:
- issue: Ob der Imperativ abgeschwächt werden sollte, damit der Vers nicht wie eine uneingeschränkte Befürwortung des Rausches klingt
  choice: Die im Hebräischen stehende Aufforderung wird ohne interpretierende Abschwächung beibehalten.
  alternative: Den Text ausdrücklich auf medizinischen Gebrauch zu beschränken oder ihn im Haupttext als Ironie beziehungsweise Sarkasmus wiederzugeben.
  rationale: Der hebräische Vers enthält direkte Imperative und versieht sie hier nicht ausdrücklich mit einer Einschränkung. Ethische oder kontextuelle Einordnungen dürfen nicht ohne klare sprachliche Grundlage in den Vers hineingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Aufforderung und die hebräische Bildsprache der verbitterten Seele bleiben erhalten; ungebräuchliches „Rauschtrank“ wird zugunsten des verständlicheren „berauschendes Getränk“ vermieden.
