  text: She makes coverings for herself[a]; fine linen and purple are her clothing.
translation:
  language: de
  text: Sie fertigt sich Decken an[a]; feines Leinen und Purpur sind ihre Kleidung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Überdecken“, „Bettdecken“ oder möglicherweise „Teppiche“. Das hebräische Wort bezeichnet allgemein ausgebreitete Textilien und kann kostbare Stoffe für den Haushalt meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבַדִּים
  choice: Decken
  rationale: Der Plural bezeichnet ausgebreitete Textilien, wahrscheinlich kostbare Decken für Haushalt oder Bett. „Decken“ bleibt im Deutschen natürlich und hinreichend weit, ohne Wandteppiche oder Bettüberwürfe festzulegen.
- source_word: עָשְׂתָה
  choice: fertigt … an
  rationale: Das Qatal beschreibt im poetischen Gesamtbild eine charakteristische Tätigkeit. Das deutsche Präsens gibt diese gewohnheitsmäßige Handlung wieder; „anfertigen“ betont ihre textile Arbeit.
- source_word: לָּהּ
  choice: sich
  rationale: Die Präposition mit Suffix bezeichnet hier Nutzen beziehungsweise Bestimmung für sie selbst. Das reflexive „sich“ gibt dies knapp und idiomatisch wieder.
- source_word: שֵׁשׁ
  choice: feines Leinen
  rationale: Das Wort bezeichnet hochwertiges Leinen; „feines Leinen“ bewahrt den Hinweis auf Qualität und Wohlstand.
- source_word: אַרְגָּמָן
  choice: Purpur
  rationale: Gemeint ist kostbarer purpurgefärbter Stoff. „Purpur“ ist die prägnante, traditionelle und weiterhin verständliche deutsche Bezeichnung.
- source_word: לְבוּשָׁהּ
  choice: ihre Kleidung
  rationale: Das Substantiv im Singular kann Kleidung kollektiv bezeichnen. Die Wiedergabe vermeidet die unnötige Festlegung auf ein einzelnes Kleidungsstück.
