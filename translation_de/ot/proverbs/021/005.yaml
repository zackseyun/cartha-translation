source:
  edition: WLC
  text: מַחְשְׁב֣וֹת חָ֭רוּץ אַךְ לְ/מוֹתָ֑ר וְ/כָל אָ֝֗ץ אַךְ לְ/מַחְסֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/005.yaml
  text: The plans of the diligent surely lead to abundance[c][b][a], but everyone who is hasty surely comes to want.
translation:
  language: de
  text: Die Pläne des Fleißigen führen gewiss zu Gewinn,[a] doch jeder, der hastet,[b] gerät gewiss in Mangel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu Überschuss“ oder „zu Vorteil“. Das hebräische Wort kann Überschuss, Vorteil oder Gewinn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der übereilt handelt“. Gemeint ist impulsives Drängen oder überstürztes Vorgehen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „gerät in Armut“. Das hebräische Wort kann allgemein Mangel, Not oder Verarmung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: Pläne
  rationale: Das Substantiv bezeichnet hier im Kontext praktischer Weisheit überlegte Vorhaben, nicht bloß innere Gedanken.
- source_word: חָרוּץ
  choice: des Fleißigen
  rationale: Die substantivisch gebrauchte Form bezeichnet einen tatkräftigen, gewissenhaft arbeitenden Menschen; „der Fleißige“ ist knapp und im Deutschen idiomatisch.
- source_word: אַךְ
  choice: gewiss
  rationale: In beiden Vershälften hebt אַךְ die sichere Folge hervor. „Gewiss“ bewahrt diesen Nachdruck, ohne die Aussage unnötig als ausschließendes „nur“ festzulegen.
- source_word: לְמוֹתָר
  choice: zu Gewinn
  rationale: מוֹתָר kann Überschuss, Vorteil oder Gewinn bezeichnen. „Gewinn“ bildet einen natürlichen Gegensatz zu „Mangel“ und lässt den wirtschaftlichen wie allgemeinen Sinn offen.
- source_word: וְכָל
  choice: doch jeder, der
  rationale: Das Waw verbindet hier antithetische Vershälften und wird daher natürlich mit „doch“ wiedergegeben; כָל hat zusammen mit dem Partizip distributiven Sinn.
- source_word: אָץ
  choice: hastet
  rationale: Das Partizip bezeichnet jemanden, der drängt oder übereilt vorgeht. Die verbale Wiedergabe „der hastet“ betont dieses Verhalten, ohne es stärker als festen Charakterzug auszulegen.
- source_word: לְמַחְסוֹר
  choice: gerät ... in Mangel
  rationale: מַחְסוֹר umfasst Mangel, Bedürftigkeit und Armut. „In Mangel geraten“ ist verständlich und bewahrt die semantische Breite.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit knapper, würdevoller Spruchform. Die parallele Wiederholung von „gewiss“ bildet das zweimalige אַךְ ab; „Gewinn“ und „Mangel“ bewahren den antithetischen Aufbau.
