source:
  edition: WLC
  text: ט֗וֹב לָ/שֶׁ֥בֶת עַל פִּנַּת גָּ֑ג מֵ/אֵ֥שֶׁת מִ֝דְיָנִ֗ים וּ/בֵ֥ית חָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/009.yaml
  text: Better to live on a corner of the roof than with a quarrelsome wife in a shared house[a].
translation:
  language: de
  text: Besser, in einer Ecke auf dem Dach zu wohnen, als mit einer streitsüchtigen Frau in einem Haus, das man mit anderen teilt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einem Haus der Gemeinschaft/Gesellschaft“; die hebräische Wendung lautet wörtlich etwa „und ein Haus der Gemeinschaft/Gesellschaft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Besser
  rationale: Das Adjektiv eröffnet in der knappen Spruchform einen Vergleich; „Besser“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: לָשֶׁבֶת
  choice: wohnen
  rationale: ישׁב kann wörtlich „sitzen“ bedeuten, bezeichnet in einem Wohnkontext aber häufig das Wohnen oder Bleiben.
- source_word: עַל פִּנַּת גָּג
  choice: auf einer Ecke des Daches
  rationale: פִּנָּה bedeutet „Ecke“, גָּג das flache Dach eines Hauses. Die Formulierung bewahrt das Bild eines beengten, ungeschützten Aufenthaltsorts.
- source_word: מֵאֵשֶׁת
  choice: als mit einer … Frau
  rationale: Die Präposition מִן kennzeichnet nach טוֹב den Vergleich. Das ergänzte „mit“ macht im Deutschen deutlich, dass gemeinsames Wohnen gemeint ist.
- source_word: מִדְיָנִים
  choice: streitsüchtigen
  rationale: Das Wort bezeichnet Streitigkeiten oder Zänkereien und beschreibt hier idiomatisch eine Frau, die immer wieder Streit sucht.
- source_word: וּבֵית חָבֶר
  choice: in einem gemeinsam bewohnten Haus
  rationale: Die ungewöhnliche Wendung lautet wörtlich etwa „und ein Haus der Gemeinschaft/Verbindung“. Die gewählte Fassung gibt wahrscheinlich gemeinsames Wohnen wieder, ohne die lexikalische Unsicherheit im Haupttext unnötig sperrig auszudrücken.
theological_decisions: []
