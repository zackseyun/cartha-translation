  text: אֵ֣ין חָ֭כְמָה וְ/אֵ֣ין תְּבוּנָ֑ה וְ/אֵ֥ין עֵ֝צָ֗ה לְ/נֶ֣גֶד יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/030.yaml
  text: There is no wisdom[a], no understanding, and no counsel against Yahweh.
translation:
  language: de
  text: Es gibt keine Weisheit, keine Einsicht und keinen Rat gegen Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor Jahwe“ oder „in Jahwes Gegenwart“. Der hebräische Ausdruck kann eine räumliche Gegenüberstellung bezeichnen; hier meint er wahrscheinlich Opposition gegen Jahwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: kein / keine
  rationale: Die dreimalige Existenznegation wird durch die wiederholte deutsche Verneinung bewahrt; beim dritten Glied wird sie idiomatisch mit „vermögen etwas“ verbunden.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und sachgerechte Wiedergabe im Sprüchebuch; sie bezeichnet lebenspraktische, kundige Weisheit.
- source_word: תְּבוּנָה
  choice: Einsicht
  rationale: „Einsicht“ wahrt gegenüber „Weisheit“ ein eigenständiges Bedeutungsprofil und bezeichnet verstehendes Urteilsvermögen.
- source_word: עֵצָה
  choice: Rat
  rationale: Das Wort kann Rat, Beratung oder Plan bezeichnen. „Rat“ ist knapp, natürlich und erhält die Dreierreihe.
- source_word: לְנֶגֶד
  choice: gegen
  rationale: Im Zusammenhang bezeichnet der Ausdruck wahrscheinlich ein Gegenübertreten in Opposition. Die Fußnote hält die räumlichere Lesart „vor“ beziehungsweise „in der Gegenwart“ offen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst; die Transliteration bewahrt seinen Charakter als Eigenname.
- issue: Sinn von לְנֶגֶד יְהוָה
  choice: gegen Jahwe
  alternative: vor Jahwe / in Jahwes Gegenwart
  rationale: Die Aussage zielt wahrscheinlich darauf, dass menschliche Weisheit und Planung Jahwe nicht widerstehen oder sich gegen ihn behaupten können. Da der Ausdruck auch räumlich als „vor“ verstanden werden kann, wird diese echte Mehrdeutigkeit in der Fußnote erhalten.
translation_notes:
  register: Knappes, würdiges Sprichwort in modernem Standarddeutsch. Die dreigliedrige Reihung bleibt hörbar; „vermögen etwas“ macht die im Hebräischen knappe Existenzverneinung im Deutschen als Aussage über Wirkungslosigkeit gegen Jahwe verständlich.
