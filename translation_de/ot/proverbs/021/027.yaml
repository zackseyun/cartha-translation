id: PRO.21.27
reference: Proverbs 21:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֵבָ֑ה אַ֝֗ף כִּֽי בְ/זִמָּ֥ה יְבִיאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/027.yaml
  text: The sacrifice of the wicked is an abomination[a]; how much more when he brings it with evil intent.
translation:
  language: de
  text: Das Opfer der Gottlosen ist ein Gräuel; wie viel mehr, wenn einer es in böser Absicht darbringt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn einer es mit einem bösen Plan darbringt“. Das hebräische Wort kann eine verderbte Absicht oder einen boshaften Plan bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  choice: Opfer
  rationale: Bezeichnet hier eine kultische Opfergabe, besonders ein Schlachtopfer; „Opfer“ ist im Deutschen natürlich und hinreichend präzise.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: Das substantivierte Pluraladjektiv bezeichnet moralisch schuldige Menschen als allgemeine Gruppe; der Genitiv wahrt die knappe Spruchform.
- source_word: תּוֹעֵבָה
  choice: ein Gräuel
  rationale: Gibt die starke moralisch-religiöse Abscheu des hebräischen Ausdrucks würdig und idiomatisch wieder.
- source_word: אַף כִּי
  choice: wie viel mehr
  rationale: 'Markiert eine Steigerung: Schon das Opfer der Gottlosen ist verabscheuungswürdig, umso mehr unter der anschließend genannten Bedingung.'
- source_word: בְּזִמָּה
  choice: in böser Absicht
  rationale: זִמָּה kann eine verderbte Absicht oder einen boshaften Plan bezeichnen. Im Zusammenhang des Opferbringens steht wahrscheinlich das schuldhafte Motiv beziehungsweise Vorhaben im Vordergrund.
- source_word: יְבִיאֶנּוּ
  choice: wenn einer es … darbringt
  rationale: Der Suffix bezieht sich am natürlichsten auf das Opfer. „Darbringen“ entspricht im kultischen Zusammenhang idiomatisch dem Hiphil von בוא; „einer“ gibt das unbestimmte Subjekt wieder, ohne das Geschlecht unnötig hervorzuheben.
theological_decisions:
- issue: Moralische Bewertung des Opfers eines Gottlosen
  choice: Der Spruch bezeichnet nicht das Opfer an sich, sondern das von Gottlosen dargebrachte Opfer als Gräuel und steigert das Urteil bei einer bösen Absicht.
  alternative: 'Die zweite Zeile kann allgemeiner verstanden werden: „wenn er es mit einem bösen Plan darbringt“.'
  rationale: Die Wiedergabe hält die Kritik an verdorbener oder heuchlerischer Gottesverehrung fest, ohne eine allgemeine Ablehnung des Opferkults in den Text einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache in knapper Spruchform. „Gräuel“ bewahrt die starke theologische Wertung; „darbringen“ ist im kultischen Kontext geläufig. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den sich die Erläuterung bezieht.
