  terminology: „Opfer“, „Gottlose“ und „Gräuel“ entsprechen dem religiös-ethischen Register des Ausgangstextes. Die Fußnote nennt die relevante lexikalische Alternative „böser Plan“, ohne die Deutung auf einen bestimmten Bereich von זִמָּה, etwa einen sexuellen Sinn, einzuengen.
