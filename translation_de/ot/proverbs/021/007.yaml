translation:
  language: de
  text: Die Gewalt der Gottlosen wird sie fortreißen[a], denn sie weigern sich, Recht zu tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Plünderung der Gottlosen wird sie hinwegraffen.“ Die Bedeutung des hebräischen Verbs und die genaue Satzbeziehung sind umstritten. Es kann vom Fortreißen durch die eigene Gewalt, vom Hinwegraffen oder auch vom Erschrecken die Rede sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁד
  choice: Gewalttat
  rationale: Das Wort bezeichnet gewaltsame Zerstörung oder Plünderung. „Gewalttat“ erfasst hier das zerstörerische Unrecht der Gottlosen und passt zum folgenden Gegensatz, dass sie sich weigern, Recht zu tun.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: Die substantivierte Bezeichnung meint moralisch schuldige, böse handelnde Menschen. „Gottlose“ ist im deutschen Spruchweisheitsregister knapp und geläufig, ohne an dieser Stelle eine bestimmte Einzeltat einzuengen.
- source_word: יְגוֹרֵם
  choice: wird sie fortreißen
  rationale: Die schwierige Verbform mit dem Suffix der 3. Person Plural wird als gewaltsames Wegtragen verstanden. „Fortreißen“ bewahrt das Bild, dass das eigene Unrecht die Täter ins Verderben trägt, ohne die unsichere Bildrichtung weiter auszudeuten.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für die vorausgehende Aussage an. „Denn“ ist in einem knappen deutschen Weisheitsspruch natürlich.
- source_word: מֵאֲנוּ
  choice: sie weigern sich
  rationale: Das Verb bedeutet „sich weigern, ablehnen“. Das Präsens gibt den charakteristischen, allgemeingültigen Zug des Spruchs wieder.
- source_word: לַעֲשׂוֹת
  choice: zu tun
  rationale: Der Infinitiv ergänzt „sich weigern“; zusammen mit מִשְׁפָּט entspricht „Recht tun“ einer natürlichen und sachlich genauen deutschen Wendung.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Gemeint ist hier gerechtes Handeln, nicht nur ein Gerichtsurteil. „Recht tun“ hält den ethisch-rechtlichen Sinn und die konkrete Handlungsorientierung fest.
