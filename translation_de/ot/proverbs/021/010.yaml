source:
  edition: WLC
  text: נֶ֣פֶשׁ רָ֭שָׁע אִוְּתָה רָ֑ע לֹא יֻחַ֖ן בְּ/עֵינָ֣י/ו רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/010.yaml
  text: The soul of the wicked desires evil[b][a]; his neighbor finds no favor in his eyes.
translation:
  language: de
  text: Die Seele eines Gottlosen verlangt nach Bösem; sein Nächster[a] findet keine Gunst in seinen Augen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Freund“ oder „sein Gefährte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „findet keine Gunst in seinen Augen“; gemeint ist, dass er ihm weder Wohlwollen noch Güte entgegenbringt.'
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: Seele
  rationale: Das Wort bezeichnet hier das innere Leben und Begehren des Menschen. „Seele“ bewahrt die knappe, gewichtige Ausdrucksweise des Hebräischen, ohne sie auf bloßen Appetit einzuengen.
- source_word: רָשָׁע
  choice: eines Gottlosen
  rationale: Das substantivierte Adjektiv bezeichnet repräsentativ einen Menschen, dessen Haltung und Handeln böse sind. „Gottloser“ ist im deutschen Weisheitsstil prägnant und verständlich.
- source_word: אִוְּתָה
  choice: verlangt nach
  rationale: Das Verb bezeichnet ein Begehren oder Verlangen. Die Formulierung ist natürlich und wahrt die Intensität, ohne sie durch „giert“ unnötig zu steigern.
- source_word: רָע
  choice: Bösem
  rationale: Im Zusammenhang der Weisheitsliteratur steht רָע hier vor allem für moralisch Böses, nicht lediglich für Unglück oder Schaden.
- source_word: יֻחַן
  choice: findet keine Gunst
  rationale: Die passive Verbform von חנן bezeichnet, dass jemandem Gunst oder Wohlwollen erwiesen wird. „Findet keine Gunst“ gibt diesen Sinn knapp wieder.
- source_word: בְּעֵינָיו
  choice: in seinen Augen
  rationale: Die bildhafte hebräische Wendung bezeichnet die Beurteilung und Haltung des Gottlosen. Sie ist auch im Deutschen verständlich und bleibt deshalb erhalten.
- source_word: רֵעֵהוּ
  choice: sein Nächster
  rationale: רֵעַ kann den Nächsten, Gefährten oder Freund bezeichnen. „Nächster“ wahrt hier die soziale und ethische Weite des Ausdrucks.
theological_decisions: []
