  text: מַתָּ֣ן בַּ֭/סֵּתֶר יִכְפֶּה אָ֑ף וְ/שֹׁ֥חַד בַּ֝/חֵ֗ק חֵמָ֥ה עַזָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/014.yaml
  text: A gift in secret subdues anger[a], and a bribe in the bosom, fierce wrath.
translation:
  language: de
  text: Eine Gabe im Verborgenen besänftigt den Zorn, und ein Bestechungsgeschenk im Gewandbausch besänftigt heftige Wut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַתָּן
  choice: Gabe
  rationale: Das Substantiv bezeichnet eine Gabe oder ein Geschenk. „Gabe“ ist knapp und wahrt den Unterschied zum ausdrücklich negativen שֹׁחַד im zweiten Halbvers.
- source_word: בַּסֵּתֶר
  choice: im Verborgenen
  rationale: Die Wendung bezeichnet einen verborgenen Ort beziehungsweise heimliches Handeln. „Im Verborgenen“ bewahrt sowohl den räumlichen Ausdruck als auch den Gedanken der Heimlichkeit.
- source_word: יִכְפֶּה
  choice: besänftigt
  rationale: Das Verb beschreibt hier, dass Zorn zugedeckt, gedämpft oder niedergehalten wird. „Besänftigt“ gibt die Wirkung im Deutschen natürlich wieder, ohne zwingend eine vollständige Beseitigung des Zorns auszudrücken.
- source_word: אָף
  choice: Zorn
  rationale: Obwohl das Wort wörtlich auch „Nase“ bedeutet, ist es hier die geläufige hebräische Bezeichnung für Zorn.
- source_word: שֹׁחַד
  choice: Bestechungsgeschenk
  rationale: Das Wort bezeichnet regelmäßig eine Bestechungsgabe. „Bestechungsgeschenk“ hält die negative Bedeutung fest und unterscheidet den Ausdruck von der allgemeineren „Gabe“ im ersten Halbvers.
- source_word: בַּחֵק
  choice: im Gewandbausch
  rationale: Der Ausdruck meint den Brust- oder Schoßbereich des Gewandes, in dessen Falte etwas verborgen übergeben werden konnte. „Im Gewandbausch“ macht dieses konkrete Bild im Deutschen verständlich und erhält den Gedanken der Heimlichkeit.
- source_word: חֵמָה עַזָּה
  choice: heftige Wut
  rationale: Die Verbindung steigert die Aussage gegenüber „Zorn“ im ersten Halbvers. „Heftige Wut“ gibt diese Intensivierung klar und idiomatisch wieder.
theological_decisions:
- issue: Beschreibende Aussage oder moralische Billigung von Bestechung
  choice: Der Vers wird als knappe Beobachtung über die Wirkung heimlicher Gaben wiedergegeben, ohne eine moralische Bewertung hinzuzufügen.
  alternative: Eine ausdrückliche Verurteilung der Bestechung in den Text aufnehmen.
  rationale: Der hebräische Wortlaut beschreibt die besänftigende Wirkung, ohne sie in diesem Vers ausdrücklich zu billigen oder zu verurteilen. Diese Spannung soll nicht durch einen Zusatz aufgelöst werden.
translation_notes:
  register: Knappes, würdiges Sprichwortdeutsch mit erhaltener Parallelstruktur. Das Prädikat „besänftigt“ gilt durch Ellipse auch für den zweiten Halbvers; auf eine Wiederholung wurde verzichtet, um die Dichte des hebräischen Satzes zu bewahren.
