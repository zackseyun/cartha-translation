  text: כֹּ֣פֶר לַ/צַּדִּ֣יק רָשָׁ֑ע וְ/תַ֖חַת יְשָׁרִ֣ים בּוֹגֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/018.yaml
  text: The wicked is a ransom for the righteous[a], and the treacherous one in place of the upright.
translation:
  language: de
  text: Der Gottlose ist ein Lösegeld für den Gerechten[a], und der Treulose anstelle der Aufrichtigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Gottlose ist ein Ersatz für den Gerechten, der Treulose für die Aufrichtigen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּפֶר
  choice: Lösegeld
  rationale: Das Wort bezeichnet einen Loskaufpreis oder eine Ersatzleistung. „Lösegeld“ bewahrt das knappe Bild und den stellvertretenden Sinn, ohne ihn auszudeuten.
- source_word: לַצַּדִּיק
  choice: für den Gerechten
  rationale: Die Präposition ל bezeichnet hier die Beziehung beziehungsweise Stellvertretung; der substantivierte Singular entspricht dem sprichwörtlichen Gattungssingular.
- source_word: רָשָׁע
  choice: der Gottlose
  rationale: Der Ausdruck bezeichnet in der Weisheitsliteratur den moralisch schuldigen beziehungsweise bösen Menschen als Typus und bildet den Gegenbegriff zum Gerechten.
- source_word: וְתַחַת
  choice: und … tritt an die Stelle
  rationale: תַּחַת drückt hier nicht die räumliche Bedeutung „unter“, sondern Stellvertretung aus. Die verbale Formulierung ergibt im Deutschen einen vollständigen, natürlichen Satz und wahrt den Parallelismus.
- source_word: יְשָׁרִים
  choice: der Aufrichtigen
  rationale: Das Wort bezeichnet moralisch geradlinige Menschen. Der hebräische Plural wird beibehalten.
- source_word: בּוֹגֵד
  choice: der Treulose
  rationale: Das Partizip bezeichnet jemanden, der treulos oder verräterisch handelt. „Der Treulose“ bewahrt die allgemeine moralische Kategorie, ohne sie auf politischen Verrat einzuengen.
theological_decisions:
- issue: Art und Ursache der beschriebenen Stellvertretung
  choice: 'Die knappe Aussage bleibt als Weisheitsspruch stehen: Der Gottlose wird zum Lösegeld für den Gerechten, der Treulose nimmt den Platz der Aufrichtigen ein.'
  alternative: Den Vers ausdrücklich als göttliches Strafgericht, Sühnehandlung oder konkrete historische Auslieferung erklären.
  rationale: Der hebräische Text nennt weder den Handelnden noch den Mechanismus. Eine nähere theologische Festlegung würde die genuine Offenheit des Spruchs auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der knappen antithetischen Sprache eines Weisheitsspruchs. „Gottlos“, „gerecht“, „treulos“ und „aufrichtig“ sind verständliche ethische Kategorien; die Singular-Plural-Asymmetrie des Hebräischen bleibt erhalten.
