  text: הֲפַכְפַּ֬ךְ דֶּ֣רֶךְ אִ֣ישׁ וָזָ֑ר וְ֝/זַ֗ךְ יָשָׁ֥ר פָּעֳלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/008.yaml
  text: The way of a guilty man is crooked and strange[a], but the conduct of the pure is upright.
translation:
  language: de
  text: Der Weg eines Schuldigen ist krumm, doch das Handeln des Reinen ist rechtschaffen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Weg eines Mannes ist krumm und fremdartig.“ Die hebräische Form, die hier mit „eines Schuldigen“ wiedergegeben wird, ist schwierig; sie kann auch „fremd“, „fremdartig“ oder „entfremdet“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲפַכְפַּךְ
  choice: krumm
  rationale: Das Adjektiv bezeichnet etwas Verdrehtes oder Verkehrtes. „Krumm“ bewahrt das Wegbild und bildet einen klaren Gegensatz zu „aufrichtig“.
- source_word: דֶּרֶךְ
  choice: Weg
  rationale: Das in der Weisheitsliteratur häufige Wort bezeichnet bildlich die Lebensführung eines Menschen; „Weg“ erhält diese Metapher.
- source_word: אִישׁ
  choice: Mann
  rationale: Das hebräische Substantiv steht im maskulinen Singular. Die sprichwörtliche Einzelfigur wird daher formal genau als „Mann“ wiedergegeben.
- source_word: וָזָר
  choice: schuldig … und absonderlich
  rationale: Die schwierige Form kann mit Schuld, Fremdheit oder Absonderlichkeit verbunden werden. Die Formulierung folgt der ethischen Gegenüberstellung zum Reinen, lässt durch „absonderlich“ aber zugleich den naheliegenden Wortsinn „fremd/seltsam“ erkennen.
- source_word: זַךְ
  choice: rein
  rationale: Das Adjektiv bezeichnet Reinheit und hat hier im ethischen Zusammenhang moralischen Sinn.
- source_word: יָשָׁר
  choice: aufrichtig
  rationale: Das Wort kann „gerade“ oder moralisch „rechtschaffen“ bedeuten. „Aufrichtig“ bewahrt die ethische Aussage und den Gegensatz zum krummen Weg.
- source_word: פָּעֳלוֹ
  choice: Tun
  rationale: Das Substantiv bezeichnet Werk, Tat oder Handeln. „Tun“ ist knapp, natürlich und bezieht sich wie der „Weg“ auf die Lebensführung.
theological_decisions:
- issue: Ethische Bedeutung der schwierigen Bezeichnung וָזָר
  choice: Im Haupttext wird die schuldbezogene Deutung aufgenommen, ohne den möglichen Sinn „fremd/absonderlich“ auszublenden.
  alternative: „Der Weg eines Mannes ist krumm und fremdartig“ oder „Der Weg eines schuldbeladenen Mannes ist krumm“.
  rationale: Der Gegensatz zum Reinen legt eine moralische Aussage nahe; die hebräische Form bleibt jedoch lexikalisch und syntaktisch schwierig. Darum wird die Unsicherheit ausdrücklich in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das traditionelle Wegbild und sein Gegensatz zu geradem beziehungsweise aufrichtigem Handeln bleiben erhalten; die schwierige hebräische Form wird im Haupttext nicht völlig vereindeutigt und in der Fußnote erläutert.
