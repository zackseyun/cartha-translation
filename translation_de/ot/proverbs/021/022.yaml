translation_notes:
  register: Moderner, würdiger Spruchstil. Die militärische Bildwelt bleibt erhalten; »rückt gegen … vor« und »Festung« geben sie idiomatisch wieder, während die Fußnote die wörtlichere und grammatisch mehrdeutige Formulierung dokumentiert.
