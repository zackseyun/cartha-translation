  text: עִ֣יר גִּ֭בֹּרִים עָלָ֣ה חָכָ֑ם וַ֝/יֹּ֗רֶד עֹ֣ז מִבְטֶחָֽ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/022.yaml
  text: A wise man goes up against the city of mighty men and brings down the stronghold in which they trust[a].
translation:
  language: de
  text: Ein Weiser zieht gegen die Stadt mächtiger Männer hinauf und reißt die Festung nieder, auf die sie vertraut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »Ein Weiser zieht gegen die Stadt von Kriegern hinauf und bringt die Macht ihrer Zuversicht zu Fall.« Das Hebräische hat hier »Macht/Stärke ihrer Zuversicht«. »Macht« kann im militärischen Bild konkret eine Festung oder Schutzmacht bezeichnen. Die feminine Singularendung von »ihrer Zuversicht« bezieht sich grammatisch auf die personifizierte Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר
  choice: Stadt
  rationale: Die Grundbedeutung ist eine städtische, häufig befestigte Siedlung; im militärischen Bild ist »Stadt« die natürliche Wiedergabe.
- source_word: גִּבֹּרִים
  choice: mächtige Männer
  rationale: Das Wort bezeichnet starke oder tapfere Männer und kann besonders im militärischen Zusammenhang Krieger meinen. »Mächtige Männer« bewahrt die weitere Bedeutung und die maskuline Form.
- source_word: עָלָה
  choice: rückt gegen … vor
  rationale: Wörtlich bedeutet das Verb »hinaufsteigen« oder »hinaufziehen«; bei einer Stadt kann es militärisch das Vorrücken gegen sie bezeichnen. Die gewählte Formulierung macht den Zusammenhang verständlich, ohne bereits ausdrücklich »erobern« zu sagen.
- source_word: חָכָם
  choice: ein Weiser
  rationale: Das substantivisch gebrauchte maskuline Adjektiv bezeichnet im allgemeinen Spruchstil einen weisen Mann.
- source_word: וַיֹּרֶד
  choice: und reißt … nieder
  rationale: Die Kausativform bedeutet »herabbringen«. Im Bild vom Überwinden einer Befestigung ist »niederreißen« natürlich und anschaulich.
- source_word: עֹז
  choice: die Festung
  rationale: Das Substantiv bedeutet zunächst »Stärke« oder »Macht«. Im militärischen Kontext lässt es sich konkret auf die schützende Befestigung beziehen; die wörtlichere abstrakte Wiedergabe bleibt in der Fußnote erhalten.
- source_word: מִבְטֶחָה
  choice: auf die sie vertrauen
  rationale: Das Substantiv bezeichnet Vertrauen, Zuversicht oder Sicherheit. Die relationale Formulierung gibt verständlich wieder, dass die Verteidiger ihre Sicherheit auf diese Stärke beziehungsweise Festung setzen.
