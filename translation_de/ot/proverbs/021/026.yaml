  text: All day long he craves greedily[b][a], but the righteous gives and does not hold back.
translation:
  language: de
  text: Den ganzen Tag begehrt er gierig[a]; doch der Gerechte[b] gibt und hält nichts zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische verbindet ein Verb mit einem stammverwandten Substantiv, wörtlich etwa: „Er begehrt Begierde.“ Diese Verbindung verstärkt das Begehren; sein Gegenstand bleibt ungenannt.'
    reason: lexical_alternative
  - marker: b
    text: „Der Gerechte“ steht im Hebräischen im maskulinen Singular und bezeichnet hier beispielhaft einen gerechten Menschen allgemein.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Den ganzen Tag
  rationale: 'Die geläufige deutsche Zeitangabe gibt den durativen Sinn wieder: Das Verlangen prägt den gesamten Tag.'
- source_word: הִתְאַוָּה תַאֲוָה
  choice: begehrt er voller Begierde
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv wird im Deutschen mit „begehrt … voller Begierde“ nachgebildet. So bleibt die emphatische Wiederholung erkennbar, ohne einen in der Quelle nicht genannten Gegenstand des Begehrens einzuführen.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular und bezeichnet hier in sprichwörtlicher Weise einen gerechten Menschen.
- source_word: יִתֵּן
  choice: gibt
  rationale: Das Imperfekt hat im Spruch habitualen beziehungsweise charakterisierenden Sinn. Das schlichte „gibt“ bewahrt diese Aussage, ohne „freigebig“ oder „immer wieder“ hinzuzufügen.
- source_word: וְלֹא יַחְשֹׂךְ
  choice: und hält nichts zurück
  rationale: Die Wendung gibt das Nicht-Zurückhalten idiomatisch wieder. „Nichts“ macht im Deutschen das implizite Objekt verständlich, ohne dessen Art festzulegen.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts im ersten Halbvers
  choice: Das maskuline Singularpronomen „er“ bleibt ohne ausdrückliche Identifizierung.
  alternative: Das Subjekt ausdrücklich als „der Faule“ aus dem vorangehenden Vers benennen.
  rationale: Der hebräische Vers enthält nur die Verbform mit implizitem maskulinem Subjekt. Eine ausdrückliche Benennung würde den Kontextbezug festlegen, den dieser Vers selbst nicht wiederholt.
- issue: Repräsentativer maskuliner Singular bei צַדִּיק
  choice: „der Gerechte“ mit einer erläuternden Fußnote
  alternative: „ein gerechter Mensch“
  rationale: Die Form und der sprichwörtliche Einzeltypus bleiben erhalten; zugleich stellt die Fußnote klar, dass eine allgemeine Charakterbeschreibung gemeint ist und keine Aussage ausschließlich über Männer.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in knapper Spruchform. „Begehrt … voller Begierde“ bewahrt bewusst die hebräische Wortstammwiederholung, bleibt aber verständlicher als die streng wörtliche Formulierung „begehrt Begierde“. Das Semikolon und „doch“ machen den scharfen Gegensatz der beiden Vershälften deutlich.
