source:
  edition: WLC
  text: שֹׁמֵ֣ר פִּ֭י/ו וּ/לְשׁוֹנ֑/וֹ שֹׁמֵ֖ר מִ/צָּר֣וֹת נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/023.yaml
  text: Whoever guards his mouth and his tongue guards his life from troubles[a].
translation:
  language: de
  text: Wer über seinen Mund und seine Zunge wacht, bewahrt sein Leben vor Bedrängnissen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bewahrt sich selbst vor Nöten“; wörtlich: „bewahrt seine nefesch vor Bedrängnissen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  choice: wacht über
  rationale: Das Qal-Partizip bezeichnet ein achtsames Hüten oder Bewachen. „Über … wacht“ ist im Deutschen bei Mund und Zunge natürlich und drückt bewusste Selbstkontrolle aus.
- source_word: פִּיו
  choice: seinen Mund
  rationale: Die direkte Wiedergabe bewahrt das hebräische Bild und bezeichnet im Zusammenhang das eigene Reden.
- source_word: וּלְשׁוֹנוֹ
  choice: und seine Zunge
  rationale: Die wörtliche Wiedergabe erhält die Metonymie für das Sprechen sowie die bildhafte Doppelung von Mund und Zunge.
- source_word: שֹׁמֵר
  choice: bewahrt
  rationale: Beim zweiten Vorkommen gibt „bewahrt“ denselben Schutzgedanken idiomatisch wieder. Eine mechanische Wiederholung von „wacht über“ wäre mit „sein Leben“ im Deutschen weniger natürlich.
- source_word: מִצָּרוֹת
  choice: vor Bedrängnissen
  rationale: Der Plural bezeichnet Nöte, Bedrängnisse oder Schwierigkeiten. „Bedrängnisse“ wahrt die Intensität des hebräischen Ausdrucks, ohne ihn auf Katastrophen einzuengen.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נֶפֶשׁ bezeichnet hier am ehesten das Leben beziehungsweise die eigene Person, nicht ausdrücklich eine vom Körper getrennte Seele. „Sein Leben“ ist klar und im Zusammenhang angemessen.
theological_decisions:
- issue: Wiedergabe von נַפְשׁוֹ
  choice: sein Leben
  alternative: sich selbst; seine Seele
  rationale: Der Weisheitsspruch handelt von den schädlichen Folgen unbeherrschten Redens. „Sein Leben“ wahrt die konkrete Bedeutung, ohne eine bestimmte Lehre über die Beschaffenheit des Menschen in den Text hineinzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Bildsprache von Mund und Zunge bleibt erhalten; beim wiederholten שֹׁמֵר wird zugunsten natürlichen Deutschen zwischen „wacht über“ und „bewahrt“ variiert. Die Fußnote macht die Bedeutungsbreite von נֶפֶשׁ sichtbar.
