  source_fidelity: 'Der Haupttext deutet die schwierige Schlussphrase zu stark um: „jagt … nach“ ist im Hebräischen nicht ausgedrückt, und die Singularform „ein Mensch“ nivelliert das pluralische מְבַקְשֵׁי מָוֶת („die den Tod suchen“). Die revidierte Fassung gibt die Kopulaaussage zu הֶבֶל נִדָּף unmittelbar wieder und ordnet die Schlussphrase, mit behutsamer syntaktischer Ergänzung, den betrügerisch Erwerbenden zu. Die in der Fußnote dokumentierte Unsicherheit bleibt erhalten.'
  naturalness: „Durch Lügen“ ist im heutigen Standarddeutsch idiomatischer als „durch eine Lügenzunge“, ohne das Mittel der falschen Rede sachlich zu verändern. „Verwehender Dunst“ bewahrt das Bild von הֶבֶל נִדָּף und klingt im Spruchstil natürlich. Der Gedankenstrich markiert die knappe, im Hebräischen schwierige Schlusswendung.
  terminology: „Schätze“, „Lügen“ und „Tod“ sind treffend. „Verwehender Dunst“ gibt sowohl die Substanzlosigkeit von הֶבֶל als auch das Vertriebenwerden von נִדָּף wieder. Die Fußnote erläutert die wörtliche Form und die wesentlichen alternativen Deutungen, ohne eine traditionsgebundene Lesart in den Haupttext zu übernehmen.
  issues:
