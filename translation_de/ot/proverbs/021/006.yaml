revisions:
- from: Wer sich durch eine Lügenzunge Schätze erwirbt, jagt flüchtigem Dunst nach[a] — ein Mensch, der den Tod sucht.[b]
  to: Das Erwerben von Schätzen durch Lügen ist verwehender Dunst[a] — so handeln die, die den Tod suchen.[b]
  rationale: Die Revision stellt die hebräische Prädikation („… ist verwehender Dunst“) wieder her und vermeidet das nicht ausdrücklich vorhandene „jagt … nach“. Die Schlusswendung wird im Deutschen als Bezug auf die Handelnden lesbar gemacht, aber im Plural belassen; die Fußnote wahrt die textliche und syntaktische Unsicherheit sowie die alternative, von alten Übersetzungen beeinflusste Deutung.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T03:55:46Z'
