  text: פֹּ֣עַל א֭וֹצָרוֹת בִּ/לְשׁ֣וֹן שָׁ֑קֶר הֶ֥בֶל נִ֝דָּ֗ף מְבַקְשֵׁי מָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/006.yaml
  text: The getting of treasures by a lying tongue is a fleeting vapor[c][b][a], a snare of those who seek death.
translation:
  language: de
  text: Das Erwerben von Schätzen durch Lügen ist verwehender Dunst[a] — so handeln die, die den Tod suchen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dunst, verwehend“ oder „fortgetriebener Dunst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die abschließende hebräische Wendung ist schwer zu deuten; wörtlich lautet sie „Suchende des Todes“. Sie kann auch bedeuten: „Wer solchen Reichtum erwirbt, sucht den Tod.“ In einigen von alten Übersetzungen beeinflussten Wiedergaben heißt es außerdem: „eine Schlinge des Todes“.'
    reason: alternative_reading
lexical_decisions:
- source_word: פֹּעַל אֹצָרוֹת
  choice: sich Schätze erwerben
  rationale: פֹּעַל bezeichnet hier das Hervorbringen bzw. Erlangen; mit אֹצָרוֹת ist der Vorgang des Ansammelns von Reichtum gemeint. Die deutsche Formulierung ist natürlich und bewahrt das konkrete Bild der Schätze.
- source_word: בִּלְשׁוֹן שָׁקֶר
  choice: durch eine Lügenzunge
  rationale: Die Wendung bedeutet wörtlich „durch/mit einer Zunge der Lüge“. „Lügenzunge“ erhält das anschauliche Körperbild und kennzeichnet die Sprache als Mittel des Erwerbs.
- source_word: הֶבֶל נִדָּף
  choice: flüchtigem Dunst
  rationale: הֶבֶל ist Atem, Hauch oder Dunst und bezeichnet oft Vergänglichkeit bzw. Substanzlosigkeit; נִדָּף bedeutet „fortgetrieben“. „Flüchtiger Dunst“ vermittelt das Bild knapp, während die Fußnote den wörtlicheren Zug festhält.
- source_word: מְבַקְשֵׁי מָוֶת
  choice: ein Mensch, der den Tod sucht
  rationale: Der masoretische Text lautet komprimiert „Suchende des Todes“. Die singularische Rückbindung an den unbestimmten Täter gibt den wahrscheinlichen Sinn im Deutschen wieder, ohne die textlich nicht bezeugte „Schlinge“ in den Haupttext einzutragen.
theological_decisions:
- issue: Bezug und Funktion von מְבַקְשֵׁי מָוֶת
  choice: Diejenigen, die auf diese Weise Reichtum erwerben, werden als Menschen beschrieben, die den Tod suchen.
  alternative: Die Wendung kann als lose Apposition „Suchende des Todes“ verstanden werden; unter Einfluss alter Übersetzungen wird auch „eine Schlinge des Todes“ wiedergegeben.
  rationale: Der MT bietet ausdrücklich „Suchende des Todes“, jedoch ohne klar markierte syntaktische Verknüpfung. Der Haupttext stellt einen plausiblen Bezug zum Erwerbenden her; die Fußnote bewahrt die echte Unsicherheit und nennt die alte, textlich weniger direkte Deutung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchton. Die Bildfelder „Lügenzunge“, „Schätze“ und „Dunst“ bleiben erhalten; die schwierige Schlusswendung wird lesbar formuliert, ihre Mehrdeutigkeit jedoch ausdrücklich dokumentiert.
