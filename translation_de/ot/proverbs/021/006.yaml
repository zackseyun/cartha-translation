    rationale: מְבַקְשֵׁי מָוֶת lautet wörtlich „Suchende des Todes“. Zwar ist eine Rückbindung auf die Erwerbenden plausibel, doch sollten Plural und die dokumentierte Schwierigkeit nicht durch eine singularische Paraphrase verdeckt werden.
