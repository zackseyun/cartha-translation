  text: תַּאֲוַ֣ת עָצֵ֣ל תְּמִיתֶ֑/נּוּ כִּֽי מֵאֲנ֖וּ יָדָ֣י/ו לַ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/025.yaml
  text: The craving of a lazy man puts him to death, because his hands refuse to work.
translation:
  language: de
  text: Das Verlangen des Faulen bringt ihn um, denn seine Hände weigern sich zu arbeiten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּאֲוַת
  choice: Das Verlangen
  rationale: Bezeichnet ein starkes Begehren oder Verlangen. Die neutrale, aber intensive deutsche Wiedergabe erhält die Aussage, ohne den Begriff unnötig auf bloße Gier festzulegen.
- source_word: עָצֵל
  choice: des Faulen
  rationale: Die substantivierte Form gibt die sprichwörtliche Charakterzeichnung knapp und natürlich wieder.
- source_word: תְּמִיתֶנּוּ
  choice: bringt ihn um
  rationale: Gibt die kausative Verbform mit ihrem Objekt idiomatisch und in der vollen Härte der Aussage wieder.
- source_word: מֵאֲנוּ יָדָיו
  choice: seine Hände weigern sich
  rationale: Bewahrt die Personifikation der Hände und folgt eng dem hebräischen Ausdruck.
- source_word: לַעֲשׂוֹת
  choice: zu arbeiten
  rationale: Im Zusammenhang mit dem Faulen bezeichnet das allgemeinere »tun/machen« konkret die verweigerte Arbeit; »arbeiten« ist im Deutschen natürlich und kontextgerecht.
theological_decisions:
- issue: Art der Todesaussage
  choice: bringt ihn um
  alternative: führt zu seinem Tod
  rationale: Die direkte Form bewahrt die zugespitzte Aussage des hebräischen Textes und schwächt sie nicht zu einer bloßen möglichen Folge ab.
translation_notes:
  register: Knappe, einprägsame Spruchform in modernem Standarddeutsch. Die Personifikation der Hände und die scharfe Todesaussage bleiben erhalten.
