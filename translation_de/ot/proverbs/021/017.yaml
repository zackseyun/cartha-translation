  text: אִ֣ישׁ מַ֭חְסוֹר אֹהֵ֣ב שִׂמְחָ֑ה אֹהֵ֥ב יַֽיִן וָ֝/שֶׁ֗מֶן לֹ֣א יַעֲשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/017.yaml
  text: A man who loves pleasure will become poor[b][a]; whoever loves wine and oil will not become rich.
translation:
  language: de
  text: Ein Mann, der Vergnügen liebt[a], leidet Mangel; wer Wein und Öl[b] liebt, wird nicht reich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Freude“ beziehungsweise „Fröhlichkeit“. Das hebräische Wort kann Freude oder festliches Vergnügen bezeichnen; hier ist wahrscheinlich eine genussorientierte Lebensweise gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist wahrscheinlich Olivenöl. Zusammen mit Wein kann es hier für kostspieligen Genuss oder Luxus stehen, etwa auch für wohlriechendes Salböl, nicht nur für ein alltägliches Lebensmittel.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ מַחְסוֹר
  choice: Ein Mann … wird arm
  rationale: אִישׁ bezeichnet hier in sprichwörtlicher Rede einen repräsentativen Einzelnen; מַחְסוֹר bedeutet wörtlich „Mangel“ oder „Not“. Die deutsche Ergebnisformulierung „wird arm“ gibt die knappe hebräische Nominalkonstruktion natürlich wieder.
- source_word: אֹהֵב שִׂמְחָה
  choice: der Vergnügen liebt
  rationale: שִׂמְחָה kann Freude, Fröhlichkeit oder festliches Vergnügen bezeichnen. Im Zusammenhang mit Wein und Öl warnt der Vers vor einer auf Genuss ausgerichteten Lebensweise; „Vergnügen“ trifft diesen Zusammenhang, während die Fußnote die weitere Bedeutungsbreite offenhält.
- source_word: אֹהֵב יַיִן וָשֶׁמֶן
  choice: wer Wein und Öl liebt
  rationale: יַיִן bedeutet „Wein“, שֶׁמֶן „Öl“, gewöhnlich Olivenöl. Die konkrete Bildsprache des Hebräischen bleibt erhalten; eine Fußnote erläutert die mögliche Verbindung mit kostspieligem Luxus oder Salböl.
- source_word: לֹא יַעֲשִׁיר
  choice: wird nicht reich
  rationale: 'Die Hifil-Form von עשר hat hier ohne genanntes Objekt resultative Bedeutung: Die betreffende Person gelangt nicht zu Reichtum. „Wird nicht reich“ ist präziser als das weiter gefasste „wird keinen Erfolg haben“.'
theological_decisions: []
translation_notes:
  register: Knappe, einprägsame Spruchform in modernem Standarddeutsch. Die Wiederholung von „liebt“ und der Parallelismus der beiden Halbverse bleiben erhalten; die Formulierungen sind würdevoll, aber alltagssprachlich verständlich.
