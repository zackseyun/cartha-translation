  text: A false witness will perish[a], but a man who listens will speak forever.
translation:
  language: de
  text: Ein falscher Zeuge wird zugrunde gehen, doch ein Mann, der zuhört, wird auf Dauer reden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird beständig reden“ oder „wird mit bleibender Wirkung reden“. Der hebräische Ausdruck betont wahrscheinlich eher die dauerhafte Gültigkeit als eine abstrakt endlose Zeitdauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד כְּזָבִים
  choice: Lügenzeuge
  rationale: Die Verbindung bezeichnet einen Zeugen, dessen Aussage aus Lügen besteht. „Lügenzeuge“ ist im Deutschen knapp, natürlich und bewahrt den rechtlichen Hintergrund.
- source_word: יֹאבֵד
  choice: wird zugrunde gehen
  rationale: אבד bezeichnet Untergang oder Verderben, ohne hier dessen genaue Form festzulegen. „Zugrunde gehen“ gibt die Warnung idiomatisch wieder.
- source_word: וְאִישׁ
  choice: doch ein Mann
  rationale: Das ו markiert den Gegensatz; אִישׁ ist maskulin Singular. Die konkrete Form bleibt erhalten, ohne die sprichwörtliche Reichweite einzuschränken.
- source_word: שׁוֹמֵעַ
  choice: der aufmerksam zuhört
  rationale: שמע kann „hören“, „zuhören“ oder „gehorchen“ bedeuten. Im Zusammenhang mit Zeugenaussagen liegt sorgfältiges Aufnehmen des Gehörten nahe; „aufmerksam“ verdeutlicht diese kontextuelle Nuance, ohne Gehorsam einzutragen.
- source_word: לָנֶצַח
  choice: auf Dauer
  rationale: נֶצַח kann dauernde Fortgeltung oder anhaltenden Bestand bezeichnen. „Auf Dauer“ vermeidet die im Deutschen leicht metaphysisch verstandene Aussage „für immer“ und lässt offen, ob fortgesetztes Reden oder bleibende Gültigkeit gemeint ist.
- source_word: יְדַבֵּר
  choice: wird reden
  rationale: Das Piel-Imperfekt von דבר bezeichnet hier das Reden bzw. Aussagen. Die schlichte Wiedergabe bewahrt die knappe Gegenüberstellung des Hebräischen.
theological_decisions: []
