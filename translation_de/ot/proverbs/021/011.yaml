id: PRO.21.11
reference: Proverbs 21:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/עְנָשׁ לֵ֭ץ יֶחְכַּם פֶּ֑תִי וּ/בְ/הַשְׂכִּ֥יל לְ֝/חָכָ֗ם יִקַּח דָּֽעַת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/011.yaml
  text: When a scoffer is punished[a], the simple become wise; and when a wise man is instructed[b], he gains knowledge.
translation:
  language: de
  text: Wenn ein Spötter bestraft wird,[a] wird der Naive weise; und wenn ein Weiser unterwiesen wird,[b] gewinnt er Erkenntnis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Durch die Bestrafung eines Spötters wird der Naive weise.“'
    reason: Die Präposition ב mit dem Infinitiv kann neben dem zeitlich-begleitenden auch einen instrumentalen Sinn haben.
  - marker: b
    text: 'Oder: „wenn man einem Weisen Einsicht vermittelt“.'
    reason: Der hebräische Hifil kann „unterweisen“ oder „einsichtig machen“ bedeuten; der Handelnde bleibt ungenannt.
lexical_decisions:
- source_word: בַּעְנָשׁ
  choice: Wenn ... bestraft wird
  rationale: Die Präposition ב mit dem Infinitiv von ענשׁ bezeichnet hier den zeitlichen oder begleitenden Umstand. Die finite Passivform gibt dies in natürlichem Deutsch wieder, ohne die ebenfalls mögliche instrumentale Nuance auszuschließen.
- source_word: לֵץ
  choice: ein Spötter
  rationale: לץ bezeichnet in den Sprüchen einen Menschen, der verächtlich spottet und sich der Zurechtweisung widersetzt. „Spötter“ bewahrt sowohl die sprachliche als auch die moralische Dimension.
- source_word: יֶחְכַּם
  choice: wird ... weise
  rationale: Das Qal von חכם bezeichnet hier das Erlangen von Weisheit, nicht lediglich ihren Besitz.
- source_word: פֶּתִי
  choice: der Unerfahrene
  rationale: פתי meint einen noch ungefestigten, leicht beeinflussbaren Menschen. „Unerfahrene“ ist im heutigen Deutsch verständlicher und weniger irreführend als „Einfältige“, ohne die moralische Offenheit der Gestalt festzulegen.
- source_word: וּבְהַשְׂכִּיל
  choice: und wenn man ... Einsicht vermittelt
  rationale: Der Hifil-Infinitiv von שׂכל kann das Verleihen von Einsicht oder das Unterweisen bezeichnen. Die unpersönliche Form mit „man“ bildet den nicht genannten Handelnden idiomatisch ab.
- source_word: לְחָכָם
  choice: einem Weisen
  rationale: Das substantivierte maskuline Singularadjektiv bezeichnet im sprichwörtlichen Stil einen weisen Mann als repräsentative Gestalt. Der deutsche substantivierte Ausdruck wahrt Form und Stil.
- source_word: יִקַּח דָּעַת
  choice: gewinnt er Erkenntnis
  rationale: לקח bedeutet wörtlich „nehmen“, bezeichnet zusammen mit דעת aber den Erwerb von Erkenntnis. „Erkenntnis gewinnen“ ist eine natürliche deutsche Kollokation und wahrt die Unterscheidung zwischen Weisheit und Erkenntnis.
theological_decisions:
- issue: Maskulines sprichwörtliches Beispiel
  choice: einem Weisen ... er
  alternative: einer weisen Person ... sie
  rationale: Der hebräische Text verwendet den maskulinen Singular als repräsentative sprichwörtliche Gestalt. Die Übersetzung erhält diese Form, ohne ihre allgemeine Anwendbarkeit einzuschränken.
- issue: Wie der Unerfahrene weise wird
  choice: 'zeitlich-begleitend: „Wenn ein Spötter bestraft wird“'
  alternative: 'instrumental: „Durch die Bestrafung eines Spötters“'
  rationale: Die Konstruktion mit ב kann sowohl den Anlass als auch das Mittel bezeichnen. Der Haupttext formuliert den Anlass idiomatisch; die Fußnote bewahrt die instrumentale Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Parallelstruktur. „Unerfahrene“ vermeidet die heute stark abwertende Konnotation von „Einfältige“. Die Satzhälften bleiben eng parallel, während die hebräischen Infinitivkonstruktionen idiomatisch als Wenn-Sätze wiedergegeben werden.
