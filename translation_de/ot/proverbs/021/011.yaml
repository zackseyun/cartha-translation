  timestamp: '2026-07-16T04:12:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur gibt den hebräischen Parallelismus zutreffend wieder: Die Bestrafung des Spötters steht als Anlass bzw. mögliches Mittel dafür, dass der פֶּתִי weise wird; die Belehrung eines Weisen führt zum Erwerb von דַּעַת. „Spötter“, „weise“ und „Erkenntnis“ sind sachgerecht. „Unerfahrener“ ist jedoch für פֶּתִי zu eng, da es primär fehlende Erfahrung nahelegt, während das hebräische Weisheitswort den naiven, leicht beeinflussbaren bzw. unkritischen Menschen bezeichnet. „Naiver“ trifft diese Kategorie besser. Die zweite Infinitivkonstruktion kann idiomatisch passiv wiedergegeben werden; der ungenannte Handelnde wird dadurch nicht unzulässig ergänzt.'
  naturalness: Der Vers ist knapp, verständlich und im modernen Standarddeutsch würdig. „Wenn ein Weiser unterwiesen wird“ ist gegenüber „wenn man einem Weisen Einsicht vermittelt“ natürlicher und vermeidet die etwas tautologisch wirkende Verbindung von „Einsicht vermitteln“ und anschließendem „Erkenntnis gewinnen“.
  terminology: „Spötter“ entspricht לֵץ gut. „Naiver“ gibt פֶּתִי als weisheitliche Personenbezeichnung genauer wieder als „Unerfahrener“, ohne die stark abwertende Wirkung von „Einfältiger“. „Weiser“ bewahrt die maskuline singulare repräsentative Form von חָכָם. „Erkenntnis“ erhält die im Hebräischen bestehende Unterscheidung von Weisheit und γνώ/Erkenntnis; eine doktrinäre Zuspitzung liegt nicht vor.
