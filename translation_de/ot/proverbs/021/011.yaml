revisions:
- from: Wenn ein Spötter bestraft wird,[a] wird der Unerfahrene weise; und wenn man einem Weisen Einsicht vermittelt,[b] gewinnt er Erkenntnis.
  to: Wenn ein Spötter bestraft wird,[a] wird der Naive weise; und wenn ein Weiser unterwiesen wird,[b] gewinnt er Erkenntnis.
  rationale: Die Revision schärft die Wiedergabe von פֶּתִי und ersetzt die inhaltlich zutreffende, aber etwas umständliche zweite Satzhälfte durch eine idiomatische passive Form. Die Fußnoten bleiben an ihren jeweiligen hebräischen Konstruktionen verankert und bewahren die relevante Mehrdeutigkeit der ersten Konstruktion.
