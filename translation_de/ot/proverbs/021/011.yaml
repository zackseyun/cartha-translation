    rationale: פֶּתִי bezeichnet im Sprüchebuch nicht bloß jemanden ohne Lebenserfahrung, sondern einen naiven, unkritischen und leicht beeinflussbaren Menschen. „Der Naive“ bewahrt diese weisheitliche Kategorie besser.
  - severity: low
