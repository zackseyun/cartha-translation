id: PRO.21.2
reference: Proverbs 21:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּֽל דֶּרֶךְ אִ֭ישׁ יָשָׁ֣ר בְּ/עֵינָ֑י/ו וְ/תֹכֵ֖ן לִבּ֣וֹת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/002.yaml
  text: Every man's way is right in his own eyes[a], but Yahweh weighs hearts.
translation:
  language: de
  text: Jeder Weg eines Menschen ist in seinen eigenen Augen richtig, doch Jahwe[a] wägt die Herzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der Gottesname; hier als »Jahwe« wiedergegeben.'
    reason: Die Fußnote erläutert die Wiedergabe des Tetragramms.
lexical_decisions:
- source_word: כָּל דֶּרֶךְ אִישׁ
  choice: Jeder Weg eines Menschen
  rationale: Die distributive Aussage und das Bild des »Weges« als Lebensführung bleiben erhalten. »Mensch« gibt den repräsentativen Gebrauch des maskulinen Singulars im heutigen Standarddeutsch natürlich wieder.
- source_word: יָשָׁר בְּעֵינָיו
  choice: ist in seinen eigenen Augen richtig
  rationale: Die geläufige hebräische Wendung bezeichnet die eigene Einschätzung. »Eigenen« verdeutlicht den reflexiven Bezug, während »richtig« den wertenden Sinn von יָשָׁר wiedergibt.
- source_word: וְתֹכֵן
  choice: doch … wägt
  rationale: Das Verb bezeichnet prüfendes Abwägen oder Bemessen. »Wägt« bewahrt das Bild einer Waage und stellt Gottes Urteil der menschlichen Selbsteinschätzung gegenüber.
- source_word: לִבּוֹת
  choice: die Herzen
  rationale: Im Hebräischen stehen die Herzen für das innere Denken, Wollen und die Beweggründe. Die traditionelle Metapher bleibt bewusst erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt den Charakter als Eigenname; die Fußnote macht die zugrunde liegende Namensform transparent.
- issue: Göttliches Prüfen der Herzen
  choice: wägt die Herzen
  alternative: prüft die Herzen
  rationale: »Wägt« erhält die Bildsprache des hebräischen Verbs und lässt offen, ob vor allem Gedanken, Motive oder die gesamte innere Person bewertet werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Der parallele Gegensatz zwischen menschlicher Selbsteinschätzung und göttlichem Abwägen sowie die biblischen Bilder »Weg«, »Augen«, »wägen« und »Herzen« bleiben erhalten.
