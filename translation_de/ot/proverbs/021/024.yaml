    rationale: „In anmaßender Wut“ ist möglich, lässt aber die substantivische und semantisch mit זֵד verbundene „Vermessenheit/Anmaßung“ weniger deutlich hervortreten. „In der Wut der Vermessenheit“ bewahrt die Struktur und Mehrdeutigkeit besser.
  - severity: low
