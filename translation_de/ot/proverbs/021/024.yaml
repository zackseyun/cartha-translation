  text: זֵ֣ד יָ֭הִיר לֵ֣ץ שְׁמ֑/וֹ ע֝וֹשֶׂ֗ה בְּ/עֶבְרַ֥ת זָדֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/024.yaml
  text: “Proud[a], arrogant, a scoffer” is his name—one who acts in the fury of presumption.
translation:
  language: de
  text: „Vermessen, überheblich, ein Spötter“ ist sein Name – er handelt in der Wut der Vermessenheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… er handelt mit vermessener Wut.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵד
  choice: vermessen
  rationale: זֵד bezeichnet einen Menschen, dessen Haltung von anmaßendem Stolz geprägt ist. „Vermessen“ bewahrt diesen Zug deutlicher als das allgemeinere „stolz“.
- source_word: יָהִיר
  choice: überheblich
  rationale: יָהִיר verstärkt das Bild der Selbsterhöhung. „Überheblich“ ist gegenwärtiges Standarddeutsch und bleibt von „vermessen“ semantisch unterscheidbar.
- source_word: לֵץ
  choice: ein Spötter
  rationale: לֵץ ist im Buch der Sprüche eine wiederkehrende Bezeichnung für den Menschen, der andere und Weisung verächtlich verspottet. „Spötter“ gibt diese Weisheitskategorie prägnant wieder.
- source_word: שְׁמוֹ
  choice: so nennt man einen
  rationale: Wörtlich steht „sein Name“. Die deutsche Benennungsformel vermittelt die charakterisierende Funktion natürlich, ohne sie lediglich als Ruf oder persönlichen Namen misszuverstehen.
- source_word: עֹשֶׂה
  choice: der … handelt
  rationale: Das Partizip beschreibt kennzeichnendes, wiederholtes Verhalten. Der Relativsatz bewahrt diesen allgemeinen, charakterisierenden Sinn.
- source_word: בְּעֶבְרַת
  choice: in … Wut
  rationale: עֶבְרָה bezeichnet heftigen, aufwallenden Zorn. „Wut“ erhält die Intensität und bezeichnet hier die Art und Weise des Handelns.
- source_word: זָדוֹן
  choice: anmaßender
  rationale: זָדוֹן bezeichnet Vermessenheit beziehungsweise arrogante Selbstüberhebung und ist mit זֵד verwandt. Das Adjektiv „anmaßend“ ergibt im Deutschen die natürliche Verbindung „anmaßende Wut“, während die semantische Beziehung zu „vermessen“ erhalten bleibt.
