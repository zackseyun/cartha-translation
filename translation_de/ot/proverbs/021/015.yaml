  text: Doing justice is a joy to the righteous[a], but destruction to evildoers.
translation:
  language: de
  text: Gerecht zu handeln ist dem Gerechten eine Freude, den Übeltätern aber ein Schrecken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gerecht zu handeln ist dem Gerechten eine Freude, den Übeltätern aber Verderben.“ Das hebräische Wort מְחִתָּה kann Schrecken, Bestürzung oder Verderben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחָה
  choice: Freude
  rationale: Das Substantiv bezeichnet Freude oder Frohsein; „Freude“ bewahrt die nominale Form und klingt im Deutschen natürlich.
- source_word: לַצַּדִּיק
  choice: dem Gerechten
  rationale: Die Präposition ל bezeichnet hier die Zuordnung; der substantivierte Singular צַדִּיק wird repräsentativ als „dem Gerechten“ wiedergegeben.
- source_word: עֲשׂוֹת
  choice: zu handeln
  rationale: Der Infinitivus constructus bezeichnet ein allgemeines Tun. Zusammen mit מִשְׁפָּט ergibt „gerecht zu handeln“ eine natürliche deutsche Formulierung.
- source_word: מִשְׁפָּט
  choice: gerecht
  rationale: מִשְׁפָּט bezeichnet hier das Recht beziehungsweise gerechtes Handeln. Die adverbiale Wiedergabe „gerecht“ vermittelt den Sinn der hebräischen Verbindung idiomatisch.
- source_word: וּמְחִתָּה
  choice: aber ein Schrecken
  rationale: מְחִתָּה kann Schrecken, Bestürzung oder Verderben bezeichnen. „Aber ein Schrecken“ wahrt die antithetische Parallelität und lässt die lexikalische Spannung bestehen; die Alternativen werden in der Fußnote genannt.
- source_word: לְפֹעֲלֵי אָוֶן
  choice: den Übeltätern
  rationale: Die Wendung bedeutet wörtlich „denen, die Unheil/Böses tun“. „Übeltäter“ ist eine knappe, würdige und im modernen Deutsch verständliche Entsprechung.
theological_decisions: []
