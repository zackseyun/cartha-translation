id: PRO.21.1
reference: Proverbs 21:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: פַּלְגֵי מַ֣יִם לֶב מֶ֭לֶךְ בְּ/יַד יְהוָ֑ה עַֽל כָּל אֲשֶׁ֖ר יַחְפֹּ֣ץ יַטֶּֽ/נּוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/001.yaml
  text: A king’s heart is like channels of water in the hand of Yahweh[b][a]; he turns it wherever he desires.
translation:
  language: de
  text: Wasserläufen[a] gleicht das Herz eines Königs in der Hand Jahwes; er lenkt es, wohin er will.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Wasserkanälen“ oder „Bächen“. Das hebräische Bild meint geteilte Wasserläufe, deren Richtung gesteuert werden kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „wohin es ihm gefällt“ oder „wohin er es wünscht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  choice: Wasserläufen
  rationale: Die Wendung bezeichnet geteilte Wasserläufe oder Kanäle, deren Fluss gelenkt werden kann. „Wasserläufe“ bewahrt das anschauliche Bild und klingt im Deutschen natürlich.
- source_word: לֶב מֶלֶךְ
  choice: das Herz eines Königs
  rationale: Die Status-constructus-Verbindung ist allgemein formuliert. „Eines Königs“ gibt den sprichwörtlichen, nicht auf einen bestimmten Herrscher beschränkten Sinn wieder.
- source_word: בְּיַד יְהוָה
  choice: in der Hand Jahwes
  rationale: Die hebräische Wendung bezeichnet Verfügungsgewalt und Kontrolle. Das konkrete Bild der Hand bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift des göttlichen Eigennamens bewahrt den Namen statt ihn durch einen Titel zu ersetzen.
- source_word: עַל כָּל אֲשֶׁר
  choice: wohin
  rationale: In Verbindung mit dem Verb des Lenkens bezeichnet die Wendung idiomatisch die jeweilige Richtung oder das Ziel.
- source_word: יַחְפֹּץ
  choice: er will
  rationale: חפץ kann Gefallen, Wunsch oder Willen ausdrücken. „Will“ ist knapp, gegenwärtig und lässt die genaue Nuance zwischen Wollen und Gefallen offen; eine Alternative wird in der Fußnote genannt.
- source_word: יַטֶּנּוּ
  choice: er lenkt es
  rationale: Der Hifil von נטה bedeutet hier wenden, neigen oder in eine Richtung führen. „Lenkt“ passt zum Bild steuerbarer Wasserläufe; „es“ nimmt ausdrücklich das Herz auf.
theological_decisions:
- issue: Göttliche Souveränität über Herrscher
  choice: 'Der Vers stellt das Herz eines Königs als unter Jahwes tatsächlicher Verfügungsgewalt stehend dar: Jahwe kann es nach seinem Willen lenken.'
  alternative: Man könnte die Aussage entweder als philosophisch erschöpfenden Determinismus oder abgeschwächt als bloßen Einfluss auslegen.
  rationale: „In der Hand Jahwes“ und „er lenkt es“ bewahren die starke Aussage des Hebräischen, ohne eine spätere Theorie über Vorsehung und menschliche Freiheit in den Text einzutragen.
- issue: Metaphorische Form des ersten Halbverses
  choice: „Wasserläufen gleicht“ gibt die nominale Bildaussage als Vergleich wieder.
  alternative: 'Wörtlicher wäre die harte Metapher: „Wasserläufe ist das Herz eines Königs“.'
  rationale: Im Hebräischen fehlt eine ausdrückliche Vergleichspartikel, doch die bildhafte Zuordnung bezeichnet funktionale Ähnlichkeit. Die deutsche Vergleichsform ist verständlich, ohne die Aussage in eine Erklärung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellte Bildhälfte folgt der hebräischen Hervorhebung; der Satz bleibt knapp und sprichwörtlich. „Jahwe“ gibt den Gottesnamen als Eigennamen wieder.
