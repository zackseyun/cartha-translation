  text: רוּם עֵ֭ינַיִם וּ/רְחַב לֵ֑ב נִ֖ר רְשָׁעִ֣ים חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/004.yaml
  text: Haughty eyes and a proud heart— the lamp of the wicked— are sin[a].
translation:
  language: de
  text: Hochmütige Augen, ein stolzes Herz und das Pflügen der Gottlosen – all das ist Sünde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hochmütige Augen und ein stolzes Herz – die Leuchte der Gottlosen – sind Sünde.« Das hebräische Wort kann auch als »Leuchte« verstanden werden; die hier übersetzte Vokalisierung legt dagegen eine landwirtschaftliche Bedeutung nahe, etwa »Pflügen«, »Ackerbau« oder »Brachland«.'
    reason: alternative_reading
lexical_decisions:
- source_word: רוּם עֵינַיִם
  choice: hochmütige Augen
  rationale: Die wörtliche Vorstellung von »hohen/erhobenen Augen« ist im Hebräischen ein Bild für Überheblichkeit. »Hochmütige Augen« bewahrt das Körperbild und ist im Deutschen verständlich.
- source_word: וּרְחַב לֵב
  choice: ein stolzes Herz
  rationale: Wörtlich steht hier ein »weites/breites Herz«. Im Zusammenhang bezeichnet die Wendung nicht Großzügigkeit, sondern Selbstüberhebung; »stolzes Herz« gibt diesen Sinn natürlich wieder.
- source_word: נִר
  choice: Leuchte
  rationale: Die Form wird traditionell entweder als »Leuchte« oder landwirtschaftlich als »Pflügen/Ackerland« verstanden. »Leuchte« ergibt eine knappe Apposition zu den Merkmalen der Gottlosen; die ernst zu nehmende landwirtschaftliche Deutung wird in der Fußnote erhalten.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Der Ausdruck bezeichnet in der Weisheitsliteratur Menschen, die sich moralisch schuldig machen und Gottes Ordnung missachten. »Die Gottlosen« bewahrt die knappe Gruppenbezeichnung.
- source_word: חַטָּאת
  choice: sind Sünde
  rationale: Das hebräische Substantiv bedeutet »Sünde«. Die nominale Aussage »sind Sünde« wahrt die Schärfe des Originals besser als das glättende Adjektiv »sind sündig«.
theological_decisions:
- issue: Deutung von נִר רְשָׁעִים
  choice: die Leuchte der Gottlosen
  alternative: das Pflügen, der Ackerbau oder das Brachland der Gottlosen
  rationale: Die Entscheidung ist vor allem textlich und lexikalisch. Die Lesart »Leuchte« lässt den Ausdruck als zusammenfassendes Bild für das erscheinen, was die Gottlosen innerlich leitet oder ihnen Glanz verleiht. Da die masoretische Form auch eine landwirtschaftliche Deutung nahelegt, wird diese nicht ausgeschlossen, sondern ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche markieren die knappe hebräische Apposition, ohne ihre syntaktische und inhaltliche Spannung aufzulösen.
