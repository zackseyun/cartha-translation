source:
  edition: WLC
  text: ס֗וּס מ֭וּכָן לְ/י֣וֹם מִלְחָמָ֑ה וְ֝/לַֽ/יהוָ֗ה הַ/תְּשׁוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/031.yaml
  text: A horse is prepared for the day of battle[a], but victory belongs to Yahweh.
translation:
  language: de
  text: Ein Pferd wird für den Tag der Schlacht gerüstet, doch bei Jahwe liegt der Sieg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »doch bei Jahwe liegt die Rettung« beziehungsweise »die Befreiung«. Das hebräische Wort kann allgemein Rettung oder Befreiung bezeichnen; im Zusammenhang der Schlacht passt »Sieg« besonders gut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּס
  choice: Pferd
  rationale: Das Substantiv bezeichnet allgemein ein Pferd. Der militärische Zusammenhang wird bereits durch »für den Tag der Schlacht« deutlich; »Streitross« wäre expliziter als der hebräische Text.
- source_word: מוּכָן
  choice: wird ... gerüstet
  rationale: Das passive Partizip bezeichnet einen Zustand des Vorbereitetseins. Im militärischen Zusammenhang ist »wird gerüstet« natürlich und bewahrt den passiven Sinn.
- source_word: לְיוֹם מִלְחָמָה
  choice: für den Tag der Schlacht
  rationale: Die Präposition לְ bezeichnet hier Zweck beziehungsweise Ausrichtung. »Tag der Schlacht« gibt die knappe hebräische Wendung passend wieder.
- source_word: וְלַיהוָה
  choice: doch ... kommt von Jahwe
  rationale: Das וְ leitet hier einen inhaltlichen Gegensatz zwischen menschlicher Vorbereitung und dem von Gott bestimmten Ausgang ein. Die Zugehörigkeitskonstruktion mit לְ wird im Deutschen idiomatisch durch »kommt von« ausgedrückt.
- source_word: יהוה
  choice: Jahwe
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen יהוה; »Jahwe« gibt diesen Namen im modernen Standarddeutsch wieder.
- source_word: הַתְּשׁוּעָה
  choice: der Sieg
  rationale: תְּשׁוּעָה kann Rettung, Befreiung oder Sieg bedeuten. Im unmittelbaren Kontext der Schlacht bezeichnet »Sieg« am klarsten den von Jahwe gewährten Ausgang, ohne die weitere Bedeutungsbreite zu leugnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Da im Ausgangstext der Eigenname יהוה steht, wird er als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bedeutung von תְּשׁוּעָה im militärischen Kontext
  choice: der Sieg kommt von Jahwe
  alternative: die Rettung/Befreiung kommt von Jahwe
  rationale: Der Schlachtkontext legt »Sieg« nahe. Eine Fußnote bewahrt die breitere lexikalische Möglichkeit und vermeidet, die Bedeutung ausschließlich auf militärischen Erfolg festzulegen.
translation_notes:
  register: Knappe, würdige Spruchsprache in modernem Standarddeutsch. »Gerüstet« hält den militärischen Bezug aufrecht, ohne סוּס zu »Streitross« zu erweitern. Die adversative Spannung zwischen menschlicher Vorsorge und Gottes entscheidendem Handeln bleibt bestehen.
