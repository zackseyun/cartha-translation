  text: A wicked man puts on a bold face[a], but an upright man makes his way sure.
translation:
  language: de
  text: Ein gottloser Mann setzt eine dreiste Miene auf[a], ein aufrichtiger Mann aber ordnet seine Wege[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: macht sein Gesicht stark oder hart; auch: tritt unverfroren auf.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Qere-Lesung lautet: „bedenkt seinen Weg“ oder „versteht seinen Weg“; der geschriebene Text lautet: „ordnet seine Wege“.'
    reason: textual_variant
lexical_decisions:
- source_word: הֵעֵז … בְּפָנָיו
  choice: setzt eine dreiste Miene auf
  rationale: Die Verbindung bezeichnet wörtlich ein Stark- oder Hartmachen des Gesichts und idiomatisch dreistes, unerschrockenes Auftreten. Die deutsche Wendung bewahrt das Bild des Gesichts und klingt zugleich natürlich.
- source_word: אִישׁ רָשָׁע
  choice: ein gottloser Mann
  rationale: „Gottlos“ gibt die in den Sprüchen übliche moralische Kategorie רָשָׁע wieder; „Mann“ wahrt die maskuline Singularform des exemplarisch formulierten Spruchs.
- source_word: וְיָשָׁר הוּא
  choice: ein aufrichtiger Mann aber
  rationale: Die indefinite Form entspricht dem artikellosen יָשָׁר; „aber“ macht den klaren Gegensatz zum gottlosen Mann deutlich. הוּא wird im Deutschen durch die hervorgehobene Gegenüberstellung sinngemäß wiedergegeben.
- source_word: יכין
  choice: legt … fest
  rationale: Das Hifil von כון bedeutet festmachen, begründen oder ordnen. „Festlegen“ gibt hier die bewusste und beständige Ausrichtung des Lebenswandels idiomatisch wieder.
- source_word: דרכיו
  choice: seine Wege
  rationale: Der Plural des hebräischen Textes wird bewahrt; „Wege“ bezeichnet im weisheitlichen Sprachgebrauch die Lebensführung und ihre einzelnen Bahnen.
theological_decisions: []
