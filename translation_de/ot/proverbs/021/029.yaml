  register: Modernes, würdiges Standarddeutsch in knapper Spruchform. Die parallele Struktur und der moralische Gegensatz des Hebräischen bleiben erhalten; die Gesichtswendung wird idiomatisch, aber mit ihrem Bildgehalt wiedergegeben.
