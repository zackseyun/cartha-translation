base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/003.yaml
  text: To do righteousness and justice is more acceptable to Yahweh than sacrifice[a].
translation:
  language: de
  text: Gerechtigkeit und Recht zu üben ist Jahwe lieber als Opfer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ist Jahwe erwählt/ausgewählt gegenüber Opfer“; im Zusammenhang bedeutet dies, dass Jahwe gerechtes Handeln dem Opfer vorzieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֹׂה
  choice: zu üben
  rationale: Der substantivisch gebrauchte Infinitiv bezeichnet das Ausüben beziehungsweise Tun. „Zu üben“ verbindet sich im Deutschen natürlich mit „Gerechtigkeit und Recht“ und bezeichnet beständiges praktisches Handeln, ohne dem Hebräischen einen zusätzlichen Sinn aufzuzwingen.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Das Wort bezeichnet hier rechtes, gerechtes Verhalten. „Gerechtigkeit“ bewahrt zusammen mit מִשְׁפָּט die traditionelle und inhaltlich unterscheidbare Wortpaarung.
- source_word: וּמִשְׁפָּט
  choice: und Recht
  rationale: מִשְׁפָּט bezeichnet in diesem ethischen Zusammenhang Recht beziehungsweise gerechtes Urteil und Handeln. „Recht“ ist knapp, idiomatisch und unterscheidet sich im Deutschen ausreichend von „Gerechtigkeit“.
- source_word: נִבְחָר
  choice: ist … lieber
  rationale: Das Nifal-Partizip von בחר bedeutet wörtlich „ist erwählt“ und drückt mit dem Vergleichssatz Gottes Vorzug aus. „Ist Jahwe lieber“ gibt diese Präferenz in natürlichem Deutsch wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל bezeichnet hier denjenigen, dessen Vorzug gemeint ist. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im Deutschen geläufigen Form des Namens.
- source_word: מִזָּבַח
  choice: als ein Opfer
  rationale: Das präfigierte מִן kennzeichnet den Vergleich. זֶבַח bezeichnet ein Opfer, insbesondere ein Schlachtopfer; „ein Opfer“ ist allgemeinverständlich und entspricht der allgemeinen Aussage des Spruchs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von gerechtem Handeln und Opfer
  choice: Gottes Vorzug wird vergleichend als „lieber als“ ausgedrückt
  alternative: Opfer werden grundsätzlich verworfen
  rationale: Der Komparativ stellt gerechtes Handeln über das Opfer, sagt aber nicht ausdrücklich, dass jedes Opfer an sich abgelehnt wird. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Parallelstruktur des Weisheitsspruchs bleibt erhalten; „Gerechtigkeit und Recht“ wahrt die hebräische Begriffspaarung.
