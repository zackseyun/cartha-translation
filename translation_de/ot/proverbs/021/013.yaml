  text: אֹטֵ֣ם אָ֭זְנ/וֹ מִ/זַּעֲקַת דָּ֑ל גַּֽם ה֥וּא יִ֝קְרָ֗א וְ/לֹ֣א יֵעָנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/013.yaml
  text: Whoever shuts his ear to the cry of the poor will also call out and not be answered[a].
translation:
  language: de
  text: Wer sein Ohr vor dem Schrei eines Armen[a] verschließt, wird auch er rufen und keine Antwort erhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines Schwachen“ oder „eines Bedürftigen“. Das hebräische Wort דָּל kann einen armen, schwachen oder gesellschaftlich benachteiligten Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹטֵם
  choice: verschließt
  rationale: Das qalische Partizip bezeichnet ein bewusstes Verschließen oder Verstopfen. „Verschließt“ ist im Deutschen natürlich und bewahrt den Gedanken der absichtlichen Weigerung zu hören.
- source_word: אָזְנוֹ
  choice: sein Ohr
  rationale: Der hebräische Text hat den Singular mit maskulinem Suffix. Die konkrete Bildsprache lässt sich im Deutschen idiomatisch mit „sein Ohr“ erhalten.
- source_word: מִזַּעֲקַת
  choice: vor dem Schrei
  rationale: Bei der Wendung אטם אזן bezeichnet die Präposition das, wogegen sich jemand dem Hören verschließt. „Sein Ohr vor dem Schrei verschließen“ ist eine natürliche deutsche Entsprechung.
- source_word: דָּל
  choice: eines Armen
  rationale: דָּל kann einen armen, schwachen oder gesellschaftlich benachteiligten Menschen bezeichnen. „Eines Armen“ ist im Kontext der Weisheitsliteratur klar und bewahrt den generischen maskulinen Singular.
- source_word: גַּם הוּא
  choice: auch selbst
  rationale: 'Die Verbindung hebt die vergeltende Entsprechung hervor: Wer nicht hört, wird seinerseits vergeblich rufen. „Auch selbst“ gibt diesen Nachdruck idiomatisch wieder.'
- source_word: יִקְרָא
  choice: wird … rufen
  rationale: Das Verb bedeutet „rufen“ oder „laut rufen“. Die schlichte Wiedergabe lässt offen, an wen der Ruf gerichtet ist.
- source_word: וְלֹא יֵעָנֶה
  choice: und keine Antwort erhalten
  rationale: Der Nifal drückt aus, dass der Rufende nicht erhört beziehungsweise ihm nicht geantwortet wird. Diese Formulierung ist natürlich und lässt den Handelnden wie im Hebräischen ungenannt.
theological_decisions:
- issue: Wer den Ruf nicht beantwortet
  choice: Der Handelnde bleibt im Haupttext ungenannt.
  alternative: Gott ausdrücklich als denjenigen nennen, der nicht antwortet, oder andere Menschen als Antwortende voraussetzen.
  rationale: Der hebräische Passivsatz nennt keinen Handelnden. Er kann im Zusammenhang göttliche Vergeltung nahelegen, legt dies sprachlich aber nicht ausdrücklich fest; die Übersetzung bewahrt diese Offenheit.
- issue: Generisches Maskulinum
  choice: Der maskuline Singular wird mit „sein Ohr“ und „eines Armen“ repräsentativ wiedergegeben.
  alternative: Eine geschlechtsneutrale Pluralform oder eine Umschreibung wie „eines bedürftigen Menschen“ verwenden.
  rationale: Die hebräischen Formen stehen im maskulinen Singular und sind allgemein-repräsentativ gebraucht. Die deutsche Fassung erhält diese grammatische Gestalt, ohne die Aussage auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige Wendung „sein Ohr vor … verschließen“ bewahrt das konkrete Bild und die bewusste Verweigerung. Der parallele Aufbau und die offene Angabe dessen, der nicht antwortet, bleiben erhalten.
