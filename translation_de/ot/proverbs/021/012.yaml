source:
  edition: WLC
  text: מַשְׂכִּ֣יל צַ֭דִּיק לְ/בֵ֣ית רָשָׁ֑ע מְסַלֵּ֖ף רְשָׁעִ֣ים לָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/012.yaml
  text: The righteous one considers the house of the wicked[a], bringing the wicked to ruin.
translation:
  language: de
  text: Ein Gerechter nimmt das Haus eines Frevlers mit Bedacht in den Blick[a] und stürzt Frevler ins Verderben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Gerechte nimmt das Haus eines Frevlers mit Bedacht in den Blick und stürzt Frevler ins Verderben“, wobei mit „dem Gerechten“ Gott gemeint ist.'
    reason: Alternative Deutung des nicht ausdrücklich genannten Subjekts.
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: nimmt … mit Bedacht in den Blick
  rationale: Das Hifil-Partizip von שכל bezeichnet einsichtsvolles, überlegtes Handeln beziehungsweise aufmerksames Erwägen. Die Formulierung gibt die bedachte Wahrnehmung in natürlichem Deutsch wieder, ohne den Ausdruck auf bloßes Sehen oder theoretisches Verstehen zu verengen.
- source_word: צַדִּיק
  choice: Ein Gerechter
  rationale: Das maskuline Singularadjektiv wird substantivisch und repräsentativ gebraucht. „Ein Gerechter“ bewahrt die individuelle Gestalt des Spruchs und legt im Haupttext keine göttliche Identität fest.
- source_word: לְבֵית רָשָׁע
  choice: das Haus eines Frevlers
  rationale: בַּיִת kann das Gebäude, den Besitz oder den Haushalt bezeichnen; „Haus“ hält diese Bedeutungsbreite offen. רָשָׁע steht im Singular und wird hier als unbestimmte Einzelperson wiedergegeben.
- source_word: מְסַלֵּף
  choice: stürzt … ins Verderben
  rationale: סלף kann ein Umstürzen, Zunichtemachen oder Zugrunderichten ausdrücken. Zusammen mit לָרָע bezeichnet die Wendung hier am ehesten den Sturz in ein unheilvolles Ergebnis.
- source_word: רְשָׁעִים
  choice: Frevler
  rationale: Das substantivierte Adjektiv steht im Plural. „Frevler“ ist knapp, spruchhaft und bezeichnet Menschen, deren Handeln moralisch verwerflich ist.
- source_word: לָרָע
  choice: ins Verderben
  rationale: רַע kann neben moralischem Bösen auch Unheil, Unglück oder Verderben bezeichnen. In dieser resultativen Verbindung ist „ins Verderben“ idiomatisch und vermeidet die irreführende Aussage, jemand werde moralisch böse gemacht.
theological_decisions:
- issue: Wer ist das Subjekt der beiden Partizipialkonstruktionen?
  choice: Im Haupttext ist ein gerechter Mensch das durchgehende Subjekt.
  alternative: '„Der Gerechte“ kann als Bezeichnung Gottes verstanden werden: Gott nimmt das Haus des Frevlers in den Blick und stürzt Frevler ins Verderben.'
  rationale: Der hebräische Text nennt Gott nicht ausdrücklich. Am unmittelbarsten bezeichnet צַדִּיק daher einen gerechten Menschen, der auch als Subjekt des zweiten Partizips verstanden wird. Wegen der knappen Syntax und der inhaltlichen Aussage über den Sturz der Frevler bleibt die traditionelle Deutung auf Gott jedoch möglich und wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper spruchhafter Struktur. „Frevler“ wahrt den ethischen Gehalt von רָשָׁע, während „mit Bedacht in den Blick nehmen“ die ungewöhnliche Hifil-Form natürlich und zugleich quellengetreu wiedergibt.
