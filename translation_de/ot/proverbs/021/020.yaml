  text: אוֹצָ֤ר נֶחְמָ֣ד וָ֭/שֶׁמֶן בִּ/נְוֵ֣ה חָכָ֑ם וּ/כְסִ֖יל אָדָ֣ם יְבַלְּעֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/020.yaml
  text: Precious treasure and oil are in the dwelling of a wise man[a], but a foolish man swallows them up.
translation:
  language: de
  text: Kostbarer Vorrat und Öl sind im Haus eines Weisen, doch ein törichter Mensch verschlingt ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „verschlingt ihn“. Das hebräische Verb zeichnet ein anschauliches Bild; möglich sind auch: „verbraucht ihn“ oder „zehrt ihn auf“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹצָר נֶחְמָד
  choice: kostbarer Vorrat
  rationale: אוֹצָר bezeichnet aufbewahrten Besitz oder Vorräte, נֶחְמָד deren begehrenswerten bzw. wertvollen Charakter. „Kostbarer Vorrat“ passt zum Gegensatz zwischen weiser Aufbewahrung und törichtem Verbrauch.
- source_word: וָשֶׁמֶן
  choice: und Öl
  rationale: שֶׁמֶן meint häufig Olivenöl, doch die Ölsorte wird im Text nicht ausdrücklich bestimmt. Daher bleibt die Übersetzung bei „Öl“.
- source_word: בִּנְוֵה
  choice: im Haus
  rationale: נָוֶה bezeichnet hier den Wohnort oder die Behausung. „Im Haus“ ist im modernen Deutschen natürlich und bewahrt das häusliche Bild.
- source_word: חָכָם
  choice: eines Weisen
  rationale: Das maskuline Singularwort wird substantivisch und als allgemeiner Menschentyp gebraucht. „Eines Weisen“ wahrt Form und sprichwörtlichen Stil.
- source_word: וּכְסִיל אָדָם
  choice: doch ein törichter Mensch
  rationale: כְּסִיל ist der feste weisheitliche Begriff für einen unverständigen bzw. törichten Menschen; אָדָם hebt den menschlichen Typ hervor. „Törichter Mensch“ gibt beides ohne unnötige Verschärfung wieder.
- source_word: יְבַלְּעֶנּוּ
  choice: verschlingt das alles
  rationale: Das Verb בלע bedeutet bildhaft „verschlingen“. Der singularische Objektsuffix nimmt den zuvor genannten Bestand zusammenfassend auf; „das alles“ macht diesen kollektiven Bezug im Deutschen verständlich, ohne das kräftige Bild abzuschwächen.
theological_decisions:
- issue: Geschlechtlich markierte sprichwörtliche Typen in חָכָם ... כְסִיל אָדָם
  choice: „eines Weisen … ein törichter Mensch“
  alternative: „bei weisen Menschen … törichte Menschen“
  rationale: Der hebräische Text verwendet maskuline Singularformen als repräsentative Menschentypen. Die Übersetzung bewahrt den Singular und die grammatische Form, ohne die allgemeine Geltung des Spruchs einzuschränken.
- issue: Bezug des singularischen Suffixes in יְבַלְּעֶנּוּ
  choice: 'zusammenfassender Bezug auf den genannten Vorrat und das Öl: „das alles“'
  alternative: „ihn“ mit engem Bezug auf אוֹצָר oder „sie“ nach deutscher Mehrzahlkongruenz
  rationale: Die Singularform lässt grammatisch einen engen Bezug auf אוֹצָר zu, kann aber die genannten Güter auch kollektiv zusammenfassen. „Das alles“ erhält diese Spannung und vermeidet einen irreführend ausschließlich auf „Vorrat“ bezogenen deutschen Maskulinpronomengebrauch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Satzstruktur. „Haus“ ist natürlicher als „Wohnstätte“, und „verschlingt“ bewahrt die Bildkraft des Hebräischen.
