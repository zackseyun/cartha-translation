review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von אוֹצָר נֶחְמָד als „kostbarer Vorrat“, von שֶׁמֶן als „Öl“ und von בִּנְוֵה als „im Haus“ ist quellentreu. Das Objektsuffix in יְבַלְּעֶנּוּ ist jedoch Singular. „das alles“ legt einen kollektiven Bezug auf beide zuvor genannten Güter fest, während der hebräische Singular zumindest vorrangig auf den „Vorrat“ zurückweist und die genaue Reichweite nicht ausdrücklich ausformuliert.
  naturalness: „Kostbarer Vorrat und Öl sind im Haus eines Weisen“ ist knapp, idiomatisch und dem sprichwörtlichen Register angemessen. „Ihn“ hat mit dem maskulinen „Vorrat“ einen klaren, natürlichen Bezug.
  terminology: „Weiser“ und „törichter Mensch“ geben die repräsentativen menschlichen Typen angemessen wieder. „Verschlingt“ erhält die Bildkraft von בלע. Die Fußnote muss den Singularbezug korrekt als „ihn“ bezeichnen, nicht als „es“.
  issues:
  - severity: medium
    issue: „das alles“ vereinheitlicht den singularischen Objektbezug.
    rationale: Der hebräische Text hat in יְבַלְּעֶנּוּ ein singularisches Suffix. Die Form kann die Vorräte kontextuell in den Blick nehmen, doch die deutsche Formulierung „das alles“ entscheidet sich unnötig für einen umfassenden Bezug auf Vorrat und Öl. „ihn“ bewahrt den grammatischen Bezug auf „Vorrat“ und die knappe Form des Spruchs.
  - severity: low
    issue: Die Fußnote bezeichnet die wörtliche Form ungenau als „es“.
    rationale: Bei der revidierten deutschen Bezugsgröße „Vorrat“ ist „ihn“ die sachlich und grammatisch präzise Wiedergabe des hebräischen singularischen Suffixes.
  revised_text: Kostbarer Vorrat und Öl sind im Haus eines Weisen, doch ein törichter Mensch verschlingt ihn.[a]
