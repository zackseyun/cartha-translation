- from: Kostbarer Vorrat und Öl finden sich im Haus eines Weisen; doch ein törichter Mensch verschlingt das alles.[a]
  to: Kostbarer Vorrat und Öl sind im Haus eines Weisen, doch ein törichter Mensch verschlingt ihn.[a]
  rationale: Die Revision ersetzt die kollektivierende Formulierung „das alles“ durch das singularische „ihn“ und bringt damit den Objektbezug sowie die Fußnote in Einklang mit dem hebräischen Suffix. Die übrigen Entscheidungen sind quellentreu und sprachlich angemessen.
