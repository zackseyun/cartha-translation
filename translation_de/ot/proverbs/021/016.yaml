  source_fidelity: 'Die Übersetzung gibt die hebräische Satzstruktur und Aussage zuverlässig wieder: אָדָם ist treffend generisch als „Ein Mensch“ gefasst; „vom Weg der Einsicht abirrt“ entspricht תּוֹעֶה מִדֶּרֶךְ הַשְׂכֵּל. „wird in der Versammlung der Toten Ruhe finden“ bewahrt sowohl die Zukunftsfolge von יָנוּחַ als auch das Kollektivbild von בִּקְהַל רְפָאִים. Die düstere, nicht notwendig friedvolle Nuance von „Ruhe“ wird durch den Kontext deutlich.'
