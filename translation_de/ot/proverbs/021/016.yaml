  terminology: „Einsicht“ ist für הַשְׂכֵּל sachgerecht. „Versammlung“ gibt קָהָל ohne kirchliche Überladung wieder. „die Toten“ ist im Kontext eine verständliche Übersetzung von רְפָאִים; die Fußnote nennt mit „die Schatten“ eine plausible lexikalische Alternative und erläutert den Ausdruck ausreichend. Der Fußnotenanker steht korrekt bei „Toten“.
