id: PRO.21.16
reference: Proverbs 21:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָדָ֗ם תּ֭וֹעֶה מִ/דֶּ֣רֶךְ הַשְׂכֵּ֑ל בִּ/קְהַ֖ל רְפָאִ֣ים יָנֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/016.yaml
  text: A man who wanders from the way of understanding will come to rest in the assembly of the dead[a].
translation:
  language: de
  text: Ein Mensch, der vom Weg der Einsicht abirrt, wird in der Versammlung der Toten[a] Ruhe finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Schatten“. Das hebräische Wort Rephaim bezeichnet in der Weisheitsliteratur die verstorbenen Bewohner der Unterwelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: Ein Mensch
  rationale: Das singularische אָדָם bezeichnet hier einen repräsentativen Menschen. „Ein Mensch“ bewahrt die persönliche, sprichwörtliche Aussage und ist im modernen Deutschen natürlich, ohne das generische Hebräisch unnötig auf Männer einzugrenzen.
- source_word: תּוֹעֶה
  choice: der … abirrt
  rationale: Das Partizip bezeichnet jemanden, der vom richtigen Weg abkommt. „Abirrt“ erhält die Wegmetaphorik und den warnenden Charakter des Spruchs.
- source_word: מִדֶּרֶךְ
  choice: vom Weg
  rationale: „Weg“ ist ein zentraler Begriff der Weisheitsliteratur für Lebensführung und Verhalten; die Metapher wird daher ausdrücklich bewahrt.
- source_word: הַשְׂכֵּל
  choice: der Einsicht
  rationale: הַשְׂכֵּל bezeichnet verständige, kluge Einsicht. „Einsicht“ ist prägnant, würdig und passt idiomatisch zur Wendung „Weg der Einsicht“.
- source_word: בִּקְהַל
  choice: in der Versammlung
  rationale: קָהָל bezeichnet eine versammelte Gemeinschaft. „Versammlung“ erhält das kollektive Bild und vermeidet hier eine unnötig kirchliche Färbung.
- source_word: רְפָאִים
  choice: der Toten
  rationale: רְפָאִים bezeichnet in diesem weisheitlichen Zusammenhang die Verstorbenen in der Unterwelt, nicht das gleichnamige Volk. „Die Toten“ vermittelt den Sinn verständlich; die wörtlichere Nuance wird in der Fußnote angegeben.
- source_word: יָנוּחַ
  choice: wird … Ruhe finden
  rationale: 'נוּחַ bedeutet ruhen oder zur Ruhe kommen. Die Formulierung wahrt die düstere Ironie: Das Abirren endet nicht in heilsamer Ruhe, sondern in der Gemeinschaft der Toten.'
theological_decisions:
- issue: Bedeutung von רְפָאִים in der Weisheitsliteratur
  choice: die Toten
  alternative: die Schatten; die Rephaim
  rationale: Der Kontext beschreibt als Folge des Abirrens den Tod beziehungsweise die Gemeinschaft der Verstorbenen. Eine unübersetzte Wiedergabe als „Rephaim“ wäre missverständlich; „Schatten“ bewahrt zwar die Unterweltsvorstellung genauer, ist im Deutschen jedoch weniger unmittelbar. Die Alternative bleibt deshalb in einer Fußnote sichtbar.
- issue: Bedeutungsnuance von יָנוּחַ
  choice: Ruhe finden
  alternative: ruhen; sich niederlassen
  rationale: 'Die Formulierung lässt die Spannung des hebräischen Ausdrucks stehen: „Ruhe“ kann zunächst positiv klingen, wird durch „Versammlung der Toten“ aber als endgültiges Ankommen im Tod bestimmt. Diese Ironie wird nicht erklärend in den Haupttext eingetragen.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Die parallele Weg- und Zielmetaphorik des Hebräischen bleibt erhalten; „Versammlung“ und „Ruhe finden“ bewahren zugleich die bildhafte und düster-ironische Spannung des Verses.
