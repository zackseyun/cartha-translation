  source_fidelity: 'Der deutsche Text gibt die Satzstruktur und die zentrale Wortwiederholung des Hebräischen zuverlässig wieder: Das aktiv-anhaltende רֹדֵף ist mit „strebt“ idiomatisch erfasst, und יִמְצָא als allgemeine Folge mit „wird … finden“. „Leben“, „Gerechtigkeit“ und „Ehre“ entsprechen חַיִּים, צְדָקָה und כָבוֹד angemessen. Die zweimalige Wiedergabe von צְדָקָה bewahrt die im Ausgangstext bestehende semantische Offenheit und Wiederholung.'
