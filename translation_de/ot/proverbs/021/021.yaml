id: PRO.21.21
reference: Proverbs 21:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רֹ֭דֵף צְדָקָ֣ה וָ/חָ֑סֶד יִמְצָ֥א חַ֝יִּ֗ים צְדָקָ֥ה וְ/כָבֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/021.yaml
  text: Whoever pursues righteousness and steadfast love will find life[a], righteousness[c][b], and honor.
translation:
  language: de
  text: Wer nach Gerechtigkeit[a] und treuer Liebe[b] strebt, wird Leben, Gerechtigkeit[c] und Ehre finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann sowohl persönliche Rechtschaffenheit als auch gerechtes Handeln oder Recht bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: „Treue Liebe“ gibt das hebräische ḥesed wieder; je nach Zusammenhang sind auch „Güte“, „Barmherzigkeit“ oder „verlässliche Liebe“ möglich.
    reason: lexical_alternative
  - marker: c
    text: Beim zweiten Vorkommen kann „Gerechtigkeit“ im Zusammenhang auch die Bestätigung oder Anerkennung als gerecht bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹדֵף
  choice: strebt nach
  rationale: Das Partizip bezeichnet ein aktives, fortgesetztes Verfolgen eines Ziels. „Nach etwas streben“ gibt dies im modernen Deutschen natürlich wieder.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Der Begriff umfasst sowohl persönliche Rechtschaffenheit als auch gerechtes Handeln. „Gerechtigkeit“ bewahrt diese moralische und soziale Weite und ermöglicht es, die Wiederholung des hebräischen Wortes beizubehalten.
- source_word: חֶסֶד
  choice: treue Liebe
  rationale: חֶסֶד bezeichnet eine von Treue, Güte und Verlässlichkeit geprägte Liebe. „Treue Liebe“ bewahrt diese Bedeutungsdichte besser als das allgemeinere „Güte“ allein.
- source_word: יִמְצָא
  choice: wird finden
  rationale: Das Imperfekt beschreibt hier die allgemeine Folge des genannten Strebens. Die deutsche Futurform bringt den verheißenden Ergebnissatz klar zum Ausdruck.
- source_word: חַיִּים
  choice: Leben
  rationale: Obwohl die hebräische Form morphologisch ein Plural ist, bezeichnet sie idiomatisch das Leben und wird im Deutschen natürlich im Singular wiedergegeben.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Die zweite Verwendung wird ebenso übersetzt wie die erste, damit die pointierte Wiederholung des Hebräischen sichtbar bleibt. Im Zusammenhang kann zugleich Rechtfertigung oder Anerkennung als gerecht mitschwingen.
- source_word: כָבוֹד
  choice: Ehre
  rationale: Im weisheitlichen Zusammenhang bezeichnet כָבוֹד vor allem Ansehen und Würde. „Ehre“ passt zur Reihe mit Leben und Gerechtigkeit, ohne materiellen Wohlstand hineinzulesen.
theological_decisions:
- issue: Bedeutung des zweimal verwendeten צְדָקָה
  choice: Beide Vorkommen werden mit „Gerechtigkeit“ wiedergegeben.
  alternative: „Rechtschaffenheit“ oder „Recht“ bei einem oder beiden Vorkommen; beim zweiten auch „Rechtfertigung“ beziehungsweise „Bestätigung als gerecht“.
  rationale: Die einheitliche Wiedergabe erhält die sprachliche und theologisch-moralische Symmetrie des Spruchs. Die mögliche besondere Nuance des zweiten Vorkommens wird in einer Fußnote offengehalten, statt im Haupttext einseitig festgelegt zu werden.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die Satzform bewahrt die knappe Struktur und die Wiederholung des hebräischen Spruchs; „treue Liebe“ hält die besondere Bedeutungsfülle von חֶסֶד sichtbar.
