  text: ט֗וֹב שֶׁ֥בֶת בְּ/אֶֽרֶץ מִדְבָּ֑ר מֵ/אֵ֖שֶׁת מדונים וָ/כָֽעַס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/019.yaml
  text: It is better to live in a desert land than with a quarrelsome and angry wife[a].
translation:
  language: de
  text: Besser ist es, in einem Wüstenland zu wohnen, als mit einer streitsüchtigen und zornigen Frau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als mit einer streitsüchtigen und ärgerlichen Frau.“ Das letzte Wort kann entweder ihre Gemütsart („zornig“) oder ihre Wirkung auf andere („ärgerlich, Verdruss bereitend“) bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Besser ist es
  rationale: Das prädikative Adjektiv eröffnet einen Vergleich; die ergänzte Formulierung ist im Deutschen vollständig und sprichwortartig.
- source_word: שֶׁבֶת
  choice: zu wohnen
  rationale: Der Infinitiv von ישׁב bezeichnet hier ein dauerhaftes Wohnen oder Leben, nicht bloß ein Sitzen.
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: in einem Wüstenland
  rationale: Die Wiedergabe bewahrt sowohl אֶרֶץ („Land“) als auch מִדְבָּר („Wüste, unbewohnte Wildnis“) und klingt im modernen Deutsch natürlich.
- source_word: מֵאֵשֶׁת
  choice: als mit einer … Frau
  rationale: מִן markiert nach טוֹב den Vergleich. Durch „mit“ wird idiomatisch ausgedrückt, dass es um das Zusammenleben mit der Frau geht.
- source_word: מדונים
  choice: streitsüchtigen
  rationale: Der abstrakte Plural von מדון („Streit, Zwietracht“) charakterisiert die Frau als fortwährend streitend; „streitsüchtig“ ist prägnant und gegenwärtig.
- source_word: וָכָעַס
  choice: und zornigen
  rationale: כעס kann Zorn, Verdruss oder das Hervorrufen von Verärgerung bezeichnen. „zornig“ gibt die dispositionale Lesart knapp wieder; die alternative Wirkungslesart wird in der Fußnote bewahrt.
theological_decisions: []
