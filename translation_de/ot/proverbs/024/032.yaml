  text: Then I saw and took it to heart[b][a]; I looked and received instruction.
translation:
  language: de
  text: Ich sah es und nahm es mir zu Herzen[a]; ich betrachtete es und nahm die Unterweisung an[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich richtete/setzte mein Herz“; das Bezugsobjekt ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nahm die Mahnung an“; das hebräische Wort kann auch „Zurechtweisung“ oder „Zucht“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶחֱזֶה
  choice: Ich sah es
  rationale: חזה bezeichnet hier aufmerksames Sehen bzw. Wahrnehmen. Das im Deutschen ergänzte „es“ nimmt den Gegenstand der Beobachtung aus dem Zusammenhang auf und ergibt einen natürlichen Satz.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen hebt die Person des Beobachters hervor; die deutsche Wortstellung trägt die nötige Betonung, ohne das schwerfällige „ich selbst“ zu verlangen.
- source_word: אָשִׁית לִבִּי
  choice: nahm es mir zu Herzen
  rationale: Wörtlich heißt die Wendung „ich richtete/setzte mein Herz darauf“. Die gewählte deutsche Redewendung gibt die bewusste innere Betrachtung natürlich und sinngenau wieder.
- source_word: רָאִיתִי
  choice: ich betrachtete es
  rationale: ראה bedeutet grundsätzlich „sehen“. „Betrachten“ verdeutlicht hier den aufmerksamen Blick und wahrt zugleich die Abfolge von Wahrnehmung, Besinnung und Lernen.
- source_word: לָקַחְתִּי מוּסָר
  choice: nahm die Unterweisung an
  rationale: לקח bezeichnet das Nehmen bzw. Empfangen, מוּסָר in der Weisheitsliteratur Unterweisung, Mahnung, Zucht oder Korrektur. „Unterweisung annehmen“ bewahrt sowohl den lehrhaften Inhalt als auch die aktive Aufnahme.
