  register: Modernes, würdiges Standarddeutsch. Die parallele Bewegung vom Sehen über die innere Betrachtung bis zur angenommenen Unterweisung bleibt erhalten; die Bedeutungsbreite von מוּסָר wird in einer Fußnote offengehalten.
