  source_fidelity: 'Die beiden prohibitivischen Aufforderungen, die direkte Anrede des רָשָׁע und die Unterscheidung zwischen Wohnstätte und Ruhe-/Liegeplatz sind zutreffend wiedergegeben. In der vorliegenden Form ist jedoch „der Wohnstätte ... auflauern“ als Dativkonstruktion im Deutschen semantisch und idiomatisch unglücklich: Aufgelauert wird gewöhnlich einer Person, nicht einem Gebäude. „Bei der Wohnstätte ... lauern“ gibt das hebräische Lauern gegen/bei dem Haus angemessen wieder, ohne die räumliche Nuance unnötig festzulegen.'
  naturalness: Die knappe, parallele Weisheitsmahnung klingt natürlich und würdig. „Frevler“ ist in einem weisheitlichen Register noch verständlich, wenn auch gehoben. Die Änderung zu „bei der Wohnstätte“ beseitigt die missverständliche Rektion. Die Fußnote wird sprachlich und sachlich präzisiert.
  terminology: „Wohnstätte des Gerechten“, „Frevler“ und „verwüste“ sind für נָוֶה, רָשָׁע und שָׁדַד vertretbar. „Ruheplatz“ ist möglich; die Anmerkung sollte die konkrete Grundbedeutung von רִבְצוֹ als „Liegeplatz“ korrekt benennen.
