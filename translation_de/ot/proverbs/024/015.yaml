  text: אַל תֶּאֱרֹ֣ב רָ֭שָׁע לִ/נְוֵ֣ה צַדִּ֑יק אַֽל תְּשַׁדֵּ֥ד רִבְצ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/015.yaml
  text: Do not lie in wait[a], O wicked man, against the dwelling of the righteous[b]; do not devastate his resting place.
translation:
  language: de
  text: Lauere nicht, du Frevler, bei der Wohnstätte des Gerechten; verwüste nicht seinen Ruheplatz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seinen Liegeplatz“; auch: „den Ort, an dem er sich niederlegt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: nicht
  rationale: Die Negation mit dem Imperativ gibt das hebräische Verbot knapp und direkt wieder.
- source_word: תֶּאֱרֹב
  choice: lauere … auf
  rationale: Das Verb bezeichnet feindseliges Lauern beziehungsweise das Bereiten eines Hinterhalts. Die deutsche Wendung „jemandem oder etwas auflauern“ bewahrt das Bild, ohne es unnötig militärisch festzulegen.
- source_word: רָשָׁע
  choice: du Frevler
  rationale: Die maskuline Singularform bezeichnet hier den unmittelbar angesprochenen moralisch Schuldigen. „Frevler“ ist knapp, würdig und im Weisheitskontext verständlich.
- source_word: לִנְוֵה צַדִּיק
  choice: der Wohnstätte des Gerechten
  rationale: נָוֶה bezeichnet eine Wohn- oder Zufluchtsstätte; der Dativ bei „auflauern“ gibt die feindliche Ausrichtung der Präposition ל wieder. „Des Gerechten“ wahrt den singularischen ethischen Typus.
- source_word: תְּשַׁדֵּד
  choice: verwüste
  rationale: Das Verb umfasst gewaltsames Verheeren, Ausplündern oder Zerstören. „Verwüste“ passt zum angegriffenen Wohn- und Ruheort, ohne die Bedeutung auf Diebstahl zu verengen.
- source_word: רִבְצוֹ
  choice: seinen Ruheplatz
  rationale: Das Substantiv bezeichnet den Platz, an dem man sich niederlegt oder ruht. „Ruheplatz“ erhält dieses konkrete Bild und klingt bei einer menschlichen Person natürlicher als „Lager“ oder „Unterschlupf“.
theological_decisions: []
