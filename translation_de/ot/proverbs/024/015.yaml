  - severity: low
    issue: Ungenaue Formulierung der Fußnote
    rationale: „Wörtlich auch“ ist widersprüchlich. רִבְצוֹ lässt sich knapp mit „seinen Liegeplatz“ wiedergeben; die längere Umschreibung ist eine mögliche Erläuterung, nicht zusätzlich wörtlich.
