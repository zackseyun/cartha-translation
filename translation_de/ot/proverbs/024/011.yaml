base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/011.yaml
  text: Rescue those being taken away to death[a], and those staggering to the slaughter, hold them back.
translation:
  language: de
  text: Rette die, die zum Tod weggeführt werden, und halte die zurück, die zur Schlachtung wanken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische lautet am Ende etwa: „und zur Schlachtung Wankende – wenn du zurückhältst“. Das Objekt von „zurückhältst“ ist nicht ausdrücklich genannt. Die Schlussworte sind syntaktisch schwierig und können mit Vers 12 verbunden werden; sie werden auch im Sinn von „wenn du dich zurückhältst“ oder „halte dich nicht zurück“ verstanden. Der Haupttext gibt den im Zusammenhang wahrscheinlichen Aufruf zum Eingreifen wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצֵּל
  choice: Rette
  rationale: Der Imperativ von נצל fordert zu einem dringenden Eingreifen auf. „Rette“ ist im modernen Deutschen klar, unmittelbar und bewahrt den konkreten Sinn der Befreiung aus tödlicher Gefahr.
- source_word: לְקֻחִים
  choice: die, die … weggeführt werden
  rationale: Das passive Partizip von לקח bezeichnet Menschen, die genommen oder fortgeführt werden. Die Formulierung gibt sowohl den passiven als auch den fortdauernden Vorgang wieder, ohne sie unnötig als Gefangene oder Verurteilte festzulegen.
- source_word: לַמָּוֶת
  choice: zum Tod
  rationale: Die Präposition ל bezeichnet hier Ziel oder Ausgang. „Zum Tod“ gibt die Bewegung auf den Tod hin knapp und idiomatisch wieder.
- source_word: וּמָטִים
  choice: die … wanken
  rationale: Das Partizip beschreibt ein Wanken, Schwanken oder Taumeln angesichts unmittelbar drohender Gefahr. „Wanken“ bewahrt das Bild und passt zum würdevollen Ton eines Weisheitsspruchs.
- source_word: לַהֶרֶג
  choice: zur Schlachtung
  rationale: הרג bezeichnet gewaltsames Töten. „Zur Schlachtung“ erhält die Härte und Bildhaftigkeit des hebräischen Ausdrucks.
- source_word: אִם תַּחְשׂוֹךְ
  choice: halte … zurück
  rationale: Der masoretische Wortlaut lautet formal „wenn/falls du zurückhältst“ und ist syntaktisch schwierig. Im Parallelismus liegt jedoch eine weitere Aufforderung zum Eingreifen nahe; „halte … zurück“ drückt diesen wahrscheinlichen Sinn in natürlichem Deutsch aus. Die formale Mehrdeutigkeit wird in der Fußnote offengelegt.
theological_decisions:
- issue: Syntaktische Funktion von אִם תַּחְשׂוֹךְ am Versende
  choice: 'Als parallele Aufforderung verstanden: „halte die zurück“'
  alternative: Wörtlicher „wenn du zurückhältst“ beziehungsweise „falls du dich zurückhältst“, möglicherweise mit Vers 12 zu verbinden; außerdem ist ein verbietender Sinn „halte dich nicht zurück“ erwogen worden.
  rationale: Die Schwierigkeit ist zunächst syntaktischer, nicht konfessioneller Art. Für den eigenständig gelesenen Vers vermittelt eine zweite Aufforderung den wahrscheinlichen moralischen Appell des Parallelismus am klarsten. Weil der hebräische Wortlaut diese Lösung nicht eindeutig festlegt, bleibt die Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappem, eindringlichem Weisheitston. Die parallelen Aufforderungen bleiben erhalten; unnötige rechtliche oder konfessionelle Festlegungen werden vermieden.
