  text: בְּ֭/חָכְמָה יִבָּ֣נֶה בָּ֑יִת וּ֝/בִ/תְבוּנָ֗ה יִתְכּוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/003.yaml
  text: By wisdom a house is built[b][a], and by understanding it is established.
translation:
  language: de
  text: Durch Weisheit wird ein Haus[a] gebaut, und durch Einsicht wird es gefestigt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Hausgemeinschaft“. „Haus“ kann sowohl ein Gebäude als auch im übertragenen Sinn eine Familie oder Hausgemeinschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „fest gegründet“; „zu festem Bestand gebracht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָכְמָה
  choice: Durch Weisheit
  rationale: Die Präposition ב bezeichnet hier das Mittel. „Durch Weisheit“ gibt diesen instrumentalen Sinn im Deutschen klar und natürlich wieder.
- source_word: יִבָּנֶה
  choice: wird … gebaut
  rationale: Das Nifal-Imperfekt von בנה wird als passivisches, allgemeingültiges Präsens wiedergegeben, wie es dem sprichwörtlichen Charakter des Satzes entspricht.
- source_word: בָּיִת
  choice: ein Haus
  rationale: בַּיִת bezeichnet zunächst ein Gebäude, kann aber zugleich eine Familie oder Hausgemeinschaft meinen. „Haus“ bewahrt das konkrete Bild und lässt die übertragene Bedeutung offen.
- source_word: וּבִתְבוּנָה
  choice: und durch Einsicht
  rationale: תְּבוּנָה bezeichnet verständige Einsicht beziehungsweise Unterscheidungsvermögen. „Einsicht“ bildet im Deutschen ein natürliches Begriffspaar mit „Weisheit“.
- source_word: יִתְכּוֹנָן
  choice: wird es gefestigt
  rationale: Die Form von כון beschreibt, dass etwas festen Bestand erhält oder fest gegründet wird. „Gefestigt“ bewahrt den resultativen Sinn und passt zum Parallelismus mit „gebaut“.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Der Parallelismus des Hebräischen bleibt erhalten; die mögliche konkrete und übertragene Bedeutung von „Haus“ wird nicht aufgelöst.
