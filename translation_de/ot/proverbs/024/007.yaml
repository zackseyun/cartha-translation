  yaml_path: translation/ot/proverbs/024/007.yaml
  text: Wisdom is too high for a fool[b][a]; in the gate he does not open his mouth.
translation:
  language: de
  text: Weisheit ist für einen Narren zu hoch[a]; im Tor[b] öffnet er den Mund nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weisheiten sind für einen Narren erhaben.“ Das hebräische Wort für „Weisheit“ steht hier im Plural, wahrscheinlich als abstrakte oder verstärkende Ausdrucksform.'
    reason: lexical_alternative
  - marker: b
    text: Das Stadttor war in einer israelitischen Stadt der Ort öffentlicher Beratungen, rechtlicher Entscheidungen und kommunaler Leitung.
    reason: cultural_note
lexical_decisions:
- source_word: רָאמוֹת
  choice: zu hoch
  rationale: Die Form geht auf רום („hoch sein, erhaben sein“) zurück und beschreibt die Weisheit als für den Narren unerreichbar. „Zu hoch“ bewahrt das Höhenbild und gibt die prädikative Aussage natürlich wieder.
- source_word: לֶאֱוִיל
  choice: für einen Narren
  rationale: 'Die Präposition ל bezeichnet hier die Beziehung: Für den Narren liegt die Weisheit zu hoch. „Narr“ ist die sachlich und stilistisch passende Wiedergabe von אֱוִיל im Sprüchebuch.'
- source_word: חָכְמוֹת
  choice: Weisheit
  rationale: Obwohl das hebräische Wort formal im Plural steht, kann es als abstrakter oder intensivierender Plural gebraucht sein. Der deutsche Singular gibt den wahrscheinlichen Sinn klar wieder, ohne die Formvariante zu verschweigen.
- source_word: בַּשַּׁעַר
  choice: im Tor
  rationale: Das Stadttor bezeichnet nicht nur einen Durchgang, sondern den öffentlichen Ort von Beratung, Rechtsprechung und Gemeindeleitung. „Im Tor“ bewahrt das konkrete Bild und den örtlichen Ausdruck des Hebräischen.
- source_word: לֹא יִפְתַּח פִּיהוּ
  choice: öffnet er den Mund nicht
  rationale: 'Die wörtliche deutsche Redewendung erhält die Offenheit des Hebräischen: Der Text legt nicht ausdrücklich fest, ob der Narr aus Unfähigkeit, Beschämung oder mangelndem Ansehen schweigt.'
theological_decisions: []
