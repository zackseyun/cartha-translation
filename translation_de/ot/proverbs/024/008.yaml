  text: מְחַשֵּׁ֥ב לְ/הָרֵ֑עַ ל֝֗/וֹ בַּֽעַל מְזִמּ֥וֹת יִקְרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/008.yaml
  text: Whoever plans to do evil—to him they will call, “master of schemes.”
translation:
  language: de
  text: Wer Böses zu tun plant, den nennt man einen Ränkeschmied.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְחַשֵּׁב
  choice: plant
  rationale: Das Partizip bezeichnet jemanden, der etwas überlegt, ersinnt oder plant; „plant“ ist im Deutschen natürlich und erhält den vorsätzlichen Charakter.
- source_word: לְהָרֵעַ
  choice: Böses
  rationale: Der Hifil-Infinitiv kann „Böses tun“ beziehungsweise „Schaden anrichten“ bedeuten. „Böses plant“ gibt die Verbindung knapp und idiomatisch wieder.
- source_word: בַּעַל מְזִמּוֹת
  choice: Ränkeschmied
  rationale: Wörtlich etwa „Herr/Besitzer von Plänen“. Da מְזִמּוֹת hier im negativen Kontext listige Anschläge oder Intrigen bezeichnet, vermittelt „Ränkeschmied“ die abwertende Benennung prägnant.
- source_word: יִקְרָאוּ
  choice: nennt man
  rationale: Die unbestimmte dritte Person Plural wird im modernen Deutschen idiomatisch mit dem unpersönlichen „man“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knappes, sentenzhaftes Sprichwort in modernem, würdigem Standarddeutsch. Die markierte hebräische Voranstellung „ihm/den“ wird durch „den nennt man“ natürlich abgebildet; eine direkte Rede wird nicht erzwungen, da der hebräische Text auch eine prädikative Benennung zulässt.
