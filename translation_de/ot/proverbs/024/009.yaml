  text: זִמַּ֣ת אִוֶּ֣לֶת חַטָּ֑את וְ/תוֹעֲבַ֖ת לְ/אָדָ֣ם לֵֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/009.yaml
  text: The scheme of folly is sin[b][a], and a scoffer is an abomination to mankind.
translation:
  language: de
  text: Ein Plan der Torheit ist Sünde, und ein Spötter[b] ist den Menschen[a] ein Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Menschen“ beziehungsweise „der Menschheit“; das hebräische אָדָם bezeichnet hier Menschen allgemein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Verhöhner“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִמַּת
  choice: Plan
  rationale: Das von זמם abgeleitete Substantiv bezeichnet hier etwas Erdachtes oder Beabsichtigtes. „Plan“ bewahrt den überlegten Charakter, ohne die stärkere Bedeutung „Intrige“ oder „Anschlag“ festzulegen.
- source_word: אִוֶּלֶת
  choice: Torheit
  rationale: Das abstrakte Substantiv bezeichnet törichtes Wesen oder Verhalten; „Torheit“ entspricht dem prägnanten Sprachgebrauch der Weisheitsliteratur.
- source_word: חַטָּאת
  choice: Sünde
  rationale: 'Das Substantiv steht prädikativ: Ein Plan der Torheit ist Sünde. Die substantivische Wiedergabe bildet die knappe hebräische Aussage direkt ab.'
- source_word: תוֹעֲבַת
  choice: ein Gräuel
  rationale: „Gräuel“ gibt die starke Abscheu von תוֹעֵבָה wieder und bildet zugleich die hebräische Nominalkonstruktion natürlich und würdig ab.
- source_word: לְאָדָם
  choice: den Menschen
  rationale: אָדָם wird hier generisch für Menschen beziehungsweise die Menschheit gebraucht. Der deutsche Plural macht diesen umfassenden Sinn natürlich kenntlich, ohne ihn auf Männer zu beschränken.
- source_word: לֵץ
  choice: ein Spötter
  rationale: לֵץ bezeichnet im Buch der Sprüche einen Menschen, der hochmütig spottet und Zurechtweisung ablehnt. „Spötter“ erfasst sowohl sein Reden als auch seine Haltung.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: den Menschen
  alternative: dem Menschen / der Menschheit
  rationale: Der Singular אָדָם hat hier generische Bedeutung. Der deutsche Plural ist idiomatisch und bewahrt den Bezug auf Menschen allgemein; die Fußnote nennt die näher an der Form liegenden Alternativen.
- issue: Stärke von תוֹעֵבָה
  choice: ein Gräuel
  alternative: verabscheut / abscheulich
  rationale: Die substantivische und starke Wertung des hebräischen Ausdrucks bleibt erhalten. Die Aussage wird nicht abgeschwächt oder auf eine ausdrücklich kultische Bedeutung eingeengt.
translation_notes:
  register: Moderne, würdige Standardsprache mit der für die Spruchliteratur typischen Kürze. „Ein Gräuel“ behält bewusst einen biblisch geprägten, aber weiterhin verständlichen Ausdruck bei.
