  text: אֹ֤מֵ֨ר לְ/רָשָׁע֮ צַדִּ֪יק אָ֥תָּה יִקְּבֻ֥/הוּ עַמִּ֑ים יִזְעָמ֥וּ/הוּ לְאֻמִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/024.yaml
  text: Whoever says to the wicked[a], “You are righteous,” peoples will curse him; nations will denounce him.
translation:
  language: de
  text: 'Wer zu einem Frevler[a] sagt: »Du bist gerecht!«, den werden Völker verfluchen, über den werden Nationen empört sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wer zu einem Schuldigen sagt: ›Du bist im Recht!‹ …«'
    reason: 'Lexikalische Alternative: רָשָׁע und צַדִּיק können in diesem Zusammenhang auch im rechtlichen Sinn »schuldig« und »im Recht« bezeichnen.'
lexical_decisions:
- source_word: אֹמֵר
  choice: Wer … sagt
  rationale: Das substantivisch gebrauchte maskuline Partizip bezeichnet hier allgemein jeden, der so handelt. Die deutsche Konstruktion mit »Wer« gibt diese sprichwörtliche Allgemeingültigkeit natürlich wieder.
- source_word: לְרָשָׁע
  choice: zu einem Frevler
  rationale: רָשָׁע bezeichnet einen moralisch bösen oder im Rechtssinn schuldigen Menschen. »Frevler« bewahrt vor allem den ethischen Gegensatz zu צַדִּיק, ohne den möglichen rechtlichen Bezug auszuschließen.
- source_word: צַדִּיק אָתָּה
  choice: Du bist gerecht!
  rationale: Die direkte Rede und das ausdrückliche Pronomen werden beibehalten. »Gerecht« wahrt den grundlegenden ethisch-rechtlichen Sinn von צַדִּיק und den Gegensatz zu רָשָׁע.
- source_word: יִקְּבֻהוּ
  choice: den werden … verfluchen
  rationale: נקב bezeichnet hier das Aussprechen eines Fluches. »Verfluchen« gibt die starke feindselige Reaktion klar und idiomatisch wieder.
- source_word: עַמִּים
  choice: Völker
  rationale: Der kollektive Plural wird mit »Völker« wiedergegeben und vom parallelen לְאֻמִּים lexikalisch unterschieden.
- source_word: יִזְעָמֻהוּ
  choice: über den werden … empört sein
  rationale: זעם drückt heftigen Unwillen oder zornige Verurteilung aus. »Empört sein über« bewahrt diesen Bedeutungsgehalt und vermeidet eine unbegründete Gleichsetzung mit dem vorhergehenden »verfluchen«.
- source_word: לְאֻמִּים
  choice: Nationen
  rationale: »Nationen« erhält im synonymen Parallelismus die Unterscheidung vom vorhergehenden עַמִּים, »Völker«.
theological_decisions:
- issue: Ethische oder rechtliche Bedeutung des Gegensatzes רָשָׁע / צַדִּיק
  choice: Frevler / gerecht
  alternative: Schuldiger / im Recht
  rationale: Der Haupttext wahrt die für die Weisheitsliteratur typische moralische Kategorie, während der Zusammenhang mit gerechtem Richten auch eine rechtliche Lesart zulässt. Diese wird deshalb in der Fußnote genannt und nicht stillschweigend ausgeschlossen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung mit den vorangestellten Objektformen »den« und »über den« bildet den hebräischen Nachsatz klar ab und wahrt den poetischen Parallelismus.
