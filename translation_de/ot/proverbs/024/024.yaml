  source_fidelity: Der Haupttext gibt die generische Partizipialkonstruktion, den ethischen Gegensatz רָשָׁע / צַדִּיק sowie die beiden feindseligen Reaktionen zutreffend wieder. »Frevler« und »gerecht« sind im weisheitlichen Kontext angemessen; die rechtliche Nuance wird vorsichtig als Alternative vermerkt. »Verfluchen« für יִקְּבֻהוּ und »über den ... empört sein« für יִזְעָמֻהוּ bewahren die Unterscheidung der parallelen Verben.
  naturalness: Der Satz ist klares, würdiges modernes Standarddeutsch. Die Wiederaufnahme mit »den« bzw. »über den« ist idiomatisch und bildet den Parallelismus gut ab. »Frevler« ist gehoben, aber für den biblisch-weisheitlichen Register angemessen und verständlich.
  terminology: Die Begriffe »Frevler«, »gerecht«, »Völker« und »Nationen« sind konsistent und halten sowohl den ethischen Kontrast als auch die lexikalische Variation der beiden Halbverse aufrecht. Die Fußnote darf die mögliche forensische Lesart nennen, sollte aber an dem Ausdruck verankert sein, auf den sie sich bezieht, nicht an der gesamten direkten Rede.
