source:
  edition: WLC
  text: כֵּ֤ן דְּעֶ֥/ה חָכְמָ֗ה לְ/נַ֫פְשֶׁ֥/ךָ אִם מָ֭צָאתָ וְ/יֵ֣שׁ אַחֲרִ֑ית וְ֝/תִקְוָתְ/ךָ֗ לֹ֣א תִכָּרֵֽת׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/014.yaml
  text: 'Know that wisdom is thus for your soul: if you find it[a], then there is a future[b], and your hope will not be cut off.'
translation:
  language: de
  text: 'So sollst du erkennen: Weisheit ist gut für dein Leben[a]. Wenn du sie findest, gibt es eine Zukunft[b], und deine Hoffnung wird nicht abgeschnitten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für deine Seele“; das hebräische Wort kann auch „du selbst“ oder „dein Leben“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen Ausgang“ oder „ein Ende“; das hebräische Wort kann das spätere Ende, den Ausgang oder die Zukunftsperspektive eines Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: So
  rationale: 'Das Wort nimmt den Vergleich mit dem Honig im vorigen Vers auf: Wie Honig wohltuend ist, so ist es auch die Weisheit.'
- source_word: דְּעֶה
  choice: das sollst du erkennen
  rationale: Der Imperativ richtet sich an eine einzelne Person. Die Nachstellung ergibt im Deutschen einen natürlichen, eindringlichen Satz und wahrt den Aufforderungscharakter.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist die übliche und sachlich passende Wiedergabe des Schlüsselbegriffs im Sprüchebuch.
- source_word: לְנַפְשֶׁךָ
  choice: für dein Leben
  rationale: נֶפֶשׁ kann Seele, Selbst oder Leben bezeichnen. Hier geht es um die Weisheit als Gut für die ganze Person; „Leben“ ist verständlich, ohne den Ausdruck auf einen rein innerlichen Seelenteil einzuengen.
- source_word: אִם מָצָאתָ
  choice: Wenn du sie gefunden hast
  rationale: Die Formulierung bewahrt sowohl die Bedingung als auch den perfektischen Aspekt des hebräischen Verbs.
- source_word: וְיֵשׁ אַחֲרִית
  choice: gibt es eine Zukunft
  rationale: אַחֲרִית bezeichnet das spätere Ende, den Ausgang oder die Zukunftsperspektive. Im Parallelismus mit Hoffnung ist „Zukunft“ im Deutschen am klarsten.
- source_word: וְתִקְוָתְךָ
  choice: und deine Hoffnung
  rationale: „Hoffnung“ ist die geläufige Wiedergabe und steht in enger gedanklicher Beziehung zur zugesagten Zukunft.
- source_word: לֹא תִכָּרֵת
  choice: wird nicht abgeschnitten
  rationale: Die Wiedergabe erhält das kräftige hebräische Bild des Abschneidens, statt es mit „enttäuscht“ oder „vernichtet“ erklärend aufzulösen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz bewahrt den Rückbezug auf den Honigvergleich aus Vers 13; der Gedankenstrich macht die hebräische, knapp gefügte Aussage im Deutschen gut erfassbar. Die Anrede bleibt singular und vertraut („du“).
