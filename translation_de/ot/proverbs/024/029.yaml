  text: אַל תֹּאמַ֗ר כַּ/אֲשֶׁ֣ר עָֽשָׂה לִ֭/י כֵּ֤ן אֶֽעֱשֶׂה לּ֑/וֹ אָשִׁ֖יב לָ/אִ֣ישׁ כְּ/פָעֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/029.yaml
  text: Do not say[a], “As he has done to me, so I will do to him; I will repay the man according to his deed.”
translation:
  language: de
  text: 'Sag nicht: »Wie er mir getan hat, so werde ich ihm tun; ich werde dem Mann seiner Tat entsprechend vergelten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Sag nicht
  rationale: Die Verneinung אַל mit dem Imperfekt drückt ein Verbot aus; „Sag nicht“ ist direkt und natürlich.
- source_word: כַּאֲשֶׁר עָשָׂה לִי
  choice: Wie er mir getan hat
  rationale: Die Formulierung bewahrt den Vergleich und die bewusst allgemein gehaltene Bedeutung von עשה („tun, handeln“).
- source_word: כֵּן אֶעֱשֶׂה לּוֹ
  choice: so werde auch ich ihm tun
  rationale: Die Entsprechung כַּאֲשֶׁר … כֵּן wird im Deutschen durch „wie … so“ wiedergegeben; „auch ich“ verdeutlicht idiomatisch die beabsichtigte Vergeltung in gleicher Weise.
- source_word: אָשִׁיב
  choice: ich werde … vergelten
  rationale: Der Hifil von שוב bezeichnet hier das Zurückgeben beziehungsweise Vergelten einer Tat.
- source_word: לָאִישׁ
  choice: dem Mann
  rationale: Die konkrete maskuline Einzahl אִישׁ wird formal als „dem Mann“ wiedergegeben.
- source_word: כְּפָעֳלוֹ
  choice: sein Tun
  rationale: פֹּעַל kann Werk, Tat oder Tun bezeichnen. „Sein Tun vergelten“ ist im Deutschen natürlich, wahrt die Singularform und vermeidet eine unnötige Präzisierung der Art der Tat.
theological_decisions:
- issue: Ethische Aussage über persönliche Vergeltung
  choice: Der Vers untersagt den ausgesprochenen Vorsatz, einem anderen Gleiches mit Gleichem zu vergelten.
  alternative: Ein umfassendes Verbot jeder Form vergeltender Gerechtigkeit oder lediglich eine Warnung vor unbedachtem Reden.
  rationale: Der Wortlaut richtet sich unmittelbar gegen persönliche Vergeltungsabsicht, entfaltet jedoch keine allgemeine Lehre über staatliche oder richterliche Gerechtigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur „wie … so“ und die Wiederholung von „tun“ spiegeln die knappe, zugespitzte Form des hebräischen Spruchs.
