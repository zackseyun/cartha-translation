base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/025.yaml
  text: But for those who rebuke[a], it will be pleasant[b], and a good blessing will come upon them.
translation:
  language: de
  text: Denen aber, die zurechtweisen[a], wird es Freude bereiten, und guter Segen[b] wird über sie kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „tadeln“, „rügen“ oder „korrigieren“. Das hebräische Partizip bezeichnet Menschen, die notwendige Zurechtweisung oder Korrektur geben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Segen des Guten“, also ein wohltuender oder günstiger Segen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַמּוֹכִיחִים
  choice: Denen aber, die zurechtweisen
  rationale: Das Partizip von יכח bezeichnet Menschen, die notwendige Zurechtweisung oder Korrektur üben. „Zurechtweisen“ ist im Deutschen klar und würdevoll; „aber“ gibt den Gegensatz zum vorangehenden Vers wieder.
- source_word: יִנְעָם
  choice: wird es angenehm sein
  rationale: Die unpersönliche Form von נעם bezeichnet etwas Angenehmes oder Erfreuliches. Die bewusst offene Formulierung bewahrt die Kürze und die fehlende ausdrückliche Subjektangabe des Hebräischen.
- source_word: וַעֲלֵיהֶם
  choice: und … über sie
  rationale: Die Präposition bezeichnet die Empfänger und bewahrt zusammen mit „kommen“ das räumliche Bild eines Segens, der über Menschen kommt.
- source_word: תָּבוֹא
  choice: wird … kommen
  rationale: Die einfache Zukunftsform von בוא wird direkt und natürlich wiedergegeben.
- source_word: בִרְכַּת טוֹב
  choice: guter Segen
  rationale: Die hebräische Status-constructus-Verbindung bedeutet wörtlich „Segen des Guten“. „Guter Segen“ bleibt knapp und bezeichnet einen wohltuenden, günstigen Segen, ohne seinen Inhalt näher festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Die unpersönliche und inhaltlich offene Aussage „wird es angenehm sein“ bewahrt die Mehrdeutigkeit des hebräischen Verbs, statt einen bestimmten günstigen Ausgang ausdrücklich einzutragen.
