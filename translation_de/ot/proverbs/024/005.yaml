  text: A wise man is strong[b][a], and a man of knowledge strengthens his might.
translation:
  language: de
  text: Ein weiser Mann ist stark[a], und ein Mann mit Erkenntnis stärkt seine Kraft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ein weiser, starker Mann“ oder, wörtlicher, „Ein weiser Mann ist in Stärke“. Die hebräische Formulierung ist sehr knapp und kann attributiv oder prädikativ verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „vermehrt Kraft“. Das Hebräische enthält hier kein ausdrückliches Wort für „seine“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: Mann
  rationale: Das Substantiv bezeichnet hier einen männlichen Menschen in der für Sprüche typischen repräsentativen Einzahl; die mögliche Nebenbedeutung körperlicher Stärke wird nicht zusätzlich in das Substantiv eingetragen.
- source_word: חָכָם
  choice: weise
  rationale: Im Sprüchebuch bezeichnet das Wort regelmäßig moralisch-praktische Weisheit; „weise“ ist die direkte und kontextgemäße Wiedergabe.
- source_word: בַּעֹז
  choice: ist stark
  rationale: Die knappe Verbindung aus ב und עֹז wird prädikativ verstanden. „Ist stark“ ist im Deutschen natürlich und gibt die Aussage wieder, dass Weisheit mit Stärke verbunden ist, ohne die grammatische Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: אִישׁ
  choice: Mann
  rationale: Die grammatisch männliche, sprichwörtlich gebrauchte Einzahl wird formgetreu wiedergegeben.
- source_word: דַּעַת
  choice: Erkenntnis
  rationale: In der Weisheitsliteratur umfasst דַּעַת nicht nur angesammeltes Wissen, sondern einsichtsvolles Erkennen. „Erkenntnis“ bewahrt diesen Sinn und ist in gehobenem, modernem Bibeldeutsch verständlich.
- source_word: מְאַמֶּץ
  choice: vermehrt
  rationale: Die Piel-Form bezeichnet ein Starkmachen beziehungsweise Zunehmenlassen. Mit „vermehrt“ ergibt sich zusammen mit כֹּחַ eine natürliche deutsche Aussage; die stärker kausative Wiedergabe wird als Alternative genannt.
- source_word: כֹּחַ
  choice: seine Kraft
  rationale: כֹּחַ bezeichnet Kraft oder Leistungsvermögen. Das Possessivpronomen ist im Hebräischen nicht ausdrücklich vorhanden, wird im Deutschen jedoch aus dem generischen Einzelsubjekt natürlich ergänzt; die Fußnote hält die formalere Alternative offen.
