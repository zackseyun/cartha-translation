source:
  edition: WLC
  text: אַל תְּ֭קַנֵּא בְּ/אַנְשֵׁ֣י רָעָ֑ה וְ/אַל תתאו לִ/הְי֥וֹת אִתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/001.yaml
  text: Do not envy evil men[b][a], and do not desire to be with them.
translation:
  language: de
  text: Sei nicht neidisch auf böse Männer[a], und wünsche dir nicht, bei ihnen zu sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Männer des Bösen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und sehne dich nicht danach, mit ihnen zusammen zu sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Sei nicht neidisch
  rationale: Die Negation אַל mit der Verbform drückt ein Verbot aus. קנא bezeichnet hier neidisches Begehren; die natürliche deutsche Wendung lautet „neidisch sein auf“.
- source_word: בְּאַנְשֵׁי רָעָה
  choice: auf böse Männer
  rationale: אַנְשֵׁי ist ein ausdrücklich maskuliner Plural im Status constructus („Männer von“), und רָעָה kennzeichnet sie durch das Böse. „Böse Männer“ ist idiomatisch und wahrt die grammatische Geschlechtsangabe.
- source_word: וְאַל תתאו
  choice: und wünsche dir nicht
  rationale: Die zweite mit אַל gebildete Mahnung steht parallel zur ersten. אוה bezeichnet ein Verlangen oder einen Wunsch; „wünsche dir nicht“ klingt im heutigen Deutsch natürlich, ohne die Intensität zu überzeichnen.
- source_word: לִהְיוֹת אִתָּם
  choice: bei ihnen zu sein
  rationale: Der Infinitiv von היה mit אִתָּם bezeichnet wörtlich das Sein mit ihnen und kann Gemeinschaft bzw. Zugehörigkeit einschließen. „Bei ihnen zu sein“ bewahrt die offene Formulierung.
theological_decisions:
- issue: Reichweite des gewünschten Zusammenseins
  choice: bei ihnen zu sein
  alternative: zu ihrer Gemeinschaft zu gehören
  rationale: Der hebräische Ausdruck kann bloße Nähe, Umgang oder engere Gemeinschaft meinen. Die Übersetzung legt den Grad der Verbindung nicht unnötig fest.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die parallelen Verbote und die ausdrücklich maskuline Form des Hebräischen bleiben erhalten; die mögliche Spannweite von bloßer Nähe bis zur Gemeinschaft wird nicht verengt.
