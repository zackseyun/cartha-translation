  text: יְרָֽא אֶת יְהוָ֣ה בְּנִ֣/י וָ/מֶ֑לֶךְ עִם שׁ֝וֹנִ֗ים אַל תִּתְעָרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/021.yaml
  text: Fear Yahweh[a], my son, and the king; do not associate with those who are given to change.
translation:
  language: de
  text: Fürchte Jahwe, mein Sohn, und den König; mit denen, die nach Veränderung streben, lass dich nicht ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit denen, die verändern“. Gemeint können Menschen sein, die zu Umbruch oder illoyaler Veränderung neigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרָא
  choice: Fürchte
  rationale: Der Imperativ bezeichnet in der Weisheitsliteratur ehrfürchtige Furcht, die sich in treuem Gehorsam zeigt. „Fürchte“ bewahrt diese Spannung besser als das abgeschwächte „Ehre“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die ausdrücklich maskuline Singularanrede ist ein kennzeichnendes literarisches Merkmal des Sprüchebuchs.
- source_word: וָמֶלֶךְ
  choice: und den König
  rationale: Die Konjunktion verbindet „den König“ als zweites Objekt mit demselben Imperativ; der bestimmte Ausdruck ist im weisheitlich-politischen Zusammenhang natürlich.
- source_word: שׁוֹנִים
  choice: die auf Umsturz aus sind
  rationale: Das Partizip bezeichnet wörtlich Menschen, die verändern beziehungsweise Wandel betreiben. Im Zusammenhang mit Jahwe und dem König liegt aufrührerischer oder illoyaler Wandel nahe; „auf Umsturz aus“ gibt dies in verständlichem Deutsch wieder, ohne sie ausdrücklich als vollendete Rebellen zu bezeichnen.
- source_word: אַל תִּתְעָרָב
  choice: lass dich nicht mit … ein
  rationale: Der Hitpael von ערב bezeichnet hier, dass man sich unter solche Menschen mischt oder sich mit ihnen abgibt. Die gewählte Wendung ist idiomatisch und warnt vor persönlicher Verstrickung.
theological_decisions:
- issue: Verhältnis der Furcht Jahwes zur Furcht vor dem König
  choice: Beide Objekte stehen unter dem einen Imperativ „Fürchte“, ohne dass damit gleicher Rang ausgesagt wird.
  alternative: Die Aussage dynamisch als „Ehre Jahwe und den König“ wiederzugeben oder die Furcht vor dem König ausdrücklich auf politischen Respekt zu beschränken.
  rationale: Die hebräische Syntax nennt Jahwe und den König als Objekte desselben Verbs. Die Übersetzung bewahrt diese Spannung und fügt keine im Vers unausgesprochene Rangordnung oder Abschwächung ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die väterliche Anrede bleibt erhalten; die politische Warnung wird idiomatisch formuliert, während die lexikalische Mehrdeutigkeit in der Fußnote sichtbar bleibt.
