  yaml_path: translation/ot/proverbs/024/033.yaml
  text: A little sleep[a], a little slumber, a little folding of the hands to lie down—
translation:
  language: de
  text: Ein wenig schlafen, ein wenig schlummern, ein wenig die Hände falten, um sich hinzulegen[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um zu ruhen“. Der hebräische Infinitiv bezeichnet allgemein das Sichhinlegen; Ruhe oder Schlaf können als Folge mitgemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט
  choice: ein wenig
  rationale: Die dreifache Wiederholung wahrt den gemessenen, schrittweisen Sinn und den rhetorischen Parallelismus.
- source_word: שֵׁנוֹת
  choice: schlafen
  rationale: Der hebräische Plural bezeichnet hier Schlafhandlungen; der deutsche Infinitiv klingt natürlich und passt parallel zu „schlummern“.
- source_word: תְּנוּמוֹת
  choice: schlummern
  rationale: Das Wort bewahrt die poetische Nähe zu „schlafen“ und gibt das leichte Dösen in würdigem, sprichwörtlichem Deutsch wieder.
- source_word: חִבֻּק יָדַיִם
  choice: die Hände falten
  rationale: Die Wendung bezeichnet Untätigkeit; diese Formulierung bleibt bildnah und ist im Deutschen verständlich.
- source_word: לִשְׁכָּב
  choice: um dazuliegen
  rationale: Der Infinitiv bezeichnet das Liegen allgemein, ohne es unnötig auf Schlaf festzulegen; „um“ gibt den Zweck beziehungsweise die Folge der Handlung wieder.
