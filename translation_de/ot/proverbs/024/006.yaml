id: PRO.24.6
reference: Proverbs 24:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י בְ֭/תַחְבֻּלוֹת תַּעֲשֶׂה לְּ/ךָ֣ מִלְחָמָ֑ה וּ֝/תְשׁוּעָ֗ה בְּ/רֹ֣ב יוֹעֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/006.yaml
  text: For by wise guidance you will wage war[b][a], and victory is in an abundance of counselors.
translation:
  language: de
  text: Denn mit kluger Planung[a] führst du Krieg, und bei vielen Ratgebern findet sich der Sieg[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit kluger Strategie“ oder „mit weisem Rat“. Das hebräische Wort bezeichnet kundige Führung oder taktische Planung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Rettung“. Im Zusammenhang mit Krieg bezeichnet das hebräische Wort hier genauer den Sieg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Mahnung und verbindet den Vers natürlich mit seinem Kontext.
- source_word: בְתַחְבֻּלוֹת
  choice: mit kluger Planung
  rationale: Das Wort bezeichnet kundige Lenkung, taktische Überlegung oder strategische Beratung. Die Wiedergabe bewahrt den instrumentalen Sinn der Präposition und klingt im Deutschen natürlich.
- source_word: תַּעֲשֶׂה לְּךָ מִלְחָמָה
  choice: führst du Krieg
  rationale: Die Verbindung עשה מלחמה ist eine feste Wendung für das Führen eines Krieges. Das לְךָ gehört idiomatisch zur Aussage, ohne dass im Deutschen ein betontes „für dich selbst“ nötig wäre.
- source_word: וּתְשׁוּעָה
  choice: und … der Sieg
  rationale: תְּשׁוּעָה kann Rettung oder Befreiung bedeuten; im unmittelbaren Kriegskontext bezeichnet „Sieg“ den erfolgreichen Ausgang am präzisesten.
- source_word: בְּרֹב
  choice: bei vielen
  rationale: Die Formulierung bezeichnet den Bereich beziehungsweise das Mittel, in oder durch das der Sieg zu finden ist, und bewahrt zugleich den Gedanken der Vielzahl.
- source_word: יוֹעֵץ
  choice: Ratgebern
  rationale: Obwohl die Form morphologisch singularisch ist, hat רֹב יוֹעֵץ kollektiven Sinn und meint eine Vielzahl beratender Personen.
