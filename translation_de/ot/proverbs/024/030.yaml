  terminology: „faulen Mannes“ gibt אִישׁ עָצֵל vollständig wieder und bewahrt den männlichen Einzelbezug. „ohne Verstand“ ist eine natürliche, knappe Entsprechung für חֲסַר־לֵב; die Fußnote erläutert angemessen, dass „Herz“ hier Einsicht und Urteilsvermögen einschließt.
