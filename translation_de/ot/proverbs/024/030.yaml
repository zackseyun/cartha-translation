  text: עַל שְׂדֵ֣ה אִישׁ עָצֵ֣ל עָבַ֑רְתִּי וְ/עַל כֶּ֝֗רֶם אָדָ֥ם חֲסַר לֵֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/030.yaml
  text: I passed by the field of a sluggard[a], and by the vineyard of a man lacking sense.
translation:
  language: de
  text: Ich ging an dem Feld eines faulen Mannes vorbei, an dem Weinberg eines Mannes ohne Verstand[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eines Mannes, dem Herz fehlt“. Im Hebräischen bezeichnet „Herz“ auch Einsicht und Urteilsvermögen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל ... עָבַרְתִּי
  choice: Ich ging an ... vorüber
  rationale: In Verbindung mit dem Verb עבר bezeichnet עַל hier das Vorübergehen an einem Ort. Die deutsche Wendung gibt die Bewegung idiomatisch wieder.
- source_word: שְׂדֵה אִישׁ עָצֵל
  choice: am Feld eines Faulen
  rationale: שׂדה bezeichnet hier ein bewirtschaftetes Feld. עָצֵל ist die für das Sprüchebuch typische moralische Charakterisierung eines faulen Menschen; „eines Faulen“ ist knapp und natürlich.
- source_word: כֶּרֶם
  choice: Weinberg
  rationale: „Weinberg“ ist die übliche und kontextgerechte Entsprechung für einen mit Weinstöcken bepflanzten, bewirtschafteten Ort.
- source_word: אָדָם
  choice: eines Mannes
  rationale: Das maskuline אָדָם bezeichnet hier parallel zu אִישׁ einen einzelnen Mann; die geschlechtliche Form des Ausgangstextes bleibt erhalten.
- source_word: חֲסַר לֵב
  choice: dem es an Verstand fehlte
  rationale: Die hebräische Wendung bedeutet wörtlich, dass jemandem „Herz“ fehlt. Da לֵב im Sprüchebuch häufig das innere Vermögen zu Einsicht und Urteil bezeichnet, vermittelt „Verstand“ den idiomatischen Sinn, während die Fußnote das Bild des Ausgangstextes bewahrt.
theological_decisions:
- issue: Anthropologische Bedeutung von לֵב
  choice: Verstand
  alternative: Herz
  rationale: „Herz“ bezeichnet hier nicht bloß Gefühl oder Innerlichkeit, sondern das Vermögen zu Einsicht und vernünftigem Urteil. Die Übersetzung wahrt diese weisheitliche Bedeutung, ohne die wörtliche Ausdrucksweise zu verschweigen.
- issue: Geschlechtliche Bezeichnung in אָדָם
  choice: Mann
  alternative: Mensch / jemand
  rationale: Im Parallelismus zu אִישׁ steht eine grammatisch maskuline Einzelperson im Blick. „Mann“ gibt diese Form präzise wieder, ohne eine weitergehende theologische Aussage über Männer oder Frauen einzutragen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die parallele Satzstruktur des hebräischen Verses bleibt erhalten; „eines Faulen“ bewahrt den zugespitzten Weisheitston, ohne altertümlich zu wirken.
