  source_fidelity: 'Der Sinn des Hebräischen wird im Entwurf insgesamt zutreffend wiedergegeben: Der Sprecher geht an Feld und Weinberg zweier als unverständig bzw. faul charakterisierter Männer vorbei. Die Wiedergabe von חֲסַר־לֵב durch „dem es an Verstand fehlte“ ist semantisch vertretbar, und die Fußnote hält die wörtliche Bildsprache fest.'
