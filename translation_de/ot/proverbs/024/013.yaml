  text: אֱכָל בְּנִ֣/י דְבַ֣שׁ כִּי ט֑וֹב וְ/נֹ֥פֶת מָ֝ת֗וֹק עַל חִכֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/013.yaml
  text: Eat honey[a], my son, for it is good[b], and honey from the comb is sweet to your taste.
translation:
  language: de
  text: Iss Honig, mein Sohn, denn er ist gut, und Wabenhonig ist deinem Gaumen süß.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱכָל
  choice: Iss
  rationale: Der Qal-Imperativ im maskulinen Singular wird als direkte Aufforderung wiedergegeben.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die Anrede bewahrt die maskuline Singularform und den persönlichen Lehrton der Weisheitsliteratur.
- source_word: דְבַשׁ
  choice: Honig
  rationale: Direkte und natürliche Wiedergabe des gewöhnlichen hebräischen Wortes für Honig.
- source_word: כִּי טוֹב
  choice: denn er ist gut
  rationale: כִּי begründet die Aufforderung; טוֹב bezeichnet hier allgemein das Gute und sollte nicht auf bloße Annehmlichkeit verengt werden.
- source_word: וְנֹפֶת
  choice: und Wabenhonig
  rationale: נֹפֶת kann aus der Wabe fließenden beziehungsweise in der Wabe befindlichen Honig bezeichnen. „Wabenhonig“ wahrt das Bild und unterscheidet ihn knapp vom allgemeinen דְבַשׁ.
- source_word: מָתוֹק
  choice: ist süß
  rationale: Das Adjektiv bezeichnet in diesem Geschmackskontext unmittelbar die Süße.
- source_word: עַל חִכֶּךָ
  choice: deinem Gaumen
  rationale: חֵךְ bedeutet wörtlich „Gaumen“. Die deutsche Fügung „dem Gaumen süß“ ist verständlich, würdevoll und hält sich eng an das Bild des Ausgangstextes.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller Weisheitssprache. Die Satzstruktur und die sinnliche Bildlichkeit des Hebräischen bleiben erhalten; „Wabenhonig“ gibt נֹפֶת natürlich wieder, ohne dessen genaue Beschaffenheit unnötig festzulegen.
