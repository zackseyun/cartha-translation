source:
  edition: WLC
  text: כִּֽי תֹאמַ֗ר הֵן֮ לֹא יָדַ֪עְנ֫וּ זֶ֥ה הֲֽ/לֹא תֹ֘כֵ֤ן לִבּ֨וֹת הֽוּא יָבִ֗ין וְ/נֹצֵ֣ר נַ֭פְשְׁ/ךָ ה֣וּא יֵדָ֑ע וְ/הֵשִׁ֖יב לְ/אָדָ֣ם כְּ/פָעֳלֽ/וֹ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/012.yaml
  text: If you say[a], “Look, we did not know this,” does not he who weighs hearts understand, and he who keeps your soul know[e][d][c][b], and will he not repay a man according to his work?
translation:
  language: de
  text: 'Wenn du sagst: »Sieh, wir wussten nichts davon«[a] – wird der, der die Herzen wägt[b], es nicht erkennen? Wird der, der über dein Leben wacht[c], es nicht wissen? Wird er nicht einem Menschen[d] nach seinem Tun[e] vergelten?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wir wussten davon nichts.«'
    reason: lexical_alternative
  - marker: b
    text: Das Bild vom Wägen der Herzen bezeichnet Gottes Prüfung der inneren Beweggründe.
    reason: cultural_note
  - marker: c
    text: 'Wörtlicher: »Der deine Seele bewahrt«. Das hebräische Wort kann »Seele«, »Leben« oder die eigene Person bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: 'Hebräisch: »einem Menschen«; hier allgemein auf Menschen bezogen.'
    reason: lexical_alternative
  - marker: e
    text: 'Oder: »entsprechend dem, was er getan hat«; „Tun“ kann sowohl Handeln als auch dessen Werk oder Ergebnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֹאמַר
  choice: Wenn du sagst
  rationale: כִּי leitet hier mit dem Imperfekt eine hypothetische Einrede ein; die deutsche Konditionalform gibt dies natürlich wieder.
- source_word: הֵן
  choice: Sieh
  rationale: Die Interjektion lenkt die Aufmerksamkeit auf die vorgebrachte Entschuldigung; „Sieh“ bewahrt ihre deiktische Kraft in würdigem, verständlichem Deutsch.
- source_word: לֹא יָדַעְנוּ זֶה
  choice: wir wussten nichts davon
  rationale: Die Formulierung bewahrt die erste Person Plural und gibt זֶה im Deutschen idiomatisch als Bezug auf den betreffenden Sachverhalt wieder.
- source_word: תֹכֵן לִבּוֹת
  choice: der, der die Herzen wägt
  rationale: תכן bezeichnet das Wägen oder Bemessen und bildet hier ein Bild für Gottes Prüfung der inneren Beweggründe; das Bild wird nicht auf „prüfen“ reduziert.
- source_word: יָבִין
  choice: es erkennen
  rationale: בין bezeichnet verstehendes Wahrnehmen oder Unterscheiden. „Erkennen“ passt zur rhetorischen Frage und bezieht sich natürlich auf die behauptete Unwissenheit.
- source_word: וְנֹצֵר נַפְשְׁךָ
  choice: Der über dein Leben wacht
  rationale: נצר bedeutet bewahren oder bewachen; נֶפֶשׁ kann hier das Leben beziehungsweise die Person bezeichnen. Die Wendung ist im Deutschen natürlich und vermeidet, „Seele“ vorschnell als technischen anthropologischen Begriff festzulegen.
- source_word: יֵדָע
  choice: weiß es doch
  rationale: ידע wird direkt mit „wissen“ wiedergegeben; „doch“ bringt die von הֲלֹא getragene, eine Zustimmung erwartende rhetorische Kraft zum Ausdruck.
- source_word: וְהֵשִׁיב לְאָדָם כְּפָעֳלוֹ
  choice: und er wird jedem Menschen vergelten nach seinem Tun
  rationale: Die Hifil-Form von שׁוב bezeichnet hier das Zurückgeben beziehungsweise Vergelten. אָדָם ist generisch, und כְּפָעֳלוֹ bezeichnet das jeweilige Handeln oder Werk.
theological_decisions:
- issue: Bedeutungsumfang von נֶפֶשׁ
  choice: dein Leben
  alternative: deine Seele; dich selbst
  rationale: נֶפֶשׁ umfasst Leben, Person und Selbst. In Verbindung mit נצר ist „über dein Leben wacht“ kontextuell klar, ohne eine spätere Trennung von Körper und immaterieller Seele in den Text einzutragen; die wörtlichere Alternative wird in der Fußnote bewahrt.
- issue: Gottes Erkenntnis der inneren Beweggründe
  choice: die Herzen wägt … erkennen
  alternative: die Herzen prüft … verstehen
  rationale: Die Übersetzung bewahrt sowohl das konkrete Bild des Wägens als auch die Aussage, dass die behauptete Unwissenheit Gottes Prüfung nicht entgeht.
- issue: Generisches אָדָם
  choice: jedem Menschen
  alternative: einem Menschen; dem Menschen
  rationale: אָדָם bezeichnet hier den Menschen allgemein. „Jedem Menschen“ macht den distributiven Sinn der Vergeltung verständlich, ohne die Aussage auf Männer zu beschränken.
- issue: Art der göttlichen Antwort
  choice: vergelten nach seinem Tun
  alternative: zurückgeben nach seinem Werk
  rationale: Die Wendung beschreibt eine dem Handeln entsprechende göttliche Antwort. „Vergelten“ bewahrt die forensisch-moralische Spannung, ohne festzulegen, ob die Vergeltung ausschließlich Strafe oder auch Lohn ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild „die Herzen wägt“ bleibt erhalten, während idiomatische Satzführung die rhetorische Frage klar macht. „Leben“ für נֶפֶשׁ wird durch eine Fußnote gegen anthropologische Verengung abgesichert; „Mensch“ gibt das generische אָדָם im heutigen Deutsch wieder.
