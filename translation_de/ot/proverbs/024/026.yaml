  text: שְׂפָתַ֥יִם יִשָּׁ֑ק מֵ֝שִׁ֗יב דְּבָרִ֥ים נְכֹחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/026.yaml
  text: He kisses the lips who gives upright words[a][b].
translation:
  language: de
  text: Wer aufrichtige Worte zur Antwort gibt, küsst die Lippen[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine aufrichtige Antwort ist wie ein Kuss auf die Lippen.“ Das hebräische Verb steht aktiv („küsst“); möglicherweise vergleicht das Sprichwort jedoch sinngemäß eine passende Antwort mit der Nähe oder Aufrichtigkeit eines Kusses.'
    reason: alternative_reading
  - marker: b
    text: „Aufrichtige Worte“ können auch mit „richtige Worte“, „offene Worte“ oder „ehrliche Worte“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂפָתַיִם
  choice: die Lippen
  rationale: Der Dual von שָׂפָה bezeichnet konkret die Lippen. Das Bild des Kusses bleibt erhalten, ohne das nicht genannte Gegenüber zu ergänzen.
- source_word: יִשָּׁק
  choice: küsst
  rationale: Das Qal-Imperfekt 3. Person Singular von נשׁק ist grammatisch aktiv. Im sprichwörtlichen Zusammenhang gibt das deutsche Präsens die allgemeine Aussage natürlich wieder.
- source_word: מֵשִׁיב
  choice: erwidert
  rationale: Das Hifil-Partizip von שוב bezeichnet hier das Antworten oder Entgegnen. „Erwidert“ bewahrt den responsiven Sinn und lässt sich unmittelbar mit „Worte“ verbinden.
- source_word: דְּבָרִים
  choice: Worte
  rationale: Der hebräische Plural wird beibehalten und nicht zur Einzahl „Antwort“ zusammengezogen.
- source_word: נְכֹחִים
  choice: aufrichtige
  rationale: Das Adjektiv bezeichnet gerade, richtige oder angemessene Worte. „Aufrichtig“ verbindet die moralische und die kommunikative Nuance, ohne sie ausschließlich auf sachliche Richtigkeit einzuengen.
theological_decisions: []
translation_notes:
  register: Knappes, bildhaftes Sprichwort in modernem Standarddeutsch. Die aktive Verbform und der konkrete Plural „Lippen“ bleiben erhalten; die ungewöhnliche Bildlogik wird nicht stillschweigend aufgelöst.
