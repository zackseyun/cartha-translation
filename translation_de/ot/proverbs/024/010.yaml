  text: הִ֭תְרַפִּיתָ בְּ/י֥וֹם צָרָ֗ה צַ֣ר כֹּחֶֽ/כָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/010.yaml
  text: If you falter in a day of distress[a], your strength is small.
translation:
  language: de
  text: Wenn du am Tag der Not nachlässt[a], ist deine Kraft gering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Wenn du dich am Tag der Bedrängnis schwach zeigst, ist deine Kraft begrenzt.“'
    reason: Lexikalische Alternative; רפה kann Nachlassen, Erschlaffen oder Sich-schwach-Zeigen ausdrücken, während צַר neben „gering“ auch „begrenzt“ bedeuten kann.
lexical_decisions:
- source_word: הִתְרַפִּיתָ
  choice: du … nachlässt
  rationale: Das Hitpael-Perfekt von רפה bezeichnet ein Erschlaffen, Nachlassen oder Sich-schwach-Zeigen. Im zeitlich-bedingten Spruchzusammenhang gibt das deutsche Präsens mit „wenn“ den Sinn natürlich wieder. „Nachlassen“ bewahrt sowohl den Gedanken schwindender Entschlossenheit als auch den der Schwäche, ohne ihn auf bloße Mutlosigkeit einzuengen.
- source_word: בְּיוֹם
  choice: am Tag der
  rationale: ב mit יוֹם ist temporal gebraucht. „Am Tag der Not“ entspricht knapp und idiomatisch der sprichwörtlichen Form des Hebräischen.
- source_word: צָרָה
  choice: Not
  rationale: צָרָה bezeichnet Bedrängnis, Not oder schweres Unglück. „Not“ ist im Deutschen prägnant, verständlich und für die verdichtete Sprache eines Spruchs geeignet.
- source_word: צַר
  choice: gering
  rationale: צַר bedeutet wörtlich „eng“ und bezeichnet hier eine begrenzte beziehungsweise unzureichende Kraft. „Gering“ ist mit „Kraft“ natürlich und erhält die knappe Bewertung, auch wenn das hebräische Wortspiel mit צָרָה nicht vollständig nachgebildet werden kann.
- source_word: כֹּחֶךָ
  choice: deine Kraft
  rationale: כֹּחַ bezeichnet Kraft, Stärke oder Leistungsvermögen. „Deine Kraft“ ist die direkteste und im Deutschen idiomatische Entsprechung.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Spruchform in modernem Standarddeutsch. Die konditionale Beziehung wird mit „wenn“ ausdrücklich gemacht. Die Wiederholung „Not … gering“ kann das hebräische Klangspiel zwischen צָרָה und צַר nicht vollständig wiedergeben, ohne unnatürliches Deutsch zu erzeugen.
