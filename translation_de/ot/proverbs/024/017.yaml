  text: בִּ/נְפֹ֣ל אויבי/ך אַל תִּשְׂמָ֑ח וּ֝/בִ/כָּשְׁל֗/וֹ אַל יָגֵ֥ל לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/017.yaml
  text: Do not rejoice when your enemy falls[a], and do not let your heart exult when he stumbles,
translation:
  language: de
  text: Freue dich nicht, wenn dein Feind fällt, und dein Herz soll nicht jubeln, wenn er strauchelt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְפֹל
  choice: wenn … fällt
  rationale: ב mit dem Infinitiv von נפל ist hier temporal gebraucht. „Wenn … fällt“ gibt die Konstruktion natürlich und nah am Hebräischen wieder.
- source_word: אֹיְבֶיךָ
  choice: dein Feind
  rationale: Obwohl die Form äußerlich mehrdeutig wirken kann, weist das singularische Suffix in כָּשְׁלוֹ („wenn er strauchelt“) auf einen einzelnen beziehungsweise kollektiv gedachten Feind.
- source_word: אַל תִּשְׂמָח
  choice: Freue dich nicht
  rationale: אַל mit dem Imperfekt drückt ein Verbot aus. „Freue dich nicht“ ist im Deutschen idiomatisch und bewahrt den Sinn von שמח.
- source_word: וּבִכָּשְׁלוֹ
  choice: wenn er strauchelt
  rationale: Die Konstruktion ist erneut temporal. „Strauchelt“ wahrt den Unterschied zu נפל („fällt“) und kann sowohl konkretes als auch übertragenes Scheitern bezeichnen.
- source_word: אַל יָגֵל
  choice: soll nicht jubeln
  rationale: גיל bezeichnet häufig lebhafte, überschwängliche Freude. „Jubeln“ erhält die Steigerung gegenüber שמח, während die Formulierung mit „soll nicht“ im Deutschen den parallel gesetzten hebräischen Verbotssatz natürlich wiedergibt.
- source_word: לִבֶּךָ
  choice: dein Herz
  rationale: לב bezeichnet hier das innere Denken und Empfinden. „Dein Herz“ bewahrt das vertraute hebräische Menschenbild und ist im Deutschen gut verständlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer poetischer Parallelität. Die unterschiedlichen Verben für Freude (שמח/Gיל) und für Scheitern (נפל/כשל) werden durch „sich freuen/jubeln“ sowie „fallen/straucheln“ erkennbar gehalten.
