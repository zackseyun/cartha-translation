  naturalness: „Freue dich nicht, wenn dein Feind fällt, und dein Herz soll nicht jubeln, wenn er strauchelt“ ist klares, modernes Standarddeutsch. Die Stellung des zweiten Temporalsatzes ist idiomatisch und beeinträchtigt die poetische Parallelität nicht.
  terminology: „Feind“, „Herz“, „fallen“ und „straucheln“ sind registergerecht und semantisch tragfähig. „Jubeln“ gibt die gesteigerte Freude von גיל gut wieder, ohne eine übermäßige theologische oder interpretative Festlegung.
