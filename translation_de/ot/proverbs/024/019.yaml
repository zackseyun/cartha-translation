review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt beide prohibitivischen Halbverse präzise wieder. „Rege dich nicht über … auf“ trifft das Hitpael von חרה als emotionales Sich-Erhitzen bzw. Sich-Aufregen, ohne es auf bloßen Zorn zu verengen. „beneide“ entspricht קנא mit ב im weisheitlichen Kontext. Die kausale bzw. gegenstandsbezogene Funktion von ב ist mit „über“ idiomatisch erfasst.
  naturalness: „Rege dich nicht über Übeltäter auf; beneide die Frevler nicht“ ist klares, modernes Standarddeutsch und bewahrt die knappe Parallelität eines Spruchworts. „Übeltäter“ und „Frevler“ sind leicht gehoben, aber verständlich und für den Weisheitsstil angemessen.
  terminology: „Übeltäter“ gibt מְרֵעִים und „Frevler“ רְשָׁעִים als unterschiedliche, semantisch eng benachbarte Personenbezeichnungen angemessen wieder. Die Variation ist im Deutschen natürlich und überträgt die Variation des Hebräischen. Die Fußnote bietet mit „Ereifere dich nicht“ eine vertretbare, stärker zornbetonte lexikalische Alternative.
