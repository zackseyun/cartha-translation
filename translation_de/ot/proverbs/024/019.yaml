  text: אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בָּ/רְשָׁעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/019.yaml
  text: Do not be agitated because of evildoers[a]; do not envy the wicked.
translation:
  language: de
  text: Rege dich nicht über Übeltäter auf[a]; beneide die Frevler nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Ereifere dich nicht über Übeltäter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְחַר
  choice: rege dich … auf
  rationale: Das Hitpael von חרה bezeichnet hier ein inneres Erhitzt- oder Aufgebrachtwerden. Die Wendung ist im heutigen Deutsch natürlich und lässt offen, ob Ärger, Unruhe oder Entrüstung im Vordergrund steht.
- source_word: בַּמְּרֵעִים
  choice: über Übeltäter
  rationale: ב bezeichnet bei diesem Verb den Anlass beziehungsweise den Gegenstand der Erregung. מְרֵעִים ist eine substantivisch gebrauchte Partizipialform und meint Menschen, die Böses tun.
- source_word: תְּקַנֵּא
  choice: beneide
  rationale: קנא mit ב bezeichnet in diesem weisheitlichen Zusammenhang das neidische Begehren angesichts anderer Menschen und ihres Ergehens.
- source_word: בָּרְשָׁעִים
  choice: die Frevler
  rationale: רְשָׁעִים ist eine typische weisheitliche Bezeichnung für Menschen, deren Handeln moralisch verwerflich ist. „Frevler“ wahrt den knappen, würdevollen Spruchstil, ohne den Begriff auf bloße Gesetzesverstöße einzuengen.
- source_word: אַל
  choice: nicht
  rationale: אַל mit der folgenden Verbform drückt in beiden Halbversen ein Verbot aus; im Deutschen wird es natürlich durch den verneinten Imperativ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knappes, paralleles Spruchwort in modernem Standarddeutsch. „Rege dich … auf“ ist gegenwärtig und gut verständlich; „Übeltäter“ und „Frevler“ bewahren zugleich den würdevollen weisheitlichen Ton.
