lexical_decisions:
- source_word: וּבָא
  choice: Dann wird … kommen
  rationale: Das Qal-Perfekt mit vorangestelltem ו führt die Folge aus dem vorhergehenden Vers weiter. Im deutschen Spruchzusammenhang gibt das Futur die Warnung natürlich wieder; „Dann“ macht den Folgezusammenhang deutlich.
- source_word: מִתְהַלֵּךְ
  choice: wie einer, der umherstreift
  rationale: Das Hitpael-Partizip von הלך bezeichnet ein Umhergehen. Die vergleichsartige, personifizierende Wiedergabe bewahrt das bedrohliche Bild, ohne eine bestimmte Identität wie Räuber oder Landstreicher festzulegen.
- source_word: רֵישֶׁךָ
  choice: deine Armut
  rationale: רֵישׁ bezeichnet Armut beziehungsweise Mittellosigkeit. „Armut“ ist die klare und geläufige deutsche Entsprechung.
- source_word: וּמַחְסֹרֶיךָ
  choice: und dein Mangel
  rationale: מַחְסוֹר bezeichnet das, was fehlt, beziehungsweise Bedürftigkeit. Das deutsche Kollektivsingular „Mangel“ bildet die Parallelität zu „Armut“ natürlich ab.
- source_word: כְּאִישׁ מָגֵן
  choice: wie ein Mann mit einem Schild
  rationale: Die Wiedergabe folgt der konkreten Bildsprache von אִישׁ und מָגֵן. Weil die Wendung auch allgemeiner einen bewaffneten Mann bezeichnen kann, wird diese Möglichkeit in der Fußnote genannt.
