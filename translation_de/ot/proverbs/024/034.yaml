  text: and your poverty will come like a prowler[a], and your need like an armed man.
translation:
  language: de
  text: Dann wird deine Armut kommen wie einer, der umherstreift, und dein Mangel wie ein Mann mit einem Schild.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wie ein Bewaffneter.'
