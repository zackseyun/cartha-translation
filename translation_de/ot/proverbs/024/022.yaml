  text: For their disaster will rise suddenly[b][a], and who knows the ruin of them both?
translation:
  language: de
  text: Denn plötzlich[a] erhebt sich ihr Unheil, und wer kennt das Verderben der beiden?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr Unheil bricht plötzlich herein“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „den beiden“ sind wahrscheinlich der HERR und der König aus dem vorangehenden Vers gemeint. Der hebräische Ausdruck kann jedoch auch allgemeiner oder auf andere im Zusammenhang vorausgesetzte Beteiligte bezogen werden.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die Warnung des vorangehenden Verses; „Denn“ gibt diese kausale Funktion im Deutschen natürlich wieder.
- source_word: פִתְאֹם
  choice: plötzlich
  rationale: Das Adverb bezeichnet das unvermittelte Eintreten des Unheils und bewahrt den eindringlichen Warnton.
- source_word: יָקוּם
  choice: erhebt sich
  rationale: Das Qal-Imperfekt von קום bedeutet wörtlich „aufstehen/sich erheben“. Die Formulierung erhält das lebhafte hebräische Bild.
- source_word: אֵידָם
  choice: ihr Unheil
  rationale: אֵיד bezeichnet schweres Unheil oder Verderben; das deutsche „Unheil“ ist knapp, gewichtig und lässt den Bezug des pronominalen Suffixes wie im Hebräischen aus dem Zusammenhang erschließen.
- source_word: וּפִיד
  choice: und … das Verderben
  rationale: פִיד bezeichnet vernichtendes Unheil. „Verderben“ wahrt den poetischen Parallelismus, ohne „Unheil“ schlicht zu wiederholen.
- source_word: שְׁנֵיהֶם
  choice: von den beiden
  rationale: Die Form bedeutet „die beiden/sie beide“. Im Zusammenhang liegt der Bezug auf den HERRN und den König aus Vers 21 nahe; „von den beiden“ gibt den wahrscheinlich gemeinten Ursprung des Verderbens wieder, während die Fußnote die strittige Zuordnung offenlegt.
- source_word: מִי יוֹדֵעַ
  choice: wer kennt
  rationale: Die rhetorische Frage drückt aus, dass kein Mensch Ausmaß oder Art dieses Verderbens ermessen kann. „Wer kennt“ ist im Deutschen prägnant und passt zu einem nominal bezeichneten Unheil.
theological_decisions:
- issue: Bezug von שְׁנֵיהֶם („die beiden“)
  choice: Die Formulierung bezieht sich wahrscheinlich auf den HERRN und den König aus Vers 21 und bezeichnet das von ihnen ausgehende Verderben.
  alternative: Die Wendung kann als „das Verderben ihrer beider“ verstanden und auf andere im Zusammenhang vorausgesetzte Beteiligte oder auf das Verderben, das beide trifft, bezogen werden.
  rationale: Im unmittelbaren Kontext werden der HERR und der König als zwei Autoritäten genannt. Dennoch benennt der hebräische Text den Bezug nicht ausdrücklich; deshalb wird die wahrscheinlichste Lesart im Haupttext verwendet und die echte Auslegungsunsicherheit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe rhetorische Frage und das Bild des sich erhebenden Unheils bewahren den sprichwortartigen Warncharakter; die nicht ausdrücklich genannten Bezüge werden nicht unnötig im Haupttext ergänzt.
