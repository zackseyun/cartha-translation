id: PRO.24.31
reference: Proverbs 24:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה עָ֘לָ֤ה כֻלּ֨/וֹ קִמְּשֹׂנִ֗ים כָּסּ֣וּ פָנָ֣י/ו חֲרֻלִּ֑ים וְ/גֶ֖דֶר אֲבָנָ֣י/ו נֶהֱרָֽסָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/031.yaml
  text: and behold[a], it was all overgrown with thorns; nettles covered its surface[c][b], and its stone wall was broken down.
translation:
  language: de
  text: 'Und siehe: Überall waren Dornen[a] darauf gewachsen; Nesseln[c] bedeckten seine Oberfläche[b], und seine Steinmauer war eingestürzt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Disteln“. Welche Pflanze קִמְּשֹׂנִים genau bezeichnet, ist unsicher; gemeint ist schädlicher, vermutlich stacheliger Wildwuchs.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „sein Gesicht“; hier ist damit die sichtbare Fläche des Grundstücks gemeint.
    reason: lexical_alternative
  - marker: c
    text: Oder „Gestrüpp“ beziehungsweise „Unkraut“. חֲרֻלִּים bezeichnet unerwünschten Wildwuchs und wird traditionell mit „Nesseln“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt die hinweisende, die unmittelbare Beobachtung hervorhebende Kraft des hebräischen Ausdrucks in einer für Weisheitsliteratur angemessen gehobenen Form.
- source_word: עָלָה כֻלּוֹ
  choice: Überall waren … darauf gewachsen
  rationale: Gibt das Aufwachsen ungehemmten Bewuchses auf dem gesamten Grundstück natürlich wieder und wahrt zugleich die bildhafte Grundbedeutung des Verbs עָלָה.
- source_word: קִמְּשֹׂנִים
  choice: Dornen
  rationale: Die genaue Pflanzenart ist unsicher; gemeint ist schädlicher, vermutlich stacheliger Wildwuchs. „Dornen“ ist verständlich und lässt die botanische Bestimmung angemessen offen.
- source_word: כָּסּוּ
  choice: bedeckten
  rationale: Entspricht der schlichten räumlichen Aussage des hebräischen Verbs.
- source_word: פָנָיו
  choice: seine Oberfläche
  rationale: Das wörtliche „sein Gesicht“ bezeichnet hier idiomatisch die sichtbare Fläche des Grundstücks.
- source_word: חֲרֻלִּים
  choice: Nesseln
  rationale: Die traditionelle Wiedergabe bezeichnet unerwünschten Wildwuchs und hält diesen Pflanzenbegriff von קִמְּשֹׂנִים unterschieden; die genaue botanische Identität bleibt unsicher.
- source_word: וְגֶדֶר אֲבָנָיו
  choice: und seine Steinmauer
  rationale: Bezeichnet knapp und natürlich die aus Steinen errichtete Einfriedung des Grundstücks.
- source_word: נֶהֱרָסָה
  choice: war eingestürzt
  rationale: Drückt den ruinösen Zustand der vernachlässigten Mauer idiomatisch aus, ohne ausdrücklich einen handelnden Zerstörer vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Und siehe“ erhält die anschauliche Beobachtungssituation; die übrige Formulierung bleibt alltagssprachlich verständlich. Die beiden unterschiedlichen, botanisch unsicheren Pflanzenbezeichnungen des Hebräischen werden auch im Deutschen unterschieden.
