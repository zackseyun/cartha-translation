  text: פֶּן יִרְאֶ֣ה יְ֭הוָה וְ/רַ֣ע בְּ/עֵינָ֑י/ו וְ/הֵשִׁ֖יב מֵ/עָלָ֣י/ו אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/018.yaml
  text: lest Yahweh see it[a], and it be evil in his eyes, and he turn his anger away from him.
translation:
  language: de
  text: Sonst sieht Jahwe es, und es ist böse in seinen Augen[a], und er wendet seinen Zorn von ihm ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: und es missfällt ihm.'
    reason: lexikalische und idiomatische Alternative zu „es ist böse in seinen Augen“
lexical_decisions:
- source_word: פֶּן
  choice: sonst
  rationale: Die Konjunktion leitet hier die befürchtete Folge der vorangehenden Warnung ein. „Sonst“ ist im modernen Deutschen natürlich und bewahrt den warnenden Sinn.
- source_word: יִרְאֶה
  choice: sieht
  rationale: Das Imperfekt bezeichnet im Zusammenhang mit פֶּן eine mögliche künftige Folge; das deutsche Präsens ist in einer Warnung idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְרַע בְּעֵינָיו
  choice: und es ist böse in seinen Augen
  rationale: Die Wiedergabe bewahrt sowohl das wertende Adjektiv רַע als auch das hebräische Bild „in seinen Augen“. Die idiomatischere Bedeutung „es missfällt ihm“ wird in der Fußnote genannt.
- source_word: וְהֵשִׁיב
  choice: und er wendet … ab
  rationale: Der Hifil von שׁוב bezeichnet hier das Abwenden beziehungsweise Zurücknehmen des Zorns.
- source_word: מֵעָלָיו
  choice: von ihm
  rationale: Die Präpositionalverbindung bezeichnet die Entfernung des Zorns von der betreffenden Person.
- source_word: אַפּוֹ
  choice: seinen Zorn
  rationale: אַף bezeichnet wörtlich die Nase, ist hier jedoch die übliche hebräische Metonymie für Zorn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der persönliche Gottesname; „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von „seinen Zorn von ihm abwenden“
  choice: Das Pronomen „ihm“ bleibt ohne zusätzliche Identifizierung erhalten.
  alternative: den Feind ausdrücklich als Bezug nennen
  rationale: Der Vers setzt den Bezug aus dem vorangehenden Kontext voraus. Eine ausdrückliche Benennung würde mehr festlegen, als dieser Vers selbst sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bildsprache „böse in seinen Augen“ bleibt im Haupttext erhalten; eine natürlichere deutsche Sinnwiedergabe steht in der Fußnote.
