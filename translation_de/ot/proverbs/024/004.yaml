  text: וּ֭/בְ/דַעַת חֲדָרִ֣ים יִמָּלְא֑וּ כָּל ה֖וֹן יָקָ֣ר וְ/נָעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/004.yaml
  text: and by knowledge rooms are filled with all precious and pleasant wealth[a][b][c].
translation:
  language: de
  text: und durch Erkenntnis werden die Räume[a] mit allem kostbaren und angenehmen Besitz[b] gefüllt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Kammern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit allem Besitz, kostbar und angenehm“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „werden … gefüllt werden“; die hebräische Verbform kann futurisch verstanden werden, wird hier jedoch als allgemeingültige Aussage im Präsens wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַעַת
  choice: und durch Erkenntnis
  rationale: Die Konjunktion und die instrumentale Präposition werden ausdrücklich wiedergegeben. „Erkenntnis“ bezeichnet hier erworbenes oder vorhandenes Wissen und passt zum Weisheitskontext.
- source_word: חֲדָרִים
  choice: die Räume
  rationale: Das Wort bezeichnet Räume beziehungsweise Kammern innerhalb eines Hauses. „Räume“ ist im modernen Deutschen natürlich und wahrt den Bezug zum Haus im vorherigen Vers.
- source_word: יִמָּלְאוּ
  choice: werden … gefüllt
  rationale: Das Nifal drückt den passiven Vorgang aus. Das Präsens gibt die allgemeine, sprichwörtliche Aussage wieder; ein futurisches Verständnis bleibt in der Fußnote erhalten.
- source_word: כָּל הוֹן
  choice: mit allem … Besitz
  rationale: הוֹן bezeichnet Vermögen, Habe oder Besitz. Die kollektive Wendung „aller Besitz“ bildet כָּל ohne die erklärende Erweiterung „jede Art von“ ab.
- source_word: יָקָר
  choice: kostbaren
  rationale: Das Adjektiv bezeichnet, was wertvoll oder kostbar ist; „kostbar“ bewahrt den gehobenen Weisheitston.
- source_word: וְנָעִים
  choice: und angenehmen
  rationale: Das Wort bezeichnet etwas Angenehmes, Erfreuliches oder Begehrenswertes. „Angenehm“ erhält die offene Bedeutung, ohne sie auf Schönheit oder materiellen Wert zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen und schließt mit dem Verb ab; „Räume“ ist alltagssprachlich verständlicher als „Kammern“.
