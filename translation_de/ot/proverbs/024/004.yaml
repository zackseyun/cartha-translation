  source_fidelity: Die Übersetzung gibt die Konjunktion und die instrumentale Präposition in וּבְדַעַת angemessen wieder. „Erkenntnis“ ist für דַּעַת im Weisheitskontext tragfähig; „Räume“ entspricht חֲדָרִים, und die passive präsentische Wiedergabe von יִמָּלְאוּ passt zum sprichwörtlichen Charakter. „Mit allem kostbaren und angenehmen Besitz“ bildet כָּל־הוֹן יָקָר וְנָעִים ohne sachliche Erweiterung ab.
