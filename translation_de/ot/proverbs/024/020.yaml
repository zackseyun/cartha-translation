source:
  edition: WLC
  text: כִּ֤י לֹֽא תִהְיֶ֣ה אַחֲרִ֣ית לָ/רָ֑ע נֵ֖ר רְשָׁעִ֣ים יִדְעָֽךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/020.yaml
  text: For there will be no future for the evil[b][a]; the lamp of the wicked will be put out.
translation:
  language: de
  text: Denn der Böse hat keine Zukunft[a]; die Lampe der Frevler wird erlöschen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keinen Ausgang“ beziehungsweise „keine Zukunftsaussicht“. Das hebräische Wort kann die Zukunft, das spätere Geschick oder den schließlichen Ausgang eines Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild der erlöschenden Lampe kann für das Ende des Lebens, des Wohlergehens oder des dauerhaften Bestands stehen; der hebräische Text legt es nicht auf nur eine Bedeutung fest.
    reason: metaphor_clarification
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet im Zusammenhang die vorausgehende Mahnung; „Denn“ bewahrt diese kausale Funktion natürlich.
- source_word: לֹא תִהְיֶה
  choice: wird es keine … geben
  rationale: Die verneinte Existenzkonstruktion wird im Deutschen idiomatisch und mit ihrem Zukunftsbezug wiedergegeben.
- source_word: אַחֲרִית
  choice: Zukunft
  rationale: Das Wort bezeichnet hier die künftige Aussicht beziehungsweise den schließlichen Ausgang eines Menschen. „Zukunft“ passt zum parallelen Bild der erlöschenden Leuchte, ohne den Sinn auf Nachkommenschaft einzuengen.
- source_word: לָרָע
  choice: für den Bösen
  rationale: Der substantivisch gebrauchte Singular bezeichnet eine böse Person. Die Übersetzung erhält Singular und Personenbezug, ohne einen besonderen theologischen Referenten anzunehmen.
- source_word: נֵר
  choice: Leuchte
  rationale: „Leuchte“ bewahrt das konkrete Bild eines brennenden Lichtträgers und klingt in diesem Weisheitsspruch natürlich und würdig.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Der substantivierte Plural bezeichnet Menschen, die Unrecht tun. „Frevler“ ist prägnant und unterscheidet den Plural hörbar vom Singular der ersten Vershälfte.
- source_word: יִדְעָךְ
  choice: wird erlöschen
  rationale: Das Verb bezeichnet das Erlöschen eines Lichts. Die intransitive Form ist im Deutschen die natürliche Entsprechung und lässt offen, wodurch das Erlöschen bewirkt wird.
theological_decisions:
- issue: Wechsel vom singularischen רָע zum pluralischen רְשָׁעִים
  choice: „der Böse“ im ersten und „die Frevler“ im zweiten Halbvers
  alternative: Beide Ausdrücke einheitlich mit „die Bösen“ wiedergeben
  rationale: Der Numeruswechsel des hebräischen Textes bleibt erhalten. Zugleich wird „der Böse“ nicht als Titel oder als Bezeichnung Satans festgelegt.
- issue: Bedeutungsumfang von אַחֲרִית
  choice: „Zukunft“
  alternative: „Ende“, „Ausgang“ oder „Zukunftsaussicht“
  rationale: „Zukunft“ gibt die fehlende dauerhafte Aussicht knapp wieder und steht sinnvoll parallel zum Erlöschen der Leuchte. Die Fußnote bewahrt die mögliche Nuance des Endes oder Ausgangs.
- issue: Aussagekraft des Bildes von der erlöschenden Leuchte
  choice: Das Bild wörtlich stehen lassen
  alternative: Explizit als Ende von Leben, Wohlergehen oder Bestand auslegen
  rationale: Der Text selbst deutet das Bild nicht auf nur eine dieser Möglichkeiten fest; die Übersetzung wahrt diese theologische und poetische Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Spruchform. Der Parallelismus, das konkrete Leuchtenbild und der Numeruswechsel zwischen den beiden Halbversen bleiben erhalten.
