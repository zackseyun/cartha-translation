source:
  edition: WLC
  text: גַּם אֵ֥לֶּה לַֽ/חֲכָמִ֑ים הַֽכֵּר פָּנִ֖ים בְּ/מִשְׁפָּ֣ט בַּל טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/023.yaml
  text: 'These also are sayings of the wise: to show partiality in judgment is not good[a][b].'
translation:
  language: de
  text: 'Auch dies sind Worte der Weisen:


    Bei der Rechtsprechung parteiisch zu sein, ist nicht gut.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Auch diese – für die Weisen.“ Wahrscheinlich ist die knappe Wendung als Überschrift zu verstehen: weitere Worte oder Sprüche der Weisen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „bei einem Urteil Gesichter anzusehen“; das hebräische Idiom meint, beim Urteilen auf das Ansehen einer Person zu schauen, also parteiisch zu sein.'
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֵלֶּה
  choice: Auch dies
  rationale: Die Verbindung aus גַּם und אֵלֶּה kennzeichnet eine Ergänzung zur vorausgehenden Sammlung; „Auch dies“ ist im Deutschen eine knappe, natürliche Einleitung.
- source_word: לַחֲכָמִים
  choice: sind Worte der Weisen
  rationale: Wörtlich steht nur „für/den Weisen“. Im Kontext fungiert die elliptische Wendung wahrscheinlich als Überschrift für weitere Weisheitssprüche; „Worte der Weisen“ macht diese Funktion verständlich, ohne die Herkunft genauer festzulegen.
- source_word: הַכֵּר פָּנִים
  choice: Menschen unterschiedlich zu behandeln
  rationale: Die Wendung bedeutet wörtlich „Gesichter anzuerkennen“ und bezeichnet eine vom Ansehen der Person abhängige Bevorzugung oder Benachteiligung. Die deutsche Formulierung gibt das gemeinte parteiische Verhalten allgemeinverständlich wieder.
- source_word: בְּמִשְׁפָּט
  choice: bei einem Urteil
  rationale: מִשְׁפָּט bezeichnet hier das richterliche Entscheiden beziehungsweise einen Rechtsspruch; „bei einem Urteil“ bewahrt den juristischen Zusammenhang.
- source_word: בַּל טוֹב
  choice: ist nicht gut
  rationale: Die einfache moralische Wertung des Hebräischen wird direkt und ohne Verengung auf „rechtswidrig“ oder „unangebracht“ wiedergegeben.
theological_decisions:
- issue: Elliptische Bedeutung von לַחֲכָמִים
  choice: 'Als Überschrift verstanden: „Auch dies sind Worte der Weisen.“'
  alternative: „Auch dies ist für die Weisen“ beziehungsweise „Auch dies gehört den Weisen“
  rationale: Der Vers eröffnet einen neuen Abschnitt. Die Überschriftenfunktion ist daher wahrscheinlich, doch die Fußnote bewahrt die formale Mehrdeutigkeit der knappen hebräischen Wendung.
- issue: Reichweite des Verbots der Parteilichkeit
  choice: Neutral als unterschiedliche Behandlung von Menschen beim richterlichen Entscheiden wiedergegeben
  alternative: 'Nur positive Bevorzugung: „jemanden zu bevorzugen“'
  rationale: Das Idiom richtet sich gegen Entscheidungen nach dem Ansehen der Person und kann sowohl Begünstigung als auch Benachteiligung umfassen; die Übersetzung vermeidet eine unnötige Einschränkung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Zeile ist als Abschnittsüberschrift formuliert; die zweite vermeidet den weniger alltagssprachlichen Ausdruck „Ansehen der Person“, während die Fußnote das hebräische Bild erhält.
