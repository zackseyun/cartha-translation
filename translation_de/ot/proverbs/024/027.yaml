  text: הָ֘כֵ֤ן בַּ/ח֨וּץ מְלַאכְתֶּ֗/ךָ וְ/עַתְּדָ֣/הּ בַּ/שָּׂדֶ֣ה לָ֑/ךְ אַ֝חַ֗ר וּ/בָנִ֥יתָ בֵיתֶֽ/ךָ׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/027.yaml
  text: Prepare your work outside[a]; make it ready for yourself in the field; afterward[b], build your house.
translation:
  language: de
  text: Bereite deine Arbeit draußen vor[a]; mache sie dir auf dem Feld bereit; danach baue dein Haus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Richte draußen deine Arbeit ein.“'
    reason: lexical_alternative
  - marker: b
    text: „Haus“ kann in der Weisheitsliteratur auch den Hausstand oder die Familie meinen. Der unmittelbare Gegensatz zu „draußen“ und „Feld“ spricht hier jedoch für den konkreten Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכֵן
  choice: Bereite … vor
  rationale: Der Imperativ von כון bezeichnet hier das Bereitmachen oder geordnete Einrichten. „Bereite … vor“ gibt den zeitlichen und praktischen Vorrang der Arbeit natürlich wieder.
- source_word: בַּחוּץ
  choice: draußen
  rationale: Das Wort bezeichnet den Außenbereich und steht in einem räumlichen Gegensatz zum später genannten Haus.
- source_word: מְלַאכְתֶּךָ
  choice: deine Arbeit
  rationale: מְלָאכָה kann Arbeit, Tätigkeit oder Aufgabe bezeichnen. „Deine Arbeit“ ist breit genug und lässt offen, welche konkrete Erwerbsarbeit gemeint ist.
- source_word: וְעַתְּדָהּ
  choice: mache sie … bereit
  rationale: Das Piel von עתד bedeutet, etwas bereitzumachen. Das feminine Suffix bezieht sich am natürlichsten auf מְלַאכְתֶּךָ („deine Arbeit“).
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: „Auf dem Feld“ ist im Deutschen die natürliche konkrete Wiedergabe des Ortes landwirtschaftlicher Arbeit.
- source_word: לָךְ
  choice: dir
  rationale: Der Dativ drückt Nutzen oder persönliches Interesse aus. Das deutsche „dir“ bewahrt diese Nuance knapp und idiomatisch.
- source_word: אַחַר
  choice: danach
  rationale: 'Das Adverb kennzeichnet die zeitliche Reihenfolge: zuerst die produktive Arbeit sichern, danach das Haus bauen.'
- source_word: וּבָנִיתָ בֵיתֶךָ
  choice: danach baue dein Haus
  rationale: Die Form wird im Zusammenhang als anschließende Aufforderung wiedergegeben. „Haus“ wahrt den konkreten Sinn und zugleich eine mögliche weitere Bedeutungsdimension.
theological_decisions:
- issue: Bedeutungsumfang von בֵּיתֶךָ
  choice: dein Haus
  alternative: deinen Hausstand / deine Familie
  rationale: בַּיִת kann auch Hausstand oder Familie bezeichnen. Der unmittelbare Gegensatz zu „draußen“ und „auf dem Feld“ stützt hier jedoch zunächst das konkrete Gebäude; eine weitergehende weisheitliche Anwendung wird nicht ausgeschlossen.
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem Spruchton. Die parallelen Ausdrücke „vorbereiten“ und „bereitmachen“ bilden die Wiederholung des Hebräischen ab, ohne sie inhaltlich aufzulösen.
