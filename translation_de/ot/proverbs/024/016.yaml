  yaml_path: translation/ot/proverbs/024/016.yaml
  text: For the righteous falls seven times and rises again[c][b][a], but the wicked stumble in calamity.
translation:
  language: de
  text: Denn siebenmal[b] fällt ein Gerechter[a] und steht wieder auf; doch die Frevler kommen im Unglück[c] zu Fall.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Gerechte“ beziehungsweise „ein gerechter Mensch“. Im Hebräischen steht eine maskuline Singularform, die in diesem Spruch einen repräsentativen Typus bezeichnet.'
    reason: lexical_alternative
  - marker: b
    text: '„Siebenmal“ steht wahrscheinlich sprichwörtlich für wiederholtes oder umfassendes Geschehen: Ein Gerechter kann immer wieder fallen und steht dennoch wieder auf.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „im Unheil“ beziehungsweise „durch Unglück“. Das hebräische Wort kann hier Not oder Verderben bezeichnen und muss nicht moralisches Böses meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Mahnung und bewahrt mit „Denn“ den logischen Zusammenhang.
- source_word: שֶׁבַע
  choice: siebenmal
  rationale: Die Zahl wird als konkretes hebräisches Bild beibehalten; im sprichwörtlichen Zusammenhang bezeichnet sie wahrscheinlich wiederholtes oder umfassendes Geschehen.
- source_word: יִפּוֹל
  choice: fällt
  rationale: Das Imperfekt formuliert hier eine allgemeine, sprichwörtliche Wahrheit; das deutsche Präsens gibt dies natürlich wieder.
- source_word: צַדִּיק
  choice: ein Gerechter
  rationale: Das substantivierte Adjektiv steht im Hebräischen im maskulinen Singular und bezeichnet in diesem Spruch einen repräsentativen Typus, nicht eine bestimmte Einzelperson.
- source_word: וָקָם
  choice: und steht wieder auf
  rationale: קום bezeichnet das Aufstehen beziehungsweise Sich-Erheben. „Wieder“ verdeutlicht im Deutschen die im Zusammenhang erkennbare Erholung nach dem Fallen.
- source_word: וּרְשָׁעִים
  choice: doch die Frevler
  rationale: Das Waw hat hier im Gegensatz zwischen Gerechtem und Frevlern adversative Funktion. „Frevler“ gibt den substantivierten Plural prägnant wieder.
- source_word: יִכָּשְׁלוּ
  choice: kommen … zu Fall
  rationale: Das Verb כשל bezeichnet Straucheln oder Zu-Fall-Kommen. Die deutsche Wendung bewahrt das Fallmotiv und drückt hier den Gegensatz zum erneuten Aufstehen aus.
- source_word: בְרָעָה
  choice: im Unglück
  rationale: רָעָה bezeichnet in diesem Kontext am ehesten Unheil, Not oder Unglück und nicht ausdrücklich moralisches Böses.
theological_decisions:
- issue: Repräsentativer maskuliner Singular bei צַדִּיק
  choice: ein Gerechter
  alternative: der Gerechte; ein gerechter Mensch
  rationale: Die Übersetzung bewahrt die grammatische Einzahl und den sprichwörtlich-repräsentativen Charakter, ohne eine bestimmte Person vorauszusetzen.
- issue: Art des Fallens
  choice: Fall und erneutes Aufstehen in wiederholter Bedrängnis bleiben bildhaft und offen formuliert
  alternative: siebenmal sündigen und jeweils umkehren
  rationale: Der hebräische Text nennt weder Sünde noch Umkehr ausdrücklich. Die Übersetzung importiert diese besondere Deutung daher nicht, sondern erhält die Spannung des Bildes.
- issue: Bedeutung von רָעָה
  choice: Unglück
  alternative: Böses
  rationale: Der Parallelismus stellt das wiederholte Fallen des Gerechten dem endgültigen Zu-Fall-Kommen der Frevler gegenüber; deshalb liegt hier die Bedeutung Unheil oder Unglück näher als moralisches Böses.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer sprichwörtlicher Gegenüberstellung. Das konkrete Bild von Fallen und Aufstehen sowie die Zahl Sieben bleiben erhalten; die Semikolon-Struktur macht den Kontrast gut lesbar.
