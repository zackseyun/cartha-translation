source:
  edition: WLC
  text: כִּי שֹׁ֭ד יֶהְגֶּ֣ה לִבָּ֑/ם וְ֝/עָמָ֗ל שִׂפְתֵי/הֶ֥ם תְּדַבֵּֽרְנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/002.yaml
  text: For their heart meditates on destruction[b][a], and their lips speak trouble.
translation:
  language: de
  text: Denn ihr Herz sinnt auf Gewalt[a], und ihre Lippen sprechen Unheil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verderben“ beziehungsweise „Verwüstung“. Das hebräische Wort kann sowohl Gewalt als auch die dadurch bewirkte Zerstörung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Böses“ beziehungsweise „Schaden“. Das hebräische Wort kann auch Mühsal oder Not bedeuten, bezeichnet hier aber wahrscheinlich schädliches Tun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das Verbot im vorhergehenden Vers ein und bewahrt den erklärenden Zusammenhang.
- source_word: שֹׁד
  choice: Gewalt
  rationale: Bezeichnet hier zerstörerisches, gewaltsames Handeln; „Gewalt“ gibt den moralischen Charakter knapp und idiomatisch wieder, ohne die mögliche Bedeutungsnuance der Verwüstung auszuschließen.
- source_word: יֶהְגֶּה
  choice: sinnt auf
  rationale: הגה kann leises Äußern, Nachsinnen oder inneres Erwägen bezeichnen. Mit dem Herzen als Subjekt drückt „sinnt auf“ anhaltendes inneres Trachten aus, ohne die Bedeutung vorschnell auf konkretes Planen zu verengen.
- source_word: לִבָּם
  choice: ihr Herz
  rationale: Bewahrt das kollektive Singular des Hebräischen und das poetische Bild für Denken und Wollen.
- source_word: וְעָמָל
  choice: Unheil
  rationale: עמל kann Mühsal, Not oder schädliches Tun bezeichnen. Im Parallelismus mit Gewalt meint es hier am ehesten Unheil beziehungsweise Böses, das durch ihre Worte hervorgebracht oder angekündigt wird.
- source_word: שִׂפְתֵיהֶם
  choice: ihre Lippen
  rationale: Erhält das hebräische Körperbild und den Gegensatz zwischen innerem Trachten und äußerem Reden.
- source_word: תְּדַבֵּרְנָה
  choice: sprechen
  rationale: Das Präsens entspricht dem allgemeinen, sprichwortartigen Aussagecharakter; die feminine Pluralform stimmt mit „Lippen“ überein.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus zwischen „Herz“ und „Lippen“ sowie das kollektive Singular „ihr Herz“ bleiben erhalten. „Sinnt auf“ bewahrt die innere, fortgesetzte Tätigkeit des Verbs, während die Fußnoten die echte lexikalische Spannweite von שֹׁד und עָמָל offenhalten.
