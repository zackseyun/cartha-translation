    issue: „Mitmenschen“ für רֵעַ
    rationale: „Mitmensch“ ist weiter und weniger kontextnah als „Nächster“ bzw. „Mitbürger/Freund“. „Nächsten“ ist im Weisheits- und Rechtssprachgebrauch natürlich und näher am hebräischen Sozialbegriff.
  - severity: medium
    issue: „willst du etwa ... täuschen?“
    rationale: Die rhetorische Frage ist wegen הֲ richtig, aber „willst du“ legt im Deutschen vor allem Willensabsicht nahe. „Täuschst du etwa ...?“ fragt direkter nach der im hebräischen Imperfekt ausgedrückten Handlung.
