base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/028.yaml
  text: Do not be a witness against your neighbor without cause[b][a], and do not deceive with your lips.
translation:
  language: de
  text: Sei nicht ohne Grund[a] Zeuge gegen deinen Nächsten; täuschst du etwa mit deinen Lippen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ohne Grund“ kann auch „umsonst“ oder „ohne Anlass“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich als rhetorische Frage. Sinngemäß ist auch möglich: „und täusche nicht mit deinen Lippen.“'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Tritt nicht … auf
  rationale: Die mit אַל verneinte Verbform drückt ein direktes Verbot aus. Mit עֵד ergibt „als Zeuge auftreten“ im Deutschen eine natürliche rechtliche Wendung.
- source_word: עֵד
  choice: als Zeuge
  rationale: Das Substantiv bezeichnet einen Zeugen, besonders in einem rechtlichen oder vergleichbaren Zusammenhang.
- source_word: חִנָּם
  choice: ohne Grund
  rationale: Das Adverb bezeichnet hier ein grundloses, unberechtigtes Auftreten als Zeuge; die Wendung wahrt zugleich die mögliche Bedeutung „umsonst“.
- source_word: בְּרֵעֶךָ
  choice: gegen deinen Mitmenschen
  rationale: Bei einer Zeugenaussage gibt ב die betroffene beziehungsweise belastete Person an. „Mitmensch“ gibt den sozialen Sinn von רֵעַ in verständlichem modernem Deutsch wieder.
- source_word: וַהֲפִתִּיתָ
  choice: und willst du etwa … täuschen?
  rationale: Die masoretische Schreibung enthält nach der Konjunktion die Fragepartikel הֲ und danach eine Verbform der 2. Person Singular. Eine rhetorische Frage bildet diese Form genauer ab als ein zweites ausdrücklich formuliertes Verbot, dessen prohibitive Stoßrichtung jedoch im Zusammenhang erhalten bleibt.
- source_word: בִּשְׂפָתֶיךָ
  choice: mit deinen Lippen
  rationale: Die konkrete hebräische Redeweise bleibt erhalten und ist auch im Deutschen klar verständlich.
theological_decisions:
- issue: Form und Aussagekraft des zweiten Halbverses
  choice: 'Wiedergabe als rhetorische Frage: „und willst du etwa … täuschen?“'
  alternative: „und täusche nicht mit deinen Lippen“
  rationale: Die Fragepartikel הֲ ist im überlieferten hebräischen Text ausdrücklich vorhanden. Die rhetorische Frage führt den ersten Imperativ sinngemäß weiter, ohne die grammatische Spannung in ein gewöhnliches zweites Verbot einzuebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Als Zeuge auftreten“ vermittelt den rechtlichen Zusammenhang natürlich; „mit deinen Lippen“ bewahrt das anschauliche Bild des Hebräischen. Die ungewöhnliche rhetorische Form des zweiten Halbverses wird im Haupttext erhalten und in der Fußnote erläutert.
