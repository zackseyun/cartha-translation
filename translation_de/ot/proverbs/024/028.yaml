  verdict: revise
  source_fidelity: Der erste Halbvers gibt das Verbot und den forensisch-sozialen Sinn von עֵד ... בְּרֵעֶךָ zutreffend wieder. Im zweiten Halbvers ist die im masoretischen Text stehende Fragepartikel הֲ zu berücksichtigen; die rhetorische Frage ist daher sachgerecht. „Willst du“ kann im Deutschen jedoch primär eine Absicht ausdrücken, während die hebräische Verbform unmittelbar die Handlung zur Sprache bringt.
  naturalness: Der Text ist insgesamt verständlich und würdig. „Deinen Nächsten“ ist für רֵעַ im Deutschen idiomatischer und genauer als „deinen Mitmenschen“. Eine Trennung durch Semikolon macht die eigenständige rhetorische Frage im zweiten Halbvers klar lesbar.
  terminology: „Zeuge“, „ohne Grund“ und „mit deinen Lippen“ sind angemessen. „Nächsten“ bewahrt den sozialen Bezug von רֵעַ, ohne ihn auf einen bloßen allgemeinen Mitmenschen zu erweitern.
