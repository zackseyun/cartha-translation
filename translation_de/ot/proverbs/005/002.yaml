  text: לִ/שְׁמֹ֥ר מְזִמּ֑וֹת וְ֝/דַ֗עַת שְׂפָתֶ֥י/ךָ יִנְצֹֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/002.yaml
  text: so that you may keep discretion[b][a], and your lips may guard knowledge.
translation:
  language: de
  text: damit du Besonnenheit[a] bewahrst und deine Lippen[b] Erkenntnis bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Umsicht“ oder „kluges Urteil“.'
    reason: lexical_alternative
  - marker: b
    text: Die „Lippen“ stehen bildhaft für das Reden, das Erkenntnis bewahrt und zum Ausdruck bringt.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: damit du … bewahrst
  rationale: Der mit לְ gebildete Infinitiv bezeichnet hier im Zusammenhang den Zweck der vorausgehenden Ermahnung. „Damit“ macht diesen Bezug im Deutschen natürlich deutlich; „bewahren“ erhält den Sinn von שמר.
- source_word: מְזִמּוֹת
  choice: Besonnenheit
  rationale: Das Wort bezeichnet in diesem positiven Weisheitskontext überlegtes, umsichtiges Urteilen und nicht negative Machenschaften. „Besonnenheit“ ist verständlich und wahrt den Bezug zur inneren Urteilsfähigkeit.
- source_word: וְדַעַת
  choice: Erkenntnis
  rationale: דעת bezeichnet im Buch der Sprüche häufig praktische und sittliche Erkenntnis. Die Wiedergabe vermeidet eine Verengung auf bloße Information.
- source_word: שְׂפָתֶיךָ
  choice: deine Lippen
  rationale: Die konkrete poetische Körpermetapher des Hebräischen bleibt erhalten; gemeint ist zugleich das von den Lippen hervorgebrachte Reden.
- source_word: יִנְצֹרוּ
  choice: hüten
  rationale: נצר bedeutet schützen, hüten oder bewahren. „Hüten“ erhält die Schutzvorstellung und vermeidet eine unmittelbare Wiederholung von „bewahren“.
theological_decisions: []
