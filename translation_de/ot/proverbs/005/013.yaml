  yaml_path: translation/ot/proverbs/005/013.yaml
  text: and I did not listen to the voice of my instructors[a], nor did I incline my ear to my teachers.
translation:
  language: de
  text: Ich habe nicht auf die Stimme meiner Lehrer[a] gehört und meinen Lehrern kein Gehör geschenkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe der Stimme meiner Lehrer nicht gehorcht.“ Das hebräische Verb kann besonders in Weisheitstexten ein Hören bezeichnen, das Gehorsam einschließt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: habe ... gehört
  rationale: שׁמע bezeichnet je nach Zusammenhang Hören, Zuhören oder Gehorchen. Mit בְּקוֹל und im Weisheitskontext meint es ein Hören, das dem Gesagten Beachtung schenkt; die Fußnote hält die stärkere Bedeutung „gehorchen“ offen.
- source_word: בְּקוֹל
  choice: auf die Stimme
  rationale: Die Verbindung שׁמע בקול kann „auf die Stimme hören“ beziehungsweise „gehorchen“ bedeuten. Die deutsche Wendung bewahrt das hebräische Bild und ist idiomatisch.
- source_word: מוֹרָי
  choice: meiner Unterweiser
  rationale: Das von ירה abgeleitete Wort bezeichnet diejenigen, die Unterweisung geben. „Unterweiser“ bewahrt eine leichte begriffliche Abgrenzung zum folgenden מְלַמְּדַי.
- source_word: מְלַמְּדַי
  choice: meinen Lehrern
  rationale: Das Partizip von למד bezeichnet die Lehrenden; „Lehrer“ ist die natürliche deutsche Wiedergabe.
- source_word: הִטִּיתִי אָזְנִי
  choice: meinen Lehrern kein Gehör geschenkt
  rationale: Wörtlich ist vom Neigen des Ohres die Rede. Die geläufige deutsche Wendung „Gehör schenken“ bewahrt das Bild des aufmerksamen Hörens natürlicher als „mein Ohr neigen“.
- source_word: וְ...וְלֹא
  choice: nicht ... und ... kein
  rationale: Die beiden koordinierten negativen Aussagen werden im Deutschen klar und flüssig durch parallele Negation verbunden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Halbzeile bewahrt das Bild „auf die Stimme hören“; die zweite gibt das hebräische Bild idiomatisch mit „Gehör schenken“ wieder. Die beiden nahezu synonymen Bezeichnungen für Lehrende bleiben leicht unterschieden.
