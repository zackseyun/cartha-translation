source:
  edition: WLC
  text: כִּ֤י נֹ֣פֶת תִּ֭טֹּפְנָה שִׂפְתֵ֣י זָרָ֑ה וְ/חָלָ֖ק מִ/שֶּׁ֣מֶן חִכָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/003.yaml
  text: For the lips of a forbidden woman drip honey[b][a], and her palate is smoother than oil.
translation:
  language: de
  text: Denn von Honig triefen die Lippen einer fremden Frau[a], und ihr Gaumen ist glatter als Öl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einer nicht zu ihm gehörenden Frau«, »einer verbotenen Frau« oder »einer Ehebrecherin«. Das hebräische Wort bezeichnet in den Sprüchen häufig eine Frau außerhalb einer rechtmäßigen sexuellen Beziehung; es kann wörtlich auch »fremd« oder »ausländisch« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die Warnung im Zusammenhang ein und bewahrt den logischen Anschluss.
- source_word: נֹפֶת תִּטֹּפְנָה
  choice: von Honig triefen
  rationale: Gibt sowohl den Honig als auch das Bild des Tropfens beziehungsweise Fließens natürlich und anschaulich wieder.
- source_word: שִׂפְתֵי זָרָה
  choice: die Lippen einer fremden Frau
  rationale: זָרָה bezeichnet zunächst eine fremde beziehungsweise nicht zugehörige Frau und trägt im Kontext der Sprüche die Konnotation einer unerlaubten sexuellen Beziehung. Die wörtlichere Formulierung bewahrt diese Mehrdeutigkeit; die Fußnote erläutert den Kontext.
- source_word: וְחָלָק מִשֶּׁמֶן
  choice: und ... ist glatter als Öl
  rationale: Das מן kennzeichnet den Vergleich; „glatter als Öl“ erhält das verführerische und möglicherweise auch schlüpfrige Bild.
- source_word: חִכָּהּ
  choice: ihr Gaumen
  rationale: Entspricht der konkreten Körperbezeichnung des Hebräischen und kann zugleich metonymisch für Mund oder Rede stehen, ohne diese Bedeutung im Haupttext festzulegen.
theological_decisions:
- issue: Bedeutung von זָרָה im Weisheitskontext
  choice: eine fremde Frau
  alternative: eine verbotene Frau; eine Ehebrecherin; eine Ausländerin
  rationale: „Fremde Frau“ bewahrt die lexikalische Spannweite des Ausdrucks. Im Kontext ist eine Frau außerhalb der legitimen sexuellen Bindung gemeint, doch der Vers legt weder ihren Familienstand noch ihre ethnische Herkunft ausdrücklich fest.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit anschaulicher Bildsprache. „Gaumen“ bewahrt die körperliche Metapher des Hebräischen; „triefen“ ist hier bewusst poetisch und nicht abwertend gebraucht.
