  source_fidelity: Die Übersetzung gibt וְאַחֲרִיתָהּ idiomatisch und sinnentsprechend als „Doch am Ende ist sie“ wieder. „bitter wie Wermut“ entspricht מָרָה כַלַּעֲנָה, und „scharf wie ein zweischneidiges Schwert“ trifft חַדָּה כְּחֶרֶב פִּיּוֹת präzise. Die weibliche Referenz und der bildhafte Parallelismus bleiben erhalten.
