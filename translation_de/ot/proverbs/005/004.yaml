  yaml_path: translation/ot/proverbs/005/004.yaml
  text: but in the end she is bitter like wormwood[a], sharp like a two-edged sword.
translation:
  language: de
  text: Doch am Ende ist sie bitter wie Wermut, scharf wie ein zweischneidiges Schwert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחֲרִיתָהּ
  choice: Doch am Ende ist sie
  rationale: אַחֲרִית bezeichnet das Ende beziehungsweise den Ausgang. Die idiomatische Wiedergabe hält den Gegensatz zum vorangehenden Vers fest und lässt den weiblichen Bezug ausdrücklich erkennen.
- source_word: מָרָה
  choice: bitter
  rationale: Das prädikative Adjektiv beschreibt ihren schmerzlichen Ausgang; im Deutschen wird es mit der Kopula „ist“ verbunden.
- source_word: כַלַּעֲנָה
  choice: wie Wermut
  rationale: לַעֲנָה bezeichnet Wermut, der sprichwörtlich für Bitterkeit steht. Die konkrete Pflanzenmetapher bleibt erhalten.
- source_word: חַדָּה
  choice: scharf
  rationale: Das Adjektiv wird direkt und natürlich wiedergegeben und gehört zum Vergleich mit dem Schwert.
- source_word: כְּחֶרֶב פִּיּוֹת
  choice: wie ein zweischneidiges Schwert
  rationale: Wörtlich steht eine ungewöhnliche Wendung wie „Schwert der Münder/Schneiden“; gemeint ist idiomatisch ein Schwert mit zwei Schneiden. „Zweischneidig“ ist im modernen Deutschen klar und geläufig.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Bilder von bitterem Wermut und einem scharfen Schwert bleiben knapp und anschaulich erhalten.
