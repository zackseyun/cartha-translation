  text: פֶּן תִּתֵּ֣ן לַ/אֲחֵרִ֣ים הוֹדֶ֑/ךָ וּ֝/שְׁנֹתֶ֗י/ךָ לְ/אַכְזָרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/009.yaml
  text: lest you give your honor to others[b][a], and your years to the cruel one.
translation:
  language: de
  text: damit du nicht anderen deine Ehre[a] gibst und einem Grausamen[b] deine Jahre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Würde«, »deinen Glanz« oder »deine Kraft«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »einem erbarmungslosen Menschen« beziehungsweise »dem Erbarmungslosen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: damit ... nicht
  rationale: Leitet die befürchtete Folge ein und gibt die warnende Funktion im modernen Deutschen natürlich wieder.
- source_word: תִּתֵּן
  choice: gibst
  rationale: Entspricht der Grundbedeutung von נתן; der Zusammenhang vermittelt den Gedanken des Verlusts oder Auslieferns.
- source_word: לַאֲחֵרִים
  choice: anderen
  rationale: Bewahrt den Plural und lässt den Personenkreis wie im Hebräischen allgemein.
- source_word: הוֹדֶךָ
  choice: deine Würde
  rationale: הוֹד kann Ehre, Glanz, Hoheit oder Kraft bezeichnen. »Würde« erfasst hier den persönlichen Wert und das Ansehen, ohne die mögliche Bedeutungsbreite völlig auf Reputation zu verengen.
- source_word: וּשְׁנֹתֶיךָ
  choice: und deine Jahre
  rationale: Eine direkte, im Deutschen verständliche Wiedergabe; gemeint sind die Lebensjahre beziehungsweise die besten Jahre des Lebens.
- source_word: לְאַכְזָרִי
  choice: einem Grausamen
  rationale: Das substantivierte Adjektiv bleibt singularisch und bezeichnet eine grausame Person, ohne das im Hebräischen nicht ausdrücklich genannte Geschlecht festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Warnkonstruktion ist als »damit ... nicht« natürlich formuliert. Die knappe Parallelstruktur und die Unbestimmtheit der grausamen Person bleiben erhalten; sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
