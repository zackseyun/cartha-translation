  source_fidelity: Die warnende Zweck-/Folgekonstruktion für פֶּן, die Pluralform „anderen“, die Singular-Unbestimmtheit von לְאַכְזָרִי und die knappe Parallelität sind grundsätzlich treffend wiedergegeben. Für הוֹדֶךָ ist „Ehre“ die unmittelbarere und im Kontext idiomatischere Grundwiedergabe als „Würde“; die weiter möglichen Nuancen bleiben sinnvoll in der Fußnote.
