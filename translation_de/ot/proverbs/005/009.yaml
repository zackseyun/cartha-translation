  terminology: „Ehre“ gibt הוד angemessen wieder, ohne es auf bloße innere Würde einzuengen. „Ein Grausamer“ bewahrt die substantivierte, unbestimmte Singularform, ohne ein ausdrücklich nicht vorhandenes Substantiv wie „Mensch“ einzutragen.
