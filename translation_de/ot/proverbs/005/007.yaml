  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ/אַל תָּ֝ס֗וּרוּ מֵ/אִמְרֵי פִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/007.yaml
  text: And now[a], sons, listen to me, and do not turn aside from the words of my mouth.
translation:
  language: de
  text: Und nun, ihr Söhne, hört auf mich und weicht nicht ab von den Worten meines Mundes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Verbindung aus Konjunktion und Zeitadverb markiert sowohl den Anschluss als auch den Übergang zu einer erneuten Mahnung.
- source_word: בָנִים
  choice: ihr Söhne
  rationale: Das hebräische Substantiv steht im maskulinen Plural und bezeichnet in der Weisheitsunterweisung die als Söhne beziehungsweise Schüler Angeredeten. Das ergänzte „ihr“ macht den deutschen Vokativ natürlich, ohne ein im Hebräischen nicht vorhandenes Besitzpronomen einzuführen.
- source_word: שִׁמְעוּ לִי
  choice: hört auf mich
  rationale: Die Wendung bezeichnet aufmerksames Hören mit möglichem Gehorsamsaspekt. „Hört auf mich“ ist im modernen Deutsch idiomatisch und bewahrt diese Bedeutungsbreite.
- source_word: וְאַל תָּסוּרוּ
  choice: und weicht nicht ab
  rationale: Die koordinierte negative Aufforderung wird unmittelbar wiedergegeben; „abweichen“ erhält zugleich das in der Weisheitsliteratur naheliegende Bild eines Weges.
- source_word: מֵאִמְרֵי פִי
  choice: von den Worten meines Mundes
  rationale: Die Formulierung bewahrt das hebräische Körperteilidiom und dessen feierlichen, rhetorischen Klang, ohne unverständlich zu werden.
