source:
  edition: WLC
  text: כִּ֤י נֹ֨כַח עֵינֵ֣י יְ֭הוָה דַּרְכֵי אִ֑ישׁ וְֽ/כָל מַעְגְּלֹתָ֥י/ו מְפַלֵּֽס׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/021.yaml
  text: For a man's ways are before the eyes of Yahweh[a], and he watches all his paths.
translation:
  language: de
  text: Denn die Wege eines Menschen liegen vor den Augen Jahwes, und alle seine Pfade wägt er ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und alle seine Pfade ebnet er“. Das hebräische Verb kann sowohl das Abwägen beziehungsweise Prüfen als auch das Ebnen eines Weges bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Warnung ein und bewahrt den knappen Zusammenhang des Spruchs.
- source_word: נֹכַח עֵינֵי יְהוָה
  choice: liegen vor den Augen Jahwes
  rationale: 'Bewahrt das anschauliche, anthropomorphe Bild: Der menschliche Lebenswandel liegt offen vor Jahwes Blick.'
- source_word: דַּרְכֵי אִישׁ
  choice: die Wege eines Menschen
  rationale: אִישׁ ist hier generisch gebraucht. „Eines Menschen“ gibt die allgemeine Geltung in natürlichem modernem Deutsch wieder, ohne den Singular aufzugeben.
- source_word: מַעְגְּלֹתָיו
  choice: alle seine Pfade
  rationale: „Pfade“ erhält das Wegbild und die poetische Parallelität zu „Wege“.
- source_word: מְפַלֵּס
  choice: wägt er ab
  rationale: Gibt die kontextuell naheliegende Bedeutung des prüfenden Messens und Beurteilens wieder und bewahrt zugleich die bildhafte Sprache.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מְפַלֵּס
  choice: wägt er ab
  alternative: ebnet er
  rationale: Im Zusammenhang steht Jahwes Kenntnis und Beurteilung des menschlichen Lebenswandels im Vordergrund. Die mögliche Bedeutung „ebnen“ wird wegen ihrer abweichenden Aussage nicht stillschweigend ausgeschlossen, sondern in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwörtlicher Satzführung. Das hebräische Wegbild und die anthropomorphe Rede von den Augen Jahwes bleiben erhalten.
