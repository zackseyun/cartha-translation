base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/015.yaml
  text: Drink water from your own cistern[a], and flowing water from your own well.
translation:
  language: de
  text: Trink Wasser aus deiner Zisterne und fließendes Wasser aus dem Inneren deines Brunnens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „und was aus dem Inneren deines Brunnens fließt“. Das hebräische Partizip kann substantivisch wiedergegeben werden, ohne „Wasser“ zu ergänzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: Trink
  rationale: Der Qal-Imperativ in der 2. Person Singular wird unmittelbar und ohne zusätzliche Bedeutungsnuance wiedergegeben.
- source_word: מַיִם
  choice: Wasser
  rationale: Die übliche deutsche Wiedergabe des morphologisch pluralischen hebräischen Substantivs ist hier der Singular „Wasser“.
- source_word: מִבּוֹרֶךָ
  choice: aus deiner eigenen Zisterne
  rationale: בּוֹר bezeichnet häufig eine Grube oder Zisterne. Im häuslichen Bild und parallel zu „Brunnen“ ist „Zisterne“ präzise; „eigenen“ verdeutlicht im Deutschen die im Kontext betonte Zugehörigkeit, ohne das Bild auszudeuten.
- source_word: וְנֹזְלִים
  choice: und fließendes Wasser
  rationale: Das substantivisch gebrauchte Partizip von נזל („fließen“) steht elliptisch parallel zu „Wasser“. Die Ergänzung von „Wasser“ ergibt eine natürliche deutsche Formulierung; die wörtlichere Alternative bleibt in der Fußnote erhalten.
- source_word: מִתּוֹךְ
  choice: aus
  rationale: מִתּוֹךְ bezeichnet eine Bewegung aus dem Inneren heraus. In Verbindung mit einem Brunnen gibt das idiomatische deutsche „aus“ den Herkunftssinn natürlich wieder; „aus dem Inneren“ wäre möglich, aber schwerfälliger.
- source_word: בְּאֵרֶךָ
  choice: deinem eigenen Brunnen
  rationale: בְּאֵר bedeutet gewöhnlich „Brunnen“. Das konkrete Wasserbild bleibt erhalten; „eigenen“ hebt die Zugehörigkeit hervor, die der Kontext betont.
theological_decisions:
- issue: Soll die ehelich-sexuelle Bedeutung des Wasserbildes im Haupttext ausdrücklich gemacht werden?
  choice: Das konkrete Wasserbild bleibt im Haupttext erhalten.
  alternative: 'Sinngemäß ausdeuten, etwa: „Halte dich an deine eigene Frau.“'
  rationale: Der hebräische Text formuliert bewusst metaphorisch, während der Zusammenhang die Anwendung erkennen lässt. Eine ausdrückliche Deutung im Vers würde die Bildsprache auflösen und mehr sagen als der Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Imperativform. Die parallele Wasserbildsprache bleibt bewahrt; die Wiederholung von „eigenen“ macht die im Zusammenhang hervorgehobene Ausschließlichkeit verständlich.
