  text: רַ֭גְלֶי/הָ יֹרְד֣וֹת מָ֑וֶת שְׁ֝א֗וֹל צְעָדֶ֥י/הָ יִתְמֹֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/005.yaml
  text: Her feet go down to death[a]; her steps hold fast to Sheol.
translation:
  language: de
  text: Ihre Füße steigen zum Tod hinab; ihre Schritte halten an Scheol[a] fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Grab« oder »am Totenreich«. Hebräisch: Scheol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֶיהָ
  choice: ihre Füße
  rationale: Der Plural mit Suffix der 3. Person feminin Singular wird konkret wiedergegeben und bewahrt das körperliche Bild.
- source_word: יֹרְדוֹת
  choice: führen hinab
  rationale: Das feminine Pluralpartizip bezeichnet eine anhaltende Abwärtsbewegung. Mit „führen hinab“ bleibt im Deutschen natürlich verständlich, dass der Weg der Frau zum Tod führt.
- source_word: מָוֶת
  choice: Tod
  rationale: Die direkte lexikalische Bedeutung wird bewahrt und nicht zu „Gefahr“ oder „Verderben“ abgeschwächt.
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die Transliteration bewahrt den eigenständigen althebräischen Begriff und vermeidet eine vorschnelle Gleichsetzung mit Grab oder Hölle.
- source_word: צְעָדֶיהָ
  choice: ihre Schritte
  rationale: Die konkrete Pluralform entspricht dem Parallelismus zu „ihre Füße“ und klingt im modernen Deutsch natürlich.
- source_word: יִתְמֹכוּ
  choice: halten … fest
  rationale: תמך bezeichnet Halten, Stützen oder Ergreifen. „halten am Scheol fest“ bewahrt hier das starke Bild einer festen Verbindung, ohne die ungewöhnliche hebräische Formulierung aufzulösen.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: das Grab; das Totenreich
  rationale: „Scheol“ erhält die theologische und kulturelle Spannung des hebräischen Begriffs und importiert weder eine rein körperliche Grabvorstellung noch eine spätere Lehre von der Hölle.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus zwischen „Füße“ und „Schritte“ sowie zwischen „Tod“ und „Scheol“ bleibt erhalten; die etwas markante Wendung „am Scheol festhalten“ spiegelt bewusst die Bildkraft und Mehrdeutigkeit des hebräischen Verbs.
