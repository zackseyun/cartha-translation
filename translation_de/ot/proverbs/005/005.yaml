  source_fidelity: Die erste Satzhälfte gibt die Bewegungsrichtung zutreffend wieder, aber „führen hinab“ macht die Füße zu Handelnden, die jemanden oder etwas hinabführen. Das hebräische Partizip יֹרְדוֹת bedeutet hier vielmehr „hinabsteigen/hingehen“. Die zweite Satzhälfte kann die bildhafte, im Deutschen bewusst markante Verbindung von Schritten und Scheol mit „an Scheol festhalten“ angemessen bewahren.
