  text: 'und du sagst[a]: »Wie habe ich die Erziehung gehasst, und mein Herz hat die Zurechtweisung verachtet!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und du wirst sagen«. Das hebräische Perfekt kann im Zusammenhang dieser Warnung eine zukünftige oder folgerichtige Aussage ausdrücken.'
