lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: und du sagst
  rationale: Das Qal Perfekt 2. Person maskulin Singular steht im Zusammenhang der väterlichen Warnung mit zukünftiger beziehungsweise folgerichtiger Bedeutung. Das Präsens vergegenwärtigt die spätere Klage; die Zukunftsübersetzung bleibt in der Fußnote erhalten.
- source_word: אֵיךְ
  choice: Wie
  rationale: Leitet hier keine Informationsfrage, sondern einen emotionalen Ausruf rückblickender Klage ein.
- source_word: שָׂנֵאתִי
  choice: habe ich … gehasst
  rationale: Das Qal Perfekt 1. Person Singular bezeichnet das rückblickende Eingeständnis. Das deutsche Perfekt klingt in direkter Rede natürlich und bewahrt die abgeschlossene Rückschau.
- source_word: מוּסָר
  choice: Zucht
  rationale: Bezeichnet im Sprüchebuch formende Unterweisung mit korrigierender und erzieherischer Kraft. „Zucht“ bewahrt diese Bedeutungsbreite in knapper, würdiger Sprache, auch wenn das Wort im heutigen Deutsch gehoben wirkt.
- source_word: וְתוֹכַחַת
  choice: und … Zurechtweisung
  rationale: Bezeichnet verbale Korrektur, Rüge oder Ermahnung. „Zurechtweisung“ ist gegenwärtig verständlich und gibt den korrigierenden Sinn präzise wieder.
- source_word: נָאַץ
  choice: hat … verachtet
  rationale: Das Verb drückt verächtliche Zurückweisung aus. „Verachtet“ entspricht seiner Stärke und bildet eine passende Parallele zu „gehasst“.
- source_word: לִבִּי
  choice: mein Herz
  rationale: Die wörtliche Wiedergabe bewahrt das hebräische Bild vom Herzen als innerem Zentrum des Denkens, Wollens und Entscheidens.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter poetischer Parallelität. „Zucht“ ist bewusst knapp und traditionsnah gewählt; „Zurechtweisung“ verdeutlicht den verbal korrigierenden zweiten Begriff. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt.
