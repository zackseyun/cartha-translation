  text: a loving doe[a], a graceful mountain goat—may her breasts satisfy you at all times[b]; be intoxicated always with her love.
translation:
  language: de
  text: Eine liebevolle Hirschkuh, eine anmutige Wildziege[a] – mögen ihre Brüste dich jederzeit sättigen; lass dich von ihrer Liebe stets hinreißen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine anmutige Steinziege“. Das hebräische Wort bezeichnet eine wilde Bergziege beziehungsweise einen weiblichen Steinbock.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich kann das hebräische Verb „irregehen“ oder „umherirren“ bedeuten. Hier beschreibt es positiv, dass jemand von der Liebe ganz ergriffen und fortgetragen wird; möglich ist auch: „Sei stets von ihrer Liebe berauscht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֶּלֶת אֲהָבִים
  choice: eine Hirschkuh voller Liebe
  rationale: אַיֶּלֶת bezeichnet eine weibliche Hirschart. Die Wendung אֲהָבִים verbindet das Tierbild mit Liebe und Zuneigung; „voller Liebe“ bewahrt diese Verbindung in natürlichem Deutsch, ohne festzulegen, ob vor allem ihre Liebenswürdigkeit oder ihre Zuneigung gemeint ist.
- source_word: וְיַעֲלַת חֵן
  choice: eine anmutige Wildziege
  rationale: יַעֲלָה bezeichnet eine wilde Bergziege beziehungsweise einen weiblichen Steinbock; חֵן trägt den Sinn von Anmut und Liebreiz. „Wildziege“ ist verständlich und erhält das eigenständige zweite Tierbild.
- source_word: דַּדֶּיהָ
  choice: ihre Brüste
  rationale: Das hebräische Wort bezeichnet konkret die Brüste. Der ehelich-erotische Zusammenhang rechtfertigt eine direkte Wiedergabe statt eines abschwächenden Euphemismus.
- source_word: יְרַוֻּךָ
  choice: mögen ... dich ... sättigen
  rationale: רוה bezeichnet, dass jemand reichlich getränkt, gesättigt oder erfüllt wird. „Sättigen“ gibt hier die volle sinnliche Befriedigung wieder und lässt die mögliche Trank- beziehungsweise Rauschassoziation im Hintergrund bestehen.
- source_word: בְכָל־עֵת
  choice: jederzeit
  rationale: Die Zeitangabe bedeutet wörtlich „zu jeder Zeit“ und wird mit „jederzeit“ knapp und idiomatisch wiedergegeben.
- source_word: בְאַהֲבָתָהּ
  choice: von ihrer Liebe
  rationale: Die Präposition ב kann hier den Bereich oder die Ursache des Ergriffenseins markieren. Im Deutschen verbindet „von ihrer Liebe“ die Liebe der Frau natürlich mit „hinreißen“.
- source_word: תִּשְׁגֶּה
  choice: lass dich ... hinreißen
  rationale: שׁגה bedeutet gewöhnlich „irregehen“ oder „umherirren“, wird hier jedoch positiv für ein überwältigendes Ergriffensein von ehelicher Liebe gebraucht. „Sich hinreißen lassen“ wahrt die Intensität, ohne einen Alkoholrausch ausdrücklich in den Text einzutragen.
- source_word: תָמִיד
  choice: stets
  rationale: Das Adverb bezeichnet fortdauernde oder wiederkehrende Beständigkeit; „stets“ passt zum würdevollen poetischen Register.
theological_decisions:
- issue: Erotische Bildsprache innerhalb der Ehe
  choice: Die konkrete sexuelle Bildsprache wird mit „ihre Brüste“ ausdrücklich beibehalten.
  alternative: Eine abschwächende Wiedergabe wie „ihr Busen“ oder eine Verallgemeinerung auf bloße Zuneigung.
  rationale: Im Zusammenhang warnt Sprüche 5 vor Ehebruch und empfiehlt die Freude an der eigenen Frau. Die ausdrückliche Körperlichkeit gehört zur Aussage des hebräischen Textes und darf nicht aus konfessioneller oder kultureller Zurückhaltung abgeschwächt werden.
- issue: Positive Verwendung eines sonst negativen Verbs
  choice: תִּשְׁגֶּה wird im Haupttext kontextgemäß positiv als „lass dich hinreißen“ wiedergegeben; die ungewöhnliche Grundbedeutung wird in einer Fußnote offengelegt.
  alternative: Wörtlich „irre stets in ihrer Liebe umher“ oder stärker deutend „sei von ihrer Liebe berauscht“.
  rationale: Der Kontext verlangt eine positive Aufforderung, doch die Spannung zur üblichen Bedeutung „irregehen“ ist literarisch bedeutsam. Haupttext und Fußnote bewahren gemeinsam Verständlichkeit und Mehrdeutigkeit.
translation_notes:
  register: Moderne, würdige und poetische Standardsprache. Die zwei Tierbilder bleiben voneinander unterschieden, die ehelich-erotische Aussage bleibt ausdrücklich, und die ungewöhnliche positive Verwendung von שׁגה wird nicht verdeckt.
