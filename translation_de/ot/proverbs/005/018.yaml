id: PRO.5.18
reference: Proverbs 5:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהִֽי מְקוֹרְ/ךָ֥ בָר֑וּךְ וּ֝/שְׂמַ֗ח מֵ/אֵ֥שֶׁת נְעוּרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/018.yaml
  text: Let your fountain be blessed[a], and rejoice in the wife of your youth.
translation:
  language: de
  text: Deine Quelle sei gesegnet[a], und freue dich an der Frau deiner Jugend!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dein Quell sei gesegnet.« Das Hebräische führt das Wasserbild fort und kann sowohl den Ursprung des Lebens als auch eheliche Fruchtbarkeit anklingen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: sei
  rationale: Der Jussiv von היה drückt hier Wunsch und Aufforderung aus; der deutsche Konjunktiv »sei« gibt diese knappe, würdige Form natürlich wieder.
- source_word: מְקוֹרְךָ
  choice: deine Quelle
  rationale: מָקוֹר bezeichnet eine Quelle bzw. einen Wasserquell. »Quelle« bewahrt das Wasserbild und lässt zugleich den möglichen Bezug auf Lebensursprung und eheliche Fruchtbarkeit offen.
- source_word: בָרוּךְ
  choice: gesegnet
  rationale: Die direkte Wiedergabe wahrt sowohl den allgemeinen Sinn göttlicher Begünstigung als auch den weisheitlichen Klang, ohne die konkrete Art des Segens festzulegen.
- source_word: וּשְׂמַח
  choice: und freue dich
  rationale: Der Imperativ fordert positiv zu ehelicher Freude auf; »freue dich« ist gegenwärtiges, verständliches und dennoch würdevolles Deutsch.
- source_word: מֵאֵשֶׁת
  choice: an der Frau
  rationale: מן nach שׂמח kann die Quelle beziehungsweise den Gegenstand der Freude bezeichnen. »Sich an jemandem freuen« ist im Deutschen idiomatisch und bewahrt diesen Spielraum.
- source_word: נְעוּרֶיךָ
  choice: deiner Jugend
  rationale: »Frau deiner Jugend« bezeichnet die Frau, die der Mann in jungen Jahren geheiratet hat, und gibt die feste hebräische Wendung knapp wieder.
theological_decisions:
- issue: Bedeutungsumfang des Quellenbildes
  choice: Das Bild wird als »Quelle« beibehalten und nicht im Haupttext erklärt.
  alternative: Explizite Deutung als Ehefrau, Sexualität, Nachkommenschaft oder Fruchtbarkeit.
  rationale: Der Kontext legt eheliche Sexualität und möglicherweise Fruchtbarkeit nahe, doch das hebräische Bild bleibt mehrdeutig. Eine ausdrückliche Festlegung würde die poetische und theologische Spannung unnötig auflösen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit knapper weisheitlicher Würde. Der Parallelismus aus Wunsch/Aufforderung und Imperativ bleibt erhalten; das Wasserbild wird nicht paraphrasiert.
