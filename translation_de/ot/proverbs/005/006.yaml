source:
  edition: WLC
  text: אֹ֣רַח חַ֭יִּים פֶּן תְּפַלֵּ֑ס נָע֥וּ מַ֝עְגְּלֹתֶ֗י/הָ לֹ֣א תֵדָֽע־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/006.yaml
  text: Lest she should level the path of life[a], her tracks wander[b]; she does not know it.
translation:
  language: de
  text: Damit du nicht etwa über den Weg des Lebens nachdenkst, schwanken ihre Pfade hin und her; du bemerkst es nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Damit sie den Weg des Lebens nicht ebnet, schwanken ihre Pfade hin und her; sie erkennt es nicht.« Die hebräische Form von »ebnet/bedenkt« kann auch die Frau meinen; die Vokalisierung des Schlussverbs lautet jedoch »du erkennst es nicht«.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֹרַח חַיִּים
  choice: der Weg des Lebens
  rationale: אֹרַח bezeichnet einen Weg oder Pfad; die Genitivverbindung bewahrt das konkrete Wegbild und lässt offen, ob das Leben Ziel oder Kennzeichen dieses Weges ist.
- source_word: פֶּן
  choice: damit … nicht
  rationale: פֶּן leitet gewöhnlich eine befürchtete oder verhinderte Möglichkeit ein. Die deutsche Wendung gibt diese negative Ziel- oder Vermeidungsaussage wieder, ohne den schwierigen Satzbau aufzulösen.
- source_word: תְּפַלֵּס
  choice: ebnet
  rationale: Das Piel von פלס kann das Abwägen, Prüfen oder Ebnen eines Weges bezeichnen. »Ebnet« bewahrt hier das durchgehende Wegbild; die Deutung »bedenkt« wird in der Fußnote genannt.
- source_word: נָעוּ
  choice: geraten … ins Schwanken
  rationale: Das Verb bezeichnet eine taumelnde, unstete oder hin und her gehende Bewegung. Die Formulierung macht die Unbeständigkeit der Bahnen verständlich und wahrt das Bewegungsbild.
- source_word: מַעְגְּלֹתֶיהָ
  choice: ihre Bahnen
  rationale: מַעְגָּל bezeichnet eine Bahn, Spur oder einen Pfad. »Bahnen« unterscheidet den Ausdruck von אֹרַח und erhält zugleich die Wegmetaphorik.
- source_word: לֹא תֵדָע
  choice: sie erkennt es nicht
  rationale: Die Verbform kann morphologisch als 3. Person feminin Singular oder als 2. Person maskulin Singular verstanden werden. Der Zusammenhang von Vers 3–6 legt die Frau als Subjekt nahe; das implizite Objekt wird im Deutschen mit »es« ausgedrückt.
theological_decisions:
- issue: Bezug des Schlussverbs לֹא תֵדָע
  choice: 'Die Aussage beschreibt weiterhin die Frau: »sie erkennt es nicht«.'
  alternative: 'Der Angeredete ist gemeint: »du erkennst es nicht«.'
  rationale: Der unmittelbare Zusammenhang beschreibt die Frau in der dritten Person feminin. Da dieselbe hebräische Konsonantenform jedoch auch als zweite Person maskulin gelesen werden kann, bleibt die alternative Anrede in einer Fußnote erhalten.
- issue: Verhältnis von פֶּן zu תְּפַלֵּס
  choice: Negative Vermeidungsaussage mit der bildlichen Bedeutung »ebnen«
  alternative: 'Feststellung: »Sie bedenkt den Weg des Lebens nicht; ihre Pfade schwanken.«'
  rationale: Der knappe hebräische Satz lässt sowohl die gewöhnliche Funktion von פֶּן als »damit nicht/auf dass nicht« mit der Wegmetapher als auch eine stärker reflektierende Deutung von פלס zu. Die Hauptfassung folgt der formalen Wegbild-Lesart, die Alternative wird dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das wiederkehrende Wegbild wird mit »Weg«, »ebnet« und »Bahnen« erhalten. »Geraten … ins Schwanken« ist idiomatischer als ein wörtliches »wandern« und vermittelt die im Verb liegende Unstetigkeit. Die zwei echten syntaktisch-lexikalischen Mehrdeutigkeiten werden nicht stillschweigend beseitigt, sondern in Fußnoten ausgewiesen.
