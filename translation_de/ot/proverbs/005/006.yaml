- from: Damit sie den Weg des Lebens nicht ebnet,[a] geraten ihre Bahnen ins Schwanken; sie erkennt es nicht.[b]
  to: Damit du nicht etwa über den Weg des Lebens nachdenkst, schwanken ihre Pfade hin und her; du bemerkst es nicht.[a]
  rationale: Die Revision gibt die im WLC vokalisierte zweite Person im Schlussglied im Haupttext wieder und hält die kontextuell mögliche feminine Gesamtlesung in einer einzigen, klar zugeordneten Fußnote fest. „Über den Weg des Lebens nachdenkst“ gibt die erwägende Bedeutung von פלס idiomatisch wieder; die alternative Bedeutung „ebnet“ bleibt erhalten. Die Formulierung „schwanken ... hin und her“ ist natürliches modernes Standarddeutsch und bewahrt die Bildsprache.
