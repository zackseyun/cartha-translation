  terminology: »Vergehen«, »Frevler«, »Stricke« und »Sünde« sind semantisch angemessen. Die Fußnote soll keine zusätzliche Aussage von der »eigenen Sünde« einführen, wenn der Text lediglich »seiner Sünde« sagt.
