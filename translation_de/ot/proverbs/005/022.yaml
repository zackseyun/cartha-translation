source:
  edition: WLC
  text: עַֽווֹנוֹתָ֗י/ו יִלְכְּדֻ/נ֥וֹ אֶת הָ/רָשָׁ֑ע וּ/בְ/חַבְלֵ֥י חַ֝טָּאת֗/וֹ יִתָּמֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/022.yaml
  text: His iniquities will capture the wicked man[b][a], and he will be held fast in the cords of his sin.
translation:
  language: de
  text: Seine Vergehen fangen ihn, den Frevler, ein, und in den Stricken seiner Sünde wird er festgehalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »wird er gehalten«; im Zusammenhang ist gemeint, dass die Stricke seiner Sünde ihn festhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַוּוֹנוֹתָיו
  choice: seine eigenen Vergehen
  rationale: Der Plural von עָוֹן bezeichnet schuldhafte Verfehlungen. »Vergehen« bewahrt das moralische Gewicht; »eigenen« verdeutlicht die im Hebräischen durch das Suffix ausgedrückte Rückwirkung auf den Täter.
- source_word: יִלְכְּדֻנוֹ
  choice: fangen … ein
  rationale: לכד bezeichnet das Fangen oder Ergreifen. Die deutsche Wendung bewahrt das anschauliche Bild des Gefangenwerdens.
- source_word: הָרָשָׁע
  choice: den Frevler
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular und bezeichnet hier den schuldhaft handelnden Menschen. »Frevler« ist knapp, würdig und im deutschen Weisheitsstil verständlich.
- source_word: וּבְחַבְלֵי
  choice: und in den Stricken
  rationale: חֶבֶל kann Strick, Seil oder Fessel bedeuten. »Stricke« setzt das Bild des Einfangens und Festhaltens natürlich fort.
- source_word: חַטָּאתוֹ
  choice: seiner Sünde
  rationale: Der Singular wird beibehalten und kann die Sünde zusammenfassend als Macht beziehungsweise als eigenes schuldhaftes Tun bezeichnen.
- source_word: יִתָּמֵךְ
  choice: wird er festgehalten
  rationale: Der Nifal wird passiv wiedergegeben. Im Parallelismus meint תמך hier, von den Stricken ergriffen und nicht losgelassen zu werden, nicht »gestützt werden«.
theological_decisions:
- issue: Bild moralischer Selbstverstrickung
  choice: Die eigenen Vergehen des Frevlers sind das Mittel, durch das er eingefangen und festgehalten wird.
  alternative: Eine verallgemeinerte Aussage über die Folgen des Unrechts ohne das personifizierende Fangbild.
  rationale: Subjekt des ersten Halbverses sind seine Vergehen; der zweite nennt die Stricke seiner Sünde. So bleibt die Aussage erhalten, dass das eigene Unrecht den Täter bindet, ohne die Art göttlichen Gerichts oder menschlicher Willensfreiheit näher festzulegen.
- issue: Maskuliner Singular von הָרָשָׁע
  choice: den Frevler
  alternative: den Gottlosen; den bösen Menschen
  rationale: »Frevler« bildet den substantivierten maskulinen Singular knapp ab. Der Spruch hat zugleich exemplarischen Charakter; die Übersetzung macht daraus jedoch nicht ausdrücklich eine geschlechtsneutrale Mehrzahl.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der prägnanten Bildsprache eines Weisheitsspruchs. »Frevler« und »Stricke« sind leicht gehoben, aber allgemein verständlich. Der Fußnotenmarker steht im Haupttext.
