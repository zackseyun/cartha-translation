  text: Should your springs be scattered abroad[b][a], streams of water in the streets?
translation:
  language: de
  text: Sollen sich deine Quellen nach draußen zerstreuen[a], deine Wasserläufe auf den Straßen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Lass deine Quellen sich nach draußen zerstreuen, deine Wasserläufe auf den Straßen.“ Die hebräische Verbform kann als Aufforderung verstanden werden; der Zusammenhang spricht jedoch stark für eine rhetorische Frage.'
    reason: alternative_reading
  - marker: b
    text: Das Wasserbild bezieht sich im Zusammenhang von Sprüche 5,15–18 wahrscheinlich auf sexuelle Zeugungskraft und Nachkommen. Es unterstreicht, dass sie nicht Fremden, sondern der Ehe vorbehalten sein sollen.
    reason: cross_reference
lexical_decisions:
- source_word: יָפ֣וּצוּ
  choice: sollen … strömen
  rationale: Das Qal von פוץ bezeichnet ein Sich-Ausbreiten oder Zerstreutwerden. Im Deutschen verbindet „strömen“ dieses Ausbreiten natürlich mit dem Wasserbild; die Frageform gibt im Zusammenhang den mahnenden rhetorischen Sinn wieder.
- source_word: מַעְיְנֹתֶיךָ
  choice: deine Quellen
  rationale: מַעְיָן bezeichnet eine Quelle oder einen Quell. „Quellen“ ist verständlich und bewahrt das poetische Wasserbild.
- source_word: חוּצָה
  choice: nach draußen
  rationale: Das Adverb bezeichnet eine Bewegung nach außen. „Nach draußen“ gibt diese Richtung in modernem Deutsch klar wieder.
- source_word: בָּרְחֹבוֹת
  choice: auf die Straßen
  rationale: רְחֹבוֹת kann breite öffentliche Plätze oder Straßen bezeichnen. „Auf die Straßen“ bildet einen natürlichen Gegensatz zum privaten, ehelichen Bereich des Zusammenhangs.
- source_word: פַּלְגֵי מָיִם
  choice: Wasserbäche
  rationale: פֶּלֶג bezeichnet einen Wasserlauf, Kanal oder Bach. „Wasserbäche“ erhält die poetische Parallele zu „Quellen“ und ist unmittelbar verständlich.
theological_decisions:
- issue: Aussage, Aufforderung oder rhetorische Frage innerhalb der Mahnung zur ehelichen Treue
  choice: 'Rhetorische Frage: „Sollen deine Quellen …?“'
  alternative: 'Aufforderung: „Lass deine Quellen nach draußen strömen …“; oder Aussagesatz'
  rationale: Die unmarkierte hebräische Form lässt formal mehrere Satzfunktionen zu. Im Zusammenhang von Sprüche 5,15–17, besonders angesichts der Forderung, dass die Wasser dem Angesprochenen allein gehören sollen, passt eine rhetorische Frage am besten zum mahnenden Gedankengang.
- issue: Bedeutung des Wasserbildes
  choice: Das Bild unaufgelöst im Haupttext bewahren und seine sexuelle beziehungsweise nachkommenschaftliche Dimension in einer Fußnote erläutern
  alternative: Die Metapher im Haupttext ausdrücklich mit Sexualität oder Nachkommen wiedergeben
  rationale: Der hebräische Text spricht poetisch von Quellen und Wasserläufen. Eine erklärende Auflösung im Haupttext würde die Bildsprache und ihre gewisse Bedeutungsweite unnötig verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Parallelstruktur und das Wasserbild des Hebräischen bleiben erhalten. Die nicht ausdrücklich markierte Frage wird kontextgemäß als rhetorische Frage wiedergegeben; die formale Alternative steht in der Fußnote.
