  text: My son[a], pay attention to my wisdom; incline your ear to my understanding[b],
translation:
  language: de
  text: Mein Sohn, achte auf meine Weisheit; neige dein Ohr meiner Einsicht zu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die Anrede ist im Hebräischen grammatisch männlich und singularisch; „Mein Sohn“ gibt die Vater-Lehrer-Anrede genau und natürlich wieder.
- source_word: לְחָכְמָתִי
  choice: auf meine Weisheit
  rationale: חָכְמָה bezeichnet hier „Weisheit“. Zusammen mit הַקְשִׁיבָה verlangt idiomatisches Deutsch die Verbindung „auf … achten“.
- source_word: הַקְשִׁיבָה
  choice: achte
  rationale: Der Imperativ bezeichnet aufmerksames Hören. „Achte auf“ ist modernes, natürliches Deutsch und bewahrt diesen Nachdruck.
- source_word: לִתְבוּנָתִי
  choice: meinem Verständnis
  rationale: תְּבוּנָה kann Verständnis, Einsicht oder Urteilsvermögen bezeichnen. „Verständnis“ bewahrt die abstrakte Substantivform und lässt die Bedeutungsbreite weitgehend offen.
- source_word: הַט
  choice: neige … zu
  rationale: Der Imperativ von נטה bildet mit „Ohr“ ein bildhaftes Idiom für aufmerksames Zuhören. „Neige dein Ohr … zu“ erhält dieses Bild.
- source_word: אָזְנֶךָ
  choice: dein Ohr
  rationale: Der hebräische Text steht im Singular; die deutsche Form bewahrt diese konkrete Bildsprache.
