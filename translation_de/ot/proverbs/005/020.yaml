  text: וְ/לָ֤/מָּה תִשְׁגֶּ֣ה בְנִ֣/י בְ/זָרָ֑ה וּ֝/תְחַבֵּ֗ק חֵ֣ק נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/020.yaml
  text: Why[a], my son[b], should you go astray with a strange woman and embrace the bosom of a foreign woman?
translation:
  language: de
  text: Warum solltest du, mein Sohn, dich an einer fremden Frau berauschen[a] und den Busen einer Fremden umarmen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei einer fremden Frau in die Irre gehen“. Das hebräische Verb kann Abirren bezeichnen und lässt hier zugleich die Nuance des Berauscht- oder Gefesseltseins anklingen.'
    reason: lexical_alternative
  - marker: b
    text: „Busen“ gibt ein hebräisches Wort wieder, das auch „Schoß“ bedeuten kann. Die beiden Bezeichnungen für die Frau meinen im Zusammenhang eine Frau außerhalb der rechtmäßigen ehelichen Bindung, nicht notwendig eine Frau anderer Herkunft.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: Warum ... solltest du
  rationale: Die rhetorische Frage enthält eine eindringliche Warnung; „solltest du“ gibt diesen mahnenden Ton im Deutschen natürlich wieder.
- source_word: תִשְׁגֶּה
  choice: dich ... verlieren
  rationale: Das Verb kann ein Abirren oder Sich-Versteigen bezeichnen und im Zusammenhang auch Verblendung oder leidenschaftliche Hingabe anklingen lassen. Die deutsche Wendung wahrt sowohl die moralische als auch die emotionale Dimension.
- source_word: בְנִי
  choice: mein Sohn
  rationale: Die Form enthält das Suffix der ersten Person Singular und bewahrt die väterliche Lehrrede des Sprüchebuchs.
- source_word: זָרָה
  choice: eine fremde Frau
  rationale: Im Kontext bezeichnet der Ausdruck eine Frau außerhalb der legitimen ehelichen Bindung, nicht einfach eine ethnisch fremde Frau. „Fremde Frau“ bewahrt die Bildsprache und lässt die relationale Bedeutung zu.
- source_word: תְחַבֵּק
  choice: umarmen
  rationale: Dies ist die direkte und im intimen Zusammenhang passende Wiedergabe des Verbs.
- source_word: חֵק
  choice: Schoß
  rationale: Das Substantiv kann Brustbereich oder Schoß bezeichnen. „Schoß“ erhält das konkrete Bild einer intimen Umarmung, ohne unnötig zu präzisieren.
- source_word: נָכְרִיָּה
  choice: Unbekannte
  rationale: Der Ausdruck bezeichnet eine nicht zugehörige, außenstehende Frau. „Unbekannte“ unterscheidet ihn im Deutschen von זָרָה und vermeidet eine vorrangig ethnische Deutung.
theological_decisions:
- issue: Wiedergabe der parallelen Bezeichnungen זָרָה und נָכְרִיָּה
  choice: „fremde Frau“ und „Unbekannte“
  alternative: „verbotene Frau“ und „Ausländerin“
  rationale: Die Warnung betrifft eine unerlaubte sexuelle Beziehung und nicht in erster Linie die ethnische Herkunft. Die gewählte Formulierung bewahrt zugleich die beiden unterschiedlichen hebräischen Wörter und ihre parallele Bedeutung.
- issue: Bedeutungsumfang von שׁגה im unmittelbaren Zusammenhang
  choice: „sich an jemanden verlieren“
  alternative: „abirren“, „taumeln“ oder „sich berauschen“
  rationale: Der Kontext verbindet moralisches Abirren mit erotischer Faszination. Die gewählte Wendung hält beide Aspekte offen, statt nur einen davon festzulegen.
translation_notes:
  register: Moderne, würdevolle Lehrsprache mit direkter Anrede. Die rhetorische Frage bleibt knapp und eindringlich; die sinnliche Bildsprache wird konkret, aber nicht derb wiedergegeben.
