translation:
  language: de
  text: und du stöhnst[a] am Ende[b], wenn dein Fleisch und dein Leib dahinschwinden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jammerst“; das hebräische Verb bezeichnet einen hörbaren Laut tiefer Bedrängnis.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an deinem Lebensende“ beziehungsweise „bei deinem schließlichen Ausgang“; das Hebräische kann sowohl das Ende des Lebens als auch das endgültige Ergebnis des eingeschlagenen Weges meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהַמְתָּ
  choice: und du … stöhnst
  rationale: Das Verb נהם bezeichnet einen hörbaren, tiefen Laut der Bedrängnis. „Stöhnen“ gibt den schmerzlichen Ausdruck im Deutschen natürlich wieder, ohne die mögliche Tierlaut-Bildlichkeit von „brüllen“ zu stark hervorzukehren.
- source_word: בְאַחֲרִיתֶךָ
  choice: am Ende
  rationale: אַחֲרִית kann das Lebensende ebenso wie den schließlichen Ausgang eines Weges bezeichnen. „Am Ende“ bewahrt diese knappe Mehrdeutigkeit.
- source_word: בִּכְלוֹת
  choice: wenn … dahinschwinden
  rationale: Der Infinitiv von כלה bezeichnet hier den begleitenden bzw. zeitlichen Umstand des Aufgebraucht- oder Verzehrtwerdens. Bei Körperbegriffen vermittelt „dahinschwinden“ den körperlichen Verfall in natürlichem Deutsch.
- source_word: בְּשָׂרְךָ
  choice: dein Fleisch
  rationale: „Fleisch“ entspricht der konkreten Grundbedeutung von בשר und hält den Ausdruck vom parallelen שאר unterschieden.
- source_word: וּשְׁאֵרֶךָ
  choice: und dein Leib
  rationale: שאר bezeichnet hier parallel zu „Fleisch“ den leiblichen Bestand bzw. Körper. „Leib“ ist würdevoll und erhält die zwei unterschiedlichen hebräischen Begriffe, ohne unnatürlich zu klingen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitsliteratur-Ton. Die knappe Mehrdeutigkeit von „am Ende“ bleibt erhalten; „Fleisch und Leib“ bildet die körperbezogene hebräische Wortpaarung ab.
