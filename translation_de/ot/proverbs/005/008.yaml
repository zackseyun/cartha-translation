  yaml_path: translation/ot/proverbs/005/008.yaml
  text: Keep your way far from her[a], and do not go near the entrance of her house.
translation:
  language: de
  text: Halte deinen Weg weit von ihr[a] fern und nähere dich nicht dem Eingang ihres Hauses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Halte dich von ihr fern und nähere dich nicht der Türöffnung ihres Hauses.“'
    reason: 'Lexikalische Alternative: Der Imperativ הַרְחֵק kann idiomatisch als Aufforderung zum Fernbleiben wiedergegeben werden; פֶּתַח kann „Türöffnung“ bedeuten.'
lexical_decisions:
- source_word: הַרְחֵק
  choice: Halte … fern
  rationale: Der Hifil-Imperativ von רחק fordert dazu auf, Abstand herzustellen bzw. zu wahren. Mit „deinen Weg“ als Objekt bewahrt „Halte … fern“ sowohl die Befehlsform als auch das Wegbild.
- source_word: מֵעָלֶיהָ
  choice: von ihr
  rationale: Die Präposition bezeichnet hier die Trennung von ihrer Nähe oder ihrem Einflussbereich. Die räumliche Distanz wird bereits durch „fern“ ausgedrückt.
- source_word: דַרְכֶּךָ
  choice: deinen Weg
  rationale: דֶּרֶךְ kann einen tatsächlichen Weg wie auch den Lebenswandel bezeichnen. „Deinen Weg“ erhält diese für die Weisheitsliteratur typische Bildsprache und ihre Offenheit.
- source_word: וְאַל תִּקְרַב
  choice: und nähere dich nicht
  rationale: Die verneinte Verbform drückt ein Verbot aus. „Nähere dich nicht“ gibt die Bewegung auf das Haus zu in natürlichem, würdigem Deutsch wieder.
- source_word: אֶל פֶּתַח
  choice: dem Eingang
  rationale: פֶּתַח bezeichnet Öffnung, Eingang oder Türöffnung. „Eingang“ ist räumlich konkret, ohne das Wort unnötig auf ein bestimmtes Türblatt zu verengen.
- source_word: בֵּיתָהּ
  choice: ihres Hauses
  rationale: בַּיִת bedeutet hier konkret „Haus“. Der Genitiv fügt sich im Deutschen natürlich an „Eingang“ an.
