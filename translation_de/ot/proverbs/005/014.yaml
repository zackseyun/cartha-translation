    issue: Die Verbkonstruktion „wäre ich … geraten“ ersetzt den stativen Rückblick „ich war“ durch einen Eintrittsvorgang.
    rationale: Das hebräische הָיִיתִי ist schlicht „ich war“. Ein idiomatisches deutsches Umschreiben darf nicht ohne Not die Blickrichtung der Aussage verändern.
  - severity: medium
    issue: „in alles Böse geraten“ ist unidiomatisch.
    rationale: Die Verbindung wirkt im Deutschen semantisch unscharf und legt zudem nahe, der Sprecher sei in einzelne böse Handlungen oder Versuchungen hineingeraten. „in allem Bösen“ bildet die ungewöhnlich weite hebräische Formulierung genauer ab.
