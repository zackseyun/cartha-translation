  text: I was almost in every kind of evil in the midst of the assembly and congregation[a].
translation:
  language: de
  text: Beinahe war ich mitten in der Versammlung und der Gemeinde in allem Bösen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beinahe wäre ich mitten in der Versammlung und der Gemeinde völlig ins Unglück geraten.“ Die knappe hebräische Wendung kann umfassendes moralisches Böses oder völliges Unheil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: beinahe
  rationale: Mit הָיִיתִי bezeichnet das Wort hier nicht eine kurze Zeitspanne, sondern die Nähe zu einem Zustand oder Ausgang. „Beinahe“ gibt dies im modernen Deutschen natürlich wieder.
- source_word: הָיִיתִי
  choice: wäre ich … geraten
  rationale: Die wörtliche Form „war ich“ klingt mit der folgenden Präpositionalfügung im Deutschen unnatürlich. Die Konstruktion mit „wäre … geraten“ bringt den rückblickend beschriebenen Beinahe-Zustand idiomatisch zum Ausdruck.
- source_word: בְכָל רָע
  choice: in alles Böse
  rationale: Die knappe Wendung kann umfassendes moralisches Böses oder vollständiges Unheil beziehungsweise Verderben meinen. Die Haupttextfassung bewahrt den moralischen Sinn und die umfassende Aussage, ohne sie auf eine bestimmte Tat einzuengen; die mögliche Bedeutung „völliges Verderben“ wird in der Fußnote genannt.
- source_word: בְּתוֹךְ
  choice: mitten in
  rationale: „Mitten in“ erhält sowohl den räumlichen beziehungsweise sozialen Sinn als auch den Nachdruck der öffentlichen Umgebung.
- source_word: קָהָל וְעֵדָה
  choice: Versammlung und Gemeinde
  rationale: Die beiden nahezu synonymen hebräischen Begriffe werden nicht zusammengezogen. So bleibt der verstärkende Hinweis auf die versammelte Öffentlichkeit erhalten.
theological_decisions:
- issue: Moralisches Böses oder katastrophales Verderben
  choice: Der Haupttext gibt רָע als „Böse“ wieder.
  alternative: „Beinahe wäre ich völlig ins Verderben geraten“
  rationale: Der Zusammenhang des Kapitels trägt die moralische Lesart, doch die hebräische Wendung kann ebenso den verheerenden Ausgang bezeichnen. Diese Spannung wird nicht stillschweigend aufgelöst, sondern in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas markante Formulierung „in alles Böse geraten“ bewahrt die ungewöhnliche Weite und Mehrdeutigkeit des Hebräischen; „Versammlung und Gemeinde“ erhält das hebräische Begriffspaar und den öffentlichen Schauplatz.
