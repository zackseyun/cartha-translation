review_pass:
  verdict: revise
  source_fidelity: 'Der hebräische Text ist im Entwurf weitgehend zutreffend wiedergegeben: Das volitive Imperfekt („Sie sollen“) sowie die exklusive Zuordnung („dir allein“) und der Ausschluss von זָרִים sind erfasst. Die Wendung „und nicht Fremden zusammen mit dir“ bildet jedoch die hebräische Existenzverneinung וְאֵין ... אִתָּךְ nicht idiomatisch und syntaktisch unvollständig ab. Gemeint ist, dass keine Fremden daran Anteil haben bzw. es nicht mit ihnen geteilt wird.'
  naturalness: „Sie sollen dir allein gehören“ ist klares modernes Deutsch. Der zweite Teil benötigt ein finites Verb; „und nicht mit Fremden geteilt werden“ ist natürlich, präzise und bewahrt die metaphorische Offenheit.
  terminology: „Fremde“ ist für זָרִים im weisheitlichen und ehelichen Kontext angemessen, ohne fälschlich ethnische Fremdheit zu behaupten. Die Fußnote kann den Kontext der ehelichen Ausschließlichkeit erläutern, sollte aber nicht behaupten, der Vers betone ausdrücklich etwas, das sich als Kontextdeutung ergibt.
