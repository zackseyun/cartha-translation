    rationale: „und nicht Fremden zusammen mit dir“ enthält kein Prädikat und lässt die Beziehung von „Fremden“ zu dem Gemeinten offen. Das Hebräische schließt Fremde von der Teilhabe aus; „und nicht mit Fremden geteilt werden“ drückt dies idiomatisch aus.
  - severity: low
    issue: Fußnote wiederholt die notwendige Haupttextkorrektur als bloße Alternative
    rationale: Die Formulierung „nicht mit Fremden geteilt werden“ ist keine bloß optionale lexikalische Alternative, sondern erforderlich, um die zweite Satzhälfte grammatisch und semantisch vollständig wiederzugeben.
