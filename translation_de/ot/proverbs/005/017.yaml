  text: יִֽהְיוּ לְ/ךָ֥ לְ/בַדֶּ֑/ךָ וְ/אֵ֖ין לְ/זָרִ֣ים אִתָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/017.yaml
  text: Let them be for you alone[a], and not for strangers with you.
translation:
  language: de
  text: Sie sollen dir allein gehören und nicht mit Fremden geteilt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִהְיוּ
  choice: Sie sollen … gehören
  rationale: Der Qal-Imperfekt steht im mahnenden Zusammenhang mit volitivem Sinn. Die deutsche Formulierung mit „sollen“ gibt diesen Aufforderungscharakter natürlich wieder.
- source_word: לְךָ
  choice: dir … gehören
  rationale: Die Präposition ל mit Suffix bezeichnet hier Zugehörigkeit beziehungsweise ausschließlichen Nutzen; „dir gehören“ ist idiomatisches Deutsch.
- source_word: לְבַדֶּךָ
  choice: allein
  rationale: 'Die adverbiale Wendung bezeichnet Ausschließlichkeit: nur dem Angesprochenen, nicht anderen.'
- source_word: וְאֵין
  choice: und nicht
  rationale: Die Existenzverneinung bildet den negativen Gegenpart zur ersten Vershälfte. Im Deutschen lässt sie sich knapp und sinngerecht mit „und nicht“ wiedergeben.
- source_word: לְזָרִים
  choice: Fremden
  rationale: זָרִים meint im Kontext Personen außerhalb der ehelichen Bindung, nicht speziell ethnische Ausländer. „Fremde“ bewahrt die Breite und Bildsprache des Hebräischen.
- source_word: אִתָּךְ
  choice: zusammen mit dir
  rationale: Die Präposition drückt Gemeinschaft beziehungsweise Teilhabe aus. „Zusammen mit dir“ macht deutlich, dass Fremde daran keinen Anteil haben sollen.
theological_decisions:
- issue: Ausschließlichkeit im Bild von Quellen und Wasserläufen
  choice: Die Bildsprache wird beibehalten und als ausschließliche Zugehörigkeit formuliert.
  alternative: Die Metapher ausdrücklich als eheliche Treue auflösen.
  rationale: Der unmittelbare Kontext zielt auf eheliche Treue, doch der Vers selbst führt die Wasserbildsprache fort. Die Übersetzung soll diese Spannung nicht durch eine erklärende Paraphrase beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fremde“ erhält die metaphorische Offenheit des Weisheitstextes; die Fußnote erläutert den ehelichen Zusammenhang, ohne ihn in den Haupttext hineinzutragen.
