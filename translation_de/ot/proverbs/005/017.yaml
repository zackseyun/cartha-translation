  rationale: Der Haupttext wird nur in der zweiten Satzhälfte ergänzt, damit die im Hebräischen ausgedrückte Ausschließlichkeit vollständig und in natürlichem Standarddeutsch wiedergegeben ist. Die Fußnote entfällt, weil ihre Alternative nun die erforderliche Übersetzung ist; der eheliche Bezug ergibt sich aus dem Kontext und muss hier nicht als textkritische oder lexikalische Anmerkung markiert werden.
