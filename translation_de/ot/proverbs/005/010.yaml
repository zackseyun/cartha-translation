translation:
  language: de
  text: Sonst sättigen sich Fremde von deiner Kraft[a], und deine Mühen gelangen in das Haus eines Fremden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann sowohl „satt werden“ als auch „sich füllen“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und deine Mühen im Haus eines Fremden [sind]“. Im Hebräischen ist im zweiten Satzteil kein Verb ausgedrückt. „Mühen“ kann auch den Ertrag der Arbeit oder mühsam erworbenen Besitz bezeichnen.'
    reason: supplied_words; lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: damit … nicht
  rationale: Leitet die unerwünschte Folge ein, vor der die vorausgehende Mahnung bewahren soll; im Deutschen ist diese Form natürlicher als ein isoliertes „sonst“.
- source_word: יִשְׂבְּעוּ
  choice: sich sättigen
  rationale: Gibt die Grundbedeutung „satt werden, sich füllen“ wieder und bewahrt das Bild, dass andere auf Kosten des Angesprochenen ihren Bedarf decken.
- source_word: זָרִים
  choice: Fremde
  rationale: Bezeichnet Personen außerhalb des eigenen Beziehungs- und Lebenskreises und wahrt zugleich die Parallelität mit נָכְרִי.
- source_word: כֹּחֶךָ
  choice: deine Kraft
  rationale: Bewahrt die breite Bedeutung von Kraft, Leistungsfähigkeit und verfügbaren Mitteln, ohne sie vorschnell auf Geld oder Besitz zu verengen.
- source_word: וַעֲצָבֶיךָ
  choice: deine mühsame Arbeit
  rationale: Gibt die mit Mühe und Beschwer verbundene Arbeit wieder; der mögliche Bezug auf deren Ertrag wird in einer Fußnote offengehalten.
- source_word: בְּבֵית נָכְרִי
  choice: in das Haus eines Fremden gelangt
  rationale: Das Hebräische enthält hier keinen ausdrücklichen zweiten Verbalsatz. „Gelangt“ macht die im Warnzusammenhang gemeinte Übertragung in einen fremden Haushalt natürlich verständlich.
