  text: ה֗וּא יָ֭מוּת בְּ/אֵ֣ין מוּסָ֑ר וּ/בְ/רֹ֖ב אִוַּלְתּ֣/וֹ יִשְׁגֶּֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/023.yaml
  text: He dies for lack of discipline[a], and in the abundance of his folly he goes astray.
translation:
  language: de
  text: Er stirbt aus Mangel an Zurechtweisung[a], und in seiner großen Torheit geht er in die Irre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wird ohne Zurechtweisung sterben und in seiner großen Torheit in die Irre gehen.“'
    reason: Das hebräische Imperfekt kann als allgemeine Aussage im Präsens oder als gewisse zukünftige Folge verstanden werden; בְּאֵין kann sowohl kausal („aus Mangel an“) als auch umstandsbezogen („ohne“) wiedergegeben werden.
lexical_decisions:
- source_word: יָמוּת
  choice: stirbt
  rationale: Das Qal-Imperfekt kann in der Weisheitsliteratur eine allgemeine beziehungsweise gewisse Folge ausdrücken. Das deutsche Präsens entspricht dem sprichwörtlichen Stil, ohne die Unausweichlichkeit abzuschwächen.
- source_word: בְּאֵין
  choice: aus Mangel an
  rationale: Die Verbindung von ב mit אֵין bezeichnet hier den Umstand beziehungsweise die Ursache des Fehlens. „Aus Mangel an“ gibt den kausalen Sinn natürlich wieder.
- source_word: מוּסָר
  choice: Zurechtweisung
  rationale: Das Wort bezeichnet in den Sprüchen formende, korrigierende Unterweisung. „Zurechtweisung“ bewahrt diesen moralisch-erzieherischen Sinn und ist im modernen Deutsch verständlicher als „Zucht“.
- source_word: וּבְרֹב
  choice: wegen seiner großen
  rationale: רֹב bezeichnet Fülle, Menge oder Größe. Im Zusammenhang lässt sich die Präposition kausal verstehen; die Formulierung gibt die überwältigende Größe der Torheit idiomatisch wieder.
- source_word: אִוַּלְתּוֹ
  choice: Torheit
  rationale: Das Substantiv bezeichnet nicht bloß mangelnde Klugheit, sondern moralische Verblendung, eine zentrale Kategorie der Weisheitsliteratur. „Torheit“ bewahrt dieses Gewicht.
- source_word: יִשְׁגֶּה
  choice: geht in die Irre
  rationale: שׁגה kann „irren“, „abschweifen“ oder „sich verirren“ bedeuten. „In die Irre gehen“ bezeichnet hier den verderblichen Fehlweg, ohne ein körperliches Taumeln festzulegen.
- source_word: הוּא
  choice: Er
  rationale: Das ausdrücklich gesetzte Pronomen hebt den bereits in der Verbform enthaltenen männlichen Singular hervor; „Er“ erhält den Bezug schlicht und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sprichwörtlicher Prägnanz. „Zurechtweisung“ vermeidet das heute leicht missverständliche oder altertümliche „Zucht“; „in die Irre gehen“ wahrt die Bildhaftigkeit des hebräischen Verbs.
