id: PRO.15.11
reference: Proverbs 15:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שְׁא֣וֹל וַ֭/אֲבַדּוֹן נֶ֣גֶד יְהוָ֑ה אַ֝֗ף כִּֽי לִבּ֥וֹת בְּֽנֵי אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/011.yaml
  text: Sheol and Abaddon lie open before Yahweh[b][a]; how much more the hearts of the sons of man.
translation:
  language: de
  text: Scheol und Abaddon[a] liegen offen vor Jahwe; wie viel mehr die Herzen der Menschen![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Untergang“. „Abaddon“ kann den Untergang oder den Bereich beziehungsweise Ort des Untergangs bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Herzen der Söhne des Menschen“; die hebräische Wendung bezeichnet Menschen allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: Scheol
  rationale: Die im Deutschen etablierte Transliteration bewahrt die hebräische Vorstellung vom Totenreich, ohne sie auf „Grab“ oder eine genauer bestimmte Jenseitslehre zu verengen.
- source_word: אֲבַדּוֹן
  choice: Abaddon
  rationale: Die Transliteration erhält den namensähnlichen Charakter in der Paarung mit Scheol. Das Wort kann zugleich „Untergang“ oder den Ort des Untergangs bezeichnen; diese Bedeutungsbreite wird in einer Fußnote bewahrt.
- source_word: נֶגֶד
  choice: liegen offen vor
  rationale: נֶגֶד bedeutet wörtlich „vor/gegenüber“. Im Zusammenhang bezeichnet es, dass selbst die verborgensten Bereiche vor Jahwe vollständig sichtbar sind; „liegen offen vor“ gibt diesen Sinn natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, der im modernen Deutschen geläufigen Form der Transliteration des Tetragramms.
- source_word: אַף כִּי
  choice: wie viel mehr
  rationale: 'Die Wortverbindung kennzeichnet einen Schluss vom Größeren auf das Kleinere: Wenn selbst Scheol und Abaddon vor Jahwe offenliegen, dann erst recht die menschlichen Herzen.'
- source_word: לִבּוֹת
  choice: Herzen
  rationale: „Herzen“ bewahrt die hebräische Metapher für das Innere des Menschen, einschließlich Denken, Wollen und Absichten.
- source_word: בְּנֵי אָדָם
  choice: die Menschen
  rationale: Die hebräische Wendung bedeutet wörtlich „Söhne des Menschen/Adams“, bezeichnet hier jedoch Menschen allgemein. „Die Menschen“ gibt den idiomatischen Sinn in natürlichem Deutsch wieder; die wörtliche Form wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. Die Transliteration bewahrt diesen Eigen­namen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von שְׁאוֹל und אֲבַדּוֹן
  choice: Scheol und Abaddon
  alternative: Totenreich und Untergang
  rationale: Die hebräischen Bezeichnungen werden beibehalten, damit der Text nicht auf eine bestimmte Lehre vom Jenseits festgelegt und die eindringliche Paarung zweier tief verborgener Bereiche bewahrt wird.
- issue: Wiedergabe von בְּנֵי אָדָם
  choice: die Menschen
  alternative: die Söhne des Menschen
  rationale: Die grammatisch maskuline hebräische Wendung hat hier eindeutig allgemein-menschliche Referenz. Die idiomatische Übersetzung macht diesen Umfang verständlich, während die Fußnote die Form des Ausgangstextes dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe zweite Satzhälfte bewahrt die zugespitzte Form des hebräischen Spruchs. „Liegen offen vor“ macht die im Kontext gemeinte vollständige Sichtbarkeit deutlich, ohne zusätzliche Aussagen über Scheol oder Abaddon einzutragen.
