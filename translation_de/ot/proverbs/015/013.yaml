id: PRO.15.13
reference: Proverbs 15:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֵ֣ב שָׂ֭מֵחַ יֵיטִ֣ב פָּנִ֑ים וּ/בְ/עַצְּבַת לֵ֝ב ר֣וּחַ נְכֵאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/013.yaml
  text: A joyful heart makes the face cheerful[b][a], but by the sorrow of the heart the spirit is crushed.
translation:
  language: de
  text: Ein frohes Herz lässt das Gesicht strahlen,[a] doch bei Kummer im Herzen ist der Geist niedergeschlagen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »macht das Gesicht gut«; auch: »heitert das Gesicht auf«. Gemeint ist, dass die innere Freude im Gesicht sichtbar wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ist der Lebensmut gebrochen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: Herz
  rationale: Das Wort bezeichnet hier den inneren Menschen und seine Gemütsverfassung. »Herz« ist im Deutschen natürlich und bewahrt zugleich die Bildsprache und die Wiederholung des Hebräischen.
- source_word: שָׂמֵחַ
  choice: froh
  rationale: Das Adjektiv beschreibt innere Freude. »Froh« ist gegenwärtig, klar und passt zur knappen Form eines Weisheitsspruchs.
- source_word: יֵיטִב פָּנִים
  choice: lässt das Gesicht strahlen
  rationale: Wörtlich bedeutet die Wendung etwa »macht das Gesicht gut«. Gemeint ist, dass innere Freude den Gesichtsausdruck sichtbar aufhellt; die deutsche Formulierung gibt dieses Bild idiomatisch wieder.
- source_word: וּבְעַצְּבַת לֵב
  choice: doch bei Kummer im Herzen
  rationale: Das ו leitet den Gegensatz ein und wird daher mit »doch« wiedergegeben. Die Präposition ב bezeichnet hier den Zustand oder Umstand, unter dem der Geist niedergeschlagen ist.
- source_word: רוּחַ
  choice: Geist
  rationale: רוּחַ meint hier die innere Lebenskraft oder Gemütsverfassung eines Menschen. »Geist« bewahrt die anthropologische Weite des hebräischen Ausdrucks.
- source_word: נְכֵאָה
  choice: niedergeschlagen
  rationale: Das Adjektiv bezeichnet einen gebeugten, zerschlagenen oder bedrückten Zustand. »Niedergeschlagen« ist im Kontext natürlichen Deutschen verständlich, ohne die Aussage in eine ausdrückliche Kausalhandlung umzudeuten.
theological_decisions:
- issue: Bedeutungsumfang von רוּחַ
  choice: Geist
  alternative: Lebensmut
  rationale: »Geist« erhält die Mehrdeutigkeit zwischen innerer Verfassung und Lebenskraft. »Lebensmut« wäre idiomatischer, würde die Bedeutung aber stärker psychologisch festlegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in knapper, würdevoller Spruchform. Die antithetische Parallelstruktur und die Wiederholung von »Herz« bleiben erhalten; die erste hebräische Wendung wird idiomatisch, die zweite bewusst zustandsbeschreibend wiedergegeben.
