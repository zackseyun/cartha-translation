base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/033.yaml
  text: The fear of Yahweh is instruction in wisdom[a], and humility comes before honor.
translation:
  language: de
  text: Die Furcht vor Jahwe ist Unterweisung in Weisheit[a], und der Ehre geht Demut voraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Furcht vor Jahwe ist die Zucht der Weisheit.“ Das hebräische Wort für „Unterweisung“ kann auch korrigierende Erziehung, Zurechtweisung oder Zucht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: die Furcht vor Jahwe
  rationale: Die Konstruktverbindung bezeichnet eine auf Jahwe gerichtete, ehrfürchtige Furcht. „Furcht“ bewahrt den weiteren Bedeutungsumfang des hebräischen Begriffs; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: מוּסַר חָכְמָה
  choice: erzieht zur Weisheit
  rationale: מוּסַר umfasst Unterweisung, Erziehung und korrigierende Zucht. Die verbale Formulierung gibt die prägnante Nominalkonstruktion im Deutschen natürlich wieder, ohne ihren erzieherischen Charakter aufzugeben.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist die übliche und kontextgemäße Wiedergabe des zentralen Begriffs der Spruchweisheit.
- source_word: וְלִפְנֵי כָבוֹד עֲנָוָה
  choice: und der Ehre geht Demut voraus
  rationale: Die verblöse zweite Vershälfte drückt aus, dass Demut zeitlich oder sachlich vor Ehre steht. Die deutsche Satzstellung bewahrt diese Abfolge klar und sprichwörtlich.
- source_word: כָבוֹד
  choice: Ehre
  rationale: Im weisheitlichen Zusammenhang bezeichnet das Wort Ansehen und erhöhte Stellung; „Ehre“ ist hier angemessener als „Herrlichkeit“.
- source_word: עֲנָוָה
  choice: Demut
  rationale: Das Substantiv bezeichnet Demut beziehungsweise Niedrigkeit; „Demut“ trifft im ethischen Zusammenhang die natürliche deutsche Ausdrucksweise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht den offenbarten Gottesnamen im Haupttext sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Gottesfurcht und Weisheit
  choice: „erzieht zur Weisheit“
  alternative: „ist Unterweisung in Weisheit“ beziehungsweise „ist die Zucht der Weisheit“
  rationale: Die knappe hebräische Nominalfügung lässt mehr als eine syntaktische Nuance zu. Die gewählte Fassung versteht Gottesfurcht als erziehenden Weg zur Weisheit; die Fußnote bewahrt die substantivische Alternative und den korrektiven Bedeutungsanteil von מוּסַר.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, sprichwörtlich knappem Ton. Die parallele Struktur wird bewahrt; die erste Nominalkonstruktion wird für natürliche deutsche Lesbarkeit verbal wiedergegeben.
