  variant: modern standard German
source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה דֶּ֣רֶךְ רָשָׁ֑ע וּ/מְרַדֵּ֖ף צְדָקָ֣ה יֶאֱהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/009.yaml
  text: The way of the wicked is an abomination to Yahweh[b][a], but he loves the one who pursues righteousness.
translation:
  language: de
  text: Der Weg eines bösen Menschen ist Jahwe ein Gräuel; doch wer der Gerechtigkeit[a] nachjagt, den liebt er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dem Recht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: ein Gräuel
  rationale: Das Substantiv bezeichnet etwas moralisch oder kultisch Abscheuliches. „Ein Gräuel“ bewahrt die starke Wertung und ist in würdigem, heutigem Bibeldeutsch verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: דֶּרֶךְ
  choice: der Weg
  rationale: „Weg“ bewahrt das für die Sprüche typische Bild für Lebensführung und Verhalten.
- source_word: רָשָׁע
  choice: eines bösen Menschen
  rationale: Das maskuline Singularwort bezeichnet hier repräsentativ einen Menschen, dessen Lebensführung böse ist. Die Formulierung gibt den allgemeinen Bezug wieder, ohne die Aussage auf Männer zu beschränken.
- source_word: מְרַדֵּף
  choice: wer … nachjagt
  rationale: Das substantivierte Partizip beschreibt ein fortdauerndes, kennzeichnendes Streben. „Nachjagen“ erhält die nachdrückliche Bewegungsmetapher des hebräischen Verbs.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Das Wort bezeichnet hier rechtes, aufrichtiges Handeln und die rechte moralische Ordnung. „Gerechtigkeit“ bewahrt die ethische und theologische Weite; „Recht“ bleibt als mögliche Nuance in der Fußnote erhalten.
- source_word: יֶאֱהָב
  choice: den liebt er
  rationale: Die Imperfektform formuliert im Spruch eine allgemeingültige Aussage; daher steht im Deutschen das Präsens. Das vorangestellte Objekt wird durch „den“ natürlich wieder aufgenommen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Seine Wiedergabe als „Jahwe“ bewahrt den Unterschied zwischen Name und Titel.
- issue: Bedeutungsumfang von צְדָקָה
  choice: Gerechtigkeit
  alternative: Recht
  rationale: Der Zusammenhang spricht umfassend von einer Lebensführung nach dem, was recht und gut ist. Da das Wort sowohl Gerechtigkeit als auch konkretes Recht bezeichnen kann, wird die Alternative nicht ausgeschlossen.
- issue: Generischer maskuliner Singular
  choice: eines bösen Menschen / wer … nachjagt
  alternative: eines Bösen / derjenige, der … nachjagt
  rationale: Die hebräischen maskulinen Singularformen haben hier allgemein-menschliche Bedeutung. Die gewählte Formulierung bewahrt den Singular und macht den generischen Bezug deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der prägnanten Parallelstruktur eines Weisheitsspruchs. „Ein Gräuel“ wahrt die starke Aussage des Ausgangstextes; „nachjagt“ erhält dessen bewusst intensives Bild.
