id: PRO.15.6
reference: Proverbs 15:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֵּ֣ית צַ֭דִּיק חֹ֣סֶן רָ֑ב וּ/בִ/תְבוּאַ֖ת רָשָׁ֣ע נֶעְכָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/006.yaml
  text: In the house of the righteous there is great wealth[b][a], but in the income of the wicked there is trouble.
translation:
  language: de
  text: Im Haus eines Gerechten ist großer Reichtum, doch am Ertrag[a] eines Frevlers haftet Unheil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ernte«, »Einkünfte« beziehungsweise »Einnahmen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »doch der Ertrag eines Frevlers wird gestört« oder »wird zugrunde gerichtet«; das hebräische Verb kann Störung, Unheil oder Verderben ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית צַדִּיק
  choice: im Haus eines Gerechten
  rationale: Die konkrete Bildsprache von »Haus« bleibt erhalten; der artikellose hebräische Singular wird im Deutschen natürlich als repräsentativer Einzelfall wiedergegeben.
- source_word: חֹסֶן רָב
  choice: großer Reichtum
  rationale: חֹסֶן bezeichnet hier Besitz, Schätze oder Vermögen; רָב hebt dessen Fülle hervor. »Großer Reichtum« ist verständlich und wahrt den wirtschaftlichen Gegensatz der beiden Vershälften.
- source_word: תְבוּאַת
  choice: Ertrag
  rationale: Das Wort bezeichnet zunächst Ertrag oder Ernte und kann erweitert Einnahmen beziehungsweise Einkünfte meinen. »Ertrag« bewahrt sowohl das landwirtschaftliche Bild als auch die wirtschaftliche Bedeutung.
- source_word: רָשָׁע
  choice: Frevler
  rationale: Der substantivisch gebrauchte Singular bezeichnet repräsentativ einen schuldhaft bösen Menschen und steht im direkten Gegensatz zum Gerechten.
- source_word: נֶעְכָּרֶת
  choice: haftet Unheil
  rationale: Das Nifal von עכר kann gestört, ins Unglück gebracht oder zugrunde gerichtet bezeichnen. Die idiomatische Formulierung gibt wieder, dass der Ertrag des Frevlers von Unheil betroffen beziehungsweise begleitet ist, ohne die genaue Art festzulegen.
theological_decisions:
- issue: Verhältnis von Gerechtigkeit, Reichtum und Unheil
  choice: Die knappe sprichwörtliche Gegenüberstellung bleibt ohne erklärende Einschränkung stehen.
  alternative: Den Vers ausdrücklich als allgemeine Lebensregel statt als ausnahmslose Verheißung erläutern.
  rationale: Der hebräische Text formuliert pointiert und bietet an dieser Stelle selbst keine solche Erläuterung; eine dogmatische Präzisierung würde über den Ausgangstext hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die antithetische Spruchform bleibt knapp; »Frevler« markiert den moralischen Gegensatz präzise, während die Fußnoten die echte Bedeutungsbreite der wirtschaftlichen und verbalen Ausdrücke offenhalten.
