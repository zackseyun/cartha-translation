  source_fidelity: Der deutsche Text gibt die antithetische Struktur und die generische Einzahl des Hebräischen angemessen wieder. »Im Haus eines Gerechten« entspricht בֵּית צַדִּיק; »großer Reichtum« trifft חֹסֶן רָב. »Ertrag« bewahrt bei תְבוּאָה sowohl die primäre Ertrags-/Erntebedeutung als auch den möglichen wirtschaftlichen weiteren Sinn. »Am Ertrag eines Frevlers haftet Unheil« ist eine idiomatische deutsche Entfaltung von נֶעְכָּרֶת, ohne die zwischen Betroffenheit von Unheil, Störung und Verderben umstrittene Nuance unzulässig festzulegen.
  naturalness: Knappes, würdiges und modernes Standarddeutsch. Die adversative Verbindung »doch« und die Formulierung »haftet Unheil« funktionieren im sprichwörtlichen Register natürlich.
  terminology: »Gerechter« und »Frevler« geben die ethische Gegenüberstellung von צַדִּיק und רָשָׁע präzise wieder. »Frevler« ist leicht gehoben, aber im Weisheitsspruch registergerecht. Die Fußnoten bieten sachgerechte lexikalische Alternativen; die Marker sind korrekt an den jeweiligen Ausdrücken verankert.
