  text: בְּֽ/כָל מָ֭קוֹם עֵינֵ֣י יְהוָ֑ה צֹ֝פ֗וֹת רָעִ֥ים ו/טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/003.yaml
  text: In every place the eyes of Yahweh watch over the evil and the good[a].
translation:
  language: de
  text: An jedem Ort sind die Augen Jahwes; sie beobachten Böse und Gute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל מָקוֹם
  choice: An jedem Ort
  rationale: Die distributive Formulierung des Hebräischen wird eng und zugleich natürlich wiedergegeben.
- source_word: עֵינֵי יְהוָה
  choice: die Augen Jahwes
  rationale: Bewahrt die anthropomorphe Bildsprache und gibt den hebräischen Gottesnamen als Eigennamen wieder.
- source_word: צֹפוֹת
  choice: sie beobachten
  rationale: Das Partizip bezeichnet fortdauerndes, wachsames Wahrnehmen. „Beobachten“ vermeidet die mögliche Schutzbedeutung von „wachen über“.
- source_word: רָעִים וְטוֹבִים
  choice: Böse und Gute
  rationale: Die substantivisch gebrauchten Adjektive bezeichnen Menschen; die knappe, ausgewogene Gegenüberstellung bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ wahrt dessen Namenscharakter; die traditionelle Wiedergabe wird in der Fußnote genannt.
- issue: Bedeutungsweite von צֹפוֹת
  choice: beobachten
  alternative: wachen über
  rationale: Der Kontext betont Gottes allumfassende Wahrnehmung. „Wachen über“ könnte darüber hinaus Schutz oder Fürsorge nahelegen und damit die Aussage unnötig festlegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, sprichwortartig knappem Satzbau. Das Semikolon verdeutlicht die Prädikatsbeziehung, da das feminine Partizip צֹפוֹת grammatisch auf die Augen zurückweist.
