  terminology: „Jahwe“ gibt den Gottesnamen יְהוָה als Eigennamen wieder. Die Fußnote nennt die traditionelle deutsche Ersatzwiedergabe „der HERR“ korrekt. „Beobachten“ trifft hier die allumfassende Wahrnehmung von צֹפוֹת, ohne die weitergehende Schutzkonnotation von „überwachen“ oder „wachen über“ festzulegen.
