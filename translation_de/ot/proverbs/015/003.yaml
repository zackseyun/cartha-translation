  source_fidelity: 'Die Übersetzung gibt alle Elemente des Hebräischen treffend wieder: בְּכָל־מָקוֹם als „An jedem Ort“, die anthropomorphe Konstruktion „die Augen Jahwes“, das feminine Partizip צֹפוֹת durch das fortdauernde „sie beobachten“ sowie die substantivischen Pluraladjektive רָעִים וְטוֹבִים als „Böse und Gute“. Die Reihenfolge „Böse und Gute“ bleibt erhalten.'
