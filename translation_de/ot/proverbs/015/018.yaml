base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/018.yaml
  text: A hot-tempered man stirs up strife[c][b][a], but one who is slow to anger quiets a dispute.
translation:
  language: de
  text: Ein jähzorniger Mann[a] schürt Zwietracht, doch wer langsam zum Zorn ist[b], bringt einen Streit zur Ruhe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ein Mann des Zorns«; auch: »Ein wütender Mann«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »lang der Nasenlöcher«; eine hebräische Redewendung für jemanden, der langsam zum Zorn ist.'
    reason: cultural_note
  - marker: c
    text: 'Auch: »beschwichtigt einen Streit« oder »stillt einen Streit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֵמָה
  choice: ein jähzorniger Mann
  rationale: Die Verbindung bezeichnet wörtlich einen »Mann des Zorns/der Wut« und charakterisiert einen Menschen, der schnell in Zorn gerät. »Jähzornig« gibt diesen Charakterzug im Deutschen prägnant und sprichworttauglich wieder; »Mann« bewahrt die maskuline Singularform des hebräischen Textes.
- source_word: יְגָרֶה
  choice: schürt
  rationale: Das Piel von גרה bedeutet hier, etwas anzufachen oder hervorzurufen. »Schürt« verbindet sich natürlich mit »Zwietracht« und bewahrt das anschauliche Bild des Anfachens.
- source_word: מָדוֹן
  choice: Zwietracht
  rationale: Das Wort bezeichnet Streit, Hader oder Zwietracht. »Zwietracht« hebt hier die hervorgerufene Uneinigkeit hervor und ermöglicht zugleich, רִיב im zweiten Halbvers als »Streit« wiederzugeben.
- source_word: אֶרֶך אַפַּיִם
  choice: wer nur langsam zornig wird
  rationale: Die hebräische Wendung bedeutet wörtlich »lang an den Nasenlöchern« und ist ein Idiom für jemanden, der sich nicht schnell erzürnt. Die gewählte Form ist verständliches modernes Deutsch und erhält den ausdrücklichen Bezug zum Zorn.
- source_word: יַשְׁקִיט
  choice: bringt … zur Ruhe
  rationale: 'Das Hifil von שקט hat kausative Bedeutung: ruhig machen, stillen. »Bringt … zur Ruhe« bildet diese Wirkung natürlich und anschaulich ab.'
- source_word: רִיב
  choice: Streit
  rationale: רִיב kann einen Streit, eine Auseinandersetzung oder einen Rechtsstreit bezeichnen. Der allgemeinere Ausdruck »Streit« passt zum weisheitlichen Zusammenhang, ohne einen gerichtlichen Kontext vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller und knapper Sprichwortstil. Die parallele Gegenüberstellung bleibt erhalten. »Zwietracht« und »Streit« geben die beiden unterschiedlichen hebräischen Streitbegriffe wieder, ohne den zweiten unnötig juristisch festzulegen.
