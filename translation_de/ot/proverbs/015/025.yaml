source:
  edition: WLC
  text: בֵּ֣ית גֵּ֭אִים יִסַּ֥ח יְהוָ֑ה וְ֝/יַצֵּ֗ב גְּב֣וּל אַלְמָנָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/025.yaml
  text: Yahweh tears down the house of the proud[b][a], but he sets firm the boundary of the widow.
translation:
  language: de
  text: Jahwe reißt das Haus der Hochmütigen nieder[a], doch die Grenze der Witwe setzt er fest[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »entfernt das Haus der Hochmütigen« beziehungsweise »reißt es aus«. Das hebräische Verb kann außer dem Niederreißen auch das Wegnehmen oder Entwurzeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Verb kann »festsetzen«, »aufstellen« oder »festmachen« bedeuten. Mit der Grenze kann auch die Grenzlinie oder ein Grenzstein ihres Grundstücks gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  choice: das Haus
  rationale: Die konkrete Bedeutung »Haus« bleibt erhalten und kann zugleich den Haushalt oder Besitz der Hochmütigen einschließen.
- source_word: גֵּאִים
  choice: der Hochmütigen
  rationale: Bezeichnet stolze, überhebliche Menschen; »Hochmütige« ist im Deutschen würdevoll und für die Weisheitsliteratur passend.
- source_word: יִסַּח
  choice: reißt … nieder
  rationale: Das Verb bezeichnet ein gewaltsames Entfernen oder Wegreißen. In Verbindung mit »Haus« ist »niederreißen« natürlich; die mögliche Nuance des Entwurzelns wird in der Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige Form.
- source_word: וְיַצֵּב
  choice: doch … sichert er
  rationale: Der Hifil von יצב bedeutet festmachen oder sicher hinstellen. »Sichern« drückt hier idiomatisch aus, dass die Grenze Bestand erhält; »doch« gibt den Gegensatz im Parallelismus wieder.
- source_word: גְּבוּל
  choice: die Grenze
  rationale: Das Wort bezeichnet Grenze, Grenzlinie oder Gebiet. Hier liegt wegen des Besitzschutzes der Witwe besonders die Grundstücksgrenze nahe.
- source_word: אַלְמָנָה
  choice: der Witwe
  rationale: Der Singular bezeichnet repräsentativ die sozial schutzbedürftige Witwe und wird formal bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Wiedergabe »Jahwe« erhält ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Konjunktion ו vor יַצֵּב
  choice: doch
  alternative: und
  rationale: Die Konjunktion lautet formal »und«, doch der antithetische Parallelismus stellt das Gericht über die Hochmütigen dem Schutz der Witwe gegenüber. »Doch« macht diese Funktion im Deutschen deutlich.
- issue: Aussage über die Grenze der Witwe
  choice: die Grenze … sichert er
  alternative: die Grenze … stellt er fest hin
  rationale: Der Satz beschreibt Gottes Schutz des gefährdeten Besitzes, ohne festzulegen, auf welche konkrete Weise er erfolgt. Die knappe räumlich-rechtliche Bildsprache bleibt erhalten.
translation_notes:
  register: Modernes, klares Standarddeutsch mit knapper, würdevoller Spruchform. Die Satzstellung im zweiten Halbvers setzt »die Grenze der Witwe« hervor und erhält den Kontrast zwischen den Hochmütigen und der schutzbedürftigen Witwe.
