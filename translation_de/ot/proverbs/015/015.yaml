  text: All the days of the afflicted are bad[b][a], but a cheerful heart is a continual feast.
translation:
  language: de
  text: Alle Tage eines Bedrängten sind schlecht[a], wer aber frohen Herzens ist[b], hat immer ein Festmahl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle Tage eines Armen sind schlecht“ beziehungsweise „Alle Tage eines Elenden sind schlecht“. Das hebräische Wort kann einen armen, bedrängten oder unterdrückten Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „gut von Herzen“ beziehungsweise „einer, der ein gutes Herz hat“. Die hebräische Wendung bezeichnet hier eine frohe, wohlgemute innere Haltung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: Alle Tage
  rationale: Bewahrt die hebräische Zeitvorstellung und klingt als sprichwörtliche Formulierung im Deutschen natürlich.
- source_word: עָנִי
  choice: des Bedrängten
  rationale: Der Ausdruck kann Armut, Not oder Unterdrückung bezeichnen. „Bedrängten“ hält den Sinn bewusst weiter als eine rein wirtschaftliche Deutung.
- source_word: רָעִים
  choice: sind schlecht
  rationale: Gibt das allgemeine Qualitätsurteil wieder, ohne es auf moralische Bosheit oder bloße Beschwerlichkeit einzuengen.
- source_word: וְטוֹב לֵב
  choice: aber ein frohes Herz
  rationale: Der Gegensatz verlangt im Deutschen „aber“. „Frohes Herz“ bezeichnet hier verständlich eine innere Haltung des Wohlbefindens und der Freude.
- source_word: מִשְׁתֶּה תָמִיד
  choice: ein beständiges Festmahl
  rationale: „Festmahl“ bildet die konkrete Metapher ab; „beständig“ gibt die fortdauernde Bedeutung von תָמִיד wieder.
theological_decisions:
- issue: Verhältnis äußerer Not zu innerer Herzenshaltung
  choice: Die beiden Halbverse bleiben als zugespitzter weisheitlicher Gegensatz stehen.
  alternative: Den zweiten Halbvers kausal oder als Verheißung formulieren.
  rationale: Der hebräische Text behauptet weder ausdrücklich eine Ursache noch eine göttliche Verheißung; solche Ergänzungen würden die offene Spannung des Spruchs auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Die Bildwörter „Herz“ und „Festmahl“ bleiben erhalten; die Mehrdeutigkeit von עָנִי wird durch eine Fußnote kenntlich gemacht.
