source:
  edition: WLC
  text: לֹ֣א יֶאֱהַב לֵ֭ץ הוֹכֵ֣חַֽ ל֑/וֹ אֶל חֲ֝כָמִ֗ים לֹ֣א יֵלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/012.yaml
  text: A mocker does not love one who corrects him[a]; he will not go to the wise.
translation:
  language: de
  text: Ein Spötter liebt den nicht, der ihn zurechtweist; zu den Weisen geht er nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵץ
  choice: Spötter
  rationale: Bezeichnet in der Weisheitsliteratur einen Menschen, der andere und Mahnung verächtlich behandelt. „Spötter“ ist modern, verständlich und bewahrt den aktiven, geringschätzigen Sinn.
- source_word: יֶאֱהַב
  choice: liebt es nicht
  rationale: Gibt das gewöhnliche Verb „lieben“ wieder. Zusammen mit dem folgenden partizipialen Ausdruck klingt die unpersönliche deutsche Form natürlich, ohne zu „hasst“ zu verschärfen oder zu „mag nicht“ abzuschwächen.
- source_word: הוֹכֵחַ לוֹ
  choice: wenn man ihn zurechtweist
  rationale: Das Partizip von יכח bezeichnet hier korrigierende Zurechtweisung. Die Formulierung ist im Deutschen natürlich und erhält sowohl den persönlichen Bezug als auch den korrigierenden Charakter.
- source_word: אֶל חֲכָמִים
  choice: zu den Weisen
  rationale: אֶל bezeichnet hier die Bewegung beziehungsweise Hinwendung zu weisen Personen. „Die Weisen“ gibt den substantivierten maskulinen Plural knapp wieder und kann im Deutschen generisch verstanden werden.
- source_word: לֹא יֵלֵךְ
  choice: geht er nicht
  rationale: הלך bedeutet im Zusammenhang „gehen/sich hinbegeben“. Das Präsens bringt die für Sprichwörter typische allgemeine beziehungsweise gewohnheitsmäßige Aussage natürlicher zum Ausdruck als ein deutsches Futur.
theological_decisions:
- issue: Generische Bedeutung von חֲכָמִים
  choice: die Weisen
  alternative: weise Männer
  rationale: Der hebräische Ausdruck steht grammatisch im maskulinen Plural, bezeichnet in diesem Weisheitsspruch aber wahrscheinlich die Gruppe weiser Personen allgemein. „Die Weisen“ bewahrt die Formnähe, ohne die Aussage unnötig auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sprichwortartiger Kürze. Die Satzstellung im zweiten Halbvers setzt „zu den Weisen“ entsprechend dem hebräischen Fokus voran. Keine Fußnote ist nötig, da „die Weisen“ sowohl formal nah als auch im Deutschen generisch verständlich ist.
