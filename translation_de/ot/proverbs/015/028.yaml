source:
  edition: WLC
  text: לֵ֣ב צַ֭דִּיק יֶהְגֶּ֣ה לַ/עֲנ֑וֹת וּ/פִ֥י רְ֝שָׁעִ֗ים יַבִּ֥יעַ רָעֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/028.yaml
  text: The heart of the righteous considers how to answer[a], but the mouth of the wicked pours out evil things.
translation:
  language: de
  text: Das Herz des Gerechten bedenkt, was zu antworten ist[a], aber der Mund der Bösen sprudelt Böses hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sinnt darauf, um zu antworten“ oder „sinnt, bevor es antwortet“. Das hebräische Verb kann Nachsinnen oder gründliches Erwägen bezeichnen; die Wendung lautet wörtlicher: „sinnt, um zu antworten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: Herz
  rationale: Im hebräischen Weisheitsdenken bezeichnet das Herz den inneren Menschen einschließlich Denken und Überlegen. „Herz“ bewahrt das Bild des Ausgangstextes.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet hier einen repräsentativen gerechten Menschen. Der Singular des Hebräischen bleibt erhalten.
- source_word: יֶהְגֶּה
  choice: überlegt
  rationale: Das Verb kann Nachsinnen, Erwägen oder bedachtes Äußern bezeichnen. Zusammen mit dem folgenden Infinitiv hebt es das überlegte Antworten hervor.
- source_word: לַעֲנוֹת
  choice: wie es antworten soll
  rationale: Der mit ל eingeleitete Infinitiv richtet das Überlegen auf eine Antwort aus. Die idiomatische deutsche Formulierung macht diesen Bezug deutlich, ohne den Inhalt der Antwort festzulegen.
- source_word: וּפִי
  choice: aber der Mund
  rationale: Die Konjunktion bedeutet formal „und“, trägt im antithetischen Parallelismus jedoch kontrastierende Bedeutung; „aber“ gibt diese im Deutschen natürlich wieder.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: Das substantivierte Adjektiv steht im Plural und bezeichnet die Gruppe der Menschen, die böse und gegen Gottes Ordnung handeln. „Gottlose“ ist in der deutschen Weisheitssprache prägnant und wahrt den ethisch-religiösen Gehalt.
- source_word: יַבִּיעַ
  choice: sprudelt … hervor
  rationale: Das Hifil beschreibt ein Hervorquellen oder reichliches Ausströmen. „Sprudelt … hervor“ bewahrt das anschauliche Bild ungehemmter Rede.
- source_word: רָעוֹת
  choice: Böses
  rationale: Der feminine Plural kann böse Dinge, schädliche Äußerungen oder Übel bezeichnen. Das substantivierte „Böses“ hält die Aussage bewusst weit und klingt im Deutschen natürlich.
theological_decisions: []
