  text: מְֽאוֹר עֵ֭ינַיִם יְשַׂמַּֽח לֵ֑ב שְׁמוּעָ֥ה ט֝וֹבָ֗ה תְּדַשֶּׁן עָֽצֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/030.yaml
  text: The light of the eyes gladdens the heart[b][a]; good news fattens the bones.
translation:
  language: de
  text: Das Leuchten der Augen[a] erfreut das Herz; eine gute Nachricht kräftigt die Knochen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Glanz der Augen“, das heißt ein heller, freundlicher Blick.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „macht den Knochen fett“; das Bild steht für tiefe körperliche Stärkung und neue Lebenskraft.'
    reason: cultural_note
lexical_decisions:
- source_word: מְאוֹר עֵינַיִם
  choice: das Leuchten der Augen
  rationale: Die Wiedergabe bewahrt das konkrete hebräische Bild und lässt offen, ob das wahrgenommene Licht oder ein heller, freundlicher Blick gemeint ist.
- source_word: יְשַׂמַּח
  choice: erfreut
  rationale: Das Piel bezeichnet hier das Hervorrufen von Freude; „erfreut“ gibt den kausativen Sinn knapp und natürlich wieder.
- source_word: לֵב
  choice: das Herz
  rationale: „Herz“ bewahrt das zentrale anthropologische Bild des Hebräischen für das Innere des Menschen.
- source_word: שְׁמוּעָה טוֹבָה
  choice: eine gute Nachricht
  rationale: Die Wortgruppe bezeichnet eine gute beziehungsweise erfreuliche Kunde; „gute Nachricht“ ist im modernen Deutsch klar und idiomatisch.
- source_word: תְּדַשֶּׁן עָצֶם
  choice: kräftigt die Knochen
  rationale: דשׁן bedeutet wörtlich „fett machen“ und bezeichnet bildlich Gedeihen, Stärkung und tiefe körperliche Belebung. Die natürliche deutsche Formulierung vermittelt den Sinn, während die Fußnote das kräftige hebräische Bild festhält. Das singularische עָצֶם wird kollektiv als „die Knochen“ wiedergegeben.
