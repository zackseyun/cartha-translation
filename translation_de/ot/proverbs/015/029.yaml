id: PRO.15.29
reference: Proverbs 15:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רָח֣וֹק יְ֭הוָה מֵ/רְשָׁעִ֑ים וּ/תְפִלַּ֖ת צַדִּיקִ֣ים יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/029.yaml
  text: Yahweh is far from the wicked[a], but he hears the prayer of the righteous.
translation:
  language: de
  text: Jahwe[a] ist den Bösen fern, doch das Gebet der Gerechten hört er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell oft mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָחוֹק
  choice: fern
  rationale: Das prädikative Adjektiv bezeichnet hier vor allem moralisch-relationale Distanz. „Fern“ bewahrt das Bild, ohne eine bloß räumliche Abwesenheit auszudrücken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben, damit der im Hebräischen verwendete Eigenname erkennbar bleibt.
- source_word: מֵרְשָׁעִים
  choice: den Bösen
  rationale: רְשָׁעִים bezeichnet Menschen, die durch gottloses beziehungsweise moralisch böses Handeln gekennzeichnet sind. „Den Bösen“ ist im modernen Deutsch klar und bildet den Gegensatz zu „den Gerechten“ knapp ab.
- source_word: וּתְפִלַּת
  choice: doch das Gebet
  rationale: Das Waw verbindet die beiden Vershälften, die inhaltlich einen Gegensatz bilden; „doch“ macht diesen Gegensatz natürlich sichtbar. תְּפִלָּה bedeutet „Gebet“.
- source_word: צַדִּיקִים
  choice: der Gerechten
  rationale: צַדִּיקִים bezeichnet Menschen, die als gerecht gelten beziehungsweise gerecht handeln. Die substantivierte Form „die Gerechten“ entspricht der knappen Gruppenbezeichnung des Weisheitsspruchs.
- source_word: יִשְׁמָע
  choice: hört er
  rationale: שׁמע bedeutet „hören“ oder „auf etwas hören“. „Hört er“ wahrt die lexikalische Offenheit und legt nicht ausdrücklich fest, dass jedes Gebet in der erbetenen Weise beantwortet wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst und keinen Titel. Die Transliteration „Jahwe“ macht dies sichtbar; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Bedeutung der Ferne Jahwes von den Bösen
  choice: moralisch-relationale Distanz, im Gegensatz zu seiner Hinwendung zum Gebet der Gerechten
  alternative: räumliche Abwesenheit oder völlige Unkenntnis der Bösen
  rationale: Der Parallelismus stellt „fern sein“ dem Hören des Gebets gegenüber. Daher geht es um Beziehung und wohlwollende Zuwendung, nicht um eine metaphysische Begrenzung von Gottes Gegenwart oder Wissen.
- issue: Bedeutung von יִשְׁמָע im Zusammenhang mit Gebet
  choice: „hört er“
  alternative: „erhört er“
  rationale: Im Gebetskontext kann das Verb wohlwollende Aufmerksamkeit einschließen. „Hört“ bewahrt jedoch die echte semantische Spannung und verspricht nicht ausdrücklich eine bestimmte Form der Gebetserfüllung.
translation_notes:
  register: Knapper, würdevoller Weisheitsspruch in modernem Standarddeutsch. Die vorangestellte Ergänzung „den Bösen“ bei „fern“ ist idiomatisch; die Nachstellung „hört er“ erhält den antithetischen, pointierten Parallelismus.
