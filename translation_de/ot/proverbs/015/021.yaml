  text: אִ֭וֶּלֶת שִׂמְחָ֣ה לַ/חֲסַר לֵ֑ב וְ/אִ֥ישׁ תְּ֝בוּנָ֗ה יְיַשֶׁר לָֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/021.yaml
  text: Folly is joy to one lacking sense[a], but a man of understanding makes his path straight.
translation:
  language: de
  text: Torheit ist dem Unverständigen eine Freude[a], doch ein verständiger Mann richtet seinen Weg gerade aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einem, dem das Herz fehlt“; „Herz“ bezeichnet hier Verstand und Urteilsvermögen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: Torheit
  rationale: Das abstrakte Substantiv bezeichnet törichtes Denken und Handeln; „Torheit“ ist knapp, würdig und bildet den Gegensatz zur Einsicht ab.
- source_word: שִׂמְחָה
  choice: ist ... eine Freude
  rationale: Die nominale Prädikation wird direkt wiedergegeben und bewahrt die knappe Form des Spruchs.
- source_word: לַחֲסַר לֵב
  choice: dem ohne Verstand
  rationale: Wörtlich heißt die Wendung „dem, dem Herz fehlt“. Im Sprüchebuch steht „Herz“ hier für Verstand und Urteilsvermögen; die deutsche Form gibt den idiomatischen Sinn natürlich wieder, ohne ausdrücklich ein im Hebräischen nicht vorhandenes אִישׁ einzusetzen.
- source_word: אִישׁ תְּבוּנָה
  choice: ein verständiger Mann
  rationale: אִישׁ wird als „Mann“ wiedergegeben; תְּבוּנָה bezeichnet Einsicht beziehungsweise verständiges Urteilsvermögen. Die attributive deutsche Form klingt natürlicher als „ein Mann der Einsicht“.
- source_word: יְיַשֶׁר
  choice: richtet ... gerade aus
  rationale: 'Die Piel-Form von ישר hat kausative Kraft: gerade machen beziehungsweise ausrichten. Die Formulierung bewahrt diese Kraft statt sie lediglich als „geht gerade“ wiederzugeben.'
- source_word: לָכֶת
  choice: seinen Weg
  rationale: Der Infinitiv „gehen“ bezeichnet hier bildhaft den Lebenswandel oder eingeschlagenen Kurs. „Seinen Weg“ macht dieses Bild im Deutschen verständlich; das Possessivpronomen ist aus dem Subjekt erschlossen.
theological_decisions:
- issue: Generisch-maskuline Personenbezeichnung
  choice: dem ohne Verstand ... ein verständiger Mann
  alternative: einem Menschen ohne Verstand ... ein verständiger Mensch
  rationale: Der erste Ausdruck ist im Hebräischen nicht ausdrücklich mit אִישׁ gebildet und kann im Deutschen substantivisch knapp bleiben; in der zweiten Zeile steht ausdrücklich אִישׁ. Die Übersetzung erhält diesen Unterschied und verwendet „Mann“ dort, wo es im Ausgangstext steht.
- issue: Bild vom geraden Weg
  choice: richtet seinen Weg gerade aus
  alternative: geht den geraden Weg / führt ein rechtschaffenes Leben
  rationale: Die Übersetzung bewahrt die konkrete und möglicherweise bewusst spannungsreiche Metapher sowie die kausative Verbform, ohne sie vorschnell moraltheologisch als „rechtschaffen leben“ auszudeuten.
translation_notes:
  register: Modernes, knappes Standarddeutsch mit spruchhafter Parallelstruktur. Die Wortstellung „dem ohne Verstand“ ist bewusst verdichtet und entspricht dem poetischen Register; das Wegbild und die kausative Aussage der zweiten Zeile bleiben erhalten.
