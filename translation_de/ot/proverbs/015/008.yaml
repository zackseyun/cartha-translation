source:
  edition: WLC
  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֲבַ֣ת יְהוָ֑ה וּ/תְפִלַּ֖ת יְשָׁרִ֣ים רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/008.yaml
  text: The sacrifice of the wicked is an abomination to Yahweh[a], but the prayer of the upright is his delight.
translation:
  language: de
  text: Das Opfer der Gottlosen ist für Jahwe ein Gräuel, aber das Gebet der Aufrichtigen ist sein Wohlgefallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „steht in seiner Gunst“ oder „findet seine Zustimmung“. Das hebräische Substantiv kann Wohlgefallen, Gunst oder Annahme bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  choice: Opfer
  rationale: Bezeichnet allgemein eine kultische Opfergabe; „Opfer“ ist im Deutschen knapp, natürlich und bildet den Gegensatz zum Gebet angemessen ab.
- source_word: רְשָׁעִים
  choice: der Gottlosen
  rationale: Das substantivierte Pluraladjektiv bezeichnet moralisch schuldige Menschen. „Die Gottlosen“ bewahrt die sprichwörtliche moralische Kategorie, ohne eine konkrete Personengruppe einzuführen.
- source_word: תּוֹעֲבַת
  choice: ein Gräuel
  rationale: Das Wort bezeichnet etwas, das Jahwe entschieden verabscheut. „Ein Gräuel“ erhält die starke moralisch-religiöse Wertung des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: תְפִלַּת
  choice: das Gebet
  rationale: Der Singular hat hier repräsentative, sprichwörtliche Bedeutung und entspricht der hebräischen Konstruktion „das Gebet der …“.
- source_word: יְשָׁרִים
  choice: der Aufrichtigen
  rationale: Das Wort beschreibt Menschen, die moralisch gerade und redlich sind. „Aufrichtige“ bewahrt diese ethische Nuance.
- source_word: רְצוֹנוֹ
  choice: sein Wohlgefallen
  rationale: Das Substantiv kann Wohlgefallen, Gunst oder Annahme ausdrücken. „Sein Wohlgefallen“ bildet einen kräftigen Gegenpol zu „Gräuel“ und wahrt zugleich die nominale Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ erhält den Charakter eines Eigennamens, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von רְצוֹנוֹ im zweiten Halbvers
  choice: sein Wohlgefallen
  alternative: findet seine Zustimmung / steht in seiner Gunst
  rationale: Die hebräische Nominalkonstruktion lässt offen, ob vor allem Freude, Gunst oder Annahme betont wird. „Sein Wohlgefallen“ wahrt den starken Gegensatz zu „Gräuel“, während die Fußnote die echten lexikalischen Alternativen nennt.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper sprichwörtlicher Parallelstruktur. „Gräuel“ und „Wohlgefallen“ sind gehoben, aber allgemein verständlich und geben die Stärke des hebräischen Gegensatzes wieder. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung רְצוֹנוֹ.
