id: PRO.15.31
reference: Proverbs 15:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֹ֗זֶן שֹׁ֭מַעַת תּוֹכַ֣חַת חַיִּ֑ים בְּ/קֶ֖רֶב חֲכָמִ֣ים תָּלִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/031.yaml
  text: An ear that listens to life-giving rebuke will remain among the wise[a][b].
translation:
  language: de
  text: Ein Ohr, das auf lebenspendende Zurechtweisung hört[a], wird unter Weisen wohnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher ist auch möglich: „auf die Zurechtweisung des Lebens“ oder „auf Zurechtweisung zum Leben“. Die hebräische Verbindung kann eine Zurechtweisung bezeichnen, die zum Leben führt oder das Leben bewahrt.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bedeutet wörtlich „übernachten“ oder „Herberge nehmen“. Hier beschreibt es bildhaft das Bleiben beziehungsweise den festen Platz unter den Weisen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹזֶן
  choice: Ohr
  rationale: 'Die konkrete Metapher des Hebräischen bleibt erhalten: Das Ohr steht für einen Menschen, der bereitwillig zuhört. Auch im Deutschen ist dieses Bild verständlich.'
- source_word: שֹׁמַעַת
  choice: das auf … hört
  rationale: Das Partizip bezeichnet eine anhaltende, aufnahmebereite Haltung. Die Verbindung „auf etwas hören“ drückt im Deutschen nicht nur akustisches Hören, sondern auch Beachtung aus.
- source_word: תּוֹכַחַת
  choice: Zurechtweisung
  rationale: Das Wort bezeichnet tadelnde, erzieherische Korrektur. „Zurechtweisung“ wahrt sowohl den Ernst des Tadels als auch dessen korrigierende Absicht.
- source_word: חַיִּים
  choice: lebenspendende
  rationale: 'In der Verbindung תּוֹכַחַת חַיִּים kann der Genitiv die Wirkung oder das Ziel bezeichnen: eine Zurechtweisung, die zum Leben führt oder Leben bewahrt. Die Fußnote erhält die formal näheren Alternativen.'
- source_word: בְּקֶרֶב
  choice: unter
  rationale: Die Präposition bezeichnet die Zugehörigkeit beziehungsweise den Aufenthalt inmitten einer Gruppe; „unter“ ist dafür im Deutschen knapp und idiomatisch.
- source_word: חֲכָמִים
  choice: Weisen
  rationale: Das substantivierte Adjektiv bezeichnet weise Menschen allgemein und enthält im Hebräischen keine notwendige geschlechtliche Eingrenzung.
- source_word: תָּלִין
  choice: wird … wohnen
  rationale: Das Verb bedeutet wörtlich „übernachten“ oder „Herberge nehmen“. „Wohnen“ bewahrt das räumliche Bild, vermittelt hier aber zugleich die dauerhafte Gemeinschaft mit den Weisen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ohr-Metapher und das Bild des Wohnens bleiben erhalten; zugleich sorgen „auf … hören“ und „unter Weisen“ für natürliche deutsche Ausdrucksweise.
