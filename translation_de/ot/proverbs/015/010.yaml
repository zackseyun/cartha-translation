source:
  edition: WLC
  text: מוּסָ֣ר רָ֭ע לְ/עֹזֵ֣ב אֹ֑רַח שׂוֹנֵ֖א תוֹכַ֣חַת יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/010.yaml
  text: Harsh discipline is for one who forsakes the path[b][a]; whoever hates reproof will die.
translation:
  language: de
  text: Strenge[b] Zurechtweisung trifft den, der den Pfad[a] verlässt; wer Tadel hasst, wird sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Weg«. Das hebräische Wort dient in der Weisheitsliteratur häufig als Bild für die moralische Lebensführung.
    reason: lexical_alternative
  - marker: b
    text: Oder »schwere Zurechtweisung«. Das hebräische Adjektiv kann auch »schlecht« oder »böse« bedeuten; hier beschreibt es wahrscheinlich die schmerzhafte Härte der Zurechtweisung.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסָר
  choice: Zurechtweisung
  rationale: Das Wort bezeichnet erzieherische Unterweisung, Korrektur oder disziplinierende Maßnahme. »Zurechtweisung« bewahrt hier den korrigierenden Charakter und passt zum parallelen »Tadel«, ohne den Ausdruck vorschnell auf körperliche Strafe zu verengen.
- source_word: רָע
  choice: streng
  rationale: Das Adjektiv kann »schlecht«, »böse« oder in diesem Zusammenhang eine schmerzhafte, schwere Qualität bezeichnen. »Streng« gibt die Härte der Zurechtweisung idiomatisch wieder, ohne sie moralisch als böse zu bewerten.
- source_word: לְעֹזֵב
  choice: trifft den, der … verlässt
  rationale: Die Präposition לְ bezeichnet hier, wem die Zurechtweisung gilt; das Partizip beschreibt allgemein einen Menschen, der den rechten Lebensweg aufgibt. Die Formulierung ergibt im Deutschen einen natürlichen Spruchstil.
- source_word: אֹרַח
  choice: Pfad
  rationale: Das Wort bezeichnet in der Weisheitsliteratur häufig bildlich den moralischen Lebensweg. »Pfad« erhält dieses Bild.
- source_word: שׂוֹנֵא
  choice: wer … hasst
  rationale: Das Partizip hat allgemeingültige, sprichwörtliche Bedeutung. »Wer … hasst« gibt diese gnomenhafte Aussage natürlich und geschlechtsübergreifend wieder.
- source_word: תוֹכַחַת
  choice: Tadel
  rationale: Das Substantiv bezeichnet zurechtweisende Kritik oder einen Verweis. »Tadel« unterscheidet die konkrete verbale Rüge von der umfassenderen disziplinierenden »Zurechtweisung« im ersten Halbvers.
- source_word: יָמוּת
  choice: wird sterben
  rationale: Das Verb wird ohne abschwächende Umschreibung wiedergegeben. Das Futur drückt die angekündigte Folge im Spruch aus.
theological_decisions:
- issue: Art des angekündigten Todes
  choice: »wird sterben« ohne nähere Bestimmung
  alternative: »wird zugrunde gehen« oder ausdrückliche Deutung als körperlicher beziehungsweise endgültiger Tod
  rationale: מות bedeutet schlicht »sterben«, während der Vers die Art oder Dimension des Todes nicht erläutert. Die offene Formulierung bewahrt diese theologische und literarische Spannung.
translation_notes:
  register: Moderner, würdevoller Spruchstil mit klarer Parallelstruktur. »Pfad« erhält das traditionelle Weisheitsbild, während »Zurechtweisung« und »Tadel« allgemein verständlich bleiben. Die beiden Fußnotenmarker stehen unmittelbar an den jeweils erläuterten Textelementen.
