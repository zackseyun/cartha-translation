  verdict: revise
  source_fidelity: Die Grundübersetzung trifft den Vergleich, die einfache Gemüsemahlzeit, die Liebe sowie den Kontrast zum gemästeten/stallgefütterten Ochsen. Die Wendung „bei dem Hass herrscht“ bindet Hass im Deutschen jedoch zu direkt an den Ochsen. Das hebräische בוֹ ist knapp und seine genaue Bezugnahme ist nicht ausdrücklich auf das Tier zu begrenzen.
  naturalness: „Bei dem Hass herrscht“ ist im modernen Deutsch missverständlich und stilistisch unerquicklich, da ein relativer Bezug auf „Ochse“ naheliegt. „Wenn Hass dabei ist“ ist idiomatisch und lässt Hass beim Mahl bzw. in seinem sozialen Umfeld stehen.
  terminology: „Mahlzeit aus Gemüse“ und „gemästeter Ochse“ sind sachgerecht und registerangemessen. Die Fußnote zur Alternative sollte „Stallfütterung“ präziser als „im Stall gefüttert“ formulieren und die Mehrdeutigkeit von בוֹ ohne eine zu enge grammatische Behauptung wiedergeben.
  issues:
