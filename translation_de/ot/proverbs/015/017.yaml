  rationale: Die Revision beseitigt den im Deutschen irreführenden direkten Relativbezug von Hass auf den Ochsen. „Wenn Hass dabei ist“ bewahrt die knappe Zuordnung des Hebräischen und ist natürliches modernes Standarddeutsch. Die Fußnoten bleiben an denselben Stellen verankert und erläutern die lexikalische beziehungsweise referenzielle Offenheit ohne sie dogmatisch aufzulösen.
