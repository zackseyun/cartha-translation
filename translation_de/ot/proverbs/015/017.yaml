  text: Better is a meal of vegetables where there is love than a fattened ox with hatred[a][b].
translation:
  language: de
  text: Besser ist eine Mahlzeit aus Gemüse, wo Liebe herrscht, als ein gemästeter Ochse, wenn Hass dabei ist.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als ein im Stall gefütterter Ochse“; der hebräische Ausdruck kann entweder die Stallfütterung oder den dadurch erreichten gemästeten Zustand hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und Hass in ihm/darin“; die knappe Wendung kann sich auf das Mahl oder das häusliche Umfeld beziehen, das von Hass geprägt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Besser ist
  rationale: Im vergleichenden Spruch mit מִן hat טוֹב die idiomatische Bedeutung „besser ... als“. Die ergänzte Kopula ergibt natürliches Deutsch.
- source_word: אֲרֻחַת יָרָק
  choice: eine Mahlzeit aus Gemüse
  rationale: אֲרֻחָה bezeichnet eine Mahlzeit beziehungsweise Speiseportion, יָרָק essbare grüne Pflanzen oder Gemüse. Die Wendung ist klar und gegenwartssprachlich.
- source_word: וְאַהֲבָה שָׁם
  choice: wo Liebe herrscht
  rationale: Wörtlich steht „und Liebe dort“. Die deutsche Fassung gibt den örtlichen und atmosphärischen Sinn natürlich wieder.
- source_word: מִשּׁוֹר אָבוּס
  choice: als ein gemästeter Ochse
  rationale: שׁוֹר bedeutet „Ochse“; אָבוּס kann die Stallfütterung oder deren Ergebnis, den gemästeten Zustand, hervorheben. „Gemästeter Ochse“ macht den Gegensatz zwischen karger und üppiger Kost deutlich.
- source_word: וְשִׂנְאָה בוֹ
  choice: bei dem Hass herrscht
  rationale: Das Suffix in בוֹ ist grammatisch maskulin und kann sich unmittelbar auf den Ochsen beziehen, sinngemäß aber auf das damit verbundene Mahl oder häusliche Umfeld. Die Formulierung wahrt diesen Bezug, ohne Hass dem Tier selbst zuzuschreiben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Parallelität. Die Wiederholung „herrscht“ verdeutlicht den Gegensatz der häuslichen Atmosphäre; die Fußnoten bewahren die lexikalische und referenzielle Mehrdeutigkeit des Hebräischen.
