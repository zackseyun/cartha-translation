    issue: Die Formulierung „bei dem Hass herrscht“ lässt Hass am Ochsen ‚herrschen‘.
    rationale: Der Relativanschluss „bei dem“ bezieht sich regulär auf den unmittelbar vorangehenden maskulinen „Ochsen“. Damit wird die im Hebräischen knappe, kontextuell auf Mahl/Hausgemeinschaft bezogene Wendung im Deutschen unnatürlich und unnötig verengt.
  - severity: low
    issue: Fußnote a formuliert die Alternative „aus dem Stall“ unpräzise.
    rationale: אָבוּס kann die Fütterung am/im Stall bzw. das dadurch gemästete Tier bezeichnen; „im Stall gefüttert“ gibt die erste Möglichkeit klarer wieder.
