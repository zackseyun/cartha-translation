source:
  edition: WLC
  text: מַֽעֲנֶה רַּ֭ךְ יָשִׁ֣יב חֵמָ֑ה וּ/דְבַר עֶ֝֗צֶב יַעֲלֶה אָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/001.yaml
  text: A gentle answer turns away wrath[a], but a painful word stirs up anger.
translation:
  language: de
  text: Eine sanfte Antwort wendet den Zorn ab, doch ein verletzendes Wort erregt Zorn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „lässt Ärger/Zorn aufsteigen“; auch: „schürt den Zorn“.'
    reason: Die Anmerkung dokumentiert die wörtliche Bildsprache des hebräischen Hifil von עלה mit אַף, während der Text die idiomatische deutsche Wiedergabe bietet.
lexical_decisions:
- source_word: מַעֲנֶה
  choice: Antwort
  rationale: Das Substantiv bezeichnet eine Antwort oder Erwiderung auf Gesagtes; „Antwort“ ist im Deutschen knapp und natürlich.
- source_word: רַךְ
  choice: sanft
  rationale: Das Adjektiv bedeutet „weich, sanft“; im zwischenmenschlichen Zusammenhang gibt „sanft“ die Art des Antwortens idiomatisch wieder.
- source_word: יָשִׁיב
  choice: wendet … ab
  rationale: Der Hifil von שוב bezeichnet hier das Zurück- beziehungsweise Abwenden; mit Zorn als Objekt ist „wendet … ab“ präzise und sprichwörtlich.
- source_word: חֵמָה
  choice: Zorn
  rationale: Das Wort bezeichnet heftigen, gleichsam brennenden Zorn. „Zorn“ bewahrt die Intensität und den würdevollen Ton.
- source_word: דְבַר עֶצֶב
  choice: verletzendes Wort
  rationale: Wörtlich handelt es sich um ein „Wort des Schmerzes/Kummers“. „Verletzendes Wort“ macht verständlich, dass die Rede Schmerz verursacht, ohne sie lediglich als laut oder schroff zu charakterisieren.
- source_word: יַעֲלֶה
  choice: lässt … aufsteigen
  rationale: Der Hifil von עלה bedeutet wörtlich „hinaufsteigen lassen“. Die Formulierung bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: אַף
  choice: Ärger
  rationale: Das wörtlich „Nase“ bedeutende Wort bezeichnet idiomatisch Ärger oder Zorn. „Ärger“ unterscheidet es stilistisch von חֵמָה, ohne den Parallelismus aufzuheben.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Der Gegensatz zwischen sanfter Antwort und verletzendem Wort sowie zwischen abgewendetem und aufsteigendem Zorn bleibt erhalten.
