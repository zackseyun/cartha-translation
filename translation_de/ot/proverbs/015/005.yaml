source:
  edition: WLC
  text: אֱוִ֗יל יִ֭נְאַץ מוּסַ֣ר אָבִ֑י/ו וְ/שֹׁמֵ֖ר תּוֹכַ֣חַת יַעְרִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/005.yaml
  text: A fool despises his father's discipline[a], but whoever heeds reproof is prudent.
translation:
  language: de
  text: Ein Narr verachtet die Unterweisung seines Vaters; wer aber Zurechtweisung beachtet, handelt klug.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer aber Zurechtweisung bewahrt, wird klug.“ Das mit „beachtet“ wiedergegebene hebräische Verb bedeutet wörtlich „bewahren“ oder „hüten“; das letzte Verb kann sowohl kluges Handeln als auch das Erlangen von Klugheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִיל
  choice: ein Narr
  rationale: Bezeichnet in der Weisheitsliteratur einen moralisch und praktisch unverständigen Menschen, nicht bloß jemanden mit geringer Intelligenz. „Narr“ wahrt die prägnante, kategorische Gegenüberstellung des Spruchs.
- source_word: יִנְאַץ
  choice: verachtet
  rationale: Das Verb bezeichnet geringschätzige, verächtliche Zurückweisung und ist stärker als ein bloßes Ablehnen.
- source_word: מוּסַר
  choice: Unterweisung
  rationale: Der Begriff umfasst erziehende Anleitung, Zucht und Korrektur. Im Zusammenhang väterlicher Weisheitsvermittlung gibt „Unterweisung“ die formative Bedeutung natürlich wieder, ohne sie auf Bestrafung zu verengen.
- source_word: אָבִיו
  choice: seines Vaters
  rationale: Der hebräische Text nennt ausdrücklich den Vater; diese konkrete Verwandtschaftsbezeichnung bleibt erhalten.
- source_word: וְשֹׁמֵר
  choice: wer aber … beachtet
  rationale: Wörtlich „wer bewahrt/hütet“. Im Kontext bedeutet dies, eine Zurechtweisung aufmerksam anzunehmen und sich nach ihr zu richten; „beachtet“ bewahrt den aktiven, praktischen Sinn.
- source_word: תּוֹכַחַת
  choice: Zurechtweisung
  rationale: Das Substantiv bezeichnet eine korrigierende Ermahnung oder Rüge. „Zurechtweisung“ ist im modernen Deutschen verständlich und passt zum Weisheitsregister.
- source_word: יַעְרִם
  choice: handelt klug
  rationale: Die Verbform kann kluges beziehungsweise umsichtiges Verhalten oder das Erlangen solcher Klugheit ausdrücken. „Handelt klug“ gibt die verbale Aussage natürlich wieder, ohne eine negative Bedeutung von Schlauheit einzutragen.
theological_decisions:
- issue: Geschlechtsspezifische Elternbezeichnung
  choice: seines Vaters
  alternative: seines Elternteils
  rationale: Das Hebräische nennt ausdrücklich den Vater. Eine geschlechtsneutrale Verallgemeinerung würde die konkrete Aussage des Ausgangstextes verändern.
translation_notes:
  register: Knapper, würdevoller und allgemein verständlicher Spruchstil. Das Semikolon bildet den antithetischen Parallelismus ab. „Unterweisung“ und „Zurechtweisung“ unterscheiden formende Erziehung von konkreter korrigierender Ermahnung; die Fußnote erhält die genuine lexikalische Spannweite der beiden Verben.
