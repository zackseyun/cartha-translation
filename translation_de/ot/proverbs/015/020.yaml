  text: בֵּ֣ן חָ֭כָם יְשַׂמַּח אָ֑ב וּ/כְסִ֥יל אָ֝דָ֗ם בּוֹזֶ֥ה אִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/020.yaml
  text: A wise son brings joy to his father[a], but a foolish man despises his mother.
translation:
  language: de
  text: Ein weiser Sohn macht seinem Vater Freude, aber ein törichter Mensch[a] verachtet seine Mutter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein törichter Mann«. Das hebräische Wort אָדָם bezeichnet hier einen einzelnen Menschen, nicht die Menschheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  choice: Sohn
  rationale: Das hebräische Substantiv steht im maskulinen Singular und bezeichnet im Parallelismus natürlich einen Sohn; eine Neutralisierung zu »Kind« wäre weniger formnah.
- source_word: חָכָם
  choice: weise
  rationale: In der Weisheitsliteratur bezeichnet חָכָם praktische und sittliche Weisheit; »weise« ist die natürliche deutsche Entsprechung.
- source_word: יְשַׂמַּח
  choice: macht … Freude
  rationale: Die Piel-Form drückt ein Bewirken von Freude aus. »Macht seinem Vater Freude« gibt dies in geläufigem modernem Deutsch wieder.
- source_word: אָב
  choice: seinem Vater
  rationale: Der Possessivbezug ergibt sich aus »Sohn« und wird im Deutschen idiomatisch durch »seinem« ausgedrückt.
- source_word: כְסִיל
  choice: törichter
  rationale: Das Wort bezeichnet in den Sprüchen einen sittlich und praktisch uneinsichtigen Menschen. »Töricht« bewahrt diesen Weisheitskontext besser als das stärker beschimpfende »dumm«.
- source_word: אָדָם
  choice: Mann
  rationale: אָדָם bezeichnet hier ein einzelnes Individuum und steht parallel zum »Sohn«. »Mann« wahrt den maskulinen Bezug, während »Mensch« als mögliche allgemeinere Wiedergabe in der Fußnote genannt wird.
- source_word: בּוֹזֶה
  choice: verachtet
  rationale: Das Partizip beschreibt ein kennzeichnendes Verhalten und enthält den starken Sinn, jemanden geringschätzig zu behandeln.
- source_word: אִמּוֹ
  choice: seine Mutter
  rationale: Das hebräische Wort enthält ausdrücklich das Suffix der dritten Person maskulin Singular; »seine« gibt es wieder.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe antithetische Form des Spruchs bleibt erhalten; »macht … Freude« ist idiomatisch, ohne die kausative Aussage abzuschwächen.
