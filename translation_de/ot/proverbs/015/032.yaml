source:
  edition: WLC
  text: פּוֹרֵ֣עַ מ֭וּסָר מוֹאֵ֣ס נַפְשׁ֑/וֹ וְ/שׁוֹמֵ֥עַ תּ֝וֹכַ֗חַת ק֣וֹנֶה לֵּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/032.yaml
  text: Whoever ignores discipline despises himself, but he who listens to reproof gains understanding.
translation:
  language: de
  text: Wer Erziehung missachtet, verachtet sich selbst; wer aber auf Zurechtweisung hört, gewinnt Einsicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פּוֹרֵעַ מוּסָר
  choice: Zucht verwirft
  rationale: פּוֹרֵעַ bezeichnet hier das Abweisen oder Missachten von מוּסָר, also erziehender Unterweisung und Korrektur. „Zucht“ bewahrt die prägnante Weisheitssprache, ohne auf bloße Bestrafung beschränkt zu sein.
- source_word: מוֹאֵס נַפְשׁוֹ
  choice: verachtet sich selbst
  rationale: נֶפֶשׁ bezeichnet hier die eigene Person bzw. das eigene Selbst. Die Wendung drückt aus, dass die Ablehnung von Zucht dem eigenen Wohl zuwiderläuft.
- source_word: שׁוֹמֵעַ תּוֹכַחַת
  choice: auf Zurechtweisung hört
  rationale: שׁמע meint in diesem Zusammenhang nicht nur akustisches Hören, sondern aufmerksames und annehmendes Hören; תּוֹכַחַת ist korrigierende Zurechtweisung.
- source_word: קֹנֶה לֵב
  choice: gewinnt Einsicht
  rationale: קנה bedeutet „erwerben/gewinnen“; לֵב steht in der hebräischen Anthropologie hier für inneres Urteils- und Erkenntnisvermögen. „Einsicht“ gibt die idiomatische Bedeutung natürlich wieder.
theological_decisions:
- issue: Bedeutung von נַפְשׁוֹ
  choice: sich selbst
  alternative: sein Leben / seine Seele
  rationale: Der Vers spricht von der eigenen Person und ihrem Wohl; „sich selbst“ vermeidet eine unnötige Festlegung auf eine Leib-Seele-Dichotomie.
- issue: Bedeutung von קֹנֶה לֵב
  choice: gewinnt Einsicht
  alternative: erwirbt ein Herz
  rationale: Die wörtliche Metapher bleibt im Deutschen schwer verständlich. „Einsicht“ vermittelt die im Kontext gemeinte Fähigkeit zu verständigem Urteil, ohne eine besondere dogmatische Deutung einzutragen.
translation_notes:
  register: Prägnanter, würdevoller Weisheitsspruch in modernem Standarddeutsch. Die antithetische Parallelstruktur wurde erhalten; „Zucht“ und „Zurechtweisung“ geben den erzieherisch-korrigierenden Wortschatz des Hebräischen wieder.
