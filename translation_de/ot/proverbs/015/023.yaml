  text: שִׂמְחָ֣ה לָ֭/אִישׁ בְּ/מַעֲנֵה פִ֑י/ו וְ/דָבָ֖ר בְּ/עִתּ֣/וֹ מַה טּֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/023.yaml
  text: A man has joy in the answer of his mouth[b][a], and a word in its time—how good it is!
translation:
  language: de
  text: Ein Mann freut sich über die Antwort, die er gibt[a], und wie gut ist ein Wort zu seiner Zeit[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Freude ist einem Mann an der Antwort seines Mundes.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zur rechten Zeit«; auch: »im rechten Augenblick« oder »zur passenden Zeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחָה לָאִישׁ
  choice: Ein Mann freut sich
  rationale: Die hebräische Nominalkonstruktion bedeutet wörtlich etwa »Freude ist einem Mann«. Die verbale Wiedergabe ist im Deutschen natürlich und bewahrt den Gedanken, dass der Sprecher Freude an seiner Antwort hat.
- source_word: בְּמַעֲנֵה פִיו
  choice: über die Antwort seines Mundes
  rationale: מַעֲנֶה bezeichnet eine Antwort oder Erwiderung; פִיו heißt wörtlich »sein Mund«. Die Formulierung bewahrt das hebräische Körperteilbild, obwohl »über seine Antwort« idiomatischer wäre.
- source_word: וְדָבָר
  choice: und ein Wort
  rationale: דָבָר kann »Wort«, »Aussage« oder »Sache« bedeuten. Im Parallelismus zur mündlichen Antwort bezeichnet es hier am ehesten ein gesprochenes Wort.
- source_word: בְּעִתּוֹ
  choice: zu seiner Zeit
  rationale: Die Wendung heißt formal »zu/in seiner Zeit« und bezeichnet ein Wort, das im passenden Augenblick gesprochen wird. Die Übersetzung erhält die Bildweise und lässt die zeitliche Angemessenheit erkennen.
- source_word: מַה־טּוֹב
  choice: wie gut ist es!
  rationale: מַה mit dem Adjektiv bildet hier einen Ausruf. Die deutsche Form gibt dessen wertende und freudige Kraft wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der repräsentative maskuline Singular des Hebräischen bleibt mit »ein Mann« erhalten. Das ungewöhnliche Bild »Antwort seines Mundes« wird aus Gründen der formalen Nähe bewahrt und in der Fußnote idiomatisch erläutert.
