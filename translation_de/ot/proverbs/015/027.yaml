source:
  edition: WLC
  text: עֹכֵ֣ר בֵּ֭ית/וֹ בּוֹצֵ֣עַ בָּ֑צַע וְ/שׂוֹנֵ֖א מַתָּנֹ֣ת יִחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/027.yaml
  text: Whoever is greedy for gain troubles his own house[a], but he who hates bribes will live.
translation:
  language: de
  text: Wer nach Gewinn giert, bringt sein eigenes Haus ins Unglück; wer aber Bestechungsgeschenke hasst, wird leben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹכֵר
  choice: bringt … ins Unglück
  rationale: Das Partizip von עכר bezeichnet das Verursachen von Unheil oder schwerer Bedrängnis. Die Wendung ist im Deutschen natürlich und vermeidet die mögliche Verharmlosung durch „beunruhigt“.
- source_word: בֵּיתוֹ
  choice: sein eigenes Haus
  rationale: בַּיִת kann Haus, Hausgemeinschaft oder Familie bezeichnen. „Sein eigenes Haus“ bewahrt das hebräische Bild und lässt die weitere Bedeutung des Haushalts mitschwingen.
- source_word: בּוֹצֵעַ בָּצַע
  choice: auf unlauteren Gewinn aus ist
  rationale: Die Verbindung aus stammverwandtem Verb und Substantiv hebt ein habgieriges Gewinnstreben hervor; בֶּצַע trägt häufig den Beiklang unrechtmäßigen oder skrupellosen Profits. „Unlauter“ gibt diesen moralischen Beiklang wieder, ohne eine bestimmte Form des Unrechts festzulegen.
- source_word: וְשׂוֹנֵא
  choice: wer aber … hasst
  rationale: Das וְ ist innerhalb des antithetischen Parallelismus sinnvoll kontrastiv wiedergegeben. Die kräftige Aussage „hasst“ entspricht שׂנא.
- source_word: מַתָּנוֹת
  choice: Bestechungsgeschenke
  rationale: Das Wort bedeutet allgemein „Geschenke/Gaben“, bezeichnet hier im Gegensatz zum unlauteren Gewinn aber wahrscheinlich Zuwendungen, die den Empfänger bestechen sollen. Das zusammengesetzte deutsche Wort macht den Kontext deutlich; die weitere Grundbedeutung bleibt in der Fußnote erhalten.
- source_word: יִחְיֶה
  choice: wird leben
  rationale: Die knappe Wiedergabe bewahrt die Offenheit zwischen Fortleben, Bewahrung und einem gedeihlichen Leben, ohne die Verheißung näher festzulegen.
theological_decisions:
- issue: Reichweite der Zusage „wird leben“
  choice: Die offene Formulierung „wird leben“ wird beibehalten.
  alternative: „wird am Leben bleiben“ oder „wird gedeihen“
  rationale: Der hebräische Ausdruck kann Überleben, Lebensbewahrung und Wohlergehen anklingen lassen. Eine engere Wiedergabe würde die weisheitliche Spannung unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Spruchstruktur. Der Kontrast der beiden Halbverse bleibt deutlich; das Bild vom eigenen Haus und die offene Lebenszusage werden bewahrt.
