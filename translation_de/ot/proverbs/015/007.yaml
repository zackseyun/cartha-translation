source:
  edition: WLC
  text: שִׂפְתֵ֣י חֲ֭כָמִים יְזָ֣רוּ דָ֑עַת וְ/לֵ֖ב כְּסִילִ֣ים לֹא כֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/007.yaml
  text: The lips of the wise spread knowledge[b][a], but the heart of fools is not so.
translation:
  language: de
  text: Die Lippen der Weisen streuen Erkenntnis aus[a], aber das Herz der Toren ist nicht so[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verbreiten Erkenntnis«. Das hebräische Verb bezeichnet eigentlich das Ausstreuen oder Zerstreuen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich und im Hebräischen knapp: »aber das Herz der Toren nicht so«. Welche Aussage hier genau zu ergänzen ist, bleibt offen; der Satz bildet einen Kontrast zu den Lippen der Weisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי חֲכָמִים
  choice: die Lippen der Weisen
  rationale: Bewahrt das konkrete Bild der Lippen und gibt die substantivierte Mehrzahl חֲכָמִים geschlechtsübergreifend und idiomatisch als »die Weisen« wieder.
- source_word: יְזָרוּ
  choice: streuen … aus
  rationale: זרה bezeichnet das Streuen oder Zerstreuen. »Ausstreuen« erhält dieses Bild und ist mit »Erkenntnis« im Deutschen verständlich.
- source_word: דָעַת
  choice: Erkenntnis
  rationale: »Erkenntnis« ist in der Weisheitsliteratur eine natürliche und prägnante Wiedergabe von דַּעַת; gemeint ist nicht bloß eine Ansammlung von Informationen.
- source_word: לֵב כְּסִילִים
  choice: das Herz der Toren
  rationale: Bewahrt »Herz« als zentralen Begriff für das innere Denken und Wollen sowie כְּסִילִים als ethisch geprägte Bezeichnung »Toren«.
- source_word: לֹא כֵן
  choice: ist nicht so
  rationale: Die knappe, elliptische Formulierung des Hebräischen bleibt erhalten, ohne ausdrücklich zu ergänzen, was das Herz der Toren stattdessen tut.
theological_decisions:
- issue: Bezug der elliptischen zweiten Vershälfte
  choice: Die Ellipse wird als »ist nicht so« bewahrt.
  alternative: »verbreitet keine Erkenntnis« oder »handelt nicht so«
  rationale: Der hebräische Text lässt unausgesprochen, in welcher genauen Hinsicht das Herz der Toren »nicht so« ist. Eine ausformulierte Aussage würde diese Offenheit stärker festlegen als die Vorlage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Bildsprache. »Toren« entspricht dem etablierten weisheitlichen Sprachgebrauch; die ungewöhnliche Kürze der zweiten Hälfte bleibt bewusst hörbar.
