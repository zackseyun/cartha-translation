id: PRO.15.14
reference: Proverbs 15:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֵ֣ב נָ֭בוֹן יְבַקֶּשׁ דָּ֑עַת ו/פני כְ֝סִילִ֗ים יִרְעֶ֥ה אִוֶּֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/014.yaml
  text: The heart of the discerning seeks knowledge[a], but the face of fools feeds on folly.
translation:
  language: de
  text: Das Herz eines Verständigen sucht Erkenntnis, doch das Gesicht[a] der Toren nährt sich von Torheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Gesicht der Toren“. Manche Übersetzungen geben sinngemäß „der Mund der Toren“ wieder, weil dies besser zum Bild des Sichnährens passt.'
    reason: alternative_rendering
lexical_decisions:
- source_word: לֵב
  choice: Herz
  rationale: Bewahrt das hebräische Bild für das innere Zentrum von Denken, Wollen und Urteilen, ohne es auf den bloßen Verstand zu verengen.
- source_word: נָבוֹן
  choice: eines Verständigen
  rationale: Bezeichnet einen Menschen mit Einsicht und Urteilsvermögen; die substantivierte Form klingt im Deutschen würdig und klar.
- source_word: יְבַקֶּשׁ
  choice: sucht
  rationale: Gibt das aktive und zielgerichtete Streben der Piel-Form knapp und idiomatisch wieder.
- source_word: דָּעַת
  choice: Erkenntnis
  rationale: Passt zum weisheitlichen Zusammenhang und bezeichnet erworbenes Wissen samt Einsicht.
- source_word: וּפְנֵי
  choice: doch das Gesicht
  rationale: Folgt der überlieferten masoretischen Lesart פְנֵי („Gesicht/Angesicht“) und bewahrt dadurch das auffällige Bild, statt es stillschweigend zu „Mund“ zu glätten.
- source_word: כְסִילִים
  choice: der Toren
  rationale: Gibt den für die Sprüche typischen moralisch-geistigen Gegenbegriff zum Weisen angemessen wieder.
- source_word: יִרְעֶה
  choice: nährt sich von
  rationale: Das Verb bedeutet wörtlich „weiden/grasen“; „nährt sich von“ überträgt das Bild verständlich und erhält die Vorstellung fortgesetzter Aufnahme.
- source_word: אִוֶּלֶת
  choice: Torheit
  rationale: Der geläufige weisheitliche Gegenbegriff zu Weisheit und Erkenntnis.
theological_decisions: []
