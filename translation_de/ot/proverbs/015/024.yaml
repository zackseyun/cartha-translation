source:
  edition: WLC
  text: אֹ֣רַח חַ֭יִּים לְ/מַ֣עְלָ/ה לְ/מַשְׂכִּ֑יל לְמַ֥עַן ס֝֗וּר מִ/שְּׁא֥וֹל מָֽטָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/024.yaml
  text: The path of life leads upward for the prudent, so that he may turn away from Sheol below.
translation:
  language: de
  text: Für den Einsichtigen führt der Weg des Lebens nach oben, damit er dem Totenreich[a] unten entgeht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: Scheol, der Bereich der Toten.'
    reason: Erklärt den hebräischen Begriff, ohne ihn mit „Hölle“ gleichzusetzen.
lexical_decisions:
- source_word: אֹרַח חַיִּים (ʾoraḥ ḥayyîm)
  choice: der Weg des Lebens
  rationale: Gibt die hebräische Genitivverbindung knapp und bildhaft wieder; gemeint ist ein Lebensweg, der zum Leben führt beziehungsweise vom Leben geprägt ist.
- source_word: לְמַשְׂכִּיל (ləmaśkîl)
  choice: für den Einsichtigen
  rationale: מַשְׂכִּיל bezeichnet einen Menschen, der verständig und mit Einsicht handelt. „Einsichtiger“ ist im modernen Deutsch natürlich und bewahrt den weisheitlichen Akzent.
- source_word: לְמַעְלָה (ləmaʿlāh)
  choice: nach oben
  rationale: Bewahrt den räumlichen Kontrast zum ausdrücklich genannten „unten“ und vermeidet eine vorschnelle rein geistliche Ausdeutung.
- source_word: סוּר (sûr)
  choice: entgeht
  rationale: Das Verb bedeutet grundsätzlich „abweichen, sich abwenden, fernbleiben“. Im Zusammenhang mit dem Totenreich drückt „entgehen“ idiomatisch das Meiden dieses Ziels aus.
- source_word: שְׁאוֹל (šəʾôl)
  choice: Totenreich
  rationale: Bezeichnet in der Hebräischen Bibel den Bereich der Toten. „Totenreich“ ist im Deutschen verständlicher als die unübersetzte Form „Scheol“, ohne den Ausdruck mit einer späteren spezifischen Höllenvorstellung gleichzusetzen.
theological_decisions:
- issue: Ziel- oder Folgesatz bei לְמַעַן
  choice: damit
  alternative: sodass
  rationale: לְמַעַן bezeichnet gewöhnlich Zweck oder Ziel. „Damit“ bewahrt diese Ausrichtung, ohne im Deutschen mehr über das handelnde Subjekt festzulegen, als der knappe hebräische Satz erkennen lässt.
- issue: Vertikaler Gegensatz zwischen Leben und Scheol
  choice: „nach oben“ und „unten“ wörtlich beibehalten
  alternative: als rein moralischen oder himmlisch-jenseitigen Gegensatz paraphrasieren
  rationale: Der hebräische Text stellt ausdrücklich לְמַעְלָה und מָטָּה gegenüber. Die Übersetzung bewahrt dieses Bild und lässt dessen weisheitliche und theologische Tragweite offen.
translation_notes:
  register: Moderne, klare und würdige Weisheitssprache. Die im Hebräischen fehlende Kopula beziehungsweise das fehlende ausdrückliche Verb wird mit „führt“ natürlich ergänzt; der prägnante Gegensatz „nach oben – unten“ bleibt erhalten.
