  text: לְשׁ֣וֹן חֲ֭כָמִים תֵּיטִ֣יב דָּ֑עַת וּ/פִ֥י כְ֝סִילִ֗ים יַבִּ֥יעַ אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/002.yaml
  text: The tongue of the wise makes knowledge good[b][a], but the mouth of fools pours out folly.
translation:
  language: de
  text: Die Zunge der Weisen bringt Erkenntnis gut zur Geltung[a], doch der Mund der Toren lässt Torheit hervorquellen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »macht Erkenntnis gut«. Gemeint sein kann auch: »geht gut mit Erkenntnis um«, »schmückt Erkenntnis« oder »stellt Erkenntnis ansprechend dar«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sprudelt Torheit hervor« beziehungsweise »schüttet Torheit aus«. Das hebräische Verb beschreibt etwas, das in großer Menge hervorströmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן
  choice: Zunge
  rationale: Bewahrt das konkrete Körperbild des Hebräischen für das Reden und entspricht dem parallelen »Mund« im zweiten Versglied.
- source_word: חֲכָמִים
  choice: der Weisen
  rationale: Gibt das substantivierte Adjektiv als allgemeine Personengruppe wieder, ohne das Geschlecht unnötig festzulegen.
- source_word: תֵּיטִיב
  choice: vermittelt ... auf gute Weise
  rationale: Der Hifil von יטב bezeichnet ein Gutmachen beziehungsweise gutes Handhaben. Die Formulierung ist im Deutschen natürlich und lässt offen, ob die Erkenntnis gut eingesetzt oder ansprechend dargeboten wird.
- source_word: דָּעַת
  choice: Erkenntnis
  rationale: Passt zum weisheitlichen Gebrauch von דעת und bezeichnet nicht nur angesammeltes Wissen, sondern sachgemäßes Erkennen.
- source_word: וּפִי
  choice: doch der Mund
  rationale: Das Waw wird wegen des deutlichen Gegensatzes adversativ wiedergegeben; »Mund« bewahrt die Bildsprache und den Parallelismus.
- source_word: כְסִילִים
  choice: der Toren
  rationale: »Toren« ist die knappe, im Buch der Sprüche geläufige Bezeichnung für die moralisch und geistig Unverständigen.
- source_word: יַבִּיעַ
  choice: lässt ... hervorquellen
  rationale: Bewahrt das Bild eines reichlichen, nahezu unkontrollierten Hervorströmens und klingt im modernen Deutschen verständlich.
- source_word: אִוֶּלֶת
  choice: Torheit
  rationale: Ist die etablierte und prägnante Wiedergabe der abstrakten törichten Haltung beziehungsweise Äußerung in der Weisheitsliteratur.
