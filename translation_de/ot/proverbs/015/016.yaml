  text: טוֹב מְ֭עַט בְּ/יִרְאַ֣ת יְהוָ֑ה מֵ/אוֹצָ֥ר רָ֝֗ב וּ/מְה֥וּמָה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/016.yaml
  text: Better is a little with the fear of Yahweh than great treasure with turmoil[a].
translation:
  language: de
  text: Besser wenig mit der Furcht Jahwes als ein großer Schatz und Unruhe dabei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und Verwirrung darin« beziehungsweise »und Bestürzung dabei«. Das hebräische Wort kann Unruhe, Verwirrung, Bestürzung oder Tumult bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב מְעַט
  choice: Besser wenig
  rationale: טוֹב hat in diesem vergleichenden Spruch die idiomatische Bedeutung „besser“. Die knappe, verblose Form des Hebräischen lässt sich im Deutschen natürlich mit „Besser wenig“ wiedergeben.
- source_word: בְּיִרְאַת יְהוָה
  choice: in der Furcht Jahwes
  rationale: Die Präposition ב bezeichnet hier den begleitenden Lebenszusammenhang. „Furcht Jahwes“ bewahrt den prägenden Weisheitsbegriff, der ehrfürchtige Gottesbezogenheit einschließt und nicht auf bloße Angst verengt werden darf.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: מֵאוֹצָר רָב
  choice: als ein großer Schatz
  rationale: מִן markiert den Vergleich; אוֹצָר bezeichnet angesammelten Besitz oder Reichtum, und רָב hebt dessen Größe beziehungsweise Fülle hervor.
- source_word: וּמְהוּמָה בוֹ
  choice: und Unruhe dabei
  rationale: מְהוּמָה kann Unruhe, Wirrwarr oder Verwirrung bezeichnen. בוֹ verweist wahrscheinlich auf den großen Schatz und wird idiomatisch als „dabei“ wiedergegeben, ohne die räumliche Alternative „darin“ auszuschließen.
theological_decisions:
- issue: Bedeutung von „Furcht Jahwes“ in der Weisheitsliteratur
  choice: Die feste Wendung „Furcht Jahwes“ bleibt im Haupttext erhalten.
  alternative: „Ehrfurcht vor Jahwe“
  rationale: „Ehrfurcht“ wäre unmittelbar verständlicher, würde den vielschichtigen theologischen Leitbegriff jedoch interpretierend verengen. „Furcht Jahwes“ bewahrt seine kanonische Spannung zwischen Scheu, Ehrfurcht, Gehorsam und Gottesbezogenheit.
- issue: Bezug von בוֹ
  choice: „dabei“ bezieht die Unruhe auf den großen Schatz beziehungsweise den mit ihm verbundenen Zustand.
  alternative: „darin“
  rationale: Das maskuline Singularsuffix kann grammatisch auf אוֹצָר zurückweisen. „Dabei“ ist im Deutschen natürlich und wahrt, dass die Unruhe den Reichtum begleitet; die stärker räumliche Lesart wird in der Fußnote genannt.
translation_notes:
  register: Knappes, sprichwortartiges Standarddeutsch. Die traditionelle theologische Wendung „Furcht Jahwes“ bleibt bewusst erhalten; Satzbau und Vergleich sind zugleich für heutige Leser unmittelbar verständlich.
