  text: מַרְפֵּ֣א לָ֭שׁוֹן עֵ֣ץ חַיִּ֑ים וְ/סֶ֥לֶף בָּ֝֗/הּ שֶׁ֣בֶר בְּ/רֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/004.yaml
  text: A healing tongue is a tree of life[b][a], but perverseness in it is a breaking of the spirit.
translation:
  language: de
  text: Eine heilsame Zunge[a] ist ein Baum des Lebens, doch Verdrehtheit in ihr bricht den Geist[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Eine heilende Zunge«; מַרְפֵּא kann Heilung, Gesundheit oder Heilsamkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »doch Verdrehtheit in ihr ist ein Bruch im Geist«.'
    reason: literal_rendering
lexical_decisions:
- source_word: מַרְפֵּא
  choice: heilsam
  rationale: Das Substantiv bezeichnet Heilung, Gesundheit oder ein Heilmittel. »Heilsam« gibt die wiederherstellende Wirkung idiomatisch wieder, ohne sie auf bloße Sanftheit zu verengen.
- source_word: לָשׁוֹן
  choice: Zunge
  rationale: Die wörtliche Körpermetapher steht zugleich für das Sprechen. »Zunge« bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: עֵץ חַיִּים
  choice: ein Baum des Lebens
  rationale: Die unbestimmte Form entspricht dem artikellosen hebräischen Ausdruck und bewahrt zugleich dessen Anklang an weitere biblische Lebensbaum-Texte, ohne ihn ausdrücklich mit dem Baum in Eden gleichzusetzen.
- source_word: סֶלֶף
  choice: Verdrehtheit
  rationale: Der Ausdruck bezeichnet Verkehrung oder Verkrümmung. »Verdrehtheit« ist gegenwärtig verständlich und bewahrt sowohl die bildliche als auch die moralische Dimension.
- source_word: בָּהּ
  choice: an ihr
  rationale: Das feminine Suffix bezieht sich am natürlichsten auf die Zunge. »An ihr« kennzeichnet die Verdrehtheit als Eigenschaft beziehungsweise Erscheinung der Zunge.
- source_word: שֶׁבֶר
  choice: bricht
  rationale: Das hebräische Substantiv bezeichnet Bruch, Zerbrechen oder Zusammenbruch. Die verbale Wiedergabe »bricht« erhält das konkrete Bild und ergibt im Deutschen einen natürlichen, kraftvollen Gegensatz.
- source_word: בְּרוּחַ
  choice: den Geist
  rationale: רוּחַ bezeichnet hier im Kontext menschlicher Rede am ehesten den inneren Geist beziehungsweise die innere Lebenskraft eines Menschen. Als Objekt von »bricht« wird die zerstörerische Wirkung idiomatisch ausgedrückt.
theological_decisions:
- issue: Bezug von רוּחַ
  choice: menschlicher Geist beziehungsweise inneres Wesen
  alternative: der göttliche Geist
  rationale: Der Spruch stellt die belebende und die zerstörerische Wirkung menschlicher Rede gegenüber. Daher liegt der menschliche Geist näher; die Wiedergabe vermeidet eine ausdrückliche Gleichsetzung mit dem Heiligen Geist.
- issue: Bildgehalt von עֵץ חַיִּים
  choice: ein Baum des Lebens
  alternative: der Baum des Lebens / ein lebenspendender Baum
  rationale: Die Formulierung bewahrt die weisheitliche und biblische Resonanz, ohne eine exklusive Identifikation mit dem Baum im Garten Eden zu erzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Zungen- und Lebensbaum-Metaphorik bleibt erhalten; der zweite Halbvers wird zur besseren deutschen Verständlichkeit verbal formuliert. Die Fußnoten dokumentieren die lexikalische Spannweite und die nominale Gestalt des Hebräischen.
