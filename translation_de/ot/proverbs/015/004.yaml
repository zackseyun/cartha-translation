revisions:
- from: Eine heilsame Zunge[a] ist ein Baum des Lebens, doch Verdrehtheit an ihr bricht den Geist[b].
  to: Eine heilsame Zunge[a] ist ein Baum des Lebens, doch Verdrehtheit in ihr bricht den Geist[b].
  rationale: Die sichere Korrektur beschränkt sich auf „an ihr“ → „in ihr“ im Haupttext und in der dazugehörigen Fußnote. Damit wird die hebräische Präposition בָּהּ genauer wiedergegeben, ohne die Aussage, Bildsprache oder die deutsche idiomatische verbale Auflösung von שֶׁבֶר zu verändern.
