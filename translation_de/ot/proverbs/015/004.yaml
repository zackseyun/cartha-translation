review_pass:
  verdict: revise
  source_fidelity: 'Der erste Halbvers gibt מַרְפֵּא לָשׁוֹן und עֵץ חַיִּים treffend wieder. Im zweiten Halbvers sollte בָּהּ jedoch mit „in ihr“ statt „an ihr“ wiedergegeben werden: Die Präposition ב bezeichnet hier das Vorhandensein der Verkehrtheit innerhalb der bildlich für Rede stehenden Zunge. Die verbale Auflösung von nominalem שֶׁבֶר zu „bricht“ ist als idiomatische deutsche Wiedergabe vertretbar und bewahrt die zerstörerische Wirkung auf den menschlichen Geist.'
  naturalness: „Eine heilsame Zunge ist ein Baum des Lebens“ ist würdevoll und gut verständlich. „Verdrehtheit“ ist als abstrakter Weisheitsausdruck möglich; mit „in ihr“ ist der zweite Halbvers zugleich idiomatischer und genauer als mit „an ihr“.
  terminology: „Heilsam“, „Zunge“, „Baum des Lebens“ und „Geist“ sind angemessen. „Geist“ ist hier ohne Großschreibung und ohne zusätzliche dogmatische Präzisierung als menschlicher innerer Geist zu verstehen. Die Fußnote zu מַרְפֵּא bietet eine sinnvolle lexikalische Alternative; die zweite Fußnote soll die Präposition entsprechend berichtigen.
  issues:
  - severity: medium
    issue: „an ihr“ gibt בָּהּ ungenau wieder.
    rationale: Das Präfix בְּ bedeutet hier „in“; „an“ legt im Deutschen eher eine äußerliche Anhaftung nahe und schwächt den Bezug zur in der Rede/Zunge vorhandenen Verkehrtheit ab.
  revised_text: Eine heilsame Zunge[a] ist ein Baum des Lebens, doch Verdrehtheit in ihr bricht den Geist[b].
