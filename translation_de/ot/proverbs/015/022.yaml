  text: הָפֵ֣ר מַ֭חֲשָׁבוֹת בְּ/אֵ֣ין ס֑וֹד וּ/בְ/רֹ֖ב יוֹעֲצִ֣ים תָּקֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/022.yaml
  text: Plans fail for lack of counsel[a], but with many advisers they stand.
translation:
  language: de
  text: Pläne scheitern ohne Beratung[a]; doch mit vielen Ratgebern haben sie Bestand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pläne werden ohne Beratung vereitelt; doch mit vielen Ratgebern werden sie gefestigt.“ Das hebräische Wort für „Beratung“ kann auch eine vertrauliche Aussprache bezeichnen.'
    reason: 'Lexikalische Alternative: הָפֵר kann „vereitelt werden“ bedeuten; סוֹד kann neben Beratung eine vertrauliche Aussprache meinen; תָּקוּם kann mit „werden gefestigt“ wiedergegeben werden.'
lexical_decisions:
- source_word: הָפֵר
  choice: scheitern
  rationale: Die Hifil-Form von פרר bezeichnet das Vereiteln oder Zunichtemachen. Mit „Pläne“ als Subjekt gibt „scheitern“ das Ergebnis im Deutschen natürlich und knapp wieder.
- source_word: מַחֲשָׁבוֹת
  choice: Pläne
  rationale: Das Wort kann Gedanken, Absichten oder Vorhaben bezeichnen. Der Zusammenhang mit Beratung und Bestand weist hier auf konkrete Pläne beziehungsweise Vorhaben.
- source_word: בְּאֵין
  choice: wenn … fehlt
  rationale: Die Verbindung bezeichnet das Nichtvorhandensein von etwas. Der konditionale Ausdruck ist im Deutschen idiomatisch und lässt zugleich den sachlichen Zusammenhang erkennen.
- source_word: סוֹד
  choice: Beratung
  rationale: סוֹד kann einen vertraulichen Kreis, vertrauliche Aussprache oder gemeinsame Beratung bezeichnen. Im Gegensatz zu den vielen Ratgebern steht hier der Vorgang der Beratung im Vordergrund, nicht Geheimhaltung.
- source_word: וּבְרֹב
  choice: doch bei vielen
  rationale: Das ו leitet den Gegensatz der zweiten Vershälfte ein; רֹב bezeichnet eine große Zahl oder Fülle. „Doch bei vielen“ bewahrt die knappe antithetische Form.
- source_word: יוֹעֲצִים
  choice: Ratgebern
  rationale: Das aktive Partizip von יעץ bezeichnet Menschen, die Rat geben. „Ratgeber“ ist verständlich und entspricht dem Weisheitskontext.
- source_word: תָּקוּם
  choice: haben sie Bestand
  rationale: קום bedeutet hier „stehen“ beziehungsweise „Bestand haben, gefestigt sein“. Das feminine Singularverb kann sich kollektiv auf die zuvor genannten Pläne beziehen; im Deutschen wird dieser Bezug natürlich im Plural aufgenommen.
theological_decisions: []
translation_notes:
  register: Knappe, antithetische Spruchform in modernem Standarddeutsch. „Haben sie Bestand“ bewahrt das Bild des hebräischen קום, ohne im Deutschen unnatürlich zu wirken.
