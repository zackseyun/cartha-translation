    issue: „wenn Beratung fehlt“ für בְּאֵין
    rationale: Die hebräische Wendung bezeichnet unmittelbar das Fehlen bzw. Nichtvorhandensein. „Ohne Beratung“ bewahrt dies knapper und ohne zusätzliche Konditionalstruktur.
  - severity: medium
    issue: „bei vielen Ratgebern“ für וּבְרֹב יוֹעֲצִים
    rationale: „Bei“ ist im Deutschen hier weniger idiomatisch und kann lokal oder bloß umständebeschreibend verstanden werden. „Mit vielen Ratgebern“ gibt die relationale bzw. unterstützende Funktion der Ratgebenden genauer wieder.
  - severity: low
    issue: 'Fußnote: „gemeinsame Beratung“'
    rationale: סוֹד kann Beratung, vertrauliche Aussprache oder einen vertrauten Kreis bezeichnen, verlangt aber nicht ausdrücklich die Bedeutung „gemeinsam“. Die Alternative sollte diese Einengung vermeiden.
