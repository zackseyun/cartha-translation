id: PRO.15.19
reference: Proverbs 15:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דֶּ֣רֶךְ עָ֭צֵל כִּ/מְשֻׂ֣כַת חָ֑דֶק וְ/אֹ֖רַח יְשָׁרִ֣ים סְלֻלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/019.yaml
  text: The way of the lazy is like a hedge of thorns[a], but the path of the upright is a raised highway.
translation:
  language: de
  text: Der Weg des Faulen ist wie eine Dornenhecke, doch der Pfad der Aufrichtigen ist eine aufgeschüttete Straße.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist eben / gut gebahnt«. Das hebräische Wort kann eine aufgeschüttete, ausgebaute Straße und daraus folgend einen freien, ungehinderten Weg bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: Weg
  rationale: Bewahrt den sprichwörtlichen und übertragenen Sinn eines Lebenswandels und ist zugleich natürliches modernes Deutsch.
- source_word: עָצֵל
  choice: des Faulen
  rationale: Bezeichnet einen gewohnheitsmäßig trägen Menschen; die substantivierte Form gibt den generischen Singular knapp und verständlich wieder.
- source_word: כִּמְשֻׂכַת
  choice: wie eine Hecke
  rationale: Das Präfix כְּ kennzeichnet den Vergleich; מְשֻׂכָה bezeichnet eine Hecke oder absperrende Einfriedung.
- source_word: חָדֶק
  choice: Dornenhecke
  rationale: Das Wort bezeichnet dorniges Gestrüpp beziehungsweise einen Dornbusch; im Kompositum entsteht ein klares Bild eines schmerzhaften Hindernisses.
- source_word: אֹרַח
  choice: Pfad
  rationale: Das nahe Synonym zu דֶּרֶךְ bleibt im selben Bildfeld; »Pfad« sorgt für natürliche Variation.
- source_word: יְשָׁרִים
  choice: der Aufrichtigen
  rationale: Gibt die ethische Bedeutung von moralisch geraden, redlichen Menschen wieder, ohne sie enger als »Gerechte« festzulegen.
- source_word: סְלֻלָה
  choice: ist eine aufgeschüttete Straße
  rationale: Die Form von סלל bezeichnet etwas Aufgeschüttetes beziehungsweise einen gebauten, gebahnten Straßendamm. Die Wiedergabe erhält das konkrete Bild und lässt die daraus folgende Bedeutung eines freien, gut begehbaren Weges erkennen.
theological_decisions:
- issue: Gegensatz zwischen dem Weg des Faulen und dem Pfad der Aufrichtigen
  choice: Die bildhafte moralische Gegenüberstellung bleibt ohne zusätzliche Erklärung stehen.
  alternative: Den zweiten Halbvers ausdrücklich als »ebenen« oder »hindernisfreien Weg« deuten.
  rationale: Der hebräische Text stellt die Bilder direkt nebeneinander; eine explizite Auslegung würde die offene Bildwirkung und die Bedeutungsbreite von סְלֻלָה unnötig einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwörtlicher Parallelstruktur. »Dornenhecke« ist anschaulich und idiomatisch; »aufgeschüttete Straße« bewahrt bewusst das konkrete Straßenbaubild des Hebräischen.
