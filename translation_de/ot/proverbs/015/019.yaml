  terminology: »Fauler« und »Aufrichtige« treffen den ethisch-praktischen Charakter der Personenbezeichnungen ohne konfessionelle Zuspitzung. Die Variation »Weg/Pfad« ist stilistisch natürlich und verursacht keinen Bedeutungsverlust.
