source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה מַחְשְׁב֣וֹת רָ֑ע וּ֝/טְהֹרִ֗ים אִמְרֵי נֹֽעַם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/026.yaml
  text: Evil plans are an abomination to Yahweh[b][a], but pleasant words are pure.
translation:
  language: de
  text: Böse Pläne[a] sind Jahwe ein Gräuel, doch freundliche Worte[b] sind rein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „böse Gedanken“; auch „böse Absichten“ oder „böse Anschläge“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und rein sind Worte der Annehmlichkeit“; auch: „liebliche“ oder „angenehme Worte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: ein Gräuel
  rationale: Die Konstruktverbindung bezeichnet etwas, das Jahwe zutiefst verabscheut. „Ein Gräuel“ bewahrt die starke moralische Wertung und ist im Deutschen bibelsprachlich, aber weiterhin verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: מַחְשְׁבוֹת רָע
  choice: böse Pläne
  rationale: מַחְשְׁבוֹת kann Gedanken, Absichten, Pläne oder Anschläge bezeichnen. Im Kontext gibt „Pläne“ den zielgerichteten Sinn natürlich wieder, ohne die Formulierung auf bereits ausgeführte Taten zu verengen.
- source_word: וּטְהֹרִים
  choice: doch … sind rein
  rationale: Das Waw verbindet die Vershälften; wegen des antithetischen Parallelismus ist „doch“ im Deutschen angemessen. Das vorangestellte Prädikatsadjektiv טְהֹרִים wird in natürliche deutsche Wortstellung gebracht.
- source_word: אִמְרֵי נֹעַם
  choice: Worte, die guttun
  rationale: Die Konstruktverbindung meint Worte der Annehmlichkeit, Lieblichkeit oder Wohltat. Die Formulierung ist natürlich und wahrt die positive Wirkung der Worte, ohne נֹעַם ausschließlich als Höflichkeit oder als theologische „Gnade“ zu deuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration bewahrt diese Unterscheidung gegenüber dem Titel אֲדֹנָי; die deutsche Schreibweise „Jahwe“ entspricht dem Zielregister.
- issue: Bezug von „rein“ auf wohltuende Worte
  choice: 'Die Aussage bleibt als Prädikation stehen: Die Worte sind rein.'
  alternative: Die Worte als von Jahwe für rein beziehungsweise angenehm beurteilt paraphrasieren
  rationale: Der knappe hebräische Parallelismus erklärt weder ausdrücklich, in welchem Sinn die Worte rein sind, noch ergänzt er ein göttliches Urteil im zweiten Halbvers. Die Übersetzung lässt diese theologische und semantische Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ein Gräuel“ erhält die starke Wertung des Weisheitsspruchs; „Worte, die guttun“ vermeidet eine steife Nominalverbindung. Die beiden knappen Vershälften und ihr Gegensatz bleiben erkennbar.
