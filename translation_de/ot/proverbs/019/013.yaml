  text: הַוֺּ֣ת לְ֭/אָבִי/ו בֵּ֣ן כְּסִ֑יל וְ/דֶ֥לֶף טֹ֝רֵ֗ד מִדְיְנֵ֥י אִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/013.yaml
  text: A foolish son is ruin to his father[a], and a wife’s quarrels are a continual dripping.
translation:
  language: de
  text: Ein törichter Sohn bringt seinem Vater Verderben[a], und die Streitereien einer Frau sind ein unaufhörliches Tropfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein törichter Sohn ist für seinen Vater ein Unglück.“'
    reason: 'Lexikalische und syntaktische Alternative: הַוּוֹת kann „Unglück/Unheil“ bedeuten, und der hebräische Nominalsatz kann mit „ist für“ statt verbal mit „bringt“ wiedergegeben werden.'
lexical_decisions:
- source_word: הַוּוֹת
  choice: Verderben
  rationale: Der Plural wird hier abstrakt beziehungsweise verstärkend gebraucht und bezeichnet schweres Unheil oder Verderben. „Verderben“ bewahrt die Wucht des Ausdrucks und klingt im Deutschen sprichwörtlich.
- source_word: לְאָבִיו
  choice: bringt seinem Vater
  rationale: Das ל markiert den Betroffenen. Die verbale Formulierung „bringt seinem Vater Verderben“ gibt dieses Verhältnis im Deutschen natürlich wieder.
- source_word: בֵּן כְּסִיל
  choice: ein törichter Sohn
  rationale: כְּסִיל bezeichnet im Sprüchebuch nicht bloß geringe Intelligenz, sondern eine moralisch verfehlte Haltung. „Töricht“ erhält diesen ethischen Sinn in würdigem, verständlichem Deutsch.
- source_word: דֶּלֶף טֹרֵד
  choice: wie ein unaufhörliches Tropfen
  rationale: דֶּלֶף bezeichnet das Tropfen einer undichten Stelle; טֹרֵד stellt es als anhaltend und zermürbend dar. Das ergänzte „wie“ macht den bildhaften nominalen Vergleich im Deutschen klar, ohne seinen Sinn aufzulösen.
- source_word: מִדְיְנֵי
  choice: die Streitereien
  rationale: Der Plural bezeichnet wiederkehrende Auseinandersetzungen. „Streitereien“ ist aktuell und verständlich und vermittelt besser als das abstraktere „Streitigkeiten“ den wiederholten häuslichen Konflikt.
- source_word: אִשָּׁה
  choice: einer Frau
  rationale: אִשָּׁה kann sowohl „Frau“ als auch „Ehefrau“ bedeuten. Weil im hebräischen Vers kein Possessivmerkmal steht, bewahrt „einer Frau“ die lexikalische Offenheit; der häusliche Zusammenhang lässt eine Ehefrau weiterhin naheliegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwörtlicher Prägnanz. Die parallele Bildsprache bleibt erhalten; „töricht“ trägt den ethisch-moralischen Gehalt des Weisheitswortschatzes.
