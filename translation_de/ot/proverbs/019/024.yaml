  text: טָ֘מַ֤ן עָצֵ֣ל יָ֭ד/וֹ בַּ/צַּלָּ֑חַת גַּם אֶל פִּ֝֗י/הוּ לֹ֣א יְשִׁיבֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/024.yaml
  text: The sluggard buries his hand in the dish[b][a]; he will not even bring it back to his mouth.
translation:
  language: de
  text: Der Faule vergräbt seine Hand in der Schüssel[a]; nicht einmal an seinen Mund führt er sie zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der Schale« oder »auf der Platte«. Das hebräische Wort bezeichnet ein Gefäß, aus dem Speisen genommen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  choice: vergräbt
  rationale: Das Verb bedeutet verbergen, verstecken oder vergraben. »Vergräbt« bewahrt das überzeichnete, anschauliche Bild des hebräischen Spruchs.
- source_word: עָצֵל
  choice: der Faule
  rationale: Das Wort bezeichnet in der Weisheitsliteratur einen gewohnheitsmäßig trägen Menschen. »Der Faule« ist im heutigen Deutsch klar, knapp und sprichwörtlich.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Die Possessivkonstruktion wird entsprechend dem Hebräischen im Singular wiedergegeben.
- source_word: בַּצַּלָּחַת
  choice: in der Schüssel
  rationale: Das Substantiv bezeichnet ein Gefäß für Speisen, etwa eine Schüssel, Schale oder Platte. »Schüssel« passt natürlich zum gemeinsamen Essen, ohne das Gefäß zu eng festzulegen.
- source_word: גַּם
  choice: nicht einmal
  rationale: 'In Verbindung mit der Verneinung steigert die Partikel die Absurdität: Selbst die geringfügige Bewegung zum Mund vollendet der Faule nicht.'
- source_word: אֶל־פִּיהוּ
  choice: zu seinem Mund
  rationale: Die konkrete Bedeutung »Mund« und das Bild des Essens bleiben erhalten.
- source_word: לֹא יְשִׁיבֶנָּה
  choice: führt er sie nicht zurück
  rationale: Der Hifil von שוב bedeutet hier »zurückbringen/zurückführen«; das feminine Suffix bezieht sich auf die Hand. Die deutsche Formulierung erhält diese Rückbewegung ausdrücklich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwörtlicher Form. Die übertriebene Bildsprache des Hebräischen wird durch »vergräbt« bewahrt; die zweite Vershälfte folgt der hebräischen Wortstellung soweit möglich, ohne unnatürlich zu wirken.
