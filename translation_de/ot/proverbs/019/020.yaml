source:
  edition: WLC
  text: שְׁמַ֣ע עֵ֭צָה וְ/קַבֵּ֣ל מוּסָ֑ר לְ֝מַ֗עַן תֶּחְכַּ֥ם בְּ/אַחֲרִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/020.yaml
  text: Listen to counsel and accept discipline[a], so that you may become wise in the end.
translation:
  language: de
  text: Hör auf Rat und nimm Zurechtweisung an, damit du in deinem späteren Leben[a] weise wirst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „für deine Zukunft“ oder „im Hinblick auf deinen Ausgang“. Das hebräische Wort kann das spätere Leben, die Zukunft oder den Ausgang eines Menschen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Hör auf
  rationale: Der Imperativ fordert nicht nur zum Hören, sondern zum aufmerksamen Beachten auf. „Hör auf Rat“ ist dafür im modernen Deutschen idiomatisch.
- source_word: עֵצָה
  choice: Rat
  rationale: Das Wort bezeichnet überlegte, weisheitliche Beratung; „Rat“ ist gewichtig, klar und natürlich.
- source_word: וְקַבֵּל
  choice: und nimm … an
  rationale: Der Imperativ bezeichnet die willige Annahme; die deutsche Verbklammer gibt dies idiomatisch wieder.
- source_word: מוּסָר
  choice: Zurechtweisung
  rationale: Im Sprüchebuch umfasst מוּסָר erziehende und korrigierende Unterweisung. „Zurechtweisung“ bewahrt hier den korrektiven Aspekt deutlicher als das allgemeinere „Unterweisung“.
- source_word: לְמַעַן
  choice: damit
  rationale: Die Konjunktion gibt den Zweck beziehungsweise das beabsichtigte Ergebnis knapp und natürlich wieder.
- source_word: תֶּחְכַּם
  choice: weise wirst
  rationale: Die Verbform bezeichnet hier das Erlangen von Weisheit als Folge des Hörens und Annehmens; „weise wirst“ bringt diesen Entwicklungsgedanken zum Ausdruck.
- source_word: בְּאַחֲרִיתֶךָ
  choice: am Ende
  rationale: Die Wendung kann auf das spätere Leben, die Zukunft oder den letztlichen Ausgang zielen. „Am Ende“ bewahrt die zeitliche und ergebnisbezogene Offenheit; die Fußnote nennt weitere Möglichkeiten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede im Singular bleibt erhalten; die knappe imperativische Form entspricht dem Charakter weisheitlicher Unterweisung.
