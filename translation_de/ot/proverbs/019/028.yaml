source:
  edition: WLC
  text: עֵ֣ד בְּ֭לִיַּעַל יָלִ֣יץ מִשְׁפָּ֑ט וּ/פִ֥י רְ֝שָׁעִ֗ים יְבַלַּע אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/028.yaml
  text: A worthless witness mocks justice[c][b][a], and the mouth of the wicked swallows iniquity.
translation:
  language: de
  text: Ein niederträchtiger Zeuge[a] verhöhnt das Recht[b], und der Mund der Frevler verschlingt Unrecht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „ein nichtswürdiger Zeuge“. בְּלִיַּעַל (belijjaʿal) wird hier als Bezeichnung moralischer Verderbtheit verstanden, nicht als der spätere Eigenname „Belial“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verspottet die Gerechtigkeit“ beziehungsweise „höhnt über das Urteil“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „verschlingt Böses“, „Unheil“ oder „Trug“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד
  choice: Zeuge
  rationale: Das Substantiv bezeichnet jemanden, der Zeugnis ablegt. „Zeuge“ ist im rechtlichen Zusammenhang die natürliche deutsche Entsprechung.
- source_word: בְּלִיַּעַל
  choice: gewissenlos
  rationale: Der Ausdruck charakterisiert den Zeugen hier als moralisch verdorben und nichtswürdig. „Gewissenlos“ ist verständlich und vermeidet, das Wort als späteren Eigennamen „Belial“ zu deuten.
- source_word: יָלִיץ
  choice: verhöhnt
  rationale: Die Verbform drückt spöttische Verachtung aus. „Verhöhnen“ gibt die aktive Missachtung des Rechts knapp und kraftvoll wieder.
- source_word: מִשְׁפָּט
  choice: das Recht
  rationale: Das Wort kann Recht, Gerechtigkeit, Urteil oder Rechtsprechung bezeichnen. „Das Recht“ bewahrt hier sowohl den rechtlichen als auch den ethischen Sinn.
- source_word: פִי
  choice: der Mund
  rationale: Die wörtliche Körpermetapher wird beibehalten und trägt das Bild des Verschlingens.
- source_word: רְשָׁעִים
  choice: der Frevler
  rationale: Das substantivierte Adjektiv im Plural bezeichnet Menschen, die schuldhaft böse handeln. „Frevler“ passt zum knappen, würdevollen Spruchstil, ohne eine unnötig konfessionelle Färbung.
- source_word: יְבַלַּע
  choice: verschlingt
  rationale: Das Verb bedeutet „schlucken“ oder „verschlingen“. „Verschlingt“ erhält das starke Bild und verbindet sich natürlich mit „Mund“.
- source_word: אָוֶן
  choice: Unrecht
  rationale: Das vieldeutige Wort kann Unrecht, Bosheit, Unheil oder Trug bezeichnen. „Unrecht“ passt zum Parallelismus mit dem missachteten Recht, ohne die Bedeutung auf bloße Falschaussage einzuengen.
theological_decisions:
- issue: בְּלִיַּעַל als Bezeichnung oder Eigenname
  choice: Als moralische Charakterisierung („gewissenlos“) wiedergegeben.
  alternative: „Belial“ als Eigenname oder „nichtswürdig“ als engere formale Wiedergabe.
  rationale: Im althebräischen Kontext der Sprüche liegt eine gewöhnliche Charakterisierung von Verderbtheit beziehungsweise Nichtswürdigkeit näher als der später personifizierte Eigenname. Die Fußnote hält die formale Alternative sichtbar.
- issue: Bedeutungsumfang von אָוֶן
  choice: „Unrecht“
  alternative: „Böses“, „Unheil“ oder „Trug“
  rationale: Der Kontext legt moralische Verkehrtheit nahe, entscheidet aber nicht eindeutig zwischen bösem Handeln, schädlichem Unheil und betrügerischer Rede. Die Hauptfassung wahrt den rechtlichen Parallelismus; die Fußnote nennt die echte Bedeutungsbreite.
translation_notes:
  register: Moderner, knapper und würdevoller Spruchstil. Der Parallelismus zwischen „Recht“ und „Unrecht“ sowie das konkrete Bild von Mund und Verschlingen bleiben erhalten. „Frevler“ ist leicht gehoben, aber im Weisheitsstil gut verständlich.
