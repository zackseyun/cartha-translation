source:
  edition: WLC
  text: ה֗וֹן יֹ֭סִיף רֵעִ֣ים רַבִּ֑ים וְ֝/דָ֗ל מֵרֵ֥ע/הוּ יִפָּרֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/004.yaml
  text: Wealth adds many friends[a], but a poor man is separated from his friend.
translation:
  language: de
  text: Reichtum verschafft viele Freunde, doch ein Armer bleibt von seinem Freund getrennt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „trennt sich von seinem Freund“ oder „wird von seinem Freund verlassen“. Das hebräische Verb bezeichnet eine Trennung, ohne eindeutig zu sagen, ob der Arme sich zurückzieht oder verlassen wird; der Zusammenhang legt soziale Verlassenheit nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: Reichtum
  rationale: Bezeichnet materiellen Besitz oder Vermögen; „Reichtum“ ist breit genug und bildet den Gegensatz zum Armen klar ab.
- source_word: יֹסִיף
  choice: bringt … hinzu
  rationale: Das Hifil von יסף bedeutet „hinzufügen, vermehren“. Die Formulierung gibt die kausative Aussage natürlich wieder, ohne die Freunde ausdrücklich als aufrichtig darzustellen.
- source_word: רֵעִים רַבִּים
  choice: viele Freunde
  rationale: רֵעִים kann Freunde, Gefährten oder soziale Vertraute bezeichnen; „Freunde“ wahrt den relationalen Sinn und den Kontrast zum einzelnen Freund im zweiten Halbvers.
- source_word: דָל
  choice: ein Armer
  rationale: דָל bezeichnet einen armen, schwachen oder sozial gering gestellten Menschen. Die substantivierte Form ist im Deutschen knapp, verständlich und bewahrt den generischen Singular.
- source_word: מֵרֵעֵהוּ
  choice: von seinem Freund
  rationale: Die Präposition מִן mit רֵעַ und Suffix wird unmittelbar als „von seinem Freund“ wiedergegeben; der Singular bleibt erhalten.
- source_word: יִפָּרֵד
  choice: wird … getrennt
  rationale: Das Nifal von פרד bezeichnet ein Getrenntwerden oder Getrenntsein, ohne eindeutig festzulegen, wer die Trennung herbeiführt. Die deutsche Passivform bewahrt diese Offenheit.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Spruchsprache mit klarer Parallelstruktur. „Freunde“ wird bewusst nicht als Ausdruck echter Loyalität näher bestimmt; der Vers beobachtet soziale Anziehung durch Reichtum und die Isolation des Armen.
