  text: גרל חֵ֭מָה נֹ֣שֵׂא עֹ֑נֶשׁ כִּ֥י אִם תַּ֝צִּ֗יל וְ/ע֣וֹד תּוֹסִֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/019.yaml
  text: A hot-tempered man bears the penalty[a], for if you rescue him, you will only have to do it again.
translation:
  language: de
  text: Ein jähzorniger Mensch trägt die Strafe; denn wenn du ihn rettest, musst du es noch einmal tun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und offener: „denn wenn du ihn rettest, wirst du noch weiter hinzufügen“. Was hinzugefügt wird, bleibt im Hebräischen unausgesprochen; gemeint ist wahrscheinlich ein weiteres Eingreifen oder Retten.'
    reason: Die hebräische Schlusswendung ist elliptisch; das Objekt von „hinzufügen“ bleibt unausgesprochen.
lexical_decisions:
- source_word: גרל חֵמָה
  choice: ein jähzorniger Mensch
  rationale: Die kompakte Konstruktverbindung bezeichnet eine Person, die von Zorn bzw. Wut geprägt ist. „Jähzorniger Mensch“ gibt dies im modernen Deutschen natürlich wieder, ohne das Geschlecht stärker festzulegen als für das Verständnis nötig.
- source_word: נֹשֵׂא עֹנֶשׁ
  choice: muss die Strafe tragen
  rationale: נשׂא bedeutet „tragen“, עֹנֶשׁ „Strafe“ bzw. „Sanktion“. Das Modalverb verdeutlicht die im Spruch liegende Konsequenz, während „tragen“ die Bildlichkeit des Hebräischen bewahrt.
- source_word: כִּי אִם
  choice: denn wenn
  rationale: Die Wendung verbindet die Begründung mit einer Bedingung. „Denn wenn“ erhält beide Funktionen.
- source_word: תַּצִּיל
  choice: du ihn rettest
  rationale: Der Hifil von נצל bedeutet „retten, befreien“. Das im Hebräischen unausgesprochene Objekt wird aus dem ersten Satzteil aufgenommen.
- source_word: וְעוֹד תּוֹסִף
  choice: musst du es immer wieder tun
  rationale: Wörtlich steht etwa „wirst du nochmals hinzufügen“. Die deutsche Wiedergabe macht die Ellipse verständlich und bringt die Warnung vor wiederholtem Eingreifen zum Ausdruck; eine Fußnote weist auf die offenere Formulierung des Hebräischen hin.
