  text: שֹׁמֵ֣ר מִ֭צְוָה שֹׁמֵ֣ר נַפְשׁ֑/וֹ בּוֹזֵ֖ה דְרָכָ֣י/ו יומת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/016.yaml
  text: Whoever keeps the commandment keeps his life[b][a]; he who despises his ways will die.
translation:
  language: de
  text: Wer das Gebot hält, bewahrt sein Leben; wer seine Wege verachtet[a], wird getötet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seine Wege“. Dies kann die eigene Lebensführung meinen; manche beziehen den Ausdruck auf Gottes Wege oder auf den durch das Gebot bestimmten Weg.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch passive (Hophal-)Form: „wird getötet“ oder „wird zu Tode gebracht“. Ein Handelnder wird nicht genannt; sinngemäß kann die Aussage auch einen tödlichen Ausgang bezeichnen.'
    reason: textual_form
lexical_decisions:
- source_word: שֹׁמֵר מִצְוָה
  choice: das Gebot hält
  rationale: „Halten“ ist im Deutschen die natürliche biblische Wendung für das fortdauernde Beachten und Befolgen eines Gebots; der hebräische Singular bleibt erhalten.
- source_word: שֹׁמֵר נַפְשׁוֹ
  choice: bewahrt sein Leben
  rationale: Die Wiederholung von שֹׁמֵר wird durch das verwandte deutsche Verb „bewahrt“ hörbar gehalten. נֶפֶשׁ bezeichnet hier angesichts des Gegensatzes zum Tod am ehesten das Leben, nicht eine technisch verstandene immaterielle Seele.
- source_word: בּוֹזֵה דְרָכָיו
  choice: seine eigenen Wege verachtet
  rationale: „Verachtet“ gibt die Haltung der Geringschätzung deutlich wieder. „Seine eigenen“ macht den naheliegenden Rückbezug des maskulinen Singularsuffixes auf den Handelnden verständlich; die verbleibende Deutungsfrage wird in der Fußnote offengelegt.
- source_word: יומת
  choice: wird dem Tod verfallen
  rationale: Die Form ist passiv beziehungsweise kausativ-passiv. Die Wendung wahrt den todbringenden Ausgang, ohne einen im Hebräischen nicht genannten menschlichen Vollstrecker einzuführen; die formnähere Möglichkeit steht in der Fußnote.
theological_decisions:
- issue: Bezug von דְרָכָיו („seine Wege“)
  choice: die eigenen Wege beziehungsweise die eigene Lebensführung des Handelnden
  alternative: Gottes Wege oder allgemeiner der vom Gebot bestimmte Weg
  rationale: Das Suffix kann grammatisch am natürlichsten auf den Handelnden zurückbezogen werden. Da Gott im Satz nicht ausdrücklich genannt ist, wird ein göttlicher Bezug nicht in den Haupttext eingetragen, aber als mögliche Deutung vermerkt.
- issue: Bedeutung von נֶפֶשׁ
  choice: Leben
  alternative: Seele oder sich selbst
  rationale: Der Parallelismus mit dem tödlichen Ausgang im zweiten Halbvers spricht für „Leben“. So wird keine spätere fachtheologische Seelenvorstellung in den Weisheitsspruch hineingetragen.
- issue: Aussagekraft des passiven יומת
  choice: ein sicherer, todbringender Ausgang ohne genannten Handelnden
  alternative: „wird getötet“ als streng formale passive Wiedergabe oder „wird sterben“ als idiomatische Ergebnisangabe
  rationale: „Wird dem Tod verfallen“ bewahrt den Ernst und die passive Färbung, lässt aber offen, durch wen oder wodurch der Tod eintritt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Spruchstruktur. Die Wiederholung des hebräischen שֹׁמֵר wird durch „hält/bewahrt“ semantisch erkennbar gehalten, ohne unnatürlich zweimal dasselbe deutsche Verb zu verwenden.
