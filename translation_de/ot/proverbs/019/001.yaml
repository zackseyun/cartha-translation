id: PRO.19.1
reference: Proverbs 19:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: טֽוֹב רָ֭שׁ הוֹלֵ֣ךְ בְּ/תֻמּ֑/וֹ מֵ/עִקֵּ֥שׁ שְׂ֝פָתָ֗י/ו וְ/ה֣וּא כְסִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/001.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his speech and is a fool[a][b].
translation:
  language: de
  text: Besser ein Armer, der seinen Weg in Lauterkeit geht, als einer, dessen Rede verkehrt ist und der ein Tor ist[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als ein Tor mit verkehrter Rede“. Der hebräische Satzbau erlaubt es, die Schlussworte „und er ist ein Tor“ kompakter als Bezeichnung der gegenübergestellten Person zu verstehen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „der in seiner Lauterkeit geht“. „Gehen“ ist im Hebräischen ein Bild für die Lebensführung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Besser
  rationale: Leitet die in Sprichwörtern übliche Vergleichsformel ein und bezeichnet, welcher Lebensstand vorzuziehen ist.
- source_word: רָשׁ
  choice: ein Armer
  rationale: Das maskuline Singularwort bezeichnet hier einen armen Menschen; die knappe substantivische Form passt zum Stil eines Sprichworts.
- source_word: הוֹלֵךְ
  choice: der seinen Weg … geht
  rationale: Bewahrt das hebräische Bild des Gehens als Bezeichnung für die Lebensführung und klingt zugleich natürlich auf Deutsch.
- source_word: בְּתֻמּוֹ
  choice: in Lauterkeit
  rationale: תֹּם bezeichnet charakterliche Ganzheit und Rechtschaffenheit. „Lauterkeit“ gibt dies wieder, ohne Sündlosigkeit zu behaupten.
- source_word: מֵעִקֵּשׁ
  choice: als einer, dessen … verkehrt ist
  rationale: Die Präposition מִן bildet nach טוֹב den Vergleich. עִקֵּשׁ beschreibt moralische Verkehrtheit oder Verdrehung.
- source_word: שְׂפָתָיו
  choice: dessen Rede
  rationale: Wörtlich steht „seine Lippen“; gemeint ist die durch die Lippen hervorgebrachte Rede. „Rede“ ist im modernen Deutschen klar und natürlich.
- source_word: וְהוּא כְסִיל
  choice: und der ein Tor ist
  rationale: Gibt die koordinierte Schlussaussage eng wieder und lässt ihre syntaktische Zuordnung zum verglichenen Menschen bestehen.
theological_decisions:
- issue: Zuordnung von וְהוּא כְסִיל zum zweiten Vergleichsglied
  choice: „als einer, dessen Rede verkehrt ist und der ein Tor ist“
  alternative: „als ein Tor mit verkehrter Rede“
  rationale: Beide Formulierungen beziehen den Schlusssatz auf die zweite Person. Die Hauptfassung folgt der hebräischen Koordination, während die Fußnote die kompaktere syntaktische Auffassung nennt, ohne einen zusätzlichen theologischen Gegensatz einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen Vergleichsform eines Weisheitsspruchs. „Seinen Weg … geht“ erhält das ethische Wegmotiv, während „Lauterkeit“ moralische Integrität ausdrückt. „Tor“ bewahrt den traditionellen weisheitlichen Begriff, ist aber im heutigen Deutsch noch verständlich.
