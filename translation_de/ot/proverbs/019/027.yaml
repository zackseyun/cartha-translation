base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/027.yaml
  text: Cease[a], my son, to hear instruction and to stray from the words of knowledge.
translation:
  language: de
  text: Hör auf[a], mein Sohn, Unterweisung anzuhören, wenn du von den Worten der Erkenntnis abirren willst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satz ist stark verkürzt und lässt mehrere Bezüge zu. Die Hauptfassung kann ironisch verstanden werden: »Hör auf, mein Sohn, Unterweisung anzuhören, wenn du von den Worten der Erkenntnis abirren willst.« Möglich ist auch: »Hör auf, mein Sohn, Unterweisung anzuhören – dann wirst du von den Worten der Erkenntnis abirren.« Eine weitere Deutung versteht die Unterweisung als irreführend: »Hör nicht auf Unterweisung, die dich von den Worten der Erkenntnis abirren lässt.«'
    reason: alternative_reading
lexical_decisions:
- source_word: חַדַל
  choice: Hör auf
  rationale: Der Imperativ von חדל fordert unmittelbar dazu auf, etwas zu beenden. »Hör auf« ist im heutigen Deutsch natürlich und bewahrt den mahnenden Ton.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die maskuline Singularanrede der Weisheitsliteratur wird entsprechend der hebräischen Form beibehalten.
- source_word: לִשְׁמֹעַ
  choice: anzuhören
  rationale: שמע kann sowohl das Hören als auch das aufmerksame Zuhören bezeichnen. Mit »Unterweisung« ist »anzuhören« im Deutschen idiomatisch und lässt die Art der Unterweisung offen.
- source_word: מוּסָר
  choice: Unterweisung
  rationale: מוּסָר umfasst Erziehung, Zurechtweisung und Belehrung. »Unterweisung« gibt hier den weisheitlich-pädagogischen Sinn wieder, ohne ihn auf bloße Bestrafung einzuengen.
- source_word: לִשְׁגוֹת
  choice: abzuirren
  rationale: Der Infinitiv von שגה bezeichnet Irren oder Abweichen. »Abirren« verbindet sich natürlich mit der durch מן bezeichneten Trennung, ohne das syntaktische Verhältnis der beiden Infinitive abschließend festzulegen.
- source_word: מֵאִמְרֵי
  choice: von den Worten
  rationale: מן bezeichnet hier eine Entfernung oder Trennung; אמרים sind Worte oder Aussprüche. Die Wiedergabe bewahrt die hebräische Bild- und Satzstruktur.
- source_word: דָעַת
  choice: Erkenntnis
  rationale: דעת bezeichnet in den Sprüchen wissende Einsicht. »Erkenntnis« entspricht dem gehobenen weisheitlichen Register und ist im Deutschen in der Verbindung »Worte der Erkenntnis« verständlich.
theological_decisions:
- issue: Bezug der beiden Infinitive und Funktion von לִשְׁגוֹת
  choice: Die gedrängte Koordination wird im Haupttext möglichst unmittelbar bewahrt.
  alternative: '»Hör auf, mein Sohn, Unterweisung anzuhören, sonst irrst du von den Worten der Erkenntnis ab«; oder: »Hör nicht auf Unterweisung, die dich von den Worten der Erkenntnis abirren lässt.«'
  rationale: Der masoretische Text ist syntaktisch verdichtet. Er kann als ironische Warnung vor dem Aufhören mit guter Unterweisung oder als Aufforderung verstanden werden, irreführende Unterweisung nicht mehr anzuhören. Keine dieser Deutungen soll stillschweigend dogmatisch festgelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte väterliche Anrede und der weisheitliche Ton bleiben erhalten; die ungewöhnliche Kürze des Hebräischen wird nicht durch eine eindeutige Auslegung geglättet.
