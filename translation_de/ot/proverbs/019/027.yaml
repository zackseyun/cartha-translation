  verdict: revise
  source_fidelity: Der hebräische Text verbindet den Imperativ חֲדַל mit zwei Infinitiven und ist bewusst bzw. überliefert knapp. Die vorliegende Hauptfassung gibt die Wortfolge zwar nach, lässt das zweite Infinitivglied im Deutschen jedoch wie einen zweiten, tatsächlich befohlenen Imperativ wirken. Die ironisch-konsequutive Lesart wird mit „wenn du … abirren willst“ verständlich wiedergegeben; die konkurrierende Deutung einer irreführenden Unterweisung bleibt in der Anmerkung erhalten.
  naturalness: „Hör auf … und von den Worten der Erkenntnis abzuirren“ ist im modernen Deutschen syntaktisch missverständlich und semantisch unnatürlich, weil es dazu aufzufordern scheint, abzuirren. Die konditionale Formulierung ist idiomatisch und bewahrt den knappen, mahnenden Weisheitston.
  terminology: „mein Sohn“, „Unterweisung“, „Worte der Erkenntnis“ und „abirren“ sind sachgerecht. Sie bewahren die maskuline Anrede, den pädagogischen Gehalt von מוּסָר und das gehobene, aber verständliche Register von דעת.
  issues:
  - severity: medium
    issue: Das zweite Infinitivglied wird im Deutschen als eigenständige Aufforderung verstanden.
    rationale: Die Koordination „Hör auf … und … abzuirren“ legt nahe, der Sprecher gebiete sowohl das Aufhören mit der Unterweisung als auch das Abirren. Der hebräische Infinitiv לִשְׁגּוֹת bezeichnet hier vielmehr den schwer zu bestimmenden Zweck- bzw. Folgebezug, nicht zwingend einen zweiten Befehl.
  - severity: low
    issue: Die Fußnote bezeichnet die resultative Lesart zu kategorisch mit „dann wirst du“.
    rationale: Der hebräische Infinitiv erlaubt neben einer Folge auch eine ironisch-zweckhafte Zuspitzung. Eine Formulierung mit „wenn du … willst“ gibt diese Möglichkeit wieder, ohne eine eindeutige kausale Aussage zu erzwingen.
