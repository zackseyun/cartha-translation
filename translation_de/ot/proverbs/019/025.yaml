base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/025.yaml
  text: Strike a scoffer[a], and the simple will become shrewd; rebuke one who has understanding[c][b], and he will gain knowledge.
translation:
  language: de
  text: Schlägst du einen Spötter, wird der Unerfahrene umsichtig; weist du einen Einsichtigen zurecht, gewinnt er an Erkenntnis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵץ
  choice: Spötter
  rationale: Das Wort bezeichnet im Buch der Sprüche einen Menschen, der Weisheit verächtlich und höhnisch zurückweist. »Spötter« bewahrt diesen moralischen Sinn in natürlichem Deutsch.
- source_word: תַּכֶּה
  choice: Schlägst du
  rationale: Die Form von נכה bezeichnet hier einen als Strafe zugefügten Schlag. Die konditionale deutsche Form gibt den Zusammenhang der beiden Satzhälften natürlich wieder, ohne den körperlichen Sinn des Verbs abzuschwächen.
- source_word: פֶתִי
  choice: der Unerfahrene
  rationale: פֶתִי ist ein weisheitlicher Begriff für einen leicht beeinflussbaren, noch ungefestigten Menschen. »Unerfahrene« ist heute verständlicher und weniger abwertend als »Einfältige«.
- source_word: יַעְרִם
  choice: wird … umsichtig
  rationale: Das Verb bezeichnet hier das Erlangen praktischer Klugheit oder Besonnenheit. »Umsichtig« gibt den positiven weisheitlichen Sinn wieder, ohne den möglichen negativen Beiklang von »gerissen«.
- source_word: וְהוֹכִיחַ
  choice: weist du … zurecht
  rationale: יכח bezeichnet hier eine korrigierende verbale Zurechtweisung. Die Wendung ist modern, klar und dem Kontrast zum körperlichen Schlag angemessen.
- source_word: לְנָבוֹן
  choice: einen Einsichtigen
  rationale: נָבוֹן bezeichnet im Singular einen Menschen mit Urteils- und Verständnisvermögen. Die substantivierte Form wahrt den persönlichen und generischen Sinn knapp und natürlich.
- source_word: יָבִין דָּעַת
  choice: gewinnt er an Erkenntnis
  rationale: Wörtlich steht eine Verbindung von »verstehen« und »Erkenntnis«. Im Deutschen drückt »an Erkenntnis gewinnen« das Ergebnis der Zurechtweisung idiomatisch aus und vermeidet die schwer verständliche Formulierung »Erkenntnis verstehen«.
