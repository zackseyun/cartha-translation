  text: Luxury is not fitting for a fool[c][b][a], much less for a servant to rule over princes.
translation:
  language: de
  text: Einem Toren steht Wohlleben[a] nicht an; noch weniger steht es einem Sklaven[b] an, über Fürsten[c] zu herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Genuss“, „Behaglichkeit“ oder „Luxus“. Das hebräische Wort kann allgemein Freude und Genuss bezeichnen, meint hier aber wahrscheinlich ein angenehmes, üppiges Leben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Diener“ beziehungsweise „Knecht“. Das hebräische Wort kann unterschiedliche Formen abhängiger Dienerschaft bezeichnen; „Sklave“ hebt die zugespitzte Umkehr der damaligen sozialen Rangordnung hervor.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Obere“, „Adlige“ oder „Amtsträger“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוֶה
  choice: steht … an
  rationale: Die Wendung bezeichnet, was angemessen oder schicklich ist. „Jemandem anstehen“ gibt die wertende Aussage im Deutschen knapp und sprichwortartig wieder.
- source_word: כְסִיל
  choice: Tor
  rationale: In den Sprüchen bezeichnet das Wort nicht bloß geringe Intelligenz, sondern einen Menschen, dessen Haltung und Lebensführung von Unvernunft geprägt sind. „Tor“ bewahrt diese weisheitliche Bedeutung.
- source_word: תַּעֲנוּג
  choice: Wohlleben
  rationale: Das Substantiv kann Freude, Genuss oder luxuriöses Leben bezeichnen. Im sozialen Gegensatz dieses Verses trifft „Wohlleben“ den Gedanken eines angenehmen, üppigen Lebens, ohne ihn auf einzelne Luxusgüter zu verengen.
- source_word: אַף כִּי
  choice: noch weniger
  rationale: Die Verbindung leitet hier eine Steigerung zu einem als noch unangemessener dargestellten Fall ein. „Noch weniger“ macht diesen Schluss vom geringeren auf den stärkeren Fall idiomatisch deutlich.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Das Wort umfasst verschiedene Formen abhängiger Dienerschaft. Hier beruht die zugespitzte Aussage auf der Umkehr des damaligen sozialen Rangverhältnisses; „Sklave“ erhält diese Schärfe.
- source_word: מְשֹׁל
  choice: zu herrschen
  rationale: Der Infinitiv bezeichnet die Ausübung von Herrschaft oder Autorität. „Herrschen“ passt prägnant zum Ranggegensatz.
- source_word: שָׂרִים
  choice: Fürsten
  rationale: Gemeint sind hochrangige Führungs- oder Standespersonen. „Fürsten“ bewahrt den gehobenen Rang und den pointierten Kontrast, während auch „Obere“ oder „Amtsträger“ möglich sind.
theological_decisions: []
translation_notes:
  register: Moderne, würdige und sprichwortartig knappe Standardsprache. Die Konstruktion „steht … nicht an“ bewahrt den Charakter einer Weisheitsmaxime. Die soziale Hierarchie wird als Aussage des antiken Spruchs wiedergegeben, ohne sie durch zusätzliche Deutung zu bestätigen oder abzuschwächen.
