base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/022.yaml
  text: What is desired in a man is his steadfast love[b][a], and a poor man is better than a liar.
translation:
  language: de
  text: Wünschenswert an einem Menschen ist seine Güte[a][b]; und ein Armer ist besser als ein Lügner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Verlangen eines Menschen ist seine Güte.« Der erste Halbvers ist im Hebräischen sehr knapp und kann entweder sagen, was an einem Menschen wünschenswert ist, oder das Verlangen eines Menschen mit seiner Güte beziehungsweise Treue gleichsetzen.'
    reason: alternative_reading
  - marker: b
    text: Der hebräische Ausdruck kann je nach Zusammenhang auch mit »Treue«, »beständiger Liebe« oder »verlässlicher Liebe« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: Begehrenswert
  rationale: Das Substantiv kann sowohl »Verlangen« als auch »das Begehrte/Begehrenswerte« bezeichnen. Die prädikative Wiedergabe ergibt im Zusammenhang einen knappen, natürlichen Weisheitsspruch, ohne die grammatische Mehrdeutigkeit zu verschweigen.
- source_word: אָדָם
  choice: an einem Menschen
  rationale: אָדָם bezeichnet hier den einzelnen Menschen in allgemeinem Sinn. »Mensch« gibt diesen generischen Bezug im modernen Deutschen natürlich wieder.
- source_word: חַסְדּוֹ
  choice: seine verlässliche Liebe
  rationale: חֶסֶד umfasst Güte, loyale Verbundenheit und beständige Liebe. »Verlässliche Liebe« bewahrt sowohl die zwischenmenschliche Wärme als auch die im Kontrast zum Lügner wichtige Treue, ohne den Ausdruck unnötig auf einen Bundeskontext festzulegen.
- source_word: וְטוֹב
  choice: und … ist besser
  rationale: Die Verbindung leitet den vergleichenden zweiten Halbvers ein. Das ergänzte »ist« ist im Deutschen grammatisch erforderlich; »und« erhält die schlichte parataktische Form des Hebräischen.
- source_word: רָשׁ
  choice: ein Armer
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet einen armen Menschen. Die knappe maskuline Singularform entspricht dem sprichwörtlichen Vergleich.
- source_word: מֵאִישׁ כָּזָב
  choice: als ein Lügner
  rationale: מִן kennzeichnet den Vergleich; אִישׁ כָּזָב bezeichnet einen von Falschheit geprägten Menschen. »Lügner« ist prägnant und idiomatisch.
theological_decisions:
- issue: Bedeutung des ersten Halbverses
  choice: Er beschreibt die Eigenschaft, die an einem Menschen begehrenswert ist.
  alternative: »Das Verlangen eines Menschen ist seine verlässliche Liebe.«
  rationale: Die hebräische Nominalfügung ist äußerst knapp und lässt beide Deutungen zu. Die Hauptfassung folgt der im Parallelismus plausiblen Aussage über den Wert verlässlicher Liebe; die alternative syntaktische Lesart wird in einer Fußnote erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Die ungewöhnliche Dichte des ersten Halbverses bleibt durch die Fußnote transparent; der Haupttext vermeidet konfessionell geprägte Fachsprache.
