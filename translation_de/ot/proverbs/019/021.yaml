id: PRO.19.21
reference: Proverbs 19:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רַבּ֣וֹת מַחֲשָׁב֣וֹת בְּ/לֶב אִ֑ישׁ וַ/עֲצַ֥ת יְ֝הוָ֗ה הִ֣יא תָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/021.yaml
  text: Many are the plans in a man's heart[a], but the counsel of Yahweh will stand.
translation:
  language: de
  text: Viele Pläne sind im Herzen eines Mannes[a], doch der Ratschluss Jahwes wird Bestand haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gedanken« oder »Absichten« statt »Pläne«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: Viele … sind
  rationale: Die vorangestellte Mengenangabe bewahrt die Hervorhebung und den sprichwortartigen Klang des Hebräischen.
- source_word: מַחֲשָׁבוֹת
  choice: Pläne
  rationale: Das Wort bezeichnet hier nicht bloß Gedanken, sondern erwogene Vorhaben; »Pläne« bildet zudem einen klaren Gegensatz zu Jahwes Ratschluss.
- source_word: בְּלֶב אִישׁ
  choice: im Herzen eines Mannes
  rationale: »Herz« bezeichnet in der hebräischen Anthropologie auch den Ort des Denkens und Wollens. Der maskuline Singular אִישׁ wird mit seiner repräsentativen Aussageform beibehalten.
- source_word: וַעֲצַת
  choice: doch der Ratschluss
  rationale: Das Waw verbindet hier antithetisch und wird daher natürlich mit »doch« wiedergegeben. »Ratschluss« vermittelt einen feststehenden Rat oder Vorsatz.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Die Wiedergabe als »Jahwe« wahrt den Eigennamen Gottes im Ausgangstext.
- source_word: הִיא תָקוּם
  choice: wird Bestand haben
  rationale: Das feminine Pronomen nimmt עֲצַת auf und hebt diesen Ratschluss hervor; im Deutschen kann diese Betonung ohne separates Pronomen idiomatisch im Subjekt erhalten bleiben. קום bezeichnet hier das Feststehen beziehungsweise dauerhafte Geltung-Haben.
theological_decisions:
- issue: Menschliche Planung und göttlicher Ratschluss
  choice: Viele menschliche Pläne stehen dem Ratschluss Jahwes gegenüber, der Bestand haben wird.
  alternative: Eine deterministische Ausdeutung wie »Nur Gottes Plan geschieht«.
  rationale: Der hebräische Text behauptet die bleibende Wirksamkeit von Jahwes Ratschluss gegenüber menschlichen Plänen, legt aber keine umfassende Lehre über sämtliche Ursachen oder die völlige Wirkungslosigkeit menschlichen Handelns aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwortartiger Struktur. »Ratschluss« ist gehoben, aber im religiösen und literarischen Kontext verständlich; es wahrt die Spannung zwischen menschlichen Vorhaben und dem feststehenden göttlichen Rat.
