  text: שֵׂ֣כֶל אָ֭דָם הֶאֱרִ֣יךְ אַפּ֑/וֹ וְ֝/תִפאַרְתּ֗/וֹ עֲבֹ֣ר עַל פָּֽשַׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/011.yaml
  text: A man's insight makes him slow to anger[b][a], and it is his glory to overlook an offense.
translation:
  language: de
  text: Die Einsicht eines Menschen macht ihn langsam zum Zorn,[a] und es gereicht ihm zur Ehre, über ein Vergehen hinwegzusehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Die Einsicht eines Menschen macht seine Nase lang“; dies ist eine hebräische Redewendung für Geduld beziehungsweise verzögerten Zorn. Auch möglich: „Die Klugheit eines Menschen macht ihn langsam zum Zorn.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „an einer Übertretung vorüberzugehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂכֶל
  choice: Einsicht
  rationale: Das Wort bezeichnet praktische Einsicht, verständiges Urteilsvermögen oder Klugheit. „Einsicht“ ist im Weisheitskontext natürlich und stellt den Zusammenhang zwischen klarem Urteil und Selbstbeherrschung her.
- source_word: אָדָם
  choice: ein Mensch
  rationale: אָדָם bezeichnet hier generisch einen einzelnen Menschen. „Ein Mensch“ gibt diesen allgemeinen Bezug im modernen Deutschen ohne unnötige geschlechtliche Einschränkung wieder.
- source_word: הֶאֱרִיךְ אַפּוֹ
  choice: wird nicht schnell zornig
  rationale: Die hebräische Wendung bedeutet wörtlich, dass die Nase beziehungsweise der Zorn eines Menschen „lang gemacht“ wird, und ist ein Idiom für verzögerten Zorn oder Geduld. Die gewählte Formulierung gibt den Sinn klar und idiomatisch wieder.
- source_word: וְתִפְאַרְתּוֹ
  choice: und es ehrt ihn
  rationale: תִפְאֶרֶת kann Schönheit, Pracht, Ruhm oder Ehre bezeichnen. Hier geht es darum, was einem Menschen zur Ehre gereicht; „es ehrt ihn“ ist im Deutschen natürlich und bewahrt den wertenden Charakter.
- source_word: עֲבֹר עַל
  choice: über … hinwegzusehen
  rationale: Die Verbindung bedeutet, über etwas hinwegzugehen oder es nicht weiterzuverfolgen. „Hinwegsehen“ beschreibt hier das bewusste Nichtanrechnen beziehungsweise Nichtvergelten, ohne bereits die stärkere Deutung „vergeben“ festzulegen.
- source_word: פָּשַׁע
  choice: Vergehen
  rationale: פֶּשַׁע kann Übertretung, Auflehnung oder schuldhaftes Vergehen bedeuten. Im zwischenmenschlichen Zusammenhang des Spruchs ist „Vergehen“ verständlich und ernst genug, ohne einen unnötig technischen theologischen Klang.
theological_decisions:
- issue: Verhältnis von Hinwegsehen und Vergebung
  choice: „über ein Vergehen hinwegzusehen“
  alternative: „ein Vergehen zu vergeben“
  rationale: Der hebräische Ausdruck beschreibt zunächst das Vorübergehen an einem Unrecht. Die Übersetzung vermeidet es, ihn stillschweigend mit dem umfassenderen theologischen Begriff der Vergebung gleichzusetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Die erste Halbzeile wird idiomatisch formuliert, während die Fußnote das hebräische Bild und eine formnähere Alternative bewahrt. Der parallele Aufbau und die persönliche Zuspitzung des Spruchs bleiben erhalten.
