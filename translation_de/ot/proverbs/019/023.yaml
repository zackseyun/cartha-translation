  variant: modern standard German
source:
  edition: WLC
  text: יִרְאַ֣ת יְהוָ֣ה לְ/חַיִּ֑ים וְ/שָׂבֵ֥עַ יָ֝לִ֗ין בַּל יִפָּ֥קֶד רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/023.yaml
  text: The fear of Yahweh leads to life[a], and whoever has it will rest satisfied[c][b]; he will not be visited by harm.
translation:
  language: de
  text: Die Furcht Jahwes führt zum Leben[a]. Wer sie hat, verbringt die Nacht zufrieden[b] und wird von keinem Unheil heimgesucht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist zum Leben«. Der hebräische Ausdruck ist sehr knapp.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »übernachtet satt«; auch möglich: »schläft satt«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher auch: »wird nicht vom Bösen heimgesucht«. Gemeint ist hier Unheil oder Unglück, nicht moralisch Böses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: Furcht
  rationale: Die Konstruktverbindung mit Jahwe bezeichnet ehrfürchtige Gottesfurcht. »Furcht« bewahrt die Spannweite des hebräischen Ausdrucks besser als das schwächere »Ehrfurcht«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
- source_word: לְחַיִּים
  choice: führt zum Leben
  rationale: Die knappe Verbindung mit לְ bezeichnet hier Ziel oder Ergebnis. Die Formulierung ist im Deutschen natürlich und lässt »Leben« in seiner breiten weisheitlichen Bedeutung stehen.
- source_word: וְשָׂבֵעַ
  choice: zufrieden
  rationale: Das Wort bedeutet wörtlich »satt, gesättigt« und bezeichnet hier im Zusammenhang mit der Nachtruhe einen Zustand der Geborgenheit und Genügsamkeit.
- source_word: יָלִין
  choice: verbringt die Nacht
  rationale: Das Verb bezeichnet das Übernachten oder Verweilen über Nacht. Die konkrete nächtliche Bildsprache bleibt damit erhalten.
- source_word: בַּל
  choice: von keinem
  rationale: Die poetische Verneinung wird zusammen mit dem folgenden Ausdruck idiomatisch als »von keinem Unheil« wiedergegeben, ohne die Verstärkung »niemals« hinzuzufügen.
- source_word: יִפָּקֶד
  choice: heimgesucht
  rationale: Das Nifal von פקד kann eine widerfahrende, insbesondere widrige Heimsuchung bezeichnen. »Heimgesucht werden« erhält dieses Bild im Deutschen.
- source_word: רָע
  choice: Unheil
  rationale: Hier geht es um schädliches Widerfahrnis oder Unglück, nicht primär um moralisch Böses. »Unheil« passt sowohl zum Kontext als auch zu »heimgesucht«.
theological_decisions:
- issue: Ob »Leben« ausschließlich geistliches beziehungsweise ewiges Leben oder vor allem langes, gedeihliches Leben meint
  choice: »Leben« bleibt uneingeschränkt stehen; die konkrete Sicherheit der folgenden Aussage wird ebenfalls bewahrt.
  alternative: Den Ausdruck ausdrücklich als langes Leben, Wohlergehen oder ewiges Leben deuten.
  rationale: In den Sprüchen umfasst »Leben« häufig Leben, Wohlergehen und Gedeihen unter Gottes Ordnung. Eine engere dogmatische Festlegung wäre vom knappen hebräischen Text nicht gefordert.
- issue: Ob die Schlussaussage völlige Verschonung von jedem Leiden garantiert
  choice: Die sprichwörtliche Aussage wird als »wird von keinem Unheil heimgesucht« wiedergegeben.
  alternative: »Ihm wird niemals etwas Schlimmes widerfahren.«
  rationale: Die Übersetzung bewahrt die allgemeine Weisheitsmaxime und das Bild der Heimsuchung, ohne sie durch zusätzliche Ausdrücke zu einer systematischen Garantie absoluter Leidensfreiheit auszuweiten.
- issue: Das im Hebräischen nicht ausdrücklich genannte Subjekt des zweiten Satzteils
  choice: »Wer sie hat« nimmt die Person auf, die in der Furcht Jahwes lebt.
  alternative: 'Unpersönlich formulieren: »Zufrieden verbringt man die Nacht«; oder formal: »Und satt wird er übernachten.«'
  rationale: Die Ergänzung macht den gedanklichen Zusammenhang im Deutschen verständlich. Sie wird jedoch nicht als eigenständige Aussage über den Erwerb oder Besitz der Gottesfurcht ausgebaut.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. »Jahwe« wahrt den Gottesnamen; »verbringt die Nacht« erhält die konkrete Bildsprache. Die Satzteilung vermeidet einen schwerfälligen deutschen Periodenbau.
