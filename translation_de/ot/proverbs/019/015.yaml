  text: עַ֭צְלָה תַּפִּ֣יל תַּרְדֵּמָ֑ה וְ/נֶ֖פֶשׁ רְמִיָּ֣ה תִרְעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/015.yaml
  text: Laziness brings on deep sleep[b][a], and a slack person will go hungry.
translation:
  language: de
  text: Faulheit lässt in tiefen Schlaf fallen, und ein nachlässiger Mensch[a] wird Hunger leiden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine nachlässige Seele wird Hunger leiden“. Das hebräische Wort für „Seele“ (נֶפֶשׁ) kann hier den ganzen Menschen bezeichnen; das mit „nachlässig“ wiedergegebene Wort (רְמִיָּה) kann auch „trügerisch“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְלָה
  choice: Faulheit
  rationale: Das Substantiv bezeichnet Trägheit oder Faulheit. „Faulheit“ ist im heutigen Deutsch klar und bewahrt die moralische Aussage des Spruchs.
- source_word: תַּפִּיל
  choice: versetzt
  rationale: Der Hifil von נפל ist kausativ („fallen lassen“, „hineinfallen lassen“). Zusammen mit „tiefem Schlaf“ gibt „versetzt in“ die Wirkung natürlich und prägnant wieder.
- source_word: תַּרְדֵּמָה
  choice: tiefen Schlaf
  rationale: Das Wort bezeichnet einen schweren oder tiefen Schlaf, nicht nur gewöhnliche Müdigkeit.
- source_word: נֶפֶשׁ
  choice: Mensch
  rationale: נֶפֶשׁ kann hier stellvertretend für die ganze Person stehen. „Mensch“ vermeidet eine im Deutschen leicht missverständliche metaphysische Engführung durch „Seele“.
- source_word: רְמִיָּה
  choice: nachlässiger
  rationale: Im Zusammenhang mit Faulheit und Hunger liegt die Bedeutung „nachlässig, träge“ nahe. Die mögliche Bedeutung „trügerisch“ bleibt in der Fußnote sichtbar.
- source_word: תִרְעָב
  choice: muss hungern
  rationale: Das Qal von רעב bedeutet „hungrig sein“ oder „Hunger leiden“. „Muss hungern“ drückt die eintretende Folge idiomatisch aus, ohne sie zu „verhungern“ zu steigern.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich spruchhaft-knappes Standarddeutsch. Der Parallelismus und der Zusammenhang zwischen Trägheit und Hunger bleiben erhalten; echte lexikalische Mehrdeutigkeit wird in der Fußnote ausgewiesen.
