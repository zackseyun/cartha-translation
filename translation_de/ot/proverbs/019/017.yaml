source:
  edition: WLC
  text: מַלְוֵ֣ה יְ֭הוָה ח֣וֹנֵֽן דָּ֑ל וּ֝/גְמֻל֗/וֹ יְשַׁלֶּם לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/017.yaml
  text: Whoever is gracious to the poor lends to Yahweh[a], and he will repay him for his deed.
translation:
  language: de
  text: Wer einem Armen Gnade erweist, leiht Jahwe; Jahwe wird ihm seine Tat vergelten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְוֵה
  choice: leiht
  rationale: Das Hifil-Partizip von לוה bezeichnet das Leihen. Die pointierte Darlehensmetapher wird direkt bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חֹנֵן
  choice: Gnade erweist
  rationale: Das Qal-Partizip von חנן bezeichnet ein gnädiges beziehungsweise huldvolles Handeln. „Gnade erweist“ bewahrt diesen Wortgehalt in würdigem, verständlichem Deutsch.
- source_word: דָּל
  choice: dem Armen
  rationale: דָּל kann einen Armen, Bedürftigen oder Schwachen bezeichnen; hier liegt im Kontext der materiellen Hilfe die sozioökonomische Bedeutung nahe.
- source_word: וּגְמֻלוֹ
  choice: was er ihm erwiesen hat
  rationale: גְּמוּל kann Tat, Wohltat, Vergeltung oder das einem anderen Erwiesene bezeichnen. Die Formulierung erhält die Beziehung zur vorausgehenden Hilfe, ohne die semantische Offenheit unnötig auf „Lohn“ zu verengen.
- source_word: יְשַׁלֶּם לוֹ
  choice: wird dieser ihm vergelten
  rationale: Das Piel von שלם bedeutet hier zurückzahlen oder vergelten. „Dieser“ macht in natürlichem Deutsch deutlich, dass Jahwe das Subjekt der Rückvergeltung ist, während „ihm“ auf den Wohltäter verweist.
theological_decisions:
- issue: Metaphorische Beziehung zwischen der Hilfe für den Armen und Jahwe
  choice: Die Hilfe für den Armen wird ausdrücklich als ein Leihen an Jahwe bezeichnet; Jahwe selbst vergilt dem Helfenden dessen Handeln.
  alternative: Paraphrase, wonach Gott Großzügigkeit lediglich wahrnimmt und belohnt.
  rationale: Der hebräische Text setzt Jahwe unmittelbar als Empfänger des Darlehens ein. Diese zugespitzte Identifikation mit dem Armen wird bewahrt, ohne weitergehende dogmatische Folgerungen einzutragen.
- issue: Bezug der Pronomen im zweiten Halbvers
  choice: „dieser“ bezieht sich auf Jahwe, „ihm“ auf denjenigen, der dem Armen Gnade erweist.
  alternative: Eine formal mehrdeutige Wiedergabe ausschließlich mit „er“ und „ihm“.
  rationale: Die hebräische Syntax und die Darlehensmetapher sprechen dafür, dass Jahwe zurückzahlt. Das Demonstrativpronomen vermeidet im Deutschen eine unbeabsichtigte Referenzunklarheit, ohne den Sinn zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prägnante Darlehensmetapher bleibt erhalten. „Gnade erweist“ ist leicht gehoben, aber allgemein verständlich und bildet חנן genauer ab als das flachere „freundlich ist“.
