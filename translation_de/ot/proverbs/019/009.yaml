source:
  edition: WLC
  text: עֵ֣ד שְׁ֭קָרִים לֹ֣א יִנָּקֶ֑ה וְ/יָפִ֖יחַ כְּזָבִ֣ים יֹאבֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/009.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will perish.
translation:
  language: de
  text: Ein falscher Zeuge bleibt nicht ungestraft[a], und wer Lügen ausstößt[b], wird zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird nicht freigesprochen« / »wird nicht für unschuldig gehalten«. Das hebräische Verb kann sowohl die verweigerte Freisprechung als auch die Gewissheit der Strafe betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »wer Lügen ausatmet«. Das Bild stellt Lügen als etwas dar, das so mühelos hervorkommt wie der Atem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: ein falscher Zeuge
  rationale: Die Verbindung bezeichnet wörtlich einen »Zeugen von Falschheiten« und idiomatisch einen falschen Zeugen. Die deutsche Wendung bewahrt den rechtlichen beziehungsweise zeugnishaften Sinn.
- source_word: לֹא יִנָּקֶה
  choice: bleibt nicht ungestraft
  rationale: Das Nifal von נקה kann bedeuten, nicht für schuldlos erklärt beziehungsweise nicht von den Folgen freigesprochen zu werden. »Bleibt nicht ungestraft« gibt in diesem Weisheitsspruch die sichere Ahndung natürlich wieder, ohne die forensische Bedeutungsnuance ganz auszuschließen.
- source_word: וְיָפִיחַ
  choice: und wer … ausstößt
  rationale: Das Partizip des Hifil von פוח beschreibt das Hervorbringen oder Ausatmen. »Ausstößt« erhält das anschauliche Bild, klingt im modernen Deutschen jedoch natürlicher als eine ganz wörtliche Formulierung mit »atmen«.
- source_word: כְּזָבִים
  choice: Lügen
  rationale: Der Plural bezeichnet Lügen oder Unwahrheiten. »Lügen« ist die klare und geläufige deutsche Entsprechung.
- source_word: יֹאבֵד
  choice: wird zugrunde gehen
  rationale: Das Qal von אבד bedeutet zugrunde gehen, umkommen oder verloren gehen. Die gewählte Formulierung ist würdig und verständlich und lässt Art und Zeitpunkt des Untergangs offen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Spruchform. Der Parallelismus und das eindringliche Bild des Ausatmens beziehungsweise Ausstoßens von Lügen bleiben erhalten.
