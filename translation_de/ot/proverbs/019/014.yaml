id: PRO.19.14
reference: Proverbs 19:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ֣יִת וָ֭/הוֹן נַחֲלַ֣ת אָב֑וֹת וּ֝/מֵ/יְהוָ֗ה אִשָּׁ֥ה מַשְׂכָּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/014.yaml
  text: A house and wealth are an inheritance from fathers[a], but a prudent wife is from Yahweh.
translation:
  language: de
  text: Haus und Vermögen sind ein Erbe von den Vätern; doch eine verständige Ehefrau[a] kommt von Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine verständige Frau«. Das hebräische Wort אִשָּׁה kann »Frau« oder »Ehefrau« bedeuten; im Zusammenhang passt »Ehefrau« am besten zum Gegensatz mit dem ererbten Besitz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיִת
  choice: Haus
  rationale: Das Substantiv bezeichnet hier zusammen mit dem Vermögen einen konkreten vererbbaren Besitz; »Haus« bewahrt diesen Sinn besser als »Zuhause« oder »Hausstand«.
- source_word: הוֹן
  choice: Vermögen
  rationale: Das Wort bezeichnet in der Weisheitsliteratur materiellen Besitz beziehungsweise Wohlstand. »Vermögen« ist im Deutschen klar und passt zum Erbkontext.
- source_word: נַחֲלַת אָבוֹת
  choice: ein Erbe von den Vätern
  rationale: Die Genitivverbindung bezeichnet das von den Vätern stammende Erbe. Die Präposition »von« macht die Herkunft im Deutschen eindeutig, ohne den hebräischen Sinn zu erweitern.
- source_word: מֵיְהוָה
  choice: von Jahwe
  rationale: Die Präposition מִן bezeichnet die Herkunft; der Gottesname יהוה wird in seiner im modernen Deutschen üblichen Form »Jahwe« wiedergegeben.
- source_word: אִשָּׁה
  choice: Ehefrau
  rationale: אִשָּׁה kann »Frau« oder »Ehefrau« bedeuten. Der Gegensatz zu vererbtem Haus und Vermögen spricht hier für die eheliche Bedeutung; die allgemeinere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: מַשְׂכָּלֶת
  choice: verständig
  rationale: Das Partizip aus שכל bezeichnet Einsicht, gutes Urteilsvermögen und kluges Handeln. »Verständig« gibt diesen praktisch-weisheitlichen Sinn natürlich und würdig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Gegensatz zwischen menschlichem Erbe und göttlicher Gabe
  choice: Haus und Vermögen stammen als Erbe von den Vätern, die verständige Ehefrau dagegen von Jahwe.
  alternative: Eine verständige Frau kommt von Jahwe.
  rationale: Der Spruch stellt vererbbaren materiellen Besitz der von Gott kommenden verständigen Ehefrau gegenüber. Dabei wird die göttliche Herkunft ausgesagt, ohne die genaue Art der Vorsehung weiter zu bestimmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchton. Das Semikolon markiert den Gegensatz der beiden parallelen Aussagen; »kommt von« ergänzt die im Hebräischen unausgesprochene Kopula natürlich.
