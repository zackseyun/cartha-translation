  source_fidelity: 'Der Entwurf gibt die hebräische Nominalaussage sachgerecht wieder: בַּיִת und הוֹן als vererbbarer Besitz, נַחֲלַת אָבוֹת als von den Vätern kommendes Erbe sowie den kontrastierenden Ursprung der verständigen Ehefrau bei Jahwe. Die Ergänzung „sind“ bzw. „kommt“ ist im Deutschen erforderlich und verändert die Aussage nicht.'
  naturalness: „Haus und Vermögen sind ein Erbe von den Vätern; doch eine verständige Ehefrau kommt von Jahwe“ ist modernes, verständliches Standarddeutsch mit angemessen knappem Spruchton. Das Semikolon und „doch“ bringen den Kontrast klar zum Ausdruck.
  terminology: „Haus“, „Vermögen“, „Erbe“, „Vätern“, „Jahwe“, „Ehefrau“ und „verständig“ sind angemessene Wiedergaben. „Verständig“ trifft מַשְׂכָּלֶת als einsichts- und urteilsfähige Person. Die Fußnote bewahrt die lexikalisch mögliche Lesart „Frau“ und ist korrekt verankert.
