  text: יַסֵּ֣ר בִּ֭נְ/ךָ כִּי יֵ֣שׁ תִּקְוָ֑ה וְ/אֶל הֲ֝מִית֗/וֹ אַל תִּשָּׂ֥א נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/018.yaml
  text: Discipline your son[a], for there is hope[b]; do not set your heart on putting him to death.
translation:
  language: de
  text: Weise deinen Sohn zurecht, denn es gibt Hoffnung[a]; richte dein Verlangen nicht darauf, ihn zu töten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „solange noch Hoffnung besteht“. Der hebräische Satz kann kausal („denn es gibt Hoffnung“) oder temporal („solange noch Hoffnung besteht“) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Erhebe deine Seele nicht dazu, ihn zu töten.“ Die hebräische Wendung beschreibt, dass jemand sein Verlangen oder seinen Entschluss auf ein Ziel richtet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֵּר
  choice: Erziehe
  rationale: Der Piel-Imperativ von יסר bezeichnet korrigierende, zurechtweisende Erziehung. „Erziehe“ ist im Deutschen natürlich und weit genug, um die bewusste elterliche Disziplin einzuschließen, ohne auf körperliche Züchtigung verengt zu werden.
- source_word: בִּנְךָ
  choice: deinen Sohn
  rationale: Das Hebräische bezeichnet ausdrücklich den Sohn; die geschlechtsspezifische Form wird beibehalten.
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: denn es gibt Hoffnung
  rationale: כִּי wird kausal verstanden und begründet die Aufforderung. Die ebenfalls mögliche temporale Deutung wird in der Fußnote bewahrt.
- source_word: הֲמִיתוֹ
  choice: ihn zu töten
  rationale: Der Hifil-Infinitiv von מות bedeutet, jemanden sterben zu lassen beziehungsweise zu töten. Die direkte Wiedergabe erhält den scharfen Kontrast zwischen hoffnungsvoller Erziehung und tödlicher Härte.
- source_word: אַל תִּשָּׂא נַפְשֶׁךָ
  choice: richte dein Verlangen nicht darauf
  rationale: Wörtlich steht „erhebe deine Seele nicht“. Die gewählte idiomatische Form gibt die Ausrichtung des inneren Begehrens oder Entschlusses wieder, ohne das Bild irreführend wörtlich zu übertragen.
theological_decisions:
- issue: Deutung der Warnung im zweiten Halbvers
  choice: Die Warnung verbietet, das Verlangen oder den Entschluss auf den Tod des Sohnes zu richten; Erziehung soll korrigieren und bleibt von Hoffnung bestimmt.
  alternative: Man soll die Erziehung nicht unterlassen und dadurch Mitschuld am Tod des Sohnes tragen.
  rationale: Die Syntax verbindet אֶל הֲמִיתוֹ als Zielrichtung mit אַל תִּשָּׂא נַפְשֶׁךָ. Daher ist die unmittelbare Warnung vor einer tödlich ausgerichteten Haltung sprachlich näherliegend. Die alternative traditionelle Deutung setzt einen nicht ausdrücklich genannten Gedanken des Unterlassens voraus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erziehe“ vermeidet die heute oft ausschließlich körperlich verstandene Engführung von „züchtige“. Der adversative Anschluss „doch“ macht den inhaltlichen Gegensatz natürlich deutlich, ohne die Aussage stärker auszulegen als der hebräische Text.
