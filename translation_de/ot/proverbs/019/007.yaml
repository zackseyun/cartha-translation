id: PRO.19.7
reference: Proverbs 19:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּ֥ל אֲחֵי רָ֨שׁ שְֽׂנֵאֻ֗/הוּ אַ֤ף כִּ֣י מְ֭רֵעֵ/הוּ רָחֲק֣וּ מִמֶּ֑/נּוּ מְרַדֵּ֖ף אֲמָרִ֣ים לא הֵֽמָּה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/007.yaml
  text: All the brothers of a poor man hate him[a]; how much more do his friends keep far from him! He pursues words[b], but they are not there.
translation:
  language: de
  text: Alle Brüder[a] eines Armen hassen ihn; wie viel mehr halten sich seine Freunde von ihm fern! Er jagt Worten nach, doch sie sind nicht da.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort „Brüder“ ist grammatisch männlich; im sozialen Zusammenhang des Spruchs kann es die Angehörigen des Armen bezeichnen.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „Er jagt Worten nach, die nichts sind“ oder: „Er jagt Versprechen nach, doch sie sind nicht da.“ Der letzte Satzteil ist im Hebräischen textlich und syntaktisch schwierig.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָשׁ
  choice: eines Armen
  rationale: Das Substantiv bezeichnet einen armen oder verarmten Menschen. Die substantivierte Form „ein Armer“ bildet den maskulinen Singular des Hebräischen knapp und natürlich ab.
- source_word: אֲחֵי
  choice: Brüder
  rationale: Die Konstruktverbindung bedeutet wörtlich „Brüder eines Armen“. „Brüder“ bewahrt den unmittelbaren familiären Bezug; die mögliche weitere soziale Reichweite wird in einer Fußnote erläutert.
- source_word: שְׂנֵאֻהוּ
  choice: hassen ihn
  rationale: Das Verb שׂנא bedeutet gewöhnlich „hassen“. Eine Abschwächung zu „verachten“ oder „meiden“ würde die Schärfe des hebräischen Ausdrucks mindern.
- source_word: אַף כִּי
  choice: wie viel mehr
  rationale: 'Die Wendung führt hier eine Steigerung ein: Wenn schon die Brüder ihn hassen, halten sich seine Freunde erst recht fern.'
- source_word: מְרֵעֵהוּ
  choice: seine Freunde
  rationale: Das Wort bezeichnet Gefährten oder Freunde. „Freunde“ ist im Deutschen natürlich und bildet einen klaren Kontrast zu den Brüdern.
- source_word: רָחֲקוּ מִמֶּנּוּ
  choice: halten sich von ihm fern
  rationale: Die Formulierung gibt sowohl die räumliche als auch die zwischenmenschliche Distanzierung idiomatisch wieder.
- source_word: מְרַדֵּף
  choice: Er jagt … nach
  rationale: Das Partizip ist syntaktisch schwierig. Als fortgesetzte Beschreibung des Armen ergibt es im Deutschen einen knappen, verständlichen Satz und bewahrt zugleich den intensiven Sinn des Verfolgens.
- source_word: אֲמָרִים
  choice: Worten
  rationale: Das Wort bedeutet zunächst „Worte“ oder „Aussprüche“. Deutungen als Versprechen oder Zusagen sind möglich, werden aber nicht stillschweigend in den Haupttext eingetragen.
- source_word: לֹא הֵמָּה
  choice: doch sie sind nicht da
  rationale: Der knappe Schluss ist textlich und syntaktisch schwierig. Diese Wiedergabe erhält den Bezug auf die „Worte“ und lässt deren Abwesenheit oder Unwirklichkeit bewusst offen.
theological_decisions: []
