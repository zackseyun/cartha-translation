  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, spruchhafter Satzführung. Die starke Aussage „hassen“ und die schwer deutbare Schlusswendung bleiben erhalten; die Fußnoten kennzeichnen kulturelle Reichweite und echte textliche Mehrdeutigkeit.
