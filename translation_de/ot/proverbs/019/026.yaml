  verdict: revise
  source_fidelity: 'Die wesentlichen Verben sind sachgerecht wiedergegeben: מְשַׁדֶּד bezeichnet schweres Ruinieren bzw. Ausplündern, und יַבְרִיחַ gibt das kausative Vertreiben der Mutter treffend wieder. Die prädikative Charakterisierung durch בֵּן bleibt erhalten. Am Versschluss stehen jedoch zwei parallele Partizipien mit verursachender Wirkung; diese sollte die deutsche Fassung klarer ausdrücken.'
  naturalness: „Schande und Schmach bringt“ ist verständlich, wirkt ohne eine Person als Bezugspunkt aber leicht unvollständig, da „jemandem Schande bringen“ im Deutschen die üblichere Konstruktion ist. „Schande und Schmach verursacht“ ist idiomatisch, präzise und bewahrt die parallele Aussage.
  terminology: „Vater“, „Mutter“, „Sohn“, „Schande“ und „Schmach“ entsprechen dem würdevollen sprichwörtlichen Register. Die Fußnote bietet berechtigt die engere, materielle Nuance von מְשַׁדֶּד sowie die Alternative zu יַבְרִיחַ.
  issues:
