    issue: Der Relativsatz „der Schande und Schmach bringt“ ist im Deutschen stilistisch weniger präzise.
    rationale: Die hebräischen Partizipien מֵבִישׁ und מַחְפִּיר bezeichnen aktiv jemanden, der Schande bzw. Schmach verursacht. Mit „verursacht“ wird dies ohne die im Deutschen bei „Schande bringen“ häufig erwartete Dativ-Ergänzung eindeutig ausgedrückt.
