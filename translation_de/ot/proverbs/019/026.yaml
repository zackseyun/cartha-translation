  text: מְֽשַׁדֶּד אָ֭ב יַבְרִ֣יחַ אֵ֑ם בֵּ֝֗ן מֵבִ֥ישׁ וּ/מַחְפִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/026.yaml
  text: He who devastates his father and drives away his mother is a son who brings shame and reproach[a].
translation:
  language: de
  text: Wer seinen Vater zugrunde richtet und seine Mutter vertreibt, ist ein Sohn, der Schande und Schmach verursacht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer seinen Vater ausplündert und seine Mutter fortjagt, ist ein Sohn, der Schande und Schmach verursacht.“'
    reason: 'Lexikalische Alternative: מְשַׁדֶּד kann enger als materielles Ausplündern verstanden werden; יַבְרִיחַ lässt sich auch mit „fortjagt“ wiedergeben.'
lexical_decisions:
- source_word: מְשַׁדֶּד
  choice: zugrunde richtet
  rationale: Das Partizip von שׁדד bezeichnet gewaltsames Verheeren, Ausplündern oder Ruinieren. „Zugrunde richtet“ wahrt die Schwere des Handelns, ohne es ausschließlich auf materiellen Raub einzuengen.
- source_word: אָב
  choice: seinen Vater
  rationale: Der im Deutschen erforderliche Possessivbezug ergibt sich aus dem familiären Zusammenhang und wird ausdrücklich wiedergegeben.
- source_word: יַבְרִיחַ
  choice: vertreibt
  rationale: 'Der Hifil von ברח hat kausative Bedeutung: Er bewirkt, dass die Mutter flieht oder fortgeht. „Vertreibt“ gibt dies knapp und natürlich wieder.'
- source_word: אֵם
  choice: seine Mutter
  rationale: Der Possessivbezug wird entsprechend dem parallelen „seinen Vater“ natürlich ausgedrückt.
- source_word: בֵּן
  choice: ein Sohn
  rationale: Das Substantiv charakterisiert prädikativ den zuvor beschriebenen Menschen; der unbestimmte Artikel erhält den allgemein-sprichwörtlichen Sinn.
- source_word: מֵבִישׁ
  choice: der Schande … bringt
  rationale: Das Hifil-Partizip von בוש bezeichnet jemanden, der Schande verursacht. Die Relativkonstruktion erhält den aktiven, kausativen Sinn.
- source_word: וּמַחְפִּיר
  choice: und Schmach bringt
  rationale: Das Partizip steht parallel zu מֵבִישׁ und bezeichnet das Verursachen von Schmach oder Entehrung. Im Deutschen können beide Objekte idiomatisch vom gemeinsamen Verb „bringt“ abhängen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer sprichwörtlicher Satzstruktur. Die parallelen Kausativpartizipien am Versende werden idiomatisch als Relativsatz mit zwei koordinierten Objekten wiedergegeben; die Härte der familiären Misshandlung bleibt erhalten.
