  source_fidelity: 'Die Übersetzung gibt den hebräischen Parallelismus und die zentralen Begriffe zuverlässig wieder: נָכֹנוּ als „stehen … bereit“, לֵצִים als „Spötter“, מִשְׁפָּטִים im hier strafenden Kontext als „Strafurteile“, מַהֲלֻמוֹת als „Schläge“, גֵּו als „Rücken“ und כְּסִילִים als weisheitlicher Terminus „Toren“. Der Singular „Rücken“ entspricht dem hebräischen Singular und kann im Deutschen kollektiv verstanden werden.'
  naturalness: Der knappe, sentenzartige Satz ist natürliches modernes Standarddeutsch und bewahrt die elliptische Parallelstruktur des Spruchs. „Toren“ ist leicht gehoben, aber als etablierter Ausdruck der Weisheitsliteratur angemessen und verständlich.
  terminology: „Spötter“ und „Toren“ treffen die weisheitliche Charakterisierung ohne sie auf bloße Intelligenz oder vereinzeltes Spotten zu reduzieren. „Strafurteile“ macht die durch den Parallelismus nahegelegte punitive Bedeutung von מִשְׁפָּטִים deutlich; die Fußnote erhält die allgemeinere Lesemöglichkeit „Urteile“.
