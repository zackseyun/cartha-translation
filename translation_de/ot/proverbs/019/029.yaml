  text: נָכ֣וֹנוּ לַ/לֵּצִ֣ים שְׁפָטִ֑ים וּ֝/מַהֲלֻמ֗וֹת לְ/גֵ֣ו כְּסִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/029.yaml
  text: Judgments are prepared for scoffers[a], and beatings for the back of fools.
translation:
  language: de
  text: Für Spötter stehen Strafurteile[a] bereit und Schläge für den Rücken der Toren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Urteile.'
    reason: Das hebräische Wort kann Urteile allgemein oder, wie hier im Zusammenhang mit Schlägen, Strafurteile bezeichnen.
lexical_decisions:
- source_word: נָכ֣וֹנוּ
  choice: stehen … bereit
  rationale: Das Nifal Perfekt von כון bezeichnet hier etwas, das bereitgemacht oder festgesetzt ist. Die deutsche Wendung „stehen bereit“ gibt diesen Zustand natürlich und prägnant wieder.
- source_word: לַ/לֵּצִ֣ים
  choice: für Spötter
  rationale: לץ bezeichnet in den Sprüchen Menschen, die sich in überheblicher Verachtung über andere und über Weisung hinwegsetzen. „Spötter“ bewahrt diesen weisheitlichen und moralischen Sinn.
- source_word: שְׁפָטִים
  choice: Strafurteile
  rationale: משפטים kann allgemein „Urteile“ bedeuten; im Parallelismus mit Schlägen ist hier jedoch der strafende Charakter deutlich. „Strafurteile“ macht diesen Kontextbezug sichtbar, ohne den gerichtlichen Sinn aufzugeben.
- source_word: וּ֝/מַהֲלֻמ֗וֹת
  choice: Schläge
  rationale: Das Substantiv bezeichnet Schläge beziehungsweise das Ergebnis heftigen Schlagens. „Schläge“ ist im modernen Deutschen konkret, verständlich und wahrt den Plural.
- source_word: לְ/גֵ֣ו
  choice: für den Rücken
  rationale: גֵּו kann Rücken oder Rumpf bezeichnen. Im Zusammenhang mit Schlägen ist „Rücken“ die naheliegende konkrete Wiedergabe; der Singular des Hebräischen bleibt erhalten.
- source_word: כְּסִילִֽים
  choice: der Toren
  rationale: כסיל ist ein fester Begriff der Weisheitsliteratur für moralisch uneinsichtige und widerspenstige Menschen, nicht bloß für intellektuell Unbegabte. „Toren“ bewahrt diese traditionelle Bedeutungsbreite in würdigem, verständlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Knappes, sentenzartiges Standarddeutsch mit dem Parallelismus des hebräischen Spruchs. „Toren“ ist bewusst als etablierter weisheitlicher Begriff gewählt; die Formulierung bleibt zugleich für heutige Leser verständlich.
