base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/002.yaml
  text: Also[a], without knowledge, desire is not good, and whoever hurries with his feet sins.
translation:
  language: de
  text: Auch ohne Erkenntnis ist Verlangen nicht gut[a], und wer mit den Füßen hastet, sündigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch ein Mensch ohne Erkenntnis ist nicht gut.“ Die hebräische Formulierung mit נֶפֶשׁ lässt mehrere Deutungen zu; hier wird das Wort idiomatisch als „Verlangen“ verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Bewahrt die anknüpfende beziehungsweise ergänzende Funktion des hebräischen Ausdrucks in knapper, natürlicher Form.
- source_word: בְּלֹא דַעַת
  choice: ohne Erkenntnis
  rationale: Gibt die Präposition mit Negation und דַעַת direkt wieder; „Erkenntnis“ lässt den in der Weisheitsliteratur zugleich verstandesmäßigen und sittlichen Sinn offen.
- source_word: נֶפֶשׁ
  choice: Verlangen
  rationale: נֶפֶשׁ bezeichnet hier wahrscheinlich idiomatisch ein inneres Begehren oder einen Antrieb. „Seele“ wäre im Deutschen missverständlich; die ebenfalls mögliche Deutung als „Mensch/Person“ wird in der Fußnote bewahrt.
- source_word: לֹא טוֹב
  choice: ist nicht gut
  rationale: Entspricht der schlichten Prädikation des Hebräischen und wahrt den knappen Spruchstil.
- source_word: וְאָץ
  choice: und wer … hastet
  rationale: Gibt das Partizip als allgemeingültige Charakterisierung wieder und klingt im Deutschen sprichwörtlich, ohne den Gedanken abzuschwächen.
- source_word: בְּרַגְלַיִם
  choice: mit den Füßen
  rationale: Bewahrt das konkrete Körperbild des hebräischen Textes, statt es durch „übereilt handeln“ zu abstrahieren.
- source_word: חוֹטֵא
  choice: verfehlt den Weg
  rationale: Die Wurzel חטא kann sowohl „sündigen“ als auch „das Ziel/den Weg verfehlen“ ausdrücken. Im Zusammenhang mit hastenden Füßen nimmt diese Wiedergabe das Wegmotiv auf, ohne die moralische Dimension auszuschließen; „sündigt“ bleibt als Alternative in der Fußnote.
theological_decisions:
- issue: Bedeutung von חוֹטֵא im Zusammenhang hastender Füße
  choice: verfehlt den Weg
  alternative: sündigt
  rationale: Die konkrete Wegmetaphorik der Füße spricht für „verfehlt den Weg“, während die moralische Aussage von חטא bestehen bleibt. Da „sündigt“ ebenfalls eine direkte und gewichtige Wiedergabe ist, wird sie ausdrücklich als Alternative genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem Spruchcharakter. Die ungewohnte Wendung „mit den Füßen hastet“ bleibt bewusst erhalten, um das konkrete Bild des hebräischen Textes zu bewahren. Beide echten lexikalischen Mehrdeutigkeiten werden durch Fußnoten kenntlich gemacht.
