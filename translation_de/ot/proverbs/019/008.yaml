id: PRO.19.8
reference: Proverbs 19:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: קֹֽנֶה לֵּ֭ב אֹהֵ֣ב נַפְשׁ֑/וֹ שֹׁמֵ֥ר תְּ֝בוּנָ֗ה לִ/מְצֹא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/008.yaml
  text: Whoever gains sense loves his own life[b][a]; whoever keeps understanding will find good.
translation:
  language: de
  text: Wer Verstand erwirbt,[a] liebt sein Leben;[b] wer Einsicht bewahrt, findet Gutes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „erwirbt Herz“. In der hebräischen Weisheitsliteratur steht das „Herz“ oft für den Verstand und die Fähigkeit, richtig zu urteilen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „liebt sich selbst“ oder „liebt seine Seele“. Das hebräische Wort kann die eigene Person oder das Leben bezeichnen, nicht nur die Seele in einem engeren Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹנֶה
  choice: erwirbt
  rationale: Das qal-Partizip bezeichnet das Erlangen oder Erwerben. „Erwirbt“ bildet die aktive Aneignung knapp und natürlich ab.
- source_word: לֵב
  choice: Verstand
  rationale: Wörtlich steht „Herz“; in der hebräischen Weisheitsliteratur bezeichnet לֵב jedoch häufig das Denk- und Urteilsvermögen. „Verstand“ vermittelt diese Bedeutung im modernen Deutschen.
- source_word: אֹהֵב נַפְשׁוֹ
  choice: liebt sein Leben
  rationale: נֶפֶשׁ kann hier das eigene Leben oder Selbst bezeichnen. „Sein Leben“ vermeidet eine Verengung auf eine vom Körper getrennte Seele und erhält zugleich die Bildsprache.
- source_word: שֹׁמֵר
  choice: bewahrt
  rationale: Das Partizip bezeichnet achtsames Hüten und Festhalten. „Bewahrt“ passt im Deutschen natürlich zum abstrakten Objekt „Einsicht“.
- source_word: תְּבוּנָה
  choice: Einsicht
  rationale: Der Weisheitsbegriff meint verständiges Unterscheidungsvermögen. „Einsicht“ ist prägnant und verhindert eine unnötige Wiederholung von „Verstand“.
- source_word: לִמְצֹא טוֹב
  choice: findet Gutes
  rationale: Die Konstruktion mit ל und Infinitiv kann Ziel oder Ergebnis ausdrücken. Im parallelen, zeitlos formulierten Spruch gibt „findet Gutes“ die Folge knapp wieder, ohne die Aussage unnötig zeitlich festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Die parallelen Partizipialkonstruktionen werden als zeitlose Aussagen im Präsens wiedergegeben.
