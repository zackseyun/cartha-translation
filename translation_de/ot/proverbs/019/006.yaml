source:
  edition: WLC
  text: רַ֭בִּים יְחַלּ֣וּ פְנֵֽי נָדִ֑יב וְ/כָל הָ֝/רֵ֗עַ לְ/אִ֣ישׁ מַתָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/006.yaml
  text: Many seek the favor of a noble man[b][a], and everyone is a friend to a man who gives gifts.
translation:
  language: de
  text: Viele suchen die Gunst eines Vornehmen[a], und jeder ist mit einem Mann befreundet, der Geschenke macht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines Freigebigen“; auch „eines Fürsten“. Das hebräische Wort kann einen Vornehmen oder eine freigebige Person bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und jeder ist ein Freund eines Mannes der Gabe“; gemeint ist ein Mann, der Geschenke gibt.'
    reason: literal_rendering
lexical_decisions:
- source_word: רַבִּים
  choice: Viele
  rationale: Die knappe substantivische Wiedergabe entspricht dem hebräischen Quantor und dem prägnanten Stil eines Sprichworts.
- source_word: יְחַלּוּ פְנֵי
  choice: suchen die Gunst
  rationale: Die Verbindung aus dem Piel von חלה und פְנֵי bezeichnet idiomatisch das Bitten um beziehungsweise Werben um die Gunst einer Person; eine wörtliche Wiedergabe mit „Gesicht“ wäre im Deutschen missverständlich.
- source_word: נָדִיב
  choice: eines Freigebigen
  rationale: Das Wort kann einen Vornehmen beziehungsweise Fürsten oder einen freigebigen Menschen bezeichnen. Der parallele Hinweis auf Geschenke legt hier die Bedeutung „freigebig“ nahe, ohne die andere Möglichkeit in der Fußnote zu verschweigen.
- source_word: וְכָל
  choice: und jeder
  rationale: Bewahrt die umfassende Aussage des hebräischen כָּל in natürlichem Deutsch.
- source_word: הָרֵעַ
  choice: ist … befreundet
  rationale: Gibt die Beziehung zu einem Freund oder Gefährten idiomatisch wieder und vermeidet die im Deutschen schwerfällige Formulierung „ist ein Freund einem Mann“.
- source_word: לְאִישׁ מַתָּן
  choice: mit einem Mann …, der Geschenke macht
  rationale: Die knappe hebräische Verbindung „Mann der Gabe/Geschenke“ bezeichnet hier idiomatisch einen Mann, der Geschenke gibt; der maskuline Singular des Ausgangstextes bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Die idiomatischen Wendungen werden natürlich wiedergegeben; die echte Mehrdeutigkeit von נָדִיב bleibt durch die Fußnote sichtbar.
