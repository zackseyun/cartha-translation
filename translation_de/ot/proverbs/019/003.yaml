id: PRO.19.3
reference: Proverbs 19:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִוֶּ֣לֶת אָ֭דָם תְּסַלֵּ֣ף דַּרְכּ֑/וֹ וְ/עַל יְ֝הוָ֗ה יִזְעַ֥ף לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/003.yaml
  text: A man's folly ruins his way[b][a], and his heart rages against Yahweh.
translation:
  language: de
  text: Die Torheit eines Menschen[a] verdirbt seinen Weg[b], und sein Herz grollt gegen Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort steht im Singular und meint hier einen Menschen ganz allgemein.
    reason: cultural_note
  - marker: b
    text: 'Oder: „macht seinen Weg krumm“ beziehungsweise „verdreht seinen Weg“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: Torheit
  rationale: „Torheit“ ist ein prägnanter, in der Weisheitsliteratur gebräuchlicher Ausdruck für törichtes Denken und Handeln und bewahrt den Gegensatz zur Weisheit.
- source_word: אָדָם
  choice: eines Menschen
  rationale: Das singularische אָדָם bezeichnet hier einen einzelnen Menschen in allgemeingültigem Sinn. „Eines Menschen“ gibt diesen generischen Gebrauch im heutigen Deutsch natürlich wieder.
- source_word: תְּסַלֵּף
  choice: verdirbt
  rationale: Das Piel von סלף bezeichnet ein Verdrehen, Verkrümmen oder Zugrunderichten. „Verdirbt“ gibt im Zusammenhang mit dem Lebensweg die zerstörerische Wirkung natürlich wieder; die konkretere Bildsprache wird in einer Fußnote genannt.
- source_word: דַּרְכּוֹ
  choice: seinen Weg
  rationale: „Weg“ bewahrt das zentrale weisheitliche Bild für Lebensführung und Lebenslauf.
- source_word: וְעַל
  choice: und … gegen
  rationale: Die koordinierende Verbindung und die Richtung der feindseligen Regung werden eng am Hebräischen wiedergegeben, ohne den logischen Bezug ausdrücklich als Gegensatz auszulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יִזְעַף
  choice: grollt
  rationale: Das Verb bezeichnet heftigen Unmut oder Zorn. „Grollt“ drückt anhaltende innere Feindseligkeit aus und passt zum ausdrücklich genannten Herzen.
- source_word: לִבּוֹ
  choice: sein Herz
  rationale: „Herz“ bleibt als hebräisches Bild für das innere Denken, Wollen und Empfinden erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt dessen Charakter als Gottesname.
- issue: Verhältnis zwischen eigener Torheit und Zorn gegen Gott
  choice: Koordination mit „und“
  alternative: kontrastierendes „doch“
  rationale: 'Das hebräische ו verbindet die Aussagen, ohne das genaue Verhältnis grammatisch festzulegen. „Und“ bewahrt die Spannung: Der Mensch verdirbt durch eigene Torheit seinen Weg und richtet dennoch seinen Groll gegen Jahwe.'
- issue: Generischer Gebrauch von אָדָם
  choice: eines Menschen
  alternative: eines Mannes
  rationale: אָדָם ist hier singularisch, aber allgemein auf einen Menschen bezogen. Die Übersetzung bewahrt sowohl den Singular als auch die generische Aussage, ohne das Geschlecht unnötig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Satzform. Das weisheitliche Weg-Motiv und das anthropologische Bild des Herzens bleiben erhalten.
