review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die beiden hebräischen Teilsätze und ihre Koordination zuverlässig wieder. „Torheit“ entspricht אִוֶּלֶת, „verdirbt seinen Weg“ vermittelt die zerstörende bzw. krumm machende Wirkung von תְּסַלֵּף auf den Lebensweg, und „sein Herz grollt gegen Jahwe“ bewahrt sowohl לֵב als inneres Zentrum als auch die gegen Jahwe gerichtete zornige Reaktion. Die nicht näher spezifizierte Verbindung mit וְ bleibt zutreffend als „und“ erhalten.
  naturalness: Der Satz ist klares, modernes Standarddeutsch und behält zugleich die knappe, sprichwörtliche Form. „Torheit“ und „Weg“ sind im weisheitlichen Register idiomatisch. „Grollt gegen Jahwe“ ist verständlich und stilistisch passend, auch wenn es die anhaltende Seite des Zorns stärker hervorhebt.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen als Eigenname wieder. „Eines Menschen“ trifft den generischen Singular von אָדָם ohne unnötige Geschlechtsfestlegung. Das Bildwort „Herz“ bleibt zu Recht erhalten. Die Fußnote zu „Weg“ dokumentiert die konkrete Alternative „krumm machen/verdrehen“ sachgerecht.
