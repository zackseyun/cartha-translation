  source_fidelity: 'Die Übersetzung bildet die zwei nominalen Vergleichssätze des Hebräischen treffend ab: נַהַם als „Knurren“, כְּפִיר als „junger Löwe“, זַעַף als „Zorn“, und רְצוֹנוֹ als „seine Gunst“. „Doch“ macht den sachlichen Kontrast der parallelen Satzglieder idiomatisch sichtbar, ohne dem Waw eine unvertretbare Bedeutung aufzuzwingen. Das Bild von Tau auf dem Gras bleibt erhalten.'
  naturalness: „Wie das Knurren eines jungen Löwen ist der Zorn eines Königs, doch seine Gunst ist wie Tau auf dem Gras“ ist modernes, gut verständliches Deutsch und wahrt den knappen, würdevollen Spruchstil.
