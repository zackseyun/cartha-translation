  text: נַ֣הַם כַּ֭/כְּפִיר זַ֣עַף מֶ֑לֶךְ וּ/כְ/טַ֖ל עַל עֵ֣שֶׂב רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/012.yaml
  text: A king’s wrath is like the growling of a young lion[b][a], but his favor is like dew on the grass.
translation:
  language: de
  text: Wie das Knurren eines jungen Löwen ist der Zorn eines Königs, doch seine Gunst ist wie Tau auf dem Gras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Gunst ist wie Tau auf dem Grün.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַהַם
  choice: Knurren
  rationale: Das Substantiv bezeichnet den drohenden Laut eines Löwen und kann je nach Zusammenhang auch als Brüllen verstanden werden. „Knurren“ gibt die bedrohliche Wirkung natürlich und prägnant wieder.
- source_word: כְּפִיר
  choice: junger Löwe
  rationale: Der Ausdruck bezeichnet gewöhnlich einen jungen, bereits kräftigen und gefährlichen Löwen; „junger Löwe“ ist klarer als „Löwenjunges“.
- source_word: זַעַף
  choice: Zorn
  rationale: Das Wort bezeichnet heftigen Unwillen oder Grimm. „Zorn“ wahrt die gehobene Kraft des Spruchs und bleibt allgemein verständlich.
- source_word: מֶלֶךְ
  choice: König
  rationale: Direkte und kontextgerechte Wiedergabe der Bezeichnung für den Herrscher.
- source_word: וּכְטַל
  choice: doch … wie Tau
  rationale: Das hebräische Waw verbindet die beiden parallelen Satzhälften; wegen ihres inhaltlichen Gegensatzes gibt „doch“ die Beziehung im Deutschen natürlich wieder, ohne den Sinn zu verändern.
- source_word: עַל עֵשֶׂב
  choice: auf dem Gras
  rationale: Die konkrete Bildsprache wird bewahrt; „Gras“ ist im modernen Deutsch die natürliche Wiedergabe von עֵשֶׂב in diesem poetischen Zusammenhang.
- source_word: רְצוֹנוֹ
  choice: seine Gunst
  rationale: רָצוֹן kann Gunst, Wohlwollen oder Gefallen bezeichnen. Im Gegensatz zum Zorn des Königs trifft „Gunst“ den königlichen und zwischenmenschlichen Zusammenhang am besten.
theological_decisions: []
