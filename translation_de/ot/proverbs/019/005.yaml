source:
  edition: WLC
  text: עֵ֣ד שְׁ֭קָרִים לֹ֣א יִנָּקֶ֑ה וְ/יָפִ֥יחַ כְּ֝זָבִ֗ים לֹ֣א יִמָּלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/005.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will not escape.
translation:
  language: de
  text: Ein falscher Zeuge bleibt nicht unbestraft,[a] und wer Lügen ausstößt,[b] wird nicht entkommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird nicht freigesprochen“ beziehungsweise „gilt nicht als unschuldig“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Lügen aushaucht“; gemeint ist, Lügen frei oder immer wieder auszusprechen. Auch möglich: „Lügen äußert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: ein falscher Zeuge
  rationale: Die Constructusverbindung bezeichnet einen Zeugen, dessen Aussage von Falschheit geprägt ist. „Falscher Zeuge“ ist im Deutschen idiomatisch und bewahrt den rechtlichen beziehungsweise aussagebezogenen Sinn.
- source_word: יִנָּקֶה
  choice: bleibt nicht unbestraft
  rationale: Das Nifal von נקה kann bedeuten, von Strafe frei oder für unschuldig erklärt zu werden. Im weisheitlich-juristischen Zusammenhang gibt „bleibt nicht unbestraft“ die unausweichliche Folge klar und natürlich wieder.
- source_word: וְיָפִיחַ כְּזָבִים
  choice: und wer Lügen ausstößt
  rationale: Das Hifil von פוח bezeichnet wörtlich ein Ausblasen oder Aushauchen und bildlich das Äußern von Worten. „Lügen ausstößt“ erhält das kräftige hebräische Bild, ohne im Deutschen unverständlich zu wirken.
- source_word: כְּזָבִים
  choice: Lügen
  rationale: Der Plural bezeichnet falsche Aussagen. „Lügen“ ist direkt, geläufig und bildet eine klare Parallele zum falschen Zeugen.
- source_word: יִמָּלֵט
  choice: wird nicht entkommen
  rationale: Das Nifal von מלט bedeutet entkommen oder gerettet werden. „Wird nicht entkommen“ bewahrt die offene Aussage darüber, dass ein Entrinnen ausgeschlossen ist, ohne das Mittel oder die konkrete Folge näher festzulegen.
theological_decisions:
- issue: Worin das angedrohte Nichtentkommen besteht
  choice: Die allgemeine Formulierung „wird nicht entkommen“ bleibt bestehen.
  alternative: „wird der Strafe nicht entkommen“
  rationale: Der Parallelismus legt Bestrafung nahe, doch der zweite Halbvers nennt sie nicht ausdrücklich. Die Übersetzung bewahrt daher die knappe Offenheit des Hebräischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Spruchstruktur. Die Wiederholung von „nicht“ und die parallelen Zukunftsaussagen bleiben erhalten. Das ungewöhnliche Bild des Aushauchens wird in verständlicher Form bewahrt; die Fußnote erläutert die wörtlichere Wiedergabe.
