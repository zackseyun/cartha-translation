  text: אֱ֭וִלִים יָלִ֣יץ אָשָׁ֑ם וּ/בֵ֖ין יְשָׁרִ֣ים רָצֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/009.yaml
  text: Fools mock guilt[b][a], but among the upright there is favor.
translation:
  language: de
  text: Toren spotten über Schuld[a], doch unter den Aufrichtigen herrscht Wohlwollen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über das Schuldopfer«. Das hebräische Wort kann sowohl »Schuld« als auch in kultischem Zusammenhang »Schuldopfer« bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: »Gunst«, »Annahme« oder »Wohlgefallen«. Der hebräische Text sagt nicht ausdrücklich, wessen Wohlwollen gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: Toren
  rationale: Bezeichnet in der Weisheitsliteratur moralisch uneinsichtige Menschen; »Toren« ist die knappe, geläufige deutsche Entsprechung.
- source_word: יָלִיץ
  choice: spotten über
  rationale: Die Hifil-Form von לוץ bezeichnet hier spöttisches oder geringschätziges Verhalten. Die deutsche Verbindung »über etwas spotten« gibt dies natürlich wieder.
- source_word: אָשָׁם
  choice: Schuld
  rationale: Im ethischen Zusammenhang des Spruchs liegt die abstrakte Bedeutung »Schuld« nahe. Die ebenfalls mögliche kultische Bedeutung »Schuldopfer« bleibt in einer Fußnote erhalten.
- source_word: וּבֵין
  choice: doch bei
  rationale: Die Verbindung leitet den gegensätzlichen zweiten Halbvers ein. »Doch bei« bildet sowohl den Kontrast als auch den Bereichsbezug verständlich ab.
- source_word: יְשָׁרִים
  choice: den Aufrichtigen
  rationale: Übliche Bezeichnung der Weisheitsliteratur für moralisch geradlinige Menschen.
- source_word: רָצוֹן
  choice: Wohlwollen
  rationale: Das Wort kann Wohlwollen, Gunst, Annahme oder Wohlgefallen bezeichnen. »Wohlwollen« lässt offen, ob es von Gott, von Menschen oder gegenseitig gewährt wird.
theological_decisions:
- issue: Bedeutung von אָשָׁם im weisheitlichen Kontext
  choice: abstrakt »Schuld«
  alternative: »Schuldopfer«; auch »Vergehen« ist lexikalisch möglich
  rationale: Der ethische Gegensatz zwischen Toren und Aufrichtigen spricht eher für menschliche Schuld als für ein kultisches Opfer. Wegen der echten lexikalischen Mehrdeutigkeit wird »Schuldopfer« als Alternative ausgewiesen.
- issue: Urheber oder Träger des רָצוֹן
  choice: durch »Wohlwollen« unbestimmt gelassen
  alternative: Gottes Gunst, menschliches Wohlwollen oder Annahme
  rationale: Der hebräische Text nennt nicht, wessen Wohlwollen gemeint ist. Die Übersetzung vermeidet deshalb eine theologische Festlegung.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch im Stil eines Weisheitsspruchs. Die antithetische Zweigliedrigkeit bleibt erhalten; die Mehrdeutigkeit der Schlüsselwörter wird nicht konfessionell oder dogmatisch verengt.
