source:
  edition: WLC
  text: מִ/דְּרָכָ֣י/ו יִ֭שְׂבַּע ס֣וּג לֵ֑ב וּ֝/מֵ/עָלָ֗י/ו אִ֣ישׁ טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/014.yaml
  text: The one who turns away in heart will be filled with his own ways[b][a], and a good man with what comes from himself.
translation:
  language: de
  text: Wer sich im Herzen abwendet, wird von seinen eigenen Wegen satt[a], und ein guter Mensch von dem, was aus ihm selbst kommt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird von seinen Wegen satt“. Gemeint sein kann, dass er die Folgen seines eigenen Lebenswandels reichlich erfährt.'
    reason: lexical_alternative
  - marker: b
    text: 'Die zweite Vershälfte ist im Hebräischen knapp und schwer verständlich. Möglich ist auch: „und ein guter Mensch von seinen eigenen Taten“. Wahrscheinlich wird das Verb „wird satt“ aus der ersten Hälfte mitgedacht.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִדְּרָכָיו
  choice: von seinen eigenen Wegen
  rationale: מִן bezeichnet hier die Quelle dessen, wovon jemand satt wird. Die vergleichsweise formnahe Wiedergabe bewahrt das Bild und vermeidet die nicht ausdrücklich im Hebräischen stehende Ergänzung „Frucht“.
- source_word: יִשְׂבַּע
  choice: wird … satt
  rationale: Das Verb bezeichnet Sattwerden oder Gesättigtsein. „Satt werden“ erhält das konkrete Bild und kann gedanklich auch auf die elliptische zweite Vershälfte bezogen werden.
- source_word: סוּג לֵב
  choice: wer sich im Herzen abwendet
  rationale: סוּג beschreibt ein Zurückweichen oder Sichabwenden; לֵב kennzeichnet die innere Ausrichtung. Die Formulierung ist transparent und legt sich nicht unnötig auf einen konfessionell geprägten Begriff wie „Abtrünniger“ fest.
- source_word: וּמֵעָלָיו
  choice: und … von dem, was aus ihm selbst kommt
  rationale: Die schwierige und elliptische Wendung wird im Parallelismus am ehesten als Quellenangabe verstanden. Die Wiedergabe macht diesen wahrscheinlichen Sinn verständlich, ohne ihn im Haupttext mit „Taten“ oder „Frucht“ weiter auszudeuten.
- source_word: אִישׁ טוֹב
  choice: ein guter Mensch
  rationale: אִישׁ ist grammatisch maskulin, wird in der allgemeinen Spruchweisheit hier jedoch repräsentativ gebraucht. „Ein guter Mensch“ gibt den generischen Sinn in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Vergeltungs- bzw. Folgeprinzip des eigenen Lebenswandels
  choice: Das Bild des Sattwerdens aus den eigenen Wegen beziehungsweise aus dem Eigenen bleibt stehen.
  alternative: Ausdrücklich von göttlicher Belohnung und Bestrafung oder von der „Frucht der Taten“ sprechen.
  rationale: Der Vers nennt weder Gott als unmittelbar Handelnden noch ausdrücklich „Frucht“ oder „Taten“. Die Übersetzung bewahrt deshalb die offene spruchhafte Aussage über die Folgen der inneren Ausrichtung und des Lebenswandels.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem Parallelismus. „Satt werden“ hält das anschauliche hebräische Bild fest; die syntaktische Ellipse der zweiten Vershälfte wird nicht vollständig eingeebnet, aber durch „von dem, was aus ihm selbst kommt“ verständlich gemacht.
