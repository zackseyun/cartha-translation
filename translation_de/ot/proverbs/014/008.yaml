id: PRO.14.8
reference: Proverbs 14:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חָכְמַ֣ת עָ֭רוּם הָבִ֣ין דַּרְכּ֑/וֹ וְ/אִוֶּ֖לֶת כְּסִילִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/008.yaml
  text: The wisdom of the prudent is to understand his way[b][a], but the folly of fools is deceit.
translation:
  language: de
  text: Die Weisheit des Klugen besteht darin, seinen Weg zu verstehen[a]; doch die Torheit der Narren ist Täuschung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Weisheit des Umsichtigen liegt darin, seinen Pfad zu erkennen.“'
    reason: lexical_alternative
  - marker: b
    text: „Täuschung“ kann hier sowohl betrügerisches Verhalten als auch Selbsttäuschung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמַת
  choice: die Weisheit des
  rationale: Die Konstruktusform wird als natürliche deutsche Genitivverbindung wiedergegeben.
- source_word: עָרוּם
  choice: des Klugen
  rationale: Im Kontext der Sprüche bezeichnet עָרוּם positiv einen umsichtig und verständig handelnden Menschen; „klug“ ist idiomatisch und vermeidet den negativen Beiklang von „listig“.
- source_word: הָבִין
  choice: besteht darin, … zu verstehen
  rationale: Die Form bestimmt prädikativ, worin die Weisheit des Klugen liegt. Die Wendung erhält den definierenden Charakter des Spruchs.
- source_word: דַּרְכּוֹ
  choice: seinen Weg
  rationale: Bewahrt den maskulinen Singularsuffix und die für דֶּרֶךְ typische Bedeutung des eigenen Weges beziehungsweise Lebenswandels.
- source_word: וְאִוֶּלֶת
  choice: doch die Torheit
  rationale: Das וְ verbindet hier zwei antithetische Satzhälften; „doch“ gibt den Gegensatz knapp und würdig wieder.
- source_word: כְּסִילִים
  choice: der Narren
  rationale: „Narren“ ist der geläufige weisheitliche Gegenbegriff zu den Klugen und wahrt den Plural.
- source_word: מִרְמָה
  choice: Täuschung
  rationale: Der Ausdruck kann sowohl täuschendes Verhalten als auch Selbsttäuschung bezeichnen. „Täuschung“ hält diese Mehrdeutigkeit eher offen als eine explizitere Formulierung.
theological_decisions:
- issue: Repräsentatives Maskulinum in דַּרְכּוֹ
  choice: „seinen Weg“
  alternative: „ihren Weg“ oder „den eigenen Weg“
  rationale: Der hebräische Text hat ein maskulines Singularsuffix. Die Wiedergabe wahrt diese Form, ohne den allgemein anwendbaren Charakter des Spruchs einzuschränken.
- issue: Moralische Nuance von עָרוּם
  choice: positiv als „der Kluge“
  alternative: „der Listige“ oder „der Schlaue“
  rationale: Die Gegenüberstellung von Weisheit und Torheit verlangt hier die positive Bedeutung von Umsicht beziehungsweise Klugheit.
- issue: Reichweite von מִרְמָה
  choice: mehrdeutig als „Täuschung“
  alternative: „Betrug“ als ausschließlich aktives Täuschen oder eine ausdrückliche Wiedergabe als „Selbsttäuschung“
  rationale: Der knappe Nominalsatz legt nicht eindeutig fest, ob das Wort betrügerisches Verhalten, Selbsttäuschung oder beides bezeichnet; diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappem, würdigem Spruchton. Der parallele Gegensatz zwischen Klugheit und Torheit bleibt deutlich; die Mehrdeutigkeit des Schlusswortes wird durch eine Fußnote bewahrt.
