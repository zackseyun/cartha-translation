source:
  edition: WLC
  text: הֲֽ/לוֹא יִ֭תְעוּ חֹ֣רְשֵׁי רָ֑ע וְ/חֶ֥סֶד וֶ֝/אֱמֶ֗ת חֹ֣רְשֵׁי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/022.yaml
  text: Will not those who devise evil go astray? But steadfast love and faithfulness belong to those who devise good[a].
translation:
  language: de
  text: Gehen nicht diejenigen in die Irre, die Böses planen? Doch beständige Liebe und Treue gehören denen, die Gutes planen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Güte und Wahrheit“ oder „Barmherzigkeit und Treue“. Das hebräische Wortpaar bezeichnet häufig loyale Liebe zusammen mit Verlässlichkeit oder Wahrhaftigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Gehen nicht …?
  rationale: Die Partikel leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet. Die deutsche Frageform bewahrt diesen Nachdruck, ohne ihn in eine Aussage umzudeuten.
- source_word: יִתְעוּ
  choice: in die Irre gehen
  rationale: Das Verb bezeichnet das Abirren oder Fehlgehen. Die geläufige deutsche Wendung erhält sowohl das Wegmotiv als auch den moralischen Sinn.
- source_word: חֹרְשֵׁי רָע
  choice: die Böses planen
  rationale: Das Partizip von חרשׁ bezeichnet hier ein bewusstes Ausdenken oder Planen. Die Wiedergabe macht die absichtliche Ausrichtung auf das Böse deutlich.
- source_word: רָע
  choice: Böses
  rationale: Das substantivisch gebrauchte Adjektiv steht im ethischen Gegensatz zu טוֹב. „Böses“ wahrt diesen knappen Gegensatz.
- source_word: חֶסֶד
  choice: beständige Liebe
  rationale: חֶסֶד umfasst verlässliche, loyale Güte und Liebe. „Beständige Liebe“ bringt die Dauerhaftigkeit und die zwischenmenschliche Tiefe des Begriffs zum Ausdruck; Alternativen werden in der Fußnote genannt.
- source_word: אֱמֶת
  choice: Treue
  rationale: In der festen Wortverbindung חֶסֶד וֶאֱמֶת bezeichnet אֱמֶת häufig Verlässlichkeit oder Treue, nicht nur abstrakte Wahrheit.
- source_word: חֹרְשֵׁי טוֹב
  choice: die Gutes planen
  rationale: Die Wiederholung von „planen“ entspricht demselben hebräischen Partizip wie in der ersten Vershälfte und erhält den bewussten Gegensatz.
- source_word: טוֹב
  choice: Gutes
  rationale: Das substantivisch gebrauchte Adjektiv bildet den prägnanten ethischen Gegenpol zu „Böses“.
theological_decisions:
- issue: Verhältnis von „beständiger Liebe und Treue“ zu denen, die Gutes planen
  choice: „gehören denen, die Gutes planen“
  alternative: „begegnen denen, die Gutes planen“ / „finden sich bei denen, die Gutes planen“
  rationale: Im Hebräischen fehlt ein ausdrückliches Verb. „Gehören“ ergänzt eine im Deutschen notwendige Beziehung, ohne eindeutig festzulegen, ob diese Eigenschaften von den Betreffenden ausgehen, sie kennzeichnen oder ihnen widerfahren. So bleibt die knappe Offenheit des Ausgangstextes weitgehend erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Formulierung „Böses planen“ und „Gutes planen“ bildet die antithetische Struktur des hebräischen Spruchs ab; die rhetorische Frage bleibt erhalten.
