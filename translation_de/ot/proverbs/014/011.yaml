id: PRO.14.11
reference: Proverbs 14:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֵּ֣ית רְ֭שָׁעִים יִשָּׁמֵ֑ד וְ/אֹ֖הֶל יְשָׁרִ֣ים יַפְרִֽיחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/011.yaml
  text: The house of the wicked will be destroyed[a], but the tent of the upright will flourish.
translation:
  language: de
  text: Das Haus der Frevler wird vernichtet, doch das Zelt der Aufrichtigen wird aufblühen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird sprossen« oder »wird gedeihen«; das hebräische Verb gebraucht das Bild von neuem Wachstum und Aufblühen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  choice: das Haus der
  rationale: Die Konstruktverbindung wird als Genitivfügung wiedergegeben. »Haus« bewahrt den konkreten Gegensatz zu »Zelt« und kann zugleich den zugehörigen Haushalt mitmeinen.
- source_word: רְשָׁעִים
  choice: Frevler
  rationale: Das substantivierte Adjektiv bezeichnet moralisch schuldhaft handelnde Menschen. »Frevler« ist knapp, würdevoll und stellt den ethischen Gegensatz zu den Aufrichtigen klar heraus.
- source_word: יִשָּׁמֵד
  choice: wird vernichtet
  rationale: Der Nifal-Imperfekt von שׁמד bezeichnet das Zerstört- oder Zugrunde-gerichtet-Werden. »Wird vernichtet« gibt die Schärfe der Warnung wieder, ohne eine über den Vers hinausgehende Deutung hinzuzufügen.
- source_word: אֹהֶל
  choice: Zelt
  rationale: 'Die konkrete Bedeutung wird beibehalten, damit der pointierte Gegensatz bestehen bleibt: Das feste Haus der Frevler vergeht, während selbst das Zelt der Aufrichtigen gedeiht.'
- source_word: יְשָׁרִים
  choice: der Aufrichtigen
  rationale: Das Wort bezeichnet Menschen, die moralisch gerade und redlich sind. »Aufrichtige« bewahrt diese besondere Bild- und Bedeutungsnuance.
- source_word: יַפְרִיחַ
  choice: wird aufblühen
  rationale: Die Hifil-Form von פרח ruft das Bild des Sprossens und Blühens hervor. »Aufblühen« vermittelt sowohl dieses Wachstumsbild als auch den übertragenen Sinn des Gedeihens.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche und zugleich sprichwörtlich-würdevolle Standardsprache. Die parallele Gegenüberstellung von »Haus« und »Zelt« sowie von »Frevlern« und »Aufrichtigen« bleibt erhalten. Der Fußnotenmarker steht beim zugehörigen Verb »aufblühen«.
