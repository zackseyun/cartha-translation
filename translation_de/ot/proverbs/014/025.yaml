  yaml_path: translation/ot/proverbs/014/025.yaml
  text: A truthful witness rescues lives[c][b][a], but one who breathes out lies is deceitful.
translation:
  language: de
  text: Ein wahrhaftiger Zeuge rettet Menschenleben[a], doch wer Lügen aushaucht[b], ist trügerisch[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „rettet Seelen“ oder „rettet Menschen“. Das hebräische Wort bezeichnet hier Personen beziehungsweise ihr Leben, nicht eigens immaterielle Seelen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wer Lügen aushaucht“. Das Hebräische gebraucht ein anschauliches Bild für das Äußern von Unwahrheiten.'
    reason: lexical_alternative
  - marker: c
    text: 'Der letzte Satzteil kann wörtlicher auch heißen: „und wer Lügen aushaucht, ist Trug“; er kann auch adverbial verstanden werden: „wer Lügen trügerisch aushaucht“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: rettet
  rationale: Das Hifil-Partizip von נצל bezeichnet das Befreien oder Retten aus Gefahr. „Rettet“ ist im Deutschen natürlich und passt zum konkreten Zusammenhang einer Zeugenaussage.
- source_word: נְפָשׁוֹת
  choice: Menschenleben
  rationale: Der Plural von נֶפֶשׁ bezeichnet hier Menschen beziehungsweise ihr Leben, nicht speziell immaterielle Seelen. „Menschenleben“ macht den praktischen Sinn im Zusammenhang eines Zeugen klar.
- source_word: עֵד אֱמֶת
  choice: ein wahrhaftiger Zeuge
  rationale: Die Verbindung bezeichnet einen Zeugen, der von Wahrheit geprägt und zuverlässig ist. „Wahrhaftig“ gibt diese moralische Qualität in würdigem, verständlichem Deutsch wieder.
- source_word: וְיָפִחַ
  choice: doch wer … ausstößt
  rationale: פוח zeichnet wörtlich das Aushauchen oder Ausstoßen nach und wird bildlich für das Äußern von Worten gebraucht. „Ausstoßen“ bewahrt das kräftige Bild, ohne im Deutschen unverständlich zu wirken.
- source_word: כְּזָבִים
  choice: Lügen
  rationale: Das Substantiv im Plural bezeichnet unwahre Aussagen; „Lügen“ ist die klare und direkte deutsche Entsprechung.
- source_word: מִרְמָה
  choice: ist ein Betrüger
  rationale: Das knappe Schlusswort bezeichnet Täuschung oder Trug. In der parallelen Personencharakterisierung ist „ist ein Betrüger“ idiomatisch; die nominale Härte des Hebräischen und alternative syntaktische Deutungen werden in der Fußnote kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in knapper, sprichwortartiger und würdiger Form. Die Bildhaftigkeit des hebräischen פוח bleibt mit „ausstößt“ erhalten; mögliche Bedeutungs- und Syntaxalternativen werden in den Fußnoten offengelegt.
