  text: גַּם לְ֭/רֵעֵ/הוּ יִשָּׂ֣נֵא רָ֑שׁ וְ/אֹהֲבֵ֖י עָשִׁ֣יר רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/020.yaml
  text: A poor person is hated even by his neighbor[a], but those who love the rich are many.
translation:
  language: de
  text: Ein Armer wird sogar von seinem Nächsten[a] gehasst, doch zahlreich sind die, die einen Reichen lieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von seinem Freund“; das hebräische Wort kann einen Nächsten, Gefährten oder Freund bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: sogar
  rationale: 'Die Partikel verstärkt die bittere Aussage: Die Ablehnung trifft den Armen sogar durch jemanden aus seinem nahen sozialen Umfeld.'
- source_word: לְרֵעֵהוּ
  choice: von seinem Nächsten
  rationale: Die Präposition bezeichnet beim Passiv den Handelnden. „Nächster“ gibt den weiten Sinn von Nachbar oder nahestehender Person wieder; „Freund“ bleibt eine mögliche Alternative.
- source_word: יִשָּׂנֵא
  choice: wird … gehasst
  rationale: Die Nifal-Form ist passiv; der Arme ist derjenige, dem der Hass gilt.
- source_word: רָשׁ
  choice: ein Armer
  rationale: Das substantivierte Adjektiv bezeichnet hier allgemein einen mittellosen Menschen und entspricht dem knappen Stil eines Sprichworts.
- source_word: וְאֹהֲבֵי
  choice: doch … die … lieben
  rationale: Die partizipiale Form bleibt verbal wiedergegeben und bewahrt so den Gegensatz zwischen Gehasstwerden und Lieben.
- source_word: עָשִׁיר
  choice: einen Reichen
  rationale: Die singularische Bezeichnung wird als allgemeiner Vertreter einer wohlhabenden Person verstanden und parallel zu „ein Armer“ formuliert.
- source_word: רַבִּים
  choice: zahlreich sind
  rationale: Die prädikative Aussage über die große Zahl wird direkt und in würdigem Sprichwortstil wiedergegeben.
theological_decisions: []
