  source_fidelity: 'Die Übersetzung gibt die erste Vershälfte präzise wieder. „Gerechtigkeit“ und „erhöht“ entsprechen צְדָקָה und תְרוֹמֵם angemessen; „ein Volk“ wahrt den generischen Singular von גּוֹי. Die zweite, im Hebräischen schwierige Vershälfte folgt der traditionellen, auch im englischen Audit vertretenen Gesamtdeutung: Sünde steht in Verbindung mit Schande bzw. Schmach für Völker. Das adversative „doch“ ist als sachgerechte Explizierung des poetischen Kontrasts vertretbar.'
