id: PRO.14.34
reference: Proverbs 14:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: צְדָקָ֥ה תְרֽוֹמֵֽם גּ֑וֹי וְ/חֶ֖סֶד לְאֻמִּ֣ים חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/034.yaml
  text: Righteousness exalts a nation[a], but sin is a disgrace to peoples.
translation:
  language: de
  text: Gerechtigkeit erhöht ein Volk, doch Sünde ist für Völker eine Schande.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zweite Vershälfte ist im Hebräischen schwer zu deuten. Traditionell versteht man sie so, dass Sünde den Völkern Schande bringt. Das hier mit „Schande“ wiedergegebene Wort bedeutet sonst meist „Güte“ oder „Treue“, kann hier aber in einem seltenen Sinn „Schmach“ oder „Schande“ bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Das Substantiv bezeichnet moralisch und gesellschaftlich rechtes Handeln. „Gerechtigkeit“ bewahrt den breiten ethischen Sinn und ist im Deutschen natürlicher als „Rechtschaffenheit“ in Verbindung mit einem Volk.
- source_word: תְרוֹמֵם
  choice: erhöht
  rationale: Die Verbform von רום bezeichnet das Erheben oder Hochstellen. „Erhöht“ bewahrt sowohl das Höhenbild als auch den übertragenen Sinn von Ansehen und Größe.
- source_word: גּוֹי
  choice: ein Volk
  rationale: Hier ist allgemein ein politisch-ethnisches Gemeinwesen gemeint, nicht ausdrücklich ein nichtisraelitisches Volk. „Volk“ ist daher kontextgerecht.
- source_word: חֶסֶד
  choice: Schande
  rationale: Obwohl חֶסֶד gewöhnlich „Güte“, „Treue“ oder „Loyalität“ bedeutet, wird es hier aufgrund des antithetischen Parallelismus traditionell in einem seltenen pejorativen Sinn als „Schmach/Schande“ verstanden. Die ungewöhnliche Verwendung wird in der Fußnote kenntlich gemacht.
- source_word: לְאֻמִּים
  choice: für Völker
  rationale: Der Plural wird bewahrt; „Völker“ bildet eine passende poetische Entsprechung zum singularischen „Volk“ der ersten Zeile.
- source_word: חַטָּאת
  choice: Sünde
  rationale: Die geläufige Bedeutung des Substantivs ist „Sünde“. Die deutsche Satzstellung macht „Sünde“ zum Subjekt und „Schande“ zur Prädikatsangabe, ohne die schwierige hebräische Aussage unnötig festzulegen.
theological_decisions:
- issue: Deutung der zweiten Vershälfte וְחֶסֶד לְאֻמִּים חַטָּאת
  choice: „doch Sünde ist für Völker eine Schande“
  alternative: „doch Güte/Treue gegenüber Völkern ist Sünde“ oder eine Konstruktion mit „Schmach“ als Subjekt
  rationale: Die zweite Vershälfte ist sprachlich umstritten, weil חֶסֶד normalerweise positiv „Güte/Treue“ bedeutet. Der antithetische Parallelismus mit der ersten Hälfte spricht jedoch stark für die traditionelle negative Aussage, dass Sünde einem Volk Schande bringt. Die Fußnote wahrt die echte Mehrdeutigkeit, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Spruchform und der Gegensatz zwischen Gerechtigkeit und Sünde bleiben erhalten; „erhöht“ bewahrt bewusst das Bild des hebräischen Verbs.
