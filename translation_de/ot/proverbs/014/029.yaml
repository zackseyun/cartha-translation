  text: אֶ֣רֶךְ אַ֭פַּיִם רַב תְּבוּנָ֑ה וּ/קְצַר ר֝֗וּחַ מֵרִ֥ים אִוֶּֽלֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/029.yaml
  text: One who is slow to anger has great understanding[a], but one who is quick-tempered exalts folly.
translation:
  language: de
  text: Wer nicht schnell zornig wird, besitzt viel Einsicht; wer aber leicht aufbraust[a], erhebt die Torheit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »kurzen Geistes«; gemeint ist ein ungeduldiger oder jähzorniger Mensch.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bedeutet wörtlich »erhebt«; es kann auch den Sinn haben, dass jemand Torheit zur Schau stellt oder hervortreten lässt.
    reason: translation_ambiguity
lexical_decisions:
- source_word: אֶרֶךְ אַפַּיִם
  choice: wer nicht schnell zornig wird
  rationale: Die hebräische Wendung bedeutet wörtlich etwa »lang an den Nasenflügeln« und bezeichnet Geduld beziehungsweise Langsamkeit zum Zorn. Die gewählte Formulierung gibt den idiomatischen Sinn in klarem, modernem Deutsch wieder.
- source_word: רַב תְּבוּנָה
  choice: besitzt viel Einsicht
  rationale: רַב bezeichnet hier ein hohes Maß an תְּבוּנָה. »Viel Einsicht besitzen« ist natürlich und bewahrt den weisheitlichen Sinn von Verständnis und Urteilsvermögen.
- source_word: קְצַר רוּחַ
  choice: wer leicht aufbraust
  rationale: Die wörtliche Wendung »kurz an Geist« bezeichnet hier einen ungeduldigen oder jähzornigen Menschen und bildet den Gegensatz zur Langsamkeit zum Zorn im ersten Halbvers.
- source_word: מֵרִים
  choice: hebt … hoch
  rationale: Das Hifil-Partizip von רום bedeutet grundsätzlich »emporheben, erhöhen«. Die bildhafte Wiedergabe lässt offen, ob das Verhalten die Torheit ehrt, hervortreten lässt oder öffentlich sichtbar macht.
- source_word: אִוֶּלֶת
  choice: Torheit
  rationale: Das Wort bezeichnet im Buch der Sprüche eine moralisch und geistig verfehlte Haltung. »Torheit« ist dafür ein prägnanter, im Deutschen vertrauter Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die parallele Gegenüberstellung der beiden Menschentypen bleibt erhalten; beim zweiten Halbvers wird das hebräische Bild des Emporhebens im Haupttext bewahrt und in der Fußnote erläutert.
