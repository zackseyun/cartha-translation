  text: שַׁח֣וּ רָ֭עִים לִ/פְנֵ֣י טוֹבִ֑ים וּ֝/רְשָׁעִ֗ים עַֽל שַׁעֲרֵ֥י צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/019.yaml
  text: The evil bow down before the good[b][a], and the wicked at the gates of the righteous.
translation:
  language: de
  text: Die Bösen beugen sich vor den Guten nieder[a], und die Frevler beugen sich an den Toren des Gerechten nieder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werfen sich vor den Guten nieder“. Das hebräische Verb kann ein sehr tiefes Sichbeugen bis hin zum Niederwerfen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild von den Frevlern an den Toren des Gerechten kann darauf hindeuten, dass sie abhängig oder bittend zu ihm kommen oder seine Stellung anerkennen.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁחוּ (שׁחה)
  choice: beugen sich nieder
  rationale: Das Verb bezeichnet tiefes Sichbeugen bis hin zum Niederwerfen. „Sich niederbeugen“ bewahrt das konkrete Bild gedemütigter Unterordnung, ohne festzulegen, ob sie freiwillig oder erzwungen geschieht.
- source_word: רָעִים
  choice: die Bösen
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet böse Menschen als allgemeine Gruppe und entspricht dem knappen, antithetischen Stil des Spruchs.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bedeutet „vor“ beziehungsweise „in Gegenwart von“ und passt unmittelbar zur Gebärde des Sichniederbeugens.
- source_word: טוֹבִים
  choice: die Guten
  rationale: Das substantivierte Adjektiv steht im Plural und bildet den direkten Gegenpol zu „die Bösen“.
- source_word: וּרְשָׁעִים
  choice: und die Frevler
  rationale: „Frevler“ gibt die für die Weisheitsliteratur typische Bezeichnung für Menschen wieder, die schuldhaft gegen Recht und Gottes Ordnung handeln; zugleich bleibt die Formulierung knapp.
- source_word: עַל שַׁעֲרֵי
  choice: an den Toren
  rationale: עַל bezeichnet hier idiomatisch den Ort bei beziehungsweise an den Toren. Der Plural des hebräischen Konstrukts wird beibehalten.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Das substantivisch gebrauchte Singularadjektiv bezeichnet einen repräsentativen gerechten Menschen; der Singular des Hebräischen bleibt erhalten.
theological_decisions:
- issue: Ausgang oder gegenwärtige Erfahrung des Spruchs
  choice: Die Aussage wird ohne zeitliche oder eschatologische Präzisierung als sprichwörtliche Feststellung wiedergegeben.
  alternative: Sie ausdrücklich als zukünftigen Triumph der Gerechten oder als stets gegenwärtige gesellschaftliche Wirklichkeit formulieren.
  rationale: Der hebräische Text erklärt weder Zeitpunkt noch Umstände. Die Übersetzung wahrt diese Spannung und fügt keine bestimmte heilsgeschichtliche Deutung hinzu.
- issue: Art der Unterordnung
  choice: „beugen sich nieder“ lässt offen, ob die Unterordnung freiwillig, erzwungen oder bildlich gemeint ist.
  alternative: „bitten um Gnade“ oder „müssen sich unterwerfen“.
  rationale: Solche Wiedergaben würden Motivation oder Zwang ergänzen, die im hebräischen Verb nicht ausdrücklich genannt werden.
translation_notes:
  register: Knapper, würdevoller Spruchstil in modernem Standarddeutsch. Das im zweiten Versglied des Hebräischen nur mitgedachte Verb wird zur natürlichen Verständlichkeit wiederholt. „Die Bösen – die Guten“ und „die Frevler – der Gerechte“ bewahren den antithetischen Parallelismus.
