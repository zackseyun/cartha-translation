  text: יִרְאַ֣ת יְ֭הוָה מְק֣וֹר חַיִּ֑ים לָ֝/ס֗וּר מִ/מֹּ֥קְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/027.yaml
  text: The fear of Yahweh is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: de
  text: Die Furcht Jahwes ist eine Quelle des Lebens[a], um den Schlingen des Todes zu entgehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Quell des Lebens“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um sich von den Schlingen des Todes abzuwenden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: Furcht
  rationale: Bewahrt den zentralen Weisheitsbegriff mit seiner Spannung aus Scheu, Ehrfurcht und gehorsamer Haltung, ohne ihn auf bloßen Respekt zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen geläufige Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מְקוֹר
  choice: Quelle
  rationale: Bezeichnet eine Quelle beziehungsweise einen Quell als lebensspendenden Ursprung und erhält das anschauliche Bild in natürlichem Deutsch.
- source_word: חַיִּים
  choice: Leben
  rationale: Der formal pluralische Ausdruck bezeichnet hier idiomatisch das Leben als Ganzes.
- source_word: לָסוּר
  choice: sie hilft, … zu entgehen
  rationale: Gibt die mögliche Zweck- oder Wirkungsbeziehung des mit לְ gebildeten Infinitivs verständlich wieder, ohne eine ausdrücklich genannte Person einzuführen.
- source_word: מִמֹּקְשֵׁי
  choice: den Fallen … entgehen
  rationale: Bewahrt das Bild tödlicher Fangvorrichtungen; die deutsche Konstruktion mit „entgehen“ gibt die Bewegung weg von ihnen idiomatisch wieder.
- source_word: מָוֶת
  choice: Tod
  rationale: Erhält die im Spruch beabsichtigte Bedeutungsbreite von leiblichem Tod bis hin zu verderblichem Ausgang.
theological_decisions:
- issue: Bedeutung von „Furcht Jahwes“ in der Weisheitsliteratur
  choice: „Furcht Jahwes“
  alternative: „Ehrfurcht vor Jahwe“
  rationale: „Furcht“ bewahrt die grundlegende theologische Ausdrucksweise des hebräischen Textes sowie ihre Spannung aus Scheu, Ehrfurcht und Gehorsam.
- issue: Funktion des Infinitivs לָסוּר
  choice: 'Als Wirkung beziehungsweise Zweck formuliert: „sie hilft, … zu entgehen“'
  alternative: „um sich von den Fallen des Todes abzuwenden“
  rationale: Die Präposition לְ mit Infinitiv kann Zweck oder Wirkung ausdrücken. Die Hauptfassung stellt den natürlichen Zusammenhang her; die Fußnote bewahrt eine formal nähere Alternative.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchstil. Der Schlüsselbegriff „Furcht“ und der persönliche Gottesname „Jahwe“ bleiben erhalten; die zweite Vershälfte wird idiomatisch formuliert, während die formal nähere Konstruktion in einer Fußnote dokumentiert ist.
