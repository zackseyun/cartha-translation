  text: לֵ֣ךְ מִ֭/נֶּגֶד לְ/אִ֣ישׁ כְּסִ֑יל וּ/בַל יָ֝דַ֗עְתָּ שִׂפְתֵי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/007.yaml
  text: Go from the presence of a foolish man[a], for you do not perceive lips of knowledge.
translation:
  language: de
  text: Geh weg von einem törichten Mann, denn du wirst bei ihm keine Worte der Erkenntnis finden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „… und du hast keine Lippen der Erkenntnis erkannt.“ „Lippen“ bezeichnet hier das Gesprochene. Das hebräische Perfekt kann die allgemeine bzw. erwartete Folge ausdrücken.'
    reason: Die Anmerkung bewahrt die hebräische Bildsprache und erläutert die mögliche Aussagefunktion des Perfekts, ohne eine nicht markierte konditionale Lesart einzuführen.
lexical_decisions:
- source_word: לֵךְ מִנֶּגֶד
  choice: Geh fort aus der Gegenwart
  rationale: Der Imperativ לֵךְ fordert unmittelbar zum Weggehen auf; מִנֶּגֶד bezeichnet räumlich das Fortgehen von dem, der einem gegenüber bzw. vor Augen ist. Die Formulierung bewahrt dieses Bild in natürlichem Deutsch.
- source_word: לְאִישׁ כְּסִיל
  choice: eines törichten Mannes
  rationale: אִישׁ bezeichnet ausdrücklich einen Mann, während כְּסִיל der typische weisheitliche Ausdruck für einen moralisch und geistlich unverständigen Menschen ist. „Töricht“ gibt diesen Sinn würdig und geläufig wieder.
- source_word: וּבַל יָדַעְתָּ
  choice: bei ihm wirst du keine … finden
  rationale: בַל ist eine poetische Verneinung; das Perfekt יָדַעְתָּ kann hier als allgemeine bzw. erwartete Folge der Begegnung verstanden werden. „Finden“ gibt idiomatisch wieder, dass beim Toren keine erkenntnisvolle Rede anzutreffen ist, ohne die schwer verständliche hebräische Konstruktion mechanisch nachzubilden.
- source_word: שִׂפְתֵי דָעַת
  choice: Worte der Erkenntnis
  rationale: Wörtlich steht „Lippen der Erkenntnis“, wobei „Lippen“ metonymisch für das von ihnen Gesprochene stehen. „Worte der Erkenntnis“ bewahrt den sachlichen Gehalt und ist im Deutschen klarer als die wörtliche Wendung.
theological_decisions: []
translation_notes:
  register: Knappes, mahnendes Sprichwort in modernem, würdigem Standarddeutsch. Die ungewohnte hebräische Metonymie „Lippen“ wird im Haupttext verständlich als „Worte“ wiedergegeben; die formale und syntaktische Mehrdeutigkeit bleibt in der Fußnote sichtbar.
