  naturalness: „Geh weg von“ ist im modernen Standarddeutsch idiomatischer und knapper als „Geh fort aus der Gegenwart“. Die Stellung von „bei ihm“ unmittelbar bei „finden“ macht den Bezug klar.
  terminology: „Törichter Mann“ bewahrt die ausdrückliche Personenbezeichnung אִישׁ und den weisheitlichen Charakter von כְּסִיל. „Erkenntnis“ ist für דַּעַת angemessen.
