  text: חָכָ֣ם יָ֭רֵא וְ/סָ֣ר מֵ/רָ֑ע וּ֝/כְסִ֗יל מִתְעַבֵּ֥ר וּ/בוֹטֵֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/016.yaml
  text: A wise man fears and turns away from evil[a], but a fool is reckless and confident.
translation:
  language: de
  text: Ein Weiser fürchtet sich und meidet das Böse; doch ein Narr handelt unbesonnen[a] und fühlt sich sicher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »braust auf«. Das hebräische Verb ist an dieser Stelle schwer zu deuten; es kann zorniges Aufbrausen oder ungezügeltes, unbesonnenes Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: ein Weiser
  rationale: Das substantivierte maskuline Singularadjektiv bezeichnet hier einen einzelnen weisen Menschen; die sprichwörtliche Formulierung ist im Deutschen natürlich.
- source_word: יָרֵא
  choice: fürchtet sich
  rationale: Bewahrt die Grundbedeutung »sich fürchten«. Im Zusammenhang bezeichnet das Verb eine besonnene Furcht angesichts des Bösen, ohne ausdrücklich Gottesfurcht zu nennen.
- source_word: וְסָר מֵרָע
  choice: und meidet das Böse
  rationale: סור bedeutet »sich abwenden, fernbleiben«. »Meidet« gibt die konkrete Abkehr vom Bösen knapp und idiomatisch wieder.
- source_word: וּכְסִיל
  choice: doch ein Narr
  rationale: »Narr« ist die geläufige deutsche Wiedergabe dieses weisheitlichen Begriffs und umfasst sowohl moralische als auch verstandesmäßige Torheit.
- source_word: מִתְעַבֵּר
  choice: überschreitet alle Grenzen
  rationale: Die schwierige Hitpael-Form von עבר kann ein ungezügeltes Überschreiten von Grenzen, aber auch Aufbrausen bezeichnen. Die gewählte Wiedergabe bewahrt das anschauliche Motiv des Überschreitens und passt zum Gegensatz zwischen besonnener Abkehr und unbeherrschtem Handeln.
- source_word: וּבוֹטֵחַ
  choice: und fühlt sich sicher
  rationale: בטח bezeichnet Vertrauen, Zuversicht oder ein Sicherheitsgefühl. Da kein Objekt genannt wird und der Zusammenhang negativ ist, gibt »fühlt sich sicher« die unbegründete Sorglosigkeit wieder, ohne »Selbstvertrauen« in den Text einzutragen.
theological_decisions:
- issue: Bezug der Furcht
  choice: Kein ausdrücklicher Gottesbezug ergänzt
  alternative: »Ein Weiser hat Ehrfurcht vor Gott«
  rationale: Im hebräischen Satz steht kein Objekt zu ירא. Ein Gottesbezug wäre im weiteren Weisheitskontext möglich, wird hier aber nicht ausdrücklich gesagt und deshalb nicht ergänzt.
- issue: Bedeutung von רָע
  choice: »das Böse«
  alternative: »Unheil« oder »Gefahr«
  rationale: רַע kann moralisch Böses oder schädliches Unheil bezeichnen. Der Gegensatz zwischen Weisheit und Narrheit legt hier die moralische Bedeutung nahe, während die praktische Gefährlichkeit des Bösen mitschwingt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Parallelstruktur. »Ein Weiser« und »ein Narr« erhalten die maskulinen Singularformen des Ausgangstextes und sind hier allgemein-sprichwörtlich gebraucht.
