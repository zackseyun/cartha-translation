  text: לֵ֗ב י֭וֹדֵעַ מָרַּ֣ת נַפְשׁ֑/וֹ וּ֝/בְ/שִׂמְחָת֗/וֹ לֹא יִתְעָ֥רַב זָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/010.yaml
  text: The heart knows the bitterness of its soul[b][a], and no stranger shares in its joy.
translation:
  language: de
  text: Das Herz kennt die Bitterkeit seiner Seele[a], und kein Außenstehender hat an seiner Freude teil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „die Bitterkeit seiner Seele“. „Seele“ bezeichnet hier das innere Selbst oder Leben, ohne notwendigerweise eine bestimmte Lehre über die Beschaffenheit des Menschen vorauszusetzen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und kein Fremder mischt sich in seine Freude“ beziehungsweise „nimmt an seiner Freude teil“. Das hebräische Verb kann ausdrücken, dass jemand sich auf etwas einlässt, sich hineinmischt oder daran teilnimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: Herz
  rationale: Bewahrt das hebräische Bild für das Innere des Menschen als Sitz von Denken und Empfinden und ist im Deutschen natürlich.
- source_word: יֹדֵעַ
  choice: kennt
  rationale: Bezeichnet hier unmittelbares, persönliches Wissen um das eigene innere Erleben; „kennt“ passt idiomatisch zu „Bitterkeit“.
- source_word: מָרַת
  choice: Bitterkeit
  rationale: Bewahrt die Metapher des hebräischen Ausdrucks, ohne sie enger als Kummer oder Leid auszulegen.
- source_word: נַפְשׁוֹ
  choice: seiner Seele
  rationale: Gibt die Formulierung des Hebräischen wieder; נֶפֶשׁ meint hier das innere Selbst beziehungsweise Leben und ist nicht zwingend als anthropologischer Fachbegriff zu verstehen.
- source_word: וּבְשִׂמְחָתוֹ
  choice: an seiner Freude
  rationale: שִׂמְחָה wird knapp mit „Freude“ wiedergegeben; die Präposition ב wird zusammen mit dem Verb durch die deutsche Wendung „an ... teilhaben“ ausgedrückt.
- source_word: יִתְעָרַב
  choice: hat ... teil
  rationale: Der Hitpael kann ein Sich-Einlassen, Sich-Einmischen oder Teilnehmen bezeichnen. „teilhaben“ vermittelt im Zusammenhang verständlich die Beteiligung am inneren Erleben.
- source_word: זָר
  choice: Außenstehender
  rationale: Gemeint ist hier nicht vorrangig ein ethnisch Fremder, sondern jemand, der außerhalb des persönlichen inneren Erlebens steht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personifizierende Bildsprache des Herzens und die Spannung zwischen ungeteilter Bitterkeit und unzugänglicher Freude bleiben erhalten. „Außenstehender“ vermeidet die naheliegende ethnische Bedeutung von „Fremder“ im Haupttext.
