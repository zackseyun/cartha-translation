  variant: modern standard German
source:
  edition: WLC
  text: בְּ/כָל עֶ֭צֶב יִהְיֶ֣ה מוֹתָ֑ר וּ/דְבַר שְׂ֝פָתַ֗יִם אַךְ לְ/מַחְסֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/023.yaml
  text: In all labor there is profit[a], but mere talk leads only to lack.
translation:
  language: de
  text: Bei jeder Mühe gibt es Gewinn, doch bloßes Gerede führt nur zu Mangel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu Armut“. Das hebräische Wort kann Mangel, Bedürftigkeit oder Armut bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל
  choice: Bei jeder
  rationale: Die Verbindung בְּכָל leitet hier eine allgemeine Erfahrungsregel ein. „Bei jeder“ ist im Deutschen idiomatisch und entspricht dem distributiven Sinn.
- source_word: עֶצֶב
  choice: Mühe
  rationale: עֶצֶב bezeichnet hier mühevolle, beschwerliche Arbeit. „Mühe“ bewahrt den Aspekt der Anstrengung und passt natürlich zum Gegensatz mit bloßem Reden.
- source_word: יִהְיֶה
  choice: gibt es
  rationale: Der Imperfekt von היה formuliert in diesem Spruch eine allgemeine Wahrheit; das deutsche Präsens gibt diesen gnomischen Sinn natürlich wieder.
- source_word: מוֹתָר
  choice: Gewinn
  rationale: מוֹתָר kann einen Überschuss, Vorteil oder Gewinn bezeichnen. „Gewinn“ bildet einen klaren Gegensatz zu מַחְסוֹר, ohne den Sinn unnötig auf finanziellen Profit zu verengen.
- source_word: וּ/דְבַר שְׂפָתַיִם
  choice: doch bloßes Gerede
  rationale: Wörtlich steht „Wort der Lippen“, eine Bezeichnung für Rede. Im antithetischen Zusammenhang meint die Wendung Reden ohne entsprechendes Tun; „bloßes Gerede“ gibt dies idiomatisch wieder.
- source_word: אַךְ
  choice: nur
  rationale: 'אַךְ schränkt das Ergebnis ein und verschärft die Gegenüberstellung: Solches Reden führt ausschließlich zum negativen Ergebnis.'
- source_word: לְ/מַחְסוֹר
  choice: zu Mangel
  rationale: מַחְסוֹר umfasst Mangel, Bedürftigkeit und Armut. „Mangel“ erhält diese semantische Breite; die stärkere Möglichkeit „Armut“ wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch in sprichwörtlicher Form. Die Antithese zwischen angestrengtem Tun und folgenlosem Reden bleibt deutlich; die Aussage wird nicht auf finanziellen Erwerb allein beschränkt.
