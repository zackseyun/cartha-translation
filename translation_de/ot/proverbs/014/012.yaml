  text: יֵ֤שׁ דֶּ֣רֶךְ יָ֭שָׁר לִ/פְנֵי אִ֑ישׁ וְ֝/אַחֲרִיתָ֗/הּ דַּרְכֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/012.yaml
  text: There is a way that seems right to a man[a], but its end is the ways of death.
translation:
  language: de
  text: 'Es gibt einen Weg, der einem Menschen richtig erscheint,[a] doch sein Ende: Wege des Todes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Es gibt einen Weg, der vor einem Menschen gerade/richtig ist.“ Gemeint ist, dass er aus der eigenen Sicht richtig erscheint.'
    reason: Die Fußnote erläutert das hebräische Idiom לִפְנֵי אִישׁ und hält die Bedeutungsbreite von יָשָׁר („gerade“, im Zusammenhang „richtig“) fest.
lexical_decisions:
- source_word: יֵשׁ דֶּרֶךְ
  choice: Mancher Weg
  rationale: Die existentielle Aussage wird im Deutschen idiomatisch als allgemeiner Spruch formuliert. „Mancher Weg“ bewahrt die unbestimmte, exemplarische Aussage.
- source_word: יָשָׁר לִפְנֵי אִישׁ
  choice: erscheint einem Menschen richtig
  rationale: Wörtlich steht „richtig/gerade vor einem Menschen“. Die Wiedergabe macht die hebräische Wahrnehmungsrede natürlich verständlich, ohne zu behaupten, der Weg sei tatsächlich richtig.
- source_word: וְאַחֲרִיתָהּ
  choice: aber am Ende
  rationale: Das Waw drückt hier den sachlichen Gegensatz aus; אַחֲרִית bezeichnet das Ende beziehungsweise den Ausgang des Weges.
- source_word: דַּרְכֵי מָוֶת
  choice: führt er auf Wege des Todes
  rationale: Der Plural „Wege“ und die Wiederaufnahme der Wegmetapher bleiben erhalten. Das ergänzte „führt ... auf“ ergibt im Deutschen einen vollständigen, natürlichen Satz und beschreibt den tödlichen Ausgang.
- source_word: מָוֶת
  choice: Tod
  rationale: Die direkte Bedeutung wird bewahrt und nicht auf körperlichen Tod, Verderben oder Untergang eingeengt.
theological_decisions:
- issue: Generisches אִישׁ
  choice: einem Menschen
  alternative: einem Mann
  rationale: אִישׁ bezeichnet hier in einem allgemein geltenden Weisheitsspruch einen einzelnen Menschen. „Mensch“ gibt den generischen Bezug im modernen Deutschen natürlich wieder, ohne den Aussagebereich unnötig auf Männer zu beschränken.
- issue: Bedeutungsumfang von „Tod“
  choice: Tod
  alternative: Verderben
  rationale: Der Text nennt ausdrücklich den Tod. Die Übersetzung lässt offen, ob körperlicher Tod, umfassendes Verderben oder beides im Blick ist.
- issue: Singular „Weg“ und pluralische „Wege des Todes“
  choice: Plural bewahrt
  alternative: ein Weg zum Tod
  rationale: Der auffällige Wechsel vom Singular zum Plural gehört zur Bildsprache des hebräischen Textes und wird nicht eingeebnet.
translation_notes:
  register: Moderner, würdevoller Spruchstil. Die Formulierung ist für heutige Leser unmittelbar verständlich, bewahrt jedoch die Wegmetapher, den Kontrast und den ungewöhnlichen Plural „Wege des Todes“.
