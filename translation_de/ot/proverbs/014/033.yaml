source:
  edition: WLC
  text: בְּ/לֵ֣ב נָ֭בוֹן תָּנ֣וּחַ חָכְמָ֑ה וּ/בְ/קֶ֥רֶב כְּ֝סִילִ֗ים תִּוָּדֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/033.yaml
  text: Wisdom rests in the heart of a discerning man[a], but in the midst of fools it makes itself known.
translation:
  language: de
  text: Im Herzen eines Verständigen ruht Weisheit; doch inmitten von Narren wird sie bekannt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gibt sie sich zu erkennen“.'
    reason: Der Nifal תִּוָּדֵעַ lässt sowohl eine passive beziehungsweise inchoative Wiedergabe („wird bekannt“) als auch eine reflexive Nuance („gibt sich zu erkennen“) zu.
lexical_decisions:
- source_word: בְּלֵב
  choice: im Herzen
  rationale: לֵב bezeichnet wörtlich das Herz und umfasst im Hebräischen zugleich Denken, Wollen und das innere Wesen. „Im Herzen“ bewahrt das konkrete Bild und ist im Deutschen verständlich.
- source_word: נָבוֹן
  choice: eines Verständigen
  rationale: Das substantivisch gebrauchte maskuline Singularwort bezeichnet einen einsichtigen, urteilsfähigen Menschen. „Eines Verständigen“ gibt Form und Bedeutung knapp wieder.
- source_word: תָּנוּחַ
  choice: ruht
  rationale: Das Verb נוח bezeichnet das Ruhen oder Sichniederlassen. „Ruht“ erhält den Gegensatz zwischen der still im Verständigen wohnenden Weisheit und ihrem Bekanntwerden unter Narren.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Das Substantiv ist das Subjekt beider Satzhälften; die gewöhnliche deutsche Entsprechung ist „Weisheit“.
- source_word: וּבְקֶרֶב
  choice: doch inmitten von
  rationale: ו kann hier im Zusammenhang einen Gegensatz markieren. קֶרֶב bezeichnet die Mitte beziehungsweise das Innere; „inmitten von“ bewahrt dieses räumliche Bild.
- source_word: כְּסִילִים
  choice: Narren
  rationale: כְּסִילִים ist in der Weisheitsliteratur die übliche Bezeichnung für Menschen, denen sittliche und geistige Einsicht fehlt. „Narren“ ist dafür eine würdige und etablierte deutsche Wiedergabe.
- source_word: תִּוָּדֵעַ
  choice: wird sie bekannt
  rationale: 'Der Nifal von ידע kann passiv oder inchoativ-reflexiv verstanden werden: „wird bekannt“, „gibt sich zu erkennen“. Die gewählte Form wahrt die knappe und auffällige Aussage des Hebräischen, ohne genauer festzulegen, wie Weisheit unter Narren bekannt wird.'
theological_decisions:
- issue: Wie Weisheit unter Narren „bekannt“ wird
  choice: 'Die Aussage bleibt offen: „wird sie bekannt“.'
  alternative: '„gibt sie sich zu erkennen“ oder deutender: „macht sich bemerkbar“.'
  rationale: Der hebräische Text erläutert weder, ob Weisheit sich selbst zeigt, durch den Gegensatz zu den Narren sichtbar wird oder von ihnen öffentlich zur Schau gestellt wird. Eine deutende Auflösung würde die Spannung des Spruchs vermindern.
translation_notes:
  register: Modernes, knappes und würdiges Sprichwortdeutsch. Das Semikolon bildet den Parallelismus ab; „doch“ macht den im Zusammenhang liegenden Gegensatz deutlich. Das ungewöhnliche Bekanntwerden der Weisheit unter Narren wird nicht erklärend geglättet.
