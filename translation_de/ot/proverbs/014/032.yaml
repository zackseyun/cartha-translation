  text: בְּֽ֭/רָעָת/וֹ יִדָּחֶ֣ה רָשָׁ֑ע וְ/חֹסֶ֖ה בְ/מוֹת֣/וֹ צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/032.yaml
  text: By his evil the wicked is driven away[c][b][a], but the righteous finds refuge in his death.
translation:
  language: de
  text: Durch seine Bosheit[a] wird der Frevler weggestoßen, doch der Gerechte findet in seinem Tod[c] Zuflucht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In seinem Unheil wird der Frevler weggestoßen.“ Das hebräische Wort kann sowohl „Bosheit“ als auch „Unheil, Unglück“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nimmt Zuflucht“ beziehungsweise „sucht Zuflucht“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „in seinem Tod“; möglich sind auch „bei seinem Tod“ oder „wenn er stirbt“. Die Deutung „hat bei seinem Tod Hoffnung“ macht den Sinn ausdrücklicher, doch „Hoffnung“ steht nicht im hebräischen Text.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרָעָתוֹ
  choice: Durch seine Bosheit
  rationale: רָעָה kann sowohl moralisches Böses als auch Unheil bezeichnen. Im Gegensatz zwischen Frevler und Gerechtem liegt der moralische Sinn nahe; בְּ wird dabei instrumental als Ursache oder Mittel verstanden. Die ebenfalls mögliche Bedeutung „in seinem Unheil“ bleibt in einer Fußnote erhalten.
- source_word: יִדָּחֶה
  choice: wird … weggestoßen
  rationale: Die passive Form bezeichnet ein Wegstoßen, Vertreiben oder Zu-Fall-Bringen. „Weggestoßen“ wahrt das Passiv und legt die genaue Art des Untergangs nicht unnötig fest.
- source_word: רָשָׁע
  choice: der Frevler
  rationale: Das substantivierte Adjektiv bezeichnet hier den schuldhaft bösen Menschen als sprichwörtlichen Typus. „Frevler“ ist knapp, verständlich und bewahrt den ethischen Gegensatz zum Gerechten.
- source_word: וְחֹסֶה
  choice: findet … Zuflucht
  rationale: חסה bezeichnet das Zufluchtnehmen beziehungsweise Geborgensein. „Findet Zuflucht“ ist im Deutschen idiomatisch und lässt offen, worin oder bei wem diese Zuflucht besteht.
- source_word: בְמוֹתוֹ
  choice: in seinem Tod
  rationale: Die Wiedergabe folgt der knappen hebräischen Formulierung eng. Zeitliche Umschreibungen wie „bei seinem Tod“ oder „wenn er stirbt“ sind möglich, würden die schwierige Aussage aber stärker festlegen.
- source_word: צַדִּיק
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv bezeichnet den gerechten Menschen als sprichwörtlichen Typus und bildet den unmittelbaren Gegenpol zu „der Frevler“.
theological_decisions:
- issue: Ob der zweite Halbvers eine Zuflucht über den Tod hinaus oder Sicherheit im Augenblick des Todes aussagt
  choice: Die Formulierung „findet in seinem Tod Zuflucht“ bewahrt die offene Aussage des Hebräischen.
  alternative: „hat Hoffnung bei seinem Tod“ oder „ist sicher, wenn er stirbt“
  rationale: Im Hebräischen steht weder ausdrücklich „Hoffnung“ noch eine nähere Bestimmung der Zuflucht. Deshalb wird weder eine bestimmte Jenseitsaussage eingefügt noch die Aussage auf den Sterbevorgang beschränkt.
translation_notes:
  register: Moderne, würdige Standardsprache mit sprichwörtlicher Kürze. Die ungewöhnliche Wendung „in seinem Tod“ bleibt bewusst stehen, um die Mehrdeutigkeit und theologische Spannung des Ausgangstextes nicht aufzulösen.
