id: PRO.14.30
reference: Proverbs 14:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חַיֵּ֣י בְ֭שָׂרִים לֵ֣ב מַרְפֵּ֑א וּ/רְקַ֖ב עֲצָמ֣וֹת קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/030.yaml
  text: A tranquil heart is life to the body[b][a], but jealousy is rottenness to the bones.
translation:
  language: de
  text: Ein gelassenes Herz ist Leben für den Körper[a], doch Neid lässt die Knochen verfaulen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Ein heilsames Herz ist Leben für den Leib.“ Das hebräische Wort bezeichnet Heilung, Gesundheit oder heilsame Wirkung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Eifersucht“. Das hebräische Wort kann je nach Zusammenhang Neid, Eifersucht oder Eifer bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֵּי
  choice: Leben
  rationale: Der Konstruktplural von חַיִּים bezeichnet idiomatisch „Leben“. Im verblosen Spruch wird er natürlich als Prädikatsnomen wiedergegeben.
- source_word: בְשָׂרִים
  choice: Körper
  rationale: Wörtlich steht „Fleisch“ im Plural; im weisheitlichen Zusammenhang ist der leibliche Organismus gemeint. „Körper“ vermeidet sachfremde theologische Assoziationen.
- source_word: לֵב
  choice: Herz
  rationale: Bewahrt das hebräische Bild für die innere Haltung und das emotionale Zentrum des Menschen.
- source_word: מַרְפֵּא
  choice: gelassenes
  rationale: Das Substantiv bezeichnet Heilung, Gesundheit oder heilsame Wirkung. „Gelassenes Herz“ gibt hier den gesunden, ruhigen inneren Zustand natürlich wieder; die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: וּרְקַב
  choice: doch … lässt … verfaulen
  rationale: Die Konjunktion markiert im Parallelismus einen Gegensatz. Die dynamische Verbformulierung bewahrt das kräftige Bild von Fäulnis und Verfall in natürlichem Deutsch.
- source_word: עֲצָמוֹת
  choice: die Knochen
  rationale: Die konkrete Metapher für das tiefste körperliche Gerüst und die Lebenskraft bleibt erhalten.
- source_word: קִנְאָה
  choice: Neid
  rationale: Das Wort kann Eifer, Eifersucht oder Neid bezeichnen. Der negative Gegensatz und die Vorstellung innerlich zersetzenden Vergleichens sprechen hier für „Neid“; „Eifersucht“ bleibt als mögliche Alternative vermerkt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Der antithetische Parallelismus und das körperliche Bild der Knochen bleiben deutlich; die ungewöhnliche hebräische Formulierung wird moderat idiomatisiert.
