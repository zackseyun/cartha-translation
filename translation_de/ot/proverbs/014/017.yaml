  text: קְֽצַר אַ֭פַּיִם יַעֲשֶׂ֣ה אִוֶּ֑לֶת וְ/אִ֥ישׁ מְ֝זִמּ֗וֹת יִשָּׂנֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/017.yaml
  text: A short-tempered man acts foolishly[b][a], and a man of schemes is hated.
translation:
  language: de
  text: Ein Jähzorniger handelt töricht, und ein Mann mit Ränken[a] wird gehasst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Mann mit Plänen«; das hebräische Wort kann auch »Pläne« oder »Absichten« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצַר אַפַּיִם
  choice: jähzorniger Mensch
  rationale: Die hebräische Wendung bedeutet wörtlich »kurz an Zorn/Nasen« und bezeichnet jemanden, der schnell zornig wird. »Jähzornig« gibt dieses Temperament natürlich und prägnant wieder; »Mensch« trägt hier die allgemeine Aussage des typisierenden Ausdrucks.
- source_word: יַעֲשֶׂה אִוֶּלֶת
  choice: handelt töricht
  rationale: Das Verb bedeutet »tun/machen«, das Substantiv »Torheit«. Die idiomatische deutsche Verbindung »handelt töricht« bewahrt den Sinn, ohne das hebräische Substantiv unnatürlich nachzubilden.
- source_word: אִישׁ מְזִמּוֹת
  choice: ein Mann voller Ränke
  rationale: אִישׁ ist grammatisch maskulin und bezeichnet hier einen charakteristischen Typ. מְזִמּוֹת kann Pläne oder Absichten meinen, besitzt in diesem Zusammenhang aber wahrscheinlich einen negativen Beiklang. »Ränke« bewahrt diesen pejorativen Sinn, ohne ausdrücklich »böse« hinzuzufügen.
- source_word: יִשָּׂנֵא
  choice: wird gehasst
  rationale: Die Niphal-Form ist passiv. Das deutsche Präsens gibt den allgemeingültigen Charakter des Spruchs wieder.
theological_decisions: []
