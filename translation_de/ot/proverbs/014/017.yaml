  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Die parallelen Personenbezeichnungen bleiben erhalten; die mögliche Spannweite von מְזִמּוֹת wird in einer Fußnote offengehalten.
