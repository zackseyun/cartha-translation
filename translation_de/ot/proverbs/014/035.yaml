  text: רְֽצוֹן מֶ֭לֶךְ לְ/עֶ֣בֶד מַשְׂכִּ֑יל וְ֝/עֶבְרָת֗/וֹ תִּהְיֶ֥ה מֵבִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/035.yaml
  text: A king’s favor is toward a servant who acts wisely[b][a], but his wrath is against one who brings shame.
translation:
  language: de
  text: Ein König hat Gefallen an einem Diener, der klug handelt,[a] doch sein Zorn gilt einem, der Schande verursacht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einem verständigen Diener“ oder „an einem Diener, der erfolgreich handelt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder mit Zukunftsbezug: „Doch sein Zorn wird einem gelten, der Schande verursacht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: hat Gefallen an
  rationale: רָצוֹן bezeichnet hier die wohlwollende, zustimmende Haltung des Königs. Die verbale deutsche Wendung ist natürlich und bewahrt den höfischen Zusammenhang.
- source_word: מֶלֶךְ
  choice: ein König
  rationale: Direkte Wiedergabe des gewöhnlichen Substantivs für einen männlichen Herrscher; der unbestimmte Artikel entspricht dem allgemeinen Spruchcharakter.
- source_word: לְעֶבֶד
  choice: an einem Diener
  rationale: לְ bezeichnet die Person, der das königliche Wohlgefallen gilt. „Diener“ passt zum Kontext des königlichen Dienstes, ohne eine im Spruch nicht hervorgehobene rechtliche Statusfrage in den Vordergrund zu rücken.
- source_word: מַשְׂכִּיל
  choice: der klug handelt
  rationale: Das Hifil-Partizip von שׂכל kann einsichtiges, umsichtiges oder erfolgreiches Handeln bezeichnen. „Klug handelt“ erhält den verbalen und praktisch-weisheitlichen Sinn.
- source_word: וְעֶבְרָתוֹ
  choice: doch sein Zorn
  rationale: עֶבְרָה bezeichnet heftigen Zorn. „Zorn“ bewahrt die Stärke, während „doch“ den parallelen Gegensatz idiomatisch ausdrückt.
- source_word: תִּהְיֶה
  choice: trifft
  rationale: Wörtlich steht „wird/ist“, wobei die Beziehung zum folgenden Partizip nur durch die Präposition מִן angedeutet wird. „Trifft“ macht diese im Deutschen notwendige Beziehung verständlich, ohne den Sinn sachlich zu verengen.
- source_word: מֵבִישׁ
  choice: einen, der Schande bringt
  rationale: 'Das Hifil-Partizip von בוש wird kausativ verstanden: jemand verursacht Schande oder Beschämung. Die Formulierung bewahrt diesen aktiven Sinn.'
