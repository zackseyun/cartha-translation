  verdict: revise
  source_fidelity: Die erste Klausel gibt die gnomenhafte Aussage zutreffend im Präsens wieder. »Sie ist nicht zu finden« verschiebt das hebräische existentiale וָאַיִן jedoch zu einer Aussage über die generelle Auffindbarkeit der Weisheit. »Es gibt keine« bildet die knappe, bewusst nicht weiter erklärte Ellipse genauer ab. Die zweite Klausel kann ohne die zusätzliche Erwerbsnuance von »zu erlangen« unmittelbarer wiedergegeben werden.
  naturalness: Die revidierte Fassung ist knappes, modernes und würdiges Spruchdeutsch. »Es gibt keine« ist in diesem Parallelismus idiomatisch und lässt den Bezug auf die gesuchte Weisheit klar erkennen.
  terminology: »Spötter«, »Weisheit«, »Erkenntnis« und »Verständiger« sind für den Weisheitskontext treffend. »Verständiger« bewahrt die maskuline Singularform, ohne die sprichwörtlich allgemeine Aussage unnötig einzuengen.
