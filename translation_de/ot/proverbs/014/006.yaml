  - severity: low
    issue: »leicht zu erlangen« fügt einen Erwerbsaspekt hinzu.
    rationale: נָקָל besagt zunächst »leicht/einfach«. »Erkenntnis ist ... leicht« ist unmittelbarer und erhält die knappe Form des Spruchs.
  revised_text: Ein Spötter sucht Weisheit, doch es gibt keine[a]; Erkenntnis dagegen ist für einen Verständigen leicht.
