source:
  edition: WLC
  text: בִּקֶּשׁ לֵ֣ץ חָכְמָ֣ה וָ/אָ֑יִן וְ/דַ֖עַת לְ/נָב֣וֹן נָקָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/006.yaml
  text: A scoffer seeks wisdom and there is none[b][a], but knowledge comes easily to one who has understanding.
translation:
  language: de
  text: Ein Spötter sucht Weisheit, doch es gibt keine[a]; Erkenntnis dagegen ist für einen Verständigen leicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und da ist keine«; auch möglich: »doch er findet keine«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקֶּשׁ
  choice: sucht
  rationale: Das hebräische Perfekt formuliert im Spruchstil eine allgemeine Wahrheit; das deutsche Präsens gibt diesen gnomischen Gebrauch natürlich wieder.
- source_word: לֵץ
  choice: Spötter
  rationale: Das Wort bezeichnet einen Menschen, dessen Haltung von überheblichem Spott und der Ablehnung von Weisheit und Zurechtweisung geprägt ist.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist die sachlich und traditionssprachlich passende Wiedergabe des zentralen Weisheitsbegriffs im Sprüchebuch.
- source_word: וָאָיִן
  choice: doch sie ist nicht zu finden
  rationale: Die existenzielle Aussage »und da ist keine« wird im Deutschen idiomatisch auf die gesuchte Weisheit bezogen, ohne ausdrücklich zu behaupten, der Spötter habe sie lediglich nicht gefunden.
- source_word: וְדַעַת
  choice: Erkenntnis
  rationale: »Erkenntnis« bezeichnet hier gewonnenes Wissen und einsichtsvolles Erkennen und passt zur Weisheitsterminologie des Buches.
- source_word: לְנָבוֹן
  choice: für einen Verständigen
  rationale: Das substantivierte maskuline Singularwort bezeichnet sprichwörtlich einen durch Einsicht und Urteilsvermögen gekennzeichneten Menschen; die deutsche Form bewahrt Numerus und grammatische Gestalt.
- source_word: נָקָל
  choice: ist leicht zu erlangen
  rationale: Die Wendung bringt die Leichtigkeit beziehungsweise Zugänglichkeit der Erkenntnis idiomatisch zum Ausdruck und bildet einen klaren Gegensatz zur erfolglosen Suche des Spötters.
theological_decisions:
- issue: Repräsentatives Maskulinum in der Weisheitsliteratur
  choice: für einen Verständigen
  alternative: für einen verständigen Menschen / für Verständige
  rationale: Die grammatisch maskuline Singularform wird im Haupttext bewahrt, während ihre sprichwörtlich allgemeine Reichweite nicht auf Männer beschränkt wird.
- issue: Grund des Scheiterns bei der Weisheitssuche
  choice: doch sie ist nicht zu finden
  alternative: doch er findet sie nicht
  rationale: Der hebräische Text sagt wörtlich existenziell »und da ist keine« und benennt nicht ausdrücklich, ob das Scheitern allein in der Person des Spötters oder in der Unerreichbarkeit der Weisheit für ihn liegt; die Übersetzung hält diese Spannung möglichst offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, parallel gebauter Spruchform. »Spötter«, »Weisheit« und »Erkenntnis« erhalten die prägnante Weisheitssprache; der adversative Zusammenhang wird durch »doch« und »dagegen« verdeutlicht.
