base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/004.yaml
  text: Where there are no oxen[a], the manger is clean[b], but abundant crops come by the strength of an ox.
translation:
  language: de
  text: Wo keine Rinder sind, ist der Futtertrog[a] sauber[b]; doch reicher Ertrag[c] kommt durch die Kraft eines Ochsen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Krippe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: leer.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: reiche Ernten; auch: viel Erzeugnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: Wo keine … sind
  rationale: Die Verbindung aus בְּ und אֵין bezeichnet einen Umstand beziehungsweise eine Bedingung. Die gewählte Formulierung gibt dies im Deutschen natürlich wieder.
- source_word: אֲלָפִים
  choice: Rinder
  rationale: Der Plural kann Rindvieh allgemein bezeichnen. „Rinder“ passt zum landwirtschaftlichen Bild und lässt zugleich den Wechsel zum einzelnen, als Arbeitstier gedachten Ochsen in der zweiten Vershälfte erkennen.
- source_word: אֵבוּס
  choice: Futtertrog
  rationale: Das Substantiv bezeichnet den Futterplatz beziehungsweise Trog eines Tieres. „Futtertrog“ ist im heutigen Deutsch eindeutig und konkret.
- source_word: בָּר
  choice: sauber
  rationale: Das Adjektiv bedeutet hier „rein/sauber“ und beschreibt den Trog ohne die Verunreinigung, die mit der Haltung von Rindern einhergeht. Kontextuell ist auch die Vorstellung eines leeren Trogs möglich.
- source_word: וְרָב
  choice: doch reicher
  rationale: וְ verbindet hier zwei gegensätzliche Beobachtungen; „doch“ macht diesen Kontrast natürlich sichtbar. רָב wird idiomatisch mit „reich“ wiedergegeben.
- source_word: תְּבוּאוֹת
  choice: Ertrag
  rationale: Das Wort bezeichnet landwirtschaftlichen Ertrag, Ernte oder Erzeugnisse. Der deutsche Kollektivsingular „Ertrag“ ist prägnant und entspricht dem sprichwörtlichen Charakter.
- source_word: בְּכֹחַ
  choice: durch die Kraft
  rationale: Die Präposition בְּ bezeichnet hier das Mittel beziehungsweise die Ursache. „Durch die Kraft“ bewahrt diesen instrumentalen Sinn.
- source_word: שׁוֹר
  choice: eines Ochsen
  rationale: Der Singular ist generisch gebraucht. „Ochse“ bezeichnet passend das für die Feldarbeit eingesetzte Rind; der unbestimmte Ausdruck gibt den allgemeinen Charakter der Aussage wieder.
