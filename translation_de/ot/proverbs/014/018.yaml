  text: נָחֲל֣וּ פְתָאיִ֣ם אִוֶּ֑לֶת וַֽ֝/עֲרוּמִ֗ים יַכְתִּ֥רוּ דָֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/018.yaml
  text: The simple inherit folly[a], but the prudent are crowned with knowledge.
translation:
  language: de
  text: Die Unerfahrenen erben Torheit, doch die Besonnenen krönen sich mit Erkenntnis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doch die Besonnenen sind mit Erkenntnis gekrönt.“ Das hebräische Verb kann aktiv („sich krönen“) oder als Beschreibung des Zustands verstanden werden, mit Erkenntnis geschmückt beziehungsweise gekrönt zu sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחֲלוּ
  choice: erben
  rationale: Das Qal-Perfekt von נחל bezeichnet das Empfangen eines Erbteils beziehungsweise den Besitzantritt. „Erben“ bewahrt das prägnante Bild, nach dem Torheit zum Besitz der Unerfahrenen wird.
- source_word: פְתָאיִם
  choice: die Unerfahrenen
  rationale: פתי bezeichnet im Buch der Sprüche Menschen, die noch unerfahren, offen für Einflüsse und daher leicht verführbar sind. „Die Unerfahrenen“ vermeidet die im heutigen Deutsch oft abwertende oder intellektuell verengte Wirkung von „die Einfältigen“.
- source_word: אִוֶּלֶת
  choice: Torheit
  rationale: „Torheit“ ist ein passender deutscher Weisheitsbegriff für moralische und praktische Unvernunft und erhält den gehobenen, knappen Stil des Spruchs.
- source_word: עֲרוּמִים
  choice: die Besonnenen
  rationale: עָרוּם kann je nach Zusammenhang Klugheit oder Verschlagenheit bezeichnen. Im positiven Gegensatz zu den Unerfahrenen meint es hier umsichtiges, urteilsfähiges Handeln; „die Besonnenen“ gibt diesen Sinn ohne negative Nebenbedeutung wieder.
- source_word: יַכְתִּרוּ
  choice: krönen sich mit
  rationale: Das Hiphil von כתר kann „umgeben“ oder „krönen“ bedeuten. Die aktive Formulierung „krönen sich mit Erkenntnis“ bildet die hebräische Verbform und das schmückende Kronenbild knapp ab; die mögliche resultative beziehungsweise passive Auffassung wird in der Fußnote bewahrt.
- source_word: דָעַת
  choice: Erkenntnis
  rationale: דַּעַת ist ein zentraler Begriff der Weisheitsliteratur und bezeichnet Wissen, das mit Einsicht und Urteilsvermögen verbunden ist. „Erkenntnis“ trägt diesen weiteren Sinn im Deutschen besser als bloßes Faktenwissen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Parallelstruktur. Die traditionellen Weisheitsbegriffe „Torheit“ und „Erkenntnis“ bleiben erhalten; potenziell missverständliches „Einfältige“ wird durch „Unerfahrene“ ersetzt.
