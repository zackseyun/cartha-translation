revisions:
- from: Wer seinen Mitmenschen verachtet, sündigt; doch glücklich zu preisen ist, wer sich der Armen erbarmt.[a]
  to: Wer seinen Nächsten verachtet, sündigt; wohl dem, der den Armen Gunst erweist.
  rationale: Die Revision bewahrt die antithetische Struktur und alle wesentlichen Lexeme des Hebräischen. „Nächsten“ gibt den sozialen Bezug von רֵעֵהוּ angemessen wieder. Der Wechsel von „sich erbarmt“ zu „Gunst erweist“ vermeidet eine nicht erforderliche Einengung von חנן auf Erbarmen. „Wohl dem“ entspricht der knappen, formelhaften Aussage von אַשְׁרָיו besser als die periphrastische Wendung „glücklich zu preisen ist“.
