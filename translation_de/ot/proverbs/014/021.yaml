  terminology: „Sündigt“ bewahrt die explizite ethisch-theologische Aussage von חוֹטֵא. „Gunst erweist“ gibt חנן genauer wieder als „sich erbarmt“. „Wohl dem“ gibt אַשְׁרָיו als Segens-/Wohlergehensformel wieder, ohne eine bestimmte theologische Lehre einzutragen.
