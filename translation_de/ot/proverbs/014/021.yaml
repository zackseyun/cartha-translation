  text: בָּז לְ/רֵעֵ֥/הוּ חוֹטֵ֑א וּ/מְחוֹנֵ֖ן עניים אַשְׁרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/021.yaml
  text: Whoever despises his neighbor sins[a], but blessed is he who is gracious to the poor.
translation:
  language: de
  text: Wer seinen Nächsten verachtet, sündigt; wohl dem, der den Armen Gunst erweist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּז
  choice: verachtet
  rationale: Das Partizip bezeichnet eine Haltung beziehungsweise Behandlung voller Geringschätzung. „Verachtet“ ist knapp, natürlich und bewahrt die moralische Schärfe.
- source_word: לְרֵעֵהוּ
  choice: seinen Mitmenschen
  rationale: רֵעַ meint hier einen anderen Menschen aus dem sozialen Umfeld. „Mitmensch“ gibt den repräsentativen Sinn im modernen Deutschen natürlicher wieder als das räumlich enger verstandene „Nachbar“.
- source_word: חוֹטֵא
  choice: sündigt
  rationale: Das prädikative Partizip kennzeichnet das Verachten ausdrücklich als Sünde; „sündigt“ erhält diese moralisch-theologische Aussage.
- source_word: וּמְחוֹנֵן
  choice: sich … erbarmt
  rationale: חנן bezeichnet hier das gnädige, wohltätige Zuwenden zu Bedürftigen. „Sich erbarmen“ ist im Deutschen idiomatisch und bringt die konkrete barmherzige Zuwendung zum Ausdruck, ohne den Satz unnötig zu erklären.
- source_word: עניים
  choice: der Armen
  rationale: Das Wort kann Arme, Bedürftige oder Bedrängte bezeichnen. Im ethischen Gegensatz dieses Spruchs steht soziale Bedürftigkeit im Vordergrund; „die Armen“ ist daher die unmittelbarste Wiedergabe.
- source_word: אַשְׁרָיו
  choice: glücklich zu preisen ist
  rationale: Die Weisheitsformel bezeichnet einen objektiv guten, gesegneten Zustand und nicht bloß ein Gefühl. „Glücklich zu preisen“ bewahrt diese Bedeutung in natürlichem, würdigem Deutsch.
theological_decisions:
- issue: Wiedergabe der Weisheitsformel אַשְׁרָיו
  choice: glücklich zu preisen ist
  alternative: gesegnet ist
  rationale: „Glücklich zu preisen“ drückt Wohlergehen und Begünstigung aus, ohne den Ausdruck auf subjektive Fröhlichkeit zu reduzieren oder eine im Hebräischen nicht ausdrücklich genannte Segenshandlung einzutragen.
- issue: Bedeutungsnuance von חנן gegenüber den Armen
  choice: sich der Armen erbarmt
  alternative: den Armen Gunst erweist
  rationale: Die Form bezeichnet gnädige Zuwendung, die im Kontext praktisch-wohltätig ist. „Sich erbarmen“ ist idiomatisch, darf aber nicht als bloßes Gefühl verstanden werden; die Fußnote hält die Handlungsdimension fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der antithetische Aufbau bleibt erhalten. „Mitmensch“ vermeidet eine unnötige räumliche Verengung von רֵעַ; „glücklich zu preisen“ bewahrt den weisheitlichen Ton.
