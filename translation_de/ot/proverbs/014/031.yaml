source:
  edition: WLC
  text: עֹ֣שֵֽׁק דָּ֭ל חֵרֵ֣ף עֹשֵׂ֑/הוּ וּ֝/מְכַבְּד֗/וֹ חֹנֵ֥ן אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/031.yaml
  text: Whoever oppresses the poor insults his Maker[a], but whoever is gracious to the needy honors him.
translation:
  language: de
  text: Wer einen Armen unterdrückt, verhöhnt dessen Schöpfer; wer aber einem Bedürftigen Gnade erweist, ehrt ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer aber den Armen ehrt, erweist dem Bedürftigen Gnade.“ Das hebräische Pronomen in „ehrt ihn“ kann sich entweder auf den Armen oder auf dessen Schöpfer beziehen. Der Haupttext bezieht es wegen des Parallelismus auf Gott.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֵׁק
  choice: Wer … unterdrückt
  rationale: Das substantivisch gebrauchte Qal-Partizip erhält als unbestimmter Relativsatz die natürliche Aussageform eines deutschen Sprichworts; „unterdrückt“ bezeichnet ungerechten Druck und Ausbeutung.
- source_word: דָּל
  choice: einen Armen
  rationale: דָּל kann einen armen, schwachen oder gesellschaftlich machtlosen Menschen bezeichnen. „einen Armen“ ist hier klar und idiomatisch und lässt dessen Verletzlichkeit erkennen.
- source_word: חֵרֵף
  choice: verhöhnt
  rationale: Das Verb bezeichnet Schmähung und verächtliche Behandlung. „verhöhnt“ gibt den schweren Affront gegen Gott prägnanter wieder als das schwächere „beleidigt“.
- source_word: עֹשֵׂהוּ
  choice: dessen Schöpfer
  rationale: Das Suffix bezieht sich am natürlichsten auf den Armen. „dessen“ macht diesen Bezug im Deutschen eindeutig; „Schöpfer“ ist gegenwärtig und würdevoll.
- source_word: וּמְכַבְּדוֹ
  choice: ehrt ihn
  rationale: Das Suffix kann sich grammatisch auf den Armen oder auf dessen Schöpfer beziehen. Im Haupttext bezeichnet „ihn“ aufgrund des antithetischen Parallelismus den Schöpfer, ohne die alternative Deutung zu verschweigen.
- source_word: חֹנֵן
  choice: Gnade erweist
  rationale: Das Partizip bezeichnet das Gewähren von Gunst oder gnädiger Zuwendung. „Gnade erweist“ wahrt diesen Bedeutungsgehalt besser als das allgemeinere „freundlich ist“.
- source_word: אֶבְיוֹן
  choice: einem Bedürftigen
  rationale: אֶבְיוֹן hebt Bedürftigkeit und Mittellosigkeit hervor. „Bedürftigen“ unterscheidet den Ausdruck von דָּל im ersten Halbvers.
theological_decisions:
- issue: Bezugswort des Suffixes in וּמְכַבְּדוֹ
  choice: 'Das Pronomen bezieht sich im Haupttext auf den Schöpfer: Wer dem Bedürftigen Gnade erweist, ehrt Gott.'
  alternative: 'Das Pronomen bezieht sich auf den Armen: „Wer aber den Armen ehrt, erweist dem Bedürftigen Gnade.“'
  rationale: 'Der antithetische Parallelismus legt den Bezug auf den Schöpfer nahe: Die Unterdrückung des Armen verhöhnt ihn, gnädige Zuwendung zum Bedürftigen ehrt ihn. Da das Hebräische auch den Bezug auf den Armen zulässt, wird diese Spannung in einer Fußnote bewahrt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prägnanter sprichwörtlicher Struktur. „Armer“ und „Bedürftiger“ bewahren die lexikalische Unterscheidung des Hebräischen; die echte Mehrdeutigkeit des Pronomens wird durch die Fußnote offengehalten.
