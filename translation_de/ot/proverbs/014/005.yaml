source:
  edition: WLC
  text: עֵ֣ד אֱ֭מוּנִים לֹ֣א יְכַזֵּ֑ב וְ/יָפִ֥יחַ כְּ֝זָבִ֗ים עֵ֣ד שָֽׁקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/005.yaml
  text: A faithful witness does not lie[a], but a false witness breathes out lies.
translation:
  language: de
  text: Ein verlässlicher Zeuge lügt nicht, doch ein falscher Zeuge stößt Lügen aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »spricht Lügen aus«. Das hebräische Verb stellt falsche Aussagen als etwas dar, das ausgeatmet oder hervorgestoßen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד
  choice: Zeuge
  rationale: Das Substantiv bezeichnet jemanden, der Zeugnis ablegt. »Zeuge« ist im Deutschen der natürliche rechtliche und moralische Ausdruck und passt in beide Vershälften.
- source_word: אֱמוּנִים
  choice: verlässlich
  rationale: Die Form beschreibt die Zuverlässigkeit oder Treue des Zeugen. »Verlässlich« gibt in diesem Zusammenhang klar wieder, dass seinem Zeugnis zu trauen ist.
- source_word: לֹא יְכַזֵּב
  choice: lügt nicht
  rationale: Das Piel von כזב bezeichnet hier im Zusammenhang einer Zeugenaussage falsches Reden. »Lügt nicht« ist knapp, eindeutig und idiomatisch.
- source_word: וְיָפִיחַ
  choice: doch … stößt … aus
  rationale: Das וְ wird wegen des Gegensatzes zwischen den beiden Vershälften mit »doch« wiedergegeben. Das Hiphil von פוח zeichnet falsche Aussagen als etwas, das ausgeatmet oder hervorgestoßen wird; »stößt … aus« bewahrt dieses Bild in natürlichem Deutsch.
- source_word: כְּזָבִים
  choice: Lügen
  rationale: Der Plural entspricht dem Hebräischen und legt wiederholte falsche Aussagen nahe.
- source_word: עֵד שָׁקֶר
  choice: ein falscher Zeuge
  rationale: Die Verbindung ist die übliche Bezeichnung für einen Zeugen, dessen Aussage falsch ist. »Falscher Zeuge« ist idiomatisch und wahrt die biblische Begriffstradition.
theological_decisions: []
