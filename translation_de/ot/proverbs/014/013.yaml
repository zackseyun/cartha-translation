  text: Even in laughter the heart may ache[b][a], and the end of joy is grief.
translation:
  language: de
  text: Selbst beim Lachen kann das Herz schmerzen[a], und das Ende der Freude ist Kummer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Selbst beim Lachen schmerzt das Herz.“ Das hebräische Imperfekt kann in einem Sprichwort auch eine allgemeine Gegenwart ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und der Ausgang der Freude ist Kummer“ beziehungsweise „und nach der Freude kommt Kummer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Selbst
  rationale: 'גַּם hat hier eine steigernd-konzessive Funktion: Sogar beziehungsweise selbst beim Lachen kann innerer Schmerz bestehen.'
- source_word: בִּשְׂחוֹק
  choice: beim Lachen
  rationale: Die Verbindung aus ב und שְׂחוֹק bezeichnet den Zustand oder Vorgang des Lachens; „beim Lachen“ ist im modernen Deutschen natürlich und bewahrt das konkrete Bild.
- source_word: יִכְאַב
  choice: kann … schmerzen
  rationale: Das Imperfekt lässt sich in der sprichwörtlichen Aussage als allgemeine Gegenwart oder als Möglichkeit verstehen. „Kann schmerzen“ bewahrt diese Offenheit, ohne eine ausnahmslose Behauptung zu erzwingen.
- source_word: לֵב
  choice: das Herz
  rationale: „Herz“ bewahrt die vertraute Metapher für das innere Erleben und ist im Deutschen klar verständlich.
- source_word: וְאַחֲרִיתָהּ
  choice: und das Ende der
  rationale: אַחֲרִית bezeichnet Ende, Ausgang oder Ergebnis; das feminine Suffix bezieht sich auf die Freude. „Das Ende der“ erhält das Bild eines abschließenden Ausgangs.
- source_word: שִׂמְחָה
  choice: Freude
  rationale: „Freude“ ist die natürliche moderne Entsprechung und bildet einen klaren Gegensatz zu Kummer.
- source_word: תוּגָה
  choice: Kummer
  rationale: תוּגָה bezeichnet Betrübnis, Trauer oder Kummer. „Kummer“ ist verständlich, würdevoll und gibt den Gegensatz zur Freude prägnant wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Die Parallelität und die Spannung zwischen äußerem Lachen, innerem Schmerz und dem möglichen Ausgang der Freude bleiben erhalten.
