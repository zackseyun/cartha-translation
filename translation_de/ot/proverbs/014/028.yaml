  text: בְּ/רָב עָ֥ם הַדְרַת מֶ֑לֶךְ וּ/בְ/אֶ֥פֶס לְ֝אֹ֗ם מְחִתַּ֥ת רָזֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/028.yaml
  text: In a multitude of people is a king’s splendor[a], but without people, a ruler’s ruin.
translation:
  language: de
  text: Ein zahlreiches Volk ist der Glanz eines Königs, doch ohne Volk kommt ein Herrscher zu Fall.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doch ohne Volk gerät ein Herrscher in Schrecken“ beziehungsweise „… droht einem Herrscher der Untergang“. Das hebräische Wort kann Schrecken oder einen vernichtenden Zusammenbruch bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָב עָם
  choice: Ein zahlreiches Volk
  rationale: Die Wendung bezeichnet eine große Zahl von Menschen. Die attributive deutsche Form ist natürlich und bewahrt den politischen Bezug auf die Bevölkerung.
- source_word: הַדְרַת מֶלֶךְ
  choice: ist der Glanz eines Königs
  rationale: הֲדָר bezeichnet Glanz, Pracht oder Majestät; „Glanz“ gibt die sichtbare Größe und Ehre des Königs knapp wieder. Die Constructusverbindung wird mit „eines Königs“ ausgedrückt.
- source_word: וּבְאֶפֶס לְאֹם
  choice: doch ohne Volk
  rationale: אֶפֶס bezeichnet hier das Fehlen, und לְאֹם eine Volksgemeinschaft. „Ohne Volk“ bildet einen klaren Gegensatz zum zahlreichen Volk, ohne einen modernen Nationalstaat vorauszusetzen.
- source_word: מְחִתַּת רָזוֹן
  choice: kommt ein Herrscher zu Fall
  rationale: רָזוֹן bezeichnet einen Machthaber oder Herrscher. מְחִתָּה kann Schrecken, Bestürzung oder einen vernichtenden Zusammenbruch bezeichnen; die idiomatische Wendung „kommt … zu Fall“ gibt im Kontext die politische Katastrophe wieder.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Standarddeutsch mit antithetischem Parallelismus. „Volk“ wird in beiden Vershälften beibehalten, um den sachlichen Gegensatz deutlich zu machen; „kommt zu Fall“ klingt natürlicher als das substantivische „Untergang eines Herrschers“.
