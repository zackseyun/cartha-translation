  text: חַכְמ֣וֹת נָ֭שִׁים בָּנְתָ֣ה בֵיתָ֑/הּ וְ֝/אִוֶּ֗לֶת בְּ/יָדֶ֥י/הָ תֶהֶרְסֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/001.yaml
  text: The wisest of women builds her house[b][a], but a foolish woman tears it down with her own hands.
translation:
  language: de
  text: Die weiseste unter den Frauen[a] baut ihr Haus[b], doch eine törichte Frau reißt es mit ihren eigenen Händen nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jede weise Frau baut ihr Haus.“ Der hebräische Versanfang kann statt als Steigerung auch als allgemeine Aussage über weise Frauen verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: „Haus“ kann hier neben dem Gebäude auch den Haushalt, die Familie oder den Hausstand bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְמוֹת נָשִׁים
  choice: die weiseste unter den Frauen
  rationale: Die pluralische Form חַכְמוֹת in Verbindung mit נָשִׁים kann als idiomatische Steigerung verstanden werden. Diese Wiedergabe passt zum femininen Singularverb בָּנְתָה und zum singularischen Gegenbild im zweiten Halbvers. Die mögliche generische Deutung wird in Fußnote [a] bewahrt.
- source_word: בָּנְתָה
  choice: baut
  rationale: Obwohl die Form morphologisch Perfekt ist, drückt sie hier eine sprichwörtliche, allgemein gültige Aussage aus; dafür ist im Deutschen das Präsens natürlich.
- source_word: בֵיתָהּ
  choice: ihr Haus
  rationale: „Haus“ erhält das konkrete Bild und kann zugleich Haushalt, Familie oder Hausstand umfassen. Diese Bedeutungsbreite wird in Fußnote [b] kenntlich gemacht.
- source_word: אִוֶּלֶת
  choice: eine törichte Frau
  rationale: Das feminine Singularverb und der Gegensatz zum ersten Halbvers sprechen für eine personale Wiedergabe statt des Abstraktums „Torheit“.
- source_word: בְּיָדֶיהָ
  choice: mit eigenen Händen
  rationale: Die instrumentale Wendung hebt die persönliche Verantwortung der Frau hervor. „Mit eigenen Händen“ ist im Deutschen idiomatisch und bewahrt diese Betonung.
- source_word: תֶהֶרְסֶנּוּ
  choice: reißt es nieder
  rationale: הרס bezeichnet das Einreißen oder Zerstören. „Niederreißen“ bildet einen anschaulichen Gegenpol zu „bauen“; das Pronomen bezieht sich auf das Haus.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Parallelstruktur. Das konkrete Bild von Bauen und Niederreißen bleibt erhalten. Die Fußnotenmarker stehen entsprechend ihrer sachlichen Anknüpfung direkt nach „Haus“; [a] erläutert jedoch den Versanfang.
