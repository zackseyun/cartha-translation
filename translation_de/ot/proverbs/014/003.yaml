source:
  edition: WLC
  text: בְּֽ/פִי אֱ֭וִיל חֹ֣טֶר גַּאֲוָ֑ה וְ/שִׂפְתֵ֥י חֲ֝כָמִ֗ים תִּשְׁמוּרֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/003.yaml
  text: In the mouth of a fool is a rod of pride[b][a], but the lips of the wise will guard them.
translation:
  language: de
  text: Im Mund eines Narren ist eine Rute des Hochmuts[a], doch die Lippen der Weisen beschützen sie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Schössling des Hochmuts“ beziehungsweise „ein Zweig des Hochmuts“. Das hebräische Wort kann eine Rute, einen Zweig oder einen Schössling bezeichnen; im Zusammenhang passt das warnende Bild einer Rute besonders gut.'
    reason: lexical_alternative
  - marker: b
    text: 'Mit „sie“ sind wahrscheinlich die Weisen gemeint: Ihre Lippen, also ihre besonnene Rede, beschützen sie. Der hebräische Text nennt den Bezug des Pronomens jedoch nicht ausdrücklich.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: בְּפִי
  choice: Im Mund eines
  rationale: Die Verbindung aus ב und פֶּה wird örtlich wiedergegeben. So bleibt das hebräische Bild des Mundes als Ort der törichten Rede erhalten.
- source_word: אֱוִיל
  choice: Narren
  rationale: אֱוִיל bezeichnet in der Weisheitsliteratur einen moralisch uneinsichtigen oder halsstarrigen Menschen, nicht bloß jemanden mit geringer Intelligenz. „Narr“ ist dafür die knappe, etablierte deutsche Entsprechung.
- source_word: חֹטֶר
  choice: Rute
  rationale: Das Wort kann eine Rute, einen Zweig oder einen Schössling bezeichnen. Im Zusammenhang mit hochmütiger Rede vermittelt „Rute“ am ehesten das Bild eines Werkzeugs, das schlägt oder verletzt, ohne die knappe Metapher auszudeuten.
- source_word: גַּאֲוָה
  choice: des Hochmuts
  rationale: גַּאֲוָה bezeichnet Stolz, Überheblichkeit oder Hochmut. „Hochmut“ bringt hier die negative moralische Färbung prägnant zum Ausdruck und bewahrt die Genitivkonstruktion.
- source_word: וְשִׂפְתֵי
  choice: doch die Lippen
  rationale: Das ו verbindet hier gegensätzliche Aussagen und wird daher natürlich mit „doch“ wiedergegeben. „Lippen“ erhält den poetischen Parallelismus zu „Mund“.
- source_word: חֲכָמִים
  choice: der Weisen
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet die Gruppe der weisen Menschen. „Die Weisen“ ist im Deutschen knapp und für Weisheitsliteratur angemessen.
- source_word: תִּשְׁמוּרֵם
  choice: beschützen sie
  rationale: שׁמר bedeutet bewahren, behüten oder beschützen; das Suffix bedeutet „sie“. Die Form lässt den Bezug des Pronomens unausgesprochen. „Beschützen sie“ wahrt diese gedrängte Ausdrucksweise, während die Fußnote den wahrscheinlichsten Bezug erläutert.
theological_decisions:
- issue: Bezug des Objektsuffixes in תִּשְׁמוּרֵם
  choice: Das Pronomen bleibt im Haupttext als „sie“ stehen.
  alternative: „beschützen die Weisen“ oder „beschützen ihre Besitzer“
  rationale: Wahrscheinlich sind die Weisen selbst gemeint, deren besonnene Rede sie schützt. Da der hebräische Text den Bezug jedoch nicht ausdrücklich nennt, wird er nicht stillschweigend aufgelöst.
translation_notes:
  register: Moderne, würdige und knappe Spruchsprache. Die Körperbilder „Mund“ und „Lippen“ sowie die kompakte Metapher „Rute des Hochmuts“ bleiben erhalten. „Doch“ macht den Gegensatz der beiden Vershälften idiomatisch deutlich.
