  yaml_path: translation/ot/proverbs/014/015.yaml
  text: A simple man believes every word[a], but a prudent man considers his steps.
translation:
  language: de
  text: Ein Unerfahrener glaubt jedes Wort[a], ein Kluger aber bedenkt seinen Weg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „glaubt alles“ oder „glaubt jede Sache“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתִי
  choice: ein Unerfahrener
  rationale: Das Wort bezeichnet im Sprüchebuch einen unerfahrenen, leicht beeinflussbaren Menschen, nicht einfach jemanden mit geringer Intelligenz. „Unerfahrener“ gibt diese Weisheitskategorie im modernen Deutschen natürlich wieder.
- source_word: יַאֲמִין
  choice: glaubt
  rationale: Die Hifil-Form von אמן bedeutet hier, etwas als wahr oder verlässlich anzunehmen. „Glaubt“ passt natürlich zum Gegenstand „jedes Wort“.
- source_word: לְכָל דָּבָר
  choice: jedes Wort
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten. „Jedes Wort“ bewahrt die konkrete Ausdrucksweise und bezeichnet hier unkritische Leichtgläubigkeit gegenüber allem Gesagten; die weitere Bedeutung bleibt in der Fußnote erhalten.
- source_word: עָרוּם
  choice: ein Kluger
  rationale: Im positiven Weisheitskontext bezeichnet עָרוּם einen besonnenen, urteilsfähigen Menschen. „Kluger“ ist verständlich und vermeidet den im Deutschen oft negativen Beiklang von „schlau“ oder „listig“.
- source_word: יָבִין
  choice: achtet auf
  rationale: בין bezeichnet Einsicht und unterscheidendes Nachdenken. In Verbindung mit den eigenen Schritten bringt „achtet auf“ die praktische, sorgfältige Prüfung des eigenen Handelns idiomatisch zum Ausdruck.
- source_word: לַאֲשֻׁרוֹ
  choice: seine Schritte
  rationale: Das Substantiv bezeichnet Schritte beziehungsweise den Gang und steht bildlich für Lebensführung oder Vorgehensweise. „Seine Schritte“ erhält das konkrete hebräische Bild.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Die parallele Gegenüberstellung und das konkrete Bild der Schritte bleiben erhalten.
