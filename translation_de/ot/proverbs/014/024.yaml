base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/024.yaml
  text: The crown of the wise is their wealth[a], but the folly of fools is folly.
translation:
  language: de
  text: Die Krone der Weisen ist ihr Reichtum, doch die Torheit der Narren ist Torheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einigen alten Textzeugen und Auslegern kann die zweite Vershälfte lauten: „doch der Reichtum der Narren ist Torheit“. Der masoretische Text lautet wörtlich: „doch die Torheit der Narren ist Torheit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: Krone
  rationale: Das Substantiv bezeichnet eine Krone oder einen Kranz als sichtbares Zeichen von Ehre und Auszeichnung. „Krone“ bewahrt das Bild prägnant.
- source_word: חֲכָמִים
  choice: der Weisen
  rationale: Die substantivierte Pluralform bezeichnet weise Menschen allgemein. „der Weisen“ ist im Deutschen geschlechtsübergreifend und entspricht dem weisheitlichen Sprachgebrauch.
- source_word: עָשְׁרָם
  choice: ihr Reichtum
  rationale: 'עֹשֶׁר bezeichnet Reichtum oder Wohlstand; das Suffix der 3. Person Plural wird mit „ihr“ wiedergegeben. Die Wortstellung folgt der masoretischen Lesart: Der Reichtum der Weisen ist ihre Krone.'
- source_word: אִוֶּלֶת
  choice: Torheit
  rationale: Der Begriff bezeichnet intellektuelle und moralische Unvernunft. „Torheit“ ist würdig, verständlich und erhält die für den Vers wichtige Wiederholung.
- source_word: כְּסִילִים
  choice: Narren
  rationale: Das Wort bezeichnet in der Weisheitsliteratur Menschen, die sich durch moralische und geistige Uneinsichtigkeit auszeichnen. „Narren“ ist die traditionelle, prägnante deutsche Entsprechung.
- source_word: אִוֶּלֶת כְּסִילִים אִוֶּלֶת
  choice: die Torheit der Narren ist Torheit
  rationale: Der masoretische Text wiederholt אִוֶּלֶת und bildet eine zugespitzte, offenbar beabsichtigte Tautologie. Die Übersetzung bewahrt diese auffällige Form, statt sie erklärend zu glätten.
theological_decisions: []
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper sprichwörtlicher Struktur. Die ungewöhnliche Wiederholung „Torheit … Torheit“ bleibt bewusst erhalten, da sie den überlieferten masoretischen Text und seine rhetorische Zuspitzung wiedergibt.
