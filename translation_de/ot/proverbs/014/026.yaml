source:
  edition: WLC
  text: בְּ/יִרְאַ֣ת יְ֭הוָה מִבְטַח עֹ֑ז וּ֝/לְ/בָנָ֗י/ו יִהְיֶ֥ה מַחְסֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/026.yaml
  text: In the fear of Yahweh there is strong confidence[a], and for his children there will be a refuge.
translation:
  language: de
  text: In der Furcht Jahwes liegt starke Zuversicht, und für seine Kinder[a] wird es eine Zuflucht geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Seine Kinder“ kann auch Jahwes Kinder bedeuten, wenn „seine“ auf Jahwe und nicht auf den Menschen bezogen wird, der ihn fürchtet.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיִרְאַת
  choice: In der Furcht
  rationale: Die Verbindung aus ב und dem Konstrukt יִרְאַת bezeichnet hier am besten den Bereich beziehungsweise die Haltung ehrfürchtiger Gottesfurcht. Die deutsche Wendung bewahrt das hebräische Bild, ohne es auf ein bloßes Mittel zu reduzieren.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben. Der Genitiv ist im Deutschen durch die Konstruktion „Furcht Jahwes“ bedingt.
- source_word: מִבְטַח עֹז
  choice: starke Zuversicht
  rationale: מִבְטַח bezeichnet Vertrauen, Zuversicht oder Sicherheit; עֹז kennzeichnet diese als stark beziehungsweise fest. „Starke Zuversicht“ gibt die nominale Aussage knapp und natürlich wieder.
- source_word: וּלְבָנָיו
  choice: und für seine Kinder
  rationale: Das Präfix ל wird mit „für“ bewahrt. בָּנִים kann Söhne oder allgemeiner Kinder beziehungsweise Nachkommen bezeichnen; im allgemeinen Weisheitsspruch ist „Kinder“ angemessen. Das Possessivpronomen lässt die mögliche Mehrdeutigkeit seines Bezugs bestehen.
- source_word: יִהְיֶה מַחְסֶה
  choice: wird es eine Zuflucht geben
  rationale: היה mit dem folgenden Nomen kann eine Existenz ausdrücken. Die deutsche Zukunftsform entspricht dem hebräischen Imperfekt und vermeidet es, ein im Hebräischen nicht ausdrücklich genanntes persönliches Subjekt einzuführen.
theological_decisions:
- issue: Bezugswort des Suffixes in בָנָיו („seine Kinder“)
  choice: Im Haupttext wird „seine“ vorrangig auf den Menschen bezogen, der Jahwe fürchtet; dessen Kinder finden Zuflucht.
  alternative: Das Suffix kann auf Jahwe bezogen werden, sodass von Jahwes Kindern die Rede ist.
  rationale: Der Aufbau des Spruchs legt nahe, dass zunächst die Zuversicht des Gottesfürchtigen und dann der Schutz seiner Kinder beschrieben wird. Da ein Bezug auf Jahwe grammatisch möglich bleibt, wird diese echte Mehrdeutigkeit nicht beseitigt, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Weisheitssprache „Furcht Jahwes“ bleibt erhalten; „liegt starke Zuversicht“ bildet den hebräischen Nominalsatz natürlich ab. Die Satzstruktur bewahrt sowohl das vorangestellte „für“ als auch die pronominale Mehrdeutigkeit.
