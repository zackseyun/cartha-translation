  text: הוֹלֵ֣ךְ בְּ֭/יָשְׁר/וֹ יְרֵ֣א יְהוָ֑ה וּ/נְל֖וֹז דְּרָכָ֣י/ו בּוֹזֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/002.yaml
  text: Whoever walks in uprightness fears Yahweh[b][a], but the one whose ways are crooked despises him.
translation:
  language: de
  text: Wer aufrichtig lebt, fürchtet Jahwe; wer aber auf krummen Wegen geht[a], verachtet ihn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wer in seinen Wegen verkehrt ist“; das Hebräische beschreibt einen Menschen, dessen Lebensführung verdreht oder krumm ist.'
    reason: lexical_alternative
  - marker: b
    text: „Ihn“ bezieht sich am ehesten auf Jahwe. Das hebräische Pronomen kann jedoch auch allgemeiner verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ בְּיָשְׁרוֹ
  choice: wer aufrichtig lebt
  rationale: Das hebräische Bild des Gehens bezeichnet in der Weisheitsliteratur häufig die Lebensführung. Die natürliche deutsche Wendung „aufrichtig lebt“ gibt den moralischen Sinn von יֹשֶׁר wieder, ohne die Aussage unnötig zu verengen.
- source_word: יְרֵא יְהוָה
  choice: fürchtet Jahwe
  rationale: „Fürchten“ bewahrt den in den Sprüchen zentralen theologischen Ausdruck ירא יהוה und dessen Ernst; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וּנְלוֹז דְּרָכָיו
  choice: wer aber auf krummen Wegen geht
  rationale: נלוז bezeichnet etwas Verkehrtes, Verdrehtes oder Krummes, während דְּרָכָיו die Lebenswege beziehungsweise das Verhalten meint. Die Formulierung erhält das hebräische Wegbild in verständlichem Deutsch.
- source_word: בּוֹזֵהוּ
  choice: verachtet ihn
  rationale: בזה bedeutet „verachten“ oder „geringschätzen“. Das maskuline Suffix wird als „ihn“ wiedergegeben und bezieht sich im unmittelbaren Zusammenhang am ehesten auf Jahwe.
theological_decisions:
- issue: Bezug des pronominalen Suffixes in בּוֹזֵהוּ
  choice: „ihn“ bezieht sich auf Jahwe
  alternative: Das Pronomen kann allgemeiner auf den Aufrichtigen oder auf die durch Weisheit bestimmte sittliche Ordnung bezogen werden.
  rationale: Die antithetische Struktur stellt die Furcht Jahwes dem Verachten gegenüber; deshalb ist Jahwe der nächstliegende Bezug. Da das hebräische Pronomen den Bezug nicht ausdrücklich wiederholt, wird die verbleibende Mehrdeutigkeit in einer Fußnote festgehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Vershälfte gibt das in der Weisheitsliteratur übliche metaphorische „Gehen“ idiomatisch mit „leben“ wieder; in der zweiten Hälfte bleibt das anschauliche Wegmotiv erhalten. Die parallele, knappe Spruchform und die theologische Spannung des Pronominalbezugs werden bewahrt.
