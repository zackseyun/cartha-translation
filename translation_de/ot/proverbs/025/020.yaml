source:
  edition: WLC
  text: מַ֥עֲדֶה בֶּ֨גֶד בְּ/י֣וֹם קָ֭רָה חֹ֣מֶץ עַל נָ֑תֶר וְ/שָׁ֥ר בַּ֝/שִּׁרִ֗ים עַ֣ל לֶב רָֽע׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/020.yaml
  text: Like one who takes off a garment on a cold day[a], and like vinegar on soda[b], is one who sings songs to a troubled heart.
translation:
  language: de
  text: Wer einem bekümmerten Herzen[b] Lieder singt, ist wie jemand, der an einem kalten Tag ein Kleidungsstück ablegt, und wie Essig auf Natron[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Natron ist ein mineralisches Alkali. Essig reagiert damit und neutralisiert es.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „einem schlechten Herzen“; gemeint ist hier ein bedrückter oder trauriger innerer Zustand, nicht notwendigerweise moralische Bosheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲדֶה
  choice: jemand, der … ein Kleidungsstück ablegt
  rationale: Das Partizip bezeichnet hier das Entfernen beziehungsweise Ablegen eines Kleidungsstücks. „Ablegt“ ist im Deutschen natürlich und bewahrt das Bild, in der Kälte auf nötige Wärme zu verzichten.
- source_word: בֶּגֶד
  choice: ein Kleidungsstück
  rationale: Der allgemeine Ausdruck bezeichnet Kleidung, ohne eine bestimmte Art wie Mantel oder Obergewand festzulegen.
- source_word: בְּיוֹם קָרָה
  choice: an einem kalten Tag
  rationale: Die Wendung gibt die zeitliche Situation knapp und idiomatisch wieder.
- source_word: חֹמֶץ
  choice: Essig
  rationale: Dies ist die gewöhnliche und kontextuell passende Bedeutung.
- source_word: נָתֶר
  choice: Natron
  rationale: Gemeint ist ein mineralisches Alkali. „Natron“ bleibt sachlich näher am antiken Stoff als das missverständliche „Soda“ und ist im Deutschen noch verständlich; eine Fußnote erläutert den Begriff.
- source_word: וְשָׁר בַּשִּׁרִים
  choice: wer … Lieder singt
  rationale: Die partizipiale Form und der Plural werden in einer natürlichen deutschen Relativkonstruktion wiedergegeben.
- source_word: עַל לֶב רָע
  choice: einem bekümmerten Herzen
  rationale: Wörtlich steht „über/zu einem schlechten Herzen“. Im Zusammenhang bezeichnet רָע hier plausibel einen leidvollen, traurigen inneren Zustand und nicht zwingend moralische Bosheit. „Bekümmert“ wahrt den emotionalen Sinn, ohne ihn auf bloße Traurigkeit zu verengen.
theological_decisions:
- issue: Bedeutung von לֶב רָע
  choice: bekümmertes Herz
  alternative: böses Herz
  rationale: Der Vergleich kritisiert unpassendes Singen gegenüber einem Menschen in innerer Not. Die Wiedergabe als „böses Herz“ würde im Deutschen fast ausschließlich moralische Verderbtheit nahelegen und den kontextuellen Sinn unnötig festlegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Spruchform. Zur besseren deutschen Satzführung steht die Aussage über den Singenden vor den beiden Vergleichsbildern; deren Reihenfolge bleibt erhalten. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
