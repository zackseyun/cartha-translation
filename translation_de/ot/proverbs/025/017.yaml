  yaml_path: translation/ot/proverbs/025/017.yaml
  text: Let your foot be seldom in your neighbor’s house[b][a], lest he have his fill of you and hate you.
translation:
  language: de
  text: Mach dich im Haus deines Nächsten[b] rar[a], sonst bekommt er genug von dir und hasst dich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »Mache deinen Fuß selten aus dem Haus deines Nächsten.« Die Bildformel meint: Besuche ihn nur selten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »deines Freundes«; das hebräische Wort kann einen Nächsten, Freund oder Gefährten bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֹקַר רַגְלְךָ מִבֵּית
  choice: Mach dich im Haus ... rar
  rationale: Die hebräische Wendung lautet wörtlich etwa »Mach deinen Fuß selten vom Haus ... her« und fordert dazu auf, dort nur selten zu erscheinen. Die im Deutschen geläufige Formulierung »sich rar machen« gibt den Sinn, die imperative Kraft und das Wortspiel mit »selten/rar« natürlich wieder; die konkrete Fuß-Metapher wird in einer Fußnote offengelegt.
- source_word: רֵעֶךָ
  choice: deines Nächsten
  rationale: רֵעַ kann einen Nächsten, Freund oder Gefährten bezeichnen. »Nächster« bewahrt die breite soziale Bedeutung, ohne eine besonders enge Freundschaft vorauszusetzen; die mögliche Wiedergabe »Freund« wird in der Fußnote genannt.
- source_word: פֶּן
  choice: sonst
  rationale: פֶּן leitet die befürchtete Folge ein. »Sonst« ist in einem knappen deutschen Spruch natürlich und bewahrt den warnenden Charakter.
- source_word: יִשְׂבָּעֲךָ
  choice: wird er dich satt
  rationale: Das Verb שבע bezeichnet das Satt- oder Erfülltsein. »Dich satt werden« erhält das Bild der Übersättigung und passt zugleich zur deutschen Bedeutung, jemandes Gegenwart nicht länger ertragen zu wollen.
- source_word: וּשְׂנֵאֶךָ
  choice: und hasst dich
  rationale: Die direkte Wiedergabe bewahrt die Schärfe der im Hebräischen genannten Folge und mildert sie nicht zu bloßem Überdruss ab.
theological_decisions: []
translation_notes:
  register: Knappes, einprägsames Sprichwort in modernem Standarddeutsch. »Sich rar machen« ist eine geläufige deutsche Entsprechung der hebräischen Wendung; »dich satt werden« bewahrt bewusst deren kräftiges Bild der Übersättigung.
