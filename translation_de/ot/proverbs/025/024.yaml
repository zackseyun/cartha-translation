  source_fidelity: 'Die Übersetzung gibt den vergleichenden Weisheitsspruch treffend wieder: »Besser … wohnen als …« entspricht טוב … מִן, »wohnen« ist für שֶׁבֶת in dieser Ortsangabe idiomatisch, und das konkrete Bild der Dachecke bleibt erhalten. »streitsüchtigen Frau« gibt אֵשֶׁת מִדְיָנִים angemessen als habituell konfliktgeprägte Frau wieder. »in einem gemeinsamen Haus« ist eine vertretbare, gut lesbare Auflösung der knappen und syntaktisch verdichteten Schlussphrase וּבֵית חָבֶר, ohne deren Unsicherheit zu verschweigen.'
