  terminology: Die gewählten Begriffe sind sachlich und registergerecht. »streitsüchtig« ist hier treffender und weniger umständlich als etwa »voller Streitigkeiten«. Die Fußnote dokumentiert die mögliche stärker koordinierende Lesart (»Frau und einem Haus …«) und erklärt die hebräische Kürze angemessen.
