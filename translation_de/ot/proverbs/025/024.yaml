id: PRO.25.24
reference: Proverbs 25:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ט֗וֹב שֶׁ֥בֶת עַל פִּנַּת גָּ֑ג מֵ/אֵ֥שֶׁת מדונים וּ/בֵ֥ית חָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/024.yaml
  text: It is better to live on a corner of the roof than with a quarrelsome wife in a shared house[a].
translation:
  language: de
  text: Besser auf einer Ecke des Daches wohnen als mit einer streitsüchtigen Frau in einem gemeinsamen Haus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als mit einer streitsüchtigen Frau und einem Haus, das man gemeinsam bewohnt«. Die Schlusswendung ist im Hebräischen knapp und kann besonders das Teilen desselben Haushalts hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Besser
  rationale: Das prädikative Adjektiv leitet den für Weisheitssprüche typischen Vergleich ein; im Deutschen ist die knappe Form »Besser … als …« natürlich und prägnant.
- source_word: שֶׁבֶת
  choice: wohnen
  rationale: Der Infinitiv bedeutet wörtlich »sitzen«, bezeichnet zusammen mit einer Ortsangabe hier jedoch das Wohnen oder Verweilen.
- source_word: עַל פִּנַּת גָּג
  choice: auf einer Ecke des Daches
  rationale: Die konkrete Vorstellung eines engen, ausgesetzten Platzes auf einem Flachdach bleibt erhalten, ohne sie erklärend auszubauen.
- source_word: מֵאֵשֶׁת
  choice: als mit einer … Frau
  rationale: Die Präposition מִן markiert nach טוֹב den Vergleich; die deutsche Formulierung gibt das Zusammenwohnen idiomatisch wieder.
- source_word: מִדְיָנִים
  choice: streitsüchtigen
  rationale: Das pluralische Abstraktum »Streitigkeiten/Zänkereien« charakterisiert die Frau als gewohnheitsmäßig streitlustig; »streitsüchtig« ist klar und gegenwärtig.
- source_word: וּבֵית חָבֶר
  choice: in einem gemeinsamen Haus
  rationale: Die knappe hebräische Wendung bezeichnet wahrscheinlich ein gemeinsam bewohntes Haus beziehungsweise einen gemeinsamen Haushalt. Die Übersetzung wahrt diesen praktischen Sinn, ohne die Mehrdeutigkeit von חָבֶר völlig aufzulösen.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller und sprichwortartig knapper Standarddeutsch-Stil. Das konkrete Bild der Dachecke und die Spannung zwischen unbequemer Abgeschiedenheit und einem von Streit geprägten gemeinsamen Haushalt bleiben erhalten.
