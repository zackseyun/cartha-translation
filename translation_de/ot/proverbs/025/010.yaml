id: PRO.25.10
reference: Proverbs 25:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: פֶּֽן יְחַסֶּדְ/ךָ֥ שֹׁמֵ֑עַ וְ֝/דִבָּתְ/ךָ֗ לֹ֣א תָשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/010.yaml
  text: lest one who hears it disgrace you[b][a], and your bad reputation not turn back.
translation:
  language: de
  text: sonst beschämt dich, wer es hört,[a] und dein schlechter Ruf hört nicht mehr auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »macht dir Vorwürfe« beziehungsweise »bringt dich in Verruf«. Das hebräische Verb ist selten und an dieser Stelle schwer zu deuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und dein übler Bericht kehrt nicht zurück«. Gemeint sein kann, dass ein schlechter Ruf über dich weiterbesteht oder dass sich die entstandene Schande nicht mehr rückgängig machen lässt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: sonst
  rationale: Leitet die unerwünschte Folge der Warnung aus Vers 9 ein und klingt im modernen deutschen Sprichwortstil natürlich.
- source_word: יְחַסֶּדְךָ
  choice: beschämt dich
  rationale: Das seltene und an dieser Stelle schwierige Verb bezeichnet im Kontext wahrscheinlich eine beschämende oder entehrende Reaktion. »Beschämt« wahrt die lexikalische Unsicherheit besser als eine stärker festgelegte Wiedergabe.
- source_word: שֹׁמֵעַ
  choice: wer es hört
  rationale: Das substantivierte Partizip bezeichnet unbestimmt eine hörende Person; das Pronomen bezieht sich natürlich auf die zuvor erwähnte vertrauliche Sache.
- source_word: דִבָּתְךָ
  choice: dein schlechter Ruf
  rationale: דִּבָּה bezeichnet einen üblen Bericht, ein Gerücht oder verleumderisches Gerede. Hier gibt »schlechter Ruf« die soziale Folge idiomatisch wieder, ohne festzulegen, von wem die üble Rede ausgeht.
- source_word: לֹא תָשׁוּב
  choice: hört nicht mehr auf
  rationale: Wörtlich bedeutet die Wendung »kehrt nicht zurück«. Im Zusammenhang ist wahrscheinlich gemeint, dass der schädliche Ruf nicht rückgängig wird oder nicht mehr verschwindet; die natürliche deutsche Formulierung gibt diese fortdauernde Wirkung wieder.
