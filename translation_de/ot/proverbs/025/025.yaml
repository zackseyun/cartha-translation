  source_fidelity: 'Die Übersetzung gibt die hebräische Vergleichsstruktur treffend wieder: „kaltes Wasser“ entspricht מַיִם קָרִים, „für eine müde Seele“ vermittelt die hier bildhaft-wohltuende Beziehung von עַל zu נֶפֶשׁ עֲיֵפָה angemessen, und „eine gute Nachricht aus fernem Land“ entspricht שְׁמוּעָה טוֹבָה מֵאֶרֶץ מֶרְחָק. Die im Hebräischen elliptisch nebeneinandergestellten Vergleichsglieder werden durch „wie … so ist …“ idiomatisch und sinngetreu verbunden.'
