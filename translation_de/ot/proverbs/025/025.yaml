source:
  edition: WLC
  text: מַ֣יִם קָ֭רִים עַל נֶ֣פֶשׁ עֲיֵפָ֑ה וּ/שְׁמוּעָ֥ה ט֝וֹבָ֗ה מֵ/אֶ֥רֶץ מֶרְחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/025.yaml
  text: Like cold water to a weary soul[a], so is good news from a distant land.
translation:
  language: de
  text: Wie kaltes Wasser für eine müde Seele, so ist eine gute Nachricht aus fernem Land.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein guter Bericht aus fernem Land“. Das hebräische Wort שְׁמוּעָה kann „Nachricht“, „Kunde“ oder „Bericht“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קָרִים
  choice: kaltes Wasser
  rationale: מַיִם ist zwar morphologisch pluralisch, wird hier aber als Stoffbezeichnung gebraucht. קָרִים bezeichnet tatsächliche Kälte; „kaltes Wasser“ bewahrt das anschauliche Bild der Erfrischung.
- source_word: עַל נֶפֶשׁ עֲיֵפָה
  choice: für eine müde Seele
  rationale: עַל beschreibt hier die wohltuende Beziehung des Wassers zur ermatteten נֶפֶשׁ. „Für“ ist im Deutschen natürlich; „Seele“ erhält die poetische Weite von נֶפֶשׁ, und „müde“ gibt עֲיֵפָה schlicht und würdig wieder.
- source_word: שְׁמוּעָה טוֹבָה
  choice: eine gute Nachricht
  rationale: שְׁמוּעָה kann Nachricht, Kunde oder Bericht bedeuten. „Gute Nachricht“ ist modernes, verständliches Deutsch und entspricht der positiven Wirkung im Vergleich.
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: aus fernem Land
  rationale: Die Wendung bedeutet wörtlich ungefähr „aus einem Land der Ferne“. „Aus fernem Land“ ist knapp, poetisch und wahrt die geografische Distanz.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit knapper, würdiger Spruchpoesie. Die Vergleichsstruktur des Hebräischen bleibt erhalten; die beiden Bilder werden durch „so“ klar miteinander verbunden.
