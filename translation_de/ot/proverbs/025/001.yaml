  text: גַּם אֵ֭לֶּה מִשְׁלֵ֣י שְׁלֹמֹ֑ה אֲשֶׁ֥ר הֶ֝עְתִּ֗יקוּ אַנְשֵׁ֤י חִזְקִיָּ֬ה מֶֽלֶךְ יְהוּדָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/001.yaml
  text: These also are proverbs of Solomon[b][a], which the men of Hezekiah king of Judah copied.
translation:
  language: de
  text: Auch dies sind Sprüche Salomos, die die Männer Hiskias[b], des Königs von Juda, abgeschrieben haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „übertragen“ beziehungsweise „zusammengestellt“. Das hebräische Verb meint hier wahrscheinlich, dass diese Sprüche abgeschrieben und in eine Sammlung aufgenommen wurden.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Männern Hiskias“ sind wahrscheinlich Angehörige seines Hofes oder königliche Schreiber gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֵלֶּה
  choice: Auch dies
  rationale: Kennzeichnet diese Sammlung als weiteren Abschnitt und gibt den hebräischen Anschluss knapp und natürlich wieder.
- source_word: מִשְׁלֵי שְׁלֹמֹה
  choice: Sprüche Salomos
  rationale: Die übliche und sachlich passende Wiedergabe für die Gattungsbezeichnung und den Namen des Verfassers beziehungsweise Urhebers der Sprüche.
- source_word: הֶעְתִּיקוּ
  choice: abgeschrieben haben
  rationale: Das Hifil von עתק bezeichnet hier wahrscheinlich das Übertragen durch Abschreiben in eine Sammlung. Die Formulierung bleibt verständlich, ohne den genauen redaktionellen Vorgang festzulegen.
- source_word: אַנְשֵׁי חִזְקִיָּה
  choice: die Männer Hiskias
  rationale: Bewahrt die ausdrücklich maskuline Form des Hebräischen und die Zugehörigkeit zu Hiskia; die wahrscheinliche Funktion als Hof- oder Schreibbeamte wird in einer Fußnote erläutert.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Die Apposition identifiziert Hiskia präzise und entspricht natürlichem, würdigem Deutsch.
theological_decisions:
- issue: Geschlechtsspezifischer Ausdruck אַנְשֵׁי חִזְקִיָּה
  choice: die Männer Hiskias
  alternative: die Beamten Hiskias / die Schreiber Hiskias
  rationale: Der Haupttext bewahrt die maskuline Personenbezeichnung und vermeidet es, eine im Kontext nur wahrscheinliche amtliche Funktion als sicher auszugeben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Überschriftencharakter. Die Satzstellung bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; echte Unschärfen hinsichtlich des Abschreibe- beziehungsweise Sammlungsvorgangs und der Funktion von Hiskias Männern werden in den Fußnoten bewahrt.
