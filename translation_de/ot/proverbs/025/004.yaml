  text: Remove the dross from the silver[a], and a vessel comes out for the refiner.
translation:
  language: de
  text: Entferne die Schlacken vom Silber, dann entsteht für den Silberschmied[a] ein Gefäß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Metallhandwerker“. Das hebräische Wort kann allgemeiner einen Metallhandwerker bezeichnen; im Zusammenhang mit dem Entfernen von Schlacken aus Silber ist „Silberschmied“ naheliegend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָגוֹ
  choice: Entfernt
  rationale: Der hebräische Imperativ fordert dazu auf, etwas wegzunehmen beziehungsweise auszuscheiden. „Entfernt“ gibt den Aufforderungscharakter und die Pluralform knapp wieder.
- source_word: סִיגִים
  choice: die Schlacken
  rationale: Das Wort bezeichnet die beim Läutern ausgeschiedenen unedlen Bestandteile. „Schlacken“ bewahrt das konkrete metallurgische Bild.
- source_word: מִכָּסֶף
  choice: aus dem Silber
  rationale: Die Präposition bezeichnet hier die Trennung der Schlacken vom Silber; „aus“ ist im Deutschen in diesem Zusammenhang idiomatisch.
- source_word: וַיֵּצֵא
  choice: dann kommt … hervor
  rationale: Die Verbfolge bezeichnet das Ergebnis des zuvor genannten Vorgangs. Das präsentische „kommt hervor“ formuliert die allgemeine Aussage des Spruchs natürlich; „dann“ verdeutlicht lediglich die Ergebnisfolge.
- source_word: לַצֹּרֵף
  choice: für den Läuterer
  rationale: צֹרֵף bezeichnet einen Metallhandwerker mit Schwerpunkt auf Schmelzen und Läutern. „Läuterer“ passt besonders zum unmittelbaren Bild des Ausscheidens von Schlacken, ohne den Gegenstand auf Silberarbeiten zu verengen.
- source_word: כֶּלִי
  choice: ein Gefäß
  rationale: כְּלִי kann allgemein einen Gegenstand, ein Gerät oder Gefäß bezeichnen. „Gefäß“ erhält das konkrete und zugleich offene Bild des Spruchs.
theological_decisions: []
translation_notes:
  register: Knappes, bildhaftes Sprichwort in modernem Standarddeutsch. Die ungewöhnliche Aussage, dass nach dem Entfernen der Schlacken ein Gefäß „hervorkommt“, bleibt entsprechend der offenen Bildsprache des Hebräischen erhalten.
