  text: נֶ֣זֶם זָ֭הָב וַ/חֲלִי כָ֑תֶם מוֹכִ֥יחַ חָ֝כָ֗ם עַל אֹ֥זֶן שֹׁמָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/012.yaml
  text: Like a gold ring and an ornament of fine gold is a wise reprover to a listening ear[a].
translation:
  language: de
  text: Wie ein goldener Ring und ein Schmuckstück aus Feingold ist ein weiser Zurechtweiser für ein hörendes Ohr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wie ein goldener Nasenring und Schmuck aus Feingold ist ein weiser Zurechtweiser für ein Ohr, das hört.« Die hebräischen Schmuckbezeichnungen sind nicht ganz spezifisch; die Schlusswendung betont aufnahmebereites Hören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶזֶם
  choice: Ring
  rationale: Das Wort bezeichnet einen ringförmigen Schmuck, häufig einen Nasen- oder Ohrring. Da die genaue Trageweise hier nicht genannt wird, wahrt der allgemeinere Ausdruck »Ring« die Offenheit des Hebräischen.
- source_word: זָהָב
  choice: golden
  rationale: Die geläufige Materialbezeichnung wird im Deutschen idiomatisch als Adjektiv zum Ring wiedergegeben.
- source_word: וַחֲלִי
  choice: und ein Schmuckstück
  rationale: חֲלִי bezeichnet allgemein Schmuck oder ein Schmuckstück; die Wiedergabe vermeidet eine unbelegte Festlegung etwa auf eine Halskette.
- source_word: כָתֶם
  choice: aus Feingold
  rationale: Das Wort bezeichnet hochwertiges beziehungsweise geläutertes Gold. »Feingold« gibt dessen besonderen Wert knapp und natürlich wieder.
- source_word: מוֹכִיחַ
  choice: Mahner
  rationale: Das Partizip bezeichnet jemanden, der zurechtweist oder korrigierend ermahnt. »Mahner« erhält die substantivische Spruchform und klingt im Deutschen natürlicher als »Zurechtweiser«.
- source_word: חָכָם
  choice: weise
  rationale: Die Standardbedeutung in den Sprüchen bezeichnet praktische und sittliche Weisheit.
- source_word: עַל
  choice: für
  rationale: Die Präposition beschreibt hier die Beziehung des weisen Mahners zum aufnahmebereiten Empfänger. »Für« ergibt im deutschen Vergleich eine natürliche Zuordnung, ohne eine räumliche Bedeutung aufzudrängen.
- source_word: אֹזֶן שֹׁמָעַת
  choice: ein hörendes Ohr
  rationale: Die wörtlich nahe Form bewahrt das Körperteilbild und bezeichnet zugleich ein Ohr, das aufmerksam und bereitwillig hört.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Spruchstil mit klarer Vergleichsstruktur. »Mahner« ist knapp und konstruktiv gemeint; »hörendes Ohr« bewahrt die prägnante hebräische Metapher.
