  text: מַעְיָ֣ן נִ֭רְפָּשׂ וּ/מָק֣וֹר מָשְׁחָ֑ת צַ֝דִּ֗יק מָ֣ט לִ/פְנֵֽי רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/026.yaml
  text: Like a muddied spring and a polluted fountain is a righteous man who gives way before the wicked[a].
translation:
  language: de
  text: Wie eine getrübte Quelle und ein verunreinigter Brunnen ist ein Gerechter, der vor einem Frevler wankt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie eine durch Zertreten getrübte Quelle und ein verdorbener Brunnen ist ein Gerechter, der vor einem Frevler nachgibt.“'
    reason: Lexikalische Alternativen bei נִרְפָּשׂ, מָשְׁחָת und מָט; die Fußnote bezeichnet die mögliche Ursache der Trübung und die mögliche Deutung des Wankens als Nachgeben.
lexical_decisions:
- source_word: מַעְיָן
  choice: Quelle
  rationale: Bezeichnet eine natürliche Wasserquelle und bildet mit מָקוֹר die poetische Parallelstruktur.
- source_word: נִרְפָּשׂ
  choice: aufgewühlt
  rationale: Das passive Partizip beschreibt Wasser, das durch Aufrühren oder Zertreten trüb geworden ist. „Aufgewühlt“ bewahrt sowohl den Vorgang als auch die sichtbare Trübung.
- source_word: מָקוֹר
  choice: Brunnen
  rationale: Bezeichnet eine Wasserquelle oder einen Quellort. „Brunnen“ unterscheidet den zweiten Ausdruck im Deutschen von מַעְיָן, ohne das Bild des Wasserspenders aufzugeben.
- source_word: מָשְׁחָת
  choice: verdorben
  rationale: Das Wort bezeichnet Verderbnis, Beschädigung oder Verunreinigung. „Verdorben“ wahrt die Breite des Ausdrucks, statt ihn ausschließlich als moderne Umweltverschmutzung zu deuten.
- source_word: צַדִּיק
  choice: ein Gerechter
  rationale: Das maskuline substantivierte Adjektiv steht im Singular und bezeichnet hier sprichwörtlich einen gerechten Menschen; „ein Gerechter“ erhält Form und traditionelle ethische Bedeutung.
- source_word: מָט
  choice: ins Wanken gerät
  rationale: Das Verb kann wanken, gleiten, schwanken oder nachgeben bezeichnen. Die Wiedergabe lässt offen, ob moralisches Nachgeben, gesellschaftliches Zurückweichen oder ein Sturz gemeint ist.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet das Verhalten in Gegenwart beziehungsweise angesichts des Frevlers.
- source_word: רָשָׁע
  choice: einem Frevler
  rationale: Das substantivierte maskuline Adjektiv ist singular. „Frevler“ gibt den ethisch schuldhaften Gegensatz zum Gerechten knapp und würdig wieder.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von צַדִּיק und רָשָׁע
  choice: ein Gerechter … einem Frevler
  alternative: ein gerechter Mensch … einem bösen Menschen
  rationale: Die hebräischen Formen sind maskulin singular und zugleich sprichwörtlich-repräsentativ. Die gewählte Form bewahrt die grammatische Gestalt, ohne die allgemeine Geltung des Spruchs auszuschließen.
- issue: Deutung von מָט als moralische Kapitulation
  choice: ins Wanken gerät
  alternative: nachgibt
  rationale: Der Kontext kann ein Nachgeben vor dem Frevler nahelegen, doch das Verb selbst bezeichnet allgemeiner Wanken, Gleiten oder Schwanken. Die Übersetzung bewahrt diese echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Bildsprache. Die beiden annähernd synonymen Wasserbegriffe werden als „Quelle“ und „Brunnen“ unterschieden. Die syntaktische Vergleichsform des Hebräischen bleibt erhalten.
