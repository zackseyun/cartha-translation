id: PRO.25.11
reference: Proverbs 25:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תַּפּוּחֵ֣י זָ֭הָב בְּ/מַשְׂכִּיּ֥וֹת כָּ֑סֶף דָּ֝בָ֗ר דָּבֻ֥ר עַל אָפְנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/011.yaml
  text: Like apples of gold in settings of silver is a word spoken at the right time[a][b][c].
translation:
  language: de
  text: Wie goldene Äpfel[a] in silbernen Fassungen[b] ist ein Wort, das zur rechten Zeit gesprochen wird[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Welche Frucht das hebräische Wort genau bezeichnet, ist unsicher; sie muss nicht dem heutigen Apfel entsprechen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „in silbernen Schnitzereien“, „in silberner Zierarbeit“ oder „in silbernem Flechtwerk“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „passend gesprochen“ beziehungsweise „am rechten Platz gesprochen“; wörtlich: „auf seinen Rädern“. Die hebräische Wendung bezeichnet wohl ein Wort, das passend oder rechtzeitig geäußert wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפּוּחֵי (תַּפּוּחַ)
  choice: Äpfel
  rationale: Die traditionelle und im Deutschen unmittelbar verständliche Wiedergabe bewahrt das Bild einer kostbaren goldenen Frucht. Welche Frucht das hebräische Wort in der Antike genau bezeichnete, ist jedoch unsicher und wird deshalb in einer Fußnote offengehalten.
- source_word: זָהָב
  choice: goldene
  rationale: Das hebräische Substantiv bezeichnet eindeutig Gold; im Deutschen wird es dem Bild entsprechend adjektivisch wiedergegeben.
- source_word: בְּמַשְׂכִּיּוֹת
  choice: in … Fassungen
  rationale: Das seltene Wort bezeichnet wahrscheinlich kunstvoll gearbeitete Bild-, Zier- oder Einlegearbeit. „Fassungen“ ergibt ein anschauliches Gesamtbild, ohne die unsichere handwerkliche Ausführung zu stark festzulegen.
- source_word: כָּסֶף
  choice: silbernen
  rationale: Eindeutige Bezeichnung des Materials Silber, hier idiomatisch als Adjektiv formuliert.
- source_word: דָּבָר דָּבֻר
  choice: ein Wort, das … gesprochen wird
  rationale: דָּבָר bezeichnet hier im Zusammenhang mit דָּבֻר eine Äußerung. Die deutsche Relativsatzkonstruktion gibt das passive Partizip natürlich und verständlich wieder.
- source_word: עַל אָפְנָיו
  choice: zur rechten Zeit
  rationale: Wörtlich steht eine schwer deutbare Wendung mit „Rädern“. Im Kontext beschreibt sie wahrscheinlich eine Äußerung, die passend, richtig angebracht oder rechtzeitig erfolgt. „Zur rechten Zeit“ ist klares modernes Deutsch; die weitere Bedeutungsbreite und das wörtliche Bild werden in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Bildsprache. Die vorangestellte Vergleichsfigur folgt der hebräischen Wortfolge. „Zur rechten Zeit“ ist idiomatisch, während die echte Unsicherheit der seltenen Wendungen in den Fußnoten sichtbar bleibt.
