source:
  edition: WLC
  text: אָ֘כֹ֤ל דְּבַ֣שׁ הַרְבּ֣וֹת לֹא ט֑וֹב וְ/חֵ֖קֶר כְּבֹדָ֣/ם כָּבֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/027.yaml
  text: To eat much honey is not good[a], and to search out their glory is glory.
translation:
  language: de
  text: Viel Honig zu essen, ist nicht gut; und ihre Ehre zu ergründen, ist Ehre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der zweite Satzteil ist im Hebräischen schwer verständlich. Wörtlich etwa: „Und das Ergründen ihrer Ehre ist Ehre.“ Gemeint sein könnte, dass es nicht ehrenvoll ist, die eigene Ehre zu suchen, oder dass es ehrenvoll ist, gewichtige Dinge zu erforschen. Hier wird der masoretische Text eng wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֹל
  choice: zu essen
  rationale: Der Infinitiv dient sprichwörtlich als Subjekt des ersten Satzteils; die deutsche Infinitivkonstruktion gibt dies natürlich wieder.
- source_word: דְּבַשׁ
  choice: Honig
  rationale: Die konkrete Bildsprache des hebräischen Textes wird wörtlich beibehalten.
- source_word: הַרְבּוֹת
  choice: viel
  rationale: Die Form bezeichnet hier eine große beziehungsweise übermäßige Menge und wird im Deutschen knapp und idiomatisch wiedergegeben.
- source_word: לֹא טוֹב
  choice: ist nicht gut
  rationale: Die kurze, allgemein wertende Aussage bleibt erhalten, ohne sie auf gesundheitlichen Schaden einzuengen.
- source_word: חֵקֶר
  choice: zu ergründen
  rationale: Das Substantiv bezeichnet Erforschung oder Untersuchung. Die verbale Wiedergabe schafft eine natürliche Parallele zur Infinitivkonstruktion des ersten Satzteils.
- source_word: כְּבוֹדָם
  choice: ihre Ehre
  rationale: Die masoretische Form enthält ein Suffix der 3. Person maskulin Plural. Die Wiedergabe bewahrt dieses schwer zu deutende „ihre“, statt einen eindeutigen Bezug einzuführen.
- source_word: כָּבוֹד
  choice: ist Ehre
  rationale: Das nominale Prädikat und die Wiederholung von כּבוד werden bewahrt, auch wenn die Aussage im Deutschen ungewöhnlich klingt.
theological_decisions:
- issue: Deutung des schwer verständlichen zweiten Satzteils
  choice: 'Die masoretische Form wird eng wiedergegeben: „ihre Ehre zu ergründen, ist Ehre“'
  alternative: „Die eigene Ehre zu suchen, ist keine Ehre“ oder „Gewichtige Dinge zu erforschen, ist ehrenvoll“
  rationale: Der überlieferte hebräische Text ist knapp und in seinem Bezug unklar. Eine glättende Wiedergabe würde eine bestimmte ethische oder erkenntnistheoretische Deutung festlegen, die der Wortlaut nicht eindeutig verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wiederholung „Ehre … Ehre“ ist bewusst beibehalten, um die knappe Form und das Wortspiel des hebräischen Textes sowie seine echte Mehrdeutigkeit nicht aufzulösen.
