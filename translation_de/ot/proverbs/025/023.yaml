  yaml_path: translation/ot/proverbs/025/023.yaml
  text: The north wind brings forth rain[a], and an angry face[b], a slanderous tongue.
translation:
  language: de
  text: Der Nordwind bringt Regen hervor[a], und eine heimtückische Zunge ruft ein zorniges Gesicht hervor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Nordwind vertreibt den Regen, und eine heimtückische Zunge ruft ein zorniges Gesicht hervor.“ Das hebräische Verb wird unterschiedlich gedeutet; einige verstehen den ersten Satzteil so, dass der Nordwind den Regen vertreibt statt ihn hervorzubringen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „eine Zunge des Verborgenen“ oder „eine verborgene Zunge“. Gemeint ist verdeckte Rede, etwa Reden hinter dem Rücken, üble Nachrede oder Verleumdung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּחַ צָ֭פוֹן
  choice: der Nordwind
  rationale: Die Verbindung bezeichnet den Wind aus dem Norden; „der Nordwind“ ist die natürliche und bildkräftige deutsche Entsprechung.
- source_word: תְּח֣וֹלֵֽל
  choice: bringt … hervor
  rationale: Das Verb kann ein Hervorbringen oder Verursachen ausdrücken. Diese Wiedergabe erhält das anschauliche Bild und die kausale Parallelität des Spruchs, ohne die abweichende Deutung zu verschweigen.
- source_word: גָּ֑שֶׁם
  choice: Regen
  rationale: Die übliche, im Kontext natürliche Wiedergabe des hebräischen Wortes für Regen beziehungsweise einen Regenguss.
- source_word: וּ/פָנִ֥ים נִ֝זְעָמִ֗ים
  choice: ein zorniges Gesicht
  rationale: פנים ist der Form nach Plural, wird im Hebräischen aber regelmäßig für das Gesicht oder den Gesichtsausdruck gebraucht. Der Singular passt zur allgemeinen Aussage des Spruchs.
- source_word: לְשׁ֣וֹן סָֽתֶר
  choice: eine verleumderische Zunge
  rationale: Wörtlich handelt es sich um eine „Zunge des Verborgenen“, also um heimliches, hinter dem Rücken geäußertes Reden. „Verleumderische Zunge“ gibt die wahrscheinliche ethische Stoßrichtung in verständlichem Deutsch wieder; die wörtlichere Bedeutung wird in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Ellipse im zweiten Satzteil bewahrt die Parallelstruktur des hebräischen Spruchs; „bringt hervor“ ist sinngemäß mitzudenken. Die echte Mehrdeutigkeit des Verbs תְּחוֹלֵל wird durch eine alternative Übersetzung dokumentiert.
