  text: A man who has no restraint over his spirit is like a city broken into[a], without a wall.
translation:
  language: de
  text: Wie eine offene Stadt ohne Mauer ist ein Mann, der seinen Geist nicht beherrschen kann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… der sein Gemüt nicht beherrscht“ oder „… der sich nicht beherrschen kann“. Wörtlich steht im Hebräischen „seinen Geist“; damit können die innere Haltung und besonders das Temperament gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר
  choice: Stadt
  rationale: Die Grundbedeutung ist eine bewohnte städtische Ansiedlung; „Stadt“ ist im Bild des Spruchs die natürliche deutsche Entsprechung.
- source_word: פְּרוּצָה
  choice: aufgebrochen
  rationale: Das Partizip von פרץ bezeichnet hier eine Stadt, deren Schutz durchbrochen wurde. „Aufgebrochen“ bewahrt das anschauliche Bild einer gewaltsam geöffneten und schutzlosen Stadt.
- source_word: אֵין חוֹמָה
  choice: ohne Mauer
  rationale: Die knappe Formulierung gibt das Fehlen der schützenden Stadtmauer direkt und idiomatisch wieder.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das hebräische Maskulinum Singular wird als repräsentative Gestalt eines Weisheitsspruchs beibehalten, ohne die allgemeine Anwendbarkeit des Spruchs einzuschränken.
- source_word: מַעְצָר
  choice: Herrschaft
  rationale: Das seltene Substantiv bezeichnet Zurückhaltung oder Kontrolle. In der Verbindung „Herrschaft über“ ergibt sich eine natürliche deutsche Wendung, die den Gedanken der inneren Beherrschung ausdrückt.
- source_word: לְרוּחוֹ
  choice: über seinen Geist
  rationale: רוּחַ kann Geist, innere Haltung, Gemütsbewegung oder Zorn meinen. „Geist“ wahrt die Breite des hebräischen Ausdrucks; die kontextuell engeren Deutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Geschlechtlich markierte repräsentative Sprache im Weisheitsspruch
  choice: ein Mann
  alternative: ein Mensch; jemand
  rationale: אִישׁ ist grammatisch männlich und bezeichnet hier eine beispielhafte Person. Die Übersetzung erhält diese Form, ohne eine besondere Aussage über die Reichweite des Spruchs hinzuzufügen.
- issue: Bedeutungsumfang von רוּחַ
  choice: Geist
  alternative: Gemüt; Zorn; sich selbst
  rationale: Der Kontext legt die Beherrschung innerer Regungen nahe, legt aber nicht eindeutig fest, ob besonders das Temperament oder umfassender das Innere gemeint ist. Die Hauptfassung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Vergleichsstruktur des hebräischen Weisheitsspruchs bleibt erhalten; „aufgebrochene Stadt“ vermittelt Schutzlosigkeit ohne technisch-militärisches Vokabular.
