  text: Remove the wicked from before the king[b][a], and his throne will be established in righteousness.
translation:
  language: de
  text: Entferne den Frevler aus der Gegenwart des Königs[a], dann wird dessen Thron durch Gerechtigkeit[b] gefestigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Schaffe den Frevler fort.“ Gemeint ist seine Entfernung aus der Gegenwart oder dem Umfeld des Königs.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „in Gerechtigkeit“. Das Hebräische kann Gerechtigkeit als Mittel oder als den Bereich bezeichnen, in dem der Thron gefestigt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָגוֹ
  choice: Entferne
  rationale: Der Qal-Imperativ bezeichnet im Zusammenhang mit Vers 4 das Beseitigen bzw. Fortschaffen. „Entferne“ gibt die Aufforderung knapp wieder, ohne die Art des Vorgehens näher festzulegen.
- source_word: רָשָׁע
  choice: den Frevler
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular und bezeichnet einen einzelnen schuldhaft bösen Menschen als Typus. „Frevler“ ist prägnant, würdig und im Weisheitskontext verständlich.
- source_word: לִפְנֵי
  choice: aus der Gegenwart
  rationale: Die Verbindung mit פָּנִים bezeichnet hier die Entfernung aus der unmittelbaren Gegenwart bzw. dem Umfeld des Königs. Die deutsche Wendung wahrt den höfischen Kontext.
- source_word: מֶלֶךְ
  choice: des Königs
  rationale: Der bestimmte Ausdruck entspricht der sprichwörtlich-allgemeinen Rede vom König.
- source_word: וְיִכּוֹן
  choice: dann wird … gefestigt
  rationale: Das Niphal-Imperfekt von כון drückt aus, dass etwas fest gegründet oder dauerhaft gesichert wird. „Dann“ gibt die Folgewirkung des mit וְ verbundenen Satzes natürlich wieder.
- source_word: בַּצֶּדֶק
  choice: durch Gerechtigkeit
  rationale: Die Präposition ב kann Mittel oder Bereich bezeichnen. „Durch Gerechtigkeit“ ist im Deutschen natürlich und hebt die tragende Grundlage des Thrones hervor; die mögliche Wiedergabe „in Gerechtigkeit“ bleibt in der Fußnote erhalten.
- source_word: כִּסְאוֹ
  choice: dessen Thron
  rationale: Das Suffix der dritten Person maskulin Singular bezieht sich auf den König. „Dessen“ vermeidet im Deutschen den möglichen falschen Bezug des Possessivpronomens auf den unmittelbar zuvor genannten Frevler.
theological_decisions:
- issue: Verhältnis von gerechter Herrschaft und Bestand des Thrones
  choice: 'Die Aussage bleibt als sprichwörtlicher Zusammenhang formuliert: Das Entfernen des Frevlers führt zur Festigung des königlichen Thrones durch Gerechtigkeit.'
  alternative: Die Aussage als uneingeschränkte politische Verheißung oder als bloße Zweckanweisung auszulegen.
  rationale: Der hebräische Parallelismus stellt einen Weisheitszusammenhang her, ohne dessen Geltungsweise dogmatisch näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Frevler“ bewahrt die substantivierte maskuline Einzahl und den weisheitlichen Ton. „Dessen“ klärt den Rückbezug auf den König. Die Satzfügung mit „dann“ bildet die im Hebräischen ausgedrückte Folge idiomatisch ab.
