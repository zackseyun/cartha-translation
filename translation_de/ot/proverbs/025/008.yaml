  text: אַל תֵּצֵ֥א לָ/רִ֗ב מַ֫הֵ֥ר פֶּ֣ן מַה תַּ֭עֲשֶׂה בְּ/אַחֲרִיתָ֑/הּ בְּ/הַכְלִ֖ים אֹתְ/ךָ֣ רֵעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/008.yaml
  text: Do not go out hastily to a dispute[a], lest in the end, when your neighbor puts you to shame[b], you not know what to do.
translation:
  language: de
  text: Lass dich nicht vorschnell auf einen Streit[a] ein; was wirst du sonst am Ende tun, wenn dein Nächster dich beschämt?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Streit“ kann hier auch eine rechtliche Auseinandersetzung oder einen Gang vor Gericht bezeichnen.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich und knapp: „Sonst: Was wirst du an ihrem Ende tun, wenn dein Nächster dich beschämt?“ Das feminine Suffix in „ihrem Ende“ kann sich auf die Auseinandersetzung oder Rechtssache beziehen. Gemeint sein kann auch: „Sonst weißt du am Ende nicht, was du tun sollst.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּצֵא לָרִיב
  choice: Zieh … in einen Streit
  rationale: Die Verbindung bezeichnet das Ausziehen beziehungsweise Sichbegeben in eine Auseinandersetzung. Die Formulierung bewahrt das hebräische Bewegungsbild und lässt sowohl persönlichen Streit als auch einen Rechtsstreit anklingen.
- source_word: מַהֵר
  choice: vorschnell
  rationale: Das Wort bezeichnet nicht nur Schnelligkeit, sondern hier ein unbedachtes, übereiltes Vorgehen. „Vorschnell“ bringt beides knapp zum Ausdruck.
- source_word: פֶּן
  choice: sonst
  rationale: פֶּן leitet die drohende unerwünschte Folge ein. „Sonst“ gibt diese Warnfunktion im modernen Deutschen natürlich wieder.
- source_word: בְּאַחֲרִיתָהּ
  choice: am Ende
  rationale: Das feminine Suffix bezieht sich wahrscheinlich auf die Auseinandersetzung beziehungsweise Rechtssache. „Am Ende“ bezeichnet offen deren Ausgang oder spätere Folge.
- source_word: בְּהַכְלִים אֹתְךָ
  choice: wenn … dich beschämt
  rationale: Die Konstruktion bezeichnet den Zeitpunkt oder Umstand, in dem der andere den Angeredeten beschämt. „Beschämt“ wahrt die soziale Ehr- und Schanddimension, ohne sie zu verstärken.
- source_word: רֵעֶךָ
  choice: dein Nächster
  rationale: רֵעַ bezeichnet allgemein den Mitmenschen, Nachbarn oder Gegenüber und setzt keine enge Freundschaft voraus. „Nächster“ erhält diese soziale Breite.
- source_word: מַה תַּעֲשֶׂה
  choice: was wirst du … tun?
  rationale: Die hebräische Formulierung stellt eine knappe rhetorische Frage. Die direkte Wiedergabe bewahrt die Ellipse und vermeidet, ausdrücklich ein im Hebräischen nicht vorhandenes „du weißt nicht“ einzufügen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Spruchweisheit. Die direkte rhetorische Frage erhält die ungewöhnliche hebräische Kürze und ihre offene Warnwirkung; das Semikolon und der Gedankenstrich machen den Satz im Deutschen lesbar.
