  text: אַל תִּתְהַדַּ֥ר לִ/פְנֵי מֶ֑לֶךְ וּ/בִ/מְק֥וֹם גְּ֝דֹלִ֗ים אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/006.yaml
  text: Do not exalt yourself before a king[a], and do not stand in the place of great men.
translation:
  language: de
  text: Mach dich vor einem König nicht wichtig und nimm nicht den Platz der Großen ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: unter die Hochgestellten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַדַּר
  choice: brüste dich
  rationale: Das Hitpael von הדר bezeichnet hier ein Sich-Schmücken bzw. Sich-Hervortun. „Brüste dich“ gibt die Warnung vor selbstherrlicher Selbstdarstellung im königlichen Umfeld natürlich und prägnant wieder.
- source_word: לִפְנֵי מֶלֶךְ
  choice: vor dem König
  rationale: לִפְנֵי bedeutet „vor“ bzw. „in der Gegenwart von“. Der bestimmte Ausdruck „dem König“ entspricht im Deutschen der idiomatischen Verwendung bei einer repräsentativen Rolle, obwohl das Hebräische keinen Artikel setzt.
- source_word: בִּמְקוֹם גְּדֹלִים
  choice: an den Platz der Großen
  rationale: מָקוֹם bezeichnet einen Platz oder eine Stellung; גְּדֹלִים meint hier hochgestellte, einflussreiche Personen. „der Großen“ bewahrt die substantivierte Statusbezeichnung und vermeidet die im heutigen Deutsch missverständliche Formulierung „großer Männer“.
- source_word: תַּעֲמֹד
  choice: stell dich
  rationale: עמד bedeutet grundsätzlich „stehen“, kann hier aber im Zusammenhang mit מָקוֹם das Einnehmen einer Stellung bezeichnen. „Stell dich an den Platz“ ist im Deutschen natürlicher als „stehe am Platz“ und erhält den Gedanken eigenmächtiger Positionierung.
theological_decisions:
- issue: Personenbezeichnung גְּדֹלִים
  choice: die Großen
  alternative: hochgestellte Leute / bedeutende Männer
  rationale: Der maskuline Plural bezeichnet in diesem gesellschaftlichen Kontext nicht zwingend ausschließlich Männer, sondern Personen von hohem Rang. Die substantivierte Form „die Großen“ erhält sowohl die grammatische Gestalt als auch die soziale Bedeutung, ohne eine nicht ausdrücklich vorhandene Geschlechteraussage einzutragen.
translation_notes:
  register: Modernes, knappes und würdevolles Sprichwortdeutsch. „Brüste dich nicht“ ist verständlich und bringt die reflexive Selbsterhöhung deutlich zum Ausdruck; „stell dich nicht an den Platz“ bildet die konkrete höfische Rangordnung ab.
