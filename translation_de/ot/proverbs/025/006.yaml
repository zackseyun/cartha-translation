review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die beiden Verbote und den höfisch-sozialen Zusammenhang grundsätzlich zutreffend wieder. „Brüste dich“ verengt תִּתְהַדַּר jedoch auf Prahlen und wirkt ohne eine übliche Ergänzung wie „mit ...“ semantisch und syntaktisch weniger passend. Die anarthrische, exemplarische Wendung לִפְנֵי מֶלֶךְ wird mit „vor einem König“ besser bewahrt.
  naturalness: „Brüste dich nicht vor dem König“ klingt im heutigen Standarddeutsch ungewohnt. „Stell dich nicht an den Platz der Großen“ ist zwar verständlich, aber „den Platz ... einnehmen“ ist für das unberechtigte Beanspruchen einer Rangstellung idiomatischer.
  terminology: „die Großen“ ist als statusbezogene substantivierte Personenbezeichnung angemessen und wahrt die Offenheit des hebräischen Maskulinums. „Mach dich ... wichtig“ gibt die reflexive Selbsterhöhung idiomatisch wieder, ohne einen förmlichen Titel oder eine engere Deutung einzutragen.
  issues:
  - severity: medium
    issue: „Brüste dich nicht“ ist hier keine optimale Wiedergabe von תִּתְהַדַּר.
    rationale: Das Verb „sich brüsten“ bezeichnet überwiegend ein Prahlen, häufig „sich mit etwas brüsten“. Das hebräische Hitpael zielt hier auf selbstbewusste Selbstdarstellung bzw. Selbstheraushebung; „Mach dich nicht wichtig“ ist im Kontext natürlicher und ausreichend weit.
  - severity: low
    issue: Bestimmter Artikel in „vor dem König“.
    rationale: Der hebräische Ausdruck ist anarthrisch und proverbial generisch. „Vor einem König“ bildet dies im Deutschen klarer ab.
  - severity: medium
    issue: „stell dich nicht an den Platz der Großen“ ist weniger idiomatisch als eine Wendung mit „einnehmen“.
    rationale: Das Verbot betrifft das ungebührliche Beanspruchen einer Stellung. „Nimm nicht den Platz der Großen ein“ vermittelt dies natürlich, ohne den Sinn zu erweitern.
  revised_text: Mach dich vor einem König nicht wichtig und nimm nicht den Platz der Großen ein.[a]
