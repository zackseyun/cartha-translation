translation:
  language: de
  text: Denn du häufst glühende Kohlen auf seinen Kopf[a], und der HERR wird dir vergelten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Denn du scharrst Kohlen auf seinen Kopf.“ Das hebräische Bild bleibt bewusst erhalten. Umstritten ist, ob es die Beschämung eines Feindes, eine Verschärfung seines Gerichts oder beides bezeichnet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und der HERR wird dich belohnen.“ Das hebräische Verb kann Erstattung oder Vergeltung bezeichnen; hier ist dem Zusammenhang nach eine günstige Vergeltung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn damit
  rationale: Leitet die Begründung zur Aufforderung des vorigen Verses ein. „Damit“ macht den Bezug auf das dort geforderte Handeln natürlich deutlich, ohne den Sinn auszudeuten.
- source_word: גֶחָלִים
  choice: glühende Kohlen
  rationale: Bezeichnet Feuerkohlen bzw. noch heiße Kohlen; „glühende Kohlen“ erhält das lebendige Bild.
- source_word: חֹתֶה
  choice: häufst
  rationale: Das Verb bezeichnet das Aufnehmen oder Zusammenscharren von Kohlen. In Verbindung mit „auf seinen Kopf“ gibt „häufen“ die resultierende Anhäufung im Deutschen idiomatisch wieder.
- source_word: עַל רֹאשׁוֹ
  choice: auf seinen Kopf
  rationale: Direkte Wiedergabe der hebräischen Präpositionalphrase; das mehrdeutige Bild wird nicht interpretierend aufgelöst.
- source_word: וַיהוָה
  choice: und der HERR
  rationale: Gibt den Gottesnamen JHWH nach der üblichen deutschen Bibelkonvention als „der HERR“ wieder.
- source_word: יְשַׁלֶּם לָךְ
  choice: wird es dir vergelten
  rationale: Das Piel von שלם bezeichnet Erstattung oder Vergeltung. „Es dir vergelten“ bleibt lexikalisch offen, während der Kontext eine günstige Vergeltung für den Handelnden nahelegt.
theological_decisions:
- issue: Bedeutung der glühenden Kohlen auf dem Kopf
  choice: Das Bild bleibt im Haupttext ohne Festlegung seiner Wirkung erhalten.
  alternative: Ausdeutung als Beschämung des Feindes mit dem Ziel der Umkehr oder als Steigerung seines Gerichts.
  rationale: Der hebräische Text erklärt die Metapher nicht ausdrücklich. Die Übersetzung bewahrt daher ihre echte interpretative und theologische Spannung.
- issue: Art der Vergeltung durch den HERRN
  choice: „wird es dir vergelten“
  alternative: „wird dich belohnen“
  rationale: Der Zusammenhang legt eine positive Belohnung nahe, doch das hebräische Verb selbst ist allgemeiner. Die Hauptfassung wahrt diese lexikalische Breite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das seltenere Bild der Kohlen wird quellennah bewahrt; „häufst“ und „vergelten“ sind verständlich und zugleich für einen Weisheitstext angemessen.
