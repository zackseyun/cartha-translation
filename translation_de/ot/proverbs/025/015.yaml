  text: בְּ/אֹ֣רֶךְ אַ֭פַּיִם יְפֻתֶּ֣ה קָצִ֑ין וְ/לָשׁ֥וֹן רַ֝כָּ֗ה תִּשְׁבָּר גָּֽרֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/015.yaml
  text: By patience a ruler may be persuaded[b][a], and a gentle tongue breaks a bone.
translation:
  language: de
  text: Durch Geduld lässt sich ein Herrscher überzeugen[a], und eine sanfte Zunge zerbricht einen Knochen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Durch Langmut wird ein Herrscher gewonnen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Das Bild stellt Sanftheit und Härte bewusst gegeneinander: Freundliche, beharrliche Rede kann selbst harten Widerstand überwinden.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּאֹרֶךְ אַפַּיִם
  choice: Durch Geduld
  rationale: Die hebräische Wendung bedeutet wörtlich etwa »bei langer Nase/langem Zorn« und bezeichnet die Fähigkeit, nicht schnell zornig zu werden. »Durch Geduld« gibt das Idiom im Deutschen knapp und natürlich wieder und schließt beharrliches, besonnenes Abwarten ein.
- source_word: יְפֻתֶּה
  choice: lässt sich … überzeugen
  rationale: Die Pual-Form von פתה bezeichnet hier, dass jemand beeinflusst, überredet oder gewonnen wird. Die gewählte Formulierung wahrt den passiven Sinn, ohne den im Deutschen oft negativen Beiklang von »verführen« einzutragen.
- source_word: קָצִין
  choice: ein Herrscher
  rationale: Das Wort bezeichnet einen Menschen in leitender oder befehlender Stellung. »Herrscher« ist allgemein verständlich und erhält die Aussage über eine Autoritätsperson, ohne sie unnötig auf ein bestimmtes Amt einzugrenzen.
- source_word: לָשׁוֹן רַכָּה
  choice: eine sanfte Zunge
  rationale: »Sanft« gibt רַכָּה idiomatisch wieder; »Zunge« bewahrt das konkrete hebräische Bild für sanftes Reden.
- source_word: תִּשְׁבָּר גָּרֶם
  choice: zerbricht einen Knochen
  rationale: Die wörtlich-konkrete Metapher bleibt erhalten. Der Singular »einen Knochen« entspricht dem hebräischen גָּרֶם und bringt die überraschende Kraft sanfter Rede prägnant zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Spruchform. Der Parallelismus und das paradoxe Bild der sanften Zunge, die einen Knochen zerbricht, werden bewahrt.
