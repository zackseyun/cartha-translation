  text: שֵׁ֣ן רֹ֭עָה וְ/רֶ֣גֶל מוּעָ֑דֶת מִבְטָ֥ח בּ֝וֹגֵ֗ד בְּ/י֣וֹם צָרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/019.yaml
  text: Confidence in a treacherous man in a day of trouble is like a bad tooth and a slipping foot[a][b].
translation:
  language: de
  text: Wie ein schlechter Zahn und ein unsicherer Fuß ist Vertrauen auf einen Treulosen am Tag der Not.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein ausgleitender“ oder „ein wankender Fuß“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁן רֹעָה
  choice: ein schlechter Zahn
  rationale: Die konkrete Körpermetapher bleibt erhalten. רֹעָה bezeichnet hier einen schadhaften beziehungsweise unzuverlässigen Zahn; „schlecht“ wahrt die semantische Breite, ohne einen bestimmten Defekt wie Fäulnis festzulegen.
- source_word: רֶגֶל מוּעָדֶת
  choice: ein wankender Fuß
  rationale: רֶגֶל bedeutet gewöhnlich „Fuß“. מוּעָדֶת beschreibt einen Fuß, der nachgibt, schwankt oder ausgleitet; „wankend“ bringt die mangelnde Verlässlichkeit natürlich zum Ausdruck, ohne die genaue Art der Instabilität festzulegen.
- source_word: מִבְטָח
  choice: Vertrauen
  rationale: Das Substantiv bezeichnet Vertrauen oder das Sichverlassen auf jemanden. „Vertrauen auf“ ist im Deutschen knapp und passt zur sprichwörtlichen Gegenüberstellung.
- source_word: בּוֹגֵד
  choice: einen Treulosen
  rationale: Das maskuline substantivierte Partizip bezeichnet jemanden, der treulos oder verräterisch handelt. „einen Treulosen“ bewahrt Numerus und grammatisches Geschlecht sowie die offene Spannweite zwischen Untreue und Verrat.
- source_word: בְּיוֹם צָרָה
  choice: am Tag der Not
  rationale: Die zeitliche Wendung wird formal nah und zugleich idiomatisch wiedergegeben. צָרָה umfasst Not, Bedrängnis und Schwierigkeiten; „Not“ entspricht dem zugespitzten Kontext.
theological_decisions:
- issue: Generisches Maskulinum bei בּוֹגֵד
  choice: „einen Treulosen“ im grammatisch maskulinen Singular
  alternative: „einen treulosen Menschen“ oder „eine treulose Person“
  rationale: Die hebräische Form ist maskulin Singular und hat hier repräsentative, allgemeine Kraft. Die Übersetzung bewahrt diese Form, ohne die Aussage auf Männer als einzige gemeinte Gruppe zu beschränken.
- issue: Art der körperlichen Instabilität in מוּעָדֶת
  choice: „wankender Fuß“
  alternative: „ausgleitender Fuß“, „unsicherer Fuß“ oder möglicherweise „verrenkter Fuß“
  rationale: Die Bildaussage ist eindeutig die Unzuverlässigkeit beim Abstützen; die genaue körperliche Fehlfunktion ist lexikalisch nicht völlig sicher. Der Haupttext bewahrt diese Offenheit, die Fußnote nennt Alternativen.
translation_notes:
  register: Moderne, würdige und leicht verständliche Spruchsprache. Die Vergleichsbilder stehen zur Betonung voran; der deutsche Satz macht das im Hebräischen knappe Gleichnis ausdrücklich mit „Wie … ist …“ lesbar.
