base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/018.yaml
  text: A club[a], a sword, and a sharp arrow is a man who bears false witness against his neighbor.
translation:
  language: de
  text: Eine Keule[a], ein Schwert und ein scharfer Pfeil – so ist ein Mann, der gegen seinen Nächsten als falscher Zeuge aussagt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Streitkolben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵפִיץ
  choice: Keule
  rationale: Das Substantiv bezeichnet eine zerschmetternde Schlagwaffe. „Keule“ ist im modernen Deutschen unmittelbar verständlich und passt zur dreigliedrigen Waffenreihe.
- source_word: חֶרֶב
  choice: Schwert
  rationale: Die übliche und kontextuell passende Wiedergabe des geläufigen hebräischen Wortes.
- source_word: חֵץ שָׁנוּן
  choice: scharfer Pfeil
  rationale: שָׁנוּן bedeutet „geschärft, scharf“. Die Wiedergabe bewahrt das konkrete Bild und die Waffenreihe.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das Hebräische steht grammatisch im maskulinen Singular und zeichnet sprichwörtlich eine einzelne männliche Person.
- source_word: עֹנֶה
  choice: aussagt
  rationale: Das Partizip bedeutet grundsätzlich „antwortet“; zusammen mit עֵד שָׁקֶר hat es hier klar forensischen Sinn. „aussagt“ gibt diesen im Deutschen natürlich wieder.
- source_word: בְרֵעֵהוּ
  choice: gegen seinen Nächsten
  rationale: Im Zusammenhang einer Zeugenaussage ist die Präposition adversativ zu verstehen. „Nächster“ bewahrt die ethische Färbung von רֵעַ.
- source_word: עֵד שָׁקֶר
  choice: als falscher Zeuge
  rationale: Die Wendung lautet wörtlich „Zeuge der Lüge/falscher Zeuge“. Mit „als falscher Zeuge aussagt“ bleibt das Zeugenbild erhalten und der juristische Sinn ist idiomatisch klar.
