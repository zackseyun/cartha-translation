  source_fidelity: Die Übersetzung gibt die Wettermetapher und den Vergleichssatz des Hebräischen präzise wieder. „Wolken und Wind ohne Regen“ entspricht נְשִׂיאִים וְרוּחַ וְגֶשֶׁם אָיִן idiomatisch. „Mit einem trügerischen Geschenk prahlt“ bildet die knappe, bewusst nicht näher bestimmte Verbindung מִתְהַלֵּל בְּמַתַּת שָׁקֶר angemessen ab, ohne die Bedeutung auf ein bloß nicht ausgehändigtes Geschenk festzulegen.
