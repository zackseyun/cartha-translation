source:
  edition: WLC
  text: נְשִׂיאִ֣ים וְ֭/רוּחַ וְ/גֶ֣שֶׁם אָ֑יִן אִ֥ישׁ מִ֝תְהַלֵּ֗ל בְּ/מַתַּת שָֽׁקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/014.yaml
  text: Like clouds and wind without rain is a man who boasts of a false gift[a].
translation:
  language: de
  text: Wie Wolken und Wind ohne Regen ist ein Mann, der mit einem trügerischen Geschenk prahlt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „mit einer Gabe der Lüge“; auch: „der mit einem Geschenk prahlt, das er nicht gibt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשִׂיאִים
  choice: Wolken
  rationale: Im Zusammenhang mit Wind und Regen bezeichnet das Wort hier am natürlichsten regenverheißende Wolken.
- source_word: רוּחַ
  choice: Wind
  rationale: Die Wetterbildsprache legt eindeutig die meteorologische Bedeutung nahe.
- source_word: גֶשֶׁם
  choice: Regen
  rationale: Dies ist die gewöhnliche und kontextuell klare Bedeutung.
- source_word: אָיִן
  choice: ohne
  rationale: „Ohne Regen“ gibt die knappe hebräische Aussage „Regen ist nicht da“ idiomatisch und prägnant wieder.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Die maskuline Einzahl wird entsprechend der Bildform des hebräischen Spruchs beibehalten und steht repräsentativ.
- source_word: מִתְהַלֵּל
  choice: prahlt
  rationale: Die Hitpael-Form bezeichnet hier selbstgefälliges Rühmen; „prahlt“ ist im modernen Deutschen klar und stilistisch passend.
- source_word: בְּמַתַּת
  choice: mit einem Geschenk
  rationale: Die Präposition bezeichnet den Gegenstand beziehungsweise Anlass des Prahlens; „mit einem Geschenk prahlen“ ist natürliches Deutsch.
- source_word: שָׁקֶר
  choice: trügerischen
  rationale: Das Wort kennzeichnet das Geschenk als falsch, unwahr oder nicht wirklich gegeben. „Trügerisch“ bewahrt die Kürze und lässt offen, ob das Geschenk nur versprochen, vorgetäuscht oder anderweitig unecht ist.
theological_decisions: []
translation_notes:
  register: Knappe, bildhafte Spruchform in modernem, würdigem Standarddeutsch. Der parallele Vergleich bleibt erhalten; „trügerisch“ bewahrt die Mehrdeutigkeit des hebräischen שָׁקֶר, ohne sie vorschnell auf ein bloß nicht überreichtes Geschenk festzulegen.
