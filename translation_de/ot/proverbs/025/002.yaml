  text: כְּבֹ֣ד אֱ֭לֹהִים הַסְתֵּ֣ר דָּבָ֑ר וּ/כְבֹ֥ד מְ֝לָכִ֗ים חֲקֹ֣ר דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/002.yaml
  text: It is the glory of God to conceal a matter[b][a], and the glory of kings to search out a matter.
translation:
  language: de
  text: Gott gereicht es zur Ehre[a], eine Sache zu verbergen[b], und Königen, eine Sache zu erforschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Herrlichkeit“; ebenso in der zweiten Vershälfte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Angelegenheit geheim zu halten“ und „eine Angelegenheit zu untersuchen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹד
  choice: Ehre
  rationale: כָּבוֹד bezeichnet hier das gewichtige Ansehen bzw. die Hoheit, die Gott und Königen zukommt. „Ehre“ ist im modernen Deutschen in beiden Vershälften natürlich und bewahrt die genaue Parallelität; „Herrlichkeit“ bleibt als gehobenere Alternative in der Fußnote erhalten.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Kontext der israelitischen Weisheit bezeichnet אֱלֹהִים den einen Gott; der deutsche Singular gibt dies angemessen wieder.
- source_word: הַסְתֵּר
  choice: zu verbergen
  rationale: Der Infinitiv bezeichnet das absichtsvolle Nichtoffenlegen einer Sache. „Verbergen“ wahrt die knappe, würdige Ausdrucksweise und lässt offen, weshalb Gott so handelt.
- source_word: דָּבָר
  choice: eine Sache
  rationale: דָּבָר meint hier eine Angelegenheit oder einen Gegenstand der Betrachtung, nicht zwingend ein gesprochenes Wort. „Sache“ funktioniert in beiden parallelen Satzgliedern.
- source_word: וּכְבֹד
  choice: und die Ehre
  rationale: Das ו verbindet die beiden Vershälften koordinierend. „Und“ vermeidet es, einen ausdrücklich gegensätzlichen Sinn einzutragen, den der hebräische Wortlaut nicht festlegt.
- source_word: מְלָכִים
  choice: Könige
  rationale: Der konkrete königliche Titel wird beibehalten und nicht zum allgemeineren „Herrscher“ erweitert.
- source_word: חֲקֹר
  choice: zu erforschen
  rationale: חקר bezeichnet gründliches Nachforschen und Untersuchen. „Erforschen“ bildet den bewussten Gegenklang zu „verbergen“ und passt zum gehobenen Weisheitsstil.
theological_decisions:
- issue: Verhältnis zwischen Gottes Verbergen und dem Forschen der Könige
  choice: Beide Vershälften werden ohne wertende oder systematische Erklärung parallel wiedergegeben.
  alternative: Den Vers ausdrücklich als Gegensatz zwischen göttlichem Geheimnis und menschlicher Regierung oder als Lehre verstehen, dass Könige genau das aufdecken, was Gott verborgen hat.
  rationale: Der hebräische Text nennt zwei Formen von Ehre, erklärt aber weder ihre moralische Bewertung noch ihr genaues Verhältnis. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Knapper, würdiger Weisheitsstil in modernem Standarddeutsch. Die spiegelbildliche Satzstruktur und die Wiederholung von „Ehre“ und „eine Sache“ bewahren den Parallelismus des Hebräischen.
