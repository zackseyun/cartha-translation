  verdict: revise
  source_fidelity: Die hebräische figura etymologica רִיבְךָ רִיב bezeichnet am besten das direkte Verhandeln bzw. Austragen der eigenen Streitsache mit dem betreffenden Nächsten. „Trage deinen Streit ... aus“ ist grundsätzlich möglich, kann im heutigen Deutsch jedoch stärker nach einem kämpferischen „Ausfechten“ klingen und gibt den Sach-/Rechtsfallaspekt von רִיבְךָ weniger deutlich wieder. „Mitmensch“ ist für רֵעַ semantisch möglich, aber hier weniger präzise und weniger idiomatisch als „Nächster“. Der zweite Halbvers ist inhaltlich zutreffend; die knappe Formulierung „das Geheimnis eines anderen“ bewahrt die hebräische Offenheit.
  naturalness: „Führe deine Streitsache mit deinem Nächsten“ ist modernes, verständliches Standarddeutsch mit angemessen würdigem Weisheitsregister. Es vermeidet sowohl die räumliche Engführung von „Nachbar“ als auch den etwas abstrakt-ethischen Klang von „Mitmensch“.
  terminology: „Streitsache“ deckt sowohl Streit als auch möglichen Rechtsfall ab. „Nächster“ ist eine etablierte, breite Wiedergabe von רֵעַ, ohne hier eine spezifisch theologische Bedeutung einzutragen. „Geheimnis“ und „verrate nicht“ entsprechen סוֹד bzw. אַל תְּגָל idiomatisch.
