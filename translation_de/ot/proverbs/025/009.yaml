  text: רִֽ֭יבְ/ךָ רִ֣יב אֶת רֵעֶ֑/ךָ וְ/ס֖וֹד אַחֵ֣ר אַל תְּגָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/009.yaml
  text: Argue your case with your neighbor himself[b][a], and do not reveal another person's secret.
translation:
  language: de
  text: Führe deine Streitsache mit deinem Nächsten[a], aber verrate nicht das Geheimnis eines anderen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Trage deinen Streit mit deinem Nächsten aus“ oder „Verhandle deine Streitsache mit deinem Nächsten.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das Geheimnis eines anderen“. Gemeint sein kann eine vertrauliche Angelegenheit oder Mitteilung, die eine andere Person betrifft oder ihr anvertraut ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיבְךָ
  choice: deinen Streit
  rationale: Das Substantiv רִיב bezeichnet einen Streit, eine Streitsache oder einen Rechtsfall. „Streit“ ist im Deutschen natürlich und lässt offen, ob die Auseinandersetzung rechtlicher oder persönlicher Art ist.
- source_word: רִיב
  choice: trage ... aus
  rationale: Der Imperativ fordert dazu auf, die Streitsache mit dem Betroffenen selbst zu behandeln. „Einen Streit austragen“ gibt die figura etymologica רִיבְךָ רִיב idiomatisch wieder, ohne den Kontext unnötig auf ein Gerichtsverfahren festzulegen.
- source_word: אֶת רֵעֶךָ
  choice: mit deinem Mitmenschen
  rationale: רֵעַ kann Nachbar, Gefährte oder Mitmensch bedeuten. „Mitmensch“ ist hier breit genug und vermeidet die im modernen Deutschen oft räumlich verengte Bedeutung von „Nachbar“.
- source_word: וְסוֹד
  choice: aber ... das Geheimnis
  rationale: סוֹד kann vertrauliche Mitteilung, Geheimnis oder vertrauten Rat bezeichnen. „Geheimnis“ ist klar und bewahrt den Gedanken vertraulicher Information. Das verbindende ו wird wegen des inhaltlichen Gegensatzes natürlich mit „aber“ wiedergegeben.
- source_word: אַחֵר
  choice: eines anderen
  rationale: Die knappe Genitivverbindung „das Geheimnis eines anderen“ entspricht der hebräischen Formulierung und lässt offen, um welche andere Person es sich handelt.
- source_word: אַל תְּגָל
  choice: verrate nicht
  rationale: גלה bedeutet hier aufdecken oder offenbaren. Bei einem Geheimnis ist „verraten“ im modernen Deutschen die natürliche Verbindung und bringt den Vertrauensbruch zum Ausdruck, ohne zusätzliche Einzelheiten einzuführen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Weisheitssprache. Die Wiederholung der hebräischen Wurzel ריב wird durch die geläufige deutsche Verbindung „einen Streit austragen“ wiedergegeben. Die Direktheit gegenüber dem Streitgegner ist im hebräischen אֶת רֵעֶךָ angelegt, aber nicht durch ein ausdrückliches Wort für „allein“ oder „selbst“ markiert; deshalb wird sie nicht dogmatisch in den Haupttext ergänzt, sondern als mögliche Sinnentfaltung in Fußnote [a] genannt.
