    rationale: Das Wort ist zwar weit gefasst, wirkt aber in diesem Zusammenhang abstrakter und weniger idiomatisch als „Nächster“; רֵעַ meint den konkreten anderen Beteiligten, Nachbarn oder Gefährten.
  - severity: low
