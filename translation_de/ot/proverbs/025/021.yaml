id: PRO.25.21
reference: Proverbs 25:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם רָעֵ֣ב שֹׂ֭נַאֲ/ךָ הַאֲכִלֵ֣/הוּ לָ֑חֶם וְ/אִם צָ֝מֵ֗א הַשְׁקֵ֥/הוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/021.yaml
  text: If your enemy is hungry[a], feed him bread, and if he is thirsty, give him water to drink.
translation:
  language: de
  text: Wenn dein Feind[a] hungrig ist, gib ihm Brot zu essen; und wenn er durstig ist, gib ihm Wasser zu trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der dich hasst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die konditionale Partikel wird direkt mit „wenn“ wiedergegeben; im Deutschen deckt „wenn“ diese reale Bedingung natürlich ab.
- source_word: רָעֵב
  choice: hungrig ist
  rationale: Das prädikative Adjektiv bezeichnet schlicht den Zustand des Hungers; eine stärkere Wiedergabe wie „ausgehungert“ wäre nicht begründet.
- source_word: שֹׂנַאֲךָ
  choice: dein Feind
  rationale: Das substantivierte Partizip bedeutet wörtlich „der dich hasst“. „Dein Feind“ gibt die relationale Bedeutung im Deutschen knapp und idiomatisch wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: הַאֲכִלֵהוּ
  choice: gib ihm … zu essen
  rationale: Der Hifil-Imperativ bedeutet „lass ihn essen/ernähre ihn“. Mit dem ausdrücklichen Objekt „Brot“ ist „gib ihm Brot zu essen“ natürlich und präzise.
- source_word: לָחֶם
  choice: Brot
  rationale: Das konkrete Bild des hebräischen Wortes wird beibehalten, statt es zum allgemeineren „Nahrung“ zu erweitern.
- source_word: וְאִם
  choice: und wenn
  rationale: Die koordinierte zweite Bedingung und der Parallelismus des Hebräischen bleiben erhalten.
- source_word: צָמֵא
  choice: durstig ist
  rationale: Die schlichte Zustandsbezeichnung entspricht parallel dem ersten Satzglied „hungrig ist“.
- source_word: הַשְׁקֵהוּ
  choice: gib ihm … zu trinken
  rationale: Der Hifil-Imperativ bezeichnet das Tränken beziehungsweise Geben eines Getränks. Die gewählte Form ist im modernen Deutschen natürlich.
- source_word: מָיִם
  choice: Wasser
  rationale: Das ausdrücklich genannte Objekt wird konkret und direkt wiedergegeben.
theological_decisions:
- issue: Generisches Maskulinum im singularischen Spruch
  choice: „dein Feind … ihm … er … ihm“
  alternative: Geschlechtsneutrale Plural- oder Paarformen
  rationale: Der hebräische Text verwendet durchgehend maskuline Singularformen mit repräsentativer Reichweite. Die deutsche Fassung erhält sowohl die Form als auch die persönliche Zuspitzung, ohne die Anwendung auf Männer zu beschränken.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der parallele Satzbau und die konkreten Bilder „Brot“ und „Wasser“ bleiben erhalten; „gib ihm … zu essen/zu trinken“ vermeidet zugleich archaisches „speise/tränke ihn“.
