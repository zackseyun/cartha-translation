source:
  edition: WLC
  text: כְּ/צִנַּת שֶׁ֨לֶג בְּ/י֬וֹם קָצִ֗יר צִ֣יר נֶ֭אֱמָן לְ/שֹׁלְחָ֑י/ו וְ/נֶ֖פֶשׁ אֲדֹנָ֣י/ו יָשִֽׁיב־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/013.yaml
  text: Like the coolness of snow on a harvest day is a faithful messenger to those who send him[b][a], for he refreshes the life of his masters.
translation:
  language: de
  text: Wie die Kühle des Schnees[a] an einem Erntetag ist ein treuer Bote für die, die ihn senden; denn er gibt seinen Herren neue Lebenskraft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie die Kälte des Schnees zur Erntezeit“. Gemeint ist wahrscheinlich die mit Schnee verbundene erfrischende Kühle, nicht Schneefall, der die Ernte schädigt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und er stellt das Leben (oder: die Seele) seiner Herren wieder her“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִנַּת שֶׁלֶג
  choice: Wie die Kühle von Schnee
  rationale: צִנָּה bezeichnet Kälte oder Kühle. Im positiven Vergleich vermittelt „Kühle“ die erfrischende Wirkung natürlicher als „Kälte“, ohne das Bild des Schnees aufzulösen.
- source_word: בְּיוֹם קָצִיר
  choice: an einem Erntetag
  rationale: Die konkrete Zeitangabe bleibt erhalten und lässt den wohltuenden Gegensatz zwischen Erntehitze und Schneekühle erkennen.
- source_word: צִיר נֶאֱמָן
  choice: ein treuer Bote
  rationale: „Bote“ gibt צִיר allgemeinverständlich wieder; „treu“ bewahrt neben der Zuverlässigkeit auch den moralischen Gehalt von נֶאֱמָן.
- source_word: לְשֹׁלְחָיו
  choice: für die, die ihn senden
  rationale: Die hebräische Form bezeichnet im Plural diejenigen, die den Boten senden. Die Umschreibung ist im Deutschen natürlicher als „für seine Sender“.
- source_word: וְנֶפֶשׁ אֲדֹנָיו יָשִׁיב
  choice: denn er belebt seine Herren neu
  rationale: נֶפֶשׁ bezeichnet hier das Leben beziehungsweise die innere Lebenskraft; die Hifil-Form von שׁוב drückt deren Wiederherstellung aus. „Belebt … neu“ verbindet diese Bedeutung natürlich mit dem erfrischenden Bild des ersten Halbverses.
theological_decisions:
- issue: Bedeutungsumfang von נֶפֶשׁ
  choice: als Lebenskraft im Ausdruck „belebt … neu“ wiedergegeben
  alternative: „stellt die Seele seiner Herren wieder her“
  rationale: Der Kontext spricht von neuer Kraft und Erfrischung. Die Wiedergabe vermeidet eine unnötige Festlegung auf eine Leib-Seele-Trennung, während die wörtlichere Möglichkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der konkrete Vergleich und der Plural „seine Herren“ bleiben erhalten. Das Semikolon markiert die beiden Vershälften; „denn“ gibt die naheliegende erläuternde Beziehung der Schlussaussage wieder.
