source:
  edition: WLC
  text: דְּבַ֣שׁ מָ֭צָאתָ אֱכֹ֣ל דַּיֶּ֑/ךָּ פֶּן תִּ֝שְׂבָּעֶ֗/נּוּ וַ/הֲקֵֽאתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/016.yaml
  text: If you find honey[a], eat only enough for you, lest you become full of it and vomit it.
translation:
  language: de
  text: Findest du Honig, iss nur so viel, wie dir genügt[a], sonst wirst du davon satt und erbrichst ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Iss, was dir genügt.“'
    reason: Die knappe hebräische Formulierung דַּיֶּךָ kann auch enger und formaler als „was dir genügt“ wiedergegeben werden.
lexical_decisions:
- source_word: דְּבַשׁ
  choice: Honig
  rationale: Das Substantiv bezeichnet konkret Honig; ein übertragener Sinn wird im Vers selbst nicht ausdrücklich gemacht.
- source_word: מָצָאתָ
  choice: Findest du
  rationale: Die formal perfektive Form steht in einem allgemeinen Weisheitsspruch. Das deutsche Präsens gibt den wiederkehrenden Bedingungsfall natürlich wieder.
- source_word: אֱכֹל
  choice: iss
  rationale: Der Imperativ der 2. Person Singular wird direkt wiedergegeben; das Objekt ergibt sich aus „Honig“.
- source_word: דַּיֶּךָ
  choice: nur so viel, wie dir genügt
  rationale: Die Wendung bezeichnet die für die angesprochene Person ausreichende Menge. „nur“ verdeutlicht die im Zusammenhang enthaltene Begrenzung, ohne eine genaue Menge festzulegen.
- source_word: פֶּן
  choice: sonst
  rationale: Die Konjunktion leitet die unerwünschte Folge ein. „Sonst“ ist im heutigen Deutsch natürlicher als „damit nicht“ oder das gehobene „auf dass nicht“.
- source_word: תִּשְׂבָּעֶנּוּ
  choice: wirst du davon zu satt
  rationale: Das Verb bedeutet, gesättigt oder satt zu werden; das Pronomen bezieht sich auf den Honig. „zu satt“ macht im Deutschen die durch den Kontext bezeichnete Übersättigung verständlich.
- source_word: וַהֲקֵאתוֹ
  choice: und erbrichst ihn
  rationale: Die Hifil-Form bezeichnet deutlich das Erbrechen. Die kräftige körperliche Bildsprache wird nicht abgeschwächt.
theological_decisions: []
translation_notes:
  register: Modernes, knappes Standarddeutsch mit der direkten, einprägsamen Form eines Weisheitsspruchs. Die drastische Schlusswendung bleibt erhalten.
