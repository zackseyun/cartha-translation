source:
  edition: WLC
  text: שָׁמַ֣יִם לָ֭/רוּם וָ/אָ֣רֶץ לָ/עֹ֑מֶק וְ/לֵ֥ב מְ֝לָכִ֗ים אֵ֣ין חֵֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/003.yaml
  text: The heavens for height[a], and the earth for depth, and the heart of kings—there is no searching out.
translation:
  language: de
  text: Der Himmel in seiner Höhe, die Erde in ihrer Tiefe und das Herz der Könige sind unerforschlich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch knapp: »Himmel hinsichtlich der Höhe, Erde hinsichtlich der Tiefe und Herz der Könige – kein Erforschen.« Die Wendung »kein Erforschen« kann die ganze Reihe betreffen oder besonders auf das Herz der Könige bezogen sein: »Das Herz der Könige ist unerforschlich.«'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: שָׁמַיִם
  choice: der Himmel
  rationale: Der hebräische Plural bezeichnet hier den Himmel beziehungsweise die Himmelssphäre als kosmisches Gegenstück zur Erde; der deutsche Singular ist in diesem Zusammenhang natürlich und präzise.
- source_word: לָרוּם
  choice: in seiner Höhe
  rationale: Das Präfix ל bezeichnet hier den Gesichtspunkt oder die Dimension. Die Formulierung gibt die Höhe des Himmels idiomatisch wieder und bewahrt die Parallelität zur Tiefe der Erde.
- source_word: וָאָרֶץ
  choice: die Erde
  rationale: Im kosmischen Parallelismus mit dem Himmel bedeutet אֶרֶץ die Erde, nicht ein bestimmtes Land.
- source_word: לָעֹמֶק
  choice: in ihrer Tiefe
  rationale: Die Wendung entspricht parallel לָרוּם und bezeichnet die schwer auszulotende Tiefendimension der Erde.
- source_word: לֵב
  choice: das Herz
  rationale: Im Hebräischen umfasst »Herz« Denken, Absichten und innere Haltung. Die bildhafte und bewusst weit gefasste Aussage bleibt dadurch erhalten.
- source_word: מְלָכִים
  choice: der Könige
  rationale: Das Substantiv bezeichnet ausdrücklich Könige und sollte nicht zum allgemeineren »Herrscher« erweitert werden.
- source_word: אֵין חֵקֶר
  choice: sie sind unerforschlich
  rationale: Die idiomatische Wiedergabe bringt die wörtliche Aussage »es gibt kein Erforschen/Ergründen« natürlich zum Ausdruck. Der Plural bezieht die Schlussaussage aufgrund der elliptischen Reihung auf alle drei Größen, ohne die besondere Zuspitzung auf das Herz der Könige aufzuheben.
theological_decisions:
- issue: Bezugsumfang von אֵין חֵקֶר
  choice: Die Unerforschlichkeit wird grammatisch auf Himmelshöhe, Erdtiefe und Königsherz bezogen.
  alternative: 'Die Wendung ausschließlich auf das Herz der Könige beziehen: »Das Herz der Könige ist unerforschlich.«'
  rationale: Der hebräische Vers ist eine knappe, verblosen Reihung und lässt den syntaktischen Bezugsumfang offen. Die gewählte deutsche Fassung macht den wahrscheinlich umfassenden Vergleich lesbar; die Fußnote bewahrt die engere Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Dreierstruktur des Hebräischen bleibt erhalten; »unerforschlich« vermeidet die im Deutschen schwerfällige Nominalwendung »es gibt kein Erforschen«.
