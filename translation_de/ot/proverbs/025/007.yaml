id: PRO.25.7
reference: Proverbs 25:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י ט֥וֹב אֲמָר לְ/ךָ֗ עֲֽלֵ֫ה הֵ֥נָּה מֵֽ֭/הַשְׁפִּ֣ילְ/ךָ לִ/פְנֵ֣י נָדִ֑יב אֲשֶׁ֖ר רָא֣וּ עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/007.yaml
  text: For it is better that it be said to you[b][a], “Come up here,” than that you be humbled before a nobleman whom your eyes have seen.
translation:
  language: de
  text: 'Denn es ist besser, man sagt zu dir: »Komm hier herauf!«, als dass man dich vor einem Vornehmen erniedrigt, den deine Augen gesehen haben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den deine Augen gesehen haben«. Die anschauliche hebräische Wendung kann auch schlicht »den du gesehen hast« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Mahnung ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: טוֹב ... מִן
  choice: es ist besser ... als
  rationale: Die Konstruktion ist komparativ und verlangt im Deutschen »besser ... als«.
- source_word: אֲמָר לְךָ
  choice: man sagt zu dir
  rationale: Das unbestimmte Subjekt des hebräischen Infinitivs wird durch das idiomatische deutsche »man« bewahrt.
- source_word: עֲלֵה הֵנָּה
  choice: Komm hier herauf!
  rationale: Gibt sowohl die räumliche Aufwärtsbewegung als auch den gesellschaftlichen Aufstieg zu einem höheren Platz wieder.
- source_word: מֵהַשְׁפִּילְךָ
  choice: als dass man dich ... erniedrigt
  rationale: Der Hifil-Stamm bezeichnet das Herabsetzen an Rang oder Platz; »erniedrigt« wahrt sowohl den konkreten als auch den sozialen Sinn.
- source_word: לִפְנֵי
  choice: vor
  rationale: Bezeichnet die Gegenwart beziehungsweise Öffentlichkeit, in der die Herabsetzung geschieht.
- source_word: נָדִיב
  choice: einem Vornehmen
  rationale: Bezeichnet hier einen gesellschaftlich hochgestellten oder angesehenen Menschen, ohne zwingend einen bestimmten Herrschertitel auszudrücken.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: den deine Augen gesehen haben
  rationale: Bewahrt die anschauliche hebräische Ausdrucksweise und ihren möglichen Hinweis auf einen konkret anwesenden Würdenträger.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Vornehmer« ist allgemein verständlich und vermeidet die mögliche Überbestimmung durch »Fürst« oder »Adliger«; »erniedrigt« erhält die räumliche und gesellschaftliche Doppeldeutigkeit.
