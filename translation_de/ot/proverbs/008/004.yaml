source:
  edition: WLC
  text: אֲלֵי/כֶ֣ם אִישִׁ֣ים אֶקְרָ֑א וְ֝/קוֹלִ֗/י אֶל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/004.yaml
  text: To you[a], O men, I call, and my voice is to the sons of mankind.
translation:
  language: de
  text: Euch, ihr Männer, rufe ich zu, und meine Stimme richtet sich an die Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne des Menschen“; die hebräische Wendung bezeichnet Menschen allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלֵיכֶם
  choice: Euch
  rationale: Die Präposition אֶל mit dem Suffix der 2. Person maskulin Plural bezeichnet die unmittelbar Angesprochenen. Die Voranstellung wahrt die Betonung des Hebräischen.
- source_word: אִישִׁים
  choice: ihr Männer
  rationale: Der maskuline Plural von אִישׁ bezeichnet hier Männer. „Ihr Männer“ gibt die Anrede im heutigen Deutsch natürlich wieder, ohne sie zu verallgemeinern.
- source_word: אֶקְרָא
  choice: rufe ich zu
  rationale: Das Qal-Imperfekt von קרא bezeichnet hier das laute Rufen zu den Angesprochenen. „zurufen“ passt zum öffentlichen Ruf der Weisheit und verbindet sich idiomatisch mit „euch“.
- source_word: וְקוֹלִי
  choice: und meine Stimme
  rationale: Die substantivische Form wird beibehalten und bewahrt so den poetischen Parallelismus.
- source_word: אֶל
  choice: richtet sich an
  rationale: Die zweite Präposition אֶל drückt die Richtung der Stimme auf ihre Adressaten aus. Die verblose hebräische Wendung verlangt im Deutschen eine idiomatische Ergänzung.
- source_word: בְּנֵי אָדָם
  choice: die Menschen
  rationale: Die wörtliche Wendung „Söhne Adams/des Menschen“ ist im Hebräischen eine übliche Bezeichnung für Menschen allgemein. „die Menschen“ gibt ihren gemeinten Umfang in modernem Deutsch wieder; die Bildform wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Geschlechtsspezifische und allgemeine anthropologische Sprache im Parallelismus
  choice: „ihr Männer“ für אִישִׁים, aber „die Menschen“ für בְּנֵי אָדָם
  alternative: „ihr Menschen … die Menschenkinder“ oder durchgehend männlich „ihr Männer … die Söhne Adams“
  rationale: 'Die beiden hebräischen Ausdrücke sind nicht deckungsgleich: אִישִׁים ist ausdrücklich maskulin, während בְּנֵי אָדָם als feste Wendung die Menschheit beziehungsweise Menschen allgemein bezeichnet. Die Übersetzung bewahrt diesen Unterschied, ohne den Adressatenkreis des zweiten Ausdrucks unnötig auf Männer zu beschränken.'
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Die direkte Anrede und der poetische Parallelismus bleiben erkennbar; eine im heutigen Deutsch missverständliche wörtliche Wiedergabe von בְּנֵי אָדָם steht in der Fußnote.
