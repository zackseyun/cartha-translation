  source_fidelity: Die erste Zeile gibt בְּצֶדֶק angemessen als „gerecht“ wieder. Die zweite Zeile sollte die Ortsbeziehung von בָהֶם jedoch mit „in ihnen“ statt „an ihnen“ ausdrücken. Die Wiedergabe „verdreht oder verkehrt“ erhält die zwei eng verwandten Metaphern von נִפְתָּל und עִקֵּשׁ ohne sie unnötig zu harmonisieren.
  naturalness: „In ihnen ist nichts verdreht oder verkehrt“ ist modernes, idiomatisches Standarddeutsch und klingt im poetisch-weisheitlichen Register klar.
  terminology: „Gerecht“ ist für צֶדֶק hier treffend. „Verdreht“ und „verkehrt“ geben die Bild- und Wertungssprache der beiden hebräischen Ausdrücke angemessen wieder.
  issues:
