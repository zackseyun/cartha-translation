  text: בְּ/צֶ֥דֶק כָּל אִמְרֵי פִ֑/י אֵ֥ין בָּ֝/הֶ֗ם נִפְתָּ֥ל וְ/עִקֵּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/008.yaml
  text: All the words of my mouth are righteous[a]; there is nothing twisted or crooked in them.
translation:
  language: de
  text: Alle Worte meines Mundes sind gerecht; in ihnen ist nichts verdreht oder verkehrt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: sind gerecht
  rationale: Die Präpositionalverbindung bezeichnet hier die sittliche Beschaffenheit der Worte. „Sind gerecht“ gibt dies im Deutschen natürlich und prägnant wieder; das formalere „sind in Gerechtigkeit“ wäre unidiomatisch.
- source_word: כָּל אִמְרֵי פִי
  choice: Alle Worte meines Mundes
  rationale: Die Wiedergabe bewahrt sowohl den umfassenden Sinn von כָּל als auch das konkrete hebräische Bild vom Mund der personifizierten Weisheit.
- source_word: אֵין בָּהֶם
  choice: nichts an ihnen ist
  rationale: Diese Formulierung gibt die hebräische Existenzverneinung mit dem rückbezüglichen Pronomen in natürlichem modernem Deutsch wieder.
- source_word: נִפְתָּל
  choice: verdreht
  rationale: Das Wort bezeichnet etwas Verdrehtes, Gewundenes oder Hinterhältiges. „Verdreht“ bewahrt die anschauliche Metapher und ist allgemein verständlich.
- source_word: וְעִקֵּשׁ
  choice: oder verkehrt
  rationale: עִקֵּשׁ bezeichnet etwas Krummes, Verkehrtes oder moralisch Falsches. Im Deutschen ist bei einer Verneinung die Verbindung „weder/… oder“ beziehungsweise „nichts … verdreht oder verkehrt“ idiomatisch und gibt die beiden eng verwandten hebräischen Begriffe klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Redeweise „Worte meines Mundes“ bleibt erhalten; die beiden moralisch-räumlichen Metaphern des Hebräischen werden als „verdreht oder verkehrt“ wiedergegeben.
