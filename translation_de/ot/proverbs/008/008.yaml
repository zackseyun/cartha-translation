    issue: „an ihnen“ statt „in ihnen“
    rationale: Das hebräische בָהֶם bedeutet hier „in ihnen“. „An ihnen“ ist im Deutschen zwar verständlich, kann aber eher „an/über sie“ als die im Text ausgedrückte innere Beschaffenheit nahelegen.
