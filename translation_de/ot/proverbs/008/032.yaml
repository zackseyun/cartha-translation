id: PRO.8.32
reference: Proverbs 8:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ֝/אַשְׁרֵ֗י דְּרָכַ֥/י יִשְׁמֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/032.yaml
  text: And now[a], sons, listen to me; blessed are those who keep my ways.
translation:
  language: de
  text: Und nun, ihr Söhne[a], hört auf mich! Glücklich sind alle, die meine Wege bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Kinder“. Im Hebräischen steht „Söhne“, eine in der Weisheitsunterweisung typische maskuline Pluralform; die Aufforderung gilt jedoch allgemein.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Verbindung aus Konjunktion und Zeitadverb markiert einen Übergang und leitet die folgende Mahnung ein. „Und nun“ bewahrt diesen Zusammenhang.
- source_word: בָנִים
  choice: ihr Söhne
  rationale: Das hebräische Wort ist ein maskuliner Plural und dient in der Weisheitsliteratur als übliche Anrede für Schüler. „Ihr“ macht die deutsche Anrede idiomatisch, ohne das im Hebräischen nicht ausdrücklich vorhandene „meine“ hinzuzufügen.
- source_word: שִׁמְעוּ לִי
  choice: hört auf mich
  rationale: Die Wendung bezeichnet aufmerksames, auf die Sprecherin gerichtetes Hören und schließt die Aufforderung ein, ihrer Weisung zu folgen, ohne dies einseitig auf bloßen Gehorsam zu verengen.
- source_word: וְאַשְׁרֵי
  choice: Glücklich sind alle
  rationale: אַשְׁרֵי spricht Menschen einen begünstigten, gelingenden Zustand zu. Die Formulierung ist in modernem Deutsch verständlich und gibt die Seligpreisung natürlich wieder.
- source_word: דְּרָכַי
  choice: meine Wege
  rationale: „Wege“ bezeichnet hier bildhaft die Lebensführung und die von der Weisheit gelehrte Ausrichtung.
- source_word: יִשְׁמֹרוּ
  choice: bewahren
  rationale: Das Verb kann „bewachen“, „bewahren“ oder „beachten“ bedeuten. „Bewahren“ hält sowohl die sorgfältige Beachtung als auch die praktische Treue zu den Wegen der Weisheit fest.
theological_decisions:
- issue: Geschlechtsspezifische Anrede in der Weisheitsunterweisung
  choice: Söhne
  alternative: Kinder
  rationale: Der Haupttext wahrt die maskuline Pluralform und die herkömmliche Lehrer-Schüler-Anrede des Sprüchebuchs. Die Fußnote nennt die weiter gefasste Wiedergabe, da die Weisung ihrer Aussage nach nicht auf männliche Hörer beschränkt ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und der Ausruf bewahren den mahnenden Ton; „meine Wege bewahren“ lässt die weisheitliche Bildsprache stehen.
