  yaml_path: translation/ot/proverbs/008/006.yaml
  text: Listen[a], for I will speak noble things[b], and the opening of my lips will be upright things.
translation:
  language: de
  text: Hört zu, denn ich werde Edles sprechen[a], und beim Öffnen meiner Lippen äußere ich Aufrichtiges[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vortreffliches“. Das hebräische Wort steht mit dem Fürstlichen oder Vornehmen in Verbindung und bezeichnet hier Worte von hohem Wert.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Geradheiten“; oder: „was gerade ist“. Gemeint ist das, was moralisch gerade und richtig ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der pluralische Imperativ ruft die Angesprochenen zu aufmerksamem Hören auf; „Hört“ ist knapp, natürlich und würdig.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die Aufforderung zum Hören und wird im Deutschen prägnant durch „denn“ wiedergegeben.
- source_word: נְגִידִים
  choice: edle Dinge
  rationale: Das Wort ist mit dem Bereich des Fürstlichen und Vornehmen verbunden und bezeichnet hier im poetischen Zusammenhang Aussagen von hohem Wert. „Edle Dinge“ bewahrt diese Konnotation, ohne Personen als Referenz anzunehmen.
- source_word: אֲדַבֵּר
  choice: ich rede
  rationale: Das Imperfekt bezeichnet hier die unmittelbar angekündigte Rede. Das deutsche Präsens ist nach der Aufforderung idiomatisch und kann den bevorstehenden Sprechakt natürlich ausdrücken.
- source_word: וּמִפְתַּח שְׂפָתַי
  choice: und wenn ich meine Lippen öffne
  rationale: Die hebräische Nominalfügung bedeutet wörtlich „und das Öffnen meiner Lippen“. Die verbale Wiedergabe erhält das Lippenbild und klingt zugleich in modernem Deutsch natürlich.
- source_word: מֵישָׁרִים
  choice: was recht ist
  rationale: Der Plural bezeichnet Geradheit beziehungsweise moralische Richtigkeit. „Was recht ist“ gibt den Sinn idiomatisch wieder und wahrt den ethischen Gehalt.
