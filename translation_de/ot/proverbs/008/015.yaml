  text: בִּ֭/י מְלָכִ֣ים יִמְלֹ֑כוּ וְ֝/רוֹזְנִ֗ים יְחֹ֣קְקוּ צֶֽדֶק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/015.yaml
  text: By me kings reign[b][a], and rulers decree justice.
translation:
  language: de
  text: Durch mich[a] regieren Könige, und Fürsten[b] setzen fest, was recht ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Mit meiner Hilfe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Machthaber; auch: Würdenträger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Durch mich
  rationale: Die Präposition ב mit Suffix bezeichnet hier in der Rede der personifizierten Weisheit am ehesten Mittel oder Vermittlung. »Durch mich« ist im Deutschen natürlich und wahrt diesen instrumentalen Sinn.
- source_word: מְלָכִים
  choice: Könige
  rationale: Die übliche und direkte Wiedergabe der Bezeichnung für monarchische Herrscher.
- source_word: יִמְלֹכוּ
  choice: regieren
  rationale: Das Verb מלך bezeichnet die Ausübung königlicher Herrschaft. »Regieren« ist gegenwärtiges Standarddeutsch und erhält im Zusammenhang mit »Könige« den königlichen Bezug.
- source_word: וְרֹזְנִים
  choice: und Würdenträger
  rationale: רֹזְנִים bezeichnet hochgestellte Amtsträger oder Machthaber. »Würdenträger« bildet die gesellschaftlich-politische Stellung ab, ohne sie vorschnell mit modernen Regierungsämtern gleichzusetzen.
- source_word: יְחֹקְקוּ
  choice: setzen fest
  rationale: חקק meint hier das autoritative Festsetzen oder Erlassen einer Regel. »Setzen fest« verbindet sich im Deutschen natürlich mit dem folgenden inhaltlichen Objektsatz und vermeidet die Ergänzung eines im Hebräischen nicht ausdrücklich genannten Wortes wie »Gesetze«.
- source_word: צֶדֶק
  choice: was recht ist
  rationale: צֶדֶק kann Recht, Gerechtigkeit oder das Rechte bezeichnen. Nach »setzen fest« gibt »was recht ist« den rechtlich-ethischen Sinn idiomatisch wieder und bewahrt die Aussage, dass der festgesetzte Inhalt gerecht sein soll.
theological_decisions:
- issue: Ob der Vers jede bestehende politische Herrschaft unterschiedslos als durch die Weisheit legitimiert darstellt
  choice: Die Weisheit wird als Grundlage beziehungsweise Mittel rechter Herrschaft und gerechter Rechtsetzung bezeichnet.
  alternative: Der Vers könnte als pauschale göttliche Legitimation aller tatsächlichen Herrscher und ihrer Entscheidungen verstanden werden.
  rationale: Der Parallelismus verbindet das Regieren der Könige mit dem Festsetzen dessen, was recht ist. Die Übersetzung lässt den umfassenden Anspruch der Weisheit stehen, behauptet aber nicht zusätzlich, jede konkrete Herrschaftsausübung sei automatisch gerecht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Parallelismus des hebräischen Verses bleibt erhalten; »was recht ist« macht die Verbindung von Recht und Gerechtigkeit verständlich, ohne sie auf ein modernes Gesetzgebungsverfahren einzuengen.
