  text: לְ/הַנְחִ֖יל אֹהֲבַ֥/י יֵ֑שׁ וְ/אֹצְרֹ֖תֵי/הֶ֣ם אֲמַלֵּֽא׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/021.yaml
  text: to endow those who love me with wealth[a], and to fill their treasuries.
translation:
  language: de
  text: um denen, die mich lieben, Besitz als Erbe zu geben und ihre Vorratskammern zu füllen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַנְחִיל
  choice: zu vererben
  rationale: Der Hifil-Infinitiv von נחל bezeichnet, jemanden etwas erben beziehungsweise als Erbbesitz empfangen zu lassen. „Zu vererben“ ist im Deutschen knapp und wahrt das Erbmotiv.
- source_word: אֹהֲבַי
  choice: denen, die mich lieben
  rationale: Das Partizip mit Suffix bezeichnet Menschen, die die personifizierte Weisheit lieben; die gewählte Formulierung ist natürlich und präzise.
- source_word: יֵשׁ
  choice: Besitz
  rationale: יֵשׁ kann hier das bezeichnen, was Bestand hat beziehungsweise als wirkliches Gut vorhanden ist. Im Parallelismus mit den Vorratskammern liegt konkreter Besitz nahe, ohne ausschließlich Geldreichtum zu behaupten.
- source_word: וְאֹצְרֹתֵיהֶם
  choice: und ihre Vorratskammern
  rationale: אוֹצָר kann einen Vorratsraum, ein Lager oder eine Schatzkammer bezeichnen. „Vorratskammern“ erhält das konkrete Bild und passt idiomatisch zum Füllen.
- source_word: אֲמַלֵּא
  choice: zu füllen
  rationale: Die finite Piel-Form bedeutet wörtlich „ich werde füllen“ beziehungsweise „ich fülle“. Als koordinierte Fortsetzung des einleitenden Infinitivs ist „zu füllen“ im Deutschen syntaktisch natürlich.
theological_decisions:
- issue: Art der von der personifizierten Weisheit verheißenen Güter
  choice: Die konkrete Bildsprache von Besitz und gefüllten Vorratskammern bleibt erhalten.
  alternative: Abstrakte Wiedergaben wie „wahre Reichtümer“ oder „bleibende Werte“.
  rationale: Der Parallelismus legt substanzielle beziehungsweise materielle Güter nahe. Die Übersetzung bewahrt dieses Bild, macht daraus aber weder eine uneingeschränkte Wohlstandszusage noch eine rein geistliche Verheißung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erbvorstellung des Verbs und das konkrete Speicherbild des Parallelismus werden bewahrt; die ungewöhnliche Bedeutungsbreite von יֵשׁ wird durch eine Fußnote offengehalten.
