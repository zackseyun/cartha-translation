  source_fidelity: 'Der Sinn ist im Wesentlichen getroffen: Die personifizierte Weisheit gewährt ihren Liebenden substanzielle Güter und füllt ihre Speicher. „Zu vererben“ kann jedoch im heutigen Deutsch leicht speziell ein testamentarisches Vererben meinen und gibt den Hifil von נחל („erben lassen“, „als Erbe geben“) weniger unmittelbar wieder.'
  naturalness: Der Vers ist flüssig. „Besitz als Erbe zu geben“ bewahrt das Erbmotiv klarer und bleibt in modernem, würdigem Deutsch natürlich. „Vorratskammern“ ist als konkretes Bild für אֹצְרוֹת passend.
  terminology: „Besitz“ ist für יֵשׁ möglich; die Fußnote sollte die naheliegenden Alternativen „Vermögen“ und „Habe“ nennen, ohne die hier irreführende Existenzbedeutung („was wirklich vorhanden ist“) in den Vordergrund zu stellen.
