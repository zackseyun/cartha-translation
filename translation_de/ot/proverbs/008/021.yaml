    rationale: Das hebräische Verb bezeichnet hier, jemanden erben zu lassen oder ihm etwas als Erbe beziehungsweise Besitz zu geben. Die deutsche Formulierung kann unnötig an eine letztwillige Verfügung denken lassen.
  - severity: low
    issue: Die Fußnote führt eine zu wörtliche Existenzbedeutung von יֵשׁ an.
    rationale: Im vorliegenden poetischen Zusammenhang mit den gefüllten Vorratskammern bezeichnet יֵשׁ substantielle Güter beziehungsweise Vermögen. „Was wirklich vorhanden ist“ ist als deutsche Alternative hier nicht natürlich und erklärt die Stelle weniger treffend.
  revised_text: um denen, die mich lieben, Besitz als Erbe zu geben und ihre Vorratskammern zu füllen.
