  source_fidelity: 'Der Vers ist im Wesentlichen treffend wiedergegeben: כִּי begründet die vorausgehende Aussage, מֹצְאִי bezeichnet generisch denjenigen, der die personifizierte Weisheit findet, und חַיִּים ist idiomatisch „Leben“. Die Präposition מִן in מֵיְהוָה kennzeichnet jedoch die Herkunft der רָצוֹן; „bei Jahwe“ verschiebt dies leicht hin zu „in Jahwes Augen“.'
