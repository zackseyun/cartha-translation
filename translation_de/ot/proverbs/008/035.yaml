source:
  edition: WLC
  text: כִּ֣י מֹ֭צְאִ/י מצאי חַיִּ֑ים וַ/יָּ֥פֶק רָ֝צ֗וֹן מֵ/יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/035.yaml
  text: For whoever finds me finds life and obtains favor from Yahweh.
translation:
  language: de
  text: Denn wer mich findet, findet Leben und erlangt Gunst von Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Mahnung ein und entspricht dem hebräischen Zusammenhang in natürlichem Deutsch.
- source_word: מֹצְאִי
  choice: wer mich findet
  rationale: Die substantivierte Form mit Suffix bezeichnet generisch die Person, die die personifizierte Weisheit findet; „wer“ gibt dies geschlechtsübergreifend und idiomatisch wieder.
- source_word: חַיִּים
  choice: Leben
  rationale: Der formal plurale Ausdruck bezeichnet idiomatisch das Leben und wird daher im Deutschen im Singular wiedergegeben.
- source_word: וַיָּפֶק
  choice: erlangt
  rationale: Das Verb kann „hervorbringen“ oder „erlangen“ bedeuten; mit göttlichem Wohlgefallen bezeichnet es hier passend dessen Erlangung, ohne den Empfangscharakter auszuschließen.
- source_word: רָצוֹן
  choice: Wohlgefallen
  rationale: Das Wort kann Gunst, Wohlwollen oder Annahme bezeichnen. „Wohlgefallen“ bewahrt sowohl die positive Haltung Jahwes als auch den Gedanken göttlicher Anerkennung.
- source_word: מֵיְהוָה
  choice: bei Jahwe
  rationale: Hebräisches מִן kann bei Verben des Erlangens die Quelle bezeichnen; idiomatisches Deutsch sagt „Wohlgefallen bei jemandem erlangen“. Der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Generischer Singular im Zusammenhang der personifizierten Weisheit
  choice: wer mich findet
  alternative: der mich Findende / wer immer mich findet
  rationale: Die Form ist allgemein und nicht auf Männer beschränkt. „Wer“ erhält diese universale Aussage in natürlichem Deutsch.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen Gottes; „Jahwe“ macht diesen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von menschlichem Finden und göttlichem Wohlgefallen
  choice: erlangt Wohlgefallen bei Jahwe
  alternative: empfängt Gunst von Jahwe
  rationale: Die Formulierung bewahrt die Aussage, dass das Finden der Weisheit mit göttlicher Anerkennung verbunden ist, ohne genauer festzulegen, wie menschliches Handeln und göttliche Zuwendung zueinander stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, sprichwortartiger Parallelstruktur. „Wohlgefallen“ ist leicht gehoben, aber verständlich und entspricht dem weisheitlichen Ton.
