  terminology: Die Begriffe sind präzise und konsistent. „Meine Frucht“ bewahrt das Bildfeld, während „mein Ertrag“ die parallele, weiter gefasste Bedeutung von תְּבוּאָה natürlich abbildet. Es sind keine Fußnoten erforderlich.
