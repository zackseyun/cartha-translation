source:
  edition: WLC
  text: ט֣וֹב פִּ֭רְיִ/י מֵ/חָר֣וּץ וּ/מִ/פָּ֑ז וּ֝/תְבוּאָתִ֗/י מִ/כֶּ֥סֶף נִבְחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/019.yaml
  text: My fruit is better than gold[a], even fine gold, and my yield than choice silver.
translation:
  language: de
  text: Meine Frucht ist besser als Gold, ja, als Feingold, und mein Ertrag besser als erlesenes Silber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: besser als
  rationale: Das prädikative Adjektiv טוֹב erhält durch die Vergleichspartikel מִן komparative Bedeutung.
- source_word: פִּרְיִי
  choice: meine Frucht
  rationale: „Frucht“ bewahrt das anschauliche Bild für das, was die Weisheit hervorbringt.
- source_word: חָרוּץ
  choice: Gold
  rationale: חָרוּץ bezeichnet hier Gold allgemein; die schlichte Wiedergabe lässt die folgende Steigerung zu פָּז hervortreten.
- source_word: פָּז
  choice: Feingold
  rationale: פָּז bezeichnet besonders hochwertiges oder reines Gold; „Feingold“ gibt diese Qualitätssteigerung knapp und idiomatisch wieder.
- source_word: תְבוּאָתִי
  choice: mein Ertrag
  rationale: תְּבוּאָה kann Ertrag, Ernte oder Einkünfte bezeichnen. „Ertrag“ passt zum Parallelismus mit „Frucht“ und bewahrt zugleich die weitere Bedeutung dessen, was Weisheit einbringt.
- source_word: כֶּסֶף נִבְחָר
  choice: erlesenes Silber
  rationale: נִבְחָר bedeutet „ausgewählt“ beziehungsweise „auserlesen“ und kennzeichnet Silber von besonderer Qualität.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das wiederholte „besser als“ macht den hebräischen Vergleich in beiden parallelen Satzhälften eindeutig; „ja“ gibt die steigernde Wirkung der zweiten Goldbezeichnung natürlich wieder.
