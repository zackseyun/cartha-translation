  source_fidelity: 'Die Übersetzung gibt den hebräischen Parallelismus und die beiden Komparative zutreffend wieder: „Frucht“ (פְּרִי) und „Ertrag“ (תְּבוּאָה) sind angemessen unterschieden; Gold/Feingold sowie erlesenes Silber entsprechen den Wertbegriffen חָרוּץ, פָּז und כֶּסֶף נִבְחָר. Das in der zweiten Satzhälfte ergänzte „besser“ ist im Deutschen zur klaren Ausformulierung des elliptischen Vergleichs sachgerecht.'
