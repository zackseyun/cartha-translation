translation:
  language: de
  text: Ich spielte auf dem Erdkreis seiner Erde[a] und hatte meine Freude an den Menschenkindern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der bewohnten Welt seiner Erde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Söhne des Menschen“; gemeint sind Menschen allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֶקֶת
  choice: Ich freute mich
  rationale: Das Partizip bezeichnet hier die lebhafte, freudige Tätigkeit der personifizierten Weisheit. „Sich freuen“ gibt den poetischen Zusammenhang natürlich wieder, ohne den möglichen spielerischen Beiklang völlig auszuschließen.
- source_word: בְּתֵבֵל
  choice: auf dem Erdkreis
  rationale: תֵבֵל bezeichnet die geordnete beziehungsweise bewohnte Welt. „Erdkreis“ wahrt den gehobenen poetischen Klang und unterscheidet den Ausdruck vom folgenden אֶרֶץ.
- source_word: אַרְצוֹ
  choice: seiner Erde
  rationale: Der maskuline Singularsuffix wird ausdrücklich als „seiner“ wiedergegeben; im Schöpfungszusammenhang ist „Erde“ gegenüber „Land“ vorzuziehen.
- source_word: וְשַׁעֲשֻׁעַי
  choice: und hatte meine Freude
  rationale: Der formal pluralische Ausdruck „meine Freuden“ hat hier wahrscheinlich verstärkende beziehungsweise abstrakte Bedeutung. Die idiomatische deutsche Wendung bewahrt den Sinn.
- source_word: בְּנֵי אָדָם
  choice: Menschenkinder
  rationale: „Menschenkinder“ bildet die hebräische Wendung wörtlich und zugleich verständlich ab; gemeint sind die Menschen insgesamt.
theological_decisions:
- issue: Die freudige Tätigkeit der personifizierten Weisheit wiedergeben, ohne eine spätere christologische Identifizierung in den Wortlaut einzutragen
  choice: Die weibliche Ich-Stimme der personifizierten Weisheit bleibt im Zusammenhang gewahrt; der Vers beschreibt ihre Freude an der Schöpfung und an den Menschen.
  alternative: Den Wortlaut so zu gestalten, dass die Weisheit ausdrücklich mit dem präexistenten Sohn gleichgesetzt wird.
  rationale: Der hebräische Text spricht poetisch von personifizierter Weisheit. Eine typologische oder kanonische christologische Lesart bleibt möglich, wird aber nicht in die Übersetzung selbst eingebaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Ton. Die auffällige Verbindung „Erdkreis seiner Erde“ bleibt erhalten, weil sie die beiden hebräischen Begriffe תֵבֵל und אֶרֶץ unterscheidet. „Menschenkinder“ ist traditionell klingend, aber weiterhin allgemein verständlich.
