  source_fidelity: 'Die Übersetzung gibt die drei zeitlichen Bestimmungen des Hebräischen angemessen wieder: מֵעוֹלָם als „Von Ewigkeit her“, מֵרֹאשׁ als „von Anfang an“ und מִקַּדְמֵי אָרֶץ mit dem klar vorweltlichen Sinn „ehe die Erde war“. „wurde ich eingesetzt“ ist für das umstrittene נִסַּכְתִּי eine gut vertretbare, nicht überdeutende Wiedergabe.'
  naturalness: Der Satz ist idiomatisches, würdevolles modernes Standarddeutsch. Die Wiederholung der Zeitangaben bewahrt die rhetorische Steigerung des hebräischen Verses, ohne im Deutschen unverständlich zu wirken.
