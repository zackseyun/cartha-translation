id: PRO.8.23
reference: Proverbs 8:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מֵ֭/עוֹלָם נִסַּ֥כְתִּי מֵ/רֹ֗אשׁ מִ/קַּדְמֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/023.yaml
  text: From everlasting I was established[a], from the beginning, from before the earth.
translation:
  language: de
  text: Von Ewigkeit her wurde ich eingesetzt[a], von Anfang an, ehe die Erde war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde ich aufgestellt«. Das hebräische Verb ist umstritten und wurde auch als »wurde ich in mein Amt eingesetzt« oder – hier weniger wahrscheinlich – »wurde ich gesalbt« verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  choice: Von Ewigkeit her
  rationale: עוֹלָם kann ferne Vorzeit oder Ewigkeit bezeichnen. Im Zusammenhang der Schöpfung, die erst anschließend beschrieben wird, wahrt „von Ewigkeit her“ den umfassenden zeitlichen Horizont und den gehobenen Ton.
- source_word: נִסַּכְתִּי
  choice: wurde ich eingesetzt
  rationale: Die Bedeutung des Niphal von נסך ist hier umstritten. „Eingesetzt“ gibt in natürlichem Deutsch wieder, dass die personifizierte Weisheit vor der Schöpfung ihre Stellung erhielt, ohne die weniger wahrscheinliche und theologisch stärker besetzte Deutung „gesalbt“ in den Haupttext aufzunehmen.
- source_word: מֵרֹאשׁ
  choice: von Anfang an
  rationale: רֹאשׁ bezeichnet in dieser Zeitangabe den Anfang. Die Wendung ist idiomatisch und erhält die knappe Parallelstruktur.
- source_word: מִקַּדְמֵי אָרֶץ
  choice: ehe die Erde war
  rationale: Die Verbindung bezeichnet hier das zeitliche Vorausliegen gegenüber der Erde. „Ehe die Erde war“ drückt den kosmischen, vorweltlichen Sinn klar und würdig aus; „Erde“ ist in diesem Kontext passender als „Land“.
theological_decisions:
- issue: Mögliche christologische Überdeutung der personifizierten Weisheit
  choice: Die Weisheit spricht in ihrem unmittelbaren literarischen Zusammenhang von ihrer Einsetzung vor der Schöpfung; es wird keine ausdrücklich messianische oder trinitarische Terminologie ergänzt.
  alternative: נִסַּכְתִּי mit „wurde ich gesalbt“ wiederzugeben, was eine messianische Lesart nahelegen könnte.
  rationale: Eine christologische oder typologische Auslegung ist traditionsgeschichtlich möglich, wird aber vom hebräischen Wortlaut dieses Verses nicht eindeutig verlangt. Die Übersetzung soll daher die unmittelbare Aussage bewahren, ohne eine spätere dogmatische Identifikation festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige zeitliche Steigerung des Hebräischen bleibt erhalten; die leicht erklärende Formulierung „ehe die Erde war“ macht die vorweltliche Aussage natürlich verständlich.
