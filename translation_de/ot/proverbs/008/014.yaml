  text: לִֽ/י עֵ֭צָה וְ/תוּשִׁיָּ֑ה אֲנִ֥י בִ֝ינָ֗ה לִ֣/י גְבוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/014.yaml
  text: Counsel and sound wisdom are mine[a]; I am understanding; strength is mine.
translation:
  language: de
  text: Bei mir sind Rat und wirksame Weisheit[a]; ich bin Einsicht, bei mir ist Stärke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „umsichtige Tatkraft“; das hebräische Wort bezeichnet solide, praktisch wirksame Weisheit oder Tüchtigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵצָה
  choice: Rat
  rationale: „Rat“ bezeichnet hier kundige, kluge Beratung und passt zum würdevollen Reden der personifizierten Weisheit.
- source_word: תוּשִׁיָּה
  choice: wirksame Weisheit
  rationale: Das seltene Substantiv kann solide, praktisch erfolgreiche Weisheit oder Tüchtigkeit bezeichnen. „Wirksame Weisheit“ bewahrt sowohl den Weisheitsbezug als auch den Gedanken praktischer Wirksamkeit.
- source_word: אֲנִי בִינָה
  choice: ich bin Einsicht
  rationale: Der verblosen Identifikationssatz stellt Weisheit nicht nur als Besitzerin, sondern als Verkörperung der Einsicht dar.
- source_word: גְּבוּרָה
  choice: Stärke
  rationale: „Stärke“ gibt die breite Bedeutung wieder, ohne den Ausdruck unnötig auf militärische Macht oder Tapferkeit einzuengen.
- source_word: לִי ... לִי
  choice: Bei mir sind ... bei mir ist
  rationale: Die Wiederholung bildet das zweimalige לִי ab und drückt Zugehörigkeit beziehungsweise Verfügbarkeit aus, ohne im Deutschen die unnatürlichere Formulierung „sind mein“ zu verwenden.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Die Weisheit spricht weiterhin in der ersten Person und bezeichnet sich selbst als Einsicht.
  alternative: Die Aussage in der Übersetzung unmittelbar christologisch deuten.
  rationale: Der hebräische Text stellt die Weisheit literarisch als sprechende Person dar, identifiziert sie hier aber nicht ausdrücklich mit einer späteren theologischen Gestalt. Die Übersetzung lässt diese weiterführende Deutungsfrage offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wiederholung „bei mir“ erhält den poetischen Nachdruck des Hebräischen; „ich bin Einsicht“ bewahrt die markante Identifikation der personifizierten Weisheit.
