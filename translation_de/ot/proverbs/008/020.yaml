  text: I walk in the way of righteousness[a], in the midst of the paths of justice,
translation:
  language: de
  text: Ich gehe auf dem Weg der Gerechtigkeit[a], inmitten der Pfade des Rechts,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem Weg des rechten Handelns … inmitten der Pfade der Gerechtigkeit“. Die Bedeutungsbereiche der hebräischen Wörter צְדָקָה und מִשְׁפָּט überschneiden sich; der Haupttext gibt ihre poetische Unterscheidung mit „Gerechtigkeit“ und „Recht“ wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אֹרַח
  choice: auf dem Weg
  rationale: אֹרַח bezeichnet einen Weg, Pfad oder Lebensweg. „Auf dem Weg“ gibt das räumliche Bild natürlich wieder und bewahrt zugleich seine ethische Bedeutung in der Weisheitsliteratur.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: צְדָקָה kann Gerechtigkeit, Rechtschaffenheit oder das rechte Handeln bezeichnen. „Gerechtigkeit“ ist im Deutschen verständlich und würdevoll; zusammen mit „Recht“ bewahrt es die poetische, wenn auch semantisch überlappende Unterscheidung der beiden hebräischen Begriffe.
- source_word: אֲהַלֵּך
  choice: ich gehe
  rationale: Die Verbform bezeichnet hier fortgesetzte Bewegung beziehungsweise Lebensführung. „Ich gehe“ erhält das Wegbild, ohne die übertragene Bedeutung ausdrücklich auszudeuten.
- source_word: בְּ/תוֹךְ
  choice: mitten auf
  rationale: תּוֹךְ bezeichnet die Mitte oder das Innere. In Verbindung mit Wegen ist „mitten auf“ idiomatisches Deutsch und erhält die räumliche Bildsprache.
- source_word: נְתִיבוֹת
  choice: den Pfaden
  rationale: נְתִיבוֹת bezeichnet Pfade oder gebahnte Wege. „Pfade“ bildet eine natürliche poetische Parallele zu „Weg“.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: מִשְׁפָּט kann Recht, gerechtes Urteil oder Rechtsprechung bedeuten. „Recht“ gibt hier knapp den ethisch-rechtlichen Sinn wieder und bleibt von „Gerechtigkeit“ unterscheidbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Leitbild des Gehens auf einem moralischen Weg bleibt erhalten; „Weg“ und „Pfade“ sowie „Gerechtigkeit“ und „Recht“ bilden die hebräischen Parallelismen ab. Das abschließende Komma wahrt den syntaktischen Anschluss an Vers 21.
