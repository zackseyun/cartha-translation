source:
  edition: WLC
  text: עַד לֹ֣א עָ֭שָׂה אֶ֣רֶץ וְ/חוּצ֑וֹת וְ֝/רֹ֗אשׁ עָפְר֥וֹת תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/026.yaml
  text: before he had made the earth and the fields[b][a], or the first of the dust of the world.
translation:
  language: de
  text: bevor er die Erde, die offenen Flächen[a] und den ersten Staub der Welt[b] geschaffen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das offene Land“ oder „die freien Flächen“. Das hebräische Wort kann in einem städtischen Zusammenhang auch „Straßen“ bedeuten; hier spricht der Schöpfungszusammenhang für offene, nichtstädtische Flächen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Anfang des Staubes der Welt“. Die hebräische Wendung ist knapp und ungewöhnlich; sie kann den frühesten Staub oder Erdboden der Welt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד לֹא
  choice: bevor … geschaffen hatte
  rationale: Die Verbindung bezeichnet hier zeitliche Priorität. Im Deutschen gibt „bevor“ mit Plusquamperfekt den Sinn im Schöpfungszusammenhang natürlich wieder.
- source_word: עָשָׂה
  choice: geschaffen hatte
  rationale: Das Verb bedeutet allgemein „machen, tun“. Wegen des Schöpfungszusammenhangs ist „schaffen“ idiomatisch, ohne eine speziellere Art des Formens vorauszusetzen.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Die Parallele zu תֵּבֵל und der kosmische Zusammenhang sprechen für die globale Bedeutung, nicht für ein einzelnes Land.
- source_word: חוּצוֹת
  choice: das offene Land
  rationale: Das Wort kann Außenbereiche, freie Plätze oder in städtischem Zusammenhang Straßen bezeichnen. Hier legt der Schöpfungszusammenhang unbebautes, offenes Land nahe.
- source_word: רֹאשׁ
  choice: den ersten
  rationale: Im zeitlichen Zusammenhang bezeichnet רֹאשׁ wahrscheinlich den frühesten oder anfänglichen Teil. Die knappe Formulierung des Hebräischen bleibt dabei erhalten.
- source_word: עָפְרוֹת
  choice: Staub
  rationale: Der Plural von עָפָר wird hier kollektiv verstanden. „Staub“ bewahrt das Schöpfungsbild und klingt im Deutschen natürlicher als „Staubmassen“.
- source_word: תֵּבֵל
  choice: der Welt
  rationale: תֵּבֵל bezeichnet die geordnete beziehungsweise bewohnte Welt. „Welt“ ist hier klar und prägnant.
theological_decisions:
- issue: Verknüpfung der geschaffenen Größen durch וְ
  choice: und
  alternative: oder / noch
  rationale: Das wiederholte וְ verbindet die Satzglieder zunächst additiv. Eine disjunktive Wiedergabe mit „oder“ ist möglich, aber nicht erforderlich; daher bleibt die gewöhnliche Bedeutung „und“ im Haupttext stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Das offene Land“ vermeidet die im Schöpfungszusammenhang unpassende städtische Bedeutung „Straßen“. Die ungewöhnliche Wendung „den ersten Staub der Welt“ bewahrt die Kompaktheit und Spannung des Hebräischen; eine erklärende Alternative steht in der Fußnote.
