  text: בְּ/רֹאשׁ מְרוֹמִ֥ים עֲלֵי דָ֑רֶךְ בֵּ֖ית נְתִיב֣וֹת נִצָּֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/002.yaml
  text: On the heights beside the road[a], at the crossroads she takes her stand.
translation:
  language: de
  text: Oben auf den Höhen, am Weg, dort, wo die Pfade zusammentreffen[a], steht sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „im Haus der Pfade“; gemeint ist wohl die Stelle, an der Pfade zusammentreffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רֹאשׁ מְרוֹמִים
  choice: Oben auf den Höhen
  rationale: Die Verbindung bezeichnet eine hoch gelegene, weithin sichtbare Stelle. „Oben auf den Höhen“ bewahrt sowohl den Gedanken des obersten Bereichs (רֹאשׁ) als auch den der erhöhten Orte (מְרוֹמִים) und klingt im modernen Deutschen natürlich-poetisch.
- source_word: עֲלֵי דָרֶךְ
  choice: am Weg
  rationale: Die Wendung lokalisiert die Weisheit beim beziehungsweise entlang des Weges. „Am Weg“ ist knapp, idiomatisch und lässt die genaue räumliche Beziehung offen.
- source_word: בֵּית נְתִיבוֹת
  choice: dort, wo die Pfade zusammentreffen
  rationale: Wörtlich steht „Haus der Pfade“. Gemeint ist offenbar eine Stelle, an der Wege oder Pfade zusammenkommen. Die Umschreibung gibt das Bild verständlich wieder, ohne es vorschnell auf eine moderne Straßenkreuzung festzulegen.
- source_word: נִצָּבָה
  choice: stellt sie sich auf
  rationale: Die feminine Singularform bezeichnet ein bewusstes Sich-Hinstellen beziehungsweise Aufgestelltsein. „Stellt sie sich auf“ bringt die zielgerichtete Positionierung der personifizierten Weisheit zum Ausdruck.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: Das feminine „sie“ wird beibehalten.
  alternative: „Die Weisheit“ erneut nennen oder geschlechtsneutral formulieren.
  rationale: Das hebräische Verb steht im Femininum Singular und knüpft an die weiblich personifizierte Weisheit im Kontext an. Die Wiedergabe bewahrt die literarische Gestalt, ohne darüber hinausgehende theologische Aussagen festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Satzrhythmus. „Pfade“ erhält das Bild des hebräischen נְתִיבוֹת; die erläuternde Fußnote bewahrt zugleich die ungewöhnliche wörtliche Metapher „Haus der Pfade“.
