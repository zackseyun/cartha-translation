  text: when he made the skies firm above[a], when the springs of the deep grew strong[b],
translation:
  language: de
  text: als er hoch oben den Himmel[a] festigte, als die Quellen der Urflut erstarkten[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Wolken“ beziehungsweise „die Himmelsweiten“. Das hebräische Wort kann in diesem Schöpfungszusammenhang unterschiedlich weit verstanden werden.'
