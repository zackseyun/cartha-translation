lexical_decisions:
- source_word: בְּאַמְּצוֹ
  choice: als er … festigte
  rationale: Die Präposition בְּ vor dem Infinitiv bildet hier einen temporalen Nebensatz. אמץ bezeichnet das Stark- oder Festmachen; „festigte“ gibt dies im Schöpfungszusammenhang knapp und natürlich wieder.
- source_word: שְׁחָקִים
  choice: den Himmel
  rationale: Das Pluralwort kann den Himmel, die Himmelsweiten oder die Wolken bezeichnen. Der kollektive Singular „den Himmel“ ist im Deutschen natürlich und lässt den kosmischen Bezug offen.
- source_word: מִמָּעַל
  choice: hoch oben
  rationale: Die Wendung bezeichnet den Raum darüber. „Hoch oben“ gibt die räumliche Vorstellung idiomatisch wieder.
- source_word: בַּעֲזוֹז
  choice: als … erstarkten
  rationale: Die Form eröffnet einen parallelen temporalen Satz. „Erstarkten“ bewahrt die naheliegende intransitive Lesart und drückt aus, dass die Quellen kraftvoll beziehungsweise fest wurden.
- source_word: עִינוֹת
  choice: die Quellen
  rationale: עִינוֹת bezeichnet Wasserquellen oder Quellorte. „Quellen“ ist die klare, gegenwärtige deutsche Entsprechung.
- source_word: תְּהוֹם
  choice: der Urflut
  rationale: תְּהוֹם meint hier die kosmische Wassertiefe. „Urflut“ bewahrt den Schöpfungsbezug deutlicher als das allgemeinere „Tiefe“, ohne einen Eigennamen daraus zu machen.
theological_decisions:
- issue: Subjekt und Valenz von בַּעֲזוֹז
  choice: Die Quellen der Urflut erstarkten.
  alternative: Er stärkte die Quellen der Urflut.
  rationale: Der masoretische Wortlaut nennt im zweiten Halbvers kein ausdrückliches göttliches Subjekt und lässt sich am unmittelbarsten mit „Quellen“ als Subjekt lesen. Die mögliche kausative beziehungsweise auf Gottes Handeln bezogene Deutung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hoch oben“ bildet die räumliche Aussage natürlich ab; „Urflut“ bewahrt die kosmische Bildwelt. Die beiden echten Mehrdeutigkeiten werden im Haupttext nicht dogmatisch aufgelöst, sondern durch Fußnoten kenntlich gemacht.
