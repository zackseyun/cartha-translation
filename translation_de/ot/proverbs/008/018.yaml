  variant: modern standard German
source:
  edition: WLC
  text: עֹֽשֶׁר וְ/כָב֥וֹד אִתִּ֑/י ה֥וֹן עָ֝תֵ֗ק וּ/צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/018.yaml
  text: Riches and honor are with me[b][a], enduring wealth and righteousness.
translation:
  language: de
  text: Reichtum und Ehre sind bei mir, beständiges Vermögen[a] und Gerechtigkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bleibendes Vermögen«; das Adjektiv kann auch substanziellen oder dauerhaften Reichtum bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Auch im Sinn von »Rechtschaffenheit« oder »Recht«.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׁר
  choice: Reichtum
  rationale: Bezeichnet materiellen Reichtum oder Überfluss. »Reichtum« ist im Deutschen natürlich und lässt sich in der poetischen Zeile von הוֹן unterscheiden.
- source_word: כָבוֹד
  choice: Ehre
  rationale: Im weisheitlichen Zusammenhang ist vor allem gesellschaftliches Ansehen gemeint; »Ehre« passt daher besser als »Herrlichkeit«.
- source_word: אִתִּי
  choice: sind bei mir
  rationale: Das Hebräische enthält keine ausdrückliche Kopula. Im Deutschen verlangt das zusammengesetzte Subjekt »Reichtum und Ehre« die Pluralform »sind«.
- source_word: הוֹן
  choice: Vermögen
  rationale: Das Wort bezeichnet Besitz oder Wohlstand. »Vermögen« bewahrt die Bedeutungsnähe zu עֹשֶׁר, ohne dasselbe deutsche Wort zu wiederholen.
- source_word: עָתֵק
  choice: beständig
  rationale: In Verbindung mit Vermögen bezeichnet das Adjektiv wahrscheinlich etwas Dauerhaftes oder Bleibendes, möglicherweise auch etwas Substanzielles. »Beständig« gibt den naheliegenden Sinn knapp und würdig wieder.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Der Begriff umfasst sowohl moralische Rechtschaffenheit als auch gerechtes Handeln. Das deutsche »Gerechtigkeit« hält diese Bedeutungsbreite besser offen als eine enger gefasste Wiedergabe.
theological_decisions:
- issue: Bedeutungsumfang von צְדָקָה in einem moralisch geprägten weisheitlichen Kontext
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit; Recht
  rationale: Der Vers steht weder ausschließlich in einem gerichtlichen noch in einem dogmatisch-soteriologischen Zusammenhang. »Gerechtigkeit« wahrt die Spannung zwischen persönlicher Rechtschaffenheit und gerechtem Handeln; die Fußnote nennt mögliche Akzentsetzungen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Rhythmus. Die knappe Nominalreihe des Hebräischen bleibt erhalten; die semantische Überlappung von Reichtum und Vermögen wird bewusst nicht eingeebnet.
