    text: 'Oder: »Jahwe erschuf mich« oder »Jahwe erwarb mich«. Das hebräische Verb kann mehrere Bedeutungen haben. Dieser Vers spielte in historischen Debatten über die personifizierte Weisheit und ihr Verhältnis zum Sohn eine zentrale Rolle.'
