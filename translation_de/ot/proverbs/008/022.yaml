source:
  edition: WLC
  text: יְֽהוָ֗ה קָ֭נָ/נִי רֵאשִׁ֣ית דַּרְכּ֑/וֹ קֶ֖דֶם מִפְעָלָ֣י/ו מֵ/אָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/022.yaml
  text: Yahweh possessed me at the beginning of his way[a], before his works of old.
translation:
  language: de
  text: Jahwe besaß mich[a] am Anfang seines Weges, vor seinen Werken von alters her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahwe erschuf mich« oder »Jahwe erwarb mich«. Das hebräische Verb kann mehrere Bedeutungen haben. Dieser Vers spielte in historischen Debatten über die personifizierte Weisheit und ihr Verhältnis zum Sohn eine zentrale Rolle.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
- source_word: קָנָנִי
  choice: besaß mich
  rationale: קנה kann je nach Zusammenhang »erwerben«, »besitzen« oder auch »erschaffen« bedeuten. »Besaß mich« wahrt hier eine tragfähige lexikalische Möglichkeit, ohne die theologisch bedeutsame Mehrdeutigkeit zugunsten von »erschuf mich« festzulegen.
- source_word: רֵאשִׁית
  choice: am Anfang
  rationale: רֵאשִׁית bezeichnet hier in Verbindung mit dem folgenden Ausdruck den zeitlichen Anfang von Jahwes Weg beziehungsweise Wirken.
- source_word: דַּרְכּוֹ
  choice: seines Weges
  rationale: Die wörtliche und im Deutschen verständliche Wiedergabe lässt offen, ob besonders an Jahwes Handlungsweise, Wirken oder Schöpfungsgang gedacht ist.
- source_word: קֶדֶם
  choice: vor
  rationale: Im Zusammenhang drückt das Wort zeitlichen Vorrang gegenüber Jahwes Werken aus.
- source_word: מִפְעָלָיו
  choice: seinen Werken
  rationale: Der Ausdruck bezeichnet das von Gott Gewirkte oder Vollbrachte; »Werke« ist knapp und kontextgemäß.
- source_word: מֵאָז
  choice: in uralter Zeit
  rationale: Der Ausdruck verweist auf fernste Vergangenheit und wird in natürlichem modernem Deutsch wiedergegeben.
theological_decisions:
- issue: Wiedergabe von קָנָנִי in einem Vers, der in christologischen Debatten eine wichtige Rolle spielte
  choice: besaß mich
  alternative: erschuf mich; erwarb mich
  rationale: Sprüche 8 spricht unmittelbar von personifizierter Weisheit und nennt nicht ausdrücklich den Sohn. Der Haupttext legt die historische christologische Streitfrage daher nicht durch eine dogmatisch zugespitzte Wortwahl fest. Die ebenfalls möglichen Bedeutungen werden in der Fußnote transparent genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, ohne unnatürlich zu wirken; die echte lexikalische und theologische Spannung wird im Haupttext und in der Fußnote bewahrt.
