revisions:
- from: Jahwe besaß mich[a] am Anfang seines Weges, vor seinen Werken in uralter Zeit.
  to: Jahwe besaß mich[a] am Anfang seines Weges, vor seinen Werken von alters her.
  rationale: Nur die Wiedergabe der abschließenden Zeitangabe wird geringfügig angepasst. „Von alters her“ ist im Deutschen klarer an „seinen Werken“ anschließbar und bewahrt die hebräische Aussage zeitlicher Vorgängigkeit, ohne deren genaue syntaktische Nuance oder spätere theologische Deutungen festzulegen.
