  terminology: „Furcht des HERRN“, „das Böse“, „Stolz und Hochmut“ sowie „Weg des Bösen“ sind terminologisch treffend und registergerecht. Die Fußnote dokumentiert die naheliegende Alternative „verkehrter Mund“ sowie die wörtlichere Genitivstruktur, ohne die Mehrdeutigkeit unnötig einzuengen.
