source:
  edition: WLC
  text: יִֽרְאַ֣ת יְהוָה֮ שְֽׂנֹ֫את רָ֥ע גֵּ֘אָ֤ה וְ/גָא֨וֹן וְ/דֶ֣רֶךְ רָ֭ע וּ/פִ֨י תַהְפֻּכ֬וֹת שָׂנֵֽאתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/013.yaml
  text: The fear of Yahweh is to hate evil[a]; pride and arrogance and the way of evil and a mouth of perversions I hate.
translation:
  language: de
  text: 'Die Furcht des HERRN bedeutet, das Böse zu hassen: Stolz und Hochmut, den Weg des Bösen und einen Mund voll Verdrehungen[a] hasse ich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen verkehrten Mund«; wörtlich etwa: »einen Mund der Verdrehungen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: die Furcht des HERRN
  rationale: Die Konstruktverbindung bezeichnet ehrfürchtige, auf JHWH gerichtete Furcht. Der Gottesname wird nach deutscher Bibelkonvention mit HERRN wiedergegeben.
- source_word: שְׂנֹאת רָע
  choice: bedeutet, das Böse zu hassen
  rationale: Der Infinitivus constructus steht prädikativ und beschreibt, worin die Furcht des HERRN besteht. Die verbale Formulierung ist im modernen Deutsch natürlich.
- source_word: גֵּאָה וְגָאוֹן
  choice: Stolz und Hochmut
  rationale: Beide Begriffe bezeichnen selbstüberhebende Haltung; zwei verschiedene deutsche Wörter bewahren ihre Häufung und semantische Nähe.
- source_word: דֶרֶךְ רָע
  choice: den Weg des Bösen
  rationale: Die Formulierung erhält das hebräische Wegbild für eine böse Lebens- und Handlungsweise.
- source_word: פִי תַהְפֻּכוֹת
  choice: einen Mund voll Verdrehungen
  rationale: Die Wendung bewahrt das konkrete Bild des Mundes und gibt den abstrakten Plural als verdrehte, verkehrte Rede wieder, ohne ihn auf eine einzige Äußerungsform einzuengen.
- source_word: שָׂנֵאתִי
  choice: hasse ich
  rationale: Das Qal Perfekt der ersten Person Singular wird im Weisheitsspruch als gegenwärtige, allgemeingültige Aussage verstanden; die Endstellung spiegelt den Nachdruck des Hebräischen.
theological_decisions:
- issue: Sprecherperspektive im Weisheitsdiskurs
  choice: Die erste Person „ich“ bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Das Ich ausdrücklich als personifizierte Weisheit oder als Gottes Stimme kennzeichnen.
  rationale: Der hebräische Text spricht in der ersten Person, identifiziert den Sprecher in diesem Vers aber nicht neu. Die offene literarisch-theologische Spannung wird daher nicht interpretierend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem Parallelismus und Weg-Metapher. „Mund voll Verdrehungen“ ist verständlicher als eine rein formale Genitivkonstruktion, während die Fußnote die wörtlichere Struktur dokumentiert.
