  source_fidelity: Die Übersetzung gibt die prädikative Infinitivkonstruktion von יִרְאַת יְהוָה שְׂנֹאת רָע sachgerecht wieder und bewahrt die Reihung der vier verhassten Dinge. „HERRN“ entspricht der etablierten deutschen Wiedergabe des Gottesnamens. Das unbestimmte „einen Mund“ entspricht dem artikellosen hebräischen Ausdruck; das abschließende „hasse ich“ wahrt die Ich-Perspektive und den Nachdruck des Weisheitsdiskurses.
