source:
  edition: WLC
  text: הֲ/לֹֽא חָכְמָ֥ה תִקְרָ֑א וּ֝/תְבוּנָ֗ה תִּתֵּ֥ן קוֹלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/001.yaml
  text: Does not wisdom call[b][a], and understanding raise her voice?
translation:
  language: de
  text: Ruft die Weisheit nicht, und erhebt die Einsicht nicht ihre Stimme[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gibt ihre Stimme“; gemeint ist, dass sie vernehmlich spricht oder ihre Stimme erhebt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: nicht …?
  rationale: Die Verbindung leitet eine rhetorische Frage ein, die eine bejahende Antwort erwartet; die deutsche Negativfrage bewahrt diese Form.
- source_word: חָכְמָה
  choice: die Weisheit
  rationale: Dies ist die übliche und direkte Wiedergabe; der Artikel entspricht natürlichem Deutsch und unterstützt die im Kontext angelegte Personifikation.
- source_word: תִקְרָא
  choice: ruft
  rationale: Das Qal von קרא bedeutet hier „rufen“ oder „laut rufen“. „Ruft“ ist knapp, natürlich und wahrt den Parallelismus.
- source_word: וּתְבוּנָה
  choice: und die Einsicht
  rationale: תבונה bezeichnet Verständnis, Einsicht oder Urteilsvermögen. „Einsicht“ bildet mit „Weisheit“ ein natürliches deutsches Begriffspaar und bleibt semantisch nah am Hebräischen.
- source_word: תִּתֵּן קוֹלָהּ
  choice: erhebt … ihre Stimme
  rationale: Wörtlich steht „gibt ihre Stimme“; die idiomatische Wendung bezeichnet vernehmliches Sprechen. „Ihre Stimme erheben“ erhält Bild und Personifikation in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Personifikation von Weisheit und Einsicht
  choice: Die weibliche Personifikation wird durch „ihre Stimme“ bewahrt, ohne die Begriffe als Eigennamen zu markieren.
  alternative: Die Personifikation abschwächen oder „Weisheit“ durch Großschreibung als besondere Gestalt stärker theologisch identifizieren.
  rationale: Die feminine Grammatik und der literarische Zusammenhang stellen die Weisheit als öffentlich rufende Frau dar. Die Übersetzung erhält dieses Bild, legt den Vers aber nicht auf eine weitergehende dogmatische Identifikation fest.
translation_notes:
  register: Modernes, standarddeutsches und würdiges Register. Die rhetorische Frage und der poetische Parallelismus werden bewahrt; „Einsicht“ vermeidet die im Deutschen schwerfälligere Wiederholung abstrakter Bildungen.
