source:
  edition: WLC
  text: אֲ֭נִי אהבי/ה אֵהָ֑ב וּ֝/מְשַׁחֲרַ֗/י יִמְצָאֻֽ/נְנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/017.yaml
  text: I love those who love me[a], and those who seek me diligently find me.
translation:
  language: de
  text: Ich liebe die, die mich lieben, und die mich mit Eifer suchen, finden mich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und die mich früh suchen, finden mich.« Das hebräische Verb kann ein Suchen am frühen Morgen und davon abgeleitet ein eifriges oder ernsthaftes Suchen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Ich
  rationale: Das ausdrücklich gesetzte Personalpronomen steht am Satzanfang und wird zur Wahrung der Betonung wiedergegeben.
- source_word: אֹהֲבַי / אהבי/ה
  choice: die mich lieben
  rationale: Das substantivisch gebrauchte Partizip mit Suffix bedeutet wörtlich »die mich Liebenden«; der Relativsatz klingt im modernen Deutschen natürlich und bewahrt den Sinn.
- source_word: אֵהָב
  choice: liebe
  rationale: Das Qal-Imperfekt kann eine allgemeine oder wiederkehrende Aussage ausdrücken; im sprichwörtlichen Zusammenhang passt das Präsens.
- source_word: מְשַׁחֲרַי
  choice: die mich mit Eifer suchen
  rationale: Das Piel-Partizip von שׁחר kann ein frühes und davon abgeleitet ein eifriges, ernsthaftes Suchen bezeichnen. »Mit Eifer suchen« gibt die idiomatische Bedeutung klar wieder; die zeitliche Nuance wird in der Fußnote bewahrt.
- source_word: יִמְצָאֻנְנִי
  choice: finden mich
  rationale: Das Qal-Imperfekt mit Objektsuffix wird parallel zum ersten Satzteil als allgemeingültiges Präsens verstanden.
theological_decisions:
- issue: Wechselseitige Sprache von der Liebe der Weisheit
  choice: Die Aussage wird als allgemeiner Grundsatz der personifizierten Weisheit wiedergegeben.
  alternative: Die Aussage ausdrücklich auf Erwählung, Heil oder unmittelbar auf Christus beziehen.
  rationale: In Sprüche 8 spricht die Weisheit in poetischer Personifikation. Die Übersetzung bewahrt diese literarisch-theologische Spannung, ohne spätere Lehrkategorien in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst parallele Satzstruktur bleibt erhalten; »mit Eifer« ist allgemein verständlich und vermeidet eine unnötige zeitliche Verengung.
