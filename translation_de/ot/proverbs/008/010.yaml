base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/010.yaml
  text: Take my instruction instead of silver[b][a], and knowledge rather than choice gold.
translation:
  language: de
  text: Nehmt meine Unterweisung statt Silber[a] an und Erkenntnis lieber als erlesenes Gold[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und nicht Silber“. Die hebräische Gegenüberstellung fordert dazu auf, die Unterweisung der Weisheit dem Silber vorzuziehen.'
    reason: lexical_alternative
  - marker: b
    text: „Erlesenes Gold“ kann auch mit „feines Gold“ oder „ausgewähltes Gold“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: Nehmt … an
  rationale: Der Imperativ Plural von לקח fordert unmittelbar zum Annehmen auf; die deutsche Wendung „nehmt … an“ klingt im Zusammenhang mit Unterweisung natürlich.
- source_word: מוּסָרִי
  choice: meine Unterweisung
  rationale: מוּסָר bezeichnet in der Weisheitsliteratur erziehende, mitunter zurechtweisende Anleitung. „Unterweisung“ passt zum Parallelbegriff „Erkenntnis“, ohne den disziplinierenden Unterton auszuschließen.
- source_word: וְאַל כָּסֶף
  choice: statt Silber
  rationale: Nach dem Imperativ drückt וְאַל hier poetisch eine Gegenüberstellung und Bevorzugung aus. „Statt Silber“ gibt diesen Sinn knapp wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: דַעַת
  choice: Erkenntnis
  rationale: דַּעַת bezeichnet Wissen beziehungsweise Erkenntnis. „Erkenntnis“ ist im deutschen Weisheitskontext idiomatisch und bildet einen passenden Parallelismus zu „Unterweisung“.
- source_word: מֵחָרוּץ
  choice: lieber als … Gold
  rationale: חָרוּץ bezeichnet hier kostbares beziehungsweise feines Gold; die Präposition מִן markiert den Vergleich. „Lieber als“ macht die ausgesprochene Wertpräferenz deutlich.
- source_word: נִבְחָר
  choice: erlesenes
  rationale: Das passive Partizip von בחר bedeutet „ausgewählt“. „Erlesen“ ist eine natürliche attributive Bezeichnung für besonders wertvolles Gold.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knappem poetischem Parallelismus. Die direkte Anrede steht im Plural. Die Präferenzkonstruktion wird idiomatisch wiedergegeben, während die wörtlichere Form in einer Fußnote erhalten bleibt.
