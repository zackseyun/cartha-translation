source:
  edition: WLC
  text: בִּ֭/י שָׂרִ֣ים יָשֹׂ֑רוּ וּ֝/נְדִיבִ֗ים כָּל שֹׁ֥פְטֵי צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/016.yaml
  text: By me rulers rule[a], and nobles, all judges of righteousness.
translation:
  language: de
  text: Durch mich herrschen Herrscher und Edle, alle Richter, die Recht sprechen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Richter der Gerechtigkeit“. Das hebräische Wort צֶדֶק kann sowohl moralische Gerechtigkeit als auch Recht und Gerechtigkeit im richterlichen Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Durch mich
  rationale: Die Präposition ב mit Suffix bezeichnet hier in der Rede der Weisheit am ehesten Mittel oder Vermittlung. „Durch mich“ gibt diesen instrumentalen Sinn im Deutschen natürlich wieder.
- source_word: שָׂרִים
  choice: Herrscher
  rationale: Das Substantiv bezeichnet Fürsten oder hochrangige Machthaber. „Herrscher“ erfasst die ausübende Regierungsgewalt, ohne die Personen auf Königssöhne zu beschränken.
- source_word: יָשֹׂרוּ
  choice: herrschen
  rationale: Das Verb שׂרר bedeutet „herrschen, Macht ausüben“. Die Verbindung „Herrscher herrschen“ bewahrt die prägnante Wortverwandtschaft des Hebräischen und den sprichwörtlichen Klang.
- source_word: וּנְדִיבִים
  choice: und Edle
  rationale: נְדִיבִים bezeichnet hier gesellschaftlich oder politisch hochgestellte Personen. „Edle“ unterscheidet sie von den zuvor genannten Herrschern und bleibt knapp.
- source_word: כָּל
  choice: alle
  rationale: Der ausdrücklich gesetzte Quantor wird beibehalten und leitet die zusammenfassende beziehungsweise erläuternde Schlussgruppe ein.
- source_word: שֹׁפְטֵי צֶדֶק
  choice: alle Richter, die Recht sprechen
  rationale: Die hebräische Genitivverbindung wird für verständliches modernes Deutsch verbal wiedergegeben. „Recht sprechen“ wahrt den richterlichen Kontext und lässt zugleich erkennen, dass richtiges beziehungsweise gerechtes Urteilen gemeint ist.
- source_word: צֶדֶק
  choice: Recht
  rationale: Im gerichtlichen Zusammenhang bezeichnet צֶדֶק das Rechte beziehungsweise die Gerechtigkeit. „Recht“ fügt sich idiomatisch in „Recht sprechen“; die breitere ethische Bedeutung wird in der Fußnote offengehalten.
theological_decisions:
- issue: Wirksamkeit der Weisheit bei politischer und richterlicher Autorität
  choice: Der Vers sagt, dass Herrscher und Richter ihre Aufgabe durch die Weisheit recht ausüben.
  alternative: Der Vers billigt unterschiedslos jede bestehende politische Herrschaft als unmittelbar von der Weisheit eingesetzt.
  rationale: בִּי stellt die Weisheit als Mittel gelingender Herrschaft und Rechtsprechung dar. Eine weitergehende Lehre über die Legitimität jedes Machthabers wird nicht in den Text hineingelesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwörtlicher Struktur. Die bewusste Wiederholung „Herrscher … herrschen“ spiegelt die hebräische Wortverbindung; die Schlusswendung wird zugunsten natürlicher Verständlichkeit verbal formuliert.
