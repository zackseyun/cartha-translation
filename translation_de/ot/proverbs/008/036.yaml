id: PRO.8.36
reference: Proverbs 8:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְֽ֭/חֹטְאִ/י חֹמֵ֣ס נַפְשׁ֑/וֹ כָּל מְ֝שַׂנְאַ֗/י אָ֣הֲבוּ מָֽוֶת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/036.yaml
  text: But the one who sins against me wrongs his own soul[b][a]; all who hate me love death.
translation:
  language: de
  text: Wer mich aber verfehlt[a], tut seinem eigenen Leben Gewalt an[b]; alle, die mich hassen, lieben den Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen mich sündigt«. Das hebräische Verb kann sowohl »verfehlen« als auch »sündigen« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »tut seiner Seele / seinem Leben Gewalt an«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֹטְאִי
  choice: Wer mich aber verfehlt
  rationale: Das Partizip von חטא mit dem ausdrücklichen Objekt »mich« kann sowohl das Verfehlen als auch das Sündigen gegen jemanden bezeichnen. »Mich verfehlt« bewahrt das Bild und lässt die moralische Tragweite im Zusammenhang der Weisheitsrede bestehen; die Alternative wird in einer Fußnote genannt.
- source_word: חֹמֵס
  choice: tut … Gewalt an
  rationale: חמס bezeichnet Gewalt, Unrecht oder schwere Schädigung. Die deutsche Wendung »jemandem Gewalt antun« gibt die starke, konkrete Ausdrucksweise des Hebräischen wieder, ohne sie auf bloß körperliche Gewalt zu beschränken.
- source_word: נַפְשׁוֹ
  choice: seinem eigenen Leben
  rationale: נפש kann Leben, Selbst, Person oder Seele bezeichnen. »Seinem eigenen Leben« macht den selbstzerstörerischen Sinn verständlich und vermeidet eine nicht erforderliche Trennung von Körper und Seele.
- source_word: כָּל מְשַׂנְאַי
  choice: alle, die mich hassen
  rationale: Die universale Aussage und das Partizip mit dem Suffix der ersten Person werden in natürlichem Deutsch als Relativsatz wiedergegeben.
- source_word: אָהֲבוּ
  choice: lieben
  rationale: Obwohl die Form morphologisch ein Perfekt ist, drückt sie im sprichwörtlichen Parallelismus eine allgemeingültige Aussage aus; daher steht im Deutschen das Präsens.
- source_word: מָוֶת
  choice: den Tod
  rationale: Direkte Wiedergabe, die sowohl den gewöhnlichen Tod als auch den Gegensatz zum Leben in der Weisheitstheologie offenhält.
theological_decisions:
- issue: Bedeutung von חטא in Bezug auf die personifizierte Weisheit
  choice: »mich verfehlt« im Haupttext
  alternative: »gegen mich sündigt«
  rationale: Der hebräische Ausdruck trägt sowohl die Vorstellung des Verfehlens als auch die des Sündigens. Die Hauptfassung bewahrt das zugrunde liegende Bild; die Fußnote hält die ausdrücklich moralische Lesart sichtbar.
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: »seinem eigenen Leben«
  alternative: »seiner eigenen Seele« oder »sich selbst«
  rationale: Die Formulierung bezeichnet die ganze eigene Lebensexistenz und warnt vor der Selbstschädigung durch die Ablehnung der Weisheit. »Leben« vermeidet eine unnötige Festlegung auf eine bestimmte Körper-Seele-Lehre, während die wörtlichere Möglichkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe antithetische Parallelstruktur des Spruchs bleibt erhalten. »Gewalt antun« bewahrt die Schärfe des hebräischen Ausdrucks; die Fußnoten dokumentieren die echten lexikalischen Mehrdeutigkeiten.
