    issue: „am Eingang der Tore“ ist mehrdeutig und stilistisch sperrig.
    rationale: Die Singular-Plural-Verbindung legt im Deutschen nahe, dass mehrere Tore nur einen gemeinsamen Eingang hätten. Mit „Pforten“ wird die Wiederholung der räumlichen Bilder klarer und die hebräische Unterscheidung von שְׁעָרִים und פְתָחִים besser erkennbar.
