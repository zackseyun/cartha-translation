  text: לְ/יַד שְׁעָרִ֥ים לְ/פִי קָ֑רֶת מְב֖וֹא פְתָחִ֣ים תָּרֹֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/003.yaml
  text: Beside the gates[a], at the mouth of the city, at the entrance of the doorways[b], she cries out.
translation:
  language: de
  text: Neben den Toren[a], am Zugang zur Stadt, am Eingang der Pforten ruft sie laut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an der Seite der Tore“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jubelt sie“. Das hebräische Verb kann je nach Zusammenhang einen lauten Ruf oder Jubel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְיַד
  choice: Neben
  rationale: Die Verbindung mit יָד bezeichnet idiomatisch die Lage „neben“ oder „an der Seite von“; „neben“ ist im Deutschen knapp und natürlich.
- source_word: שְׁעָרִים
  choice: den Toren
  rationale: Gemeint sind die Stadttore als öffentliche Orte. Der bestimmte Artikel ergibt sich im Deutschen natürlich aus der konkreten städtischen Szenerie.
- source_word: לְפִי קָרֶת
  choice: am Zugang zur Stadt
  rationale: Wörtlich steht „am Mund der Stadt“. Im Deutschen vermittelt „am Zugang zur Stadt“ die räumliche Bedeutung klar, ohne die ungewöhnliche hebräische Metapher unverständlich nachzubilden.
- source_word: מְבוֹא פְתָחִים
  choice: am Eingang der Tore
  rationale: מְבוֹא bezeichnet den Ort des Eintretens; פְתָחִים sind Öffnungen beziehungsweise Tore. Die Formulierung bewahrt die konkrete räumliche Aussage, auch wenn die genaue Beziehung der beiden Substantive offenbleibt.
- source_word: תָּרֹנָּה
  choice: ruft sie laut
  rationale: Die Verbform beschreibt hier Weisheits weithin hörbaren öffentlichen Ruf. „Ruft laut“ gibt dies natürlich wieder, ohne einen besonderen Gefühlszustand wie bei „schreit“ festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei Ortsangaben bleiben parallel angeordnet; der öffentliche und weithin hörbare Ruf der personifizierten Weisheit wird klar wiedergegeben.
