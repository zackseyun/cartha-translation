  verdict: revise
  source_fidelity: 'Die Ortsangaben und der laute öffentliche Ruf entsprechen dem Hebräischen gut. Die Wiedergabe „am Eingang der Tore“ ist jedoch im Deutschen semantisch und syntaktisch missverständlich: Sie kann einen einzigen Eingang zu mehreren Toren meinen. מְבוֹא פְתָחִים bezeichnet weiterhin einen Eingangs-/Zugangsbereich mit Öffnungen bzw. Pforten.'
  naturalness: „Neben den Toren, am Zugang zur Stadt“ ist natürliches modernes Standarddeutsch. „Am Eingang der Pforten“ erhält die knappe, parallele Struktur und klingt dabei klarer als „am Eingang der Tore“.
  terminology: „Tore“ für שְׁעָרִים und „Pforten“ für פְתָחִים unterscheiden die beiden hebräischen Begriffe angemessen, ohne eine technische Differenz zu behaupten. „ruft sie laut“ gibt תָּרֹנָּה im Kontext treffend wieder.
  issues:
