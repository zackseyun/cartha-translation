  text: שִׁמְע֖וּ מוּסָ֥ר וַ/חֲכָ֗מוּ וְ/אַל תִּפְרָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/033.yaml
  text: Hear instruction and become wise[a], and do not neglect it.
translation:
  language: de
  text: Hört auf die Unterweisung und werdet weise; lasst sie nicht außer Acht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Weist sie nicht zurück« oder »Gebt sie nicht auf«. Das hebräische Verb kann hier bedeuten, Unterweisung preiszugeben, zurückzuweisen oder zu vernachlässigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört auf
  rationale: Der Imperativ Plural bezeichnet aufmerksames Hören, das Gehorsam einschließen kann, ohne ausdrücklich auf »gehorchen« verengt zu werden.
- source_word: מוּסָר
  choice: Unterweisung
  rationale: Das Wort bezeichnet in der Weisheitsliteratur erziehende Anleitung, Zurechtweisung und Schulung. »Unterweisung« passt zum Lehrzusammenhang und klingt weniger einseitig strafend als »Zucht«.
- source_word: וַחֲכָמוּ
  choice: und werdet weise
  rationale: Der Imperativ von חכם beschreibt hier das Erlangen von Weisheit, nicht nur einen bereits bestehenden Zustand.
- source_word: וְאַל תִּפְרָעוּ
  choice: lasst sie nicht außer Acht
  rationale: Die negative Aufforderung warnt davor, die zuvor genannte Unterweisung preiszugeben, zurückzuweisen oder zu vernachlässigen. Die idiomatische Formulierung gibt den Sinn wieder, ohne das Bedeutungsspektrum auf offene Ablehnung zu beschränken.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede im Plural und die parallelen Aufforderungen des Hebräischen bleiben erhalten; das Semikolon verdeutlicht den abschließenden warnenden Nachsatz.
