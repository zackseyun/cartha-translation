- from: Hört auf Unterweisung und werdet weise; lasst sie nicht außer Acht.[a]
  to: Hört auf die Unterweisung und werdet weise; lasst sie nicht außer Acht.[a]
  rationale: Die Revision ergänzt den im Deutschen für »auf etwas hören« notwendigen bestimmten Artikel und beseitigt dadurch eine erhebliche Mehrdeutigkeit. Die Hauptaussage bleibt eng am Hebräischen. Die Fußnote behält die lexikalische Spannweite des strittigeren Verbs bei, formuliert die zweite Alternative jedoch modern und verständlich.
