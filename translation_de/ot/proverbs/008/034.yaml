  terminology: „Mensch“ gibt die generische Reichweite von אָדָם im Deutschen angemessen wieder. „Auf mich hört“ bewahrt das Hörbild; „Türen“, „Pfosten“ und „Eingänge“ erhalten die konkreten und pluralischen architektonischen Begriffe. „Glücklich“ ist für אַשְׁרֵי als weisheitliche Seligpreisung eine mögliche, nicht dogmatisch aufgeladene Wiedergabe.
