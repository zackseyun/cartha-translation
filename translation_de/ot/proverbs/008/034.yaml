  variant: modern standard German
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי אָדָם֮ שֹׁמֵ֪עַֽ֫ לִ֥/י לִ/שְׁקֹ֣ד עַל דַּ֭לְתֹתַ/י י֤וֹם י֑וֹם לִ֝/שְׁמֹ֗ר מְזוּזֹ֥ת פְּתָחָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/034.yaml
  text: Blessed is the man who listens to me[a], watching at my doors day by day, keeping watch at the doorposts of my entrances.
translation:
  language: de
  text: Glücklich ist der Mensch, der auf mich hört, der Tag für Tag an meinen Türen wacht und an den Pfosten meiner Eingänge Wache hält.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die Wendung bezeichnet den beglückwünschenswerten, gesegneten Zustand eines Menschen. „Glücklich ist“ gibt die weisheitliche Seligpreisung im heutigen Deutsch natürlich wieder, ohne sie ausdrücklich als göttlichen Segensakt zu deuten.
- source_word: אָדָם
  choice: der Mensch
  rationale: „Mensch“ bewahrt Singular und Allgemeingültigkeit des hebräischen Ausdrucks und schränkt die Aussage nicht auf Männer ein.
- source_word: שֹׁמֵעַ לִי
  choice: der auf mich hört
  rationale: Die Form bezeichnet fortdauerndes, aufmerksames Hören auf die personifizierte Weisheit. „Auf mich hört“ lässt die mitgemeinte Bereitschaft zum Gehorsam anklingen, ohne sie an die Stelle des Hörbildes zu setzen.
- source_word: לִשְׁקֹד עַל דַּלְתֹתַי
  choice: der … an meinen Türen wacht
  rationale: Das Verb drückt wachsame, beharrliche Aufmerksamkeit aus; „wacht“ passt zum Bild des Wartens an den Türen. „An“ gibt die örtliche Bedeutung der Präposition idiomatisch wieder.
- source_word: יוֹם יוֹם
  choice: Tag für Tag
  rationale: Die Wiederholung im Hebräischen betont Regelmäßigkeit und Ausdauer; „Tag für Tag“ erhält diese iterative Wirkung.
- source_word: לִשְׁמֹר
  choice: Wache hält
  rationale: Das Verb kann bewahren, hüten oder wachen bedeuten. Hier führt „Wache hält“ das Bild des aufmerksamen Wartens fort, ohne eine defensive Bewachung festzulegen.
- source_word: מְזוּזֹת פְּתָחָי
  choice: an den Pfosten meiner Eingänge
  rationale: „Pfosten“ bewahrt das konkrete architektonische Bild, „Eingänge“ den Plural und die begriffliche Unterscheidung von den zuvor genannten Türen.
theological_decisions:
- issue: Allgemeingültige Personenbezeichnung in der weisheitlichen Seligpreisung
  choice: der Mensch
  alternative: der Mann
  rationale: אָדָם bezeichnet hier repräsentativ jeden Menschen, der auf die Weisheit hört. Das deutsche „Mensch“ gibt diese allgemeine Reichweite präzise wieder und bewahrt zugleich den Singular.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer weisheitlicher Bildsprache. Die parallelen Wachsamkeitsausdrücke „wacht“ und „Wache hält“ bilden die beiden unterschiedlichen hebräischen Verben ab, ohne die Spannung zwischen aufmerksamem Warten und beharrlichem Hüten aufzulösen.
