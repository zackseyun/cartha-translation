  variant: modern standard German
source:
  edition: WLC
  text: בְּ/טֶ֣רֶם הָרִ֣ים הָטְבָּ֑עוּ לִ/פְנֵ֖י גְבָע֣וֹת חוֹלָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/025.yaml
  text: Before the mountains were settled[a], before the hills, I was brought forth.
translation:
  language: de
  text: Noch ehe die Berge fest eingesetzt waren, noch vor den Hügeln wurde ich hervorgebracht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde ich geboren“ oder „wurde ich gezeugt“. Das Hebräische gebraucht für die personifizierte Weisheit ein Bild aus dem Bereich von Geburt und Ursprung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Noch ehe
  rationale: Die temporale Wendung bezeichnet Vorzeitigkeit. „Noch ehe“ klingt im modernen Deutschen natürlich und unterstützt den poetischen Satzbau.
- source_word: הָרִים
  choice: die Berge
  rationale: Die bestimmte Pluralform wird in diesem kosmologischen Zusammenhang angemessen mit dem bestimmten Artikel wiedergegeben.
- source_word: הָטְבָּעוּ
  choice: fest eingesetzt waren
  rationale: Der Hofal von טבע beschreibt hier wahrscheinlich, wie die Berge passiv in ihre feste Lage versetzt oder eingesenkt wurden. „Fest eingesetzt“ bewahrt das Bild der Verankerung, ohne im Deutschen unnötig technisch zu klingen.
- source_word: לִפְנֵי
  choice: noch vor
  rationale: Die Präposition ist hier temporal und steht parallel zu בְּטֶרֶם. „Noch vor“ erhält diese zeitliche und poetische Parallelität.
- source_word: גְבָעוֹת
  choice: den Hügeln
  rationale: „Hügel“ ist die übliche Wiedergabe und bildet das topografische Parallelwort zu „Berge“.
- source_word: חוֹלָלְתִּי
  choice: wurde ich hervorgebracht
  rationale: Die Form verwendet Geburts- beziehungsweise Ursprungsbildlichkeit. „Wurde ich hervorgebracht“ lässt deren genaue Ausprägung offen und vermeidet sowohl eine rein biologische als auch eine dogmatisch verengte Deutung.
theological_decisions:
- issue: Die Ursprungssprache über die personifizierte Weisheit wiedergeben, ohne spätere christologische Folgerungen in den Vers einzutragen
  choice: wurde ich hervorgebracht
  alternative: wurde ich geboren / wurde ich gezeugt
  rationale: Die gewählte Formulierung bewahrt das hebräische Bild eines Hervorgehens, entscheidet aber nicht, ob dieses im engeren Sinn als Geburt oder Zeugung zu verstehen ist. So bleibt die poetische und theologische Spannung des Textes erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Parallelität. Die Wiederholung „noch ehe … noch vor“ macht die zeitliche Struktur deutlich; „fest eingesetzt“ vermittelt die feste Einordnung der Berge in die Schöpfung.
