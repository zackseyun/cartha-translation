source:
  edition: WLC
  text: כֻּלָּ֣/ם נְ֭כֹחִים לַ/מֵּבִ֑ין וִֽ֝/ישָׁרִ֗ים לְ/מֹ֣צְאֵי דָֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/009.yaml
  text: All of them are straightforward to the one who understands[a], and upright to those who find knowledge.
translation:
  language: de
  text: Sie alle sind dem Verständigen klar[a] und denen, die Erkenntnis finden, richtig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gerade« beziehungsweise »unmittelbar«. Das hebräische Wort beschreibt die Worte der Weisheit als nicht verdreht und für einen einsichtigen Menschen klar erkennbar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Sie alle
  rationale: Das maskuline Pluralpronomen bezieht sich im unmittelbaren Zusammenhang auf die Aussprüche bzw. Worte der Weisheit (V. 6–8) und bewahrt die umfassende Aussage.
- source_word: נְכֹחִים
  choice: klar
  rationale: Das Adjektiv bezeichnet hier, auf Worte bezogen, was gerade, unmittelbar und nicht verdreht ist. „Klar“ gibt diesen Sinn in natürlichem Deutsch wieder, ohne die Aussage auf bloße Einfachheit zu verengen.
- source_word: לַמֵּבִין
  choice: für den Verständigen
  rationale: Die Präposition ל bezeichnet die Beziehung zum Wahrnehmenden; das Partizip von בין meint einen Menschen mit Einsicht und Unterscheidungsvermögen. „Für den Verständigen“ ist prägnant und im Deutschen generisch.
- source_word: וִישָׁרִים
  choice: und richtig
  rationale: יָשָׁר kann „gerade“, „recht“ oder „richtig“ bedeuten. „Richtig“ bewahrt hier die sachliche und ethische Geradheit der Worte und vermeidet eine unnatürliche Wiederholung von „gerade“.
- source_word: לְמֹצְאֵי
  choice: für alle, die … finden
  rationale: Das aktive Partizip wird als Relativsatz wiedergegeben. Das ergänzte „alle“ macht den pluralischen Personenbezug im Deutschen flüssig, ohne den Umfang der Aussage zu verändern.
- source_word: דָעַת
  choice: Erkenntnis
  rationale: „Erkenntnis“ ist eine natürliche Wiedergabe von דַּעַת in der Weisheitsliteratur und hält den Begriff vom vorhergehenden בין („verstehen/einsichtig sein“) unterscheidbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Aufbau des hebräischen Verses bleibt erhalten; „der Verständige“ ist generisch gebraucht.
