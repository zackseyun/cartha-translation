  text: בַּ/הֲכִינ֣/וֹ שָׁ֭מַיִם שָׁ֣ם אָ֑נִי בְּ/ח֥וּק/וֹ ח֝֗וּג עַל פְּנֵ֥י תְהֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/027.yaml
  text: When he established the heavens[a], I was there, when he inscribed a circle on the face of the deep.
translation:
  language: de
  text: Als er die Himmel fest gründete, war ich dort, als er einen Kreis[a] über der Fläche der Urflut zog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Kreislinie absteckte«. Das hebräische Bild kann den Horizont oder eine kreisförmige Grenze über den Urwassern bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֲכִינוֹ
  choice: Als er … fest gründete
  rationale: Die Präposition mit Infinitiv und Suffix wird hier temporal verstanden. »Fest gründen« gibt sowohl das Herstellen als auch das feste Ordnen im Schöpfungszusammenhang wieder.
- source_word: שָׁמַיִם
  choice: den Himmel
  rationale: Der hebräische Plural bezeichnet hier den kosmischen Himmel; im heutigen Deutschen ist der singularische Kollektivbegriff »Himmel« die natürliche Entsprechung.
- source_word: שָׁם אָ֑נִי
  choice: war ich dort
  rationale: »Dort« bewahrt die örtliche Aussage von שָׁם. Das im Hebräischen unausgesprochene Verb wird im Deutschen für den Rückblick auf die Schöpfung als »war« ergänzt.
- source_word: בְּחֻקוֹ
  choice: als er … zog
  rationale: Die Form bezeichnet hier das Einritzen oder Abstecken. Zusammen mit »Kreis« gibt »einen Kreis ziehen« das konkrete Bild idiomatisch wieder, ohne es zu einer bloß abstrakten Anordnung umzudeuten.
- source_word: חוּג
  choice: einen Kreis
  rationale: Die direkte geometrische Bedeutung bleibt im Haupttext erhalten; mögliche Bezüge auf Horizont oder Begrenzung werden nicht vorschnell festgelegt.
- source_word: עַל־פְּנֵי
  choice: über der Fläche
  rationale: Die Wendung bedeutet wörtlich »über/auf dem Angesicht von«. »Über der Fläche« ist im Deutschen natürlich und bewahrt die räumliche Bildhaftigkeit.
- source_word: תְהוֹם
  choice: der Urflut
  rationale: »Urflut« bezeichnet im Deutschen prägnant die kosmischen Tiefenwasser des Schöpfungsbildes, ohne die späteren theologischen Nebenbedeutungen von »Abgrund« einzutragen.
theological_decisions:
- issue: Kosmologische Bildsprache in der Rede der Weisheit
  choice: Der Vers wird als poetische Darstellung der Anwesenheit der personifizierten Weisheit bei der Schöpfung wiedergegeben.
  alternative: Das Bild ausdrücklich als Horizont, Himmelsgewölbe oder bestimmtes kosmologisches Modell deuten oder eine spätere christologische Identifikation in den Wortlaut eintragen.
  rationale: Der hebräische Text lässt die genaue kosmologische Vorstellung und die weitergehende theologische Deutung offen. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer poetischer Bildsprache. »Fest gründete« und »Urflut« halten den kosmischen Schöpfungskontext präsent, ohne den Vers technisch oder konfessionell festzulegen.
