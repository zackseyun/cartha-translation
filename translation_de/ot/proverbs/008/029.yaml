  text: בְּ/שׂ֘וּמ֤/וֹ לַ/יָּ֨ם חֻקּ֗/וֹ וּ֭/מַיִם לֹ֣א יַֽעַבְרוּ פִ֑י/ו בְּ֝/חוּק֗/וֹ מ֣וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/029.yaml
  text: when he set a boundary for the sea[a], so that the waters would not transgress his command, when he marked out the foundations of the earth[b],
translation:
  language: de
  text: als er dem Meer seine Grenze setzte[a], damit die Wasser seinen Befehl nicht übertraten[b], als er die Grundfesten der Erde absteckte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Meer seine feste Ordnung bestimmte“. Das hebräische Wort kann eine feste Anordnung, eine Verordnung oder eine gesetzte Grenze bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seinen Mund“; gemeint ist das, was sein Mund befiehlt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמוֹ
  choice: als er … setzte
  rationale: Die Präposition בְּ mit dem Infinitivus constructus und Suffix hat hier zeitliche Bedeutung. „Als er … setzte“ ist natürlich und bildet die parallele Konstruktion mit בְּחוּקוֹ ab.
- source_word: לַיָּם חֻקּוֹ
  choice: dem Meer seine Grenze
  rationale: 'חֹק kann eine Festsetzung, Verordnung oder feste Grenze bezeichnen. Im Zusammenhang mit dem Meer gibt „Grenze“ die konkrete räumliche Vorstellung wieder; das Suffix wird als auf Gott bezogen bewahrt: die von ihm gesetzte Grenze.'
- source_word: וּמַיִם לֹא יַעַבְרוּ
  choice: sodass die Wasser … nicht zuwiderhandelten
  rationale: עבר bedeutet „hinübergehen/überschreiten“ und bezeichnet zusammen mit „seinem Mund“ das Übertreten einer göttlichen Anordnung. „Sodass“ macht den Folge- beziehungsweise Zweckzusammenhang im Deutschen verständlich.
- source_word: פִּיו
  choice: seinem Befehl
  rationale: Wörtlich steht „seinem Mund“. Der Mund bezeichnet metonymisch die ausgesprochene Anordnung; „Befehl“ gibt dies in natürlichem Deutsch wieder, während eine Fußnote den Wortlaut nennt.
- source_word: בְּחוּקוֹ
  choice: als er … absteckte
  rationale: חקק kann „einritzen“, „festsetzen“ oder „abstecken“ bedeuten. Bei den Grundfesten der Erde bewahrt „absteckte“ die anschauliche Schöpfungs- und Vermessungssprache.
- source_word: מוֹסְדֵי אָרֶץ
  choice: die Grundfesten der Erde
  rationale: „Grundfesten“ gibt die Pluralform und das poetisch-kosmologische Bild würdig und verständlich wieder.
theological_decisions:
- issue: Schöpfungsbild in der Rede der Weisheit
  choice: Der Vers beschreibt anschaulich Gottes ordnendes Schöpfungshandeln, ohne spätere Lehrdeutungen in den Text einzutragen.
  alternative: Die Aussagen ausschließlich als abstrakte Metapher lesen oder im Haupttext ausdrücklich mit späteren christologischen Kategorien deuten.
  rationale: Der hebräische Text schildert konkrete Grenzen und Grundfesten in poetischer Schöpfungssprache. Weitergehende theologische Identifizierungen werden weder behauptet noch ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Satzführung. „Grundfesten“ erhält das kosmologische Bild; „zuwiderhandeln“ bewahrt sowohl den Gedanken des Überschreitens als auch den Bezug auf einen Befehl. Der Vers endet mit Komma, da er syntaktisch Teil der fortlaufenden Rede ist.
