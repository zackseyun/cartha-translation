source:
  edition: WLC
  text: כִּֽי טוֹבָ֣ה חָ֭כְמָה מִ/פְּנִינִ֑ים וְ/כָל חֲ֝פָצִ֗ים לֹ֣א יִֽשְׁווּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/011.yaml
  text: For wisdom is better than jewels[a], and all desirable things cannot compare with her.
translation:
  language: de
  text: Denn Weisheit ist besser als Edelsteine[a], und nichts, was man begehren kann, kommt ihr gleich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Perlen« oder »Rubine«. Das genaue kostbare Material, das mit dem hebräischen Wort bezeichnet wird, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung ein und bewahrt den verbindenden Charakter natürlich im Deutschen.
- source_word: טוֹבָה
  choice: ist besser
  rationale: Zusammen mit der Vergleichspräposition מִן hat das Adjektiv komparative Bedeutung.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche deutsche Wiedergabe bewahrt zugleich die Personifizierung der Weisheit in Sprüche 8.
- source_word: מִפְּנִינִים
  choice: als Edelsteine
  rationale: Der genaue Edelsteintyp ist unsicher; die allgemeinere Wiedergabe vermeidet eine unbegründete Festlegung auf Perlen oder Rubine.
- source_word: וְכָל חֲפָצִים
  choice: und nichts, was man begehren kann
  rationale: Gibt die Gesamtheit begehrenswerter Dinge idiomatisch wieder; in Verbindung mit der Verneinung entspricht dies sinngemäß »alle begehrenswerten Dinge … nicht«.
- source_word: לֹא יִשְׁווּ בָהּ
  choice: kommt ihr gleich
  rationale: שׁוה mit ב bezeichnet Gleichwertigkeit oder Vergleichbarkeit. Das feminine Pronomen erhält die Personifizierung der Weisheit.
theological_decisions:
- issue: Personifizierung der Weisheit
  choice: femininen Personenbezug mit »ihr« beibehalten
  alternative: unpersönlich mit »ihr« als Bezug auf das feminine Substantiv, ohne betonte Personifizierung, oder umformuliert »mit Weisheit«
  rationale: Das hebräische Suffix ist feminin Singular, und Sprüche 8 stellt die Weisheit durchgehend als Frau dar. »Ihr« bewahrt diese literarische Gestaltung, ohne darüber hinausgehende dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, knappem Spruchstil. Die Formulierung »kommt ihr gleich« erhält sowohl den Vergleich als auch die weibliche Personifizierung.
