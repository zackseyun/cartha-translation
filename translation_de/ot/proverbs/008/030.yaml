  text: וָֽ/אֶהְיֶ֥ה אֶצְל֗/וֹ אָ֫מ֥וֹן וָֽ/אֶהְיֶ֣ה שַׁ֭עֲשֻׁעִים י֤וֹם י֑וֹם מְשַׂחֶ֖קֶת לְ/פָנָ֣י/ו בְּ/כָל עֵֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/030.yaml
  text: Then I was beside him[a], like a master workman; and I was his delight day after day, rejoicing before him at all times[b],
translation:
  language: de
  text: Da war ich bei ihm wie eine Werkmeisterin[a]. Tag für Tag war ich seine Freude und freute mich allezeit vor ihm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein kleines Kind“; möglicherweise auch: „als eine Vertraute“ beziehungsweise „als eine treu Verbundene“. Die Bedeutung des hebräischen Wortes ist unsicher.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „spielte allezeit vor ihm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: Da war ich
  rationale: Das Qal-Wayyiqtol von היה führt die zurückblickende Schilderung der Weisheit fort; „Da war ich“ klingt im Deutschen natürlich und wahrt den Zusammenhang.
- source_word: אֶצְלוֹ
  choice: an seiner Seite
  rationale: אצל bezeichnet räumliche beziehungsweise persönliche Nähe. „An seiner Seite“ gibt diese Beziehung wieder, ohne sie näher zu bestimmen.
- source_word: אָמֹון
  choice: als Werkmeisterin
  rationale: Das seltene Wort ist in Bedeutung und Vokalisierung umstritten. „Werkmeisterin“ ist im Schöpfungszusammenhang eine plausible traditionelle Deutung und stimmt grammatisch mit der personifizierten Weisheit überein; andere Deutungen stehen in der Fußnote.
- source_word: שַׁעֲשֻׁעִים
  choice: seine Freude
  rationale: Der Plural bezeichnet innige Freude beziehungsweise einen Gegenstand der Freude. „Seine Freude“ ergänzt die im Hebräischen kontextuell naheliegende Beziehung, ohne eine zusätzliche Rolle festzulegen.
- source_word: יוֹם יוֹם
  choice: Tag für Tag
  rationale: Die Wortwiederholung drückt regelmäßige, fortdauernde Wiederholung aus.
- source_word: מְשַׂחֶקֶת
  choice: freute mich
  rationale: Das Partizip von שׂחק kann freudiges Spielen, Lachen oder Jubeln bezeichnen. „Freute mich“ ist im gehobenen poetischen Kontext natürlich; die konkretere Spiel-Metapher bleibt in der Fußnote erhalten.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Die Wendung bezeichnet unmittelbar seine Gegenwart und wird knapp sowie quellennah wiedergegeben.
- source_word: בְּכָל עֵת
  choice: allezeit
  rationale: Die Formulierung gibt die umfassende zeitliche Dauer würdig und prägnant wieder.
theological_decisions:
- issue: Die durch אָמוֹן bezeichnete Rolle der Weisheit bei der Schöpfung
  choice: Im Haupttext „als Werkmeisterin“, mit ausdrücklichem Hinweis auf die lexikalische Unsicherheit.
  alternative: „wie ein kleines Kind“ oder „als Vertraute/Treue“
  rationale: Der Schöpfungszusammenhang erlaubt die handwerkliche Deutung, doch das hebräische Wort ist notorisch schwierig. Die Übersetzung entscheidet daher nicht dogmatisch über christologische oder metaphysische Folgerungen, sondern dokumentiert die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Rhythmus. Die feminine Form „Werkmeisterin“ folgt der personifizierten, grammatisch femininen Weisheit. Beide Fußnotenmarker erscheinen unmittelbar an den betreffenden Aussagen im Haupttext.
