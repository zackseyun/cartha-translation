id: PRO.8.12
reference: Proverbs 8:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲֽנִי חָ֭כְמָה שָׁכַ֣נְתִּי עָרְמָ֑ה וְ/דַ֖עַת מְזִמּ֣וֹת אֶמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/012.yaml
  text: I[a], wisdom, dwell with prudence, and I find knowledge and discretion.
translation:
  language: de
  text: Ich, die Weisheit, wohne bei der Klugheit und finde Erkenntnis und Besonnenheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ich, die Weisheit, habe bei der Klugheit gewohnt und finde Erkenntnis der Pläne.“ Das hebräische Verb kann vergangenheitsbezogen wiedergegeben werden; מְזִמּוֹת kann außerdem „Pläne“, „Vorhaben“ oder „umsichtiges Urteilsvermögen“ bedeuten.'
    reason: Lexikalische und syntaktische Alternativen
lexical_decisions:
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Das Substantiv bedeutet „Weisheit“. Die Wendung „Ich, die Weisheit“ bewahrt die poetische Personifikation; die Großschreibung ist im Deutschen grammatisch erforderlich und macht daraus keinen Eigennamen.
- source_word: שָׁכַנְתִּי
  choice: wohne
  rationale: שׁכן bezeichnet das Wohnen oder Verweilen. Das Präsens passt zum fortlaufenden Reden der personifizierten Weisheit; die Perfektform des Hebräischen lässt jedoch auch eine vergangenheitsbezogene Wiedergabe zu.
- source_word: עָרְמָה
  choice: Klugheit
  rationale: In diesem positiven weisheitlichen Zusammenhang bezeichnet עָרְמָה praktische Klugheit und nicht betrügerische Verschlagenheit.
- source_word: דַעַת
  choice: Erkenntnis
  rationale: „Erkenntnis“ gibt den Begriff im weisheitlichen Zusammenhang natürlich wieder und hält ihn von „Weisheit“ unterschieden.
- source_word: מְזִמּוֹת
  choice: Besonnenheit
  rationale: Das Wort kann je nach Zusammenhang Pläne, Vorhaben oder planvolles Urteilsvermögen bezeichnen. Hier vermittelt „Besonnenheit“ den positiven Sinn und unterscheidet sich zugleich von עָרְמָה („Klugheit“).
- source_word: אֶמְצָא
  choice: finde
  rationale: מצא bedeutet gewöhnlich „finden“. Die schlichte Wiedergabe bewahrt das hebräische Bild, ohne es als „erlangen“ oder „besitzen“ auszudeuten.
- source_word: וְ
  choice: und
  rationale: Die Konjunktion verbindet die Aussagen schlicht miteinander und bewahrt die Parallelität.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Die Weisheit spricht als poetisch personifizierte Gestalt, ohne dass die Übersetzung sie mit einer späteren theologischen Gestalt identifiziert.
  alternative: Die Weisheit ausdrücklich als Eigennamen behandeln oder christologisch ausdeuten.
  rationale: Sprüche 8 personifiziert die Weisheit. Diese literarisch-theologische Spannung soll erhalten bleiben, ohne eine Identifikation in den Vers hineinzutragen.
- issue: Verhältnis von דַעַת und מְזִמּוֹת
  choice: 'Als zwei eng verbundene positive Eigenschaften wiedergegeben: „Erkenntnis und Besonnenheit“.'
  alternative: 'Als Genitivverbindung wiedergeben: „Erkenntnis der Pläne/Vorhaben“.'
  rationale: Der poetische Zusammenhang begünstigt die koordinierte Wiedergabe, doch die knappe hebräische Wortfolge lässt auch eine engere syntaktische Verbindung zu; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Klugheit“ und „Besonnenheit“ sind allgemein verständlich und bilden die beiden unterschiedlichen hebräischen Begriffe positiv ab. Die deutsche Substantivgroßschreibung darf nicht als Entscheidung für einen Eigennamen missverstanden werden.
