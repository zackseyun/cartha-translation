base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/007.yaml
  text: For my mouth will utter truth[a], and wickedness is an abomination to my lips.
translation:
  language: de
  text: Denn mein Mund spricht Wahrheit[a], und Bosheit ist meinen Lippen ein Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mein Gaumen spricht Wahrheit“. Der „Gaumen“ steht hier als Bild für das Sprechorgan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Aufruf der Weisheit ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: אֱמֶת
  choice: Wahrheit
  rationale: Bezeichnet im Zusammenhang mit dem Reden das Wahre beziehungsweise wahrhaftige Rede und bildet den Gegenpol zu רֶשַׁע.
- source_word: יֶהְגֶּה
  choice: spricht
  rationale: הגה kann murmeln, sinnen oder äußern bedeuten; mit dem Gaumen als Subjekt und Wahrheit als Objekt steht hier der hörbare sprachliche Ausdruck im Vordergrund.
- source_word: חִכִּי
  choice: mein Gaumen
  rationale: Die konkrete Körpermetapher des Hebräischen bleibt erhalten; der Gaumen steht hier als Organ des Sprechens für die hervorgebrachte Rede.
- source_word: וְתוֹעֲבַת
  choice: und … ist … ein Gräuel
  rationale: Bewahrt die starke moralische Abscheu von תּוֹעֵבָה in einem würdigen, im Deutschen verständlichen biblischen Register.
- source_word: שְׂפָתַי
  choice: meinen Lippen
  rationale: Erhält das parallele Bild der Sprechorgane und gibt die Beziehung idiomatisch mit dem Dativ wieder.
- source_word: רֶשַׁע
  choice: Unrecht
  rationale: Bezeichnet moralisch verwerfliches Handeln beziehungsweise Wesen. „Unrecht“ ist in modernem Deutsch natürlich und lässt den Bezug auf verkehrte Rede offen, ohne ihn auf bloße Unwahrheit zu verengen.
