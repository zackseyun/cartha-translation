revisions:
- from: Denn mein Gaumen spricht Wahrheit[a], und Unrecht ist meinen Lippen ein Gräuel.
  to: Denn mein Mund spricht Wahrheit[a], und Bosheit ist meinen Lippen ein Gräuel.
  rationale: Die Revision ersetzt die im Deutschen unnatürliche Verbindung „mein Gaumen spricht“ durch die kontextuell gebotene Metonymie „mein Mund spricht“ und dokumentiert die wörtliche hebräische Lesart in der Fußnote. Außerdem wird רֶשַׁע mit „Bosheit“ als umfassenderer moralischer Begriff wiedergegeben. Bedeutung, poetische Parallelität und gehobenes Register bleiben erhalten.
