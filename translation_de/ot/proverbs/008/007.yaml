    issue: Unidiomatische Wiedergabe von חִכִּי
    rationale: Die wörtliche Formulierung „mein Gaumen spricht“ ist im Deutschen sprachlich befremdlich. Da חִכִּי hier metonymisch das Sprechorgan bezeichnet, ist „mein Mund“ im Haupttext eine sichere funktionsäquivalente Wiedergabe; die Fußnote bewahrt die wörtliche Körperbezeichnung.
  - severity: low
    issue: „Unrecht“ für רֶשַׁע ist semantisch etwas zu eng bzw. rechtlich gefärbt
    rationale: רֶשַׁע bezeichnet hier allgemein moralische Bosheit bzw. gottlose Verwerflichkeit, nicht primär eine konkrete Rechtsverletzung. „Bosheit“ hält den ethischen Kontrast zu „Wahrheit“ klarer aufrecht.
  revised_text: Denn mein Mund spricht Wahrheit[a], und Bosheit ist meinen Lippen ein Gräuel.
