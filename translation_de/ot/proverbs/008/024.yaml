source:
  edition: WLC
  text: בְּ/אֵין תְּהֹמ֥וֹת חוֹלָ֑לְתִּי בְּ/אֵ֥ין מַ֝עְיָנ֗וֹת נִכְבַּדֵּי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/024.yaml
  text: When there were no depths[a], I was brought forth, when there were no springs abounding with water.
translation:
  language: de
  text: Als es noch keine Tiefen gab, wurde ich hervorgebracht[a], als es noch keine wasserreichen Quellen gab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde ich geboren“ oder „wurde ich geformt“. Das hebräische Verb kann an eine Geburt denken lassen; „hervorgebracht“ bewahrt das Bild, ohne es genauer festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: als es noch keine … gab
  rationale: Die Wendung bezeichnet hier in beiden parallelen Vershälften einen zeitlichen Umstand. „Als es noch keine … gab“ klingt natürlich und gibt den zeitlichen Sinn wieder, ohne ausdrücklich ein stärker deutendes „bevor“ einzusetzen.
- source_word: תְּהֹמוֹת
  choice: Tiefen
  rationale: Das Wort bezeichnet tiefe Wassermassen beziehungsweise Urfluten. „Tiefen“ bleibt bildhaft und verständlich, ohne mythologische Vorstellungen hinzuzufügen.
- source_word: חוֹלָלְתִּי
  choice: wurde ich hervorgebracht
  rationale: Die passive Verbform kann Geburts- oder Hervorbringungsbilder aufrufen. „Wurde ich hervorgebracht“ bewahrt diese Bildsprache, ohne sie auf eine rein biologische Geburt oder auf ein bestimmtes Herstellungsverfahren festzulegen.
- source_word: מַעְיָנוֹת
  choice: Quellen
  rationale: Das Substantiv bezeichnet natürliche Wasseraustritte. „Quellen“ ist die geläufige und sachlich passende deutsche Wiedergabe.
- source_word: נִכְבַּדֵּי מָיִם
  choice: wasserreiche
  rationale: Die hebräische Wendung beschreibt die Quellen wörtlich als „schwer/gewichtig an Wasser“ und meint hier ihre große Wasserfülle. „Wasserreich“ gibt diesen Sinn im Deutschen knapp und natürlich wieder.
- source_word: מָיִם
  choice: Wasser
  rationale: Das im Hebräischen formal plurale Wort wird in dieser Verbindung idiomatisch mit dem deutschen Singular „Wasser“ wiedergegeben.
theological_decisions:
- issue: Die Ursprungssprache der personifizierten Weisheit in Sprüche 8
  choice: wurde ich hervorgebracht
  alternative: wurde ich geboren; wurde ich geformt
  rationale: Die Übersetzung erhält die Geburts- und Hervorbringungsmetaphorik des hebräischen Verbs, ohne spätere christologische Schlussfolgerungen in den poetischen Text hineinzutragen oder die Aussage auf eine einzige Entstehungsweise festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit parallelem Satzbau. „Wasserreiche Quellen“ ist idiomatischer als eine wörtliche Formulierung wie „an Wasser schwere Quellen“, während „hervorgebracht“ die bewusste Mehrdeutigkeit des Ursprungbildes erhält.
