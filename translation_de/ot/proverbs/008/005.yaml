  text: הָבִ֣ינוּ פְתָאיִ֣ם עָרְמָ֑ה וּ֝/כְסִילִ֗ים הָבִ֥ינוּ לֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/005.yaml
  text: Learn prudence[a], you simple ones; and learn understanding, you fools.
translation:
  language: de
  text: Ihr Unerfahrenen, lernt Klugheit; ihr Toren, gewinnt Einsicht[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „versteht Herz“. „Herz“ bezeichnet hier das Vermögen zu denken und zu urteilen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִינוּ
  choice: lernt / gewinnt
  rationale: Der Imperativ von בין fordert dazu auf, verständig zu werden oder Einsicht zu erwerben. Die beiden natürlichen deutschen Wiedergaben wahren den parallelen Aufruf, ohne eine im Deutschen schwerfällige Wiederholung zu erzwingen.
- source_word: פְתָאיִם
  choice: ihr Unerfahrenen
  rationale: פתי bezeichnet im Sprüchebuch leicht beeinflussbare, unkundige oder arglose Menschen, nicht Menschen mit geringer Intelligenz. „Unerfahrenen“ gibt diese Weisheitskategorie verständlich und ohne irreführende Herabsetzung wieder.
- source_word: עָרְמָה
  choice: Klugheit
  rationale: עָרְמָה kann je nach Zusammenhang Schlauheit oder Verschlagenheit bezeichnen; hier ist die positiv verstandene Fähigkeit zu umsichtigem, klugem Handeln gemeint.
- source_word: וּכְסִילִים
  choice: ihr Toren
  rationale: כְּסִילִים ist ein fester Begriff der Weisheitsliteratur für Menschen, die sich der Weisheit gegenüber uneinsichtig verhalten. „Toren“ erhält diese moralische und geistliche Dimension und die direkte Anrede.
- source_word: לֵב
  choice: Einsicht
  rationale: לֵב bedeutet wörtlich „Herz“, bezeichnet im althebräischen Denken aber auch das innere Vermögen des Denkens, Urteilens und Verstehens. „Einsicht gewinnen“ ergibt im Deutschen einen klaren Aufruf; die konkrete Bildsprache wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer paralleler Anrede. „Unerfahrenen“ vermeidet die heute missverständliche Bezeichnung „Einfältigen“; „Toren“ bewahrt den charakteristischen Begriff der Weisheitsliteratur.
