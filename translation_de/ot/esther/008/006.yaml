source:
  edition: WLC
  text: כִּ֠י אֵיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בָּ/רָעָ֖ה אֲשֶׁר יִמְצָ֣א אֶת עַמִּ֑/י וְ/אֵֽיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בְּ/אָבְדַ֖ן מוֹלַדְתִּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/006.yaml
  text: For how could I bear to see the disaster that will come upon my people? And how could I bear to see the destruction of my kindred?[a]
translation:
  language: de
  text: Denn wie könnte ich es ertragen, das Unheil mitanzusehen, das mein Volk treffen wird? Und wie könnte ich es ertragen, die Vernichtung meiner Verwandten[a] mitanzusehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Menschen meiner Herkunft“; auch möglich: „meines Geburtsvolkes“. Das hebräische Wort kann die durch Geburt verbundene Verwandtschaft oder Herkunftsgemeinschaft bezeichnen, nicht nur den Geburtsort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für Esters vorausgehende Bitte ein und bewahrt die kausale Verknüpfung.
- source_word: אֵיכָכָה אוּכַל
  choice: wie könnte ich es ertragen
  rationale: Die rhetorische Frage drückt nicht nur fehlende Fähigkeit, sondern emotionales Unvermögen aus. „Ertragen“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: וְרָאִיתִי
  choice: mitanzusehen
  rationale: Das koordinierte hebräische Verb wird im Deutschen idiomatisch als Ergänzung zu „ertragen“ wiedergegeben; „mitansehen“ bezeichnet das leidvolle Erleben als Augenzeugin.
- source_word: בָּרָעָה
  choice: das Unheil
  rationale: רָעָה bezeichnet hier das drohende Unglück, nicht moralische Bosheit. „Unheil“ ist klar, würdig und kontextgerecht.
- source_word: אֲשֶׁר יִמְצָא
  choice: das … treffen wird
  rationale: Das hebräische „finden“ ist hier idiomatisch im Sinn von „jemanden treffen/widerfahren“ gebraucht.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Gibt Esters ausdrückliche Zugehörigkeit zu ihrem Volk unmittelbar wieder.
- source_word: בְּאָבְדַן
  choice: die Vernichtung
  rationale: Das Substantiv von אבד bezeichnet Untergang oder Zerstörung; angesichts des im Kontext verfügten Massenmords ist „Vernichtung“ sachlich angemessen, ohne das Objekt enger festzulegen.
- source_word: מוֹלַדְתִּי
  choice: meiner Verwandten
  rationale: Das Wort kann die durch Geburt mit Ester verbundene Verwandtschaft beziehungsweise Herkunftsgemeinschaft bezeichnen. „Meine Verwandten“ ist im modernen Deutsch natürlich; die größere Bedeutungsbreite wird in der Fußnote offengehalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erhalten; „mitanzusehen“ vermittelt Esters emotionales Entsetzen, ohne die rhetorische Frage in eine Aussage umzudeuten.
