  terminology: Mordechai, Susa, Krone, feines Leinen und Purpur sind angemessen. Die Fußnote soll die unsichere bzw. breite Farbzuordnung von תְּכֵלֶת erläutern, ohne die Hauptübersetzung durch die wenig geläufige Zusammensetzung „Blaupurpur“ zu belasten.
