base_translation:
  language: en
  yaml_path: translation/ot/esther/008/015.yaml
  text: And Mordecai went out from the presence of the king in royal clothing of blue and white[a], with a large crown of gold and a robe of fine linen and purple[e][d][c][b]; and the city of Susa shouted and rejoiced.
translation:
  language: de
  text: Mordechai verließ die Gegenwart des Königs in königlicher Kleidung aus blauem Stoff[a] und Weiß, mit einer großen goldenen Krone und einem Mantel aus feinem Leinen und Purpur. Und die Stadt Susa jubelte und freute sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet einen kostbaren Farbstoff im blauen bis blauvioletten Farbbereich.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא מִלִּפְנֵי הַמֶּלֶךְ
  choice: ging vom König hinaus
  rationale: Gibt die Bewegung aus der unmittelbaren Gegenwart des Königs natürlich wieder, ohne über den Anlass oder das Ziel hinauszugehen.
- source_word: לְבוּשׁ מַלְכוּת
  choice: königliches Gewand
  rationale: Bezeichnet eine der Königswürde entsprechende Kleidung; der Singular passt zur folgenden näheren Beschreibung.
- source_word: תְּכֵלֶת
  choice: Blaupurpur
  rationale: Das Wort bezeichnet einen kostbaren blauen bis blauvioletten Farbstoff; „Blaupurpur“ bewahrt diese historische Farbspanne prägnant.
- source_word: חוּר
  choice: Weiß
  rationale: Im Gegensatz zu תְּכֵלֶת bezeichnet das Wort hier wahrscheinlich weiße Farbe oder weißen Stoff.
- source_word: עֲטֶרֶת זָהָב גְּדוֹלָה
  choice: eine große goldene Krone
  rationale: Bewahrt Größe, Material und die Bedeutung eines kranz- oder kronenartigen Kopfschmucks in natürlichem Deutsch.
- source_word: תַכְרִיךְ
  choice: Mantel
  rationale: Das seltene Nomen bezeichnet ein umhüllendes oder gewickeltes Obergewand; „Mantel“ ist würdig und verständlich.
- source_word: בּוּץ
  choice: feines Leinen
  rationale: Bezeichnet hochwertigen Leinenstoff und erhält dessen luxuriöse Qualität.
- source_word: אַרְגָּמָן
  choice: Purpur
  rationale: Die übliche Bezeichnung für den kostbaren purpurfarbenen Stoff beziehungsweise Farbstoff.
- source_word: צָהֲלָה וְשָׂמֵחָה
  choice: jubelte laut und freute sich
  rationale: Unterscheidet den hörbaren Jubel des ersten Verbs von der Freude des zweiten und gibt zugleich die personifizierte Reaktion der Stadt wieder.
