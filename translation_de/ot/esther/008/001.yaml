base_translation:
  language: en
  yaml_path: translation/ot/esther/008/001.yaml
  text: On that day King Ahasuerus gave Queen Esther the house of Haman, the enemy of the Jews, and Mordecai came before the king, because Esther had told what he was to her.
translation:
  language: de
  text: An jenem Tag gab König Ahasveros der Königin Ester den Besitz Hamans, des Judenfeindes. Mordechai trat vor den König, denn Ester hatte ihm gesagt, in welcher Beziehung er zu ihr stand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הָמָן
  choice: den Besitz Hamans
  rationale: בַּיִת bezeichnet hier im Zusammenhang mit der königlichen Übertragung des eingezogenen Vermögens nicht nur ein Gebäude, sondern Hamans Hausstand beziehungsweise Besitz.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: des Judenfeindes
  rationale: צֹרֵר bezeichnet einen feindseligen Bedränger oder Gegner; die kompakte deutsche Bezeichnung gibt Hamans bekannte Rolle natürlich wieder.
- source_word: בָּא לִפְנֵי הַמֶּלֶךְ
  choice: trat vor den König
  rationale: Die Wendung meint den Zutritt zur königlichen Gegenwart und wahrscheinlich die offizielle Zulassung am Hof; „trat vor“ bewahrt die konkrete Ausdrucksweise.
- source_word: מַה הוּא לָהּ
  choice: in welcher Beziehung er zu ihr stand
  rationale: Die wörtliche Wendung „was er ihr war“ fragt nach Mordechais Verhältnis zu Ester; die gewählte Formulierung ist im modernen Deutsch natürlich, ohne die konkrete Verwandtschaft hier auszubuchstabieren.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet Mordechais Zutritt mit Esters Offenlegung seiner Beziehung zu ihr.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namensformen Ahasveros, Ester und Mordechai folgen der im Deutschen verbreiteten biblischen Schreibweise. Die beiden hebräischen Hauptsätze werden zur besseren Lesbarkeit in zwei Sätze gegliedert; „aber“ markiert den erzählerischen Fortgang, ohne einen starken Gegensatz einzuführen.
