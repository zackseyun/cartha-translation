base_translation:
  language: en
  yaml_path: translation/ot/esther/008/017.yaml
  text: And in every province and province, and in every city and city, wherever the king’s word and his decree reached, there was joy and gladness for the Jews, a feast and a good day. And many from the peoples of the land were becoming Jews, because the fear of the Jews had fallen on them.
translation:
  language: de
  text: Und in jeder Provinz und in jeder Stadt, überall, wohin das Wort des Königs und sein Erlass gelangten, gab es bei den Juden Freude und Jubel, ein Festmahl und einen Festtag. Und viele aus den Völkern des Landes wurden Juden[a], denn Furcht vor den Juden war über sie gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »machten sich zu Juden« bzw. »wurden Juden«. Das seltene hebräische Verb kann auch ein Anschließen an die Juden bezeichnen; ob dies einen aufrichtigen oder nur äußerlichen Anschluss meint, bleibt im Kontext offen.'
    reason: Die Anmerkung erklärt die ungewöhnliche hebräische Verbform und wahrt die kontextuelle Unbestimmtheit, ohne eine vorgetäuschte jüdische Identität als gesicherte lexikalische Bedeutung zu behaupten.
lexical_decisions:
- source_word: מְדִינָה וּמְדִינָה / עִיר וָעִיר
  choice: jede einzelne Provinz / jede einzelne Stadt
  rationale: Die distributive Wiederholung wird in natürlichem Deutsch ausdrücklich wiedergegeben, ohne die hebräische Verdopplung unidiomatisch nachzubilden.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: das Wort des Königs und sein Erlass
  rationale: דבר bezeichnet hier die königliche Botschaft bzw. Anordnung, דת den förmlichen Erlass.
- source_word: שִׂמְחָה וְשָׂשׂוֹן
  choice: Freude und Jubel
  rationale: Das Wortpaar wird mit zwei unterscheidbaren, festlichen Ausdrücken wiedergegeben.
- source_word: מִשְׁתֶּה וְיוֹם טוֹב
  choice: Festmahl und Feiertag
  rationale: משתה bezeichnet ein gemeinschaftliches Festmahl bzw. Gelage; יום טוב einen festlich begangenen Tag.
- source_word: מִתְיַהֲדִים
  choice: nahmen das Judentum an
  rationale: Das seltene Hitpael bezeichnet ein Sich-zu-den-Juden-Halten bzw. Jüdischwerden; die gewählte Formulierung ist verständlich und wahrt den Prozesscharakter.
- source_word: נָפַל פַּחַד הַיְּהוּדִים עֲלֵיהֶם
  choice: Furcht vor den Juden war auf sie gefallen
  rationale: Die bildhafte hebräische Wendung und die objektive Bedeutung des Genitivs werden bewahrt.
theological_decisions:
- issue: Bedeutung von מִתְיַהֲדִים
  choice: nahmen das Judentum an
  alternative: gaben sich als Juden aus / schlossen sich den Juden an
  rationale: Der Kontext nennt Furcht als Motiv, entscheidet aber nicht eindeutig, ob die Hinwendung aufrichtig, politisch oder nur äußerlich war. Der Haupttext bezeichnet den beobachtbaren Übertritt, während die Fußnote die semantische Spannweite offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die distributiven Wiederholungen des Hebräischen werden idiomatisch durch »jede einzelne« abgebildet; die markante Wendung »Furcht … war auf sie gefallen« bleibt bewusst bildhaft erhalten.
