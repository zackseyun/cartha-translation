revisions:
- from: Und in jeder einzelnen Provinz und in jeder einzelnen Stadt, wohin das Wort des Königs und sein Erlass gelangten, herrschten bei den Juden Freude und Jubel, Festmahl und Feiertag. Und viele von den Völkern des Landes nahmen das Judentum an[a], denn Furcht vor den Juden war auf sie gefallen.
  to: Und in jeder Provinz und in jeder Stadt, überall, wohin das Wort des Königs und sein Erlass gelangten, gab es bei den Juden Freude und Jubel, ein Festmahl und einen Festtag. Und viele aus den Völkern des Landes wurden Juden[a], denn Furcht vor den Juden war über sie gekommen.
  rationale: Die Revision ersetzt die zu eng interpretierende Wendung über einen formellen Religionsübertritt durch »wurden Juden«, glättet die Aufzählung idiomatisch und gibt יוֹם טוֹב als »Festtag« wieder. Die Fußnote bewahrt die reale semantische und kontextuelle Offenheit von מִתְיַהֲדִים.
