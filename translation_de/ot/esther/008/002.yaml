  text: וַ/יָּ֨סַר הַ/מֶּ֜לֶךְ אֶת טַבַּעְתּ֗/וֹ אֲשֶׁ֤ר הֶֽעֱבִיר֙ מֵֽ/הָמָ֔ן וַֽ/יִּתְּנָ֖/הּ לְ/מָרְדֳּכָ֑י וַ/תָּ֧שֶׂם אֶסְתֵּ֛ר אֶֽת מָרְדֳּכַ֖י עַל בֵּ֥ית הָמָֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/002.yaml
  text: Then the king removed his signet ring[a], which he had taken away from Haman, and gave it to Mordecai. And Esther appointed Mordecai over the house of Haman.
translation:
  language: de
  text: Da zog der König seinen Siegelring ab, den er Haman weggenommen hatte, und gab ihn Mordechai. Ester setzte Mordechai über das Haus Hamans[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hamans Hausstand« beziehungsweise »Hamans Besitz«.'
    reason: בית hat hier eine breitere mögliche Bedeutung als nur das Wohngebäude; im Kontext kann Hamans gesamter Hausstand oder Besitz gemeint sein.
lexical_decisions:
- source_word: וַיָּסַר
  choice: zog … ab
  rationale: Das Hifil von סור bezeichnet hier das Entfernen des Rings; »zog … ab« gibt die konkrete Handlung im Deutschen natürlich wieder.
- source_word: טַבַּעְתּוֹ
  choice: seinen Siegelring
  rationale: טבעת kann allgemein einen Ring bezeichnen, fungiert im persischen Hofkontext des Esterbuchs jedoch als königlicher Siegelring und Zeichen übertragener Vollmacht.
- source_word: אֲשֶׁר הֶעֱבִיר מֵהָמָן
  choice: den er Haman weggenommen hatte
  rationale: Das Hifil von עבר kann entfernen, wegnehmen oder übertragen bedeuten. Der vorzeitige Entzug des Rings von Haman wird mit dem Plusquamperfekt klar und idiomatisch ausgedrückt.
- source_word: וַיִּתְּנָהּ לְמָרְדֳּכָי
  choice: und gab ihn Mordechai
  rationale: נתן bedeutet gewöhnlich »geben«; das feminine Suffix bezieht sich im Hebräischen auf טבעת. Im Deutschen verlangt »Siegelring« das maskuline Pronomen »ihn«.
- source_word: וַתָּשֶׂם אֶסְתֵּר אֶת מָרְדֳּכַי עַל
  choice: Esterlk setzte Mordechai über
  rationale: שׂים mit על bezeichnet hier die Einsetzung in einen Verantwortungs- und Aufsichtsbereich. »setzte … über« bewahrt die Struktur des Hebräischen und ist in gehobenem modernem Deutsch verständlich.
- source_word: בֵּית הָמָן
  choice: das Haus Hamans
  rationale: בית kann Haus, Hausgemeinschaft oder Besitz beziehungsweise Hausstand meinen. Die wörtlich-nahe Form bewahrt die Bedeutungsbreite; eine Fußnote erläutert sie.
