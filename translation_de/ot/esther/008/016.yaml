  text: לַ/יְּהוּדִ֕ים הָֽיְתָ֥ה אוֹרָ֖ה וְ/שִׂמְחָ֑ה וְ/שָׂשֹׂ֖ן וִ/יקָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/016.yaml
  text: For the Jews there was light and gladness and joy and honor[a].
translation:
  language: de
  text: Für die Juden gab es Licht, Freude, Jubel und Ehre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Juden hatten Licht, Freude, Jubel und Ehre.“ Die hebräische Konstruktion kann sowohl existenziell („es gab“) als auch possessiv („hatten“) wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְּהוּדִים
  choice: Für die Juden
  rationale: Das vorangestellte ל bezeichnet hier den Bezug oder Besitz. „Für die Juden“ bildet die hebräische Konstruktion natürlich ab und lässt ihre existenzielle beziehungsweise possessive Deutung offen.
- source_word: הָיְתָה
  choice: gab es
  rationale: היה lässt sich zusammen mit der vorangestellten Bezugsangabe im Deutschen idiomatisch existenziell mit „gab es“ wiedergeben.
- source_word: אוֹרָה
  choice: Licht
  rationale: „Licht“ ist die direkte Entsprechung und bewahrt das Bild für die erfahrene Wende und Rettung.
- source_word: שִׂמְחָה
  choice: Freude
  rationale: „Freude“ ist eine natürliche, gegenwärtige Wiedergabe; die Unterscheidung vom folgenden שָׂשׂוֹן wird durch „Jubel“ gewahrt.
- source_word: שָׂשֹׂן
  choice: Jubel
  rationale: Das Wort bezeichnet lebhafte, festliche Freude. „Jubel“ gibt diese Intensität wieder und vermeidet eine bloße Wiederholung von „Freude“.
- source_word: יְקָר
  choice: Ehre
  rationale: Im Zusammenhang bezeichnet das Wort gesellschaftliches Ansehen und Würde; „Ehre“ trifft diesen Sinn besser als das stärker visuelle „Pracht“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Reihung des Hebräischen bleibt erhalten; „Freude“ und „Jubel“ geben die beiden nah verwandten Ausdrücke unterscheidbar wieder.
