base_translation:
  language: en
  yaml_path: translation/ot/esther/008/003.yaml
  text: Then Esther spoke again before the king. She fell before his feet[a], wept, and pleaded with him to avert the evil of Haman the Agagite and his scheme that he had devised against the Jews.
translation:
  language: de
  text: Ester sprach noch einmal vor dem König. Sie warf sich ihm zu Füßen, weinte und flehte ihn an, das von Haman, dem Agagiter, ausgehende Unheil und seinen Plan, den er gegen die Juden geschmiedet hatte, abzuwenden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu beseitigen“ oder „vorübergehen zu lassen“. Das hebräische Verb bezeichnet hier, dass Hamans Unheil und Plan abgewendet oder außer Kraft gesetzt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף ... וַתְּדַבֵּר לִפְנֵי הַמֶּלֶךְ
  choice: sprach noch einmal vor dem König
  rationale: יסף mit einem folgenden finiten Verb bezeichnet hier die Wiederholung bzw. Fortsetzung; לִפְנֵי wahrt mit „vor dem König“ die höfische Situation.
- source_word: וַתִּפֹּל לִפְנֵי רַגְלָיו
  choice: warf sich ihm zu Füßen
  rationale: Die Wendung beschreibt körperliche Niederwerfung in einer flehenden Haltung; die deutsche Formulierung ist natürlich und anschaulich.
- source_word: וַתֵּבְךְּ וַתִּתְחַנֶּן לוֹ
  choice: weinte und flehte ihn an
  rationale: בכה bezeichnet Weinen; das Hitpael von חנן drückt eindringliches Bitten um Gunst oder Erbarmen aus.
- source_word: לְהַעֲבִיר
  choice: abzuwenden
  rationale: Das Hifil von עבר bedeutet etwas vorübergehen zu lassen, zu entfernen oder außer Kraft zu setzen. „Abwenden“ passt im Zusammenhang sowohl zum drohenden Unheil als auch zum Plan.
- source_word: אֶת רָעַת הָמָן הָאֲגָגִי
  choice: das von dem Agagiter Haman ausgehende Unheil
  rationale: רָעָה kann Böses, Schaden oder Unheil bezeichnen. „Unheil“ gibt hier die drohende schädliche Wirkung wieder, ohne den Ausdruck mit dem anschließend eigens genannten Plan gleichzusetzen.
- source_word: וְאֵת מַחֲשַׁבְתּוֹ אֲשֶׁר חָשַׁב
  choice: und seinen Plan, den er ... geschmiedet hatte
  rationale: Die figura etymologica aus חשב betont Hamans bewusstes Planen. „einen Plan schmieden“ bewahrt den vorsätzlichen und feindseligen Sinn ohne unnatürliche Wortwiederholung.
- source_word: עַל הַיְּהוּדִים
  choice: gegen die Juden
  rationale: עַל hat mit חשב in diesem feindseligen Zusammenhang eindeutig adversative Bedeutung.
