  text: וַ/יִּקָּרְא֣וּ סֹפְרֵֽי הַ/מֶּ֣לֶךְ בָּֽ/עֵת הַ֠/הִיא בַּ/חֹ֨דֶשׁ הַ/שְּׁלִישִׁ֜י הוּא חֹ֣דֶשׁ סִיוָ֗ן בִּ/שְׁלוֹשָׁ֣ה וְ/עֶשְׂרִים֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה מָרְדֳּכַ֣י אֶל הַ/יְּהוּדִ֡ים וְ/אֶ֣ל הָ/אֲחַשְׁדַּרְפְּנִֽים וְ/הַ/פַּחוֹת֩ וְ/שָׂרֵ֨י הַ/מְּדִינ֜וֹת אֲשֶׁ֣ר מֵ/הֹ֣דּוּ וְ/עַד כּ֗וּשׁ שֶׁ֣בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשֹׁנ֑/וֹ וְ/אֶ֨ל הַ/יְּהוּדִ֔ים כִּ/כְתָבָ֖/ם וְ/כִ/לְשׁוֹנָֽ/ם־־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/009.yaml
  text: Then the king’s scribes were summoned at that time[a], in the third month, that is, the month of Sivan, on its twenty-third day; and it was written exactly as Mordecai commanded, to the Jews and to the satraps, the governors, and the officials of the provinces from India to Cush, one hundred and twenty-seven provinces, to each province in its own script, to each people in its own language[b], and also to the Jews in their own script and their own language.
translation:
  language: de
  text: 'Damals, im dritten Monat, nämlich im Monat Siwan, am dreiundzwanzigsten Tag des Monats, wurden die Schreiber des Königs gerufen. Es wurde alles so geschrieben, wie Mordechai es angeordnet hatte: an die Juden, die Satrapen, die Statthalter und die Amtsträger der Provinzen von Indien bis Kusch[a] – hundertsiebenundzwanzig Provinzen –, und zwar an jede Provinz in ihrer eigenen Schrift und an jedes Volk in seiner eigenen Sprache sowie an die Juden in ihrer eigenen Schrift und ihrer eigenen Sprache.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kusch bezeichnet ein antikes Gebiet südlich von Ägypten, vor allem im heutigen Sudan; traditionell wird der Name auch mit »Äthiopien« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ
  choice: wurden die Schreiber des Königs gerufen
  rationale: Der Nifal drückt hier passiv aus, dass die königlichen Schreiber zum Dienst gerufen wurden; die Wiedergabe bleibt nah am hebräischen Wortlaut und ist im Deutschen natürlich.
- source_word: בָּעֵת הַהִיא
  choice: Damals
  rationale: Die knappe Zeitangabe gibt den Rückbezug natürlich wieder, ohne ihn mit einem zusätzlichen »dann« zu verdoppeln.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי הוּא חֹדֶשׁ סִיוָן
  choice: im dritten Monat, das ist der Monat Siwan
  rationale: Die Apposition und die ausdrückliche Erläuterung des Monatsnamens bleiben erhalten.
- source_word: בִּשְׁלוֹשָׁה וְעֶשְׂרִים בּוֹ
  choice: am dreiundzwanzigsten Tag des Monats
  rationale: Das auf den Monat zurückweisende Pronomen wird im Deutschen zur eindeutigen und flüssigen Datumsangabe aufgelöst.
- source_word: וַיִּכָּתֵב
  choice: Es wurde ... geschrieben
  rationale: Die unpersönliche Passivform entspricht dem hebräischen Nifal und ergänzt keinen ausdrücklich genannten Schreiber.
- source_word: כְּכָל אֲשֶׁר צִוָּה מָרְדֳּכַי
  choice: alles genau so ..., wie Mordechai es angeordnet hatte
  rationale: »Alles genau so« bringt die umfassende Übereinstimmung von כְּכָל idiomatisch zum Ausdruck; »angeordnet« passt zum amtlichen Kontext.
- source_word: הָאֲחַשְׁדַּרְפְּנִים
  choice: Satrapen
  rationale: Der etablierte historische Verwaltungstitel bewahrt die persische Amtsbezeichnung.
- source_word: הַפַּחוֹת
  choice: Statthalter
  rationale: »Statthalter« ist eine verständliche und im historischen Verwaltungskontext passende deutsche Entsprechung.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: Amtsträger der Provinzen
  rationale: Die Wiedergabe bezeichnet Verwaltungsbeamte, ohne den möglichen Sinn unnötig auf fürstlichen Rang festzulegen.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: von Indien bis Kusch
  rationale: Hoddu wird konventionell als Indien identifiziert; Kusch bleibt als antike geografische Bezeichnung erhalten und wird nicht vorschnell mit einem heutigen Staatsgebiet gleichgesetzt.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ וְעַם וָעָם כִּלְשֹׁנוֹ
  choice: an jede Provinz in ihrer eigenen Schrift und an jedes Volk in seiner eigenen Sprache
  rationale: Die distributiven hebräischen Wiederholungen werden durch »jede/jedes« natürlich und präzise wiedergegeben.
- source_word: וְאֶל הַיְּהוּדִים כִּכְתָבָם וְכִלְשׁוֹנָם
  choice: auch an die Juden in ihrer eigenen Schrift und ihrer eigenen Sprache
  rationale: »Auch« macht die additive Fortführung im Deutschen transparent; Schrift und Sprache der Juden werden wie im Ausgangstext ausdrücklich genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzgliederung. Die lange Verwaltungsliste des Hebräischen bleibt erkennbar, wird aber durch einen Satzpunkt und einen Doppelpunkt lesbarer gestaltet. Der Monatsname wird in der im Deutschen üblichen Form »Siwan« geschrieben.
