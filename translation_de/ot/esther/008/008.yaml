base_translation:
  language: en
  yaml_path: translation/ot/esther/008/008.yaml
  text: But you may write concerning the Jews as seems good in your eyes[a], in the king’s name, and seal it with the king’s signet ring[b], for a document that is written in the king’s name and sealed with the king’s signet ring cannot be revoked.
translation:
  language: de
  text: Ihr aber schreibt hinsichtlich der Juden, was ihr für richtig haltet,[a] im Namen des Königs, und versiegelt es mit dem Siegelring des Königs. Denn ein Schreiben, das im Namen des Königs verfasst und mit dem Siegelring des Königs versiegelt ist, kann nicht widerrufen werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie es gut ist in euren Augen“; das heißt: wie ihr es für richtig haltet oder wie es euch angemessen erscheint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „kann nicht rückgängig gemacht werden“. Gemeint ist, dass ein so beglaubigtes königliches Schreiben nicht zurückgenommen oder aufgehoben werden kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Ihr aber
  rationale: Das ausdrückliche Pluralpronomen wird bewahrt; „aber“ gibt den durch den Zusammenhang nahegelegten Gegensatz zum nicht widerrufbaren früheren Erlass natürlich wieder.
- source_word: כִּתְבוּ
  choice: könnt … schreiben
  rationale: Der Imperativ steht im Kontext königlicher Ermächtigung. „Könnt“ gibt diese Erlaubnis wieder, ohne daraus eine ausdrückliche Pflicht zu machen.
- source_word: עַל הַיְּהוּדִים
  choice: für die Juden
  rationale: עַל bezeichnet hier den Gegenstand beziehungsweise das Anliegen des Schreibens; im Kontext wird zugunsten der Juden geschrieben. „Für“ ist im Deutschen natürlich und kontextgerecht.
- source_word: כַּטּוֹב בְּעֵינֵיכֶם
  choice: was ihr für richtig haltet
  rationale: Die hebräische Wendung lautet wörtlich „wie es gut ist in euren Augen“ und bezeichnet das eigene Urteil oder Ermessen. Die Wiedergabe ist gegenwärtig und verständlich; die Bildlichkeit wird in der Fußnote genannt.
- source_word: בְּשֵׁם הַמֶּלֶךְ
  choice: im Namen des Königs
  rationale: Die formnahe deutsche Wendung bezeichnet zugleich das Handeln unter königlicher Autorität.
- source_word: וְחִתְמוּ
  choice: und es … versiegeln
  rationale: Das im Hebräischen aus dem Zusammenhang erschlossene Objekt wird im Deutschen ausdrücklich aufgenommen.
- source_word: בְּטַבַּעַת הַמֶּלֶךְ
  choice: mit dem Siegelring des Königs
  rationale: טַבַּעַת bezeichnet in diesem Verwaltungskontext den Ring, mit dem amtliche Schriftstücke gesiegelt wurden.
- source_word: כְתָב
  choice: ein Schreiben
  rationale: Der allgemeine Ausdruck wahrt die Breite des hebräischen Nomens und ist im königlichen Verwaltungskontext natürlicher als das unspezifische „Schriftstück“, ohne es auf „Erlass“ oder „Dekret“ zu verengen.
- source_word: אֵין לְהָשִׁיב
  choice: kann nicht widerrufen werden
  rationale: Die Wendung bedeutet wörtlich, dass ein Zurückbringen beziehungsweise Rückgängigmachen nicht möglich ist; „widerrufen“ trifft den rechtlich-administrativen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der hebräischen Rechts- und Verwaltungssprache, wird aber zur besseren Lesbarkeit in zwei Sätze gegliedert. Die Anrede im Plural und die Wiederholung von „im Namen des Königs“ sowie „mit dem Siegelring des Königs“ bleiben erhalten.
