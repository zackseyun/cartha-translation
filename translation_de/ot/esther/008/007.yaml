  source_fidelity: 'Der Text gibt Satzbau und Sinn des Hebräischen zuverlässig wieder: die Anrede an Ester und Mordechai, die Übertragung von Hamans Haus, die unbestimmt bleibende Handelndenangabe bei der Hinrichtung sowie der Grund der Bestrafung. Das Plusquamperfekt in „ausgestreckt hatte“ ist im deutschen Erzählzusammenhang angemessen und macht keine zusätzliche Sachbehauptung.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. „Seht“ ist als an zwei Personen gerichtete Aufmerksamkeitslenkung natürlich genug und trifft die deiktische Funktion von הִנֵּה. Die Formulierung „an das Holz gehängt“ ist bewusst nah am hebräischen Bild und wird durch die Anmerkung verständlich eingeordnet.
  terminology: Die etablierten deutschen Namensformen Ahasveros, Ester und Mordechai sind passend. „der Jude/die Juden“ gibt הַיְּהוּדִי bzw. בַּיְּהוּדִים kontextgerecht wieder. Die Fußnote zu „Holz“ bewahrt die lexikalische und historische Unbestimmtheit von עֵץ, ohne eine konkrete Art des Hinrichtungsgeräts dogmatisch festzulegen.
