  text: וַ/יֹּ֨אמֶר הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרֹשׁ֙ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה וּֽ/לְ/מָרְדֳּכַ֖י הַ/יְּהוּדִ֑י הִנֵּ֨ה בֵית הָמָ֜ן נָתַ֣תִּי לְ/אֶסְתֵּ֗ר וְ/אֹת/וֹ֙ תָּל֣וּ עַל הָ/עֵ֔ץ עַ֛ל אֲשֶׁר שָׁלַ֥ח יָד֖/וֹ ב/יהודיים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/007.yaml
  text: Then King Ahasuerus said to Queen Esther and to Mordecai the Jew[a], “Look, I have given Haman’s house to Esther, and they have hanged him on the gallows because he stretched out his hand against the Jews.”
translation:
  language: de
  text: 'Da sagte König Ahasveros zu Königin Ester und zu Mordechai, dem Juden: »Seht, ich habe Ester Hamans Haus gegeben, und ihn hat man an das Holz[a] gehängt, weil er seine Hand gegen die Juden ausgestreckt hatte.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „an den Baum“ oder „an das Holz“. Gemeint ist die Hinrichtungsvorrichtung; der hebräische Ausdruck legt nicht eindeutig fest, ob es sich um einen Galgen, einen Pfahl oder eine andere Holzkonstruktion handelte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: König Ahasveros
  rationale: Titel und Eigenname werden in geläufiger deutscher Wortstellung wiedergegeben; „Ahasveros“ ist die etablierte deutsche Namensform.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: zu Königin Ester
  rationale: Die deutsche Titelfügung ist natürlich und bewahrt Esters königliche Stellung.
- source_word: וּלְמָרְדֳּכַי הַיְּהוּדִי
  choice: und zu Mordechai, dem Juden
  rationale: Die Apposition gibt die ethnische Bezeichnung im Esterbuch klar wieder; „Jude“ ist hier weiter und geläufiger als „Judäer“.
- source_word: הִנֵּה
  choice: Seht
  rationale: Die Aufforderung lenkt die Aufmerksamkeit der beiden Angesprochenen auf die folgenden Tatsachen, ohne das altertümliche „Siehe“ zu verwenden.
- source_word: בֵית הָמָן
  choice: Hamans Haus
  rationale: Die Konstruktion bedeutet wörtlich „Hamans Haus“ und kann im Kontext auch seinen Haushalt und Besitz umfassen, ohne dies im Haupttext enger festzulegen.
- source_word: נָתַתִּי
  choice: ich habe … gegeben
  rationale: Das Perfekt bezeichnet eine abgeschlossene Handlung mit fortbestehendem Ergebnis.
- source_word: וְאֹתוֹ תָּלוּ
  choice: und ihn hat man … gehängt
  rationale: Der hebräische Plural hat ein ungenanntes Handlungssubjekt; das unpersönliche deutsche „man“ bewahrt diese Unbestimmtheit.
- source_word: עַל הָעֵץ
  choice: an das Holz
  rationale: עֵץ kann „Baum“ oder „Holz“ bezeichnen. „Holz“ lässt die genaue Art der Hinrichtungsvorrichtung offen, statt vorschnell einen Galgen oder Pfahl festzulegen.
- source_word: עַל אֲשֶׁר
  choice: weil
  rationale: Die Verbindung leitet hier den Grund für Hamans Hinrichtung ein.
- source_word: שָׁלַח יָדוֹ
  choice: seine Hand gegen … ausgestreckt hatte
  rationale: Die Wiedergabe bewahrt das hebräische Bild für feindliches Vorgehen und macht durch das Plusquamperfekt die zeitliche Vorordnung deutlich.
- source_word: בַּיְּהוּדִים
  choice: gegen die Juden
  rationale: Die Präposition bezeichnet hier die feindliche Ausrichtung; „die Juden“ entspricht dem ethnischen Bezug im Kontext.
