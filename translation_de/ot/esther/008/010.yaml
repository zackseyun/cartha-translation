base_translation:
  language: en
  yaml_path: translation/ot/esther/008/010.yaml
  text: He wrote in the name of King Ahasuerus[a], sealed it with the king’s signet ring, and sent letters by couriers on horses, riding the royal steeds bred from swift stock.
translation:
  language: de
  text: Er schrieb im Namen des Königs Ahasveros und versiegelte das Schreiben mit dem Siegelring des Königs. Dann sandte er Schreiben durch berittene Kuriere auf erlesenen Reitpferden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräischen Bezeichnungen für die Pferde sind selten und in ihrer genauen Bedeutung unsicher. Die Wortfolge lautet annähernd: „Pferde, Rechesch, Achaschtraním, Söhne der Rammakím“. Sie kann sich auf besonders gezüchtete oder für den königlichen Kurierdienst bestimmte Tiere beziehen; die genaue Einordnung bleibt umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Er schrieb
  rationale: Das Wayyiqtol führt die Erzählfolge fort; im modernen deutschen Erzählstil ist das Präteritum angemessen.
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: im Namen des Königs Ahasveros
  rationale: Die Wendung bezeichnet das Handeln kraft königlicher Vollmacht. „Ahasveros“ ist die im Deutschen gebräuchliche Form des hebräischen Namens.
- source_word: וַיַּחְתֹּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: und versiegelte das Schreiben mit dem Siegelring des Königs
  rationale: טַבַּעַת bezeichnet hier den zum Beglaubigen verwendeten Siegelring. „Das Schreiben“ gibt das kollektiv verstandene Schriftstück wieder und vermeidet ein unnatürlich objektloses deutsches „versiegelte“.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: Dann sandte er Schreiben
  rationale: סְפָרִים sind in diesem Zusammenhang amtliche Schriftstücke beziehungsweise Botschaften; „Schreiben“ wahrt den offiziellen Ton.
- source_word: בְּיַד הָרָצִים
  choice: durch berittene Kuriere
  rationale: בְּיַד bezeichnet hier die Vermittlung oder Ausführung durch Personen. הָרָצִים meint königliche Boten; weil sie laut Vers auf Pferden reiten, ist „berittene Kuriere“ natürlich und sachgerecht.
- source_word: בַּסּוּסִים רֹכְבֵי
  choice: die auf Pferden … ritten
  rationale: Die partizipiale Konstruktion wird als deutscher Relativsatz wiedergegeben und beschreibt die Kuriere als Reiter.
- source_word: הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים בְּנֵי הָרַמָּכִים
  choice: Pferden aus dem königlichen Gestüt
  rationale: Die drei seltenen beziehungsweise schwierigen Pferdebegriffe weisen im Kontext auf besonders ausgewählte Tiere des königlichen Reit- oder Kurierwesens. Die flüssige Wiedergabe vermeidet ungesicherte zoologische Präzision; die wörtlichere Struktur und die Unsicherheit werden in der Fußnote kenntlich gemacht.
