  text: וַ֠/תֹּאמֶר אִם עַל הַ/מֶּ֨לֶךְ ט֜וֹב וְ/אִם מָצָ֧אתִי חֵ֣ן לְ/פָנָ֗י/ו וְ/כָשֵׁ֤ר הַ/דָּבָר֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וְ/טוֹבָ֥ה אֲנִ֖י בְּ/עֵינָ֑י/ו יִכָּתֵ֞ב לְ/הָשִׁ֣יב אֶת הַ/סְּפָרִ֗ים מַחֲשֶׁ֜בֶת הָמָ֤ן בֶּֽן הַמְּדָ֨תָא֙ הָ/אֲגָגִ֔י אֲשֶׁ֣ר כָּתַ֗ב לְ/אַבֵּד֙ אֶת הַ/יְּהוּדִ֔ים אֲשֶׁ֖ר בְּ/כָל מְדִינ֥וֹת הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/005.yaml
  text: And she said[a], “If it seems good to the king, and if I have found favor before him, and if the matter is proper before the king, and if I am pleasing in his eyes, let it be written to revoke the letters devised by Haman son of Hammedatha the Agagite[b], which he wrote to destroy the Jews who are in all the provinces of the king.”
translation:
  language: de
  text: 'Sie sagte: „Wenn es dem König gut erscheint und wenn ich bei ihm Gunst gefunden habe und wenn die Sache dem König recht ist und ich ihm gefalle, soll geschrieben werden, die Schreiben über den Plan Hamans, des Sohnes Hammedatas, des Agagiters, aufzuheben[a], die er geschrieben hatte, um die Juden in allen Provinzen des Königs zu vernichten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zurückzunehmen“ oder „rückgängig zu machen“. Wörtlich steht etwa: „die Schreiben, den Plan Hamans“; die hebräische Verbindung kann die Schreiben als Ausdruck oder Ausführung von Hamans Plan bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Wenn es dem König gut erscheint
  rationale: Die förmliche höfische Wendung bleibt erkennbar und klingt zugleich in modernem Deutsch natürlich.
- source_word: מָצָאתִי חֵן לְפָנָיו
  choice: ich Gunst bei ihm gefunden habe
  rationale: „Gunst finden“ gibt חֵן im Zusammenhang einer königlichen Bitte idiomatisch wieder; „bei ihm“ vermeidet die heute steife Formulierung „vor ihm“.
- source_word: וְכָשֵׁר הַדָּבָר לִפְנֵי הַמֶּלֶךְ
  choice: wenn die Sache dem König angemessen ist
  rationale: כָשֵׁר bezeichnet hier das Passende oder Angemessene; „Sache“ bewahrt die Offenheit von דָּבָר.
- source_word: וְטוֹבָה אֲנִי בְּעֵינָיו
  choice: und ich ihm gefalle
  rationale: Die hebräische Redewendung „gut in seinen Augen“ bezeichnet persönliche Zustimmung beziehungsweise Wohlgefallen; die natürliche deutsche Entsprechung ist „ihm gefallen“.
- source_word: יִכָּתֵב
  choice: dann soll ein Erlass verfasst werden
  rationale: Das passive Verb verlangt nach einem schriftlichen Rechtsakt. „Ein Erlass“ wird aus dem administrativen Kontext ergänzt, damit das Deutsche verständlich bleibt, ohne festzulegen, dass die früheren Schreiben selbst umgeschrieben werden.
- source_word: לְהָשִׁיב אֶת־הַסְּפָרִים
  choice: der die Schreiben … aufhebt
  rationale: שׁוב kann ein Zurückwenden oder Rückgängigmachen bezeichnen. Im Verwaltungskontext ist „aufheben“ passend, lässt aber die in Esther 8,8 erkennbare rechtliche Spannung bestehen; eine Fußnote nennt die wörtlichere Alternative.
- source_word: הַסְּפָרִים מַחֲשֶׁבֶת הָמָן
  choice: die Schreiben mit dem Plan Hamans
  rationale: Die schwierige Verbindung wird eng am Hebräischen als Schreiben verstanden, die Hamans Plan enthalten beziehungsweise verkörpern; dies vermeidet die syntaktische Festlegung „von Haman erdacht“.
- source_word: לְאַבֵּד
  choice: zu vernichten
  rationale: Das Verb bezeichnet die beabsichtigte vollständige Zerstörung der Juden; „vernichten“ trägt dem genozidalen Kontext klar Rechnung.
- source_word: הַיְּהוּדִים אֲשֶׁר בְּכָל מְדִינוֹת הַמֶּלֶךְ
  choice: die Juden in allen Provinzen des Königs
  rationale: Die Formulierung wahrt den umfassenden Geltungsbereich und gibt die Genitivverbindung knapp und förmlich wieder.
theological_decisions:
- issue: Spannung zwischen Esters Bitte um Aufhebung und der Unwiderruflichkeit königlicher Schreiben in Esther 8,8
  choice: „aufhebt“ mit Fußnote zur möglichen Wiedergabe „rückgängig macht“
  alternative: „widerruft“ oder „zurückruft“
  rationale: Der Vers formuliert Esters Ziel, ohne bereits zu erklären, wie es rechtlich umgesetzt werden kann. Die Übersetzung bewahrt diese erzählerische Spannung und legt keinen theologischen Ausgleich hinein.
translation_notes:
  register: Gehobenes, aber gut verständliches modernes Standarddeutsch. Die vierteilige höfische Bitte bleibt in ihrer abgestuften Förmlichkeit erhalten. Die lange hebräische Periode wird zur besseren Verständlichkeit nach „aufhebt“ geteilt. Der einzige Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
