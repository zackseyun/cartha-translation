  naturalness: Der Text ist im Ganzen gut verständlich. „Wenn die Sache dem König angemessen ist“ klingt jedoch weniger idiomatisch als die höfische Formel „wenn die Sache dem König recht ist“. Die Wiederholung von „und wenn“ bildet die viergliedrige Bitte genauer ab.
