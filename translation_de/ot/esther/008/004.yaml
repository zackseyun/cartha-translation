  yaml_path: translation/ot/esther/008/004.yaml
  text: Then the king held out the golden scepter to Esther[a], and Esther rose and stood before the king.
translation:
  language: de
  text: Da streckte der König Ester das goldene Zepter entgegen, und Ester erhob sich und stand vor dem König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹשֶׁט
  choice: streckte … entgegen
  rationale: Das Verb bezeichnet das Ausstrecken bzw. Entgegenstrecken. Im höfischen Zusammenhang ist „das Zepter entgegenstrecken“ natürlich und präzise.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: das goldene Zepter
  rationale: Die Wortgruppe bezeichnet das bestimmte königliche Zepter aus Gold beziehungsweise von goldener Erscheinung; „das goldene Zepter“ ist die idiomatische deutsche Wiedergabe.
- source_word: וַתָּקָם
  choice: erhob sich
  rationale: Das Verb bedeutet „aufstehen/sich erheben“. „Erhob sich“ bewahrt den würdevollen Erzählton und unterscheidet den Vorgang von der anschließenden Position vor dem König.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: trat vor den König
  rationale: Wörtlich steht Ester „vor dem König“. Im Zusammenhang bezeichnet die Wendung ihre anschließende förmliche Aufstellung beziehungsweise ihr Hintreten vor ihn; „trat vor den König“ ist im Deutschen natürlich und vermeidet die schwerfällige Folge „stand auf und stand“.
- source_word: וַ
  choice: Da / und
  rationale: Das einleitende Waw führt die Erzählung weiter; „Da“ markiert die zeitliche Folge. Das zweite Waw wird natürlich mit „und“ wiedergegeben.
- source_word: לְאֶסְתֵּר
  choice: Ester … entgegen
  rationale: Die Präposition bezeichnet hier die Ausrichtung der Handlung auf Ester. Die deutsche Konstruktion „jemandem etwas entgegenstrecken“ gibt dies idiomatisch wieder.
theological_decisions: []
