source:
  edition: WLC
  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָ/עַמִּ֑ים וְ/לִ/הְי֨וֹת ה/יהודיים עתודים לַ/יּ֣וֹם הַ/זֶּ֔ה לְ/הִנָּקֵ֖ם מֵ/אֹיְבֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/013.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made public to all the peoples[d][c][b], and so that the Jews would be ready on that day to avenge themselves on their enemies.
translation:
  language: de
  text: Eine Abschrift des Schreibens sollte in jeder einzelnen Provinz[a] als Gesetz erlassen und allen Völkern öffentlich bekannt gemacht werden, damit die Juden für diesen Tag bereit wären, sich an ihren Feinden zu rächen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in jeder Provinz und Provinz“; die Wiederholung ist eine hebräische Ausdrucksweise für „in jeder einzelnen Provinz“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an ihren Feinden Vergeltung zu üben“. Das hebräische Verb bedeutet ausdrücklich, sich zu rächen; „sich zu verteidigen“ wäre eine stärker deutende Wiedergabe aus dem weiteren Zusammenhang.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  choice: eine Abschrift des Schreibens
  rationale: Das persische Lehnwort bezeichnet eine Abschrift beziehungsweise Wiedergabe eines amtlichen Schriftstücks; הַכְּתָב meint hier das königliche Schreiben.
- source_word: לְהִנָּתֵן דָּת
  choice: als Gesetz erlassen
  rationale: Die Wendung beschreibt die rechtsverbindliche Verkündung des Schreibens. „Als Gesetz erlassen“ gibt sowohl den amtlichen Vorgang als auch die rechtliche Geltung wieder.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: in jeder einzelnen Provinz
  rationale: Die hebräische Wiederholung „Provinz und Provinz“ ist distributiv und wird in natürlichem Deutsch mit „jeder einzelnen Provinz“ wiedergegeben.
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: allen Völkern öffentlich bekannt gemacht
  rationale: גָּלוּי bezeichnet hier die öffentliche Zugänglichmachung beziehungsweise Bekanntgabe des Erlasses; „Völker“ bewahrt den ethnischen Plural von עַמִּים.
- source_word: עֲתוּדִים לַיּוֹם הַזֶּה
  choice: für diesen Tag bereit
  rationale: Die Formulierung folgt dem hebräischen Bezug auf den im Erlass festgesetzten Tag und bleibt im Deutschen verständlich.
- source_word: לְהִנָּקֵם מֵאֹיְבֵיהֶם
  choice: sich an ihren Feinden zu rächen
  rationale: Der Nifal von נקם bedeutet, sich zu rächen beziehungsweise Vergeltung zu üben. Eine bloße Wiedergabe mit „sich verteidigen“ würde die lexikalische Schärfe abschwächen.
theological_decisions:
- issue: Mögliche Abschwächung der gewaltsamen Vergeltungssprache
  choice: sich an ihren Feinden zu rächen
  alternative: sich gegen ihre Feinde zu verteidigen
  rationale: Obwohl der weitere Zusammenhang auch Selbstschutz einschließt, bezeichnet נקם in diesem Vers ausdrücklich Rache beziehungsweise Vergeltung. Die Übersetzung bewahrt diese Spannung, statt sie interpretierend zu mildern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die amtliche Sprache des Verses bleibt erkennbar, ohne die hebräische Syntax unnötig nachzuahmen. „Öffentlich bekannt gemacht“ verdeutlicht den Publikationscharakter, während „sich rächen“ die unbequeme, aber eindeutige Wortwahl der Quelle bewahrt.
