base_translation:
  language: en
  yaml_path: translation/ot/esther/008/011.yaml
  text: that the king granted the Jews in every single city to assemble and to stand for their lives[a], to destroy, to kill, and to annihilate every armed force of any people or province that might attack them, including children and women[b], and to plunder their spoil.
translation:
  language: de
  text: dass der König den Juden in jeder einzelnen Stadt gestattete, sich zu versammeln und für ihr Leben einzustehen, jede Streitmacht eines Volkes oder einer Provinz, die ihnen feindlich gegenüberstand[a], zu vernichten, zu töten und auszurotten, samt Kindern und Frauen[b], und ihre Habe zu plündern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sie bedrängte“; im Zusammenhang auch: „die sie angreifen würde“. Das hebräische Partizip bezeichnet Menschen, die sich ihnen gegenüber als Feinde verhalten oder sie bedrängen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Kinder und Frauen“. Der Wortlaut des Erlasses bezieht sie ausdrücklich in die zuvor genannte gegnerische Gruppe ein.'
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר נָתַן
  choice: dass der König … gestattete
  rationale: Der Relativanschluss setzt den Inhalt des Erlasses aus dem vorhergehenden Vers fort. „Gestattete“ gibt die königliche Ermächtigung im rechtlich-administrativen Zusammenhang natürlich wieder.
- source_word: בְּכָל עִיר וָעִיר
  choice: in jeder einzelnen Stadt
  rationale: Die distributive Wiederholung betont ausnahmslose Geltung; „in jeder einzelnen Stadt“ bildet diese Hervorhebung in natürlichem Deutsch ab.
- source_word: לְהִקָּהֵל
  choice: sich zu versammeln
  rationale: Der Nifal-Infinitiv bezeichnet das Zusammenkommen zu einer Gruppe; die reflexive deutsche Form gibt dies klar und idiomatisch wieder.
- source_word: וְלַעֲמֹד עַל נַפְשָׁם
  choice: und für ihr Leben einzustehen
  rationale: Die Formulierung bewahrt das konkrete Bild von „stehen/eintreten“ und vermittelt zugleich den defensiven Sinn, ohne ihn vollständig zur Paraphrase „sich verteidigen“ aufzulösen.
- source_word: לְהַשְׁמִיד וְלַהֲרֹג וּלְאַבֵּד
  choice: zu vernichten, zu töten und auszurotten
  rationale: Alle drei bewusst gehäuften Tötungs- und Vernichtungsverben werden mit jeweils eigenem deutschen Verb wiedergegeben; die Härte der Erlasssprache bleibt ungeschmälert.
- source_word: כָּל חֵיל עַם וּמְדִינָה
  choice: jede Streitmacht eines Volkes oder einer Provinz
  rationale: חֵיל bezeichnet hier im Zusammenhang bewaffneter Gegenwehr eine militärische Macht oder Truppe. Die Konstruktion mit „eines Volkes oder einer Provinz“ bewahrt den umfassenden ethnisch-politischen Bezug.
- source_word: הַצָּרִים אֹתָם
  choice: die sie angreifen würde
  rationale: Das Partizip von צרר bezeichnet feindliches Vorgehen oder Bedrängen. Im prospektiven Erlasskontext bringt „angreifen würde“ die konkrete feindliche Handlung zum Ausdruck, während die Fußnote die lexikalische Alternative offenhält.
- source_word: טַף וְנָשִׁים
  choice: samt Kindern und Frauen
  rationale: טַף bezeichnet Kinder beziehungsweise abhängige kleine Angehörige. „Samt“ lässt erkennen, dass die Genannten in den Umfang der feindlichen Gruppe einbezogen werden, ohne die ethische Härte zu verdecken.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: und ihre Habe zu plündern
  rationale: Die deutsche Wendung gibt die Ermächtigung zur Wegnahme des gegnerischen Besitzes natürlich wieder und vermeidet die unidiomatische etymologische Doppelung „ihre Beute zu erbeuten“.
theological_decisions:
- issue: Gewaltsprache des königlichen Erlasses
  choice: Die dreifache Vernichtungsformel wird direkt wiedergegeben und zugleich im Rahmen der Abwehr eines Angriffs belassen.
  alternative: Die Aussage zu „besiegen“ oder allgemein „sich gegen Angreifer verteidigen“ abschwächen.
  rationale: Der hebräische Text gebraucht drei kumulative Verben für tödliche Vernichtung und ermächtigt außerdem zur Plünderung. Diese Härte darf nicht beschönigt werden; die Wendung über das Einstehen für das eigene Leben und das feindliche Vorgehen wahrt zugleich den defensiven Rahmen.
- issue: Bezug von „Kinder und Frauen“
  choice: Die Wörter werden transparent als in die Zielgruppe des Erlasses einbezogen wiedergegeben.
  alternative: Die Wendung auslassen, verschleiern oder syntaktisch von der gegnerischen Streitmacht lösen.
  rationale: Die Stellung der Wörter bezieht sie am natürlichsten auf die zuvor genannte feindliche Gruppe. Die Übersetzung bewahrt die moralische Spannung, statt sie durch Umformulierung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem formellen Ton eines königlichen Erlasses. Der mit „dass“ beginnende Satz wahrt den syntaktischen Anschluss an den vorhergehenden Vers. Gewalt und moralische Spannung werden weder archaisierend verstärkt noch beschönigt.
