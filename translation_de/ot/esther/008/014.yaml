translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Dringlichkeit des Hebräischen bleibt durch »in aller Eile« und »angetrieben« erhalten; die unsichere Identifikation der Reittiere wird nicht im Haupttext überpräzisiert.
