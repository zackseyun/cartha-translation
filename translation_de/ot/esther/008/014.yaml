base_translation:
  language: en
  yaml_path: translation/ot/esther/008/014.yaml
  text: The couriers[a], mounted on the royal steeds, went out hastened and pressed on by the king’s command, and the decree was issued in Susa the citadel.
translation:
  language: de
  text: Die Eilboten[a], die auf Reittieren, den Achaschtranern, ritten, setzten sich in aller Eile in Bewegung, angetrieben durch den Befehl des Königs; und der Erlass wurde in der Festung Susa verkündet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Bezeichnungen für diese Reittiere sind selten und ihre genaue Bedeutung ist unsicher. »Achaschtraner« gibt die zweite Bezeichnung in Transkription wieder; möglicherweise sind besonders gezüchtete oder für den königlichen Dienst bestimmte Pferde gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: die Eilboten
  rationale: Das Wort bezeichnet wörtlich Laufende, im persischen Reichskontext jedoch die Überbringer königlicher Depeschen. »Eilboten« gibt Funktion und Dringlichkeit natürlich wieder.
- source_word: רֹכְבֵי הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים
  choice: die auf den königlichen Pferden ritten
  rationale: Die beiden seltenen Bezeichnungen für die Reittiere werden wegen ihrer unsicheren genauen Bedeutung nicht künstlich zoologisch präzisiert. Der königliche Postdienst ist aus dem Zusammenhang erschließbar; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: יָצְאוּ מְבֹהָלִים וּדְחוּפִים
  choice: zogen in aller Eile aus, angetrieben
  rationale: Die Formulierung bewahrt sowohl die große Eile als auch den äußeren Druck, den die beiden passiven Partizipien ausdrücken.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: vom Befehl des Königs
  rationale: דבר bezeichnet hier nicht bloß ein gesprochenes Wort, sondern die verbindliche königliche Anordnung.
- source_word: וְהַדָּת נִתְּנָה
  choice: und … wurde der Erlass verkündet
  rationale: Das wörtliche »wurde gegeben« bezeichnet im Verwaltungskontext die amtliche Bekanntmachung eines Erlasses.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: in der Festung Susa
  rationale: הַבִּירָה bezeichnet hier den befestigten Residenz- beziehungsweise Burgbezirk von Susa; »Festung Susa« ist verständlich und hält die Ortsbezeichnung kompakt.
