  yaml_path: translation/ot/esther/008/012.yaml
  text: on one day in all the provinces of King Ahasuerus, on the thirteenth day of the twelfth month, that is, the month Adar.
translation:
  language: de
  text: an einem Tag in allen Provinzen des Königs Ahasveros, am dreizehnten Tag des zwölften Monats, nämlich des Monats Adar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם אֶחָד
  choice: an einem einzigen Tag
  rationale: Die Präposition בְּ ist temporal. „An einem einzigen Tag“ gibt die Betonung des Zahlworts אֶחָד natürlich wieder und passt syntaktisch zur Fortsetzung des Satzes.
- source_word: בְּכָל מְדִינוֹת
  choice: in allen Provinzen
  rationale: מְדִינוֹת bezeichnet die Verwaltungsprovinzen des Perserreichs; die knappe Ortsangabe entspricht dem Hebräischen.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: des Königs Ahasveros
  rationale: Die Verbindung bezeichnet die Provinzen, die König Ahasveros unterstehen. „Ahasveros“ ist die im Deutschen etablierte Form des Namens.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר
  choice: am dreizehnten Tag
  rationale: Die Kardinalzahl fungiert in der Datumsformel ordinal; „Tag“ wird zur natürlichen und eindeutigen deutschen Wiedergabe ergänzt.
- source_word: לְחֹדֶשׁ שְׁנֵים עָשָׂר
  choice: des zwölften Monats
  rationale: Die Formulierung setzt die Datumsangabe fort und wird im Deutschen idiomatisch als Genitiv wiedergegeben.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: das ist der Monat Adar
  rationale: הוּא führt hier eine erläuternde Apposition ein und nennt den zwölften Monat beim Namen.
