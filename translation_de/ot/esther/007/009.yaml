  to: 'Da sagte Harbona, einer der Eunuchen im Dienst des Königs: »Sieh doch: Auch bei Hamans Haus steht der Galgen[a], den Haman für Mordechai errichtet hat – für den Mann, der zugunsten des Königs gesprochen hat.[b] Er ist fünfzig Ellen hoch.« Da sagte der König: »Hängt Haman daran auf![c]«'
