translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt lebendig, ohne archaisches »Siehe«. Die Satzstellung hebt Harbonas überraschenden Hinweis hervor. »Galgen« sorgt für unmittelbare Verständlichkeit, während die Fußnoten die wörtliche Holz-Terminologie und die Unsicherheit über die Hinrichtungsart offenhalten.
