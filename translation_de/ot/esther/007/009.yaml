  text: וַ/יֹּ֣אמֶר חַ֠רְבוֹנָה אֶחָ֨ד מִן הַ/סָּרִיסִ֜ים לִ/פְנֵ֣י הַ/מֶּ֗לֶךְ גַּ֣ם הִנֵּה הָ/עֵ֣ץ אֲשֶׁר עָשָׂ֪ה הָמָ֟ן לְֽ/מָרְדֳּכַ֞י אֲשֶׁ֧ר דִּבֶּר ט֣וֹב עַל הַ/מֶּ֗לֶךְ עֹמֵד֙ בְּ/בֵ֣ית הָמָ֔ן גָּבֹ֖הַּ חֲמִשִּׁ֣ים אַמָּ֑ה וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ תְּלֻ֥/הוּ עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/009.yaml
  text: Then Harbonah[a], one of the eunuchs before the king, said, “Also, behold, the gallows that Haman made for Mordecai, who spoke good for the king, is standing at Haman’s house, fifty cubits high.” And the king said[c][b], “Hang him on it.”
translation:
  language: de
  text: 'Da sagte Harbona, einer der Eunuchen im Dienst des Königs: »Sieh doch: Auch bei Hamans Haus steht der Galgen[a], den Haman für Mordechai errichtet hat – für den Mann, der zugunsten des Königs gesprochen hat.[b] Er ist fünfzig Ellen hoch.« Da sagte der König: »Hängt Haman daran auf![c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Holz« oder »der Baum«. Gemeint ist ein hölzernes Hinrichtungsgerät; seine genaue Bauart wird nicht beschrieben.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »der zum Wohl des Königs gesprochen hat« oder »der Gutes über den König gesagt hat«.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: »Pfählt ihn daran.« Das hebräische Verb bezeichnet das Aufhängen an einer hölzernen Struktur; die genaue Hinrichtungsart bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבוֹנָה
  choice: Harbona
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: הַסָּרִיסִים
  choice: Eunuchen
  rationale: Das Wort bezeichnet am persischen Königshof am unmittelbarsten Eunuchen, kann jedoch allgemeiner auch Hofbeamte meinen.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: im Dienst des Königs
  rationale: Die Wendung bezeichnet hier die Hofstellung und Anwesenheit beim König; die gewählte Form ist natürliches Deutsch und wahrt den höfischen Zusammenhang.
- source_word: גַּם הִנֵּה
  choice: Sieh doch! … auch
  rationale: Die Verteilung auf Ausruf und Adverb erhält sowohl den hinweisenden Nachdruck als auch die additive Bedeutung.
- source_word: הָעֵץ
  choice: Galgen
  rationale: Wörtlich steht hier „das Holz/der Baum“. Im Zusammenhang ist ein hölzernes Hinrichtungsgerät gemeint; „Galgen“ ist verständlich und traditionell, ohne die genaue antike Bauart als sicher auszugeben, die deshalb in einer Fußnote erläutert wird.
- source_word: עָשָׂה ... לְמָרְדֳּכַי
  choice: für Mordechai errichten ließ
  rationale: „Errichten ließ“ gibt in diesem baulichen Kontext das allgemeine Verb „machen“ idiomatisch wieder; die Präposition bezeichnet Mordechai als vorgesehenes Opfer.
- source_word: דִּבֶּר טוֹב עַל הַמֶּלֶךְ
  choice: zugunsten des Königs gesprochen hat
  rationale: Die Formulierung bewahrt den Nutzen für den König, ohne den Satz ausdrücklich auf die Aufdeckung des Anschlags festzulegen.
- source_word: עֹמֵד בְּבֵית הָמָן
  choice: bei Hamans Haus steht
  rationale: Das Partizip bezeichnet den gegenwärtigen Zustand; „bei Hamans Haus“ lässt offen, ob das Gerät im Hausbereich oder auf dem Anwesen steht.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: fünfzig Ellen hoch
  rationale: Die antike Maßeinheit bleibt aus formaler Treue im Haupttext erhalten.
- source_word: תְּלֻהוּ עָלָיו
  choice: Hängt Haman daran auf
  rationale: Das Verb bedeutet aufhängen beziehungsweise an einem Holz befestigen. Der Eigenname verdeutlicht im Deutschen den Objektbezug; eine Fußnote wahrt die mögliche Hinrichtungsart durch Pfählung.
