  text: וַ/יֹּ֨אמֶר֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וַ/יֹּ֖אמֶר לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֑ה מִ֣י ה֥וּא זֶה֙ וְ/אֵֽי זֶ֣ה ה֔וּא אֲשֶׁר מְלָא֥/וֹ לִבּ֖/וֹ לַ/עֲשׂ֥וֹת כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/005.yaml
  text: Then King Ahasuerus said to Esther the queen[a], “Who is he, and where is he[b], who has filled his heart to do this?”
translation:
  language: de
  text: 'Da ergriff König Ahasveros das Wort und sagte zu Königin Ester: »Wer ist es, und wo ist er[a], der es gewagt hat[b], so etwas zu tun?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, weniger wahrscheinlich: »und welcher ist es?« Dann würde die Frage die Person näher bestimmen, statt nach ihrem Aufenthaltsort zu fragen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: »dessen Herz ihn erfüllt hat, dies zu tun«; die hebräische Wendung bedeutet, dass jemand es wagt oder sich anmaßt, so etwas zu tun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Da ergriff ... das Wort und sagte
  rationale: Die Wiederholung von »sagen« wird in natürliches deutsches Erzählen übertragen, ohne den einleitenden und den an Ester gerichteten Redeakt miteinander zu verschmelzen.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: König Ahasveros
  rationale: Der Titel steht nach üblichem deutschem Sprachgebrauch vor dem entsprechend dem Hebräischen wiedergegebenen Namen.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: zu Königin Ester
  rationale: Die hebräische Apposition »zu Ester, der Königin« wird idiomatisch als Titel und Name wiedergegeben.
- source_word: מִי הוּא זֶה
  choice: Wer ist es
  rationale: Die emphatische Frage nach der Identität bleibt erhalten, ohne das im Hebräischen nicht ausdrücklich vorhandene Wort »Mann« hinzuzufügen.
- source_word: וְאֵי זֶה הוּא
  choice: und wo ist er
  rationale: אֵי wird in seinem üblichen lokalen Sinn als Frage nach dem Aufenthaltsort verstanden; die weniger wahrscheinliche identifizierende Deutung wird in einer Fußnote genannt.
- source_word: אֲשֶׁר מְלָאוֹ לִבּוֹ
  choice: der es gewagt hat
  rationale: Die hebräische Herz-Wendung bezeichnet idiomatisch den inneren Entschluss beziehungsweise die Kühnheit, eine solche Tat zu unternehmen. Natürliches Deutsch gibt dies mit »es gewagt hat« wieder; das Bild wird in der Fußnote dokumentiert.
- source_word: לַעֲשׂוֹת כֵּן
  choice: so etwas zu tun
  rationale: כֵּן verweist auf das unmittelbar zuvor geschilderte Vorhaben. »So etwas« gibt diesen Rückbezug im Deutschen natürlich und mit dem empörten Ton der Frage wieder.
