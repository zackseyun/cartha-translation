  to: 'Da antwortete Königin Ester: „Wenn ich Gunst in deinen Augen gefunden habe, König, und wenn es dem König gefällt, dann möge mir auf meine Bitte hin mein Leben gewährt werden und auf mein Ersuchen hin mein Volk.“'
