base_translation:
  language: en
  yaml_path: translation/ot/esther/007/003.yaml
  text: Then Queen Esther answered and said[a], “If I have found favor in your eyes, O king, and if it pleases the king, let my life be given me at my petition, and my people at my request.”
translation:
  language: de
  text: 'Da antwortete Königin Ester: „Wenn ich Gunst in deinen Augen gefunden habe, König, und wenn es dem König gefällt, dann möge mir auf meine Bitte hin mein Leben gewährt werden und auf mein Ersuchen hin mein Volk.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַר
  choice: Da antwortete ...
  rationale: Die feste hebräische Redeeinleitung enthält wörtlich sowohl „antworten“ als auch „sagen“. Im heutigen Deutschen genügt „antwortete“; eine Wiedergabe als „antwortete und sagte“ wäre unnötig schwerfällig.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Königin Ester
  rationale: Die appositionelle Verbindung wird im Deutschen natürlich als Titel vor dem Namen wiedergegeben.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Wenn ich Gunst in deinen Augen gefunden habe
  rationale: Die höfische Formel und ihr hebräisches Bild bleiben erhalten und sind im Deutschen verständlich.
- source_word: הַמֶּלֶךְ
  choice: König
  rationale: Das Substantiv fungiert als respektvolle direkte Anrede. Der bloße Titel ist im Deutschen würdig und natürlicher als ein archaisches „o König“.
- source_word: וְאִם עַל הַמֶּלֶךְ טוֹב
  choice: und wenn es dem König gefällt
  rationale: Die idiomatische Wendung bezeichnet das Wohlgefallen beziehungsweise die Zustimmung des Königs.
- source_word: תִּנָּתֶן לִי נַפְשִׁי
  choice: dann möge mir ... mein Leben geschenkt werden
  rationale: „Leben“ gibt נֶפֶשׁ im drohenden Todeskontext sachgerecht wieder. Die passive Form des Hebräischen bleibt bewahrt; „möge“ kennzeichnet die Bitte natürlich.
- source_word: בִּשְׁאֵלָתִי
  choice: auf meine Bitte hin
  rationale: Die Formulierung gibt sowohl den Anlass beziehungsweise die Grundlage als auch den höfischen Charakter der שְׁאֵלָה wieder.
- source_word: וְעַמִּי בְּבַקָּשָׁתִי
  choice: und auf mein Ersuchen hin mein Volk
  rationale: Die parallele Satzgestalt bleibt erhalten. „Ersuchen“ wahrt die lexikalische Variation zwischen שְׁאֵלָה und בַּקָּשָׁה, ohne einen Bedeutungsunterschied zu überzeichnen.
theological_decisions: []
