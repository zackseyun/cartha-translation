  yaml_path: translation/ot/esther/007/001.yaml
  text: So the king and Haman came to drink with Queen Esther[a].
translation:
  language: de
  text: Da kamen der König und Haman, um mit Königin Ester zu trinken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kamen
  rationale: Das Wayyiqtol führt die Erzählung mit einem einfachen vergangenen Ereignis fort. »Da kamen« gibt sowohl die Bewegung als auch den erzählerischen Anschluss natürlich wieder; »traten ein« wäre spezifischer, als das Verb allein verlangt.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die bestimmte Form wird direkt wiedergegeben; der König ist aus dem Zusammenhang bekannt.
- source_word: וְהָמָן
  choice: und Haman
  rationale: Die Konjunktion und der Eigenname werden unmittelbar wiedergegeben.
- source_word: לִשְׁתּוֹת
  choice: um … zu trinken
  rationale: Der Infinitiv von שׁתה bezeichnet das Trinken. Obwohl der Kontext ein Festmahl nahelegt, nennt der hebräische Text weder ausdrücklich Wein noch allgemein das Feiern.
- source_word: עִם
  choice: bei
  rationale: In Verbindung mit »trinken« drückt »bei Königin Ester« die gemeinschaftliche Teilnahme in natürlichem Deutsch aus. Das formal nähere »mit« wäre ebenfalls möglich.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Königin Ester
  rationale: Die hebräische Apposition lautet wörtlich »Ester, die Königin«. Die Voranstellung des Titels entspricht natürlichem deutschen Sprachgebrauch, ohne den Sinn zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Bezug zur hebräischen Syntax. Die Formulierung bewahrt den ausdrücklichen Bezug auf das Trinken und erweitert ihn nicht zu »speisen« oder »feiern«.
