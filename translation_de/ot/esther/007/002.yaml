  register: Modernes, würdiges Standarddeutsch mit höfischem Ton. »Weingelage« ist knapp und quellenah, ohne altertümliche Satzstellung; »Bitte« und »Begehren« spiegeln die hebräische Wortvariation zurückhaltend wider.
