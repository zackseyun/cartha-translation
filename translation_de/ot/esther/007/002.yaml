base_translation:
  language: en
  yaml_path: translation/ot/esther/007/002.yaml
  text: And the king said to Esther on the second day also[a], at the banquet of wine, “What is your petition, Queen Esther? It will be granted to you. And what is your request? Even to half the kingdom[b], it shall be done.”
translation:
  language: de
  text: 'Und auch am zweiten Tag sagte der König beim Weinmahl zu Ester: »Was ist deine Bitte, Königin Ester? Sie wird dir gewährt werden. Und was ist dein Anliegen? Bis zur Hälfte des Königreichs[a] – es wird geschehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung »bis zur Hälfte des Königreichs« ist eine übliche königliche Formel für außergewöhnliche Gunst; sie muss nicht als wörtliches Angebot verstanden werden, das Reich zu teilen.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם בַּיּוֹם הַשֵּׁנִי
  choice: Und auch am zweiten Tag
  rationale: Bewahrt sowohl die Fortsetzungspartikel גַּם als auch die ausdrückliche Zeitangabe und knüpft natürlich an das erste Gastmahl an.
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: beim Weingelage
  rationale: Gibt die konkrete Verbindung von Festmahl und Wein knapp und idiomatisch wieder; der Ausdruck bezeichnet hier das festliche Trinken beim Gastmahl.
- source_word: מַה שְּׁאֵלָתֵךְ
  choice: Was ist deine Bitte
  rationale: Bitte entspricht dem förmlichen Ersuchen im höfischen Zusammenhang, ohne im heutigen Deutsch unnötig amtlich zu klingen.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Königin Ester
  rationale: Die im Deutschen natürliche Titelstellung erhält die ehrende Anrede des Hebräischen.
- source_word: וְתִנָּתֵן לָךְ
  choice: Sie soll dir gewährt werden
  rationale: Das feminine Pronomen nimmt die Bitte auf; gewährt werden gibt die königliche Zusage natürlich und mit ihrer performativen Kraft wieder.
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: Und was ist dein Begehren?
  rationale: Begehren wahrt die lexikalische Variation gegenüber שְׁאֵלָה, ohne einen scharfen Bedeutungsunterschied zu behaupten.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Bis zur Hälfte des Königreichs
  rationale: Folgt der unpersönlicheren hebräischen Formulierung mit bestimmtem Artikel und bewahrt den Umfang der königlichen Zusage.
- source_word: וְתֵעָשׂ
  choice: es soll erfüllt werden
  rationale: Bezieht sich sinngemäß auf das Begehren und vermittelt die zugesicherte Ausführung natürlicher als das wörtliche 'es soll getan werden'.
theological_decisions: []
