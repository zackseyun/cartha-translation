  to: Denn man hat uns verkauft, mich und mein Volk, um uns zu vernichten, zu töten und auszulöschen. Wären wir nur als Sklaven und Sklavinnen verkauft worden, hätte ich geschwiegen; denn der Gegner würde den Schaden für den König[a] nicht aufwiegen.
  rationale: Eine sichere Korrektur der schwer verständlichen Schlusswendung ist erforderlich. „Würde ... nicht aufwiegen“ gibt die hebräische Vergleichs- und Ausgleichsvorstellung in der irrealen Bedingungssatzkonstruktion idiomatisch wieder. Die Fußnote bleibt als lexikalische Alternative erhalten und wahrt die Offenheit hinsichtlich der Art des königlichen Schadens.
