    rationale: Die Aussage besagt im Kontext, dass der Gegner beziehungsweise die Angelegenheit den dem König entstehenden Schaden nicht ausgleichen oder aufwiegen könnte. Die vorgeschlagene Revision formuliert dies verständlich, ohne die umstrittene konkrete Art des Schadens festzulegen.
