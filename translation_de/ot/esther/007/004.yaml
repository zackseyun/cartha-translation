base_translation:
  language: en
  yaml_path: translation/ot/esther/007/004.yaml
  text: For we have been sold[a], I and my people, to be destroyed, to be killed, and to perish. But if we had been sold as male servants and female servants, I would have kept silent, for the adversary is not worth the damage to the king.
translation:
  language: de
  text: Denn man hat uns verkauft, mich und mein Volk, um uns zu vernichten, zu töten und auszulöschen. Wären wir nur als Sklaven und Sklavinnen verkauft worden, hätte ich geschwiegen; denn der Gegner würde den Schaden für den König[a] nicht aufwiegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Verlust des Königs“. Der hebräische Ausdruck kann Schaden, Beeinträchtigung oder einen finanziellen Verlust des Königs bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְכַּרְנוּ
  choice: man hat uns verkauft
  rationale: Das passive Verb bezeichnet grundsätzlich ein Verkauftwerden. Die deutsche Formulierung bewahrt das Handelsbild und bereitet zugleich den Gegensatz zum Verkauf in die Sklaverei vor.
- source_word: עַמִּי
  choice: mein Volk
  rationale: עַם bezeichnet hier Esters ethnisch-nationale Gemeinschaft; „mein Volk“ ist im Deutschen natürlich und wahrt ihre ausdrückliche Identifikation mit ihr.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: um uns zu vernichten, zu töten und auszulöschen
  rationale: Die drei annähernd synonymen Infinitive werden als rhetorische Dreierfolge erhalten. Das im Deutschen ergänzte „uns“ verdeutlicht das gemeinsame Objekt, ohne den Sinn zu erweitern.
- source_word: וְאִלּוּ
  choice: Wären wir nur
  rationale: Die Formulierung gibt den irrealen, kontrastierenden Bedingungssatz idiomatisch wieder. „Nur“ kennzeichnet die versklavte Lage als das geringere, hypothetische Übel.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: als Sklaven und Sklavinnen
  rationale: Die beiden hebräischen Bezeichnungen unterscheiden ausdrücklich männliche und weibliche Versklavte. „Sklaven und Sklavinnen“ wahrt diese Unterscheidung sowie die Härte des Abhängigkeitsverhältnisses.
- source_word: הֶחֱרַשְׁתִּי
  choice: hätte ich geschwiegen
  rationale: Das Perfekt steht hier im irrealen Folgesatz. Die gewählte Formulierung gibt sowohl das Schweigen als auch den kontrafaktischen Sinn knapp wieder.
- source_word: הַצָּר
  choice: der Widersacher
  rationale: Das Substantiv bezeichnet einen feindlich handelnden Gegner und bezieht sich im Zusammenhang auf Haman. „Widersacher“ passt zum höfischen Kontext, ohne die Bedeutung unnötig zu verengen.
- source_word: שֹׁוֶה
  choice: ist … nicht wert
  rationale: Das Partizip bezeichnet Gleichwertigkeit oder entsprechenden Wert. Die Formulierung erhält das Wert- und Vergleichsmotiv der schwierigen Schlusswendung.
- source_word: בְּנֵזֶק הַמֶּלֶךְ
  choice: den Schaden für den König
  rationale: נזק kann Schaden, Beeinträchtigung oder finanziellen Verlust bezeichnen. „Schaden für den König“ hält die Art des königlichen Nachteils bewusst offen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die eindringliche Dreierfolge der Vernichtungsbegriffe und die Geschlechterpaarung bei der Sklaverei bleiben erhalten. Die schwer deutbare Schlusswendung wird eng am masoretischen Wortlaut wiedergegeben und nicht auf eine ausschließlich finanzielle oder politische Deutung festgelegt.
