  source_fidelity: 'Die Übersetzung gibt Esters Identifikation mit „meinem Volk“, das Bild des Verkaufens, die dreifache Vernichtungsformel, den kontrafaktischen Gegensatz zur Versklavung sowie die offene Bedeutung von נֵזֶק angemessen wieder. Die Schlusswendung ist jedoch im Entwurf semantisch und syntaktisch nicht tragfähig: שֹׁוֶה בְּנֵזֶק bezeichnet hier nicht, dass der Gegner den Schaden „wert“ sei, sondern dass er den dem König entstehenden Schaden nicht aufwiegen bzw. ausgleichen könne.'
  naturalness: Der Satz „der Widersacher ist den Schaden für den König nicht wert“ ist im modernen Standarddeutsch unidiomatisch. „Der Gegner würde den Schaden für den König nicht aufwiegen“ ist natürlich, bewahrt die im Hebräischen vorhandene bildhafte Vergleichs- bzw. Ausgleichsvorstellung und lässt die genaue Art des Schadens offen.
  terminology: „Volk“, „Sklaven und Sklavinnen“ und „Gegner“ sind angemessen. „Gegner“ ist gegenüber dem etwas gehobenen „Widersacher“ in diesem Satz natürlicher, ohne הַצָּר einzuengen. Die Trias „vernichten, töten und auslöschen“ wahrt die rhetorische Häufung des Hebräischen.
