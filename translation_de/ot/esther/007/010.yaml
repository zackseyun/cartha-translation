  text: וַ/יִּתְלוּ֙ אֶת הָמָ֔ן עַל הָ/עֵ֖ץ אֲשֶׁר הֵכִ֣ין לְ/מָרְדֳּכָ֑י וַ/חֲמַ֥ת הַ/מֶּ֖לֶךְ שָׁכָֽכָה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/010.yaml
  text: So they hanged Haman on the gallows that he had prepared for Mordecai[a], and the king’s wrath subsided.
translation:
  language: de
  text: Da hängten sie Haman an das Holz, das er für Mordechai vorbereitet hatte.[a] Und der Zorn des Königs legte sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da pfählten sie Haman auf einen Pfahl, den er für Mordechai vorbereitet hatte.“ Das hebräische Wort עֵץ kann „Baum“, „Holz“ oder „Pfahl“ bedeuten; das Verb bezeichnet allgemein ein Aufhängen. Die genaue Art der Hinrichtung ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְלוּ
  choice: Da hängten sie
  rationale: תלה bezeichnet das Aufhängen oder Aufhängenlassen. „hängten“ wahrt die allgemeine Aussage des Hebräischen, ohne die genaue Hinrichtungsart im Haupttext festzulegen.
- source_word: הָמָן
  choice: Haman
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: עַל הָעֵץ
  choice: an das Holz
  rationale: עֵץ kann „Baum“, „Holz“ oder einen hölzernen Pfahl beziehungsweise eine Hinrichtungsvorrichtung bezeichnen. „das Holz“ erhält die lexikalische Breite und passt zu dem zuvor errichteten Gegenstand.
- source_word: אֲשֶׁר הֵכִין לְמָרְדֳּכָי
  choice: das er für Mordechai hatte errichten lassen
  rationale: הכין bedeutet „bereiten, bereitmachen, herrichten“. Im Erzählzusammenhang war die Vorrichtung bereits auf Hamans Veranlassung hergestellt worden; „hatte errichten lassen“ ist natürliches Deutsch und bewahrt die erzählerische Ironie.
- source_word: וַחֲמַת הַמֶּלֶךְ
  choice: Und der Zorn des Königs
  rationale: חֵמָה bezeichnet heftigen Zorn oder Grimm. „Zorn“ ist würdig, verständlich und bewahrt die Intensität.
- source_word: שָׁכָכָה
  choice: legte sich
  rationale: שׁכך bedeutet „nachlassen, sich beruhigen“. Die deutsche Wendung „der Zorn legte sich“ ist gegenwärtig, idiomatisch und inhaltlich genau.
theological_decisions:
- issue: Genaue Hinrichtungsart
  choice: Der Haupttext lässt mit „hängten … an das Holz“ offen, ob Haman erhängt, gepfählt oder auf andere Weise an einer hölzernen Vorrichtung aufgehängt wurde.
  alternative: „Sie erhängten Haman am Galgen“ oder „sie pfählten Haman auf dem Pfahl“.
  rationale: Das Hebräische benennt das Aufhängen und das Holz, legt aber die technische Ausführung nicht eindeutig fest. Die vorhandene historische und lexikalische Spannung wird daher nicht zugunsten einer bestimmten Rekonstruktion aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt flüssig und verständlich, vermeidet aber das enger festgelegte „Galgen“, um die Mehrdeutigkeit von תלה und עֵץ zu erhalten. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Aussage.
