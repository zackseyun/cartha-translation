  source_fidelity: Die Wiedergabe von וַיִּתְלוּ und עַל־הָעֵץ als „hängten ... an das Holz“ bewahrt die im Hebräischen bestehende Unbestimmtheit hinsichtlich der konkreten Hinrichtungsart angemessen. „hatte errichten lassen“ geht jedoch über הֵכִין („vorbereitet, bereitgemacht“) hinaus und fügt sowohl die Errichtung als auch eine Veranlassung durch Haman ausdrücklich ein.
  naturalness: Der Vers ist insgesamt verständlich und im würdigen modernen Standarddeutsch gehalten. „an das Holz“ ist bewusst bildungs- bzw. bibelsprachlich, aber angesichts der lexikalischen Offenheit vertretbar. Die korrigierte Formulierung „vorbereitet hatte“ ist zugleich idiomatischer und quellentreuer.
  terminology: Haman und Mordechai sind etablierte deutsche Namensformen. „Zorn des Königs legte sich“ trifft חֵמָה und שָׁכָכָה präzise. Die Fußnote soll die Alternative als mögliche historische Rekonstruktion, nicht als gesicherte Übersetzung, kennzeichnen.
