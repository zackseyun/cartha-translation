  - severity: low
    issue: Die Alternativformulierung „auf dem Pfahl“ ist bei „pfählen“ syntaktisch ungenau.
    rationale: Für die mit dem Verb bezeichnete Bewegung bzw. das Aufspießen ist „auf einen Pfahl“ die angemessene Konstruktion. Die Fußnote sollte zudem klarstellen, dass dies eine mögliche Deutung und keine gesicherte technische Beschreibung ist.
