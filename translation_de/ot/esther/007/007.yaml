base_translation:
  language: en
  yaml_path: translation/ot/esther/007/007.yaml
  text: Then the king rose in his wrath from the wine banquet and went into the palace garden[a], but Haman remained to beg Queen Esther for his life[c][b], for he saw that the evil against him had been determined by the king.
translation:
  language: de
  text: Da stand der König in seinem Zorn vom Weingelage auf und ging in den Palastgarten.[a] Haman aber blieb zurück, um Königin Ester um sein Leben anzuflehen; denn er sah, dass das Unheil gegen ihn vom König beschlossen war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Palastgarten“ kann auch mit „Garten des Pavillons“ oder „Garten des Palastkomplexes“ wiedergegeben werden.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „dass das Unheil gegen ihn vom König her beschlossen war“. Das hebräische Wort kann „Unheil“, „Unglück“ oder „Verderben“ bezeichnen; die Wendung macht deutlich, dass die Entscheidung des Königs feststand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲמָתוֹ
  choice: in seinem Zorn
  rationale: חֵמָה bezeichnet heftigen, aufflammenden Zorn; „Zorn“ bewahrt die Intensität und passt zum würdigen Erzählstil.
- source_word: מִמִּשְׁתֵּה הַיַּיִן
  choice: vom Weingelage
  rationale: מִשְׁתֶּה bezeichnet ein Festmahl, häufig mit dem Aspekt des Trinkens. „Weingelage“ gibt die ausdrückliche Nennung des Weins knapp und natürlich wieder.
- source_word: גִּנַּת הַבִּיתָן
  choice: in den Palastgarten
  rationale: גִּנָּה bedeutet „Garten“; בִּיתָן kann einen Palast, Pavillon oder Palastkomplex bezeichnen. „Palastgarten“ ist im persischen Hofkontext klar und idiomatisch.
- source_word: עָמַד
  choice: blieb zurück
  rationale: Wörtlich bedeutet das Verb „stand“, doch im Kontrast zum Fortgehen des Königs bezeichnet es hier natürlich Hamans Zurückbleiben.
- source_word: לְבַקֵּשׁ עַל נַפְשׁוֹ
  choice: um sein Leben anzuflehen
  rationale: Die Wendung bedeutet, eindringlich um die Bewahrung des eigenen Lebens zu bitten. „Anflehen“ vermittelt Hamans Verzweiflung.
- source_word: מֵאֶסְתֵּר הַמַּלְכָּה
  choice: Königin Ester
  rationale: Die Voranstellung des Titels entspricht natürlichem modernem Deutsch und bewahrt den vollen Bezug.
- source_word: כִּי רָאָה
  choice: denn er sah
  rationale: כִּי leitet hier den Grund für Hamans Flehen ein; „denn“ fügt sich gut in den erzählenden Stil.
- source_word: כִּי כָלְתָה אֵלָיו הָרָעָה מֵאֵת הַמֶּלֶךְ
  choice: dass der König sein Unheil beschlossen hatte
  rationale: Die Konstruktion drückt aus, dass das vonseiten des Königs kommende Unheil für Haman feststand. Die aktive Form ist im Deutschen natürlich, ohne die gerichtliche Endgültigkeit abzuschwächen.
