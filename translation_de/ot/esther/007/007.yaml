translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzbewegung bewahrt den Kontrast zwischen dem Fortgehen des zornigen Königs und Hamans verzweifeltem Zurückbleiben. „Ester“ folgt der im Deutschen gebräuchlichen Namensform.
