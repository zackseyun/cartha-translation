  yaml_path: translation/ot/esther/007/006.yaml
  text: And Esther said, “A hostile and enemy man—this evil Haman!” Then Haman was terrified before the king and the queen.
translation:
  language: de
  text: 'Da sagte Ester: »Ein Bedränger und Feind – dieser böse Haman!« Da erschrak Haman vor dem König und der Königin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ צַר וְאוֹיֵב
  choice: Ein Bedränger und Feind
  rationale: אִישׁ bezeichnet hier die gesuchte Person; צַר und אוֹיֵב werden als zwei eng verbundene, aber unterscheidbare Feindbezeichnungen wiedergegeben. »Bedränger« wahrt den aktiven, feindseligen Sinn von צַר, ohne die Wendung im Deutschen unnötig zu überladen.
- source_word: הָמָן הָרָע הַזֶּה
  choice: dieser böse Haman
  rationale: Die demonstrative, anklagende Zuspitzung wird bewahrt; רָע wird direkt und natürlich mit »böse« wiedergegeben.
- source_word: נִבְעַת
  choice: erschrak
  rationale: Das Nifal bezeichnet heftiges Erschrecken bzw. Entsetzen. »Erschrak« ist idiomatisch und lässt die Intensität aus dem dramatischen Zusammenhang hervorgehen.
- source_word: מִלִּפְנֵי הַמֶּלֶךְ וְהַמַּלְכָּה
  choice: vor dem König und der Königin
  rationale: Die räumlich-soziale Gegenwart und die Furcht angesichts der beiden Herrschenden werden mit der natürlichen deutschen Wendung »vor« bewahrt.
theological_decisions: []
