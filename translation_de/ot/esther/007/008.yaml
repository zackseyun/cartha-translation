review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Handlung und die rhetorische Anklage im Wesentlichen treffend wieder. Zwei Zusätze engen bzw. erweitern jedoch den hebräischen Text: »in meiner Gegenwart« ist nicht ausdrücklich gesagt, und »auf dem Ester lag« legt eine Lagehaltung Esters fest, während sie nach dem Kontext auf der Bankettliege war bzw. an ihr lag. Das Partizip נֹפֵל wird am besten als gerade erfolgendes Niederfallen wiedergegeben.'
  naturalness: Die Sprache ist insgesamt modern und würdig. »Polster« ist für מִטָּה möglich, aber »Liege« ist im Kontext eines antiken Banketts präziser und idiomatisch. Die Satzverbindung mit »Kaum war ...« ist flüssig, gibt aber die knappe hebräische Folge mit »Als ...« weniger unmittelbar wieder.
  terminology: »Ester«, »König« und »Königin« entsprechen dem üblichen deutschen Bibelgebrauch. »Sich an der Königin vergreifen« trifft den gewaltsam-sexuellen Unterton von לכבוש, ohne die umstrittene konkrete Tat zu behaupten. »Weingelage« ist vertretbar; »Weinmahl« ist etwas neutraler und näher an der Bezeichnung eines Festmahls.
  issues:
  - severity: medium
    issue: Zusatz »in meiner Gegenwart«
    rationale: עִמִּי בַּבָּיִת heißt wörtlich »bei mir/im Haus«. Der Sinn von königlicher Anwesenheit kann mitschwingen, aber die explizite Formulierung »in meiner Gegenwart« ergänzt den Text unnötig.
  - severity: medium
    issue: »auf dem Ester lag«
    rationale: אֲשֶׁר אֶסְתֵּר עָלֶיהָ lokalisiert Ester an der Liege, ohne ausdrücklich zu sagen, dass sie darauf lag. »bei der Ester war« bewahrt die knappe Formulierung und vermeidet eine konkrete Haltungsangabe.
  - severity: low
    issue: »war ... gesunken« schwächt den Verlaufsaspekt
    rationale: נֹפֵל ist ein Partizip und schildert Haman als gerade auf die Liege fallend bzw. sich darauf werfend. »fiel ... nieder« gibt die Wahrnehmung beim Eintreten natürlicher wieder.
  revised_text: 'Der König kehrte aus dem Palastgarten in den Saal des Weinmahls zurück, und Haman fiel auf die Liege nieder, bei der Ester war. Da sagte der König: »Will er sich sogar im Haus an der Königin vergreifen, bei mir?« Als das Wort aus dem Mund des Königs hervorging, verhüllte man Hamans Gesicht.'
