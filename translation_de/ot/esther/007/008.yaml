base_translation:
  language: en
  yaml_path: translation/ot/esther/007/008.yaml
  text: The king returned from the palace garden to the house of the wine feast, and Haman was falling on the couch where Esther was. Then the king said, “Will he even assault the queen while I am in the house?” As the word went out from the king’s mouth, they covered Haman’s face.
translation:
  language: de
  text: 'Der König kehrte aus dem Palastgarten in den Saal des Weinmahls zurück, und Haman fiel auf die Liege nieder, bei der Ester war. Da sagte der König: »Will er sich sogar im Haus an der Königin vergreifen, bei mir?« Als das Wort aus dem Mund des Königs hervorging, verhüllte man Hamans Gesicht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית מִשְׁתֵּה הַיַּיִן
  choice: Saal des Weingelages
  rationale: Die Wendung bezeichnet den Raum des Weinbanketts; »Saal« ist im Deutschen natürlicher als das wörtliche »Haus«, während »Weingelage« den festlichen, weinbezogenen Anlass wiedergibt.
- source_word: נֹפֵל עַל־הַמִּטָּה
  choice: war auf das Polster gesunken
  rationale: Das Partizip נֹפֵל zeigt Haman in niedergeworfener beziehungsweise hingesunkener Haltung. »Polster« passt zum Bankettmöbel מִטָּה besser als ein modernes Bett; die Formulierung lässt offen, ob die Bewegung noch andauerte.
- source_word: לִכְבּוֹשׁ
  choice: sich an … vergreifen
  rationale: Das Verb bedeutet grundsätzlich »unterwerfen/bezwingen« und erhält hier im Vorwurf des Königs einen gewaltsamen sexuellen Beiklang. »Sich an jemandem vergreifen« bewahrt die Schwere, ohne den genauen Tatbestand enger festzulegen als der hebräische Ausdruck.
- source_word: עִמִּי בַּבָּיִת
  choice: hier im Palast, in meiner Gegenwart
  rationale: עִמִּי kann hier räumlich beziehungsweise situativ »bei mir/in meiner Gegenwart« bedeuten; בַּבָּיִת verweist im Kontext auf den königlichen Palast.
- source_word: וּפְנֵי הָמָן חָפוּ
  choice: da verhüllte man Hamans Gesicht
  rationale: Die hebräische Form ist formal unpersönlich/passivartig zu verstehen. Die deutsche Wiedergabe mit unbestimmtem »man« bezeichnet die Hofdiener, ohne sie im Text ausdrücklich zu ergänzen.
theological_decisions:
- issue: Deutung von Hamans Haltung gegenüber Ester
  choice: Eine kompromittierende, vom König als Übergriff gedeutete Annäherung wird wiedergegeben, ohne zu behaupten, Haman habe tatsächlich einen sexuellen Angriff begonnen.
  alternative: »Will er sogar die Königin vergewaltigen?«
  rationale: Der Kontext zeigt, dass Haman um sein Leben flehte und der König die Szene anklagend deutete. Das allgemeinere »sich vergreifen« erhält diese erzählerische Spannung und die lexikalische Breite von כבש.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die direkte Rede ist empört und zugespitzt. »Ester« folgt der üblichen modernen deutschen Namensform; »Polster« spiegelt die Liege beim antiken Bankett.
