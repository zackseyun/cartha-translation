revisions:
- from: 'Der König kehrte aus dem Palastgarten in den Saal des Weingelages zurück. Haman war auf das Polster gesunken, auf dem Ester lag. Da sagte der König: »Will er sich etwa sogar hier im Palast, in meiner Gegenwart, an der Königin vergreifen?« Kaum war dieses Wort aus dem Mund des Königs gekommen, da verhüllte man Hamans Gesicht.'
  to: 'Der König kehrte aus dem Palastgarten in den Saal des Weinmahls zurück, und Haman fiel auf die Liege nieder, bei der Ester war. Da sagte der König: »Will er sich sogar im Haus an der Königin vergreifen, bei mir?« Als das Wort aus dem Mund des Königs hervorging, verhüllte man Hamans Gesicht.'
  rationale: Die Revision beseitigt nicht im Hebräischen verankerte Explizierungen, stellt den Verlaufscharakter von נֹפֵל natürlicher dar und verwendet mit »Liege« einen für das antike Bankettmöbel präziseren Ausdruck. Die anklagende, bewusst nicht näher bestimmte Aussage des Königs über Hamans vermeintlichen Übergriff bleibt erhalten.
