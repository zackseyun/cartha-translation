  text: בְּ/יוֹם שְׁלֹשָׁ֥ה עָשָׂ֖ר לְ/חֹ֣דֶשׁ אֲדָ֑ר וְ/נ֗וֹחַ בְּ/אַרְבָּעָ֤ה עָשָׂר֙ בּ֔/וֹ וְ/עָשֹׂ֣ה אֹת֔/וֹ י֖וֹם מִשְׁתֶּ֥ה וְ/שִׂמְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/017.yaml
  text: on the thirteenth day of the month of Adar[a], and resting on the fourteenth day of it[b], and making it a day of feasting and gladness.
translation:
  language: de
  text: am dreizehnten Tag des Monats Adar. Am vierzehnten Tag desselben Monats ruhten sie und machten ihn zu einem Tag des Festmahls und der Freude.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁלֹשָׁה עָשָׂר
  choice: am dreizehnten Tag
  rationale: Die Präposition ב bezeichnet hier den Zeitpunkt; die Kardinalzahl wird in der Datumsangabe im Deutschen idiomatisch als Ordinalzahl wiedergegeben.
- source_word: לְחֹדֶשׁ אֲדָר
  choice: des Monats Adar
  rationale: Die hebräische Datumsformel wird klar und knapp wiedergegeben; der Monatsname Adar bleibt als Eigenname erhalten.
- source_word: וְנוֹחַ
  choice: ruhten sie
  rationale: Der Infinitivus absolutus von נוח hat im Erzählzusammenhang finite Funktion. Das im Hebräischen aus dem vorherigen Kontext fortgeführte Subjekt muss im Deutschen ausdrücklich genannt werden.
- source_word: בְּאַרְבָּעָה עָשָׂר בּוֹ
  choice: Am vierzehnten Tag desselben Monats
  rationale: Das Pronomen בּוֹ verweist auf den Monat Adar zurück. Die explizite Wiederaufnahme mit „desselben Monats“ ist im Deutschen eindeutig und natürlich.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: und machten ihn
  rationale: Auch עָשֹׂה ist ein Infinitivus absolutus mit finiter Erzählfunktion. Das Pronomen „ihn“ bezieht sich wie im Hebräischen auf den Tag.
- source_word: יוֹם מִשְׁתֶּה
  choice: einem Tag des Festmahls
  rationale: מִשְׁתֶּה bezeichnet ein festliches Mahl beziehungsweise Gelage. „Festmahl“ ist verständlich, würdig und schließt den feierlichen Charakter ein.
- source_word: וְשִׂמְחָה
  choice: und der Freude
  rationale: Die nominale Form des Hebräischen bleibt erhalten; „Freude“ ist im heutigen Standarddeutsch natürlich.
