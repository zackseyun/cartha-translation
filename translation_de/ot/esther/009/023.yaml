  verdict: revise
  source_fidelity: 'Der Vers gibt die beiden von וְקִבֵּל regierten Objekte zutreffend wieder: die von den Juden bereits begonnene Praxis und das, was Mordechai ihnen geschrieben hatte. Das Plusquamperfekt ist im erzählerischen Zusammenhang angemessen. Die deutsche Formulierung „auf sich nehmen“ ist jedoch bei dem zweiten Objekt („was Mordechai ihnen geschrieben hatte“) weniger idiomatisch und verengt die Annahme eines Schreibens unnötig auf das Eingehen einer Verpflichtung.'
  naturalness: „Akzeptierten“ verbindet sich im modernen Standarddeutsch natürlich mit beiden parallelen Relativsätzen. „So“ kann die einleitende hebräische Konjunktion im Kontext angemessen wiedergeben.
  terminology: „die Juden“ und „Mordechai“ sind sachgerecht. Die Fußnote wird so angepasst, dass sie tatsächlich eine lexikalische Alternative bietet, statt im Wesentlichen den Ausgangstext zu wiederholen.
