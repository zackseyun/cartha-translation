  text: וְ/קִבֵּל֙ הַ/יְּהוּדִ֔ים אֵ֥ת אֲשֶׁר הֵחֵ֖לּוּ לַ/עֲשׂ֑וֹת וְ/אֵ֛ת אֲשֶׁר כָּתַ֥ב מָרְדֳּכַ֖י אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/023.yaml
  text: So the Jews accepted what they had begun to do[a], and what Mordecai had written to them.
translation:
  language: de
  text: So akzeptierten die Juden, was sie zu tun begonnen hatten und was Mordechai ihnen geschrieben hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bezogen auf die begonnene Praxis: „übernahmen“. Das hebräische Verb kann „annehmen“ oder „als Verpflichtung übernehmen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבֵּל
  choice: So nahmen … auf sich
  rationale: קבל bezeichnet hier im Zusammenhang mit der Einführung des Purimfestes das Annehmen beziehungsweise Übernehmen einer Praxis oder Verpflichtung. „Auf sich nehmen“ gibt diesen Sinn im Deutschen natürlich wieder; „empfangen“ wäre zu passiv.
- source_word: הַיְּהוּדִים
  choice: die Juden
  rationale: Direkte und im Deutschen übliche Wiedergabe der bestimmten ethnoreligiösen Bezeichnung.
- source_word: אֵת אֲשֶׁר הֵחֵלּוּ לַעֲשׂוֹת
  choice: was sie zu tun begonnen hatten
  rationale: Die Wendung bezeichnet die bereits begonnene Praxis als erstes Objekt von קבל. Das Plusquamperfekt bildet die zeitliche Abfolge im Erzählzusammenhang klar ab.
- source_word: וְאֵת אֲשֶׁר כָּתַב
  choice: und was … geschrieben hatte
  rationale: Die parallele Konstruktion führt ein zweites Objekt ein. Das Plusquamperfekt verdeutlicht, dass das Schreiben dem Annehmen vorausging.
- source_word: מָרְדֳּכַי
  choice: Mordechai
  rationale: Im Deutschen etablierte Form des Personennamens.
- source_word: אֲלֵיהֶם
  choice: ihnen
  rationale: Idiomatistische deutsche Wiedergabe der Richtung des schriftlichen Mitteilens; „an sie“ wäre ebenfalls möglich, klingt mit „geschrieben hatte“ jedoch weniger natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „auf sich nehmen“ bewahrt die Nuance des verbindlichen Annehmens, ohne den Grad der Verpflichtung über den hebräischen Wortlaut hinaus festzulegen.
