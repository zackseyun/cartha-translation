    rationale: Im Deutschen kann man eine Praxis „auf sich nehmen“, aber nicht ohne Weiteres „auf sich nehmen, was jemand geschrieben hatte“. Das hebräische קבל umfasst hier beide Objekte; eine neutralere Wiedergabe bewahrt diese Parallelität.
  - severity: low
    issue: Die bisherige Fußnote bietet keine echte Alternative zum Text.
    rationale: Die zitierte Formulierung wiederholt praktisch die Übersetzung und unterscheidet sich nur durch ein zusätzliches „das“. Eine Fußnote sollte die mögliche Nuance „übernehmen“ klar benennen.
