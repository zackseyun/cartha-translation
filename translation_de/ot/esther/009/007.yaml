- source_word: דַּלְפוֹן
  choice: Dalfon
  rationale: Der Personenname wird lautnah und in deutscher Schreibweise transkribiert.
- source_word: אַסְפָּתָא
  choice: Aspata
  rationale: Der vermutlich persische Personenname wird in einer dem Deutschen angepassten Form transkribiert.
