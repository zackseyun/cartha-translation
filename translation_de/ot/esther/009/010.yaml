  text: עֲ֠שֶׂרֶת בְּנֵ֨י הָמָ֧ן בֶּֽן הַמְּדָ֛תָא צֹרֵ֥ר הַ/יְּהוּדִ֖ים הָרָ֑גוּ וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָׁלְח֖וּ אֶת יָדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/010.yaml
  text: the ten sons of Haman son of Hammedatha[a], the enemy of the Jews, they killed; but they did not lay a hand on the plunder.
translation:
  language: de
  text: Die zehn Söhne Hamans, des Sohnes Hammedatas, des Feindes der Juden, töteten sie; doch an die Beute legten sie keine Hand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: die zehn Söhne Hamans
  rationale: Die Kardinalzahl steht in einer bestimmten Constructusverbindung; „Söhne“ bezeichnet hier die im Kontext namentlich aufgeführten männlichen Nachkommen Hamans.
- source_word: בֶּן הַמְּדָתָא
  choice: des Sohnes Hammedatas
  rationale: Die genealogische Apposition wird im Deutschen durch eine Genitivfügung natürlich an „Hamans“ angeschlossen.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: des Feindes der Juden
  rationale: צֹרֵר bezeichnet einen feindseligen Gegner oder Bedränger; „Feind“ ist hier klar, würdig und kontextgerecht.
- source_word: הָרָגוּ
  choice: töteten sie
  rationale: Das Verb הרג bedeutet hier schlicht „töten“. Die nachgestellte Subjektform bewahrt die Hervorhebung des vorangestellten Objekts.
- source_word: וּבַבִּזָּה
  choice: Doch an die Beute
  rationale: בִּזָּה bezeichnet Beute oder Plündergut. „Beute“ ist im modernen Deutschen natürlich; das Waw wird wegen des deutlichen inhaltlichen Gegensatzes adversativ mit „doch“ wiedergegeben.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: legten sie nicht Hand an
  rationale: Die hebräische Wendung bedeutet, nach etwas zu greifen oder es sich anzueignen. Die deutsche Formulierung erhält das konkrete Bild und vermittelt im Zusammenhang das Unterlassen der Aneignung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markierte hebräische Objektvoranstellung bleibt durch die Wortfolge „die zehn Söhne … töteten sie“ erkennbar; der Kontrast zur nicht angerührten Beute wird natürlich ausgedrückt.
