source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/הֵֽעָשׂ֣וֹת כֵּ֔ן וַ/תִּנָּתֵ֥ן דָּ֖ת בְּ/שׁוּשָׁ֑ן וְ/אֵ֛ת עֲשֶׂ֥רֶת בְּנֵֽי הָמָ֖ן תָּלֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/014.yaml
  text: So the king said that it should be done so. A decree was issued in Susa[a], and the ten sons of Haman were hanged.
translation:
  language: de
  text: Da sagte der König, es solle so geschehen. In Susa wurde ein Erlass verkündet, und die zehn Söhne Hamans wurden aufgehängt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an Pfählen aufgehängt“. Das hebräische Verb kann bedeuten, dass Leichname an einem Pfahl oder Holz aufgehängt wurden; es bezeichnet nicht unbedingt ein Erhängen am Hals im heutigen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: אמר bedeutet gewöhnlich „sagen“. Im Zusammenhang erteilt der König damit seine Zustimmung; „sagte“ bewahrt die hebräische Ausdrucksweise, ohne bereits ein förmliches Befehlsverb einzutragen.
- source_word: לְהֵעָשׂוֹת כֵּן
  choice: es solle so geschehen
  rationale: Die Infinitivkonstruktion mit עשה und כֵּן drückt aus, dass Esters Bitte entsprechend ausgeführt werden soll. Die gewählte Formulierung gibt den passiven Sinn natürlich und würdevoll wieder.
- source_word: וַתִּנָּתֵן דָּת
  choice: wurde ein Erlass verkündet
  rationale: נתן mit דת ist eine Verwaltungsvokabel der persischen Zeit. „Erlass“ bezeichnet hier treffender als „Gesetz“ die konkrete amtliche Anordnung; „verkündet“ gibt die Veröffentlichung idiomatisch wieder.
- source_word: בְּשׁוּשָׁן
  choice: in Susa
  rationale: „Susa“ ist die im modernen Deutschen übliche Namensform für שׁוּשָׁן.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: die zehn Söhne Hamans
  rationale: Dies ist die natürliche deutsche Wiedergabe der hebräischen Genitivverbindung.
- source_word: תָּלוּ
  choice: wurden aufgehängt
  rationale: תלה kann das Aufhängen eines Leichnams an einem Holz, Pfahl oder Galgen bezeichnen. „Aufgehängt“ lässt die genaue Art offen; die mögliche Bedeutung „an Pfählen aufgehängt“ wird in der Fußnote bewahrt.
theological_decisions: []
