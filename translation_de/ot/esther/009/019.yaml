base_translation:
  language: en
  yaml_path: translation/ot/esther/009/019.yaml
  text: Therefore the Jews of the villages[a], who live in the rural towns, make the fourteenth day of the month of Adar a day of gladness and feasting and a holiday, and of sending portions[b], each man to his neighbor.
translation:
  language: de
  text: Darum begehen die Juden auf dem Land[a], die in offenen Ortschaften wohnen, den vierzehnten Tag des Monats Adar als Tag der Freude und des Festmahls, als Festtag und als einen Tag, an dem jeder seinem Nächsten Portionen schickt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Juden in den unbefestigten Siedlungen«. Das Hebräische bezeichnet offene, das heißt nicht befestigte, Ortschaften.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind wahrscheinlich Speiseportionen oder andere Gaben für das Fest.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Folgerung aus der vorangehenden Erzählung wird knapp und natürlich ausgedrückt.
- source_word: הַיְּהוּדִים
  choice: die Juden
  rationale: Im Esterbuch bezeichnet der Ausdruck das jüdische Volk im Perserreich, nicht lediglich Bewohner Judas.
- source_word: הפרוזים / הַיֹּשְׁבִים בְּעָרֵי הַפְּרָזוֹת
  choice: auf dem offenen Land, die in den unbefestigten Orten wohnen
  rationale: Die Wiedergabe bewahrt den Gegensatz zu der befestigten Stadt Susa und gibt beide eng verwandten hebräischen Ausdrücke wieder, ohne sie fälschlich nur auf Dörfer zu verengen.
- source_word: עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר
  choice: begehen den vierzehnten Tag
  rationale: עשה in Verbindung mit einem Festtag bedeutet hier, diesen Tag festlich zu halten oder zu begehen.
- source_word: שִׂמְחָה וּמִשְׁתֶּה וְיוֹם טוֹב
  choice: als einen Tag der Freude und des Festmahls, als einen Festtag
  rationale: Die substantivische Reihung bleibt erkennbar; מִשְׁתֶּה bezeichnet ein festliches Mahl, häufig einschließlich des Trinkens, ohne dass Alkohol ausdrücklich genannt werden muss.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: als einen Tag, an dem … Gaben schickt
  rationale: מָנוֹת bedeutet Anteile oder Portionen, in diesem Festzusammenhang wahrscheinlich Speisegaben. Der Haupttext ist idiomatisch, während die Fußnote die konkrete Nuance nennt.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: jeder seinem Nächsten
  rationale: Die distributive Bedeutung wird in natürlichem Deutsch bewahrt. „Jeder“ entspricht dem maskulinen Singular, ohne die gemeinschaftsweite Anwendung unnötig einzuschränken.
theological_decisions:
- issue: Distributive maskuline Form אִישׁ לְרֵעֵהוּ
  choice: jeder seinem Nächsten
  alternative: einander / jeder dem anderen
  rationale: Die grammatisch maskuline Ausdrucksweise des Hebräischen bleibt sichtbar, während sie im Kontext als allgemeine gemeinschaftliche Praxis verstanden werden kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unbefestigte Orte“ wahrt den historischen Gegensatz zu Susa; „Festmahl“ und „Festtag“ sind verständlich und vermeiden unnötig altertümliche Sprache.
