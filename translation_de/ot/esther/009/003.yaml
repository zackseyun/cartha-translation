base_translation:
  language: en
  yaml_path: translation/ot/esther/009/003.yaml
  text: And all the officials of the provinces[a], the satraps, the governors, and those doing the king’s work were supporting the Jews, because the fear of Mordecai had fallen on them.
translation:
  language: de
  text: Und alle Beamten der Provinzen, die Satrapen, die Statthalter und die königlichen Amtsträger unterstützten[a] die Juden, denn die Furcht vor Mordechai war auf sie gefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „begünstigten“ oder „halfen“; das hebräische Verb kann auch bedeuten, jemanden „emporzuheben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: Obersten der Provinzen
  rationale: שָׂרִים bezeichnet führende Amtsträger oder Herrscher. „Obersten der Provinzen“ wahrt ihren hohen Rang und fügt sich natürlich in die folgende Aufzählung persischer Verwaltungsämter ein.
- source_word: אֲחַשְׁדַּרְפְּנִים
  choice: Satrapen
  rationale: Das persische Lehnwort bezeichnet Satrapen und bewahrt so die historisch spezifische Amtsbezeichnung.
- source_word: פַּחוֹת
  choice: Statthalter
  rationale: Die Bezeichnung meint regionale Amtsträger, die von den Satrapen unterschieden werden; „Statthalter“ ist dafür im Deutschen klar und historisch passend.
- source_word: עֹשֵׂי הַמְּלָאכָה אֲשֶׁר לַמֶּלֶךְ
  choice: die königlichen Amtsträger
  rationale: Wörtlich sind es diejenigen, die das dem König zugehörige Werk verrichten. „Königliche Amtsträger“ gibt die wahrscheinliche administrative Bedeutung knapp und verständlich wieder.
- source_word: מְנַשְּׂאִים אֶת־הַיְּהוּדִים
  choice: unterstützten die Juden
  rationale: Der Hifil von נָשָׂא kann hier „emporheben“, „begünstigen“ oder „unterstützen“ bedeuten. Im Zusammenhang bezeichnet „unterstützten“ am natürlichsten ihre praktische Hilfe, ohne eine formelle Rangerhöhung zu behaupten.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für die Unterstützung ein. „Denn“ verbindet die beiden Aussagen in einem würdigen, natürlichen Erzählstil.
- source_word: נָפַל פַּחַד מָרְדֳּכַי עֲלֵיהֶם
  choice: die Furcht vor Mordechai war auf sie gefallen
  rationale: Die Formulierung bewahrt das anschauliche hebräische Bild und gibt den im Erzählzusammenhang bereits eingetretenen Zustand wieder.
- source_word: מָרְדֳּכַי
  choice: Mordechai
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Form wiedergegeben.
