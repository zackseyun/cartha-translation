  text: On that day the number of those killed in Susa the citadel came before the king.
translation:
  language: de
  text: An diesem Tag kam die Zahl der in der Festung Susa Getöteten vor den König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An diesem Tag
  rationale: Gibt die bestimmte Zeitangabe direkt und natürlich wieder.
- source_word: בָּא
  choice: kam
  rationale: Bewahrt die konkrete Ausdrucksweise des Hebräischen, wonach die Zahl selbst vor den König »kam«, statt ausdrücklich eine nicht genannte Übermittlungshandlung einzufügen.
- source_word: מִסְפַּר הַהֲרוּגִים
  choice: die Zahl der … Getöteten
  rationale: Gibt sowohl מִסְפַּר als auch den passiven Sinn von הֲרוּגִים präzise wieder.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: der Festung Susa
  rationale: הַבִּירָה bezeichnet hier die befestigte Residenz beziehungsweise Zitadelle; »Festung Susa« ist im Deutschen knapp und verständlich.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: vor den König
  rationale: Bewahrt die räumlich-administrative Wendung des Ausgangstextes und passt idiomatisch zu »kam«.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber verständliche Formulierung »die Zahl … kam vor den König« hält sich eng an die hebräische Darstellung und vermeidet die Ergänzung eines ungenannten Überbringers.
