source:
  edition: WLC
  text: וַ֠/תִּכְתֹּב אֶסְתֵּ֨ר הַ/מַּלְכָּ֧ה בַת אֲבִיחַ֛יִל וּ/מָרְדֳּכַ֥י הַ/יְּהוּדִ֖י אֶת כָּל תֹּ֑קֶף לְ/קַיֵּ֗ם אֵ֣ת אִגֶּ֧רֶת הַ/פּוּרִ֛ים הַ/זֹּ֖את הַ/שֵּׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/029.yaml
  text: Then Esther the queen[a], daughter of Abihail, and Mordecai the Jew wrote with full authority to confirm this second letter of Purim.
translation:
  language: de
  text: Darauf schrieben die Königin Ester, die Tochter Abihajils, und der Jude Mordechai mit voller Autorität[a], um dieses zweite Purimschreiben zu bestätigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit allem Nachdruck“ oder „mit voller Rechtskraft“. Der hebräische Ausdruck betont die kraftvolle amtliche Geltung des Schreibens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Darauf schrieben
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. Obwohl das Verb im Hebräischen feminin Singular steht und zunächst mit Ester übereinstimmt, folgt mit Mordechai ein weiterer Bestandteil des zusammengesetzten Subjekts; im natürlichen Deutschen steht daher der Plural.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: die Königin Ester
  rationale: Die deutsche Titelfolge ist idiomatisch und bewahrt die förmliche Kennzeichnung Esters als Königin.
- source_word: בַת אֲבִיחַיִל
  choice: die Tochter Abihajils
  rationale: Die genealogische Angabe wird als Apposition unmittelbar wiedergegeben.
- source_word: וּמָרְדֳּכַי הַיְּהוּדִי
  choice: und der Jude Mordechai
  rationale: יְהוּדִי bezeichnet im persischen Umfeld des Esterbuches die ethnische Zugehörigkeit; „Jude“ ist hier natürlicher und weiter als „Judäer“.
- source_word: אֶת כָּל תֹּקֶף
  choice: mit voller Autorität
  rationale: תֹּקֶף kann Stärke, Nachdruck oder rechtswirksame Autorität bezeichnen. Im Zusammenhang eines amtlichen Bestätigungsschreibens hebt „mit voller Autorität“ dessen offizielle Geltung hervor, ohne die möglichen Nuancen zu verschweigen.
- source_word: לְקַיֵּם
  choice: um … zu bestätigen
  rationale: Der Infinitiv bezeichnet den Zweck des Schreibens. „Bestätigen“ passt zu der förmlichen Bekräftigung einer bereits eingeführten Festordnung.
- source_word: אִגֶּרֶת הַפּוּרִים הַזֹּאת הַשֵּׁנִית
  choice: dieses zweite Purimschreiben
  rationale: Das deutsche Kompositum gibt die hebräische Genitivverbindung knapp und verständlich wieder; Demonstrativ und Ordnungszahl bleiben erhalten.
