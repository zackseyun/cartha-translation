  yaml_path: translation/ot/esther/009/032.yaml
  text: And Esther’s command confirmed these matters of Purim[b][a], and it was written in the book.
translation:
  language: de
  text: Und Esters Anordnung bestätigte diese Angelegenheiten des Purimfestes,[a] und es wurde im Buch niedergeschrieben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Worte zu Purim“; das hebräische Wort für „Worte“ kann in diesem Zusammenhang auch „Angelegenheiten“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und es wurde in der Schriftrolle aufgezeichnet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲמַר
  choice: Anordnung
  rationale: Das Substantiv bezeichnet hier Esters autoritative Verfügung, nicht lediglich eine Äußerung. „Anordnung“ gibt den amtlichen Charakter in natürlichem Deutsch wieder.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Der Personenname folgt der etablierten deutschen Bibelschreibung.
- source_word: קִיַּם
  choice: bestätigte
  rationale: Das Verb bedeutet, etwas festzumachen oder in Geltung zu setzen. Mit „Anordnung“ als Subjekt bildet „bestätigte“ den rechtlich-administrativen Zusammenhang angemessen ab.
- source_word: דִּבְרֵי הַפֻּרִים הָאֵלֶּה
  choice: diese Bestimmungen über Purim
  rationale: דְּבָרִים kann neben „Worten“ auch Sachen, Angelegenheiten oder Regelungen bezeichnen. Im Zusammenhang sind die Festlegungen zur Purimfeier gemeint; „über“ wahrt dabei die natürliche deutsche Syntax.
- source_word: וְנִכְתָּב
  choice: und es wurde niedergeschrieben
  rationale: Die passive Form wird unmittelbar wiedergegeben. „Niedergeschrieben“ kann sowohl das schriftliche Festhalten als auch das Eintragen in eine Aufzeichnung bezeichnen.
- source_word: בַּסֵּפֶר
  choice: in dem Buch
  rationale: סֵפֶר kann Buch, Schriftrolle oder schriftliche Aufzeichnung bedeuten. Der bestimmte, aber nicht näher identifizierte Ausdruck bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die amtliche Färbung des Verses wird durch „Anordnung“, „Bestimmungen“ und „niedergeschrieben“ bewahrt, ohne die nicht näher bestimmte Art des Buches oder Dokuments festzulegen.
