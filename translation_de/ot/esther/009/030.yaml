source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח סְפָרִ֜ים אֶל כָּל הַ/יְּהוּדִ֗ים אֶל שֶׁ֨בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מַלְכ֖וּת אֲחַשְׁוֵר֑וֹשׁ דִּבְרֵ֥י שָׁל֖וֹם וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/030.yaml
  text: And he sent letters to all the Jews in the one hundred twenty-seven provinces of the kingdom of Ahasuerus[a], words of peace and truth[c][b],
translation:
  language: de
  text: Und er sandte Schreiben an alle Juden in den 127 Provinzen des Königreichs Ahasveros[a], Worte des Friedens und der Wahrheit[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ahasveros ist die hebräische Form des Königsnamens; historisch wird er von manchen mit Xerxes I. gleichgesetzt.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Worte des Friedens und der Wahrheit“; sinngemäß auch: „eine Botschaft des Friedens und der Wahrheit“.'
    reason: lexical_alternative
  - marker: c
    text: Das mit „Wahrheit“ übersetzte hebräische Wort kann hier auch „Treue“ oder „Verlässlichkeit“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Und er sandte
  rationale: Die Wayyiqtol-Form führt die Erzählung fort. Das Subjekt bleibt wie im Hebräischen unausgesprochen und wird durch „er“ wiedergegeben.
- source_word: סְפָרִים
  choice: Schreiben
  rationale: Im persischen Verwaltungskontext bezeichnet der Plural versandte schriftliche Mitteilungen. „Schreiben“ klingt im Deutschen natürlicher und amtlicher als „Briefe“.
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: an alle Juden
  rationale: Die Wendung bezeichnet kollektiv sämtliche jüdischen Empfänger im Reich.
- source_word: אֶל שֶׁבַע וְעֶשְׂרִים וּמֵאָה מְדִינָה
  choice: in den 127 Provinzen
  rationale: Das zweite אֶל beschreibt hier sinnvoll den geografischen Bereich, in dem sich die Empfänger befanden; die Schreiben gelten nicht den Provinzen als solchen.
- source_word: מְדִינָה
  choice: Provinzen
  rationale: Das Wort bezeichnet in Esther Verwaltungsgebiete des Perserreichs; „Provinzen“ ist dafür die klare und etablierte deutsche Entsprechung.
- source_word: מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: des Königreichs Ahasveros
  rationale: Die Formulierung bildet die hebräische Genitivverbindung knapp und würdevoll ab, ohne den im Ausdruck nicht ausdrücklich vorhandenen Titel „König“ hinzuzufügen.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasveros
  rationale: „Ahasveros“ ist die im Deutschen gebräuchliche Wiedergabe der hebräischen Namensform und vermeidet eine stillschweigende historische Gleichsetzung mit Xerxes I.
- source_word: דִּבְרֵי שָׁלוֹם וֶאֱמֶת
  choice: Worte des Friedens und der Wahrheit
  rationale: Die Übersetzung bewahrt die konkrete hebräische Formulierung. שָׁלוֹם umfasst Frieden und Wohlergehen; אֱמֶת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen.
