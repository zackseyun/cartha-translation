base_translation:
  language: en
  yaml_path: translation/ot/esther/009/004.yaml
  text: For Mordecai was great in the king’s house[a], and the report about him was spreading through all the provinces[b], for the man Mordecai was becoming greater and greater.
translation:
  language: de
  text: Denn Mordechai war am Königshof ein bedeutender Mann, und die Nachricht über ihn verbreitete sich in allen Provinzen; denn Mordechai wurde immer bedeutender.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet im Zusammenhang, weshalb die Furcht vor Mordechai auf die Amtsträger gefallen war, und behält zugleich den erklärenden Anschluss bei.
- source_word: גָדוֹל
  choice: mächtig
  rationale: Das Adjektiv bezeichnet hier Mordechais hohe Stellung und seinen wachsenden Einfluss; „mächtig“ gibt dies im politischen Hofkontext natürlicher wieder als das unspezifische „groß“.
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: am Königshof
  rationale: Wörtlich steht „im Haus des Königs“. Im Kontext bezeichnet die Wendung den königlichen Hof beziehungsweise Palast als Bereich von Mordechais Amt und Einfluss; „am Königshof“ ist im Deutschen klar und idiomatisch.
- source_word: שָׁמְעוֹ
  choice: sein Ruf
  rationale: Das von שמע abgeleitete Substantiv kann Bericht, Nachricht oder Ruf bedeuten. Weil dieser durch alle Provinzen geht und Mordechais zunehmende Bedeutung beschreibt, passt „sein Ruf“, ohne den Inhalt enger festzulegen.
- source_word: הוֹלֵךְ
  choice: verbreitete sich
  rationale: Mit „Ruf“ als Subjekt bezeichnet das Partizip eine fortschreitende Ausbreitung. Die deutsche Wendung gibt die Bewegung idiomatisch wieder.
- source_word: בְּכָל הַמְּדִינוֹת
  choice: in allen Provinzen
  rationale: „Provinzen“ entspricht dem persischen Verwaltungskontext des Estherbuches; die Präposition mit „allen“ bezeichnet die umfassende Ausbreitung.
- source_word: הָאִישׁ מָרְדֳּכַי
  choice: der Mann Mordechai
  rationale: Die ungewöhnlich feierliche Hervorhebung durch Artikel, „Mann“ und Namen bleibt erhalten.
- source_word: הוֹלֵךְ וְגָדוֹל
  choice: wurde immer mächtiger
  rationale: Die Verbindung von הלך mit einem folgenden Adjektiv ist eine hebräische Fortschrittsformel. „Wurde immer mächtiger“ drückt die stetige Zunahme an Rang und Einfluss natürlich aus.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wiederholung von כִּי wird mit zweimaligem „denn“ bewahrt; die fortschreitende Steigerung erscheint idiomatisch als „immer mächtiger“. Keine Fußnote ist nötig, da die wesentlichen Bedeutungsnuancen im Haupttext verständlich wiedergegeben werden.
