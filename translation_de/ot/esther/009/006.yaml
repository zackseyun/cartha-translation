  yaml_path: translation/ot/esther/009/006.yaml
  text: And in Susa the citadel[a], the Jews killed and destroyed five hundred men.
translation:
  language: de
  text: Und in der Burg Susa töteten und vernichteten die Juden fünfhundert Männer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/שׁוּשַׁן הַ/בִּירָה
  choice: Und in der Festung Susa
  rationale: Die Verbindung וּבְ setzt die Erzählung fort und bezeichnet den Ort. הַבִּירָה meint hier den befestigten Burg- beziehungsweise Palastbezirk von Susa; „Festung Susa“ ist im Deutschen eine natürliche, in Esther etablierte Wiedergabe.
- source_word: הָרְגוּ הַ/יְּהוּדִים
  choice: töteten die Juden
  rationale: הרג bedeutet schlicht „töten“. „Die Juden“ gibt die in Esther bezeichnete ethnisch-religiöse Gruppe natürlich und kontextgerecht wieder.
- source_word: וְ/אַבֵּד
  choice: und vernichteten
  rationale: Der Piel von אבד bezeichnet das Zugrunde-Richten beziehungsweise Vernichten. Die gesonderte Wiedergabe bewahrt die hebräische Doppelverbformel neben „töteten“.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: fünfhundert Männer
  rationale: Die hebräische Zählformel nennt ausdrücklich אִישׁ, „Mann/Männer“; daher wird sie nicht zu „Menschen“ verallgemeinert.
