  text: כַּ/יָּמִ֗ים אֲשֶׁר נָ֨חוּ בָ/הֶ֤ם הַ/יְּהוּדִים֙ מֵ/א֣וֹיְבֵי/הֶ֔ם וְ/הַ/חֹ֗דֶשׁ אֲשֶׁר֩ נֶהְפַּ֨ךְ לָ/הֶ֤ם מִ/יָּגוֹן֙ לְ/שִׂמְחָ֔ה וּ/מֵ/אֵ֖בֶל לְ/י֣וֹם ט֑וֹב לַ/עֲשׂ֣וֹת אוֹתָ֗/ם יְמֵי֙ מִשְׁתֶּ֣ה וְ/שִׂמְחָ֔ה וּ/מִשְׁל֤וֹחַ מָנוֹת֙ אִ֣ישׁ לְ/רֵעֵ֔/הוּ וּ/מַתָּנ֖וֹת לָֽ/אֶבְיוֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/022.yaml
  text: as the days on which the Jews had rest from their enemies[a], and as the month that had been turned for them from sorrow to gladness and from mourning to a good day, to make them days of feasting and gladness, and of sending portions, each man to his neighbor[c][b], and gifts to the poor.
translation:
  language: de
  text: An den Tagen, an denen die Juden Ruhe vor ihren Feinden fanden, und in dem Monat, der sich für sie von Kummer in Freude und von Trauer in einen Festtag[a] verwandelt hatte, sollten sie diese Tage zu Tagen des Festmahls und der Freude machen, einander Speisegaben[b] schicken und den Armen Geschenke geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in einen guten Tag«; gemeint ist ein Tag der Freude und des Feierns.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind wahrscheinlich Portionen von Speisen, die man einander als Festgaben schickte.
    reason: cultural_note
lexical_decisions:
- source_word: נָחוּ מֵאֹיְבֵיהֶם
  choice: Ruhe vor ihren Feinden fanden
  rationale: נוח bezeichnet das Zur-Ruhe-Kommen bzw. Erlangen von Entlastung; mit מן wird die Befreiung von der Bedrohung durch die Feinde ausgedrückt. Die deutsche Wendung ist natürlich und bewahrt diesen Sinn.
- source_word: נֶהְפַּךְ
  choice: sich … verwandelt hatte
  rationale: Das Nifal von הפך bezeichnet eine eingetretene Umkehr oder Verwandlung. Das Plusquamperfekt stellt die vollendete Wende gegenüber der angeordneten Feier heraus.
- source_word: יָגוֹן / שִׂמְחָה
  choice: Kummer / Freude
  rationale: Die geläufigen deutschen Begriffe geben den deutlichen emotionalen Gegensatz prägnant wieder.
- source_word: אֵבֶל
  choice: Trauer
  rationale: אֵבֶל bezeichnet Trauer, oft als öffentlich oder rituell geäußerten Zustand, und bleibt so von יָגוֹן unterschieden.
- source_word: לְיוֹם טוֹב
  choice: in einen Festtag
  rationale: Wörtlich heißt die Wendung „zu einem guten Tag“; im Zusammenhang bezeichnet sie jedoch einen freudigen Feiertag. „Festtag“ vermittelt die kontextuelle Bedeutung in natürlichem Deutsch, während die wörtliche Form in einer Fußnote erhalten bleibt.
- source_word: לַעֲשׂוֹת אוֹתָם
  choice: Sie sollten diese Tage zu … machen
  rationale: Die Konstruktion bedeutet wörtlich „sie machen“. Die Ergänzung des Subjekts und die Auflösung in einen neuen Satz machen den Zweck der Anordnung im Deutschen klar, ohne den Inhalt zu erweitern.
- source_word: יְמֵי מִשְׁתֶּה וְשִׂמְחָה
  choice: Tage des Festmahls und der Freude
  rationale: מִשְׁתֶּה ist ein festliches Mahl oder Gelage, häufig mit Getränken. „Festmahl“ bewahrt den Feiercharakter, ohne den Alkoholaspekt stärker festzulegen als der Kontext.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: Speisegaben schicken
  rationale: מָנוֹת sind zugeteilte Anteile oder Portionen; im Purimkontext sind damit sehr wahrscheinlich Essensportionen als Festgaben gemeint. „Speisegaben“ ist knapp und verständlich; die kulturelle Einordnung wird in der Fußnote erläutert.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: einander
  rationale: Die wörtlich maskuline distributive Wendung „ein Mann seinem Nächsten“ bezeichnet hier wechselseitiges Geben innerhalb der Gemeinschaft. „Einander“ gibt ihre Funktion im Deutschen natürlich wieder, ohne den Empfängerkreis unnötig auf Männer zu beschränken.
- source_word: מַתָּנוֹת לָאֶבְיוֹנִים
  choice: den Armen Geschenke geben
  rationale: אֶבְיוֹנִים bezeichnet Arme bzw. Bedürftige. Die Formulierung ist idiomatisch und erhält den sozialethischen Akzent.
theological_decisions:
- issue: Reichweite der maskulinen distributiven Wendung אִישׁ לְרֵעֵהוּ
  choice: einander
  alternative: jeder Mann seinem Nächsten
  rationale: Die Wendung ist grammatisch maskulin, fungiert hier aber idiomatisch-distributiv und beschreibt gegenseitiges Schenken in der Gemeinschaft. Die Übersetzung „einander“ bewahrt diese Funktion, ohne eine nicht zwingend gemeinte Beschränkung auf männliche Beteiligte einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange hebräische Satz wird nach der Beschreibung der Umkehr geteilt, damit Zweck und Feierpraxis verständlich bleiben. Die Parallelität Kummer/Freude und Trauer/Festtag wird bewahrt.
