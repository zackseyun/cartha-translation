  naturalness: Der Entwurf ist modernes und würdiges Deutsch, doch die Konstruktion „setzten für sich … verbindlich fest“ ist etwas schwerfällig. Eine Formulierung mit „bestätigten und übernahmen … die Verpflichtung“ ist zugleich natürlicher und näher am rechtlich-verpflichtenden Charakter des Satzes.
  terminology: „Nachkommen“, „sich ihnen anschlossen“, „begehen“ und „Jahr für Jahr“ sind passend. „Nach ihrer schriftlichen Festlegung“ gibt כִּכְתָבָם genauer wieder als „wie es für sie schriftlich festgelegt war“, ohne den Bezug des Suffixes unnötig festzulegen.
