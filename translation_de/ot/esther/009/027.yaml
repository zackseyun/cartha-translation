base_translation:
  language: en
  yaml_path: translation/ot/esther/009/027.yaml
  text: 'the Jews established and accepted for themselves[a], for their offspring, and for all who joined them, that it should not fail: to observe these two days according to what was written for them and at their appointed time[b], year after year.'
translation:
  language: de
  text: Die Juden bestätigten und übernahmen für sich, für ihre Nachkommen und für alle, die sich ihnen anschlossen,[a] die Verpflichtung, diese beiden Tage Jahr für Jahr nach ihrer schriftlichen Festlegung und zu ihrer festgesetzten Zeit zu begehen, sodass dies nicht unterbleiben sollte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle, die sich mit ihnen verbanden« beziehungsweise »sich ihnen zugesellten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und es sollte nicht vergehen«. Gemeint ist, dass die festgelegte jährliche Begehung nicht unterbleiben oder außer Gebrauch kommen sollte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִיְּמוּ וְקִבֵּל
  choice: setzten … verbindlich fest
  rationale: Die verbale Verbindung bezeichnet im rechtlich-institutionellen Zusammenhang das Bestätigen und Annehmen einer bleibenden Verpflichtung. Die deutsche Wendung gibt beide Aspekte natürlich wieder, ohne die ungewöhnliche Form von וקבל künstlich nachzuahmen.
- source_word: עֲלֵיהֶם
  choice: für sich
  rationale: Im Zusammenhang mit einer übernommenen Verpflichtung ist dies idiomatisches modernes Deutsch für das wörtlichere »auf sich«.
- source_word: זַרְעָם
  choice: ihre Nachkommen
  rationale: »Nachkommen« gibt den generationenübergreifenden Sinn von זרע in diesem Kontext klar und würdig wieder.
- source_word: כָּל הַנִּלְוִים עֲלֵיהֶם
  choice: alle, die sich ihnen anschlossen
  rationale: Das Partizip von לוה bezeichnet Menschen, die sich den Juden anschließen beziehungsweise mit ihnen verbinden; die reflexive Form bewahrt diesen Sinn.
- source_word: וְלֹא יַעֲבוֹר
  choice: diese Verpflichtung sollte nicht hinfällig werden
  rationale: Das Idiom bezeichnet, dass die festgelegte Begehung nicht vergehen, ausfallen oder außer Kraft geraten sollte. Das explizite Subjekt »Verpflichtung« macht den deutschen Satz verständlich, ohne den Sinn einzuengen.
- source_word: לִהְיוֹת עֹשִׂים
  choice: zu begehen
  rationale: Wörtlich »zu tun«; bei festgelegten Gedenk- oder Festtagen ist »begehen« die natürliche sachliche Wiedergabe.
- source_word: שְׁנֵי הַיָּמִים הָאֵלֶּה
  choice: diese beiden Tage
  rationale: Direkte und idiomatische Wiedergabe der Nominalgruppe.
- source_word: כִּכְתָבָם
  choice: wie es für sie schriftlich festgelegt war
  rationale: Die Form verweist auf eine schriftliche Vorgabe. Die Wiedergabe lässt offen, ob das Suffix auf die Tage, ihre Ordnung oder die Betroffenen bezogen wird, und vermeidet eine unbelegte Dokumentbezeichnung.
- source_word: וְכִזְמַנָּם
  choice: zu der für sie bestimmten Zeit
  rationale: זמן bezeichnet den festgesetzten Zeitpunkt. Das Suffix bleibt durch »für sie« sprachlich erkennbar, ohne seine genaue Bezugsgröße dogmatisch festzulegen.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: Jahr für Jahr
  rationale: Die deutsche Wiederholungsformel bildet die iterative Kraft des hebräischen Ausdrucks natürlich ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange hebräische Verpflichtungsformel wurde syntaktisch geordnet; der rechtlich-verbindliche Charakter und die Aussage, dass die jährliche Begehung nicht erlöschen soll, bleiben erhalten. Alle Fußnotenmarker stehen im Haupttext.
