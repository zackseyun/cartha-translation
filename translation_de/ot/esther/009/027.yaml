revisions:
- from: Die Juden setzten für sich, ihre Nachkommen und alle, die sich ihnen anschlossen,[a] verbindlich fest, diese beiden Tage Jahr für Jahr so zu begehen, wie es für sie schriftlich festgelegt war, und zu der für sie bestimmten Zeit; diese Verpflichtung sollte nicht hinfällig werden.[b]
  to: Die Juden bestätigten und übernahmen für sich, für ihre Nachkommen und für alle, die sich ihnen anschlossen,[a] die Verpflichtung, diese beiden Tage Jahr für Jahr nach ihrer schriftlichen Festlegung und zu ihrer festgesetzten Zeit zu begehen, sodass dies nicht unterbleiben sollte.[b]
  rationale: Die Revision stellt die beiden einleitenden Verben als Bestätigung und Übernahme einer Verpflichtung dar, erhält die Rechts- und Dauerperspektive der Aussage und formuliert den Satz in natürlichem modernem Standarddeutsch. Die Ambiguität der possessiven Suffixe bei der schriftlichen Festlegung und der festgesetzten Zeit wird nicht überinterpretiert. Beide Fußnotenanker bleiben unmittelbar bei den einschlägigen Textstellen.
  reviewer_model: gpt-5.6-terra
