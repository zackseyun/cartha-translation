  source_fidelity: Die Übersetzung gibt die Ortsbezeichnung, die doppelte Tötungsformel, die Zahl der Männer samt Hamans zehn Söhnen sowie die beiden königlichen Zusagen vollständig wieder. „Was mögen sie da erst … getan haben?“ gibt den im Kontext naheliegenden rhetorisch-folgernden Charakter von מֶה עָשׂוּ angemessen wieder, ohne eine konkrete Zahl oder ein Ergebnis hinzuzufügen. Die Fußnote bewahrt zutreffend die auch mögliche schlichtere Lesart.
  naturalness: Flüssiges modernes Standarddeutsch mit einem angemessen zurückhaltenden höfischen Register. „In der Festung Susa“ ist als Bezeichnung des befestigten königlichen Bezirks verständlich und idiomatisch verwendbar. Die Pronomenbezüge bei „Bitte“ und „Wunsch“ sind klar.
  terminology: „Ester“, „Haman“, „Juden“, „Provinzen“, „Bitte“ und „Wunsch“ sind sachgerecht. Die Unterscheidung von „Bitte“ und „weiterer Wunsch“ bildet die hebräischen nahe verwandten Begriffe verständlich ab, während „gewährt“ und „erfüllt“ die königliche Zusage natürlich wiedergeben.
