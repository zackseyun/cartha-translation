  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֗ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֡ה הָרְגוּ֩ הַ/יְּהוּדִ֨ים וְ/אַבֵּ֜ד חֲמֵ֧שׁ מֵא֣וֹת אִ֗ישׁ וְ/אֵת֙ עֲשֶׂ֣רֶת בְּנֵֽי הָמָ֔ן בִּ/שְׁאָ֛ר מְדִינ֥וֹת הַ/מֶּ֖לֶךְ מֶ֣ה עָשׂ֑וּ וּ/מַה שְּׁאֵֽלָתֵ/ךְ֙ וְ/יִנָּ֣תֵֽן לָ֔/ךְ וּ/מַה בַּקָּשָׁתֵ֥/ךְ ע֖וֹד וְ/תֵעָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/012.yaml
  text: Then the king said to Esther the queen[a], “In Susa the citadel the Jews have killed and destroyed five hundred men, along with the ten sons of Haman. What then have they done in the rest of the king’s provinces? Now what is your petition? It will be granted to you. And what is your further request? It will be done.”
translation:
  language: de
  text: 'Da sagte der König zu Königin Ester: „In der Festung Susa haben die Juden fünfhundert Männer und die zehn Söhne Hamans getötet und vernichtet. Was mögen sie da erst in den übrigen Provinzen des Königs getan haben?[a] Was ist nun deine Bitte? Sie soll dir gewährt werden. Und was ist dein weiterer Wunsch? Er soll erfüllt werden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder einfacher: „Was haben sie in den übrigen Provinzen des Königs getan?“ Die hebräische Frage lässt offen, wie stark der folgernde Sinn hervortritt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: in der Festung Susa
  rationale: בִּירָה bezeichnet hier den befestigten königlichen Bezirk beziehungsweise die Zitadelle. „Festung Susa“ ist im Deutschen verständlich und wahrt den persischen Verwaltungskontext.
- source_word: הָרְגוּ ... וְאַבֵּד
  choice: getötet und vernichtet
  rationale: Die beiden Verben werden wiedergegeben, um die verstärkende, kumulative Aussage des Hebräischen zu bewahren.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: fünfhundert Männer
  rationale: אִישׁ steht nach der Zahl distributiv; „Männer“ ist die direkte, geschlechtsgenaue Wiedergabe und passt zum gewaltsamen Kontext.
- source_word: וְאֵת עֲשֶׂרֶת בְּנֵי הָמָן
  choice: und die zehn Söhne Hamans
  rationale: Die einfache Koordination gibt das zusätzliche direkte Objekt natürlich und genau wieder.
- source_word: בִּשְׁאָר מְדִינוֹת הַמֶּלֶךְ
  choice: in den übrigen Provinzen des Königs
  rationale: מְדִינוֹת bezeichnet im persischen Reich Provinzen; שְׁאָר meint deren Rest beziehungsweise die übrigen.
- source_word: מֶה עָשׂוּ
  choice: Was mögen sie da erst ... getan haben?
  rationale: Die Formulierung bringt den aus dem Bericht über Susa naheliegenden rhetorischen Schluss des Königs in natürlichem Deutsch zum Ausdruck, ohne ihn als Gewissheit auszugeben.
- source_word: שְּׁאֵלָתֵךְ
  choice: deine Bitte
  rationale: שְׁאֵלָה bezeichnet hier eine an den König gerichtete Bitte; „Bitte“ ist in modernem Deutsch natürlicher als „Bittgesuch“.
- source_word: וְיִנָּתֵן לָךְ
  choice: Sie soll dir gewährt werden
  rationale: Das passive נתן bedeutet in diesem höfischen Zusammenhang idiomatisch, dass die Bitte gewährt wird.
- source_word: בַּקָּשָׁתֵךְ עוֹד
  choice: dein weiterer Wunsch
  rationale: „Weiterer“ gibt עוֹד als zusätzliche Bitte wieder; „Wunsch“ unterscheidet das nahe Synonym stilistisch von der vorherigen „Bitte“.
- source_word: וְתֵעָשׂ
  choice: Er soll erfüllt werden
  rationale: Im Zusammenhang bedeutet die Form, dass der weitere Wunsch ausgeführt beziehungsweise erfüllt wird; der Bezug auf „Wunsch“ erfordert im Deutschen das maskuline Pronomen.
