  text: to establish among them that they should observe the fourteenth day of the month Adar[a], and the fifteenth day of it, year after year,
translation:
  language: de
  text: für sie verbindlich festzulegen, dass sie den vierzehnten Tag des Monats Adar und den fünfzehnten Tag desselben Monats Jahr für Jahr[a] begehen sollten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in jedem Jahr und Jahr“; die Wiederholung betont die alljährliche Begehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם עֲלֵיהֶם
  choice: für sie festzulegen
  rationale: Das Piel von קום bezeichnet hier das verbindliche Festlegen beziehungsweise Bestätigen eines Brauchs. עֲלֵיהֶם trägt einen verpflichtenden Bezug auf die Betroffenen; „für sie festzulegen“ gibt dies in natürlichem Deutsch wieder, ohne die Härte von „ihnen aufzuerlegen“ zwingend in den Text einzutragen.
- source_word: לִהְיוֹת עֹשִׂים
  choice: dass sie … begehen sollten
  rationale: Wörtlich steht eine Umschreibung mit „sein“ und „tun“. Bei festgelegten Gedenktagen ist „begehen“ die natürliche deutsche Entsprechung und bezeichnet die regelmäßige Durchführung des Festes.
- source_word: אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: den vierzehnten Tag des Monats Adar
  rationale: Die kalendarische Datumsangabe wird in einer klaren, formellen deutschen Form wiedergegeben.
- source_word: וְאֵת יוֹם חֲמִשָּׁה עָשָׂר בּוֹ
  choice: und dessen fünfzehnten Tag
  rationale: Das Suffix in בּוֹ verweist auf den zuvor genannten Monat. „dessen“ bewahrt diesen Rückbezug knapp und eindeutig.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: Jahr für Jahr
  rationale: Die Wiederholung von „Jahr“ hat distributive und nachdrückliche Kraft. „Jahr für Jahr“ ist im Deutschen idiomatisch und erhält zugleich die Wiederholungswirkung.
