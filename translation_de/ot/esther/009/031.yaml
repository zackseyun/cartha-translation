revisions:
- from: um diese Purimtage zu ihren festgesetzten Zeiten verbindlich zu machen[a], so wie Mordechai, der Jude, und die Königin Ester sie ihnen auferlegt hatten und wie sie selbst sie für sich und ihre Nachkommen übernommen hatten, zusammen mit den Bestimmungen über das Fasten und ihr Klagegeschrei[b].
  to: um diese Purimtage zu den dafür bestimmten Zeiten verbindlich festzulegen[a], so wie Mordechai, der Jude, und Königin Ester sie für sie festgelegt hatten und wie sie selbst für sich und ihre Nachkommen die Angelegenheiten der Fasten und ihres Rufens[b] festgelegt hatten.
  rationale: Die Revision gibt קִיַּם in allen drei Vorkommen als formelle Festlegung wieder, ohne die nicht ausdrücklich markierte Zwangsnunance von „auferlegen“ einzutragen. Sie macht deutlich, dass „die Angelegenheiten der Fasten und ihres Rufens“ der Gegenstand der Selbstverpflichtung für die Gemeinschaft und ihre Nachkommen ist. Die Fußnotenanker sind an die jeweils erläuterten Wörter gebunden.
