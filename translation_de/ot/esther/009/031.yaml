  text: לְ/קַיֵּ֡ם אֵת יְמֵי֩ הַ/פֻּרִ֨ים הָ/אֵ֜לֶּה בִּ/זְמַנֵּי/הֶ֗ם כַּ/אֲשֶׁר֩ קִיַּ֨ם עֲלֵי/הֶ֜ם מָרְדֳּכַ֤י הַ/יְּהוּדִי֙ וְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה וְ/כַ/אֲשֶׁ֛ר קִיְּמ֥וּ עַל נַפְשָׁ֖/ם וְ/עַל זַרְעָ֑/ם דִּבְרֵ֥י הַ/צֹּמ֖וֹת וְ/זַעֲקָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/031.yaml
  text: to establish these days of Purim at their appointed times[a], just as Mordecai the Jew and Esther the queen had established for them[b], and just as they had established for themselves and for their offspring the matters of the fasts and their cry.
translation:
  language: de
  text: um diese Purimtage zu den dafür bestimmten Zeiten verbindlich festzulegen[a], so wie Mordechai, der Jude, und Königin Ester sie für sie festgelegt hatten und wie sie selbst für sich und ihre Nachkommen die Angelegenheiten der Fasten und ihres Rufens[b] festgelegt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu bestätigen“ bzw. „festzusetzen“. Das wiederholte hebräische Verb bezeichnet hier die verbindliche Festlegung oder Bekräftigung der Feier.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihres Schreiens“ oder „ihres Flehens“. Das hebräische Wort kann einen lauten Ruf, einen Hilferuf oder eine Klage bezeichnen; wahrscheinlich sind die gemeinschaftlichen Rufe im Zusammenhang mit den Fasten gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  choice: verbindlich zu machen
  rationale: Das Piel von קום bezeichnet hier das formelle Festsetzen bzw. Bekräftigen einer verbindlichen Feier. Die Wendung gibt den administrativ-rechtlichen Sinn natürlich wieder.
- source_word: יְמֵי הַפֻּרִים הָאֵלֶּה
  choice: diese Purimtage
  rationale: Bewahrt den demonstrativen Bezug auf die zuvor behandelten Festtage und ist im Deutschen knapp und idiomatisch.
- source_word: בִּזְמַנֵּיהֶם
  choice: zu ihren festgesetzten Zeiten
  rationale: זְמָן meint hier die für die Feier bestimmten Termine; „festgesetzt“ macht diesen kalendarischen Sinn deutlich.
- source_word: כַּאֲשֶׁר קִיַּם עֲלֵיהֶם
  choice: so wie ... sie ihnen auferlegt hatten
  rationale: קים על kann eine verbindliche Festlegung auf eine Gruppe bezeichnen. „Auferlegt“ bildet die Konstruktion mit עַל deutlicher ab als das schwächere „für sie festgesetzt“.
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  choice: Mordechai, der Jude
  rationale: Die traditionelle ethnische Bezeichnung entspricht dem Gebrauch im Esterbuch; „Judäer“ wäre hier unnötig geografisch eingeengt.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: die Königin Ester
  rationale: Natürliches modernes Deutsch für die hebräische Apposition, ohne den Titelgehalt zu verändern.
- source_word: וְכַאֲשֶׁר קִיְּמוּ עַל נַפְשָׁם וְעַל זַרְעָם
  choice: und wie sie selbst sie für sich und ihre Nachkommen übernommen hatten
  rationale: Die Wendung mit נֶפֶשׁ und עַל bezeichnet eine selbst übernommene Verpflichtung. „Nachkommen“ gibt זֶרַע im generationsbezogenen Kontext natürlich wieder.
- source_word: דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם
  choice: zusammen mit den Bestimmungen über das Fasten und ihr Klagegeschrei
  rationale: דִּבְרֵי kann in administrativer Prosa Bestimmungen oder Angelegenheiten bezeichnen. Der Plural הַצֹּמוֹת kann kollektiv mit „das Fasten“ wiedergegeben werden. זַעֲקָה ist ein intensiver Ruf, hier im Zusammenhang des Fastens wahrscheinlich Klage oder Flehen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des hebräischen Verbs קים wird wegen der unterschiedlichen deutschen Konstruktionen nicht mechanisch einheitlich übersetzt; der gemeinsame Gedanke verbindlicher Festlegung bleibt erhalten. Der Vers ist syntaktisch von seinem Kontext abhängig und beginnt daher mit „um“.
