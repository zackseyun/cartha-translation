    rationale: Die Wendung bezeichnet eine für die Gemeinschaft geltende Festlegung. „Auferlegen“ kann zwar in den Bereich der Bedeutung fallen, legt aber eine stärker einseitig-zwanghafte Nuance nahe, die der hebräische Text nicht ausdrücklich verlangt.
  - severity: medium
    issue: „zusammen mit den Bestimmungen über das Fasten und ihr Klagegeschrei“
    rationale: Der hebräische Schluss bezeichnet den Gegenstand dessen, was die Gemeinschaft für sich und ihre Nachkommen festgelegt hatte. „Zusammen mit“ stellt ihn lockerer neben die Purimtage; zudem ist „Bestimmungen“ enger als דִּבְרֵי („Angelegenheiten“) und „Klagegeschrei“ stärker interpretierend als זַעֲקָה.
