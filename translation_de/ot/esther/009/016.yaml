  text: וּ/שְׁאָ֣ר הַ/יְּהוּדִ֡ים אֲשֶׁר֩ בִּ/מְדִינ֨וֹת הַ/מֶּ֜לֶךְ נִקְהֲל֣וּ וְ/עָמֹ֣ד עַל נַפְשָׁ֗/ם וְ/נ֨וֹחַ֙ מֵ/אֹ֣יְבֵי/הֶ֔ם וְ/הָרֹג֙ בְּ/שֹׂ֣נְאֵי/הֶ֔ם חֲמִשָּׁ֥ה וְ/שִׁבְעִ֖ים אָ֑לֶף וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָֽׁלְח֖וּ אֶת יָדָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/016.yaml
  text: And the rest of the Jews who were in the king’s provinces gathered themselves together and stood for their lives[a], and had relief from their enemies, and killed seventy-five thousand of those who hated them[b]; but they did not lay a hand on the plunder.
translation:
  language: de
  text: Und die übrigen Juden in den Provinzen des Königs versammelten sich, um für ihr Leben einzustehen[a]. Sie fanden Ruhe vor ihren Feinden und töteten 75.000 von denen, die sie hassten. Doch sie legten keine Hand an die Beute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ihr Leben zu verteidigen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הַיְּהוּדִים
  choice: Und die übrigen Juden
  rationale: שְׁאָר bezeichnet den verbleibenden Teil und stellt den Bezug zu den zuvor erwähnten Juden in Susa her; „die übrigen Juden“ ist im Deutschen natürlich und präzise.
- source_word: בִּמְדִינוֹת הַמֶּלֶךְ
  choice: in den Provinzen des Königs
  rationale: מְדִינָה bezeichnet hier die Verwaltungsprovinzen des persischen Reiches; die genitivische Fügung bewahrt den Sachbezug klar.
- source_word: נִקְהֲלוּ וְעָמֹד עַל נַפְשָׁם
  choice: versammelten sich, um für ihr Leben einzustehen
  rationale: נִקְהֲלוּ beschreibt das gemeinsame Sichversammeln. Die idiomatische Wendung עמד על־נפשׁם bezeichnet ein Eintreten zur Bewahrung des eigenen Lebens; die deutsche Zweckkonstruktion bildet den sachlichen Zusammenhang natürlich ab und erhält das Bild des Einstehens.
- source_word: וְנוֹחַ מֵאֹיְבֵיהֶם
  choice: Sie fanden Ruhe vor ihren Feinden
  rationale: נוּחַ bezeichnet das Erlangen von Ruhe beziehungsweise Entlastung gegenüber den Feinden. „Ruhe finden vor“ bewahrt das wiederkehrende Ruhe-Motiv des Kapitels und ist in gehobenem Erzählstil verständlich.
- source_word: וְהָרֹג בְּשֹׂנְאֵיהֶם
  choice: und töteten ... von denen, die sie hassten
  rationale: Die Konstruktion berichtet die Tötung innerhalb der Gruppe ihrer Hasser. „von denen, die sie hassten“ gibt שֹׂנְאֵיהֶם ohne wertende Erweiterung wieder.
- source_word: חֲמִשָּׁה וְשִׁבְעִים אָלֶף
  choice: '75.000'
  rationale: Die Zahl wird in der im Deutschen üblichen Reihenfolge und nach moderner Schreibkonvention wiedergegeben.
- source_word: וּבַבִּזָּה לֹא שָׁלְחוּ אֶת יָדָם
  choice: Doch an die Beute legten sie nicht Hand an
  rationale: בִּזָּה ist Kriegsbeute. Die deutsche Redewendung „Hand an etwas legen“ entspricht dem hebräischen Idiom und macht deutlich, dass sie die Beute nicht an sich nahmen; „doch“ bildet den sachlichen Gegensatz ab.
theological_decisions:
- issue: Moralische Rahmung des Handelns der Juden
  choice: „um für ihr Leben einzustehen“
  alternative: „um sich zu verteidigen“
  rationale: Die Übersetzung erhält den ausdrücklichen Lebensbezug der hebräischen Wendung und damit ihren Rahmen der Lebensbewahrung, ohne die berichtete Gewalt abzuschwächen oder durch eine stärker deutende Formulierung moralisch weiter einzuordnen.
translation_notes:
  register: Moderner, würdiger Erzählstil. Die Satzglieder wurden zur besseren deutschen Lesbarkeit auf zwei Sätze verteilt. Das hebräische Bild des Einstehens und das Motiv der Ruhe bleiben erhalten; die Gewalt wird direkt und ohne beschönigende Zusätze benannt.
