  text: נִקְהֲל֨וּ הַ/יְּהוּדִ֜ים בְּ/עָרֵי/הֶ֗ם בְּ/כָל מְדִינוֹת֙ הַ/מֶּ֣לֶךְ אֳחַשְׁוֵר֔וֹשׁ לִ/שְׁלֹ֣חַ יָ֔ד בִּ/מְבַקְשֵׁ֖י רָֽעָתָ֑/ם וְ/אִישׁ֙ לֹא עָמַ֣ד לִ/פְנֵי/הֶ֔ם כִּֽי נָפַ֥ל פַּחְדָּ֖/ם עַל כָּל הָ/עַמִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/002.yaml
  text: The Jews assembled in their cities throughout all the provinces of King Ahasuerus to lay hands on those seeking their harm[a], and no one could stand before them[c][b], because the fear of them had fallen on all the peoples.
translation:
  language: de
  text: Die Juden versammelten sich in ihren Städten, in allen Provinzen des Königs Ahasveros, um Hand an diejenigen zu legen, die ihnen Schaden zufügen wollten[a]. Niemand konnte ihnen standhalten[b], denn Furcht vor ihnen hatte alle Völker ergriffen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um die Hand gegen diejenigen auszustrecken, die ihr Unheil suchten“; gemeint ist ein gewaltsames Vorgehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Niemand konnte vor ihnen bestehen.“'
    reason: lexical_alternative
  - marker: c
    text: Mit „Völker“ können die verschiedenen ethnischen Gruppen oder Bevölkerungen innerhalb des Perserreichs gemeint sein.
    reason: cultural_note
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: versammelten sich
  rationale: Das Nifal von קהל bezeichnet das Zusammenkommen zu einer Versammlung; die reflexive deutsche Form gibt den Vorgang natürlich und präzise wieder.
- source_word: בְּעָרֵיהֶם
  choice: in ihren Städten
  rationale: עִיר bedeutet gewöhnlich „Stadt“; Präposition und Suffix sind unmittelbar lokal beziehungsweise possessiv wiedergegeben.
- source_word: בְּכָל מְדִינוֹת הַמֶּלֶךְ אֳחַשְׁוֵרוֹשׁ
  choice: in allen Provinzen des Königs Ahasveros
  rationale: מְדִינוֹת bezeichnet die Verwaltungsprovinzen des Perserreichs. „In allen Provinzen“ bewahrt den umfassenden Geltungsbereich.
- source_word: לִשְׁלֹחַ יָד
  choice: um die Hand zu erheben gegen
  rationale: Die feindselige hebräische Wendung bedeutet, gegen jemanden gewaltsam vorzugehen. „Die Hand gegen jemanden erheben“ erhält das Körperbild und ist im Deutschen verständlich.
- source_word: בִּמְבַקְשֵׁי רָעָתָם
  choice: die ihnen Schaden zufügen wollten
  rationale: Wörtlich sind es „die nach ihrem Unheil trachteten“. Die gewählte Formulierung gibt die feindliche Absicht in natürlichem Deutsch wieder, ohne sie stärker zu bestimmen.
- source_word: וְאִישׁ לֹא עָמַד לִפְנֵיהֶם
  choice: Niemand konnte ihnen standhalten
  rationale: Die wörtliche Aussage, dass kein Mensch vor ihnen stand, ist kontextuell eine Aussage über erfolglosen Widerstand. „Niemand“ entspricht hier idiomatischem modernen Deutsch.
- source_word: כִּי נָפַל פַּחְדָּם
  choice: denn Furcht vor ihnen hatte ... ergriffen
  rationale: פחד bezeichnet Furcht oder Schrecken. Das deutsche Verb „ergreifen“ vermittelt die resultative Wirkung des hebräischen Bildes „auf jemanden fallen“ natürlich.
- source_word: עַל כָּל הָעַמִּים
  choice: alle Völker
  rationale: Der Plural עַמִּים verweist auf die verschiedenen Völker beziehungsweise Bevölkerungsgruppen im Reich, nicht lediglich auf eine einheitliche Bevölkerung.
- source_word: אֳחַשְׁוֵרוֹשׁ
  choice: Ahasveros
  rationale: Verwendet wird die im Deutschen etablierte biblische Namensform.
