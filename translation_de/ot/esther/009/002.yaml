  to: Die Juden versammelten sich in ihren Städten, in allen Provinzen des Königs Ahasveros, um Hand an diejenigen zu legen, die ihnen Schaden zufügen wollten[a]. Niemand konnte ihnen standhalten[b], denn Furcht vor ihnen hatte alle Völker ergriffen[c].
