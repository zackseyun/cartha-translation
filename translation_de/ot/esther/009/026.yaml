  text: עַל כֵּ֡ן קָֽרְאוּ֩ לַ/יָּמִ֨ים הָ/אֵ֤לֶּה פוּרִים֙ עַל שֵׁ֣ם הַ/פּ֔וּר עַל כֵּ֕ן עַל כָּל דִּבְרֵ֖י הָ/אִגֶּ֣רֶת הַ/זֹּ֑את וּ/מָֽה רָא֣וּ עַל כָּ֔כָה וּ/מָ֥ה הִגִּ֖יעַ אֲלֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/026.yaml
  text: Therefore they called these days Purim[a], after the name of Pur. Therefore, because of all the words of this letter, and what they had seen concerning this matter, and what had happened to them[b],
translation:
  language: de
  text: Darum nannten sie diese Tage Purim[a], nach dem Namen »Pur«. Darum, aufgrund all der Worte dieses Schreibens und dessen, was sie in dieser Sache gesehen hatten und was ihnen widerfahren war[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach Pur«; wörtlich: »nach dem Namen Pur«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »was über sie gekommen war«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: nannte man
  rationale: Das Qal Perfekt 3. Person Plural steht hier in einem Benennungskontext. Die unpersönliche deutsche Form gibt den Sinn natürlich wieder, ohne ein im Vers nicht ausdrücklich genanntes Subjekt einzuführen.
- source_word: לַיָּמִים הָאֵלֶּה
  choice: diese Tage
  rationale: Der bestimmte Demonstrativausdruck bezeichnet die konkret besprochenen Festtage; »diese Tage« bewahrt seine deiktische Kraft.
- source_word: פוּרִים
  choice: Purim
  rationale: Der etablierte Eigenname des Festes wird transliteriert und zugleich durch die folgende Herleitung von »Pur« erläutert.
- source_word: עַל שֵׁם הַפּוּר
  choice: nach dem Namen »Pur«
  rationale: Dies bildet die hebräische Wendung עַל שֵׁם eng ab und macht die etymologische Verbindung zwischen Pur und Purim sichtbar.
- source_word: הַפּוּר
  choice: Pur
  rationale: Das Lehnwort wird hier beibehalten, weil der Satz den Festnamen etymologisch erklärt; die Bedeutung »Los« ergibt sich bereits aus dem Zusammenhang.
- source_word: עַל כֵּן
  choice: Darum
  rationale: »Darum« gibt die folgernde Kraft natürlich wieder. Die zweimalige Verwendung bleibt entsprechend der auffälligen Wiederholung im Hebräischen erhalten.
- source_word: עַל כָּל דִּבְרֵי הָאִגֶּרֶת הַזֹּאת
  choice: aufgrund all der Worte dieses Schreibens
  rationale: »Worte« wahrt die formale Nähe zu דִּבְרֵי, während »aufgrund« die kausale Verwendung von עַל ausdrückt. »Schreiben« ist im Deutschen für den hier gemeinten Brief beziehungsweise Erlass natürlich.
- source_word: וּמָה רָאוּ עַל כָּכָה
  choice: und dessen, was sie in dieser Sache gesehen hatten
  rationale: »Gesehen hatten« bewahrt die Grundbedeutung von רָאוּ; »in dieser Sache« gibt עַל כָּכָה idiomatisch wieder, ohne das Wahrnehmen näher auszudeuten.
- source_word: וּמָה הִגִּיעַ אֲלֵיהֶם
  choice: und was ihnen widerfahren war
  rationale: Die Wendung kann ausdrücken, was jemanden erreicht oder getroffen hat. »Widerfahren war« ist eine natürliche, würdige Wiedergabe und bewahrt etwas von diesem Bild.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Folgerungsformel »Darum« sowie der am Versende syntaktisch offene Satz werden bewahrt, da der Gedanke im folgenden Vers weitergeführt wird.
