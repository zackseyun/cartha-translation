  text: וַ/יִּכְתֹּ֣ב מָרְדֳּכַ֔י אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יִּשְׁלַ֨ח סְפָרִ֜ים אֶל כָּל הַ/יְּהוּדִ֗ים אֲשֶׁר֙ בְּ/כָל מְדִינוֹת֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ הַ/קְּרוֹבִ֖ים וְ/הָ/רְחוֹקִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/020.yaml
  text: Then Mordecai wrote these things and sent letters to all the Jews who were in all the provinces of King Ahasuerus[a], both near and far.
translation:
  language: de
  text: Mordechai schrieb diese Dinge[a] auf und sandte Briefe an alle Juden in sämtlichen Provinzen des Königs Ahasveros, an die Nahen wie an die Fernen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Worte“. Das hebräische Wort kann sowohl die eben geschilderten Vorgänge als auch die Worte bezeichnen, mit denen Mordechai sie schriftlich festhielt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: schrieb … auf
  rationale: Das Verb כתב bezeichnet hier das schriftliche Festhalten. „schrieb … auf“ ist im Deutschen natürlich und lässt sowohl einen Bericht als auch konkrete Worte zu.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Dinge
  rationale: דְּבָרִים kann Worte, Angelegenheiten oder Geschehnisse bezeichnen. „diese Dinge“ bewahrt den breiten Rückbezug, ohne ihn auf den Wortlaut oder allein auf Ereignisse festzulegen.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: sandte Briefe
  rationale: סְפָרִים meint in diesem administrativen Zusammenhang schriftliche Mitteilungen; „Briefe“ ist die klare und natürliche deutsche Entsprechung.
- source_word: כָּל הַיְּהוּדִים
  choice: alle Juden
  rationale: Die direkte Wiedergabe bezeichnet die jüdische Gemeinschaft im gesamten Reich.
- source_word: בְּכָל מְדִינוֹת
  choice: in sämtlichen Provinzen
  rationale: מְדִינוֹת sind Verwaltungsbezirke des Reiches. „Provinzen“ trifft den historischen Verwaltungskontext; „sämtlichen“ vermeidet die schwerfällige Folge „alle … allen“.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: des Königs Ahasveros
  rationale: Die hebräische Genitivverbindung wird idiomatisch wiedergegeben; „Ahasveros“ ist die im Deutschen geläufige Form des Namens.
- source_word: הַקְּרוֹבִים וְהָרְחוֹקִים
  choice: an die Nahen wie an die Fernen
  rationale: Die substantivierten Adjektive werden ausdrücklich auf die Empfänger bezogen. Die paarige Formulierung erhält den umfassenden Merismus.
- source_word: וַ
  choice: Mordechai schrieb
  rationale: Das narrative Waw führt die Handlung fort. Im modernen deutschen Erzählstil muss diese Verknüpfung nicht eigens mit „Und“ oder „Dann“ wiedergegeben werden.
theological_decisions: []
