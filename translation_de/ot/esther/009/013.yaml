base_translation:
  language: en
  yaml_path: translation/ot/esther/009/013.yaml
  text: Esther said[a], “If it pleases the king, let it be granted to the Jews who are in Susa to do tomorrow also according to today’s decree, and let Haman’s ten sons be hanged on the gallows.”
translation:
  language: de
  text: 'Ester sagte: »Wenn es dem König gefällt, soll den Juden in Susa gestattet werden, auch morgen nach der heutigen Verfügung zu handeln. Und die zehn Söhne Hamans soll man an den Baum[a] hängen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »an den Baum/das Holz«. Im Kontext kann damit eine hölzerne Hinrichtungs- oder Zurschaustellungsvorrichtung gemeint sein; daher sind auch »Pfahl« oder »Galgen« mögliche Wiedergaben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Wenn es dem König gefällt
  rationale: Die höfische Wendung bezeichnet das Wohlgefallen beziehungsweise die Zustimmung des Königs, nicht ein moralisches Urteil.
- source_word: יִנָּתֵן
  choice: soll ... gestattet werden
  rationale: Die passive Form mit aufforderndem Sinn erbittet eine offizielle königliche Genehmigung.
- source_word: גַּם מָחָר
  choice: auch morgen
  rationale: Die Genehmigung des heutigen Tages soll auf den folgenden Tag ausgedehnt werden.
- source_word: לַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: den Juden in Susa
  rationale: Das Dativobjekt bezeichnet die Empfänger der Erlaubnis; die kompakte Form ist im Deutschen natürlich und inhaltlich vollständig.
- source_word: לַעֲשׂוֹת כְּדָת הַיּוֹם
  choice: nach der heutigen Verfügung zu handeln
  rationale: דָּת bezeichnet im persischen Hofkontext eine amtliche Regelung oder Verfügung. Die breite Bedeutung von עשה bleibt mit »handeln« erhalten.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: die zehn Söhne Hamans
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen natürlich mit dem Genitiv wiedergegeben.
- source_word: יִתְלוּ עַל־הָעֵץ
  choice: soll man an dem Holz aufhängen
  rationale: תלה bedeutet »aufhängen«; עֵץ heißt wörtlich »Baum/Holz« und kann hier eine hölzerne Hinrichtungs- oder Schaustellungsanlage bezeichnen. Die Übersetzung bewahrt die Unbestimmtheit des Gegenstands, während die Fußnote die Möglichkeiten erläutert.
theological_decisions:
- issue: Ob die Söhne Hamans hier erst hingerichtet oder ihre bereits getöteten Leichen öffentlich aufgehängt werden sollen
  choice: Die Übersetzung legt den Zeitpunkt ihres Todes nicht ausdrücklich fest.
  alternative: »hinrichten lassen« oder »ihre Leichen aufhängen lassen«
  rationale: Der hebräische Satz sagt lediglich, dass sie aufgehängt werden sollen. Der nähere Kontext (Est 9,10.12) nennt sie bereits unter den Getöteten; dennoch sollte diese kontextuelle Folgerung nicht in den Vers selbst eingefügt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit höfischem Ton. »Verfügung« passt zum persischen Hofkontext, ohne unnötig juristisch oder altertümlich zu wirken. Die direkte Rede bleibt klar und natürlich.
