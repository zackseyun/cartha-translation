  verdict: revise
  source_fidelity: 'Der Entwurf gibt die höfische Bitte, die Ausdehnung auf den folgenden Tag, die Juden in Susa und die zehn Söhne Hamans zutreffend wieder. Die Formulierung „an dem Holz aufhängen“ ist jedoch im modernen Deutsch sowohl weniger idiomatisch als auch in der Richtungszuordnung unglücklich: Das hebräische עַל־הָעֵץ bezeichnet das Hängen an/auf einer hölzernen Struktur. „an den Baum hängen“ ist die natürliche, lexikalisch nahe Grundwiedergabe; die Fußnote wahrt die kontextabhängigen Alternativen.'
  naturalness: „Wenn es dem König gefällt“ und „nach der heutigen Verfügung zu handeln“ sind klar, würdig und modern. „An dem Holz“ klingt dagegen wie eine Materialbezeichnung und ist als Bezugspunkt für das Aufhängen nicht natürlich. „An den Baum“ ist idiomatischer. Die modale Bitte wird mit „soll ... gestattet werden“ beziehungsweise „soll man“ angemessen wiedergegeben.
  terminology: „Ester“, „Susa“, „Haman“ und „Verfügung“ sind passend. „Verfügung“ gibt דָּת als amtliche Regelung wieder, ohne den Handlungsspielraum des Verbs עשה einzuengen. Die Fußnote muss die Bedeutungsspanne von עֵץ und die im Kontext mögliche Hinrichtungs- bzw. Zurschaustellungsstruktur benennen, ohne den Vorgang dogmatisch festzulegen.
