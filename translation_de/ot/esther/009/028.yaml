  text: וְ/הַ/יָּמִ֣ים הָ֠/אֵלֶּה נִזְכָּרִ֨ים וְ/נַעֲשִׂ֜ים בְּ/כָל דּ֣וֹר וָ/ד֗וֹר מִשְׁפָּחָה֙ וּ/מִשְׁפָּחָ֔ה מְדִינָ֥ה וּ/מְדִינָ֖ה וְ/עִ֣יר וָ/עִ֑יר וִ/ימֵ֞י הַ/פּוּרִ֣ים הָ/אֵ֗לֶּה לֹ֤א יַֽעַבְרוּ֙ מִ/תּ֣וֹךְ הַ/יְּהוּדִ֔ים וְ/זִכְרָ֖/ם לֹא יָס֥וּף מִ/זַּרְעָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/028.yaml
  text: And these days are remembered and observed in every generation[a], every family, every province, and every city; and these days of Purim shall not pass away from among the Jews[c][b], and their remembrance shall not cease from their offspring.
translation:
  language: de
  text: Diese Tage werden in jeder Generation, in jeder Familie, in jeder Provinz und in jeder Stadt in Erinnerung gehalten und begangen werden.[a][b] Diese Purimtage werden unter den Juden nicht verschwinden, und die Erinnerung an sie wird bei ihren Nachkommen nicht aufhören.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „erinnert und getan“. Das mit „begangen“ wiedergegebene hebräische Verb bedeutet wörtlich „getan“ oder „gemacht“ und bezeichnet hier die praktische Begehung des Festes.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Generation für Generation, Familie für Familie, Provinz für Provinz und Stadt für Stadt“. Das Hebräische wiederholt jeweils das Substantiv im Singular und hebt so die lückenlose Verteilung hervor.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „und die Erinnerung an sie soll von ihrer Nachkommenschaft nicht aufhören“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִזְכָּרִים וְנַעֲשִׂים
  choice: in Erinnerung gehalten und begangen werden
  rationale: נזכרים bezeichnet das Bewahren im Gedächtnis; נעשים bedeutet wörtlich „getan/gemacht“ und meint bei Festtagen ihre praktische Begehung. Die deutsche Verbindung gibt beide Aspekte natürlich und präzise wieder.
- source_word: בְּכָל דּוֹר וָדוֹר
  choice: in jeder Generation
  rationale: Die Wiederholung des Singulars hat distributive Bedeutung und bezieht jede aufeinanderfolgende Generation ein.
- source_word: מִשְׁפָּחָה וּמִשְׁפָּחָה
  choice: in jeder Familie
  rationale: Die wiederholte Singularform wird im Deutschen idiomatisch durch „jeder“ wiedergegeben.
- source_word: מְדִינָה וּמְדִינָה
  choice: in jeder Provinz
  rationale: מדינה bezeichnet im persischen Verwaltungskontext des Esterbuches eine Provinz; die Wiederholung drückt die Verteilung auf jede einzelne Provinz aus.
- source_word: וְעִיר וָעִיר
  choice: und in jeder Stadt
  rationale: Die Formulierung bewahrt den distributiven Sinn in natürlichem Deutsch.
- source_word: יְמֵי הַפּוּרִים
  choice: Purimtage
  rationale: Das deutsche Kompositum gibt die hebräische Genitivverbindung knapp wieder und behält den etablierten Festnamen Purim bei.
- source_word: לֹא יַעַבְרוּ מִתּוֹךְ הַיְּהוּדִים
  choice: sollen unter den Juden nicht verschwinden
  rationale: עבר mit מתוך bezeichnet hier das Verschwinden aus der Gemeinschaft beziehungsweise ihrer Praxis. „Nicht verschwinden“ wahrt das Bild und ist im modernen Deutsch verständlich.
- source_word: וְזִכְרָם
  choice: und die Erinnerung an sie
  rationale: Das Suffix bezieht sich auf die Purimtage. Die explizite deutsche Form vermeidet ein unklares Pronomen.
- source_word: לֹא יָסוּף מִזַּרְעָם
  choice: soll bei ihren Nachkommen nicht aufhören
  rationale: יסוף bedeutet „aufhören/zu Ende gehen“; זרע bezeichnet hier die Nachkommenschaft. „Bei ihren Nachkommen“ gibt den gemeinten Fortbestand innerhalb der folgenden Generationen idiomatisch wieder.
