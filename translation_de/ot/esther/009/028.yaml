  register: Modernes, würdevolles Standarddeutsch. Die Soll-Form gibt im Zusammenhang die normative und auf Dauer gerichtete Aussage der hebräischen Partizipial- und Imperfektformen wieder. Die distributiven Wiederholungen werden im Haupttext lesbar mit „jeder“ ausgedrückt und in einer Fußnote transparent gemacht.
