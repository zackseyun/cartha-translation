  terminology: „Susa“, „Juden“, „Festmahl“ und „Freude“ sind treffend. „Festmahl“ gibt מִשְׁתֶּה in diesem Kontext angemessen wieder, ohne den möglichen Beiklang eines Trinkgelages unnötig einzuengen.
