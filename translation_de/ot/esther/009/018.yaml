  source_fidelity: Der Entwurf gibt den Gegensatz zu Vers 17 angemessen wieder und übersetzt נִקְהֲלוּ sachgerecht mit „versammelten sich“. Die beiden genannten Tage (13. und 14. des im Kontext vorausgesetzten Monats), die Ruhe am 15. Tag sowie dessen Charakter als Tag von Mahl/Feier und Freude sind vollständig und ohne sachliche Zusatzdeutung wiedergegeben.
