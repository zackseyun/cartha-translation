  text: ו/ה/יהודיים אֲשֶׁר בְּ/שׁוּשָׁ֗ן נִקְהֲלוּ֙ בִּ/שְׁלֹשָׁ֤ה עָשָׂר֙ בּ֔/וֹ וּ/בְ/אַרְבָּעָ֥ה עָשָׂ֖ר בּ֑/וֹ וְ/נ֗וֹחַ בַּ/חֲמִשָּׁ֤ה עָשָׂר֙ בּ֔/וֹ וְ/עָשֹׂ֣ה אֹת֔/וֹ י֖וֹם מִשְׁתֶּ֥ה וְ/שִׂמְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/018.yaml
  text: But the Jews who were in Susa assembled on the thirteenth day of it and on the fourteenth day of it[a], and rested on the fifteenth day of it[b], and made it a day of feasting and gladness.
translation:
  language: de
  text: Die Juden in Susa dagegen versammelten sich am dreizehnten und am vierzehnten Tag des Monats[a]. Am fünfzehnten Tag ruhten sie und machten ihn zu einem Tag des Festmahls und der Freude.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Dreizehnten darin und am Vierzehnten darin“; „darin“ bezieht sich aus dem Zusammenhang auf den Monat.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu einem Tag des Feierns und der Freude“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: Die Juden in Susa dagegen
  rationale: Das Waw hebt hier wahrscheinlich den Gegensatz zu den Juden in den Provinzen in Vers 17 hervor. „Dagegen“ gibt diesen Zusammenhang natürlich wieder; der Relativsatz wird im Deutschen knapp als Ortsangabe formuliert.
- source_word: נִקְהֲלוּ
  choice: versammelten sich
  rationale: Der Niphal von קהל bezeichnet hier das Zusammenkommen beziehungsweise Sichversammeln, ohne das Motiv weiter auszudeuten.
- source_word: בִּשְׁלֹשָׁה עָשָׂר בּוֹ וּבְאַרְבָּעָה עָשָׂר בּוֹ
  choice: am dreizehnten und am vierzehnten Tag des Monats
  rationale: Das Suffix in בּוֹ bezieht sich aus dem Zusammenhang auf den Monat. Die ausdrückliche Nennung des Monats ist im Deutschen klarer als das wörtliche „an seinem dreizehnten Tag“.
- source_word: וְנוֹחַ
  choice: ruhten sie
  rationale: נוח bezeichnet das Ruhen beziehungsweise die Beendigung des Kampfes; „ruhten“ bewahrt die knappe verbale Aussage.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: machten ihn zu
  rationale: Die Konstruktion bezeichnet, dass sie diesen Tag als einen Festtag begingen beziehungsweise gestalteten. „Machten ihn zu“ bleibt nahe am hebräischen Ausdruck.
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: einem Tag des Festmahls und der Freude
  rationale: מִשְׁתֶּה meint ein Festmahl oder Gelage, häufig einschließlich des Trinkens; „Festmahl“ ist würdig und allgemein verständlich. שִׂמְחָה wird unmittelbar mit „Freude“ wiedergegeben.
