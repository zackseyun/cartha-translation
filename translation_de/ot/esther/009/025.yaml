translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Pronomenstruktur des Hebräischen bleibt grundsätzlich erhalten; „jener“ verhindert lediglich eine missverständliche Zuordnung des bösen Plans zum König. Die ungewöhnliche Wendung zum königlichen Schreiben und die Unbestimmtheit von Hinrichtungsart und Holzgerüst werden in Fußnoten bewahrt.
