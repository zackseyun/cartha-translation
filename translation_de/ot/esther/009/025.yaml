base_translation:
  language: en
  yaml_path: translation/ot/esther/009/025.yaml
  text: But when she came before the king[a], he commanded by letter that his evil scheme which he had devised against the Jews should return on his own head[b], and they hanged him and his sons on the gallows.
translation:
  language: de
  text: Als sie aber vor den König trat, ordnete er schriftlich an[a], dass der böse Plan, den jener gegen die Juden geschmiedet hatte, auf seinen eigenen Kopf zurückfallen sollte. Und man hängte ihn und seine Söhne an den Galgen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und sehr knapp: »sagte er mit dem Schreiben«; gemeint ist offenbar eine schriftlich erlassene königliche Anordnung.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet wörtlich einen Baum oder ein Holz und kann hier auch einen Holzpfahl meinen. Die genaue Art der Hinrichtung – Aufhängen oder Pfählen – ist nicht eindeutig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבֹאָהּ לִפְנֵי הַמֶּלֶךְ
  choice: Als sie aber vor den König trat
  rationale: Das feminine Suffix verweist im Zusammenhang am ehesten auf Ester. „Vor den König treten“ gibt die Wendung für das Erscheinen in seiner Gegenwart natürlich und würdig wieder, ohne ihren Namen in den Text einzufügen.
- source_word: אָמַר עִם הַסֵּפֶר
  choice: ordnete er schriftlich an
  rationale: Die hebräische Formulierung ist knapp und wörtlich etwa „er sagte mit dem Schreiben“. Im Zusammenhang bezeichnet sie eine durch königliches Schreiben erlassene Anordnung; die Fußnote bewahrt die ungewöhnliche Ausdrucksweise.
- source_word: יָשׁוּב
  choice: zurückfallen sollte
  rationale: Das Verb beschreibt, wie sich Hamans Anschlag gegen ihn selbst kehrt. „Auf den eigenen Kopf zurückfallen“ entspricht zugleich dem hebräischen Vergeltungsbild.
- source_word: מַחֲשַׁבְתּוֹ הָרָעָה אֲשֶׁר חָשַׁב
  choice: der böse Plan, den jener … geschmiedet hatte
  rationale: מַחֲשָׁבָה meint hier einen absichtsvoll entworfenen Plan. „Geschmiedet“ bildet die Wiederholung derselben hebräischen Wortwurzel idiomatisch ab; „jener“ unterscheidet Haman vom unmittelbar zuvor genannten König, ohne einen Namen zu ergänzen.
- source_word: עַל רֹאשׁוֹ
  choice: auf seinen eigenen Kopf
  rationale: Die bildhafte hebräische Wendung für vergeltende Umkehr wird bewusst erhalten.
- source_word: וְתָלוּ אֹתוֹ וְאֶת־בָּנָיו עַל הָעֵץ
  choice: So hängte man ihn und seine Söhne an den Galgen
  rationale: תלה bezeichnet das Aufhängen, während עֵץ wörtlich Holz, Baum oder einen hölzernen Pfahl bezeichnen kann. „Galgen“ ist im Ester-Kontext verständlich und traditionell, ohne die genauere Hinrichtungsart im Haupttext festzulegen; die sachliche Unschärfe wird in der Fußnote offengelegt.
