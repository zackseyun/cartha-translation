lexical_decisions:
- source_word: וְ/אֵת
  choice: und; vor dem zweiten und dritten Namen im Deutschen teilweise nicht eigens wiedergegeben
  rationale: וְ mit dem Akkusativmarker אֵת führt jeden weiteren Namen in der fortlaufenden Objektliste ein. Der Akkusativmarker bleibt unübersetzt; natürliches Standarddeutsch setzt bei einer einfachen Aufzählung das verbindende „und“ gewöhnlich nur vor das letzte Glied. Das erste „und“ wahrt den Anschluss an den vorhergehenden Vers.
- source_word: פּוֹרָתָא
  choice: Porata
  rationale: Personenname, nach der hebräischen Form in einer im Deutschen gut lesbaren Form transliteriert.
- source_word: אֲדַלְיָא
  choice: Adalja
  rationale: Personenname; die Wiedergabe mit „j“ entspricht der üblichen deutschen Transliteration des konsonantischen Jod.
- source_word: אֲרִידָתָא
  choice: Aridata
  rationale: Personenname, nach der hebräischen Form in einer im Deutschen gut lesbaren Form transliteriert.
