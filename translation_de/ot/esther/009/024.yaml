source:
  edition: WLC
  text: כִּי֩ הָמָ֨ן בֶּֽן הַמְּדָ֜תָא הָֽ/אֲגָגִ֗י צֹרֵר֙ כָּל הַ/יְּהוּדִ֔ים חָשַׁ֥ב עַל הַ/יְּהוּדִ֖ים לְ/אַבְּדָ֑/ם וְ/הִפִּ֥יל פּוּר֙ ה֣וּא הַ/גּוֹרָ֔ל לְ/הֻמָּ֖/ם וּֽ/לְ/אַבְּדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/024.yaml
  text: For Haman son of Hammedatha the Agagite[a], the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur—that is[b], the lot—to crush them and to destroy them.
translation:
  language: de
  text: Denn Haman, der Sohn Hammedatas, der Agagiter, der Feind aller Juden, hatte gegen die Juden den Plan gefasst, sie zu vernichten. Er hatte das Pur[a], das heißt das Los, geworfen, um sie in Verwirrung zu stürzen[b] und zu vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Pur“ ist ein Lehnwort, das der Text selbst mit „Los“ erklärt. Die Beibehaltung des Wortes macht die Verbindung zum Namen des Purimfestes im Zusammenhang sichtbar.
    reason: cultural_note
  - marker: b
    text: 'Oder: „um sie in Panik zu versetzen“ oder „um sie zu verwirren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die im Zusammenhang beschriebene Festordnung ein und verbindet den Vers natürlich mit dem Vorhergehenden.
- source_word: הָמָן בֶּן הַמְּדָתָא הָאֲגָגִי
  choice: Haman, der Sohn Hammedatas, der Agagiter
  rationale: Die Eigennamen werden in geläufiger deutscher Form wiedergegeben; „Agagiter“ bleibt als Herkunfts- oder Dynastiebezeichnung erhalten.
- source_word: צֹרֵר כָּל הַיְּהוּדִים
  choice: der Feind aller Juden
  rationale: Das Partizip bezeichnet hier jemanden, der feindlich gegen andere handelt; die Wiedergabe ist klar und bewahrt die umfassende Aussage.
- source_word: חָשַׁב עַל הַיְּהוּדִים
  choice: hatte gegen die Juden den Plan gefasst
  rationale: Die Verbindung bezeichnet in diesem Zusammenhang ein feindseliges Vorhaben, nicht bloß einen Gedanken.
- source_word: לְאַבְּדָם
  choice: sie zu vernichten
  rationale: Die Kausativform von אבד bezeichnet hier die beabsichtigte vollständige Zerstörung; „vernichten“ gibt die Stärke des Ausdrucks wieder.
- source_word: וְהִפִּיל פּוּר
  choice: Er hatte das Pur geworfen
  rationale: Das persische Lehnwort „Pur“ bleibt erhalten, damit die Verbindung zum Namen des Purimfestes sichtbar bleibt. Die Satzteilung dient der Verständlichkeit, ohne den Gedankengang zu verändern.
- source_word: הוּא הַגּוֹרָל
  choice: das heißt das Los
  rationale: Die hebräische Apposition erklärt das fremde Wort „Pur“ ausdrücklich als Los.
- source_word: לְהֻמָּם
  choice: um sie in Verwirrung zu stürzen
  rationale: Die Form von המם kann das Versetzen in Bestürzung, Panik oder Verwirrung bezeichnen. Diese Wiedergabe wahrt die lexikalische Spannung und vermeidet eine unbegründete Gleichsetzung mit dem anschließenden „vernichten“.
- source_word: וּלְאַבְּדָם
  choice: und zu vernichten
  rationale: Die Wiederholung des Vernichtungsmotivs wird beibehalten und gibt die Steigerung des feindlichen Vorhabens wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die erklärende Apposition und die Wiederholung von „vernichten“ bleiben erhalten; die Mehrdeutigkeit von לְהֻמָּם wird im Haupttext und in der Fußnote kenntlich gemacht.
