  - severity: low
    issue: 'Fußnotenformulierung »wörtlicher: da war es umgekehrt«'
    rationale: Die knappe Wendung וְנַהֲפוֹךְ הוּא bezeichnet eine Umkehrung; die vorgeschlagene Erklärung sollte als mögliche formnähere Wiedergabe, nicht als eindeutige Steigerung von Wörtlichkeit, formuliert werden.
