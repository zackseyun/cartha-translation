source:
  edition: WLC
  text: וּ/בִ/שְׁנֵים֩ עָשָׂ֨ר חֹ֜דֶשׁ הוּא חֹ֣דֶשׁ אֲדָ֗ר בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֥ר יוֹם֙ בּ֔/וֹ אֲשֶׁ֨ר הִגִּ֧יעַ דְּבַר הַ/מֶּ֛לֶךְ וְ/דָת֖/וֹ לְ/הֵעָשׂ֑וֹת בַּ/יּ֗וֹם אֲשֶׁ֨ר שִׂבְּר֜וּ אֹיְבֵ֤י הַ/יְּהוּדִים֙ לִ/שְׁל֣וֹט בָּ/הֶ֔ם וְ/נַהֲפ֣וֹךְ ה֔וּא אֲשֶׁ֨ר יִשְׁלְט֧וּ הַ/יְּהוּדִ֛ים הֵ֖מָּה בְּ/שֹׂנְאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/001.yaml
  text: 'In the twelfth month[a], that is, the month Adar, on the thirteenth day of it, when the king’s word and his decree were to be carried out, on the day when the enemies of the Jews had hoped to rule over them, the opposite happened: the Jews themselves ruled over those who hated them.'
translation:
  language: de
  text: Im zwölften Monat, dem Monat Adar, am dreizehnten Tag dieses Monats, als der Befehl des Königs und sein Erlass ausgeführt werden sollten – an dem Tag, an dem die Feinde der Juden gehofft hatten, über sie zu herrschen –, kehrte sich alles um:[a] Die Juden selbst herrschten über diejenigen, die sie hassten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »es wurde umgekehrt« oder »es war umgekehrt«.'
    reason: Die knappe hebräische Wendung וְנַהֲפוֹךְ הוּא kann idiomatisch als Umkehrung der Lage oder formnäher als unpersönliche Aussage wiedergegeben werden.
lexical_decisions:
- source_word: וּבִשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: Im zwölften Monat
  rationale: Die Zeitangabe wird unmittelbar und ohne ein im Hebräischen nicht ausdrücklich vorhandenes »nun« wiedergegeben; das vorangestellte וּ dient hier dem Erzählanschluss.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: das ist der Monat Adar
  rationale: Die hebräische Apposition identifiziert den zwölften Monat ausdrücklich; »das ist« ist im Deutschen klar und natürlich.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: am dreizehnten Tag des Monats
  rationale: Das Suffix »an ihm/in ihm« bezieht sich auf den Monat. Die explizite Wiederaufnahme mit »des Monats« vermeidet im Deutschen eine schwerfällige Formulierung.
- source_word: אֲשֶׁר הִגִּיעַ דְּבַר הַמֶּלֶךְ וְדָתוֹ לְהֵעָשׂוֹת
  choice: als das Wort des Königs und sein Erlass ausgeführt werden sollten
  rationale: הִגִּיעַ bezeichnet hier das Eintreten des festgesetzten Vollzugstermins. »Wort« und »Erlass« bewahren die Unterscheidung zwischen דָּבָר und דָּת.
- source_word: בַּיּוֹם אֲשֶׁר
  choice: an eben dem Tag, an dem
  rationale: Die erneute Tagesangabe wird bewahrt; »eben« hebt die erzählerische Zuspitzung hervor, ohne neue Sachinformation hinzuzufügen.
- source_word: שִׂבְּרוּ
  choice: gehofft hatten
  rationale: Das Verb bezeichnet hoffende oder zuversichtliche Erwartung; das Plusquamperfekt macht die zeitliche und ironische Rückschau im Deutschen deutlich.
- source_word: לִשְׁלֹט בָּהֶם
  choice: Gewalt über sie zu gewinnen
  rationale: שׁלט bezeichnet Herrschaft oder Übermacht. »Gewalt über jemanden gewinnen« passt zum Konfliktzusammenhang und lässt offen, wie diese Übermacht konkret ausgeübt wird.
- source_word: וְנַהֲפוֹךְ הוּא
  choice: kehrte sich die Lage um
  rationale: Die idiomatische Wendung bezeichnet eine vollständige Umkehrung der erwarteten Verhältnisse. Die deutsche Formulierung ist natürlich und bewahrt die dramatische Wendung.
- source_word: אֲשֶׁר יִשְׁלְטוּ הַיְּהוּדִים הֵמָּה
  choice: Die Juden selbst gewannen Gewalt
  rationale: »selbst« gibt das betonte Personalpronomen הֵמָּה wieder; die Wiederholung von »Gewalt gewinnen« spiegelt die Umkehrung desselben Machtverhältnisses.
- source_word: בְּשֹׂנְאֵיהֶם
  choice: über diejenigen, die sie hassten
  rationale: Die Formulierung erhält die verbale Kraft des Partizips שֹׂנְאֵי und unterscheidet es vom zuvor gebrauchten Ausdruck »Feinde«.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange hebräische Satzbau bleibt in seiner zeitlichen Zuspitzung erkennbar, wird aber durch Gedankenstriche und Doppelpunkt lesbar gegliedert. Die Wiederholung von »Gewalt über … gewinnen« wahrt die symmetrische Umkehrung des Ausgangstextes.
