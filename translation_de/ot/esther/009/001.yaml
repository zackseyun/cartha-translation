revisions:
- from: Im zwölften Monat, das ist der Monat Adar, am dreizehnten Tag des Monats, als das Wort des Königs und sein Erlass ausgeführt werden sollten – an eben dem Tag, an dem die Feinde der Juden gehofft hatten, Gewalt über sie zu gewinnen –, kehrte sich die Lage um:[a] Die Juden selbst gewannen Gewalt über diejenigen, die sie hassten.
  to: Im zwölften Monat, dem Monat Adar, am dreizehnten Tag dieses Monats, als der Befehl des Königs und sein Erlass ausgeführt werden sollten – an dem Tag, an dem die Feinde der Juden gehofft hatten, über sie zu herrschen –, kehrte sich alles um:[a] Die Juden selbst herrschten über diejenigen, die sie hassten.
  rationale: Die Revision ersetzt die missverständliche, weniger idiomatische Gewaltformulierung durch »über ... herrschen«, das שׁלט in beiden spiegelbildlichen Satzteilen unmittelbar wiedergibt. Die Monatsapposition ist geglättet, ohne die ausdrückliche Identifikation des Adar oder den Bezug des Tages auf den Monat zu verlieren. Die Fußnote bietet belastbare Alternativen für die elliptische Wendung der Umkehrung.
