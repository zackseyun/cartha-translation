base_translation:
  language: en
  yaml_path: translation/ot/esther/009/015.yaml
  text: The Jews who were in Susa also assembled on the fourteenth day of the month of Adar[a], and they killed three hundred men in Susa; but they did not lay a hand on the plunder.
translation:
  language: de
  text: Auch die Juden in Susa versammelten sich am vierzehnten Tag des Monats Adar. Sie töteten in Susa dreihundert Männer, doch sie streckten ihre Hand nicht nach der Beute aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Sie eigneten sich die Beute nicht an.'
    reason: Erklärung der hebräischen Redewendung
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: versammelten sich
  rationale: Die Form von קהל bezeichnet das Zusammenkommen als Gruppe; die reflexive deutsche Wendung gibt den Vorgang natürlich und präzise wieder.
- source_word: הַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: die Juden in Susa
  rationale: Im Esterbuch bezeichnet יְהוּדִים das jüdische Volk in der persischen Diaspora; die knappe deutsche Form gibt den örtlich bestimmten Personenkreis klar wieder.
- source_word: גַּם
  choice: Auch
  rationale: Das Wort knüpft additiv an die Ereignisse des vorhergehenden Tages an.
- source_word: בְּיוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: am vierzehnten Tag des Monats Adar
  rationale: Die vollständige Datumsformulierung bewahrt die ausdrückliche Nennung des Monats.
- source_word: וַיַּהַרְגוּ
  choice: Sie töteten
  rationale: הרג ist das gewöhnliche Verb für töten; die direkte Wiedergabe vermeidet sowohl Beschönigung als auch archaische Sprache.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: dreihundert Männer
  rationale: אִישׁ steht nach der Zahl distributiv und bezeichnet hier männliche Personen.
- source_word: וּבַבִּזָּה
  choice: doch nach der Beute
  rationale: בִּזָּה bezeichnet erbeutete Güter. Das adversative „doch“ macht den aus dem Zusammenhang hervorgehenden Gegensatz zwischen Töten und Nichtaneignen der Beute deutlich.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: streckten sie ihre Hand nicht aus
  rationale: Die bildhafte hebräische Wendung wird bewusst eng wiedergegeben; im Zusammenhang bedeutet sie, dass sie die Beute nicht an sich nahmen.
