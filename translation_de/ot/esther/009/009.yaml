lexical_decisions:
- source_word: פַּרְמַשְׁתָּא
  choice: Parmaschta
  rationale: Der Personenname wird nach den üblichen deutschen Laut- und Schreibkonventionen aus dem Hebräischen übertragen.
- source_word: אֲרִיסַי
  choice: Arisai
  rationale: Der Personenname wird unmittelbar aus der vokalisierten hebräischen Form transliteriert.
- source_word: אֲרִדַי
  choice: Aridai
  rationale: Der Personenname wird unmittelbar aus der vokalisierten hebräischen Form transliteriert.
- source_word: וַיְזָתָא
  choice: Wajesata
  rationale: Der Personenname wird deutschsprachig transliteriert; W gibt das anlautende hebräische Waw wieder, und j kennzeichnet den konsonantischen Jod-Laut.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: Kommagliederung mit „und“ vor dem letzten Namen
  rationale: Die wiederholte Verbindung aus וְ und dem Akkusativmarker אֵת führt jedes Glied der fortlaufenden Aufzählung ein. Eine deutsche Aufzählung mit Kommas und abschließendem „und“ gibt diese Funktion natürlich wieder; die formale Wiederholung wird in der Fußnote dokumentiert.
