  text: וַ/יַּכּ֤וּ הַ/יְּהוּדִים֙ בְּ/כָל אֹ֣יְבֵי/הֶ֔ם מַכַּת חֶ֥רֶב וְ/הֶ֖רֶג וְ/אַבְדָ֑ן וַ/יַּֽעֲשׂ֥וּ בְ/שֹׂנְאֵי/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/005.yaml
  text: So the Jews struck all their enemies with the stroke of the sword[a], and with slaughter and destruction[b], and they did to those who hated them as they pleased.
translation:
  language: de
  text: Da schlugen die Juden alle ihre Feinde mit dem Schwert nieder, durch Tötung und Vernichtung; und mit denen, die sie hassten, verfuhren sie nach ihrem Willen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie es ihnen beliebte“. Wörtlich: „nach ihrem Willen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: schlugen … nieder
  rationale: נכה bezeichnet allgemein das Schlagen oder Niederschlagen. Im Zusammenhang mit „Schwert“, „Gemetzel“ und „Vernichtung“ ist „niederschlagen“ natürlich und bewahrt die Handlung, ohne das Verb für sich allein vorschnell auf „töten“ zu verengen.
- source_word: הַיְּהוּדִים
  choice: die Juden
  rationale: In Ester bezeichnet יְהוּדִים das jüdische Volk im persischen Diasporakontext; „die Juden“ ist im modernen Deutschen die klare und sachlich passende Wiedergabe.
- source_word: בְּכָל אֹיְבֵיהֶם
  choice: alle ihre Feinde
  rationale: Die Formulierung gibt den umfassenden Geltungsbereich von כָּל idiomatisch wieder.
- source_word: מַכַּת חֶרֶב
  choice: mit dem Schwert
  rationale: Wörtlich „Schlag des Schwertes“. Im Deutschen wirkt „mit dem Schlag des Schwertes“ unnatürlich; „mit dem Schwert niederschlagen“ bringt Bild und Handlung zusammen, während die anschließende Häufung gewaltsamer Begriffe erhalten bleibt.
- source_word: וְהֶרֶג וְאַבְדָן
  choice: mit Gemetzel und Vernichtung
  rationale: Die beiden Substantive bezeichnen Tötung beziehungsweise Gemetzel und Vernichtung. Die starke Wortwahl erhält die schonungslose Steigerung des Hebräischen, ohne sie zusätzlich zu verschärfen.
- source_word: בְשֹׂנְאֵיהֶם
  choice: mit denen, die sie hassten
  rationale: Die substantivierte Partizipialform von שׂנא wird ausdrücklich als „die sie hassten“ wiedergegeben und dadurch von „Feinde“ im ersten Satzteil unterschieden.
- source_word: כִּרְצוֹנָם
  choice: ganz nach ihrem Willen
  rationale: Die Wendung bedeutet wörtlich „nach ihrem Willen/Wunsch“. Diese Wiedergabe ist würdig und natürlich und lässt offen, welche konkreten Handlungen ihr Wille umfasste.
theological_decisions:
- issue: Darstellung der tödlichen Gewalt
  choice: Die drastische Begriffshäufung wird klar und ohne Beschönigung wiedergegeben.
  alternative: Die Handlung verallgemeinernd als „besiegen“ oder stärker interpretierend als vollständige „Ausrottung“ wiederzugeben.
  rationale: Der hebräische Text verbindet Schwertschlag, Gemetzel und Vernichtung. Die Übersetzung darf diese Härte weder abschwächen noch über den Wortlaut hinaus steigern.
- issue: Umfang von כִּרְצוֹנָם
  choice: „ganz nach ihrem Willen“
  alternative: „wie es ihnen gefiel“
  rationale: Die gewählte Formulierung wahrt die semantische Offenheit zwischen Wille, Wunsch und Belieben und vermeidet einen unnötig triumphierenden oder lustbetonten Unterton.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der hebräischen Reihung, wird aber durch die Verbindung „mit dem Schwert niederschlagen“ idiomatisch gestaltet. Die Gewalt wird weder euphemistisch abgeschwächt noch überzeichnet.
