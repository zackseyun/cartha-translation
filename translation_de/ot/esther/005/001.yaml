  source_fidelity: Die Grundstruktur und die räumlichen Angaben des Hebräischen sind im Entwurf weitgehend zutreffend wiedergegeben. Allerdings legt „stellte sich in den inneren Hof“ eine Bewegung in den Hof nahe, während וַתַּעֲמֹד primär Esters Stellung im Hof beschreibt. „Königshalle“ ist für בְּבֵית הַמַּלְכוּת zu spezifisch; der hebräische Ausdruck bezeichnet sicher ein königliches Haus bzw. den Palastbereich, nicht ausdrücklich eine Halle.
  naturalness: „Stellte sich ... auf“ ist modernes, idiomatisches Deutsch und hält die Bedeutung von „stand/nahm Stellung ein“ besser fest. „Im königlichen Palast“ ist natürlicher und weniger spekulativ als „in der Königshalle“.
  terminology: „Königspalast“, „Königsthron“ und „königlicher Palast“ sind angemessen. Die Fußnote zu מַלְכוּת sollte die ungewöhnliche konkrete Wendung genauer als „legte Königlichkeit an“ ausweisen, ohne eine bestimmte Art von Insignien festzulegen.
