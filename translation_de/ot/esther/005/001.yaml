  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י וַ/תִּלְבַּ֤שׁ אֶסְתֵּר֙ מַלְכ֔וּת וַֽ/תַּעֲמֹ֞ד בַּ/חֲצַ֤ר בֵּית הַ/מֶּ֨לֶךְ֙ הַ/פְּנִימִ֔ית נֹ֖כַח בֵּ֣ית הַ/מֶּ֑לֶךְ וְ֠/הַ/מֶּלֶךְ יוֹשֵׁ֞ב עַל כִּסֵּ֤א מַלְכוּת/וֹ֙ בְּ/בֵ֣ית הַ/מַּלְכ֔וּת נֹ֖כַח פֶּ֥תַח הַ/בָּֽיִת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/001.yaml
  text: On the third day[a], Esther put on her royal robes and stood in the inner court of the king’s palace, opposite the king’s house, while the king was sitting on his royal throne in the royal house[b], opposite the entrance of the house.
translation:
  language: de
  text: Am dritten Tag legte Ester ihre königlichen Gewänder an[a] und stellte sich im inneren Hof des Königspalastes auf, gegenüber dem Palastgebäude. Während der König auf seinem Königsthron im königlichen Palast saß, saß er dem Eingang des Gebäudes gegenüber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „legte Königlichkeit an“, das heißt, königliche Kleidung oder königliche Insignien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: nicht eigens wiedergegeben
  rationale: Die Form führt die Erzählung weiter. Im modernen Deutschen trägt der folgende Zeitsatz diese Funktion natürlich, ohne eine altertümliche Wendung wie „Und es geschah“ einzufügen.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Am dritten Tag
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: וַתִּלְבַּשׁ אֶסְתֵּר מַלְכוּת
  choice: legte Ester ihre königlichen Gewänder an
  rationale: Wörtlich steht etwa „Ester kleidete sich mit Königlichkeit“. Im Kontext bezeichnet מַלְכוּת die königliche Kleidung beziehungsweise Insignien; „königliche Gewänder“ gibt den konkreten Sinn verständlich wieder, während die Fußnote die ungewöhnliche Ausdrucksweise bewahrt.
- source_word: וַתַּעֲמֹד
  choice: stellte sich
  rationale: Das Verb bezeichnet hier, dass Ester ihren Platz im Hof einnimmt und dort steht. „Stellte sich“ bildet diesen zielgerichteten Vorgang natürlicher ab als das isolierte „stand“.
- source_word: בַּחֲצַר בֵּית־הַמֶּלֶךְ הַפְּנִימִית
  choice: in den inneren Hof des Königspalastes
  rationale: בֵּית kann „Haus“ bedeuten, bezeichnet in diesem höfischen Zusammenhang aber den Palastkomplex. Wegen der gerichteten Bewegung nach dem Sich-Hinstellen ist im Deutschen der Akkusativ idiomatisch.
- source_word: נֹכַח בֵּית הַמֶּלֶךְ
  choice: gegenüber dem Palastgebäude
  rationale: נֹכַח bezeichnet die Lage gegenüber beziehungsweise mit Blick auf etwas. „Palastgebäude“ unterscheidet den hier gemeinten Gebäudeteil verständlich vom umfassenderen Palastkomplex.
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: Der König saß
  rationale: Die Nominalkonstruktion schildert den gleichzeitig bestehenden Hintergrund. Ein eigener deutscher Hauptsatz gibt dies flüssig und ohne Bedeutungszusatz wieder.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: auf seinem Königsthron
  rationale: Die Verbindung bedeutet wörtlich „auf dem Thron seines Königtums“ und bezeichnet idiomatisch den königlichen Thron.
- source_word: בְּבֵית הַמַּלְכוּת
  choice: in der Königshalle
  rationale: Wörtlich etwa „im Haus des Königtums“. Im Kontext ist der königliche Innenraum beziehungsweise Audienzbereich gemeint; „Königshalle“ ist im Deutschen natürlich und bleibt von „Königspalast“ unterscheidbar.
- source_word: נֹכַח פֶּתַח הַבָּיִת
  choice: gegenüber dem Eingang des Gebäudes
  rationale: Die Formulierung bewahrt sowohl die räumliche Ausrichtung von נֹכַח als auch den Bezug auf den Eingang des genannten Gebäudes.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten hebräischen Ausdrücke für „Haus“ und „Königtum“ werden kontextgerecht differenziert, ohne die räumlichen Beziehungen des Verses aufzulösen. Der Fußnotenmarker [a] steht bei der Wendung, auf die sich die zugehörige lexikalische Anmerkung tatsächlich bezieht.
