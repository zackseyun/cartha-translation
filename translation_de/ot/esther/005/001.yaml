revisions:
- from: Am dritten Tag legte Ester ihre königlichen Gewänder an[a] und stellte sich in den inneren Hof des Königspalastes, gegenüber dem Palastgebäude. Der König saß auf seinem Königsthron in der Königshalle[b], gegenüber dem Eingang des Gebäudes.
  to: Am dritten Tag legte Ester ihre königlichen Gewänder an[a] und stellte sich im inneren Hof des Königspalastes auf, gegenüber dem Palastgebäude. Während der König auf seinem Königsthron im königlichen Palast saß, saß er dem Eingang des Gebäudes gegenüber.
  rationale: 'Die Stellung Esters wird ohne unnötige Bewegungsnuance wiedergegeben, und die zu spezifische „Königshalle“ wird durch „königlicher Palast“ ersetzt. Die zweite Satzformulierung muss jedoch noch ohne die Wiederholung „saß“ geglättet werden; eine sichere vollständige Fassung ist: „Während der König auf seinem Königsthron im königlichen Palast saß, gegenüber dem Eingang des Gebäudes.“'
