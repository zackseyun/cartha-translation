    rationale: Die Akkusativkonstruktion beschreibt im Deutschen eher ein Hineinstellen bzw. eine Zielbewegung. Das hebräische Verb bezeichnet hier Esters Stehen bzw. ihre eingenommene Position im Hof.
  - severity: medium
    issue: „Königshalle“ für בְּבֵית הַמַּלְכוּת
    rationale: „Halle“ fügt eine architektonische Spezifizierung hinzu, die der hebräische Text nicht bietet. „Königlicher Palast“ bewahrt den höfischen Kontext ohne diese Einengung.
  - severity: low
