base_translation:
  language: en
  yaml_path: translation/ot/esther/005/005.yaml
  text: Then the king said[a], "Hurry, bring Haman, so that Esther's word may be done." So the king and Haman came to the banquet that Esther had prepared.
translation:
  language: de
  text: 'Da sagte der König: »Beeilt euch, holt Haman, damit Esthers Bitte erfüllt wird.« So kamen der König und Haman zu dem Festmahl, das Esther vorbereitet hatte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַהֲרוּ אֶת הָמָן
  choice: Beeilt euch, holt Haman
  rationale: Der pluralische Imperativ von מהר richtet sich an Bedienstete und verlangt unverzügliches Handeln. Die Ergänzung »holt« macht im Deutschen die kontextuell vorausgesetzte Handlung natürlich deutlich.
- source_word: לַעֲשׂוֹת אֶת דְּבַר אֶסְתֵּר
  choice: damit Esthers Bitte ausgeführt wird
  rationale: דָּבָר bedeutet wörtlich »Wort« oder »Sache«, bezeichnet hier im höfischen Zusammenhang aber Esthers geäußertes Anliegen. »Bitte« gibt diesen Sinn idiomatisch wieder; »ausgeführt wird« bewahrt den Gedanken der Verwirklichung.
- source_word: וַיָּבֹא
  choice: kamen
  rationale: בוא kann je nach Erzählperspektive »kommen« oder »gehen« bedeuten. Mit dem genannten Ziel ist »kamen … zu« im Deutschen natürlich.
- source_word: הַמִּשְׁתֶּה
  choice: Festmahl
  rationale: מִשְׁתֶּה bezeichnet ein Fest beziehungsweise Gelage, häufig mit Trinken. »Festmahl« passt zum königlichen Rahmen und ist in modernem Deutsch würdig und verständlich.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: das Esther vorbereitet hatte
  rationale: עשה bezeichnet in Verbindung mit einem Festmahl dessen Ausrichtung oder Vorbereitung. Das Plusquamperfekt macht deutlich, dass die Vorbereitung vor ihrer Ankunft erfolgt war.
