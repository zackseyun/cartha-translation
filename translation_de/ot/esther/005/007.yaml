  text: וַ/תַּ֥עַן אֶסְתֵּ֖ר וַ/תֹּאמַ֑ר שְׁאֵלָתִ֖/י וּ/בַקָּשָׁתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/007.yaml
  text: Then Esther answered and said[a], “My petition and my request are:”
translation:
  language: de
  text: 'Da antwortete Esther und sagte: »Meine Bitte und mein Anliegen sind:[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Meine Frage und meine Bitte sind:« Das Hebräische verwendet eine formelle Verbindung zweier bedeutungsnaher Wörter für Esthers Gesuch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: Da antwortete
  rationale: Das narrative Waw führt die Handlung weiter; »da« gibt die zeitliche Folge im Deutschen natürlich wieder, während »antwortete« die übliche Bedeutung von ענה im Zusammenhang einer Redeantwort bewahrt.
- source_word: אֶסְתֵּר
  choice: Esther
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Schreibweise.
- source_word: וַתֹּאמַר
  choice: und sagte
  rationale: Die hebräische Doppelwendung »antwortete und sagte« bleibt erhalten, statt beide Verben zu einem einzigen zusammenzuziehen.
- source_word: שְׁאֵלָתִי
  choice: meine Bitte
  rationale: Das Substantiv kann eine Frage oder Bitte bezeichnen; im höfischen Kontext geht es um Esthers an den König gerichtete Bitte.
- source_word: וּבַקָּשָׁתִי
  choice: und mein Anliegen
  rationale: »Anliegen« bezeichnet hier das, worum Esther ersucht, und hält die beiden bedeutungsnahen hebräischen Substantive im Deutschen unterscheidbar.
theological_decisions: []
