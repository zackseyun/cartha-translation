    issue: Die Wiedergabe »Was hast du?« für מַה־לָּךְ
    rationale: Die Formulierung kann im heutigen Deutschen nach Vorwurf, Krankheit oder bloßer Befindlichkeit fragen. »Was ist dein Anliegen?« trifft die Frage nach ihrem Anliegen in diesem höfischen Kontext natürlicher, ohne die Aussage auf Bedrängnis festzulegen.
  - severity: medium
    issue: Das Pronomen in »Bis zur Hälfte des Königreichs – sie soll dir gegeben werden«
    rationale: Das feminine »sie« wird deutschsprachig auf »die Hälfte« bezogen; dadurch klingt es, als werde eine Reichshälfte tatsächlich übergeben. Das Hebräische lässt das Objekt offen und meint das Erbetene. Ein neutrales »es« bewahrt diese Rückbeziehung und die Formel besser.
