base_translation:
  language: en
  yaml_path: translation/ot/esther/005/003.yaml
  text: Then the king said to her[a], “What is it[c][b], Queen Esther? And what is your request? Up to half the kingdom—it will be given to you.”
translation:
  language: de
  text: 'Da sagte der König zu ihr: »Was ist dein Anliegen, Königin Ester?[a] Und was ist deine Bitte?[b] Selbst bis zur Hälfte des Königreichs soll es dir gegeben werden.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Was ist dir, Königin Ester?« Die hebräische Wendung fragt nach ihrem Anliegen und kann auch nach dem fragen, was sie bedrückt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gesuch« beziehungsweise »Begehren«.'
    reason: lexical_alternative
  - marker: c
    text: »Bis zur Hälfte des Königreichs« ist eine herkömmliche königliche Formel für eine großzügige Zusage; sie muss nicht als wörtliches Angebot verstanden werden, das Reich zu teilen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das konsekutive Waw führt die Erzählung weiter; »Da sagte« gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: לָהּ
  choice: zu ihr
  rationale: Entspricht unmittelbar der Präposition mit dem femininen Pronominalsuffix.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: מַה לָּךְ
  choice: Was hast du
  rationale: Die hebräische Wendung lautet wörtlich etwa »Was ist dir?« und fragt nach Esters Anliegen oder danach, was sie bedrückt. »Was hast du?« bewahrt die Offenheit und klingt im Deutschen natürlich.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Königin Ester
  rationale: Im Deutschen steht der Herrschertitel idiomatisch vor dem Namen; die moderne deutsche Namensform »Ester« wird verwendet.
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: Und was ist deine Bitte?
  rationale: בַּקָּשָׁה bezeichnet eine Bitte oder ein Gesuch. »Bitte« ist verständlich, würdig und für eine königliche Audienz angemessen.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Bis zur Hälfte des Königreichs
  rationale: Gibt die bezeichnete Höchstgrenze der königlichen Zusage knapp und formal nah wieder.
- source_word: וְיִנָּתֵן לָךְ
  choice: sie soll dir gegeben werden
  rationale: Der passive Nifal-Imperfekt drückt hier eine königliche Zusicherung aus. Das feminine Pronomen bezieht sich im Deutschen natürlich auf »Bitte«; »soll« bewahrt den feierlich-zusichernden Ton.
