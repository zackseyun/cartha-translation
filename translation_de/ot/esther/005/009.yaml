  text: וַ/יֵּצֵ֤א הָמָן֙ בַּ/יּ֣וֹם הַ/ה֔וּא שָׂמֵ֖חַ וְ/ט֣וֹב לֵ֑ב וְ/כִ/רְאוֹת֩ הָמָ֨ן אֶֽת מָרְדֳּכַ֜י בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ וְ/לֹא קָם֙ וְ/לֹא זָ֣ע מִמֶּ֔/נּוּ וַ/יִּמָּלֵ֥א הָמָ֛ן עַֽל מָרְדֳּכַ֖י חֵמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/009.yaml
  text: Haman went out that day joyful and glad of heart. But when Haman saw Mordecai in the king’s gate[a], and that he did not rise or tremble before him, Haman was filled with rage against Mordecai.
translation:
  language: de
  text: An diesem Tag ging Haman fröhlich und guten Mutes hinaus. Als Haman aber Mordechai im Tor des Königs sah, der weder vor ihm aufstand noch vor ihm zitterte[a], wurde Haman von Zorn gegen Mordechai erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »noch sich seinetwegen regte«; auch möglich: »noch vor ihm Furcht zeigte«.'
    reason: Das seltene Verb זוע kann Zittern beziehungsweise Erschrecken oder allgemeiner eine durch Haman ausgelöste Bewegung ausdrücken.
lexical_decisions:
- source_word: שָׂמֵחַ וְטוֹב לֵב
  choice: fröhlich und guten Mutes
  rationale: Die Wiedergabe erfasst die idiomatische Bedeutung eines freudigen, gehobenen Gemütszustands und bewahrt zugleich die zweigliedrige hebräische Form in natürlichem Deutsch.
- source_word: בַּיּוֹם הַהוּא
  choice: an diesem Tag
  rationale: Die Formulierung gibt die zeitliche Bestimmung präzise und in idiomatischem modernem Deutsch wieder.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: im Tor des Königs
  rationale: Das hebräische ב kann »in« oder »an« bedeuten; »im Tor« lässt an den umfassenderen Torbereich des königlichen Hofes denken und bleibt quellennah.
- source_word: וְלֹא קָם
  choice: weder vor ihm aufstand
  rationale: קום bezeichnet hier das Aufstehen als Geste der Ehrerbietung. Die Ergänzung »vor ihm« macht den sozialen Bezug im Deutschen deutlich.
- source_word: וְלֹא זָע מִמֶּנּוּ
  choice: noch vor ihm zitterte
  rationale: זוע kann Zittern, Beben oder erschrockenes Sichregen bezeichnen. »Vor ihm zitterte« bewahrt das starke Bild, ohne die mögliche Bedeutung bloßer Bewegung im Haupttext festzulegen.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: wurde ... von Zorn erfüllt
  rationale: Die Formulierung bildet die hebräische Konstruktion des Erfülltwerdens mit heftigem Zorn würdig und verständlich ab.
- source_word: עַל מָרְדֳּכַי
  choice: über Mordechai
  rationale: Bei einem Ausdruck des Zorns kann עַל dessen Ziel beziehungsweise Anlass bezeichnen. »Zorn über Mordechai« ist im Deutschen natürlich und erhält diese Beziehung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt erzählerisch klar; traditionelle, heute aber steife Wendungen wie »guten Herzens« werden vermieden. Die Mehrdeutigkeit von זוע wird durch eine Fußnote erhalten.
