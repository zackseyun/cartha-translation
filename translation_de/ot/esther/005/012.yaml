base_translation:
  language: en
  yaml_path: translation/ot/esther/005/012.yaml
  text: Then Haman said[a], “Indeed, Queen Esther brought no one with the king to the banquet she prepared except me[b]; and tomorrow also I am invited by her together with the king.”
translation:
  language: de
  text: 'Da sagte Haman: »Ja, Königin Ester hat außer mir niemanden zusammen mit dem König zu dem Festmahl kommen lassen, das sie veranstaltet hat. Und auch morgen bin ich zusammen mit dem König von ihr eingeladen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Wayyiqtol führt die Handlung fort; »Da sagte« gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: אַף לֹא
  choice: Ja, ... niemanden
  rationale: Die Wendung verstärkt Hamans prahlerische Behauptung. »Ja« setzt einen natürlichen emphatischen Akzent, während »niemanden ... außer mir« die Verneinung trägt.
- source_word: הֵבִיאָה
  choice: hat ... kommen lassen
  rationale: Der Hifil von בוא bedeutet wörtlich »bringen« beziehungsweise »kommen lassen«. Im Deutschen bewahrt »kommen lassen« den kausativen Ausdruck und passt zugleich zum Einladungskontext.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Königin Ester
  rationale: Die im Deutschen übliche Titelstellung gibt Name und königlichen Rang vollständig wieder.
- source_word: עִם הַמֶּלֶךְ
  choice: zusammen mit dem König
  rationale: »Zusammen mit« macht die gemeinsame Teilnahme Hamans und des Königs klar und gibt עִם unmittelbar wieder.
- source_word: אֶל הַמִּשְׁתֶּה
  choice: zu dem Festmahl
  rationale: מִשְׁתֶּה bezeichnet ein festliches Mahl, häufig mit dem Aspekt des Trinkens. »Festmahl« passt zum höfischen Zusammenhang und ist in modernem Deutsch würdig und verständlich.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: das sie veranstaltet hat
  rationale: Wörtlich heißt die Wendung »das sie gemacht hat«; bei einem Festmahl ist »veranstaltet« idiomatisch und bezeichnet Ester als Gastgeberin, ohne zusätzliche Einzelheiten einzutragen.
- source_word: כִּי אִם אוֹתִי
  choice: außer mir
  rationale: Die Konstruktion drückt nach einer Verneinung eine Ausnahme aus. »Niemanden ... außer mir« ist knapp und genau.
- source_word: וְגַם לְמָחָר
  choice: Und auch morgen
  rationale: Bewahrt sowohl den anschließenden als auch den additiven Sinn von וְגַם sowie die Zeitangabe.
- source_word: קָרוּא לָהּ
  choice: bin ... bei ihr eingeladen
  rationale: קָרוּא bedeutet wörtlich »gerufen«, bezeichnet hier aber idiomatisch einen Eingeladenen. Das לָהּ lässt sich im Deutschen natürlich mit »bei ihr« wiedergeben und bewahrt Ester als Gastgeberin.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. Hamans selbstgefälliger Nachdruck bleibt hörbar, ohne ihn durch wertende Zusätze zu erklären. »Festmahl« wahrt den höfischen Rahmen; »kommen lassen« bleibt näher an der hebräischen Kausativform als das stärker deutende »einladen« im ersten Satzteil.
