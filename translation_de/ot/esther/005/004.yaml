  text: Esther said[a], “If it pleases the king[b], let the king and Haman come today to the banquet that I have prepared for him.”
translation:
  language: de
  text: 'Ester sagte: „Wenn es dem König gefällt[a], mögen der König und Haman heute zum Festmahl kommen, das ich für ihn[b] bereitet habe.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn es dem König gut scheint.“'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische hat hier die Einzahl „für ihn“; damit ist offenbar der König gemeint, obwohl auch Haman eingeladen ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Wenn es dem König gefällt
  rationale: Die höfische Wendung leitet eine ehrerbietige Bitte ein. Die deutsche Formulierung ist natürlich, würdevoll und gibt den Sinn günstiger königlicher Zustimmung wieder.
- source_word: יָבוֹא
  choice: mögen … kommen
  rationale: Die morphologische Imperfektform hat hier im Kontext einer höflichen Einladung volitiven beziehungsweise jussivischen Sinn. „Mögen … kommen“ bewahrt diesen bittenden Ton.
- source_word: הַמֶּלֶךְ וְהָמָן
  choice: der König und Haman
  rationale: Der hebräische Text wiederholt den Titel „der König“ und nennt danach Haman. Die Übersetzung ergänzt weder einen Eigennamen noch ersetzt sie den Titel durch ein Pronomen.
- source_word: הַיּוֹם
  choice: heute
  rationale: „Heute“ ist die natürliche moderne Entsprechung und bewahrt die zeitliche Unmittelbarkeit der Einladung.
- source_word: הַמִּשְׁתֶּה
  choice: Festmahl
  rationale: מִשְׁתֶּה bezeichnet ein Fest beziehungsweise Bankett, häufig einschließlich des Trinkens. „Festmahl“ passt zum königlichen Rahmen, ohne den Aspekt des Trinkens unnötig in den Vordergrund zu stellen.
- source_word: אֲשֶׁר עָשִׂיתִי לוֹ
  choice: das ich für ihn bereitet habe
  rationale: Bei einem Festmahl wird עָשָׂה im Deutschen idiomatisch mit „bereiten“ wiedergegeben. Das singularische לוֹ bleibt als „für ihn“ erhalten und wird nicht zu „für sie“ geglättet.
