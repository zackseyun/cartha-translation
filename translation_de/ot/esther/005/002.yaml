base_translation:
  language: en
  yaml_path: translation/ot/esther/005/002.yaml
  text: And when the king saw Esther the queen standing in the court[a], she found favor in his sight, and the king extended to Esther the golden scepter that was in his hand[c][b]. Then Esther came near and touched the top of the scepter.
translation:
  language: de
  text: Als der König die Königin Ester im Hof[a] stehen sah, fand sie Gunst in seinen Augen.[b] Da streckte der König Ester das goldene Zepter entgegen, das er in der Hand hielt. Ester trat näher und berührte die Spitze des Zepters.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Innenhof“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „trug Gunst in seinen Augen“; eine hebräische Wendung dafür, dass sie sein Wohlwollen gewann.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: „den Kopf des Zepters“; gemeint ist dessen oberes beziehungsweise vorderes Ende.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹת
  choice: Als ... sah
  rationale: Die Konstruktion leitet einen temporalen Nebensatz ein; „Als“ gibt den Erzählfluss natürlich wieder, ohne das hebräische וַיְהִי unnötig wörtlich abzubilden.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: die Königin Ester
  rationale: Im modernen Deutschen ist die Verbindung von Titel und Name in dieser Reihenfolge natürlich und würdig, auch wenn das Hebräische Name und Titel appositionell umgekehrt anordnet.
- source_word: עֹמֶדֶת בֶּחָצֵר
  choice: im Hof stehen
  rationale: חָצֵר bezeichnet hier den abgegrenzten Hofbereich des Palastes; „Hof“ ist im Deutschen sachlich und kontextgerecht.
- source_word: נָשְׂאָה חֵן בְּעֵינָיו
  choice: fand sie Gunst in seinen Augen
  rationale: Die gewählte Formulierung bewahrt das hebräische Bild und vermittelt zugleich verständlich, dass der König ihr wohlgesinnt war.
- source_word: וַיּוֹשֶׁט
  choice: streckte ... entgegen
  rationale: Das Verb bezeichnet das Ausstrecken eines Gegenstands zu jemandem hin; „entgegenstrecken“ macht Richtung und königliche Geste im Deutschen deutlich.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: das goldene Zepter
  rationale: „Zepter“ ist die etablierte deutsche Bezeichnung für das königliche Herrschaftszeichen; „golden“ gibt das attributive הַזָּהָב idiomatisch wieder.
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: das er in der Hand hielt
  rationale: Das Hebräische lautet knapp „das in seiner Hand [war]“; „hielt“ ist eine natürliche deutsche Explikation ohne Bedeutungsverschiebung.
- source_word: וַתִּקְרַב
  choice: Ester trat näher
  rationale: Die Formulierung gibt Esters anschließende Annäherung knapp und in natürlichem Erzählstil wieder.
- source_word: וַתִּגַּע בְּרֹאשׁ הַשַּׁרְבִיט
  choice: berührte die Spitze des Zepters
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“, bezeichnet bei einem länglichen Gegenstand aber dessen oberes beziehungsweise vorderes Ende; „Spitze“ ist hier die natürliche deutsche Wiedergabe.
