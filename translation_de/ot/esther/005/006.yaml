base_translation:
  language: en
  yaml_path: translation/ot/esther/005/006.yaml
  text: And the king said to Esther at the wine banquet[a], “What is your petition? It will be granted to you. And what is your request? Even up to half the kingdom[b], it will be done.”
translation:
  language: de
  text: 'Und der König sagte zu Ester beim Weinmahl: „Was ist deine Bitte? Sie soll dir gewährt werden.[a] Und was ist dein Wunsch? Bis zur Hälfte des Königreichs[b] – er soll erfüllt werden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie soll dir gegeben werden.“'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „bis zur Hälfte des Königreichs“; im Text steht nicht ausdrücklich „meines Königreichs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: beim Weingelage
  rationale: מִשְׁתֶּה bezeichnet ein Festmahl, bei dem getrunken wird; הַיַּיִן nennt ausdrücklich den Wein. „Weingelage“ gibt die festliche Trinksituation knapp und idiomatisch wieder.
- source_word: שְּׁאֵלָתֵךְ
  choice: deine Bitte
  rationale: Das von שאל abgeleitete Substantiv bezeichnet hier keine Frage, sondern eine an den König gerichtete Bitte.
- source_word: וְיִנָּתֵן לָךְ
  choice: Sie soll dir gewährt werden
  rationale: Die Niphal-Form von נתן drückt in der königlichen Zusage aus, dass Esters Bitte bewilligt beziehungsweise gegeben werden soll. „Gewährt“ ist im Deutschen für eine Bitte idiomatisch.
- source_word: בַּקָּשָׁתֵךְ
  choice: dein Wunsch
  rationale: בַּקָּשָׁה bezeichnet das Erbetene oder Begehrte. „Wunsch“ bewahrt eine leichte sprachliche Unterscheidung gegenüber שְׁאֵלָה („Bitte“), ohne den Sinn zu verändern.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Bis zur Hälfte des Königreichs
  rationale: Der hebräische Text enthält kein ausdrückliches Possessivpronomen „meines“. Die Formulierung bewahrt die königliche Hyperbel und bleibt quellennah.
- source_word: וְתֵעָשׂ
  choice: er soll erfüllt werden
  rationale: Die Form bezeichnet hier die Ausführung beziehungsweise Erfüllung des erbetenen Wunsches. Das deutsche Pronomen bezieht sich natürlich auf „Wunsch“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper höfischer Rede. Die parallelen Begriffe werden als „Bitte“ und „Wunsch“ unterschieden; die fehlende Besitzangabe bei „Königreich“ bleibt erhalten.
