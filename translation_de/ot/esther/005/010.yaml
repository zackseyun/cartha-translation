  yaml_path: translation/ot/esther/005/010.yaml
  text: But Haman restrained himself and went to his house[b][a]. Then he sent and brought in his friends and Zeresh his wife.
translation:
  language: de
  text: Doch Haman beherrschte sich[a] und ging nach Hause[b]. Dann schickte er nach seinen Freunden und seiner Frau Seresch und ließ sie zu sich kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hielt sich zurück“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ging zu seinem Haus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַפַּק
  choice: beherrschte sich
  rationale: Das Hitpael von אפק bezeichnet hier Selbstbeherrschung angesichts des unmittelbar zuvor genannten Zorns. „Beherrschte sich“ ist natürliches modernes Deutsch und bewahrt den reflexiven Sinn.
- source_word: וַיָּבֹא אֶל־בֵּיתוֹ
  choice: ging nach Hause
  rationale: Die Wendung bezeichnet die Bewegung zu seinem Haus. „Ging nach Hause“ gibt sie im Deutschen idiomatisch und präzise wieder.
- source_word: וַיִּשְׁלַח וַיָּבֵא
  choice: ließ ... holen
  rationale: Die knappe hebräische Folge „er sandte und ließ kommen/brachte“ beschreibt ein Aussenden mit dem Ziel, die genannten Personen zu ihm kommen zu lassen. „Ließ ... holen“ bildet diesen kausativen Zusammenhang natürlich ab.
- source_word: אֹהֲבָיו
  choice: seine Freunde
  rationale: Das substantivierte Wort aus der Wurzel אהב bezeichnet hier Hamans persönliche Freunde beziehungsweise Vertraute; „Freunde“ ist die natürliche kontextuelle Wiedergabe.
- source_word: זֶרֶשׁ אִשְׁתּוֹ
  choice: seine Frau Seresch
  rationale: Die deutsche Apposition ist in dieser Reihenfolge natürlicher als „Seresch, seine Frau“ und bezeichnet dieselbe Beziehung eindeutig.
- source_word: וַ
  choice: Doch / Dann
  rationale: 'Das erste narrative Waw erhält im Kontext einen leicht adversativen Sinn: Trotz seines Zorns beherrscht Haman sich. Danach führt „Dann“ die Erzählfolge natürlich weiter.'
