base_translation:
  language: en
  yaml_path: translation/ot/esther/005/013.yaml
  text: Yet all this is worth nothing to me whenever I see Mordecai the Jew sitting at the king’s gate[a][b].
translation:
  language: de
  text: Doch das alles ist mir nichts wert, jedes Mal, wenn ich Mordechai, den Juden, am Tor des Königs sitzen sehe.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und das alles hat für mich keinen Wert, jedes Mal, wenn ich Mordechai, den Juden, am Tor des Königs sitzen sehe.«'
    reason: lexical_alternative
  - marker: b
    text: »den Juden« kann auch mit »den Judäer« wiedergegeben werden; hier wird wahrscheinlich Mordechais jüdische ethnische Zugehörigkeit im Umfeld des persischen Hofes hervorgehoben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל־זֶה
  choice: Doch das alles
  rationale: Das einleitende וְ kann schlicht »und« bedeuten, hat hier im Zusammenhang mit Hamans vorherigen Prahlereien jedoch eine kontrastierende Wirkung. »Doch« gibt diesen Gegensatz im Deutschen natürlich wieder.
- source_word: אֵינֶנּוּ שֹׁוֶה לִי
  choice: ist mir nichts wert
  rationale: Die Wendung bezeichnet hier, dass alle Ehren für Haman keinen Wert haben, solange Mordechai ihn kränkt. »Ist mir nichts wert« ist idiomatisch und bewahrt den wertenden Sinn von שׁוה.
- source_word: בְּכָל־עֵת אֲשֶׁר
  choice: solange
  rationale: Wörtlich bezeichnet die Wendung »jedes Mal, wenn«. Im Zusammenhang kann sie sowohl das wiederholte Sehen als auch den fortdauernden Zustand ausdrücken. »Solange« gibt Hamans anhaltende Unzufriedenheit natürlich wieder; die engere zeitliche Alternative wird in einer Fußnote genannt.
- source_word: רֹאֶה
  choice: ich … sehe
  rationale: Das Partizip mit אֲנִי beschreibt ein andauerndes oder wiederholtes Wahrnehmen. Die einfache Formulierung »ich sehe« passt natürlich zum deutschen Temporalsatz.
- source_word: מָרְדֳּכַי
  choice: Mordechai
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition als »Mordechai« wiedergegeben.
- source_word: הַיְּהוּדִי
  choice: den Juden
  rationale: יְהוּדִי kann »Jude« oder »Judäer« bedeuten. Im persischen Diasporakontext des Esterbuchs bezeichnet es hier wahrscheinlich Mordechais jüdische ethnische Zugehörigkeit.
- source_word: יוֹשֵׁב
  choice: sitzen
  rationale: Das Partizip bezeichnet Mordechais Haltung beziehungsweise seinen Platz am Königstor. »Sitzen« bewahrt das anschauliche Bild ohne interpretierende Ergänzung.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: am Tor des Königs
  rationale: Die Wendung meint den Torbereich der königlichen Residenz, der auch administrativen Zwecken diente. »Am Tor des Königs« ist verständlich und bleibt formal nahe am Hebräischen.
