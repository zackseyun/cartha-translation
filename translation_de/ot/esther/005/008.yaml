base_translation:
  language: en
  yaml_path: translation/ot/esther/005/008.yaml
  text: If I have found favor in the eyes of the king[a], and if it pleases the king to grant my petition and fulfill my request, let the king and Haman come to the banquet that I will prepare for them[b], and tomorrow I will do according to the king’s word.
translation:
  language: de
  text: »Wenn ich in den Augen des Königs Gunst gefunden habe[a] und wenn es dem König gefällt, mir meine Bitte zu gewähren und mein Anliegen zu erfüllen, dann möge der König mit Haman zu dem Festmahl kommen, das ich für sie bereiten werde. Morgen werde ich dann dem Wort des Königs entsprechend handeln.«[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: »Wenn ich die Gunst des Königs gefunden habe.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Morgen werde ich gemäß dem Wort des Königs handeln.« Die Formulierung ist elliptisch; sie bezieht sich wahrscheinlich auf die Aufforderung des Königs und kann bedeuten, dass Ester am nächsten Tag darauf eingehen und ihr Anliegen darlegen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֵי
  choice: in den Augen des Königs Gunst gefunden habe
  rationale: Bewahrt das hebräische Bild und gibt die höfische Wendung verständlich und würdevoll wieder.
- source_word: עַל הַמֶּלֶךְ טוֹב
  choice: wenn es dem König gefällt
  rationale: Natürliche deutsche Entsprechung der höflichen Formel für das, was dem König gut beziehungsweise genehm erscheint.
- source_word: לָתֵת אֶת שְׁאֵלָתִי
  choice: mir meine Bitte zu gewähren
  rationale: Im Deutschen ist „eine Bitte gewähren“ eine natürliche höfisch-formelle Wiedergabe des wörtlichen „meine Bitte geben“.
- source_word: וְלַעֲשׂוֹת אֶת בַּקָּשָׁתִי
  choice: mein Begehren zu erfüllen
  rationale: „Erfüllen“ gibt die Verbindung mit „tun“ idiomatisch wieder; „Begehren“ erhält die Variation zwischen den beiden ähnlichen hebräischen Substantiven.
- source_word: יָבֹא
  choice: dann möge ... kommen
  rationale: Der Imperfekt hat hier auffordernden, höflich einladenden Sinn; „möge“ passt zum respektvollen Hofregister.
- source_word: הַמִּשְׁתֶּה
  choice: Festmahl
  rationale: Bezeichnet ein festliches Mahl, oft mit Wein; „Festmahl“ ist im königlichen Zusammenhang natürlich, ohne den Trinkaspekt überzubetonen.
- source_word: אֲשֶׁר אֶעֱשֶׂה לָהֶם
  choice: das ich für sie bereiten werde
  rationale: Das hebräische „machen“ wird bei einem Mahl im Deutschen idiomatisch mit „bereiten“ wiedergegeben.
- source_word: וּמָחָר אֶעֱשֶׂה כִּדְבַר הַמֶּלֶךְ
  choice: Morgen werde ich dann dem Wort des Königs entsprechend handeln
  rationale: Bewahrt die leicht offene, elliptische Ausdrucksweise, statt ausdrücklich einzusetzen, Esther werde ihre Bitte nennen oder beantworten.
