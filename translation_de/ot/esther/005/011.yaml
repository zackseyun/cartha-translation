  text: וַ/יְסַפֵּ֨ר לָ/הֶ֥ם הָמָ֛ן אֶת כְּב֥וֹד עָשְׁר֖/וֹ וְ/רֹ֣ב בָּנָ֑י/ו וְ/אֵת֩ כָּל אֲשֶׁ֨ר גִּדְּל֤/וֹ הַ/מֶּ֨לֶךְ֙ וְ/אֵ֣ת אֲשֶׁ֣ר נִשְּׂא֔/וֹ עַל הַ/שָּׂרִ֖ים וְ/עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/011.yaml
  text: And Haman told them of the glory of his wealth[a], and the multitude of his sons, and all that the king had done to make him great[d][c][b], and how he had exalted him above the officials and servants of the king.
translation:
  language: de
  text: Und Haman erzählte ihnen von der Pracht seines Reichtums[a], von der großen Zahl seiner Söhne[b], von allem, was der König getan hatte, um ihn groß zu machen[c], und wie er ihn über die Amtsträger und die Diener des Königs erhoben hatte[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von der Herrlichkeit seines Reichtums«. Der hebräische Ausdruck betont die eindrucksvolle Pracht, die mit Hamans Reichtum verbunden war.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »von der Menge seiner Söhne«; gemeint ist ihre große Zahl. Im Hebräischen steht ausdrücklich »Söhne«, nicht allgemein »Kinder«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »von allem, wodurch der König ihn groß gemacht hatte« bzw. »von allem, was der König getan hatte, um ihn zu fördern«.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »über die Amtsträger und die Diener des Königs erhöht hatte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: erzählte
  rationale: Das narrative Wayyiqtol von ספר bezeichnet hier Hamans ausführlichen Bericht vor seinen Zuhörern; „erzählte“ ist natürlich und wahrt den berichtenden Sinn.
- source_word: כְּבוֹד עָשְׁרוֹ
  choice: die Pracht seines Reichtums
  rationale: כָּבוֹד kann Herrlichkeit, Ehre oder Pracht bezeichnen. In Verbindung mit Reichtum hebt es dessen eindrucksvolle Größe und Wirkung hervor.
- source_word: רֹב בָּנָיו
  choice: die große Zahl seiner Söhne
  rationale: רֹב bezeichnet Menge oder Fülle; בָּנָיו meint ausdrücklich seine Söhne. Die Formulierung ist präzise und im modernen Deutsch idiomatisch.
- source_word: גִּדְּלוֹ
  choice: ihn groß gemacht
  rationale: Der Piel von גדל bedeutet hier, jemanden groß beziehungsweise bedeutend zu machen oder zu fördern. Die Wiedergabe bewahrt das Bild und die Verursachung durch den König.
- source_word: נִשְּׂאוֹ עַל
  choice: über ... erhoben hatte
  rationale: נשא mit עַל bezeichnet in diesem Zusammenhang eine Erhöhung des Ranges über andere; „über ... erhoben“ bewahrt sowohl das Bild als auch die Hierarchie.
- source_word: הַשָּׂרִים
  choice: die führenden Männer
  rationale: שָׂרִים bezeichnet hochrangige Amtsträger, Fürsten oder Oberste. „Führende Männer“ ist im persischen Hofkontext verständlich und lässt die genaue Amtsbezeichnung offen.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: die Diener des Königs
  rationale: עֲבָדִים bezeichnet hier Angehörige des königlichen Dienstes. „Diener des Königs“ bleibt nah am Hebräischen, ohne vorschnell eine spezifische Hofstellung festzulegen.
