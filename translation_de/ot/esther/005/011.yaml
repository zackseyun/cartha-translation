revisions:
- from: Und Haman erzählte ihnen von der Pracht seines Reichtums[a], von der großen Zahl seiner Söhne[b] und von allem, wodurch der König ihn groß gemacht[c] und über die führenden Männer und die Diener des Königs erhoben hatte[d].
  to: Und Haman erzählte ihnen von der Pracht seines Reichtums[a], von der großen Zahl seiner Söhne[b], von allem, was der König getan hatte, um ihn groß zu machen[c], und wie er ihn über die Amtsträger und die Diener des Königs erhoben hatte[d].
  rationale: Die Aufzählung wird so gegliedert, dass die beiden im Hebräischen nebeneinanderstehenden Aussagen über die königliche Förderung und die Erhöhung im Rang nicht künstlich in einer einzigen Mittelangabe zusammengezogen werden. „Amtsträger“ präzisiert die höfische Funktion von שָׂרִים. Die Fußnotenanker bleiben an den jeweils erläuterten Ausdrücken erhalten.
