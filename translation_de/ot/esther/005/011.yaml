translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der hebräischen Aufzählung, wird aber durch wiederholtes „von“ und eine gemeinsame Verbkonstruktion flüssig gestaltet. „Führende Männer“ vermeidet das im Deutschen potenziell erbliche Verständnis von „Fürsten“, während die Fußnote die amtliche Alternative nennt.
