base_translation:
  language: en
  yaml_path: translation/ot/esther/005/014.yaml
  text: Then Zeresh his wife and all his friends said to him[a], “Let a gallows fifty cubits high be made, and in the morning tell the king to have Mordecai hanged on it. Then go with the king to the banquet rejoicing.” The matter pleased Haman[c][b], and he made the gallows.
translation:
  language: de
  text: 'Da sagten Seresch, seine Frau, und alle seine Freunde zu ihm: »Man soll einen fünfzig Ellen[a] hohen Holzpfahl[b] errichten. Sag am Morgen dem König, Mordechai solle daran aufgehängt werden[c]. Dann geh fröhlich mit dem König zum Festmahl.« Der Vorschlag gefiel Haman, und er machte den Holzpfahl.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Fünfzig Ellen entsprechen ungefähr 23 Metern.
    reason: cultural_note
  - marker: b
    text: Das hebräische Wort kann auch »Baum«, »Holz« oder eine hölzerne Hinrichtungsvorrichtung bezeichnen; ihre genaue Form ist ungewiss.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: »Mordechai daran pfählen«. Das hebräische Verb bedeutet »aufhängen«; im Zusammenhang mit der hölzernen Vorrichtung ist die genaue Hinrichtungsart umstritten.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֲבָיו
  choice: seine Freunde
  rationale: Wörtlich sind es »die ihn Liebenden«; im höfischen Erzählzusammenhang bezeichnet die Form Hamans vertraute Gefährten beziehungsweise Anhänger. »Seine Freunde« ist dafür natürliches modernes Deutsch.
- source_word: יַעֲשׂוּ
  choice: Man soll … errichten
  rationale: Der imperfektische Plural drückt hier einen Vorschlag aus, ohne die Ausführenden zu benennen. Die unpersönliche Form mit »man« bewahrt dies idiomatisch.
- source_word: עֵץ
  choice: Holzpfahl
  rationale: Das Wort kann Baum, Holz, Pfahl oder eine hölzerne Hinrichtungsvorrichtung bezeichnen. »Holzpfahl« vermeidet die zu genaue Vorstellung eines modernen Galgens; die verbleibende Unsicherheit wird in einer Fußnote benannt.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: fünfzig Ellen hoch
  rationale: Die antike Maßeinheit bleibt im Haupttext erhalten; eine ungefähre moderne Umrechnung steht in der Fußnote.
- source_word: אֱמֹר לַמֶּלֶךְ
  choice: Sag … dem König
  rationale: Der Imperativ bedeutet unmittelbar »sag dem König«. Die Übersetzung fügt weder »bitte« noch eine ausdrückliche königliche Genehmigung hinzu.
- source_word: וְיִתְלוּ אֶת־מָרְדֳּכַי עָלָיו
  choice: man solle Mordechai daran aufhängen
  rationale: Der Plural nennt keine bestimmten Vollstrecker. »Aufhängen« gibt die gewöhnliche Bedeutung von תלה wieder; ob eine Aufhängung, öffentliche Zurschaustellung oder Pfählung gemeint ist, bleibt historisch und lexikalisch unsicher und wird in der Fußnote offengelegt.
- source_word: מִשְׁתֶּה
  choice: Festmahl
  rationale: Das Wort bezeichnet ein Fest beziehungsweise Trinkgelage; »Festmahl« passt zum königlichen Rahmen und ist in modernem Deutsch gut verständlich.
- source_word: שָׂמֵחַ
  choice: fröhlich
  rationale: Das Adjektiv beschreibt Hamans Gemütszustand beim Gang zum Festmahl und wird im Deutschen natürlich adverbial wiedergegeben.
- source_word: וַיִּיטַב הַדָּבָר לִפְנֵי הָמָן
  choice: Der Vorschlag gefiel Haman
  rationale: Die hebräische Wendung besagt, dass die Sache in Hamans Augen gut beziehungsweise annehmbar war. »Der Vorschlag gefiel Haman« trifft den Kontext prägnant.
- source_word: וַיַּעַשׂ הָעֵץ
  choice: er ließ den Holzpfahl errichten
  rationale: Wörtlich heißt es, dass Haman ihn machte. Im Deutschen bezeichnet »ließ … errichten« natürlich seine Veranlassung, ohne anzunehmen, er habe die Konstruktion eigenhändig gebaut.
theological_decisions:
- issue: Art der Hinrichtung
  choice: Im Haupttext »aufhängen« und »Holzpfahl«, mit ausdrücklicher Fußnote zur Unsicherheit
  alternative: »pfählen« beziehungsweise »Galgen«
  rationale: Der hebräische Text legt eine hölzerne Vorrichtung und das Verb תלה nahe, bestimmt aber die konkrete persische Hinrichtungsmethode nicht zweifelsfrei. Die Übersetzung entscheidet diese historische und bildliche Spannung daher nicht stillschweigend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, erzählerisch flüssiger Syntax. Die Rede bleibt eindringlich, ohne altertümliche Formen. »Seresch« und »Mordechai« folgen geläufigen deutschen Namensformen; die antike Maßeinheit bleibt im Text erhalten.
