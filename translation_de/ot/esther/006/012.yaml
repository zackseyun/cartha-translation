id: EST.6.12
reference: Esther 6:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֥שָׁב מָרְדֳּכַ֖י אֶל שַׁ֣עַר הַ/מֶּ֑לֶךְ וְ/הָמָן֙ נִדְחַ֣ף אֶל בֵּית֔/וֹ אָבֵ֖ל וַ/חֲפ֥וּי רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/012.yaml
  text: Then Mordecai returned to the king’s gate[a], but Haman hurried to his house[b], mourning and with his head covered.
translation:
  language: de
  text: Darauf kehrte Mordechai zum Tor des Königs zurück. Haman aber wurde in sein Haus getrieben[a], voller Trauer und mit verhülltem Kopf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »eilte in sein Haus«. Das hebräische Verb steht jedoch in einer Passivform und kann ausdrücken, dass Haman dorthin getrieben oder gedrängt wurde.'
    reason: lexical_alternative
  - marker: b
    text: Das Verhüllen des Kopfes war ein sichtbares Zeichen von Trauer, Scham oder Demütigung.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte … zurück
  rationale: Die Erzählform von שׁוּב bezeichnet die Rückkehr an den vorherigen Ort beziehungsweise Posten. Die deutsche Wendung gibt Richtung und Fortgang der Erzählung natürlich wieder.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: das Tor des Königs
  rationale: Die Genitivverbindung bezeichnet das zum König beziehungsweise zum Palastbezirk gehörende Tor. Die konkrete Formulierung bleibt eng am Hebräischen.
- source_word: נִדְחַף
  choice: wurde … getrieben
  rationale: Der Nifal von דחף hat passive Kraft und beschreibt Haman als gedrängt oder getrieben. Die Formulierung wahrt diese ungewöhnliche Perspektive, ohne einen Handelnden zu ergänzen.
- source_word: בֵּיתוֹ
  choice: sein Haus
  rationale: Die wörtliche Besitzangabe passt zum knappen, würdigen Erzählstil.
- source_word: אָבֵל
  choice: voller Trauer
  rationale: Das Adjektiv bezeichnet Haman als trauernd beziehungsweise klagend. Die deutsche Formulierung beschreibt seinen Zustand natürlich, ohne den Anlass näher auszudeuten.
- source_word: חֲפוּי רֹאשׁ
  choice: mit verhülltem Kopf
  rationale: Die konkrete Körperhaltung beziehungsweise äußere Geste wird bewahrt und nicht durch eine bloße Deutung wie »gedemütigt« ersetzt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die passive und leicht mehrdeutige Aussage über Hamans Rückweg bleibt erhalten; die konkrete Trauergeste wird nicht im Haupttext ausgedeutet.
