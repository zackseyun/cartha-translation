base_translation:
  language: en
  yaml_path: translation/ot/esther/006/002.yaml
  text: And it was found written that Mordecai had reported concerning Bigthana and Teresh[a], two of the king’s eunuchs, among those who guarded the threshold[b], who had sought to lay a hand on King Ahasuerus.
translation:
  language: de
  text: Und es fand sich geschrieben, dass Mordechai über Bigtana und Teresch[a] berichtet hatte, zwei Eunuchen des Königs, die zu den Torwächtern gehörten[b] und danach getrachtet hatten, Hand an König Ahasveros zu legen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hier steht im Hebräischen die Namensform „Bigtana“; an anderen Stellen erscheint der Name als „Bigtan“.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „zwei Hofbeamte des Königs, die zu den Torwächtern gehörten“. Das hebräische Wort kann speziell Eunuchen oder allgemeiner königliche Beamte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא כָתוּב
  choice: es fand sich geschrieben
  rationale: Bewahrt die unpersönliche Passivkonstruktion und den ausdrücklichen Bezug auf den schriftlichen Eintrag; die Formulierung ist in einem würdevollen erzählerischen Register verständlich.
- source_word: הִגִּיד עַל
  choice: über … berichtet hatte
  rationale: Im Zusammenhang eines königlichen Amtsbuchs gibt „berichtet“ das Bekanntmachen einer Verschwörung treffend wieder; עַל bezeichnet hier deren Gegenstand.
- source_word: בִּגְתָנָא וָתֶרֶשׁ
  choice: Bigtana und Teresch
  rationale: „Bigtana“ folgt der Namensform dieses Verses; die abweichende Form „Bigtan“ an anderen Stellen wird in der Fußnote vermerkt.
- source_word: שְׁנֵי סָרִיסֵי הַמֶּלֶךְ
  choice: zwei Eunuchen des Königs
  rationale: סָרִיס bezeichnet häufig einen Eunuchen am Königshof, kann jedoch allgemeiner einen Hofbeamten meinen; diese Bedeutungsbreite bleibt durch eine Fußnote sichtbar.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: die zu den Hütern der Schwelle gehörten
  rationale: Gibt das partitive מִן als Zugehörigkeit zu einer Gruppe wieder und erhält mit „Schwelle“ das konkrete Bild von סַף.
- source_word: אֲשֶׁר בִּקְשׁוּ
  choice: und danach getrachtet hatten
  rationale: Drückt die feindliche Absicht des Verbs בִּקֵּשׁ im Verschwörungskontext aus, ohne zu behaupten, der Anschlag sei ausgeführt worden.
- source_word: לִשְׁלֹחַ יָד בְּ
  choice: Hand an … zu legen
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Hand-Bild und vermittelt den feindlichen Sinn, ohne die beabsichtigte Tat unnötig zu präzisieren.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasveros
  rationale: Verwendet die im Deutschen etablierte biblische Namensform für den hebräischen Namen אֲחַשְׁוֵרוֹשׁ.
