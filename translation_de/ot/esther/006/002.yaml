  to: Und es fand sich geschrieben, dass Mordechai über Bigtana und Teresch[a] berichtet hatte, zwei Eunuchen des Königs, die zu den Torwächtern gehörten[b] und danach getrachtet hatten, Hand an König Ahasveros zu legen.
