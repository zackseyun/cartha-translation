  text: וַ/יִּקַּ֤ח הָמָן֙ אֶת הַ/לְּב֣וּשׁ וְ/אֶת הַ/סּ֔וּס וַ/יַּלְבֵּ֖שׁ אֶֽת מָרְדֳּכָ֑י וַ/יַּרְכִּיבֵ֨/הוּ֙ בִּ/רְח֣וֹב הָ/עִ֔יר וַ/יִּקְרָ֣א לְ/פָנָ֔י/ו כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/011.yaml
  text: So Haman took the robe and the horse[a], clothed Mordecai, led him on horseback through the city square, and proclaimed before him, “Thus shall it be done for the man whom the king delights to honor.”
translation:
  language: de
  text: 'Da nahm Haman das Gewand und das Pferd, bekleidete Mordechai, ließ ihn auf dem Pferd über den Stadtplatz reiten und rief vor ihm aus: »So wird es dem Mann getan, den der König ehren will!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלְּבוּשׁ
  choice: das Gewand
  rationale: Der bestimmte Singular verweist auf das zuvor genannte königliche Kleidungsstück. »Gewand« ist würdig und im Deutschen natürlicher als das allgemeinere »Kleidung«.
- source_word: הַסּוּס
  choice: das Pferd
  rationale: Der hebräische Text sagt mit bestimmtem Artikel schlicht »das Pferd«; der königliche Bezug ergibt sich bereits aus dem Kontext und wird nicht zusätzlich eingetragen.
- source_word: וַיַּלְבֵּשׁ אֶת מָרְדֳּכָי
  choice: bekleidete Mordechai
  rationale: Der Hifil von לבש bezeichnet das Bekleiden einer anderen Person. »Bekleidete« wahrt die direkte, gehobene Erzählweise.
- source_word: וַיַּרְכִּיבֵהוּ
  choice: ließ ihn auf dem Pferd … reiten
  rationale: Die kausative Form von רכב bedeutet, dass Haman Mordechai reiten ließ. Die deutsche Formulierung gibt diese Kausalität natürlich wieder, ohne Hamans genaue Position im Zug festzulegen.
- source_word: בִּרְחוֹב הָעִיר
  choice: über den Stadtplatz
  rationale: רְחוֹב bezeichnet hier am ehesten einen breiten öffentlichen Platz. »Stadtplatz« vermittelt den öffentlichen Schauplatz; »über« ist bei einer Bewegung über einen Platz idiomatisch.
- source_word: וַיִּקְרָא לְפָנָיו
  choice: rief vor ihm aus
  rationale: קרא bezeichnet hier den öffentlichen Heroldsruf. »Vor ihm« bewahrt die räumliche Angabe, ohne genauer festzulegen, ob Haman unmittelbar vorausging.
- source_word: כָּכָה יֵעָשֶׂה
  choice: So wird es … getan
  rationale: Die Formulierung erhält das demonstrative כָּכָה und das passive יֵעָשֶׂה in natürlichem, würdevollem Deutsch.
- source_word: לָאִישׁ
  choice: dem Mann
  rationale: Die bestimmte, generische Einzahl wird mit »dem Mann« wiedergegeben und entspricht der wiederholten Hofformel.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: den der König ehren will
  rationale: חפץ bezeichnet Gefallen beziehungsweise Willen, יקר die zuerkannte Ehre. »Ehren will« ist prägnant und vermeidet eine unnatürliche deutsche Konstruktion wie »an dessen Ehre Gefallen hat«.
