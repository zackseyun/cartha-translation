base_translation:
  language: en
  yaml_path: translation/ot/esther/006/001.yaml
  text: On that night the king could not sleep[a], so he ordered the book of records, the chronicles, to be brought[b], and they were read before the king.
translation:
  language: de
  text: In jener Nacht floh den König der Schlaf.[a] Da befahl er, das Buch der Erinnerungen, die Chronik,[b] zu holen, und daraus wurde dem König vorgelesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Der Schlaf des Königs floh.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das Buch der Gedenkaufzeichnungen, die Jahrbücher«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: In jener Nacht
  rationale: Die Formulierung gibt die bestimmte, durch das Demonstrativpronomen hervorgehobene Nacht natürlich und präzise wieder.
- source_word: נָדְדָה שְׁנַת הַמֶּלֶךְ
  choice: floh den König der Schlaf
  rationale: Die deutsche Wendung bewahrt das hebräische Bild vom entwichenen Schlaf und ist zugleich verständlich und idiomatisch.
- source_word: וַיֹּאמֶר
  choice: Da befahl er
  rationale: Das Verb bedeutet formal „er sagte“, leitet hier aber einen Auftrag ein; „befahl“ gibt die kommunikative Funktion im königlichen Kontext wieder.
- source_word: לְהָבִיא
  choice: zu holen
  rationale: Der Infinitiv bezeichnet den Inhalt des Befehls. „Zu holen“ ist im Deutschen natürlich und lässt die ausführenden Diener wie im Hebräischen ungenannt.
- source_word: סֵפֶר הַזִּכְרֹנוֹת
  choice: das Buch der Erinnerungen
  rationale: Die Wiedergabe hält die Bedeutung von זִכְרֹנוֹת als zur Erinnerung festgehaltene Aufzeichnungen sichtbar, ohne sie vorschnell auf einen modernen Verwaltungsbegriff zu verengen.
- source_word: דִּבְרֵי הַיָּמִים
  choice: die Chronik
  rationale: Die Wendung bezeichnet annalistische Aufzeichnungen und steht hier erläuternd neben „Buch der Erinnerungen“.
- source_word: וַיִּהְיוּ נִקְרָאִים
  choice: und man las daraus vor
  rationale: Die unpersönliche deutsche Konstruktion gibt den hebräischen Passivvorgang natürlich wieder. „Daraus“ bezieht die Lesung auf das genannte Buch beziehungsweise dessen Aufzeichnungen.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: vor dem König
  rationale: Dies bewahrt die räumlich-höfische Bedeutung „in Gegenwart des Königs“ und lässt erkennen, dass ihm vorgelesen wurde.
