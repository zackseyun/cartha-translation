translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und unmittelbar; »Da steht« vermeidet das heute altertümliche »Siehe«, ohne die hinweisende Funktion von הִנֵּה abzuschwächen.
