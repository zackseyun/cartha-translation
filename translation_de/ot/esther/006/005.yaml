base_translation:
  language: en
  yaml_path: translation/ot/esther/006/005.yaml
  text: The king’s attendants said to him[a], “Look, Haman is standing in the court.” And the king said, “Let him come in.”
translation:
  language: de
  text: 'Da sagten die Bediensteten des Königs zu ihm: »Da steht Haman im Hof.« Der König sagte: »Er soll hereinkommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: die Diener des Königs
  rationale: נַעַר kann einen jungen Mann, Diener oder Hofbediensteten bezeichnen. Im königlichen Umfeld gibt »Diener« ihre Funktion natürlich wieder, ohne ein bestimmtes Alter festzulegen.
- source_word: הִנֵּה ... עֹמֵד
  choice: Da steht
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die gegenwärtige Situation, während das Partizip עֹמֵד den andauernden Zustand bezeichnet. »Da steht« verbindet beides in natürlichem, unmittelbarem Deutsch.
- source_word: בֶּחָצֵר
  choice: im Hof
  rationale: חָצֵר bezeichnet einen Hof oder Hofbereich. »Im Hof« ist im Palastkontext knapp und verständlich; die kontextuell mögliche Wiedergabe »im Vorhof« wird in der Fußnote genannt.
- source_word: יָבֹא
  choice: Er soll hereinkommen
  rationale: Die Form hat hier auffordernde beziehungsweise erlaubende Kraft. »Er soll hereinkommen« bewahrt den königlichen Weisungscharakter und macht die Bewegung in die Gegenwart des Königs deutlich.
- source_word: הָמָן
  choice: Haman
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
