base_translation:
  language: en
  yaml_path: translation/ot/esther/006/003.yaml
  text: Then the king said[a], “What honor and greatness has been bestowed on Mordecai for this?” The king’s young men who attended him said, “Nothing has been done for him.”
translation:
  language: de
  text: 'Da fragte der König: „Welche Ehre und Größe sind Mordechai dafür zuteilgeworden?[a]“ Die jungen Männer des Königs, die ihn bedienten, antworteten: „Es ist nichts für ihn getan worden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was ist Mordechai dafür an Ehre und Größe erwiesen worden?“'
    reason: Die Fußnote bietet eine alternative, stärker an der hebräischen Verbindung von „tun/erweisen“ mit „Ehre und Größe“ orientierte Formulierung.
lexical_decisions:
- source_word: מַה נַּעֲשָׂה
  choice: Welche … sind … zuteilgeworden?
  rationale: Die hebräische Passivform fragt nach dem, was für Mordechai veranlasst wurde. „Zuteilgeworden“ verbindet sich im Deutschen natürlich mit „Ehre und Größe“ und bewahrt den passiven Sinn.
- source_word: יְקָר
  choice: Ehre
  rationale: Im höfischen Zusammenhang bezeichnet das Wort die einem Menschen erwiesene öffentliche Ehrung, nicht materielle Kostbarkeit.
- source_word: וּגְדוּלָּה
  choice: Größe
  rationale: Die Wiedergabe bleibt nah an der Grundbedeutung und bewahrt die mögliche Spannung zwischen hohem Rang, Ansehen und öffentlicher Auszeichnung.
- source_word: לְמָרְדֳּכַי
  choice: Mordechai
  rationale: Der deutsche Dativ bei „zuteilwerden“ gibt den hebräischen Empfänger beziehungsweise Begünstigten natürlich wieder.
- source_word: עַל זֶה
  choice: dafür
  rationale: Das Wort verweist kausal auf Mordechais zuvor berichtete Tat zurück.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: die jungen Männer des Königs
  rationale: Die konkrete Grundbedeutung „junge Männer“ bleibt erhalten; ihre Funktion wird durch den folgenden Relativsatz erklärt.
- source_word: מְשָׁרְתָיו
  choice: die ihn bedienten
  rationale: Das Partizip bezeichnet den persönlichen Dienst beziehungsweise die Aufwartung am Königshof.
- source_word: לֹא נַעֲשָׂה עִמּוֹ דָּבָר
  choice: Es ist nichts für ihn getan worden
  rationale: Die idiomatische deutsche Form bewahrt die verneinte Passivkonstruktion und den Sinn, dass zu Mordechais Gunsten keinerlei Maßnahme erfolgt war.
