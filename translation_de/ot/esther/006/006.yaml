base_translation:
  language: en
  yaml_path: translation/ot/esther/006/006.yaml
  text: So Haman came in[a], and the king said to him, “What should be done for the man whom the king delights to honor?” And Haman said in his heart, “Whom would the king delight to honor more than me?”
translation:
  language: de
  text: 'Da kam Haman herein, und der König fragte ihn: »Was soll für den Mann getan werden, den der König ehren will?« Haman dachte bei sich[a]: »Wen sollte der König wohl mehr ehren als mich?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Haman sagte in seinem Herzen.«'
    reason: Die Fußnote dokumentiert das konkrete hebräische Bild hinter der idiomatischen Wiedergabe innerer Rede.
lexical_decisions:
- source_word: וַיָּבוֹא הָמָן
  choice: Da kam Haman herein
  rationale: Das Wayyiqtol führt die Erzählung fort; »da« knüpft an die unmittelbar vorausgehende Szene an, und »hereinkommen« bezeichnet natürlich Hamans Eintritt beim König.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: und der König fragte ihn
  rationale: אָמַר bedeutet wörtlich »sagen«; da die direkte Rede eine Frage ist, gibt »fragte« die kommunikative Funktion im modernen Deutschen natürlicher wieder.
- source_word: מַה לַעֲשׂוֹת בָּאִישׁ
  choice: Was soll für den Mann getan werden
  rationale: Die Infinitivkonstruktion bezeichnet hier das angemessene Vorgehen. Das Passiv und die Wiedergabe von ב mit »für« ergeben idiomatisches Deutsch.
- source_word: אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  choice: den der König ehren möchte
  rationale: Im höfischen Zusammenhang bezeichnet חָפֵץ den Wunsch bzw. das Gefallen des Königs und יְקָר die erwiesene Ehre. Die Formulierung ist natürlich, ohne einen stärkeren emotionalen Sinn zu erzwingen.
- source_word: וַיֹּאמֶר הָמָן בְּלִבּוֹ
  choice: Haman dachte bei sich
  rationale: Wörtlich heißt es »Haman sagte in seinem Herzen«. Die deutsche Wendung »dachte bei sich« gibt innere Rede idiomatisch wieder; die Fußnote bewahrt das hebräische Bild.
- source_word: לְמִי יַחְפֹּץ הַמֶּלֶךְ לַעֲשׂוֹת יְקָר
  choice: Wen sollte der König wohl lieber ehren
  rationale: לַעֲשׂוֹת יְקָר bedeutet »Ehre erweisen«. »Wohl« markiert Hamans rhetorische Selbstüberlegung, während »lieber« zusammen mit dem folgenden Vergleich den komparativen Gedanken natürlich ausdrückt.
- source_word: יוֹתֵר מִמֶּנִּי
  choice: als mich
  rationale: Der Vergleich bringt Hamans selbstbezogene Schlussfolgerung knapp und in standardsprachlichem Deutsch zum Ausdruck.
