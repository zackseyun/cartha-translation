base_translation:
  language: en
  yaml_path: translation/ot/esther/006/013.yaml
  text: Then Haman told Zeresh his wife and all his friends everything that had happened to him. Then his wise men and Zeresh his wife said to him[a], “If Mordecai, before whom you have begun to fall, is from the seed of the Jews, you will not prevail against him, for you will surely fall before him.”
translation:
  language: de
  text: 'Da erzählte Haman seiner Frau Seresch und allen seinen Freunden alles, was ihm widerfahren war. Seine Weisen und seine Frau Seresch sagten zu ihm: »Wenn Mordechai, vor dem du zu fallen begonnen hast, aus dem Geschlecht der Juden stammt[a], wirst du nichts gegen ihn ausrichten können; denn du wirst ganz gewiss vor ihm fallen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jüdischer Abstammung ist“.'
    reason: Lexikalische Alternative für die Herkunftsangabe mit זֶרַע („Same; Nachkommenschaft“).
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: erzählte
  rationale: Das narrative Verb bezeichnet das ausführliche Berichten eines Geschehens; „erzählte“ ist im Deutschen natürlich und bewahrt diesen Sinn.
- source_word: אֹהֲבָיו
  choice: seinen Freunden
  rationale: Wörtlich sind es die ihn Liebenden; im gesellschaftlichen Zusammenhang sind damit Freunde beziehungsweise enge Vertraute gemeint.
- source_word: כָּל אֲשֶׁר קָרָהוּ
  choice: alles, was ihm widerfahren war
  rationale: Die Wendung bezeichnet alles, was Haman zugestoßen ist. Das Plusquamperfekt ordnet den Bericht passend in die Erzählfolge ein.
- source_word: חֲכָמָיו
  choice: seine Weisen
  rationale: Die wörtliche Bezeichnung bleibt erhalten und passt zu kundigen Ratgebern im persischen Hofmilieu.
- source_word: אִם מִזֶּרַע הַיְּהוּדִים
  choice: wenn … von der Nachkommenschaft der Juden stammt
  rationale: זֶרַע bedeutet wörtlich „Same“, bezeichnet hier aber die Abstammung. „Nachkommenschaft“ bewahrt das Herkunftsmotiv in verständlichem Deutsch.
- source_word: הַחִלּוֹתָ לִנְפֹּל לְפָנָיו
  choice: vor dem du zu fallen begonnen hast
  rationale: Die Konstruktion mit החל bezeichnet den Beginn von Hamans Niederlage. „Fallen“ wird beibehalten, damit die bewusste Wiederholung im folgenden Satzteil hörbar bleibt.
- source_word: לֹא תוּכַל לוֹ
  choice: wirst du nichts gegen ihn ausrichten können
  rationale: יכל mit ל bezeichnet hier die fehlende Fähigkeit, sich gegen Mordechai durchzusetzen; die deutsche Wendung gibt den gegnerischen Bezug idiomatisch wieder.
- source_word: נָפוֹל תִּפּוֹל
  choice: du wirst ganz gewiss … fallen
  rationale: Der vorangestellte Infinitivus absolutus verstärkt die finite Verbform und betont die Gewissheit des Falls.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Die Formulierung bezeichnet Niederlage und Unterordnung gegenüber Mordechai und bewahrt zugleich die Wiederholung des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Verwendung von „fallen“ bildet die rhetorische Wiederholung des hebräischen Textes ab; die Satzstellung bewahrt zugleich die konditionale Spannung.
