revisions:
- from: 'Da erzählte Haman seiner Frau Seresch und allen seinen Freunden alles, was ihm widerfahren war. Seine Weisen und seine Frau Seresch sagten zu ihm: »Wenn Mordechai, vor dem du zu fallen begonnen hast, von der Nachkommenschaft der Juden stammt[a], wirst du nichts gegen ihn ausrichten können; denn du wirst ganz gewiss vor ihm fallen.«'
  to: 'Da erzählte Haman seiner Frau Seresch und allen seinen Freunden alles, was ihm widerfahren war. Seine Weisen und seine Frau Seresch sagten zu ihm: »Wenn Mordechai, vor dem du zu fallen begonnen hast, aus dem Geschlecht der Juden stammt[a], wirst du nichts gegen ihn ausrichten können; denn du wirst ganz gewiss vor ihm fallen.«'
  rationale: Nur die deutsche Wiedergabe der Abstammungsformel wurde idiomatischer gefasst. Die konditionale Offenheit des hebräischen אִם, die rhetorische Wiederholung von „fallen“ und die Verstärkung von נָפוֹל תִּפּוֹל bleiben erhalten.
