revisions:
- from: 'Das Gewand und das Pferd soll man einem der vornehmen Fürsten des Königs anvertrauen. Dieser soll den Mann, den der König ehren möchte, mit dem Gewand bekleiden und ihn auf dem Pferd über den Platz der Stadt führen. Vor ihm soll er ausrufen: »So wird es dem Mann ergehen, den der König ehren möchte!«'
  to: 'Das Gewand und das Pferd sollen einem der hochrangigen Würdenträger des Königs übergeben werden. Dann soll man den Mann, dem der König Ehre erweisen will, mit dem Gewand bekleiden, ihn auf dem Pferd durch den Stadtplatz führen und vor ihm ausrufen: »So soll man mit dem Mann verfahren, dem der König Ehre erweisen will!«'
  rationale: Die Revision bewahrt die offene Pluralität der Ausführenden, präzisiert die königliche Ehrabsicht und vermeidet eine zu spezifische Deutung des persischen Hofrangs. Sie lässt die Bedeutung und den feierlich-öffentlichen Registercharakter unverändert.
