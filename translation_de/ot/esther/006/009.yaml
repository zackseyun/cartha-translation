  text: וְ/נָת֨וֹן הַ/לְּב֜וּשׁ וְ/הַ/סּ֗וּס עַל יַד אִ֞ישׁ מִ/שָּׂרֵ֤י הַ/מֶּ֨לֶךְ֙ הַֽ/פַּרְתְּמִ֔ים וְ/הִלְבִּ֨ישׁוּ֙ אֶת הָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֣ץ בִּֽ/יקָר֑/וֹ וְ/הִרְכִּיבֻ֤/הוּ עַל הַ/סּוּס֙ בִּ/רְח֣וֹב הָ/עִ֔יר וְ/קָרְא֣וּ לְ/פָנָ֔י/ו כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/009.yaml
  text: And let the robe and the horse be entrusted to the hand of one of the king’s noble officials, and let them clothe the man whom the king delights to honor, and let them mount him on the horse through the open square of the city, and proclaim before him, ‘Thus shall it be done for the man whom the king delights to honor.’
translation:
  language: de
  text: 'Das Gewand und das Pferd sollen einem der hochrangigen Würdenträger des Königs übergeben werden. Dann soll man den Mann, dem der König Ehre erweisen will, mit dem Gewand bekleiden, ihn auf dem Pferd durch den Stadtplatz führen und vor ihm ausrufen: »So soll man mit dem Mann verfahren, dem der König Ehre erweisen will!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפַּרְתְּמִים
  choice: vornehmen Fürsten
  rationale: Das persische Lehnwort bezeichnet hochrangige Adlige beziehungsweise Würdenträger. »Vornehme Fürsten« gibt Rang und Hofstellung natürlich wieder, ohne den unklaren Amtstitel zu eng festzulegen.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: ehren möchte
  rationale: Die Wendung bedeutet wörtlich, dass der König an der Ehre des Mannes Gefallen hat; im Kontext ist gemeint, dass er ihn ehren will. Die deutsche Formulierung bewahrt die königliche Absicht ohne unnötige Umschreibung.
- source_word: בִּרְחוֹב הָעִיר
  choice: über den Platz der Stadt
  rationale: רְחוֹב bezeichnet hier einen breiten öffentlichen Platz oder offenen Straßenraum, nicht bloß eine beliebige Straße.
- source_word: וְהִרְכִּיבֻהוּ עַל הַסּוּס
  choice: ihn auf dem Pferd … führen
  rationale: Die Hifil-Form bedeutet, jemanden aufsteigen beziehungsweise reiten zu lassen. In Verbindung mit dem Zug durch den Stadtplatz ist »auf dem Pferd führen« idiomatisch und lässt erkennen, dass der Geehrte reitet.
- source_word: וְקָרְאוּ לְפָנָיו
  choice: Vor ihm soll er ausrufen
  rationale: לְפָנָיו bezeichnet die Position vor dem Geehrten im Festzug. Das Verb meint eine öffentliche Proklamation.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die im Hebräischen unpersönlich beziehungsweise pluralisch formulierten Handlungen werden im Deutschen auf den zuvor genannten Würdenträger bezogen, da dies syntaktisch natürlich ist und dem Handlungsablauf entspricht. Die direkte Rede bleibt feierlich und öffentlich-proklamatorisch.
