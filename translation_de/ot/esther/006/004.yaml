base_translation:
  language: en
  yaml_path: translation/ot/esther/006/004.yaml
  text: And the king said[a], “Who is in the court?” Now Haman had come into the outer court of the king’s palace to speak to the king about hanging Mordecai on the gallows that he had prepared for him.
translation:
  language: de
  text: 'Da fragte der König: »Wer ist im Hof?« Haman aber war in den äußeren Hof des Königspalastes gekommen, um mit dem König darüber zu sprechen, Mordechai an dem Pfahl[a] aufzuhängen, den er für ihn vorbereitet hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort עֵץ bedeutet wörtlich »Baum« oder »Holz«. Hier bezeichnet es die für die Hinrichtung vorbereitete hölzerne Vorrichtung; ihre genaue Bauart wird nicht genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da fragte
  rationale: Das häufige hebräische Erzählverb bedeutet wörtlich »und er sagte«; da die direkte Rede eine Frage ist, gibt »fragte« die Sprechhandlung im Deutschen natürlich wieder. »Da« führt die Erzählung knapp fort.
- source_word: בֶחָצֵר / לַחֲצַר
  choice: im Hof / in den ... Hof
  rationale: חָצֵר bezeichnet hier den umschlossenen Palasthof. »Hof« ist im Deutschen klar und ermöglicht die konsequente Wiederholung des Substantivs.
- source_word: וְהָמָן בָּא
  choice: Haman aber war gerade ... gekommen
  rationale: Die Klausel liefert den Hintergrund zur Frage des Königs. Das Plusquamperfekt verdeutlicht idiomatisch, dass Haman bereits eingetroffen war; »aber« markiert den erzählerischen Wechsel, und »gerade« hebt das Zusammentreffen hervor, ohne eine längere Zeitspanne zu behaupten.
- source_word: בֵּית הַמֶּלֶךְ
  choice: Königspalast
  rationale: Wörtlich »Haus des Königs«; im höfischen Zusammenhang ist »Königspalast« die natürliche und eindeutige deutsche Entsprechung.
- source_word: הַחִיצוֹנָה
  choice: äußeren
  rationale: Das Adjektiv unterscheidet diesen Hof von einem inneren Palasthof.
- source_word: לֵאמֹר לַמֶּלֶךְ
  choice: um mit dem König darüber zu sprechen
  rationale: Der Infinitiv bezeichnet hier den Zweck von Hamans Kommen. Die Formulierung ist idiomatisch und lässt den Inhalt des beabsichtigten Anliegens folgen.
- source_word: לִתְלוֹת
  choice: aufzuhängen
  rationale: תלה bezeichnet das Hängen beziehungsweise Aufhängen an einem Holz. Die Wiedergabe bleibt bei der im Text bezeichneten Handlung, ohne die genaue Hinrichtungsweise weiter festzulegen.
- source_word: הָעֵץ
  choice: Pfahl
  rationale: עֵץ bedeutet grundsätzlich »Baum« oder »Holz« und bezeichnet hier die vorbereitete Hinrichtungsvorrichtung. »Pfahl« ist anschaulich, vermeidet aber die zu spezielle Vorstellung eines neuzeitlichen Galgens; die begriffliche Breite wird in der Fußnote offengelegt.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: den er für ihn hatte herrichten lassen
  rationale: Das Relativpronomen bezieht sich auf den Pfahl, und לוֹ im Kontext auf Mordechai. Das Plusquamperfekt gibt die vorherige Vorbereitung wieder; »herrichten lassen« klingt für eine eigens angefertigte Vorrichtung natürlich und entspricht dem vorangehenden Erzählzusammenhang.
