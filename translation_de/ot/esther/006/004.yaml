translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die direkte Rede bleibt knapp. Die konkrete Wiedergabe »Pfahl« wird durch eine Fußnote gegen eine übermäßig genaue Rekonstruktion der Hinrichtungsvorrichtung abgesichert.
