base_translation:
  language: en
  yaml_path: translation/ot/esther/006/007.yaml
  text: And Haman said to the king[a], “For the man whom the king delights to honor—”
translation:
  language: de
  text: 'Da sagte Haman zum König: »Für den Mann, den der König gern ehren will –«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das waw-consecutivum führt die Erzählung weiter; »Da sagte« klingt in modernem deutschem Erzählstil natürlich.
- source_word: הָמָן
  choice: Haman
  rationale: Der Personenname wird in der im Deutschen etablierten Form wiedergegeben.
- source_word: אֶל הַמֶּלֶךְ
  choice: zum König
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; »zum König« ist die natürliche deutsche Fügung.
- source_word: אִישׁ אֲשֶׁר
  choice: den Mann, den
  rationale: אִישׁ ist maskulin Singular. Im Zusammenhang ist der noch ungenannte, aber konkret vorgestellte Empfänger der Ehrung gemeint; daher ist der bestimmte Ausdruck im Deutschen natürlich.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Titel wird auch beim zweiten Vorkommen ausdrücklich wiedergegeben und bewahrt Hamans indirekte, höfische Redeweise.
- source_word: חָפֵץ
  choice: gern … möchte
  rationale: חָפֵץ bezeichnet Wohlgefallen beziehungsweise den Wunsch, etwas zu tun. Die idiomatische Verbindung »gern ehren möchte« bewahrt sowohl Freude als auch Absicht.
- source_word: בִּיקָרוֹ
  choice: ehren
  rationale: יְקָר bezeichnet Ehre, Ansehen oder Auszeichnung; die hebräische Nominalfügung wird im Deutschen natürlich verbal wiedergegeben.
