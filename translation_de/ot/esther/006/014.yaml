  text: עוֹדָ/ם֙ מְדַבְּרִ֣ים עִמּ֔/וֹ וְ/סָרִיסֵ֥י הַ/מֶּ֖לֶךְ הִגִּ֑יעוּ וַ/יַּבְהִ֨לוּ֙ לְ/הָבִ֣יא אֶת הָמָ֔ן אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשְׂתָ֥ה אֶסְתֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/014.yaml
  text: While they were still speaking with him[b][a], the king’s eunuchs arrived and hurried to bring Haman to the banquet that Esther had prepared.
translation:
  language: de
  text: Noch während sie mit ihm redeten, kamen die Eunuchen des Königs und holten Haman eilig zu dem Festmahl, das Ester vorbereitet hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Hofbeamten des Königs“. Das hebräische Wort kann sowohl Eunuchen als auch andere höfische Amtsträger bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדָם מְדַבְּרִים עִמּוֹ
  choice: Noch während sie mit ihm redeten
  rationale: Die Verbindung von עוֹדָם mit dem Partizip bezeichnet eine noch andauernde Handlung. „Mit ihm redeten“ gibt עִמּוֹ natürlich und quellenah wieder.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: die Eunuchen des Königs
  rationale: סָרִיס kann allgemein einen Hofbeamten bezeichnen, bedeutet jedoch häufig „Eunuch“. Die konkrete Wiedergabe bleibt transparent; die weitere Bedeutung wird in der Fußnote genannt.
- source_word: הִגִּיעוּ
  choice: kamen
  rationale: Das Verb bezeichnet das Eintreffen am Ort. „Kamen“ fügt sich hier flüssig in die deutsche Erzählung ein.
- source_word: וַיַּבְהִלוּ לְהָבִיא
  choice: holten … eilig
  rationale: Der Hifil von בהל hebt hier in Verbindung mit לְהָבִיא die Dringlichkeit und Schnelligkeit hervor. Die deutsche Formulierung gibt sowohl das Herbeibringen als auch die Eile idiomatisch wieder.
- source_word: הַמִּשְׁתֶּה
  choice: das Festmahl
  rationale: מִשְׁתֶּה bezeichnet ein Fest oder Bankett, häufig mit Wein. „Festmahl“ ist im höfischen Zusammenhang natürlich und würdevoll.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: das Ester vorbereitet hatte
  rationale: עָשְׂתָה bedeutet wörtlich „gemacht hatte“; bei einem Festmahl ist „vorbereitet hatte“ im Deutschen idiomatisch und bewahrt die zeitliche Vorordnung.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die Satzfolge bleibt nah am Hebräischen, während „holten Haman eilig“ die im Deutschen unnatürliche wörtliche Konstruktion idiomatisch wiedergibt.
