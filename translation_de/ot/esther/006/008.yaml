base_translation:
  language: en
  yaml_path: translation/ot/esther/006/008.yaml
  text: Let them bring a royal robe that the king has worn[a], and a horse on which the king has ridden, and on whose head a royal crown has been placed.
translation:
  language: de
  text: Man soll ein königliches Gewand bringen, das der König getragen hat, und ein Pferd, auf dem der König geritten ist und auf dessen Kopf eine Königskrone gesetzt worden ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und auf dessen Kopf eine Königskrone gesetzt worden ist«. Das Pronomen bezieht sich am natürlichsten auf das Pferd; manche verstehen es jedoch als Bezug auf den König.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָבִיאוּ
  choice: Man soll ... bringen
  rationale: Das Hifil-Imperfekt in Hamans direkter Rede hat hier auffordernden Charakter. Die unpersönliche Form gibt diesen Sinn im modernen Deutschen natürlich wieder.
- source_word: לְבוּשׁ מַלְכוּת
  choice: ein königliches Gewand
  rationale: Die Status-constructus-Verbindung bezeichnet ein zur Königswürde gehörendes Kleidungsstück; »Gewand« ist würdig und zugleich verständlich.
- source_word: אֲשֶׁר לָבַשׁ בּוֹ הַמֶּלֶךְ
  choice: das der König getragen hat
  rationale: Die Relativkonstruktion bezeichnet ein Gewand, das der König selbst getragen hat. Das hebräische בּוֹ muss im Deutschen nicht eigens wiedergegeben werden.
- source_word: וְסוּס אֲשֶׁר רָכַב עָלָיו הַמֶּלֶךְ
  choice: und ein Pferd, auf dem der König geritten ist
  rationale: Die Formulierung wahrt die Präposition עַל und kennzeichnet das Pferd als eines, das der König persönlich benutzt hat.
- source_word: כֶּתֶר מַלְכוּת
  choice: eine Königskrone
  rationale: Die Verbindung bezeichnet eine Krone königlichen Ranges. »Königskrone« ist knapp, idiomatisch und bewahrt die fehlende Determination durch den unbestimmten Artikel.
- source_word: בְּרֹאשׁוֹ
  choice: auf dessen Kopf
  rationale: Das maskuline Suffix bezieht sich syntaktisch am nächsten und am natürlichsten auf das ebenfalls maskuline »Pferd«. Die Fußnote hält die mögliche Beziehung auf den König offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufforderung wird unpersönlich formuliert; die ungewöhnliche Krone auf dem Kopf des Pferdes bleibt entsprechend dem wahrscheinlichsten syntaktischen Bezug des Hebräischen im Haupttext erhalten.
