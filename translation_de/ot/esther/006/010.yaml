base_translation:
  language: en
  yaml_path: translation/ot/esther/006/010.yaml
  text: Then the king said to Haman[a], “Hurry, take the robe and the horse, just as you have said, and do so for Mordecai the Jew, who sits at the king’s gate[b]. Leave out nothing from all that you have said.”
translation:
  language: de
  text: 'Da sagte der König zu Haman: „Beeil dich! Nimm das Gewand und das Pferd, genau wie du gesagt hast, und tu ebenso für Mordechai, den Juden[a], der am Tor des Königs sitzt. Lass nichts von dem aus, was du gesagt hast[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Jude“ kann auch mit „der Judäer“ wiedergegeben werden; hier bezeichnet der Ausdruck wahrscheinlich Mordechais ethnisch-religiöse Identität innerhalb der Erzählung.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Lass nichts von allem, was du gesagt hast, fallen“ – eine Redewendung mit der Bedeutung, nichts auszulassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: Beeil dich!
  rationale: Der Imperativ verlangt sofortiges Handeln. Die Formulierung ist gegenwärtig, natürlich und bewahrt die Dringlichkeit.
- source_word: קַח
  choice: Nimm
  rationale: Direkte Wiedergabe des Imperativs von לקח; im Zusammenhang sind Gewand und Pferd in Empfang zu nehmen beziehungsweise zu holen.
- source_word: הַלְּבוּשׁ
  choice: das Gewand
  rationale: Der bestimmte Ausdruck verweist auf das zuvor beschriebene königliche Kleidungsstück. „Gewand“ ist würdig und hinreichend spezifisch, ohne einen nicht ausdrücklich genannten Zusatz einzuführen.
- source_word: הַסּוּס
  choice: das Pferd
  rationale: Der hebräische Text nennt schlicht „das Pferd“. Dass es das königliche Pferd ist, ergibt sich aus dem Kontext und wird hier nicht zusätzlich expliziert.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: genau wie du gesagt hast
  rationale: Die Formulierung bindet den Befehl pointiert an Hamans eigenen Vorschlag zurück und gibt den Vergleich natürlich wieder.
- source_word: וַעֲשֵׂה כֵן
  choice: und tu ebenso
  rationale: Knappe, idiomatische Wiedergabe des Imperativs mit כֵן; sie verweist auf die zuvor beschriebene Ehrung.
- source_word: לְמָרְדֳּכַי
  choice: für Mordechai
  rationale: 'Das לְ ist hier benefaktiv: Die Handlung soll zugunsten Mordechais ausgeführt werden.'
- source_word: הַיְּהוּדִי
  choice: den Juden
  rationale: Im Esterbuch bezeichnet יְהוּדִי gewöhnlich Mordechais jüdische ethnisch-religiöse Identität; „Judäer“ bleibt als mögliche stärker geografische Wiedergabe in der Fußnote sichtbar.
- source_word: הַיּוֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ
  choice: der am Tor des Königs sitzt
  rationale: Das Partizip beschreibt Mordechai anhand seines bekannten Aufenthalts- oder Amtsortes. Die wörtlich nahe Formulierung ist auch im Deutschen verständlich.
- source_word: אַל תַּפֵּל דָּבָר מִכֹּל אֲשֶׁר דִּבַּרְתָּ
  choice: Lass nichts von allem aus, was du gesagt hast
  rationale: Das Bild des „Fallenlassens“ ist ein Idiom für das Auslassen. Die gewählte Formulierung vermittelt den Sinn klar und bewahrt die umfassende Forderung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und befehlend; weder „königlich“ beim Pferd noch eine amtliche Funktion Mordechais am Tor wird über den hebräischen Wortlaut hinaus ergänzt.
