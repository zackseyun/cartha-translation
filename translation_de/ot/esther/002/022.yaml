  source_fidelity: 'Der Text gibt die hebräische Abfolge und die wesentlichen Bezüge treffend wieder: Die Sache wird Mordechai bekannt, er informiert Königin Ester, und Ester meldet sie dem König unter Mordechais Namen. Die unbestimmte Formulierung „die Sache“ bewahrt die Weite von הַדָּבָר, ohne die zuvor genannte Verschwörung ausdrücklich in den Vers einzutragen.'
  naturalness: „Als die Sache Mordechai bekannt wurde“ ist modernes, verständliches Standarddeutsch und erhält sinnvoll die passive bzw. unbestimmte Informationsvermittlung des Nifal. „Berichtete ... davon“ und „teilte es dem König ... mit“ sind idiomatisch und narrativ klar.
  terminology: „Königin Ester“ ist eine natürliche Wiedergabe der hebräischen Apposition. Die Namensformen „Mordechai“ und „Ester“ sind im Deutschen gebräuchlich. „Im Namen Mordechais“ entspricht בְּשֵׁם מָרְדֳּכָי und lässt die konkrete Art der Zuschreibung angemessen offen; die Fußnote erläutert die naheliegende Funktion als Quellenangabe.
