  text: וַ/יִּוָּדַ֤ע הַ/דָּבָר֙ לְ/מָרְדֳּכַ֔י וַ/יַּגֵּ֖ד לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֑ה וַ/תֹּ֧אמֶר אֶסְתֵּ֛ר לַ/מֶּ֖לֶךְ בְּ/שֵׁ֥ם מָרְדֳּכָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/022.yaml
  text: When the matter became known to Mordecai[a], he told Queen Esther[c][b], and Esther told the king in Mordecai's name.
translation:
  language: de
  text: Als die Sache Mordechai bekannt wurde[a], berichtete er Königin Ester davon, und Ester teilte es dem König im Namen Mordechais mit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als Mordechai von der Sache erfuhr.“ Die hebräische Passivform lässt offen, wie ihm die Sache bekannt wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Ester gab Mordechai als Quelle der Meldung an.'
    reason: clarification
lexical_decisions:
- source_word: וַיִּוָּדַע
  choice: bekannt wurde
  rationale: Das Nifal von ידע beschreibt hier, dass die Sache zu Mordechais Kenntnis gelangte, ohne den Übermittler zu nennen.
- source_word: הַדָּבָר
  choice: die Sache
  rationale: דבר bezeichnet im Zusammenhang die zuvor erwähnte Verschwörung; „die Sache“ bleibt nah am unspezifischen hebräischen Ausdruck.
- source_word: וַיַּגֵּד
  choice: berichtete ... davon
  rationale: Das Hifil von נגד bedeutet mitteilen oder berichten. Die Formulierung ist im Deutschen natürlich und nimmt den Bezug auf „die Sache“ klar auf.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: Königin Ester
  rationale: Die deutsche Titelform gibt die hebräische Apposition „Ester, die Königin“ idiomatisch wieder.
- source_word: וַתֹּאמֶר ... לַמֶּלֶךְ
  choice: teilte es dem König ... mit
  rationale: אמר bezeichnet hier die Weitergabe der Nachricht. „Mitteilte“ vermeidet das im Deutschen unvollständige „sagte dem König“ und bewahrt den Erzählfluss.
- source_word: בְּשֵׁם מָרְדֳּכָי
  choice: im Namen Mordechais
  rationale: Die Wendung entspricht der Form des Hebräischen und zeigt, dass Ester Mordechai als Quelle beziehungsweise Urheber der Meldung nannte.
