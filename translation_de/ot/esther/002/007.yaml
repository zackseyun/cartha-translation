  text: וַ/יְהִ֨י אֹמֵ֜ן אֶת הֲדַסָּ֗ה הִ֤יא אֶסְתֵּר֙ בַּת דֹּד֔/וֹ כִּ֛י אֵ֥ין לָ֖/הּ אָ֣ב וָ/אֵ֑ם וְ/הַ/נַּעֲרָ֤ה יְפַת תֹּ֨אַר֙ וְ/טוֹבַ֣ת מַרְאֶ֔ה וּ/בְ/מ֤וֹת אָבִ֨י/הָ֙ וְ/אִמָּ֔/הּ לְקָחָ֧/הּ מָרְדֳּכַ֛י ל֖/וֹ לְ/בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/007.yaml
  text: He was bringing up Hadassah—that is[a], Esther—the daughter of his uncle, because she had neither father nor mother. The young woman was beautiful in form and attractive in appearance, and when her father and her mother died[b], Mordecai took her as his own daughter.
translation:
  language: de
  text: Er zog Hadassa – das ist Ester – groß. Sie war die Tochter seines Onkels[a], denn sie hatte weder Vater noch Mutter. Die junge Frau hatte eine schöne Gestalt und sah anziehend aus. Als ihr Vater und ihre Mutter gestorben waren, nahm Mordechai sie als seine eigene Tochter an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Sie war seine Cousine.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Mordechai nahm sie sich zur Tochter.“ Gemeint sein kann, dass er sie als Tochter annahm; ein förmliches rechtliches Adoptionsverfahren wird im Hebräischen nicht ausdrücklich bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמֵן
  choice: zog … groß
  rationale: Das Partizip beschreibt Mordechais fortdauernde Fürsorge und Erziehung. „großziehen“ ist im modernen Deutschen natürlich und bleibt näher am Vorgang als das stärker rechtlich deutbare „Vormund sein“.
- source_word: הֲדַסָּה הִיא אֶסְתֵּר
  choice: Hadassa – das ist Ester –
  rationale: Das Pronomen identifiziert Hadassa und Ester als dieselbe Person. Die eingeschobene Erläuterung bewahrt beide Namen in natürlicher deutscher Form.
- source_word: בַּת דֹּדוֹ
  choice: die Tochter seines Onkels
  rationale: Die konkrete hebräische Verwandtschaftsbezeichnung wird bewahrt; daraus ergibt sich, dass sie seine Cousine war.
- source_word: כִּי אֵין לָהּ אָב וָאֵם
  choice: denn sie hatte weder Vater noch Mutter
  rationale: Die ausdrückliche Aussage des Hebräischen bleibt erhalten; „Waise“ wäre knapper, aber weniger konkret.
- source_word: הַנַּעֲרָה
  choice: die junge Frau
  rationale: Die Bezeichnung passt zum Kontext und ist moderner sowie würdevoller als „Mädchen“, ohne den altertümlichen Klang von „Jungfrau“.
- source_word: יְפַת תֹּאַר
  choice: hatte eine schöne Gestalt
  rationale: Die Wendung bezeichnet körperliche Schönheit mit Blick auf Gestalt beziehungsweise Figur und wird verständlich, aber relativ formnah wiedergegeben.
- source_word: טוֹבַת מַרְאֶה
  choice: sah anziehend aus
  rationale: Die zweite Schönheitsbeschreibung betrifft die sichtbare Erscheinung. Diese Wiedergabe unterscheidet sie von „schöne Gestalt“, ohne die Parallelität einzuebnen.
- source_word: וּבְמוֹת אָבִיהָ וְאִמָּהּ
  choice: Als ihr Vater und ihre Mutter gestorben waren
  rationale: Die Konstruktion gibt den zeitlichen Umstand an. Das Plusquamperfekt stellt im Deutschen klar, dass der Tod der Eltern Mordechais Aufnahme Esters vorausging.
- source_word: לְקָחָהּ מָרְדֳּכַי לוֹ לְבַת
  choice: nahm Mordechai sie als seine eigene Tochter an
  rationale: Die Formulierung gibt das wörtliche „nahm sie sich zur Tochter“ natürlich wieder. Sie vermittelt die Annahme als Tochter, ohne zwingend ein formalrechtliches Adoptionsverfahren vorauszusetzen.
