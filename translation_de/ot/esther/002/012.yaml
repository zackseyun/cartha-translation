  text: וּ/בְ/הַגִּ֡יעַ תֹּר֩ נַעֲרָ֨ה וְ/נַעֲרָ֜ה לָ/ב֣וֹא אֶל הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֗וֹשׁ מִ/קֵּץ֩ הֱי֨וֹת לָ֜/הּ כְּ/דָ֤ת הַ/נָּשִׁים֙ שְׁנֵ֣ים עָשָׂ֣ר חֹ֔דֶשׁ כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י מְרוּקֵי/הֶ֑ן שִׁשָּׁ֤ה חֳדָשִׁים֙ בְּ/שֶׁ֣מֶן הַ/מֹּ֔ר וְ/שִׁשָּׁ֤ה חֳדָשִׁים֙ בַּ/בְּשָׂמִ֔ים וּ/בְ/תַמְרוּקֵ֖י הַ/נָּשִֽׁים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/012.yaml
  text: 'When the turn of each young woman came to go in to King Ahasuerus, after she had been under the regulation for the women for twelve months—for in this way the days of their beauty treatments were completed: six months with oil of myrrh, and six months with spices and with the cosmetics for women—'
translation:
  language: de
  text: 'Wenn eine junge Frau an der Reihe war, zu König Ahasveros zu gehen, nachdem sie zwölf Monate lang gemäß der Vorschrift für die Frauen behandelt worden war – denn so wurde die Zeit ihrer Schönheitspflege vollendet: sechs Monate mit Myrrhenöl und sechs Monate mit Duftstoffen und Pflegemitteln für Frauen –,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹּר נַעֲרָה וְנַעֲרָה
  choice: wenn eine junge Frau an der Reihe war
  rationale: Gibt die distributive Wendung idiomatisch wieder, ohne ein zusätzliches »jede« zu erzwingen.
- source_word: כְּדָת הַנָּשִׁים
  choice: der für die Frauen geltenden Behandlung
  rationale: דָּת bezeichnet hier eine festgelegte Vorschrift beziehungsweise Ordnung; im Kontext ist damit das vorgeschriebene Behandlungsprogramm gemeint.
- source_word: יְמֵי מְרוּקֵיהֶן
  choice: ihre Schönheitspflege
  rationale: מְרוּקִים meint kosmetische Reinigung beziehungsweise Pflege; »Schönheitspflege« ist natürlich und kontextgerecht.
- source_word: שֶׁמֶן הַמֹּר
  choice: Myrrhenöl
  rationale: Direkte und geläufige Wiedergabe des Öls aus beziehungsweise mit Myrrhe.
- source_word: בַּבְּשָׂמִים וּבְתַמְרוּקֵי הַנָּשִׁים
  choice: mit Duftstoffen und anderen Pflegemitteln für Frauen
  rationale: Unterscheidet die Duftstoffe von den weiteren kosmetischen Mitteln; »anderen« macht die deutsche Aufzählung verständlich, ohne eine neue Sachkategorie einzuführen.
