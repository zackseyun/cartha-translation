revisions:
- from: 'Wenn eine junge Frau an der Reihe war, zu König Ahasveros zu gehen, nachdem sie sich zwölf Monate lang der für die Frauen geltenden Behandlung unterzogen hatte – denn so lange dauerte ihre Schönheitspflege: sechs Monate mit Myrrhenöl und sechs Monate mit Duftstoffen und anderen Pflegemitteln für Frauen –,'
  to: 'Wenn eine junge Frau an der Reihe war, zu König Ahasveros zu gehen, nachdem sie zwölf Monate lang gemäß der Vorschrift für die Frauen behandelt worden war – denn so wurde die Zeit ihrer Schönheitspflege vollendet: sechs Monate mit Myrrhenöl und sechs Monate mit Duftstoffen und Pflegemitteln für Frauen –,'
  rationale: Der unbelegte Zusatz „anderen“ wird entfernt und כדת הנשים als Vorschrift kenntlich gemacht. Die offene Syntax des hebräischen Verses und damit der Anschluss an Vers 13 bleiben erhalten.
