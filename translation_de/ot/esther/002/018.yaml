  text: וַ/יַּ֨עַשׂ הַ/מֶּ֜לֶךְ מִשְׁתֶּ֣ה גָד֗וֹל לְ/כָל שָׂרָי/ו֙ וַ/עֲבָדָ֔י/ו אֵ֖ת מִשְׁתֵּ֣ה אֶסְתֵּ֑ר וַ/הֲנָחָ֤ה לַ/מְּדִינוֹת֙ עָשָׂ֔ה וַ/יִּתֵּ֥ן מַשְׂאֵ֖ת כְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/018.yaml
  text: Then the king gave a great banquet for all his officials and servants—the banquet of Esther—and he granted relief to the provinces and gave gifts according to the king’s bounty[a][b].
translation:
  language: de
  text: Dann veranstaltete der König für alle seine Würdenträger und Diener ein großes Festmahl, das Festmahl Esters, gewährte den Provinzen Erleichterung[a] und verteilte Geschenke in königlichem Maß[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er erklärte für die Provinzen einen Feiertag“; oder: „Er gewährte den Provinzen einen Erlass.“ Das hebräische Wort kann Erleichterung, Ruhe oder Erlass bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „gemäß der Hand des Königs“; gemeint ist eine Großzügigkeit oder ein Maß, wie es einem König entspricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁתֶּה גָדוֹל
  choice: ein großes Festmahl
  rationale: מִשְׁתֶּה bezeichnet ein Trinkgelage oder Bankett. „Festmahl“ ist im höfischen Zusammenhang natürlich und würdevoll; גָדוֹל bedeutet „groß“.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: für alle seine Würdenträger und Diener
  rationale: שָׂרִים bezeichnet hier hochrangige Amtsträger beziehungsweise Fürsten; „Würdenträger“ wahrt den höfischen Rang, ohne ein bestimmtes Amt festzulegen. עֲבָדִים wird mit dem lexikalisch offenen „Diener“ wiedergegeben.
- source_word: אֵת מִשְׁתֵּה אֶסְתֵּר
  choice: das Festmahl Esters
  rationale: Die Status-constructus-Verbindung wird formal als „das Festmahl Esters“ wiedergegeben. So bleibt offen, ob es vor allem nach Ester benannt oder ihr zu Ehren veranstaltet wurde.
- source_word: וַהֲנָחָה לַמְּדִינוֹת עָשָׂה
  choice: Er gewährte den Provinzen Erleichterung
  rationale: הֲנָחָה kann Ruhe, Entlastung oder Erlass bezeichnen. „Erleichterung“ erhält diese Bedeutungsbreite, ohne vorschnell einen Steuererlass oder Feiertag festzulegen.
- source_word: מַשְׂאֵת
  choice: Geschenke
  rationale: מַשְׂאֵת bezeichnet hier vom König gewährte Gaben; „Geschenke“ ist verständlich und lässt Art und Umfang offen.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: mit königlicher Freigebigkeit
  rationale: Wörtlich „gemäß der Hand des Königs“; die Wendung bezeichnet eine einem König entsprechende Großzügigkeit oder Größenordnung. Die idiomatische Wiedergabe vermittelt diesen Sinn natürlich.
- source_word: וַיַּעַשׂ
  choice: veranstaltete
  rationale: Das Verb bedeutet grundsätzlich „machen/tun“; bei einem Festmahl entspricht „veranstalten“ dem deutschen Sprachgebrauch.
