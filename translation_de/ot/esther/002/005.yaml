base_translation:
  language: en
  yaml_path: translation/ot/esther/002/005.yaml
  text: There was a Jewish man in Susa the citadel[a], and his name was Mordecai son of Jair, son of Shimei, son of Kish[c][b], a Benjaminite.
translation:
  language: de
  text: In der Burg Susa war ein jüdischer Mann[a], dessen Name Mordechai war, ein Sohn Jaïrs, eines Sohnes Schimis, eines Sohnes Kischs[b], ein Benjaminiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein judäischer Mann“.'
    reason: lexical_alternative
  - marker: b
    text: „Sohn“ kann in genealogischen Angaben auch einen entfernteren Nachkommen bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ יְהוּדִי
  choice: ein jüdischer Mann
  rationale: יְהוּדִי kann einen Juden oder einen Judäer bezeichnen. Im persischen Diasporakontext bringt „jüdisch“ die Zugehörigkeit zum jüdischen Volk im heutigen Deutsch am klarsten zum Ausdruck.
- source_word: הָיָה
  choice: lebte
  rationale: Das Verb führt hier eine Person in die Erzählung ein. „Lebte“ ist eine natürliche deutsche Wiedergabe der hebräischen Existenzkonstruktion, ohne eine über das Wohnen hinausgehende Aussage hinzuzufügen.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: in der Residenz Susa
  rationale: הַבִּירָה bezeichnet hier die befestigte königliche Residenz beziehungsweise den Regierungssitz. „Residenz Susa“ gibt die Funktion idiomatisch wieder und wahrt die appositionale Zuordnung zu Susa.
- source_word: וּשְׁמוֹ מָרְדֳּכַי
  choice: namens Mordechai
  rationale: Die knappe deutsche Formulierung gibt die Namensangabe natürlich und vollständig wieder; der Personenname folgt der etablierten deutschen biblischen Schreibweise.
- source_word: בֶּן יָאִיר בֶּן שִׁמְעִי בֶּן קִישׁ
  choice: der Sohn Jaïrs, des Sohnes Schimis, des Sohnes Kischs
  rationale: בֶּן wird formal als „Sohn“ wiedergegeben. Da genealogische Angaben auch entferntere Vorfahren nennen können, wird diese Möglichkeit in einer Fußnote offengehalten.
- source_word: אִישׁ יְמִינִי
  choice: gehörte zum Stamm Benjamin
  rationale: Die Wendung bezeichnet die Stammeszugehörigkeit. Die ausgeschriebene Form ist im modernen Deutsch klarer und natürlicher als „Benjaminiter“.
