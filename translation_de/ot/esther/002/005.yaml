revisions:
- from: In der Residenz Susa lebte ein jüdischer Mann[a] namens Mordechai. Er war der Sohn Jaïrs, des Sohnes Schimis, des Sohnes Kischs[b], und gehörte zum Stamm Benjamin.
  to: In der Burg Susa war ein jüdischer Mann[a], dessen Name Mordechai war, ein Sohn Jaïrs, eines Sohnes Schimis, eines Sohnes Kischs[b], ein Benjaminiter.
  rationale: Die Überarbeitung stellt den Ortsausdruck als „Burg Susa“ wieder her, ohne die genaue Ausdehnung des persischen Burgbezirks zu überbestimmen. Sie gibt die einführende Existenzkonstruktion mit „war“ wieder und erhält die genealogische Reihung sowie die Schlussbezeichnung als Benjaminiter. Die Fußnoten bleiben an ihren sachlich einschlägigen Stellen und bewahren die lexikalische beziehungsweise genealogische Offenheit.
