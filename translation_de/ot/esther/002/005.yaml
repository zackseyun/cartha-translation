  source_fidelity: 'Die wesentlichen Angaben sind korrekt wiedergegeben: Mordechai wird als jüdischer Mann, als Nachkomme von Jair, Schimi und Kisch sowie als Angehöriger Benjamins eingeführt. „Lebte“ ist als erzählerische Einführung möglich, gibt das bloße hebräische Existenzverb jedoch etwas enger wieder. Vor allem bezeichnet הַבִּירָה eine Burg bzw. Zitadelle; „Residenz“ hebt zwar den königlichen Charakter hervor, lässt den befestigten Charakter aber zurücktreten.'
  naturalness: Der Entwurf ist gut verständlich und idiomatisch. „In der Burg Susa“ ist im modernen Standarddeutsch ebenso natürlich und zugleich näher am appositionellen hebräischen Ortsausdruck. Die direkte Bezeichnung „ein Benjaminiter“ ist knapp, geläufig und bildet die Schlussapposition angemessener ab.
  terminology: „jüdischer Mann“ ist im Diasporakontext eine geeignete Hauptwiedergabe von אִישׁ יְהוּדִי; die Alternative „judäisch“ sollte als mögliche, aber kontextuell weniger naheliegende Lesart in der Fußnote bleiben. Die Namen werden in gebräuchlicher deutscher Bibelschreibung als Mordechai, Jair, Schimi und Kisch wiedergegeben. „Benjaminiter“ bewahrt die Stammesbezeichnung ohne zusätzliche Umschreibung.
  issues:
