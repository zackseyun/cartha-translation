base_translation:
  language: en
  yaml_path: translation/ot/esther/002/011.yaml
  text: And every single day Mordecai would walk back and forth in front of the courtyard of the women’s house, to learn how Esther was doing and what would be done with her.
translation:
  language: de
  text: Und Tag für Tag ging Mordechai vor dem Hof des Frauenhauses auf und ab, um zu erfahren, wie es Ester ging und was mit ihr geschehen würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל־יוֹם וָיוֹם
  choice: Und Tag für Tag
  rationale: Die hebräische Wiederholung betont die ausnahmslose Regelmäßigkeit; die deutsche Wendung gibt diese Betonung natürlich und würdig wieder.
- source_word: מִתְהַלֵּךְ
  choice: ging ... auf und ab
  rationale: Die iterative Verbform beschreibt wiederholtes Umhergehen; „auf und ab gehen“ passt zum Warten und Beobachten vor dem Hof.
- source_word: בֵּית הַנָּשִׁים
  choice: Frauenhaus
  rationale: Wörtliche, im Kontext des königlichen Harems verständliche Wiedergabe, ohne eine moderne institutionelle Bedeutung in den Text einzutragen.
- source_word: לָדַעַת אֶת־שְׁלוֹם אֶסְתֵּר
  choice: um zu erfahren, wie es Ester ging
  rationale: Das hebräische Idiom fragt nach Esters Wohlergehen; idiomatisches modernes Deutsch vermittelt den Sinn klar.
- source_word: וּמַה־יֵּעָשֶׂה בָּהּ
  choice: und was mit ihr geschehen würde
  rationale: Bewahrt das Passiv und die Offenheit darüber, welche Behandlung oder welches Schicksal Ester erwartete.
